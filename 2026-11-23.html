9\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u7ed3\u5408\u4efb\u52a1\u77e5\u8bc6\u4e0e\u73b0\u6709\u6743\u91cd\uff0c\u7f16\u5199\u76f4\u63a5\u8bfb\u53d6\u3001\u6784\u9020\u6216\u4fee\u6539\u6743\u91cd\u7684\u7a0b\u5e8f\u3002\u65b0\u589e\u8ba1\u7b97\u5b89\u88c5\u540e\u72ec\u7acb\u8fd0\u884c\uff0c\u65e0\u9700\u68af\u5ea6\u8bad\u7ec3\u6216\u7ee7\u7eed\u8c03\u7528\u8bed\u8a00\u6a21\u578b\u3002", "why_notable": "\u5b83\u5c06\u80fd\u529b\u6269\u5c55\u4ece\u68af\u5ea6\u8bad\u7ec3\u8f6c\u5411\u53ef\u590d\u7528\u7684\u6743\u91cd\u7a0b\u5e8f\uff0c\u5e76\u5c55\u793a\u4fdd\u7559\u539f\u80fd\u529b\u3001\u8de8\u7f51\u7edc\u8fc1\u79fb\u53ca\u53e0\u52a0\u65b0\u80fd\u529b\u7684\u6f5c\u529b\u3002"}, {"abstract": "Frontier multimodal language agents such as GPT-6 Astra have demonstrated strong capabilities in controlling robots directly via low-level numerical actions without high-level primitives. However, existing benchmarks report only episode-level success rates, which show neither how these agents succeed nor where they fail. In this paper, we present a systematic action-level analysis of frontier agents on direct robot control across 12 manipulation benchmarks. We introduce AgentRoboCritic, an intent-grounded critique framework in which the policy agent states a local intent alongside each action, and a critic evaluates the action\u0027s outcome and failure mode against this intent. Our action-level analysis demonstrates the promising capabilities of frontier agents on direct robot control, including closed-loop recovery from local execution failures, reliable semantic grounding across diverse scenes, and strong zero-shot manipulation without task-specific adaptation. It also identifies their current limitations, including task-relevant physical execution bottlenecks such as grasping and alignment, and uneven recovery across failure modes. Finally, we validate our critic on a 400-action human-annotated benchmark and release a dataset of 12,844 annotated actions alongside a fine-tuned open-source critic, Muse-Glimmer-30B, whose failure-mode accuracy rises from 32.58% to 74.24%, enabling low-cost action-level analysis.", "arxiv_id": "2611.26613", "arxiv_url": "https://arxiv.org/abs/2611.26613", "authors": ["Yiyang Du", "Yuxuan Kuang", "Qitao Zhao", "Yixuan Wang", "Zhanqiu Guo", "Yi Xu", "Xin Li", "Wenbin He", "Liu Ren", "Chenyan Xiong"], "brief": "\u63d0\u51fa\u610f\u56fe\u9a71\u52a8\u7684\u52a8\u4f5c\u8bc4\u6790\u6846\u67b6\uff0c\u8ba9\u7b56\u7565\u667a\u80fd\u4f53\u4e3a\u6bcf\u6b65\u52a8\u4f5c\u58f0\u660e\u5c40\u90e8\u610f\u56fe\uff0c\u518d\u7531\u8bc4\u4f30\u5668\u5bf9\u7167\u5b9e\u9645\u7ed3\u679c\u5224\u65ad\u6210\u8d25\u4e0e\u5931\u8bef\u7c7b\u578b\uff0c\u5e76\u7528\u4e8e\u5206\u6790\u5341\u4e8c\u9879\u64cd\u4f5c\u57fa\u51c6\u3002", "categories": ["cs.RO", "cs.CL", "cs.CV"], "github_repo": "https://github.com/cxcscmu/AgentRoboCritic", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.26613", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d612\u9879\u64cd\u4f5c\u57fa\u51c6\uff0c\u53d1\u73b0\u6293\u53d6\u3001\u5bf9\u9f50\u53ca\u6062\u590d\u74f6\u9888", "\u4ee5400\u4e2a\u4eba\u5de5\u6807\u6ce8\u52a8\u4f5c\u9a8c\u8bc1\u8bc4\u4f30\u5668\uff0c\u53d1\u5e0312,844\u6761\u6807\u6ce8", "Muse-Glimmer-30B\u5931\u8bef\u5206\u7c7b\u51c6\u786e\u7387\u4ece32.58%\u5347\u81f374.24%"], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u52a8\u4f5c\u8bc4\u4f30", "\u5931\u8bef\u8bca\u65ad"], "num_comments": 2, "on_hf": true, "organization": "Chenyan Xiong Research Group at CMU", "pdf_url": "https://arxiv.org/pdf/2611.26613v1", "published_at": "2026-11-19", "score": 0.5, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.26613.png", "title": "AgentRoboCritic: Understanding the Capability of Frontier Agents on Direct Robot Control", "tldr": "\u901a\u8fc7\u610f\u56fe\u5bf9\u7167\u9010\u52a8\u4f5c\u8bc4\u4f30\uff0c\u63ed\u793a\u524d\u6cbf\u667a\u80fd\u4f53\u76f4\u63a5\u63a7\u673a\u5668\u4eba\u7684\u80fd\u529b\u4e0e\u6267\u884c\u74f6\u9888\u3002", "upvotes": 7, "what_it_is": "\u63d0\u51fa\u610f\u56fe\u9a71\u52a8\u7684\u52a8\u4f5c\u8bc4\u6790\u6846\u67b6\uff0c\u8ba9\u7b56\u7565\u667a\u80fd\u4f53\u4e3a\u6bcf\u6b65\u52a8\u4f5c\u58f0\u660e\u5c40\u90e8\u610f\u56fe\uff0c\u518d\u7531\u8bc4\u4f30\u5668\u5bf9\u7167\u5b9e\u9645\u7ed3\u679c\u5224\u65ad\u6210\u8d25\u4e0e\u5931\u8bef\u7c7b\u578b\uff0c\u5e76\u7528\u4e8e\u5206\u6790\u5341\u4e8c\u9879\u64cd\u4f5c\u57fa\u51c6\u3002", "why_notable": "\u5c06\u6574\u56de\u5408\u6210\u529f\u7387\u7ec6\u5316\u4e3a\u53ef\u5b9a\u4f4d\u7684\u52a8\u4f5c\u7ea7\u8bca\u65ad\uff0c\u533a\u5206\u8bed\u4e49\u7406\u89e3\u4e0e\u7269\u7406\u6267\u884c\u95ee\u9898\uff1b\u5f00\u6e90\u8bc4\u4f30\u5668\u548c\u6807\u6ce8\u6570\u636e\u964d\u4f4e\u4e86\u540e\u7eed\u5206\u6790\u6210\u672c\u3002"}, {"abstract": "For more than half a century, video games have pursued better graphics, more natural interaction, and more engaging gameplay. Generative video models (VMs) now bear on all three. Neural networks already draw most of the pixels in shipped games, and recent world models let a lightweight game engine keep the world state while a VM turns the engine\u0027s coarse proxy video into final frames. These systems, however, treat the VM as a renderer that only restyles motion the engine has already authored, which leaves most of its generative capacity unused and limits the diversity a game can offer. We present GameWM, a design for next-generation games built on a clear division of labor. The GameWM-engine keeps what must be exact: rules, state, camera, and the layout of the world, which also spares the video model from having to remember it. The GameWM-VM generates what is expensive to author by hand: the look of the world and the detail of the player\u0027s interactions. One game mechanic can then be realized in many visually and physically distinct ways, while its outcome stays exactly as the engine computed it. To realize this division of labor, we build GameWM as a complete system: a data engine centered on interactions rather than exploration, an interface through which authored character sheets, scene art, and skill descriptions enter the model, and a model family from 5B to 33B parameters with a real-time causal variant for play. Together they give every player a fresh version of the same game: each player\u0027s own character, world, and skills turn the same engine mechanics into a new experience, while every event keeps the timing and outcome the GameWM-engine computed.", "arxiv_id": "2611.19247", "arxiv_url": "https://arxiv.org/abs/2611.19247", "authors": ["Bing He", "Runze Wang", "Fei Zha", "Zhongyuan Wu", "Ke Xu", "Tao Zhuang", "Yuxuan Xie", "Zhongyuan Liu"], "brief": "GameWM\u5c06\u89c4\u5219\u3001\u72b6\u6001\u3001\u76f8\u673a\u548c\u5e03\u5c40\u4ea4\u7ed9\u6e38\u620f\u5f15\u64ce\uff0c\u628a\u89c6\u89c9\u4e0e\u4ea4\u4e92\u7ec6\u8282\u4ea4\u7ed9\u89c6\u9891\u6a21\u578b\u3002\u7cfb\u7edf\u7ed3\u5408\u4ea4\u4e92\u6570\u636e\u5f15\u64ce\u3001\u521b\u4f5c\u7d20\u6750\u63a5\u53e3\u53ca\u5b9e\u65f6\u56e0\u679c\u6a21\u578b\uff0c\u652f\u6301\u4e2a\u6027\u5316\u6e38\u620f\u4f53\u9a8c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/hebing-sjtu/GameWM", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.19247", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5f15\u64ce\u56fa\u5b9a\u4e8b\u4ef6\u65f6\u5e8f\u4e0e\u7ed3\u679c\uff0c\u89c6\u9891\u6a21\u578b\u751f\u6210\u4ea4\u4e92\u7ec6\u8282", "\u4ee5\u4ea4\u4e92\u4e3a\u4e2d\u5fc3\u6784\u5efa\u6570\u636e\uff0c\u63a5\u5165\u89d2\u8272\u3001\u573a\u666f\u4e0e\u6280\u80fd\u7d20\u6750", "\u6a21\u578b\u89c4\u6a21\u8986\u76d65B\u81f333B\uff0c\u5305\u542b\u5b9e\u65f6\u56e0\u679c\u53d8\u4f53"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6e38\u620f\u5f15\u64ce", "\u4ea4\u4e92\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2611.19247v2", "published_at": "2026-11-14", "score": 0.484, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19247.png", "title": "GameWM: Toward Next-Generation Video Games with Interaction-Centric World Models", "tldr": "\u901a\u8fc7\u6e38\u620f\u5f15\u64ce\u4e0e\u89c6\u9891\u6a21\u578b\u5206\u5de5\uff0c\u5728\u7cbe\u786e\u89c4\u5219\u4e0b\u751f\u6210\u591a\u6837\u5316\u4e16\u754c\u4e0e\u4ea4\u4e92\u7ec6\u8282\u3002", "upvotes": 3, "what_it_is": "GameWM\u5c06\u89c4\u5219\u3001\u72b6\u6001\u3001\u76f8\u673a\u548c\u5e03\u5c40\u4ea4\u7ed9\u6e38\u620f\u5f15\u64ce\uff0c\u628a\u89c6\u89c9\u4e0e\u4ea4\u4e92\u7ec6\u8282\u4ea4\u7ed9\u89c6\u9891\u6a21\u578b\u3002\u7cfb\u7edf\u7ed3\u5408\u4ea4\u4e92\u6570\u636e\u5f15\u64ce\u3001\u521b\u4f5c\u7d20\u6750\u63a5\u53e3\u53ca\u5b9e\u65f6\u56e0\u679c\u6a21\u578b\uff0c\u652f\u6301\u4e2a\u6027\u5316\u6e38\u620f\u4f53\u9a8c\u3002", "why_notable": "\u8ba9\u89c6\u9891\u6a21\u578b\u4e0d\u518d\u53ea\u4e3a\u5f15\u64ce\u753b\u9762\u6362\u76ae\uff0c\u800c\u80fd\u4e30\u5bcc\u540c\u4e00\u673a\u5236\u7684\u8868\u73b0\u5f62\u5f0f\uff0c\u6709\u671b\u517c\u987e\u6e38\u620f\u7ed3\u679c\u7684\u786e\u5b9a\u6027\u4e0e\u4e2a\u6027\u5316\u5185\u5bb9\u751f\u6210\u3002"}, {"abstract": "Frontier language models can now read and edit the weights of a neural network much like code and thereby improve a small model, an approach known as Weight-Space Programming (WSP). We further explore applying WSP to a language model itself, which we call Self-WSP. Specifically, Qwen3.5-0.8B reads its own weights, proposes an edit, and then continues with the edited weights as both problem solver and editor. We find many cases of genuine self-improvement. Self-edits can raise GSM8K accuracy from 11.8% to 62.2% and MATH500 accuracy from 7.0% to 32.2%, sometimes by changing only 16 parameters, and in some cases repeated self-editing keeps improving the model. A closer look, however, reveals that these gains lack interpretability. The model shows little understanding of the edits it makes, and WSP driven by random search sometimes performs comparably. Self-WSP thus holds promise as a path toward recursive self-improvement (RSI), but realizing this promise requires further exploration.", "arxiv_id": "2611.28833", "arxiv_url": "https://arxiv.org/abs/2611.28833", "authors": ["Guoming Ling", "Shanshan Zhong", "Kaixuan Zhang", "Zhongzhan Huang"], "brief": "\u7814\u7a76\u8ba9Qwen3.5-0.8B\u8bfb\u53d6\u5e76\u4fee\u6539\u81ea\u8eab\u6743\u91cd\uff0c\u518d\u4ee5\u4fee\u6539\u540e\u7684\u6a21\u578b\u7ee7\u7eed\u89e3\u9898\u548c\u7f16\u8f91\uff0c\u63a2\u7d22Self-WSP\u80fd\u5426\u5b9e\u73b0\u6301\u7eed\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28833", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GSM8K\u51c6\u786e\u7387\u4ece11.8%\u5347\u81f362.2%", "MATH500\u51c6\u786e\u7387\u4ece7.0%\u5347\u81f332.2%", "\u90e8\u5206\u81ea\u7f16\u8f91\u4ec5\u653916\u4e2a\u53c2\u6570\uff0c\u968f\u673a\u641c\u7d22\u6709\u65f6\u6548\u679c\u76f8\u5f53"], "keywords": ["\u6743\u91cd\u7f16\u8f91", "\u81ea\u6211\u6539\u8fdb", "\u6570\u5b66\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2611.28833v1", "published_at": "2026-11-21", "score": 0.476, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28833.png", "title": "Self-WSP: Can Language Models Improve Themselves Through Weight-Space Programming?", "tldr": "\u5c0f\u578b\u8bed\u8a00\u6a21\u578b\u53ef\u901a\u8fc7\u7f16\u8f91\u81ea\u8eab\u6743\u91cd\u63d0\u5347\u6570\u5b66\u80fd\u529b\uff0c\u4f46\u6536\u76ca\u672a\u5fc5\u6e90\u4e8e\u7406\u89e3\u3002", "upvotes": 5, "what_it_is": "\u7814\u7a76\u8ba9Qwen3.5-0.8B\u8bfb\u53d6\u5e76\u4fee\u6539\u81ea\u8eab\u6743\u91cd\uff0c\u518d\u4ee5\u4fee\u6539\u540e\u7684\u6a21\u578b\u7ee7\u7eed\u89e3\u9898\u548c\u7f16\u8f91\uff0c\u63a2\u7d22Self-WSP\u80fd\u5426\u5b9e\u73b0\u6301\u7eed\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u76f4\u63a5\u6539\u5199\u6743\u91cd\u5b9e\u73b0\u81ea\u6211\u63d0\u5347\u7684\u6f5c\u529b\uff0c\u4f46\u6a21\u578b\u5bf9\u4fee\u6539\u7f3a\u4e4f\u7406\u89e3\uff0c\u8bf4\u660e\u80fd\u529b\u589e\u76ca\u4e0d\u80fd\u76f4\u63a5\u89c6\u4e3a\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u80fd\u529b\u3002"}, {"abstract": "We present the Autoregressive View Model (AVM), which generates a scene as a stream of views without constructing an explicit 3D representation. Through a unified in-context interface, AVM conditions on images or videos to generate short clips along a requested camera path. Visual context grounds reconstruction and interpolation, while a learned prior enables extrapolation into unseen regions. AVM retrieves relevant views from inputs and generated history to form a bounded active context. We fine-tune a pretrained bidirectional video diffusion transformer with flow matching in an N-in-1-out formulation. We then tune a causal model on its own rollouts to improve photorealism, reduce denoising steps, and limit long-horizon drift. We scale training to approximately 8M scenes and video clips. We evaluate generation capacity and scene persistence across benchmarks for camera control, text control, visual quality, dynamics, sparse and 4D reconstruction, and long-horizon consistency. The results demonstrate that AVM adapts to diverse input and output settings through one in-context interface.", "arxiv_id": "2611.23417", "arxiv_url": "https://arxiv.org/abs/2611.23417", "authors": ["Jensen", "Zhou", "Samuel Rota Bulo", "Denis Rozumny", "Duncan Zauss", "Peter Hedman", "Nikhil Keetha", "Philip Torr", "Christian Rupprecht", "Andrea Vedaldi", "Peter Kontschieder"], "brief": "AVM\u4ee5\u56fe\u50cf\u6216\u89c6\u9891\u4e3a\u6761\u4ef6\uff0c\u6cbf\u6307\u5b9a\u76f8\u673a\u8def\u5f84\u751f\u6210\u77ed\u7247\uff0c\u5e76\u68c0\u7d22\u8f93\u5165\u53ca\u751f\u6210\u5386\u53f2\u4e2d\u7684\u76f8\u5173\u89c6\u56fe\u3002\u6a21\u578b\u901a\u8fc7\u6d41\u5339\u914d\u5fae\u8c03\u89c6\u9891\u6269\u6563\u6a21\u578b\uff0c\u518d\u7528\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u8bad\u7ec3\u56e0\u679c\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23417", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528N\u8f93\u5165\u30011\u8f93\u51fa\u7684\u6d41\u5339\u914d\u8bad\u7ec3\u65b9\u6848", "\u68c0\u7d22\u76f8\u5173\u89c6\u56fe\uff0c\u7ef4\u6301\u6709\u754c\u6d3b\u8dc3\u4e0a\u4e0b\u6587", "\u8bad\u7ec3\u89c4\u6a21\u7ea6800\u4e07\u573a\u666f\u4e0e\u89c6\u9891\u7247\u6bb5"], "keywords": ["\u65b0\u89c6\u89d2\u751f\u6210", "\u89c6\u9891\u6269\u6563\u6a21\u578b", "\u4e09\u7ef4\u91cd\u5efa", "\u81ea\u56de\u5f52\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2611.23417v2", "published_at": "2026-11-17", "score": 0.475, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23417.png", "title": "Autoregressive View Model", "tldr": "\u65e0\u9700\u663e\u5f0f\u4e09\u7ef4\u8868\u793a\uff0c\u4ee5\u81ea\u56de\u5f52\u89c6\u56fe\u751f\u6210\u7edf\u4e00\u5904\u7406\u573a\u666f\u91cd\u5efa\u4e0e\u65b0\u89c6\u89d2\u5916\u63a8\u3002", "upvotes": 1, "what_it_is": "AVM\u4ee5\u56fe\u50cf\u6216\u89c6\u9891\u4e3a\u6761\u4ef6\uff0c\u6cbf\u6307\u5b9a\u76f8\u673a\u8def\u5f84\u751f\u6210\u77ed\u7247\uff0c\u5e76\u68c0\u7d22\u8f93\u5165\u53ca\u751f\u6210\u5386\u53f2\u4e2d\u7684\u76f8\u5173\u89c6\u56fe\u3002\u6a21\u578b\u901a\u8fc7\u6d41\u5339\u914d\u5fae\u8c03\u89c6\u9891\u6269\u6563\u6a21\u578b\uff0c\u518d\u7528\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u8bad\u7ec3\u56e0\u679c\u6a21\u578b\u3002", "why_notable": "\u5c06\u91cd\u5efa\u3001\u63d2\u503c\u548c\u672a\u89c1\u533a\u57df\u5916\u63a8\u7eb3\u5165\u540c\u4e00\u63a5\u53e3\uff0c\u7ed5\u5f00\u663e\u5f0f\u4e09\u7ef4\u5efa\u6a21\uff1b\u81ea\u8eab\u751f\u6210\u8f68\u8ff9\u8bad\u7ec3\u6709\u52a9\u4e8e\u51cf\u5c11\u53bb\u566a\u6b65\u6570\u4e0e\u957f\u671f\u6f02\u79fb\u3002"}, {"abstract": "Identity matching asks whether two records denote the same identity, yet the answer depends on the target granularity. Two records may match at the base level but not at the variant level: they share an underlying design while differing in attributes such as color or size. Final matching accuracy does not separately characterize the capabilities involved. To study this problem, we use e-commerce as a challenging real-world domain. We introduce PURE, a diagnostic benchmark for multi-granularity multimodal identity matching covering four capability dimensions: Perception, Understanding, Reasoning, and Evidence-grounded Judgment. The benchmark comprises 1,457 multiple-choice questions across 14 tasks, derived from real-world matching pairs and verified by two domain experts. Across ten recent MLLMs, overall scores range from 47.1% to 86.0%. Understanding receives the highest mean score and Judgment the lowest, with weaknesses in visual difference localization and variant-level rule judgment. Modality ablations show that models benefit from multimodal evidence but can incorrectly identify conflicts between matching records. In direct matching, most models recognize matching pairs more reliably than non-matching pairs at the base level, whereas the reverse holds at the variant level. PURE therefore reveals what aggregate matching accuracy hides: not only whether models judge a pair correctly, but where they struggle to interpret evidence and apply matching criteria.", "arxiv_id": "2611.22343", "arxiv_url": "https://arxiv.org/abs/2611.22343", "authors": ["Hengyu You", "Xintong Wang", "Jin Cao", "Liang Ding"], "brief": "PURE\u5c06\u7535\u5546\u8bb0\u5f55\u7684\u8eab\u4efd\u5339\u914d\u62c6\u4e3a\u611f\u77e5\u3001\u7406\u89e3\u3001\u63a8\u7406\u548c\u8bc1\u636e\u652f\u6491\u5224\u65ad\u56db\u7ef4\u80fd\u529b\uff0c\u533a\u5206\u57fa\u7840\u4e0e\u53d8\u4f53\u7c92\u5ea6\uff0c\u4ee5\u4e13\u5bb6\u6838\u9a8c\u7684\u591a\u9009\u9898\u5b9a\u4f4d\u6a21\u578b\u5931\u8bef\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/alibaba-multimodal-industrial-ai/PURE", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.22343", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u542b1457\u9053\u591a\u9009\u9898\u300114\u9879\u4efb\u52a1\uff0c\u7531\u4e24\u4f4d\u9886\u57df\u4e13\u5bb6\u6838\u9a8c", "\u8bc4\u6d4b10\u4e2a\u591a\u6a21\u6001\u5927\u6a21\u578b\uff0c\u603b\u520647.1%\u81f386.0%", "\u6a21\u6001\u6d88\u878d\u663e\u793a\u591a\u6a21\u6001\u8bc1\u636e\u6709\u76ca\uff0c\u4f46\u6a21\u578b\u4f1a\u8bef\u5224\u5339\u914d\u8bb0\u5f55\u5b58\u5728\u51b2\u7a81"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u8eab\u4efd\u5339\u914d", "\u8bca\u65ad\u8bc4\u6d4b", "\u7535\u5b50\u5546\u52a1"], "num_comments": 2, "on_hf": true, "organization": "Alibaba multimodal \u0026 industrial AI", "pdf_url": "https://arxiv.org/pdf/2611.22343v1", "published_at": "2026-11-17", "score": 0.457, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22343.png", "title": "PURE: A Diagnostic Benchmark for Multi-Granularity Multimodal Identity Matching", "tldr": "\u7528\u7535\u5546\u591a\u7c92\u5ea6\u8eab\u4efd\u5339\u914d\u8bca\u65ad\u591a\u6a21\u6001\u6a21\u578b\uff0c\u63ed\u793a\u8bc1\u636e\u5224\u65ad\u4e0e\u53d8\u4f53\u8bc6\u522b\u77ed\u677f\u3002", "upvotes": 6, "what_it_is": "PURE\u5c06\u7535\u5546\u8bb0\u5f55\u7684\u8eab\u4efd\u5339\u914d\u62c6\u4e3a\u611f\u77e5\u3001\u7406\u89e3\u3001\u63a8\u7406\u548c\u8bc1\u636e\u652f\u6491\u5224\u65ad\u56db\u7ef4\u80fd\u529b\uff0c\u533a\u5206\u57fa\u7840\u4e0e\u53d8\u4f53\u7c92\u5ea6\uff0c\u4ee5\u4e13\u5bb6\u6838\u9a8c\u7684\u591a\u9009\u9898\u5b9a\u4f4d\u6a21\u578b\u5931\u8bef\u3002", "why_notable": "\u5b83\u5c06\u603b\u4f53\u5339\u914d\u51c6\u786e\u7387\u62c6\u6210\u53ef\u5b9a\u4f4d\u7684\u80fd\u529b\u7f3a\u53e3\uff0c\u63ed\u793a\u89c6\u89c9\u5dee\u5f02\u5b9a\u4f4d\u548c\u53d8\u4f53\u89c4\u5219\u5224\u65ad\u5f31\u70b9\uff0c\u4e3a\u6a21\u578b\u6539\u8fdb\u63d0\u4f9b\u66f4\u5177\u4f53\u7684\u8bc4\u6d4b\u4f9d\u636e\u3002"}, {"abstract": "Coding agents built on large language models (LLMs) now help develop many models published as general solutions. Should generality instead reside in the agent that builds a model for each new task? We examine this question in prognostics and health management (PHM), where every model must work on unseen equipment. Our deployment-style benchmark, NextUnit-Bench, covers 24 public datasets split into 58 folds that hold out units or operating conditions; each agent has two hours to deliver an executable predictor, then run on the hidden units. First, frontier agents outperform AutoML, which reaches less than half the best agent\u0027s score, and faithful implementations of published methods on four datasets, of which only 6 of 30 beat the strongest agent\u0027s own design; published accuracies, where reproducible, rest on the papers\u0027 own conventions, and a single convention, capping the remaining life of test engines, can halve the reported error. Second, the agents\u0027 advantage is a design made on each machine\u0027s data; once made, a plain-text plan of a few hundred words carries most of the gap between two frontier agents, and given a weaker agent\u0027s plan, the strongest agent falls to that agent\u0027s level, often to identical predictions. Before touching the data, however, it matters little whose plan an agent carries out, and domain toolkits appear to help neither: what sets the strongest apart is how much it learns from the data. Third, such designs reach only implementers that can execute them: given the strongest agent\u0027s designs, a locally deployable open-weight model delivers half as often, even when they are lightened, and scores no higher than without them. Generality, we argue, is not disappearing but moving, from the model to the modeler.", "arxiv_id": "2611.25252", "arxiv_url": "https://arxiv.org/abs/2611.25252", "authors": ["Zhenling Chen", "Zhiguo Zeng", "Anne Barros"], "brief": "\u7814\u7a76\u6784\u5efa\u9762\u5411\u672a\u89c1\u8bbe\u5907\u7684\u90e8\u7f72\u5f0f\u57fa\u51c6\uff0c\u8ba9\u5927\u6a21\u578b\u7f16\u7801\u667a\u80fd\u4f53\u9650\u65f6\u4ea4\u4ed8\u9884\u6d4b\u5668\u3002\u901a\u8fc7\u4ea4\u6362\u8bbe\u8ba1\u65b9\u6848\u3001\u6bd4\u8f83\u6267\u884c\u80fd\u529b\uff0c\u5206\u6790\u4f18\u52bf\u6765\u81ea\u6570\u636e\u9a71\u52a8\u7684\u8bbe\u8ba1\u8fd8\u662f\u4ee3\u7801\u5b9e\u73b0\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/JialingRichard/nextunit-bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.25252", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["NextUnit-Bench\u542b24\u4e2a\u6570\u636e\u96c6\u300158\u6298\uff0c\u9650\u65f62\u5c0f\u65f6", "AutoML\u5f97\u5206\u4e0d\u8db3\u6700\u5f3a\u667a\u80fd\u4f53\u4e00\u534a\uff1b30\u4e2a\u8bba\u6587\u5b9e\u73b0\u4ec56\u4e2a\u80dc\u51fa", "\u6570\u767e\u5b57\u65b9\u6848\u4f20\u9012\u591a\u6570\u6027\u80fd\u5dee\u8ddd\uff0c\u5f00\u653e\u6743\u91cd\u6a21\u578b\u4ea4\u4ed8\u7387\u51cf\u534a"], "keywords": ["\u5927\u6a21\u578b\u667a\u80fd\u4f53", "\u81ea\u52a8\u5efa\u6a21", "\u9884\u6d4b\u6027\u7ef4\u62a4", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.25252v1", "published_at": "2026-11-18", "score": 0.408, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25252.png", "title": "Moving Generality from Model to Modeler: LLM Agents for PHM on a Deployment-Style Benchmark", "tldr": "\u8bbe\u5907\u5065\u5eb7\u9884\u6d4b\u5b9e\u9a8c\u8868\u660e\uff0c\u901a\u7528\u80fd\u529b\u53ef\u80fd\u6765\u81ea\u6309\u4efb\u52a1\u8bbe\u8ba1\u6a21\u578b\u7684\u667a\u80fd\u4f53\uff0c\u800c\u975e\u56fa\u5b9a\u6a21\u578b\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u6784\u5efa\u9762\u5411\u672a\u89c1\u8bbe\u5907\u7684\u90e8\u7f72\u5f0f\u57fa\u51c6\uff0c\u8ba9\u5927\u6a21\u578b\u7f16\u7801\u667a\u80fd\u4f53\u9650\u65f6\u4ea4\u4ed8\u9884\u6d4b\u5668\u3002\u901a\u8fc7\u4ea4\u6362\u8bbe\u8ba1\u65b9\u6848\u3001\u6bd4\u8f83\u6267\u884c\u80fd\u529b\uff0c\u5206\u6790\u4f18\u52bf\u6765\u81ea\u6570\u636e\u9a71\u52a8\u7684\u8bbe\u8ba1\u8fd8\u662f\u4ee3\u7801\u5b9e\u73b0\u3002", "why_notable": "\u5c06\u6cdb\u5316\u80fd\u529b\u7684\u8bc4\u4f30\u5bf9\u8c61\u4ece\u56fa\u5b9a\u6a21\u578b\u8f6c\u5411\u5efa\u6a21\u667a\u80fd\u4f53\uff0c\u5e76\u533a\u5206\u6570\u636e\u9a71\u52a8\u8bbe\u8ba1\u4e0e\u6267\u884c\u80fd\u529b\uff0c\u4e3a\u81ea\u52a8\u5efa\u6a21\u7684\u90e8\u7f72\u8bc4\u6d4b\u63d0\u4f9b\u65b0\u89c6\u89d2\u3002"}, {"abstract": "AI-driven game development holds the potential to transform diverse human inspirations into interactive experiences. However, existing systems and benchmarks primarily focus on explicit development specifications, with limited support for adapting multimodal references and evaluating actual gameplay experiences. We introduce GameAnything, an open-source agentic platform that transforms multimodal inspirations into playable extensions of existing games through iterative development. GameAnything integrates coding agents with an independent playtesting critic, persistent development state, and reusable experience memory to support continuous refinement. We further present GameAnything-Bench, a benchmark spanning diverse reference modalities, game creation objectives, and gaming environments, with exploratory gameplay testing to assess both functional correctness and gameplay quality. Evaluations of nine coding agent configurations reveal that current agents can adapt reference content but still struggle with playable interactions and precise modifications. Moreover, multimodal references improve content fidelity, while iterative refinement yields substantial but varying improvements across agents. These findings highlight both the potential and remaining challenges of inspiration-driven game development.", "arxiv_id": "2611.29238", "arxiv_url": "https://arxiv.org/abs/2611.29238", "authors": ["Wenyi Wu", "Siqi Liu", "Yuru Feng", "Zixuan Song", "Aayush Salvi", "Sibo Zhu", "Kun Zhou", "Biwei Huang"], "brief": "GameAnything\u662f\u5f00\u6e90\u667a\u80fd\u4f53\u5e73\u53f0\uff0c\u9762\u5411\u73b0\u6709\u6e38\u620f\u751f\u6210\u53ef\u73a9\u6269\u5c55\u3002\u5b83\u7ed3\u5408\u7f16\u7801\u667a\u80fd\u4f53\u3001\u72ec\u7acb\u8bd5\u73a9\u8bc4\u5ba1\u3001\u6301\u4e45\u5f00\u53d1\u72b6\u6001\u4e0e\u7ecf\u9a8c\u8bb0\u5fc6\uff0c\u6301\u7eed\u4fee\u6539\u5e76\u68c0\u9a8c\u6e38\u620f\u4f53\u9a8c\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/AetherLabsAI/GameAnything", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29238", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["GameAnything-Bench\u8986\u76d6\u591a\u6a21\u6001\u53c2\u8003\u4e0e\u591a\u79cd\u6e38\u620f\u73af\u5883", "\u8bc4\u6d4b9\u79cd\u7f16\u7801\u667a\u80fd\u4f53\u914d\u7f6e\uff0c\u4ea4\u4e92\u4e0e\u7cbe\u786e\u4fee\u6539\u4ecd\u662f\u96be\u70b9", "\u591a\u6a21\u6001\u53c2\u8003\u63d0\u5347\u5185\u5bb9\u5fe0\u5b9e\u5ea6\uff0c\u8fed\u4ee3\u6536\u76ca\u56e0\u667a\u80fd\u4f53\u800c\u5f02"], "keywords": ["\u6e38\u620f\u751f\u6210", "\u7f16\u7801\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53\u8bc4\u6d4b"], "num_comments": 3, "on_hf": true, "organization": "GameAnything", "pdf_url": "https://arxiv.org/pdf/2611.29238v1", "published_at": "2026-11-22", "score": 0.37, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29238.png", "title": "GameAnything: From Any Inspirations to Playable Game Worlds", "tldr": "\u7528\u7f16\u7801\u667a\u80fd\u4f53\u4e0e\u72ec\u7acb\u8bd5\u73a9\u8bc4\u5ba1\uff0c\u5c06\u591a\u6a21\u6001\u7075\u611f\u8fed\u4ee3\u8f6c\u5316\u4e3a\u53ef\u73a9\u7684\u6e38\u620f\u6269\u5c55\u3002", "upvotes": 3, "what_it_is": "GameAnything\u662f\u5f00\u6e90\u667a\u80fd\u4f53\u5e73\u53f0\uff0c\u9762\u5411\u73b0\u6709\u6e38\u620f\u751f\u6210\u53ef\u73a9\u6269\u5c55\u3002\u5b83\u7ed3\u5408\u7f16\u7801\u667a\u80fd\u4f53\u3001\u72ec\u7acb\u8bd5\u73a9\u8bc4\u5ba1\u3001\u6301\u4e45\u5f00\u53d1\u72b6\u6001\u4e0e\u7ecf\u9a8c\u8bb0\u5fc6\uff0c\u6301\u7eed\u4fee\u6539\u5e76\u68c0\u9a8c\u6e38\u620f\u4f53\u9a8c\u3002", "why_notable": "\u628a\u8bc4\u6d4b\u91cd\u70b9\u4ece\u4ee3\u7801\u662f\u5426\u5b8c\u6210\u63a8\u8fdb\u5230\u6e38\u620f\u80fd\u5426\u771f\u6b63\u6e38\u73a9\u3001\u4f53\u9a8c\u662f\u5426\u5408\u683c\uff0c\u4e3a\u7075\u611f\u9a71\u52a8\u7684\u6e38\u620f\u5f00\u53d1\u63d0\u4f9b\u66f4\u8d34\u8fd1\u5b9e\u9645\u7684\u6d4b\u8bd5\u6846\u67b6\u3002"}, {"abstract": "We study a new problem of preventing object penetration in interactive video world models. To understand how existing models handle this, we introduce NoPeBench, a benchmark that evaluates how world models respond to physical obstacles. Our evaluation reveals that none of the open-source models can reliably prevent such failures. Surprisingly, however, these models already encode the information needed to predict such violations. We find that the hidden states of diffusion transformers (DiTs) can predict whether a candidate action will penetrate an obstacle. Building on this, we introduce NoPeWorld, a lightweight framework that detects and prevents penetration. Specifically, we train a small prediction head on top of a frozen DiT\u0027s hidden states to read out if a candidate action is safe or not. Unsafe actions are then replaced with safe ones that best preserve the original intent. Despite its simplicity, NoPeWorld substantially reduces the physical violation rate, averaged over six video world models, from 74% to 16%. Remarkably, our method shows zero-shot generalization to open-domain imagery, third-person viewpoints, and moving obstacles. We publicly release our code, the NoPeBench benchmark, and model weights. Project Page: https://nopeworld.github.io .", "arxiv_id": "2611.27963", "arxiv_url": "https://arxiv.org/abs/2611.27963", "authors": ["Yuhang Dai", "Yinwei Wu", "Ziyue Lin", "Han Ji", "Xingyi Yang"], "brief": "\u63d0\u51fa\u8f7b\u91cf\u6846\u67b6NoPeWorld\uff0c\u5728\u51bb\u7ed3\u7684\u6269\u6563Transformer\u9690\u85cf\u72b6\u6001\u4e0a\u8bad\u7ec3\u5c0f\u578b\u9884\u6d4b\u5934\uff0c\u5224\u65ad\u5019\u9009\u52a8\u4f5c\u662f\u5426\u5b89\u5168\uff0c\u518d\u7528\u5c3d\u91cf\u4fdd\u7559\u539f\u610f\u7684\u5b89\u5168\u52a8\u4f5c\u66ff\u6362\u5371\u9669\u52a8\u4f5c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/yuhangdai427/NoPeWorld", "github_stars": 20, "hf_url": "https://huggingface.co/papers/2611.27963", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["NoPeBench\u8bc4\u6d4b\u53d1\u73b0\uff0c\u73b0\u6709\u5f00\u6e90\u6a21\u578b\u5747\u65e0\u6cd5\u53ef\u9760\u9632\u6b62\u7a7f\u900f", "\u51bb\u7ed3DiT\uff0c\u4ec5\u8bad\u7ec3\u5c0f\u578b\u9884\u6d4b\u5934\u8bc6\u522b\u52a8\u4f5c\u7a7f\u900f\u98ce\u9669", "\u516d\u4e2a\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u5e73\u5747\u7269\u7406\u8fdd\u89c4\u7387\u4ece74%\u964d\u81f316%"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u7269\u7406\u4e00\u81f4\u6027", "\u52a8\u4f5c\u5b89\u5168"], "num_comments": 3, "on_hf": true, "organization": "The Hong Kong Polytechnic University", "pdf_url": "https://arxiv.org/pdf/2611.27963v1", "published_at": "2026-11-20", "score": 0.34, "selected_reasons": ["HF trending (55\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27963.png", "title": "Non-penetrating World Models", "tldr": "\u901a\u8fc7\u8bfb\u53d6\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u9690\u85cf\u72b6\u6001\u5e76\u66ff\u6362\u5371\u9669\u52a8\u4f5c\uff0c\u5927\u5e45\u51cf\u5c11\u7269\u4f53\u7a7f\u900f\u969c\u788d\u7684\u9519\u8bef\u3002", "upvotes": 55, "what_it_is": "\u63d0\u51fa\u8f7b\u91cf\u6846\u67b6NoPeWorld\uff0c\u5728\u51bb\u7ed3\u7684\u6269\u6563Transformer\u9690\u85cf\u72b6\u6001\u4e0a\u8bad\u7ec3\u5c0f\u578b\u9884\u6d4b\u5934\uff0c\u5224\u65ad\u5019\u9009\u52a8\u4f5c\u662f\u5426\u5b89\u5168\uff0c\u518d\u7528\u5c3d\u91cf\u4fdd\u7559\u539f\u610f\u7684\u5b89\u5168\u52a8\u4f5c\u66ff\u6362\u5371\u9669\u52a8\u4f5c\u3002", "why_notable": "\u8868\u660e\u6a21\u578b\u5185\u90e8\u5df2\u6709\u53ef\u7528\u4e8e\u9884\u6d4b\u7269\u7406\u8fdd\u89c4\u7684\u4fe1\u606f\uff0c\u65e0\u9700\u91cd\u8bad\u4e3b\u6a21\u578b\u5373\u53ef\u5229\u7528\uff1b\u8fd8\u80fd\u96f6\u6837\u672c\u6cdb\u5316\u5230\u5f00\u653e\u57df\u56fe\u50cf\u3001\u7b2c\u4e09\u4eba\u79f0\u89c6\u89d2\u548c\u79fb\u52a8\u969c\u788d\u3002"}, {"abstract": "Video foresight reasoning requires vision-language models to anticipate future events or next actions from currently observed videos. Existing methods fit future captions, rationales, or full visual states, but face two limitations. First, they rely on annotations or external large models for supervision, limiting scalability. We address this with an on-policy self-distillation framework that turns past-future video pairs into a natural self-supervised signal without extra annotations or LLM supervision. Second, they treat the whole future clip as equally valuable, although most of it is irrelevant context information. We address this by defining a foresight score, from which we obtain a contrastive privilege advantage that drives the model to learn the most valuable future information. Since the score is intractable, we optimize a tractable lower-bound surrogate that interpolates this advantage, computed between the true and a random reference future, with a teacher-student distillation advantage; together, they amplify decision-relevant content information and suppress irrelevant context information. We call the resulting framework Future-OPSD. On open-ended prediction and closed-ended planning, Future-OPSD improves base models by up to 14.2 and 15.9 points without compromising general video understanding. Code will be available at https://jingchensun.github.io/future-opsd/", "arxiv_id": "2611.26954", "arxiv_url": "https://arxiv.org/abs/2611.26954", "authors": ["Jingchen Sun", "Jiaxing Zhang", "Qingqiao Hu", "Dingqiang Ye", "Yuqi Jia", "Yijun Liang", "Di Fu", "Yunjie Tian", "Dongdi Zhao", "Changyou Chen"], "brief": "Future-OPSD\u5229\u7528\u8fc7\u53bb\u4e0e\u672a\u6765\u89c6\u9891\u914d\u5bf9\uff0c\u5f00\u5c55\u540c\u7b56\u7565\u81ea\u84b8\u998f\uff0c\u65e0\u9700\u989d\u5916\u6807\u6ce8\u6216\u5916\u90e8\u5927\u6a21\u578b\u76d1\u7763\u3002\u7ed3\u5408\u5bf9\u6bd4\u4f18\u52bf\u4e0e\u5e08\u751f\u84b8\u998f\uff0c\u7a81\u51fa\u51b3\u7b56\u76f8\u5173\u4fe1\u606f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Jingchensun/future-opsd", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.26954", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8fc7\u53bb\u2014\u672a\u6765\u89c6\u9891\u5bf9\u63d0\u4f9b\u81ea\u7136\u81ea\u76d1\u7763\u4fe1\u53f7", "\u524d\u77bb\u5206\u6570\u4e0b\u754c\u878d\u5408\u5bf9\u6bd4\u7279\u6743\u4f18\u52bf\u4e0e\u84b8\u998f\u4f18\u52bf", "\u5f00\u653e\u9884\u6d4b\u4e0e\u5c01\u95ed\u89c4\u5212\u6700\u9ad8\u63d0\u534714.2\u300115.9\u70b9"], "keywords": ["\u89c6\u9891\u9884\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 2, "on_hf": true, "organization": "University at Buffalo", "pdf_url": "https://arxiv.org/pdf/2611.26954v1", "published_at": "2026-11-20", "score": 0.321, "selected_reasons": ["HF trending (37\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.26954.png", "title": "Learning Video Foresight Reasoning from Unlabeled Videos via On-Policy Self-Distillation", "tldr": "\u901a\u8fc7\u65e0\u6807\u6ce8\u89c6\u9891\u81ea\u84b8\u998f\u5b66\u4e60\u5173\u952e\u672a\u6765\u4fe1\u606f\uff0c\u63d0\u5347\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u9884\u6d4b\u4e0e\u89c4\u5212\u80fd\u529b\u3002", "upvotes": 37, "what_it_is": "Future-OPSD\u5229\u7528\u8fc7\u53bb\u4e0e\u672a\u6765\u89c6\u9891\u914d\u5bf9\uff0c\u5f00\u5c55\u540c\u7b56\u7565\u81ea\u84b8\u998f\uff0c\u65e0\u9700\u989d\u5916\u6807\u6ce8\u6216\u5916\u90e8\u5927\u6a21\u578b\u76d1\u7763\u3002\u7ed3\u5408\u5bf9\u6bd4\u4f18\u52bf\u4e0e\u5e08\u751f\u84b8\u998f\uff0c\u7a81\u51fa\u51b3\u7b56\u76f8\u5173\u4fe1\u606f\u3002", "why_notable": "\u5c06\u89c6\u9891\u81ea\u8eab\u7684\u65f6\u95f4\u7ed3\u6784\u8f6c\u5316\u4e3a\u76d1\u7763\uff0c\u5e76\u533a\u5206\u5173\u952e\u672a\u6765\u4fe1\u606f\u4e0e\u65e0\u5173\u80cc\u666f\uff0c\u4e3a\u53ef\u6269\u5c55\u7684\u9884\u6d4b\u5b66\u4e60\u63d0\u4f9b\u8def\u5f84\uff0c\u4e14\u672a\u635f\u5bb3\u901a\u7528\u89c6\u9891\u7406\u89e3\u3002"}, {"abstract": "Full-duplex interaction models exhibit strong conversational agency, enabling natural, low-latency turn-taking, backchannels, and interruptions. However, completing tasks further requires task agency: timely tool invocation and argument revision following user corrections. Frontend-backend agents separate initiation from execution: the frontend decides whether and what to request, while the backend determines how. Execution can be offloaded, but unsent requests cannot be executed, and incomplete ones can misdirect the backend. On Full-Duplex-Bench v3 (FDB v3), most failures of Realtime-Venus-Audio + Harness in our streaming pipeline occur before a domain tool executes. We introduce Duopra, a full-duplex interaction model that learns task execution alongside conversational control. Duopra treats the backend as a tool, accepting a self-contained natural-language request. Direct calls and backend delegation share an action interface and requirements for faithful initiation and correct execution. Its three-stage training combines protocol SFT, full-duplex RL rewarding timely and complete execution, and projector-only repair of talker conditioning after thinker updates. With the same backend, Pass@1 rises from 4.7% to 44.7%; Duopra achieves 47.7% calling tools directly (26.0% after SFT) and 49.3% with a DeepSeek backend. It improves three FDB v1.0 takeover rates over the base model. These results show that task agency can coexist with key conversational agency.", "arxiv_id": "2611.25773", "arxiv_url": "https://arxiv.org/abs/2611.25773", "authors": ["Chiyu Chen", "Pengzhou Cheng", "Yuezhao Ma", "Xiaocheng Li", "Can Liu", "Haonan Hu", "Yao Yao", "Yifei Yang", "Yijie Lu", "Taolei Wang", "Yansi Li", "Muhuan Wu", "Chenglu Sun", "Gongshen Liu", "Zhuosheng Zhang"], "brief": "\u63d0\u51fa\u517c\u987e\u5bf9\u8bdd\u63a7\u5236\u4e0e\u4efb\u52a1\u6267\u884c\u7684\u5168\u53cc\u5de5\u6a21\u578b\uff0c\u5c06\u540e\u7aef\u89c6\u4e3a\u63a5\u6536\u5b8c\u6574\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u7684\u5de5\u5177\uff0c\u5e76\u901a\u8fc7\u4e09\u9636\u6bb5\u8bad\u7ec3\u7edf\u4e00\u76f4\u63a5\u8c03\u7528\u4e0e\u540e\u7aef\u59d4\u6d3e\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/cyChen2003/duopra", "github_stars": 45, "hf_url": "https://huggingface.co/papers/2611.25773", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e09\u9636\u6bb5\uff1a\u534f\u8baeSFT\u3001\u5168\u53cc\u5de5RL\u3001\u6295\u5f71\u5c42\u4fee\u590d", "FDB v3\u540c\u540e\u7aefPass@1\u4ece4.7%\u5347\u81f344.7%", "\u76f4\u63a5\u8c03\u7528\u6210\u529f\u738747.7%\uff0cDeepSeek\u540e\u7aef49.3%"], "keywords": ["\u5168\u53cc\u5de5\u4ea4\u4e92", "\u5de5\u5177\u8c03\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.25773v1", "published_at": "2026-11-19", "score": 0.314, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25773.png", "title": "Duopra: From Full-Duplex Conversation to Full-Duplex Agency", "tldr": "Duopra\u5c06\u5168\u53cc\u5de5\u5bf9\u8bdd\u4e0e\u4efb\u52a1\u6267\u884c\u8054\u5408\u8bad\u7ec3\uff0c\u663e\u8457\u63d0\u5347\u5de5\u5177\u8c03\u7528\u6210\u529f\u7387\u3002", "upvotes": 16, "what_it_is": "\u63d0\u51fa\u517c\u987e\u5bf9\u8bdd\u63a7\u5236\u4e0e\u4efb\u52a1\u6267\u884c\u7684\u5168\u53cc\u5de5\u6a21\u578b\uff0c\u5c06\u540e\u7aef\u89c6\u4e3a\u63a5\u6536\u5b8c\u6574\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u7684\u5de5\u5177\uff0c\u5e76\u901a\u8fc7\u4e09\u9636\u6bb5\u8bad\u7ec3\u7edf\u4e00\u76f4\u63a5\u8c03\u7528\u4e0e\u540e\u7aef\u59d4\u6d3e\u3002", "why_notable": "\u5c06\u4f18\u5316\u91cd\u70b9\u524d\u79fb\u5230\u8bf7\u6c42\u53d1\u8d77\u4e0e\u53c2\u6570\u5b8c\u6574\u6027\uff0c\u800c\u975e\u4ec5\u4f9d\u8d56\u540e\u7aef\u6267\u884c\u80fd\u529b\uff1b\u7ed3\u679c\u663e\u793a\uff0c\u4efb\u52a1\u6267\u884c\u80fd\u529b\u53ef\u4e0e\u4f4e\u5ef6\u8fdf\u5bf9\u8bdd\u63a7\u5236\u5171\u5b58\u3002"}, {"abstract": "Deploying large language models (LLMs) in long-horizon and continual interactions requires maintaining reusable memory states for future inference, posing challenges for existing architectures. Standard Transformers accumulate layer-wise, token-level KV caches, incurring linear GPU memory growth and quadratic computational complexity as the context expands. In contrast, linear-time architectures compress history into fixed-size states, but struggle to retain fine-grained details. We introduce MemOnce, a foundation architecture that learns scalable memory states for language models. MemOnce is based on two core designs: (a) Memory encoder-decoder: it caches only a small subset of final-layer hidden states as compact memory representations and dynamically decodes them back into KV caches for attention layers; (b) Memory sparse attention: for each continual input, MemOnce adaptively retrieves relevant memory representations, with the sparse indices computed only once across layers. Coupling these two designs enables efficient on-the-fly memory loading and KV cache decoding, drastically reducing the GPU memory footprint and achieving linear-time complexity. We conduct extensive experiments to show that MemOnce outperforms Transformers and other architectures across varying model sizes, context lengths, and training paradigms (pretraining and post-training adaptation). In particular, adapting Qwen3.5-4B with MemOnce reduces memory state cache by 1313$\\times$ and prefill latency by 6.9$\\times$ at 1M context, and improves throughput by 3.5$\\times$ and overall memory performance by +5.77%. Finally, MemOnce generalizes zero-shot to downstream representation tasks, achieving competitive results against specialized models.", "arxiv_id": "2611.27973", "arxiv_url": "https://arxiv.org/abs/2611.27973", "authors": ["Chang Nie", "Chaoyou Fu", "Songlin Liu", "Yiqing Hu", "Caifeng Shan"], "brief": "MemOnce\u662f\u4e00\u79cd\u53ef\u6269\u5c55\u8bed\u8a00\u6a21\u578b\u8bb0\u5fc6\u67b6\u6784\uff0c\u4ec5\u7f13\u5b58\u5c11\u91cf\u672b\u5c42\u9690\u72b6\u6001\uff0c\u518d\u52a8\u6001\u89e3\u7801\u4e3a\u5404\u6ce8\u610f\u529b\u5c42\u7684KV\u7f13\u5b58\uff0c\u5e76\u6309\u5f53\u524d\u8f93\u5165\u68c0\u7d22\u76f8\u5173\u8bb0\u5fc6\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Clare-Nie/MemOnce", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2611.27973", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bb0\u5fc6\u7f16\u7801\u5668\u2014\u89e3\u7801\u5668\u5c06\u672b\u5c42\u9690\u72b6\u6001\u8fd8\u539f\u4e3aKV\u7f13\u5b58", "\u8bb0\u5fc6\u7a00\u758f\u6ce8\u610f\u529b\u8de8\u5c42\u590d\u7528\u68c0\u7d22\u7d22\u5f15\uff0c\u5b9e\u73b0\u7ebf\u6027\u8ba1\u7b97", "Qwen3.5-4B\u767e\u4e07\u4e0a\u4e0b\u6587\u7f13\u5b58\u7f29\u51cf1313\u500d"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u67b6\u6784", "\u7a00\u758f\u6ce8\u610f\u529b", "\u63a8\u7406\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "Nanjing University", "pdf_url": "https://arxiv.org/pdf/2611.27973v1", "published_at": "2026-11-20", "score": 0.311, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27973.png", "title": "MemOnce: A Scalable Memory Architecture for Large Language Models", "tldr": "\u901a\u8fc7\u538b\u7f29\u8bb0\u5fc6\u4e0e\u8de8\u5c42\u5171\u4eab\u7a00\u758f\u68c0\u7d22\uff0c\u5927\u5e45\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u5f00\u9500\u3002", "upvotes": 19, "what_it_is": "MemOnce\u662f\u4e00\u79cd\u53ef\u6269\u5c55\u8bed\u8a00\u6a21\u578b\u8bb0\u5fc6\u67b6\u6784\uff0c\u4ec5\u7f13\u5b58\u5c11\u91cf\u672b\u5c42\u9690\u72b6\u6001\uff0c\u518d\u52a8\u6001\u89e3\u7801\u4e3a\u5404\u6ce8\u610f\u529b\u5c42\u7684KV\u7f13\u5b58\uff0c\u5e76\u6309\u5f53\u524d\u8f93\u5165\u68c0\u7d22\u76f8\u5173\u8bb0\u5fc6\u3002", "why_notable": "\u5b83\u4e3a\u957f\u671f\u4ea4\u4e92\u63d0\u4f9b\u4e86\u517c\u987e\u7ec6\u8282\u4fdd\u7559\u4e0e\u4f4e\u5f00\u9500\u7684\u8bb0\u5fc6\u65b9\u6848\uff1b\u767e\u4e07\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u5ef6\u8fdf\u964d\u4f4e6.9\u500d\uff0c\u8bb0\u5fc6\u8868\u73b0\u4e5f\u6709\u6240\u63d0\u5347\u3002"}, {"abstract": "Most world models for future prediction prioritize aestetic quality of generated videos, but offer only weak physical grounding and limited geometric consistency over time, due to the lack of explicit 4D modeling. In this paper, we introduce plan4d, a possible next milestone towards building a generative plannable 4D world model that predicts future RGB videos together with dense 4D geometry, including depth, cameras, point clouds, and scene flow from an observed scene context and text-specified actions. Since training data with paired actions and dense 4D annotations is inherently scarce, plan4d leverages the complementary priors of foundational video generators and 3D reconstructors. Specifically, we propose a model-stitching architecture that couples Depth Anything 3 with LongCat-Video and augments it with an auxiliary DPT head for scene-flow prediction. The resulting model allows us to plan and generate complex, long-horizon, and fine-grained actions in a dynamic 3D scenes, while substantially improving both visual fidelity and geometric accuracy of the generated future videos. Extensive experiments on both synthetic and real-world datasets demonstrate that plan4d achieves state-of-the-art performance in generative 4D modeling of environmental reactions. Project Page: https://fogradio.github.io/plan4d-project", "arxiv_id": "2611.26516", "arxiv_url": "https://arxiv.org/abs/2611.26516", "authors": ["Hangwei Zhang", "Rujing Dang", "Ruimin Lin", "Jiahong Wu", "Xiangxiang Chu", "Chuanxia Zheng"], "brief": "\u4ece\u573a\u666f\u4e0a\u4e0b\u6587\u548c\u6587\u672c\u52a8\u4f5c\u51fa\u53d1\uff0c\u540c\u65f6\u751f\u6210\u672a\u6765\u89c6\u9891\u4e0e\u7a20\u5bc6\u56db\u7ef4\u51e0\u4f55\u3002\u901a\u8fc7\u62fc\u63a5\u89c6\u9891\u751f\u6210\u5668\u548c\u4e09\u7ef4\u91cd\u5efa\u5668\uff0c\u5e76\u589e\u52a0\u573a\u666f\u6d41\u9884\u6d4b\u5934\uff0c\u652f\u6301\u957f\u65f6\u7a0b\u3001\u7ec6\u7c92\u5ea6\u52a8\u4f5c\u89c4\u5212\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AMAP-ML/plan4d", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2611.26516", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u62fc\u63a5Depth Anything 3\u4e0eLongCat-Video", "\u8f85\u52a9DPT\u5934\u9884\u6d4b\u573a\u666f\u6d41\uff0c\u8865\u5145\u52a8\u6001\u51e0\u4f55", "\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u6570\u636e\u4e0a\u9a8c\u8bc1\uff0c\u56db\u7ef4\u751f\u6210\u8fbe\u5230\u6700\u4f18\u6c34\u5e73"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u56db\u7ef4\u91cd\u5efa", "\u52a8\u4f5c\u89c4\u5212"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.26516v1", "published_at": "2026-11-19", "score": 0.309, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.26516.png", "title": "Plan4D: Generative Plannable 4D Worlds", "tldr": "\u878d\u5408\u89c6\u9891\u751f\u6210\u4e0e\u4e09\u7ef4\u91cd\u5efa\u5148\u9a8c\uff0c\u540c\u6b65\u9884\u6d4b\u52a8\u4f5c\u9a71\u52a8\u7684\u672a\u6765\u89c6\u9891\u4e0e\u56db\u7ef4\u51e0\u4f55\u3002", "upvotes": 23, "what_it_is": "\u4ece\u573a\u666f\u4e0a\u4e0b\u6587\u548c\u6587\u672c\u52a8\u4f5c\u51fa\u53d1\uff0c\u540c\u65f6\u751f\u6210\u672a\u6765\u89c6\u9891\u4e0e\u7a20\u5bc6\u56db\u7ef4\u51e0\u4f55\u3002\u901a\u8fc7\u62fc\u63a5\u89c6\u9891\u751f\u6210\u5668\u548c\u4e09\u7ef4\u91cd\u5efa\u5668\uff0c\u5e76\u589e\u52a0\u573a\u666f\u6d41\u9884\u6d4b\u5934\uff0c\u652f\u6301\u957f\u65f6\u7a0b\u3001\u7ec6\u7c92\u5ea6\u52a8\u4f5c\u89c4\u5212\u3002", "why_notable": "\u5c06\u672a\u6765\u9884\u6d4b\u4ece\u89c6\u89c9\u903c\u771f\u63a8\u8fdb\u5230\u65f6\u5e8f\u51e0\u4f55\u4e00\u81f4\uff0c\u5229\u7528\u4e92\u8865\u6a21\u578b\u5148\u9a8c\u7f13\u89e3\u52a8\u4f5c\u4e0e\u56db\u7ef4\u6807\u6ce8\u7a00\u7f3a\uff0c\u4e3a\u52a8\u6001\u573a\u666f\u89c4\u5212\u63d0\u4f9b\u66f4\u4e30\u5bcc\u7684\u72b6\u6001\u8868\u793a\u3002"}, {"abstract": "Manifold-constrained Hyper-Connections (mHC) extends residual connections to multiple streams and stabilizes residual propagation by constraining stream-mixing residual matrices to the Birkhoff polytope, the set of doubly stochastic matrices. In this work, we investigate how to effectively mix residual streams within the Birkhoff polytope. We reveal a mixing trade-off: when under-mixed residual matrices stay close to the vertices of the Birkhoff polytope, hyper-connections will degenerate into a set of nearly independent streams; when over-mixed residual matrices are concentrated around the uniform barycenter of the polytope, streams will become less distinguishable from each other. We theoretically validate our findings by bounding the cumulative residual mixing, stream difference and gradient difference of mixing coefficients across layers. Motivated by these findings, we propose Contraction for Manifold-Constrained Hyper-Connections (cmHC), an exact doubly stochastic method which geometrically contracts the Birkhoff polytope toward its interior. This contraction mitigates under-mixing by forcing the residual matrices to explore deeper into the polytope, with a provable stream mixing bound and no new parameterization. Moreover, we apply a moderate contraction at the shallow layers to prevent over-mixing, enabling stable gradient propagation on extremely large-scale model pretraining. Extensive experiments across dense and mixture-of-experts models at various parameter scales demonstrate the effectiveness and scalability of cmHC. We also develop fused operators for cmHC on Ascend NPUs, reducing hyper-connection execution latency by up to 44.8%.", "arxiv_id": "2611.27193", "arxiv_url": "https://arxiv.org/abs/2611.27193", "authors": ["Haowei He", "Ziwen Zhao", "Chenshuo Pan", "Gang Lin", "Zhihao Yang", "Chao Wang", "Xinzhang Liu", "Kaidong Yu", "Han Gao", "Dongfang Li", "Menglin Yang", "Shuangyong Song", "Yongxiang Li"], "brief": "\u63d0\u51facmHC\uff0c\u5c06\u53cc\u968f\u673a\u6b8b\u5dee\u6df7\u5408\u77e9\u9635\u7684\u53ef\u884c\u57df\u5411\u5185\u90e8\u51e0\u4f55\u6536\u7f29\uff0c\u65e0\u9700\u65b0\u589e\u53c2\u6570\u5316\u3002\u901a\u8fc7\u6d45\u5c42\u9002\u5ea6\u6536\u7f29\uff0c\u5e73\u8861\u6df7\u5408\u4e0d\u8db3\u4e0e\u8fc7\u5ea6\u6df7\u5408\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/Newiz430/cmHC", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27193", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7406\u8bba\u7ea6\u675f\u8de8\u5c42\u7d2f\u8ba1\u6df7\u5408\u3001\u6d41\u5dee\u5f02\u4e0e\u6df7\u5408\u7cfb\u6570\u68af\u5ea6\u5dee\u5f02", "cmHC\u4fdd\u6301\u7cbe\u786e\u53cc\u968f\u673a\u6027\uff0c\u63d0\u4f9b\u53ef\u8bc1\u660e\u7684\u6d41\u6df7\u5408\u754c", "Ascend NPU\u878d\u5408\u7b97\u5b50\u4f7f\u8d85\u8fde\u63a5\u5ef6\u8fdf\u6700\u591a\u964d\u4f4e44.8%"], "keywords": ["\u6b8b\u5dee\u8fde\u63a5", "\u5927\u6a21\u578b\u8bad\u7ec3", "\u6df7\u5408\u4e13\u5bb6", "\u51e0\u4f55\u7ea6\u675f"], "num_comments": 3, "on_hf": true, "organization": "XingChen-AGI", "pdf_url": "https://arxiv.org/pdf/2611.27193v1", "published_at": "2026-11-20", "score": 0.303, "selected_reasons": ["HF trending (94\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27193.png", "title": "cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction", "tldr": "\u901a\u8fc7\u51e0\u4f55\u6536\u7f29\u5e73\u8861\u591a\u6d41\u6b8b\u5dee\u6df7\u5408\uff0c\u517c\u987e\u6d41\u95f4\u533a\u5206\u5ea6\u4e0e\u5927\u6a21\u578b\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "upvotes": 94, "what_it_is": "\u63d0\u51facmHC\uff0c\u5c06\u53cc\u968f\u673a\u6b8b\u5dee\u6df7\u5408\u77e9\u9635\u7684\u53ef\u884c\u57df\u5411\u5185\u90e8\u51e0\u4f55\u6536\u7f29\uff0c\u65e0\u9700\u65b0\u589e\u53c2\u6570\u5316\u3002\u901a\u8fc7\u6d45\u5c42\u9002\u5ea6\u6536\u7f29\uff0c\u5e73\u8861\u6df7\u5408\u4e0d\u8db3\u4e0e\u8fc7\u5ea6\u6df7\u5408\u3002", "why_notable": "\u628a\u591a\u6d41\u6b8b\u5dee\u7684\u6df7\u5408\u5f3a\u5ea6\u8f6c\u5316\u4e3a\u53ef\u63a7\u51e0\u4f55\u7ea6\u675f\uff0c\u5e76\u5728\u591a\u79cd\u89c4\u6a21\u7684\u7a20\u5bc6\u4e0e\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff0c\u517c\u987e\u8bad\u7ec3\u7a33\u5b9a\u6027\u4e0e\u6267\u884c\u6548\u7387\u3002"}, {"abstract": "Text-aware image super-resolution (TAISR) aims to recover high-resolution images from low-resolution inputs while preserving textual content. Existing methods treat this as a visual restoration problem, yet severely degraded text often cannot be read from local visual evidence alone. Humans instead read it by reasoning over image context, logical patterns, and prior knowledge. This raises a fundamental question: Does TAISR need reasoning? To answer this, we introduce two diagnostic tools. The first, ReasonText, is a human-curated benchmark that separates reasoning-required text from locally recoverable text. The second, Ground-Truth Text-Crop Accuracy (GTTCA), is a recognition-based metric that measures text restoration quality without text detection errors. Evaluating twelve recent super-resolution (SR) models, we find a consistent and substantial performance drop on reasoning-required text, revealing a systematic blind spot. Two observations point to a remedy. One is that text-conditioned SR models restore text substantially better when given ground-truth text. The other is that multimodal large language models (MLLMs) can read degraded text in low-resolution images through reasoning. We therefore propose Reasoning Transfer via Captioning (RTC), a training-free plug-in that uses an external MLLM to infer the degraded text and feeds the resulting caption to a text-conditioned SR model. RTC consistently improves all six text-conditioned SR models we evaluate, especially on reasoning-required text. Surprisingly, a real-world SR model with RTC can even outperform the TAISR model with RTC, suggesting that reasoning should be a core design axis for future TAISR.", "arxiv_id": "2611.15449", "arxiv_url": "https://arxiv.org/abs/2611.15449", "authors": ["Jaeseong Lee", "Jinwoo Kim", "Jinho Jeong", "Seon Joo Kim"], "brief": "\u7814\u7a76\u6784\u5efa\u57fa\u51c6\u4e0e\u8bc6\u522b\u6307\u6807\uff0c\u68c0\u9a8c\u6587\u5b57\u6062\u590d\u662f\u5426\u9700\u8981\u63a8\u7406\uff1b\u63d0\u51fa\u514d\u8bad\u7ec3\u63d2\u4ef6RTC\uff0c\u7528\u5916\u90e8\u591a\u6a21\u6001\u6a21\u578b\u63a8\u65ad\u9000\u5316\u6587\u5b57\uff0c\u518d\u4ee5\u63cf\u8ff0\u5f15\u5bfc\u6587\u672c\u6761\u4ef6\u8d85\u5206\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/jasonleex1995/TAISR_needs_Reasoning", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.15449", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["ReasonText\u533a\u5206\u9700\u63a8\u7406\u6587\u672c\u4e0e\u53ef\u5c40\u90e8\u6062\u590d\u6587\u672c", "GTTCA\u6392\u9664\u68c0\u6d4b\u8bef\u5dee\uff0c\u8bc4\u6d4b12\u4e2a\u8d85\u5206\u6a21\u578b", "\u514d\u8bad\u7ec3RTC\u6539\u5584\u5168\u90e86\u4e2a\u53d7\u6d4b\u6587\u672c\u6761\u4ef6\u6a21\u578b"], "keywords": ["\u56fe\u50cf\u8d85\u5206\u8fa8\u7387", "\u6587\u5b57\u8bc6\u522b", "\u591a\u6a21\u6001\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "CIPLAB", "pdf_url": "https://arxiv.org/pdf/2611.15449v1", "published_at": "2026-11-11", "score": 0.302, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.15449.png", "title": "Reading the Unreadable: Text-Aware Image Super-Resolution Needs Reasoning", "tldr": "\u501f\u52a9\u591a\u6a21\u6001\u6a21\u578b\u63a8\u7406\u9000\u5316\u6587\u5b57\uff0c\u518d\u5f15\u5bfc\u8d85\u5206\u8fa8\u7387\uff0c\u6539\u5584\u96be\u8fa8\u6587\u672c\u7684\u6062\u590d\u3002", "upvotes": 21, "what_it_is": "\u7814\u7a76\u6784\u5efa\u57fa\u51c6\u4e0e\u8bc6\u522b\u6307\u6807\uff0c\u68c0\u9a8c\u6587\u5b57\u6062\u590d\u662f\u5426\u9700\u8981\u63a8\u7406\uff1b\u63d0\u51fa\u514d\u8bad\u7ec3\u63d2\u4ef6RTC\uff0c\u7528\u5916\u90e8\u591a\u6a21\u6001\u6a21\u578b\u63a8\u65ad\u9000\u5316\u6587\u5b57\uff0c\u518d\u4ee5\u63cf\u8ff0\u5f15\u5bfc\u6587\u672c\u6761\u4ef6\u8d85\u5206\u6a21\u578b\u3002", "why_notable": "\u5b83\u63ed\u793a\u6587\u5b57\u8d85\u5206\u6a21\u578b\u5728\u63a8\u7406\u578b\u6587\u672c\u4e0a\u7684\u7cfb\u7edf\u6027\u77ed\u677f\uff0c\u5e76\u8bc1\u660e\u5916\u63a5\u63a8\u7406\u80fd\u529b\u53ef\u6539\u5584\u6062\u590d\uff0c\u4e3a\u8d85\u5206\u6a21\u578b\u8bbe\u8ba1\u63d0\u4f9b\u65b0\u65b9\u5411\u3002"}, {"abstract": "Multimodal foundation models can play video games well when the game waits for them, but often fail when it keeps running. We find that much of this gap lies in the harness, which decides what the model sees, what it remembers, and how its outputs become actions over time. Existing harnesses such as VISTA improve the first two, yet turn each model call into at most one action, so the agent acts only as often as its model thinks. We introduce AutoPILOT, which changes the third: in each model call, the model can send a primitive action, start an open-loop macro, or write a closed-loop controller that keeps playing from the screen without further model calls until it hands control back. To evaluate agents in real-time games, we build AFK-Bench, 120 diverse browser games grouped by how they respond to inaction and playable in real time or with the clock paused. With GPT-6.1 Sol under the same budgets, AutoPILOT reaches 68.6% real-time success against 38.3% for VISTA, and on GameWorld it keeps 80.0% in real time while VISTA drops from 84.1% to 42.9%. Its gains hold across models, and it reaches VISTA\u0027s final success rate at a fifth of its API cost. Our results suggest that how a harness turns model outputs into actions over time is a central yet underexplored part of agent design, and we hope AutoPILOT and AFK-Bench will serve as a foundation for agents in a world that does not wait.", "arxiv_id": "2611.28202", "arxiv_url": "https://arxiv.org/abs/2611.28202", "authors": ["Mark Zhao", "Pengcheng Wang", "Rui Yang", "Jiarui Yao", "Xirui Jiang", "Yuxi Chen", "Bingxuan Li", "Hanyang Chen", "Ke Yang", "Manling Li", "Tong Zhang", "Huan Zhang"], "brief": "AutoPILOT\u6539\u9020\u89c6\u89c9\u667a\u80fd\u4f53\u7684\u52a8\u4f5c\u6267\u884c\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5355\u6b21\u8c03\u7528\u53ef\u8f93\u51fa\u57fa\u7840\u52a8\u4f5c\u3001\u5f00\u73af\u5b8f\u6216\u95ed\u73af\u63a7\u5236\u5668\uff0c\u540e\u8005\u6301\u7eed\u6839\u636e\u5c4f\u5e55\u884c\u52a8\uff0c\u76f4\u5230\u4ea4\u8fd8\u63a7\u5236\u6743\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28202", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["AFK-Bench\u542b120\u6b3e\u6d4f\u89c8\u5668\u6e38\u620f\uff0c\u652f\u6301\u5b9e\u65f6\u4e0e\u6682\u505c\u6a21\u5f0f", "\u540c\u9884\u7b97\u5b9e\u65f6\u6210\u529f\u738768.6%\uff0cVISTA\u4e3a38.3%", "\u8fbe\u5230VISTA\u6700\u7ec8\u6210\u529f\u7387\u4ec5\u9700\u5176\u4e94\u5206\u4e4b\u4e00API\u6210\u672c"], "keywords": ["\u89c6\u89c9\u667a\u80fd\u4f53", "\u5b9e\u65f6\u63a7\u5236", "\u6e38\u620f\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.28202v1", "published_at": "2026-11-20", "score": 0.267, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28202.png", "title": "AutoPILOT: A Visual Agent Harness for Real-Time Gameplay", "tldr": "\u901a\u8fc7\u6301\u7eed\u6267\u884c\u5b8f\u52a8\u4f5c\u4e0e\u95ed\u73af\u63a7\u5236\u5668\uff0c\u8ba9\u89c6\u89c9\u667a\u80fd\u4f53\u4e0d\u5fc5\u7b49\u5f85\u6a21\u578b\u601d\u8003\u4e5f\u80fd\u5b9e\u65f6\u73a9\u6e38\u620f\u3002", "upvotes": 10, "what_it_is": "AutoPILOT\u6539\u9020\u89c6\u89c9\u667a\u80fd\u4f53\u7684\u52a8\u4f5c\u6267\u884c\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5355\u6b21\u8c03\u7528\u53ef\u8f93\u51fa\u57fa\u7840\u52a8\u4f5c\u3001\u5f00\u73af\u5b8f\u6216\u95ed\u73af\u63a7\u5236\u5668\uff0c\u540e\u8005\u6301\u7eed\u6839\u636e\u5c4f\u5e55\u884c\u52a8\uff0c\u76f4\u5230\u4ea4\u8fd8\u63a7\u5236\u6743\u3002", "why_notable": "\u5b83\u5c06\u6a21\u578b\u601d\u8003\u9891\u7387\u4e0e\u52a8\u4f5c\u6267\u884c\u9891\u7387\u89e3\u8026\uff0c\u8868\u660e\u6267\u884c\u6846\u67b6\u672c\u8eab\u80fd\u663e\u8457\u6539\u5584\u5b9e\u65f6\u8868\u73b0\uff0c\u4e3a\u4f4e\u6210\u672c\u3001\u6301\u7eed\u54cd\u5e94\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u63d0\u4f9b\u8bbe\u8ba1\u65b9\u5411\u3002"}, {"abstract": "Vision-language models (VLMs) exhibit strong semantic understanding but remain limited in their ability to reason about metric 3D space in the physical world. Existing VLMs typically infer 3D scene structure from one or more images without known camera calibration or cross-view geometric constraints. This makes metric 3D inference inherently ambiguous and leaves it unclear whether their spatial predictions are grounded in visual evidence or driven primarily by semantic priors. In contrast, calibrated stereo provides explicit cross-view geometry that resolves this ambiguity and offers a more reliable foundation for metric 3D perception and geometric generalization. We investigate how VLMs can learn transferable 3D representations directly from calibrated binocular observations. To this end, we introduce StereoVLM, the first geometry-aware binocular VLM for metric 3D spatial reasoning. StereoVLM follows a hierarchical learning paradigm spanning from cross-view correspondence and disparity estimation to calibration-conditioned metric depth perception and semantic spatial reasoning. We further find that disparity supervision generalizes substantially better than direct binocular depth supervision on unseen environments. To evaluate these capabilities, we introduce Stereo3D-Bench, a comprehensive benchmark across three levels, from point-level geometry to object-level spatial reasoning. StereoVLM-8B achieves 95.17% depth accuracy ($\u03b4_1$) and a 66.98 average object-level score on Stereo3D-Bench. Intervention results further indicate that the model\u0027s performance on Stereo3D-Bench benefits from valid cross-view geometry and cannot be explained solely by additional visual tokens or semantic priors. Hierarchical geometric supervision also yields average gains of 3.54 points across five spatial benchmarks and 4.3 percentage points in RoboCasa manipulation success.", "arxiv_id": "2611.27915", "arxiv_url": "https://arxiv.org/abs/2611.27915", "authors": ["Chi Yan", "Guoyang Zhao", "Wentao Yuan", "Yixiao Ge", "Yanning Zhou", "Dan Xu"], "brief": "StereoVLM\u4ece\u6807\u5b9a\u53cc\u76ee\u56fe\u50cf\u5b66\u4e60\u4e09\u7ef4\u8868\u5f81\uff0c\u4f9d\u6b21\u8bad\u7ec3\u8de8\u89c6\u56fe\u5bf9\u5e94\u3001\u89c6\u5dee\u4f30\u8ba1\u3001\u6807\u5b9a\u6761\u4ef6\u6df1\u5ea6\u611f\u77e5\u4e0e\u8bed\u4e49\u7a7a\u95f4\u63a8\u7406\uff0c\u5e76\u6784\u5efa\u4e09\u7ea7\u8bc4\u6d4b\u57fa\u51c6\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27915", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u89c6\u5dee\u76d1\u7763\u5728\u672a\u89c1\u73af\u5883\u4e2d\u6bd4\u76f4\u63a5\u53cc\u76ee\u6df1\u5ea6\u76d1\u7763\u66f4\u6613\u6cdb\u5316", "StereoVLM-8B\u6df1\u5ea6\u51c6\u786e\u738795.17%\uff0c\u7269\u4f53\u7ea7\u5f97\u520666.98", "\u5206\u5c42\u76d1\u7763\u4f7f\u4e94\u9879\u7a7a\u95f4\u57fa\u51c6\u5e73\u5747\u63d0\u53473.54\u5206"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u53cc\u76ee\u89c6\u89c9", "\u4e09\u7ef4\u7a7a\u95f4\u63a8\u7406", "\u673a\u5668\u4eba\u64cd\u63a7"], "num_comments": 2, "on_hf": true, "organization": "xpeng-robotics", "pdf_url": "https://arxiv.org/pdf/2611.27915v1", "published_at": "2026-11-20", "score": 0.261, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27915.png", "title": "StereoVLM: Binocular Vision-Language Models for Metric 3D Spatial Reasoning", "tldr": "\u901a\u8fc7\u6807\u5b9a\u53cc\u76ee\u51e0\u4f55\u4e0e\u5206\u5c42\u76d1\u7763\uff0c\u8ba9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u83b7\u5f97\u53ef\u8fc1\u79fb\u7684\u4e09\u7ef4\u5ea6\u91cf\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 7, "what_it_is": "StereoVLM\u4ece\u6807\u5b9a\u53cc\u76ee\u56fe\u50cf\u5b66\u4e60\u4e09\u7ef4\u8868\u5f81\uff0c\u4f9d\u6b21\u8bad\u7ec3\u8de8\u89c6\u56fe\u5bf9\u5e94\u3001\u89c6\u5dee\u4f30\u8ba1\u3001\u6807\u5b9a\u6761\u4ef6\u6df1\u5ea6\u611f\u77e5\u4e0e\u8bed\u4e49\u7a7a\u95f4\u63a8\u7406\uff0c\u5e76\u6784\u5efa\u4e09\u7ea7\u8bc4\u6d4b\u57fa\u51c6\u3002", "why_notable": "\u5e72\u9884\u5b9e\u9a8c\u8868\u660e\u6536\u76ca\u6765\u81ea\u6709\u6548\u8de8\u89c6\u56fe\u51e0\u4f55\uff0c\u800c\u975e\u4ec5\u9760\u66f4\u591a\u89c6\u89c9\u8bcd\u5143\u6216\u8bed\u4e49\u5148\u9a8c\uff1bRoboCasa\u64cd\u63a7\u6210\u529f\u7387\u4e5f\u63d0\u53474.3\u4e2a\u767e\u5206\u70b9\u3002"}, {"abstract": "Agent skills are documents in which experts write down procedural knowledge, and models increasingly maintain them by rewriting them without feedback. Such rewriting could adapt a skill to the model that uses it or erode the expert knowledge that makes it useful, yet how skills evolve under this feedback-free self-evolution has not been studied. We let models rewrite expert skills round after round without any task, run or judgment and run agents built on the same models with the rewritten skills. Our experiments show that the skills lose value rather than improve, as every model we test performs worse with them on every benchmark, by 15 points on average on SkillsBench after thirty rounds. Sampling each model\u0027s prior with skills it writes from the topic alone, we find that rewriting pulls skills toward this prior and gives up first the knowledge outside it. Putting this knowledge back recovers much of the lost pass rate, so an expert\u0027s skill is valuable largely for what the model does not write on its own. Building on this insight, SkillDiff marks this knowledge in place and raises the pass rate on SkillsBench by 4.8 points on average without feedback or any change to the skill\u0027s text. Project repository: https://github.com/LitaoGuo/How-Self-Evolution-Reshapes-Skills.", "arxiv_id": "2611.25534", "arxiv_url": "https://arxiv.org/abs/2611.25534", "authors": ["Litao Guo", "Man Chen", "Xinli Xu", "Jinsong Zhou", "Zixin Zhang", "Ying-Cong Chen"], "brief": "\u7814\u7a76\u8ba9\u6a21\u578b\u5728\u65e0\u4efb\u52a1\u3001\u6267\u884c\u6216\u8bc4\u5224\u53cd\u9988\u4e0b\u53cd\u590d\u6539\u5199\u4e13\u5bb6\u6280\u80fd\uff0c\u5e76\u6d4b\u8bd5\u667a\u80fd\u4f53\u8868\u73b0\u3002\u901a\u8fc7\u5bf9\u6bd4\u6a21\u578b\u81ea\u884c\u751f\u6210\u7684\u6280\u80fd\uff0c\u5b9a\u4f4d\u88ab\u4e22\u5931\u7684\u77e5\u8bc6\uff0c\u518d\u7528SkillDiff\u539f\u4f4d\u6807\u8bb0\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/LitaoGuo/How-Self-Evolution-Reshapes-Skills", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.25534", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91cd\u519930\u8f6e\u540e\uff0cSkillsBench\u5e73\u5747\u4e0b\u964d15\u5206", "\u91cd\u5199\u8d8b\u5411\u6a21\u578b\u5148\u9a8c\uff0c\u4f18\u5148\u4e22\u5931\u5148\u9a8c\u5916\u77e5\u8bc6", "SkillDiff\u4e0d\u6539\u6280\u80fd\u6b63\u6587\uff0c\u5e73\u5747\u63d0\u53474.8\u5206"], "keywords": ["\u667a\u80fd\u4f53\u6280\u80fd", "\u81ea\u6211\u6f14\u5316", "\u4e13\u5bb6\u77e5\u8bc6"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.25534v1", "published_at": "2026-11-19", "score": 0.253, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25534.png", "title": "How Feedback-Free Self-Evolution Reshapes Agent Skills: A Systematic Study", "tldr": "\u65e0\u53cd\u9988\u91cd\u5199\u4f1a\u4fb5\u8680\u667a\u80fd\u4f53\u6280\u80fd\u4e2d\u7684\u4e13\u5bb6\u77e5\u8bc6\uff0c\u6807\u8bb0\u6a21\u578b\u76f2\u533a\u53ef\u63d0\u5347\u8868\u73b0\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u8ba9\u6a21\u578b\u5728\u65e0\u4efb\u52a1\u3001\u6267\u884c\u6216\u8bc4\u5224\u53cd\u9988\u4e0b\u53cd\u590d\u6539\u5199\u4e13\u5bb6\u6280\u80fd\uff0c\u5e76\u6d4b\u8bd5\u667a\u80fd\u4f53\u8868\u73b0\u3002\u901a\u8fc7\u5bf9\u6bd4\u6a21\u578b\u81ea\u884c\u751f\u6210\u7684\u6280\u80fd\uff0c\u5b9a\u4f4d\u88ab\u4e22\u5931\u7684\u77e5\u8bc6\uff0c\u518d\u7528SkillDiff\u539f\u4f4d\u6807\u8bb0\u3002", "why_notable": "\u63ed\u793a\u65e0\u53cd\u9988\u81ea\u6211\u6f14\u5316\u53ef\u80fd\u62b9\u53bb\u4e13\u5bb6\u77e5\u8bc6\uff0c\u800c\u975e\u79ef\u7d2f\u80fd\u529b\uff1b\u4ee5\u8f7b\u91cf\u6807\u8bb0\u4fdd\u7559\u6a21\u578b\u4e0d\u64c5\u957f\u751f\u6210\u7684\u77e5\u8bc6\uff0c\u4e3a\u6280\u80fd\u7ef4\u62a4\u63d0\u4f9b\u53ef\u64cd\u4f5c\u65b9\u5411\u3002"}, {"abstract": "Operating in the physical world requires reasoning beyond what cameras directly capture. In a city, radio signals are invisible to the lens, yet their strength is governed by the buildings and streets an image does show. Given only these visible structures, can vision-language models (VLMs) infer the invisible radio field they shape? Probing true physical reasoning requires exact fields in real cities, alongside controlled interventions where a single physical factor changes. We build a label-free engine that turns any coordinate on Earth into a ray-traceable city, simulates matched single-factor counterfactuals, and computes every answer exactly. This yields RadioVISTA, a benchmark and training dataset for visual reasoning about invisible fields. Physically, a radio field is the sum of its propagation paths, yet across six continents we uncover a striking field-path dissociation: frontier VLMs accurately judge where a field is strong, but fail to tell whether a single direct or one-wall path exists. Open models fail even earlier at reading the field itself, and are systematically wrong, scoring below random guessing even when credited for any of four attempts. On unseen cities, fine-tuning brings a 9B open model close to frontier proprietary models on fields, yet neither supervised nor reinforcement fine-tuning improves path tracing. Supervising only final answers teaches models to approximate the field, yet leaves single-path geometry out of reach.", "arxiv_id": "2611.28123", "arxiv_url": "https://arxiv.org/abs/2611.28123", "authors": ["Yiyang Zhu", "Xin Li", "Guangyuan Liu", "Ziheng Liu", "Jiayi Zhang", "Chau Yuen"], "brief": "\u6784\u5efa\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u57ce\u5e02\u5c04\u7ebf\u8ffd\u8e2a\u5f15\u64ce\uff0c\u751f\u6210\u65e0\u7ebf\u7535\u573a\u63a8\u7406\u6570\u636e\u96c6RadioVISTA\u3002\u901a\u8fc7\u5355\u56e0\u7d20\u53cd\u4e8b\u5b9e\u4e0e\u7cbe\u786e\u7b54\u6848\uff0c\u6d4b\u8bd5\u6a21\u578b\u8bfb\u573a\u3001\u9884\u6d4b\u548c\u8ffd\u8e2a\u4f20\u64ad\u8def\u5f84\u7684\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28123", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6\u516d\u5927\u6d32\uff0c\u5c04\u7ebf\u8ffd\u8e2a\u751f\u6210\u7cbe\u786e\u7b54\u6848\u4e0e\u5355\u56e0\u7d20\u53cd\u4e8b\u5b9e", "\u524d\u6cbf\u6a21\u578b\u80fd\u5224\u65ad\u573a\u5f3a\uff0c\u5374\u96be\u8bc6\u522b\u76f4\u8fbe\u6216\u5355\u5899\u4f20\u64ad\u8def\u5f84", "9B\u6a21\u578b\u5fae\u8c03\u540e\u573a\u5f3a\u5224\u65ad\u63a5\u8fd1\u524d\u6cbf\uff0c\u8def\u5f84\u8ffd\u8e2a\u4ecd\u65e0\u6539\u5584"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7269\u7406\u63a8\u7406", "\u65e0\u7ebf\u7535\u4f20\u64ad", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.28123v1", "published_at": "2026-11-18", "score": 0.246, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28123.png", "title": "Seeing the Invisible: How Vision-Language Models Read, Predict and Trace Radio Fields", "tldr": "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u5224\u65ad\u57ce\u5e02\u65e0\u7ebf\u7535\u573a\u5f3a\uff0c\u5374\u96be\u8ffd\u8e2a\u4f20\u64ad\u8def\u5f84\uff0c\u66b4\u9732\u7269\u7406\u63a8\u7406\u77ed\u677f\u3002", "upvotes": 4, "what_it_is": "\u6784\u5efa\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u57ce\u5e02\u5c04\u7ebf\u8ffd\u8e2a\u5f15\u64ce\uff0c\u751f\u6210\u65e0\u7ebf\u7535\u573a\u63a8\u7406\u6570\u636e\u96c6RadioVISTA\u3002\u901a\u8fc7\u5355\u56e0\u7d20\u53cd\u4e8b\u5b9e\u4e0e\u7cbe\u786e\u7b54\u6848\uff0c\u6d4b\u8bd5\u6a21\u578b\u8bfb\u573a\u3001\u9884\u6d4b\u548c\u8ffd\u8e2a\u4f20\u64ad\u8def\u5f84\u7684\u80fd\u529b\u3002", "why_notable": "\u5c06\u573a\u5f3a\u5224\u65ad\u4e0e\u4f20\u64ad\u51e0\u4f55\u63a8\u7406\u89e3\u8026\uff0c\u63ed\u793a\u7b54\u5bf9\u7ed3\u679c\u4e0d\u7b49\u4e8e\u638c\u63e1\u7269\u7406\u673a\u5236\uff0c\u4e5f\u6307\u51fa\u4ec5\u76d1\u7763\u6700\u7ec8\u7b54\u6848\u7684\u8bad\u7ec3\u5c40\u9650\u3002"}, {"abstract": "Modern language models (LMs) are increasingly deployed with access to search tools at inference. Yet pretraining remains predominantly focused on predicting static text, with search capabilities typically introduced during post-training. We propose Search-Native Pretraining as a practical route to teach search capability during pretraining from ordinary text corpora. Specifically, we augment pretraining corpus at scale with web-search queries and retrieve web response using a local index. Training on this augmented corpus teaches models to generate search calls and incorporate retrieved evidence during language modeling. Across Wikipedia and DCLM-Edu corpora and 360M to 3.3B parameter scales, search-pretrained models (\"QueryLM\") show improved performance on knowledge-intensive tasks and higher steerability toward the retrieved evidence. Crucially, their advantage persists after supervised fine-tuning of both search-pretrained and conventionally pretrained models, indicating that the tested post-training procedures do not fully recover the capabilities developed during pretraining. Throughout our experiments, we find that a 1.4B QueryLM consistently beats or matches the performance of a FLOP-matched 3.3B baseline model across all knowledge intensive tasks. These results establish search-pretraining as a practical way to develop foundational search capabilities during pretraining. We release the training artifacts, including model checkpoints and data.", "arxiv_id": "2611.26809", "arxiv_url": "https://arxiv.org/abs/2611.26809", "authors": ["Kaustubh Ponkshe", "Gyung Hyun Je", "Stefan Taga", "Colin Raffel", "Martin Jaggi"], "brief": "\u7814\u7a76\u63d0\u51fa\u641c\u7d22\u539f\u751f\u9884\u8bad\u7ec3\uff1a\u5728\u666e\u901a\u6587\u672c\u8bed\u6599\u4e2d\u5927\u89c4\u6a21\u63d2\u5165\u641c\u7d22\u67e5\u8be2\uff0c\u5e76\u7528\u672c\u5730\u7d22\u5f15\u68c0\u7d22\u54cd\u5e94\uff0c\u8bad\u7ec3\u6a21\u578b\u751f\u6210\u641c\u7d22\u8c03\u7528\u3001\u7ed3\u5408\u68c0\u7d22\u8bc1\u636e\u5b8c\u6210\u8bed\u8a00\u5efa\u6a21\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.26809", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6Wikipedia\u3001DCLM-Edu\u53ca3.6\u4ebf\u81f333\u4ebf\u53c2\u6570", "14\u4ebfQueryLM\u5728\u77e5\u8bc6\u4efb\u52a1\u4e0a\u6301\u5e73\u6216\u80dc\u8fc7\u7b49\u7b97\u529b33\u4ebf\u57fa\u7ebf", "\u53cc\u65b9\u7ecf\u76d1\u7763\u5fae\u8c03\u540e\uff0c\u641c\u7d22\u9884\u8bad\u7ec3\u6a21\u578b\u4ecd\u4fdd\u6709\u4f18\u52bf"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u4fe1\u606f\u68c0\u7d22", "\u5de5\u5177\u8c03\u7528"], "num_comments": 2, "on_hf": true, "organization": "EPFL", "pdf_url": "https://arxiv.org/pdf/2611.26809v1", "published_at": "2026-11-19", "score": 0.243, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.26809.png", "title": "Search From the Start: Search-Native Pretraining for Language Models", "tldr": "\u5c06\u641c\u7d22\u8c03\u7528\u4e0e\u68c0\u7d22\u8bc1\u636e\u878d\u5165\u9884\u8bad\u7ec3\uff0c\u8ba9\u66f4\u5c0f\u6a21\u578b\u83b7\u5f97\u66f4\u5f3a\u77e5\u8bc6\u4efb\u52a1\u80fd\u529b\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u63d0\u51fa\u641c\u7d22\u539f\u751f\u9884\u8bad\u7ec3\uff1a\u5728\u666e\u901a\u6587\u672c\u8bed\u6599\u4e2d\u5927\u89c4\u6a21\u63d2\u5165\u641c\u7d22\u67e5\u8be2\uff0c\u5e76\u7528\u672c\u5730\u7d22\u5f15\u68c0\u7d22\u54cd\u5e94\uff0c\u8bad\u7ec3\u6a21\u578b\u751f\u6210\u641c\u7d22\u8c03\u7528\u3001\u7ed3\u5408\u68c0\u7d22\u8bc1\u636e\u5b8c\u6210\u8bed\u8a00\u5efa\u6a21\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u641c\u7d22\u80fd\u529b\u7684\u8bad\u7ec3\u9636\u6bb5\u4f1a\u5f71\u54cd\u6700\u7ec8\u8868\u73b0\uff0c\u6240\u6d4b\u8bd5\u7684\u540e\u8bad\u7ec3\u6d41\u7a0b\u65e0\u6cd5\u5b8c\u5168\u8865\u9f50\u5dee\u8ddd\uff0c\u4e5f\u5c55\u793a\u4e86\u5c0f\u6a21\u578b\u63d0\u5347\u77e5\u8bc6\u4efb\u52a1\u8868\u73b0\u7684\u8def\u5f84\u3002"}, {"abstract": "Reward models for instruction-guided video editing can favor temporal consistency at the expense of motion. We study this failure, termed \\emph{motion collapse}, using controlled motion-suppression variants of real edits. On VE-Bench, the evaluated composite reward prefers a motion-suppressed candidate in $97\\%$ of cases. Learned
