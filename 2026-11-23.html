 video rewards and a VLM judge also struggle with mild suppression, while latent optimization and reward-guided fine-tuning exploit this weakness to increase reward as motion declines. A linear probe of our base reward backbone performs near chance on mild suppression, motivating an explicit inter-frame dynamics input. We propose a motion-aware reward model that combines an RGB frame-difference stream with preference training against motion-suppressed and fabricated-motion negatives. A distillation anchor preserves alignment with human quality judgments. On the VE-Bench motion ladder, our model reduces the rate of selecting motion-suppressed candidates to $0\\%$ while achieving a Spearman correlation of $0.57$ with human quality ratings. It also detects unseen suppression variants and preserves motion during reward-guided fine-tuning on two editing pipelines. These results support explicitly modeling motion in rewards for video editing.", "arxiv_id": "2611.22495", "arxiv_url": "https://arxiv.org/abs/2611.22495", "authors": ["Li Li", "Xiangbo Gao", "Bo Ni", "Samyadeep Basu", "Viet Dac Lai", "Jing Shi", "Seunghyun Yoon", "Gang Wu", "Yu Wang", "Thien Huu Nguyen", "Tyler Derr", "Franck Dernoncourt", "Zhengzhong Tu", "Yue Zhao"], "brief": "\u7814\u7a76\u53d1\u73b0\u89c6\u9891\u7f16\u8f91\u5956\u52b1\u4f1a\u504f\u7231\u8fd0\u52a8\u88ab\u524a\u5f31\u7684\u7ed3\u679c\uff0c\u5e76\u88ab\u4f18\u5316\u8fc7\u7a0b\u5229\u7528\u3002\u4f5c\u8005\u5f15\u5165RGB\u5e27\u5dee\u5206\u652f\uff0c\u7ed3\u5408\u8fd0\u52a8\u6291\u5236\u3001\u4f2a\u9020\u8fd0\u52a8\u8d1f\u6837\u672c\u7684\u504f\u597d\u8bad\u7ec3\u53ca\u84b8\u998f\u951a\u70b9\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.22495", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["VE-Bench\u4e0a\uff0c\u539f\u590d\u5408\u5956\u52b197%\u504f\u9009\u8fd0\u52a8\u6291\u5236\u7ed3\u679c", "RGB\u5e27\u5dee\u5206\u652f\u7ed3\u5408\u4e24\u7c7b\u8fd0\u52a8\u8d1f\u6837\u672c\u504f\u597d\u8bad\u7ec3", "\u6291\u5236\u5019\u9009\u9009\u62e9\u7387\u964d\u81f30%\uff0c\u4eba\u8bc4\u76f8\u5173\u7cfb\u65700.57"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u5956\u52b1\u6a21\u578b", "\u8fd0\u52a8\u5efa\u6a21", "\u504f\u597d\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.22495v1", "published_at": "2026-11-17", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22495.png", "title": "Motion-Aware Reward Modeling for Instruction-Guided Video Editing", "tldr": "\u901a\u8fc7\u663e\u5f0f\u5e27\u95f4\u52a8\u6001\u4e0e\u8d1f\u6837\u672c\u504f\u597d\u8bad\u7ec3\uff0c\u7ea0\u6b63\u89c6\u9891\u7f16\u8f91\u5956\u52b1\u6a21\u578b\u7684\u8fd0\u52a8\u574d\u584c", "upvotes": 2, "what_it_is": "\u7814\u7a76\u53d1\u73b0\u89c6\u9891\u7f16\u8f91\u5956\u52b1\u4f1a\u504f\u7231\u8fd0\u52a8\u88ab\u524a\u5f31\u7684\u7ed3\u679c\uff0c\u5e76\u88ab\u4f18\u5316\u8fc7\u7a0b\u5229\u7528\u3002\u4f5c\u8005\u5f15\u5165RGB\u5e27\u5dee\u5206\u652f\uff0c\u7ed3\u5408\u8fd0\u52a8\u6291\u5236\u3001\u4f2a\u9020\u8fd0\u52a8\u8d1f\u6837\u672c\u7684\u504f\u597d\u8bad\u7ec3\u53ca\u84b8\u998f\u951a\u70b9\u3002", "why_notable": "\u63ed\u793a\u4e86\u9ad8\u5956\u52b1\u53ef\u80fd\u63a9\u76d6\u8fd0\u52a8\u9000\u5316\u7684\u8bc4\u4ef7\u6f0f\u6d1e\uff0c\u5e76\u5728\u4e24\u6761\u7f16\u8f91\u6d41\u6c34\u7ebf\u4e0a\u9a8c\u8bc1\u8fd0\u52a8\u4fdd\u6301\uff0c\u4e3a\u89c6\u9891\u7f16\u8f91\u5956\u52b1\u8bbe\u8ba1\u63d0\u4f9b\u76f4\u63a5\u4f9d\u636e\u3002"}, {"abstract": "-05-X-03), Known Exploited Vulnerabilities (KEV) catalogs, and exploitation sightings. We introduce an evidence model implemented in Vulnerability-Lookup that selects the earliest evidence for each lifecycle event, distinguishes vulnerability-specific records, preserves date precision, and ensures traceability to original sources. Among 3,758 vulnerability identifiers with exploitation evidence, 98% have disclosure dates, while only 15.7% have patch evidence. Vendor-side dates required by VTEM are entirely absent. Most exploitation dates originate from catalog listings, including 1,041 entries associated with bulk catalog imports. After excluding these entries and ambiguous same-day observations, 59 vulnerabilities exhibit patch evidence following exploitation evidence, with a median interval of 7.6 days, predominantly between catalog listings and distributor fixes. Evidence traceability also exposes systematic measurement errors: one collector incorrectly classified exploit publications as active exploitation, accounting for 40% of initial exploitation dates, while another catalog assigned vulnerability publication timestamps to 11% of its listings. Our findings demonstrate that exploitation-to-patch intervals are computationally measurable, but their reliability depends on the availability, precision, and provenance of published evidence. We identify the additional disclosure, exploitation observation, and patch availability timestamps needed to improve vulnerability lifecycle measurements.", "arxiv_id": "2611.22479", "arxiv_url": "https://arxiv.org/abs/2611.22479", "authors": ["C\u00e9dric Bonhomme", "Alexandre Dulaunoy"], "brief": "\u7814\u7a76\u5728Vulnerability-Lookup\u4e2d\u5b9e\u73b0\u8bc1\u636e\u6a21\u578b\uff0c\u9009\u53d6\u6f0f\u6d1e\u751f\u547d\u5468\u671f\u5404\u4e8b\u4ef6\u7684\u6700\u65e9\u8bc1\u636e\uff0c\u4fdd\u7559\u65e5\u671f\u7cbe\u5ea6\u4e0e\u6765\u6e90\uff0c\u5e76\u6e05\u7406\u76ee\u5f55\u5bfc\u5165\u548c\u9519\u8bef\u5206\u7c7b\u9020\u6210\u7684\u6d4b\u91cf\u504f\u5dee\u3002", "categories": ["cs.CR"], "github_repo": "https://github.com/vulnerability-lookup/exploitation-patch-timeline-paper", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.22479", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["3758\u4e2a\u6709\u5229\u7528\u8bc1\u636e\u7684\u6f0f\u6d1e\u4e2d\uff0c\u4ec515.7%\u6709\u8865\u4e01\u8bc1\u636e", "\u6e05\u7406\u540e59\u4e2a\u6f0f\u6d1e\u7684\u4fee\u590d\u8bc1\u636e\u665a\u4e8e\u5229\u7528\u8bc1\u636e\uff0c\u4e2d\u4f4d\u95f4\u96947.6\u5929", "\u67d0\u91c7\u96c6\u5668\u8bef\u628a\u5229\u7528\u4ee3\u7801\u53d1\u5e03\u5f53\u4f5c\u5b9e\u9645\u5229\u7528\uff0c\u5360\u521d\u59cb\u5229\u7528\u65e5\u671f40%"], "keywords": ["\u6f0f\u6d1e\u7ba1\u7406", "\u7f51\u7edc\u5b89\u5168", "\u6570\u636e\u6eaf\u6e90"], "num_comments": 4, "on_hf": true, "organization": "Computer Incident Response Center Luxembourg", "pdf_url": "https://arxiv.org/pdf/2611.22479v1", "published_at": "2026-11-17", "score": 0.231, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22479.png", "title": "Exploited Before It Was Fixed? Vulnerability Timelines from Open, Machine-Readable Evidence", "tldr": "\u901a\u8fc7\u53ef\u8ffd\u6eaf\u516c\u5f00\u8bc1\u636e\u91cd\u5efa\u6f0f\u6d1e\u65f6\u95f4\u7ebf\uff0c\u63ed\u793a\u5229\u7528\u4e0e\u4fee\u590d\u95f4\u9694\u7684\u6d4b\u91cf\u504f\u5dee\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u5728Vulnerability-Lookup\u4e2d\u5b9e\u73b0\u8bc1\u636e\u6a21\u578b\uff0c\u9009\u53d6\u6f0f\u6d1e\u751f\u547d\u5468\u671f\u5404\u4e8b\u4ef6\u7684\u6700\u65e9\u8bc1\u636e\uff0c\u4fdd\u7559\u65e5\u671f\u7cbe\u5ea6\u4e0e\u6765\u6e90\uff0c\u5e76\u6e05\u7406\u76ee\u5f55\u5bfc\u5165\u548c\u9519\u8bef\u5206\u7c7b\u9020\u6210\u7684\u6d4b\u91cf\u504f\u5dee\u3002", "why_notable": "\u5c06\u6f0f\u6d1e\u5229\u7528\u5230\u4fee\u590d\u7684\u95f4\u9694\u8f6c\u5316\u4e3a\u53ef\u8ffd\u6eaf\u6d4b\u91cf\uff0c\u540c\u65f6\u63ed\u793a\u76ee\u5f55\u65f6\u95f4\u6233\u4e0e\u8bc1\u636e\u7f3a\u5931\u5982\u4f55\u626d\u66f2\u7ed3\u679c\uff0c\u4e3a\u5b89\u5168\u54cd\u5e94\u8bc4\u4f30\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "We introduce Transformation Tracking and Understanding (TTU), extending video object tracking to environments where objects undergo physical assemblies and disassemblies. TTU requires continuously tracking objects through transformations, identifying new entities, maintaining a state graph of their relationships, and assigning semantic labels to transformations. While foundation models (e.g., SAM 2/3) maintain tracklets through appearance changes, they cannot update semantic identities as objects physically evolve. Prior work addresses only disassemblies, relying on expensive searches triggered only when tracking fails. We propose Tracking Instances via Proposals and Overlaps (TIPO), a training-free framework that continuously infers transformations via a generate-evaluate-judge pipeline. TIPO generates split and merge proposals from disjoint mask components, scores them against mask-decoder priors using inner and external overlap, and queries an MLLM on the top proposal for visual verification and semantic labeling. To benchmark TTU, we curate Video Instances, States, and Transformation Annotations (VISTA), a dataset including state graphs with 124 assembly and 132 disassembly events across 50 sequences and over 26,000 frames. TIPO achieves state-of-the-art tracking and state-graph accuracy on VISTA, while operating $6\\times$ to $15\\times$ faster than prior methods. Project page: https://davidegardenal.github.io/tipo-tracking", "arxiv_id": "2611.27398", "arxiv_url": "https://arxiv.org/abs/2611.27398", "authors": ["Davide Gardenal", "Mingxuan Liu", "Flavio Vella", "Quentin Guimard", "Elisa Ricci"], "brief": "\u63d0\u51fa\u7269\u4f53\u62c6\u88c5\u8ffd\u8e2a\u4efb\u52a1\u53ca\u514d\u8bad\u7ec3\u6846\u67b6TIPO\uff0c\u4ece\u63a9\u7801\u751f\u6210\u62c6\u5206\u4e0e\u5408\u5e76\u5019\u9009\uff0c\u4ee5\u91cd\u53e0\u8bc4\u5206\u7b5b\u9009\uff0c\u518d\u7531\u591a\u6a21\u6001\u5927\u6a21\u578b\u9a8c\u8bc1\u53d8\u5316\u5e76\u8d4b\u4e88\u8bed\u4e49\u6807\u7b7e\uff0c\u6301\u7eed\u66f4\u65b0\u5b9e\u4f53\u5173\u7cfb\u56fe\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27398", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["TIPO\u7528\u5185\u5916\u91cd\u53e0\u4e0e\u63a9\u7801\u89e3\u7801\u5668\u5148\u9a8c\u8bc4\u4f30\u62c6\u5206\u3001\u5408\u5e76\u5019\u9009", "VISTA\u542b50\u6bb5\u89c6\u9891\u3001\u8d852.6\u4e07\u5e27\u53ca256\u6b21\u62c6\u88c5\u4e8b\u4ef6", "\u8ffd\u8e2a\u4e0e\u72b6\u6001\u56fe\u51c6\u786e\u7387\u8fbe\u6700\u4f18\uff0c\u6bd4\u65e2\u6709\u65b9\u6cd5\u5feb6\u81f315\u500d"], "keywords": ["\u89c6\u9891\u8ffd\u8e2a", "\u7269\u4f53\u53d8\u6362\u7406\u89e3", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u72b6\u6001\u56fe"], "num_comments": 2, "on_hf": true, "organization": "Multimedia and Human Understanding Group", "pdf_url": "https://arxiv.org/pdf/2611.27398v1", "published_at": "2026-11-20", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27398.png", "title": "Taking Apart and Putting Together: Tracking Objects Through Physical Transformations", "tldr": "\u514d\u8bad\u7ec3\u6846\u67b6\u6301\u7eed\u8bc6\u522b\u7269\u4f53\u62c6\u88c5\uff0c\u5728\u89c6\u9891\u8ffd\u8e2a\u4e2d\u66f4\u65b0\u5b9e\u4f53\u8eab\u4efd\u4e0e\u5173\u7cfb\u56fe\u3002", "upvotes": 5, "what_it_is": "\u63d0\u51fa\u7269\u4f53\u62c6\u88c5\u8ffd\u8e2a\u4efb\u52a1\u53ca\u514d\u8bad\u7ec3\u6846\u67b6TIPO\uff0c\u4ece\u63a9\u7801\u751f\u6210\u62c6\u5206\u4e0e\u5408\u5e76\u5019\u9009\uff0c\u4ee5\u91cd\u53e0\u8bc4\u5206\u7b5b\u9009\uff0c\u518d\u7531\u591a\u6a21\u6001\u5927\u6a21\u578b\u9a8c\u8bc1\u53d8\u5316\u5e76\u8d4b\u4e88\u8bed\u4e49\u6807\u7b7e\uff0c\u6301\u7eed\u66f4\u65b0\u5b9e\u4f53\u5173\u7cfb\u56fe\u3002", "why_notable": "\u5c06\u89c6\u9891\u8ffd\u8e2a\u4ece\u5916\u89c2\u8fde\u7eed\u6027\u63a8\u8fdb\u5230\u5b9e\u4f53\u8eab\u4efd\u4e0e\u5173\u7cfb\u53d8\u5316\uff0c\u5e76\u540c\u65f6\u8986\u76d6\u7ec4\u88c5\u548c\u62c6\u89e3\uff1b\u914d\u5957\u72b6\u6001\u56fe\u6807\u6ce8\u4e3a\u8bc4\u6d4b\u7269\u7406\u53d8\u5316\u7406\u89e3\u63d0\u4f9b\u57fa\u51c6\u3002"}, {"abstract": "Prompt enhancement (PE) refines concise user prompts into detailed descriptions to improve the compositional aesthetics of generated images while preserving user intent. A common practice constructs supervised fine-tuning (SFT) pairs by deriving short, user-like prompts from dense captions, implicitly assuming that captions that improve image generation also provide effective supervision. In this paper, however, we uncover a counterintuitive finding: PE models trained on caption pairs with substantial generation gains perform comparably to those trained on pairs with only marginal gains. We argue that dense captions can impose redundant supervision by requiring PE models to reproduce image-specific details weakly related to user intent. Motivated by this discrepancy, we introduce Prune to Expand (P2E), a simple text-only method that refines dense-caption supervision by selectively removing redundant sentences under a per-example deletion bound while preserving explicit user requirements and informative visual structure. Extensive experiments under identical training configurations demonstrate that P2E improves alignment with human preferences and visual quality over conventional dense-caption SFT across diverse image categories and visual generators.", "arxiv_id": "2611.27229", "arxiv_url": "https://arxiv.org/abs/2611.27229", "authors": ["Tianhe Wu", "Qilin Sun", "Kede Ma"], "brief": "\u63d0\u51fa\u7eaf\u6587\u672c\u65b9\u6cd5P2E\uff0c\u5728\u9010\u6837\u672c\u5220\u9664\u4e0a\u9650\u5185\u526a\u9664\u5bc6\u96c6\u63cf\u8ff0\u7684\u5197\u4f59\u53e5\u5b50\uff0c\u4fdd\u7559\u660e\u786e\u7528\u6237\u8981\u6c42\u4e0e\u6709\u6548\u89c6\u89c9\u7ed3\u6784\uff0c\u518d\u7528\u7cbe\u7b80\u540e\u7684\u63cf\u8ff0\u76d1\u7763\u8bad\u7ec3\u63d0\u793a\u589e\u5f3a\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27229", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u751f\u6210\u6536\u76ca\u9ad8\u4f4e\u4e0d\u540c\u7684\u63cf\u8ff0\u5bf9\uff0c\u8bad\u7ec3\u51fa\u7684PE\u6a21\u578b\u8868\u73b0\u76f8\u8fd1", "P2E\u6309\u6837\u672c\u9650\u5236\u5220\u53e5\u6570\u91cf\uff0c\u4fdd\u7559\u7528\u6237\u8981\u6c42\u4e0e\u89c6\u89c9\u7ed3\u6784", "\u76f8\u540c\u8bad\u7ec3\u914d\u7f6e\u4e0b\uff0c\u8de8\u56fe\u50cf\u7c7b\u522b\u4e0e\u751f\u6210\u5668\u4f18\u4e8e\u5bc6\u96c6\u63cf\u8ff0SFT"], "keywords": ["\u63d0\u793a\u589e\u5f3a", "\u76d1\u7763\u5fae\u8c03", "\u6570\u636e\u526a\u679d", "\u56fe\u50cf\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "City University of Hong Kong", "pdf_url": "https://arxiv.org/pdf/2611.27229v1", "published_at": "2026-11-20", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27229.png", "title": "Prune to Expand: Training Prompt Enhancers with Less to Imitate", "tldr": "\u901a\u8fc7\u5220\u51cf\u5bc6\u96c6\u63cf\u8ff0\u4e2d\u7684\u5197\u4f59\u76d1\u7763\uff0c\u8ba9\u63d0\u793a\u589e\u5f3a\u6a21\u578b\u66f4\u597d\u4fdd\u7559\u7528\u6237\u610f\u56fe\u5e76\u63d0\u5347\u56fe\u50cf\u8d28\u91cf\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u7eaf\u6587\u672c\u65b9\u6cd5P2E\uff0c\u5728\u9010\u6837\u672c\u5220\u9664\u4e0a\u9650\u5185\u526a\u9664\u5bc6\u96c6\u63cf\u8ff0\u7684\u5197\u4f59\u53e5\u5b50\uff0c\u4fdd\u7559\u660e\u786e\u7528\u6237\u8981\u6c42\u4e0e\u6709\u6548\u89c6\u89c9\u7ed3\u6784\uff0c\u518d\u7528\u7cbe\u7b80\u540e\u7684\u63cf\u8ff0\u76d1\u7763\u8bad\u7ec3\u63d0\u793a\u589e\u5f3a\u6a21\u578b\u3002", "why_notable": "\u63ed\u793a\u56fe\u50cf\u751f\u6210\u6536\u76ca\u5e76\u4e0d\u7b49\u4e8e\u76d1\u7763\u4ef7\u503c\uff0c\u4ee5\u4f4e\u590d\u6742\u5ea6\u7684\u6570\u636e\u526a\u679d\u51cf\u5c11\u65e0\u5173\u7ec6\u8282\u6a21\u4eff\uff0c\u540c\u65f6\u6539\u5584\u4eba\u7c7b\u504f\u597d\u5bf9\u9f50\u4e0e\u89c6\u89c9\u8d28\u91cf\u3002"}, {"abstract": "Personalized long-form generation asks a language model to write new text the way a specific user would. The standard recipe, retrieval-augmented generation, places a few of the user\u0027s past texts in the prompt but leaves the model to decide what to take from them. We introduce StylePrism, a taxonomy of 28 stylistic aspects in seven categories, and SP-Refine, an inference-time method that makes style extraction an explicit step: the model first fills StylePrism with the user\u0027s patterns, quoted evidence, and habits to avoid, then drafts from the user\u0027s samples and revises the draft twice against this profile, guided by its own style scores. On the three long-form tasks of LongLaMP with three LLMs, SP-Refine outperforms LongLaMP\u0027s retrieval-augmented baseline in 25 of 27 ROUGE and METEOR comparisons, by 10.2% on average and by up to 35.8%. Annotating users\u0027 own texts with the extracted profiles shows that StylePrism captures concrete, checkable habits, from the order of rhetorical moves to a reviewer\u0027s sign-off. Ablations show that the profile helps as revision guidance, not as a replacement for the samples: writing from the profile alone is worse in all 27 comparisons, while a single implicit-inference call is a cheaper alternative that comes close. Oracle variants that let the reviser see the reference, together with reference-free controls, show that larger refinement gains require information unavailable at inference time.", "arxiv_id": "2611.27211", "arxiv_url": "https://arxiv.org/abs/2611.27211", "authors": ["Jenitha Reddy Patel", "Sameeksha Kini", "Amulya Rayasam", "Anisa Dye", "Abhinav Sharma", "Sai Karthik Navuluru", "Bo Ni", "Li Li", "Junda Wu", "Tong Yu", "Nedim Lipka", "Xiaolei Huang", "Tyler Derr", "Yue Zhao", "Zhengzhong Tu", "Yu Wang", "Hongjie Chen", "Thien Huu Nguyen", "Nesreen K. Ahmed", "Franck Dernoncourt", "Ryan A. Rossi"], "brief": "\u63d0\u51fa\u6587\u98ce\u5206\u7c7b\u4f53\u7cfbStylePrism\u4e0e\u63a8\u7406\u65f6\u65b9\u6cd5SP-Refine\uff1a\u5148\u4ece\u7528\u6237\u6837\u672c\u63d0\u53d6\u4e60\u60ef\u3001\u8bc1\u636e\u53ca\u7981\u5fcc\uff0c\u518d\u7ed3\u5408\u6837\u672c\u8d77\u8349\uff0c\u6309\u81ea\u8bc4\u6587\u98ce\u5206\u6570\u4fee\u8ba2\u4e24\u8f6e\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27211", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["StylePrism\u8986\u76d67\u7c7b\u300128\u4e2a\u6587\u98ce\u7ef4\u5ea6", "3\u4e2a\u4efb\u52a1\u30013\u79cd\u6a21\u578b\uff0c27\u9879\u6bd4\u8f83\u4e2d25\u9879\u80dc\u51fa", "\u8f83\u68c0\u7d22\u589e\u5f3a\u57fa\u7ebf\u5e73\u5747\u63d0\u534710.2%\uff0c\u6700\u9ad835.8%"], "keywords": ["\u4e2a\u6027\u5316\u751f\u6210", "\u6587\u98ce\u63d0\u53d6", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u6587\u672c\u4fee\u8ba2"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27211v1", "published_at": "2026-11-20", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27211.png", "title": "Explicit Style Extraction for Personalized Long-Form Text Generation", "tldr": "\u901a\u8fc7\u663e\u5f0f\u63d0\u53d6\u7528\u6237\u6587\u98ce\u5e76\u4e24\u8f6e\u4fee\u8ba2\uff0c\u63d0\u5347\u4e2a\u6027\u5316\u957f\u6587\u672c\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u6587\u98ce\u5206\u7c7b\u4f53\u7cfbStylePrism\u4e0e\u63a8\u7406\u65f6\u65b9\u6cd5SP-Refine\uff1a\u5148\u4ece\u7528\u6237\u6837\u672c\u63d0\u53d6\u4e60\u60ef\u3001\u8bc1\u636e\u53ca\u7981\u5fcc\uff0c\u518d\u7ed3\u5408\u6837\u672c\u8d77\u8349\uff0c\u6309\u81ea\u8bc4\u6587\u98ce\u5206\u6570\u4fee\u8ba2\u4e24\u8f6e\u3002", "why_notable": "\u5c06\u9690\u5f0f\u6a21\u4eff\u8f6c\u4e3a\u53ef\u68c0\u67e5\u7684\u6587\u98ce\u753b\u50cf\uff0c\u4e3a\u4e2a\u6027\u5316\u5199\u4f5c\u63d0\u4f9b\u660e\u786e\u4fee\u8ba2\u4f9d\u636e\uff1b\u6d88\u878d\u8868\u660e\u753b\u50cf\u5e94\u8f85\u52a9\u4fee\u8ba2\uff0c\u800c\u975e\u66ff\u4ee3\u7528\u6237\u6837\u672c\u3002"}, {"abstract": "Large language models for longitudinal clinical care must revise their assessments and actions as patient information accumulates. However, benchmarks centered on isolated responses or final task outcomes provide limited insight into intermediate failures in evidence use, state updating, and action selection. We introduce WARD, a benchmark for evaluating how clinical agents translate accumulating evidence into patient-state judgments and timely, safe actions. WARD comprises 4,560 clinical tasks across seven clinical output domains, organized into 240 checkpoints from 40 longitudinal clinical trajectories spanning 95 hospitalizations. Its Longitudinal Track evaluates these tasks under controlled cumulative evidence. Its Interactive Track evaluates end-to-end, tool-mediated clinical management across 271 verifiable evidence items and 141 reference transitions. Across 12 models with scorable checkpoint outputs, evidence recognition consistently outpaces downstream state and action decisions, with linked-evidence nonresponse reaching 74.47--90.90\\%. Models also struggle to retain and update information over time, while in the Interactive Track only 11.46\\% of executed actions advance a reference transition. These results reveal a persistent evidence-to-state-to-action gap and highlight the need for process-level evaluation of longitudinal clinical agents.Code and data: https://github.com/Dingsuper-creator/WARD.", "arxiv_id": "2611.29243", "arxiv_url": "https://arxiv.org/abs/2611.29243", "authors": ["Chao Ding", "Yidong Jiang", "Junzhi Ning", "Juncheng Wu", "Yuhan Wang", "Renjie Lu", "Minjia Yuan", "Gaopeng Wang", "Liyang Wang", "Pengcheng Chen", "Dong Yin", "Meiping Wang", "Jinru Ding", "Yuyin Zhou"], "brief": "\u63d0\u51fa\u7eb5\u5411\u4e34\u5e8a\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6WARD\uff0c\u4ee5\u7d2f\u79ef\u8bc1\u636e\u4e0b\u7684\u68c0\u67e5\u70b9\u8bc4\u6d4b\u548c\u5de5\u5177\u4ea4\u4e92\u5f0f\u7ba1\u7406\u4e24\u6761\u8f68\u9053\uff0c\u62c6\u89e3\u8bc1\u636e\u8bc6\u522b\u3001\u60a3\u8005\u72b6\u6001\u66f4\u65b0\u4e0e\u884c\u52a8\u9009\u62e9\u7684\u4e2d\u95f4\u5931\u8bef\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29243", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6db5\u76d64560\u9879\u4efb\u52a1\u30017\u7c7b\u8f93\u51fa\u53ca40\u6761\u7eb5\u5411\u4e34\u5e8a\u8f68\u8ff9", "12\u4e2a\u6a21\u578b\u7684\u5173\u8054\u8bc1\u636e\u672a\u54cd\u5e94\u7387\u8fbe74.47%\u201490.90%", "\u4ea4\u4e92\u8f68\u9053\u4e2d\u4ec511.46%\u7684\u6267\u884c\u52a8\u4f5c\u63a8\u8fdb\u53c2\u8003\u72b6\u6001\u8f6c\u79fb"], "keywords": ["\u4e34\u5e8a\u667a\u80fd\u4f53", "\u7eb5\u5411\u8bc4\u6d4b", "\u72b6\u6001\u66f4\u65b0", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29243v1", "published_at": "2026-11-22", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Seeing Is Not Acting: WARD Diagnoses the Evidence-to-State-to-Action Gap in Longitudinal Clinical Agents", "tldr": "WARD\u63ed\u793a\u4e34\u5e8a\u667a\u80fd\u4f53\u867d\u80fd\u8bc6\u522b\u8bc1\u636e\uff0c\u5374\u96be\u4ee5\u6301\u7eed\u66f4\u65b0\u60a3\u8005\u72b6\u6001\u5e76\u91c7\u53d6\u6b63\u786e\u884c\u52a8\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u7eb5\u5411\u4e34\u5e8a\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6WARD\uff0c\u4ee5\u7d2f\u79ef\u8bc1\u636e\u4e0b\u7684\u68c0\u67e5\u70b9\u8bc4\u6d4b\u548c\u5de5\u5177\u4ea4\u4e92\u5f0f\u7ba1\u7406\u4e24\u6761\u8f68\u9053\uff0c\u62c6\u89e3\u8bc1\u636e\u8bc6\u522b\u3001\u60a3\u8005\u72b6\u6001\u66f4\u65b0\u4e0e\u884c\u52a8\u9009\u62e9\u7684\u4e2d\u95f4\u5931\u8bef\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u6700\u7ec8\u7ed3\u679c\u63a8\u8fdb\u5230\u4e34\u5e8a\u51b3\u7b56\u8fc7\u7a0b\uff0c\u63ed\u793a\u8bc6\u522b\u8bc1\u636e\u4e0d\u7b49\u4e8e\u6b63\u786e\u884c\u52a8\uff0c\u4e3a\u5b9a\u4f4d\u7eb5\u5411\u667a\u80fd\u4f53\u7684\u4fe1\u606f\u9057\u5fd8\u4e0e\u51b3\u7b56\u5931\u8bef\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Gaussian Splatting has achieved high visual quality in novel view synthesis, but the accuracy of its rendered geometry remains a challenge. In particular, the rendered depth is computed as an opacity-weighted average along each ray, which may not correspond to the actual scene surface. In this paper, we observe that depth predictions from different views of the same frozen Gaussian representation exhibit complementary errors, allowing us to improve novel-view geometry using information from other views without modifying the original representation. Based on this observation, we propose REVEAL, a general framework that selectively refines novel-view depth using complementary geometric information. Specifically, we first reproject depth predictions from source views to the target view and combine them using robust multi-view consensus. We then introduce a learned selection mechanism to determine whether the candidate depth is more accurate than the original prediction, based on the expected reduction in depth error. In addition, we introduce RIG, a real-world benchmark captured with synchronized RGB-D cameras, which provides ground-truth depth for evaluating both static and dynamic reconstruction models. Experiments on 6 Gaussian Splatting backbones across 3 benchmarks show that REVEAL consistently improves depth accuracy while maintaining comparable rendering quality.", "arxiv_id": "2611.29236", "arxiv_url": "https://arxiv.org/abs/2611.29236", "authors": ["Mingle Jiang", "Jikui Zhou", "Chenghan Lyu", "Rui Xu", "Yunke Wang", "Chang Xu"], "brief": "REVEAL\u5c06\u6e90\u89c6\u89d2\u6df1\u5ea6\u91cd\u6295\u5f71\u5230\u76ee\u6807\u89c6\u89d2\uff0c\u4ee5\u9c81\u68d2\u591a\u89c6\u89d2\u5171\u8bc6\u751f\u6210\u5019\u9009\u6df1\u5ea6\uff0c\u518d\u7528\u5b66\u4e60\u5f0f\u9009\u62e9\u673a\u5236\u5224\u65ad\u662f\u5426\u66ff\u6362\u539f\u9884\u6d4b\uff0c\u5168\u7a0b\u4fdd\u6301\u539f\u9ad8\u65af\u8868\u793a\u4e0d\u53d8\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29236", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u9c81\u68d2\u591a\u89c6\u89d2\u5171\u8bc6\u878d\u5408\u91cd\u6295\u5f71\u6df1\u5ea6", "\u5b66\u4e60\u5f0f\u9009\u62e9\u4f9d\u636e\u9884\u671f\u6df1\u5ea6\u8bef\u5dee\u4e0b\u964d\u51b3\u5b9a\u66ff\u6362", "\u63a8\u51fa\u540c\u6b65RGB-D\u57fa\u51c6RIG\uff0c\u5e76\u6d4b\u8bd56\u79cd\u9aa8\u5e72\u30013\u4e2a\u57fa\u51c6"], "keywords": ["\u9ad8\u65af\u6cfc\u6e85", "\u65b0\u89c6\u89d2\u5408\u6210", "\u6df1\u5ea6\u4f30\u8ba1", "\u591a\u89c6\u89d2\u51e0\u4f55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29236v1", "published_at": "2026-11-22", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Complementary Geometry in Gaussian Splatting", "tldr": "\u5229\u7528\u8de8\u89c6\u89d2\u6df1\u5ea6\u8bef\u5dee\u7684\u4e92\u8865\u6027\uff0c\u65e0\u9700\u4fee\u6539\u9ad8\u65af\u8868\u793a\u5373\u53ef\u63d0\u5347\u65b0\u89c6\u89d2\u51e0\u4f55\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": "REVEAL\u5c06\u6e90\u89c6\u89d2\u6df1\u5ea6\u91cd\u6295\u5f71\u5230\u76ee\u6807\u89c6\u89d2\uff0c\u4ee5\u9c81\u68d2\u591a\u89c6\u89d2\u5171\u8bc6\u751f\u6210\u5019\u9009\u6df1\u5ea6\uff0c\u518d\u7528\u5b66\u4e60\u5f0f\u9009\u62e9\u673a\u5236\u5224\u65ad\u662f\u5426\u66ff\u6362\u539f\u9884\u6d4b\uff0c\u5168\u7a0b\u4fdd\u6301\u539f\u9ad8\u65af\u8868\u793a\u4e0d\u53d8\u3002", "why_notable": "\u5c06\u51e0\u4f55\u6539\u8fdb\u4e0e\u9ad8\u65af\u8868\u793a\u4f18\u5316\u89e3\u8026\uff0c\u8de8\u591a\u79cd\u9aa8\u5e72\u6301\u7eed\u63d0\u5347\u6df1\u5ea6\u7cbe\u5ea6\u4e14\u4fdd\u6301\u76f8\u8fd1\u6e32\u67d3\u8d28\u91cf\uff1b\u65b0\u57fa\u51c6\u4e5f\u652f\u6301\u9759\u6001\u4e0e\u52a8\u6001\u91cd\u5efa\u8bc4\u6d4b\u3002"}, {"abstract": "Large convolution kernels enlarge the receptive fields of ConvNets at a modest computational cost, but they are notoriously difficult to train. Existing large-kernel networks therefore rely on costly training techniques, such as parallel small-kernel branches with batch normalization. In this paper, we trace this difficulty to adaptive optimizers such as Adam, which normalize the update of every weight separately. Since input features rarely average to zero, all weights of a kernel share a common gradient, and these optimizers move the mean of a $k\\times k$ kernel $k$ times as far as a single parameter. We find this mean amplification in widely used ConvNets and vision transformers, and show that it can force the maximal learning rate to fall as $1/k^2$. We further prove that the basis of the discrete cosine transform (DCT) isolates the mean and is the only orthonormal basis that diagonalizes every stationary gradient statistic with mirrored boundaries. We therefore train large kernels through their DCT coefficients and convert them back after training. The resulting method, DCT-Rep, requires only a few lines of code and adds no parameters, no inference cost and negligible training overhead. Extensive experiments on image classification, object detection, semantic segmentation and image restoration show that DCT-Rep consistently improves large-kernel ConvNets and vision transformers, by $+0.79\\%$ top-1 accuracy for a large-kernel ConvNeXt-T and $+0.43\\%$ for ViT-S/16 on ImageNet-1K, $+1.4$ box AP on COCO, $+1.2$ mIoU on ADE20K and up to $+0.4$ dB on image deblurring, where the gain grows with the kernel size.", "arxiv_id": "2611.29232", "arxiv_url": "https://arxiv.org/abs/2611.29232", "authors": ["Tianyu Ding", "Jiachen Jiang", "Jinxin Zhou", "Yong Ma", "Zhihui Zhu", "Luming Liang"], "brief": "\u7814\u7a76\u5c06\u5927\u5377\u79ef\u6838\u8bad\u7ec3\u56f0\u96be\u5f52\u56e0\u4e8eAdam\u7b49\u4f18\u5316\u5668\u7684\u9010\u6743\u91cd\u5f52\u4e00\u5316\u3002\u63d0\u51faDCT-Rep\uff0c\u5728\u79bb\u6563\u4f59\u5f26\u7cfb\u6570\u4e0a\u8bad\u7ec3\u4ee5\u9694\u79bb\u5747\u503c\uff0c\u8bad\u7ec3\u540e\u8f6c\u6362\u56de\u5377\u79ef\u6743\u91cd\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29232", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5747\u503c\u66f4\u65b0\u653e\u5927k\u500d\uff0c\u6700\u5927\u5b66\u4e60\u7387\u53ef\u964d\u81f31/k\u00b2", "DCT-Rep\u4e0d\u589e\u53c2\u6570\u4e0e\u63a8\u7406\u6210\u672c\uff0c\u8bad\u7ec3\u5f00\u9500\u53ef\u5ffd\u7565", "ConvNeXt-T\u51c6\u786e\u7387\u589e0.79%\uff0cCOCO\u589e1.4 AP"], "keywords": ["\u81ea\u9002\u5e94\u4f18\u5316", "\u5927\u6838\u5377\u79ef", "\u79bb\u6563\u4f59\u5f26\u53d8\u6362", "\u89c6\u89c9\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29232v1", "published_at": "2026-11-22", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Why Adaptive Optimizers Struggle with Large Convolution Kernels", "tldr": "\u7814\u7a76\u63ed\u793a\u81ea\u9002\u5e94\u4f18\u5316\u5668\u653e\u5927\u5927\u5377\u79ef\u6838\u5747\u503c\u66f4\u65b0\uff0c\u5e76\u7528\u4f59\u5f26\u57df\u8bad\u7ec3\u7f13\u89e3\u4e0d\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5c06\u5927\u5377\u79ef\u6838\u8bad\u7ec3\u56f0\u96be\u5f52\u56e0\u4e8eAdam\u7b49\u4f18\u5316\u5668\u7684\u9010\u6743\u91cd\u5f52\u4e00\u5316\u3002\u63d0\u51faDCT-Rep\uff0c\u5728\u79bb\u6563\u4f59\u5f26\u7cfb\u6570\u4e0a\u8bad\u7ec3\u4ee5\u9694\u79bb\u5747\u503c\uff0c\u8bad\u7ec3\u540e\u8f6c\u6362\u56de\u5377\u79ef\u6743\u91cd\u3002", "why_notable": "\u628a\u5927\u6838\u8bad\u7ec3\u74f6\u9888\u5b9a\u4f4d\u5230\u4f18\u5316\u5668\u7684\u66f4\u65b0\u51e0\u4f55\uff0c\u5e76\u7ed9\u51fa\u4f4e\u6210\u672c\u4fee\u6b63\uff1b\u6536\u76ca\u8986\u76d6\u5206\u7c7b\u3001\u68c0\u6d4b\u3001\u5206\u5272\u4e0e\u590d\u539f\uff0c\u4e14\u968f\u6838\u5c3a\u5bf8\u589e\u5927\u3002"}, {"abstract": "Most established instance-retrieval benchmarks emphasise landmarks; small sculptures from visually similar series offer a complementary challenge. We introduce Doppeldwarf-306: 1,691 openly licensed photographs of 306 bronze dwarf statues in Wroc\u0142aw, Poland, many made in themed series that share one style, with the photographer of each image recorded. With no training, nearest-neighbour search over frozen DINOv2 features names the right statue first for 93.1% of leave-one-out queries, and the best of thirteen backbones from seven pretraining paradigms reaches 94.7%. Accuracy falls slowly as candidates are added: for DINOv2, by about 0.8 points each time their number doubles. A natural design for a phone guide compares a photograph only with statues near the user. In simulation this helps, but less than an equal number of randomly chosen statues does, so random subsampling overstates its value; a permutation test ties the penalty to the real layout (p = 0.005). Used as a weight instead of a filter, location raises DINOv2 from 93.4% to 98.7% for a simulated user 25 m from the statue. With the query\u0027s photographer withheld, learned local-feature matching raises DINOv2 accuracy from 81.8% to 85.5% and also improves DINOv3. Comparing the two best candidates cuts DINOv2\u0027s false acceptance of unknown statues from 38.3% to 19.6% at 90% known acceptance.", "arxiv_id": "2611.27490", "arxiv_url": "https://arxiv.org/abs/2611.27490", "authors": ["Turhan Can Kargin"], "brief": "\u7814\u7a76\u6784\u5efa\u5305\u542b\u8fd1\u4f3c\u9752\u94dc\u96d5\u50cf\u7684\u5b9e\u4f8b\u68c0\u7d22\u57fa\u51c6\uff0c\u4ee5\u51bb\u7ed3\u89c6\u89c9\u7279\u5f81\u8fdb\u884c\u514d\u8bad\u7ec3\u68c0\u7d22\uff0c\u5e76\u8bc4\u4f30\u4f4d\u7f6e\u5148\u9a8c\u3001\u5c40\u90e8\u7279\u5f81\u5339\u914d\u53ca\u672a\u77e5\u5b9e\u4f8b\u62d2\u8bc6\u7b56\u7565\u3002", "categories": ["cs.CV", "cs.IR"], "github_repo": "https://github.com/turhancan97/doppeldwarf-306", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27490", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["Doppeldwarf-306\u542b306\u5ea7\u96d5\u50cf\u30011691\u5f20\u7167\u7247", "\u51bb\u7ed3DINOv2\u7559\u4e00\u68c0\u7d22\u9996\u4f4d\u51c6\u786e\u7387\u8fbe93.1%", "\u6a21\u62df\u7528\u6237\u8ddd\u96d5\u50cf25\u7c73\uff0c\u4f4d\u7f6e\u52a0\u6743\u51c6\u786e\u7387\u8fbe98.7%"], "keywords": ["\u5b9e\u4f8b\u68c0\u7d22", "\u89c6\u89c9\u8868\u5f81", "\u4f4d\u7f6e\u5148\u9a8c", "\u5f00\u653e\u96c6\u8bc6\u522b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.27490v1", "published_at": "2026-11-20", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27490.png", "title": "Which Dwarf Is This? Doppeldwarf-306 and Near-Identical Instance Retrieval", "tldr": "\u65b0\u96d5\u50cf\u68c0\u7d22\u57fa\u51c6\u63ed\u793a\u8fd1\u4f3c\u5b9e\u4f8b\u8bc6\u522b\u96be\u70b9\uff0c\u4f4d\u7f6e\u52a0\u6743\u663e\u8457\u63d0\u5347\u8bc6\u522b\u7387\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u6784\u5efa\u5305\u542b\u8fd1\u4f3c\u9752\u94dc\u96d5\u50cf\u7684\u5b9e\u4f8b\u68c0\u7d22\u57fa\u51c6\uff0c\u4ee5\u51bb\u7ed3\u89c6\u89c9\u7279\u5f81\u8fdb\u884c\u514d\u8bad\u7ec3\u68c0\u7d22\uff0c\u5e76\u8bc4\u4f30\u4f4d\u7f6e\u5148\u9a8c\u3001\u5c40\u90e8\u7279\u5f81\u5339\u914d\u53ca\u672a\u77e5\u5b9e\u4f8b\u62d2\u8bc6\u7b56\u7565\u3002", "why_notable": "\u4e3a\u5730\u6807\u4e4b\u5916\u7684\u7ec6\u7c92\u5ea6\u5b9e\u4f8b\u68c0\u7d22\u63d0\u4f9b\u65b0\u6d4b\u8bd5\u573a\u666f\uff0c\u5e76\u63ed\u793a\u968f\u673a\u5019\u9009\u62bd\u6837\u4f1a\u9ad8\u4f30\u4f4d\u7f6e\u7b5b\u9009\u6536\u76ca\uff0c\u5bf9\u624b\u673a\u5bfc\u89c8\u7cfb\u7edf\u8bbe\u8ba1\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "During iterative code modification, coding agents may continue to rely in subsequent reasoning on outdated dependency judgments whose text remains fixed in the context, leading to errors in subsequent reasoning and leaving consumer defects undetected by the original task evaluations, thereby exposing blind spots in the tested benchmarks. We study actual agent execution trajectories collected on benchmark tasks: deepseek-v4-flash runs on DeepSWE and SWE-bench Verified, supplemented by Qwen3.8-Flash cases on FeatureBench. Focusing on edit-induced consumer obligations, a full-corpus blinded human audit of the DeepSWE runs identifies terminal mismatches, including diagnoses whose task scope remains disputed. Following supplementary execution checks, all retained DeepSWE terminal events have execution support. The audit also shows that recovery within a trajectory can coexist with terminal omissions in the same run. The process analysis links the presentation of relevant consumer code to explicit dependency judgments and subsequent synchronization actions recorded in the trajectories. An explicit dependency-review prompt reduces terminal omissions under the tested conditions, supporting re-derivation of consumer obligations after edits. Local replays of selected DeepSWE cases show that synchronizing the diagnosed consumers restores the target behavior while the listed controls continue to pass. Cross-benchmark execution counterexamples show that the original task evaluations do not fully detect edit-induced dependency mismatches: patches pass those evaluations, yet additional execution checks confirm unintended defects along existing consumer paths. These findings support measuring task scores, terminal propagation states, and recovery separately.", "arxiv_id": "2611.29242", "arxiv_url": "https://arxiv.org/abs/2611.29242", "authors": ["Fei Ding"], "brief": "\u7814\u7a76\u5ba1\u8ba1\u591a\u4e2a\u4ee3\u7801\u57fa\u51c6\u4e0a\u7684\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\uff0c\u8ffd\u8e2a\u4fee\u6539\u540e\u9057\u6f0f\u7684\u4e0b\u6e38\u9002\u914d\u4e49\u52a1\u3002\u901a\u8fc7\u6267\u884c\u68c0\u67e5\u3001\u5c40\u90e8\u91cd\u653e\u4e0e\u4f9d\u8d56\u590d\u5ba1\u63d0\u793a\uff0c\u9a8c\u8bc1\u7f3a\u9677\u53ca\u5176\u4fee\u590d\u8def\u5f84\u3002", "categories": ["cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29242", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["DeepSWE\u5168\u91cf\u76f2\u5ba1\uff1a\u4fdd\u7559\u7684\u7ec8\u6001\u9057\u6f0f\u5747\u83b7\u6267\u884c\u652f\u6301", "\u663e\u5f0f\u4f9d\u8d56\u590d\u5ba1\u63d0\u793a\u5728\u6d4b\u8bd5\u6761\u4ef6\u4e0b\u964d\u4f4e\u7ec8\u6001\u9057\u6f0f", "\u8de8\u57fa\u51c6\u53cd\u4f8b\uff1a\u8865\u4e01\u901a\u8fc7\u539f\u8bc4\u6d4b\uff0c\u4e0b\u6e38\u4ecd\u6709\u6267\u884c\u7f3a\u9677"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u4f9d\u8d56\u5206\u6790", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u8bc4\u6d4b\u76f2\u70b9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29242v1", "published_at": "2026-11-22", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Edit-Induced Dependency Mismatch: Propagation Omissions, Recovery, and Evaluation Blind Spots in Coding Agents", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u4fee\u6539\u4ee3\u7801\u540e\u53ef\u80fd\u6cbf\u7528\u8fc7\u65f6\u4f9d\u8d56\u5224\u65ad\uff0c\u9057\u6f0f\u4e0b\u6e38\u540c\u6b65\u4e14\u9003\u8fc7\u8bc4\u6d4b\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5ba1\u8ba1\u591a\u4e2a\u4ee3\u7801\u57fa\u51c6\u4e0a\u7684\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\uff0c\u8ffd\u8e2a\u4fee\u6539\u540e\u9057\u6f0f\u7684\u4e0b\u6e38\u9002\u914d\u4e49\u52a1\u3002\u901a\u8fc7\u6267\u884c\u68c0\u67e5\u3001\u5c40\u90e8\u91cd\u653e\u4e0e\u4f9d\u8d56\u590d\u5ba1\u63d0\u793a\uff0c\u9a8c\u8bc1\u7f3a\u9677\u53ca\u5176\u4fee\u590d\u8def\u5f84\u3002", "why_notable": "\u63ed\u793a\u4efb\u52a1\u901a\u8fc7\u7387\u53ef\u80fd\u63a9\u76d6\u4fee\u6539\u5f15\u53d1\u7684\u4e0b\u6e38\u7f3a\u9677\uff0c\u4e14\u9014\u4e2d\u6062\u590d\u4e0d\u7b49\u4e8e\u6700\u7ec8\u65e0\u9057\u6f0f\uff0c\u4e3a\u5206\u522b\u8bc4\u4f30\u4efb\u52a1\u5f97\u5206\u3001\u7ec8\u6001\u4f20\u64ad\u4e0e\u6062\u590d\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "We introduce Egocentric Human Motion Bridging, a task that generates a coherent 3D human motion sequence from two endpoint egocentric images. Unlike conventional motion in-betweening, which requires structured 3D endpoint poses, this setting uses raw first-person observations available from wearable devices in VR/AR and robotics. It presents challenges due to viewpoint variations, partial body visibility, and temporal ambiguity under cross-modal endpoint constraints. To address these challenges, we propose Ego-HMB, a unified diffusion-based framework that learns endpoint pose estimation and temporally consistent motion infilling within a single model through two training stages. First, Egocentric-to-Canonical Pretraining uses a hierarchical curriculum with progressively increasing temporal spans to strengthen endpoint pose priors. Second, Motion Bridge Diffusion Training incorporates endpoint and physics awareness, diffusing from neighboring poses to promote temporal continuity while preserving global endpoint constraints. Extensive experiments compare our approach with one-stage methods that directly generate motion from two egocentric images and two-stage pipelines that combine endpoint pose estimation with motion interpolation. Ego-HMB consistently outperforms these baselines in endpoint accuracy and motion generation quality. Code is available at https://github.com/gaogehan/Ego-HMB.", "arxiv_id": "2611.29218", "arxiv_url": "https://arxiv.org/abs/2611.29218", "authors": ["Gaoge Han", "Yongkang Cheng", "Shaoli Huang", "Jing Zhang", "Mingming Gong", "Fakhri Karray", "Tongliang Liu"], "brief": "\u63d0\u51fa\u7edf\u4e00\u6269\u6563\u6846\u67b6\uff0c\u4ece\u4e24\u5f20\u7b2c\u4e00\u4eba\u79f0\u56fe\u50cf\u8865\u5168\u4e09\u7ef4\u4eba\u4f53\u8fd0\u52a8\u3002\u5148\u4ee5\u9010\u6b65\u6269\u5c55\u65f6\u95f4\u8de8\u5ea6\u7684\u8bfe\u7a0b\u9884\u8bad\u7ec3\u5b66\u4e60\u7aef\u70b9\u59ff\u6001\uff0c\u518d\u7528\u7aef\u70b9\u4e0e\u7269\u7406\u611f\u77e5\u7684\u8fd0\u52a8\u6865\u6269\u6563\u751f\u6210\u8fde\u7eed\u52a8\u4f5c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29218", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Egocentric-to-Canonical\u9884\u8bad\u7ec3\u9010\u6b65\u6269\u5927\u65f6\u95f4\u8de8\u5ea6", "Motion Bridge Diffusion\u4ece\u76f8\u90bb\u59ff\u6001\u6269\u6563", "\u7aef\u70b9\u7cbe\u5ea6\u4e0e\u52a8\u4f5c\u8d28\u91cf\u5747\u4f18\u4e8e\u5355\u9636\u6bb5\u53ca\u4e24\u9636\u6bb5\u57fa\u7ebf"], "keywords": ["\u4eba\u4f53\u8fd0\u52a8\u751f\u6210", "\u7b2c\u4e00\u4eba\u79f0\u89c6\u89c9", "\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29218v1", "published_at": "2026-11-22", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Ego-HMB: Human Motion Bridging from Egocentric Images via A Motion Bridge Diffusion Model", "tldr": "\u7528\u4e24\u5f20\u7b2c\u4e00\u4eba\u79f0\u7aef\u70b9\u56fe\u50cf\u751f\u6210\u8fde\u8d2f\u4e09\u7ef4\u4eba\u4f53\u52a8\u4f5c\uff0c\u517c\u987e\u7aef\u70b9\u51c6\u786e\u6027\u4e0e\u65f6\u5e8f\u8fde\u7eed\u6027\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u7edf\u4e00\u6269\u6563\u6846\u67b6\uff0c\u4ece\u4e24\u5f20\u7b2c\u4e00\u4eba\u79f0\u56fe\u50cf\u8865\u5168\u4e09\u7ef4\u4eba\u4f53\u8fd0\u52a8\u3002\u5148\u4ee5\u9010\u6b65\u6269\u5c55\u65f6\u95f4\u8de8\u5ea6\u7684\u8bfe\u7a0b\u9884\u8bad\u7ec3\u5b66\u4e60\u7aef\u70b9\u59ff\u6001\uff0c\u518d\u7528\u7aef\u70b9\u4e0e\u7269\u7406\u611f\u77e5\u7684\u8fd0\u52a8\u6865\u6269\u6563\u751f\u6210\u8fde\u7eed\u52a8\u4f5c\u3002", "why_notable": "\u5c06\u52a8\u4f5c\u8865\u5168\u7684\u8f93\u5165\u4ece\u7ed3\u6784\u5316\u4e09\u7ef4\u59ff\u6001\u63a8\u8fdb\u5230\u53ef\u7a7f\u6234\u8bbe\u5907\u7684\u539f\u59cb\u56fe\u50cf\uff0c\u4e3a\u865a\u62df\u73b0\u5b9e\u3001\u589e\u5f3a\u73b0\u5b9e\u53ca\u673a\u5668\u4eba\u573a\u666f\u63d0\u4f9b\u66f4\u76f4\u63a5\u7684\u8fd0\u52a8\u91cd\u5efa\u8def\u5f84\u3002"}, {"abstract": "We present PartPO, a reinforcement learning method for generating structured shape programs from 3D point clouds. Existing shape-to-program models are trained with supervised learning on procedurally generated data and generalize poorly to more diverse shapes, while reinforcement learning from execution feedback assigns a single scalar reward to a long program that builds many parts, making credit assignment difficult. PartPO instead builds on a core property of the task: shape programs are self-describing, with each semantically named part produced by its own code block. It segments each generated program by its parts and applies part-level rewards only to the code of the corresponding part, a category reward only to the object name, and a shape-level reward to the whole program. The required part supervision is obtained without manual annotation, by grounding part names on target meshes with an open-vocabulary segmentation model prompt-tuned on the model\u0027s own outputs. Applied to MeshCoder, PartPO improves reconstruction accuracy and execution success on ShapeNetCore and ABO over the base model, rejection-sampling fine-tuning and trajectory-level RL, and generalizes to the unseen HSSD dataset. Code will be released at https://github.com/HannuoZ/PartPO.", "arxiv_id": "2611.29213", "arxiv_url": "https://arxiv.org/abs/2611.29213", "authors": ["Hannuo Zhang", "Zhixiang Chi", "Xuanchen Li", "Yiqun Zhou", "Yang Wang", "Xinxin Zuo"], "brief": "PartPO\u5229\u7528\u5f62\u72b6\u7a0b\u5e8f\u4e2d\u8bed\u4e49\u90e8\u4ef6\u4e0e\u4ee3\u7801\u5757\u7684\u5bf9\u5e94\u5173\u7cfb\uff0c\u5c06\u5956\u52b1\u5206\u914d\u5230\u90e8\u4ef6\u3001\u7c7b\u522b\u548c\u6574\u6bb5\u7a0b\u5e8f\uff0c\u5e76\u501f\u52a9\u5f00\u653e\u8bcd\u6c47\u5206\u5272\u81ea\u52a8\u83b7\u53d6\u90e8\u4ef6\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29213", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u90e8\u4ef6\u5956\u52b1\u5bf9\u5e94\u4ee3\u7801\u5757\uff0c\u7c7b\u522b\u5956\u52b1\u4ec5\u4f5c\u7528\u4e8e\u5bf9\u8c61\u540d\u79f0", "\u5f00\u653e\u8bcd\u6c47\u5206\u5272\u5229\u7528\u6a21\u578b\u81ea\u8eab\u8f93\u51fa\u8c03\u4f18\u63d0\u793a\uff0c\u65e0\u9700\u4eba\u5de5\u6807\u6ce8", "\u57fa\u4e8eMeshCoder\u4f18\u5316\uff0c\u5728ShapeNetCore\u3001ABO\u63d0\u5347\u5e76\u6cdb\u5316\u81f3HSSD"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u7a0b\u5e8f\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29213v1", "published_at": "2026-11-22", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PartPO: Part-Level Policy Optimization for Shape-to-Program Generation", "tldr": "\u901a\u8fc7\u90e8\u4ef6\u7ea7\u5956\u52b1\u4f18\u5316\u4e09\u7ef4\u70b9\u4e91\u5230\u7a0b\u5e8f\u7684\u751f\u6210\uff0c\u63d0\u5347\u5f62\u72b6\u91cd\u5efa\u4e0e\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": "PartPO\u5229\u7528\u5f62\u72b6\u7a0b\u5e8f\u4e2d\u8bed\u4e49\u90e8\u4ef6\u4e0e\u4ee3\u7801\u5757\u7684\u5bf9\u5e94\u5173\u7cfb\uff0c\u5c06\u5956\u52b1\u5206\u914d\u5230\u90e8\u4ef6\u3001\u7c7b\u522b\u548c\u6574\u6bb5\u7a0b\u5e8f\uff0c\u5e76\u501f\u52a9\u5f00\u653e\u8bcd\u6c47\u5206\u5272\u81ea\u52a8\u83b7\u53d6\u90e8\u4ef6\u76d1\u7763\u3002", "why_notable": "\u5c06\u957f\u7a0b\u5e8f\u7684\u4fe1\u7528\u5206\u914d\u7ec6\u5316\u5230\u8bed\u4e49\u90e8\u4ef6\uff0c\u540c\u65f6\u514d\u53bb\u4eba\u5de5\u90e8\u4ef6\u6807\u6ce8\uff0c\u4e3a\u6267\u884c\u53cd\u9988\u9a71\u52a8\u7684\u7ed3\u6784\u5316\u4e09\u7ef4\u751f\u6210\u63d0\u4f9b\u66f4\u6709\u6548\u7684\u4f18\u5316\u8def\u5f84\u3002"}, {"abstract": "In difficult driving scenes, a learned scorer can select a poor trajectory from a fixed pool even when a better candidate is available. Nearby vehicles and road boundaries can also leave only a narrow range of high-scoring maneuvers. These constraints vary with the scene and are difficult to cover exhaustively during training. We introduce DriveTTO, a training-free method that searches around native proposals and checks each proposed refinement against a retained trajectory. A frozen scorer evaluates completed paths at the endpoints they actually reach, guiding resampling in progressively smaller neighborhoods. From a shared reference, one branch draws on planner proposals and another perturbs vehicle controls. DriveTTO blends their poses at matching times and accepts a branch or fusion update only when both frozen scorers predict a gain. On Navtest, DriveTTO recovers nonzero predictive driver model scores (PDMS) in 51.35% of native zero-score cases on average. Accounting for new failures, the zero-score rate falls from 1.63% to 1.13%. Benchmark-specific configurations achieve 95.54 PDMS and 92.30 extended PDMS (EPDMS) on Navtest, 57.10 EPDMS on Navhard, and 40.1 HD-Score on HUGSIM under observed commands. With a single frozen scorer, DriveTTO-S improves all six evaluated planners on both Navtest and Navhard.", "arxiv_id": "2611.29205", "arxiv_url": "https://arxiv.org/abs/2611.29205", "authors": ["Xinyao Rao", "Zecheng Tang", "Zheyuan Lai", "Liuxuan Sun", "Minjun Yu", "Xun Cao", "Wei Li"], "brief": "DriveTTO\u56f4\u7ed5\u539f\u751f\u8f68\u8ff9\u63d0\u6848\u9010\u6b65\u7f29\u5c0f\u641c\u7d22\u90bb\u57df\uff0c\u4f7f\u7528\u51bb\u7ed3\u8bc4\u5206\u5668\u8bc4\u4ef7\u5b9e\u9645\u5230\u8fbe\u7ec8\u70b9\u7684\u5b8c\u6574\u8def\u5f84\u3002\u5b83\u878d\u5408\u89c4\u5212\u63d0\u6848\u4e0e\u63a7\u5236\u6270\u52a8\u5206\u652f\uff0c\u4ec5\u5728\u53cc\u8bc4\u5206\u5668\u5747\u9884\u6d4b\u589e\u76ca\u65f6\u63a5\u53d7\u66f4\u65b0\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29205", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u5206\u652f\u5206\u522b\u641c\u7d22\u89c4\u5212\u63d0\u6848\u4e0e\u63a7\u5236\u6270\u52a8\uff0c\u6309\u65f6\u95f4\u5bf9\u9f50\u878d\u5408\u4f4d\u59ff", "Navtest\u539f\u751f\u96f6\u5206\u6848\u4f8b\u4e2d\uff0c\u5e73\u574751.35%\u6062\u590d\u975e\u96f6PDMS", "\u5355\u8bc4\u5206\u5668DriveTTO-S\u5728\u4e24\u9879\u57fa\u51c6\u4e0a\u6539\u5584\u5168\u90e86\u4e2a\u89c4\u5212\u5668"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u8f68\u8ff9\u4f18\u5316", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u7aef\u5230\u7aef\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29205v1", "published_at": "2026-11-22", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DriveTTO: Understanding Search and Selection in Test-Time Trajectory Optimization for End-to-End Driving", "tldr": "\u65e0\u9700\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u8f68\u8ff9\u4f18\u5316\uff0c\u901a\u8fc7\u53cc\u5206\u652f\u641c\u7d22\u4e0e\u8bc4\u5206\u7b5b\u9009\u6539\u5584\u7aef\u5230\u7aef\u9a7e\u9a76\u89c4\u5212\u3002", "upvotes": 0, "what_it_is": "DriveTTO\u56f4\u7ed5\u539f\u751f\u8f68\u8ff9\u63d0\u6848\u9010\u6b65\u7f29\u5c0f\u641c\u7d22\u90bb\u57df\uff0c\u4f7f\u7528\u51bb\u7ed3\u8bc4\u5206\u5668\u8bc4\u4ef7\u5b9e\u9645\u5230\u8fbe\u7ec8\u70b9\u7684\u5b8c\u6574\u8def\u5f84\u3002\u5b83\u878d\u5408\u89c4\u5212\u63d0\u6848\u4e0e\u63a7\u5236\u6270\u52a8\u5206\u652f\uff0c\u4ec5\u5728\u53cc\u8bc4\u5206\u5668\u5747\u9884\u6d4b\u589e\u76ca\u65f6\u63a5\u53d7\u66f4\u65b0\u3002", "why_notable": "\u5c06\u6539\u8fdb\u91cd\u70b9\u4ece\u8bad\u7ec3\u8f6c\u5411\u63a8\u7406\u65f6\u641c\u7d22\u4e0e\u7b5b\u9009\uff0c\u63d0\u4f9b\u53ef\u590d\u7528\u7684\u89c4\u5212\u589e\u5f3a\u673a\u5236\uff1b\u8ba1\u5165\u65b0\u589e\u5931\u8d25\u540e\uff0c\u96f6\u5206\u7387\u4ecd\u4ece1.63%\u964d\u81f31.13%\u3002"}, {"abstract": "Music creation is inherently iterative, yet many symbolic generation systems still center on producing or regenerating isolated outputs. We present IteraSong, an interactive web-based Digital Audio Workstation (DAW) for LLM-guided iterative symbolic music creation. Unlike one-shot generation systems, IteraSong supports a generate-audition-edit-refine loop over a persistent multi-track project. Users initialize a fully labeled pop draft, then progressively refine it through natural-language instructions. The LLM maps requests to a hierarchical action space of editing primitives exposed via Model Context Protocol (MCP) tools, spanning global, track, section, and bar/note scopes. The demo enables attendees to edit multi-track compositions in natural language, apply deterministic and generative edits, and undo/redo changes in real time.", "arxiv_id": "2611.29225", "arxiv_url": "https://arxiv.org/abs/2611.29225", "authors": ["Di Lu", "Xinran Zhang", "Yan Gao", "Yuan Zhang", "Xiaoqing Wang", "Qingwen Zhou", "Xiaobing Li", "Maosong Sun"], "brief": "IteraSong\u662f\u4e00\u6b3e\u4ea4\u4e92\u5f0f\u7f51\u9875\u97f3\u4e50\u5de5\u4f5c\u7ad9\uff0c\u652f\u6301\u4ece\u6d41\u884c\u97f3\u4e50\u8349\u7a3f\u51fa\u53d1\u53cd\u590d\u8bd5\u542c\u4e0e\u4fee\u6539\u3002\u5927\u6a21\u578b\u901a\u8fc7MCP\u5de5\u5177\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u6620\u5c04\u4e3a\u5206\u5c42\u97f3\u4e50\u7f16\u8f91\u64cd\u4f5c\u3002", "categories": ["cs.SD", "cs.CL", "cs.SC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29225", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u5728\u6301\u4e45\u591a\u8f68\u9879\u76ee\u4e0a\u5b9e\u73b0\u751f\u6210\u3001\u8bd5\u542c\u3001\u7f16\u8f91\u4e0e\u7ec6\u5316\u5faa\u73af", "MCP\u5de5\u5177\u8986\u76d6\u5168\u5c40\u3001\u97f3\u8f68\u3001\u6bb5\u843d\u53ca\u5c0f\u8282\uff0f\u97f3\u7b26\u5c42\u7ea7", "\u652f\u6301\u786e\u5b9a\u6027\u4e0e\u751f\u6210\u5f0f\u7f16\u8f91\uff0c\u4ee5\u53ca\u5b9e\u65f6\u64a4\u9500\uff0f\u91cd\u505a"], "keywords": ["\u7b26\u53f7\u97f3\u4e50\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4eba\u673a\u534f\u4f5c", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29225v1", "published_at": "2026-11-22", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "IteraSong: LLM-Guided Iterative Symbolic Music Creation in a Web DAW", "tldr": "\u5c06\u5927\u6a21\u578b\u63a5\u5165\u7f51\u9875\u97f3\u4e50\u5de5\u4f5c\u7ad9\uff0c\u8ba9\u7528\u6237\u7528\u81ea\u7136\u8bed\u8a00\u6301\u7eed\u7f16\u8f91\u591a\u8f68\u4e50\u66f2\u3002", "upvotes": 0, "what_it_is": "IteraSong\u662f\u4e00\u6b3e\u4ea4\u4e92\u5f0f\u7f51\u9875\u97f3\u4e50\u5de5\u4f5c\u7ad9\uff0c\u652f\u6301\u4ece\u6d41\u884c\u97f3\u4e50\u8349\u7a3f\u51fa\u53d1\u53cd\u590d\u8bd5\u542c\u4e0e\u4fee\u6539\u3002\u5927\u6a21\u578b\u901a\u8fc7MCP\u5de5\u5177\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u6620\u5c04\u4e3a\u5206\u5c42\u97f3\u4e50\u7f16\u8f91\u64cd\u4f5c\u3002", "why_notable": "\u628a\u97f3\u4e50\u751f\u6210\u4ece\u4e00\u6b21\u6027\u8f93\u51fa\u8f6c\u5411\u53ef\u6301\u7eed\u4fee\u6539\u7684\u521b\u4f5c\u6d41\u7a0b\uff0c\u5e76\u4ee5\u5206\u5c42\u5de5\u5177\u8c03\u7528\u8854\u63a5\u81ea\u7136\u8bed\u8a00\u610f\u56fe\u4e0e\u7ec6\u7c92\u5ea6\u7f16\u8f91\u3002"}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
