9e\u5f3a", "\u4fe1\u7528\u5206\u914d", "\u95ee\u7b54\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23824v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evidence-Based Credit Assignment for Search-Augmented Language Models", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u68c0\u7d22\u8bc1\u636e\u6548\u7528\u7684\u4fe1\u7528\u5206\u914d\u65b9\u6cd5\uff0c\u4e3a\u641c\u7d22\u589e\u5f3a\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u8bad\u7ec3\u4fe1\u53f7\uff1b\u5728\u4e03\u9879\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u5c55\u73b0\u591a\u8df3\u95ee\u7b54\u8fc1\u79fb\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents now write whole codebases in long autonomous runs, guided mainly by whether their tests pass. Yet passing tests alone does not reveal accumulating complexity or gaps in test coverage, which then persist as agents extend their own code. We introduce metrics-in-the-loop, an inference-time intervention that gives agents in-flight feedback: cheap, automatically computed code metrics injected into the agent\u0027s context during the trajectory. After each code-changing agent turn, we insert short feedback messages naming changed functions whose cyclomatic complexity exceeds a limit (complexity feedback) or changed lines that are skipped by tests (coverage feedback), giving the agent the opportunity to refactor code or strengthen tests before continuing. We run extensive experiments and ablations comparing several interventions across three long-horizon coding benchmarks and four strong models. We find that complexity feedback significantly reduces erosion, a measure of complexity concentration of code, without affecting held-out correctness of the code. Broadly, our experiments investigate a practical form of agent \"re-railing\", where timely, actionable measurements redirect agents before weaknesses become the foundation they keep building on. As agents scale to codebases with millions of lines, such interventions become critical to sustaining effective development and long-term code maintainability.", "arxiv_id": "2611.23817", "arxiv_url": "https://arxiv.org/abs/2611.23817", "authors": ["Nicolas Chapados", "Jean-Fran\u00e7ois Gagn\u00e9", "Nouha Dziri"], "brief": "\u5728\u7f16\u7801\u667a\u80fd\u4f53\u8fd0\u884c\u4e2d\u6ce8\u5165\u590d\u6742\u5ea6\u4e0e\u6d4b\u8bd5\u8986\u76d6\u53cd\u9988\uff0c\u4fc3\u4f7f\u5176\u53ca\u65f6\u91cd\u6784\u6216\u8865\u6d4b\u3002\u8de8\u4e09\u4e2a\u957f\u7a0b\u57fa\u51c6\u3001\u56db\u4e2a\u6a21\u578b\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u590d\u6742\u5ea6\u53cd\u9988\u663e\u8457\u51cf\u5c11\u590d\u6742\u5ea6\u96c6\u4e2d\uff0c\u4e14\u4e0d\u635f\u5bb3\u6b63\u786e\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23817", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u4ee3\u7801\u590d\u6742\u5ea6", "\u6d4b\u8bd5\u8986\u76d6", "\u4ee3\u7801\u7ef4\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23817v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Metrics-in-the-Loop: Complexity Feedback Reshapes Agent-Written Code", "tldr": "\u5728\u7f16\u7801\u667a\u80fd\u4f53\u8fd0\u884c\u4e2d\u6ce8\u5165\u590d\u6742\u5ea6\u4e0e\u6d4b\u8bd5\u8986\u76d6\u53cd\u9988\uff0c\u4fc3\u4f7f\u5176\u53ca\u65f6\u91cd\u6784\u6216\u8865\u6d4b\u3002\u8de8\u4e09\u4e2a\u957f\u7a0b\u57fa\u51c6\u3001\u56db\u4e2a\u6a21\u578b\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u590d\u6742\u5ea6\u53cd\u9988\u663e\u8457\u51cf\u5c11\u590d\u6742\u5ea6\u96c6\u4e2d\uff0c\u4e14\u4e0d\u635f\u5bb3\u6b63\u786e\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Timestamp permutations are used to test whether dynamic link predictors exploit temporal information, but a performance gap can reflect changes in training, evaluation history, or both. We separate these effects with a crossed diagnostic and measure input exposure: whether altered histories actually change the predictor\u0027s inputs. On MOOC, TCL trained with binary cross-entropy gains approximately eight pairwise-accuracy points from original-chronology training under either evaluation history, while changing history at fixed weights gives only 0.03 points. The small history contrast reflects unchanged inputs for 68.37% of queries, stable rankings for most others, and cancellation of gains and losses. Under original evaluation history, suppressing explicit time encoding reduces the training contrast from 8.03 to 3.64 points, a paired reduction of 4.39 points (95% interval [3.68, 5.09]) across six seeds. DyGFormer shows corresponding training and history contrasts of 22.34 and 0.38 points across two seeds, despite greater exposure. Partial history permutations further separate nominal intervention strength, input changes, and aggregate accuracy. These comparisons turn a single permutation gap into interpretable statements about training conditions and model responses, while leaving the internal mechanisms of temporal learning open.", "arxiv_id": "2611.23753", "arxiv_url": "https://arxiv.org/abs/2611.23753", "authors": ["Ilia Karpov", "Kirill Koloskov", "Valeriy Kuleshov", "Dmitry Ilvovsky"], "brief": "\u7814\u7a76\u7528\u4ea4\u53c9\u8bca\u65ad\u62c6\u5206\u65f6\u95f4\u6233\u7f6e\u4e71\u5bf9\u8bad\u7ec3\u4e0e\u8bc4\u4f30\u5386\u53f2\u7684\u5f71\u54cd\u3002\u5b9e\u9a8c\u53d1\u73b0\u6027\u80fd\u5dee\u8ddd\u4e3b\u8981\u6765\u81ea\u8bad\u7ec3\u6761\u4ef6\uff0c\u800c\u975e\u5386\u53f2\u53d8\u5316\uff0c\u8bf4\u660e\u5355\u4e00\u7f6e\u4e71\u5dee\u8ddd\u4e0d\u8db3\u4ee5\u5224\u5b9a\u6a21\u578b\u662f\u5426\u5229\u7528\u65f6\u5e8f\u3002", "categories": ["cs.LG", "cs.AI", "cs.LO", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23753", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u52a8\u6001\u56fe", "\u94fe\u63a5\u9884\u6d4b", "\u65f6\u5e8f\u5b66\u4e60", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23753v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Interpreting Timestamp Permutations in Dynamic Link Prediction", "tldr": "\u7814\u7a76\u7528\u4ea4\u53c9\u8bca\u65ad\u62c6\u5206\u65f6\u95f4\u6233\u7f6e\u4e71\u5bf9\u8bad\u7ec3\u4e0e\u8bc4\u4f30\u5386\u53f2\u7684\u5f71\u54cd\u3002\u5b9e\u9a8c\u53d1\u73b0\u6027\u80fd\u5dee\u8ddd\u4e3b\u8981\u6765\u81ea\u8bad\u7ec3\u6761\u4ef6\uff0c\u800c\u975e\u5386\u53f2\u53d8\u5316\uff0c\u8bf4\u660e\u5355\u4e00\u7f6e\u4e71\u5dee\u8ddd\u4e0d\u8db3\u4ee5\u5224\u5b9a\u6a21\u578b\u662f\u5426\u5229\u7528\u65f6\u5e8f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language-model reasoning alternates between sustained activities and local operations. We study how this temporal structure predicts continuation and the computation needed to analyze it. T/E/S combines text, local events, and spans of activity. Across reasoning and information-seeking tasks, events and spans improve next-outcome prediction in 70 of 76 evaluation groups for a Transformer and 74 of 76 for Qwen with LoRA. Span duration and preceding events are associated with transitions, and retaining event history across span boundaries improves prediction. We formulate budget-allocation counting and action-conditional continuation queries, prove counting hardness under explicit encodings, and derive conditions for affordable decision certification. In finite-process experiments, bounds that cancel shared continuation mass recover the same optimal actions as full dynamic programming while reducing mean inference CPU time by 77.7%. On 71 held-out HotpotQA and MuSiQue questions, a compact structural observer improves prediction of whether a fixed inference procedure finishes within a CPU allowance: Brier loss falls from 0.0836 to 0.0756. An annotation audit identifies substantial errors in that observer, separating this computational result from semantic validation of its features.", "arxiv_id": "2611.23749", "arxiv_url": "https://arxiv.org/abs/2611.23749", "authors": ["Ilia Karpov", "Andrey Atamanyuk", "Dmitry Ilvovsky", "Aleksandr Anokhin", "Alex Elizov", "Dmitry Zagorulkin", "Sergei O. Kuznetsov"], "brief": "\u7528\u6587\u672c\u3001\u5c40\u90e8\u4e8b\u4ef6\u548c\u6d3b\u52a8\u8de8\u5ea6\u5efa\u6a21\u5927\u6a21\u578b\u63a8\u7406\u52a8\u6001\uff0c\u591a\u6570\u8bc4\u6d4b\u7ec4\u7684\u540e\u7eed\u9884\u6d4b\u5f97\u5230\u6539\u5584\uff1b\u6709\u9650\u8fc7\u7a0b\u5b9e\u9a8c\u4e2d\u4fdd\u6301\u6700\u4f18\u52a8\u4f5c\u4e0d\u53d8\uff0c\u5e73\u5747\u63a8\u7406CPU\u8017\u65f6\u964d\u4f4e77.7%\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23749", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u7ed3\u6784\u5316\u8868\u793a", "\u8ba1\u7b97\u9884\u7b97", "\u52a8\u6001\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23749v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Modeling LLM Reasoning Dynamics with Structural Representations", "tldr": "\u7528\u6587\u672c\u3001\u5c40\u90e8\u4e8b\u4ef6\u548c\u6d3b\u52a8\u8de8\u5ea6\u5efa\u6a21\u5927\u6a21\u578b\u63a8\u7406\u52a8\u6001\uff0c\u591a\u6570\u8bc4\u6d4b\u7ec4\u7684\u540e\u7eed\u9884\u6d4b\u5f97\u5230\u6539\u5584\uff1b\u6709\u9650\u8fc7\u7a0b\u5b9e\u9a8c\u4e2d\u4fdd\u6301\u6700\u4f18\u52a8\u4f5c\u4e0d\u53d8\uff0c\u5e73\u5747\u63a8\u7406CPU\u8017\u65f6\u964d\u4f4e77.7%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Public benchmarks support comparisons of large language model (LLM) capabilities, yet users can experience the same highly ranked model differently. Drawing on traditional software reliability, we argue that the reliability of an LLM service should be assessed for specified users and conditions of use. This requires more than a capability score: evaluation evidence must support a claim about failure during future operation. We distinguish testing to discover faults from testing to assess reliability and identify ten modelling considerations behind such claims. We propose a six-workstream research roadmap linking claim specification, dynamic operational profiles, graded outcomes and noisy judgements, local probabilistic robustness, interaction dependence, and statistical inference with reassessment. Local probabilistic robustness addresses the behavioural variation hidden when different concrete inputs are treated as the same task. Published findings and an illustrative customer-support example motivate the roadmap; its integrated validation remains an open research task. Reliability claims complement, but do not replace, separate safety and security arguments. Capability scores should therefore be complemented by versioned operational claims that state whose requirements are covered, under which conditions, and with what uncertainty.", "arxiv_id": "2611.23732", "arxiv_url": "https://arxiv.org/abs/2611.23732", "authors": ["Xingyu Zhao"], "brief": "\u63d0\u51fa\u6309\u7279\u5b9a\u7528\u6237\u4e0e\u4f7f\u7528\u6761\u4ef6\u8bc4\u4f30\u5927\u6a21\u578b\u53ef\u9760\u6027\uff0c\u533a\u5206\u6545\u969c\u53d1\u73b0\u4e0e\u53ef\u9760\u6027\u6d4b\u8bd5\uff0c\u5e76\u7ed9\u51fa\u516d\u9879\u7814\u7a76\u8def\u7ebf\uff1b\u4e3b\u5f20\u4ee5\u6ce8\u660e\u9002\u7528\u6761\u4ef6\u548c\u4e0d\u786e\u5b9a\u6027\u7684\u8fd0\u884c\u58f0\u660e\u8865\u5145\u80fd\u529b\u8bc4\u5206\uff0c\u6574\u4f53\u9a8c\u8bc1\u5c1a\u5f85\u5f00\u5c55\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23732", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u9760\u6027\u8bc4\u4f30", "\u8f6f\u4ef6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23732v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reliability is a user-specific property of large language models", "tldr": "\u63d0\u51fa\u6309\u7279\u5b9a\u7528\u6237\u4e0e\u4f7f\u7528\u6761\u4ef6\u8bc4\u4f30\u5927\u6a21\u578b\u53ef\u9760\u6027\uff0c\u533a\u5206\u6545\u969c\u53d1\u73b0\u4e0e\u53ef\u9760\u6027\u6d4b\u8bd5\uff0c\u5e76\u7ed9\u51fa\u516d\u9879\u7814\u7a76\u8def\u7ebf\uff1b\u4e3b\u5f20\u4ee5\u6ce8\u660e\u9002\u7528\u6761\u4ef6\u548c\u4e0d\u786e\u5b9a\u6027\u7684\u8fd0\u884c\u58f0\u660e\u8865\u5145\u80fd\u529b\u8bc4\u5206\uff0c\u6574\u4f53\u9a8c\u8bc1\u5c1a\u5f85\u5f00\u5c55\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Growing uncertainty in power system operations from renewables integration, extreme weather, and data center loads challenges the reliability of traditional power flow solvers at scale. Machine learning-based proxies are a potentially promising alternative, but the prohibitive cost of generating training data for large grids makes out-of-distribution generalization a key capability for deployment; currently, models trained on small grids lack that capability. In this work, we systematically evaluate how physics-informed losses, multi-grid training, and perturbation-based data augmentation improve the zero-shot transfer of three graph neural network-based power flow models from smaller systems to a larger, unseen 500-bus system. We find that (1) physics-informed losses improve transfer relative to purely supervised objectives; (2) multi-grid training on smaller systems matches the best single grid but does not close the gap to target-grid training; (3) perturbation-based augmentation on edge attributes improves transfer by up to 54.6%; and (4) random line/generator dropout does not consistently improve performance.", "arxiv_id": "2611.23729", "arxiv_url": "https://arxiv.org/abs/2611.23729", "authors": ["Ojas Sanghi", "Anvita Bhagavathula", "Alvaro Carbonero", "Priya L. Donti"], "brief": "\u7814\u7a76\u4e09\u7c7b\u56fe\u795e\u7ecf\u7f51\u7edc\u4ece\u5c0f\u7535\u7f51\u5230\u672a\u89c1\u5927\u7535\u7f51\u7684\u96f6\u6837\u672c\u8fc1\u79fb\uff0c\u53d1\u73b0\u7269\u7406\u7ea6\u675f\u6709\u6548\u3001\u8fb9\u5c5e\u6027\u6270\u52a8\u6700\u9ad8\u6539\u558454.6%\uff0c\u4f46\u591a\u7535\u7f51\u8bad\u7ec3\u4ecd\u4e0d\u53ca\u76ee\u6807\u7535\u7f51\u8bad\u7ec3\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23729", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u5206\u5e03\u5916\u6cdb\u5316", "\u7535\u529b\u7cfb\u7edf", "\u6570\u636e\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23729v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Toward Out-of-Distribution Generalization in Neural AC Power Flow", "tldr": "\u7814\u7a76\u4e09\u7c7b\u56fe\u795e\u7ecf\u7f51\u7edc\u4ece\u5c0f\u7535\u7f51\u5230\u672a\u89c1\u5927\u7535\u7f51\u7684\u96f6\u6837\u672c\u8fc1\u79fb\uff0c\u53d1\u73b0\u7269\u7406\u7ea6\u675f\u6709\u6548\u3001\u8fb9\u5c5e\u6027\u6270\u52a8\u6700\u9ad8\u6539\u558454.6%\uff0c\u4f46\u591a\u7535\u7f51\u8bad\u7ec3\u4ecd\u4e0d\u53ca\u76ee\u6807\u7535\u7f51\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Spiking Neural Networks (SNNs) promise event-driven and energy-efficient vision, yet existing spiking vision transformers (S-ViTs) largely confine spiking tokens to fixed and uniform firing schemes along the temporal, spatial and channel dimensions, whereas suppressing the computational redundancy thus incurred calls for adaptive firing mechanisms that operate jointly across all three axes at test time. To this end, we propose the Adaptive Efficient Integrate-and-Fire (AdaE-IF) model, which consults the attention score of each spiking token and routes salient regions to fine-grained firing patterns while assigning energy-frugal coarse patterns to the remaining regions. Building on AdaE-IF, we further introduce Spiking Gated Self-Attention (S-GSA) and Spiking Local-Gated Unit (S-LGU), which enforce selective spike emission at token and channel granularity. We integrate the aforementioned mechanisms and modules into AdaS-ViT, a test-time adaptive-routing architecture trained with a progressive spatio-temporal curriculum that stabilizes the co-adaptation of firing precision and routing masks. Extensive experiments across benchmarks spanning diverse data scales and modalities demonstrate that AdaS-ViT consistently achieves highly competitive performance. Notably, on ImageNet-1k it consumes only 1.02 to 2.45 millijoules per image and attains an accuracy-per-energy ratio of 32$\\times$ to 72$\\times$, operating in an economical inference regime and thereby pushing the energy-efficiency boundary further.", "arxiv_id": "2611.23728", "arxiv_url": "https://arxiv.org/abs/2611.23728", "authors": ["Zecheng Hao", "Zihan Huang", "Shenghao Xie", "Jiyuan Zhang", "Zhaofei Yu", "Tiejun Huang"], "brief": "\u63d0\u51fa\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u8def\u7531\u7684\u8109\u51b2\u89c6\u89c9Transformer\uff0c\u8054\u5408\u8c03\u8282\u65f6\u7a7a\u4e0e\u901a\u9053\u653e\u7535\uff1b\u5728ImageNet\u4e0a\u4fdd\u6301\u7ade\u4e89\u529b\uff0c\u6bcf\u56fe\u8017\u80fd\u4ec51.02\u81f32.45\u6beb\u7126\u3002", "categories": ["cs.NE", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23728", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8109\u51b2\u795e\u7ecf\u7f51\u7edc", "\u89c6\u89c9Transformer", "\u81ea\u9002\u5e94\u8def\u7531", "\u8282\u80fd\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23728v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AdaS-ViT: Test-Time Adaptive Routing for Spiking Vision Transformers with Ultra-High Energy Efficiency", "tldr": "\u63d0\u51fa\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\u8def\u7531\u7684\u8109\u51b2\u89c6\u89c9Transformer\uff0c\u8054\u5408\u8c03\u8282\u65f6\u7a7a\u4e0e\u901a\u9053\u653e\u7535\uff1b\u5728ImageNet\u4e0a\u4fdd\u6301\u7ade\u4e89\u529b\uff0c\u6bcf\u56fe\u8017\u80fd\u4ec51.02\u81f32.45\u6beb\u7126\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding is widely used to speed up generation in large language models (LLMs), with a small draft model proposing tokens that one forward pass of the target model verifies. Draft models that read the target\u0027s hidden states, such as DFlash and EAGLE-3, typically inherit the target\u0027s hidden width. We show that the draft\u0027s whole residual stream can run at half or a quarter of that width while largely preserving acceptance. For DFlash, which borrows the target\u0027s vocabulary projection, the trained output adapter folds into it, giving one narrower projection with logits unchanged up to floating-point rounding. We test two drafter families, DFlash and EAGLE-3, on two targets, Qwen3-8B (NVFP4) and GPT-OSS-20B (MXFP4), in SGLang on a B200 and a DGX Spark (GB10). At batch size 1 and temperature 0, narrowing the draft to half or a quarter width speeds up end-to-end decoding by 1.06-1.12x on B200 and 1.13-1.44x on GB10. The speedup holds at larger batch sizes. From batch 32 to the largest batch each GPU fits, narrowing reaches up to 1.21x points": [], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u77e2\u91cf\u56fe\u751f\u6210", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23807v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sightline: Long-Window Speculative Decoding for Fast SVG Generation", "tldr": "Sightline\u7ed3\u5408\u957f\u9a8c\u8bc1\u7a97\u53e3\u4e0e\u5bbd\u8349\u7a3f\u6811\uff0c\u65e0\u635f\u52a0\u901fSVG\u751f\u6210\uff1b\u5728\u591a\u6a21\u578b\u3001\u591a\u57fa\u51c6\u4e0a\u9886\u5148\u5176\u4ed6\u65e0\u635f\u89e3\u7801\u5668\uff0c\u8868\u660e\u77e2\u91cf\u56fe\u751f\u6210\u9002\u5408\u66f4\u957f\u7684\u63a8\u6d4b\u7a97\u53e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Rigid motion of a patient head during head cone-beam CT (CBCT) scan can degrade image quality and complicate recovery of accurate anatomical structures from the measured projections. We present a 3D flow-matching prior approach that learns the image changes induced by motion. Its geometry-bridge connects motion-corrupted and motion-free Feldkamp-Davis-Kress (FDK) reconstructed images of the same source volume through progressively reduced simulated motion. The forward projector\u0027s geometry derivative supplies analytic velocity targets along this path. A plug-and-play loop encompasses the learned image updates together with spline-based pose estimation, conjugate-gradient data consistency, and image total-variation regularization. Both the refined image volume and the FDK reconstructed image volume at the estimated poses are evaluated. On simulated 360-view scans from 30 held-out CQ500 patients with nominal per-component motion amplitudes within 10 mm / 10 degrees, the framework achieved state-of-the-art image reconstruction quality and motion accuracy in comparison with other methos such as learned autofocus and diffusion-based joint reconstruction. Mean pea let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
