60\u7cfb\u7edf\u63d0\u4f9b\u4e86\u65b0\u7684\u5b9e\u9a8c\u4f9d\u636e\u3002"}, {"abstract": "Automated scientific discovery has the potential to advance understanding of disease mechanisms and accelerate identification of early disease markers. Manual data annotation is infeasible at population scale, motivating methods that automatically extract pre-defined phenotypes in multimodal and unstructured clinical data. Such pre-defined feature sets determine and limit which associations these approaches can discover. This limitation extends to agentic AI systems that use these tools to query population-scale data. In contrast, foundation models (FMs) trained on large volumes of clinical data can perform tasks beyond their training objectives. This suggests their latent embeddings may represent novel or unexplored features that could yield insights into disease mechanisms, yet such latent features remain difficult to interpret. To address this challenge, we introduce Glyph, an automated multistage framework that extracts features from multimodal and unstructured clinical data using FMs and sparse autoencoders, interprets them as coded clinical concepts, and evaluates their value for clinical scientific discovery. We applied Glyph to abdominal CT volumes, CT radiology reports and laboratory measurements from 41,628 patients across different institutions. We identified 397 predictive concepts supported by 4,463 Bonferroni-significant associations. Moreover, a majority of discovered associations were automatically reproducible in held-out cohorts across different sites. Glyph concepts provided complementary associations to literature-derived markers, leading to gains in predictive power. We envision that interpretability can extend beyond a mechanistic understanding of neural networks to connecting implicitly learned features with clinical knowledge and establishing their significance for patient outcomes. We release Glyph at https://github.com/StanfordMIMI/Glyph.", "arxiv_id": "2611.08922", "arxiv_url": "https://arxiv.org/abs/2611.08922", "authors": ["Robbie Holland", "Ashwin Kumar", "Mateus A. Esmeraldo", "David Le", "Andrea Fisher", "Jiazhen Pan", "Louisa Fay", "Magdalini Paschali", "Vasiliki Sideri-Lampretsa", "Ates Fettahoglu", "Stefania Moroianu", "Philipp Wesp", "Ivan Lopez", "Tom Nuno Wolf", "McKenzie S. White", "Eduardo Pontes Reis", "Fatima Rodriguez", "Curtis P. Langlotz", "Vasilis Syrgkanis", "Imon Banerjee", "Akshay S. Chaudhari", "Sergios Gatidis"], "brief": "Glyph\u7528\u57fa\u7840\u6a21\u578b\u4e0e\u7a00\u758f\u81ea\u7f16\u7801\u5668\uff0c\u4eceCT\u3001\u62a5\u544a\u548c\u68c0\u9a8c\u6570\u636e\u4e2d\u63d0\u53d6\u9690\u7279\u5f81\uff0c\u518d\u6620\u5c04\u4e3a\u7f16\u7801\u5316\u4e34\u5e8a\u6982\u5ff5\uff0c\u5e76\u8bc4\u4f30\u5176\u4e0e\u60a3\u8005\u7ed3\u5c40\u7684\u5173\u8054\u53ca\u9884\u6d4b\u4ef7\u503c\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/StanfordMIMI/Glyph", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.08922", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57fa\u7840\u6a21\u578b\u7ed3\u5408\u7a00\u758f\u81ea\u7f16\u7801\u5668\uff0c\u63d0\u53d6\u5e76\u89e3\u91ca\u4e34\u5e8a\u9690\u7279\u5f81", "\u8986\u76d641,628\u540d\u60a3\u8005\uff0c\u53d1\u73b0397\u4e2a\u9884\u6d4b\u6027\u6982\u5ff5", "4,463\u9879Bonferroni\u663e\u8457\u5173\u8054\uff0c\u591a\u6570\u8de8\u673a\u6784\u590d\u73b0"], "keywords": ["\u79d1\u5b66\u53d1\u73b0", "\u53ef\u89e3\u91ca\u6027", "\u591a\u6a21\u6001\u4e34\u5e8a\u6570\u636e", "\u7a00\u758f\u81ea\u7f16\u7801\u5668"], "num_comments": 2, "on_hf": true, "organization": "Stanford MIMI Group", "pdf_url": "https://arxiv.org/pdf/2611.08922v1", "published_at": "2026-11-06", "score": 0.628, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08922.png", "title": "Glyph: An Interpretability Engine for AI-Driven Scientific Discovery in Clinical Data", "tldr": "\u5c06\u4e34\u5e8a\u57fa\u7840\u6a21\u578b\u7684\u9690\u7279\u5f81\u8f6c\u4e3a\u53ef\u89e3\u91ca\u6982\u5ff5\uff0c\u53d1\u73b0\u8de8\u673a\u6784\u53ef\u590d\u73b0\u7684\u75be\u75c5\u5173\u8054\u3002", "upvotes": 3, "what_it_is": "Glyph\u7528\u57fa\u7840\u6a21\u578b\u4e0e\u7a00\u758f\u81ea\u7f16\u7801\u5668\uff0c\u4eceCT\u3001\u62a5\u544a\u548c\u68c0\u9a8c\u6570\u636e\u4e2d\u63d0\u53d6\u9690\u7279\u5f81\uff0c\u518d\u6620\u5c04\u4e3a\u7f16\u7801\u5316\u4e34\u5e8a\u6982\u5ff5\uff0c\u5e76\u8bc4\u4f30\u5176\u4e0e\u60a3\u8005\u7ed3\u5c40\u7684\u5173\u8054\u53ca\u9884\u6d4b\u4ef7\u503c\u3002", "why_notable": "\u7ed5\u5f00\u9884\u5b9a\u4e49\u8868\u578b\u5bf9\u53d1\u73b0\u7a7a\u95f4\u7684\u9650\u5236\uff0c\u5c06\u9690\u7279\u5f81\u63a5\u5165\u4e34\u5e8a\u77e5\u8bc6\uff1b\u6240\u5f97\u6982\u5ff5\u4e0e\u6587\u732e\u6807\u8bb0\u4e92\u8865\uff0c\u5e76\u63d0\u5347\u9884\u6d4b\u80fd\u529b\u3002"}, {"abstract": "Visual foundation models are central to physical intelligence, yet their development remains constrained by fragmented training datasets, inconsistent annotation quality, and limited multimodal supervision. To address these challenges, we introduce GameRealm, a large-scale, richly annotated dataset that grounds visual observations in synchronized, game-native supervision. GameRealm encompasses over 120 million RGB frames and 1,000 hours of gameplay footage across all views. Beyond its unprecedented scale, GameRealm provides rich multimodal supervision, including metric depth, camera parameters, synchronized audio, control inputs, and 3D point trajectories. Its diversity further extends to flexible view configurations, spanning single-view, stereo, multi-view, and panoramic recordings. To enable scalable acquisition across diverse game environments, we develop a unified data collection pipeline that combines human-operated interaction with agentic exploration. Extensive experiments across diverse visual learning tasks demonstrate that GameRealm consistently strengthens visual foundation models in both visual generation and geometric learning. These results establish GameRealm as a versatile and valuable data resource, unlocking new opportunities for advancing visual intelligence.", "arxiv_id": "2611.23140", "arxiv_url": "https://arxiv.org/abs/2611.23140", "authors": ["Weiguang Zhao", "Yifan Wang", "Ni Yang", "Yating Wang", "Xingyu Miao", "Yankai Jiang", "Mulin Yu", "Tao Lu", "Haoyu Guo", "Junting Dong", "Weinan Zhang", "Chunhua Shen"], "brief": "GameRealm\u662f\u9762\u5411\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u7684\u6e38\u620f\u591a\u6a21\u6001\u6570\u636e\u96c6\u3002\u5b83\u901a\u8fc7\u4eba\u5de5\u64cd\u4f5c\u4e0e\u667a\u80fd\u4f53\u63a2\u7d22\u7edf\u4e00\u91c7\u96c6\uff0c\u5c06\u753b\u9762\u4e0e\u6df1\u5ea6\u3001\u97f3\u9891\u3001\u63a7\u5236\u8f93\u5165\u53ca\u4e09\u7ef4\u8f68\u8ff9\u540c\u6b65\u5bf9\u9f50\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/weiguangzhao/GameRealm", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.23140", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5305\u542b\u8d85\u8fc71.2\u4ebf\u5e27RGB\u56fe\u50cf\u30011000\u5c0f\u65f6\u6e38\u620f\u5f55\u50cf", "\u540c\u6b65\u63d0\u4f9b\u5ea6\u91cf\u6df1\u5ea6\u3001\u76f8\u673a\u53c2\u6570\u53ca\u4e09\u7ef4\u70b9\u8f68\u8ff9", "\u7edf\u4e00\u91c7\u96c6\u6d41\u7a0b\u878d\u5408\u4eba\u5de5\u64cd\u4f5c\u4e0e\u667a\u80fd\u4f53\u63a2\u7d22"], "keywords": ["\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u591a\u6a21\u6001\u6570\u636e\u96c6", "\u51e0\u4f55\u5b66\u4e60", "\u6e38\u620f\u73af\u5883"], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2611.23140v1", "published_at": "2026-11-17", "score": 0.607, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23140.png", "title": "GameRealm: Grounding Visual Learning in Interactive Games", "tldr": "\u4ee5\u6e38\u620f\u539f\u751f\u540c\u6b65\u6807\u6ce8\u6784\u5efa\u4ebf\u7ea7\u89c6\u89c9\u6570\u636e\uff0c\u63d0\u5347\u89c6\u89c9\u751f\u6210\u4e0e\u51e0\u4f55\u5b66\u4e60\u80fd\u529b\u3002", "upvotes": 1, "what_it_is": "GameRealm\u662f\u9762\u5411\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u7684\u6e38\u620f\u591a\u6a21\u6001\u6570\u636e\u96c6\u3002\u5b83\u901a\u8fc7\u4eba\u5de5\u64cd\u4f5c\u4e0e\u667a\u80fd\u4f53\u63a2\u7d22\u7edf\u4e00\u91c7\u96c6\uff0c\u5c06\u753b\u9762\u4e0e\u6df1\u5ea6\u3001\u97f3\u9891\u3001\u63a7\u5236\u8f93\u5165\u53ca\u4e09\u7ef4\u8f68\u8ff9\u540c\u6b65\u5bf9\u9f50\u3002", "why_notable": "\u6e38\u620f\u539f\u751f\u4fe1\u53f7\u4e3a\u5927\u89c4\u6a21\u89c6\u89c9\u8bad\u7ec3\u63d0\u4f9b\u4e00\u81f4\u4e14\u4e30\u5bcc\u7684\u76d1\u7763\uff0c\u591a\u4efb\u52a1\u5b9e\u9a8c\u663e\u793a\u5176\u540c\u65f6\u589e\u5f3a\u89c6\u89c9\u751f\u6210\u4e0e\u51e0\u4f55\u5b66\u4e60\uff0c\u5177\u6709\u8de8\u4efb\u52a1\u6570\u636e\u8d44\u6e90\u4ef7\u503c\u3002"}, {"abstract": "Autoregressive video diffusion models generate frames based on new observations and inputs, making them a promising medium for interactive visual experiences. However, existing models are orders of magnitude too slow for fluid interaction. This paper introduces FastFrames, a family of fast autoregressive video diffusion models that achieves interactive latency without compromising quality. We profile the inference pipeline of state-of-the-art models and find that operations often treated as fixed implementation details, such as VAE decoding and KV cache updates, in fact account for over half of end-to-end inference latency. We challenge the assumption that these components are indispensable and replace them with lightweight alternatives. Our 1.3B variant runs at 36 ms per frame, or 28 responses per second (RPS), on a single B200 GPU while matching the generation quality of a state-of-the-art model that is nearly 8x slower. Our 14B variant runs at 45 ms per frame, or 22 RPS, on an 8x B200 GPU node and yields significantly better visual quality and realism. We show that FastFrames enables real-time interaction in applications such as camera-conditioned and physics-conditioned video generation.", "arxiv_id": "2611.23226", "arxiv_url": "https://arxiv.org/abs/2611.23226", "authors": ["Gene Chou", "Guandao Yang", "Fujun Luan", "Lars Mescheder", "Wei Dong", "Stephan Richter", "Vladlen Koltun"], "brief": "\u63d0\u51fa\u9762\u5411\u4ea4\u4e92\u573a\u666f\u7684\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6a21\u578b\u7cfb\u5217\uff0c\u901a\u8fc7\u5256\u6790\u7aef\u5230\u7aef\u63a8\u7406\u74f6\u9888\uff0c\u7528\u8f7b\u91cf\u66ff\u4ee3\u65b9\u6848\u91cd\u6784\u89e3\u7801\u4e0e\u7f13\u5b58\u66f4\u65b0\uff0c\u4f7f\u9010\u5e27\u751f\u6210\u8fbe\u5230\u6beb\u79d2\u7ea7\u54cd\u5e94\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/apple-aiml-research/ml-fastframes", "github_stars": 33, "hf_url": "https://huggingface.co/papers/2611.23226", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["VAE\u89e3\u7801\u4e0eKV\u7f13\u5b58\u66f4\u65b0\u5360\u7aef\u5230\u7aef\u5ef6\u8fdf\u4e00\u534a\u4ee5\u4e0a", "1.3B\u6a21\u578b\u5355\u5f20B200\u8fbe36\u6beb\u79d2/\u5e27\uff0c\u540c\u7b49\u753b\u8d28\u8fd18\u500d\u63d0\u901f", "14B\u6a21\u578b\u75288\u5f20B200\u8fbe45\u6beb\u79d2/\u5e27\uff0c\u753b\u8d28\u66f4\u4f18"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u5b9e\u65f6\u4ea4\u4e92"], "num_comments": 6, "on_hf": true, "organization": "Apple", "pdf_url": "https://arxiv.org/pdf/2611.23226v1", "published_at": "2026-11-17", "score": 0.54, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Apple", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23226.png", "title": "FastFrames: Video Generation at Interactive Latency", "tldr": "\u901a\u8fc7\u8f7b\u91cf\u5316\u89e3\u7801\u4e0e\u7f13\u5b58\u66f4\u65b0\uff0c\u8ba9\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u5728\u4fdd\u6301\u753b\u8d28\u65f6\u5b9e\u73b0\u5b9e\u65f6\u4ea4\u4e92\u3002", "upvotes": 24, "what_it_is": "\u63d0\u51fa\u9762\u5411\u4ea4\u4e92\u573a\u666f\u7684\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6a21\u578b\u7cfb\u5217\uff0c\u901a\u8fc7\u5256\u6790\u7aef\u5230\u7aef\u63a8\u7406\u74f6\u9888\uff0c\u7528\u8f7b\u91cf\u66ff\u4ee3\u65b9\u6848\u91cd\u6784\u89e3\u7801\u4e0e\u7f13\u5b58\u66f4\u65b0\uff0c\u4f7f\u9010\u5e27\u751f\u6210\u8fbe\u5230\u6beb\u79d2\u7ea7\u54cd\u5e94\u3002", "why_notable": "\u5c06\u52a0\u901f\u91cd\u70b9\u4ece\u6a21\u578b\u8ba1\u7b97\u6269\u5c55\u5230\u89e3\u7801\u4e0e\u7f13\u5b58\u7b49\u7cfb\u7edf\u73af\u8282\uff0c\u5728\u4fdd\u6301\u753b\u8d28\u7684\u540c\u65f6\u964d\u4f4e\u54cd\u5e94\u5ef6\u8fdf\uff0c\u652f\u6301\u76f8\u673a\u4e0e\u7269\u7406\u6761\u4ef6\u9a71\u52a8\u7684\u5b9e\u65f6\u4ea4\u4e92\u3002"}, {"abstract": "$\u03c0^4$ is a unified foundation model for 4D scene perception. From diverse, uncalibrated RGB observations in the wild---a single image, an unordered collection, or a video sequence---it recovers dense geometry, camera poses, and metric scale, together with 2D/3D point tracks and moving-object masks for multi-image inputs. It couples a geometry branch with a geometry-conditioned motion branch, which predicts image-space correspondences that are lifted into 3D using reconstructed target-view geometry. Across diverse benchmarks, $\u03c0^4$ achieves the best overall average rank in geometry evaluation, alongside competitive performance in single- and multiview 2D/3D point tracking and moving-object segmentation. With a shared backbone, the full geometry-and-motion system contains approximately 0.5B parameters---less than half the size of most baselines. It produces joint reconstructions and tracks in one forward pass, including large-scale scenes with thousands of input images despite training with contexts of at most 64 views. We further present the data and training recipe underlying these capabilities, together with empirical studies of key design choices. Code and models are available at https://github.com/yyfz/Pi4.", "arxiv_id": "2611.23144", "arxiv_url": "https://arxiv.org/abs/2611.23144", "authors": ["Yifan Wang", "Weiguang Zhao", "Ni Yang", "Haoyu Guo", "Junting Dong", "Weinan Zhang", "Chunhua Shen"], "brief": "\u8fd9\u662f\u9762\u5411\u56db\u7ef4\u573a\u666f\u611f\u77e5\u7684\u57fa\u7840\u6a21\u578b\uff0c\u4ece\u672a\u6807\u5b9a\u56fe\u50cf\u6216\u89c6\u9891\u6062\u590d\u51e0\u4f55\u3001\u76f8\u673a\u4f4d\u59ff\u4e0e\u5c3a\u5ea6\u3002\u5b83\u7528\u51e0\u4f55\u6761\u4ef6\u5316\u8fd0\u52a8\u5206\u652f\u9884\u6d4b\u4e8c\u7ef4\u5bf9\u5e94\uff0c\u518d\u501f\u76ee\u6807\u89c6\u56fe\u51e0\u4f55\u63d0\u5347\u4e3a\u4e09\u7ef4\u8f68\u8ff9\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/yyfz/Pi4", "github_stars": 159, "hf_url": "https://huggingface.co/papers/2611.23144", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u51e0\u4f55\u5206\u652f\u4e0e\u51e0\u4f55\u6761\u4ef6\u5316\u8fd0\u52a8\u5206\u652f\u5171\u4eab\u9aa8\u5e72\uff0c\u7ea65\u4ebf\u53c2\u6570", "\u51e0\u4f55\u8bc4\u6d4b\u5e73\u5747\u6392\u540d\u6700\u4f73\uff0c\u517c\u987e\u4e8c\u7ef4\uff0f\u4e09\u7ef4\u8ddf\u8e2a\u4e0e\u8fd0\u52a8\u7269\u4f53\u5206\u5272", "\u8bad\u7ec3\u4e0a\u4e0b\u6587\u6700\u591a64\u89c6\u56fe\uff0c\u63a8\u7406\u53ef\u5904\u7406\u6570\u5343\u5f20\u56fe\u50cf"], "keywords": ["\u57fa\u7840\u6a21\u578b", "\u56db\u7ef4\u573a\u666f\u611f\u77e5", "\u4e09\u7ef4\u91cd\u5efa", "\u8fd0\u52a8\u8ffd\u8e2a"], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2611.23144v1", "published_at": "2026-11-17", "score": 0.532, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23144.png", "title": "$\u03c0^4$: A Foundation Model for 4D Scene Geometry and Motion", "tldr": "\u4ee5\u5171\u4eab\u9aa8\u5e72\u7edf\u4e00\u573a\u666f\u51e0\u4f55\u4e0e\u8fd0\u52a8\u6062\u590d\uff0c\u5355\u6b21\u524d\u5411\u5904\u7406\u672a\u6807\u5b9a\u56fe\u50cf\u5e76\u6269\u5c55\u81f3\u5343\u56fe\u573a\u666f\u3002", "upvotes": 13, "what_it_is": "\u8fd9\u662f\u9762\u5411\u56db\u7ef4\u573a\u666f\u611f\u77e5\u7684\u57fa\u7840\u6a21\u578b\uff0c\u4ece\u672a\u6807\u5b9a\u56fe\u50cf\u6216\u89c6\u9891\u6062\u590d\u51e0\u4f55\u3001\u76f8\u673a\u4f4d\u59ff\u4e0e\u5c3a\u5ea6\u3002\u5b83\u7528\u51e0\u4f55\u6761\u4ef6\u5316\u8fd0\u52a8\u5206\u652f\u9884\u6d4b\u4e8c\u7ef4\u5bf9\u5e94\uff0c\u518d\u501f\u76ee\u6807\u89c6\u56fe\u51e0\u4f55\u63d0\u5347\u4e3a\u4e09\u7ef4\u8f68\u8ff9\u3002", "why_notable": "\u5b83\u5c06\u91cd\u5efa\u4e0e\u8fd0\u52a8\u8ffd\u8e2a\u6574\u5408\u4e3a\u5355\u6b21\u524d\u5411\u63a8\u7406\uff0c\u53c2\u6570\u91cf\u4e0d\u8db3\u591a\u6570\u57fa\u7ebf\u7684\u4e00\u534a\uff1b\u4ece\u77ed\u4e0a\u4e0b\u6587\u8bad\u7ec3\u6269\u5c55\u81f3\u5343\u56fe\u573a\u666f\uff0c\u4f53\u73b0\u8f83\u5f3a\u7684\u89c4\u6a21\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Harness optimization is often studied with a fixed policy model and benchmark. When either changes, the optimizer must decide which parts of an evolved harness to reuse or revise, but the harness alone may not explain why earlier edits were made or how they performed. In this work, we study Continual Recursive Self-Improvement (CRSI), a setting for continuing existing harness-optimization methods across compatible benchmarks or policy models. We propose Self-Improvement Memory (SIM) for the harness optimizer, rather than the task-solving policy. SIM groups edits by recurring harness problem and records their rationale, predicted and observed outcomes, and evaluation context. New attempts extend this history as optimization continues. In our experiments across four domains, SIM achieves higher final scores than harness-only and root-cause-only continuation in cross-dataset and pairwise cross-model comparisons. Across ten independent source runs in coding, paired continuations with SIM improve final scores by an average of 2.36 points over harness-only continuation ($p=0.003$).", "arxiv_id": "2611.18856", "arxiv_url": "https://arxiv.org/abs/2611.18856", "authors": ["Xin Yu", "Fei Xia", "Jiaqi Pan", "Youbao Tang", "Chengzhi Liu", "Adams Yu", "Sicong Jiang", "Yanfei Chen", "Lingzhou Xue", "Ting Yu"], "brief": "\u63d0\u51fa\u9762\u5411\u8fd0\u884c\u6846\u67b6\u4f18\u5316\u5668\u7684\u81ea\u6539\u8fdb\u8bb0\u5fc6SIM\uff0c\u6309\u53cd\u590d\u51fa\u73b0\u7684\u95ee\u9898\u7ec4\u7ec7\u4fee\u6539\u8bb0\u5f55\u3002\u4fdd\u5b58\u4fee\u6539\u7406\u7531\u3001\u9884\u671f\u4e0e\u5b9e\u9645\u6548\u679c\u53ca\u8bc4\u6d4b\u73af\u5883\uff0c\u652f\u6301\u66f4\u6362\u6a21\u578b\u6216\u57fa\u51c6\u540e\u7ee7\u7eed\u4f18\u5316\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18856", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["SIM\u6309\u6846\u67b6\u95ee\u9898\u5f52\u6863\u4fee\u6539\u53ca\u8bc4\u6d4b\u5386\u53f2\uff0c\u800c\u975e\u589e\u5f3a\u4efb\u52a1\u7b56\u7565\u8bb0\u5fc6", "\u56db\u4e2a\u9886\u57df\u4e2d\uff0c\u8de8\u6570\u636e\u96c6\u4e0e\u8de8\u6a21\u578b\u5ef6\u7eed\u5747\u4f18\u4e8e\u4e24\u79cd\u5bf9\u7167", "\u7f16\u7a0b\u9886\u57df10\u6b21\u72ec\u7acb\u6e90\u8fd0\u884c\uff0c\u5e73\u5747\u63d0\u53472.36\u5206\uff0cp=0.003"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u81ea\u6211\u6539\u8fdb", "\u8bb0\u5fc6\u673a\u5236", "\u667a\u80fd\u4f53\u4f18\u5316"], "num_comments": 4, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2611.18856v1", "published_at": "2026-11-13", "score": 0.526, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (31\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18856.png", "title": "Self-Improvement Memory Enables Continual Recursive Self-Improvement", "tldr": "\u901a\u8fc7\u4fdd\u5b58\u4f18\u5316\u4fee\u6539\u7684\u539f\u56e0\u4e0e\u6548\u679c\uff0c\u8ba9\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u8de8\u6570\u636e\u96c6\u548c\u6a21\u578b\u6301\u7eed\u6539\u8fdb\u3002", "upvotes": 31, "what_it_is": "\u63d0\u51fa\u9762\u5411\u8fd0\u884c\u6846\u67b6\u4f18\u5316\u5668\u7684\u81ea\u6539\u8fdb\u8bb0\u5fc6SIM\uff0c\u6309\u53cd\u590d\u51fa\u73b0\u7684\u95ee\u9898\u7ec4\u7ec7\u4fee\u6539\u8bb0\u5f55\u3002\u4fdd\u5b58\u4fee\u6539\u7406\u7531\u3001\u9884\u671f\u4e0e\u5b9e\u9645\u6548\u679c\u53ca\u8bc4\u6d4b\u73af\u5883\uff0c\u652f\u6301\u66f4\u6362\u6a21\u578b\u6216\u57fa\u51c6\u540e\u7ee7\u7eed\u4f18\u5316\u3002", "why_notable": "\u5c06\u4f18\u5316\u7ecf\u9a8c\u4ece\u6846\u67b6\u914d\u7f6e\u4e2d\u5206\u79bb\u51fa\u6765\uff0c\u4f7f\u540e\u7eed\u4f18\u5316\u80fd\u5229\u7528\u5386\u53f2\u4f9d\u636e\uff0c\u800c\u4e0d\u53ea\u7ee7\u627f\u4fee\u6539\u7ed3\u679c\uff0c\u4e3a\u8de8\u6a21\u578b\u4e0e\u4efb\u52a1\u7684\u6301\u7eed\u6539\u8fdb\u63d0\u4f9b\u5b9e\u8bc1\u3002"}, {"abstract": "We present Xing 4, a series of large language models that extends the TeleChat lineage through coordinated advances in model architecture and training infrastructure on Ascend. This report describes the design principles and systems engineering behind the series, spanning architecture selection, large-scale pretraining, and reasoning and agentic post-training. We study how sparse activation, attention design, model depth and width, and speculative decoding balance model capacity with computation, memory access, and execution overhead. Our pretraining infrastructure builds on MindSpore HyperParallel, combining topology-aware hybrid sharding, efficient distributed optimizer execution, and coordinated management of long-sequence workloads and activation memory. CPU affinity and core isolation further reduce host scheduling interference. Together, these mechanisms support the pretraining of a 285B-parameter model on 8,192 Ascend 910C cards, providing a concrete setting for the architectural and systems studies. For post-training, we introduce TeleGym, a unified agent execution platform that connects execution, evaluation, and trajectory construction to policy optimization. Disaggregated asynchronous execution, bounded oversampling, and partial rollout accommodate heterogeneous task durations while preserving trajectory continuity across policy updates. Together, these advances establish an Ascend-oriented training foundation for the continued development of Xing 4 across model scales and increasingly demanding reasoning and agent workloads.", "arxiv_id": "2611.22115", "arxiv_url": "https://arxiv.org/abs/2611.22115", "authors": ["Xingchen AGI Lab", ":", "Baotian Hu", "Bingkai Yang", "Boyang Wang", "Changzai Pan", "Chao Lyu", "Chao Wang", "Chen Li", "Chenshuo Pan", "Chenyu Lin", "Chenyuan Zhang", "Chongming Liu", "Dawei Fan", "Di Wu", "Dong Guo", "Dong Li", "Dongfang Li", "Enlin Liu", "Fanye Xiao", "Fengkai Li", "Fubei Yao", "Gang Lin", "Han Gao", "Hanming Wu", "Haowei He", "Huapeng Liu", "Hua Wang", "Huinan Xu", "Jiahong Xiong", "Jiaxin Peng", "Jianxiang Ma", "Jianxing Zhuge", "Jie Zhang", "Ji Xiong", "Jinglin Chen", "Jingqi Li", "Jingxuan Li", "Jiwang Ye", "Junchen Li", "Junbiao Li", "Junyang Wu", "Kaidong Yu", "Kaipeng Jia", "Kehai Chen", "Kuai Li", "Laobin Liu", "Lei Li", "Libo Qin", "Lingling Shi", "Luwen Pu", "Menghao Xu", "Mengjiao Bao", "Mengqi Chen", "Min Zhang", "Mingrui Wang", "Naying Wang", "Peicong Han", "Peiming Guo", "Pengfei Li", "Qiang Feng", "Qi Wang", "Qingjun Zhu", "Qingli Li", "Qitai Ding", "Qiyi Xie", "Quanchao Zhao", "Rongbao Han", "Rui Xue", "Ruiyu Fang", "Ruiting Song", "Shijie Li", "Shiquan Wang", "Shua https://arxiv.org/pdf/2611.22115v1", "published_at": "2026-11-17", "score": 0.49, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (150\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22115.png", "title": "TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "tldr": "Xing 4\u6253\u901a\u6607\u817e\u4e0a\u7684\u8d85\u5927\u6a21\u578b\u9884\u8bad\u7ec3\u4e0e\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\uff0c\u534f\u540c\u4f18\u5316\u67b6\u6784\u548c\u7cfb\u7edf\u3002", "upvotes": 150, "what_it_is": "\u63a8\u51faXing 4\u6a21\u578b\u7cfb\u5217\uff0c\u5728\u6607\u817e\u4e0eMindSpore\u4e0a\u534f\u540c\u4f18\u5316\u6a21\u578b\u67b6\u6784\u548c\u5206\u5e03\u5f0f\u9884\u8bad\u7ec3\uff0c\u5e76\u4ee5TeleGym\u7edf\u4e00\u667a\u80fd\u4f53\u6267\u884c\u3001\u8bc4\u4f30\u548c\u7b56\u7565\u4f18\u5316\u3002", "why_notable": "\u7ed9\u51fa\u4e86\u56fd\u4ea7\u82af\u7247\u4e0e\u6846\u67b6\u627f\u8f7d\u8d85\u5927\u89c4\u6a21\u6a21\u578b\u8bad\u7ec3\u7684\u5177\u4f53\u5b9e\u8df5\uff0c\u5e76\u5c06\u667a\u80fd\u4f53\u8f68\u8ff9\u751f\u6210\u63a5\u5165\u7b56\u7565\u4f18\u5316\uff0c\u4e3a\u590d\u6742\u63a8\u7406\u4efb\u52a1\u63d0\u4f9b\u7cfb\u7edf\u57fa\u7840\u3002"}, {"abstract": "Asynchronous reinforcement learning increases training throughput, but data from stale policies and numerical mismatch between training and inference can destabilize learning. To stabilize off-policy learning, score centering (SC) removes the effect of reward baselines on the expected update. Our gradient diagnostics show less extreme gradients with SC than with importance sampling (IS), but SC can still fail when the learner moves far from the behavior policy that generated the data. To limit this policy mismatch, we introduce Regularized Score Centering (RSC), which adds a reverse Kullback-Leibler (KL) penalty to encourage the learner\u0027s next-token distribution to stay close to the behavior policy\u0027s next-token distribution. RSC works with or without truncated importance sampling (TIS), which caps token importance weights. Our theoretical analysis supports this approach, showing that KL regularization improves convergence guarantees. We evaluate dense and mixture-of-experts models on mathematical reasoning and agentic tasks, including online shopping, tool use, games, and fully asynchronous software engineering. RSC with TIS substantially improves sample efficiency across all agentic benchmarks, attaining higher training rewards with the same number of sampled responses. In final evaluations, it achieves top performance across all six agentic tasks, improving by 14.3% on AppWorld and reaching 9.9 times the strongest baseline\u0027s score on BabyAI.", "arxiv_id": "2611.21791", "arxiv_url": "https://arxiv.org/abs/2611.21791", "authors": ["Hao Bai", "Chenlu Ye", "Xuanchang Zhang", "Aviral Kumar", "Tong Zhang"], "brief": "\u63d0\u51fa\u6b63\u5219\u5316\u5206\u6570\u4e2d\u5fc3\u5316\uff0c\u5728\u6d88\u9664\u5956\u52b1\u57fa\u7ebf\u5f71\u54cd\u7684\u66f4\u65b0\u4e2d\u52a0\u5165\u53cd\u5411KL\u60e9\u7f5a\uff0c\u7ea6\u675f\u5b66\u4e60\u7b56\u7565\u504f\u79bb\u884c\u4e3a\u7b56\u7565\u3002\u53ef\u7ed3\u5408\u622a\u65ad\u91cd\u8981\u6027\u91c7\u6837\uff0c\u964d\u4f4e\u5f02\u6b65\u8bad\u7ec3\u4e2d\u7684\u5931\u7a33\u98ce\u9669\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21791", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RSC\u52a0\u5165\u53cd\u5411KL\u60e9\u7f5a\uff0c\u7406\u8bba\u4e0a\u6539\u5584\u6536\u655b\u4fdd\u8bc1", "\u7ed3\u5408TIS\u9650\u5236\u8bcd\u5143\u91cd\u8981\u6027\u6743\u91cd\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u6837\u672c\u6548\u7387", "\u516d\u9879\u667a\u80fd\u4f53\u4efb\u52a1\u9886\u5148\uff1bBabyAI\u8fbe\u6700\u5f3a\u57fa\u7ebf9.9\u500d"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5f02\u6b65\u8bad\u7ec3", "\u7b56\u7565\u6b63\u5219\u5316", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.21791v1", "published_at": "2026-11-16", "score": 0.474, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21791.png", "title": "Regularized Score Centering", "tldr": "\u901a\u8fc7\u53cd\u5411KL\u7ea6\u675f\u7b56\u7565\u6f02\u79fb\uff0c\u7a33\u5b9a\u5f02\u6b65\u5f3a\u5316\u5b66\u4e60\u5e76\u63d0\u5347\u667a\u80fd\u4f53\u8bad\u7ec3\u6548\u7387\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u6b63\u5219\u5316\u5206\u6570\u4e2d\u5fc3\u5316\uff0c\u5728\u6d88\u9664\u5956\u52b1\u57fa\u7ebf\u5f71\u54cd\u7684\u66f4\u65b0\u4e2d\u52a0\u5165\u53cd\u5411KL\u60e9\u7f5a\uff0c\u7ea6\u675f\u5b66\u4e60\u7b56\u7565\u504f\u79bb\u884c\u4e3a\u7b56\u7565\u3002\u53ef\u7ed3\u5408\u622a\u65ad\u91cd\u8981\u6027\u91c7\u6837\uff0c\u964d\u4f4e\u5f02\u6b65\u8bad\u7ec3\u4e2d\u7684\u5931\u7a33\u98ce\u9669\u3002", "why_notable": "\u5c06\u5f02\u6b65\u8bad\u7ec3\u7684\u541e\u5410\u4f18\u52bf\u4e0e\u7b56\u7565\u7a33\u5b9a\u6027\u7ed3\u5408\uff0c\u5728\u7a20\u5bc6\u53ca\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff1bAppWorld\u63d0\u534714.3%\uff0c\u663e\u793a\u5bf9\u590d\u6742\u667a\u80fd\u4f53\u8bad\u7ec3\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Driving world models usually generate videos from six pinhole cameras with separate optical centres and small overlaps, and must learn to keep these views consistent. We present PanDWM, which stitches them into one $360^\\circ$ panoramic band. Camera boundaries then fall inside one image, so keeping the views consistent means keeping the image continuous, and each pixel still records its camera ray. Conditioned on layouts, a causal student generates the band window by window in four steps; it is distilled from a causal teacher and trained on its own rollouts. A feed-forward decoder lifts each frame along these rays into 3D Gaussians, and static Gaussians from neighbouring frames complete them into 4D scenes. On nuScenes, scored in one stitched $360^\\circ$ view, PanDWM has lower FID and FVD than the multi-camera baselines at $8$-$46\\times$ their speed, and keeps its 50-step teacher\u0027s FID while lowering FVD by 22-25%.", "arxiv_id": "2611.19857", "arxiv_url": "https://arxiv.org/abs/2611.19857", "authors": ["Jiajun Sun", "Zeyu Zhang", "Zeyu Ren", "Guangfeng Jiang", "Yang Zhao", "Hao Tang"], "brief": "PanDWM\u628a\u516d\u8def\u76f8\u673a\u62fc\u6210\u4fdd\u7559\u50cf\u7d20\u5c04\u7ebf\u7684\u5168\u666f\u5e26\uff0c\u4ee5\u5e03\u5c40\u6761\u4ef6\u9a71\u52a8\u56e0\u679c\u5b66\u751f\u9010\u7a97\u751f\u6210\u3002\u518d\u6cbf\u5c04\u7ebf\u89e3\u7801\u4e3a\u4e09\u7ef4\u9ad8\u65af\uff0c\u878d\u5408\u90bb\u5e27\u9759\u6001\u9ad8\u65af\u6784\u6210\u56db\u7ef4\u573a\u666f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AIGeeksGroup/PanDWM", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.19857", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u516d\u8def\u76f8\u673a\u62fc\u6210360\u00b0\u5168\u666f\u5e26\uff0c\u5c06\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\u8f6c\u4e3a\u56fe\u50cf\u8fde\u7eed\u6027", "\u56e0\u679c\u5b66\u751f\u84b8\u998f\u540e\u4ec5\u97004\u6b65\u751f\u6210\uff0c\u5e76\u7528\u81ea\u8eab\u6eda\u52a8\u8f93\u51fa\u8bad\u7ec3", "nuScenes\u4e0a\u52a0\u901f8\u201446\u500d\uff0c\u8f8350\u6b65\u6559\u5e08FVD\u964d\u4f4e22\u201425%"], "keywords": ["\u9a7e\u9a76\u4e16\u754c\u6a21\u578b", "\u5168\u666f\u751f\u6210", "\u77e5\u8bc6\u84b8\u998f", "\u4e09\u7ef4\u9ad8\u65af"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2611.19857v1", "published_at": "2026-11-15", "score": 0.464, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19857.png", "title": "PanDWM: Panoramic 4D Driving World Models", "tldr": "\u5c06\u516d\u8def\u9a7e\u9a76\u89c6\u89d2\u7edf\u4e00\u4e3a\u5168\u666f\u751f\u6210\uff0c\u4ee5\u56db\u6b65\u84b8\u998f\u52a0\u901f\u5e76\u91cd\u5efa\u65f6\u5e8f\u4e09\u7ef4\u573a\u666f\u3002", "upvotes": 2, "what_it_is": "PanDWM\u628a\u516d\u8def\u76f8\u673a\u62fc\u6210\u4fdd\u7559\u50cf\u7d20\u5c04\u7ebf\u7684\u5168\u666f\u5e26\uff0c\u4ee5\u5e03\u5c40\u6761\u4ef6\u9a71\u52a8\u56e0\u679c\u5b66\u751f\u9010\u7a97\u751f\u6210\u3002\u518d\u6cbf\u5c04\u7ebf\u89e3\u7801\u4e3a\u4e09\u7ef4\u9ad8\u65af\uff0c\u878d\u5408\u90bb\u5e27\u9759\u6001\u9ad8\u65af\u6784\u6210\u56db\u7ef4\u573a\u666f\u3002", "why_notable": "\u7528\u7edf\u4e00\u5168\u666f\u8868\u793a\u7b80\u5316\u591a\u76f8\u673a\u4e00\u81f4\u6027\u5efa\u6a21\uff0c\u5e76\u8854\u63a5\u89c6\u9891\u751f\u6210\u4e0e\u56db\u7ef4\u91cd\u5efa\uff1b\u5728\u4fdd\u6301\u6559\u5e08FID\u7684\u540c\u65f6\u6539\u5584\u65f6\u5e8f\u8d28\u91cf\uff0c\u4f53\u73b0\u6548\u7387\u4e0e\u8d28\u91cf\u517c\u987e\u7684\u6f5c\u529b\u3002"}, {"abstract": "On-policy distillation (OPD) transfers specialized capabilities to language-model agents, but its cross-domain effects on interaction remain unclear. We investigate how OPD reshapes ReAct interaction patterns across mathematics, ALFWorld, and $\u03c4^2$-bench, focusing on reasoning, actions, and observation acquisition. General-reasoning supervision reduces mathematical tool attempts from 70.4% to 14.4% while increasing accuracy from 16.7% to 38.0%; code-interpreter supervision improves household actions and retail queries. In contrast, ALFWorld supervision reduces $\u03c4^2$-bench accuracy from 41.5% to 6.6%, accompanied by frequent tool calls that violate user-information dependencies. To address negative transfer using only source-domain training trajectories, we explore selective OPD guided by teacher preference changes before and after domain-specific RL. Retaining the top 95% of positions raises $\u03c4^2$ accuracy from 11.5% to 29.9% with a source-learning trade-off.", "arxiv_id": "2611.19244", "arxiv_url": "https://arxiv.org/abs/2611.19244", "authors": ["Deyang Kong", "Zhaoyi Li", "Sijian Ren", "Yuan Wei", "Ying Wei", "Defu Lian", "Shikun Zhang", "Wei Ye"], "brief": "\u7814\u7a76\u5728\u7b56\u7565\u84b8\u998f\u5982\u4f55\u6539\u53d8\u667a\u80fd\u4f53\u8de8\u4efb\u52a1\u7684\u63a8\u7406\u3001\u884c\u52a8\u4e0e\u89c2\u5bdf\u83b7\u53d6\u6a21\u5f0f\uff0c\u5e76\u5229\u7528\u6559\u5e08\u5728\u9886\u57df\u5f3a\u5316\u5b66\u4e60\u524d\u540e\u7684\u504f\u597d\u53d8\u5316\u7b5b\u9009\u8bad\u7ec3\u4f4d\u7f6e\uff0c\u7f13\u89e3\u8d1f\u8fc1\u79fb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.19244", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u901a\u7528\u63a8\u7406\u76d1\u7763\u4f7f\u5de5\u5177\u5c1d\u8bd5\u738770.4%\u219214.4%\uff0c\u51c6\u786e\u7387\u5347\u81f338.0%", "ALFWorld\u76d1\u7763\u4f7f\u03c4\u00b2\u51c6\u786e\u738741.5%\u21926.6%", "\u9009\u62e9\u6027OPD\u4fdd\u7559\u524d95%\u4f4d\u7f6e\uff0c\u03c4\u00b2\u51c6\u786e\u738711.5%\u219229.9%"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.19244v1", "published_at": "2026-11-14", "score": 0.388, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19244.png", "title": "Agentic On-Policy Distillation Implicitly Reshapes LLMs\u0027 ReAct Patterns", "tldr": "\u5728\u7b56\u7565\u84b8\u998f\u4e0d\u4ec5\u8fc1\u79fb\u80fd\u529b\uff0c\u4e5f\u4f1a\u91cd\u5851\u667a\u80fd\u4f53\u4ea4\u4e92\u6a21\u5f0f\uff0c\u5e76\u5f15\u53d1\u8de8\u57df\u8d1f\u8fc1\u79fb\u3002", "upvotes": 7, "what_it_is": "\u7814\u7a76\u5728\u7b56\u7565\u84b8\u998f\u5982\u4f55\u6539\u53d8\u667a\u80fd\u4f53\u8de8\u4efb\u52a1\u7684\u63a8\u7406\u3001\u884c\u52a8\u4e0e\u89c2\u5bdf\u83b7\u53d6\u6a21\u5f0f\uff0c\u5e76\u5229\u7528\u6559\u5e08\u5728\u9886\u57df\u5f3a\u5316\u5b66\u4e60\u524d\u540e\u7684\u504f\u597d\u53d8\u5316\u7b5b\u9009\u8bad\u7ec3\u4f4d\u7f6e\uff0c\u7f13\u89e3\u8d1f\u8fc1\u79fb\u3002", "why_notable": "\u63ed\u793a\u80fd\u529b\u84b8\u998f\u4f1a\u9690\u5f0f\u6539\u53d8\u5de5\u5177\u4f7f\u7528\u4e0e\u4fe1\u606f\u4f9d\u8d56\uff0c\u800c\u975e\u53ea\u63d0\u5347\u6e90\u57df\u8868\u73b0\uff1b\u4ec5\u7528\u6e90\u57df\u8f68\u8ff9\u7f13\u89e3\u8d1f\u8fc1\u79fb\uff0c\u4f46\u9700\u6743\u8861\u6e90\u57df\u5b66\u4e60\u3002"}, {"abstract": "Can AI agents design robots that work in the real world? We introduce RoboBuilder, a benchmark in which coding agents co-design a robot\u0027s hardware and program from standard parts, motors and a custom 3D-printed part, and every design that passes in simulation is built and tested on a physical course. Simulation alone is not enough: under public part data, none of 15 initial passing designs crossed the real course, so an agent learns the simulator from measurements it requests and videos of real runs. Across four frontier coding agents, ten obstacles at three difficulty levels, 16,427 simulations of 12,774 distinct robots and 135 physical robots built in an estimated 240 hours, agents solve nearly all easy obstacles and invent mechanisms our search baselines do not reach, but falter at harder levels, when one robot must cross every obstacle, and in the real world, where 66% of simulated passes hold across all levels. Closing the loop helps: shown a video of its real failure, an agent redesigns the robot, sometimes correcting its simulator, and removes 72% of level-1 and level-2 failures. RoboBuilder measures progress toward agents that engineer real machines. Project Page: https://ghadinehme.com/robobuilder.github.io/", "arxiv_id": "2611.23855", "arxiv_url": "https://arxiv.org/abs/2611.23855", "authors": ["Ghadi Nehme", "Dahyun Nam", "Akshay Govind Srinivasan", "Faez Ahmed"], "brief": "RoboBuilder\u662f\u673a\u5668\u4eba\u534f\u540c\u8bbe\u8ba1\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u7528\u6807\u51c6\u96f6\u4ef6\u3001\u7535\u673a\u548c\u5b9a\u5236\u6253\u5370\u4ef6\u8bbe\u8ba1\u786c\u4ef6\u4e0e\u7a0b\u5e8f\u3002\u4eff\u771f\u901a\u8fc7\u540e\u5b9e\u673a\u6d4b\u8bd5\uff0c\u518d\u7528\u6d4b\u91cf\u4e0e\u89c6\u9891\u53cd\u9988\u8c03\u6574\u8bbe\u8ba1\u53ca\u4eff\u771f\u5668\u3002", "categories": ["cs.AI", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23855", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b4\u79cd\u7f16\u7a0b\u667a\u80fd\u4f53\uff0c\u8986\u76d610\u79cd\u969c\u788d\u30013\u6863\u96be\u5ea6", "\u5b8c\u621016427\u6b21\u4eff\u771f\uff0c\u5236\u9020\u5e76\u6d4b\u8bd5135\u53f0\u5b9e\u4f53\u673a\u5668\u4eba", "\u771f\u5b9e\u89c6\u9891\u53cd\u9988\u6d88\u966472%\u7684\u4e00\u7ea7\u4e0e\u4e8c\u7ea7\u5931\u8d25"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u8bbe\u8ba1", "\u4eff\u771f\u5230\u73b0\u5b9e", "\u89c6\u9891\u53cd\u9988"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23855v1", "published_at": "2026-11-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RoboBuilder: Agentic Robot Co-Design with Real-world Video Feedback in the Loop", "tldr": "\u8ba9\u7f16\u7a0b\u667a\u80fd\u4f53\u8054\u5408\u8bbe\u8ba1\u673a\u5668\u4eba\u786c\u4ef6\u4e0e\u7a0b\u5e8f\uff0c\u5e76\u7528\u771f\u5b9e\u5931\u8d25\u89c6\u9891\u95ed\u73af\u6539\u8fdb", "upvotes": 0, "what_it_is": "RoboBuilder\u662f\u673a\u5668\u4eba\u534f\u540c\u8bbe\u8ba1\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u7528\u6807\u51c6\u96f6\u4ef6\u3001\u7535\u673a\u548c\u5b9a\u5236\u6253\u5370\u4ef6\u8bbe\u8ba1\u786c\u4ef6\u4e0e\u7a0b\u5e8f\u3002\u4eff\u771f\u901a\u8fc7\u540e\u5b9e\u673a\u6d4b\u8bd5\uff0c\u518d\u7528\u6d4b\u91cf\u4e0e\u89c6\u9891\u53cd\u9988\u8c03\u6574\u8bbe\u8ba1\u53ca\u4eff\u771f\u5668\u3002", "why_notable": "\u5c06\u667a\u80fd\u4f53\u5de5\u7a0b\u80fd\u529b\u8bc4\u6d4b\u63a8\u8fdb\u5230\u5b9e\u7269\u5236\u9020\u4e0e\u6d4b\u8bd5\uff0c\u63ed\u793a\u4eff\u771f\u901a\u8fc7\u4ec5\u670966%\u80fd\u8fc1\u79fb\u5230\u73b0\u5b9e\uff0c\u5e76\u9a8c\u8bc1\u771f\u5b9e\u53cd\u9988\u5bf9\u8bbe\u8ba1\u8fed\u4ee3\u7684\u4ef7\u503c\u3002"}, {"abstract": "Autonomous LLM agents incur substantial cost and latency by invoking a large model (System-2) at every step, even when many intermediate actions choose among a small set of known candidates. Existing dual-system agents offload such decisions to a lightweight System-1 model, but rely on workflow-specific hooks authored per environment. We present AnyS1, a framework that turns human-authored procedural skills, whose instructions naturally specify where choices arise and which options apply, into a shared, domain-general source of decision points. Offline, AnyS1 mines grounded enumerable decisions across over 1,000 public skills, gathers execution-grounded trajectory states inside isolated containers to construct Any-DP, and trains a single calibrated 4B pointer System-1 with label smoothing. At run time, compiled workflows resolve routine decisions in one forward pass and fall back to System-2 when confidence falls below a calibrated threshold. Across three unseen benchmarks and distinct System-2 model families, AnyS1 preserves task reliability while cutting episode cost by 75-91% and model-call time by 63-92% relative to an uncompiled System-2 agent, and maintains performance under zero-shot threshold transfer.", "arxiv_id": "2611.23751", "arxiv_url": "https://arxiv.org/abs/2611.23751", "authors": ["Rui Li", "Liyang He", "Zheng Zhang", "Zhenya Huang", "Qi Liu"], "brief": "AnyS1\u4ece\u4eba\u5de5\u7f16\u5199\u7684\u7a0b\u5e8f\u5316\u6280\u80fd\u4e2d\u6316\u6398\u53ef\u679a\u4e3e\u51b3\u7b56\uff0c\u8bad\u7ec3\u7edf\u4e00\u7684\u8f7b\u91cf\u6307\u9488\u6a21\u578b\u3002\u8fd0\u884c\u65f6\u76f4\u63a5\u5904\u7406\u5e38\u89c4\u9009\u62e9\uff0c\u7f6e\u4fe1\u5ea6\u4e0d\u8db3\u5219\u56de\u9000\u5927\u6a21\u578b\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23751", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ece1000\u4f59\u9879\u516c\u5f00\u6280\u80fd\u91c7\u96c6\u6267\u884c\u8f68\u8ff9\uff0c\u6784\u5efaAny-DP", "\u8bad\u7ec34B\u6307\u9488\u6a21\u578b\uff0c\u4ee5\u6807\u7b7e\u5e73\u6ed1\u6821\u51c6\u51b3\u7b56\u7f6e\u4fe1\u5ea6", "\u4e09\u9879\u672a\u89c1\u57fa\u51c6\u4e0a\u6210\u672c\u964d75\u201391%\uff0c\u8c03\u7528\u8017\u65f6\u964d63\u201392%"], "keywords": ["\u667a\u80fd\u4f53", "\u9ad8\u6548\u63a8\u7406", "\u7f6e\u4fe1\u5ea6\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23751v1", "published_at": "2026-11-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Thinking Fast, Anywhere: One System-1 for the Decision Points of Any Agent Workflow", "tldr": "\u7528\u7edf\u4e00\u8f7b\u91cf\u6a21\u578b\u63a5\u7ba1\u667a\u80fd\u4f53\u5e38\u89c4\u51b3\u7b56\uff0c\u5728\u4fdd\u6301\u53ef\u9760\u6027\u7684\u540c\u65f6\u5927\u5e45\u964d\u672c\u63d0\u901f\u3002", "upvotes": 0, "what_it_is": "AnyS1\u4ece\u4eba\u5de5\u7f16\u5199\u7684\u7a0b\u5e8f\u5316\u6280\u80fd\u4e2d\u6316\u6398\u53ef\u679a\u4e3e\u51b3\u7b56\uff0c\u8bad\u7ec3\u7edf\u4e00\u7684\u8f7b\u91cf\u6307\u9488\u6a21\u578b\u3002\u8fd0\u884c\u65f6\u76f4\u63a5\u5904\u7406\u5e38\u89c4\u9009\u62e9\uff0c\u7f6e\u4fe1\u5ea6\u4e0d\u8db3\u5219\u56de\u9000\u5927\u6a21\u578b\u3002", "why_notable": "\u5c06\u53cc\u7cfb\u7edf\u5206\u5de5\u4ece\u9010\u73af\u5883\u5b9a\u5236\u6269\u5c55\u5230\u5171\u4eab\u6280\u80fd\u9a71\u52a8\uff0c\u5728\u4fdd\u6301\u4efb\u52a1\u53ef\u9760\u6027\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u5f00\u9500\uff0c\u4e14\u652f\u6301\u9608\u503c\u96f6\u6837\u672c\u8fc1\u79fb\u3002"}, {"abstract": "Frontier multimodal models can now control robots zero-shot from images, yet many manipulation tasks depend on contact forces that images cannot show. Bringing force to an API-only frozen model raises two challenges. First, contact evolves much faster than an API model can decide, so the system must close the loop on force beneath the model. Second, a frozen model cannot interpret raw force streams, so force must be returned in a form the model can reason about. Therefore, we present ForceHarness, a harness that lets frozen models use force without demonstrations or finetuning. After calibrating hand force from a wrist sensor or joint torques alone, ForceHarness addresses the first challenge with self-terminating force primitives that regulate force on their own and return at a contact event. To address the second challenge, a physics translation layer turns each force trace into physical quantities with uncertainty as the tool result. To evaluate ForceHarness against expert force controllers and learned policies under identical conditions, we also build HiddenPhys, a seven-task MuJoCo benchmark with hidden physical variables. On a real arm without a wrist force sensor, ForceHarness raises the zero-shot success rate of GPT-6 Astra from 3.3% to 90.0%. In simulation, it adds 17.5 percentage points on the public ForceBench suite and 34.3 percentage points on HiddenPhys, surpassing force-aware policies trained on demonstrations on both benchmarks and matching hand-written expert controllers on HiddenPhys. Ablations further show that smaller models make significantly better decisions when given physical quantities rather than raw force values.", "arxiv_id": "2611.21099", "arxiv_url": "https://arxiv.org/abs/2611.21099", "authors": ["Ke Sun", "Kevin Yuchen Ma", "Yike Zhang", "Yanzhe Chen", "Mike Zheng Shou"], "brief": "ForceHarness\u4e3a\u4ec5\u80fd\u901a\u8fc7API\u8c03\u7528\u7684\u51bb\u7ed3\u6a21\u578b\u63a5\u5165\u529b\u89c9\uff0c\u65e0\u9700\u793a\u8303\u6216\u5fae\u8c03\u3002\u5e95\u5c42\u529b\u63a7\u539f\u8bed\u81ea\u4e3b\u95ed\u73af\u5e76\u5728\u63a5\u89e6\u4e8b\u4ef6\u7ec8\u6b62\uff0c\u7ffb\u8bd1\u5c42\u5c06\u529b\u8f68\u8ff9\u8f6c\u4e3a\u5e26\u4e0d\u786e\u5b9a\u6027\u7684\u7269\u7406\u91cf\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/showlab/ForceHarness", "github_stars": 32, "hf_url": "https://huggingface.co/papers/2611.21099", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u81ea\u7ec8\u6b62\u529b\u63a7\u539f\u8bed\u5904\u7406\u9ad8\u901f\u63a5\u89e6\uff0c\u7269\u7406\u7ffb\u8bd1\u5c42\u63d0\u4f9b\u53ef\u63a8\u7406\u53cd\u9988", "\u771f\u5b9e\u673a\u68b0\u81c2\u65e0\u8155\u90e8\u529b\u4f20\u611f\u5668\uff0c\u6210\u529f\u7387\u4ece3.3%\u5347\u81f390.0%", "ForceBench\u4e0e\u4e03\u4efb\u52a1HiddenPhys\u5206\u522b\u63d0\u534717.5\u300134.3\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u529b\u63a7\u5236", "\u591a\u6a21\u6001\u6a21\u578b", "\u96f6\u6837\u672c\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": "Show Lab", "pdf_url": "https://arxiv.org/pdf/2611.21099v1", "published_at": "2026-11-16", "score": 0.335, "selected_reasons": ["HF trending (39\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21099.png", "title": "ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models", "tldr": "\u901a\u8fc7\u81ea\u4e3b\u529b\u63a7\u4e0e\u7269\u7406\u91cf\u53cd\u9988\uff0c\u8ba9\u51bb\u7ed3\u591a\u6a21\u6001\u6a21\u578b\u96f6\u6837\u672c\u5b8c\u6210\u63a5\u89e6\u64cd\u4f5c\u3002", "upvotes": 39, "what_it_is": "ForceHarness\u4e3a\u4ec5\u80fd\u901a\u8fc7API\u8c03\u7528\u7684\u51bb\u7ed3\u6a21\u578b\u63a5\u5165\u529b\u89c9\uff0c\u65e0\u9700\u793a\u8303\u6216\u5fae\u8c03\u3002\u5e95\u5c42\u529b\u63a7\u539f\u8bed\u81ea\u4e3b\u95ed\u73af\u5e76\u5728\u63a5\u89e6\u4e8b\u4ef6\u7ec8\u6b62\uff0c\u7ffb\u8bd1\u5c42\u5c06\u529b\u8f68\u8ff9\u8f6c\u4e3a\u5e26\u4e0d\u786e\u5b9a\u6027\u7684\u7269\u7406\u91cf\u3002", "why_notable": "\u5c06\u9ad8\u901f\u63a5\u89e6\u63a7\u5236\u4e0e\u6a21\u578b\u51b3\u7b56\u89e3\u8026\uff0c\u4e3a\u51bb\u7ed3\u6a21\u578b\u63d0\u4f9b\u53ef\u63a8\u7406\u7684\u7269\u7406\u53cd\u9988\uff1b\u96f6\u6837\u672c\u8868\u73b0\u8d85\u8fc7\u793a\u8303\u8bad\u7ec3\u7b56\u7565\uff0c\u5e76\u5728HiddenPhys\u8ffd\u5e73\u4e13\u5bb6\u63a7\u5236\u5668\u3002"}, {"abstract": "Kernel optimization is essential for efficient large language model (LLM) training and inference on Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the ability of agents to optimize existing implementations under input configurations drawn from real workloads. To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across three difficulty levels. Each kernel is paired with test cases whose data types and tensor shapes are collected from real-world training and inference tasks. Consequently, performance improvements on AscendGYM map directly to the corresponding workloads. In terms of usability, two evaluation modes are supported in AscendGYM: model evaluation and model-harness evaluation. The kernel optimization capabilities of both trained models and custom agents are allowed to be measured. It provides a complete execution environment that closely reproduces how Ascend kernels are invoked in practical pipelines. For model evaluation, it additionally includes a built-in harness equipped with search orchestration and experience accumulation. Finally, we propose a new metric, the Speedup-Token Score (STS), which quantifies performance gains relative to token cost. By jointly considering speedup and cost, STS enables the assessment of practical kernel optimization capability of a model or harness under an acceptable budget. AscendGYM is available at https://github.com/SLAI-AITP/AscendGYM.", "arxiv_id": "2611.17621", "arxiv_url": "https://arxiv.org/abs/2611.17621", "authors": ["AI Training Platform Team", "Bingwei Zhang", "Jing Li", "Amir Abdullin", "Sihang Chen", "Xin Chen", "Liangjun Feng", "Yingmeng Gao", "Tao Guo", "Junjie Huang", "Dongfang Li", "Zhanglian Lin", "Jiajun Liu", "Zekun Liu", "Zhengxuan Lu", "Xiaodong Luo", "Jian Meng", "Ivan Nosov", "Linyuan Qiu", "Weijian Sun", "Wanrui Yan", "Binfan Zheng", "Zhicheng Zhou", "Baotian Hu", "Min Zhang", "Haizhou Li", "Zhiquan Luo"], "brief": "AscendGYM\u8bc4\u6d4b\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u4f18\u5316\u65e2\u6709\u6607\u817e\u5185\u6838\u7684\u80fd\u529b\uff0c\u91c7\u7528\u771f\u5b9e\u8bad\u7ec3\u3001\u63a8\u7406\u4efb\u52a1\u7684\u8f93\u5165\u914d\u7f6e\uff0c\u5e76\u63d0\u4f9b\u6267\u884c\u73af\u5883\u4e0e\u5185\u7f6e\u641c\u7d22\u6846\u67b6\u3002", "categories": ["cs.AI", "cs.DC", "cs.LG"], "github_repo": "https://github.com/SLAI-AITP/AscendGYM", "github_stars": 32, "hf_url": "https://huggingface.co/papers/2611.17621", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9996\u6279\u5305\u542b48\u4e2a\u5185\u6838\uff0c\u8986\u76d6\u4e09\u4e2a\u96be\u5ea6\u7b49\u7ea7", "\u652f\u6301\u6a21\u578b\u8bc4\u6d4b\u4e0e\u6a21\u578b\u2014\u6267\u884c\u6846\u67b6\u8054\u5408\u8bc4\u6d4b", "STS\u6307\u6807\u8861\u91cf\u52a0\u901f\u6536\u76ca\u76f8\u5bf9\u4e8e\u4ee4\u724c\u6210\u672c\u7684\u8868\u73b0"], "keywords": ["\u5185\u6838\u4f18\u5316", "\u6607\u817e\u8ba1\u7b97", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u6210\u672c\u6548\u7387"], "num_comments": 3, "on_hf": true, "organization": "SLAI-AITP", "pdf_url": "https://arxiv.org/pdf/2611.17621v1", "published_at": "2026-11-13", "score": 0.332, "selected_reasons": ["HF trending (91\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17621.png", "title": "AscendGYM: A Cost-Aware Kernel Optimization Benchmark for Real-World Workloads on Ascend NPUs", "tldr": "\u4ee5\u771f\u5b9e\u8d1f\u8f7d\u8bc4\u6d4b\u6607\u817e\u5185\u6838\u4f18\u5316\u80fd\u529b\uff0c\u5e76\u5c06\u52a0\u901f\u6536\u76ca\u4e0e\u4ee4\u724c\u6210\u672c\u8054\u5408\u8ba1\u5206\u3002", "upvotes": 91, "what_it_is": "AscendGYM\u8bc4\u6d4b\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u4f18\u5316\u65e2\u6709\u6607\u817e\u5185\u6838\u7684\u80fd\u529b\uff0c\u91c7\u7528\u771f\u5b9e\u8bad\u7ec3\u3001\u63a8\u7406\u4efb\u52a1\u7684\u8f93\u5165\u914d\u7f6e\uff0c\u5e76\u63d0\u4f9b\u6267\u884c\u73af\u5883\u4e0e\u5185\u7f6e\u641c\u7d22\u6846\u67b6\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u91cd\u70b9\u4ece\u751f\u6210\u5185\u6838\u8f6c\u5411\u771f\u5b9e\u8d1f\u8f7d\u4e0b\u7684\u4f18\u5316\uff0c\u5e76\u7eb3\u5165\u4ee4\u724c\u9884\u7b97\uff0c\u6709\u52a9\u4e8e\u6bd4\u8f83\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u7684\u5b9e\u9645\u4f18\u5316\u6548\u7387\u3002"}, {"abstract": "Transformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MBT variants: Wide-Shallow preserves block width, Narrow-Deep preserves sequential depth, and Balanced interpolates between them. In controlled pretraining experiments at four mixture-of-experts scales (0.8B to 2.1B total parameters), 2-branch Wide-Shallow MBTs consistently outperform sequential Transformers under matched parameter and training-compute budgets. Balanced MBTs improve further and retain comparable quality as the number of branches increases. To improve inference efficiency at long contexts, we introduce Joint-KV, which constructs a shared KV cache from branch representations at each depth. Our final recipe combines Balanced MBTs with Joint-KV, supported by an inference engine that exploits branch grouping and shared-cache reuse. Fitted scaling curves indicate that standard Transformers require up to 1.26x as much training body compute to match our final models\u0027 validation loss. These models reduce full-model KV-cache storage by up to 34% and deliver up to 51.4% higher decoding throughput on a single H200 GPU. Ablation studies show that branching yields gains beyond changes in width and depth, enables an effective KV-sharing strategy (Joint-KV), remains robust across fusion functions, and performs best in the middle layers. These findings show that branching offers a practical path for scaling language models toward both better modeling quality and faster inference.", "arxiv_id": "2611.19800", "arxiv_url": "https://arxiv.org/abs/2611.19800", "authors": ["Gaotang Li", "Lingjie Chen", "Chunyuan Deng", "Zhiwei Xu", "Hongzheng Chen", "Christopher De Sa", "Jingrui He", "Yingheng Wang", "Hanghang Tong"], "brief": "MBT\u5728\u5171\u4eab\u524d\u540e\u5c42\u4e4b\u95f4\u5e76\u884c\u6267\u884c\u72ec\u7acb\u53c2\u6570\u7684\u591a\u7ec4Transformer\u5757\uff0c\u518d\u878d\u5408\u8f93\u51fa\uff1b\u7ed3\u5408Balanced\u5206\u652f\u914d\u7f6e\u4e0eJoint-KV\u5171\u4eab\u7f13\u5b58\u4f18\u5316\u63a8\u7406\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/GaotangLi/Multi-Branch-Transformer", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.19800", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57280.8B\u81f32.1B\u53c2\u6570\u7684\u56db\u4e2aMoE\u89c4\u6a21\u4e0a\u9a8c\u8bc1", "\u62df\u5408\u66f2\u7ebf\u663e\u793a\u57fa\u7ebf\u5339\u914d\u635f\u5931\u9700\u81f3\u591a1.26\u500d\u4e3b\u4f53\u8bad\u7ec3\u8ba1\u7b97", "Joint-KV\u7f13\u5b58\u6700\u591a\u51cf34%\uff0cH200\u89e3\u7801\u541e\u5410\u589e51.4%"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u67b6\u6784", "\u6a21\u578b\u6269\u5c55", "\u63a8\u7406\u4f18\u5316"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.19800v1", "published_at": "2026-11-15", "score": 0.324, "selected_reasons": ["HF trending (45\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19800.png", "title": "Multi-Branch Transformer", "tldr": "\u901a\u8fc7\u5e76\u884c\u5206\u652f\u4e0e\u5171\u4eab\u7f13\u5b58\uff0c\u8bed\u8a00\u6a21\u578b\u5728\u540c\u7b49\u8bad\u7ec3\u9884\u7b97\u4e0b\u517c\u987e\u8d28\u91cf\u548c\u89e3\u7801\u6548\u7387\u3002", "upvotes": 45, "what_it_is": "MBT\u5728\u5171\u4eab\u524d\u540e\u5c42\u4e4b\u95f4\u5e76\u884c\u6267\u884c\u72ec\u7acb\u53c2\u6570\u7684\u591a\u7ec4Transformer\u5757\uff0c\u518d\u878d\u5408\u8f93\u51fa\uff1b\u7ed3\u5408Balanced\u5206\u652f\u914d\u7f6e\u4e0eJoint-KV\u5171\u4eab\u7f13\u5b58\u4f18\u5316\u63a8\u7406\u3002", "why_notable": "\u5c06\u5e76\u884c\u5206\u652f\u4f5c\u4e3a\u5bbd\u5ea6\u3001\u6df1\u5ea6\u4e4b\u5916\u7684\u6269\u5c55\u8def\u5f84\uff0c\u5728\u5339\u914d\u9884\u7b97\u4e0b\u63d0\u5347\u5efa\u6a21\u8d28\u91cf\uff0c\u5e76\u8ba9\u7ed3\u6784\u6539\u52a8\u540c\u65f6\u5e26\u6765\u53ef\u91cf\u5316\u7684\u63a8\u7406\u6536\u76ca\u3002"}, {"abstract": "Robot manipulation videos provide a rich visual experience, yet recovering robot action and gripper-state annotations from RGB observations still remains challenging. Using the embodiment-agnostic tool-center-point (TCP) pose as the action space, we present TCP4D, a unified model in which a shared 4D scene representation both tracks observed TCP motion and generates future TCP trajectories. Given a monocular video and initial 2D TCP queries, the tracker directly recovers metric TCP poses in SE(3) and gripper states alongside scene geometry and camera parameters. The generator samples local features from the same 4D representation along the recovered TCP tracks, then combines them with robot observations and language instructions to predict future TCP states. Our new cross-embodiment augmentation pipeline converts existing RGB videos into demonstrations for alternative embodiments by retargeting the recovered motion and synthesizing the corresponding observations, without recorded source-robot states. Experiments show that the tracker achieves absolute trajectory errors of 7.60 and 16.07 mm on DROID and RoboLab and adapts to a new embodiment with only ten demonstrations. The generator achieves 69.19% mean success on RoboTwin and outperforms well-established policy models on two real-world tasks, while joint training on source and augmented demonstrations improves target-robot success by 41.5% over augmented-only training.", "arxiv_id": "2611.23143", "arxiv_url": "https://arxiv.org/abs/2611.23143", "authors": ["Haosong Peng", "Xiangyang Liu", "Zhengshen Zhang", "Yunfeng Fan", "Tianyu Qi", "Xin Xia", "Yufeng Zhan", "Wenchao Xu"], "brief": "TCP4D\u4ee5\u5de5\u5177\u4e2d\u5fc3\u70b9\u4f4d\u59ff\u4e3a\u52a8\u4f5c\u7a7a\u95f4\uff0c\u4ece\u5355\u76ee\u89c6\u9891\u6062\u590d\u8fd0\u52a8\u53ca\u5939\u722a\u72b6\u6001\u3002\u5171\u4eab\u56db\u7ef4\u573a\u666f\u8868\u5f81\u8fdb\u4e00\u6b65\u7ed3\u5408\u673a\u5668\u4eba\u89c2\u6d4b\u4e0e\u8bed\u8a00\u6307\u4ee4\uff0c\u9884\u6d4b\u672a\u6765\u8f68\u8ff9\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/Livioni/TCP4D", "github_stars": 20, "hf_url": "https://huggingface.co/papers/2611.23143", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8ddf\u8e2a\u5668\u5728DROID\u4e0eRoboLab\u8bef\u5dee\u4e3a7.60\u548c16.07\u6beb\u7c73", "\u8de8\u5f62\u6001\u589e\u5f3a\u65e0\u9700\u6e90\u673a\u5668\u4eba\u72b6\u6001\uff0c\u5341\u6761\u793a\u8303\u5373\u53ef\u9002\u914d\u65b0\u5f62\u6001", "\u751f\u6210\u5668\u5728RoboTwin\u5e73\u5747\u6210\u529f\u7387\u8fbe69.19%"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e09\u7ef4\u89c6\u89c9", "\u8f68\u8ff9\u751f\u6210", "\u8de8\u5f62\u6001\u8fc1\u79fb"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23143v1", "published_at": "2026-11-17", "score": 0.32, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23143.png", "title": "TCP4D: A Unified Tool-Center-Point Tracking and Generation Model for Robot Manipulation", "tldr": "\u7528\u5171\u4eab\u56db\u7ef4\u573a\u666f\u8868\u5f81\u7edf\u4e00\u673a\u68b0\u81c2\u52a8\u4f5c\u6062\u590d\u4e0e\u751f\u6210\uff0c\u652f\u6301\u8de8\u673a\u5668\u4eba\u8fc1\u79fb\u3002", "upvotes": 23, "what_it_is": "TCP4D\u4ee5\u5de5\u5177\u4e2d\u5fc3\u70b9\u4f4d\u59ff\u4e3a\u52a8\u4f5c\u7a7a\u95f4\uff0c\u4ece\u5355\u76ee\u89c6\u9891\u6062\u590d\u8fd0\u52a8\u53ca\u5939\u722a\u72b6\u6001\u3002\u5171\u4eab\u56db\u7ef4\u573a\u666f\u8868\u5f81\u8fdb\u4e00\u6b65\u7ed3\u5408\u673a\u5668\u4eba\u89c2\u6d4b\u4e0e\u8bed\u8a00\u6307\u4ee4\uff0c\u9884\u6d4b\u672a\u6765\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u89c6\u9891\u52a8\u4f5c\u6807\u6ce8\u3001\u7b56\u7565\u751f\u6210\u4e0e\u8de8\u673a\u5668\u4eba\u6570\u636e\u589e\u5f3a\u4e32\u8054\u8d77\u6765\uff1b\u6e90\u6570\u636e\u4e0e\u589e\u5f3a\u6570\u636e\u8054\u5408\u8bad\u7ec3\uff0c\u76f8\u6bd4\u4ec5\u7528\u589e\u5f3a\u6570\u636e\u4f7f\u76ee\u6807\u673a\u5668\u4eba\u6210\u529f\u7387\u63d0\u534741.5%\u3002"}, {"abstract": "Standard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed architecture or designing the architecture themselves. When free to design, all three compile plain-text facts into a sparse table queried by a fixed procedure, reaching up to 54.4% test accuracy. An LLM-designed model achieves higher test accuracy than the most accurate released Transformer that the same LLM wrote while using about 1,800x fewer parameters. Without gradients, they choose a table, in which the LLM can state what each weight means and can find and rewrite a wrong one. Each wrong answer points to one row, and removing a row changes about one other answer. From this, we propose an associative-memory-based model up to 17x faster on GPUs than a same-sized Transformer. We also test pretrained weights, other benchmarks, and tasks where models generate answers. Pretrained LLMs remain more accurate; the claim concerns which structure to build when writing weights.", "arxiv_id": "2611.22055", "arxiv_url": "https://arxiv.org/abs/2611.22055", "authors": ["Hyunjong Ok", "Jaeho Lee"], "brief": "\u7814\u7a76\u8ba9\u4e09\u4e2a\u524d\u6cbf\u5927\u6a21\u578b\u4ec5\u51ed\u5341\u4e2a\u6807\u6ce8\u6837\u4f8b\u548c\u6c99\u7bb1\uff0c\u76f4\u63a5\u7f16\u5199\u6743\u91cd\u6216\u81ea\u884c\u8bbe\u8ba1\u67b6\u6784\u3002\u81ea\u7531\u8bbe\u8ba1\u65f6\uff0c\u5b83\u4eec\u5747\u5c06\u6587\u672c\u4e8b\u5b9e\u7f16\u8bd1\u4e3a\u7a00\u758f\u8868\uff0c\u518d\u7528\u56fa\u5b9a\u7a0b\u5e8f\u67e5\u8be2\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/effl-lab/Weight-Space-Programming", "github_stars": 35, "hf_url": "https://huggingface.co/papers/2611.22055", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7a00\u758f\u8868\u5728\u4ee5\u591a\u9009\u9898\u4e3a\u4e3b\u7684\u6d4b\u8bd5\u4e2d\uff0c\u51c6\u786e\u7387\u6700\u9ad854.4%", "\u81ea\u8bbe\u8ba1\u6a21\u578b\u80dc\u8fc7\u540c\u4e00\u5927\u6a21\u578b\u5199\u51fa\u7684Transformer\uff0c\u53c2\u6570\u5c11\u7ea61800\u500d", "\u63d0\u51fa\u5173\u8054\u8bb0\u5fc6\u6a21\u578b\uff0cGPU\u901f\u5ea6\u6700\u9ad8\u8fbe\u540c\u89c4\u6a21Transformer\u768417\u500d"], "keywords": ["\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b", "\u6a21\u578b\u67b6\u6784", "\u5173\u8054\u8bb0\u5fc6"], "num_comments": 3, "on_hf": true, "organization": "Pohang University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2611.22055v1", "published_at": "2026-11-17", "score": 0.317, "selected_reasons": ["HF trending (50\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22055.png", "title": "Weight-Space Programming Doesn\u0027t Need Transformers", "tldr": "\u8ba9\u5927\u6a21\u578b\u76f4\u63a5\u7f16\u5199\u6743\u91cd\u65f6\uff0c\u7a00\u758f\u67e5\u8868\u7ed3\u6784\u6bd4\u624b\u5199\u6743\u91cd\u7684Transformer\u66f4\u9ad8\u6548\u3002", "upvotes": 50, "what_it_is": "\u7814\u7a76\u8ba9\u4e09\u4e2a\u524d\u6cbf\u5927\u6a21\u578b\u4ec5\u51ed\u5341\u4e2a\u6807\u6ce8\u6837\u4f8b\u548c\u6c99\u7bb1\uff0c\u76f4\u63a5\u7f16\u5199\u6743\u91cd\u6216\u81ea\u884c\u8bbe\u8ba1\u67b6\u6784\u3002\u81ea\u7531\u8bbe\u8ba1\u65f6\uff0c\u5b83\u4eec\u5747\u5c06\u6587\u672c\u4e8b\u5b9e\u7f16\u8bd1\u4e3a\u7a00\u758f\u8868\uff0c\u518d\u7528\u56fa\u5b9a\u7a0b\u5e8f\u67e5\u8be2\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u8131\u79bb\u68af\u5ea6\u8bad\u7ec3\u540e\uff0c\u67b6\u6784\u9009\u62e9\u53ef\u80fd\u8f6c\u5411\u53ef\u89e3\u91ca\u3001\u53ef\u5c40\u90e8\u4fee\u6539\u7684\u67e5\u8868\u7ed3\u6784\uff1b\u4f18\u52bf\u9488\u5bf9\u76f4\u63a5\u5199\u6743\u91cd\uff0c\u9884\u8bad\u7ec3\u5927\u6a21\u578b\u4ecd\u66f4\u51c6\u786e\u3002"}, {"abstract": "Collaboration promises to extend humanoid capabilities beyond what individual robots can achieve. However, realizing this potential requires coordinated whole-body interactions, coherent long-horizon planning, and precise synchronization across robots. We introduce Heave-Ho, a decentralized framework for long-horizon collaborative multi-humanoid loco-manipulation. At the low level, we develop a multi-agent post-training framework that adapts a humanoid foundation tracking model to physically coupled interactions between humanoids, enabling coordinated decentralized control from local observations alone. At the high level, we train a vision-language planner and design a speech-based leader-follower coordination mechanism to synchronize decentralized execution without network communication. Trained with two identical humanoids, our system scales to teams of up to ten robots and generalizes to heterogeneous teams without retraining. To benchmark these capabilities, we introduce HH-Bench, comprising 12 tasks involving teams of 2 to 10 humanoids, including heterogeneous teams. Systematic evaluations show that Heave-Ho consistently outperforms baseline methods, while real-world experiments demonstrate robust decentralized collaboration across challenging tasks.", "arxiv_id": "2611.22275", "arxiv_url": "https://arxiv.org/abs/2611.22275", "authors": ["Ting-Hsuan Chen", "Siheng Zhao", "Han Jiang", "Qi Pan", "Louison Lu", "Jiaheng Luo", "Henghui Bao", "Yiyu Chen", "Quan Nguyen", "Yue Wang"], "brief": "\u63d0\u51fa\u53bb\u4e2d\u5fc3\u5316\u4eba\u5f62\u673a\u5668\u4eba\u534f\u4f5c\u6846\u67b6\uff0c\u4ee5\u591a\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\u9002\u914d\u57fa\u7840\u52a8\u4f5c\u8ddf\u8e2a\u6a21\u578b\uff0c\u518d\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u89c4\u5212\u5668\u4e0e\u8bed\u97f3\u4e3b\u4ece\u534f\u8c03\uff0c\u5b9e\u73b0\u957f\u65f6\u7a0b\u79fb\u52a8\u64cd\u4f5c\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": "https://github.com/heaveho-humanoid/Heave-Ho", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2611.22275", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u591a\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\u652f\u6301\u4ec5\u51ed\u5c40\u90e8\u89c2\u6d4b\u7684\u8026\u5408\u63a7\u5236", "\u89c6\u89c9\u8bed\u8a00\u89c4\u5212\u5668\u4e0e\u8bed\u97f3\u4e3b\u4ece\u673a\u5236\u5b9e\u73b0\u65e0\u7f51\u7edc\u540c\u6b65", "\u53cc\u673a\u5668\u4eba\u8bad\u7ec3\u6269\u5c55\u81f3\u5341\u53f0\uff1bHH-Bench\u542b12\u9879\u4efb\u52a1"], "keywords": ["\u4eba\u5f62\u673a\u5668\u4eba", "\u591a\u667a\u80fd\u4f53\u534f\u4f5c", "\u53bb\u4e2d\u5fc3\u5316\u63a7\u5236", "\u89c6\u89c9\u8bed\u8a00\u89c4\u5212"], "num_comments": 2, "on_hf": true, "organization": "University of Southern California", "pdf_url": "https://arxiv.org/pdf/2611.22275v1", "published_at": "2026-11-17", "score": 0.313, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22275.png", "title": "Heave-Ho: Decentralized Long-Horizon Multi-Humanoid Collaboration", "tldr": "\u901a\u8fc7\u5c40\u90e8\u63a7\u5236\u4e0e\u8bed\u97f3\u534f\u8c03\uff0c\u5b9e\u73b0\u53ef\u6269\u5c55\u7684\u591a\u4e2a\u4eba\u5f62\u673a\u5668\u4eba\u957f\u65f6\u7a0b\u534f\u4f5c", "upvotes": 21, "what_it_is": "\u63d0\u51fa\u53bb\u4e2d\u5fc3\u5316\u4eba\u5f62\u673a\u5668\u4eba\u534f\u4f5c\u6846\u67b6\uff0c\u4ee5\u591a\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\u9002\u914d\u57fa\u7840\u52a8\u4f5c\u8ddf\u8e2a\u6a21\u578b\uff0c\u518d\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u89c4\u5212\u5668\u4e0e\u8bed\u97f3\u4e3b\u4ece\u534f\u8c03\uff0c\u5b9e\u73b0\u957f\u65f6\u7a0b\u79fb\u52a8\u64cd\u4f5c\u3002", "why_notable": "\u5c06\u5168\u8eab\u63a7\u5236\u3001\u957f\u65f6\u7a0b\u89c4\u5212\u4e0e\u6267\u884c\u540c\u6b65\u6574\u5408\u8d77\u6765\uff0c\u652f\u6301\u5f02\u6784\u56e2\u961f\u514d\u91cd\u8bad\u7ec3\u6cdb\u5316\uff0c\u5e76\u901a\u8fc7\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u9a8c\u8bc1\u534f\u4f5c\u80fd\u529b\u3002"}, {"abstract": "Most AI assistants respond only when prompted, remaining silent even when events in the video stream offer meaningful opportunities for conversation. To move beyond purely user-driven interaction, we present AURA 2.0, a streaming video large language model that introduces three core upgrades to AURA. The key advance is Model-Initiated Conversation (MIC), which enables the model to identify topics worth discussing in the evolving visual stream and initiate conversations at appropriate moments without a user query. Stream-Aware Tool Calling (SATC) lets the model act on what it sees by invoking external tools using the current visual and conversational context and incorporating returned information into the ongoing interaction. Interactive Visual Grounding (IVG) supports visual grounding in both user inputs and model outputs. The model can identify objects marked by users on video frames and produce frame-aligned bounding boxes to link its responses to specific objects and regions. To develop these capabilities, we construct a dedicated streaming interaction dataset and adopt a three-stage training scheme to integrate the new behaviors with AURA\u0027s existing streaming interaction abilities. We further incorporate Long-Horizon Interaction Memory (LHIM) to maintain contextual continuity over extended video streams. Evaluations on public streaming benchmarks show that AURA 2.0 achieves leading performance among open-source streaming models, while targeted evaluations further validate its new interaction capabilities.", "arxiv_id": "2611.17048", "arxiv_url": "https://arxiv.org/abs/2611.17048", "authors": ["Shuhan Li", "Huankang Guan", "Xintong Guo", "Yang Bo", "Yuyang He", "Dunyuan Xu", "Jingyan Chen", "Fang Liu", "Tsz Kin Wan", "Jinpeng Chen", "Zhenqi He", "Yuxuan Hu", "Wenbo Li", "Han Gao", "Qijun Li", "Long Chen", "Hongsheng Li", "Rui Liu"], "brief": "AURA 2.0\u5c06\u4e3b\u52a8\u5bf9\u8bdd\u3001\u5de5\u5177\u8c03\u7528\u4e0e\u53cc\u5411\u89c6\u89c9\u5b9a\u4f4d\u878d\u5165\u6d41\u5f0f\u89c6\u9891\u6a21\u578b\u3002\u901a\u8fc7\u4e13\u7528\u4ea4\u4e92\u6570\u636e\u96c6\u548c\u4e09\u9636\u6 u4e0e\u5de5\u5177\u884c\u52a8\uff0c\u516c\u5f00\u57fa\u51c6\u8868\u73b0\u4f4d\u5c45\u5f00\u6e90\u6d41\u5f0f\u6a21\u578b\u524d\u5217\uff0c\u4e3a\u6301\u7eed\u611f\u77e5\u578b\u52a9\u624b\u63d0\u4f9b\u5b9e\u73b0\u8def\u5f84\u3002"}, {"abstract": "Electronic nose (eNose) technology offers a portable, non-invasive route for disease screening via exhaled breath analysis. However, progress in the field is hindered by the lack of systematic benchmarks that compare machine learning methods under realistic conditions, particularly sensor drift, a known but rarely quantified failure mode. Most existing studies rely on small, private datasets with inconsistent protocols, rendering results non-comparable and slowing progress. We introduce Breath-Dx, the first comprehensive benchmark of time series classification methods for breath-based disease screening. Our work leverages the Scent of Health (S-OH) dataset, the largest public clinical eNose collection to date, comprising 1,234 patients across nine diagnostic groups, each providing a 17-channel multivariate time series with explicit temporal train/test splits that account for sensor drift. We systematically evaluate 10 methods spanning four families: feature-based tabular learners, convolution-based models, graph-based, and time series architectures. All methods degrade significantly under temporal validation (0.05-0.12 AUC drop compared to random cross-validation), confirming that drift embeds a strong temporal signal. Under this realistic evaluation, the best methods achieve ROC AUC of 0.74-0.76 for some lung conditions, though others remain near chance. Recurrent architectures show the most consistent performance across diseases, while specialized time series methods achieve the highest peak results. Demographic confounders matter: breath signals provide independent diagnostic value for some conditions but add little beyond age for others. We release the S-OH dataset, all temporal splits, evaluation protocols, and code to enable reproducible research and accelerate progress in clinical breathomics.", "arxiv_id": "2611.15348", "arxiv_url": "https://arxiv.org/abs/2611.15348", "authors": ["Ivan Poddiakov", "Ivan Kruzhilov", "Galina Zubkova", "Svetlana Erofeeva", "Andrey Savchenko", "Pavel Blinov"], "brief": "\u7814\u7a76\u6784\u5efa\u7535\u5b50\u9f3b\u547c\u6c14\u75be\u75c5\u7b5b\u67e5\u57fa\u51c6\uff0c\u5229\u7528\u516c\u5f00\u4e34\u5e8a\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u6bd4\u8f83\u5341\u79cd\u5206\u7c7b\u65b9\u6cd5\u3002\u901a\u8fc7\u663e\u5f0f\u65f6\u95f4\u5212\u5206\u8bad\u7ec3\u4e0e\u6d4b\u8bd5\u96c6\uff0c\u68c0\u9a8c\u4f20\u611f\u5668\u6f02\u79fb\u4e0b\u7684\u771f\u5b9e\u6cdb\u5316\u8868\u73b0\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/ivanpodd/Breath-Dx", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.15348", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["S-OH\u542b1234\u540d\u60a3\u8005\u30019\u4e2a\u8bca\u65ad\u7ec4\u53ca17\u901a\u9053\u5e8f\u5217", "\u6bd4\u8f834\u7c7b\u517110\u79cd\u65b9\u6cd5\uff0c\u65f6\u95f4\u9a8c\u8bc1\u4f7fAUC\u4e0b\u964d0.05\u20140.12", "\u90e8\u5206\u80ba\u90e8\u75be\u75c5\u6700\u4f73ROC AUC\u4e3a0.74\u20140.76"], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u5206\u7c7b", "\u75be\u75c5\u7b5b\u67e5", "\u7535\u5b50\u9f3b", "\u4f20\u611f\u5668\u6f02\u79fb"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.15348v1", "published_at": "2026-11-11", "score": 0.291, "selected_reasons": ["HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.15348.png", "title": "Breath-Dx: A Time Series Classification Benchmark for Disease Screening with eNose", "tldr": "\u547c\u6c14\u75be\u75c5\u7b5b\u67e5\u57fa\u51c6\u63ed\u793a\u4f20\u611f\u5668\u6f02\u79fb\u5f71\u54cd\uff0c\u968f\u673a\u4ea4\u53c9\u9a8c\u8bc1\u660e\u663e\u9ad8\u4f30\u8bca\u65ad\u6027\u80fd\u30 uff0c\u7528\u51e0\u4f55\u5de5\u5177\u5b8c\u6210\u7cbe\u786e\u5efa\u6a21\u3002", "why_notable": "\u5b83\u628a\u9ad8\u8d28\u91cfCAD\u91cd\u5efa\u5e26\u5230\u672c\u5730\u8bbe\u5907\uff0c\u51cf\u5c11\u4e13\u6709\u96f6\u4ef6\u5916\u4f20\u9700\u6c42\uff1b\u540c\u65f6\u63a5\u5165\u73b0\u6709\u5de5\u7a0b\u5de5\u4f5c\u6d41\uff0c\u964d\u4f4e\u4e2a\u4eba\u548c\u5c0f\u4f01\u4e1a\u7684\u4f7f\u7528\u95e8\u69db\u3002"}, {"abstract": "Attention scores candidate supports of an answer, which we call witnesses, and reads the scores at a temperature. We build a higher-order attention layer whose state lives on pairs of items: for a pair (a, b), each third item k is a witness judged through its legs (a, k) and (k, b). It reads witnesses at zero temperature, keeping the best and the number tied with it, passes on only bits comparing such counts, rebuilds its pair state from the input and these bits at every loop, and is trained from answers alone. Each choice removes one way soft attention fails at size: dispersed weight, unresolved gaps between learned scores, and a drifting soft state. In maximum retrieval it is right on at least 99.95% of sets 1,000 times larger than in training, on all ten seeds; trained with a soft count, the same network falls to 42% at 4,096 items. On CLRS-30 without hints, a general form of the layer (half its channels read at zero temperature, numbers embedded, state carried) beats the best published model, which uses hints on some tasks; the full cold layer is exact on every test input of 9 of the 12 tasks whose answers depend on numbers only through comparisons. From yes-or-no answers it decides 2-SAT and two-colouring exactly at 500 variables and, as our theory predicts, not parity equations. Beside a frozen 7B language model it chains family relations exactly at 1,000 statements after training on 16, where the model alone falls to 44%; finite checks on the weights prove every block that learned correct at every size, on acyclic contexts and given what the model reads. On CLUTRR it is right on every story of five to ten relations given the graphs, learning the 62 rules exactly; from text, with the model frozen, no hand-written rule and only a small read-in trained, it lifts an open 7B model from 33% to 65%, above every system we found without hand-written rules except frontier reasoning models.", "arxiv_id": "2611.11937", "arxiv_url": "https://arxiv.org/abs/2611.11937", "authors": ["Mostafa \u0027Neo\u0027 Mohsenvand"], "brief": "\u63d0\u51fa\u4ee5\u5143\u7d20\u5bf9\u4e3a\u72b6\u6001\u7684\u9ad8\u9636\u6ce8\u610f\u529b\uff0c\u7528\u7b2c\u4e09\u5143\u7d20\u7684\u4e24\u6761\u5173\u8054\u8bc4\u4f30\u652f\u6301\u9879\u3002\u96f6\u6e29\u8bfb\u53d6\u6700\u4f18\u9879\u53ca\u5e76\u5217\u6570\uff0c\u4ec5\u4f20\u9012\u8ba1\u6570\u6bd4\u8f83\u4f4d\uff0c\u6bcf\u8f6e\u91cd\u5efa\u72b6\u6001\uff0c\u53ea\u7528\u7b54\u6848\u8bad\u7ec3\u3002", "categories": ["cs.LG", "cs.AI", "cs.NE"], "github_repo": "https://github.com/NeoVand/cold-attention", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.11937", "impact_score": 9, "is_agent": false, "is_top": false, "key_points": ["\u6700\u5927\u503c\u68c0\u7d22\u6269\u81f3\u8bad\u7ec3\u89c4\u6a21\u5343\u500d\uff0c\u5341\u4e2a\u79cd\u5b50\u51c6\u786e\u7387\u5747\u226599.95%", "CLRS-30\u65e0\u63d0\u793a\u7248\u672c\u8d85\u8fc7\u5df2\u53d1\u8868\u6700\u4f73\u6a21\u578b", "\u51bb\u7ed37B\u6a21\u578b\uff0c\u5173\u7cfb\u94fe\u4ece16\u6761\u6269\u81f3\u5343\u6761\u4ecd\u5b8c\u5168\u6b63\u786e"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u89c4\u6a21\u6cdb\u5316", "\u7b97\u6cd5\u63a8\u7406", "\u5f62\u5f0f\u5316\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11937v2", "published_at": "2026-11-09", "score": 0.27, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11937.png", "title": "Attention at Absolute Ze
