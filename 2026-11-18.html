ro", "tldr": "\u96f6\u6e29\u9ad8\u9636\u6ce8\u610f\u529b\u4ee5\u6700\u4f18\u652f\u6301\u9879\u53ca\u5e76\u5217\u8ba1\u6570\uff0c\u5b9e\u73b0\u8de8\u89c4\u6a21\u6cdb\u5316\u4e0e\u53ef\u9a8c\u8bc1\u63a8\u7406\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u4ee5\u5143\u7d20\u5bf9\u4e3a\u72b6\u6001\u7684\u9ad8\u9636\u6ce8\u610f\u529b\uff0c\u7528\u7b2c\u4e09\u5143\u7d20\u7684\u4e24\u6761\u5173\u8054\u8bc4\u4f30\u652f\u6301\u9879\u3002\u96f6\u6e29\u8bfb\u53d6\u6700\u4f18\u9879\u53ca\u5e76\u5217\u6570\uff0c\u4ec5\u4f20\u9012\u8ba1\u6570\u6bd4\u8f83\u4f4d\uff0c\u6bcf\u8f6e\u91cd\u5efa\u72b6\u6001\uff0c\u53ea\u7528\u7b54\u6848\u8bad\u7ec3\u3002", "why_notable": "\u628a\u79bb\u6563\u9009\u62e9\u4e0e\u8ba1\u6570\u6bd4\u8f83\u5f15\u5165\u6ce8\u610f\u529b\uff0c\u663e\u8457\u6539\u5584\u89c4\u6a21\u5916\u63a8\uff1b\u6709\u9650\u6743\u91cd\u68c0\u67e5\u8fd8\u80fd\u8bc1\u660e\u90e8\u5206\u5173\u7cfb\u63a8\u7406\u6a21\u5757\u5728\u4efb\u610f\u89c4\u6a21\u4e0b\u6b63\u786e\u3002"}, {"abstract": "Learned lossless codecs make smaller files than common classical codecs, yet the images we archive and train on still use classical codecs. A main reason is time: a learned codec takes seconds to decode a photo that a classical codec opens in milliseconds, and their faster variants give up most of their gain in size. We argue that much of this time is spent waiting, not computing: the network waits for the values it conditions on, and the arithmetic decoder reads them one at a time. We introduce FMT (Fixed-step Multiscale Tree), a lossless image format whose decoding order and entropy coder are designed together so that neither wait grows with the image. FMT stores an image as a coarse-to-fine tree whose steps hold independent values: a GPU predicts each step at once and decodes it in parallel rANS lanes that carry their states from step to step, so an image of any size decodes in a fixed number of sequential steps. On this tree we build a family of bit-exact codecs, from a rule with no network to large networks, and no codec we ran on the same GPU beats any of them on both size and speed. Without a network, FMT beats NVIDIA\u0027s HTJ2K on size and speed; with a large one, it decodes Kodak photos 9 to 61X faster than learned codecs we ran on the same A100, at the same size or smaller.", "arxiv_id": "2611.23108", "arxiv_url": "https://arxiv.org/abs/2611.23108", "authors": ["Ammar Ali"], "brief": "\u63d0\u51fa\u65e0\u635f\u56fe\u50cf\u683c\u5f0fFMT\uff0c\u8054\u5408\u8bbe\u8ba1\u89e3\u7801\u987a\u5e8f\u4e0e\u71b5\u7f16\u7801\u3002\u901a\u8fc7\u7c97\u5230\u7ec6\u6811\u7ec4\u7ec7\u72ec\u7acb\u50cf\u7d20\u503c\uff0c\u8ba9GPU\u9010\u6b65\u6279\u91cf\u9884\u6d4b\uff0c\u5e76\u4ee5\u5e76\u884crANS\u901a\u9053\u89e3\u7801\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23108", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["FMT\u8ba9\u4efb\u610f\u5c3a\u5bf8\u56fe\u50cf\u5747\u4ee5\u56fa\u5b9a\u6570\u91cf\u987a\u5e8f\u6b65\u9aa4\u89e3\u7801", "\u5e76\u884crANS\u901a\u9053\u8de8\u6b65\u9aa4\u4fdd\u7559\u72b6\u6001\uff0c\u51cf\u5c11\u4e32\u884c\u7b49\u5f85", "\u540c\u4e00A100\u4e0a\uff0cKodak\u89e3\u7801\u5feb9\u81f361\u500d\uff0c\u4f53\u79ef\u76f8\u5f53\u6216\u66f4\u5c0f"], "keywords": ["\u65e0\u635f\u56fe\u50cf\u538b\u7f29", "\u5e76\u884c\u89e3\u7801", "\u71b5\u7f16\u7801"], "num_comments": 2, "on_hf": true, "organization": "Lab of Efficient AI and Data", "pdf_url": "https://arxiv.org/pdf/2611.23108v1", "published_at": "2026-11-17", "score": 0.27, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23108.png", "title": "FMT: Lossless Image Compression in a Fixed Number of Parallel Steps", "tldr": "FMT\u4ee5\u56fa\u5b9a\u6b65\u6570\u5e76\u884c\u89e3\u7801\uff0c\u5728\u4fdd\u6301\u65e0\u635f\u538b\u7f29\u7387\u7684\u540c\u65f6\u663e\u8457\u63d0\u901f\u3002", "upvotes": 10, "what_it_is": "\u63d0\u51fa\u65e0\u635f\u56fe\u50cf\u683c\u5f0fFMT\uff0c\u8054\u5408\u8bbe\u8ba1\u89e3\u7801\u987a\u5e8f\u4e0e\u71b5\u7f16\u7801\u3002\u901a\u8fc7\u7c97\u5230\u7ec6\u6811\u7ec4\u7ec7\u72ec\u7acb\u50cf\u7d20\u503c\uff0c\u8ba9GPU\u9010\u6b65\u6279\u91cf\u9884\u6d4b\uff0c\u5e76\u4ee5\u5e76\u884crANS\u901a\u9053\u89e3\u7801\u3002", "why_notable": "\u5c06\u5b66\u4e60\u5f0f\u65e0\u635f\u538b\u7f29\u7684\u901f\u5ea6\u74f6\u9888\u4ece\u4e32\u884c\u4f9d\u8d56\u5165\u624b\u89e3\u51b3\uff1b\u65e0\u7f51\u7edc\u7248\u672c\u4e5f\u5728\u4f53\u79ef\u4e0e\u901f\u5ea6\u4e0a\u80dc\u8fc7HTJ2K\uff0c\u5c55\u793a\u683c\u5f0f\u8bbe\u8ba1\u672c\u8eab\u7684\u4ef7\u503c\u3002"}, {"abstract": "Video diffusion transformers (DiTs) generate realistic videos, but their heavy computational cost limits broader real-world applications. Mixed-resolution generation reduces this cost by generating the visually important region at high resolution (HR) and the rest at low resolution (LR), yet existing methods suffer a severe quality drop on videos and require knowing the HR region in advance. We show that these failures are not inherent to mixed resolution, and propose $\\textbf{MPEG-Diffusion}$ to address their three root causes: (1) dual-resolution attention to mitigate the curse of mixed resolution, where each query reads the K/V of its own resolution, (2) a mixed-resolution decoder to blend the HR and LR latents before decoding and resolve distortion, and (3) a self-selected HR region using the DiT\u0027s knowledge to find the visually important region without requiring it in advance. Processing only $30\\%$ of full-resolution tokens, MPEG-Diffusion speeds up denoising by $4.8\\times$ on Wan2.1 14B ($3.8\\times$ on 1.3B), outperforming prior methods on nearly every metric. In the user study, we demonstrate the high quality of MPEG-Diffusion, with raters preferring it over prior mixed-resolution methods in over $90\\%$ of pairs and rating it close to full resolution.", "arxiv_id": "2611.12069", "arxiv_url": "https://arxiv.org/abs/2611.12069", "authors": ["Dennis Menn", "Tianpei Gu", "Guande He", "Aryan V S", "Yanke Song", "Nan Liu", "Desai Xie", "Xun Huang", "Chenfeng Xu", "Diana Marculescu"], "brief": "\u8be5\u65b9\u6cd5\u8ba9\u89c6\u9891\u91cd\u8981\u533a\u57df\u4ee5\u9ad8\u5206\u8fa8\u7387\u751f\u6210\uff0c\u5176\u4f59\u533a\u57df\u91c7\u7528\u4f4e\u5206\u8fa8\u7387\u3002\u901a\u8fc7\u53cc\u5206\u8fa8\u7387\u6ce8\u610f\u529b\u3001\u6df7\u5408\u6f5c\u53d8\u91cf\u89e3\u7801\u53ca\u6a21\u578b\u81ea\u4e3b\u9009\u533a\uff0c\u7f13\u89e3\u753b\u8d28\u9000\u5316\u5e76\u514d\u53bb\u9884\u5148\u6307\u5b9a\u533a\u57df\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12069", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u5206\u8fa8\u7387\u6ce8\u610f\u529b\u8ba9\u67e5\u8be2\u8bfb\u53d6\u540c\u5206\u8fa8\u7387\u7684K/V", "\u6df7\u5408\u5206\u8fa8\u7387\u89e3\u7801\u5668\u878d\u5408\u9ad8\u4f4e\u5206\u8fa8\u7387\u6f5c\u53d8\u91cf\uff0c\u51cf\u8f7b\u5931\u771f", "\u4ec5\u5904\u740630%\u5168\u5206\u8fa8\u7387\u4ee4\u724c\uff0c14B\u6a21\u578b\u53bb\u566a\u52a0\u901f4.8\u500d"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u6df7\u5408\u5206\u8fa8\u7387", "\u63a8\u7406\u52a0\u901f"], "num_comments": 3, "on_hf": true, "organization": "Roblox Corporation", "pdf_url": "https://arxiv.org/pdf/2611.12069v1", "published_at": "2026-11-09", "score": 0.266, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12069.png", "title": "MPEG-Diffusion: Mixed-Resolution Video Generation", "tldr": "\u901a\u8fc7\u81ea\u52a8\u9009\u62e9\u9ad8\u5206\u8fa8\u7387\u533a\u57df\u4e0e\u53cc\u5206\u8fa8\u7387\u5efa\u6a21\uff0c\u5927\u5e45\u52a0\u901f\u89c6\u9891\u751f\u6210\u5e76\u4fdd\u6301\u753b\u8d28\u3002", "upvotes": 8, "what_it_is": "\u8be5\u65b9\u6cd5\u8ba9\u89c6\u9891\u91cd\u8981\u533a\u57df\u4ee5\u9ad8\u5206\u8fa8\u7387\u751f\u6210\uff0c\u5176\u4f59\u533a\u57df\u91c7\u7528\u4f4e\u5206\u8fa8\u7387\u3002\u901a\u8fc7\u53cc\u5206\u8fa8\u7387\u6ce8\u610f\u529b\u3001\u6df7\u5408\u6f5c\u53d8\u91cf\u89e3\u7801\u53ca\u6a21\u578b\u81ea\u4e3b\u9009\u533a\uff0c\u7f13\u89e3\u753b\u8d28\u9000\u5316\u5e76\u514d\u53bb\u9884\u5148\u6307\u5b9a\u533a\u57df\u3002", "why_notable": "\u5b83\u5c06\u6df7\u5408\u5206\u8fa8\u7387\u751f\u6210\u63a8\u8fdb\u5230\u65e0\u9700\u4eba\u5de5\u6307\u5b9a\u533a\u57df\u7684\u5b9e\u7528\u65b9\u6848\uff1b\u7528\u6237\u8bc4\u6d4b\u4e2d\uff0c\u8d8590%\u7684\u6210\u5bf9\u6bd4\u8f83\u4f18\u4e8e\u65e2\u6709\u65b9\u6cd5\uff0c\u753b\u8d28\u63a5\u8fd1\u5168\u5206\u8fa8\u7387\u3002"}, {"abstract": "World-action models (WAMs) augment vision-language-action policies (VLAs) with future prediction so that the policy can anticipate how its actions will affect the physical world. Existing WAMs supervise complete future observations. However, observations typically change little over an action chunk, so the future loss is dominated by copying static background content rather than learning task-relevant robot and object motion, limiting policy learning. Moreover, existing WAMs rely on large video generation models or separate world models, incurring heavy training and inference compute that hinders closed-loop deployment. To improve policy performance, we propose visual residual learning, supervising only the feature change from the current frame to the future frame in a frozen DINOv3 space. Compared with complete future features, this residual learning target yields a higher feature rank with richer and more diverse representations of scene changes, and spatially concentrates on the robot arm and manipulated objects rather than the background. To further improve computational efficiency, we present ResWAM, a residual world-action model with 2.3B parameters in total, including a lightweight 0.5B dual-branch DiT that jointly trains an action branch and a residual branch via conditional flow matching. Without robot pretraining (i.e., pretraining on external robot action trajectories beyond the benchmark demonstrations), ResWAM achieves top average success rates on LIBERO-Plus (81.1%), RoboTwin 2.0 (93.8%), and RoboDojo (9.40% success, 13.41 score) at the lowest training (2.7-4.0 TFLOPs) and inference compute (1.0-1.4 TFLOPs), and leads real-robot Open, Put, and Stack (80.0% average, +10.0% over $\u03c0_{0.5}$) at 92.7 ms latency.", "arxiv_id": "2611.19559", "arxiv_url": "https://arxiv.org/abs/2611.19559", "authors": ["Chongyu Fan", "Gaowen Liu", "Ramana Rao Kompella", "Jason Corso", "Sijia Liu"], "brief": "ResWAM\u5728\u51bb\u7ed3\u7684DINOv3\u7279\u5f81\u7a7a\u95f4\u5b66\u4e60\u5f53\u524d\u5230\u672a\u6765\u7684\u89c6\u89c9\u6b8b\u5dee\uff0c\u805a\u7126\u673a\u5668\u4eba\u4e0e\u7269\u4f53\u8fd0\u52a8\uff1b\u4ee5\u53cc\u5206\u652fDiT\u901a\u8fc7\u6761\u4ef6\u6d41\u5339\u914d\u8054\u5408\u5b66\u4e60\u52a8\u4f5c\u548c\u6b8b\u5dee\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/OPTML-Group/ResWAM", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.19559", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u603b\u53c2\u65702.3B\uff0c\u53cc\u5206\u652fDiT\u4ec50.5B", "\u65e0\u989d\u5916\u673a\u5668\u4eba\u9884\u8bad\u7ec3\uff0cLIBERO-Plus\u6210\u529f\u738781.1%", "\u771f\u673a\u5e73\u5747\u6210\u529f\u738780%\uff0c\u63a8\u7406\u5ef6\u8fdf92.7\u6beb\u79d2"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u6b8b\u5dee\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "OPTML Group @ MSU", "pdf_url": "https://arxiv.org/pdf/2611.19559v1", "published_at": "2026-11-14", "score": 0.259, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19559.png", "title": "ResWAM: Learning What Changes, Not What Stays, for World-Action Models", "tldr": "\u53ea\u9884\u6d4b\u89c6\u89c9\u53d8\u5316\u800c\u975e\u5b8c\u6574\u672a\u6765\u753b\u9762\uff0c\u63d0\u5347\u673a\u5668\u4eba\u7b56\u7565\u6210\u529f\u7387\u5e76\u964d\u4f4e\u8ba1\u7b97\u5f00\u9500\u3002", "upvotes": 4, "what_it_is": "ResWAM\u5728\u51bb\u7ed3\u7684DINOv3\u7279\u5f81\u7a7a\u95f4\u5b66\u4e60\u5f53\u524d\u5230\u672a\u6765\u7684\u89c6\u89c9\u6b8b\u5dee\uff0c\u805a\u7126\u673a\u5668\u4eba\u4e0e\u7269\u4f53\u8fd0\u52a8\uff1b\u4ee5\u53cc\u5206\u652fDiT\u901a\u8fc7\u6761\u4ef6\u6d41\u5339\u914d\u8054\u5408\u5b66\u4e60\u52a8\u4f5c\u548c\u6b8b\u5dee\u3002", "why_notable": "\u5c06\u672a\u6765\u9884\u6d4b\u7684\u76d1\u7763\u4ece\u9759\u6001\u80cc\u666f\u8f6c\u5411\u4efb\u52a1\u76f8\u5173\u53d8\u5316\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u548c\u771f\u673a\u4e0a\u517c\u987e\u6210\u529f\u7387\u4e0e\u8ba1\u7b97\u6548\u7387\uff0c\u4e3a\u95ed\u73af\u673a\u5668\u4eba\u90e8\u7f72\u63d0\u4f9b\u66f4\u8f7b\u91cf\u7684\u8def\u7ebf\u3002"}, {"abstract": "Robot policies trained by imitation generalize poorly outside the environments and objects seen in training. Published data-scaling studies find that generalization grows with the diversity of training environments and objects rather than with more demonstrations per environment. Robot data is costly to collect across many environments, whereas egocentric human video can be recorded in the wild at scale; existing egocentric video, however, mostly shows daily-life activity and contains little skilled work in real workplaces. We present HubEgo-100K, a dataset built for diversity. This version of the paper covers the first release, v1.0: 10,124 hours of 1080p egocentric video with synchronized 100 Hz inertial (IMU) data from one head-mounted phone camera. In v1.0, 12,227 contributors record their own unscripted work in 15,548 environments (each one contributor\u0027s own setting of one type, such as their kitchen or workshop) across 11 setting types, 30 work categories, 56 task types and 35 action families, with 83% of hours in workplace settings. The release comprises 72,754 episodes with machine-generated action and language annotations, in LeRobot and MCAP formats under CC BY 4.0. We measure diversity along each axis, show that inside v1.0, with episodes in random order, new contributors and words keep appearing, and relate the measurements to published evidence on six data properties tied to policy performance, including hand visibility and inertial sensing. We also document collection, curation, privacy measures and data format, and provide a datasheet. Later versions of this paper will add benchmarks and cover further releases toward 100,000 hours.", "arxiv_id": "2611.21938", "arxiv_url": "https://arxiv.org/abs/2611.21938", "authors": ["Javad Amirian", "Armin Kiani", "Lo\u00efc Schaeffer", "Tim Sprecher", "Mohamed Taha", "Karthik Yadati"], "brief": "\u6784\u5efa\u9762\u5411\u673a\u5668\u4eba\u5b66\u4e60\u7684\u771f\u5b9e\u5de5\u4f5c\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u96c6\uff0c\u7531\u53c2\u4e0e\u8005\u7528\u5934\u6234\u624b\u673a\u8bb0\u5f55\u975e\u811a\u672c\u5316\u6280\u80fd\u64cd\u4f5c\uff0c\u540c\u6b65\u91c7\u96c6\u60ef\u6027\u6570\u636e\uff0c\u5e76\u63d0\u4f9b\u673a\u5668\u751f\u6210\u7684\u52a8\u4f5c\u4e0e\u8bed\u8a00\u6807\u6ce8\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21938", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["v1.0\u542b10,124\u5c0f\u65f61080p\u89c6\u9891\u53ca100Hz IMU", "\u8986\u76d615,548\u4e2a\u73af\u5883\uff0c83%\u65f6\u957f\u6765\u81ea\u5de5\u4f5c\u573a\u6240", "72,754\u6bb5\u89c6\u9891\uff0c\u4ee5LeRobot\u548cMCAP\u683c\u5f0f\u5f00\u653e"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u591a\u6a21\u6001\u6570\u636e\u96c6", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Hub", "pdf_url": "https://arxiv.org/pdf/2611.21938v1", "published_at": "2026-11-16", "score": 0.249, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21938.png", "title": "HubEgo-100K: In-the-Wild Egocentric Video of Skilled Work for Robot Learning", "tldr": "\u4ee5\u4e07\u5c0f\u65f6\u771f\u5b9e\u5de5\u4f5c\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\uff0c\u4e3a\u673a\u5668\u4eba\u5b66\u4e60\u63d0\u4f9b\u591a\u73af\u5883\u6280\u80fd\u6570\u636e\u3002", "upvotes": 4, "what_it_is": "\u6784\u5efa\u9762\u5411\u673a\u5668\u4eba\u5b66\u4e60\u7684\u771f\u5b9e\u5de5\u4f5c\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u96c6\uff0c\u7531\u53c2\u4e0e\u8005\u7528\u5934\u6234\u624b\u673a\u8bb0\u5f55\u975e\u811a\u672c\u5316\u6280\u80fd\u64cd\u4f5c\uff0c\u540c\u6b65\u91c7\u96c6\u60ef\u6027\u6570\u636e\uff0c\u5e76\u63d0\u4f9b\u673a\u5668\u751f\u6210\u7684\u52a8\u4f5c\u4e0e\u8bed\u8a00\u6807\u6ce8\u3002", "why_notable": "\u5c06\u6570\u636e\u6269\u5c55\u91cd\u70b9\u4ece\u91cd\u590d\u793a\u8303\u8f6c\u5411\u73af\u5883\u4e0e\u4efb\u52a1\u591a\u6837\u6027\uff0c\u8865\u8db3\u771f\u5b9e\u6280\u80fd\u5de5\u4f5c\u89c6\u9891\u7684\u7f3a\u53e3\uff0c\u4e3a\u7814\u7a76\u673a\u5668\u4eba\u8de8\u573a\u666f\u6cdb\u5316\u63d0\u4f9b\u5927\u89c4\u6a21\u8d44\u6e90\u3002"}, {"abstract": "Multi-Teacher On-Policy Distillation (MOPD) enables a single student to absorb the skills of several domain teachers by learning from its own generated responses. We present Multimodal Model Multi-Teacher On-Policy Distillation Reasoner (M3OPD-Reasoner), a fully open recipe for post-training vision-language models (VLMs) over three reasoning domains: image STEM, image perception, and video. We curate two datasets, M3OPD-SFT-1.35M for supervised fine-tuning (SFT) and M3OPD-RL-193K for reinforcement learning (RL) with verifiable rewards. On these data, we compare post-training recipes that start from Qwen3.5-9B: training one model on the mixed data of all domains (MixSFT and MixRL), and training one teacher per domain with Group Sequence Policy Optimization (GSPO), directly or after an SFT warm-up, and distilling the teachers into one student with MOPD. We evaluate on 21 image STEM, image perception, and video reasoning benchmarks after we decontaminate the training data against them. The comparison establishes MOPD of teachers trained with GSPO directly from Qwen3.5-9B as the best recipe: the student closely matches each teacher on its own domain and is on average above the mixed-training baselines on the same prompts. Since MOPD already merges the domain capabilities that MixRL would otherwise have to learn, its student is a stronger starting point for RL, and we ask whether the same data can carry the model further from there: we add MixRL on top of the MOPD student, on the same prompts and with the same settings, which, to our knowledge, no prior VLM recipe has studied. The same prompts still improve the MOPD student, with no collapse, and give our main model, M3OPD-Reasoner-9B. MOPD and MixRL can therefore work as consecutive stages that get more out of the same data. We release all data, the training code, and the checkpoints of every stage.", "arxiv_id": "2611.23034", "arxiv_url": "https://arxiv.org/abs/2611.23034", "authors": ["Nguyen Quang Trung", "Hoang Phan", "Shuo Sun", "Longyin Zhang", "AiTi Aw"], "brief": "\u63d0\u51fa\u5f00\u653e\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u4ee5GSPO\u8bad\u7ec3\u9886\u57df\u6559\u5e08\uff0c\u518d\u8ba9\u5b66\u751f\u57fa\u4e8e\u81ea\u8eab\u751f\u6210\u56de\u7b54\u8fdb\u884c\u591a\u6559\u5e08\u84b8\u998f\uff0c\u6700\u540e\u53e0\u52a0\u6df7\u5408\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ngquangtrung57/M3OPD-Reasoner", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.23034", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa135\u4e07\u6761SFT\u4e0e19.3\u4e07\u6761\u53ef\u9a8c\u8bc1\u5956\u52b1RL\u6570\u636e", "Qwen3.5-9B\u7ecfGSPO\u6559\u5e08\u3001MOPD\u53caMixRL\u8bad\u7ec3", "\u572821\u4e2a\u53bb\u6c61\u67d3\u8bc4\u6d4b\u96c6\u4e0a\uff0c\u84b8\u998f\u5e73\u5747\u4f18\u4e8e\u6df7\u8bad\u57fa\u7ebf"], "keywords": ["\u591a\u6a21\u6001\u63a8\u7406", "\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u540e\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23034v1", "published_at": "2026-11-17", "score": 0.242, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23034.png", "title": "M3OPD-Reasoner: An Open Recipe for Post-Training Multimodal Reasoning with Multi-Teacher On-Policy Distillation", "tldr": "\u591a\u6559\u5e08\u84b8\u998f\u540e\u518d\u505a\u5f3a\u5316\u5b66\u4e60\uff0c\u8ba9\u5355\u4e00\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u517c\u987e\u4e09\u7c7b\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u5f00\u653e\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u4ee5GSPO\u8bad\u7ec3\u9886\u57df\u6559\u5e08\uff0c\u518d\u8ba9\u5b66\u751f\u57fa\u4e8e\u81ea\u8eab\u751f\u6210\u56de\u7b54\u8fdb\u884c\u591a\u6559\u5e08\u84b8\u998f\uff0c\u6700\u540e\u53e0\u52a0\u6df7\u5408\u5f3a\u5316\u5b66\u4e60\u3002", "why_notable": "\u5c55\u793a\u591a\u6559\u5e08\u84b8\u998f\u4e0e\u6df7\u5408\u5f3a\u5316\u5b66\u4e60\u53ef\u8fde\u7eed\u5229\u7528\u540c\u6279\u6570\u636e\u63d0\u5347\u80fd\u529b\uff0c\u5e76\u516c\u5f00\u6570\u636e\u3001\u8bad\u7ec3\u4ee3\u7801\u53ca\u5404\u9636\u6bb5\u6743\u91cd\uff0c\u4fbf\u4e8e\u590d\u73b0\u4e0e\u6bd4\u8f83\u3002"}, {"abstract": "Speculative-diffusion decoding uses a small parallel drafter model to generate b draft tokens in one forward pass, which then undergo parallel verification via a larger target model. Faster inference can be achieved when multiple draft tokens pass verification simultaneously. Recent parallel draft architectures (DFlash, DSpark) improve draft quality by conditioning on rich features computed by the target, through a mechanism known as feature encoding. However, standard feature encoding mechanisms have three limitations: (1) they are lossy, applying encoding projections that are destructive to the underlying target feature-space via a discovered effect known as residual mixing, (2) they are memory-less, with no record of previously processed proposals, and (3) they utilize features sampled uniformly from across the target layers, omitting important hidden states. To address these issues, we propose Mixture-of-Features Attention (MoFA), a lightweight feature-encoding approach equipped with a working memory that encodes previously rejected proposals. Leveraging MoFA, rejection memory, and a set of further enhancements, including 2-tap causal convolutions, prefix-only cross-attention, and non-uniform target layer selection, the final architecture, DNeo, achieves 1.3x faster generation speed than SoTA (DFlash-2) without impacting drafter footprint or generation quality. DNeo marks a new state of the art in high quality, fast LLM inference.", "arxiv_id": "2611.21925", "arxiv_url": "https://arxiv.org/abs/2611.21925", "authors": ["Jameson Sandler", "Shane Bergsma", "Mostafa Elhoushi", "Bin Claire Zhang", "Gavia Gray", "Joel Hestness", "Nolan Dey", "Ferdinando Fioretto"], "brief": "\u63d0\u51fa\u5e76\u884c\u8349\u7a3f\u67b6\u6784DNeo\uff0c\u4ee5\u8f7b\u91cf\u7ea7MoFA\u6ce8\u610f\u529b\u7f16\u7801\u76ee\u6807\u6a21\u578b\u7279\u5f81\uff0c\u5e76\u8bb0\u5fc6\u88ab\u62d2\u7edd\u7684\u63d0\u6848\uff1b\u7ed3\u5408\u975e\u5747\u5300\u9009\u5c42\u7b49\u8bbe\u8ba1\uff0c\u6539\u5584\u8349\u7a3f\u8d28\u91cf\u4e0e\u63a8\u7406\u901f\u5ea6\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/J-sandler/DNeo", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.21925", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["MoFA\u9488\u5bf9\u6b8b\u5dee\u6df7\u5408\u9020\u6210\u7684\u7279\u5f81\u7f16\u7801\u635f\u5931", "\u62d2\u7edd\u8bb0\u5fc6\u4fdd\u5b58\u6b64\u524d\u672a\u901a\u8fc7\u9a8c\u8bc1\u7684\u63d0\u6848", "\u8f83DFlash-2\u63d0\u901f1.3\u500d\uff0c\u6a21\u578b\u5360\u7528\u4e0e\u751f\u6210\u8d28\u91cf\u4e0d\u53d8"], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u5927\u6a21\u578b\u63a8\u7406", "\u7279\u5f81\u7f16\u7801", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 2, "on_hf": true, "organization": "Cerebras", "pdf_url": "https://arxiv.org/pdf/2611.21925v1", "published_at": "2026-11-16", "score": 0.238, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21925.png", "title": "DNeo: Your Parallel Draft Model Needs Better Target Feature Encoding", "tldr": "\u901a\u8fc7\u6539\u8fdb\u76ee\u6807\u7279\u5f81\u7f16\u7801\u4e0e\u62d2\u7edd\u8bb0\u5fc6\uff0c\u5e76\u884c\u8349\u7a3f\u6a21\u578b\u5b9e\u73b0\u66f4\u5feb\u4e14\u4e0d\u964d\u8d28\u7684\u751f\u6210\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u5e76\u884c\u8349\u7a3f\u67b6\u6784DNeo\uff0c\u4ee5\u8f7b\u91cf\u7ea7MoFA\u6ce8\u610f\u529b\u7f16\u7801\u76ee\u6807\u6a21\u578b\u7279\u5f81\uff0c\u5e76\u8bb0\u5fc6\u88ab\u62d2\u7edd\u7684\u63d0\u6848\uff1b\u7ed3\u5408\u975e\u5747\u5300\u9009\u5c42\u7b49\u8bbe\u8ba1\uff0c\u6539\u5584\u8349\u7a3f\u8d28\u91cf\u4e0e\u63a8\u7406\u901f\u5ea6\u3002", "why_notable": "\u5c06\u63a8\u6d4b\u89e3\u7801\u4f18\u5316\u91cd\u70b9\u8f6c\u5411\u76ee\u6807\u7279\u5f81\u7f16\u7801\u4e0e\u5386\u53f2\u62d2\u7edd\u4fe1\u606f\uff0c\u5728\u4e0d\u589e\u52a0\u8349\u7a3f\u6a21\u578b\u5360\u7528\u7684\u60c5\u51b5\u4e0b\u63d0\u901f\uff0c\u4e3a\u4f4e\u6210\u672c\u5927\u6a21\u578b\u63a8\u7406\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Turning a CAD model into a machining program requires both process knowledge and geometric precision. Language models can generate such workflows by writing geometry and toolpath code for each part, but this makes numerical execution part of the model\u0027s task. We introduce MillBill, an agent that separates machining decisions from their geometric execution and verification. Given a boundary-representation part, stock, and material, a locally hosted, mid-sized open model proposes operations and cutting parameters for indexed three-axis machining. A geometric harness generates toolpaths, simulates material removal, and returns feedback for plan refinement. Setup planning accounts for what the available cutters can physically reach, rather than visibility alone. We evaluate the resulting programs by the fraction of the target surface area within the specified tolerance after simulated machining. With Qwen3.8-27B, MillBill outperforms frontier-model approaches that construct their own geometry and toolpath workflows on the evaluated machining tasks. Code: https://github.com/kulibinai/millbill", "arxiv_id": "2611.22565", "arxiv_url": "https://arxiv.org/abs/2611.22565", "authors": ["Gennadii Savrasov", "Artem Slavin", "Soslan Kabisov", "Andrey Kuznetsov", "Anton Konushin", "Dmitrii Zhemchuzhnikov"], "brief": "MillBill\u7528\u672c\u5730\u4e2d\u578b\u6a21\u578b\u4e3a\u96f6\u4ef6\u89c4\u5212\u52a0\u5de5\u5de5\u5e8f\u4e0e\u5207\u524a\u53c2\u6570\uff0c\u51e0\u4f55\u5de5\u5177\u8d1f\u8d23\u751f\u6210\u5200\u8def\u3001\u4eff\u771f\u53bb\u6599\u5e76\u53cd\u9988\u4fee\u8ba2\uff1b\u88c5\u5939\u89c4\u5212\u8003\u8651\u5200\u5177\u5b9e\u9645\u53ef\u8fbe\u6027\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": "https://github.com/kulibinai/MillBill", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.22565", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u9762\u5411\u5206\u5ea6\u4e09\u8f74\u52a0\u5de5\uff0c\u8f93\u5165\u8fb9\u754c\u8868\u793a\u96f6\u4ef6\u3001\u6bdb\u576f\u4e0e\u6750\u6599", "\u51e0\u4f55\u5de5\u5177\u751f\u6210\u5200\u8def\u5e76\u4eff\u771f\u53bb\u6599\uff0c\u53cd\u9988\u9a71\u52a8\u8ba1\u5212\u4fee\u8ba2", "Qwen3.8-27B\u5728\u6240\u6d4b\u4efb\u52a1\u4e0a\u4f18\u4e8e\u524d\u6cbf\u6a21\u578b\u65b9\u6848"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u63a7\u52a0\u5de5", "\u51e0\u4f55\u63a8\u7406", "\u4eff\u771f\u53cd\u9988"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.22565v1", "published_at": "2026-11-17", "score": 0.232, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.22565.png", "title": "MillBill: A Machining Agent with Geometric Feedback", "tldr": "\u5c06\u52a0\u5de5\u51b3\u7b56\u4e0e\u51e0\u4f55\u6267\u884c\u89e3\u8026\uff0c\u8ba9\u672c\u5730\u8bed\u8a00\u6a21\u578b\u501f\u52a9\u4eff\u771f\u53cd\u9988\u6539\u8fdb\u52a0\u5de5\u65b9\u6848\u3002", "upvotes": 3, "what_it_is": "MillBill\u7528\u672c\u5730\u4e2d\u578b\u6a21\u578b\u4e3a\u96f6\u4ef6\u89c4\u5212\u52a0\u5de5\u5de5\u5e8f\u4e0e\u5207\u524a\u53c2\u6570\uff0c\u51e0\u4f55\u5de5\u5177\u8d1f\u8d23\u751f\u6210\u5200\u8def\u3001\u4eff\u771f\u53bb\u6599\u5e76\u53cd\u9988\u4fee\u8ba2\uff1b\u88c5\u5939\u89c4\u5212\u8003\u8651\u5200\u5177\u5b9e\u9645\u53ef\u8fbe\u6027\u3002", "why_notable": "\u628a\u6570\u503c\u6267\u884c\u4ea4\u7ed9\u51e0\u4f55\u5de5\u5177\uff0c\u4f7f\u4e2d\u578b\u5f00\u6e90\u6a21\u578b\u4e5f\u80fd\u5904\u7406\u7cbe\u5bc6\u52a0\u5de5\u89c4\u5212\uff1b\u4ee5\u516c\u5dee\u5185\u76ee\u6807\u8868\u9762\u79ef\u5360\u6bd4\u8861\u91cf\u52a0\u5de5\u8d28\u91cf\uff0c\u66f4\u8d34\u8fd1\u5236\u9020\u8981\u6c42\u3002"}, {"abstract": "A quantized model is usually judged by comparing it with its BF16 original, but that comparison changes more than the weights. It often changes the serving engine, it always runs on a different server instance, it may change how requests are batched, and on some stacks the library selects a different kernel depending only on which packages import. We measure each of these sources on the same 2,400 public decisions for two of Cloudflare\u0027s decision models, Clef-flash (9B) and Clef (27B), on an NVIDIA GB10, and state every quantization effect as the excess over them. Sources that are not quantization move between 0 and 0.92% of decisions. llama.cpp restarts are bit-identical on every record for both models. vLLM restarts flip 0, 5 and 20 decisions at BF16, FP8 and NVFP4 on Clef-flash and 4, 0 and 22 on Clef; a third instance of Clef\u0027s quantized builds (exploratory) leaves FP8 at 0 and puts NVFP4 at 4 to 22, depending on which two instances are compared. An engine change at BF16 flips 6 to 16, a batch-size change 8 to 15, and the Gated DeltaNet kernel transformers selects unasked 10 to 14. Quantization inside one engine moves more: for Clef-flash and Clef, 0.88% and 1.04% at Q8_0, 2.12% and 1.62% at FP8, 5.79% and 3.50% at Q4_K_M, and 5.79% and 5.67% at NVFP4. On both models, every 4-bit interval excludes every non-quantization source. Two of our five pre-registered predictions failed, and the same two fail when the tests are rerun on the 27B: FP8 is not inside restart noise, and changing engine moves fewer decisions than 8-bit quantization does. Accuracy hides most of this. Over the full 31,275 public questions, Clef\u0027s Q4_K_M build moves accuracy by a net six questions (-0.02 points [-0.20, +0.16]) while 436 of its decisions get worse (exploratory), and NVFP4 costs Clef-flash 0.95 points and Clef 0.65. We release the code, quantization recipes, per-record outputs and the pre-registration.", "arxiv_id": "2611.15671", "arxiv_url": "https://arxiv.org/abs/2611.15671", "authors": ["Aleks Blagojevich", "Trevor Sunderland"], "brief": "\u7814\u7a76\u5728\u4e24\u4e2a\u51b3\u7b56\u6a21\u578b\u4e0a\u62c6\u5206\u5f15\u64ce\u3001\u91cd\u542f\u3001\u6279\u91cf\u4e0e\u5185\u6838\u53d8\u5316\u9020\u6210\u7684\u6f02\u79fb\uff0c\u518d\u5bf9\u7167\u516b\u4f4d\u548c\u56db\u4f4d\u91cf\u5316\u6548\u5e94\uff0c\u4ee5\u9010\u6761\u51b3\u7b56\u53d8\u5316\u8865\u5145\u51c6\u786e\u7387\u8bc4\u4f30\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/Level5Tech/clef-quant-bench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.15671", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["9B\u4e0e27B\u6a21\u578b\u5171\u6d4b2400\u6761\u51b3\u7b56\uff0c\u73af\u5883\u6f02\u79fb\u6700\u9ad80.92%", "\u56db\u4f4d\u91cf\u5316\u51b3\u7b56\u6f02\u79fb3.50%\u81f35.79%\uff0c\u533a\u95f4\u5747\u6392\u9664\u73af\u5883\u566a\u58f0", "Q4_K_M\u51c6\u786e\u7387\u4ec5\u964d0.02\u70b9\uff0c\u5374\u6709436\u6761\u51b3\u7b56\u53d8\u5dee"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u8bc4\u6d4b\u65b9\u6cd5", "\u63a8\u7406\u90e8\u7f72", "\u53ef\u590d\u73b0\u6027"], "num_comments": 5, "on_hf": true, "organization": "Level5", "pdf_url": "https://arxiv.org/pdf/2611.15671v1", "published_at": "2026-11-11", "score": 0.229, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.15671.png", "title": "The Noise Floor of a Quantization Comparison: Engine, restart, batch and kernel drift, measured against 8-bit and 4-bit effects in two decision models", "tldr": "\u91cf\u5316\u8bc4\u6d4b\u9700\u6263\u9664\u8fd0\u884c\u73af\u5883\u566a\u58f0\uff0c\u56db\u4f4d\u91cf\u5316\u7684\u51b3\u7b56\u6f02\u79fb\u4ecd\u663e\u8457\u9ad8\u4e8e\u566a\u58f0\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u5728\u4e24\u4e2a\u51b3\u7b56\u6a21\u578b\u4e0a\u62c6\u5206\u5f15\u64ce\u3001\u91cd\u542f\u3001\u6279\u91cf\u4e0e\u5185\u6838\u53d8\u5316\u9020\u6210\u7684\u6f02\u79fb\uff0c\u518d\u5bf9\u7167\u516b\u4f4d\u548c\u56db\u4f4d\u91cf\u5316\u6548\u5e94\uff0c\u4ee5\u9010\u6761\u51b3\u7b56\u53d8\u5316\u8865\u5145\u51c6\u786e\u7387\u8bc4\u4f30\u3002", "why_notable": "\u4e3a\u91cf\u5316\u6bd4\u8f83\u63d0\u4f9b\u53ef\u6d4b\u91cf\u7684\u73af\u5883\u566a\u58f0\u57fa\u7ebf\uff0c\u63ed\u793a\u51c0\u51c6\u786e\u7387\u53ef\u80fd\u63a9\u76d6\u5927\u91cf\u51b3\u7b56\u9000\u5316\uff1b\u4ee3\u7801\u4e0e\u9010\u6761\u8f93\u51fa\u5f00\u653e\uff0c\u4fbf\u4e8e\u590d\u6838\u3002"}, {"abstract": "Hyper-Connections (HC) expand the residual stream of a Transformer into $N$ parallel streams, and manifold-constrained HC (mHC) stabilizes them at scale. However, mHC benefits little from more than four streams, partly because each sublayer writes a single output to all streams, limiting how differently they can be updated. In this work, we propose TPHC, which integrates tensor-parallel (TP) shards with HC streams to promote greater independence across streams. Specifically, we route a separate mixture of the residual streams to each TP shard and keep the individual shard outputs separate during write-back, so each stream can receive a different mixture of those outputs. This design makes the residual-stream updates more expressive without adding parameters or FLOPs to the attention or FFN sublayers. With native support for stream sharding under TP, TPHC requires only 9% more training time than mHC on an 8B model when both use four streams. Increasing the number of streams from four to sixteen raises its training time by only 19%. On a 1.1B model trained on 100B tokens, TPHC reduces validation loss by 0.7-1.0% and raises average zero-shot accuracy across six commonsense reasoning benchmarks by 0.3-0.7 percentage points relative to mHC at matched stream counts $N\\in\\{4,8,16\\}$. Our code is available at https://github.com/wuyou2002/TPHC.", "arxiv_id": "2611.23026", "arxiv_url": "https://arxiv.org/abs/2611.23026", "authors": ["Xinying Hu", "You Wu", "Haoyi Wu", "Jianchao Tan", "Kefeng Zhang", "Yuchen Xie", "Kewei Tu"], "brief": "TPHC\u5c06\u5f20\u91cf\u5e76\u884c\u5206\u7247\u4e0e\u591a\u6b8b\u5dee\u6d41\u7ed3\u5408\uff0c\u4e3a\u5404\u5206\u7247\u8f93\u5165\u4e0d\u540c\u7684\u6d41\u6df7\u5408\uff0c\u5e76\u4fdd\u7559\u5206\u7247\u8f93\u51fa\u4f9b\u5dee\u5f02\u5316\u5199\u56de\uff1b\u4e0d\u589e\u52a0\u6ce8\u610f\u529b\u6216\u524d\u9988\u5b50\u5c42\u7684\u53c2\u6570\u4e0e\u8ba1\u7b97\u91cf\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/wuyou2002/TPHC", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.23026", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["TPHC\u6309\u5f20\u91cf\u5e76\u884c\u5206\u7247\u72ec\u7acb\u6df7\u5408\u8f93\u5165\u3001\u5206\u7ec4\u5199\u56de", "8B\u6a21\u578b\u56db\u6d41\u8bad\u7ec3\u6bd4mHC\u61629%\uff0c\u6269\u81f3\u5341\u516d\u6d41\u518d\u616219%", "1.1B\u6a21\u578b\u635f\u5931\u964d0.7\u20141.0%\uff0c\u96f6\u6837\u672c\u51c6\u786e\u7387\u53470.3\u20140.7\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u5f20\u91cf\u5e76\u884c", "\u6b8b\u5dee\u8fde\u63a5", "\u6a21\u578b\u67b6\u6784", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23026v1", "published_at": "2026-11-17", "score": 0.217, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.23026.png", "title": "TPHC: Improving Hyper-Connections with Tensor-Parallel Grouped Updates", "tldr": "\u901a\u8fc7\u5f20\u91cf\u5e76\u884c\u5206\u7ec4\u8bfb\u5199\u589e\u5f3a\u6b8b\u5dee\u6d41\u72ec\u7acb\u6027\uff0c\u4ee5\u8f83\u5c0f\u8bad\u7ec3\u5f00\u9500\u6539\u5584\u6a21\u578b\u8868\u73b0\u3002", "upvotes": 2, "what_it_is": "TPHC\u5c06\u5f20\u91cf\u5e76\u884c\u5206\u7247\u4e0e\u591a\u6b8b\u5dee\u6d41\u7ed3\u5408\uff0c\u4e3a\u5404\u5206\u7247\u8f93\u5165\u4e0d\u540c\u7684\u6d41\u6df7\u5408\uff0c\u5e76\u4fdd\u7559\u5206\u7247\u8f93\u51fa\u4f9b\u5dee\u5f02\u5316\u5199\u56de\uff1b\u4e0d\u589e\u52a0\u6ce8\u610f\u529b\u6216\u524d\u9988\u5b50\u5c42\u7684\u53c2\u6570\u4e0e\u8ba1\u7b97\u91cf\u3002", "why_notable": "\u5b83\u9488\u5bf9\u591a\u6b8b\u5dee\u6d41\u66f4\u65b0\u8d8b\u540c\u7684\u74f6\u9888\uff0c\u5c06\u5f20\u91cf\u5e76\u884c\u7528\u4e8e\u63d0\u5347\u66f4\u65b0\u8868\u8fbe\u529b\uff0c\u4e3a\u6269\u5927\u6b8b\u5dee\u6d41\u6570\u91cf\u63d0\u4f9b\u4e86\u5f00\u9500\u53ef\u63a7\u4e14\u6709\u5b9e\u6d4b\u6536\u76ca\u7684\u8def\u5f84\u3002"}, {"abstract": "In 2025 alone, 48 new large language model (LLM) architectures were added to the Hugging Face transformers library, and many of them arrive with a technical report that presents the model as new. What is actually new in these models, and is it tested? We put this question to LLM technical reports. We look at three things: what the reference code shows about how new open-weight architectures differ from earlier ones; what 40 randomly sampled technical reports claim as new and whether they support it with ablation studies; and what they disclose for reproducibility and transparency. In the library, 39 of the 48 architectures added in 2025 take at least two of their three core blocks from another model, most often Llama, although part of this reflects how the library writes code. In the reports, 19 of 73 architectural or training novelty claims come with a controlled with/without comparison; 4 of 40 reports state more than one training run; 8 rerun the models they compare against under one setup; and 1 discloses data mixture, token count, and compute together. We also looked for known components given new names: none of five candidate cases hid its origin, though we did not study model names. We propose seven reporting rules for LLM release reports and apply them to two reports. We do not judge model quality, and an untested claim may still be true.", "arxiv_id": "2611.20003", "arxiv_url": "https://arxiv.org/abs/2611.20003", "authors": ["Bahaeddin T\u00fcrko\u011flu"], "brief": "\u7814\u7a76\u7ed3\u5408\u53c2\u8003\u4ee3\u7801\u5206\u6790\u4e0e\u56db\u5341\u4efd\u968f\u673a\u62bd\u6837\u6280\u672f\u62a5\u544a\uff0c\u6838\u67e5\u67b6\u6784\u7ee7\u627f\u3001\u521b\u65b0\u6d88\u878d\u53ca\u590d\u73b0\u4fe1\u606f\u62ab\u9732\uff0c\u5e76\u63d0\u51fa\u4e03\u6761\u53d1\u5e03\u62a5\u544a\u89c4\u8303\uff0c\u5728\u4e24\u4efd\u62a5\u544a\u4e0a\u8bd5\u7528\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/bturkoglu/llm-novelty-exposed", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20003", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["2025\u5e74\u65b0\u589e48\u79cd\u67b6\u6784\u4e2d\uff0c39\u79cd\u6cbf\u7528\u81f3\u5c11\u4e24\u4e2a\u6838\u5fc3\u6a21\u5757", "73\u9879\u67b6\u6784\u6216\u8bad\u7ec3\u521b\u65b0\u4e3b\u5f20\u4e2d\uff0c\u4ec519\u9879\u6709\u53d7\u63a7\u6d88\u878d", "40\u4efd\u62a5\u544a\u4e2d\uff0c\u4ec51\u4efd\u540c\u65f6\u62ab\u9732\u6570\u636e\u914d\u6bd4\u3001\u8bcd\u5143\u91cf\u4e0e\u7b97\u529b"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6d88\u878d\u5b9e\u9a8c", "\u53ef\u590d\u73b0\u6027", "\u900f\u660e\u5ea6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20003v1", "published_at": "2026-11-15", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20003.png", "title": "The novelty exposed: ablation, reproducibility and transparency in 40 technical reports of open-weight large language models (LLMs)", "tldr": "\u5ba1\u67e5\u56db\u5341\u4efd\u5f00\u653e\u6743\u91cd\u5927\u6a21\u578b\u62a5\u544a\uff0c\u53d1\u73b0\u521b\u65b0\u4e3b\u5f20\u666e\u904d\u7f3a\u5c11\u6d88\u878d\u4e0e\u590d\u73b0\u8bc1\u636e\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u7ed3\u5408\u53c2\u8003\u4ee3\u7801\u5206\u6790\u4e0e\u56db\u5341\u4efd\u968f\u673a\u62bd\u6837\u6280\u672f\u62a5\u544a\uff0c\u6838\u67e5\u67b6\u6784\u7ee7\u627f\u3001\u521b\u65b0\u6d88\u878d\u53ca\u590d\u73b0\u4fe1\u606f\u62ab\u9732\uff0c\u5e76\u63d0\u51fa\u4e03\u6761\u53d1\u5e03\u62a5\u544a\u89c4\u8303\uff0c\u5728\u4e24\u4efd\u62a5\u544a\u4e0a\u8bd5\u7528\u3002", "why_notable": "\u628a\u5927\u6a21\u578b\u521b\u65b0\u53d9\u4e8b\u8f6c\u5316\u4e3a\u53ef\u6838\u67e5\u7684\u8bc1\u636e\u95ee\u9898\uff0c\u4e3a\u8bc4\u4f30\u6280\u672f\u62a5\u544a\u53ef\u4fe1\u5ea6\u63d0\u4f9b\u91cf\u5316\u4f9d\u636e\uff0c\u4e5f\u4e3a\u53d1\u5e03\u89c4\u8303\u63d0\u4f9b\u5177\u4f53\u6539\u8fdb\u65b9\u5411\u3002"}, {"abstract": "Vision-based navigation systems for orbit must be trained almost entirely on synthetic imagery, because real labelled images of a given spacecraft in flight rarely exist. Benchmarks like SPEED+ are built for that situation: the training set comes from a simulator, and the test sets are real images of a satellite mockup under two kinds of lighting. That simulator approximates how light reflects off mylar and aluminium, and like every scientific simulator it is misspecified. Its error is radiometric, since it misses the specular highlights, hard shadows and sensor saturation common in real images. We probe the resulting synthetic-to-real gap, the central risk for such systems, with a deliberately simple monocular pose estimator. In a 2x2 study of backbone adaptation and photometric augmentation, trained on synthetic images and tested on both real hardware-in-the-loop domains, we find three things. (1) The model does not know it is failing: regions conformally calibrated to 90% on synthetic data cover only 9-15% of rotation errors on sunlamp and 21-38% on lightbox, so a wrong pose carries the confidence of a correct one. (2) Transfer is asymmetric: scaling data and features improved synthetic rotation error from 1.65 to 1.03 rad but moved the harshly lit sunlamp domain by only 0.05 rad, under twice its seed s.d., whereas adapting the backbone\u0027s last stage carried 63-83% of its extra synthetic gain to both real domains. (3) Once the backbone adapts, augmentation helps only in the direction it models: our photometric stack improved the diffusely lit lightbox domain from 1.17 to 0.99 rad on every seed but moved sunlamp no more than seed-to-seed variation, while with the backbone frozen it helped sunlamp more. Every post-review experiment was pre-registered, and the code, per-image predictions and pre-registration record are at https://github.com/lokindoo/spacecraft-pose-estimation.", "arxiv_id": "2611.20321", "arxiv_url": "https://arxiv.org/abs/2611.20321", "authors": ["Nikolay Dolgov"], "brief": "\u7814\u7a76\u7528\u7b80\u5355\u5355\u76ee\u4f4d\u59ff\u4f30\u8ba1\u5668\u68c0\u9a8cSPEED+\u4eff\u771f\u5230\u771f\u5b9e\u7684\u5dee\u8ddd\uff0c\u901a\u8fc7\u9aa8\u5e72\u9002\u914d\u4e0e\u5149\u5ea6\u589e\u5f3a\u7684\u4ea4\u53c9\u5b9e\u9a8c\uff0c\u6bd4\u8f83\u4e24\u79cd\u771f\u5b9e\u5149\u7167\u57df\u7684\u8bef\u5dee\u53ca\u7f6e\u4fe1\u8986\u76d6\u7387\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": "https://github.com/lokindoo/spacecraft-pose-estimation", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.20321", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5408\u6210\u57df90%\u5171\u5f62\u8986\u76d6\u7387\uff0c\u771f\u5b9e\u57df\u964d\u81f39\u201338%", "\u9002\u914d\u9aa8\u5e72\u672b\u9636\u6bb5\uff0c63\u201383%\u989d\u5916\u5408\u6210\u6536\u76ca\u8fc1\u79fb\u5230\u771f\u5b9e\u57df", "\u9aa8\u5e72\u9002\u914d\u540e\uff0c\u5149\u5ea6\u589e\u5f3a\u4f7flightbox\u8bef\u5dee\u4ece1.17\u964d\u81f30.99\u5f27\u5ea6"], "keywords": ["\u4f4d\u59ff\u4f30\u8ba1", "\u4eff\u771f\u5230\u771f\u5b9e\u8fc1\u79fb", "\u7f6e\u4fe1\u6821\u51c6", "\u6570\u636e\u589e\u5f3a"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20321v1", "published_at": "2026-11-15", "score": 0.21, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20321.png", "title": "Unreasonable Confidence from Simulator Misspecification: Directional Robustness on the SPEED+ Sim-to-Real Benchmark", "tldr": "\u822a\u5929\u5668\u4f4d\u59ff\u4f30\u8ba1\u5728\u771f\u5b9e\u5149\u7167\u4e0b\u4e25\u91cd\u8fc7\u5ea6\u81ea\u4fe1\uff0c\u8fc1\u79fb\u6536\u76ca\u53d6\u51b3\u4e8e\u9002\u914d\u65b9\u5411\u3002", "upvotes": 1, "what_it_is": "\u7814\u7a76\u7528\u7b80\u5355\u5355\u76ee\u4f4d\u59ff\u4f30\u8ba1\u5668\u68c0\u9a8cSPEED+\u4eff\u771f\u5230\u771f\u5b9e\u7684\u5dee\u8ddd\uff0c\u901a\u8fc7\u9aa8\u5e72\u9002\u914d\u4e0e\u5149\u5ea6\u589e\u5f3a\u7684\u4ea4\u53c9\u5b9e\u9a8c\uff0c\u6bd4\u8f83\u4e24\u79cd\u771f\u5b9e\u5149\u7167\u57df\u7684\u8bef\u5dee\u53ca\u7f6e\u4fe1\u8986\u76d6\u7387\u3002", "why_notable": "\u63ed\u793a\u4eff\u771f\u5668\u5149\u7167\u5931\u914d\u4e0d\u4ec5\u635f\u5bb3\u7cbe\u5ea6\uff0c\u8fd8\u4f1a\u4f7f\u7f6e\u4fe1\u6821\u51c6\u5931\u6548\uff1b\u9aa8\u5e72\u9002\u914d\u4e0e\u589e\u5f3a\u6548\u679c\u7684\u5dee\u5f02\uff0c\u4e3a\u822a\u5929\u89c6\u89c9\u8fc1\u79fb\u63d0\u4f9b\u4e86\u5177\u4f53\u4f9d\u636e\u3002"}, {"abstract": "Multimodal large language models (MLLMs) excel in vision-language tasks; yet, whether they maintain consistent understanding of information-rich visuals (InfoVis) when the surface language changes remains unclear. To quantify this capability, we introduce MInfoVisQA, a parallel benchmark with 8,960 QA configurations derived from 128 seed instances across 24 languages. We construct seed-matched, language-parallel visuals and QA pairs by disentangling numerical-structural data from text and programmatically synchronizing translated labels. We evaluate 25 MLLMs under two settings: Language-Aligned QA (LQA, matching visual-text languages) and Cross-Language QA (XQA, fixed QA language with varying visual languages). The results show that aggregate accuracy masks substantial robustness gaps: two models with comparable mean LQA accuracy (80.4\\%) exhibit performance spreads of 7.8 and 20.3 percentage points across languages. Moreover, all 25 models score lower with non-English visuals under fixed English QA, underscoring the need for cross-language sensitivity metrics.", "arxiv_id": "2611.21644", "arxiv_url": "https://arxiv.org/abs/2611.21644", "authors": ["Changjiang Jiang", "Jiang Zhou", "Xinbin Yuan", "Fan Zhang", "Tao Feng", "Zhuohan Xie"], "brief": "\u6784\u5efa\u8986\u76d624\u79cd\u8bed\u8a00\u7684\u4fe1\u606f\u5bc6\u96c6\u578b\u89c6\u89c9\u95ee\u7b54\u57fa\u51c6\uff0c\u5c06\u6570\u503c\u7ed3\u6784\u4e0e\u6587\u672c\u5206\u79bb\uff0c\u5e76\u540c\u6b65\u7ffb\u8bd1\u56fe\u4e2d\u6807\u7b7e\u3002\u901a\u8fc7\u8bed\u8a00\u5bf9\u9f50\u4e0e\u8de8\u8bed\u8a00\u95ee\u7b54\u4e24\u79cd\u8bbe\u7f6e\uff0c\u68c0\u9a8c\u6a21\u578b\u7406\u89e3\u7684\u4e00\u81f4\u6027\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": "https://github.com/arnodjiang/MInfoVisQA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.21644", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["128\u4e2a\u79cd\u5b50\u5b9e\u4f8b\u751f\u62108,960\u79cd\u95ee\u7b54\u914d\u7f6e\u3002", "LQA\u5747\u5206\u540c\u4e3a80.4%\u7684\u6a21\u578b\uff0c\u8bed\u8a00\u95f4\u6781\u5dee\u8fbe7.8\u4e0e20.3\u4e2a\u767e\u5206\u70b9\u3002", "XQA\u56fa\u5b9a\u82f1\u8bed\u63d0\u95ee\u65f6\uff0c25\u4e2a\u6a21\u578b\u5728\u975e\u82f1\u8bed\u56fe\u50cf\u4e0a\u5747\u964d\u5206\u3002"], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u89c6\u89c9\u95ee\u7b54", "\u591a\u8bed\u8a00\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2611.21644v1", "published_at": "2026-10-14", "score": 0.207, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21644.png", "title": "MInfoVisQA: A Multilingual Benchmark for Information-Rich Visual Question Answering", "tldr": "\u591a\u8bed\u8a00\u89c6\u89c9\u95ee\u7b54\u8bc4\u6d4b\u63ed\u793a\uff0c\u5e73\u5747\u51c6\u786e\u7387\u63a9\u76d6\u4e86\u6a21\u578b\u8de8\u8bed\u8a00\u7406\u89e3\u7684\u7a33\u5b9a\u6027\u5dee\u8ddd\u3002", "upvotes": 1, "what_it_is": "\u6784\u5efa\u8986\u76d624\u79cd\u8bed\u8a00\u7684\u4fe1\u606f\u5bc6\u96c6\u578b\u89c6\u89c9\u95ee\u7b54\u57fa\u51c6\uff0c\u5c06\u6570\u503c\u7ed3\u6784\u4e0e\u6587\u672c\u5206\u79bb\uff0c\u5e76\u540c\u6b65\u7ffb\u8bd1\u56fe\u4e2d\u6807\u7b7e\u3002\u901a\u8fc7\u8bed\u8a00\u5bf9\u9f50\u4e0e\u8de8\u8bed\u8a00\u95ee\u7b54\u4e24\u79cd\u8bbe\u7f6e\uff0c\u68c0\u9a8c\u6a21\u578b\u7406\u89e3\u7684\u4e00\u81f4\u6027\u3002", "why_notable": "\u4ee5\u7ed3\u6784\u4e00\u81f4\u3001\u8bed\u8a00\u4e0d\u540c\u7684\u89c6\u89c9\u6750\u6599\u63a7\u5236\u53d8\u91cf\uff0c\u63ed\u793a\u5747\u5206\u4e4b\u5916\u7684\u9c81\u68d2\u6027\u5dee\u5f02\uff0c\u4e3a\u591a\u8bed\u8a00\u591a\u6a21\u6001\u6a21\u578b\u8bc4\u6d4b\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u4f9d\u636e\u3002"}, {"abstract": "Multimodal agents largely rely on generic tools such as cropping, search, and code execution, leaving specialist vision models outside their tool space. However, bringing such a model into an already trained agent is not straightforward. The challenge is to learn each new tool efficiently while retaining the ability to use existing ones. This work proposes COTEX, continual tool-space extension learning, that adds new tools at efficient adapter-level cost. COTEX locates two sets of parameter directions; one triggers a tool call and thereby opens a multi-turn reasoning trajectory, while the other determines which tool is chosen. The adapter of a new tool is restricted to the calling directions that leave earlier tool choices unaffected by orthogonal constraint. We further introduce a protocol that converts specialist models\u0027 existing task-specific annotations into verified tool-use trajectories. Experiments on two representative agents and three specialist tools show gains on ten vision-language benchmarks, with at most a 0.3-point drop on existing tools.", "arxiv_id": "2611.23810", "arxiv_url": "https://arxiv.org/abs/2611.23810", "authors": ["Jinbae Seo", "Jungin Park", "Hyunsung Jang", "Namkoo Ha", "Jiyoung Lee", "Kwanghoon Sohn"], "brief": "COTEX\u4ee5\u9002\u914d\u5668\u7ea7\u8bad\u7ec3\u6269\u5c55\u667a\u80fd\u4f53\u5de5\u5177\u7a7a\u95f4\uff0c\u533a\u5206\u89e6\u53d1\u8c03\u7528\u4e0e\u9009\u62e9\u5de5\u5177\u7684\u53c2\u6570\u65b9\u5411\uff0c\u5e76\u7528\u6b63\u4ea4\u7ea6\u675f\u4fdd\u62a4\u65e7\u5de5\u5177\u9009\u62e9\uff1b\u53e6\u5c06\u4e13\u4e1a\u6a21\u578b\u6807\u6ce8\u8f6c\u4e3a\u9a8c\u8bc1\u8fc7\u7684\u8c03\u7528\u8f68\u8ff9\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23810", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["COTEX\u5206\u79bb\u89e6\u53d1\u5de5\u5177\u8c03\u7528\u4e0e\u9009\u62e9\u5de5\u5177\u7684\u53c2\u6570\u65b9\u5411", "\u65b0\u5de5\u5177\u9002\u914d\u5668\u65bd\u52a0\u6b63\u4ea4\u7ea6\u675f\uff0c\u4fdd\u62a4\u5df2\u6709\u5de5\u5177\u9009\u62e9", "2\u79cd\u667a\u80fd\u4f53\u30013\u79cd\u5de5\u5177\u572810\u9879\u57fa\u51c6\u63d0\u5347\uff0c\u65e7\u5de5\u5177\u6700\u591a\u964d0.3\u5206"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "\u5de5\u5177\u8c03\u7528", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23810v1", "published_at": "2026-11-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Continual Tool-Space Extension Learning for Multimodal Agents", "tldr": "\u901a\u8fc7\u6b63\u4ea4\u7ea6\u675f\u9002\u914d\u5668\uff0c\u8ba9\u591a\u6a21\u6001\u667a\u80fd\u4f53\u6301\u7eed\u63a5\u5165\u4e13\u4e1a\u89c6\u89c9\u5de5\u5177\u5e76\u4fdd\u7559\u65e7\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "COTEX\u4ee5\u9002\u914d\u5668\u7ea7\u8bad\u7ec3\u6269\u5c55\u667a\u80fd\u4f53\u5de5\u5177\u7a7a\u95f4\uff0c\u533a\u5206\u89e6\u53d1\u8c03\u7528\u4e0e\u9009\u62e9\u5de5\u5177\u7684\u53c2\u6570\u65b9\u5411\uff0c\u5e76\u7528\u6b63\u4ea4\u7ea6\u675f\u4fdd\u62a4\u65e7\u5de5\u5177\u9009\u62e9\uff1b\u53e6\u5c06\u4e13\u4e1a\u6a21\u578b\u6807\u6ce8\u8f6c\u4e3a\u9a8c\u8bc1\u8fc7\u7684\u8c03\u7528\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u4e13\u4e1a\u89c6\u89c9\u6a21\u578b\u63a5\u5165\u5df2\u8bad\u7ec3\u667a\u80fd\u4f53\uff0c\u4e0d\u5fc5\u5168\u9762\u91cd\u8bad\uff1b\u5b9e\u9a8c\u663e\u793a\u6269\u5c55\u5de5\u5177\u80fd\u529b\u7684\u540c\u65f6\u53ef\u4fdd\u6301\u65e7\u5de5\u5177\u8868\u73b0\uff0c\u4e3a\u6301\u7eed\u6269\u5c55\u63d0\u4f9b\u53ef\u884c\u8def\u5f84\u3002"}, {"abstract": "Diffusion language models (DLMs) offer a flexible alternative to autoregressive models, enabling any-order infilling. While most existing decoding methods treat decoded tokens as fixed, some recent models allow previously decoded tokens to be revised only by replacing them with alternative tokens, a paradigm we refer to as replacement-only editing (ROE). Although ROE can correct individual tokens, it is inefficient for sequence shifts caused by missing or extra tokens and struggles when errors occur across many positions. To address these limitations, we propose LED (Levenshtein Editing for Diffusion Language Models), a post-training framework that extends ROE with insertion and deletion, enabling Levenshtein-style refinement of generated sequences. It uses two training designs. First, it reconstructs edit supervision on the fly during supervised fine-tuning using longest-common-subsequence alignment, enabling insertion and deletion learning without manually annotated labels. Second, it adopts multi-stage training, where the state from one stage becomes the input to the next, exposing the model to its earlier errors and enabling it to correct them. When applied to the 16B-parameter LLaDA2.1-Mini Base, LED raises the average score across twelve benchmarks from 54.86 to 57.10 under confidence-guided decoding while increasing tokens per forward from 6.14 to 7.05, whereas under confidence-free decoding it raises the average score from 27.52 to 47.19. We further show that LED achieves higher pass@k at large k than thresholded decoding without editing, demonstrating improved generation diversity and revealing the diversity potential of DLMs without confidence guidance. LED also improves robustness to large block sizes, raising the average score from 36.97 to 51.34 at block size 128. Together, these results suggest that LED supports more robust self-correction in DLMs.", "arxiv_id": "2611.23750", "arxiv_url": "https://arxiv.org/abs/2611.23750", "authors": ["Shuaidi Wang", "Zhuocheng Gong", "Xuejie Liu", "Jianguo Li", "Yu Zhang"], "brief": "LED\u662f\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u66ff\u6362\u5f0f\u4fee\u8ba2\u6269\u5c55\u4e3a\u63d2\u5165\u3001\u5220\u9664\u548c\u66ff\u6362\u3002\u5b83\u901a\u8fc7\u6700\u957f\u516c\u5171\u5b50\u5e8f\u5217\u5bf9\u9f50\u6784\u9020\u7f16\u8f91\u76d1\u7763\uff0c\u5e76\u7528\u591a\u9636\u6bb5\u8bad\u7ec3\u5b66\u4e60\u7ea0\u6b63\u5148\u524d\u9519\u8bef\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23750", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6700\u957f\u516c\u5171\u5b50\u5e8f\u5217\u5bf9\u9f50\u81ea\u52a8\u751f\u6210\u7f16\u8f91\u6807\u7b7e\uff0c\u65e0\u9700\u4eba\u5de5\u6807\u6ce8", "16B\u6a21\u578b\u5341\u4e8c\u9879\u5747\u520654.86\u219257.10\uff0c\u5355\u6b21\u524d\u5411\u4ea7\u51fa\u4ea6\u589e\u52a0", "\u65e0\u7f6e\u4fe1\u5ea6\u5f15\u5bfc\u65f6\u5747\u520627.52\u219247.19\uff0c\u5927k\u4e0b\u591a\u6837\u6027\u66f4\u4f18"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u540e\u8bad\u7ec3", "\u5e8f\u5217\u7f16\u8f91", "\u81ea\u6211\u7ea0\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23750v1", "published_at": "2026-11-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Replacement: Levenshtein Editing for Diffusion Language Models", "tldr": "\u8ba9\u6269\u6563\u8bed\u8a00\u6a21\u578b\u901a\u8fc7\u63d2\u5165\u3001\u5220\u9664\u4e0e\u66ff\u6362\u81ea\u6211\u7ea0\u9519\uff0c\u517c\u987e\u751f\u6210\u8d28\u91cf\u4e0e\u6548\u7387", "upvotes": 0, "what_it_is": "LED\u662f\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u66ff\u6362\u5f0f\u4fee\u8ba2\u6269\u5c55\u4e3a\u63d2\u5165\u3001\u5220\u9664\u548c\u66ff\u6362\u3002\u5b83\u901a\u8fc7\u6700\u957f\u516c\u5171\u5b50\u5e8f\u5217\u5bf9\u9f50\u6784\u9020\u7f16\u8f91\u76d1\u7763\uff0c\u5e76\u7528\u591a\u9636\u6bb5\u8bad\u7ec3\u5b66\u4e60\u7ea0\u6b63\u5148\u524d\u9519\u8bef\u3002", "why_notable": "\u628a\u7ea0\u9519\u4ece\u9010\u8bcd\u66ff\u6362\u6269\u5c55\u5230\u5e8f\u5217\u7ed3\u6784\u4fee\u8ba2\uff0c\u66f4\u9002\u5408\u5904\u7406\u6f0f\u8bcd\u4e0e\u5197\u4f59\u8bcd\uff1b\u7ed3\u679c\u4e5f\u663e\u793a\uff0c\u65e0\u7f6e\u4fe1\u5ea6\u5f15\u5bfc\u7684\u6269\u6563\u751f\u6210\u4ecd\u6709\u8d28\u91cf\u548c\u591a\u6837\u6027\u6f5c\u529b\u3002"}, {"abstract": "Text-conditioned 3D indoor scene generation requires layouts satisfying geometric, functional, and semantic constraints. However, existing diffusion methods rely primarily on static textual conditions, limiting their ability to assess evolving scenes and translate semantic discrepancies into executable object-level corrections. MLLM-based post-hoc refinement provides semantic feedback but remains decoupled from denoising, potentially disrupting scene coherence.We propose ReflectScene, an MLLM-guided closed-loop diffusion framework. First, we introduce Hierarchical Prior-Grounded Scene Understanding that aligns structured layouts with multi-view visual evidence, to interpret object-specific context and scene global semantics via a frozen multi-modal large language model (MLLM). Second, we propose MLLM-Guided Semantic Reward Evaluation to distill MLLM\u0027s diagnoses and assessments on possible candidate corrections into a lightweight Reward Predictor, enabling correction decision making with reduced computation burden. Finally, Decision-Conditioned Trajectory-Consistent Diffusion is proposed to integrate selected corrections through transient conditioning and persistent clean-estimate projection, correcting object layout in the generated scene while preserving non-target arrangements throughout denoising.Experiments on 3D-FRONT demonstrate improved functional consistency and semantic alignment while maintaining competitive generation quality and diversity.", "arxiv_id": "2611.23845", "arxiv_url": "https://arxiv.org/abs/2611.23845", "authors": ["Jiawei Shen", "Jie Feng", "Junpeng Zhang", "Guanbin Li", "Wanyi Chen", "Weisheng Dong", "Guangming Shi"], "brief": "\u63d0\u51fa\u591a\u6a21\u6001\u5927\u6a21\u578b\u5f15\u5bfc\u7684\u95ed\u73af\u6269\u6563\u6846\u67b6\uff0c\u4ee5\u5206\u5c42\u5148\u9a8c\u7ed3\u5408\u591a\u89c6\u89d2\u8bc1\u636e\u7406\u89e3\u573a\u666f\uff0c\u5c06\u7ea0\u9519\u8bc4\u4f30\u84b8\u998f\u4e3a\u8f7b\u91cf\u5956\u52b1\u9884\u6d4b\u5668\uff0c\u518d\u628a\u5bf9\u8c61\u7ea7\u4fee\u6b63\u878d\u5165\u53bb\u566a\u8f68\u8ff9\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23845", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5206\u5c42\u5148\u9a8c\u573a\u666f\u7406\u89e3\uff1a\u51bb\u7ed3MLLM\u5bf9\u9f50\u5e03\u5c40\u4e0e\u591a\u89c6\u89d2\u8bc1\u636e", "\u8bed\u4e49\u5956\u52b1\u8bc4\u4f30\uff1a\u8f7b\u91cfReward Predictor\u7b5b\u9009\u5019\u9009\u4fee\u6b63", "\u8f68\u8ff9\u4e00\u81f4\u6269\u6563\uff1a\u77ac\u65f6\u6761\u4ef6\u4e0e\u6301\u7eed\u5e72\u51c0\u4f30\u8ba1\u6295\u5f71\u4fdd\u7559\u975e\u76ee\u6807\u5e03\u5c40"], "keywords": ["\u4e09\u7ef4\u573a\u666f\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u8bed\u4e49\u53cd\u9988"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23845v1", "published_at": "2026-11-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ReflectScene:MLLM-Guided Closed-Loop Diffusion for 3D Indoor Scene Generation", "tldr": "\u5c06\u591a\u6a21\u6001\u8bed\u4e49\u53cd\u9988\u878d\u5165\u6269\u6563\u53bb\u566a\u95ed\u73af\uff0c\u4fee\u6b63\u4e09\u7ef4\u5ba4\u5185\u5e03\u5c40\u5e76\u4fdd\u6301\u573a\u666f\u4e00\u81f4\u6027\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u591a\u6a21\u6001\u5927\u6a21\u578b\u5f15\u5bfc\u7684\u95ed\u73af\u6269\u6563\u6846\u67b6\uff0c\u4ee5\u5206\u5c42\u5148\u9a8c\u7ed3\u5408\u591a\u89c6\u89d2\u8bc1\u636e\u7406\u89e3\u573a\u666f\uff0c\u5c06\u7ea0\u9519\u8bc4\u4f30\u84b8\u998f\u4e3a\u8f7b\u91cf\u5956\u52b1\u9884\u6d4b\u5668\uff0c\u518d\u628a\u5bf9\u8c61\u7ea7\u4fee\u6b63\u878d\u5165\u53bb\u566a\u8f68\u8ff9\u3002", "why_notable": "\u628a\u8bed\u4e49\u7ea0\u9519\u4ece\u751f\u6210\u540e\u7684\u72ec\u7acb\u6b65\u9aa4\u79fb\u5165\u53bb\u566a\u8fc7\u7a0b\uff0c\u51cf\u5c11\u4fee\u6b63\u5bf9\u5e03\u5c40\u7684\u6270\u52a8\uff1b\u57283D-FRONT\u4e0a\u6539\u5584\u529f\u80fd\u4e00\u81f4\u6027\u4e0e\u8bed\u4e49\u5bf9\u9f50\u3002"}, {"abstract": "Vision-Language-Action (VLA) models have emerged as a promising paradigm for general-purpose robotic manipulation, yet their performance often degrades on long-horizon tasks that require multiple interdependent manipulations. Instead of burdening the VLA policies with long-horizon reasoning, memory, action generation, progress tracking, and error recovery, we argue for leveraging their short-horizon manipulation capabilities within an execution-aware framework. To this end, we introduce \\textnormal{\\textbf{RePlan-VLA}}, a VLA-agnostic framework that translates a VLA\u0027s short-horizon capabilities into reliable long-horizon execution. RePlan-VLA explicitly monitors the robot\u0027s motion for progress evaluation, and adaptively revises the future plan based on observed outcomes. We preserve the underlying VLA policy entirely, requiring no additional fine-tuning. Experiments on RoboCasa365 and CALVIN benchmarks show an improvement of 21.9% and 10.4% in success rate over the next strongest baseline. We also validate our approach for real-world deployment on a Franka Research 3 robot.", "arxiv_id": "2611.23843", "arxiv_url": "https://arxiv.org/abs/2611.23843", "authors": ["Apoorva Vashisth", "Manav Kulshrestha", "Damon Conover", "Zachary Kingston", "Aniket Bera"], "brief": "\u63d0\u51fa\u4e0e\u5177\u4f53VLA\u7b56\u7565\u65e0\u5173\u7684\u6267\u884c\u6846\u67b6\uff0c\u901a\u8fc7\u76d1\u6d4b\u673a\u5668\u4eba\u8fd0\u52a8\u8bc4\u4f30\u4efb\u52a1\u8fdb\u5ea6\uff0c\u5e76\u4f9d\u636e\u5b9e\u9645\u7ed3\u679c\u8c03\u6574\u540e\u7eed\u8ba1\u5212\uff1b\u4fdd\u7559\u539f\u7b56\u7565\uff0c\u65e0\u9700\u989d\u5916\u5fae\u8c03\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23843", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["RePlan-VLA\u76d1\u6d4b\u8fd0\u52a8\u8fdb\u5ea6\uff0c\u81ea\u9002\u5e94\u4fee\u8ba2\u540e\u7eed\u8ba1\u5212", "RoboCasa365\u3001CALVIN\u6210\u529f\u7387\u63d0\u534721.9%\u300110.4%", "\u5728Franka Research 3\u673a\u5668\u4eba\u4e0a\u9a8c\u8bc1\u771f\u5b9e\u90e8\u7f72"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u4efb\u52a1\u89c4\u5212", "\u8fdb\u5ea6\u76d1\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23843v1", "published_at": "2026-11-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RePlan-VLA: Progress-Aware Replanning for Long-Horizon Vision-Language-Action Models", "tldr": "\u901a\u8fc7\u76d1\u6d4b\u6267\u884c\u8fdb\u5ea6\u4e0e\u52a8\u6001\u91cd\u89c4\u5212\uff0c\u8ba9\u77ed\u7a0b\u673a\u5668\u4eba\u7b56\u7565\u53ef\u9760\u5b8c\u6210\u957f\u7a0b\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e0e\u5177\u4f53VLA\u7b56\u7565\u65e0\u5173\u7684\u6267\u884c\u6846\u67b6\uff0c\u901a\u8fc7\u76d1\u6d4b\u673a\u5668\u4eba\u8fd0\u52a8\u8bc4\u4f30\u4efb\u52a1\u8fdb\u5ea6\uff0c\u5e76\u4f9d\u636e\u5b9e\u9645\u7ed3\u679c\u8c03\u6574\u540e\u7eed\u8ba1\u5212\uff1b\u4fdd\u7559\u539f\u7b56\u7565\uff0c\u65e0\u9700\u989d\u5916\u5fae\u8c03\u3002", "why_notable": "\u5c06\u957f\u7a0b\u89c4\u5212\u4e0e\u6267\u884c\u76d1\u63a7\u4ece\u5e95\u5c42\u52a8\u4f5c\u7b56\u7565\u4e2d\u89e3\u8026\uff0c\u65e0\u9700\u5fae\u8c03\u5373\u53ef\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\uff0c\u4e3a\u590d\u7528\u73b0\u6709VLA\u80fd\u529b\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Advances in deep generative models now enable the synthesis of realistic imagery. However, aerial imagery is dominated by tiny objects, such as vehicles, ships, and aircraft, which occupy only a few pixels owing to the overhead, wide-area nature of aerial imaging. Existing generative models struggle substantially more with tiny objects than with larger ones. This limitation has been overlooked, as prior work on generative evaluation emphasizes prompt following or human preference rather than whether small objects are rendered faithfully. To address this gap, we introduce TOGBench, a quantitative, object-level benchmark for evaluating tiny-object generation fidelity in aerial imagery. We further propose two simple train-/inference-time techniques that improve the ability of layout-to-image generators to render small objects, raising their performance on TOGBench.", "arxiv_id": "2611.23840", "arxiv_url": "https://arxiv.org/abs/2611.23840", "authors": ["Chanhwi Jeong", "Dongmin You", "Seungwook Kim"], "brief": "\u63d0\u51faTOGBench\uff0c\u9488\u5bf9\u822a\u62cd\u56fe\u50cf\u4e2d\u4ec5\u5360\u5c11\u91cf\u50cf\u7d20\u7684\u76ee\u6807\u5f00\u5c55\u5b9a\u91cf\u3001\u7269\u4f53\u7ea7\u8bc4\u4f30\uff1b\u53e6\u4ee5\u8bad\u7ec3\u671f\u548c\u63a8\u7406\u671f\u4e24\u79cd\u7b80\u5355\u6280\u672f\uff0c\u63d0\u5347\u5e03\u5c40\u5230\u56fe\u50cf\u751f\u6210\u5668\u7684\u5fae\u5c0f\u76ee\u6807\u4fdd\u771f\u5ea6\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23840", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["TOGBench\u5b9a\u91cf\u8bc4\u4f30\u7269\u4f53\u7ea7\u5fae\u5c0f\u76ee\u6807\u751f\u6210\u4fdd\u771f\u5ea6", "\u8bc4\u4f30\u5bf9\u8c61\u5305\u62ec\u4ec5\u5360\u5c11\u91cf\u50cf\u7d20\u7684\u8f66\u8f86\u3001\u8239\u8236\u4e0e\u98de\u673a", "\u4e24\u79cd\u8bad\u7ec3\u671f\u4e0e\u63a8\u7406\u671f\u6280\u672f\u63d0\u5347\u5e03\u5c40\u5230\u56fe\u50cf\u751f\u6210\u8868\u73b0"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u822a\u62cd\u56fe\u50cf", "\u5fae\u5c0f\u76ee\u6807", "\u751f\u6210\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23840v1", "published_at": "2026-11-18", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "TOGBench: Benchmarking and Improving Tiny-Object Generation Fidelity in Aerial Imagery", "tldr": "\u4ee5\u7269\u4f53\u7ea7\u57fa\u51c6\u8861\u91cf\u822a\u62cd\u5fae\u5c0f\u76ee\u6807\u751f\u6210\u4fdd\u771f\u5ea6\uff0c\u5e76\u6539\u8fdb\u5e03\u5c40\u5230\u56fe\u50cf\u751f\u6210\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faTOGBench\uff0c\u9488\u5bf9\u822a\u62cd\u56fe\u50cf\u4e2d\u4ec5\u5360\u5c11\u91cf\u50cf\u7d20\u7684\u76ee\u6807\u5f00\u5c55\u5b9a\u91cf\u3001\u7269\u4f53\u7ea7\u8bc4\u4f30\uff1b\u53e6\u4ee5\u8bad\u7ec3\u671f\u548c\u63a8\u7406\u671f\u4e24\u79cd\u7b80\u5355\u6280\u672f\uff0c\u63d0\u5347\u5e03\u5c40\u5230\u56fe\u50cf\u751f\u6210\u5668\u7684\u5fae\u5c0f\u76ee\u6807\u4fdd\u771f\u5ea6\u3002", "why_notable": "\u5c06\u751f\u6210\u8bc4\u4f30\u4ece\u63d0\u793a\u8bcd\u9075\u5faa\u548c\u4eba\u7c7b\u504f\u597d\u62d3\u5c55\u5230\u5fae\u5c0f\u76ee\u6807\u4fdd\u771f\u5ea6\uff0c\u4e3a\u822a\u62cd\u751f\u6210\u6a21\u578b\u63d0\u4f9b\u66f4\u8d34\u8fd1\u7269\u4f53\u7ec6\u8282\u7684\u8bc4\u6d4b\u4e0e\u6539\u8fdb\u65b9\u5411\u3002"}, {"abstract": "A System 1 model answers a multiple-choice question in a single pass. A frozen language model turns the question and each option into vectors, two small, trained heads place them in a shared space, and the closest option wins. The design has been shown on agent decisions, but we are not aware of a study of how far it goes on exam questions that need medical knowledge, where the right option is often no more similar to the question than the wrong ones. We rebuilt the recipe from scratch for MedMCQA and trained only two projection heads and one temperature on top of frozen Qwen3.5-0.8B, Granite-4.2-3B and Qwen3-8B, using a contrastive loss with in-batch and hard negatives and a mask for repeated answers. With plain last-token vectors, both small encoders answer about one question in three correctly (33.1% and 33.0% on 3,842 held-out questions, where chance is 25.0%). Writing each text inside a one-word-summary prompt and lowering the learning rate of the heads raised this to 41.7% and 42.5% for the two small encoders and to 46.0% +-0.2 (three seeds) for Qwen3-8B. Shuffling the questions against the options returns accuracy to chance, so the heads do use the question. Flan-PaLM and Med-PaLM 2 report 57.6% and 72.3% on MedMCQA under a different protocol, so ours is a cheap, fast baseline and not a competitive system. We also say what our evidence cannot show: validation gains were about 1.7 to 2 times the test gains, and we could not separate the effect of reading several encoder layers from the other changes.", "arxiv_id": "2611.23832", "arxiv_url": "https://arxiv.org/abs/2611.23832", "authors": ["Pavan Kumar Mantha"], "brief": "\u7814\u7a76\u7528\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u7f16\u7801\u9898\u76ee\u4e0e\u9009\u9879\uff0c\u4ec5\u8bad\u7ec3\u4e24\u4e2a\u6295\u5f71\u5934\u548c\u6e29\u5ea6\u53c2\u6570\uff0c\u4ee5\u5171\u4eab\u7a7a\u95f4\u4e2d\u7684\u8ddd\u79bb\u5355\u6b21\u9009\u7b54\u3002\u518d\u901a\u8fc7\u5355\u8bcd\u603b\u7ed3\u63d0\u793a\u4e0e\u5bf9\u6bd4\u5b66\u4e60\u6539\u5584\u533b\u5b66\u9898\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23832", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u5bf9\u6bd4\u635f\u5931\u7ed3\u5408\u6279\u5185\u8d1f\u4f8b\u3001\u56f0\u96be\u8d1f\u4f8b\u4e0e\u91cd\u590d\u7b54\u6848\u63a9\u7801", "\u5355\u8bcd\u603b\u7ed3\u63d0\u793a\u914d\u5408\u8f83\u4f4e\u5b66\u4e60\u7387\uff0c\u5c0f\u6a21\u578b\u51c6\u786e\u7387\u8fbe42.5%", "Qwen3-8B\u4e09\u79cd\u5b50\u51c6\u786e\u738746.0%\u00b10.2"], "keywords": ["\u533b\u5b66\u95ee\u7b54", "\u51bb\u7ed3\u6a21\u578b", "\u5bf9\u6bd4\u5b66\u4e60", "\u6587\u672c\u8868\u5f81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23832v1", "published_at": "2026-11-18", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "A System 1 Decision Model for Medical Multiple-Choice Questions Built on Frozen Language Models", "tldr": "\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u52a0\u8f7b\u91cf\u6295\u5f71\u5934\u53ef\u5feb\u901f\u56de\u7b54\u533b\u5b66\u9009\u62e9\u9898\uff0c\u4f46\u51c6\u786e\u7387\u4ecd\u660e\u663e\u53d7\u9650\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u7f16\u7801\u9898\u76ee\u4e0e\u9009\u9879\uff0c\u4ec5\u8bad\u7ec3\u4e24\u4e2a\u6295\u5f71\u5934\u548c\u6e29\u5ea6\u53c2\u6570\uff0c\u4ee5\u5171\u4eab\u7a7a\u95f4\u4e2d\u7684\u8ddd\u79bb\u5355\u6b21\u9009\u7b54\u3002\u518d\u901a\u8fc7\u5355\u8bcd\u603b\u7ed3\u63d0\u793a\u4e0e\u5bf9\u6bd4\u5b66\u4e60\u6539\u5584\u533b\u5b66\u9898\u8868\u73b0\u3002", "why_notable": "\u63d0\u4f9b\u4e86\u4f4e\u8bad\u7ec3\u6210\u672c\u3001\u5feb\u901f\u9009\u7b54\u7684\u533b\u5b66\u95ee\u7b54\u57fa\u7ebf\uff0c\u4e5f\u91cf\u5316\u4e86\u5176\u6027\u80fd\u8fb9\u754c\uff1a\u4ecd\u843d\u540e\u4e8e\u5df2\u62a5\u544a\u7684\u533b\u5b66\u6a21\u578b\uff0c\u4e14\u9a8c\u8bc1\u96c6\u6536\u76ca\u9ad8\u4e8e\u6d4b\u8bd5\u96c6\u3002"}, {"abstract": "Animating virtual opponents is an important yet challenging task in game development. In martial arts games, opponent motions must not only be physically plausible but also exhibit appropriate technique, timing, transitions, and target-directed intent. Traditional game animations often rely on handcrafted clips, state machine transitions, and procedural adjustments, which can be labor-intensive and may limit the behavioral diversity of non-player characters. This paper presents a martial arts motion skills learning framework for character animation in virtual sparring games. Inspired by Tang Soo Do, we collected a martial arts motion capture dataset containing isolated attacking and defending techniques, technique combinations and transitions, and contextual sparring variations. We first pretrained a reusable repertoire of martial arts motion skills from the captured data using reinforcement learning (RL) with adversarial style rewards, and then adapted these skills with task-specific rewards for target-directed striking and threat-aware evasion. We evaluated the motions generated by the learned policy through a user study, in which participants assessed their physical plausibility, smoothness, and martial arts form. To demonstrate their applicability to interactive gameplay, we developed a VR sparring prototype for Meta Quest headsets. The prototype combines policy-generated motion clips with lightweight state-based control to support interactive opponent behavior. Together, these findings support the feasibility of using a learned martial arts skill repertoire as a motion foundation for animating opponents in VR sparring games.", "arxiv_id": "2611.23825", "arxiv_url": "https://arxiv.org/abs/2611.23825", "authors": ["Jiqing Wen", "Qixuan Shi", "Robert LiKamWa", "Pavan Turaga"], "brief": "\u901a\u8fc7\u52a8\u4f5c\u6355\u6349\u4e0e\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6b66\u672f\u52a8\u4f5c\u6280\u80fd\uff0c\u5e76\u9002\u914d\u5b9a\u5411\u653b\u51fb\u548c\u5a01\u80c1\u89c4\u907f\uff1b\u7528\u6237\u8bc4\u4f30\u4e0eVR\u5bf9\u7ec3\u539f\u578b\u9a8c\u8bc1\u4e86\u5176\u4f5c\u4e3a\u865a\u62df\u5bf9\u624b\u52a8\u753b\u57fa\u7840\u7684\u53ef\u884c\u6027\u3002", "categories": ["cs.HC", "cs.AI", "cs.MM", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23825", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u89d2\u8272\u52a8\u753b", "\u865a\u62df\u73b0\u5b9e", "\u52a8\u4f5c\u6355\u6349"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.23825v1", "published_at": "2026-11-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Martial Arts Motion Skills for Animating Opponents in VR Sparring Games", "tldr": "\u901a\u8fc7\u52a8\u4f5c\u6355\u6349\u4e0e\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6b66\u672f\u52a8\u4f5c\u6280\u80fd\uff0c\u5e76\u9002\u914d\u5b9a\u5411\u653b\u51fb\u548c\u5a01\u80c1\u89c4\u907f\uff1b\u7528\u6237\u8bc4\u4f30\u4e0eVR\u5bf9\u7ec3\u539f\u578b\u9a8c\u8bc1\u4e86\u5176\u4f5c\u4e3a\u865a\u62df\u5bf9\u624b\u52a8\u753b\u57fa\u7840\u7684\u53ef\u884c\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning from terminal answer rewards enables search-augmented language models to interleave reasoning and retrieval without step-level annotations, yet outcome supervision assigns identical credit to every search in a trajectory regardless of whether it retrieved useful information. This limitation is especially severe when all sampled rollouts for a question fail, collapsing group-centered outcome advantages to zero even when trajectories gather markedly different evidence. We present Evidence-based Credit Assignment (ECA), which augments terminal outcome rewards with a training-only auxiliary signal measuring how retrieved documents improve the likelihood of a reference answer. Rather than scoring the full dialogue prefix, ECA queries a frozen snapshot of the current policy under an evidence-only prompt containing solely the question and the deduplicated documents observed so far, isolating the utility of retrieved passages from surface variations in generated thoughts or search queries. Within this framework, we compare two return formulations, ECA-Step (which accumulates step-clipped potential increments) and ECA-Horizon (which preserves the telescoping horizon gain in potential), paired with cross-fold group normalization, novelty gating, and search-local token assignment. Across seven Search QA benchmarks, ECA-Horizon improves strict macro exact match over an outcome-only GRPO baseline by 1.03 and 4.80 percentage points on Qwen2.5-3B- and 7B-Instruct, respectively, outperforming both RLOO and GiGPO. Zero-shot evaluation on MultiHop-RAG further demonstrates strong transfer to multi-hop inference queries.", "arxiv_id": "2611.23824", "arxiv_url": "https://arxiv.org/abs/2611.23824", "authors": ["Wen Wang", "Jindong Wang", "Jiahua Bao", "Tu Yongsiqi", "Yihao Liu", "Junwei He", "Wenkui Fan"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u68c0\u7d22\u8bc1\u636e\u6548\u7528\u7684\u4fe1\u7528\u5206\u914d\u65b9\u6cd5\uff0c\u4e3a\u641c\u7d22\u589e\u5f3a\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u8bad\u7ec3\u4fe1\u53f7\uff1b\u5728\u4e03\u9879\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u5c55\u73b0\u591a\u8df3\u95ee\u7b54\u8fc1\u79fb\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.23824", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u68c0\u7d22\u58
