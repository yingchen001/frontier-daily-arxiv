4\u5ea6\uff0c\u5e76\u8bbe\u8ba1\u7ec6\u7c92\u5ea6\u6307\u6807\u6765\u6355\u6349\u7f16\u8f91\u524d\u540e\u7684\u5c5e\u6027\u53d8\u5316\u3002", "why_notable": "\u97f3\u4e50\u7f16\u8f91\u751f\u6210\u6a21\u578b\u8d8a\u6765\u8d8a\u591a\uff0c\u4f46\u7f3a\u5c11\u7cfb\u7edf\u8bc4\u4f30\u201c\u8be5\u53d8\u7684\u53d8\u3001\u4e0d\u8be5\u53d8\u7684\u4e0d\u53d8\u201d\u7684\u80fd\u529b\u3002MuseCPEval \u8865\u9f50\u4e86\u8fd9\u4e00\u8bc4\u6d4b\u7a7a\u767d\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u97f3\u4e50\u7f16\u8f91\u7cfb\u7edf\u7684\u53ef\u9760\u6027\u3001\u53ef\u63a7\u6027\u548c\u5b9e\u9645\u751f\u4ea7\u53ef\u7528\u6027\u3002"}, {"abstract": "Token-level hallucination detectors score each token independently from a single signal, and fail exactly when the generating model is confidently wrong. This paper instead treats hallucination as a temporally extended span and detects it by sequence labeling: each token is scored from a 33-dimensional feature stream that fuses text statistics, Natural Language Inference (NLI) entailment, and language model surprisal, with no access to model internals. A Bidirectional Gated Recurrent Unit (BiGRU) over these features reaches an AUC of 0.840 on RAGTruth (10 seeds), an 11-point gain over an independent logistic-regression baseline (p = 0.002, Wilcoxon signed-rank). A controlled decomposition attributes most of the gain to temporal order rather than model capacity: evidence propagates from confident positions to ambiguous neighbors within a span. The same 0.845 ceiling recurs across recurrent, state-space (Mamba), and attention architectures, locating the bottleneck in the feature set rather than the model. Because it reads only the generated text and external signals, the detector works on closed-source models, and it keeps working on text produced by language models it never saw during training, losing under 4% AUC.", "arxiv_id": "2608.18115", "arxiv_url": "https://arxiv.org/abs/2608.18115", "authors": ["Igor Itkin"], "brief": "\u672c\u6587\u5c06\u5e7b\u89c9\u89c6\u4e3a\u8fde\u7eed\u6587\u672c\u7247\u6bb5\u800c\u975e\u5b64\u7acb token\uff0c\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u5e8f\u5217\u6807\u6ce8\u7684\u8bcd\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u65b9\u6cd5\u3002\u5b83\u878d\u5408\u6587\u672c\u7edf\u8ba1\u3001NLI \u8574\u542b\u4fe1\u53f7\u548c\u8bed\u8a00\u6a21\u578b surprisal \u7b4933\u7ef4\u5916\u90e8\u7279\u5f81\uff0c\u5e76\u7528 BiGRU \u5efa\u6a21\u65f6\u95f4\u4f9d\u8d56\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/YehudaItkin/temporal-hallucination-detection", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18115", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5728 RAGTruth \u4e0a BiGRU \u8fbe\u5230 0.840 AUC\uff0c\u6bd4\u72ec\u7acb\u903b\u8f91\u56de\u5f52\u57fa\u7ebf\u63d0\u5347\u7ea611\u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u7edf\u8ba1\u663e\u8457", "\u6d88\u878d\u663e\u793a\u4e3b\u8981\u6536\u76ca\u6765\u81ea\u65f6\u5e8f\u987a\u5e8f\u5efa\u6a21\uff0c\u800c\u975e\u5355\u7eaf\u6a21\u578b\u5bb9\u91cf\uff1a\u9ad8\u7f6e\u4fe1\u4f4d\u7f6e\u7684\u8bc1\u636e\u53ef\u4f20\u64ad\u5230\u540c\u4e00\u5e7b\u89c9\u7247\u6bb5\u4e2d\u7684\u6a21\u7cca\u90bb\u8fd1 token", "\u5faa\u73af\u7f51\u7edc\u3001Mamba \u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u548c\u6ce8\u610f\u529b\u67b6\u6784\u7684\u6027\u80fd\u4e0a\u9650\u5747\u7ea6\u4e3a 0.845\uff0c\u8bf4\u660e\u74f6\u9888\u4e3b\u8981\u5728\u7279\u5f81\u96c6\u800c\u975e\u67b6\u6784"], "keywords": ["\u5e7b\u89c9\u68c0\u6d4b", "\u5e8f\u5217\u6807\u6ce8", "\u81ea\u7136\u8bed\u8a00\u63a8\u7406", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18115v1", "published_at": "2026-06-30", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18115.png", "title": "Temporal Multi-Signal Fusion for Token-Level Hallucination Detection", "tldr": "\u7528\u65f6\u5e8f\u591a\u4fe1\u53f7\u878d\u5408\u68c0\u6d4b\u8bcd\u7ea7\u5e7b\u89c9", "upvotes": 2, "what_it_is": "\u672c\u6587\u5c06\u5e7b\u89c9\u89c6\u4e3a\u8fde\u7eed\u6587\u672c\u7247\u6bb5\u800c\u975e\u5b64\u7acb token\uff0c\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u5e8f\u5217\u6807\u6ce8\u7684\u8bcd\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u65b9\u6cd5\u3002\u5b83\u878d\u5408\u6587\u672c\u7edf\u8ba1\u3001NLI \u8574\u542b\u4fe1\u53f7\u548c\u8bed\u8a00\u6a21\u578b surprisal \u7b4933\u7ef4\u5916\u90e8\u7279\u5f81\uff0c\u5e76\u7528 BiGRU \u5efa\u6a21\u65f6\u95f4\u4f9d\u8d56\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u8bbf\u95ee\u751f\u6210\u6a21\u578b\u5185\u90e8\u72b6\u6001\uff0c\u53ea\u4f9d\u8d56\u751f\u6210\u6587\u672c\u548c\u5916\u90e8\u4fe1\u53f7\uff0c\u56e0\u6b64\u9002\u7528\u4e8e\u95ed\u6e90\u6a21\u578b\uff1b\u540c\u65f6\u5bf9\u672a\u89c1\u8fc7\u7684\u8bed\u8a00\u6a21\u578b\u751f\u6210\u6587\u672c\u4ecd\u80fd\u4fdd\u6301\u8f83\u597d\u6cdb\u5316\uff0cAUC \u4e0b\u964d\u4f4e\u4e8e4%\u3002"}, {"abstract": "Large vision-language models (LVLMs) have achieved remarkable progress in video understanding and reasoning. Despite extensive studies on text- and image-based jailbreaks, video jailbreaks against LVLMs remain largely unexplored. Existing video jailbreak methods mainly manipulate textual content embedded in videos, while overlooking how such information is organized over time. Our analysis reveals that jailbreak effectiveness depends not only on the semantics of textual information but also on its temporal presentation, including duration and timing-slot allocation. Motivated by this finding, we use subtitles, which are common in real-world videos and allow semantic content to be presented under precise temporal control without appearing visually intrusive, as a natural attack medium. Based on this insight, we propose TempJail, a black-box video-based jailbreak framework that constructs query-aligned dialogue-style subtitle sequences and optimizes their temporal scheduling to exploit temporal vulnerabilities in LVLMs and elicit responses that satisfy the harmful intent of the source query. Extensive experiments on four representative LVLMs and two datasets demonstrate that TempJail achieves the highest attack success rate across all evaluated model--dataset settings, outperforming the strongest baseline by 53 and 18 percentage points in dataset-averaged ASR on GPT-5 and Gemini 3.5-Flash, respectively.", "arxiv_id": "2608.19737", "arxiv_url": "https://arxiv.org/abs/2608.19737", "authors": ["Ling Zhou", "Yihao Huang", "Jingling Sun", "Zhiwen Tian", "Yi Zeng", "Qihe Liu", "Shijie Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa TempJail\uff0c\u4e00\u79cd\u9ed1\u76d2\u89c6\u9891\u8d8a\u72f1\u6846\u67b6\uff0c\u901a\u8fc7\u6784\u9020\u4e0e\u6076\u610f\u67e5\u8be2\u5bf9\u9f50\u7684\u5bf9\u8bdd\u5f0f\u5b57\u5e55\uff0c\u5e76\u4f18\u5316\u5b57\u5e55\u51fa\u73b0\u65f6\u957f\u4e0e\u65f6\u95f4\u69fd\u5206\u914d\u6765\u653b\u51fb\u5927\u578b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u89c6\u9891\u4e2d\u6587\u5b57\u4fe1\u606f\u7684\u65f6\u95f4\u5448\u73b0\u65b9\u5f0f\u4f1a\u663e\u8457\u5f71\u54cd LVLM \u7684\u5b89\u5168\u9632\u62a4\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19737", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u5b57\u5e55\u4f5c\u4e3a\u81ea\u7136\u4e14\u4e0d\u663e\u773c\u7684\u653b\u51fb\u8f7d\u4f53\uff0c\u7cbe\u786e\u63a7\u5236\u6709\u5bb3\u8bed\u4e49\u5728\u89c6\u9891\u4e2d\u7684\u65f6\u95f4\u5206\u5e03", "\u901a\u8fc7\u67e5\u8be2\u5bf9\u9f50\u7684\u5bf9\u8bdd\u5f0f\u5b57\u5e55\u5e8f\u5217\u4e0e\u65f6\u5e8f\u8c03\u5ea6\u4f18\u5316\uff0c\u5229\u7528 LVLM \u7684\u65f6\u95f4\u7406\u89e3\u6f0f\u6d1e", "\u57284\u4e2a\u4ee3\u8868\u6027 LVLM \u548c2\u4e2a\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6700\u9ad8\u653b\u51fb\u6210\u529f\u7387\uff0c\u5bf9 GPT-5 \u548c Gemini 3.5-Flash \u5206\u522b\u8f83\u6700\u5f3a\u57fa\u7ebf\u5e73\u5747\u63d0\u534753\u548c18\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19737v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TempJail: Temporal Jailbreak Attack against Large Vision-Language Models via Subtitle Scheduling", "tldr": "\u5229\u7528\u5b57\u5e55\u65f6\u5e8f\u4f18\u5316\u5b9e\u73b0\u89c6\u9891\u8d8a\u72f1\u653b\u51fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TempJail\uff0c\u4e00\u79cd\u9ed1\u76d2\u89c6\u9891\u8d8a\u72f1\u6846\u67b6\uff0c\u901a\u8fc7\u6784\u9020\u4e0e\u6076\u610f\u67e5\u8be2\u5bf9\u9f50\u7684\u5bf9\u8bdd\u5f0f\u5b57\u5e55\uff0c\u5e76\u4f18\u5316\u5b57\u5e55\u51fa\u73b0\u65f6\u957f\u4e0e\u65f6\u95f4\u69fd\u5206\u914d\u6765\u653b\u51fb\u5927\u578b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u89c6\u9891\u4e2d\u6587\u5b57\u4fe1\u606f\u7684\u65f6\u95f4\u5448\u73b0\u65b9\u5f0f\u4f1a\u663e\u8457\u5f71\u54cd LVLM \u7684\u5b89\u5168\u9632\u62a4\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u9891\u8d8a\u72f1\u7814\u7a76\u4ece\u201c\u6587\u672c\u5185\u5bb9\u662f\u4ec0\u4e48\u201d\u6269\u5c55\u5230\u201c\u5185\u5bb9\u4f55\u65f6\u3001\u6301\u7eed\u591a\u4e45\u51fa\u73b0\u201d\uff0c\u63ed\u793a\u4e86 LVLM \u5728\u65f6\u5e8f\u4fe1\u606f\u5904\u7406\u4e2d\u7684\u65b0\u578b\u5b89\u5168\u8106\u5f31\u6027\uff0c\u5bf9\u89c6\u9891\u5b89\u5168\u8bc4\u6d4b\u4e0e\u9632\u5fa1\u8bbe\u8ba1\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "As LLM-based agents are deployed for longer and higher-stakes tasks, their memory systems continue to have crucial gaps. While existing memory benchmarks focus largely on recall-shaped tasks, we argue an effective memory system must track the evolving state of the world; as facts, constraints, and decisions are revised over a long interaction, answers must reflect the current state and not a superseded one. We define this capability as state tracking and instantiate it in StateMemBench, a benchmark of 234 multi-session scenarios spanning two conversation-length regimes. Its closed-pool grading scores whether an answer reflects the current state, the superseded state, or fails otherwise, separating state-tracking failures from other errors by construction. Our analysis shows that this task is challenging for existing memory systems, retrieval-augmented baselines, and long-context baselines. We then present StateMem, a state-first memory method that explicitly tracks supersession and relational dependencies, and show it improves current-state accuracy over the strongest same-backbone baseline by 1.8x (0.205 -\u003e 0.363) on DeepSeek-V4-Flash and over the strongest memory system by 1.6x (0.149 -\u003e 0.233) on Qwen-3.5-9B, while remaining competitive with the long-context baselines. Finally, we show the same state approach can be applied as a lightweight single-call wrapper over existing memory systems, lifting current-state accuracy by +32 to +67 points on StateMemBench across six memory and retrieval backends. A length- and cost-matched control attributes +15 to +32 of those points to state structure rather than added context.", "arxiv_id": "2608.19652", "arxiv_url": "https://arxiv.org/abs/2608.19652", "authors": ["Xinyi Fan", "Miri Liu", "Ruozhen Yang", "Siru Ouyang", "Jiawei Han"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u72b6\u6001\u8ddf\u8e2a\u201d\u4f5c\u4e3a\u957f\u7a0b\u4ea4\u4e92\u4e2d\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u7684\u6838\u5fc3\u80fd\u529b\uff1a\u4e0d\u4ec5\u8981\u56de\u5fc6\u4fe1\u606f\uff0c\u8fd8\u8981\u8bc6\u522b\u4e8b\u5b9e\u3001\u7ea6\u675f\u548c\u51b3\u7b56\u7684\u66f4\u65b0\u5173\u7cfb\u3002\u4f5c\u8005\u6784\u5efa StateMemBench \u57fa\u51c6\uff0c\u5e76\u63d0\u51fa StateMem \u65b9\u6cd5\u663e\u5f0f\u8ffd\u8e2a\u53d6\u4ee3\u5173\u7cfb\u4e0e\u4f9d\u8d56\u5173\u7cfb\uff0c\u4ee5\u63d0\u5347\u5f53\u524d\u72b6\u6001\u56de\u7b54\u51c6\u786e\u7387\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19652", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["StateMemBench \u5305\u542b 234 \u4e2a\u591a\u4f1a\u8bdd\u573a\u666f\uff0c\u8986\u76d6\u4e0d\u540c\u5bf9\u8bdd\u957f\u5ea6\uff0c\u5e76\u533a\u5206\u5f53\u524d\u72b6\u6001\u3001\u8fc7\u65f6\u72b6\u6001\u548c\u5176\u4ed6\u9519\u8bef\u3002", "\u73b0\u6709\u8bb0\u5fc6\u7cfb\u7edf\u3001\u68c0\u7d22\u589e\u5f3a\u65b9\u6cd5\u548c\u957f\u4e0a\u4e0b\u6587\u57fa\u7ebf\u5728\u8be5\u4efb\u52a1\u4e0a\u8868\u73b0\u5747\u4e0d\u7406\u60f3\uff0c\u8bf4\u660e\u5355\u7eaf\u53ec\u56de\u4e0d\u8db3\u4ee5\u652f\u6491\u72b6\u6001\u66f4\u65b0\u3002", "StateMem \u5728 DeepSeek-V4-Flash \u4e0a\u76f8\u8f83\u6700\u5f3a\u540c\u9aa8\u5e72\u57fa\u7ebf\u5f53\u524d\u72b6\u6001\u51c6\u786e\u7387\u63d0\u5347 1.8 \u500d\uff0c\u5728 Qwen-3.5-9B \u4e0a\u76f8\u8f83\u6700\u5f3a\u8bb0\u5fc6\u7cfb\u7edf\u63d0\u5347 1.6 \u500d\uff1b\u4f5c\u4e3a\u8f7b\u91cf\u5305\u88c5\u5668\u4e5f\u80fd\u4e3a\u591a\u79cd\u540e\u7aef\u5e26\u6765 +32 \u5230 +67 \u5206\u63d0\u5347\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7cfb\u7edf", "\u72b6\u6001\u8ddf\u8e2a", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19652v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Can Agent Memory Systems Track Evolving State?", "tldr": "\u8bc4\u6d4b\u5e76\u6539\u8fdb\u667a\u80fd\u4f53\u8bb0\u5fc6\u7684\u72b6\u6001\u8ddf\u8e2a\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u72b6\u6001\u8ddf\u8e2a\u201d\u4f5c\u4e3a\u957f\u7a0b\u4ea4\u4e92\u4e2d\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u7684\u6838\u5fc3\u80fd\u529b\uff1a\u4e0d\u4ec5\u8981\u56de\u5fc6\u4fe1\u606f\uff0c\u8fd8\u8981\u8bc6\u522b\u4e8b\u5b9e\u3001\u7ea6\u675f\u548c\u51b3\u7b56\u7684\u66f4\u65b0\u5173\u7cfb\u3002\u4f5c\u8005\u6784\u5efa StateMemBench \u57fa\u51c6\uff0c\u5e76\u63d0\u51fa StateMem \u65b9\u6cd5\u663e\u5f0f\u8ffd\u8e2a\u53d6\u4ee3\u5173\u7cfb\u4e0e\u4f9d\u8d56\u5173\u7cfb\uff0c\u4ee5\u63d0\u5347\u5f53\u524d\u72b6\u6001\u56de\u7b54\u51c6\u786e\u7387\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c06\u667a\u80fd\u4f53\u8bb0\u5fc6\u8bc4\u6d4b\u4ece\u201c\u80fd\u5426\u8bb0\u4f4f\u201d\u63a8\u8fdb\u5230\u201c\u80fd\u5426\u7ef4\u62a4\u6700\u65b0\u4e16\u754c\u72b6\u6001\u201d\uff0c\u66f4\u8d34\u8fd1\u957f\u4efb\u52a1\u548c\u9ad8\u98ce\u9669\u90e8\u7f72\u4e2d\u7684\u771f\u5b9e\u9700\u6c42\uff1b\u5176\u57fa\u51c6\u548c\u65b9\u6cd5\u5bf9\u6784\u5efa\u53ef\u9760 LLM Agent \u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Prefix caching avoids prefill only when a repeated request returns to a server that still holds the prefix KV. Cache-blind balancing disperses that reuse; fixed affinity preserves it but can overload a server. CacheRoute resolves this tradeoff with a periodic routing plan. It admits high-rate keys to a stable warm set and places their assignments by expected load. Hot keys may use more than one destination, although every key in our primary semi-synthetic aggregate uses exactly one. On Llama-3.3-70B in fp8 across 60 H100 GPUs, CacheRoute sustains 176+/-11 QPS at a 3.5-s p99 SLO, 2.3x the strongest of five baselines. Served KV-cache hit rate rises from 64.1+/-1.3% under cache-blind balancing to 93.2+/-0.5%. A second semi-synthetic aggregate and controlled 8B and burst experiments separate the effects of affinity and placement. Two 32B workloads provide the counterexamples: when affinity recovers too little KV work, its residual load skew reduces or erases the improvement. We therefore recommend gating any deployment with a shadow replay rather than enabling affinity from workload statistics alone.", "arxiv_id": "2608.19677", "arxiv_url": "https://arxiv.org/abs/2608.19677", "authors": ["Huang Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa CacheRoute\uff0c\u4e00\u79cd\u9762\u5411\u5927\u89c4\u6a21 LLM \u670d\u52a1\u7684\u5468\u671f\u6027\u8def\u7531\u89c4\u5212\u65b9\u6cd5\uff0c\u5728\u524d\u7f00\u7f13\u5b58\u590d\u7528\u4e0e\u8d1f\u8f7d\u5747\u8861\u4e4b\u95f4\u505a\u6743\u8861\u3002\u5b83\u5c06\u9ad8\u9891\u524d\u7f00\u7eb3\u5165\u7a33\u5b9a warm set\uff0c\u5e76\u6309\u9884\u671f\u8d1f\u8f7d\u5206\u914d\u5230\u670d\u52a1\u5668\uff0c\u4ee5\u63d0\u9ad8 KV-cache \u547d\u4e2d\u7387\u548c\u541e\u5410\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19677", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728 60 \u5f20 H100 \u4e0a\u670d\u52a1 Llama-3.3-70B fp8 \u65f6\uff0cCacheRoute \u5728 3.5 \u79d2 p99 SLO \u4e0b\u8fbe\u5230 176\u00b111 QPS\uff0c\u662f\u6700\u5f3a\u57fa\u7ebf\u7684 2.3 \u500d", "\u76f8\u6bd4 cache-blind \u8d1f\u8f7d\u5747\u8861\uff0cKV-cache \u547d\u4e2d\u7387\u4ece 64.1\u00b11.3% \u63d0\u5347\u5230 93.2\u00b10.5%", "\u5b9e\u9a8c\u663e\u793a\u4eb2\u548c\u8def\u7531\u5e76\u975e\u603b\u662f\u6709\u6548\uff1a\u5728\u90e8\u5206 32B \u5de5\u4f5c\u8d1f\u8f7d\u4e2d\uff0c\u82e5\u53ef\u6062\u590d\u7684 KV \u8ba1\u7b97\u8f83\u5c11\uff0c\u6b8b\u4f59\u8d1f\u8f7d\u503e\u659c\u4f1a\u62b5\u6d88\u6536\u76ca"], "keywords": ["\u5927\u6a21\u578b\u670d\u52a1", "KV\u7f13\u5b58", "\u8d1f\u8f7d\u5747\u8861", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19677v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CacheRoute: Planned Prefix-Affinity Routing for Large-Scale LLM Serving", "tldr": "\u7528\u89c4\u5212\u5f0f\u4eb2\u548c\u8def\u7531\u63d0\u5347LLM\u524d\u7f00\u7f13\u5b58\u547d\u4e2d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CacheRoute\uff0c\u4e00\u79cd\u9762\u5411\u5927\u89c4\u6a21 LLM \u670d\u52a1\u7684\u5468\u671f\u6027\u8def\u7531\u89c4\u5212\u65b9\u6cd5\uff0c\u5728\u524d\u7f00\u7f13\u5b58\u590d\u7528\u4e0e\u8d1f\u8f7d\u5747\u8861\u4e4b\u95f4\u505a\u6743\u8861\u3002\u5b83\u5c06\u9ad8\u9891\u524d\u7f00\u7eb3\u5165\u7a33\u5b9a warm set\uff0c\u5e76\u6309\u9884\u671f\u8d1f\u8f7d\u5206\u914d\u5230\u670d\u52a1\u5668\uff0c\u4ee5\u63d0\u9ad8 KV-cache \u547d\u4e2d\u7387\u548c\u541e\u5410\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u51fb LLM \u5728\u7ebf\u63a8\u7406\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u524d\u7f00\u7f13\u5b58\u53ea\u6709\u5728\u8bf7\u6c42\u56de\u5230\u6301\u6709 KV \u7684\u670d\u52a1\u5668\u65f6\u624d\u6709\u6548\u3002CacheRoute \u901a\u8fc7\u53ef\u8ba1\u5212\u7684\u4eb2\u548c\u8def\u7531\u663e\u8457\u63d0\u5347\u7f13\u5b58\u590d\u7528\u548c\u541e\u5410\uff0c\u540c\u65f6\u4e5f\u7ed9\u51fa\u90e8\u7f72\u8fb9\u754c\uff0c\u5efa\u8bae\u7528 shadow replay \u9a8c\u8bc1\u800c\u975e\u4ec5\u51ed\u7edf\u8ba1\u542f\u7528\u3002"}, {"abstract": "Naturalistic computer-use traces, passively recorded screenshots and mouse or keyboard actions, are a valuable resource for deriving symbolic, auditable, and reusable models of how everyday work is done. Such models matter as computer-use agents enter real work, where agents need to learn how tasks are actually performed, and organizations need to audit and reuse that knowledge. However, inducing such task models is challenging, as activity is observed only as low-level events and real-world work is multi-threaded with interleaved goals. Existing methods assume a given task or a single workflow, and produce step-level summaries rather than structured task models. We introduce Task Model Induction (TMI), which (i) discovers the latent tasks in an unconstrained trace, disentangling concurrent activity, and (ii) for each latent task, induces a task model pairing a hierarchical objective model of recursive goal decomposition with a procedure model of the control flow that organized the execution. Intrinsically, on controlled human and agent trajectories, TMI recovers interleaved tasks with 0.974 agreement against ground-truth groupings and reconstructs 74.9% of the observed execution steps, far more than the strongest workflow induction baseline. Extrinsically, skills derived from TMI\u0027s task models improve held-out task accuracy by 30.0% over the strongest baseline.", "arxiv_id": "2608.20319", "arxiv_url": "https://arxiv.org/abs/2608.20319", "authors": ["Yucheng Jiang", "Zora Zhiruo Wang", "Ruishi Chen", "Diyi Yang"], "brief": "\u8bba\u6587\u63d0\u51fa Task Model Induction\uff08TMI\uff09\uff0c\u4ece\u81ea\u7136\u8bb0\u5f55\u7684\u622a\u56fe\u3001\u9f20\u6807\u548c\u952e\u76d8\u4e8b\u4ef6\u4e2d\u53d1\u73b0\u6f5c\u5728\u4efb\u52a1\uff0c\u5e76 disentangle \u591a\u7ebf\u7a0b\u4ea4\u9519\u6d3b\u52a8\u3002\u5b83\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u5f52\u7eb3\u5c42\u7ea7\u76ee\u6807\u6a21\u578b\u4e0e\u8fc7\u7a0b\u63a7\u5236\u6d41\u6a21\u578b\uff0c\u7528\u4e8e\u5ba1\u8ba1\u3001\u590d\u7528\u548c\u8bad\u7ec3\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20319", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u80fd\u591f\u5728\u65e0\u9884\u8bbe\u4efb\u52a1\u3001\u65e0\u5355\u4e00\u5de5\u4f5c\u6d41\u5047\u8bbe\u7684\u771f\u5b9e\u8f68\u8ff9\u4e2d\u53d1\u73b0\u6f5c\u5728\u4efb\u52a1\uff0c\u5e76\u5206\u79bb\u5e76\u53d1\u4ea4\u9519\u76ee\u6807", "\u4efb\u52a1\u6a21\u578b\u540c\u65f6\u5305\u542b\u9012\u5f52\u76ee\u6807\u5206\u89e3\u7684\u5c42\u7ea7\u76ee\u6807\u6a21\u578b\uff0c\u4ee5\u53ca\u63cf\u8ff0\u6267\u884c\u7ec4\u7ec7\u65b9\u5f0f\u7684\u8fc7\u7a0b\u63a7\u5236\u6d41\u6a21\u578b", "\u5728\u53d7\u63a7\u4eba\u7c7b\u4e0e\u667a\u80fd\u4f53\u8f68\u8ff9\u4e0a\uff0c\u4efb\u52a1\u5206\u7ec4\u4e0e\u771f\u503c\u4e00\u81f4\u6027\u8fbe 0.974\uff0c\u53ef\u91cd\u5efa 74.9% \u6267\u884c\u6b65\u9aa4\uff1b\u7531\u6a21\u578b\u6d3e\u751f\u7684\u6280\u80fd\u4f7f\u7559\u51fa\u4efb\u52a1\u51c6\u786e\u7387\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 30.0%"], "keywords": ["\u667a\u80fd\u4f53", "\u7535\u8111\u4f7f\u7528", "\u4efb\u52a1\u5efa\u6a21", "\u5de5\u4f5c\u6d41\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20319v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Inducing Task Models from Computer-Use Traces", "tldr": "\u4ece\u7535\u8111\u4f7f\u7528\u8f68\u8ff9\u81ea\u52a8\u5f52\u7eb3\u53ef\u590d\u7528\u4efb\u52a1\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Task Model Induction\uff08TMI\uff09\uff0c\u4ece\u81ea\u7136\u8bb0\u5f55\u7684\u622a\u56fe\u3001\u9f20\u6807\u548c\u952e\u76d8\u4e8b\u4ef6\u4e2d\u53d1\u73b0\u6f5c\u5728\u4efb\u52a1\uff0c\u5e76 disentangle \u591a\u7ebf\u7a0b\u4ea4\u9519\u6d3b\u52a8\u3002\u5b83\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u5f52\u7eb3\u5c42\u7ea7\u76ee\u6807\u6a21\u578b\u4e0e\u8fc7\u7a0b\u63a7\u5236\u6d41\u6a21\u578b\uff0c\u7528\u4e8e\u5ba1\u8ba1\u3001\u590d\u7528\u548c\u8bad\u7ec3\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u4f4e\u5c42\u7535\u8111\u64cd\u4f5c\u65e5\u5fd7\u8f6c\u5316\u4e3a\u7ed3\u6784\u5316\u3001\u53ef\u5ba1\u8ba1\u3001\u53ef\u590d\u7528\u7684\u4efb\u52a1\u77e5\u8bc6\uff0c\u76f4\u63a5\u670d\u52a1\u4e8e computer-use \u667a\u80fd\u4f53\u5728\u771f\u5b9e\u529e\u516c\u573a\u666f\u4e2d\u7684\u5b66\u4e60\u4e0e\u6cbb\u7406\uff0c\u6bd4\u4f20\u7edf\u5de5\u4f5c\u6d41\u5f52\u7eb3\u66f4\u9002\u5408\u590d\u6742\u4ea4\u9519\u4efb\u52a1\u3002"}, {"abstract": "Whether a language model has improved itself is increasingly judged not by mean accuracy but by which individual problems it gains and loses. Tracking these transitions means differencing two noisy estimates, leaving them vulnerable to measurement artifacts. Auditing three rounds of rank-$32$ LoRA self-training on Qwen3-8B against a frozen control pushed through the identical pipeline, we identify seven measurement failures, each of which inverts a reported finding when its control is absent. Several are standard practice. A ledger built on a single greedy decode manufactures capability changes on an untrained model, largely an artifact of inference batching; the expansion statistic separating acquisition from sharpening assigns that same model a rate of $0.280$. The natural threshold repair does not survive replication: estimated across the frozen comparisons such a design already contains, its null stays non-zero. We replace it with a per-problem exact test against a pooled baseline under false-discovery-rate control, which detects nothing on any held-out replicate and is unchanged under the multiple-testing rule, error rate and pool size. Applied to a ladder of arms matched in stream, volume and evaluation, the audit finds that external distillation improves problems the base model rarely reaches while three forms of self-training do not; a regression rejects this asymmetry as a by-product of distillation\u0027s larger overall gain ($p \u003c 10^{-8}$). On the far smaller set of problems the base model never reaches, the evidence is inconclusive, while self-training corrupts problems solved at baseline at rates well above the measured floor. Transition-level auditing therefore requires a separately measured null for every statistic it reports: nulls that cost no new experiments, built from baseline replicates a multi-arm study already owns, though not from as few as most possess.", "arxiv_id": "2608.20290", "arxiv_url": "https://arxiv.org/abs/2608.20290", "authors": ["Cheng Xu", "Nan Yan", "Liming Chen", "M-Tahar Kechadi"], "brief": "\u8bba\u6587\u5ba1\u8ba1\u4e86Qwen3-8B\u8fdb\u884c\u4e09\u8f6erank-32 LoRA\u81ea\u8bad\u7ec3\u540e\u7684\u9010\u9898\u201c\u589e\u76ca/\u635f\u5931\u201d\u8bc4\u4f30\uff0c\u5e76\u4e0e\u7ecf\u8fc7\u76f8\u540c\u6d41\u7a0b\u7684\u51bb\u7ed3\u5bf9\u7167\u6a21\u578b\u6bd4\u8f83\u3002\u4f5c\u8005\u53d1\u73b0\u591a\u79cd\u5e38\u89c1\u8bc4\u4f30\u505a\u6cd5\u4f1a\u5236\u9020\u865a\u5047\u7684\u80fd\u529b\u53d8\u5316\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u57fa\u7ebf\u91cd\u590d\u5b9e\u9a8c\u7684\u9010\u9898\u7cbe\u786e\u68c0\u9a8c\u4e0eFDR\u63a7\u5236\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20290", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bc6\u522b\u51fa7\u7c7b\u6d4b\u91cf\u5931\u8d25\uff1a\u5355\u6b21\u8d2a\u5fc3\u89e3\u7801\u3001\u6279\u5904\u7406\u63a8\u7406\u4f2a\u5f71\u3001\u9608\u503c\u4fee\u590d\u7b49\u90fd\u4f1a\u5728\u672a\u8bad\u7ec3\u6a21\u578b\u4e0a\u5236\u9020\u201c\u80fd\u529b\u53d8\u5316\u201d\u3002", "\u63d0\u51fa\u7528\u51bb\u7ed3\u57fa\u7ebf\u91cd\u590d\u6837\u672c\u6784\u5efa\u6bcf\u4e2a\u7edf\u8ba1\u91cf\u7684\u5b9e\u6d4b\u96f6\u5047\u8bbe\uff0c\u5e76\u91c7\u7528\u9010\u9898\u7cbe\u786e\u68c0\u9a8c\u4e0e\u5047\u53d1\u73b0\u7387\u63a7\u5236\uff1b\u5728 held-out \u590d\u73b0\u5b9e\u9a8c\u4e2d\u672a\u68c0\u6d4b\u5230\u663e\u8457\u81ea\u8bad\u7ec3\u6536\u76ca\u3002", "\u591a\u81c2\u5bf9\u7167\u663e\u793a\u5916\u90e8\u84b8\u998f\u80fd\u6539\u5584\u57fa\u5ea7\u6a21\u578b\u8f83\u5c11\u89e6\u8fbe\u7684\u95ee\u9898\uff0c\u800c\u4e09\u79cd\u81ea\u8bad\u7ec3\u672a\u8868\u73b0\u51fa\u540c\u7c7b\u6536\u76ca\uff0c\u5e76\u4e14\u4f1a\u4ee5\u9ad8\u4e8e\u6d4b\u91cf\u5e95\u566a\u7684\u6bd4\u4f8b\u7834\u574f\u57fa\u7ebf\u5df2\u89e3\u51b3\u95ee\u9898\u3002"], "keywords": ["\u81ea\u6211\u6539\u8fdb", "\u6a21\u578b\u8bc4\u4f30", "\u81ea\u8bad\u7ec3", "\u7edf\u8ba1\u68c0\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20290v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Phantom Gains: Auditing Self-Improvement Against a Measured Null", "tldr": "\u7528\u5b9e\u6d4b\u96f6\u5047\u8bbe\u5ba1\u8ba1LLM\u81ea\u8bad\u7ec3\u7684\u865a\u5047\u589e\u76ca", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5ba1\u8ba1\u4e86Qwen3-8B\u8fdb\u884c\u4e09\u8f6erank-32 LoRA\u81ea\u8bad\u7ec3\u540e\u7684\u9010\u9898\u201c\u589e\u76ca/\u635f\u5931\u201d\u8bc4\u4f30\uff0c\u5e76\u4e0e\u7ecf\u8fc7\u76f8\u540c\u6d41\u7a0b\u7684\u51bb\u7ed3\u5bf9\u7167\u6a21\u578b\u6bd4\u8f83\u3002\u4f5c\u8005\u53d1\u73b0\u591a\u79cd\u5e38\u89c1\u8bc4\u4f30\u505a\u6cd5\u4f1a\u5236\u9020\u865a\u5047\u7684\u80fd\u529b\u53d8\u5316\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u57fa\u7ebf\u91cd\u590d\u5b9e\u9a8c\u7684\u9010\u9898\u7cbe\u786e\u68c0\u9a8c\u4e0eFDR\u63a7\u5236\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192LLM\u81ea\u6211\u6539\u8fdb\u8bc4\u4f30\u4e2d\u9010\u9898\u8f6c\u79fb\u6307\u6807\u6781\u6613\u53d7\u566a\u58f0\u548c\u6d41\u7a0b\u4f2a\u5f71\u5f71\u54cd\uff0c\u4e3b\u5f20\u5fc5\u987b\u4e3a\u6bcf\u4e2a\u62a5\u544a\u7edf\u8ba1\u91cf\u914d\u5957\u5b9e\u6d4b\u96f6\u5047\u8bbe\uff1b\u8fd9\u5bf9\u81ea\u8bad\u7ec3\u3001\u84b8\u998f\u548c\u80fd\u529b\u8dc3\u8fc1\u7c7b\u7ed3\u8bba\u7684\u53ef\u4fe1\u5ea6\u8bc4\u4f30\u5177\u6709\u91cd\u8981\u65b9\u6cd5\u5b66\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) have shown growing potential for automated theoretical computer science (TCS) research, yet existing benchmarks remain far from realistic research settings. We introduce \\ourbenchmark, an expert-validated benchmark for evaluating LLMs on frontier, end-to-end TCS research. \\ourbenchmark contains $175$ instances drawn from papers accepted to STOC, FOCS, SODA, and COLT in 2025-2026, preserving paper-specific definitions, assumptions, and proof dependencies, with expert-verified Lean formalizations and proofs. Evaluations of leading LLMs reveal that current models remain far from reliably completing the full research pipeline. In particular, autoformalization is the sharpest bottleneck: the best model achieves only $11.5$ on translating natural-language claims into formal theorem statements, compared with $28.6$ Pass@8 when proving human-provided formal statements. Building on \\ourbenchmark, we further develop an automated TCS research framework that generates, formalizes, filters, and proves new claims. Of $64$ generated claims, only $6$ ultimately pass expert evaluation and proof verification, indicating that beyond formalization, limited research taste remains another major barrier to autonomous TCS research.", "arxiv_id": "2608.20153", "arxiv_url": "https://arxiv.org/abs/2608.20153", "authors": ["Dingzirui Wang", "Xuanliang Zhang", "Keyan Xu", "Qingfu Zhu", "Wanxiang Che"], "brief": "\u8bba\u6587\u63d0\u51fa FormalTCS\uff0c\u4e00\u4e2a\u4e13\u5bb6\u9a8c\u8bc1\u7684\u7aef\u5230\u7aef\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66\u7814\u7a76\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea 2025-2026 \u5e74 STOC\u3001FOCS\u3001SODA\u3001COLT \u8bba\u6587\u7684 175 \u4e2a\u5b9e\u4f8b\uff0c\u5e76\u914d\u6709 Lean \u5f62\u5f0f\u5316\u4e0e\u8bc1\u660e\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u81ea\u52a8\u5316 TCS \u7814\u7a76\u6d41\u7a0b\uff0c\u7528\u4e8e\u751f\u6210\u3001\u5f62\u5f0f\u5316\u3001\u7b5b\u9009\u548c\u8bc1\u660e\u65b0\u547d\u9898\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20153", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u57fa\u51c6\u4fdd\u7559\u8bba\u6587\u4e2d\u7684\u4e13\u6709\u5b9a\u4e49\u3001\u5047\u8bbe\u4e0e\u8bc1\u660e\u4f9d\u8d56\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u524d\u6cbf TCS \u7814\u7a76\u573a\u666f", "\u5f53\u524d\u9886\u5148 LLM \u5728\u5b8c\u6574\u7814\u7a76\u6d41\u6c34\u7ebf\u4e0a\u8868\u73b0\u4ecd\u5f31\uff0c\u81ea\u52a8\u5f62\u5f0f\u5316\u662f\u6700\u5927\u74f6\u9888\uff1a\u6700\u4f73\u6a21\u578b\u81ea\u7136\u8bed\u8a00\u5230\u5f62\u5f0f\u5b9a\u7406\u4ec5\u5f97 11.5", "\u81ea\u52a8\u751f\u6210\u7684 64 \u4e2a\u65b0\u547d\u9898\u4e2d\uff0c\u4ec5 6 \u4e2a\u901a\u8fc7\u4e13\u5bb6\u8bc4\u4f30\u548c\u8bc1\u660e\u9a8c\u8bc1\uff0c\u663e\u793a\u6a21\u578b\u7f3a\u4e4f\u7a33\u5b9a\u7814\u7a76\u54c1\u5473"], "keywords": ["\u5f62\u5f0f\u5316\u8bc1\u660e", "\u81ea\u52a8\u5316\u79d1\u7814", "\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20153v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FormalTCS: Benchmarking End-to-End Frontier Formal Theoretical Computer Science Research of Large Language Models", "tldr": "\u9762\u5411\u524d\u6cbfTCS\u7814\u7a76\u7684LLM\u7aef\u5230\u7aef\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FormalTCS\uff0c\u4e00\u4e2a\u4e13\u5bb6\u9a8c\u8bc1\u7684\u7aef\u5230\u7aef\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66\u7814\u7a76\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea 2025-2026 \u5e74 STOC\u3001FOCS\u3001SODA\u3001COLT \u8bba\u6587\u7684 175 \u4e2a\u5b9e\u4f8b\uff0c\u5e76\u914d\u6709 Lean \u5f62\u5f0f\u5316\u4e0e\u8bc1\u660e\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u81ea\u52a8\u5316 TCS \u7814\u7a76\u6d41\u7a0b\uff0c\u7528\u4e8e\u751f\u6210\u3001\u5f62\u5f0f\u5316\u3001\u7b5b\u9009\u548c\u8bc1\u660e\u65b0\u547d\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a LLM \u8bc4\u6d4b\u4ece\u5355\u9898\u8bc1\u660e\u63a8\u8fdb\u5230\u771f\u5b9e\u524d\u6cbf\u7406\u8bba\u7814\u7a76\u6d41\u7a0b\uff0c\u63ed\u793a\u81ea\u52a8\u5f62\u5f0f\u5316\u4e0e\u547d\u9898\u8d28\u91cf\u5224\u65ad\u4ecd\u662f\u81ea\u52a8\u5316\u79d1\u7814\u7684\u6838\u5fc3\u969c\u788d\uff0c\u5bf9\u8bc4\u4f30 AI \u6570\u5b66/\u7406\u8bba\u7814\u7a76\u80fd\u529b\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Software increasingly functions as part of the scientific instrument itself, making failures in scientific code capable of compromising not only program behavior but also the evidence underlying scientific conclusions. Yet existing evaluations of coding agents largely emphasize aggregate task success, providing limited insight into why agents fail when repairing scientific software. We introduce \\textbf{SWE-bench Science}, a repository-level benchmark for scientific software engineering comprising 119 tasks from 98 GitHub repositories across 20 scientific domains. Each task is organized into one of three paradigms: Issue-driven, Expert-exploratory, and Engineering-integration. Even the best-performing agent, \\textbf{Claude Code with Opus-5 (max), achieves a pass@1 below 50\\%}, highlighting the substantial challenges posed by scientific software engineering. We identify four recurring failure mechanisms: deficits in scientific knowledge or abstraction, misguided exploration or surface-level repair, incomplete repair coverage or system integration, and failures to generalize scientific knowledge beyond observed cases in our analysis. We further conduct a paired ablation that removes explicit scientific guidance while preserving the repository and executable engineering context. The results show that scientific knowledge is not uniformly beneficial: well-grounded information can constrain repair and improve average performance and token efficiency, whereas poorly aligned guidance can induce anchoring and does not necessarily improve exact repair success. Together, SWE-bench Science provides a broad testbed for studying both the capabilities and failure mechanisms of coding agents in scientific software engineering.", "arxiv_id": "2608.19799", "arxiv_url": "https://arxiv.org/abs/2608.19799", "authors": ["Zhipeng Xu", "Jiahao Lu", "Yining Zheng", "Yuxin Wang", "Xipeng Qiu"], "brief": "\u672c\u6587\u63d0\u51fa SWE-bench Science\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u8f6f\u4ef6\u5de5\u7a0b\u7684\u4ed3\u5e93\u7ea7\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea98\u4e2a GitHub \u4ed3\u5e93\u300120\u4e2a\u79d1\u5b66\u9886\u57df\u7684119\u4e2a\u4efb\u52a1\u3002\u5b83\u7cfb\u7edf\u5206\u6790\u4e86\u7f16\u7801\u667a\u80fd\u4f53\u5728\u4fee\u590d\u79d1\u5b66\u4ee3\u7801\u65f6\u7684\u8868\u73b0\u3001\u5931\u8d25\u673a\u5236\u4ee5\u53ca\u79d1\u5b66\u6307\u5bfc\u4fe1\u606f\u7684\u4f5c\u7528\u3002", "categories": ["cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19799", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4efb\u52a1\u5206\u4e3a Issue-driven\u3001Expert-exploratory \u548c Engineering-integration \u4e09\u7c7b\uff0c\u8986\u76d6\u771f\u5b9e\u79d1\u5b66\u8f6f\u4ef6\u4e2d\u7684\u7f3a\u9677\u4fee\u590d\u4e0e\u5de5\u7a0b\u96c6\u6210\u573a\u666f\u3002", "\u6700\u4f73\u667a\u80fd\u4f53 Claude Code with Opus-5 (max) \u7684 pass@1 \u4ecd\u4f4e\u4e8e50%\uff0c\u8bf4\u660e\u79d1\u5b66\u8f6f\u4ef6\u5de5\u7a0b\u5bf9\u5f53\u524d\u7f16\u7801\u667a\u80fd\u4f53\u4ecd\u5177\u663e\u8457\u6311\u6218\u3002", "\u8bba\u6587\u5f52\u7eb3\u51fa\u56db\u7c7b\u4e3b\u8981\u5931\u8d25\u673a\u5236\uff1a\u79d1\u5b66\u77e5\u8bc6\u6216\u62bd\u8c61\u4e0d\u8db3\u3001\u63a2\u7d22\u8bef\u5bfc\u6216\u8868\u5c42\u4fee\u590d\u3001\u4fee\u590d\u8986\u76d6\u4e0e\u7cfb\u7edf\u96c6\u6210\u4e0d\u5b8c\u6574\u3001\u65e0\u6cd5\u5c06\u79d1\u5b66\u77e5\u8bc6\u6cdb\u5316\u5230\u672a\u89c1\u6848\u4f8b\u3002"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u79d1\u5b66\u8ba1\u7b97", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19799v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SWE-bench Science: Can Coding Agents Resolve Engineering Tasks in Science?", "tldr": "\u79d1\u5b66\u8f6f\u4ef6\u4fee\u590d\u6210\u7f16\u7801\u667a\u80fd\u4f53\u65b0\u96be\u9898", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa SWE-bench Science\uff0c\u4e00\u4e2a\u9762\u5411\u79d1\u5b66\u8f6f\u4ef6\u5de5\u7a0b\u7684\u4ed3\u5e93\u7ea7\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea98\u4e2a GitHub \u4ed3\u5e93\u300120\u4e2a\u79d1\u5b66\u9886\u57df\u7684119\u4e2a\u4efb\u52a1\u3002\u5b83\u7cfb\u7edf\u5206\u6790\u4e86\u7f16\u7801\u667a\u80fd\u4f53\u5728\u4fee\u590d\u79d1\u5b66\u4ee3\u7801\u65f6\u7684\u8868\u73b0\u3001\u5931\u8d25\u673a\u5236\u4ee5\u53ca\u79d1\u5b66\u6307\u5bfc\u4fe1\u606f\u7684\u4f5c\u7528\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u901a\u7528\u8f6f\u4ef6\u4fee\u590d\u63a8\u8fdb\u5230\u79d1\u5b66\u8ba1\u7b97\u573a\u666f\uff0c\u5f3a\u8c03\u79d1\u5b66\u77e5\u8bc6\u3001\u5de5\u7a0b\u4e0a\u4e0b\u6587\u4e0e\u53ef\u6267\u884c\u9a8c\u8bc1\u4e4b\u95f4\u7684\u590d\u6742\u5173\u7cfb\uff0c\u5bf9\u8bc4\u4f30\u9ad8\u98ce\u9669\u79d1\u7814\u4ee3\u7801\u4e2d\u7684 AI \u8f85\u52a9\u7f16\u7a0b\u80fd\u529b\u5177\u6709\u91cd\u8981\u4ef7\u503c\u3002"}, {"abstract": "Long-context modeling is a pivotal capability for Large Language Models, yet the quadratic complexity of attention remains a critical bottleneck, particularly during the compute-intensive prefilling phase. Our previous work, FlashPrefill, mitigates this cost through instantaneous pattern discovery and max-based dynamic thresholding; however, it remains an algorithmic prototype that is still distant from production deployment. In this paper, we present FlashPrefill V2, which evolves FlashPrefill from a prototype toward practical long-context serving along three dimensions. First, we introduce a mean correction term that effectively suppresses the approximation error, keeping performance degradation manageable even at extreme sparsity levels. Second, we redesign the sparse attention operator with PackGQA memory access, warp specialization, and pingpong pipelining, fully aligning with the latest FlashAttention-3/4 implementations and supporting FP8 inference to meet practical quantization requirements. Third, FlashPrefill V2 natively supports paged KV cache and continuous batching, allowing integration as an attention backend in modern inference frameworks such as SGLang. Extensive evaluations on NVIDIA H20 GPUs---among the most widely deployed inference accelerators---demonstrate that FlashPrefill V2 delivers up to 47.26x and 27.19x speedups over FlashAttention-2 at 128K context length under FP8 and BF16 precision, respectively, and, in FP8, still achieves a 30.49x speedup against an FA3/4-aligned dense baseline.", "arxiv_id": "2608.19758", "arxiv_url": "https://arxiv.org/abs/2608.19758", "authors": ["Qihang Fan", "Huaibo Huang", "Zhiying Wu", "Bingning Wang", "Ran He"], "brief": "\u8bba\u6587\u63d0\u51fa FlashPrefill V2\uff0c\u5c06\u5757\u7a00\u758f\u9884\u586b\u5145\u6ce8\u610f\u529b\u4ece\u7b97\u6cd5\u539f\u578b\u63a8\u8fdb\u5230\u53ef\u90e8\u7f72\u7684\u957f\u4e0a\u4e0b\u6587 LLM \u63a8\u7406\u540e\u7aef\u3002\u5b83\u901a\u8fc7\u8bef\u5dee\u6821\u6b63\u3001\u9ad8\u6027\u80fd\u7a00\u758f\u7b97\u5b50\u548c\u5bf9\u73b0\u4ee3\u670d\u52a1\u6846\u67b6\u7279\u6027\u7684\u652f\u6301\uff0c\u663e\u8457\u964d\u4f4e\u9884\u586b\u5145\u9636\u6bb5\u6210\u672c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19758", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165 mean correction \u9879\u6291\u5236\u7a00\u758f\u8fd1\u4f3c\u8bef\u5dee\uff0c\u4f7f\u6781\u9ad8\u7a00\u758f\u5ea6\u4e0b\u6027\u80fd\u9000\u5316\u4ecd\u53ef\u63a7", "\u91cd\u8bbe\u8ba1\u7a00\u758f\u6ce8\u610f\u529b\u7b97\u5b50\uff0c\u7ed3\u5408 PackGQA \u5185\u5b58\u8bbf\u95ee\u3001warp specialization\u3001pingpong pipelining\uff0c\u5e76\u652f\u6301 FP8 \u63a8\u7406", "\u539f\u751f\u652f\u6301 paged KV cache \u4e0e continuous batching\uff0c\u53ef\u96c6\u6210\u5230 SGLang \u7b49\u73b0\u4ee3\u63a8\u7406\u6846\u67b6\uff1b\u5728 128K \u4e0a\u76f8\u5bf9 FlashAttention-2 \u6700\u9ad8\u52a0\u901f 47.26 \u500d"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u7a00\u758f\u6ce8\u610f\u529b", "\u63a8\u7406\u52a0\u901f", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19758v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FlashPrefill V2: Block-Sparse Prefill Attention for Long-Context LLM Serving", "tldr": "\u957f\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u6ce8\u610f\u529b\u6700\u9ad8\u52a0\u901f47\u500d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FlashPrefill V2\uff0c\u5c06\u5757\u7a00\u758f\u9884\u586b\u5145\u6ce8\u610f\u529b\u4ece\u7b97\u6cd5\u539f\u578b\u63a8\u8fdb\u5230\u53ef\u90e8\u7f72\u7684\u957f\u4e0a\u4e0b\u6587 LLM \u63a8\u7406\u540e\u7aef\u3002\u5b83\u901a\u8fc7\u8bef\u5dee\u6821\u6b63\u3001\u9ad8\u6027\u80fd\u7a00\u758f\u7b97\u5b50\u548c\u5bf9\u73b0\u4ee3\u670d\u52a1\u6846\u67b6\u7279\u6027\u7684\u652f\u6301\uff0c\u663e\u8457\u964d\u4f4e\u9884\u586b\u5145\u9636\u6bb5\u6210\u672c\u3002", "why_notable": "\u957f\u4e0a\u4e0b\u6587 LLM \u670d\u52a1\u7684\u74f6\u9888\u4e3b\u8981\u96c6\u4e2d\u5728\u9884\u586b\u5145\u6ce8\u610f\u529b\uff0c\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u63d0\u51fa\u7b97\u6cd5\u6539\u8fdb\uff0c\u8fd8\u9762\u5411\u751f\u4ea7\u63a8\u7406\u7cfb\u7edf\u5b8c\u6210\u7b97\u5b50\u3001\u91cf\u5316\u4e0e\u8c03\u5ea6\u9002\u914d\uff0c\u5177\u6709\u5f88\u5f3a\u7684\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Recent agent benchmarks increasingly ground evaluation in executable environments, from code repair to web navigation, app APIs, and function calling. Yet completing consequential work beyond code requires more than producing a plausible response or valid tool call: agents must gather missing information over multiple turns, follow domain policies, coordinate dependent tools, and realize the correct persistent state transition without collateral effects. In this paper, we introduce Thinkingbox, a sandbox for tool-agent-user interaction that provides isolated MCP-compatible tool sessions, complete execution traces, and outcome evaluation over terminal backend state. Built on this sandbox, Thinkingbox-bench contains 507 policy-conditioned workflows across numerous scenarios, including retail, hospitality, auto insurance, neobank internal IT, and consulting IT/HR support. Each attempt is evaluated by task-specific executable checks that accept valid trajectories while rejecting wrong, missing, or extra effects; designated tasks additionally check required properties of the final response. Across proprietary and open-weight models, the strongest achieves 65.36% pass@1, but only 25.25% pass^20. Moreover, many failed trials show clean termination and valid state-changing actions, showing that response or tool-call-level signals are not clear proxies for end-to-end task completion. Thinkingbox-bench reveals a large gap between occasionally finding a successful trajectory and reliably completing stateful business tasks. We release both Thinkingbox and Thinkingbox-Bench: https://github.com/microsoft/thinkingbox", "arxiv_id": "2608.19741", "arxiv_url": "https://arxiv.org/abs/2608.19741", "authors": ["Zhuochun Li", "Youngmin Ko", "Ali Keramati", "Nicola Ferri", "Susana Palmaz Lopez Pelaez", "Liang-Chun Tsai", "Calvin Wang", "Mirco Milletari", "Tuhin Kundu", "Vadim Smolyakov", "Kjartan Olafsson", "Tommy Guy"], "brief": "\u8bba\u6587\u63d0\u51fa Thinkingbox\uff0c\u4e00\u4e2a\u9762\u5411\u5de5\u5177-\u667a\u80fd\u4f53-\u7528\u6237\u4ea4\u4e92\u7684\u6c99\u7bb1\uff0c\u5e76\u6784\u5efa Thinkingbox-bench\uff0c\u8bc4\u6d4b\u667a\u80fd\u4f53\u5728\u6709\u72b6\u6001\u4e1a\u52a1\u6d41\u7a0b\u4e2d\u80fd\u5426\u6309\u7b56\u7565\u5b8c\u6210\u6b63\u786e\u7684\u540e\u7aef\u72b6\u6001\u53d8\u66f4\u3002\u57fa\u51c6\u8986\u76d6\u96f6\u552e\u3001\u9152\u5e97\u3001\u8f66\u9669\u3001\u94f6\u884c\u5185\u90e8IT\u3001\u54a8\u8be2IT/HR\u652f\u6301\u7b49507\u4e2a\u5de5\u4f5c\u6d41\u3002", "categories": ["cs.CL", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19741", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u4f9b\u9694\u79bb\u7684 MCP \u517c\u5bb9\u5de5\u5177\u4f1a\u8bdd\u3001\u5b8c\u6574\u6267\u884c\u8f68\u8ff9\u4e0e\u57fa\u4e8e\u7ec8\u7aef\u540e\u7aef\u72b6\u6001\u7684\u7ed3\u679c\u8bc4\u4f30\u3002", "\u6bcf\u4e2a\u4efb\u52a1\u7528\u53ef\u6267\u884c\u68c0\u67e5\u9a8c\u8bc1\u8f68\u8ff9\u662f\u5426\u4ea7\u751f\u6b63\u786e\u72b6\u6001\u53d8\u66f4\uff0c\u5e76\u62d2\u7edd\u9519\u8bef\u3001\u9057\u6f0f\u6216\u989d\u5916\u526f\u4f5c\u7528\u3002", "\u6700\u5f3a\u6a21\u578b pass@1 \u4e3a65.36%\uff0c\u4f46 pass^20 \u4ec525.25%\uff0c\u663e\u793a\u5076\u7136\u6210\u529f\u4e0d\u7b49\u4e8e\u7a33\u5b9a\u53ef\u9760\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u57fa\u51c6\u8bc4\u6d4b", "\u4e1a\u52a1\u6d41\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19741v1", "published_at": "2026-08-20", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "One Success Isn\u0027t Reliability: Thinkingbox, a Sandbox and Benchmark for Agents in Stateful Business Workflows", "tldr": "Thinkingbox\u8bc4\u6d4b\u667a\u80fd\u4f53\u53ef\u9760\u6267\u884c\u4e1a\u52a1\u6d41\u7a0b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Thinkingbox\uff0c\u4e00\u4e2a\u9762\u5411\u5de5\u5177-\u667a\u80fd\u4f53-\u7528\u6237\u4ea4\u4e92\u7684\u6c99\u7bb1\uff0c\u5e76\u6784\u5efa Thinkingbox-bench\uff0c\u8bc4\u6d4b\u667a\u80fd\u4f53\u5728\u6709\u72b6\u6001\u4e1a\u52a1\u6d41\u7a0b\u4e2d\u80fd\u5426\u6309\u7b56\u7565\u5b8c\u6210\u6b63\u786e\u7684\u540e\u7aef\u72b6\u6001\u53d8\u66f4\u3002\u57fa\u51c6\u8986\u76d6\u96f6\u552e\u3001\u9152\u5e97\u3001\u8f66\u9669\u3001\u94f6\u884c\u5185\u90e8IT\u3001\u54a8\u8be2IT/HR\u652f\u6301\u7b49507\u4e2a\u5de5\u4f5c\u6d41\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u5355\u6b21\u54cd\u5e94\u6216\u5de5\u5177\u8c03\u7528\u6b63\u786e\u6027\u63a8\u8fdb\u5230\u771f\u5b9e\u4e1a\u52a1\u573a\u666f\u4e2d\u7684\u591a\u8f6e\u4fe1\u606f\u6536\u96c6\u3001\u7b56\u7565\u9075\u5faa\u3001\u5de5\u5177\u534f\u540c\u548c\u6301\u4e45\u72b6\u6001\u53d8\u66f4\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u5728\u53ef\u9760\u5b8c\u6210\u6709\u72b6\u6001\u4efb\u52a1\u4e0a\u7684\u663e\u8457\u77ed\u677f\u3002"}, {"abstract": "Inference-time selection methods, such as Best-of-N, improve generation by sampling a pool of candidates and selecting the top-ranked completion according to a reward model. Distillation seeks to amortize this procedure into a single policy by replacing raw rewards with in-pool ranks and learning a policy that upweights higher-ranked completions. However, existing rank-based policies typically use smooth full-support reweighting, so low-ranked completions receive less mass but remain in the target support. Although a sharper reweighting reduces lower-tail mass, it also increases reliance on brittle ranking at the top made by a single reward model. We propose TUP: a Truncate-bad, Upweight-good Policy that removes low-ranked completions from the support and reweights only the retained upper tail with a tunable sharpness. TUP admits a closed-form, prompt-independent normalization and can be trained fully offline via binary cross-entropy, using shifted-truncated win-rates as soft labels and distilled-to-reference log-likelihood ratios as logits. Theoretically, under certain assumptions, we show that for any unknown oracle reward, the best monotone rank-reweighting can be matched by a lower-tail truncation rule, providing formal support for removing the lower tail rather than merely downweighting it. Empirically, we show that TUP is competitive with strong offline alignment baselines.", "arxiv_id": "2608.19748", "arxiv_url": "https://arxiv.org/abs/2608.19748", "authors": ["Yarin Bar", "Yaniv Romano"], "brief": "\u8bba\u6587\u63d0\u51fa TUP\uff08Truncate-bad, Upweight-good Policy\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u5019\u9009\u6c60\u6392\u540d\u7684\u79bb\u7ebf\u84b8\u998f\u65b9\u6cd5\uff1a\u76f4\u63a5\u79fb\u9664\u4f4e\u6392\u540d\u751f\u6210\uff0c\u518d\u5bf9\u4fdd\u7559\u7684\u9ad8\u8d28\u91cf\u4e0a\u5c3e\u6837\u672c\u52a0\u6743\u5b66\u4e60\u3002\u5b83\u5c06 Best-of-N \u63a8\u7406\u65f6\u9009\u62e9\u8fc7\u7a0b\u644a\u9500\u8fdb\u5355\u4e00\u7b56\u7565\u6a21\u578b\u4e2d\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19748", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u540c\u4e8e\u5e73\u6ed1\u91cd\u52a0\u6743\u65b9\u6cd5\uff0cTUP \u5c06\u4f4e\u6392\u540d completion \u4ece\u76ee\u6807\u5206\u5e03\u652f\u6301\u96c6\u4e2d\u622a\u65ad\uff0c\u800c\u4e0d\u662f\u4ec5\u964d\u4f4e\u5176\u6982\u7387\u8d28\u91cf\u3002", "\u65b9\u6cd5\u5177\u6709\u95ed\u5f0f\u3001\u4e0e prompt \u65e0\u5173\u7684\u5f52\u4e00\u5316\u5f62\u5f0f\uff0c\u53ef\u7528\u4e8c\u5143\u4ea4\u53c9\u71b5\u79bb\u7ebf\u8bad\u7ec3\uff0c\u4ee5\u622a\u65ad\u5e73\u79fb\u540e\u7684\u80dc\u7387\u4f5c\u8f6f\u6807\u7b7e\u3002", "\u7406\u8bba\u4e0a\u8bc1\u660e\u5728\u4e00\u5b9a\u5047\u8bbe\u4e0b\uff0c\u4efb\u610f\u6700\u4f18\u5355\u8c03\u6392\u540d\u91cd\u52a0\u6743\u90fd\u53ef\u7531\u4f4e\u5c3e\u622a\u65ad\u89c4\u5219\u5339\u914d\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u4e0e\u5f3a\u79bb\u7ebf\u5bf9\u9f50\u57fa\u7ebf\u7ade\u4e89\u529b\u76f8\u5f53\u3002"], "keywords": ["\u6a21\u578b\u5bf9\u9f50", "\u77e5\u8bc6\u84b8\u998f", "\u5956\u52b1\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19748v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Truncate Bad, Upweight Good: BoN-Style Distillation via Rank-Based Classification", "tldr": "\u7528\u622a\u65ad\u4f4e\u8d28\u6837\u672c\u84b8\u998fBest-of-N\u751f\u6210\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TUP\uff08Truncate-bad, Upweight-good Policy\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u5019\u9009\u6c60\u6392\u540d\u7684\u79bb\u7ebf\u84b8\u998f\u65b9\u6cd5\uff1a\u76f4\u63a5\u79fb\u9664\u4f4e\u6392\u540d\u751f\u6210\uff0c\u518d\u5bf9\u4fdd\u7559\u7684\u9ad8\u8d28\u91cf\u4e0a\u5c3e\u6837\u672c\u52a0\u6743\u5b66\u4e60\u3002\u5b83\u5c06 Best-of-N \u63a8\u7406\u65f6\u9009\u62e9\u8fc7\u7a0b\u644a\u9500\u8fdb\u5355\u4e00\u7b56\u7565\u6a21\u578b\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 BoN \u84b8\u998f\u4e2d\u4f4e\u8d28\u6837\u672c\u4ecd\u6b8b\u7559\u3001\u9876\u90e8\u6392\u5e8f\u53c8\u6613\u53d7\u5956\u52b1\u6a21\u578b\u566a\u58f0\u5f71\u54cd\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u201c\u622a\u65ad\u574f\u6837\u672c\u3001\u4e0a\u8c03\u597d\u6837\u672c\u201d\u7684\u6298\u4e2d\u7b56\u7565\uff0c\u4e3a\u79bb\u7ebf\u5bf9\u9f50\u548c\u63a8\u7406\u65f6\u9009\u62e9\u84b8\u998f\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u4e14\u5b9e\u73b0\u7b80\u5355\u7684\u65b9\u6848\u3002"}, {"abstract": "Vision-language-model-based embodied agents can complete instructed tasks but often violate safety constraints in the process, a problem recently framed as interactive safety. Training such agents to act safely is difficult, since safety and task success are distinct objectives, and safety arises only at a small number of safety-critical steps within a trajectory. Standard supervision is insufficient: imitating safe trajectories teaches behavior without explaining why it is safe, and contrasting arbitrary safe and unsafe trajectories mixes the safety signal with unrelated differences. We propose SafeBranch, a framework that aligns an embodied actor on safety through branch pairs constructed from the actor\u0027s own unsafe rollouts via environment rollback. SafeBranch rolls each unsafe rollout back to the safety-critical step that caused the violation, queries the actor for a safe alternative, and pairs the original action with the alternative so that the two branches differ only at that step. The trained actor acts safely at deployment with no critic in the loop. On IS-Bench, SafetyALFRED, and out-of-distribution variants with unseen tasks and objects, it handles safety reliably without sacrificing task success, achieving roughly ten times more safe successes than the untrained baseline on the unseen-object variant.", "arxiv_id": "2608.19729", "arxiv_url": "https://arxiv.org/abs/2608.19729", "authors": ["Hyunse Lee", "Jiwoo Jeong", "Haneul Lee", "Kyochul Jang", "Youngjae Yu", "Woojin Lee"], "brief": "\u8bba\u6587\u63d0\u51fa SafeBranch\uff0c\u901a\u8fc7\u4ece\u667a\u80fd\u4f53\u81ea\u8eab\u7684\u4e0d\u5b89\u5168\u8f68\u8ff9\u56de\u6eda\u5230\u5b89\u5168\u5173\u952e\u6b65\u9aa4\uff0c\u6784\u9020\u4ec5\u5728\u8be5\u6b65\u4e0d\u540c\u7684\u5b89\u5168/\u4e0d\u5b89\u5168\u5206\u652f\u5bf9\uff0c\u7528\u4e8e\u8bad\u7ec3\u5177\u8eab actor \u7684\u5b89\u5168\u504f\u597d\u3002\u8bad\u7ec3\u540e\u7684\u667a\u80fd\u4f53\u90e8\u7f72\u65f6\u65e0\u9700\u989d\u5916\u5b89\u5168 critic\uff0c\u4e5f\u80fd\u66f4\u53ef\u9760\u5730\u5b8c\u6210\u4efb\u52a1\u5e76\u9075\u5b88\u5b89\u5168\u7ea6\u675f\u3002", "categories": ["cs.AI", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19729", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5229\u7528\u73af\u5883\u56de\u6eda\u5b9a\u4f4d\u5bfc\u81f4\u8fdd\u89c4\u7684\u5b89\u5168\u5173\u952e\u6b65\u9aa4\uff0c\u518d\u67e5\u8be2 actor \u751f\u6210\u5b89\u5168\u66ff\u4ee3\u52a8\u4f5c\uff0c\u5f62\u6210 branch pair", "\u5206\u652f\u5bf9\u53ea\u5728\u5173\u952e\u52a8\u4f5c\u5904\u4e0d\u540c\uff0c\u51cf\u5c11\u4efb\u52a1\u5185\u5bb9\u3001\u73af\u5883\u72b6\u6001\u7b49\u65e0\u5173\u5dee\u5f02\u5bf9\u5b89\u5168\u4fe1\u53f7\u7684\u5e72\u6270", "\u5728 IS-Bench\u3001SafetyALFRED \u53ca\u672a\u89c1\u4efb\u52a1/\u7269\u4f53\u7684\u5206\u5e03\u5916\u6d4b\u8bd5\u4e2d\u63d0\u5347\u5b89\u5168\u6210\u529f\u7387\uff0c\u672a\u89c1\u7269\u4f53\u573a\u666f\u7ea6\u8fbe\u5230\u672a\u8bad\u7ec3\u57fa\u7ebf\u7684 10 \u500d\u5b89\u5168\u6210\u529f\u6570"], "keywords": ["\u5177\u8eab\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19729v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SafeBranch: Branch-Pair Safety Alignment for Embodied Agents", "tldr": "\u7528\u5206\u652f\u5bf9\u9f50\u8bad\u7ec3\u5177\u8eab\u667a\u80fd\u4f53\u5b89\u5168\u884c\u52a8", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SafeBranch\uff0c\u901a\u8fc7\u4ece\u667a\u80fd\u4f53\u81ea\u8eab\u7684\u4e0d\u5b89\u5168\u8f68\u8ff9\u56de\u6eda\u5230\u5b89\u5168\u5173\u952e\u6b65\u9aa4\uff0c\u6784\u9020\u4ec5\u5728\u8be5\u6b65\u4e0d\u540c\u7684\u5b89\u5168/\u4e0d\u5b89\u5168\u5206\u652f\u5bf9\uff0c\u7528\u4e8e\u8bad\u7ec3\u5177\u8eab actor \u7684\u5b89\u5168\u504f\u597d\u3002\u8bad\u7ec3\u540e\u7684\u667a\u80fd\u4f53\u90e8\u7f72\u65f6\u65e0\u9700\u989d\u5916\u5b89\u5168 critic\uff0c\u4e5f\u80fd\u66f4\u53ef\u9760\u5730\u5b8c\u6210\u4efb\u52a1\u5e76\u9075\u5b88\u5b89\u5168\u7ea6\u675f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u5177\u8eab\u667a\u80fd\u4f53\u4ea4\u4e92\u5f0f\u5b89\u5168\u4e2d\u7684\u7a00\u758f\u5173\u952e\u51b3\u7b56\u96be\u9898\uff0c\u63d0\u4f9b\u4e86\u6bd4\u666e\u901a\u6a21\u4eff\u6216\u4efb\u610f\u8f68\u8ff9\u5bf9\u6bd4\u66f4\u7cbe\u51c6\u7684\u5b89\u5168\u76d1\u7763\u4fe1\u53f7\uff0c\u5e76\u4e14\u63a8\u7406\u9636\u6bb5\u65e0\u9700\u989d\u5916\u76d1\u7763\u6a21\u5757\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent studies suggest that video generation models can exhibit certain forms of zero-shot visual reasoning through generated frames. Yet reliable evaluation remains challenging: benchmarks should adopt inputs aligned with the visual priors of current video models, require valid evolving processes rather than only plausible final states, and calibrate task difficulty to remain challenging yet partly feasible. To this end, we introduce VGI-bench, containing 27 tasks and 810 instances, organized by a two-level taxonomy of task domains and skill tags for fine-grained evaluation of visual reasoning capabilities of video generation models. Our evaluations show that current generative systems can solve a subset of visually grounded reasoning tasks, but remain far from reliable, with even the strongest model, Seedance~2.0, achieving only 51.0% under our evaluation criteria. Our analysis further explore the output failure modes, input condition sensitivity, performance transfer boundary from synthetic fine-tuning, and internal denoising perspective revealing limited self-correction, where later steps mainly refine early hypotheses rather than correct reasoning errors. We hope VGI-bench will help stimulate the development of next-generation video generation models. We will release our code and data.", "arxiv_id": "2608.19583", "arxiv_url": "https://arxiv.org/abs/2608.19583", "authors": ["Xuan He", "Cong Wei", "Yuhao Cheng", "Linrui Ma", "Yuxuan Zhang", "Zuojun Li", "Yuhao Wen", "Zeyi Liu", "Yuren Hao", "Songcheng Cai", "Keming Wu", "Penghui Du", "Kai Zou", "Rui Yang", "Chenkai Sun", "Ke Yang", "Ping Nie", "Kelsey R Allen", "Chenglong Wang", "Michel Galley", "Jianfeng Gao", "ChengXiang Zhai"], "brief": "\u8bba\u6587\u63d0\u51fa VGI-bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u89c6\u9891\u751f\u6210\u6a21\u578b\u5728\u751f\u6210\u52a8\u6001\u8fc7\u7a0b\u4e2d\u7684\u96f6\u6837\u672c\u89c6\u89c9\u63a8\u7406\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b27\u7c7b\u4efb\u52a1\u3001810\u4e2a\u5b9e\u4f8b\uff0c\u5e76\u6309\u4efb\u52a1\u9886\u57df\u4e0e\u6280\u80fd\u6807\u7b7e\u8fdb\u884c\u7ec6\u7c92\u5ea6\u5206\u7c7b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19583", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f3a\u8c03\u8bc4\u6d4b\u4e0d\u4ec5\u770b\u6700\u7ec8\u753b\u9762\u662f\u5426\u5408\u7406\uff0c\u8fd8\u8981\u6c42\u751f\u6210\u8fc7\u7a0b\u7b26\u5408\u6709\u6548\u7684\u89c6\u89c9\u6f14\u5316\u903b\u8f91", "\u5f53\u524d\u6700\u5f3a\u6a21\u578b Seedance 2.0 \u5728\u8be5\u57fa\u51c6\u4e0a\u4ec5\u8fbe\u523051.0%\uff0c\u663e\u793a\u89c6\u9891\u751f\u6210\u6a21\u578b\u89c6\u89c9\u63a8\u7406\u4ecd\u4e0d\u53ef\u9760", "\u5206\u6790\u4e86\u5931\u8d25\u6a21\u5f0f\u3001\u8f93\u5165\u6761\u4ef6\u654f\u611f\u6027\u3001\u5408\u6210\u5fae\u8c03\u8fc1\u79fb\u8fb9\u754c\uff0c\u4ee5\u53ca\u53bb\u566a\u8fc7\u7a0b\u4e2d\u7684\u6709\u9650\u81ea\u6211\u7ea0\u9519\u80fd\u529b"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u89c6\u89c9\u63a8\u7406", "\u8bc4\u6d4b\u57fa\u51c6", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19583v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "VGI-BENCH: Probing Visual Intelligence in Video Generation Models", "tldr": "\u8bc4\u6d4b\u89c6\u9891\u751f\u6210\u6a21\u578b\u89c6\u89c9\u63a8\u7406\u7684\u65b0\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VGI-bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u89c6\u9891\u751f\u6210\u6a21\u578b\u5728\u751f\u6210\u52a8\u6001\u8fc7\u7a0b\u4e2d\u7684\u96f6\u6837\u672c\u89c6\u89c9\u63a8\u7406\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b27\u7c7b\u4efb\u52a1\u3001810\u4e2a\u5b9e\u4f8b\uff0c\u5e76\u6309\u4efb\u52a1\u9886\u57df\u4e0e\u6280\u80fd\u6807\u7b7e\u8fdb\u884c\u7ec6\u7c92\u5ea6\u5206\u7c7b\u3002", "why_notable": "VGI-bench \u5c06\u89c6\u9891\u751f\u6210\u8bc4\u6d4b\u4ece\u611f\u77e5\u8d28\u91cf\u63a8\u8fdb\u5230\u52a8\u6001\u89c6\u89c9\u63a8\u7406\u80fd\u529b\uff0c\u4e3a\u8bca\u65ad\u548c\u6539\u8fdb\u4e0b\u4e00\u4ee3\u89c6\u9891\u751f\u6210\u6a21\u578b\u63d0\u4f9b\u4e86\u66f4\u6709\u9488\u5bf9\u6027\u7684\u5de5\u5177\u3002"}, {"abstract": "We study inference-time control for text generation in discrete diffusion language models, where the goal is to steer sampling toward sequence-level rewards without retraining. Prior work in this domain has focused on particle-based methods such as best-of-$n$ sampling and bootstrap sequential Monte Carlo, which may suffer from overoptimism and weight degeneracy, respectively. We address these limitations using \\emph{nested} sequential Monte Carlo methods. We formulate nested SMC (NSMC) and fully-adapted nested SMC (FA-NSMC) for Feynman--Kac steering, identifying and correcting errors in prior formulations that lead to biased final estimates. We evaluate these methods on toxicity and fluency steering tasks, showing that NSMC and FA-NSMC consistently outperform best-of-$n$ and bootstrap SMC.", "arxiv_id": "2608.20123", "arxiv_url": "https://arxiv.org/abs/2608.20123", "authors": ["Lohithsai Yadala Chanchu", "Hany Abdulsamad", "Christian A. Naesseth"], "brief": "\u672c\u6587\u7814\u7a76\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u7406\u65f6\u63a7\u5236\uff0c\u5728\u65e0\u9700\u91cd\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\u7528\u5e8f\u5217\u7ea7\u5956\u52b1\u5f15\u5bfc\u6587\u672c\u751f\u6210\u3002\u4f5c\u8005\u63d0\u51fa\u5e76\u4fee\u6b63\u4e86\u7528\u4e8eFeynman--Kac\u5f15\u5bfc\u7684\u5d4c\u5957\u5e8f\u8d2f\u8499\u7279\u5361\u6d1b\uff08NSMC\uff09\u4e0e\u5168\u9002\u5e94NSMC\u65b9\u6cd5\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20123", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9best-of-n\u91c7\u6837\u7684\u8fc7\u5ea6\u4e50\u89c2\u548cbootstrap SMC\u7684\u6743\u91cd\u9000\u5316\u95ee\u9898\uff0c\u5f15\u5165\u5d4c\u5957SMC\u8fdb\u884c\u66f4\u7a33\u5065\u7684\u63a8\u7406\u65f6\u5f15\u5bfc\u3002", "\u5f62\u5f0f\u5316NSMC\u4e0eFA-NSMC\u5728\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u5e94\u7528\uff0c\u5e76\u6307\u51fa\u65e2\u6709\u516c\u5f0f\u4f1a\u5bfc\u81f4\u6700\u7ec8\u4f30\u8ba1\u6709\u504f\uff0c\u7ed9\u51fa\u4fee\u6b63\u3002", "\u5728\u6bd2\u6027\u63a7\u5236\u548c\u6d41\u7545\u6027\u63a7\u5236\u4efb\u52a1\u4e0a\uff0cNSMC\u4e0eFA-NSMC\u7a33\u5b9a\u4f18\u4e8ebest-of-n\u548cbootstrap SMC\u57fa\u7ebf\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6587\u672c\u751f\u6210", "\u63a8\u7406\u65f6\u63a7\u5236", "\u8499\u7279\u5361\u6d1b\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20123v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Discrete Diffusion Inference-Time Control with Nested Sequential Monte Carlo", "tldr": "\u7528\u5d4c\u5957SMC\u63d0\u5347\u79bb\u6563\u6269\u6563\u6587\u672c\u53ef\u63a7\u91c7\u6837", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u7406\u65f6\u63a7\u5236\uff0c\u5728\u65e0\u9700\u91cd\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\u7528\u5e8f\u5217\u7ea7\u5956\u52b1\u5f15\u5bfc\u6587\u672c\u751f\u6210\u3002\u4f5c\u8005\u63d0\u51fa\u5e76\u4fee\u6b63\u4e86\u7528\u4e8eFeynman--Kac\u5f15\u5bfc\u7684\u5d4c\u5957\u5e8f\u8d2f\u8499\u7279\u5361\u6d1b\uff08NSMC\uff09\u4e0e\u5168\u9002\u5e94NSMC\u65b9\u6cd5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u514d\u8bad\u7ec3\u63a7\u5236\u65b9\u6cd5\uff0c\u517c\u5177\u7406\u8bba\u4fee\u6b63\u4e0e\u5b9e\u8bc1\u63d0\u5347\uff0c\u5bf9\u5b89\u5168\u6587\u672c\u751f\u6210\u548c\u53ef\u63a7\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "World models construct latent states that support prediction, planning, and reasoning about an underlying system. Joint-embedding predictive architectures (JEPAs) offer a direct way to learn such states by predicting targets in representation space instead of reconstructing every detail of the observation. Standard JEPAs, however, organize all predictable content through one target embedding and one prediction pathway. In complex systems, this monolithic state can allocate redundant capacity to dominant signals while providing weak or conflicting gradients to less dominant predictive structure. We introduce \\method, a latent world-modeling framework based on orthogonal predictive factorization. Learned basis matrices analyze each target state into multiple components, and a dedicated prediction branch estimates each component from a shared context representation. Predictive regression preserves the factor magnitudes required for state synthesis, an orthogonality objective discourages repeated directions, factor-activity regularization maintains variation in projected targets, and online variance regularization discourages coordinate-wise encoder collapse. Predicted components are synthesized into a complete latent state that can be used by a readout, decoder, planner, or autoregressive rollout. The same predictive-state mechanism applies when the target is temporally future, spatially hidden, or another partial observation of the same system. Experiments on controlled vision, single-cell transcriptomics, longitudinal health records, continuous control, and molecular dynamics evaluate representation quality, forecasting, planning, and long-horizon stability.", "arxiv_id": "2608.20065", "arxiv_url": "https://arxiv.org/abs/2608.20065", "authors": ["Taoyong Cui", "Pheng Ann Heng", "Wanli Ouyang"], "brief": "\u8bba\u6587\u63d0\u51fa Orthogonal JEPA\uff0c\u5c06\u76ee\u6807\u8868\u793a\u5206\u89e3\u4e3a\u591a\u4e2a\u6b63\u4ea4\u9884\u6d4b\u56e0\u5b50\uff0c\u5e76\u7531\u5171\u4eab\u4e0a\u4e0b\u6587\u7684\u591a\u5206\u652f\u5206\u522b\u9884\u6d4b\uff0c\u518d\u5408\u6210\u4e3a\u5b8c\u6574\u6f5c\u5728\u72b6\u6001\u3002\u8be5\u6846\u67b6\u53ef\u7528\u4e8e\u65f6\u95f4\u672a\u6765\u9884\u6d4b\u3001\u7a7a\u95f4\u906e\u6321\u8865\u5168\u6216\u540c\u4e00\u7cfb\u7edf\u7684\u90e8\u5206\u89c2\u6d4b\u9884\u6d4b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20065", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u53ef\u5b66\u4e60\u57fa\u77e9\u9635\u5c06\u76ee\u6807\u72b6\u6001\u5206\u89e3\u4e3a\u591a\u4e2a\u6210\u5206\uff0c\u7f13\u89e3\u5355\u4e00JEPA\u5d4c\u5165\u88ab\u4e3b\u5bfc\u4fe1\u53f7\u5360\u6ee1\u7684\u95ee\u9898", "\u7ed3\u5408\u9884\u6d4b\u56de\u5f52\u3001\u6b63\u4ea4\u7ea6\u675f\u3001\u56e0\u5b50\u6d3b\u8dc3\u5ea6\u6b63\u5219\u548c\u5728\u7ebf\u65b9\u5dee\u6b63\u5219\uff0c\u51cf\u5c11\u5197\u4f59\u65b9\u5411\u4e0e\u7f16\u7801\u5668\u574d\u7f29", "\u5728\u89c6\u89c9\u3001\u5355\u7ec6\u80de\u8f6c\u5f55\u7ec4\u3001\u5065\u5eb7\u8bb0\u5f55\u3001\u8fde\u7eed\u63a7\u5236\u548c\u5206\u5b50\u52a8\u529b\u5b66\u4e2d\u8bc4\u4f30\u8868\u793a\u3001\u9884\u6d4b\u3001\u89c4\u5212\u4e0e\u957f\u7a0b\u7a33\u5b9a\u6027"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20065v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Orthogonal JEPA: Factorized Predictive States for Latent World Models", "tldr": "\u7528\u6b63\u4ea4\u56e0\u5b50\u5316\u6539\u8fdbJEPA\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Orthogonal JEPA\uff0c\u5c06\u76ee\u6807\u8868\u793a\u5206\u89e3\u4e3a\u591a\u4e2a\u6b63\u4ea4\u9884\u6d4b\u56e0\u5b50\uff0c\u5e76\u7531\u5171\u4eab\u4e0a\u4e0b\u6587\u7684\u591a\u5206\u652f\u5206\u522b\u9884\u6d4b\uff0c\u518d\u5408\u6210\u4e3a\u5b8c\u6574\u6f5c\u5728\u72b6\u6001\u3002\u8be5\u6846\u67b6\u53ef\u7528\u4e8e\u65f6\u95f4\u672a\u6765\u9884\u6d4b\u3001\u7a7a\u95f4\u906e\u6321\u8865\u5168\u6216\u540c\u4e00\u7cfb\u7edf\u7684\u90e8\u5206\u89c2\u6d4b\u9884\u6d4b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3aJEPA\u5f0f\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u63d0\u4f9b\u4e86\u66f4\u7ed3\u6784\u5316\u7684\u9884\u6d4b\u72b6\u6001\u8868\u793a\uff0c\u6709\u671b\u63d0\u5347\u590d\u6742\u7cfb\u7edf\u4e2d\u5f31\u4fe1\u53f7\u5efa\u6a21\u3001\u957f\u671f rollout \u7a33\u5b9a\u6027\u548c\u4e0b\u6e38\u89c4\u5212\u80fd\u529b\u3002"}, {"abstract": "Large Language Models (LLMs) increasingly require selective removal of harmful or sensitive knowledge, called unlearning, yet existing methods and benchmarks fail to evaluate this capability completely. Current approaches rely on disjoint forget and retain sets composed of independent facts, and measure success using simple and direct factual recall. This framing fails to capture a key requirement of unlearning, namely the ability to eliminate harmful behaviors while preserving benign and beneficial knowledge. We argue that effective unlearning must operate at the level of concepts, ensuring complete removal of unsafe applications while maintaining their correct and useful usage, thereby achieving conceptually meaningful and complete unlearning. To better evaluate unlearning techniques from such a practical viewpoint, we introduce the notion of dual-use concepts: concepts that can be used in both harmful and benign contexts. Building on these concepts, we construct a benchmark called ConceptGuard where forget and retain sets are explicitly complementary in concept usage. Our benchmark uniquely enables unlearning to be explored and gauged at the level of concepts, instead of sparse facts, and evaluation is intent-sensitive with the goal of maximizing contextual separation to promote safer behavior. We demonstrate that current unlearning techniques perform poorly under this setting, showing weak contextual separation alongside poor performance in ROUGE and concept-level metrics. Our results reveal strong forgetting-utility trade-offs, limited gains in contextual sensitivity, and poor consistency in concept-level control across methods, and provide ideas for unlearning approaches that better align with real-world safety requirements. Our dataset is publicly available.", "arxiv_id": "2608.20338", "arxiv_url": "https://arxiv.org/abs/2608.20338", "authors": ["Sahil Kale", "Ian Harris"], "brief": "\u8bba\u6587\u63d0\u51fa ConceptGuard\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u8bed\u8a00\u6a21\u578b\u5728\u201c\u6709\u5bb3\u7528\u9014\u9057\u5fd8\u3001\u826f\u6027\u7528\u9014\u4fdd\u7559\u201d\u573a\u666f\u4e0b\u7684\u6982\u5ff5\u7ea7\u9057\u5fd8\u80fd\u529b\u3002\u5b83\u56f4\u7ed5\u53cc\u7528\u9014\u6982\u5ff5\u6784\u9020\u4e92\u8865\u7684 forget/retain \u96c6\uff0c\u5e76\u91c7\u7528\u610f\u56fe\u654f\u611f\u8bc4\u4f30\u6765\u8861\u91cf\u4e0a\u4e0b\u6587\u5206\u79bb\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20338", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u73b0\u6709\u9057\u5fd8\u57fa\u51c6\u591a\u57fa\u4e8e\u72ec\u7acb\u4e8b\u5b9e\u548c\u76f4\u63a5\u53ec\u56de\uff0c\u96be\u4ee5\u8bc4\u4f30\u771f\u5b9e\u5b89\u5168\u573a\u666f\u4e2d\u7684\u6982\u5ff5\u7ea7\u9009\u62e9\u6027\u9057\u5fd8", "\u5f15\u5165\u201c\u53cc\u7528\u9014\u6982\u5ff5\u201d\uff0c\u5373\u540c\u4e00\u6982\u5ff5\u53ef\u5728\u6709\u5bb3\u4e0e\u826f\u6027\u8bed\u5883\u4e2d\u4f7f\u7528\uff0c\u5e76\u636e\u6b64\u6784\u5efa ConceptGuard \u6570\u636e\u96c6", "\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u9057\u5fd8\u65b9\u6cd5\u5728\u4e0a\u4e0b\u6587\u5206\u79bb\u3001ROUGE \u548c\u6982\u5ff5\u7ea7\u6307\u6807\u4e0a\u8868\u73b0\u8f83\u5f31\uff0c\u5b58\u5728\u660e\u663e\u9057\u5fd8-\u6548\u7528\u6743\u8861"], "keywords": ["\u6a21\u578b\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20338v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ConceptGuard: Benchmarking Context-Sensitive Unlearning in Large Language Models", "tldr": "\u9762\u5411\u53cc\u7528\u9014\u6982\u5ff5\u7684\u4e0a\u4e0b\u6587\u654f\u611f\u9057\u5fd8\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ConceptGuard\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u8bed\u8a00\u6a21\u578b\u5728\u201c\u6709\u5bb3\u7528\u9014\u9057\u5fd8\u3001\u826f\u6027\u7528\u9014\u4fdd\u7559\u201d\u573a\u666f\u4e0b\u7684\u6982\u5ff5\u7ea7\u9057\u5fd8\u80fd\u529b\u3002\u5b83\u56f4\u7ed5\u53cc\u7528\u9014\u6982\u5ff5\u6784\u9020\u4e92\u8865\u7684 forget/retain \u96c6\uff0c\u5e76\u91c7\u7528\u610f\u56fe\u654f\u611f\u8bc4\u4f30\u6765\u8861\u91cf\u4e0a\u4e0b\u6587\u5206\u79bb\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6a21\u578b\u9057\u5fd8\u8bc4\u6d4b\u4ece\u96f6\u6563\u4e8b\u5b9e\u63d0\u5347\u5230\u4e0a\u4e0b\u6587\u654f\u611f\u7684\u6982\u5ff5\u5c42\u9762\uff0c\u66f4\u8d34\u8fd1\u73b0\u5b9e\u5b89\u5168\u9700\u6c42\uff1b\u7ed3\u679c\u4e5f\u63ed\u793a\u4e86\u73b0\u6709\u9057\u5fd8\u6280\u672f\u5728\u4fdd\u7559\u6709\u7528\u77e5\u8bc6\u540c\u65f6\u79fb\u9664\u5371\u9669\u5e94\u7528\u65b9\u9762\u4ecd\u663e\u4e0d\u8db3\u3002"}, {"abstract": "Large language models often fail to answer questions about a bounded document collection when the source documents are not retrieved at inference time. We study this setting as document knowledge internalization: converting a fixed corpus into usable parametric knowledge for retrieval-free question answering. We propose IAR (Inject, Align, and Recover), a three-stage post-training framework that separates structured document knowledge injection, QA behavior alignment, and general ability recovery. Unlike conventional continued pretraining, Inject converts source documents into continuation, rewrite, and instruction-conditioned reconstruction objectives. Align then adapts the injected model with answer-only QA supervision, while Recover merges the domain-adapted model with the base instruction model to recover general capabilities. Across Common Corpus (CC) and CCI, and across Llama, Phi, Qwen, and SmolLM model families, IAR improves the domain-primary domain-general frontier for retrieval-free document internalization. In the main comparison, IAR improves over Vanilla SFT on all four reported metrics in 7 of 8 dataset-model settings, with average gains of 3.6 percentage points in domain QA accuracy and 12.1 percentage points in mean general performance across IFEval, MMLU, and MSBench. Extended CC baselines show that LoRA and FAPM can win individual general metrics, but among methods that also reach leading or near-leading domain internalization, IAR retains one of the strongest general profiles.", "arxiv_id": "2608.20281", "arxiv_url": "https://arxiv.org/abs/2608.20281", "authors": ["Qian Kou", "Xiaofeng Shi", "Xiaosong Qiu", "Hua Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa IAR\uff08Inject-Align-Recover\uff09\u4e09\u9636\u6bb5\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u7528\u4e8e\u628a\u56fa\u5b9a\u6587\u6863\u5e93\u8f6c\u5316\u4e3a\u5927\u6a21\u578b\u53ef\u76f4\u63a5\u8c03\u7528\u7684\u53c2\u6570\u5316\u77e5\u8bc6\uff0c\u5b9e\u73b0\u65e0\u9700\u68c0\u7d22\u7684\u6587\u6863\u95ee\u7b54\u3002\u65b9\u6cd5\u5c06\u6587\u6863\u77e5\u8bc6\u6ce8\u5165\u3001\u95ee\u7b54\u884c\u4e3a\u5bf9\u9f50\u4e0e\u901a\u7528\u80fd\u529b\u6062\u590d\u89e3\u8026\u5904\u7406\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20281", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Inject \u9636\u6bb5\u628a\u6e90\u6587\u6863\u8f6c\u5316\u4e3a\u7eed\u5199\u3001\u6539\u5199\u548c\u6307\u4ee4\u6761\u4ef6\u91cd\u6784\u7b49\u76ee\u6807\uff0c\u8fdb\u884c\u7ed3\u6784\u5316\u77e5\u8bc6\u6ce8\u5165\u3002", "Align \u9636\u6bb5\u4f7f\u7528\u4ec5\u7b54\u6848\u5f62\u5f0f\u7684\u95ee\u7b54\u76d1\u7763\uff0c\u8ba9\u6a21\u578b\u5b66\u4f1a\u4ee5\u95ee\u7b54\u65b9\u5f0f\u8c03\u7528\u5df2\u6ce8\u5165\u77e5\u8bc6\u3002", "Recover \u9636\u6bb5\u5c06\u9886\u57df\u9002\u914d\u6a21\u578b\u4e0e\u57fa\u7840\u6307\u4ee4\u6a21\u578b\u5408\u5e76\uff0c\u4ee5\u6062\u590d\u901a\u7528\u6307\u4ee4\u9075\u5faa\u548c\u901a\u7528\u4efb\u52a1\u80fd\u529b\u3002"], "keywords": ["\u77e5\u8bc6\u5185\u5316", "\u540e\u8bad\u7ec3", "\u95ee\u7b54", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20281v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Inject, Align, Recover: Staged Post-Training for Retrieval-Free Document Knowledge Internalization", "tldr": "\u4e09\u9636\u6bb5\u540e\u8bad\u7ec3\u8ba9\u6a21\u578b\u65e0\u68c0\u7d22\u5185\u5316\u6587\u6863\u77e5\u8bc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa IAR\uff08Inject-Align-Recover\uff09\u4e09\u9636\u6bb5\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u7528\u4e8e\u628a\u56fa\u5b9a\u6587\u6863\u5e93\u8f6c\u5316\u4e3a\u5927\u6a21\u578b\u53ef\u76f4\u63a5\u8c03\u7528\u7684\u53c2\u6570\u5316\u77e5\u8bc6\uff0c\u5b9e\u73b0\u65e0\u9700\u68c0\u7d22\u7684\u6587\u6863\u95ee\u7b54\u3002\u65b9\u6cd5\u5c06\u6587\u6863\u77e5\u8bc6\u6ce8\u5165\u3001\u95ee\u7b54\u884c\u4e3a\u5bf9\u9f50\u4e0e\u901a\u7528\u80fd\u529b\u6062\u590d\u89e3\u8026\u5904\u7406\u3002", "why_notable": "\u8be5\u5de5\u4
