const PAPERS = [{"abstract": "LLM agents learn by interacting with environments, yet these environments are hand-built and static: blind to an agent\u0027s weaknesses, and quickly left behind as it improves. While recent environment generation methods attempt to address this, they require domain-specific pipelines, rely on expensive or unreliable verifiers, and still produce static environments. To alleviate the engineering burden of rebuilding environments from scratch, we propose Environment Harness (EnvHarness), a programmable layer of plug-in components that wraps a static environment to reshape its behavior without modifying the underlying logic. Operating through standard interfaces, EnvHarness applies across diverse domains while ensuring every reshaped environment retains its original verifier. To automate this process, we introduce EnvRigger, which treats the target policy as a black box, observing its execution trajectories to synthesize EnvHarness components targeting diagnosed flaws, and validating them via fresh rollouts. Across five benchmarks in four domains, EnvHarness outperforms both original environments and domain-specific environment generation pipelines, achieving up to a 9.0-point improvement on held-out instances with 9.8% fewer execution steps. Furthermore, EnvHarness provides a superior optimization signal for reinforcement learning, enabling continuous, targeted co-evolution of the policy and its environment.", "arxiv_id": "2608.19880", "arxiv_url": "https://arxiv.org/abs/2608.19880", "authors": ["Chengsong Huang", "Zifeng Wang", "Rujun Han", "Jun Yan", "Yanfei Chen", "Zoey CuiZhu", "Ke Jiang", "Peng Xia", "Han Yu", "Yufan Zhuang", "Yifei Ming", "Jiaqi Pan", "Bhavana Dalvi Mishra", "Jiaxin Huang", "Burak Gokturk", "Tomas Pfister", "Chen-Yu Lee"], "brief": "\u8bba\u6587\u63d0\u51fa EnvHarness\uff1a\u4e00\u4e2a\u5305\u88f9\u9759\u6001\u73af\u5883\u7684\u53ef\u63d2\u62d4\u53ef\u7f16\u7a0b\u5c42\uff0c\u65e0\u9700\u4fee\u6539\u5e95\u5c42\u903b\ ing", "tldr": "\u7528\u53ef\u7f16\u7a0b\u5916\u58f3\u52a8\u6001\u6539\u9020\u667a\u80fd\u4f53\u8bad\u7ec3\u73af\u5883", "upvotes": 22, "what_it_is": "\u8bba\u6587\u63d0\u51fa EnvHarness\uff1a\u4e00\u4e2a\u5305\u88f9\u9759\u6001\u73af\u5883\u7684\u53ef\u63d2\u62d4\u53ef\u7f16\u7a0b\u5c42\uff0c\u65e0\u9700\u4fee\u6539\u5e95\u5c42\u903b\u8f91\u5373\u53ef\u91cd\u5851\u73af\u5883\u884c\u4e3a\uff0c\u5e76\u4fdd\u7559\u539f\u6709\u9a8c\u8bc1\u5668\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa EnvRigger\uff0c\u901a\u8fc7\u9ed1\u76d2\u89c2\u5bdf\u76ee\u6807\u7b56\u7565\u7684\u6267\u884c\u8f68\u8ff9\uff0c\u81ea\u52a8\u8bca\u65ad\u5f31\u70b9\u3001\u5408\u6210\u73af\u5883\u7ec4\u4ef6\u5e76\u7528\u65b0 rollout \u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u9759\u6001 benchmark \u8f6c\u5316\u4e3a\u53ef\u81ea\u9002\u5e94\u7684\u8bad\u7ec3\u73af\u5883\uff0c\u4e3a LLM agent \u63d0\u4f9b\u66f4\u6301\u7eed\u3001\u9488\u5bf9\u6027\u7684\u5f3a\u5316\u5b66\u4e60\u4fe1\u53f7\uff0c\u517c\u5177\u901a\u7528\u6027\u548c\u5de5\u7a0b\u53ef\u843d\u5730\u6027\u3002"}, {"abstract": "Embodied agents are increasingly used to close the gap left by end-to-end policy models. Yet the agentic path has not realized closed-loop learning in physical execution: existing harnesses remain largely open-loop, following fixed skills during rollout and reflecting only after an episode completes. Such post-hoc reflection cannot govern execution as it unfolds, because physical interaction requires decisions to track rapidly changing robot-environment states at a frequency beyond today\u0027s large agentic models. We present Zetta, a closed-loop embodied harness that evolves code-based runtime critics and recovery skills online while keeping the base policy frozen. Through three timescale-separated loops, Zetta provides action-frequency governance, rollout-level critic-recovery proposal, and validation-gated skill updates. Together with Z-Infra, a rollout infrastructure decoupling agent logic from heterogeneous execution resources, Zetta achieves state-of-the-art success on LIBERO-Pro and RoboCasa under our current rollout budget, reaching 90.8% and 93.6%, with an 11.1x inference speedup; success continues to scale with self-exploration experience; learned skills transfer zero-shot, and clear robotic \"Aha Moments\" emerge. These results show that closed-loop harness self-evolution opens a scaling path for reliable physical intelligence.", "arxiv_id": "2608.16590", "arxiv_url": "https://arxiv.org/abs/2608.16590", "authors": ["Xin Ding", "Liang Mi", "Mingzhe Huang", "Zixuan Wang", "Chao Zhang", "Zixu Hao", "Fu Chen", "Xiangyu Li", "Yikai Zheng", "Yaoyu Guo", "Weijun Wang", "Kun Li", "Hao Wu", "Yunxin Liu", "Ting Cao"], "brief": "\u8bba\u6587\u63d0\u51fa Zetta\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u6267\u884c\u7684\u95ed\u73af\u5177\u8eab\u667a\u80fd\u6846\u67b6\uff0c\u5728\u51bb\u7ed3\u57fa\u7840\u7b56\u7565\u7684\u540c\u65f6\uff0c\u5728\u7ebf\u6f14\u5316\u4ee3\u7801\u5316\u8fd0\u884c\u65f6\u8bc4\u4f30\u5668\u4e0e\u6062\u590d\u6280\u80fd\u3002\u5b83\u901a\u8fc7\u591a\u65f6\u95f4\u5c3a\u5ea6\u95ed\u73af\u673a\u5236\uff0c\u5728\u52a8\u4f5c\u6267\u884c\u4e2d\u5373\u65f6\u6cbb\u7406\u3001\u53cd\u601d\u5e76\u9a8c\u8bc1\u66f4\u65b0\u6280\u80fd\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/air-embodied-brain/Zetta-Embodiment", "github_stars": 186, "hf_url": "https://huggingface.co/papers/2608.16590", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u4e09\u5c42\u65f6\u95f4\u5c3a\u5ea6\u95ed\u73af\uff1a\u52a8\u4f5c\u9891\u7387\u6cbb\u7406\u3001\u8f68\u8ff9\u7ea7\u8bc4\u4f30\u5668/\u6062\u590d\u6280\u80fd\u63d0\u6848\u3001\u9a8c\u8bc1\u95e8\u63a7\u7684\u6280\u80fd\u66f4\u65b0\u3002", "\u63d0\u51fa Z-Infra\uff0c\u5c06\u667a\u80fd\u4f53\u903b\u8f91\u4e0e\u5f02\u6784\u673a\u5668\u4eba\u6267\u884c\u8d44\u6e90\u89e3\u8026\uff0c\u63d0\u5347\u5927\u89c4\u6a21 rollout \u4e0e\u81ea\u63a2\u7d22\u6548\u7387\u3002", "\u5728 LIBERO-Pro \u548c RoboCasa \u4e0a\u8fbe\u5230 90.8% \u4e0e 93.6% \u6210\u529f\u7387\uff0c\u5e76\u5b9e\u73b0 11.1 \u500d\u63a8\u7406\u52a0\u901f\uff1b\u6280\u80fd\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u667a\u80fd\u4f53", "\u673a\u5668\u4eba", "\u95ed\u73af\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.16590v1", "published_at": "2026-08-17", "score": 0.53, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (131\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16590.png", "title": "Zetta $\u03b6$: An Efficient Closed-Loop Embodied Harness for Self-Evolving Physical Intelligence", "tldr": "Zetta\u8ba9\u5177\u8eab\u667a\u80fd\u5728\u6267\u884c\u4e2d\u95ed\u73af\u81ea\u8fdb\u5316", "upvotes": 131, "what_it_is": "\u8bba\u6587\u63d0\u51fa Zetta\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u6267\u884c\u7684\u95ed\u73af\u5177\u8eab\u667a\u80fd\u6846\u67b6\uff0c\u5728\u51bb\u7ed3\u57fa\u7840\u7b56\u7565\u7684\u540c\u65f6\uff0c\u5728\u7ebf\u6f14\u5316\u4ee3\u7801\u5316\u8fd0\u884c\u65f6\u8bc4\u4f30\u5668\u4e0e\u6062\u590d\u6280\u80fd\u3002\u5b83\u901a\u8fc7\u591a\u65f6\u95f4\u5c3a\u5ea6\u95ed\u73af\u673a\u5236\uff0c\u5728\u52a8\u4f5c\u6267\u884c\u4e2d\u5373\u65f6\u6cbb\u7406\u3001\u53cd\u601d\u5e76\u9a8c\u8bc1\u66f4\u65b0\u6280\u80fd\u3002", "why_notable": "\u5b83\u628a\u5177\u8eab\u667a\u80fd\u4ece\u4e8b\u540e\u53cd\u601d\u63a8\u8fdb\u5230\u6267\u884c\u8fc7\u7a0b\u4e2d\u7684\u95ed\u73af\u81ea\u8fdb\u5316\uff0c\u4e3a\u53ef\u9760\u673a\u5668\u4eba\u7b56\u7565\u63d0\u4f9b\u4e86\u65b0\u7684\u6269\u5c55\u8def\u5f84\uff0c\u517c\u5177\u6027\u80fd\u63d0\u5347\u3001\u63a8\u7406\u52a0\u901f\u548c\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "Identity-preserving image generation becomes increasingly unreliable when a scene must contain many specified people. Beyond retaining each identity, the model must bind every reference to a distinct person and location, while training-time identity losses must establish correspondence among several noisy predicted faces. We introduce WithEveryone, a unified framework for generating group images up to ten reference identities. WithEveryone injects each selected identity as an addressed token, predicts a structured identity--layout plan, and renders the plan as a visual condition. Its key objective, Layout-Grounded ID Loss, uses annotated face regions to supervise the intended identities directly, avoiding unstable embedding-based face matching; ID Representation Forcing additionally trains a prediction for each identity before image synthesis. On an identity-disjoint benchmark, WithEveryone achieves the highest target-context identity similarity, improving face similarity from 0.462 for GPT-Image-2 to 0.499, while reducing copy-paste artifacts from 0.169 to 0.055. It further covers 97.3\\% of the requested identities with a duplicate rate of only 2.8\\%. These results show that explicit identity--layout grounding enables identity-preserving generation to scale to larger groups without relying on direct reference-face copying.", "arxiv_id": "2608.20336", "arxiv_url": "https://arxiv.org/abs/2608.20336", "authors": ["Hengyuan Xu", "Qixun Wang", "Yiji Cheng", "Miles Yang", "Zhao Zhong", "Wei Cheng", "Xingjun Ma", "Yu-gang Jiang"], "brief": "WithEveryone \u662f\u4e00\u4e2a\u53ef\u751f\u6210\u6700\u591a\u5341\u4e2a\u6307\u5b9a\u8eab\u4efd\u7fa4\u50cf\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u901a\u8fc7\u5c06\u6bcf\u4e2a\u8eab\u4efd\u4f5c\u4e3a\u53ef\u5bfb\u5740 token \u6ce8\u5165\uff0c\u5e76\u9884\u6d4b\u7ed3\u6784\u5316\u8eab\u4efd\u2014\u5e03\u5c40\u89c4\u5212\uff0c\u518d\u4f5c\u4e3a\u89c6\u89c9\u6761\u4ef6\u5f15\u5bfc\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/doby-xu/WithEveryone", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.20336", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Layout-Grounded ID Loss\uff0c\u5229\u7528\u6807\u6ce8\u4eba\u8138\u533a\u57df\u76f4\u63a5\u76d1\u7763\u76ee\u6807\u8eab\u4efd\uff0c\u907f\u514d\u591a\u8138\u573a\u666f\u4e2d\u4e0d\u7a33\u5b9a\u7684\u5d4c\u5165\u5339\u914d\u3002", "\u5f15\u5165 ID Representation Forcing\uff0c\u5728\u56fe\u50cf\u5408\u6210\u524d\u5f3a\u5236\u6a21\u578b\u4e3a\u6bcf\u4e2a\u8eab\u4efd\u5b66\u4e60\u72ec\u7acb\u8868\u793a\u3002", "\u5728\u8eab\u4efd\u4e0d\u91cd\u53e0\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4 GPT-Image-2 \u5c06\u4eba\u8138\u76f8\u4f3c\u5ea6\u4ece 0.462 \u63d0\u5347\u5230 0.499\uff0c\u5e76\u5c06\u590d\u5236\u7c98\u8d34\u4f2a\u5f71\u4ece 0.169 \u964d\u81f3 0.055\u3002"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u8eab\u4efd\u4fdd\u6301", "\u591a\u6a21\u6001", "\u53ef\u63a7\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2608.20336v1", "published_at": "2026-08-20", "score": 0.478, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20336.png", "title": "WithEveryone: Unified Planning and Identity Grounding for Group Image Generation", "tldr": "\u9762\u5411\u591a\u4eba\u5408\u7167\u7684\u8eab\u4efd\u4e00\u81f4\u56fe\u50cf\u751f\u6210\u6846\u67b6", "upvotes": 9, "what_it_is": "WithEveryone \u662f\u4e00\u4e2a\u53ef\u751f\u6210\u6700\u591a\u5341\u4e2a\u6307\u5b9a\u8eab\u4efd\u7fa4\u50cf\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u901a\u8fc7\u5c06\u6bcf\u4e2a\u8eab\u4efd\u4f5c\u4e3a\u53ef\u5bfb\u5740 token \u6ce8\u5165\uff0c\u5e76\u9884\u6d4b\u7ed3\u6784\u5316\u8eab\u4efd\u2014\u5e03\u5c40\u89c4\u5212\uff0c\u518d\u4f5c\u4e3a\u89c6\u89c9\u6761\u4ef6\u5f15\u5bfc\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u591a\u4eba\u8eab\u4efd\u4fdd\u6301\u751f\u6210\u4e2d\u7684\u8eab\u4efd\u7ed1\u5b9a\u3001\u4f4d\u7f6e\u5bf9\u5e94\u548c\u91cd\u590d\u62f7\u8d1d\u95ee\u9898\uff0c\u63d0\u51fa\u663e\u5f0f\u8eab\u4efd\u2014\u5e03\u5c40\u63a5\u5730\u65b9\u6848\uff0c\u4f7f\u6307\u5b9a\u591a\u4eba\u5408\u7167\u751f\u6210\u66f4\u53ef\u63a7\u3001\u66f4\u53ef\u6269\u5c55\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "How to efficiently finetune robot policies to learn new tasks on the fly? State of the art robotic manipulation policies are based on behaviour cloning of large vision-language-action (VLA) models with billions of parameters on huge teleoperation datasets. While this simple approach has enabled significant advances for robotic manipulation, finetuning of VLA policies for learning new tasks still remains an open problem. In particular, collecting teleoperation datasets requires hundreds of hours of expensive human labour and the alternative, reinforcement learning (RL), can be notoriously sample-inefficient especially for long-horizon tasks. In addition, RL with VLAs imposes several challenges due to the model\u0027s size and architectural design. In this work, we propose EXIMO, an efficient algorithm for finetuning of VLA policies. EXIMO operates in three stages: explore, imitate, and optimize. During the explore phase, EXIMO equips the VLA with a vision language model (VLM) that acts as a planner. The VLM thinks and breaks down challenging long-horizon problems into shorter ones for the VLA. The VLM, together with the VLA, is used to collect an orchestrated dataset on new tasks. During the imitate phase, the VLA is finetuned with the orchestrated data. Finally, during the optimize stage, we use residual off-policy RL to further finetune the policy. In our experiments, we ablate all three stages of EXIMO and show that it outperforms existing approaches significantly in terms of sample-efficiency and final performance.", "arxiv_id": "2608.19891", "arxiv_url": "https://arxiv.org/abs/2608.19891", "authors": ["Bhavya Sukhija", "Oliver Groth", "Mohit Shridhar", "Tim Hertweck", "Michael Bloesch", "Markus Wulfmeier", "Abbas Abdolmaleki", "Martin Riedmiller"], "brief": "\u8bba\u6587\u63d0\u51faEXIMO\uff0c\u7528\u4e8e\u9ad8\u6548\u5fae\u8c03\u5927\u578b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\uff08VLA\uff09\u673a\u5668\u4eba\u7b56\u7565\u4ee5\u9002\u5e94\u65b0\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u201c\u63a2\u7d22-\u6a21\u4eff-\u4f18\u5316\u201d\u4e09\u9636\u6bb5\u6d41\u7a0b\uff0c\u8ba9VLM\u5145\u5f53\u89c4\u5212\u5668\u5206\u89e3\u957f\u7a0b\u4efb\u52a1\uff0c\u518d\u7ed3\u5408\u6a21\u4eff\u5b66\u4e60\u4e0e\u6b8b\u5dee\u79bb\u7b56\u7565\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u7b56\u7565\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19891", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63a2\u7d22\u9636\u6bb5\u7531VLM\u8fdb\u884c\u4efb\u52a1\u89c4\u5212\uff0c\u5c06\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u62c6\u89e3\u4e3a\u66f4\u77ed\u5b50\u4efb\u52a1\uff0c\u5e76\u534f\u540cVLA\u6536\u96c6\u65b0\u4efb\u52a1\u6570\u636e", "\u6a21\u4eff\u9636\u6bb5\u7528\u6536\u96c6\u5230\u7684\u7f16\u6392\u6570\u636e\u5fae\u8c03VLA\uff0c\u964d\u4f4e\u5bf9\u6602\u8d35\u4eba\u5de5\u9065\u64cd\u4f5c\u6570\u636e\u7684\u4f9d\u8d56", "\u4f18\u5316\u9636\u6bb5\u91c7\u7528\u6b8b\u5dee\u79bb\u7b56\u7565\u5f3a\u5316\u5b66\u4e60\u8fdb\u4e00\u6b65\u63d0\u5347\u7b56\u7565\uff0c\u5b9e\u9a8c\u663e\u793a\u6837\u672c\u6548\u7387\u548c\u6700\u7ec8\u6027\u80fd\u5747\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": true, "organization": "Deepmind", "pdf_url": "https://arxiv.org/pdf/2608.19891v1", "published_at": "2026-08-20", "score": 0.468, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.19891.png", "title": "EXIMO: VLM Guided Exploration of VLA Policies", "tldr": "VLM\u89c4\u5212\u8f85\u52a9VLA\u9ad8\u6548\u5b66\u4e60\u65b0\u673a\u5668\u4eba\u4efb\u52a1", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51faEXIMO\uff0c\u7528\u4e8e\u9ad8\u6548\u5fae\u8c03\u5927\u578b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\uff08VLA\uff09\u673a\u5668\u4eba\u7b56\u7565\u4ee5\u9002\u5e94\u65b0\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u201c\u63a2\u7d22-\u6a21\u4eff-\u4f18\u5316\u201d\u4e09\u9636\u6bb5\u6d41\u7a0b\uff0c\u8ba9VLM\u5145\u5f53\u89c4\u5212\u5668\u5206\u89e3\u957f\u7a0b\u4efb\u52a1\uff0c\u518d\u7ed3\u5408\u6a21\u4eff\u5b66\u4e60\u4e0e\u6b8b\u5dee\u79bb\u7b56\u7565\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u7b56\u7565\u6027\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5927\u578bVLA\u7b56\u7565\u5728\u7ebf\u5b66\u4e60\u65b0\u4efb\u52a1\u7684\u5173\u952e\u74f6\u9888\uff0c\u7ed3\u5408VLM\u89c4\u5212\u3001\u884c\u4e3a\u514b\u9686\u548c\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u957f\u7a0b\u673a\u5668\u4eba\u4efb\u52a1\u7684\u6837\u672c\u6548\u7387\u4e0e\u53ef\u6269\u5c55\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Credit assignment is challenging in long-horizon agentic reinforcement learning, where supervision often comes only from final rewards. Existing methods refine trajectory-level signals into step-level credits through step grouping or graph-based advantage estimation, but can overlook meaningful intermediate milestones. We propose MileGPO (Milestone Inference with Local Evidence for Graph-Based Policy Optimization), which derives process-level credit from grouped on-policy rollouts through three designs. Milestone Discovery identifies candidate milestones on successful rollouts and recurring traps on failed ones. Reliability-Calibrated Shaping (RCS) weights these candidates by outcome-based confidence, strengthening reliable milestones and traps while down-weighting uncertain ones. Progress-Contrastive Calibration (PCC) further tests whether a candidate reflects local progress and whether its incoming ansition outperforms observed alternatives from the same state.MileGPO requires neither auxiliary models nor additional environment interaction. Experiments on ALFWorld and WebShop show state-of-the-art performance and a small in-distribution to out-of-distribution gap on ALFWorld. Ablations and credit diagnostics indicate that reliability weighting, local progress, and same-state branch evidence complement milestone discovery and resolve ambiguous intermediate credit.", "arxiv_id": "2608.19803", "arxiv_url": "https://arxiv.org/abs/2608.19803", "authors": ["Bo Qian", "Yuting Wu", "Shuang Zeng", "Huaiyu Wan", "Dalin Zhang", "Jiqiang Liu"], "brief": "MileGPO \u662f\u4e00\u79cd\u9762\u5411\u957f\u7a0b LLM \u667a\u80fd\u4f53\u7684\u56fe\u5f0f\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u4ece\u540c\u7b56\u7565\u8f68\u8ff9\u4e2d\u81ea\u52a8\u53d1\u73b0\u6210\u529f\u91cc\u7a0b\u7891\u4e0e\u5931\u8d25\u9677\u9631\uff0c\u5e76\u5c06\u6700\u7ec8\u5956\u52b1\u7ec6\u5316\u4e3a\u8fc7\u7a0b\u7ea7\u4fe1\u7528\u4fe1\u53f7\u3002\u5b83\u4e0d\u4f9d\u8d56\u989d\u5916\u6a21\u578b\u6216\u65b0\u589e\u73af\u5883\u4ea4\u4e92\uff0c\u5728 ALFWorld \u4e0e WebShop \u4e0a\u63d0\u5347\u4e86\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19803", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Milestone Discovery \u4ece\u6210\u529f\u8f68\u8ff9\u4e2d\u63d0\u53d6\u5019\u9009\u91cc\u7a0b\u7891\uff0c\u5e76\u4ece\u5931\u8d25\u8f68\u8ff9\u4e2d\u8bc6\u522b\u53cd\u590d\u51fa\u73b0\u7684\u9677\u9631\u72b6\u6001\u3002", "Reliability-Calibrated Shaping \u6839\u636e\u7ed3\u679c\u7f6e\u4fe1\u5ea6\u4e3a\u91cc\u7a0b\u7891\u548c\u9677\u9631\u52a0\u6743\uff0c\u5f3a\u5316\u53ef\u9760\u4e2d\u95f4\u4fe1\u53f7\u3001\u524a\u5f31\u4e0d\u786e\u5b9a\u4fe1\u53f7\u3002", "Progress-Contrastive Calibration \u5229\u7528\u5c40\u90e8\u8fdb\u5c55\u548c\u540c\u72b6\u6001\u5206\u652f\u5bf9\u6bd4\uff0c\u5224\u65ad\u67d0\u4e2a\u8f6c\u79fb\u662f\u5426\u4f18\u4e8e\u53ef\u89c2\u6d4b\u66ff\u4ee3\u8def\u5f84\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u7b56\u7565\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19803v1", "published_at": "2026-08-20", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MileGPO: Milestone Inference with Local Evidence for Graph-Based Policy Optimization of Long-Horizon LLM Agents", "tldr": "\u7528\u91cc\u7a0b\u7891\u63a8\u65ad\u6539\u8fdb\u957f\u7a0b\u667a\u80fd\u4f53\u4fe1\u7528\u5206\u914d", "upvotes": 0, "what_it_is": "MileGPO \u662f\u4e00\u79cd\u9762\u5411\u957f\u7a0b LLM \u667a\u80fd\u4f53\u7684\u56fe\u5f0f\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u4ece\u540c\u7b56\u7565\u8f68\u8ff9\u4e2d\u81ea\u52a8\u53d1\u73b0\u6210\u529f\u91cc\u7a0b\u7891\u4e0e\u5931\u8d25\u9677\u9631\uff0c\u5e76\u5c06\u6700\u7ec8\u5956\u52b1\u7ec6\u5316\u4e3a\u8fc7\u7a0b\u7ea7\u4fe1\u7528\u4fe1\u53f7\u3002\u5b83\u4e0d\u4f9d\u8d56\u989d\u5916\u6a21\u578b\u6216\u65b0\u589e\u73af\u5883\u4ea4\u4e92\uff0c\u5728 ALFWorld \u4e0e WebShop \u4e0a\u63d0\u5347\u4e86\u4efb\u52a1\u8868\u73b0\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u7a0b\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u7a00\u758f\u7ec8\u5c40\u5956\u52b1\u548c\u4fe1\u7528\u5206\u914d\u96be\u9898\uff0c\u63d0\u4f9b\u4e86\u65e0\u9700\u989d\u5916\u4ea4\u4e92\u6210\u672c\u7684\u8fc7\u7a0b\u76d1\u7763\u6784\u9020\u65b9\u5f0f\uff1b\u5728\u5178\u578b\u4ea4\u4e92\u5f0f\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u8fbe\u5230\u9886\u5148\u6027\u80fd\uff0c\u5e76\u663e\u793a\u51fa\u8f83\u597d\u7684\u5206\u5e03\u5916\u6cdb\u5316\u6f5c\u529b\u3002"}, {"abstract": "Agentic language models repeatedly encode tool and skill schemas that recur across requests in different combinations and orders, preventing standard prefix caching from reusing their key--value (KV) states. We introduce \\textbf{ReCache}, a framework for independently caching resource representations while reducing their inference-time computational and memory overhead. Resource-wise attention removes cross-resource interactions and assigns resource-local positions, producing composition-invariant KV blocks. ReCache then restricts resource visibility to contribution-selected layer--KV-head-group routes and retains only invocation-critical fields through structural and semantic pruning. We evaluate ReCache on a benchmark assembled from seven public tool- and skill-use datasets, including resource-disjoint tests. Resource-wise attention matches dense invocation performance (82.3\\% versus 82.4\\% Inv-F1) while providing a 3.655$\\times$ time-to-first-token speedup. The complete framework reduces allocated KV-tensor memory by 92.43\\% and accelerates attention by 1.423$\\times$. These results show that separating reusable schema encoding from selective resource access substantially reduces agentic inference costs with limited effectiveness loss. The code is available at https://github.com/EIT-NLP/ReCache.", "arxiv_id": "2608.19662", "arxiv_url": "https://arxiv.org/abs/2608.19662", "authors": ["Yichu Fang", "Sitong Wei", "Haozhe Hu", "Xiaoyu Shen"], "brief": "ReCache \u662f\u9762\u5411\u5de5\u5177\u589e\u5f3a\u578b LLM \u667a\u80fd\u4f53\u7684 KV \u7f13\u5b58\u590d\u7528\u4e0e\u538b\u7f29\u6846\u67b6\u3002\u5b83\u5c06\u5de5\u5177/\u6280\u80fd schema \u7684\u8868\u793a\u6309\u8d44\u6e90\u72ec\u7acb\u7f13\u5b58\uff0c\u4f7f\u4e0d\u540c\u8bf7\u6c42\u4e2d\u987a\u5e8f\u548c\u7ec4\u5408\u53d8\u5316\u7684\u8d44\u6e90\u4e5f\u80fd\u590d\u7528 KV \u72b6\u6001\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19662", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa resource-wise attention\uff0c\u79fb\u9664\u8de8\u8d44\u6e90\u4ea4\u4e92\u5e76\u5206\u914d\u8d44\u6e90\u5c40\u90e8\u4f4d\u7f6e\uff0c\u751f\u6210\u5bf9\u7ec4\u5408\u4e0e\u987a\u5e8f\u4e0d\u654f\u611f\u7684 KV \u5757", "\u901a\u8fc7\u8d21\u732e\u9009\u62e9\u7684\u5c42-KV\u5934\u7ec4\u8def\u7531\u9650\u5236\u8d44\u6e90\u53ef\u89c1\u6027\uff0c\u5e76\u7ed3\u5408\u7ed3\u6784\u4e0e\u8bed\u4e49\u526a\u679d\uff0c\u4ec5\u4fdd\u7559\u8c03\u7528\u5173\u952e\u5b57\u6bb5", "\u5728\u4e03\u4e2a\u516c\u5f00\u5de5\u5177/\u6280\u80fd\u4f7f\u7528\u6570\u636e\u96c6\u7ec4\u6210\u7684\u57fa\u51c6\u4e0a\uff0cInv-F1 \u51e0\u4e4e\u4e0d\u964d\uff0882.3% vs 82.4%\uff09\uff0cTTFT \u63d0\u901f 3.655 \u500d\uff0cKV \u663e\u5b58\u51cf\u5c11 92.43%"], "keywords": ["\u667a\u80fd\u4f53", "KV\u7f13\u5b58", "\u5de5\u5177\u8c03\u7528", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19662v1", "published_at": "2026-08-20", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ReCache: Efficient KV Cache Reuse and Compression for Tool-Augmented LLM Agents", "tldr": "\u590d\u7528\u5e76\u538b\u7f29\u5de5\u5177Schema\u7684KV\u7f13\u5b58\u4ee5\u52a0\u901f\u667a\u80fd\u4f53\u63a8\u7406", "upvotes": 0, "what_it_is": "ReCache \u662f\u9762\u5411\u5de5\u5177\u589e\u5f3a\u578b LLM \u667a\u80fd\u4f53\u7684 KV \u7f13\u5b58\u590d\u7528\u4e0e\u538b\u7f29\u6846\u67b6\u3002\u5b83\u5c06\u5de5\u5177/\u6280\u80fd schema \u7684\u8868\u793a\u6309\u8d44\u6e90\u72ec\u7acb\u7f13\u5b58\uff0c\u4f7f\u4e0d\u540c\u8bf7\u6c42\u4e2d\u987a\u5e8f\u548c\u7ec4\u5408\u53d8\u5316\u7684\u8d44\u6e90\u4e5f\u80fd\u590d\u7528 KV \u72b6\u6001\u3002", "why_notable": "\u5de5\u5177\u578b\u667a\u80fd\u4f53\u5e38\u53cd\u590d\u7f16\u7801\u5927\u91cf\u76f8\u4f3c\u5de5\u5177 schema\uff0c\u5e26\u6765\u663e\u8457\u63a8\u7406\u6210\u672c\uff1bReCache \u9488\u5bf9\u6807\u51c6 prefix cache \u96be\u4ee5\u590d\u7528\u201c\u4e71\u5e8f/\u7ec4\u5408\u53d8\u5316\u201d\u5de5\u5177\u63cf\u8ff0\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u9ad8\u590d\u7528\u3001\u4f4e\u663e\u5b58\u3001\u4f4e\u635f\u5931\u7684\u7cfb\u7edf\u6027\u65b9\u6848\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "LLM-based agents can act on behalf of a user to access cloud services, call tools, or invoke agents. At session start, the agent\u0027s permissions are set but remain static, and each request is evaluated independently, without considering prior actions. Within its permissions, an agent may act contrary to the delegated task, combine individually permitted actions into a prohibited outcome, or delegate authority to a sub-agent without limiting it. A prompt injection poses a risk only if the agent has authority to perform such actions; this is therefore a problem of authorization architecture, not just the model. The Agentic Principal Chain (APC) tracks delegated authority from one principal to the next. APC evaluates each request against the accumulated session state using six authorization checks. APC carries forward and restricts delegated scope and budgets. Using composition closure, APC checks requests against prior actions to prevent prohibited combinations and enforces the decision outside the model. We prove Blast Radius Monotonicity and Composition Soundness for APC implementations; Composition Soundness is limited to prohibited combinations under a complete restriction set and serialized admission. We evaluated 3,154 instances including InjecAgent, AgentDojo, and ASB. Our compromised-model evaluation tests APC independently of model behavior by inserting the ground-truth attack call after the first legitimate tool call. AgentDojo exfiltration fell from 75-100% to 0% across all four domains; APC blocked all 544 InjecAgent data-stealing cases. Intent binding reduced destruction from 38.6% to 4.0% and manipulation from 90.5% to 12.1%. Authorization latency was 0.24 ms at the 99th percentile on an idle host; across 949 AgentDojo task-injection pairs, utility was 8.6 and 13.9 percentage points lower in the two settings. Implementation, evaluation tools, and data are publicly available.", "arxiv_id": "2608.15888", "arxiv_url": "https://arxiv.org/abs/2608.15888", "authors": ["Xabier Muruaga"], "brief": "\u8bba\u6587\u63d0\u51fa Agentic Principal Chain\uff08APC\uff09\u6388\u6743\u67b6\u6784\uff0c\u7528\u4f1a\u8bdd\u72b6\u6001\u8ddf\u8e2a\u7528\u6237\u3001\u667a\u80fd\u4f53\u4e0e\u5b50\u667a\u80fd\u4f53\u4e4b\u95f4\u7684\u59d4\u6258\u6743\u9650\uff0c\u5e76\u5728\u6a21\u578b\u5916\u6267\u884c\u516d\u7c7b\u6388\u6743\u68c0\u67e5\u3002\u5b83\u901a\u8fc7\u9650\u5236\u4f5c\u7528\u57df\u3001\u9884\u7b97\u4e0e\u52a8\u4f5c\u7ec4\u5408\uff0c\u9632\u6b62\u63d0\u793a\u6ce8\u5165\u6216\u8d8a\u6743\u59d4\u6258\u628a\u5355\u4e2a\u5141\u8bb8\u64cd\u4f5c\u7ec4\u5408\u6210\u8fdd\u89c4\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": "https://github.com/xmuruaga/bounded-agents", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.15888", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["APC \u5c06\u6bcf\u6b21\u8bf7\u6c42\u653e\u5165\u7d2f\u79ef\u4f1a\u8bdd\u72b6\u6001\u4e2d\u8bc4\u4f30\uff0c\u800c\u975e\u9759\u6001\u6743\u9650\u548c\u5355\u6b21\u72ec\u7acb\u5224\u65ad\uff0c\u5e76\u652f\u6301\u8de8\u4e3b\u4f53\u7684\u59d4\u6258\u6743\u9650\u4f20\u9012\u4e0e\u6536\u7f29\u3002", "\u63d0\u51fa\u7ec4\u5408\u95ed\u5305\u68c0\u67e5\u3001\u610f\u56fe\u7ed1\u5b9a\u548c\u6a21\u578b\u5916\u5f3a\u5236\u6267\u884c\uff0c\u5e76\u8bc1\u660e Blast Radius Monotonicity \u4e0e Composition Soundness \u7b49\u5b89\u5168\u6027\u8d28\u3002", "\u5728 InjecAgent\u3001AgentDojo\u3001ASB \u7b49 3154 \u4e2a\u5b9e\u4f8b\u4e0a\u8bc4\u4f30\uff1aAgentDojo \u6570\u636e\u5916\u6cc4\u4ece 75-100% \u964d\u81f3 0%\uff0c\u963b\u65ad 544 \u4e2a InjecAgent \u7a83\u53d6\u6848\u4f8b\uff0c99 \u5206\u4f4d\u6388\u6743\u5ef6\u8fdf\u4ec5 0.24 ms\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168", "\u6743\u9650\u63a7\u5236", "\u63d0\u793a\u6ce8\u5165"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15888v1", "published_at": "2026-08-16", "score": 0.42, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15888.png", "title": "Bounded Agents: Delegation Security for Multi-Agent AI Systems", "tldr": "\u7528\u6388\u6743\u94fe\u9650\u5236\u591a\u667a\u80fd\u4f53\u59d4\u6258\u98ce\u9669", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agentic Principal Chain\uff08APC\uff09\u6388\u6743\u67b6\u6784\uff0c\u7528\u4f1a\u8bdd\u72b6\u6001\u8ddf\u8e2a\u7528\u6237\u3001\u667a\u80fd\u4f53\u4e0e\u5b50\u667a\u80fd\u4f53\u4e4b\u95f4\u7684\u59d4\u6258\u6743\u9650\uff0c\u5e76\u5728\u6a21\u578b\u5916\u6267\u884c\u516d\u7c7b\u6388\u6743\u68c0\u67e5\u3002\u5b83\u901a\u8fc7\u9650\u5236\u4f5c\u7528\u57df\u3001\u9884\u7b97\u4e0e\u52a8\u4f5c\u7ec4\u5408\uff0c\u9632\u6b62\u63d0\u793a\u6ce8\u5165\u6216\u8d8a\u6743\u59d4\u6258\u628a\u5355\u4e2a\u5141\u8bb8\u64cd\u4f5c\u7ec4\u5408\u6210\u8fdd\u89c4\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u5b89\u5168\u95ee\u9898\u4ece\u201c\u8ba9\u6a21\u578b\u66f4\u53ef\u9760\u201d\u8f6c\u5411\u201c\u6388\u6743\u67b6\u6784\u53ef\u9a8c\u8bc1\u7ea6\u675f\u201d\uff0c\u5bf9\u591a\u667a\u80fd\u4f53\u3001\u5de5\u5177\u8c03\u7528\u548c\u4e91\u670d\u52a1\u4ee3\u7406\u573a\u666f\u5177\u6709\u5f88\u5f3a\u5b9e\u7528\u4ef7\u503c\uff1b\u540c\u65f6\u7ed9\u51fa\u5f62\u5f0f\u5316\u6027\u8d28\u3001\u516c\u5f00\u5b9e\u73b0\u4e0e\u5927\u89c4\u6a21\u57fa\u51c6\u8bc4\u4f30\u3002"}, {"abstract": "Customer-service LLM agents must follow organizational policy when acting on a user\u0027s behalf. Compliance failures arise from either forbidden actions, such as granting an ineligible change, or omitted procedural requirements, such as identification or confirmation. Runtime safeguards can intervene on risky actions, but action-local checks do not guide an agent through a multi-step procedure. Workflow-following systems support prescribed process execution, but primarily target workflow completion rather than safeguarding agent behavior. PolicyGuide instead compiles each domain policy into a workflow graph and invokes a proactive verifier at user-turn boundaries. From persisted graph state, the verifier reconciles open requests and returns step-specific remediation along a policy-compliant path. Across the $\u03c4^2$-bench airline, retail, and telecom domains with a GPT-5.4 agent and verifier, PolicyGuide raises mean $\\mathrm{Pass}^4$ from $0.42$ to $0.62$, with the largest gain on telecom ($0.19$ to $0.61$), the most workflow-structured domain. The same workflows transfer to Claude Sonnet 4.6 and Gemini 2.5 Pro agents. Complementary evaluations find the lowest observed attack-success rate under adversarial users and the strongest procedural compliance in an author-designed workflow-level validation.", "arxiv_id": "2608.19861", "arxiv_url": "https://arxiv.org/abs/2608.19861", "authors": ["Seongjae Kang", "Taehyung Yu", "Sung Ju Hwang"], "brief": "PolicyGuide \u5c06\u7ec4\u7ec7/\u9886\u57df\u653f\u7b56\u7f16\u8bd1\u4e3a\u5de5\u4f5c\u6d41\u56fe\uff0c\u5e76\u5728\u6bcf\u4e2a\u7528\u6237\u8f6e\u6b21\u8fb9\u754c\u8c03\u7528\u4e3b\u52a8\u9a8c\u8bc1\u5668\u3002\u9a8c\u8bc1\u5668\u57fa\u4e8e\u6301\u4e45\u5316\u56fe\u72b6\u6001\u8bc6\u522b\u672a\u5b8c\u6210\u8bf7\u6c42\uff0c\u7ed9\u51fa\u9762\u5411\u5177\u4f53\u6b65\u9aa4\u7684\u8865\u6551\u5efa\u8bae\uff0c\u5f15\u5bfc LLM \u5ba2\u670d\u667a\u80fd\u4f53\u6cbf\u5408\u89c4\u8def\u5f84\u5b8c\u6210\u591a\u6b65\u6d41\u7a0b\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/erjui/PolicyGuide", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19861", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u533a\u522b\u4e8e\u4ec5\u68c0\u67e5\u5355\u4e2a\u9ad8\u98ce\u9669\u52a8\u4f5c\u7684\u8fd0\u884c\u65f6\u62a4\u680f\uff0cPolicyGuide \u8986\u76d6\u8eab\u4efd\u9a8c\u8bc1\u3001\u786e\u8ba4\u3001\u8d44\u683c\u5224\u65ad\u7b49\u8de8\u6b65\u9aa4\u7a0b\u5e8f\u6027\u8981\u6c42\u3002", "\u5728 \u03c4\u00b2-bench \u7684\u822a\u7a7a\u3001\u96f6\u552e\u3001\u7535\u4fe1\u4efb\u52a1\u4e0a\uff0c\u5c06\u5e73\u5747 Pass\u2074 \u4ece 0.42 \u63d0\u5347\u5230 0.62\uff1b\u7535\u4fe1\u9886\u57df\u63d0\u5347\u6700\u5927\uff0c\u4ece 0.19 \u5230 0.61\u3002", "\u540c\u4e00\u5957\u5de5\u4f5c\u6d41\u53ef\u8fc1\u79fb\u5230 Claude Sonnet 4.6 \u548c Gemini 2.5 Pro \u7b49\u4e0d\u540c\u667a\u80fd\u4f53\uff0c\u5e76\u5728\u5bf9\u6297\u7528\u6237\u6d4b\u8bd5\u4e2d\u8868\u73b0\u51fa\u66f4\u4f4e\u653b\u51fb\u6210\u529f\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u4f5c\u6d41", "\u5b89\u5168\u5bf9\u9f50", "\u5408\u89c4\u9a8c\u8bc1"], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2608.19861v1", "published_at": "2026-08-20", "score": 0.373, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.19861.png", "title": "PolicyGuide: From Guarding One Action to Guiding the Whole Workflow for Policy-Compliant LLM Agents", "tldr": "\u5c06\u653f\u7b56\u7f16\u8bd1\u6210\u5de5\u4f5c\u6d41\uff0c\u5f15\u5bfc\u5ba2\u670d\u667a\u80fd\u4f53\u5408\u89c4\u6267\u884c\u3002", "upvotes": 1, "what_it_is": "PolicyGuide \u5c06\u7ec4\u7ec7/\u9886\u57df\u653f\u7b56\u7f16\u8bd1\u4e3a\u5de5\u4f5c\u6d41\u56fe\uff0c\u5e76\u5728\u6bcf\u4e2a\u7528\u6237\u8f6e\u6b21\u8fb9\u754c\u8c03\u7528\u4e3b\u52a8\u9a8c\u8bc1\u5668\u3002\u9a8c\u8bc1\u5668\u57fa\u4e8e\u6301\u4e45\u5316\u56fe\u72b6\u6001\u8bc6\u522b\u672a\u5b8c\u6210\u8bf7\u6c42\uff0c\u7ed9\u51fa\u9762\u5411\u5177\u4f53\u6b65\u9aa4\u7684\u8865\u6551\u5efa\u8bae\uff0c\u5f15\u5bfc LLM \u5ba2\u670d\u667a\u80fd\u4f53\u6cbf\u5408\u89c4\u8def\u5f84\u5b8c\u6210\u591a\u6b65\u6d41\u7a0b\u3002", "why_notable": "\u8bba\u6587\u628a\u201c\u5408\u89c4\u62a4\u680f\u201d\u4ece\u52a8\u4f5c\u7ea7\u62e6\u622a\u63a8\u8fdb\u5230\u6d41\u7a0b\u7ea7\u5f15\u5bfc\uff0c\u89e3\u51b3\u5ba2\u670d\u667a\u80fd\u4f53\u5e38\u89c1\u7684\u9057\u6f0f\u6b65\u9aa4\u4e0e\u8fdd\u89c4\u6267\u884c\u95ee\u9898\uff1b\u5bf9\u771f\u5b9e\u4f01\u4e1a\u573a\u666f\u4e2d\u7684\u53ef\u63a7\u3001\u53ef\u5ba1\u8ba1 LLM agent \u90e8\u7f72\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Programmable logic controllers (PLCs) run industrial plants, and large language models can already generate independent program organization units (POUs) for them. Whether such logic integrates into an existing PLC project and then runs correctly has been checked only in limited tests. We present \\textsc{SemaPLC}, a project-grounded and verification-gated agent harness assembled from conventional tools but governed by a strict completion rule. Rather than stopping when the model judges its own output adequate, \\textsc{SemaPLC} declares a task complete only when logged external checks confirm it. Those checks cover the specification, the compilation, and the behavior on a live runtime. On 117 independent-POU tasks matching existing benchmarks, it attains the highest strict verified pass rate on all seven models (72.6\\% mean). On a project-context track of 65 tasks whose generated logic must compile and run inside a real project, it attains the highest mean on integrated compilation, static behavior, and dynamic behavior. Of the three layers, dynamic behavior is the most revealing. We measure it by deploying the generated and the reference logic to a live PLC runtime and comparing their executed traces. All methods fall within 10 static points of one another, whereas dynamic scores separate them sharply, from 22.4 to 31.4 for the baselines against 52.2 for \\textsc{SemaPLC}. Overall, our verification-gated harness raises the mean at every layer and most sharply at runtime. Execution, not static scoring, is the faithful test of whether generated control logic actually works. \\textsc{SemaPLC} is open-sourced at https://github.com/midea-ai/SemaPLC.", "arxiv_id": "2608.18565", "arxiv_url": "https://arxiv.org/abs/2608.18565", "authors": ["Yanlun Tu", "Huacan Wang", "Ziyue Zhou", "Jie Zhou", "Ningyan Zhu", "Ge Chen", "Wangyi Chen", "Tengfei Zhou", "Yifan Zhou", "Dasheng Yang", "Xiaofeng Mou", "Hui Zhang", "Yi Xu"], "brief": "\u8bba\u6587\u63d0\u51fa SemaPLC\uff0c\u4e00\u4e2a\u9762\u5411 PLC \u9879\u76ee\u4e0a\u4e0b\u6587\u7684\u9a8c\u8bc1\u95e8\u63a7\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u4e0d\u4f9d\u8d56\u6a21\u578b\u81ea\u8bc4\uff0c\u800c\u4ee5\u89c4\u683c\u68c0\u67e5\u3001\u7f16\u8bd1\u68c0\u67e5\u548c\u771f\u5b9e\u8fd0\u884c\u65f6\u884c\u4e3a\u9a8c\u8bc1\u4f5c\u4e3a\u4efb\u52a1\u5b8c\u6210\u6761\u4ef6\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/midea-ai/SemaPLC", "github_stars": 37, "hf_url": "https://huggingface.co/papers/2608.18565", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5728117\u4e2a\u72ec\u7acb POU \u4efb\u52a1\u4e0a\uff0c7\u4e2a\u6a21\u578b\u5747\u53d6\u5f97\u6700\u9ad8\u4e25\u683c\u9a8c\u8bc1\u901a\u8fc7\u7387\uff0c\u5e73\u574772.6%\u3002", "\u572865\u4e2a\u771f\u5b9e\u9879\u76ee\u96c6\u6210\u4efb\u52a1\u4e2d\uff0c\u540c\u65f6\u8bc4\u4f30\u96c6\u6210\u7f16\u8bd1\u3001\u9759\u6001\u884c\u4e3a\u548c\u52a8\u6001\u884c\u4e3a\uff0cSemaPLC\u5e73\u5747\u8868\u73b0\u6700\u4f73\u3002", "\u52a8\u6001\u8fd0\u884c\u65f6\u9a8c\u8bc1\u6700\u80fd\u533a\u5206\u65b9\u6cd5\uff1a\u57fa\u7ebf\u52a8\u6001\u5206\u6570\u4e3a22.4\u523031.4\uff0cSemaPLC\u8fbe\u523052.2\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u7a0b\u5e8f\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": "Midea AI Research Center", "pdf_url": "https://arxiv.org/pdf/2608.18565v1", "published_at": "2026-08-19", "score": 0.336, "selected_reasons": ["HF trending (111\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18565.png", "title": "SemaPLC: A Project-Grounded, Verification-Gated Agent Harness for PLC Code Generation", "tldr": "\u7528\u5916\u90e8\u9a8c\u8bc1\u9a71\u52a8PLC\u4ee3\u7801\u751f\u6210\u667a\u80fd\u4f53\u3002", "upvotes": 111, "what_it_is": "\u8bba\u6587\u63d0\u51fa SemaPLC\uff0c\u4e00\u4e2a\u9762\u5411 PLC \u9879\u76ee\u4e0a\u4e0b\u6587\u7684\u9a8c\u8bc1\u95e8\u63a7\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u4e0d\u4f9d\u8d56\u6a21\u578b\u81ea\u8bc4\uff0c\u800c\u4ee5\u89c4\u683c\u68c0\u67e5\u3001\u7f16\u8bd1\u68c0\u67e5\u548c\u771f\u5b9e\u8fd0\u884c\u65f6\u884c\u4e3a\u9a8c\u8bc1\u4f5c\u4e3a\u4efb\u52a1\u5b8c\u6210\u6761\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aPLC\u4ee3\u7801\u751f\u6210\u4ece\u9759\u6001\u8bc4\u5206\u63a8\u8fdb\u5230\u771f\u5b9e\u8fd0\u884c\u65f6\u9a8c\u8bc1\uff0c\u5f3a\u8c03\u5de5\u4e1a\u63a7\u5236\u903b\u8f91\u5fc5\u987b\u5728\u9879\u76ee\u4e2d\u53ef\u7f16\u8bd1\u3001\u53ef\u90e8\u7f72\u3001\u884c\u4e3a\u6b63\u786e\uff0c\u5bf9\u9ad8\u53ef\u9760\u4ee3\u7801\u751f\u6210\u548c\u5de5\u7a0b\u5316\u667a\u80fd\u4f53\u8bc4\u6d4b\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) has emerged as a powerful approach for improving reasoning in language and vision-language models, yet its strongest successes still depend heavily on ground-truth supervision (e.g., verifiable reward). Such annotations are costly to obtain and become increasingly scarce as reasoning capabilities advance beyond what humans can reliably evaluate. Self-rewarding RL reduces this dependence by enabling models to derive reward signals from their own completions. However, training solely on self-generated feedback can reinforce existing biases and suboptimal behaviors, reduce response diversity, and ultimately lead to homogenized responses and training collapse. In this work, we show that unsupervised reasoning can emerge through cooperative multi-agent training. We introduce Co-RL, a framework in which multiple decoupled models, sharing no parameters, are simultaneously optimized through RL using rewards derived from their peers. We further show that increasing cohort diversity, through heterogeneous model families, sizes, and rephrased training samples, reduces the correlated errors that drive self-reinforcing feedback loops. This diversity consistently improves reasoning performance, maintains behavioral diversity, and mitigates training collapse. Across text-only and multimodal domains, Co-RL consistently outperforms the base models and prior label-free approaches, while matching or surpassing supervised methods, without access to any ground-truth labels. Concretely, Co-RL yields average gains of 3.0-8.6% across seven text-only benchmarks for LLMs and 2.3-7.2% across four multimodal benchmarks for VLMs. Code is available at https://github.com/DrStranded/Co-RL.", "arxiv_id": "2608.17253", "arxiv_url": "https://arxiv.org/abs/2608.17253", "authors": ["Yunhao Yang", "Yuexin Bian", "Yunjie Tian", "Di Fu", "Tianjin Huang", "Yuanyuan Shi", "Ziang Xiao", "Nuno Vasconcelos", "Yijiang Li"], "brief": "\u8bba\u6587\u63d0\u51fa Co-RL\uff1a\u8ba9\u591a\u4e2a\u4e0d\u5171\u4eab\u53c2\u6570\u7684\u8bed\u8a00/\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5f3a\u5316\u5b66\u4e60\u4e2d\u76f8\u4e92\u63d0\u4f9b\u5956\u52b1\u4fe1\u53f7\uff0c\u4ece\u800c\u5728\u65e0\u6807\u6ce8\u6761\u4ef6\u4e0b\u6d8c\u73b0\u63a8\u7406\u80fd\u529b\u3002\u4f5c\u8005\u5f3a\u8c03\u901a\u8fc7\u6a21\u578b\u5bb6\u65cf\u3001\u89c4\u6a21\u548c\u8bad\u7ec3\u6837\u672c\u6539\u5199\u5e26\u6765\u7684\u7fa4\u4f53\u591a\u6837\u6027\uff0c\u964d\u4f4e\u76f8\u5173\u9519\u8bef\u4e0e\u81ea\u6211\u5f3a\u5316\u504f\u5dee\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": "https://github.com/DrStranded/Co-RL", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.17253", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 peer-derived rewards\uff0c\u907f\u514d\u4f9d\u8d56\u4eba\u5de5\u6807\u6ce8\u6216\u53ef\u9a8c\u8bc1\u5956\u52b1\uff0c\u540c\u65f6\u7f13\u89e3\u5355\u6a21\u578b\u81ea\u5956\u52b1\u5bfc\u81f4\u7684\u504f\u5dee\u653e\u5927\u4e0e\u8bad\u7ec3\u5d29\u6e83\u3002", "\u901a\u8fc7\u5f02\u6784\u6a21\u578b\u3001\u4e0d\u540c\u89c4\u6a21\u6a21\u578b\u548c\u91cd\u8ff0\u8bad\u7ec3\u6837\u672c\u6784\u5efa\u591a\u6837\u5316 cohort\uff0c\u51cf\u5c11\u76f8\u5173\u9519\u8bef\u5e76\u4fdd\u6301\u56de\u7b54\u591a\u6837\u6027\u3002", "\u57287\u4e2a\u6587\u672c\u63a8\u7406\u57fa\u51c6\u4e0a\u5e73\u5747\u63d0\u53473.0-8.6%\uff0c\u57284\u4e2a\u591a\u6a21\u6001\u57fa\u51c6\u4e0a\u63d0\u53472.3-7.2%\uff0c\u53ef\u5339\u914d\u6216\u8d85\u8fc7\u90e8\u5206\u76d1\u7763\u65b9\u6cd5\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u591a\u667a\u80fd\u4f53", "\u63a8\u7406", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "University of California at San Diego", "pdf_url": "https://arxiv.org/pdf/2608.17253v2", "published_at": "2026-08-18", "score": 0.333, "selected_reasons": ["HF trending (86\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.17253.png", "title": "Co-RL: Unsupervised Reasoning Emerges from Diverse Cohort in Multi-agent RL", "tldr": "\u591a\u6a21\u578b\u4e92\u8bc4RL\u65e0\u76d1\u7763\u63d0\u5347\u63a8\u7406\u80fd\u529b", "upvotes": 86, "what_it_is": "\u8bba\u6587\u63d0\u51fa Co-RL\uff1a\u8ba9\u591a\u4e2a\u4e0d\u5171\u4eab\u53c2\u6570\u7684\u8bed\u8a00/\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5f3a\u5316\u5b66\u4e60\u4e2d\u76f8\u4e92\u63d0\u4f9b\u5956\u52b1\u4fe1\u53f7\uff0c\u4ece\u800c\u5728\u65e0\u6807\u6ce8\u6761\u4ef6\u4e0b\u6d8c\u73b0\u63a8\u7406\u80fd\u529b\u3002\u4f5c\u8005\u5f3a\u8c03\u901a\u8fc7\u6a21\u578b\u5bb6\u65cf\u3001\u89c4\u6a21\u548c\u8bad\u7ec3\u6837\u672c\u6539\u5199\u5e26\u6765\u7684\u7fa4\u4f53\u591a\u6837\u6027\uff0c\u964d\u4f4e\u76f8\u5173\u9519\u8bef\u4e0e\u81ea\u6211\u5f3a\u5316\u504f\u5dee\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u65e0\u76d1\u7763\u63a8\u7406\u8bad\u7ec3\u63d0\u4f9b\u4e86\u4e00\u4e2a\u6709\u5b9e\u8bc1\u652f\u6491\u7684\u591a\u667a\u80fd\u4f53/\u591a\u6a21\u578b\u534f\u4f5c\u8303\u5f0f\uff0c\u964d\u4f4e\u4e86\u5bf9\u6602\u8d35\u6807\u6ce8\u5956\u52b1\u7684\u4f9d\u8d56\uff0c\u5e76\u9488\u5bf9\u81ea\u5956\u52b1RL\u5e38\u89c1\u7684\u540c\u8d28\u5316\u548c\u5d29\u6e83\u95ee\u9898\u7ed9\u51fa\u53ef\u6269\u5c55\u89e3\u51b3\u601d\u8def\u3002"}, {"abstract": "Open-weight language models are fine-tuned, quantized, pruned, and merged, yet their provenance is often undocumented. We study data-free white-box lineage verification: can weights alone reveal whether two compatible model checkpoints share ancestry? Residual training produces a shared identity-aligned component in branch products, so this structure alone cannot establish ancestry. We remove it and compare checkpoint-specific structure across residual blocks, yielding a symmetric lineage score calibrated against independent checkpoints. On residual-MLP and GPT-2 benchmarks, the score separates fine-tuned, LoRA-merged, pruned, and quantized descendants from independent and distilled models (AUROC=1.0), distinguishing weight ancestry from behavioral similarity. Under function-preserving checkpoint laundering experiments, weight-space baselines lose margin or fail; our score remains unchanged and runs 76x faster than the nearest robust baseline on GPT-2. The projection-pairing signal appears across six language-model families and beyond, and a case study correctly identifies 3 related and 7 unrelated LLaMA-2 public checkpoints. Collectively, these results establish a passive, data-free provenance signal for compatible open-weight language-model checkpoints", "arxiv_id": "2608.14929", "arxiv_url": "https://arxiv.org/abs/2608.14929", "authors": ["Aman Singh Thakur", "Rayan Khoury"], "brief": "\u8bba\u6587\u7814\u7a76\u65e0\u6570\u636e\u767d\u76d2\u6a21\u578b\u8840\u7f18\u9a8c\u8bc1\uff1a\u5224\u65ad\u4e24\u4e2a\u517c\u5bb9\u8bed\u8a00\u6a21\u578b checkpoint \u662f\u5426\u5171\u4eab\u8bad\u7ec3\u7956\u5148\u3002\u4f5c\u8005\u53bb\u9664\u6b8b\u5dee\u8bad\u7ec3\u4e2d\u666e\u904d\u5b58\u5728\u7684\u8eab\u4efd\u5bf9\u9f50\u6210\u5206\uff0c\u6bd4\u8f83\u6b8b\u5dee\u5757\u4e2d\u7684 checkpoint \u7279\u5f02\u7ed3\u6784\uff0c\u6784\u5efa\u5bf9\u79f0\u7684 lineage score\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14929", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728 residual-MLP \u4e0e GPT-2 \u57fa\u51c6\u4e0a\uff0c\u53ef\u533a\u5206\u5fae\u8c03\u3001LoRA \u5408\u5e76\u3001\u526a\u679d\u3001\u91cf\u5316\u540e\u4ee3\u4e0e\u72ec\u7acb\u6216\u84b8\u998f\u6a21\u578b\uff0cAUROC=1.0", "\u76f8\u6bd4\u884c\u4e3a\u76f8\u4f3c\u6027\uff0c\u8be5\u65b9\u6cd5\u805a\u7126\u6743\u91cd\u7956\u5148\u5173\u7cfb\uff1b\u5728\u51fd\u6570\u4fdd\u6301\u7684 checkpoint laundering \u5b9e\u9a8c\u4e2d\u4ecd\u4fdd\u6301\u7a33\u5b9a", "\u4fe1\u53f7\u5728\u516d\u7c7b\u8bed\u8a00\u6a21\u578b\u5bb6\u65cf\u53ca\u5176\u4ed6\u6a21\u578b\u4e2d\u51fa\u73b0\uff0cGPT-2 \u4e0a\u6bd4\u6700\u8fd1\u7684\u9c81\u68d2\u57fa\u7ebf\u5feb 76 \u500d"], "keywords": ["\u6a21\u578b\u6eaf\u6e90", "\u8bed\u8a00\u6a21\u578b", "\u6743\u91cd\u5206\u6790", "\u6a21\u578b\u5b89\u5168"], "num_comments": 2, "on_hf": true, "organization": "Amazon", "pdf_url": "https://arxiv.org/pdf/2608.14929v1", "published_at": "2026-08-14", "score": 0.281, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14929.png", "title": "Training Leaves Traces: Centered Residual Signatures for Language Model Lineage Verification", "tldr": "\u4ec5\u51ed\u6743\u91cd\u9a8c\u8bc1\u5f00\u6e90\u6a21\u578b\u8840\u7f18\u5173\u7cfb", "upvotes": 16, "what_it_is": "\u8bba\u6587\u7814\u7a76\u65e0\u6570\u636e\u767d\u76d2\u6a21\u578b\u8840\u7f18\u9a8c\u8bc1\uff1a\u5224\u65ad\u4e24\u4e2a\u517c\u5bb9\u8bed\u8a00\u6a21\u578b checkpoint \u662f\u5426\u5171\u4eab\u8bad\u7ec3\u7956\u5148\u3002\u4f5c\u8005\u53bb\u9664\u6b8b\u5dee\u8bad\u7ec3\u4e2d\u666e\u904d\u5b58\u5728\u7684\u8eab\u4efd\u5bf9\u9f50\u6210\u5206\uff0c\u6bd4\u8f83\u6b8b\u5dee\u5757\u4e2d\u7684 checkpoint \u7279\u5f02\u7ed3\u6784\uff0c\u6784\u5efa\u5bf9\u79f0\u7684 lineage score\u3002", "why_notable": "\u4e3a\u5f00\u653e\u6743\u91cd\u6a21\u578b\u63d0\u4f9b\u4e86\u4e00\u79cd\u88ab\u52a8\u3001\u65e0\u6570\u636e\u3001\u4ec5\u57fa\u4e8e\u6743\u91cd\u7684\u6765\u6e90\u8ffd\u8e2a\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u6a21\u578b\u6eaf\u6e90\u3001\u8bb8\u53ef\u8bc1\u5408\u89c4\u4e0e\u9632\u6b62 checkpoint \u6d17\u767d\u3002"}, {"abstract": "Physical interaction quality is central to deformable-object manipulation, yet most benchmarks evaluate task success alone. A policy may complete the task while allowing slip or causing excessive compression. A primary bottleneck is the absence of visuo-tactile datasets that pair policy-visible contact observations with independent physical ground truth over complete tasks. We introduce SoftVTBench, a visuo-tactile dataset for physical-interaction-aware deformable-object manipulation. It contains 4,000 expert demonstrations and more than 50 assets, including volumetric deformable objects and visually matched rigid twins. At 20 Hz, each episode synchronizes multi-view RGB, dual-finger tactile RGB and marker motion, proprioception, language, and binary and continuous gripper actions, alongside evaluator-only finite-element (FEM) states. Building upon this dataset, we establish a closed-loop benchmark that uses fixed object-specific calibration to define the Deformation-aware Success Rate (DSR), which counts a rollout as successful only when it completes the task and keeps peak normalized deformation within tolerance. Across Diffusion Policy, $\u03c0_{0.5}$, and FastWAM, all 12 in-distribution configurations contain successful rollouts that violate the deformation tolerance, accounting for 0.7--24% of each configuration\u0027s successes. Under distribution shift, visuo-tactile variants achieve higher task success in all six policy--suite comparisons and higher DSR in five, whereas their in-distribution benefits are mixed. These results show that making touch available does not by itself ensure effective multimodal fusion. SoftVTBench therefore provides a common visuo-tactile resource for studying not only whether a policy succeeds, but how it physically interacts with deformable objects and when touch improves that interaction.", "arxiv_id": "2608.18701", "arxiv_url": "https://arxiv.org/abs/2608.18701", "authors": ["Bowen Jing", "Mingxin Wang", "Ruiyang Hao", "Chenchen Ge", "Hanwen Shen", "Junjie He", "Yang Cui", "Yiming Hou", "Weitao Zhou", "Jiawei Wang", "Minglei Li", "Dandan Zhang", "Ding Zhao", "Houde Liu", "Xiaofan Li", "Si Liu", "Ping Luo", "Haibao Yu"], "brief": "\u8bba\u6587\u63d0\u51fa SoftVTBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u53ef\u53d8\u5f62\u7269\u4f53\u64cd\u4f5c\u7684\u89c6\u89e6\u89c9\u6570\u636e\u96c6\u4e0e\u95ed\u73af\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u4efb\u52a1\u662f\u5426\u5b8c\u6210\uff0c\u8fd8\u901a\u8fc7 FEM \u771f\u503c\u548c\u53d8\u5f62\u611f\u77e5\u6210\u529f\u7387\u8861\u91cf\u64cd\u4f5c\u8fc7\u7a0b\u4e2d\u7684\u6ed1\u79fb\u3001\u538b\u7f29\u7b49\u7269\u7406\u4ea4\u4e92\u8d28\u91cf\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18701", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6570\u636e\u96c6\u5305\u542b 4000 \u6761\u4e13\u5bb6\u793a\u8303\u300150 \u591a\u4e2a\u8d44\u4ea7\uff0c\u6db5\u76d6\u4f53\u79ef\u53ef\u53d8\u5f62\u7269\u4f53\u53ca\u89c6\u89c9\u5339\u914d\u7684\u521a\u4f53\u5b6a\u751f\u4f53\u3002", "\u6bcf\u4e2a episode \u4ee5 20Hz \u540c\u6b65\u591a\u89c6\u89d2 RGB\u3001\u53cc\u6307\u89e6\u89c9 RGB\u3001\u89e6\u89c9\u6807\u8bb0\u70b9\u8fd0\u52a8\u3001\u672c\u4f53\u611f\u77e5\u3001\u8bed\u8a00\u3001\u5939\u722a\u52a8\u4f5c\uff0c\u4ee5\u53ca\u4ec5\u8bc4\u6d4b\u53ef\u89c1\u7684 FEM \u72b6\u6001\u3002", "\u63d0\u51fa Deformation-aware Success Rate\uff08DSR\uff09\uff0c\u8981\u6c42\u4efb\u52a1\u6210\u529f\u4e14\u5cf0\u503c\u5f52\u4e00\u5316\u53d8\u5f62\u4e0d\u8d85\u8fc7\u5bb9\u5dee\uff1b\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u7b56\u7565\u5373\u4f7f\u4efb\u52a1\u6210\u529f\u4e5f\u5e38\u8fdd\u53cd\u53d8\u5f62\u7ea6\u675f\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89e6\u89c9", "\u53ef\u53d8\u5f62\u7269\u4f53", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Tuojing Intelligence", "pdf_url": "https://arxiv.org/pdf/2608.18701v1", "published_at": "2026-08-19", "score": 0.274, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18701.png", "title": "SoftVTBench: A Deformation-Aware Visuo-Tactile Dataset and Benchmark for Deformable-Object Manipulation", "tldr": "\u9762\u5411\u8f6f\u7269\u4f53\u64cd\u4f5c\u7684\u89c6\u89e6\u89c9\u53d8\u5f62\u611f\u77e5\u57fa\u51c6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa SoftVTBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u53ef\u53d8\u5f62\u7269\u4f53\u64cd\u4f5c\u7684\u89c6\u89e6\u89c9\u6570\u636e\u96c6\u4e0e\u95ed\u73af\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u4e0d\u4ec5\u8bc4\u4f30\u4efb\u52a1\u662f\u5426\u5b8c\u6210\uff0c\u8fd8\u901a\u8fc7 FEM \u771f\u503c\u548c\u53d8\u5f62\u611f\u77e5\u6210\u529f\u7387\u8861\u91cf\u64cd\u4f5c\u8fc7\u7a0b\u4e2d\u7684\u6ed1\u79fb\u3001\u538b\u7f29\u7b49\u7269\u7406\u4ea4\u4e92\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u53ef\u53d8\u5f62\u7269\u4f53\u64cd\u4f5c\u8bc4\u6d4b\u4ece\u201c\u662f\u5426\u5b8c\u6210\u4efb\u52a1\u201d\u63a8\u8fdb\u5230\u201c\u662f\u5426\u4ee5\u5408\u9002\u7684\u7269\u7406\u4ea4\u4e92\u5b8c\u6210\u4efb\u52a1\u201d\uff0c\u4e3a\u7814\u7a76\u89c6\u89e6\u89c9\u878d\u5408\u3001\u8f6f\u7269\u4f53\u5b89\u5168\u64cd\u4f5c\u548c\u771f\u5b9e\u63a5\u89e6\u8d28\u91cf\u63d0\u4f9b\u4e86\u7cfb\u7edf\u6570\u636e\u4e0e\u7edf\u4e00\u57fa\u51c6\u3002"}, {"abstract": "Memory has become a key component of large language models, enabling them to retain information and learn from long-term interactions. However, existing memory benchmarks mainly evaluate whether information is correctly extracted, stored, and retrieved, while largely overlooking how retrieved memories reshape model reasoning and affect performance on the current task. We identify memory-induced cognitive traps: even faithfully recorded and semantically relevant memories can distort model reasoning or beliefs and degrade current task performance. To systematically evaluate these failure modes, we introduce MemTrapBench, which covers two forms of cognitive traps: Reasoning Fixation and Belief Distortion. Experiments across two model families and five representative memory frameworks show that MemTrapBench is challenging: all evaluated memory strategies underperform the no-memory setting, with even the strongest methods suffering drops of more than 10%. To mitigate these cognitive traps, we propose AdaptiveMem, a simple yet effective inference-time method that instructs LLMs to avoid memory traps. AdaptiveMem mitigates cognitive traps on MemTrapBench while preserving or improving performance on standard memory benchmarks across diverse memory frameworks.", "arxiv_id": "2608.20202", "arxiv_url": "https://arxiv.org/abs/2608.20202", "authors": ["Mengru Wang", "Haozhe Luo", "Zhenqian Xu", "Zhixiang Cui", "Haoming Xu", "Qu Yang", "Jizhan Fang", "Junfeng Fang", "Ningyu Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa MemTrapBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u4f7f\u7528\u957f\u671f\u8bb0\u5fc6\u65f6\u5982\u4f55\u56e0\u76f8\u5173\u4f46\u8bef\u5bfc\u6027\u7684\u8bb0\u5fc6\u4ea7\u751f\u63a8\u7406\u56fa\u7740\u4e0e\u4fe1\u5ff5\u626d\u66f2\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u63a8\u7406\u65f6\u65b9\u6cd5 AdaptiveMem\uff0c\u901a\u8fc7\u63d0\u793a\u6a21\u578b\u8bc6\u522b\u5e76\u89c4\u907f\u8bb0\u5fc6\u9677\u9631\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY", "cs.DB", "cs.LG"], "github_repo": "https://github.com/zjunlp/MemTrapBench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.20202", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5b9a\u4e49\u4e24\u7c7b\u8bb0\u5fc6\u8bf1\u53d1\u8ba4\u77e5\u9677\u9631\uff1aReasoning Fixation\uff08\u63a8\u7406\u56fa\u7740\uff09\u548c Belief Distortion\uff08\u4fe1\u5ff5\u626d\u66f2\uff09\u3002", "\u5728\u4e24\u4e2a\u6a21\u578b\u5bb6\u65cf\u548c\u4e94\u79cd\u4ee3\u8868\u6027\u8bb0\u5fc6\u6846\u67b6\u4e0a\u5b9e\u9a8c\uff0c\u6240\u6709\u8bb0\u5fc6\u7b56\u7565\u5747\u4f4e\u4e8e\u65e0\u8bb0\u5fc6\u8bbe\u7f6e\uff0c\u6700\u5f3a\u65b9\u6cd5\u4e5f\u4e0b\u964d\u8d85\u8fc710%\u3002", "AdaptiveMem \u65e0\u9700\u8bad\u7ec3\uff0c\u4ec5\u5728\u63a8\u7406\u65f6\u5f15\u5bfc\u6a21\u578b\u907f\u514d\u8bb0\u5fc6\u8bef\u5bfc\uff0c\u540c\u65f6\u5728\u6807\u51c6\u8bb0\u5fc6\u57fa\u51c6\u4e0a\u4fdd\u6301\u6216\u63d0\u5347\u6027\u80fd\u3002"], "keywords": ["\u5927\u6a21\u578b\u8bb0\u5fc6", "\u8bc4\u6d4b\u57fa\u51c6", "\u63a8\u7406\u5b89\u5168", "\u8ba4\u77e5\u504f\u5dee"], "num_comments": 1, "on_hf": true, "organization": "ZJUNLP", "pdf_url": "https://arxiv.org/pdf/2608.20202v1", "published_at": "2026-08-20", "score": 0.247, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20202.png", "title": "MemTrapBench: Benchmarking Cognitive Traps in LLM Memory Use", "tldr": "\u8bc4\u6d4bLLM\u8bb0\u5fc6\u5f15\u53d1\u7684\u8ba4\u77e5\u9677\u9631", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa MemTrapBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u4f7f\u7528\u957f\u671f\u8bb0\u5fc6\u65f6\u5982\u4f55\u56e0\u76f8\u5173\u4f46\u8bef\u5bfc\u6027\u7684\u8bb0\u5fc6\u4ea7\u751f\u63a8\u7406\u56fa\u7740\u4e0e\u4fe1\u5ff5\u626d\u66f2\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u63a8\u7406\u65f6\u65b9\u6cd5 AdaptiveMem\uff0c\u901a\u8fc7\u63d0\u793a\u6a21\u578b\u8bc6\u522b\u5e76\u89c4\u907f\u8bb0\u5fc6\u9677\u9631\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u201c\u8bb0\u5f97\u5bf9\u201d\u5e76\u4e0d\u7b49\u4e8e\u201c\u7528\u5f97\u597d\u201d\uff0c\u628aLLM\u8bb0\u5fc6\u8bc4\u6d4b\u4ece\u5b58\u53d6\u51c6\u786e\u6027\u63a8\u8fdb\u5230\u5bf9\u5f53\u524d\u63a8\u7406\u5f71\u54cd\u7684\u5b89\u5168\u6027\u8bc4\u4f30\uff0c\u5bf9\u957f\u671f\u8bb0\u5fc6\u7cfb\u7edf\u548c\u4e2a\u6027\u5316AI\u5e94\u7528\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "For AI agents to be useful beyond simple chat, they must hold sensitive user context such as calendars, credentials, health records, and financial data. We study whether the mere presence of such secrets in a model\u0027s context window introduces hidden correlations into the model\u0027s benign outputs, allowing reconstruction even when the model correctly refuses direct extraction. We further study whether an adversary can actively engineer prompts that amplify this effect, using the model as a covert carrier to transmit secrets through seemingly innocuous text. In both cases, this limited leakage is exploited using a novel adaptive attack that assumes black-box access to the underlying model. In controlled experiments across eight proprietary models, we find that 2-digit in-context secrets are reconstructed with near-perfect accuracy and 4-digit secrets at 82\\% exact match, all from outputs the model produces in response to ordinary, non-adversarial requests. We observe that more capable models leak more: stronger instruction-following amplifies sensitivity to in-context secrets, suggesting leakage is a byproduct of capability as opposed to a patchable bug. We show this leakage enables two practical attacks: (1) a trained classifier that infers semantic predicates about user memories (e.g., health conditions, financial events) from routine natural-language outputs, and (2) an RL-trained adversary that extracts full Social Security Numbers from a production-style agent.", "arxiv_id": "2608.19857", "arxiv_url": "https://arxiv.org/abs/2608.19857", "authors": ["Jaiden Fairoze", "Neal Mangaokar", "Kamalika Chaudhuri", "Sanjam Garg", "Saeed Mahloujifar"], "brief": "\u8bba\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u4e0a\u4e0b\u6587\u7a97\u53e3\u4e2d\u6301\u6709\u654f\u611f\u4fe1\u606f\u65f6\uff0c\u662f\u5426\u4f1a\u5728\u770b\u4f3c\u6b63\u5e38\u3001\u975e\u63d0\u53d6\u6027\u7684\u8f93\u51fa\u4e2d\u65e0\u610f\u6cc4\u9732\u8fd9\u4e9b\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51fa\u9ed1\u76d2\u81ea\u9002\u5e94\u653b\u51fb\uff0c\u5e76\u5c55\u793a\u53ef\u901a\u8fc7\u666e\u901a\u56de\u7b54\u6216\u7cbe\u5fc3\u63d0\u793a\u91cd\u6784\u79d8\u5bc6\u3002", "categories": ["cs.LG", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19857", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u57288\u4e2a\u95ed\u6e90\u6a21\u578b\u5b9e\u9a8c\u4e2d\uff0c\u4ec5\u51ed\u666e\u901a\u975e\u5bf9\u6297\u8bf7\u6c42\u7684\u8f93\u51fa\uff0c\u53ef\u8fd1\u4e4e\u5b8c\u7f8e\u91cd\u67842\u4f4d\u79d8\u5bc6\uff0c4\u4f4d\u79d8\u5bc6\u7cbe\u786e\u5339\u914d\u7387\u8fbe82%", "\u6a21\u578b\u80fd\u529b\u8d8a\u5f3a\u3001\u6307\u4ee4\u8ddf\u968f\u8d8a\u597d\uff0c\u6cc4\u9732\u8d8a\u660e\u663e\uff0c\u8bf4\u660e\u6cc4\u9732\u53ef\u80fd\u662f\u80fd\u529b\u526f\u4f5c\u7528\u800c\u975e\u7b80\u5355\u6f0f\u6d1e", "\u5c55\u793a\u4e24\u7c7b\u5b9e\u9645\u653b\u51fb\uff1a\u7528\u5206\u7c7b\u5668\u4ece\u65e5\u5e38\u8f93\u51fa\u63a8\u65ad\u7528\u6237\u8bb0\u5fc6\u8bed\u4e49\u5c5e\u6027\uff0c\u4ee5\u53ca\u7528\u5f3a\u5316\u5b66\u4e60\u5bf9\u6297\u8005\u4ece\u751f\u4ea7\u5f0f\u667a\u80fd\u4f53\u4e2d\u63d0\u53d6\u5b8c\u6574SSN"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u9690\u79c1\u6cc4\u9732", "\u667a\u80fd\u4f53", "\u9ed1\u76d2\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19857v1", "published_at": "2026-08-20", "score": 0.225, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Inadvertent Context Leakage in Language Models", "tldr": "\u4e0a\u4e0b\u6587\u4e2d\u7684\u79d8\u5bc6\u4f1a\u4ece\u65e0\u5bb3\u8f93\u51fa\u4e2d\u6cc4\u9732", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u4e0a\u4e0b\u6587\u7a97\u53e3\u4e2d\u6301\u6709\u654f\u611f\u4fe1\u606f\u65f6\uff0c\u662f\u5426\u4f1a\u5728\u770b\u4f3c\u6b63\u5e38\u3001\u975e\u63d0\u53d6\u6027\u7684\u8f93\u51fa\u4e2d\u65e0\u610f\u6cc4\u9732\u8fd9\u4e9b\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51fa\u9ed1\u76d2\u81ea\u9002\u5e94\u653b\u51fb\uff0c\u5e76\u5c55\u793a\u53ef\u901a\u8fc7\u666e\u901a\u56de\u7b54\u6216\u7cbe\u5fc3\u63d0\u793a\u91cd\u6784\u79d8\u5bc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u957f\u4e0a\u4e0b\u6587\u4e0e\u667a\u80fd\u4f53\u8bb0\u5fc6\u4e2d\u7684\u57fa\u7840\u5b89\u5168\u98ce\u9669\uff1a\u5373\u4f7f\u6a21\u578b\u62d2\u7edd\u76f4\u63a5\u6cc4\u9732\uff0c\u654f\u611f\u4e0a\u4e0b\u6587\u4ecd\u53ef\u80fd\u901a\u8fc7\u7edf\u8ba1\u76f8\u5173\u6027\u6210\u4e3a\u9690\u853d\u4fe1\u9053\uff0c\u5bf9\u672a\u6765\u4e2a\u4eba\u52a9\u7406\u3001\u4f01\u4e1a\u667a\u80fd\u4f53\u548c\u9690\u79c1\u4fdd\u62a4\u673a\u5236\u5f71\u54cd\u91cd\u5927\u3002"}, {"abstract": "We present 4DAnyone, a framework for reconstructing 4D humans from an uncalibrated monocular video by generating reconstruction-grade multiview-consistent videos and lifting them into 4D Gaussian Splatting (4DGS). Existing camera-controlled video diffusion models synthesize plausible novel-view videos but fail to maintain consistency when scaled to the tens of target views required for 4DGS reconstruction. We identify this failure as a bounded-attention-context problem: when target views exceed the capacity of a single DiT forward pass, they must be split into groups, exposing two coupled bottlenecks. On the reference-context side, conditioning on all previously generated views grows as $O(N)$, weakening cross-view appearance guidance. On the target-context side, disjoint groups cannot directly exchange information, causing global structural drift. 4DAnyone addresses both bottlenecks with two complementary designs: Reference Context Packing (RCP) compresses growing reference views into a fixed-length mixed-resolution context with $O(1)$ reference-context complexity, while Target Context Routing (TCR) rotates target-view groupings during denoising to share context across groups at high-noise steps and stabilize details at low-noise steps. We further build the MVGameHuman dataset using our in-house game engine and combine it with light-stage and in-the-wild video datasets for training. Experiments on DNA-Rendering and DyMVHumans show that 4DAnyone outperforms prior methods in both novel-view video quality and downstream 4DGS reconstruction, with robust in-the-wild generalization. See our project page for video results and source code: https://4danyone.github.io.", "arxiv_id": "2608.20335", "arxiv_url": "https://arxiv.org/abs/2608.20335", "authors": ["Yudong Jin", "Tao Xie", "Qihang Zhang", "Zehong Shen", "Zhen Xu", "Yujun Shen", "Hujun Bao", "Xiaowei Zhou", "Yinghao Xu"], "brief": "4DAnyone \u662f\u4e00\u4e2a\u4ece\u672a\u6807\u5b9a\u5355\u76ee\u89c6\u9891\u91cd\u5efa\u52a8\u60014D\u4eba\u4f53\u7684\u6846\u67b6\uff1a\u5148\u751f\u6210\u91cd\u5efa\u7ea7\u3001\u591a\u89c6\u89d2\u4e00\u81f4\u7684\u89c6\u9891\uff0c\u518d\u63d0\u5347\u4e3a 4D Gaussian Splatting\u3002\u8bba\u6587\u8fd8\u6784\u5efa\u4e86 MVGameHuman \u6570\u636e\u96c6\uff0c\u5e76\u7ed3\u5408\u68da\u62cd\u4e0e\u91ce\u5916\u89c6\u9891\u6570\u636e\u8bad\u7ec3\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ant-research/4DAnyone", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20335", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u5927\u89c4\u6a21\u76ee\u6807\u89c6\u89d2\u751f\u6210\u4e2d\u7684\u201c\u6709\u754c\u6ce8\u610f\u529b\u4e0a\u4e0b\u6587\u201d\u95ee\u9898\uff1a\u89c6\u89d2\u5206\u7ec4\u4f1a\u5bfc\u81f4\u53c2\u8003\u4e0a\u4e0b\u6587\u589e\u957f\u3001\u8de8\u7ec4\u7ed3\u6784\u6f02\u79fb\u3002", "\u63d0\u51fa Reference Context Packing\uff0c\u5c06\u4e0d\u65ad\u589e\u957f\u7684\u53c2\u8003\u89c6\u89d2\u538b\u7f29\u4e3a\u56fa\u5b9a\u957f\u5ea6\u7684\u6df7\u5408\u5206\u8fa8\u7387\u4e0a\u4e0b\u6587\uff0c\u628a\u590d\u6742\u5ea6\u964d\u4e3a O(1)\u3002", "\u63d0\u51fa Target Context Routing\uff0c\u5728\u53bb\u566a\u8fc7\u7a0b\u4e2d\u8f6e\u6362\u76ee\u6807\u89c6\u89d2\u5206\u7ec4\uff0c\u9ad8\u566a\u58f0\u9636\u6bb5\u5171\u4eab\u5168\u5c40\u7ed3\u6784\uff0c\u4f4e\u566a\u58f0\u9636\u6bb5\u7a33\u5b9a\u7ec6\u8282\u3002"], "keywords": ["4D\u91cd\u5efa", "\u89c6\u9891\u6269\u6563", "Gaussian Splatting", "\u591a\u89c6\u89d2\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Ant Research", "pdf_url": "https://arxiv.org/pdf/2608.20335v1", "published_at": "2026-08-20", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20335.png", "title": "4DAnyone: Create Anyone in 4D from a Casual Monocular Video", "tldr": "\u5355\u76ee\u89c6\u9891\u751f\u6210\u4e00\u81f4\u591a\u89c6\u89d2\u5e76\u91cd\u5efa4D\u4eba\u4f53", "upvotes": 1, "what_it_is": "4DAnyone \u662f\u4e00\u4e2a\u4ece\u672a\u6807\u5b9a\u5355\u76ee\u89c6\u9891\u91cd\u5efa\u52a8\u60014D\u4eba\u4f53\u7684\u6846\u67b6\uff1a\u5148\u751f\u6210\u91cd\u5efa\u7ea7\u3001\u591a\u89c6\u89d2\u4e00\u81f4\u7684\u89c6\u9891\uff0c\u518d\u63d0\u5347\u4e3a 4D Gaussian Splatting\u3002\u8bba\u6587\u8fd8\u6784\u5efa\u4e86 MVGameHuman \u6570\u636e\u96c6\uff0c\u5e76\u7ed3\u5408\u68da\u62cd\u4e0e\u91ce\u5916\u89c6\u9891\u6570\u636e\u8bad\u7ec3\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u89c6\u9891\u6269\u6563\u6a21\u578b\u4e0e 4DGS \u91cd\u5efa\u7d27\u5bc6\u7ed3\u5408\uff0c\u89e3\u51b3\u4e86\u6570\u5341\u89c6\u89d2\u4e00\u81f4\u751f\u6210\u7684\u5173\u952e\u74f6\u9888\uff0c\u5728\u4eba\u4f53\u65b0\u89c6\u89d2\u89c6\u9891\u8d28\u91cf\u548c\u4e0b\u6e384D\u91cd\u5efa\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\uff0c\u5e76\u5c55\u793a\u4e86\u8f83\u5f3a\u7684\u91ce\u5916\u6cdb\u5316\u6f5c\u529b\u3002"}, {"abstract": "Language-specific competency (LSC) is the phenomenon of a language model performing better or worse depending on the language of the prompt. In other words, a language model outputs different (and potentially incorrect) responses to the same semantic query when prompted in different languages. Prior work attributes this to an internal misalignment of semantic representation across languages. Currently, there are two main approaches to address LSC in the literature: (1) routing all queries through English, improving performance, but limiting language expressivity to English; or (2) training on language-balanced data, equalizing model performance across languages, but reducing overall performance. In this work, we take a data centric perspective and introduce HOTFIXR: Hardness Optimized Training data For Improving X-Lingual Reasoning. It is a data generation framework that uses models to probe and learn a student model\u0027s multilingual weaknesses, and generates data to mitigate them. HOTFIXR can generate multilingual synthetic training data that can improve multilingual performance. We evaluate on three in-distribution tasks, three out-of-distribution tasks, and four out-of-distribution languages. On average, HOTFIXR (1) improves in-distribution performance by 6.2%, (2) reduces catastrophic forgetting (induced by fine-tuning) on OOD tasks by 3.7%, and (3) on OOD languages by 7.1%. Overall, as many real-world applications requires multilingual LLMs, our work contributes to the efforts of making LLMs multilingually proficient. We will release code upon acceptance.", "arxiv_id": "2608.15964", "arxiv_url": "https://arxiv.org/abs/2608.15964", "authors": ["Ishika Agarwal", "Arkajyoti Charaborty", "Tanner Sorensen", "Neha Gupta", "Andreas Stolcke"], "brief": "\u8bba\u6587\u63d0\u51fa HOTFIXR\uff0c\u4e00\u4e2a\u6570\u636e\u751f\u6210\u6846\u67b6\uff0c\u7528\u6a21\u578b\u63a2\u6d4b\u5b66\u751f\u6a21\u578b\u5728\u4e0d\u540c\u8bed\u8a00\u4e0a\u7684\u8584\u5f31\u70b9\uff0c\u5e76\u751f\u6210\u9488\u5bf9\u6027\u7684\u591a\u8bed\u79cd\u5408\u6210\u8bad\u7ec3\u6570\u636e\u6765\u4fee\u590d\u3002\u76ee\u6807\u662f\u7f13\u89e3\u540c\u4e00\u8bed\u4e49\u95ee\u9898\u56e0\u63d0\u793a\u8bed\u8a00\u4e0d\u540c\u800c\u5bfc\u81f4\u6027\u80fd\u5dee\u5f02\u7684 language-specific competency \u95ee\u9898\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15964", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u6bd4\u7edf\u4e00\u8f6c\u82f1\u6587\u6216\u8bed\u8a00\u5747\u8861\u8bad\u7ec3\uff0cHOTFIXR \u91c7\u7528\u6570\u636e\u4e2d\u5fc3\u65b9\u6cd5\uff0c\u6309\u6a21\u578b\u5f31\u70b9\u751f\u6210\u201c\u56f0\u96be\u5ea6\u4f18\u5316\u201d\u7684\u8de8\u8bed\u8a00\u8bad\u7ec3\u6837\u672c\u3002", "\u57283\u4e2a\u5206\u5e03\u5185\u4efb\u52a1\u30013\u4e2a\u5206\u5e03\u5916\u4efb\u52a1\u548c4\u79cd\u5206\u5e03\u5916\u8bed\u8a00\u4e0a\u8bc4\u4f30\uff0c\u5206\u5e03\u5185\u6027\u80fd\u5e73\u5747\u63d0\u53476.2%\u3002", "\u5fae\u8c03\u5f15\u8d77\u7684\u707e\u96be\u6027\u9057\u5fd8\u5728\u5206\u5e03\u5916\u4efb\u52a1\u4e0a\u51cf\u5c113.7%\uff0c\u5728\u5206\u5e03\u5916\u8bed\u8a00\u4e0a\u51cf\u5c117.1%\u3002"], "keywords": ["\u591a\u8bed\u8a00", "\u5408\u6210\u6570\u636e", "\u8de8\u8bed\u8a00\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15964v1", "published_at": "2026-08-16", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15964.png", "title": "LLMs Get Smarter from Targeted Synthetic Multilingual Data", "tldr": "\u5b9a\u5411\u5408\u6210\u6570\u636e\u63d0\u5347\u591a\u8bed\u79cd\u63a8\u7406\u80fd\u529b", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa HOTFIXR\uff0c\u4e00\u4e2a\u6570\u636e\u751f\u6210\u6846\u67b6\uff0c\u7528\u6a21\u578b\u63a2\u6d4b\u5b66\u751f\u6a21\u578b\u5728\u4e0d\u540c\u8bed\u8a00\u4e0a\u7684\u8584\u5f31\u70b9\uff0c\u5e76\u751f\u6210\u9488\u5bf9\u6027\u7684\u591a\u8bed\u79cd\u5408\u6210\u8bad\u7ec3\u6570\u636e\u6765\u4fee\u590d\u3002\u76ee\u6807\u662f\u7f13\u89e3\u540c\u4e00\u8bed\u4e49\u95ee\u9898\u56e0\u63d0\u793a\u8bed\u8a00\u4e0d\u540c\u800c\u5bfc\u81f4\u6027\u80fd\u5dee\u5f02\u7684 language-specific competency \u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u4e00\u79cd\u66f4\u6709\u9488\u5bf9\u6027\u7684\u591a\u8bed\u79cd\u80fd\u529b\u63d0\u5347\u8def\u5f84\uff1a\u4e0d\u727a\u7272\u8bed\u8a00\u8868\u8fbe\u591a\u6837\u6027\uff0c\u4e5f\u5c3d\u91cf\u907f\u514d\u8bed\u8a00\u5747\u8861\u8bad\u7ec3\u5e26\u6765\u7684\u6574\u4f53\u6027\u80fd\u4e0b\u964d\uff0c\u5bf9\u771f\u5b9e\u591a\u8bed\u8a00 LLM \u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Music editing plays a vital role in modern music production, with applications in film, broadcasting, and game development. Recent advances in music editing systems have enabled diverse editing tasks such as timbre transfer, instrument substitution, and genre transformation. However, many existing works overlook evaluating their ability to preserve musical facets that should remain unchanged during editing, which we define as Music Context Preservation (MuseCP). While some studies do consider MuseCP, their evaluation protocols and metrics are not comprehensive. To address this, we introduce the first MuseCP evaluation framework, MuseCPEval, that covers four categories of music facets with fine-grained and well-tailored metrics to capture nuanced changes in music attributes. Objective validation and a human study demonstrate the effectiveness of these metrics. Moreover, the case studies on diverse music editing systems illustrate the practical utility of these metrics as a testbed and diagnostic tool, providing insights into the strengths and limitations of existing systems. We hope our metrics and findings can offer practical guidance for developing more effective and reliable music editing strategies with strong MuseCP capability", "arxiv_id": "2512.14629", "arxiv_url": "https://arxiv.org/abs/2512.14629", "authors": ["Yash Vishe", "Eric Xue", "Xunyi Jiang", "Zachary Novack", "Junda Wu", "Julian McAuley", "Xin Xu"], "brief": "\u8bba\u6587\u63d0\u51fa MuseCPEval\uff0c\u7528\u4e8e\u8bc4\u4f30\u97f3\u4e50\u7f16\u8f91\u7cfb\u7edf\u5728\u6267\u884c\u97f3\u8272\u8fc1\u79fb\u3001\u4e50\u5668\u66ff\u6362\u3001\u98ce\u683c\u8f6c\u6362\u7b49\u4efb\u52a1\u65f6\uff0c\u5bf9\u4e0d\u5e94\u6539\u53d8\u7684\u97f3\u4e50\u4e0a\u4e0b\u6587\u8981\u7d20\u7684\u4fdd\u7559\u80fd\u529b\u3002\u8be5\u6846\u67b6\u8986\u76d6\u56db\u7c7b\u97f3\u4e50\u7ef4\u5ea6\uff0c\u5e76\u8bbe\u8ba1\u7ec6\u7c92\u5ea6\u6307\u6807\u6765\u6355\u6349\u7f16\u8f91\u524d\u540e\u7684\u5c5e\u6027\u53d8\u5316\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": "https://github.com/Yashvishe13/MuseCPEval", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2512.14629", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5b9a\u4e49 Music Context Preservation\uff08MuseCP\uff09\uff0c\u5f3a\u8c03\u97f3\u4e50\u7f16\u8f91\u4e0d\u4ec5\u8981\u5b8c\u6210\u76ee\u6807\u6539\u52a8\uff0c\u8fd8\u9700\u4fdd\u6301\u65cb\u5f8b\u3001\u8282\u594f\u3001\u7ed3\u6784\u7b49\u76f8\u5173\u4e0a\u4e0b\u6587\u4e0d\u88ab\u7834\u574f", "\u63d0\u51fa\u8986\u76d6\u56db\u7c7b\u97f3\u4e50\u8981\u7d20\u7684\u591a\u7ef4\u8bc4\u6d4b\u6307\u6807\uff0c\u5e76\u901a\u8fc7\u5ba2\u89c2\u9a8c\u8bc1\u548c\u4eba\u5de5\u7814\u7a76\u8bc1\u660e\u6307\u6807\u6709\u6548\u6027", "\u5728\u591a\u79cd\u97f3\u4e50\u7f16\u8f91\u7cfb\u7edf\u4e0a\u8fdb\u884c\u6848\u4f8b\u5206\u6790\uff0c\u5c55\u793a\u8be5\u6846\u67b6\u53ef\u4f5c\u4e3a\u6d4b\u8bd5\u5e8a\u548c\u8bca\u65ad\u5de5\u5177\uff0c\u63ed\u793a\u73b0\u6709\u65b9\u6cd5\u7684\u4f18\u52bf\u4e0e\u5c40\u9650"], "keywords": ["\u97f3\u4e50\u751f\u6210", "\u97f3\u9891\u7f16\u8f91", "\u8bc4\u6d4b\u57fa\u51c6", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "McAuley-Lab", "pdf_url": "https://arxiv.org/pdf/2512.14629v2", "published_at": "2025-12-16", "score": 0.217, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2512.14629.png", "title": "Evaluating Music Context Preservation: A Multi-facet Framework for Music Editing Systems", "tldr": "\u9996\u4e2a\u97f3\u4e50\u7f16\u8f91\u4e0a\u4e0b\u6587\u4fdd\u771f\u8bc4\u6d4b\u6846\u67b6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa MuseCPEval\uff0c\u7528\u4e8e\u8bc4\u4f30\u97f3\u4e50\u7f16\u8f91\u7cfb\u7edf\u5728\u6267\u884c\u97f3\u8272\u8fc1\u79fb\u3001\u4e50\u5668\u66ff\u6362\u3001\u98ce\u683c\u8f6c\u6362\u7b49\u4efb\u52a1\u65f6\uff0c\u5bf9\u4e0d\u5e94\u6539\u53d8\u7684\u97f3\u4e50\u4e0a\u4e0b\u6587\u8981\u7d20\u7684\u4fdd\u7559\u80fd\u529b\u3002\u8be5\u6846\u67b6\u8986\u76d6\u56db\u7c7b\u97f3\u4e50\u7ef
