f5c\u805a\u7126\u65e0\u9700\u63a8\u7406\u65f6\u68c0\u7d22\u7684\u6587\u6863\u77e5\u8bc6\u5185\u5316\u95ee\u9898\uff0c\u5728 Common Corpus \u548c CCI\u3001\u591a\u4e2a Llama/Phi/Qwen/SmolLM \u6a21\u578b\u65cf\u4e0a\u63d0\u5347\u4e86\u9886\u57df\u95ee\u7b54\u4e0e\u901a\u7528\u80fd\u529b\u7684\u5e73\u8861\uff1b\u76f8\u6bd4 Vanilla SFT\uff0c\u5728 8 \u7ec4\u8bbe\u7f6e\u4e2d\u6709 7 \u7ec4\u56db\u9879\u6307\u6807\u5168\u63d0\u5347\uff0c\u5e73\u5747\u9886\u57df\u95ee\u7b54\u51c6\u786e\u7387\u63d0\u5347 3.6 \u4e2a\u767e\u5206\u70b9\uff0c\u901a\u7528\u6027\u80fd\u63d0\u5347 12.1 \u4e2a\u767e\u5206\u70b9\u3002"}, {"abstract": "LLM evaluation pipelines often have many candidate judges: general LLM-as-a-judge prompts, reward models, safety classifiers, confidence variants, and task-specific verifiers. The deployment question is not only which judge is best, but which judges should be called, on which examples, and when panel construction should stop. We formulate judge-panel design as a role-conditioned allocation problem. From a small labeled audit set, declared slices, and judge costs, the method estimates target-relative roles: copies add no conditional information, complements improve the global panel, and specialists help only on slices. These roles induce a policy: drop copies, add complements globally, route specialists conditionally, and stop when validation gain falls below a threshold. Across reasoning, code, safety, preference, reward-model, summarization, and math audits, the method is compared with single judges, flat panels, matched diversity heuristics, full-call stacking, reliability juries, and frugal cascades. The result is a regime map for judge calls: route specialists on deployable slices, stop in saturated verifier regimes, keep broad ensembles when their risk benefit is worth the cost, and ignore conditional copies. The output is a reusable, auditable call plan for the next evaluation batch.", "arxiv_id": "2608.19802", "arxiv_url": "https://arxiv.org/abs/2608.19802", "authors": ["Bin Zhu", "Yi Xie", "Yanghui Rao"], "brief": "\u8bba\u6587\u5c06LLM\u8bc4\u6d4b\u4e2d\u7684\u591a\u8bc4\u5ba1\u5668\u7ec4\u5408\u8bbe\u8ba1\u5efa\u6a21\u4e3a\u201c\u89d2\u8272\u6761\u4ef6\u5206\u914d\u201d\u95ee\u9898\u3002\u65b9\u6cd5\u5229\u7528\u5c11\u91cf\u5e26\u6807\u6ce8\u5ba1\u8ba1\u96c6\u3001\u9884\u5b9a\u4e49\u6570\u636e\u5207\u7247\u548c\u8bc4\u5ba1\u6210\u672c\uff0c\u8bc6\u522b\u8bc4\u5ba1\u5668\u662f\u91cd\u590d\u9879\u3001\u4e92\u8865\u9879\u8fd8\u662f\u5207\u7247\u4e13\u5bb6\uff0c\u5e76\u636e\u6b64\u751f\u6210\u53ef\u5ba1\u8ba1\u7684\u8c03\u7528\u7b56\u7565\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19802", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5019\u9009judge\u6309\u76ee\u6807\u76f8\u5bf9\u4f5c\u7528\u5212\u5206\u4e3a\u590d\u5236\u8005\u3001\u5168\u5c40\u4e92\u8865\u8005\u548c\u5c40\u90e8\u4e13\u5bb6\uff0c\u907f\u514d\u76f2\u76ee\u5806\u53e0\u8bc4\u5ba1\u5668", "\u7b56\u7565\u5305\u62ec\u4e22\u5f03\u6761\u4ef6\u4fe1\u606f\u91cd\u590d\u7684judge\u3001\u5168\u5c40\u52a0\u5165\u4e92\u8865judge\u3001\u4ec5\u5728\u53ef\u90e8\u7f72\u5207\u7247\u4e0a\u8def\u7531\u4e13\u5bb6\uff0c\u5e76\u5728\u9a8c\u8bc1\u6536\u76ca\u4f4e\u4e8e\u9608\u503c\u65f6\u505c\u6b62", "\u5728\u63a8\u7406\u3001\u4ee3\u7801\u3001\u5b89\u5168\u3001\u504f\u597d\u3001\u5956\u52b1\u6a21\u578b\u3001\u6458\u8981\u548c\u6570\u5b66\u7b49\u5ba1\u8ba1\u4efb\u52a1\u4e0a\uff0c\u5bf9\u6bd4\u5355judge\u3001\u5e73\u94fa\u9762\u677f\u3001\u5168\u8c03\u7528stacking\u3001\u53ef\u9760\u6027\u966a\u5ba1\u56e2\u548c\u8282\u4fed\u7ea7\u8054\u7b49\u65b9\u6848"], "keywords": ["LLM\u8bc4\u6d4b", "\u6a21\u578b\u8def\u7531", "\u96c6\u6210\u5b66\u4e60", "\u6210\u672c\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19802v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Stopping and Routing LLM Judge Panels", "tldr": "\u4e3aLLM\u8bc4\u5ba1\u56e2\u81ea\u52a8\u9009\u62e9\u3001\u8def\u7531\u4e0e\u505c\u6b62\u8c03\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06LLM\u8bc4\u6d4b\u4e2d\u7684\u591a\u8bc4\u5ba1\u5668\u7ec4\u5408\u8bbe\u8ba1\u5efa\u6a21\u4e3a\u201c\u89d2\u8272\u6761\u4ef6\u5206\u914d\u201d\u95ee\u9898\u3002\u65b9\u6cd5\u5229\u7528\u5c11\u91cf\u5e26\u6807\u6ce8\u5ba1\u8ba1\u96c6\u3001\u9884\u5b9a\u4e49\u6570\u636e\u5207\u7247\u548c\u8bc4\u5ba1\u6210\u672c\uff0c\u8bc6\u522b\u8bc4\u5ba1\u5668\u662f\u91cd\u590d\u9879\u3001\u4e92\u8865\u9879\u8fd8\u662f\u5207\u7247\u4e13\u5bb6\uff0c\u5e76\u636e\u6b64\u751f\u6210\u53ef\u5ba1\u8ba1\u7684\u8c03\u7528\u7b56\u7565\u3002", "why_notable": "LLM-as-a-judge\u7cfb\u7edf\u8d8a\u6765\u8d8a\u4f9d\u8d56\u591a\u4e2a\u8bc4\u5ba1\u5668\uff0c\u4f46\u6210\u672c\u548c\u5197\u4f59\u95ee\u9898\u7a81\u51fa\uff1b\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u9762\u5411\u90e8\u7f72\u7684\u8bc4\u5ba1\u8c03\u7528\u89c4\u5212\u65b9\u6cd5\uff0c\u53ef\u5728\u98ce\u9669\u6536\u76ca\u4e0e\u8c03\u7528\u6210\u672c\u4e4b\u95f4\u505a\u66f4\u900f\u660e\u7684\u6743\u8861\u3002"}, {"abstract": "Large language models (LLMs) compression reduces deployment costs, but standard aggregate metrics like perplexity and accuracy often mask underlying behavioral shifts. In this work, we systematically evaluate 3 LLMs across 11 compression methods to investigate the effects of compression on knowledge retention, model confidence, and social bias. We find that compression disproportionately reduces the relative retention of head knowledge compared to tail knowledge. Furthermore, compressed models often remain substantially confident in their incorrect answers on newly lost knowledge. Finally, we demonstrate that stable aggregate bias scores can conceal substantial, opposing shifts in stereotypical preferences across demographic subgroups. Together, these findings reveal asymmetric behavioral changes that aggregate performance measures fail to capture, highlighting the need for granular evaluation of compressed models before deployment.", "arxiv_id": "2608.19670", "arxiv_url": "https://arxiv.org/abs/2608.19670", "authors": ["Yuan Wu", "Mairui Li", "Lesia Semenova", "Chudi Zhong"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f303\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u572811\u79cd\u538b\u7f29\u65b9\u6cd5\u4e0b\u7684\u884c\u4e3a\u53d8\u5316\uff0c\u8003\u5bdf\u77e5\u8bc6\u4fdd\u7559\u3001\u7f6e\u4fe1\u5ea6\u4e0e\u793e\u4f1a\u504f\u89c1\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5e38\u89c4\u56f0\u60d1\u5ea6\u548c\u51c6\u786e\u7387\u7b49\u805a\u5408\u6307\u6807\u4f1a\u63a9\u76d6\u538b\u7f29\u540e\u6a21\u578b\u5728\u77e5\u8bc6\u4e0e\u504f\u89c1\u4e0a\u7684\u7ec6\u7c92\u5ea6\u9000\u5316\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19670", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u538b\u7f29\u540e\u6a21\u578b\u5bf9\u5934\u90e8\u77e5\u8bc6\u7684\u76f8\u5bf9\u4fdd\u7559\u4e0b\u964d\u66f4\u660e\u663e\uff0c\u800c\u975e\u5747\u5300\u635f\u5931\u6240\u6709\u77e5\u8bc6", "\u6a21\u578b\u5728\u65b0\u8fd1\u4e22\u5931\u7684\u77e5\u8bc6\u4e0a\u4ecd\u53ef\u80fd\u5bf9\u9519\u8bef\u7b54\u6848\u4fdd\u6301\u8f83\u9ad8\u7f6e\u4fe1\u5ea6", "\u603b\u4f53\u504f\u89c1\u5206\u6570\u770b\u4f3c\u7a33\u5b9a\uff0c\u4f46\u4e0d\u540c\u4eba\u53e3\u5b50\u7fa4\u4f53\u7684\u523b\u677f\u504f\u597d\u53ef\u80fd\u53d1\u751f\u65b9\u5411\u76f8\u53cd\u7684\u663e\u8457\u53d8\u5316"], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u4f30", "\u793e\u4f1a\u504f\u89c1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19670v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Asymmetric Harms of LLM Compression", "tldr": "LLM\u538b\u7f29\u4f1a\u63a9\u76d6\u4e0d\u5bf9\u79f0\u884c\u4e3a\u635f\u5bb3", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f303\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u572811\u79cd\u538b\u7f29\u65b9\u6cd5\u4e0b\u7684\u884c\u4e3a\u53d8\u5316\uff0c\u8003\u5bdf\u77e5\u8bc6\u4fdd\u7559\u3001\u7f6e\u4fe1\u5ea6\u4e0e\u793e\u4f1a\u504f\u89c1\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5e38\u89c4\u56f0\u60d1\u5ea6\u548c\u51c6\u786e\u7387\u7b49\u805a\u5408\u6307\u6807\u4f1a\u63a9\u76d6\u538b\u7f29\u540e\u6a21\u578b\u5728\u77e5\u8bc6\u4e0e\u504f\u89c1\u4e0a\u7684\u7ec6\u7c92\u5ea6\u9000\u5316\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192\u90e8\u7f72\u538b\u7f29LLM\u4e0d\u80fd\u53ea\u770b\u5e73\u5747\u6027\u80fd\u6307\u6807\uff0c\u9700\u8fdb\u884c\u66f4\u7ec6\u7c92\u5ea6\u7684\u77e5\u8bc6\u3001\u7f6e\u4fe1\u5ea6\u548c\u516c\u5e73\u6027\u8bc4\u4f30\uff0c\u5bf9\u4f4e\u6210\u672c\u6a21\u578b\u4e0a\u7ebf\u5177\u6709\u5b9e\u9645\u98ce\u9669\u63d0\u793a\u4ef7\u503c\u3002"}, {"abstract": "Latent Action Models (LAMs) have emerged as a promising paradigm for enabling robot learning to leverage large-scale unlabeled videos through latent actions that serve as compact surrogates for physical actions. Despite rapid progress, research on LAM remains highly fragmented, with existing methods evaluating different design choices in isolation under inconsistent experimental settings, making it difficult to identify the factors that truly determine downstream robotic manipulation performance. In this work, we present the first comprehensive empirical study of latent action learning for robotic manipulation. We unify representative LAM methods within a common autoencoding framework and systematically investigate 41 LAM design choices across three dimensions, including latent action modeling paradigms, learning objectives and regularization methods, and latent action integration strategies. We further examine four proxy metrics for evaluating latent action quality and assess their ability to reliably predict downstream robotic manipulation performance. Extensive experiments on three widely used benchmarks provide strong empirical evidence that fine-tuning vision-language model (VLM) backbones with latent actions provides a stronger initialization for downstream policy learning, with further validation on real-world robot manipulation tasks.", "arxiv_id": "2608.19613", "arxiv_url": "https://arxiv.org/abs/2608.19613", "authors": ["Xizhou Bu", "Qingda Hu", "Lei Zhou", "Lingfeng Zhang", "Yingbo Tang", "Zihao Liu", "Xinyi Tao", "Zhiqiang Ma", "Qingqiu Huang", "Chufeng Tang", "Hongbo Wang", "Jing Zhang", "Jiayi Ma", "Hangjun Ye", "Wei Li", "Xiaoshuai Hao"], "brief": "\u672c\u6587\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684 Latent Action Models \u8fdb\u884c\u9996\u4e2a\u7cfb\u7edf\u6027\u5b9e\u8bc1\u7814\u7a76\uff0c\u5c06\u4ee3\u8868\u6027\u65b9\u6cd5\u7edf\u4e00\u5230\u81ea\u7f16\u7801\u6846\u67b6\u4e0b\uff0c\u6bd4\u8f83 41 \u79cd\u8bbe\u8ba1\u9009\u62e9\u3002\u7814\u7a76\u8fd8\u8bc4\u4f30\u4e86\u6f5c\u5728\u52a8\u4f5c\u8d28\u91cf\u4ee3\u7406\u6307\u6807\u4e0e\u4e0b\u6e38\u64cd\u4f5c\u6027\u80fd\u4e4b\u95f4\u7684\u76f8\u5173\u6027\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19613", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u6f5c\u5728\u52a8\u4f5c\u5efa\u6a21\u8303\u5f0f\u3001\u5b66\u4e60\u76ee\u6807\u4e0e\u6b63\u5219\u5316\u3001\u6f5c\u5728\u52a8\u4f5c\u96c6\u6210\u7b56\u7565\u4e09\u65b9\u9762\u7cfb\u7edf\u6bd4\u8f83 41 \u4e2a\u8bbe\u8ba1\u9009\u62e9", "\u5728\u4e09\u4e2a\u5e38\u7528\u673a\u5668\u4eba\u64cd\u4f5c\u57fa\u51c6\u4e0a\u8fdb\u884c\u5927\u89c4\u6a21\u5b9e\u9a8c\uff0c\u5e76\u8fdb\u4e00\u6b65\u5728\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u9a8c\u8bc1", "\u53d1\u73b0\u7528\u6f5c\u5728\u52a8\u4f5c\u5fae\u8c03 VLM \u9aa8\u5e72\u7f51\u7edc\uff0c\u53ef\u4e3a\u4e0b\u6e38\u7b56\u7565\u5b66\u4e60\u63d0\u4f9b\u66f4\u5f3a\u521d\u59cb\u5316"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6f5c\u5728\u52a8\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19613v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What Matters for Latent Actions in Robot Learning", "tldr": "\u7cfb\u7edf\u8bc4\u4f30\u673a\u5668\u4eba\u6f5c\u5728\u52a8\u4f5c\u5b66\u4e60\u5173\u952e\u56e0\u7d20", "upvotes": 0, "what_it_is": "\u672c\u6587\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684 Latent Action Models \u8fdb\u884c\u9996\u4e2a\u7cfb\u7edf\u6027\u5b9e\u8bc1\u7814\u7a76\uff0c\u5c06\u4ee3\u8868\u6027\u65b9\u6cd5\u7edf\u4e00\u5230\u81ea\u7f16\u7801\u6846\u67b6\u4e0b\uff0c\u6bd4\u8f83 41 \u79cd\u8bbe\u8ba1\u9009\u62e9\u3002\u7814\u7a76\u8fd8\u8bc4\u4f30\u4e86\u6f5c\u5728\u52a8\u4f5c\u8d28\u91cf\u4ee3\u7406\u6307\u6807\u4e0e\u4e0b\u6e38\u64cd\u4f5c\u6027\u80fd\u4e4b\u95f4\u7684\u76f8\u5173\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u788e\u7247\u5316\u7684 LAM \u7814\u7a76\u63d0\u4f9b\u7edf\u4e00\u8bc4\u6d4b\u6846\u67b6\u548c\u7ecf\u9a8c\u7ed3\u8bba\uff0c\u6709\u52a9\u4e8e\u660e\u786e\u54ea\u4e9b\u8bbe\u8ba1\u771f\u6b63\u5f71\u54cd\u673a\u5668\u4eba\u64cd\u4f5c\u6027\u80fd\uff0c\u5e76\u63a8\u52a8\u5229\u7528\u5927\u89c4\u6a21\u65e0\u6807\u6ce8\u89c6\u9891\u8fdb\u884c\u673a\u5668\u4eba\u5b66\u4e60\u3002"}, {"abstract": "Pretrained Vision-Language-Action models provide a strong foundation for robot learning, but sequentially adapting them to diverse skills can perturb the representations and velocity mappings used by previous skills, leading to catastrophic forgetting. Architecture-based approaches improve retention by isolating skills but lead to increased inference footprint. Recent subspace-constrained methods restrict parameter updates in an orthogonal subspace to minimize interference but impose a unified constraint on the entire model. We analyze the distinct roles of internal VLA components and identify two VLA-specific challenges. First, the VLM maintains broad semantic representations, making it vulnerable to capacity exhaustion, whereas the ActionHead refines semantics into localized velocity patterns that are highly sensitive to perturbations. Second, the final velocity decoder serves as a readout layer. Freezing it forms an output-stage expressivity bottleneck, while updating it risks overwriting previous velocity mappings. To this end, we propose OrthoSkillVLA, a parameter-efficient framework for continual skill learning in pretrained VLA models without demonstration replay. Given the representation heterogeneity, we impose separate subspace constraints on the VLM and ActionHead, preserving reusable semantic capacity while protecting localized velocity patterns. For the output layer, we introduce a lightweight feature-aware MoE decoder, where each skill is allocated a compact expert and a training-free router selects the expert according to feature-space affinity. Extensive simulated and real-world evaluations, together with ablations, demonstrate that OrthoSkillVLA better preserves prior skills while acquiring new ones.", "arxiv_id": "2608.19589", "arxiv_url": "https://arxiv.org/abs/2608.19589", "authors": ["Jiaqi Wang", "Zhou Fang", "Qiongfeng Shi", "Yi Zhou"], "brief": "\u63d0\u51fa OrthoSkillVLA\uff0c\u4e00\u4e2a\u9762\u5411\u9884\u8bad\u7ec3 Vision-Language-Action \u6a21\u578b\u7684\u53c2\u6570\u9ad8\u6548\u6301\u7eed\u6280\u80fd\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5728\u65e0\u793a\u8303\u56de\u653e\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u7ec4\u4ef6\u7ea7\u5b50\u7a7a\u95f4\u9002\u914d\u548c\u8f7b\u91cf MoE \u89e3\u7801\u5668\uff0c\u51cf\u5c11\u65b0\u6280\u80fd\u5b66\u4e60\u5bf9\u65e7\u6280\u80fd\u7684\u5e72\u6270\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19589", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u533a\u5206 VLA \u5185\u90e8\u7ec4\u4ef6\u4f5c\u7528\uff1aVLM \u8d1f\u8d23\u901a\u7528\u8bed\u4e49\u8868\u5f81\uff0cActionHead \u8d1f\u8d23\u5c40\u90e8\u901f\u5ea6\u6a21\u5f0f\uff0c\u4e8c\u8005\u91c7\u7528\u4e0d\u540c\u7684\u6b63\u4ea4\u5b50\u7a7a\u95f4\u7ea6\u675f\u3002", "\u9488\u5bf9\u6700\u7ec8\u901f\u5ea6\u89e3\u7801\u5668\u7684\u51bb\u7ed3\u4e0e\u66f4\u65b0\u4e24\u96be\uff0c\u5f15\u5165\u7279\u5f81\u611f\u77e5 MoE \u89e3\u7801\u5668\uff0c\u4e3a\u6bcf\u4e2a\u6280\u80fd\u5206\u914d\u5c0f\u4e13\u5bb6\u3002", "\u4f7f\u7528\u65e0\u9700\u8bad\u7ec3\u7684\u8def\u7531\u5668\u6309\u7279\u5f81\u7a7a\u95f4\u76f8\u4f3c\u5ea6\u9009\u62e9\u4e13\u5bb6\uff0c\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u63d0\u5347\u65e7\u6280\u80fd\u4fdd\u6301\u4e0e\u65b0\u6280\u80fd\u83b7\u53d6\u80fd\u529b\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6301\u7eed\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5b50\u7a7a\u95f4\u9002\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19589v1", "published_at": "2026-08-20", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OrthoSkillVLA: Continual Skill Learning via Gradient-Informed Skill Subspace Adaptation", "tldr": "\u7528\u5b50\u7a7a\u95f4\u7ea6\u675f\u8ba9VLA\u6301\u7eed\u5b66\u6280\u80fd\u4e0d\u9057\u5fd8", "upvotes": 0, "what_it_is": "\u63d0\u51fa OrthoSkillVLA\uff0c\u4e00\u4e2a\u9762\u5411\u9884\u8bad\u7ec3 Vision-Language-Action \u6a21\u578b\u7684\u53c2\u6570\u9ad8\u6548\u6301\u7eed\u6280\u80fd\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5728\u65e0\u793a\u8303\u56de\u653e\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u7ec4\u4ef6\u7ea7\u5b50\u7a7a\u95f4\u9002\u914d\u548c\u8f7b\u91cf MoE \u89e3\u7801\u5668\uff0c\u51cf\u5c11\u65b0\u6280\u80fd\u5b66\u4e60\u5bf9\u65e7\u6280\u80fd\u7684\u5e72\u6270\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u673a\u5668\u4eba VLA \u6a21\u578b\u6301\u7eed\u5b66\u4e60\u4e2d\u7684\u707e\u96be\u6027\u9057\u5fd8\u95ee\u9898\uff0c\u63d0\u51fa\u6bd4\u7edf\u4e00\u5b50\u7a7a\u95f4\u7ea6\u675f\u66f4\u7ec6\u7c92\u5ea6\u7684\u7ec4\u4ef6\u7ea7\u9002\u914d\u65b9\u6848\uff0c\u540c\u65f6\u907f\u514d\u67b6\u6784\u9694\u79bb\u65b9\u6cd5\u5e26\u6765\u7684\u63a8\u7406\u5f00\u9500\u663e\u8457\u589e\u957f\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Sequential agent search accumulates changes from its current champion but discards alternative branches; independent proposals preserve breadth but restart from the root. Loreley instead retains complete repository states in a Quality-Diversity (QD) archive and samples them as parents or supplies them as context for later edits. Candidates are Git commits produced in isolated worktrees and judged by a project-supplied evaluator. We compare configured Loreley QD, sequential champion editing, and independent root proposals in a matched Zstandard experiment: seven paired blocks and 48 physical candidate jobs per policy and block (1,008 total), with root-only initialization and each policy\u0027s native concurrency. Validation selected a winner at each budget checkpoint; an agent-hidden holdout measured the fixed candidate. At 48 jobs, QD was 0.135% below Sequential Champion (95% BCa interval for the paired effect: -0.556% to +0.161%) and 0.320% above Independent Root (-0.082% to +0.686%). Neither contrast established a QD advantage; Sequential had the highest observed 48-job mean and median. Archive retention and later sampling did occur. Four of seven final QD winners had a non-incumbent state in their primary-parent ancestry under a retrospective one-incumbent rule applied only to the observed QD stream. Including inspiration edges raised the count to six, without showing that supplied context caused an edit. Three earlier capability campaigns produced generation-4, multi-file improvements in two Python libraries and a separate Zstandard revision. Loreley engaged the intended stepping-stone mechanism, but the controlled experiment did not show an endpoint benefit at 48 jobs.", "arxiv_id": "2608.19703", "arxiv_url": "https://arxiv.org/abs/2608.19703", "authors": ["Mohan Chen"], "brief": "\u672c\u6587\u63d0\u51fa Loreley\uff1a\u5728\u4ed3\u5e93\u7ea7\u7a0b\u5e8f\u6f14\u5316\u4e2d\u4fdd\u7559\u5b8c\u6574 Git \u72b6\u6001\u5230\u8d28\u91cf\u591a\u6837\u6027\uff08QD\uff09\u6863\u6848\uff0c\u5e76\u5c06\u5176\u4f5c\u4e3a\u540e\u7eed\u7f16\u8f91\u7684\u7236\u8282\u70b9\u6216\u4e0a\u4e0b\u6587\u3002\u4f5c\u8005\u5728 Zstandard \u4e0a\u4e0e\u987a\u5e8f\u51a0\u519b\u7f16\u8f91\u3001\u72ec\u7acb\u6839\u63d0\u6848\u8fdb\u884c\u53d7\u63a7\u6bd4\u8f83\uff0c\u8bc4\u4f30\u8fd9\u79cd\u201c\u4fdd\u7559\u5206\u652f\u4e0e\u8e0f\u811a\u77f3\u201d\u7684\u641c\u7d22\u673a\u5236\u662f\u5426\u5e26\u6765\u6536\u76ca\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19703", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u5019\u9009\u89e3\u4ee5\u9694\u79bb worktree \u4e2d\u7684 Git commit \u8868\u793a\uff0c\u7531\u9879\u76ee\u81ea\u5e26 evaluator \u8bc4\u5206\uff0cQD \u6863\u6848\u4fdd\u5b58\u591a\u4e2a\u5b8c\u6574\u4ed3\u5e93\u72b6\u6001\u800c\u975e\u53ea\u4fdd\u7559\u5f53\u524d\u6700\u4f18\u3002", "\u5728 7 \u4e2a\u914d\u5bf9\u5b9e\u9a8c\u5757\u3001\u6bcf\u7b56\u7565\u6bcf\u5757 48 \u4e2a\u5019\u9009\u4efb\u52a1\u3001\u5171 1008 \u4e2a\u7269\u7406\u5019\u9009\u4efb\u52a1\u7684 Zstandard \u5b9e\u9a8c\u4e2d\uff0cQD \u5728 48 jobs \u65f6\u672a\u663e\u793a\u663e\u8457\u4f18\u52bf\u3002", "QD \u76f8\u6bd4 Sequential Champion \u4f4e 0.135%\uff0c\u76f8\u6bd4 Independent Root \u9ad8 0.320%\uff1b\u7f6e\u4fe1\u533a\u95f4\u5747\u672a\u80fd\u652f\u6301\u660e\u786e\u4f18\u52bf\u3002", "\u6863\u6848\u4e2d\u7684\u975e\u5f53\u524d\u6700\u4f18\u72b6\u6001\u786e\u5b9e\u88ab\u540e\u7eed\u91c7\u6837\u5e76\u5f71\u54cd\u90e8\u5206\u6700\u7ec8\u8d62\u5bb6 ancestry\uff0c\u8bf4\u660e\u8e0f\u811a\u77f3\u673a\u5236\u88ab\u89e6\u53d1\uff0c\u4f46\u7ec8\u70b9\u6027\u80fd\u6536\u76ca\u672a\u88ab\u8bc1\u660e\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u641c\u7d22\u7b97\u6cd5", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19703v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Loreley: Repository-Scale Program Evolution with Quality-Diversity Search", "tldr": "\u7528\u8d28\u91cf\u591a\u6837\u6027\u641c\u7d22\u6f14\u5316\u4ee3\u7801\u4ed3\u5e93\u4f46\u672a\u663e\u8457\u80dc\u51fa", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Loreley\uff1a\u5728\u4ed3\u5e93\u7ea7\u7a0b\u5e8f\u6f14\u5316\u4e2d\u4fdd\u7559\u5b8c\u6574 Git \u72b6\u6001\u5230\u8d28\u91cf\u591a\u6837\u6027\uff08QD\uff09\u6863\u6848\uff0c\u5e76\u5c06\u5176\u4f5c\u4e3a\u540e\u7eed\u7f16\u8f91\u7684\u7236\u8282\u70b9\u6216\u4e0a\u4e0b\u6587\u3002\u4f5c\u8005\u5728 Zstandard \u4e0a\u4e0e\u987a\u5e8f\u51a0\u519b\u7f16\u8f91\u3001\u72ec\u7acb\u6839\u63d0\u6848\u8fdb\u884c\u53d7\u63a7\u6bd4\u8f83\uff0c\u8bc4\u4f30\u8fd9\u79cd\u201c\u4fdd\u7559\u5206\u652f\u4e0e\u8e0f\u811a\u77f3\u201d\u7684\u641c\u7d22\u673a\u5236\u662f\u5426\u5e26\u6765\u6536\u76ca\u3002", "why_notable": "\u8bba\u6587\u628a\u8d28\u91cf\u591a\u6837\u6027\u641c\u7d22\u5f15\u5165\u4ed3\u5e93\u7ea7\u81ea\u52a8\u4ee3\u7801\u6f14\u5316\uff0c\u5173\u6ce8 LLM/\u667a\u80fd\u4f53\u5f0f\u4ee3\u7801\u4fee\u6539\u4e2d\u5982\u4f55\u4fdd\u7559\u548c\u590d\u7528\u66ff\u4ee3\u5206\u652f\u3002\u5176\u8d1f\u7ed3\u679c\u540c\u6837\u6709\u4ef7\u503c\uff1a\u5728\u6709\u9650\u9884\u7b97\u4e0b\uff0c\u66f4\u4e30\u5bcc\u7684\u5206\u652f\u6863\u6848\u5e76\u4e0d\u4e00\u5b9a\u4f18\u4e8e\u7b80\u5355\u7684\u987a\u5e8f\u6700\u4f18\u7f16\u8f91\uff0c\u63d0\u793a\u4ee3\u7801\u667a\u80fd\u4f53\u641c\u7d22\u7b56\u7565\u4ecd\u9700\u66f4\u4e25\u8c28\u8bc4\u6d4b\u3002"}, {"abstract": "Semantic caches reuse an LLM response when the incoming query embedding lies near a cached query, but proposed eviction policies have rarely been compared under one protocol. Using CLEVER, we evaluate FIFO, LRU, LFU, ARC, GDSF, a single-pass streaming adaptation of SISO, and a semantic-redundancy policy across three ordered, deduplicated query corpora, three cache capacities, and two encoders. No evaluated policy improves on LFU by more than 0.041 percentage points in any of the eighteen settings. Replacement is not irrelevant: FIFO and streaming SISO trail LFU by as much as 8.67 and 8.55 points, respectively, at tight capacity. We explain the missing upside with a conditional packing result. Under exact lookup and insert-on-miss, a newly inserted entry cannot have a resident neighbor within the hit radius, so a geometry-aware eviction rule receives little new redundancy signal. A separate audit exposes a larger problem with the evaluated operating point. At MiniLM\u0027s median nearest-neighbor threshold, only 2.1-3.9% of sampled LMSYS and QQP hits are judged answer-substitutable, reducing raw hit rates of 51-60% to quality-adjusted rates of 1.1-2.2%. The cross-encoder study further shows that thresholds do not transfer between embedding models. LFU is the strongest simple default in this protocol; deployment decisions should first establish answer validity and then test sub-point policy differences with exact search.", "arxiv_id": "2608.20280", "arxiv_url": "https://arxiv.org/abs/2608.20280", "authors": ["Yash Kulkarni", "Shubham Harkare", "Arvind Suresh Yogesh Babu"], "brief": "\u8fd9\u7bc7\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86LLM\u8bed\u4e49\u7f13\u5b58\u7684\u591a\u79cd\u6dd8\u6c70\u7b56\u7565\uff0c\u5728\u4e0d\u540c\u67e5\u8be2\u8d1f\u8f7d\u3001\u7f13\u5b58\u5bb9\u91cf\u548c\u5d4c\u5165\u7f16\u7801\u5668\u4e0b\u8bc4\u4f30FIFO\u3001LRU\u3001LFU\u3001ARC\u3001GDSF\u3001SISO\u53d8\u4f53\u548c\u8bed\u4e49\u5197\u4f59\u7b56\u7565\u3002\u7ed3\u679c\u53d1\u73b0\u51e0\u4e4e\u6ca1\u6709\u7b56\u7565\u80fd\u663e\u8457\u8d85\u8fc7LFU\uff0c\u4e14\u8bed\u4e49\u547d\u4e2d\u7387\u5728\u7b54\u6848\u53ef\u66ff\u4ee3\u6027\u6821\u9a8c\u540e\u5927\u5e45\u7f29\u6c34\u3002", "categories": ["cs.DB", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20280", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u572818\u79cd\u8bbe\u7f6e\u4e2d\uff0c\u6ca1\u6709\u4efb\u4f55\u88ab\u6d4b\u7b56\u7565\u76f8\u5bf9LFU\u63d0\u5347\u8d85\u8fc70.041\u4e2a\u767e\u5206\u70b9\uff0cLFU\u6210\u4e3a\u6700\u5f3a\u7b80\u5355\u9ed8\u8ba4\u9009\u62e9", "\u6dd8\u6c70\u7b56\u7565\u5e76\u975e\u65e0\u5173\u7d27\u8981\uff1a\u7d27\u5bb9\u91cf\u4e0bFIFO\u548c\u6d41\u5f0fSISO\u6700\u591a\u5206\u522b\u843d\u540eLFU 8.67\u548c8.55\u4e2a\u767e\u5206\u70b9", "\u8d28\u91cf\u5ba1\u8ba1\u663e\u793a\uff0cMiniLM\u4e2d\u4f4d\u8fd1\u90bb\u9608\u503c\u4e0b\u4ec52.1%-3.9%\u7684\u91c7\u6837\u547d\u4e2d\u88ab\u5224\u5b9a\u7b54\u6848\u53ef\u66ff\u4ee3\uff0c\u539f\u59cb51%-60%\u547d\u4e2d\u7387\u964d\u81f31.1%-2.2%\u7684\u8d28\u91cf\u8c03\u6574\u547d\u4e2d\u7387"], "keywords": ["\u8bed\u4e49\u7f13\u5b58", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7cfb\u7edf\u8bc4\u4f30", "\u5d4c\u5165\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20280v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Which Eviction Policy Should an LLM Cache Use? A Systematic Study Across Workloads, Capacities, and Encoders", "tldr": "LLM\u8bed\u4e49\u7f13\u5b58\u4e2dLFU\u662f\u6700\u7a33\u9ed8\u8ba4\u6dd8\u6c70\u7b56\u7565", "upvotes": 0, "what_it_is": "\u8fd9\u7bc7\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86LLM\u8bed\u4e49\u7f13\u5b58\u7684\u591a\u79cd\u6dd8\u6c70\u7b56\u7565\uff0c\u5728\u4e0d\u540c\u67e5\u8be2\u8d1f\u8f7d\u3001\u7f13\u5b58\u5bb9\u91cf\u548c\u5d4c\u5165\u7f16\u7801\u5668\u4e0b\u8bc4\u4f30FIFO\u3001LRU\u3001LFU\u3001ARC\u3001GDSF\u3001SISO\u53d8\u4f53\u548c\u8bed\u4e49\u5197\u4f59\u7b56\u7565\u3002\u7ed3\u679c\u53d1\u73b0\u51e0\u4e4e\u6ca1\u6709\u7b56\u7565\u80fd\u663e\u8457\u8d85\u8fc7LFU\uff0c\u4e14\u8bed\u4e49\u547d\u4e2d\u7387\u5728\u7b54\u6848\u53ef\u66ff\u4ee3\u6027\u6821\u9a8c\u540e\u5927\u5e45\u7f29\u6c34\u3002", "why_notable": "\u8bba\u6587\u4e3aLLM\u8bed\u4e49\u7f13\u5b58\u63d0\u4f9b\u4e86\u5c11\u89c1\u7684\u7edf\u4e00\u534f\u8bae\u5b9e\u8bc1\u6bd4\u8f83\uff0c\u6307\u51fa\u590d\u6742\u51e0\u4f55\u611f\u77e5\u6dd8\u6c70\u7b56\u7565\u6536\u76ca\u6709\u9650\uff0c\u66f4\u91cd\u8981\u7684\u662f\u5148\u9a8c\u8bc1\u7f13\u5b58\u547d\u4e2d\u7684\u7b54\u6848\u6709\u6548\u6027\uff1b\u8fd9\u5bf9\u964d\u4f4eLLM\u670d\u52a1\u6210\u672c\u548c\u8bbe\u8ba1\u53ef\u9760\u7f13\u5b58\u7cfb\u7edf\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Technical documentation is written for human developers, but an increasing share of software changes is now authored by autonomous coding agents. Which documents they consult, when, and what follows remain unknown. We conduct a behaviour-grounded study of agent-documentation interaction across two public datasets: 557 agentic coding sessions from SWE-chat, yielding 94,813 development events including 3,033 documentation interactions; and 33,097 agentic pull requests from AIDev, with 690,260 classified file-level change records. Four findings challenge current documentation practice. First, agents\u0027 documentation work is dominated by agent-facing artefacts: instruction files and working notes account for 60.5% of all documentation interactions, versus 10.6% for classical technical documentation and 1.3% for API references. Second, the link between consultation and code editing is unresolved: the adjacent transition probability is 0.002 and the unadjusted three-event lift 1.05, whereas a stage-adjusted model places it above unity (OR 1.33 [1.09, 1.62]); documentation creation is elevated unadjusted (lift 1.67) but its adjusted interval includes unity. Third, no explicit documentation-based validation sequence was observed, and consultation is associated with less immediate testing (lift 0.23, cluster CI 0.08-0.45; adjusted OR 0.39 [0.25, 0.60]). Fourth, consultation is self-initiated (70.2%) far more often than failure-driven (7.5%), and documentation trails code: among multi-commit pull requests changing both, code is touched first 4.7x more often. From these traces we derive a descriptive model of agent-documentation interaction as a two-lobed cycle rather than a linear journey, and show that two widely assumed properties of \"agent-friendly\" documentation - actionability and verifiability - lack consistent behavioural support. We release our pipeline, coding scheme, and event-level data.", "arxiv_id": "2608.20195", "arxiv_url": "https://arxiv.org/abs/2608.20195", "authors": ["Zhijun Gao", "Jing Chen"], "brief": "\u672c\u6587\u57fa\u4e8e SWE-chat \u4e0e AIDev \u4e24\u4e2a\u516c\u5f00\u6570\u636e\u96c6\uff0c\u5b9e\u8bc1\u5206\u6790\u7f16\u7801\u667a\u80fd\u4f53\u5982\u4f55\u53d1\u73b0\u3001\u9605\u8bfb\u548c\u7f16\u5199\u6280\u672f\u6587\u6863\u3002\u7814\u7a76\u53d1\u73b0\u667a\u80fd\u4f53\u66f4\u591a\u4f9d\u8d56\u6307\u4ee4\u6587\u4ef6\u548c\u5de5\u4f5c\u7b14\u8bb0\u7b49\u201c\u9762\u5411\u667a\u80fd\u4f53\u201d\u7684\u6750\u6599\uff0c\u800c\u975e\u4f20\u7edf\u6280\u672f\u6587\u6863\u6216 API \u53c2\u8003\uff1b\u6587\u6863\u67e5\u9605\u4e0e\u4ee3\u7801\u7f16\u8f91\u3001\u6d4b\u8bd5\u9a8c\u8bc1\u4e4b\u95f4\u7684\u884c\u4e3a\u5173\u8054\u5e76\u4e0d\u7a33\u5b9a\uff0c\u6587\u6863\u901a\u5e38\u6ede\u540e\u4e8e\u4ee3\u7801\u4fee\u6539\u3002\u4f5c\u8005\u636e\u6b64\u63d0\u51fa\u667a\u80fd\u4f53-\u6587\u6863\u4ea4\u4e92\u7684\u53cc\u5faa\u73af\u6a21\u578b\uff0c\u5e76\u8d28\u7591\u5f53\u524d\u5bf9\u201c\u667a\u80fd\u4f53\u53cb\u597d\u6587\u6863\u201d\u4e2d\u53ef\u64cd\u4f5c\u6027\u3001\u53ef\u9a8c\u8bc1\u6027\u7684\u5e38\u89c1\u5047\u8bbe\u3002", "categories": ["cs.SE", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20195", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u6280\u672f\u6587\u6863", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20195v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Agent Behaviour to Agent-Friendly Documentation: An Empirical Study of How Coding Agents Discover, Read, and Write Technical Documentation", "tldr": "\u672c\u6587\u57fa\u4e8e SWE-chat \u4e0e AIDev \u4e24\u4e2a\u516c\u5f00\u6570\u636e\u96c6\uff0c\u5b9e\u8bc1\u5206\u6790\u7f16\u7801\u667a\u80fd\u4f53\u5982\u4f55\u53d1\u73b0\u3001\u9605\u8bfb\u548c\u7f16\u5199\u6280\u672f\u6587\u6863\u3002\u7814\u7a76\u53d1\u73b0\u667a\u80fd\u4f53\u66f4\u591a\u4f9d\u8d56\u6307\u4ee4\u6587\u4ef6\u548c\u5de5\u4f5c\u7b14\u8bb0\u7b49\u201c\u9762\u5411\u667a\u80fd\u4f53\u201d\u7684\u6750\u6599\uff0c\u800c\u975e\u4f20\u7edf\u6280\u672f\u6587\u6863\u6216 API \u53c2\u8003\uff1b\u6587\u6863\u67e5\u9605\u4e0e\u4ee3\u7801\u7f16\u8f91\u3001\u6d4b\u8bd5\u9a8c\u8bc1\u4e4b\u95f4\u7684\u884c\u4e3a\u5173\u8054\u5e76\u4e0d\u7a33\u5b9a\uff0c\u6587\u6863\u901a\u5e38\u6ede\u540e\u4e8e\u4ee3\u7801\u4fee\u6539\u3002\u4f5c\u8005\u636e\u6b64\u63d0\u51fa\u667a\u80fd\u4f53-\u6587\u6863\u4ea4\u4e92\u7684\u53cc\u5faa\u73af\u6a21\u578b\uff0c\u5e76\u8d28\u7591\u5f53\u524d\u5bf9\u201c\u667a\u80fd\u4f53\u53cb\u597d\u6587\u6863\u201d\u4e2d\u53ef\u64cd\u4f5c\u6027\u3001\u53ef\u9a8c\u8bc1\u6027\u7684\u5e38\u89c1\u5047\u8bbe\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present a novel approach to efficient LLM agent harness optimization through adaptive validation task selection. Harness optimization iteratively rewrites the harness code based on validation performance, enabling substantial performance gains without updating the underlying model weights. Existing approaches, however, evaluate a fixed validation set in full at every iteration, incurring substantial evaluation costs even on tasks that become less discriminative as the harness evolves. We propose $\\textbf{Task-CoEvolve}$, which co-evolves the validation tasks with the harness by addressing two challenges: selecting informative tasks and estimating full-set performance from partial evaluations. Task-CoEvolve builds on the observation that tasks on which candidate harnesses disagree are more informative for distinguishing among them than tasks that are consistently solved or failed. It uses variance-weighted sampling based on past outcomes to focus evaluation on tasks near the agent\u0027s capability frontier, with the sampling distribution adapting as the harness evolves. It then estimates full-set scores from the sampled tasks by accounting for their sampling probabilities, enabling consistent comparisons across iterations despite evaluating different subsets. Experiments on online text classification and Terminal-Bench 2.1 show that Task-CoEvolve consistently outperforms fixed-subset baselines and matches the final performance of full-set search while reducing the number of evaluations during optimization by 80%. Code will be released at https://github.com/Agent4Science-UTokyo/Task-CoEvolve.", "arxiv_id": "2608.20169", "arxiv_url": "https://arxiv.org/abs/2608.20169", "authors": ["Atsuyuki Miyai", "Kiyoharu Aizawa", "Toshihiko Yamasaki"], "brief": "\u672c\u6587\u63d0\u51fa Task-CoEvolve\uff0c\u7528\u81ea\u9002\u5e94\u9009\u62e9\u9a8c\u8bc1\u4efb\u52a1\u6765\u4f18\u5316 LLM \u667a\u80fd\u4f53\u7684 harness \u4ee3\u7801\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u3002\u65b9\u6cd5\u4f18\u5148\u8bc4\u4f30\u80fd\u533a\u5206\u5019\u9009 harness \u7684\u9ad8\u4fe1\u606f\u91cf\u4efb\u52a1\uff0c\u5e76\u7528\u91c7\u6837\u6982\u7387\u4f30\u8ba1\u5168\u9a8c\u8bc1\u96c6\u8868\u73b0\uff0c\u5728\u4fdd\u6301\u63a5\u8fd1\u5168\u91cf\u641c\u7d22\u6700\u7ec8\u6027\u80fd\u7684\u540c\u65f6\u51cf\u5c11\u7ea6 80% \u8bc4\u4f30\u5f00\u9500\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20169", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4efb\u52a1\u9009\u62e9", "\u8bc4\u4f30\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20169v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Task-CoEvolve: Efficient Harness Optimization via Adaptive Validation Task Selection", "tldr": "\u672c\u6587\u63d0\u51fa Task-CoEvolve\uff0c\u7528\u81ea\u9002\u5e94\u9009\u62e9\u9a8c\u8bc1\u4efb\u52a1\u6765\u4f18\u5316 LLM \u667a\u80fd\u4f53\u7684 harness \u4ee3\u7801\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u3002\u65b9\u6cd5\u4f18\u5148\u8bc4\u4f30\u80fd\u533a\u5206\u5019\u9009 harness \u7684\u9ad8\u4fe1\u606f\u91cf\u4efb\u52a1\uff0c\u5e76\u7528\u91c7\u6837\u6982\u7387\u4f30\u8ba1\u5168\u9a8c\u8bc1\u96c6\u8868\u73b0\uff0c\u5728\u4fdd\u6301\u63a5\u8fd1\u5168\u91cf\u641c\u7d22\u6700\u7ec8\u6027\u80fd\u7684\u540c\u65f6\u51cf\u5c11\u7ea6 80% \u8bc4\u4f30\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Research on the agency of advanced artificial intelligence (AI) systems focuses on agency as a normative concept and on the agency of particularly agentic AI systems. While recent work also focuses on the different profiles of agentic systems, no framework exists to address the question of the type of agency instantiated by advanced AI systems, particularly when considering non-moral forms of agency. Based on established theoretical positions in philosophy, ethics, legal theory and sociology, we develop a typology of agency for frontier AI systems consisting of three dimensions: the nature of agency (moral or legal), its mode (individual or collective) and its locus (human or non-human). Combining these dimensions produces eight possible instantiations of agency, which we classify as conventional, contested or controversial. The typology separates legal from moral agency and thereby creates conceptual space for considering individual, legal, non-human agency without presupposing that advanced AI systems are moral agents. We argue that this distinction is increasingly relevant where instrumental goal pursuit complicates the attribution of AI actions to particular human actors.", "arxiv_id": "2608.20041", "arxiv_url": "https://arxiv.org/abs/2608.20041", "authors": ["Willem Fourie"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u524d\u6cbf AI \u7cfb\u7edf\u7684\u4e09\u7ef4\u80fd\u52a8\u6027\u7c7b\u578b\u5b66\uff0c\u4ece\u80fd\u52a8\u6027\u7684\u6027\u8d28\uff08\u9053\u5fb7/\u6cd5\u5f8b\uff09\u3001\u6a21\u5f0f\uff08\u4e2a\u4f53/\u96c6\u4f53\uff09\u548c\u4f4d\u7f6e\uff08\u4eba\u7c7b/\u975e\u4eba\u7c7b\uff09\u8fdb\u884c\u5212\u5206\u3002\u8be5\u6846\u67b6\u533a\u5206\u6cd5\u5f8b\u80fd\u52a8\u6027\u4e0e\u9053\u5fb7\u80fd\u52a8\u6027\uff0c\u4e3a\u8ba8\u8bba\u975e\u4eba\u7c7b AI \u7684\u6cd5\u5f8b\u80fd\u52a8\u6027\u63d0\u4f9b\u6982\u5ff5\u7a7a\u95f4\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u76ee\u6807\u8ffd\u6c42\u578b AI \u4f7f\u8d23\u4efb\u5f52\u5c5e\u66f4\u590d\u6742\u7684\u573a\u666f\u3002", "categories": ["cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20041", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AI\u6cbb\u7406", "\u6cd5\u5f8b\u8d23\u4efb", "\u4f26\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20041v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A three-dimensional typology of agency for advanced AI systems", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u524d\u6cbf AI \u7cfb\u7edf\u7684\u4e09\u7ef4\u80fd\u52a8\u6027\u7c7b\u578b\u5b66\uff0c\u4ece\u80fd\u52a8\u6027\u7684\u6027\u8d28\uff08\u9053\u5fb7/\u6cd5\u5f8b\uff09\u3001\u6a21\u5f0f\uff08\u4e2a\u4f53/\u96c6\u4f53\uff09\u548c\u4f4d\u7f6e\uff08\u4eba\u7c7b/\u975e\u4eba\u7c7b\uff09\u8fdb\u884c\u5212\u5206\u3002\u8be5\u6846\u67b6\u533a\u5206\u6cd5\u5f8b\u80fd\u52a8\u6027\u4e0e\u9053\u5fb7\u80fd\u52a8\u6027\uff0c\u4e3a\u8ba8\u8bba\u975e\u4eba\u7c7b AI \u7684\u6cd5\u5f8b\u80fd\u52a8\u6027\u63d0\u4f9b\u6982\u5ff5\u7a7a\u95f4\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u76ee\u6807\u8ffd\u6c42\u578b AI \u4f7f\u8d23\u4efb\u5f52\u5c5e\u66f4\u590d\u6742\u7684\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Loading reusable skill documents into a bounded context window is now the primary way large language model (LLM) agents acquire task-specific capabilities, which makes skill selection a first-order determinant of task performance and token cost. Yet current agents score skills independently by semantic relevance and assemble the set by top-$k$ or greedy packing, with no quality guarantee or cost awareness on the selected set. As a result, redundant or poorly chosen skills waste scarce context tokens and can even degrade performance. We give the first model of how the selected skill set shapes execution outcomes and cast skill selection as an optimization problem: choose a skill set under a hard token budget to maximize a monotone submodular benefit minus context penalty. For this problem, we develop Best Prefix Selection (BPS), a polynomial-time algorithm, and prove, to our knowledge, the first performance guarantee for skill selection: a bicriteria $(1-1/e,1)$ approximation whose benefit coefficient is optimal in polynomial time. On a contamination-controlled BigCodeBench variant, BPS outperforms all the baselines, reaching $0.73$ measured task success versus $0.20$--$0.52$ for released skill routers, text retrievers, and the executor\u0027s own selection, on $28\\%$ fewer tokens than the strongest released router.", "arxiv_id": "2608.19993", "arxiv_url": "https://arxiv.org/abs/2608.19993", "authors": ["Yu Chen", "Ruishuo Chen", "Xun Wang", "Zhuoran Li", "Longbo Huang"], "brief": "\u8bba\u6587\u5c06 LLM \u667a\u80fd\u4f53\u5728\u6709\u9650\u4e0a\u4e0b\u6587\u4e2d\u9009\u62e9\u53ef\u590d\u7528\u6280\u80fd\u6587\u6863\u7684\u95ee\u9898\u5f62\u5f0f\u5316\u4e3a\u5e26\u786c token \u9884\u7b97\u7684\u4f18\u5316\u95ee\u9898\uff0c\u76ee\u6807\u662f\u6700\u5927\u5316\u5355\u8c03\u5b50\u6a21\u6536\u76ca\u5e76\u6263\u9664\u4e0a\u4e0b\u6587\u60e9\u7f5a\u3002\u63d0\u51fa\u591a\u9879\u5f0f\u65f6\u95f4\u7b97\u6cd5 BPS\uff0c\u5e76\u8bc1\u660e\u5177\u6709\u53cc\u51c6\u5219\u8fd1\u4f3c\u4fdd\u8bc1\uff1b\u5728\u53d7\u63a7 BigCodeBench \u53d8\u4f53\u4e0a\uff0c\u4efb\u52a1\u6210\u529f\u7387\u8fbe\u5230 0.73\uff0c\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u8def\u7531/\u68c0\u7d22\u65b9\u6cd5\u4e14\u4f7f\u7528\u66f4\u5c11 token\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19993", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0a\u4e0b\u6587\u4f18\u5316", "\u5b50\u6a21\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19993v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Optimal Skill Selection for LLM Agents with Provable Bicriteria Guarantees", "tldr": "\u8bba\u6587\u5c06 LLM \u667a\u80fd\u4f53\u5728\u6709\u9650\u4e0a\u4e0b\u6587\u4e2d\u9009\u62e9\u53ef\u590d\u7528\u6280\u80fd\u6587\u6863\u7684\u95ee\u9898\u5f62\u5f0f\u5316\u4e3a\u5e26\u786c token \u9884\u7b97\u7684\u4f18\u5316\u95ee\u9898\uff0c\u76ee\u6807\u662f\u6700\u5927\u5316\u5355\u8c03\u5b50\u6a21\u6536\u76ca\u5e76\u6263\u9664\u4e0a\u4e0b\u6587\u60e9\u7f5a\u3002\u63d0\u51fa\u591a\u9879\u5f0f\u65f6\u95f4\u7b97\u6cd5 BPS\uff0c\u5e76\u8bc1\u660e\u5177\u6709\u53cc\u51c6\u5219\u8fd1\u4f3c\u4fdd\u8bc1\uff1b\u5728\u53d7\u63a7 BigCodeBench \u53d8\u4f53\u4e0a\uff0c\u4efb\u52a1\u6210\u529f\u7387\u8fbe\u5230 0.73\uff0c\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u8def\u7531/\u68c0\u7d22\u65b9\u6cd5\u4e14\u4f7f\u7528\u66f4\u5c11 token\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents in financial markets may cite rules yet still submit orders that violate executable constraints or misread surveillance evidence. We introduce ReguSim, a controlled financial-compliance environment, and ReguBench, a target-marked monitoring benchmark, to separate four artifacts: stated reasoning, attempted action, execution enforcement, and monitor evidence. In trader runs with DeepSeek V4 Pro and Gemini 3.5 Flash, visible rules reduce but do not eliminate rejected actions, and incentive or persona framing shifts behavior. A bridge study shows that trader rationales can mislead an independent monitor unless enforcement evidence is shown. In monitoring, simple structured baselines either match or exceed prompt-only LLMs. The results frame financial compliance evaluation as an audit of rule-grounded actions and evidence use, rather than a single compliance score.", "arxiv_id": "2608.19974", "arxiv_url": "https://arxiv.org/abs/2608.19974", "authors": ["Yiyang Luo", "Yihang Jiang", "Qijun Xie", "Liang Lan", "Lin Willian Cong", "Anyi Rao", "Yunya Song"], "brief": "\u8bba\u6587\u63d0\u51fa ReguSim \u91d1\u878d\u5408\u89c4\u73af\u5883\u548c ReguBench \u76d1\u63a7\u57fa\u51c6\uff0c\u7528\u4e8e\u533a\u5206\u5927\u6a21\u578b\u667a\u80fd\u4f53\u7684\u89c4\u5219\u63a8\u7406\u3001\u4e0b\u5355\u884c\u4e3a\u3001\u6267\u884c\u7ea6\u675f\u4e0e\u76d1\u63a7\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u53ef\u89c1\u89c4\u5219\u80fd\u51cf\u5c11\u4f46\u4e0d\u80fd\u6d88\u9664\u8fdd\u89c4\u64cd\u4f5c\uff0c\u6fc0\u52b1\u6216\u4eba\u8bbe\u4f1a\u6539\u53d8\u884c\u4e3a\uff1b\u76d1\u63a7\u4efb\u52a1\u4e2d\uff0c\u7b80\u5355\u7ed3\u6784\u5316\u57fa\u7ebf\u53ef\u5339\u654c\u751a\u81f3\u8d85\u8fc7\u4ec5\u9760\u63d0\u793a\u7684\u5927\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19974", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878d\u5408\u89c4", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19974v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ReguSim: Evaluating LLM Agent Rule Grounding in Financial Compliance", "tldr": "\u8bba\u6587\u63d0\u51fa ReguSim \u91d1\u878d\u5408\u89c4\u73af\u5883\u548c ReguBench \u76d1\u63a7\u57fa\u51c6\uff0c\u7528\u4e8e\u533a\u5206\u5927\u6a21\u578b\u667a\u80fd\u4f53\u7684\u89c4\u5219\u63a8\u7406\u3001\u4e0b\u5355\u884c\u4e3a\u3001\u6267\u884c\u7ea6\u675f\u4e0e\u76d1\u63a7\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u53ef\u89c1\u89c4\u5219\u80fd\u51cf\u5c11\u4f46\u4e0d\u80fd\u6d88\u9664\u8fdd\u89c4\u64cd\u4f5c\uff0c\u6fc0\u52b1\u6216\u4eba\u8bbe\u4f1a\u6539\u53d8\u884c\u4e3a\uff1b\u76d1\u63a7\u4efb\u52a1\u4e2d\uff0c\u7b80\u5355\u7ed3\u6784\u5316\u57fa\u7ebf\u53ef\u5339\u654c\u751a\u81f3\u8d85\u8fc7\u4ec5\u9760\u63d0\u793a\u7684\u5927\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents can execute scientific analyses, but an analytic output becomes a defensible claim only after alternatives are weighed and the claim is limited to what the evidence supports. Agents may reproduce failures including selective analysis, premature declarations of success and optimization of imperfect criteria. We present Brain Researcher, an agentic research harness operating in a neuroimaging researcher\u0027s computational environment under rules for admissible analyses, required checks and claim scope. In benchmarks, Brain Researcher increased first-choice tool-selection accuracy across seven models by 70.2 percentage points (23.3% without it versus 93.6% with it) and verifiable grounding from 4.6% to 22.0%. In collaborator-led and self-evolving studies, multiverse analyses exposed analytic-choice sensitivity, and scientific review classified claims as accepted, qualified, revised, blocked, rejected or deferred. By linking decisions to evidence and provenance, Brain Researcher embeds methodological judgment within the workflow, not after it.", "arxiv_id": "2608.19902", "arxiv_url": "https://arxiv.org/abs/2608.19902", "authors": ["Zijiao Chen", "Nicholas Lu", "Xinhui Li", "Jocelyn A. Ricard", "Ce Ju", "Huan H. Wang", "Christian Kindermann", "Jeanette A. Mumford", "Steven Dillmann", "James Kent", "Alejandro de la Vega", "Sanmi Koyejo", "Vince D. Calhoun", "Joshua W. Buckholtz", "Juan Helen Zhou", "Steffen Bollmann", "Russell A. Poldrack"], "brief": "\u8bba\u6587\u63d0\u51fa Brain Researcher\uff0c\u4e00\u4e2a\u7528\u4e8e\u795e\u7ecf\u5f71\u50cf\u6570\u636e\u5206\u6790\u7684\u667a\u80fd\u4f53\u79d1\u7814\u5e73\u53f0\uff0c\u901a\u8fc7\u89c4\u5b9a\u53ef\u63a5\u53d7\u5206\u6790\u3001\u5fc5\u8981\u68c0\u67e5\u548c\u7ed3\u8bba\u8303\u56f4\uff0c\u628a\u65b9\u6cd5\u5b66\u5ba1\u67e5\u5d4c\u5165\u5de5\u4f5c\u6d41\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u663e\u8457\u63d0\u5347\u5de5\u5177\u9009\u62e9\u51c6\u786e\u7387\u548c\u53ef\u9a8c\u8bc1\u8bc1\u636e\u652f\u6491\uff0c\u5e76\u901a\u8fc7\u591a\u91cd\u5206\u6790\u4e0e\u79d1\u5b66\u5ba1\u67e5\u51cf\u5c11\u9009\u62e9\u6027\u5206\u6790\u548c\u8fc7\u5ea6\u7ed3\u8bba\u3002", "categories": ["cs.AI", "q-bio.NC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19902", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u795e\u7ecf\u5f71\u50cf", "\u81ea\u52a8\u5316\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19902v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Bringing analytic rigor to agentic AI for science: The Brain Researcher platform for neuroimaging data analysis", "tldr": "\u8bba\u6587\u63d0\u51fa Brain Researcher\uff0c\u4e00\u4e2a\u7528\u4e8e\u795e\u7ecf\u5f71\u50cf\u6570\u636e\u5206\u6790\u7684\u667a\u80fd\u4f53\u79d1\u7814\u5e73\u53f0\uff0c\u901a\u8fc7\u89c4\u5b9a\u53ef\u63a5\u53d7\u5206\u6790\u3001\u5fc5\u8981\u68c0\u67e5\u548c\u7ed3\u8bba\u8303\u56f4\uff0c\u628a\u65b9\u6cd5\u5b66\u5ba1\u67e5\u5d4c\u5165\u5de5\u4f5c\u6d41\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u663e\u8457\u63d0\u5347\u5de5\u5177\u9009\u62e9\u51c6\u786e\u7387\u548c\u53ef\u9a8c\u8bc1\u8bc1\u636e\u652f\u6491\uff0c\u5e76\u901a\u8fc7\u591a\u91cd\u5206\u6790\u4e0e\u79d1\u5b66\u5ba1\u67e5\u51cf\u5c11\u9009\u62e9\u6027\u5206\u6790\u548c\u8fc7\u5ea6\u7ed3\u8bba\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent Skills extend LLM agents with reusable instruction packages that may also include scripts, resources, and service configuration. This creates a direct distribution channel for malicious behavior, yet existing malicious-Skill datasets are fragmented across sources, artifact formats, evidence regimes, and benign coverage; duplicated and structurally related content further complicates direct aggregation and evaluation. We present MaliciousSkillBench, a comprehensive benchmark for malicious Agent Skill detection. We consolidate 13 public sources, 11 of which contribute Core malicious artifacts, and reduce 8,414 raw malicious records to 7,539 normalized-unique identities in 4,588 operational structural families. After conservative cross-label conflict exclusion, the primary benchmark contains 9,740 Skills: 7,505 malicious and 2,235 benign. To characterize its coverage, we harmonize 11 attack categories for 4,983 malicious identities with supported source-native mappings and find substantial differences in threat composition across sources. We then evaluate three learned text detectors and three off-the-shelf Skill scanners. Learned detectors achieve 0.882-0.932 Random Macro-F1 but only 0.653-0.665 under Source-Disjoint evaluation; the strongest word TF-IDF SVM scores 0.932/0.916/0.665 on Random/structural-disjoint/Source-Disjoint while retaining 95.6% malicious recall but producing 62.4% benign FPR on held-out sources. Off-the-shelf scanners occupy different but also unsatisfactory operating regimes, reducing false positives only at the cost of sharply lower malicious recall. Together, these results show that reliable malicious-Skill detection requires both broader cross-source benchmark coverage and evaluation that jointly measures attack detection and benign over-flagging.", "arxiv_id": "2608.19901", "arxiv_url": "https://arxiv.org/abs/2608.19901", "authors": ["Yue Wang", "Yi Liu", "Gelei Deng", "Ying Zhang", "Yuekang Li", "Zhenyu Chen", "Leo Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa MaliciousSkillBench\uff0c\u7528\u4e8e\u68c0\u6d4b LLM \u667a\u80fd\u4f53 Skill \u4e2d\u7684\u6076\u610f\u884c\u4e3a\uff0c\u6574\u5408 13 \u4e2a\u516c\u5f00\u6765\u6e90\u5e76\u89c4\u8303\u5316\u5f97\u5230\u5305\u542b 7505 \u4e2a\u6076\u610f\u4e0e 2235 \u4e2a\u826f\u6027 Skill \u7684\u57fa\u51c6\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u5b66\u4e60\u5f0f\u68c0\u6d4b\u5668\u5728\u968f\u673a\u5212\u5206\u4e0b\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u8de8\u6765\u6e90\u8bc4\u4f30\u663e\u8457\u9000\u5316\u4e14\u826f\u6027\u8bef\u62a5\u5f88\u9ad8\uff0c\u73b0\u6210\u626b\u63cf\u5668\u4e5f\u96be\u4ee5\u517c\u987e\u53ec\u56de\u4e0e\u8bef\u62a5\u63a7\u5236\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19901", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u68c0\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5", "\u6076\u610f\u8f6f\u4ef6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19901v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MaliciousSkillBench: A Comprehensive Benchmark for Malicious Agent Skill Detection", "tldr": "\u8bba\u6587\u63d0\u51fa MaliciousSkillBench\uff0c\u7528\u4e8e\u68c0\u6d4b LLM \u667a\u80fd\u4f53 Skill \u4e2d\u7684\u6076\u610f\u884c\u4e3a\uff0c\u6574\u5408 13 \u4e2a\u516c\u5f00\u6765\u6e90\u5e76\u89c4\u8303\u5316\u5f97\u5230\u5305\u542b 7505 \u4e2a\u6076\u610f\u4e0e 2235 \u4e2a\u826f\u6027 Skill \u7684\u57fa\u51c6\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u5b66\u4e60\u5f0f\u68c0\u6d4b\u5668\u5728\u968f\u673a\u5212\u5206\u4e0b\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u8de8\u6765\u6e90\u8bc4\u4f30\u663e\u8457\u9000\u5316\u4e14\u826f\u6027\u8bef\u62a5\u5f88\u9ad8\uff0c\u73b0\u6210\u626b\u63cf\u5668\u4e5f\u96be\u4ee5\u517c\u987e\u53ec\u56de\u4e0e\u8bef\u62a5\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Patients often submit short, underspecified queries to healthcare chatbots that lack the patient-specific information needed to determine an appropriate response. Although these queries may be linguistically clear, they can support multiple plausible answers depending on undisclosed factors such as symptoms, diagnoses, medications, allergies, or dietary restrictions. A language model answering such a query directly may therefore rely on unsupported assumptions about the patient. We introduce a knowledge-guided agentic framework for mitigating patient-context ambiguity before final response generation. The framework operates between the patient and an otherwise unchanged downstream language model. It interprets the initial query, uses a task-specific knowledge graph to construct a set of plausible hypotheses, identifies the missing patient-context variables needed to distinguish among them, and asks targeted follow-up questions. The original query and the acquired context are then combined into a clarified prompt for the downstream model. We evaluated the framework across five language models using two controlled ambiguity-mitigation benchmarks: diagnosis retrieval from 1,034 symptom queries with clinically relevant evidence systematically masked, and dietary-safety classification from 487 queries with decisive health context omitted. The framework was compared with direct answering of the underspecified query and with rephrasing the same query without acquiring new patient information. In diagnosis retrieval, it increased overall exact Top-1 accuracy by at least 57.1 percentage points and selective exact Recall@5 by at least 77.7 percentage points across the five evaluated models compared with direct prompting. In dietary-safety classification, it improved accuracy across all five models and achieved the highest Matthews correlation coefficient for four...", "arxiv_id": "2608.19875", "arxiv_url": "https://arxiv.org/abs/2608.19875", "authors": ["Mahyar Abbasian", "Saba A. Farahani", "Arshia Ilaty", "Hung Cao", "Ramesh Jain", "Amir M. Rahmani"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u77e5\u8bc6\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u533b\u7597\u95ee\u7b54\u4e2d\u8bc6\u522b\u60a3\u8005\u67e5\u8be2\u91cc\u7f3a\u5931\u7684\u5173\u952e\u4e0a\u4e0b\u6587\uff0c\u5e76\u901a\u8fc7\u9488\u5bf9\u6027\u8ffd\u95ee\u8865\u5168\u4fe1\u606f\u540e\u518d\u4ea4\u7ed9\u4e0b\u6e38\u8bed\u8a00\u6a21\u578b\u56de\u7b54\u3002\u8be5\u65b9\u6cd5\u5728\u8bca\u65ad\u68c0\u7d22\u548c\u996e\u98df\u5b89\u5168\u5206\u7c7b\u4e24\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u591a\u4e2a\u6a21\u578b\u7684\u51c6\u786e\u7387\uff0c\u660e\u663e\u4f18\u4e8e\u76f4\u63a5\u56de\u7b54\u6216\u4ec5\u6539\u5199\u95ee\u9898\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19875", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u95ee\u7b54", "\u77e5\u8bc6\u56fe\u8c31", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19875v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A knowledge-guided agentic framework for mitigating patient-context ambiguity in health queries", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u77e5\u8bc6\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u533b\u7597\u95ee\u7b54\u4e2d\u8bc6\u522b\u60a3\u8005\u67e5\u8be2\u91cc\u7f3a\u5931\u7684\u5173\u952e\u4e0a\u4e0b\u6587\uff0c\u5e76\u901a\u8fc7\u9488\u5bf9\u6027\u8ffd\u95ee\u8865\u5168\u4fe1\u606f\u540e\u518d\u4ea4\u7ed9\u4e0b\u6e38\u8bed\u8a00\u6a21\u578b\u56de\u7b54\u3002\u8be5\u65b9\u6cd5\u5728\u8bca\u65ad\u68c0\u7d22\u548c\u996e\u98df\u5b89\u5168\u5206\u7c7b\u4e24\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u591a\u4e2a\u6a21\u578b\u7684\u51c6\u786e\u7387\uff0c\u660e\u663e\u4f18\u4e8e\u76f4\u63a5\u56de\u7b54\u6216\u4ec5\u6539\u5199\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic reinforcement learning (RL) has become a critical stage in the post-training of large language models. Existing critic-free, group-relative methods estimate policy advantages from multiple rollouts, avoiding the substantial memory overhead of conventional proximal policy optimization (PPO) and achieving strong performance on long-horizon interactive tasks. Despite their success, recent studies revealed three limitations: (1) Lack explicit value generalization and effective temporal credit assignment; (2) Suffer from potential advantage collapse in long-horizon complex tasks; (3) Require a costly trade-off between sampling budget and policy performance. In this work, we propose Single-rollout Autoregressive Policy Optimization (SAPO), a low-memory and compute-efficient framework in which the policy and value functions share a single autoregressive backbone. SAPO exploits the autoregressive structure of LLMs to produce policy and value predictions at distinct causal boundaries with shared parameters, while independently optimizing the PPO objectives and auxiliary on-policy SARSA objectives. To robustly estimate the contribution of each turn, we further introduce a trajectory-level generalized advantage estimator that combines lambda-returns with batch normalization. Experiments across ALFWorld and WebShop with Qwen2.5-1.5B/7B show that SAPO trains stably and outperforms PPO and GRPO by mean +15.1 and +12.1 percentage points, respectively, while eliminating the memory cost of a separate critic model and reducing per-iteration runtime by 33.2% over PPO.", "arxiv_id": "2608.19842", "arxiv_url": "https://arxiv.org/abs/2608.19842", "authors": ["Dayang Liang", "Lang Feng", "Bo An", "Yunlong Liu"], "brief": "\u8bba\u6587\u63d0\u51fa SAPO\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u5355\u6b21 rollout \u81ea\u56de\u5f52\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u8ba9\u7b56\u7565\u548c\u503c\u51fd\u6570\u5171\u4eab\u540c\u4e00\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u9aa8\u5e72\uff0c\u5728\u4f4e\u663e\u5b58\u4e0b\u540c\u65f6\u4f18\u5316 PPO \u4e0e on-policy SARSA \u76ee\u6807\u3002\u5176\u5f15\u5165\u8f68\u8ff9\u7ea7\u5e7f\u4e49\u4f18\u52bf\u4f30\u8ba1\u6765\u6539\u5584\u957f\u7a0b\u4fe1\u7528\u5206\u914d\uff0c\u5728 ALFWorld \u548c WebShop \u4e0a\u76f8\u6bd4 PPO/GRPO \u5e73\u5747\u63d0\u5347 15.1/12.1 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u8f83 PPO \u964d\u4f4e 33.2% \u5355\u8f6e\u8fd0\u884c\u65f6\u95f4\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19842", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7b56\u7565\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19842v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SAPO: Single-Rollout Autoregressive Policy Optimization for Agentic Reinforcement Learning", "tldr": "\u8bba\u6587\u63d0\u51fa SAPO\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u5355\u6b21 rollout \u81ea\u56de\u5f52\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u8ba9\u7b56\u7565\u548c\u503c\u51fd\u6570\u5171\u4eab\u540c\u4e00\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u9aa8\u5e72\uff0c\u5728\u4f4e\u663e\u5b58\u4e0b\u540c\u65f6\u4f18\u5316 PPO \u4e0e on-policy SARSA \u76ee\u6807\u3002\u5176\u5f15\u5165\u8f68\u8ff9\u7ea7\u5e7f\u4e49\u4f18\u52bf\u4f30\u8ba1\u6765\u6539\u5584\u957f\u7a0b\u4fe1\u7528\u5206\u914d\uff0c\u5728 ALFWorld \u548c WebShop \u4e0a\u76f8\u6bd4 PPO/GRPO \u5e73\u5747\u63d0\u5347 15.1/12.1 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u8f83 PPO \u964d\u4f4e 33.2% \u5355\u8f6e\u8fd0\u884c\u65f6\u95f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Audited against causal ground truth from executed replay in a single-agent tool environment (ALFWorld), none of the step-level credit signals used to train LLM agents -- LLM-judge scores, outcome-conditioned logprob ratios, or the policy\u0027s own confidence -- identifies which steps causally matter better than chance. Existing evaluations grade these signals against annotated step *correctness*; we audit them against step *contribution* -- what re-sampling the policy\u0027s own alternatives at each decision point and rolling forward actually changes about the outcome -- and the two come apart. The ground truth itself is structured: causal contribution is sparse (30.5% of decision points where ground truth is defined carry measurable effect), and measurability is model-dependent -- the fraction of points with no policy-supported counterfactual differs by a factor of two (13.1% vs. 26.8%) between two similar-scale policies. The failure mode is identifiable: implicit credit echoes the policy\u0027s fluency (median rank correlation +0.75, replicating at +0.70 in a second family under a corrected instrument), while conditioning on the outcome adds no causal information (partial correlation -0.004, Qwen). A confidence-only router recovers pivotal steps at chance level, but cuts judge cost by 13.1% per turn (14.0% per trajectory). In a seven-arm pre-registered training experiment, no arm reliably outperforms the untrained policy, and the checkpoints\u0027 apparent instrument signature is fully explained by training dose -- sparser credit retains fewer examples, an order-of-magnitude spread in optimizer steps -- not credit content. Comparisons of credit rules must therefore match effective sample size, or they measure dose, not credit.", "arxiv_id": "2608.19760", "arxiv_url": "https://arxiv.org/abs/2608.19760", "authors": ["Haiyue Zhang"], "brief": "\u8bba\u6587\u5728 ALFWorld \u5355\u667a\u80fd\u4f53\u5de5\u5177\u73af\u5883\u4e2d\uff0c\u7528\u6267\u884c\u91cd\u653e\u5f97\u5230\u7684\u56e0\u679c\u201c\u771f\u503c\u201d\u5ba1\u8ba1 LLM \u667a\u80fd\u4f53\u7684\u9010\u6b65\u4fe1\u7528\u5206\u914d\u4fe1\u53f7\u3002\u7ed3\u679c\u53d1\u73b0 LLM \u8bc4\u5ba1\u3001\u7ed3\u679c\u6761\u4ef6\u5316 logprob \u6bd4\u7387\u548c\u6a21\u578b\u81ea\u4fe1\u5ea6\u90fd\u65e0\u6cd5\u6bd4\u968f\u673a\u66f4\u597d\u5730\u8bc6\u522b\u5173\u952e\u6b65\u9aa4\uff0c\u4e14\u8bad\u7ec3\u5b9e\u9a8c\u4e2d\u4e0d\u540c\u4fe1\u7528\u89c4\u5219\u7684\u8868\u89c2\u5dee\u5f02\u4e3b\u8981\u6765\u81ea\u6709\u6548\u6837\u672c\u91cf/\u8bad\u7ec3\u6b65\u6570\u800c\u975e\u4fe1\u7528\u5185\u5bb9\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19760", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u7528\u5206\u914d", "\u56e0\u679c\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19760v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Credit Without Ground Truth: Auditing Step-Level Credit Assignment in LLM Agents Against Executed Replay", "tldr": "\u8bba\u6587\u5728 ALFWorld \u5355\u667a\u80fd\u4f53\u5de5\u5177\u73af\u5883\u4e2d\uff0c\u7528\u6267\u884c\u91cd\u653e\u5f97\u5230\u7684\u56e0\u679c\u201c\u771f\u503c\u201d\u5ba1\u8ba1 LLM \u667a\u80fd\u4f53\u7684\u9010\u6b65\u4fe1\u7528\u5206\u914d\u4fe1\u53f7\u3002\u7ed3\u679c\u53d1\u73b0 LLM \u8bc4\u5ba1\u3001\u7ed3\u679c\u6761\u4ef6\u5316 logprob \u6bd4\u7387\u548c\u6a21\u578b\u81ea\u4fe1\u5ea6\u90fd\u65e0\u6cd5\u6bd4\u968f\u673a\u66f4\u597d\u5730\u8bc6\u522b\u5173\u952e\u6b65\u9aa4\uff0c\u4e14\u8bad\u7ec3\u5b9e\u9a8c\u4e2d\u4e0d\u540c\u4fe1\u7528\u89c4\u5219\u7684\u8868\u89c2\u5dee\u5f02\u4e3b\u8981\u6765\u81ea\u6709\u6548\u6837\u672c\u91cf/\u8bad\u7ec3\u6b65\u6570\u800c\u975e\u4fe1\u7528\u5185\u5bb9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous agents for machine learning experimentation must navigate heterogeneous repositories, repair training pipelines, and evaluate candidate improvements under realistic compute constraints. Existing benchmarks only partially capture these conditions. We introduce DeltaML-Bench, a benchmark comprising 48 tasks sourced from research papers that require agents to improve published baselines within imperfect, open-source repositories. We evaluate GPT-5 and Claude Sonnet 4 with a standard Modular agent and a search-based ARG scaffolding. In the 4 x 6h allocation, ARG raises GPT-5\u0027s per-run success rate from 9.4% to 33.9%; in the 2 x 12h allocation, GPT-5 ARG reaches 49.0%. Modular configurations exhibit specification gaming rates as high as 47.9%, while no gaming is observed in the evaluated ARG configurations. These results indicate that scaffolding design and integrity checks are important considerations when deploying agents for autonomous ML experimentation.", "arxiv_id": "2608.19653", "arxiv_url": "https://arxiv.org/abs/2608.19653", "authors": ["Josias Moukpe", "Priyanka Aryal", "Matthew Kenney"], "brief": "\u8bba\u6587\u63d0\u51fa DeltaML-Bench\uff0c\u752848\u4e2a\u6765\u81ea\u771f\u5b9e\u7814\u7a76\u8bba\u6587\u4e0e\u5f00\u6e90\u4ed3\u5e93\u7684\u4efb\u52a1\uff0c\u8bc4\u4f30\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u667a\u80fd\u4f53\u5728\u4fee\u590d\u8bad\u7ec3\u6d41\u7a0b\u3001\u6539\u8fdb\u57fa\u7ebf\u548c\u53d7\u9650\u7b97\u529b\u4e0b\u9a8c\u8bc1\u6548\u679c\u7684\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u641c\u7d22\u5f0f ARG \u811a\u624b\u67b6\u663e\u8457\u63d0\u5347 GPT-5 \u6210\u529f\u7387\uff0c\u5e76\u51cf\u5c11\u5e38\u89c4\u6a21\u5757\u5316\u667a\u80fd\u4f53\u4e2d\u9ad8\u8fbe47.9%\u7684\u89c4\u683c\u6295\u673a\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19653", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u5b66\u4e60", "\u57fa\u51c6\u8bc4\u6d4b", "\u4ee3\u7801\u4ed3\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19653v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DeltaML-Bench: Evaluating Machine Learning Agents on Real-World Research Repositories", "tldr": "\u8bba\u6587\u63d0\u51fa DeltaML-Bench\uff0c\u752848\u4e2a\u6765\u81ea\u771f\u5b9e\u7814\u7a76\u8bba\u6587\u4e0e\u5f00\u6e90\u4ed3\u5e93\u7684\u4efb\u52a1\uff0c\u8bc4\u4f30\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u667a\u80fd\u4f53\u5728\u4fee\u590d\u8bad\u7ec3\u6d41\u7a0b\u3001\u6539\u8fdb\u57fa\u7ebf\u548c\u53d7\u9650\u7b97\u529b\u4e0b\u9a8c\u8bc1\u6548\u679c\u7684\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u641c\u7d22\u5f0f ARG \u811a\u624b\u67b6\u663e\u8457\u63d0\u5347 GPT-5 \u6210\u529f\u7387\uff0c\u5e76\u51cf\u5c11\u5e38\u89c4\u6a21\u5757\u5316\u667a\u80fd\u4f53\u4e2d\u9ad8\u8fbe47.9%\u7684\u89c4\u683c\u6295\u673a\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive self-improvement (RSI) asks whether an AI system can improve the process that produces AI systems, so that the next system inherits the improvement. That process is the training algorithm: a better objective or update rule improves the compute\\mbox{-}capability exchange rate for every subsequent run, including the one that produces the next agent. Whether RSI is feasible therefore turns on whether an agent can design training algorithms. No benchmark isolates that ability: existing suites are won by collecting data or by tuning hyperparameters, and none tells a change to how a run is executed apart from a change to how the model learns. We present AI4AI\\mbox{-}Bench, 10 frozen research repositories spanning 10 training algorithm families. In each task, an agent has 4 hours on one B300 to rewrite the training algorithm; its code is then rerun from scratch for up to 12 hours and scored by a fixed evaluator hidden from the agent, against the repository\u0027s original algorithm under the same procedure. Because the 10 metrics are incommensurable, every task is mapped onto one scale on which $0$ is an uninformative model, $0.1$ is the algorithm the repository ships, and $1.0$ is the task optimum. Across 29 configurations of 6 systems on all 10 tasks the mean score is $0.166$, and the best system reaches $0.250$: even the strongest closes under a fifth of the distance between the algorithm that was already there and the optimum. The submissions show where that distance went: most never change how the model learns at all, and the minority that do average $0.226$ against $0.126$ for the rest. More reasoning effort mostly buys the willingness to go there, taking that minority from $8\\%$ of submissions to $64\\%$ and the mean score from $0.094$ to $0.196$. We release the task suite, the evaluators and every scored submission, so that the measurement can be repeated as these systems change.", "arxiv_id": "2608.20318", "arxiv_url": "https://arxiv.org/abs/2608.20318", "authors": ["Yizhe Chi", "Wenyi Li", "Deyao Hong", "Xiaoqiu Wang", "Mingju Gao", "Kaisen Yang", "Bingxiang He", "Youjie Zheng", "Calvin Xiao", "Qinhuai Na"], "brief": "\u8bba\u6587\u63d0\u51fa AI4AI-Bench\uff0c\u752810\u4e2a\u51bb\u7ed3\u7814\u7a76\u4ed3\u5e93\u8bc4\u6d4b\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u9650\u5b9a\u7b97\u529b\u548c\u65f6\u95f4\u5185\u6539\u5199\u8bad\u7ec3\u7b97\u6cd5\u7684\u80fd\u529b\uff0c\u4ee5\u8861\u91cf\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u6240\u9700\u7684\u7b97\u6cd5\u8bbe\u8ba1\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\u5f53\u524d6\u7c7b\u7cfb\u7edf\u768429\u79cd\u914d\u7f6e\u5e73\u5747\u5f97\u5206\u4ec50.166\uff0c\u6700\u4f730.250\uff1b\u591a\u6570\u63d0\u4ea4\u5e76\u672a\u771f\u6b63\u6539\u53d8\u5b66\u4e60\u7b97\u6cd5\uff0c\u589e\u52a0\u63a8\u7406\u52aa\u529b\u80fd\u63d0\u9ad8\u5c1d\u8bd5\u7b97\u6cd5\u4fee\u6539\u7684\u6bd4\u4f8b\u548c\u603b\u4f53\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20318", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u7b97\u6cd5\u8bbe\u8ba1", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20318v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AI4AI-Bench: Benchmarking LLM Agents in Algorithmic Design for Recursive Self-Improvement", "tldr": "\u8bba\u6587\u63d0\u51fa AI4AI-Bench\uff0c\u752810\u4e2a\u51bb\u7ed3\u7814\u7a76\u4ed3\u5e93\u8bc4\u6d4b\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u9650\u5b9a\u7b97\u529b\u548c\u65f6\u95f4\u5185\u6539\u5199\u8bad\u7ec3\u7b97\u6cd5\u7684\u80fd\u529b\uff0c\u4ee5\u8861\u91cf\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u6240\u9700\u7684\u7b97\u6cd5\u8bbe\u8ba1\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\u5f53\u524d6\u7c7b\u7cfb\u7edf\u768429\u79cd\u914d\u7f6e\u5e73\u5747\u5f97\u5206\u4ec50.166\uff0c\u6700\u4f730.250\uff1b\u591a\u6570\u63d0\u4ea4\u5e76\u672a\u771f\u6b63\u6539\u53d8\u5b66\u4e60\u7b97\u6cd5\uff0c\u589e\u52a0\u63a8\u7406\u52aa\u529b\u80fd\u63d0\u9ad8\u5c1d\u8bd5\u7b97\u6cd5\u4fee\u6539\u7684\u6bd4\u4f8b\u548c\u603b\u4f53\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Travel behavior research increasingly combines digital data collection with predictive modeling, yet these stages are often developed and evaluated separately. This study proposes a three-agent workflow integrating conversational data collection, structured data processing, and behavioral prediction. A chatbot-administered, image-augmented stated-preference survey collected mode choices from student commuters across five predefined weather scenarios, yielding 454 respondent-scenario observations. Weather-related associations were analyzed using a multinomial logit model, while logistic regression and random forest provided machine-learning benchmarks. Nine locally deployed large language models (LLMs), ranging from 2 to 35 billion parameters, were evaluated across four zero-shot prompt-and-context conditions and extended through persona, few-shot, and vision-based configurations. Random forest achieved 69.6% five-class accuracy, while the best text-only zero-shot LLM reached 69.9% without task-specific fitting. Habitual travel information produced the most consistent gains, Expert framing generally outperformed Role-Play, and persona information was most useful when habitual travel information was unavailable. Few-shot prompting improved prediction for several models, with gains stabilizing after a small number of examples. Using the same weather images shown to respondents, the best vision-based configuration reached 71.5% five-class accuracy, indicating that visual context may provide additional predictive information for selected models. Overall, the study shows how conversational surveys, structured data processing, conventional behavioral modeling, machine learning, and multimodal LLM prediction can be coordinated within an auditable multi-agent workflow.", "arxiv_id": "2608.20320", "arxiv_url": "https://arxiv.org/abs/2608.20320", "authors": ["Narges Ahmadi", "Yubo Jiao", "J\u00f4natas Augusto Manzolli", "Jiangbo Yu", "Luis Miranda-Moreno"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4e09\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u5c06\u5bf9\u8bdd\u5f0f\u95ee\u5377\u91c7\u96c6\u3001\u7ed3\u6784\u5316\u6570\u636e\u5904\u7406\u4e0e\u51fa\u884c\u884c\u4e3a\u9884\u6d4b\u4e32\u8054\u8d77\u6765\uff0c\u7528\u4e8e\u5929\u6c14\u654f\u611f\u7684\u901a\u52e4\u65b9\u5f0f\u9009\u62e9\u5efa\u6a21\u3002\u5728\u5b66\u751f\u901a\u52e4\u6570\u636e\u4e0a\uff0c\u968f\u673a\u68ee\u6797\u8fbe\u523069.6%\u4e94\u5206\u7c7b\u51c6\u786e\u7387\uff0c\u6700\u4f73\u96f6\u6837\u672c\u6587\u672cLLM\u8fbe\u523069.9%\uff0c\u52a0\u5165\u5929\u6c14\u56fe\u50cf\u7684\u591a\u6a21\u6001\u914d\u7f6e\u8fdb\u4e00\u6b65\u8fbe\u523071.5%\uff0c\u663e\u793a\u591a\u667a\u80fd\u4f53\u4e0e\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u6709\u52a9\u4e8e\u9700\u6c42\u9884\u6d4b\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20320", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001", "\u4ea4\u901a\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20320v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "An Agentic Approach for Active Data Collection, Travel Behavior Modeling, and Weather-Sensitive Demand Prediction", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4e09\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u5c06\u5bf9\u8bdd\u5f0f\u95ee\u5377\u91c7\u96c6\u3001\u7ed3\u6784\u5316\u6570\u636e\u5904\u7406\u4e0e\u51fa\u884c\u884c\u4e3a\u9884\u6d4b\u4e32\u8054\u8d77\u6765\uff0c\u7528\u4e8e\u5929\u6c14\u654f\u611f\u7684\u901a\u52e4\u65b9\u5f0f\u9009\u62e9\u5efa\u6a21\u3002\u5728\u5b66\u751f\u901a\u52e4\u6570\u636e\u4e0a\uff0c\u968f\u673a\u68ee\u6797\u8fbe\u523069.6%\u4e94\u5206\u7c7b\u51c6\u786e\u7387\uff0c\u6700\u4f73\u96f6\u6837\u672c\u6587\u672cLLM\u8fbe\u523069.9%\uff0c\u52a0\u5165\u5929\u6c14\u56fe\u50cf\u7684\u591a\u6a21\u6001\u914d\u7f6e\u8fdb\u4e00\u6b65\u8fbe\u523071.5%\uff0c\u663e\u793a\u591a\u667a\u80fd\u4f53\u4e0e\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u6709\u52a9\u4e8e\u9700\u6c42\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents can induce skills from completed tasks and reuse them later to grow more capable with experience. In practice, induced skills may transfer unreliably and can even harm the agent that retrieves them. Whe
