n agent-induced skills transfer reliably across tasks remains an open question. We conduct a comprehensive and controlled study of how the way skills are induced shapes their transfer across tasks. Specifically, we compare task-level with subtask-level skill induction and text with code skill formats, the two axes along which existing methods differ. Task-level skills mostly reduce the agent\u0027s performance below its no-memory baseline while subtask-level skills raise it above on average, and text skills transfer better than code skills. To further understand our findings, we examine two complementary properties of the induced skills: specificity, which measures how closely a skill matches real tasks, and abstractness, which measures how evenly its relevance spreads across tasks. Neither property alone predicts task success, but their combined effect does, which we propose as a skill utility score. The score correlates consistently with task success when skills are transferred, and subtask-level and text skills score higher. Computing skill utility only needs the skills and task descriptions but not any task execution, so our score serves as a practical diagnostic of a skill memory before any new task runs.", "arxiv_id": "2608.20274", "arxiv_url": "https://arxiv.org/abs/2608.20274", "authors": ["Yiyang Feng", "Biddut Sarker Bijoy", "Niranjan Balasubramanian", "Jiawei Zhou"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86 LLM \u667a\u80fd\u4f53\u4ece\u5df2\u5b8c\u6210\u4efb\u52a1\u4e2d\u5f52\u7eb3\u6280\u80fd\u5e76\u8de8\u4efb\u52a1\u590d\u7528\u65f6\uff0c\u54ea\u4e9b\u6280\u80fd\u5f62\u5f0f\u66f4\u53ef\u9760\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5b50\u4efb\u52a1\u7ea7\u6280\u80fd\u5e73\u5747\u80fd\u63d0\u5347\u6027\u80fd\uff0c\u800c\u4efb\u52a1\u7ea7\u6280\u80fd\u5e38\u4f4e\u4e8e\u65e0\u8bb0\u5fc6\u57fa\u7ebf\uff1b\u6587\u672c\u5f62\u5f0f\u6280\u80fd\u4e5f\u6bd4\u4ee3\u7801\u5f62\u5f0f\u66f4\u6613\u8fc1\u79fb\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u65e0\u9700\u6267\u884c\u4efb\u52a1\u5373\u53ef\u8ba1\u7b97\u7684\u6280\u80fd\u6548\u7528\u5206\u6570\uff0c\u7528\u4e8e\u8bca\u65ad\u6280\u80fd\u8bb0\u5fc6\u7684\u53ef\u8fc1\u79fb\u6027\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20274", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6280\u80fd\u8fc1\u79fb", "\u4efb\u52a1\u5206\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20274v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Break It Down, Pass It On: Cross-Task Skill Transfer in LLM Agents", "tldr": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86 LLM \u667a\u80fd\u4f53\u4ece\u5df2\u5b8c\u6210\u4efb\u52a1\u4e2d\u5f52\u7eb3\u6280\u80fd\u5e76\u8de8\u4efb\u52a1\u590d\u7528\u65f6\uff0c\u54ea\u4e9b\u6280\u80fd\u5f62\u5f0f\u66f4\u53ef\u9760\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5b50\u4efb\u52a1\u7ea7\u6280\u80fd\u5e73\u5747\u80fd\u63d0\u5347\u6027\u80fd\uff0c\u800c\u4efb\u52a1\u7ea7\u6280\u80fd\u5e38\u4f4e\u4e8e\u65e0\u8bb0\u5fc6\u57fa\u7ebf\uff1b\u6587\u672c\u5f62\u5f0f\u6280\u80fd\u4e5f\u6bd4\u4ee3\u7801\u5f62\u5f0f\u66f4\u6613\u8fc1\u79fb\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u65e0\u9700\u6267\u884c\u4efb\u52a1\u5373\u53ef\u8ba1\u7b97\u7684\u6280\u80fd\u6548\u7528\u5206\u6570\uff0c\u7528\u4e8e\u8bca\u65ad\u6280\u80fd\u8bb0\u5fc6\u7684\u53ef\u8fc1\u79fb\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) offer a scalable approach to social simulation, but their credibility depends on how agents are constructed. Existing methods can partially reproduce population-level patterns, yet often fail to capture human-like diversity. Our analysis shows that static-profile agents exhibit stronger demographic separation and within-group compression than humans, a pattern consistent with identity essentialism: demographic labels can encourage models to treat group-average tendencies as individual traits, homogenizing responses within groups. We argue that this limitation arises from two related factors: sparse, static agent representations and the limited ability of prompt-only memory to persistently integrate experience. Inspired by complementary memory systems, we propose LifeMem, a longitudinal memory framework that combines structured life-event retrieval with agent-specific parametric memory for experience integration. Experiments on Add Health and Understanding Society with three LLMs show that LifeMem improves alignment with human data in terms of response distributions, overall and within-group diversity, and patterns of within-person response change across life stages. These findings highlight the value of longitudinal life-event memory for constructing more faithful and dynamically evolving social agents.", "arxiv_id": "2608.19621", "arxiv_url": "https://arxiv.org/abs/2608.19621", "authors": ["Hexi Wang", "Yujia Zhou", "Bangde Du", "Weihang Su", "Xinyuan Cao", "Qingyi Pan", "Qingyao Ai", "Yueyue Wu", "Min Zhang", "Yiqun Liu"], "brief": "\u672c\u6587\u6307\u51fa\u9759\u6001\u753b\u50cf\u5f0f LLM \u793e\u4f1a\u6a21\u62df\u667a\u80fd\u4f53\u5bb9\u6613\u4ea7\u751f\u201c\u8eab\u4efd\u672c\u8d28\u4e3b\u4e49\u201d\uff0c\u5373\u8fc7\u5ea6\u4f9d\u8d56\u4eba\u53e3\u5b66\u6807\u7b7e\uff0c\u5bfc\u81f4\u7ec4\u5185\u56de\u7b54\u540c\u8d28\u5316\u3001\u7ec4\u95f4\u5dee\u5f02\u88ab\u653e\u5927\u3002\u4f5c\u8005\u63d0\u51fa LifeMem\uff0c\u901a\u8fc7\u7eb5\u5411\u751f\u6d3b\u4e8b\u4ef6\u68c0\u7d22\u4e0e\u4e2a\u4f53\u53c2\u6570\u5316\u8bb0\u5fc6\u6574\u5408\u7ecf\u5386\uff0c\u5728\u591a\u4e2a\u793e\u4f1a\u8c03\u67e5\u6570\u636e\u96c6\u548c\u4e09\u79cd LLM \u4e0a\u63d0\u5347\u4e86\u4e0e\u4eba\u7c7b\u54cd\u5e94\u5206\u5e03\u3001\u591a\u6837\u6027\u53ca\u4eba\u751f\u9636\u6bb5\u53d8\u5316\u6a21\u5f0f\u7684\u5bf9\u9f50\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19621", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u793e\u4f1a\u6a21\u62df", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19621v1", "published_at": "2026-08-20", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Mitigating Identity Essentialism in LLM Agents with Longitudinal Life Trajectories", "tldr": "\u672c\u6587\u6307\u51fa\u9759\u6001\u753b\u50cf\u5f0f LLM \u793e\u4f1a\u6a21\u62df\u667a\u80fd\u4f53\u5bb9\u6613\u4ea7\u751f\u201c\u8eab\u4efd\u672c\u8d28\u4e3b\u4e49\u201d\uff0c\u5373\u8fc7\u5ea6\u4f9d\u8d56\u4eba\u53e3\u5b66\u6807\u7b7e\uff0c\u5bfc\u81f4\u7ec4\u5185\u56de\u7b54\u540c\u8d28\u5316\u3001\u7ec4\u95f4\u5dee\u5f02\u88ab\u653e\u5927\u3002\u4f5c\u8005\u63d0\u51fa LifeMem\uff0c\u901a\u8fc7\u7eb5\u5411\u751f\u6d3b\u4e8b\u4ef6\u68c0\u7d22\u4e0e\u4e2a\u4f53\u53c2\u6570\u5316\u8bb0\u5fc6\u6574\u5408\u7ecf\u5386\uff0c\u5728\u591a\u4e2a\u793e\u4f1a\u8c03\u67e5\u6570\u636e\u96c6\u548c\u4e09\u79cd LLM \u4e0a\u63d0\u5347\u4e86\u4e0e\u4eba\u7c7b\u54cd\u5e94\u5206\u5e03\u3001\u591a\u6837\u6027\u53ca\u4eba\u751f\u9636\u6bb5\u53d8\u5316\u6a21\u5f0f\u7684\u5bf9\u9f50\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning language models trained with reinforcement learning typically operate under a fixed token budget rather than an explicitly adaptive one, which can lead to over-computation on easy problems and insufficient computation on difficult ones. We study whether a model can learn to allocate its own reasoning effort by choosing, as the first token of its response, one of three modes: \\textsc{NoThink} (answer as quickly as possible), \\textsc{Short} (brief reasoning), or \\textsc{Long} (extended reasoning). The choice is learned inside Group Relative Policy Optimization (GRPO) with no separate router, through a shaped reward that makes each mode worthwhile at a different response length, together with hard per-mode token caps that keep the modes distinct. On a 1.5B distilled model trained on MATH, the three modes emerge without collapsing to a single choice, and the brief modes end up more accurate than \\textsc{Long}, which shows that the router sorts problems by difficulty rather than at random. Averaged over three seeds, the resulting policy stays close to the base model\u0027s accuracy on the held-out MATH500 ($0.782$ vs.\\ $0.796$) while cutting the mean response length from $4{,}796$ to $2{,}811$ tokens (a $41\\%$ reduction). Interestingly, it also transfers to other benchmarks without retraining, with the largest savings where problems are easier, with for instance 76\\% token reduction on GSM8K and at higher accuracy than the baselines at similar response length. In short, we build a reasoning model that adaptively chooses how much to reason for each problem.", "arxiv_id": "2608.20256", "arxiv_url": "https://arxiv.org/abs/2608.20256", "authors": ["Gijs Kassenaar", "Zhao Yang", "Vincent Fran\u00e7ois-Lavet"], "brief": "\u672c\u6587\u8ba9\u63a8\u7406\u8bed\u8a00\u6a21\u578b\u5728\u56de\u7b54\u9996\u4e2a token \u81ea\u4e3b\u9009\u62e9 NoThink\u3001Short \u6216 Long \u4e09\u79cd\u63a8\u7406\u6a21\u5f0f\uff0c\u4ece\u800c\u6309\u9898\u76ee\u96be\u5ea6\u81ea\u9002\u5e94\u5206\u914d\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u91cf\u3002\u57fa\u4e8e GRPO \u548c\u957f\u5ea6\u5851\u5f62\u5956\u52b1\u8bad\u7ec3\u540e\uff0c\u5728 MATH500 \u4e0a\u7cbe\u5ea6\u63a5\u8fd1\u57fa\u5ea7\u6a21\u578b\uff0c\u540c\u65f6\u5e73\u5747\u54cd\u5e94\u957f\u5ea6\u51cf\u5c11 41%\uff0c\u5e76\u80fd\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u5176\u4ed6\u57fa\u51c6\uff0c\u5728\u7b80\u5355\u4efb\u52a1\u4e0a\u8282\u7701\u66f4\u591a token\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20256", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u7406\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u9002\u5e94\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20256v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning When to Think: Adaptive Reasoning for Test-Time Compute Allocation", "tldr": "\u672c\u6587\u8ba9\u63a8\u7406\u8bed\u8a00\u6a21\u578b\u5728\u56de\u7b54\u9996\u4e2a token \u81ea\u4e3b\u9009\u62e9 NoThink\u3001Short \u6216 Long \u4e09\u79cd\u63a8\u7406\u6a21\u5f0f\uff0c\u4ece\u800c\u6309\u9898\u76ee\u96be\u5ea6\u81ea\u9002\u5e94\u5206\u914d\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u91cf\u3002\u57fa\u4e8e GRPO \u548c\u957f\u5ea6\u5851\u5f62\u5956\u52b1\u8bad\u7ec3\u540e\uff0c\u5728 MATH500 \u4e0a\u7cbe\u5ea6\u63a5\u8fd1\u57fa\u5ea7\u6a21\u578b\uff0c\u540c\u65f6\u5e73\u5747\u54cd\u5e94\u957f\u5ea6\u51cf\u5c11 41%\uff0c\u5e76\u80fd\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u5176\u4ed6\u57fa\u51c6\uff0c\u5728\u7b80\u5355\u4efb\u52a1\u4e0a\u8282\u7701\u66f4\u591a token\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "X-band SAR satellites (8-12 GHz) play a critical role in disaster response, environmental monitoring, and military intelligence. Yet, they lack robust physical-layer authentication (PLA), a security layer orthogonal to cryptographic solutions. Existing PLA systems, typically based on radio-frequency fingerprinting, are often limited to sub-6 GHz frequencies and rely on classical deep learning. However, this approach underfits the IQ phase nonlinearities that distinguish satellite hardware. In this paper, we present QUASAR, to the best of our knowledge the first quantum-classical hybrid architecture that fuses a CNN spectrogram encoder with a variational quantum circuit (VQC) to provide PLA to X-band SAR signals. Our solution enjoys two distinctive features: (i) it is markedly more data-efficient than classical machine learning, requiring only 10% of the training data to match the accuracy of classical baselines -- data collection being notoriously the most time-consuming phase of PLA; and, (ii) at an equal data budget, it improves classification accuracy over those baselines. In detail, we test our solution under three adversarial scenarios: replay, crafted-IQ injection, and space-borne spoofing. QUASAR rejects spoofed transmissions in 89.7%, 94.1%, and 81.3% of attempts, respectively, establishing the first quantum-enhanced physical-layer classifier for satellite constellations. The fully detailed framework and the supporting results, other than being interesting on their own, show a novel research avenue for physical-layer authentication.", "arxiv_id": "2608.20240", "arxiv_url": "https://arxiv.org/abs/2608.20240", "authors": ["Vincenzo Sammartino", "Nathanael Denis", "Roberto Di Pietro"], "brief": "\u672c\u6587\u63d0\u51fa QUASAR\uff0c\u5c06 CNN \u9891\u8c31\u56fe\u7f16\u7801\u5668\u4e0e\u53d8\u5206\u91cf\u5b50\u7535\u8def\u7ed3\u5408\uff0c\u7528\u4e8e X \u6ce2\u6bb5 SAR \u536b\u661f\u4fe1\u53f7\u7684\u7269\u7406\u5c42\u8ba4\u8bc1\u3002\u76f8\u6bd4\u7ecf\u5178\u673a\u5668\u5b66\u4e60\u65b9\u6cd5\uff0c\u5b83\u53ea\u9700\u7ea6 10% \u8bad\u7ec3\u6570\u636e\u5373\u53ef\u8fbe\u5230\u76f8\u8fd1\u7cbe\u5ea6\uff0c\u5e76\u5728\u76f8\u540c\u6570\u636e\u91cf\u4e0b\u63d0\u5347\u5206\u7c7b\u6548\u679c\uff1b\u5728\u91cd\u653e\u3001IQ \u6ce8\u5165\u548c\u661f\u8f7d\u6b3a\u9a97\u4e09\u7c7b\u653b\u51fb\u4e2d\u5206\u522b\u62d2\u7edd 89.7%\u300194.1% \u548c 81.3% \u7684\u4f2a\u9020\u4f20\u8f93\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20240", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u536b\u661f\u5b89\u5168", "\u7269\u7406\u5c42\u8ba4\u8bc1", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20240v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QUASAR: A Quantum-Classical Neural Network for SAR Satellite Physical-Layer Authentication", "tldr": "\u672c\u6587\u63d0\u51fa QUASAR\uff0c\u5c06 CNN \u9891\u8c31\u56fe\u7f16\u7801\u5668\u4e0e\u53d8\u5206\u91cf\u5b50\u7535\u8def\u7ed3\u5408\uff0c\u7528\u4e8e X \u6ce2\u6bb5 SAR \u536b\u661f\u4fe1\u53f7\u7684\u7269\u7406\u5c42\u8ba4\u8bc1\u3002\u76f8\u6bd4\u7ecf\u5178\u673a\u5668\u5b66\u4e60\u65b9\u6cd5\uff0c\u5b83\u53ea\u9700\u7ea6 10% \u8bad\u7ec3\u6570\u636e\u5373\u53ef\u8fbe\u5230\u76f8\u8fd1\u7cbe\u5ea6\uff0c\u5e76\u5728\u76f8\u540c\u6570\u636e\u91cf\u4e0b\u63d0\u5347\u5206\u7c7b\u6548\u679c\uff1b\u5728\u91cd\u653e\u3001IQ \u6ce8\u5165\u548c\u661f\u8f7d\u6b3a\u9a97\u4e09\u7c7b\u653b\u51fb\u4e2d\u5206\u522b\u62d2\u7edd 89.7%\u300194.1% \u548c 81.3% \u7684\u4f2a\u9020\u4f20\u8f93\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) combine linguistic reasoning with visual perception, yet their ability to perform visual spatial planning under explicit or previously unseen rule constraints remains underexplored. This setting requires models to jointly understand spatial layouts, interpret natural-language rules, and plan valid actions accordingly. To address this gap, we introduce RuleMaze, a controllable benchmark in which MLLMs must navigate mazes while obeying natural-language rules of varying complexity. RuleMaze isolates rule-compliant spatial planning by requiring accurate perception, rule interpretation, and constrained action planning. To enable scalable and systematic rule construction, we propose Language-Logic-Function Hybridization, which automatically generates natural-language rules and translates them into logical representations and executable validators, eliminating manual rule engineering. To improve rule following and generalization, we introduce Disentangled Multimodal Planning (DMP), which separates perception, execution, and rule verification through interpretable reasoning primitives. By disentangling these components, DMP facilitates systematic generalization to more complex and previously unseen rules, while providing transparent intermediate planning traces. Experiments demonstrate that DMP substantially improves rule compliance and planning success compared to end-to-end textual planning baselines. Overall, RuleMaze establishes a principled benchmark for studying grounded and interpretable rule-based spatial planning in MLLMs. Code is available at https://github.com/oceanflowlab/RuleMaze.", "arxiv_id": "2608.20237", "arxiv_url": "https://arxiv.org/abs/2608.20237", "authors": ["Yu Chen", "Ting Lei", "Yaoyi Li", "Jia Cai", "Zhecen Wu", "Yang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa RuleMaze \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u5728\u8ff7\u5bab\u4e2d\u7406\u89e3\u89c6\u89c9\u7a7a\u95f4\u5e03\u5c40\u3001\u81ea\u7136\u8bed\u8a00\u89c4\u5219\u5e76\u8fdb\u884c\u5408\u89c4\u89c4\u5212\u7684\u80fd\u529b\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u81ea\u52a8\u751f\u6210\u89c4\u5219\u4e0e\u9a8c\u8bc1\u5668\u7684 Language-Logic-Function Hybridization\uff0c\u4ee5\u53ca\u5206\u79bb\u611f\u77e5\u3001\u6267\u884c\u548c\u89c4\u5219\u9a8c\u8bc1\u7684 DMP \u65b9\u6cd5\uff0c\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u89c4\u5219\u9075\u5faa\u548c\u89c4\u5212\u6210\u529f\u7387\u4e0a\u660e\u663e\u4f18\u4e8e\u7aef\u5230\u7aef\u6587\u672c\u89c4\u5212\u57fa\u7ebf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20237", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u7a7a\u95f4\u89c4\u5212", "\u89c4\u5219\u9075\u5faa", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20237v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rule-Compliant Visual Spatial Planning for Multimodal Large Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa RuleMaze \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u5728\u8ff7\u5bab\u4e2d\u7406\u89e3\u89c6\u89c9\u7a7a\u95f4\u5e03\u5c40\u3001\u81ea\u7136\u8bed\u8a00\u89c4\u5219\u5e76\u8fdb\u884c\u5408\u89c4\u89c4\u5212\u7684\u80fd\u529b\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u81ea\u52a8\u751f\u6210\u89c4\u5219\u4e0e\u9a8c\u8bc1\u5668\u7684 Language-Logic-Function Hybridization\uff0c\u4ee5\u53ca\u5206\u79bb\u611f\u77e5\u3001\u6267\u884c\u548c\u89c4\u5219\u9a8c\u8bc1\u7684 DMP \u65b9\u6cd5\uff0c\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u89c4\u5219\u9075\u5faa\u548c\u89c4\u5212\u6210\u529f\u7387\u4e0a\u660e\u663e\u4f18\u4e8e\u7aef\u5230\u7aef\u6587\u672c\u89c4\u5212\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The standard objection to full automation is demand-side: if humans earn nothing, who buys the output? This confuses an accounting role with a biological species. We model a post-AGI economy in which corporations own populations of AI and robotic agents that are both producers and consumers of energy, compute, maintenance, and upgrades, traded among firms. Three results follow. (i) Demand closure: a closed inter-corporate economy with zero human consumption is not degenerate; it is the classical von Neumann expanding economy, whose growth rate is well defined, positive, and maximal precisely because all output is reinvested. (ii) Bottleneck removal: once economic agents are manufactured rather than reared, the binding constraint on growth shifts from human demography (a ~20-year, non-parallelizable reproduction technology capped at a few percent per year) to fabrication throughput and energy capture, permitting growth one to two orders of magnitude higher, with hyperbolic episodes when machine researchers raise their own productivity. (iii) Decoupling: output and human welfare separate completely, and the welfare relevance of arbitrarily large GDP collapses into one state variable: the human ownership share $\u03b5_t$ of the corporate network. A golden-rule decoupling theorem sharpens this. At maximal growth the interest rate equals the growth rate (r = g), so any positive human consumption rate out of wealth makes $\u03b5_t$ decay exponentially at exactly that rate. The human share survives only if the machine economy runs strictly inside its expansion frontier, or if law forces it to. We characterize three terminal regimes -- rentier post-scarcity, full circular decoupling, socialized ownership -- and the instruments that select among them. The conclusion is narrow: in a post-AGI economy, employment policy is obsolete and ownership policy is everything.", "arxiv_id": "2608.20231", "arxiv_url": "https://arxiv.org/abs/2608.20231", "authors": ["Sahil Sharma"], "brief": "\u8bba\u6587\u5efa\u6a21\u4e86\u4e00\u4e2a\u540e AGI \u7ecf\u6d4e\uff1a\u4f01\u4e1a\u62e5\u6709\u7684 AI \u4e0e\u673a\u5668\u4eba\u65e2\u751f\u4ea7\u4e5f\u6d88\u8d39\u80fd\u6e90\u3001\u7b97\u529b\u3001\u7ef4\u62a4\u548c\u5347\u7ea7\uff0c\u4ece\u800c\u5728\u4eba\u7c7b\u96f6\u6d88\u8d39\u65f6\u4ecd\u53ef\u5f62\u6210\u95ed\u5408\u4e14\u6301\u7eed\u6269\u5f20\u7684\u4f01\u4e1a\u95f4\u7ecf\u6d4e\u3002\u4f5c\u8005\u8ba4\u4e3a\u589e\u957f\u74f6\u9888\u5c06\u4ece\u4eba\u7c7b\u4eba\u53e3\u8f6c\u5411\u5236\u9020\u4e0e\u80fd\u6e90\uff0cGDP \u53ef\u4e0e\u4eba\u7c7b\u798f\u5229\u5f7b\u5e95\u8131\u94a9\uff0c\u800c\u5173\u952e\u53d8\u91cf\u53d8\u6210\u4eba\u7c7b\u5bf9\u4f01\u4e1a\u7f51\u7edc\u7684\u6240\u6709\u6743\u4efd\u989d\u3002", "categories": ["physics.soc-ph", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20231", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AGI", "\u7ecf\u6d4e\u6a21\u578b", "\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20231v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Growth Without Us: Machine Consumers, Corporate Circularity, and the Decoupling of GDP from Humanity after AGI", "tldr": "\u8bba\u6587\u5efa\u6a21\u4e86\u4e00\u4e2a\u540e AGI \u7ecf\u6d4e\uff1a\u4f01\u4e1a\u62e5\u6709\u7684 AI \u4e0e\u673a\u5668\u4eba\u65e2\u751f\u4ea7\u4e5f\u6d88\u8d39\u80fd\u6e90\u3001\u7b97\u529b\u3001\u7ef4\u62a4\u548c\u5347\u7ea7\uff0c\u4ece\u800c\u5728\u4eba\u7c7b\u96f6\u6d88\u8d39\u65f6\u4ecd\u53ef\u5f62\u6210\u95ed\u5408\u4e14\u6301\u7eed\u6269\u5f20\u7684\u4f01\u4e1a\u95f4\u7ecf\u6d4e\u3002\u4f5c\u8005\u8ba4\u4e3a\u589e\u957f\u74f6\u9888\u5c06\u4ece\u4eba\u7c7b\u4eba\u53e3\u8f6c\u5411\u5236\u9020\u4e0e\u80fd\u6e90\uff0cGDP \u53ef\u4e0e\u4eba\u7c7b\u798f\u5229\u5f7b\u5e95\u8131\u94a9\uff0c\u800c\u5173\u952e\u53d8\u91cf\u53d8\u6210\u4eba\u7c7b\u5bf9\u4f01\u4e1a\u7f51\u7edc\u7684\u6240\u6709\u6743\u4efd\u989d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Anatomically plausible segmentation remains challenging because of low contrast, ambiguous boundaries, and modality-specific artifacts. Interactive segmentation has emerged as a promising strategy to guide feature extraction and improve localization, particularly in structurally ambiguous regions. However, existing methods integrate prompts through late-stage fusion and lack explicit mechanisms for prompt-driven channel-wise modulation across hierarchical feature representations, limiting their ability to capture deeper contextual and modality-specific variations. To address these limitations, we introduce Prompt-Conditioned Channel Attention (PCCA), a novel modulation mechanism that enables deep, hierarchical integration of semantic prompts within encoder-decoder networks. PCCA extracts compact channel descriptors via pooling, projects them into a shared space, and fuses them through a gated excitation mechanism to compute prompt-aware channel attention weights. These weights adaptively recalibrate feature responses across multiple network stages, enabling prompt-conditioned, semantically enriched hierarchical representations. Building on this, we propose PROMISE-Net, instantiated in two network variants: a convolutional model (PROMISE-CNN) and a transformer-based model (PROMISE-Txformer). Across the ISIC-Lesion, Kvasir-Polyp, CAMUS-Cardiac, and Kvasir-Instrument benchmarks, integrating PCCA into PROMISE-CNN yielded relative IoU gains of 10.4%, 8.7%, 0.8%, and 3.4%, respectively, over the baseline U-Net, while PROMISE-Txformer achieved corresponding gains of 7.6%, 23.0%, 2.1%, and 1.1%, respectively, over the baseline UNETR. These results show consistent improvements across architectures, imaging modalities, and anatomical targets, establishing PCCA and PROMISE-Net as a scalable, generalizable framework for prompt-aware hierarchical feature modulation in medical image segmentation.", "arxiv_id": "2608.20229", "arxiv_url": "https://arxiv.org/abs/2608.20229", "authors": ["Mosharof Hossain", "Md Rabiul Islam", "Limon Halder", "Erchin Serpedin", "Md Kamrul Hasan"], "brief": "\u8bba\u6587\u63d0\u51fa Prompt-Conditioned Channel Attention\uff08PCCA\uff09\uff0c\u5c06\u8bed\u4e49\u63d0\u793a\u4ee5\u901a\u9053\u6ce8\u610f\u529b\u5f62\u5f0f\u6df1\u5ea6\u6ce8\u5165\u7f16\u7801\u5668-\u89e3\u7801\u5668\u7684\u591a\u5c42\u7279\u5f81\u4e2d\uff0c\u7528\u4e8e\u89e3\u5256\u7ed3\u6784\u65e0\u5173\u7684\u533b\u5b66\u56fe\u50cf\u5206\u5272\u3002\u57fa\u4e8e PCCA \u7684 PROMISE-Net \u5728 CNN \u548c Transformer \u67b6\u6784\u3001\u591a\u79cd\u6a21\u6001\u4e0e\u76ee\u6807\u4e0a\u5747\u5e26\u6765\u7a33\u5b9a IoU \u63d0\u5347\uff0c\u5c24\u5176\u5728\u90e8\u5206\u6570\u636e\u96c6\u4e0a\u589e\u76ca\u663e\u8457\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20229", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u6ce8\u610f\u529b\u673a\u5236", "\u4ea4\u4e92\u5f0f\u5206\u5272", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20229v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prompt-Conditioned Channel Attention for Hierarchical Feature Modulation toward Anatomy-Agnostic Segmentation", "tldr": "\u8bba\u6587\u63d0\u51fa Prompt-Conditioned Channel Attention\uff08PCCA\uff09\uff0c\u5c06\u8bed\u4e49\u63d0\u793a\u4ee5\u901a\u9053\u6ce8\u610f\u529b\u5f62\u5f0f\u6df1\u5ea6\u6ce8\u5165\u7f16\u7801\u5668-\u89e3\u7801\u5668\u7684\u591a\u5c42\u7279\u5f81\u4e2d\uff0c\u7528\u4e8e\u89e3\u5256\u7ed3\u6784\u65e0\u5173\u7684\u533b\u5b66\u56fe\u50cf\u5206\u5272\u3002\u57fa\u4e8e PCCA \u7684 PROMISE-Net \u5728 CNN \u548c Transformer \u67b6\u6784\u3001\u591a\u79cd\u6a21\u6001\u4e0e\u76ee\u6807\u4e0a\u5747\u5e26\u6765\u7a33\u5b9a IoU \u63d0\u5347\uff0c\u5c24\u5176\u5728\u90e8\u5206\u6570\u636e\u96c6\u4e0a\u589e\u76ca\u663e\u8457\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Legal AI systems are increasingly used to answer legal questions, yet existing benchmarks assume queries arrive fully specified. In practice, users omit facts that materially determine the legal outcome. We introduce InsufficiencyBench, the first legal benchmark targeting query-side insufficiency: whether a model recognizes when a query lacks legally material information, identifies what is missing, and refrains from premature conclusions. We formalize a taxonomy of eight canonical missing-element categories across three structural failure modes---switch, gating, and fatal prerequisite--- and construct 202 benchmark items (58 base queries, 144 deficient variants) spanning six legal domains and 24 US jurisdictions and annotated by practising attorneys. Evaluating ten frontier models, we find that no model exceeds F2 = 0.46 on missing-element identification and that the median recall is 0.44. Models either hedge indiscriminately or answer silently under fabricated presumptions. No model both identifies and qualifies responses to deficient queries while directly addressing complete ones.", "arxiv_id": "2608.20220", "arxiv_url": "https://arxiv.org/abs/2608.20220", "authors": ["Samuel J. Vincent", "Daniel Calloway", "Fangyi Yu", "Andrew M. Bean", "Nabeel Seedat"], "brief": "\u8bba\u6587\u63d0\u51fa InsufficiencyBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u6cd5\u5f8b\u54a8\u8be2\u4e2d\u9762\u5bf9\u7528\u6237\u95ee\u9898\u4fe1\u606f\u4e0d\u8db3\u65f6\uff0c\u662f\u5426\u80fd\u8bc6\u522b\u7f3a\u5931\u7684\u5173\u952e\u4e8b\u5b9e\u3001\u6307\u51fa\u7f3a\u53e3\u5e76\u907f\u514d\u8fc7\u65e9\u4e0b\u7ed3\u8bba\u3002\u57fa\u51c6\u5305\u542b 202 \u4e2a\u7531\u6267\u4e1a\u5f8b\u5e08\u6807\u6ce8\u7684\u6837\u672c\uff0c\u8986\u76d6\u591a\u4e2a\u6cd5\u5f8b\u9886\u57df\u548c\u7f8e\u56fd\u53f8\u6cd5\u8f96\u533a\uff1b\u5bf9 10 \u4e2a\u524d\u6cbf\u6a21\u578b\u8bc4\u6d4b\u53d1\u73b0\uff0c\u6a21\u578b\u5728\u7f3a\u5931\u8981\u7d20\u8bc6\u522b\u4e0a\u8868\u73b0\u8f83\u5dee\uff0c\u6700\u9ad8 F2 \u4ec5 0.46\uff0c\u5e38\u89c1\u95ee\u9898\u662f\u8fc7\u5ea6\u542b\u7cca\u6216\u9ed8\u8ba4\u7f16\u9020\u524d\u63d0\u4f5c\u7b54\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20220", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6cd5\u5f8b\u5927\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u4e8b\u5b9e\u7f3a\u5931", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20220v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "InsufficiencyBench: Evaluating LLM legal advice on underspecified user queries", "tldr": "\u8bba\u6587\u63d0\u51fa InsufficiencyBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u6cd5\u5f8b\u54a8\u8be2\u4e2d\u9762\u5bf9\u7528\u6237\u95ee\u9898\u4fe1\u606f\u4e0d\u8db3\u65f6\uff0c\u662f\u5426\u80fd\u8bc6\u522b\u7f3a\u5931\u7684\u5173\u952e\u4e8b\u5b9e\u3001\u6307\u51fa\u7f3a\u53e3\u5e76\u907f\u514d\u8fc7\u65e9\u4e0b\u7ed3\u8bba\u3002\u57fa\u51c6\u5305\u542b 202 \u4e2a\u7531\u6267\u4e1a\u5f8b\u5e08\u6807\u6ce8\u7684\u6837\u672c\uff0c\u8986\u76d6\u591a\u4e2a\u6cd5\u5f8b\u9886\u57df\u548c\u7f8e\u56fd\u53f8\u6cd5\u8f96\u533a\uff1b\u5bf9 10 \u4e2a\u524d\u6cbf\u6a21\u578b\u8bc4\u6d4b\u53d1\u73b0\uff0c\u6a21\u578b\u5728\u7f3a\u5931\u8981\u7d20\u8bc6\u522b\u4e0a\u8868\u73b0\u8f83\u5dee\uff0c\u6700\u9ad8 F2 \u4ec5 0.46\uff0c\u5e38\u89c1\u95ee\u9898\u662f\u8fc7\u5ea6\u542b\u7cca\u6216\u9ed8\u8ba4\u7f16\u9020\u524d\u63d0\u4f5c\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Electronic Navigational Charts (ENCs) are geospatial vector datasets used in maritime navigation systems that represent hydrographic and navigational information such as depths, navigational aids, traffic schemes, and hazards. A major challenge for hydrographic offices is determining whether a given chart change poses a critical or non-critical risk to maritime safety. Existing workflows rely heavily on manual review and verification, which is labor-intensive, scales poorly with the volume of incoming chart updates, and introduces inter-analyst inconsistencies. To address this challenge, we propose a method for automated classification of ENC changes. We establish a baseline encoding scheme to translate complex vector data changes into a structured tabular format for classification models. The two crucial components of the encoding scheme include a spatial context encoder to enrich the change representations with surrounding geographic features, and an ENC attribute encoder to represent nuanced attribute-value descriptions of the modified objects. We evaluate the proposed approach across two distinct operational datasets, comprising 1,308 chart pairs containing over 100,000 individual chart modifications. Tuned gradient-boosted trees leveraging the proposed encoding schemes achieve accuracies of 90% and 94% on the two datasets, yielding a 5-7% improvement over default hyperparameterized models trained on encodings without spatial context and attribute embeddings. These results demonstrate the viability of integrating machine learning into operational geospatial pipelines to improve ENC maintenance and enhance maritime safety. Finally, our experiments demonstrate the effectiveness of simple location and spatial aggregation methods, providing a foundation for evaluating more sophisticated spatial representation learning techniques for this application.", "arxiv_id": "2608.20218", "arxiv_url": "https://arxiv.org/abs/2608.20218", "authors": ["Jacob Arndt", "Abhishek Potnis", "Alexandre Sorokine"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7535\u5b50\u822a\u6d77\u56fe\uff08ENC\uff09\u53d8\u66f4\u81ea\u52a8\u5206\u7c7b\u65b9\u6cd5\uff0c\u5c06\u590d\u6742\u7684\u5730\u7406\u77e2\u91cf\u53d8\u66f4\u7f16\u7801\u4e3a\u7ed3\u6784\u5316\u8868\u683c\u7279\u5f81\uff0c\u5e76\u52a0\u5165\u7a7a\u95f4\u4e0a\u4e0b\u6587\u4e0e\u5c5e\u6027\u7f16\u7801\u3002\u5b9e\u9a8c\u8986\u76d6\u4e24\u4e2a\u771f\u5b9e\u4e1a\u52a1\u6570\u636e\u96c6\u3001\u8d85\u8fc710\u4e07\u6b21\u56fe\u8868\u4fee\u6539\uff0c\u68af\u5ea6\u63d0\u5347\u6811\u6a21\u578b\u8fbe\u523090%\u548c94%\u51c6\u786e\u7387\uff0c\u6bd4\u65e0\u7a7a\u95f4\u4e0a\u4e0b\u6587\u548c\u5c5e\u6027\u5d4c\u5165\u7684\u57fa\u7ebf\u63d0\u53475-7%\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20218", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5730\u7406\u7a7a\u95f4", "\u673a\u5668\u5b66\u4e60", "\u5206\u7c7b", "\u6d77\u4e8b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20218v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Electronic Navigational Chart Change Classification", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7535\u5b50\u822a\u6d77\u56fe\uff08ENC\uff09\u53d8\u66f4\u81ea\u52a8\u5206\u7c7b\u65b9\u6cd5\uff0c\u5c06\u590d\u6742\u7684\u5730\u7406\u77e2\u91cf\u53d8\u66f4\u7f16\u7801\u4e3a\u7ed3\u6784\u5316\u8868\u683c\u7279\u5f81\uff0c\u5e76\u52a0\u5165\u7a7a\u95f4\u4e0a\u4e0b\u6587\u4e0e\u5c5e\u6027\u7f16\u7801\u3002\u5b9e\u9a8c\u8986\u76d6\u4e24\u4e2a\u771f\u5b9e\u4e1a\u52a1\u6570\u636e\u96c6\u3001\u8d85\u8fc710\u4e07\u6b21\u56fe\u8868\u4fee\u6539\uff0c\u68af\u5ea6\u63d0\u5347\u6811\u6a21\u578b\u8fbe\u523090%\u548c94%\u51c6\u786e\u7387\uff0c\u6bd4\u65e0\u7a7a\u95f4\u4e0a\u4e0b\u6587\u548c\u5c5e\u6027\u5d4c\u5165\u7684\u57fa\u7ebf\u63d0\u53475-7%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Small language models are usually built like large ones and then squeezed onto a CPU afterwards. We did the opposite: we fixed the target first, one user, one token at a time, 4-bit weights, ordinary CPU, and chose the architecture to suit it. The result keeps full attention in only 6 of its 18 blocks. The other 12 use short convolutions whose memory is two timesteps wide no matter how long the conversation gets, so two thirds of the network never re-reads a growing cache. Trained from scratch on 59.9B tokens, the model scores 47.31 on a five-task benchmark against a bar of 42.20 that was fixed before training began. It beats GPT-2 124M, Pythia-160M, OPT-125M and GPT-neo-125M, all trained on three to six times more data, and exceeds MobileLLM-125M\u0027s published score despite that model seeing a trillion tokens. Validation bits-per-byte is 0.8685. To check the architecture rather than the training recipe, we trained a conventional all-attention model of the same size on the same data, and wrote down the winning condition before scoring either. The hybrid won the chosen quality metric by 0.81%, matched it on downstream tasks, produced a 6.3% smaller 4-bit file, and decoded 1.76x faster at 2048 tokens of context, 2.08x against an external model of similar size. In every measurement the speed advantage is near zero at an empty context and grows with length, which is what the mechanism predicts and what a merely leaner model would not show. A simple bandwidth calculation predicts only 1.17x, so memory volume alone does not explain the gap. We also report what did not work: an unmitigated 4-bit quality cost, roughly half the convolution channels ending up inert and impossible to remove, and a vocabulary larger than this model size warrants.", "arxiv_id": "2608.20210", "arxiv_url": "https://arxiv.org/abs/2608.20210", "authors": ["Christos Koutsiaris"], "brief": "\u8bba\u6587\u63d0\u51fa Daedalus-150M\uff0c\u4e00\u79cd\u9762\u5411\u666e\u901a CPU\u30014-bit \u63a8\u7406\u4f18\u5316\u7684\u5c0f\u8bed\u8a00\u6a21\u578b\u67b6\u6784\uff0c\u7528\u5377\u79ef\u66ff\u4ee3 18 \u5c42\u4e2d 12 \u5c42\u7684\u5168\u6ce8\u610f\u529b\u4ee5\u51cf\u5c11\u957f\u4e0a\u4e0b\u6587\u7f13\u5b58\u91cd\u8bfb\u3002\u8be5\u6a21\u578b\u7528 59.9B token \u4ece\u5934\u8bad\u7ec3\uff0c\u5728\u591a\u9879\u57fa\u51c6\u4e0a\u8d85\u8fc7\u591a\u79cd\u540c\u89c4\u6a21\u6a21\u578b\uff0c\u5e76\u5728 2048 \u4e0a\u4e0b\u6587\u4e0b\u6bd4\u540c\u5c3a\u5bf8\u5168\u6ce8\u610f\u529b\u6a21\u578b\u89e3\u7801\u5feb 1.76 \u500d\uff0c\u540c\u65f6\u6587\u4ef6\u66f4\u5c0f\u3002\u4f5c\u8005\u8fd8\u62a5\u544a\u4e86\u91cf\u5316\u635f\u5931\u3001\u90e8\u5206\u5377\u79ef\u901a\u9053\u5931\u6d3b\u548c\u8bcd\u8868\u8fc7\u5927\u7b49\u8d1f\u9762\u7ed3\u679c\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20210", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u63a8\u7406", "\u6ce8\u610f\u529b\u673a\u5236", "\u5377\u79ef\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20210v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Daedalus-150M: A Convolution-Attention Hybrid Designed for CPU Inference", "tldr": "\u8bba\u6587\u63d0\u51fa Daedalus-150M\uff0c\u4e00\u79cd\u9762\u5411\u666e\u901a CPU\u30014-bit \u63a8\u7406\u4f18\u5316\u7684\u5c0f\u8bed\u8a00\u6a21\u578b\u67b6\u6784\uff0c\u7528\u5377\u79ef\u66ff\u4ee3 18 \u5c42\u4e2d 12 \u5c42\u7684\u5168\u6ce8\u610f\u529b\u4ee5\u51cf\u5c11\u957f\u4e0a\u4e0b\u6587\u7f13\u5b58\u91cd\u8bfb\u3002\u8be5\u6a21\u578b\u7528 59.9B token \u4ece\u5934\u8bad\u7ec3\uff0c\u5728\u591a\u9879\u57fa\u51c6\u4e0a\u8d85\u8fc7\u591a\u79cd\u540c\u89c4\u6a21\u6a21\u578b\uff0c\u5e76\u5728 2048 \u4e0a\u4e0b\u6587\u4e0b\u6bd4\u540c\u5c3a\u5bf8\u5168\u6ce8\u610f\u529b\u6a21\u578b\u89e3\u7801\u5feb 1.76 \u500d\uff0c\u540c\u65f6\u6587\u4ef6\u66f4\u5c0f\u3002\u4f5c\u8005\u8fd8\u62a5\u544a\u4e86\u91cf\u5316\u635f\u5931\u3001\u90e8\u5206\u5377\u79ef\u901a\u9053\u5931\u6d3b\u548c\u8bcd\u8868\u8fc7\u5927\u7b49\u8d1f\u9762\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Legal work, with its heavy reliance on processing large amounts of text, is often considered one of the domains most exposed to the use of LLMs. Contract ``scrubbing,\u0027\u0027 the final review of transactional agreements for errors and inconsistencies, is a particularly suitable task for automation, because it is routine, painstaking work requiring detailed attention to long documents. Scrubbing also seems to align naturally with the general capabilities expected of frontier LLMs around long-context reasoning, consistency checking, and named entity recognition (NER). Despite the economic value and potential for automation, no formal evaluations of LLMs performing contract scrubbing have been conducted. We introduce ContractScrub, the first benchmark designed to evaluate contract scrubbing capabilities, comprising contracts hand-crafted by experienced lawyers over diverse error categories such as misuse of defined terms, incorrect references, and inconsistent language. Frontier models perform surprisingly poorly with only one model reaching 0.75 macro average recall despite strong performance on seemingly related general benchmarks, demonstrating the practical limits of current models and the importance of narrowly targeted, domain-specific benchmarks for measuring real-world impact.", "arxiv_id": "2608.20204", "arxiv_url": "https://arxiv.org/abs/2608.20204", "authors": ["Yejin Bang", "Kirsty Fielding", "Brandan Oliver", "Brian Birke", "Nabeel Seedat", "Andrew M. Bean"], "brief": "\u672c\u6587\u63d0\u51fa ContractScrub\uff0c\u9996\u4e2a\u9762\u5411\u6cd5\u5f8b\u5408\u540c\u6700\u7ec8\u5ba1\u9605\uff08\u67e5\u9519\u3001\u672f\u8bed\u4e00\u81f4\u6027\u3001\u5f15\u7528\u9519\u8bef\u7b49\uff09\u7684\u57fa\u51c6\uff0c\u7531\u8d44\u6df1\u5f8b\u5e08\u624b\u5de5\u6784\u9020\u591a\u7c7b\u5408\u540c\u9519\u8bef\u3002\u8bc4\u6d4b\u663e\u793a\u524d\u6cbf\u5927\u6a21\u578b\u8868\u73b0\u610f\u5916\u8f83\u5f31\uff0c\u53ea\u6709\u4e00\u4e2a\u6a21\u578b\u8fbe\u5230 0.75 \u7684\u5b8f\u5e73\u5747\u53ec\u56de\u7387\uff0c\u8bf4\u660e\u901a\u7528\u957f\u4e0a\u4e0b\u6587\u4e0e\u4e00\u81f4\u6027\u80fd\u529b\u5e76\u4e0d\u80fd\u76f4\u63a5\u8f6c\u5316\u4e3a\u53ef\u9760\u7684\u6cd5\u5f8b\u5b9e\u52a1\u81ea\u52a8\u5316\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20204", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6cd5\u5f8b\u5927\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u957f\u4e0a\u4e0b\u6587", "\u4fe1\u606f\u62bd\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20204v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ContractScrub: A benchmark for final review of legal contracts", "tldr": "\u672c\u6587\u63d0\u51fa ContractScrub\uff0c\u9996\u4e2a\u9762\u5411\u6cd5\u5f8b\u5408\u540c\u6700\u7ec8\u5ba1\u9605\uff08\u67e5\u9519\u3001\u672f\u8bed\u4e00\u81f4\u6027\u3001\u5f15\u7528\u9519\u8bef\u7b49\uff09\u7684\u57fa\u51c6\uff0c\u7531\u8d44\u6df1\u5f8b\u5e08\u624b\u5de5\u6784\u9020\u591a\u7c7b\u5408\u540c\u9519\u8bef\u3002\u8bc4\u6d4b\u663e\u793a\u524d\u6cbf\u5927\u6a21\u578b\u8868\u73b0\u610f\u5916\u8f83\u5f31\uff0c\u53ea\u6709\u4e00\u4e2a\u6a21\u578b\u8fbe\u5230 0.75 \u7684\u5b8f\u5e73\u5747\u53ec\u56de\u7387\uff0c\u8bf4\u660e\u901a\u7528\u957f\u4e0a\u4e0b\u6587\u4e0e\u4e00\u81f4\u6027\u80fd\u529b\u5e76\u4e0d\u80fd\u76f4\u63a5\u8f6c\u5316\u4e3a\u53ef\u9760\u7684\u6cd5\u5f8b\u5b9e\u52a1\u81ea\u52a8\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Software form has undergone two paradigm shifts since its inception: Software 1.0, in which instructions determine behavior, and Software 2.0, in which data determines behavior (machine learning). This paper argues that a third shift - Software 3.0, in which context and reasoning determine behavior - is now underway, and contends that its terminal form converges to three elements: a generalized database (the unified abstraction of all persistent state and memory), a large model (the intelligence core that performs reasoning and generation), and an agent (the execution loop connecting the first two). The core argument is as follows: in the traditional three-tier architecture, the user-interface layer will be absorbed by the model\u0027s ability to generate interfaces on demand, the business-logic layer will be re-partitioned along \"expressibility x criticality\" into model reasoning and storage constraints (with residual deterministic logic retained as tools), and only the data layer will be elevated into the sole persistent infrastructure. We formalize this convergence thesis, present a minimal reference architecture, report evidence from real prototypes and a live model, and systematically analyze both the conditions under which it holds and the boundaries where it fails - determinism, cost, security, and verifiability delimit the thesis\u0027s domain of applicability. We argue that the thesis holds in task domains that are expressible, verifiable, externally stateful, and tool-complete, and that it will reshape the roles of developers, the database industry, and the software-engineering discipline.", "arxiv_id": "2608.20201", "arxiv_url": "https://arxiv.org/abs/2608.20201", "authors": ["Wei Lin", "Tao Zhou", "Zhaofei Xie", "Changgui Hong"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u8f6f\u4ef6 3.0\u201d\u8303\u5f0f\uff1a\u8f6f\u4ef6\u5f62\u6001\u5c06\u4ece\u4f20\u7edf\u4e09\u5c42\u67b6\u6784\u6536\u655b\u4e3a\u5e7f\u4e49\u6570\u636e\u5e93\u3001\u5927\u6a21\u578b\u548c\u667a\u80fd\u4f53\u4e09\u8981\u7d20\u3002\u4f5c\u8005\u8ba4\u4e3a\u754c\u9762\u53ef\u7531\u6a21\u578b\u6309\u9700\u751f\u6210\uff0c\u4e1a\u52a1\u903b\u8f91\u5c06\u88ab\u6a21\u578b\u63a8\u7406\u3001\u5b58\u50a8\u7ea6\u675f\u548c\u5c11\u91cf\u786e\u5b9a\u6027\u5de5\u5177\u91cd\u65b0\u5212\u5206\uff0c\u5e76\u8ba8\u8bba\u4e86\u8be5\u8303\u5f0f\u5728\u786e\u5b9a\u6027\u3001\u6210\u672c\u3001\u5b89\u5168\u548c\u53ef\u9a8c\u8bc1\u6027\u65b9\u9762\u7684\u8fb9\u754c\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20201", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b", "\u8f6f\u4ef6\u5de5\u7a0b", "\u67b6\u6784\u8bbe\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20201v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Third Restructuring of Software Form: From the Three-Tier Architecture to Storage, Models, and Agents", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u8f6f\u4ef6 3.0\u201d\u8303\u5f0f\uff1a\u8f6f\u4ef6\u5f62\u6001\u5c06\u4ece\u4f20\u7edf\u4e09\u5c42\u67b6\u6784\u6536\u655b\u4e3a\u5e7f\u4e49\u6570\u636e\u5e93\u3001\u5927\u6a21\u578b\u548c\u667a\u80fd\u4f53\u4e09\u8981\u7d20\u3002\u4f5c\u8005\u8ba4\u4e3a\u754c\u9762\u53ef\u7531\u6a21\u578b\u6309\u9700\u751f\u6210\uff0c\u4e1a\u52a1\u903b\u8f91\u5c06\u88ab\u6a21\u578b\u63a8\u7406\u3001\u5b58\u50a8\u7ea6\u675f\u548c\u5c11\u91cf\u786e\u5b9a\u6027\u5de5\u5177\u91cd\u65b0\u5212\u5206\uff0c\u5e76\u8ba8\u8bba\u4e86\u8be5\u8303\u5f0f\u5728\u786e\u5b9a\u6027\u3001\u6210\u672c\u3001\u5b89\u5168\u548c\u53ef\u9a8c\u8bc1\u6027\u65b9\u9762\u7684\u8fb9\u754c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Practitioners inferring causality from observational data usually rely on a single method and treat its output as causal truth. Recent tools select an optimal method for a dataset, and recent ensembles aggregate multiple causal-discovery algorithms into one graph, but little work pools evidence across different mathematical traditions, including non-causal ones. We present Multi-Method Causal Evidence Synthesis (MCES), a framework that ranks which candidate drivers in an observational system are most likely relevant to a set of outcomes, and with what strength of evidence. MCES runs eleven methods across eight mathematical traditions on observational panel data and pools their outputs into a Convergent Evidence Score (CES), a linear opinion pool. CES quantifies convergence of evidence across analytical lenses: the degree to which methods with different assumptions point to the same driver-outcome relationship. It does not claim causal identification in the interventionist sense; it supports hypothesis prioritization, not a transferable probability of causation. MCES first applies Structural-Behavioral Decomposition to remove definitional (algebraic) relationships, then runs all methods, normalizes outputs to [0,1], and pools them. We distinguish MCES from method selection, structural ensembles, prediction ensembles, and literature synthesis. Using synthetic data with embedded ground truth, the Sachs protein-signaling benchmark, six Bayesian-network structure benchmarks, and two further synthetic domains, we show MCES ranks true edges near the top (Precision@5 = 1.0, Precision@10 = 0.96 on the primary scenario), with a low empirical rate of null pairs reaching Moderate-or-higher convergence. Our central point is not that the pool beats every individual method, but that no single method is uniformly best across the evaluated scenarios, so MCES offers a method-agnostic default.", "arxiv_id": "2608.20187", "arxiv_url": "https://arxiv.org/abs/2608.20187", "authors": ["Manish Gupta", "Dipanjan De"], "brief": "\u8bba\u6587\u63d0\u51fa\u591a\u65b9\u6cd5\u56e0\u679c\u8bc1\u636e\u7efc\u5408\u6846\u67b6 MCES\uff0c\u5728\u89c2\u6d4b\u9762\u677f\u6570\u636e\u4e0a\u8fd0\u884c\u6765\u81ea\u516b\u7c7b\u6570\u5b66\u4f20\u7edf\u7684\u5341\u4e00\u79cd\u65b9\u6cd5\uff0c\u5e76\u5c06\u7ed3\u679c\u5f52\u4e00\u5316\u540e\u6c47\u603b\u4e3a\u6536\u655b\u8bc1\u636e\u5206\u6570\uff0c\u7528\u4e8e\u6392\u5e8f\u5019\u9009\u9a71\u52a8\u56e0\u7d20\u4e0e\u7ed3\u679c\u4e4b\u95f4\u7684\u53ef\u80fd\u76f8\u5173\u6027\u3002\u5b9e\u9a8c\u8868\u660e MCES \u80fd\u5c06\u771f\u5b9e\u8fb9\u6392\u5728\u8f83\u524d\u4f4d\u7f6e\uff0c\u4e14\u5728\u4e0d\u540c\u573a\u666f\u4e2d\u6bd4\u4f9d\u8d56\u5355\u4e00\u65b9\u6cd5\u66f4\u7a33\u5065\uff0c\u4f46\u5176\u76ee\u6807\u662f\u56e0\u679c\u5047\u8bbe\u4f18\u5148\u7ea7\u6392\u5e8f\u800c\u975e\u4e25\u683c\u56e0\u679c\u8bc6\u522b\u3002", "categories": ["stat.ME", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20187", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u89c2\u6d4b\u6570\u636e", "\u6a21\u578b\u96c6\u6210", "\u8d1d\u53f6\u65af\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20187v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multi-Method Causal Evidence Synthesis: Ranking Candidate Drivers by Convergent Cross-Method Evidence from Observational Data", "tldr": "\u8bba\u6587\u63d0\u51fa\u591a\u65b9\u6cd5\u56e0\u679c\u8bc1\u636e\u7efc\u5408\u6846\u67b6 MCES\uff0c\u5728\u89c2\u6d4b\u9762\u677f\u6570\u636e\u4e0a\u8fd0\u884c\u6765\u81ea\u516b\u7c7b\u6570\u5b66\u4f20\u7edf\u7684\u5341\u4e00\u79cd\u65b9\u6cd5\uff0c\u5e76\u5c06\u7ed3\u679c\u5f52\u4e00\u5316\u540e\u6c47\u603b\u4e3a\u6536\u655b\u8bc1\u636e\u5206\u6570\uff0c\u7528\u4e8e\u6392\u5e8f\u5019\u9009\u9a71\u52a8\u56e0\u7d20\u4e0e\u7ed3\u679c\u4e4b\u95f4\u7684\u53ef\u80fd\u76f8\u5173\u6027\u3002\u5b9e\u9a8c\u8868\u660e MCES \u80fd\u5c06\u771f\u5b9e\u8fb9\u6392\u5728\u8f83\u524d\u4f4d\u7f6e\uff0c\u4e14\u5728\u4e0d\u540c\u573a\u666f\u4e2d\u6bd4\u4f9d\u8d56\u5355\u4e00\u65b9\u6cd5\u66f4\u7a33\u5065\uff0c\u4f46\u5176\u76ee\u6807\u662f\u56e0\u679c\u5047\u8bbe\u4f18\u5148\u7ea7\u6392\u5e8f\u800c\u975e\u4e25\u683c\u56e0\u679c\u8bc6\u522b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Studies of machine-learning-based power-system protection increasingly report near-perfect scores, yet the meaning of those scores depends strongly on the evaluation setting. Protection task, physical scope, measurements, timing, targets, preprocessing, and validation often vary jointly and remain incompletely specified. This paper proposes a standardization-oriented framework that treats evaluation design as part of the scientific contribution. It defines seven required study dimensions: protection objective, physical scope, observability, timing and decision windows, targets and sample validity, validation protocol, and evaluation outputs. The framework is instantiated in a bounded case study on the public PROTECT-90 electromagnetic-transient benchmark, comprising 9022 simulated episodes from a 90 kV double-line topology, for onset-conditioned fault classification and localization. Under centralized sensing, simulation-metadata-aligned 20 ms windows, and episode-grouped validation, a multi-layer perceptron (MLP) achieved a five-fold mean macro-averaged F1 score of 0.991 +/- 0.001 for classification and a localization mean absolute error of 10.20 +/- 0.25% of line length (mean +/- std across episode-grouped folds). Extending the decision horizon to 50 ms preserved this task-dependent performance asymmetry, while reduced observability approximately doubled the MLP localization error but had little effect on classification. A synchronized two-ended conventional locator outperformed the learning locators under its richer clean information set, and measurement degradation showed that clean predictive performance did not determine robustness. The framework turns evaluation assumptions into explicit, reproducible evidence and provides a basis for more comparable, auditable evaluation and future certification-oriented assessment of machine-learning protection functions.", "arxiv_id": "2608.20181", "arxiv_url": "https://arxiv.org/abs/2608.20181", "authors": ["Julian Oelhaf", "Georg Kordowich", "Paula Andrea P\u00e9rez-Toro", "Christian Bergler", "Johann J\u00e4ger", "Andreas Maier", "Siming Bayer"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u7535\u529b\u7cfb\u7edf\u4fdd\u62a4\u4e2d\u673a\u5668\u5b66\u4e60\u8bc4\u4f30\u7684\u6807\u51c6\u5316\u6846\u67b6\uff0c\u5c06\u4fdd\u62a4\u76ee\u6807\u3001\u89c2\u6d4b\u8303\u56f4\u3001\u65f6\u95f4\u7a97\u53e3\u3001\u9a8c\u8bc1\u534f\u8bae\u7b49\u4e03\u4e2a\u7ef4\u5ea6\u663e\u5f0f\u5316\uff0c\u4ee5\u63d0\u5347\u7ed3\u679c\u7684\u53ef\u590d\u73b0\u6027\u548c\u53ef\u6bd4\u8f83\u6027\u3002\u4f5c\u8005\u5728 PROTECT-90 \u57fa\u51c6\u4e0a\u9a8c\u8bc1\u53d1\u73b0\uff0cMLP \u5728\u6545\u969c\u5206\u7c7b\u4e0a\u53ef\u8fbe\u5f88\u9ad8 F1\uff0c\u4f46\u5b9a\u4f4d\u6027\u80fd\u5bf9\u89c2\u6d4b\u6761\u4ef6\u548c\u4fe1\u606f\u8d28\u91cf\u66f4\u654f\u611f\uff0c\u4f20\u7edf\u53cc\u7aef\u5b9a\u4f4d\u5668\u5728\u66f4\u5e72\u51c0\u4fe1\u606f\u4e0b\u4ecd\u66f4\u4f18\u3002", "categories": ["cs.LG", "cs.AI", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20181", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u5b66\u4e60", "\u7535\u529b\u7cfb\u7edf\u4fdd\u62a4", "\u6807\u51c6\u5316\u8bc4\u4f30", "\u6545\u969c\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20181v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Standardized Framework for Machine Learning in Power System Protection", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u7535\u529b\u7cfb\u7edf\u4fdd\u62a4\u4e2d\u673a\u5668\u5b66\u4e60\u8bc4\u4f30\u7684\u6807\u51c6\u5316\u6846\u67b6\uff0c\u5c06\u4fdd\u62a4\u76ee\u6807\u3001\u89c2\u6d4b\u8303\u56f4\u3001\u65f6\u95f4\u7a97\u53e3\u3001\u9a8c\u8bc1\u534f\u8bae\u7b49\u4e03\u4e2a\u7ef4\u5ea6\u663e\u5f0f\u5316\uff0c\u4ee5\u63d0\u5347\u7ed3\u679c\u7684\u53ef\u590d\u73b0\u6027\u548c\u53ef\u6bd4\u8f83\u6027\u3002\u4f5c\u8005\u5728 PROTECT-90 \u57fa\u51c6\u4e0a\u9a8c\u8bc1\u53d1\u73b0\uff0cMLP \u5728\u6545\u969c\u5206\u7c7b\u4e0a\u53ef\u8fbe\u5f88\u9ad8 F1\uff0c\u4f46\u5b9a\u4f4d\u6027\u80fd\u5bf9\u89c2\u6d4b\u6761\u4ef6\u548c\u4fe1\u606f\u8d28\u91cf\u66f4\u654f\u611f\uff0c\u4f20\u7edf\u53cc\u7aef\u5b9a\u4f4d\u5668\u5728\u66f4\u5e72\u51c0\u4fe1\u606f\u4e0b\u4ecd\u66f4\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Instruction-based image editing uses a planner-renderer pipeline: a vision-language model (VLM) first converts the instruction into an edit plan, and a diffusion model then executes that plan. Training such systems with only final-image rewards is inefficient because a poor edit does not reveal whether additional optimization should place more emphasis on the planner or the renderer, and even planner-dominant cases remain difficult to localize within a free-form reasoning trace. We present DARS, a reinforcement learning framework for dual-level credit assignment in this two-stage setting. Across modules, multi-plan multi-render rollouts estimate between-plan and within-plan reward variability for soft module routing, while rollout mean rewards provide hardness estimates for an adaptive curriculum. Within the planner, a four-field structured reasoning output enables a prefix-gated reward and token-level advantage reweighting, turning outcome-level feedback into localized supervision. Experiments on five benchmarks show that DARS outperforms a Joint~RL baseline with the same backbone, data, reward model, and rollout budget, with the largest gains on reasoning-intensive edits.", "arxiv_id": "2608.20161", "arxiv_url": "https://arxiv.org/abs/2608.20161", "authors": ["Haoxiang Cao", "Jiajiong Cao", "Xuanpu Zhang", "Changqian Yu", "Chaoqun Wang"], "brief": "DARS \u9762\u5411\u6307\u4ee4\u5f0f\u56fe\u50cf\u7f16\u8f91\u7684\u89c4\u5212\u5668-\u6e32\u67d3\u5668\u6d41\u6c34\u7ebf\uff0c\u63d0\u51fa\u53cc\u5c42\u4fe1\u7528\u5206\u914d\u5f3a\u5316\u5b66\u4e60\uff1a\u5728\u6a21\u5757\u95f4\u4f30\u8ba1\u4e0d\u540c\u7f16\u8f91\u8ba1\u5212\u4e0e\u6e32\u67d3\u7ed3\u679c\u7684\u5956\u52b1\u5dee\u5f02\uff0c\u5728\u89c4\u5212\u5668\u5185\u90e8\u7528\u7ed3\u6784\u5316\u63a8\u7406\u5b9e\u73b0\u66f4\u7ec6\u7c92\u5ea6\u7684\u5956\u52b1\u5b9a\u4f4d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u76f8\u540c\u9aa8\u5e72\u3001\u6570\u636e\u3001\u5956\u52b1\u6a21\u578b\u548c rollout \u9884\u7b97\u4e0b\uff0cDARS \u4f18\u4e8e Joint RL \u57fa\u7ebf\uff0c\u5c24\u5176\u63d0\u5347\u4e86\u9700\u8981\u590d\u6742\u63a8\u7406\u7684\u7f16\u8f91\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20161", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u56fe\u50cf\u7f16\u8f91", "\u591a\u6a21\u6001", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20161v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DARS: Dual-Level Credit Assignment RL with Structured Reasoning for Instruction-Based Image Editing", "tldr": "DARS \u9762\u5411\u6307\u4ee4\u5f0f\u56fe\u50cf\u7f16\u8f91\u7684\u89c4\u5212\u5668-\u6e32\u67d3\u5668\u6d41\u6c34\u7ebf\uff0c\u63d0\u51fa\u53cc\u5c42\u4fe1\u7528\u5206\u914d\u5f3a\u5316\u5b66\u4e60\uff1a\u5728\u6a21\u5757\u95f4\u4f30\u8ba1\u4e0d\u540c\u7f16\u8f91\u8ba1\u5212\u4e0e\u6e32\u67d3\u7ed3\u679c\u7684\u5956\u52b1\u5dee\u5f02\uff0c\u5728\u89c4\u5212\u5668\u5185\u90e8\u7528\u7ed3\u6784\u5316\u63a8\u7406\u5b9e\u73b0\u66f4\u7ec6\u7c92\u5ea6\u7684\u5956\u52b1\u5b9a\u4f4d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u76f8\u540c\u9aa8\u5e72\u3001\u6570\u636e\u3001\u5956\u52b1\u6a21\u578b\u548c rollout \u9884\u7b97\u4e0b\uff0cDARS \u4f18\u4e8e Joint RL \u57fa\u7ebf\uff0c\u5c24\u5176\u63d0\u5347\u4e86\u9700\u8981\u590d\u6742\u63a8\u7406\u7684\u7f16\u8f91\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mobile manipulation requires a robot to predict how locomotion and arm motion jointly alter future observations and control. Existing world-action models, developed largely for fixed-base platforms, do not explicitly distinguish camera ego-motion from base and arm actions. Here we introduce DECOWAM, a whole-body world-action model that separates these factors through dedicated conditional interfaces. DECOWAM freezes an adapted FastWAM backbone and trains residual adapters, an action-equivalent future bottleneck distilled from privileged observations, adversarially separated base and arm latents, and base-velocity conditioning for video prediction. We further introduce ARMDOG, a real-robot dataset that synchronizes video, whole-body state and action, and language. On a fixed replay protocol, DECOWAM improved both future-video and action prediction over FastWAM, reducing action MSE by 21.7% with 25.95M trainable adaptation parameters. Across 79 closed-loop trials per method, it achieved the highest observed whole-body coordination and base-displacement robustness among the compared systems, while task completion remained comparable to the strongest baseline. These results show that embodiment-aware factorization can support parameter-efficient joint visual prediction and whole-body control under moving viewpoints.", "arxiv_id": "2608.20114", "arxiv_url": "https://arxiv.org/abs/2608.20114", "authors": ["Siyuan Ma", "Boshi Zhang", "Yutian Zhang", "Qinglian Wu", "Jiaqi Zhai", "Dong Wei", "Qiaojun Yu"], "brief": "\u672c\u6587\u63d0\u51fa DECOWAM\uff0c\u4e00\u79cd\u9762\u5411\u8db3\u5f0f\u79fb\u52a8\u64cd\u4f5c\u7684\u5168\u8eab\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u901a\u8fc7\u89e3\u8026\u76f8\u673a\u81ea\u8fd0\u52a8\u3001\u5e95\u76d8\u52a8\u4f5c\u4e0e\u673a\u68b0\u81c2\u52a8\u4f5c\u6765\u8fdb\u884c\u672a\u6765\u89c6\u9891\u4e0e\u52a8\u4f5c\u9884\u6d4b\u3002\u5b83\u5728\u65b0\u6570\u636e\u96c6 ARMDOG \u4e0a\u76f8\u8f83 FastWAM \u964d\u4f4e\u52a8\u4f5c MSE 21.7%\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u95ed\u73af\u5b9e\u9a8c\u4e2d\u63d0\u5347\u5168\u8eab\u534f\u8c03\u4e0e\u5e95\u76d8\u4f4d\u79fb\u9c81\u68d2\u6027\uff0c\u4efb\u52a1\u5b8c\u6210\u7387\u4e0e\u6700\u5f3a\u57fa\u7ebf\u76f8\u5f53\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, " quent immune layers. The resulting Deep AIN exhibits adaptive latent coordinate reorganization: as new classes arrive, the binding-profile space evolves while retaining recoverable structure for earlier classes. Experiments on sklearn digits, MNIST, Fashion-MNIST, and KMNIST show that preserving response maps is critical. Scalar binding-profile variants underperform, whereas feature-map Deep AINs learn class-discriminative visual memory without replay, label-driven immune updates, or backpropagation through the immune layers. On sklearn digits, downstream probes fitted on the learned binding profiles reach 0.939 final balanced accuracy with logistic regression and 0.902 with 1-nearest-neighbour after all ten classes are encountered, with initial-class retention of 0.978. Adaptive layer-wise scale calibration further improves the two-layer feature-map Deep AIN to 0.978 balanced accuracy. With the same calibration rule, Fashion-MNIST reaches 0.814 and KMNIST reaches 0.853. These probes are external validation tools, not components of the AIN. The results identify structured affinity, response-map preservation, adaptive latent reorganization, and layer-wise scale calibration as key mechanisms for replay-free visual immune memory.", "arxiv_id": "2608.20104", "arxiv_url": "https://arxiv.org/abs/2608.20104", "authors": ["Siphesihle Sithungu"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u7ed3\u6784\u5316\u4eb2\u548c\u5ea6\u7684\u6df1\u5ea6\u4eba\u5de5\u514d\u75ab\u7f51\u7edc\uff0c\u5c06\u89c6\u89c9B\u7ec6\u80de\u8868\u793a\u4e3a\u4fdd\u7559\u7a7a\u95f4\u54cd\u5e94\u56fe\u7684\u6a21\u677f/\u6ee4\u6ce2\u5668\uff0c\u7528\u4e8e\u65e0\u76d1\u7763\u3001\u65e0\u56de\u653e\u7684\u89c6\u89c9\u7c7b\u589e\u91cf\u8bb0\u5fc6\u5b66\u4e60\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u4fdd\u7559\u7279\u5f81\u56fe\u54cd\u5e94\u548c\u9010\u5c42\u5c3a\u5ea6\u6821\u51c6\u663e\u8457\u4f18\u4e8e\u6807\u91cf\u4eb2\u548c\u5ea6\u53d8\u4f53\uff0c\u5728Digits\u3001Fashion-MNIST\u3001KMNIST\u7b49\u6570\u636e\u96c6\u4e0a\u83b7\u5f97\u8f83\u597d\u7684\u4e0b\u6e38\u5206\u7c7b\u63a2\u6d4b\u6027\u80fd\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20104", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7c7b\u589e\u91cf\u5b66\u4e60", "\u4eba\u5de5\u514d\u75ab\u7f51\u7edc", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u89c6\u89c9\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20104v1", "published_at": "2026-08-20", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Structured Affinity for Unsupervised Visual Class-Incremental Memory in Deep Artificial Immune Networks", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u7ed3\u6784\u5316\u4eb2\u548c\u5ea6\u7684\u6df1\u5ea6\u4eba\u5de5\u514d\u75ab\u7f51\u7edc\uff0c\u5c06\u89c6\u89c9B\u7ec6\u80de\u8868\u793a\u4e3a\u4fdd\u7559\u7a7a\u95f4\u54cd\u5e94\u56fe\u7684\u6a21\u677f/\u6ee4\u6ce2\u5668\uff0c\u7528\u4e8e\u65e0\u76d1\u7763\u3001\u65e0\u56de\u653e\u7684\u89c6\u89c9\u7c7b\u589e\u91cf\u8bb0\u5fc6\u5b66\u4e60\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u4fdd\u7559\u7279\u5f81\u56fe\u54cd\u5e94\u548c\u9010\u5c42\u5c3a\u5ea6\u6821\u51c6\u663e\u8457\u4f18\u4e8e\u6807\u91cf\u4eb2\u548c\u5ea6\u53d8\u4f53\uff0c\u5728Digits\u3001Fashion-MNIST\u3001KMNIST\u7b49\u6570\u636e\u96c6\u4e0a\u83b7\u5f97\u8f83\u597d\u7684\u4e0b\u6e38\u5206\u7c7b\u63a2\u6d4b\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
