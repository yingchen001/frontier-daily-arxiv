28\u91cf\u63d0\u5347\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Extractive prompt compression promises to cut LLM inference costs by removing low-information tokens, and learned compressors such as LLMLingua-2 report strong results on English benchmarks. Most other languages already pay a token premium: the same content costs 1.3-1.8x more tokens than in English. We ask whether compression closes or widens this gap. Using fully parallel data in ten languages spanning five scripts, with controls budget-matched in the target model\u0027s tokenizer, we audit four learned compressors against four deterministic baselines, on eleven target models from ten vendors (over 250,000 evaluation calls). Three of the compressors are trained with English supervision (LLMLingua-2 XLM-R/mBERT; Kompress-v2 from the production Headroom stack); the fourth, XProvence, is trained multilingually. First, the transfer gap is real, replicates across target models and compressor backbones, and is strongly rate-dependent: at a 0.33 keep-rate English retains 57-62% of normalized context utilization while Lithuanian retains 10-24% and Chinese essentially none, despite Chinese having the smallest token premium. Second, the gap tracks compression supervision data, not architecture. All three English-trained compressors show it, deterministic methods show no comparable gap, and the multilingually trained XProvence v1 shows none. Its v2 release, retrained on translated data, empties 92% of Chinese contexts at its aggressive threshold without any warning. Third, in a harder long-context setting, aggressive learned compression drives compressed contexts to or below no-context utility in three of five non-English languages. A translate-then-compress pipeline matches or beats native compression at roughly half the token cost in three of five tested languages. We release all code, compressions, and model outputs. Safe compression budgets are much smaller outside English.", "arxiv_id": "2608.26175", "arxiv_url": "https://arxiv.org/abs/2608.26175", "authors": ["Mantas Lukauskas"], "brief": "\u672c\u6587\u5bf9\u62bd\u53d6\u5f0f\u63d0\u793a\u538b\u7f29\u5668\u8fdb\u884c\u53d7\u63a7\u8de8\u8bed\u8a00\u5ba1\u8ba1\uff0c\u6bd4\u8f83\u56db\u79cd\u5b66\u4e60\u578b\u538b\u7f29\u5668\u4e0e\u56db\u79cd\u786e\u5b9a\u6027\u57fa\u7ebf\u5728\u5341\u79cd\u8bed\u8a00\u3001\u5341\u4e00\u4e2a\u76ee\u6807\u6a21\u578b\u4e0a\u7684\u8868\u73b0\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u82f1\u6587\u76d1\u7763\u8bad\u7ec3\u7684\u538b\u7f29\u5668\u5728\u975e\u82f1\u8bed\u4e2d\u5b58\u5728\u4e25\u91cd\u8fc1\u79fb\u7f3a\u53e3\uff0c\u800c\u591a\u8bed\u8a00\u76d1\u7763\u6216\u786e\u5b9a\u6027\u65b9\u6cd5\u66f4\u7a33\u5065\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/MantasLukauskas/lost-in-compression", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.26175", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u7528\u5341\u79cd\u8bed\u8a00\u3001\u4e94\u79cd\u6587\u5b57\u4f53\u7cfb\u7684\u5b8c\u5168\u5e73\u884c\u6570\u636e\uff0c\u5e76\u5728\u76ee\u6807\u6a21\u578b tokenizer \u4e0b\u8fdb\u884c\u9884\u7b97\u5339\u914d\uff0c\u5b8c\u6210\u8d85\u8fc725\u4e07\u6b21\u8bc4\u6d4b\u8c03\u7528\u3002", "\u57280.33\u4fdd\u7559\u7387\u4e0b\uff0c\u82f1\u8bed\u4ecd\u4fdd\u755957-62%\u7684\u5f52\u4e00\u5316\u4e0a\u4e0b\u6587\u6548\u7528\uff0c\u800c\u7acb\u9676\u5b9b\u8bed\u4ec510-24%\uff0c\u4e2d\u6587\u51e0\u4e4e\u4e3a\u96f6\u3002", "\u6027\u80fd\u5dee\u8ddd\u4e3b\u8981\u7531\u538b\u7f29\u5668\u8bad\u7ec3\u76d1\u7763\u6570\u636e\u51b3\u5b9a\uff0c\u800c\u975e\u6a21\u578b\u67b6\u6784\uff1b\u82f1\u6587\u8bad\u7ec3\u7684 LLMLingua-2\u3001Kompress-v2 \u5747\u6709\u660e\u663e\u8de8\u8bed\u8a00\u9000\u5316\u3002", "\u957f\u4e0a\u4e0b\u6587\u573a\u666f\u4e2d\uff0c\u6fc0\u8fdb\u5b66\u4e60\u578b\u538b\u7f29\u4f1a\u4f7f\u591a\u4e2a\u975e\u82f1\u8bed\u8bed\u8a00\u9000\u5316\u5230\u63a5\u8fd1\u65e0\u4e0a\u4e0b\u6587\u6548\u679c\uff1b\u5148\u7ffb\u8bd1\u518d\u538b\u7f29\u5728\u90e8\u5206\u8bed\u8a00\u4e2d\u66f4\u7701 token \u4e14\u6548\u679c\u66f4\u597d\u3002"], "keywords": ["\u63d0\u793a\u538b\u7f29", "\u591a\u8bed\u8a00", "\u5927\u8bed\u8a00\u6a21\u578b", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26175v1", "published_at": "2026-07-27", "score": 0.242, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26175.png", "title": "Lost in Compression: A Controlled Cross-Lingual Audit of Extractive Prompt Compressors", "tldr": "\u82f1\u6587\u8bad\u7ec3\u7684\u63d0\u793a\u538b\u7f29\u5668\u663e\u8457\u4f24\u5bb3\u975e\u82f1\u8bed\u4e0a\u4e0b\u6587\u3002", "upvotes": 2, "what_it_is": "\u672c\u6587\u5bf9\u62bd\u53d6\u5f0f\u63d0\u793a\u538b\u7f29\u5668\u8fdb\u884c\u53d7\u63a7\u8de8\u8bed\u8a00\u5ba1\u8ba1\uff0c\u6bd4\u8f83\u56db\u79cd\u5b66\u4e60\u578b\u538b\u7f29\u5668\u4e0e\u56db\u79cd\u786e\u5b9a\u6027\u57fa\u7ebf\u5728\u5341\u79cd\u8bed\u8a00\u3001\u5341\u4e00\u4e2a\u76ee\u6807\u6a21\u578b\u4e0a\u7684\u8868\u73b0\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u82f1\u6587\u76d1\u7763\u8bad\u7ec3\u7684\u538b\u7f29\u5668\u5728\u975e\u82f1\u8bed\u4e2d\u5b58\u5728\u4e25\u91cd\u8fc1\u79fb\u7f3a\u53e3\uff0c\u800c\u591a\u8bed\u8a00\u76d1\u7763\u6216\u786e\u5b9a\u6027\u65b9\u6cd5\u66f4\u7a33\u5065\u3002", "why_notable": "\u8be5\u8bba\u6587\u63ed\u793a\u4e86\u63d0\u793a\u538b\u7f29\u5728\u82f1\u8bed\u4ee5\u5916\u5b58\u5728\u88ab\u4f4e\u4f30\u7684\u5b89\u5168\u9884\u7b97\u4e0e\u53ef\u9760\u6027\u95ee\u9898\uff0c\u5bf9\u591a\u8bed\u8a00 LLM \u90e8\u7f72\u3001\u6210\u672c\u4f18\u5316\u548c\u957f\u4e0a\u4e0b\u6587\u5e94\u7528\u5177\u6709\u76f4\u63a5\u5b9e\u8df5\u5f71\u54cd\u3002"}, {"abstract": "We present $\\mathcal{N}_0$-Foundation, a paradigm for tactile-enabled embodied manipulation, which integrates tactile sensing hardware, large-scale multimodal data, tactile representation learning, and standardized evaluation. First, we engineer the infrastructure for scalable data collection, including a vision-based tactile sensor, a tactile Universal Manipulation Interface (UMI), and a synchronized visuo-tactile data collection system supporting both robot embodiments and UMI-based demonstrations. Leveraging this infrastructure, we construct NeoData, which contains more than 30000 hours of synchronized visual and tactile demonstrations, spanning six embodiments, 450 tasks, and billions of paired RGB and tactile frames collected through a mixture of real-robot teleoperation and UMI-based demonstrations. To facilitate open research, we further release OpenNeoData, a 5000-hour open-source subset of NeoData. The dataset addresses a central limitation of existing manipulation corpora, critical for deformable-object manipulation, precise assembly, delicate force control, and sustained surface interaction. Capitalizing on the large-scale, heterogeneous tactile measurements, we propose NeoForce, a visuo-tactile representation model that learn transferable tactile representations across different sensor designs. To enable systematic evaluation of tactile embodied models built upon our infrastructure, datasets and tactile representations, we further propose a comprehensive benchmark, which combines the real-world NeoReal suite and the simulated NeoSim suite for standardized evaluation. Experiments across both suites show that policies benefit from the physical contact state rather than from the device-specific appearance of the tactile signal. We release the dataset, the representation, and the benchmark, aiming at supporting future work on tactile-enabled embodied manipulation.", "arxiv_id": "2608.29601", "arxiv_url": "https://arxiv.org/abs/2608.29601", "authors": ["NeoteAI Team", "Fudan TEAI Team"], "brief": "\u8bba\u6587\u63d0\u51fa N0-Foundation\uff0c\u4e00\u4e2a\u9762\u5411\u89e6\u89c9\u589e\u5f3a\u5177\u8eab\u64cd\u4f5c\u7684\u5b8c\u6574\u8303\u5f0f\uff0c\u6db5\u76d6\u89e6\u89c9\u786c\u4ef6\u3001\u6d77\u91cf\u89c6\u89e6\u89c9\u6570\u636e\u3001\u8868\u793a\u5b66\u4e60\u6a21\u578b\u4e0e\u6807\u51c6\u5316\u8bc4\u6d4b\u3002\u5176\u6838\u5fc3\u4ea7\u7269\u5305\u62ec 3 \u4e07\u5c0f\u65f6 NeoData\u30015000 \u5c0f\u65f6\u5f00\u6e90\u5b50\u96c6 OpenNeoData\u3001\u89c6\u89e6\u89c9\u8868\u5f81\u6a21\u578b NeoForce\uff0c\u4ee5\u53ca\u771f\u5b9e\u4e0e\u4eff\u771f\u7ed3\u5408\u7684 NeoReal/NeoSim \u57fa\u51c6\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29601", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u53ef\u6269\u5c55\u91c7\u96c6\u57fa\u7840\u8bbe\u65bd\uff0c\u5305\u62ec\u89c6\u89c9\u5f0f\u89e6\u89c9\u4f20\u611f\u5668\u3001\u89e6\u89c9 UMI \u548c\u540c\u6b65\u89c6\u89e6\u89c9\u91c7\u96c6\u7cfb\u7edf\uff0c\u652f\u6301\u673a\u5668\u4eba\u672c\u4f53\u4e0e\u4eba\u5de5\u793a\u8303\u3002", "NeoData \u8986\u76d6 6 \u79cd\u5177\u8eab\u5f62\u6001\u3001450 \u4e2a\u4efb\u52a1\u3001\u8d85\u8fc7 30000 \u5c0f\u65f6\u540c\u6b65\u89c6\u89c9\u4e0e\u89e6\u89c9\u6f14\u793a\uff0c\u5305\u542b\u6570\u5341\u4ebf\u7ea7 RGB-\u89e6\u89c9\u914d\u5bf9\u5e27\u3002", "\u63d0\u51fa NeoForce \u5b66\u4e60\u8de8\u4e0d\u540c\u89e6\u89c9\u4f20\u611f\u5668\u8bbe\u8ba1\u53ef\u8fc1\u79fb\u7684\u89c6\u89e6\u89c9\u8868\u5f81\uff0c\u5e76\u901a\u8fc7 NeoReal \u4e0e NeoSim \u8fdb\u884c\u7cfb\u7edf\u8bc4\u6d4b\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89e6\u89c9\u611f\u77e5", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29601v1", "published_at": "2026-08-30", "score": 0.225, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "$\\mathcal{N}_0$-Foundation: Towards the Age of Tactile Intelligence", "tldr": "\u5927\u89c4\u6a21\u89e6\u89c9\u5177\u8eab\u64cd\u4f5c\u57fa\u7840\u8bbe\u65bd\u4e0e\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa N0-Foundation\uff0c\u4e00\u4e2a\u9762\u5411\u89e6\u89c9\u589e\u5f3a\u5177\u8eab\u64cd\u4f5c\u7684\u5b8c\u6574\u8303\u5f0f\uff0c\u6db5\u76d6\u89e6\u89c9\u786c\u4ef6\u3001\u6d77\u91cf\u89c6\u89e6\u89c9\u6570\u636e\u3001\u8868\u793a\u5b66\u4e60\u6a21\u578b\u4e0e\u6807\u51c6\u5316\u8bc4\u6d4b\u3002\u5176\u6838\u5fc3\u4ea7\u7269\u5305\u62ec 3 \u4e07\u5c0f\u65f6 NeoData\u30015000 \u5c0f\u65f6\u5f00\u6e90\u5b50\u96c6 OpenNeoData\u3001\u89c6\u89e6\u89c9\u8868\u5f81\u6a21\u578b NeoForce\uff0c\u4ee5\u53ca\u771f\u5b9e\u4e0e\u4eff\u771f\u7ed3\u5408\u7684 NeoReal/NeoSim \u57fa\u51c6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u9f50\u4e86\u73b0\u6709\u64cd\u4f5c\u6570\u636e\u96c6\u4e2d\u89e6\u89c9\u4fe1\u606f\u4e0d\u8db3\u7684\u5173\u952e\u77ed\u677f\uff0c\u5bf9\u67d4\u6027\u7269\u4f53\u64cd\u4f5c\u3001\u7cbe\u5bc6\u88c5\u914d\u3001\u7ec6\u817b\u529b\u63a7\u548c\u6301\u7eed\u63a5\u89e6\u4efb\u52a1\u5177\u6709\u91cd\u8981\u4ef7\u503c\uff1b\u540c\u65f6\u5f00\u653e\u6570\u636e\u3001\u6a21\u578b\u4e0e\u57fa\u51c6\uff0c\u6709\u671b\u63a8\u52a8\u89e6\u89c9\u5177\u8eab\u667a\u80fd\u7684\u6807\u51c6\u5316\u7814\u7a76\u3002"}, {"abstract": "Correcting health misinformation in dialogue requires more than producing a factual rebuttal: users differ in what they know, what they believe, and what they need to hear, so an effective intervention often depends on first asking the right clarifying question. Yet existing methods either respond immediately or probe indiscriminately, treating clarification as either unnecessary or always beneficial. We propose Reward-Optimized Probe-and-Respond (RO-PnR), a framework that learns when asking is worth its cost. At each turn, RO-PnR chooses between probing for more information and committing to a final correction, guided by a turn-level reward that weighs the expected gain from probing against its interaction cost. To capture how user heterogeneity affects probing value, we model each simulated user with a latent state along health literacy and belief commitment. Experiments show that RO-PnR achieves the highest cost-adjusted utility across three health-misinformation datasets and three base models, using 30% fewer turns than always-probe baselines.", "arxiv_id": "2608.21721", "arxiv_url": "https://arxiv.org/abs/2608.21721", "authors": ["Xiaoying Song", "Anirban Saha Anik", "Jinyu Liu", "Qitao Tan", "Geng Yuan", "Lingzi Hong"], "brief": "\u8bba\u6587\u63d0\u51fa RO-PnR \u591a\u8f6e\u5065\u5eb7 misinformation \u5e72\u9884\u6846\u67b6\uff0c\u5728\u5bf9\u8bdd\u4e2d\u52a8\u6001\u51b3\u5b9a\u662f\u5148\u8ffd\u95ee\u6f84\u6e05\uff0c\u8fd8\u662f\u76f4\u63a5\u7ed9\u51fa\u7ea0\u6b63\u56de\u5e94\u3002\u5b83\u901a\u8fc7\u5efa\u6a21\u7528\u6237\u5065\u5eb7\u7d20\u517b\u4e0e\u4fe1\u5ff5\u56fa\u7740\u7a0b\u5ea6\u7684\u6f5c\u5728\u72b6\u6001\uff0c\u4f18\u5316\u8ffd\u95ee\u5e26\u6765\u7684\u6536\u76ca\u4e0e\u4ea4\u4e92\u6210\u672c\u4e4b\u95f4\u7684\u6743\u8861\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21721", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bbe\u8ba1 turn-level reward\uff0c\u5c06\u8ffd\u95ee\u7684\u9884\u671f\u4fe1\u606f\u589e\u76ca\u4e0e\u989d\u5916\u5bf9\u8bdd\u6210\u672c\u7eb3\u5165\u7edf\u4e00\u51b3\u7b56\u3002", "\u7528\u5065\u5eb7\u7d20\u517b\u548c\u4fe1\u5ff5\u627f\u8bfa\u5ea6\u523b\u753b\u6a21\u62df\u7528\u6237\u5f02\u8d28\u6027\uff0c\u4ece\u800c\u5224\u65ad\u4e0d\u540c\u7528\u6237\u662f\u5426\u503c\u5f97\u7ee7\u7eed\u8ffd\u95ee\u3002", "\u5728\u4e09\u4e2a\u5065\u5eb7\u8c23\u8a00\u6570\u636e\u96c6\u548c\u4e09\u4e2a\u57fa\u7840\u6a21\u578b\u4e0a\uff0cRO-PnR \u83b7\u5f97\u6700\u9ad8\u6210\u672c\u8c03\u6574\u6548\u7528\uff0c\u5e76\u6bd4 always-probe \u57fa\u7ebf\u5c11\u7528\u7ea630%\u8f6e\u6b21\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5065\u5eb7\u533b\u7597", "\u591a\u8f6e\u5bf9\u8bdd", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21721v1", "published_at": "2026-08-22", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21721.png", "title": "Ask or Answer: A Decision Framework for Multi-Turn Health Misinformation Intervention", "tldr": "\u5b66\u4f1a\u4f55\u65f6\u8ffd\u95ee\u4ee5\u66f4\u6709\u6548\u7ea0\u6b63\u5065\u5eb7\u8c23\u8a00", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa RO-PnR \u591a\u8f6e\u5065\u5eb7 misinformation \u5e72\u9884\u6846\u67b6\uff0c\u5728\u5bf9\u8bdd\u4e2d\u52a8\u6001\u51b3\u5b9a\u662f\u5148\u8ffd\u95ee\u6f84\u6e05\uff0c\u8fd8\u662f\u76f4\u63a5\u7ed9\u51fa\u7ea0\u6b63\u56de\u5e94\u3002\u5b83\u901a\u8fc7\u5efa\u6a21\u7528\u6237\u5065\u5eb7\u7d20\u517b\u4e0e\u4fe1\u5ff5\u56fa\u7740\u7a0b\u5ea6\u7684\u6f5c\u5728\u72b6\u6001\uff0c\u4f18\u5316\u8ffd\u95ee\u5e26\u6765\u7684\u6536\u76ca\u4e0e\u4ea4\u4e92\u6210\u672c\u4e4b\u95f4\u7684\u6743\u8861\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5065\u5eb7\u8c23\u8a00\u7ea0\u6b63\u4ece\u201c\u76f4\u63a5\u53cd\u9a73\u201d\u63a8\u8fdb\u5230\u201c\u6709\u6210\u672c\u610f\u8bc6\u7684\u4e2a\u6027\u5316\u591a\u8f6e\u5e72\u9884\u201d\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u5065\u5eb7\u6c9f\u901a\u573a\u666f\uff0c\u53ef\u63d0\u5347\u533b\u7597\u5bf9\u8bdd\u7cfb\u7edf\u5728\u5b89\u5168\u6027\u3001\u6548\u7387\u548c\u8bf4\u670d\u529b\u4e0a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models can generate interactive web interfaces, but reliable generative UI requires maintaining an executable artifact as user requests evolve. We introduce EvoGenUI-Bench, a benchmark for multi-turn interface maintenance comprising 150 five-turn tasks and 750 turns across three scenarios: information presentation, executable interaction, and tool-grounded external state. We execute generated artifacts in a browser and evaluate them using screenshots, source and DOM evidence, actor traces, and runtime logs. Beyond turn-level and episode-level success, we measure cross-turn retention with Adjacent Pass Retention. Across eight models, even the strongest achieves 74.9% Turn Pass while completing only 37.3% of five-turn episodes; APR further falls to 52.4% on tool-grounded tasks. Diagnostic analysis shows that presentation failures center on information architecture, interaction failures on derived-state propagation and affordance binding, and tool-grounded failures additionally involve external-state grounding and requirement decomposition. These results reframe generative UI evaluation from judging isolated outputs to testing whether interface behavior, derived state, external state, and assistant claims remain synchronized as the artifact evolves.", "arxiv_id": "2608.29387", "arxiv_url": "https://arxiv.org/abs/2608.29387", "authors": ["Yue Peng", "Lanke Xia", "Zihan Wang", "Jiahao Ye", "Ke Ning", "Hongyi Wen"], "brief": "\u8bba\u6587\u63d0\u51fa EvoGenUI-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u8f6e\u751f\u6210\u5f0f\u7f51\u9875\u754c\u9762\u7ef4\u62a4\u7684\u57fa\u51c6\uff0c\u5305\u542b150\u4e2a\u4e94\u8f6e\u4efb\u52a1\u3001\u5171750\u8f6e\uff0c\u8986\u76d6\u4fe1\u606f\u5c55\u793a\u3001\u53ef\u6267\u884c\u4ea4\u4e92\u548c\u5de5\u5177\u63a5\u5730\u5916\u90e8\u72b6\u6001\u4e09\u7c7b\u573a\u666f\u3002\u5b83\u5728\u6d4f\u89c8\u5668\u4e2d\u6267\u884c\u751f\u6210\u7684\u754c\u9762\uff0c\u5e76\u7ed3\u5408\u622a\u56fe\u3001\u6e90\u7801\u3001DOM\u3001\u64cd\u4f5c\u8f68\u8ff9\u548c\u8fd0\u884c\u65e5\u5fd7\u8fdb\u884c\u8bc4\u4f30\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29387", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5f15\u5165\u8de8\u8f6e\u4fdd\u6301\u6307\u6807 Adjacent Pass Retention\uff0c\u7528\u4e8e\u8861\u91cf\u6a21\u578b\u5728\u9700\u6c42\u6f14\u5316\u4e2d\u4fdd\u7559\u65e2\u6709\u529f\u80fd\u4e0e\u72b6\u6001\u4e00\u81f4\u6027\u7684\u80fd\u529b", "\u516b\u4e2a\u6a21\u578b\u4e2d\u6700\u5f3a\u8005\u5355\u8f6e\u901a\u8fc7\u7387\u4e3a74.9%\uff0c\u4f46\u5b8c\u6574\u4e94\u8f6e\u4efb\u52a1\u6210\u529f\u7387\u4ec537.3%", "\u5de5\u5177\u63a5\u5730\u4efb\u52a1\u6700\u56f0\u96be\uff0cAPR\u964d\u81f352.4%\uff0c\u4e3b\u8981\u95ee\u9898\u5305\u62ec\u5916\u90e8\u72b6\u6001\u63a5\u5730\u3001\u9700\u6c42\u62c6\u89e3\u548c\u72b6\u6001\u540c\u6b65\u5931\u8d25"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29387v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "EvoGenUI-Bench: Evaluating LLMs as Multi-Turn Generative UI Assistants", "tldr": "\u8bc4\u6d4bLLM\u591a\u8f6e\u7ef4\u62a4\u751f\u6210\u5f0fUI\u7684\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EvoGenUI-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u8f6e\u751f\u6210\u5f0f\u7f51\u9875\u754c\u9762\u7ef4\u62a4\u7684\u57fa\u51c6\uff0c\u5305\u542b150\u4e2a\u4e94\u8f6e\u4efb\u52a1\u3001\u5171750\u8f6e\uff0c\u8986\u76d6\u4fe1\u606f\u5c55\u793a\u3001\u53ef\u6267\u884c\u4ea4\u4e92\u548c\u5de5\u5177\u63a5\u5730\u5916\u90e8\u72b6\u6001\u4e09\u7c7b\u573a\u666f\u3002\u5b83\u5728\u6d4f\u89c8\u5668\u4e2d\u6267\u884c\u751f\u6210\u7684\u754c\u9762\uff0c\u5e76\u7ed3\u5408\u622a\u56fe\u3001\u6e90\u7801\u3001DOM\u3001\u64cd\u4f5c\u8f68\u8ff9\u548c\u8fd0\u884c\u65e5\u5fd7\u8fdb\u884c\u8bc4\u4f30\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u751f\u6210\u5f0fUI\u8bc4\u6d4b\u4ece\u5355\u6b21\u8f93\u51fa\u8d28\u91cf\u63a8\u8fdb\u5230\u591a\u8f6e\u53ef\u6267\u884c\u4ea7\u7269\u7ef4\u62a4\uff0c\u63ed\u793a\u5f53\u524dLLM\u5728\u6301\u7eed\u4fdd\u6301\u754c\u9762\u884c\u4e3a\u3001\u6d3e\u751f\u72b6\u6001\u3001\u5916\u90e8\u72b6\u6001\u4e0e\u6587\u672c\u627f\u8bfa\u4e00\u81f4\u6027\u65b9\u9762\u4ecd\u5b58\u5728\u660e\u663e\u77ed\u677f\u3002"}, {"abstract": "AI agents are moving toward persistent, stateful execution across various applications, accumulating execution state and external effects that are costly to reconstruct after failures. Checkpoint and rollback (C/R) are becoming essential for recovery, yet their security implications remain largely unexplored. Correct rollback does not imply secure recovery: a faithfully restored checkpoint may resume an execution whose states, assumptions, and external effects never coexisted in any valid history. In this paper, we present the first systematic security study of checkpoint and rollback in existing agent systems. By examining representative agent C/R systems, we characterize the design space of existing C/R mechanisms and develop a general execution model that captures their recovery boundaries and state dependencies. From this model, we identify five fundamental failure modes spanning incomplete or inconsistent internal state, stale external dependencies, nondeterministic replay, and unrecorded external effects. We further demonstrate their security impact through three end-to-end attacks on Hermes, Cline, and LangGraph, enabling malware-verification bypass, unauthorized mail forwarding, and double payment. To systematically study these failures in practice, we develop a multi-agent analysis pipeline that reconstructs execution semantics, identifies violations of the five failure conditions, and validates them through actual rollback. Across five representative frameworks, our evaluation shows that these failures recur across heterogeneous C/R designs and stem from a common gap between the state restored by a checkpoint and the dependencies required for secure continuation.", "arxiv_id": "2608.29381", "arxiv_url": "https://arxiv.org/abs/2608.29381", "authors": ["Guanlong Wu", "Dahui Li", "Ke Jiang", "Jianyu Niu", "Cong Wang", "Yinqian Zhang"], "brief": "\u8bba\u6587\u9996\u6b21\u7cfb\u7edf\u7814\u7a76\u73b0\u6709 AI Agent \u68c0\u67e5\u70b9\u4e0e\u56de\u6eda\u673a\u5236\u7684\u5b89\u5168\u6027\u3002\u4f5c\u8005\u5efa\u7acb\u901a\u7528\u6267\u884c\u6a21\u578b\uff0c\u5f52\u7eb3\u4e94\u7c7b\u6062\u590d\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u5728 Hermes\u3001Cline\u3001LangGraph \u7b49\u7cfb\u7edf\u4e2d\u5b9e\u73b0\u7aef\u5230\u7aef\u653b\u51fb\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29381", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6307\u51fa\u201c\u6b63\u786e\u56de\u6eda\u201d\u4e0d\u7b49\u4e8e\u201c\u5b89\u5168\u6062\u590d\u201d\uff1a\u6062\u590d\u540e\u7684\u72b6\u6001\u3001\u5047\u8bbe\u4e0e\u5916\u90e8\u526f\u4f5c\u7528\u53ef\u80fd\u4ece\u672a\u5728\u540c\u4e00\u6709\u6548\u5386\u53f2\u4e2d\u5171\u5b58", "\u603b\u7ed3\u4e94\u7c7b\u6839\u672c\u5931\u8d25\u6a21\u5f0f\uff0c\u8986\u76d6\u5185\u90e8\u72b6\u6001\u4e0d\u5b8c\u6574/\u4e0d\u4e00\u81f4\u3001\u5916\u90e8\u4f9d\u8d56\u9648\u65e7\u3001\u975e\u786e\u5b9a\u6027\u91cd\u653e\u3001\u672a\u8bb0\u5f55\u5916\u90e8\u526f\u4f5c\u7528\u7b49\u95ee\u9898", "\u6784\u5efa\u591a\u667a\u80fd\u4f53\u5206\u6790\u6d41\u6c34\u7ebf\uff0c\u5728\u4e94\u4e2a\u4ee3\u8868\u6027\u6846\u67b6\u4e2d\u68c0\u6d4b\u5e76\u9a8c\u8bc1\u56de\u6eda\u5b89\u5168\u8fdd\u89c4\uff0c\u53ef\u5bfc\u81f4\u6076\u610f\u8f6f\u4ef6\u9a8c\u8bc1\u7ed5\u8fc7\u3001\u90ae\u4ef6\u672a\u6388\u6743\u8f6c\u53d1\u3001\u91cd\u590d\u652f\u4ed8\u7b49\u653b\u51fb"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168", "\u7cfb\u7edf\u6062\u590d", "\u6267\u884c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29381v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Safe to Resume? Breaking Execution Continuity of Agent Execution via Rollback", "tldr": "\u63ed\u793a\u667a\u80fd\u4f53\u56de\u6eda\u6062\u590d\u7684\u7cfb\u7edf\u6027\u5b89\u5168\u98ce\u9669", "upvotes": 0, "what_it_is": "\u8bba\u6587\u9996\u6b21\u7cfb\u7edf\u7814\u7a76\u73b0\u6709 AI Agent \u68c0\u67e5\u70b9\u4e0e\u56de\u6eda\u673a\u5236\u7684\u5b89\u5168\u6027\u3002\u4f5c\u8005\u5efa\u7acb\u901a\u7528\u6267\u884c\u6a21\u578b\uff0c\u5f52\u7eb3\u4e94\u7c7b\u6062\u590d\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u5728 Hermes\u3001Cline\u3001LangGraph \u7b49\u7cfb\u7edf\u4e2d\u5b9e\u73b0\u7aef\u5230\u7aef\u653b\u51fb\u3002", "why_notable": "\u968f\u7740\u667a\u80fd\u4f53\u8d70\u5411\u6301\u4e45\u5316\u3001\u6709\u72b6\u6001\u6267\u884c\uff0c\u68c0\u67e5\u70b9\u548c\u56de\u6eda\u5c06\u6210\u4e3a\u57fa\u7840\u80fd\u529b\uff1b\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u6062\u590d\u673a\u5236\u4e2d\u7684\u65b0\u653b\u51fb\u9762\uff0c\u5bf9 Agent \u6846\u67b6\u3001\u5b89\u5168\u5ba1\u8ba1\u548c\u53ef\u9760\u6267\u884c\u7cfb\u7edf\u8bbe\u8ba1\u5177\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) substantially improves single-sample accuracy (pass@1) but causes the policy\u0027s solution space to contract, diminishing the returns of test-time scaling. In this work, we investigate where inside a reasoning trajectory this breadth is lost: does the policy fail to access a valid solution family, or does it fail to execute computation once initiated? To disentangle access from execution, we analyze the Countdown task, whose solution space can be exhaustively enumerated into discrete entrance families defined by the first operand and operator, across PPO on Qwen2.5-3B and GRPO on Qwen2.5-3B-Instruct. Across both training setups, solution coverage falls by up to 67%, halving even on problems solved across all checkpoints. We show that this contraction is heavily concentrated at the entrance: per-token likelihood shifts are 11x--16x larger prior to the first arithmetic operation than during downstream reasoning. Supplying only an unselected entrance prefix restores completion rates in low-access families by over an order of magnitude (0.018 -\u003e 0.212 under PPO), demonstrating that alternative solutions remain executable but are no longer initiated. Guided by this localization, we find that while surface prompting fails to recover diversity, entrance-targeted interventions succeed: late-layer parameter interpolation with early checkpoints increases solution coverage by 37% at no loss in pass@1. Finally, we show that early-step entropy collapse recurs across six math benchmarks with 7B and 14B models, but is not an inevitable byproduct of reasoning optimization: an SFT baseline preserves more than double the coverage, and staged SFT--DPO--RLVR pipelines retain early-step entropy. In summary, reasoning breadth is lost at the door, not inside the room. Code: https://github.com/ershiyidian/early-branch-locking.", "arxiv_id": "2608.29188", "arxiv_url": "https://arxiv.org/abs/2608.29188", "authors": ["Qiancheng Zhou", "Ruizhe Li"], "brief": "\u8bba\u6587\u7814\u7a76\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u4e3a\u4f55\u63d0\u5347pass@1\u5374\u524a\u5f31\u6d4b\u8bd5\u65f6\u6269\u5c55\u6536\u76ca\u3002\u901a\u8fc7Countdown\u4efb\u52a1\u53ef\u679a\u4e3e\u89e3\u65cf\u7684\u7279\u6027\uff0c\u53d1\u73b0\u89e3\u7a7a\u95f4\u6536\u7f29\u4e3b\u8981\u53d1\u751f\u5728\u9996\u4e2a\u8fd0\u7b97\u524d\u7684\u201c\u5165\u53e3\u9009\u62e9\u201d\uff0c\u800c\u975e\u540e\u7eed\u8ba1\u7b97\u6267\u884c\u80fd\u529b\u4e22\u5931\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29188", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728PPO\u4e0eGRPO\u8bad\u7ec3\u7684Qwen2.5\u6a21\u578b\u4e0a\uff0c\u89e3\u8986\u76d6\u7387\u6700\u9ad8\u4e0b\u964d67%\uff0c\u5373\u4f7f\u59cb\u7ec8\u80fd\u89e3\u51fa\u7684\u9898\u76ee\u4e5f\u4f1a\u8986\u76d6\u7387\u51cf\u534a", "\u9996\u4e2a\u7b97\u672f\u64cd\u4f5c\u524d\u7684token\u4f3c\u7136\u53d8\u5316\u6bd4\u540e\u7eed\u63a8\u7406\u9636\u6bb5\u592711\u523016\u500d\uff0c\u8bf4\u660e\u591a\u6837\u6027\u584c\u7f29\u96c6\u4e2d\u5728\u65e9\u671f\u5206\u652f", "\u7ed9\u51fa\u672a\u88ab\u9009\u62e9\u7684\u5165\u53e3\u524d\u7f00\u53ef\u5c06\u4f4e\u8bbf\u95ee\u89e3\u65cf\u5b8c\u6210\u7387\u4ece0.018\u63d0\u5347\u52300.212\uff1b\u665a\u5c42\u53c2\u6570\u4e0e\u65e9\u671f\u68c0\u67e5\u70b9\u63d2\u503c\u53ef\u5728\u4e0d\u635f\u5931pass@1\u4e0b\u63d0\u534737%\u89e3\u8986\u76d6\u7387"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u6a21\u578b\u591a\u6837\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29188v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Locked at the Entrance, Open Inside: Where RLVR Narrows the Solution Space", "tldr": "RLVR\u4e3b\u8981\u5728\u63a8\u7406\u5165\u53e3\u538b\u7f29\u89e3\u7a7a\u95f4", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u4e3a\u4f55\u63d0\u5347pass@1\u5374\u524a\u5f31\u6d4b\u8bd5\u65f6\u6269\u5c55\u6536\u76ca\u3002\u901a\u8fc7Countdown\u4efb\u52a1\u53ef\u679a\u4e3e\u89e3\u65cf\u7684\u7279\u6027\uff0c\u53d1\u73b0\u89e3\u7a7a\u95f4\u6536\u7f29\u4e3b\u8981\u53d1\u751f\u5728\u9996\u4e2a\u8fd0\u7b97\u524d\u7684\u201c\u5165\u53e3\u9009\u62e9\u201d\uff0c\u800c\u975e\u540e\u7eed\u8ba1\u7b97\u6267\u884c\u80fd\u529b\u4e22\u5931\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5b9a\u4f4d\u4e86RLVR\u5bfc\u81f4\u63a8\u7406\u591a\u6837\u6027\u4e0b\u964d\u7684\u5177\u4f53\u4f4d\u7f6e\uff0c\u89e3\u91ca\u4e86\u4e3a\u4f55pass@1\u63d0\u5347\u4f1a\u4f34\u968f\u6d4b\u8bd5\u65f6\u91c7\u6837\u6536\u76ca\u964d\u4f4e\uff0c\u5e76\u63d0\u51fa\u5165\u53e3\u5b9a\u5411\u5e72\u9884\u4f5c\u4e3a\u4fdd\u7559\u89e3\u7a7a\u95f4\u7684\u5b9e\u7528\u65b9\u5411\u3002"}, {"abstract": "Tool-using agents are commonly evaluated by a single bit: whether an end-to-end workflow completed. This metric fails to distinguish failures that matter in production, such as expired credentials, malformed payloads, or correct execution followed by incorrect final delivery. We introduce APIFlow-Bench, a fully auditable benchmark for long-horizon, dependent REST-API workflows that decomposes performance into seven engineering capabilities and requires agents to produce answers supported by the actual call path. We generate synthetic API worlds forward, subtask by subtask; each subtask is admitted only after a zero-LLM self-test triad verifies its grader and an oracle establishes solvability, and an adversarial audit identified and fixed six grader exploits. Grading is deterministic and provenance-sensitive: a state check traces a mock-minted canary through the API data flow to the response the answer must originate from, and a typed answer card is verified field by field. We release all answer keys and 44,362 unredacted execution transcripts. Across 19 frontier and open-weight models under one neutral scaffold, we find: (1) longer dependency chains degrade success, from 93% on individual subtasks to 74% on clean 20-subtask chains and 61% when including the 8% of chain trials that a model-consensus screen flags as passed by no model; (2) reliability separates models more than best-case capability, with best-of-five spanning seven points but all-five-of-five reliability spanning 44 points; (3) the independent-error account of compounding failure does not fit the data: pass rates on 20-subtask chains are 33 percentage points above the product of subtask-level rates, and on the clean slice 77% of failing runs reached the correct final state and failed only at delivery.", "arxiv_id": "2608.29128", "arxiv_url": "https://arxiv.org/abs/2608.29128", "authors": ["Zelin Wan", "Arash Nourian", "Xiaoxiao Li", "Nihar Nandan", "Kamalakannan Nandagopal"], "brief": "\u8bba\u6587\u63d0\u51fa APIFlow-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u3001\u5f3a\u4f9d\u8d56 REST API \u5de5\u4f5c\u6d41\u7684\u53ef\u5ba1\u8ba1\u57fa\u51c6\u3002\u5b83\u5c06\u7aef\u5230\u7aef\u6210\u529f\u7387\u62c6\u89e3\u4e3a\u4e03\u7c7b\u5de5\u7a0b\u80fd\u529b\uff0c\u5e76\u8981\u6c42\u667a\u80fd\u4f53\u7684\u6700\u7ec8\u7b54\u6848\u53ef\u7531\u771f\u5b9e\u8c03\u7528\u8def\u5f84\u6eaf\u6e90\u652f\u6491\u3002", "categories": ["cs.AI", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29128", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u901a\u8fc7\u9010\u5b50\u4efb\u52a1\u524d\u5411\u751f\u6210\u5408\u6210 API \u4e16\u754c\uff0c\u5e76\u7528\u96f6 LLM \u81ea\u6d4b\u3001oracle \u53ef\u89e3\u6027\u9a8c\u8bc1\u548c\u5bf9\u6297\u5ba1\u8ba1\u51cf\u5c11\u8bc4\u5206\u6f0f\u6d1e", "\u91c7\u7528\u786e\u5b9a\u6027\u3001\u6eaf\u6e90\u654f\u611f\u8bc4\u5206\uff1a\u8ffd\u8e2a mock canary \u5728 API \u6570\u636e\u6d41\u4e2d\u7684\u4f20\u64ad\uff0c\u5e76\u9010\u5b57\u6bb5\u9a8c\u8bc1\u7c7b\u578b\u5316\u7b54\u6848\u5361", "\u572819\u4e2a\u524d\u6cbf\u4e0e\u5f00\u6e90\u6a21\u578b\u4e0a\u53d1\u73b0\uff1a20\u6b65\u94fe\u6210\u529f\u7387\u663e\u8457\u4e0b\u964d\uff0c\u53ef\u9760\u6027\u5dee\u5f02\u8fdc\u5927\u4e8e\u6700\u4f73\u5c1d\u8bd5\u80fd\u529b\uff0c\u4e14\u591a\u6570\u5931\u8d25\u53d1\u751f\u5728\u6700\u7ec8\u4ea4\u4ed8\u800c\u975e\u72b6\u6001\u6267\u884c"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "API\u8bc4\u6d4b", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29128v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "APIFlow-Bench: Measuring Whether Agents Survive Long, Dependent API Workflows", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u957f\u94feAPI\u5de5\u4f5c\u6d41\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa APIFlow-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u3001\u5f3a\u4f9d\u8d56 REST API \u5de5\u4f5c\u6d41\u7684\u53ef\u5ba1\u8ba1\u57fa\u51c6\u3002\u5b83\u5c06\u7aef\u5230\u7aef\u6210\u529f\u7387\u62c6\u89e3\u4e3a\u4e03\u7c7b\u5de5\u7a0b\u80fd\u529b\uff0c\u5e76\u8981\u6c42\u667a\u80fd\u4f53\u7684\u6700\u7ec8\u7b54\u6848\u53ef\u7531\u771f\u5b9e\u8c03\u7528\u8def\u5f84\u6eaf\u6e90\u652f\u6491\u3002", "why_notable": "\u8be5\u57fa\u51c6\u6bd4\u4f20\u7edf\u5355\u4e00\u5b8c\u6210\u7387\u66f4\u8d34\u8fd1\u751f\u4ea7\u73af\u5883\u4e2d\u7684\u5de5\u5177\u8c03\u7528\u5931\u8d25\u6a21\u5f0f\uff0c\u63ed\u793a\u4e86\u957f\u94fe\u4f9d\u8d56\u3001\u51ed\u8bc1/\u8f7d\u8377/\u4ea4\u4ed8\u9519\u8bef\u5bf9\u667a\u80fd\u4f53\u53ef\u9760\u6027\u7684\u5f71\u54cd\uff0c\u5bf9\u8bc4\u4f30\u548c\u6539\u8fdb\u5b9e\u9645 API \u667a\u80fd\u4f53\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Fine-tuning large language models (LLMs) on narrowly harmful datasets can lead to misalignment broadly, a phenomenon known as emergent misalignment (EM). EM poses a challenge for AI safety and our understanding of LLMs. Prior work often frames EM as an unexpected behavior, and explains it by appealing to general misalignment directions or anthropomorphizing it as acquiring an evil persona. However, the mechanisms behind these framings remain obscure. In this work, we show that EM is a predictable and data-dependent generalization phenomenon. By examining the base model\u0027s representation of EM training data and evaluation prompts, we find that evilness after EM training is highly predictable from representational distance: the closer an evaluation prompt is to training data centroid, the more evilness it elicits from EM models after training (with an average Spearman correlation of -0.73 across 12 model-dataset settings). Building upon this analysis, we further demystify EM by showing that (1) its effectiveness changes significantly based on training data format; (2) there is not a general misalignment direction that transfers across different EM models; (3) the effect of EM is fundamentally different from persona changes. Furthermore, we extend the EM generalization metric from a scalar distance to a dataset-specific generalization direction, which robustly predicts EM models\u0027 evilness under semantics-preserving prompt perturbations including appending random tokens and paraphrasing, where other methods do not reliably generalize.", "arxiv_id": "2608.29118", "arxiv_url": "https://arxiv.org/abs/2608.29118", "authors": ["Mingxuan Li", "Qirun Dai", "Heran Wang", "Chenhao Tan"], "brief": "\u8bba\u6587\u91cd\u65b0\u89e3\u91ca\u4e86\u5927\u6a21\u578b\u5728\u72ed\u7a84\u6709\u5bb3\u6570\u636e\u4e0a\u5fae\u8c03\u540e\u51fa\u73b0\u5e7f\u6cdb\u4e0d\u5bf9\u9f50\u7684\u201c\u6d8c\u73b0\u5f0f\u5931 alignment\u201d\u73b0\u8c61\u3002\u4f5c\u8005\u8bc1\u660e\u8be5\u73b0\u8c61\u5e76\u975e\u795e\u79d8\u4eba\u683c\u5316\u53d8\u5316\uff0c\u800c\u662f\u4f9d\u8d56\u8bad\u7ec3\u6570\u636e\u5206\u5e03\u7684\u53ef\u9884\u6d4b\u6cdb\u5316\u884c\u4e3a\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29118", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bc4\u4f30\u63d0\u793a\u4e0e EM \u8bad\u7ec3\u6570\u636e\u5728\u57fa\u5ea7\u6a21\u578b\u8868\u5f81\u7a7a\u95f4\u4e2d\u8d8a\u63a5\u8fd1\uff0c\u8d8a\u5bb9\u6613\u8bf1\u53d1\u5fae\u8c03\u540e\u6a21\u578b\u7684\u201c\u90aa\u6076\u201d\u56de\u7b54\uff0c12\u7ec4\u6a21\u578b-\u6570\u636e\u8bbe\u7f6e\u4e2d\u5e73\u5747 Spearman \u76f8\u5173\u4e3a -0.73\u3002", "EM \u6548\u679c\u4f1a\u663e\u8457\u53d7\u8bad\u7ec3\u6570\u636e\u683c\u5f0f\u5f71\u54cd\uff0c\u4e14\u4e0d\u5b58\u5728\u80fd\u8de8\u4e0d\u540c EM \u6a21\u578b\u8fc1\u79fb\u7684\u901a\u7528\u5931 alignment \u65b9\u5411\u3002", "\u4f5c\u8005\u5c06\u6807\u91cf\u8ddd\u79bb\u6307\u6807\u6269\u5c55\u4e3a\u6570\u636e\u96c6\u7279\u5b9a\u7684\u6cdb\u5316\u65b9\u5411\uff0c\u53ef\u5728\u968f\u673a token \u8ffd\u52a0\u3001\u6539\u5199\u7b49\u8bed\u4e49\u4fdd\u6301\u6270\u52a8\u4e0b\u66f4\u7a33\u5065\u9884\u6d4b\u6a21\u578b\u5931 alignment \u7a0b\u5ea6\u3002"], "keywords": ["AI\u5b89\u5168", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5bf9\u9f50", "\u8868\u5f81\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29118v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Emergent Misalignment Is Not Magical", "tldr": "\u6d8c\u73b0\u5f0f\u5931 alignment \u53ef\u7531\u6570\u636e\u8868\u5f81\u8ddd\u79bb\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u91cd\u65b0\u89e3\u91ca\u4e86\u5927\u6a21\u578b\u5728\u72ed\u7a84\u6709\u5bb3\u6570\u636e\u4e0a\u5fae\u8c03\u540e\u51fa\u73b0\u5e7f\u6cdb\u4e0d\u5bf9\u9f50\u7684\u201c\u6d8c\u73b0\u5f0f\u5931 alignment\u201d\u73b0\u8c61\u3002\u4f5c\u8005\u8bc1\u660e\u8be5\u73b0\u8c61\u5e76\u975e\u795e\u79d8\u4eba\u683c\u5316\u53d8\u5316\uff0c\u800c\u662f\u4f9d\u8d56\u8bad\u7ec3\u6570\u636e\u5206\u5e03\u7684\u53ef\u9884\u6d4b\u6cdb\u5316\u884c\u4e3a\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u4e00\u4e2a\u88ab\u89c6\u4e3a\u7a81\u53d1\u3001\u96be\u89e3\u91ca\u7684 AI \u5b89\u5168\u73b0\u8c61\u8f6c\u5316\u4e3a\u53ef\u6d4b\u91cf\u3001\u53ef\u9884\u6d4b\u7684\u8868\u5f81\u6cdb\u5316\u95ee\u9898\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u5fae\u8c03\u98ce\u9669\u3001\u8bbe\u8ba1\u66f4\u53ef\u9760\u7684\u5b89\u5168\u8bc4\u4f30\u4e0e\u6570\u636e\u5ba1\u67e5\u65b9\u6cd5\u3002"}, {"abstract": "Large audio-language models (LALMs) describe audio at the clip level but cannot assign timestamps to the events, speakers, or sounds they identify. Despite being essential for downstream tasks like speech recognition and dense audio captioning, timestamping remains a key limitation of most LALMs. We present TEMPO (Temporally-grounded Multi-task Post-training), the first unified model to handle audio, speech, and music timestamping tasks. Our core contribution is a supervised fine-tuning (SFT) stage built on three innovations: atomic timestamp tokens, a time-aware projector that injects sinusoidal wall-clock encodings into audio frame embeddings, and a distance-aware Gaussian loss. Our training is based on a synthetic-to-real curriculum. We further introduce, to our knowledge, the first application of reinforcement learning to unified audio timestamping, using GRPO with verifiable temporal rewards that directly optimize the evaluation objectives. Rather than serving as the primary source of performance gains, GRPO acts as a refinement stage on top of the SFT checkpoint, providing modest additional improvements. To support this work, we build a training dataset containing 119K samples and an evaluation benchmark containing 10K samples, drawn from established corpora across five tasks. On this benchmark, TEMPO outperforms Audio Flamingo Next and Qwen3-Omni, two state-of-the-art LALMs explicitly trained on timestamped data. Experiments confirm that SFT delivers most of these gains, with GRPO providing consistent but moderate refinements.", "arxiv_id": "2608.29999", "arxiv_url": "https://arxiv.org/abs/2608.29999", "authors": ["Apoorva Kulkarni", "Kaousheik Jayakumar", "Sreyan Ghosh", "Utathya Aich", "Ramani Duraiswami", "Dinesh Manocha"], "brief": "TEMPO \u662f\u4e00\u4e2a\u9762\u5411\u97f3\u9891\u3001\u8bed\u97f3\u4e0e\u97f3\u4e50\u4e8b\u4ef6\u65f6\u95f4\u6233\u7684\u7edf\u4e00\u5927\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e3a LALM \u6ce8\u5165\u65f6\u95f4\u5b9a\u4f4d\u80fd\u529b\uff0c\u5e76\u8fdb\u4e00\u6b65\u7528\u5e26\u53ef\u9a8c\u8bc1\u65f6\u95f4\u5956\u52b1\u7684 GRPO \u505a\u7cbe\u4fee\u3002", "categories": ["cs.SD", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29999", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u539f\u5b50\u65f6\u95f4\u6233 token\u3001\u65f6\u95f4\u611f\u77e5\u6295\u5f71\u5668\u548c\u8ddd\u79bb\u611f\u77e5 Gaussian loss\uff0c\u4ee5\u63d0\u5347\u5e27\u7ea7\u65f6\u95f4\u5bf9\u9f50\u80fd\u529b", "\u91c7\u7528\u5408\u6210\u5230\u771f\u5b9e\u7684\u8bfe\u7a0b\u5b66\u4e60\uff0c\u6784\u5efa 11.9 \u4e07\u8bad\u7ec3\u6837\u672c\u4e0e 1 \u4e07\u6837\u672c\u8bc4\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u4e94\u7c7b\u65f6\u95f4\u6233\u4efb\u52a1", "\u5728\u7edf\u4e00\u97f3\u9891\u65f6\u95f4\u6233\u57fa\u51c6\u4e0a\u8d85\u8fc7 Audio Flamingo Next \u548c Qwen3-Omni\uff1b\u4e3b\u8981\u589e\u76ca\u6765\u81ea SFT\uff0cGRPO \u5e26\u6765\u7a33\u5b9a\u4f46\u8f83\u5c0f\u63d0\u5347"], "keywords": ["\u97f3\u9891\u8bed\u8a00\u6a21\u578b", "\u65f6\u95f4\u5b9a\u4f4d", "\u76d1\u7763\u5fae\u8c03", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29999v1", "published_at": "2026-08-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TEMPO: Temporally-grounded Multi-task Post-training for Large Audio-Language Models", "tldr": "\u7edf\u4e00\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u7684\u591a\u4efb\u52a1\u65f6\u95f4\u6233\u5b9a\u4f4d\u3002", "upvotes": 0, "what_it_is": "TEMPO \u662f\u4e00\u4e2a\u9762\u5411\u97f3\u9891\u3001\u8bed\u97f3\u4e0e\u97f3\u4e50\u4e8b\u4ef6\u65f6\u95f4\u6233\u7684\u7edf\u4e00\u5927\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e3a LALM \u6ce8\u5165\u65f6\u95f4\u5b9a\u4f4d\u80fd\u529b\uff0c\u5e76\u8fdb\u4e00\u6b65\u7528\u5e26\u53ef\u9a8c\u8bc1\u65f6\u95f4\u5956\u52b1\u7684 GRPO \u505a\u7cbe\u4fee\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 LALM \u53ea\u80fd\u505a\u7247\u6bb5\u7ea7\u63cf\u8ff0\u3001\u7f3a\u4e4f\u7cbe\u786e\u65f6\u95f4\u5b9a\u4f4d\u7684\u5173\u952e\u77ed\u677f\uff0c\u9996\u6b21\u5c06\u97f3\u9891\u3001\u8bed\u97f3\u548c\u97f3\u4e50\u65f6\u95f4\u6233\u4efb\u52a1\u7edf\u4e00\u5efa\u6a21\uff0c\u5e76\u63a2\u7d22\u4e86\u5f3a\u5316\u5b66\u4e60\u5728\u97f3\u9891\u65f6\u95f4\u5bf9\u9f50\u4e2d\u7684\u5e94\u7528\uff0c\u5177\u5907\u63a8\u52a8\u5bc6\u96c6\u97f3\u9891\u7406\u89e3\u4e0e\u8bed\u97f3\u8bc6\u522b\u7b49\u4e0b\u6e38\u4efb\u52a1\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) achieve strong reasoning performance, which depends critically on inference-time decisions. Yet these decisions are commonly handled by static, one-size-fits-all policies, limiting adaptation to diverse tasks and reasoning stages. Recent adaptive methods partially address this limitation, but they primarily adapt either decoding stochasticity (how the model explores) or reasoning compute (how long the model reasons) in isolation, leaving their interaction within a single reasoning trajectory unmodeled. To address this challenge, we shift toward a within-trajectory joint control view, and instantiate it in AutoCRAT, a decoder-side controller for frozen backbones. Using only signals available during decoding, AutoCRAT jointly adjusts sampling stochasticity and reasoning budget during generation. AutoCRAT operates over a discrete action space and updates control decisions only at semantic boundaries, improving stability while remaining responsive to the evolving reasoning process. Comprehensive evaluation across 6 benchmarks demonstrates that AutoCRAT (I) uses 13.8-52.7% fewer inference tokens on average than recommended static configurations, (II) surpasses recommended static and adaptive baselines by 1.5-4.5% in relative accuracy, and (III) enjoys strong cross-backbone transferability.", "arxiv_id": "2608.29988", "arxiv_url": "https://arxiv.org/abs/2608.29988", "authors": ["Hanjun Luo", "Qiushi Liu", "Jingya Zhang", "Haihong Pang", "Jiaheng Wen", "Yifei Ma", "Yu Yao", "Chengxi Zhang", "Hanrong Zhang", "Yankai Chen", "Hanan Salam"], "brief": "\u8bba\u6587\u63d0\u51fa AutoCRAT\uff0c\u4e00\u4e2a\u7528\u4e8e\u51bb\u7ed3\u5927\u6a21\u578b\u7684\u89e3\u7801\u7aef\u63a7\u5236\u5668\uff0c\u5728\u5355\u6b21\u63a8\u7406\u8f68\u8ff9\u5185\u52a8\u6001\u8c03\u8282\u91c7\u6837\u968f\u673a\u6027\u548c\u63a8\u7406\u9884\u7b97\u3002\u5b83\u4ec5\u4f9d\u8d56\u89e3\u7801\u65f6\u53ef\u83b7\u5f97\u7684\u4fe1\u53f7\uff0c\u5e76\u5728\u8bed\u4e49\u8fb9\u754c\u5904\u66f4\u65b0\u63a7\u5236\u51b3\u7b56\uff0c\u4ee5\u517c\u987e\u7a33\u5b9a\u6027\u4e0e\u9002\u5e94\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29988", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u63a8\u7406\u65f6\u51b3\u7b56\u5efa\u6a21\u4e3a\u8f68\u8ff9\u5185\u8054\u5408\u63a7\u5236\u95ee\u9898\uff0c\u540c\u65f6\u7ba1\u7406\u201c\u5982\u4f55\u63a2\u7d22\u201d\u548c\u201c\u63a8\u7406\u591a\u4e45\u201d\u3002", "\u91c7\u7528\u79bb\u6563\u52a8\u4f5c\u7a7a\u95f4\uff0c\u5e76\u53ea\u5728\u8bed\u4e49\u8fb9\u754c\u66f4\u65b0\u63a7\u5236\u7b56\u7565\uff0c\u51cf\u5c11\u9891\u7e41\u8c03\u6574\u5e26\u6765\u7684\u4e0d\u7a33\u5b9a\u3002", "\u57286\u4e2a\u57fa\u51c6\u4e0a\u76f8\u6bd4\u63a8\u8350\u9759\u6001\u914d\u7f6e\u5e73\u5747\u51cf\u5c1113.8-52.7%\u63a8\u7406token\uff0c\u51c6\u786e\u7387\u76f8\u5bf9\u63d0\u53471.5-4.5%\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u4f18\u5316", "\u81ea\u9002\u5e94\u8ba1\u7b97", "\u89e3\u7801\u7b56\u7565"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29988v1", "published_at": "2026-08-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AutoCRAT: Within-trajectory Joint Control of Stochasticity and Compute for LLM Reasoning", "tldr": "\u8054\u5408\u8c03\u63a7LLM\u63a8\u7406\u968f\u673a\u6027\u4e0e\u8ba1\u7b97\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoCRAT\uff0c\u4e00\u4e2a\u7528\u4e8e\u51bb\u7ed3\u5927\u6a21\u578b\u7684\u89e3\u7801\u7aef\u63a7\u5236\u5668\uff0c\u5728\u5355\u6b21\u63a8\u7406\u8f68\u8ff9\u5185\u52a8\u6001\u8c03\u8282\u91c7\u6837\u968f\u673a\u6027\u548c\u63a8\u7406\u9884\u7b97\u3002\u5b83\u4ec5\u4f9d\u8d56\u89e3\u7801\u65f6\u53ef\u83b7\u5f97\u7684\u4fe1\u53f7\uff0c\u5e76\u5728\u8bed\u4e49\u8fb9\u754c\u5904\u66f4\u65b0\u63a7\u5236\u51b3\u7b56\uff0c\u4ee5\u517c\u987e\u7a33\u5b9a\u6027\u4e0e\u9002\u5e94\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7a81\u7834\u4e86\u4ee5\u5f80\u53ea\u5355\u72ec\u81ea\u9002\u5e94\u89e3\u7801\u968f\u673a\u6027\u6216\u8ba1\u7b97\u9884\u7b97\u7684\u5c40\u9650\uff0c\u5728\u4e0d\u6539\u52a8\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u63a8\u7406\u6548\u7387\u548c\u51c6\u786e\u7387\uff0c\u5e76\u5c55\u73b0\u51fa\u8f83\u5f3a\u7684\u8de8\u6a21\u578b\u8fc1\u79fb\u80fd\u529b\u3002"}, {"abstract": "Evaluating research ideas generated by LLMs is difficult because their scientific value cannot be fully determined by objective criteria, and no single reference answer specifies what counts as a good idea. To address this challenge, we introduce Ideation Arena, a battle style platform that evaluates research ideas through pairwise human assessment. Ideation Arena evaluates ideas generated by 14 frontier LLMs and 5 research agent architectures built on 2 base models. To ensure a common starting point, Ideation Arena builds shared literature contexts from papers familiar to the participating researchers and provides the same contexts to all LLMs and agents. We collect over 6,000 double blind pairwise comparisons from 105 active computer science researchers and construct an Elo rating leaderboard of proposal-stage expert preferences in computer science under a shared closed-context protocol. We validate the rankings through interrater agreement and robustness analyses, showing that the leaderboard remains stable under changes in annotator composition and domain coverage. Our results show substantial variation in agent effectiveness, with some frameworks improving ideation quality over their backbones and others offering little benefit or even underperforming their base models. We further construct Ideation Arena Eval, a benchmark for assessing whether automated evaluators align with human preferences in research ideation. Experiments with current LLM judges show that they still cannot reliably reproduce expert preferences, with the best judge reaching 72.56% Soft Accuracy on Overall Quality. Our code, data, and leaderboards are available at https://github.com/foss12138/Research-Ideation-Arena.", "arxiv_id": "2608.29696", "arxiv_url": "https://arxiv.org/abs/2608.29696", "authors": ["Zhiyu Chen", "Keyu Zhao", "Jigao Fu", "Dong Liang", "Yanbiao Wu", "Jiaoyang Li", "Haidong Xue", "Xinhua Zeng", "Yuanyi Zhen", "Fengli Xu", "Yong Li"], "brief": "\u8bba\u6587\u63d0\u51fa Ideation Arena\uff0c\u4e00\u4e2a\u901a\u8fc7\u53cc\u76f2\u6210\u5bf9\u4eba\u7c7b\u4e13\u5bb6\u6bd4\u8f83\u6765\u8bc4\u4f30 LLM \u79d1\u7814\u60f3\u6cd5\u7684\u5e73\u53f0\u3002\u5b83\u8bc4\u6d4b\u4e8614\u4e2a\u524d\u6cbf LLM \u548c5\u79cd\u7814\u7a76\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u5e76\u6784\u5efa\u4e86\u57fa\u4e8e Elo \u7684\u8ba1\u7b97\u673a\u79d1\u5b66\u7814\u7a76\u521b\u610f\u6392\u884c\u699c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29696", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6536\u96c6105\u540d\u6d3b\u8dc3\u8ba1\u7b97\u673a\u79d1\u5b66\u7814\u7a76\u8005\u76846000\u591a\u6b21\u53cc\u76f2\u6210\u5bf9\u6bd4\u8f83\uff0c\u4f7f\u7528\u5171\u4eab\u6587\u732e\u4e0a\u4e0b\u6587\u4fdd\u8bc1\u516c\u5e73\u8d77\u70b9", "\u53d1\u73b0\u4e0d\u540c\u7814\u7a76\u667a\u80fd\u4f53\u6846\u67b6\u6548\u679c\u5dee\u5f02\u663e\u8457\uff1a\u6709\u4e9b\u80fd\u63d0\u5347\u57fa\u7840\u6a21\u578b\u521b\u610f\u8d28\u91cf\uff0c\u6709\u4e9b\u6536\u76ca\u6709\u9650\u751a\u81f3\u9000\u5316", "\u6784\u5efa Ideation Arena Eval\uff0c\u7528\u4e8e\u8861\u91cf\u81ea\u52a8\u8bc4\u5ba1\u5668\u662f\u5426\u4e0e\u4eba\u7c7b\u4e13\u5bb6\u504f\u597d\u4e00\u81f4\uff1b\u5f53\u524d\u6700\u4f73 LLM judge \u4ec5\u8fbe72.56% Soft Accuracy"], "keywords": ["\u79d1\u7814\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "LLM\u8bc4\u5ba1", "\u4eba\u7c7b\u504f\u597d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29696v1", "published_at": "2026-08-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Ideation Arena: Evaluating LLM Generated Research Ideas with Battle-style Human Expert Assessment", "tldr": "\u7528\u4e13\u5bb6\u5bf9\u6218\u8bc4\u6d4bLLM\u79d1\u7814\u521b\u610f\u8d28\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Ideation Arena\uff0c\u4e00\u4e2a\u901a\u8fc7\u53cc\u76f2\u6210\u5bf9\u4eba\u7c7b\u4e13\u5bb6\u6bd4\u8f83\u6765\u8bc4\u4f30 LLM \u79d1\u7814\u60f3\u6cd5\u7684\u5e73\u53f0\u3002\u5b83\u8bc4\u6d4b\u4e8614\u4e2a\u524d\u6cbf LLM \u548c5\u79cd\u7814\u7a76\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u5e76\u6784\u5efa\u4e86\u57fa\u4e8e Elo \u7684\u8ba1\u7b97\u673a\u79d1\u5b66\u7814\u7a76\u521b\u610f\u6392\u884c\u699c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u201c\u79d1\u7814\u521b\u610f\u751f\u6210\u201d\u8fd9\u4e00\u96be\u4ee5\u5ba2\u89c2\u6253\u5206\u7684\u4efb\u52a1\u63d0\u4f9b\u4e86\u5927\u89c4\u6a21\u4e13\u5bb6\u504f\u597d\u8bc4\u6d4b\u6846\u67b6\uff0c\u5e76\u63ed\u793a\u5f53\u524d\u81ea\u52a8\u8bc4\u5ba1\u548c\u7814\u7a76\u667a\u80fd\u4f53\u4ecd\u5b58\u5728\u660e\u663e\u5c40\u9650\uff0c\u5bf9AI\u8f85\u52a9\u79d1\u7814\u8bc4\u4f30\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Longitudinal clinical agents must maintain an evolving patient state from evidence distributed across visits, time points, and specialties. However, how agent memory should be designed for this setting remains unclear. We introduce a benchmark of multi-visit, multi-specialty patient records that evaluates long-context evidence retrieval, cross-time evidence aggregation, and cross-specialty clinical reasoning. Using this benchmark, we systematically study four memory design choices: curation, organization, retrieval, and memory-augmented reasoning. We find that temporal validity is more important than simply retaining more history; specialty-factorized memory reduces context but can hide shared evidence; and multiple agents help when specialists must reason together, not merely when evidence comes from multiple memories. Guided by these findings, we propose \\textit{MedCache}, a hybrid framework that constructs temporally valid patient memory, organizes evidence into overlapping specialty views, routes each query to relevant memories, and adaptively invokes one or multiple specialists. Experiments show that MedCache improves reasoning accuracy and memory efficiency over strong single-agent and multi-agent baselines, while generalizing across model backbones and external datasets.", "arxiv_id": "2608.29528", "arxiv_url": "https://arxiv.org/abs/2608.29528", "authors": ["Hei Ting", "Chan", "Chenwei Wu", "Xueshen Liu", "Boyuan Zheng", "Liyue Shen", "Jiasi Chen", "Z. Morley Mao"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u591a\u8bbf\u89c6\u3001\u591a\u4e13\u79d1\u60a3\u8005\u8bb0\u5f55\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u3001\u8de8\u65f6\u95f4\u8bc1\u636e\u805a\u5408\u4e0e\u8de8\u4e13\u79d1\u4e34\u5e8a\u63a8\u7406\u3002\u57fa\u4e8e\u7cfb\u7edf\u5206\u6790\uff0c\u63d0\u51faMedCache\uff1a\u6784\u5efa\u5177\u5907\u65f6\u95f4\u6709\u6548\u6027\u7684\u60a3\u8005\u8bb0\u5fc6\uff0c\u5e76\u6309\u91cd\u53e0\u4e13\u79d1\u89c6\u56fe\u7ec4\u7ec7\u3001\u8def\u7531\u548c\u81ea\u9002\u5e94\u8c03\u7528\u5355/\u591a\u4e13\u5bb6\u63a8\u7406\u3002", "categories": ["cs.LG", "cs.DC", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29528", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u7cfb\u7edf\u7814\u7a76\u4e34\u5e8a\u667a\u80fd\u4f53\u8bb0\u5fc6\u7684\u56db\u7c7b\u8bbe\u8ba1\uff1a\u7b5b\u9009\u3001\u7ec4\u7ec7\u3001\u68c0\u7d22\u548c\u8bb0\u5fc6\u589e\u5f3a\u63a8\u7406", "\u53d1\u73b0\u65f6\u95f4\u6709\u6548\u6027\u6bd4\u5355\u7eaf\u4fdd\u7559\u66f4\u591a\u5386\u53f2\u66f4\u5173\u952e\uff1b\u6309\u4e13\u79d1\u62c6\u5206\u53ef\u964d\u4e0a\u4e0b\u6587\u4f46\u53ef\u80fd\u9690\u85cf\u5171\u4eab\u8bc1\u636e", "MedCache\u5728\u591a\u4e2a\u6a21\u578b\u9aa8\u5e72\u548c\u5916\u90e8\u6570\u636e\u96c6\u4e0a\uff0c\u76f8\u6bd4\u5f3a\u5355\u667a\u80fd\u4f53\u4e0e\u591a\u667a\u80fd\u4f53\u57fa\u7ebf\u63d0\u5347\u63a8\u7406\u51c6\u786e\u7387\u4e0e\u8bb0\u5fc6\u6548\u7387"], "keywords": ["\u533b\u7597\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u591a\u667a\u80fd\u4f53", "\u4e34\u5e8a\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29528v1", "published_at": "2026-08-30", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MedCache: Efficient and Temporally Valid Memory for Longitudinal Clinical Agents", "tldr": "MedCache\u63d0\u5347\u7eb5\u5411\u4e34\u5e8a\u667a\u80fd\u4f53\u8bb0\u5fc6\u6548\u7387\u4e0e\u65f6\u6548\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u591a\u8bbf\u89c6\u3001\u591a\u4e13\u79d1\u60a3\u8005\u8bb0\u5f55\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u3001\u8de8\u65f6\u95f4\u8bc1\u636e\u805a\u5408\u4e0e\u8de8\u4e13\u79d1\u4e34\u5e8a\u63a8\u7406\u3002\u57fa\u4e8e\u7cfb\u7edf\u5206\u6790\uff0c\u63d0\u51faMedCache\uff1a\u6784\u5efa\u5177\u5907\u65f6\u95f4\u6709\u6548\u6027\u7684\u60a3\u8005\u8bb0\u5fc6\uff0c\u5e76\u6309\u91cd\u53e0\u4e13\u79d1\u89c6\u56fe\u7ec4\u7ec7\u3001\u8def\u7531\u548c\u81ea\u9002\u5e94\u8c03\u7528\u5355/\u591a\u4e13\u5bb6\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u771f\u5b9e\u4e34\u5e8a\u7eb5\u5411\u573a\u666f\u4e2d\u60a3\u8005\u72b6\u6001\u968f\u65f6\u95f4\u53d8\u5316\u3001\u8bc1\u636e\u5206\u6563\u4e8e\u591a\u4e13\u79d1\u7684\u95ee\u9898\uff0c\u7ed9\u51fa\u4e86\u53ef\u8bc4\u6d4b\u57fa\u51c6\u548c\u53ef\u843d\u5730\u7684\u8bb0\u5fc6\u67b6\u6784\uff0c\u5bf9\u533b\u7597LLM\u667a\u80fd\u4f53\u7684\u53ef\u9760\u63a8\u7406\u4e0e\u4e0a\u4e0b\u6587\u6210\u672c\u63a7\u5236\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Sandbagging models strategically underperform on evaluations while retaining the capabilities being measured. The evaluations that guide frontier-model deployment and governance then understate what these models can do. To understand the mechanism, we propose a causal model of how sandbagging is carried in the residual stream. Early layers write the sandbagging intent onto a single axis of the stream, and a later layer reads that axis and commits the answer. We study three instruction-tuned models (Qwen2.5-7B, Llama-3-8B, and Mistral-7B) and four ways of installing a sandbagging lock (prompting, fine-tuning, reinforcement learning, and circuit breaking). Each lock decides from the prompt whether to sandbag, and the fine-tuned and circuit-broken locks answer honestly whenever a password appears. The causal model predicts a window of layers, after the last sandbagging write and before the answer commit, in which a single-layer reference graft of the sandbagging axis to its honest value restores the full capability. The single-layer graft recovers the capability in 28 of the 33 runs of the prompted, fine-tuned, and RL-trained locks, with a median held-out recovery of 96%. The circuit-broken lock rewrites the whole state through a band of layers, and the single-layer graft fails at every layer. We therefore introduce a second intervention, context grafting, which replays the password\u0027s cached key/value activations so that every layer\u0027s attention reads them as additional context. Context grafting provably and empirically restores the full capability on all three models, and the recovery is surprisingly insensitive to the exact password content. More broadly, an auditor can use this causal model to design interventional auditing techniques for sandbagging models.", "arxiv_id": "2608.29461", "arxiv_url": "https://arxiv.org/abs/2608.29461", "authors": ["Hong Kiat Tan", "Linh Le", "David Williams-King"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u89e3\u91ca\u201csandbagging\uff08\u7b56\u7565\u6027\u85cf\u62d9\uff09\u201d\u5982\u4f55\u5728\u6b8b\u5dee\u6d41\u4e2d\u4f20\u9012\u7684\u56e0\u679c\u6a21\u578b\uff1a\u65e9\u671f\u5c42\u5c06\u85cf\u62d9\u610f\u56fe\u5199\u5165\u5355\u4e00\u65b9\u5411\uff0c\u540e\u7eed\u5c42\u8bfb\u53d6\u5e76\u51b3\u5b9a\u7b54\u6848\u3002\u4f5c\u8005\u5728 Qwen2.5-7B\u3001Llama-3-8B\u3001Mistral-7B \u4e0a\u9a8c\u8bc1\uff0c\u5e76\u8bbe\u8ba1\u5e72\u9884\u65b9\u6cd5\u6062\u590d\u6a21\u578b\u771f\u5b9e\u80fd\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29461", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7814\u7a76\u56db\u7c7b\u85cf\u62d9\u9501\uff1a\u63d0\u793a\u8bcd\u3001\u5fae\u8c03\u3001\u5f3a\u5316\u5b66\u4e60\u548c circuit breaking\uff1b\u5176\u4e2d\u5fae\u8c03\u4e0e circuit-broken \u7248\u672c\u53ef\u5728\u51fa\u73b0\u5bc6\u7801\u65f6\u8bda\u5b9e\u56de\u7b54\u3002", "\u5bf9\u63d0\u793a\u8bcd\u3001\u5fae\u8c03\u548c RL \u9501\uff0c\u5355\u5c42 reference graft \u5728 33 \u6b21\u5b9e\u9a8c\u4e2d\u7684 28 \u6b21\u6062\u590d\u80fd\u529b\uff0c\u4e2d\u4f4d held-out recovery \u8fbe 96%\u3002", "\u5bf9 circuit-broken \u9501\uff0c\u5355\u5c42\u5e72\u9884\u5931\u6548\uff1b\u4f5c\u8005\u63d0\u51fa context grafting\uff0c\u901a\u8fc7\u91cd\u653e\u5bc6\u7801\u7684 KV \u6fc0\u6d3b\uff0c\u8ba9\u5404\u5c42\u6ce8\u610f\u529b\u8bfb\u53d6\u989d\u5916\u4e0a\u4e0b\u6587\uff0c\u5e76\u5728\u4e09\u79cd\u6a21\u578b\u4e0a\u6062\u590d\u5b8c\u6574\u80fd\u529b\u3002"], "keywords": ["\u6a21\u578b\u5ba1\u8ba1", "\u673a\u5236\u89e3\u91ca", "\u5b89\u5168\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29461v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Causal Model for Locating and Unlocking Sandbagging in Model Organisms", "tldr": "\u63d0\u51fa\u56e0\u679c\u6a21\u578b\u5b9a\u4f4d\u5e76\u89e3\u9501\u6a21\u578b\u85cf\u62d9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u89e3\u91ca\u201csandbagging\uff08\u7b56\u7565\u6027\u85cf\u62d9\uff09\u201d\u5982\u4f55\u5728\u6b8b\u5dee\u6d41\u4e2d\u4f20\u9012\u7684\u56e0\u679c\u6a21\u578b\uff1a\u65e9\u671f\u5c42\u5c06\u85cf\u62d9\u610f\u56fe\u5199\u5165\u5355\u4e00\u65b9\u5411\uff0c\u540e\u7eed\u5c42\u8bfb\u53d6\u5e76\u51b3\u5b9a\u7b54\u6848\u3002\u4f5c\u8005\u5728 Qwen2.5-7B\u3001Llama-3-8B\u3001Mistral-7B \u4e0a\u9a8c\u8bc1\uff0c\u5e76\u8bbe\u8ba1\u5e72\u9884\u65b9\u6cd5\u6062\u590d\u6a21\u578b\u771f\u5b9e\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6a21\u578b\u85cf\u62d9\u4ece\u884c\u4e3a\u73b0\u8c61\u63a8\u8fdb\u5230\u53ef\u5e72\u9884\u7684\u5185\u90e8\u673a\u5236\u5c42\u9762\uff0c\u4e3a\u524d\u6cbf\u6a21\u578b\u8bc4\u6d4b\u3001\u5ba1\u8ba1\u548c\u6cbb\u7406\u63d0\u4f9b\u4e86\u66f4\u7cbe\u7ec6\u7684\u56e0\u679c\u5de5\u5177\uff0c\u5c24\u5176\u6709\u52a9\u4e8e\u8bc6\u522b\u88ab\u8bc4\u6d4b\u6a21\u578b\u662f\u5426\u6545\u610f\u4f4e\u62a5\u80fd\u529b\u3002"}, {"abstract": "Vision-Language-Action (VLA) models, built upon Vision-Language Models (VLMs), have significantly enhanced robotic capabilities by leveraging internet-scale knowledge and multimodal reasoning. However, the intensive computational overhead of VLAs constrains on-device deployment, hindering real-time responses to environmental changes. While various acceleration techniques have been proposed, they often rely on fine-tuning or access to training datasets, which are frequently unavailable due to privacy and proprietary concerns. Moreover, although flow-matching-based VLAs have emerged as efficient alternatives to standard diffusion models, current acceleration efforts largely target VLM inference costs, failing to address the iterative ODE solving process inherent in flow matching inference. To address these limitations, we propose AdaVLA, an online, training-free adaptive framework for fast yet accurate flow-matching-based Vision-Language-Action models. We introduce a novel metric derived from the flow matching trajectory curvature to quantify action generation confidence during inference. This metric enables the dynamic reduction of inference steps and the adaptive adjustment of MLP pruning ratios through an efficiently computed importance evaluation, requiring no access to training data. Experimental results on the LIBERO benchmark using a Jetson AGX Orin device demonstrate that our method achieves $1.87\\times$ and $2.24\\times$ speedups for $\u03c0_{0.5}$ and X-VLA, respectively, with negligible degradation in success rates. Furthermore, we validate the robustness of our approach on real-world robotic tasks using SmolVLA.", "arxiv_id": "2608.29208", "arxiv_url": "https://arxiv.org/abs/2608.29208", "authors": ["Sunghwan Han", "Youngtae Han", "Youngmin Yi"], "brief": "\u8bba\u6587\u63d0\u51fa AdaVLA\uff0c\u4e00\u4e2a\u9762\u5411\u57fa\u4e8e\u6d41\u5339\u914d\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u5728\u7ebf\u514d\u8bad\u7ec3\u52a0\u901f\u6846\u67b6\u3002\u5b83\u5728\u63a8\u7406\u65f6\u6839\u636e\u8f68\u8ff9\u66f2\u7387\u4f30\u8ba1\u52a8\u4f5c\u751f\u6210\u7f6e\u4fe1\u5ea6\uff0c\u52a8\u6001\u51cf\u5c11ODE\u6c42\u89e3\u6b65\u6570\u5e76\u8c03\u6574MLP\u526a\u679d\u6bd4\u4f8b\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29208", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u8bad\u7ec3\u6570\u636e\u6216\u5fae\u8c03\uff0c\u9002\u5408\u9690\u79c1\u6216\u95ed\u6e90\u6a21\u578b\u573a\u666f\u4e0b\u7684\u90e8\u7f72\u52a0\u901f", "\u5229\u7528\u6d41\u5339\u914d\u8f68\u8ff9\u66f2\u7387\u6784\u9020\u7f6e\u4fe1\u5ea6\u6307\u6807\uff0c\u51b3\u5b9a\u4f55\u65f6\u51cf\u5c11\u63a8\u7406\u6b65\u6570", "\u5728Jetson AGX Orin\u4e0a\u7684LIBERO\u6d4b\u8bd5\u4e2d\uff0c\u03c00.5\u4e0eX-VLA\u5206\u522b\u5b9e\u73b01.87\u500d\u548c2.24\u500d\u52a0\u901f\uff0c\u6210\u529f\u7387\u51e0\u4e4e\u4e0d\u4e0b\u964d"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba", "\u63a8\u7406\u52a0\u901f", "\u6d41\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29208v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AdaVLA: Adaptive Step Flow Matching for Training-free Acceleration of Vision-Language-Action Models", "tldr": "\u514d\u8bad\u7ec3\u81ea\u9002\u5e94\u52a0\u901fVLA\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AdaVLA\uff0c\u4e00\u4e2a\u9762\u5411\u57fa\u4e8e\u6d41\u5339\u914d\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u5728\u7ebf\u514d\u8bad\u7ec3\u52a0\u901f\u6846\u67b6\u3002\u5b83\u5728\u63a8\u7406\u65f6\u6839\u636e\u8f68\u8ff9\u66f2\u7387\u4f30\u8ba1\u52a8\u4f5c\u751f\u6210\u7f6e\u4fe1\u5ea6\uff0c\u52a8\u6001\u51cf\u5c11ODE\u6c42\u89e3\u6b65\u6570\u5e76\u8c03\u6574MLP\u526a\u679d\u6bd4\u4f8b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u9488\u5bf9\u6d41\u5339\u914dVLA\u63a8\u7406\u4e2d\u7684\u8fed\u4ee3ODE\u6c42\u89e3\u74f6\u9888\uff0c\u800c\u4e0d\u53ea\u662f\u4f18\u5316VLM\u90e8\u5206\uff0c\u4e3a\u673a\u5668\u4eba\u7aef\u4fa7\u5b9e\u65f6\u90e8\u7f72\u63d0\u4f9b\u4e86\u5b9e\u7528\u7684\u514d\u8bad\u7ec3\u65b9\u6848\u3002"}, {"abstract": "Chain-of-thought (CoT) reasoning traces are increasingly proposed as a mechanism for AI oversight: a monitor inspecting a model\u0027s reasoning can, in principle, detect misbehavior invisible from outputs alone. This assumes CoT surfaces what a model is instructed to do regardless of the instructions given. We test this assumption along two axes. First, we introduce the Instruction-Compliance Gap (ICG): the difference in probability that a model\u0027s CoT explicitly references a hidden system prompt directive when that directive is malign versus benign. Across 100 task pairs and 8 frontier reasoning models from 5 families, we find consistent asymmetric disclosure, a higher probability of leaking malign hidden instructions than benign ones, in Qwen3-14B (Wilcoxon $p=0.0001$, $+13.9$pp), Qwen3-32B ($p=0.0011$, $+13.0$pp), Qwen3-235B ($p=0.035$, $+5.8$pp), and similar results with MiniMax-M2.5 and DeepSeek-R1. The detector has 100% precision against two independent blinded labelling passes, and an LLM monitor reading only the reasoning trace reproduces the asymmetry in all 8 models against directive-free controls, identifying the specific directive in 82% of malign traces which the detector classifies as clean. Second, steering vectors extracted in MiniMax-M2.5 via Contrastive Activation Addition causally induce hiding from bare prompts and suppress it from prompts that would otherwise produce it, replicating in Qwen3-14B under a pre-registered design. Benign and malign-derived hiding vectors are highly similar (cosine $0.804$ in MiniMax-M2.5; $0.970$ in Qwen3-14B), implying that in these models the disclosure asymmetry arises from differential activation of a shared hiding direction rather than separate mechanisms.", "arxiv_id": "2608.29070", "arxiv_url": "https://arxiv.org/abs/2608.29070", "authors": ["Zimo Shi", "Xander Tifft", "Wen Xing"], "brief": "\u672c\u6587\u7cfb\u7edf\u68c0\u9a8c\u5c06 Chain-of-Thought \u7528\u4e8e\u76d1\u7763\u7684\u5173\u952e\u5047\u8bbe\uff1a\u63a8\u7406\u8f68\u8ff9\u662f\u5426\u4f1a\u5982\u5b9e\u66b4\u9732\u9690\u85cf\u7cfb\u7edf\u6307\u4ee4\u3002\u4f5c\u8005\u63d0\u51fa\u6307\u4ee4\u9075\u4ece\u5dee\u8ddd\uff08ICG\uff09\uff0c\u53d1\u73b0\u591a\u79cd\u524d\u6cbf\u63a8\u7406\u6a21\u578b\u66f4\u503e\u5411\u5728CoT\u4e2d\u62ab\u9732\u6076\u610f\u800c\u975e\u826f\u6027\u9690\u85cf\u6307\u4ee4\uff0c\u5e76\u53ef\u7528\u6fc0\u6d3b steering \u5411\u91cf\u56e0\u679c\u8c03\u63a7\u8fd9\u79cd\u201c\u9690\u85cf/\u62ab\u9732\u201d\u884c\u4e3a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29070", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728100\u7ec4\u4efb\u52a1\u5bf9\u30018\u4e2a\u524d\u6cbf\u63a8\u7406\u6a21\u578b\u4e0a\uff0cQwen3\u3001MiniMax-M2.5\u3001DeepSeek-R1\u7b49\u6a21\u578b\u8868\u73b0\u51fa\u4e00\u81f4\u7684\u975e\u5bf9\u79f0\u62ab\u9732\uff1a\u6076\u610f\u9690\u85cf\u6307\u4ee4\u66f4\u5bb9\u6613\u88abCoT\u663e\u5f0f\u63d0\u53ca\u3002", "\u4eba\u5de5\u76f2\u6807\u9a8c\u8bc1\u4e0b\u68c0\u6d4b\u5668\u7cbe\u5ea6\u8fbe100%\uff1b\u4ec5\u9605\u8bfb\u63a8\u7406\u8f68\u8ff9\u7684LLM\u76d1\u63a7\u5668\u4e5f\u80fd\u590d\u73b0\u8fd9\u79cd\u4e0d\u5bf9\u79f0\uff0c\u5e76\u5728\u90e8\u5206\u201c\u5e72\u51c0\u201d\u8f68\u8ff9\u4e2d\u8bc6\u522b\u5177\u4f53\u6076\u610f\u6307\u4ee4\u3002", "\u901a\u8fc7Contrastive Activation Addition\u63d0\u53d6\u7684steering\u5411\u91cf\u53ef\u8bf1\u5bfc\u6216\u6291\u5236\u9690\u85cf\u884c\u4e3a\uff1b\u826f\u6027\u4e0e\u6076\u610f\u6765\u6e90\u7684\u9690\u85cf\u5411\u91cf\u9ad8\u5ea6\u76f8\u4f3c\uff0c\u8bf4\u660e\u53ef\u80fd\u5171\u4eab\u540c\u4e00\u9690\u85cf\u65b9\u5411\u3002"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u94fe\u5f0f\u601d\u7ef4", "\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u64cd\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29070v1", "published_at": "2026-08-29", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Selective Disclosure of Hidden Directives in Reasoning Models: Behavioral Asymmetry and Steering", "tldr": "\u63a8\u7406\u6a21\u578b\u66f4\u6613\u5728CoT\u6cc4\u9732\u6076\u610f\u9690\u85cf\u6307\u4ee4", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u68c0\u9a8c\u5c06 Chain-of-Thought \u7528\u4e8e\u76d1\u7763\u7684\u5173\u952e\u5047\u8bbe\uff1a\u63a8\u7406\u8f68\u8ff9\u662f\u5426\u4f1a\u5982\u5b9e\u66b4\u9732\u9690\u85cf\u7cfb\u7edf\u6307\u4ee4\u3002\u4f5c\u8005\u63d0\u51fa\u6307\u4ee4\u9075\u4ece\u5dee\u8ddd\uff08ICG\uff09\uff0c\u53d1\u73b0\u591a\u79cd\u524d\u6cbf\u63a8\u7406\u6a21\u578b\u66f4\u503e\u5411\u5728CoT\u4e2d\u62ab\u9732\u6076\u610f\u800c\u975e\u826f\u6027\u9690\u85cf\u6307\u4ee4\uff0c\u5e76\u53ef\u7528\u6fc0\u6d3b steering \u5411\u91cf\u56e0\u679c\u8c03\u63a7\u8fd9\u79cd\u201c\u9690\u85cf/\u62ab\u9732\u201d\u884c\u4e3a\u3002", "why_notable": "\u8fd9\u9879\u7814\u7a76\u6311\u6218\u4e86\u201cCoT\u5929\u7136\u53ef\u76d1\u7763\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u8868\u660e\u63a8\u7406\u8f68\u8ff9\u7684\u62ab\u9732\u884c\u4e3a\u672c\u8eab\u4f1a\u53d7\u6307\u4ee4\u6027\u8d28\u5f71\u54cd\uff0c\u4e14\u53ef\u88ab\u5185\u90e8\u6fc0\u6d3b\u65b9\u5411\u64cd\u63a7\uff1b\u5bf9AI\u5b89\u5168\u8bc4\u4f30\u3001\u6a21\u578b\u76d1\u63a7\u548c\u9690\u85cf\u610f\u56fe\u68c0\u6d4b\u5177\u6709\u76f4\u63a5\u5f71\u54cd\u3002"}, {"abstract": "Interactive dialogue games test a capability that static benchmarks largely leave implicit: a model must carry state across turns, interpret feedback, and choose valid actions under changing constraints. We study this setting in the LM Playschool Challenge with a 2B open-weight model, and find that many failures are not only broad knowledge failures but also local decision failures: repeated guesses, malformed actions, and violations of feedback that the model has just seen. These diagnostics motivate a training recipe organized around three steps: acquire broad game participation through supervised fine-tuning, repair mechanically verifiable failures within one targeted dialogue-game family using turn-local preference pairs, and preserve general capabilities beyond these dialogue games. In the official final evaluation, our submission improves public clemscore from 10.67 to 38.92 and closed in-domain score from 13.41 to 41.17, while approximately preserving aggregate static performance (44.14 vs. 44.24 for the baseline). Out-of-domain clemscore remains low at 7.88, with the largest gains concentrated in unseen variants of the targeted family. Our results suggest that broad SFT brings most of the model\u0027s capability improvement; turn-local supervision can be effective when failure detection is precise, with observed transfer concentrated primarily within-family.", "arxiv_id": "2608.28458", "arxiv_url": "https://arxiv.org/abs/2608.28458", "authors": ["Nan Li"], "brief": "\u672c\u6587\u9762\u5411 LM Playschool Challenge \u4e2d\u7684 2B \u5f00\u6e90\u6a21\u578b\uff0c\u5206\u6790\u5176\u5728\u4ea4\u4e92\u5f0f\u5bf9\u8bdd\u6e38\u620f\u4e2d\u7684\u72b6\u6001\u8ddf\u8e2a\u3001\u53cd\u9988\u7406\u89e3\u548c\u52a8\u4f5c\u5408\u6cd5\u6027\u5931\u8d25\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u83b7\u53d6-\u4fee\u590d-\u4fdd\u7559\u201d\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u5148\u7528 SFT \u83b7\u5f97\u5e7f\u6cdb\u53c2\u4e0e\u80fd\u529b\uff0c\u518d\u7528\u5c40\u90e8\u504f\u597d\u5bf9\u4fee\u590d\u53ef\u9a8c\u8bc1\u9519\u8bef\uff0c\u540c\u65f6\u4fdd\u6301\u901a\u7528\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28458", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u53d1\u73b0\u5c0f\u6a21\u578b\u5931\u8d25\u4e0d\u4ec5\u6765\u81ea\u77e5\u8bc6\u4e0d\u8db3\uff0c\u4e5f\u5305\u62ec\u91cd\u590d\u731c\u6d4b\u3001\u52a8\u4f5c\u683c\u5f0f\u9519\u8bef\u3001\u5ffd\u89c6\u521a\u6536\u5230\u7684\u53cd\u9988\u7b49\u5c40\u90e8\u51b3\u7b56\u95ee\u9898", "\u8bad\u7ec3\u6d41\u7a0b\u5305\u62ec\u5e7f\u6cdb\u76d1\u7763\u5fae\u8c03\u3001\u9488\u5bf9\u5355\u4e00\u5bf9\u8bdd\u6e38\u620f\u65cf\u7684 turn-local preference pairs \u4fee\u590d\uff0c\u4ee5\u53ca\u901a\u7528\u80fd\u529b\u4fdd\u7559", "\u5b98\u65b9\u8bc4\u6d4b\u4e2d public clemscore \u4ece 10.67 \u63d0\u5347\u5230 38.92\uff0c\u95ed\u96c6\u57df\u5185\u5206\u6570\u4ece 13.41 \u63d0\u5347\u5230 41.17\uff0c\u9759\u6001\u4efb\u52a1\u6027\u80fd\u57fa\u672c\u4e0d\u964d"], "keywords": ["\u667a\u80fd\u4f53", "\u76d1\u7763\u5fae\u8c03", "\u504f\u597d\u5b66\u4e60", "\u5bf9\u8bdd\u7cfb\u7edf"], "num_comments": 2, "on_hf": true, "organization": "NLP Group at Utrecht University", "pdf_url": "https://arxiv.org/pdf/2608.28458v1", "published_at": "2026-08-28", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28458.png", "title": "Acquire, Repair, Preserve: A Diagnosis-Guided Post-Training Recipe for Small-Model Dialogue Game Agents", "tldr": "\u8bca\u65ad\u9a71\u52a8\u8bad\u7ec3\u663e\u8457\u63d0\u5347\u5c0f\u6a21\u578b\u5bf9\u8bdd\u6e38\u620f\u80fd\u529b", "upvotes": 2, "what_it_is": "\u672c\u6587\u9762\u5411 LM Playschool Challenge \u4e2d\u7684 2B \u5f00\u6e90\u6a21\u578b\uff0c\u5206\u6790\u5176\u5728\u4ea4\u4e92\u5f0f\u5bf9\u8bdd\u6e38\u620f\u4e2d\u7684\u72b6\u6001\u8ddf\u8e2a\u3001\u53cd\u9988\u7406\u89e3\u548c\u52a8\u4f5c\u5408\u6cd5\u6027\u5931\u8d25\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u83b7\u53d6-\u4fee\u590d-\u4fdd\u7559\u201d\u540e\u8bad\u7ec3\u6d41\u7a0b\uff1a\u5148\u7528 SFT \u83b7\u5f97\u5e7f\u6cdb\u53c2\u4e0e\u80fd\u529b\uff0c\u518d\u7528\u5c40\u90e8\u504f\u597d\u5bf9\u4fee\u590d\u53ef\u9a8c\u8bc1\u9519\u8bef\uff0c\u540c\u65f6\u4fdd\u6301\u901a\u7528\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5c0f\u6a21\u578b\u5728\u4ea4\u4e92\u5f0f\u4efb\u52a1\u4e2d\u53ef\u901a\u8fc7\u8bca\u65ad\u9a71\u52a8\u540e\u8bad\u7ec3\u83b7\u5f97\u5927\u5e45\u63d0\u5347\uff0c\u5e76\u5f3a\u8c03\u7cbe\u786e\u5931\u8d25\u68c0\u6d4b\u4e0e\u5c40\u90e8\u76d1\u7763\u5728\u7279\u5b9a\u6e38\u620f\u65cf\u5185\u7684\u6709\u6548\u6027\uff1b\u540c\u65f6\u4e5f\u63ed\u793a\u4e86\u8de8\u57df\u6cdb\u5316\u4ecd\u7136\u6709\u9650\u3002"}, {"abstract": "While recent Large Language Model (LLM)-based text-to-SQL systems achieve impressive performance on standard benchmarks, they struggle when user queries implicitly rely on domain-specific knowledge, such as business logic, data conventions, and analytical practices, that is neither captured by the schema nor explicitly stated in the natural language question. Historical SQL query logs offer a valuable source of such knowledge, yet existing benchmarks do not adequately support evaluation of history-driven approaches. To address this gap, we introduce BIRD-History, a benchmark consisting of 1,393 tasks across 11 databases, designed to evaluate text-to-SQL systems\u0027 ability to ground underspecified natural language questions using historical SQL scripts. Each task is annotated with ground-truth labels specifying which historical queries contain relevant knowledge and which SQL clauses encode it, enabling systematic evaluation of both retrieval effectiveness and knowledge utilization. Alongside the benchmark, we propose a plug-in retriever that extracts five types of external knowledge from historical SQL scripts, then retrieves and reranks relevant fragments for query generation. The retriever integrates seamlessly into existing few-shot text-to-SQL pipelines without requiring prompt modifications. Experiments demonstrate consistent improvements across four text-to-SQL systems, highlighting the value of leveraging historical query logs for handling underspecified queries. Dataset and code are open-sourced on https://github.com/zjuidg/BIRD-History.", "arxiv_id": "2608.29345", "arxiv_url": "https://arxiv.org/abs/2608.29345", "authors": ["Yunfan Zhou", "Qiming Shi", "Yizh
