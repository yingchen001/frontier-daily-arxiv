<script>
const PAPERS = [{"abstract": "Long-horizon agentic tasks require large language models (LLMs) to iteratively retrieve, integrate, and maintain dispersed information across multi-turn interactions, but preserving all interaction histories leads to a continuously growing working context. Recent proactive context management methods allow models to edit their own working context with specialized tools, yet they still face three key limitations: (1) a limited toolset restricted to search, deletion, and summarization, with no support for global planning, long-term memory, and adaptive compression; (2) inefficient exploration that treats context management actions uniformly despite their heterogeneous impacts on final outcomes; and (3) coarse-grained credit assignment that assigns the final trajectory-level reward to all intermediate context editing actions during RL. To bridge these gaps, we introduce ContextPilot, a proactive context management framework for long-horizon agentic reasoning. Our approach systematically augments the toolset with planning, long-term memory, and soft context offloading tools. We further propose an RL method tailored for context management, which uses context and entropy variation to identify critical editing decisions for branch sampling and estimates action-level advantages from all branched trajectories that pass through the corresponding context editing action. Experiments on long-context QA and deep search tasks show that ContextPilot achieves stronger performance with a more compact working context, consistently outperforming existing baselines across various base models and benchmarks. Code is available at https://github.com/Tencent/ContextPilot.", "arxiv_id": "2608.28476", "arxiv_url": "https://arxiv.org/abs/2608.28476", "authors": ["Zhuoshi Pan", "Qizhi Pei", "Junru Lu", "Honglin Lin", "H. Vicky Zhao", "Di Yin", "Xing Sun"], "brief": "ContextPilot \u662f\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u63a8\u7406\u7684\u4e3b\u52 s for Proactive Context Management via Fine-grained RL", "tldr": "\u7528\u7ec6\u7c92\u5ea6\u5f3a\u5316\u5b66\u4e60\u6559\u667a\u80fd\u4f53\u7ba1\u7406\u4e0a\u4e0b\u6587", "upvotes": 24, "what_it_is": "ContextPilot \u662f\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u63a8\u7406\u7684\u4e3b\u52a8\u4e0a\u4e0b\u6587\u7ba1\u7406\u6846\u67b6\uff0c\u8ba9 LLM \u5728\u591a\u8f6e\u4efb\u52a1\u4e2d\u81ea\u4e3b\u7ba1\u7406\u5de5\u4f5c\u4e0a\u4e0b\u6587\u3002\u5b83\u6269\u5c55\u4e86\u4e0a\u4e0b\u6587\u7f16\u8f91\u5de5\u5177\uff0c\u5e76\u63d0\u51fa\u9488\u5bf9\u5173\u952e\u7f16\u8f91\u52a8\u4f5c\u7684\u7ec6\u7c92\u5ea6\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u65b9\u6cd5\u3002", "why_notable": "\u957f\u7a0b\u667a\u80fd\u4f53\u5e38\u53d7\u9650\u4e8e\u4e0a\u4e0b\u6587\u81a8\u80c0\u548c\u4fe1\u606f\u7ef4\u62a4\u56f0\u96be\uff1b\u8be5\u5de5\u4f5c\u628a\u4e0a\u4e0b\u6587\u7ba1\u7406\u663e\u5f0f\u5efa\u6a21\u4e3a\u53ef\u5b66\u4e60\u7b56\u7565\uff0c\u5e76\u5728\u957f\u4e0a\u4e0b\u6587\u95ee\u7b54\u548c\u6df1\u5ea6\u641c\u7d22\u4efb\u52a1\u4e2d\u5b9e\u73b0\u66f4\u9ad8\u6027\u80fd\u4e0e\u66f4\u7d27\u51d1\u4e0a\u4e0b\u6587\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generative models can turn natural-language prompts into images, text, code, and other content, lowering the cost of producing drafts and components. Their practical impact increasingly depends on whether those pieces can become complete, dependable deliverables. This survey examines agentic artifact creation, which we define as stateful construction in which an AI system materially constructs or revises a deliverable and intermediate observations redirect later work. Functionally, the process links an operational representation of the artifact, a construction policy, and runtime verification whose feedback can redirect later actions. We reviewed 259 works available through August 20, 2026: 230 systems meeting this definition and 29 benchmarks of agentic artifact construction. We compare six artifact families, then analyze application settings and evaluation practice as separate dimensions. Across families, construction challenges reflect not only modality but also how tightly decisions are coupled and whether failures become visible while they remain repairable. Decomposition can reduce local complexity while increasing coordination and reassembly costs. Learned judges may add little independent evidence when they share the generator\u0027s preferences or blind spots. We formulate principles for keeping commitments and responsibility explicit, turning feedback into targeted repair, and revalidating affected state after change. We also identify opportunities for sustaining coherent, accountable control as artifacts, creator intent, and construction systems evolve. A curated paper list is available at https://github.com/GeminiLight/awesome-agentic-artifact-creation.", "arxiv_id": "2608.28122", "arxiv_url": "https://arxiv.org/abs/2608.28122", "authors": ["Tianfu Wang", "Zhezheng Hao", "Xilin Xia", "Lixin Liu", "Mengkang Hu", "Hongzhang Liu", "Xi Chen", "Ziyan Liu", "Xiankun Lin", "Weijia Zhang", "Nicholas Jing Yuan", "Hui Xiong"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e agentic artifact creation \u7684\u7efc\u8ff0\uff0c\u5b9a\u4e49\u5176\u4e3a\u7531 AI \u7cfb\u7edf\u6709\u72b6\u6001\u5730\u6784\u5efa\u6216\u4fee\u8ba2\u53ef\u4ea4\u4ed8\u6210\u679c\uff0c\u5e76\u7528\u4e2d\u95f4\u89c2\u5bdf\u53cd\u9988\u6307\u5bfc\u540e\u7eed\u52a8\u4f5c\u3002\u4f5c\u8005\u7cfb\u7edf\u68b3\u7406\u4e86\u622a\u81f3 2026 \u5e74 8 \u6708\u7684 259 \u7bc7\u5de5\u4f5c\uff0c\u5305\u62ec 230 \u4e2a\u7cfb\u7edf\u548c 29 \u4e2a\u57fa\u51c6\uff0c\u6bd4\u8f83\u4e0d\u540c\u4ea7\u7269\u7c7b\u578b\u3001\u5e94\u7528\u573a\u666f\u4e0e\u8bc4\u4f30\u65b9\u6cd5\u3002", "categories": ["cs.MM"], "github_repo": "https://github.com/GeminiLight/awesome-agentic-artifact-creation", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2608.28122", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u7edf\u4e00\u6846\u67b6\uff1a\u4ea7\u7269\u7684\u53ef\u64cd\u4f5c\u8868\u793a\u3001\u6784\u5efa\u7b56\u7565\u3001\u8fd0\u884c\u65f6\u9a8c\u8bc1\u53ca\u53cd\u9988\u9a71\u52a8\u4fee\u590d\u5171\u540c\u6784\u6210\u667a\u80fd\u4f53\u5f0f\u4ea7\u7269\u521b\u5efa\u6d41\u7a0b", "\u8986\u76d6\u516d\u7c7b\u4ea7\u7269\u5bb6\u65cf\uff0c\u5206\u6790\u4e0d\u540c\u6a21\u6001\u3001\u51b3\u7b56\u8026\u5408\u7a0b\u5ea6\u3001\u9519\u8bef\u53ef\u89c1\u6027\u4e0e\u53ef\u4fee\u590d\u6027\u5bf9\u6784\u5efa\u96be\u5ea6\u7684\u5f71\u54cd", "\u6307\u51fa\u5f53\u524d\u8bc4\u6d4b\u4e2d\u7684\u98ce\u9669\uff1a\u5206\u89e3\u4f1a\u964d\u4f4e\u5c40\u90e8\u590d\u6742\u5ea6\u4f46\u589e\u52a0\u534f\u8c03\u6210\u672c\uff0c\u5b66\u4e60\u578b\u8bc4\u5ba1\u53ef\u80fd\u7ee7\u627f\u751f\u6210\u5668\u504f\u597d\u4e0e\u76f2\u70b9"], "keywords": ["\u667a\u80fd\u4f53", "\u751f\u6210\u6a21\u578b", "\u591a\u6a21\u6001", "\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Hong Kong University of Science and Technology(GuangZhou)", "pdf_url": "https://arxiv.org/pdf/2608.28122v1", "published_at": "2026-08-28", "score": 0.684, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (53\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28122.png", "title": "Agentic Artifact Creation: Systems, Evaluation, Principles, and Opportunities", "tldr": "\u7efc\u8ff0\u667a\u80fd\u4f53\u5f0f\u751f\u6210\u53ef\u4ea4\u4ed8\u6210\u679c\u7684\u7cfb\u7edf\u4e0e\u8bc4\u6d4b", "upvotes": 53, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8e agentic artifact creation \u7684\u7efc\u8ff0\uff0c\u5b9a\u4e49\u5176\u4e3a\u7531 AI \u7cfb\u7edf\u6709\u72b6\u6001\u5730\u6784\u5efa\u6216\u4fee\u8ba2\u53ef\u4ea4\u4ed8\u6210\u679c\uff0c\u5e76\u7528\u4e2d\u95f4\u89c2\u5bdf\u53cd\u9988\u6307\u5bfc\u540e\u7eed\u52a8\u4f5c\u3002\u4f5c\u8005\u7cfb\u7edf\u68b3\u7406\u4e86\u622a\u81f3 2026 \u5e74 8 \u6708\u7684 259 \u7bc7\u5de5\u4f5c\uff0c\u5305\u62ec 230 \u4e2a\u7cfb\u7edf\u548c 29 \u4e2a\u57fa\u51c6\uff0c\u6bd4\u8f83\u4e0d\u540c\u4ea7\u7269\u7c7b\u578b\u3001\u5e94\u7528\u573a\u666f\u4e0e\u8bc4\u4f30\u65b9\u6cd5\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u5c06\u4ece\u201c\u751f\u6210\u7247\u6bb5\u201d\u5230\u201c\u6784\u5efa\u53ef\u9760\u4ea4\u4ed8\u7269\u201d\u7684\u95ee\u9898\u7cfb\u7edf\u5316\uff0c\u4e3a\u591a\u6a21\u6001\u751f\u6210\u3001\u4ee3\u7801\u751f\u6210\u3001\u6587\u6863/\u8bbe\u8ba1\u751f\u4ea7\u7b49\u667a\u80fd\u4f53\u7cfb\u7edf\u63d0\u4f9b\u4e86\u6982\u5ff5\u6846\u67b6\u3001\u8bc4\u4f30\u8b66\u793a\u548c\u5de5\u7a0b\u539f\u5219\u3002"}, {"abstract": "Streaming 3D reconstruction from extremely long videos requires estimating camera motion and scene geometry online under bounded memory and computation. Early streaming models achieve causal, bounded-cost inference using finite context buffers or compact recurrent states, yet their estimates often deteriorate as sequences grow. Recent methods improve long-horizon stability by coupling short-range context with persistent or multi-level long-range memory. We pursue a different route: we keep the learned temporal state strictly local and formulate predictions whose targets remain independent of sequence length. We present ABot-Recon, a simple streaming model that caches KV features from only the preceding 11 frames. It predicts a point map in the current camera coordinate system together with an adjacent-frame relative pose. These predictions remain equivariant under changes of reference frame, and global poses and geometry are recovered through sequential composition. To reduce accumulated drift, a lightweight temporal refiner improves relative rotations using recent visual and motion context, while a composition-aware pose loss supervises multi-step pose composition. Extensive evaluations on challenging long-sequence benchmarks demonstrate the superior long-horizon performance of our local-context approach. On Oxford Spires, ABot-Recon achieves an ATE of 4.35 m and an RPE-R of $0.12^\\circ$, reducing both errors by approximately 40\\% relative to the best prior results.", "arxiv_id": "2608.27529", "arxiv_url": "https://arxiv.org/abs/2608.27529", "authors": ["Jiarong Han", "Jincheng Xiong", "Yuzhou Liu", "Linzhe Shi", "Changjie Wu", "Ning Guo", "Mu Xu", "Hang Zhang", "Ming Qian"], "brief": "\u8bba\u6587\u63d0\u51fa ABot-Recon\uff0c\u4e00\u79cd\u4ec5\u7f13\u5b58\u524d 11 \u5e27 KV \u7279\u5f81\u7684\u6d41\u5f0f 3D \u91cd\u5efa\u6a21\u578b\u3002\u5b83\u5728\u5f53\u524d\u76f8\u673a\u5750\u6807\u7cfb\u9884\u6d4b\u70b9\u56fe\u4e0e\u76f8\u90bb\u5e27\u76f8\u5bf9\u4f4d\u59ff\uff0c\u518d\u901a\u8fc7\u987a\u5e8f\u7ec4\u5408\u6062\u590d\u5168\u5c40\u8f68\u8ff9\u548c\u51e0\u4f55\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/amap-cvlab/ABot-Recon", "github_stars": 310, "hf_url": "https://huggingface.co/papers/2608.27529", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4fdd\u6301\u5b66\u4e60\u5230\u7684\u65f6\u95f4\u72b6\u6001\u4e25\u683c\u5c40\u90e8\u5316\uff0c\u4f7f\u9884\u6d4b\u76ee\u6807\u4e0d\u968f\u89c6\u9891\u957f\u5ea6\u53d8\u5316\uff0c\u907f\u514d\u4f9d\u8d56\u957f\u671f\u8bb0\u5fc6\u5e26\u6765\u7684\u590d\u6742\u5ea6\u3002", "\u5f15\u5165\u8f7b\u91cf\u65f6\u95f4\u7ec6\u5316\u5668\uff0c\u5229\u7528\u8fd1\u671f\u89c6\u89c9\u4e0e\u8fd0\u52a8\u4e0a\u4e0b\u6587\u6539\u8fdb\u76f8\u5bf9\u65cb\u8f6c\uff0c\u7f13\u89e3\u957f\u5e8f\u5217\u4e2d\u7684\u6f02\u79fb\u7d2f\u79ef\u3002", "\u8bbe\u8ba1 composition-aware pose loss \u76d1\u7763\u591a\u6b65\u4f4d\u59ff\u7ec4\u5408\uff1b\u5728 Oxford Spires \u4e0a ATE \u8fbe 4.35 m\u3001RPE-R \u4e3a 0.12\u00b0\uff0c\u8f83\u6700\u4f73\u5df2\u6709\u65b9\u6cd5\u7ea6\u964d\u4f4e 40%\u8bef\u5dee\u3002"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u6d41\u5f0f\u611f\u77e5", "\u76f8\u673a\u4f4d\u59ff", "\u957f\u89c6\u9891"], "num_comments": 4, "on_hf": true, "organization": "Alibaba AMAP CV Lab", "pdf_url": "https://arxiv.org/pdf/2608.27529v1", "published_at": "2026-08-27", "score": 0.586, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (29\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27529.png", "title": "Revisiting Local Context for Long-Horizon Streaming 3D Reconstruction", "tldr": "\u5c40\u90e8\u4e0a\u4e0b\u6587\u4e5f\u80fd\u7a33\u5065\u957f\u7a0b\u6d41\u5f0f\u4e09\u7ef4\u91cd\u5efa", "upvotes": 29, "what_it_is": "\u8bba\u6587\u63d0\u51fa ABot-Recon\uff0c\u4e00\u79cd\u4ec5\u7f13\u5b58\u524d 11 \u5e27 KV \u7279\u5f81\u7684\u6d41\u5f0f 3D \u91cd\u5efa\u6a21\u578b\u3002\u5b83\u5728\u5f53\u524d\u76f8\u673a\u5750\u6807\u7cfb\u9884\u6d4b\u70b9\u56fe\u4e0e\u76f8\u90bb\u5e27\u76f8\u5bf9\u4f4d\u59ff\uff0c\u518d\u901a\u8fc7\u987a\u5e8f\u7ec4\u5408\u6062\u590d\u5168\u5c40\u8f68\u8ff9\u548c\u51e0\u4f55\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u957f\u7a0b\u6d41\u5f0f\u91cd\u5efa\u5fc5\u987b\u4f9d\u8d56\u6301\u4e45\u957f\u7a0b\u8bb0\u5fc6\u7684\u601d\u8def\uff0c\u8bc1\u660e\u7cbe\u5fc3\u8bbe\u8ba1\u7684\u5c40\u90e8\u4e0a\u4e0b\u6587\u3001\u7b49\u53d8\u9884\u6d4b\u4e0e\u7ec4\u5408\u76d1\u7763\u4e5f\u80fd\u83b7\u5f97\u66f4\u7a33\u5b9a\u7684\u957f\u5e8f\u5217\u8868\u73b0\uff0c\u5177\u5907\u5b9e\u9645\u5728\u7ebf\u4e09\u7ef4\u91cd\u5efa\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Physical understanding and reasoning depend on forming compact and generalizable representations of the world. While modern vision-language models can recognize and explain diverse physical events, they often lack explicit representations of the underlying mechanisms-such as object states, physical parameters, and governing dynamics-needed for reliably reasoning how the world evolves and responds to interventions. In this work, we introduce Code-as-World, a paradigm that represents physical worlds through executable world representations. By expressing physical composition, dynamic evolution, and visual appearance as executable code, Code-as-World provides a compact, quantitatively grounded, and controllable abstraction of the physical world. To construct such representations from multimodal observations, such as natural-language descriptions or real-world videos, we develop an agentic discovery loop inspired by abductive reasoning, where an agent proposes, executes, renders, verifies, and iteratively refines executable world hypotheses. As a concrete application, we use verified executable worlds to provide scalable physical supervision for training vision-language models on quantitative physical reasoning. Experiments show that Code-as-World-VL achieves state-of-the-art performance on QuantiPhy and surpasses leading proprietary models, highlighting the potential of executable world representations as a scalable foundation for physical intelligence.", "arxiv_id": "2608.27549", "arxiv_url": "https://arxiv.org/abs/2608.27549", "authors": ["Hanyang Wang", "Yimo Cai", "Weiliang Chen", "Jiawei Chi", "Haowen Sun", "Qiyu Dai", "Yi-Hsin Hung", "Xingzhuo Guo", "Jinshan Ren", "Runmao Yao", "Ziwei Liu", "Mingsheng Long", "Yueqi Duan", "Jun Gao", "Jiangran Lyu", "Fangfu Liu", "Jialong Wu"], "brief": "\u8bba\u6587\u63d0\u51fa Code-as-World\uff0c\u5c06\u7269\u7406\u7ec4\u6210\u3001\u52a8\u529b\u5b66\u6f14\u5316\u548c\u89c6\u89c9\u5916\u89c2\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\u3002\u5b83\u901a\u8fc7\u667a\u80fd\u4f53\u5f0f\u201c\u63d0\u51fa-\u6267\u884c-\u6e32\u67d3-\u9a8c\u8bc1-\u4fee\u6b63\u201d\u5faa\u73af\uff0c\u4ece\u8bed\u8a00\u6216\u89c6\u9891\u89c2\u6d4b\u4e2d\u53d1\u73b0\u53ef\u9a8c\u8bc1\u7684\u7269\u7406\u4e16\u754c\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mirros-lab/code-as-world", "github_stars": 280, "hf_url": "https://huggingface.co/papers/2608.27549", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u53ef\u6267\u884c\u4e16\u754c\u8868\u5f81\u663e\u5f0f\u7f16\u7801\u7269\u4f53\u72b6\u6001\u3001\u7269\u7406\u53c2\u6570\u548c\u52a8\u529b\u5b66\u673a\u5236\uff0c\u652f\u6301\u5b9a\u91cf\u63a8\u7406\u4e0e\u5e72\u9884\u5206\u6790", "\u91c7\u7528\u53d7\u6eaf\u56e0\u63a8\u7406\u542f\u53d1\u7684 agentic discovery loop\uff0c\u81ea\u52a8\u751f\u6210\u5e76\u8fed\u4ee3\u4f18\u5316\u4e16\u754c\u5047\u8bbe", "\u7528\u9a8c\u8bc1\u540e\u7684\u53ef\u6267\u884c\u4e16\u754c\u4e3a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u53ef\u6269\u5c55\u7269\u7406\u76d1\u7763\uff0c\u5728 QuantiPhy \u4e0a\u8fbe\u5230\u6700\u4f18\u5e76\u8d85\u8fc7\u90e8\u5206\u95ed\u6e90\u6a21\u578b"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7269\u7406\u63a8\u7406", "\u4e16\u754c\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "MirroS", "pdf_url": "https://arxiv.org/pdf/2608.27549v1", "published_at": "2026-08-27", "score": 0.505, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (43\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27549.png", "title": "Code as Worlds: Agentic Discovery of Executable World Representations for Physical Reasoning", "tldr": "\u7528\u53ef\u6267\u884c\u4ee3\u7801\u6784\u5efa\u7269\u7406\u4e16\u754c\u8868\u5f81", "upvotes": 43, "what_it_is": "\u8bba\u6587\u63d0\u51fa Code-as-World\uff0c\u5c06\u7269\u7406\u7ec4\u6210\u3001\u52a8\u529b\u5b66\u6f14\u5316\u548c\u89c6\u89c9\u5916\u89c2\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\u3002\u5b83\u901a\u8fc7\u667a\u80fd\u4f53\u5f0f\u201c\u63d0\u51fa-\u6267\u884c-\u6e32\u67d3-\u9a8c\u8bc1-\u4fee\u6b63\u201d\u5faa\u73af\uff0c\u4ece\u8bed\u8a00\u6216\u89c6\u9891\u89c2\u6d4b\u4e2d\u53d1\u73b0\u53ef\u9a8c\u8bc1\u7684\u7269\u7406\u4e16\u754c\u6a21\u578b\u3002", "why_notable": "\u5b83\u628a\u7269\u7406\u63a8\u7406\u4ece\u7eaf\u89c6\u89c9\u8bed\u8a00\u6a21\u5f0f\u8bc6\u522b\u63a8\u8fdb\u5230\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u7684\u673a\u5236\u5efa\u6a21\uff0c\u4e3a\u8bad\u7ec3\u5177\u5907\u5b9a\u91cf\u7269\u7406\u7406\u89e3\u80fd\u529b\u7684\u591a\u6a21\u6001\u6a21\u578b\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u8def\u5f84\u3002"}, {"abstract": "Factual question answering (QA) typically assumes a single canonical answer, obscuring whether large language models (LLMs) retain divergent accounts of long-tail facts. To address this gap, we introduce ElephantBench, a closed-book knowledge probe comprising 1,094 questions generated through an auditable graph-based pipeline. The pipeline retrieves related documents from a low-exposure web corpus, identifies naturally occurring disagreements, and converts them into multi-account QA records. Each answer is verified against the originating documents and authoritative public web sources and is then reviewed by human annotators. Across 32 models, even the strongest model recovers both accounts on only 52.4% of questions, while on nearly all remaining questions it recalls one account but omits the other. Scaling model size and inference-time reasoning improve recall but do not eliminate this incompleteness. Corpus analysis further shows that exposure imbalance favors the dominant account, whereas greater minority-side exposure is associated with more complete recall. These findings establish ElephantBench as a reproducible knowledge probe for diagnosing epistemic myopia in parametric memory. More broadly, our graph-based benchmark construction pipeline provides an efficient and scalable way to turn long-tail corpora into source-traceable knowledge probes, supporting efforts to evaluate and advance the epistemic rigour of next-generation LLMs. Code is available at https://github.com/Tencent/ElephantBench.", "arxiv_id": "2608.28478", "arxiv_url": "https://arxiv.org/abs/2608.28478", "authors": ["Zhuoshi Pan", "Junru Lu", "Yan Qian", "H. Vicky Zhao", "Di Yin", "Xing Sun"], "brief": "\u8bba\u6587\u63d0\u51fa ElephantBench\uff0c\u4e00\u4e2a\u9762\u5411\u95ed\u5377\u95ee\u7b54\u7684\u957f\u5c3e\u5206\u6b67\u77e5\u8bc6\u63a2\u9488\uff0c\u5305\u542b 1,094 \u4e2a\u591a\u7b54\u6848\u4e8b\u5b9e\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u53ef\u5ba1\u8ba1\u7684\u56fe\u6784\u5efa\u6d41\u7a0b\uff0c\u4ece\u4f4e\u66dd\u5149\u7f51\u9875\u8bed\u6599\u4e2d\u53d1\u73b0\u81ea\u7136\u5206\u6b67\uff0c\u5e76\u9a8c\u8bc1\u4e3a\u53ef\u6eaf\u6e90\u7684\u591a\u8d26\u6237\u95ee\u7b54\u8bb0\u5f55\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Tencent/ElephantBench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.28478", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8bc4\u6d4b 32 \u4e2a\u6a21\u578b\u540e\u53d1\u73b0\uff0c\u6700\u5f3a\u6a21\u578b\u4e5f\u4ec5\u5728 52.4% \u7684\u95ee\u9898\u4e0a\u80fd\u540c\u65f6\u53ec\u56de\u53cc\u65b9\u8bf4\u6cd5\uff0c\u591a\u6570\u5931\u8d25\u6848\u4f8b\u662f\u53ea\u8bb0\u5f97\u5176\u4e2d\u4e00\u4e2a\u8d26\u6237\u3002", "\u589e\u5927\u6a21\u578b\u89c4\u6a21\u548c\u589e\u52a0\u63a8\u7406\u65f6\u8ba1\u7b97\u80fd\u63d0\u5347\u53ec\u56de\u7387\uff0c\u4f46\u65e0\u6cd5\u6839\u9664\u8fd9\u79cd\u53c2\u6570\u8bb0\u5fc6\u4e2d\u7684\u201c\u4e0d\u5b8c\u6574\u6027\u201d\u3002", "\u8bed\u6599\u5206\u6790\u663e\u793a\uff0c\u66dd\u5149\u4e0d\u5e73\u8861\u4f1a\u504f\u5411\u4e3b\u6d41\u8bf4\u6cd5\uff0c\u800c\u5c11\u6570\u8bf4\u6cd5\u66dd\u5149\u8d8a\u591a\uff0c\u6a21\u578b\u8d8a\u53ef\u80fd\u5b8c\u6574\u53ec\u56de\u5206\u6b67\u77e5\u8bc6\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u8bc4\u6d4b", "\u957f\u5c3e\u77e5\u8bc6", "\u95ee\u7b54"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.28478v1", "published_at": "2026-08-28", "score": 0.491, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28478.png", "title": "Blind Men and the Elephant: Probing the Epistemic Myopia of LLMs under Long-Tail Divergent Knowledge", "tldr": "\u65b0\u57fa\u51c6\u63ed\u793aLLM\u957f\u5c3e\u5206\u6b67\u77e5\u8bc6\u76f2\u533a", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa ElephantBench\uff0c\u4e00\u4e2a\u9762\u5411\u95ed\u5377\u95ee\u7b54\u7684\u957f\u5c3e\u5206\u6b67\u77e5\u8bc6\u63a2\u9488\uff0c\u5305\u542b 1,094 \u4e2a\u591a\u7b54\u6848\u4e8b\u5b9e\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u53ef\u5ba1\u8ba1\u7684\u56fe\u6784\u5efa\u6d41\u7a0b\uff0c\u4ece\u4f4e\u66dd\u5149\u7f51\u9875\u8bed\u6599\u4e2d\u53d1\u73b0\u81ea\u7136\u5206\u6b67\uff0c\u5e76\u9a8c\u8bc1\u4e3a\u53ef\u6eaf\u6e90\u7684\u591a\u8d26\u6237\u95ee\u7b54\u8bb0\u5f55\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e8b\u5b9e\u95ee\u7b54\u4ece\u201c\u5355\u4e00\u6807\u51c6\u7b54\u6848\u201d\u6269\u5c55\u5230\u201c\u957f\u5c3e\u4e8b\u5b9e\u7684\u591a\u91cd\u8bf4\u6cd5\u201d\uff0c\u4e3a\u8bca\u65ad LLM \u7684\u8ba4\u8bc6\u8bba\u77ed\u89c6\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u57fa\u51c6\uff0c\u4e5f\u5c55\u793a\u4e86\u4ece\u957f\u5c3e\u8bed\u6599\u81ea\u52a8\u6784\u5efa\u53ef\u6eaf\u6e90\u77e5\u8bc6\u63a2\u9488\u7684\u5b9e\u7528\u6d41\u7a0b\u3002"}, {"abstract": "Due to the nature of quadratic attention, Large Language Models (LLMs) consume a lot of memory and energy. Every new token costs more than the previous one. For each additional token, the keys and values must be stored in memory indefinitely, which is unsustainable. Several alternatives have been proposed to fix the quadratic scaling problem, one of which is retrofitting LLMs to use Linear Attention. This idea has attracted a lot of attention, given its promise to solve the quadratic scaling problem with state-of-the-art performance at low cost. However, this line of research has not been properly compared to simpler baselines. In this work, we show that Sliding Window Attention (SWA) with sinks performs as well or better than post-trained Linear Attention models. We observe this across multiple LLMs on various downstream tasks. For long-context reasoning tasks (Needle-in-a-Haystack and BABILong), SWA achieves massively higher performance (2 to 10 times higher than linear attention). SWA requires no post-training, is extremely fast, and requires low memory; therefore, making it an extremely cheap and reliable solution. To reduce inference memory cost, we strongly recommend switching to SWA instead of post-training linear models. Linear attention models may have shown some promise, but they likely require to be trained from scratch or extensive post-training in order to even match SWA.", "arxiv_id": "2608.28444", "arxiv_url": "https://arxiv.org/abs/2608.28444", "authors": ["Alexia Jolicoeur-Martineau", "Rhea Sanjay Sukthanker", "Pashmina Cameron", "Emy Gervais"], "brief": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u540e\u8bad\u7ec3 Linear Attention \u4e0e\u5e26 attention sinks \u7684 Sliding Window Attention\uff08SWA\uff09\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5728\u591a\u4e2a LLM \u548c\u4e0b\u6e38\u4efb\u52a1\u4e2d\uff0cSWA \u65e0\u9700\u540e\u8bad\u7ec3\u5373\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u7ebf\u6027\u6ce8\u610f\u529b\uff0c\u5c24\u5176\u5728\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e0a\u4f18\u52bf\u660e\u663e\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28444", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["SWA with sinks \u5728\u591a\u79cd LLM \u4e0e\u4efb\u52a1\u4e0a\u8868\u73b0\u4e0d\u4f4e\u4e8e\u540e\u8bad\u7ec3 Linear Attention\u3002", "\u5728 Needle-in-a-Haystack \u548c BABILong \u7b49\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4efb\u52a1\u4e2d\uff0cSWA \u6027\u80fd\u6bd4\u7ebf\u6027\u6ce8\u610f\u529b\u9ad8 2 \u5230 10 \u500d\u3002", "SWA \u65e0\u9700\u989d\u5916\u540e\u8bad\u7ec3\uff0c\u63a8\u7406\u901f\u5ea6\u5feb\u3001\u663e\u5b58\u5360\u7528\u4f4e\uff0c\u662f\u964d\u4f4e KV \u7f13\u5b58\u6210\u672c\u7684\u7b80\u5355\u57fa\u7ebf\u3002"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2608.28444v1", "published_at": "2026-08-28", "score": 0.486, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28444.png", "title": "Sliding-window beats linear attention", "tldr": "\u6ed1\u7a97\u6ce8\u610f\u529b\u4f18\u4e8e\u540e\u8bad\u7ec3\u7ebf\u6027\u6ce8\u610f\u529b", "upvotes": 12, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u540e\u8bad\u7ec3 Linear Attention \u4e0e\u5e26 attention sinks \u7684 Sliding Window Attention\uff08SWA\uff09\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5728\u591a\u4e2a LLM \u548c\u4e0b\u6e38\u4efb\u52a1\u4e2d\uff0cSWA \u65e0\u9700\u540e\u8bad\u7ec3\u5373\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u7ebf\u6027\u6ce8\u610f\u529b\uff0c\u5c24\u5176\u5728\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e0a\u4f18\u52bf\u660e\u663e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u6539\u9020\u4e3a\u7ebf\u6027\u6ce8\u610f\u529b\u5373\u53ef\u4f4e\u6210\u672c\u89e3\u51b3\u957f\u4e0a\u4e0b\u6587\u6210\u672c\u201d\u7684\u6d41\u884c\u65b9\u5411\uff0c\u5f3a\u8c03\u7b80\u5355\u6ed1\u7a97\u673a\u5236\u5728\u5b9e\u8df5\u4e2d\u66f4\u53ef\u9760\u3001\u66f4\u4fbf\u5b9c\uff0c\u5bf9 LLM \u63a8\u7406\u4f18\u5316\u548c\u957f\u4e0a\u4e0b\u6587\u6a21\u578b\u8bbe\u8ba1\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are increasingly deployed with layered defenses, yet malicious prompts can still bypass them. Interpretability methods can expose model-internal signals along the generation path that could inform enforcement, but these signals are not security controls by themselves. Deployments that adapt them for safety typically couple each signal to its own calibration, policy logic, and intervention code, so each new artifact creates integration work instead of strengthening a shared defense. We present Language Model Security Modules (LMSM), a security framework that adapts the separation behind Linux Security Modules (LSM) to LLM serving. In LMSM, a selected security backend exposes calibrated evidence, a versioned policy evaluates active rules over trusted per-request context, and a separate gate authorizes buffered output release. This design separates mediation correctness from policy effectiveness, and it allows backend, rule, or schedule changes without rebuilding request handling or enforcement. Our prototype shows the separation working in practice: with Hugging Face Transformers and continuously batched vLLM, the same substrate hosts artifact-backed sparse autoencoder (SAE) and transcoder deployments and task-fitted dense probes, preserves request-specific decisions under scheduler churn, and selectively enforces and composes multiple rules per request. On Qwen3-4B, LMSM-Checkpoint reduces HarmBench attack success rate from 39.20% to 3.32%, with XSTest false refusals rising from 2.40% to 4.40%, while retaining 98.14% of the throughput of a matched serving path that performs no monitoring work at 32 active sequences. LMSM gives advances in interpretability and model-internal analysis a common path to runtime enforcement.", "arxiv_id": "2608.25697", "arxiv_url": "https://arxiv.org/abs/2608.25697", "authors": ["XiuYu Zhang", "Bonan Ruan", "Junfeng Fang", "An Zhang", "Tat-Seng Chua", "Zhenkai Liang"], "brief": "\u8bba\u6587\u63d0\u51fa Language Model Security Modules\uff08LMSM\uff09\uff0c\u5c06 Linux Security Modules \u7684\u201c\u673a\u5236\u4e0e\u7b56\u7565\u5206\u79bb\u201d\u601d\u60f3\u7528\u4e8e LLM \u63a8\u7406\u670d\u52a1\u3002\u5b83\u628a\u6a21\u578b\u5185\u90e8\u53ef\u89e3\u91ca\u6027\u4fe1\u53f7\u3001\u7248\u672c\u5316\u5b89\u5168\u7b56\u7565\u548c\u8f93\u51fa\u653e\u884c\u7f51\u5173\u89e3\u8026\uff0c\u5f62\u6210\u53ef\u63d2\u62d4\u7684\u8fd0\u884c\u65f6\u5b89\u5168 enforcement \u6846\u67b6\u3002", "categories": ["cs.CR"], "github_repo": "https://github.com/xiuyuz/LMSM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25697", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u652f\u6301\u5c06 SAE\u3001transcoder\u3001dense probe \u7b49\u6a21\u578b\u5185\u90e8\u76d1\u6d4b\u4fe1\u53f7\u4f5c\u4e3a\u540e\u7aef\u5b89\u5168\u8bc1\u636e\u63a5\u5165\u7edf\u4e00\u6846\u67b6", "\u5728 Hugging Face Transformers \u4e0e\u8fde\u7eed\u6279\u5904\u7406 vLLM \u4e0a\u5b9e\u73b0\u539f\u578b\uff0c\u53ef\u5728\u8c03\u5ea6\u53d8\u5316\u4e0b\u4fdd\u6301\u9010\u8bf7\u6c42\u5b89\u5168\u51b3\u7b56\u4e00\u81f4", "\u5728 Qwen3-4B \u4e0a\u5c06 HarmBench \u653b\u51fb\u6210\u529f\u7387\u4ece 39.20% \u964d\u81f3 3.32%\uff0cXSTest \u8bef\u62d2\u7387\u4ece 2.40% \u5347\u81f3 4.40%\uff0c32 \u6d3b\u8dc3\u5e8f\u5217\u4e0b\u4ecd\u4fdd\u7559 98.14% \u541e\u5410"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027", "\u63a8\u7406\u670d\u52a1", "\u5b89\u5168\u6846\u67b6"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2608.25697v1", "published_at": "2026-08-26", "score": 0.443, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25697.png", "title": "LMSM: LLM Security Framework Inspired by Linux Security Modules", "tldr": "\u501f\u9274LSM\u6784\u5efaLLM\u8fd0\u884c\u65f6\u5b89\u5168\u6a21\u5757\u6846\u67b6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Language Model Security Modules\uff08LMSM\uff09\uff0c\u5c06 Linux Security Modules \u7684\u201c\u673a\u5236\u4e0e\u7b56\u7565\u5206\u79bb\u201d\u601d\u60f3\u7528\u4e8e LLM \u63a8\u7406\u670d\u52a1\u3002\u5b83\u628a\u6a21\u578b\u5185\u90e8\u53ef\u89e3\u91ca\u6027\u4fe1\u53f7\u3001\u7248\u672c\u5316\u5b89\u5168\u7b56\u7565\u548c\u8f93\u51fa\u653e\u884c\u7f51\u5173\u89e3\u8026\uff0c\u5f62\u6210\u53ef\u63d2\u62d4\u7684\u8fd0\u884c\u65f6\u5b89\u5168 enforcement \u6846\u67b6\u3002", "why_notable": "\u5b83\u4e3a\u53ef\u89e3\u91ca\u6027\u4e0e\u6a21\u578b\u5185\u90e8\u5206\u6790\u6210\u679c\u63d0\u4f9b\u4e86\u901a\u7528\u7684\u8fd0\u884c\u65f6\u5b89\u5168\u843d\u5730\u8def\u5f84\uff0c\u907f\u514d\u6bcf\u4e2a\u68c0\u6d4b\u4fe1\u53f7\u90fd\u5355\u72ec\u5f00\u53d1\u6821\u51c6\u3001\u7b56\u7565\u548c\u62e6\u622a\u903b\u8f91\uff0c\u6709\u671b\u63d0\u5347 LLM \u90e8\u7f72\u9632\u62a4\u7684\u53ef\u7ec4\u5408\u6027\u548c\u5de5\u7a0b\u53ef\u7ef4\u62a4\u6027\u3002"}, {"abstract": "LLM agents increasingly modify their own prompts, tools, middleware, resources, and execution harnesses at runtime. Such self-evolution can improve capability, but a successful mutation may leave persistent effects that cannot be safely reversed in states different from the one in which it was created. We introduce EvoUndo, a framework for representing, synthesizing, diagnosing, and independently verifying recoverability of model-generated self-modifications across counterfactual states. Across 600 unseen one-shot self-evolution tasks, we identify 197 capability-improving mutations that fail recoverability verification. Under the original recovery representation, conventional repair strategies recover 0/197 of these natural failures. Deterministic oracle analysis recovers 48/197 under the original recovery language L0, while the extended recovery calculus increases empirical oracle recovery to 191/197. A protocol-locked 2x2 grounding-by-expressivity intervention then separates two bottlenecks: exact state-address grounding increases successful recovery from 0/48 to 38/48 (79.2%) when the original language is sufficient, while extending the recovery language enables recovery on 142/143 (99.3%) failures in the oracle-defined S1 stratum. On the primary gpt-oss-120b backbone, adding exact-address diagnostics to the richer language reduces recovery to 133/143 (93.0%); a Qwen3.8-27B replication preserves the grounding and expressivity effects but not this negative interaction, indicating that the latter is model-dependent. These results indicate that reliable agent self-evolution requires co-designing verification, state grounding, witness semantics, and recovery-language expressivity rather than relying on iterative prompting alone.", "arxiv_id": "2608.28363", "arxiv_url": "https://arxiv.org/abs/2608.28363", "authors": ["Tanmay Sah", "Dolly Sah", "Harshul Jain", "Tanya Sah"], "brief": "\u8bba\u6587\u63d0\u51fa EvoUndo\uff0c\u7528\u4e8e\u8868\u793a\u3001\u5408\u6210\u3001\u8bca\u65ad\u5e76\u72ec\u7acb\u9a8c\u8bc1 LLM \u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u81ea\u6211\u4fee\u6539\u7684\u53ef\u6062\u590d\u6027\u3002\u5b83\u5173\u6ce8\u81ea\u6f14\u5316\u4fee\u6539\u5728\u53cd\u4e8b\u5b9e\u72b6\u6001\u4e0b\u662f\u5426\u4ecd\u80fd\u5b89\u5168\u64a4\u9500\uff0c\u800c\u4e0d\u53ea\u662f\u5f53\u524d\u72b6\u6001\u4e0b\u662f\u5426\u6709\u6548\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28363", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728600\u4e2a\u672a\u89c1\u8fc7\u7684\u4e00\u6b21\u6027\u81ea\u6f14\u5316\u4efb\u52a1\u4e2d\uff0c\u53d1\u73b0197\u4e2a\u63d0\u5347\u80fd\u529b\u4f46\u65e0\u6cd5\u901a\u8fc7\u53ef\u6062\u590d\u6027\u9a8c\u8bc1\u7684\u81ea\u7136\u5931\u8d25\u6848\u4f8b\u3002", "\u4f20\u7edf\u4fee\u590d\u7b56\u7565\u5728\u539f\u59cb\u6062\u590d\u8868\u793a\u4e0b\u5bf9197\u4e2a\u5931\u8d25\u6848\u4f8b\u6062\u590d\u7387\u4e3a0\uff1b\u6269\u5c55\u6062\u590d\u6f14\u7b97\u540e\uff0coracle\u6062\u590d\u7387\u4ece48/197\u63d0\u5347\u5230191/197\u3002", "\u5b9e\u9a8c\u8868\u660e\u7cbe\u786e\u72b6\u6001\u5730\u5740 grounding \u4e0e\u66f4\u5f3a\u6062\u590d\u8bed\u8a00\u5206\u522b\u89e3\u51b3\u4e0d\u540c\u74f6\u9888\uff0c\u4f46\u90e8\u5206\u8d1f\u4ea4\u4e92\u5177\u6709\u6a21\u578b\u4f9d\u8d56\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u6211\u8fdb\u5316", "\u5f62\u5f0f\u9a8c\u8bc1", "\u5b89\u5168\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28363v1", "published_at": "2026-08-28", "score": 0.404, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28363.png", "title": "EvoUndo: Recoverability-Constrained Self-Evolution for LLM Agent Harnesses", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u81ea\u6211\u4fee\u6539\u540e\u53ef\u9a8c\u8bc1\u56de\u6eda", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa EvoUndo\uff0c\u7528\u4e8e\u8868\u793a\u3001\u5408\u6210\u3001\u8bca\u65ad\u5e76\u72ec\u7acb\u9a8c\u8bc1 LLM \u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u81ea\u6211\u4fee\u6539\u7684\u53ef\u6062\u590d\u6027\u3002\u5b83\u5173\u6ce8\u81ea\u6f14\u5316\u4fee\u6539\u5728\u53cd\u4e8b\u5b9e\u72b6\u6001\u4e0b\u662f\u5426\u4ecd\u80fd\u5b89\u5168\u64a4\u9500\uff0c\u800c\u4e0d\u53ea\u662f\u5f53\u524d\u72b6\u6001\u4e0b\u662f\u5426\u6709\u6548\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u6307\u51fa\uff0cLLM\u667a\u80fd\u4f53\u82e5\u80fd\u81ea\u6211\u4fee\u6539\u63d0\u793a\u8bcd\u3001\u5de5\u5177\u548c\u6267\u884c\u6846\u67b6\uff0c\u4ec5\u9760\u8fed\u4ee3\u63d0\u793a\u4fee\u8865\u5e76\u4e0d\u5b89\u5168\uff1b\u5fc5\u987b\u540c\u65f6\u8bbe\u8ba1\u9a8c\u8bc1\u673a\u5236\u3001\u72b6\u6001\u5b9a\u4f4d\u3001\u89c1\u8bc1\u8bed\u4e49\u548c\u53ef\u8868\u8fbe\u7684\u6062\u590d\u8bed\u8a00\uff0c\u5bf9\u6784\u5efa\u53ef\u63a7\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u6709\u91cd\u8981\u610f\u4e49\u3002"}, {"abstract": "Scaling robot data is crucial for building generalist Vision-Language-Action (VLA) models, yet robot trajectories are harder to scale than web-scale image-text data because embodied collection is costly and sparsely covers the physical world. This makes representation quality a central bottleneck: under a fixed robot-data budget, continued pre-training must turn limited trajectories into transferable visual-action knowledge rather than merely fit actions. We propose VLAct, a VLA-oriented VLM backbone trained on broad, heterogeneous, multi-embodiment robot data before task-specific fine-tuning. VLAct preserves the broad VLM prior and encourages shared action semantics across embodiments through VLM-prior preservation, multi-head continuous action co-supervision, and a partially unified cross-embodiment action layout, while allowing task-specific action heads during fine-tuning. Across simulation, real-world, and unseen-embodiment transfer, VLAct consistently improves downstream performance under fixed fine-tuning protocols. On LIBERO-Plus and RoboTwin 2.0, VLAct surpasses industrial VLA systems including ABot-M0 and LingBot-VLA, achieving success rates of 82.6% and 92.5%. On RoboDojo, VLAct ranks sixth among all policies by success rate and outperforms all explicitly designated world-action model (WAM) entries on both metrics. Most notably, on RoboCasa-GR1, an unseen humanoid embodiment, VLAct using only 20% of downstream trajectories outperforms the full-data GR00T-N1.6 baseline. These results are obtained using fully open-source data and only a 16-GPU training setup, showing that representation-centric continued pre-training can deliver highly competitive performance under a modest compute budget and is an important independent axis of VLA progress beyond data scaling.", "arxiv_id": "2608.27550", "arxiv_url": "https://arxiv.org/abs/2608.27550", "authors": ["Senqiao Yang", "Chengyao Wang", "Yuxin Chen", "Zixuan Wang", "Longxiang Tang", "Haokun Gui", "Jinhui Ye", "Changsheng Lu", "Xiaoyang Wu", "Mingkang Zhu", "Pengguang Chen", "Shu Liu", "Zhuotao Tian", "Hengshuang Zhao", "Bei Yu", "Jiaya Jia"], "brief": "\u8bba\u6587\u63d0\u51faVLAct\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684VLM\u9aa8\u5e72\uff0c\u5728\u591a\u6765\u6e90\u3001\u591a\u672c\u4f53\u673a\u5668\u4eba\u6570\u636e\u4e0a\u8fdb\u884c\u6301\u7eed\u9884\u8bad\u7ec3\uff0c\u518d\u7528\u4e8e\u4e0b\u6e38\u4efb\u52a1\u5fae\u8c03\u3002\u5176\u6838\u5fc3\u4e0d\u662f\u5355\u7eaf\u6269\u5927\u673a\u5668\u4eba\u6570\u636e\uff0c\u800c\u662f\u5728\u56fa\u5b9a\u6570\u636e\u9884\u7b97\u4e0b\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89c6\u89c9-\u52a8\u4f5c\u8868\u5f81\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/starVLA/starVLA", "github_stars": 3559, "hf_url": "https://huggingface.co/papers/2608.27550", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u4fdd\u7559VLM\u5148\u9a8c\u3001\u591a\u5934\u8fde\u7eed\u52a8\u4f5c\u534f\u540c\u76d1\u7763\u548c\u90e8\u5206\u7edf\u4e00\u7684\u8de8\u672c\u4f53\u52a8\u4f5c\u5e03\u5c40\uff0c\u4fc3\u8fdb\u4e0d\u540c\u673a\u5668\u4eba\u672c\u4f53\u95f4\u5171\u4eab\u52a8\u4f5c\u8bed\u4e49\u3002", "\u5728LIBERO-Plus\u548cRoboTwin 2.0\u4e0a\u5206\u522b\u8fbe\u523082.6%\u548c92.5%\u6210\u529f\u7387\uff0c\u8d85\u8fc7ABot-M0\u3001LingBot-VLA\u7b49\u5de5\u4e1a\u7ea7VLA\u7cfb\u7edf\u3002", "\u5728\u672a\u89c1\u8fc7\u7684\u4eba\u5f62\u672c\u4f53RoboCasa-GR1\u4e0a\uff0c\u4ec5\u752820%\u4e0b\u6e38\u8f68\u8ff9\u6570\u636e\u5c31\u8d85\u8fc7\u5168\u91cf\u6570\u636e\u8bad\u7ec3\u7684GR00T-N1.6\u57fa\u7ebf\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba", "\u8868\u5f81\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Star Vision Language Action Models", "pdf_url": "https://arxiv.org/pdf/2608.27550v1", "published_at": "2026-08-27", "score": 0.392, "selected_reasons": ["HF trending (78\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27550.png", "title": "Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models", "tldr": "VLAct\u4ee5\u8868\u5f81\u4e2d\u5fc3\u9884\u8bad\u7ec3\u63d0\u5347VLA\u6cdb\u5316", "upvotes": 78, "what_it_is": "\u8bba\u6587\u63d0\u51faVLAct\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684VLM\u9aa8\u5e72\uff0c\u5728\u591a\u6765\u6e90\u3001\u591a\u672c\u4f53\u673a\u5668\u4eba\u6570\u636e\u4e0a\u8fdb\u884c\u6301\u7eed\u9884\u8bad\u7ec3\uff0c\u518d\u7528\u4e8e\u4e0b\u6e38\u4efb\u52a1\u5fae\u8c03\u3002\u5176\u6838\u5fc3\u4e0d\u662f\u5355\u7eaf\u6269\u5927\u673a\u5668\u4eba\u6570\u636e\uff0c\u800c\u662f\u5728\u56fa\u5b9a\u6570\u636e\u9884\u7b97\u4e0b\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89c6\u89c9-\u52a8\u4f5c\u8868\u5f81\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u201c\u8868\u5f81\u8d28\u91cf\u201d\u662fVLA\u8fdb\u5c55\u4e2d\u72ec\u7acb\u4e8e\u6570\u636e\u89c4\u6a21\u7684\u91cd\u8981\u8f74\u7ebf\uff0c\u5c55\u793a\u4e86\u5f00\u6e90\u6570\u636e\u4e0e16\u5361\u8bad\u7ec3\u6761\u4ef6\u4e0b\u4e5f\u80fd\u53d6\u5f97\u63a5\u8fd1\u6216\u8d85\u8fc7\u5de5\u4e1a\u7cfb\u7edf\u7684\u6cdb\u5316\u80fd\u529b\uff0c\u5c24\u5176\u5bf9\u591a\u672c\u4f53\u8fc1\u79fb\u548c\u4f4e\u6570\u636e\u673a\u5668\u4eba\u5b66\u4e60\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Loop Engineering is emerging as a practice for organizing development work around coding agents. Instead of writing each prompt by hand, practitioners design loops that monitor progress, assign work, run checks, and decide what the agent should do next. Even with a capable coding agent, a loop may trust a stale progress note, skip needed verification, spend its budget in the wrong direction, or stop before the task is safe to submit. Yet the final outcome of one end-to-end run cannot tell whether success or failure reflects the loop\u0027s guidance or the coding agent\u0027s ability to carry out the task. We introduce LoopArena, a benchmark for evaluating how well one model can guide a separate coding agent through a long-running task. The model under evaluation is the \\textbf{Controller}: after each coding round, it receives a structured summary of the run and instructs a separate, fixed coding agent, the \\textbf{Worker}, on what to do or verify next, or decides whether to stop. LoopArena evaluates this ability in three complementary settings that differ in execution scope and cost. Type I scores next-step Loop Contract selection through execution-validated questions without running the Worker at evaluation time. Type II executes repeated control over a selected slice of a full task, while Type III evaluates the paired full task from its original state. On full tasks, the best observed Strict Success Rate is \\textbf{24.69\\%}, leaving substantial room for improvement in long-horizon loop control. Across Controllers, the paired reduction in estimated inference cost averages \\textbf{64.4\\%}, and Type II produces a similar ordering under the main Core criterion (Spearman\u0027s \\(\u03c1=\\textbf{0.9747}\\)). We release the benchmark data and evaluation code at https://github.com/AMAP-ML/LoopArena .", "arxiv_id": "2608.28281", "arxiv_url": "https://arxiv.org/abs/2608.28281", "authors": ["Yi Wang", "Haopeng Zhang", "Chengxiang Huang", "Rui Dai", "Kaikui Liu", "Piotr Koniusz", "Xiangxiang Chu"], "brief": "\u8bba\u6587\u63d0\u51fa LoopArena\uff0c\u4e00\u4e2a\u9762\u5411 Loop Engineering \u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u4e00\u4e2a\u6a21\u578b\u4f5c\u4e3a Controller \u5982\u4f55\u6307\u5bfc\u56fa\u5b9a\u7684\u7f16\u7801\u667a\u80fd\u4f53 Worker \u5b8c\u6210\u957f\u65f6\u95f4\u7f16\u7a0b\u4efb\u52a1\u3002\u5b83\u5c06\u201c\u63a7\u5236\u5faa\u73af\u8d28\u91cf\u201d\u4e0e\u201c\u7f16\u7801\u6267\u884c\u80fd\u529b\u201d\u89e3\u8026\uff0c\u8003\u5bdf\u4f55\u65f6\u5206\u914d\u5de5\u4f5c\u3001\u9a8c\u8bc1\u3001\u8c03\u6574\u65b9\u5411\u6216\u505c\u6b62\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/AMAP-ML/LoopArena", "github_stars": 70, "hf_url": "https://huggingface.co/papers/2608.28281", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bbe\u8ba1\u4e09\u7c7b\u8bc4\u6d4b\uff1aType I \u7528\u6267\u884c\u9a8c\u8bc1\u95ee\u9898\u8bc4\u4f30\u4e0b\u4e00\u6b65 Loop Contract \u9009\u62e9\uff1bType II \u5728\u4efb\u52a1\u5207\u7247\u4e2d\u53cd\u590d\u6267\u884c\u63a7\u5236\uff1bType III \u4ece\u539f\u59cb\u72b6\u6001\u8bc4\u4f30\u5b8c\u6574\u4efb\u52a1\u3002", "\u5b8c\u6574\u4efb\u52a1\u4e0a\u6700\u4f73 Strict Success Rate \u4ec5\u4e3a 24.69%\uff0c\u663e\u793a\u5f53\u524d\u6a21\u578b\u5728\u957f\u7a0b\u5faa\u73af\u63a7\u5236\u4e0a\u4ecd\u6709\u660e\u663e\u4e0d\u8db3\u3002", "\u4e0d\u540c Controller \u5e73\u5747\u53ef\u964d\u4f4e\u7ea6 64.4% \u63a8\u7406\u6210\u672c\uff1bType II \u4e0e\u5b8c\u6574\u4efb\u52a1\u6392\u5e8f\u9ad8\u5ea6\u4e00\u81f4\uff0cSpearman \u03c1=0.9747\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 3, "on_hf": true, "organization": "AMAP-ML", "pdf_url": "https://arxiv.org/pdf/2608.28281v1", "published_at": "2026-08-28", "score": 0.364, "selected_reasons": ["HF trending (91\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28281.png", "title": "LoopArena: Benchmarking Models as Runtime Controllers for Loop Engineering", "tldr": "\u8bc4\u6d4b\u6a21\u578b\u8c03\u5ea6\u7f16\u7801\u667a\u80fd\u4f53\u7684\u957f\u7a0b\u63a7\u5236\u80fd\u529b", "upvotes": 91, "what_it_is": "\u8bba\u6587\u63d0\u51fa LoopArena\uff0c\u4e00\u4e2a\u9762\u5411 Loop Engineering \u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u4e00\u4e2a\u6a21\u578b\u4f5c\u4e3a Controller \u5982\u4f55\u6307\u5bfc\u56fa\u5b9a\u7684\u7f16\u7801\u667a\u80fd\u4f53 Worker \u5b8c\u6210\u957f\u65f6\u95f4\u7f16\u7a0b\u4efb\u52a1\u3002\u5b83\u5c06\u201c\u63a7\u5236\u5faa\u73af\u8d28\u91cf\u201d\u4e0e\u201c\u7f16\u7801\u6267\u884c\u80fd\u529b\u201d\u89e3\u8026\uff0c\u8003\u5bdf\u4f55\u65f6\u5206\u914d\u5de5\u4f5c\u3001\u9a8c\u8bc1\u3001\u8c03\u6574\u65b9\u5411\u6216\u505c\u6b62\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7f16\u7801\u667a\u80fd\u4f53\u5b9e\u8df5\u4e2d\u5173\u952e\u4f46\u96be\u4ee5\u8861\u91cf\u7684\u201c\u8fd0\u884c\u65f6\u63a7\u5236/\u5de5\u7a0b\u5faa\u73af\u8bbe\u8ba1\u201d\u5355\u72ec\u62bd\u8c61\u51fa\u6765\u8bc4\u6d4b\uff0c\u6709\u52a9\u4e8e\u8bca\u65ad\u957f\u7a0b\u8f6f\u4ef6\u5f00\u53d1\u4efb\u52a1\u5931\u8d25\u7a76\u7adf\u6765\u81ea\u63a7\u5236\u7b56\u7565\u8fd8\u662f\u6267\u884c\u667a\u80fd\u4f53\u80fd\u529b\uff0c\u5e76\u4e3a\u4f4e\u6210\u672c\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u8c03\u5ea6\u6a21\u578b\u63d0\u4f9b\u5de5\u5177\u3002"}, {"abstract": "Self-evolving language models have recently emerged as a promising path toward superintelligence, with the advantage of reducing the cost of human supervision. While considerable progress has been made in verifiable domains, self-evolution in unverifiable domains remains substantially less explored. We propose Judge co-adaptation from Zero data (J-Zero), a unified Challenger--Solver--Judge co-evolution framework that supports self-improvement across both domains. The Challenger and Solver co-evolve through an adversarial interaction: the Challenger generates increasingly difficult tasks, while the Solver learns to produce higher-quality responses to them. In parallel, the Judge co-adapts using preference pairs whose ordering is known in advance from how each response was produced, i.e., the Solver\u0027s answer over the Challenger\u0027s, and its decomposed-and-recombined answer over its one-shot answer, rather than from the Judge\u0027s own scores. J-Zero outperforms the baselines by an average of 4.2 points on verifiable and 8.0 points on unverifiable domains, and continues to improve through at least ten iterations, whereas the baselines degrade after two.", "arxiv_id": "2608.26582", "arxiv_url": "https://arxiv.org/abs/2608.26582", "authors": ["Gyouk Chu", "Myeongho Jeon", "Eunho Yang"], "brief": "\u8bba\u6587\u63d0\u51fa J-Zero\uff0c\u4e00\u4e2a\u4ece\u96f6\u6570\u636e\u51fa\u53d1\u7684 Challenger--Solver--Judge \u7edf\u4e00\u5171\u8fdb\u5316\u6846\u67b6\u3002\u5b83\u8ba9\u6311\u6218\u8005\u751f\u6210\u66f4\u96be\u4efb\u52a1\u3001\u6c42\u89e3\u8005\u63d0\u5347\u56de\u7b54\u8d28\u91cf\u3001\u88c1\u5224\u57fa\u4e8e\u9884\u8bbe\u504f\u597d\u5bf9\u540c\u6b65\u9002\u5e94\uff0c\u652f\u6301\u53ef\u9a8c\u8bc1\u4e0e\u4e0d\u53ef\u9a8c\u8bc1\u9886\u57df\u7684\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/GyoukChu/J-Zero", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.26582", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Challenger \u4e0e Solver \u901a\u8fc7\u5bf9\u6297\u4ea4\u4e92\u5171\u540c\u8fdb\u5316\uff1a\u524d\u8005\u4e0d\u65ad\u751f\u6210\u66f4\u96be\u4efb\u52a1\uff0c\u540e\u8005\u5b66\u4e60\u7ed9\u51fa\u66f4\u9ad8\u8d28\u91cf\u56de\u7b54\u3002", "Judge \u4e0d\u4f9d\u8d56\u81ea\u8eab\u6253\u5206\u6784\u9020\u76d1\u7763\uff0c\u800c\u662f\u5229\u7528\u751f\u6210\u8fc7\u7a0b\u5929\u7136\u786e\u5b9a\u7684\u504f\u597d\u5bf9\u8fdb\u884c\u8bad\u7ec3\uff0c\u5982 Solver \u7b54\u6848\u4f18\u4e8e Challenger \u7b54\u6848\u3001\u5206\u89e3\u91cd\u7ec4\u7b54\u6848\u4f18\u4e8e\u4e00\u6b21\u6027\u7b54\u6848\u3002", "\u5728\u53ef\u9a8c\u8bc1\u9886\u57df\u5e73\u5747\u4f18\u4e8e\u57fa\u7ebf 4.2 \u5206\uff0c\u5728\u4e0d\u53ef\u9a8c\u8bc1\u9886\u57df\u4f18\u4e8e 8.0 \u5206\uff0c\u5e76\u80fd\u6301\u7eed\u6539\u8fdb\u81f3\u5c11 10 \u8f6e\uff0c\u800c\u57fa\u7ebf\u7ea6 2 \u8f6e\u540e\u9000\u5316\u3002"], "keywords": ["\u81ea\u8fdb\u5316", "\u8bed\u8a00\u6a21\u578b", "\u504f\u597d\u5b66\u4e60", "\u5bf9\u6297\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2608.26582v1", "published_at": "2026-08-27", "score": 0.31, "selected_reasons": ["HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26582.png", "title": "J-Zero: Unified Challenger--Solver--Judge Co-Evolution from Zero Data", "tldr": "J-Zero\u5b9e\u73b0\u96f6\u6570\u636e\u8bed\u8a00\u6a21\u578b\u81ea\u8fdb\u5316", "upvotes": 35, "what_it_is": "\u8bba\u6587\u63d0\u51fa J-Zero\uff0c\u4e00\u4e2a\u4ece\u96f6\u6570\u636e\u51fa\u53d1\u7684 Challenger--Solver--Judge \u7edf\u4e00\u5171\u8fdb\u5316\u6846\u67b6\u3002\u5b83\u8ba9\u6311\u6218\u8005\u751f\u6210\u66f4\u96be\u4efb\u52a1\u3001\u6c42\u89e3\u8005\u63d0\u5347\u56de\u7b54\u8d28\u91cf\u3001\u88c1\u5224\u57fa\u4e8e\u9884\u8bbe\u504f\u597d\u5bf9\u540c\u6b65\u9002\u5e94\uff0c\u652f\u6301\u53ef\u9a8c\u8bc1\u4e0e\u4e0d\u53ef\u9a8c\u8bc1\u9886\u57df\u7684\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u81ea\u8fdb\u5316\u8bed\u8a00\u6a21\u578b\u4ece\u53ef\u9a8c\u8bc1\u4efb\u52a1\u6269\u5c55\u5230\u66f4\u96be\u76d1\u7763\u7684\u4e0d\u53ef\u9a8c\u8bc1\u9886\u57df\uff0c\u5e76\u901a\u8fc7\u88c1\u5224\u5171\u9002\u5e94\u7f13\u89e3\u81ea\u6211\u8bc4\u4f30\u504f\u5dee\u95ee\u9898\uff0c\u5bf9\u964d\u4f4e\u4eba\u5de5\u76d1\u7763\u6210\u672c\u548c\u63d0\u5347\u6a21\u578b\u6301\u7eed\u5b66\u4e60\u80fd\u529b\u5177\u6709\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "Spatio-temporal video grounding (STVG) requires models to identify when a referred event occurs and localize the target entity throughout that interval. Existing multimodal large language models typically serialize dense localization trajectories autoregressively, causing decoding latency to grow with tube length and allowing localization errors to propagate across time. We introduce Parallel Tube Decoding (PTD), a generative formulation that decomposes grounding into a temporal block followed by time-conditioned spatial blocks decoded simultaneously. This removes both token-level and trajectory-level dependencies, reducing the sequential decoding depth to a fixed $1 + 1$ rounds, independent of tube length. To enable parallel spatial generation, we introduce Decoupled Block Attention, which preserves access to shared video-query context while eliminating cross-box dependencies, together with localization-aware policy optimization for temporal boundaries and spatial geometry. On VidSTG, PTD reduces Tube Completion Latency by 79x and increases spatial decoding throughput by 92x over standard autoregressive decoding, while also improving grounding accuracy. With a compact 4B backbone, our model performs favorably well on VidSTG and HC-STVG, and generalizes zero-shot to temporal grounding, grounded VideoQA, and referring video object tracking. Our results show parallel tube generation is an efficient and effective alternative to autoregressive localization in videos.", "arxiv_id": "2608.28192", "arxiv_url": "https://arxiv.org/abs/2608.28192", "authors": ["Hanoona Rasheed", "Haania Siddiqui", "Ming-Hsuan Yang", "Fahad Shahbaz Khan", "Salman Khan"], "brief": "\u8bba\u6587\u63d0\u51fa Parallel Tube Decoding\uff08PTD\uff09\uff0c\u5c06\u65f6\u7a7a\u89c6\u9891\u5b9a\u4f4d\u62c6\u4e3a\u65f6\u95f4\u8fb9\u754c\u751f\u6210\u4e0e\u6761\u4ef6\u5316\u7a7a\u95f4\u6846\u5e76\u884c\u751f\u6210\u3002\u8be5\u65b9\u6cd5\u907f\u514d\u81ea\u56de\u5f52\u9010\u5e27\u8f93\u51fa\u8f68\u8ff9\uff0c\u663e\u8457\u964d\u4f4e\u957f\u89c6\u9891\u76ee\u6807\u7ba1\u9053\u7684\u89e3\u7801\u5ef6\u8fdf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mbzuai-oryx/ParallelTubeDecoding", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2608.28192", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["PTD \u5c06\u987a\u5e8f\u89e3\u7801\u6df1\u5ea6\u56fa\u5b9a\u4e3a 1+1 \u8f6e\uff0c\u4e0d\u968f tube \u957f\u5ea6\u589e\u957f\uff0c\u6d88\u9664 token \u7ea7\u548c\u8f68\u8ff9\u7ea7\u4f9d\u8d56\u3002", "\u63d0\u51fa Decoupled Block Attention\uff0c\u5728\u4fdd\u7559\u5171\u4eab\u89c6\u9891-\u6587\u672c\u4e0a\u4e0b\u6587\u7684\u540c\u65f6\u53bb\u9664\u6846\u4e4b\u95f4\u7684\u4ea4\u53c9\u4f9d\u8d56\uff0c\u652f\u6301\u5e76\u884c\u7a7a\u95f4\u751f\u6210\u3002", "\u5728 VidSTG \u4e0a Tube Completion Latency \u964d\u4f4e 79 \u500d\u3001\u7a7a\u95f4\u89e3\u7801\u541e\u5410\u63d0\u5347 92 \u500d\uff0c\u5e76\u63d0\u5347\u5b9a\u4f4d\u7cbe\u5ea6\uff1b4B \u6a21\u578b\u8fd8\u53ef\u96f6\u6837\u672c\u6cdb\u5316\u5230\u65f6\u5e8f\u5b9a\u4f4d\u3001Grounded VideoQA \u548c\u89c6\u9891\u76ee\u6807\u8ddf\u8e2a\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u65f6\u7a7a\u5b9a\u4f4d", "\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2608.28192v1", "published_at": "2026-08-28", "score": 0.304, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28192.png", "title": "Locate Anything in Videos: Rethinking Efficient Generative Spatio-Temporal Video Grounding", "tldr": "\u5e76\u884c\u751f\u6210\u89c6\u9891\u76ee\u6807\u65f6\u7a7a\u8f68\u8ff9\uff0c\u5feb\u4e14\u51c6", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa Parallel Tube Decoding\uff08PTD\uff09\uff0c\u5c06\u65f6\u7a7a\u89c6\u9891\u5b9a\u4f4d\u62c6\u4e3a\u65f6\u95f4\u8fb9\u754c\u751f\u6210\u4e0e\u6761\u4ef6\u5316\u7a7a\u95f4\u6846\u5e76\u884c\u751f\u6210\u3002\u8be5\u65b9\u6cd5\u907f\u514d\u81ea\u56de\u5f52\u9010\u5e27\u8f93\u51fa\u8f68\u8ff9\uff0c\u663e\u8457\u964d\u4f4e\u957f\u89c6\u9891\u76ee\u6807\u7ba1\u9053\u7684\u89e3\u7801\u5ef6\u8fdf\u3002", "why_notable": "\u5b83\u91cd\u65b0\u8bbe\u8ba1\u4e86\u751f\u6210\u5f0f\u89c6\u9891\u65f6\u7a7a\u5b9a\u4f4d\u8303\u5f0f\uff0c\u89e3\u51b3\u81ea\u56de\u5f52\u8f68\u8ff9\u751f\u6210\u6162\u4e14\u8bef\u5dee\u7d2f\u79ef\u7684\u95ee\u9898\uff0c\u5728\u6548\u7387\u548c\u7cbe\u5ea6\u4e0a\u540c\u65f6\u53d6\u5f97\u663e\u8457\u63d0\u5347\uff0c\u5bf9\u957f\u89c6\u9891\u7406\u89e3\u548c\u89c6\u9891\u76ee\u6807\u5b9a\u4f4d\u5e94\u7528\u5f88\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recurrent fast-weight memories and selective state-space models compress an expanding context into a fixed-size recurrent state, making the state transition an online learning rule. We study this rule under read-after-write autoregressive semantics. For the prefix-prediction objective considered here, the local fast-memory example revealed at step $t$ is the prefix-aligned pair $(\\mathbf{x}_t,\\mathbf{y}_t)=(\u03c6(\\mathbf{k}_{t-1}),\\mathbf{v}_t)$. The common same-step association $(\u03c6(\\mathbf{k}_t),\\mathbf{v}_t)$ remains causal, but optimizes a different internal objective. We derive normalized first-order updates for squared-error regression and negative inner-product objectives. The regression family comprises Falcon-1 (a scalar NLMS update), Falcon-2 (its per-column extension), and Falcon-3 (a sliding-window mini-batch update); Falcon-1A/Falcon-2A/Falcon-3A are the corresponding inner-product variants. We provide recurrent, masked-parallel, and chunk-parallel forms, together with numerically stable positive-decay renormalization. Representative variants remain competitive in language modeling and improve length extrapolation on variable-digit addition. This framework separates temporal alignment, plasticity, forgetting, and bounded rehearsal in recurrent sequence models.", "arxiv_id": "2608.27763", "arxiv_url": "https://arxiv.org/abs/2608.27763", "authors": ["Yifan Zhang", "Steve Ta", "Jasper Zhang", "Jichen Feng", "Shuzhen Li", "Yongxin Zhang", "Yifeng Liu", "Huizhuo Yuan", "Mengdi Wang", "Quanquan Gu", "Andrew Chi-Chih Yao"], "brief": "\u8bba\u6587\u4ece\u8bfb\u540e\u5199\u7684\u81ea\u56de\u5f52\u8bed\u4e49\u51fa\u53d1\uff0c\u91cd\u65b0\u5206\u6790\u5feb\u6743\u91cd\u8bb0\u5fc6\u548c\u9009\u62e9\u6027\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u4e2d\u7684\u72b6\u6001\u66f4\u65b0\u89c4\u5219\u3002\u4f5c\u8005\u63a8\u5bfc\u4e86\u4e00\u7cfb\u5217\u5f52\u4e00\u5316\u4e00\u9636\u5728\u7ebf\u66f4\u65b0\u65b9\u6cd5\uff0c\u5e76\u63d0\u51fa Falcon-1/2/3 \u53ca\u5176\u5185\u79ef\u53d8\u4f53\uff0c\u7528\u4e8e\u56fa\u5b9a\u5927\u5c0f\u9012\u5f52\u72b6\u6001\u4e2d\u7684\u6301\u7eed\u5e8f\u5217\u5b66\u4e60\u3002", "categories": ["cs.LG", "cs.CL", "stat.ML"], "github_repo": "https://github.com/yifanzhang-pro/fast-weight-attention", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2608.27763", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u524d\u7f00\u9884\u6d4b\u76ee\u6807\u4e0b\uff0c\u5c40\u90e8\u5feb\u8bb0\u5fc6\u6837\u672c\u5e94\u4e3a\u524d\u7f00\u5bf9\u9f50\u7684 $(\u03c6(k_{t-1}), v_t)$\uff0c\u800c\u5e38\u89c1\u7684\u540c\u4e00\u6b65\u5173\u8054 $(\u03c6(k_t), v_t)$ \u867d\u56e0\u679c\u4f46\u5bf9\u5e94\u4e0d\u540c\u5185\u90e8\u76ee\u6807", "\u63a8\u5bfc\u4e86\u5e73\u65b9\u8bef\u5dee\u56de\u5f52\u4e0e\u8d1f\u5185\u79ef\u76ee\u6807\u4e0b\u7684\u5f52\u4e00\u5316\u4e00\u9636\u66f4\u65b0\uff0c\u5305\u62ec\u6807\u91cf NLMS\u3001\u9010\u5217\u6269\u5c55\u548c\u6ed1\u52a8\u7a97\u53e3\u5c0f\u6279\u91cf\u66f4\u65b0", "\u7ed9\u51fa\u9012\u5f52\u3001\u63a9\u7801\u5e76\u884c\u548c\u5206\u5757\u5e76\u884c\u5b9e\u73b0\uff0c\u5e76\u5f15\u5165\u6570\u503c\u7a33\u5b9a\u7684\u6b63\u8870\u51cf\u91cd\u5f52\u4e00\u5316\uff1b\u5728\u8bed\u8a00\u5efa\u6a21\u4e2d\u4fdd\u6301\u7ade\u4e89\u529b\uff0c\u5e76\u63d0\u5347\u53d8\u957f\u6570\u5b57\u52a0\u6cd5\u7684\u957f\u5ea6\u5916\u63a8"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u5e8f\u5217\u5efa\u6a21", "\u6ce8\u610f\u529b\u673a\u5236", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27763v1", "published_at": "2026-08-27", "score": 0.285, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27763.png", "title": "Fast Weight Attention for Continual Learning", "tldr": "\u5c06\u5feb\u6743\u91cd\u6ce8\u610f\u529b\u91cd\u6784\u4e3a\u5728\u7ebf\u6301\u7eed\u5b66\u4e60\u89c4\u5219", "upvotes": 20, "what_it_is": "\u8bba\u6587\u4ece\u8bfb\u540e\u5199\u7684\u81ea\u56de\u5f52\u8bed\u4e49\u51fa\u53d1\uff0c\u91cd\u65b0\u5206\u6790\u5feb\u6743\u91cd\u8bb0\u5fc6\u548c\u9009\u62e9\u6027\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u4e2d\u7684\u72b6\u6001\u66f4\u65b0\u89c4\u5219\u3002\u4f5c\u8005\u63a8\u5bfc\u4e86\u4e00\u7cfb\u5217\u5f52\u4e00\u5316\u4e00\u9636\u5728\u7ebf\u66f4\u65b0\u65b9\u6cd5\uff0c\u5e76\u63d0\u51fa Falcon-1/2/3 \u53ca\u5176\u5185\u79ef\u53d8\u4f53\uff0c\u7528\u4e8e\u56fa\u5b9a\u5927\u5c0f\u9012\u5f52\u72b6\u6001\u4e2d\u7684\u6301\u7eed\u5e8f\u5217\u5b66\u4e60\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u5feb\u6743\u91cd\u6ce8\u610f\u529b\u3001\u72b6\u6001\u7a7a\u95f4\u9012\u5f52\u72b6\u6001\u4e0e\u5728\u7ebf\u5b66\u4e60\u89c4\u5219\u7edf\u4e00\u8d77\u6765\uff0c\u6e05\u6670\u533a\u5206\u65f6\u95f4\u5bf9\u9f50\u3001\u53ef\u5851\u6027\u3001\u9057\u5fd8\u548c\u6709\u9650\u56de\u653e\u7b49\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u8bbe\u8ba1\u66f4\u9002\u5408\u957f\u4e0a\u4e0b\u6587\u548c\u6301\u7eed\u5b66\u4e60\u7684\u9ad8\u6548\u5e8f\u5217\u6a21\u578b\u3002"}, {"abstract": "Autoregressive video diffusion enables scalable long-video generation by producing chunks from a bounded recent context. While recency-based caching preserves local continuity, it evicts historical cues needed when subjects, objects, scenes, or attributes reappear. Existing memory mechanisms expose models to nonlocal history, but access alone does not ensure effective use. Our analysis reveals that video DiT layers exhibit distinct preferences for current, recent, and distant context, suggesting that long-range memory requires deciding both what to retrieve and where to use it. We introduce LayerRecall, a current-conditioned, layer-selective memory router that retrieves relevant historical K/V states and injects them only into backbone-specific memory-sensitive layers while preserving local attention elsewhere. To reduce reliance on scarce high-quality long-horizon videos and explicit memory-allocation labels, we further propose Cross-Horizon Prediction Matching (CHPM), which uses a privileged long-context reference to supervise the bounded-memory router in prediction space. Across 100 multi-shot evaluation prompts, LayerRecall achieves the best overall results on MemoBench and MovieBench while matching its backbone on VBench-Long, demonstrating stronger long-range recovery without sacrificing local continuity. Qualitative analyses further reveal memory-guided self-correction, whereby initially mismatched local attributes return to their historical appearance without resetting ongoing motion or scene structure. Additional analyses show cross-backbone portability and negligible inference overhead.", "arxiv_id": "2608.28460", "arxiv_url": "https://arxiv.org/abs/2608.28460", "authors": ["Yixuan Ding", "Jiahao Kong", "Wei Huang", "Ruijie Quan", "Yi Yang"], "brief": "\u8bba\u6587\u63d0\u51fa LayerRecall\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u72b6\u6001\u6761\u4ef6\u8bb0\u5fc6\u8def\u7531\u5668\u3002\u5b83\u6839\u636e\u5f53\u524d\u751f\u6210\u72b6\u6001\u68c0\u7d22\u76f8\u5173\u5386\u53f2 K/V\uff0c\u5e76\u53ea\u6ce8\u5165\u5bf9\u957f\u7a0b\u8bb0\u5fc6\u654f\u611f\u7684\u7279\u5b9a DiT \u5c42\uff0c\u4ee5\u6539\u5584\u4e3b\u4f53\u3001\u573a\u666f\u548c\u5c5e\u6027\u518d\u51fa\u73b0\u65f6\u7684\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Yixuan-Ding-ZJU/LayerRecall", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.28460", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u89c6\u9891 DiT \u4e0d\u540c\u5c42\u5bf9\u5f53\u524d\u3001\u8fd1\u671f\u4e0e\u8fdc\u8ddd\u79bb\u4e0a\u4e0b\u6587\u5b58\u5728\u4e0d\u540c\u504f\u597d\uff0c\u56e0\u6b64\u957f\u7a0b\u8bb0\u5fc6\u4e0d\u4ec5\u8981\u51b3\u5b9a\u201c\u53d6\u4ec0\u4e48\u201d\uff0c\u8fd8\u8981\u51b3\u5b9a\u201c\u7528\u5728\u54ea\u4e00\u5c42\u201d\u3002", "\u63d0\u51fa Cross-Horizon Prediction Matching\uff0c\u7528\u957f\u4e0a\u4e0b\u6587\u53c2\u8003\u6a21\u578b\u5728\u9884\u6d4b\u7a7a\u95f4\u76d1\u7763\u6709\u754c\u8bb0\u5fc6\u8def\u7531\u5668\uff0c\u964d\u4f4e\u5bf9\u9ad8\u8d28\u91cf\u957f\u89c6\u9891\u548c\u663e\u5f0f\u8bb0\u5fc6\u6807\u7b7e\u7684\u4f9d\u8d56\u3002", "\u5728 100 \u4e2a\u591a\u955c\u5934\u8bc4\u6d4b\u63d0\u793a\u4e0a\uff0cLayerRecall \u5728 MemoBench \u548c MovieBench \u53d6\u5f97\u6700\u4f73\u6574\u4f53\u7ed3\u679c\uff0c\u5e76\u5728 VBench-Long \u4e0a\u4fdd\u6301\u4e0e\u9aa8\u5e72\u6a21\u578b\u76f8\u5f53\u7684\u5c40\u90e8\u8fde\u7eed\u6027\uff0c\u4e14\u63a8\u7406\u5f00\u9500\u5f88\u5c0f\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u957f\u7a0b\u8bb0\u5fc6", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2608.28460v1", "published_at": "2026-08-28", "score": 0.285, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28460.png", "title": "LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency in Video Generation", "tldr": "\u6309\u5c42\u8def\u7531\u5386\u53f2\u8bb0\u5fc6\uff0c\u63d0\u5347\u957f\u89c6\u9891\u4e00\u81f4\u6027\u3002", "upvotes": 26, "what_it_is": "\u8bba\u6587\u63d0\u51fa LayerRecall\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u72b6\u6001\u6761\u4ef6\u8bb0\u5fc6\u8def\u7531\u5668\u3002\u5b83\u6839\u636e\u5f53\u524d\u751f\u6210\u72b6\u6001\u68c0\u7d22\u76f8\u5173\u5386\u53f2 K/V\uff0c\u5e76\u53ea\u6ce8\u5165\u5bf9\u957f\u7a0b\u8bb0\u5fc6\u654f\u611f\u7684\u7279\u5b9a DiT \u5c42\uff0c\u4ee5\u6539\u5584\u4e3b\u4f53\u3001\u573a\u666f\u548c\u5c5e\u6027\u518d\u51fa\u73b0\u65f6\u7684\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u89c6\u9891\u751f\u6210\u4e2d\u5e38\u89c1\u7684\u5386\u53f2\u4fe1\u606f\u9057\u5fd8\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u7ec6\u7c92\u5ea6\u3001\u6309\u5c42\u9009\u62e9\u7684\u8bb0\u5fc6\u4f7f\u7528\u673a\u5236\uff0c\u5728\u4e0d\u727a\u7272\u5c40\u90e8\u6d41\u7545\u6027\u7684\u524d\u63d0\u4e0b\u589e\u5f3a\u8fdc\u8ddd\u79bb\u4e00\u81f4\u6027\uff0c\u5e76\u5c55\u793a\u4e86\u8de8\u9aa8\u5e72\u6a21\u578b\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "Recent generative approaches to geometry estimation adapt pretrained image diffusion models and treat the task as image-conditioned generation. Leveraging off-the-shelf image diffusion models, they either (i) train task-specific geometry models (for depth and surface normal estimation) independently, losing the opportunity of exploring the intrinsic correlation of these geometric targets, or (ii) jointly fine-tune modified image diffusion backbones (e.g., altered self-attention), which typically demands substantial labeled data. To overcome these limitations in a principled fashion, we repurpose pretrained video generative models as a unified and data-efficient framework for geometry estimation, formulated innovatively as a next-frames prediction task. Our method, GeoNeXt, inherits naturally structured knowledge and richer priors from the video model, while further adapting them for joint modeling of images and geometry targets (image \u003c-\u003e geometry), enabling more data efficient and effective learning of geometry. Extensive experiments validate our method for zero-shot monocular depth and surface normal estimation across diverse datasets, outperforming both previous task-specific and unified generative competitors while using substantially less training data. Notably, our method rivals discriminative state-of-the-art approaches trained on over 100x more data and even standouts on several benchmarks.", "arxiv_id": "2608.28549", "arxiv_url": "https://arxiv.org/abs/2608.28549", "authors": ["Haosen Yang", "Jifei Song", "Zhensong Zhang", "Xiatian Zhu", "Jiankang Deng"], "brief": "\u8bba\u6587\u63d0\u51fa GeoNeXt\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u91cd\u7528\u4e8e\u51e0\u4f55\u4f30\u8ba1\uff0c\u628a\u6df1\u5ea6\u548c\u8868\u9762\u6cd5\u7ebf\u9884\u6d4b\u8868\u8ff0\u4e3a\u201c\u4e0b\u4e00\u5e27\u9884\u6d4b\u201d\u4efb\u52a1\u3002\u8be5\u65b9\u6cd5\u8054\u5408\u5efa\u6a21\u56fe\u50cf\u4e0e\u51e0\u4f55\u76ee\u6807\uff0c\u5728\u5c11\u91cf\u6807\u6ce8\u6570\u636e\u4e0b\u5b9e\u73b0\u96f6\u6837\u672c\u5355\u76ee\u6df1\u5ea6\u548c\u6cd5\u7ebf\u4f30\u8ba1\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28549", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5229\u7528\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u65f6\u5e8f\u7ed3\u6784\u5148\u9a8c\u4e0e\u751f\u6210\u77e5\u8bc6\uff0c\u800c\u975e\u5206\u522b\u8bad\u7ec3\u6df1\u5ea6/\u6cd5\u7ebf\u4e13\u7528\u6269\u6563\u6a21\u578b", "\u5c06\u56fe\u50cf\u5230\u51e0\u4f55\u3001\u51e0\u4f55\u5230\u56fe\u50cf\u7684\u5173\u7cfb\u7edf\u4e00\u4e3a next-frames prediction\uff0c\u5b9e\u73b0\u591a\u51e0\u4f55\u76ee\u6807\u8054\u5408\u5efa\u6a21", "\u5728\u591a\u6570\u636e\u96c6\u96f6\u6837\u672c\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u65e2\u6709\u4efb\u52a1\u4e13\u7528\u548c\u7edf\u4e00\u751f\u6210\u5f0f\u65b9\u6cd5\uff0c\u5e76\u63a5\u8fd1\u4f7f\u7528\u767e\u500d\u4ee5\u4e0a\u6570\u636e\u8bad\u7ec3\u7684\u5224\u522b\u5f0f SOTA"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u51e0\u4f55\u4f30\u8ba1", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28549v1", "published_at": "2026-08-28", "score": 0.271, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28549.png", "title": "Video Generative Models as Geometry Learner", "tldr": "\u7528\u89c6\u9891\u751f\u6210\u6a21\u578b\u7edf\u4e00\u9ad8\u6548\u4f30\u8ba1\u51e0\u4f55", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa GeoNeXt\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u91cd\u7528\u4e8e\u51e0\u4f55\u4f30\u8ba1\uff0c\u628a\u6df1\u5ea6\u548c\u8868\u9762\u6cd5\u7ebf\u9884\u6d4b\u8868\u8ff0\u4e3a\u201c\u4e0b\u4e00\u5e27\u9884\u6d4b\u201d\u4efb\u52a1\u3002\u8be5\u65b9\u6cd5\u8054\u5408\u5efa\u6a21\u56fe\u50cf\u4e0e\u51e0\u4f55\u76ee\u6807\uff0c\u5728\u5c11\u91cf\u6807\u6ce8\u6570\u636e\u4e0b\u5b9e\u73b0\u96f6\u6837\u672c\u5355\u76ee\u6df1\u5ea6\u548c\u6cd5\u7ebf\u4f30\u8ba1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u89c6\u9891\u751f\u6210\u6a21\u578b\u53ef\u4f5c\u4e3a\u901a\u7528\u51e0\u4f55\u5b66\u4e60\u5668\uff0c\u5728\u663e\u8457\u964d\u4f4e\u6807\u6ce8\u6570\u636e\u9700\u6c42\u7684\u540c\u65f6\u63d0\u5347\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u80fd\u529b\uff0c\u4e3a\u751f\u6210\u5f0f\u5148\u9a8c\u8fc1\u79fb\u5230\u4f4e\u5c42\u89c6\u89c9\u51e0\u4f55\u4efb\u52a1\u63d0\u4f9b\u4e86\u65b0\u8303\u5f0f\u3002"}, {"abstract": "Interactive web application generation requires models to produce usable HTML, CSS, and JavaScript applications from natural language requests. Unlike conventional code generation, application quality depends on multiple user-facing functional requirements, each often tied to localized code regions such as event handlers, state updates, DOM fragments, or CSS selectors. Standard GRPO collapses these structured outcomes into a single sequence-level reward and applies the resulting advantage uniformly to all tokens, weakening credit assignment. We propose \\textbf{Rubric-to-Code Credit Assignment} (RCCA), a reinforcement learning framework that converts rubric-level functional feedback into localized optimization signals over generated code. RCCA builds training tasks around explicit functional rubrics, uses a hierarchical reward to separate format, source-code, runtime, and functional failures, and aligns evaluator-generated textual attributions with responsible code spans and generated tokens. The resulting model, \\textbf{Ling-RCCA-Flash}, scores 41.25 on MiniAppBench, improving Ling-3.0-Flash by 32.20 points and slightly surpassing Claude Opus 4.5. It also reaches 76.19 on ArtifactsBench, improving the SFT model by 4.48 points and establishing a new top score under the official ArtifactsBench leaderboard setting by surpassing the GPT-5 score by 3.64 points, suggesting transferable implementation-level gains.", "arxiv_id": "2608.27906", "arxiv_url": "https://arxiv.org/abs/2608.27906", "authors": ["Rui Jin", "Jikai Chen", "Yihan Chen", "Hao Zhou", "Demin Zhu", "Kaichen Yang", "Dong Wang", "Linjian Mo", "Chenyi Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa RCCA\uff0c\u5c06\u529f\u80fd\u9a8c\u6536 rubric \u7684\u53cd\u9988\u6620\u5c04\u5230\u5177\u4f53\u4ee3\u7801\u7247\u6bb5\u4e0e\u751f\u6210 token\uff0c\u4e3a\u4ea4\u4e92\u5f0f\u7f51\u9875\u5e94\u7528\u751f\u6210\u63d0\u4f9b\u66f4\u7cbe\u786e\u7684\u5f3a\u5316\u5b66\u4e60\u4fe1\u7528\u5206\u914d\u3002\u57fa\u4e8e\u8be5\u6846\u67b6\u8bad\u7ec3\u7684 Ling-RCCA-Flash \u5728 MiniAppBench \u548c ArtifactsBench \u4e0a\u663e\u8457\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27906", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u6807\u51c6 GRPO \u5c06\u591a\u9879\u529f\u80fd\u7ed3\u679c\u538b\u7f29\u4e3a\u5355\u4e00\u5e8f\u5217\u5956\u52b1\u7684\u95ee\u9898\uff0cRCCA \u5c06\u529f\u80fd\u53cd\u9988\u5c40\u90e8\u5316\u5230\u4e8b\u4ef6\u5904\u7406\u3001\u72b6\u6001\u66f4\u65b0\u3001DOM\u3001CSS \u7b49\u76f8\u5173\u4ee3\u7801\u533a\u57df\u3002", "\u8bbe\u8ba1\u5206\u5c42\u5956\u52b1\uff0c\u533a\u5206\u683c\u5f0f\u9519\u8bef\u3001\u6e90\u7801\u9519\u8bef\u3001\u8fd0\u884c\u65f6\u9519\u8bef\u548c\u529f\u80fd\u6027\u5931\u8d25\uff0c\u63d0\u5347\u8bad\u7ec3\u4fe1\u53f7\u7684\u53ef\u89e3\u91ca\u6027\u4e0e\u53ef\u7528\u6027\u3002", "Ling-RCCA-Flash \u5728 MiniAppBench \u5f97\u5206 41.25\uff0c\u8f83 Ling-3.0-Flash \u63d0\u5347 32.20 \u5206\uff1b\u5728 ArtifactsBench \u5f97\u5206 76.19\uff0c\u8d85\u8fc7 GPT-5 \u5b98\u65b9\u699c\u5355\u6210\u7ee9 3.64 \u5206\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u524d\u7aef\u5e94\u7528"], "num_comments": 1, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2608.27906v2", "published_at": "2026-08-28", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27906.png", "title": "Rubric-to-Code Credit Assignment for Reinforcement Learning", "tldr": "\u7528\u7ec6\u7c92\u5ea6\u53cd\u9988\u6539\u8fdb\u7f51\u9875\u5e94\u7528\u4ee3\u7801\u5f3a\u5316\u5b66\u4e60", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa RCCA\uff0c\u5c06\u529f\u80fd\u9a8c\u6536 rubric \u7684\u53cd\u9988\u6620\u5c04\u5230\u5177\u4f53\u4ee3\u7801\u7247\u6bb5\u4e0e\u751f\u6210 token\uff0c\u4e3a\u4ea4\u4e92\u5f0f\u7f51\u9875\u5e94\u7528\u751f\u6210\u63d0\u4f9b\u66f4\u7cbe\u786e\u7684\u5f3a\u5316\u5b66\u4e60\u4fe1\u7528\u5206\u914d\u3002\u57fa\u4e8e\u8be5\u6846\u67b6\u8bad\u7ec3\u7684 Ling-RCCA-Flash \u5728 MiniAppBench \u548c ArtifactsBench \u4e0a\u663e\u8457\u63d0\u5347\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u81ea\u7136\u8bed\u8a00\u529f\u80fd\u8bc4\u4ef7\u8f6c\u5316\u4e3a\u4ee3\u7801\u7ea7\u4f18\u5316\u4fe1\u53f7\uff0c\u7f13\u89e3\u4ee3\u7801\u751f\u6210\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u4fe1\u7528\u5206\u914d\u96be\u9898\uff0c\u5bf9\u590d\u6742\u524d\u7aef\u5e94\u7528\u751f\u6210\u548c\u53ef\u6267\u884c\u4ee3\u7801\u8d
