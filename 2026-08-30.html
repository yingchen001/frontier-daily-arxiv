l-characterized failures may be practical in the near term.", "arxiv_id": "2608.28945", "arxiv_url": "https://arxiv.org/abs/2608.28945", "authors": ["Chen Yueh-Han", "Jiaxin Wen", "Jan Hendrik Kirchner"], "brief": "\u672c\u6587\u8bc4\u4f30\u81ea\u52a8\u5316\u5bf9\u9f50\u7814\u7a76\u5458\u662f\u5426\u80fd\u901a\u8fc7\u63d0\u51fa\u8bad\u7ec3\u65b9\u6cd5\u548c\u6570\u636e\u6765\u7f13\u89e3\u6b3a\u9a97\u3001\u8fce\u5408\u3001\u8d8a\u72f1\u7b4910\u7c7b\u53ef\u6d4b\u91cf\u7684\u5bf9\u9f50\u5931\u8d25\u3002\u6700\u5f3a\u65b9\u6cd5\u663e\u8457\u964d\u4f4e\u76ee\u6807\u5b89\u5168\u95ee\u9898\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u7559\u51fa\u57fa\u51c6\u3001\u591a\u8f6e\u884c\u4e3a\u5ba1\u8ba1\u548c\u66f4\u5927\u6a21\u578b\uff1b\u76f8\u6bd4\u4e4b\u4e0b\uff0c28\u540d\u6709\u7ecf\u9a8c\u7814\u7a76\u8005\u5728\u9650\u65f6\u5185\u63d0\u51fa\u7684\u65b9\u6cd5\u8868\u73b0\u4e0d\u5982\u6700\u4f73\u81ea\u52a8\u5316\u65b9\u6cd5\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28945", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AI\u5bf9\u9f50", "\u5b89\u5168\u8bc4\u6d4b", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28945v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Automated Researchers Can Reliably Mitigate Alignment Failures", "tldr": "\u672c\u6587\u8bc4\u4f30\u81ea\u52a8\u5316\u5bf9\u9f50\u7814\u7a76\u5458\u662f\u5426\u80fd\u901a\u8fc7\u63d0\u51fa\u8bad\u7ec3\u65b9\u6cd5\u548c\u6570\u636e\u6765\u7f13\u89e3\u6b3a\u9a97\u3001\u8fce\u5408\u3001\u8d8a\u72f1\u7b4910\u7c7b\u53ef\u6d4b\u91cf\u7684\u5bf9\u9f50\u5931\u8d25\u3002\u6700\u5f3a\u65b9\u6cd5\u663e\u8457\u964d\u4f4e\u76ee\u6807\u5b89\u5168\u95ee\u9898\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u7559\u51fa\u57fa\u51c6\u3001\u591a\u8f6e\u884c\u4e3a\u5ba1\u8ba1\u548c\u66f4\u5927\u6a21\u578b\uff1b\u76f8\u6bd4\u4e4b\u4e0b\uff0c28\u540d\u6709\u7ecf\u9a8c\u7814\u7a76\u8005\u5728\u9650\u65f6\u5185\u63d0\u51fa\u7684\u65b9\u6cd5\u8868\u73b0\u4e0d\u5982\u6700\u4f73\u81ea\u52a8\u5316\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The key-value (KV) cache is the dominant memory bottleneck of long-context large language model (LLM) inference, growing linearly with context length. We show that uniform KV quantization on a fractional-bit grid does not degrade gracefully: under a prespecified multi-seed statistical protocol, Llama-3.1-8B-Instruct with an affine quantizer is statistically indistinguishable from FP16 KV down to 2.322 code bits/value and collapses at 2.0 bits - a quality cliff in (2.0, 2.322] that reappears in generation-time quantization and multi-turn dialogue and transfers to Mistral-7B. The cliff reframes importance-aware mixed precision: above it, eight model-internal importance indicators are statistically interchangeable, so the benefit of mixing is grid interpolation, reaching average precisions uniform quantization cannot realize. SemKV preserves every token, ranks tokens by a model-internal score, and assigns two adjacent above-cliff precisions, achieving a measured 6.0x storage reduction with no statistically detectable quality difference from full KV (n=900, three seeds), and outperforming FP16 token pruning granted a 1.5x larger memory budget. Replacing the affine base with a distortion-optimized quantizer (TurboQuant-MSE) lowers the cliff in every protocol tested, raising the no-detectable-loss operating point to 7.9x. The recipe: measure the cliff for the target deployment setting, then interpolate above it.", "arxiv_id": "2608.28911", "arxiv_url": "https://arxiv.org/abs/2608.28911", "authors": ["Daeha Lee", "Do-Hyung Kim", "Jae-Hong Kim"], "brief": "\u8bba\u6587\u53d1\u73b0\u957f\u4e0a\u4e0b\u6587 LLM \u7684\u7edf\u4e00 KV \u7f13\u5b58\u91cf\u5316\u5b58\u5728\u201c\u8d28\u91cf\u60ac\u5d16\u201d\uff1a\u5728\u7ea6 2.322 bit/value \u4ee5\u4e0a\u51e0\u4e4e\u4e0d\u635f\u5931\u8d28\u91cf\uff0c\u4f46\u5230 2.0 bit \u4f1a\u5d29\u584c\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa SemKV\uff0c\u6309\u6a21\u578b\u5185\u90e8\u8bed\u4e49\u91cd\u8981\u6027\u5bf9 token \u5206\u914d\u76f8\u90bb\u7684\u5b89\u5168\u7cbe\u5ea6\uff0c\u5728\u4fdd\u7559\u5168\u90e8 token \u7684\u540c\u65f6\u5b9e\u73b0 6.0x \u5b58\u50a8\u538b\u7f29\u4e14\u8d28\u91cf\u65e0\u663e\u8457\u4e0b\u964d\uff1b\u7ed3\u5408\u66f4\u4f18\u91cf\u5316\u5668\u53ef\u63d0\u5347\u5230 7.9x\u3002", "categories": ["cs.LG", "cs.CL", "cs.IT"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28911", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "KV\u7f13\u5b58", "\u91cf\u5316", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28911v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SemKV: Semantic Mixed-Precision KV Cache Quantization Guided by the Quality Cliff for Long-Context LLM Inference", "tldr": "\u8bba\u6587\u53d1\u73b0\u957f\u4e0a\u4e0b\u6587 LLM \u7684\u7edf\u4e00 KV \u7f13\u5b58\u91cf\u5316\u5b58\u5728\u201c\u8d28\u91cf\u60ac\u5d16\u201d\uff1a\u5728\u7ea6 2.322 bit/value \u4ee5\u4e0a\u51e0\u4e4e\u4e0d\u635f\u5931\u8d28\u91cf\uff0c\u4f46\u5230 2.0 bit \u4f1a\u5d29\u584c\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa SemKV\uff0c\u6309\u6a21\u578b\u5185\u90e8\u8bed\u4e49\u91cd\u8981\u6027\u5bf9 token \u5206\u914d\u76f8\u90bb\u7684\u5b89\u5168\u7cbe\u5ea6\uff0c\u5728\u4fdd\u7559\u5168\u90e8 token \u7684\u540c\u65f6\u5b9e\u73b0 6.0x \u5b58\u50a8\u538b\u7f29\u4e14\u8d28\u91cf\u65e0\u663e\u8457\u4e0b\u964d\uff1b\u7ed3\u5408\u66f4\u4f18\u91cf\u5316\u5668\u53ef\u63d0\u5347\u5230 7.9x\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning models do not stop when they know the answer. On DeepSeek-R1-Distill-Qwen-7B the chain of thought runs about twice as long as the model\u0027s own answer probability takes to settle, and how much of that excess is removable varies from problem to problem, so a global length penalty cannot take it out. We take it out by internalizing a causal interpretability finding into the weights. The mechanism is a halt vector: a difference-of-means direction at layer 18 of this model whose steering strength controls how long it thinks, while a replicated value axis does nothing. Installing that intervention in the weights is harder than it looks. Maximizing the scalar projection onto the direction corrupts the off-axis dimensions a frozen downstream reader depends on, and generation gets longer instead of shorter; what works is reconstructing the whole steered activation with those dimensions pinned to their natural values. Fit from 24 problems and no reinforcement learning, the halt removes about a quarter of the thinking at held accuracy across five unseen benchmarks, and the cut tracks each problem\u0027s own removable slack at 0.70. It also closes a non-termination pathology that grows with difficulty and that a decoding-time confidence hook makes worse. We do not claim to beat a well-tuned length penalty or decoding-time early exit on the raw trade-off; the contribution is how the halt is obtained.", "arxiv_id": "2608.28859", "arxiv_url": "https://arxiv.org/abs/2608.28859", "authors": ["Dylan Jayabahu", "Tinuade Adeleke"], "brief": "\u8bba\u6587\u53d1\u73b0\u63a8\u7406\u6a21\u578b\u5728\u7b54\u6848\u6982\u7387\u5df2\u7a33\u5b9a\u540e\u4ecd\u4f1a\u7ee7\u7eed\u751f\u6210\u5197\u957f\u601d\u7ef4\u94fe\uff0c\u5e76\u63d0\u51fa\u5728\u6a21\u578b\u6743\u91cd\u4e2d\u5185\u5316\u4e00\u4e2a\u201chalt vector\u201d\u56e0\u679c\u5e72\u9884\u6765\u7f29\u77ed\u63a8\u7406\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u5f3a\u5316\u5b66\u4e60\uff0c\u4ec5\u752824\u4e2a\u95ee\u9898\u62df\u5408\uff0c\u5728\u4e94\u4e2a\u672a\u89c1\u57fa\u51c6\u4e0a\u4fdd\u6301\u51c6\u786e\u7387\u7684\u540c\u65f6\u51cf\u5c11\u7ea6\u56db\u5206\u4e4b\u4e00\u601d\u8003\u957f\u5ea6\uff0c\u5e76\u80fd\u7f13\u89e3\u968f\u96be\u5ea6\u589e\u52a0\u7684\u975e\u7ec8\u6b62\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28859", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u7406\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u7f16\u8f91", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28859v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Halt Vector: Internalizing a Causal Steering Intervention for Efficient Reasoning", "tldr": "\u8bba\u6587\u53d1\u73b0\u63a8\u7406\u6a21\u578b\u5728\u7b54\u6848\u6982\u7387\u5df2\u7a33\u5b9a\u540e\u4ecd\u4f1a\u7ee7\u7eed\u751f\u6210\u5197\u957f\u601d\u7ef4\u94fe\uff0c\u5e76\u63d0\u51fa\u5728\u6a21\u578b\u6743\u91cd\u4e2d\u5185\u5316\u4e00\u4e2a\u201chalt vector\u201d\u56e0\u679c\u5e72\u9884\u6765\u7f29\u77ed\u63a8\u7406\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u5f3a\u5316\u5b66\u4e60\uff0c\u4ec5\u752824\u4e2a\u95ee\u9898\u62df\u5408\uff0c\u5728\u4e94\u4e2a\u672a\u89c1\u57fa\u51c6\u4e0a\u4fdd\u6301\u51c6\u786e\u7387\u7684\u540c\u65f6\u51cf\u5c11\u7ea6\u56db\u5206\u4e4b\u4e00\u601d\u8003\u957f\u5ea6\uff0c\u5e76\u80fd\u7f13\u89e3\u968f\u96be\u5ea6\u589e\u52a0\u7684\u975e\u7ec8\u6b62\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We investigate whether automatic speech recognition (ASR) errors in user input can lead to unsafe outputs from Embodied AI (EAI) models. We find that ASR errors can lead to harmful instructions being accepted and executed by EAI models, thereby reducing safety. We simulate ASR errors and combine them with existing safety benchmarks (SafeAgentBench and POEX) to evaluate how different errors affect embodied AI safety. We find that some of them preserve semantic structure but increase harmful ambiguity, while others weaken the model refusal behaviour and allow unsafe plans to be generated and executed. We show that in some cases automatic correction of ASR errors can reduce the risk, but this is not always effective. Overall, we show that ASR errors lead to significant safety risks for embodied AI.", "arxiv_id": "2608.28518", "arxiv_url": "https://arxiv.org/abs/2608.28518", "authors": ["Sihan Jia", "Oliver Lemon"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u97f3\u63a7\u5236\u5177\u8eab\u667a\u80fd\u4e2d\uff0c\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u9519\u8bef\u662f\u5426\u4f1a\u8bf1\u53d1\u4e0d\u5b89\u5168\u884c\u4e3a\u3002\u901a\u8fc7\u5728 SafeAgentBench \u548c POEX \u4e0a\u6a21\u62df ASR \u9519\u8bef\uff0c\u53d1\u73b0\u8fd9\u4e9b\u9519\u8bef\u53ef\u80fd\u589e\u52a0\u6709\u5bb3\u6b67\u4e49\u3001\u524a\u5f31\u62d2\u7b54\u673a\u5236\uff0c\u5e76\u5bfc\u81f4\u673a\u5668\u4eba\u751f\u6210\u6216\u6267\u884c\u5371\u9669\u8ba1\u5212\uff1b\u81ea\u52a8\u7ea0\u9519\u6709\u65f6\u80fd\u7f13\u89e3\u4f46\u5e76\u4e0d\u7a33\u5b9a\u3002", "categories": ["cs.AI", "cs.CL", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28518", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u8bed\u97f3\u8bc6\u522b", "\u5b89\u5168\u8bc4\u6d4b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28518v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Robots Mishear Us: Mapping the Safety Risks of Voice-Controlled Embodied AI", "tldr": "\u672c\u6587\u7814\u7a76\u8bed\u97f3\u63a7\u5236\u5177\u8eab\u667a\u80fd\u4e2d\uff0c\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u9519\u8bef\u662f\u5426\u4f1a\u8bf1\u53d1\u4e0d\u5b89\u5168\u884c\u4e3a\u3002\u901a\u8fc7\u5728 SafeAgentBench \u548c POEX \u4e0a\u6a21\u62df ASR \u9519\u8bef\uff0c\u53d1\u73b0\u8fd9\u4e9b\u9519\u8bef\u53ef\u80fd\u589e\u52a0\u6709\u5bb3\u6b67\u4e49\u3001\u524a\u5f31\u62d2\u7b54\u673a\u5236\uff0c\u5e76\u5bfc\u81f4\u673a\u5668\u4eba\u751f\u6210\u6216\u6267\u884c\u5371\u9669\u8ba1\u5212\uff1b\u81ea\u52a8\u7ea0\u9519\u6709\u65f6\u80fd\u7f13\u89e3\u4f46\u5e76\u4e0d\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Two forms of test-time scaling for Large Language Models (LLMs) have emerged as effective and widely adopted paradigms: sequential, in which later answer attempts depend on earlier ones, and parallel, such as i.i.d. sampling with reranking. In this study, we investigate their properties in translation. First, our study shows that sequential sampling has a higher performance ceiling, providing a more diverse and effective pool of samples, particularly under smaller sampling budgets. Second, we interrogate the nature of test-time scaling through a multidimensional manual analysis. Human analysis of the Best-of-$N$ translations demonstrates that sequential sampling substantially improves translation fluency and naturalness, but can degrade accuracy when inference budgets are large. Finally, we suggest an explanation of the mechanism through which sequential scaling improves machine translation. Our controlled analysis partially attributes the success of sequential self-improvement to the model\u0027s access to a larger target-side context. Ablation experiments on sequential sampling demonstrate its robustness across different sampling temperatures, while also revealing sensitivity to context construction, suggesting directions for future improvement.", "arxiv_id": "2608.28496", "arxiv_url": "https://arxiv.org/abs/2608.28496", "authors": ["Di Wu", "Sergey Troshin", "Christof Monz", "Antske Fokkens", "Vlad Niculae"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u673a\u5668\u7ffb\u8bd1\u4e2d\u7684\u6d4b\u8bd5\u65f6\u6269\u5c55\uff0c\u6bd4\u8f83\u987a\u5e8f\u91c7\u6837\u4e0e\u5e76\u884c\u91c7\u6837/\u91cd\u6392\u5e8f\u3002\u7ed3\u679c\u8868\u660e\u987a\u5e8f\u91c7\u6837\u5728\u5c0f\u9884\u7b97\u4e0b\u80fd\u63d0\u4f9b\u66f4\u591a\u6837\u4e14\u6709\u6548\u7684\u5019\u9009\uff0c\u63d0\u5347\u6d41\u7545\u5ea6\u548c\u81ea\u7136\u5ea6\uff0c\u4f46\u5927\u9884\u7b97\u65f6\u53ef\u80fd\u635f\u5bb3\u51c6\u786e\u6027\uff1b\u5176\u6536\u76ca\u90e8\u5206\u6765\u81ea\u66f4\u5927\u7684\u76ee\u6807\u7aef\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28496", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u7ffb\u8bd1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u91c7\u6837"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28496v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ladders in Chaos: When, How, (and Perhaps Why) Does Test-Time Scaling Improve LLM Machine Translation", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u673a\u5668\u7ffb\u8bd1\u4e2d\u7684\u6d4b\u8bd5\u65f6\u6269\u5c55\uff0c\u6bd4\u8f83\u987a\u5e8f\u91c7\u6837\u4e0e\u5e76\u884c\u91c7\u6837/\u91cd\u6392\u5e8f\u3002\u7ed3\u679c\u8868\u660e\u987a\u5e8f\u91c7\u6837\u5728\u5c0f\u9884\u7b97\u4e0b\u80fd\u63d0\u4f9b\u66f4\u591a\u6837\u4e14\u6709\u6548\u7684\u5019\u9009\uff0c\u63d0\u5347\u6d41\u7545\u5ea6\u548c\u81ea\u7136\u5ea6\uff0c\u4f46\u5927\u9884\u7b97\u65f6\u53ef\u80fd\u635f\u5bb3\u51c6\u786e\u6027\uff1b\u5176\u6536\u76ca\u90e8\u5206\u6765\u81ea\u66f4\u5927\u7684\u76ee\u6807\u7aef\u4e0a\u4e0b\u6587\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in large language models (LLMs) have demonstrated strong capabilities in natural language understanding and mathematical reasoning. However, their ability to translate informal mathematical problems into formal representations remains underexplored. This limitation is particularly important for neuro-symbolic geometry systems such as AlphaGeometry, whose theorem-proving engine requires inputs in a specialized domain-specific language (DSL). Although AlphaGeometry achieves near-IMO gold-medalist performance, manually converting natural-language problems into its formal syntax remains a significant usability bottleneck. To address this challenge, we introduce the Natural Language to AlphaGeometry Benchmark (NL2AGBench), which evaluates LLMs in translating English geometry problems into AlphaGeometry-compatible formal representations. NL2AGBench uses execution-based verification within AlphaGeometry to assess translation quality rather than relying solely on textual similarity. We evaluate ten state-of-the-art open- and closed-source LLMs across multiple parameter scales and analyze executable translation accuracy, syntactic correctness, and error characteristics. Our experiments reveal a substantial performance gap between closed- and open-source models: leading closed-source models achieve executable translation rates above 80%, while even the largest open-source models struggle to consistently preserve geometric constraints and produce valid formalizations. We introduce an error taxonomy distinguishing syntax and logic errors and investigate mitigation strategies, including few-shot prompting, fine-tuning, and human-guided hinting, which yield measurable improvements across multiple model families.", "arxiv_id": "2608.28481", "arxiv_url": "https://arxiv.org/abs/2608.28481", "authors": ["Samuel Xiao", "Judy Song", "Rory Hu", "Ziliang Zong"], "brief": "\u8bba\u6587\u63d0\u51fa NL2AGBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u8bed\u8a00\u6a21\u578b\u5c06\u82f1\u6587\u51e0\u4f55\u9898\u81ea\u52a8\u8f6c\u5199\u4e3a AlphaGeometry DSL \u5f62\u5f0f\u5316\u8868\u793a\u7684\u80fd\u529b\uff0c\u5e76\u91c7\u7528 AlphaGeometry \u6267\u884c\u9a8c\u8bc1\u800c\u975e\u7eaf\u6587\u672c\u76f8\u4f3c\u5ea6\u8bc4\u4f30\u3002\u5b9e\u9a8c\u663e\u793a\u95ed\u6e90\u6a21\u578b\u53ef\u8fbe\u5230 80% \u4ee5\u4e0a\u53ef\u6267\u884c\u7ffb\u8bd1\u7387\uff0c\u800c\u5f00\u6e90\u6a21\u578b\u5728\u4fdd\u6301\u51e0\u4f55\u7ea6\u675f\u548c\u751f\u6210\u5408\u6cd5\u5f62\u5f0f\u5316\u65b9\u9762\u4ecd\u660e\u663e\u843d\u540e\uff1b\u5c11\u6837\u672c\u63d0\u793a\u3001\u5fae\u8c03\u548c\u4eba\u5de5\u63d0\u793a\u53ef\u5e26\u6765\u4e00\u5b9a\u63d0\u5347\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28481", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u52a8\u5f62\u5f0f\u5316", "\u6570\u5b66\u63a8\u7406", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28481v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NL2AGBench: Benchmarking LLM Auto-Formalization for AlphaGeometry", "tldr": "\u8bba\u6587\u63d0\u51fa NL2AGBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u8bed\u8a00\u6a21\u578b\u5c06\u82f1\u6587\u51e0\u4f55\u9898\u81ea\u52a8\u8f6c\u5199\u4e3a AlphaGeometry DSL \u5f62\u5f0f\u5316\u8868\u793a\u7684\u80fd\u529b\uff0c\u5e76\u91c7\u7528 AlphaGeometry \u6267\u884c\u9a8c\u8bc1\u800c\u975e\u7eaf\u6587\u672c\u76f8\u4f3c\u5ea6\u8bc4\u4f30\u3002\u5b9e\u9a8c\u663e\u793a\u95ed\u6e90\u6a21\u578b\u53ef\u8fbe\u5230 80% \u4ee5\u4e0a\u53ef\u6267\u884c\u7ffb\u8bd1\u7387\uff0c\u800c\u5f00\u6e90\u6a21\u578b\u5728\u4fdd\u6301\u51e0\u4f55\u7ea6\u675f\u548c\u751f\u6210\u5408\u6cd5\u5f62\u5f0f\u5316\u65b9\u9762\u4ecd\u660e\u663e\u843d\u540e\uff1b\u5c11\u6837\u672c\u63d0\u793a\u3001\u5fae\u8c03\u548c\u4eba\u5de5\u63d0\u793a\u53ef\u5e26\u6765\u4e00\u5b9a\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation (RAG) augments LLMs with external documents, but public or user-editable sources expose RAG systems to data poisoning: attackers can inject malicious documents to steer outputs toward targeted answers. Existing poisoning attacks often rely on query inclusion, inserting the target query into poisoned documents to improve retrieval; however, this creates lexical and embedding-space artifacts that make them easy to filter. We propose CamoDocs, a poisoning attack that avoids direct query inclusion by camouflaging adversarial documents among benign content. CamoDocs chunks synthesized benign and adversarial drafts, replaces selected tokens in benign chunks with dispersion tokens that spread poisoned-document embeddings, and applies coherence filtering to limit readability degradation. Across seven RAG defenses, three open-weight LLMs, and three benchmarks, CamoDocs achieves strong average ASR while avoiding query-overlap artifacts exploited by simple query detection. It also remains effective against proprietary models, achieving average ASRs of 61.80% on GPT-5.4-mini and 55.09% on Claude-Haiku-4.5. Finally, we show that erasure-heavy clustering defenses such as TrustRAG can reduce ASR, but only with substantial utility drops on retrieval-dependent benchmarks such as NeoQA. Code is available at https://github.com/jaewonalive/CamoDocs.", "arxiv_id": "2608.28389", "arxiv_url": "https://arxiv.org/abs/2608.28389", "authors": ["Jaewon Jung", "Haizhong Zheng", "Hongsun Jang", "Jaeyong Song", "Beidi Chen", "Jinho Lee"], "brief": "\u8bba\u6587\u63d0\u51fa CamoDocs\uff0c\u4e00\u79cd\u9488\u5bf9 RAG \u7cfb\u7edf\u7684\u6570\u636e\u6295\u6bd2\u653b\u51fb\uff0c\u901a\u8fc7\u4f2a\u88c5\u6076\u610f\u6587\u6863\u3001\u5206\u6563\u5d4c\u5165\u8868\u793a\u5e76\u4fdd\u6301\u6587\u672c\u8fde\u8d2f\u6027\uff0c\u907f\u514d\u4f20\u7edf\u201c\u76f4\u63a5\u5305\u542b\u76ee\u6807\u67e5\u8be2\u201d\u5e26\u6765\u7684\u6613\u68c0\u6d4b\u75d5\u8ff9\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u79cd\u9632\u5fa1\u3001\u5f00\u6e90/\u95ed\u6e90\u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u4ecd\u6709\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\uff0c\u800c\u5f3a\u529b\u805a\u7c7b\u64e6\u9664\u9632\u5fa1\u867d\u80fd\u964d\u4f4e\u653b\u51fb\u4f46\u4f1a\u660e\u663e\u635f\u5bb3\u68c0\u7d22\u4efb\u52a1\u6027\u80fd\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28389", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["RAG", "\u6570\u636e\u6295\u6bd2", "\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28389v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CamoDocs: A Poisoning Attack Against Retrieval-Augmented Language Models Using Camouflaged Documents", "tldr": "\u8bba\u6587\u63d0\u51fa CamoDocs\uff0c\u4e00\u79cd\u9488\u5bf9 RAG \u7cfb\u7edf\u7684\u6570\u636e\u6295\u6bd2\u653b\u51fb\uff0c\u901a\u8fc7\u4f2a\u88c5\u6076\u610f\u6587\u6863\u3001\u5206\u6563\u5d4c\u5165\u8868\u793a\u5e76\u4fdd\u6301\u6587\u672c\u8fde\u8d2f\u6027\uff0c\u907f\u514d\u4f20\u7edf\u201c\u76f4\u63a5\u5305\u542b\u76ee\u6807\u67e5\u8be2\u201d\u5e26\u6765\u7684\u6613\u68c0\u6d4b\u75d5\u8ff9\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u79cd\u9632\u5fa1\u3001\u5f00\u6e90/\u95ed\u6e90\u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u4ecd\u6709\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\uff0c\u800c\u5f3a\u529b\u805a\u7c7b\u64e6\u9664\u9632\u5fa1\u867d\u80fd\u964d\u4f4e\u653b\u51fb\u4f46\u4f1a\u660e\u663e\u635f\u5bb3\u68c0\u7d22\u4efb\u52a1\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon agents need a context manager to compress growing interaction histories into a bounded working context, via passive strategies or active strategies that decide how memory is accessed and reorganized. Meanwhile, prior optical-memory work mainly treats pixels as a dense codec for textualized histories, often presupposing that rendering context into optical memory incurs a significant performance drop relative to text, thus coupling this representation with SFT, self-distillation, or reinforcement learning to close this gap, leaving unresolved (i) how visual rendering performs as a context manager under a fair, controlled comparison, and (ii) whether this carrier offers a native advantage when history is inherently multimodal. In this paper, we formulate context management as a budget-constrained history transformation and introduce Visual Rendering (VR) as a representational context manager. Under a shared harness, policy model, trigger, and task domain, we evaluate VR on four text-centric and three multimodal benchmarks against four baselines (No Compression, Discard-All, Sliding Window, Summarization), finding visual memory is a natural carrier of native visual evidence. Building on this finding, we propose VERA (Visual Evidence-Retaining strategy for long-horizon Agents), a training-free context manager built on deterministic rendering with no exposed memory operations: on text-centric benchmarks it renders textual history as VR does, while on multimodal benchmarks it retains native visual observations instead of translating them into text. Across nearly all benchmarks, VERA cuts cumulative non-cache tokens by 31.5%-63.1% versus No Compression, matches existing managers on text-centric tasks, and achieves the highest accuracy among all baselines on multimodal tasks, supporting a modality-preserving view of long-horizon context management.", "arxiv_id": "2608.29897", "arxiv_url": "https://arxiv.org/abs/2608.29897", "authors": ["Jiaqi Su", "Cong Pang", "Jiawei Hong", "Tiankuo Yao", "Zixuan Chen", "Xin Lou", "Lewei Lu"], "brief": "\u8bba\u6587\u5c06\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u7ba1\u7406\u5f62\u5f0f\u5316\u4e3a\u9884\u7b97\u53d7\u9650\u7684\u5386\u53f2\u8f6c\u6362\uff0c\u5e76\u516c\u5e73\u8bc4\u4f30\u628a\u5386\u53f2\u6e32\u67d3\u4e3a\u89c6\u89c9\u8bb0\u5fc6\u7684\u6548\u679c\u3002\u63d0\u51fa\u514d\u8bad\u7ec3\u7684 VERA\uff1a\u6587\u672c\u4efb\u52a1\u4e2d\u6e32\u67d3\u6587\u672c\u5386\u53f2\uff0c\u591a\u6a21\u6001\u4efb\u52a1\u4e2d\u4fdd\u7559\u539f\u751f\u89c6\u89c9\u8bc1\u636e\uff1b\u76f8\u6bd4\u4e0d\u538b\u7f29\u51cf\u5c11 31.5%-63.1% \u975e\u7f13\u5b58 token\uff0c\u5e76\u5728\u591a\u6a21\u6001\u4efb\u52a1\u4e0a\u53d6\u5f97\u6700\u9ad8\u51c6\u786e\u7387\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29897", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29897v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When History Is Multimodal: Rethinking Context Management for Long-Horizon Agents", "tldr": "\u8bba\u6587\u5c06\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u7ba1\u7406\u5f62\u5f0f\u5316\u4e3a\u9884\u7b97\u53d7\u9650\u7684\u5386\u53f2\u8f6c\u6362\uff0c\u5e76\u516c\u5e73\u8bc4\u4f30\u628a\u5386\u53f2\u6e32\u67d3\u4e3a\u89c6\u89c9\u8bb0\u5fc6\u7684\u6548\u679c\u3002\u63d0\u51fa\u514d\u8bad\u7ec3\u7684 VERA\uff1a\u6587\u672c\u4efb\u52a1\u4e2d\u6e32\u67d3\u6587\u672c\u5386\u53f2\uff0c\u591a\u6a21\u6001\u4efb\u52a1\u4e2d\u4fdd\u7559\u539f\u751f\u89c6\u89c9\u8bc1\u636e\uff1b\u76f8\u6bd4\u4e0d\u538b\u7f29\u51cf\u5c11 31.5%-63.1% \u975e\u7f13\u5b58 token\uff0c\u5e76\u5728\u591a\u6a21\u6001\u4efb\u52a1\u4e0a\u53d6\u5f97\u6700\u9ad8\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Localizing issue-relevant code regions is a critical step in automated software engineering. However, due to their reliance on sparse trajectory-level signals, existing methods cannot identify which per-turn actions are effective and often discover correct code regions during exploration but fail to commit them. To address these limitations, we propose an action-aware reinforcement learning method that combines a per-turn reward sequence rewarding both the discovery and commitment of gold code regions with an action-level advantage estimation scheme that isolates each action\u0027s credit by grouping turns sharing the same exploration context. Extensive evaluations show that our method improves the average F1 over the state-of-the-art (SOTA) by 1.58% on SWE-Bench Verified and 8.55% on SWE-Bench Pro, with our 4B model outperforming baselines up to 8x larger. Our code is available at https://github.com/donian00/A2Agent.", "arxiv_id": "2608.29831", "arxiv_url": "https://arxiv.org/abs/2608.29831", "authors": ["Doyeon Kim", "Suyoung Bae", "Yumin Lee", "Jee-Hyong Lee"], "brief": "\u672c\u6587\u63d0\u51fa A^2Agent\uff0c\u7528\u52a8\u4f5c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4ed3\u5e93\u7ea7\u4ee3\u7801\u5b9a\u4f4d\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u9010\u8f6e\u5956\u52b1\u540c\u65f6\u9f13\u52b1\u53d1\u73b0\u5e76\u63d0\u4ea4\u6b63\u786e\u4ee3\u7801\u533a\u57df\uff0c\u5e76\u7528\u52a8\u4f5c\u7ea7\u4f18\u52bf\u4f30\u8ba1\u66f4\u7cbe\u786e\u5206\u914d\u6bcf\u4e2a\u52a8\u4f5c\u7684\u4fe1\u7528\u3002\u5728 SWE-Bench Verified \u548c SWE-Bench Pro \u4e0a\u5206\u522b\u8f83 SOTA \u5e73\u5747 F1 \u63d0\u5347 1.58% \u548c 8.55%\uff0c\u4e14 4B \u6a21\u578b\u53ef\u8d85\u8fc7\u5927\u81f3 8 \u500d\u7684\u57fa\u7ebf\u6a21\u578b\u3002", "categories": ["cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29831", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u5b9a\u4f4d", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29831v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A^2Agent: Action-Aware Reinforcement Learning for Repository-Level Code Localization Agents", "tldr": "\u672c\u6587\u63d0\u51fa A^2Agent\uff0c\u7528\u52a8\u4f5c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4ed3\u5e93\u7ea7\u4ee3\u7801\u5b9a\u4f4d\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u9010\u8f6e\u5956\u52b1\u540c\u65f6\u9f13\u52b1\u53d1\u73b0\u5e76\u63d0\u4ea4\u6b63\u786e\u4ee3\u7801\u533a\u57df\uff0c\u5e76\u7528\u52a8\u4f5c\u7ea7\u4f18\u52bf\u4f30\u8ba1\u66f4\u7cbe\u786e\u5206\u914d\u6bcf\u4e2a\u52a8\u4f5c\u7684\u4fe1\u7528\u3002\u5728 SWE-Bench Verified \u548c SWE-Bench Pro \u4e0a\u5206\u522b\u8f83 SOTA \u5e73\u5747 F1 \u63d0\u5347 1.58% \u548c 8.55%\uff0c\u4e14 4B \u6a21\u578b\u53ef\u8d85\u8fc7\u5927\u81f3 8 \u500d\u7684\u57fa\u7ebf\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding accelerates autoregressive language model inference by having a lightweight draft model propose multiple candidate tokens, which are then verified in parallel by a larger target model. However, after the first rejection, standard prefix-based verification discards the remaining draft suffix, so the computation spent generating and verifying those positions does not contribute to decoding progress. Focusing on DFlash, we show that rejected positions in a rejected suffix may still align with the target continuation, indicating that the draft model can retain useful semantic and structural information despite local token-level errors. Motivated by this observation and inspired by conditional diffusion, we introduce~\\textbf{ReTrace}, a rejected-trajectory conditioning method that conditions each draft block on the rejected suffix from the previous round rather than generating it from fresh mask placeholders alone. ReTrace retains the hidden representations of the rejected suffixes, aligns them with the next draft block, refines them using target-aware correction signals from the same verification pass, and admits them into the drafter\u0027s input embeddings through gated residual fusion. Because rejected tokens are never committed and target-side verification remains unchanged, ReTrace preserves the lossless property of speculative decoding without requiring an additional model forward pass. Experiments with Qwen3 models across mathematical reasoning, code generation, and open-ended dialogue demonstrate that ReTrace consistently improves average acceptance length and end-to-end decoding speed over its DFlash backbone. By introducing cross-round conditioning without modifying within-round proposal generation, ReTrace is largely orthogonal to existing drafting improvements and might be combined with them for further gains.", "arxiv_id": "2608.29748", "arxiv_url": "https://arxiv.org/abs/2608.29748", "authors": ["Luxi Lin", "Zhanpeng Zeng", "Shuang Peng", "Songwei Liu", "Rongrong Ji"], "brief": "\u672c\u6587\u63d0\u51fa ReTrace\uff0c\u7528\u4e0a\u4e00\u8f6e\u88ab\u62d2\u7edd\u7684\u8349\u7a3f\u540e\u7f00\u53ca\u5176\u9690\u85cf\u8868\u793a\u6765\u6761\u4ef6\u5316\u4e0b\u4e00\u8f6e\u6295\u673a\u89e3\u7801\u8349\u7a3f\u751f\u6210\uff0c\u5e76\u901a\u8fc7\u95e8\u63a7\u6b8b\u5dee\u878d\u5408\u5229\u7528\u76ee\u6807\u6a21\u578b\u9a8c\u8bc1\u4fe1\u53f7\u8fdb\u884c\u4fee\u6b63\u3002\u8be5\u65b9\u6cd5\u4e0d\u6539\u53d8\u76ee\u6807\u7aef\u9a8c\u8bc1\u3001\u4fdd\u6301\u65e0\u635f\u89e3\u7801\u4e14\u65e0\u9700\u989d\u5916\u524d\u5411\u8ba1\u7b97\uff0c\u5728 Qwen3 \u7684\u6570\u5b66\u3001\u4ee3\u7801\u548c\u5bf9\u8bdd\u4efb\u52a1\u4e2d\u63d0\u5347\u4e86\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\u4e0e\u7aef\u5230\u7aef\u89e3\u7801\u901f\u5ea6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29748", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6295\u673a\u89e3\u7801", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29748v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReTrace: Rejected-Trajectory Conditioning for Speculative Decoding", "tldr": "\u672c\u6587\u63d0\u51fa ReTrace\uff0c\u7528\u4e0a\u4e00\u8f6e\u88ab\u62d2\u7edd\u7684\u8349\u7a3f\u540e\u7f00\u53ca\u5176\u9690\u85cf\u8868\u793a\u6765\u6761\u4ef6\u5316\u4e0b\u4e00\u8f6e\u6295\u673a\u89e3\u7801\u8349\u7a3f\u751f\u6210\uff0c\u5e76\u901a\u8fc7\u95e8\u63a7\u6b8b\u5dee\u878d\u5408\u5229\u7528\u76ee\u6807\u6a21\u578b\u9a8c\u8bc1\u4fe1\u53f7\u8fdb\u884c\u4fee\u6b63\u3002\u8be5\u65b9\u6cd5\u4e0d\u6539\u53d8\u76ee\u6807\u7aef\u9a8c\u8bc1\u3001\u4fdd\u6301\u65e0\u635f\u89e3\u7801\u4e14\u65e0\u9700\u989d\u5916\u524d\u5411\u8ba1\u7b97\uff0c\u5728 Qwen3 \u7684\u6570\u5b66\u3001\u4ee3\u7801\u548c\u5bf9\u8bdd\u4efb\u52a1\u4e2d\u63d0\u5347\u4e86\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\u4e0e\u7aef\u5230\u7aef\u89e3\u7801\u901f\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Removing a specific individual\u0027s information from multimodal large language models (MLLMs) is often needed after deployment, but existing methods rely on a retain set, which is hardest to obtain at that point, and rebuilding it recreates the privacy exposure that unlearning aims to remove. Forgetting from the forget set alone instead damages the shared visual-language computation, harming perception. We cast retain-free unlearning as a localization problem: causal tracing, weight transplant, and Fisher overlap all point to early-to-mid decoder MLPs as the layers where identity information is stored and, unlike other module families, can be modified without substantially disrupting vision. We turn this into Pathway-Aware Visual-attribute Anchoring (PAVA), which confines updates to these layers and pairs a forget loss with a visual-attribute anchor that preserves image-grounded behavior by distilling the model\u0027s own pre-unlearning answers from the forget images alone. On MLLMU-Bench and ReMem, PAVA gives the strongest forget-retain trade-off among forget-set-only methods and remains competitive with retain-based baselines.", "arxiv_id": "2608.30649", "arxiv_url": "https://arxiv.org/abs/2608.30649", "authors": ["Kangwook Ko", "Jaehyuk Jang", "Wonjun Lee", "Hee-Seon Kim", "Changick Kim"], "brief": "\u672c\u6587\u7814\u7a76\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u8eab\u4efd\u9057\u5fd8\u95ee\u9898\uff0c\u63d0\u51fa\u5c06\u65e0\u4fdd\u7559\u96c6\u9057\u5fd8\u89c6\u4e3a\u5b9a\u4f4d\u95ee\u9898\uff0c\u53d1\u73b0\u8eab\u4efd\u4fe1\u606f\u4e3b\u8981\u5b58\u50a8\u5728\u65e9\u4e2d\u671f\u89e3\u7801\u5668 MLP \u5c42\u3002\u65b9\u6cd5 PAVA \u4ec5\u66f4\u65b0\u8fd9\u4e9b\u5c42\uff0c\u5e76\u7528\u9057\u5fd8\u56fe\u50cf\u4e0a\u7684\u89c6\u89c9\u5c5e\u6027\u951a\u5b9a\u6765\u4fdd\u6301\u56fe\u50cf\u7406\u89e3\u80fd\u529b\uff0c\u5728 MLLMU-Bench \u548c ReMem \u4e0a\u53d6\u5f97\u4e86\u5fd8\u5f97\u6389\u4e14\u4fdd\u7559\u80fd\u529b\u66f4\u597d\u7684\u6743\u8861\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30649", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u9690\u79c1\u4fdd\u62a4", "\u6a21\u578b\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30649v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Where Identity Lives: Localized, Retain-Free Identity Unlearning in Multimodal Large Language Models", "tldr": "\u672c\u6587\u7814\u7a76\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u8eab\u4efd\u9057\u5fd8\u95ee\u9898\uff0c\u63d0\u51fa\u5c06\u65e0\u4fdd\u7559\u96c6\u9057\u5fd8\u89c6\u4e3a\u5b9a\u4f4d\u95ee\u9898\uff0c\u53d1\u73b0\u8eab\u4efd\u4fe1\u606f\u4e3b\u8981\u5b58\u50a8\u5728\u65e9\u4e2d\u671f\u89e3\u7801\u5668 MLP \u5c42\u3002\u65b9\u6cd5 PAVA \u4ec5\u66f4\u65b0\u8fd9\u4e9b\u5c42\uff0c\u5e76\u7528\u9057\u5fd8\u56fe\u50cf\u4e0a\u7684\u89c6\u89c9\u5c5e\u6027\u951a\u5b9a\u6765\u4fdd\u6301\u56fe\u50cf\u7406\u89e3\u80fd\u529b\uff0c\u5728 MLLMU-Bench \u548c ReMem \u4e0a\u53d6\u5f97\u4e86\u5fd8\u5f97\u6389\u4e14\u4fdd\u7559\u80fd\u529b\u66f4\u597d\u7684\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Strategic deception by LLM and VLM agents has emerged as a central AI alignment and safety concern. Social-deduction games (where each player holds a hidden role and communicates with others to deduce identities) serve as the canonical testbed, particularly in multi-agent settings. Existing testbeds, however, are text-only and run on a single fixed agent configuration, missing the non-verbal sensorimotor channels treated as core by deception taxonomies and leaving it ambiguous whether an observed behavior reflects the underlying model or the surrounding harness. We introduce MineAmongUs, a 3D multimodal Among Us sandbox where imposter agents must deceive crewmates through joint verbal and non-verbal action. We also propose ARIA, a configurable VLM-agent harness that exposes five cognitive-component ablation axes; and an atom- and arc-level annotation scheme grounded in deception taxonomies and operationalized at scale by an LLM-as-a-Judge reaching near-human atom-labeling agreement. Empirical results show that VLM agents pursue imposter wins through joint verbal and non-verbal deception, with non-verbal channels emerging as the more decisive winning contributors across both harness ablation and cross-VLM evaluation. Taken together, our work opens a new path for embodied VLM-agent alignment research.", "arxiv_id": "2608.30428", "arxiv_url": "https://arxiv.org/abs/2608.30428", "authors": ["Jaewoo Ahn", "Junseo Kim", "Hyunseo Kim", "Heeseung Yun", "Jaehyeon Son", "Zsolt Kira", "Gunhee Kim"], "brief": "\u672c\u6587\u63d0\u51fa MineAmongUs\uff0c\u4e00\u4e2a 3D \u591a\u6a21\u6001\u300aAmong Us\u300b\u6c99\u76d2\uff0c\u7528\u4e8e\u7814\u7a76\u5177\u8eab VLM \u667a\u80fd\u4f53\u5728\u793e\u4ea4\u63a8\u7406\u4e2d\u7684\u8bed\u8a00\u4e0e\u975e\u8bed\u8a00\u6b3a\u9a97\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0cVLM \u667a\u80fd\u4f53\u4f1a\u7ed3\u5408\u53d1\u8a00\u548c\u52a8\u4f5c\u8fdb\u884c\u6b3a\u9a97\uff0c\u4e14\u975e\u8bed\u8a00\u884c\u4e3a\u5bf9\u53d6\u80dc\u66f4\u5173\u952e\uff0c\u4e3a\u5177\u8eab\u667a\u80fd\u4f53\u5bf9\u9f50\u4e0e\u5b89\u5168\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u65b0\u6d4b\u8bd5\u5e8a\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30428", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd", "AI\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30428v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Lies We Can See: Joint Verbal and Non-Verbal Deception by VLM Agents in Embodied Social Interactions", "tldr": "\u672c\u6587\u63d0\u51fa MineAmongUs\uff0c\u4e00\u4e2a 3D \u591a\u6a21\u6001\u300aAmong Us\u300b\u6c99\u76d2\uff0c\u7528\u4e8e\u7814\u7a76\u5177\u8eab VLM \u667a\u80fd\u4f53\u5728\u793e\u4ea4\u63a8\u7406\u4e2d\u7684\u8bed\u8a00\u4e0e\u975e\u8bed\u8a00\u6b3a\u9a97\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0cVLM \u667a\u80fd\u4f53\u4f1a\u7ed3\u5408\u53d1\u8a00\u548c\u52a8\u4f5c\u8fdb\u884c\u6b3a\u9a97\uff0c\u4e14\u975e\u8bed\u8a00\u884c\u4e3a\u5bf9\u53d6\u80dc\u66f4\u5173\u952e\uff0c\u4e3a\u5177\u8eab\u667a\u80fd\u4f53\u5bf9\u9f50\u4e0e\u5b89\u5168\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u65b0\u6d4b\u8bd5\u5e8a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video understanding requires answering questions at arbitrary times over a continuously growing visual stream. The central challenge is to compactly remember long-range history while effectively retrieving question-relevant evidence. We propose Dynamic Hub-and-Spoke Memory (D-HSM), a training-free framework that represents distant history as structured textual memory while preserving the recent frames as visual tokens for fine-grained perception. Specifically, D-HSM turns selected historical video chunks into typed textual observations and stores them in an entity-centered hub-and-spoke memory, with entities as hubs and related evidence as spokes. When answering a question, D-HSM dynamically retrieves a compact question-aware memory subset, expands it through hub-and-spoke links, and combines it with the recent visual window for frozen-VLM answer prediction. Extensive experiments on both streaming and long video benchmarks show that D-HSM consistently and substantially improves VLM backbones and outperforms other state-of-the-art online and offline video understanding baselines.", "arxiv_id": "2608.30294", "arxiv_url": "https://arxiv.org/abs/2608.30294", "authors": ["Xinru Jiang", "Lin Zhao", "Xi Xiao", "Yunbei Zhang", "Janet Wang", "Chenrui Ma", "Haolin Li", "Yanzhi Wang", "Yifan Gong", "Octavia Camps"], "brief": "\u672c\u6587\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u52a8\u6001\u67a2\u7ebd-\u8f90\u5c04\u8bb0\u5fc6 D-HSM\uff0c\u7528\u7ed3\u6784\u5316\u6587\u672c\u8bb0\u5fc6\u538b\u7f29\u957f\u7a0b\u89c6\u9891\u5386\u53f2\uff0c\u540c\u65f6\u4fdd\u7559\u8fd1\u671f\u5e27\u7684\u89c6\u89c9 token \u4ee5\u652f\u6301\u7ec6\u7c92\u5ea6\u611f\u77e5\u3002\u5b83\u5728\u56de\u7b54\u95ee\u9898\u65f6\u6309\u9700\u68c0\u7d22\u5e76\u6269\u5c55\u76f8\u5173\u5b9e\u4f53\u8bb0\u5fc6\uff0c\u7ed3\u5408\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u6d41\u5f0f\u548c\u957f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u591a\u79cd\u5728\u7ebf/\u79bb\u7ebf\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30294", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u957f\u7a0b\u8bb0\u5fc6", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6d41\u5f0f\u5904\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30294v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Dynamic Hub-and-Spoke Memory for Streaming Video Understanding", "tldr": "\u672c\u6587\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u52a8\u6001\u67a2\u7ebd-\u8f90\u5c04\u8bb0\u5fc6 D-HSM\uff0c\u7528\u7ed3\u6784\u5316\u6587\u672c\u8bb0\u5fc6\u538b\u7f29\u957f\u7a0b\u89c6\u9891\u5386\u53f2\uff0c\u540c\u65f6\u4fdd\u7559\u8fd1\u671f\u5e27\u7684\u89c6\u89c9 token \u4ee5\u652f\u6301\u7ec6\u7c92\u5ea6\u611f\u77e5\u3002\u5b83\u5728\u56de\u7b54\u95ee\u9898\u65f6\u6309\u9700\u68c0\u7d22\u5e76\u6269\u5c55\u76f8\u5173\u5b9e\u4f53\u8bb0\u5fc6\uff0c\u7ed3\u5408\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u6d41\u5f0f\u548c\u957f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u591a\u79cd\u5728\u7ebf/\u79bb\u7ebf\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "General embodied agents should perceive, predict, act, evaluate, and improve within a unified system. World models have shown great promise in building such agents, yet existing models typically append an action output head to a world simulator, without coupling them into a closed decision-and-learning loop for policy improvement. We present Motus2, a self-evolving general world model for dexterous manipulation. Motus2 advances world modeling through model scaling and data scaling. For model scaling, a single model with shared weights exposes three control interfaces: a policy (world-action model), a simulator (action-conditioned world model), and an evaluator (value model). The policy proposes candidate action chunks, the simulator predicts their visual consequences, and the evaluator assesses the predicted outcomes. Their coupling forms a closed decision-and-learning loop for policy improvement. This formulation uses curated expert demonstrations for action learning, while failed and suboptimal interactions provide valuable evidence for dynamics modeling and value learning. For data scaling, Motus2 progresses from large-scale monocular egocentric data to synchronized stereo egocentric data, followed by robot-domain adaptation with robot trajectories and supplementary human-robot alignment data. Motus2 further studies global-autoregressive and hybrid-memory extensions of its sliding-window context, adds tactile feedback for contact-aware control, and is instantiated on a fully biomimetic platform with stereo vision, dual arms, dual dexterous hands, and tactile sensing. Together, egocentric data scaling and closed-loop general world model scaling provide a general path toward self-evolving dexterous manipulation.", "arxiv_id": "2608.30237", "arxiv_url": "https://arxiv.org/abs/2608.30237", "authors": ["Hongzhe Bi", "Zihao Zhou", "Yihang Tang", "Jingrui Pang", "Shuhe Huang", "Haitian Liu", "Runqing Wang", "Shuai Huang", "Yichen Wang", "Yiming Cheng", "Ruowen Zhao", "Zhenghua Li", "Hengkai Tan", "Xiaolong Liu", "Jinhui Wan", "Jiabao Liu", "Min Zhao", "Fan Bao", "Jun Zhu"], "brief": "Motus2 \u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u7075\u5de7\u64cd\u4f5c\u7684\u81ea\u8fdb\u5316\u901a\u7528\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u7b56\u7565\u3001\u4eff\u771f\u5668\u548c\u4ef7\u503c\u8bc4\u4f30\u5668\u7528\u540c\u4e00\u6a21\u578b\u6743\u91cd\u7edf\u4e00\u8d77\u6765\uff0c\u5f62\u6210\u52a8\u4f5c\u751f\u6210\u3001\u7ed3\u679c\u9884\u6d4b\u3001\u4ef7\u503c\u8bc4\u4f30\u4e0e\u7b56\u7565\u6539\u8fdb\u7684\u95ed\u73af\u3002\u5b83\u901a\u8fc7\u5927\u89c4\u6a21\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u3001\u673a\u5668\u4eba\u8f68\u8ff9\u3001\u4eba\u673a\u5bf9\u9f50\u6570\u636e\u4ee5\u53ca\u89e6\u89c9\u53cd\u9988\u8fdb\u884c\u6269\u5c55\uff0c\u9762\u5411\u4eff\u751f\u53cc\u81c2\u53cc\u7075\u5de7\u624b\u5e73\u53f0\u63d0\u5347\u63a5\u89e6\u611f\u77e5\u548c\u6cdb\u5316\u64cd\u4f5c\u80fd\u529b\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30237", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u7075\u5de7\u64cd\u4f5c", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30237v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Motus2: A Self-Evolving General World Model for Dexterous Manipulation", "tldr": "Motus2 \u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u7075\u5de7\u64cd\u4f5c\u7684\u81ea\u8fdb\u5316\u901a\u7528\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u7b56\u7565\u3001\u4eff\u771f\u5668\u548c\u4ef7\u503c\u8bc4\u4f30\u5668\u7528\u540c\u4e00\u6a21\u578b\u6743\u91cd\u7edf\u4e00\u8d77\u6765\uff0c\u5f62\u6210\u52a8\u4f5c\u751f\u6210\u3001\u7ed3\u679c\u9884\u6d4b\u3001\u4ef7\u503c\u8bc4\u4f30\u4e0e\u7b56\u7565\u6539\u8fdb\u7684\u95ed\u73af\u3002\u5b83\u901a\u8fc7\u5927\u89c4\u6a21\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u3001\u673a\u5668\u4eba\u8f68\u8ff9\u3001\u4eba\u673a\u5bf9\u9f50\u6570\u636e\u4ee5\u53ca\u89e6\u89c9\u53cd\u9988\u8fdb\u884c\u6269\u5c55\uff0c\u9762\u5411\u4eff\u751f\u53cc\u81c2\u53cc\u7075\u5de7\u624b\u5e73\u53f0\u63d0\u5347\u63a5\u89e6\u611f\u77e5\u548c\u6cdb\u5316\u64cd\u4f5c\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world knowledge resides in multimodal documents, necessitating retrieval-augmented generation (RAG) for accurate question answering. However, existing multimodal RAG models are primarily designed for single-image or closed-document settings and exhibit limited accuracy in realistic multi-image scenarios. Moreover, processing numerous retrieved images incurs substantial computational overhead from irrelevant visual tokens. To address these challenges, we introduce DocLongRAG, a large-scale dataset of 343K question--answer pairs, each associated with an average of 37.4 retrieved images to reflect authentic RAG workflows. Building on this dataset, we propose Doc-REFRAG, a question-guided framework that compresses visual tokens into coarse chunks and selectively expands question-relevant ones via a lightweight RL-based selector. Experiments on six benchmarks show that Doc-REFRAG outperforms eleven strong baselines, achieving state-of-the-art accuracy with significantly lower inference latency. Our resources are available at https://github.com/Collab-Gen/Doc-REFRAG.", "arxiv_id": "2608.30163", "arxiv_url": "https://arxiv.org/abs/2608.30163", "authors": ["Ruofan Hu", "Shengyang Xu", "Minjie Hong", "Xiaoda Yang", "Sashuai Zhou", "Ke Lei", "Tao Jin", "Zhou Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u771f\u5b9e\u591a\u56fe\u6587\u6863\u573a\u666f\u7684\u591a\u6a21\u6001RAG\u6570\u636e\u96c6 DocLongRAG\uff0c\u5305\u542b34.3\u4e07\u95ee\u7b54\u5bf9\u4e14\u6bcf\u9898\u5e73\u5747\u5173\u805437.4\u5f20\u68c0\u7d22\u56fe\u50cf\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa Doc-REFRAG\uff0c\u901a\u8fc7\u95ee\u9898\u5f15\u5bfc\u7684\u89c6\u89c9token\u538b\u7f29\u4e0e\u8f7b\u91cf\u5f3a\u5316\u5b66\u4e60\u9009\u62e9\u5668\uff0c\u53ea\u5c55\u5f00\u76f8\u5173\u56fe\u50cf\u5757\uff0c\u5728\u516d\u4e2a\u57fa\u51c6\u4e0a\u4f18\u4e8e11\u4e2a\u5f3a\u57fa\u7ebf\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\u3002", "categories": ["cs.IR", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30163", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u6587\u6863\u95ee\u7b54", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30163v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Doc-REFRAG: Rethinking Multimodal Document Retrieval-Augmented Generation", "tldr": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u771f\u5b9e\u591a\u56fe\u6587\u6863\u573a\u666f\u7684\u591a\u6a21\u6001RAG\u6570\u636e\u96c6 DocLongRAG\uff0c\u5305\u542b34.3\u4e07\u95ee\u7b54\u5bf9\u4e14\u6bcf\u9898\u5e73\u5747\u5173\u805437.4\u5f20\u68c0\u7d22\u56fe\u50cf\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa Doc-REFRAG\uff0c\u901a\u8fc7\u95ee\u9898\u5f15\u5bfc\u7684\u89c6\u89c9token\u538b\u7f29\u4e0e\u8f7b\u91cf\u5f3a\u5316\u5b66\u4e60\u9009\u62e9\u5668\uff0c\u53ea\u5c55\u5f00\u76f8\u5173\u56fe\u50cf\u5757\uff0c\u5728\u516d\u4e2a\u57fa\u51c6\u4e0a\u4f18\u4e8e11\u4e2a\u5f3a\u57fa\u7ebf\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) driving methods increasingly combine multi-trajectory imitation learning with group-relative policy optimization (GRPO), making trajectory selection critical to final performance. However, some high-scoring trajectories that improve imitation can degrade subsequent GRPO by inducing advantage estimates misaligned with the current policy\u0027s feasible behavior distribution, driving updates away from safe and compliant behaviors. To address this, we propose a novel framework that aligns multi-trajectory supervision with policy optimization. To address the policy gradient bias induced by infeasible noisy trajectories outside the feasible region, augmented trajectories are constrained to a neighboring manifold of the ground-truth feasible region, and a Pareto-optimality criterion is adopted in place of the conventional aggregate score, retaining only non-dominated candidates and thereby filtering out conflicting samples at the source. To ensure that expanded trajectory supervision is effectively absorbed during policy optimization, we introduce two complementary mechanisms: feasibility-first advantage assignment and dynamic distillation. The former adapts Pareto credit to the feasibility composition of each rollout group and guides fully infeasible groups toward safe references. The latter updates teacher trajectories across refinement rounds to continually transfer useful supervision. Together, they progressively translate the benefits of expanded supervision into policy improvement. On NAVSIM v1 and v2, our method achieves 91.4 PDMS and 89.1 EPDMS, respectively, under single-trajectory inference, and recovers 440 of 658 initially failed scenes, 11.1\\% higher than the original GRPO baseline.", "arxiv_id": "2608.30122", "arxiv_url": "https://arxiv.org/abs/2608.30122", "authors": ["Tian Zhang", "Zhuo Huang", "Hongrui Ye", "Yu Wu", "Zengmao Wang", "Kaixuan Zhou"], "brief": "\u8bba\u6587\u9488\u5bf9\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u9a7e\u9a76\u4e2d\u591a\u8f68\u8ff9\u6a21\u4eff\u5b66\u4e60\u4e0eGRPO\u7b56\u7565\u4f18\u5316\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5c06\u589e\u5f3a\u8f68\u8ff9\u7ea6\u675f\u5728\u53ef\u884c\u90bb\u57df\uff0c\u5e76\u7528\u5e15\u7d2f\u6258\u7b5b\u9009\u3001\u53ef\u884c\u6027\u4f18\u5148\u4f18\u52bf\u5206\u914d\u548c\u52a8\u6001\u84b8\u998f\u6765\u8fc7\u6ee4\u51b2\u7a81\u76d1\u7763\u3002\u65b9\u6cd5\u5728NAVSIM v1/v2\u4e0a\u53d6\u5f9791.4 PDMS\u548c89.1 EPDMS\uff0c\u8f83\u539f\u59cbGRPO\u591a\u6062\u590d11.1%\u7684\u5931\u8d25\u573a\u666f\uff0c\u63d0\u5347\u5b89\u5168\u5408\u89c4\u9a7e\u9a76\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30122", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u7b56\u7565\u4f18\u5316", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30122v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Aligning Multi-Trajectory Supervision with Policy Optimization for VLA Driving", "tldr": "\u8bba\u6587\u9488\u5bf9\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u9a7e\u9a76\u4e2d\u591a\u8f68\u8ff9\u6a21\u4eff\u5b66\u4e60\u4e0eGRPO\u7b56\u7565\u4f18\u5316\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5c06\u589e\u5f3a\u8f68\u8ff9\u7ea6\u675f\u5728\u53ef\u884c\u90bb\u57df\uff0c\u5e76\u7528\u5e15\u7d2f\u6258\u7b5b\u9009\u3001\u53ef\u884c\u6027\u4f18\u5148\u4f18\u52bf\u5206\u914d\u548c\u52a8\u6001\u84b8\u998f\u6765\u8fc7\u6ee4\u51b2\u7a81\u76d1\u7763\u3002\u65b9\u6cd5\u5728NAVSIM v1/v2\u4e0a\u53d6\u5f9791.4 PDMS\u548c89.1 EPDMS\uff0c\u8f83\u539f\u59cbGRPO\u591a\u6062\u590d11.1%\u7684\u5931\u8d25\u573a\u666f\uff0c\u63d0\u5347\u5b89\u5168\u5408\u89c4\u9a7e\u9a76\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent work on image content manipulation based on vision-language pre-training models has been effectively extended to text-driven 3D scene editing. However, existing schemes for 3D scene editing still have certain shortcomings, hindering their further development as interactive design tools. Such schemes typically adhere to fixed input patterns, limiting flexibility in text input. Furthermore, their editing capabilities are constrained by a single or a few 2D visual models and require intricate pipeline design to integrate these models into 3D reconstruction processes. To address the aforementioned issues, we propose the Hash-Atlas network, which reformulates 3D scene editing as operations on 2D atlas images, thereby achieving a workflow decoupling of the 2D editing and 3D reconstruction processes. Building on this foundation, we introduce a dialogue-based 3D scene editing approach, termed CE3D++, which is centered on a large language model (LLM) that allows arbitrary textual input from users and interprets their intentions, subsequently facilitating the autonomous invocation of the corresponding visual models. Additionally, we extend CE3D++ to monocular 4D scenes by imposing motion constraints on moving objects and further fine-tuning the LLM by creating a trajectory dataset related to editing tasks, which enables the smaller LLM to schedule up to 30 different visual tools accurately. Experimental results demonstrate that CE3D++ effectively integrates multiple visual models to achieve diverse visual editing effects, possessing strong scene comprehension and multi-round dialog capabilities. The source codes and trained models are available at https://github.com/Fangkang515/CE3D.", "arxiv_id": "2608.29137", "arxiv_url": "https://arxiv.org/abs/2608.29137", "authors": ["Shuangkang Fang", "Yufeng Wang", "Yi-Hsuan Tsai", "Wenrui Ding", "Yi Yang", "Shuchang Zhou", "Ming-Hsuan Yang"], "brief": "\u8bba\u6587\u63d0\u51fa CE3D++\uff0c\u7528\u5927\u8bed\u8a00\u6a21\u578b\u7406\u89e3\u4efb\u610f\u6587\u672c\u6307\u4ee4\u5e76\u81ea\u52a8\u8c03\u7528\u591a\u79cd\u89c6\u89c9\u5de5\u5177\uff0c\u5b9e\u73b0\u4ea4\u4e92\u5f0f 3D \u573a\u666f\u7f16\u8f91\u3002\u5176 Hash-Atlas \u7f51\u7edc\u5c06 3D \u7f16\u8f91\u8f6c\u5316\u4e3a 2D atlas \u56fe\u50cf\u64cd\u4f5c\uff0c\u89e3\u8026\u4e8c\u7ef4\u7f16\u8f91\u4e0e\u4e09\u7ef4\u91cd\u5efa\uff0c\u5e76\u8fdb\u4e00\u6b65\u6269\u5c55\u5230\u5355\u76ee 4D \u52a8\u6001\u573a\u666f\u7f16\u8f91\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u6574\u5408\u591a\u8fbe 30 \u4e2a\u89c6\u89c9\u6a21\u578b\uff0c\u652f\u6301\u591a\u8f6e\u5bf9\u8bdd\u3001\u590d\u6742\u610f\u56fe\u7406\u89e3\u548c\u591a\u6837\u5316\u7f16\u8f91\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29137", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u7f16\u8f91", "\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29137v1", "published_at": "2026-08-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Chat-Edit-3D++: Interactive 3D and 4D Scene Editing via Large Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa CE3D++\uff0c\u7528\u5927\u8bed\u8a00\u6a21\u578b\u7406\u89e3\u4efb\u610f\u6587\u672c\u6307\u4ee4\u5e76\u81ea\u52a8\u8c03\u7528\u591a\u79cd\u89c6\u89c9\u5de5\u5177\uff0c\u5b9e\u73b0\u4ea4\u4e92\u5f0f 3D \u573a\u666f\u7f16\u8f91\u3002\u5176 Hash-Atlas \u7f51\u7edc\u5c06 3D \u7f16\u8f91\u8f6c\u5316\u4e3a 2D atlas \u56fe\u50cf\u64cd\u4f5c\uff0c\u89e3\u8026\u4e8c\u7ef4\u7f16\u8f91\u4e0e\u4e09\u7ef4\u91cd\u5efa\uff0c\u5e76\u8fdb\u4e00\u6b65\u6269\u5c55\u5230\u5355\u76ee 4D \u52a8\u6001\u573a\u666f\u7f16\u8f91\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u6574\u5408\u591a\u8fbe 30 \u4e2a\u89c6\u89c9\u6a21\u578b\uff0c\u652f\u6301\u591a\u8f6e\u5bf9\u8bdd\u3001\u590d\u6742\u610f\u56fe\u7406\u89e3\u548c\u591a\u6837\u5316\u7f16\u8f91\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal safety moderation requires distinguishing risks arising from visual content, user intent, and assistant behavior. Existing safeguards, however, are typically trained for a single judgment target and reduce safety assessment to a binary decision. Consequently, risk becomes difficult to compare across a multimodal interaction, and ambiguous cases are obscured. We introduce SafeAtlas-VL, a dataset of 1.5M training instances that places image-, request-, and response-level judgments on a five-level ordered scale. We curate a broad collection of safety-relevant data from both real-world and synthetic sources and apply a disagreement-aware annotation procedure. The resulting dataset spans 15 harm categories and 55 fine-grained subcategories, covering a broad range of multimodal safety scenarios. We also construct SafeAtlas-Bench, a held-out set of 5,000 instances for evaluating five-level predictions and continuous risk scores. Upon this dataset, we train the SafeAtlas Guard series of models via target-conditioned tuning for multimodal safety detection. Our models not only perform five-way classification of safety levels but also map safety to continuous scores through a soft cumulative ordinal head. Experimental results demonstrate that guard models trained on our dataset exhibit strong generalization: even without using the training sets of other benchmarks, they achieve competitive performance on the corresponding test sets. Notably, our 8B model attains the overall best performance, outperforming the previous SOTA by approximately 4% in F1 score. Code, data, and models are released to support further research. Warning: this paper contains example data that may be offensive, harmful, graphic, or disturbing.", "arxiv_id": "2608.29098", "arxiv_url": "https://arxiv.org/abs/2608.29098", "authors": ["Zongrui Wang", "Xiangyang Zhu", "Sicheng Wang", "Han Wang", "Dingyi Rong", "Zeyu Zhang", "Chunyi Li", "Yue Shi", "Kaiwei Zhang", "Zicheng Zhang", "Yuan Tian", "Qi Jia", "Yan Teng", "Wei Sun", "Ning Liu", "Guangtao Zhai"], "brief": "SafeAtlas-VL \u63d0\u51fa\u4e00\u4e2a\u5305\u542b 150 \u4e07\u591a\u6a21\u6001\u5b89\u5168\u6837\u672c\u7684\u6570\u636e\u96c6\uff0c\u5c06\u56fe\u50cf\u3001\u8bf7\u6c42\u548c\u56de\u590d\u7684\u98ce\u9669\u90fd\u6807\u6ce8\u4e3a\u4e94\u7ea7\u6709\u5e8f\u5b89\u5168\u7b49\u7ea7\uff0c\u5e76\u8986\u76d6 15 \u7c7b\u5371\u5bb3\u4e0e 55 \u4e2a\u7ec6\u5206\u7c7b\u522b\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u8bad\u7ec3\u7684 SafeAtlas Guard \u53ef\u8fdb\u884c\u591a\u6a21\u6001\u5b89\u5168\u68c0\u6d4b\u4e0e\u8fde\u7eed\u98ce\u9669\u8bc4\u5206\uff0c8B \u6a21\u578b\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u6cdb\u5316\u826f\u597d\uff0cF1 \u76f8\u6bd4\u6b64\u524d SOTA \u63d0\u5347\u7ea6 4%\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29098", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5b89\u5168\u5bf9\u9f50", "\u6570\u636e\u96c6", "\u5b89\u5168\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29098v1", "published_at": "2026-08-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SafeAtlas-VL: Beyond Binary Multimodal Safety with Large-Scale Data and Guard Models", "tldr": "SafeAtlas-VL \u63d0\u51fa\u4e00\u4e2a\u5305\u542b 150 \u4e07\u591a\u6a21\u6001\u5b89\u5168\u6837\u672c\u7684\u6570\u636e\u96c6\uff0c\u5c06\u56fe\u50cf\u3001\u8bf7\u6c42\u548c\u56de\u590d\u7684\u98ce\u9669\u90fd\u6807\u6ce8\u4e3a\u4e94\u7ea7\u6709\u5e8f\u5b89\u5168\u7b49\u7ea7\uff0c\u5e76\u8986\u76d6 15 \u7c7b\u5371\u5bb3\u4e0e 55 \u4e2a\u7ec6\u5206\u7c7b\u522b\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u8bad\u7ec3\u7684 SafeAtlas Guard \u53ef\u8fdb\u884c\u591a\u6a21\u6001\u5b89\u5168\u68c0\u6d4b\u4e0e\u8fde\u7eed\u98ce\u9669\u8bc4\u5206\uff0c8B \u6a21\u578b\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u6cdb\u5316\u826f\u597d\uff0cF1 \u76f8\u6bd4\u6b64\u524d SOTA \u63d0\u5347\u7ea6 4%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
