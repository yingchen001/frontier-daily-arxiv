ou Yang", "Di Weng", "Yingcai Wu"], "brief": "\u8bba\u6587\u63d0\u51fa BIRD-History \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 Text-to-SQL \u7cfb\u7edf\u80fd\u5426\u4ece\u5386\u53f2 SQL \u67e5\u8be2\u4e2d\u5229\u7528\u9690\u542b\u9886\u57df\u77e5\u8bc6\u6765\u56de\u7b54\u6b20\u660e\u786e\u95ee\u9898\u3002\u8be5\u57fa\u51c6\u5305\u542b 11 \u4e2a\u6570\u636e\u5e93\u4e0a\u7684 1393 \u4e2a\u4efb\u52a1\uff0c\u5e76\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u77e5\u8bc6\u6807\u6ce8\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29345", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u4e2a\u4efb\u52a1\u6807\u6ce8\u54ea\u4e9b\u5386\u53f2\u67e5\u8be2\u5305\u542b\u76f8\u5173\u77e5\u8bc6\uff0c\u4ee5\u53ca\u54ea\u4e9b SQL \u5b50\u53e5\u7f16\u7801\u4e86\u8fd9\u4e9b\u77e5\u8bc6\uff0c\u53ef\u540c\u65f6\u8bc4\u4f30\u68c0\u7d22\u4e0e\u77e5\u8bc6\u5229\u7528\u80fd\u529b", "\u63d0\u51fa\u53ef\u63d2\u62d4\u68c0\u7d22\u5668\uff0c\u4ece\u5386\u53f2 SQL \u811a\u672c\u4e2d\u62bd\u53d6 5 \u7c7b\u5916\u90e8\u77e5\u8bc6\uff0c\u5e76\u68c0\u7d22\u3001\u91cd\u6392\u76f8\u5173\u7247\u6bb5\u8f85\u52a9 SQL \u751f\u6210", "\u8be5\u65b9\u6cd5\u65e0\u9700\u4fee\u6539\u63d0\u793a\u5373\u53ef\u63a5\u5165\u73b0\u6709 few-shot Text-to-SQL \u6d41\u6c34\u7ebf\uff0c\u5e76\u5728 4 \u4e2a\u7cfb\u7edf\u4e0a\u5e26\u6765\u7a33\u5b9a\u63d0\u5347"], "keywords": ["Text-to-SQL", "\u4fe1\u606f\u68c0\u7d22", "\u6570\u636e\u96c6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29345v1", "published_at": "2026-08-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "BIRD-History: A Benchmark for History-Driven Text-to-SQL with Fine-Grained Knowledge Annotations", "tldr": "\u7528\u5386\u53f2SQL\u65e5\u5fd7\u589e\u5f3a\u6b20\u660e\u786eText-to-SQL", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BIRD-History \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 Text-to-SQL \u7cfb\u7edf\u80fd\u5426\u4ece\u5386\u53f2 SQL \u67e5\u8be2\u4e2d\u5229\u7528\u9690\u542b\u9886\u57df\u77e5\u8bc6\u6765\u56de\u7b54\u6b20\u660e\u786e\u95ee\u9898\u3002\u8be5\u57fa\u51c6\u5305\u542b 11 \u4e2a\u6570\u636e\u5e93\u4e0a\u7684 1393 \u4e2a\u4efb\u52a1\uff0c\u5e76\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u77e5\u8bc6\u6807\u6ce8\u3002", "why_notable": "\u73b0\u6709 Text-to-SQL \u57fa\u51c6\u8f83\u5c11\u8986\u76d6\u4f9d\u8d56\u4e1a\u52a1\u903b\u8f91\u3001\u6570\u636e\u7ea6\u5b9a\u7b49\u9690\u542b\u77e5\u8bc6\u7684\u771f\u5b9e\u573a\u666f\uff1bBIRD-History \u4e3a\u5386\u53f2\u65e5\u5fd7\u9a71\u52a8\u7684\u6570\u636e\u5e93\u95ee\u7b54\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u9645\u7684\u8bc4\u6d4b\u4e0e\u53ef\u590d\u73b0\u5b9e\u9a8c\u57fa\u7840\u3002"}, {"abstract": "Larger batches reduce the variance of stochastic gradients per update and are therefore often expected to accelerate training. Yet whether this statistical benefit translates into lower wall-clock time-to-target remains unclear, because each update consumes more samples and may take longer to execute. We study this tradeoff in reinforcement learning for large language models. We separate its algorithmic and systems effects by comparing learning and execution along their natural axes. At the algorithmic level, we compare configurations at equal cumulative sample counts while retuning batch-dependent hyperparameters. Over a bounded range of batch sizes, this procedure yields an approximately batch-size-invariant family whose members follow similar sample-indexed learning trajectories. At the systems level, we exploit the computational asymmetry between rollout generation and training: autoregressive generation is often memory-bandwidth-bound at low concurrency, whereas training work scales approximately with the number of processed tokens. Combining these two views yields a direct decision rule: a larger-batch configuration reduces time-to-target only when its throughput gain exceeds its samples-to-target penalty. Experiments with GRPO and PPO support both sides of this decomposition. At the algorithmic level, square-root learning-rate scaling with Adam produces approximately batch-size-invariant learning curves over a bounded range of batch sizes. At the systems level, larger batches improve generation throughput by up to 2.29x on fixed hardware. In GRPO, combining higher throughput with learning-rate retuning reduces time-to-target by up to 29%, whereas increasing the batch without retuning is slower despite its higher throughput.", "arxiv_id": "2608.29296", "arxiv_url": "https://arxiv.org/abs/2608.29296", "authors": ["Ziniu Li", "Jinbo Wang", "Guanhua Huang", "Feiyuan Zhang", "Pengbo Li", "Alex Chen"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5927\u6279\u91cf\u5728\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u6536\u76ca\u8fb9\u754c\uff0c\u5c06\u7b97\u6cd5\u5c42\u9762\u7684\u6837\u672c\u6548\u7387\u4e0e\u7cfb\u7edf\u5c42\u9762\u7684\u541e\u5410\u63d0\u5347\u5206\u79bb\u5206\u6790\u3002\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u7b80\u5355\u5224\u636e\uff1a\u53ea\u6709\u5f53\u541e\u5410\u589e\u76ca\u8d85\u8fc7\u8fbe\u5230\u76ee\u6807\u6240\u9700\u6837\u672c\u6570\u60e9\u7f5a\u65f6\uff0c\u5927\u6279\u91cf\u624d\u4f1a\u964d\u4f4e\u603b\u8bad\u7ec3\u65f6\u95f4\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29296", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u76f8\u540c\u7d2f\u8ba1\u6837\u672c\u6570\u4e0b\u6bd4\u8f83\u4e0d\u540cbatch\uff0c\u5e76\u91cd\u65b0\u8c03\u4f18batch\u76f8\u5173\u8d85\u53c2\u6570\uff0c\u53ef\u5f97\u5230\u8fd1\u4f3cbatch\u4e0d\u53d8\u7684\u5b66\u4e60\u66f2\u7ebf\u65cf\u3002", "\u4f7f\u7528Adam\u65f6\uff0c\u5b66\u4e60\u7387\u6309\u5e73\u65b9\u6839\u7f29\u653e\u53ef\u5728\u6709\u9650batch\u8303\u56f4\u5185\u4fdd\u6301GRPO/PPO\u7684\u6837\u672c\u7d22\u5f15\u5b66\u4e60\u8f68\u8ff9\u76f8\u8fd1\u3002", "\u7cfb\u7edf\u5c42\u9762\u5927batch\u53ef\u5c06\u751f\u6210\u541e\u5410\u63d0\u5347\u6700\u9ad82.29\u500d\uff1b\u5728GRPO\u4e2d\u914d\u5408\u5b66\u4e60\u7387\u91cd\u8c03\u53ef\u4f7ftime-to-target\u6700\u591a\u964d\u4f4e29%\uff0c\u4e0d\u8c03\u53c2\u5219\u53ef\u80fd\u66f4\u6162\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bad\u7ec3\u6548\u7387", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29296v1", "published_at": "2026-08-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Do Larger Batches Help Scale LLM Reinforcement Learning?", "tldr": "\u5927\u6279\u91cf\u9700\u914d\u5408\u8c03\u53c2\u624d\u52a0\u901fLLM\u5f3a\u5316\u5b66\u4e60", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5927\u6279\u91cf\u5728\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u6536\u76ca\u8fb9\u754c\uff0c\u5c06\u7b97\u6cd5\u5c42\u9762\u7684\u6837\u672c\u6548\u7387\u4e0e\u7cfb\u7edf\u5c42\u9762\u7684\u541e\u5410\u63d0\u5347\u5206\u79bb\u5206\u6790\u3002\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u7b80\u5355\u5224\u636e\uff1a\u53ea\u6709\u5f53\u541e\u5410\u589e\u76ca\u8d85\u8fc7\u8fbe\u5230\u76ee\u6807\u6240\u9700\u6837\u672c\u6570\u60e9\u7f5a\u65f6\uff0c\u5927\u6279\u91cf\u624d\u4f1a\u964d\u4f4e\u603b\u8bad\u7ec3\u65f6\u95f4\u3002", "why_notable": "\u8bba\u6587\u6f84\u6e05\u4e86\u201c\u5927batch\u662f\u5426\u66f4\u5feb\u201d\u8fd9\u4e00LLM\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4e2d\u7684\u5173\u952e\u5de5\u7a0b\u95ee\u9898\uff0c\u7ed9\u51fa\u517c\u987e\u7b97\u6cd5\u6837\u672c\u6548\u7387\u4e0e\u7cfb\u7edf\u541e\u5410\u7684\u5b9e\u7528\u51b3\u7b56\u89c4\u5219\uff0c\u5bf9\u964d\u4f4eRLHF/RLAIF\u7c7b\u8bad\u7ec3\u6210\u672c\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Unified multimodal models jointly support understanding and generation, but incur substantial redundant computation across tokens, layers, and generation timesteps. Through token-importance probing, we identify an asymmetric core-expansion structure: understanding exhibits a stable importance component, while generation largely shares this component but requires progress-dependent corrections. We therefore propose CE-Router, which uses a task-shared core scorer and progress-conditioned generation expansions, optimized through generation decomposition and cross-task core alignment. At inference, CE-Router compacts token computation and supplies a learned routing signal to Unified Computation Scheduling, which coordinates layer skipping, FFN pruning, diffusion-head cache reuse, and denoising-step early exit. Experiments on two representative UMM architectures demonstrate consistent quality--efficiency improvements across both tasks, retaining 98.03\\% of dense understanding performance with a 1.93$\\times$ end-to-end inference speedup.", "arxiv_id": "2608.29291", "arxiv_url": "https://arxiv.org/abs/2608.29291", "authors": ["Wengyi Zhan", "Chenqian Yan", "Songwei Liu", "Mingbao Lin", "Rongrong Ji"], "brief": "\u8bba\u6587\u63d0\u51fa CE-Router\uff0c\u53d1\u73b0\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e2d\u7406\u89e3\u4e0e\u751f\u6210\u5b58\u5728\u5171\u4eab\u7684\u201c\u6838\u5fc3\u201d\u91cd\u8981 token \u7ed3\u6784\uff0c\u5e76\u4e3a\u751f\u6210\u9636\u6bb5\u52a0\u5165\u968f\u8fdb\u5ea6\u53d8\u5316\u7684\u6269\u5c55\u4fee\u6b63\u3002\u5b83\u8fdb\u4e00\u6b65\u7ed3\u5408\u7edf\u4e00\u8ba1\u7b97\u8c03\u5ea6\uff0c\u5728\u63a8\u7406\u65f6\u534f\u540c\u6267\u884c\u5c42\u8df3\u8fc7\u3001FFN \u526a\u679d\u3001\u6269\u6563\u5934\u7f13\u5b58\u590d\u7528\u548c\u53bb\u566a\u65e9\u9000\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29291", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7 token \u91cd\u8981\u6027\u63a2\u6d4b\u53d1\u73b0\u975e\u5bf9\u79f0 core-expansion \u7ed3\u6784\uff1a\u7406\u89e3\u4efb\u52a1\u7684\u91cd\u8981\u7ec4\u4ef6\u66f4\u7a33\u5b9a\uff0c\u751f\u6210\u4efb\u52a1\u5927\u4f53\u5171\u4eab\u8be5\u7ec4\u4ef6\u4f46\u9700\u8981\u8fdb\u5ea6\u76f8\u5173\u4fee\u6b63\u3002", "CE-Router \u4f7f\u7528\u4efb\u52a1\u5171\u4eab\u6838\u5fc3\u8bc4\u5206\u5668\u4e0e\u751f\u6210\u8fdb\u5ea6\u6761\u4ef6\u6269\u5c55\uff0c\u5e76\u901a\u8fc7\u751f\u6210\u5206\u89e3\u548c\u8de8\u4efb\u52a1\u6838\u5fc3\u5bf9\u9f50\u4f18\u5316\u3002", "\u5728\u4e24\u7c7b\u4ee3\u8868\u6027\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e0a\uff0c\u4fdd\u7559 98.03% \u7684\u5bc6\u96c6\u7406\u89e3\u6027\u80fd\uff0c\u540c\u65f6\u5b9e\u73b0 1.93 \u500d\u7aef\u5230\u7aef\u63a8\u7406\u52a0\u901f\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u63a8\u7406\u52a0\u901f", "\u6a21\u578b\u538b\u7f29", "\u8ba1\u7b97\u8c03\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29291v1", "published_at": "2026-08-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Accelerating Unified Multimodal Models with Core-Expansion Routing and Unified Computation Scheduling", "tldr": "\u7528\u6838\u5fc3-\u6269\u5c55\u8def\u7531\u52a0\u901f\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CE-Router\uff0c\u53d1\u73b0\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e2d\u7406\u89e3\u4e0e\u751f\u6210\u5b58\u5728\u5171\u4eab\u7684\u201c\u6838\u5fc3\u201d\u91cd\u8981 token \u7ed3\u6784\uff0c\u5e76\u4e3a\u751f\u6210\u9636\u6bb5\u52a0\u5165\u968f\u8fdb\u5ea6\u53d8\u5316\u7684\u6269\u5c55\u4fee\u6b63\u3002\u5b83\u8fdb\u4e00\u6b65\u7ed3\u5408\u7edf\u4e00\u8ba1\u7b97\u8c03\u5ea6\uff0c\u5728\u63a8\u7406\u65f6\u534f\u540c\u6267\u884c\u5c42\u8df3\u8fc7\u3001FFN \u526a\u679d\u3001\u6269\u6563\u5934\u7f13\u5b58\u590d\u7528\u548c\u53bb\u566a\u65e9\u9000\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u6a21\u6001\u7406\u89e3\u4e0e\u751f\u6210\u4e2d\u7684\u5197\u4f59\u8ba1\u7b97\u7edf\u4e00\u5efa\u6a21\uff0c\u5e76\u5c06 learned routing \u4e0e\u591a\u79cd\u63a8\u7406\u52a0\u901f\u624b\u6bb5\u8054\u5408\u8c03\u5ea6\uff0c\u517c\u987e\u8d28\u91cf\u4fdd\u6301\u4e0e\u5b9e\u9645\u7aef\u5230\u7aef\u52a0\u901f\uff0c\u5bf9\u90e8\u7f72\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As Multimodal Large Language Models (MLLMs) evolve into sophisticated interactive assistants, their reliability depends not only on following instructions but also on validating them. We define Proactive Critique as the model\u0027s autonomous ability to identify, analyze and fix faulty user inputs without extra prompts. However, evaluations mainly test models under ideal circumstances or simple refusal behaviors, largely ignoring active error processing. To fill this gap, we propose MMPCBench, a comprehensive framework for evaluating MLLMs\u0027 proactive critique competence. It features a fine-grained taxonomy of 4 primary error types spanning 12 subcategories, ranging from cross-modal contradictions to missing visual premises. We adopt a hierarchical evaluation protocol to measure models\u0027 error detection, diagnosis and resolution performance, and apply alignment-aware metrics to assess the coherence between internal reasoning and final responses. Tests on 14 mainstream MLLMs show obvious weaknesses in proactive critique, especially in dealing with subtle visual anomalies. Notably, we identify a pervasive \"consistency gap\": reasoning models can often correctly identify and analyze errors during internal reasoning yet suppress these valid insights in final outputs to prioritize response compliance. The code and data is available at https://github.com/ALIENS32/MMPCBench.", "arxiv_id": "2608.29286", "arxiv_url": "https://arxiv.org/abs/2608.29286", "authors": ["Jinzhe Li", "Gengxu Li", "Jinnan Li", "Yuan Wu", "Yi Chang"], "brief": "\u8bba\u6587\u63d0\u51fa MMPCBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u65e0\u9700\u989d\u5916\u63d0\u793a\u65f6\u4e3b\u52a8\u8bc6\u522b\u3001\u5206\u6790\u5e76\u4fee\u590d\u7528\u6237\u9519\u8bef\u8f93\u5165\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u8de8\u6a21\u6001\u77db\u76fe\u3001\u7f3a\u5931\u89c6\u89c9\u524d\u63d0\u7b494\u7c7b12\u4e2a\u7ec6\u5206\u9519\u8bef\uff0c\u5e76\u8bbe\u8ba1\u5206\u5c42\u8bc4\u6d4b\u534f\u8bae\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29286", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b9a\u4e49\u201c\u4e3b\u52a8\u6279\u5224\u201d\u80fd\u529b\uff1a\u6a21\u578b\u9700\u81ea\u4e3b\u5b8c\u6210\u9519\u8bef\u68c0\u6d4b\u3001\u9519\u8bef\u8bca\u65ad\u4e0e\u89e3\u51b3\u65b9\u6848\u751f\u6210", "\u6784\u5efa\u7ec6\u7c92\u5ea6\u9519\u8bef\u5206\u7c7b\u4f53\u7cfb\uff0c\u6db5\u76d64\u4e2a\u4e00\u7ea7\u9519\u8bef\u7c7b\u578b\u548c12\u4e2a\u5b50\u7c7b\uff0c\u91cd\u70b9\u5305\u62ec\u89c6\u89c9\u5f02\u5e38\u4e0e\u8de8\u6a21\u6001\u4e0d\u4e00\u81f4", "\u8bc4\u6d4b14\u4e2a\u4e3b\u6d41\u591a\u6a21\u6001\u5927\u6a21\u578b\uff0c\u53d1\u73b0\u5176\u5728\u7ec6\u5fae\u89c6\u89c9\u5f02\u5e38\u5904\u7406\u4e0a\u666e\u904d\u8584\u5f31\uff0c\u5e76\u5b58\u5728\u63a8\u7406\u4e0e\u6700\u7ec8\u56de\u7b54\u4e0d\u4e00\u81f4\u7684\u201c\u4e00\u81f4\u6027\u9e3f\u6c9f\u201d"], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u8bc4\u6d4b", "\u53ef\u4fe1AI", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29286v1", "published_at": "2026-08-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MMPCBench: Benchmarking Multimodal Large Language Models on Proactive Critique of Flawed Inputs", "tldr": "\u8bc4\u6d4b\u591a\u6a21\u6001\u6a21\u578b\u4e3b\u52a8\u53d1\u73b0\u5e76\u4fee\u6b63\u9519\u8bef\u8f93\u5165", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MMPCBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u65e0\u9700\u989d\u5916\u63d0\u793a\u65f6\u4e3b\u52a8\u8bc6\u522b\u3001\u5206\u6790\u5e76\u4fee\u590d\u7528\u6237\u9519\u8bef\u8f93\u5165\u7684\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u8de8\u6a21\u6001\u77db\u76fe\u3001\u7f3a\u5931\u89c6\u89c9\u524d\u63d0\u7b494\u7c7b12\u4e2a\u7ec6\u5206\u9519\u8bef\uff0c\u5e76\u8bbe\u8ba1\u5206\u5c42\u8bc4\u6d4b\u534f\u8bae\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u6a21\u6001\u6a21\u578b\u8bc4\u6d4b\u4ece\u201c\u6309\u6307\u4ee4\u56de\u7b54\u201d\u63a8\u8fdb\u5230\u201c\u4e3b\u52a8\u6821\u9a8c\u8f93\u5165\u53ef\u9760\u6027\u201d\uff0c\u63ed\u793a\u4e86\u6a21\u578b\u4e3a\u8fce\u5408\u7528\u6237\u6307\u4ee4\u800c\u538b\u5236\u6b63\u786e\u5185\u90e8\u5224\u65ad\u7684\u98ce\u9669\uff0c\u5bf9\u63d0\u5347\u4ea4\u4e92\u5f0f\u52a9\u624b\u7684\u9c81\u68d2\u6027\u4e0e\u53ef\u4fe1\u5ea6\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language-Action (VLA) models demonstrate strong semantic understanding yet exhibit systematic failures during deployment. The conditions under which these failures occur, and whether they can be corrected without retraining, remain poorly understood. In this paper, we take steps toward addressing this gap. We present CorrectVLA, a framework that translates task-level natural language corrections into additive action magnitude adjustments without modifying policy weights. A human provides a single task-level correction, applied uniformly across all rollouts without per-episode intervention. In simulation, CorrectVLA recovers execution misalignment failures across both in-distribution and OOD tasks. In real-robot experiments on a UFactory xArm7 under environment shift, CorrectVLA restores near-perfect success where the base policy almost entirely breaks down, generalizing across object locations and identities. Through a taxonomy of failure modes on LIBERO-90, we find that execution misalignment failures, where the policy reaches the correct target but miscalibrates action magnitudes, represent the correctable subset, while other failure modes where semantic comprehension itself breaks down are not amenable to this approach. The approach succeeds when policies possess strategic correctness and fails when fundamental comprehension is absent, establishing a practical operational boundary for inference-time correction.", "arxiv_id": "2608.29967", "arxiv_url": "https://arxiv.org/abs/2608.29967", "authors": ["Owen Kwon", "Pablo Ortega-Kral", "Arthur Bucker", "Jean Oh"], "brief": "\u8bba\u6587\u63d0\u51fa CorrectVLA\uff0c\u5c06\u4efb\u52a1\u7ea7\u81ea\u7136\u8bed\u8a00\u7ea0\u6b63\u8f6c\u6362\u4e3a\u5bf9\u52a8\u4f5c\u5e45\u5ea6\u7684\u52a0\u6027\u8c03\u6574\uff0c\u65e0\u9700\u4fee\u6539\u6216\u91cd\u8bad\u7ec3\u7b56\u7565\u6743\u91cd\u3002\u8be5\u65b9\u6cd5\u7528\u4e00\u6b21\u4eba\u7c7b\u7ea0\u6b63\u7edf\u4e00\u4f5c\u7528\u4e8e\u540e\u7eed\u6267\u884c\uff0c\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u68b0\u81c2\u73af\u5883\u4e2d\u4fee\u590d VLA \u6a21\u578b\u7684\u6267\u884c\u9519\u4f4d\u95ee\u9898\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29967", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u81ea\u7136\u8bed\u8a00\u53cd\u9988\u6620\u5c04\u4e3a\u52a8\u4f5c\u5e45\u5ea6\u6821\u51c6\uff0c\u7528\u63a8\u7406\u65f6\u4fee\u6b63\u66ff\u4ee3\u8bad\u7ec3\u65f6\u66f4\u65b0", "\u5728\u4eff\u771f\u4e2d\u53ef\u6062\u590d\u5206\u5e03\u5185\u4e0e\u5206\u5e03\u5916\u4efb\u52a1\u7684\u6267\u884c\u9519\u4f4d\u5931\u8d25", "\u5728 UFactory xArm7 \u771f\u5b9e\u673a\u5668\u4eba\u73af\u5883\u53d8\u5316\u4e0b\uff0c\u4f7f\u51e0\u4e4e\u5931\u6548\u7684\u57fa\u7840\u7b56\u7565\u6062\u590d\u5230\u63a5\u8fd1\u5b8c\u7f8e\u6210\u529f\u7387"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8bed\u8a00\u53cd\u9988", "\u63a8\u7406\u65f6\u6821\u6b63"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29967v1", "published_at": "2026-08-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Training-Free Action Correction for VLA Model Failures via Language Feedback", "tldr": "\u7528\u8bed\u8a00\u53cd\u9988\u514d\u8bad\u7ec3\u7ea0\u6b63VLA\u52a8\u4f5c\u504f\u5dee", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CorrectVLA\uff0c\u5c06\u4efb\u52a1\u7ea7\u81ea\u7136\u8bed\u8a00\u7ea0\u6b63\u8f6c\u6362\u4e3a\u5bf9\u52a8\u4f5c\u5e45\u5ea6\u7684\u52a0\u6027\u8c03\u6574\uff0c\u65e0\u9700\u4fee\u6539\u6216\u91cd\u8bad\u7ec3\u7b56\u7565\u6743\u91cd\u3002\u8be5\u65b9\u6cd5\u7528\u4e00\u6b21\u4eba\u7c7b\u7ea0\u6b63\u7edf\u4e00\u4f5c\u7528\u4e8e\u540e\u7eed\u6267\u884c\uff0c\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u68b0\u81c2\u73af\u5883\u4e2d\u4fee\u590d VLA \u6a21\u578b\u7684\u6267\u884c\u9519\u4f4d\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u660e\u786e\u4e86 VLA \u6a21\u578b\u53ef\u88ab\u514d\u8bad\u7ec3\u7ea0\u6b63\u7684\u8fb9\u754c\uff1a\u5f53\u7b56\u7565\u8bed\u4e49\u7406\u89e3\u6b63\u786e\u4f46\u52a8\u4f5c\u5e45\u5ea6\u5931\u51c6\u65f6\u6709\u6548\uff0c\u800c\u8bed\u4e49\u7406\u89e3\u672c\u8eab\u5931\u8d25\u65f6\u65e0\u6548\u3002\u8fd9\u4e3a\u673a\u5668\u4eba\u90e8\u7f72\u4e2d\u7684\u4f4e\u6210\u672c\u6545\u969c\u4fee\u590d\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Transformers rely on position embedding mechanisms in long context modeling in most cases. Rotary Position Embedding (RoPE) embeds positional information with independent 2D rotations, forming relative position terms in self-attention. However, its pairwise, block-based, and decoupled structure limits deep mixing and robustness across channels. We propose HD-RoPE, which extends RoPE from independent 2D rotations to higher-dimensional rotations and introduces a Paley-I orthogonal basis to obtain balanced, isotropic, and dense phase mixing within each rotation subspace. This significantly enhances channel coupling and rotational degrees of freedom while maintaining orthogonal stability and the relative position closure property. Furthermore, HD-RoPE is easily optimized for engineering efficiency without introducing additional trainable parameters. We have conducted extensive evaluation results demonstrating that HD-RoPE achieves significant performance improvements over standard RoPE across various popular benchmarks and in both long and short contexts.", "arxiv_id": "2608.29715", "arxiv_url": "https://arxiv.org/abs/2608.29715", "authors": ["Yixing Li", "Ruobing Xie", "Yudong Zhang", "Yushi Bai", "Samm Sun", "Yu Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa HD-RoPE\uff0c\u628a\u6807\u51c6 RoPE \u7684\u72ec\u7acb\u4e8c\u7ef4\u65cb\u8f6c\u63a8\u5e7f\u4e3a\u9ad8\u7ef4\u65cb\u8f6c\uff0c\u5e76\u5f15\u5165 Paley-I \u6b63\u4ea4\u57fa\u5b9e\u73b0\u66f4\u5747\u8861\u3001\u5404\u5411\u540c\u6027\u3001\u7a20\u5bc6\u7684\u76f8\u4f4d\u6df7\u5408\u3002\u8be5\u65b9\u6cd5\u4fdd\u6301\u6b63\u4ea4\u7a33\u5b9a\u6027\u548c\u76f8\u5bf9\u4f4d\u7f6e\u95ed\u5305\u6027\u8d28\uff0c\u4e14\u4e0d\u589e\u52a0\u53ef\u8bad\u7ec3\u53c2\u6570\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29715", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u6210\u5bf9\u4e8c\u7ef4\u65cb\u8f6c\u6539\u4e3a\u9ad8\u7ef4\u65cb\u8f6c\u5b50\u7a7a\u95f4\uff0c\u589e\u5f3a\u901a\u9053\u95f4\u8026\u5408\u4e0e\u65cb\u8f6c\u81ea\u7531\u5ea6\u3002", "\u4f7f\u7528 Paley-I \u6b63\u4ea4\u57fa\u6539\u5584\u76f8\u4f4d\u6df7\u5408\u7684\u5747\u8861\u6027\u3001\u5404\u5411\u540c\u6027\u548c\u9c81\u68d2\u6027\u3002", "\u5728\u957f\u4e0a\u4e0b\u6587\u548c\u77ed\u4e0a\u4e0b\u6587\u3001\u591a\u7c7b\u57fa\u51c6\u4e0a\u76f8\u8f83\u6807\u51c6 RoPE \u53d6\u5f97\u663e\u8457\u6027\u80fd\u63d0\u5347\uff0c\u5e76\u53ef\u505a\u5de5\u7a0b\u4f18\u5316\u3002"], "keywords": ["\u4f4d\u7f6e\u7f16\u7801", "\u957f\u4e0a\u4e0b\u6587", "Transformer", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29715v1", "published_at": "2026-08-30", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Higher-Dimensional Rotary Position Embedding", "tldr": "\u5c06RoPE\u6269\u5c55\u5230\u9ad8\u7ef4\u65cb\u8f6c\u4ee5\u589e\u5f3a\u4f4d\u7f6e\u7f16\u7801\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HD-RoPE\uff0c\u628a\u6807\u51c6 RoPE \u7684\u72ec\u7acb\u4e8c\u7ef4\u65cb\u8f6c\u63a8\u5e7f\u4e3a\u9ad8\u7ef4\u65cb\u8f6c\uff0c\u5e76\u5f15\u5165 Paley-I \u6b63\u4ea4\u57fa\u5b9e\u73b0\u66f4\u5747\u8861\u3001\u5404\u5411\u540c\u6027\u3001\u7a20\u5bc6\u7684\u76f8\u4f4d\u6df7\u5408\u3002\u8be5\u65b9\u6cd5\u4fdd\u6301\u6b63\u4ea4\u7a33\u5b9a\u6027\u548c\u76f8\u5bf9\u4f4d\u7f6e\u95ed\u5305\u6027\u8d28\uff0c\u4e14\u4e0d\u589e\u52a0\u53ef\u8bad\u7ec3\u53c2\u6570\u3002", "why_notable": "RoPE \u662f\u5f53\u524d\u5927\u8bed\u8a00\u6a21\u578b\u957f\u4e0a\u4e0b\u6587\u5efa\u6a21\u7684\u6838\u5fc3\u7ec4\u4ef6\u4e4b\u4e00\uff0cHD-RoPE \u5728\u4e0d\u5f15\u5165\u989d\u5916\u53ef\u8bad\u7ec3\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u6539\u8fdb\u5176\u8868\u8fbe\u80fd\u529b\u548c\u9c81\u68d2\u6027\uff0c\u5177\u6709\u8f83\u9ad8\u7684\u6a21\u578b\u67b6\u6784\u4e0e\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Frontier-model leaderboards now rank systems based on economic benchmarks, tests of how well models carry out professional tasks from software engineering to banking workflows, and those rankings inform what organisations buy, what regulators scrutinise, and expectations of how work will change. Whether such benchmarks measure a capability distinct from general test-taking, or re-express the one axis along which every benchmark rises as models improve, is a question of construct validity that has not yet been studied. We test it on a hash-pinned leaderboard snapshot of 421 model configurations across twelve benchmarks, four of them economic, treating benchmarks as items and models as respondents in a latent-variable model with four hypotheses and their thresholds fixed before analysis. A single factor explains 74.5% of common variance and tracks model release date (R^2 = 0.505), so the leading axis of capability is substantially a time trend; where prior work controls for scale, compute adds little once date is removed. Removing the date trend lowers that share by 14.9 points, and by 24.1 with one row per base model. Under the dimensionality rule fixed in advance the economic benchmarks form no distinct factor, yet a leave-one-benchmark-out test with factors re-estimated inside every fold shows that a multi-factor representation predicts held-out economic scores better than a single general index (pooled Delta-MSE 0.037, 95% bootstrap interval [0.019, 0.055]). Economic benchmarks therefore add incremental predictive information to a largely date-driven general factor, and the evidence does not support treating them as a distinct latent capability. Leaderboards remain a sound guide to overall progress, but most of the gap between models released months apart is calendar, so a small gap between contemporaneous models should be date-adjusted before being read as a capability difference.", "arxiv_id": "2608.29420", "arxiv_url": "https://arxiv.org/abs/2608.29420", "authors": ["Louis Yiven Zhu"], "brief": "\u672c\u6587\u8bc4\u4f30\u524d\u6cbf\u6a21\u578b\u6392\u884c\u699c\u4e2d\u201c\u7ecf\u6d4e\u57fa\u51c6\u201d\u7684\u6784\u5ff5\u6548\u5ea6\uff0c\u5206\u6790421\u4e2a\u6a21\u578b\u914d\u7f6e\u572812\u4e2a\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\u7ecf\u6d4e\u4efb\u52a1\u5e76\u4e0d\u6784\u6210\u72ec\u7acb\u6f5c\u5728\u80fd\u529b\uff0c\u800c\u662f\u5728\u5f3a\u70c8\u53d7\u53d1\u5e03\u65f6\u95f4\u9a71\u52a8\u7684\u901a\u7528\u80fd\u529b\u56e0\u5b50\u4e0a\u63d0\u4f9b\u589e\u91cf\u4fe1\u606f\u3002", "categories": ["cs.LG", "cs.CY", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29420", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5355\u4e00\u6f5c\u5728\u56e0\u5b50\u89e3\u91ca74.5%\u7684\u5171\u540c\u65b9\u5dee\uff0c\u5e76\u4e0e\u6a21\u578b\u53d1\u5e03\u65e5\u671f\u9ad8\u5ea6\u76f8\u5173\uff08R\u00b2=0.505\uff09\uff0c\u8bf4\u660e\u6392\u884c\u699c\u4e3b\u8f74\u5f88\u5927\u7a0b\u5ea6\u662f\u65f6\u95f4\u8d8b\u52bf\u3002", "\u53bb\u9664\u53d1\u5e03\u65e5\u671f\u8d8b\u52bf\u540e\uff0c\u5355\u56e0\u5b50\u89e3\u91ca\u7387\u4e0b\u964d14.9\u4e2a\u767e\u5206\u70b9\uff1b\u6309\u6bcf\u4e2a\u57fa\u7840\u6a21\u578b\u4ec5\u4fdd\u7559\u4e00\u884c\u65f6\u4e0b\u964d24.1\u4e2a\u767e\u5206\u70b9\u3002", "\u9884\u8bbe\u7ef4\u5ea6\u89c4\u5219\u4e0b\u7ecf\u6d4e\u57fa\u51c6\u672a\u5f62\u6210\u72ec\u7acb\u56e0\u5b50\uff0c\u4f46\u7559\u4e00\u57fa\u51c6\u4ea4\u53c9\u9a8c\u8bc1\u663e\u793a\u591a\u56e0\u5b50\u6a21\u578b\u80fd\u66f4\u597d\u9884\u6d4b\u7ecf\u6d4e\u57fa\u51c6\u5f97\u5206\uff08\u0394-MSE 0.037\uff09\u3002"], "keywords": ["\u6a21\u578b\u8bc4\u6d4b", "\u7ecf\u6d4e\u57fa\u51c6", "\u6f5c\u53d8\u91cf\u5206\u6790", "\u6392\u884c\u699c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29420v1", "published_at": "2026-08-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "One Capability or Many? Testing the Economic Validity of Frontier AI Evaluation", "tldr": "\u7ecf\u6d4e\u57fa\u51c6\u591a\u53cd\u6620\u6a21\u578b\u603b\u4f53\u8fdb\u6b65\u800c\u975e\u72ec\u7acb\u80fd\u529b", "upvotes": 0, "what_it_is": "\u672c\u6587\u8bc4\u4f30\u524d\u6cbf\u6a21\u578b\u6392\u884c\u699c\u4e2d\u201c\u7ecf\u6d4e\u57fa\u51c6\u201d\u7684\u6784\u5ff5\u6548\u5ea6\uff0c\u5206\u6790421\u4e2a\u6a21\u578b\u914d\u7f6e\u572812\u4e2a\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\u7ecf\u6d4e\u4efb\u52a1\u5e76\u4e0d\u6784\u6210\u72ec\u7acb\u6f5c\u5728\u80fd\u529b\uff0c\u800c\u662f\u5728\u5f3a\u70c8\u53d7\u53d1\u5e03\u65f6\u95f4\u9a71\u52a8\u7684\u901a\u7528\u80fd\u529b\u56e0\u5b50\u4e0a\u63d0\u4f9b\u589e\u91cf\u4fe1\u606f\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192\u7814\u7a76\u8005\u3001\u91c7\u8d2d\u65b9\u548c\u76d1\u7ba1\u8005\u8c28\u614e\u89e3\u8bfb\u7ecf\u6d4e\u57fa\u51c6\u6392\u884c\u699c\uff1a\u5b83\u4eec\u9002\u5408\u8861\u91cf\u603b\u4f53\u8fdb\u5c55\uff0c\u4f46\u4e0d\u80fd\u7b80\u5355\u89c6\u4e3a\u72ec\u7acb\u201c\u7ecf\u6d4e\u80fd\u529b\u201d\u7684\u8bc1\u636e\uff0c\u5c24\u5176\u5e94\u5bf9\u540c\u671f\u6a21\u578b\u4e4b\u95f4\u7684\u5c0f\u5dee\u8ddd\u505a\u65e5\u671f\u6821\u6b63\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) can assign similar confidence to answers that fail for different reasons. We propose HalluPrism, a behavioral diagnostic that re-runs an answer after visual degradation, blank-image replacement, and grounding or relation checks. These targeted probes yield a signature over visual-perturbation sensitivity (V ), image-removal confidence retention (L), and grounding/relation-probe instability (A). Across 58K+ examples from four benchmarks and four MLLMs, image-removal confidence retention is most prevalent, while grounding/relation-probe instability better separates failure families. Only 18 of 48 source-target checks are diagonally aligned, so the coordinates should be interpreted jointly rather than as independent causal sources. With the dataset fixed, the joint signature improves failure-family AUROC from 0.634 to 0.769 on HallusionBench and from 0.707 to 0.817 on VizWiz, with smaller gains on POPE and VSR. In pooled XGBoost analysis, AUROC rises from 0.78 with scalar confidence to 0.95 with (V, L, A) and 0.97 when confidence is added. The same signature does not automatically improve correctness ranking. The three tested direct scalarizations can harm it. These results separate failure diagnosis from abstention scoring: multimodal uncertainty should characterize failure structure before it is used to decide whether to abstain or correct.", "arxiv_id": "2608.29193", "arxiv_url": "https://arxiv.org/abs/2608.29193", "authors": ["Aman Prakash", "Sourish Dasgupta", "Tanmoy Chakraborty"], "brief": "\u8bba\u6587\u63d0\u51fa HalluPrism\uff0c\u4e00\u79cd\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u884c\u4e3a\u8bca\u65ad\u65b9\u6cd5\uff0c\u901a\u8fc7\u89c6\u89c9\u9000\u5316\u3001\u7a7a\u56fe\u66ff\u6362\u3001\u5b9a\u4f4d/\u5173\u7cfb\u63a2\u9488\u7b49\u91cd\u8dd1\u6d4b\u8bd5\uff0c\u523b\u753b\u6a21\u578b\u56de\u7b54\u5931\u8d25\u7684\u7ed3\u6784\u6027\u539f\u56e0\u3002\u7814\u7a76\u57284\u4e2a\u57fa\u51c6\u30014\u4e2aMLLM\u30015.8\u4e07\u4f59\u6837\u672c\u4e0a\u9a8c\u8bc1\u4e86\u5176\u8bca\u65ad\u80fd\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29193", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u4e09\u7ef4\u8bca\u65ad\u7b7e\u540d\uff1a\u89c6\u89c9\u6270\u52a8\u654f\u611f\u6027 V\u3001\u53bb\u56fe\u540e\u7f6e\u4fe1\u4fdd\u6301 L\u3001\u5b9a\u4f4d/\u5173\u7cfb\u63a2\u9488\u4e0d\u7a33\u5b9a\u6027 A\u3002", "\u8054\u5408\u7b7e\u540d\u663e\u8457\u63d0\u5347\u5931\u8d25\u5bb6\u65cf\u8bc6\u522b\u80fd\u529b\uff0c\u5982 HallusionBench AUROC \u4ece0.634\u5347\u81f30.769\uff0cVizWiz \u4ece0.707\u5347\u81f30.817\u3002", "\u76f8\u6bd4\u5355\u4e00\u7f6e\u4fe1\u5ea6\uff0cXGBoost \u4e2d\u4f7f\u7528 V/L/A \u53ef\u5c06 pooled AUROC \u4ece0.78\u63d0\u5347\u81f30.95\uff1b\u4f46\u8be5\u7b7e\u540d\u4e0d\u4e00\u5b9a\u6539\u5584\u6b63\u786e\u6027\u6392\u5e8f\u6216\u62d2\u7b54\u51b3\u7b56\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u68c0\u6d4b", "\u6a21\u578b\u8bc4\u4f30", "\u4e0d\u786e\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29193v1", "published_at": "2026-08-29", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "HalluPrism: When Multimodal Uncertainty Should Diagnose, Not Decide", "tldr": "\u7528\u591a\u6a21\u6001\u6270\u52a8\u8bca\u65ad\u5e7b\u89c9\u5931\u8d25\u7c7b\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HalluPrism\uff0c\u4e00\u79cd\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u884c\u4e3a\u8bca\u65ad\u65b9\u6cd5\uff0c\u901a\u8fc7\u89c6\u89c9\u9000\u5316\u3001\u7a7a\u56fe\u66ff\u6362\u3001\u5b9a\u4f4d/\u5173\u7cfb\u63a2\u9488\u7b49\u91cd\u8dd1\u6d4b\u8bd5\uff0c\u523b\u753b\u6a21\u578b\u56de\u7b54\u5931\u8d25\u7684\u7ed3\u6784\u6027\u539f\u56e0\u3002\u7814\u7a76\u57284\u4e2a\u57fa\u51c6\u30014\u4e2aMLLM\u30015.8\u4e07\u4f59\u6837\u672c\u4e0a\u9a8c\u8bc1\u4e86\u5176\u8bca\u65ad\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u591a\u6a21\u6001\u4e0d\u786e\u5b9a\u6027\u5e94\u5148\u7528\u4e8e\u8bca\u65ad\u5931\u8d25\u7ed3\u6784\uff0c\u800c\u975e\u76f4\u63a5\u51b3\u5b9a\u62d2\u7b54\u6216\u4fee\u6b63\uff0c\u4e3aMLLM\u5e7b\u89c9\u5206\u6790\u3001\u53ef\u9760\u6027\u8bc4\u4f30\u548c\u5b89\u5168\u90e8\u7f72\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u5de5\u5177\u3002"}, {"abstract": "Joint-Embedding Predictive Architectures (JEPAs) have shown strong potential for learning compact predictive representations, and LeWorldModel (LeWM) extends this paradigm to reconstruction-free latent world modeling from pixels. However, its deterministic autoregressive predictor generates future states through repeated one-step transitions, which can accumulate errors and remain sensitive to task-irrelevant visual perturbations. In this work, we propose Flow-JEPA (F-JEPA), a conditional flow matching dynamics model that jointly generates a sequence of future latent states conditioned on the current observation and actions. A Gaussian distribution serves as the flow source, exposing the vector field to perturbed latent trajectories as it learns to transport them toward clean future representations. This formulation retains the reconstruction-free JEPA framework while replacing point-wise transition regression with stochastic trajectory-level prediction. F-JEPA raises mean success from $86\\%$ to $92\\%$ under clean observations and from $67\\%$ to $86\\%$ under noisy conditions, suggesting that conditional flow matching provides a promising alternative to deterministic autoregressive dynamics in JEPA world models.", "arxiv_id": "2608.29029", "arxiv_url": "https://arxiv.org/abs/2608.29029", "authors": ["Yanchen Huo", "Ziying Song", "Yadan Luo"], "brief": "\u672c\u6587\u63d0\u51fa Flow-JEPA\uff0c\u7528\u6761\u4ef6\u6d41\u5339\u914d\u66ff\u4ee3 JEPA \u4e16\u754c\u6a21\u578b\u4e2d\u7684\u786e\u5b9a\u6027\u81ea\u56de\u5f52\u4e00\u6b65\u9884\u6d4b\uff0c\u76f4\u63a5\u751f\u6210\u672a\u6765\u6f5c\u5728\u72b6\u6001\u5e8f\u5217\u3002\u8be5\u65b9\u6cd5\u5728\u4fdd\u6301\u65e0\u91cd\u5efa\u6846\u67b6\u7684\u540c\u65f6\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5e72\u51c0\u89c2\u6d4b\u4e0b\u6210\u529f\u7387\u4ece 86% \u63d0\u5347\u5230 92%\uff0c\u566a\u58f0\u6761\u4ef6\u4e0b\u4ece 67% \u63d0\u5347\u5230 86%\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29029", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u6d41\u5339\u914d", "\u8868\u5f81\u5b66\u4e60", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29029v1", "published_at": "2026-08-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Flow-JEPA: Flow Matching for Robust Latent Dynamics in JEPA World Models", "tldr": "\u672c\u6587\u63d0\u51fa Flow-JEPA\uff0c\u7528\u6761\u4ef6\u6d41\u5339\u914d\u66ff\u4ee3 JEPA \u4e16\u754c\u6a21\u578b\u4e2d\u7684\u786e\u5b9a\u6027\u81ea\u56de\u5f52\u4e00\u6b65\u9884\u6d4b\uff0c\u76f4\u63a5\u751f\u6210\u672a\u6765\u6f5c\u5728\u72b6\u6001\u5e8f\u5217\u3002\u8be5\u65b9\u6cd5\u5728\u4fdd\u6301\u65e0\u91cd\u5efa\u6846\u67b6\u7684\u540c\u65f6\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5e72\u51c0\u89c2\u6d4b\u4e0b\u6210\u529f\u7387\u4ece 86% \u63d0\u5347\u5230 92%\uff0c\u566a\u58f0\u6761\u4ef6\u4e0b\u4ece 67% \u63d0\u5347\u5230 86%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hidden-state probes effectively detect LLM hallucinations, but the geometry of the signal remains poorly characterized, driving increasingly complex probe architectures. Across three 7B-scale models and three datasets in a paired-example paradigm, we find the signal overwhelmingly dominated by a single mean-shift component, and removing this direction collapses detection to chance. Shrinkage linear discriminant analysis closes about 73% of the gap between 1D and full-dimensional classifiers, so apparent architectural complexity largely reflects high-dimensional covariance estimation difficulty rather than exploitable non-linearity. A simple L2-regularized logistic regression (0.952 AUROC) bounds or outperforms twelve controlled architectural alternatives, and our multi-layer aggregation exceeds CLAP cross-layer attention probing under matched paradigm. Because the signal spans a contiguous layer band, LayerMix aggregates it to match oracle-layer performance without oracle access. Our claims characterize the geometry within the controlled paired-example paradigm. Our code is available at https://github.com/js-lee-AI/LayerMix.", "arxiv_id": "2608.28930", "arxiv_url": "https://arxiv.org/abs/2608.28930", "authors": ["Jungseob Lee", "Jaehyung Seo", "Heuiseok Lim"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u6a21\u578b\u5e7b\u89c9\u68c0\u6d4b\u4e2d\u9690\u85cf\u72b6\u6001\u63a2\u9488\u7684\u51e0\u4f55\u7ed3\u6784\uff0c\u53d1\u73b0\u4e3b\u8981\u4fe1\u53f7\u51e0\u4e4e\u7531\u5355\u4e00\u5747\u503c\u504f\u79fb\u65b9\u5411\u4e3b\u5bfc\uff0c\u79fb\u9664\u8be5\u65b9\u5411\u540e\u68c0\u6d4b\u6027\u80fd\u63a5\u8fd1\u968f\u673a\u3002\u7b80\u5355\u7684 L2 \u6b63\u5219\u903b\u8f91\u56de\u5f52\u8fbe\u5230 0.952 AUROC\uff0c\u5e76\u4f18\u4e8e\u591a\u79cd\u66f4\u590d\u6742\u63a2\u9488\uff1bLayerMix \u8fd8\u80fd\u5728\u65e0\u9700\u9884\u5148\u9009\u62e9\u6700\u4f73\u5c42\u7684\u60c5\u51b5\u4e0b\u63a5\u8fd1 oracle \u5c42\u6027\u80fd\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28930", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9\u68c0\u6d4b", "\u7ebf\u6027\u63a2\u9488", "\u8868\u793a\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28930v1", "published_at": "2026-08-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Hallucination Signal Is a Mean Shift: Why Simple Probes Suffice", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u6a21\u578b\u5e7b\u89c9\u68c0\u6d4b\u4e2d\u9690\u85cf\u72b6\u6001\u63a2\u9488\u7684\u51e0\u4f55\u7ed3\u6784\uff0c\u53d1\u73b0\u4e3b\u8981\u4fe1\u53f7\u51e0\u4e4e\u7531\u5355\u4e00\u5747\u503c\u504f\u79fb\u65b9\u5411\u4e3b\u5bfc\uff0c\u79fb\u9664\u8be5\u65b9\u5411\u540e\u68c0\u6d4b\u6027\u80fd\u63a5\u8fd1\u968f\u673a\u3002\u7b80\u5355\u7684 L2 \u6b63\u5219\u903b\u8f91\u56de\u5f52\u8fbe\u5230 0.952 AUROC\uff0c\u5e76\u4f18\u4e8e\u591a\u79cd\u66f4\u590d\u6742\u63a2\u9488\uff1bLayerMix \u8fd8\u80fd\u5728\u65e0\u9700\u9884\u5148\u9009\u62e9\u6700\u4f73\u5c42\u7684\u60c5\u51b5\u4e0b\u63a5\u8fd1 oracle \u5c42\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Planning-time intervention fidelity is a distinct, measurable property of a learned world model: whether the model\u0027s own open-loop transitions move task variables the way matched environment interventions do. In the settings we test, it is neither revealed by reward fit nor ensured by task-anchored training. Across released TD-MPC2 checkpoint sizes, episode return falls as an operator-error diagnostic on task observables grows, while reward-prediction error stays small and nearly flat, and a self-supervised world model trained without task signal preserves the same operator substantially better than a task-anchored model on the shared task. A capture-gated matched-intervention audit then localizes what fails. On Cheetah, three LeWorldModel checkpoints capture the current task query and support decodable real intervention effects; however, their imagined five-step effects are worse than predicting no effect and worse than an environment-endpoint oracle. The failure is task-direction rotation with excess gain, not feature collapse. This severe pattern is conditional: five PreJEPA seeds retain an oracle-relative deficit without it, Finger Spin experiments extend the deficit beyond locomotion with heterogeneous severity across seeds, and shared-bank effect geometry is both candidate- and support-dependent. We also test practice-side questions. In DreamerV3 the posterior distribution, not its sample, carries the current query; ensemble disagreement ranks error only near training support; and a frozen support-aware score degrades held-out error ranking in both tested transfer directions while native disagreement remains informative in both. We conclude that intervention fidelity must be audited directly, capture-first, on the model\u0027s native interface.", "arxiv_id": "2608.29998", "arxiv_url": "https://arxiv.org/abs/2608.29998", "authors": ["Donna Vakalis"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u89c4\u5212\u65f6\u5e72\u9884\u4fdd\u771f\u5ea6\u201d\u8fd9\u4e00\u53ef\u6d4b\u6307\u6807\uff0c\u7528\u6765\u68c0\u9a8c\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u7684\u5f00\u653e\u73af\u8f6c\u79fb\u662f\u5426\u80fd\u50cf\u771f\u5b9e\u73af\u5883\u5e72\u9884\u4e00\u6837\u6539\u53d8\u4efb\u52a1\u53d8\u91cf\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5956\u52b1\u9884\u6d4b\u8bef\u5dee\u548c\u4efb\u52a1\u8bad\u7ec3\u5e76\u4e0d\u80fd\u4fdd\u8bc1\u8fd9\u79cd\u4fdd\u771f\u5ea6\uff0c\u591a\u4e2a TD-MPC2\u3001DreamerV3 \u7b49\u6a21\u578b\u5728\u5e72\u9884\u6548\u679c\u65b9\u5411\u3001\u589e\u76ca\u548c\u8fc1\u79fb\u6392\u5e8f\u4e0a\u5b58\u5728\u660e\u663e\u7f3a\u53e3\u3002\u4f5c\u8005\u4e3b\u5f20\u5e94\u5728\u6a21\u578b\u539f\u751f\u63a5\u53e3\u4e0a\u8fdb\u884c\u76f4\u63a5\u3001\u5148\u6355\u83b7\u540e\u5ba1\u8ba1\u7684\u5e72\u9884\u8bc4\u4f30\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29998", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u89c4\u5212", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29998v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Intervention Gap in Latent World Models", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u89c4\u5212\u65f6\u5e72\u9884\u4fdd\u771f\u5ea6\u201d\u8fd9\u4e00\u53ef\u6d4b\u6307\u6807\uff0c\u7528\u6765\u68c0\u9a8c\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u7684\u5f00\u653e\u73af\u8f6c\u79fb\u662f\u5426\u80fd\u50cf\u771f\u5b9e\u73af\u5883\u5e72\u9884\u4e00\u6837\u6539\u53d8\u4efb\u52a1\u53d8\u91cf\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5956\u52b1\u9884\u6d4b\u8bef\u5dee\u548c\u4efb\u52a1\u8bad\u7ec3\u5e76\u4e0d\u80fd\u4fdd\u8bc1\u8fd9\u79cd\u4fdd\u771f\u5ea6\uff0c\u591a\u4e2a TD-MPC2\u3001DreamerV3 \u7b49\u6a21\u578b\u5728\u5e72\u9884\u6548\u679c\u65b9\u5411\u3001\u589e\u76ca\u548c\u8fc1\u79fb\u6392\u5e8f\u4e0a\u5b58\u5728\u660e\u663e\u7f3a\u53e3\u3002\u4f5c\u8005\u4e3b\u5f20\u5e94\u5728\u6a21\u578b\u539f\u751f\u63a5\u53e3\u4e0a\u8fdb\u884c\u76f4\u63a5\u3001\u5148\u6355\u83b7\u540e\u5ba1\u8ba1\u7684\u5e72\u9884\u8bc4\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly required to generate responses that satisfy multiple competing objectives. Since optimal trade-offs depend on both user preferences and input prompts, controllable multi-objective generation must dynamically adapt models at inference time without retraining. To address this, we propose Evolutionary Soups, a mixture-of-experts framework for fine-grained generation control, with gating networks trained via an evolutionary algorithm. The per-layer gating networks dynamically produce expert-merging coefficients from hidden-state representations, while the evolutionary algorithm incorporates greedy hypervolume contribution for effective evolution of these gating networks, achieving consistent improvements on large and noisy training datasets and broader coverage of the non-convex Pareto front. Experiments across three tasks demonstrate the effectiveness of Evolutionary Soups over baselines: it achieves the best hypervolume, linear utility, and Tchebyshev utility (~20% improvement) among controllable methods on all tasks.", "arxiv_id": "2608.29978", "arxiv_url": "https://arxiv.org/abs/2608.29978", "authors": ["Lingxiao Kong", "Steffen Staab", "Cong Yang", "Oya Beyan", "Zeyd Boukhers"], "brief": "\u8bba\u6587\u63d0\u51fa Evolutionary Soups\uff0c\u4e00\u79cd\u7528\u4e8e\u591a\u76ee\u6807\u5927\u6a21\u578b\u5bf9\u9f50\u7684\u6df7\u5408\u4e13\u5bb6\u6846\u67b6\uff0c\u53ef\u5728\u63a8\u7406\u65f6\u6839\u636e\u8f93\u5165\u52a8\u6001\u878d\u5408\u4e13\u5bb6\u4ee5\u63a7\u5236\u751f\u6210\u504f\u597d\u3002\u5176\u95e8\u63a7\u7f51\u7edc\u901a\u8fc7\u8fdb\u5316\u7b97\u6cd5\u8bad\u7ec3\uff0c\u5728\u4e09\u4e2a\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u53ef\u63a7\u65b9\u6cd5\uff0c\u8d85\u4f53\u79ef\u3001\u7ebf\u6027\u6548\u7528\u548c Tchebyshev \u6548\u7528\u5747\u53d6\u5f97\u6700\u4f73\u8868\u73b0\uff0c\u7ea6\u6709 20% \u63d0\u5347\u3002", "categories": ["cs.CL", "cs.LG", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29978", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5bf9\u9f50", "\u6df7\u5408\u4e13\u5bb6", "\u8fdb\u5316\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29978v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evolutionary Soups: Evolving Mixture-of-Experts for Multi-Objective LLM Alignment", "tldr": "\u8bba\u6587\u63d0\u51fa Evolutionary Soups\uff0c\u4e00\u79cd\u7528\u4e8e\u591a\u76ee\u6807\u5927\u6a21\u578b\u5bf9\u9f50\u7684\u6df7\u5408\u4e13\u5bb6\u6846\u67b6\uff0c\u53ef\u5728\u63a8\u7406\u65f6\u6839\u636e\u8f93\u5165\u52a8\u6001\u878d\u5408\u4e13\u5bb6\u4ee5\u63a7\u5236\u751f\u6210\u504f\u597d\u3002\u5176\u95e8\u63a7\u7f51\u7edc\u901a\u8fc7\u8fdb\u5316\u7b97\u6cd5\u8bad\u7ec3\uff0c\u5728\u4e09\u4e2a\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u53ef\u63a7\u65b9\u6cd5\uff0c\u8d85\u4f53\u79ef\u3001\u7ebf\u6027\u6548\u7528\u548c Tchebyshev \u6548\u7528\u5747\u53d6\u5f97\u6700\u4f73\u8868\u73b0\uff0c\u7ea6\u6709 20% \u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) can memorize sensitive information, raising serious privacy concerns. Machine unlearning offers a potential solution to remove such information, but it remains unclear whether existing methods truly erase it or merely hide it within the model. A key challenge is quantifying the persistence of sensitive data under a unified evaluation framework. To address this, we construct a synthetic dataset containing fake private information and propose a white-box auditing framework to systematically assess whether claimed-forgotten information is genuinely removed. Using this framework, we evaluate five existing unlearning methods and find that a simple \"inverse greedy\" decoding -- selecting the least likely token at each step -- can recover supposedly forgotten private information. Our results reveal that current unlearning approaches often fail to fully eliminate sensitive information, highlighting the need for more reliable methods to ensure privacy in deployed LLMs.", "arxiv_id": "2608.29943", "arxiv_url": "https://arxiv.org/abs/2608.29943", "authors": ["Shicheng Hu", "Runzhi Tian", "Ziqiao Wang", "Yongyi Mao"], "brief": "\u8bba\u6587\u6784\u9020\u542b\u865a\u5047\u9690\u79c1\u4fe1\u606f\u7684\u5408\u6210\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51fa\u767d\u76d2\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u673a\u5668\u9057\u5fd8\u662f\u5426\u771f\u7684\u5220\u9664\u4e86\u654f\u611f\u4fe1\u606f\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u9488\u5bf9\u4e94\u79cd\u73b0\u6709\u9057\u5fd8\u65b9\u6cd5\uff0c\u7b80\u5355\u7684\u201c\u9006\u8d2a\u5fc3\u201d\u89e3\u7801\u4ecd\u80fd\u6062\u590d supposedly forgotten \u7684\u9690\u79c1\u5185\u5bb9\uff0c\u8bf4\u660e\u5f53\u524d\u65b9\u6cd5\u5f80\u5f80\u53ea\u662f\u9690\u85cf\u800c\u975e\u5f7b\u5e95\u6e05\u9664\u4fe1\u606f\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29943", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29943v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On the Recoverability of Private Information Unlearning in Large Language Models", "tldr": "\u8bba\u6587\u6784\u9020\u542b\u865a\u5047\u9690\u79c1\u4fe1\u606f\u7684\u5408\u6210\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51fa\u767d\u76d2\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u673a\u5668\u9057\u5fd8\u662f\u5426\u771f\u7684\u5220\u9664\u4e86\u654f\u611f\u4fe1\u606f\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u9488\u5bf9\u4e94\u79cd\u73b0\u6709\u9057\u5fd8\u65b9\u6cd5\uff0c\u7b80\u5355\u7684\u201c\u9006\u8d2a\u5fc3\u201d\u89e3\u7801\u4ecd\u80fd\u6062\u590d supposedly forgotten \u7684\u9690\u79c1\u5185\u5bb9\uff0c\u8bf4\u660e\u5f53\u524d\u65b9\u6cd5\u5f80\u5f80\u53ea\u662f\u9690\u85cf\u800c\u975e\u5f7b\u5e95\u6e05\u9664\u4fe1\u606f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Safety alignment of large language models (LLMs) degrades across languages, yet the internal mechanism driving this asymmetry remains poorly understood. Our work, therefore, presents a systematic mechanistic analysis of multilingual safety using sparse autoencoder (SAE) features, sparse interpretable directions in the residual stream associated with harmful and harmless model behavior across three instruction-tuned LLMs, eight languages, and all model layers. We observe that safety-relevant features are architecture-dependent in terms of where they are located and how they are distributed across layers. Additionally, they are geometrically entangled with language identity and exhibit cross-lingual sharing patterns, i.e., languages share safety features to varying degrees across model depths and architectures. This safety-language entanglement has direct consequences such that ablating safety features impacts not only harmful response rates but also target language, with the degree of intervention predicted by the relationship between safety and language features. Our findings qualify the language-universality of safety alignment as architecture-dependent and offer a mechanistic account of multilingual safety interventions.", "arxiv_id": "2608.29936", "arxiv_url": "https://arxiv.org/abs/2608.29936", "authors": ["Apoorva Upadhyaya", "Sandipan Sikdar"], "brief": "\u672c\u6587\u7528\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7279\u5f81\u5206\u6790\u4e09\u79cd\u6307\u4ee4\u5fae\u8c03\u5927\u6a21\u578b\u5728\u516b\u79cd\u8bed\u8a00\u4e2d\u7684\u5b89\u5168\u673a\u5236\uff0c\u53d1\u73b0\u5b89\u5168\u76f8\u5173\u7279\u5f81\u5728\u4e0d\u540c\u67b6\u6784\u548c\u5c42\u4e2d\u7684\u4f4d\u7f6e\u4e0e\u5206\u5e03\u5dee\u5f02\u660e\u663e\u3002\u7814\u7a76\u8868\u660e\u5b89\u5168\u7279\u5f81\u4e0e\u8bed\u8a00\u8eab\u4efd\u5728\u51e0\u4f55\u4e0a\u7ea0\u7f20\uff0c\u5e72\u9884\u5b89\u5168\u7279\u5f81\u4e0d\u4ec5\u4f1a\u6539\u53d8\u6709\u5bb3\u56de\u590d\u7387\uff0c\u4e5f\u4f1a\u5f71\u54cd\u8f93\u51fa\u8bed\u8a00\uff0c\u8bf4\u660e\u591a\u8bed\u8a00\u5b89\u5168\u5bf9\u9f50\u7684\u901a\u7528\u6027\u4f9d\u8d56\u6a21\u578b\u67b6\u6784\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29936", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50", "\u591a\u8bed\u8a00", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29936v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Safety Speaks a Language: A Mechanistic Analysis of Safety-Language Identity Entanglement in LLMs", "tldr": "\u672c\u6587\u7528\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7279\u5f81\u5206\u6790\u4e09\u79cd\u6307\u4ee4\u5fae\u8c03\u5927\u6a21\u578b\u5728\u516b\u79cd\u8bed\u8a00\u4e2d\u7684\u5b89\u5168\u673a\u5236\uff0c\u53d1\u73b0\u5b89\u5168\u76f8\u5173\u7279\u5f81\u5728\u4e0d\u540c\u67b6\u6784\u548c\u5c42\u4e2d\u7684\u4f4d\u7f6e\u4e0e\u5206\u5e03\u5dee\u5f02\u660e\u663e\u3002\u7814\u7a76\u8868\u660e\u5b89\u5168\u7279\u5f81\u4e0e\u8bed\u8a00\u8eab\u4efd\u5728\u51e0\u4f55\u4e0a\u7ea0\u7f20\uff0c\u5e72\u9884\u5b89\u5168\u7279\u5f81\u4e0d\u4ec5\u4f1a\u6539\u53d8\u6709\u5bb3\u56de\u590d\u7387\uff0c\u4e5f\u4f1a\u5f71\u54cd\u8f93\u51fa\u8bed\u8a00\uff0c\u8bf4\u660e\u591a\u8bed\u8a00\u5b89\u5168\u5bf9\u9f50\u7684\u901a\u7528\u6027\u4f9d\u8d56\u6a21\u578b\u67b6\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "KV-cache compression reduces LLM inference memory by evicting context tokens, but when the evicted tokens contain answer-bearing evidence, the model may hallucinate instead of recognizing that the compressed context is insufficient. We address this failure from a behavioral perspective: to our knowledge, this is the first work to formulate compression-aware abstention as a learning problem, in which a model learns to answer when supporting evidence survives compression and abstain when it does not. We construct supervision from compressor survival masks and tight answer-bearing spans, labeling examples as Confident when evidence survives and Abstain when it is removed. A 10.1M-parameter LoRA adapter trained on ~2.6K MuSiQue 2-hop QA examples reduces base-model hallucinations by 97% under prompt-style truncation while preserving correct answering on evidence-retaining examples. Unlike prompt-only abstention baselines, which over-abstain on many answerable high-retention examples, the trained adapter learns a conditional policy. We also evaluate the method under actual compressed-cache decoding, where multi-compressor training yields a 6-22x relative lift over the unaided base on evidence-retaining examples. Controlled-deletion experiments show that the learned behavior is driven by evidence content rather than input length alone.", "arxiv_id": "2608.29934", "arxiv_url": "https://arxiv.org/abs/2608.29934", "authors": ["Mohammadali Khodabandehlou", "Bhaskar Krishnamachari"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u538b\u7f29\u611f\u77e5\u62d2\u7b54\u201d\u8bad\u7ec3\u6846\u67b6\uff0c\u8ba9LLM\u5728KV-cache\u538b\u7f29\u79fb\u9664\u5173\u952e\u8bc1\u636e\u65f6\u5b66\u4f1a\u62d2\u7b54\uff0c\u800c\u5728\u8bc1\u636e\u4fdd\u7559\u65f6\u6b63\u5e38\u56de\u7b54\u3002\u4f5c\u8005\u5229\u7528\u538b\u7f29\u5668\u4fdd\u7559\u63a9\u7801\u548c\u7b54\u6848\u8bc1\u636e\u7247\u6bb5\u6784\u9020\u76d1\u7763\uff0c\u4ec5\u7528\u7ea62600\u4e2aMuSiQue\u6837\u672c\u8bad\u7ec310.1M\u53c2\u6570LoRA\uff0c\u5373\u5728\u622a\u65ad\u5f0f\u538b\u7f29\u4e0b\u5c06\u5e7b\u89c9\u51cf\u5c1197%\uff0c\u5e76\u5728\u771f\u5b9e\u538b\u7f29\u7f13\u5b58\u89e3\u7801\u4e2d\u663e\u8457\u63d0\u5347\u53ef\u7b54\u6837\u672c\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29934", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "KV\u7f13\u5b58\u538b\u7f29", "\u62d2\u7b54", "\u5e7b\u89c9\u6291\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29934v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Compression-Aware Abstention: Teaching LLMs to Refuse When KV-Compression Masks Remove Answer Evidence", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u538b\u7f29\u611f\u77e5\u62d2\u7b54\u201d\u8bad\u7ec3\u6846\u67b6\uff0c\u8ba9LLM\u5728KV-cache\u538b\u7f29\u79fb\u9664\u5173\u952e\u8bc1\u636e\u65f6\u5b66\u4f1a\u62d2\u7b54\uff0c\u800c\u5728\u8bc1\u636e\u4fdd\u7559\u65f6\u6b63\u5e38\u56de\u7b54\u3002\u4f5c\u8005\u5229\u7528\u538b\u7f29\u5668\u4fdd\u7559\u63a9\u7801\u548c\u7b54\u6848\u8bc1\u636e\u7247\u6bb5\u6784\u9020\u76d1\u7763\uff0c\u4ec5\u7528\u7ea62600\u4e2aMuSiQue\u6837\u672c\u8bad\u7ec310.1M\u53c2\u6570LoRA\uff0c\u5373\u5728\u622a\u65ad\u5f0f\u538b\u7f29\u4e0b\u5c06\u5e7b\u89c9\u51cf\u5c1197%\uff0c\u5e76\u5728\u771f\u5b9e\u538b\u7f29\u7f13\u5b58\u89e3\u7801\u4e2d\u663e\u8457\u63d0\u5347\u53ef\u7b54\u6837\u672c\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sampled-token on-policy distillation (OPD) efficiently transfers capabilities from teacher to student using student-generated tokens, requiring teacher probabilities only for sampled tokens. Yet it frequently suffers from diversity distillation failure: the student\u0027s pass@1 improves while its pass@$k$ plateaus, failing to inherit the teacher\u0027s diversity. To explain this, we introduce First-Order Local Entropy Influence, a signed first-order proxy that decouples each update\u0027s entropy effect into the teacher--student log-probability gap and the student\u0027s local probability structure, and empirically links entropy contraction to negative-influence positions. Motivated by this, we propose Influence-Directed Adaptive On-Policy Distillation (IDA-OPD): rather than relying on costly full-vocabulary Forward-KL objectives, it preserves entropy-expanding updates while replacing entropy-contracting ones with divergence-adaptive advantage shrinkage, using only the teacher\u0027s sampled-token log-probability. Experiments on reasoning-oriented distillation show IDA-OPD consistently improves pass@$k$, inheriting the teacher\u0027s diversity through distillation, matches the strongest teacher-informed methods at strictly lower cost, and broadly maintains vanilla OPD\u0027s pass@1, all without full-vocabulary teacher information.", "arxiv_id": "2608.29846", "arxiv_url": "https://arxiv.org/abs/2608.29846", "authors": ["Run Yang", "Runpeng Dai", "Jie Sun", "Jielei Zhang", "Fan Zhou", "Hongtu Zhu", "Peiyi Li", "Longwen Gao"], "brief": "\u672c\u6587\u5206\u6790\u4e86\u91c7\u6837 token \u5728\u7b56\u7565\u84b8\u998f\u4e2d\u5b66\u751f\u6a21\u578b pass@1 \u63d0\u5347\u4f46 pass@k \u591a\u6837\u6027\u505c\u6ede\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4e00\u9636\u5c40\u90e8\u71b5\u5f71\u54cd\u6765\u89e3\u91ca\u54ea\u4e9b\u66f4\u65b0\u4f1a\u5bfc\u81f4\u71b5\u6536\u7f29\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa IDA-OPD\uff0c\u5728\u4ec5\u4f7f\u7528\u6559\u5e08\u5bf9\u91c7\u6837 token \u7684\u6982\u7387\u4fe1\u606f\u4e0b\u4fdd\u7559\u589e\u71b5\u66f4\u65b0\u3001\u6291\u5236\u51cf\u71b5\u66f4\u65b0\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u66f4\u597d\u7ee7\u627f\u6559\u5e08\u6a21\u578b\u7684\u591a\u6837\u6027\uff0c\u63d0\u5347 pass@k\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u666e\u901a OPD \u7684 pass@1\uff0c\u4e14\u6210\u672c\u4f4e\u4e8e\u5168\u8bcd\u8868\u6559\u5e08\u76d1\u7763\u65b9\u6cd5\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29846", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u6837\u6027", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29846v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Influence-Directed Distillation: Solving the Diversity Bottleneck in Sampled-Token On-Policy Distillation", "tldr": "\u672c\u6587\u5206\u6790\u4e86\u91c7\u6837 token \u5728\u7b56\u7565\u84b8\u998f\u4e2d\u5b66\u751f\u6a21\u578b pass@1 \u63d0\u5347\u4f46 pass@k \u591a\u6837\u6027\u505c\u6ede\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4e00\u9636\u5c40\u90e8\u71b5\u5f71\u54cd\u6765\u89e3\u91ca\u54ea\u4e9b\u66f4\u65b0\u4f1a\u5bfc\u81f4\u71b5\u6536\u7f29\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa IDA-OPD\uff0c\u5728\u4ec5\u4f7f\u7528\u6559\u5e08\u5bf9\u91c7\u6837 token \u7684\u6982\u7387\u4fe1\u606f\u4e0b\u4fdd\u7559\u589e\u71b5\u66f4\u65b0\u3001\u6291\u5236\u51cf\u71b5\u66f4\u65b0\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u66f4\u597d\u7ee7\u627f\u6559\u5e08\u6a21\u578b\u7684\u591a\u6837\u6027\uff0c\u63d0\u5347 pass@k\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u666e\u901a OPD \u7684 pass@1\uff0c\u4e14\u6210\u672c\u4f4e\u4e8e\u5168\u8bcd\u8868\u6559\u5e08\u76d1\u7763\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Early failure prediction is important for long-horizon agents, as it enables timely intervention and can reduce inference and tool-use costs. Uncertainty quantification, such as verbal confidence and perplexity, offers a promising approach to detecting agent failures; however, it has not been explored whether these signals retain their discriminative power during the intermediate stages of long-horizon execution. We evaluate mainstream uncertainty signals on deep-research tasks and find that verbal confidence reliably distinguishes failures at trajectory completion, achieving a mean AUROC of 0.85, whereas all evaluated signals offer limited predictive value earlier in execution, with none exceeding a mean AUROC of 0.60 at 50% trajectory progress. We identify an underlying mechanism explaining this gap: path switching, where agents frequently abandon their current search direction in-trajectory, breaking the link between early signal and final outcome. These findings challenge the assumption that intermediate uncertainty can reliably guide early intervention. They also motivate a practical recommendation for agent harnesses in deep-research settings: use final-step confidence to decide whether to restart, an approach that our experiments find more effective than in-trajectory intervention.", "arxiv_id": "2608.29685", "arxiv_url": "https://arxiv.org/abs/2608.29685", "authors": ["Zongyue Li", "Chengyue Yu", "Lei Zang", "Chenyi Zhuang", "Linjian Mo", "Leilei Gan"], "brief": "\u8bba\u6587\u8bc4\u4f30\u957f\u7a0b\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4e2d\u7684\u4e0d\u786e\u5b9a\u6027\u4fe1\u53f7\uff0c\u53d1\u73b0\u53e3\u5934\u7f6e\u4fe1\u5ea6\u7b49\u6307\u6807\u53ea\u6709\u5728\u4efb\u52a1\u7ed3\u675f\u65f6\u624d\u80fd\u8f83\u597d\u533a\u5206\u5931\u8d25\uff0c\u6700\u7ec8 AUROC \u5747\u503c\u8fbe 0.85\u3002\u4e2d\u95f4\u9636\u6bb5\u7684\u9884\u6d4b\u80fd\u529b\u5f88\u5f31\uff0c50% \u8fdb\u5ea6\u65f6\u5747\u4e0d\u8d85\u8fc7 0.60\uff0c\u539f\u56e0\u662f\u667a\u80fd\u4f53\u4f1a\u9891\u7e41\u201c\u8def\u5f84\u5207\u6362\u201d\uff0c\u4f7f\u65e9\u671f\u4fe1\u53f7\u4e0e\u6700\u7ec8\u7ed3\u679c\u8131\u94a9\uff1b\u5b9e\u8df5\u4e0a\u66f4\u5efa\u8bae\u7528\u6700\u540e\u4e00\u6b65\u7f6e\u4fe1\u5ea6\u51b3\u5b9a\u662f\u5426\u91cd\u542f\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29685", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u957f\u7a0b\u4efb\u52a1", "\u5931\u8d25\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29685v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Last Step Matters: Early Uncertainty Cannot Predict Failure in Long-Horizon Agents", "tldr": "\u8bba\u6587\u8bc4\u4f30\u957f\u7a0b\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4e2d\u7684\u4e0d\u786e\u5b9a\u6027\u4fe1\u53f7\uff0c\u53d1\u73b0\u53e3\u5934\u7f6e\u4fe1\u5ea6\u7b49\u6307\u6807\u53ea\u6709\u5728\u4efb\u52a1\u7ed3\u675f\u65f6\u624d\u80fd\u8f83\u597d\u533a\u5206\u5931\u8d25\uff0c\u6700\u7ec8 AUROC \u5747\u503c\u8fbe 0.85\u3002\u4e2d\u95f4\u9636\u6bb5\u7684\u9884\u6d4b\u80fd\u529b\u5f88\u5f31\uff0c50% \u8fdb\u5ea6\u65f6\u5747\u4e0d\u8d85\u8fc7 0.60\uff0c\u539f\u56e0\u662f\u667a\u80fd\u4f53\u4f1a\u9891\u7e41\u201c\u8def\u5f84\u5207\u6362\u201d\uff0c\u4f7f\u65e9\u671f\u4fe1\u53f7\u4e0e\u6700\u7ec8\u7ed3\u679c\u8131\u94a9\uff1b\u5b9e\u8df5\u4e0a\u66f4\u5efa\u8bae\u7528\u6700\u540e\u4e00\u6b65\u7f6e\u4fe1\u5ea6\u51b3\u5b9a\u662f\u5426\u91cd\u542f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly used to read documents and produce downstream text, creating a provenance problem when the document owner cannot control or inspect the model that performs the generation. We introduce SemTrace, a source-grounded semantic watermark for detecting whether a generated review was influenced by a known protected manuscript copy. Rather than biasing token probabilities or imposing surface-form patterns, SemTrace constructs a document-specific binary signature from factual propositions that are directly supported by the manuscript itself. A protected PDF invisibly carries a content contract that selects one fact from each binary pair and asks an instruction-following reviewer to express those facts in fixed review slots without changing its independent evaluation. A frozen natural language inference model then decodes the resulting semantic evidence with explicit erasures and scores the recovered bits against the codeword assigned to that copy. This design targets model-agnostic, assigned-copy exposure detection while keeping the watermark semantically tied to the source document.", "arxiv_id": "2608.29575", "arxiv_url": "https://arxiv.org/abs/2608.29575", "authors": ["Junyan Zhang", "Yudong Zeng", "Yongwei Huang", "Zuhao Ouyang", "Hong Chen", "Xuming Hu"], "brief": "\u8bba\u6587\u63d0\u51fa SemTrace\uff0c\u4e00\u79cd\u9762\u5411\u53d7\u4fdd\u62a4\u6587\u6863\u7684\u6e90\u8bed\u4e49\u6c34\u5370\uff0c\u7528\u6587\u6863\u4e2d\u53ef\u8bc1\u5b9e\u7684\u4e8b\u5b9e\u547d\u9898\u6784\u9020\u526f\u672c\u7279\u5b9a\u4e8c\u8fdb\u5236\u7b7e\u540d\u3002\u5b83\u901a\u8fc7\u8ba9\u8bc4\u5ba1\u6587\u672c\u5728\u56fa\u5b9a\u69fd\u4f4d\u8868\u8fbe\u9009\u5b9a\u4e8b\u5b9e\uff0c\u5e76\u7528\u51bb\u7ed3\u7684\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u6a21\u578b\u89e3\u7801\u8bed\u4e49\u8bc1\u636e\uff0c\u4ece\u800c\u68c0\u6d4b\u751f\u6210\u5185\u5bb9\u662f\u5426\u53d7\u67d0\u4efd\u53d7\u4fdd\u62a4\u7a3f\u4ef6\u5f71\u54cd\uff0c\u4e14\u4e0d\u4f9d\u8d56\u5177\u4f53\u8bed\u8a00\u6a21\u578b\u6216\u8868\u5c42\u6587\u672c\u6a21\u5f0f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29575", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b57\u6c34\u5370", "\u6587\u672c\u6eaf\u6e90", "\u81ea\u7136\u8bed\u8a00\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29575v1", "published_at": "2026-08-30", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SemTrace: Source-Grounded Semantic Signatures for Tracing LLM Exposure to Protected Documents", "tldr": "\u8bba\u6587\u63d0\u51fa SemTrace\uff0c\u4e00\u79cd\u9762\u5411\u53d7\u4fdd\u62a4\u6587\u6863\u7684\u6e90\u8bed\u4e49\u6c34\u5370\uff0c\u7528\u6587\u6863\u4e2d\u53ef\u8bc1\u5b9e\u7684\u4e8b\u5b9e\u547d\u9898\u6784\u9020\u526f\u672c\u7279\u5b9a\u4e8c\u8fdb\u5236\u7b7e\u540d\u3002\u5b83\u901a\u8fc7\u8ba9\u8bc4\u5ba1\u6587\u672c\u5728\u56fa\u5b9a\u69fd\u4f4d\u8868\u8fbe\u9009\u5b9a\u4e8b\u5b9e\uff0c\u5e76\u7528\u51bb\u7ed3\u7684\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u6a21\u578b\u89e3\u7801\u8bed\u4e49\u8bc1\u636e\uff0c\u4ece\u800c\u68c0\u6d4b\u751f\u6210\u5185\u5bb9\u662f\u5426\u53d7\u67d0\u4efd\u53d7\u4fdd\u62a4\u7a3f\u4ef6\u5f71\u54cd\uff0c\u4e14\u4e0d\u4f9d\u8d56\u5177\u4f53\u8bed\u8a00\u6a21\u578b\u6216\u8868\u5c42\u6587\u672c\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Omni-modal large language models are increasingly evaluated on clean text--vision--audio inputs, where every channel is present, synchronized, and readily interpretable. Such scores are often taken as evidence of robust cross-modal fusion, but clean evaluation cannot tell whether success depends on stable cross-modal structure or on cues sufficient only in intact inputs. To address this gap, we define a modality fault line: a boundary at which model behavior becomes unstable when a modality remains present and human-interpretable, but its internal evidence structure is perturbed. We introduce SCEval (Structure-Corruption Evaluation) a diagnostic evaluation protocol that keeps the question, answer space, and modality channels fixed while applying controlled structural corruptions to text, vision, and audio individually and jointly. Built from $273$ human-verified tri-modal examples from Social-IQ, OmniBench, and VALOR, SCEval evaluates $15$ proprietary and open-source omni-modal systems. The results show that structural corruption lowers clean accuracy, text--vision damage forms the most stable shared fault line, and multi-modal degradation is non-additive rather than a simple function of the number of corrupted modalities. Clean omni-modal accuracy therefore does not establish that a model will remain reliable when cross-modal evidence becomes structurally unreliable.", "arxiv_id": "2608.29278", "arxiv_url": "https://arxiv.org/abs/2608.29278", "authors": ["Zhaolu Kang", "Meixin Wu", "Yu Xue", "Yingjie He", "Qiming Shi", "Lei Wei", "Yidi Wang", "Richeng Xuan", "Zhichao Hu"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u6a21\u6001\u65ad\u5c42\u201d\u6982\u5ff5\uff0c\u5e76\u6784\u5efa SCEval \u8bc4\u6d4b\u534f\u8bae\uff0c\u5728\u4fdd\u6301\u95ee\u9898\u3001\u7b54\u6848\u548c\u6a21\u6001\u901a\u9053\u4e0d\u53d8\u7684\u60c5\u51b5\u4e0b\uff0c\u5bf9\u6587\u672c\u3001\u89c6\u89c9\u3001\u97f3\u9891\u7684\u5185\u90e8\u7ed3\u6784\u8fdb\u884c\u53d7\u63a7\u6270\u52a8\u3002\u5bf9 15 \u4e2a\u5168\u6a21\u6001\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u7ed3\u6784\u6027\u7834\u574f\u4f1a\u663e\u8457\u964d\u4f4e\u51c6\u786e\u7387\uff0c\u6587\u672c-\u89c6\u89c9\u6270\u52a8\u662f\u6700\u7a33\u5b9a\u7684\u8106\u5f31\u8fb9\u754c\uff0c\u591a\u6a21\u6001\u9000\u5316\u8fd8\u5448\u73b0\u975e\u52a0\u6027\u7279\u5f81\uff0c\u8bf4\u660e\u5e72\u51c0\u8f93\u5165\u4e0a\u7684\u9ad8\u5206\u5e76\u4e0d\u80fd\u8bc1\u660e\u9c81\u68d2\u8de8\u6a21\u6001\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29278", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u9c81\u68d2\u6027\u8bc4\u6d4b", "\u8de8\u6a21\u6001\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29278v1", "published_at": "2026-08-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Modality Fault Lines: Structural Corruptions Reveal Fragile Omni-Modal Reasoning", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u6a21\u6001\u65ad\u5c42\u201d\u6982\u5ff5\uff0c\u5e76\u6784\u5efa SCEval \u8bc4\u6d4b\u534f\u8bae\uff0c\u5728\u4fdd\u6301\u95ee\u9898\u3001\u7b54\u6848\u548c\u6a21\u6001\u901a\u9053\u4e0d\u53d8\u7684\u60c5\u51b5\u4e0b\uff0c\u5bf9\u6587\u672c\u3001\u89c6\u89c9\u3001\u97f3\u9891\u7684\u5185\u90e8\u7ed3\u6784\u8fdb\u884c\u53d7\u63a7\u6270\u52a8\u3002\u5bf9 15 \u4e2a\u5168\u6a21\u6001\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u7ed3\u6784\u6027\u7834\u574f\u4f1a\u663e\u8457\u964d\u4f4e\u51c6\u786e\u7387\uff0c\u6587\u672c-\u89c6\u89c9\u6270\u52a8\u662f\u6700\u7a33\u5b9a\u7684\u8106\u5f31\u8fb9\u754c\uff0c\u591a\u6a21\u6001\u9000\u5316\u8fd8\u5448\u73b0\u975e\u52a0\u6027\u7279\u5f81\uff0c\u8bf4\u660e\u5e72\u51c0\u8f93\u5165\u4e0a\u7684\u9ad8\u5206\u5e76\u4e0d\u80fd\u8bc1\u660e\u9c81\u68d2\u8de8\u6a21\u6001\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Dynamic sparse attention can reduce the quadratic cost of long-context prefilling without changing model weights. MInference assigns each attention head one pattern offline and estimates that pattern\u0027s sparse indices for every prompt. This design is efficient, but it assumes that a head\u0027s preferred pattern and sparsity budget remain suitable across inputs. We introduce RouteSparse, which routes each head and prompt segment among a small library of GPU-efficient sparse patterns. A low-cost probe estimates pattern utility and uncertainty; a latency-aware router then selects a pattern and budget, while uncertain cases fall back to a denser mask. We formulate routing as constrained risk minimization, derive an attention-output error certificate from omitted probability mass, and evaluate the method on long-context retrieval, question answering, summarization, and language modeling. On Llama 3.1-8B-Instruct with 128K-token prompts, RouteSparse achieves $6.5\\times$ dense prefill speed with a 0.2-point RULER drop relative to dense attention, compared with $7.3\\times$ speed and a 1.6-point drop for fixed per-head routing. Ablations confirm that input-conditional routing, hardware profiling, and selective dense fallback each contribute to the quality--latency tradeoff.", "arxiv_id": "2608.29058", "arxiv_url": "https://arxiv.org/abs/2608.29058", "authors": ["Chao Zhang", "Yifan Ji", "Ziyan Zhang", "Kai Song", "Fei Lin"], "brief": "RouteSparse \u9488\u5bf9\u957f\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u63d0\u51fa\u6309\u8f93\u5165\u6761\u4ef6\u52a8\u6001\u8def\u7531\u7684\u7a00\u758f\u6ce8\u610f\u529b\u65b9\u6cd5\uff0c\u4e3a\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u548c\u63d0\u793a\u7247\u6bb5\u5728\u5c11\u91cf GPU \u53cb\u597d\u7a00\u758f\u6a21\u5f0f\u4e2d\u9009\u62e9\u6a21\u5f0f\u4e0e\u9884\u7b97\uff0c\u5e76\u5728\u4e0d\u786e\u5b9a\u65f6\u56de\u9000\u5230\u66f4\u7a20\u5bc6\u63a9\u7801\u3002\u5176\u5728 Llama 3.1-8B-Instruct \u7684 128K \u8f93\u5165\u4e0a\u5b9e\u73b0 6.5 \u500d\u7a20\u5bc6\u9884\u586b\u5145\u52a0\u901f\uff0c\u540c\u65f6 RULER \u4ec5\u4e0b\u964d 0.2 \u5206\uff0c\u8d28\u91cf-\u5ef6\u8fdf\u6743\u8861\u4f18\u4e8e\u56fa\u5b9a\u8def\u7531\u65b9\u6848\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29058", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a00\u758f\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.29058v1", "published_at": "2026-08-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RouteSparse: Input-Conditional Pattern Routing for Budgeted Long-Context Prefilling", "tldr": "RouteSparse \u9488\u5bf9\u957f\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u63d0\u51fa\u6309\u8f93\u5165\u6761\u4ef6\u52a8\u6001\u8def\u7531\u7684\u7a00\u758f\u6ce8\u610f\u529b\u65b9\u6cd5\uff0c\u4e3a\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u548c\u63d0\u793a\u7247\u6bb5\u5728\u5c11\u91cf GPU \u53cb\u597d\u7a00\u758f\u6a21\u5f0f\u4e2d\u9009\u62e9\u6a21\u5f0f\u4e0e\u9884\u7b97\uff0c\u5e76\u5728\u4e0d\u786e\u5b9a\u65f6\u56de\u9000\u5230\u66f4\u7a20\u5bc6\u63a9\u7801\u3002\u5176\u5728 Llama 3.1-8B-Instruct \u7684 128K \u8f93\u5165\u4e0a\u5b9e\u73b0 6.5 \u500d\u7a20\u5bc6\u9884\u586b\u5145\u52a0\u901f\uff0c\u540c\u65f6 RULER \u4ec5\u4e0b\u964d 0.2 \u5206\uff0c\u8d28\u91cf-\u5ef6\u8fdf\u6743\u8861\u4f18\u4e8e\u56fa\u5b9a\u8def\u7531\u65b9\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automating alignment research may accelerate progress toward aligned AI, but whether it does is hard to measure. Luckily, many alignment failures, such as deception, sycophancy, and jailbreaks, are already measurable by public benchmarks. We study whether automated alignment researchers (AARs) can post-train to mitigate alignment failures by proposing training methods and data to simultaneously optimize multiple safety benchmarks, while preserving general capability. Across 10 alignment failures, the strongest AAR methods significantly reduce the targeted alignment failures and generalize to a held-out benchmark, multi-turn behavioral audits, and models up to 4.7 times larger than the target model. As a human baseline, 28 experienced researchers receive up to eight hours to develop methods for the same benchmarks, but their methods underperform the best AAR methods. Using human ideas as the AARs\u0027 initial research direction does not improve performance, suggesting current AARs may not need guidance from experienced researchers. These results suggest that automating alignment research on wel
