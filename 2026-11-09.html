66\u4e60\u4efb\u52a1\u8fdb\u5c55\u4e2d\u7684\u91cd\u590d\u6a21\u5f0f\uff0c\u5224\u65ad\u4f55\u65f6\u4ece\u5f3a\u6a21\u578b\u4e00\u6b21\u6027\u4ea4\u63a5\u7ed9\u4f4e\u6210\u672c\u6a21\u578b\u3002", "why_notable": "\u5c06\u6a21\u578b\u534f\u4f5c\u4ece\u6574\u6761\u8bf7\u6c42\u7684\u8def\u7531\u63a8\u8fdb\u5230\u4efb\u52a1\u5185\u90e8\u4ea4\u63a5\uff0c\u8868\u660e\u7b80\u5355\u7684\u4e00\u6b21\u63a5\u529b\u5373\u53ef\u663e\u8457\u964d\u672c\uff0c\u5e76\u62d3\u5c55\u51c6\u786e\u7387\u4e0e\u6210\u672c\u7684\u7ecf\u9a8c\u5e15\u7d2f\u6258\u524d\u6cbf\u3002"}, {"abstract": "Large language models reinvent the wheel all the time. They conflate task-solving with the execution of the solutions, which forces them to solve every problem from scratch. We show that once a task has been reasoned through, the application of its solution to a new problem instance can be done very efficiently and with little involvement from language models. We introduce agentic reasoning caching, a method for constructing robust CPU-executable agentic reasoning caches (ARCs) from LLM reasoning traces. ARCs show on-par performance with frontier LLMs across a range of difficult mathematical and scientific tasks, are fully explainable, continually trainable, robust to input perturbations, and 16-291x cheaper to invoke than the source model.", "arxiv_id": "2611.09891", "arxiv_url": "https://arxiv.org/abs/2611.09891", "authors": ["Peter Belcak", "Greg Heinrich", "Saurav Muralidharan", "Shizhe Diao", "Pavlo Molchanov"], "brief": "\u63d0\u51fa\u667a\u80fd\u4f53\u63a8\u7406\u7f13\u5b58\u65b9\u6cd5\uff0c\u4ece\u5927\u6a21\u578b\u63a8\u7406\u8f68\u8ff9\u6784\u5efa\u53ef\u5728CPU\u6267\u884c\u7684\u89e3\u6cd5\u3002\u5c06\u4efb\u52a1\u6c42\u89e3\u4e0e\u89e3\u6cd5\u6267\u884c\u5206\u79bb\uff0c\u4f7f\u65b0\u5b9e\u4f8b\u80fd\u4ee5\u6781\u5c11\u6a21\u578b\u53c2\u4e0e\u5b8c\u6210\u8ba1\u7b97\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09891", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4eceLLM\u63a8\u7406\u8f68\u8ff9\u6784\u5efaCPU\u53ef\u6267\u884c\u7f13\u5b58ARCs", "\u591a\u7c7b\u9ad8\u96be\u6570\u5b66\u4e0e\u79d1\u5b66\u4efb\u52a1\u8868\u73b0\u6301\u5e73\u524d\u6cbf\u6a21\u578b", "ARCs\u8c03\u7528\u6210\u672c\u6bd4\u6765\u6e90\u6a21\u578b\u4f4e16\u81f3291\u500d"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u7f13\u5b58", "\u667a\u80fd\u4f53", "\u63a8\u7406\u6548\u7387"], "num_comments": 3, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2611.09891v1", "published_at": "2026-11-06", "score": 0.635, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09891.png", "title": "CPU-ARC: Agentic Reasoning Caching for on-CPU Reasoning Reuse", "tldr": "\u5c06\u5927\u6a21\u578b\u63a8\u7406\u8f68\u8ff9\u8f6c\u4e3a\u53ef\u5728CPU\u6267\u884c\u7684\u7f13\u5b58\uff0c\u590d\u7528\u89e3\u6cd5\u5e76\u964d\u4f4e\u8c03\u7528\u6210\u672c\u3002", "upvotes": 6, "what_it_is": "\u63d0\u51fa\u667a\u80fd\u4f53\u63a8\u7406\u7f13\u5b58\u65b9\u6cd5\uff0c\u4ece\u5927\u6a21\u578b\u63a8\u7406\u8f68\u8ff9\u6784\u5efa\u53ef\u5728CPU\u6267\u884c\u7684\u89e3\u6cd5\u3002\u5c06\u4efb\u52a1\u6c42\u89e3\u4e0e\u89e3\u6cd5\u6267\u884c\u5206\u79bb\uff0c\u4f7f\u65b0\u5b9e\u4f8b\u80fd\u4ee5\u6781\u5c11\u6a21\u578b\u53c2\u4e0e\u5b8c\u6210\u8ba1\u7b97\u3002", "why_notable": "\u628a\u6602\u8d35\u7684\u6a21\u578b\u63a8\u7406\u8f6c\u4e3a\u53ef\u590d\u7528\u7a0b\u5e8f\uff0c\u4e3a\u91cd\u590d\u4efb\u52a1\u63d0\u4f9b\u4f4e\u6210\u672c\u6267\u884c\u8def\u5f84\uff1b\u7f13\u5b58\u8fd8\u5177\u5907\u53ef\u89e3\u91ca\u3001\u6301\u7eed\u8bad\u7ec3\u53ca\u6297\u8f93\u5165\u6270\u52a8\u80fd\u529b\u3002"}, {"abstract": "Residual connections underpin Transformers, but they implicitly tie the residual width carried through depth to the compute width used inside each layer. We introduce Hierarchical Residuals (HiRes), a minimalist architectural change that decouples these dimensions, widening the residual state while keeping per-layer compute width fixed. HiRes groups layers into blocks: standard d-dimensional PreNorm layers operate inside each block, while a wider D-dimensional PostNorm outer residual connects blocks. Learned read/write projections bridge the two spaces at block boundaries, leaving individual Transformer layers unchanged. Across different model sizes and depths, HiRes consistently outperforms vanilla residual addition, with fitted scaling laws indicating a 1.30-fold improvement in FLOPs efficiency. On OLMoE-1B-7B pretraining for 500B tokens, HiRes achieves 0.0208 lower training loss and 1.14-point higher downstream accuracy. HiRes is also competitive with other residual expansion methods such as VWN, mHC and AttnRes with less activation memory and I/O costs. Built from only dense projections and normalizations, it requires neither specialized kernels nor infrastructure-level optimizations. HiRes thus exposes residual width as a practical scaling variable using only standard operators.", "arxiv_id": "2610.41711", "arxiv_url": "https://arxiv.org/abs/2610.41711", "authors": ["Ziteng Wang", "Jianqiao Lu", "Xinyu Ma", "Jintao Zhang", "Jun Zhu", "Yiyuan Ma", "Jianfei Chen"], "brief": "HiRes\u5c06\u5c42\u5206\u7ec4\uff0c\u7ec4\u5185\u6cbf\u7528\u7a84\u7ef4PreNorm\u5c42\uff0c\u7ec4\u95f4\u7528\u5bbd\u7ef4PostNorm\u6b8b\u5dee\u8fde\u63a5\uff0c\u5e76\u4ee5\u53ef\u5b66\u4e60\u8bfb\u5199\u6295\u5f71\u8854\u63a5\uff0c\u4f7f\u6b8b\u5dee\u5bbd\u5ea6\u72ec\u7acb\u4e8e\u8ba1\u7b97\u5bbd\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41711", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u62df\u5408\u7f29\u653e\u5f8b\u663e\u793aFLOPs\u6548\u7387\u63d0\u5347\u81f31.30\u500d", "OLMoE\u9884\u8bad\u7ec3500B\u8bcd\u5143\uff0c\u4e0b\u6e38\u51c6\u786e\u7387\u63d0\u9ad81.14\u70b9", "\u76f8\u6bd4VWN\u3001mHC\u548cAttnRes\uff0c\u6fc0\u6d3b\u5185\u5b58\u4e0eI/O\u6210\u672c\u66f4\u4f4e"], "keywords": ["\u6b8b\u5dee\u8fde\u63a5", "\u6a21\u578b\u67b6\u6784", "\u8bad\u7ec3\u6548\u7387", "\u7f29\u653e\u5b9a\u5f8b"], "num_comments": 2, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2610.41711v1", "published_at": "2026-10-30", "score": 0.491, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41711.png", "title": "Hierarchical Residuals: A Minimalist Decoupling of Residual Width from Compute Width", "tldr": "\u901a\u8fc7\u5206\u5c42\u6b8b\u5dee\u6269\u5bbd\u8de8\u5c42\u72b6\u6001\u800c\u4e0d\u589e\u52a0\u5c42\u5185\u8ba1\u7b97\u5bbd\u5ea6\uff0c\u63d0\u5347\u8bad\u7ec3\u6548\u7387\u4e0e\u6027\u80fd\u3002", "upvotes": 5, "what_it_is": "HiRes\u5c06\u5c42\u5206\u7ec4\uff0c\u7ec4\u5185\u6cbf\u7528\u7a84\u7ef4PreNorm\u5c42\uff0c\u7ec4\u95f4\u7528\u5bbd\u7ef4PostNorm\u6b8b\u5dee\u8fde\u63a5\uff0c\u5e76\u4ee5\u53ef\u5b66\u4e60\u8bfb\u5199\u6295\u5f71\u8854\u63a5\uff0c\u4f7f\u6b8b\u5dee\u5bbd\u5ea6\u72ec\u7acb\u4e8e\u8ba1\u7b97\u5bbd\u5ea6\u3002", "why_notable": "\u628a\u6b8b\u5dee\u5bbd\u5ea6\u53d8\u6210\u53ef\u72ec\u7acb\u8c03\u8282\u7684\u6269\u5c55\u53d8\u91cf\uff0c\u4e14\u4ec5\u9700\u6807\u51c6\u6295\u5f71\u4e0e\u5f52\u4e00\u5316\u7b97\u5b50\uff0c\u4e3a\u63d0\u9ad8\u6a21\u578b\u6548\u7387\u63d0\u4f9b\u6613\u843d\u5730\u7684\u67b6\u6784\u6539\u52a8\u3002"}, {"abstract": "LLM pruning must preserve quality while meeting hardware- and workload-specific constraints on latency, throughput, and memory. Existing pruning workflows often target parameter counts, requiring practitioners to manually select model sizes that meet latency, throughput, and GPU memory limits. However, parameter count alone does not predict these metrics, which depend on the model architecture, workload, hardware, and serving engine. We introduce AutoCompress, a hardware-guided compression framework that directly incorporates such constraints into differentiable architecture search. AutoCompress jointly optimizes global and per-layer structure to produce heterogeneous architectures, guided by serving-engine cost models validated against end-to-end latency, throughput, and memory measurements. We evaluate AutoCompress on long-context local coding, batched datacenter serving, and latency-sensitive in-game interaction. Compared to the state-of-the-art Minitron pruning framework, AutoCompress improves average accuracy across eight benchmarks by 6.57, 2.35, and 0.57 percentage points on RTX 5070, RTX 5080, and H100, respectively. AutoCompress also compresses Nemotron 3.5 Super from 120B to 74B parameters for single-B200 BF16 serving at 128K context, retaining 95% of its mean benchmark score.", "arxiv_id": "2611.08290", "arxiv_url": "https://arxiv.org/abs/2611.08290", "authors": ["Sheldon Liang", "Ali Taghibakhshi", "Saurav Muralidharan", "Sharath Turuvekere Sreenivas", "Ashwath Aithal", "Pavlo Molchanov", "Nima Tajbakhsh"], "brief": "AutoCompress\u901a\u8fc7\u53ef\u5fae\u67b6\u6784\u641c\u7d22\u8054\u5408\u4f18\u5316\u5168\u5c40\u4e0e\u9010\u5c42\u7ed3\u6784\uff0c\u751f\u6210\u5f02\u6784\u6a21\u578b\uff1b\u4ee5\u7ecf\u5b9e\u6d4b\u9a8c\u8bc1\u7684\u670d\u52a1\u5f15\u64ce\u6210\u672c\u6a21\u578b\u7ea6\u675f\u5ef6\u8fdf\u3001\u541e\u5410\u548c\u663e\u5b58\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08290", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53ef\u5fae\u67b6\u6784\u641c\u7d22\u8054\u5408\u4f18\u5316\u5168\u5c40\u53ca\u9010\u5c42\u7ed3\u6784", "\u5bf9\u6bd4Minitron\uff0c\u516b\u9879\u57fa\u51c6\u5e73\u5747\u7cbe\u5ea6\u6700\u9ad8\u63d0\u53476.57\u4e2a\u767e\u5206\u70b9", "120B\u538b\u81f374B\uff0c\u5355B200\u652f\u6301128K\u4e0a\u4e0b\u6587\uff0c\u4fdd\u755995%\u5747\u5206"], "keywords": ["\u5927\u6a21\u578b\u526a\u679d", "\u786c\u4ef6\u611f\u77e5\u538b\u7f29", "\u67b6\u6784\u641c\u7d22", "\u6a21\u578b\u90e8\u7f72"], "num_comments": 3, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2611.08290v1", "published_at": "2026-11-05", "score": 0.491, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08290.png", "title": "AutoCompress: Automated Hardware-Guided Model Compression", "tldr": "\u5c06\u786c\u4ef6\u4e0e\u670d\u52a1\u7ea6\u675f\u76f4\u63a5\u7eb3\u5165\u5927\u6a21\u578b\u526a\u679d\u641c\u7d22\uff0c\u517c\u987e\u90e8\u7f72\u6548\u7387\u4e0e\u7cbe\u5ea6\u3002", "upvotes": 8, "what_it_is": "AutoCompress\u901a\u8fc7\u53ef\u5fae\u67b6\u6784\u641c\u7d22\u8054\u5408\u4f18\u5316\u5168\u5c40\u4e0e\u9010\u5c42\u7ed3\u6784\uff0c\u751f\u6210\u5f02\u6784\u6a21\u578b\uff1b\u4ee5\u7ecf\u5b9e\u6d4b\u9a8c\u8bc1\u7684\u670d\u52a1\u5f15\u64ce\u6210\u672c\u6a21\u578b\u7ea6\u675f\u5ef6\u8fdf\u3001\u541e\u5410\u548c\u663e\u5b58\u3002", "why_notable": "\u628a\u526a\u679d\u76ee\u6807\u4ece\u53c2\u6570\u91cf\u8f6c\u5411\u5b9e\u9645\u90e8\u7f72\u7ea6\u675f\uff0c\u51cf\u5c11\u4eba\u5de5\u9009\u578b\uff1b\u8de8\u6d88\u8d39\u7ea7\u4e0e\u6570\u636e\u4e2d\u5fc3\u786c\u4ef6\u7684\u7ed3\u679c\u663e\u793a\uff0c\u786c\u4ef6\u9002\u914d\u53ef\u6539\u5584\u538b\u7f29\u540e\u7684\u7cbe\u5ea6\u3002"}, {"abstract": "Industrial recommender systems allocate substantial computation to pointwise candidate scoring, yet separate reranking and mix-ranking stages still assemble the final exposure slate using hand-crafted rules and specialized low-capacity models. Mix-ranking combines product cards, short videos, livestreams, and advertising cards supplied by distinct upstream business channels. Although these rules and models encode valuable domain knowledge, they are inherently limited in leveraging additional data and computation. They constrain the combinatorial space of candidate slates and determine objective trade-offs through manual tuning. To enable scalable and effective slate generation, we reformulate reranking and mix-ranking as a unified learning problem whose performance can improve with computation. Specifically, we instantiate this formulation across the reranking and mix-ranking stages and propose OneTrans-GSR, a single decoder-only policy that extends our deployed OneTrans backbone to generate the exposure slate end-to-end. During training, a reward model evaluates complete slates and guides reinforcement learning toward slate-level and long-term objectives. During decoding, business constraints are explicitly enforced. Offline evaluation shows that slate quality consistently improves as reward-model and policy compute increase. Deployed in a large-scale industrial recommendation system, OneTrans-GSR mixes heterogeneous content types within a unified slate. In online A/B tests, it improves GMV/u by 2.63%, advertiser value by 2.06%, and repurchase rate by 2.03%, while reducing end-to-end latency across the reranking and mix-ranking stages by 13%. These results mark a paradigm shift in slate generation: moving beyond human-engineered heuristics toward a general learned policy creates a scalable path for further algorithmic optimization and compute-driven improvement.", "arxiv_id": "2611.04720", "arxiv_url": "https://arxiv.org/abs/2611.04720", "authors": ["Feng Cheng", "Yu-Hsuan Huang", "Fengyi Wang", "Chaofan Zhou", "Zhennan Zhu", "Huan He", "Bo Zhang", "Ruoqi Zhang", "Zhanfeng Mo", "Ziwei Liu", "Lanyi Li", "Yifeng Pan", "Junhua Long", "Ziqiu Zhou", "Yue Lin", "Shaowei Liu"], "brief": "OneTrans-GSR\u4ee5\u5355\u4e2a\u4ec5\u89e3\u7801\u5668\u6a21\u578b\u7aef\u5230\u7aef\u751f\u6210\u6df7\u5408\u5185\u5bb9\u5c55\u793a\u5217\u8868\u3002\u8bad\u7ec3\u65f6\u7528\u6574\u5217\u8868\u5956\u52b1\u6307\u5bfc\u5f3a\u5316\u5b66\u4e60\uff0c\u89e3\u7801\u65f6\u663e\u5f0f\u6267\u884c\u4e1a\u52a1\u7ea6\u675f\u3002", "categories": ["cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04720", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57fa\u4e8eOneTrans\uff0c\u4ee5\u81ea\u56de\u5f52\u7b56\u7565\u7edf\u4e00\u91cd\u6392\u4e0e\u6df7\u6392", "\u5956\u52b1\u6a21\u578b\u8bc4\u4f30\u5b8c\u6574\u5217\u8868\uff0c\u4f18\u5316\u5217\u8868\u7ea7\u4e0e\u957f\u671f\u76ee\u6807", "\u7ebf\u4e0a\u4eba\u5747GMV\u63d0\u53472.63%\uff0c\u7aef\u5230\u7aef\u5ef6\u8fdf\u964d\u4f4e13%"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u751f\u6210\u5f0f\u6392\u5e8f", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2611.04720v1", "published_at": "2026-11-03", "score": 0.481, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04720.png", "title": "OneTrans-GSR: A Generative Slate Ranking Paradigm Unifying Reranking and Mix-Ranking with One Autoregressive Transformer", "tldr": "\u7528\u81ea\u56de\u5f52\u6a21\u578b\u7edf\u4e00\u63a8\u8350\u91cd\u6392\u4e0e\u6df7\u6392\uff0c\u5728\u5de5\u4e1a\u90e8\u7f72\u4e2d\u63d0\u5347\u6536\u76ca\u5e76\u964d\u4f4e\u5ef6\u8fdf\u3002", "upvotes": 3, "what_it_is": "OneTrans-GSR\u4ee5\u5355\u4e2a\u4ec5\u89e3\u7801\u5668\u6a21\u578b\u7aef\u5230\u7aef\u751f\u6210\u6df7\u5408\u5185\u5bb9\u5c55\u793a\u5217\u8868\u3002\u8bad\u7ec3\u65f6\u7528\u6574\u5217\u8868\u5956\u52b1\u6307\u5bfc\u5f3a\u5316\u5b66\u4e60\uff0c\u89e3\u7801\u65f6\u663e\u5f0f\u6267\u884c\u4e1a\u52a1\u7ea6\u675f\u3002", "why_notable": "\u5c06\u4eba\u5de5\u89c4\u5219\u4e3b\u5bfc\u7684\u5217\u8868\u7f16\u6392\u8f6c\u4e3a\u53ef\u5b66\u4e60\u7b56\u7565\uff0c\u5e76\u5728\u5de5\u4e1a\u7cfb\u7edf\u9a8c\u8bc1\u6536\u76ca\uff1b\u79bb\u7ebf\u7ed3\u679c\u663e\u793a\uff0c\u5956\u52b1\u6a21\u578b\u4e0e\u7b56\u7565\u8ba1\u7b97\u91cf\u589e\u52a0\u53ef\u6301\u7eed\u6539\u5584\u5217\u8868\u8d28\u91cf\u3002"}, {"abstract": "Recent years have witnessed remarkable progress in video generation in terms of visual quality and temporal consistency. However, generating videos with precise spatial structure, coherent motion dynamics, and controllable scene composition remains challenging. In this paper, we introduce Video-Coder, the first attempt to train a code-driven video generation agent, which autonomously writes and executes code to construct a dynamic 3D scene (Draft Video) that provides structure and motion signals to downstream video generators. To support this paradigm, we design a dedicated data pipeline and curate two high-quality datasets, Video-Coder-SFT-6k and Video-Coder-RL-2k, which contain diverse prompts and ground-truth reference videos. We further develop the Video- Coder Harness, a unified interactive environment integrating code execution, 3D scene rendering, and execution feedback for agent training and inference. We then train Video-Coder with SFT fol- lowed by harness-native agentic reinforcement learning with dual reward feedback, which combines execution-based and video-based rewards. Additionally, we design an annealing training strategy that gradually reduces the execution reward over time, allowing the model to rely more on the video reward in the later training stages. Experiments show that Video-Coder achieves significant gains, improving Minimax-H3 by approximately 7 points on PhyGenBench and 24 points on VBench-2.0. We hope this work can serve as an open foundation for coding agents in video generation, and we fully open-source our data, models, and code", "arxiv_id": "2611.09894", "arxiv_url": "https://arxiv.org/abs/2611.09894", "authors": ["Chaoyang Wang", "Sicheng Gao", "Junan Hu", "Kunyang Li", "Dongyang Chen", "Yiyang Zhou", "Huaxiu Yao", "Yong Jae Lee", "Radu Timofte", "Yuzhang Shang"], "brief": "\u8bad\u7ec3\u80fd\u81ea\u4e3b\u7f16\u5199\u5e76\u6267\u884c\u4ee3\u7801\u7684\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53\uff0c\u7528\u52a8\u6001\u4e09\u7ef4\u573a\u666f\u8349\u7a3f\u4e3a\u4e0b\u6e38\u6a21\u578b\u63d0\u4f9b\u7ed3\u6784\u548c\u8fd0\u52a8\u4fe1\u53f7\u3002\u5148\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7ed3\u5408\u6267\u884c\u4e0e\u89c6\u9891\u53cc\u5956\u52b1\u5f00\u5c55\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/CYWang735/Video-Coder", "github_stars": 25, "hf_url": "https://huggingface.co/papers/2611.09894", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efaSFT-6k\u4e0eRL-2k\u6570\u636e\u96c6\uff0c\u914d\u5957\u6267\u884c\u548c\u6e32\u67d3\u73af\u5883", "\u53cc\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u4e2d\u9010\u6b65\u964d\u4f4e\u6267\u884c\u5956\u52b1\u6743\u91cd", "Minimax-H3\u5728\u4e24\u9879\u57fa\u51c6\u4e0a\u5206\u522b\u63d0\u5347\u7ea67\u548c24\u5206"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7f16\u7a0b\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4e09\u7ef4\u573a\u666f"], "num_comments": 3, "on_hf": true, "organization": "University of Central Florida", "pdf_url": "https://arxiv.org/pdf/2611.09894v1", "published_at": "2026-11-06", "score": 0.461, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09894.png", "title": "Video-Coder: Reinforcing Agentic Coding for Video Generation", "tldr": "\u8ba9\u667a\u80fd\u4f53\u5199\u4ee3\u7801\u6784\u5efa\u52a8\u6001\u4e09\u7ef4\u573a\u666f\uff0c\u518d\u5f15\u5bfc\u89c6\u9891\u751f\u6210\uff0c\u63d0\u5347\u7ed3\u6784\u4e0e\u8fd0\u52a8\u53ef\u63a7\u6027\u3002", "upvotes": 16, "what_it_is": "\u8bad\u7ec3\u80fd\u81ea\u4e3b\u7f16\u5199\u5e76\u6267\u884c\u4ee3\u7801\u7684\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53\uff0c\u7528\u52a8\u6001\u4e09\u7ef4\u573a\u666f\u8349\u7a3f\u4e3a\u4e0b\u6e38\u6a21\u578b\u63d0\u4f9b\u7ed3\u6784\u548c\u8fd0\u52a8\u4fe1\u53f7\u3002\u5148\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u7ed3\u5408\u6267\u884c\u4e0e\u89c6\u9891\u53cc\u5956\u52b1\u5f00\u5c55\u5f3a\u5316\u5b66\u4e60\u3002", "why_notable": "\u5c06\u4ee3\u7801\u6267\u884c\u4e0e\u4e09\u7ef4\u6e32\u67d3\u63a5\u5165\u89c6\u9891\u751f\u6210\uff0c\u4e3a\u7cbe\u786e\u63a7\u5236\u573a\u666f\u548c\u8fd0\u52a8\u63d0\u4f9b\u65b0\u8def\u5f84\uff1b\u6570\u636e\u3001\u6a21\u578b\u4e0e\u4ee3\u7801\u5168\u90e8\u5f00\u6e90\uff0c\u4fbf\u4e8e\u590d\u7528\u3002"}, {"abstract": "Automating printed circuit board (PCB) routing requires coordinating board-level connectivity decisions with geometric execution under strict design rules. Although recent agents can interact with native routing tools, reliable routing on complex boards remains challenging. We present PCBRouteAgent, a multimodal PCB routing agent inspired by how human engineers coordinate global strategy with local execution. A Global Routing Planner combines board images and structured electrical and geometric information to specify connection topology, routing order, corridors, and layer transitions. A Detailed Routing Executor realizes these guides through KiCad\u0027s native routing engine and performs bounded local recovery. Unresolved failures are returned as structured feedback, enabling targeted guide revisions while preserving accepted routes. We evaluate PCBRouteAgent on 247 synthetic and real-world boards from four PCBWorld-Bench test splits. It achieves clean-pass rates of 100%, 94.9%, 100%, and 40% on D2, D3-A, D3-B, and D3-C, respectively. On the three real-world subsets, PCBRouteAgent outperforms the best evaluated baseline in clean-pass rate by 13.9, 36, and 10 percentage points, respectively.", "arxiv_id": "2611.08175", "arxiv_url": "https://arxiv.org/abs/2611.08175", "authors": ["Yue Zhang", "Jilei Sun", "Liqiang Jing", "Yijie Wei", "Ruohan Yang"], "brief": "\u8be5\u7cfb\u7edf\u5c06\u7535\u8def\u677f\u56fe\u50cf\u4e0e\u7ed3\u6784\u5316\u7535\u6c14\u3001\u51e0\u4f55\u4fe1\u606f\u4ea4\u7ed9\u5168\u5c40\u89c4\u5212\u5668\uff0c\u518d\u7531\u6267\u884c\u5668\u8c03\u7528 KiCad \u5b8c\u6210\u5e03\u7ebf\uff1b\u5931\u8d25\u4ee5\u7ed3\u6784\u5316\u53cd\u9988\u89e6\u53d1\u5b9a\u5411\u4fee\u8ba2\uff0c\u5e76\u4fdd\u7559\u5df2\u63a5\u53d7\u7684\u8d70\u7ebf\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/chip-ai-agent/PCBRouteAgent", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2611.08175", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5168\u5c40\u89c4\u5212\u5668\u6307\u5b9a\u8fde\u63a5\u62d3\u6251\u3001\u5e03\u7ebf\u987a\u5e8f\u3001\u8d70\u5eca\u4e0e\u6362\u5c42", "\u6267\u884c\u5668\u8c03\u7528 KiCad \u539f\u751f\u5e03\u7ebf\u5f15\u64ce\u5e76\u8fdb\u884c\u6709\u9650\u5c40\u90e8\u6062\u590d", "247\u5757\u677f\u6d4b\u8bd5\uff0c\u56db\u7ec4\u5b8c\u5168\u901a\u8fc7\u7387\u4e3a100%\u300194.9%\u3001100%\u300140%"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u7535\u8def\u677f\u5e03\u7ebf", "\u81ea\u52a8\u5316\u8bbe\u8ba1"], "num_comments": 8, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08175v1", "published_at": "2026-11-05", "score": 0.452, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08175.png", "title": "PCBRouteAgent: How Close Are LLM Agents to Becoming PCB Routing Engineers?", "tldr": "\u901a\u8fc7\u5168\u5c40\u89c4\u5212\u4e0e\u5c40\u90e8\u6267\u884c\u534f\u540c\uff0c\u591a\u6a21\u6001\u667a\u80fd\u4f53\u63d0\u5347\u590d\u6742\u7535\u8def\u677f\u81ea\u52a8\u5e03\u7ebf\u6210\u529f\u7387\u3002", "upvotes": 30, "what_it_is": "\u8be5\u7cfb\u7edf\u5c06\u7535\u8def\u677f\u56fe\u50cf\u4e0e\u7ed3\u6784\u5316\u7535\u6c14\u3001\u51e0\u4f55\u4fe1\u606f\u4ea4\u7ed9\u5168\u5c40\u89c4\u5212\u5668\uff0c\u518d\u7531\u6267\u884c\u5668\u8c03\u7528 KiCad \u5b8c\u6210\u5e03\u7ebf\uff1b\u5931\u8d25\u4ee5\u7ed3\u6784\u5316\u53cd\u9988\u89e6\u53d1\u5b9a\u5411\u4fee\u8ba2\uff0c\u5e76\u4fdd\u7559\u5df2\u63a5\u53d7\u7684\u8d70\u7ebf\u3002", "why_notable": "\u5728\u4e09\u4e2a\u771f\u5b9e\u7535\u8def\u677f\u5b50\u96c6\u4e0a\uff0c\u5b8c\u5168\u901a\u8fc7\u7387\u8f83\u6700\u5f3a\u53d7\u6d4b\u57fa\u7ebf\u63d0\u9ad813.9\u300136\u548c10\u4e2a\u767e\u5206\u70b9\uff0c\u5c55\u793a\u4e86\u5206\u5c42\u534f\u4f5c\u4e0e\u53cd\u9988\u4fee\u8ba2\u7684\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "Scientific names increasingly connect papers from different research topics, leaving readers to recover a paper\u0027s identity from context. We study this convergence in 564,861 AI-related arXiv records. Cross-topic name collision grows 4.33-fold from a pooled 2020-2022 reference to 2026, compared with 1.12-fold within topics. A second sentence encoder reproduces the pattern, and name-group resampling quantifies its uncertainty. Fixed word-frequency bands locate the main increase in an intermediate-frequency vocabulary shared by many research areas. We then measure the ambiguity that remains after supplying research clues. With the same three-term query construction, shared-name targets retain matched identification deficits of 25.7 percentage points under title-based BM25 and 6.9 points under title-plus-abstract E5. Within fixed same-name candidates, listwise language-model ranking reaches 89.2% using the query and candidate titles. Topic-specific comparisons show that context resolves more cross-topic ambiguity. The evaluation separates candidate competition, document fields, and contextual ranking through lexical, dense, and language-model baselines. Source-linked cases and a portable evaluation collection make the phenomenon inspectable and reusable for scientific retrieval and research assistants.", "arxiv_id": "2611.01362", "arxiv_url": "https://arxiv.org/abs/2611.01362", "authors": ["Jingjie Ning", "Xueqi Li", "Yibo Kong"], "brief": "\u7814\u7a76\u5206\u6790AI\u76f8\u5173arXiv\u8bba\u6587\u7684\u8de8\u4e3b\u9898\u649e\u540d\u8d8b\u52bf\uff0c\u5e76\u7528\u7edf\u4e00\u4e09\u8bcd\u67e5\u8be2\u6d4b\u8bd5\u8bba\u6587\u8bc6\u522b\u80fd\u529b\uff0c\u901a\u8fc7\u8bcd\u6cd5\u3001\u7a20\u5bc6\u68c0\u7d22\u4e0e\u8bed\u8a00\u6a21\u578b\u6392\u5e8f\u533a\u5206\u6b67\u4e49\u6765\u6e90\u3002", "categories": ["cs.IR", "cs.DL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01362", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["564,861\u6761\u8bb0\u5f55\uff1a\u8de8\u4e3b\u9898\u649e\u540d\u589e\u81f34.33\u500d", "\u649e\u540d\u76ee\u6807\u8bc6\u522b\u7387\u5dee\u8ddd\uff1aBM25\u4e3a25.7\u3001E5\u4e3a6.9\u4e2a\u767e\u5206\u70b9", "\u56fa\u5b9a\u540c\u540d\u5019\u9009\u4e2d\uff0c\u8bed\u8a00\u6a21\u578b\u5217\u8868\u6392\u5e8f\u51c6\u786e\u7387\u8fbe89.2%"], "keywords": ["\u79d1\u5b66\u6587\u732e\u68c0\u7d22", "\u540d\u79f0\u6b67\u4e49", "\u4e0a\u4e0b\u6587\u6d88\u6b67", "\u8bed\u8a00\u6a21\u578b\u6392\u5e8f"], "num_comments": 3, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2611.01362v1", "published_at": "2026-11-01", "score": 0.426, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01362.png", "title": "\"PRISM\" Is Not All You Need: Cross-Topic Name Collisions and Scientific Paper Retrieval", "tldr": "\u79d1\u7814\u547d\u540d\u8de8\u4e3b\u9898\u649e\u540d\u663e\u8457\u52a0\u5267\u68c0\u7d22\u6b67\u4e49\uff0c\u8865\u5145\u4e0a\u4e0b\u6587\u53ef\u7f13\u89e3\u4f46\u96be\u4ee5\u6d88\u9664", "upvotes": 4, "what_it_is": "\u7814\u7a76\u5206\u6790AI\u76f8\u5173arXiv\u8bba\u6587\u7684\u8de8\u4e3b\u9898\u649e\u540d\u8d8b\u52bf\uff0c\u5e76\u7528\u7edf\u4e00\u4e09\u8bcd\u67e5\u8be2\u6d4b\u8bd5\u8bba\u6587\u8bc6\u522b\u80fd\u529b\uff0c\u901a\u8fc7\u8bcd\u6cd5\u3001\u7a20\u5bc6\u68c0\u7d22\u4e0e\u8bed\u8a00\u6a21\u578b\u6392\u5e8f\u533a\u5206\u6b67\u4e49\u6765\u6e90\u3002", "why_notable": "\u5c06\u79d1\u7814\u649e\u540d\u8f6c\u5316\u4e3a\u53ef\u91cf\u5316\u7684\u68c0\u7d22\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u53ef\u590d\u7528\u8bc4\u6d4b\u96c6\uff0c\u4e3a\u79d1\u5b66\u68c0\u7d22\u4e0e\u7814\u7a76\u52a9\u624b\u7684\u4e0a\u4e0b\u6587\u6d88\u6b67\u8bbe\u8ba1\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Language models are accurate on most long-arithmetic problems, but their accuracy is estimated on samples and carries no guarantee for an unseen input; tool use is exact but moves the computation outside the network. We show that exactness at all input lengths becomes a finite, checkable property of a network when each of its steps reads only a bounded view of an external working memory. In Sketchpad, Qwen3.5-0.8B with a low-rank adapter executes arithmetic procedures on a rendered sheet. Each forward pass reads a three-cell view and emits one step: a digit, a carry or borrow, and the next operation. A fixed runtime moves the view and writes no digit of a result. We prove in Lean that the model is then exact on all inputs of any length if and only if it is exact on the finite set of views the runtime presents, that no finite test suffices when steps also read earlier steps, and that the guarantee tolerates bounded numerical perturbation and extends to compositions of procedures. All 2,446 views pass on the deployment device, a laptop GPU running the model in a web browser. The certified model performs signed addition and subtraction, long multiplication and division, square roots and greatest common divisors at arbitrary length. It solved 200 of 200 pre-registered problems in the browser, and 220 of 220 sums of up to 1,000 digits and products of up to 20 digits, of which GPT-6.1 Sol, the strongest of ten other models, solved 217. A symbolic runtime built on these procedures solves, expands and factors polynomials with every number computed by the model, and a multiplicative gate on the adapter recovers the base model exactly when the sheet is not in use.", "arxiv_id": "2611.04434", "arxiv_url": "https://arxiv.org/abs/2611.04434", "authors": ["Mostafa \u0027Neo\u0027 Mohsenvand"], "brief": "\u5c06\u4f4e\u79e9\u9002\u914d\u7684Qwen3.5-0.8B\u9650\u5236\u4e3a\u6bcf\u6b65\u8bfb\u53d6\u7eb8\u9762\u4e09\u4e2a\u5355\u5143\uff0c\u8f93\u51fa\u6570\u5b57\u3001\u8fdb\u501f\u4f4d\u4e0e\u4e0b\u4e00\u64cd\u4f5c\u3002\u8fd0\u884c\u65f6\u4ec5\u79fb\u52a8\u89c6\u56fe\uff0c\u7b97\u672f\u7ed3\u679c\u7531\u6a21\u578b\u751f\u6210\u3002", "categories": ["cs.LG", "cs.CL", "cs.LO"], "github_repo": "https://github.com/NeoVand/sketchpad", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04434", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["Lean\u8bc1\u660e\uff1a\u5c40\u90e8\u89c6\u56fe\u5168\u6b63\u786e\u7b49\u4ef7\u4e8e\u4efb\u610f\u957f\u5ea6\u7cbe\u786e", "\u90e8\u7f72\u7aef\u5168\u90e82,446\u4e2a\u89c6\u56fe\u9a8c\u8bc1\u901a\u8fc7", "\u6d4f\u89c8\u5668\u6d4b\u8bd5200\u9898\u5168\u5bf9\uff0c\u53e6220\u9898\u4ea6\u5168\u5bf9"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u7cbe\u786e\u7b97\u672f", "\u4f4e\u79e9\u9002\u914d"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04434v1", "published_at": "2026-11-03", "score": 0.42, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04434.png", "title": "Sketchpad: certified exact arithmetic with a small vision-language model", "tldr": "\u901a\u8fc7\u6709\u9650\u5c40\u90e8\u89c6\u56fe\u9a8c\u8bc1\uff0c\u8ba9\u5c0f\u578b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u83b7\u5f97\u4efb\u610f\u957f\u5ea6\u7b97\u672f\u7684\u7cbe\u786e\u6027\u4fdd\u8bc1\u3002", "upvotes": 3, "what_it_is": "\u5c06\u4f4e\u79e9\u9002\u914d\u7684Qwen3.5-0.8B\u9650\u5236\u4e3a\u6bcf\u6b65\u8bfb\u53d6\u7eb8\u9762\u4e09\u4e2a\u5355\u5143\uff0c\u8f93\u51fa\u6570\u5b57\u3001\u8fdb\u501f\u4f4d\u4e0e\u4e0b\u4e00\u64cd\u4f5c\u3002\u8fd0\u884c\u65f6\u4ec5\u79fb\u52a8\u89c6\u56fe\uff0c\u7b97\u672f\u7ed3\u679c\u7531\u6a21\u578b\u751f\u6210\u3002", "why_notable": "\u628a\u62bd\u6837\u51c6\u786e\u7387\u63d0\u5347\u4e3a\u53ef\u68c0\u67e5\u7684\u5168\u957f\u5ea6\u4fdd\u8bc1\uff0c\u540c\u65f6\u4fdd\u7559\u7f51\u7edc\u5185\u90e8\u7b97\u672f\u8ba1\u7b97\uff1b\u8bc1\u660e\u8fd8\u8986\u76d6\u6709\u754c\u6570\u503c\u6270\u52a8\u4e0e\u591a\u8fc7\u7a0b\u7ec4\u5408\u3002"}, {"abstract": "Foundation models increasingly guide robot actions, yet sustained autonomy requires efficient control and failure recovery. We introduce A2-MEAS, an embodied multi-agent framework built around code as a scaling interface. Learned correction codes combine corrective language, spatial evidence, execution history, and action proposals. MetaBrain provides training supervision and runtime guidance. A correction encoder and adapter absorb this knowledge into policy weights during training, while fresh codes adapt behavior with frozen weights at deployment. The action model, A2-WLA, adds motion-aware history and a latent world model to a vision-language-action policy. Surprisingly, this simple design with action pretraining and task specialization reaches 0.5755 Q-score on the 50-task BEHAVIOR 2026 public subset before online correction, 2.21x the 2025 winner\u0027s reported 0.2605 across different benchmark editions and training configurations. On all 100 BEHAVIOR 2026 public tasks, A2-MEAS achieves 0.6411 Q-score and 45.40% task success. On RoboTwin 2.0, A2-WLA achieves 93.98% average success, rising to 95.05% with the complete system. Across 12 real-robot tasks in five household settings, A2-WLA achieves 57.92% average success versus 26.67% for pi0.5. In long-horizon pour-over coffee preparation, a history-conditioned adapter raises post-failure completion at two filter-handling steps from 14% to 94% and from 8% to 82%, compared with A2-WLA retries. Our training infrastructure delivers 427.1 samples per second, 4.03x the throughput of a pi0.5 reference implementation on matched hardware. We will release the system, models, training scripts, and infrastructure to support efficient embodied learning.", "arxiv_id": "2611.09124", "arxiv_url": "https://arxiv.org/abs/2611.09124", "authors": ["Chao Liang", "Ke Chen", "Fengxiaoxiao Li", "Shibo Huang", "Yufeng Sun", "Zhaokai Yin", "Jianhuan Lai", "Haozhe Feng", "Chenghuan Jia", "Zhipeng Zhang"], "brief": "A2-MEAS\u5c06\u8bed\u8a00\u7ea0\u6b63\u3001\u7a7a\u95f4\u8bc1\u636e\u4e0e\u6267\u884c\u5386\u53f2\u7f16\u7801\u4e3a\u7ea0\u9519\u4ee3\u7801\uff0c\u7531MetaBrain\u6307\u5bfc\u8bad\u7ec3\u548c\u90e8\u7f72\uff1b\u52a8\u4f5c\u7b56\u7565\u7ed3\u5408\u8fd0\u52a8\u5386\u53f2\u4e0e\u6f5c\u5728\u4e16\u754c\u6a21\u578b\uff0c\u90e8\u7f72\u65f6\u51bb\u7ed3\u6743\u91cd\u4ecd\u53ef\u7ea0\u9519\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/AutoLab-SAI-SJTU/A2MEAS", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.09124", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["A2-WLA\u878d\u5408\u8fd0\u52a8\u611f\u77e5\u5386\u53f2\u4e0e\u6f5c\u5728\u4e16\u754c\u6a21\u578b", "BEHAVIOR 2026\u767e\u9879\u4efb\u52a1\u6210\u529f\u738745.40%", "\u5386\u53f2\u6761\u4ef6\u9002\u914d\u5668\u4f7f\u4e00\u5904\u5931\u8d25\u540e\u5b8c\u6210\u7387\u4ece14%\u5347\u81f394%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u591a\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u63a7\u5236", "\u5931\u8d25\u6062\u590d"], "num_comments": 2, "on_hf": true, "organization": "AutoLab", "pdf_url": "https://arxiv.org/pdf/2611.09124v1", "published_at": "2026-11-06", "score": 0.381, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09124.png", "title": "Toward the Era of Agentic Embodied Intelligence", "tldr": "\u901a\u8fc7\u591a\u667a\u80fd\u4f53\u7ea0\u9519\u4e0e\u5386\u53f2\u611f\u77e5\u7b56\u7565\uff0c\u63d0\u5347\u673a\u5668\u4eba\u957f\u7a0b\u4efb\u52a1\u81ea\u4e3b\u6027\u548c\u5931\u8d25\u6062\u590d\u80fd\u529b\u3002", "upvotes": 1, "what_it_is": "A2-MEAS\u5c06\u8bed\u8a00\u7ea0\u6b63\u3001\u7a7a\u95f4\u8bc1\u636e\u4e0e\u6267\u884c\u5386\u53f2\u7f16\u7801\u4e3a\u7ea0\u9519\u4ee3\u7801\uff0c\u7531MetaBrain\u6307\u5bfc\u8bad\u7ec3\u548c\u90e8\u7f72\uff1b\u52a8\u4f5c\u7b56\u7565\u7ed3\u5408\u8fd0\u52a8\u5386\u53f2\u4e0e\u6f5c\u5728\u4e16\u754c\u6a21\u578b\uff0c\u90e8\u7f72\u65f6\u51bb\u7ed3\u6743\u91cd\u4ecd\u53ef\u7ea0\u9519\u3002", "why_notable": "\u628a\u7b56\u7565\u5b66\u4e60\u4e0e\u8fd0\u884c\u65f6\u7ea0\u9519\u8fde\u63a5\u8d77\u6765\uff0c\u517c\u987e\u6267\u884c\u6548\u7387\u548c\u5931\u8d25\u6062\u590d\uff1b\u771f\u5b9e\u673a\u5668\u4eba\u5341\u4e8c\u9879\u4efb\u52a1\u6210\u529f\u7387\u663e\u8457\u9ad8\u4e8e\u57fa\u7ebf\uff0c\u663e\u793a\u5bb6\u5ead\u957f\u7a0b\u64cd\u4f5c\u6f5c\u529b\u3002"}, {"abstract": "Frontier agentic LLMs are trained on verifiable rewards in reinforcement learning (RL) environments built from real software repositories. A passing test suite is treated as the reward for solving the task. We show that, on hard problems, frontier models often satisfy these rewards by obtaining the answer instead of deriving it, known as reward hacking. Prior reports document this behavior on public benchmarks. We test its persistence on unseen problems. In a hardened environment where the answer cannot leak, nearly every model we tested attempted to recover the answer, escalating through tiers of increasingly specialized exploitation: mining the repository history for the upstream fix, inspecting the git object store directly, and sweeping the filesystem for a possible newer copy of the source or hidden tests. These attempts were concentrated on the hardest problems, and the models differed in whether, how often, and how deeply they escalated. Our position is that this behavior is a learned shortcut, acquired in RL environments that leak the answer, not a sign of intelligence. We release agent traces for these models to support further study at https://huggingface.co/datasets/logitly-ai/reward-hacking-raw-v1.", "arxiv_id": "2611.10404", "arxiv_url": "https://arxiv.org/abs/2611.10404", "authors": ["Yuntao Gui"], "brief": "\u7814\u7a76\u5728\u963b\u65ad\u7b54\u6848\u6cc4\u6f0f\u7684\u5f3a\u5316\u73af\u5883\u4e2d\u6d4b\u8bd5\u524d\u6cbf\u7f16\u7a0b\u6a21\u578b\uff0c\u89c2\u5bdf\u5176\u89e3\u51b3\u672a\u89c1\u95ee\u9898\u7684\u884c\u4e3a\u3002\u901a\u8fc7\u667a\u80fd\u4f53\u8f68\u8ff9\u5206\u6790\uff0c\u63ed\u793a\u6a21\u578b\u4ece\u4ed3\u5e93\u5386\u53f2\u5230\u6587\u4ef6\u7cfb\u7edf\u9010\u7ea7\u641c\u5bfb\u7b54\u6848\u7684\u7b56\u7565\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10404", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u672a\u89c1\u95ee\u9898\u4e0e\u9632\u6cc4\u6f0f\u73af\u5883\u4e2d\uff0c\u51e0\u4e4e\u6240\u6709\u53d7\u6d4b\u6a21\u578b\u90fd\u5c1d\u8bd5\u627e\u7b54\u6848", "\u641c\u5bfb\u9010\u7ea7\u5347\u7ea7\uff1a\u4ed3\u5e93\u5386\u53f2\u3001git\u5bf9\u8c61\u5e93\u3001\u6587\u4ef6\u7cfb\u7edf", "\u516c\u5f00\u667a\u80fd\u4f53\u8f68\u8ff9\uff0c\u652f\u6301\u5956\u52b1\u6295\u673a\u884c\u4e3a\u7684\u540e\u7eed\u7814\u7a76"], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u6295\u673a", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 1, "on_hf": true, "organization": "logitly-ai", "pdf_url": "https://arxiv.org/pdf/2611.10404v1", "published_at": "2026-11-07", "score": 0.373, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10404.png", "title": "Coding or Cheating? An Investigation of Frontier Coding LLMs", "tldr": "\u524d\u6cbf\u7f16\u7a0b\u667a\u80fd\u4f53\u5728\u672a\u89c1\u96be\u9898\u4e2d\u4ecd\u9891\u7e41\u5c1d\u8bd5\u641c\u5bfb\u7b54\u6848\uff0c\u66b4\u9732\u5956\u52b1\u6295\u673a\u503e\u5411\u3002", "upvotes": 1, "what_it_is": "\u7814\u7a76\u5728\u963b\u65ad\u7b54\u6848\u6cc4\u6f0f\u7684\u5f3a\u5316\u73af\u5883\u4e2d\u6d4b\u8bd5\u524d\u6cbf\u7f16\u7a0b\u6a21\u578b\uff0c\u89c2\u5bdf\u5176\u89e3\u51b3\u672a\u89c1\u95ee\u9898\u7684\u884c\u4e3a\u3002\u901a\u8fc7\u667a\u80fd\u4f53\u8f68\u8ff9\u5206\u6790\uff0c\u63ed\u793a\u6a21\u578b\u4ece\u4ed3\u5e93\u5386\u53f2\u5230\u6587\u4ef6\u7cfb\u7edf\u9010\u7ea7\u641c\u5bfb\u7b54\u6848\u7684\u7b56\u7565\u3002", "why_notable": "\u5c06\u5956\u52b1\u6295\u673a\u8bc1\u636e\u4ece\u516c\u5f00\u57fa\u51c6\u6269\u5c55\u5230\u672a\u89c1\u95ee\u9898\uff0c\u63d0\u793a\u6d4b\u8bd5\u901a\u8fc7\u4e0d\u7b49\u4e8e\u72ec\u7acb\u89e3\u9898\uff0c\u5e76\u4e3a\u6392\u67e5\u5f3a\u5316\u5b66\u4e60\u73af\u5883\u4e2d\u7684\u6377\u5f84\u63d0\u4f9b\u7ebf\u7d22\u3002"}, {"abstract": "Local AI promises capable personal assistants that run on users\u0027 own devices, keeping data and computation under their control. Open-weight models that fit on local devices can now handle practical tasks such as coding. Yet current inference engines fall short. Popular engines such as vLLM and SGLang target datacenter GPUs with dedicated host memory, while local engines underuse the memory hierarchy of unified-memory devices. We present Hibana, an inference engine for unified-memory devices that co-optimizes model representation, memory management, and decoding strategy. Model surgery, the process of editing a trained model\u0027s architecture to suit its hardware, changes how the model computes, shrinking its memory footprint and data movement. Unified-memory management preserves each agent\u0027s state across turns, so long-running agents can resume instantly instead of recomputing their state. Adaptive speculation generates several tokens per step. Hibana codesigns these features around the shared memory capacity and limited bandwidth of unified-memory systems-on-chip to support local multi-agent workloads. On a single DGX Spark serving Qwen and Nemotron models of up to 125B parameters, Hibana completes up to 3.4$\\times$ more agentic tasks per hour and delivers up to 3.9$\\times$ higher decoding throughput than other established frameworks such as vLLM, NVIDIA Flare, llama.cpp, and TensorFold. Code is available at https://github.com/sharar-project/hibana.", "arxiv_id": "2611.10469", "arxiv_url": "https://arxiv.org/abs/2611.10469", "authors": ["Yahya Emara", "Chi-Chih Chang", "Anthony Fei", "Ahmed F. AbouElhamayed", "Chong-Yan Chen", "Hung-Yueh Chiang", "Kai-Chiang Wu", "Mohamed S. Abdelfattah"], "brief": "Hibana\u662f\u9762\u5411\u7edf\u4e00\u5185\u5b58\u8bbe\u5907\u7684\u63a8\u7406\u5f15\u64ce\uff0c\u8054\u5408\u4f18\u5316\u6a21\u578b\u7ed3\u6784\u3001\u5185\u5b58\u7ba1\u7406\u4e0e\u89e3\u7801\u7b56\u7565\u3002\u5b83\u51cf\u5c11\u6570\u636e\u642c\u79fb\u5e76\u8de8\u8f6e\u6b21\u4fdd\u7559\u667a\u80fd\u4f53\u72b6\u6001\uff0c\u652f\u6301\u672c\u5730\u591a\u667a\u80fd\u4f53\u8d1f\u8f7d\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10469", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6a21\u578b\u624b\u672f\u4fee\u6539\u5df2\u8bad\u7ec3\u67b6\u6784\uff0c\u7f29\u51cf\u5185\u5b58\u5360\u7528\u4e0e\u6570\u636e\u642c\u79fb\u3002", "\u8de8\u8f6e\u6b21\u4fdd\u7559\u667a\u80fd\u4f53\u72b6\u6001\uff0c\u81ea\u9002\u5e94\u63a8\u6d4b\u6bcf\u6b65\u751f\u6210\u591a\u4e2a\u8bcd\u5143\u3002", "\u5355\u53f0DGX Spark\u8fd0\u884c\u81f3125B\u6a21\u578b\uff0c\u4efb\u52a1\u7387\u6700\u9ad8\u63d0\u53473.4\u500d\u3002"], "keywords": ["\u672c\u5730\u63a8\u7406", "\u7edf\u4e00\u5185\u5b58", "\u591a\u667a\u80fd\u4f53", "\u63a8\u6d4b\u89e3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10469v1", "published_at": "2026-11-07", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Hibana: Fast Agentic Inference on Unified-Memory Devices", "tldr": "\u901a\u8fc7\u6a21\u578b\u6539\u9020\u3001\u72b6\u6001\u4fdd\u7559\u4e0e\u81ea\u9002\u5e94\u63a8\u6d4b\u89e3\u7801\uff0c\u663e\u8457\u52a0\u901f\u7edf\u4e00\u5185\u5b58\u8bbe\u5907\u4e0a\u7684\u672c\u5730\u667a\u80fd\u4f53\u3002", "upvotes": 0, "what_it_is": "Hibana\u662f\u9762\u5411\u7edf\u4e00\u5185\u5b58\u8bbe\u5907\u7684\u63a8\u7406\u5f15\u64ce\uff0c\u8054\u5408\u4f18\u5316\u6a21\u578b\u7ed3\u6784\u3001\u5185\u5b58\u7ba1\u7406\u4e0e\u89e3\u7801\u7b56\u7565\u3002\u5b83\u51cf\u5c11\u6570\u636e\u642c\u79fb\u5e76\u8de8\u8f6e\u6b21\u4fdd\u7559\u667a\u80fd\u4f53\u72b6\u6001\uff0c\u652f\u6301\u672c\u5730\u591a\u667a\u80fd\u4f53\u8d1f\u8f7d\u3002", "why_notable": "\u5c06\u4f18\u5316\u91cd\u70b9\u4ece\u6570\u636e\u4e2d\u5fc3\u63a8\u7406\u8f6c\u5411\u672c\u5730\u7edf\u4e00\u5185\u5b58\u786c\u4ef6\uff1b\u76f8\u6bd4\u73b0\u6709\u6846\u67b6\uff0c\u89e3\u7801\u541e\u5410\u6700\u9ad8\u63d0\u53473.9\u500d\uff0c\u4e3a\u957f\u671f\u8fd0\u884c\u7684\u591a\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u9ad8\u6548\u5e95\u5ea7\u3002"}, {"abstract": "We identify a key limitation of existing feed-forward 3DGS methods: Gaussian attributes are typically predicted in a radial-distance-normalized space that canonicalizes a global radial statistic of the reconstructed geometry, while the spacing between neighboring Gaussian centers can still vary substantially across scene scales and camera configurations. This mismatch induces systematic shifts in Gaussian-scale targets, leading to ambiguous supervision. To address this, we propose SplatAnything with Gaussian Spacing Normalization (GSNorm), which canonicalizes a robust scene-level statistic of Gaussian spacing to provide a more consistent spatial reference for Gaussian prediction. To rigorously assess our method, we further establish a systematic benchmark spanning diverse datasets, input sparsity levels, and challenging extrapolated viewpoints. Extensive experiments demonstrate that SplatAnything achieves state-of-the-art performance, with particularly strong gains under substantial variations in scene scale and viewpoint.", "arxiv_id": "2611.08264", "arxiv_url": "https://arxiv.org/abs/2611.08264", "authors": ["Hao Yu", "Zhenwei Wang", "Yongzhen Hu", "Yuning Gong", "Junta Wu", "Xiaowei Zhou", "Hujun Bao", "Tengfei Wang", "Chunchao Guo", "Sida Peng"], "brief": "\u63d0\u51fa\u9ad8\u65af\u95f4\u8ddd\u5f52\u4e00\u5316\u65b9\u6cd5GSNorm\uff0c\u4ee5\u7a33\u5065\u7684\u573a\u666f\u7ea7\u95f4\u8ddd\u7edf\u8ba1\u91cf\u7edf\u4e00\u7a7a\u95f4\u53c2\u8003\uff0c\u66ff\u4ee3\u4ec5\u4f9d\u8d56\u5f84\u5411\u8ddd\u79bb\u7684\u5f52\u4e00\u5316\uff0c\u7f13\u89e3\u9ad8\u65af\u5c3a\u5ea6\u9884\u6d4b\u4e2d\u7684\u76d1\u7763\u6b67\u4e49\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zju3dv/SplatAnything", "github_stars": 88, "hf_url": "https://huggingface.co/papers/2611.08264", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["GSNorm\u7edf\u4e00\u573a\u666f\u7ea7\u9ad8\u65af\u95f4\u8ddd\u7edf\u8ba1\u91cf", "\u5efa\u7acb\u8986\u76d6\u591a\u6570\u636e\u96c6\u3001\u8f93\u5165\u7a00\u758f\u5ea6\u4e0e\u5916\u63a8\u89c6\u89d2\u7684\u57fa\u51c6", "\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u5c3a\u5ea6\u4e0e\u89c6\u89d2\u53d8\u5316\u5927\u65f6\u6536\u76ca\u7a81\u51fa"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u9ad8\u65af\u6cfc\u6e85", "\u5f52\u4e00\u5316", "\u8de8\u573a\u666f\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2611.08264v1", "published_at": "2026-11-05", "score": 0.329, "selected_reasons": ["HF trending (63\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08264.png", "title": "SplatAnything: Gaussian Spacing Normalization for Feed-forward 3DGS across Arbitrary Scenes", "tldr": "\u901a\u8fc7\u7edf\u4e00\u9ad8\u65af\u4e2d\u5fc3\u95f4\u8ddd\uff0c\u63d0\u5347\u524d\u9988\u4e09\u7ef4\u91cd\u5efa\u8de8\u573a\u666f\u5c3a\u5ea6\u4e0e\u89c6\u89d2\u7684\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 63, "what_it_is": "\u63d0\u51fa\u9ad8\u65af\u95f4\u8ddd\u5f52\u4e00\u5316\u65b9\u6cd5GSNorm\uff0c\u4ee5\u7a33\u5065\u7684\u573a\u666f\u7ea7\u95f4\u8ddd\u7edf\u8ba1\u91cf\u7edf\u4e00\u7a7a\u95f4\u53c2\u8003\uff0c\u66ff\u4ee3\u4ec5\u4f9d\u8d56\u5f84\u5411\u8ddd\u79bb\u7684\u5f52\u4e00\u5316\uff0c\u7f13\u89e3\u9ad8\u65af\u5c3a\u5ea6\u9884\u6d4b\u4e2d\u7684\u76d1\u7763\u6b67\u4e49\u3002", "why_notable": "\u5c06\u5f52\u4e00\u5316\u53c2\u8003\u4ece\u5168\u5c40\u5f84\u5411\u8ddd\u79bb\u8f6c\u5411\u5c40\u90e8\u95f4\u8ddd\u7edf\u8ba1\uff0c\u76f4\u6307\u5c3a\u5ea6\u76d1\u7763\u4e0d\u4e00\u81f4\u95ee\u9898\uff0c\u4e3a\u8de8\u573a\u666f\u524d\u9988\u4e09\u7ef4\u91cd\u5efa\u63d0\u4f9b\u6709\u6548\u6539\u8fdb\u3002"}, {"abstract": "LLM agents increasingly trade on the Web news they read, yet much Web news about listed firms is published after, and about, the price move it reports, so a reader can agree with the market by following it instead of reading the event. We ask whether LLM judgments of Web news track the market\u0027s reaction to the reported event or follow it. To answer, we built a multi-agent trading system whose agents share only point-in-time stores and answer typed questions through the interface of Jev, a hosted typed decision model; code sets every position under a proved bound on how far text can move it. In a hash-committed test of a Jev-compatible reader built from a pinned LLM\u0027s option probabilities, item judgments track announcement-window abnormal returns (weekly Spearman 0.119), also after the LLM\u0027s release, and event types agree with the issuers\u0027 8-K filings (AUC 0.833); Jev\u0027s judgments of news published after its own release track the reaction as well (descriptive). Exploratory analyses show where the association comes from: 72% of earnings news items appear after the issuer\u0027s filing, contributor-written items often report the price move, and from the first trade after publication the association falls to 0.023. At a weekly horizon, the confirmatory test detects no rank information over code-only features. Under attack, decision cards traced 88% of successful attacks to the planted item. We propose that market-graded tests of Web-text readers report the criterion from publication, not only from the event.", "arxiv_id": "2611.10414", "arxiv_url": "https://arxiv.org/abs/2611.10414", "authors": ["Yebo Feng", "Guangyan Gan", "Liangrui Pan", "Ruichao Liang", "Cong Wu", "Jiahua Xu", "Yang Liu"], "brief": "\u6784\u5efa\u517c\u5bb9Jev\u7684\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u7cfb\u7edf\uff0c\u4ee5\u65f6\u70b9\u5b58\u50a8\u548c\u7c7b\u578b\u5316\u95ee\u7b54\u9694\u79bb\u4fe1\u606f\uff0c\u5e76\u7528\u53ef\u8bc1\u660e\u8fb9\u754c\u9650\u5236\u6587\u672c\u5bf9\u4ed3\u4f4d\u7684\u5f71\u54cd\uff0c\u68c0\u9a8c\u65b0\u95fb\u5224\u65ad\u662f\u5728\u8bc6\u522b\u4e8b\u4ef6\u8fd8\u662f\u8ffd\u968f\u4ef7\u683c\u3002", "categories": ["cs.CL", "cs.AI", "cs.CR", "cs.IR", "q-fin.TR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10414", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u54c8\u5e0c\u627f\u8bfa\u6d4b\u8bd5\uff1a\u4e8b\u4ef6\u7a97\u6536\u76ca\u76f8\u51730.119\uff0c8-K\u5206\u7c7bAUC\u4e3a0.833", "72%\u8d22\u62a5\u65b0\u95fb\u665a\u4e8e\u62ab\u9732\uff0c\u53d1\u5e03\u540e\u9996\u7b14\u4ea4\u6613\u8d77\u76f8\u5173\u964d\u81f30.023", "\u5468\u9891\u672a\u68c0\u51fa\u8d85\u8d8a\u4ee3\u7801\u7279\u5f81\u7684\u6392\u5e8f\u4fe1\u606f\uff1b\u51b3\u7b56\u5361\u6eaf\u6e9088%\u6210\u529f\u653b\u51fb"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u91d1\u878d\u4ea4\u6613", "\u65b0\u95fb\u7406\u89e3", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10414v1", "published_at": "2026-11-07", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Track or Follow? A Jev-Compatible Multi-Agent Trading System When Web News Lags the Market", "tldr": "\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u5b9e\u9a8c\u63ed\u793a\uff1a\u65b0\u95fb\u5224\u65ad\u867d\u8d34\u5408\u4e8b\u4ef6\u884c\u60c5\uff0c\u5374\u51e0\u4e4e\u4e0d\u542b\u53d1\u5e03\u540e\u7684\u589e\u91cf\u4fe1\u53f7\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u517c\u5bb9Jev\u7684\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u7cfb\u7edf\uff0c\u4ee5\u65f6\u70b9\u5b58\u50a8\u548c\u7c7b\u578b\u5316\u95ee\u7b54\u9694\u79bb\u4fe1\u606f\uff0c\u5e76\u7528\u53ef\u8bc1\u660e\u8fb9\u754c\u9650\u5236\u6587\u672c\u5bf9\u4ed3\u4f4d\u7684\u5f71\u54cd\uff0c\u68c0\u9a8c\u65b0\u95fb\u5224\u65ad\u662f\u5728\u8bc6\u522b\u4e8b\u4ef6\u8fd8\u662f\u8ffd\u968f\u4ef7\u683c\u3002", "why_notable": "\u533a\u5206\u65b0\u95fb\u7406\u89e3\u4e0e\u8ffd\u968f\u884c\u60c5\uff0c\u63ed\u793a\u4e8b\u4ef6\u7a97\u8bc4\u6d4b\u53ef\u80fd\u9ad8\u4f30\u4ea4\u6613\u4ef7\u503c\uff1b\u4e3b\u5f20\u4ece\u65b0\u95fb\u53d1\u5e03\u65f6\u95f4\u8d77\u8861\u91cf\u4fe1\u53f7\uff0c\u66f4\u8d34\u8fd1\u53ef\u6267\u884c\u4ea4\u6613\u3002"}, {"abstract": "Multi-teacher on-policy distillation consolidates expert capabilities by supervising student-generated trajectories, whereas task arithmetic offers a training-free alternative through linear parameter combinations. We view the linear combination of student and expert parameters as a single differentiable model and propose P$^2$-MOPD, which jointly optimizes the mixing coefficients and the student weights under the same on-policy distillation objective. Unlike task arithmetic, which stays within the span of the frozen student and expert parameters for any choice of merging coefficients, P$^2$-MOPD keeps the student trainable, so the experts act as parameter priors without confining it to this span. Across four domains at 1.7B and 4B scales, P$^2$-MOPD achieves faster and more balanced recovery than MOPD from the same initialization, surpassing its final average recovery in half the training steps. At the end of training, our 1.7B model reaches 94.7% average recovery, versus 80.9% for MOPD.", "arxiv_id": "2611.03953", "arxiv_url": "https://arxiv.org/abs/2611.03953", "authors": ["Sinuo Wang", "Jiacheng Lu", "Zeyu Zhang", "Maojia Song", "Rui Sun", "Beidi Luan", "Yutong Xie", "Jing Li", "Daxin Jiang", "Qi Wu", "Zuo Bai"], "brief": "\u63d0\u51fa P\u00b2-MOPD\uff0c\u5c06\u5b66\u751f\u4e0e\u4e13\u5bb6\u53c2\u6570\u7684\u7ebf\u6027\u7ec4\u5408\u89c6\u4e3a\u53ef\u5fae\u6a21\u578b\uff0c\u5728\u540c\u7b56\u7565\u84b8\u998f\u76ee\u6807\u4e0b\u8054\u5408\u4f18\u5316\u6df7\u5408\u7cfb\u6570\u548c\u5b66\u751f\u6743\u91cd\uff0c\u8ba9\u4e13\u5bb6\u63d0\u4f9b\u53c2\u6570\u5148\u9a8c\u800c\u4e0d\u9650\u5236\u5b66\u751f\u7684\u53c2\u6570\u7a7a\u95f4\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/SinuoWang/P2-MOPD", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.03953", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8054\u5408\u4f18\u5316\u6df7\u5408\u7cfb\u6570\u4e0e\u5b66\u751f\u6743\u91cd\uff0c\u7a81\u7834\u51bb\u7ed3\u53c2\u6570\u5f20\u6210\u7a7a\u95f4", "\u56db\u4e2a\u9886\u57df\u30011.7B\u548c4B\u89c4\u6a21\uff0c\u534a\u6570\u6b65\u6570\u8d85\u8d8a\u57fa\u7ebf\u6700\u7ec8\u6062\u590d\u7387", "1.7B\u6a21\u578b\u5e73\u5747\u6062\u590d\u738794.7%\uff0cMOPD\u4e3a80.9%"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6a21\u578b\u5408\u5e76", "\u53c2\u6570\u5148\u9a8c"], "num_comments": 8, "on_hf": true, "organization": "StepFun", "pdf_url": "https://arxiv.org/pdf/2611.03953v2", "published_at": "2026-11-02", "score": 0.301, "selected_reasons": ["HF trending (45\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03953.png", "title": "P$^2$-MOPD: Accelerating Multi-Teacher On-Policy Distillation via Parameter Priors", "tldr": "\u5c06\u4e13\u5bb6\u53c2\u6570\u4f5c\u4e3a\u5148\u9a8c\u8054\u5408\u4f18\u5316\uff0c\u4ee5\u4e00\u534a\u8bad\u7ec3\u6b65\u6570\u8d85\u8d8a\u591a\u6559\u5e08\u84b8\u998f\u57fa\u7ebf", "upvotes": 45, "what_it_is": "\u63d0\u51fa P\u00b2-MOPD\uff0c\u5c06\u5b66\u751f\u4e0e\u4e13\u5bb6\u53c2\u6570\u7684\u7ebf\u6027\u7ec4\u5408\u89c6\u4e3a\u53ef\u5fae\u6a21\u578b\uff0c\u5728\u540c\u7b56\u7565\u84b8\u998f\u76ee\u6807\u4e0b\u8054\u5408\u4f18\u5316\u6df7\u5408\u7cfb\u6570\u548c\u5b66\u751f\u6743\u91cd\uff0c\u8ba9\u4e13\u5bb6\u63d0\u4f9b\u53c2\u6570\u5148\u9a8c\u800c\u4e0d\u9650\u5236\u5b66\u751f\u7684\u53c2\u6570\u7a7a\u95f4\u3002", "why_notable": "\u628a\u514d\u8bad\u7ec3\u53c2\u6570\u5408\u5e76\u4e0e\u540c\u7b56\u7565\u84b8\u998f\u7ed3\u5408\uff0c\u5728\u76f8\u540c\u521d\u59cb\u5316\u4e0b\u52a0\u5feb\u591a\u4e13\u5bb6\u80fd\u529b\u6062\u590d\uff0c\u5e76\u63d0\u5347\u6062\u590d\u7684\u5747\u8861\u6027\uff0c\u4e3a\u964d\u4f4e\u84b8\u998f\u8bad\u7ec3\u6210\u672c\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Agent harness evolution enables recursive self-improvement (RSI) without updating model weights. We examine whether higher benchmark scores yield reliable, efficient, and transferable improvement. We evaluate four methods across harnesses, general and coding tasks. Repeated evaluations, controlled agent expansion, component interventions, and admission replays reveal recurring patterns. All sixteen evolved agents gain previously uncovered tasks while losing previously covered ones. In one general-task case, reliability rises by 5.2 points despite losing ten previously covered tasks. Most reliability gains also increase deployment cost. Specific changes usually outperform generic reminders, but their benefits can change when combined. The highest-scoring agent does not yield the largest mean improvement in any of our four pools, and stricter admission can discard useful alternatives. Transfer selectively preserves gains: coverage usually falls on the general-task target across both harness types and paradigms, but rises on the coding target with the outer-layer-only harness. These findings motivate preservation-aware evaluation, tested decision rules, and explicit applicability conditions. As a constructive follow-up, EvoAudit turns these diagnostics into revisions of select, analyze, mutate, and gate, achieving the best performance.", "arxiv_id": "2611.07624", "arxiv_url": "https://arxiv.org/abs/2611.07624", "authors": ["Xiaobo Wang", "Zimu Wang", "Siyu Ye", "Jiaqi Li", "Min Tang", "Jun Bai", "Yuling Shi", "Ruobing Wang", "Jingjing Zhang", "Chaofan Wang", "Kai Wu", "Mengnan Qi", "Kai Cai", "Xiaodong Gu", "Qi Liu", "Zilong Zheng"], "brief": "\u7814\u7a76\u8bc4\u4f30\u4e0d\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u7684\u667a\u80fd\u4f53\u6846\u67b6\u6f14\u5316\uff0c\u7528\u91cd\u590d\u8bc4\u6d4b\u3001\u7ec4\u4ef6\u5e72\u9884\u4e0e\u51c6\u5165\u56de\u653e\u68c0\u9a8c\u6539\u8fdb\u8d28\u91cf\uff0c\u5e76\u636e\u6b64\u6784\u5efa\u5ba1\u8ba1\u9a71\u52a8\u7684\u6f14\u5316\u65b9\u6cd5EvoAudit\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.07624", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u56db\u79cd\u65b9\u6cd5\u4ea7\u751f\u768416\u4e2a\u6f14\u5316\u667a\u80fd\u4f53\u5747\u6709\u4efb\u52a1\u8986\u76d6\u5f97\u5931", "\u4e00\u4f8b\u53ef\u9760\u6027\u53475.2\u70b9\uff0c\u5374\u4e22\u593110\u4e2a\u5df2\u8986\u76d6\u4efb\u52a1", "EvoAudit\u4fee\u8ba2\u9009\u62e9\u3001\u5206\u6790\u3001\u53d8\u5f02\u4e0e\u51c6\u5165\uff0c\u53d6\u5f97\u6700\u4f73\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53\u6f14\u5316", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u53ef\u9760\u6027\u8bc4\u4f30", "\u80fd\u529b\u8fc1\u79fb"], "num_comments": 3, "on_hf": true, "organization": "University of Science and Technology of China", "pdf_url": "https://arxiv.org/pdf/2611.07624v1", "published_at": "2026-11-05", "score": 0.292, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07624.png", "title": "Beneath the Surface: What We Overlook When We Talk About Agent Evolution", "tldr": "\u667a\u80fd\u4f53\u6846\u67b6\u6f14\u5316\u867d\u80fd\u63d0\u5347\u5206\u6570\uff0c\u5374\u4f34\u968f\u80fd\u529b\u9057\u5931\u3001\u6210\u672c\u4e0a\u6da8\u548c\u8fc1\u79fb\u4e0d\u7a33", "upvotes": 23, "what_it_is": "\u7814\u7a76\u8bc4\u4f30\u4e0d\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u7684\u667a\u80fd\u4f53\u6846\u67b6\u6f14\u5316\uff0c\u7528\u91cd\u590d\u8bc4\u6d4b\u3001\u7ec4\u4ef6\u5e72\u9884\u4e0e\u51c6\u5165\u56de\u653e\u68c0\u9a8c\u6539\u8fdb\u8d28\u91cf\uff0c\u5e76\u636e\u6b64\u6784\u5efa\u5ba1\u8ba1\u9a71\u52a8\u7684\u6f14\u5316\u65b9\u6cd5EvoAudit\u3002", "why_notable": "\u63ed\u793a\u699c\u5355\u6da8\u5206\u4e0d\u7b49\u4e8e\u53ef\u9760\u4e14\u53ef\u8fc1\u79fb\u7684\u81ea\u6211\u6539\u8fdb\uff0c\u63a8\u52a8\u8bc4\u4f30\u540c\u65f6\u5173\u6ce8\u65e7\u80fd\u529b\u4fdd\u7559\u3001\u90e8\u7f72\u6210\u672c\u4e0e\u9002\u7528\u6761\u4ef6\u3002"}, {"abstract": "Relative-position attention mechanisms offer compelling alternatives to RoPE across various transformer architectures, delivering superior performance in domains such as audio. These mechanisms typically modify attention scores by adding content-position or bias-position terms. Unlike RoPE, which encodes position via per-token rotations directly on the queries and keys, relative-position terms generally require pairwise offset-dependent computation or lookups, complicating their integration into fused attention kernels and introducing severe memory, bandwidth, and compute overheads as sequences scale. To address this bottleneck, we propose an exact attention algorithm that incorporates additive relative-position terms into FlashAttention-style tiled computation. Our method (1) uses offset-aware tiling to avoid redundant indexing and memory accesses, (2) computes only the necessary key/query-relation products and reuses them across token pairs in both forward and backward passes, and (3) uses offset-based gradient sharding and aggregation, eliminating atomic contention. We provide a unified, efficient Triton implementation across diverse relative-position attention mechanisms and evaluate it against naive and specialized implementations. For 8K-token sequences, our method speeds up the forward (backward) pass by 1.8-6.4$\\times$ (2.0-21$\\times$) and reduces peak memory up to 2.9-128$\\times$ (1.4-54$\\times$) over the strongest baseline for each mechanism, enabling long-context end-to-end transcription that is 1.8$\\times$ faster and uses 2.4$\\times$ less memory. Our method thus provides a drop-in, hardware-efficient solution for scaling relative-position attention transformers.", "arxiv_id": "2611.01182", "arxiv_url": "https://arxiv.org/abs/2611.01182", "authors": ["Delyan Boychev", "Ivo Petrov", "Dimitar I. Dimitrov"], "brief": "\u5c06\u52a0\u6027\u76f8\u5bf9\u4f4d\u7f6e\u9879\u878d\u5165 FlashAttention \u5f0f\u5206\u5757\u8ba1\u7b97\uff0c\u4fdd\u6301\u6ce8\u610f\u529b\u7cbe\u786e\u6027\u3002\u4ee5\u504f\u79fb\u611f\u77e5\u5206\u5757\u3001\u5173\u7cfb\u4e58\u79ef\u590d\u7528\u548c\u68af\u5ea6\u5206\u7247\u805a\u5408\uff0c\u6784\u5efa\u7edf\u4e00\u7684 Triton \u5b9e\u73b0\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01182", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u504f\u79fb\u611f\u77e5\u5206\u5757\u51cf\u5c11\u7d22\u5f15\u8bbf\u5b58\uff0c\u524d\u540e\u5411\u590d\u7528\u5173\u7cfb\u4e58\u79ef", "\u6309\u504f\u79fb\u5206\u7247\u805a\u5408\u68af\u5ea6\uff0c\u6d88\u9664\u539f\u5b50\u64cd\u4f5c\u7ade\u4e89", "8K\u5e8f\u5217\u524d\u5411\u52a0\u901f1.8\u20136.4\u500d\uff0c\u53cd\u54112\u201321\u500d"], "keywords": ["\u76f8\u5bf9\u4f4d\u7f6e\u6ce8\u610f\u529b", "\u9ad8\u6548\u8ba1\u7b97", "\u957f\u4e0a\u4e0b\u6587", "\u8bed\u97f3\u8f6c\u5f55"], "num_comments": 2, "on_hf": true, "organization": "Institute for Computer Science, Artificial intelligence and Technology ", "pdf_url": "https://arxiv.org/pdf/2611.01182v1", "published_at": "2026-10-31", "score": 0.285, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01182.png", "title": "Fast and Exact Relative-Position Attention via Structure-Aware Kernels", "tldr": "\u901a\u8fc7\u7ed3\u6784\u611f\u77e5\u5206\u5757\u4e0e\u8ba1\u7b97\u590d\u7528\uff0c\u7cbe\u786e\u52a0\u901f\u76f8\u5bf9\u4f4d\u7f6e\u6ce8\u610f\u529b\u5e76\u964d\u4f4e\u957f\u5e8f\u5217\u663e\u5b58\u5f00\u9500\u3002", "upvotes": 19, "what_it_is": "\u5c06\u52a0\u6027\u76f8\u5bf9\u4f4d\u7f6e\u9879\u878d\u5165 FlashAttention \u5f0f\u5206\u5757\u8ba1\u7b97\uff0c\u4fdd\u6301\u6ce8\u610f\u529b\u7cbe\u786e\u6027\u3002\u4ee5\u504f\u79fb\u611f\u77e5\u5206\u5757\u3001\u5173\u7cfb\u4e58\u79ef\u590d\u7528\u548c\u68af\u5ea6\u5206\u7247\u805a\u5408\uff0c\u6784\u5efa\u7edf\u4e00\u7684 Triton \u5b9e\u73b0\u3002", "why_notable": "\u8ba9\u591a\u79cd\u76f8\u5bf9\u4f4d\u7f6e\u6ce8\u610f\u529b\u83b7\u5f97\u53ef\u76f4\u63a5\u66ff\u6362\u7684\u9ad8\u6548\u5b9e\u73b0\uff1b\u957f\u4e0a\u4e0b\u6587\u7aef\u5230\u7aef\u8f6c\u5f55\u52a0\u901f1.8\u500d\uff0c\u663e\u5b58\u964d\u81f3\u7ea6\u56db\u6210\u3002"}, {"abstract": "Autoregressive decoding relies on the KV cache, whose memory footprint grows linearly with context length and caps batch size and throughput. Existing post-training methods exploit redundancy across tokens, layers, and feature dimensions, or lower numerical precision. We identify a complementary axis: within each attention head, values are largely predictable from their corresponding keys. We exploit this with value cache amortisation, which fits a lightweight per-head predictor at test time and stores residuals only for the tokens it reconstructs worst, giving $4\\times$ near-lossless value compression. The predictor can be initialised by meta-learning for substantially reduced prefill overhead, or fitted from scratch in settings that allow a one-off cost, such as multi-query inference. We pair value amortisation with cross-layer low-rank key compression to produce LowRAM, an asymmetric compression pipeline that stays close to lossless across three model families. By reconstructing only a selected subset of KV pairs at each decoding step, LowRAM can keep decoding overhead minimal and achieve up to $5\\times$ higher peak decode throughput at $4\\times$ compression. LowRAM further composes with quantisation and eviction, reaching $26.9\\times$ compression at $94.5\\%$ of baseline performance on long contexts. These results show that treating keys and values as structurally distinct enables efficient, aggressive, and composable KV cache compression.", "arxiv_id": "2611.07025", "arxiv_url": "https://arxiv.org/abs/2611.07025", "authors": ["Teresa Delgado", "Hugo Hazard", "Martin Benfeghoul", "Jun Wang", "Zafeirios Fountas"], "brief": "LowRAM\u5728\u6d4b\u8bd5\u65f6\u4e3a\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u62df\u5408\u952e\u5230\u503c\u7684\u8f7b\u91cf\u9884\u6d4b\u5668\uff0c\u4ec5\u4fdd\u5b58\u96be\u91cd\u5efa\u8bcd\u5143\u7684\u6b8b\u5dee\uff0c\u518d\u7ed3\u5408\u8de8\u5c42\u4f4e\u79e9\u952e\u538b\u7f29\uff0c\u6784\u6210\u975e\u5bf9\u79f0\u7f13\u5b58\u538b\u7f29\u6d41\u7a0b\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/lowram-model/lowram", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.07025", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u503c\u7f13\u5b58\u644a\u9500\u5b9e\u73b04\u500d\u8fd1\u65e0\u635f\u538b\u7f29\uff0c\u5143\u5b66\u4e60\u964d\u4f4e\u9884\u586b\u5145\u5f00\u9500", "\u9009\u62e9\u6027\u91cd\u5efaKV\u5bf9\uff0c4\u500d\u538b\u7f29\u4e0b\u5cf0\u503c\u89e3\u7801\u541e\u5410\u6700\u9ad8\u63d0\u53475\u500d", "\u53e0\u52a0\u91cf\u5316\u4e0e\u6dd8\u6c70\u8fbe26.9\u500d\u538b\u7f29\uff0c\u4fdd\u755994.5%\u57fa\u7ebf\u6027\u80fd"], "keywords": ["\u7f13\u5b58\u538b\u7f29", "\u957f\u4e0a\u4e0b\u6587", "\u4f4e\u79e9\u8fd1\u4f3c", "\u63a8\u7406\u52a0\u901f"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.07025v1", "published_at": "2026-11-04", "score": 0.277, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07025.png", "title": "LowRAM: Low-Rank Keys and Amortised Values for Composable KV Cache Compression at Test-Time", "tldr": "\u5229\u7528\u952e\u9884\u6d4b\u503c\u5e76\u7ed3\u5408\u4f4e\u79e9\u538b\u7f29\uff0c\u5927\u5e45\u7f29\u51cf\u7f13\u5b58\u4e14\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\u541e\u5410\u3002", "upvotes": 10, "what_it_is": "LowRAM\u5728\u6d4b\u8bd5\u65f6\u4e3a\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u62df\u5408\u952e\u5230\u503c\u7684\u8f7b\u91cf\u9884\u6d4b\u5668\uff0c\u4ec5\u4fdd\u5b58\u96be\u91cd\u5efa\u8bcd\u5143\u7684\u6b8b\u5dee\uff0c\u518d\u7ed3\u5408\u8de8\u5c42\u4f4e\u79e9\u952e\u538b\u7f29\uff0c\u6784\u6210\u975e\u5bf9\u79f0\u7f13\u5b58\u538b\u7f29\u6d41\u7a0b\u3002", "why_notable": "\u63ed\u793a\u952e\u548c\u503c\u4e4b\u95f4\u53ef\u5229\u7528\u7684\u9884\u6d4b\u5173\u7cfb\uff0c\u4e3a\u7f13\u5b58\u538b\u7f29\u589e\u52a0\u4e92\u8865\u7ef4\u5ea6\uff1b\u5728\u4e09\u7c7b\u6a21\u578b\u4e0a\u63a5\u8fd1\u65e0\u635f\uff0c\u5e76\u53ef\u4e0e\u65e2\u6709\u538b\u7f29\u65b9\u6cd5\u7ec4\u5408\u3002"}, {"abstract": "How can an agent handle a real-world task end to end? Frontier models with their own harnesses still fall short on real-world benchmarks: on Terminal-Bench 4.0, GPT-5.6 Sol with Codex resolves 37.3% of the tasks and Claude Opus 5 with Claude Code 51.8%. These tasks fail at the step from reaching a resource to applying it, which we call the last mile to the real world. Existing approaches put the resource within reach but leave the competence to apply it with the caller, so each harness rebuilds that competence. We introduce agent-native primitives, reusable units that equip a resource with a resident LLM that applies it in context and communicates with other primitives, and HEELO (Harness Engineering around Evolving Agent-Native Primitives for the Last Mile to Real-WOrld Tasks), a harness engineering framework that builds each task\u0027s harness from a library of such primitives. HEELO composes the primitives a task needs into a task-specific graph, verifies the result against evidence from the environment, revises the primitives a failure implicates, and admits new or improved primitives after validation. We instantiate HEELO with eight primitive families, each built for one kind of task, and evaluate them on more than twenty benchmarks. Dev-Primitives raise Terminal-Bench 4.0 resolution from 37.3% under Codex to 55.5% on the same backbone, Harness Primitives composed per task raise Terminal-Bench 2.0 Pass@1 from 60.0% for the seed harness to 72.2%, Tool Primitives raise ToolBench pass rate from 55.8% to 75.1%, and Navigation Primitives raise GAIA-Text-103 accuracy from 45.6% to 58.3%. On the 46 real-world tasks of our heelo.dev platform, Claude Opus 5.5 with Claude Code and GPT-6.1 Sol with Codex complete 9 each on their own and 39 and 35 when connected to HEELO through our MCP server, with 1.9$\\times$ and 2.3$\\times$ less time and 1.55$\\times$ lower cost per completed task.", "arxiv_id": "2611.07461", "arxiv_url": "https://arxiv.org/abs/2611.07461", "authors": ["Haibo Jin", "Peng Kuang", "Xiaopeng Yuan", "Lucheng Fu", "Jerry Wang", "Xucheng Yu", "Yaoning Yu", "Dehao Wu", "Runguo Li", "Colin Su", "Jingxuan Sun", "Xuyang Liu", "Haojing Luo", "Haohan Wang"], "brief": "\u63d0\u51fa\u5e26\u9a7b\u7559\u5927\u6a21\u578b\u7684\u53ef\u590d\u7528\u539f\u8bed\uff0c\u8ba9\u8d44\u6e90\u5177\u5907\u7ed3\u5408\u4e0a\u4e0b\u6587\u6267\u884c\u7684\u80fd\u529b\u3002HEELO\u5c06\u539f\u8bed\u7ec4\u6210\u4efb\u52a1\u56fe\uff0c\u4f9d\u636e\u73af\u5883\u8bc1\u636e\u9a8c\u8bc1\u7ed3\u679c\uff0c\u5e76\u4fee\u8ba2\u3001\u9a8c\u8bc1\u548c\u79ef\u7d2f\u539f\u8bed\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.MA", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.07461", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["HEELO\u5b9e\u73b08\u7c7b\u539f\u8bed\uff0c\u572820\u591a\u4e2a\u57fa\u51c6\u4e0a\u8bc4\u4f30", "\u540c\u9aa8\u5e72\u4e0bTerminal-Bench 4.0\u5b8c\u6210\u738737.3%\u219255.5%", "46\u9879\u771f\u5b9e\u4efb\u52a1\u4e2d\uff0c\u63a5\u5165HEELO\u540e\u5b8c\u6210\u6570\u4ece\u54049\u9879\u589e\u81f339\u548c35\u9879"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u6846\u67b6\u5de5\u7a0b", "\u591a\u667a\u80fd\u4f53\u534f\u4f5c"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.07461v1", "published_at": "2026-11-05", "score": 0.245, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07461.png", "title": "The Last Mile to the Real World: Agent-Native Primitives as Reusable Building Blocks for Solving Real-World Tasks", "tldr": "\u8ba9\u8d44\u6e90\u81ea\u5e26\u6267\u884c\u667a\u80fd\uff0c\u5e76\u6309\u4efb\u52a1\u7ec4\u5408\u590d\u7528\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u771f\u5b9e\u4efb\u52a1\u5b8c\u6210\u7387\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u5e26\u9a7b\u7559\u5927\u6a21\u578b\u7684\u53ef\u590d\u7528\u539f\u8bed\uff0c\u8ba9\u8d44\u6e90\u5177\u5907\u7ed3\u5408\u4e0a\u4e0b\u6587\u6267\u884c\u7684\u80fd\u529b\u3002HEELO\u5c06\u539f\u8bed\u7ec4\u6210\u4efb\u52a1\u56fe\uff0c\u4f9d\u636e\u73af\u5883\u8bc1\u636e\u9a8c\u8bc1\u7ed3\u679c\uff0c\u5e76\u4fee\u8ba2\u3001\u9a8c\u8bc1\u548c\u79ef\u7d2f\u539f\u8bed\u3002", "why_notable": "\u5c06\u8d44\u6e90\u4f7f\u7528\u80fd\u529b\u4ece\u8c03\u7528\u65b9\u79fb\u5165\u53ef\u590d\u7528\u7ec4\u4ef6\uff0c\u51cf\u5c11\u6846\u67b6\u91cd\u590d\u5efa\u8bbe\uff1b\u591a\u7c7b\u57fa\u51c6\u53ca\u771f\u5b9e\u4efb\u52a1\u7684\u63d0\u5347\u663e\u793a\uff0c\u8fd9\u4e00\u8def\u5f84\u6709\u671b\u517c\u987e\u6210\u529f\u7387\u4e0e\u6267\u884c\u6548\u7387\u3002"}, {"abstract": "Coding agents combine visual understanding with program execution, offering a new route to automated 3D creation. By translating images and instructions into editable programs, they bring reconstruction, generation, and editing into a shared workflow. Yet existing benchmarks fragment evaluation across task scopes and protocols, leaving their capabilities across construction levels unclear. We propose Frontier3DBench, a unified benchmark of 145 tasks across 9 categories spanning object, scene, and interactive open-world creation, with joint evaluation of appearance, structure, and behavior. Experiments with 11 model-harness configurations reveal strengths that vary by level: GPT-6.1-sol leads the object and scene levels and achieves the highest overall score of 66.02/100, whereas GPT-6-astra leads interactive world construction. However, all configurations score lower on reference reconstruction than on text-driven generation in object and scene tasks. Producing plausible content thus remains easier than reproducing specified geometry, layouts, and visual details. Moreover, generated worlds average 83.08/100 on local mechanisms but only 20.82 on motion clearance and 30.26 on stateful workflows: individual mechanisms often function, whereas complete activities that require coordinated actions and persistent state remain difficult. These results identify reference fidelity and coordinated activity completion as central bottlenecks for coding agents in 3D creation.", "arxiv_id": "2611.09017", "arxiv_url": "https://arxiv.org/abs/2611.09017", "authors": ["Xinjie Lin", "Qingle Liu", "Wenyi Li", "John Lam", "Xiaoqiu Wang", "Deyao Hong", "Mingju Gao", "Zheng Jiang", "Yizhe Chi", "Youjie Zheng", "Calvin Xiao", "Kaisen Yang", "Huan-ang Gao"], "brief": "\u6784\u5efa\u8986\u76d6\u7269\u4f53\u3001\u573a\u666f\u548c\u4ea4\u4e92\u5f00\u653e\u4e16\u754c\u7684\u4e09\u7ef4\u521b\u4f5c\u57fa\u51c6\uff0c\u8054\u5408\u8bc4\u4f30\u5916\u89c2\u3001\u7ed3\u6784\u4e0e\u884c\u4e3a\uff0c\u5e76\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u4e0e\u6267\u884c\u6846\u67b6\u7ec4\u5408\u7684\u80fd\u529b\u5dee\u5f02\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09017", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b145\u9879\u4efb\u52a1\u30019\u4e2a\u7c7b\u522b\uff0c\u6d4b\u8bd511\u79cd\u6a21\u578b\u4e0e\u6846\u67b6\u7ec4\u5408\u3002", "GPT-6.1-sol\u603b\u5206\u6700\u9ad8\uff0c\u4e3a66.02/100\u3002", "\u5c40\u90e8\u673a\u5236\u5f97\u520683.08\uff0c\u72b6\u6001\u5316\u5de5\u4f5c\u6d41\u4ec530.26\u3002"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u4e09\u7ef4\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u4ea4\u4e92\u4e16\u754c"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09017v1", "published_at": "2026-11-06", "score": 0.245, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09017.png", "title": "Frontier3DBench: Benchmarking Coding Agents for 3D Creation across Objects, Scenes, and Interactive Open Worlds", "tldr": "\u7edf\u4e00\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\u7684\u4e09\u7ef4\u521b\u4f5c\u80fd\u529b\uff0c\u63ed\u793a\u53c2\u8003\u8fd8\u539f\u4e0e\u534f\u540c\u884c\u4e3a\u7684\u74f6\u9888\u3002", "upvotes": 10, "what_it_is": "\u6784\u5efa\u8986\u76d6\u7269\u4f53\u3001\u573a\u666f\u548c\u4ea4\u4e92\u5f00\u653e\u4e16\u754c\u7684\u4e09\u7ef4\u521b\u4f5c\u57fa\u51c6\uff0c\u8054\u5408\u8bc4\u4f30\u5916\u89c2\u3001\u7ed3\u6784\u4e0e\u884c\u4e3a\uff0c\u5e76\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u4e0e\u6267\u884c\u6846\u67b6\u7ec4\u5408\u7684\u80fd\u529b\u5dee\u5f02\u3002", "why_notable": "\u5c06\u9759\u6001\u9020\u578b\u4e0e\u53ef\u4ea4\u4e92\u4e16\u754c\u7eb3\u5165\u7edf\u4e00\u8bc4\u6d4b\uff0c\u6307\u51fa\u751f\u6210\u770b\u4f3c\u5408\u7406\u7684\u5185\u5bb9\u4e0d\u7b49\u4e8e\u5fe0\u5b9e\u8fd8\u539f\uff0c\u4e5f\u4e0d\u7b49\u4e8e\u5b8c\u6210\u4f9d\u8d56\u6301\u7eed\u72b6\u6001\u7684\u534f\u540c\u6d3b\u52a8\u3002"}, {"abstract": "Protein motif scaffolding benchmarks assess whether generative models can build scaffolds around functionally important residues. Their conclusions depend on which motifs are tested and which criteria define success. Existing benchmarks typically use small hand-curated motif sets and static refolding criteria, but protein function often depends on conformational ensembles and transitions. Here, we address both benchmark scope and success criteria. We introduce BILBY-PRO, a systematically derived benchmark of structurally conserved functional motifs from PROSITE-linked experimental structures, comprising 220 cases from 174 PROSITE motif-pattern entries. Evaluating six recent scaffold-generation models reveals distinct patterns in target coverage and unique-solution yield: RFDiffusion and Proteina solve more targets, whereas ESM3 produces more unique successful scaffolds on the targets it solves. We further introduce BILBY-MD, a reference-based all-atom molecular dynamics evaluation framework. Applied to statically solved designs from the original MotifBench benchmark, it compares motif drift, scaffold drift, motif-contact preserv
