ation, and motif-dihedral free-energy landscapes against reference simulations. Of 55 statically solved model-problem pairs, 31 satisfy our MD-supported criterion and only 8 pass all checks. Compact, self-contained motifs are often MD-supported, whereas interface-like or context-dependent motifs fail more frequently. Static refolding success therefore provides useful evidence of local motif recovery but does not establish dynamical fidelity of the full scaffold. BILBY highlights three complementary axes of motif-scaffolding evaluation: target coverage, unique-solution yield, and MD-supported dynamical fidelity.", "arxiv_id": "2611.07723", "arxiv_url": "https://arxiv.org/abs/2611.07723", "authors": ["Emile de Bruyn", "Moritz Sch\u00e4ffler", "Jannik Schneider", "Sebastian R. Schmidt", "Chanwoong Hwang", "Aleena Siji", "Utkarsh Upadhyay", "Stefan Bauer", "Alexander Schug", "Stefan Kesselheim", "Artur Yakimovich", "Alina Bazarova"], "brief": "\u63d0\u51fa\u7cfb\u7edf\u6784\u5efa\u7684\u529f\u80fd\u57fa\u5e8f\u652f\u67b6\u8bbe\u8ba1\u57fa\u51c6BILBY-PRO\uff0c\u5e76\u7528BILBY-MD\u5168\u539f\u5b50\u5206\u5b50\u52a8\u529b\u5b66\u6846\u67b6\uff0c\u5bf9\u7167\u53c2\u8003\u6a21\u62df\u68c0\u9a8c\u8bbe\u8ba1\u7684\u52a8\u6001\u4fdd\u771f\u5ea6\u3002", "categories": ["cs.LG", "q-bio.BM"], "github_repo": "https://github.com/PROFOUND-HFMI/BILBY-MD", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.07723", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["BILBY-PRO\u8986\u76d6174\u4e2aPROSITE\u6761\u76ee\u7684220\u4f8b", "\u516d\u6a21\u578b\u5bf9\u6bd4\uff1aESM3\u5728\u5df2\u89e3\u51b3\u76ee\u6807\u4e0a\u4ea7\u51fa\u66f4\u591a\u72ec\u7279\u652f\u67b6", "BILBY-MD\u8bc4\u4f3055\u7ec4\u9759\u6001\u6210\u529f\u8bbe\u8ba1\uff0c\u4ec58\u7ec4\u901a\u8fc7\u5168\u90e8\u68c0\u67e5"], "keywords": ["\u86cb\u767d\u8d28\u8bbe\u8ba1", "\u751f\u6210\u6a21\u578b", "\u5206\u5b50\u52a8\u529b\u5b66", "\u57fa\u51c6\u8bc4\u4f30"], "num_comments": 3, "on_hf": true, "organization": "PROFOUND", "pdf_url": "https://arxiv.org/pdf/2611.07723v1", "published_at": "2026-11-05", "score": 0.244, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07723.png", "title": "Static Recovery Is Not Dynamic Stability: Dynamics-Aware Benchmarking of Protein Motif Scaffolding", "tldr": "\u86cb\u767d\u8d28\u652f\u67b6\u8bbe\u8ba1\u7684\u9759\u6001\u6210\u529f\u4e0d\u7b49\u4e8e\u52a8\u6001\u7a33\u5b9a\uff0c\u65b0\u57fa\u51c6\u63ed\u793a\u4e24\u8005\u5dee\u8ddd\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u7cfb\u7edf\u6784\u5efa\u7684\u529f\u80fd\u57fa\u5e8f\u652f\u67b6\u8bbe\u8ba1\u57fa\u51c6BILBY-PRO\uff0c\u5e76\u7528BILBY-MD\u5168\u539f\u5b50\u5206\u5b50\u52a8\u529b\u5b66\u6846\u67b6\uff0c\u5bf9\u7167\u53c2\u8003\u6a21\u62df\u68c0\u9a8c\u8bbe\u8ba1\u7684\u52a8\u6001\u4fdd\u771f\u5ea6\u3002", "why_notable": "\u5c06\u8bc4\u4f30\u4ece\u9759\u6001\u7ed3\u6784\u6062\u590d\u6269\u5c55\u5230\u52a8\u6001\u4fdd\u771f\u5ea6\uff0c\u5e76\u533a\u5206\u76ee\u6807\u8986\u76d6\u4e0e\u72ec\u7279\u89e3\u4ea7\u91cf\uff0c\u4e3a\u7b5b\u9009\u66f4\u53ef\u9760\u7684\u86cb\u767d\u8d28\u8bbe\u8ba1\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Most robot policies, whether trained by imitation learning (IL) or reinforcement learning (RL), map observations to action values at discrete control steps and leave the continuity of physical motion to be learned implicitly. We propose ODE policy, which learns the dynamics of the action rather than the action itself. A neural ordinary differential equation (ODE) learns the vector field of the action by matching the integrated actions to the targets over short action chunks in IL and single control steps in RL. A lightweight diversity head captures multi-modal behavior by randomizing the direction of the field. At deployment, each action is integrated from the previous one, so the executed trajectory is continuous by construction. We evaluate it as a visuomotor policy, as the action head of vision-language-action (VLA) and world action models (WAMs), and as the actor of model-based RL against 14 baselines on unimanual, bimanual, dexterous, locomotion, and loco-manipulation tasks. In IL, against flow matching, it reaches 5.9$\\times$ the success, 5.4$\\times$ the generalization, and 3.9$\\times$ the mode balance after one epoch, and generates actions 10.8$\\times$ faster. It mostly moves more smoothly than human demonstrations. On 14 real-world tasks across single-arm, dual-arm, dexterous, and humanoid robots, it achieves the highest success rate. In RL, it further speeds up SuperMimic for humanoid motion tracking and smooths its actions. Efficient in learning, data, parameters, and execution, ODE policy offers a promising path to scaling robot learning.", "arxiv_id": "2611.01729", "arxiv_url": "https://arxiv.org/abs/2611.01729", "authors": ["Jindou Jia", "Jingliang Li", "Kuangji Zuo", "Tuo An", "Yuxuan Hu", "Mengfei Zhao", "Bofan Lyu", "Jiaqi Bai", "Daoyuan Zhu", "Hengyu Dai", "Junpeng Zhang", "Jianfei Yang"], "brief": "\u7528\u795e\u7ecf\u5e38\u5fae\u5206\u65b9\u7a0b\u5b66\u4e60\u52a8\u4f5c\u5411\u91cf\u573a\uff0c\u4ee5\u79ef\u5206\u540e\u7684\u52a8\u4f5c\u5339\u914d\u8bad\u7ec3\u76ee\u6807\uff0c\u5e76\u7528\u8f7b\u91cf\u591a\u6837\u6027\u5934\u5efa\u6a21\u591a\u6a21\u6001\u884c\u4e3a\u3002\u90e8\u7f72\u65f6\u4ece\u4e0a\u4e00\u52a8\u4f5c\u79ef\u5206\u5f97\u5230\u4e0b\u4e00\u52a8\u4f5c\uff0c\u4fdd\u8bc1\u8f68\u8ff9\u8fde\u7eed\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/NTUMARS/ODE-POLICY", "github_stars": 75, "hf_url": "https://huggingface.co/papers/2611.01729", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u795e\u7ecfODE\u5728\u6a21\u4eff\u5b66\u4e60\u4e2d\u5339\u914d\u52a8\u4f5c\u7247\u6bb5\uff0c\u5728\u5f3a\u5316\u5b66\u4e60\u4e2d\u5339\u914d\u5355\u6b65\u52a8\u4f5c", "\u8bad\u7ec3\u4e00\u8f6e\u540e\uff0c\u8f83\u6d41\u5339\u914d\u6210\u529f\u7387\u8fbe5.9\u500d\uff0c\u52a8\u4f5c\u751f\u6210\u5feb10.8\u500d", "\u5bf9\u6bd414\u4e2a\u57fa\u7ebf\uff0c\u572814\u9879\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u53d6\u5f97\u6700\u9ad8\u6210\u529f\u7387"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u795e\u7ecf\u5e38\u5fae\u5206\u65b9\u7a0b", "\u6a21\u4eff\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "MARS Lab", "pdf_url": "https://arxiv.org/pdf/2611.01729v1", "published_at": "2026-11-01", "score": 0.242, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01729.png", "title": "ODE Policy: Robot Learning via Action Dynamics, Not Actions", "tldr": "\u901a\u8fc7\u5b66\u4e60\u52a8\u4f5c\u53d8\u5316\u7684\u5411\u91cf\u573a\u800c\u975e\u76f4\u63a5\u9884\u6d4b\u52a8\u4f5c\uff0c\u5b9e\u73b0\u8fde\u7eed\u3001\u5e73\u6ed1\u4e14\u9ad8\u6548\u7684\u673a\u5668\u4eba\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": "\u7528\u795e\u7ecf\u5e38\u5fae\u5206\u65b9\u7a0b\u5b66\u4e60\u52a8\u4f5c\u5411\u91cf\u573a\uff0c\u4ee5\u79ef\u5206\u540e\u7684\u52a8\u4f5c\u5339\u914d\u8bad\u7ec3\u76ee\u6807\uff0c\u5e76\u7528\u8f7b\u91cf\u591a\u6837\u6027\u5934\u5efa\u6a21\u591a\u6a21\u6001\u884c\u4e3a\u3002\u90e8\u7f72\u65f6\u4ece\u4e0a\u4e00\u52a8\u4f5c\u79ef\u5206\u5f97\u5230\u4e0b\u4e00\u52a8\u4f5c\uff0c\u4fdd\u8bc1\u8f68\u8ff9\u8fde\u7eed\u3002", "why_notable": "\u5c06\u52a8\u4f5c\u8fde\u7eed\u6027\u76f4\u63a5\u5d4c\u5165\u7b56\u7565\u7ed3\u6784\uff0c\u800c\u975e\u4f9d\u8d56\u9690\u5f0f\u5b66\u4e60\uff1b\u540c\u4e00\u65b9\u6cd5\u8986\u76d6\u6a21\u4eff\u5b66\u4e60\u3001\u5f3a\u5316\u5b66\u4e60\u53ca\u591a\u7c7b\u673a\u5668\u4eba\uff0c\u517c\u987e\u5e73\u6ed1\u63a7\u5236\u4e0e\u6267\u884c\u6548\u7387\u3002"}, {"abstract": "Learning the continuous-time evolution of nonlinear dynamical systems relies on trajectory-based objectives, which require simulating the learned dynamics during training and backpropagating through the numerical scheme, at a cost that grows with the rollout horizon. We show that trajectory-based objectives degenerate as the rollout horizon increases, hindering gradient-based optimization, and that the numerical scheme biases the learned dynamics by constraining the spectrum of the learned Jacobian to its absolute stability region. To overcome these limitations, we introduce Velocity Matching (VM), a simulation-free objective that relies on piecewise-linear interpolation and stochastic collocation, and approximates the velocity population risk to second order in the sampling step. We develop a theoretical framework for velocity-based learning, introducing stability estimates that control trajectory errors in terms of velocity errors, which enable us to establish universal and continuous-time approximation results when the learned velocity field is parameterized by deep neural networks. Building on a bias-variance decomposition of the VM objective, we show that its higher-order approximation of the velocity population risk yields a consistent minimizer; that it relates to the residual of an A-stable continuous-stage Runge-Kutta scheme, thus connecting VM to implicit integration without requiring any implicit solve; and that it implicitly matches the action of the learned Jacobian to that of the true one along the observed trajectories, without requiring access to the underlying velocity field or its Jacobian. Numerical experiments on nonlinear ordinary differential equations and semi-discretized time-dependent partial differential equations show that VM improves accuracy over trajectory-based objectives, while avoiding both the cost of simulation and the instabilities of long rollouts.", "arxiv_id": "2611.00448", "arxiv_url": "https://arxiv.org/abs/2611.00448", "authors": ["Nicola Farenga", "Andrea Manzoni"], "brief": "\u63d0\u51fa\u901f\u5ea6\u5339\u914d\uff08VM\uff09\u76ee\u6807\uff0c\u7528\u5206\u6bb5\u7ebf\u6027\u63d2\u503c\u4e0e\u968f\u673a\u914d\u70b9\u5b66\u4e60\u8fde\u7eed\u65f6\u95f4\u901f\u5ea6\u573a\uff0c\u65e0\u9700\u8bad\u7ec3\u65f6\u4eff\u771f\u3002\u8be5\u76ee\u6807\u4ee5\u91c7\u6837\u6b65\u957f\u4e8c\u9636\u7cbe\u5ea6\u8fd1\u4f3c\u901f\u5ea6\u603b\u4f53\u98ce\u9669\u3002", "categories": ["cs.LG", "cs.AI", "math.NA"], "github_repo": "https://github.com/farenga/velocity-matching", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00448", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63ed\u793a\u957f\u8f68\u8ff9\u76ee\u6807\u9000\u5316\u53ca\u6570\u503c\u7a33\u5b9a\u57df\u5bf9\u96c5\u53ef\u6bd4\u8c31\u7684\u504f\u7f6e", "VM\u7ed3\u5408\u5206\u6bb5\u7ebf\u6027\u63d2\u503c\u4e0e\u968f\u673a\u914d\u70b9\uff0c\u514d\u4eff\u771f\u8bad\u7ec3", "\u5728\u975e\u7ebf\u6027ODE\u4e0e\u534a\u79bb\u6563PDE\u4e0a\uff0c\u7cbe\u5ea6\u4f18\u4e8e\u8f68\u8ff9\u76ee\u6807"], "keywords": ["\u52a8\u529b\u7cfb\u7edf", "\u8fde\u7eed\u65f6\u95f4\u5b66\u4e60", "\u6570\u503c\u5206\u6790"], "num_comments": 2, "on_hf": true, "organization": "Politecnico di Milano", "pdf_url": "https://arxiv.org/pdf/2611.00448v1", "published_at": "2026-10-30", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00448.png", "title": "Learning to evolve by matching velocities", "tldr": "\u901a\u8fc7\u76f4\u63a5\u5339\u914d\u901f\u5ea6\u5b66\u4e60\u975e\u7ebf\u6027\u52a8\u529b\u5b66\uff0c\u514d\u53bb\u8bad\u7ec3\u4eff\u771f\u5e76\u7f13\u89e3\u957f\u8f68\u8ff9\u4f18\u5316\u5931\u7a33\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u901f\u5ea6\u5339\u914d\uff08VM\uff09\u76ee\u6807\uff0c\u7528\u5206\u6bb5\u7ebf\u6027\u63d2\u503c\u4e0e\u968f\u673a\u914d\u70b9\u5b66\u4e60\u8fde\u7eed\u65f6\u95f4\u901f\u5ea6\u573a\uff0c\u65e0\u9700\u8bad\u7ec3\u65f6\u4eff\u771f\u3002\u8be5\u76ee\u6807\u4ee5\u91c7\u6837\u6b65\u957f\u4e8c\u9636\u7cbe\u5ea6\u8fd1\u4f3c\u901f\u5ea6\u603b\u4f53\u98ce\u9669\u3002", "why_notable": "\u5c06\u52a8\u529b\u5b66\u5b66\u4e60\u4ece\u957f\u7a0b\u4eff\u771f\u8f6c\u5411\u5c40\u90e8\u901f\u5ea6\u7ea6\u675f\uff0c\u5e76\u5efa\u7acb\u901f\u5ea6\u8bef\u5dee\u63a7\u5236\u8f68\u8ff9\u8bef\u5dee\u7684\u7406\u8bba\uff0c\u4e3a\u4f4e\u6210\u672c\u3001\u7a33\u5b9a\u7684\u8fde\u7eed\u65f6\u95f4\u5efa\u6a21\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Intra-weight injection lets one model change another model\u0027s behaviour by editing its weights directly, without gradients. Such edits can range from altering lexical associations to enforcing output formats or updating factual knowledge. Despite growing interest in these approaches, there has been no systematic way to evaluate how well models perform them. We introduce IWIBench, which measures a large editor model\u0027s ability to modify the weights of a smaller target model (typically Gemma 3 4B IT) to achieve one of ten classical text-editing objectives while preserving its other capabilities. Editors are limited to four tools for reading and writing weights, with bounded tensor access and a fixed budget for generating and inspecting rollouts. A validator applies each proposed patch in a clean environment and compares the edited model against the unmodified target. Evaluating frontier closed- and open-weight models reveals sharply diverging capabilities, both across models and across tasks. A small number of models, most notably Astra and GPT-6.1 Sol, perform far ahead of the rest. The recency of this ability (little of it is evident in GPT-5.6 Sol, for instance), together with qualitative analysis, suggests it has been acquired through recent training. Tasks also vary widely: structured response resisted every attempt, and answer-length control yielded only one successful solution, whereas alias acquisition and recoding proved most amenable. Success in one task family correlated poorly with success in others, indicating an early and uneven capability frontier. We discuss strategies that editors repeatedly adopted and conclude with an outlook on intra-weight injection as an emerging but already potent approach to gradient-free behaviour modification.", "arxiv_id": "2611.08647", "arxiv_url": "https://arxiv.org/abs/2611.08647", "authors": ["Chris von Csefalvay", "Pranav Doma", "Achyuthan Unni Krishnan", "Tam\u00e1s F\u00f6ldi"], "brief": "IWIBench\u8ba9\u5927\u6a21\u578b\u7528\u53d7\u9650\u5de5\u5177\u76f4\u63a5\u4fee\u6539\u5c0f\u6a21\u578b\u6743\u91cd\uff0c\u5b8c\u6210\u5341\u7c7b\u6587\u672c\u7f16\u8f91\u76ee\u6807\u3002\u9a8c\u8bc1\u5668\u5728\u5e72\u51c0\u73af\u5883\u4e2d\u5e94\u7528\u8865\u4e01\uff0c\u5bf9\u6bd4\u4fee\u6539\u524d\u540e\u7684\u76ee\u6807\u8868\u73b0\u4e0e\u5176\u4ed6\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/hcltech-robotics/iwibench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.08647", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4ee5Gemma 3 4B IT\u4e3a\u5178\u578b\u76ee\u6807\uff0c\u8986\u76d6\u5341\u7c7b\u7f16\u8f91\u4efb\u52a1", "\u7f16\u8f91\u5668\u4ec5\u7528\u56db\u79cd\u6743\u91cd\u8bfb\u5199\u5de5\u5177\uff0c\u5f20\u91cf\u8bbf\u95ee\u548c\u8bd5\u8fd0\u884c\u9884\u7b97\u53d7\u9650", "\u7ed3\u6784\u5316\u54cd\u5e94\u65e0\u4eba\u6210\u529f\uff0c\u7b54\u6848\u957f\u5ea6\u63a7\u5236\u4ec5\u6709\u4e00\u4e2a\u6210\u529f\u65b9\u6848"], "keywords": ["\u6a21\u578b\u7f16\u8f91", "\u65e0\u68af\u5ea6\u4f18\u5316", "\u57fa\u51c6\u8bc4\u6d4b", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 3, "on_hf": true, "organization": " HCLTech Robotics", "pdf_url": "https://arxiv.org/pdf/2611.08647v1", "published_at": "2026-11-05", "score": 0.226, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08647.png", "title": "IWIBench: Evaluating Gradient-Free Model Driven Intra-weight Injection", "tldr": "\u8be5\u57fa\u51c6\u68c0\u9a8c\u6a21\u578b\u65e0\u68af\u5ea6\u6539\u5199\u53e6\u4e00\u6a21\u578b\u6743\u91cd\u7684\u80fd\u529b\uff0c\u63ed\u793a\u4efb\u52a1\u95f4\u663e\u8457\u5dee\u5f02\u3002", "upvotes": 3, "what_it_is": "IWIBench\u8ba9\u5927\u6a21\u578b\u7528\u53d7\u9650\u5de5\u5177\u76f4\u63a5\u4fee\u6539\u5c0f\u6a21\u578b\u6743\u91cd\uff0c\u5b8c\u6210\u5341\u7c7b\u6587\u672c\u7f16\u8f91\u76ee\u6807\u3002\u9a8c\u8bc1\u5668\u5728\u5e72\u51c0\u73af\u5883\u4e2d\u5e94\u7528\u8865\u4e01\uff0c\u5bf9\u6bd4\u4fee\u6539\u524d\u540e\u7684\u76ee\u6807\u8868\u73b0\u4e0e\u5176\u4ed6\u80fd\u529b\u3002", "why_notable": "\u5b83\u4e3a\u65e0\u68af\u5ea6\u6743\u91cd\u7f16\u8f91\u63d0\u4f9b\u7cfb\u7edf\u8bc4\u6d4b\uff0c\u540c\u65f6\u68c0\u9a8c\u884c\u4e3a\u4fee\u6539\u4e0e\u80fd\u529b\u4fdd\u7559\u3002\u4e0d\u540c\u4efb\u52a1\u7684\u6210\u529f\u8868\u73b0\u76f8\u5173\u6027\u4f4e\uff0c\u663e\u793a\u8fd9\u9879\u80fd\u529b\u4ecd\u4e0d\u5747\u8861\u3002"}, {"abstract": "On-Policy Self-Distillation (OPSD) improves reasoning by training a student on its own reasoning, using the same model conditioned on reference solutions as a teacher. Applying OPSD to multilingual reasoning requires the teacher to provide useful feedback across languages, even when the student makes mistakes in intermediate steps. We observe a phenomenon we call Teacher Drift: as these mistakes accumulate, the teacher may follow the student\u0027s incorrect steps instead of correcting them. Our analysis shows that this shift tends to occur earlier in lower-resource languages. To account for these differences across languages, we propose Teachable On-Policy Self-Distillation (TOPSD), which determines where and whether teacher supervision should be applied to each reasoning trajectory. TOPSD uses teacher-student likelihood to estimate where drift begins and select a prefix for supervision. It then verifies whether the teacher can recover the correct answer from that prefix, applying distillation only to prefixes that pass verification. Experiments on multilingual mathematical reasoning across ten languages and three model scales show that TOPSD consistently outperforms conventional OPSD, particularly in low- and medium-resource languages.", "arxiv_id": "2611.08179", "arxiv_url": "https://arxiv.org/abs/2611.08179", "authors": ["Jaewon Cho", "Minseo Yoon", "Jinyoung Park", "Jinwoo Seo", "Jaewon Chu", "Alice Oh", "Hyunwoo J. Kim"], "brief": "\u63d0\u51faTOPSD\uff0c\u6309\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u4f3c\u7136\u4f30\u8ba1\u6559\u5e08\u504f\u79bb\u6b63\u786e\u63a8\u7406\u7684\u4f4d\u7f6e\uff0c\u622a\u53d6\u76d1\u7763\u524d\u7f00\uff1b\u518d\u9a8c\u8bc1\u6559\u5e08\u80fd\u5426\u4ece\u6b64\u524d\u7f00\u6062\u590d\u6b63\u786e\u7b54\u6848\uff0c\u4ec5\u5bf9\u901a\u8fc7\u9a8c\u8bc1\u7684\u524d\u7f00\u8fdb\u884c\u84b8\u998f\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08179", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Teacher Drift\u5728\u4f4e\u8d44\u6e90\u8bed\u8a00\u4e2d\u66f4\u65e9\u51fa\u73b0", "TOPSD\u7ed3\u5408\u4f3c\u7136\u4f30\u8ba1\u4e0e\u7b54\u6848\u6062\u590d\u9a8c\u8bc1\u7b5b\u9009\u524d\u7f00", "\u8986\u76d610\u79cd\u8bed\u8a00\u30013\u79cd\u6a21\u578b\u89c4\u6a21\uff0c\u6301\u7eed\u4f18\u4e8eOPSD"], "keywords": ["\u591a\u8bed\u8a00\u63a8\u7406", "\u77e5\u8bc6\u84b8\u998f", "\u6570\u5b66\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08179v1", "published_at": "2026-11-05", "score": 0.22, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08179.png", "title": "Knowing When to Teach: Learning from Teachable Prefixes in Multilingual Reasoning Distillation", "tldr": "\u901a\u8fc7\u7b5b\u9009\u6559\u5e08\u80fd\u7ea0\u6b63\u7684\u63a8\u7406\u524d\u7f00\uff0c\u63d0\u5347\u591a\u8bed\u8a00\u81ea\u84b8\u998f\u6548\u679c\uff0c\u5c24\u5176\u60e0\u53ca\u4f4e\u8d44\u6e90\u8bed\u8a00\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51faTOPSD\uff0c\u6309\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u4f3c\u7136\u4f30\u8ba1\u6559\u5e08\u504f\u79bb\u6b63\u786e\u63a8\u7406\u7684\u4f4d\u7f6e\uff0c\u622a\u53d6\u76d1\u7763\u524d\u7f00\uff1b\u518d\u9a8c\u8bc1\u6559\u5e08\u80fd\u5426\u4ece\u6b64\u524d\u7f00\u6062\u590d\u6b63\u786e\u7b54\u6848\uff0c\u4ec5\u5bf9\u901a\u8fc7\u9a8c\u8bc1\u7684\u524d\u7f00\u8fdb\u884c\u84b8\u998f\u3002", "why_notable": "\u5c06\u76d1\u7763\u9009\u62e9\u7ec6\u5316\u5230\u63a8\u7406\u524d\u7f00\uff0c\u51cf\u5c11\u6559\u5e08\u987a\u4ece\u5b66\u751f\u9519\u8bef\u7684\u98ce\u9669\uff0c\u4e3a\u591a\u8bed\u8a00\u81ea\u84b8\u998f\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u8bad\u7ec3\u4fe1\u53f7\uff0c\u4f4e\u4e2d\u8d44\u6e90\u8bed\u8a00\u6536\u76ca\u5c24\u5176\u660e\u663e\u3002"}, {"abstract": "3D part decomposition is a central capability for editable asset creation, yet existing workflows typically segment a completed mesh as a post-processing step, making the result sensitive to geometric artifacts, texture ambiguity, and limited part-level annotations. We present OmniLatent, a unified latent modeling framework for 3D part decomposition. Instead of predicting part labels in isolation, OmniLatent learns a shared latent space that jointly encodes geometry, deformation, appearance, and binary part IDs, allowing data-rich geometric and visual priors to support data-scarce part learning. Given a single input image, the base model generates geometry, deformation, texture, and surface part IDs in one pass, producing a part-aware 3D asset without a separate segmentation stage. We further tune the pretrained model for two extensions: a point-prompt adapter that maps arbitrary 3D point prompts with binary part IDs into latent tokens for full segmentation, refinement, and part subdivision, and an amodal part completion model that completes partial surface masks into a coherent full-object decomposition through dynamic per-part token allocation, cross-attention to the given geometry latent, and alternating part-local and global attention. Extensive experiments show that OmniLatent produces semantically meaningful part segmentations with precise boundaries, supports interactive part editing, and completes partial part observations while preserving global object consistency.", "arxiv_id": "2611.09055", "arxiv_url": "https://arxiv.org/abs/2611.09055", "authors": ["Yunhan Yang", "Yunfei Zhao", "Zeqiang Lai", "Jiachen Xu", "Minxiu Wang", "Xintong Han", "Xiangyu Yue", "Xihui Liu", "Chunchao Guo"], "brief": "OmniLatent\u8054\u5408\u7f16\u7801\u51e0\u4f55\u3001\u5f62\u53d8\u3001\u5916\u89c2\u4e0e\u4e8c\u503c\u90e8\u4ef6\u6807\u8bc6\uff0c\u501f\u52a9\u51e0\u4f55\u548c\u89c6\u89c9\u5148\u9a8c\u5b66\u4e60\u90e8\u4ef6\u5212\u5206\uff1b\u4ece\u5355\u56fe\u4e00\u6b21\u751f\u6210\u5e26\u5206\u533a\u7684\u4e09\u7ef4\u8d44\u4ea7\uff0c\u65e0\u9700\u540e\u7f6e\u5206\u5272\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09055", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5171\u4eab\u6f5c\u7a7a\u95f4\u8054\u5408\u5efa\u6a21\u51e0\u4f55\u3001\u5f62\u53d8\u3001\u5916\u89c2\u548c\u4e8c\u503c\u90e8\u4ef6\u6807\u8bc6", "\u70b9\u63d0\u793a\u9002\u914d\u5668\u5c06\u4e09\u7ef4\u63d0\u793a\u70b9\u6620\u5c04\u4e3a\u6f5c\u53d8\u91cf\u4ee4\u724c\uff0c\u652f\u6301\u7ec6\u5206", "\u52a8\u6001\u90e8\u4ef6\u4ee4\u724c\u5206\u914d\u7ed3\u5408\u5c40\u90e8\u4e0e\u5168\u5c40\u6ce8\u610f\u529b\uff0c\u8865\u5168\u5c40\u90e8\u63a9\u7801"], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u90e8\u4ef6\u5206\u5272", "\u6f5c\u7a7a\u95f4\u5efa\u6a21", "\u4ea4\u4e92\u7f16\u8f91"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09055v1", "published_at": "2026-11-06", "score": 0.216, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09055.png", "title": "OmniLatent: Unified Latent for 3D Part Modeling", "tldr": "\u901a\u8fc7\u7edf\u4e00\u6f5c\u7a7a\u95f4\uff0c\u4ece\u5355\u5f20\u56fe\u50cf\u76f4\u63a5\u751f\u6210\u5e26\u90e8\u4ef6\u5212\u5206\u7684\u4e09\u7ef4\u8d44\u4ea7\uff0c\u5e76\u652f\u6301\u4ea4\u4e92\u7f16\u8f91\u4e0e\u8865\u5168\u3002", "upvotes": 3, "what_it_is": "OmniLatent\u8054\u5408\u7f16\u7801\u51e0\u4f55\u3001\u5f62\u53d8\u3001\u5916\u89c2\u4e0e\u4e8c\u503c\u90e8\u4ef6\u6807\u8bc6\uff0c\u501f\u52a9\u51e0\u4f55\u548c\u89c6\u89c9\u5148\u9a8c\u5b66\u4e60\u90e8\u4ef6\u5212\u5206\uff1b\u4ece\u5355\u56fe\u4e00\u6b21\u751f\u6210\u5e26\u5206\u533a\u7684\u4e09\u7ef4\u8d44\u4ea7\uff0c\u65e0\u9700\u540e\u7f6e\u5206\u5272\u3002", "why_notable": "\u5c06\u90e8\u4ef6\u5212\u5206\u878d\u5165\u4e09\u7ef4\u751f\u6210\uff0c\u51cf\u5c11\u5bf9\u540e\u7f6e\u7f51\u683c\u5206\u5272\u7684\u4f9d\u8d56\uff1b\u540c\u65f6\u652f\u6301\u4ea4\u4e92\u7ec6\u5316\u4e0e\u5b8c\u6574\u90e8\u4ef6\u8865\u5168\uff0c\u4e3a\u53ef\u7f16\u8f91\u8d44\u4ea7\u521b\u5efa\u63d0\u4f9b\u7edf\u4e00\u8def\u5f84\u3002"}, {"abstract": "Model editing provides an efficient way to update factual knowledge in transformer models. Recent approaches reverse edits by modifying, masking, or decomposing model weights, but make recovery dependent on weight-space interventions. We instead show that pre-edit knowledge can be recovered through input-space interventions alone, without modifying the edited model\u0027s weights. We introduce Memento, a prompt-space mechanism for auditing residual knowledge that learns a reusable recovery signal to steer an edited model toward its pre-edit response. Memento supports both continuous recovery prefixes and discrete textual prompts for standard text interfaces. Across three LLMs and five editing techniques, Memento recovers 80.07% of held-out edited facts, achieving a 9.58% relative improvement over baselines, suggesting that editing may suppress the facts without fully eliminating their recoverability. We further investigate whether prompt-space recovery extends beyond model editing. On pristine, unedited LLMs, Memento improves average factual recall by 53.9% relative to standard inference. These results demonstrate the potential of prompt-space recovery for auditing residual knowledge in edited models and investigating the gap between factual knowledge and its accessibility during inference. We will release our source code.", "arxiv_id": "2611.10450", "arxiv_url": "https://arxiv.org/abs/2611.10450", "authors": ["Manit Baser", "Rachel Yeo Hui Min", "Aditya Nawal", "Dinil Mon Divakaran", "Mohan Gurusamy"], "brief": "\u63d0\u51fa\u6b8b\u7559\u77e5\u8bc6\u5ba1\u8ba1\u673a\u5236 Memento\uff0c\u5b66\u4e60\u53ef\u590d\u7528\u7684\u6062\u590d\u4fe1\u53f7\uff0c\u5f15\u5bfc\u5df2\u7f16\u8f91\u6a21\u578b\u8fd4\u56de\u7f16\u8f91\u524d\u7684\u7b54\u6848\u3002\u5b83\u65e0\u9700\u4fee\u6539\u6743\u91cd\uff0c\u652f\u6301\u8fde\u7eed\u524d\u7f00\u4e0e\u79bb\u6563\u6587\u672c\u63d0\u793a\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10450", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d63\u4e2a\u5927\u6a21\u578b\u30015\u79cd\u77e5\u8bc6\u7f16\u8f91\u65b9\u6cd5", "\u6062\u590d80.07%\u7684\u7559\u51fa\u7f16\u8f91\u4e8b\u5b9e\uff0c\u76f8\u5bf9\u57fa\u7ebf\u63d0\u53479.58%", "\u672a\u7f16\u8f91\u6a21\u578b\u7684\u5e73\u5747\u4e8b\u5b9e\u53ec\u56de\u76f8\u5bf9\u63d0\u534753.9%"], "keywords": ["\u77e5\u8bc6\u7f16\u8f91", "\u63d0\u793a\u5b66\u4e60", "\u77e5\u8bc6\u6062\u590d", "\u6a21\u578b\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10450v1", "published_at": "2026-11-07", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Truth Beneath the Tokens: Prompt-Space Recovery of Knowledge Edits in Language Models", "tldr": "\u4ec5\u9760\u63d0\u793a\u5373\u53ef\u6062\u590d\u6a21\u578b\u7f16\u8f91\u524d\u7684\u77e5\u8bc6\uff0c\u63ed\u793a\u4e8b\u5b9e\u88ab\u538b\u5236\u800c\u975e\u5f7b\u5e95\u9057\u5fd8\u7684\u53ef\u80fd\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u6b8b\u7559\u77e5\u8bc6\u5ba1\u8ba1\u673a\u5236 Memento\uff0c\u5b66\u4e60\u53ef\u590d\u7528\u7684\u6062\u590d\u4fe1\u53f7\uff0c\u5f15\u5bfc\u5df2\u7f16\u8f91\u6a21\u578b\u8fd4\u56de\u7f16\u8f91\u524d\u7684\u7b54\u6848\u3002\u5b83\u65e0\u9700\u4fee\u6539\u6743\u91cd\uff0c\u652f\u6301\u8fde\u7eed\u524d\u7f00\u4e0e\u79bb\u6563\u6587\u672c\u63d0\u793a\u3002", "why_notable": "\u5c06\u77e5\u8bc6\u7f16\u8f91\u5ba1\u8ba1\u4ece\u6743\u91cd\u5e72\u9884\u8f6c\u5411\u63d0\u793a\u5e72\u9884\uff0c\u4e3a\u68c0\u9a8c\u65e7\u77e5\u8bc6\u662f\u5426\u771f\u6b63\u6d88\u9664\u63d0\u4f9b\u65b0\u5de5\u5177\uff0c\u4e5f\u63ed\u793a\u6a21\u578b\u62e5\u6709\u77e5\u8bc6\u4e0e\u63a8\u7406\u65f6\u53ef\u8bbf\u95ee\u77e5\u8bc6\u4e4b\u95f4\u7684\u5dee\u8ddd\u3002"}, {"abstract": "Self-evolving agents improve their own skills, memory, and harness code from experience without retraining the base LLM, and group-evolving agents go further by sharing these lessons across agents. Yet most such systems overlook that sharing across users and heterogeneous agents requires deciding who can benefit from each lesson and what information must remain private. We present MixUA, a memory system that distills independent user-agent trajectories into lessons and assigns each lesson to a user-agent pair, user, agent, or global scope according to whom it benefits and what it may disclose. For evaluation, we introduce CrossLearnBench, a mixed-user-agent benchmark that pairs established agent tasks with user preferences and privacy probes that test whether private facts leak into memory other users can read. With five users and seven agents, MixUA raises pass rates by up to 16 points over no memory and 5 over a single global memory, even on tasks previously tried only by other users on other agents. It retains up to 90% of previously stated preferences, and at most 0.02% of privacy probes find a planted private fact in a forbidden scope. We hope MixUA offers a scalable path toward a global system where users and agents co-evolve.", "arxiv_id": "2611.10439", "arxiv_url": "https://arxiv.org/abs/2611.10439", "authors": ["Yunzhe Wang", "Mesut Erhan Unal", "Sheng Zhang", "Shabnam Ghadar", "Peng Tang"], "brief": "MixUA\u4ece\u72ec\u7acb\u7684\u7528\u6237\u4e0e\u667a\u80fd\u4f53\u4ea4\u4e92\u8f68\u8ff9\u4e2d\u63d0\u70bc\u7ecf\u9a8c\uff0c\u6309\u53d7\u76ca\u5bf9\u8c61\u4e0e\u6cc4\u9732\u98ce\u9669\u5206\u914d\u5230\u56db\u79cd\u8bb0\u5fc6\u8303\u56f4\uff0c\u5e76\u7528\u6df7\u5408\u7528\u6237\u4e0e\u667a\u80fd\u4f53\u57fa\u51c6\u68c0\u9a8c\u5171\u4eab\u6536\u76ca\u53ca\u9690\u79c1\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10439", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["MixUA\u8bbe\u7f6e\u7528\u6237\u2014\u667a\u80fd\u4f53\u5bf9\u3001\u7528\u6237\u3001\u667a\u80fd\u4f53\u53ca\u5168\u5c40\u56db\u7ea7\u8bb0\u5fc6", "CrossLearnBench\u8986\u76d65\u540d\u7528\u6237\u30017\u4e2a\u667a\u80fd\u4f53\u53ca\u9690\u79c1\u63a2\u9488", "\u901a\u8fc7\u7387\u8f83\u65e0\u8bb0\u5fc6\u6700\u9ad8\u589e16\u4e2a\u767e\u5206\u70b9\uff0c\u504f\u597d\u4fdd\u7559\u7387\u6700\u9ad890%"], "keywords": ["\u667a\u80fd\u4f53\u8bb0\u5fc6", "\u591a\u667a\u80fd\u4f53", "\u9690\u79c1\u4fdd\u62a4", "\u7ecf\u9a8c\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10439v1", "published_at": "2026-11-07", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Who Remembers What? Multi-Granularity Memory Extraction for Multi-User, Multi-Agent Interaction", "tldr": "\u6309\u7528\u6237\u4e0e\u667a\u80fd\u4f53\u5212\u5206\u8bb0\u5fc6\u5171\u4eab\u8303\u56f4\uff0c\u517c\u987e\u8de8\u4efb\u52a1\u7ecf\u9a8c\u590d\u7528\u4e0e\u9690\u79c1\u4fdd\u62a4\u3002", "upvotes": 0, "what_it_is": "MixUA\u4ece\u72ec\u7acb\u7684\u7528\u6237\u4e0e\u667a\u80fd\u4f53\u4ea4\u4e92\u8f68\u8ff9\u4e2d\u63d0\u70bc\u7ecf\u9a8c\uff0c\u6309\u53d7\u76ca\u5bf9\u8c61\u4e0e\u6cc4\u9732\u98ce\u9669\u5206\u914d\u5230\u56db\u79cd\u8bb0\u5fc6\u8303\u56f4\uff0c\u5e76\u7528\u6df7\u5408\u7528\u6237\u4e0e\u667a\u80fd\u4f53\u57fa\u51c6\u68c0\u9a8c\u5171\u4eab\u6536\u76ca\u53ca\u9690\u79c1\u3002", "why_notable": "\u5c06\u7ecf\u9a8c\u5171\u4eab\u4e0e\u8bbf\u95ee\u8fb9\u754c\u7edf\u4e00\u5efa\u6a21\uff0c\u652f\u6301\u8de8\u7528\u6237\u3001\u8de8\u667a\u80fd\u4f53\u8fc1\u79fb\uff1b\u7981\u7528\u8303\u56f4\u7684\u9690\u79c1\u63a2\u9488\u547d\u4e2d\u7387\u6700\u9ad8\u4ec50.02%\uff0c\u663e\u793a\u5206\u7ea7\u8bb0\u5fc6\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Diffusion language models (DLMs) generate text through iterative denoising, where decisions about which tokens to commit or remask strongly affect output quality. Existing certainty-aware strategies rely on instantaneous confidence or entropy, but these local signals can be misleading on difficult reasoning problems. We formulate DLM test-time scaling as adaptive allocation of both inference compute and decoding strategies. Our two-stage approach uses a fast base sampler to solve easy questions, then applies frequency-aware remasking to the remaining hard questions. This strategy tracks how often each token\u0027s prediction changes across denoising steps and preferentially commits frequently changing tokens, encouraging samples to explore alternative reasoning paths rather than collapse onto the model\u0027s preferred trajectory. Experiments with LLaDA-8B-Instruct and Dream-7B-Instruct show consistent improvements over a strong adaptive allocation baseline, with absolute accuracy gains of up to 3.73 percentage points (LLaDA) and 7.33 percentage points (Dream) on MATH-500, and absolute coverage gains of up to 11.39 percentage points (LLaDA) and 10.98 percentage points (Dream) on HumanEval. On questions unsolved by the base certainty-aware strategy after 100 samples, frequency-aware remasking recovers solutions for 3.75% to 18.75% of examples.", "arxiv_id": "2611.10486", "arxiv_url": "https://arxiv.org/abs/2611.10486", "authors": ["Bowen Zuo", "Yue Yu", "Dongruo Zhou", "Yinglun Zhu"], "brief": "\u63d0\u51fa\u4e24\u9636\u6bb5\u63a8\u7406\u7b56\u7565\uff1a\u5148\u7528\u5feb\u901f\u91c7\u6837\u5668\u89e3\u51b3\u7b80\u5355\u9898\uff0c\u518d\u5bf9\u96be\u9898\u91c7\u7528\u9891\u7387\u611f\u77e5\u91cd\u63a9\u7801\u3002\u5b83\u7edf\u8ba1\u8bcd\u5143\u9884\u6d4b\u5728\u53bb\u566a\u4e2d\u7684\u53d8\u5316\u6b21\u6570\uff0c\u4f18\u5148\u786e\u5b9a\u9891\u7e41\u53d8\u5316\u7684\u8bcd\u5143\uff0c\u4ee5\u63a2\u7d22\u4e0d\u540c\u63a8\u7406\u8def\u5f84\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10486", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9891\u7387\u611f\u77e5\u91cd\u63a9\u7801\u6309\u8de8\u53bb\u566a\u6b65\u9aa4\u7684\u9884\u6d4b\u53d8\u5316\u6b21\u6570\u9009\u62e9\u8bcd\u5143", "MATH-500\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u5347\uff1aLLaDA 3.73\u3001Dream 7.33\u4e2a\u767e\u5206\u70b9", "\u57fa\u7840\u7b56\u7565\u91c7\u6837100\u6b21\u4ecd\u672a\u89e3\u9898\u4e2d\uff0c\u6062\u590d3.75%\u81f318.75%\u7684\u89e3"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u91cd\u63a9\u7801", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10486v1", "published_at": "2026-11-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Test-Time Scaling for Diffusion Language Models with Frequency-Aware Remasking", "tldr": "\u901a\u8fc7\u8bcd\u5143\u9884\u6d4b\u53d8\u5316\u9891\u7387\u5f15\u5bfc\u91cd\u63a9\u7801\uff0c\u8ba9\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5c06\u63a8\u7406\u7b97\u529b\u7528\u4e8e\u63a2\u7d22\u96be\u9898\u65b0\u89e3\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e24\u9636\u6bb5\u63a8\u7406\u7b56\u7565\uff1a\u5148\u7528\u5feb\u901f\u91c7\u6837\u5668\u89e3\u51b3\u7b80\u5355\u9898\uff0c\u518d\u5bf9\u96be\u9898\u91c7\u7528\u9891\u7387\u611f\u77e5\u91cd\u63a9\u7801\u3002\u5b83\u7edf\u8ba1\u8bcd\u5143\u9884\u6d4b\u5728\u53bb\u566a\u4e2d\u7684\u53d8\u5316\u6b21\u6570\uff0c\u4f18\u5148\u786e\u5b9a\u9891\u7e41\u53d8\u5316\u7684\u8bcd\u5143\uff0c\u4ee5\u63a2\u7d22\u4e0d\u540c\u63a8\u7406\u8def\u5f84\u3002", "why_notable": "\u628a\u6d4b\u8bd5\u65f6\u6269\u5c55\u4ece\u589e\u52a0\u91c7\u6837\u6b21\u6570\u63a8\u8fdb\u5230\u8c03\u6574\u89e3\u7801\u8def\u5f84\uff0c\u5728\u6570\u5b66\u4e0e\u4ee3\u7801\u4efb\u52a1\u4e0a\u5747\u6709\u589e\u76ca\uff0c\u5e76\u80fd\u627e\u56de\u5e38\u89c4\u7f6e\u4fe1\u5ea6\u7b56\u7565\u53cd\u590d\u91c7\u6837\u4ecd\u9057\u6f0f\u7684\u89e3\u3002"}, {"abstract": "Existing methods enhancing an LLM\u0027s long-context reasoning capability often rely on data synthesis and follow-up LLM post-training. However, the data synthesis strategy and the post-training recipes are empirically driven and computationally intensive. In this work, we propose a new framework, dubbed LongCapHarness, to instead harness the underlying capabilities for long-context reasoning. The harnessing process recursively revises and updates capability primitive implementation, capability state and control logic through recursive self-improvement on the development set. With neither data synthesis nor LLM post-training, LongCapHarness is applied to Llama3-8B and transferred to Qwen2.5-3B. LongCapHarness substantially outperforms recent data-synthesis-based baselines on HELMET and RULER benchmarks; its estimated development cost is less than 50% of the estimated training costs of NExtLong and PolicyLong. We hope these results motivate further research into harnessing the latent capabilities of LLMs to solve tasks beyond their explicit training.", "arxiv_id": "2611.10463", "arxiv_url": "https://arxiv.org/abs/2611.10463", "authors": ["Tao Zhang", "Yuhang He"], "brief": "LongCapHarness\u4ee5\u80fd\u529b\u4e3a\u5bfc\u5411\u6784\u5efa\u63a8\u7406\u6846\u67b6\uff0c\u5728\u5f00\u53d1\u96c6\u4e0a\u9012\u5f52\u81ea\u6539\u8fdb\uff0c\u66f4\u65b0\u80fd\u529b\u539f\u8bed\u5b9e\u73b0\u3001\u80fd\u529b\u72b6\u6001\u548c\u63a7\u5236\u903b\u8f91\uff0c\u6316\u6398\u6a21\u578b\u5df2\u6709\u7684\u957f\u4e0a\u4e0b\u6587\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10463", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u65e0\u9700\u6570\u636e\u5408\u6210\u6216\u540e\u8bad\u7ec3\uff0c\u5e94\u7528\u4e8eLlama3-8B\u5e76\u8fc1\u79fb\u81f3Qwen2.5-3B", "\u5728HELMET\u548cRULER\u4e0a\u663e\u8457\u4f18\u4e8e\u8fd1\u671f\u6570\u636e\u5408\u6210\u57fa\u7ebf", "\u4f30\u7b97\u5f00\u53d1\u6210\u672c\u4f4e\u4e8eNExtLong\u548cPolicyLong\u8bad\u7ec3\u6210\u672c\u768450%"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u6846\u67b6", "\u9012\u5f52\u81ea\u6539\u8fdb", "\u80fd\u529b\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10463v1", "published_at": "2026-11-07", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LongCapHarness: Capability-Guided Auto-Harnessing for Long-Context Reasoning", "tldr": "\u901a\u8fc7\u9012\u5f52\u6539\u8fdb\u80fd\u529b\u7ec4\u4ef6\u4e0e\u63a7\u5236\u903b\u8f91\uff0c\u65e0\u9700\u540e\u8bad\u7ec3\u5373\u53ef\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "LongCapHarness\u4ee5\u80fd\u529b\u4e3a\u5bfc\u5411\u6784\u5efa\u63a8\u7406\u6846\u67b6\uff0c\u5728\u5f00\u53d1\u96c6\u4e0a\u9012\u5f52\u81ea\u6539\u8fdb\uff0c\u66f4\u65b0\u80fd\u529b\u539f\u8bed\u5b9e\u73b0\u3001\u80fd\u529b\u72b6\u6001\u548c\u63a7\u5236\u903b\u8f91\uff0c\u6316\u6398\u6a21\u578b\u5df2\u6709\u7684\u957f\u4e0a\u4e0b\u6587\u80fd\u529b\u3002", "why_notable": "\u5c06\u957f\u4e0a\u4e0b\u6587\u80fd\u529b\u63d0\u5347\u4ece\u6602\u8d35\u7684\u8bad\u7ec3\u8f6c\u5411\u63a8\u7406\u6846\u67b6\u4f18\u5316\uff0c\u5e76\u5c55\u793a\u8de8\u6a21\u578b\u8fc1\u79fb\u6f5c\u529b\uff0c\u4e3a\u4f4e\u6210\u672c\u6316\u6398\u6a21\u578b\u6f5c\u5728\u80fd\u529b\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
