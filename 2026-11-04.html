ions. In this work, we introduce Factorized MLLM Embeddings (FactEmbed), which decouples compositional query comprehension from building discriminative embeddings. Rather than directly projecting the composed query into a single embedding without internal reasoning, FactEmbed employs a set of factorized latents that simulate the intended visual modifications via an intermediate target imagination objective. This process encourages the latents to ground into target semantics before forming discriminative representations for retrieval. Subsequently, to propagate these factorized representations throughout the model for retrieval, we optimize a factor-level contrastive loss while distilling the decomposed representations into a deeper attention layer of the MLLM. Finally, for efficient inference, we retain the [EOS] token to establish a global-level embedding on top of these factorized latents, while we exploit the mean-pooled factorized latents to rerank a short candidate list at negligible cost, as both are produced by the same forward pass. Extensive evaluations demonstrate that FactEmbed outperforms prior works across CIR benchmarks.", "arxiv_id": "2611.05193", "arxiv_url": "https://arxiv.org/abs/2611.05193", "authors": ["WonJun Moon", "Seongchan Kim", "Dahun Kim", "Seungryong Kim"], "brief": "FactEmbed\u5c06\u7ec4\u5408\u67e5\u8be2\u7406\u89e3\u4e0e\u68c0\u7d22\u8868\u793a\u6784\u5efa\u89e3\u8026\uff0c\u7528\u76ee\u6807\u60f3\u8c61\u4efb\u52a1\u5f15\u5bfc\u5206\u89e3\u6f5c\u53d8\u91cf\u6355\u6349\u4fee\u6539\u540e\u7684\u89c6\u89c9\u8bed\u4e49\uff0c\u518d\u901a\u8fc7\u56e0\u5b50\u7ea7\u5bf9\u6bd4\u5b66\u4e60\u4e0e\u6ce8\u610f\u529b\u5c42\u84b8\u998f\u4f18\u5316\u68c0\u7d22\u3002", "categories": ["cs.CV", "cs.IR"], "github_repo": "https://github.com/cvlab-kaist/FactEmbed", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2611.05193", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u76ee\u6807\u60f3\u8c61\u4efb\u52a1\u4f7f\u5206\u89e3\u6f5c\u53d8\u91cf\u5bf9\u9f50\u76ee\u6807\u8bed\u4e49", "\u56e0\u5b50\u7ea7\u5bf9\u6bd4\u635f\u5931\u7ed3\u5408\u6df1\u5c42\u6ce8\u610f\u529b\u84b8\u998f", "\u5355\u6b21\u524d\u5411\u751f\u6210EOS\u68c0\u7d22\u8868\u793a\u4e0e\u5747\u503c\u6c60\u5316\u91cd\u6392\u8868\u793a"], "keywords": ["\u7ec4\u5408\u56fe\u50cf\u68c0\u7d22", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.05193v1", "published_at": "2026-11-03", "score": 0.301, "selected_reasons": ["HF trending (44\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05193.png", "title": "Factorized MLLM Embeddings for Composed Image Retrieval", "tldr": "\u901a\u8fc7\u5206\u89e3\u6f5c\u53d8\u91cf\u5148\u60f3\u8c61\u4fee\u6539\u540e\u7684\u76ee\u6807\u56fe\u50cf\uff0c\u518d\u6784\u5efa\u591a\u6a21\u6001\u68c0\u7d22\u8868\u793a\u3002", "upvotes": 44, "what_it_is": "FactEmbed\u5c06\u7ec4\u5408\u67e5\u8be2\u7406\u89e3\u4e0e\u68c0\u7d22\u8868\u793a\u6784\u5efa\u89e3\u8026\uff0c\u7528\u76ee\u6807\u60f3\u8c61\u4efb\u52a1\u5f15\u5bfc\u5206\u89e3\u6f5c\u53d8\u91cf\u6355\u6349\u4fee\u6539\u540e\u7684\u89c6\u89c9\u8bed\u4e49\uff0c\u518d\u901a\u8fc7\u56e0\u5b50\u7ea7\u5bf9\u6bd4\u5b66\u4e60\u4e0e\u6ce8\u610f\u529b\u5c42\u84b8\u998f\u4f18\u5316\u68c0\u7d22\u3002", "why_notable": "\u5176\u4ef7\u503c\u5728\u4e8e\u8ba9\u591a\u6a21\u6001\u6a21\u578b\u5148\u89e3\u6790\u89c6\u89c9\u4fee\u6539\uff0c\u518d\u5b66\u4e60\u68c0\u7d22\u8868\u793a\uff1b\u5728\u591a\u4e2a\u7ec4\u5408\u56fe\u50cf\u68c0\u7d22\u57fa\u51c6\u4e0a\u8d85\u8d8a\u65e2\u6709\u65b9\u6cd5\uff0c\u4e14\u91cd\u6392\u5f00\u9500\u5f88\u4f4e\u3002"}, {"abstract": "A robot generalist must interpret a scene, act on it, and satisfy every condition of a task. How far do frontier vision-language models (VLMs) meet these demands? We introduce Embodied Agent Arena, evaluating ten VLM agents across Geometry, Spatial Reasoning, Affordance, Task Planning, and Manipulation. Its 1,000 cases combine 32 established sources with GeoProbe, our 168-case benchmark for camera, motion, depth, and scale estimation. A minimal harness leaves task decisions to the model through source-native interfaces. Closed-weight models lead all five domains, whereas open-weight VLMs show useful spatial reasoning but substantially lower planning and manipulation success. Beneath these averages, similar geometric errors conceal different scale and shape distortions, and valid region estimates need not identify usable action points. During execution, agents can achieve early subgoals yet lose object control, bind an action to the wrong receiving region, or stop before the required physical state holds. Additional computation does not uniformly resolve these failures: code repair can restore execution without completing the task, while self-review can reverse correct judgments. Failure costs also differ: the strongest planners concentrate failed-token expenditure in prolonged body-control tasks, whereas other models fail broadly across procedures. Matched traces show how successful recovery uses feedback to restore a missing prerequisite and advance the remaining task.", "arxiv_id": "2610.00854", "arxiv_url": "https://arxiv.org/abs/2610.00854", "authors": ["Haojian Huang", "Pukun Zhao", "Zexi Li", "Yehang Zhang", "Yangkai Wei", "Wenqian Li", "Han Yang", "Kaiwen Zhou", "Ying-Cong Chen", "Yinchuan Li"], "brief": "\u7814\u7a76\u6784\u5efa\u5177\u8eab\u667a\u80fd\u4f53\u8bc4\u6d4b\u5e73\u53f0\uff0c\u4ee5\u6700\u5c0f\u6267\u884c\u6846\u67b6\u8ba9\u6a21\u578b\u901a\u8fc7\u539f\u751f\u63a5\u53e3\u81ea\u4e3b\u51b3\u7b56\uff0c\u6bd4\u8f83\u5341\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u51e0\u4f55\u3001\u7a7a\u95f4\u63a8\u7406\u3001\u53ef\u4f9b\u6027\u3001\u89c4\u5212\u4e0e\u64cd\u63a7\u4e0a\u7684\u8868\u73b0\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/embodied-agent-arena/embodied-agent-arena", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2610.00854", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["1000\u4f8b\u6574\u540832\u4e2a\u6765\u6e90\u53ca168\u4f8bGeoProbe", "\u95ed\u6e90\u6a21\u578b\u9886\u8dd1\u4e94\u9886\u57df\uff0c\u5f00\u6e90\u6a21\u578b\u89c4\u5212\u4e0e\u64cd\u63a7\u8f83\u5f31", "\u4ee3\u7801\u4fee\u590d\u4e0d\u4fdd\u8bc1\u4efb\u52a1\u5b8c\u6210\uff0c\u81ea\u6211\u590d\u5ba1\u53ef\u80fd\u63a8\u7ffb\u6b63\u786e\u5224\u65ad"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba\u64cd\u63a7", "\u4efb\u52a1\u89c4\u5212"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.00854v3", "published_at": "2026-10-01", "score": 0.293, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.00854.png", "title": "Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena", "tldr": "\u5343\u4f8b\u8bc4\u6d4b\u63ed\u793a\u524d\u6cbf\u89c6\u89c9\u8bed\u8a00\u667a\u80fd\u4f53\u5728\u51e0\u4f55\u7406\u89e3\u4e0e\u673a\u5668\u4eba\u4efb\u52a1\u6267\u884c\u95f4\u4ecd\u6709\u660e\u663e\u65ad\u5c42\u3002", "upvotes": 10, "what_it_is": "\u7814\u7a76\u6784\u5efa\u5177\u8eab\u667a\u80fd\u4f53\u8bc4\u6d4b\u5e73\u53f0\uff0c\u4ee5\u6700\u5c0f\u6267\u884c\u6846\u67b6\u8ba9\u6a21\u578b\u901a\u8fc7\u539f\u751f\u63a5\u53e3\u81ea\u4e3b\u51b3\u7b56\uff0c\u6bd4\u8f83\u5341\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u51e0\u4f55\u3001\u7a7a\u95f4\u63a8\u7406\u3001\u53ef\u4f9b\u6027\u3001\u89c4\u5212\u4e0e\u64cd\u63a7\u4e0a\u7684\u8868\u73b0\u3002", "why_notable": "\u8bc4\u6d4b\u5c06\u611f\u77e5\u5224\u65ad\u4e0e\u7269\u7406\u4efb\u52a1\u5b8c\u6210\u5206\u5f00\u68c0\u9a8c\uff0c\u63ed\u793a\u533a\u57df\u4f30\u8ba1\u6b63\u786e\u4e0d\u7b49\u4e8e\u52a8\u4f5c\u53ef\u7528\uff0c\u4e5f\u4e3a\u5b9a\u4f4d\u5931\u63a7\u3001\u76ee\u6807\u7ed1\u5b9a\u548c\u63d0\u524d\u7ec8\u6b62\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Unified Multimodal Models (UMMs) integrate visual understanding, generation, and editing within a single unified framework. However, existing unified multimodal datasets and benchmarks remain dominated by single-turn tasks. Even in recent multi-turn datasets, many turns can be solved independently without tracking information across turns. Consequently, they provide limited supervision and evaluation for multimodal stateful interaction, which requires models to understand, maintain, update, and faithfully realize evolving dialogue states across turns. To address this gap, we introduce YANAMI, the first large-scale multimodal dialogue dataset and benchmark for stateful interaction, comprising YANAMI-400K and YANAMI-Bench. YANAMI-400K contains 400K multi-turn multimodal dialogues, with more than 2M images and 2.6M dialogue turns. The dialogues span four representative scenarios: Multi-Image Fusion, Image Editing, World Modeling, and Visual Reasoning, and require models to continuously track, preserve, and revise evolving multimodal dialogue states across turns. YANAMI-Bench comprises 400 multi-turn dialogues for systematically evaluating multimodal stateful interaction. It jointly evaluates Dialogue State Understanding and Visual Realization, characterizing the gap between models\u0027 ability to understand evolving dialogue states and their ability to faithfully realize them in visual outputs. Experiments show that fine-tuning BAGEL on YANAMI-400K improves image editing, generation, and multimodal stateful interaction by 10.3%, 2.0%, and 13.23%, respectively, while preserving its general visual understanding capabilities. Evaluations on YANAMI-Bench further reveal that existing UMMs still struggle to maintain, update, and visually realize evolving multimodal dialogue states.", "arxiv_id": "2611.05280", "arxiv_url": "https://arxiv.org/abs/2611.05280", "authors": ["Shengyu Wang", "Tengyue Nong", "Junming Liu", "Haosong Peng", "Siyu Li", "Ruiqi Lei", "Fushuo Huo", "Yuhao Pan", "Yunfeng Fan", "Ding Wang", "Nan Cheng", "Haozhao Wang", "Wenchao Xu"], "brief": "\u63d0\u51fa\u591a\u6a21\u6001\u6709\u72b6\u6001\u4ea4\u4e92\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u8986\u76d6\u56fe\u50cf\u878d\u5408\u3001\u7f16\u8f91\u3001\u4e16\u754c\u5efa\u6a21\u548c\u89c6\u89c9\u63a8\u7406\u3002\u901a\u8fc7\u8de8\u8f6e\u72b6\u6001\u4f9d\u8d56\u8bad\u7ec3\u6a21\u578b\uff0c\u5e76\u5206\u522b\u8bc4\u4f30\u72b6\u6001\u7406\u89e3\u4e0e\u89c6\u89c9\u5b9e\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05280", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["YANAMI-400K\u542b40\u4e07\u5bf9\u8bdd\u3001\u8d85200\u4e07\u56fe\u50cf\u53ca260\u4e07\u8f6e\u6b21", "YANAMI-Bench\u7528400\u7ec4\u591a\u8f6e\u5bf9\u8bdd\u8bc4\u4f30\u72b6\u6001\u7406\u89e3\u4e0e\u89c6\u89c9\u5b9e\u73b0", "BAGEL\u5fae\u8c03\u540e\u7f16\u8f91\u63d0\u534710.3%\uff0c\u6709\u72b6\u6001\u4ea4\u4e92\u63d0\u534713.23%"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u591a\u8f6e\u5bf9\u8bdd", "\u72b6\u6001\u8ffd\u8e2a", "\u56fe\u50cf\u7f16\u8f91"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05280v1", "published_at": "2026-11-03", "score": 0.293, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05280.png", "title": "YANAMI: A Large-Scale Multimodal Dataset and Benchmark for Multiturn Stateful Interaction", "tldr": "\u7528\u5927\u89c4\u6a21\u591a\u8f6e\u56fe\u6587\u5bf9\u8bdd\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u6a21\u578b\u8ffd\u8e2a\u72b6\u6001\u3001\u4fdd\u6301\u89c6\u89c9\u8f93\u51fa\u4e00\u81f4\u6027\u7684\u80fd\u529b\u3002", "upvotes": 26, "what_it_is": "\u63d0\u51fa\u591a\u6a21\u6001\u6709\u72b6\u6001\u4ea4\u4e92\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u8986\u76d6\u56fe\u50cf\u878d\u5408\u3001\u7f16\u8f91\u3001\u4e16\u754c\u5efa\u6a21\u548c\u89c6\u89c9\u63a8\u7406\u3002\u901a\u8fc7\u8de8\u8f6e\u72b6\u6001\u4f9d\u8d56\u8bad\u7ec3\u6a21\u578b\uff0c\u5e76\u5206\u522b\u8bc4\u4f30\u72b6\u6001\u7406\u89e3\u4e0e\u89c6\u89c9\u5b9e\u73b0\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u91cd\u70b9\u4ece\u72ec\u7acb\u5355\u8f6e\u4efb\u52a1\u8f6c\u5411\u8de8\u8f6e\u72b6\u6001\u7ef4\u62a4\uff0c\u5e76\u533a\u5206\u7406\u89e3\u4e0e\u89c6\u89c9\u5b9e\u73b0\uff0c\u63ed\u793a\u6a21\u578b\u7406\u89e3\u53d8\u5316\u5374\u96be\u4ee5\u5fe0\u5b9e\u751f\u6210\u7684\u80fd\u529b\u7f3a\u53e3\u3002"}, {"abstract": "Psychotherapy clients may experience distress before they can coherently describe it, and their expression changes with emotion, perceived safety, and trust. Large language model-based client simulators often rely on clinically organized case descriptions, which can encourage responses explaining the client\u0027s difficulties more clearly than their current understanding warrants. We propose Pandora, a psychotherapy client simulation framework that models how psychological experience becomes situated, individual expression. Pandora updates psychological and relational states in response to therapist interventions, constructs subjective appraisals and attributions, and plans response content and strategy. A separate expression planner combines these decisions with language patterns distilled from the client\u0027s utterances to guide linguistic realization. We evaluate Pandora against five baselines on 115 cases from four counseling and motivational interviewing datasets. It achieves the highest expression similarity and overall disclosure-alignment score among the compared systems. In a four-evaluator study of 45 matched disclosure items, Pandora receives AI-like judgments in 7.2% of ratings, compared with 43.3--67.2% for the baselines and 35.6% without expression planning. The ablation also reduces expression similarity. These results support explicit expression planning in client simulation to improve alignment with individual language patterns and reduce perceived AI-like expression in the evaluated setting.", "arxiv_id": "2611.00617", "arxiv_url": "https://arxiv.org/abs/2611.00617", "authors": ["Mengxi Xiao", "Jingjing Chen", "Ziyan Kuang", "Jiarong Song", "Wenhao Zhao", "Zuchen Han", "Yihuai Xu", "Xiyang Huang", "Jie Gong", "Yuechen Jiang", "Xueqing Peng", "Yankai Chen", "Xiaoyan Qu", "Min Peng", "Qianqian Xie"], "brief": "Pandora\u6839\u636e\u54a8\u8be2\u5e08\u5e72\u9884\u66f4\u65b0\u5fc3\u7406\u4e0e\u5173\u7cfb\u72b6\u6001\uff0c\u5f62\u6210\u4e3b\u89c2\u8bc4\u4ef7\u5e76\u89c4\u5212\u56de\u5e94\u7b56\u7565\u3002\u72ec\u7acb\u8868\u8fbe\u89c4\u5212\u5668\u7ed3\u5408\u6765\u8bbf\u8005\u539f\u8bdd\u4e2d\u7684\u8bed\u8a00\u6a21\u5f0f\uff0c\u751f\u6210\u7b26\u5408\u5176\u5f53\u4e0b\u7406\u89e3\u7684\u8868\u8fbe\u3002", "categories": ["cs.HC"], "github_repo": "https://github.com/whunextgen/Pandora", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00617", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["Pandora\u5206\u79bb\u56de\u5e94\u51b3\u7b56\u4e0e\u4e2a\u4f53\u8bed\u8a00\u8868\u8fbe\u89c4\u5212", "\u57284\u4e2a\u6570\u636e\u96c6115\u4e2a\u6848\u4f8b\u4e0a\u5bf9\u6bd45\u79cd\u57fa\u7ebf", "AI\u611f\u5224\u5b9a\u73877.2%\uff0c\u53bb\u9664\u8868\u8fbe\u89c4\u5212\u540e35.6%"], "keywords": ["\u5fc3\u7406\u54a8\u8be2", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7528\u6237\u6a21\u62df", "\u4e2a\u6027\u5316\u8868\u8fbe"], "num_comments": 2, "on_hf": true, "organization": "CLAIN-WHU", "pdf_url": "https://arxiv.org/pdf/2611.00617v1", "published_at": "2026-10-31", "score": 0.293, "selected_reasons": ["HF trending (69\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00617.png", "title": "Words Caught in the Heart: Simulating Person-Specific Expression for Self-Opaque Clients in Psychotherapy", "tldr": "\u901a\u8fc7\u52a8\u6001\u5fc3\u7406\u72b6\u6001\u4e0e\u72ec\u7acb\u8868\u8fbe\u89c4\u5212\uff0c\u8ba9\u5fc3\u7406\u54a8\u8be2\u6765\u8bbf\u8005\u6a21\u62df\u66f4\u8d34\u8fd1\u4e2a\u4eba\u8868\u8fbe\u3002", "upvotes": 69, "what_it_is": "Pandora\u6839\u636e\u54a8\u8be2\u5e08\u5e72\u9884\u66f4\u65b0\u5fc3\u7406\u4e0e\u5173\u7cfb\u72b6\u6001\uff0c\u5f62\u6210\u4e3b\u89c2\u8bc4\u4ef7\u5e76\u89c4\u5212\u56de\u5e94\u7b56\u7565\u3002\u72ec\u7acb\u8868\u8fbe\u89c4\u5212\u5668\u7ed3\u5408\u6765\u8bbf\u8005\u539f\u8bdd\u4e2d\u7684\u8bed\u8a00\u6a21\u5f0f\uff0c\u751f\u6210\u7b26\u5408\u5176\u5f53\u4e0b\u7406\u89e3\u7684\u8868\u8fbe\u3002", "why_notable": "\u5c06\u6765\u8bbf\u8005\u7684\u8868\u8fbe\u80fd\u529b\u4e0e\u5fc3\u7406\u72b6\u6001\u3001\u4fe1\u4efb\u53d8\u5316\u5173\u8054\uff0c\u51cf\u5c11\u6a21\u62df\u56de\u5e94\u8fc7\u5ea6\u6e05\u6670\u7684\u95ee\u9898\uff0c\u4e3a\u66f4\u8d34\u8fd1\u4e2a\u4f53\u7684\u54a8\u8be2\u6a21\u62df\u63d0\u4f9b\u65b9\u6cd5\u3002"}, {"abstract": "The advancement of multimodal learning is heavily constrained by the scarcity and high annotation cost of high-quality instruction data. While raw videos offer an abundant and dynamic source of visual knowledge, transforming them into precise instruction data remains highly challenging. To bridge this gap, we present VidUEU-Agent, an automated pipeline that synthesizes instruction data from raw videos for multimodal understanding, editing, and unified tasks. VidUEU-Agent follows a four-stage pipeline: it performs global perception to filter low-quality shots, mines keyframes and multimodal signals, constructs metadata and routes the metadata to synthesize instruction samples. More importantly, our agent framework can autonomously iterate the data distribution based on downstream training results, thereby optimizing data quality, balance, and training effectiveness. Scaling this pipeline, we construct VidUEU-100K, a large-scale dataset of 100K training samples spanning multiple domains and tasks, providing a robust foundation for developing comprehensive multimodal capabilities. Extensive experiments demonstrate that fine-tuning baseline models on VidUEU-100K yields significant and consistent performance gains across diverse representative benchmarks, validating the effectiveness of our proposed agent framework and dataset.", "arxiv_id": "2611.04418", "arxiv_url": "https://arxiv.org/abs/2611.04418", "authors": ["Tengju Ru", "Weitong Lian", "Zecong Tang", "Lingyi Meng", "Haoran Li", "Zhejun Cui", "Yichen Zhu", "Hangshuo Cao", "Qi Kang", "Yechi Liu", "Kaixuan Wang", "Yu-Jie Yuan", "Chunwei Wang", "Yu Zhang", "Bo Dai"], "brief": "\u63d0\u51fa\u9762\u5411\u7406\u89e3\u3001\u7f16\u8f91\u53ca\u7edf\u4e00\u4efb\u52a1\u7684\u6570\u636e\u7b56\u5c55\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u5168\u5c40\u611f\u77e5\u3001\u5173\u952e\u5e27\u4e0e\u591a\u6a21\u6001\u4fe1\u53f7\u6316\u6398\u3001\u5143\u6570\u636e\u6784\u5efa\u548c\u8def\u7531\u751f\u6210\u6307\u4ee4\u6837\u672c\uff0c\u5e76\u7528\u4e0b\u6e38\u8bad\u7ec3\u53cd\u9988\u8c03\u6574\u6570\u636e\u5206\u5e03\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/LRuca/VidUEU-Agent", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2611.04418", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u56db\u9636\u6bb5\u6d41\u6c34\u7ebf\u5b8c\u6210\u89c6\u9891\u7b5b\u9009\u5230\u6307\u4ee4\u6837\u672c\u5408\u6210", "\u4f9d\u636e\u4e0b\u6e38\u8bad\u7ec3\u7ed3\u679c\u81ea\u4e3b\u8fed\u4ee3\u6570\u636e\u5206\u5e03", "\u6784\u5efaVidUEU-100K\uff0c\u542b10\u4e07\u6761\u8de8\u57df\u591a\u4efb\u52a1\u6837\u672c"], "keywords": ["\u591a\u6a21\u6001\u5b66\u4e60", "\u6307\u4ee4\u6570\u636e\u5408\u6210", "\u6570\u636e\u7b56\u5c55", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04418v1", "published_at": "2026-11-03", "score": 0.289, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04418.png", "title": "VidUEU-Agent: A Data-Curation Agent for Multimodal Understanding, Editing, and Unified Tasks", "tldr": "\u4ece\u539f\u59cb\u89c6\u9891\u81ea\u52a8\u5408\u6210\u591a\u6a21\u6001\u6307\u4ee4\u6570\u636e\uff0c\u5e76\u4f9d\u636e\u8bad\u7ec3\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u6570\u636e\u5206\u5e03\u3002", "upvotes": 23, "what_it_is": "\u63d0\u51fa\u9762\u5411\u7406\u89e3\u3001\u7f16\u8f91\u53ca\u7edf\u4e00\u4efb\u52a1\u7684\u6570\u636e\u7b56\u5c55\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u5168\u5c40\u611f\u77e5\u3001\u5173\u952e\u5e27\u4e0e\u591a\u6a21\u6001\u4fe1\u53f7\u6316\u6398\u3001\u5143\u6570\u636e\u6784\u5efa\u548c\u8def\u7531\u751f\u6210\u6307\u4ee4\u6837\u672c\uff0c\u5e76\u7528\u4e0b\u6e38\u8bad\u7ec3\u53cd\u9988\u8c03\u6574\u6570\u636e\u5206\u5e03\u3002", "why_notable": "\u5c06\u6570\u636e\u751f\u6210\u4e0e\u8bad\u7ec3\u53cd\u9988\u8fde\u63a5\u6210\u95ed\u73af\uff0c\u4e0d\u53ea\u8ffd\u6c42\u6837\u672c\u6570\u91cf\uff0c\u4e5f\u4f18\u5316\u8d28\u91cf\u548c\u5747\u8861\u6027\uff1b\u57fa\u7ebf\u6a21\u578b\u5fae\u8c03\u540e\u5728\u591a\u4e2a\u4ee3\u8868\u6027\u57fa\u51c6\u4e0a\u83b7\u5f97\u4e00\u81f4\u63d0\u5347\u3002"}, {"abstract": "Coding agents increasingly rely on automated approvers to decide whether a proposed shell command may run. Existing approvers, from rule-based checkers to guardrail models and deployed permission classifiers, base their decisions on the text of the request and command. Yet a command\u0027s behavior depends on the code it invokes and the state of the workspace, and systems that observe file changes leave the assessment to the agent or a human after execution. We present Caper, a consequence-aware approval mechanism that pre-executes each command in a snapshotted sandbox, provides an independent approver with a bounded report of its observed effects, commits allowed commands, and rolls back blocked ones with a reason the agent can act on. Compared with six existing systems, Caper achieves the lowest harmful-outcome rate on SABER (6.7% versus at least 14.8%) and YoloFS-Ext, a benchmark we build in which harmful behavior is hidden inside invoked tools (7.8% versus at least 35.3%), while blocking 1.0% of the safe twins of the dangerous tasks in YoloFS-Ext.", "arxiv_id": "2610.40753", "arxiv_url": "https://arxiv.org/abs/2610.40753", "authors": ["Weiheng Wu", "Junkai Chen", "Zhensu Sun", "Jieke Shi", "Yunbo Lyu", "David Lo"], "brief": "Caper\u5728\u5feb\u7167\u6c99\u7bb1\u4e2d\u9884\u6267\u884c\u547d\u4ee4\uff0c\u5c06\u89c2\u5bdf\u5230\u7684\u5f71\u54cd\u6574\u7406\u4e3a\u9650\u957f\u62a5\u544a\uff0c\u4ea4\u7ed9\u72ec\u7acb\u5ba1\u6279\u5668\u5224\u65ad\uff1b\u83b7\u51c6\u5219\u63d0\u4ea4\uff0c\u62d2\u7edd\u5219\u56de\u6eda\u5e76\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u7406\u7531\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": "https://github.com/wudaoz/Caper", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.40753", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5feb\u7167\u6c99\u7bb1\u9884\u6267\u884c\uff0c\u4ee5\u5b9e\u9645\u540e\u679c\u800c\u975e\u547d\u4ee4\u6587\u672c\u5ba1\u6279", "SABER\u6709\u5bb3\u7ed3\u679c\u73876.7%\uff0c\u516d\u4e2a\u5bf9\u7167\u5747\u226514.8%", "YoloFS-Ext\u6709\u5bb3\u73877.8%\uff0c\u5b89\u5168\u914d\u5bf9\u4efb\u52a1\u8bef\u62e61.0%"], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u5b89\u5168\u5ba1\u6279", "\u6c99\u7bb1\u6267\u884c", "\u56de\u6eda\u673a\u5236"], "num_comments": 2, "on_hf": true, "organization": "Singapore Management University", "pdf_url": "https://arxiv.org/pdf/2610.40753v1", "published_at": "2026-10-29", "score": 0.288, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40753.png", "title": "\"Shall We Approve?\" Consequence-Aware Approval for Autonomous Coding Agents", "tldr": "Caper\u901a\u8fc7\u6c99\u7bb1\u9884\u6267\u884c\u89c2\u5bdf\u547d\u4ee4\u540e\u679c\uff0c\u964d\u4f4e\u81ea\u4e3b\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u6709\u5bb3\u64cd\u4f5c\u7387\u3002", "upvotes": 12, "what_it_is": "Caper\u5728\u5feb\u7167\u6c99\u7bb1\u4e2d\u9884\u6267\u884c\u547d\u4ee4\uff0c\u5c06\u89c2\u5bdf\u5230\u7684\u5f71\u54cd\u6574\u7406\u4e3a\u9650\u957f\u62a5\u544a\uff0c\u4ea4\u7ed9\u72ec\u7acb\u5ba1\u6279\u5668\u5224\u65ad\uff1b\u83b7\u51c6\u5219\u63d0\u4ea4\uff0c\u62d2\u7edd\u5219\u56de\u6eda\u5e76\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u7406\u7531\u3002", "why_notable": "\u5b83\u5c06\u5ba1\u6279\u4f9d\u636e\u4ece\u547d\u4ee4\u8868\u9762\u8f6c\u5411\u5b9e\u9645\u6267\u884c\u540e\u679c\uff0c\u80fd\u8bc6\u522b\u85cf\u5728\u5de5\u5177\u5185\u90e8\u7684\u5371\u9669\u884c\u4e3a\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u4f4e\u7684\u5b89\u5168\u4efb\u52a1\u8bef\u62e6\u7387\u3002"}, {"abstract": "Molecular discovery requires navigating vast combinatorial search spaces while balancing competing biological objectives. AI agents can automate expert-defined molecular design protocols, but automation alone does not address how to optimize workflows for new tasks or improve their development through experience. Here we introduce MoLRSI, an AI agent that combines systematic optimization of workflows and model architectures with persistent cross-task memory to recursively improve its search policy for molecular discovery. Workflow performance, refinement outcomes, and execution feedback guide subsequent searches, allowing the agent to improve both its workflows and its strategy for developing them. We evaluate MoLRSI in two challenging molecular discovery settings that require balancing competing properties. In antibiotic discovery, MoLRSI developed a screening workflow balancing antibacterial activity, cytotoxicity and structural novelty, achieving an experimental hit rate of 15.9%, compared with 8.7% for a previous expert-led workflow using the same training data and screening library. In de novo peptide-MHC binder design, MoLRSI developed workflows that jointly consider target binding and specificity, producing eight experimentally validated hits against MART-1 and SARS-CoV-1 pMHCs with preferential binding over tested off-targets while Claude Science completely failed. These findings demonstrate how experience-guided workflow optimization can address competing discovery objectives while improving the search strategies used in subsequent campaigns.", "arxiv_id": "2610.39714", "arxiv_url": "https://arxiv.org/abs/2610.39714", "authors": ["Yikun Zhang", "Xiwei Cheng", "Mingze Yuan", "Yu Zhang", "Brian Shim", "Aarti Krishnan", "Daniel Rosen", "Kunyang Sun", "Yingze Wang", "Zhenfeng Deng", "Botao Yu", "Bingxu Liu", "David Liu", "Tianyu Liu", "Yuanqi Du", "Nir Hacohen", "James J. Collins", "Wengong Jin"], "brief": "MoLRSI\u8054\u5408\u4f18\u5316\u5de5\u4f5c\u6d41\u4e0e\u6a21\u578b\u67b6\u6784\uff0c\u5e76\u4fdd\u7559\u8de8\u4efb\u52a1\u8bb0\u5fc6\u3002\u5b83\u5229\u7528\u6d41\u7a0b\u8868\u73b0\u3001\u6539\u8fdb\u7ed3\u679c\u548c\u6267\u884c\u53cd\u9988\uff0c\u540c\u65f6\u66f4\u65b0\u5206\u5b50\u641c\u7d22\u6d41\u7a0b\u4e0e\u5f00\u53d1\u8fd9\u4e9b\u6d41\u7a0b\u7684\u7b56\u7565\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39714", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8de8\u4efb\u52a1\u8bb0\u5fc6\u9a71\u52a8\u5de5\u4f5c\u6d41\u3001\u6a21\u578b\u67b6\u6784\u53ca\u641c\u7d22\u7b56\u7565\u9012\u5f52\u4f18\u5316", "\u6297\u751f\u7d20\u5b9e\u9a8c\u547d\u4e2d\u738715.9%\uff0c\u4e13\u5bb6\u6d41\u7a0b\u4e3a8.7%", "\u80bd-MHC\u7ed3\u5408\u7269\u8bbe\u8ba1\u83b7\u5f978\u4e2a\u5b9e\u9a8c\u9a8c\u8bc1\u547d\u4e2d"], "keywords": ["\u667a\u80fd\u4f53", "\u5206\u5b50\u53d1\u73b0", "\u5de5\u4f5c\u6d41\u4f18\u5316", "\u8de8\u4efb\u52a1\u8bb0\u5fc6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.39714v2", "published_at": "2026-10-29", "score": 0.281, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39714.png", "title": "MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery", "tldr": "\u901a\u8fc7\u8de8\u4efb\u52a1\u8bb0\u5fc6\u9012\u5f52\u6539\u8fdb\u5206\u5b50\u53d1\u73b0\u6d41\u7a0b\uff0c\u5728\u6297\u751f\u7d20\u7b5b\u9009\u4e0e\u7ed3\u5408\u7269\u8bbe\u8ba1\u4e2d\u83b7\u5b9e\u9a8c\u9a8c\u8bc1\u3002", "upvotes": 16, "what_it_is": "MoLRSI\u8054\u5408\u4f18\u5316\u5de5\u4f5c\u6d41\u4e0e\u6a21\u578b\u67b6\u6784\uff0c\u5e76\u4fdd\u7559\u8de8\u4efb\u52a1\u8bb0\u5fc6\u3002\u5b83\u5229\u7528\u6d41\u7a0b\u8868\u73b0\u3001\u6539\u8fdb\u7ed3\u679c\u548c\u6267\u884c\u53cd\u9988\uff0c\u540c\u65f6\u66f4\u65b0\u5206\u5b50\u641c\u7d22\u6d41\u7a0b\u4e0e\u5f00\u53d1\u8fd9\u4e9b\u6d41\u7a0b\u7684\u7b56\u7565\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u4e0d\u4ec5\u81ea\u52a8\u6267\u884c\u8bbe\u8ba1\uff0c\u8fd8\u80fd\u7528\u7ecf\u9a8c\u6539\u8fdb\u8bbe\u8ba1\u6d41\u7a0b\u7684\u5f00\u53d1\u7b56\u7565\uff1b\u4e24\u7c7b\u5b9e\u9a8c\u4efb\u52a1\u663e\u793a\u5176\u53ef\u517c\u987e\u6d3b\u6027\u3001\u5b89\u5168\u6027\u6216\u7279\u5f02\u6027\u7b49\u7ade\u4e89\u76ee\u6807\u3002"}, {"abstract": "Robot foundation models have shown remarkable performance in robot control, yet adapting them to a new task still relies heavily on teleoperated demonstrations. Egocentric human videos offer a scalable substitute, but overlaying rendered robots on human videos or retargeting human poses into robot actions leaves significant visual or action gaps for high-DoF robot embodiments. To address this limitation, we propose RoboTryOn, which treats human-to-robot translation as virtual try-on: try-on keeps the person and swaps the garment, RoboTryOn keeps the demonstrated motion and swaps the human for the robot. Specifically, RoboTryOn converts a human video into a video of the target robot specified by a reference image, while preserving the original task, objects, and background. To maintain visual consistency, we translate selected keyframes autoregressively and use them to guide video synthesis with motion conditioned on the human hand skeleton. Additionally, we use an inverse dynamics model (IDM) that incorporates depth features to infer action labels from synthesized videos for policy learning. Our experiments across multiple humanoid embodiments show that policies trained with our synthetic data improve the average success rate on novel tasks, including challenging bimanual manipulation, from 2% to 60%, without any real robot demonstration of those tasks. Moreover, training with our synthetic data matches the performance of policies trained solely on teleoperated demonstrations at approximately a third of the collection cost, demonstrating the cost efficiency of our approach.", "arxiv_id": "2611.05163", "arxiv_url": "https://arxiv.org/abs/2611.05163", "authors": ["Seungyong Lee", "Suhyeok Jang", "Minyoung Kim", "Jinwoo Shin"], "brief": "RoboTryOn\u501f\u9274\u865a\u62df\u8bd5\u7a7f\uff0c\u7528\u53c2\u8003\u56fe\u6307\u5b9a\u7684\u673a\u5668\u4eba\u66ff\u6362\u89c6\u9891\u4e2d\u7684\u4eba\uff0c\u4fdd\u7559\u4efb\u52a1\u4e0e\u573a\u666f\uff1b\u7ed3\u5408\u624b\u90e8\u9aa8\u67b6\u5f15\u5bfc\u751f\u6210\u548c\u542b\u6df1\u5ea6\u7279\u5f81\u7684\u9006\u52a8\u529b\u5b66\u6a21\u578b\uff0c\u4ea7\u51fa\u5e26\u52a8\u4f5c\u6807\u7b7e\u7684\u8bad\u7ec3\u6570\u636e\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/ryan-seungyong-lee/RoboTryOn", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.05163", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u81ea\u56de\u5f52\u8f6c\u6362\u5173\u952e\u5e27\uff0c\u4ee5\u4eba\u624b\u9aa8\u67b6\u5f15\u5bfc\u89c6\u9891\u5408\u6210", "\u542b\u6df1\u5ea6\u7279\u5f81\u7684\u9006\u52a8\u529b\u5b66\u6a21\u578b\u63a8\u65ad\u52a8\u4f5c\u6807\u7b7e", "\u65b0\u4efb\u52a1\u5e73\u5747\u6210\u529f\u7387\u75312%\u5347\u81f360%\uff0c\u91c7\u96c6\u6210\u672c\u7ea6\u4e3a\u9065\u64cd\u4f5c\u7684\u4e09\u5206\u4e4b\u4e00"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u9891\u751f\u6210", "\u6a21\u4eff\u5b66\u4e60", "\u53cc\u624b\u64cd\u4f5c"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.05163v1", "published_at": "2026-11-03", "score": 0.267, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05163.png", "title": "RoboTryOn: Synthesizing Dexterous Robot Demonstrations from Human Videos via Virtual Try-On", "tldr": "\u5c06\u4eba\u7c7b\u64cd\u4f5c\u89c6\u9891\u8f6c\u4e3a\u673a\u5668\u4eba\u793a\u8303\uff0c\u65e0\u9700\u65b0\u4efb\u52a1\u771f\u673a\u6f14\u793a\u5373\u53ef\u63d0\u5347\u53cc\u624b\u64cd\u4f5c\u80fd\u529b\u3002", "upvotes": 6, "what_it_is": "RoboTryOn\u501f\u9274\u865a\u62df\u8bd5\u7a7f\uff0c\u7528\u53c2\u8003\u56fe\u6307\u5b9a\u7684\u673a\u5668\u4eba\u66ff\u6362\u89c6\u9891\u4e2d\u7684\u4eba\uff0c\u4fdd\u7559\u4efb\u52a1\u4e0e\u573a\u666f\uff1b\u7ed3\u5408\u624b\u90e8\u9aa8\u67b6\u5f15\u5bfc\u751f\u6210\u548c\u542b\u6df1\u5ea6\u7279\u5f81\u7684\u9006\u52a8\u529b\u5b66\u6a21\u578b\uff0c\u4ea7\u51fa\u5e26\u52a8\u4f5c\u6807\u7b7e\u7684\u8bad\u7ec3\u6570\u636e\u3002", "why_notable": "\u4e3a\u9ad8\u81ea\u7531\u5ea6\u673a\u5668\u4eba\u63d0\u4f9b\u53ef\u6269\u5c55\u7684\u4eba\u7c7b\u89c6\u9891\u793a\u8303\u6765\u6e90\uff0c\u5728\u65e0\u9700\u65b0\u4efb\u52a1\u771f\u673a\u6f14\u793a\u7684\u6761\u4ef6\u4e0b\u63d0\u5347\u64cd\u4f5c\u8868\u73b0\uff0c\u5e76\u4ee5\u66f4\u4f4e\u6210\u672c\u8fbe\u5230\u9065\u64cd\u4f5c\u6570\u636e\u8bad\u7ec3\u7684\u6c34\u5e73\u3002"}, {"abstract": "A robot world model that serves as a simulator must do more than generate plausible videos: it must faithfully follow commanded actions, maintain consistency across camera views, and sustain coherent long-horizon rollouts. We present PrimeSim, an action-conditioned, multiview world model simulator that addresses these challenges through progressive midtraining and posttraining. Starting from a pretrained video generator, we midtrain on 30,110 hours of robot demonstrations spanning 22 platforms. To improve action following, we introduce a unified cross-embodiment action representation and frame-aligned dual-path conditioning to strengthen action-frame correspondence. To maintain multiview consistency, we develop view-aware interleaved attention with explicit camera identities, enabling cross-view information exchange while preserving view-specific representations. We further introduce a fast-video, slow-memory posttraining framework that transforms the bidirectional video generator into an efficient autoregressive simulator. By combining fast causal generation, self-rollout training, and hierarchical temporal memory, PrimeSim mitigates error accumulation from self-generated histories and supports coherent long-horizon simulation. PrimeSim runs at 10.1 FPS, remains stable over long-horizon rollouts on rigid and deformable manipulation tasks, and transfers to held-out platforms within 100 to 200 gradient steps where the pretrained backbone does not. Against five open-source action-conditioned world models it leads four of the five WorldSimProbe suites and posts the best overall EWMBench score, while fine-grained local calibration still trails the field; its rollouts are faithful enough to support GRPO-based policy optimization. We release the model weights, inference code, and training code.", "arxiv_id": "2611.04870", "arxiv_url": "https://arxiv.org/abs/2611.04870", "authors": ["Travis Davies", "Wentao Ma", "Lihao Guo", "Tengfei Ma", "Xiaowen Chang", "Jiafeng Xu", "Shilong Wang", "Yiqi Deng", "Shaowen He", "Xiaoqi Li", "Qian Zhu", "Ran Cheng", "Hao Dong"], "brief": "PrimeSim\u4ece\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u5668\u51fa\u53d1\uff0c\u901a\u8fc7\u6e10\u8fdb\u5f0f\u4e2d\u95f4\u8bad\u7ec3\u4e0e\u540e\u8bad\u7ec3\u6784\u5efa\u52a8\u4f5c\u6761\u4ef6\u6a21\u62df\u5668\uff0c\u7ed3\u5408\u7edf\u4e00\u52a8\u4f5c\u8868\u793a\u3001\u591a\u89c6\u89d2\u6ce8\u610f\u529b\u548c\u5206\u5c42\u8bb0\u5fc6\uff0c\u5b9e\u73b0\u8de8\u673a\u5668\u4eba\u957f\u7a0b\u4eff\u771f\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04870", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4e2d\u95f4\u8bad\u7ec3\u8986\u76d622\u79cd\u5e73\u53f0\u300130110\u5c0f\u65f6\u673a\u5668\u4eba\u6f14\u793a", "\u53cc\u8def\u5f84\u6761\u4ef6\u5bf9\u9f50\u52a8\u4f5c\u4e0e\u5e27\uff0c\u89c6\u89d2\u611f\u77e5\u4ea4\u9519\u6ce8\u610f\u529b\u878d\u5408\u591a\u89c6\u89d2", "\u5feb\u89c6\u9891\u6162\u8bb0\u5fc6\u540e\u8bad\u7ec3\u652f\u6301\u81ea\u56de\u5f52\u4eff\u771f\uff0c\u901f\u5ea6\u8fbe10.1 FPS"], "keywords": ["\u673a\u5668\u4eba\u4eff\u771f", "\u4e16\u754c\u6a21\u578b", "\u8de8\u5177\u8eab\u5b66\u4e60", "\u89c6\u9891\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04870v1", "published_at": "2026-11-03", "score": 0.267, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04870.png", "title": "PrimeSim: A Generalist World Model Simulator from Large-Scale Cross-Embodiment Demonstrations", "tldr": "\u4ee5\u8de8\u5e73\u53f0\u673a\u5668\u4eba\u6f14\u793a\u8bad\u7ec3\u901a\u7528\u4e16\u754c\u6a21\u62df\u5668\uff0c\u517c\u987e\u52a8\u4f5c\u5fe0\u5b9e\u3001\u591a\u89c6\u89d2\u4e00\u81f4\u4e0e\u957f\u7a0b\u7a33\u5b9a\u3002", "upvotes": 9, "what_it_is": "PrimeSim\u4ece\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u5668\u51fa\u53d1\uff0c\u901a\u8fc7\u6e10\u8fdb\u5f0f\u4e2d\u95f4\u8bad\u7ec3\u4e0e\u540e\u8bad\u7ec3\u6784\u5efa\u52a8\u4f5c\u6761\u4ef6\u6a21\u62df\u5668\uff0c\u7ed3\u5408\u7edf\u4e00\u52a8\u4f5c\u8868\u793a\u3001\u591a\u89c6\u89d2\u6ce8\u610f\u529b\u548c\u5206\u5c42\u8bb0\u5fc6\uff0c\u5b9e\u73b0\u8de8\u673a\u5668\u4eba\u957f\u7a0b\u4eff\u771f\u3002", "why_notable": "\u5728\u4e94\u9879WorldSimProbe\u5957\u4ef6\u4e2d\u9886\u5148\u56db\u9879\uff0c\u4e14\u80fd\u652f\u6491GRPO\u7b56\u7565\u4f18\u5316\uff0c\u5c55\u793a\u4eff\u771f\u8bad\u7ec3\u4ef7\u503c\uff1b\u4f46\u7ec6\u7c92\u5ea6\u5c40\u90e8\u6821\u51c6\u4ecd\u843d\u540e\u3002"}, {"abstract": "LLM-based multi-agent systems (MAS) rely on collaboration among specialized agents to solve complex tasks. Existing methods improve MAS by refining the prompts, skills, and execution strategies of individual agents based on task feedback. However, improving individual agents does not necessarily lead to better team collaboration. Recent studies have therefore extended evolution to the collaboration level, using collective execution experience to adjust team organization, and inter-agent interactions. Nevertheless, evolving collaboration across heterogeneous tasks remains challenging, as existing approaches often constrain team reorganization within a shared structure and reuse interaction rules across incompatible team contexts. In this paper, we propose EvoTeam, a collaboration-centric evolution framework that jointly evolves team organization, interaction rules, and individual agent skills through execution experience. It maintains a library of reusable teams, selecting or creating agent teams and guiding collaboration through team-specific interaction rules. Collaboration experience accumulates within compatible team contexts, while individual skills remain reusable across teams. Experiments across four benchmarks demonstrate its effectiveness. Our code is available at https://github.com/DEEP-JLU/EvoTeam.", "arxiv_id": "2610.39813", "arxiv_url": "https://arxiv.org/abs/2610.39813", "authors": ["Qinuo Cao", "Xin He", "Dianxuan Fu", "Lizhi Zhang", "Zhaoqing Xing", "Jiapu Wang", "Xin Wang", "Na Zou", "Yi Chang", "Qinggang Zhang"], "brief": "EvoTeam\u4ee5\u6267\u884c\u7ecf\u9a8c\u9a71\u52a8\u534f\u4f5c\u6f14\u5316\uff0c\u7ef4\u62a4\u53ef\u590d\u7528\u56e2\u961f\u5e93\uff0c\u6309\u4efb\u52a1\u9009\u62e9\u6216\u521b\u5efa\u56e2\u961f\u3002\u56e2\u961f\u4f7f\u7528\u4e13\u5c5e\u4ea4\u4e92\u89c4\u5219\uff0c\u534f\u4f5c\u7ecf\u9a8c\u5728\u517c\u5bb9\u60c5\u5883\u5185\u79ef\u7d2f\uff0c\u4e2a\u4f53\u6280\u80fd\u5219\u53ef\u8de8\u56e2\u961f\u590d\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39813", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8054\u5408\u6f14\u5316\u56e2\u961f\u7ec4\u7ec7\u3001\u4ea4\u4e92\u89c4\u5219\u548c\u4e2a\u4f53\u6280\u80fd", "\u53ef\u590d\u7528\u56e2\u961f\u5e93\u652f\u6301\u56e2\u961f\u9009\u62e9\u4e0e\u521b\u5efa", "\u57284\u4e2a\u57fa\u51c6\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027\uff0c\u4ee3\u7801\u5df2\u5f00\u6e90"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u534f\u4f5c\u6f14\u5316", "\u56e2\u961f\u7ec4\u7ec7", "\u6280\u80fd\u590d\u7528"], "num_comments": 2, "on_hf": true, "organization": "DEEP Group at Jilin University", "pdf_url": "https://arxiv.org/pdf/2610.39813v2", "published_at": "2026-10-29", "score": 0.265, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39813.png", "title": "EvoTeam: Multi-Agent Collaboration via Evolving Teams", "tldr": "\u901a\u8fc7\u8054\u5408\u6f14\u5316\u56e2\u961f\u7ed3\u6784\u3001\u4ea4\u4e92\u89c4\u5219\u4e0e\u667a\u80fd\u4f53\u6280\u80fd\uff0c\u6539\u5584\u5f02\u6784\u4efb\u52a1\u4e2d\u7684\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3002", "upvotes": 23, "what_it_is": "EvoTeam\u4ee5\u6267\u884c\u7ecf\u9a8c\u9a71\u52a8\u534f\u4f5c\u6f14\u5316\uff0c\u7ef4\u62a4\u53ef\u590d\u7528\u56e2\u961f\u5e93\uff0c\u6309\u4efb\u52a1\u9009\u62e9\u6216\u521b\u5efa\u56e2\u961f\u3002\u56e2\u961f\u4f7f\u7528\u4e13\u5c5e\u4ea4\u4e92\u89c4\u5219\uff0c\u534f\u4f5c\u7ecf\u9a8c\u5728\u517c\u5bb9\u60c5\u5883\u5185\u79ef\u7d2f\uff0c\u4e2a\u4f53\u6280\u80fd\u5219\u53ef\u8de8\u56e2\u961f\u590d\u7528\u3002", "why_notable": "\u5c06\u4f18\u5316\u91cd\u5fc3\u4ece\u5355\u4e2a\u667a\u80fd\u4f53\u8f6c\u5411\u56e2\u961f\u534f\u4f5c\uff0c\u907f\u514d\u4e0d\u540c\u56e2\u961f\u673a\u68b0\u5171\u7528\u4ea4\u4e92\u89c4\u5219\uff0c\u4e3a\u5f02\u6784\u4efb\u52a1\u4e0b\u7684\u7ecf\u9a8c\u79ef\u7d2f\u4e0e\u6280\u80fd\u590d\u7528\u63d0\u4f9b\u6846\u67b6\u3002"}, {"abstract": "Software development sessions often involve several unfinished tasks rather than one issue carried through to completion. As coding agents take on repository-level development, they need to recover an earlier task\u0027s requirements and partial progress after intervening work. Existing repository-level benchmarks typically score one issue-to-patch episode and do not directly measure whether an agent can resume a task after advancing other unfinished work in the same repository. We introduce \\textbf{\\ourmethod}, a benchmark for focus-task resumption in sessions that interleave unfinished tasks drawn from the same source repository, with a persistent checkout for each task. Each focus task is evaluated in matched uninterrupted and switched sessions with identical focus requirements and executable verifiers. The switched session interleaves ordered stages from other unfinished tasks in the same repository, while only the final focus patch is scored. \\ourmethod~contains 200 focus tasks from 19 Python repositories, reconstructed from issue, pull-request, and review histories and rendered as 400 matched session specifications. Across 7 coding agents, interleaved unfinished work produces an average focus-task resolution gap of 11.5 percentage points, ranging from 6.0 to 15.0 percentage points. Trajectory analysis identifies cross-task requirement confusion and loss of task state as recurrent resumption behaviors. We introduce a plug-in context-management module that selects task-relevant history and maintains concise task-state summaries. On OpenCode, the module improves focus-task completion under same-repository task switching by 5.5 to 15.5 percentage points across the evaluated models. Code is available at github.com/Miraclecsc/Switch-SWE.", "arxiv_id": "2611.02017", "arxiv_url": "https://arxiv.org/abs/2611.02017", "authors": ["Shuochen Chang", "Qianli Ma", "Yibo Miao", "Qingyang Liu", "Bingjie Gao", "Haonan Zhao", "Siyu Sun", "Yulin Sun", "Han Zhao", "Jiangtong Li"], "brief": "\u6784\u5efa\u540c\u4ed3\u5e93\u672a\u5b8c\u6210\u4efb\u52a1\u4ea4\u9519\u6267\u884c\u7684\u57fa\u51c6\uff0c\u4ee5\u914d\u5bf9\u4f1a\u8bdd\u6bd4\u8f83\u8fde\u7eed\u6267\u884c\u4e0e\u5207\u6362\u540e\u6062\u590d\u7684\u6548\u679c\uff1b\u53e6\u7528\u63d2\u4ef6\u7b5b\u9009\u4efb\u52a1\u76f8\u5173\u5386\u53f2\u3001\u7ef4\u62a4\u72b6\u6001\u6458\u8981\uff0c\u6539\u5584\u6062\u590d\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Miraclecsc/Switch-SWE", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2611.02017", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["Switch-SWE\u542b19\u4e2aPython\u4ed3\u5e93\u7684200\u9879\u4efb\u52a1\u3001400\u7ec4\u4f1a\u8bdd\u89c4\u683c", "7\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\u5207\u6362\u540e\u5e73\u5747\u89e3\u51b3\u7387\u4e0b\u964d11.5\u4e2a\u767e\u5206\u70b9", "\u4e0a\u4e0b\u6587\u7ba1\u7406\u63d2\u4ef6\u4f7fOpenCode\u5b8c\u6210\u7387\u63d0\u53475.5\u81f315.5\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u4efb\u52a1\u5207\u6362", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u8f6f\u4ef6\u5de5\u7a0b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.02017v1", "published_at": "2026-11-01", "score": 0.261, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02017.png", "title": "Switch-SWE: Do Coding Agents Hold Focus When Switching Between Unfinished Tasks?", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u5207\u6362\u672a\u5b8c\u6210\u4efb\u52a1\u540e\u6210\u529f\u7387\u4e0b\u964d\uff0c\u7b5b\u9009\u5386\u53f2\u4e0e\u72b6\u6001\u6458\u8981\u53ef\u6539\u5584\u4efb\u52a1\u6062\u590d\u3002", "upvotes": 6, "what_it_is": "\u6784\u5efa\u540c\u4ed3\u5e93\u672a\u5b8c\u6210\u4efb\u52a1\u4ea4\u9519\u6267\u884c\u7684\u57fa\u51c6\uff0c\u4ee5\u914d\u5bf9\u4f1a\u8bdd\u6bd4\u8f83\u8fde\u7eed\u6267\u884c\u4e0e\u5207\u6362\u540e\u6062\u590d\u7684\u6548\u679c\uff1b\u53e6\u7528\u63d2\u4ef6\u7b5b\u9009\u4efb\u52a1\u76f8\u5173\u5386\u53f2\u3001\u7ef4\u62a4\u72b6\u6001\u6458\u8981\uff0c\u6539\u5584\u6062\u590d\u8868\u73b0\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u5355\u6b21\u4fee\u590d\u6269\u5c55\u5230\u591a\u4efb\u52a1\u6062\u590d\uff0c\u91cf\u5316\u9700\u6c42\u6df7\u6dc6\u4e0e\u72b6\u6001\u4e22\u5931\u7684\u4ee3\u4ef7\uff0c\u5e76\u5c55\u793a\u8f7b\u91cf\u4e0a\u4e0b\u6587\u7ba1\u7406\u7684\u6539\u5584\u6f5c\u529b\u3002"}, {"abstract": "Among 291 surveyed open-weight language model repositories (280 distinct embedding tables), 52.6% of untied gated and hybrid checkpoints (20/38) contain reachable input embeddings with norms below $10^{-6}$, compared with 0% of weight-tied models. Such near-zero rows can arise during pretraining when unseen rare or template tokens receive zero input gradients while AdamW weight decay shrinks untied embeddings. In tested Transformer configurations, non-initial positions or a BOS token prevent this failure mode. In gated sequence models (Mamba, Gated DeltaNet, xLSTM), a near-zero token can amplify input-embedding gradients by more than 30 orders of magnitude (up to 35). At zero input, current-token readout factors (SiLU gates or linear queries) vanish, suppressing historical-state readout. Residual RMS values can then fall below the square root of the RMSNorm floor across consecutive layers, causing Pre-RMSNorm to amplify backward gradients by up to $10^3$ per layer. When a gradient entry exceeds $1.84 \\times 10^{19}$, FP32 global-norm clipping in PyTorch, Hugging Face Trainer, and FSDP2 can overflow to infinity and zero the current batch\u0027s gradients. In Telugu continual pretraining of Nemotron-3-Nano-4B, this discards updates on approximately 20% of steps and leaves triggered rows frozen. We propose two remedies. For released checkpoints, GroupClip decouples input-embedding clipping using a 64-bit or rescaled norm; its rescaled implementation eliminates update loss and heals triggered rows in one step with negligible measured end-to-end overhead. For pretraining, GateFloor ($\\mathrm{SiLU}(z) + \u03b4$, $\u03b4\\in [0.01, 0.1]$) keeps the gate positive at zero input, reducing near-zero gradients by 28 orders of magnitude in experiments up to 370M parameters, with perplexity comparable to the baseline.", "arxiv_id": "2611.04449", "arxiv_url": "https://arxiv.org/abs/2611.04449", "authors": ["Xin Liu", "Boyuan Sun", "Yuxin Wang", "Haoran Song", "Mingjian Zhao", "Mengyu Liu"], "brief": "\u7814\u7a76\u5b9a\u4f4d\u4e86\u95e8\u63a7\u5e8f\u5217\u6a21\u578b\u4e2d\u8fd1\u96f6\u8bcd\u5d4c\u5165\u5f15\u53d1\u7684\u8bad\u7ec3\u505c\u6ede\uff1a\u95e8\u63a7\u8bfb\u51fa\u5931\u6548\u540e\uff0c\u591a\u5c42\u5f52\u4e00\u5316\u653e\u5927\u68af\u5ea6\u5e76\u4f7f\u88c1\u526a\u6ea2\u51fa\u3002\u63d0\u51fa\u5206\u7ec4\u88c1\u526a\u4e0e\u95e8\u63a7\u4e0b\u9650\u4e24\u79cd\u4fee\u590d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04449", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8c03\u67e5291\u4e2a\u4ed3\u5e93\uff0c\u672a\u7ed1\u5b9a\u95e8\u63a7\u53ca\u6df7\u5408\u68c0\u67e5\u70b9\u4e2d52.6%\u5b58\u5728\u8fd1\u96f6\u5d4c\u5165", "GroupClip\u6d88\u9664\u66f4\u65b0\u4e22\u5931\uff0c\u5e76\u5728\u4e00\u6b65\u5185\u4fee\u590d\u89e6\u53d1\u884c", "GateFloor\u5c06\u8fd1\u96f6\u8f93\u5165\u68af\u5ea6\u964d\u4f4e28\u4e2a\u6570\u91cf\u7ea7\uff0c\u56f0\u60d1\u5ea6\u4fdd\u6301\u76f8\u5f53"], "keywords": ["\u95e8\u63a7\u5e8f\u5217\u6a21\u578b", "\u8bcd\u5d4c\u5165", "\u68af\u5ea6\u88c1\u526a", "\u6570\u503c\u7a33\u5b9a\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04449v1", "published_at": "2026-11-03", "score": 0.261, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04449.png", "title": "Near-Zero Token Embeddings Silently Stall Training in Gated Sequence Models", "tldr": "\u8fd1\u96f6\u8bcd\u5d4c\u5165\u53ef\u4f7f\u95e8\u63a7\u6a21\u578b\u68af\u5ea6\u6ea2\u51fa\u5e76\u4e22\u5931\u66f4\u65b0\uff0c\u5206\u7ec4\u88c1\u526a\u4e0e\u95e8\u63a7\u4e0b\u9650\u80fd\u4fee\u590d", "upvotes": 7, "what_it_is": "\u7814\u7a76\u5b9a\u4f4d\u4e86\u95e8\u63a7\u5e8f\u5217\u6a21\u578b\u4e2d\u8fd1\u96f6\u8bcd\u5d4c\u5165\u5f15\u53d1\u7684\u8bad\u7ec3\u505c\u6ede\uff1a\u95e8\u63a7\u8bfb\u51fa\u5931\u6548\u540e\uff0c\u591a\u5c42\u5f52\u4e00\u5316\u653e\u5927\u68af\u5ea6\u5e76\u4f7f\u88c1\u526a\u6ea2\u51fa\u3002\u63d0\u51fa\u5206\u7ec4\u88c1\u526a\u4e0e\u95e8\u63a7\u4e0b\u9650\u4e24\u79cd\u4fee\u590d\u3002", "why_notable": "\u63ed\u793a\u4e86\u6570\u503c\u5f02\u5e38\u5982\u4f55\u9759\u9ed8\u53d8\u6210\u8bad\u7ec3\u66f4\u65b0\u4e22\u5931\uff0c\u5b9e\u6d4b\u6301\u7eed\u9884\u8bad\u7ec3\u7ea620%\u7684\u6b65\u9aa4\u53d7\u5f71\u54cd\uff1b\u4fee\u590d\u65b9\u6848\u517c\u987e\u5df2\u53d1\u5e03\u6a21\u578b\u4e0e\u9884\u8bad\u7ec3\u3002"}, {"abstract": "Long-horizon terminal tasks are used to evaluate and train agents. Human-curated datasets are scarce, so many synthesis methods have emerged. They usually measure the length of a task by the turns a model needs to pass it, and its difficulty by labels the LLM sets during generation. We find, however, that the turn count largely reflects the habits of the model, not only the demands of the task, and that the labels barely track how often models pass. We describe a terminal task by its work, the number of operations it requires, and its depth, the number of turns that must happen in sequence because the commands of each turn can only be chosen after reading the output of the previous one. Estimating depth as the smallest turn cap, stated to the agent, under which the task passes, we audit 734 tasks from six existing datasets. Synthesis has mostly added work, not depth: 94% of the solved synthetic tasks pass within three turns, yet depth, unlike the turn count, predicts difficulty beyond work. We propose DEPTH, in which a generation agent writes each task one segment at a time in a real software environment, carrying out each segment before writing it and starting the next from the state it leaves. Our 105 tasks exceed every audited dataset in depth and work, and none of six current models passes half of them. Fine-tuning Qwen3-8B on runs from these tasks improves it on two terminal benchmarks.", "arxiv_id": "2611.01927", "arxiv_url": "https://arxiv.org/abs/2611.01927", "authors": ["Yu Jiang", "Yue Huang", "Hang Hua", "Yuyang Wu", "Zixuan Weng", "Olexandr Isayev", "Yue Zhao", "Zinan Lin", "Xiangliang Zhang"], "brief": "\u7814\u7a76\u5c06\u7ec8\u7aef\u4efb\u52a1\u62c6\u4e3a\u64cd\u4f5c\u91cf\u4e0e\u987a\u5e8f\u4ea4\u4e92\u6df1\u5ea6\uff0c\u4ee5\u80fd\u6210\u529f\u5b8c\u6210\u4efb\u52a1\u7684\u6700\u5c0f\u8f6e\u6570\u4e0a\u9650\u4f30\u8ba1\u6df1\u5ea6\u3002DEPTH\u8ba9\u751f\u6210\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u73af\u5883\u4e2d\u9010\u6bb5\u6267\u884c\u3001\u7eed\u5199\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/AlanRosston/Depth", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.01927", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5ba1\u8ba16\u4e2a\u6570\u636e\u96c6734\u9879\u4efb\u52a1\uff0c\u5df2\u89e3\u5408\u6210\u4efb\u52a194%\u4e09\u8f6e\u5185\u901a\u8fc7", "DEPTH\u751f\u6210105\u9879\u4efb\u52a1\uff0c\u6df1\u5ea6\u4e0e\u64cd\u4f5c\u91cf\u5747\u8d85\u88ab\u5ba1\u8ba1\u6570\u636e\u96c6", "6\u4e2a\u6a21\u578b\u901a\u8fc7\u7387\u5747\u4e0d\u8db350%\uff1b\u5fae\u8c03Qwen3-8B\u63d0\u5347\u4e24\u9879\u57fa\u51c6\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u4f30", "\u7ec8\u7aef\u4efb\u52a1", "\u4efb\u52a1\u5408\u6210", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01927v1", "published_at": "2026-11-01", "score": 0.257, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01927.png", "title": "Is Your Long-Horizon Benchmark Really Deep? Measuring and Synthesizing Depth in Terminal Tasks", "tldr": "\u7528\u4e0d\u53ef\u5e76\u884c\u7684\u4ea4\u4e92\u6df1\u5ea6\u8861\u91cf\u7ec8\u7aef\u4efb\u52a1\uff0c\u63ed\u793a\u73b0\u6709\u5408\u6210\u57fa\u51c6\u504f\u6d45\u5e76\u751f\u6210\u66f4\u6df1\u4efb\u52a1\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5c06\u7ec8\u7aef\u4efb\u52a1\u62c6\u4e3a\u64cd\u4f5c\u91cf\u4e0e\u987a\u5e8f\u4ea4\u4e92\u6df1\u5ea6\uff0c\u4ee5\u80fd\u6210\u529f\u5b8c\u6210\u4efb\u52a1\u7684\u6700\u5c0f\u8f6e\u6570\u4e0a\u9650\u4f30\u8ba1\u6df1\u5ea6\u3002DEPTH\u8ba9\u751f\u6210\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u73af\u5883\u4e2d\u9010\u6bb5\u6267\u884c\u3001\u7eed\u5199\u4efb\u52a1\u3002", "why_notable": "\u628a\u4efb\u52a1\u672c\u8eab\u7684\u987a\u5e8f\u4f9d\u8d56\u4e0e\u6a21\u578b\u4ea4\u4e92\u4e60\u60ef\u533a\u5206\u5f00\uff0c\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u957f\u7a0b\u80fd\u529b\u8bc4\u4f30\u5c3a\u5ea6\uff0c\u4e5f\u5c55\u793a\u6df1\u4efb\u52a1\u5408\u6210\u53ef\u7528\u4e8e\u63d0\u5347\u7ec8\u7aef\u667a\u80fd\u4f53\u3002"}, {"abstract": "On-policy Self-distillation (OPSD) has proven effective for post-training large language models by constructing a teacher conditioned on privileged references. However, existing approaches keep the teacher fixed either throughout training by consistently exposing it to the full reference, or within each response by adaptively varying partial reference exposure only across responses. In this paper, we argue that neither of them is sufficient. Instead, every token needs its own teacher, as the teacher preference can vary token by token within the same response. Through a teacher-intervention pilot study, we validate that the teacher preference differs across tokens, and reveal that a preferred teacher can be identified for each token through majority voting and KL-based selection. Motivated by these findings, we propose Multi-teacher Adaptive On-policy Self-Distillation (MTA-OPSD), the first token-level adaptive OPSD method. Our method constructs a multi-teacher pool consisting of candidate teachers, and enables every token to adaptively select its preferred teacher during training. Experiments with Qwen3 models on mathematical reasoning tasks show that MTA-OPSD consistently outperforms existing OPSD approaches with an average gain of up to $+5.9$ over the base model, highlighting the importance of adapting teacher supervision at the token level. The code is available at https://github.com/xingzhejun/MTA-OPSD.", "arxiv_id": "2610.40574", "arxiv_url": "https://arxiv.org/abs/2610.40574", "authors": ["Yifu Luo", "Chuang Ma", "Zeyu Chen", "Enkelejda Kasneci", "Qi Chen", "Gjergji Kasneci"], "brief": "\u63d0\u51faMTA-OPSD\uff0c\u4ece\u4e0d\u540c\u53c2\u8003\u4fe1\u606f\u6761\u4ef6\u4e0b\u7684\u5019\u9009\u6559\u5e08\u6784\u5efa\u6559\u5e08\u6c60\uff0c\u8ba9\u6a21\u578b\u5728\u540c\u4e00\u56de\u7b54\u5185\u4e3a\u6bcf\u4e2a\u8bcd\u5143\u81ea\u9002\u5e94\u9009\u62e9\u6559\u5e08\uff0c\u800c\u975e\u6574\u6bb5\u5171\u7528\u56fa\u5b9a\u76d1\u7763\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/xingzhejun/MTA-OPSD", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.40574", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6559\u5e08\u5e72\u9884\u5b9e\u9a8c\u9a8c\u8bc1\u540c\u4e00\u56de\u7b54\u5185\u8bcd\u5143\u7684\u6559\u5e08\u504f\u597d\u4e0d\u540c", "\u901a\u8fc7\u591a\u6570\u6295\u7968\u4e0eKL\u51c6\u5219\u8bc6\u522b\u8bcd\u5143\u504f\u597d\u7684\u6559\u5e08", "Qwen3\u6570\u5b66\u63a8\u7406\u5b9e\u9a8c\u8f83\u57fa\u5ea7\u5e73\u5747\u589e\u76ca\u6700\u9ad8\u8fbe+5.9"], "keywords": ["\u81ea\u84b8\u998f", "\u591a\u6559\u5e08\u5b66\u4e60", "\u5927\u6a21\u578b\u540e\u8bad\u7ec3", "\u6570\u5b66\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Technical University of Munich", "pdf_url": "https://arxiv.org/pdf/2610.40574v1", "published_at": "2026-10-29", "score": 0.254, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40574.png", "title": "Every Token Needs Its Own Teacher: Multi-teacher Adaptive On-policy Self-distillation", "tldr": "\u8ba9\u6bcf\u4e2a\u8bcd\u5143\u81ea\u9002\u5e94\u9009\u62e9\u6559\u5e08\uff0c\u4e3a\u5927\u6a21\u578b\u6570\u5b66\u63a8\u7406\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u7684\u84b8\u998f\u76d1\u7763\u3002", "upvotes": 9, "what_it_is": "\u63d0\u51faMTA-OPSD\uff0c\u4ece\u4e0d\u540c\u53c2\u8003\u4fe1\u606f\u6761\u4ef6\u4e0b\u7684\u5019\u9009\u6559\u5e08\u6784\u5efa\u6559\u5e08\u6c60\uff0c\u8ba9\u6a21\u578b\u5728\u540c\u4e00\u56de\u7b54\u5185\u4e3a\u6bcf\u4e2a\u8bcd\u5143\u81ea\u9002\u5e94\u9009\u62e9\u6559\u5e08\uff0c\u800c\u975e\u6574\u6bb5\u5171\u7528\u56fa\u5b9a\u76d1\u7763\u3002", "why_notable": "\u5c06\u81ea\u84b8\u998f\u7684\u6559\u5e08\u9002\u914d\u4ece\u56de\u7b54\u7ea7\u63a8\u8fdb\u5230\u8bcd\u5143\u7ea7\uff0c\u5e76\u5728\u6570\u5b66\u63a8\u7406\u4e2d\u6301\u7eed\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\uff0c\u8868\u660e\u76d1\u7763\u7c92\u5ea6\u672c\u8eab\u662f\u540e\u8bad\u7ec3\u7684\u91cd\u8981\u8bbe\u8ba1\u53d8\u91cf\u3002"}, {"abstract": "Visual agents need to coordinate reasoning and action while their environment evolves during inference. We introduce LOLPlay, a benchmark in native \\emph{League of Legends} with 36 champion-specific tasks spanning resource management, combat, cooperation, and objectives. Agents interact through screenshots and mouse--keyboard actions; automated initialization and 82 executable subgoal checks distinguish partial progress from completion. Across 324 task evaluations of three models at three reasoning-effort settings, GPT-6 Astra achieves the highest task success rate of 25.0\\% at low and medium effort, and the highest subgoal success rate of 40.3\\% at medium effort. However, high effort improves neither metric over low effort for any model. For Astra, longer requests leave fewer interaction rounds, suggesting a cost to additional reasoning in real-time control. Trajectories reveal incomplete subgoal composition and actions executing after the observed scene changes, motivating agents that combine visual reasoning with timely action.", "arxiv_id": "2611.03685", "arxiv_url": "https://arxiv.org/abs/2611.03685", "authors": ["Zhaojian Yu"], "brief": "LOLPlay\u5728\u539f\u751f\u82f1\u96c4\u8054\u76df\u4e2d\u8bbe\u7f6e\u82f1\u96c4\u4e13\u5c5e\u4efb\u52a1\uff0c\u8ba9\u667a\u80fd\u4f53\u901a\u8fc7\u622a\u56fe\u548c\u9f20\u6807\u952e\u76d8\u64cd\u4f5c\u4ea4\u4e92\uff0c\u5e76\u7528\u81ea\u52a8\u521d\u59cb\u5316\u4e0e\u53ef\u6267\u884c\u5b50\u76ee\u6807\u68c0\u67e5\u533a\u5206\u5c40\u90e8\u8fdb\u5c55\u548c\u5b8c\u6574\u6210\u529f\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": "https://github.com/answers111/LOLPlay", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.03685", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["36\u9879\u82f1\u96c4\u4e13\u5c5e\u4efb\u52a1\uff0c\u914d\u595782\u9879\u53ef\u6267\u884c\u5b50\u76ee\u6807\u68c0\u67e5", "324\u6b21\u8bc4\u6d4b\u8986\u76d63\u4e2a\u6a21\u578b\u53ca3\u6863\u63a8\u7406\u6295\u5165", "Astra\u4efb\u52a1\u6210\u529f\u7387\u6700\u9ad825.0%\uff0c\u9ad8\u63a8\u7406\u6295\u5165\u5747\u65e0\u589e\u76ca"], "keywords": ["\u89c6\u89c9\u667a\u80fd\u4f53", "\u5b9e\u65f6\u63a7\u5236", "\u6e38\u620f\u8bc4\u6d4b", "\u63a8\u7406\u4e0e\u884c\u52a8"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03685v1", "published_at": "2026-10-25", "score": 0.247, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03685.png", "title": "LOLPlay: Benchmarking Real-Time Visual Agents in League of Legends", "tldr": "\u5b9e\u65f6\u6e38\u620f\u8bc4\u6d4b\u8868\u660e\uff0c\u589e\u52a0\u63a8\u7406\u6295\u5165\u672a\u63d0\u5347\u89c6\u89c9\u667a\u80fd\u4f53\u8868\u73b0\uff0c\u53ca\u65f6\u884c\u52a8\u540c\u6837\u5173\u952e\u3002", "upvotes": 6, "what_it_is": "LOLPlay\u5728\u539f\u751f\u82f1\u96c4\u8054\u76df\u4e2d\u8bbe\u7f6e\u82f1\u96c4\u4e13\u5c5e\u4efb\u52a1\uff0c\u8ba9\u667a\u80fd\u4f53\u901a\u8fc7\u622a\u56fe\u548c\u9f20\u6807\u952e\u76d8\u64cd\u4f5c\u4ea4\u4e92\uff0c\u5e76\u7528\u81ea\u52a8\u521d\u59cb\u5316\u4e0e\u53ef\u6267\u884c\u5b50\u76ee\u6807\u68c0\u67e5\u533a\u5206\u5c40\u90e8\u8fdb\u5c55\u548c\u5b8c\u6574\u6210\u529f\u3002", "why_notable": "\u5b83\u5c06\u89c6\u89c9\u667a\u80fd\u4f53\u8bc4\u6d4b\u63a8\u8fdb\u5230\u6301\u7eed\u53d8\u5316\u7684\u771f\u5b9e\u6e38\u620f\u73af\u5883\uff0c\u63ed\u793a\u63a8\u7406\u8017\u65f6\u4e0e\u4ea4\u4e92\u673a\u4f1a\u7684\u51b2\u7a81\uff0c\u4e3a\u517c\u987e\u89c6\u89c9\u7406\u89e3\u548c\u884c\u52a8\u65f6\u6548\u63d0\u4f9b\u6d4b\u8bd5\u573a\u3002"}, {"abstract": "In-image machine translation (IIMT) replaces text in an image with its translation while preserving the surrounding visual context. Existing task-specific models achieve convincing performance but require massive paired training images before and after translation. As advanced text-to-image (T2I) models have reached a practically usable level of multilingual text generation, we argue that this capability can be transferred to IIMT and present FlowTranslator. It is a training-free IIMT framework that first employs an OCR model and an LLM to generate the translation prompt, which is injected into the T2I-based diffusion model. To optimize the accurate and natural generation of translated text, we introduce two trajectory controls: Region Coupling Release (RCR) partially decorrelates target-branch noise inside the text region early in the trajectory, while Coupling Expansion (CE) amplifies the emerging edit displacement mid-trajectory. Under the EasyOCR read-back protocol, FlowTranslator achieves average PRIM BLEU and COMET scores of 20.6 and 57.2, respectively, substantially outperforming the strong training-based baseline UniTranslator. On the more challenging and realistic whole-image ScenePair photographs translated into Chinese, it reaches 40.1\\% exact-match accuracy and surpasses existing editing systems, some of which only address the text-rendering stage rather than the complete IIMT task. These results establish flow-based editing as a strong, fully training-free baseline for IIMT.", "arxiv_id": "2611.04303", "arxiv_url": "https://arxiv.org/abs/2611.04303", "authors": ["Zhixian Li", "Xingsong Ye", "Yongkun Du", "Yunyan Xiao", "Yanglin Huang", "Pinxuan Chen", "Jiyu Zhuang", "Cong Xu", "Zhineng Chen"], "brief": "FlowTranslator\u5148\u7528OCR\u8bc6\u522b\u6587\u5b57\u3001\u7531\u5927\u8bed\u8a00\u6a21\u578b\u751f\u6210\u7ffb\u8bd1\u63d0\u793a\uff0c\u518d\u9a71\u52a8\u6587\u751f\u56fe\u6a21\u578b\u7f16\u8f91\u56fe\u50cf\uff1b\u901a\u8fc7\u4e24\u79cd\u8f68\u8ff9\u63a7\u5236\u6539\u5584\u8bd1\u6587\u751f\u6210\uff0c\u65e0\u9700\u914d\u5bf9\u56fe\u50cf\u8bad\u7ec3\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04303", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["RCR\u65e9\u671f\u89e3\u8026\u6587\u5b57\u533a\u566a\u58f0\uff0cCE\u4e2d\u671f\u653e\u5927\u7f16\u8f91\u4f4d\u79fb", "PRIM\u4e0aBLEU\u4e3a20.6\u3001COMET\u4e3a57.2", "ScenePair\u6574\u56fe\u8bd1\u4e2d\u6587\u7cbe\u786e\u5339\u914d\u738740.1%"], "keywords": ["\u56fe\u50cf\u7ffb\u8bd1", "\u56fe\u50cf\u7f16\u8f91", "\u6269\u6563\u6a21\u578b", "\u591a\u8bed\u8a00\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2611.04303v1", "published_at": "2026-11-03", "score": 0.245, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04303.png", "title": "FlowTranslator: Training-Free In-Image Machine Translation with Flow-Based Editing", "tldr": "\u65e0\u9700\u4efb\u52a1\u8bad\u7ec3\uff0c\u901a\u8fc7\u6d41\u5f0f\u7f16\u8f91\u66ff\u6362\u56fe\u4e2d\u6587\u5b57\u8bd1\u6587\uff0c\u5e76\u4fdd\u7559\u5468\u56f4\u89c6\u89c9\u5185\u5bb9\u3002", "upvotes": 10, "what_it_is": "FlowTranslator\u5148\u7528OCR\u8bc6\u522b\u6587\u5b57\u3001\u7531\u5927\u8bed\u8a00\u6a21\u578b\u751f\u6210\u7ffb\u8bd1\u63d0\u793a\uff0c\u518d\u9a71\u52a8\u6587\u751f\u56fe\u6a21\u578b\u7f16\u8f91\u56fe\u50cf\uff1b\u901a\u8fc7\u4e24\u79cd\u8f68\u8ff9\u63a7\u5236\u6539\u5584\u8bd1\u6587\u751f\u6210\uff0c\u65e0\u9700\u914d\u5bf9\u56fe\u50cf\u8bad\u7ec3\u3002", "why_notable": "\u5c06\u6587\u751f\u56fe\u6a21\u578b\u7684\u591a\u8bed\u8a00\u80fd\u529b\u8fc1\u79fb\u5230\u5b8c\u6574\u56fe\u50cf\u7ffb\u8bd1\uff0c\u51cf\u5c11\u5bf9\u914d\u5bf9\u8bad\u7ec3\u6570\u636e\u7684\u4f9d\u8d56\uff0c\u5e76\u5728\u62a5\u544a\u8bc4\u6d4b\u4e2d\u8d85\u8d8a\u8bad\u7ec3\u5f0f\u57fa\u7ebf\u53ca\u73b0\u6709\u7f16\u8f91\u7cfb\u7edf\u3002"}, {"abstract": "AI reviewers are increasingly used to assess scientific manuscripts, yet it remains unclear whether their judgments reflect the improvements authors make through revision. We investigate this question using PaperTrajectory-2026, the 2026 release of PaperTrajectory, a dataset of 6,959 paper trajectories across five AI conferences, with automatic annotations of changes along 14 dimensions and separate judgments of overall quality. The annotations show that major improvements emphasize empirical evidence and framing, while later revisions tend toward incremental improvement. Using independent assessments of manuscript versions from eight AI reviewers, we examine whether annotated major improvements receive higher scores, which revision dimensions are associated with score changes, and whether user opinions can outweigh observed revision gains. Every reviewer leaves scores unchanged on most major improvements, and agreement on the direction of score changes is weak. Revision dimensions show some reviewer-specific associations with score increases, but provide limited predictive discrimination and no consistent guide across reviewers. Even when a revision earns a higher neutral score, a brief negative user opinion can erase or reverse that advantage, with substantial variation across reviewers. These findings show that substantive revisions are not consistently reflected in review scores and that observed scoring gains can be vulnerable to user framing, motivating assessments that connect manuscript evidence to overall judgments and remain stable when no scientific evidence changes.", "arxiv_id": "2611.02244", "arxiv_url": "https://arxiv.org/abs/2611.02244", "authors": ["Yaochen Wang", "Chenguang Wang", "Ming Li", "Haomin Zhuang", "Xinyue Zeng", "Han Chen", "Kwesi Adu Cobbina", "Dang Nguyen", "Dianqi Li", "Dawei Zhou", "Tianyi Zhou"], "brief": "\u7814\u7a76\u7528\u8bba\u6587\u4fee\u8ba2\u8f68\u8ff9\u68c0\u9a8cAI\u5ba1\u7a3f\u80fd\u5426\u8bc6\u522b\u8d28\u91cf\u63d0\u5347\u3002\u901a\u8fc7\u81ea\u52a8\u6807\u6ce8\u4fee\u8ba2\u7ef4\u5ea6\u3001\u72ec\u7acb\u8
