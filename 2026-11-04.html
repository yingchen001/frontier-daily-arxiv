67a\u80fd\u4f53\u63a2\u7d22\u5e76\u6574\u5408\u6709\u6548\u65b9\u6848\uff1b\u9010\u8bcd\u6838\u9a8c\u9632\u6b62\u5956\u52b1\u4f5c\u5f0a\uff0c\u7ed3\u6784\u5316\u8bb0\u5fc6\u652f\u6301\u8de8\u8f6e\u6b21\u4e0e\u90e8\u7f72\u590d\u7528\u3002", "why_notable": "\u5c06\u7b97\u6cd5\u53d1\u73b0\u4e0e\u7cfb\u7edf\u8c03\u4f18\u7eb3\u5165\u53ef\u9a8c\u8bc1\u7684\u81ea\u4e3b\u95ed\u73af\uff0c\u9488\u5bf9\u90e8\u7f72\u5dee\u5f02\u5bfb\u627e\u6027\u80fd\u7a7a\u95f4\uff0c\u5c55\u793a\u667a\u80fd\u4f53\u4f18\u5316\u771f\u5b9e\u63a8\u7406\u7cfb\u7edf\u7684\u6f5c\u529b\u3002"}, {"abstract": "Effective computer-use agents (CUAs) should seamlessly combine visual GUI interaction with code and terminal execution within a single policy. We present Mage-VL-Cowork, a 4B hybrid CUA trained from a general multimodally aligned checkpoint through an end-to-end, progressive five-stage curriculum across midtraining, SFT, and RL. To power this curriculum at scale, Mage-CUA-Forge replaces per-task agent construction with reusable, skill-conditioned generation workflows and application-specific preparers, synthesizing 293,806 desktop and web tasks across 6,915 skills while reducing recurring per-task expenditure by 82.6%. Rather than directly distilling a default teacher, we evolve the teacher harness and instantiate specialized CUA harnesses to yield high-quality trajectories alongside stage-specific supervision. Mage-VL-Cowork-4B finally climbs to 66.0% on OSWorld-Verified through different training stages with more efficient reasoning cost, achieving state-of-the-art performance at its parameter size and pushing forward the frontier of on-device intelligence.", "arxiv_id": "2610.40747", "arxiv_url": "https://arxiv.org/abs/2610.40747", "authors": ["Xiaoyi Zhang", "Haoqing Wang", "Xinjie Zhang", "Xiang Ming", "Xing Wang", "Senqiao Yang", "Kaichen Zhang", "Zhaoyang Jia", "Andong Tan", "Xinjiang Wang", "Jinghao Guo", "Yifei Shen", "Xiao Li", "Peng Zhang", "Xun Guo", "Jiahao Li", "Shicheng Zheng", "Jinglu Wang", "Zongyu Guo", "Wenxuan Xie", "Bin Li", "Yan Lu"], "brief": "\u6784\u5efa\u7edf\u4e00\u6267\u884c\u56fe\u5f62\u754c\u9762\u3001\u4ee3\u7801\u548c\u7ec8\u7aef\u64cd\u4f5c\u76844B\u667a\u80fd\u4f53\uff0c\u4ee5\u4e94\u9636\u6bb5\u8bfe\u7a0b\u8d2f\u7a7f\u4e2d\u671f\u8bad\u7ec3\u3001\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u5e76\u901a\u8fc7\u6f14\u5316\u6559\u5e08\u6267\u884c\u6846\u67b6\u751f\u6210\u9ad8\u8d28\u91cf\u8f68\u8ff9\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40747", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Mage-CUA-Forge\u751f\u6210293,806\u9879\u4efb\u52a1\uff0c\u8986\u76d66,915\u9879\u6280\u80fd", "\u590d\u7528\u6280\u80fd\u6761\u4ef6\u751f\u6210\u6d41\u7a0b\uff0c\u5355\u4efb\u52a1\u7ecf\u5e38\u6027\u5f00\u652f\u964d\u4f4e82.6%", "OSWorld-Verified\u8fbe66.0%\uff0c\u540c\u53c2\u6570\u89c4\u6a21\u8868\u73b0\u6700\u4f18"], "keywords": ["\u7535\u8111\u64cd\u4f5c\u667a\u80fd\u4f53", "\u8bfe\u7a0b\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u8f68\u8ff9\u5408\u6210"], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2610.40747v1", "published_at": "2026-10-29", "score": 0.661, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40747.png", "title": "Mage-VL-Cowork: A Full Training Recipe to Learn Hybrid Computer Use From Evolved Harnesses", "tldr": "\u4ee5\u4e94\u9636\u6bb5\u8bad\u7ec3\u6253\u901a\u56fe\u5f62\u754c\u9762\u4e0e\u4ee3\u7801\u64cd\u4f5c\uff0c\u8ba9\u56db\u5341\u4ebf\u53c2\u6570\u667a\u80fd\u4f53\u9ad8\u6548\u5b8c\u6210\u7535\u8111\u4efb\u52a1\u3002", "upvotes": 12, "what_it_is": "\u6784\u5efa\u7edf\u4e00\u6267\u884c\u56fe\u5f62\u754c\u9762\u3001\u4ee3\u7801\u548c\u7ec8\u7aef\u64cd\u4f5c\u76844B\u667a\u80fd\u4f53\uff0c\u4ee5\u4e94\u9636\u6bb5\u8bfe\u7a0b\u8d2f\u7a7f\u4e2d\u671f\u8bad\u7ec3\u3001\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u5e76\u901a\u8fc7\u6f14\u5316\u6559\u5e08\u6267\u884c\u6846\u67b6\u751f\u6210\u9ad8\u8d28\u91cf\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u4efb\u52a1\u751f\u6210\u3001\u6559\u5e08\u6267\u884c\u6846\u67b6\u4e0e\u5206\u9636\u6bb5\u8bad\u7ec3\u4e32\u6210\u5b8c\u6574\u914d\u65b9\uff0c\u5728\u8f83\u5c0f\u6a21\u578b\u4e0a\u517c\u987e\u64cd\u4f5c\u80fd\u529b\u4e0e\u63a8\u7406\u6548\u7387\uff0c\u4e3a\u7aef\u4fa7\u7535\u8111\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u53c2\u8003\u7684\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Harness optimization can substantially improve LLM agents without modifying model weights, but existing methods primarily optimize response quality. Extending them to joint quality--cost optimization introduces a challenge: applying the deployment preference during intermediate updates can prematurely reject candidates that are valuable for later improvements. We introduce ParetoSaddler, which addresses this mismatch by separating intermediate candidate promotion from final deployment selection. At each iteration, an optimizer updates a parent harness to produce a candidate, and then compares the two over repeated executions and uses Bayesian bootstrap Pareto support to promote candidates showing credible progress in either quality or cost. Promoted candidates receive broader development evaluation and remain available as parents for later optimization steps. We evaluate ParetoSaddler on ClawMark and GAIA2 using domain-disjoint splits. On ClawMark, ParetoSaddler improves quality from 70.86\\% to 81.35\\% while reducing cost from \\$1.17 to \\$1.01 per task; on GAIA2, it improves quality from 56.22\\% to 62.89\\% while reducing cost from \\$0.78 to \\$0.45 per task. The Pareto-selected harnesses also achieve higher quality at lower cost than quality-only harness optimization. Analysis shows that Pareto-aware optimization retains intermediate candidates that would be discarded by deployment preference but can support later improvements, while Bayesian bootstrap screening filters out candidates whose gains are weakly supported across runs.", "arxiv_id": "2611.02079", "arxiv_url": "https://arxiv.org/abs/2611.02079", "authors": ["Xingzhi Qian", "Sungho Park", "Rongyuan Tan", "Jianbo Yu", "Jue Zhang", "Lorenzo Cavallaro", "Menglin Xia", "Yanzhi Chen", "Xinnuo Xu", "Yu Kang", "Xinran Zheng", "Gagan Somashekar", "Xuchao Zhang", "Chetan Bansal", "Qingwei Lin", "Victor R\u00fchle"], "brief": "\u63d0\u51fa\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u7684\u8d28\u91cf\u4e0e\u6210\u672c\u8054\u5408\u4f18\u5316\u65b9\u6cd5\u3002\u7528\u8d1d\u53f6\u65af\u81ea\u52a9\u6cd5\u4f30\u8ba1\u5e15\u7d2f\u6258\u652f\u6301\u5ea6\uff0c\u4fdd\u7559\u4efb\u4e00\u7ef4\u5ea6\u53ef\u4fe1\u6539\u8fdb\u7684\u5019\u9009\uff0c\u907f\u514d\u90e8\u7f72\u504f\u597d\u8fc7\u65e9\u622a\u65ad\u4f18\u5316\u8def\u5f84\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02079", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8d1d\u53f6\u65af\u81ea\u52a9\u6cd5\u7ed3\u5408\u91cd\u590d\u8fd0\u884c\uff0c\u7b5b\u9009\u53ef\u4fe1\u5e15\u7d2f\u6258\u6539\u8fdb", "ClawMark\u8d28\u91cf70.86%\u219281.35%\uff0c\u6210\u672c\u964d\u81f3$1.01", "GAIA2\u8d28\u91cf56.22%\u219262.89%\uff0c\u6210\u672c\u964d\u81f3$0.45"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u76ee\u6807\u4f18\u5316", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u6210\u672c\u4f18\u5316"], "num_comments": 4, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2611.02079v1", "published_at": "2026-11-01", "score": 0.647, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02079.png", "title": "ParetoSaddler: Pareto-Guided Optimization of Agent Harnesses for Quality and Cost", "tldr": "\u901a\u8fc7\u5206\u79bb\u5019\u9009\u664b\u5347\u4e0e\u90e8\u7f72\u9009\u62e9\uff0c\u5728\u4e0d\u6539\u6a21\u578b\u6743\u91cd\u4e0b\u63d0\u5347\u667a\u80fd\u4f53\u8d28\u91cf\u5e76\u964d\u4f4e\u6210\u672c\u3002", "upvotes": 16, "what_it_is": "\u63d0\u51fa\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u7684\u8d28\u91cf\u4e0e\u6210\u672c\u8054\u5408\u4f18\u5316\u65b9\u6cd5\u3002\u7528\u8d1d\u53f6\u65af\u81ea\u52a9\u6cd5\u4f30\u8ba1\u5e15\u7d2f\u6258\u652f\u6301\u5ea6\uff0c\u4fdd\u7559\u4efb\u4e00\u7ef4\u5ea6\u53ef\u4fe1\u6539\u8fdb\u7684\u5019\u9009\uff0c\u907f\u514d\u90e8\u7f72\u504f\u597d\u8fc7\u65e9\u622a\u65ad\u4f18\u5316\u8def\u5f84\u3002", "why_notable": "\u5c06\u63a2\u7d22\u9636\u6bb5\u7684\u5019\u9009\u4fdd\u7559\u4e0e\u6700\u7ec8\u90e8\u7f72\u53d6\u820d\u89e3\u8026\uff0c\u5728\u4e24\u4e2a\u9886\u57df\u9694\u79bb\u8bc4\u6d4b\u4e2d\u540c\u65f6\u63d0\u8d28\u964d\u672c\uff0c\u4f18\u4e8e\u4ec5\u4f18\u5316\u8d28\u91cf\u7684\u6846\u67b6\u4f18\u5316\u3002"}, {"abstract": "We introduce Dory1.0-4B, a 4-billion-parameter looped (latent-recurrent) language model with elastic depth: a single checkpoint serves different inference compute budgets. Dory1.0-4B is built on a normalized Transformer (nGPT) backbone with interleaved sliding-window and full-attention layers, organized into an input block, a shared recurrent block, and an output block. At inference, the recurrent block can be applied a variable number of times. We pre-trained Dory1.0-4B on 6 trillion tokens. The first 4.5 trillion tokens were trained in NVFP4, and additional pre-training then extended the context length to 256K tokens. Next, we post-trained the model using Supervised Fine-Tuning (SFT) and Reinforcement Learning with Verifiable Rewards (RLVR), with a difficulty-aware loop curriculum that routes harder prompts to deeper loops. Increasing the loop count improves accuracy, with the largest gains on coding, agentic, and long-context benchmarks. With two or more loops, Dory1.0-4B outperforms larger models such as Qwen3.5-9B, Gemma 4 12B, and Gemma 4 26B-A4B on average across 12 benchmarks. Looping also makes Dory1.0-4B more token-efficient on agentic benchmarks: with four loops, it generates 1.3-2.5x fewer tokens than with one loop, as the extra computation is spent in latent space rather than on longer outputs. To reduce memory during looping, Dory1.0-4B caches keys and values only from the last loop, keeping its KV-cache footprint equal to that of a non-looped model at any loop count while retaining most of the accuracy gains. We open-source the BF16, MXFP8, NVFP4, and GGUF quantized checkpoints.", "arxiv_id": "2611.03998", "arxiv_url": "https://arxiv.org/abs/2611.03998", "authors": ["Maxim Fishman", "Simeng Sun", "Shantanu Acharya", "Faisal Ladhak", "Brian Chmiel", "Santiago Akle Serano", "Ron Banner", "Boris Ginsburg", "Krishna C. Puvvada"], "brief": "\u8fd9\u662f\u4e00\u4e2a\u57fa\u4e8e\u5f52\u4e00\u5316Transformer\u7684\u5faa\u73af\u8bed\u8a00\u6a21\u578b\uff0c\u901a\u8fc7\u53cd\u590d\u6267\u884c\u5171\u4eab\u6a21\u5757\u8c03\u8282\u63a8\u7406\u8ba1\u7b97\u91cf\uff0c\u5e76\u4ee5\u96be\u5ea6\u611f\u77e5\u8bfe\u7a0b\u8ba9\u590d\u6742\u63d0\u793a\u4f7f\u7528\u66f4\u6df1\u5faa\u73af\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03998", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9884\u8bad\u7ec3\u4f7f\u75286\u4e07\u4ebf\u8bcd\u5143\uff0c\u4e0a\u4e0b\u6587\u6269\u5c55\u81f3256K", "\u81f3\u5c11\u4e24\u6b21\u5faa\u73af\u65f6\uff0c12\u9879\u57fa\u51c6\u5e73\u5747\u8868\u73b0\u8d85\u8fc7\u591a\u4e2a\u66f4\u5927\u6a21\u578b", "\u4ec5\u7f13\u5b58\u6700\u540e\u4e00\u8f6eKV\uff0c\u56db\u8f6e\u65f6\u667a\u80fd\u4f53\u751f\u6210\u8bcd\u5143\u51cf\u5c111.3\u20142.5\u500d"], "keywords": ["\u5faa\u73af\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u8ba1\u7b97\u6269\u5c55", "\u957f\u4e0a\u4e0b\u6587", "\u6a21\u578b\u91cf\u5316"], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2611.03998v1", "published_at": "2026-11-02", "score": 0.633, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03998.png", "title": "Dory1.0-4B: A Looped Normalized-GPT", "tldr": "\u901a\u8fc7\u6f5c\u7a7a\u95f4\u5faa\u73af\u5b9e\u73b0\u5f39\u6027\u63a8\u7406\u6df1\u5ea6\uff0c\u56db\u5341\u4ebf\u53c2\u6570\u6a21\u578b\u517c\u987e\u51c6\u786e\u7387\u4e0e\u751f\u6210\u6548\u7387\u3002", "upvotes": 6, "what_it_is": "\u8fd9\u662f\u4e00\u4e2a\u57fa\u4e8e\u5f52\u4e00\u5316Transformer\u7684\u5faa\u73af\u8bed\u8a00\u6a21\u578b\uff0c\u901a\u8fc7\u53cd\u590d\u6267\u884c\u5171\u4eab\u6a21\u5757\u8c03\u8282\u63a8\u7406\u8ba1\u7b97\u91cf\uff0c\u5e76\u4ee5\u96be\u5ea6\u611f\u77e5\u8bfe\u7a0b\u8ba9\u590d\u6742\u63d0\u793a\u4f7f\u7528\u66f4\u6df1\u5faa\u73af\u3002", "why_notable": "\u5c06\u989d\u5916\u63a8\u7406\u8ba1\u7b97\u6295\u5165\u6f5c\u7a7a\u95f4\u800c\u975e\u62c9\u957f\u8f93\u51fa\uff0c\u540c\u4e00\u68c0\u67e5\u70b9\u5373\u53ef\u9002\u914d\u4e0d\u540c\u9884\u7b97\uff1b\u5faa\u73af\u4e0d\u589e\u52a0KV\u7f13\u5b58\u89c4\u6a21\uff0c\u4e3a\u5c0f\u6a21\u578b\u6269\u5c55\u63a8\u7406\u80fd\u529b\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Large reasoning models achieve strong performance on challenging tasks, but their long chain-of-thought often incurs substantial inference costs by continuing to deliberate after sufficient information has been obtained. Existing reasoning compression methods primarily operate on reasoning trajectories, paying less attention to the local decision of whether further reasoning is necessary given the current state. We propose LoCo, a local preference learning method for reasoning compression. LoCo detects candidate overthinking states from the model\u0027s own traces, freezes the corresponding reasoning prefixes, regenerates shorter verified continuations from the same states, and trains on the resulting state-conditioned preference pairs with DPO. This formulation teaches the model when to continue reasoning and when to conclude, rather than simply encouraging shorter trajectories overall. We construct training data entirely from self-generated mathematical traces and evaluate LoCo on five mathematical and three code generation benchmarks. LoCo reduces completion length by 41.7\\%--45.4\\% on mathematics and 23.4\\%--36.3\\% on code, while maintaining or improving accuracy and achieving the best AUC across all code benchmarks. LoCo consistently improves the accuracy-efficiency trade-off on mathematics and transfers effectively to code generation despite math-only training, demonstrating the cross-domain generality of local preference learning for reasoning compression. The code and model will be publicly released at https://github.com/MuyaoYuan/LoCo.", "arxiv_id": "2611.04814", "arxiv_url": "https://arxiv.org/abs/2611.04814", "authors": ["Muyao Yuan", "Liyan Xu", "Weizhan Zhang", "Muyan Jiao", "Jiangnan Li", "Jinchao Zhang", "Jie Zhou"], "brief": "LoCo\u4ece\u6a21\u578b\u81ea\u8eab\u8f68\u8ff9\u4e2d\u8bc6\u522b\u8fc7\u5ea6\u601d\u8003\u72b6\u6001\uff0c\u56fa\u5b9a\u63a8\u7406\u524d\u7f00\u5e76\u751f\u6210\u7ecf\u9a8c\u8bc1\u7684\u77ed\u7eed\u5199\uff0c\u518d\u7528\u72b6\u6001\u6761\u4ef6\u504f\u597d\u5bf9\u8fdb\u884cDPO\u8bad\u7ec3\uff0c\u5b66\u4e60\u7ee7\u7eed\u63a8\u7406\u6216\u7ed3\u675f\u4f5c\u7b54\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/MuyaoYuan/LoCo", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.04814", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u56fa\u5b9a\u63a8\u7406\u524d\u7f00\uff0c\u4ee5\u72b6\u6001\u6761\u4ef6\u504f\u597d\u5bf9\u8bad\u7ec3DPO", "\u6570\u5b66\u8f93\u51fa\u7f29\u77ed41.7%\u201445.4%\uff0c\u51c6\u786e\u7387\u4e0d\u964d", "\u4ec5\u7528\u6570\u5b66\u8bad\u7ec3\uff0c\u4ee3\u7801\u8f93\u51fa\u7f29\u77ed23.4%\u201436.3%"], "keywords": ["\u63a8\u7406\u538b\u7f29", "\u504f\u597d\u5b66\u4e60", "\u601d\u7ef4\u94fe", "\u4ee3\u7801\u751f\u6210"], "num_comments": 7, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2611.04814v1", "published_at": "2026-11-03", "score": 0.564, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (65\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04814.png", "title": "Think Less, Locally: Local Preference Learning for Reasoning Compression", "tldr": "\u901a\u8fc7\u5c40\u90e8\u504f\u597d\u5b66\u4e60\u5224\u65ad\u4f55\u65f6\u505c\u6b62\u63a8\u7406\uff0c\u5728\u4fdd\u6301\u51c6\u786e\u7387\u7684\u540c\u65f6\u538b\u7f29\u8f93\u51fa\u957f\u5ea6\u3002", "upvotes": 65, "what_it_is": "LoCo\u4ece\u6a21\u578b\u81ea\u8eab\u8f68\u8ff9\u4e2d\u8bc6\u522b\u8fc7\u5ea6\u601d\u8003\u72b6\u6001\uff0c\u56fa\u5b9a\u63a8\u7406\u524d\u7f00\u5e76\u751f\u6210\u7ecf\u9a8c\u8bc1\u7684\u77ed\u7eed\u5199\uff0c\u518d\u7528\u72b6\u6001\u6761\u4ef6\u504f\u597d\u5bf9\u8fdb\u884cDPO\u8bad\u7ec3\uff0c\u5b66\u4e60\u7ee7\u7eed\u63a8\u7406\u6216\u7ed3\u675f\u4f5c\u7b54\u3002", "why_notable": "\u5c06\u538b\u7f29\u76ee\u6807\u4ece\u6574\u6761\u8f68\u8ff9\u7f29\u77ed\u8f6c\u5411\u5c40\u90e8\u505c\u6b62\u51b3\u7b56\uff0c\u6539\u5584\u51c6\u786e\u7387\u4e0e\u6548\u7387\u7684\u6743\u8861\uff1b\u6570\u5b66\u8bad\u7ec3\u8fd8\u80fd\u8fc1\u79fb\u5230\u4ee3\u7801\u751f\u6210\u3002"}, {"abstract": "Foundation models in changing environments can encounter unfamiliar domain knowledge that their original training did not cover. However, new domains rarely provide large amounts of expert-created training data or reliable supervisory signals for further training. We introduce Recursa, a foundation model system that adapts to new domains by learning from its own experience without human experts or a stronger teacher model. Recursa uses a knowledge repository to store what it learns: domain-specific skills and instructions on when to apply them, along with memories of past task experiences and reflections on what to improve. Recursa bootstraps the repository from domain materials and then refines it through recursive self-improvement. It uses parallel learners to execute tasks and synthesize local improvements, then validates and merges the improvements into the knowledge repository. On Harvey LAB\u0027s Firm Knowledge benchmark, Recursa raises the all-pass rate on held-out test tasks from 30.0% to 55.0% with DeepSeek-V4.1-Flash and from 35.0% to 46.0% with Qwen3.8-Flash.", "arxiv_id": "2611.04035", "arxiv_url": "https://arxiv.org/abs/2611.04035", "authors": ["Erkang Zhu", "Yin Lin", "Xiaorong Shi", "Xuanrui Lin", "Jingren Zhou"], "brief": "Recursa\u4ece\u9886\u57df\u6750\u6599\u521d\u59cb\u5316\u77e5\u8bc6\u5e93\uff0c\u4fdd\u5b58\u6280\u80fd\u3001\u9002\u7528\u6307\u4ee4\u53ca\u4efb\u52a1\u8bb0\u5fc6\u4e0e\u53cd\u601d\u3002\u5e76\u884c\u5b66\u4e60\u5668\u6267\u884c\u4efb\u52a1\u5e76\u63d0\u51fa\u5c40\u90e8\u6539\u8fdb\uff0c\u7ecf\u9a8c\u8bc1\u5408\u5e76\u540e\u6301\u7eed\u66f4\u65b0\u77e5\u8bc6\u5e93\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04035", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u77e5\u8bc6\u5e93\u5b58\u50a8\u9886\u57df\u6280\u80fd\u3001\u9002\u7528\u6307\u4ee4\u3001\u4efb\u52a1\u8bb0\u5fc6\u4e0e\u53cd\u601d", "\u5e76\u884c\u5b66\u4e60\u5668\u751f\u6210\u5c40\u90e8\u6539\u8fdb\uff0c\u7ecf\u9a8c\u8bc1\u540e\u5408\u5e76", "Firm Knowledge\u5168\u901a\u8fc7\u7387\uff1a30%\u219255%\u300135%\u219246%"], "keywords": ["\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u77e5\u8bc6\u5e93", "\u9886\u57df\u9002\u5e94", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "alibaba", "pdf_url": "https://arxiv.org/pdf/2611.04035v1", "published_at": "2026-11-02", "score": 0.509, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04035.png", "title": "Recursa: Toward Recursively Self-Improving Foundation Model Systems", "tldr": "\u901a\u8fc7\u77e5\u8bc6\u5e93\u4e0e\u5e76\u884c\u5b66\u4e60\u5668\u9012\u5f52\u6539\u8fdb\uff0c\u6a21\u578b\u65e0\u9700\u4e13\u5bb6\u76d1\u7763\u5373\u53ef\u63d0\u5347\u65b0\u9886\u57df\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 11, "what_it_is": "Recursa\u4ece\u9886\u57df\u6750\u6599\u521d\u59cb\u5316\u77e5\u8bc6\u5e93\uff0c\u4fdd\u5b58\u6280\u80fd\u3001\u9002\u7528\u6307\u4ee4\u53ca\u4efb\u52a1\u8bb0\u5fc6\u4e0e\u53cd\u601d\u3002\u5e76\u884c\u5b66\u4e60\u5668\u6267\u884c\u4efb\u52a1\u5e76\u63d0\u51fa\u5c40\u90e8\u6539\u8fdb\uff0c\u7ecf\u9a8c\u8bc1\u5408\u5e76\u540e\u6301\u7eed\u66f4\u65b0\u77e5\u8bc6\u5e93\u3002", "why_notable": "\u5c06\u81ea\u6211\u6539\u8fdb\u843d\u5230\u53ef\u79ef\u7d2f\u3001\u53ef\u9a8c\u8bc1\u7684\u5916\u90e8\u77e5\u8bc6\u5e93\uff0c\u5728\u7f3a\u4e4f\u4e13\u5bb6\u4e0e\u5f3a\u6559\u5e08\u76d1\u7763\u7684\u65b0\u9886\u57df\u4e2d\uff0c\u5c55\u793a\u4e86\u8de8\u4e24\u79cd\u6a21\u578b\u7684\u4efb\u52a1\u6536\u76ca\u3002"}, {"abstract": "Later tokens are costlier to generate than earlier tokens. On frontier open weight models, the disparity in cost may rise to as much as 7x. Through frequent compaction, we show across a broad range of long-horizon and long-input tasks that frontier language models sacrifice little to no task accuracy when maintaining short contexts. We further demonstrate that LLM performance does not collapse on long-horizon software engineering tasks even when taking at most one action per context, and based on that we outline the concept of semantic state space models (SSSMs). Our findings question the need for long-context language models.", "arxiv_id": "2611.05306", "arxiv_url": "https://arxiv.org/abs/2611.05306", "authors": ["Peter Belcak", "Saurav Muralidharan", "Jindong Jiang", "Yonggan Fu", "Wonmin Byeon", "Hanrong Ye", "Ryan Angilly", "Ali Taghibakhshi", "Shih-Yang Liu", "Siru Ouyang", "Greg Heinrich", "Pavlo Molchanov"], "brief": "\u7814\u7a76\u901a\u8fc7\u9891\u7e41\u538b\u7f29\u4e0a\u4e0b\u6587\uff0c\u8ba9\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u4ee5\u77ed\u4e0a\u4e0b\u6587\u5904\u7406\u957f\u8f93\u5165\u548c\u957f\u7a0b\u4efb\u52a1\uff0c\u5e76\u6d4b\u8bd5\u6bcf\u6bb5\u4e0a\u4e0b\u6587\u6700\u591a\u6267\u884c\u4e00\u6b21\u52a8\u4f5c\u7684\u8bbe\u7f6e\uff0c\u8fdb\u800c\u63d0\u51fa\u8bed\u4e49\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u6982\u5ff5\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05306", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u524d\u6cbf\u5f00\u653e\u6743\u91cd\u6a21\u578b\u540e\u671f\u4ee4\u724c\u751f\u6210\u6210\u672c\u53ef\u8fbe\u65e9\u671f\u76847\u500d", "\u9891\u7e41\u4e0a\u4e0b\u6587\u538b\u7f29\u5728\u591a\u7c7b\u4efb\u52a1\u4e2d\u51e0\u4e4e\u4e0d\u635f\u5931\u51c6\u786e\u7387", "\u6bcf\u6bb5\u4e0a\u4e0b\u6587\u6700\u591a\u4e00\u6b21\u52a8\u4f5c\uff0c\u957f\u7a0b\u8f6f\u4ef6\u5de5\u7a0b\u8868\u73b0\u4ecd\u672a\u5d29\u6e83"], "keywords": ["\u4e0a\u4e0b\u6587\u538b\u7f29", "\u957f\u4e0a\u4e0b\u6587", "\u957f\u7a0b\u4efb\u52a1", "\u8bed\u4e49\u72b6\u6001\u7a7a\u95f4\u6a21\u578b"], "num_comments": 4, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2611.05306v1", "published_at": "2026-11-03", "score": 0.495, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05306.png", "title": "You don\u0027t need long context", "tldr": "\u9891\u7e41\u538b\u7f29\u4e0a\u4e0b\u6587\u53ef\u663e\u8457\u964d\u4f4e\u751f\u6210\u6210\u672c\uff0c\u5e76\u5728\u591a\u7c7b\u957f\u7a0b\u4efb\u52a1\u4e2d\u57fa\u672c\u4fdd\u6301\u51c6\u786e\u7387\u3002", "upvotes": 9, "what_it_is": "\u7814\u7a76\u901a\u8fc7\u9891\u7e41\u538b\u7f29\u4e0a\u4e0b\u6587\uff0c\u8ba9\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u4ee5\u77ed\u4e0a\u4e0b\u6587\u5904\u7406\u957f\u8f93\u5165\u548c\u957f\u7a0b\u4efb\u52a1\uff0c\u5e76\u6d4b\u8bd5\u6bcf\u6bb5\u4e0a\u4e0b\u6587\u6700\u591a\u6267\u884c\u4e00\u6b21\u52a8\u4f5c\u7684\u8bbe\u7f6e\uff0c\u8fdb\u800c\u63d0\u51fa\u8bed\u4e49\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u6982\u5ff5\u3002", "why_notable": "\u7ed3\u679c\u6311\u6218\u4e86\u957f\u7a0b\u4efb\u52a1\u5fc5\u987b\u4f9d\u8d56\u957f\u4e0a\u4e0b\u6587\u7684\u5047\u8bbe\uff0c\u4e3a\u964d\u4f4e\u63a8\u7406\u6210\u672c\u63d0\u4f9b\u5b9e\u8bc1\u4f9d\u636e\uff0c\u4e5f\u4e3a\u4ee5\u8bed\u4e49\u72b6\u6001\u7ef4\u6301\u4efb\u52a1\u8fde\u7eed\u6027\u63d0\u51fa\u65b0\u65b9\u5411\u3002"}, {"abstract": "Video generation has progressed from isolated clips to coherent short-form audiovisual sequences, and the bottleneck is shifting from rendering to semantic control. This report summarizes the observations and insights on multimodal understanding gained from successive generations of Kling. We argue that generation quality is the projection of multimodal understanding through the entire data--conditioning--alignment--evaluation chain, and we examine this chain module by module. Kling-MLLM, a shared multimodal foundation model that unifies image, video, audio, synchronized audio--video, and interleaved inputs, is specialized for each downstream module. Because a DiT is trained on far fewer training samples than a language model, we treat captioning as a semantic contract that maximizes description density, and extend it to reference-grounded captioning that makes reference bindings explicit. Prompt enhancement translates user intent into this caption distribution: basic PE is derived from captions of compelling videos and refined with text-level and generator-in-the-loop reinforcement learning, while agentic PE refines the story and retrieves compelling examples. We show that a reliable text encoder comes from perceptual training rather than from stronger language ability, and that candidates can be screened from text alone before end-to-end training. Reward modeling pairs a general reward model for explainable, localized critiques with a decision reward model for fast multidimensional scoring, treating perceptual bandwidth as a first-class design parameter. Finally, we review task-specific automatic evaluation, focusing on protocols that expose scoring shortcuts and help trace failures to their upstream source. We hope these lessons offer practical guidance for building the understanding stack behind controllable video generation.", "arxiv_id": "2611.04916", "arxiv_url": "https://arxiv.org/abs/2611.04916", "authors": ["Kling Team", "Dong Chen", "Jialu Chen", "Xinlong Chen", "Yifan Dai", "Haotian Dong", "Binzong Geng", "Yushuo Guan", "Minghui Guo", "Guanlin He", "Guanxiao He", "Jingyun Hua", "Yanwei Huang", "Yiyan Ji", "Xueping Jia", "Yizhuo Jia", "Bozhou Li", "Jiaze Li", "Min Li", "Shihao Li", "Shujie Li", "Shengyi Liao", "Weihong Lin", "Shiyuan Liu", "Xinyu Liu", "Siyang Mao", "Xiaoru Qu", "Dianmo Sheng", "Yang Shi", "Jiafu Tang", "Longxiang Tang", "Yuqi Tang", "Chengzhuo Tong", "Kuo Wang", "Qixun Wang", "Rui Wang", "Tianduo Wang", "Yuran Wang", "Zekun Wang", "Zihao Wang", "Boyang Xia", "Yifan Xu", "Liu Yang", "Zhenlong Yuan", "Bohan Zeng", "Mujin Zhang", "Yuanxing Zhang", "Zhicheng Zhang", "Zhuoran Zhang", "Yuanhong Zheng", "Kun Gai", "Chengru Song", "Pengfei Wan"], "brief": "\u62a5\u544a\u68b3\u7406 Kling \u591a\u4ee3\u7cfb\u7edf\u7684\u5b9e\u8df5\uff0c\u4ee5\u5171\u4eab\u591a\u6a21\u6001\u6a21\u578b Kling-MLLM \u652f\u6491\u5404\u6a21\u5757\uff0c\u5206\u6790\u63cf\u8ff0\u6807\u6ce8\u3001\u63d0\u793a\u589e\u5f3a\u3001\u6587\u672c\u7f16\u7801\u3001\u5956\u52b1\u5efa\u6a21\u548c\u81ea\u52a8\u8bc4\u4f30\u5982\u4f55\u5171\u540c\u5f71\u54cd\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04916", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53c2\u8003\u951a\u5b9a\u63cf\u8ff0\u663e\u5f0f\u7ed1\u5b9a\u53c2\u8003\u5bf9\u8c61\uff0c\u63d0\u9ad8 DiT \u8bad\u7ec3\u7684\u8bed\u4e49\u5bc6\u5ea6", "\u63d0\u793a\u589e\u5f3a\u7ed3\u5408\u6587\u672c\u7ea7\u4e0e\u751f\u6210\u5668\u95ed\u73af\u5f3a\u5316\u5b66\u4e60\uff0c\u8d34\u5408\u63cf\u8ff0\u5206\u5e03", "\u6587\u672c\u7f16\u7801\u5668\u5f3a\u8c03\u611f\u77e5\u8bad\u7ec3\uff0c\u53cc\u5956\u52b1\u6a21\u578b\u5206\u62c5\u5c40\u90e8\u6279\u8bc4\u4e0e\u5feb\u901f\u8bc4\u5206"], "keywords": ["\u591a\u6a21\u6001\u7406\u89e3", "\u89c6\u9891\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "KlingAI Research", "pdf_url": "https://arxiv.org/pdf/2611.04916v1", "published_at": "2026-11-03", "score": 0.435, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (52\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04916.png", "title": "Behind Video Generation: Observations and Insights on Multimodal Understanding from Kling", "tldr": "\u53ef\u63a7\u89c6\u9891\u751f\u6210\u7684\u5173\u952e\u5728\u591a\u6a21\u6001\u7406\u89e3\uff0c\u9700\u8981\u8d2f\u901a\u6570\u636e\u3001\u6761\u4ef6\u3001\u5bf9\u9f50\u4e0e\u8bc4\u4f30\u3002", "upvotes": 52, "what_it_is": "\u62a5\u544a\u68b3\u7406 Kling \u591a\u4ee3\u7cfb\u7edf\u7684\u5b9e\u8df5\uff0c\u4ee5\u5171\u4eab\u591a\u6a21\u6001\u6a21\u578b Kling-MLLM \u652f\u6491\u5404\u6a21\u5757\uff0c\u5206\u6790\u63cf\u8ff0\u6807\u6ce8\u3001\u63d0\u793a\u589e\u5f3a\u3001\u6587\u672c\u7f16\u7801\u3001\u5956\u52b1\u5efa\u6a21\u548c\u81ea\u52a8\u8bc4\u4f30\u5982\u4f55\u5171\u540c\u5f71\u54cd\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "\u628a\u751f\u6210\u8d28\u91cf\u95ee\u9898\u8ffd\u6eaf\u5230\u7406\u89e3\u94fe\u8def\uff0c\u800c\u975e\u4ec5\u5f52\u56e0\u4e8e\u6e32\u67d3\u6a21\u578b\uff1b\u4e3a\u53ef\u63a7\u89c6\u9891\u7cfb\u7edf\u7684\u6a21\u5757\u8bbe\u8ba1\u3001\u5019\u9009\u7b5b\u9009\u4e0e\u5931\u8d25\u5b9a\u4f4d\u63d0\u4f9b\u5b9e\u8df5\u4f9d\u636e\u3002"}, {"abstract": "Speculative decoding has been treated purely as a systems optimization that speeds up large language model decoding without changing the model behavior. Under this view, the growing effort to train better draft models has been focused solely on acceptance rate. We argue that this view does not hold true for long-horizon agent reasoning. Measuring frontier open-weight models on complex agentic tasks with different speculative decoding approaches, we found that numerical noise grows within verification windows, and the draft acceptance results of the thinking process can change the output distribution of the model after 30 steps, thus noticeably influencing the reasoning accuracy of long-horizon agents in random directions. In this work, we improve the reasoning capability of target models by controlling such noise. While we cannot change the overall token distribution verified by the target model, we can encode critical reasoning with highest precision by training the draft model to be rejected. We identify these points in agent traces and train the draft model to favor adversarial preference. At inference the trained draft and the target part ways precisely at these decision points, verification restarts, so that critical thinking tokens are sampled from the target model and encoded under its least noisy conditions. This approach makes critical reasoning better indexed and more durable over a long horizon. On complex agentic coding benchmarks, our approach raises end-to-end success rate with no change to the target model or its output distribution. Our results recast the speculative decoding mechanism from a pure accelerator into an active allocator for context precision that improves the accuracy of long-horizon agents by training 0.06% to 0.28% of hosted parameters.", "arxiv_id": "2611.05345", "arxiv_url": "https://arxiv.org/abs/2611.05345", "authors": ["Hongyin Luo", "Wei Fang", "Lijie Yang", "Owen Stepan", "Daniel Suit", "Jeff Krapf", "Dana Wensberg", "Jack O\u0027Brien"], "brief": "\u7814\u7a76\u5c06\u63a8\u6d4b\u89e3\u7801\u7528\u4e8e\u8c03\u63a7\u957f\u7a0b\u63a8\u7406\u4e2d\u7684\u6570\u503c\u566a\u58f0\u3002\u901a\u8fc7\u8bc6\u522b\u8f68\u8ff9\u4e2d\u7684\u5173\u952e\u51b3\u7b56\u70b9\u5e76\u8bad\u7ec3\u8349\u7a3f\u6a21\u578b\u504f\u5411\u5bf9\u6297\u6027\u5019\u9009\uff0c\u89e6\u53d1\u9a8c\u8bc1\u91cd\u542f\uff0c\u8ba9\u76ee\u6807\u6a21\u578b\u66f4\u7cbe\u786e\u5730\u751f\u6210\u5173\u952e\u8bcd\u5143\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05345", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9a8c\u8bc1\u7a97\u53e3\u5185\u566a\u58f0\u7d2f\u79ef\uff0c30\u6b65\u540e\u53ef\u5f71\u54cd\u8f93\u51fa\u5206\u5e03", "\u5bf9\u6297\u6027\u504f\u597d\u8bad\u7ec3\u4f7f\u8349\u7a3f\u5728\u5173\u952e\u51b3\u7b56\u70b9\u88ab\u62d2\u7edd", "\u4ec5\u8bad\u7ec30.06%\u81f30.28%\u7684\u6258\u7ba1\u53c2\u6570\uff0c\u63d0\u9ad8\u7f16\u7801\u4efb\u52a1\u6210\u529f\u7387"], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u667a\u80fd\u4f53\u63a8\u7406", "\u6570\u503c\u7cbe\u5ea6", "\u5bf9\u6297\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "Subconscious", "pdf_url": "https://arxiv.org/pdf/2611.05345v1", "published_at": "2026-11-03", "score": 0.408, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05345.png", "title": "Adversarial Speculative Reasoning Improves Long Horizon Agents", "tldr": "\u901a\u8fc7\u8bad\u7ec3\u8349\u7a3f\u6a21\u578b\u5728\u5173\u952e\u51b3\u7b56\u70b9\u88ab\u62d2\u7edd\uff0c\u964d\u4f4e\u6570\u503c\u566a\u58f0\u5e76\u63d0\u5347\u957f\u7a0b\u667a\u80fd\u4f53\u63a8\u7406\u3002", "upvotes": 6, "what_it_is": "\u7814\u7a76\u5c06\u63a8\u6d4b\u89e3\u7801\u7528\u4e8e\u8c03\u63a7\u957f\u7a0b\u63a8\u7406\u4e2d\u7684\u6570\u503c\u566a\u58f0\u3002\u901a\u8fc7\u8bc6\u522b\u8f68\u8ff9\u4e2d\u7684\u5173\u952e\u51b3\u7b56\u70b9\u5e76\u8bad\u7ec3\u8349\u7a3f\u6a21\u578b\u504f\u5411\u5bf9\u6297\u6027\u5019\u9009\uff0c\u89e6\u53d1\u9a8c\u8bc1\u91cd\u542f\uff0c\u8ba9\u76ee\u6807\u6a21\u578b\u66f4\u7cbe\u786e\u5730\u751f\u6210\u5173\u952e\u8bcd\u5143\u3002", "why_notable": "\u5b83\u5c06\u63a8\u6d4b\u89e3\u7801\u4ece\u5355\u7eaf\u52a0\u901f\u5de5\u5177\u8f6c\u4e3a\u4e0a\u4e0b\u6587\u7cbe\u5ea6\u5206\u914d\u673a\u5236\uff0c\u65e0\u9700\u4fee\u6539\u76ee\u6807\u6a21\u578b\u4fbf\u80fd\u63d0\u5347\u957f\u7a0b\u7f16\u7801\u4efb\u52a1\u8868\u73b0\u3002"}, {"abstract": "Trajectory-level GRPO is a common approach for training multi-step GUI agents, but repeatedly rolling out complete trajectories from the task root can be inefficient: task-level rewards provide coarse supervision over which intermediate decisions require improvement, while already-mastered prefixes are repeatedly re-executed before reaching difficult states. We introduce a two-stage adaptive training framework that jointly addresses where to learn and how far to roll out. We first construct reusable intermediate checkpoints from successful expert trajectories and select informative pivots using action disagreement, which measures uncertainty directly from sampled GUI actions. Stage I performs one-step RL at these pivots to improve uncertain local decisions. Stage II then progressively expands policy responsibility through adaptive Local, Suffix, and Root training according to task progress. Recoverable checkpoints enable repeated training from intermediate states without replaying the preceding trajectory. Across MobileGym and CUA-Gym-Hub, our method reduces environment interaction by 56-61% relative to Vanilla GRPO while improving task performance, demonstrating that jointly allocating training across states and rollout ranges can substantially improve GUI-agent RL efficiency.", "arxiv_id": "2610.39251", "arxiv_url": "https://arxiv.org/abs/2610.39251", "authors": ["Yuxiang Chai", "Quyu Kong", "Panrong Tong", "Steven Hoi", "Yue Wang"], "brief": "\u63d0\u51fa\u4e24\u9636\u6bb5\u81ea\u9002\u5e94\u8bad\u7ec3\u6846\u67b6\uff1a\u4ece\u4e13\u5bb6\u8f68\u8ff9\u63d0\u53d6\u53ef\u6062\u590d\u68c0\u67e5\u70b9\uff0c\u4ee5\u52a8\u4f5c\u5206\u6b67\u7b5b\u9009\u96be\u70b9\u8fdb\u884c\u5355\u6b65\u5f3a\u5316\u5b66\u4e60\uff0c\u518d\u6309\u4efb\u52a1\u8fdb\u5c55\u6269\u5927\u8bad\u7ec3\u8303\u56f4\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39251", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u52a8\u4f5c\u5206\u6b67\u7b5b\u9009\u5173\u952e\u4e2d\u95f4\u72b6\u6001\uff0c\u5f00\u5c55\u5355\u6b65\u5f3a\u5316\u5b66\u4e60", "\u81ea\u9002\u5e94\u5207\u6362Local\u3001Suffix\u3001Root\u8bad\u7ec3", "\u4e24\u9879\u57fa\u51c6\u4e0a\u8f83Vanilla GRPO\u51cf\u5c11\u4ea4\u4e9256\u201361%"], "keywords": ["\u56fe\u5f62\u754c\u9762\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u9002\u5e94\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.39251v1", "published_at": "2026-10-29", "score": 0.386, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39251.png", "title": "Where to Learn and How Far to Roll Out: Efficient Adaptive Training for GUI Agents", "tldr": "\u901a\u8fc7\u4e2d\u95f4\u68c0\u67e5\u70b9\u4e0e\u81ea\u9002\u5e94\u5c55\u5f00\u8bad\u7ec3\uff0c\u63d0\u5347GUI\u667a\u80fd\u4f53\u6027\u80fd\u5e76\u51cf\u5c11\u73af\u5883\u4ea4\u4e92", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u4e24\u9636\u6bb5\u81ea\u9002\u5e94\u8bad\u7ec3\u6846\u67b6\uff1a\u4ece\u4e13\u5bb6\u8f68\u8ff9\u63d0\u53d6\u53ef\u6062\u590d\u68c0\u67e5\u70b9\uff0c\u4ee5\u52a8\u4f5c\u5206\u6b67\u7b5b\u9009\u96be\u70b9\u8fdb\u884c\u5355\u6b65\u5f3a\u5316\u5b66\u4e60\uff0c\u518d\u6309\u4efb\u52a1\u8fdb\u5c55\u6269\u5927\u8bad\u7ec3\u8303\u56f4\u3002", "why_notable": "\u5c06\u8bad\u7ec3\u72b6\u6001\u9009\u62e9\u4e0e\u8f68\u8ff9\u5c55\u5f00\u957f\u5ea6\u8054\u5408\u4f18\u5316\uff0c\u907f\u514d\u53cd\u590d\u6267\u884c\u5df2\u638c\u63e1\u524d\u7f00\uff0c\u5728\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u73af\u5883\u4ea4\u4e92\u6210\u672c\u3002"}, {"abstract": "Artificial general intelligence (AGI) requires a method that can understand, generate, reason, and act across diverse domains and modalities. Rather than relying on a single model to master every capability, a promising path toward AGI now is to orchestrate a heterogeneous ecosystem of specialized models, tools, and policies (candidates) into a unified AI system. At the heart of this vision lies a fundamental question: how can an AI system dynamically select and coordinate the most capable candidate for each task while balancing performance and computational cost? In this work, we present Route Anything, a unified framework for studying model and policy routing across general-purpose AI systems. We develop a unified theoretical foundation that characterizes optimal routing under quality--cost trade-offs and establishes how the information available to a router determines its attainable performance. To systematically investigate routing across diverse capabilities, we first construct an omni-modal trajectory matrix spanning 25 benchmarks across language understanding, image, video, and speech generation, coding and workplace agents, and robotic manipulation, comprising 374,401 scored runs from 452 candidate configurations. Building on this framework, we train and test different routers to investigate the potential of omni-modal model routing, the capabilities of learned routers, and the conditions under which routing improves efficiency. Our results reveal substantial opportunities for capability orchestration: per-input oracle routing outperforms the best fixed candidate by 5.4 points, and learned routers outperform it by 0.3 points across 16 benchmarks, by 2.1 points on video generation, and by 1.1 points on robot manipulation while using 24% less policy time. More importantly, routing raises efficiency by 8.82x on average compared with the reference model.", "arxiv_id": "2611.05275", "arxiv_url": "https://arxiv.org/abs/2611.05275", "authors": ["Pengfei Zhou", "Yixing Ma", "Hexin Wang", "Weidong Tang", "Zhenglin Wan", "Wangbo Zhao", "Yang You"], "brief": "\u63d0\u51fa\u7edf\u4e00\u8def\u7531\u7814\u7a76\u6846\u67b6\uff0c\u523b\u753b\u8d28\u91cf\u4e0e\u6210\u672c\u6743\u8861\u4e0b\u7684\u6700\u4f18\u9009\u62e9\u53ca\u4fe1\u606f\u9650\u5236\uff1b\u6784\u5efa\u5168\u6a21\u6001\u8fd0\u884c\u8f68\u8ff9\u77e9\u9635\uff0c\u8bad\u7ec3\u5e76\u8bc4\u4f30\u8def\u7531\u5668\u5bf9\u6a21\u578b\u4e0e\u7b56\u7565\u7684\u52a8\u6001\u9009\u62e9\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/InfRec-Cardinal/route-anything", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.05275", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8f68\u8ff9\u77e9\u9635\u8986\u76d625\u9879\u57fa\u51c6\u3001452\u79cd\u914d\u7f6e\u53ca374401\u6b21\u8bc4\u5206\u8fd0\u884c", "\u9010\u8f93\u5165\u7406\u60f3\u8def\u7531\u63d0\u53475.4\u5206\uff1b\u5b66\u4e60\u8def\u7531\u572816\u9879\u57fa\u51c6\u63d0\u53470.3\u5206", "\u5e73\u5747\u6548\u7387\u8fbe\u53c2\u8003\u6a21\u578b\u76848.82\u500d\uff1b\u673a\u5668\u4eba\u7b56\u7565\u8017\u65f6\u51cf\u5c1124%"], "keywords": ["\u6a21\u578b\u8def\u7531", "\u591a\u6a21\u6001\u5b66\u4e60", "\u7b56\u7565\u9009\u62e9", "\u8ba1\u7b97\u6548\u7387"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05275v1", "published_at": "2026-11-03", "score": 0.342, "selected_reasons": ["HF trending (86\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05275.png", "title": "Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems", "tldr": "\u901a\u8fc7\u8de8\u6a21\u6001\u6a21\u578b\u4e0e\u7b56\u7565\u8def\u7531\uff0c\u52a8\u6001\u9009\u62e9\u4e13\u7528\u5019\u9009\uff0c\u5728\u8d28\u91cf\u4e0e\u6210\u672c\u95f4\u53d6\u5f97\u66f4\u4f18\u5e73\u8861\u3002", "upvotes": 86, "what_it_is": "\u63d0\u51fa\u7edf\u4e00\u8def\u7531\u7814\u7a76\u6846\u67b6\uff0c\u523b\u753b\u8d28\u91cf\u4e0e\u6210\u672c\u6743\u8861\u4e0b\u7684\u6700\u4f18\u9009\u62e9\u53ca\u4fe1\u606f\u9650\u5236\uff1b\u6784\u5efa\u5168\u6a21\u6001\u8fd0\u884c\u8f68\u8ff9\u77e9\u9635\uff0c\u8bad\u7ec3\u5e76\u8bc4\u4f30\u8def\u7531\u5668\u5bf9\u6a21\u578b\u4e0e\u7b56\u7565\u7684\u52a8\u6001\u9009\u62e9\u3002", "why_notable": "\u5c06\u6a21\u578b\u9009\u62e9\u4e0e\u884c\u52a8\u7b56\u7565\u9009\u62e9\u7eb3\u5165\u540c\u4e00\u7406\u8bba\u548c\u5b9e\u8bc1\u6846\u67b6\uff0c\u8868\u660e\u901a\u7528\u7cfb\u7edf\u53ef\u901a\u8fc7\u80fd\u529b\u7f16\u6392\u6539\u5584\u8d28\u91cf\u4e0e\u6548\u7387\uff0c\u800c\u4e0d\u5fc5\u53ea\u4f9d\u8d56\u5355\u4e2a\u66f4\u5f3a\u6a21\u578b\u3002"}, {"abstract": "Large language models are deployed as long-horizon agents that compose diverse tools across MCP services into executable workflows. Existing MCP environment-scaling methods are data-centric: they first synthesize a database and scenario, then derive tools and tasks from them. As a result, tool interfaces may not match real ones, tool compositions are not grounded in execution, and tasks rarely span more than one environment. We propose ToolSpace, a tool-centric framework that reverses this order. ToolSpace mines data, state, and retry dependencies from adjacent calls in execution traces of real MCP services and open agent corpora, using deterministic rules rather than LLM judgment, and clusters the resulting weighted tool-composition graph into environments. Databases are synthesized only for state-mutating environments, while query and stateless tools replay recorded returns. ToolSpace then performs state-aware random walks with rollback and decompiles each chain into a natural-language task with assertion-based checks, keeping only samples that replay successfully from the initial state. Applied to AutomationBench and tau3-Bench Banking, the pipeline produces harder Pro versions on which 7 frontier models drop by up to 38.2 points. Across seven long-horizon tool-use benchmarks, ToolSpace raises Qwen3.6-35B-A3B from 23.0 to 41.0 average score (43.2 with RL) and GLM-5.2 from 44.6 to 56.6, on par with Claude Opus 5. Ablations show that execution-witnessed edges clearly outperform LLM-judged ones, and performance keeps improving with data and environment scale.", "arxiv_id": "2611.05036", "arxiv_url": "https://arxiv.org/abs/2611.05036", "authors": ["Guanting Dong", "Zhichao Sun", "Xinyu Yang", "Rui Wang", "Xin Deng", "Jiajie Jin", "Zhixiong Yang", "Junhao Huang", "Han Han", "Mingyu Ma", "Xiaotao Wang", "Yuyang Hu", "Xiaoshuai Song", "Xiaoxi Li", "Jiejun Tan", "Zhecan Wang", "Shihan Dou", "Honglin Guo", "Zhiheng Xi", "Tao Gui", "Tao Ji", "Qi Zhang", "Yutao Zhu", "Ji-Rong Wen", "Zhicheng Dou"], "brief": "ToolSpace\u5148\u4ece\u771f\u5b9e\u8c03\u7528\u8f68\u8ff9\u63d0\u53d6\u4f9d\u8d56\u5e76\u805a\u7c7b\u5de5\u5177\u56fe\uff0c\u518d\u6309\u9700\u5408\u6210\u6570\u636e\u5e93\uff1b\u901a\u8fc7\u5e26\u56de\u6eda\u7684\u72b6\u6001\u611f\u77e5\u968f\u673a\u6e38\u8d70\u751f\u6210\u4efb\u52a1\uff0c\u4ec5\u4fdd\u7559\u65ad\u8a00\u68c0\u67e5\u4e0e\u56de\u653e\u6210\u529f\u7684\u6837\u672c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/dongguanting/ToolSpace", "github_stars": 28, "hf_url": "https://huggingface.co/papers/2611.05036", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u786e\u5b9a\u6027\u89c4\u5219\u63d0\u53d6\u6570\u636e\u3001\u72b6\u6001\u4e0e\u91cd\u8bd5\u4f9d\u8d56\uff0c\u6784\u5efa\u52a0\u6743\u5de5\u5177\u7ec4\u5408\u56fe", "\u4e24\u4e2aPro\u57fa\u51c6\u4f7f7\u4e2a\u524d\u6cbf\u6a21\u578b\u6210\u7ee9\u6700\u591a\u4e0b\u964d38.2\u5206", "\u4e03\u9879\u57fa\u51c6\u4e0aQwen\u5e73\u5747\u520623.0\u219241.0\uff0c\u5f3a\u5316\u5b66\u4e60\u540e43.2"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u73af\u5883\u5408\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Renmin University of China", "pdf_url": "https://arxiv.org/pdf/2611.05036v1", "published_at": "2026-11-03", "score": 0.329, "selected_reasons": ["HF trending (34\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05036.png", "title": "ToolSpace: Scaling Tool-Centric Environment Synthesis for Long-Horizon Agents", "tldr": "\u4ece\u771f\u5b9e\u5de5\u5177\u6267\u884c\u8f68\u8ff9\u6784\u5efa\u53ef\u56de\u653e\u73af\u5883\u4e0e\u957f\u94fe\u4efb\u52a1\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u8de8\u73af\u5883\u5de5\u5177\u4f7f\u7528\u80fd\u529b\u3002", "upvotes": 34, "what_it_is": "ToolSpace\u5148\u4ece\u771f\u5b9e\u8c03\u7528\u8f68\u8ff9\u63d0\u53d6\u4f9d\u8d56\u5e76\u805a\u7c7b\u5de5\u5177\u56fe\uff0c\u518d\u6309\u9700\u5408\u6210\u6570\u636e\u5e93\uff1b\u901a\u8fc7\u5e26\u56de\u6eda\u7684\u72b6\u6001\u611f\u77e5\u968f\u673a\u6e38\u8d70\u751f\u6210\u4efb\u52a1\uff0c\u4ec5\u4fdd\u7559\u65ad\u8a00\u68c0\u67e5\u4e0e\u56de\u653e\u6210\u529f\u7684\u6837\u672c\u3002", "why_notable": "\u628a\u73af\u5883\u5408\u6210\u951a\u5b9a\u4e8e\u771f\u5b9e\u6267\u884c\u4f9d\u8d56\uff0c\u51cf\u5c11\u865a\u6784\u63a5\u53e3\u4e0e\u4e0d\u53ef\u6267\u884c\u7ec4\u5408\uff1b\u5b9e\u9a8c\u663e\u793a\uff0c\u6269\u5c55\u6570\u636e\u548c\u73af\u5883\u89c4\u6a21\u53ef\u6301\u7eed\u63d0\u5347\u957f\u7a0b\u5de5\u5177\u4f7f\u7528\u8868\u73b0\u3002"}, {"abstract": "General-purpose robot policies must work across robots, tasks, and environments, yet the variation that makes physical trials informative also makes them difficult to reproduce. We introduce RoboColosseum, a distributed evaluation framework that combines unified policy serving and standardized protocols across a network of locally operated robots in diverse environments. Our initial study evaluates five vision-language-action (VLA) policies and three frontier AI agents across four embodiments (SO-101, Franka, Bimanual-YAM, and G1 Humanoid). The Open Track compares models without task-specific adaptation in blinded, pairwise trials under matched local conditions. The Fine-tune Track measures how well VLA policies adapt to 20 tasks across all four embodiments when each policy receives the same 100 demonstrations per task. Across 5,699 pairwise Open Track comparisons at 124 sites, frontier agents rival specialized VLA policies, while all systems struggle to complete open-world tasks reliably. After fine-tuning, GR00T N1.7 leads on SO-101 and pi0.5 leads on Franka and Bimanual-YAM. Policy rankings show weak agreement across embodiment-specific task suites (Kendall W = 0.24). Open Track rankings poorly predict relative performance after fine-tuning, with substantial rank reversals on all three embodiments shared between tracks. Measuring partial progress reveals differences that task success alone misses. On the G1 Humanoid, no policy completes any of the five tasks, yet average progress ranges from 13.3% to 23.2% across policies. Open Track rankings stabilize as trials accumulate, and active matchmaking achieves comparable ranking agreement with substantially fewer physical trials than uniform sampling. These results show how distributed physical evaluation can reveal where robot policies generalize, how well they adapt to new tasks, and how far they progress on tasks they fail to complete.", "arxiv_id": "2611.02497", "arxiv_url": "https://arxiv.org/abs/2611.02497", "authors": ["Tan Sang Nguyen", "Yi Ru Wang", "Shailesh Shailesh", "Gang Yang", "Jiamo Hu", "Jianuo Jiang", "Haoquan Fang", "Zhongzheng Ren", "Zhongyi Luo", "Ian Chong", "Aaron Tung", "Santiago Pravisani", "Minghui Lin", "Yao Mo", "Ishneet Singh", "Benjamin Tee", "Harold Soh", "Siddhartha Srinivasa", "Dieter Fox", "David Hsu", "Haoming Song", "Maxime Ellerbach", "Thomas Wolf", "Pepijn Kooijmans", "Ruijie He", "Michael Cho", "Jiafei Duan"], "brief": "\u63d0\u51fa\u5206\u5e03\u5f0f\u5b9e\u673a\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ee5\u7edf\u4e00\u7b56\u7565\u670d\u52a1\u548c\u6807\u51c6\u5316\u534f\u8bae\u8fde\u63a5\u5404\u5730\u673a\u5668\u4eba\u3002\u901a\u8fc7\u76f2\u6d4b\u914d\u5bf9\u4e0e\u7b49\u91cf\u793a\u8303\u5fae\u8c03\uff0c\u6bd4\u8f83\u6a21\u578b\u8de8\u5177\u8eab\u6cdb\u5316\u3001\u9002\u5e94\u80fd\u529b\u53ca\u4efb\u52a1\u8fdb\u5c55\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/RoboColosseum/robocolosseum-client", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.02497", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["124\u4e2a\u7ad9\u70b9\u5b8c\u62105699\u6b21\u914d\u5bf9\uff0c\u8bc4\u6d4b5\u79cdVLA\u4e0e3\u79cd\u667a\u80fd\u4f53", "\u5fae\u8c03\u8986\u76d64\u79cd\u5177\u8eab\u300120\u9879\u4efb\u52a1\uff0c\u6bcf\u4efb\u52a1\u7edf\u4e00\u63d0\u4f9b100\u6761\u793a\u8303", "\u8de8\u5177\u8eab\u6392\u540d\u4e00\u81f4\u6027\u5f31\uff1aKendall W\u4ec50.24"], "keywords": ["\u673a\u5668\u4eba\u8bc4\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": "Hugging Face", "pdf_url": "https://arxiv.org/pdf/2611.02497v1", "published_at": "2026-11-02", "score": 0.318, "selected_reasons": ["HF trending (44\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02497.png", "title": "RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild", "tldr": "\u8de8\u5730\u70b9\u5b9e\u673a\u8bc4\u6d4b\u663e\u793a\uff0c\u673a\u5668\u4eba\u7b56\u7565\u6392\u540d\u968f\u5177\u8eab\u4e0e\u5fae\u8c03\u53d8\u5316\uff0c\u901a\u7528\u53ef\u9760\u6027\u4ecd\u4e0d\u8db3\u3002", "upvotes": 44, "what_it_is": "\u63d0\u51fa\u5206\u5e03\u5f0f\u5b9e\u673a\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ee5\u7edf\u4e00\u7b56\u7565\u670d\u52a1\u548c\u6807\u51c6\u5316\u534f\u8bae\u8fde\u63a5\u5404\u5730\u673a\u5668\u4eba\u3002\u901a\u8fc7\u76f2\u6d4b\u914d\u5bf9\u4e0e\u7b49\u91cf\u793a\u8303\u5fae\u8c03\uff0c\u6bd4\u8f83\u6a21\u578b\u8de8\u5177\u8eab\u6cdb\u5316\u3001\u9002\u5e94\u80fd\u529b\u53ca\u4efb\u52a1\u8fdb\u5c55\u3002", "why_notable": "\u5c06\u771f\u5b9e\u73af\u5883\u5dee\u5f02\u7eb3\u5165\u89c4\u6a21\u5316\u8bc4\u6d4b\uff0c\u63ed\u793a\u96f6\u6837\u672c\u6392\u540d\u96be\u9884\u6d4b\u5fae\u8c03\u8868\u73b0\uff1b\u90e8\u5206\u8fdb\u5c55\u6307\u6807\u8fd8\u80fd\u533a\u5206\u6210\u529f\u7387\u5747\u4e3a\u96f6\u7684\u7b56\u7565\u3002"}, {"abstract": "Learning a universal action representation from video requires modeling dynamics that are consistent across different executions of the same action yet invariant to changes in embodiment and appearance. Existing latent action models infer actions from visual transitions, but their representations often entangle the underlying action with irrelevant visual variations, limiting transfer across embodiments. We introduce DreamX, which repurposes a pretrained video diffusion model as a universal latent action learner. Our approach extracts compact latent actions from the video model\u0027s rich spatiotemporal features, compressing each latent video frame by $\\boldsymbol{300\\times}$ ($\\boldsymbol{1{,}200 \\rightarrow 4}$ tokens). In addition, by leveraging the video model\u0027s generative prior, these latent actions capture action-relevant dynamics disentangled from visual appearance. The resulting latent space serves as a shared action interface across embodiments (human and robot), environments, and action parameterizations. On LARY-Bench, DreamX achieves state-of-the-art performance among latent action models. Moreover, actions encoded in one setting remain effective in another: the latent space supports any-to-any video transfer and zero-shot action transfer across diverse embodiments and environments. Furthermore, this shared interface also enables policy learning in a compact latent action space, reducing the computational cost of video-diffusion-based policies.", "arxiv_id": "2611.05377", "arxiv_url": "https://arxiv.org/abs/2611.05377", "authors": ["Jisoo Kim", "Chaehyun Kim", "Junsu Kim", "Jiho Park", "Seongchan Kim", "Eunbeen Hong", "Soowon Son", "Fu-En Yang", "Seungryong Kim"], "brief": "DreamX\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u6539\u9020\u4e3a\u6f5c\u52a8\u4f5c\u5b66\u4e60\u5668\uff0c\u4ece\u65f6\u7a7a\u7279\u5f81\u4e2d\u63d0\u53d6\u7d27\u51d1\u52a8\u4f5c\u7f16\u7801\uff0c\u5e76\u501f\u52a9\u751f\u6210\u5148\u9a8c\u5206\u79bb\u52a8\u4f5c\u52a8\u6001\u4e0e\u5916\u89c2\u53d8\u5316\uff0c\u6784\u5efa\u8de8\u5f62\u6001\u5171\u4eab\u52a8\u4f5c\u63a5\u53e3\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05377", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6bcf\u4e2a\u6f5c\u89c6\u9891\u5e27\u4ece1200\u538b\u81f34\u4e2a\u8bcd\u5143\uff0c\u5b9e\u73b0300\u500d\u538b\u7f29", "\u5728LARY-Bench\u4e0a\u8fbe\u5230\u6f5c\u52a8\u4f5c\u6a21\u578b\u6700\u4f18\u8868\u73b0", "\u652f\u6301\u4efb\u610f\u5230\u4efb\u610f\u89c6\u9891\u8fc1\u79fb\u53ca\u8de8\u5f62\u6001\u96f6\u6837\u672c\u52a8\u4f5c\u8fc1\u79fb"], "keywords": ["\u89c6\u9891\u6269\u6563\u6a21\u578b", "\u6f5c\u52a8\u
