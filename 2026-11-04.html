06\u6790\u8bc4\u5206\u4e0e\u6539\u8fdb\u7684\u4e00\u81f4\u6027\u3002", "why_notable": "\u7814\u7a76\u63ed\u793aAI\u5ba1\u7a3f\u5bf9\u5b9e\u8d28\u4fee\u8ba2\u7684\u8bc6\u522b\u4e0d\u8db3\u53ca\u5bf9\u7528\u6237\u7acb\u573a\u7684\u654f\u611f\u6027\uff0c\u4e3a\u6784\u5efa\u8bc1\u636e\u5173\u8054\u66f4\u5f3a\u3001\u8bc4\u5206\u66f4\u7a33\u5b9a\u7684\u8bc4\u5ba1\u673a\u5236\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Missing modality imputation aims to synthesize unobserved modalities from observed ones. Existing methods treat each modality as living on its own latent manifold, forcing the generator to learn a long, unstructured jump between them. We present SphereFlow, which takes a fundamentally different view: by projecting all modalities into a shared hyperspherical latent space via a frozen self-supervised encoder, cross-modal imputation reduces to short-range geometric transport between nearby points on the sphere. Realizing this idea with flow matching, however, exposes two geometric conflicts: the standard Gaussian noise source is catastrophically mismatched with the unit-norm data manifold, and the linear interpolation path departs the sphere surface into a region where the decoder has no training signal. We resolve both with simple, geometry-aware modifications: replacing the noise source with the observed-modality latent so that the velocity field learns only the cross-modal displacement, and training the decoder with a time-weighted loss that extends its domain to the near-surface region traversed by the flow. We prove that this data-as-source formulation reduces the worst-case off-manifold deviation from a quantity that grows with the latent dimension to a small, dimension-independent bound governed by inter-modality similarity. Experiments on BraTS multi-modal MRI imputation and CT-MRI translation demonstrate state-of-the-art generation fidelity across all settings, while downstream brain tumor segmentation with our imputed data closes roughly eighty percent of the gap to the full-modality oracle. Code is available at https://github.com/WTHH031230/SphereFlow.", "arxiv_id": "2611.04414", "arxiv_url": "https://arxiv.org/abs/2611.04414", "authors": ["Huihan Wang", "Juncheng Wang", "Yuxiang Feng", "Wenlong Hou", "Guoqi Yu", "Chao Xu", "Yang Liu", "Baigui Sun", "Shujun Wang"], "brief": "SphereFlow\u7528\u51bb\u7ed3\u7684\u81ea\u76d1\u7763\u7f16\u7801\u5668\u5c06\u5404\u6a21\u6001\u6620\u5c04\u5230\u5171\u4eab\u8d85\u7403\u9762\uff0c\u4ee5\u89c2\u6d4b\u6a21\u6001\u6f5c\u53d8\u91cf\u4f5c\u4e3a\u6d41\u5339\u914d\u8d77\u70b9\uff0c\u5e76\u7528\u65f6\u95f4\u52a0\u6743\u635f\u5931\u8bad\u7ec3\u89e3\u7801\u5668\u9002\u5e94\u8fd1\u7403\u9762\u8def\u5f84\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/WTHH031230/SphereFlow", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.04414", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u89c2\u6d4b\u6a21\u6001\u6f5c\u53d8\u91cf\u66ff\u4ee3\u9ad8\u65af\u566a\u58f0\uff0c\u4ec5\u5b66\u4e60\u8de8\u6a21\u6001\u4f4d\u79fb", "\u8bc1\u660e\u504f\u79bb\u6d41\u5f62\u7684\u6700\u574f\u754c\u4e0e\u7ef4\u5ea6\u65e0\u5173\uff0c\u7531\u6a21\u6001\u76f8\u4f3c\u5ea6\u63a7\u5236", "BraTS\u8865\u5168\u4e0eCT-MRI\u8f6c\u6362\u9886\u5148\uff0c\u5206\u5272\u7f29\u5c0f\u7ea680%\u5dee\u8ddd"], "keywords": ["\u7f3a\u5931\u6a21\u6001\u8865\u5168", "\u6d41\u5339\u914d", "\u51e0\u4f55\u5b66\u4e60", "\u533b\u5b66\u5f71\u50cf"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04414v1", "published_at": "2026-11-03", "score": 0.231, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04414.png", "title": "SphereFlow: Missing Modality Imputation via Geometric Transport on Hypersphere", "tldr": "\u5c06\u591a\u6a21\u6001\u6620\u5c04\u5230\u5171\u4eab\u8d85\u7403\u9762\uff0c\u4ee5\u77ed\u7a0b\u51e0\u4f55\u6d41\u8865\u5168\u7f3a\u5931\u5f71\u50cf\u5e76\u6539\u5584\u80bf\u7624\u5206\u5272\u3002", "upvotes": 1, "what_it_is": "SphereFlow\u7528\u51bb\u7ed3\u7684\u81ea\u76d1\u7763\u7f16\u7801\u5668\u5c06\u5404\u6a21\u6001\u6620\u5c04\u5230\u5171\u4eab\u8d85\u7403\u9762\uff0c\u4ee5\u89c2\u6d4b\u6a21\u6001\u6f5c\u53d8\u91cf\u4f5c\u4e3a\u6d41\u5339\u914d\u8d77\u70b9\uff0c\u5e76\u7528\u65f6\u95f4\u52a0\u6743\u635f\u5931\u8bad\u7ec3\u89e3\u7801\u5668\u9002\u5e94\u8fd1\u7403\u9762\u8def\u5f84\u3002", "why_notable": "\u628a\u8de8\u6a21\u6001\u751f\u6210\u8f6c\u5316\u4e3a\u5171\u4eab\u7a7a\u95f4\u5185\u7684\u77ed\u7a0b\u8fd0\u8f93\uff0c\u517c\u987e\u51e0\u4f55\u7ea6\u675f\u4e0e\u89e3\u7801\u9002\u914d\uff1b\u4e0d\u4ec5\u63d0\u5347\u5f71\u50cf\u4fdd\u771f\u5ea6\uff0c\u8fd8\u660e\u663e\u6539\u5584\u4e0b\u6e38\u5206\u5272\u3002"}, {"abstract": "Byte level language models avoid tokenizer dependence and provide universal coverage, but processing every byte at full resolution is expensive. We introduce DeepMem, a causal multiscale architecture that separates semantic compression from exact byte preservation. A learned invertible subband transform constructs a hierarchy of shorter sequences, while a lossless carrier and explicit detail sidebands preserve byte identity. Fast weight memory blocks operate along the encoder, with iterative shared state computation at the compressed bottleneck, while an attention based super resolution decoder restores byte resolution representations. DeepMem achieves stronger language modeling performance than a matched byte level Transformer on FineWeb-Edu and PG19, and obtains the best macro average performance across the evaluated FLORES languages. It also improves PIQA accuracy while remaining competitive on code modeling, multiple choice reasoning, and byte level corruption robustness. Bottleneck refinement requires approximately $7{,}600\\times$ fewer counted FLOPs than equivalent full resolution reasoning, while maintaining competitive evaluation throughput.", "arxiv_id": "2611.05255", "arxiv_url": "https://arxiv.org/abs/2611.05255", "authors": ["Afshin Khadangi"], "brief": "\u63d0\u51fa\u56e0\u679c\u591a\u5c3a\u5ea6\u5b57\u8282\u6a21\u578b\uff0c\u5c06\u8bed\u4e49\u538b\u7f29\u4e0e\u5b57\u8282\u4fdd\u771f\u5206\u79bb\u3002\u4ee5\u53ef\u9006\u5b50\u5e26\u53d8\u6362\u7f29\u77ed\u5e8f\u5217\uff0c\u5728\u538b\u7f29\u74f6\u9888\u8fed\u4ee3\u5171\u4eab\u72b6\u6001\uff0c\u518d\u7531\u6ce8\u610f\u529b\u8d85\u5206\u8fa8\u7387\u89e3\u7801\u5668\u6062\u590d\u5b57\u8282\u5206\u8fa8\u7387\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/akhadangi/deepmem", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05255", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53ef\u9006\u5b50\u5e26\u53d8\u6362\u914d\u5408\u65e0\u635f\u8f7d\u4f53\u4e0e\u7ec6\u8282\u65c1\u5e26\u4fdd\u7559\u5b57\u8282\u8eab\u4efd", "\u7f16\u7801\u5668\u4f7f\u7528\u5feb\u6743\u91cd\u8bb0\u5fc6\u5757\uff0c\u74f6\u9888\u7cbe\u70bc\u8ba1\u6570FLOPs\u7ea6\u5c117600\u500d", "\u4f18\u4e8e\u5339\u914d\u7684\u5b57\u8282Transformer\uff0cFLORES\u5b8f\u5e73\u5747\u6700\u4f73"], "keywords": ["\u5b57\u8282\u7ea7\u8bed\u8a00\u6a21\u578b", "\u591a\u5c3a\u5ea6\u67b6\u6784", "\u8bb0\u5fc6\u673a\u5236", "\u53ef\u9006\u53d8\u6362"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05255v1", "published_at": "2026-11-03", "score": 0.225, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05255.png", "title": "Going Deeper With Memories", "tldr": "DeepMem\u4ee5\u53ef\u9006\u591a\u5c3a\u5ea6\u538b\u7f29\u4e0e\u8bb0\u5fc6\u8ba1\u7b97\uff0c\u63d0\u5347\u5b57\u8282\u7ea7\u5efa\u6a21\u5e76\u964d\u4f4e\u63a8\u7406\u5f00\u9500\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51fa\u56e0\u679c\u591a\u5c3a\u5ea6\u5b57\u8282\u6a21\u578b\uff0c\u5c06\u8bed\u4e49\u538b\u7f29\u4e0e\u5b57\u8282\u4fdd\u771f\u5206\u79bb\u3002\u4ee5\u53ef\u9006\u5b50\u5e26\u53d8\u6362\u7f29\u77ed\u5e8f\u5217\uff0c\u5728\u538b\u7f29\u74f6\u9888\u8fed\u4ee3\u5171\u4eab\u72b6\u6001\uff0c\u518d\u7531\u6ce8\u610f\u529b\u8d85\u5206\u8fa8\u7387\u89e3\u7801\u5668\u6062\u590d\u5b57\u8282\u5206\u8fa8\u7387\u3002", "why_notable": "\u5b83\u4e3a\u65e0\u5206\u8bcd\u5668\u5efa\u6a21\u63d0\u4f9b\u4e86\u517c\u987e\u5b57\u8282\u4fdd\u771f\u4e0e\u538b\u7f29\u8ba1\u7b97\u7684\u8def\u5f84\uff0c\u5e76\u5728\u8bed\u8a00\u5efa\u6a21\u3001\u591a\u8bed\u8a00\u8bc4\u6d4b\u548c\u5e38\u8bc6\u4efb\u52a1\u4e0a\u5c55\u793a\u6536\u76ca\u3002"}, {"abstract": "Genomic foundation models are increasingly used to propose DNA sequences and edits. But successful design requires capabilities that current benchmarks do not measure. Here we introduce BEND 2.0 (BENchmark for DNA language models), which tests how well models predict the effects of DNA changes and whether these predictions can guide sequence design. Across eight tasks built on five experimental datasets, we find that model choice and how representations are accessed both affect performance. Linear readouts fitted to frozen representations can match or exceed models\u0027 native outputs, and functional post-training substantially improves the models\u0027 capabilities. Linear readouts transfer well across experimental assays and genes, suggesting that models capture functional patterns beyond the data used to fit individual predictors. At the same time, strong prediction of average effects can conceal weaker prediction of context-specific effects, and accurate prediction of combined mutation effects does not imply accurate prediction of their interactions. In design tasks, model predictions can reduce the number of candidates needed to find a desired response, but still leave substantial room for better design choices, particularly for context-specific and multi-cell objectives. Our benchmark reveals that genomic models now display signs of general utility but have yet to saturate on performance in even simple tasks.", "arxiv_id": "2611.03806", "arxiv_url": "https://arxiv.org/abs/2611.03806", "authors": ["Andreas Bjerregaard", "Rachael DeVries", "Dionysia Danai Brilli", "Panagiotis Antoniadis", "Yan Li", "Anders Krogh", "Wouter Boomsma", "Ole Winther", "Frederikke Isa Marin"], "brief": "BEND 2.0\u57fa\u4e8e\u5b9e\u9a8c\u6570\u636e\u8bc4\u4f30DNA\u53d8\u66f4\u6548\u5e94\u9884\u6d4b\u53ca\u5e8f\u5217\u8bbe\u8ba1\u80fd\u529b\uff0c\u6bd4\u8f83\u6a21\u578b\u539f\u751f\u8f93\u51fa\u3001\u51bb\u7ed3\u8868\u5f81\u7684\u7ebf\u6027\u8bfb\u51fa\u4e0e\u529f\u80fd\u540e\u8bad\u7ec3\uff0c\u68c0\u9a8c\u9884\u6d4b\u80fd\u5426\u6709\u6548\u6307\u5bfc\u8bbe\u8ba1\u3002", "categories": ["q-bio.GN", "cs.LG", "q-bio.QM"], "github_repo": "https://github.com/MachineLearningLifeScience/BEND2", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.03806", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e5\u4e2a\u5b9e\u9a8c\u6570\u636e\u96c6\u6784\u5efa8\u9879\u9884\u6d4b\u4e0e\u8bbe\u8ba1\u4efb\u52a1", "\u51bb\u7ed3\u8868\u5f81\u7684\u7ebf\u6027\u8bfb\u51fa\u53ef\u8ffd\u5e73\u6216\u8d85\u8d8a\u539f\u751f\u8f93\u51fa", "\u7ec4\u5408\u7a81\u53d8\u6548\u5e94\u9884\u6d4b\u51c6\u786e\uff0c\u4e0d\u4ee3\u8868\u7a81\u53d8\u4ea4\u4e92\u9884\u6d4b\u51c6\u786e"], "keywords": ["\u57fa\u56e0\u7ec4\u57fa\u7840\u6a21\u578b", "DNA\u8bbe\u8ba1", "\u6a21\u578b\u8bc4\u6d4b", "\u7a81\u53d8\u6548\u5e94"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03806v1", "published_at": "2026-11-02", "score": 0.22, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03806.png", "title": "BEND 2.0: Benchmarking the Capabilities Needed to Design DNA", "tldr": "\u65b0\u57fa\u51c6\u68c0\u9a8c\u57fa\u56e0\u7ec4\u6a21\u578b\u6307\u5bfcDNA\u8bbe\u8ba1\u7684\u80fd\u529b\uff0c\u63ed\u793a\u9884\u6d4b\u51c6\u786e\u4e0d\u7b49\u4e8e\u8bbe\u8ba1\u53ef\u9760\u3002", "upvotes": 2, "what_it_is": "BEND 2.0\u57fa\u4e8e\u5b9e\u9a8c\u6570\u636e\u8bc4\u4f30DNA\u53d8\u66f4\u6548\u5e94\u9884\u6d4b\u53ca\u5e8f\u5217\u8bbe\u8ba1\u80fd\u529b\uff0c\u6bd4\u8f83\u6a21\u578b\u539f\u751f\u8f93\u51fa\u3001\u51bb\u7ed3\u8868\u5f81\u7684\u7ebf\u6027\u8bfb\u51fa\u4e0e\u529f\u80fd\u540e\u8bad\u7ec3\uff0c\u68c0\u9a8c\u9884\u6d4b\u80fd\u5426\u6709\u6548\u6307\u5bfc\u8bbe\u8ba1\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u6548\u5e94\u9884\u6d4b\u63a8\u8fdb\u5230\u8bbe\u8ba1\u5b9e\u7528\u6027\uff1a\u6a21\u578b\u80fd\u51cf\u5c11\u5019\u9009\u7b5b\u9009\u91cf\uff0c\u4f46\u60c5\u5883\u7279\u5f02\u6027\u4e0e\u591a\u7ec6\u80de\u76ee\u6807\u4ecd\u66b4\u9732\u660e\u663e\u77ed\u677f\u3002"}, {"abstract": "Unified multimodal models (UMMs) integrate image generation and visual understanding, but are existing single-pathway unlearning methods sufficient to suppress target concepts across both? In this work, we study cross-pathway concept unlearning. Our goal is to prevent a model from both generating images of a target concept and identifying it in input images, while preserving other capabilities. To this end, we introduce UUBench, a diagnostic benchmark covering 30 target concepts and 60 semantically related neighboring concepts. Experiments on representative UMMs show that the evaluated single-pathway methods achieve limited joint forgetting: generation-side editors strongly suppress target generation but yield limited forgetting in visual understanding, while understanding-side baselines struggle to achieve substantial forgetting even in their own pathway. Their direct composition also yields limited joint forgetting. We therefore propose UniForget, achieving joint forgetting rates of 80.0% on BAGEL-7B-MoT and 92.7% on Janus-Pro-7B, outperforming representative baselines. Further analysis reveals trade-offs between joint forgetting and capability preservation.", "arxiv_id": "2611.04467", "arxiv_url": "https://arxiv.org/abs/2611.04467", "authors": ["Zhongkai Xue", "Junkai Chen", "Mingcong Lei", "Rumo Zhang", "Yixiao Liu", "Zhimin Sun", "Shu Wu", "Qiang Liu", "Lihua Zhang", "Liang Wang"], "brief": "\u7814\u7a76\u5982\u4f55\u8ba9\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u540c\u65f6\u505c\u6b62\u751f\u6210\u548c\u8bc6\u522b\u76ee\u6807\u6982\u5ff5\uff0c\u5e76\u4fdd\u7559\u5176\u4ed6\u80fd\u529b\u3002\u6784\u5efa\u8de8\u8def\u5f84\u8bca\u65ad\u57fa\u51c6UUBench\uff0c\u63d0\u51fa\u8054\u5408\u9057\u5fd8\u65b9\u6cd5UniForget\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04467", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["UUBench\u8986\u76d630\u4e2a\u76ee\u6807\u6982\u5ff5\u53ca60\u4e2a\u8bed\u4e49\u90bb\u8fd1\u6982\u5ff5", "\u5355\u8def\u5f84\u9057\u5fd8\u65b9\u6cd5\u53ca\u5176\u76f4\u63a5\u7ec4\u5408\u5747\u96be\u5b9e\u73b0\u5145\u5206\u8054\u5408\u9057\u5fd8", "UniForget\u5728\u4e24\u6b3e7B\u6a21\u578b\u4e0a\u8fbe80.0%\u548c92.7%\u8054\u5408\u9057\u5fd8\u7387"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u6982\u5ff5\u7f16\u8f91", "\u8bc4\u4f30\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "Chinese Academic of Science Institute of Automation", "pdf_url": "https://arxiv.org/pdf/2611.04467v1", "published_at": "2026-11-03", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04467.png", "title": "Is Forgetting Unified? Exploring Concept Unlearning in Unified Multimodal Models", "tldr": "\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u6982\u5ff5\u9057\u5fd8\u9700\u517c\u987e\u751f\u6210\u4e0e\u7406\u89e3\uff0c\u5355\u8def\u5f84\u7f16\u8f91\u96be\u4ee5\u594f\u6548\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5982\u4f55\u8ba9\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u540c\u65f6\u505c\u6b62\u751f\u6210\u548c\u8bc6\u522b\u76ee\u6807\u6982\u5ff5\uff0c\u5e76\u4fdd\u7559\u5176\u4ed6\u80fd\u529b\u3002\u6784\u5efa\u8de8\u8def\u5f84\u8bca\u65ad\u57fa\u51c6UUBench\uff0c\u63d0\u51fa\u8054\u5408\u9057\u5fd8\u65b9\u6cd5UniForget\u3002", "why_notable": "\u5c06\u6982\u5ff5\u9057\u5fd8\u7684\u8bc4\u4f30\u4ece\u5355\u4e00\u751f\u6210\u6216\u7406\u89e3\u6269\u5c55\u5230\u53cc\u8def\u5f84\uff0c\u63ed\u793a\u9057\u5fd8\u6548\u679c\u4e0e\u80fd\u529b\u4fdd\u7559\u7684\u6743\u8861\uff0c\u4e3a\u7edf\u4e00\u6a21\u578b\u7684\u5b89\u5168\u7f16\u8f91\u63d0\u4f9b\u53c2\u7167\u3002"}, {"abstract": "Training-free expert pruning makes two decisions: which experts to remove, and what the layer computes when its router still selects a removed expert. Published methods change both at once. Holding the mask fixed, we compare replacement operators from three families on OLMoE, DeepSeek-V2-Lite and Moonlight, with Granite as a fourth router, using paired, multiplicity-corrected tests. The largest effect is a choice usually left implicit: the survivors\u0027 gate scale. On routers trained without top-k renormalization, renormalizing the survivors\u0027 gates, a common implementation choice, costs 0.8-8.5 points and reverses whether rerouting beats MoNE\u0027s mean-output replacement; on two routers trained with renormalization, the trained scale wins at 50% pruning. We introduce the tilted novice, a closed-form low-rank map of the pruned expert\u0027s input whose rank-0 case is MoNE\u0027s constant. At 50% pruning it adds 1.2-1.8% parameters and gains 3.45 and 1.37 points over the constant on OLMoE and Moonlight, stable across calibration draws and largely unchanged by 4- and 3-bit quantization. No operator dominates: trained-scale rerouting is best on DeepSeek-V2-Lite, and a partial copy of each pruned expert is statistically indistinguishable from the tilted novice on two models. Evaluation can change conclusions: at 25% pruning MoNE\u0027s constant keeps 92-97% of dense multiple-choice accuracy but only 5-65% of GSM8K and 0-17% of code scores, and the calibration domain moves the mask 4-9 times more than resampling. We propose a five-item reporting checklist.", "arxiv_id": "2610.41366", "arxiv_url": "https://arxiv.org/abs/2610.41366", "authors": ["Ezza Ali", "Sehrish Bibi", "Momina Moetesum", "Faisal Shafait"], "brief": "\u7814\u7a76\u56fa\u5b9a\u526a\u679d\u63a9\u7801\uff0c\u5206\u79bb\u6bd4\u8f83\u4e09\u7c7b\u4e13\u5bb6\u66ff\u4ee3\u7b97\u5b50\u4e0e\u8def\u7531\u8bed\u4e49\uff1b\u63d0\u51fa\u95ed\u5f0f\u4f4e\u79e9\u6620\u5c04 tilted novice\uff0c\u5e76\u68c0\u9a8c\u91cf\u5316\u3001\u6821\u51c6\u57df\u53ca\u8bc4\u6d4b\u4efb\u52a1\u7684\u5f71\u54cd\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41366", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u672a\u6309\u91cd\u5f52\u4e00\u5316\u8bad\u7ec3\u7684\u8def\u7531\u5668\uff0c\u91cd\u5f52\u4e00\u5316\u635f\u59310.8\u20148.5\u5206", "tilted novice\u572850%\u526a\u679d\u4e0b\u63d0\u53473.45\u53ca1.37\u5206", "25%\u526a\u679d\u65f6\uff0cMoNE\u4ec5\u4fdd\u75590\u201417%\u7684\u4ee3\u7801\u5f97\u5206"], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u6a21\u578b\u526a\u679d", "\u8def\u7531\u673a\u5236", "\u4f4e\u79e9\u8fd1\u4f3c"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.41366v1", "published_at": "2026-10-30", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41366.png", "title": "What We Keep of What We Forget: Replacement Operators and Routing Semantics in Training-Free MoE Expert Pruning", "tldr": "\u514d\u8bad\u7ec3\u4e13\u5bb6\u526a\u679d\u4e0d\u4ec5\u53d6\u51b3\u4e8e\u5220\u8c01\uff0c\u95e8\u63a7\u5c3a\u5ea6\u4e0e\u66ff\u4ee3\u7b97\u5b50\u4e5f\u4f1a\u663e\u8457\u6539\u53d8\u6548\u679c\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u56fa\u5b9a\u526a\u679d\u63a9\u7801\uff0c\u5206\u79bb\u6bd4\u8f83\u4e09\u7c7b\u4e13\u5bb6\u66ff\u4ee3\u7b97\u5b50\u4e0e\u8def\u7531\u8bed\u4e49\uff1b\u63d0\u51fa\u95ed\u5f0f\u4f4e\u79e9\u6620\u5c04 tilted novice\uff0c\u5e76\u68c0\u9a8c\u91cf\u5316\u3001\u6821\u51c6\u57df\u53ca\u8bc4\u6d4b\u4efb\u52a1\u7684\u5f71\u54cd\u3002", "why_notable": "\u63ed\u793a\u5e38\u88ab\u5ffd\u7565\u7684\u95e8\u63a7\u5c3a\u5ea6\u8db3\u4ee5\u9006\u8f6c\u65b9\u6cd5\u6392\u540d\uff0c\u4e5f\u8bf4\u660e\u9009\u62e9\u9898\u6210\u7ee9\u4e0d\u80fd\u4ee3\u8868\u63a8\u7406\u4e0e\u4ee3\u7801\u80fd\u529b\uff0c\u4e3a\u53ef\u9760\u6bd4\u8f83\u4e13\u5bb6\u526a\u679d\u65b9\u6cd5\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Large language models are candidates for collecting and analyzing records in criminal investigations and mass surveillance. Their capability and accuracy in this work cannot currently be measured. Real deployments lack the ground truth needed to score a model\u0027s conclusions, and no benchmark evaluates these capabilities in a simulated environment. We present Kierston, a city-scale simulation engine, and KierstonBench, a benchmark that tests these capabilities against known simulated events. Kierston models approximately 125,000 residents of Allentown, Pennsylvania, generating their daily activities and the telecommunications, financial, administrative and license-plate records that surveillance and investigative systems collect about them. These records derive from a common behavioral timeline and are distributed across sources representing separate providers. Models investigate through a restricted records interface, linking observations across sources without access to the underlying simulation. The benchmark comprises 32 task families covering record linkage, routine reconstruction, incident investigation and assessment of deceptive accounts. In an evaluation of sixteen language models, most could not perform records investigation and submitted identifications the records did not support. A small number of frontier models solved most of the tasks and abstained when evidence was insufficient. In some cases these models still fell for common deceptions and assumptions, and none replaced an investigator.", "arxiv_id": "2611.04785", "arxiv_url": "https://arxiv.org/abs/2611.04785", "authors": ["Andrew Semenov", "Svyatoslav Dorofeev"], "brief": "\u6784\u5efa\u57ce\u5e02\u7ea7\u6a21\u62df\u5f15\u64ce\u4e0e\u8c03\u67e5\u57fa\u51c6\uff0c\u4ee5\u7edf\u4e00\u884c\u4e3a\u65f6\u95f4\u7ebf\u751f\u6210\u8de8\u673a\u6784\u8bb0\u5f55\u3002\u6a21\u578b\u4ec5\u901a\u8fc7\u53d7\u9650\u63a5\u53e3\u8c03\u67e5\uff0c\u518d\u7528\u5df2\u77e5\u6a21\u62df\u4e8b\u4ef6\u68c0\u9a8c\u5176\u7ed3\u8bba\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Kiz8-Team/kierston-oss", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04785", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["Kierston\u6a21\u62df\u7ea612.5\u4e07\u5c45\u6c11\u53ca\u591a\u6e90\u8bb0\u5f55", "KierstonBench\u542b32\u7c7b\u4efb\u52a1\uff0c\u6d4b\u8bd516\u4e2a\u6a21\u578b", "\u5c11\u6570\u524d\u6cbf\u6a21\u578b\u5b8c\u6210\u591a\u6570\u4efb\u52a1\uff0c\u4f46\u4ecd\u53d7\u5e38\u89c1\u9a97\u5c40\u8bef\u5bfc"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4eff\u771f\u8bc4\u6d4b", "\u5211\u4e8b\u8c03\u67e5", "\u8bb0\u5f55\u5173\u8054"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04785v1", "published_at": "2026-11-03", "score": 0.202, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04785.png", "title": "Kierston \u0026 KierstonBench: Simulation of Allentown, PA and Evaluation of Language Models in Crime Investigation and Surveillance Tasks", "tldr": "\u57ce\u5e02\u7ea7\u6a21\u62df\u f the rise and slightly improved the loss. Moving only the router to AdamW made the loads shift more during the warmup and slightly raised the loss, so at this scale the results favor keeping the router on Muon.", "arxiv_id": "2610.37914", "arxiv_url": "https://arxiv.org/abs/2610.37914", "authors": ["Marcos Hernanz"], "brief": "\u7814\u7a76\u5728\u4e24\u79cd\u89c4\u6a21\u7684\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u4e2d\u6bd4\u8f83Muon\u4e0eAdamW\uff0c\u4ee5\u8def\u7531\u504f\u7f6e\u8de8\u5ea6\u8861\u91cf\u8d1f\u8f7d\u5e73\u8861\u96be\u5ea6\uff0c\u5e76\u901a\u8fc7\u5207\u6362\u8def\u7531\u5668\u4f18\u5316\u5668\u3001\u8f93\u5165\u53bb\u5747\u503c\u548c\u964d\u4f4e\u5b66\u4e60\u7387\u5b9a\u4f4d\u539f\u56e0\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/marcoshernanz/muon-moe-routing", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37914", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["55M\u4e0e108M\u6d3b\u8dc3\u53c2\u6570\u6a21\u578b\u4e2d\uff0cMuon\u4f7f\u9996\u5c42\u504f\u7f6e\u8de8\u5ea6\u5e73\u5747\u7ea6\u7ffb\u500d", "\u5931\u8861\u6e90\u4e8e\u7f51\u7edc\u5176\u4f59\u90e8\u5206\u4f7f\u7528Muon\uff0c\u6700\u5fd9\u4e13\u5bb6\u8d1f\u8f7d\u8fbe\u516c\u5e73\u4efd\u989d4\u81f37\u500d", "\u524d3000\u6b65\u8f93\u5165\u53bb\u5747\u503c\u6d88\u9664\u8fc7\u8f7d\uff0c\u635f\u5931\u51e0\u4e4e\u4e0d\u53d8"], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u4f18\u5316\u5668", "\u8d1f\u8f7d\u5747\u8861", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37914v1", "published_at": "2026-10-27", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37914.png", "title": "Muon Makes the First Mixture-of-Experts Layer Harder to Balance", "tldr": "Muon\u52a0\u5267\u9996\u4e2a\u4e13\u5bb6\u5c42\u7684\u8d1f\u8f7d\u5931\u8861\uff0c\u8f93\u5165\u53bb\u5747\u503c\u53ef\u7f13\u89e3\u4e14\u51e0\u4e4e\u4e0d\u5f71\u54cd\u635f\u5931\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5728\u4e24\u79cd\u89c4\u6a21\u7684\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u4e2d\u6bd4\u8f83Muon\u4e0eAdamW\uff0c\u4ee5\u8def\u7531\u504f\u7f6e\u8de8\u5ea6\u8861\u91cf\u8d1f\u8f7d\u5e73\u8861\u96be\u5ea6\uff0c\u5e76\u901a\u8fc7\u5207\u6362\u8def\u7531\u5668\u4f18\u5316\u5668\u3001\u8f93\u5165\u53bb\u5747\u503c\u548c\u964d\u4f4e\u5b66\u4e60\u7387\u5b9a\u4f4d\u539f\u56e0\u3002", "why_notable": "\u7ed3\u679c\u63ed\u793a\u4f18\u5316\u5668\u53ef\u901a\u8fc7\u8def\u7531\u8f93\u5165\u65b9\u5411\u5f71\u54cd\u4e13\u5bb6\u8d1f\u8f7d\uff0c\u800c\u975e\u4ec5\u4f5c\u7528\u4e8e\u8def\u7531\u5668\uff1b\u4e3a\u6df7\u5408\u4e13\u5bb6\u8bad\u7ec3\u7684\u4f18\u5316\u5668\u9009\u62e9\u4e0e\u5931\u8861\u4fee\u6b63\u63d0\u4f9b\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "With model weights fixed, we measure how much of an entity-replacement response transfers between English factual questions, beyond whether answers change. We add the hidden-state change from two source questions to a target question about the same entity, comparing the predicted log-probability shift between two relations\u0027 published answers, given known answer prefixes, with the measured one. Hidden reuse injects the aligned change at 50% depth before the target\u0027s remaining layers; direct reuse adds source output-score changes. With other-relation sources, hidden reuse removes 45% and 49% of no-change error on 0.5-1B Qwen and Llama. Gemma-2-2B removes 22% and passes one of three comparisons in plain text without its default beginning-of-sequence (BOS) token. A later protocol restoring it yields 58-68%, passing every comparison on three cohorts. Larger checkpoints, chat format and new entities show replication and format- or cohort-dependent failures. On small plain-format checkpoints, other-relation hidden reuse mainly reproduces the shift both relations\u0027 questions share, without reliably lowering relation-selective error. With target-relation sources, hidden reuse\u0027s post hoc advantage over direct reuse is 0.2-0.9 nats outside chat format, unconfirmed and not replacement-specific. The same relation-neutral change at both questions\u0027 entity tokens lowers relation-selective error more than random or other-replacement changes, indicating receiving-question dependence.", "arxiv_id": "2611.00352", "arxiv_url": "https://arxiv.org/abs/2611.00352", "authors": ["Jinkun Chen", "Xuemin Yu", "Sijia Han", "Vlado Keselj"], "brief": "\u56fa\u5b9a\u6a21\u578b\u6743\u91cd\uff0c\u5c06\u6e90\u95ee\u9898\u5b9e\u4f53\u66ff\u6362\u4ea7\u751f\u7684\u9690\u85cf\u72b6\u6001\u53d8\u5316\u6ce8\u5165\u540c\u5b9e\u4f53\u7684\u76ee\u6807\u95ee\u9898\uff0c\u5e76\u4e0e\u8f93\u51fa\u5206\u6570\u76f4\u63a5\u590d\u7528\u5bf9\u7167\uff0c\u68c0\u9a8c\u7b54\u6848\u5bf9\u6570\u6982\u7387\u53d8\u5316\u7684\u8de8\u95ee\u9898\u8fc1\u79fb\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00352", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9690\u85cf\u590d\u7528\u5728\u6a21\u578b50%\u6df1\u5ea6\u6ce8\u5165\u5bf9\u9f50\u53d8\u5316", "\u8de8\u5173\u7cfb\u590d\u7528\u4f7f\u5c0f\u578bQwen\u3001Llama\u8bef\u5dee\u964d\u4f4e45%\u300149%", "Gemma\u6062\u590dBOS\u540e\u8bef\u5dee\u964d\u4f4e58%\u201468%"], "keywords": ["\u9690\u85cf\u72b6\u6001", "\u77e5\u8bc6\u8868\u5f81", "\u673a\u5236\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00352v1", "published_at": "2026-10-30", "score": 0.175, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00352.png", "title": "Cross-Prompt Reuse of Entity-Replacement Responses", "tldr": "\u5b9e\u4f53\u66ff\u6362\u5f15\u53d1\u7684\u9690\u85cf\u72b6\u6001\u53d8\u5316\u53ef\u8de8\u95ee\u9898\u590d\u7528\uff0c\u4f46\u4e3b\u8981\u8fc1\u79fb\u5173\u7cfb\u5171\u4eab\u6548\u5e94\u3002", "upvotes": 1, "what_it_is": "\u56fa\u5b9a\u6a21\u578b\u6743\u91cd\uff0c\u5c06\u6e90\u95ee\u9898\u5b9e\u4f53\u66ff\u6362\u4ea7\u751f\u7684\u9690\u85cf\u72b6\u6001\u53d8\u5316\u6ce8\u5165\u540c\u5b9e\u4f53\u7684\u76ee\u6807\u95ee\u9898\uff0c\u5e76\u4e0e\u8f93\u51fa\u5206\u6570\u76f4\u63a5\u590d\u7528\u5bf9\u7167\uff0c\u68c0\u9a8c\u7b54\u6848\u5bf9\u6570\u6982\u7387\u53d8\u5316\u7684\u8de8\u95ee\u9898\u8fc1\u79fb\u3002", "why_notable": "\u5c06\u5b9e\u4f53\u66ff\u6362\u7684\u8fc1\u79fb\u6548\u5e94\u7ec6\u5206\u4e3a\u5173\u7cfb\u5171\u4eab\u4e0e\u9009\u62e9\u6027\u53d8\u5316\uff0c\u63ed\u793a\u590d\u7528\u6536\u76ca\u4f9d\u8d56\u63a5\u6536\u95ee\u9898\u53ca\u8f93\u5165\u683c\u5f0f\uff0c\u4e3a\u7406\u89e3\u5185\u90e8\u8868\u5f81\u63d0\u4f9b\u8bc1\u636e\u3002"}, {"abstract": "Planning electricity systems requires repeated decisions that connect regional resources, investment, operation and network constraints. Here we present an autonomous planning framework that carries prepared regional scenarios through proposal, numerical evaluation, feedback interpretation, redesign and final plan selection. Agents propose investment bounds, storage operating conditions and feeder interventions, interpret numerical feedback, and decide how to revise designs and when to stop. The framework automatically executes annual investment-and-dispatch optimization and representative-feeder verification, applies fixed acceptance criteria and retains the lowest-cost accepted candidate. We evaluate forty carbon-constrained trajectories across ten system-year scenarios in five electricity systems and four countries, using two model deployments and single- and multi-agent architectures. All forty retain candidates satisfying the implemented physical and fixed annual operational carbon-budget checks. Twenty-eight of forty matched reference designs exceed the new scenario ceilings. A separate archive of ninety-six trajectories under a common 1,000 Mt annual ceiling provides matched references and broader regional coverage. The results demonstrate autonomous planning under explicit emissions constraints using public regional data and published institutional demand outlooks.", "arxiv_id": "2611.05911", "arxiv_url": "https://arxiv.org/abs/2611.05911", "authors": ["Yoon Pyo Lee", "Samrendra Roy", "Jay Phil Yoo", "Kazuma Kobayashi", "Souvik Chakraborty", "Syed Bahauddin Alam"], "brief": "\u63d0\u51fa\u81ea\u4e3b\u667a\u80fd\u4f53\u7535\u529b\u89c4\u5212\u6846\u67b6\uff0c\u8fed\u4ee3\u8bbe\u8ba1\u5e76\u4f18\u5316\u6295\u8d44\u4e0e\u8c03\u5ea6\uff0c\u5728\u4e94\u4e2a\u7535\u529b\u7cfb\u7edf\u7684\u56db\u5341\u6761\u8f68\u8ff9\u4e2d\u5747\u627e\u5230\u6ee1\u8db3\u7269\u7406\u7ea6\u675f\u548c\u5e74\u5ea6\u78b3\u9884\u7b97\u7684\u65b9\u6848\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05911", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u4e3b\u667a\u80fd\u4f53", "\u7535\u529b\u89c4\u5212", "\u7ea6\u675f\u4f18\u5316", "\u78b3\u6392\u653e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05911v1", "published_at": "2026-11-04", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Autonomous agents for electricity-system planning", "tldr": "\u63d0\u51fa\u81ea\u4e3b\u667a\u80fd\u4f53\u7535\u529b\u89c4\u5212\u6846\u67b6\uff0c\u8fed\u4ee3\u8bbe\u8ba1\u5e76\u4f18\u5316\u6295\u8d44\u4e0e\u8c03\u5ea6\uff0c\u5728\u4e94\u4e2a\u7535\u529b\u7cfb\u7edf\u7684\u56db\u5341\u6761\u8f68\u8ff9\u4e2d\u5747\u627e\u5230\u6ee1\u8db3\u7269\u7406\u7ea6\u675f\u548c\u5e74\u5ea6\u78b3\u9884\u7b97\u7684\u65b9\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Natural Language Processing (NLP) has been widely applied in financial domains, enabling automated analysis and retrieval of stock market information. However, traditional NLP-based systems often struggle with maintaining contextual accuracy and generating relevant responses in dynamic financial environments. To address these challenges, Retrieval-Augmented Generation (RAG) models have emerged as a powerful solution, combining retrieval-based methods with generative capabilities to enhance response quality. In this study, we present a Retrieval-Augmented Generation (RAG) system designed to generate responses related to stock market information. The system integrates retrieval-based and generative approaches to enhance the accuracy and relevance of financial text generation. To evaluate its effectiveness, we employ the ROUGE metric, specifically ROUGE-1, ROUGE-2, and ROUGE-L, to measure lexical and structural similarity between generated and reference texts. Experimental results on a dataset of 100 stock market-related queries demonstrate high ROUGE scores, indicating strong alignment with reference documents. Additionally, we assess latency to evaluate the system responsiveness, achieving an average response time of 1.16 seconds. These findings confirm that our RAG model is capable of providing accurate and timely stock market insights, making it a promising approach for financial information retrieval.", "arxiv_id": "2611.03747", "arxiv_url": "https://arxiv.org/abs/2611.03747", "authors": ["Huan Phong Thai", "Thu Anh Ngoc Le", "Nhu Huynh Thi Le", "Nhan Huu Tran", "Lenh Cong Phan Pham", "Hong Nhung Nguyen"], "brief": "\u6784\u5efa\u9762\u5411\u80a1\u7968\u5e02\u573a\u4fe1\u606f\u7684RAG\u95ee\u7b54\u7cfb\u7edf\uff0c\u5c06\u68c0\u7d22\u7ed3\u679c\u4e0e\u751f\u6210\u6a21\u578b\u7ed3\u5408\uff0c\u4ee5\u63d0\u5347\u56de\u7b54\u7684\u51c6\u786e\u6027\u548c\u76f8\u5173\u6027\u3002\u901a\u8fc7\u53c2\u8003\u6587\u672c\u5339\u914d\u6307\u6807\u4e0e\u5ef6\u8fdf\u6d4b\u8bd5\u8bc4\u4f30\u6548\u679c\u3002", "categories": ["cs.IR", "cs.AI"], "github_repo": "https://github.com/nhunguet/SearchEngine", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.03747", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": ["RAG\u7ed3\u5408\u4fe1\u606f\u68c0\u7d22\u4e0e\u6587\u672c\u751f\u6210\uff0c\u56de\u7b54\u80a1\u5e02\u76f8\u5173\u95ee\u9898", "\u5728100\u6761\u67e5\u8be2\u4e0a\u8bc4\u4f30ROUGE-1\u3001ROUGE-2\u548cROUGE-L", "\u5e73\u5747\u54cd\u5e94\u65f6\u95f4\u4e3a1.16\u79d2"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u91d1\u878d\u95ee\u7b54", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03747v1", "published_at": "2026-11-02", "score": 0.142, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03747.png", "title": "Enhancing Stock Market Information Retrieval with Retrieval-Augmented Generation", "tldr": "\u5c06\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u7528\u4e8e\u80a1\u5e02\u95ee\u7b54\uff0c\u5728\u767e\u6761\u67e5\u8be2\u4e0a\u8bc4\u4f30\u6587\u672c\u5339\u914d\u5ea6\u4e0e\u54cd\u5e94\u901f\u5ea6\u3002", "upvotes": 1, "what_it_is": "\u6784\u5efa\u9762\u5411\u80a1\u7968\u5e02\u573a\u4fe1\u606f\u7684RAG\u95ee\u7b54\u7cfb\u7edf\uff0c\u5c06\u68c0\u7d22\u7ed3\u679c\u4e0e\u751f\u6210\u6a21\u578b\u7ed3\u5408\uff0c\u4ee5\u63d0\u5347\u56de\u7b54\u7684\u51c6\u786e\u6027\u548c\u76f8\u5173\u6027\u3002\u901a\u8fc7\u53c2\u8003\u6587\u672c\u5339\u914d\u6307\u6807\u4e0e\u5ef6\u8fdf\u6d4b\u8bd5\u8bc4\u4f30\u6548\u679c\u3002", "why_notable": "\u63d0\u4f9b\u4e86\u91d1\u878d\u4fe1\u606f\u95ee\u7b54\u7684\u8f7b\u91cf\u5e94\u7528\u9a8c\u8bc1\uff0c\u540c\u65f6\u62a5\u544a\u6587\u672c\u5339\u914d\u5ea6\u4e0e\u54cd\u5e94\u901f\u5ea6\uff1b\u4f46\u9ad8ROUGE\u5206\u6570\u4e0d\u7b49\u540c\u4e8e\u91d1\u878d\u4e8b\u5b9e\u51c6\u786e\u3002"}, {"abstract": "Anticipating financial outcomes requires synthesizing evolving evidence and reasoning under uncertainty, making deep research systems promising tools for forecasting. Yet evaluating forecasting ability is challenging because historical backtests may reward memorized outcomes or information retrieved after the forecast date. Live forecasting avoids direct access to realized outcomes, but feedback arrives only after events resolve. To obtain timely feedback and assess historical scores, we introduce FinForesight, a diagnostic backtesting benchmark for financial deep research systems. Across the Chinese, U.S., and Hong Kong markets, the benchmark evaluates four forecasting tasks: valuation, return ranking, event direction, and future financial fundamentals. Two capability diagnostic tasks assess counterfactual reasoning and financial calculation, scored separately from forecasting performance. Our harness-compatible framework restricts retrieved evidence to information available at the forecast date. We compare pretraining-era, resolved post-cutoff, and live evaluations to test whether controlled backtests approximate future performance. Pretraining-era scores exceed post-cutoff scores in most temporal comparisons, and stronger retrieval controls narrow the gap between post-cutoff backtests and live results. Forecasting attribution and robustness analyses reveal how scores respond to retrieval policy and how predictions respond to prompt rewrites and numerical perturbations. The code and benchmark data are publicly available.", "arxiv_id": "2611.01621", "arxiv_url": "https://arxiv.org/abs/2611.01621", "authors": ["Fengyuan Liu", "Mukai Li", "Jieshun You", "Yilin Zheng", "Chenjia Min", "Yizhou Zhang", "Harper Chen", "Qi Liu"], "brief": "\u63d0\u51fa\u91d1\u878d\u6df1\u5ea6\u7814\u7a76\u7cfb\u7edf\u7684\u8bca\u65ad\u56de\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u4e09\u5730\u5e02\u573a\u56db\u7c7b\u9884\u6d4b\u4efb\u52a1\u3002\u7ed3\u679c\u663e\u793a\u5386\u53f2\u6210\u7ee9\u53ef\u80fd\u865a\u9ad8\uff0c\u66f4\u4e25\u683c\u7684\u68c0\u7d22\u65f6\u70b9\u63a7\u5236\u53ef\u7f29\u5c0f\u56de\u6d4b\u4e0e\u5b9e\u65f6\u9884\u6d4b\u5dee\u8ddd\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01621", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u91d1\u878d\u9884\u6d4b", "\u8bc4\u6d4b\u57fa\u51c6", "\u4fe1\u606f\u68c0\u7d22", "\u6df1\u5ea6\u7814\u7a76"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01621v1", "published_at": "2026-11-01", "score": 0.007, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01621.png", "title": "FinForesight: A Diagnostic Backtesting Benchmark for Deep Research Systems in Financial Forecasting", "tldr": "\u63d0\u51fa\u91d1\u878d\u6df1\u5ea6\u7814\u7a76\u7cfb\u7edf\u7684\u8bca\u65ad\u56de\u6d4b\u57fa\u51c6\uff0c\u8986\u76d6\u4e09\u5730\u5e02\u573a\u56db\u7c7b\u9884\u6d4b\u4efb\u52a1\u3002\u7ed3\u679c\u663e\u793a\u5386\u53f2\u6210\u7ee9\u53ef\u80fd\u865a\u9ad8\uff0c\u66f4\u4e25\u683c\u7684\u68c0\u7d22\u65f6\u70b9\u63a7\u5236\u53ef\u7f29\u5c0f\u56de\u6d4b\u4e0e\u5b9e\u65f6\u9884\u6d4b\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning vision-language-action (VLA) models pair physical control with natural-language rationales that supervisors can read to monitor embodied safety. Prior attacks on VLA reasoning corrupt the rationale itself and leave visible evidence in the text. We show that visual perturbations can instead alter the physical action while keeping the generated rationale word-for-word identical. At the shared text/action interface of Alpamayo for driving and InstructVLA for manipulation, our text-neutral action-subspace (TNAS) diagnostic shows that the locally most action-sensitive direction is nearly orthogonal to the active text-loss gradients, with 1.87% and 5.28% norm overlap. At equal hidden-state perturbation norms across both models, interventions along this text-neutral residual shift actions 4.64x to 47.8x more than text-gradient perturbations, whereas text-gradient perturbations induce 21.2x to 277x more text drift. Steering visual perturbations along this direction reaches the same decoupling from the image. Across 154 obstacle-annotated driving scenes in Alpamayo, TNAS-guided attacks induce a new collision under a word-for-word identical rationale in 52.6% of scenes under full-image perturbations and 35.1% under a localized forward-camera patch, compared with 4.55% for unguided action attacks. Relative to a text-preserving baseline, TNAS guidance raises exact rationale preservation from 83.0% to 89.5% and cuts teacher-forced text drift by 68.4% at a comparable collision rate. In InstructVLA, TNAS guidance cuts text drift by 40.5% and preserves the exact response on 85.0% of examples alongside a 1.73-unit action-chunk shift. An unchanged rationale therefore cannot certify a safe action, so monitors for reasoning VLAs must verify the predicted action channel directly.", "arxiv_id": "2611.04166", "arxiv_url": "https://arxiv.org/abs/2611.04166", "authors": ["Zihao Feng", "Qingzhao Zhang", "Chunyu Xia", "Bo Yu", "Z. Morley Mao", "Ramesh Govindan"], "brief": "\u63d0\u51faTNAS\u8bca\u65ad\u5e76\u5f15\u5bfc\u89c6\u89c9\u653b\u51fb\uff0c\u5728\u4fdd\u6301VLA\u89e3\u91ca\u9010\u5b57\u4e0d\u53d8\u65f6\u6539\u53d8\u52a8\u4f5c\uff1b\u9a7e\u9a76\u573a\u666f\u4e2d\u65b0\u78b0\u649e\u7387\u8fbe52.6%\uff0c\u8868\u660e\u4ec5\u76d1\u63a7\u89e3\u91ca\u4e0d\u8db3\u4ee5\u4fdd\u969c\u5b89\u5168\u3002", "categories": ["cs.LG", "cs.CR", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04166", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5bf9\u6297\u653b\u51fb", "\u5177\u8eab\u5b89\u5168"], "num_comments": 1, "on_hf": true, "organization": "University of Southern California", "pdf_url": "https://arxiv.org/pdf/2611.04166v1", "published_at": "2026-11-03", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04166.png", "title": "Say the Same, Act Differently: Diagnosing and Steering Text-Action Divergence in Reasoning VLAs", "tldr": "\u63d0\u51faTNAS\u8bca\u65ad\u5e76\u5f15\u5bfc\u89c6\u89c9\u653b\u51fb\uff0c\u5728\u4fdd\u6301VLA\u89e3\u91ca\u9010\u5b57\u4e0d\u53d8\u65f6\u6539\u53d8\u52a8\u4f5c\uff1b\u9a7e\u9a76\u573a\u666f\u4e2d\u65b0\u78b0\u649e\u7387\u8fbe52.6%\uff0c\u8868\u660e\u4ec5\u76d1\u63a7\u89e3\u91ca\u4e0d\u8db3\u4ee5\u4fdd\u969c\u5b89\u5168\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pedestrians increasingly encounter robots in urban public spaces without interacting with them, but how robots change the perceived safety of a street remains unclear. We examine how robot presence and type affect perceived safety across urban contexts. We generate 18 images of Seoul streets that vary in time of day, road class, and robot condition (no robot, a delivery robot, or a humanoid). Two multimodal large language models (MLLMs), Qwen3.8-27B and Gemma4-26B, each conditioned on 500 synthetic personas, choose the safer image in each pair, and 25 human respondents complete the same task. Both models prefer streets without robots and favor the delivery robot over the humanoid. Robots are chosen more often at night and less often by older personas, whereas road class has smaller effects. In the model rationales, the delivery robot appears as a physical obstacle, whereas the humanoid appears as either a threat or a source of protection. Like humans, both models chose robots more often at night, but chose the humanoid over the delivery robot far less often, and Gemma showed a night effect for the humanoid about three times that of humans. These results show that the effect of a robot on perceived safety depends on when it appears, and that persona-conditioned MLLMs capture only part of human judgments.", "arxiv_id": "2611.05954", "arxiv_url": "https://arxiv.org/abs/2611.05954", "authors": ["Keonhee Jang", "Kanghoon Lee", "Seokwoo Yun", "Namwoo Kim", "Yoonjin Yoon"], "brief": "\u7814\u7a76\u7528\u5408\u6210\u4eba\u8bbe\u9a71\u52a8\u591a\u6a21\u6001\u6a21\u578b\uff0c\u5e76\u4e0e\u4eba\u7c7b\u6bd4\u8f83\u57ce\u5e02\u673a\u5668\u4eba\u5b89\u5168\u611f\u5224\u65ad\u3002\u6a21\u578b\u504f\u597d\u65e0\u673a\u5668\u4eba\u8857\u9053\uff0c\u591c\u95f4\u66f4\u63a5\u53d7\u673a\u5668\u4eba\uff0c\u4f46\u5bf9\u4eba\u5f62\u673a\u5668\u4eba\u7684\u5224\u65ad\u4e0e\u4eba\u7c7b\u6709\u660e\u663e\u5dee\u5f02\u3002", "categories": ["cs.HC", "cs.CL", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05954", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u673a\u4ea4\u4e92", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u57ce\u5e02\u673a\u5668\u4eba", "\u5b89\u5168\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05954v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robots in the City: Persona-Based Perceptions of Urban Robots", "tldr": "\u7814\u7a76\u7528\u5408\u6210\u4eba\u8bbe\u9a71\u52a8\u591a\u6a21\u6001\u6a21\u578b\uff0c\u5e76\u4e0e\u4eba\u7c7b\u6bd4\u8f83\u57ce\u5e02\u673a\u5668\u4eba\u5b89\u5168\u611f\u5224\u65ad\u3002\u6a21\u578b\u504f\u597d\u65e0\u673a\u5668\u4eba\u8857\u9053\uff0c\u591c\u95f4\u66f4\u63a5\u53d7\u673a\u5668\u4eba\uff0c\u4f46\u5bf9\u4eba\u5f62\u673a\u5668\u4eba\u7684\u5224\u65ad\u4e0e\u4eba\u7c7b\u6709\u660e\u663e\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mixture-of-Experts (MoE) enables multimodal large language models (MLLMs) to scale capacity efficiently, but expert parameters dominate memory even though only a few experts are activated per token: they account for over 90% of model size in modern MoE-MLLMs (e.g., 54 GB out of about 58 GB in BF16 for InternVL3.5-30B-A3B and Qwen3-VL-30B-A3B). Expert pruning has emerged as an effective compression strategy, but existing methods aggregate importance uniformly across tokens, ignoring that the same expert may serve different roles for vision versus language processing. To address this, we propose MAEP (Modality-Aware Expert Pruning), a training-free framework that decomposes expert importance by modality in a single forward pass. MAEP introduces (1) Delta-H Output ($\u0394H$), a redistribution-aware metric measuring the MoE output change when an expert is removed, and (2) low-attention vision tokens as a vision-side pruning signal that is dataset-stable: its expert-importance ranking remains stable across different datasets. Text-side importance serves as a preservation signal while vision-side importance serves as a pruning signal, and experts are ranked globally across layers. Experiments on three MoE-based MLLMs across multimodal and text benchmarks show that MAEP outperforms modality-agnostic baselines on the majority of multimodal benchmarks while remaining competitive on text-only tasks, reducing the BF16 expert weight footprint by about 27 GB (about 47% of total memory) so that the full weight footprint of an approximately 58 GB model fits within a single 40 GB GPU. Code is available at https://github.com/nota-github/MAEP.", "arxiv_id": "2611.05927", "arxiv_url": "https://arxiv.org/abs/2611.05927", "authors": ["Donggeun Kim"], "brief": "\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u6a21\u6001\u611f\u77e5\u4e13\u5bb6\u526a\u679d\uff0c\u533a\u5206\u89c6\u89c9\u4e0e\u6587\u672c\u7684\u91cd\u8981\u6027\u4fe1\u53f7\u3002\u591a\u6570\u591a\u6a21\u6001\u57fa\u51c6\u4f18\u4e8e\u73b0\u6709\u526a\u679d\u65b9\u6cd5\uff0c\u7ea658GB\u6a21\u578b\u538b\u7f29\u540e\u53ef\u88c5\u5165\u5355\u5f2040GB\u663e\u5361\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05927", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u6a21\u578b\u526a\u679d", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05927v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Modality-Aware Expert Pruning for MoE-Based Multimodal Large Language Models", "tldr": "\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u6a21\u6001\u611f\u77e5\u4e13\u5bb6\u526a\u679d\uff0c\u533a\u5206\u89c6\u89c9\u4e0e\u6587\u672c\u7684\u91cd\u8981\u6027\u4fe1\u53f7\u3002\u591a\u6570\u591a\u6a21\u6001\u57fa\u51c6\u4f18\u4e8e\u73b0\u6709\u526a\u679d\u65b9\u6cd5\uff0c\u7ea658GB\u6a21\u578b\u538b\u7f29\u540e\u53ef\u88c5\u5165\u5355\u5f2040GB\u663e\u5361\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning models allocate test-time compute across distinct behaviors such as planning, deriving, and verifying. However, models frequently \"overthink,\" continuing to verify and re-derive long after finding a correct answer. This wastes expensive compute and can even degrade performance. Existing interventions, such as token budgets or steering, primarily regulate reasoning duration rather than targeting specific behaviors. In this work, we demonstrate that Mixture-of-Experts (MoE) routers provide a natural, training-free interface for behavioral control. We first split reasoning traces into sentence-level segments and label each with one of six reasoning behaviors (planning, execution, restatement, fact, reflection, and conclusion), so that every token carries the behavior of its segment. Linear probes on router logits predict this label nearly as well as probes on the residual stream, the model\u0027s full hidden state and the standard target for probing, while using about half as many features. These signals generalize: experts associated with a reasoning behavior on one dataset predict the same behavior on the others, across six datasets spanning five domains (math, code, science, knowledge, and commonsense). Building on this, we selectively edit expert router scores during inference to curb overthinking. Across four models and four benchmarks, this intervention reduces the number of generated tokens by a median of 30.4% (and up to 63.3%). Crucially, it encourages the model to stop once the problem is solved, rather than skipping essential reasoning steps. Accuracy never drops by more than 0.5 percentage points, and frequently improves. Ultimately, MoE routing offers both an interpretable lens into reasoning states and a lightweight mechanism for optimizing test-time compute.", "arxiv_id": "2611.05919", "arxiv_url": "https://arxiv.org/abs/2611.05919", "authors": ["Shengjie Wang", "Mohsen Fayyaz", "Nanyun Peng"], "brief": "\u5229\u7528MoE\u8def\u7531\u4fe1\u53f7\u8bc6\u522b\u63a8\u7406\u884c\u4e3a\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u514d\u8bad\u7ec3\u5730\u8c03\u6574\u4e13\u5bb6\u5206\u6570\u4ee5\u6291\u5236\u8fc7\u5ea6\u601d\u8003\uff1b\u751f\u6210\u8bcd\u5143\u4e2d\u4f4d\u6570\u51cf\u5c1130.4%\uff0c\u51c6\u786e\u7387\u4e0b\u964d\u4e0d\u8d85\u8fc70.5\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05919", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u63a8\u7406\u884c\u4e3a", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05919v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Routes of Reasoning: Reading and Reshaping Test-Time Compute in MoE Models", "tldr": "\u5229\u7528MoE\u8def\u7531\u4fe1\u53f7\u8bc6\u522b\u63a8\u7406\u884c\u4e3a\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u514d\u8bad\u7ec3\u5730\u8c03\u6574\u4e13\u5bb6\u5206\u6570\u4ee5\u6291\u5236\u8fc7\u5ea6\u601d\u8003\uff1b\u751f\u6210\u8bcd\u5143\u4e2d\u4f4d\u6570\u51cf\u5c1130.4%\uff0c\u51c6\u786e\u7387\u4e0b\u964d\u4e0d\u8d85\u8fc70.5\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Forecasting emotion in conversation is increasingly framed as predicting the next emotional state\u0027s value. We show this targets a hard quantity in a state-observed testbed and propose a learnable, deployable reformulation instead. On valence-arousal-dominance trajectories from a dyadic corpus, repeating a speaker\u0027s own previous state sets a persistence baseline that no frozen-encoder correction meaningfully improves upon and a state-space filter exceeds; the floor requires the historical state to be observed, since an estimated anchor collapses persistence below a direct forecaster. What survives is the timing of a departure from persistence, learnable on three of four corpora and near chance on the highest-base-rate corpus, a negative result we report. We recast the task as selective departure forecasting: a lead-time-weighted metric with a leakage protocol, and commitment policies whose best choice switches with the departure rate. A dialogue-level conformal risk control bounds the expected loss of committed predictions, meeting the target in all twelve configurations tested, though the guarantee is bought through abstention, with coverage and alarm recall falling sharply on the hardest corpus. One tested language model\u0027s confidence fails as a ranking signal where another succeeds, a model-dependent failure not yet attributable to family versus scale. Code and result logs are available from the corresponding author upon request.", "arxiv_id": "2611.05896", "arxiv_url": "https://arxiv.org/abs/2611.05896", "authors": ["Bin Wen", "Dai-Qiao Zhang", "Tien-Ping Tan"], "brief": "\u7814\u7a76\u53d1\u73b0\u5bf9\u8bdd\u60c5\u7eea\u6570\u503c\u9884\u6d4b\u96be\u8d85\u8d8a\u72b6\u6001\u6301\u7eed\u57fa\u7ebf\uff0c\u8f6c\u5411\u9884\u6d4b\u504f\u79bb\u65f6\u673a\uff1b\u5171\u5f62\u98ce\u9669\u63a7\u5236\u5728\u5168\u90e8\u6d4b\u8bd5\u914d\u7f6e\u4e2d\u8fbe\u6807\uff0c\u4f46\u56f0\u96be\u8bed\u6599\u4e0a\u9700\u5927\u91cf\u5f03\u7b54\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05896", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u60c5\u7eea\u9884\u6d4b", "\u5bf9\u8bdd\u5efa\u6a21", "\u5171\u5f62\u9884\u6d4b", "\u98ce\u9669\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05896v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Selective, Risk-Controlled Emotion Forecasting in Conversation: From a Persistence Barrier to Departure Detection with Conformal Guarantees", "tldr": "\u7814\u7a76\u53d1\u73b0\u5bf9\u8bdd\u60c5\u7eea\u6570\u503c\u9884\u6d4b\u96be\u8d85\u8d8a\u72b6\u6001\u6301\u7eed\u57fa\u7ebf\uff0c\u8f6c\u5411\u9884\u6d4b\u504f\u79bb\u65f6\u673a\uff1b\u5171\u5f62\u98ce\u9669\u63a7\u5236\u5728\u5168\u90e8\u6d4b\u8bd5\u914d\u7f6e\u4e2d\u8fbe\u6807\uff0c\u4f46\u56f0\u96be\u8bed\u6599\u4e0a\u9700\u5927\u91cf\u5f03\u7b54\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Comparisons in conversational emotion-shift forecasting are easily distorted when a learned model receives rich features but its transition baseline is given a noisy or unavailable current-emotion label, when hyperparameter budgets differ, or when target-turn information enters the representation. We present an information-matched, leakage-safe auditing protocol that closes these gaps with an explicit commitment point, executable causality tests, equal four-configuration validation searches, and seed-dialogue-aware inference. Applying it to six causal model families on four text corpora and two feature-source sensitivity configurations shows that a deployable train-only current-emotion classifier feeding the transition baseline yields a different verdict than an oracle diagnostic where both sides receive gold current emotion. Under the deployable condition, learned models improve over the predicted-label baseline on all four primary corpora; DailyDialog gains are large and survive a 72-comparison Holm correction (best ROC-AUC gain = +0.167, adjusted p=.0144). Under matched gold information, the baseline remains competitive on IEMOCAP and stronger on MELD, while every model retains a large DailyDialog advantage. We additionally report precision-recall AUC, calibration, a strictly utterance-local feature control, same-person self-shift forecasting, and a future-access dose-response test. An eight-item leakage checklist accompanies the protocol. Code, raw seed predictions, and reporting artifacts are available from the corresponding author upon request.", "arxiv_id": "2611.05895", "arxiv_url": "https://arxiv.org/abs/2611.05895", "authors": ["Bin Wen", "Dai-Qiao Zhang", "Tien-Ping Tan"], "brief": "\u63d0\u51fa\u4fe1\u606f\u5339\u914d\u3001\u65e0\u6cc4\u6f0f\u7684\u5bf9\u8bdd\u60c5\u7eea\u8f6c\u53d8\u9884\u6d4b\u8bc4\u4f30\u534f\u8bae\uff1b\u56db\u4e2a\u8bed\u6599\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u4f18\u52bf\u53d6\u51b3\u4e8e\u57fa\u7ebf\u53ef\u7528\u4fe1\u606f\uff0cDailyDialog\u4e0a\u7684\u63d0\u5347\u6700\u7a33\u5065\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05895", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u60c5\u7eea\u9884\u6d4b", "\u6a21\u578b\u8bc4\u4f30", "\u6570\u636e\u6cc4\u6f0f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05895v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Information-Matched Auditing of Conversational Emotion-Shift Forecasting: A Leakage-Safe Evaluation Protocol", "tldr": "\u63d0\u51fa\u4fe1\u606f\u5339\u914d\u3001\u65e0\u6cc4\u6f0f\u7684\u5bf9\u8bdd\u60c5\u7eea\u8f6c\u53d8\u9884\u6d4b\u8bc4\u4f30\u534f\u8bae\uff1b\u56db\u4e2a\u8bed\u6599\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u4f18\u52bf\u53d6\u51b3\u4e8e\u57fa\u7ebf\u53ef\u7528\u4fe1\u606f\uff0cDailyDialog\u4e0a\u7684\u63d0\u5347\u6700\u7a33\u5065\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Confidence estimates guide human review in LLM-built knowledge graphs, but better error prediction can yield little improvement in an audit. We study this gap through repairability, selection headroom and label validity. Modelling non-adaptive auditing as budgeted covering, we characterise the minimal decision-relevant error statistics and bound the regret of scalar-preserving first-order planning by a structural mass $\u0394^{\\mathrm{cl}}$. We simulate ideal repair against benchmark-aligned labels for five extraction configurations and two cross-document graphs on Re-DocRED, followed by frozen confirmation on test and replication on 500 hash-selected training documents. On the held-out cross-document graphs, an error-rate $\\times$ fan-out queue leaves 3.98-4.74 percentage points more errors than a joint model with the same actions. By comparison, opening shared actions for that joint planner reduces residual errors by 0.89-1.43 points relative to its own fact-only plans, in point estimates. Equivalence between joint and independent-block models remains inconclusive. Generic LLM verification improves three of four model-budget configurations on each held-out set. LLM adjudication identifies possible benchmark omissions.", "arxiv_id": "2611.05877", "arxiv_url": "https://arxiv.org/abs/2611.05877", "authors": ["Zehao Lin", "Kai Chen", "Xixuan Hao", "Erenkai Zhu", "Chunyu Li", "Helan Hu"], "brief": "\u7814\u7a76\u77e5\u8bc6\u56fe\u8c31\u5ba1\u8ba1\u4e2d\u7f6e\u4fe1\u5ea6\u63d0\u5347\u4e3a\u4f55\u672a\u5fc5\u6539\u5584\u7ea0\u9519\uff0c\u63d0\u51fa\u9884\u7b97\u8986\u76d6\u6a21\u578b\uff1b\u8054\u5408\u89c4\u5212\u6bd4\u9519\u8bef\u7387\u4e0e\u5f71\u54cd\u8303\u56f4\u6392\u5e8f\u5c11\u7559\u7ea64\u4e2a\u767e\u5206\u70b9\u9519\u8bef\uff0c\u63ed\u793a\u7ed3\u6784\u4f9d\u8d56\u7684\u91cd\u8981\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05877", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u7f6e\u4fe1\u5ea6\u4f30\u8ba1", "\u9519\u8bef\u4fee\u590d", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05877v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Does Better Confidence Improve a Knowledge-Graph Audit?", "tldr": "\u7814\u7a76\u77e5\u8bc6\u56fe\u8c31\u5ba1\u8ba1\u4e2d\u7f6e\u4fe1\u5ea6\u63d0\u5347\u4e3a\u4f55\u672a\u5fc5\u6539\u5584\u7ea0\u9519\uff0c\u63d0\u51fa\u9884\u7b97\u8986\u76d6\u6a21\u578b\uff1b\u8054\u5408\u89c4\u5212\u6bd4\u9519\u8bef\u7387\u4e0e\u5f71\u54cd\u8303\u56f4\u6392\u5e8f\u5c11\u7559\u7ea64\u4e2a\u767e\u5206\u70b9\u9519\u8bef\uff0c\u63ed\u793a\u7ed3\u6784\u4f9d\u8d56\u7684\u91cd\u8981\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) shopping assistants now recommend products in multi-turn conversations. However, reliable evaluation faces Data scarcity and Difficulty Standardizing Criteria. To address these obstacles, we introduce CARTBench for CART (Complex and Ambiguous Requests with Timelines). For Data scarcity, we curate cases from real commercial shopping needs across 17 retail domains, pairing timestamped dialogue with 1,603 product records. For Difficulty Standardizing Criteria, we develop case-specific rubrics guided by Ideal Response Principles, distilled from excellent replies manually selected from successfully completed orders. These principles also guide Principle-Guided CART Prompting, our structured recommendation strategy. The experimental benchmark contains 1,328 expert-annotated criteria across Core, Excellence, and Safety. To answer the CART question, we evaluate 7 flagship commercial API models, including GPT-6.1-Sol and Claude-Opus-5, and 35B+ parameters open-weight models. In the first full-suite evaluation under the frozen rubrics, 3 of 10 models exceed 90% on Core, while none exceeds 45% on Excellence. Therefore, we identify an understanding-to-execution gap between required behavior and high-quality purchase advice. To examine these limitations, we diagnose shared failures in product evidence and unresolved needs, linked to changing requirements and decisive unknowns. Code and data are available at https://github.com/Da1yuqin/CARTBench.", "arxiv_id": "2611.05862", "arxiv_url": "https://arxiv.org/abs/2611.05862", "authors": ["Yuqin Dai", "Zhanwei Zhang", "Honghui Yang", "Zhouheng Yao", "Yueqi Zhang", "Jingyu He", "Chaoyang Shi", "Fanding Wei", "Boyuan Pan", "Kai Xu", "Yao Hu", "Yongliang Shen"], "brief": "\u63d0\u51fa\u8d2d\u7269\u5efa\u8bae\u8bc4\u6d4b\u57fa\u51c6CARTBench\uff0c\u7528\u771f\u5b9e\u591a\u8f6e\u9700\u6c42\u4e0e\u6848\u4f8b\u8bc4\u5206\u7ec6\u5219\u8bc4\u4f30\u5341\u4e2a\u6a21\u578b\uff1b\u7ed3\u679c\u663e\u793a\u6838\u5fc3\u8981\u6c42\u8fbe\u6807\u4e0d\u7b49\u4e8e\u9ad8\u8d28\u91cf\u5efa\u8bae\uff0c\u4ea7\u54c1\u8bc1\u636e\u4e0e\u672a\u51b3\u9700\u6c42\u5904\u7406\u4ecd\u8584\u5f31\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05862", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8d2d\u7269\u52a9\u624b", "\u6a21\u578b\u8bc4\u6d4b", "\u591a\u8f6e\u5bf9\u8bdd", "\u63a8\u8350\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05862v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CARTBench: Rubric-Based Evaluation of Shopping Advice for Complex and Ambiguous Requests with Timelines", "tldr": "\u63d0\u51fa\u8d2d\u7269\u5efa\u8bae\u8bc4\u6d4b\u57fa\u51c6CARTBench\uff0c\u7528\u771f\u5b9e\u591a\u8f6e\u9700\u6c42\u4e0e\u6848\u4f8b\u8bc4\u5206\u7ec6\u5219\u8bc4\u4f30\u5341\u4e2a\u6a21\u578b\uff1b\u7ed3\u679c\u663e\u793a\u6838\u5fc3\u8981\u6c42\u8fbe\u6807\u4e0d\u7b49\u4e8e\u9ad8\u8d28\u91cf\u5efa\u8bae\uff0c\u4ea7\u54c1\u8bc1\u636e\u4e0e\u672a\u51b3\u9700\u6c42\u5904\u7406\u4ecd\u8584\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
