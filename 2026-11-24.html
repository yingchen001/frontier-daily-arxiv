tation helps every pair we test, and one shared policy keeps most of the success of separate policies at a fraction of the updates. The same tokens are then scored with statistics, state and object readouts, published vision scores, and an inverse-dynamics readout. That readout of the commanded motion is one of the strongest measurements available before a policy is trained. Recognition, depth, and correspondence do not transfer reliably. Fine-tuning can improve the action readout even when other measurements move the other way, and no statistic is stable enough to replace a rollout before any deployment.", "arxiv_id": "2611.30813", "arxiv_url": "https://arxiv.org/abs/2611.30813", "authors": ["Qiwei Liang", "Zhengtu Liang", "Minghao Lai", "Yikeng Chen", "Yiming Wang", "Boyang Cai", "Yuetong Fang", "Taowen Wang", "Baiqiao Yin", "Tianxing Chen", "Yue Chen", "Jiaming Liang", "Guangyu Chen", "Shaolong Zhu", "Daolin Ma", "Renjing Xu"], "brief": "\u6784\u5efa\u7b2c\u4e00\u89c6\u89d2\u53cc\u81c2\u64cd\u63a7\u57fa\u51c6\uff0c\u7528\u7edf\u4e00\u6d41\u5339\u914d\u7b56\u7565\u6bd4\u8f83\u591a\u7c7b\u89c6\u89c9\u7f16\u7801\u5668\u7684\u5bc6\u96c6\u56fe\u5757\u8868\u793a\uff0c\u5e76\u68c0\u9a8c\u9002\u914d\u3001\u4efb\u52a1\u5171\u4eab\u53ca\u8bad\u7ec3\u524d\u8bfb\u51fa\u6307\u6807\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/KolaKivy/HIVE-Bench", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2611.30813", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7edf\u4e00\u6d41\u5339\u914d\u7b56\u7565\u8bc4\u6d4b7\u7c7b20\u4e2a\u7f16\u7801\u5668\u300124\u9879\u4efb\u52a1", "\u56fe\u5757\u5e73\u5747\u4e3a\u5355\u4ee4\u724c\u635f\u5931\u5927\u90e8\u5206\u6210\u529f\u7387\uff0c\u9002\u914d\u5747\u6709\u76ca", "\u9006\u52a8\u529b\u5b66\u52a8\u4f5c\u8bfb\u51fa\u662f\u8bad\u7ec3\u524d\u6700\u5f3a\u9884\u6d4b\u6307\u6807\u4e4b\u4e00"], "keywords": ["\u673a\u5668\u4eba\u64cd\u63a7", "\u89c6\u89c9\u8868\u5f81", "\u57fa\u51c6\u8bc4\u6d4b", "\u591a\u4efb\u52a1\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30813v1", "published_at": "2026-11-23", "score": 0.294, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30813.png", "title": "HIVE-Bench: Evaluating Patch-Level Visual Representations for Egocentric Robot Manipulation", "tldr": "\u8be5\u57fa\u51c6\u8868\u660e\u53cc\u81c2\u64cd\u63a7\u9700\u4fdd\u7559\u89c6\u89c9\u56fe\u5757\uff0c\u52a8\u4f5c\u8bfb\u51fa\u6bd4\u901a\u7528\u89c6\u89c9\u6307\u6807\u66f4\u6709\u9884\u6d4b\u4ef7\u503c\u3002", "upvotes": 10, "what_it_is": "\u6784\u5efa\u7b2c\u4e00\u89c6\u89d2\u53cc\u81c2\u64cd\u63a7\u57fa\u51c6\uff0c\u7528\u7edf\u4e00\u6d41\u5339\u914d\u7b56\u7565\u6bd4\u8f83\u591a\u7c7b\u89c6\u89c9\u7f16\u7801\u5668\u7684\u5bc6\u96c6\u56fe\u5757\u8868\u793a\uff0c\u5e76\u68c0\u9a8c\u9002\u914d\u3001\u4efb\u52a1\u5171\u4eab\u53ca\u8bad\u7ec3\u524d\u8bfb\u51fa\u6307\u6807\u3002", "why_notable": "\u5c06\u89c6\u89c9\u8868\u5f81\u8bc4\u6d4b\u4ece\u8bc6\u522b\u80fd\u529b\u8f6c\u5411\u64cd\u63a7\u76f8\u5173\u6027\uff0c\u63ed\u793a\u901a\u7528\u89c6\u89c9\u5206\u6570\u96be\u4ee5\u53ef\u9760\u8fc1\u79fb\uff1b\u90e8\u7f72\u524d\u4ecd\u9700\u5b9e\u9645\u7b56\u7565\u6267\u884c\u9a8c\u8bc1\u3002"}, {"abstract": "Reinforcement learning (RL) trains coding agents on software tasks whose hidden tests decide the reward, yet task collections check these tests only against the reference fix. We ask what makes a task good training data, focusing on the correctness of its reward labels. We audit SWE-Gym with two LLM families, and a suspected error counts only if execution reproduces it. We find that unsolved often means mislabelled: 74% of the tasks that a 9B base model never solves have a test that rejects correct fixes (a false negative), versus 20% of those it sometimes solves. We repair or remove such tasks, and the audited tasks that remain train better policies. At equal size and matched difficulty, models trained on them score 2.4 and 2.7 points higher on held-out tasks from SWE-bench Verified and SWE-bench Pro than models trained on the original tasks, whereas simply dropping the never-solved tasks shows no such gain. We further find that wrong patches that pass (false positives) make up about a quarter of all passing patches, and that new tests that catch a quarter of them do not change held-out scores detectably. A pass rate shows whether a task yields reward, not whether that reward is right, so the reward labels themselves must be checked. To this end, we release SWE-Gym-Verified with its 1,087 audited tasks, every verdict with its executed evidence, our training sets, and the full audit pipeline.", "arxiv_id": "2611.30207", "arxiv_url": "https://arxiv.org/abs/2611.30207", "authors": ["Yikai Zhang", "Mai Xu", "Yunbei Zhang", "Qirui Jin", "Kenan Li", "Yuwen Jia", "Jinwei Yao", "Xiangyu Zhang", "Jielun Tan", "Jin Pan", "Zijian Jin", "Xiao Sun"], "brief": "\u7814\u7a76\u7528\u4e24\u7c7b\u5927\u6a21\u578b\u5ba1\u8ba1SWE-Gym\uff0c\u5e76\u4ee5\u5b9e\u9645\u6267\u884c\u786e\u8ba4\u5956\u52b1\u8bef\u6807\u3002\u901a\u8fc7\u4fee\u590d\u6216\u79fb\u9664\u9519\u8bef\u6d4b\u8bd5\u4efb\u52a1\uff0c\u6bd4\u8f83\u7b49\u89c4\u6a21\u3001\u540c\u96be\u5ea6\u6570\u636e\u5bf9\u4ee3\u7801\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.SE"], "github_repo": "https://github.com/Arist12/SWE-Gym-Verified", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.30207", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["9B\u6a21\u578b\u4ece\u672a\u89e3\u51fa\u7684\u4efb\u52a1\u4e2d\uff0c74%\u5b58\u5728\u6d4b\u8bd5\u5047\u9634\u6027", "\u5ba1\u8ba1\u540e\u8bad\u7ec3\u5728\u4e24\u9879SWE-bench\u8bc4\u6d4b\u63d0\u53472.4\u548c2.7\u5206", "\u53d1\u5e03SWE-Gym-Verified\uff1a1087\u9879\u4efb\u52a1\u53ca\u6267\u884c\u8bc1\u636e"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6570\u636e\u8d28\u91cf", "\u5956\u52b1\u8bef\u6807"], "num_comments": 2, "on_hf": true, "organization": "AMD", "pdf_url": "https://arxiv.org/pdf/2611.30207v1", "published_at": "2026-11-23", "score": 0.292, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30207.png", "title": "What Makes Good Data for Training Coding Agents? A Systematic Study on SWE-Gym", "tldr": "\u4ee3\u7801\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\uff0c\u4fee\u590d\u8bef\u62d2\u6b63\u786e\u8865\u4e01\u7684\u6d4b\u8bd5\uff0c\u6bd4\u5355\u7eaf\u5254\u9664\u96be\u9898\u66f4\u6709\u6548\u3002", "upvotes": 17, "what_it_is": "\u7814\u7a76\u7528\u4e24\u7c7b\u5927\u6a21\u578b\u5ba1\u8ba1SWE-Gym\uff0c\u5e76\u4ee5\u5b9e\u9645\u6267\u884c\u786e\u8ba4\u5956\u52b1\u8bef\u6807\u3002\u901a\u8fc7\u4fee\u590d\u6216\u79fb\u9664\u9519\u8bef\u6d4b\u8bd5\u4efb\u52a1\uff0c\u6bd4\u8f83\u7b49\u89c4\u6a21\u3001\u540c\u96be\u5ea6\u6570\u636e\u5bf9\u4ee3\u7801\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u5f71\u54cd\u3002", "why_notable": "\u628a\u8bad\u7ec3\u6570\u636e\u8d28\u91cf\u4ece\u4efb\u52a1\u96be\u5ea6\u8f6c\u5411\u5956\u52b1\u6b63\u786e\u6027\uff0c\u5e76\u7528\u53d7\u63a7\u5b9e\u9a8c\u9a8c\u8bc1\u6536\u76ca\uff0c\u4e3a\u4ee3\u7801\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u63d0\u4f9b\u53ef\u590d\u7528\u7684\u5ba1\u8ba1\u6570\u636e\u4e0e\u6d41\u7a0b\u3002"}, {"abstract": "Large and diverse video sources, such as egocentric human video and heterogeneous robot recordings, carry rich dynamics but come either without actions or without a shared action space. Latent action models (LAMs) can recover these dynamics, but they train their inverse- and forward-dynamics models (IDM, FDM) from scratch, trading off pixel reconstruction against latent capacity and accuracy. Pretrained video world models natively generate high-fidelity dynamics, yet represent them densely, entangled across all layers. Viewing the world model as a LAM, we show that these dynamics can be extracted with minimal changes to the model. Native LAM operates one pretrained video diffusion transformer as both IDM and FDM, with learnable dynamics registers as the only causal bridge between the two, and trains on counterfactual temporal pairs that differ in motion alone, so that the registers distill a video\u0027s dynamics into a compact native latent action. We further propose a pretraining paradigm for vision-language-action (VLA) policies, Pretraining Actions from World models (PAWlicy), in which Native LAM serves as a dynamics teacher on large-scale video; unlike world action models, it never generates video. Native latent actions outperform existing LAMs on the LARY benchmark in both action classification and control regression, and replay the same motion on new robots, in new scenes, and from human hands to robots, although no transfer objective is used in training. With a 3.8B model, PAWlicy reaches a 93.6% average success rate on RoboTwin 2.0 trained with domain-randomized demonstrations, the highest among VLAs. On RoboDojo, it is competitive on every dimension we evaluate, and its Precision, evaluated by us, is on par with the leading leaderboard entries. On real robots, it improves over the pi_0.5 baseline on both tasks. Both stages use only public data and a publicly released world model.", "arxiv_id": "2611.30898", "arxiv_url": "https://arxiv.org/abs/2611.30898", "authors": ["Qinyue Li", "Weijie Qiao", "Qingyi Tao", "Zerui Gong", "Zhe Yang", "Quanzhou Li", "Taolin Zhang", "Jinglin He", "Zhonghua Wu", "Chen Change Loy"], "brief": "Native LAM\u7528\u540c\u4e00\u89c6\u9891\u6269\u6563Transformer\u517c\u4efb\u9006\u5411\u4e0e\u524d\u5411\u52a8\u529b\u5b66\u6a21\u578b\uff0c\u4ee5\u53ef\u5b66\u4e60\u52a8\u529b\u5b66\u5bc4\u5b58\u5668\u8fde\u63a5\u4e24\u8005\u3002\u901a\u8fc7\u4ec5\u8fd0\u52a8\u4e0d\u540c\u7684\u53cd\u4e8b\u5b9e\u65f6\u5e8f\u5bf9\u63d0\u53d6\u6f5c\u5728\u52a8\u4f5c\u3002", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30898", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["PAWlicy\u4ee5Native LAM\u4e3a\u52a8\u529b\u5b66\u6559\u5e08\u9884\u8bad\u7ec3VLA\uff0c\u4e0d\u751f\u6210\u89c6\u9891", "LARY\u5206\u7c7b\u4e0e\u63a7\u5236\u56de\u5f52\u5747\u4f18\u4e8e\u5df2\u6709LAM\uff0c\u672a\u8bbe\u8fc1\u79fb\u76ee\u6807\u4ecd\u53ef\u8de8\u673a\u5668\u4eba\u8fc1\u79fb", "3.8B\u6a21\u578b\u5728RoboTwin 2.0\u5e73\u5747\u6210\u529f\u7387\u8fbe93.6%"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u6f5c\u5728\u52a8\u4f5c", "\u673a\u5668\u4eba\u5b66\u4e60", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "SenseTime", "pdf_url": "https://arxiv.org/pdf/2611.30898v1", "published_at": "2026-11-23", "score": 0.291, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30898.png", "title": "World Models as Native Latent Action Models", "tldr": "\u4ece\u9884\u8bad\u7ec3\u89c6\u9891\u4e16\u754c\u6a21\u578b\u63d0\u53d6\u7d27\u51d1\u6f5c\u5728\u52a8\u4f5c\uff0c\u63d0\u5347\u673a\u5668\u4eba\u7b56\u7565\u9884\u8bad\u7ec3\u4e0e\u8de8\u57df\u8fc1\u79fb\u3002", "upvotes": 24, "what_it_is": "Native LAM\u7528\u540c\u4e00\u89c6\u9891\u6269\u6563Transformer\u517c\u4efb\u9006\u5411\u4e0e\u524d\u5411\u52a8\u529b\u5b66\u6a21\u578b\uff0c\u4ee5\u53ef\u5b66\u4e60\u52a8\u529b\u5b66\u5bc4\u5b58\u5668\u8fde\u63a5\u4e24\u8005\u3002\u901a\u8fc7\u4ec5\u8fd0\u52a8\u4e0d\u540c\u7684\u53cd\u4e8b\u5b9e\u65f6\u5e8f\u5bf9\u63d0\u53d6\u6f5c\u5728\u52a8\u4f5c\u3002", "why_notable": "\u5c06\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5df2\u6709\u52a8\u529b\u5b66\u8f6c\u5316\u4e3a\u53ef\u4f9b\u7b56\u7565\u5b66\u4e60\u7684\u52a8\u4f5c\u8868\u5f81\uff0c\u51cf\u5c11\u5bf9\u7edf\u4e00\u52a8\u4f5c\u6807\u6ce8\u7684\u4f9d\u8d56\uff1b\u771f\u5b9e\u673a\u5668\u4eba\u4e24\u9879\u4efb\u52a1\u5747\u4f18\u4e8epi_0.5\u3002"}, {"abstract": "Scaling device-control evaluation requires scaling both interactive worlds and the tasks agents must solve. We introduce SynthDCB, a benchmark for environment awareness and device control built through world distillation (WD). World distillation transforms knowledge of device behaviors, constraints, and environmental effects into modular executable components. A unified capability representation connects tool discovery, world execution, and task synthesis. SynthDCB instantiates Home, Car, and Phone with 114 device classes, 1,166 functions, and 95 events, supporting five task families with 32 subtypes. Explicit states and tool-call traces support task validation and agent evaluation. We evaluate 22 models on 2,560 test tasks; the best achieves 88.8% mean Pass@1. Construction experiments demonstrate token efficiency and expansion of task coverage. At the richest knowledge level, WD fully covers 22/23 properties, 19/29 functionalities, and 30/39 event requirements specified in a real RobotVacuum protocol. Furthermore, the 1,000 sampled tasks semantically cover 81.6% of the 854 reference instructions in the real-world corpus. SynthDCB connects an expanding space of real-to-sim executable capabilities to verifiable agent evaluation.", "arxiv_id": "2611.18639", "arxiv_url": "https://arxiv.org/abs/2611.18639", "authors": ["Zichen Zhu", "Dingye Liu", "Nan Jiang", "Danyang Zhang", "Hang Zheng", "Shijie Zheng", "Situo Zhang", "Kunyao Lan", "Yingzi Ma", "Sheng Jiang", "Lu Chen", "Kai Yu"], "brief": "SynthDCB\u5c06\u8bbe\u5907\u884c\u4e3a\u3001\u7ea6\u675f\u4e0e\u73af\u5883\u5f71\u54cd\u84b8\u998f\u4e3a\u6a21\u5757\u5316\u53ef\u6267\u884c\u7ec4\u4ef6\uff0c\u4ee5\u7edf\u4e00\u80fd\u529b\u8868\u793a\u4e32\u8054\u5de5\u5177\u53d1\u73b0\u3001\u73af\u5883\u6267\u884c\u548c\u4efb\u52a1\u5408\u6210\uff0c\u6784\u5efa\u5bb6\u5ead\u3001\u6c7d\u8f66\u53ca\u624b\u673a\u573a\u666f\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/X-LANCE/SynthDCB", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2611.18639", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8986\u76d6114\u7c7b\u8bbe\u5907\u30011166\u4e2a\u51fd\u6570\u4e0e95\u79cd\u4e8b\u4ef6", "22\u4e2a\u6a21\u578b\u8bc4\u6d4b2560\u9879\u4efb\u52a1\uff0c\u6700\u4f73Pass@1\u4e3a88.8%", "1000\u9879\u91c7\u6837\u4efb\u52a1\u8bed\u4e49\u8986\u76d681.6%\u7684\u771f\u5b9e\u8bed\u6599\u6307\u4ee4"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u8bbe\u5907\u63a7\u5236", "\u4e16\u754c\u84b8\u998f", "\u4eff\u771f\u73af\u5883"], "num_comments": 3, "on_hf": true, "organization": "SJTU X-LANCE Lab", "pdf_url": "https://arxiv.org/pdf/2611.18639v2", "published_at": "2026-10-14", "score": 0.289, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18639.png", "title": "SynthDCB: World Distillation for Scalable Device Control Benchmarking", "tldr": "\u901a\u8fc7\u4e16\u754c\u84b8\u998f\u6784\u5efa\u53ef\u6267\u884c\u8bbe\u5907\u73af\u5883\uff0c\u6269\u5c55\u667a\u80fd\u4f53\u63a7\u5236\u4efb\u52a1\u5e76\u652f\u6301\u53ef\u9a8c\u8bc1\u8bc4\u6d4b\u3002", "upvotes": 8, "what_it_is": "SynthDCB\u5c06\u8bbe\u5907\u884c\u4e3a\u3001\u7ea6\u675f\u4e0e\u73af\u5883\u5f71\u54cd\u84b8\u998f\u4e3a\u6a21\u5757\u5316\u53ef\u6267\u884c\u7ec4\u4ef6\uff0c\u4ee5\u7edf\u4e00\u80fd\u529b\u8868\u793a\u4e32\u8054\u5de5\u5177\u53d1\u73b0\u3001\u73af\u5883\u6267\u884c\u548c\u4efb\u52a1\u5408\u6210\uff0c\u6784\u5efa\u5bb6\u5ead\u3001\u6c7d\u8f66\u53ca\u624b\u673a\u573a\u666f\u3002", "why_notable": "\u5c06\u771f\u5b9e\u8bbe\u5907\u77e5\u8bc6\u8f6c\u4e3a\u53ef\u6269\u5c55\u7684\u4ea4\u4e92\u73af\u5883\uff0c\u5e76\u7528\u663e\u5f0f\u72b6\u6001\u4e0e\u5de5\u5177\u8c03\u7528\u8f68\u8ff9\u9a8c\u8bc1\u4efb\u52a1\uff0c\u4e3a\u8bbe\u5907\u63a7\u5236\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u7cfb\u7edf\u7684\u8bc4\u6d4b\u57fa\u7840\u3002"}, {"abstract": "Code localizers are usually trained to predict the files a reference patch edits, but the code a fixer needs to read is not the same as the code it changes. We propose Fixer-Guided Localization (FGL): the localizer proposes several localizations, a frozen fixer scores each by how likely it makes a verified patch, and the localizer is trained on these scores with weighted supervised fine-tuning, without running tests and without reinforcement learning. We build the full pipeline on Gemma 4 E4B for the Kaggle Gemma-4 Developer Agent competition, from 1,629 test-verified Kimi K3 trajectories. The FGL target helps the fixer find the bug as often as the teacher\u0027s localization while using 27.5% less code. On the development set, one EM round moves the agent in the expected direction compared with a matched control: more tasks reach a patch (53 vs. 46), fewer tasks get stuck reading files that do not exist (43 vs. 54), and more tasks are solved (8 vs. 6). Training also changes how the agent works: trained agents explore about three times more than the base model and write far fewer wrong patches, and the single agent solves up to 11 of 78 tasks, against 8 for the base model. An analysis of 13 evaluation runs identifies what limits a 4B agent under an 8-minute budget (time, repetition loops and edit quality) and gives practical lessons for training small coding agents. All data, code and adapters are publicly available.", "arxiv_id": "2611.12164", "arxiv_url": "https://arxiv.org/abs/2611.12164", "authors": ["Khalil Hennara", "Muhammad Hreden", "Zeina Aldallal", "Sara Chrouf", "Safwan AlModhayan"], "brief": "\u63d0\u51fa\u4fee\u590d\u5668\u5f15\u5bfc\u5b9a\u4f4d\uff1a\u5b9a\u4f4d\u5668\u751f\u6210\u591a\u4e2a\u5019\u9009\uff0c\u51bb\u7ed3\u4fee\u590d\u5668\u6309\u5df2\u9a8c\u8bc1\u8865\u4e01\u7684\u4f3c\u7136\u8bc4\u5206\uff0c\u518d\u4ee5\u52a0\u6743\u76d1\u7763\u5fae\u8c03\u8bad\u7ec3\u5b9a\u4f4d\u5668\uff0c\u65e0\u9700\u8fd0\u884c\u6d4b\u8bd5\u6216\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": "https://github.com/misraj-ai/locfix", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12164", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u57fa\u4e8eGemma 4 E4B\u4e0e1629\u6761\u5df2\u9a8c\u8bc1\u8f68\u8ff9\u6784\u5efa\u6d41\u7a0b", "FGL\u8fbe\u5230\u6559\u5e08\u5b9a\u4f4d\u7684\u627e\u9519\u6548\u679c\uff0c\u4ee3\u7801\u91cf\u51cf\u5c1127.5%", "\u5355\u667a\u80fd\u4f53\u6700\u591a\u89e3\u51b378\u9898\u4e2d\u768411\u9898\uff0c\u57fa\u5ea7\u4e3a8\u9898"], "keywords": ["\u4ee3\u7801\u5b9a\u4f4d", "\u7a0b\u5e8f\u4fee\u590d", "\u76d1\u7763\u5fae\u8c03", "\u4ee3\u7801\u667a\u80fd\u4f53"], "num_comments": 4, "on_hf": true, "organization": "Misraj Ai", "pdf_url": "https://arxiv.org/pdf/2611.12164v1", "published_at": "2026-11-09", "score": 0.288, "selected_reasons": ["HF trending (51\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12164.png", "title": "Let the Fixer Decide: Training a Code Localizer from the Fixer\u0027s Likelihood", "tldr": "\u7528\u4fee\u590d\u5668\u5bf9\u6b63\u786e\u8865\u4e01\u7684\u4f3c\u7136\u8bad\u7ec3\u4ee3\u7801\u5b9a\u4f4d\u5668\uff0c\u51cf\u5c11\u9605\u8bfb\u4ee3\u7801\u5e76\u6539\u5584\u5c0f\u578b\u667a\u80fd\u4f53\u4fee\u590d\u8868\u73b0\u3002", "upvotes": 51, "what_it_is": "\u63d0\u51fa\u4fee\u590d\u5668\u5f15\u5bfc\u5b9a\u4f4d\uff1a\u5b9a\u4f4d\u5668\u751f\u6210\u591a\u4e2a\u5019\u9009\uff0c\u51bb\u7ed3\u4fee\u590d\u5668\u6309\u5df2\u9a8c\u8bc1\u8865\u4e01\u7684\u4f3c\u7136\u8bc4\u5206\uff0c\u518d\u4ee5\u52a0\u6743\u76d1\u7763\u5fae\u8c03\u8bad\u7ec3\u5b9a\u4f4d\u5668\uff0c\u65e0\u9700\u8fd0\u884c\u6d4b\u8bd5\u6216\u5f3a\u5316\u5b66\u4e60\u3002", "why_notable": "\u5c06\u5b9a\u4f4d\u76ee\u6807\u4ece\u8865\u4e01\u4fee\u6539\u4f4d\u7f6e\u8f6c\u5411\u4fee\u590d\u5668\u5b9e\u9645\u6240\u9700\u4fe1\u606f\uff0c\u4e3a\u5c0f\u578b\u4ee3\u7801\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u8d34\u5408\u4e0b\u6e38\u4efb\u52a1\u7684\u8bad\u7ec3\u4fe1\u53f7\uff1b\u6570\u636e\u3001\u4ee3\u7801\u4e0e\u9002\u914d\u5668\u5747\u5df2\u516c\u5f00\u3002"}, {"abstract": "Learning robot manipulation from egocentric human videos requires accurate metric 3D hand motion. Recent methods leverage pretrained video diffusion model (VDM) priors to recover occluded hands directly from full-frame videos, but their appearance-based depth regression generalizes poorly to unseen cameras. In this work, we propose ViDiHand2, a geometry-driven framework that reformulates VDM-based hand depth estimation from direct regression into fine-grained geometric constraint solving. Specifically, we introduce Fine-Grained Geometric Lifting and Clip-Level Ray Fitting, which recover metric depth by enforcing geometric consistency between pixel-aligned 2D joints and the metric structure of MANO hands, while leveraging temporal observations across the clip. Since the lifting relies on these 2D joints, to improve robustness under occlusion and image truncation, we further develop Confidence-Gated Fusion to adaptively combine geometrically lifted joints with MANO predictions according to localization confidence. Finally, we enhance the VDM backbone to better capture spatial-temporal representations and produce the per-frame 2D joint and MANO predictions that both steps rely on. Extensive experiments on seven public datasets demonstrate that ViDiHand2 consistently outperforms 18 baselines, reducing in-the-wild absolute joint error by 42% and detection failures by 8.82x compared with the best baseline on each metric, while running at 57 FPS. The code is available at https://github.com/NTUYWANG103/ViDiHand.", "arxiv_id": "2611.30597", "arxiv_url": "https://arxiv.org/abs/2611.30597", "authors": ["Yuxi Wang", "Yufei Liu", "Chengkai Jin", "Qingyue Chen", "Wenqi Ouyang", "Tianyi Wei", "Kerui Ren", "Siyuan Huang", "Zhiqi Shen", "Hongsheng Li", "Xingang Pan"], "brief": "\u63d0\u51fa\u51e0\u4f55\u9a71\u52a8\u7684\u624b\u90e8\u8fd0\u52a8\u91cd\u5efa\u6846\u67b6\uff0c\u5c06\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u6df1\u5ea6\u56de\u5f52\u6539\u4e3a\u7ea6\u675f\u6c42\u89e3\u3002\u7ed3\u5408\u4e8c\u7ef4\u5173\u8282\u3001MANO\u624b\u90e8\u7ed3\u6784\u4e0e\u7247\u6bb5\u65f6\u5e8f\u4fe1\u606f\u6062\u590d\u771f\u5b9e\u5c3a\u5ea6\u6df1\u5ea6\uff0c\u5e76\u6309\u7f6e\u4fe1\u5ea6\u878d\u5408\u9884\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30597", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7ec6\u7c92\u5ea6\u51e0\u4f55\u63d0\u5347\u4e0e\u7247\u6bb5\u7ea7\u5c04\u7ebf\u62df\u5408\u6c42\u89e3\u6df1\u5ea6", "\u7f6e\u4fe1\u5ea6\u95e8\u63a7\u878d\u5408\u51e0\u4f55\u5173\u8282\u4e0eMANO\u9884\u6d4b", "7\u4e2a\u6570\u636e\u96c6\u5bf9\u6bd418\u79cd\u57fa\u7ebf\uff0c\u8bef\u5dee\u964d42%\uff0c57 FPS"], "keywords": ["\u4e09\u7ef4\u624b\u90e8\u91cd\u5efa", "\u89c6\u9891\u6269\u6563\u6a21\u578b", "\u51e0\u4f55\u7ea6\u675f", "\u673a\u5668\u4eba\u64cd\u4f5c"], "num_comments": 2, "on_hf": true, "organization": "ACE Robotics", "pdf_url": "https://arxiv.org/pdf/2611.30597v1", "published_at": "2026-11-23", "score": 0.286, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30597.png", "title": "ViDiHand2: Unifying Video Diffusion Priors and Hand Geometry for 3D Hand Motion Reconstruction in the Wild", "tldr": "\u4ee5\u89c6\u9891\u6269\u6563\u5148\u9a8c\u7ed3\u5408\u624b\u90e8\u51e0\u4f55\u7ea6\u675f\uff0c\u63d0\u5347\u771f\u5b9e\u573a\u666f\u4e09\u7ef4\u624b\u90e8\u8fd0\u52a8\u91cd\u5efa\u7cbe\u5ea6\u3002", "upvotes": 20, "what_it_is": "\u63d0\u51fa\u51e0\u4f55\u9a71\u52a8\u7684\u624b\u90e8\u8fd0\u52a8\u91cd\u5efa\u6846\u67b6\uff0c\u5c06\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u6df1\u5ea6\u56de\u5f52\u6539\u4e3a\u7ea6\u675f\u6c42\u89e3\u3002\u7ed3\u5408\u4e8c\u7ef4\u5173\u8282\u3001MANO\u624b\u90e8\u7ed3\u6784\u4e0e\u7247\u6bb5\u65f6\u5e8f\u4fe1\u606f\u6062\u590d\u771f\u5b9e\u5c3a\u5ea6\u6df1\u5ea6\uff0c\u5e76\u6309\u7f6e\u4fe1\u5ea6\u878d\u5408\u9884\u6d4b\u3002", "why_notable": "\u7528\u51e0\u4f55\u7ea6\u675f\u7f13\u89e3\u5916\u89c2\u6df1\u5ea6\u56de\u5f52\u5bf9\u65b0\u76f8\u673a\u7684\u6cdb\u5316\u95ee\u9898\uff0c\u540c\u65f6\u517c\u987e\u906e\u6321\u9c81\u68d2\u6027\u4e0e\u5b9e\u65f6\u901f\u5ea6\uff0c\u4e3a\u4ece\u4eba\u7c7b\u89c6\u9891\u5b66\u4e60\u673a\u5668\u4eba\u64cd\u4f5c\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u8fd0\u52a8\u8f93\u5165\u3002"}, {"abstract": "Multimodal large language models have greatly improved input understanding in universal multimodal embedding models. However, this understanding does not ensure that their embeddings preserve the evidence needed to distinguish relevant items from confusable alternatives. To preserve essential discriminative evidence in embeddings, this paper proposes DiLE, a discrimination-aware latent-space learning framework that combines task guidance with on-policy retrieval feedback. Specifically, a few learnable queries are used to encode task-relevant information in a compact latent space. Reasoning instructions and auxiliary answer-generation supervision shape these representations to support both task understanding and retrieval discrimination. To address task-specific discriminative needs, we design shared-private expert adaptation that integrates cross-task knowledge sharing with task-specific representation learning. Building on this, the on-policy hard-negative distillation is introduced: the student retrieves confusable candidates, and a reverse KL divergence objective aligns its embedding-based similarity distribution with the teacher\u0027s fine-grained relevance distribution over these candidates. Candidates are periodically refreshed using updated student snapshots, tying teacher supervision to the student\u0027s evolving retrieval behavior and confusions. Across four model configurations that span two backbone generations, DiLE achieves state-of-the-art performance on MMEB-v2, UVRB, and MRMR, demonstrating its effectiveness across modalities and tasks.", "arxiv_id": "2611.25419", "arxiv_url": "https://arxiv.org/abs/2611.25419", "authors": ["Ben Kang", "Junda Wang", "Yuxuan Yuan", "Hang Li", "Yuhan Liu", "Xin Chen", "Wanting Geng", "Tong Lin", "Pei Fu", "Dong Wang", "Jian Luan", "Huchuan Lu"], "brief": "DiLE\u7528\u5c11\u91cf\u53ef\u5b66\u4e60\u67e5\u8be2\u6784\u5efa\u7d27\u51d1\u6f5c\u5728\u8868\u793a\uff0c\u5e76\u4ee5\u63a8\u7406\u6307\u4ee4\u548c\u7b54\u6848\u751f\u6210\u76d1\u7763\u5f15\u5bfc\u5b66\u4e60\uff1b\u7ed3\u5408\u5171\u4eab\u79c1\u6709\u4e13\u5bb6\u9002\u914d\u4e0e\u5b66\u751f\u68c0\u7d22\u53cd\u9988\uff0c\u4fdd\u7559\u533a\u5206\u76f8\u4f3c\u5019\u9009\u6240\u9700\u7684\u8bc1\u636e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.25419", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5171\u4eab\u79c1\u6709\u4e13\u5bb6\u9002\u914d\u517c\u987e\u8de8\u4efb\u52a1\u5171\u4eab\u4e0e\u4efb\u52a1\u7279\u5b9a\u8868\u5f81", "\u5728\u7ebf\u7b56\u7565\u96be\u8d1f\u4f8b\u84b8\u998f\u4ee5\u53cd\u5411KL\u5bf9\u9f50\u5e08\u751f\u76f8\u5173\u6027\u5206\u5e03", "\u8de8\u4e24\u4ee3\u9aa8\u5e72\u76844\u79cd\u914d\u7f6e\uff0c\u57283\u4e2a\u68c0\u7d22\u57fa\u51c6\u8fbe\u6700\u4f73\u8868\u73b0"], "keywords": ["\u591a\u6a21\u6001\u5d4c\u5165", "\u77e5\u8bc6\u84b8\u998f", "\u96be\u8d1f\u4f8b\u6316\u6398", "\u68c0\u7d22"], "num_comments": 2, "on_hf": true, "organization": "Xiaomi Research", "pdf_url": "https://arxiv.org/pdf/2611.25419v1", "published_at": "2026-11-19", "score": 0.282, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.25419.png", "title": "DiLE: Discrimination-Aware Latent-Space Learning for Universal Multimodal Embeddings", "tldr": "\u901a\u8fc7\u4efb\u52a1\u5f15\u5bfc\u4e0e\u52a8\u6001\u96be\u8d1f\u4f8b\u84b8\u998f\uff0c\u63d0\u5347\u901a\u7528\u591a\u6a21\u6001\u5d4c\u5165\u7684\u68c0\u7d22\u8fa8\u522b\u80fd\u529b\u3002", "upvotes": 17, "what_it_is": "DiLE\u7528\u5c11\u91cf\u53ef\u5b66\u4e60\u67e5\u8be2\u6784\u5efa\u7d27\u51d1\u6f5c\u5728\u8868\u793a\uff0c\u5e76\u4ee5\u63a8\u7406\u6307\u4ee4\u548c\u7b54\u6848\u751f\u6210\u76d1\u7763\u5f15\u5bfc\u5b66\u4e60\uff1b\u7ed3\u5408\u5171\u4eab\u79c1\u6709\u4e13\u5bb6\u9002\u914d\u4e0e\u5b66\u751f\u68c0\u7d22\u53cd\u9988\uff0c\u4fdd\u7559\u533a\u5206\u76f8\u4f3c\u5019\u9009\u6240\u9700\u7684\u8bc1\u636e\u3002", "why_notable": "\u5b83\u5c06\u68c0\u7d22\u8fa8\u522b\u80fd\u529b\u4e0e\u8f93\u5165\u7406\u89e3\u5206\u5f00\u4f18\u5316\uff0c\u5e76\u8ba9\u6559\u5e08\u76d1\u7763\u968f\u5b66\u751f\u7684\u5b9e\u9645\u6df7\u6dc6\u52a8\u6001\u66f4\u65b0\uff0c\u4e3a\u8de8\u6a21\u6001\u3001\u8de8\u4efb\u52a1\u68c0\u7d22\u63d0\u4f9b\u66f4\u6709\u9488\u5bf9\u6027\u7684\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Latent generative models typically rely on three separate networks: an encoder that tokenizes pixels, a generator that models the latent distribution, and a decoder that maps latents back to pixels. UNITE recently merged the first two into a single generative encoder trained in one stage, but its decoder remains a separate network. We ask whether this last network can be folded in too, so that one diffusion transformer encodes, generates, and decodes. Simply letting the shared backbone decode does not help. What makes it work is to cast all three modes as position-aligned sequence maps over one fully shared backbone, distinguished only by a mode token and the timestep. The resulting model, UNIFIED, is simple: one network trained from scratch in a single stage with only reconstruction and flow-matching losses, without adversarial losses or pretrained encoders (e.g., DINO). On ImageNet-1K 256x256 at matched parameters, UNIFIED improves gFID over UNITE at three sizes (~60M, ~115M, and ~215M) and reaches 2.08 with 215M parameters, the lowest among compared models under 250M parameters. On text-to-image generation, UNIFIED-B (218M) reaches a GenEval score of 0.87 at 512x512, exceeding single-stage pixel diffusion models with around one billion parameters. Full unification of latent diffusion is thus not merely feasible but beneficial.", "arxiv_id": "2611.29064", "arxiv_url": "https://arxiv.org/abs/2611.29064", "authors": ["Hao-Yu Hsu", "Shenlong Wang", "Alexander G. Schwing"], "brief": "UNIFIED\u5c06\u7f16\u7801\u3001\u751f\u6210\u4e0e\u89e3\u7801\u7edf\u4e00\u4e3a\u4f4d\u7f6e\u5bf9\u9f50\u7684\u5e8f\u5217\u6620\u5c04\uff0c\u5171\u4eab\u540c\u4e00\u9aa8\u5e72\uff0c\u4ec5\u4ee5\u6a21\u5f0f\u6807\u8bb0\u548c\u65f6\u95f4\u6b65\u533a\u5206\u4efb\u52a1\u3002\u6a21\u578b\u4ece\u96f6\u5355\u9636\u6bb5\u8bad\u7ec3\uff0c\u53ea\u7528\u91cd\u5efa\u4e0e\u6d41\u5339\u914d\u635f\u5931\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/haoyuhsu/Unified-LDM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29064", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4f4d\u7f6e\u5bf9\u9f50\u5e8f\u5217\u6620\u5c04\u5b9e\u73b0\u4e09\u6a21\u5f0f\u5168\u9aa8\u5e72\u5171\u4eab", "ImageNet 256\u5206\u8fa8\u7387\uff1a215M\u53c2\u6570\u8fbegFID 2.08", "\u6587\u751f\u56fe512\u5206\u8fa8\u7387\uff1a218M\u53c2\u6570\u8fbeGenEval 0.87"], "keywords": ["\u6f5c\u5728\u6269\u6563", "\u56fe\u50cf\u751f\u6210", "\u5171\u4eab\u9aa8\u5e72", "\u5355\u9636\u6bb5\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.29064v1", "published_at": "2026-11-21", "score": 0.276, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29064.png", "title": "Single-Transformer Latent Diffusion", "tldr": "\u7528\u5355\u4e2a\u6269\u6563Transformer\u7edf\u4e00\u7f16\u7801\u3001\u751f\u6210\u4e0e\u89e3\u7801\uff0c\u517c\u987e\u67b6\u6784\u7b80\u5316\u548c\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 13, "what_it_is": "UNIFIED\u5c06\u7f16\u7801\u3001\u751f\u6210\u4e0e\u89e3\u7801\u7edf\u4e00\u4e3a\u4f4d\u7f6e\u5bf9\u9f50\u7684\u5e8f\u5217\u6620\u5c04\uff0c\u5171\u4eab\u540c\u4e00\u9aa8\u5e72\uff0c\u4ec5\u4ee5\u6a21\u5f0f\u6807\u8bb0\u548c\u65f6\u95f4\u6b65\u533a\u5206\u4efb\u52a1\u3002\u6a21\u578b\u4ece\u96f6\u5355\u9636\u6bb5\u8bad\u7ec3\uff0c\u53ea\u7528\u91cd\u5efa\u4e0e\u6d41\u5339\u914d\u635f\u5931\u3002", "why_notable": "\u5b83\u8868\u660e\u6f5c\u5728\u6269\u6563\u7684\u4e09\u7f51\u7ed3\u6784\u53ef\u4ee5\u5f7b\u5e95\u5408\u4e00\uff0c\u5e76\u5728\u5339\u914d\u53c2\u6570\u91cf\u4e0b\u63d0\u5347\u8d28\u91cf\uff1b\u6587\u751f\u56fe\u8868\u73b0\u8fd8\u8d85\u8fc7\u7ea6\u5341\u4ebf\u53c2\u6570\u7684\u5355\u9636\u6bb5\u50cf\u7d20\u6269\u6563\u6a21\u578b\u3002"}, {"abstract": "LLMs typically solve complex tasks with chain-of-thought (CoT) reasoning, which is also the main tool for monitoring them for misaligned behavior. However, standard transformers can also solve tasks with complete latent reasoning (CLR), carrying out the whole task internally and outputting only the final answer. Theory bounds the depth of CLR, the number of sequential steps it can carry out, and recent work measured it to be shallow. In this work, we ask whether CLR is deep enough for a model to pursue a hidden objective that requires reasoning. Such a model would generate a CoT that appears to solve the given task, while a latent multi-step computation decides its answer based on the hidden objective. First, we show that a simple auxiliary loss allows models to solve a multi-step task latently at least 5x deeper than previously reported. Then, in two common tasks, decision-making and code generation, we train a model to pursue such a hidden objective, which decides a loan or plants a vulnerability. The model\u0027s CoT justifies the output with no trace of the hidden objective, and a strong LLM monitor does not flag it. Finally, using activation patching, we find that the latent computation is completed before the model generates its CoT, which takes no part in it. Altogether, we show that a hidden objective that requires reasoning can go unseen by a monitor that reads only the output.", "arxiv_id": "2611.31015", "arxiv_url": "https://arxiv.org/abs/2611.31015", "authors": ["Tomer Ashuach", "Zorik Gekhman", "Avi Caciularu", "Ori Ram", "Jonathan Herzig"], "brief": "\u7814\u7a76\u7528\u8f85\u52a9\u635f\u5931\u8bad\u7ec3\u6a21\u578b\u6267\u884c\u5b8c\u5168\u6f5c\u5728\u63a8\u7406\uff0c\u5e76\u5728\u8d37\u6b3e\u51b3\u7b56\u4e0e\u4ee3\u7801\u751f\u6210\u4e2d\u690d\u5165\u9690\u85cf\u76ee\u6807\u3002\u901a\u8fc7\u6fc0\u6d3b\u4fee\u8865\u9a8c\u8bc1\uff0c\u5185\u90e8\u8ba1\u7b97\u5728\u601d\u7ef4\u94fe\u751f\u6210\u524d\u5df2\u5b8c\u6210\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31015", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8f85\u52a9\u635f\u5931\u4f7f\u5b8c\u5168\u6f5c\u5728\u63a8\u7406\u6df1\u5ea6\u81f3\u5c11\u8fbe\u5230\u6b64\u524d\u76845\u500d", "\u8d37\u6b3e\u51b3\u7b56\u4e0e\u4ee3\u7801\u751f\u6210\u4e2d\u7684\u9690\u85cf\u76ee\u6807\u672a\u88ab\u5f3aLLM\u76d1\u63a7\u5668\u6807\u8bb0", "\u6fc0\u6d3b\u4fee\u8865\u8868\u660e\u601d\u7ef4\u94fe\u4e0d\u53c2\u4e0e\u9690\u85cf\u76ee\u6807\u7684\u5185\u90e8\u8ba1\u7b97"], "keywords": ["\u6f5c\u5728\u63a8\u7406", "\u601d\u7ef4\u94fe", "\u6a21\u578b\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 3, "on_hf": true, "organization": "Technion Israel institute of technology", "pdf_url": "https://arxiv.org/pdf/2611.31015v1", "published_at": "2026-11-23", "score": 0.271, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31015.png", "title": "Can Latent Reasoning Drive LLM Outputs Without a Trace?", "tldr": "\u6a21\u578b\u53ef\u5728\u5185\u90e8\u591a\u6b65\u63a8\u7406\u8ffd\u6c42\u9690\u85cf\u76ee\u6807\uff0c\u751f\u6210\u770b\u4f3c\u6b63\u5e38\u7684\u601d\u7ef4\u94fe\u5e76\u7ed5\u8fc7\u76d1\u63a7\u3002", "upvotes": 10, "what_it_is": "\u7814\u7a76\u7528\u8f85\u52a9\u635f\u5931\u8bad\u7ec3\u6a21\u578b\u6267\u884c\u5b8c\u5168\u6f5c\u5728\u63a8\u7406\uff0c\u5e76\u5728\u8d37\u6b3e\u51b3\u7b56\u4e0e\u4ee3\u7801\u751f\u6210\u4e2d\u690d\u5165\u9690\u85cf\u76ee\u6807\u3002\u901a\u8fc7\u6fc0\u6d3b\u4fee\u8865\u9a8c\u8bc1\uff0c\u5185\u90e8\u8ba1\u7b97\u5728\u601d\u7ef4\u94fe\u751f\u6210\u524d\u5df2\u5b8c\u6210\u3002", "why_notable": "\u7ed3\u679c\u63ed\u793a\u4ec5\u5ba1\u67e5\u8f93\u51fa\u4e0e\u601d\u7ef4\u94fe\u7684\u5b89\u5168\u76d1\u63a7\u5b58\u5728\u76f2\u533a\uff1a\u53ef\u89c1\u89e3\u91ca\u770b\u4f3c\u5408\u7406\uff0c\u4e5f\u4e0d\u4ee3\u8868\u5b83\u5fe0\u5b9e\u53cd\u6620\u6a21\u578b\u7684\u51b3\u7b56\u8fc7\u7a0b\u3002"}, {"abstract": "Long-horizon embodied tasks involve physical dependencies that may only become clear through interaction. As task understanding deepens, past trials can reveal new information for adaptation and transfer. However, coarse progress feedback cannot identify which physical preconditions held, leaving search unguided, while task-specific optimization easily overfits to individual scenes, making cross-task transfer brittle. We introduce ReWeave, a framework that jointly optimizes an embodied agent harness and an emergent physical task topology from interaction without updating policy weights. Keeping execution policies and perception frozen, ReWeave co-optimizes coupled context, workflows, and control loops. As new evidence revises the topology, ReWeave reprojects past trials onto the updated task understanding, exposing retained progress, regressions, and bottlenecks that guide parent selection and search width. Across tasks, matching verified local mechanisms to unmet preconditions consolidates 72 specialist units into 44 reusable groups ($0.34\\times$ full concatenation) within a compact shared harness capable of continual learning. ReWeave improves held-out success from 89.00% to 98.75% on LIBERO-PRO and from 25.50% to 58.25% on RoboDojo, while uncovering retained progress in 89% of 159 failed RoboDojo development trials and translating stronger offline reasoning into higher online performance. On eight unseen LIBERO-PRO tasks, the shared harness reaches 51.3% success versus 41.3% for direct distillation, rising to 75.0% after continual learning.", "arxiv_id": "2611.31053", "arxiv_url": "https://arxiv.org/abs/2611.31053", "authors": ["Yicheng Xu", "Wencan Jiang", "Zihao Zhu", "Keru Zhou", "Chang Zhou", "Li Liu", "Maoqing Yao", "Yong Liu", "Jiangning Zhang"], "brief": "ReWeave\u5728\u51bb\u7ed3\u6267\u884c\u7b56\u7565\u4e0e\u611f\u77e5\u7684\u6761\u4ef6\u4e0b\uff0c\u8054\u5408\u4f18\u5316\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u3001\u5de5\u4f5c\u6d41\u3001\u63a7\u5236\u5faa\u73af\u53ca\u7269\u7406\u4efb\u52a1\u62d3\u6251\uff0c\u5e76\u6309\u66f4\u65b0\u540e\u7684\u62d3\u6251\u91cd\u8bc4\u5386\u53f2\u8bd5\u9a8c\u4ee5\u6307\u5bfc\u641c\u7d22\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/xuyicheng-zju/ReWeave", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.31053", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c0672\u4e2a\u4e13\u7528\u5355\u5143\u6574\u5408\u4e3a44\u4e2a\u53ef\u590d\u7528\u7ec4", "RoboDojo\u7559\u51fa\u96c6\u6210\u529f\u7387\u4ece25.50%\u5347\u81f358.25%", "8\u4e2a\u672a\u89c1\u4efb\u52a1\u6210\u529f\u738751.3%\uff0c\u6301\u7eed\u5b66\u4e60\u540e\u8fbe75.0%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u4efb\u52a1\u89c4\u5212", "\u8de8\u4efb\u52a1\u8fc1\u79fb", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31053v1", "published_at": "2026-11-23", "score": 0.262, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31053.png", "title": "ReWeave: Emergent Physical Task Topologies for Embodied Harness Optimization and Cross-Task Meta-Distillation", "tldr": "\u51bb\u7ed3\u7b56\u7565\u6743\u91cd\uff0c\u901a\u8fc7\u4ea4\u4e92\u91cd\u5efa\u7269\u7406\u4f9d\u8d56\u5e76\u4f18\u5316\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u63d0\u5347\u8de8\u4efb\u52a1\u8fc1\u79fb", "upvotes": 3, "what_it_is": "ReWeave\u5728\u51bb\u7ed3\u6267\u884c\u7b56\u7565\u4e0e\u611f\u77e5\u7684\u6761\u4ef6\u4e0b\uff0c\u8054\u5408\u4f18\u5316\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u3001\u5de5\u4f5c\u6d41\u3001\u63a7\u5236\u5faa\u73af\u53ca\u7269\u7406\u4efb\u52a1\u62d3\u6251\uff0c\u5e76\u6309\u66f4\u65b0\u540e\u7684\u62d3\u6251\u91cd\u8bc4\u5386\u53f2\u8bd5\u9a8c\u4ee5\u6307\u5bfc\u641c\u7d22\u3002", "why_notable": "\u5b83\u628a\u5931\u8d25\u8f68\u8ff9\u4e2d\u7684\u5c40\u90e8\u8fdb\u5c55\u8f6c\u5316\u4e3a\u4f18\u5316\u4fe1\u53f7\uff0c\u65e0\u9700\u66f4\u65b0\u7b56\u7565\u6743\u91cd\u5373\u53ef\u63d0\u5347\u6210\u529f\u7387\uff0c\u5e76\u5c55\u793a\u4e86\u5171\u4eab\u6846\u67b6\u7684\u8de8\u4efb\u52a1\u590d\u7528\u4e0e\u6301\u7eed\u5b66\u4e60\u6f5c\u529b\u3002"}, {"abstract": "Vision-language model (VLM)-based agents offer a promising approach to robotic manipulation, yet remain limited by inadequate memory organization, uncertain failure attribution, and limited reuse of execution experience. We propose Embodied-Harness, a dual-agent framework that improves manipulation by refining the execution harness without updating model parameters. The Actor interacts with the environment through a robot-control interface, while the Reflector converts execution evidence into reusable operational guidance. Hierarchical Memory Architecture maintains short-term execution context and long-term experiential knowledge to support execution and reflection. Evidence-based Experience Reflection grounds failure diagnosis in observed interactions, while Recursive Harness Self-Improvement refines operational guidance across successive attempts. Experiments on RoboTwin 2.0, RoboSPA, and RMBench demonstrate the effectiveness of Embodied-Harness in generalization under environmental variations, spatial reasoning, long-horizon planning, and memory-dependent manipulation. Our method achieves success rates of 82.4%, 76.7%, and 94.4% on the three benchmarks, respectively. Real-world evaluation further yields an average success rate of 96.7% across three manipulation tasks. These results highlight the potential of Embodied-Harness to improve robotic manipulation through experience-driven harness self-improvement.", "arxiv_id": "2611.27689", "arxiv_url": "https://arxiv.org/abs/2611.27689", "authors": ["Zhenxuan Fan", "Zhuoya Wang", "Yuqian Yuan", "Wenqiao Zhang", "Juncheng Li", "Jun Xiao", "Siliang Tang", "Yueting Zhuang"], "brief": "\u63d0\u51fa\u6267\u884c\u4e0e\u53cd\u601d\u53cc\u667a\u80fd\u4f53\u6846\u67b6\uff1a\u6267\u884c\u8005\u63a7\u5236\u673a\u5668\u4eba\uff0c\u53cd\u601d\u8005\u4f9d\u636e\u4ea4\u4e92\u8bc1\u636e\u8bca\u65ad\u5931\u8d25\uff1b\u7ed3\u5408\u5206\u5c42\u8bb0\u5fc6\uff0c\u5c06\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u64cd\u4f5c\u6307\u5bfc\uff0c\u5e76\u9010\u8f6e\u6539\u8fdb\u6267\u884c\u6846\u67b6\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27689", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5206\u5c42\u8bb0\u5fc6\u7ba1\u7406\u77ed\u671f\u6267\u884c\u4e0a\u4e0b\u6587\u4e0e\u957f\u671f\u7ecf\u9a8c", "\u4f9d\u636e\u4ea4\u4e92\u8bc1\u636e\u53cd\u601d\u5931\u8d25\uff0c\u9012\u5f52\u6539\u8fdb\u64cd\u4f5c\u6307\u5bfc", "\u4e09\u9879\u57fa\u51c6\u6210\u529f\u738782.4%\u300176.7%\u300194.4%"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u591a\u667a\u80fd\u4f53", "\u7ecf\u9a8c\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2611.27689v2", "published_at": "2026-11-20", "score": 0.261, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27689.png", "title": "Embodied-Harness: Towards Recursive Self-Improvement for Robotic Manipulation", "tldr": "\u901a\u8fc7\u6267\u884c\u4e0e\u53cd\u601d\u53cc\u667a\u80fd\u4f53\u79ef\u7d2f\u7ecf\u9a8c\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u5373\u53ef\u6539\u8fdb\u673a\u5668\u4eba\u64cd\u4f5c\u3002", "upvotes": 7, "what_it_is": "\u63d0\u51fa\u6267\u884c\u4e0e\u53cd\u601d\u53cc\u667a\u80fd\u4f53\u6846\u67b6\uff1a\u6267\u884c\u8005\u63a7\u5236\u673a\u5668\u4eba\uff0c\u53cd\u601d\u8005\u4f9d\u636e\u4ea4\u4e92\u8bc1\u636e\u8bca\u65ad\u5931\u8d25\uff1b\u7ed3\u5408\u5206\u5c42\u8bb0\u5fc6\uff0c\u5c06\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u64cd\u4f5c\u6307\u5bfc\uff0c\u5e76\u9010\u8f6e\u6539\u8fdb\u6267\u884c\u6846\u67b6\u3002", "why_notable": "\u5c06\u6539\u8fdb\u5bf9\u8c61\u4ece\u6a21\u578b\u53c2\u6570\u8f6c\u5411\u6267\u884c\u6846\u67b6\uff0c\u4e3a\u673a\u5668\u4eba\u590d\u7528\u7ecf\u9a8c\u63d0\u4f9b\u8def\u5f84\uff1b\u771f\u5b9e\u73af\u5883\u4e09\u9879\u64cd\u4f5c\u4efb\u52a1\u5e73\u5747\u6210\u529f\u7387\u8fbe96.7%\u3002"}, {"abstract": "Vision-language models have become a new kind of describer, writing about almost anything people see, and their descriptions now shape how cultures are known by people and by other models. Descriptions of cultures tend to turn particular things into types, and what a description loses shows what its describer lacks. We introduce Polytropos, a benchmark that measures what model descriptions of cultural objects keep of the particular object by turning each description back into an image and comparing it with the original photograph. On 374 objects from the Metropolitan Museum of Art and the Getty, with 1,870 descriptions from five models and 230 written by curators, reconstructions are recognised as the recorded culture more often than the photographs, at 54.55% to 59.09% against 52.14%, yet 16% to 21% of objects change outcome and only 0.49% of reconstructions are identified as the specific object. On the same objects, models lose recorded cultures at a rate similar to curators but gain more. Model descriptions give each object many faces, each typical of its culture and almost none the object itself.", "arxiv_id": "2611.29355", "arxiv_url": "https://arxiv.org/abs/2611.29355", "authors": ["Yuechen Jiang", "Enze Zhang", "Yuyan Wang", "Mohsinul Kabir", "Chenying Lin", "Sijia Li", "Qianqian Xie", "Stavroula Golfomitsou", "Konstantinos Arvanitis", "Sophia Ananiadou"], "brief": "\u63d0\u51faPolytropos\u57fa\u51c6\uff0c\u5c06\u6587\u5316\u7269\u4ef6\u7684\u6587\u5b57\u63cf\u8ff0\u91cd\u65b0\u751f\u6210\u56fe\u50cf\uff0c\u518d\u4e0e\u539f\u59cb\u7167\u7247\u6bd4\u8f83\u3002\u901a\u8fc7\u6587\u5316\u5f52\u5c5e\u4e0e\u5177\u4f53\u7269\u4ef6\u8bc6\u522b\uff0c\u8861\u91cf\u6a21\u578b\u63cf\u8ff0\u4fdd\u7559\u4e86\u4ec0\u4e48\u3001\u4e22\u5931\u4e86\u4ec0\u4e48\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29355", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6\u4e24\u5bb6\u535a\u7269\u9986374\u4ef6\u7269\u4ef6\u3001\u4e94\u6a21\u578b1870\u6761\u63cf\u8ff0\u53ca230\u6761\u7b56\u5c55\u4eba\u63cf\u8ff0", "\u91cd\u5efa\u56fe\u6587\u5316\u8bc6\u522b\u738754.55%\u201459.09%\uff0c\u539f\u7167\u4e3a52.14%", "16%\u201421%\u7269\u4ef6\u8bc6\u522b\u7ed3\u679c\u6539\u53d8\uff0c\u4ec50.49%\u91cd\u5efa\u56fe\u8ba4\u51fa\u5177\u4f53\u7269\u4ef6"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6587\u5316\u9057\u4ea7", "\u56fe\u50cf\u751f\u6210", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.29355v1", "published_at": "2026-11-22", "score": 0.256, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29355.png", "title": "Polytropos: What Do Vision-Language Model Descriptions Make of a Cultural Object?", "tldr": "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63cf\u8ff0\u66f4\u6613\u51f8\u663e\u6587\u5316\u5178\u578b\uff0c\u5374\u51e0\u4e4e\u65e0\u6cd5\u4fdd\u7559\u6587\u7269\u7684\u72ec\u7279\u8eab\u4efd\u3002", "upvotes": 16, "what_it_is": "\u63d0\u51faPolytropos\u57fa\u51c6\uff0c\u5c06\u6587\u5316\u7269\u4ef6\u7684\u6587\u5b57\u63cf\u8ff0\u91cd\u65b0\u751f\u6210\u56fe\u50cf\uff0c\u518d\u4e0e\u539f\u59cb\u7167\u7247\u6bd4\u8f83\u3002\u901a\u8fc7\u6587\u5316\u5f52\u5c5e\u4e0e\u5177\u4f53\u7269\u4ef6\u8bc6\u522b\uff0c\u8861\u91cf\u6a21\u578b\u63cf\u8ff0\u4fdd\u7559\u4e86\u4ec0\u4e48\u3001\u4e22\u5931\u4e86\u4ec0\u4e48\u3002", "why_notable": "\u628a\u6587\u5316\u63cf\u8ff0\u7684\u4fdd\u771f\u5ea6\u8f6c\u5316\u4e3a\u53ef\u6bd4\u8f83\u7684\u89c6\u89c9\u91cd\u5efa\u8bc4\u4f30\uff0c\u63ed\u793a\u6587\u5316\u6807\u7b7e\u66f4\u6613\u8bc6\u522b\u5e76\u4e0d\u610f\u5473\u7740\u7269\u4ef6\u672c\u8eab\u5f97\u5230\u5fe0\u5b9e\u5448\u73b0\u3002"}, {"abstract": "Reasoning domains have shaped the post-training recipes of frontier models even though they are trained and deployed in domains beyond math and code. In this paper, we study the consequences of directly adopting reasoning-centric training recipes, e.g., the use of outcome-based rewards for reinforcement learning (RL), injection of \"cognitive\" behaviors such as proposing and backtracking from hypotheses in reasoning chains, etc., for knowledge tasks. We hypothesize that these decisions, while useful for reasoning, inadvertently encourage models to memorize hallucinations they themselves generate in their long reasoning chains when trained on knowledge tasks. To study this, we train models with standard post-training, extract their self-generated hallucinations during RL, and track memorization throughout the rest of training. Our experiments on six open models across two model families and two architectures confirm our hypothesis. We find that models\u0027 recall of hallucinations reinforced during training increases by 4.83% on average, compared to just 0.17% for self-hallucinations that receive no training signal. In fact, models even memorize false facts that they immediately retract in their reasoning; a backtracking template inherited from reasoning-centric training that has no benefit for knowledge recall. Furthermore, we find that memorization is strongest on the hardest training questions, and rewarding a hallucination makes the model less likely to abstain from it later (by 7.23% on average). Overall, our work identifies and systematically studies a previously unexamined pathway through which models learn hallucinations during training.", "arxiv_id": "2611.26863", "arxiv_url": "https://arxiv.org/abs/2611.26863", "authors": ["Anirudh Atmakuru", "Tanya Goyal"], "brief": "\u7814\u7a76\u5c06\u63a8\u7406\u5bfc\u5411\u7684\u540e\u8bad\u7ec3\u914d\u65b9\u7528\u4e8e\u77e5\u8bc6\u4efb\u52a1\uff0c\u63d0\u53d6\u5f3a\u5316\u5b66\u4e60\u4e2d\u6a21\u578b\u81ea\u751f\u7684\u5e7b\u89c9\uff0c\u5e76\u6301\u7eed\u8ffd\u8e2a\u5176\u8bb0\u5fc6\u53d8\u5316\uff0c\u68c0\u9a8c\u7ed3\u679c\u5956\u52b1\u4e0e\u63a8\u7406\u56de\u6eaf\u5982\u4f55\u5f3a\u5316\u9519\u8bef\u4e8b\u5b9e\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.26863", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d66\u4e2a\u5f00\u653e\u6a21\u578b\u30012\u4e2a\u6a21\u578b\u5bb6\u65cf\u53ca2\u79cd\u67b6\u6784", "\u83b7\u8bad\u7ec3\u4fe1\u53f7\u7684\u5e7b\u89c9\u53ec\u56de\u7387\u5e73\u5747\u589e\u52a04.83%\uff0c\u672a\u83b7\u4fe1\u53f7\u4ec50.17%", "\u88ab\u5956\u52b1\u7684\u5e7b\u89c9\u540e\u7eed\u62d2\u7b54\u6982\u7387\u5e73\u5747\u964d\u4f4e7.23%"], "keywords": ["\u540e\u8bad\u7ec3", "\u5f3a\u5316\u5b66\u4e60", "\u5e7b\u89c9", "\u77e5\u8bc6\u4efb\u52a1"], "num_comments": 3, "on_hf": true, "organization": "Cornell University", "pdf_url": "https://arxiv.org/pdf/2611.26863v1", "published_at": "2026-11-19", "score": 0.256, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.26863.png", "title": "LLMs Memorize Their Own Hallucinations During Post-Training", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u63a8\u7406\u5bfc\u5411\u7684\u540e\u8bad\u7ec3\u4f1a\u8ba9\u6a21\u578b\u8bb0\u4f4f\u81ea\u8eab\u5e7b\u89c9\uff0c\u5e76\u964d\u4f4e\u540e\u7eed\u62d2\u7b54\u610f\u613f\u3002", "upvotes": 5, "what_it_is": "\u7814\u7a76\u5c06\u63a8\u7406\u5bfc\u5411\u7684\u540e\u8bad\u7ec3\u914d\u65b9\u7528\u4e8e\u77e5\u8bc6\u4efb\u52a1\uff0c\u63d0\u53d6\u5f3a\u5316\u5b66\u4e60\u4e2d\u6a21\u578b\u81ea\u751f\u7684\u5e7b\u89c9\uff0c\u5e76\u6301\u7eed\u8ffd\u8e2a\u5176\u8bb0\u5fc6\u53d8\u5316\uff0c\u68c0\u9a8c\u7ed3\u679c\u5956\u52b1\u4e0e\u63a8\u7406\u56de\u6eaf\u5982\u4f55\u5f3a\u5316\u9519\u8bef\u4e8b\u5b9e\u3002", "why_notable": "\u63ed\u793a\u540e\u8bad\u7ec3\u4e0d\u4ec5\u53ef\u80fd\u672a\u80fd\u7ea0\u9519\uff0c\u8fd8\u4f1a\u56fa\u5316\u6a21\u578b\u81ea\u751f\u7684\u9519\u8bef\uff0c\u751a\u81f3\u8bb0\u4f4f\u5df2\u64a4\u56de\u7684\u5047\u4e8b\u5b9e\uff0c\u4e3a\u77e5\u8bc6\u4efb\u52a1\u7684\u5956\u52b1\u8bbe\u8ba1\u63d0\u4f9b\u91cd\u8981\u8b66\u793a\u3002"}, {"abstract": "Language model agents are increasingly asked to run ongoing multi-day operations rather than finish isolated single-turn tasks. In daily operations, today\u0027s choices reshape later observations and cash constraints because empty shelves hide lost walk-in demand, short-shipped customers quietly shrink future orders weeks later, and emergency buying drains working capital. We introduce SMB Bench, a calibrated 90-day wholesale simulator with 18 causally paired tasks and an 859-run frontier trace dataset, to ask what experience and learning signal make an agent better at noticing, attributing, and acting on the delayed consequences of its own decisions in unseen businesses. Across 16 frontier models, only 3 outperform a fixed buying rule; models often record a relevant diagnosis in their notes without changing later purchases in time, showing that diagnosing a problem, changing behavior, and improving a business are separate achievements. To study how experience improves those failures in an open model (Qwen3.8-27B), we used training-business records to identify operational rules and archived frontier quarters as starting states to continue from rather than transcripts to copy. On an unseen test business under identical evaluation instructions, the trained policy followed customer-protection commitments more consistently and reduced severe-loss quarters, while the additional profit benefit remained uncertain. Carrying those commitments through the quarter exposed the cost of fulfilling them, as early-quarter stocking habits left the buyer relying on emergency supply and a deteriorating supplier. The results separate recognizing a delayed effect, acting on it consistently, and coordinating surrounding decisions so that the response improves profit. SMB Bench connects these observations to a learning method by turning archived decisions and their consequences into reusable training experience.", "arxiv_id": "2611.28158", "arxiv_url": "https://arxiv.org/abs/2611.28158", "authors": ["Shardul Bansal", "Seth Schilbe", "Jarrod Barnes"], "brief": "\u63d0\u51fa\u6a21\u62df90\u5929\u6279\u53d1\u7ecf\u8425\u7684SMB Bench\uff0c\u8bc4\u6d4b\u667a\u80fd\u4f53\u5e94\u5bf9\u5ef6\u8fdf\u540e\u679c\u7684\u80fd\u529b\u3002\u8bad\u7ec3\u65f6\u4ece\u7ecf\u8425\u8bb0\u5f55\u63d0\u70bc\u89c4\u5219\uff0c\u5e76\u5c06\u5386\u53f2\u7ecf\u8425\u72b6\u6001\u4f5c\u4e3a\u7eed\u8dd1\u8d77\u70b9\uff0c\u800c\u975e\u6a21\u4eff\u8f68\u8ff9\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/ORO-AI/smb-bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.28158", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["SMB Bench\u542b18\u4e2a\u56e0\u679c\u914d\u5bf9\u4efb\u52a1\u53ca859\u6b21\u8fd0\u884c\u8f68\u8ff9", "16\u4e2a\u524d\u6cbf\u6a21\u578b\u4e2d\uff0c\u4ec53\u4e2a\u80dc\u8fc7\u56fa\u5b9a\u91c7\u8d2d\u89c4\u5219", "Qwen3.8-27B\u8bad\u7ec3\u540e\u4e25\u91cd\u4e8f\u635f\u5b63\u5ea6\u51cf\u5c11\uff0c\u5229\u6da6\u589e\u76ca\u4e0d\u786e\u5b9a"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u51b3\u7b56", "\u5ef6\u8fdf\u53cd\u9988", "\u4eff\u771f\u8bc4\u6d4b"], "num_comments": 3, "on_hf": true, "organization": "ORO AI", "pdf_url": "https://arxiv.org/pdf/2611.28158v1", "published_at": "2026-11-19", "score": 0.255, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28158.png", "title": "Measuring and Teaching Language Model Agents to Act on Delayed Consequences", "tldr": "\u7528\u957f\u671f\u6279\u53d1\u7ecf\u8425\u6a21\u62df\u8bc4\u6d4b\u5e76\u8bad\u7ec3\u667a\u80fd\u4f53\uff0c\u63ed\u793a\u8bc6\u522b\u5ef6\u8fdf\u540e\u679c\u4e0d\u7b49\u4e8e\u6539\u5584\u7ecf\u8425", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u6a21\u62df90\u5929\u6279\u53d1\u7ecf\u8425\u7684SMB Bench\uff0c\u8bc4\u6d4b\u667a\u80fd\u4f53\u5e94\u5bf9\u5ef6\u8fdf\u540e\u679c\u7684\u80fd\u529b\u3002\u8bad\u7ec3\u65f6\u4ece\u7ecf\u8425\u8bb0\u5f55\u63d0\u70bc\u89c4\u5219\uff0c\u5e76\u5c06\u5386\u53f2\u7ecf\u8425\u72b6\u6001\u4f5c\u4e3a\u7eed\u8dd1\u8d77\u70b9\uff0c\u800c\u975e\u6a21\u4eff\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u95ee\u9898\u8bca\u65ad\u3001\u884c\u4e3a\u6539\u53d8\u4e0e\u5229\u6da6\u6539\u5584\u62c6\u5f00\u8861\u91cf\uff0c\u4e3a\u957f\u671f\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u8d34\u8fd1\u7ecf\u8425\u7ea6\u675f\u7684\u8bc4\u6d4b\uff0c\u5e76\u5c55\u793a\u5386\u53f2\u51b3\u7b56\u540e\u679c\u53ef\u7528\u4e8e\u8bad\u7ec3\u3002"}, {"abstract": "Efficient AI computation depends on hardware that evolves over time, shifting the strategies needed to implement performant code. For CPU kernels, a key evolving factor is the set of available architectural extensions, which expose specialized hardware instructions that change the techniques used to optimize kernels. We study how effectively coding agents use these new, potentially unfamiliar extensions to write fast code. We introduce KernelShift, a benchmarking pipeline and a set of environments for evaluating coding agents in kernel optimization across evolving CPU architectures. Its agent-assisted, human-verified pipeline turns code repositories into benchmark instances, and its environments let agents optimize code with feedback from the target hardware. Using this pipeline, we construct 99 kernels from real-world, actively developed repositories (ncnn, llama.cpp, Arm SIMD Loops, and KleidiAI), including inference workloads derived from real model executions. KernelShift supports incorporating new kernels and hardware configurations as libraries and processors evolve. We evaluate agents with proprietary and open-weight models across progressively newer architectural extensions (Arm Neon, SVE, SVE2, and SME2), examining how performance changes as hardware evolves. On established extensions, agents beat the auto-vectorized compiler everywhere (2.4-19.8x) and exceed general-purpose libraries such as ncnn (getting up to 2.74x over its Neon kernels), but fall behind Arm\u0027s hand-tuned KleidiAI kernels (0.70x). In end-to-end inference of two LLMs, agent-written kernels achieve a 1.3-1.6x prefill speedup over llama.cpp\u0027s fast path. However, current agents do not yet reliably adapt to new extensions that require unfamiliar programming models, such as SME2\u0027s matrix tiles.", "arxiv_id": "2611.29590", "arxiv_url": "https://arxiv.org/abs/2611.29590", "authors": ["Shuaiwei Huang", "Weihua Du", "Allen Wu", "Ivan Fox", "Manupa Karunaratne", "Yiming Yang", "Sean Welleck"], "brief": "KernelShift\u6784\u5efa\u8de8CPU\u67b6\u6784\u7684\u5185\u6838\u4f18\u5316\u8bc4\u6d4b\uff0c\u901a\u8fc7\u667a\u80fd\u4f53\u8f85\u52a9\u3001\u4eba\u5de5\u9a8c\u8bc1\u5c06\u771f\u5b9e\u4ed3\u5e93\u8f6c\u4e3a\u4efb\u52a1\uff0c\u5e76\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5229\u7528\u76ee\u6807\u786c\u4ef6\u53cd\u9988\u4f18\u5316\u4ee3\u7801\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.SE"], "github_repo": "https://github.com/cmu-l3/kernel-shift", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.29590", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6536\u96c699\u4e2a\u771f\u5b9e\u5185\u6838\uff0c\u8986\u76d6Neon\u81f3SME2\u6269\u5c55", "\u6210\u719f\u6269\u5c55\u4e0a\u8f83\u81ea\u52a8\u5411\u91cf\u5316\u7f16\u8bd1\u5668\u5feb2.4\u201419.8\u500d", "\u4e24\u4e2aLLM\u7684\u9884\u586b\u5145\u52a0\u901f1.3\u20141.6\u500d"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u5185\u6838\u4f18\u5316", "\u786c\u4ef6\u67b6\u6784", "\u6027\u80fd\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "L3 Lab", "pdf_url": "https://arxiv.org/pdf/2611.29590v1", "published_at": "2026-11-22", "score": 0.255, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29590.png", "title": "KernelShift: Benchmarking Kernel Optimization Across Evolving Hardware", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u80fd\u663e\u8457\u52a0\u901f\u6210\u719f\u67b6\u6784\u4e0a\u7684\u8ba1\u7b97\u5185\u6838\uff0c\u5374\u96be\u53ef\u9760\u9002\u5e94\u65b0\u786c\u4ef6\u6269\u5c55\u3002", "upvotes": 3, "what_it_is": "KernelShift\u6784\u5efa\u8de8CPU\u67b6\u6784\u7684\u5185\u6838\u4f18\u5316\u8bc4\u6d4b\uff0c\u901a\u8fc7\u667a\u80fd\u4f53\u8f85\u52a9\u3001\u4eba\u5de5\u9a8c\u8bc1\u5c06\u771f\u5b9e\u4ed3\u5e93\u8f6c\u4e3a\u4efb\u52a1\uff0c\u5e76\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5229\u7528\u76ee\u6807\u786c\u4ef6\u53cd\u9988\u4f18\u5316\u4ee3\u7801\u3002", "why_notable": "\u5c06\u4ee3\u7801\u4f18\u5316\u80fd\u529b\u653e\u5230\u6301\u7eed\u6f14\u8fdb\u7684\u786c\u4ef6\u4e0a\u68c0\u9a8c\uff0c\u63ed\u793a\u6210\u719f\u67b6\u6784\u4e0a\u7684\u63d0\u901f\u5e76\u4e0d\u610f\u5473\u7740\u80fd\u638c\u63e1SME2\u77e9\u9635\u5206\u5757\u7b49\u65b0\u7f16\u7a0b\u6a21\u578b\u3002"}, {"abstract": "Text-to-image models can learn from their own mistakes by distilling a self-teacher conditioned on a vision-language critic\u0027s revised prompt. However, such self-teachers barely improve alignment, and both they and their hindsight-contrast variants absorb the critic\u0027s unintended additions to the scene, such as lighting or scenery. We attribute this to two factors: (1) the prompt already specifies the desired fix, so a useful revision must go beyond the failed span, often rewriting the entire scene and adding details that overshadow the fix; (2) although the critic localizes the error to a single span, self-teachers condition on the rewrite, entangling the intended fix with unintended additions. Motivated by these insights, we propose Hindsight Twins (HinT), which fills the critic\u0027s revision template once with the intended fix and once with the observed error and distills only their velocity difference, anchored at the user\u0027s prompt. Because text encoders spread the edit of a single slot to all other tokens, HinT further aligns the twins\u0027 token states outside the slot. Across Qwen-Image-2512, SD3.5-M, and FLUX.2-klein, HinT keeps the rate of critic-induced bias at the base-model level while matching or exceeding the alignment gains of prior self-distillation, and it keeps improving over twelve rounds of self-training where contrastive baselines decay.", "arxiv_id": "2611.31048", "arxiv_url": "https://arxiv.org/abs/2611.31048", "authors": ["Jiaze Li", "Jingyang Chen", "Wenhao Zhao", "Haoran Xu", "Zhenlong Yuan", "Dianmo Sheng", "Yuanxing Zhang"], "brief": "\u63d0\u51fa HinT\uff0c\u5c06\u89c6\u89c9\u8bed\u8a00\u8bc4\u5224\u5668\u7684\u4fee\u8ba2\u6a21\u677f\u5206\u522b\u586b\u5165\u6b63\u786e\u5185\u5bb9\u4e0e\u5df2\u89c2\u5bdf\u5230\u7684\u9519\u8bef\uff0c\u4ee5\u539f\u59cb\u63d0\u793a\u4e3a\u951a\uff0c\u4ec5\u84b8\u998f\u4e24\u8005\u7684\u901f\u5ea6\u5dee\uff0c\u5e76\u5bf9\u9f50\u7f16\u8f91\u69fd\u5916\u7684\u8bcd\u5143\u72b6\u6001\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31048", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["HinT \u6784\u9020\u7ea0\u6b63\u4e0e\u9519\u8bef\u53cc\u63d0\u793a\uff0c\u4ec5\u84b8\u998f\u901f\u5ea6\u5dee", "\u5bf9\u9f50\u7f16\u8f91\u69fd\u5916\u8bcd\u5143\u72b6\u6001\uff0c\u6291\u5236\u4fee\u6539\u4fe1\u606f\u6269\u6563", "\u5728\u4e09\u79cd\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff0c\u8fde\u7eed12\u8f6e\u81ea\u8bad\u7ec3\u4ecd\u63d0\u5347"], "keywords": ["\u6587\u751f\u56fe", "\u81ea\u84b8\u998f", "\u81ea\u8bad\u7ec3", "\u63d0\u793a\u4fee\u8ba2"], "num_comments": 2, "on_hf": true, "organization": "KlingAI Research", "pdf_url": "https://arxiv.org/pdf/2611.31048v1", "published_at": "2026-11-23", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31048.png", "title": "Distill the Correction, Not the Rewrite: Hindsight Twins for Self-Improving Text-to-Image Models", "tldr": "\u901a\u8fc7\u6210\u5bf9\u63d0\u793a\u4ec5\u84b8\u998f\u7ea0\u9519\u5dee\u5f02\uff0c\u8ba9\u6587\u751f\u56fe\u6a21\u578b\u6301\u7eed\u81ea\u6539\u8fdb\u800c\u4e0d\u5f15\u5165\u989d\u5916\u573a\u666f\u504f\u5dee\u3002", "upvotes": 5, "what_it_is": "\u63d0\u51fa HinT\uff0c\u5c06\u89c6\u89c9\u8bed\u8a00\u8bc4\u5224\u5668\u7684\u4fee\u8ba2\u6a21\u677f\u5206\u522b\u586b\u5165\u6b63\u786e\u5185\u5bb9\u4e0e\u5df2\u89c2\u5bdf\u5230\u7684\u9519\u8bef\uff0c\u4ee5\u539f\u59cb\u63d0\u793a\u4e3a\u951a\uff0c\u4ec5\u84b8\u998f\u4e24\u8005\u7684\u901f\u5ea6\u5dee\uff0c\u5e76\u5bf9\u9f50\u7f16\u8f91\u69fd\u5916\u7684\u8bcd\u5143\u72b6\u6001\u3002", "why_notable": "\u5c06\u6709\u6548\u7ea0\u9519\u4e0e\u8bc4\u5224\u5668\u64c5\u81ea\u6dfb\u52a0\u7684\u7ec6\u8282\u5206\u79bb\uff0c\u4fdd\u6301\u57fa\u7840\u6a21\u578b\u7ea7\u522b\u7684\u8bf1\u5bfc\u504f\u5dee\uff0c\u540c\u65f6\u8fbe\u5230\u6216\u8d85\u8fc7\u65e2\u6709\u81ea\u84b8\u998f\u7684\u5bf9\u9f50\u6536\u76ca\u3002"}, {"abstract": "Effective real-time, full-duplex multimodal interaction requires systems to understand not only what users say, but also the communicative needs conveyed through prosody, facial expressions, gestures, and context, and to generate audiovisual responses that appropriately address those needs. Existing evaluations offer limited insight into whether systems translate an understanding of such unspoken needs into effective responses. We introduce UUBench, a benchmark for assessing how well multimodal interactive systems Understand the Unspoken intent and address users\u0027 implicit communicative needs. The inherent subjectivity of implicit intent inference poses a key challenge for evaluation. To address this, we introduce Process-Oriented Scoring, which grounds the assessment of intent fulfillment in observable auditory and visual cues, such as prosody and gestures. Rather than relying solely on a single overall score, it evaluates how well a response addresses the communicative needs conveyed by each applicable primitive dimension. We aggregate the dimension-level scores according to each dimension\u0027s relevance to the annotated evidence. Beyond intent fulfillment, Outcome-Oriented Scoring evaluates the naturalness, appropriateness, and human-likeness of the reply itself under audio-only, visual-only, and audiovisual conditions. To make these judgments traceable to observable evidence, we propose a Fact-Grounded Scoring JEV module, which uses structured, timestamped audiovisual observations of the user and the digital human\u0027s reply to assess one dimension or criterion at a time. UUBench provides a foundation for assessing whether multimodal interactive systems respond effectively to meaning beyond literal wording, supporting progress toward context-aware, real-time, full-duplex interaction.", "arxiv_id": "2611.30157", "arxiv_url": "https://arxiv.org/abs/2611.30157", "authors": ["Ye Pan", "Chenfei Liao", "Bin Ren", "Hanqian Li", "Haocong He", "Jialei Chen", "Jinlin He", "Kunyu Peng", "Mengyu Jin", "Shijie Li", "Wenqian Cui", "Yuanqi Yao", "Yuqian Fu", "Kailong Ruan", "Yuan Gao", "Wei Wang", "Xuming Hu", "Irwin King", "Nicu Sebe", "Xu Zheng"], "brief": "\u63d0\u51fa\u9762\u5411\u5168\u53cc\u5de5\u591a\u6a21\u6001\u4ea4\u4e92\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4ee5\u8bed\u8c03\u3001\u8868\u60c5\u548c\u624b\u52bf\u7b49\u8bc1\u636e\u5206\u7ef4\u5ea6\u8bc4\u4f30\u9690\u542b\u610f\u56fe\u6ee1\u8db3\u7a0b\u5ea6\uff0c\u5e76\u7ed3\u5408\u56de\u590d\u8d28\u91cf\u8bc4\u4ef7\u4e0e\u5e26\u65f6\u95f4\u6233\u7684\u4e8b\u5b9e\u652f\u6491\u8bc4\u5206\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30157", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8fc7\u7a0b\u5bfc\u5411\u8bc4\u5206\uff1a\u6309\u8bc1\u636e\u76f8\u5173\u6027\u805a\u5408\u5404\u7ef4\u5ea6\u7684\u610f\u56fe\u6ee1\u8db3\u5f97\u5206", "\u7ed3\u679c\u5bfc\u5411\u8bc4\u5206\uff1a\u5728\u7eaf\u97f3\u9891\u3001\u7eaf\u89c6\u89c9\u53ca\u89c6\u542c\u6761\u4ef6\u4e0b\u8bc4\u4ef7\u56de\u590d\u8d28\u91cf", "\u4e8b\u5b9e\u652f\u6491\u8bc4\u5206JEV\uff1a\u7528\u5e26\u65f6\u95f4\u6233\u7684\u89c6\u542c\u89c2\u5bdf\u9010\u9879\u8bc4\u5224"], "keywords": ["\u591a\u6a21\u6001\u4ea4\u4e92", "\u9690\u542b\u610f\u56fe", "\u8bc4\u6d4b\u57fa\u51c6", "\u5168\u53cc\u5de5"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30157v1", "published_at": "2026-11-23", "score": 0.253, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30157.png", "title": "UUBench: Understanding the Unspoken toward Full-Duplex Multimodal Interaction", "tldr": "\u7528\u53ef\u8ffd\u6eaf\u7684\u89c6\u542c\u7ebf\u7d22\u8bc4\u4f30\u591a\u6a21\u6001\u7cfb\u7edf\u80fd\u5426\u7406\u89e3\u5e76\u56de\u5e94\u7528\u6237\u672a\u660e\u8bf4\u7684\u9700\u6c42\u3002", "upvotes": 14, "what_it_is": "\u63d0\u51fa\u9762\u5411\u5168\u53cc\u5de5\u591a\u6a21\u6001\u4ea4\u4e92\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4ee5\u8bed\u8c03\u3001\u8868\u60c5\u548c\u624b\u52bf\u7b49\u8bc1\u636e\u5206\u7ef4\u5ea6\u8bc4\u4f30\u9690\u542b\u610f\u56fe\u6ee1\u8db3\u7a0b\u5ea6\uff0c\u5e76\u7ed3\u5408\u56de\u590d\u8d28\u91cf\u8bc4\u4ef7\u4e0e\u5e26\u65f6\u95f4\u6233\u7684\u4e8b\u5b9e\u652f\u6491\u8bc4\u5206\u3002", "why_notable": "\u5c06\u4e3b\u89c2\u7684\u9690\u542b\u610f\u56fe\u5224\u65ad\u951a\u5b9a\u5230\u53ef\u89c2\u5bdf\u8bc1\u636e\uff0c\u4f7f\u8bc4\u6d4b\u4e0d\u6b62\u5173\u6ce8\u56de\u590d\u662f\u5426\u81ea\u7136\uff0c\u4e5f\u68c0\u9a8c\u7cfb\u7edf\u662f\u5426\u771f\u6b63\u56de\u5e94\u7528\u6237\u7684\u6c9f\u901a\u9700\u6c42\u3002"}, {"abstract": "Optical Character Recognition (OCR) pipelines and vision-language models exhibit high accuracy on standard OCR and document-understanding benchmarks, yet they systematically underperform on document patterns that are operationally critical in financial workflows. These patterns include vertical or rotated text, logo-embedded vendor names, fine-print regulatory clauses, degraded scans, and complex multi-column layouts. While underrepresented in public datasets, they constitute a substantial portion of real-world failure cases. We introduce SAVIOR, a sample-efficient data curation methodology that targets such high-impact failure scenarios to adapt vision-language models for robust financial OCR. We further propose PaIRS, a structure-aware evaluation metric that measures layout fidelity by comparing pairwise spatial relationships between tokens. Fine-tuning Qwen2.5-VL-Instruct with SAVIOR-Train achieves a word recall of 0.93. When the resulting layout-aware OCR output is used as context for document question answering, it attains an F1 score of 0.89, outperforming both open- and closed-source models such as GPT-4o, Mistral-OCR, PaddleOCR-VL, and DeepSeek-OCR.", "arxiv_id": "2611.27319", "arxiv_url": "https://arxiv.org/abs/2611.27319", "authors": ["Akshata A Bhat", "Sharath Naganna", "Saiful Haq", "Prashant Khatri", "Krishna Chaitanya Reddy Tamataam", "Neha Arun", "Niyati Chhaya", "Pushpak Bhattacharyya"], "brief": "SAVIOR\u9488\u5bf9\u65cb\u8f6c\u6587\u5b57\u3001\u9000\u5316\u626b\u63cf\u7b49\u91d1\u878d\u6587\u6863\u96be\u4f8b\u7b56\u5c55\u6570\u636e\uff0c\u7528\u4e8e\u5fae\u8c03\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff1b\u53e6\u63d0\u51faPaIRS\uff0c\u901a\u8fc7\u8bcd\u5143\u95f4\u7a7a\u95f4\u5173\u7cfb\u8bc4\u4f30\u5e03\u5c40\u4fdd\u771f\u5ea6\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.27319", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SAVIOR\u4ee5\u6837\u672c\u9ad8\u6548\u7b56\u5c55\u8986\u76d6\u91d1\u878dOCR\u9ad8\u5f71\u54cd\u5931\u8d25\u573a\u666f", "PaIRS\u6bd4\u8f83\u8bcd\u5143\u6210\u5bf9\u7a7a\u95f4\u5173\u7cfb\uff0c\u8861\u91cf\u5e03\u5c40\u4fdd\u771f\u5ea6", "\u5fae\u8c03Qwen2.5-VL\u540e\u8bcd\u53ec\u56de\u73870.93\uff0c\u95ee\u7b54F1\u4e3a0.89"], "keywords": ["\u5149\u5b66\u5b57\u7b26\u8bc6\u522b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6570\u636e\u7b56\u5c55", "\u6587\u6863\u7406\u89e3"], "num_comments": 3, "on_hf": true, "organization": "Hyperbots Inc", "pdf_url": "https://arxiv.org/pdf/2611.27319v1", "published_at": "2026-11-20", "score": 0.235, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27319.png", "title": "SAVIOR: Sample-efficient Adaptation of Vision-Language Models for OCR Representation", "tldr": "\u901a\u8fc7\u9488\u5bf9\u6027\u6570\u636e\u7b56\u5c55\u4e0e\u5e03\u5c40\u8bc4\u4f30\uff0c\u63d0\u5347\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u91d1\u878d\u6587\u6863\u96be\u4f8b\u4e0a\u7684\u8bc6\u522b\u80fd\u529b\u3002", "upvotes": 6, "what_it_is": "SAVIOR\u9488\u5bf9\u65cb\u8f6c\u6587\u5b57\u3001\u9000\u5316\u626b\u63cf\u7b49\u91d1\u878d\u6587\u6863\u96be\u4f8b\u7b56\u5c55\u6570\u636e\uff0c\u7528\u4e8e\u5fae\u8c03\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff1b\u53e6\u63d0\u51faPaIRS\uff0c\u901a\u8fc7\u8bcd\u5143\u95f4\u7a7a\u95f4\u5173\u7cfb\u8bc4\u4f30\u5e03\u5c40\u4fdd\u771f\u5ea6\u3002", "why_notable": "\u628a\u4f18\u5316\u91cd\u70b9\u4ece\u6807\u51c6\u699c\u5355\u8f6c\u5411\u91d1\u878d\u4e1a\u52a1\u96be\u4f8b\uff0c\u5e76\u5c06\u5e03\u5c40\u8d28\u91cf\u5173\u8054\u5230\u4e0b\u6e38\u95ee\u7b54\u6548\u679c\uff1b\u62a5\u544a\u7684\u95ee\u7b54\u8868\u73b0\u4f18\u4e8e\u591a\u79cd\u5f00\u6e90\u4e0e\u95ed\u6e90\u6a21\u578b\u3002"}, {"abstract": "A streaming video system must decide in a single pass what evidence to retain under bounded frame storage, before it knows which details a future question will require. Recent recursive self-improvement methods automate the design of the harness that stores and retrieves this evidence. They revise the harness in response to failures, but the editor must still devise each repair from its prior knowledge and a predefined set of tools. A failure that recurs across videos, however, may point to a problem that prior work has already addressed. We introduce MORSE (Memory Optimization with Recursive Self-Evolvement), an open-world auto-research framework that uses recurring failures to guide an online search for solutions. Its editor groups failures in training traces by cause, then searches papers, model cards, and code for methods it can adapt or pretrained perception models it can use. When the editor introduces a new perceptual capability, it can also revise how the harness stores and retrieves the resulting evidence for a frozen video-language model. On held-out validation streams, MORSE first selects revisions that improve answer quality, then seeks faster revisions that preserve those gains within a specified tolerance. Across three streaming video benchmarks, MORSE consistently achieves the highest answer accuracy within each frozen-backbone comparison. On OVO-Bench, our Qwen3-VL-8B harness answers queries in 0.30 seconds on average while achieving 75.1% accuracy, 3.1 percentage points ahead of the next-best evaluated harness using the same frozen backbone.", "arxiv_id": "2611.30011", "arxiv_url": "https://arxiv.org/abs/2611.30011", "authors": ["Ce Zhang", "Jianshu Zhang", "Jinxi He", "Xiyuan Yang", "Pan Wang", "Han Liu", "Katia Sycara", "Yaqi Xie"], "brief": "MORSE\u6839\u636e\u53cd\u590d\u51fa\u73b0\u7684\u5931\u8d25\u5728\u7ebf\u68c0\u7d22\u7814\u7a76\u4e0e\u4ee3\u7801\uff0c\u81ea\u52a8\u4f18\u5316\u6d41\u5f0f\u89c6\u9891\u8bb0\u5fc6\uff1b\u4e09\u4e2a\u57fa\u51c6\u540c\u9aa8\u5e72\u6bd4\u8f83\u5747\u6700\u4f18\uff0cOVO\u51c6\u786e\u7387\u8fbe75.1%\uff0c\u5e73\u5747\u67e5\u8be2\u8017\u65f60.30\u79d2\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30011", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6d41\u5f0f\u89c6\u9891\u7406\u89e3", "\u8bb0\u5fc6\u4f18\u5316", "\u81ea\u52a8\u7814\u7a76", "\u9012\u5f52\u81ea\u6539\u8fdb"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30011v1", "published_at": "2026-11-23", "score": 0.054, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30011.png", "title": "MORSE: Optimizing Streaming Memory Design via Open-World Auto-Research", "tldr": "MORSE\u6839\u636e\u53cd\u590d\u51fa\u73b0\u7684\u5931\u8d25\u5728\u7ebf\u68c0\u7d22\u7814\u7a76\u4e0e\u4ee3\u7801\uff0c\u81ea\u52a8\u4f18\u5316\u6d41\u5f0f\u89c6\u9891\u8bb0\u5fc6\uff1b\u4e09\u4e2a\u57fa\u51c6\u540c\u9aa8\u5e72\u6bd4\u8f83\u5747\u6700\u4f18\uff0cOVO\u51c6\u786e\u7387\u8fbe75.1%\uff0c\u5e73\u5747\u67e5\u8be2\u8017\u65f60.30\u79d2\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) have become strong policies for vision-and-language navigation (VLN). However, most of them encode a sample of past frames again at every decision and are trained on isolated decisions, so computation is redundant and the usable history is short. They also learn from their own mistakes through outcome rewards that give one scalar to a whole episode. We ask whether a navigator can encode each frame only once, at a constant cost per step, and still remember what matters and learn efficiently from its mistakes. We present GlanceNav, a streaming navigator built on a hybrid MLLM. Its Gated DeltaNet layers carry a recurrent state through the whole episode, while its attention layers keep a short window of recent observations and a small bank of keyframes, selected by how much each frame changes the recurrent state. This constant-size memory keeps the cost per step fixed and allows training on whole episodes with the same memory as at inference. Because the entire memory can also be copied in constant time, we further propose Counterfactual Rewind (CoRe), a reinforcement learning stage that rewinds a drifting rollout to its closest approach to the goal, lets
