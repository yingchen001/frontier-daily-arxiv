an expert correct a few actions, and credits decisions by the resulting change in outcome. Trained only on the R2R-CE and RxR-CE training splits, with 1,000 instructions for reinforcement learning, a 4B GlanceNav reaches success rates of 71.9% and 73.6% on R2R-CE and RxR-CE val-unseen. On R2R-CE, it outperforms the strongest previous single-RGB method trained without external data by 9.1 points, while running at 104 ms per step.", "arxiv_id": "2611.30900", "arxiv_url": "https://arxiv.org/abs/2611.30900", "authors": ["Anh Dao", "Quan-Dung Pham", "Danh Vinh Le", "Tuyen Pham Le", "Quan Nguyen", "Yuzhang Shang"], "brief": "GlanceNav\u7528\u6d41\u5f0f\u8bb0\u5fc6\u907f\u514d\u91cd\u590d\u7f16\u7801\uff0c\u4ee5\u53cd\u4e8b\u5b9e\u56de\u9000\u5f3a\u5316\u5b66\u4e60\u7ea0\u6b63\u5bfc\u822a\u9519\u8bef\uff1b\u5355\u6b65\u8017\u65f6104\u6beb\u79d2\uff0cR2R-CE\u6210\u529f\u7387\u8f83\u6b64\u524d\u6700\u5f3a\u540c\u6761\u4ef6\u65b9\u6cd5\u63d0\u53479.1\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/GlanceNav/GlanceNav", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.30900", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u6d41\u5f0f\u8bb0\u5fc6", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "VinMotion", "pdf_url": "https://arxiv.org/pdf/2611.30900v1", "published_at": "2026-11-23", "score": 0.049, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30900.png", "title": "GlanceNav: Efficient Vision-and-Language Navigation with Streaming Memory and Counterfactual Rewind", "tldr": "GlanceNav\u7528\u6d41\u5f0f\u8bb0\u5fc6\u907f\u514d\u91cd\u590d\u7f16\u7801\uff0c\u4ee5\u53cd\u4e8b\u5b9e\u56de\u9000\u5f3a\u5316\u5b66\u4e60\u7ea0\u6b63\u5bfc\u822a\u9519\u8bef\uff1b\u5355\u6b65\u8017\u65f6104\u6beb\u79d2\uff0cR2R-CE\u6210\u529f\u7387\u8f83\u6b64\u524d\u6700\u5f3a\u540c\u6761\u4ef6\u65b9\u6cd5\u63d0\u53479.1\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Feeding each position\u0027s top-layer hidden state back into the next position\u0027s input improves Transformer performance. However, this feedback breaks speculative decoding, since verifying a drafted token requires the top-layer state from its preceding position, which forces the draft to rely on an approximate stand-in. Training the model to adapt to this stand-in can lower the exact-decoding performance ceiling, while using it at inference time further introduces approximation error. We propose Feedback Shortcut to address both bottlenecks. First, state alignment trains a lightweight projection from multi-token prediction head states to stand-ins, leaving base model training untouched. Second, pipelined correction re-evaluates each draft using its predecessor\u0027s newly computed state, a much closer proxy to true feedback. Running this correction inside the verification pass of subsequent drafts improves accuracy with zero extra calls. Across 135M and 780M scales, Feedback Shortcut stays within $10^{-4}$ bits per byte of the exact-decoding ceiling on Paloma and accelerates decoding by 2.4-2.8x with about 2% more training compute than the latent feedback Transformer. At large batch sizes, skipping correction still preserves Transformer speed and over 80% of latent feedback\u0027s gains.", "arxiv_id": "2611.28227", "arxiv_url": "https://arxiv.org/abs/2611.28227", "authors": ["Benhao Huang", "Xuezhe Ma", "Hector Liu"], "brief": "\u901a\u8fc7\u72b6\u6001\u5bf9\u9f50\u4e0e\u6d41\u6c34\u7ebf\u6821\u6b63\uff0c\u8ba9\u6f5c\u5728\u53cd\u9988Transformer\u652f\u6301\u63a8\u6d4b\u89e3\u7801\uff0c\u7cbe\u5ea6\u51e0\u4e4e\u4e0d\u53d8\uff0c\u89e3\u7801\u52a0\u901f2.4\u20142.8\u500d\uff0c\u8bad\u7ec3\u5f00\u9500\u4ec5\u589e\u7ea62%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.28227", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 2, "on_hf": true, "organization": "Institute of Foundation Models", "pdf_url": "https://arxiv.org/pdf/2611.28227v1", "published_at": "2026-11-20", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28227.png", "title": "Feedback Shortcut: Speculative Decoding for Latent Feedback Transformers", "tldr": "\u901a\u8fc7\u72b6\u6001\u5bf9\u9f50\u4e0e\u6d41\u6c34\u7ebf\u6821\u6b63\uff0c\u8ba9\u6f5c\u5728\u53cd\u9988Transformer\u652f\u6301\u63a8\u6d4b\u89e3\u7801\uff0c\u7cbe\u5ea6\u51e0\u4e4e\u4e0d\u53d8\uff0c\u89e3\u7801\u52a0\u901f2.4\u20142.8\u500d\uff0c\u8bad\u7ec3\u5f00\u9500\u4ec5\u589e\u7ea62%\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "4D occupancy forecasting predicts the 3D semantic occupancy of a driving scene seconds ahead. Over a few seconds, the scene changes little while the vehicle moves, so most of the space ahead has already been seen. Sorting the future into unchanged, changed, and unseen space, we find that current camera-based world models fall short on the unchanged part: they fail to hold on to what they have already seen, rather than to forecast what will change. We therefore make what the model has seen its state. PersistWorld streams camera frames into a persistent 3D world state anchored in the scene, writing each frame once instead of rebuilding the state from past frames. The state is learned end to end with the forecast, and an evolver predicts it at any queried time along the ego trajectory. On Occ3D-nuScenes, PersistWorld raises the IoU of the best camera-based world model by 19 points at 1-3 s and by 18 to 24 points up to 8 s, while running more than twice as fast. Code and models: https://github.com/wangzian828/PersistWorld. Project page: https://wangzian828.github.io/PersistWorld", "arxiv_id": "2611.30573", "arxiv_url": "https://arxiv.org/abs/2611.30573", "authors": ["ZiAn Wang", "Tianyi Wang", "Zhihao Chen", "Manni Cui", "Junkai Chen", "ZhiJin Chen", "Ruiqi Liu", "Junfei Wu", "Huanyu Zhang", "Shu Wu"], "brief": "\u5c06\u6d41\u5f0f\u76f8\u673a\u5e27\u5199\u5165\u6301\u4e45\u4e09\u7ef4\u4e16\u754c\u72b6\u6001\uff0c\u51cf\u5c11\u9057\u5fd8\u5e76\u9884\u6d4b\u672a\u6765\u5360\u636e\uff1b\u76f8\u6bd4\u6700\u5f3a\u76f8\u673a\u4e16\u754c\u6a21\u578b\uff0c\u672a\u67651\u81f38\u79d2\u7684IoU\u63d0\u9ad818\u81f324\u70b9\uff0c\u901f\u5ea6\u8d85\u4e24\u500d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30573", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5360\u636e\u9884\u6d4b", "\u4e16\u754c\u6a21\u578b", "\u4e09\u7ef4\u611f\u77e5", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30573v1", "published_at": "2026-11-23", "score": 0.046, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30573.png", "title": "Write, Evolve, Read: Streaming Cameras into a Persistent World State for 4D Occupancy Forecasting", "tldr": "\u5c06\u6d41\u5f0f\u76f8\u673a\u5e27\u5199\u5165\u6301\u4e45\u4e09\u7ef4\u4e16\u754c\u72b6\u6001\uff0c\u51cf\u5c11\u9057\u5fd8\u5e76\u9884\u6d4b\u672a\u6765\u5360\u636e\uff1b\u76f8\u6bd4\u6700\u5f3a\u76f8\u673a\u4e16\u754c\u6a21\u578b\uff0c\u672a\u67651\u81f38\u79d2\u7684IoU\u63d0\u9ad818\u81f324\u70b9\uff0c\u901f\u5ea6\u8d85\u4e24\u500d\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) has become an important component in large language models (LLMs). However, existing RL approaches focus on final outputs or textual solution trajectories, leading to coarse-grained rewards and unreliable reasoning. Such paradigms focus mainly on what the model outputs while overlooking how the model internally reasons. Therefore, can we reward how a model thinks internally rather than merely what it says? We first reveal the problem of textual reward aliasing in existing reward modeling approaches. Motivated by this, we propose the Attention Process Reward Model (APRM), which assigns internal rewards based on hidden states and attention maps to capture high-quality reasoning patterns. With only approximately 46M parameters, APRM is trained using ranking and counterfactual objectives, and its reward guides RL optimization while being periodically updated to handle distribution shifts. Integrated with representative RL methods, APRM achieved an average pass@8 gain of 2.88\\%. Our results demonstrate the promise of incorporating internal reasoning signals into RL for LLMs.", "arxiv_id": "2611.30627", "arxiv_url": "https://arxiv.org/abs/2611.30627", "authors": ["Kairong Han", "Nuanqiao Shan", "Ziyu Zhao", "Xinpeng Dong", "Zijing Hu", "Dian Jin", "Leyan Deng", "Junjian Ye", "Lujia Pan", "Fei Wu", "Kun Kuang"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u9690\u85cf\u72b6\u6001\u548c\u6ce8\u610f\u529b\u56fe\u7684\u5185\u90e8\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b\uff0c\u5f15\u5bfc\u5927\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\uff1b\u4ec5\u7ea64600\u4e07\u53c2\u6570\uff0c\u7ed3\u5408\u591a\u79cd\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u540e\uff0c\u5e73\u5747pass@8\u63d0\u53472.88%\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30627", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u5efa\u6a21", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.30627v1", "published_at": "2026-11-23", "score": 0.045, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30627.png", "title": "From Rewarding What Models Say to How They Think: Attention Process Reward Model for LLM Reinforcement Learning", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u9690\u85cf\u72b6\u6001\u548c\u6ce8\u610f\u529b\u56fe\u7684\u5185\u90e8\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b\uff0c\u5f15\u5bfc\u5927\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\uff1b\u4ec5\u7ea64600\u4e07\u53c2\u6570\uff0c\u7ed3\u5408\u591a\u79cd\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\u540e\uff0c\u5e73\u5747pass@8\u63d0\u53472.88%\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Subliminal learning refers to a surprising phenomenon in language models wherein a prompt given to one model (e.g., preference for cats) can be subliminally distilled to another model via training on data that is ostensibly meaningless (e.g., number sequences). This paper shows that text-based subliminal learning transfers cross-modally, in particular, a topic/preference (e.g., animals) transferred through number sequences across vision-language models also changes how images are generated and represented. First, we show that a diffusion model using the student as its text encoder generates the student\u0027s animal more often than with the original model as its text encoder, but not its color or style. We then investigate the mechanism behind this phenomenon and which concepts transfer across modalities. A constant component of the student\u0027s change accounts for much of the shift of image representations toward the trait. Adding this component uniformly can change the generated animal, which depends on the whole prompt, but not concepts such as color or style, which are encoded in a single token. Finally, we introduce weight lens as an approach to identify a subliminal trait from the weights of a single trained model, and show that it identifies the trait of nearly every student, including traits that do not surface in generated images.", "arxiv_id": "2611.31870", "arxiv_url": "https://arxiv.org/abs/2611.31870", "authors": ["Saraswathy Amjith", "Kimia Hamidieh", "Antonio Torralba", "Yoon Kim"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u7ecf\u6570\u5b57\u5e8f\u5217\u4f20\u9012\u7684\u9690\u6027\u504f\u597d\u53ef\u8de8\u6a21\u6001\u6539\u53d8\u56fe\u50cf\u751f\u6210\u4e0e\u8868\u5f81\uff0c\u52a8\u7269\u504f\u597d\u6709\u6548\u800c\u989c\u8272\u3001\u98ce\u683c\u65e0\u6548\uff1b\u5e76\u63d0\u51fa\u4ece\u6a21\u578b\u6743\u91cd\u8bc6\u522b\u9690\u6027\u7279\u5f81\u7684\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31870", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8de8\u6a21\u6001\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u56fe\u50cf\u751f\u6210", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31870v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Subliminal Learning Crosses Modalities", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u7ecf\u6570\u5b57\u5e8f\u5217\u4f20\u9012\u7684\u9690\u6027\u504f\u597d\u53ef\u8de8\u6a21\u6001\u6539\u53d8\u56fe\u50cf\u751f\u6210\u4e0e\u8868\u5f81\uff0c\u52a8\u7269\u504f\u597d\u6709\u6548\u800c\u989c\u8272\u3001\u98ce\u683c\u65e0\u6548\uff1b\u5e76\u63d0\u51fa\u4ece\u6a21\u578b\u6743\u91cd\u8bc6\u522b\u9690\u6027\u7279\u5f81\u7684\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "EEG analysis spans choosing alternatives, judging statements, and rating ordered attributes, requiring calibratable probabilities with explicit meaning. We present EEG-Jev, a unified single-pass decision model for EEG. Given an EEG window, a question and an answer specification, one forward pass returns a typed readout: CHOICE gives a candidate distribution, NOUL a proposition probability, and SCORE an ordered-level distribution and expectation. One checkpoint is trained jointly and evaluated once on held-out splits of 35 public sources. Core raw outputs reach 54.08% balanced accuracy on Stieger2021 motor imagery, 70.45% on Sleep-EDF-SC sleep staging, 72.11% per window at threshold 0.5 on CHB-MIT seizure detection with 0.825 AUROC, and 1.700 MAE on 0-10 ds005292 pain ratings. Prior correction and temperature scaling lower negative log-likelihood from 0.766 to 0.606 on Sleep-EDF-SC and 0.166 to 0.019 on CHB-MIT, while direct readout cuts batch-1 latency from 122.43 to 63.11 ms (1.94-fold) against a matched-backbone generative comparator. Interactive demonstration and aggregate results: https://neuroimglab.github.io/EEG-Jev/.", "arxiv_id": "2611.31875", "arxiv_url": "https://arxiv.org/abs/2611.31875", "authors": ["Zhifei Zhu", "Hongtao Zhang", "Yu Ren", "Wei Zhou", "Zeping Xie", "Yi He"], "brief": "EEG-Jev\u7528\u5355\u6b21\u524d\u5411\u4f20\u64ad\u7edf\u4e00\u8111\u7535\u9009\u62e9\u3001\u5224\u65ad\u548c\u8bc4\u5206\u4efb\u52a1\uff0c\u572835\u4e2a\u516c\u5f00\u6570\u636e\u6e90\u4e0a\u8bc4\u6d4b\uff0c\u6982\u7387\u6821\u51c6\u6539\u5584\uff0c\u63a8\u7406\u8f83\u540c\u9aa8\u5e72\u751f\u6210\u6a21\u578b\u5feb\u8fd1\u4e24\u500d\u3002", "categories": ["cs.LG", "cs.AI", "physics.bio-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31875", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8111\u7535\u5206\u6790", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u6982\u7387\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31875v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EEG-Jev: A Unified Single-Pass Decision Model for EEG", "tldr": "EEG-Jev\u7528\u5355\u6b21\u524d\u5411\u4f20\u64ad\u7edf\u4e00\u8111\u7535\u9009\u62e9\u3001\u5224\u65ad\u548c\u8bc4\u5206\u4efb\u52a1\uff0c\u572835\u4e2a\u516c\u5f00\u6570\u636e\u6e90\u4e0a\u8bc4\u6d4b\uff0c\u6982\u7387\u6821\u51c6\u6539\u5584\uff0c\u63a8\u7406\u8f83\u540c\u9aa8\u5e72\u751f\u6210\u6a21\u578b\u5feb\u8fd1\u4e24\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fast generation on manifolds is important for scientific applications such as protein design, yet existing one-step generators often produce spurious samples in low-density gaps between data modes. Our analysis highlights the mismatch between uniform noise and concentrated data, motivating a statistical prior that captures the data\u0027s coarse structure. We first estimate this prior by fitting mixtures of tangent-space Gaussians through geometry-aware moment matching. However, independent noise-data pairing can still connect different modes and weaken the benefit of the fitted prior. We therefore introduce posterior coupling, which samples a latent component conditioned on each data point and draws its paired noise from that component. To extend this approach to long torsion-angle chains, where full-covariance mixtures become costly, we use a hidden Markov prior to model sequential dependence with shared parameters. The resulting framework plugs into existing one-step training pipelines while retaining the generator architecture, training objective, and single network evaluation at inference. Experiments on spheres, tori, and SO(3) demonstrate substantial improvements across multiple generators, reducing distributional error by up to $125\\times$ and the protein Ramachandran outlier rate from 12.1% to 0.55%.", "arxiv_id": "2611.31856", "arxiv_url": "https://arxiv.org/abs/2611.31856", "authors": ["Yuyao Wang", "Haoliang Sun", "Xiankai Lu", "Xinxin Zhang", "Yongshun Gong"], "brief": "\u4e3a\u6d41\u5f62\u5355\u6b65\u751f\u6210\u5f15\u5165\u7edf\u8ba1\u5148\u9a8c\u4e0e\u540e\u9a8c\u914d\u5bf9\uff0c\u51cf\u5c11\u6a21\u6001\u95f4\u4f2a\u6837\u672c\uff1b\u5206\u5e03\u8bef\u5dee\u6700\u9ad8\u964d\u4f4e125\u500d\uff0c\u86cb\u767d\u8d28\u6784\u8c61\u5f02\u5e38\u7387\u4ece12.1%\u964d\u81f30.55%\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31856", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u6a21\u578b", "\u6d41\u5f62\u5b66\u4e60", "\u7edf\u8ba1\u5148\u9a8c", "\u86cb\u767d\u8d28\u8bbe\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31856v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Start Where the Data Are: Statistical Priors for One-Step Generation on Manifolds", "tldr": "\u4e3a\u6d41\u5f62\u5355\u6b65\u751f\u6210\u5f15\u5165\u7edf\u8ba1\u5148\u9a8c\u4e0e\u540e\u9a8c\u914d\u5bf9\uff0c\u51cf\u5c11\u6a21\u6001\u95f4\u4f2a\u6837\u672c\uff1b\u5206\u5e03\u8bef\u5dee\u6700\u9ad8\u964d\u4f4e125\u500d\uff0c\u86cb\u767d\u8d28\u6784\u8c61\u5f02\u5e38\u7387\u4ece12.1%\u964d\u81f30.55%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large-scale pretraining provides embodied models with general capabilities, but reliable task execution still requires post training. In multitask settings, supervised fine-tuning (SFT) faces distribution mismatch between training and deployment, whereas reinforcement learning (RL) is limited by sparse rewards and uneven learning progress across tasks. Multi-teacher on policy distillation (MOPD) consolidates expert capabilities through dense supervision on the model\u0027s own trajectories, but achieving performance beyond the teachers remains challenging. We propose a two-stage post training framework for flow-based embodied models, constructing distillation objectives from the velocity regression formulation of conditional flow matching. Stage 1 efficiently consolidates expert capabilities through MOPD. Stage 2 combines RL with teacher distillation that weights velocity errors according to the sampling noise, where distillation is restricted to failed trajectories to supplement sparse rewards with dense guidance without directly constraining successful behaviors. Experiments across multiple models and benchmarks show that the framework outperforms joint SFT and exceeds the corresponding teachers\u0027 aggregate success rates. Sample efficiency comparisons show higher success rates than direct RL with fewer environment interactions.", "arxiv_id": "2611.31850", "arxiv_url": "https://arxiv.org/abs/2611.31850", "authors": ["Jiaming Zhang", "Yao Lyu", "Haoning Wang", "Yongjun Chen", "Liping Zhang", "Shengbo Eben Li"], "brief": "\u63d0\u51fa\u9762\u5411\u6d41\u5f0f\u5177\u8eab\u6a21\u578b\u7684\u4e24\u9636\u6bb5\u540e\u8bad\u7ec3\uff0c\u5148\u84b8\u998f\u591a\u6559\u5e08\uff0c\u518d\u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u4e0e\u5931\u8d25\u8f68\u8ff9\u6307\u5bfc\uff1b\u6210\u529f\u7387\u8d85\u8fc7\u6559\u5e08\u6574\u4f53\u6c34\u5e73\uff0c\u4e14\u6bd4\u76f4\u63a5\u5f3a\u5316\u5b66\u4e60\u66f4\u7701\u4ea4\u4e92\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31850", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31850v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Two-Stage Post-Training for Flow-Based Embodied Foundation Models", "tldr": "\u63d0\u51fa\u9762\u5411\u6d41\u5f0f\u5177\u8eab\u6a21\u578b\u7684\u4e24\u9636\u6bb5\u540e\u8bad\u7ec3\uff0c\u5148\u84b8\u998f\u591a\u6559\u5e08\uff0c\u518d\u7ed3\u5408\u5f3a\u5316\u5b66\u4e60\u4e0e\u5931\u8d25\u8f68\u8ff9\u6307\u5bfc\uff1b\u6210\u529f\u7387\u8d85\u8fc7\u6559\u5e08\u6574\u4f53\u6c34\u5e73\uff0c\u4e14\u6bd4\u76f4\u63a5\u5f3a\u5316\u5b66\u4e60\u66f4\u7701\u4ea4\u4e92\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "SWE-bench-style benchmarks, such as SWE-bench Verified (Verified) and SWE-bench Pro (Pro), evaluate coding agents with tests taken from the change that originally fixed each issue. However, these tests can enforce details the task never states, causing correct alternative fixes to fail. Such overspecified tests have so far been found mainly through expensive expert review. To address this, we define the Spec-Test Coverage Gap (STCG), a 1-4 scale measuring overspecification, and score it with two LLM judges, Claude Opus 5.5 and GPT-6.1 Sol, which are given the specification and the test patch. A task is flagged as overspecified when both judges score it 3 or higher. Our study has three parts. First, we validate the judges on 206 tasks that earlier human audits and agent results label as overspecified or fine. Second, we apply STCG to all 500 Verified and 731 public Pro tasks and compare the flags with the results of the top 30 Verified submissions. Third, we verify the flags by asking Claude Opus 5.5 to loosen the overspecified requirements of flagged tasks, and regrade 2,186 failed patches from those submissions. Our main findings are: (1) Overspecified tests are detectable: on the validation tasks, the judges correctly flag 89% of the tasks that human audits identify as overspecified and wrongly flag only 4% of the tasks known to be fine. (2) Overspecified tests are common: applied to whole benchmarks, the judges flag 23% of Verified and 35% of Pro tasks. (3) Flagged tasks are much harder for agents: the top 30 Verified submissions resolve only 31% of the flagged tasks on average, against 88% of the other tasks. (4) Overspecified tests change the leaderboard: relaxing the tests lets 61% of the 2,186 failed patches on flagged tasks pass. Counting these patches as resolved would add 33 to 60 tasks to each top-30 submission, raising resolve rates by up to 12 percentage points.", "arxiv_id": "2611.31839", "arxiv_url": "https://arxiv.org/abs/2611.31839", "authors": ["Avi Aggarwal", "Yiran Hu"], "brief": "\u63d0\u51faSTCG\u6307\u6807\uff0c\u7528\u53cc\u6a21\u578b\u8bc6\u522b\u7f16\u7a0b\u57fa\u51c6\u4e2d\u8d85\u51fa\u4efb\u52a1\u8981\u6c42\u7684\u6d4b\u8bd5\uff1b\u53d1\u73b0\u6b64\u7c7b\u6d4b\u8bd5\u536023%\u81f335%\uff0c\u653e\u5bbd\u540e61%\u7684\u76f8\u5173\u5931\u8d25\u8865\u4e01\u53ef\u901a\u8fc7\uff0c\u663e\u8457\u5f71\u54cd\u6392\u540d\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31839", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8f6f\u4ef6\u6d4b\u8bd5", "\u57fa\u51c6\u8bc4\u6d4b", "\u7f16\u7a0b\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31839v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Spec-Test Coverage Gap: Detecting Overspecified Tests in SWE-Bench-Style Benchmarks", "tldr": "\u63d0\u51faSTCG\u6307\u6807\uff0c\u7528\u53cc\u6a21\u578b\u8bc6\u522b\u7f16\u7a0b\u57fa\u51c6\u4e2d\u8d85\u51fa\u4efb\u52a1\u8981\u6c42\u7684\u6d4b\u8bd5\uff1b\u53d1\u73b0\u6b64\u7c7b\u6d4b\u8bd5\u536023%\u81f335%\uff0c\u653e\u5bbd\u540e61%\u7684\u76f8\u5173\u5931\u8d25\u8865\u4e01\u53ef\u901a\u8fc7\uff0c\u663e\u8457\u5f71\u54cd\u6392\u540d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Zero-shot skeleton-based action recognition is evaluated almost exclusively on flat leaf labels, which leaves open whether a representation also grounds the broader concepts that contain an action in skeleton motion. We find that strong leaf alignment does not carry over to them: when ancestor concepts are scored directly under independent decoding, eight flat methods with 57.86-73.29% mean leaf Top-1 reach only 6.15-31.21% mean full-path accuracy across four NTU RGB+D splits. We propose the Hyperbolic Hierarchical Semantic Prototype ($H^2SP$) framework, which represents every node of an action taxonomy in the Lorentz model of hyperbolic space. First, instead of learning a free vector per node, $H^2SP$ synthesizes hierarchy-aware prototypes by recursive parent-child geodesic interpolation under a single tree-wide gate. Second, tangent-space semantic and distributional alignment on seen classes anchor the leaf prototypes in skeleton motion. Third, a soft entailment-cone regularizer encourages directional parent-child inclusion, propagating this motion grounding to ancestor concepts. We evaluate hierarchical concept prediction under independent and cascade decoding, and transfer to an alternative taxonomy without retraining. Across the four splits, $H^2SP$ attains the best mean independent and cascade full-path accuracy among the evaluated methods, at a comparable leaf Top-1 of 72.40%. Transferred to the alternative taxonomy, it outperforms both flat baselines and the same-tree Euclidean control across every split and decoding mode, indicating that its concept-level correspondence extends beyond the training taxonomy.", "arxiv_id": "2611.31877", "arxiv_url": "https://arxiv.org/abs/2611.31877", "authors": ["Zixiao Jin", "Siyu Zhu", "Feng Ding", "Haisheng Fu", "Xin Dong", "Shankai Chen", "Jie Liang"], "brief": "\u63d0\u51fa\u53cc\u66f2\u7a7a\u95f4\u5c42\u7ea7\u8bed\u4e49\u539f\u578b\uff0c\u5c06\u9aa8\u67b6\u52a8\u4f5c\u4e0e\u4e0a\u4e0b\u4f4d\u6982\u5ff5\u5bf9\u9f50\uff1b\u5728\u53f6\u7ea7\u8bc6\u522b\u7387\u76f8\u5f53\u65f6\u53d6\u5f97\u6700\u4f73\u5c42\u7ea7\u8def\u5f84\u51c6\u786e\u7387\uff0c\u5e76\u80fd\u65e0\u9700\u91cd\u8bad\u8fc1\u79fb\u81f3\u5176\u4ed6\u5206\u7c7b\u6811\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31877", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u96f6\u6837\u672c\u5b66\u4e60", "\u9aa8\u67b6\u52a8\u4f5c\u8bc6\u522b", "\u53cc\u66f2\u7a7a\u95f4", "\u5c42\u7ea7\u8bed\u4e49"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31877v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Don\u0027t Miss the Forest for the Trees: Zero-Shot Skeleton Action Recognition with Hyperbolic Hierarchical Semantic Prototypes", "tldr": "\u63d0\u51fa\u53cc\u66f2\u7a7a\u95f4\u5c42\u7ea7\u8bed\u4e49\u539f\u578b\uff0c\u5c06\u9aa8\u67b6\u52a8\u4f5c\u4e0e\u4e0a\u4e0b\u4f4d\u6982\u5ff5\u5bf9\u9f50\uff1b\u5728\u53f6\u7ea7\u8bc6\u522b\u7387\u76f8\u5f53\u65f6\u53d6\u5f97\u6700\u4f73\u5c42\u7ea7\u8def\u5f84\u51c6\u786e\u7387\uff0c\u5e76\u80fd\u65e0\u9700\u91cd\u8bad\u8fc1\u79fb\u81f3\u5176\u4ed6\u5206\u7c7b\u6811\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robots must often keep working after the world changes, as when a block moves or the camera shifts while the robot still acts on what it saw before. Recent work showed that one change during a task lowers success for every policy tested, but did not separate the effect of its timing from the cost of the changed world, or measure what it costs afterwards. We introduce CALVIN-MAX, a benchmark of 7,828 cases on CALVIN\u0027s five-instruction chains, each with one change to the objects, the camera, the robot, or the instruction. Each case compares three runs that are identical until the affected instruction begins: one without the change, one with it in place from that moment, and one in which it arrives while the robot is moving. The second run against the first gives the cost of the changed world, and the third against the second the effect of meeting it mid-motion. On 1,526 held-out cases per policy, with hypotheses fixed in advance, each of ten released policies loses 4.4 to 9.9 percentage points on the affected instruction over the eight core changes. Whether timing matters depends on the change: one that alters what the robot sees costs 5.4 points less mid-motion than from the start, whereas a change to the scene itself or to the robot shows no detectable effect. Rewinding the robot to the start of the instruction removes the benefit for every policy; the stricter test we fixed in advance, that the rewound run then matches the second run, passes for three. The cost also outlasts the affected instruction: the change stays in place, and a policy that still completes that instruction is 5.0 to 16.8 points less likely to complete the next one.", "arxiv_id": "2611.31868", "arxiv_url": "https://arxiv.org/abs/2611.31868", "authors": ["Sajjad Pakdamansavoji"], "brief": "\u63d0\u51faCALVIN-MAX\uff0c\u533a\u5206\u73af\u5883\u53d8\u5316\u4e0e\u6267\u884c\u65f6\u673a\u5bf9\u673a\u5668\u4eba\u7b56\u7565\u7684\u5f71\u54cd\u3002\u5341\u79cd\u7b56\u7565\u6210\u529f\u7387\u5747\u4e0b\u964d\uff0c\u89c6\u89c9\u53d8\u5316\u5728\u52a8\u4f5c\u4e2d\u53d1\u751f\u53cd\u800c\u635f\u5931\u66f4\u5c0f\uff0c\u4e14\u5f71\u54cd\u5ef6\u7eed\u81f3\u4e0b\u4e00\u4efb\u52a1\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31868", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u7b56\u7565", "\u9c81\u68d2\u6027\u8bc4\u4f30", "\u73af\u5883\u53d8\u5316", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31868v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CALVIN-MAX: When Does a Mid-Execution Change Hurt a Robot Policy?", "tldr": "\u63d0\u51faCALVIN-MAX\uff0c\u533a\u5206\u73af\u5883\u53d8\u5316\u4e0e\u6267\u884c\u65f6\u673a\u5bf9\u673a\u5668\u4eba\u7b56\u7565\u7684\u5f71\u54cd\u3002\u5341\u79cd\u7b56\u7565\u6210\u529f\u7387\u5747\u4e0b\u964d\uff0c\u89c6\u89c9\u53d8\u5316\u5728\u52a8\u4f5c\u4e2d\u53d1\u751f\u53cd\u800c\u635f\u5931\u66f4\u5c0f\uff0c\u4e14\u5f71\u54cd\u5ef6\u7eed\u81f3\u4e0b\u4e00\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Joint-embedding predictive architectures learn by predicting features of masked regions from visible context. In chest computed tomography, the findings that decide a diagnosis, such as a small nodule, are often not predictable from the surrounding anatomy. A hidden finding is then best predicted toward normal anatomy, and the prediction loss stops rewarding the encoder for representing it. We call this the context shortcut. Conditioning the predictor on the radiology report repairs the prediction, but in our setup the encoder gains little over image-only pretraining: the report supplies what the encoder never had to learn. JECT therefore gives the report two roles: a condition for the predictor and, through masked section-text prediction, a target for the encoder, which must predict the report\u0027s anatomical sections from the unmasked scan. A hierarchical three-dimensional encoder that predicts at every stage keeps this clinical content at every scale. In ablations, the text target improves classification and localization, while conditioning adds little to the encoder. Trained from scratch on 173k volumes, the recipe reaches the level of current computed tomography foundation models in classification, retrieval and nodule malignancy, and of task-specific models in lung-cancer risk prediction after fine-tuning. Conditioning still matters: its predictor can be reused, with no extra training, to show where a report sentence acts, changing most at the finding the sentence describes. Code and pretrained weights are available.", "arxiv_id": "2611.31849", "arxiv_url": "https://arxiv.org/abs/2611.31849", "authors": ["Hanbin Ko", "Hong-Jun Choi", "Jihun Kim", "Young-Gon Kim", "Dongheon Lee", "Chang Min Park"], "brief": "JECT\u7528\u62a5\u544a\u6761\u4ef6\u4e0e\u5206\u6bb5\u6587\u672c\u9884\u6d4b\u7f13\u89e3\u80f8\u90e8CT\u9884\u8bad\u7ec3\u7684\u4e0a\u4e0b\u6587\u6377\u5f84\uff0c\u4f7f\u7f16\u7801\u5668\u5b66\u4e60\u5f02\u5e38\u7279\u5f81\uff1b\u591a\u9879\u4efb\u52a1\u8fbe\u5230\u73b0\u6709\u57fa\u7840\u6a21\u578b\u6c34\u5e73\uff0c\u5e76\u652f\u6301\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u7684\u53e5\u5b50\u5b9a\u4f4d\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31849", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u533b\u5b66\u5f71\u50cf", "\u591a\u6a21\u6001\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31849v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "JECT: Addressing the Context Shortcut in Joint-Embedding Predictive Learning for Chest CT", "tldr": "JECT\u7528\u62a5\u544a\u6761\u4ef6\u4e0e\u5206\u6bb5\u6587\u672c\u9884\u6d4b\u7f13\u89e3\u80f8\u90e8CT\u9884\u8bad\u7ec3\u7684\u4e0a\u4e0b\u6587\u6377\u5f84\uff0c\u4f7f\u7f16\u7801\u5668\u5b66\u4e60\u5f02\u5e38\u7279\u5f81\uff1b\u591a\u9879\u4efb\u52a1\u8fbe\u5230\u73b0\u6709\u57fa\u7840\u6a21\u578b\u6c34\u5e73\uff0c\u5e76\u652f\u6301\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u7684\u53e5\u5b50\u5b9a\u4f4d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual self-models learn from images how a robot moves under motor commands. Continuum robots need them even more, as they bend continuously without measured joint angles or fixed link geometry. Existing continuum self-models predict point clouds, image-space curves, or future images, but not the next 3D shape, appearance, and tip pose together from an observed body. 3D Gaussians offer a renderable representation of shape and appearance, yet articulated Gaussian self-models rely on joint angles to drive deformation. In this work, we propose BendGS, which uses a virtual backbone estimated from observation to drive command-conditioned Gaussian deformation, enabling next-state prediction for continuum robots without measured joint angles. In Gaussian modeling, a feed-forward network reconstructs the robot as 3D Gaussians from multi-view images, and the backbone, a chain of coordinate frames, is fitted to back-projected depth points to estimate the bending state. In transition, a network predicts its change under a relative motor command to deform the bound Gaussians. The deformed Gaussians render the next images and the 3D shape, and the distal frame gives the tip pose. Training losses use RGB-D images and masks, without bending or tip labels. On simulated and real robots, BendGS achieves the lowest Chamfer distance, best image quality, and lowest tip errors among the compared methods.", "arxiv_id": "2611.31844", "arxiv_url": "https://arxiv.org/abs/2611.31844", "authors": ["Jeong Woon Lee", "Doungjun Kim", "Namho Kim", "Seungheon Chae", "Jongwoo Kim", "Hyoseok Hwang"], "brief": "BendGS\u4ee5\u89c2\u6d4b\u4f30\u8ba1\u865a\u62df\u9aa8\u67b6\uff0c\u9a71\u52a8\u9ad8\u65af\u53d8\u5f62\uff0c\u65e0\u9700\u5173\u8282\u89d2\u5373\u53ef\u9884\u6d4b\u8fde\u7eed\u4f53\u673a\u5668\u4eba\u4e0b\u4e00\u72b6\u6001\u7684\u5f62\u72b6\u3001\u5916\u89c2\u4e0e\u672b\u7aef\u4f4d\u59ff\uff1b\u4eff\u771f\u548c\u5b9e\u673a\u6d4b\u8bd5\u5747\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31844", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fde\u7eed\u4f53\u673a\u5668\u4eba", "\u89c6\u89c9\u81ea\u5efa\u6a21", "\u4e09\u7ef4\u9ad8\u65af", "\u72b6\u6001\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31844v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BendGS: Observation-Conditioned Gaussian Self-Modeling for Continuum Robots", "tldr": "BendGS\u4ee5\u89c2\u6d4b\u4f30\u8ba1\u865a\u62df\u9aa8\u67b6\uff0c\u9a71\u52a8\u9ad8\u65af\u53d8\u5f62\uff0c\u65e0\u9700\u5173\u8282\u89d2\u5373\u53ef\u9884\u6d4b\u8fde\u7eed\u4f53\u673a\u5668\u4eba\u4e0b\u4e00\u72b6\u6001\u7684\u5f62\u72b6\u3001\u5916\u89c2\u4e0e\u672b\u7aef\u4f4d\u59ff\uff1b\u4eff\u771f\u548c\u5b9e\u673a\u6d4b\u8bd5\u5747\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Where a person looks indicates their focus of attention, and how their gaze shifts between targets reveals how that attention responds to a changing scene. Existing gaze target estimation methods largely operate frame by frame and do not model these shifts. Gaze shifts are often driven by dynamic changes in the scene, which is the kind of information world models are designed to encode. This relationship is subtle, however, since an event far across the frame may produce only a slight movement of the person\u0027s head or eyes. We therefore introduce the Gaze World Model (GWM), which co-trains latent scene prediction with person-conditioned gaze supervision on a frozen V-JEPA 2.1 encoder; in our ablations, the latent prediction objective improves both shift detection and gaze localization. Given a video clip and the person\u0027s head box, GWM estimates gaze locations and detects gaze shifts in the observed clip, and forecasts future gaze and shifts from predicted scene features. To train and evaluate these tasks, we augment VideoAttentionTarget and ChildPlay with event-level gaze-shift annotations. GWM achieves state-of-the-art shift detection on these benchmarks, about 10 points higher in four-class AP than the strongest baseline, while remaining comparable to the strongest image-based models in gaze target estimation, and outperforms the compared baselines on future gaze localization and shift forecasting.", "arxiv_id": "2611.31836", "arxiv_url": "https://arxiv.org/abs/2611.31836", "authors": ["Jiawen Zhang", "Houze Yang", "Xu Cao", "Yifan Shen", "Zhongyi Zhou", "Steve Wong", "Ismini Lourentzou", "Inki Kim", "James M. Rehg"], "brief": "GWM\u8054\u5408\u8bad\u7ec3\u573a\u666f\u6f5c\u53d8\u91cf\u9884\u6d4b\u4e0e\u89c6\u7ebf\u76d1\u7763\uff0c\u5b9a\u4f4d\u5e76\u9884\u6d4b\u89c6\u9891\u4e2d\u7684\u6ce8\u89c6\u76ee\u6807\u548c\u8f6c\u79fb\uff1b\u8f6c\u79fb\u68c0\u6d4bAP\u9886\u5148\u6700\u5f3a\u57fa\u7ebf\u7ea610\u70b9\uff0c\u672a\u6765\u89c6\u7ebf\u9884\u6d4b\u4e5f\u66f4\u4f18\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31836", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u7ebf\u4f30\u8ba1", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u7406\u89e3", "\u672a\u6765\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.31836v1", "published_at": "2026-11-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Gaze World Model", "tldr": "GWM\u8054\u5408\u8bad\u7ec3\u573a\u666f\u6f5c\u53d8\u91cf\u9884\u6d4b\u4e0e\u89c6\u7ebf\u76d1\u7763\uff0c\u5b9a\u4f4d\u5e76\u9884\u6d4b\u89c6\u9891\u4e2d\u7684\u6ce8\u89c6\u76ee\u6807\u548c\u8f6c\u79fb\uff1b\u8f6c\u79fb\u68c0\u6d4bAP\u9886\u5148\u6700\u5f3a\u57fa\u7ebf\u7ea610\u70b9\uff0c\u672a\u6765\u89c6\u7ebf\u9884\u6d4b\u4e5f\u66f4\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
