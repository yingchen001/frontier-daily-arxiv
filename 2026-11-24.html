517d\u9aa8\u67b6\u6269\u5c55\u5230\u591a\u5f62\u6001\u8d44\u4ea7\uff0c\u5e76\u4ee5\u7a0b\u5e8f\u5316\u63a7\u5236\u964d\u4f4e\u751f\u6210\u5f00\u9500\uff0c\u4e3a\u53ef\u63a7\u4e09\u7ef4\u52a8\u753b\u90e8\u7f72\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "AI systems can now operate Blender, follow instructions in complex video games, and manipulate objects with robot arms. What range of physical goals can today\u0027s AI systems achieve autonomously? Answering this question requires testing systems on tasks that demand different combinations of perception, memory, planning, and action. We introduce \\textbf{WorldLeague}, a benchmark that compares AI systems on a common set of \\textbf{60 simulated robot tasks} by measuring progress toward each task\u0027s physical goal from the robot\u0027s trajectory. Robots explore scenes to gather evidence in \\textbf{WorldSeek}, rearrange objects in \\textbf{WorldShape}, and adapt to changes in \\textbf{WorldShift}. Tying these goals to a single control interface limits which AI systems can be compared. In WorldLeague, vision-language models (VLMs) choose targets and motions, while vision-language-action models (VLAs) and world-action models (WAMs) use their native controls. For each of six capability dimensions, we measure how much progress a system makes toward its goals (Interactive Score) and how often it achieves them (physical success rate). Together, these measures form the system\u0027s \\emph{Physical Agency Profile}. Among 13 representative AI systems, Claude Fable 5.2 achieves 13 of the 60 goals and earns the highest mean Interactive Score (28.58/100). Fable leads in four dimensions, while GPT-6.1-Sol and GPT-6-Astra tie for first on rule-following tasks. Even when VLMs answer every final question correctly, they receive an Interactive Score of zero in 71.8\\% of those episodes. WorldLeague gives Embodied AI, Physical AI, and Agentic AI a shared basis for comparing what AI systems achieve autonomously, from partial progress toward a physical goal to full goal completion. Project Webpage: https://xyangzhou.github.io/WorldLeague", "arxiv_id": "2611.30989", "arxiv_url": "https://arxiv.org/abs/2611.30989", "authors": ["Xinyang Zhou", "Qi Li", "Xinchao Wang"], "brief": "WorldLeague\u4ee5\u673a\u5668\u4eba\u8f68\u8ff9\u8bc4\u4f30\u63a2\u7d22\u3001\u7269\u4f53\u91cd\u6392\u4e0e\u53d8\u5316\u9002\u5e94\u4efb\u52a1\uff0c\u517c\u5bb9\u4e0d\u540c\u6a21\u578b\u7684\u63a7\u5236\u65b9\u5f0f\u3002\u7ed3\u5408\u76ee\u6807\u8fdb\u5c55\u548c\u6210\u529f\u7387\uff0c\u5f62\u6210\u516d\u7ef4\u7269\u7406\u884c\u52a8\u80fd\u529b\u753b\u50cf\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/xyangzhou/WorldLeague", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2611.30989", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["60\u9879\u4efb\u52a1\u8986\u76d6WorldSeek\u3001WorldShape\u3001WorldShift", "\u6bd4\u8f8313\u4e2a\u7cfb\u7edf\uff0c\u6700\u9ad8\u5e73\u5747\u4ea4\u4e92\u5f97\u5206\u4ec528.58/100", "VLM\u7b54\u5bf9\u6240\u6709\u7ec8\u9898\u7684\u56de\u5408\u4e2d\uff0c71.8%\u4ea4\u4e92\u5f97\u5206\u4e3a\u96f6"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u8bc4\u6d4b", "\u81ea\u4e3b\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.30989v1", "published_at": "2026-11-23", "score": 0.703, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (102\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30989.png", "title": "WorldLeague: Benchmarking Physical Agency", "tldr": "\u7528\u516d\u5341\u9879\u6a21\u62df\u673a\u5668\u4eba\u4efb\u52a1\u8861\u91cf\u81ea\u4e3b\u7269\u7406\u884c\u52a8\uff0c\u63ed\u793a\u7b54\u9898\u6b63\u786e\u4e0e\u5b9e\u9645\u8fbe\u6210\u76ee\u6807\u7684\u843d\u5dee\u3002", "upvotes": 102, "what_it_is": "WorldLeague\u4ee5\u673a\u5668\u4eba\u8f68\u8ff9\u8bc4\u4f30\u63a2\u7d22\u3001\u7269\u4f53\u91cd\u6392\u4e0e\u53d8\u5316\u9002\u5e94\u4efb\u52a1\uff0c\u517c\u5bb9\u4e0d\u540c\u6a21\u578b\u7684\u63a7\u5236\u65b9\u5f0f\u3002\u7ed3\u5408\u76ee\u6807\u8fdb\u5c55\u548c\u6210\u529f\u7387\uff0c\u5f62\u6210\u516d\u7ef4\u7269\u7406\u884c\u52a8\u80fd\u529b\u753b\u50cf\u3002", "why_notable": "\u5c06\u8bc4\u4f30\u91cd\u5fc3\u4ece\u8bed\u8a00\u56de\u7b54\u8f6c\u5411\u771f\u5b9e\u884c\u52a8\u8fdb\u5c55\uff0c\u5e76\u517c\u5bb9\u4e0d\u540c\u63a7\u5236\u63a5\u53e3\uff0c\u4e3a\u8de8\u6a21\u578b\u6bd4\u8f83\u81ea\u4e3b\u7269\u7406\u80fd\u529b\u63d0\u4f9b\u7edf\u4e00\u57fa\u51c6\u3002"}, {"abstract": "Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemotron-native harness coordinates planning and raster candidate selection, with targeted repair for editable structured and hybrid artifacts. To support this interface, we develop Nemotron-Labs-Image-Tokenizer, the autoregressive raster generator Nemotron-Labs-Image-30B-A3B, and the structured-code model family Nemotron-Labs-VisionCode. On approximately 178K images spanning six visual domains, our tokenizer improves reconstruction PSNR from 26.08 to 29.57 dB over Emu3.5 IBQ. It also provides 7.13x faster encoding and 10.93x faster decoding at batch size one on A100. In standalone evaluation, one Nemotron-Labs-VisionCode variant surpasses Kimi K3.1 Pro on the aggregate across Chart2Code, MMSVG, Design2Code, and Image2Struct. At the system level, the Nemotron-native configuration raises GenEval2 Soft-TIFA GM from 31.71 to 52.56 using the same raster generator. With our best setting, Nemotron-Labs-VisualCreation achieves performance competitive with GPT Image 2 and Nano Banana Pro across most benchmarks with available comparisons.", "arxiv_id": "2611.31358", "arxiv_url": "https://arxiv.org/abs/2611.31358", "authors": ["Guo Chen", "Fuxiao Liu", "Haoqin Tu", "Yiyang Zhou", "Andrew Tao", "Bryan Catanzaro", "Cihang Xie", "Yuyin Zhou", "Huaxiu Yao", "Didong Lu", "Zongxia Li", "Guilin Liu"], "brief": "\u63d0\u51fa\u89c6\u89c9\u521b\u4f5c\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ee5\u79bb\u6563\u4ee4\u724c\u8868\u793a\u6805\u683c\u56fe\u50cf\u3001\u663e\u5f0f\u7a0b\u5e8f\u8868\u793a\u7ed3\u6784\u5316\u5185\u5bb9\uff0c\u901a\u8fc7\u7edf\u4e00\u751f\u6210\u4e0e\u6e32\u67d3\u63a5\u53e3\u63a5\u5165\u89c6\u89c9\u53cd\u9988\uff0c\u534f\u8c03\u89c4\u5212\u3001\u5019\u9009\u7b5b\u9009\u53ca\u5b9a\u5411\u4fee\u590d\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31358", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7ea617.8\u4e07\u56fe\u50cf\u4e0a\uff0c\u91cd\u5efaPSNR\u4ece26.08\u5347\u81f329.57 dB", "A100\u5355\u6837\u672c\u7f16\u7801\u3001\u89e3\u7801\u5206\u522b\u52a0\u901f7.13\u500d\u300110.93\u500d", "\u540c\u4e00\u6805\u683c\u751f\u6210\u5668\u4e0b\uff0cGenEval2\u5f97\u5206\u4ece31.71\u5347\u81f352.56"], "keywords": ["\u89c6\u89c9\u751f\u6210", "\u667a\u80fd\u4f53", "\u56fe\u50cf\u5206\u8bcd", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "NVIDIA Nemotron", "pdf_url": "https://arxiv.org/pdf/2611.31358v1", "published_at": "2026-11-23", "score": 0.663, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31358.png", "title": "Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation", "tldr": "\u4ee5\u79bb\u6563\u89c6\u89c9\u4ee4\u724c\u4e0e\u663e\u5f0f\u7a0b\u5e8f\u7edf\u4e00\u89c6\u89c9\u521b\u4f5c\uff0c\u8ba9\u667a\u80fd\u4f53\u517c\u987e\u56fe\u50cf\u8868\u73b0\u529b\u4e0e\u7ed3\u6784\u63a7\u5236\u3002", "upvotes": 24, "what_it_is": "\u63d0\u51fa\u89c6\u89c9\u521b\u4f5c\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ee5\u79bb\u6563\u4ee4\u724c\u8868\u793a\u6805\u683c\u56fe\u50cf\u3001\u663e\u5f0f\u7a0b\u5e8f\u8868\u793a\u7ed3\u6784\u5316\u5185\u5bb9\uff0c\u901a\u8fc7\u7edf\u4e00\u751f\u6210\u4e0e\u6e32\u67d3\u63a5\u53e3\u63a5\u5165\u89c6\u89c9\u53cd\u9988\uff0c\u534f\u8c03\u89c4\u5212\u3001\u5019\u9009\u7b5b\u9009\u53ca\u5b9a\u5411\u4fee\u590d\u3002", "why_notable": "\u5c06\u56fe\u50cf\u751f\u6210\u4e0e\u53ef\u7f16\u8f91\u4ee3\u7801\u4ea7\u7269\u7eb3\u5165\u540c\u4e00\u53cd\u9988\u95ed\u73af\uff1b\u540c\u4e00\u751f\u6210\u5668\u4e0b\u7684\u660e\u663e\u589e\u76ca\uff0c\u51f8\u663e\u667a\u80fd\u4f53\u7f16\u6392\u5bf9\u89c6\u89c9\u521b\u4f5c\u8d28\u91cf\u7684\u4ef7\u503c\u3002"}, {"abstract": "Frontier multimodal models exhibit extraordinary generalization in generating robot actions from observations and instructions, enabling a new paradigm in which they serve directly as policies within closed-loop robotic harnesses. However, the design principles of such harnesses, and the capabilities underlying their strong performance, remain unclear. We present Embo-Harness, a framework for systematically studying frontier-model-as-policy harnesses. We investigate four components of the robotic agentic loop, namely, prompting, planning, action execution, and tool use, and distill six empirical findings into a practical recipe. This recipe prioritizes interfaces that exploit the model\u0027s native visual reasoning and tool-use capabilities over handcrafted plans, skills, or action priors, and identifies effective choices for action representation, chunking, reasoning effort, visual observations, short multi-action sequences, and policy refinement. On RoboLab-120, Embo-Harness achieves an 83.3\\% success rate, outperforming the strongest reported baseline by 26.2 percentage points. It also succeeds in 15 of 20 zero-shot trials across four real-world manipulation tasks. Beyond performance, controlled interventions indicate that the studied model depends more strongly on accurate spatial target estimation than on explicit low-level joint or trajectory generation. These results provide both a practical recipe for building strong frontier-model-as-policy harnesses and a clearer account of the capabilities that drive their performance.", "arxiv_id": "2611.31201", "arxiv_url": "https://arxiv.org/abs/2611.31201", "authors": ["Xiao-Ming Wu", "Kang Liao", "Yuexiao Ma", "Taolin Zhang", "Mingqian Zhou", "Nuo Chen", "Ziming Li", "Yihang Luo", "Rui Li", "Zhonghua Wu", "Tianyu Xie", "Xiawu Zheng", "Zhongang Cai", "Zhi Hou", "Chen Change Loy"], "brief": "Embo-Harness\u7cfb\u7edf\u7814\u7a76\u591a\u6a21\u6001\u6a21\u578b\u76f4\u63a5\u5145\u5f53\u95ed\u73af\u673a\u5668\u4eba\u7b56\u7565\u7684\u8bbe\u8ba1\uff0c\u56f4\u7ed5\u63d0\u793a\u3001\u89c4\u5212\u3001\u52a8\u4f5c\u6267\u884c\u4e0e\u5de5\u5177\u4f7f\u7528\u5f00\u5c55\u5b9e\u9a8c\uff0c\u63d0\u70bc\u4f18\u5148\u5229\u7528\u6a21\u578b\u539f\u751f\u80fd\u529b\u7684\u5b9e\u8df5\u914d\u65b9\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/DravenALG/Embo-Harness", "github_stars": 59, "hf_url": "https://huggingface.co/papers/2611.31201", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7814\u7a76\u95ed\u73af\u63a7\u5236\u76844\u4e2a\u7ec4\u4ef6\uff0c\u63d0\u70bc6\u6761\u7ecf\u9a8c\u53d1\u73b0", "RoboLab-120\u6210\u529f\u738783.3%\uff0c\u9886\u514826.2\u4e2a\u767e\u5206\u70b9", "\u771f\u5b9e\u64cd\u4f5c\u96f6\u6837\u672c\u6210\u529f15/20\u6b21\uff0c\u66f4\u4f9d\u8d56\u7a7a\u95f4\u76ee\u6807\u4f30\u8ba1"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u591a\u6a21\u6001\u6a21\u578b", "\u673a\u5668\u4eba\u63a7\u5236", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2611.31201v1", "published_at": "2026-11-23", "score": 0.585, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (90\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31201.png", "title": "Embo-Harness: Towards Understanding Frontier-Model-as-Policy Harness", "tldr": "\u8ba9\u524d\u6cbf\u591a\u6a21\u6001\u6a21\u578b\u76f4\u63a5\u63a7\u5236\u673a\u5668\u4eba\uff0c\u539f\u751f\u89c6\u89c9\u4e0e\u5de5\u5177\u80fd\u529b\u6bd4\u624b\u5de5\u89c4\u5212\u66f4\u5173\u952e\u3002", "upvotes": 90, "what_it_is": "Embo-Harness\u7cfb\u7edf\u7814\u7a76\u591a\u6a21\u6001\u6a21\u578b\u76f4\u63a5\u5145\u5f53\u95ed\u73af\u673a\u5668\u4eba\u7b56\u7565\u7684\u8bbe\u8ba1\uff0c\u56f4\u7ed5\u63d0\u793a\u3001\u89c4\u5212\u3001\u52a8\u4f5c\u6267\u884c\u4e0e\u5de5\u5177\u4f7f\u7528\u5f00\u5c55\u5b9e\u9a8c\uff0c\u63d0\u70bc\u4f18\u5148\u5229\u7528\u6a21\u578b\u539f\u751f\u80fd\u529b\u7684\u5b9e\u8df5\u914d\u65b9\u3002", "why_notable": "\u65e2\u7ed9\u51fa\u53ef\u590d\u7528\u7684\u673a\u5668\u4eba\u63a7\u5236\u63a5\u53e3\u8bbe\u8ba1\u914d\u65b9\uff0c\u4e5f\u901a\u8fc7\u53d7\u63a7\u5e72\u9884\u8868\u660e\u51c6\u786e\u7a7a\u95f4\u5b9a\u4f4d\u6bd4\u663e\u5f0f\u5e95\u5c42\u8f68\u8ff9\u751f\u6210\u66f4\u5173\u952e\u3002"}, {"abstract": "Long-horizon, real-time controllable motion generation is essential for interactive animation and humanoid robotics, where an agent must respond to changing instructions and spatial goals while moving. Existing autoregressive diffusion methods generate motion incrementally, but bounded attention caches limit access to distant history, while repeated denoising introduces substantial inference overhead. We present Motion Mamba 2.0, a Mamba-based root-body diffusion architecture that integrates local attention, resumable recurrent states, and persistent content memory (PCM) for long-horizon controllable motion generation. PCM transforms compressed motion history from Mamba recurrent states, together with state changes and text-conditioned features, into dynamically updated content slots accessible to local attention. To enable efficient inference, we further develop an execution scheme tailored to this architecture, combining CUDA Graph replay, fused kernels, and execution-flow simplification while preserving the canonical history update. Evaluations on retargeted HiPHI demonstrate accurate terminal control over rollouts of up to 39.52 s, while short-horizon comparisons on BONES Seed and retargeted HumanML3D show that the model also retains strong spatial control and text-motion matching. On an RTX 4090, the optimized execution reduces median complete-window latency from 1685.35 to 276.14 ms, achieving a median paired speedup of 6.138$\\times$ while preserving identical outputs and committed states in the tested rollouts. Moreover, we conduct extensive real-world evaluation on the Unitree G1, demonstrating sequential text-guided action composition, expressive motion, and interactive locomotion through keyboard and mouse control.", "arxiv_id": "2611.29897", "arxiv_url": "https://arxiv.org/abs/2611.29897", "authors": ["Yue Huang", "Tianshan Zhang", "Zeyu Zhang", "Jayeon Kang", "Akide Liu", "Sungjoon Choi", "Dacheng Tao", "Hao Tang"], "brief": "\u63d0\u51fa\u57fa\u4e8eMamba\u7684\u6839\u90e8\u2014\u8eab\u4f53\u81ea\u56de\u5f52\u6269\u6563\u67b6\u6784\uff0c\u5c06\u9012\u5f52\u5386\u53f2\u8f6c\u4e3a\u6301\u4e45\u5185\u5bb9\u8bb0\u5fc6\u4f9b\u5c40\u90e8\u6ce8\u610f\u529b\u8bfb\u53d6\uff0c\u5e76\u901a\u8fc7CUDA\u56fe\u91cd\u653e\u548c\u878d\u5408\u7b97\u5b50\u52a0\u901f\u63a8\u7406\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/AIGeeksGroup/MotionMamba2.0", "github_stars": 23, "hf_url": "https://huggingface.co/papers/2611.29897", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["PCM\u878d\u5408\u9012\u5f52\u5386\u53f2\u3001\u72b6\u6001\u53d8\u5316\u548c\u6587\u672c\u7279\u5f81", "HiPHI\u4e0a\u652f\u6301\u6700\u957f39.52\u79d2\u8f68\u8ff9\u7684\u7ec8\u70b9\u63a7\u5236", "RTX 4090\u5ef6\u8fdf\u964d\u81f3276.14\u6beb\u79d2\uff0c\u52a0\u901f6.138\u500d"], "keywords": ["\u52a8\u4f5c\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u4eba\u5f62\u673a\u5668\u4eba"], "num_comments": 3, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2611.29897v1", "published_at": "2026-11-23", "score": 0.584, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (175\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29897.png", "title": "Motion Mamba 2.0: Autoregressive Diffusion Mamba for Long-Horizon Humanoid Control", "tldr": "\u901a\u8fc7\u6301\u4e45\u8bb0\u5fc6\u4e0e\u63a8\u7406\u4f18\u5316\uff0c\u5b9e\u73b0\u957f\u65f6\u57df\u53ef\u63a7\u52a8\u4f5c\u751f\u6210\u5e76\u9a8c\u8bc1\u4eba\u5f62\u673a\u5668\u4eba\u90e8\u7f72\u3002", "upvotes": 175, "what_it_is": "\u63d0\u51fa\u57fa\u4e8eMamba\u7684\u6839\u90e8\u2014\u8eab\u4f53\u81ea\u56de\u5f52\u6269\u6563\u67b6\u6784\uff0c\u5c06\u9012\u5f52\u5386\u53f2\u8f6c\u4e3a\u6301\u4e45\u5185\u5bb9\u8bb0\u5fc6\u4f9b\u5c40\u90e8\u6ce8\u610f\u529b\u8bfb\u53d6\uff0c\u5e76\u901a\u8fc7CUDA\u56fe\u91cd\u653e\u548c\u878d\u5408\u7b97\u5b50\u52a0\u901f\u63a8\u7406\u3002", "why_notable": "\u540c\u65f6\u7f13\u89e3\u957f\u65f6\u52a8\u4f5c\u751f\u6210\u7684\u5386\u53f2\u9057\u5fd8\u4e0e\u63a8\u7406\u5f00\u9500\uff0c\u5e76\u5728Unitree G1\u4e0a\u9a8c\u8bc1\u8fde\u7eed\u6587\u672c\u52a8\u4f5c\u7ec4\u5408\u548c\u4ea4\u4e92\u884c\u8d70\uff0c\u589e\u5f3a\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "We present WeMM-Ecom, a family of multimodal large language models that deliver frontier e-commerce capabilities while achieving state-of-the-art general-purpose performance at their respective scales. The family spans five sizes, from a 0.8B dense model to a 35B mixture-of-experts model with 3B active parameters. Our training pipeline begins with two-stage continued pre-training that progressively raises the proportion of e-commerce data within a diverse multimodal data mixture, followed by hybrid-thinking post-training that combines on-policy distillation and reinforcement learning to support both non-thinking and thinking modes. For evaluation, we construct a comprehensive suite of 28 e-commerce benchmarks (23 in-house and five open-source) covering eight business scenarios and complement it with 64 public general-purpose benchmarks. On the e-commerce suite, WeMM-Ecom-35B-A3B surpasses substantially larger open-source flagship models, including Qwen3.8-Flash-Next, HY4, and DeepSeek-V4.1-Flash. On the general-purpose suite, every WeMM-Ecom model surpasses its similarly sized Qwen3.5 counterpart, with the lightweight variants (e.g., WeMM-Ecom-2B) showing clear advantages over leading lightweight models such as Qwen3.5-2B, MiniCPM-V-4.7-1B, and LFM3-VL-2B. Beyond benchmarks, WeMM-Ecom now powers hundreds of production use cases in WeChat, including catalog management, multimodal product search, and livestream commerce, serving billion-scale requests per day. We publicly release all model weights and detail our data curation, training recipe, and benchmark construction to facilitate future work on domain-specialized multimodal models. We have released the model weights and code to facilitate future research at https://github.com/Tencent/WeMM-Ecom.", "arxiv_id": "2611.30662", "arxiv_url": "https://arxiv.org/abs/2611.30662", "authors": ["Binhui Xie", "Jinmin Li", "Haomiao Tang", "Guangting Wang", "Song Jin", "Jianwei Zhu", "Fengyun Rao", "Jing Lyu"], "brief": "\u63a8\u51fa\u4e94\u79cd\u89c4\u6a21\u7684\u7535\u5546\u591a\u6a21\u6001\u6a21\u578b\uff0c\u4ee5\u4e24\u9636\u6bb5\u6301\u7eed\u9884\u8bad\u7ec3\u9010\u6b65\u63d0\u9ad8\u7535\u5546\u6570\u636e\u5360\u6bd4\uff0c\u518d\u7ed3\u5408\u540c\u7b56\u7565\u84b8\u998f\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u652f\u6301\u601d\u8003\u4e0e\u975e\u601d\u8003\u6a21\u5f0f\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": "https://github.com/Tencent/WeMM-Ecom", "github_stars": 34, "hf_url": "https://huggingface.co/papers/2611.30662", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u89c4\u6a21\u8986\u76d60.8B\u7a20\u5bc6\u81f335B MoE\uff0c\u540e\u8005\u6fc0\u6d3b3B\u53c2\u6570", "\u8bc4\u6d4b\u542b28\u9879\u7535\u5546\u57fa\u51c6\u30018\u7c7b\u4e1a\u52a1\u573a\u666f\u53ca64\u9879\u901a\u7528\u57fa\u51c6", "\u5df2\u670d\u52a1\u5fae\u4fe1\u6570\u767e\u4e2a\u751f\u4ea7\u573a\u666f\uff0c\u65e5\u8bf7\u6c42\u91cf\u8fbe\u5341\u4ebf\u7ea7"], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u7535\u5b50\u5546\u52a1", "\u9886\u57df\u9002\u914d", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2611.30662v1", "published_at": "2026-11-23", "score": 0.564, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (53\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30662.png", "title": "WeMM-Ecom: Advancing Multimodal Content Understanding for WeChat E-Commerce", "tldr": "\u901a\u8fc7\u6e10\u8fdb\u5f0f\u7535\u5546\u8bad\u7ec3\u4e0e\u6df7\u5408\u601d\u8003\uff0c\u517c\u987e\u591a\u6a21\u6001\u4e1a\u52a1\u80fd\u529b\u548c\u901a\u7528\u6027\u80fd\u3002", "upvotes": 53, "what_it_is": "\u63a8\u51fa\u4e94\u79cd\u89c4\u6a21\u7684\u7535\u5546\u591a\u6a21\u6001\u6a21\u578b\uff0c\u4ee5\u4e24\u9636\u6bb5\u6301\u7eed\u9884\u8bad\u7ec3\u9010\u6b65\u63d0\u9ad8\u7535\u5546\u6570\u636e\u5360\u6bd4\uff0c\u518d\u7ed3\u5408\u540c\u7b56\u7565\u84b8\u998f\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u652f\u6301\u601d\u8003\u4e0e\u975e\u601d\u8003\u6a21\u5f0f\u3002", "why_notable": "35B\u7248\u672c\u5728\u7535\u5546\u8bc4\u6d4b\u4e2d\u8d85\u8fc7\u66f4\u5927\u5f00\u6e90\u6a21\u578b\uff0c\u5404\u89c4\u6a21\u901a\u7528\u6027\u80fd\u4e5f\u4f18\u4e8e\u5bf9\u5e94Qwen3.5\uff1b\u6743\u91cd\u4e0e\u4ee3\u7801\u5f00\u653e\uff0c\u5177\u5907\u5927\u89c4\u6a21\u843d\u5730\u9a8c\u8bc1\u3002"}, {"abstract": "Generative Pre-Training (GPT) represents a profound milestone in natural language processing, serving as the foundation for most of today\u0027s state-of-the-art large language models. By casting diverse understanding and generation problems into a shared token representation, GPT enables a single architecture and unified optimization loop to master heterogeneous tasks across massive corpora, giving rise to powerful foundation models for natural language. In contrast, 4D spatiotemporal vision lacks a common representational protocol: perception (such as depth and camera estimation) and generation are either handled by separate one-way pipelines or bolted together from unaligned single-modality spaces. In this work, we introduce WorldLatent, a framework that formulates a unified 4D latent space as a common protocol for both world perception and generation. Rather than relying on fragmented, task-specific models or stacked single-modality representations, our framework proposes a multimodal VAE architecture that compresses and fuses complex 4D visual appearance, geometry, and dynamics into a single structured latent representation. Within this formulation, perception and generation operate as complementary denoising processes over the same latent space, enabling one generative model to learn both capabilities simultaneously within a single training loop. Experiments across representative 4D benchmarks verify that our fused latent protocol achieves specialist-level zero-shot 4D perception, coherent 4D generation, and controllable editing from a single model. By demonstrating that diverse 4D tasks can be seamlessly unified under a shared representational protocol, our work provides a scalable foundation for general-purpose 4D spatial intelligence.", "arxiv_id": "2611.31209", "arxiv_url": "https://arxiv.org/abs/2611.31209", "authors": ["Jingxi Chen", "Yujia Chen", "Cornelia Fermuller", "Yiannis Aloimonos", "Wen-Sheng Chu", "Du Tran"], "brief": "WorldLatent\u7528\u591a\u6a21\u6001VAE\u5c06\u89c6\u89c9\u5916\u89c2\u3001\u51e0\u4f55\u548c\u52a8\u6001\u878d\u5408\u4e3a\u7ed3\u6784\u5316\u56db\u7ef4\u6f5c\u8868\u793a\uff0c\u518d\u628a\u611f\u77e5\u4e0e\u751f\u6210\u7edf\u4e00\u4e3a\u8be5\u7a7a\u95f4\u4e2d\u7684\u4e92\u8865\u53bb\u566a\u8fc7\u7a0b\uff0c\u5728\u540c\u4e00\u8bad\u7ec3\u5faa\u73af\u4e2d\u5b66\u4e60\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.31209", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u591a\u6a21\u6001VAE\u878d\u5408\u5916\u89c2\u3001\u51e0\u4f55\u4e0e\u52a8\u6001\u4fe1\u606f", "\u5171\u4eab\u6f5c\u7a7a\u95f4\u4e0e\u5355\u4e00\u8bad\u7ec3\u5faa\u73af\u7edf\u4e00\u611f\u77e5\u548c\u751f\u6210", "\u56db\u7ef4\u57fa\u51c6\u5b9e\u9a8c\u5c55\u793a\u4e13\u5bb6\u7ea7\u96f6\u6837\u672c\u611f\u77e5\u4e0e\u53ef\u63a7\u7f16\u8f91"], "keywords": ["\u65f6\u7a7a\u89c6\u89c9", "\u591a\u6a21\u6001\u5b66\u4e60", "\u751f\u6210\u6a21\u578b", "\u6f5c\u7a7a\u95f4"], "num_comments": 2, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2611.31209v1", "published_at": "2026-11-23", "score": 0.514, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31209.png", "title": "WorldLatent: A Unified 4D Latent Space for World Perception and Generation", "tldr": "\u901a\u8fc7\u5171\u4eab\u56db\u7ef4\u6f5c\u7a7a\u95f4\uff0c\u8ba9\u5355\u4e00\u751f\u6210\u6a21\u578b\u517c\u987e\u65f6\u7a7a\u611f\u77e5\u3001\u751f\u6210\u4e0e\u53ef\u63a7\u7f16\u8f91\u3002", "upvotes": 8, "what_it_is": "WorldLatent\u7528\u591a\u6a21\u6001VAE\u5c06\u89c6\u89c9\u5916\u89c2\u3001\u51e0\u4f55\u548c\u52a8\u6001\u878d\u5408\u4e3a\u7ed3\u6784\u5316\u56db\u7ef4\u6f5c\u8868\u793a\uff0c\u518d\u628a\u611f\u77e5\u4e0e\u751f\u6210\u7edf\u4e00\u4e3a\u8be5\u7a7a\u95f4\u4e2d\u7684\u4e92\u8865\u53bb\u566a\u8fc7\u7a0b\uff0c\u5728\u540c\u4e00\u8bad\u7ec3\u5faa\u73af\u4e2d\u5b66\u4e60\u3002", "why_notable": "\u5b83\u5c06\u56db\u7ef4\u611f\u77e5\u4e0e\u751f\u6210\u4ece\u5206\u79bb\u6d41\u6c34\u7ebf\u8f6c\u4e3a\u5171\u4eab\u8868\u793a\u4e0a\u7684\u8054\u5408\u5b66\u4e60\uff0c\u4e3a\u6784\u5efa\u53ef\u6269\u5c55\u7684\u901a\u7528\u65f6\u7a7a\u89c6\u89c9\u6a21\u578b\u63d0\u4f9b\u4e86\u7edf\u4e00\u63a5\u53e3\u3002"}, {"abstract": "Recently, GPT-6 Astra demonstrates strong generalization in robot control, yet limited disclosure of its training leaves open how such capabilities can be reproduced. We introduce nanoAstra, an approach to training vision-language models (VLMs) for generalizable manipulation that combines semantic action modeling with capability-preserving supervised fine-tuning (CP-SFT). nanoAstra represents robot behavior as semantic steps composed of reusable, parameterized action primitives, guided by explicit progress descriptions. Meanwhile, CP-SFT uses an explicit robot-specific system prompt to constrain manipulation outputs to a structured action space, aiming to focus adaptation on robot-specific contexts and promote specialization while minimizing interference with broader pretrained capabilities. With this formulation, we train nanoAstra on more than 5,000 hours of robot data together with general VQA data. On RoboTwin 2.0\u0027s randomized benchmark, nanoAstra-9B achieves a 17.8% zero-shot success rate, substantially outperforming advanced VLA and WAM baselines as well as similarly sized VLMs. With inference faster than the corresponding motion execution on a single H20 GPU, our model supports action-chunk-like streaming execution that overlaps inference with motion, reducing the robot\u0027s idle time from 35.0% to 6.9%.", "arxiv_id": "2611.29338", "arxiv_url": "https://arxiv.org/abs/2611.29338", "authors": ["Meng-Hao Guo", "Yi Zhang", "Zhe-Han Mo", "Han-Zheng Wang", "Jia-Jun Wang", "Xin-Sheng Chen", "Jiaxi Song", "Yi-Xuan Deng", "Jia-Ning Li", "Xuanyu Chu", "Hengrui Zhang", "Huan-ang Gao", "Yongming Rao", "Shi-Min Hu"], "brief": "nanoAstra\u5c06\u673a\u5668\u4eba\u884c\u4e3a\u62c6\u4e3a\u5e26\u8fdb\u5ea6\u63cf\u8ff0\u7684\u53c2\u6570\u5316\u52a8\u4f5c\u539f\u8bed\uff0c\u518d\u7528CP-SFT\u53ca\u673a\u5668\u4eba\u4e13\u5c5e\u7cfb\u7edf\u63d0\u793a\u7ea6\u675f\u8f93\u51fa\uff0c\u517c\u987e\u64cd\u63a7\u9002\u914d\u4e0e\u9884\u8bad\u7ec3\u80fd\u529b\u4fdd\u7559\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.29338", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bad\u7ec3\u7ed3\u5408\u8d85\u8fc75000\u5c0f\u65f6\u673a\u5668\u4eba\u6570\u636e\u4e0e\u901a\u7528VQA\u6570\u636e", "nanoAstra-9B\u5728RoboTwin 2.0\u96f6\u6837\u672c\u6210\u529f\u7387\u4e3a17.8%", "\u5355\u5361H20\u6d41\u5f0f\u6267\u884c\u5c06\u673a\u5668\u4eba\u7a7a\u95f2\u5360\u6bd4\u4ece35.0%\u964d\u81f36.9%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba\u64cd\u63a7", "\u76d1\u7763\u5fae\u8c03", "\u96f6\u6837\u672c\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2611.29338v1", "published_at": "2026-11-22", "score": 0.498, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (53\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.29338.png", "title": "A Glimpse of Training VLMs as Foundation Models for Robotic Manipulation", "tldr": "\u4ee5\u8bed\u4e49\u52a8\u4f5c\u548c\u80fd\u529b\u4fdd\u7559\u5fae\u8c03\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u63d0\u5347\u673a\u5668\u4eba\u6cdb\u5316\u4e0e\u6267\u884c\u6548\u7387\u3002", "upvotes": 53, "what_it_is": "nanoAstra\u5c06\u673a\u5668\u4eba\u884c\u4e3a\u62c6\u4e3a\u5e26\u8fdb\u5ea6\u63cf\u8ff0\u7684\u53c2\u6570\u5316\u52a8\u4f5c\u539f\u8bed\uff0c\u518d\u7528CP-SFT\u53ca\u673a\u5668\u4eba\u4e13\u5c5e\u7cfb\u7edf\u63d0\u793a\u7ea6\u675f\u8f93\u51fa\uff0c\u517c\u987e\u64cd\u63a7\u9002\u914d\u4e0e\u9884\u8bad\u7ec3\u80fd\u529b\u4fdd\u7559\u3002", "why_notable": "\u63d0\u4f9b\u4e86\u5c06\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9002\u914d\u4e3a\u673a\u5668\u4eba\u64cd\u63a7\u6a21\u578b\u7684\u5177\u4f53\u8bad\u7ec3\u8def\u5f84\uff0c\u5e76\u5728\u968f\u673a\u5316\u6d4b\u8bd5\u4e2d\u517c\u987e\u96f6\u6837\u672c\u6cdb\u5316\u4e0e\u4f4e\u5ef6\u8fdf\u6267\u884c\u3002"}, {"abstract": "Interactive intelligence requires agents to act on observations and adapt to the consequences of actions. Studying these abilities calls for diverse, challenging tasks under controlled conditions. We introduce GameDojo, a controllable interactive gameplay benchmark of 120 boss encounters across 20 games for evaluating model capabilities, learning algorithms, and agent harnesses. Coding agents reconstruct the environments and write gameplay scripts, producing GameDojo-Data with 600 hours of gameplay trajectories. Experiments reveal substantial challenges for frontier models, especially in real-time interaction. Training on GameDojo-Data brings GameDojo-4B to frontier performance, with the strongest real-time performance. We also find joint training improves individual tasks, and learned policies transfer across bosses. Together, these findings establish GameDojo as a challenging and valuable interactive gameplay benchmark for the community. Our project page is at https://gamedojo-benchmark.github.io/ , and our code is at https://github.com/THUSI-Lab/GameDojo .", "arxiv_id": "2611.30771", "arxiv_url": "https://arxiv.org/abs/2611.30771", "authors": ["Kuan Zhang", "Zhihao Yang", "Yukun Chen", "Xingyilang Yin", "Mingyu Ouyang", "Yue Su", "Xiangnan Wu", "Jiaming Li", "Longze Chen", "Run Luo", "Zirong Chen", "Lu Wang", "Yiming Li"], "brief": "\u6784\u5efa\u53ef\u63a7\u7684\u4ea4\u4e92\u6e38\u620f\u57fa\u51c6\uff0c\u8986\u76d620\u6b3e\u6e38\u620f\u7684120\u573a\u9996\u9886\u6218\u3002\u7f16\u7801\u667a\u80fd\u4f53\u91cd\u5efa\u73af\u5883\u5e76\u7f16\u5199\u6e38\u620f\u811a\u672c\uff0c\u751f\u6210\u8f68\u8ff9\u6570\u636e\uff0c\u7528\u4e8e\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u5b9e\u65f6\u51b3\u7b56\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/THUSI-Lab/GameDojo", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.30771", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GameDojo-Data\u542b600\u5c0f\u65f6\u6e38\u620f\u8f68\u8ff9", "GameDojo-4B\u8fbe\u524d\u6cbf\u6c34\u5e73\uff0c\u5b9e\u65f6\u8868\u73b0\u6700\u5f3a", "\u8054\u5408\u8bad\u7ec3\u63d0\u5347\u5355\u4efb\u52a1\u8868\u73b0\uff0c\u7b56\u7565\u53ef\u8de8\u9996\u9886\u8fc1\u79fb"], "keywords": ["\u4ea4\u4e92\u667a\u80fd\u4f53", "\u5b9e\u65f6\u51b3\u7b56", "\u6e38\u620f\u8bc4\u6d4b", "\u7b56\u7565\u8fc1\u79fb"], "num_comments": 1, "on_hf": true, "organization": "Tsinghua Spatial Intelligence Lab", "pdf_url": "https://arxiv.org/pdf/2611.30771v1", "published_at": "2026-11-23", "score": 0.493, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30771.png", "title": "GameDojo: Benchmarking Real-Time Interactive Agents in Video Games", "tldr": "\u4ee5\u8de8\u6e38\u620f\u9996\u9886\u6218\u8bc4\u6d4b\u5b9e\u65f6\u667a\u80fd\u4f53\uff0c\u5e76\u7528\u6e38\u620f\u8f68\u8ff9\u8bad\u7ec3\u5c0f\u6a21\u578b\u8fbe\u5230\u524d\u6cbf\u6c34\u5e73\u3002", "upvotes": 7, "what_it_is": "\u6784\u5efa\u53ef\u63a7\u7684\u4ea4\u4e92\u6e38\u620f\u57fa\u51c6\uff0c\u8986\u76d620\u6b3e\u6e38\u620f\u7684120\u573a\u9996\u9886\u6218\u3002\u7f16\u7801\u667a\u80fd\u4f53\u91cd\u5efa\u73af\u5883\u5e76\u7f16\u5199\u6e38\u620f\u811a\u672c\uff0c\u751f\u6210\u8f68\u8ff9\u6570\u636e\uff0c\u7528\u4e8e\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u5b9e\u65f6\u51b3\u7b56\u6a21\u578b\u3002", "why_notable": "\u5c06\u5b9e\u65f6\u4ea4\u4e92\u80fd\u529b\u7f6e\u4e8e\u591a\u6837\u4e14\u53ef\u63a7\u7684\u4efb\u52a1\u4e2d\u68c0\u9a8c\uff0c\u63ed\u793a\u524d\u6cbf\u6a21\u578b\u7684\u77ed\u677f\uff0c\u4e5f\u5c55\u793a\u4e13\u95e8\u8f68\u8ff9\u8bad\u7ec3\u4e0e\u8de8\u4efb\u52a1\u5b66\u4e60\u7684\u4ef7\u503c\u3002"}, {"abstract": "Looped Transformers iterate a shared block of layers to increase computation without adding parameters, offering stronger performance and test-time scaling. However, this power has so far required training from scratch and yielded only modest gains for LLMs. Finetuning existing models into loops is far cheaper, yet also brings only marginal gains over SFT. We propose LoopRes, an effective, scalable, and simple approach that turns loops into significant and consistent gains for pretrained LLMs. Building on Attention Residuals, LoopRes lets each looped layer attend directly to the outputs of earlier loops. Since these outputs are iterates of the same layers and become harder to tell apart, we give each a trainable loop-aware key that encodes its structural identity. Attending to all earlier loops also lets layers skip intermediate ones, so we restrict each layer to a residual window of the latest W loops, forcing every loop to build incrementally on recent ones. Across 6 pretrained LLMs from 3 model families and 9 benchmarks, LoopRes delivers significant and consistent gains: at 2x compute, it improves Qwen3-1.7B-Base by 29.1% over SFT, more than doubling the gain of the state-of-the-art baseline. The gains hold on larger models up to 30B and across all three families. More importantly, from 1.7B to 8B, LoopRes scales more steeply than SFT as compute grows, reaching a higher ceiling while needing less compute on long outputs. These results establish LoopRes as an effective looping approach, delivering both better performance and better test-time scaling.", "arxiv_id": "2611.31094", "arxiv_url": "https://arxiv.org/abs/2611.31094", "authors": ["Xuanlei Zhao", "Hailun Xu", "Kai Wang", "Yang Luo", "Yingxuan Ren", "Zirui Zhu", "Yuxuan Lou", "Kun Xu", "Yan Wang", "Kanchan Sarkar", "Yang You"], "brief": "\u5c06\u9884\u8bad\u7ec3\u5927\u6a21\u578b\u5fae\u8c03\u4e3a\u5171\u4eab\u5c42\u5757\u7684\u5faa\u73af\u67b6\u6784\uff0c\u8ba9\u5404\u5c42\u6ce8\u610f\u6b64\u524d\u5faa\u73af\u7684\u8f93\u51fa\u3002\u901a\u8fc7\u53ef\u8bad\u7ec3\u7684\u5faa\u73af\u8eab\u4efd\u952e\u4e0e\u8fd1\u671f\u6b8b\u5dee\u7a97\u53e3\uff0c\u533a\u5206\u5faa\u73af\u5e76\u4fc3\u4f7f\u8ba1\u7b97\u9010\u6b65\u7d2f\u79ef\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/NUS-HPC-AI-Lab/LoopRes", "github_stars": 34, "hf_url": "https://huggingface.co/papers/2611.31094", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57fa\u4e8eAttention Residuals\uff0c\u5f15\u5165\u53ef\u8bad\u7ec3\u5faa\u73af\u8eab\u4efd\u952e", "\u6b8b\u5dee\u7a97\u53e3\u4ec5\u4fdd\u7559\u6700\u8fd1W\u8f6e\uff0c\u9650\u5236\u8df3\u8fc7\u4e2d\u95f4\u5faa\u73af", "\u8986\u76d66\u6a21\u578b\u30019\u57fa\u51c6\uff1b2\u500d\u8ba1\u7b97\u4e0b\u8f83SFT\u63d0\u534729.1%"], "keywords": ["\u5faa\u73af\u7f51\u7edc", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6b8b\u5dee\u8fde\u63a5", "\u63a8\u7406\u65f6\u6269\u5c55"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2611.31094v1", "published_at": "2026-11-23", "score": 0.489, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31094.png", "title": "Unlocking the Power of Loops in Pretrained LLMs with Loop Residuals", "tldr": "LoopRes\u901a\u8fc7\u8de8\u5faa\u73af\u6b8b\u5dee\u6539\u9020\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\uff0c\u63d0\u5347\u6027\u80fd\u4e0e\u63a8\u7406\u8ba1\u7b97\u6269\u5c55\u6027\u3002", "upvotes": 6, "what_it_is": "\u5c06\u9884\u8bad\u7ec3\u5927\u6a21\u578b\u5fae\u8c03\u4e3a\u5171\u4eab\u5c42\u5757\u7684\u5faa\u73af\u67b6\u6784\uff0c\u8ba9\u5404\u5c42\u6ce8\u610f\u6b64\u524d\u5faa\u73af\u7684\u8f93\u51fa\u3002\u901a\u8fc7\u53ef\u8bad\u7ec3\u7684\u5faa\u73af\u8eab\u4efd\u952e\u4e0e\u8fd1\u671f\u6b8b\u5dee\u7a97\u53e3\uff0c\u533a\u5206\u5faa\u73af\u5e76\u4fc3\u4f7f\u8ba1\u7b97\u9010\u6b65\u7d2f\u79ef\u3002", "why_notable": "\u65e0\u9700\u4ece\u5934\u8bad\u7ec3\u5373\u53ef\u83b7\u5f97\u7a33\u5b9a\u7684\u5faa\u73af\u6536\u76ca\uff0c\u6548\u679c\u5ef6\u4f38\u81f330B\u6a21\u578b\uff1b\u8ba1\u7b97\u6269\u5c55\u66f2\u7ebf\u4f18\u4e8eSFT\uff0c\u4e3a\u590d\u7528\u9884\u8bad\u7ec3\u6a21\u578b\u63d0\u5347\u63a8\u7406\u80fd\u529b\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Robotic manipulation often requires remembering visual information that is no longer observable, such as the original location of an object. Existing approaches typically rely on full observation histories, which become redundant over long horizons, or text summaries, which may omit precise visual details. We study visual moment memory, the ability to retain such details from key moments for subsequent manipulation. To support this study, we introduce VMBench, a suite of long-horizon manipulation tasks requiring memory of spatial locations, visual appearances, and their associations. We further propose MomentMem, a hierarchical architecture in which a VLM-based memorizer selects keyframes and an executor predicts actions conditioned on the selected memories. This separation enables us to evaluate memory selection alongside closed-loop task success and to study memorizer generalization independently of the executor. On VMBench, MomentMem achieves 49.9% average success, outperforming the strongest evaluated baseline by 31.7 percentage points. Moreover, we find that the memorizer transfers well to unseen appearances zero-shot. It can also adapt to an unseen task with only a few memory annotations, reaching 43.7% success, close to the 44.3% obtained with full memory supervision. Further experiments show competitive performance on RMBench and improvements in real-robot manipulation. These results highlight the value of retaining sparse visual evidence for memory-dependent manipulation. Our code is available at https://github.com/PKU-VaLuE-Lab/MomentMem.", "arxiv_id": "2611.26745", "arxiv_url": "https://arxiv.org/abs/2611.26745", "authors": ["Guangyu Zhao", "Yongchang Zhang", "Ruizhang Jiang", "Zhihong Yu", "Yuhao Zhang", "Tao Wu", "Qimin Zhou", "Kunsong Shi", "Haoran Wen", "Zeyu Zhang", "Yin Li", "Kun Zhan", "Yiwu Zhong"], "brief": "\u63d0\u51fa\u89c6\u89c9\u65f6\u523b\u8bb0\u5fc6\u6846\u67b6\uff0c\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6311\u9009\u5173\u952e\u5e27\uff0c\u518d\u7531\u6267\u884c\u5668\u7ed3\u5408\u8bb0\u5fc6\u9884\u6d4b\u52a8\u4f5c\uff1b\u914d\u5957\u6784\u5efa\u957f\u7a0b\u64cd\u4f5c\u57fa\u51c6\uff0c\u68c0\u9a8c\u7a7a\u95f4\u3001\u5916\u89c2\u53ca\u5176\u5173\u8054\u8bb0\u5fc6\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/PKU-VaLuE-Lab/MomentMem", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.26745", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["MomentMem\u5206\u79bb\u5173\u952e\u5e27\u8bb0\u5fc6\u9009\u62e9\u4e0e\u52a8\u4f5c\u6267\u884c", "VMBench\u6210\u529f\u738749.9%\uff0c\u9886\u5148\u57fa\u7ebf31.7\u4e2a\u767e\u5206\u70b9", "\u65b0\u4efb\u52a1\u5c11\u91cf\u8bb0\u5fc6\u6807\u6ce8\u8fbe43.7%\uff0c\u5168\u76d1\u7763\u4e3a44.3%"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bb0\u5fc6", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 2, "on_hf": true, "organization": "PKU-VaLuE-Lab", "pdf_url": "https://arxiv.org/pdf/2611.26745v1", "published_at": "2026-11-19", "score": 0.485, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.26745.png", "title": "MomentMem: Memorizing Key Moments for Robot Manipulation", "tldr": "\u901a\u8fc7\u7b5b\u9009\u5173\u952e\u89c6\u89c9\u65f6\u523b\u800c\u975e\u4fdd\u5b58\u5b8c\u6574\u5386\u53f2\uff0c\u663e\u8457\u63d0\u5347\u673a\u5668\u4eba\u957f\u7a0b\u64cd\u4f5c\u6210\u529f\u7387\u3002", "upvotes": 5, "what_it_is": "\u63d0\u51fa\u89c6\u89c9\u65f6\u523b\u8bb0\u5fc6\u6846\u67b6\uff0c\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6311\u9009\u5173\u952e\u5e27\uff0c\u518d\u7531\u6267\u884c\u5668\u7ed3\u5408\u8bb0\u5fc6\u9884\u6d4b\u52a8\u4f5c\uff1b\u914d\u5957\u6784\u5efa\u957f\u7a0b\u64cd\u4f5c\u57fa\u51c6\uff0c\u68c0\u9a8c\u7a7a\u95f4\u3001\u5916\u89c2\u53ca\u5176\u5173\u8054\u8bb0\u5fc6\u3002", "why_notable": "\u8868\u660e\u7a00\u758f\u89c6\u89c9\u8bc1\u636e\u80fd\u6709\u6548\u652f\u6491\u8bb0\u5fc6\u4f9d\u8d56\u64cd\u4f5c\uff0c\u4e14\u8bb0\u5fc6\u6a21\u5757\u53ef\u72ec\u7acb\u8bc4\u4f30\u4e0e\u8fc1\u79fb\uff0c\u5728\u672a\u89c1\u5916\u89c2\u548c\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u5c55\u73b0\u6cdb\u5316\u4ef7\u503c\u3002"}, {"abstract": "Depth-recurrent (Looped) models raise effective depth by applying a shared stack of blocks several times. Scaling them usually requires pipeline parallelism, but commonly used interleaved 1F1B is drawn for an acyclic stage graph in which each micro-batch enters each stage once. Once that stack is split across stages, the same stage is visited several times on one micro-batch and later stages feed earlier ones: native 1F1B has no slot for the extra visit, cannot rank a first iteration against a second, and its neighbour-only send/receive order has no back edge to the first stage, so the arrangement stalls or fires out of order. We present Loop-PP, which rebuilds both the timetable and the communication for this cyclic layout. It schedules different iterations of the same stage separately, specializes a 1F1B skeleton into a globally consistent order over those visits, and emits a static instruction stream per rank that separates posting from waiting so communication overlaps local compute. Loop-PP is bit-identical to a single-stage reference. On 8B-60B MoE models, it lowers peak memory by as much as 32.8\\%, and with compute budget fixed, the best observed throughput rises by 12.7\\%.", "arxiv_id": "2611.30581", "arxiv_url": "https://arxiv.org/abs/2611.30581", "authors": ["Yunjia Xi", "Jiarui Qin", "Di Yin", "Xing Sun"], "brief": "Loop-PP\u9762\u5411\u91cd\u590d\u8c03\u7528\u5171\u4eab\u6a21\u5757\u7684\u6df1\u5ea6\u5faa\u73af\u6a21\u578b\uff0c\u5c06\u540c\u4e00\u9636\u6bb5\u7684\u4e0d\u540c\u8fed\u4ee3\u72ec\u7acb\u8c03\u5ea6\u3002\u5b83\u91cd\u67841F1B\u6267\u884c\u987a\u5e8f\u4e0e\u901a\u4fe1\u6307\u4ee4\uff0c\u8ba9\u5faa\u73af\u4f9d\u8d56\u4e0b\u7684\u901a\u4fe1\u4e0e\u8ba1\u7b97\u91cd\u53e0\u3002", "categories": ["cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30581", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6309\u8fed\u4ee3\u533a\u5206\u9636\u6bb5\u8bbf\u95ee\uff0c\u6784\u5efa\u5168\u5c40\u4e00\u81f4\u76841F1B\u987a\u5e8f", "\u6bcf\u4e2a\u8fdb\u7a0b\u751f\u6210\u9759\u6001\u6307\u4ee4\u6d41\uff0c\u5206\u79bb\u901a\u4fe1\u53d1\u8d77\u4e0e\u7b49\u5f85", "8B\u201360B MoE\u5cf0\u503c\u663e\u5b58\u6700\u591a\u964d32.8%\uff0c\u541e\u5410\u589e12.7%"], "keywords": ["\u6d41\u6c34\u7ebf\u5e76\u884c", "\u6df1\u5ea6\u5faa\u73af\u6a21\u578b", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u6df7\u5408\u4e13\u5bb6\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2611.30581v1", "published_at": "2026-11-23", "score": 0.464, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30581.png", "title": "A Pipeline-Parallel System for Depth-Recurrent Models", "tldr": "Loop-PP\u91cd\u6784\u5faa\u73af\u6a21\u578b\u6d41\u6c34\u7ebf\u8c03\u5ea6\uff0c\u964d\u4f4e\u663e\u5b58\u5e76\u63d0\u5347\u56fa\u5b9a\u8ba1\u7b97\u9884\u7b97\u4e0b\u7684\u541e\u5410\u3002", "upvotes": 8, "what_it_is": "Loop-PP\u9762\u5411\u91cd\u590d\u8c03\u7528\u5171\u4eab\u6a21\u5757\u7684\u6df1\u5ea6\u5faa\u73af\u6a21\u578b\uff0c\u5c06\u540c\u4e00\u9636\u6bb5\u7684\u4e0d\u540c\u8fed\u4ee3\u72ec\u7acb\u8c03\u5ea6\u3002\u5b83\u91cd\u67841F1B\u6267\u884c\u987a\u5e8f\u4e0e\u901a\u4fe1\u6307\u4ee4\uff0c\u8ba9\u5faa\u73af\u4f9d\u8d56\u4e0b\u7684\u901a\u4fe1\u4e0e\u8ba1\u7b97\u91cd\u53e0\u3002", "why_notable": "\u5b83\u89e3\u51b3\u4e86\u4f20\u7edf\u6d41\u6c34\u7ebf\u8c03\u5ea6\u65e0\u6cd5\u5904\u7406\u5faa\u73af\u56de\u8fb9\u7684\u95ee\u9898\uff0c\u5e76\u4e0e\u5355\u9636\u6bb5\u53c2\u8003\u5b9e\u73b0\u9010\u4f4d\u4e00\u81f4\uff0c\u4e3a\u6df1\u5ea6\u5faa\u73af\u6a21\u578b\u7684\u5927\u89c4\u6a21\u8bad\u7ec3\u63d0\u4f9b\u53ef\u7528\u8def\u5f84\u3002"}, {"abstract": "Beam is a sparse Mixture-of-Experts (MoE) model with 501.3B total parameters and 23.4B active parameters, specifically built and optimized for coding, reasoning, and agentic workloads. Beam delivers frontier level reasoning, while requiring 3-4x less inference compute than many models of its class. Pretrained on 23.8T diverse, curated, high-quality tokens, Beam features a 1M-token context window achieved through a novel two-stage midtraining phase, built on verifiable, correctness-anchored data. Post-training leveraged a large-scale, fully asynchronous reinforcement learning (RL) campaign across 10.5K GB300 GPUs, generating over 100M rollouts over 4 weeks of training. We believe this is one of the largest scale RL runs conducted by any open lab to date. Across our evaluation suite, capabilities continued to improve as we increased RL compute, with no sign of a plateau. Supported by deep hardware-model co-design, FP8/NVFP4 quantization, and a 1.93B-parameter speculative decoding drafter (DFlash 2), Beam maximizes serving throughput with efficient, flexible deployment. Averaged across conversation turns and harm categories, Beam refuses or pivots on 88.9% of harmful requests while complying with 81.5% of harmless requests, achieving the highest refusal/pivot rate on harmful requests among open-weight models on the Pareto frontier.", "arxiv_id": "2611.26358", "arxiv_url": "https://arxiv.org/abs/2611.26358", "authors": ["Reflection Team", "Adam Abdulhamid", "Osama Abuelsorour", "Yasmin Alameddine", "Carlo Alfano", "Duarte Alves", "Brandon Amos", "Selvaraj Anandaraj", "Arseni Anisimovich", "George Antoniadis", "Ioannis Antonoglou", "Sheila Babayan", "Neeraj Bahl", "M\u00e4rt Bakler", "Vidhisha Balachandran", "Cameron Banks", "Thibaut Barroyer", "Navroop Bath", "Irwan Bello", "Jeremy Berman", "Fernanda Bernaldo", "Mrityunjay Bhadauria", "Sanyam Bhutani", "Tolga Bolukbasi", "Anudhyan Boral", "Joseph Brennan", "Ethan Brooks", "Sam Buchanan", "Anton Bulyenov", "John Cai", "Catherine Cang", "Eason Chan", "Elijah Chanakira", "Nathan Chandrasekaran", "Hao Chen", "Hong-You Chen", "Jeffrey Chen", "Saurav Chhatrapati", "Ting-Rui Chiang", "Brian Tiger Chow", "Aakanksha Chowdhery", "Timothy Chung", "Rob Claire", "John D. Co-Reyes", "Anthony Conte", "Eduardo Coronado-Montoya", "Julien Crozon", "Drew Csillag", "Joe Cummings", "Jeff Da", "Samira Daruki", "Tim Dawson", "Charlie Deck", "Arash Delijani", "Ousmane Dia", "Randy Dodgen", "Ryan Douglas", "Omar El-Kishky", "Ben Ellis", "Gamaleldin Elsayed", "Simon Fan", "Patrick Fernandes", "Gabriel Ferns", "Nick Fram", "Ankush Garg", "Florent Gbelidji", "Iaroslav Geraskin", "Behrooz Ghorbani", "Ivan Glushkov", "Neil Gollapudi", "Scott Goodfriend", "Yoni Gozlan", "Christopher Grimm", "Suriya Gunas Innata-0-Agent, coordinates long-horizon execution through memory, verification, and recovery. A co-design protocol is further proposed to align model training with agent execution and leverage validated experiences to support subsequent adaptation and model improvement. Extensive evaluations demonstrate strong embodied capabilities across understanding, world prediction, and robotic manipulation. Innata-0 represents our first step toward physical intelligence, and we see it as the beginning of a much longer journey.", "arxiv_id": "2611.30254", "arxiv_url": "https://arxiv.org/abs/2611.30254", "authors": ["Innata Team", "Yu Bai", "Ziyi Bai", "Yuxuan Cai", "Chenrui He", "Wenhao Li", "Zhe Lin", "Heng Wang", "Hai Yuan", "Zhiwei Yu", "Yuanhang Zhang", "Luyou Chen", "Tiezhu Gao", "Zheng Geng", "Jinbang Guo", "Dongxu Han", "Diqi He", "B\u00f6rje F. Karlsson", "Jintao Li", "Zhiyu Li", "Xiongkun Linghu", "Guang Liu", "You Liu", "Zhen Luo", "Mengsi Lyu", "Yufeng Lyu", "Zheng Lyu", "Quanyue Ma", "Chunlei Men", "Ziqiang Ni", "Tengfei Pan", "Yijun Shen", "Liang Sun", "Shaoxuan Xie", "Xiang Yang", "Guocai Yao", "Hongjun Zhang", "Yingli Zhao", "Yonghua Lin", "Zhongyuan Wang", "Huan Yang"], "brief": "\u63d0\u51fa\u539f\u751f\u5177\u8eab\u7cfb\u7edf\uff0c\u5c06\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u8054\u5408\u8bbe\u8ba1\uff1a\u6a21\u578b\u7edf\u4e00\u7406\u89e3\u3001\u9884\u6d4b\u548c\u52a8\u4f5c\u751f\u6210\uff0c\u667a\u80fd\u4f53\u8d1f\u8d23\u8bb0\u5fc6\u3001\u9a8c\u8bc1\u4e0e\u6062\u590d\uff0c\u5e76\u4ee5\u534f\u540c\u534f\u8bae\u8fde\u63a5\u8bad\u7ec3\u548c\u6267\u884c\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.30254", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["Innata-0-WAM\u91c7\u7528\u4e09\u5854Mixture-of-Transformers", "Innata-0-Agent\u4ee5\u8bb0\u5fc6\u3001\u9a8c\u8bc1\u548c\u6062\u590d\u7ec4\u7ec7\u957f\u7a0b\u6267\u884c", "\u534f\u540c\u8bbe\u8ba1\u urce runtime in which LLM-generated agents are long-lived, supervised actors: a planner turns a chat request into Python, compiles it into a new actor at runtime, and a supervisor restarts that actor alone, with its state intact, when it crashes. All coordination rides on MQTT, so agents can be spawned on, and live-migrated between, edge nodes such as a Raspberry Pi, and every internal event is a topic external systems can subscribe to. The recorded demo builds a camera-to-lamp automation from one chat request, adds a second agent that is auto-wired to the first by topic and carries a deliberate division-by-zero, watches that agent repair its own code without losing its count, then deploys a fresh Raspberry Pi node and live-migrates the agent onto it, in under four minutes of wall-clock time and \\$0.13 of model usage. This extended version adds what the two-page demonstration paper could not: the Wiring view of the topic graph, Wactorz as a library for hand-written agents, how trained models are stored, sent to nodes and replaced, the security model, and the system\u0027s limitations.", "arxiv_id": "2611.29619", "arxiv_url": "https://arxiv.org/abs/2611.29619", "authors": ["Panagiotis Kasnesis", "Lazaros Toumanidis", "Amalia Contiero Syropoulou", "Christos Chatzigeorgiou"], "brief": "Wactorz\u662f\u5f00\u6e90\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\uff0c\u5c06\u804a\u5929\u8bf7\u6c42\u751f\u6210\u7684Python\u4ee3\u7801\u52a8\u6001\u7f16\u8bd1\u4e3a\u53d7\u76d1\u7763\u7684\u957f\u671fActor\u3002\u501f\u52a9MQTT\u534f\u8c03\u8fb9\u7f18\u8282\u70b9\uff0c\u652f\u6301\u6545\u969c\u91cd\u542f\u3001\u4ee3\u7801\u81ea\u4fee\u4e0e\u5728\u7ebf\u8fc1\u79fb\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/waldiez/wactorz", "github_stars": 23, "hf_url": "https://huggingface.co/papers/2611.29619", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u76d1\u7763\u5668\u5355\u72ec\u91cd\u542f\u6545\u969cActor\uff0c\u5e76\u4fdd\u7559\u5176\u72b6\u6001 large-scale reasoning data or existing diffusion RL methods. We attribute these failures to the conventional video training paradigm, which treats a solution as a fixed-length clip rather than a chain of decisions. We present ViDecide, a decision-centric framework that trains video diffusion models to predict state transitions causally and decide when to stop, with a decision-focused training schedule. We further propose Corrective Fine-tuning (CFT), which corrects failed decisions by mapping their noise to the model\u0027s own successful continuations, achieving stable improvement without policy-gradient optimization. Across abstract games, planning tasks, and a new benchmark of multi-step robot planning, ViDecide achieves an average strict success rate of 83.8%, far above 23.3% for standard fine-tuning and 67.8% for the strongest prior method, and generalizes to larger puzzles and unseen layouts. Our framework therefore unlocks greater potential for video generation models as reliable reasoners and planners in the visual world. Project page: https://kevin-thu.github.io/ViDecide.", "arxiv_id": "2611.26389", "arxiv_url": "https://arxiv.org/abs/2611.26389", "authors": ["Kaiwen Zhang", "Yiming Gao", "Zeqi Xiao", "Xintao Wang", "Pengfei Wan", "Kun Gai", "Xingang Pan"], "brief": "ViDecide\u4e0d\u518d\u628a\u89e3\u6cd5\u5f53\u4f5c\u5b9a\u957f\u89c6\u9891\uff0c\u800c\u662f\u8bad\u7ec3\u6a21\u578b\u56e0\u679c\u9884\u6d4b\u72b6\u6001\u8f6c\u79fb\u5e76\u81ea\u4e3b\u505c\u6b62\u3002\u518d\u7528\u7ea0\u9519\u5fae\u8c03\uff0c\u5c06\u5931\u8d25\u51b3\u7b56\u7684\u566a\u58f0\u6620\u5c04\u5230\u6a21\u578b\u81ea\u8eab\u7684\u6210\u529f\u7eed\u63a5\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Kevin-thu/ViDecide", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.26389", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u51b3\u7b56\u4e2d\u5fc3\u8bad\u7ec3\uff1a\u56e0\u679c\u9884\u6d4b\u72b6\u6001\u8f6c\u79fb\u5e76\u5b66\u4e6 is added, and can erode capabilities outside the target domains. We propose Composable Soft-Prompt Distillation (CSPD), which keeps the pre-RL model frozen, distills each RL expert independently into a soft prompt, and composes experts by concatenating their prompts without joint training. A single soft prompt suffices to distill an RL expert, recovering at least 90% of the teacher\u0027s gain in 22 of 23 math, code, and agent settings. Independently trained prompts compose well. In a multi-expert setting, the average rises with every expert added, and the full composition matches MOPD (67.83 vs. 67.79). The composition generalizes best across six held-out benchmarks. Input-space adaptation adds little serving overhead, keeping throughput within 1.5% of the unadapted backbone and reaching 2.40x that of rank-4 LoRA. These results point toward continual post-training on a fixed backbone.", "arxiv_id": "2611.27376", "arxiv_url": "https://arxiv.org/abs/2611.27376", "authors": ["Zhen Zhang", "Changyi Yang", "Xuehai He", "Chengzhi Liu", "Yutong Yin", "Ziyue Liu", "Zhuoran Yin", "Yangmin Li", "Zhihan Liu", "Jisen Li", "Mingyu Jin", "Chuhan Li", "Zhaotian Weng", "Ruoyu He", "Wenyao Gao", "Jiaxin Deng", "Chenwei Wu", "Hui Shen", "Wenhao Chai", "Chenyang Zhao", "Zhuofan Ying", "Kieran Liu", "Andrew Chen", "Pony Ma", "Zhaoran Wang", "Alkesh Patel", "Zhe Gan", "Xin Eric Wang"], "brief": "CSPD\u51bb\u7ed3\u5f3a\u5316\u5b66\u4e60\u524d\u7684\u9aa8\u5e72\u6a21\u578b\uff0c\u5c06\u6bcf\u4e2a\u4e13\u5bb6\u72ec\u7acb\u84b8\u998f\u6210\u8f6f\u63d0\u793a\u3002\u65b0\u589e\u4e13\u5bb6\u53ea\u9700\u62fc\u63a5\u63d0\u793a\uff0c\u65e0\u987b\u8054\u5408\u8bad\u7ec3\u6216\u91cd\u65b0\u6574\u5408\u6a21\u578b\u6743\u91cd\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/UCSB-AI/CSPD", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2611.27376", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["23\u4e2a\u6570\u5b66\u3001\u4ee3\u7801\u53ca\u667a\u80fd\u4f53\u8bbe\u7f6e\u4e2d\uff0c22\u4e2a\u6062\u590d\u81f3\u5c1190%\u7684\u6559\u5e08\u589e\u76ca", "\u591a\u4e13\u5bb6\u7ec4\u5408\u5f97\u520667.83\uff0c\u4e0eMOPD\u768467.79\u76f8\u5f53", "\u541e\u5410\u91cf\u8ddd\u539f\u9aa8\u5e72\u4e0d\u8d85\u8fc71.5%\uff0c\u8fbe\u79e94 LoRA\u76842.40\u500d"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u8f6f\u63d0\u793a", "\u6301\u7eed\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "UCSB AI Group", "pdf_url": "https://arxiv.org/pdf/2611.27376v2", "published_at": "2026-11-20", "score": 0.317, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.27376.png", "title": "Composable Soft-Prompt Distillation of RL Experts: Toward Continual Post-Training", "tldr": "\u5c06\u5f3a\u5316\u5b66\u4e60\u4e13\u5bb6\u72ec\u7acb\u84b8\u998f\u4e3a\u53ef\u62fc\u63a5\u8f6f\u63d0\u793a\uff0c\u5b9e\u73b0\u51bb\u7ed3\u9aa8\u5e72\u4e0a\u7684\u6301\u7eed\u80fd\u529b\u6574\u5408\u3002", "upvotes": 30, "what_it_is": "CSPD\u51bb\u7ed3\u5f3a\u5316\u5b66\u4e60\u524d\u7684\u9aa8\u5e72\u6a21\u578b\uff0c\u5c06\u6bcf\u4e2a\u4e13\u5bb6\u72ec\u7acb\u84b8\u998f\u6210\u8f6f\u63d0\u793a\u3002\u65b0\u589e\u4e13\u5bb6\u53ea\u9700\u62fc\u63a5\u63d0\u793a\uff0c\u65e0\u987b\u8054\u5408\u8bad\u7ec3\u6216\u91cd\u65b0\u6574\u5408\u6a21\u578b\u6743\u91cd\u3002", "why_notable": "\u628a\u4e13\u5bb6\u80fd\u529b\u6574\u5408\u4ece\u53cd\u590d\u66f4\u65b0\u6743\u91cd\u53d8\u4e3a\u589e\u91cf\u62fc\u63a5\u63d0\u793a\uff0c\u4e3a\u6301\u7eed\u540e\u8bad\u7ec3\u63d0\u4f9b\u4f4e\u5f00\u9500\u8def\u5f84\uff1b\u7ec4\u5408\u5728\u516d\u4e2a\u7559\u51fa\u57fa\u51c6\u4e0a\u6cdb\u5316\u6700\u4f73\u3002"}, {"abstract": "Foundation models can reason about complex physical tasks, yet translating this intelligence into reliable robot execution remains challenging. We argue that a critical, often overlooked factor is the robot-use interface (RUI), which determines how agents express and execute physical actions. To systematically study its impact, we introduce RUIBench, comprising 30 manipulation tasks across five suites spanning world knowledge, in-context learning, discovery, dynamic interaction, and contact-rich manipulation. We further develop RUIKit, a unified framework that crosses six action abstractions with two interaction forms, yielding 13 interfaces under shared perception and control. In simulation, changing only the RUI shifts a frontier agent\u0027s success rate from 45% to 81%, and that of a fine-tuned 4B model from 13% to 47%. Our analysis reveals that effective interfaces reduce unnecessary decisions while preserving essential feedback, with their benefits shaped by agent behavior and physical uncertainty. We further uncover a verification gap, where agents frequently declare success despite observable failures, revealing the need for task-level verification beyond individual actions. Together, these findings establish RUI design as a critical factor in embodied agent reliability.", "arxiv_id": "2611.31115", "arxiv_url": "https://arxiv.org/abs/2611.31115", "authors": ["Yanzhe Chen", "Zhijun Cao", "Zechen Bai", "Wenzheng Zeng", "Kevin Yuchen Ma", "Yiqi Lin", "Guoqiang Liang", "Xiaokang Liu", "Ke Sun", "Kevin Qinghong Lin", "Mike Zheng Shou"], "brief": "\u63d0\u51fa\u673a\u5668\u4eba\u52a8\u4f5c\u63a5\u53e3\u8bc4\u6d4b\u57fa\u51c6RUIBench\u4e0e\u7edf\u4e00\u6846\u67b6RUIKit\uff0c\u5728\u5171\u4eab\u611f\u77e5\u548c\u63a7\u5236\u6761\u4ef6\u4e0b\u6bd4\u8f83\u4e0d\u540c\u63a5\u53e3\uff0c\u5206\u6790\u52a8\u4f5c\u62bd\u8c61\u4e0e\u4ea4\u4e92\u5f62\u5f0f\u5982\u4f55\u5f71\u54cd\u6267\u884c\u53ef\u9760\u6027\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.MM"], "github_repo": "https://github.com/showlab/RUIBench", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2611.31115", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RUIBench\u542b30\u9879\u64cd\u4f5c\u4efb\u52a1\uff0c\u8986\u76d65\u4e2a\u4efb\u52a1\u5957\u4ef6", "RUIKit\u7ec4\u54086\u79cd\u52a8\u4f5c\u62bd\u8c61\u4e0e2\u79cd\u4ea4\u4e92\u5f62\u5f0f\uff0c\u63d0\u4f9b13\u79cd\u63a5\u53e3", "\u4ec5\u66f4\u6362\u63a5\u53e3\uff0c\u524d\u6cbf\u667a\u80fd\u4f53\u6210\u529f\u7387\u4ece45%\u5347\u81f381%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u52a8\u4f5c\u63a5\u53e3", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 3, "on_hf": true, "organization": "Show Lab", "pdf_url": "https://arxiv.org/pdf/2611.31115v1", "published_at": "2026-11-23", "score": 0.316, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31115.png", "title": "RUIBench: What Makes a Good Robot-Use Interface?", "tldr": "\u673a\u5668\u4eba\u52a8\u4f5c\u63a5\u53e3\u663e\u8457\u5f71\u54cd\u667a\u80fd\u4f53\u6267\u884c\u6210\u529f\u7387\uff0c\u51cf\u5c11\u5197\u4f59\u51b3\u7b56\u5e76\u4fdd\u7559\u53cd\u9988\u662f\u5173\u952e\u3002", "upvotes": 22, "what_it_is": "\u63d0\u51fa\u673a\u5668\u4eba\u52a8\u4f5c\u63a5\u53e3\u8bc4\u6d4b\u57fa\u51c6RUIBench\u4e0e\u7edf\u4e00\u6846\u67b6RUIKit\uff0c\u5728\u5171\u4eab\u611f\u77e5\u548c\u63a7\u5236\u6761\u4ef6\u4e0b\u6bd4\u8f83\u4e0d\u540c\u63a5\u53e3\uff0c\u5206\u6790\u52a8\u4f5c\u62bd\u8c61\u4e0e\u4ea4\u4e92\u5f62\u5f0f\u5982\u4f55\u5f71\u54cd\u6267\u884c\u53ef\u9760\u6027\u3002", "why_notable": "\u5c06\u63a5\u53e3\u8bbe\u8ba1\u786e\u7acb\u4e3a\u5177\u8eab\u667a\u80fd\u53ef\u9760\u6027\u7684\u5173\u952e\u53d8\u91cf\uff0c\u5e76\u63ed\u793a\u667a\u80fd\u4f53\u5e38\u5728\u53ef\u89c2\u5bdf\u5931\u8d25\u540e\u8bef\u62a5\u6210\u529f\uff0c\u51f8\u663e\u4efb\u52a1\u7ea7\u9a8c\u8bc1\u7684\u5fc5\u8981\u6027\u3002"}, {"abstract": "Vision Banana showed that a closed image generator, instruction-tuned to paint perception outputs as RGB images, becomes a generalist vision model. Does this carry over to \\emph{open} generators, and if not, what fails? We answer with \\textbf{Open Vision Banana (OVB)}, an open framework that adapts the 7B diffusion generator of Qwen-Image-2.1 into one instruction-driven model for metric depth, semantic, instance, and referring segmentation, using a single shared low-rank adapter and public data. Each task is a \\emph{task contract} whose RGB encoder, instruction, and decoder share one specification and are checked before training. Studying 42 externally evaluated checkpoints from two 100k-update runs, six exact weight-space merges, and eight controlled shorter runs, we find that the gap to the closed system is specific and measurable. Geometry is learned early while absolute scale is not: median-aligned NYUv2 $\u03b4_1$ stays at 0.89--0.93 throughout training as unaligned $\u03b4_1$ wanders between 0.11 and 0.50. The scale is not committed by a single sample: a ten-seed ensemble lifts unaligned $\u03b4_1$ from 0.348 to 0.516 without retraining. Depth and 2D segmentation compete for the shared adapter, and weight merging moves along this trade-off without escaping it. Finally, lower validation flow loss comes with lower Cityscapes accuracy (Spearman $\u03c1\\approx-0.9$ between loss reduction and mIoU), so the loss cannot select checkpoints. We release code, contracts, training data, and all evaluation outputs.", "arxiv_id": "2611.28489", "arxiv_url": "https://arxiv.org/abs/2611.28489", "authors": ["Xu Lin", "Ruilin Yao", "Haoran Xu", "Zixiang Wang", "Ming Ma", "Yu Zhao", "Pu Miao", "Chonghan Liu"], "brief": "\u5c06Qwen-Image-2.1\u76847B\u6269\u6563\u751f\u6210\u5668\u9002\u914d\u4e3a\u6307\u4ee4\u9a71\u52a8\u611f\u77e5\u6a21\u578b\uff0c\u4ee5\u5171\u4eab\u4f4e\u79e9\u9002\u914d\u5668\u751f\u6210RGB\u7f16\u7801\u7684\u6df1\u5ea6\u4e0e\u5206\u5272\u7ed3\u679c\uff0c\u5e76\u7528\u4efb\u52a1\u5951\u7ea6\u7edf\u4e00\u7f16\u7801\u3001\u6307\u4ee4\u548c\u89e3\u7801\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/isLinXu/open-vision-banana", "github_stars": 23, "hf_url": "https://huggingface.co/papers/2611.28489", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["42\u4e2a\u5916\u90e8\u8bc4\u6d4b\u68c0\u67e5\u70b9\u663e\u793a\uff1a\u6df1\u5ea6\u51e0\u4f55\u65e9\u5b66\u4f1a\uff0c\u7edd\u5bf9\u5c3a\u5ea6\u4e0d\u7a33", "\u5341\u79cd\u5b50\u96c6\u6210\u5c06\u672a\u5bf9\u9f50\u6df1\u5ea6\u03b4\u2081\u4ece0.348\u63d0\u5347\u81f30.516", "\u6df1\u5ea6\u4e0e\u5206\u5272\u4e89\u7528\u9002\u914d\u5668\uff1b\u9a8c\u8bc1\u635f\u5931\u4e0b\u964d\u4e0emIoU\u8d1f\u76f8\u5173"], "keywords": ["\u751f\u6210\u5f0f\u611f\u77e5", "\u6df1\u5ea6\u4f30\u8ba1", "\u56fe\u50cf\u5206\u5272", "\u591a\u4efb\u52a1\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.28489v1", "published_at": "2026-11-21", "score": 0.308, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28489.png", "title": "Open Vision Banana: An Open Framework for Unified Visual Perception through Generation in RGB Space", "tldr": "\u7528\u5f00\u653e\u56fe\u50cf\u751f\u6210\u5668\u7edf\u4e00\u89c6\u89c9\u611f\u77e5\uff0c\u63ed\u793a\u6df1\u5ea6\u5c3a\u5ea6\u4e0d\u7a33\u3001\u4efb\u52a1\u7ade\u4e89\u4e0e\u635f\u5931\u5931\u771f\u3002", "upvotes": 16, "what_it_is": "\u5c06Qwen-Image-2.1\u76847B\u6269\u6563\u751f\u6210\u5668\u9002\u914d\u4e3a\u6307\u4ee4\u9a71\u52a8\u611f\u77e5\u6a21\u578b\uff0c\u4ee5\u5171\u4eab\u4f4e\u79e9\u9002\u914d\u5668\u751f\u6210RGB\u7f16\u7801\u7684\u6df1\u5ea6\u4e0e\u5206\u5272\u7ed3\u679c\uff0c\u5e76\u7528\u4efb\u52a1\u5951\u7ea6\u7edf\u4e00\u7f16\u7801\u3001\u6307\u4ee4\u548c\u89e3\u7801\u3002", "why_notable": "\u4ef7\u503c\u4e0d\u4ec5\u5728\u4e8e\u5f00\u653e\u7edf\u4e00\u611f\u77e5\u6846\u67b6\uff0c\u8fd8\u5728\u4e8e\u91cf\u5316\u4e86\u751f\u6210\u5f0f\u611f\u77e5\u7684\u5c3a\u5ea6\u4e0e\u4efb\u52a1\u51b2\u7a81\uff0c\u5e76\u63ed\u793a\u8bad\u7ec3\u635f\u5931\u65e0\u6cd5\u53ef\u9760\u9009\u62e9\u68c0\u67e5\u70b9\u3002"}, {"abstract": "Recent multimodal search agents use reasoning, vision, and live web search across many turns to answer questions beyond parametric knowledge by orchestrating a small library of hand-crafted search and visual tools. However, the library is laborious to create and maintain, and frozen when new query types, evidence formats, and failure modes are encountered in the wild. Human practitioners, by contrast, cope with insufficient tools by fashioning new ones from familiar parts and reusing them across tasks. Inspired by this, we propose ToolSmith, an automatic tool-generation framework that grows and reuses modules on top of a lean base tool library. We evaluate ToolSmith on three in-domain multimodal search benchmarks and ten out-of-domain benchmarks under a VLM-as-a-Judge protocol. ToolSmith consistently improves over the base library across deployed agents of varying scales, with larger backbones reaping greater gains, demonstrating the scalability of the approach. Our code and data are available at https://threesr.github.io/toolsmith/.", "arxiv_id": "2611.31198", "arxiv_url": "https://arxiv.org/abs/2611.31198", "authors": ["Rui Sun", "Junhua Huang", "Luca Zancato", "Md Mofijul Islam", "Kai-Wei Chang"], "brief": "ToolSmith\u5728\u7cbe\u7b80\u57fa\u7840\u5de5\u5177\u5e93\u4e4b\u4e0a\u81ea\u52a8\u751f\u6210\u53ef\u590d\u7528\u6a21\u5757\uff0c\u8ba9\u591a\u6a21\u6001\u641c\u7d22\u667a\u80fd\u4f53\u6269\u5c55\u5de5\u5177\u80fd\u529b\u3002\u6846\u67b6\u4ee5\u6301\u7eed\u79ef\u7d2f\u5de5\u5177\u66ff\u4ee3\u5b8c\u5168\u4f9d\u8d56\u4eba\u5de5\u7ef4\u62a4\u7684\u56fa\u5b9a\u5de5\u5177\u5e93\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV"], "github_repo": "https://github.com/uclanlp/OpenVLHarness", "github_stars": 597, "hf_url": "https://huggingface.co/papers/2611.31198", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["ToolSmith\u81ea\u52a8\u751f\u6210\u5e76\u590d\u7528\u5de5\u5177\u6a21\u5757", "\u8bc4\u6d4b\u8986\u76d63\u4e2a\u57df\u5185\u4e0e10\u4e2a\u57df\u5916\u57fa\u51c6", "\u91c7\u7528VLM\u88c1\u5224\u8bc4\u6d4b\uff0c\u5927\u9aa8\u5e72\u6a21\u578b\u6536\u76ca\u66f4\u9ad8"], "keywords": ["\u591a\u6a21\u6001\u641c\u7d22", "\u5de5\u5177\u751f\u6210", "\u667a\u80fd\u4f53", "\u5de5\u5177\u590d\u7528"], "num_comments": 2, "on_hf": true, "organization": "UCLA NLP", "pdf_url": "https://arxiv.org/pdf/2611.31198v1", "published_at": "2026-11-23", "score": 0.304, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.31198.png", "title": "ToolSmith: An Automatic Tool-Generation Framework for Multimodal Search Agents", "tldr": "\u8ba9\u591a\u6a21\u6001\u641c\u7d22\u667a\u80fd\u4f53\u81ea\u52a8\u751f\u6210\u5e76\u590d\u7528\u5de5\u5177\uff0c\u7a81\u7834\u624b\u5de5\u56fa\u5b9a\u5de5\u5177\u5e93\u7684\u9650\u5236\u3002", "upvotes": 12, "what_it_is": "ToolSmith\u5728\u7cbe\u7b80\u57fa\u7840\u5de5\u5177\u5e93\u4e4b\u4e0a\u81ea\u52a8\u751f\u6210\u53ef\u590d\u7528\u6a21\u5757\uff0c\u8ba9\u591a\u6a21\u6001\u641c\u7d22\u667a\u80fd\u4f53\u6269\u5c55\u5de5\u5177\u80fd\u529b\u3002\u6846\u67b6\u4ee5\u6301\u7eed\u79ef\u7d2f\u5de5\u5177\u66ff\u4ee3\u5b8c\u5168\u4f9d\u8d56\u4eba\u5de5\u7ef4\u62a4\u7684\u56fa\u5b9a\u5de5\u5177\u5e93\u3002", "why_notable": "\u5c06\u5de5\u5177\u6269\u5c55\u4ece\u4eba\u5de5\u7ef4\u62a4\u8f6c\u5411\u81ea\u52a8\u751f\u6210\uff0c\u5728\u4e0d\u540c\u89c4\u6a21\u667a\u80fd\u4f53\u4e0a\u5747\u83b7\u63d0\u5347\uff0c\u4e3a\u591a\u6a21\u6001\u641c\u7d22\u80fd\u529b\u7684\u6301\u7eed\u6269\u5c55\u63d0\u4f9b\u4e86\u53ef\u884c\u8def\u5f84\u3002"}, {"abstract": "Human demonstrations provide a rich source of bimanual dexterous skills, yet transferring them to robot hands remains challenging. Existing methods primarily optimize object trajectory tracking, often overlooking how human hands interact with the object. Even with accurate tracking, robots may contact incorrect object parts or slide their fingers, resulting in unstable manipulation. We present DexDuet, a framework that learns contact-preserving bimanual dexterity from a single human demonstration. DexDuet employs two interaction rewards to preserve human hand-object configurations and contacts. To enable coordinated manipulation, we factorize the bimanual policy into two weight-sharing per-hand policies that condition on each other\u0027s states. We further propose assisted reference-state initialization (A-RSI), an adaptive curriculum that adjusts object assistance and training starts across demonstration segments to overcome difficult manipulation phases. Across four benchmarks spanning three simulators and five robot embodiments, DexDuet improves object-tracking ADD-AUC by 11 to 41 points over the corresponding baselines while consistently achieving better contact preservation. Notably, among 122 paired runs with comparable object-tracking accuracy, DexDuet preserves the human\u0027s contacts better in 117 cases. Code and videos are available at https://rcl-robotics.github.io/Dexduet.io/", "arxiv_id": "2611.30495", "arxiv_url": "https://arxiv.org/abs/2611.30495", "authors": ["Haoran Zhang", "Haokai Ding", "Han Zhou", "Zuxing Lu", "Heng Zhang", "Xingxing Zuo"], "brief": "DexDuet\u7528\u4e24\u7c7b\u4ea4\u4e92\u5956\u52b1\u4fdd\u7559\u4eba\u7c7b\u624b\u7269\u6784\u578b\u4e0e\u63a5\u89e6\uff0c\u5c06\u53cc\u624b\u7b56\u7565\u62c6\u4e3a\u5171\u4eab\u6743\u91cd\u3001\u4e92\u76f8\u611f\u77e5\u72b6\u6001\u7684\u5355\u624b\u7b56\u7565\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u8f85\u52a9\u8bfe\u7a0b\u7a81\u7834\u96be\u64cd\u4f5c\u9636\u6bb5\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/HaoranZhangumich/DexDuet", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.30495", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["A-RSI\u81ea\u9002\u5e94\u8c03\u6574\u7269\u4f53\u8f85\u52a9\u4e0e\u793a\u8303\u7247\u6bb5\u8bad\u7ec3\u8d77\u70b9", "\u8986\u76d64\u4e2a\u57fa\u51c6\u30013\u79cd\u6a21\u62df\u5668\u548c5\u79cd\u673a\u5668\u4eba\u5f62\u6001", "ADD-AUC\u63d0\u534711\u81f341\u70b9\uff1b122\u7ec4\u4e2d117\u7ec4\u63a5\u89e6\u66f4\u4f18"], "keywords": ["\u7075\u5de7\u64cd\u4f5c", "\u53cc\u624b\u534f\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u63a5\u89e6\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2611.30495v1", "published_at": "2026-11-23", "score": 0.297, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.30495.png", "title": "DexDuet: Learning Contact-Preserving Bimanual Dexterity from Human Demonstrations", "tldr": "\u4ec5\u7528\u4e00\u6b21\u4eba\u7c7b\u793a\u8303\u5b66\u4e60\u53cc\u624b\u673a\u5668\u4eba\u7075\u5de7\u64cd\u4f5c\uff0c\u540c\u65f6\u4fdd\u7559\u624b\u7269\u63a5\u89e6\u5173\u7cfb\u3002", "upvotes": 13, "what_it_is": "DexDuet\u7528\u4e24\u7c7b\u4ea4\u4e92\u5956\u52b1\u4fdd\u7559\u4eba\u7c7b\u624b\u7269\u6784\u578b\u4e0e\u63a5\u89e6\uff0c\u5c06\u53cc\u624b\u7b56\u7565\u62c6\u4e3a\u5171\u4eab\u6743\u91cd\u3001\u4e92\u76f8\u611f\u77e5\u72b6\u6001\u7684\u5355\u624b\u7b56\u7565\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u8f85\u52a9\u8bfe\u7a0b\u7a81\u7834\u96be\u64cd\u4f5c\u9636\u6bb5\u3002", "why_notable": "\u5c06\u6a21\u4eff\u76ee\u6807\u4ece\u7269\u4f53\u8f68\u8ff9\u6269\u5c55\u5230\u63a5\u89e6\u5173\u7cfb\uff1b\u5728\u8f68\u8ff9\u7cbe\u5ea6\u76f8\u8fd1\u65f6\u4ecd\u6709\u660e\u663e\u4f18\u52bf\uff0c\u8bf4\u660e\u63a5\u89e6\u5efa\u6a21\u5177\u6709\u72ec\u7acb\u4ef7\u503c\u3002"}, {"abstract": "How much interaction experience is needed to distill a capable visual agent? We study learning from few tasks and recorded interaction histories. Our framework selects representative trajectories using skill-context coverage and ordered visual-decision similarity. On-policy distillation (OPD) learns through fresh interaction on selected tasks or fresh student responses at fixed histories. Across Navigation, Sokoban, and spatial mapping, even one online training task supports transfer to other tasks. Four fixed trajectories raise a 4B student\u0027s success from 49.17% to 82.08% on standard Navigation and from 60.16% to 85.55% on Sokoban, recovering over 90% of the measured gap to a 27B teacher on these panels. On an independent Navigation panel, replay improves success from 45.83% to 76.67%, retaining 91.36% of the same-task online gain without new interaction during optimization. Training repetitions, matched supervised fine-tuning (SFT), and a 9B extension further support the value of compact experience.", "arxiv_id": "2611.28618", "arxiv_url": "https://arxiv.org/abs/2611.28618", "authors": ["Siyu Zhou", "Jing Jiang", "Chengqi Zhang", "Guodong Long"], "brief": "\u6846\u67b6\u6309\u6280\u80fd\u4e0e\u60c5\u5883\u8986\u76d6\u3001\u89c6\u89c9\u51b3\u7b56\u5e8f\u5217\u76f8\u4f3c\u6027\u7b5b\u9009\u4ee3\u8868\u8f68\u8ff9\uff0c\u518d\u7528\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u8bad\u7ec3\u5b66\u751f\uff0c\u53ef\u5728\u9009\u5b9a\u4efb\u52a1\u4e2d\u4ea4\u4e92\uff0c\u6216\u5728\u56fa\u5b9a\u5386\u53f2\u4e0a\u751f\u6210\u65b0\u54cd\u5e94\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/elated-sawyer/visual-agent-distillation", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.28618", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u56db\u6761\u56fa\u5b9a\u8f68\u8ff9\u4f7f4B\u5b66\u751f\u5bfc\u822a\u6210\u529f\u7387\u4ece49.17%\u5347\u81f382.08%", "Sokoban\u6210\u529f\u7387\u4ece60.16%\u5347\u81f385.55%", "\u56de\u653e\u65e0\u9700\u65b0\u589e\u4ea4\u4e92\uff0c\u4fdd\u7559\u540c\u4efb\u52a1\u5728\u7ebf\u8bad\u7ec3\u589e\u76ca\u768491.36%"], "keywords": ["\u89c6\u89c9\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u8f68\u8ff9\u7b5b\u9009", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "University of Technology Sydney", "pdf_url": "https://arxiv.org/pdf/2611.28618v1", "published_at": "2026-11-21", "score": 0.295, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.28618.png", "title": "Distilling Visual Agents from Limited Interaction Experience", "tldr": "\u4ec5\u7528\u5c11\u91cf\u4ee3\u8868\u6027\u4ea4\u4e92\u8f68\u8ff9\u84b8\u998f\u89c6\u89c9\u667a\u80fd\u4f53\uff0c\u5373\u53ef\u663e\u8457\u63d0\u5347\u6210\u529f\u7387\u5e76\u652f\u6301\u8de8\u4efb\u52a1\u8fc1\u79fb\u3002", "upvotes": 19, "what_it_is": "\u6846\u67b6\u6309\u6280\u80fd\u4e0e\u60c5\u5883\u8986\u76d6\u3001\u89c6\u89c9\u51b3\u7b56\u5e8f\u5217\u76f8\u4f3c\u6027\u7b5b\u9009\u4ee3\u8868\u8f68\u8ff9\uff0c\u518d\u7528\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u8bad\u7ec3\u5b66\u751f\uff0c\u53ef\u5728\u9009\u5b9a\u4efb\u52a1\u4e2d\u4ea4\u4e92\uff0c\u6216\u5728\u56fa\u5b9a\u5386\u53f2\u4e0a\u751f\u6210\u65b0\u54cd\u5e94\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u7cbe\u5fc3\u9009\u62e9\u7684\u5c11\u91cf\u7ecf\u9a8c\u53ef\u66ff\u4ee3\u5927\u91cf\u4ea4\u4e92\uff0c\u5728\u4e24\u7ec4\u8bc4\u6d4b\u4e2d\u5f25\u5408\u4e0e27B\u6559\u5e08\u8d85\u4e5d\u6210\u7684\u5dee\u8ddd\uff0c\u4e3a\u4f4e\u6210\u672c\u8bad\u7ec3\u89c6\u89c9\u667a\u80fd\u4f53\u63d0\u4f9b\u8def\u5f84\u3002"}, {"abstract": "Pretrained vision is a common start for robot learning, but most comparisons still score one pooled vector from a third-person image. Bimanual policies instead read dense patch tokens from cameras on the robot. We introduce HIVE-Bench: one shared flow-matching policy reads 20 encoders from seven families on 24 egocentric bimanual tasks, across adaptation, task sharing, and sweeps of data, model size, and layer. Keeping the patches matters. Averaging each view to one token removes most of the success, adap
