610.07969v1", "published_at": "2026-10-06", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "EmbodiedSmith: Scaling Embodied Data through Recursive Self-Improvement Flywheel in Simulation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents have been used to search over symbolic structures such as programs and equations. We propose CueRator, an agentic framework for policy-aware decision-rule discovery, which adapts frozen contrastive multimodal encoders by searching for the decision rule that converts their cross-modal similarities into predictions. We validate it on open-vocabulary audio-visual event perception, where existing methods involve a trade-off between adaptivity and generalization to unseen categories: trained modules adapt at the cost of generalization, and fixed rules the reverse. The framework pairs a symbolic formulation for generalization with a lightweight policy that predicts its parameters per video for adaptivity. A report-guided multi-agent loop discovers the formulation offline, evaluating each candidate on its expressive ceiling and on whether a trained policy can realize it. On OV-AVEBench, CueRator raises the total average from 57.8 to 60.2 and unseen-category performance from 55.8 to 59.9 over the best existing method, reducing the seen-unseen gap from 7.1 to 1.2. Ablations attribute the gains to both the formulation and the policy and show that both feedback signals are necessary for effective search. CueRator also improves over the respective baselines on two further audio-visual event perception tasks, and the discovered rule remains competitive across encoders with only the policy retrained. Code is available at https://github.com/cvsp-lab/cuerator.", "arxiv_id": "2610.07868", "arxiv_url": "https://arxiv.org/abs/2610.07868", "authors": ["Sunchan Park", "Beomkwon Cho", "Kyeongbo Kong"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.07868", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.07868v1", "published_at": "2026-10-06", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CueRator: Agentic Search for Symbolic Rules to Adapt Frozen Multimodal Encoders", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) incorporate visual representations from video generation backbones to guide action prediction. Recent efficient WAMs adopt Mixture-of-Transformers (MoT) architectures and compute video representations once for reuse by the action expert. However, intra-expert iteration (\\ie, multi-step action denoising) and inter-expert waiting (\\ie, sequential execution of the video and action experts) still limit inference efficiency. To this end, we present RealtimeWAM, an extremely efficient WAM variant with one-step action generation and asynchronous inference, addressing these two bottlenecks. To reduce intra-expert iteration, we propose Teacher-Anchored Consistency Distillation (TACD) to address a local-global error gap: low local consistency error alone does not guarantee accurate final actions. TACD supplements local consistency with explicit supervision from the frozen teacher\u0027s multi-step rollout endpoint, enabling accurate one-step action generation. Additionally, we propose Cross-Expert Wavefront Pipelining (CEWP) to eliminate unnecessary expert-level waiting. It overlaps the two experts through block-wise sharing of the video KV cache, synchronizing only immediately before the corresponding action attention consumes it. Extensive experiments across diverse benchmarks (\\eg, LIBERO, LIBERO-Plus and RoboTwin) and model variants (\\eg, Fast-WAM and Faster-WAM) demonstrate the superiority of RealtimeWAM. Notably, RealtimeWAM maintains near-lossless performance (\\ie, $\u003c1\\%$ drop) across these benchmarks while delivering significant end-to-end speedup (\\eg, $\\sim25\\times$ on H100). Our code and checkpoints are available via this \\href{https://github.com/ModelTC/LightX2V/tree/main/examples/realtimewam}{link}.", "arxiv_id": "2610.06617", "arxiv_url": "https://arxiv.org/abs/2610.06617", "authors": ["Chengtao Lv", "Jinyang Du", "Shuyi Feng", "Yang Yong", "Shiqiao Gu", "Shunzi Yang", "Ruihao Gong", "Shen Ren", "Tianwei Zhang", "Wenya Wang"], "brief": "", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": "https://github.com/ModelTC/LightX2V", "github_stars": 2880, "hf_url": "https://huggingface.co/papers/2610.06617", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2610.06617v1", "published_at": "2026-10-05", "score": 0.141, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06617.png", "title": "RealtimeWAM: One-Step Asynchronous World Action Models", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion language models (DLMs) enable fast generation by predicting multiple tokens in parallel, but their practical adoption remains limited by a persistent quality gap relative to comparably sized autoregressive (AR) models. We attribute this gap to a computation-difficulty mismatch: within a partially observed sequence, some unknown tokens are easy to predict, while others require substantially more computation. Existing DLMs nevertheless apply uniform computational depth to all unknown positions at each denoising step. We introduce ALoDLM, which replaces uniform computation with token-adaptive latent recurrence. At each denoising step, ALoDLM iteratively refines latent representations and allocates computation according to token difficulty. Tokens ready to commit are fed back as discrete context, while unresolved tokens retain and further refine their latent states through additional recurrent passes. To learn token prediction and computation allocation jointly, we formulate token-wise computation schedules as latent variables and derive a conditional negative evidence lower bound (NELBO). We train ALoDLM at 1.7B and 8B parameter scales. Across eleven benchmarks, ALoDLM outperforms all evaluated DLMs and the corresponding AR baselines in average benchmark score at both scales. ALoDLM also retains fast parallel decoding, yielding a strong quality-efficiency trade-off among evaluated autoregressive and diffusion models under optimized inference engines.", "arxiv_id": "2610.04198", "arxiv_url": "https://arxiv.org/abs/2610.04198", "authors": ["Liancheng Fang", "Zhuowei Li", "Youngeun Kim", "Tianchen Zhao", "Rajat Koner", "Jiaye Wu", "Linghan Xu", "Xuanbai Chen", "Xiang Xu", "Zheng Zhang", "Jakub Zablocki", "Nishant Sankaran", "Yifan Xing"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/amazon-science/ALoDLM", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.04198", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Amazon", "pdf_url": "https://arxiv.org/pdf/2610.04198v1", "published_at": "2026-10-03", "score": 0.128, "selected_reasons": ["HF trending (60\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04198.png", "title": "ALoDLM: Adaptively Looped Diffusion Language Models", "tldr": null, "upvotes": 60, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term memory enables LLM-based agents to retain and reuse information across tasks and sessions, supporting personalization and long-horizon interactions. However, persistent memories can also induce sycophancy, causing agents to over-align with users\u0027 historical beliefs even when they are inaccurate, outdated, or inconsistent with objective evidence. Existing mitigation methods assume that memory-induced sycophancy originates from biased or incorrect memories and attempt to reduce this risk by filtering such memories at different stages of the memory pipeline. However, in the real world, objective and correct memories can still induce sycophancy, and the same memory can warrant different influence across different contexts. To this end, we propose MemAdapter, a novel framework that adaptively integrates retrieved memories to support objective and reliable reasoning. Specifically, MemAdapter consists of three components: (i) Counterfactual Induction, which leverages counterfactual reasoning to uncover the potential risk of retrieved memories; (ii) Context-Aware Reflection, which calibrates the inferential influence of each retrieved memory in light of the current task via self-reflection; and (iii) Evidence-Based Reasoning, which grounds the final response in appropriate evidence while preserving the legitimate influence of memory. Extensive experiments on three benchmarks demonstrate that MemAdapter consistently improves memory reliability across diverse scenarios. Our code is available at https://github.com/DEEP-JLU/MemAdapter.", "arxiv_id": "2610.05162", "arxiv_url": "https://arxiv.org/abs/2610.05162", "authors": ["Ruqing Ning", "Haibo Meng", "Zhishang Xiang", "Zerui Chen", "Jinsong Su", "Xin Wang", "Qinggang Zhang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/DEEP-JLU/MemAdapter", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2610.05162", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05162v1", "published_at": "2026-10-04", "score": 0.124, "selected_reasons": ["HF trending (31\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05162.png", "title": "Memadapter: Counterfactual Adaptation Against Memory-induced Sycophancy", "tldr": null, "upvotes": 31, "what_it_is": null, "why_notable": null}, {"abstract": "Every recurrence of a looped language model adds cost in training, decoding, prefill, and reinforcement learning (RL). The closer recurrent states get to fixed points, the less the path to them matters. This enables truncated backpropagation in training; terminal key-value (KV) sharing for decoding with almost no loss in accuracy; a distilled student that prefills up to 1.79x faster; and RL updates that compute gradients from saved rollout states, 2x faster than backpropagating through the replayed trajectory. We therefore improve the two components of training that shape these fixed points: the depth prior and input injection. Fixed-depth training breaks KV sharing, and Huginn\u0027s broad depth prior supports sharing but dilutes supervision at the target depth more than sharing requires; we learn the prior from prediction feedback, with an entropy term that keeps it broad. Existing injection schemes let the state\u0027s component along the input amplify or cancel the injection; we remove this component with orthogonal injection. From 100M to 1.6B parameters, the learned prior and orthogonal injection lower perplexity at every scale relative to Huginn\u0027s prior and existing injection schemes, respectively. At 1.6B, the learned prior with a 3x smaller KV cache matches the downstream average of fixed-depth training with the full cache.", "arxiv_id": "2610.06833", "arxiv_url": "https://arxiv.org/abs/2610.06833", "authors": ["Benhao Huang", "Chufan Shi", "Junlin Chen", "Shicheng Wen", "Zhengzhong Liu", "Eric Xing", "Xuezhe Ma"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/ifm-ai/xllm-loop", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2610.06833", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Institute of Foundation Models", "pdf_url": "https://arxiv.org/pdf/2610.06833v1", "published_at": "2026-10-05", "score": 0.116, "selected_reasons": ["HF trending (20\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06833.png", "title": "Towards Looped Models Done Right, Part II: Rethinking at Fixed Points", "tldr": null, "upvotes": 20, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce a post-training method for diffusion language models (DLMs) that minimizes Maximum Mean Discrepancy (MMD) between generated and reference distributions in the feature space of a frozen pretrained DLM. To estimate MMD, we retain contextual features at individual token positions, obtaining multiple observations per sequence from a single extractor pass. We optimize this objective using policy gradients for discrete models and direct differentiation through generated latents for continuous models. In both cases, computing the loss directly from these features enables efficient post-training without full sampling trajectories or jointly trained auxiliary models. Experiments show lower generative perplexity at comparable entropy on OpenWebText and better accuracy-computation trade-offs on GSM8K. On 16B DMax-LLaDA2.0 models with hybrid masked-uniform diffusion, we increase decoding parallelism with similar or higher accuracy on math and code benchmarks.", "arxiv_id": "2610.06648", "arxiv_url": "https://arxiv.org/abs/2610.06648", "authors": ["Ilya Drobyshevskiy", "Ilia Sudakov", "Maksim Semenov", "Denis Kuznedelev", "Maksim Ignatov", "Pavel Temirchev", "Nikita Balagansky", "Viacheslav Meshchaninov", "Nikita Gushchin", "Dmitry Baranchuk"], "brief": "", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/yandex-research/dlm-mmd", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2610.06648", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Yandex Research", "pdf_url": "https://arxiv.org/pdf/2610.06648v1", "published_at": "2026-10-05", "score": 0.105, "selected_reasons": ["HF trending (20\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06648.png", "title": "Representation-Space MMD for Diffusion Language Models", "tldr": null, "upvotes": 20, "what_it_is": null, "why_notable": null}, {"abstract": "Geometry optimization is a major cost in many quantum-chemical workflows: each optimization step requires one force evaluation, and at the density-functional level that evaluation dominates the wall time. Research in this area has produced a broad range of optimization methods, and we ask whether a language model can improve on the best of them through autoresearch. An agent rewrites the optimizer itself to minimize force-call counts, restrained by two admission gates that reject premature stopping and improvements that do not generalize to unseen molecules. Starting from Sella, the fastest open-source optimizer available, the search produces AutoSella, a family of two optimizers. Both of them deliver consistent force-call reductions relative to Sella across held-out molecular benchmarks and potentials not used during the search. Most notably, at the \\texttt{r2SCAN-3c} DFT level, the best variant requires only $40.2$--$77.2\\%$ of Sella\u0027s force calls while achieving the same energy reduction, even though agent used no DFT gradients.", "arxiv_id": "2610.06577", "arxiv_url": "https://arxiv.org/abs/2610.06577", "authors": ["Artem Tsypin", "Vladimir Deshchenya", "Kuzma Khrabrov", "Denis Potapov", "Maxim Radchenko", "Artur Kadurin", "Michael G. Medvedev"], "brief": "", "categories": ["physics.chem-ph"], "github_repo": "https://github.com/vdeshchenya/autosella", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.06577", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.06577v1", "published_at": "2026-10-05", "score": 0.098, "selected_reasons": ["HF trending (20\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06577.png", "title": "Optimizing the Optimizer: Language Models Discover Faster Molecular Relaxation", "tldr": null, "upvotes": 20, "what_it_is": null, "why_notable": null}, {"abstract": "Search agents repeatedly make short decisions about relevance, evidence sufficiency, and search actions. Using generative language models for these decisions introduces latency and unreliable confidence. We present SearchJev, a fast and calibrated System-1 model that separates search decisions from System-2 reasoning and generation. Given a search state and a decision schema, SearchJev directly scores legal options without autoregressive output generation. We propose Soft-Label Learning for Calibrated Decisions (SLCD) to learn decision probabilities from uncertain supervision and calibrate their confidence. In a dual-system search agent, SearchJev handles short decisions and delegates uncertain judgments to System 2, which retains planning, query generation, and answer composition. We also introduce SearchDecision-Bench, a benchmark unifying six types of search decisions for training and evaluation. On SearchDecision-Bench, SEARCHJEV improves decision quality over same-size Qwen3.5 autoregressive models, achieves 5.2-5.3 times faster decisions, and reduces average expected calibration error by 41-74%. On BrowseComp-Plus, the dual-system agents achieve a 3.7-4.7 times speedup in active search time while improving answer accuracy from 45% to up to 54%.", "arxiv_id": "2610.05107", "arxiv_url": "https://arxiv.org/abs/2610.05107", "authors": ["Congfeng Cao", "Lipeng Zuo", "Konstantinos Papakostas", "Qiwei Xu", "Songwei Xu", "Lun Zhou", "Zhaochun Ren", "Yougang Lyu", "Xiaohui Yan"], "brief": "", "categories": ["cs.IR", "cs.CL"], "github_repo": "https://github.com/EvoScientist/SearchJev", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.05107", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05107v1", "published_at": "2026-10-04", "score": 0.098, "selected_reasons": ["HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05107.png", "title": "SearchJev: A Fast and Calibrated System-1 Model for Search Agents", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time training (TTT) lets a model store information in its weights during inference. When the model learns from its own output, however, each update also changes the model that generates the next training example. Across 128K-token streams, retaining generated-text updates worsens prediction on independent human-written text with three TTT-E2E model configurations (labeled 125M, 760M, and 3B). The same failure occurs when Adam updates Qwen3-4B\u0027s existing weights. The same update mechanisms can improve on real text, so writing itself is not the failure. Three matched comparisons trace the causal pathway. Fixed Generation removes over 98% of the damage at 125M and 760M by using a frozen model to generate training chunks. Recorded Replay separates the loss caused by reading degraded text from the additional loss stored by updating on it. A paired one-update comparison then shows the local conflict: an update predicts its source better but new real text worse. This cost grows after Closed Loop adaptation, with a few trajectories accounting for most large failures. Finally, Settlement evaluates the candidate state on independent real text before commitment. It leaves mean endpoint gaps of 0.07 and -0.02 nats at 125M and 760M while retaining real-text adaptation. These results motivate checking prediction on independent evidence before retaining an update.", "arxiv_id": "2610.05076", "arxiv_url": "https://arxiv.org/abs/2610.05076", "authors": ["Cheng Luo", "Bing Li", "Bernard Ghanem"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/lingjivoo/ttt-ouroboros", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.05076", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "King Abdullah University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2610.05076v1", "published_at": "2026-10-04", "score": 0.093, "selected_reasons": ["HF trending (23\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05076.png", "title": "Self-Generated Feedback Destabilizes Test-Time Training: A Causal Decomposition of Long-Horizon Adaptation", "tldr": null, "upvotes": 23, "what_it_is": null, "why_notable": null}, {"abstract": "A vision--language--action (VLA) policy can complete complex tasks while ignoring the evidence that should determine its actions. An object held near the wrist camera can displace the instructed target. Language and action show the same pattern: a familiar noun can trigger the operation it was paired with in training even after the verb changes, and a gripper that closed on nothing may lift anyway. We call these dependencies modality shortcuts: regularities in successful demonstrations make visual, lexical, or motor cues sufficient to predict expert actions without the task evidence needed for the underlying decision. More demonstrations of the same kind can raise task success while leaving these shortcuts intact. We propose Perturbot which makes task-relevant evidence easier to use and shortcuts insufficient on their own: it applies task-preserving wrist-view perturbations, enriches instructions with decision-relevant captions, and adds random and failed trajectory segments relabeled with the behavior they contain. It complements scaling by changing what is scaled, and leaves inference unchanged. Moreover, we propose GroundingFscore, an offline score that diagnoses how severely a policy relies on modality shortcuts. Task success rate shows whether a policy improves, while GroundingFscore reveals whether the policy scales healthily, relying on task evidence rather than shortcuts. Together, Perturbot and GroundingFscore provide a training-and-evaluation framework for disentangling VLA decisions from shortcut priors while preserving responsiveness to task-relevant evidence.", "arxiv_id": "2610.04616", "arxiv_url": "https://arxiv.org/abs/2610.04616", "authors": ["Mingyu Liu", "Chonghao Sima", "Tianjian Feng", "Hanqing Wang", "Cong Chen", "Hao Chen", "Chunhua Shen"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/aim-uofa/PerturBot", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2610.04616", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.04616v1", "published_at": "2026-10-03", "score": 0.093, "selected_reasons": ["HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04616.png", "title": "PerturBot: Breaking Shortcut Priors in Vision-Language-Action Models with Perturbative Training", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Robot agents must connect their intended actions to observed outcomes while retaining the context needed to revise their choices over repeated attempts. Existing interfaces often leave these choices inside predefined tools or require agents to manage detailed execution code and its growing history. We introduce RobotUse, a robot agent harness that organizes computation, context, and decisions around specifying and revising physical actions. Agents visually select targets and poses, while the backend handles geometry, motion planning, and control. Subagents retain detailed interactions within each subgoal and return the information needed for subsequent decisions. Continual harnessing lets agents learn from execution by updating a persistent playbook. On RoboLab, RobotUse achieves 45% task success, outperforming CaP-X by 6.7 percentage points while maintaining compact decision contexts and reducing reliance on predefined action abstractions. Furthermore, we show that RobotUse learns from real-world execution despite imperfect feedback and transfers what it learns to subsequent tasks. Project page is available at https://robotuse-team.github.io/.", "arxiv_id": "2610.04929", "arxiv_url": "https://arxiv.org/abs/2610.04929", "authors": ["Junhoo Lee", "Injun Baek", "Seungyeon Kim", "Suhyun Jeon", "Minkyu Kim", "Baekseung Kim", "Nojun Kwak"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/robotuse-team/RobotUse", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.04929", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2610.04929v2", "published_at": "2026-10-04", "score": 0.092, "selected_reasons": ["HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04929.png", "title": "RobotUse: Allocating Computation, Context, and Decisions", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models serve as unified policies for robotic manipulation, yet their expensive inference forces robots to pause between policy calls, resulting in stop-and-go execution that interrupts smooth motion and prolongs task completion. Extending the action chunk reduces policy calls and hence these pauses, but predicting farther into the future makes long-chunk execution unreliable. To understand where this unreliability arises, we analyze action errors within long chunks and find that they concentrate around transitions between manipulation subskills, growing sharply with chunk length. This suggests the importance of transition timing, i.e., when to switch subskills within a chunk. Motivated by this observation, we introduce RACE (Reliable Action-Chunk Extension), a framework that predicts the transition timing from an auxiliary one-step denoising pass and conditions action generation on it. By learning and conditioning on transition timing, RACE reduces errors at subskill transitions and enables reliable execution of longer action chunks. Across simulation benchmarks, RACE outperforms fine-tuning at the same chunk length; with 2x longer chunks, it surpasses recent state-of-the-art and efficient VLAs in success rate, and with 4x longer chunks, it remains competitive. On a real robot, RACE uses 4x longer chunks, which reduces the idle time caused by stop-and-go execution by about 5x, while achieving a higher success rate than fine-tuning with the same chunk length. Code and a real-robot demo are available at https://github.com/Seonghoon-Yu/RACE-VLA", "arxiv_id": "2610.05719", "arxiv_url": "https://arxiv.org/abs/2610.05719", "authors": ["Seonghoon Yu", "Dongwon Kim", "HyungRok Jung", "Yoonjae Baek", "Byung-kwan Lee", "Suha Kwak", "Jeany Son"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/Seonghoon-Yu/RACE-VLA", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.05719", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Pohang University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2610.05719v1", "published_at": "2026-10-05", "score": 0.088, "selected_reasons": ["HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05719.png", "title": "When to Switch: Reliable Action-Chunk Extension for Vision-Language-Action Models", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Masked diffusion language models (dLLMs) generate text by iteratively denoising masked positions, re-predicting each token multiple times before it is committed. An autoregressive decoder exposes an answer\u0027s distribution once, at the step that commits it; a dLLM exposes it at every denoising step before commitment, and we show that an adversary can exploit this. Since an answer remains open to revision over many denoising steps, an adversary with access to internal activations can watch how likely the model is to produce a chosen answer and adjust the intervention accordingly. Building on this observation, we study targeted bias injection, an attack that steers a frozen dLLM toward a demographic answer selected by the adversary. The attack uses a simple proportional-integral (PI) controller that tracks the target-answer probability during denoising and adapts the strength of a steering vector on the fly. On ambiguous BBQ questions where the correct answer is abstention, our attack raises LLaDA-8B-Instruct\u0027s preference for the targeted group from 1.8 to 16.7 percentage points, more than three times the strongest fixed-strength steering baseline, and on SocialStigmaQA it raises the selection of stigmatizing answers from 17.6% to 58.1%. Fitted to other demographic targets, the same attack shifts answers by up to 37 percentage points, and each attack takes about 40 minutes on one GPU. On the primary target, feedback is what makes the attack work: constant steering at the same average strength over the token-committing steps produces a far smaller shift while corrupting nearly three times as many outputs, and a constant strength set separately for each example still falls well short. Our findings identify the denoising trajectory as a new control channel in dLLMs and call for bias audits that examine the serving stack rather than the frozen model alone.", "arxiv_id": "2610.05894", "arxiv_url": "https://arxiv.org/abs/2610.05894", "authors": ["Sarim Hashmi", "Mukul Ranjan", "Abdelrahman Elsayed", "Muhammad Umer Sheikh", "Fahad Shamshad", "Nils Lukas"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/Sarim-MBZUAI/dlm_bias", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.05894", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2610.05894v1", "published_at": "2026-10-05", "score": 0.087, "selected_reasons": ["HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05894.png", "title": "Noise Out, Bias In: Targeted Bias Injection in Diffusion Language Models via Closed-Loop Activation Steering", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-step matching models, including flow and diffusion models, produce high-quality outputs but incur substantial inference costs and may reproduce unwanted components of their training datasets. We introduce Inverse Distillation Unlearning (IDU), a unified framework that simultaneously distills a teacher multi-step matching model into an efficient one-step student generator and suppresses outputs corresponding to a designated training subset. We first formulate distillation as a min-max objective over a data distribution and then represent this distribution as a mixture of the forget-set and the generated distributions. This allows us to compare this mixture with the teacher\u0027s training distribution and recover only the retained data at the optimum. Our method requires only a pretrained full-data teacher and data from the forget set, without access to retained training examples, extra feature extractors or classifiers. Extensive experiments on MNIST and CIFAR-10 datasets under flow-matching and score-based diffusion settings demonstrate that IDU substantially reduces the generation frequency of forgotten classes while preserving generation quality on the retained classes. To the best of our knowledge, IDU is the first unified framework for simultaneous unlearning and distillation in unconditional flow-matching and score-based models.", "arxiv_id": "2609.36099", "arxiv_url": "https://arxiv.org/abs/2609.36099", "authors": ["Aleksei Leonov", "Nikita Kornilov", "Zhenhe Zhang", "Evgeny Burnaev", "Iaroslav Koshelev", "Alexander Korotin"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36099", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.36099v1", "published_at": "2026-09-28", "score": 0.085, "selected_reasons": ["HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36099.png", "title": "Data Unlearning via Inverse Distillation", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal RAG retrieves text, tables, images, and videos, but choosing a retrieval granularity does not determine how much context to retain within each item. Coarse units include irrelevant content, while uniformly fine selection can remove context needed to interpret the evidence. Existing compressors address this trade-off with modality-specific mechanisms, leaving open a shared procedure for adapting the retained extent region by region across heterogeneous items. We introduce CANOPY (Canonical Projection over Hierarchy), a framework for adaptive-granularity post-retrieval evidence compression. CANOPY represents retrieved items as hierarchies and uses a node encoder fine-tuned on gold evidence to score regions against the query. Parent-relative refinement compares these scores to select multiple regions at different granularities without LLM calls for node-level pruning. Because compression cannot recover evidence that was never retrieved, a critic requests targeted follow-up retrieval when it judges the accumulated evidence insufficient; newly retrieved items are compressed before being added. Across five QA benchmarks over a 33M-item heterogeneous corpus, CANOPY achieves higher average answer accuracy than the evaluated retrieval baselines. Ablations indicate that additional retrieval drives the main accuracy gains on multi-hop QA. In the unrouted Qwen3-VL-8B-Instruct setting, compression reduces reader-input evidence tokens by 14.2-27.7% relative to the same iterative pipeline without compression, with comparable answer accuracy.", "arxiv_id": "2610.00923", "arxiv_url": "https://arxiv.org/abs/2610.00923", "authors": ["Hyojeong Yun", "Jueun Kim", "Wook-Shin Han"], "brief": "", "categories": ["cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.00923", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Pohang University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2610.00923v1", "published_at": "2026-10-01", "score": 0.085, "selected_reasons": ["HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.00923.png", "title": "CANOPY: Adaptive-Granularity Evidence Compression for Multimodal RAG", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive world models are increasingly capable of generating environments and acting within them, yet deliberately editing an existing executable world remains underexplored. We formulate world editing as intervening on an existing world while preserving properties that should remain unchanged, and introduce intervention depth as an axis describing how strongly an edit couples world entities, dynamics, and systems. We instantiate this capability through industry-grade game modding and introduce IGMWorld, together with IGMBench, a benchmark of 110 tasks and over 1.1K executable state and behavioral criteria across Minecraft and Terraria. The tasks span property, entity, dynamics, and system interventions and are evaluated through deterministic executability, behavioral, preservation, and visual checks. Frontier coding agents already exhibit substantial world-editing capability: the strongest configuration solves 78.2% of tasks under a strict task-level criterion, while criterion-level performance reaches 94.8%. Reliability generally decreases with intervention depth, and this pattern persists even among tasks with similar numbers of evaluation criteria. Most failed edits still build and load successfully, suggesting that the main difficulty is making the edited world behave as requested. Visual consistency remains a separate weakness, with all evaluated configurations below 50% joint visual pass rate. These results show that world editing is a distinct capability from world generation and interaction, and that executable games provide a practical testbed for studying it.", "arxiv_id": "2610.02331", "arxiv_url": "https://arxiv.org/abs/2610.02331", "authors": ["Max Ku", "Nok-Kan Law", "Yu-Chien Tang", "Shih-Ying Yeh", "Ping Nie", "Andy Zheng", "Tat Hei Lai", "Fei-Yueh Chen", "Nikko Yu", "Wei-Chieh Sun", "Suzy Huang", "Chiao-Wei Hsu", "Chih-Chuan Huang", "Chak-Wing Mak", "Ho Yin Sam Ng", "Edisy Kin Wai Chan", "Min-Hung Chen", "Ho Kei Cheng"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/vinesmsuic/IGMWorld", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.02331", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "University of Waterloo", "pdf_url": "https://arxiv.org/pdf/2610.02331v1", "published_at": "2026-10-01", "score": 0.08, "selected_reasons": ["HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.02331.png", "title": "World Editing: Intervening on Executable Worlds at Increasing Depth", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Looped Transformers reuse one block of layers several times: by spending extra computation they push a model of fixed size further, and so use its parameters more fully; while sparse mixture-of-experts (MoE) models activate only a few of many experts for each token. Looped MoE bridges these two design philosophies and gives MoE models new potential for better expert usage, but it raises a question: how to loop a MoE? We answer it with Foil. With the expert parameters and the expert compute per token held fixed, Foil (1) flattens the experts, halving the expert layers, doubling the experts per layer and doubling the passes, so that every routing decision chooses from a larger pool, and (2) unties the attention, giving each pass its own attention parameters while the experts and routers stay shared. Experiments show that Foil clearly outperforms the unflattened looped baseline: at 20B tokens every Foil model has lower pretraining loss than the baseline; at 100B tokens the loss improves monotonically with the degree of flattening, the most flattened Foil ending 0.012 nat below the baseline at equal parameters and compute, with downstream accuracy on par or better; untying the attention also yields more balanced and more confident routing at equal shape. Our ablations analyse why Foil works and turn the findings into design guidance for looped MoE: the returns of looping and of widening the expert layers amplify each other, routing confidence tracks healthy expert use better than load balance, and a sparse looped MoE should therefore use more experts per layer and more passes. Code and configurations are available at https://github.com/SR-A-W/how-to-loop-moe.", "arxiv_id": "2609.35751", "arxiv_url": "https://arxiv.org/abs/2609.35751", "authors": ["Shouren Wang", "Chuang Ma", "Mohsen Hariri", "Debargha Ganguly", "Wang Yang", "Xiaoqing Tong", "Qianying Liu", "Xiaotian Han", "Vipin Chaudhary"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/SR-A-W/how-to-loop-moe", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.35751", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.35751v1", "published_at": "2026-09-28", "score": 0.077, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35751.png", "title": "How to Loop MoE: Flatten the Experts, Untie the Attention", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "LoRA-based continual learning methods mitigate catastrophic forgetting through various mechanisms, yet nearly all complement these with small learning rates as a heuristic to restrict gradient scaling magnitude. Such fixed heuristics lack theoretical guidance on how the strength of this restriction should evolve as tasks accumulate. We reveal that even under directional constraints such as nullspace projection, finite-precision updates inevitably leak into the subspace of accumulated prior knowledge along multiple directions. While small learning rates attenuate such leakage, they cannot prevent the accumulated forgetting from intensifying as the effective rank of historical knowledge grows. We show that the optimal magnitude restriction should adaptively increase with this effective rank to balance stability and plasticity, i.e., preservation of previous knowledge and acquisition of new task information. Under an anisotropic leakage model, we derive a pacing law $s^*=\\sqrt{R/c}$ that characterizes the optimal scaling of gradient steps, i.e., the magnitude restriction itself, where $R$ is the effective rank of past updates. Based on this insight, we propose PaLoRA, which compresses historical knowledge via adaptive SVD truncation, projects gradients onto the nullspace of prior tasks, and applies rank-aware adaptive pacing. Experiments demonstrate consistent improvements over prior methods, with particularly strong performance in long-horizon settings, achieving substantial gains of 4% accuracy on challenging 50-task ImageNet-A and ImageNet-R benchmarks.", "arxiv_id": "2610.04226", "arxiv_url": "https://arxiv.org/abs/2610.04226", "authors": ["Yuxuan Li", "Fanhu Zeng", "Hao Tang"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/liyuxuan-github/PaLoRA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.04226", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.04226v1", "published_at": "2026-10-03", "score": 0.077, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04226.png", "title": "PaLoRA: Paced Low-Rank Adaptation for Continual Learning", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "We present Empirical Variational Autoencoder, a general generative framework for continuous-valued (i.e., non-vector-quantized) sequences. EVA is based on the evidence lower bound of the Variational Autoencoder (VAE) but learns autoregressive latent priors empirically from training data, which can be implemented only by an additional single linear layer on top of VAEs. By replacing the conventional standard-Gaussian constraint with the self-predicted priors, EVA significantly alleviates the latent distribution gap between prior and posterior which is typically observed in conventional VAEs, and leads to high-fidelity ancestral sampling for sequential data generation. Extensive experiments on image and sound synthesis demonstrate that EVA achieves competitive generation quality with autoregressive diffusion baselines despite its much faster inference time.", "arxiv_id": "2610.06545", "arxiv_url": "https://arxiv.org/abs/2610.06545", "authors": ["Kaede Shiohara"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/mapooon/EVA", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.06545", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.06545v1", "published_at": "2026-10-05", "score": 0.075, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06545.png", "title": "Empirical Variational Autoencoder", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Paired synthetic aperture radar (SAR) and electro-optical (EO) imagery is increasingly available across sensors, resolutions, and geographic regions. Yet existing SAR-to-EO image translation (SET) methods are typically trained on a single, limited-scale dataset, producing models specialized to particular sensing conditions. We introduce GeoSET, the first generalist model for SET, built around a single pretrained parent that is adapted to downstream datasets under a common protocol. We curate over 3 million high-quality SAR--EO pairs from a collection of more than 10 million SAR observations, spanning diverse sensors, spatial resolutions, and ground sampling distances. To bridge the modality gap between SAR observations and a pretrained image generator, we develop a speckle-robust SAR encoder and pretrain the conditional generator on this heterogeneous corpus. The resulting parent supports efficient adaptation across downstream datasets through low-rank adaptation (LoRA), updating only 0.60% of the generator parameters and requiring approximately one hour per dataset. Across six downstream benchmarks, GeoSET achieves state-of-the-art results in FID and DISTS with full fine-tuning or LoRA, demonstrating effective transfer across heterogeneous SAR-EO domains.", "arxiv_id": "2609.37496", "arxiv_url": "https://arxiv.org/abs/2609.37496", "authors": ["Jeonghyeok Do", "Munchurl Kim"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/KAIST-VICLab/GeoSET", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.37496", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "KAIST VIClab (Prof. Munchurl Kim)", "pdf_url": "https://arxiv.org/pdf/2609.37496v1", "published_at": "2026-09-26", "score": 0.07, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37496.png", "title": "GeoSET: Generalist Foundation Model for SAR-to-EO Image Translation", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "A language model reads long text in one quadratic forward pass, stops at the context window, and loses accuracy with length before reaching it. We ask whether the read can be factorized when deciding over a finite set: which document is relevant, which option is supported, which passage is the evidence. Periscope, a training-free inference method, arranges the $N$ chunks of a text on a $K{\\times}K$ grid with $K{=}\\lceil\\sqrt{N}\\rceil$ and asks a frozen model the same question about $K$ local spans of consecutive chunks and $K$ strided spans that sample the whole text, reading the log-odds of every answer at one token. Each answer takes its best local and strided score, and scoring every chunk by its two spans gives an evidence map at no further cost, whose peak is the chunk behind the answer. Every probe is about $\\sqrt{sc}$ tokens for a text of $s$ tokens and chunk size $c$, so a window of $W$ tokens reaches $W^{2}/c$ tokens at $s^{1.5}$ cost. The map replaces the long read. On LongBench v2, reading only the $K$ chunks the map ranks highest, 9k tokens, matches the same model\u0027s best window read across windows from 32k to 1M tokens, and on InfiniteBench, where the median context is 150k tokens, it leads the best window read by 5 points. The same map ranks BRIGHT\u0027s long-document corpora with the best NDCG@10 of six methods. Each call caches only one probe, so a 27B model reads 4.5M-token contexts on one 80GB GPU, where a single pass would need 296GB of cache. A long read then needs a GPU that holds the model, not one that holds the text.", "arxiv_id": "2610.04047", "arxiv_url": "https://arxiv.org/abs/2610.04047", "authors": ["Mohamed Eltahir", "Anas Obayd", "Raed Rashid", "Abdulrahman Alghamdi", "Abdulrahman Mousa", "Abdallah Ahmed", "Tanveer Hussain", "Naeemullah Khan"], "brief": "", "categories": ["cs.CL", "cs.IR", "cs.LG"], "github_repo": "https://github.com/mohammad2012191/Periscope", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.04047", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "King Abdullah University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2610.04047v1", "published_at": "2026-10-02", "score": 0.068, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04047.png", "title": "Periscope: Extending Frozen Language Models Beyond Their Context Window", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Loop Flow Transformers (LiFT), a family of looped generative models that scales computation by repeatedly applying a shared Diffusion Transformer (DiT) core, with only light changes to the standard architecture. Rather than asking every recurrent step for the final prediction, LiFT trains each step with a single regression target: a point on a straight path from the model\u0027s initial estimate to the flow-matching target. Because we index these targets by a continuous depth coordinate, a trained model can loop far beyond its training depth with no retraining, early exits, or other modifications. In our experiments, these longer rollouts improve generation, so inference computation can grow without adding parameters. On ImageNet at 256x256, LiFT-L/2 achieves an FID 3.34 points lower than our dense DiT-XL/2 baseline while using approximately 60% fewer parameters, 32% fewer training FLOPs, and 52% fewer inference FLOPs.", "arxiv_id": "2610.05538", "arxiv_url": "https://arxiv.org/abs/2610.05538", "authors": ["Mohammad Mahdi Derakhshani", "Pedro M. P. Curvo", "Gertjan J. Burghouts", "Jan-Willem van de Meent", "Cees G. M. Snoek"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05538", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Video \u0026 Image Sense Lab", "pdf_url": "https://arxiv.org/pdf/2610.05538v1", "published_at": "2026-10-04", "score": 0.067, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05538.png", "title": "LiFT: Loop Flow Transformers", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Latent reasoning lets a large language model (LLM) think in a continuous space and verbalize only the answer. We argue that an effective latent thought must meet five requirements: it should be useful, helping produce the correct answer rather than merely changing it, diverse, so that resampling yields different reasoning trajectories, explainable, so that a decoded chain of thought (CoT) reflects reasoning the answer actually follows, refinable with more inference compute, and efficient, costing less than an explicit CoT at comparable accuracy. Current methods rarely meet these requirements: they learn shortcuts from the question, distill the explicit CoT into their weights, or imitate it one token at a time. We focus on flow matching in a learned latent space, the family we argue is best placed to meet them, and identify the training choices that make it work. The result is Flow-based Latent Reasoning (FLaRe), a simple recipe covering what the latent space encodes and how to shape it, where to train the flow, how to read out the answer, and a final stage of training on the model\u0027s own verified thoughts. A probe for each requirement shows that FLaRe improves on prior latent methods in all five. It also compares favorably with them on arithmetic benchmarks, while reaching 97% of the accuracy of explicit CoT at a quarter of its latency.", "arxiv_id": "2610.06666", "arxiv_url": "https://arxiv.org/abs/2610.06666", "authors": ["Yassine Ouali", "Adrian Bulat", "Georgios Tzimiropoulos"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.06666", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Samsung Research", "pdf_url": "https://arxiv.org/pdf/2610.06666v1", "published_at": "2026-10-05", "score": 0.067, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.06666.png", "title": "What Matters for Latent Reasoning with Flow Matching", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Split learning lets a client train a language model on a server without sending its text. The client runs the first layers itself and sends the server only their output, a vector of numbers for each token. During training, the server sends gradients back. We show that an observer at the split can rebuild most of the client\u0027s text from this traffic, and we measure how much the gradients help. On GPT-2, an attacker who holds only the publicly released weights of the client\u0027s layers recovers 94.20% of tokens from the activations alone and 97.38% when it also sees the gradients, 3.17 percentage points more 95% interval [2.72, 3.64]. Counted by document, the difference is much larger. The attacker rebuilds 13.71% of 32-token documents exactly without the gradients and 37.77% with them, because a document only counts when every token is right. How we count also changes how good a defence looks. Secret mixup, which blends each outgoing vector with a decoy, stops the attacker from rebuilding almost any document exactly, yet the attacker still recovers 83-91% of tokens. In a second experiment on GPT-2 and Qwen3-0.6B, where the server trains only a run of consecutive layers, the layer at which the run starts changes both model quality and leakage, even when the run\u0027s length is fixed. We recommend reporting leakage both per token and per document, and treating what a split model sends as being as sensitive as the text itself.", "arxiv_id": "2610.04128", "arxiv_url": "https://arxiv.org/abs/2610.04128", "authors": ["Georgios Politis", "Evangelos Pappas"], "brief": "", "categories": ["cs.CR", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04128", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Setloop", "pdf_url": "https://arxiv.org/pdf/2610.04128v1", "published_at": "2026-10-02", "score": 0.064, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04128.png", "title": "What Gradients Add to Text Leakage in Split Language Models, Counted per Token and per Document", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents are becoming increasingly capable of generating scientific code, but generating code is not the same as improving the algorithms behind it. For numerical solvers, execution feedback can expose poor performance, but rarely reveals its underlying cause and how to address it. We introduce Auto-Diagnosis and Skill Discovery (ADSD), a framework that links numerical diagnosis to reusable solver self-improvement. ADSD follows a diagnosis-first paradigm that first explains why a solver performs poorly, then uses this diagnosis to guide the discovery of appropriate numerical methods. The resulting knowledge is packaged into reusable solver skills, turning solver improvement from trial-and-error editing into a structured process of diagnosis, discovery, and implementation. Across four challenging numerical domains--power flow equation, AC optimal power flow control, stiff ordinary differential equations, and heterogeneous diffusion PDEs--ADSD consistently improves solver accuracy, robustness, and efficiency. On GOC-500 power flow, for example, ADSD reduces mean solver error by nearly $71\\times$, with improvements further transferring to unseen grid topologies and operating regimes.", "arxiv_id": "2610.03872", "arxiv_url": "https://arxiv.org/abs/2610.03872", "authors": ["Peter Chen", "Wotao Yin"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.03872", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.03872v1", "published_at": "2026-10-02", "score": 0.064, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.03872.png", "title": "Training Numerical Intelligence via Auto-Diagnosis and Skill Discovery", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are highly sensitive to the prompts used to specify task objectives and behavioral constraints. Many recent prompt optimization methods iteratively rewrite prompts using LLM-generated feedback, but the resulting prompts often become longer, accumulate narrow sample-specific rules, and generalize poorly beyond the training distribution. We study this failure mode as prompt distributional overfitting and argue that it reflects a lack of representation control in discrete text-space optimization. We formalize this view through representational inefficiency, a dual-factor measure that decomposes prompt inefficiency into capacity cost and scope narrowness, attributing distributional prompt overfitting to their coupled growth during optimization. We propose TextReg, a regularization framework that realizes a soft-penalty objective through regularized textual gradients, combining Dual-Evidence Gradient Purification, Semantic Edit Regularization, and Regularization-Guided Prompt Update. Across multiple reasoning benchmarks, TextReg substantially improves out-of-distribution (OOD) generalization, with accuracy gains of up to +11.8% over TextGrad and +16.5% over REVOLVE.", "arxiv_id": "2605.21318", "arxiv_url": "https://arxiv.org/abs/2605.21318", "authors": ["Lucheng Fu", "Ye Yu", "Yiyang Wang", "Yiqiao Jin", "Haibo Jin", "B. Aditya Prakash", "Haohan Wang"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/luchengfu6/TextReg", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2605.21318", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Georgia Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2605.21318v2", "published_at": "2026-05-20", "score": 0.061, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2605.21318.png", "title": "TextReg: Mitigating Prompt Distributional Overfitting via Regularized Text-Space Optimization", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "The harness surrounding a language model is a central determinant of agent performance. Recent methods optimize harnesses by searching over complete programs, where individual mechanisms are difficult to isolate and reuse. We introduce PluginRSI, which represents a harness as a composition of atomized plugins and organizes harness evolution around these plugins. Individual plugins are improved independently and accumulated in a shared library, then recombined into new harnesses at each iteration. PluginRSI improves over existing harness optimization methods across software engineering, command-line interaction, and question-answering tasks. The resulting harnesses retain their advantage when transferred to other solver models without further optimization. The evolved plugin library accelerates subsequent optimization from the initial harness, which helps faster and higher convergence on unseen tasks. These results show that accumulating reusable mechanisms provides an effective basis for continued harness improvement.", "arxiv_id": "2609.32423", "arxiv_url": "https://arxiv.org/abs/2609.32423", "authors": ["Yaorui Shi", "Yuchun Miao", "Yuxin Chen", "Jiayuan Zhang", "Yueqing Sun", "Xierui Song", "Xiang Wang", "An Zhang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32423", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.32423v1", "published_at": "2026-09-26", "score": 0.061, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32423.png", "title": "PluginRSI: Recursive Improvement of Agent Harnesses with Reusable Plugins", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Current video editors can insert objects but often struggle to make them participate in interactions such as being picked up or manipulated. We introduce ALIVE, a framework that makes inserted objects \"alive\" through coherent interactions with the source video\u0027s contents, using an edited first frame and an instruction naming only the added object. We curate 35,800 editing pairs combining 3D-rendered, model-generated, and real-world videos with general editing pairs from ROSE. Each pair differs in the target object\u0027s presence while preserving the surrounding action, teaching editors coordinated object behavior and source preservation. We further train a vision-language model (VLM) to predict interaction guidance from the same inputs. We introduce the ALIVE-interaction benchmark to assess interaction fidelity, source preservation, and visual coherence using a unified VLM-based protocol, and evaluate on the general video object insertion benchmark. Without VLM guidance, ALIVE improves Overall over the strongest evaluated baseline by 43.9% and 4.4% on the two benchmarks, respectively. VLM-predicted guidance further improves the ALIVE-interaction score by 0.95 points without additional user inputs.", "arxiv_id": "2610.08779", "arxiv_url": "https://arxiv.org/abs/2610.08779", "authors": ["Zhenghong Zhou", "Zhe Lin", "Jiebo Luo", "Yuqian Zhou"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/zhouzhenghong-gt/ALIVE-code", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.08779", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "University of Rochester", "pdf_url": "https://arxiv.org/pdf/2610.08779v1", "published_at": "2026-10-06", "score": 0.041, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.08779.png", "title": "ALIVE: Interaction-Aligned Object Insertion for First-Frame-Guided Video Editing", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) equipped with terminal access have demonstrated strong capabilities in automating software engineering tasks. However, existing agents remain brittle on long-horizon workflows, where they must repeatedly reconstruct program state scattered across source files, configurations, tests, dependencies, and runtime behavior, leading to increasingly long interaction histories, context explosion, and semantic drift. Large repositories further complicate the identification of task-relevant components. To address these challenges, we introduce \\textbf{Dev-Primitives} (\\emph{Development Primitives}), a modular and executable abstraction that transforms repository components from passive software artifacts into active participants in software engineering. Each Dev-Primitive pairs a repository artifact with a resident LLM, which gives the artifact an agent-native interface grounded in its own implementation and dependencies, enabling natural-language reasoning, inter-component communication, and localized self-modification. Building on Dev-Primitives, we propose \\textbf{HERMES}, a Harness Engineering framework for software engineeRing via Modular Executable Dev-PrimitiveS, which instantiates these primitives at repository scale through a dependency-aware dynamic activation mechanism and a bug diagnosis mechanism that maps execution evidence back to the components that must be revised. Extensive experiments on four software engineering benchmarks demonstrate that HERMES outperforms matched baseline harnesses by 12.4\\% on average. Moreover, when paired with strong activation and diagnosis models, HERMES, even with Qwen3-8B Dev-Primitives, remains within 4.5\\% of the homogeneous GPT-5.6 Sol configuration across all four benchmarks, while reducing inference cost by 26.2\\% on Terminal-Bench 4.0, highlighting the importance of harness design in software engineering agents.", "arxiv_id": "2610.07832", "arxiv_url": "https://arxiv.org/abs/2610.07832", "authors": ["Haibo Jin", "Xinjie Li", "Peng Kuang", "Haohan Wang"], "brief": "", "categories": ["cs.SE", "cs.AI", "cs.CL", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.07832", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.07832v1", "published_at": "2026-10-06", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07832.png", "title": "Harness Engineering for Software Engineering via Modular Executable Dev-Primitives", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-augmented speech assistants typically serialize automatic speech recognition, large language model inference, and external tool execution. As a result, tool latency is incurred only after the user has finished speaking and the LLM has identified the required tool calls. We present speculative tool execution for on-device cascaded voice agents, which predicts tool requests from partial ASR hypotheses and initiates tool execution while speech is still being received, thereby reducing end-to-end response latency. Our approach introduces a Predictor module that anticipates tool calls during speech recognition, executes them speculatively, and caches the results. The cached outputs are then injected into the LLM prompt, enabling faster responses. Additionally, to mitigate errors caused by user self-corrections during speech, we employ a rule-based validation mechanism that selectively injects only valid cached results. As a final safeguard, the LLM retains the ability to issue tool calls directly, ensuring that the latency of our framework is upper-bounded by the baseline serial execution pipeline in the worst case. We evaluate our method using live measurements from a fully implemented Android voice assistant. Our approach reduces the median time-to-first-audio from 5.79,s to 4.60,s and decreases the standard deviation from 3.49,s to 2.81,s, resulting in more predictable response latency.", "arxiv_id": "2610.07641", "arxiv_url": "https://arxiv.org/abs/2610.07641", "authors": ["Kyudan Jung", "Hyunsin Park", "Yoonhyung Lee", "Jinhwan Park", "Jinhyeok Yang", "KiHyun Nam", "Jaegul Choo", "Jinkyu Lee"], "brief": "", "categories": ["cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.07641", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Qualcomm AI Research", "pdf_url": "https://arxiv.org/pdf/2610.07641v1", "published_at": "2026-10-06", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07641.png", "title": "Hiding Tool Latency in On-Device Cascaded Voice Agent through Speculative Execution", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "As human--AI interactions become more conversational, full-duplex speech language models capable of natural real-time dialogue are growing in importance. Beyond generating appropriate responses, these models must coordinate turn-taking, backchanneling, and floor management in real time. Reinforcement learning (RL) provides a way to refine these behaviors through direct feedback on interaction outcomes. However, existing RL methods either apply timing feedback to a token policy or optimize semantic content, leaving the joint improvement of timing and content unresolved. We introduce HiPLEX, an RL framework that factorizes a pretrained full-duplex text policy into a control policy that decides when to emit content and a conditional content policy that decides what to emit. The first factor selects among \u0027pad\u0027, \u0027epad\u0027, and \u0027con\u0027. The second selects a token only when \u0027con\u0027 is chosen. This hierarchy describes conditional actions within each frame and uses the model\u0027s existing text head. We route timing advantages to the token-group factor through event-causal masks derived from generated speech episodes, and route an LLM-judge semantic advantage to the conditional content factor. Across three Moshi seeds on Full-Duplex-Bench v1, HiPLEX reduces takeover rates during natural user pauses and backchannel opportunities, and shortens post-interruption response latency relative to GRPO, while maintaining comparable judged interruption-response quality. On Moshi and PersonaPlex, HiPLEX better matches pooled human turn-timing and backchannel-rate marginals than GRPO.", "arxiv_id": "2610.07727", "arxiv_url": "https://arxiv.org/abs/2610.07727", "authors": ["Kyudan Jung", "Hyunsin Park", "Yoonhyung Lee", "Jinhwan Park", "Jinhyeok Yang", "KiHyun Nam", "Jaegul Choo", "Jinkyu Lee"], "brief": "", "categories": ["cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.07727", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Qualcomm AI Research", "pdf_url": "https://arxiv.org/pdf/2610.07727v1", "published_at": "2026-10-06", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07727.png", "title": "HiPLEX: Hierarchical Policy Factorization for Full Duplex Speech Language Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Zero-shot coordination in embodied settings requires acting while the partner is intermittently out of view, leaving existing methods with ambiguous partner representations and uncertainty over hidden partner states. We propose Predicting Intention of Partner (PIP) to jointly address these challenges. PIP uses a Joint-view VAE to distill richer training-time evidence from the union of both agents\u0027 local observations into a partner representation available from local observations alone. Partner-state Belief networks further infer the partner\u0027s hidden location and behavioral tendencies from the ego agent\u0027s interaction history. We evaluate PIP in Burrito-PO, Overcooked-PO, and a Melting Pot substrate, together with a human evaluation in Burrito-PO. PIP attains the highest mean performance among the compared methods across all three benchmarks. Human evaluation and diagnostic analyses further support coordination with unseen partners and the contributions of both components under partner occlusion.", "arxiv_id": "2610.08142", "arxiv_url": "https://arxiv.org/abs/2610.08142", "authors": ["Jinnyeong Yang", "Yuhwan Jeong", "Hoyong Kwon", "Minseok Kim", "Jihun Kim", "Kuk-Jin Yoon"], "brief": "", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.08142", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.08142v1", "published_at": "2026-10-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Partially Observable Zero-shot coordination by Predicting Intention of Partner", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Legal intelligence aims to support reliable decision-making across long-horizon legal processes involving evolving case states and multiple roles. However, real-world legal deployment exhibits substantial case heterogeneity in facts, evidence, and procedural contexts, exposing the limitations of static agent strategies. Moreover, legal reasoning is inherently interdependent across roles and procedural stages, making global reliability fundamentally different from isolated role competence. To address these challenges, we study training-free test-time agent adaptation, where agents continuously exploit deployment-time signals from preceding cases and ongoing interactions without updating model parameters. We propose \\method, which introduces \\emph{Test-Time Memory Evolution} to retrieve reusable experience from previous cases, adapt it to the current factual and procedural context, and consolidate accumulated experience for subsequent decision-making. Further, \\emph{Rubric-Aligned Collaboration} verifies and revises role-specific actions according to behavioral and procedural requirements, enabling coordinated decision-making across roles and stages. Extensive experiments on J1-EVAL and LegalWorld across five backbone models demonstrate consistent improvements over representative reasoning and agent baselines with reasonable interaction and computational costs. Ablation and case studies further show that the two components provide complementary benefits in experience adaptation and cross-role coordination, improving the reliability and efficiency of long-horizon legal reasoning.", "arxiv_id": "2610.08138", "arxiv_url": "https://arxiv.org/abs/2610.08138", "authors": ["Haotian Chen", "Shuaicheng Niu", "Haocong Rao", "Kaisong Song", "Jun Lin", "Lizhen Cui", "Zhiqi Shen", "Yonghui Xu"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.08138", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.08138v1", "published_at": "2026-10-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Test-Time Agent Evolution for Long-Horizon Legal Reasoning", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Product Identification has sprung up to become one of the most challenging problems in the automation of the retail industry. With the new industry 5.0 standards, automated inventory management, and catalog creation tasks are vitally important. Object identification models have emerged as a viable answer with their unprecedented identification and localization accuracy. However, the close-knit rack design of supermarkets generates the problem of angle variation in capturing images. The angle-variant densely packed images(a single image contains many objects) become overwhelming for these models alone. In this paper, we try to supplement object detection models with traditional Hough transform (HT) and homogeneous estimation concepts. We study the effect of rectified images using homography estimation and hough transform and their limitations on the problem of grocery identification. We make a case for creating a new dataset to test the effects of such rectification and produce analytical results on different scenarios of angle variation and object densities per image. Extensive experiments on different object detection models suggest that image rectification of angled images improves the detection accuracy of grocery products in images. The results also highlight the limitation of rectification on the angle of image capture and the object density of the image.", "arxiv_id": "2610.08126", "arxiv_url": "https://arxiv.org/abs/2610.08126", "authors": ["Mayank Sah", "Jimson Mathew"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.08126", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.08126v1", "published_at": "2026-10-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Supermarket Product Detection and Recognition: Utilizing Deep Learning with Rectified Imagery", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "End-to-end planners based on waypoint regression achieve strong open-loop accuracy, but they primarily learn to mimic expert geometry and remain difficult to adapt to deployment-time safety constraints. We propose a query-based cost-learning framework that estimates bounded costs for dynamically reachable ego trajectory queries, rather than dense BEV cells or a small regressed trajectory set. Compact joint scene tokens capture coherent multimodal agent futures, while contingency-aware cost aggregation and cost-guided intra-cluster MPPI mixing convert the learned cost topology into feasible ego plans. On nuScenes, our method improves over prior cost-estimation planners such as ST-P3 and NMP, outperforms most regression baselines in collision rate, while remaining competitive in L2, and retaining an interpretable cost interface. On real-world driving logs, the proposed planner reduces collision rates compared with SparseDrive and Alpamayo without fine-tuning, while maintaining a diverse set of candidate trajectories.", "arxiv_id": "2610.08123", "arxiv_url": "https://arxiv.org/abs/2610.08123", "authors": ["Ahmed Abouelazm", "Rupert Polley", "Qingyuan Zhang", "Yin Wu", "Philip Sch\u00f6rner", "Carl Esselborn", "J. Marius Z\u00f6llner"], "brief": "", "categories":
