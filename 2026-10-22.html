<style>

  * { box-sizing:border-box; }

         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .container { max-width:1280px; margin:0 auto; padding:20px 18px 60px; }
  header h1 { margin:0; font-size:22px; }

  input[type=search], select { background:var(--card); color:var(--fg); border:1px solid var(--border);
         border-radius:8px; padding:7px 11px; font-size:14px; }
  input[type=search] { flex:1; min-width:220px; }
  .filter-group { margin:8px 0; }
  .filter-group .label { font-size:12px; color:var(--muted); margin-right:6px; }
  .tabs { display:inline-flex; gap:6px; flex-wrap:wrap; }
  .tab { padding:4px 11px; border:1px solid var(--border); border-radius:16px; cursor:pointer;

  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .meta-line { color:var(--muted); font-size:13px; margin:10px 0; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:16px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 2px 12px rgba(37,99,235,.12); }
  .card.top { border-top:3px solid #f59e0b; }
  .card h3 { margin:0 0 8px; font-size:16px; line-height:1.4; }
  .card h3 .rank { color:var(--accent); font-weight:700; margin-right:5px; }
  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }
  .modal-box h2 { margin:0 30px 12px 0; font-size:20px; line-height:1.45; }
  .modal-box .abs { font-size:14px; line-height:1.75; white-space:pre-wrap; background:var(--bg);

  .modal-box .lbl { font-weight:700; margin:16px 0 6px; font-size:14px; }
  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .pdfwrap iframe { width:100%; height:100%; border:0; }
  .pdfhint { font-size:12px; color:var(--muted); margin-top:6px; }

<script>
const PAPERS = [{"abstract": "Agent learning is shifting from learning from human data toward learning through interaction with the world. However, scaling such learning directly in real-world computer systems is challenging and can introduce substantial security risks. We therefore propose Agent World Model in the Wild (WildAWM), a scalable pipeline for synthesizing controllable environments and tasks for training general computer-use agents (CUAs). Whereas existing approaches typically specialize in a single agent interaction interface, we construct executable environments that jointly support graphical user interfaces, model context protocol services, and command-line interfaces, allowing agents to flexibly combine visual interaction, tool use, and code execution. WildAWM is entirely powered by open-source models, demonstrating that high-quality computer-use environments can be generated without proprietary frontier models. Beyond environments, we address three recurring challenges in task synthesis: ensuring solvability, maintaining sufficient difficulty, and producing reliable verifiers, by introducing execution-based quality gates that combine heterogeneous agent rollouts, cross-judge consistency checks, and counterfactual probes of judgment robustness. The resulting pipeline synthesizes 341 long-horizon environment-task pairs that can require over 100 agent steps to solve and remain challenging even for frontier models, with GPT-6-Astra solving only 60% of them. We train two Qwen models of different sizes exclusively in these synthetic worlds. Both models achieve substantial gains across 8 out-of-distribution benchmarks spanning web, claw, and computer-use agents, demonstrating that learning in WildAWM\u0027s synthesized worlds generalizes broadly to unseen computer-use tasks. The code is publicly available at https://github.com/MSR-Orchard/WildAWM.", "arxiv_id": "2610.26828", "arxiv_url": "https://arxiv.org/abs/2610.26828", "authors": ["Zhaoyang Wang", "Qianhui Wu", "Haorui Wang", "Simon Yu", "Baolin Peng", "Canwen Xu", "Hao Cheng", "Wenlin Yao", "Boyi Liu", "Yite Wang", "Jianfeng Gao", "Huaxiu Yao"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/MSR-Orchard/WildAWM", "github_stars": 70, "hf_url": "https://huggingface.co/papers/2610.26828", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2610.26828v1", "published_at": "2026-10-19", "score": 0.54, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (64\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26828.png", "title": "Agent World Model in the Wild: Computer-Use Agent Environment Synthesis", "tldr": null, "upvotes": 64, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) can perform a broad range of tasks across diverse settings, yet their performance in agentic contexts remains poorly understood. Although online evaluations in simulators and real-world environments are essential for measuring interactive agent performance, they are costly and challenging to scale. Complementary offline VQA benchmarks can enable faster and more reliable comparisons across agentic domains, yet existing benchmarks remain limited and fragmented. To address this gap, we introduce AgentVQA, an offline benchmark for evaluating VLMs on realistic agentic scenarios across five agent domains: Web Agents, Robotics, Egocentric Videos, Games, and Spatial Planning. We build AgentVQA by manually selecting 1000 challenging, real-world agent examples from 23 source datasets and adapting them for reliable offline evaluation. The resulting benchmark preserves realistic scenarios from interactive environments across diverse domains, and its model rankings track those from corresponding online evaluations. Across the 22 evaluated models, the best achieves only 58.5% accuracy. Our cross-domain analysis shows that errors are driven primarily by failures to ground and maintain accurate representations of the current and evolving visual state, including localizing relevant UI elements, interpreting motion, tracking state changes over time, and inferring 3D spatial relationships, rather than by task misinterpretation or downstream logical reasoning.", "arxiv_id": "2610.31494", "arxiv_url": "https://arxiv.org/abs/2610.31494", "authors": ["Advait Gupta", "Sachin Konan", "Tom Yin", "Gabriel Sarch", "Zhuang Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/zlab-princeton/AgentVQA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.31494", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "zlab-princeton", "pdf_url": "https://arxiv.org/pdf/2610.31494v1", "published_at": "2026-10-22", "score": 0.486, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Princeton", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31494.png", "title": "AgentVQA: A Unified Benchmark for Agentic Visual Understanding", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Scaling data, diversity and model capacity has improved embodied learning in physical environments, where diverse experiences remain grounded in shared physical laws. Whether these gains extend to virtual worlds with different visual styles, dynamics, controls, and objectives remains unclear. We investigate this question through a controlled study of continued pre-training (CPT) across three axes: data volume, diversity, and model size. Our 120 training configurations span four model sizes from 0.8B to 27B, six data budgets from 50 to 1,600 hours, and five mixtures ranging from Minecraft-only data to diverse multi-world corpora. We assess performance and generalization using three-level validation losses and gameplay benchmarks from in-corpus worlds to unseen worlds. Our results show: (1) more data improves in-corpus performance, diversity improves transfer to related worlds with limited gains in distant worlds, and model size improves data efficiency but generalizes worse to distant worlds under single-world training; (2) we observe an early interface phase with broad cross-world benefits and a later world phase with gains narrowed to in-corpus and related worlds, and fit an empirical scaling law relating validation loss to data volume, diversity and model size; and (3) our models are competitive with Minecraft specialists and frontier models in 3D worlds, and perform best in real-time settings. However, the limits of imitation and persistent gaps in distant worlds suggest that building generalist embodied agents requires richer training stages beyond continued pre-training.", "arxiv_id": "2610.28698", "arxiv_url": "https://arxiv.org/abs/2610.28698", "authors": ["Kuan Zhang", "Yukun Chen", "Zhihao Yang", "Yue Su", "Xiangnan Wu", "Zirong Chen", "Run Luo", "Jinkun Hou", "Tao Tan", "Yinhe Zheng", "Yiming Li"], "brief": "", "categories": ["cs.AI", "cs.CV", "cs.LG"], "github_repo": "https://github.com/THUSI-Lab/GameScaling", "github_stars": 231, "hf_url": "https://huggingface.co/papers/2610.28698", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tsinghua Spatial Intelligence Lab", "pdf_url": "https://arxiv.org/pdf/2610.28698v1", "published_at": "2026-10-20", "score": 0.368, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (53\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28698.png", "title": "Scaling in Games: Continued Pre-Training For Embodied Agents In Diverse Virtual Worlds", "tldr": null, "upvotes": 53, "what_it_is": null, "why_notable": null}, {"abstract": "Spatial intelligence requires agents to actively acquire visual evidence and integrate observations into a coherent representation of the three-dimensional world. Yet spatial question answering offers limited evidence of whether models can construct accurate metric maps through autonomous exploration. We introduce SpatialScout, a benchmark for evaluating vision-language model (VLM) agents on active object-level 3D mapping. SpatialScout comprises 80 diverse indoor scenes containing 3,140 target objects. Given an object inventory, RGB observations, camera calibration, and camera poses, agents control a camera to explore each scene and estimate object centers in a shared coordinate frame. The task requires coordinating viewpoint selection, cross-view association, geometric estimation, and map revision under bounded interaction budgets. Evaluation jointly measures localization accuracy and target coverage through object-scale overlap scores that penalize missing predictions. Experiments with frontier VLMs reveal substantial limitations: the strongest evaluated model, Claude Opus 5.5, achieves a mean overlap score of 41.71%, with 47.23% of targets exceeding an intersection-over-union (IoU) threshold of 0.5 and only 3.25% exceeding 0.9. These results reveal a substantial gap between recovering coarse object layouts and constructing complete, precise metric maps. SpatialScout provides a quantitative testbed for developing agents that build reliable 3D spatial representations through active perception. Code is available at https://github.com/JesseZZZZZ/SpatialScout.", "arxiv_id": "2610.26659", "arxiv_url": "https://arxiv.org/abs/2610.26659", "authors": ["Zhaoxi Zhang", "Hao Liang", "Linxuan Wu", "Yiming Xu", "Yifu Yuan", "Kun Liang", "Chenming Tang", "Meiyi Qiang", "Wentao Zhang", "Weikang Li"], "brief": "", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/JesseZZZZZ/SpatialScout", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.26659", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2610.26659v3", "published_at": "2026-10-19", "score": 0.364, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (131\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26659.png", "title": "SpatialScout: Can VLM Agents Actively Explore and Map 3D Scenes?", "tldr": null, "upvotes": 131, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier coding agents are increasingly framed as end-to-end automated researchers, and ML for science offers a demanding test of that promise: improving a scientific model often requires domain insight beyond routine ML engineering. We introduce Agent4Sci, a long-horizon testbed for measuring how far today\u0027s agents can improve the published best models on scientific ML benchmarks, spanning 20 benchmarks across 11 domains. Rather than ranking agents on a leaderboard, Agent4Sci asks what kinds of progress agents can make on these tasks under in-the-wild conditions, and where they fall short. Empirically, today\u0027s frontier agents advance the published best on every benchmark, with Claude Opus reaching 10.4% mean relative improvement and no run flagged for academic misconduct. These gains, however, come almost entirely from a bag of ML-engineering tricks rather than research-level insight. Trajectory analysis surfaces three recurring limitations in this setting: novelty miscalibration, resource under-utilization, and rapid collapse into local engineering sweeps. Lightweight plug-in skills for research ideation, experiment management, and scheduled checklists raise Claude Opus from 10.4% to 20.1% and Codex from 4.4% to 8.1%, while yielding more diverse, domain-relevant interventions. Agent4Sci gives the community a way to track and push frontier agents from ML engineering toward domain insight on real-world ML-for-science problems. Code and data are available on GitHub (https://github.com/maszhongming/agent4sci) and Hugging Face (https://huggingface.co/datasets/MingZhong/agent4sci).", "arxiv_id": "2610.28763", "arxiv_url": "https://arxiv.org/abs/2610.28763", "authors": ["Ming Zhong", "Stacy Li", "Nicholas Carlini", "Matthew Jagielski"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/maszhongming/agent4sci", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.28763", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Anthropic", "pdf_url": "https://arxiv.org/pdf/2610.28763v1", "published_at": "2026-10-20", "score": 0.34, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Anthropic", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28763.png", "title": "Automating ML for Science: Can Frontier Agents Climb Scientific Hills in the Wild?", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Language-model agents that run long tasks often redo work they have already done: they re-issue a tool call they made earlier and get back exactly the same observation, a step that adds no new information. We identify this failure as a loop. Loops appear natively in Qwen, Llama, and Gemini agents and become far more common once the agent\u0027s history is compressed to fit its context window. To reduce these loops, we propose DeLoop, a self-supervised training method. DeLoop builds on a simple observation: the agent\u0027s own rollout can provide the supervision needed to learn from its loops. We use a looping action as a negative example and the first later non-looping action in the same rollout as a positive example. DeLoop learns from these pairs through direct preference optimization and does not require task rewards, gold answers, or LLM judges. On CodeGym under compression, DeLoop reduces the share of Qwen3-8B tasks containing loops from 57.3% to 6.1%. It also uses about one third as many steps per task, with similar task success. On Qwen3-32B, DeLoop reduces loops and steps while raising task success from 37.7% to 44.8%.", "arxiv_id": "2610.19376", "arxiv_url": "https://arxiv.org/abs/2610.19376", "authors": ["Tianle Chen", "Pushkar Singh", "Ketan Todi", "Biswajit Paria", "Qijia He", "Wenqi Wang", "Yuwen Tan", "Jike Zhong", "Sugato Basu", "Deepti Ghadiyaram", "Arjun Akula"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/cskyl/deloop", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.19376", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2610.19376v1", "published_at": "2026-10-14", "score": 0.334, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19376.png", "title": "DeLoop: Repeated Actions as Self-Supervision for Long-Horizon Agents", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "Cinematic video generation requires both temporal inference from limited inputs (i.e., sparse rather than frame-by-frame guidance) and factor-aware control of character, scene, action, and camera. Multimodal large language models (MLLMs) offer useful priors for both capabilities, but their representations are not automatically actionable for video generation: a Video Diffusion Transformer (DiT) may bypass them through native conditioning pathways, and using them does not ensure either factor-aware control or generation-compatible temporal prediction. We propose Factor-Aware Predictive Learning (FAPL), which establishes effective MLLM latent use as a shared prerequisite and then targets the two capabilities with complementary learning signals. First, latent-only generator grounding trains the DiT with a frozen MLLM and connector, strengthening the DiT\u0027s use of MLLM latents for generation. Second, for factor-aware control, paired videos specify a target-factor change and non-target preservation, and factor-span replacement trains the DiT to realize this relationship in its output. Third, for temporal inference, text-only and text-plus-complete-video observations share a video target, and the trained DiT is then frozen while the MLLM and connector are optimized through it. This final stage trains limited-input representations for generation while retaining complete-observation reconstruction as a complementary training mode. Extensive experiments demonstrate our consistently better performance on three cinematic video generation tasks (i.e., sparse-to-video, factor-aware editing, and multi-shot generation) over baselines and validate FAPL\u0027s contributions to MLLM feature use, temporal control, and factor coordination.", "arxiv_id": "2610.30926", "arxiv_url": "https://arxiv.org/abs/2610.30926", "authors": ["Songlin Yang", "Zhe Wang", "Xiaotong Zhao", "Xi Wang", "Ran Zhang", "Shuai Li", "Taiyi Wu", "Songlian Li", "Eric Liu", "Alan Zhao", "Anyi Rao"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Songlin1998/ShotVerse2.0", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30926", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2610.30926v1", "published_at": "2026-10-22", "score": 0.329, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (44\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30926.png", "title": "Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation", "tldr": null, "upvotes": 44, "what_it_is": null, "why_notable": null}, {"abstract": "Deep research agents synthesize open-web evidence into long reports, but current benchmarks do not evaluate research centered on a source video. We introduce Video-Centered Deep Research Report Generation. Given a video and user request, an agent identifies research questions, retrieves external multimodal evidence, and produces an interactive report linked to relevant video moments. This task has direct practical value because it helps users locate relevant moments, verify claims, reproduce demonstrated procedures, and make informed decisions from video content. We present a skill-based workflow and OmniDR-Bench for this task. For evaluation, we propose Omni Atomic Rubric Trees (Omni-ARTs). Each tree contains three dimensions, 23 shared directions, and task-specific atomic binary criteria. The directions test audiovisual grounding, multimodal evidence use, and interactive presentation. Audited Rubric Construction (ARC) builds these trees through independent evidence collection, automated checks, behavioral calibration, and iterative human review. OmniDR-Bench contains 50 Chinese and English tasks across 19 realworld subcategories. It includes 6,414 criteria. Across 18 agent configurations, the best system scores 63.3 out of 100. Current agents still need broader content coverage, stronger causal and logical analysis across modalities, and more accurate citation support. We further analyze models, harnesses, skill configurations, video categories, and research trajectories. The code and data are released at https://github.com/marinero4972/OmniDR-Bench.", "arxiv_id": "2610.31158", "arxiv_url": "https://arxiv.org/abs/2610.31158", "authors": ["Jiahao Meng", "Qize Yang", "Yuxuan Wang", "Yunfei Chu", "Wensi Dai", "Jin Xu", "Yunhai Tong"], "brief": "", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/marinero4972/OmniDR-Bench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.31158", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2610.31158v1", "published_at": "2026-10-22", "score": 0.302, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31158.png", "title": "Beyond Watching and Searching: Benchmarking Agents for Video-centered Deep Research Reports", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Agents need reliable ways to validate their outputs, both when completing tasks and when filtering synthetic training data. We study verifier generation: from the instruction and environment available for solving a task, an agent writes an executable verifier that must accept every valid solution and reject invalid ones. We introduce VerifierBench, a benchmark of 222 tasks from six agent benchmarks spanning tool-call, state-based, and code verification, with 4,993 hidden test cases that include alternative valid solutions and attacks; Verifier4Verifier (V4V), a six-check audit, screens its source verifiers and test suites. Across 19 models in a common agent harness, normalized balanced accuracy ranges from 10.6 to 62.1, with generated verifiers consistently rejecting invalid solutions more reliably than they accept valid ones. This apparent strength can mask overly restrictive verification: most false rejections in the analyzed records come from verifiers that accept no tested solution to a task. Case studies reveal unsupported assumptions about solution formats, tool use, and code changes that exclude valid solutions. These errors survive self-testing because agents test solutions that share the verifier\u0027s mistaken assumptions, or submit verifiers without confirming that any correct solution passes. These findings suggest testing both whether a verifier accepts a correct solution and whether it accepts other solutions permitted by the task. The project page and dataset are publicly available.", "arxiv_id": "2610.28679", "arxiv_url": "https://arxiv.org/abs/2610.28679", "authors": ["Jianing Yin", "Ziyi Chen", "Hao Wang", "Yiyou Sun", "Zijian Jin", "Dawn Song", "Daoan Zhang"], "brief": "", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/DwanZhang-AI/verifier-suite", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.28679", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28679v1", "published_at": "2026-10-19", "score": 0.301, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28679.png", "title": "VerifierBench: Benchmarking the Generation of Executable Verifiers for LLM Agents", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Voice style conversion (VSC) aims to transform a source utterance to match the timbre, accent, and emotion of a target voice while preserving linguistic content. StyleStream 1.0 introduced the first streamable zero-shot VSC system with state-of-the-art conversion quality, but remained limited in two ways: approximately 1s end-to-end latency on consumer hardware, and the lack of a text-based interface for designing or editing target voices. We present StyleStream 2.0, a fast and controllable streaming VSC framework that addresses these limitations. To reduce latency, we train a few-step pixel MeanFlow model and further fine-tune it with autoregressive feedback inspired by Self Forcing, improving robustness under streaming inference. This reduces end-to-end latency to 520~ms on a consumer GPU, a 2x speedup over StyleStream 1.0, while maintaining conversion quality. To enable controllable style manipulation, we remove the mel-spectrogram context and instead route target style information through a compact style embedding. In this embedding space, we train a unified text-conditioned flow matching model that supports both text-based voice design, which maps natural language prompts to voice styles, and instruction-based voice editing, which modifies a specific attribute of a source utterance while preserving the rest. Experiments show that StyleStream 2.0 achieves the strongest target style fidelity on VSC, voice design, and voice editing, while remaining competitive on intelligibility and non-edited attribute preservation.", "arxiv_id": "2610.28940", "arxiv_url": "https://arxiv.org/abs/2610.28940", "authors": ["Yisi Liu", "Nicholas Lee", "Gopala K. Anumanchipalli"], "brief": "", "categories": ["cs.SD", "cs.AI"], "github_repo": "https://github.com/Berkeley-Speech-Group/StyleStream2.0", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.28940", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "UC Berkeley", "pdf_url": "https://arxiv.org/pdf/2610.28940v1", "published_at": "2026-10-20", "score": 0.298, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Berkeley", "HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28940.png", "title": "StyleStream 2.0: Fast and Controllable Streaming Voice Style Conversion", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "LLM memory is widely used in long-term conversation understanding. Agentic memory systems often use mutation, structural organization, learned retrieval strategies, or other complex operations. Is this complexity always necessary? We study Raw-RAG, a naive RAG baseline using dense retrieval and reranking over raw history to supply evidence to a reader LLM. Across LoCoMo, LongMemEval, MEME, and MemoryAgentBench, Raw-RAG ranks first among the compared memory systems in six of seven benchmark-model settings, outperforming the strongest compared agentic memory system by 0.13-5.53 points. We investigate why raw-history retrieval remains competitive. Evidence analysis shows that its higher coverage of necessary evidence can offset lower utilization. Useful evidence includes both answer values and the relations and dependency paths needed to derive them. Even complete access to transformed memory stores leaves an accuracy gap relative to raw evidence, highlighting the importance of preserving raw information. These findings challenge the necessity of complex agentic memory for the evaluated conversation tasks and establish naive RAG as an essential baseline.", "arxiv_id": "2610.30755", "arxiv_url": "https://arxiv.org/abs/2610.30755", "authors": ["Zhengye Bao", "Shengtao Zhang", "Haokai Zhang", "Shiqi Lou", "Muning Wen", "Minnan Luo"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/Litmeb/RAW-RAG", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.30755", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Xi\u0027an Jiaotong University", "pdf_url": "https://arxiv.org/pdf/2610.30755v1", "published_at": "2026-10-22", "score": 0.298, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30755.png", "title": "Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Hierarchical language generation separates continuous semantic modeling from discrete text realization, but its effectiveness depends on what the latent space compresses and how the discrete generator uses it. We propose Cola2, a framework that jointly studies continuous semantic compression, the balance between reconstruction and generation, and continuous-discrete co-adaptation. Cola2 dynamically segments text into semantic spans, controls the compression rate through auxiliary-loss-free negative feedback, and combines reconstruction and generation supervision to learn compact, predictive latent representations. A block-causal masked diffusion decoder is trained with clean, noisy, and dropped latent conditions, while classifier-free guidance adjusts the balance between semantic reconstruction and autonomous generation. Token-prediction gradients update the encoder through the latents, whereas Flow Matching prior learning is decoupled from representation learning by stop-gradient. During inference, generated text is re-encoded under a fixed span layout to keep the latent history consistent with the actual text context. Experiments on five downstream tasks with about 210 billion training tokens validate the core designs and show competitive, unsaturated scaling. With 346.03 billion source tokens, an unconverged checkpoint reaches a 60.10 average across eight tasks and surpasses Llama-3-8B on HellaSwag and StoryCloze despite its reported pretraining budget being over 43 times larger. These results demonstrate the potential of continuous-latent hierarchical language generation.", "arxiv_id": "2610.31305", "arxiv_url": "https://arxiv.org/abs/2610.31305", "authors": ["Hongcan Guo", "Yian Zhao", "Feng Wang", "Shen Nie", "Guoqiang Wei", "Yan Zeng", "Hengshuang Zhao"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31305", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2610.31305v1", "published_at": "2026-10-22", "score": 0.289, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31305.png", "title": "Cola2: Co-Adaptive Hierarchical Language Modeling with Continuous Semantic Compression and Balanced Discrete Generation", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive self-improvement (RSI) describes a system that improves not only its behavior but also the process by which it improves. Recent digital agents test this idea by rewriting their own code and checking each version with executable tests. Bringing these mechanisms into the physical world requires learning from partial observations through costly trials, while accounting for changing operating conditions and potentially irreversible consequences. We position RSI within robot learning and trace pathways from improving robot capabilities to improving the processes that generate them. We examine how physical experience can strengthen these improvement mechanisms and when the resulting gains can support further self-improvement of the mechanisms themselves. Gains carry forward only when feedback addresses remaining learning needs, the receiving component can use the change, its value survives changes in tasks or hardware, and continued practice remains safe and affordable. Existing studies, concentrated in manipulation, support behavioral improvement, benefits to later learning, and procedure improvement. Some systems also change the improver\u0027s knowledge or tools, but the physical studies reviewed here have yet to isolate gains attributable to recursion. We synthesize these findings into evaluation principles and research directions for machines that, trial by trial, safely improve the way they improve.", "arxiv_id": "2610.29677", "arxiv_url": "https://arxiv.org/abs/2610.29677", "authors": ["Meng Luo", "Zechen Bai", "Shanqing Xu", "Yanlin Li", "Kaixin Li", "Mengchen Qian", "Weifeng Lu", "Ran Zhang", "Yingtian Zou", "Ziyang Luo", "Wei Chen", "Hongzhan Lin"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/Physical2RSI/Awesome-Physical2RSI", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.29677", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.29677v1", "published_at": "2026-10-21", "score": 0.247, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.29677.png", "title": "Toward Recursive Self-Improvement in Physical AI", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Deep research systems iteratively plan, gather evidence, synthesize, and revise, making end-to-end latency a key bottleneck for interactive use. Almost all production systems are built on autoregressive (AR) language models and inherit left-to-right decoding in planning and long-form writing. We present DiffResearch, an open multi-agent deep research framework that places a diffusion language model (dLLM) at the core of every stage, and measure how a diffusion backbone changes latency and report quality. Holding the agentic scaffold, retrieval code, prompts, and evaluation fixed, we swap the backbone between an open diffusion model and a comparable AR model. Across 100 Deep Research Bench tasks, the diffusion backbone is roughly 6 times faster end-to-end, driven by order-of-magnitude reductions in planning and writing. We further introduce dFast, a decomposition mode that reads intermediate denoising states and extracts subqueries before generation finishes, providing a 1.99 times median speedup for decomposition in isolation with no loss of report quality. On the benchmark\u0027s RACE rubric, dFast obtains the best overall score among the three configurations. Finally, in a public system-level leaderboard snapshot, an instance built on a stronger diffusion model ranks above several commercial systems. We release DiffResearch under an Apache-2.0 license.", "arxiv_id": "2610.28909", "arxiv_url": "https://arxiv.org/abs/2610.28909", "authors": ["Alan-Barsag Gazzaev", "Alexey Gavrilov", "Mikhail Mozikov", "Sergey Muravyov"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/alanrbtx/DiffResearch", "github_stars": 41, "hf_url": "https://huggingface.co/papers/2610.28909", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ITMO University", "pdf_url": "https://arxiv.org/pdf/2610.28909v1", "published_at": "2026-10-20", "score": 0.238, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28909.png", "title": "DiffResearch: Accelerating Deep Research with Diffusion Language Models", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models achieve strong performance across embodied manipulation tasks by unifying visual understanding, language conditioning, and action generation. However, long-horizon tasks can involve non-Markovian dependencies: successful decisions may require retaining task progress and past interaction outcomes, while partial observability and execution errors compound over time. Existing work has begun to address these challenges by augmenting foundation-model policies with memory and by introducing hierarchical architectures that separate high-level planning from low-level execution. We organize the high-level VLM as a robotic agent through an editable harness to maintain task context and improve planning through execution experience. We instantiate this approach as SERA (Self-Evolving Robotic Agent), with a fixed VLA executor providing low-level control. The harness maintains and updates task context using observations and execution feedback to guide subsequent planning. Self-evolution uses environment rollouts to propose and evaluate harness revisions, with the selected configuration fixed before held-out testing. On RoboMME, SERA achieves 51.38% overall success with autonomous selection, compared with 44.38% without self-evolution. Our exploration suggests that agentic planning is a promising direction for history-dependent robotic manipulation.", "arxiv_id": "2610.29560", "arxiv_url": "https://arxiv.org/abs/2610.29560", "authors": ["Tingwen Du", "Haoyu Guo", "Hanxue Zhang", "Xuanxu Wang", "Junting Dong", "Chao Gao", "Mingfei Han", "Tao Lu", "Mulin Yu", "Chunhua Shen", "Xiaojun Chang", "Zhihui Li"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/StevenKKXS/SERA", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.29560", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29560v1", "published_at": "2026-10-21", "score": 0.229, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.29560.png", "title": "From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous agents can increasingly propose ideas, modify code, and run experiments, creating an opportunity to accelerate scientific discovery using teams of collaborative AI researchers. To escape local minima in the discovery, we propose to encourage orthogonal exploration by constructing the team using agents with varying expertise. However, realizing this design requires more than diverse backgrounds. When experiments are costly, a team can test only a limited number of ideas, thereby creating the need to balance exploration and exploitation when selecting a subset of researchers to propose and execute new experiments. Furthermore, each result should shape what the team tries next. We therefore ask how AI researchers with different scientific backgrounds can build on one another\u0027s findings and sustain progress under a limited experimental budget. To address these challenges, we build a team of persistent AI researchers, each grounded in a different discipline, who keep private research histories, share experimental evidence, and receive research opportunities through adaptive allocation. We demonstrate the effectiveness of this design by deploying the team to search for linear attention architectures, where it outperforms GDN2 at 1.3B scale on language modeling, common-sense reasoning, and synthetic and real-world retrieval tasks. In controlled comparisons, removing any single organizational component from our design yields markedly weaker discoveries: without disciplinary backgrounds, the search plateaus early; without private histories, researchers make less progress despite identical shared evidence; and uniform selection falls short of adaptive allocation within the same budget. These results suggest that sustained autonomous discovery depends not only on stronger agents, but also on who explores, what they remember, and how research effort is allocated.", "arxiv_id": "2610.28887", "arxiv_url": "https://arxiv.org/abs/2610.28887", "authors": ["Yujian Liu", "Li An", "Zelin He", "Jacob Helwig", "Jiabao Ji", "Rohit Jain", "Siyu Zhu", "Shiyu Chang"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28887", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "University of California, Santa Barbara", "pdf_url": "https://arxiv.org/pdf/2610.28887v1", "published_at": "2026-10-20", "score": 0.228, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28887.png", "title": "Building AI Research Teams for Autonomous Discovery of Linear Attention Architectures", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Foundation4D, a unified feed-forward model for geometry estimation, 3D detection, semantic occupancy, and Gaussian reconstruction from multi-camera driving video. A shared backbone uses factorized spatiotemporal attention to efficiently combine observations across cameras and time. Our video inference pipeline uses pose graph optimization to refine camera trajectories and assembles object tracks across input windows. We also develop a data annotation pipeline and release PAI-Foundation4D, a benchmark with dense depth and semantic occupancy labels for 1,253 driving clips. With benchmark-specific fine-tuning, Foundation4D achieves the lowest depth AbsRel on Waymo and nuScenes, the highest detection mAP on nuScenes, and the highest occupancy mIoU on OpenOccupancy among the compared methods. Our task-combination study shows benefits for both detection and geometry: co-training detection with geometry and occupancy improves top-class mAP by 1.2 points over detection-only training, while co-training geometry with detection reduces camera-to-rig translation error by $13.4\\%$ relative to geometry-only training. We further use the predicted geometry and trajectories as priors for lidarless NuRec, supporting reconstruction of driving scenes for simulation.", "arxiv_id": "2610.30340", "arxiv_url": "https://arxiv.org/abs/2610.30340", "authors": ["NVIDIA", ":", "S\u00e9rgio Agostinho", "Maximilian Apodaca", "Emmanuel Attia", "Guillem Braso", "George Dong", "Ilya Fedorov", "Michele Fenzi", "Gang Huang", "Jiahui Huang", "Shengyu Huang", "Bingxin Ke", "Laura Leal-Taix\u00e9", "Kuan-Ting Lee", "Mingxuan Liu", "Tian Liu", "Tim Meinhardt", "Aljo\u0161a O\u0161ep", "Naveen Kumar Rai", "Kefei Ren", "Cristiano Saltori", "Keqiang Wu", "Ning Xu", "Fei Xue", "Jin-Bey Yu", "Lei Zhang", "Qunjie Zhou"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30340", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2610.30340v1", "published_at": "2026-10-21", "score": 0.225, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30340.png", "title": "Foundation4D: Towards a unified perception and reconstruction model for autonomous vehicles", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent world action models provide visual foresight and future prediction for robot manipulation, but lack explicit mechanisms for compositional skill reuse. Agentic robotics combines code-based planning and reasoning with reusable skills, but often lacks predictive grounding in physical dynamics. We introduce AW-0, an agentic world action model framework that integrates code-based planning with joint video and action prediction. We jointly model code, future video, and robot actions as three coupled generative streams within a unified mixture-of-transformers architecture. Within this architecture a code expert generates parameterized skill routines and control logic while video and action experts generate future visual states and low-level motor commands. Code serves two complementary roles: it structures multi-step prediction and control within the world model and represents skills as reusable programs for subsequent agentic execution. We further introduce an automated curation pipeline that labels robot and human video trajectories with aligned programs and consolidates recurring routines into reusable skill libraries. Evaluations on RoboTwin 2.0 and physical bimanual manipulation tasks show improved task performance over VLA and WAM baselines, alongside gains in language following, semantic reasoning and robustness, demonstrating that agentic code enables connection between planning, prediction and execution within WAMs.", "arxiv_id": "2610.30136", "arxiv_url": "https://arxiv.org/abs/2610.30136", "authors": ["Zhuoyang Liu", "Dantong Niu", "Botong Zhang", "Boning Shao", "Jing Wang", "Ruijie Zheng", "Yuvan Sharma", "Runyu Lu", "Jiaming Liu", "Renrui Zhang", "Roei Herzig", "Yutong Bai", "Ken Goldberg", "Danfei Xu", "Yuke Zhu", "Guanzhi Wang", "Linxi \"Jim\" Fan", "Trevor Darrell"], "brief": "", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30136", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30136v1", "published_at": "2026-10-21", "score": 0.223, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30136.png", "title": "Agentic World Action Models", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "As streaming video generation advances, enabling real-time interaction with generated video is becoming increasingly important. We introduce StreamEval, a unified benchmark for interactive streaming video generation spanning five tasks: avatar dialogue, avatar performance, world generation, instruction editing, and reference editing. StreamEval comprises 300 scripted test cases lasting 15-300s, each specifying initial assets, incrementally arriving multimodal requests, and explicit requirements for state changes and content preservation. Performance is assessed along four evaluation dimensions: task execution, state consistency, visual fidelity, and audiovisual coordination, instantiated through ten task-specific metrics on a 0-100 scale. Evaluating 37 distinct models across 300 test cases, we find that high visual quality and identity retention do not necessarily coincide with reliable request execution or sustained state consistency. In particular, request execution remains challenging: the highest task-specific scores are 36.90 for Following among seven avatar-performance models, 25.93 for Following in text-conditioned world generation, and 15.00 for Edit Success among three reported reference-editing models. These findings identify reliable request execution under timing and preservation constraints as a central challenge for advancing omni-modal real-time interactive systems. The leaderboard is available at https://streameval.ai", "arxiv_id": "2610.28402", "arxiv_url": "https://arxiv.org/abs/2610.28402", "authors": ["StreamEval Team"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/StreamEval/StreamEval", "github_stars": 130, "hf_url": "https://huggingface.co/papers/2610.28402", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28402v1", "published_at": "2026-10-20", "score": 0.2, "selected_reasons": ["HF trending (380\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28402.png", "title": "StreamEval: Evaluating Interactive Streaming Video Generation Models", "tldr": null, "upvotes": 380, "what_it_is": null, "why_notable": null}, {"abstract": "Policy enforcement for LLM agents has shifted from single-turn content moderation to compound, application-specific policies evaluated over multi-turn transcripts and tool-call trajectories. Fine-tuned guardrail models are efficient but degrade on compound policies, and while LLM-as-a-judge approaches achieve higher accuracy, they incur high inference cost and tend to produce unstable predictions. Neurosymbolic methods offer a natural alternative, decomposing the policy into narrow neural decisions composed under explicit logic. However, existing symbolic layers lack the required expressiveness and are optimized against fixed data rather than the policy itself. To address this, we introduce SCOPE, which compiles a policy into an executable program of neural predicates executed by small models, deterministic extractors, and code that composes their outputs. The program is optimized jointly with its training data, using adversarial generation of counterexamples that target where the program deviates from the policy. We evaluate SCOPE on a benchmark of real-world policy tasks against prompt optimization, task decomposition, and workflow generation methods, achieving the highest average accuracy across tasks and models. Programs optimized with the weakest executor transfer to other models without further optimization. This allows them to be deployed in production on inexpensive models, where they reach accuracy comparable to frontier reasoning models. Unlike these monolithic models, SCOPE produces substantially more stable predictions, and each verdict is interpretable through the predicate outputs that produced it. Additionally, we validate the key components of our method through an ablation study. SCOPE thus enables reliable, interpretable, and efficient policy enforcement at production scale.", "arxiv_id": "2610.31062", "arxiv_url": "https://arxiv.org/abs/2610.31062", "authors": ["Arnon Mazza", "Elad Levi"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31062", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Plurai", "pdf_url": "https://arxiv.org/pdf/2610.31062v1", "published_at": "2026-10-22", "score": 0.183, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31062.png", "title": "SCOPE: Compiling Natural-Language Policies into Neurosymbolic Predicate Programs", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Post-hoc image explanations usually show where a model looks using spatial heatmaps or indicate which channels matter using global channel scores. These separate views are limiting for multispectral data because channel relevance is often spatially localized and physically meaningful. We introduce Spectral-Spatial Interpretation (SSI), a full-grid attribution method over position-channel players (g,c). For each spatial position, SSI fixes the observed surrounding context, defines a conditional game over the channels at that position, and applies the Shapley value to this local game. The result is a full spectral-spatial attribution matrix rather than a single heatmap or a global channel ranking. SSI has a clear local interpretation. It satisfies Shapley fairness within each position, and aggregating its channel attributions exactly recovers the position-level contextual contrast obtained by replacing that position with the baseline. SSI also differs from context-averaged Owen-style hierarchical accounting, which uses the same position-channel grouping but averages over external spatial coalitions. On HLS Burn Scar, SSI outperforms an MC-Owen estimator across retained attribution metrics while using only about 6% of its evaluation budget. Across CUB-200, EuroSAT, and HLS Burn Scar under both per-channel mean and zero baselines, SSI achieves the best joint deletion and insertion AUC over dense, flat, and rank-1 baselines, yields the strongest spectral hit rates and channel deletion, and leads spatial localization on both annotated datasets. Code is available at https://github.com/AtheavenMa/Spectral-Spatial-Interpretation.", "arxiv_id": "2610.21114", "arxiv_url": "https://arxiv.org/abs/2610.21114", "authors": ["Haotian Ma", "Ruqi Yang", "Philip Townsend"], "brief": "", "categories": ["cs.LG", "cs.CV"], "github_repo": "https://github.com/AtheavenMa/Spectral-Spatial-Interpretation", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2610.21114", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21114v1", "published_at": "2026-10-15", "score": 0.157, "selected_reasons": ["HF trending (126\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.21114.png", "title": "Spectral-Spatial Interpretation", "tldr": null, "upvotes": 126, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier coding agents are becoming increasingly adept at 3D modeling. Yet, they still face challenges when building objects meant to be assembled in the physical world, often creating invalid assemblies with floating, colliding, or disconnected parts. We argue that providing agents with tools for assembling builds and verifying their physical feasibility is sufficient for them to produce physically valid assemblies that still adhere to input prompts. Focusing on the domain of LEGO brick builds, we present BrickWright, a framework for generating physically feasible brick builds from text or image prompts using pre-trained agents, where a build is physically feasible if it uses only real parts, has no colliding or floating parts, and forms a connected structure if possible. BrickWright guides agents to create builds by writing code with BrickLayer, a Python toolkit with two main components: an ergonomic brick assembly API that halves inference cost compared to working in raw LDraw, and a validator that provides feedback on physical feasibility. Whereas baseline agents achieve physical validity rates ranging from only 9% (GPT-6 Luna) to 69% (GPT-6 Astra), BrickWright-guided agents achieve 100% validity on a sample of 512 prompts, while improving prompt adherence for lightweight agents and maintaining it for stronger agents. Additionally, they outperform specialized models on the text-to-brick task. Code is available on our project page: https://avalovelace1.github.io/brickwright/", "arxiv_id": "2610.31651", "arxiv_url": "https://arxiv.org/abs/2610.31651", "authors": ["Ava Pun", "Kevin Dai", "Sally Chen", "Maxwell Jones", "Ruixuan Liu", "Kangle Deng", "Changliu Liu", "Maneesh Agrawala", "Deva Ramanan", "Jun-Yan Zhu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31651", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31651v1", "published_at": "2026-10-22", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "BrickWright: Agentic Creation of Physically Feasible Brick Builds", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Complex camera motion is central to visual storytelling, yet translating cinematographic intent into controllable, executable camera trajectories remains challenging. We introduce FilmFlow, an agentic framework that converts natural-language instructions or reference videos into explicit camera trajectories for dynamic 3D environments. To generate these trajectories, a Director agent constructs executable camera plans by composing high-level motions from concurrent atomic operations that jointly control translation, rotation, and framing. The Director is supported by three specialized agents: an Interpreter that extracts scene-grounded cinematographic intent, a Scout that selects initial viewpoints, and a Critic that evaluates rendered results and provides visual feedback for iterative plan refinement. We also introduce CinemaBench, comprising 150 Blender scenes from self-created and licensed sources, with five camera instructions per scene for 750 text-directed tasks and 60 reference videos associated with a subset of scenes. CinemaBench supports evaluation of both text-directed camera generation and video reference-directed camera generation. Across a diverse set of evaluated baselines, FilmFlow achieves the strongest benchmark performance and the highest user preference, demonstrating effective spatial reasoning, temporal coordination, and visual composition for executable 3D cinematography.", "arxiv_id": "2610.30753", "arxiv_url": "https://arxiv.org/abs/2610.30753", "authors": ["Yiming Zhang", "Jiarui Guo", "Haojia Wei", "Yifei Liu", "Yifan Yang", "Hongjie Zhang", "Xue Yang", "Zhihang Zhong"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30753", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30753v1", "published_at": "2026-10-22", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "FilmFlow: Agentic System for 3D Virtual Film Cinematography", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in text-to-video generation have substantially improved visual fidelity, yet existing models still struggle to understand the physical evolution implicit in user prompts, making it difficult to generate videos with continuous physical state evolution. Here, we propose PhyEvolve, a multi-agent framework that enhances natural-language prompts through structured state-evolution planning. PhyEvolve consists of three agents: a Director, a Physical Evolver, and a Composer. Given a user prompt and an optional first frame, the Director grounds the scene and disentangles physical events from observation changes. The Physical Evolver uses scene evidence to identify physical mechanisms then constructs causally linked state transitions that unfold throughout the video, whether visible or not. The Composer utilizes these transitions to enhance the original prompts. Without retraining or model modification, PhyEvolve works directly with existing generators through prompt replacement. Extensive experiments on four major benchmarks show that PhyEvolve achieves state-of-the-art performance, outperforming the cutting-edge prior agentic baseline by 7.9 percentage points on average. These results demonstrate that explicit causal state-evolution planning improves physical consistency and state continuity in generated videos through natural-language prompt enhancement.", "arxiv_id": "2610.30717", "arxiv_url": "https://arxiv.org/abs/2610.30717", "authors": ["Yang-Hao Zhou", "Lixing Tan", "Zhiqi Li", "Guang Yang", "Xiao Yang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30717", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30717v1", "published_at": "2026-10-22", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PhyEvolve: Multi-Agent State-Evolution Planning for Physics-Aware Video Generation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose AgentDreamer, an agent-guided optimization framework that aligns text instructions with simulated motion through explicit 3D motion planning. Given a text instruction and scene geometry, an off-the-shelf agent translates the instruction into a structured semantic motion prior, specifying what should move, in which direction, and in what temporal order. The agent represents this prior using parametric functions over a series of temporal chunks, yielding dense 3D trajectories. We then optimize the parameters of a differentiable MPM simulator such that its rollout best matches the prior while remaining constrained by the scene dynamics. This allows the agent to provide semantic guidance from language, while the simulator grounds it in physically feasible motion. We further introduce Motion-IG, an information-theoretic metric for text-motion alignment based on masked text recovery. By comparing the likelihood of recovering masked motion-related content with and without the simulated motion, Motion-IG measures the information contributed by the motion beyond that available from the remaining text and scene context. Experiments show that AgentDreamer improves text alignment over video-based guidance, producing simulations that more closely follow the requested physical behavior.", "arxiv_id": "2610.30679", "arxiv_url": "https://arxiv.org/abs/2610.30679", "authors": ["Mijeong Kim", "Suho Park", "Junha Park", "Bohyung Han"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30679", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30679v1", "published_at": "2026-10-22", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AgentDreamer: Agentic 3D Motion Reasoning for Text-Controllable Physics Simulation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite substantial progress in Deep Search agents, their ability to conduct end-to-end research in real-world open Web environments remains insufficiently evaluated. Unlike static retrieval settings, information on the real-world Web is distributed across diverse sources, modalities, and heterogeneous formats, often involving complex interaction mechanisms that require agents to autonomously search for, access, and integrate relevant evidence during execution. To address this gap, we introduce the OpenDS task, designed to evaluate agents\u0027 ability to perform multi-step deep search in the live, open Web. This task requires agents to autonomously explore the real Web, discover and connect relevant evidence from multiple independent sources through Web search, browser interaction, and evidence processing, and ultimately determine a unique factual answer. Building on this task formulation, we construct OpenDS-World, a benchmark comprising 200 challenging tasks spanning diverse information modalities, heterogeneous file formats, and interactive access requirements, with independent human verification to ensure evidence validity and answer uniqueness. We evaluate 12 frontier models under a unified tool environment and execution protocol. The best-performing model achieves 39.0% accuracy, while human evaluation across 1,000 independent attempts yields 21.1% accuracy. Further analyses of tool usage, search cost, termination behavior, and failure recovery reveal substantial differences in research strategies across models, as well as persistent challenges in tool coordination and long-horizon search management. OpenDS-World provides a unified evaluation platform for systematically assessing and advancing agents\u0027 autonomous deep search capabilities in real-world open Web environments.", "arxiv_id": "2610.30181", "arxiv_url": "https://arxiv.org/abs/2610.30181", "authors": ["Xiaomin Yu", "Hongliang Chen", "Zhe Huang", "Shilin Yan", "Shao-Rong Su", "Xuqiao Ma", "Feiyang Wang", "Jiayu Chen", "Jiwei Fang", "Yu Yan", "Yini Huang", "Chen Chen", "Ruoxi Cheng", "Yuzhi He", "Yuhui Zhang", "Xiaoxing Hu", "Chen Liu", "Jianbo Lin", "Yijiang Li", "Xiaobin Hu", "Menglong Li", "Zhuoran Lu", "Weishi Wang", "Zhongqi Yue", "Chengwei Qin"], "brief": "", "categories": ["cs.IR", "cs.MM", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30181", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30181v1", "published_at": "2026-10-19", "score": 0.11, "selected_reasons": ["HF trending (56\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30181.png", "title": "Deep Search in Real-World Web Environments", "tldr": null, "upvotes": 56, "what_it_is": null, "why_notable": null}, {"abstract": "We present WorldStream, an open-ended 3D world model with three simultaneous capabilities: it extends playable terrain beyond any pre-specified map, acts on open-ended language in the running world, and restores visited places with their edits. A hierarchical planner over a typed decision model emits structured decision state: Macro fixes settlement, ecology, transport, and hydrological structure across a group of tiles; Micro specializes that contract into tile semantics under measured terrain and accepted neighbor commitments. Deterministic local code compiles accepted plans into terrain, roads, settlements, vegetation, and entities. Streaming separates their reach: plans run ahead along the predicted corridor, compilation only where movement will soon need it, geometry behind the user released. One world record retains plans, seeds, object identities and mutable state, boundary commitments, and edits by attribute, revised as the user advances and edits; returning tiles recompile from it. The same record grounds interaction: the model acts on existing entities, including stateful NPCs that update as they act, edits the present region, or attaches intent to unplanned regions. Together they yield a world expanding under bounded budgets, connected across independently planned tiles, and interactive.", "arxiv_id": "2610.28827", "arxiv_url": "https://arxiv.org/abs/2610.28827", "authors": ["Xiaoxiao Ma", "Weiyang Jin", "Yanwen Ma", "Haoran Li", "Zhixiang Wei", "Songchun Zhang", "Yaowei Li", "Junhao Zhuang", "Zeyue Xue", "Yuming Li", "Zheming Fu", "Haoyang Huang", "Nan Duan", "Feng Zhao"], "brief": "", "categories": ["cs.CV", "cs.GR"], "github_repo": "https://github.com/krennic999/WorldStream", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2610.28827", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28827v1", "published_at": "2026-10-20", "score": 0.092, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28827.png", "title": "WorldStream: Streaming Interactive 3D Worlds with Hierarchical Planning and Persistent State", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models need effective ways to acquire and use external knowledge beyond what they retain from pretraining. Continued pretraining risks catastrophic forgetting, while retrieval at inference time can add substantial overhead. External parametric memory avoids online retrieval, but constructing its training data requires extensive offline search, and output-level interpolation provides only shallow fusion. We introduce Deep Fusion Memory (DFM), a parametric memory architecture that reduces this construction workload and incorporates learned memory into intermediate hidden states. A causal memory predictor learns to generate memory from the preceding context, using retrieved chunk embeddings from the corpus as supervision. The predicted memory is shared across tokens within each chunk and fused into their hidden states through gated cross-attention. Memory prediction and fusion are trained end to end with the backbone frozen, and inference requires no explicit retrieval. Compared with existing parametric memory approaches, which often construct token-level memory targets, DFM requires $32\\times$ fewer retrieval queries and $2048\\times$ fewer retrieved items to construct its training data. Across six QA tasks, DFM performs better over the strongest baseline by 12.71% on Mistral-7B-v0.3 and 11.19% on Qwen3-8B-Base. Beyond QA, domain adaptation yields average gains of 6.51 and 4.38 points over Qwen3-4B-Base and Qwen3-8B-Base, respectively.", "arxiv_id": "2610.25100", "arxiv_url": "https://arxiv.org/abs/2610.25100", "authors": ["Rubin Wei", "Siyuan Sun", "Hao Sun", "Yuliang Liu", "Xiang Shi", "Jiarui Wang", "Junming Zhang", "Zhouhan Lin"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25100", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25100v1", "published_at": "2026-10-18", "score": 0.089, "selected_reasons": ["HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25100.png", "title": "Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "Sequence compression is a fundamental operation and a critical information bottleneck in efficient language and multimodal models, and yet prevailing approaches based on pooling or learned projections remain underperforming. We revisit sequence compression through the lens of test-time regression: input tokens define a regression problem whose fitted coefficients form the compressed representation. Importantly, the regression problem is learned end-to-end via backpropagation, while its coefficients are computed efficiently in closed form during the forward pass. This leads to TTR-Compressor, a general alternative to conventional pooling and projection-based compression. We evaluate TTR-Compressor as the compressor for block-wise sparse attention and the visual token merger for multimodal large language models. On block-wise sparse attention, TTR-Compressor improves RULER performance over attention-based compressors by a large margin. For visual token merging, it consistently outperforms the standard MLP merger and matches its performance with 55.6% fewer visual tokens. These results establish test-time regression as an effective primitive for sequence compression in efficient language and multimodal models.", "arxiv_id": "2610.31574", "arxiv_url": "https://arxiv.org/abs/2610.31574", "authors": ["Sihan Yang", "Jie Huang", "Hanxuan Li", "Yifan Guo", "Weigao Sun", "Yiran Zhong", "Weiyang Liu"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/Sphere-AI-Lab/ttr-compressor", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.31574", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "CUHK SphereLab", "pdf_url": "https://arxiv.org/pdf/2610.31574v1", "published_at": "2026-10-22", "score": 0.077, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31574.png", "title": "Rethinking Sequence Compression with Test-time Regression", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "We present Qwen-Audio-3.1-ASR, a family of audio-language models that builds upon its predecesor Qwen-Audio-3.0-ASR with improved speech recognition and expanded capabilities in speaker-diarized transcription and general audio understanding. The family retains support for 30 languages and 16 Chinese dialects, together with instruction-controlled capabilities including historical-context conditioning, hierarchical hotword customization, and native transcription polishing. Speaker-diarized ASR produces structured outputs containing speaker labels, timestamps, and recognized text, maintaining consistent speaker labels across turns and the representation of overlapping speech. The general audio understanding capabilities cover audio-, speech-, and music-captioning, temporal grounding and sound event detection, as well as audio question answering and multiple-choice reasoning. These tasks broaden the application scope from recognizing spoken words to interpreting speakers, acoustic events, and their temporal relations. To accommodate different deployment requirements, the family includes variants for asynchronous file transcription, low-latency streaming, interactive voice input, and non-streaming recognition, with speaker-diarized transcription and general audio understanding available in certain variants. Evaluations span conventional ASR, multilingual and dialectal speech, speaker-diarized transcription, and general audio understanding, demonstrating the capabilities of the Qwen-Audio-3.1-ASR family across transcription and broader audio analysis tasks.", "arxiv_id": "2610.28711", "arxiv_url": "https://arxiv.org/abs/2610.28711", "authors": ["Chuanmeng Bian", "Daren Chen", "Peixin Chen", "Zhigao Chen", "Chong Deng", "Zhiyun Fan", "Zhifu Gao", "Bo Gong", "Qing Gu", "Jiajun He", "Yawei Hu", "Yunjie Ji", "Wei Ju", "Jingbei Li", "Xiangang Li", "Xu Li", "Zengxi Li", "Zheng Li", "Chengdong Liang", "Baiji Liu", "Yaming Liu", "Ying Liu", "Bin Ma", "Yiping Peng", "Yuezhang Peng", "Zhendong Peng", "Yu Pu", "Yang Shi", "Xin Shu", "Jian Tang", "Biao Tian", "Peiyao Wang", "Tianzi Wang", "Wen Wang", "Wupeng Wang", "Cheng Wen", "Yuzhong Wu", "Zijian Xia", "Yunchong Xiao", "Nan Yang", "Jianwei Yu", "Jixing Yu", "Binbin Zhang", "Lei Zhang", "Sitong Zhao", "Guangdong Zhou", "Yuan Zhou", "Jianheng Zhuo"], "brief": "", "categories": ["cs.SD", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28711", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28711v1", "published_at": "2026-10-20", "score": 0.071, "selected_reasons": ["HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28711.png", "title": "Qwen-Audio-3.1-ASR Technical Report", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion language models form answers through a sequence of revisable continuous states, but multi-agent systems usually discard those states and make agents communicate only after decoding text. We ask whether one independent diffusion trajectory can pass a compact hidden message into another and, crucially, whether the receiver uses what that message means. In Hidden Messages, a sender compresses its denoising state into four signed dense vectors; the receiver consumes them while retaining its own context, canvas, and trajectory. Removing a message tests whether the channel matters; replacing it with a message from another example tests whether its content matters. Across controlled tasks, derangement removes a +63.6-point advantage on Tiny-A2D and a +100.0-point advantage on Dream-7B, while targeted substitutions steer the receiver toward the substituted fact. On QASC with the two supporting facts split across agents, matched communication reaches 80.8%, but a wrong-example message lowers accuracy to 46.8%, a content effect of +34.0 points. The surprising result is temporal: one late transfer reaches 87.8%, exceeding four recurrent exchanges by +7.0 points. These experiments provide causal evidence for continuou
