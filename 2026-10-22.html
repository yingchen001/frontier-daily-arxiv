s hidden communication between diffusion-LM agents and show that when information is transferred can matter more than how many times agents exchange it.", "arxiv_id": "2610.28905", "arxiv_url": "https://arxiv.org/abs/2610.28905", "authors": ["Alan-Barsag Gazzaev", "Alexey Gavrilov", "Sergey Muravyov", "Ilya Makarov"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/alanrbtx/hidden-messages-diffusion-agents", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.28905", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ITMO University", "pdf_url": "https://arxiv.org/pdf/2610.28905v1", "published_at": "2026-10-20", "score": 0.068, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28905.png", "title": "Hidden Messages Between Diffusion Language Model Agents: Causal Evidence for Latent Communication", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Code-based video generation offers fine-grained control, targeted editing, and component reuse compared with direct video generation. This approach requires multimodal large language models (MLLMs) to translate visual and temporal requirements into executable programs that produce complete videos. However, existing code-based benchmarks primarily target specialized tasks, leaving complete video creation across diverse creative categories and input modalities insufficiently evaluated. We introduce Code2Video-Compass, a general-purpose benchmark for code-based video generation across text-to-video (T2V), image-to-video (I2V), and video-to-video (V2V) settings. Code2Video-Compass comprises 2,104 tasks spanning 10 categories, 24 subtypes, and three complexity dimensions covering construction, dynamic animation, and state dependency. It combines tasks curated from textual instructions and visual references with corresponding T2V, I2V, and V2V tasks derived from complete professional and user-created videos. We propose a dual-level evaluation framework combining 12 objective metrics and five subjective metrics. Objective evaluation covers operational performance, video quality, text-video alignment, and reference fidelity, while subjective evaluation uses an MLLM judge to evaluate instruction following and holistic video quality. Extensive evaluation of 15 recent proprietary and open-weight MLLMs from nine families reveals that even leading models face challenges in reliably generating high-quality complete videos aligned with textual and visual requirements, with performance generally declining as construction, dynamic animation, and state-dependency complexity increases. We anticipate that Code2Video-Compass will advance reliable, coherent, and controllable code-based video generation and inspire broader progress in programmatic visual creation.", "arxiv_id": "2610.28416", "arxiv_url": "https://arxiv.org/abs/2610.28416", "authors": ["Zhenghan Chen", "Zekai Shao", "Xin Lin", "Leting Cheng", "Siming Chen"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/code2video-compass/Code2Video-Compass", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.28416", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2610.28416v1", "published_at": "2026-10-20", "score": 0.068, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28416.png", "title": "Code2Video-Compass: A Comprehensive Benchmark for General-Purpose Code-Based Video Generation across T2V, I2V, and V2V", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in video generation have made synthetic videos increasingly realistic, placing greater demands on reliable AI-generated video detection. Existing artifact-based detectors typically identify generation artifacts as evidence for source prediction, yet they may either fail to recognize subtle artifacts or reach the correct source decision without faithfully identifying the evidence underlying it. In this work, we systematically investigate how to design and train effective artifact detectors and formulate artifact detection as a structured process comprising three complementary capabilities: Inspection Planning, which determines what should be examined; Evidence Verification, which verifies whether the inspected content exhibits genuine generation artifacts; and Evidence Aggregation, which integrates the verified evidence into the final source decision. Building on this formulation, we introduce Verus-Insight, trained with human-anchored full-process supervision and progressive capability training to strengthen both fine-grained artifact detection and video-level detection. We further introduce Verus-Bench, a benchmark with fine-grained human annotations of perceptible artifacts for evaluating artifact detection. Extensive experiments across diverse benchmarks demonstrate that Verus-Insight achieves strong performance in both fine-grained artifact analysis and AI-generated video detection, with substantial gains in recovering human-perceived artifacts. Further analyses reveal that the three capabilities are complementary yet distinct, and that Verus-Insight more reliably converts relevant inspection targets into supported artifact evidence without increasing spurious artifact claims.", "arxiv_id": "2610.30866", "arxiv_url": "https://arxiv.org/abs/2610.30866", "authors": ["Zhuoran Zhang", "Yang Shi", "Qixun Wang", "Tengfei Liu", "Yuqi Tang", "Xuanyu Zhu", "Yizhuo Jia", "Jingyun Hua", "Shixuan Liu", "Xianghua Ying", "Haotian Wang", "Yuanxing Zhang", "Pengfei Wan", "Wenjing Yang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/zhangzhuoran997997/Verus-Insight", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.30866", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.30866v1", "published_at": "2026-10-22", "score": 0.065, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30866.png", "title": "Verus-Insight: Towards Explainable Artifact Detection in AI-Generated Videos", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "People adapt how they talk to the person in front of them. However, chat models tend to respond in Standard English regardless of the dialect used by the user. A uniform answer can hide whether training treats these users alike, and output audits cannot tell as well. We trace how each post-training stage, from supervised fine-tuning (SFT) to preference optimization (DPO) and reinforcement learning, changes a model\u0027s tendency to match the user, and read what each update prefers from two content-matched replies, one matching the user and one not. Across 10 open model lineages, post-training standardizes replies to every informal cue, yet after adjusting for how likely each reply already was, the DPO update still favours matching British and Australian spelling over AAE and Singlish on 10 lineages, and models still produce AAE features when asked. We then introduce calibrated accommodation pairs (CAP), preference data that reward matching users\u0027 dialect density while preserving Standard English for Standard-English users. On a fully open model, CAP raises convergence on features it was not trained on without a detectable increase in dialect for Standard-English users or a cost in instruction following. In contrast, one-sided pairs reach a similar gain only by overshooting the user and imposing dialect. Our findings show that uniform replies can hide selective updates and audits should read the update as well as the output. Code: https://github.com/kouzhizhuo/cap-accommodation.", "arxiv_id": "2610.28474", "arxiv_url": "https://arxiv.org/abs/2610.28474", "authors": ["Zhizhuo Kou", "Heming Li", "Jian Yang", "Junyu Luo", "Jingshu Peng", "Sirui Han", "Yike Guo"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/kouzhizhuo/cap-accommodation", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28474", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28474v1", "published_at": "2026-10-20", "score": 0.062, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28474.png", "title": "Answering in the User\u0027s Variety: Calibrated Accommodation Pairs for Post-Training", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Selecting intermediate features from a frozen diffusion model for discriminative tasks is non-trivial because the useful signal is distributed across the denoising trajectory, network depth, and channels. In practice, this requires choosing a timestep, a block, and a channel subset. Existing methods either fix these choices by hand or optimize only a few extraction hyperparameters, most often the timestep, then reuse the same rule across inputs and budgets. We introduce Policy-Mask, a budget-conditioned policy trained on the downstream objective that jointly selects all three under a prescribed channel budget. Without normalization, the channel-score contribution grows with the number of selected channels and dominates the timestep and block updates. We normalize it by subset cardinality, keeping the three policy heads on comparable scales and stabilizing joint training. At matched budgets, Policy-Mask improves over fixed extraction and feature-filter baselines across segmentation, classification, and semantic correspondence, reaching 38.9 mIoU on ADE20K, 75.4% top-1 on CIFAR-100 at 128 dimensions, and 76.3 PCK@0.1 on SPair-71k. Component-wise ablations show that block selection materially affects downstream accuracy, and the highest recorded channel-budget score occurs at 256 retained channels, identifying a practical operating point for compact diffusion representations. We further adapt Policy-Mask to diffusion transformers, including PixArt-$\u03a3$ and SD3.5 MMDiT, by replacing U-Net channels with image-token hidden dimensions.", "arxiv_id": "2610.28889", "arxiv_url": "https://arxiv.org/abs/2610.28889", "authors": ["Ivan Listopadov", "Maksim Nakhodnov", "Aibek Alanov"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.28889", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28889v1", "published_at": "2026-10-20", "score": 0.051, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28889.png", "title": "Policy-Mask: Budget-Aware Adaptation of Diffusion Features to Discriminative Tasks", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Video foundation models have advanced rapidly in understanding and generating visual sequences, while video world models seek to capture the underlying dynamics of the world they depict. Despite their different objectives, both concern the relationship between video observations and an evolving world. This survey adopts world modeling as a unifying lens for examining these developments. Viewing an observed video as a partial, lossy, and temporally ordered projection of a latent temporal world, we organize the literature around four complementary operations: reading infers world properties from observed video; writing synthesizes video from specified or learned world conditions; sharing integrates understanding and generation through common modeling mechanisms; and interacting predicts and updates world states under actions and evolving observations. This perspective distinguishes temporal coherence in observed or generated sequences from consistency in the underlying world state. Across tasks, representations, models, datasets, and benchmarks, we trace a shift in emphasis from clip-level recognition and perceptual fidelity toward persistent state, controllable evolution, physical and causal validity, and evaluation grounded in interaction and downstream decisions, and we distill the open challenges that follow.", "arxiv_id": "2610.31668", "arxiv_url": "https://arxiv.org/abs/2610.31668", "authors": ["Shengqiong Wu", "Meng Luo", "Bobo Li", "Ziwei Liu", "Shuicheng Yan", "Ming-Hsuan Yang", "Philip Torr", "Hao Fei"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31668", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31668v1", "published_at": "2026-10-22", "score": 0.036, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31668.png", "title": "Reading, Writing, Sharing, and Interacting with the World through Video", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) is credited with teaching reasoning models to write {wait} before reconsidering a step, yet large RL accuracy gains do not require the word. This view can confuse what RL discovers with what a model inherits from its training data. We trace the word through open models\u0027 training histories, reading it with label-free indices of frequency, position, form and usage and an injected-error test, all computed from sampled outputs. We find that zero-RL almost never coins the marker: on bases that lack the word, RL raises MATH-500 accuracy substantially while {wait} stays near absent. It arrives with training data: mid-training in OLMo-3, and fine-tuning on reasoning traces installs it in most models whose base lacks it. Where the base already uses it, both released RL-Zero recipes (OLMo-3, MiMo) multiply it, whereas KL-free GRPO from the same base does not; OLMo-3\u0027s recipe wears down its form and makes it a more sensitive but more liberal alarm; RL after supervised fine-tuning barely changes it, and our GRPO recipe erases a marker seeded by fine-tuning. Finally, we show that marker frequency alone does not indicate RL-induced reasoning and caution against LLM-as-a-judge revision metrics, as automated judges can reverse human-labelled trends.", "arxiv_id": "2610.30882", "arxiv_url": "https://arxiv.org/abs/2610.30882", "authors": ["Zhizhuo Kou", "Sizai Hou", "Long Chen", "Jian Yang", "Junyu Luo", "Jingshu Peng", "Wenkai Zhang", "Sirui Han", "Yike Guo"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/kouzhizhuo/wait-provenance", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30882", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "HUAWEI Noah\u0027s Ark Lab", "pdf_url": "https://arxiv.org/pdf/2610.30882v1", "published_at": "2026-10-22", "score": 0.033, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30882.png", "title": "Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "This paper studies category-level RGB-D object pose estimation, which recovers an object\u0027s 3D rotation and translation without instance-specific CAD models or reference views. This task is highly ambiguous due to intra-class variations, symmetries, and partial observations. Current solutions struggle to balance reliability and efficiency: methods based on intermediate structures are prone to error propagation, while diffusion models suffer from high inference latency and complex post-hoc candidate extraction. To address this, we present F2G-Pose, a real-time direct, single-pass framework that predicts category-level pose, metric size, and camera-frame completed shape from a single RGB-D observation in one feed-forward pass. F2G-Pose lifts dense visual foundation features to partial point clouds, encodes local geometry with DGCNN tokenization, and integrates object-level structure with a Mixture-of-Experts Transformer. Joint size prediction and camera-frame shape completion encourage metric consistency through dense geometric supervision. With its task-specific network trained only on pose-annotated synthetic SOPE data and its frozen RADIO backbone externally pretrained, F2G-Pose achieves state-of-the-art accuracy on SOPE and ROPE while running at 28 FPS for pose-only inference, and further demonstrates strong camera-frame geometry on HouseCat6D and real-object transfer on HANDAL. Analyses of latency, robustness, shape completion, and GenPose++ candidate behavior further demonstrate the efficiency and reliability of F2G-Pose, with real-world manipulation experiments demonstrating deployment potential under segmented RGB-D inputs. The project page, code, and pretrained models are made available at https://jrryzh.github.io/F2G-Pose/.", "arxiv_id": "2610.31623", "arxiv_url": "https://arxiv.org/abs/2610.31623", "authors": ["Jinyu Zhang", "Haitao Lin", "Jiashu Hou", "Xiangyang Xue", "Yanwei Fu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/jrryzh/F2G-Pose", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31623", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Shanghai Innovation Institute", "pdf_url": "https://arxiv.org/pdf/2610.31623v1", "published_at": "2026-10-22", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31623.png", "title": "F2G-Pose: Geometry-Aware Foundation Feature Lifting for Direct RGB-D Category-Level Object Pose Estimation", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "AI coding agents can now build small playable games in minutes, but the results usually look like programmer art: gray blockouts, colored geometric primitives, and flat semantic blobs. We present AnyGameRenderer, a video-to-video generative renderer that turns such footage into high-quality visuals with characters, motion detail, and effects. Throughout, it keeps the layout, camera, and every entity\u0027s position and timing intact. Our AnyGameRenderer generalizes across a wide range of genres that agents build, such as tower defense, auto-battlers, top-down survivors, turn-based battles, kart racing, and crowd runners. AnyGameRenderer takes plain video as its game-state input, with no complex representations such as engine G-buffers, per-object class labels, or low-poly proxies. Gray blockouts, colored primitives, semantic maps, and wireframes all work as input. It also preserves entity correspondence: group counts stay correct, and entities appear and disappear on the right frame. We implement AnyGameRenderer by LoRA fine-tuning MiniMax-H3 ref2va, a 33B reference-video-conditioned video generation model. Training uses $\\sim$10k paired clips from three sources: (i) multi-stream rendering data from 38 agent-made games exported from GEAR, an AI game-creation tool; (ii) two-stream rendering data from Unreal Engine, with programmatically controlled crowds, count changes, and entity scales; and (iii) real gameplay recordings, with pairs reconstructed via 3D-box detection. To evaluate the entity correspondence, we propose an entity-level benchmark of 59 held-out cases with 753 entities, scored against ground-truth boxes. Compared with the base model, AnyGameRenderer better preserves entity correspondence: temporal match rises from 50.9\\% to 62.9\\%, missed count changes fall from 34.7\\% to 21.3\\%, and fewer entities are hallucinated or left unrendered.", "arxiv_id": "2610.31466", "arxiv_url": "https://arxiv.org/abs/2610.31466", "authors": ["Ruicong Liu", "Liangyang Ouyang", "Fengbo Lan", "Zhixiang Wang", "Kaipeng Zhang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/AlayaLab/AnyGameRenderer", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31466", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Alaya Lab", "pdf_url": "https://arxiv.org/pdf/2610.31466v1", "published_at": "2026-10-22", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31466.png", "title": "AnyGameRenderer: Entity-Consistent Generative Rendering Across Games and an Entity-Level Benchmark", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Robot world models simulate how environments evolve in response to robot actions. Latent action models enable learning dynamics from videos by encoding visual transitions as proxy actions. However, reconstruction-driven latent actions mix robot motion with object responses and other scene changes, complicating their correspondence with robot controls. We propose SkeLAM, a skeleton-guided latent action model for controllable robot world modeling. SkeLAM decomposes latent actions into a kinematic component grounded by robot skeleton supervision and a residual component retaining complementary visual dynamics. Cross-modal swap reconstruction encourages RGB-derived and skeleton-derived kinematic representations to be interchangeable during video reconstruction. The world model incorporates both components through separate conditioning pathways, while branch dropout reduces its dependence on future-derived residual information. A lightweight adapter maps robot actions to the kinematic space, and subsequent world-model fine-tuning adapts generation to these predicted conditions. At inference, the model generates future observations from the current observation and robot actions. On DROID, SkeLAM reduces end-effector ADE by 19.5% and LPIPS by 11.1% compared with DreamDojo. Motion probing supports kinematic specialization, while qualitative results demonstrate zero-shot human-to-robot motion transfer in generated rollouts. Policy evaluation shows agreement between predicted success rates and those measured in real robot executions.", "arxiv_id": "2610.31474", "arxiv_url": "https://arxiv.org/abs/2610.31474", "authors": ["Qi Lv", "Jiayi Lin", "Yuxin Jiang", "Jianzong Wang", "Xiang Deng", "Mike Shou Zheng"], "brief": "", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31474", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31474v1", "published_at": "2026-10-22", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31474.png", "title": "Skeleton-Grounded Latent Action Model for Robot World Models", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) have emerged as a promising approach to learning generalist robot policies using rich spatiotemporal priors from pre-trained video diffusion models. A recent line of WAMs improves inference efficiency by conditioning a separate action decoder on intermediate future video representations extracted from a single denoising step, avoiding costly iterative denoising required for video generation. This design makes action prediction depend directly on the quality of these future representations. In this paper, we introduce Future REpresentation learning via self-Distillation with temporal context (FRED), a framework that trains WAMs to improve the quality of future video representations from noise in a single denoising step. Specifically, FRED uses self-distillation to predict future representations from noise, using representations extracted from ground-truth future observations as targets. We further condition the video model on historical observations, providing temporal context for predicting future representations better. Across diverse real-world manipulation scenarios, FRED consistently outperforms competing WAMs. It achieves particularly large gains on long-horizon and out-of-domain tasks under zero-shot environment generalization, and substantially improves human-to-robot skill transfer, reaching 50.0% task success on tasks absent from robot training data and demonstrated only in human videos, compared with 19.4% for the best competing WAM.", "arxiv_id": "2610.30320", "arxiv_url": "https://arxiv.org/abs/2610.30320", "authors": ["Huiwon Jang", "Suhyeok Jang", "Hyeonmo Kang", "Seungku Kim", "Jinwoo Shin", "Sihyun Yu"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/suhyeok-jang/FRED", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.30320", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2610.30320v1", "published_at": "2026-10-21", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30320.png", "title": "Self-Distilling Future Video Representations for World Action Models", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Expanding the vocabulary of conditional text-to-speech (TTS) models typically requires extensive fine-tuning with paired audio, creating a major bottleneck for low-resource and cross-lingual adaptation. To address this, we introduce SEAM, a zero-audio initialization method that constructs embeddings for unseen tokens from known subtokens. Unlike standard pooling strategies that ignore sequential structure, SEAM applies a spectral filter to preserve temporal phonetic order and uses closed-form ridge regression to align the new embeddings with the pretrained conditioning manifold. Across three languages and two TTS architectures, SEAM approaches or matches baseline performance using up to four times less training data, reducing sample complexity by 75\\% compared to random initialization and mean pooling. Our approach provides a lightweight, reproducible, and theoretically grounded solution for vocabulary expansion in low-resource speech synthesis.", "arxiv_id": "2610.26252", "arxiv_url": "https://arxiv.org/abs/2610.26252", "authors": ["Walaa Othman", "Baher Mohammad", "Stamatios Lefkimmiatis", "Ammar Ali"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.26252", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ITMO University", "pdf_url": "https://arxiv.org/pdf/2610.26252v1", "published_at": "2026-10-19", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.26252.png", "title": "SEAM: Spectral Embedding Alignment and Merging for Low-Resource TTS", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Controllable 3D part generation is pivotal for digital asset creation, yet existing methods lack the flexibility to accommodate diverse user workflows requiring varying levels of control. In this paper, we introduce FlexPart, a unified image-to-3D part generation framework that supports variable-granularity geometric conditions within a single model. By seamlessly integrating heterogeneous inputs, ranging from sparse points to dense bounding boxes and masks, via gated adaptive modulation, FlexPart unlocks a powerful cross-modal synergy. We also propose an asymmetric geometric guidance mechanism that leverages strong spatial priors to align representations across granularities, improving geometric consistency and facilitating inter-task synergy. Under mask conditioning on PartVerseXL, FlexPart reduces Part CD by 16.6% relative to TripoSG + SAM3D and by 10.5% relative to OmniPart, while maintaining competitive whole-mesh quality. The code can be found at https://github.com/Gucci233/FlexPart", "arxiv_id": "2610.31671", "arxiv_url": "https://arxiv.org/abs/2610.31671", "authors": ["Qiwen Gu", "Xin Zhou", "Xiwu Chen", "Zhongyang Zhu", "Zhuo Zhang", "Junqiao Zhao"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31671", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31671v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Unified Framework for Image-to-3D Part Generation via Variable Granularity", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robotic foundation models are typically evaluated through costly closed-loop rollouts, which motivates cheap offline proxies for model capability. The Platonic Representation Hypothesis (PRH) suggests that as representations improve, different modalities such as vision and language converge toward a shared statistical model of reality. We ask whether motion trajectories form another such modality: as embodied models become more capable, should their sensory representations converge toward the structure of physical motion? To examine this, we propose Sensorimotor Alignment ($S^2$), a training-free offline metric that measures how well a model\u0027s sensory representation aligns with the geometry of physical motion. We find that $S^2$ correlates positively with downstream robot task success across embodied model families, making it a low-cost offline proxy for prioritizing models before closed-loop evaluation. $S^2$ can also identify promising vision-language model (VLM) backbones even before costly fine-tuning into vision-language-action models (VLAs). Beyond this correlation, $S^2$ offers representation-level explanations for phenomena observed in VLAs and world action models (WAMs). With $S^2$, we extend PRH to embodied models and make sensorimotor alignment empirically measurable, offering insight into why an embodied model succeeds beyond its closed-loop success rate.", "arxiv_id": "2610.31670", "arxiv_url": "https://arxiv.org/abs/2610.31670", "authors": ["Yunfei Xie", "Howard H. Qian", "Shiyi Lan", "Kaiyu Hang", "Chen Wei"], "brief": "", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31670", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31670v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sensorimotor Alignment: A Platonic Proxy for Embodied Policy Success", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Auditing whether a text-to-image (T2I) model was fine-tuned on a particular image collection is difficult: a model can absorb collection-level visual characteristics without reproducing training images. Proactive dataset-use auditing plants a shared signal in a dataset before release, then later checks whether that signal appears in a suspect model\u0027s generated outputs. Existing approaches often trade off verifiability, fidelity, robustness, and deployability. We introduce $\\textbf{SpectralCanary}$, which uses a smooth low-pass mask to blend a fixed canary image into every collection image while leaving captions unchanged and requiring neither auxiliary generation nor per-image optimization. A lightweight verifier detects the transferred signal in suspect-model outputs. Across eight tests on the Pokemon dataset and three realistic data transformations, spanning two architectures families, SpectralCanary achieves the highest average per-generation TPR@$1\\%$ FPR ($91.1\\%$) and fixed threshold model-level accuracy using 30 generations ($94.8\\%$) among the evaluated methods. Across five datasets spanning artistic, medical, satellite, and fashion domains with SD3.5, SpectralCanary averages $92.4\\%$ per-generation TPR@$1\\%$ FPR while preserving the released images (SSIM $0.989$, LPIPS $0.022$) with a near-zero mean change FID (mean $\u0394$FID $0.05$) across datasets. Matched-energy ablations on Pokemon and ROCOv2 support our design choice, low-frequency placement transfers more reliably compared to mid/high-frequency placement. Under the evaluated adaptive attacks, the most effective removal requires aggressive modification and incurs more than $25$ $\u0394$FID points. These results identify low-frequency visual signals as effective carriers for collection-level T2I audit traces.", "arxiv_id": "2610.31659", "arxiv_url": "https://arxiv.org/abs/2610.31659", "authors": ["Sy-Tuyen Ho", "Anirudh Satheesh", "Soham Chawathe", "Huy Nghiem", "Yongkyun Lee", "Andrew Adams Schoen", "Furong Huang"], "brief": "", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31659", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31659v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SpectralCanary: Embarrassingly Simple Low-Frequency Traces for T2I Dataset-Use Auditing", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Single-image 3D generation has achieved high fidelity on curated benchmarks, yet degrades sharply on real-world images with uneven illumination, blur, and occlusions. Purifying such inputs requires deciding when to intervene and preserving the visual cues needed for 3D generation, while leaving clean inputs unchanged. We introduce Gate3DGen, a selective pre-processing model that gates image inputs to existing 3D generators without retraining them. A degradation-aware router bypasses inputs classified as clean and extracts features to guide purification of the remaining inputs. Conditioned on these features, a 3D-oriented one-step purifier purifies degraded inputs with spatial losses that encourage preservation of object identity, contours, and textural cues. To provide paired supervision, we construct a synthetic data engine that renders clean views of 3D assets and synthesises composite degradations. On the synthetic benchmark, the purifier improves image fidelity and downstream 3D geometry in only 2.3s on average, reducing TRELLIS.2 mesh distance by 61.5% relative to degraded inputs. VLM evaluation and human preferences on real photographs further support identity preservation and degradation correction. More demos and code are available at https://supra-3d.github.io/gate3dgen.", "arxiv_id": "2610.31649", "arxiv_url": "https://arxiv.org/abs/2610.31649", "authors": ["Xiaolin Li", "Zihao Huang", "Fanpeng Meng", "Chen Yang", "Guanjun Wu", "Kai Zhang", "Jiemin Fang", "Qi Tian"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31649", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31649v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Gate3DGen: A Pre-processing Model that Selectively Purifies Real-World Images for 3D Generation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Monocular models recover 3D geometry from a single image in one pass, but most assume a pinhole camera and produce distorted geometry on the wide-angle imagery produced by fisheye and panoramic lenses. Camera-aware models remove this assumption by predicting a per-pixel ray field. However, they represent different camera geometries using a single fixed basis to capture both the overall camera projection and its finer variations. We argue that camera geometry can be viewed as having a hierarchy of complexity for representing rays. We present OmniRay, a feed-forward model whose Ray Module is composed of three components: a monotone radial base that captures radially symmetric structure, a spherical-harmonic residual for smooth deviations from it, and a free-form residual for remaining local variation. These components are composed as successive rotations on the sphere, allowing the representation to accommodate diverse camera geometries. Given a single image, OmniRay predicts a ray direction and an up-to-scale radial distance for every pixel, from which a 3D point cloud is recovered without needing camera information at inference time. Extensive experiments across different camera configurations demonstrate that OmniRay establishes a new state-of-the-art in camera-agnostic monocular 3D reconstruction.", "arxiv_id": "2610.31645", "arxiv_url": "https://arxiv.org/abs/2610.31645", "authors": ["Namitha Guruprasad", "Abhay Yadav", "Cheng Peng", "Rama Chellappa", "Anand Bhattad"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31645", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31645v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OmniRay: Camera-Agnostic Monocular 3D Reconstruction with Composite Ray Fields", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Learnable Representations (LRs) can fit parametric families of functions to diverse kinds of signals. These emergent neural-native data formats are gathering interest in the scientific community due to their compactness, resolution-agnosticism and amenability to direct neural processing. On the other hand, gigapixel images are becoming increasingly widespread across a variety of scientific, cultural, and industrial domains. In this paper, we present GigaBench, the first benchmark and experimental evaluation focused on deploying LRs with gigapixel imagery. GigaBench includes images collected, acquired, and synthetically rendered across diverse domains, and addresses image compression and super-resolution. We adapt a representative set of LRs, spanning Implicit, Hybrid, and Explicit methods, so as to operate reliably at the gigapixel scale on consumer hardware. Through systematic evaluation across reconstruction quality, model size, compression and inference times, we identify consistent trends across methods and suggest actionable guidance for future investigation.", "arxiv_id": "2610.31644", "arxiv_url": "https://arxiv.org/abs/2610.31644", "authors": ["Matteo Fusconi", "Alex Costanzino", "Pierluigi Zama Ramirez", "Luigi Di Stefano"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31644", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31644v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GigaBench: Benchmarking Learnable Representations for Gigapixel Image Compression and Super-Resolution", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video object removal and injection are reciprocal editing operations between object-present and object-absent video states, yet they differ substantially in training difficulty. Removal can be effectively bootstrapped from video inpainting and further adapted to erase object-related interaction effects. Injection, however, requires large-scale paired supervision to model object appearance, dynamics, and scene-dependent effects, while perfectly aligned real-world pairs are difficult to collect and synthetic data lacks sufficient realism and diversity. To address this challenge, we present UniVOE, a removal-driven framework for training both video object removal and injection models. We first train an effect-aware remover by transferring video inpainting priors and finetuning on object-present/object-absent pairs. The trained remover converts real object-present videos into object-absent counterparts, creating large-scale paired supervision for injection. An injection model is trained on these pairs in the reverse direction to recover objects together with their dynamics and interaction effects. Moreover, since pixel-level reconstruction alone cannot adequately capture perceptual realism, we introduce a reward-based post-training method that aligns injection results with human preferences using a proprietary reward model. Experiments against strong open-source and commercial systems demonstrate that UniVOE achieves state-of-the-art performance on both object removal and injection, particularly in challenging interaction-effect cases.", "arxiv_id": "2610.31641", "arxiv_url": "https://arxiv.org/abs/2610.31641", "authors": ["Shuzhou Yang", "Lanqing Guo", "Lingen Li", "Weiqi Li", "Zhao Zhong", "Liefeng Bo", "Jian Zhang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31641", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31641v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "UniVOE: A Removal-Driven Framework for Interaction-Aware Universal Video Object Editing", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video diffusion models have learned rich 3D/4D priors, making them promising for scene generation and video re-rendering. However, their use in spatial tasks is limited by imprecise camera control, spatial and temporal inconsistencies, and entangled camera motion with scene dynamics. Existing approaches, such as task-specific fine-tuning and post-process warping, often introduce visual artifacts, generalize poorly, or incur high computational costs. We propose WorldForge V2 to achieve accurate camera control while preserving the generative capabilities of pretrained video models. We first develop a training-free guidance framework using warped references to iteratively refine generation along a target camera path. Optical-flow analysis identifies motion-related latent channels for selective guidance, helping separate motion control from appearance. A dual-path strategy further compares guided and unguided predictions to correct artifacts from imperfect references. Together, these components guide viewpoint changes while preserving scene appearance and object motion. To reduce refinement costs, v-cache approximates the correction using the preceding denoising prediction, avoiding an additional model evaluation. We further extend motion localization from latent channels to network blocks and introduce Trajectory LoRA, which concentrates adaptation on blocks most responsive to trajectory guidance. A two-stage training strategy teaches these adapters to denoise the states encountered during guided generation, using limited supervision effectively. This enables reliable camera control with very little training data, with a single training scene already supporting generalization to unseen scenes. Quantitative and qualitative evaluations across multiple datasets show that our method achieves state-of-the-art generation quality and trajectory accuracy in camera-controlled video generation.", "arxiv_id": "2610.31640", "arxiv_url": "https://arxiv.org/abs/2610.31640", "authors": ["Chenxi Song", "Yanming Yang", "Tong Zhao", "Ruibo Li", "Joey Tianyi Zhou", "Chi Zhang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31640", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31640v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WorldForge V2: Eliciting Camera-Trajectory Alignment in Video Diffusion Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Feed-forward models accurately estimate camera motion and 3D geometry from short video windows. However, computational and memory costs prevent direct inference on sequences containing thousands of frames. Long videos must therefore be processed as overlapping chunks. This division produces independent local reconstructions with inconsistent coordinate frames and duplicate estimates of shared cameras. Achieving global consistency requires propagating constraints from adjacent overlaps and distant revisits across the sequence. This requirement naturally motivates pose graph optimization. However, the choice of graph level creates a trade-off. Chunk-level graphs efficiently resolve scale drift and close large loops. Yet, their rigid transformations cannot correct internal errors or conflicting frame predictions. Conversely, frame-level optimization offers local flexibility, but scaling it globally is computationally expensive and can break metric scale. HiP3R resolves this trade-off using a hierarchical pose graph. HiP3R first optimizes a robust chunk-level $\\mathrm{Sim}(3)$ graph to establish the global layout and scale. It then holds this layout fixed and estimates one shared $\\mathrm{SE}(3)$ camera per frame, turning overlapping window predictions into a single trajectory. Experiments across multiple benchmarks demonstrate the effectiveness of HiP3R in improving camera trajectories and 3D reconstruction. Our method applies to both chunk-based and streaming backends without additional training or fine-tuning. The codes are available at https://kkakkkka.github.io/HiP3R.", "arxiv_id": "2610.31635", "arxiv_url": "https://arxiv.org/abs/2610.31635", "authors": ["Zunnan Xu", "Shangchen Zhou", "Yihang Luo", "Chen Change Loy"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31635", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31635v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HiP3R: Hierarchical Pose Graphs for Long-Horizon 3D Reconstruction", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion models have become strong priors for solving inverse problems. However, nonlinear inverse problems such as phase retrieval remain challenging when multiple measurement-consistent solutions are distinguishable only by the prior; we call such measurements ambiguous. Existing diffusion-based samplers rely on local approximations during reconstruction. For an ambiguous measurement, these approximations can allow measurement guidance to favor a measurement-consistent mode that is close to a prior-supported mode but is itself not supported by the prior. Evaluation often masks this type of failure by reporting the best-of-$k$ runs, where the best is selected by comparison to the ground truth. We introduce Prior-Consistent DAPS (PC-DAPS), a variant of Decoupled Annealing Posterior Sampling (DAPS) designed to address this failure case by maintaining multiple candidate solutions within a single sampling run. As annealing noise decreases, PC-DAPS prunes and replaces weaker candidates according to their prior consistency, without any ground-truth access. PC-DAPS reduces the incidence of prior-inconsistent samples and improves sample quality on nonlinear inverse problems while preserving sample quality and diversity on linear inverse problems.", "arxiv_id": "2610.31592", "arxiv_url": "https://arxiv.org/abs/2610.31592", "authors": ["Merve Kocabas", "Benjamin A. Burns", "Andreas Geiger", "Kent Gauen", "Sara Fridovich-Keil"], "brief": "", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31592", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31592v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Best-of-$k$: Prior-Consistent DAPS for Ambiguous Nonlinear Inverse Problems", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models have shown outstanding performance on text-first tasks such as coding, math, and writing. Recent efforts are shifting models\u0027 training to include scientific problems that often live in highly specialized domains beyond text, such as protein structure and biological images. However, in these scenarios, their general-purpose accuracy compared with specialized algorithms remains in question. One such domain is cell tracking, which requires spatiotemporal awareness of cell dynamics. To evaluate this, we created a new benchmark, CellTrack-Bench, which assesses Vision-Language Models\u0027 (VLMs) cell-tracking-related performance against specialized trackers. The full benchmark draws from 15 standard cell-tracking datasets across four imaging modalities and comprises 1,537 problems corresponding to 9,041 cell-linking decisions. We selected a hard subset requiring greater reasoning effort by identifying failures shared across distinct algorithmic trackers. With this proposed dataset, we: (i) evaluated different environment harnesses for VLMs; (ii) benchmarked 9 frontier closed-source models and 13 open-weight models; and (iii) provided a detailed analysis of their failure modes. Code, the stored model outputs, and a pipeline that regenerates the benchmark from the source datasets are available at https://github.com/royerlab/celltrack-bench.", "arxiv_id": "2610.31566", "arxiv_url": "https://arxiv.org/abs/2610.31566", "authors": ["Ilan Theodoro", "Jord\u00e3o Bragantini", "Lo\u00efc A. Royer"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31566", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31566v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CellTrack-Bench: Microscopic Cell Tracking Benchmark for Vision-Language Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generating 360-degree panoramas requires both local perspective fidelity and global spherical continuity. Existing representations face a trade-off: equirectangular projection (ERP) enables seamless panorama modeling but suffers from severe distortion and a domain gap to pre-trained image generators, whereas cubemaps preserve perspective geometry but often produce inconsistent faces and visible seams. We present Squaring-the-Sphere, a panoramic image generation framework built on a novel representation CubeAtlas, which unfolds all cubemap faces into a single compact canvas. By arranging orientation-aligned, rotated polar regions alongside the equatorial faces, this representation preserves the perspective geometry of cubemaps while organizing the cross-face relationships required for seamless panorama assembly. It further enables a pretrained diffusion transformer to model the complete panorama jointly in a single pass, without altering the backbone architecture or positional encoding. While CubeAtlas has a token count comparable to ERP, its structured layout makes many dense attention interactions unnecessary. We therefore introduce a layout-aware sparse attention mask that preserves the interactions required for panorama continuity while removing geometrically irrelevant token pairs. As a result, CubeAtlas achieves better quality than ERP modeling with lower attention computation. Furthermore, we introduce a training-free super-resolution technique and a fusion scheme that enhance fine details in distortion-free perspective space before achieving the final ERP panorama. Experiments on various benchmarks demonstrate that our method improves geometric fidelity, cross-view consistency, and high-resolution visual quality over previous methods.", "arxiv_id": "2610.31565", "arxiv_url": "https://arxiv.org/abs/2610.31565", "authors": ["Xuhui Zuo", "Chenjie Cao", "Tengfei Wang", "Junta Wu", "Yisu Zhang", "Chunchao Guo"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31565", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31565v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Squaring-the-Sphere: Distortion-Free and Seamless Panorama Generation via CubeAtlas", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Local anomaly detection is the task of identifying spatially confined anomalous or out-of-distribution (OOD) regions within an otherwise in-distribution (ID) image. Most existing methods are designed for a specific context, with a strong focus on industrial defect detection, where they achieve excellent performance on well-established benchmarks. However, we observe that these methods can exhibit significant performance drops in other contexts, especially when the inlier distribution is multimodal. To account for this inlier complexity, we propose LACToS, a principled local OOD detection method based on statistical typicality and made tractable through two innovations: (i) grouping pixels into superpixels and (ii) using a computationally efficient proxy to estimate typicality. We evaluate LACToS across three diverse applications spanning medical imaging, human faces, and X-ray security screening. LACToS performs more robustly than prior methods across these benchmarks. The code is released here: https://github.com/voilalab/LACToS.", "arxiv_id": "2610.31538", "arxiv_url": "https://arxiv.org/abs/2610.31538", "authors": ["Jihoon Hong", "Alireza Kheirandish", "Rohan Sanda", "Sara Fridovich-Keil"], "brief": "", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31538", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31538v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LACToS: Local Anomaly Detection via Conditional Typicality of Superpixels", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Synthetic biparametric MRI (bpMRI) may help alleviate the limited availability of large and representative prostate MRI datasets for deep learning applications. In this work, we present a conditional 3D diffusion framework for anatomy-conditioned synthesis of complete prostate bpMRI from anatomical masks. The framework supports sequential synthesis, in which T2w and diffusion modalities are generated by separately trained models, and joint synthesis, in which all bpMRI modalities are generated simultaneously within a single model. Five configurations were trained using PI-CAI, FastMRI Prostate, and PROSTATEx datasets to investigate different conditioning schemes, target modalities, and synthesis strategies. Evaluation using distribution-based metrics, paired-image similarity, and qualitative assessment demonstrated the feasibility of both synthesis pathways. Joint synthesis achieved competitive distributional fidelity while generating complete bpMRI, whereas direct synthesis of ADC and computed high-b-value DWI outperformed their derivation from synthetic diffusion-weighted images.", "arxiv_id": "2610.31523", "arxiv_url": "https://arxiv.org/abs/2610.31523", "authors": ["Claudia Giardina", "Montse Pard\u00e0s", "Ver\u00f3nica Vilaplana"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31523", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31523v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Diffusion-Based Synthesis of Complete 3D Biparametric Prostate MRI", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate hippocampal segmentation can be a useful tool for diagnosing and monitoring neurological conditions such as Alzheimer\u0027s disease and epilepsy. While numerous automated segmentation methods exist, their clinical adoption remains limited. Reliable uncertainty assessment can enhance trust and facilitate clinical translation. This study evaluates ensembles of five heterogeneous hippocampal segmentation methods - InnerEye, ASHS, FastSurfer, HippoSeg, and FreeSurfer - across two dementia datasets and one epilepsy dataset. The sub-ensemble containing InnerEye, FastSurfer, and HippoSeg emerged as both accurate and efficient, highlighting the feasibility of balancing computational cost and performance. Additionally, ensemble-derived uncertainty quantification with sample variance, mutual information, and predictive entropy is shown to reduce inaccurate segmentations by flagging low-confidence cases, potentially providing a mechanism for automatically escalating ambiguous cases for expert assessment. Lastly, this study explores the downstream clinical utility of ensemble-derived uncertainty, finding a significant correlation with motion artefact severity and a modest contribution to Alzheimer\u0027s disease classification.", "arxiv_id": "2610.31505", "arxiv_url": "https://arxiv.org/abs/2610.31505", "authors": ["Gabriel Oliveira-Stahl", "Anna Schroder", "James Moggridge", "Hamza A. Salhab", "Caroline Micallef", "Josephine Barnes", "M. Jorge Cardoso", "Carole H. Sudre", "Matthew Grech-Sollars"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31505", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31505v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluation of Uncertainty-Aware Multi-Software Ensembles for Hippocampal Segmentation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multibeam imaging sonar produces intensity images degraded by coherent speckle and system-induced blur, while clean reflectivity targets are rarely available. Existing despeckling methods often rely on simplified intensity-domain noise models, synthetic clean targets, or blind-spot self-supervision, and typically do not jointly model deblurring and speckle suppression. We propose a physics-consistent self-supervised framework for joint despeckling and deblurring of multibeam imaging sonar. A stochastic coherent image-formation model yields a conditional-mean forward operator that relates latent scene reflectivity to expected intensity through the squared magnitude of the system point spread function. We then use registered multi-frame sonar sequences to train without clean ground truth images, showing that, under an idealized inter-frame conditional-mean condition, the expected paired loss equals the corresponding forward-prediction loss up to a network-independent constant. To stabilize the ill-conditioned inverse problem, we further adapt robust equivariant imaging using stochastic coherent simulation and introduce a paired forward prediction error metric for ground-truth-free evaluation. Experiments on two real multibeam sonar datasets demonstrate a favourable balance between forward-prediction agreement, homogeneous-region speckle suppression, and preservation of visible structural boundaries compared with representative baselines.", "arxiv_id": "2610.31490", "arxiv_url": "https://arxiv.org/abs/2610.31490", "authors": ["Zixin Wang", "James Hopgood", "Mike Davies"], "brief": "", "categories": ["eess.IV", "cs.CV", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31490", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31490v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Self-Supervised Multibeam Sonar Restoration via Coherent Forward Modeling", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language Models (VLMs) have shown strong potential for video anomaly detection, but dense frame-level inference makes them impractical for real-time deployment. Existing acceleration commonly relies on uniform sampling, which ignores content dynamics and can either waste computation on static segments or miss localized anomalies. We propose MoG-VLM a motion-adaptive anomaly detection framework that leverages motion purely as a lightweight control signal to decide when VLM inference is necessary. To this end, we introduce Temporal Gradient Magnitude (TGM) which performs content-aware sampling to concentrate computation on informative regions while avoiding redundant processing. We further introduce a hierarchical dual-stream design in which dense multi-frame VLM reasoning is activated only around frames with elevated anomaly likelihood, via anchor-triggered context-window expansion with early termination. A fusion module then reconciles these instantaneous semantic cues with temporal action dynamics. Across four benchmarks, our method achieves 91.91%, 84.30%, 87.88%, and 78.96% AUC-ROC on XD-Violence, UCF-Crime, MSAD, and ShanghaiTech, respectively, establishing new state of the art on three benchmarks under the zero-shot, training-free setting. On XD-Violence, we improve over the previous best result by +0.57% while delivering a 1.31x inference speedup. These results demonstrate that content-aware allocation of VLM capacity, processing fewer frames more intelligently rather than all frames uniformly, is a more effective axis of progress than uniformly densifying VLM inference across frames. Code is available on GitHub: https://github.com/kdawoud91/MoG-VLM.", "arxiv_id": "2610.31478", "arxiv_url": "https://arxiv.org/abs/2610.31478", "authors": ["Khaled Waleed Dawoud", "Muhammad Zaigham Zaheer", "Khan Muhammad", "Muhammad Haris Khan"], "brief": "", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31478", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31478v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MoG-VLM: Efficient Video Anomaly Detection through Motion-Guided Vision-Language Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many questions about a video concern one physical object. Where does the ball end up after the cups are shuffled? Which card is the queen? How often was the mug covered? Video-language models (Video-LMs) recognise such objects in single frames but do not keep them apart over time. On real shell-game videos, open models from 8B to 235B parameters, their thinking variants, a reinforcement-learned tool agent and three training-free tool agents all stay within ten points of chance. We separate semantic identity binding from temporal identity maintenance. An object\u0027s identity should be fixed at a moment when the evidence for it is visible, and carried afterwards by a tracker. \\emph{Track, Then Bind} implements this principle without training. A promptable video tracker follows every candidate object and draws it with a track number. A frozen vision-language model answers a static question about the identifying evidence, which binds the target to a track. The answer is then derived from the tracked state in text, without asking the model to reinterpret the original video during read-out. A single configuration covers all benchmarks. With Qwen3-VL-32B it solves both VET-Bench tasks, where a fine-tuned trajectory model reaches 92\\% and 90\\% and the same VLM voting over 16 samples stays at 30--32\\%. It answers 55.4\\% of the hardest Perception Test cup games, where the best published model answers 41.5\\%, and, using track-derived timelines, 48.6\\% of TOC-Bench questions, against 37.1\\% for the same model answering directly. Drawing the same tracks on the video and asking the question directly falls 12--19 points short of the agent on real cup games.", "arxiv_id": "2610.31471", "arxiv_url": "https://arxiv.org/abs/2610.31471", "authors": ["Di Yang", "Xiaochang Li", "Muyang Liu", "Yufei Wang", "Yanhai Xiong"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31471", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31471v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ask About the Right Moment: Training-Free Object Identity Reasoning for Video-Language Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Point cloud transformers aim to capture detailed local geometry and relationships across a scene at a manageable computational cost. Two common approaches are window attention and global attention. They differ in how they enable scene-wide interaction, which refers to information exchange among tokens across a scene. Window attention reduces computational cost by restricting self-attention to groups of tokens called windows; in serialized designs, each window contains a fixed number of consecutive tokens from a spatially ordered sequence. Because each block only directly connects tokens within the same window, information exchange across windows relies on changes in window membership across blocks and hierarchical pooling. Global attention, in contrast, directly connects all tokens within a scene, but computing attention over all token pairs can be costly when the number of tokens is large. To balance computational cost and scene-wide interaction, we introduce MixPT, a point transformer that uses a mix of window and global attention blocks in an interleaved schedule, while retaining a single fixed serialization pattern for its window blocks. For scenes with a large number of tokens, MixPT applies global attention to spatially pooled tokens and returns residual updates to the original-resolution stream. Across indoor and outdoor benchmarks, MixPT achieves competitive accuracy with lower latency than representative window and global attention baselines. We further demonstrate the feasibility of scaling the attention stage in depth by repeating the interleaved pattern of window and global attention blocks.", "arxiv_id": "2610.31455", "arxiv_url": "https://arxiv.org/abs/2610.31455", "authors": ["Minkyun Seo", "Hyungtae Lim", "Jaesik Park"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31455", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31455v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MixPT: Point Transformer with Interleaved Window and Global Attention", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A conventional embodied agent in an indoor environment builds a map by accumulating noisy real-world measurements and results from heavy inference to guide navigation. While the detailed measurements may differ due to scene changes or sensor settings, the unique topological structure of navigable passages or the connectivity between rooms may provide training-free guidance that complements local observations. We propose a sparse topometric graph as an efficient structural representation for robust indoor navigation, alleviating the need for fine-grained matching, which is computationally expensive, memory-intensive, and prone to real-world variations. The map consists of nodes that encode local 3D geometry and distance-weighted edges that capture traversable connectivity. A learned graph-matching network finds consistent subgraph structures across sessions by considering both node-level geometric descriptors and neighborhood connectivity. The holistic contextual matching is robust to local ambiguities caused by weak distinctiveness or repetitive structure, and establishes stable correspondences despite local scene changes, different sensor modalities, or limited spatial overlap. We analyze the practicality of the graph through cross-session point-goal navigation, where a goal specified in a prior reference map must be reached from an unknown initial pose in a later session. Experiments show that our method achieves the highest success rates (77.1% on Gibson and 40.0% under 3D-FRONT scene changes), while reducing memory by more than two orders of magnitude compared to point-level representations. The proposed approach further supports cross-session alignment and goal-directed navigation with strong scalability and robust real-world transfer.", "arxiv_id": "2610.31432", "arxiv_url": "https://arxiv.org/abs/2610.31432", "authors": ["Eun Sun Lee", "Minkyun Seo", "Gwangtak Bae", "Junho Kim", "Seunggu Kang", "Jaesik Park", "Young Min Kim"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31432", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31432v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Sparse Topometric Graph for Scalable Cross-Session Indoor Navigation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual document understanding is essential for acquiring knowledge from visually rich documents and is attracting growing research interest. Existing surveys emphasize architectures or technical approaches, with limited attention to how task bottlenecks shape technical choices and research priorities. We present a task-centric survey that decomposes long-document visual question answering (VQA) into four components: document parsing, evidence organization and retrieval, generator organization and learning, and evaluation. For each, we develop a fine-grained taxonomy and trace motivations, technical responses, and cross-component connections. We focus on explicit retrieval while covering direct reading. Our temporal analysis traces expanding priorities from multimodal content understanding to sufficient, high-fidelity evidence acquisition and sustained evidence management. We outline future directions in evidence sufficiency, verifiable and correctable understanding, and budget-aware coordination, with an outlook on continual document understanding.", "arxiv_id": "2610.31385", "arxiv_url": "https://arxiv.org/abs/2610.31385", "authors": ["Yufei Tong", "Guanjie Cheng", "Tianle Wu", "Leilei Zhang", "Hang Zheng", "Peihan Wu", "Jianwei Yin", "Shuiguang Deng"], "brief": "", "categories": ["cs.CV", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31385", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31385v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Task-Centric Survey of Long-Document Visual Question Answering: Taxonomy, Evolution, and Future Directions", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing vision-language models (VLMs) remain unreliable for fine-grained visual perception. In this report, we present WeVisOne-VL (WeChat Vision All-in-One), a powerful VLM that unifies object-level and pixel-level perception through structured next-token prediction. It supports multiple visual tasks including object detection, referring localization, counting, OCR, segmentation, and matting, enabling localization at any user-specific granularity, from points and boxes to masks and alpha mattes. Architecturally, we integrate a lightweight pixel decoder into the VLM via a special \u003cOBJ\u003e token to generate instance-level pixel outputs. We train the model with a three-stage curriculum SFT followed by mixed-task RL. Across over 30 benchmarks, WeVisOne-VL demonstrates leading performance on both object-level and pixel-level tasks, while maintaining robust rejection for object-absent queries. By releasing WeVisOne-VL to the open-source community, we hope to advance VLMs from broad visual understanding toward truly reliable perception systems for real-world deployment.", "arxiv_id": "2610.31329", "arxiv_url": "https://arxiv.org/abs/2610.31329", "authors": ["Tianming Liang", "Junyi Pan", "Yuxi Li", "Canmiao Fu", "Zhipeng Huang", "Chong Sun", "Chen Li", "Jing Lyu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31329", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31329v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WeVisOne-VL: Unified Visual Perception from Objects to Pixels", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Local feature matching is typically formulated for image pairs, although structure-from-motion and visual localization commonly match one reference image against many retrieved or covisible neighbours. Applying a pairwise matcher independently to these centre-neighbour edges duplicates reference-side computation and prevents the matcher from exploiting complementary multi-view geometric evidence from the remaining observations. To address these limitations, we introduce MVLoMa, a sparse star-graph matcher that extends LoMa from image pairs to multiple views. MVLoMa first uses a frozen multi-view geometry model to jointly describe all images in a star, then injects the resulting cross-view geometric context into local descriptors. It then matches the centre image to all neighbours in a single forward pass through per-view self-attention and bidirectional centre-neighbour cross-attention. For supervision, we derive positive correspondences only from depth-valid, mutually visible dense warps and explicitly penalize high-confidence matches that violate epipolar geometry. On 25-view star graphs from HyperSim, ScanNet++, Mip-NeRF 360, and Tanks and Temples, MVLoMa obtains the best macro-average relative-pose AUC among the compared methods at all three thresholds (58.65/85.41/90.99). Its matcher is 2.20 times faster than sequential evaluation of the 24 centre-neighbour edges. The same design supports four tested frozen geometry encoders -- DA3, $\u03c0^3$, VGGT, and VGGT-$\u03a9$ -- with DA3-Giant performing best on all reported encoder-ablation metrics. Controlled ablations further isolate the effects of geometry-aware descriptors, visibility filtering, geometric negative supervision, and joint multi-view inference.", "arxiv_id": "2610.31321", "arxiv_url": "https://arxiv.org/abs/2610.31321", "authors": ["Xinyang Lu", "Shengzhe Wei", "Sheng Tang", "Weiqi Zhang", "Juntong Fang", "Zesong Li"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31321", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31321v1", "published_at": "2026-10-22", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MVLoMa: Multi-View Local Feature Matching with Any Geometry Foundation Model", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "4D scene reconstruction requires robust handling of dynamic objects, yet existing streaming methods commonly assume static scenes, leading to pose drift and ghosting artifacts over long sequences. We introduce Stream4D, a training-free, motion-decoupled streaming reconstruction framework that can be directly integrated into causal Transformer backbones (e.g., StreamVGGT, Stream3R). Our key observation is that causal attention implicitly encodes rich temporal motion cues within the KV cache. We adaptively aggregate these cues from multiple attention layers and across temporal windows, and fuse them with depth priors to handle challenging cases such as occlusions and textureless regions, producing precise dynamic masks that decouple static and dynamic regions. We then apply a soft key masking scheme that leverages these dynamic masks to suppress interference from dynamic regions in causal attention, thereby improving camera pose estimation accuracy. Stream4D inherits the efficiency of causal attention a
