const PAPERS = [{"abstract": "AI research agents need reliable knowledge of how their experiments change outcomes. We introduce WhatWorkedBench to measure experimental understanding, the accuracy of predictions about component changes after budgeted experimentation. Agents inspect code, select measurements, and submit a response surface, a table predicting scores for every configuration of component settings. Exhaustive CPU execution supplies reference effects for changing each component while holding the others fixed. These effects capture combinations of changes across 36 tasks from 30 data sources and 8 workflow types, with 1248 configuration records. Core evaluation combines 4,206 numerical-control records across all eight families and 108 agent episodes across the original six. At eight new measurements, pair-effect ridge selects an optimum on 15 of 22 sources and limits every effect error to 10% of score range on three. Fitting a Gaussian process (GP) to the same agent observations raises effect recovery, accuracy relative to true effect magnitude, from 0.632 to 0.698 in the original Flash cohort and from 0.621 to 0.720 in an additional cohort. On six completed beat-detection and graph submissions, the same-observation GP raises family-macro recovery from 0.303 to 0.455. On six workflows with six binary options at 20 new measurements, encoding code equivalences, configurations with identical behavior, raises GP recovery from 0.248 to 0.462. WhatWorkedBench supports research on experimental agents, adaptive experimental design, numerical inference, and use of program structure.", "arxiv_id": "2609.27490", "arxiv_url": "https://arxiv.org/abs/2609.27490", "authors": ["Jingjie Ning", "Xueqi Li", "Yibo Kong", "Dongting Li"], "brief": "\u8bba\u6587\u63d0\u51fa WhatWorkedBench\uff0c\u7528\u4e8e\u8861\u91cf AI \u7814\u7a76\u667a\u80fd\u4f53\u5728\u6709\u9650\u5b9e\u9a8c\u9884\u7b97\u4e0b\uff0c\u80fd\u5426\u51c6\u786e\u7406\u89e3\u7ec4\u4ef6\u6539\u52a8\u5982\u4f55\u5f71\u54cd\u7ed3\u679c\u3002\u667a\u80fd\u4f53\u9700\u67e5\u770b\u4ee3\u7801\u3001\u9009\u62e9\u6d4b\u91cf\uff0c\u5e76\u63d0\u4ea4\u8986\u76d6\u6240\u6709\u914d\u7f6e\u7684\u54cd\u5e94\u9762\u9884\u6d4b\uff0c\u518d\u4e0e\u7a77\u4e3e\u6267\u884c\u5f97\u5230\u7684\u771f\u5b9e\u6548\u5e94\u5bf9\u6bd4\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/EthanNing/WhatWorkedBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27490", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u8986\u76d636\u4e2a\u4efb\u52a1\u300130\u4e2a\u6570\u636e\u6e90\u30018\u7c7b\u5de5\u4f5c\u6d41\uff0c\u51711248\u6761\u914d\u7f6e\u8bb0\u5f55\uff0c\u5e76\u5305\u542b108\u4e2a\u667a\u80fd\u4f53\u5b9e\u9a8c\u56de\u5408\u3002", "\u8bc4\u4f30\u5173\u6ce8\u7ec4\u4ef6\u53d8\u5316\u7684\u56e0\u679c\u5f0f\u6548\u5e94\u9884\u6d4b\uff0c\u800c\u4e0d\u53ea\u662f\u6700\u7ec8\u5206\u6570\uff1b\u53c2\u8003\u7b54\u6848\u6765\u81ea\u56fa\u5b9a\u5176\u4ed6\u7ec4\u4ef6\u65f6\u7684\u7a77\u4e3eCPU\u6267\u884c\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u9ad8\u65af\u8fc7\u7a0b\u548c\u7f16\u7801\u4ee3\u7801\u7b49\u4ef7\u5173\u7cfb\u53ef\u663e\u8457\u63d0\u5347\u6548\u5e94\u6062\u590d\u7387\uff0c\u4f8b\u5982GP\u5728Flash\u961f\u5217\u4e2d\u4ece0.632\u63d0\u5347\u52300.698\uff0c\u4ee3\u7801\u7b49\u4ef7\u7f16\u7801\u4f7f\u6062\u590d\u7387\u4ece0.248\u63d0\u5347\u52300.462\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u81ea\u52a8\u5b9e\u9a8c", "\u7a0b\u5e8f\u7406\u89e3"], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2609.27490v1", "published_at": "2026-09-23", "score": 0.451, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.27490.png", "title": "WhatWorkedBench: Benchmarking Experimental Understanding in AI Agents", "tldr": "\u8bc4\u6d4bAI\u7814\u7a76\u667a\u80fd\u4f53\u7684\u5b9e\u9a8c\u7406\u89e3\u80fd\u529b", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa WhatWorkedBench\uff0c\u7528\u4e8e\u8861\u91cf AI \u7814\u7a76\u667a\u80fd\u4f53\u5728\u6709\u9650\u5b9e\u9a8c\u9884\u7b97\u4e0b\uff0c\u80fd\u5426\u51c6\u786e\u7406\u89e3\u7ec4\u4ef6\u6539\u52a8\u5982\u4f55\u5f71\u54cd\u7ed3\u679c\u3002\u667a\u80fd\u4f53\u9700\u67e5\u770b\u4ee3\u7801\u3001\u9009\u62e9\u6d4b\u91cf\uff0c\u5e76\u63d0\u4ea4\u8986\u76d6\u6240\u6709\u914d\u7f6e\u7684\u54cd\u5e94\u9762\u9884\u6d4b\uff0c\u518d\u4e0e\u7a77\u4e3e\u6267\u884c\u5f97\u5230\u7684\u771f\u5b9e\u6548\u5e94\u5bf9\u6bd4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u201c\u5b9e\u9a8c\u505a\u4e86\u4ec0\u4e48\u3001\u54ea\u4e9b\u6539\u52a8\u771f\u6b63\u6709\u6548\u201d\u5f62\u5f0f\u5316\u4e3a\u53ef\u8bc4\u6d4b\u4efb\u52a1\uff0c\u4e3aAI\u79d1\u7814\u667a\u80fd\u4f53\u3001\u81ea\u52a8\u5b9e\u9a8c\u8bbe\u8ba1\u548c\u57fa\u4e8e\u4ee3\u7801\u7ed3\u6784\u7684\u63a8\u7406\u63d0\u4f9b\u4e86\u7cfb\u7edf\u57fa\u51c6\uff0c\u5b9e\u7528\u4ef7\u503c\u8f83\u9ad8\u3002"}, {"abstract": "Most existing visual CAPTCHAs remain spatially solvable: the required information is exposed by static appearance, local structure, and interface state. This assumption is weakened by advances in multimodal large language models (MLLMs) and Graphical User Interface (GUI) agents, which exhibit strong visual perception, reasoning, and browser interaction capabilities. We propose Motion Vision CAPTCHA (MVCAP), a hierarchical motion-based CAPTCHA framework in which target semantics are instantiated as motion-defined foreground structures and become recoverable only through temporal segregation from a dynamically evolving background. Built on this shared principle, MVCAP is instantiated in three perceptually progressive levels: coherent motion, structural motion, and biological motion. To evaluate this framework, we introduce MVCAP-Bench, a browser-based benchmark with 600 live CAPTCHA instances, together with a matched foreground-only control benchmark, MVCAP-Bench-FG. We evaluate humans, Browser Use agents, native computer use agents, and a supplementary offline VQA setting derived from the same instances. Results reveal a substantial human--agent gap: on the full MVCAP-Bench, human accuracy reaches 99.6%, whereas the best GUI agent achieves only 16.8%, close to the six-way chance level. The foreground-only control further shows that the key difficulty comes from dynamic background camouflage rather than answer format or browser interaction alone. These findings identify a measurable human--agent perception gap and position MVCAP-Bench as a benchmark for studying motion-defined perception in current agents.", "arxiv_id": "2609.27461", "arxiv_url": "https://arxiv.org/abs/2609.27461", "authors": ["Zeyu Zhang", "Dingyi Rong", "Zijian Chen", "Zicheng Zhang", "Xiongkuo Min", "Guangtao Zhai"], "brief": "\u8bba\u6587\u63d0\u51fa Motion Vision CAPTCHA\uff08MVCAP\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u8fd0\u52a8\u5b9a\u4e49\u524d\u666f\u7684\u5c42\u7ea7\u9a8c\u8bc1\u7801\u6846\u67b6\uff0c\u76ee\u6807\u8bed\u4e49\u53ea\u6709\u901a\u8fc7\u65f6\u95f4\u7ef4\u5ea6\u7684\u8fd0\u52a8\u5206\u79bb\u624d\u80fd\u6062\u590d\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u6d4f\u89c8\u5668\u57fa\u51c6 MVCAP-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u4eba\u7c7b\u3001Browser Use \u667a\u80fd\u4f53\u3001\u539f\u751f computer use \u667a\u80fd\u4f53\u53ca\u79bb\u7ebf VQA \u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27461", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["MVCAP \u5305\u542b\u4e09\u79cd\u9012\u8fdb\u96be\u5ea6\uff1a\u4e00\u81f4\u8fd0\u52a8\u3001\u7ed3\u6784\u8fd0\u52a8\u548c\u751f\u7269\u8fd0\u52a8\uff0c\u5747\u4f9d\u8d56\u52a8\u6001\u80cc\u666f\u4e2d\u7684\u65f6\u95f4\u5206\u79bb\u800c\u975e\u9759\u6001\u89c6\u89c9\u7ebf\u7d22\u3002", "MVCAP-Bench \u542b 600 \u4e2a\u5b9e\u65f6\u6d4f\u89c8\u5668\u9a8c\u8bc1\u7801\u5b9e\u4f8b\uff0c\u5e76\u63d0\u4f9b\u524d\u666f-only \u5bf9\u7167\u96c6 MVCAP-Bench-FG\u3002", "\u5b9e\u9a8c\u663e\u793a\u4eba\u7c7b\u51c6\u786e\u7387\u8fbe 99.6%\uff0c\u6700\u4f73 GUI \u667a\u80fd\u4f53\u4ec5 16.8%\uff0c\u63a5\u8fd1\u516d\u9009\u4e00\u968f\u673a\u6c34\u5e73\uff1b\u5bf9\u7167\u5b9e\u9a8c\u8868\u660e\u4e3b\u8981\u96be\u70b9\u6765\u81ea\u52a8\u6001\u80cc\u666f\u4f2a\u88c5\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u89c6\u89c9\u611f\u77e5", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27461v1", "published_at": "2026-09-23", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Invisible in Space, Visible in Time: Motion Vision CAPTCHA against GUI Agents", "tldr": "\u7528\u52a8\u6001\u8fd0\u52a8\u611f\u77e5\u62c9\u5f00\u4eba\u7c7b\u4e0eGUI\u667a\u80fd\u4f53\u5dee\u8ddd", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Motion Vision CAPTCHA\uff08MVCAP\uff09\uff0c\u4e00\u79cd\u57fa\u4e8e\u8fd0\u52a8\u5b9a\u4e49\u524d\u666f\u7684\u5c42\u7ea7\u9a8c\u8bc1\u7801\u6846\u67b6\uff0c\u76ee\u6807\u8bed\u4e49\u53ea\u6709\u901a\u8fc7\u65f6\u95f4\u7ef4\u5ea6\u7684\u8fd0\u52a8\u5206\u79bb\u624d\u80fd\u6062\u590d\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u6d4f\u89c8\u5668\u57fa\u51c6 MVCAP-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u4eba\u7c7b\u3001Browser Use \u667a\u80fd\u4f53\u3001\u539f\u751f computer use \u667a\u80fd\u4f53\u53ca\u79bb\u7ebf VQA \u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f53\u524d\u591a\u6a21\u6001\u6a21\u578b\u548cGUI\u667a\u80fd\u4f53\u5728\u8fd0\u52a8\u5b9a\u4e49\u611f\u77e5\u4e0a\u4ecd\u5b58\u5728\u663e\u8457\u77ed\u677f\uff0c\u4e3a\u9a8c\u8bc1\u7801\u5b89\u5168\u4e0e\u667a\u80fd\u4f53\u89c6\u89c9\u80fd\u529b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u65b0\u7684\u9ad8\u533a\u5206\u5ea6\u57fa\u51c6\u3002"}, {"abstract": "Language-model agents increasingly face long-horizon tasks with evolving state, interdependent decisions, and delayed outcomes. Scaling their training requires diverse agentic environments, dependable outcome signals, and low extension cost. Existing generation pipelines commonly construct an environment before defining its outcome rule or annotating its trajectories, leaving dynamics and evaluation to be aligned post hoc. VHD-Play reverses this dependency by sampling and solving a mathematical model before a corpus-grounded setter renders its decision process as stateful tools. The executable dynamics and trajectory-scoring reference are inherited from the same solved model. The pipeline produces 3,300 diverse agentic environments at a cost of a few cents each. Training Qwen3.6-35B-A3B on three families raises its mean agentic score from 0.204 to 0.815 in a five-family diagnostic. Gains also appear on held-out instances from all three training families and eight unseen mechanism families, then extend beyond the generated substrate to external benchmarks for general function calling, travel planning, and 365-day e-commerce. On E-Commerce Bench, the trained checkpoint completes every run without bankruptcy and exceeds Qwen3.7-Max. We compare written-out problems with stateful versions that reveal or hide their parameters. The comparison shows that most of the learnable gap lies in stateful interaction rather than underlying problem solving. A frozen 35B setter realizes larger environments, and scale-matched training retains gains as mechanism size and horizon grow, indicating the potential for an evolving training substrate.", "arxiv_id": "2609.27321", "arxiv_url": "https://arxiv.org/abs/2609.27321", "authors": ["Xinjie Shen", "Wei Fan", "Xudong Guo", "Jianhong Tu", "Yang Su", "Chuqiao Kuang", "Yinger Zhang", "Dayiheng Liu"], "brief": "\u8bba\u6587\u63d0\u51fa VHD-Play\uff1a\u5148\u91c7\u6837\u5e76\u6c42\u89e3\u6570\u5b66\u673a\u5236\u6a21\u578b\uff0c\u518d\u5c06\u5176\u6e32\u67d3\u4e3a\u5e26\u72b6\u6001\u5de5\u5177\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u73af\u5883\u3002\u73af\u5883\u52a8\u6001\u4e0e\u8f68\u8ff9\u8bc4\u5206\u5171\u4eab\u540c\u4e00\u5df2\u89e3\u6a21\u578b\uff0c\u4ece\u800c\u4f4e\u6210\u672c\u751f\u6210\u53ef\u9a8c\u8bc1\u8bad\u7ec3\u73af\u5883\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27321", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u751f\u6210\u4e863300\u4e2a\u591a\u6837\u5316\u667a\u80fd\u4f53\u73af\u5883\uff0c\u5355\u4e2a\u6210\u672c\u4ec5\u51e0\u7f8e\u5206\uff0c\u5e76\u5177\u5907\u53ef\u9760\u7684\u53ef\u6267\u884c\u52a8\u6001\u4e0e\u8bc4\u5206\u53c2\u8003\u3002", "\u5728\u4e09\u7c7b\u73af\u5883\u4e0a\u8bad\u7ec3 Qwen3.6-35B-A3B \u540e\uff0c\u4e94\u7c7b\u8bca\u65ad\u5e73\u5747\u667a\u80fd\u4f53\u5f97\u5206\u4ece0.204\u63d0\u5347\u52300.815\u3002", "\u6cdb\u5316\u5230\u8bad\u7ec3\u65cf\u7559\u51fa\u5b9e\u4f8b\u30018\u4e2a\u672a\u89c1\u673a\u5236\u65cf\uff0c\u4ee5\u53ca\u51fd\u6570\u8c03\u7528\u3001\u65c5\u884c\u89c4\u5212\u3001365\u5929\u7535\u5546\u7b49\u5916\u90e8\u57fa\u51c6\uff1b\u7535\u5546\u57fa\u51c6\u4e0a\u8d85\u8fc7 Qwen3.7-Max\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u73af\u5883\u751f\u6210", "\u51fd\u6570\u8c03\u7528"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27321v1", "published_at": "2026-09-23", "score": 0.368, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.27321.png", "title": "Verifiable Hidden Dynamics Play: Generating Agentic RL Environments from Solved Mechanisms", "tldr": "\u4ece\u5df2\u89e3\u673a\u5236\u81ea\u52a8\u751f\u6210\u53ef\u9a8c\u8bc1\u667a\u80fd\u4f53RL\u73af\u5883", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa VHD-Play\uff1a\u5148\u91c7\u6837\u5e76\u6c42\u89e3\u6570\u5b66\u673a\u5236\u6a21\u578b\uff0c\u518d\u5c06\u5176\u6e32\u67d3\u4e3a\u5e26\u72b6\u6001\u5de5\u5177\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u73af\u5883\u3002\u73af\u5883\u52a8\u6001\u4e0e\u8f68\u8ff9\u8bc4\u5206\u5171\u4eab\u540c\u4e00\u5df2\u89e3\u6a21\u578b\uff0c\u4ece\u800c\u4f4e\u6210\u672c\u751f\u6210\u53ef\u9a8c\u8bc1\u8bad\u7ec3\u73af\u5883\u3002", "why_notable": "\u5b83\u628a\u201c\u5148\u5b9a\u4e49\u53ef\u6c42\u89e3\u673a\u5236\u3001\u518d\u751f\u6210\u73af\u5883\u201d\u7684\u6d41\u7a0b\u7528\u4e8e\u667a\u80fd\u4f53RL\u73af\u5883\u6784\u5efa\uff0c\u7f13\u89e3\u4e86\u957f\u7a0b\u4efb\u52a1\u4e2d\u52a8\u6001\u4e0e\u8bc4\u4f30\u96be\u5bf9\u9f50\u7684\u95ee\u9898\uff0c\u4e3a\u4f4e\u6210\u672c\u3001\u53ef\u6269\u5c55\u3001\u53ef\u9a8c\u8bc1\u7684LLM\u667a\u80fd\u4f53\u8bad\u7ec3\u63d0\u4f9b\u4e86\u65b0\u8303\u5f0f\u3002"}, {"abstract": "Long-horizon agentic tasks require an agent to modify an environment through a sequence of tool calls, with success determined by the final state. The standard recipe assigns a single outcome reward at the end and compares trajectories sampled for the same task. As a result, a group with no successful trajectory yields no training signal, failed attempts cannot be told apart by how close they came to completion, and turns that advance the task receive the same credit as turns that only query the environment. Prior work refines the unit of comparison from the trajectory to the step, or trains a reward model to supply intermediate signal: the former still derives its signal from final success alone, and the latter estimates it with a model. We observe that the acceptance checks that decide success can also be run on intermediate states, so progress is as verifiable as the outcome. We propose ProCredit, which turns this verified progress into credit: it reruns the acceptance checks after each turn, rewards the turn by its change in progress, and uses these rewards to assign credit both across attempts at the same task and across the turns within a trajectory. Starting from Qwen3.5 base models at three scales on AppWorld, ProCredit outperforms outcome-reward baselines and progress-based baselines in task completion rate at every scale on both test sets, exceeding the strongest outcome-reward baseline by 4.1 percentage points at 4B, and results in a second environment show the same direction of improvement. Ablations show that adding the final progress to the trajectory score alone does not improve performance: the gain comes from crediting progress to the turn where it occurs.", "arxiv_id": "2609.27532", "arxiv_url": "https://arxiv.org/abs/2609.27532", "authors": ["Ming Ma", "Yi Zhu", "Yiran Zhong", "Feida Zhu", "Chonghan Liu", "Pengkun Jiao", "Qichao Wang", "Yanhao Jia", "Tianming Yang", "Steven Hoi"], "brief": "\u8bba\u6587\u63d0\u51fa ProCredit\uff1a\u5728\u957f\u7a0b\u5de5\u5177\u8c03\u7528\u4efb\u52a1\u4e2d\uff0c\u4e0d\u53ea\u770b\u6700\u7ec8\u6210\u529f\u4e0e\u5426\uff0c\u800c\u662f\u5728\u6bcf\u4e00\u8f6e\u540e\u8fd0\u884c\u9a8c\u6536\u68c0\u67e5\uff0c\u5ea6\u91cf\u4efb\u52a1\u8fdb\u5c55\u53d8\u5316\uff0c\u5e76\u5c06\u8fdb\u5c55\u589e\u91cf\u4f5c\u4e3a\u8be5\u8f6e\u52a8\u4f5c\u7684\u5956\u52b1\u4fe1\u53f7\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27532", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u6700\u7ec8\u7ed3\u679c\u5956\u52b1\u7a00\u758f\u3001\u5931\u8d25\u8f68\u8ff9\u96be\u533a\u5206\u3001\u5173\u952e\u6b65\u9aa4\u65e0\u6cd5\u7cbe\u786e\u4fe1\u7528\u5206\u914d\u7684\u95ee\u9898\uff0c\u5c06\u9a8c\u6536\u68c0\u67e5\u6269\u5c55\u5230\u4e2d\u95f4\u72b6\u6001\u3002", "ProCredit \u540c\u65f6\u5728\u540c\u4e00\u4efb\u52a1\u7684\u591a\u6b21\u5c1d\u8bd5\u4e4b\u95f4\u3001\u4ee5\u53ca\u5355\u6761\u8f68\u8ff9\u7684\u5404\u4e2a\u6b65\u9aa4\u4e4b\u95f4\u5206\u914d\u57fa\u4e8e\u8fdb\u5c55\u7684\u4fe1\u7528\u3002", "\u5728 AppWorld \u4e0a\u4f7f\u7528\u4e09\u4e2a\u89c4\u6a21\u7684 Qwen3.5 \u57fa\u5ea7\u6a21\u578b\uff0c\u6240\u6709\u89c4\u6a21\u548c\u6d4b\u8bd5\u96c6\u5747\u4f18\u4e8e\u7ed3\u679c\u5956\u52b1\u4e0e\u8fdb\u5c55\u57fa\u7ebf\uff1b4B \u6a21\u578b\u8f83\u6700\u5f3a\u7ed3\u679c\u5956\u52b1\u57fa\u7ebf\u63d0\u5347 4.1 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27532v1", "published_at": "2026-09-23", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ProCredit: From Outcome Rewards to Progress Credit in Agentic Reinforcement Learning", "tldr": "\u7528\u53ef\u9a8c\u8bc1\u8fdb\u5c55\u4e3a\u957f\u7a0b\u667a\u80fd\u4f53\u9010\u6b65\u5206\u914d\u4fe1\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ProCredit\uff1a\u5728\u957f\u7a0b\u5de5\u5177\u8c03\u7528\u4efb\u52a1\u4e2d\uff0c\u4e0d\u53ea\u770b\u6700\u7ec8\u6210\u529f\u4e0e\u5426\uff0c\u800c\u662f\u5728\u6bcf\u4e00\u8f6e\u540e\u8fd0\u884c\u9a8c\u6536\u68c0\u67e5\uff0c\u5ea6\u91cf\u4efb\u52a1\u8fdb\u5c55\u53d8\u5316\uff0c\u5e76\u5c06\u8fdb\u5c55\u589e\u91cf\u4f5c\u4e3a\u8be5\u8f6e\u52a8\u4f5c\u7684\u5956\u52b1\u4fe1\u53f7\u3002", "why_notable": "\u5b83\u628a\u539f\u672c\u53ea\u7528\u4e8e\u6700\u7ec8\u5224\u5b9a\u7684\u53ef\u9a8c\u8bc1\u9a8c\u6536\u68c0\u67e5\u8f6c\u5316\u4e3a\u5bc6\u96c6\u8bad\u7ec3\u4fe1\u53f7\uff0c\u907f\u514d\u989d\u5916\u8bad\u7ec3\u5956\u52b1\u6a21\u578b\uff0c\u76f4\u63a5\u6539\u5584\u957f\u7a0b LLM \u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u4fe1\u7528\u5206\u914d\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent advances in large language models (LLMs) have enabled agents to tackle long-horizon tasks across diverse environments. To further improve agent performance, existing language world models typically predict environment observations, yet reconstructing high-entropy, execution-dependent tool responses offers limited value when real feedback is available. Meanwhile, agents suffer from \\emph{task-state contamination}, where unsupported assumptions and outdated plans persist in history and distort subsequent decisions. We propose the \\textbf{Agent-Editing World Model (AEWM)}, which models how reasoning and actions shape future task progress rather than simulating tool responses. AEWM combines \\textbf{Action Judge} to distinguish \\textsc{Critical}, \\textsc{Exploratory}, and \\textsc{Noisy} decisions with \\textbf{State Revision} to edit noisy reasoning--action continuations from the same observed history. \\textbf{EditAct} integrates these capabilities with real execution, directly changing the state underlying subsequent decisions rather than merely providing critiques. We train AEWM across Search, Terminal, and Software Engineering through mid-training and supervised fine-tuning. AEWM achieves 70.5\\% macro-F1 on our Action Judge benchmark, exceeding the strongest frontier baseline by 10.6 points. Across six benchmarks and three agent backbones, EditAct improves average scores by 3.2--6.7 points over the strongest baseline. Furthermore, rejection sampling fine-tuning on verified EditAct trajectories, termed \\textbf{AEWM-RFT}, improves over Self-RFT by 2.2--2.6 points across three domains without online AEWM guidance.", "arxiv_id": "2609.28416", "arxiv_url": "https://arxiv.org/abs/2609.28416", "authors": ["Shuang Sun", "Guoxin Chen", "Fanzhe Meng", "Jia Deng", "Huatong Song", "Jinhao Jiang", "Wayne Xin Zhao", "Hongteng Xu", "Ji-Rong Wen"], "brief": "\u8bba\u6587\u63d0\u51fa Agent-Editing World Model\uff08AEWM\uff09\uff0c\u4e0d\u518d\u9884\u6d4b\u5de5\u5177\u8fd4\u56de\u7b49\u73af\u5883\u89c2\u6d4b\uff0c\u800c\u662f\u5efa\u6a21\u63a8\u7406\u4e0e\u52a8\u4f5c\u5982\u4f55\u5f71\u54cd\u4efb\u52a1\u8fdb\u5c55\u3002\u5176\u901a\u8fc7 Action Judge \u8bc6\u522b\u5173\u952e\u3001\u63a2\u7d22\u6027\u3001\u566a\u58f0\u51b3\u7b56\uff0c\u5e76\u7528 State Revision \u76f4\u63a5\u4fee\u6b63\u4f1a\u6c61\u67d3\u540e\u7eed\u51b3\u7b56\u7684\u63a8\u7406\u2014\u52a8\u4f5c\u72b6\u6001\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28416", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u201c\u4efb\u52a1\u72b6\u6001\u6c61\u67d3\u201d\u95ee\u9898\uff1a\u5386\u53f2\u4e2d\u7684\u9519\u8bef\u5047\u8bbe\u3001\u8fc7\u65f6\u8ba1\u5212\u4f1a\u6301\u7eed\u5f71\u54cd\u667a\u80fd\u4f53\u540e\u7eed\u884c\u52a8\u3002", "EditAct \u5c06 AEWM \u4e0e\u771f\u5b9e\u6267\u884c\u53cd\u9988\u7ed3\u5408\uff0c\u76f4\u63a5\u7f16\u8f91\u667a\u80fd\u4f53\u540e\u7eed\u51b3\u7b56\u6240\u4f9d\u8d56\u7684\u72b6\u6001\uff0c\u800c\u975e\u53ea\u63d0\u4f9b\u8bc4\u8bba\u6216\u53cd\u601d\u3002", "AEWM \u5728 Action Judge \u57fa\u51c6\u4e0a\u8fbe\u5230 70.5% macro-F1\uff0c\u8f83\u6700\u5f3a\u524d\u6cbf\u57fa\u7ebf\u9ad8 10.6 \u4e2a\u70b9\uff1b\u5728\u516d\u4e2a\u57fa\u51c6\u3001\u4e09\u7c7b\u667a\u80fd\u4f53\u9aa8\u5e72\u4e0a\u5e73\u5747\u63d0\u5347 3.2\u20136.7 \u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28416v1", "published_at": "2026-09-23", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agent-Editing World Model: Rethinking World Modeling for LLM Agents", "tldr": "\u7528\u7f16\u8f91\u5f0f\u4e16\u754c\u6a21\u578b\u6539\u8fdbLLM\u667a\u80fd\u4f53\u51b3\u7b56\u72b6\u6001", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agent-Editing World Model\uff08AEWM\uff09\uff0c\u4e0d\u518d\u9884\u6d4b\u5de5\u5177\u8fd4\u56de\u7b49\u73af\u5883\u89c2\u6d4b\uff0c\u800c\u662f\u5efa\u6a21\u63a8\u7406\u4e0e\u52a8\u4f5c\u5982\u4f55\u5f71\u54cd\u4efb\u52a1\u8fdb\u5c55\u3002\u5176\u901a\u8fc7 Action Judge \u8bc6\u522b\u5173\u952e\u3001\u63a2\u7d22\u6027\u3001\u566a\u58f0\u51b3\u7b56\uff0c\u5e76\u7528 State Revision \u76f4\u63a5\u4fee\u6b63\u4f1a\u6c61\u67d3\u540e\u7eed\u51b3\u7b56\u7684\u63a8\u7406\u2014\u52a8\u4f5c\u72b6\u6001\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u91cd\u65b0\u5b9a\u4e49\u4e86\u9762\u5411LLM\u667a\u80fd\u4f53\u7684\u4e16\u754c\u6a21\u578b\u76ee\u6807\uff1a\u4ece\u201c\u6a21\u62df\u73af\u5883\u53cd\u9988\u201d\u8f6c\u5411\u201c\u7ef4\u62a4\u548c\u4fee\u6b63\u4efb\u52a1\u72b6\u6001\u201d\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u5de5\u5177\u53ef\u7528\u573a\u666f\uff0c\u5bf9\u957f\u7a0b\u4efb\u52a1\u3001\u8f6f\u4ef6\u5de5\u7a0b\u548c\u7ec8\u7aef\u64cd\u4f5c\u667a\u80fd\u4f53\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As Large Language Models (LLMs) evolve into autonomous agents that alter real-world states, ensuring operational safety across multi-step workflows has become a critical challenge. While recent work has moved beyond single-turn evaluation toward multi-turn paradigms, key limitations persist: step-level methods treat actions in isolation, missing how risks accumulate, while trajectory-level evaluations operate post-hoc, offering no opportunity for timely intervention. To address these limitations, we formalize Decoupled Proactive Safety Monitoring along three dimensions: whether to intervene, when to intervene, and what the risk is. We introduce PASTABench, a benchmark of 1,139 multi-turn trajectories spanning 5 risk categories and 13 subcategories. We further propose the Optimal Intervention Window (OIW), anchored by annotated Earliest-Signal and Trigger turns, to quantify intervention timeliness. Evaluation of 16 LLMs reveals that proactive intervention remains largely unsolved, with the best model achieving only 40.74% optimal-timing interventions. Fine-grained diagnosis further uncovers pervasive lexical overfitting: competitive safety scores of smaller models mask keyword hypersensitivity rather than genuine risk comprehension, as their proactive capability largely collapses once hazard vocabulary is neutralized.", "arxiv_id": "2609.28197", "arxiv_url": "https://arxiv.org/abs/2609.28197", "authors": ["Jiapeng Sun", "Yujin Zhou", "Han Zhu", "Pengcheng Wen", "Jiayi Zhou", "Sirui Han", "Yike Guo"], "brief": "\u8bba\u6587\u63d0\u51fa\u89e3\u8026\u5f0f\u4e3b\u52a8\u5b89\u5168\u76d1\u6d4b\u6846\u67b6\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u591a\u6b65\u4efb\u52a1\u4e2d\u662f\u5426\u3001\u4f55\u65f6\u4ee5\u53ca\u56e0\u4f55\u98ce\u9669\u8fdb\u884c\u5e72\u9884\u3002\u4f5c\u8005\u6784\u5efa\u4e86PASTABench\uff0c\u5305\u542b1139\u6761\u591a\u8f6e\u8f68\u8ff9\u30015\u7c7b\u98ce\u9669\u548c13\u4e2a\u5b50\u7c7b\uff0c\u5e76\u63d0\u51fa\u6700\u4f18\u5e72\u9884\u7a97\u53e3\u8861\u91cf\u5e72\u9884\u65f6\u673a\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28197", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["PASTABench\u8986\u76d6\u591a\u6b65\u667a\u80fd\u4f53\u8f68\u8ff9\uff0c\u5f3a\u8c03\u98ce\u9669\u968f\u6b65\u9aa4\u7d2f\u79ef\u800c\u975e\u5355\u6b65\u5b64\u7acb\u5224\u65ad\u3002", "\u63d0\u51faOptimal Intervention Window\uff0c\u4ee5Earliest-Signal\u548cTrigger\u6807\u6ce8\u91cf\u5316\u5e72\u9884\u662f\u5426\u53ca\u65f6\u3002", "\u8bc4\u6d4b16\u4e2aLLM\u53d1\u73b0\u4e3b\u52a8\u5e72\u9884\u80fd\u529b\u4ecd\u5f88\u5f31\uff0c\u6700\u4f73\u6a21\u578b\u4ec5\u670940.74%\u7684\u6700\u4f18\u65f6\u673a\u5e72\u9884\u7387\uff0c\u4e14\u5c0f\u6a21\u578b\u5b58\u5728\u660e\u663e\u5173\u952e\u8bcd\u8fc7\u62df\u5408\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28197v1", "published_at": "2026-09-23", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PASTABench: Proactive Assessment of Sequential Trajectories for Agent Safety", "tldr": "\u9762\u5411LLM\u667a\u80fd\u4f53\u7684\u4e3b\u52a8\u5b89\u5168\u76d1\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u89e3\u8026\u5f0f\u4e3b\u52a8\u5b89\u5168\u76d1\u6d4b\u6846\u67b6\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u591a\u6b65\u4efb\u52a1\u4e2d\u662f\u5426\u3001\u4f55\u65f6\u4ee5\u53ca\u56e0\u4f55\u98ce\u9669\u8fdb\u884c\u5e72\u9884\u3002\u4f5c\u8005\u6784\u5efa\u4e86PASTABench\uff0c\u5305\u542b1139\u6761\u591a\u8f6e\u8f68\u8ff9\u30015\u7c7b\u98ce\u9669\u548c13\u4e2a\u5b50\u7c7b\uff0c\u5e76\u63d0\u51fa\u6700\u4f18\u5e72\u9884\u7a97\u53e3\u8861\u91cf\u5e72\u9884\u65f6\u673a\u3002", "why_notable": "\u968f\u7740LLM\u667a\u80fd\u4f53\u5f00\u59cb\u6267\u884c\u4f1a\u6539\u53d8\u73b0\u5b9e\u72b6\u6001\u7684\u64cd\u4f5c\uff0c\u4e8b\u540e\u5b89\u5168\u8bc4\u4f30\u5df2\u4e0d\u8db3\u591f\uff1b\u8be5\u5de5\u4f5c\u5c06\u5b89\u5168\u8bc4\u6d4b\u63a8\u8fdb\u5230\u53ef\u63d0\u524d\u9884\u8b66\u548c\u5e72\u9884\u7684\u8f68\u8ff9\u7ea7\u573a\u666f\uff0c\u5bf9\u667a\u80fd\u4f53\u90e8\u7f72\u5b89\u5168\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Web agents are usually evaluated in live environments, where environment state and judge models drift between runs, so the same checkpoint rarely reproduces the same score, making controlled studies of training phenomena impractical. We present WebMRE, an offline benchmark of 541 tasks and 5,293 steps derived from successful WebArena trajectories, with fully audited test labels and a deterministic protocol that scores a checkpoint identically on every run without any environment. Each step pairs a human oriented guide sentence with a grounded action, enabling the first study of the mutual reinforcement effect between them in web agents. Averaged over three seeds the effect holds for both models in both decoding orders and grows with scale: jointly decoding a guide lifts element selection over an action only reference by 0.9 and 0.2 points for Qwen3.5-4B and by 1.7 and 2.2 points for Qwen3.5-9B. A mediation analysis shows that the guide is a causal channel rather than commentary: forcing the gold guide as a decoding prefix lifts action accuracy from .422 to .684, another step\u0027s guide collapses it to .055, and a paraphrase that renames the target still recovers half of the gain, so the channel carries instruction meaning and not only the label string. The same channel yields an offline reward that only a replayable protocol makes computable, though optimizing it from a strong checkpoint brings no gain yet. Our fine tuned models outperform GPT-5.5, Claude Opus 4.8, and Gemini 3.5 Flash, run zero shot, on every offline metric.", "arxiv_id": "2609.27353", "arxiv_url": "https://arxiv.org/abs/2609.27353", "authors": ["Chengguang Gan", "Yunhao Liang", "QingHao Zhang", "Shiwen Ni"], "brief": "\u8bba\u6587\u63d0\u51fa WebMRE\uff0c\u4e00\u4e2a\u7531 WebArena \u6210\u529f\u8f68\u8ff9\u6784\u5efa\u7684\u79bb\u7ebf\u7f51\u9875\u667a\u80fd\u4f53\u8bc4\u6d4b\u96c6\uff0c\u5305\u542b 541 \u4e2a\u4efb\u52a1\u548c 5,293 \u4e2a\u6b65\u9aa4\uff0c\u53ef\u5728\u65e0\u771f\u5b9e\u73af\u5883\u4e0b\u786e\u5b9a\u6027\u590d\u73b0\u5b9e\u9a8c\u5206\u6570\u3002\u5b83\u9996\u6b21\u7cfb\u7edf\u7814\u7a76\u4e86\u201c\u6307\u5357\u53e5\u5b50\u201d\u548c\u201c\u843d\u5730\u52a8\u4f5c\u201d\u4e4b\u95f4\u7684\u76f8\u4e92\u5f3a\u5316\u5173\u7cfb\uff0c\u5e76\u8bc1\u660e\u6307\u5357\u4e0d\u4ec5\u662f\u89e3\u91ca\u6587\u672c\uff0c\u800c\u662f\u5f71\u54cd\u52a8\u4f5c\u9009\u62e9\u7684\u56e0\u679c\u901a\u9053\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27353", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["WebMRE \u4f7f\u7528\u4eba\u5de5\u5bfc\u5411\u7684 guide sentence \u4e0e grounded action \u6210\u5bf9\u6807\u6ce8\uff0c\u5e76\u7ecf\u8fc7\u5ba1\u8ba1\u6d4b\u8bd5\u6807\u7b7e\uff0c\u907f\u514d\u5728\u7ebf\u73af\u5883\u72b6\u6001\u548c\u88c1\u5224\u6a21\u578b\u6f02\u79fb\u5bfc\u81f4\u7684\u4e0d\u53ef\u590d\u73b0\u95ee\u9898\u3002", "\u8054\u5408\u89e3\u7801\u6307\u5357\u4e0e\u52a8\u4f5c\u80fd\u7a33\u5b9a\u63d0\u5347\u5143\u7d20\u9009\u62e9\u51c6\u786e\u7387\uff0c\u4e14\u968f\u6a21\u578b\u89c4\u6a21\u589e\u5927\u6548\u679c\u66f4\u660e\u663e\uff1aQwen3.5-9B \u63d0\u5347\u7ea6 1.7 \u548c 2.2 \u4e2a\u70b9\u3002", "\u56e0\u679c\u4e2d\u4ecb\u5b9e\u9a8c\u663e\u793a\uff0c\u5f3a\u5236\u4f7f\u7528\u6b63\u786e\u6307\u5357\u53ef\u5c06\u52a8\u4f5c\u51c6\u786e\u7387\u4ece 0.422 \u63d0\u5347\u5230 0.684\uff0c\u6362\u6210\u5176\u4ed6\u6b65\u9aa4\u6307\u5357\u5219\u964d\u81f3 0.055\uff0c\u8bf4\u660e\u6307\u5357\u627f\u8f7d\u4e86\u771f\u5b9e\u4efb\u52a1\u6307\u4ee4\u4fe1\u606f\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u9875\u81ea\u52a8\u5316", "\u591a\u6a21\u6001", "\u79bb\u7ebf\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27353v1", "published_at": "2026-09-23", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Guides That Cause Actions: An Offline Study of Guide-Action Mutual Reinforcement in Multimodal Web Agents", "tldr": "\u79bb\u7ebf\u9a8c\u8bc1\u7f51\u9875\u667a\u80fd\u4f53\u4e2d\u6307\u5357\u80fd\u56e0\u679c\u4fc3\u8fdb\u52a8\u4f5c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WebMRE\uff0c\u4e00\u4e2a\u7531 WebArena \u6210\u529f\u8f68\u8ff9\u6784\u5efa\u7684\u79bb\u7ebf\u7f51\u9875\u667a\u80fd\u4f53\u8bc4\u6d4b\u96c6\uff0c\u5305\u542b 541 \u4e2a\u4efb\u52a1\u548c 5,293 \u4e2a\u6b65\u9aa4\uff0c\u53ef\u5728\u65e0\u771f\u5b9e\u73af\u5883\u4e0b\u786e\u5b9a\u6027\u590d\u73b0\u5b9e\u9a8c\u5206\u6570\u3002\u5b83\u9996\u6b21\u7cfb\u7edf\u7814\u7a76\u4e86\u201c\u6307\u5357\u53e5\u5b50\u201d\u548c\u201c\u843d\u5730\u52a8\u4f5c\u201d\u4e4b\u95f4\u7684\u76f8\u4e92\u5f3a\u5316\u5173\u7cfb\uff0c\u5e76\u8bc1\u660e\u6307\u5357\u4e0d\u4ec5\u662f\u89e3\u91ca\u6587\u672c\uff0c\u800c\u662f\u5f71\u54cd\u52a8\u4f5c\u9009\u62e9\u7684\u56e0\u679c\u901a\u9053\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u7f51\u9875\u667a\u80fd\u4f53\u8bad\u7ec3\u73b0\u8c61\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u7684\u79bb\u7ebf\u7814\u7a76\u534f\u8bae\uff0c\u5e76\u63ed\u793a\u81ea\u7136\u8bed\u8a00\u4e2d\u95f4\u6307\u5bfc\u53ef\u4ee5\u56e0\u679c\u6027\u6539\u5584 GUI/Web \u52a8\u4f5c\u9009\u62e9\uff0c\u5bf9\u667a\u80fd\u4f53\u8bc4\u6d4b\u3001\u8fc7\u7a0b\u76d1\u7763\u548c\u79bb\u7ebf\u5956\u52b1\u8bbe\u8ba1\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Real-world molecular design remains challenging for large language model (LLM)-based agents. It requires them to interpret design contexts, satisfy multiple constraints, identify infeasible specifications, and reason over multi-step tool outputs. Existing benchmarks do not capture this complexity, focusing instead on explicit and narrow constraints, only feasible problems, and single-path solutions. To address this gap, we propose MolDesignBench, a scenario-grounded benchmark that more closely reflects real-world molecular design for evaluating tool-augmented LLM agents. MolDesignBench comprises 2K generation and optimization instances that combine implicit requirements embedded in design narratives with explicit property and functional-group constraints, including infeasible cases, and require the effective use of 17 specialized chemistry tools. Experiments across diverse frontier LLMs reveal low success rates--with the best achieving only $\\sim43$\\%--and frequent failures in implicit-constraint reasoning, infeasibility detection, and tool reasoning. The corresponding fine-grained failure-mode analysis identifies implicit constraint interpretation and infeasibility detection as the primary bottlenecks, establishing MolDesignBench as a rigorous testbed to guide future research on chemical agents. The benchmark, tool interface, and evaluation code are publicly available.", "arxiv_id": "2609.27349", "arxiv_url": "https://arxiv.org/abs/2609.27349", "authors": ["Yongjun Jeong", "Hanbum Ko", "Ye Rin Kim", "Chanhui Lee", "Rodrigo Hormazabal", "Jaewan Lee", "Sehui Han", "Sungbin Lim", "Sungwoong Kim"], "brief": "\u8bba\u6587\u63d0\u51fa MolDesignBench\uff0c\u4e00\u4e2a\u573a\u666f\u5316\u5206\u5b50\u751f\u6210\u4e0e\u4f18\u5316\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u589e\u5f3a\u578b LLM \u667a\u80fd\u4f53\u5728\u771f\u5b9e\u5206\u5b50\u8bbe\u8ba1\u4e2d\u7684\u80fd\u529b\u3002\u5b83\u5305\u542b\u53d9\u4e8b\u4e2d\u7684\u9690\u5f0f\u9700\u6c42\u3001\u663e\u5f0f\u6027\u8d28\u4e0e\u5b98\u80fd\u56e2\u7ea6\u675f\u3001\u4e0d\u53ef\u884c\u6848\u4f8b\uff0c\u5e76\u8981\u6c42\u8c03\u7528\u591a\u79cd\u5316\u5b66\u5de5\u5177\u5b8c\u6210\u591a\u6b65\u63a8\u7406\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27349", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b\u7ea62000\u4e2a\u5206\u5b50\u751f\u6210\u4e0e\u4f18\u5316\u4efb\u52a1\uff0c\u8986\u76d6\u9690\u5f0f\u7ea6\u675f\u3001\u663e\u5f0f\u6027\u8d28\u7ea6\u675f\u3001\u5b98\u80fd\u56e2\u7ea6\u675f\u53ca\u4e0d\u53ef\u884c\u89c4\u683c\u8bc6\u522b\u3002", "\u63d0\u4f9b17\u79cd\u4e13\u4e1a\u5316\u5b66\u5de5\u5177\u63a5\u53e3\uff0c\u8003\u5bdf\u667a\u80fd\u4f53\u5bf9\u591a\u6b65\u5de5\u5177\u8f93\u51fa\u7684\u7406\u89e3\u3001\u89c4\u5212\u4e0e\u63a8\u7406\u80fd\u529b\u3002", "\u524d\u6cbfLLM\u5b9e\u9a8c\u4e2d\u6700\u4f73\u6210\u529f\u7387\u4ec5\u7ea643%\uff0c\u4e3b\u8981\u5931\u8d25\u6765\u81ea\u9690\u5f0f\u7ea6\u675f\u7406\u89e3\u3001\u4e0d\u53ef\u884c\u6027\u68c0\u6d4b\u548c\u5de5\u5177\u63a8\u7406\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5206\u5b50\u8bbe\u8ba1", "\u5de5\u5177\u8c03\u7528", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27349v1", "published_at": "2026-09-23", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MolDesignBench: Evaluating LLM-based Agent for Scenario-grounded Molecular Design", "tldr": "\u9762\u5411\u771f\u5b9e\u5206\u5b50\u8bbe\u8ba1\u7684LLM\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MolDesignBench\uff0c\u4e00\u4e2a\u573a\u666f\u5316\u5206\u5b50\u751f\u6210\u4e0e\u4f18\u5316\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u589e\u5f3a\u578b LLM \u667a\u80fd\u4f53\u5728\u771f\u5b9e\u5206\u5b50\u8bbe\u8ba1\u4e2d\u7684\u80fd\u529b\u3002\u5b83\u5305\u542b\u53d9\u4e8b\u4e2d\u7684\u9690\u5f0f\u9700\u6c42\u3001\u663e\u5f0f\u6027\u8d28\u4e0e\u5b98\u80fd\u56e2\u7ea6\u675f\u3001\u4e0d\u53ef\u884c\u6848\u4f8b\uff0c\u5e76\u8981\u6c42\u8c03\u7528\u591a\u79cd\u5316\u5b66\u5de5\u5177\u5b8c\u6210\u591a\u6b65\u63a8\u7406\u3002", "why_notable": "\u76f8\u6bd4\u73b0\u6709\u504f\u7b80\u5355\u3001\u53ef\u884c\u4e14\u5355\u8def\u5f84\u7684\u5206\u5b50\u8bbe\u8ba1\u57fa\u51c6\uff0cMolDesignBench\u66f4\u8d34\u8fd1\u771f\u5b9e\u836f\u7269/\u6750\u6599\u8bbe\u8ba1\u573a\u666f\uff0c\u63ed\u793a\u4e86\u5f53\u524dLLM\u5316\u5b66\u667a\u80fd\u4f53\u5728\u7ea6\u675f\u7406\u89e3\u548c\u53ef\u884c\u6027\u5224\u65ad\u4e0a\u7684\u5173\u952e\u77ed\u677f\u3002"}, {"abstract": "Scaling a language model is not only a question of final quality: the architectural choice determines how much computation is spent during training, prompt processing, and autoregressive decoding to achieve certain model quality. An ideal model architecture should lower all above computation costs to facilitate scaling to a larger model, while ensure the larger model indeed outperforms smaller baselines. We introduce KV-Invariant Transformer Expansion (KITE), a scaling paradigm that achieves this goal. It trains the model from a smaller size to a larger size (i.e., saving training costs via upcycling), while places newly added parameters in regions that do not affect attention KV. Consequently, during inference, prefilling KV only relies on the smaller part of the model, so the inference costs are saved. As a concrete instantiation, we present Step Scale Transformer (SST), a two-tower decoder in which one tower produces KV and the other reads them. At comparable cumulative training compute, SST, a 67B MoE model with 2.15B active body parameters per decode token, achieves lower training loss than 47B and 63B MoE Transformers with 1.48B and 2.02B active body parameters, respectively, while reducing estimated inference cost by 6.7% and 31.6%.", "arxiv_id": "2609.27294", "arxiv_url": "https://arxiv.org/abs/2609.27294", "authors": ["Zhiheng Hu", "Yixun Wei", "Jian Zhou", "Yizhuang Zhou", "Ji Li", "Xing Chen", "Yang Li", "Bojun Wang", "Yibo Zhu", "Xiangyu Zhang", "Daxin Jiang"], "brief": "\u8bba\u6587\u63d0\u51faKV-Invariant Transformer Expansion\uff08KITE\uff09\u7f29\u653e\u8303\u5f0f\uff1a\u4ece\u5c0f\u6a21\u578b\u589e\u91cf\u6269\u5c55\u5230\u5927\u6a21\u578b\uff0c\u5e76\u5c06\u65b0\u589e\u53c2\u6570\u653e\u5728\u4e0d\u5f71\u54cd\u6ce8\u610f\u529bKV\u7684\u4f4d\u7f6e\u3002\u5176\u5177\u4f53\u5b9e\u73b0Step Scale Transformer\uff08SST\uff09\u91c7\u7528\u53cc\u5854\u89e3\u7801\u5668\uff0c\u8ba9\u4e00\u5854\u751f\u6210KV\u3001\u53e6\u4e00\u5854\u8bfb\u53d6KV\uff0c\u4ece\u800c\u51cf\u5c11\u9884\u586b\u5145\u4e0e\u89e3\u7801\u6210\u672c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27294", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["KITE\u5229\u7528upcycling\u4ece\u5c0f\u6a21\u578b\u6269\u5c55\u5230\u5927\u6a21\u578b\uff0c\u964d\u4f4e\u8bad\u7ec3\u6210\u672c\uff0c\u540c\u65f6\u4fdd\u8bc1\u6269\u5c55\u540e\u6a21\u578b\u8d28\u91cf\u63d0\u5347\u3002", "\u65b0\u589e\u53c2\u6570\u4e0d\u6539\u53d8attention KV\uff0c\u56e0\u6b64\u63a8\u7406\u65f6KV\u9884\u586b\u5145\u4e3b\u8981\u4f9d\u8d56\u8f83\u5c0f\u6a21\u578b\u90e8\u5206\uff0c\u8282\u7701prefill\u8ba1\u7b97\u3002", "67B MoE\u7248SST\u5728\u76f8\u8fd1\u7d2f\u8ba1\u8bad\u7ec3\u8ba1\u7b97\u4e0b\uff0c\u76f8\u6bd447B\u548c63B MoE Transformer\u8bad\u7ec3\u635f\u5931\u66f4\u4f4e\uff0c\u5e76\u4f30\u8ba1\u964d\u4f4e6.7%\u548c31.6%\u63a8\u7406\u6210\u672c\u3002"], "keywords": ["\u5927\u6a21\u578b\u67b6\u6784", "\u9ad8\u6548\u63a8\u7406", "MoE", "\u6a21\u578b\u6269\u5c55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27294v1", "published_at": "2026-09-23", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "KITE: KV-Invariant Transformer Expansion for Efficient Agentic LLM Scaling", "tldr": "KITE\u901a\u8fc7KV\u4e0d\u53d8\u6269\u5c55\u964d\u4f4e\u5927\u6a21\u578b\u8bad\u7ec3\u4e0e\u63a8\u7406\u6210\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faKV-Invariant Transformer Expansion\uff08KITE\uff09\u7f29\u653e\u8303\u5f0f\uff1a\u4ece\u5c0f\u6a21\u578b\u589e\u91cf\u6269\u5c55\u5230\u5927\u6a21\u578b\uff0c\u5e76\u5c06\u65b0\u589e\u53c2\u6570\u653e\u5728\u4e0d\u5f71\u54cd\u6ce8\u610f\u529bKV\u7684\u4f4d\u7f6e\u3002\u5176\u5177\u4f53\u5b9e\u73b0Step Scale Transformer\uff08SST\uff09\u91c7\u7528\u53cc\u5854\u89e3\u7801\u5668\uff0c\u8ba9\u4e00\u5854\u751f\u6210KV\u3001\u53e6\u4e00\u5854\u8bfb\u53d6KV\uff0c\u4ece\u800c\u51cf\u5c11\u9884\u586b\u5145\u4e0e\u89e3\u7801\u6210\u672c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u540c\u65f6\u5173\u6ce8\u8bad\u7ec3\u3001prompt\u5904\u7406\u548c\u81ea\u56de\u5f52\u89e3\u7801\u4e09\u7c7b\u6210\u672c\uff0c\u63d0\u51fa\u4e00\u79cd\u517c\u987e\u6a21\u578b\u6269\u5c55\u8d28\u91cf\u4e0e\u63a8\u7406\u6548\u7387\u7684\u67b6\u6784\u7f29\u653e\u601d\u8def\uff0c\u5bf9\u5927\u89c4\u6a21LLM\u5c24\u5176\u662f\u9ad8\u9891\u957f\u4e0a\u4e0b\u6587\u8c03\u7528\u573a\u666f\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Existing machine learning (ML) scaling laws relate predictive loss to compute, model parameters, and data. However, as models are increasingly deployed through agentic harnesses, loss alone is insufficient to characterize downstream performance: models with similar loss can exhibit different capabilities in reasoning, retrieval, planning, and adaptation. Yet, no unified framework connects such capabilities to the coupled resources available across the ML lifecycle. We bridge this gap by introducing a capability manifold, a multidimensional framework mapping downstream capabilities to pre-training, post-training, and test-time resources through bounded scaling functions. Analytical Jacobians quantify capability sensitivity to resource changes and interactions. As an initial application, we embed Kaplan- and Chinchilla-type scaling laws and test-time compute within the framework, demonstrating how existing scaling relationships can be unified as trajectories on a common capability manifold.", "arxiv_id": "2609.27588", "arxiv_url": "https://arxiv.org/abs/2609.27588", "authors": ["Syed Ali Raza Zaidi", "Maryam Hafeez"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u80fd\u529b\u6d41\u5f62\u201d\u6846\u67b6\uff0c\u5c06\u63a8\u7406\u3001\u68c0\u7d22\u3001\u89c4\u5212\u3001\u9002\u5e94\u7b49\u4e0b\u6e38\u80fd\u529b\u6620\u5c04\u5230\u9884\u8bad\u7ec3\u3001\u540e\u8bad\u7ec3\u4e0e\u6d4b\u8bd5\u65f6\u8d44\u6e90\u3002\u5b83\u7528\u6709\u754c\u7f29\u653e\u51fd\u6570\u548c\u89e3\u6790\u96c5\u53ef\u6bd4\u6765\u91cf\u5316\u8d44\u6e90\u53d8\u5316\u53ca\u4ea4\u4e92\u5bf9\u80fd\u529b\u7684\u5f71\u54cd\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27588", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u4f20\u7edf\u4ee5\u635f\u5931\u4e3a\u6838\u5fc3\u7684\u7f29\u653e\u5f8b\u6269\u5c55\u5230\u591a\u7ef4\u4e0b\u6e38\u80fd\u529b\u8868\u5f81", "\u5f15\u5165\u89e3\u6790\u96c5\u53ef\u6bd4\uff0c\u8861\u91cf\u4e0d\u540c\u751f\u547d\u5468\u671f\u8d44\u6e90\u5bf9\u80fd\u529b\u63d0\u5347\u7684\u654f\u611f\u6027\u4e0e\u8026\u5408\u5173\u7cfb", "\u628a Kaplan\u3001Chinchilla \u7c7b\u7f29\u653e\u5f8b\u53ca\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7edf\u4e00\u4e3a\u80fd\u529b\u6d41\u5f62\u4e0a\u7684\u8f68\u8ff9"], "keywords": ["\u7f29\u653e\u5f8b", "\u6a21\u578b\u80fd\u529b", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u673a\u5668\u5b66\u4e60\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27588v1", "published_at": "2026-09-23", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Capability Manifold and ML Scaling Laws", "tldr": "\u63d0\u51fa\u80fd\u529b\u6d41\u5f62\u7edf\u4e00\u523b\u753b\u6a21\u578b\u80fd\u529b\u6269\u5c55\u89c4\u5f8b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u80fd\u529b\u6d41\u5f62\u201d\u6846\u67b6\uff0c\u5c06\u63a8\u7406\u3001\u68c0\u7d22\u3001\u89c4\u5212\u3001\u9002\u5e94\u7b49\u4e0b\u6e38\u80fd\u529b\u6620\u5c04\u5230\u9884\u8bad\u7ec3\u3001\u540e\u8bad\u7ec3\u4e0e\u6d4b\u8bd5\u65f6\u8d44\u6e90\u3002\u5b83\u7528\u6709\u754c\u7f29\u653e\u51fd\u6570\u548c\u89e3\u6790\u96c5\u53ef\u6bd4\u6765\u91cf\u5316\u8d44\u6e90\u53d8\u5316\u53ca\u4ea4\u4e92\u5bf9\u80fd\u529b\u7684\u5f71\u54cd\u3002", "why_notable": "\u8be5\u6846\u67b6\u4e3a\u7406\u89e3\u5927\u6a21\u578b\u5728\u771f\u5b9e\u90e8\u7f72\u4e2d\u7684\u80fd\u529b\u5dee\u5f02\u63d0\u4f9b\u4e86\u7edf\u4e00\u89c6\u89d2\uff0c\u5c24\u5176\u9002\u5408\u5206\u6790\u8bad\u7ec3\u8d44\u6e90\u3001\u540e\u8bad\u7ec3\u7b56\u7565\u548c\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u5982\u4f55\u5171\u540c\u5f71\u54cd\u4e0b\u6e38\u8868\u73b0\u3002"}, {"abstract": "Real-time payment fraud detection is a non-stationary streaming prediction problem: adversaries adapt before supervised labels mature, and localized burst attacks can cause losses before retraining. Production systems typically rely on tabular classifiers and rules, which can struggle to capture these emerging sequential patterns before periodic retraining occurs. We present SR-Fraud, an outcome-supervised reflective LLM framework that decouples request-time decisions from offline adaptation. A frozen, stateless agent scores each transaction from a Hybrid Episodic Window to track behavioral shifts, while an offline reflection agent proposes boundary hypotheses from matured errors. A deterministic verifier then admits only supported hypotheses into an executable knowledge state. On a production payment-fraud benchmark, SR-Fraud improves all detection metrics over its frozen decision agent, obtains higher point estimates than static and periodically retrained CatBoost, and detects an emerging fraud burst.", "arxiv_id": "2609.27287", "arxiv_url": "https://arxiv.org/abs/2609.27287", "authors": ["Xuwei Tan", "Yao Ma", "Xueru Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa SR-Fraud\uff0c\u4e00\u4e2a\u9762\u5411\u975e\u5e73\u7a33\u5b9e\u65f6\u652f\u4ed8\u6b3a\u8bc8\u68c0\u6d4b\u7684\u7ed3\u679c\u76d1\u7763\u53cd\u601d\u5f0f LLM \u6846\u67b6\u3002\u5b83\u5c06\u8bf7\u6c42\u65f6\u4ea4\u6613\u8bc4\u5206\u4e0e\u79bb\u7ebf\u9002\u5e94\u89e3\u8026\uff0c\u7528\u79bb\u7ebf\u53cd\u601d\u4ece\u6210\u719f\u9519\u8bef\u4e2d\u751f\u6210\u53ef\u9a8c\u8bc1\u7684\u6b3a\u8bc8\u8fb9\u754c\u5047\u8bbe\u5e76\u66f4\u65b0\u53ef\u6267\u884c\u77e5\u8bc6\u72b6\u6001\u3002", "categories": ["cs.LG", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27287", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u51bb\u7ed3\u3001\u65e0\u72b6\u6001\u7684\u8bf7\u6c42\u65f6\u667a\u80fd\u4f53\u57fa\u4e8e Hybrid Episodic Window \u4e3a\u6bcf\u7b14\u4ea4\u6613\u8bc4\u5206\uff0c\u4ee5\u6355\u6349\u8fd1\u671f\u884c\u4e3a\u53d8\u5316\u548c\u5e8f\u5217\u6a21\u5f0f", "\u79bb\u7ebf\u53cd\u601d\u667a\u80fd\u4f53\u6839\u636e\u5df2\u6210\u719f\u6807\u7b7e\u4e2d\u7684\u9519\u8bef\u63d0\u51fa\u8fb9\u754c\u5047\u8bbe\uff0c\u518d\u7531\u786e\u5b9a\u6027\u9a8c\u8bc1\u5668\u7b5b\u9009\u53ef\u652f\u6301\u7684\u5047\u8bbe", "\u5728\u751f\u4ea7\u652f\u4ed8\u6b3a\u8bc8\u57fa\u51c6\u4e0a\uff0cSR-Fraud \u5168\u9762\u4f18\u4e8e\u5176\u51bb\u7ed3\u51b3\u7b56\u667a\u80fd\u4f53\uff0c\u70b9\u4f30\u8ba1\u9ad8\u4e8e\u9759\u6001\u548c\u5468\u671f\u91cd\u8bad\u7684 CatBoost\uff0c\u5e76\u80fd\u53d1\u73b0\u65b0\u5174\u6b3a\u8bc8\u7206\u53d1"], "keywords": ["\u667a\u80fd\u4f53", "\u6b3a\u8bc8\u68c0\u6d4b", "\u5728\u7ebf\u5b66\u4e60", "\u91d1\u878d\u98ce\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27287v1", "published_at": "2026-09-23", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SR-Fraud: An Outcome-Supervised Reflective LLM Agent Framework for Non-Stationary Payment Fraud Detection", "tldr": "\u7528\u53cd\u601d\u5f0fLLM\u667a\u80fd\u4f53\u5e94\u5bf9\u652f\u4ed8\u6b3a\u8bc8\u6f02\u79fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SR-Fraud\uff0c\u4e00\u4e2a\u9762\u5411\u975e\u5e73\u7a33\u5b9e\u65f6\u652f\u4ed8\u6b3a\u8bc8\u68c0\u6d4b\u7684\u7ed3\u679c\u76d1\u7763\u53cd\u601d\u5f0f LLM \u6846\u67b6\u3002\u5b83\u5c06\u8bf7\u6c42\u65f6\u4ea4\u6613\u8bc4\u5206\u4e0e\u79bb\u7ebf\u9002\u5e94\u89e3\u8026\uff0c\u7528\u79bb\u7ebf\u53cd\u601d\u4ece\u6210\u719f\u9519\u8bef\u4e2d\u751f\u6210\u53ef\u9a8c\u8bc1\u7684\u6b3a\u8bc8\u8fb9\u754c\u5047\u8bbe\u5e76\u66f4\u65b0\u53ef\u6267\u884c\u77e5\u8bc6\u72b6\u6001\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 LLM \u53cd\u601d\u4e0e\u53ef\u9a8c\u8bc1\u89c4\u5219\u66f4\u65b0\u7ed3\u5408\uff0c\u7528\u4e8e\u6807\u7b7e\u6ede\u540e\u3001\u653b\u51fb\u5feb\u901f\u6f14\u5316\u7684\u91d1\u878d\u98ce\u63a7\u573a\u666f\uff0c\u63d0\u4f9b\u4e86\u6bd4\u5468\u671f\u6027\u91cd\u8bad\u7ec3\u66f4\u7075\u6d3b\u7684\u5728\u7ebf\u9002\u5e94\u601d\u8def\u3002"}, {"abstract": "Automated LOD3 building modeling typically relies on purpose-built geometric or learning-based pipelines, limiting flexibility across heterogeneous buildings and input evidence conditions. This study investigates whether Astra, a general-purpose multimodal foundation model, can address these limitations through zero-shot reconstruction of LOD3 building models within an agentic framework under bounded autonomy. AstraLOD3 combines multi-view images, calibrated cameras, and a filtered sparse SfM point cloud with a natural-language reconstruction specification, while the Astra agent dynamically selects and executes computational procedures using Python and Blender. Across 35 runs, including 24 benchmark buildings, AstraLOD3 achieved a mean FRDS of 0.9647 and geometric agreement comparable to that of previous purpose-built methods. Controlled ablations further revealed the effects of reconstruction guidance, evidence modalities, model configuration, and run-to-run variability. The results demonstrate that structured LOD3 reconstruction can be formulated as a constrained agentic process rather than as a fixed pipeline. Future work will investigate adaptive refinement, user-guided correction, task-specific specialization, and damage-aware reconstruction.", "arxiv_id": "2609.28061", "arxiv_url": "https://arxiv.org/abs/2609.28061", "authors": ["Bryan G. Pantoja-Rosero"], "brief": "\u8bba\u6587\u63d0\u51fa AstraLOD3\uff0c\u5c06\u901a\u7528\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b Astra \u7f6e\u4e8e\u53d7\u9650\u81ea\u4e3b\u7684\u667a\u80fd\u4f53\u6846\u67b6\u4e2d\uff0c\u7ed3\u5408\u591a\u89c6\u56fe\u56fe\u50cf\u3001\u76f8\u673a\u6807\u5b9a\u3001\u7a00\u758f SfM \u70b9\u4e91\u548c\u81ea\u7136\u8bed\u8a00\u89c4\u8303\uff0c\u52a8\u6001\u8c03\u7528 Python \u4e0e Blender \u5b8c\u6210 LOD3 \u5efa\u7b51\u91cd\u5efa\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28061", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u65e0\u9700\u4e13\u7528\u51e0\u4f55\u6216\u5b66\u4e60\u6d41\u6c34\u7ebf\uff0c\u4ee5\u96f6\u6837\u672c\u65b9\u5f0f\u5904\u7406\u5f02\u6784\u5efa\u7b51\u4e0e\u4e0d\u540c\u8bc1\u636e\u6761\u4ef6\u3002", "\u572835\u6b21\u8fd0\u884c\u3001\u5305\u542b24\u4e2a\u57fa\u51c6\u5efa\u7b51\u7684\u5b9e\u9a8c\u4e2d\uff0c\u5e73\u5747 FRDS \u8fbe\u52300.9647\uff0c\u51e0\u4f55\u4e00\u81f4\u6027\u63a5\u8fd1\u65e2\u6709\u4e13\u7528\u65b9\u6cd5\u3002", "\u6d88\u878d\u5b9e\u9a8c\u5206\u6790\u4e86\u91cd\u5efa\u6307\u5bfc\u3001\u8f93\u5165\u6a21\u6001\u3001\u6a21\u578b\u914d\u7f6e\u548c\u8fd0\u884c\u968f\u673a\u6027\u5bf9\u7ed3\u679c\u7684\u5f71\u54cd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u4e09\u7ef4\u91cd\u5efa", "\u5efa\u7b51\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28061v1", "published_at": "2026-09-23", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AstraLOD3: Zero-shot multimodal agentic reconstruction of LOD3 building models", "tldr": "\u591a\u6a21\u6001\u667a\u80fd\u4f53\u96f6\u6837\u672c\u91cd\u5efaLOD3\u5efa\u7b51\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AstraLOD3\uff0c\u5c06\u901a\u7528\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b Astra \u7f6e\u4e8e\u53d7\u9650\u81ea\u4e3b\u7684\u667a\u80fd\u4f53\u6846\u67b6\u4e2d\uff0c\u7ed3\u5408\u591a\u89c6\u56fe\u56fe\u50cf\u3001\u76f8\u673a\u6807\u5b9a\u3001\u7a00\u758f SfM \u70b9\u4e91\u548c\u81ea\u7136\u8bed\u8a00\u89c4\u8303\uff0c\u52a8\u6001\u8c03\u7528 Python \u4e0e Blender \u5b8c\u6210 LOD3 \u5efa\u7b51\u91cd\u5efa\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u590d\u6742\u7ed3\u6784\u5316\u5efa\u7b51\u5efa\u6a21\u53ef\u88ab\u8868\u8ff0\u4e3a\u53d7\u7ea6\u675f\u7684\u667a\u80fd\u4f53\u8fc7\u7a0b\uff0c\u800c\u975e\u56fa\u5b9a\u5de5\u7a0b\u6d41\u6c34\u7ebf\uff0c\u4e3a\u66f4\u7075\u6d3b\u7684\u4e09\u7ef4\u91cd\u5efa\u3001\u4ea4\u4e92\u5f0f\u4fee\u6b63\u548c\u707e\u635f\u611f\u77e5\u5efa\u6a21\u63d0\u4f9b\u4e86\u65b0\u8303\u5f0f\u3002"}, {"abstract": "Video understanding is usually benchmarked on curated, single-actor, or professionally filmed clips, and a strong score there is routinely read as evidence a model is robust enough for deployment. Amateur team sport is a useful, largely untested place to check that assumption: over eight million students played a school sport in the United States in 2024-25 alone, almost none of it filmed by more than a single fixed camera, with several candidate actors crowded into frame and no operator or second angle to fall back on. Using volleyball as a test case, we ask whether strong performance on general video and world-model benchmarks translates into reliable, per-player attribution once footage is this chaotic, turning footage into statistics through a chain of tasks from finding play boundaries to naming who did what. We evaluate four approaches (prompting and agentic reasoning over frontier vision-language models, classical computer vision with small trained specialists, self-supervised video world models, and manual annotation) at every stage, on 66 amateur matches with 46,648 human-labelled contacts, filmed under conditions no published benchmark uses. No single paradigm wins every stage, and static, single-frame computer vision is not competitive at any stage involving motion or identity. A prompted model segments matches well, yet a far smaller trained model beats it at spotting contacts for a fraction of the cost, and the sport\u0027s own rules recover rally outcomes the pixels cannot. Identity is where every automated approach struggles: a jersey number is a static fact temporal reasoning cannot recover if never visible, unlike sporting action, a repeated motor pattern a temporal model can exploit, which is why holistic reasoning improves event detection while identity stays unchanged. We close with where each approach earns its cost, and what transfers beyond volleyball to amateur sport.", "arxiv_id": "2609.28049", "arxiv_url": "https://arxiv.org/abs/2609.28049", "authors": ["Sai Varun Kodathala", "Prashanth Pollishetty", "Jaylen Cargill"], "brief": "\u672c\u6587\u4ee566\u573a\u4e1a\u4f59\u6392\u7403\u6bd4\u8d5b\u300146,648\u4e2a\u4eba\u5de5\u6807\u6ce8\u89e6\u7403\u4e3a\u6d4b\u8bd5\u96c6\uff0c\u7cfb\u7edf\u8bc4\u4f30\u524d\u6cbf\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63d0\u793a/\u63a8\u7406\u3001\u4f20\u7edf\u89c6\u89c9\u5c0f\u6a21\u578b\u3001\u81ea\u76d1\u7763\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4e0e\u4eba\u5de5\u6807\u6ce8\u5728\u5355\u673a\u4f4d\u6df7\u4e71\u4f53\u80b2\u89c6\u9891\u4e2d\u7684\u8868\u73b0\u3002\u7814\u7a76\u53d1\u73b0\u4e0d\u540c\u8303\u5f0f\u5404\u6709\u4f18\u52bf\uff0c\u4f46\u7403\u5458\u8eab\u4efd\u5f52\u56e0\u662f\u6240\u6709\u81ea\u52a8\u65b9\u6cd5\u7684\u5171\u540c\u77ed\u677f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28049", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u793a\u5f0f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u8f83\u597d\u5b8c\u6210\u6bd4\u8d5b\u5206\u6bb5\uff0c\u4f46\u5728\u89e6\u7403\u68c0\u6d4b\u4e0a\uff0c\u5c0f\u578b\u4e13\u95e8\u8bad\u7ec3\u6a21\u578b\u4ee5\u66f4\u4f4e\u6210\u672c\u8868\u73b0\u66f4\u597d\u3002", "\u9759\u6001\u5355\u5e27\u8ba1\u7b97\u673a\u89c6\u89c9\u5728\u6d89\u53ca\u8fd0\u52a8\u6216\u8eab\u4efd\u7684\u4efb\u52a1\u4e2d\u7ade\u4e89\u529b\u4e0d\u8db3\uff0c\u65f6\u5e8f\u5efa\u6a21\u5bf9\u4e8b\u4ef6\u68c0\u6d4b\u66f4\u6709\u5e2e\u52a9\u3002", "\u7403\u8863\u53f7\u7801\u7b49\u8eab\u4efd\u4fe1\u606f\u82e5\u753b\u9762\u4e2d\u4e0d\u53ef\u89c1\uff0c\u65f6\u95f4\u63a8\u7406\u4e5f\u65e0\u6cd5\u8865\u6551\uff1b\u76f8\u6bd4\u4e4b\u4e0b\uff0c\u4f53\u80b2\u52a8\u4f5c\u6a21\u5f0f\u53ef\u88ab\u65f6\u5e8f\u6a21\u578b\u5229\u7528\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u4f53\u80b2\u5206\u6790", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28049v1", "published_at": "2026-09-23", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Prompt, Probe, Train, or Annotate? Single-camera sports video understanding in amateur settings", "tldr": "\u4e1a\u4f59\u6392\u7403\u5355\u673a\u4f4d\u89c6\u9891\u7406\u89e3\u4ecd\u96be\u53ef\u9760\u5f52\u56e0", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ee566\u573a\u4e1a\u4f59\u6392\u7403\u6bd4\u8d5b\u300146,648\u4e2a\u4eba\u5de5\u6807\u6ce8\u89e6\u7403\u4e3a\u6d4b\u8bd5\u96c6\uff0c\u7cfb\u7edf\u8bc4\u4f30\u524d\u6cbf\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63d0\u793a/\u63a8\u7406\u3001\u4f20\u7edf\u89c6\u89c9\u5c0f\u6a21\u578b\u3001\u81ea\u76d1\u7763\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4e0e\u4eba\u5de5\u6807\u6ce8\u5728\u5355\u673a\u4f4d\u6df7\u4e71\u4f53\u80b2\u89c6\u9891\u4e2d\u7684\u8868\u73b0\u3002\u7814\u7a76\u53d1\u73b0\u4e0d\u540c\u8303\u5f0f\u5404\u6709\u4f18\u52bf\uff0c\u4f46\u7403\u5458\u8eab\u4efd\u5f52\u56e0\u662f\u6240\u6709\u81ea\u52a8\u65b9\u6cd5\u7684\u5171\u540c\u77ed\u677f\u3002", "why_notable": "\u8bba\u6587\u6311\u6218\u4e86\u901a\u7528\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u5206\u6570\u53ef\u76f4\u63a5\u4ee3\u8868\u771f\u5b9e\u90e8\u7f72\u80fd\u529b\u7684\u5047\u8bbe\uff0c\u63ed\u793a\u4e1a\u4f59\u4f53\u80b2\u8fd9\u79cd\u9ad8\u9700\u6c42\u3001\u4f4e\u62cd\u6444\u8d28\u91cf\u573a\u666f\u4e2d\u7684\u5173\u952e\u74f6\u9888\uff0c\u5e76\u4e3a\u63d0\u793a\u6a21\u578b\u3001\u5c0f\u6a21\u578b\u8bad\u7ec3\u3001\u89c4\u5219\u63a8\u7406\u4e0e\u4eba\u5de5\u6807\u6ce8\u7684\u6210\u672c\u6536\u76ca\u9009\u62e9\u63d0\u4f9b\u4e86\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "Advances in generative models have improved video fidelity, enabling long-horizon generation, interactive world modeling, and evolving visual environments. Autoregressive (AR) video generation extends visual sequences through causal rollouts. However, a fundamental bottleneck emerges: as the generated sequence expands, practical models must operate under strictly bounded context windows, storage, and computational limits. Consequently, critical historical information, e.g., entity identities, dynamic states, and intervention-induced causal changes, often leaves the active context long before its relevance diminishes. Overcoming this limitation and maintaining temporal persistence constitutes a fundamental memory problem. We present a systematic and comprehensive review of memory mechanisms in AR video generation. We formulate memory operationally as persistent historical information maintained across outer AR steps, capable of influencing future generation even after the originating evidence is no longer locally accessible. Building upon this unified framework, we organize the literature through five complementary perspectives: (I) Forms, the representational carriers of history; (II) Functions, the specific semantic and physical information requiring preservation; (III) Operations, the lifecycle of writing, reading, updating, managing, and integrating memory; (IV) Learning, the optimization of memory behaviors under closed-loop rollouts; and (V) Evaluation, the paradigms for diagnosing genuine memory capabilities. We conclude by synthesizing open challenges, including composable and resource-aware memory architectures, trustworthy state updating, self-rollout learning, and standardized evaluation. By bridging representations, mechanisms, and learning paradigms, this paper establishes a structured foundation for developing reliable, memory-conditioned video generation systems.", "arxiv_id": "2609.28466", "arxiv_url": "https://arxiv.org/abs/2609.28466", "authors": ["Harold Haodong Chen", "Rongjin Guo", "Disen Lan", "Wen-Jie Shu", "Hongfei Zhang", "Hanzhe Hu", "Shengtao Yao", "Zixin Zhang", "Guibin Zhang", "Zhefan Rao", "Jinxiu Liu", "Yexin Liu", "Rui Peng", "Yuhao Liu", "Bin Ren", "Shuai Yang", "Yukang Chen", "Salman Khan", "Ying-Cong Chen", "Ser-Nam Lim", "Rynson W. H. Lau", "Nicu Sebe", "Yu Cheng", "Ming-Hsuan Yang", "Qifeng Chen"], "brief": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e86\u81ea\u56de\u5f52\u89c6\u9891\u751f\u6210\u5728\u6709\u9650\u4e0a\u4e0b\u6587\u4e0b\u7684\u957f\u671f\u8bb0\u5fc6\u95ee\u9898\uff0c\u5e76\u5c06\u8bb0\u5fc6\u5b9a\u4e49\u4e3a\u80fd\u8de8\u751f\u6210\u6b65\u9aa4\u6301\u7eed\u5f71\u54cd\u672a\u6765\u5e27\u7684\u5386\u53f2\u4fe1\u606f\u3002\u8bba\u6587\u4ece\u8868\u793a\u5f62\u5f0f\u3001\u529f\u80fd\u3001\u64cd\u4f5c\u3001\u5b66\u4e60\u4e0e\u8bc4\u4f30\u4e94\u4e2a\u7ef4\u5ea6\u68b3\u7406\u76f8\u5173\u7814\u7a76\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/HaroldChen19/Awesome-AR-Video-Memory", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2609.28466", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u957f\u7a0b\u81ea\u56de\u5f52\u89c6\u9891\u751f\u6210\u53d7\u9650\u4e8e\u4e0a\u4e0b\u6587\u7a97\u53e3\u3001\u5b58\u50a8\u4e0e\u8ba1\u7b97\u9884\u7b97\uff0c\u5bb9\u6613\u4e22\u5931\u5b9e\u4f53\u8eab\u4efd\u3001\u52a8\u6001\u72b6\u6001\u548c\u56e0\u679c\u53d8\u5316\u7b49\u5173\u952e\u4fe1\u606f", "\u63d0\u51fa\u7edf\u4e00\u7684\u8bb0\u5fc6\u5206\u6790\u6846\u67b6\uff0c\u8986\u76d6\u5386\u53f2\u4fe1\u606f\u7684\u627f\u8f7d\u5f62\u5f0f\u3001\u4fdd\u7559\u5185\u5bb9\u3001\u8bfb\u5199\u66f4\u65b0\u7ba1\u7406\u6d41\u7a0b\u3001\u95ed\u73af rollout \u4e2d\u7684\u5b66\u4e60\u673a\u5236", "\u603b\u7ed3\u5f00\u653e\u6311\u6218\uff0c\u5305\u62ec\u53ef\u7ec4\u5408\u4e14\u8d44\u6e90\u611f\u77e5\u7684\u8bb0\u5fc6\u67b6\u6784\u3001\u53ef\u4fe1\u72b6\u6001\u66f4\u65b0\u3001\u81ea rollout \u5b66\u4e60\u548c\u6807\u51c6\u5316\u8bb0\u5fc6\u8bc4\u6d4b"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u81ea\u56de\u5f52\u6a21\u578b", "\u8bb0\u5fc6\u673a\u5236", "\u4e16\u754c\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28466v1", "published_at": "2026-09-23", "score": 0.267, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.28466.png", "title": "The Past Frames the Future: Memory for Autoregressive Video Generation", "tldr": "\u7efc\u8ff0\u81ea\u56de\u5f52\u89c6\u9891\u751f\u6210\u4e2d\u7684\u8bb0\u5fc6\u673a\u5236", "upvotes": 8, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e86\u81ea\u56de\u5f52\u89c6\u9891\u751f\u6210\u5728\u6709\u9650\u4e0a\u4e0b\u6587\u4e0b\u7684\u957f\u671f\u8bb0\u5fc6\u95ee\u9898\uff0c\u5e76\u5c06\u8bb0\u5fc6\u5b9a\u4e49\u4e3a\u80fd\u8de8\u751f\u6210\u6b65\u9aa4\u6301\u7eed\u5f71\u54cd\u672a\u6765\u5e27\u7684\u5386\u53f2\u4fe1\u606f\u3002\u8bba\u6587\u4ece\u8868\u793a\u5f62\u5f0f\u3001\u529f\u80fd\u3001\u64cd\u4f5c\u3001\u5b66\u4e60\u4e0e\u8bc4\u4f30\u4e94\u4e2a\u7ef4\u5ea6\u68b3\u7406\u76f8\u5173\u7814\u7a76\u3002", "why_notable": "\u957f\u89c6\u9891\u751f\u6210\u548c\u4e16\u754c\u6a21\u578b\u8981\u5b9e\u73b0\u65f6\u95f4\u4e00\u81f4\u6027\uff0c\u5fc5\u987b\u89e3\u51b3\u957f\u671f\u72b6\u6001\u4fdd\u6301\u95ee\u9898\uff1b\u8be5\u7efc\u8ff0\u4e3a\u8bb0\u5fc6\u6761\u4ef6\u89c6\u9891\u751f\u6210\u63d0\u4f9b\u4e86\u7ed3\u6784\u5316\u95ee\u9898\u5b9a\u4e49\u548c\u7814\u7a76\u8def\u7ebf\u56fe\u3002"}, {"abstract": "Vision-language-action models (VLA) promise human-steerable autonomous driving, but their training is bottlenecked by the scarcity of frames paired with natural-language instructions: while camera streams and expert trajectories are logged at scale, language annotations (e.g., turn left at the intersection) remain scarce and expensive to acquire. To address this challenge, we introduce Latent Action Driving Annotations (LADA), a three-stage pipeline that transforms abundant unlabelled observation-trajectory pairs into a substrate for language-conditioned control. First, we train a latent action model with a vector-quantised bottleneck, producing a compact codebook of high-level vehicle intents. Second, a small language-annotated subset is used to train a vision-language translator to map observations and language instructions into this codebook. Third, we train a driving VLA on observation-latent-action pairs over the full unlabelled corpus. Using fewer than 5% of language annotations and without leveraging any auxiliary chain-of-thought reasoning or visual question answering streams, LADA achieves a Driving Score of 87.98 and a Success Rate of 70.46% on the closed-loop Bench2Drive benchmark, matching or surpassing fully supervised baselines.", "arxiv_id": "2609.27747", "arxiv_url": "https://arxiv.org/abs/2609.27747", "authors": ["Alexey Zakharov", "Kemal Oksuz", "Puneet K. Dokania"], "brief": "\u8bba\u6587\u63d0\u51fa LADA \u4e09\u9636\u6bb5\u6d41\u7a0b\uff0c\u5c06\u5927\u91cf\u65e0\u8bed\u8a00\u6807\u6ce8\u7684\u89c2\u6d4b-\u8f68\u8ff9\u6570\u636e\u8f6c\u5316\u4e3a\u53ef\u7528\u4e8e\u8bed\u8a00\u6761\u4ef6\u9a7e\u9a76\u63a7\u5236\u7684\u8bad\u7ec3\u4fe1\u53f7\u3002\u5b83\u5148\u5b66\u4e60\u79bb\u6563\u6f5c\u5728\u52a8\u4f5c\u7801\u672c\uff0c\u518d\u7528\u5c11\u91cf\u8bed\u8a00\u6807\u6ce8\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u5230\u7801\u672c\u7684\u7ffb\u8bd1\u5668\uff0c\u6700\u540e\u5728\u5168\u91cf\u6570\u636e\u4e0a\u8bad\u7ec3\u9a7e\u9a76 VLA\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27747", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u5411\u91cf\u91cf\u5316\u74f6\u9888\u5b66\u4e60\u9ad8\u5c42\u8f66\u8f86\u610f\u56fe\u7684\u7d27\u51d1\u6f5c\u5728\u52a8\u4f5c\u7801\u672c\uff0c\u66ff\u4ee3\u6602\u8d35\u7684\u9010\u5e27\u81ea\u7136\u8bed\u8a00\u6807\u6ce8\u3002", "\u4ec5\u4f7f\u7528\u5c11\u4e8e 5% \u7684\u8bed\u8a00\u6807\u6ce8\uff0c\u5373\u53ef\u628a\u89c6\u89c9\u89c2\u6d4b\u548c\u8bed\u8a00\u6307\u4ee4\u6620\u5c04\u5230\u6f5c\u5728\u52a8\u4f5c\u7a7a\u95f4\u3002", "\u5728\u95ed\u73af Bench2Drive \u4e0a\u8fbe\u5230 87.98 Driving Score \u548c 70.46% Success Rate\uff0c\u5339\u914d\u6216\u8d85\u8fc7\u5168\u76d1\u7763\u57fa\u7ebf\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8868\u793a\u5b66\u4e60", "\u6570\u636e\u6807\u6ce8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27747v1", "published_at": "2026-09-23", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Less Language, More Latents: Annotation-Efficient VLAs for Driving", "tldr": "\u7528\u6f5c\u5728\u52a8\u4f5c\u51cf\u5c11\u81ea\u52a8\u9a7e\u9a76\u8bed\u8a00\u6807\u6ce8\u4f9d\u8d56", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LADA \u4e09\u9636\u6bb5\u6d41\u7a0b\uff0c\u5c06\u5927\u91cf\u65e0\u8bed\u8a00\u6807\u6ce8\u7684\u89c2\u6d4b-\u8f68\u8ff9\u6570\u636e\u8f6c\u5316\u4e3a\u53ef\u7528\u4e8e\u8bed\u8a00\u6761\u4ef6\u9a7e\u9a76\u63a7\u5236\u7684\u8bad\u7ec3\u4fe1\u53f7\u3002\u5b83\u5148\u5b66\u4e60\u79bb\u6563\u6f5c\u5728\u52a8\u4f5c\u7801\u672c\uff0c\u518d\u7528\u5c11\u91cf\u8bed\u8a00\u6807\u6ce8\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u5230\u7801\u672c\u7684\u7ffb\u8bd1\u5668\uff0c\u6700\u540e\u5728\u5168\u91cf\u6570\u636e\u4e0a\u8bad\u7ec3\u9a7e\u9a76 VLA\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7f13\u89e3\u4e86\u81ea\u52a8\u9a7e\u9a76 VLA \u5bf9\u8bed\u8a00\u6807\u6ce8\u7684\u5f3a\u4f9d\u8d56\uff0c\u4f7f\u6d77\u91cf\u5df2\u6709\u6444\u50cf\u5934\u4e0e\u4e13\u5bb6\u8f68\u8ff9\u6570\u636e\u53ef\u88ab\u5145\u5206\u5229\u7528\uff0c\u663e\u8457\u63d0\u5347\u8bed\u8a00\u53ef\u63a7\u9a7e\u9a76\u6a21\u578b\u7684\u6807\u6ce8\u6548\u7387\u548c\u5b9e\u7528\u53ef\u6269\u5c55\u6027\u3002"}, {"abstract": "What reusable computation should a tabular foundation model learn when every table defines a new supervised task? We develop in-situ representation refinement: support labels guide updates to the episode\u0027s representations, and these updates transfer to unlabeled queries without changing model parameters. A regularized leave-one-out objective yields a support correction and its query extension. The leading term separates attention-based reading from state-dependent scaling, motivating RefineICL: an attention-gated, FFN-free contextual stack with selected low-rank feature interaction and typed memory. RefineICL-L24 reaches 0.93836 OVR-AUC and 0.87173 accuracy on AMLB29. A benchmark-informed continuation reaches 1644.8 Elo on the 38-dataset TabArena snapshot, 31.4 Elo above TabPFN-3 under the same evaluation. It also improves all four reported metrics over TabPFN-v3 on both TabZilla views. In a matched 100K-update depth grid, an expanded FFN gives no consistent validation benefit and uses 60.2% more peak inference memory at L8. Internal interventions show that support representations are more than a static source of labels: removing one intermediate support update, while preserving the query output, increases final query cross-entropy in all 72 tested episodes. Together, the derivation and interventions explain how attention-gated updates can construct a task-specific predictor in context.", "arxiv_id": "2609.27679", "arxiv_url": "https://arxiv.org/abs/2609.27679", "authors": ["Tian Zhou", "Beverly Jin", "Linxiao Yang", "Xue Wang", "Wenwei Wang", "Bingqing Peng", "Mengni Ye", "Jinjie Gu", "Liang Sun"], "brief": "\u8bba\u6587\u63d0\u51fa in-situ representation refinement\uff1a\u5229\u7528\u652f\u6301\u96c6\u6807\u7b7e\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u76f4\u63a5\u66f4\u65b0\u5f53\u524d\u4efb\u52a1\u7684\u8868\u5f81\uff0c\u5e76\u5c06\u8fd9\u79cd\u66f4\u65b0\u8fc1\u79fb\u5230\u672a\u6807\u6ce8\u67e5\u8be2\u6837\u672c\u3002\u57fa\u4e8e\u63a8\u5bfc\u8bbe\u8ba1\u4e86 RefineICL\uff0c\u4e00\u4e2a\u65e0 FFN\u3001\u6ce8\u610f\u529b\u95e8\u63a7\u7684\u8868\u683c\u4e0a\u4e0b\u6587\u5b66\u4e60\u67b6\u6784\uff0c\u5e76\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u4e0a\u8d85\u8fc7 TabPFN \u7cfb\u5217\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27679", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u6b63\u5219\u5316 leave-one-out \u76ee\u6807\u63a8\u5bfc\u51fa\u652f\u6301\u96c6\u6821\u6b63\u53ca\u5176\u67e5\u8be2\u6269\u5c55\uff0c\u5c06\u6ce8\u610f\u529b\u8bfb\u53d6\u4e0e\u72b6\u6001\u4f9d\u8d56\u7f29\u653e\u5206\u79bb\u3002", "RefineICL \u91c7\u7528\u6ce8\u610f\u529b\u95e8\u63a7\u66f4\u65b0\u3001\u4f4e\u79e9\u7279\u5f81\u4ea4\u4e92\u548c\u7c7b\u578b\u5316\u8bb0\u5fc6\uff0c\u53bb\u9664\u4f20\u7edf FFN \u540e\u4ecd\u53d6\u5f97\u5f3a\u6027\u80fd\u3002", "RefineICL-L24 \u5728 AMLB29 \u4e0a\u8fbe\u5230 0.93836 OVR-AUC \u548c 0.87173 \u51c6\u786e\u7387\uff1b\u5728 TabArena 38 \u6570\u636e\u96c6\u5feb\u7167\u4e2d\u8fbe\u5230 1644.8 Elo\uff0c\u6bd4\u540c\u8bc4\u4f30\u4e0b TabPFN-3 \u9ad8 31.4 Elo\u3002"], "keywords": ["\u8868\u683c\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u6ce8\u610f\u529b\u673a\u5236", "\u57fa\u7840\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27679v1", "published_at": "2026-09-23", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "What Do Tabular Foundation Models Compute In Context? In-Situ Representation Refinement through Attention-Gated Updates", "tldr": "\u7528\u6ce8\u610f\u529b\u95e8\u63a7\u5728\u4e0a\u4e0b\u6587\u4e2d\u7cbe\u70bc\u8868\u683c\u8868\u793a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa in-situ representation refinement\uff1a\u5229\u7528\u652f\u6301\u96c6\u6807\u7b7e\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u76f4\u63a5\u66f4\u65b0\u5f53\u524d\u4efb\u52a1\u7684\u8868\u5f81\uff0c\u5e76\u5c06\u8fd9\u79cd\u66f4\u65b0\u8fc1\u79fb\u5230\u672a\u6807\u6ce8\u67e5\u8be2\u6837\u672c\u3002\u57fa\u4e8e\u63a8\u5bfc\u8bbe\u8ba1\u4e86 RefineICL\uff0c\u4e00\u4e2a\u65e0 FFN\u3001\u6ce8\u610f\u529b\u95e8\u63a7\u7684\u8868\u683c\u4e0a\u4e0b\u6587\u5b66\u4e60\u67b6\u6784\uff0c\u5e76\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u4e0a\u8d85\u8fc7 TabPFN \u7cfb\u5217\u6a21\u578b\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u4e0d\u4ec5\u63d0\u5347\u4e86\u8868\u683c\u57fa\u7840\u6a21\u578b\u6027\u80fd\uff0c\u8fd8\u7ed9\u51fa\u4e86\u53ef\u89e3\u91ca\u7684\u673a\u5236\uff1a\u6a21\u578b\u53ef\u5728\u4e0a\u4e0b\u6587\u4e2d\u901a\u8fc7\u652f\u6301\u6837\u672c\u52a8\u6001\u6784\u9020\u4efb\u52a1\u7279\u5b9a\u9884\u6d4b\u5668\uff0c\u800c\u4e0d\u53ea\u662f\u9759\u6001\u8bfb\u53d6\u6807\u7b7e\uff1b\u540c\u65f6\u663e\u793a\u6269\u5927 FFN \u5e76\u975e\u5173\u952e\uff0c\u53ef\u80fd\u5f71\u54cd\u8868\u683c\u57fa\u7840\u6a21\u578b\u67b6\u6784\u8bbe\u8ba1\u65b9\u5411\u3002"}, {"abstract": "Next-token prediction has enabled highly fluent autoregressive language models, but it represents global structure only indirectly through sequential factorization. In contrast, high-fidelity autoencoders have become a standard primitive in image generation, enabling generative models to operate over continuous latent spaces; text lacks a comparably faithful continuous representation. We propose LLMAE, a method for repurposing a pretrained decoder-only language model as a continuous text autoencoder by exposing an intermediate fixed-length latent bottleneck within its internal activations. Instantiated with a parameter-efficient 270M Gemma 3 model, LLMAE uses structured attention masks, LoRA adaptation, and KL regularization to learn an autoencoding interface that leverages the generative prior of the original LLM. We train LLMAE to reconstruct text sequences up to 1024 tokens, significantly improving on this task to achieve near-perfect reconstruction. Furthermore, we demonstrate the downstream utility of this representation by training a latent text diffusion model for detailed image captioning using the learned LLMAE autoencoder. By mapping text into a fixed-length continuous latent space, our approach provides an effective substrate for downstream adaptation while benefiting from the fluency of the original LLM.", "arxiv_id": "2609.27248", "arxiv_url": "https://arxiv.org/abs/2609.27248", "authors": ["Arkanath Pathak", "Unnat Jain", "Alexander C. Berg"], "brief": "\u8bba\u6587\u63d0\u51fa LLMAE\uff0c\u628a\u89e3\u7801\u5668\u5f0f\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u4e2d\u95f4\u6fc0\u6d3b\u6539\u9020\u6210\u56fa\u5b9a\u957f\u5ea6\u8fde\u7eed\u6f5c\u53d8\u91cf\u74f6\u9888\uff0c\u7528\u4e8e\u9ad8\u4fdd\u771f\u6587\u672c\u81ea\u7f16\u7801\u3002\u8be5\u65b9\u6cd5\u5728 270M Gemma 3 \u4e0a\u7ed3\u5408\u7ed3\u6784\u5316\u6ce8\u610f\u529b\u63a9\u7801\u3001LoRA \u9002\u914d\u4e0e KL \u6b63\u5219\uff0c\u53ef\u91cd\u6784\u6700\u957f 1024 token \u6587\u672c\uff0c\u5e76\u652f\u6301\u4e0b\u6e38\u6f5c\u7a7a\u95f4\u6587\u672c\u6269\u6563\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27248", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u9884\u8bad\u7ec3 decoder-only LLM \u5185\u90e8\u66b4\u9732\u56fa\u5b9a\u957f\u5ea6\u8fde\u7eed\u6f5c\u53d8\u91cf\uff0c\u4f7f\u6587\u672c\u50cf\u56fe\u50cf\u751f\u6210\u4e2d\u7684\u81ea\u7f16\u7801\u5668\u4e00\u6837\u62e5\u6709\u53ef\u64cd\u4f5c\u7684\u8fde\u7eed\u8868\u793a", "\u91c7\u7528\u7ed3\u6784\u5316\u6ce8\u610f\u529b\u63a9\u7801\u3001\u53c2\u6570\u9ad8\u6548 LoRA \u5fae\u8c03\u548c KL \u6b63\u5219\uff0c\u5728\u4fdd\u6301\u539f
