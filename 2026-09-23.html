0\u90e8/\u5168\u5c40\u00d7\u5173\u7cfb\u7ed3\u6784/\u5ea6\u91cf\u51e0\u4f55\u76842\u00d72\u8bc4\u4f30\u6846\u67b6\uff0c\u53d1\u73b0\u89c6\u89c9-\u8bed\u8a00\u4e0e\u89c6\u9891-\u6587\u672c\u6a21\u578b\u7684\u6536\u655b\u66f4\u7a33\u5b9a\u5730\u4f53\u73b0\u5728\u6837\u672c\u5173\u7cfb\u7ed3\u6784\u4e0a\uff0c\u800c\u975e\u7cbe\u786e\u8ddd\u79bb\u6216\u76f8\u4f3c\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ec6\u5316\u4e86\u8868\u5f81\u6536\u655b\u7684\u542b\u4e49\uff0c\u6311\u6218\u4e86\u201c\u53ea\u5728\u5c40\u90e8\u90bb\u57df\u6536\u655b\u201d\u7684\u89e3\u91ca\uff0c\u6307\u51fa\u5f3a\u6a21\u578b\u5171\u4eab\u7684\u53ef\u80fd\u662f\u6837\u672c\u5173\u7cfb\u62d3\u6251/\u7ed3\u6784\u800c\u975e\u5177\u4f53\u5ea6\u91cf\u51e0\u4f55\u3002\u8fd9\u5bf9\u7406\u89e3\u57fa\u7840\u6a21\u578b\u8868\u5f81\u3001\u8bbe\u8ba1\u8de8\u6a21\u578b\u5bf9\u9f50\u6307\u6807\u548c\u5206\u6790\u591a\u6a21\u6001\u8868\u5f81\u5177\u6709\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are increasingly used in coding tasks, but their ability to reason about code execution remains unclear. Existing repository-level QA benchmarks mainly evaluate static code understanding and often rely on LLM-based evaluation, while execution-reasoning benchmarks are mostly limited to snippets or functions. We introduce SWE-Flux, a repository-level benchmark for dynamic execution reasoning containing 480 execution-grounded instances across 12 real Python repositories, with gold answers automatically harvested from instrumented test executions rather than written manually or judged by LLMs. The benchmark covers singletest and multi-test questions over control flow, loops, program state, dataflow, exceptions, and program invariants. Evaluating five LLMs shows that this task remains challenging. The best model achieves only 37% accuracy. Models perform better on localized behavior such as invariants, intra-procedural control flow, exceptions, and simple loops, but struggle with dataflow, inter-procedural execution, precise state reasoning, and suite-level aggregation. Finally, we show that the oracle-harvesting pipeline can generate fresh benchmark variants using input perturbation. It successfully harvests valid variants for almost 90% of the selected instances, and the resulting variants are substantially more challenging for the evaluated models.", "arxiv_id": "2609.28449", "arxiv_url": "https://arxiv.org/abs/2609.28449", "authors": ["Hamed Taherkhani", "Mohammad Abdollahi", "Melika Sepidband", "Hridya Dhulipala", "Tien N. Nguyen", "Hadi Hemmati"], "brief": "\u8bba\u6587\u63d0\u51fa SWE-Flux\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e Python \u4ed3\u5e93\u7684\u52a8\u6001\u6267\u884c\u63a8\u7406\u57fa\u51c6\uff0c\u5305\u542b 12 \u4e2a\u4ed3\u5e93\u4e2d\u7684 480 \u4e2a\u7531\u63d2\u6869\u6d4b\u8bd5\u6267\u884c\u81ea\u52a8\u91c7\u96c6\u7b54\u6848\u7684\u95ee\u9898\u3002\u5b83\u8986\u76d6\u63a7\u5236\u6d41\u3001\u5faa\u73af\u3001\u7a0b\u5e8f\u72b6\u6001\u3001\u6570\u636e\u6d41\u3001\u5f02\u5e38\u548c\u7a0b\u5e8f\u4e0d\u53d8\u91cf\u7b49\u8fd0\u884c\u65f6\u884c\u4e3a\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28449", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91d1\u6807\u51c6\u7b54\u6848\u6765\u81ea\u63d2\u6869\u6d4b\u8bd5\u6267\u884c\u81ea\u52a8\u91c7\u96c6\uff0c\u800c\u975e\u4eba\u5de5\u7f16\u5199\u6216LLM\u88c1\u5224\uff0c\u964d\u4f4e\u8bc4\u6d4b\u4e3b\u89c2\u6027\u3002", "\u8bc4\u6d4b\u4e94\u4e2aLLM\u540e\uff0c\u6700\u4f73\u6a21\u578b\u51c6\u786e\u7387\u4ec537%\uff0c\u8bf4\u660e\u4ed3\u5e93\u7ea7\u52a8\u6001\u63a8\u7406\u4ecd\u5f88\u56f0\u96be\u3002", "\u6a21\u578b\u5728\u5c40\u90e8\u884c\u4e3a\u4e0a\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u6570\u636e\u6d41\u3001\u8de8\u8fc7\u7a0b\u6267\u884c\u3001\u7cbe\u786e\u72b6\u6001\u63a8\u7406\u548c\u6d4b\u8bd5\u5957\u4ef6\u7ea7\u805a\u5408\u4e0a\u660e\u663e\u5403\u529b\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u7a0b\u5e8f\u5206\u6790", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28449v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can LLMs Reason About Runtime Behavior? A Repository-Level Dynamic Benchmark", "tldr": "SWE-Flux\u8bc4\u6d4bLLM\u4ed3\u5e93\u7ea7\u8fd0\u884c\u65f6\u63a8\u7406\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SWE-Flux\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e Python \u4ed3\u5e93\u7684\u52a8\u6001\u6267\u884c\u63a8\u7406\u57fa\u51c6\uff0c\u5305\u542b 12 \u4e2a\u4ed3\u5e93\u4e2d\u7684 480 \u4e2a\u7531\u63d2\u6869\u6d4b\u8bd5\u6267\u884c\u81ea\u52a8\u91c7\u96c6\u7b54\u6848\u7684\u95ee\u9898\u3002\u5b83\u8986\u76d6\u63a7\u5236\u6d41\u3001\u5faa\u73af\u3001\u7a0b\u5e8f\u72b6\u6001\u3001\u6570\u636e\u6d41\u3001\u5f02\u5e38\u548c\u7a0b\u5e8f\u4e0d\u53d8\u91cf\u7b49\u8fd0\u884c\u65f6\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4ee3\u7801\u7406\u89e3\u8bc4\u6d4b\u4ece\u9759\u6001\u4ed3\u5e93\u95ee\u7b54\u63a8\u8fdb\u5230\u6267\u884c\u9a71\u52a8\u7684\u52a8\u6001\u63a8\u7406\uff0c\u5e76\u63d0\u4f9b\u53ef\u81ea\u52a8\u751f\u6210\u65b0\u53d8\u4f53\u7684\u57fa\u51c6\u6784\u5efa\u6d41\u7a0b\uff0c\u5bf9\u8bc4\u4f30\u548c\u6539\u8fdb\u4ee3\u7801LLM\u7684\u771f\u5b9e\u8c03\u8bd5\u3001\u6d4b\u8bd5\u7406\u89e3\u4e0e\u7a0b\u5e8f\u6267\u884c\u63a8\u7406\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Language modeling using Transformers has become commonplace despite their fixed computational depth and quadratic runtime with respect to input tokens. Recurrent models on the other hand offer linear depth but no parallel execution. In this work, we extend balanced-tree recursive operators from sequence encoding to autoregressive prediction, enabling all prefix representations to be computed with logarithmic depth and linear runtime. Our experiments provide an initial characterization of this model class, demonstrating robust length extrapolation and performance approaching that of ALiBi-based Transformers, highlighting its potential as an alternative architecture for language modeling.", "arxiv_id": "2609.28212", "arxiv_url": "https://arxiv.org/abs/2609.28212", "authors": ["Yiqin Wang", "Nuri Cingillioglu", "Charles Pert"], "brief": "\u8bba\u6587\u5c06\u5e73\u8861\u6811\u9012\u5f52\u7b97\u5b50\u4ece\u5e8f\u5217\u7f16\u7801\u6269\u5c55\u5230\u81ea\u56de\u5f52\u8bed\u8a00\u5efa\u6a21\uff0c\u4f7f\u6240\u6709\u524d\u7f00\u8868\u793a\u53ef\u5728\u5bf9\u6570\u8ba1\u7b97\u6df1\u5ea6\u3001\u7ebf\u6027\u8fd0\u884c\u65f6\u95f4\u5185\u5b8c\u6210\u3002\u5b9e\u9a8c\u521d\u6b65\u9a8c\u8bc1\u4e86\u8be5\u7c7b\u6a21\u578b\u5177\u5907\u7a33\u5065\u7684\u957f\u5ea6\u5916\u63a8\u80fd\u529b\uff0c\u6027\u80fd\u63a5\u8fd1\u57fa\u4e8e ALiBi \u7684 Transformer\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28212", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u81ea\u56de\u5f52\u9884\u6d4b\u7684\u5e73\u8861\u6811\u9012\u5f52\u8bed\u8a00\u6a21\u578b\uff0c\u907f\u514d Transformer \u56fa\u5b9a\u6df1\u5ea6\u4e0e\u4e8c\u6b21\u590d\u6742\u5ea6\u95ee\u9898", "\u6240\u6709\u524d\u7f00\u8868\u793a\u53ef\u5e76\u884c\u5730\u4ee5\u5bf9\u6570\u6df1\u5ea6\u8ba1\u7b97\uff0c\u540c\u65f6\u4fdd\u6301\u76f8\u5bf9\u4e8e\u8f93\u5165\u957f\u5ea6\u7684\u7ebf\u6027\u8fd0\u884c\u65f6\u95f4", "\u5728\u957f\u5ea6\u5916\u63a8\u5b9e\u9a8c\u4e2d\u8868\u73b0\u7a33\u5065\uff0c\u8bed\u8a00\u5efa\u6a21\u6027\u80fd\u63a5\u8fd1 ALiBi Transformer"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u9012\u5f52\u6a21\u578b", "\u957f\u4e0a\u4e0b\u6587", "\u9ad8\u6548\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28212v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Log-Depth Recurrent Language Modeling", "tldr": "\u7528\u5bf9\u6570\u6df1\u5ea6\u9012\u5f52\u7ed3\u6784\u66ff\u4ee3Transformer\u5efa\u6a21", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u5e73\u8861\u6811\u9012\u5f52\u7b97\u5b50\u4ece\u5e8f\u5217\u7f16\u7801\u6269\u5c55\u5230\u81ea\u56de\u5f52\u8bed\u8a00\u5efa\u6a21\uff0c\u4f7f\u6240\u6709\u524d\u7f00\u8868\u793a\u53ef\u5728\u5bf9\u6570\u8ba1\u7b97\u6df1\u5ea6\u3001\u7ebf\u6027\u8fd0\u884c\u65f6\u95f4\u5185\u5b8c\u6210\u3002\u5b9e\u9a8c\u521d\u6b65\u9a8c\u8bc1\u4e86\u8be5\u7c7b\u6a21\u578b\u5177\u5907\u7a33\u5065\u7684\u957f\u5ea6\u5916\u63a8\u80fd\u529b\uff0c\u6027\u80fd\u63a5\u8fd1\u57fa\u4e8e ALiBi \u7684 Transformer\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63a2\u7d22\u4e86 Transformer \u4e4b\u5916\u7684\u9ad8\u6548\u8bed\u8a00\u6a21\u578b\u67b6\u6784\uff0c\u5728\u5e76\u884c\u6027\u3001\u957f\u5e8f\u5217\u6269\u5c55\u548c\u8ba1\u7b97\u590d\u6742\u5ea6\u4e4b\u95f4\u63d0\u4f9b\u4e86\u65b0\u7684\u6298\u4e2d\uff0c\u6709\u671b\u63a8\u52a8\u66f4\u53ef\u6269\u5c55\u7684\u5e8f\u5217\u5efa\u6a21\u65b9\u6cd5\u3002"}, {"abstract": "Modern large language models are pretrained on massive datasets, making it difficult to prevent benchmark data from entering their training sets and undermining the reliability of evaluation results. Reliable evaluation is particularly challenging for base models, whose limited instruction-following ability complicates task-based assessment. We introduce Uncheatable Eval, a dynamic benchmark that regularly collects newly published text to evaluate base language models and reduce the risk of data contamination. Drawing on the relationship between a model\u0027s predictive ability and its ability to compress data losslessly, we use compression rate to evaluate how well models predict new text. We evaluate 80 models across 14 text categories, study how compression changes with context length, and examine the correlation between compression rate and zero-shot MMLU accuracy. Our results yield three main findings: (1) compression performance follows a consistent scaling trend with model size; (2) attention-based, hybrid, and recurrent models differ in how their compression performance changes as more context becomes available; and (3) lower compression rates are strongly associated with higher zero-shot MMLU accuracy. Code is available at https://github.com/Jellyfish042/uncheatable_eval.", "arxiv_id": "2609.27510", "arxiv_url": "https://arxiv.org/abs/2609.27510", "authors": ["Kaifeng Tan", "Yudong Li", "Linlin Shen"], "brief": "\u8bba\u6587\u63d0\u51fa Uncheatable Eval\uff1a\u5b9a\u671f\u6536\u96c6\u65b0\u8fd1\u53d1\u5e03\u6587\u672c\uff0c\u7528\u6a21\u578b\u5bf9\u6587\u672c\u7684\u65e0\u635f\u538b\u7f29\u7387\u6765\u8bc4\u4f30\u57fa\u7840\u8bed\u8a00\u6a21\u578b\u7684\u9884\u6d4b\u80fd\u529b\uff0c\u4ece\u800c\u964d\u4f4e benchmark \u6c61\u67d3\u98ce\u9669\u3002\u4f5c\u8005\u8bc4\u6d4b\u4e86 80 \u4e2a\u6a21\u578b\u3001\u8986\u76d6 14 \u7c7b\u6587\u672c\uff0c\u5e76\u5206\u6790\u538b\u7f29\u7387\u4e0e\u4e0a\u4e0b\u6587\u957f\u5ea6\u53ca MMLU \u96f6\u6837\u672c\u8868\u73b0\u7684\u5173\u7cfb\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27510", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u201c\u9884\u6d4b\u80fd\u529b\u7b49\u4ef7\u4e8e\u538b\u7f29\u80fd\u529b\u201d\u4e3a\u6838\u5fc3\u601d\u60f3\uff0c\u7528\u52a8\u6001\u65b0\u6587\u672c\u548c\u538b\u7f29\u7387\u66ff\u4ee3\u6613\u88ab\u6c61\u67d3\u7684\u9759\u6001\u4efb\u52a1\u57fa\u51c6\u3002", "\u5728 80 \u4e2a\u6a21\u578b\u300114 \u4e2a\u6587\u672c\u7c7b\u522b\u4e0a\u9a8c\u8bc1\uff0c\u53d1\u73b0\u538b\u7f29\u6027\u80fd\u968f\u6a21\u578b\u89c4\u6a21\u5448\u7a33\u5b9a scaling \u8d8b\u52bf\u3002", "\u6ce8\u610f\u529b\u6a21\u578b\u3001\u6df7\u5408\u6a21\u578b\u548c\u5faa\u73af\u6a21\u578b\u5728\u4e0a\u4e0b\u6587\u957f\u5ea6\u589e\u52a0\u65f6\u7684\u538b\u7f29\u6536\u76ca\u4e0d\u540c\uff1b\u66f4\u4f4e\u538b\u7f29\u7387\u4e0e\u66f4\u9ad8\u96f6\u6837\u672c MMLU \u51c6\u786e\u7387\u5f3a\u76f8\u5173\u3002"], "keywords": ["\u6a21\u578b\u8bc4\u6d4b", "\u6570\u636e\u6c61\u67d3", "\u8bed\u8a00\u6a21\u578b", "\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27510v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Uncheatable Eval: Dynamic Compression-Based Evaluation of Language Models", "tldr": "\u7528\u65b0\u6587\u672c\u538b\u7f29\u7387\u52a8\u6001\u8bc4\u6d4b\u8bed\u8a00\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Uncheatable Eval\uff1a\u5b9a\u671f\u6536\u96c6\u65b0\u8fd1\u53d1\u5e03\u6587\u672c\uff0c\u7528\u6a21\u578b\u5bf9\u6587\u672c\u7684\u65e0\u635f\u538b\u7f29\u7387\u6765\u8bc4\u4f30\u57fa\u7840\u8bed\u8a00\u6a21\u578b\u7684\u9884\u6d4b\u80fd\u529b\uff0c\u4ece\u800c\u964d\u4f4e benchmark \u6c61\u67d3\u98ce\u9669\u3002\u4f5c\u8005\u8bc4\u6d4b\u4e86 80 \u4e2a\u6a21\u578b\u3001\u8986\u76d6 14 \u7c7b\u6587\u672c\uff0c\u5e76\u5206\u6790\u538b\u7f29\u7387\u4e0e\u4e0a\u4e0b\u6587\u957f\u5ea6\u53ca MMLU \u96f6\u6837\u672c\u8868\u73b0\u7684\u5173\u7cfb\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u57fa\u7840\u6a21\u578b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u6297\u6570\u636e\u6c61\u67d3\u3001\u65e0\u9700\u6307\u4ee4\u8ddf\u968f\u80fd\u529b\u7684\u66ff\u4ee3\u65b9\u6848\uff0c\u5e76\u663e\u793a\u538b\u7f29\u7387\u53ef\u4f5c\u4e3a\u901a\u7528\u80fd\u529b\u7684\u6709\u6548\u4ee3\u7406\u6307\u6807\uff0c\u5bf9\u672a\u6765\u52a8\u6001\u8bc4\u6d4b\u4f53\u7cfb\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent advances in text-to-video generation have enabled high-fidelity visual synthesis, yet realistic motion remains challenging. Generated videos may exhibit temporal discontinuities, inconsistent action progression, and structural distortions during complex movements. Even when individual frames appear realistic, the underlying motion may evolve in inconsistent or implausible ways. Standard generative objectives provide limited motion-specific supervision, leaving motion evolution insufficiently constrained. In this paper, we propose MotionSpec, a motion supervision framework centered on Spectral Trajectory Consistency (STC). STC constructs dense anchor-relative motion trajectories and transforms them into motion spectral volumes via a temporal Fourier transform. By aligning the spectral amplitude and phase of predicted and target trajectories, STC constrains both motion strength across temporal frequencies and the temporal organization of motion. To complement this trajectory-level supervision, we introduce Local Flow Consistency (LFC), which aligns consecutive-frame optical flow between predicted and target videos to stabilize local motion transitions. Experiments demonstrate that MotionSpec consistently improves motion consistency, temporal coherence, and plausibility while preserving visual fidelity.", "arxiv_id": "2609.28095", "arxiv_url": "https://arxiv.org/abs/2609.28095", "authors": ["Ziqi Ni", "Rui Li", "Shiqi Jiang", "Wei Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa MotionSpec\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u672c\u5230\u89c6\u9891\u751f\u6210\u7684\u8fd0\u52a8\u76d1\u7763\u6846\u67b6\u3002\u5176\u6838\u5fc3\u662f Spectral Trajectory Consistency\uff0c\u901a\u8fc7\u5bf9\u5bc6\u96c6\u8fd0\u52a8\u8f68\u8ff9\u505a\u65f6\u57df\u5085\u91cc\u53f6\u53d8\u6362\uff0c\u5728\u9891\u8c31\u5e45\u5ea6\u4e0e\u76f8\u4f4d\u4e0a\u7ea6\u675f\u751f\u6210\u89c6\u9891\u7684\u8fd0\u52a8\u6f14\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28095", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["STC \u6784\u5efa\u76f8\u5bf9\u951a\u70b9\u7684\u5bc6\u96c6\u8fd0\u52a8\u8f68\u8ff9\uff0c\u5e76\u8f6c\u5316\u4e3a\u8fd0\u52a8\u9891\u8c31\u4f53\uff0c\u7528\u4e8e\u76d1\u7763\u4e0d\u540c\u65f6\u95f4\u9891\u7387\u4e0b\u7684\u8fd0\u52a8\u5f3a\u5ea6\u4e0e\u8282\u594f\u7ec4\u7ec7", "\u901a\u8fc7\u540c\u65f6\u5bf9\u9f50\u9891\u8c31\u5e45\u5ea6\u548c\u76f8\u4f4d\uff0c\u7ea6\u675f\u8fd0\u52a8\u7684\u5e45\u5ea6\u5408\u7406\u6027\u4e0e\u65f6\u95f4\u987a\u5e8f\u4e00\u81f4\u6027", "\u5f15\u5165 Local Flow Consistency\uff0c\u5bf9\u9f50\u76f8\u90bb\u5e27\u5149\u6d41\uff0c\u8fdb\u4e00\u6b65\u7a33\u5b9a\u5c40\u90e8\u8fd0\u52a8\u8fc7\u6e21"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u8fd0\u52a8\u5efa\u6a21", "\u9891\u8c31\u76d1\u7763", "\u5149\u6d41"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28095v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MotionSpec: Spectral Trajectory Supervision for Motion-Consistent Video Generation", "tldr": "\u7528\u9891\u8c31\u8f68\u8ff9\u76d1\u7763\u63d0\u5347\u89c6\u9891\u751f\u6210\u8fd0\u52a8\u4e00\u81f4\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MotionSpec\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u672c\u5230\u89c6\u9891\u751f\u6210\u7684\u8fd0\u52a8\u76d1\u7763\u6846\u67b6\u3002\u5176\u6838\u5fc3\u662f Spectral Trajectory Consistency\uff0c\u901a\u8fc7\u5bf9\u5bc6\u96c6\u8fd0\u52a8\u8f68\u8ff9\u505a\u65f6\u57df\u5085\u91cc\u53f6\u53d8\u6362\uff0c\u5728\u9891\u8c31\u5e45\u5ea6\u4e0e\u76f8\u4f4d\u4e0a\u7ea6\u675f\u751f\u6210\u89c6\u9891\u7684\u8fd0\u52a8\u6f14\u5316\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u89c6\u9891\u751f\u6210\u4e2d\u5e38\u89c1\u7684\u52a8\u4f5c\u4e0d\u8fde\u8d2f\u3001\u7ed3\u6784\u626d\u66f2\u548c\u8fd0\u52a8\u4e0d\u5408\u7406\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u6bd4\u9010\u5e27\u89c6\u89c9\u8d28\u91cf\u66f4\u76f4\u63a5\u7684\u8fd0\u52a8\u76d1\u7763\u4fe1\u53f7\uff0c\u6709\u671b\u63d0\u5347\u6587\u672c\u5230\u89c6\u9891\u6a21\u578b\u7684\u65f6\u5e8f\u771f\u5b9e\u611f\u4e0e\u53ef\u63a7\u6027\u3002"}, {"abstract": "Video is a rich representation of a physical event, capturing appearance, geometry, motion, and temporal evolution. Other modalities, such as 3D body motion or audio, encode narrower aspects of the same event. We find that joint multimodal diffusion transformers exhibit a corresponding asymmetry in cross-modal correspondence: companion modalities develop strong correspondences to video, but the reciprocal correspondences through which they constrain video remain substantially weaker. We express both directions as comparable correspondence distributions over video tokens and define their disagreement as the reciprocal correspondence gap. We introduce RecCAR, standing for Reciprocal Cross-modal Attention Regularization, a KL regularizer that uses the well-established video-to-modality correspondence as a fixed reference and aligns the weaker modality-to-video correspondence toward it. Across joint video-motion and video-audio generation, RecCAR improves the Human Anatomy score from 0.69 to 0.75 and reduces audio-video desynchronization from 0.804 to 0.752, while improving overall generation", "arxiv_id": "2609.27901", "arxiv_url": "https://arxiv.org/abs/2609.27901", "authors": ["Ohad Rahamim", "Dvir Samuel", "Idan Schwartz", "Gal Chechik"], "brief": "\u8bba\u6587\u53d1\u73b0\u8054\u5408\u591a\u6a21\u6001\u6269\u6563 Transformer \u4e2d\u5b58\u5728\u8de8\u6a21\u6001\u5bf9\u5e94\u4e0d\u5bf9\u79f0\uff1a\u52a8\u4f5c/\u97f3\u9891\u80fd\u8f83\u597d\u5bf9\u9f50\u89c6\u9891\uff0c\u4f46\u53cd\u5411\u7ea6\u675f\u89c6\u9891\u7684\u5bf9\u5e94\u5173\u7cfb\u8f83\u5f31\u3002\u4e3a\u6b64\u63d0\u51fa RecCAR\uff0c\u901a\u8fc7 KL \u6b63\u5219\u5c06\u201c\u6a21\u6001\u5230\u89c6\u9891\u201d\u7684\u5f31\u5bf9\u5e94\u5bf9\u9f50\u5230\u66f4\u53ef\u9760\u7684\u201c\u89c6\u9891\u5230\u6a21\u6001\u201d\u5bf9\u5e94\uff0c\u4ee5\u6539\u8fdb\u8054\u5408\u89c6\u9891-\u52a8\u4f5c\u3001\u89c6\u9891-\u97f3\u9891\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27901", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b9a\u4e49 reciprocal correspondence gap\uff0c\u5c06\u53cc\u5411\u8de8\u6ce8\u610f\u529b\u7edf\u4e00\u8868\u793a\u4e3a\u89c6\u9891 token \u4e0a\u7684\u5bf9\u5e94\u5206\u5e03\u5e76\u8861\u91cf\u5176\u4e0d\u4e00\u81f4\u3002", "\u63d0\u51fa RecCAR\uff08Reciprocal Cross-modal Attention Regularization\uff09\uff0c\u4ee5\u89c6\u9891\u5230\u6a21\u6001\u7684\u5bf9\u5e94\u4f5c\u4e3a\u56fa\u5b9a\u53c2\u8003\uff0c\u6b63\u5219\u5316\u6a21\u6001\u5230\u89c6\u9891\u7684\u8de8\u6ce8\u610f\u529b\u3002", "\u5728\u89c6\u9891-\u4eba\u4f53\u52a8\u4f5c\u4e0e\u89c6\u9891-\u97f3\u9891\u751f\u6210\u4e2d\uff0cHuman Anatomy \u5206\u6570\u4ece 0.69 \u63d0\u5347\u5230 0.75\uff0c\u97f3\u89c6\u9891\u4e0d\u540c\u6b65\u6307\u6807\u4ece 0.804 \u964d\u81f3 0.752\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u6269\u6563\u6a21\u578b", "\u8de8\u6ce8\u610f\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27901v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "All modalities are equal, but video is more equal: Closing the Cross-Attention Gap in Joint Video Generation", "tldr": "\u7528\u4e92\u60e0\u6ce8\u610f\u529b\u6b63\u5219\u7f29\u5c0f\u8054\u5408\u89c6\u9891\u751f\u6210\u8de8\u6a21\u6001\u5dee\u8ddd", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u8054\u5408\u591a\u6a21\u6001\u6269\u6563 Transformer \u4e2d\u5b58\u5728\u8de8\u6a21\u6001\u5bf9\u5e94\u4e0d\u5bf9\u79f0\uff1a\u52a8\u4f5c/\u97f3\u9891\u80fd\u8f83\u597d\u5bf9\u9f50\u89c6\u9891\uff0c\u4f46\u53cd\u5411\u7ea6\u675f\u89c6\u9891\u7684\u5bf9\u5e94\u5173\u7cfb\u8f83\u5f31\u3002\u4e3a\u6b64\u63d0\u51fa RecCAR\uff0c\u901a\u8fc7 KL \u6b63\u5219\u5c06\u201c\u6a21\u6001\u5230\u89c6\u9891\u201d\u7684\u5f31\u5bf9\u5e94\u5bf9\u9f50\u5230\u66f4\u53ef\u9760\u7684\u201c\u89c6\u9891\u5230\u6a21\u6001\u201d\u5bf9\u5e94\uff0c\u4ee5\u6539\u8fdb\u8054\u5408\u89c6\u9891-\u52a8\u4f5c\u3001\u89c6\u9891-\u97f3\u9891\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u4e86\u8054\u5408\u591a\u6a21\u6001\u751f\u6210\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u65b9\u5411\u6027\u4e0d\u5bf9\u79f0\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u8f7b\u91cf\u53ef\u63d2\u62d4\u7684\u6ce8\u610f\u529b\u6b63\u5219\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u8ba9\u97f3\u9891\u3001\u52a8\u4f5c\u7b49\u4f34\u968f\u6a21\u6001\u66f4\u6709\u6548\u5730\u7ea6\u675f\u89c6\u9891\u751f\u6210\u8d28\u91cf\u4e0e\u540c\u6b65\u6027\u3002"}, {"abstract": "Under the AI Flow framework, communication networks distribute intelligence across devices, edge servers, and clouds, and computation at the receiver becomes a resource that can substitute for transmitted bits. Generative video compression (GVC) embodies this exchange by sending compact tokens with ultra-low bitrate and letting a generative decoder synthesize the video, yet how much bandwidth savings a unit of decoder compute actually achieves has never been quantified. To fill this vacancy, we model reconstruction quality as a two-factor power law in data rate and decoder compute, which fits measured DISTS of two GVC decoders with a mean error below 3%, and define the information capacity (IC) as the negative logarithmic slope along an iso-quality contour, namely the fraction of rate saved per fractional increase in compute at identical quality. IC is dimensionless and unit-invariant, thus enabling an architecture-agnostic comparison. It forms a field over the operating plane, locating where additional denoising steps are worth their cost. Across five datasets, the 14B decoder trades more compute for fewer rate about ten times more efficiently than the 1.3B decoder. IC also varies significantly across datasets, indicating imbalanced performance on the rate-compute trade-off in GVC methods.", "arxiv_id": "2609.27493", "arxiv_url": "https://arxiv.org/abs/2609.27493", "authors": ["Cheng Yuan", "Jiawei Shao", "Xuelong Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u6570\u636e\u7387\u4e0e\u89e3\u7801\u7aef\u8ba1\u7b97\u91cf\u7684\u53cc\u56e0\u7d20\u5e42\u5f8b\u6765\u5efa\u6a21\u751f\u6210\u5f0f\u89c6\u9891\u538b\u7f29\u7684\u91cd\u5efa\u8d28\u91cf\uff0c\u5e76\u5b9a\u4e49\u201c\u4fe1\u606f\u5bb9\u91cf\u201d\u6765\u8861\u91cf\u540c\u7b49\u8d28\u91cf\u4e0b\u589e\u52a0\u89e3\u7801\u7b97\u529b\u53ef\u8282\u7701\u591a\u5c11\u7801\u7387\u3002\u8be5\u6307\u6807\u53ef\u5728\u4e0d\u540c\u67b6\u6784\u3001\u6570\u636e\u96c6\u548c\u64cd\u4f5c\u70b9\u4e4b\u95f4\u8fdb\u884c\u7edf\u4e00\u6bd4\u8f83\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27493", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u56e0\u7d20\u5e42\u5f8b\u6a21\u578b\u53ef\u62df\u5408\u4e24\u4e2a\u751f\u6210\u5f0f\u89c6\u9891\u89e3\u7801\u5668\u7684 DISTS \u8d28\u91cf\u6307\u6807\uff0c\u5e73\u5747\u8bef\u5dee\u4f4e\u4e8e 3%", "\u4fe1\u606f\u5bb9\u91cf\u5b9a\u4e49\u4e3a\u7b49\u8d28\u91cf\u66f2\u7ebf\u4e0a\u7684\u8d1f\u5bf9\u6570\u659c\u7387\uff0c\u8868\u793a\u7b97\u529b\u76f8\u5bf9\u589e\u52a0\u5e26\u6765\u7684\u7801\u7387\u76f8\u5bf9\u8282\u7701\uff0c\u4e14\u65e0\u91cf\u7eb2\u3001\u4e0e\u5355\u4f4d\u65e0\u5173", "\u5728\u4e94\u4e2a\u6570\u636e\u96c6\u4e0a\uff0c14B \u89e3\u7801\u5668\u7684\u7801\u7387-\u7b97\u529b\u4ea4\u6362\u6548\u7387\u7ea6\u4e3a 1.3B \u89e3\u7801\u5668\u7684 10 \u500d\uff0c\u4f46\u4e0d\u540c\u6570\u636e\u96c6\u95f4\u5dee\u5f02\u660e\u663e"], "keywords": ["\u89c6\u9891\u538b\u7f29", "\u751f\u6210\u6a21\u578b", "\u7b97\u529b\u4f18\u5316", "\u591a\u5a92\u4f53\u901a\u4fe1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27493v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Information Capacity of Generative Video Compression: Quantifying the Rate-Compute Exchange at Identical Quality", "tldr": "\u91cf\u5316\u751f\u6210\u5f0f\u89c6\u9891\u538b\u7f29\u7684\u7801\u7387-\u7b97\u529b\u4ea4\u6362", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u7528\u6570\u636e\u7387\u4e0e\u89e3\u7801\u7aef\u8ba1\u7b97\u91cf\u7684\u53cc\u56e0\u7d20\u5e42\u5f8b\u6765\u5efa\u6a21\u751f\u6210\u5f0f\u89c6\u9891\u538b\u7f29\u7684\u91cd\u5efa\u8d28\u91cf\uff0c\u5e76\u5b9a\u4e49\u201c\u4fe1\u606f\u5bb9\u91cf\u201d\u6765\u8861\u91cf\u540c\u7b49\u8d28\u91cf\u4e0b\u589e\u52a0\u89e3\u7801\u7b97\u529b\u53ef\u8282\u7701\u591a\u5c11\u7801\u7387\u3002\u8be5\u6307\u6807\u53ef\u5728\u4e0d\u540c\u67b6\u6784\u3001\u6570\u636e\u96c6\u548c\u64cd\u4f5c\u70b9\u4e4b\u95f4\u8fdb\u884c\u7edf\u4e00\u6bd4\u8f83\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9996\u6b21\u7cfb\u7edf\u91cf\u5316\u751f\u6210\u5f0f\u89c6\u9891\u538b\u7f29\u4e2d\u201c\u7528\u63a5\u6536\u7aef\u7b97\u529b\u6362\u4f20\u8f93\u5e26\u5bbd\u201d\u7684\u6548\u7387\uff0c\u4e3a\u9009\u62e9\u6a21\u578b\u89c4\u6a21\u3001\u89e3\u7801\u6b65\u6570\u548c\u90e8\u7f72\u4f4d\u7f6e\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u6307\u6807\uff0c\u4e5f\u63ed\u793a\u4e86\u73b0\u6709\u65b9\u6cd5\u5728\u4e0d\u540c\u6570\u636e\u5206\u5e03\u4e0a\u7684\u6027\u80fd\u4e0d\u5747\u8861\u3002"}, {"abstract": "Action-chunked vision-language-action (VLA) policies improve inference efficiency, but limited feedback within committed action chunks can lead to accumulated execution errors. Residual adaptation can correct such deviations without retraining the VLA; however, existing corrections are typically optimized for reference-action consistency without explicitly considering their downstream consequences. To address this limitation, we present Cerebellum-Inspired Consequence-Aware Residual Governance (CereVLA), a unified framework that integrates lightweight residual refinement and predictive consequence evaluation into frozen VLA execution. Corrective actions are first generated by flow-based residual refinement, and their short- and interval-horizon consequences are then evaluated by a recurrent state-space model and a history-aware classifier. Residual corrections predicted to be unfavorable are selectively suppressed by a lightweight governor. Comparisons with state-of-the-art methods on LIBERO-10 and LIBERO-GOAL demonstrate the effectiveness of CereVLA. On SO-101, CereVLA increases task success from 57.5% to 90.0% and reduces mean control steps by 19.6% among successful trials, relative to the frozen SmolVLA baseline.", "arxiv_id": "2609.27468", "arxiv_url": "https://arxiv.org/abs/2609.27468", "authors": ["Shuai Zeng", "Yuxuan Liang", "Hangmiao Hu", "Fobao Zhou", "Zixiang Wang", "Wenxi Hong", "Hang Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa CereVLA\uff0c\u5728\u51bb\u7ed3\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\uff08VLA\uff09\u7b56\u7565\u6267\u884c\u4e2d\u52a0\u5165\u8f7b\u91cf\u6b8b\u5dee\u4fee\u6b63\u4e0e\u540e\u679c\u9884\u6d4b\u8bc4\u4f30\u3002\u5b83\u5148\u751f\u6210\u7ea0\u504f\u52a8\u4f5c\uff0c\u518d\u5224\u65ad\u5176\u77ed\u671f\u4e0e\u533a\u95f4\u540e\u679c\uff0c\u6291\u5236\u53ef\u80fd\u5e26\u6765\u8d1f\u9762\u5f71\u54cd\u7684\u4fee\u6b63\u3002", "categories": ["cs.CV", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27468", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u57fa\u4e8e flow \u7684\u6b8b\u5dee\u7ec6\u5316\uff0c\u5728\u4e0d\u91cd\u65b0\u8bad\u7ec3\u539f\u59cb VLA \u7684\u60c5\u51b5\u4e0b\u4fee\u6b63\u52a8\u4f5c\u5757\u6267\u884c\u8bef\u5dee", "\u4f7f\u7528\u5faa\u73af\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u4e0e\u5386\u53f2\u611f\u77e5\u5206\u7c7b\u5668\u8bc4\u4f30\u7ea0\u504f\u52a8\u4f5c\u7684\u77ed\u671f\u548c\u533a\u95f4\u7ea7\u540e\u679c", "\u5728 SO-101 \u4e0a\u76f8\u8f83\u51bb\u7ed3 SmolVLA \u5c06\u6210\u529f\u7387\u4ece 57.5% \u63d0\u5347\u5230 90.0%\uff0c\u6210\u529f\u4efb\u52a1\u5e73\u5747\u63a7\u5236\u6b65\u6570\u51cf\u5c11 19.6%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u673a\u5668\u4eba\u63a7\u5236", "\u6b8b\u5dee\u5b66\u4e60", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27468v1", "published_at": "2026-09-23", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CereVLA: Cerebellum-Inspired Consequence-Aware Residual Governance for Efficient Vision-Language-Action Execution", "tldr": "\u7528\u540e\u679c\u8bc4\u4f30\u6cbb\u7406VLA\u6b8b\u5dee\u7ea0\u504f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CereVLA\uff0c\u5728\u51bb\u7ed3\u7684\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\uff08VLA\uff09\u7b56\u7565\u6267\u884c\u4e2d\u52a0\u5165\u8f7b\u91cf\u6b8b\u5dee\u4fee\u6b63\u4e0e\u540e\u679c\u9884\u6d4b\u8bc4\u4f30\u3002\u5b83\u5148\u751f\u6210\u7ea0\u504f\u52a8\u4f5c\uff0c\u518d\u5224\u65ad\u5176\u77ed\u671f\u4e0e\u533a\u95f4\u540e\u679c\uff0c\u6291\u5236\u53ef\u80fd\u5e26\u6765\u8d1f\u9762\u5f71\u54cd\u7684\u4fee\u6b63\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5173\u6ce8\u6b8b\u5dee\u7ea0\u504f\u7684\u201c\u540e\u679c\u201d\u800c\u975e\u4ec5\u5339\u914d\u53c2\u8003\u52a8\u4f5c\uff0c\u6709\u52a9\u4e8e\u7f13\u89e3\u52a8\u4f5c\u5757 VLA \u56e0\u53cd\u9988\u4e0d\u8db3\u5bfc\u81f4\u7684\u8bef\u5dee\u7d2f\u79ef\uff0c\u5728\u4e0d\u6539\u52a8\u57fa\u7840\u6a21\u578b\u7684\u524d\u63d0\u4e0b\u663e\u8457\u63d0\u5347\u673a\u5668\u4eba\u6267\u884c\u53ef\u9760\u6027\u4e0e\u6548\u7387\u3002"}, {"abstract": "Data assimilation estimates a dynamical state from partial and noisy observations. Classical ensemble filters are efficient but restrict analysis updates through finite sample covariance and affine Gaussian distribution. We introduce the Flow Ensemble Filter (FlowEF), which uses conditional flow matching to transport the forecast ensemble from a classical baseline filter to an analysis ensemble. FlowEF uses a localized Gaussian source during training, transports forecast ensemble members from a baseline filter at deployment, and conditions its velocity field on ensembles from that baseline filter and the observation. The proposed model therefore learns a nonlinear update while mapping each baseline ensemble independently. For sparsely observed dynamical systems, FlowEF improves both deterministic and probabilistic metrics over all four classical ensemble filters. It also achieves the best performance among the state-of-the-art generative data assimilation models.", "arxiv_id": "2609.28015", "arxiv_url": "https://arxiv.org/abs/2609.28015", "authors": ["Haoyuan Chen", "Alexandre Thi\u00e9ry"], "brief": "\u8bba\u6587\u63d0\u51fa Flow Ensemble Filter\uff08FlowEF\uff09\uff0c\u7528\u6761\u4ef6\u6d41\u5339\u914d\u5c06\u7ecf\u5178\u96c6\u5408\u6ee4\u6ce2\u5668\u7684\u9884\u62a5\u96c6\u5408\u975e\u7ebf\u6027\u4f20\u8f93\u5230\u5206\u6790\u96c6\u5408\uff0c\u7a81\u7834\u6709\u9650\u6837\u672c\u534f\u65b9\u5dee\u548c\u4eff\u5c04\u9ad8\u65af\u66f4\u65b0\u7684\u9650\u5236\u3002\u5728\u7a00\u758f\u89c2\u6d4b\u52a8\u529b\u7cfb\u7edf\u4e0a\uff0cFlowEF \u5728\u786e\u5b9a\u6027\u4e0e\u6982\u7387\u6307\u6807\u4e0a\u4f18\u4e8e\u56db\u79cd\u7ecf\u5178\u96c6\u5408\u6ee4\u6ce2\u5668\uff0c\u5e76\u8d85\u8fc7\u73b0\u6709\u751f\u6210\u5f0f\u6570\u636e\u540c\u5316\u65b9\u6cd5\u3002", "categories": ["stat.ML", "cs.LG", "math.DS", "stat.ME"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28015", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6570\u636e\u540c\u5316", "\u6d41\u5339\u914d", "\u96c6\u5408\u6ee4\u6ce2", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28015v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Improving Ensemble Filters with Flow Matching", "tldr": "\u8bba\u6587\u63d0\u51fa Flow Ensemble Filter\uff08FlowEF\uff09\uff0c\u7528\u6761\u4ef6\u6d41\u5339\u914d\u5c06\u7ecf\u5178\u96c6\u5408\u6ee4\u6ce2\u5668\u7684\u9884\u62a5\u96c6\u5408\u975e\u7ebf\u6027\u4f20\u8f93\u5230\u5206\u6790\u96c6\u5408\uff0c\u7a81\u7834\u6709\u9650\u6837\u672c\u534f\u65b9\u5dee\u548c\u4eff\u5c04\u9ad8\u65af\u66f4\u65b0\u7684\u9650\u5236\u3002\u5728\u7a00\u758f\u89c2\u6d4b\u52a8\u529b\u7cfb\u7edf\u4e0a\uff0cFlowEF \u5728\u786e\u5b9a\u6027\u4e0e\u6982\u7387\u6307\u6807\u4e0a\u4f18\u4e8e\u56db\u79cd\u7ecf\u5178\u96c6\u5408\u6ee4\u6ce2\u5668\uff0c\u5e76\u8d85\u8fc7\u73b0\u6709\u751f\u6210\u5f0f\u6570\u636e\u540c\u5316\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Machine-learned interatomic potentials (MLIPs) for solid-liquid interfaces in advanced materials applications, e.g., electrochemistry, catalysis and corrosion, require training data that samples both liquid environments, the solid and the interface itself. We present SoLiD26, a curated solid-liquid interface dataset, containing 15.4 million first-principles atomic structures with up to 576 atoms and 15 chemical elements for training and evaluating MLIPs. The structures were compiled from density functional theory (DFT) calculations performed in studies of solid-liquid interfaces, with most configurations originating from ab initio molecular dynamics (AIMD) simulations. Each record contains atomic species, positions, simulation cell, periodic boundary conditions, potential energy and atomic forces. SoLiD26 includes aqueous coinage metal interfaces, electrode-electrolyte systems, and selected bulk reference structures, calculated with VASP using the PBE functional and D3 dispersion corrections. We describe the data ingestion and preparation pipeline used to construct the dataset. The application of SoLiD26 for training and evaluating MLIPs is demonstrated with a suite of MACE models on a simple training, validation and test split. The dataset enables development and benchmarking of MLIPs for structurally and chemically heterogeneous solid-liquid interfaces.", "arxiv_id": "2609.28013", "arxiv_url": "https://arxiv.org/abs/2609.28013", "authors": ["Jonas Busk", "Emil J. P. Frost", "Yogeshwaran Krishnan", "Henrik H. Kristoffersen", "August E. G. Mikkelsen", "Xueping Qin", "Xin Yang", "Heine A. Hansen", "Arghya Bhowmik", "Tejs Vegge"], "brief": "\u8bba\u6587\u53d1\u5e03 SoLiD26\uff0c\u4e00\u4e2a\u9762\u5411\u56fa-\u6db2\u754c\u9762\u673a\u5668\u5b66\u4e60\u539f\u5b50\u95f4\u52bf\u7684\u6570\u636e\u96c6\uff0c\u5305\u542b 1540 \u4e07\u4e2a\u7b2c\u4e00\u6027\u539f\u7406\u539f\u5b50\u7ed3\u6784\u3001\u6700\u591a 576 \u4e2a\u539f\u5b50\u548c 15 \u79cd\u5143\u7d20\u3002\u6570\u636e\u8986\u76d6\u6c34\u6eb6\u6db2\u91d1\u5c5e\u754c\u9762\u3001\u7535\u6781-\u7535\u89e3\u8d28\u4f53\u7cfb\u53ca\u4f53\u76f8\u53c2\u8003\u7ed3\u6784\uff0c\u5e76\u7528 MACE \u6a21\u578b\u5c55\u793a\u4e86\u5176\u5728\u8bad\u7ec3\u548c\u8bc4\u6d4b MLIP \u4e0a\u7684\u7528\u9014\u3002", "categories": ["cond-mat.mtrl-sci", "cs.LG", "physics.chem-ph", "physics.comp-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28013", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6750\u6599\u79d1\u5b66", "\u673a\u5668\u5b66\u4e60\u52bf", "\u7b2c\u4e00\u6027\u539f\u7406", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28013v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SoLiD26: A First Principles Solid-Liquid Interface Dataset for Machine-learned Interatomic Potentials", "tldr": "\u8bba\u6587\u53d1\u5e03 SoLiD26\uff0c\u4e00\u4e2a\u9762\u5411\u56fa-\u6db2\u754c\u9762\u673a\u5668\u5b66\u4e60\u539f\u5b50\u95f4\u52bf\u7684\u6570\u636e\u96c6\uff0c\u5305\u542b 1540 \u4e07\u4e2a\u7b2c\u4e00\u6027\u539f\u7406\u539f\u5b50\u7ed3\u6784\u3001\u6700\u591a 576 \u4e2a\u539f\u5b50\u548c 15 \u79cd\u5143\u7d20\u3002\u6570\u636e\u8986\u76d6\u6c34\u6eb6\u6db2\u91d1\u5c5e\u754c\u9762\u3001\u7535\u6781-\u7535\u89e3\u8d28\u4f53\u7cfb\u53ca\u4f53\u76f8\u53c2\u8003\u7ed3\u6784\uff0c\u5e76\u7528 MACE \u6a21\u578b\u5c55\u793a\u4e86\u5176\u5728\u8bad\u7ec3\u548c\u8bc4\u6d4b MLIP \u4e0a\u7684\u7528\u9014\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most Turkish-capable large language models (LLMs) are evaluated using general-purpose benchmarks rather than long, structurally complex domain documents. This paper evaluates five open-weight 7B-8B models for Turkish document question answering under a resource-constrained local deployment setting. The primary benchmark contains 100 systematically validated questions derived from a 109-page industrial R\u0026D report, and the evaluation protocol is replicated using a second 112-page public-sector report and an independently constructed 100-question set. All models are evaluated locally on an NVIDIA RTX 3050 laptop GPU with 6 GB VRAM using controlled prompting, decoding, and 4-bit quantisation. The principal methodological contribution is an evidence-annotated evaluation protocol that separates retrieval failure from downstream model reasoning failure without requiring additional model calls. On the primary benchmark, end-to-end accuracy ranges from 49% to 75%. Seven lexical, dense, and hybrid retrieval configurations are additionally compared using 95% Wilson intervals and exact paired McNemar tests; none significantly outperforms the character TF-IDF baseline on either document. Evidence recall saturates differently across the two reports, showing that retrieval and effective context capacity can be binding constraints for some documents but not others. These results demonstrate that model selection, retrieval behaviour, and hardware limits must be evaluated separately when deploying open-weight LLMs for Turkish domain documents.", "arxiv_id": "2609.28007", "arxiv_url": "https://arxiv.org/abs/2609.28007", "authors": ["Imtiaz Ul Hassan", "\u00d6yk\u00fc Akbulut", "Onur Kaya", "Ardhendu Behera", "Swagat Kumar", "Peter Matthew", "Yonghuai Liu"], "brief": "\u672c\u6587\u5728\u672c\u5730\u4f4e\u8d44\u6e90\u786c\u4ef6\uff08RTX 3050 6GB\uff09\u4e0a\u8bc4\u6d4b\u4e865\u4e2a\u5f00\u6e90\u6743\u91cd7B-8B\u6a21\u578b\u5904\u7406\u571f\u8033\u5176\u8bed\u957f\u7bc7\u9886\u57df\u6587\u6863\u95ee\u7b54\u7684\u80fd\u529b\uff0c\u5e76\u5728\u4e24\u4efd\u767e\u9875\u7ea7\u62a5\u544a\u3001\u5404100\u9898\u4e0a\u590d\u73b0\u5b9e\u9a8c\u3002\u7814\u7a76\u63d0\u51fa\u5e26\u8bc1\u636e\u6807\u6ce8\u7684\u8bc4\u6d4b\u6d41\u7a0b\uff0c\u53ef\u533a\u5206\u68c0\u7d22\u5931\u8d25\u4e0e\u6a21\u578b\u63a8\u7406\u5931\u8d25\uff1b\u7aef\u5230\u7aef\u51c6\u786e\u7387\u4e3a49%\u523075%\uff0c\u591a\u79cd\u68c0\u7d22\u65b9\u6cd5\u5747\u672a\u663e\u8457\u4f18\u4e8e\u5b57\u7b26TF-IDF\u57fa\u7ebf\u3002", "categories": ["cs.CL", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28007", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u68c0\u7d22", "\u6587\u6863\u95ee\u7b54", "\u4f4e\u8d44\u6e90\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28007v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluating Open-Weight LLMs for Turkish Domain Documents Under Retrieval and Hardware Constraints", "tldr": "\u672c\u6587\u5728\u672c\u5730\u4f4e\u8d44\u6e90\u786c\u4ef6\uff08RTX 3050 6GB\uff09\u4e0a\u8bc4\u6d4b\u4e865\u4e2a\u5f00\u6e90\u6743\u91cd7B-8B\u6a21\u578b\u5904\u7406\u571f\u8033\u5176\u8bed\u957f\u7bc7\u9886\u57df\u6587\u6863\u95ee\u7b54\u7684\u80fd\u529b\uff0c\u5e76\u5728\u4e24\u4efd\u767e\u9875\u7ea7\u62a5\u544a\u3001\u5404100\u9898\u4e0a\u590d\u73b0\u5b9e\u9a8c\u3002\u7814\u7a76\u63d0\u51fa\u5e26\u8bc1\u636e\u6807\u6ce8\u7684\u8bc4\u6d4b\u6d41\u7a0b\uff0c\u53ef\u533a\u5206\u68c0\u7d22\u5931\u8d25\u4e0e\u6a21\u578b\u63a8\u7406\u5931\u8d25\uff1b\u7aef\u5230\u7aef\u51c6\u786e\u7387\u4e3a49%\u523075%\uff0c\u591a\u79cd\u68c0\u7d22\u65b9\u6cd5\u5747\u672a\u663e\u8457\u4f18\u4e8e\u5b57\u7b26TF-IDF\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Decoder-only Transformer language models cache keys and values (KV) to reuse past computation during generation. Sharing KV across layers saves storage but reduces the diversity of representations available across depth. We study what local memory should retain alongside shared global KV, separating historical content from the input source used to form it. At 126M parameters and 2K context, an eight-seed study finds about 1.4% lower held-out test perplexity with local history than with a current-token local branch. Capacity, entry-count and training-compute controls support the value of historical content. In a two-seed comparison, this value persists when adjacent layers share local inputs while retaining independent projections; source sharing also shortens exact cache-construction dependencies. Against GQA and adjacent-layer KV sharing, equal bounded learning-rate searches and new-seed confirmation yield better same-source likelihood with larger caches and higher long-request latency. The ordering against adjacent-layer sharing persists after equal-token adaptation to 8K, with a short-context cost. The eight-seed external-book history effect remains uncertain, and downstream outcomes vary by task. We derive a sufficient suffix schedule that reduces upper-layer construction work while preserving the complete cache in exact arithmetic.", "arxiv_id": "2609.28006", "arxiv_url": "https://arxiv.org/abs/2609.28006", "authors": ["Xinglang Xian"], "brief": "\u672c\u6587\u7814\u7a76\u89e3\u7801\u5f0f Transformer \u7684 KV \u7f13\u5b58\u5171\u4eab\uff1a\u5728\u5168\u5c40\u5171\u4eab KV \u4e4b\u5916\uff0c\u4e3a\u5404\u5c42\u4fdd\u7559\u5c11\u91cf\u672c\u5730\u5386\u53f2\u4fe1\u606f\uff0c\u800c\u4e0d\u662f\u53ea\u7528\u5f53\u524d token \u5206\u652f\u3002\u5c0f\u89c4\u6a21\u5b9e\u9a8c\u663e\u793a\u672c\u5730\u5386\u53f2\u53ef\u5c06\u6d4b\u8bd5\u56f0\u60d1\u5ea6\u964d\u4f4e\u7ea6 1.4%\uff0c\u5728\u82e5\u5e72\u63a7\u5236\u5b9e\u9a8c\u548c\u957f\u4e0a\u4e0b\u6587\u9002\u914d\u4e2d\u76f8\u5bf9\u76f8\u90bb\u5c42 KV \u5171\u4eab\u66f4\u4f18\uff0c\u4f46\u4f1a\u5e26\u6765\u66f4\u5927\u7f13\u5b58\u548c\u66f4\u9ad8\u957f\u8bf7\u6c42\u5ef6\u8fdf\uff0c\u90e8\u5206\u5916\u90e8\u6570\u636e\u4e0e\u4e0b\u6e38\u4efb\u52a1\u6548\u679c\u4ecd\u4e0d\u7a33\u5b9a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28006", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "Transformer", "KV\u7f13\u5b58", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28006v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Shared Global KV with Layer-Specific Local History", "tldr": "\u672c\u6587\u7814\u7a76\u89e3\u7801\u5f0f Transformer \u7684 KV \u7f13\u5b58\u5171\u4eab\uff1a\u5728\u5168\u5c40\u5171\u4eab KV \u4e4b\u5916\uff0c\u4e3a\u5404\u5c42\u4fdd\u7559\u5c11\u91cf\u672c\u5730\u5386\u53f2\u4fe1\u606f\uff0c\u800c\u4e0d\u662f\u53ea\u7528\u5f53\u524d token \u5206\u652f\u3002\u5c0f\u89c4\u6a21\u5b9e\u9a8c\u663e\u793a\u672c\u5730\u5386\u53f2\u53ef\u5c06\u6d4b\u8bd5\u56f0\u60d1\u5ea6\u964d\u4f4e\u7ea6 1.4%\uff0c\u5728\u82e5\u5e72\u63a7\u5236\u5b9e\u9a8c\u548c\u957f\u4e0a\u4e0b\u6587\u9002\u914d\u4e2d\u76f8\u5bf9\u76f8\u90bb\u5c42 KV \u5171\u4eab\u66f4\u4f18\uff0c\u4f46\u4f1a\u5e26\u6765\u66f4\u5927\u7f13\u5b58\u548c\u66f4\u9ad8\u957f\u8bf7\u6c42\u5ef6\u8fdf\uff0c\u90e8\u5206\u5916\u90e8\u6570\u636e\u4e0e\u4e0b\u6e38\u4efb\u52a1\u6548\u679c\u4ecd\u4e0d\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Small and medium-sized language models offer cost-effective executors for tool-using agents, making them attractive for local and large-scale deployment. However, in long-horizon and stateful environments, they often make structural errors such as missing required observations, performing premature writes, repeating failed calls, and violating action preconditions. These errors can lead to incorrect state updates, policy violations, and costly or irreversible consequences, making reliable tool execution a critical deployment challenge. Existing fine-tuning approaches require substantial data and computation, while flat memory may retrieve failed actions without preserving their causal context or safety conditions. In this paper, we propose FRESH, a Failure-aware Retrieval framework over Experience-Structured Heterogeneous graphs, which transforms historical successes and failures into structured external experience for tool-using agents. By explicitly modeling the dependencies among tasks, actions, errors, repairs, and execution conditions, FRESH helps frozen language models reuse reliable strategies, avoid recurring failures, and make safer decisions in stateful tool interactions. Experiments on $\u03c4$-Bench and AppWorld with multiple open-source models show that FRESH consistently improves task success and tool-use reliability over no-memory agents and representative memory-based baselines.", "arxiv_id": "2609.28003", "arxiv_url": "https://arxiv.org/abs/2609.28003", "authors": ["Jiaxing Li", "Lei Song", "Rui Dong", "Youyong Kong"], "brief": "\u8bba\u6587\u63d0\u51fa FRESH\uff0c\u4e00\u79cd\u9762\u5411\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u5931\u8d25\u611f\u77e5\u68c0\u7d22\u6846\u67b6\uff0c\u5c06\u5386\u53f2\u6210\u529f\u4e0e\u5931\u8d25\u7ecf\u9a8c\u7ec4\u7ec7\u6210\u5f02\u6784\u56fe\u8bb0\u5fc6\u3002\u5b83\u663e\u5f0f\u5efa\u6a21\u4efb\u52a1\u3001\u52a8\u4f5c\u3001\u9519\u8bef\u3001\u4fee\u590d\u548c\u6267\u884c\u6761\u4ef6\u4e4b\u95f4\u7684\u4f9d\u8d56\uff0c\u5e2e\u52a9\u51bb\u7ed3\u7684\u5c0f/\u4e2d\u8bed\u8a00\u6a21\u578b\u51cf\u5c11\u91cd\u590d\u5931\u8d25\u3001\u63d0\u5347\u957f\u7a0b\u6709\u72b6\u6001\u73af\u5883\u4e2d\u7684\u5de5\u5177\u8c03\u7528\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u5728 \u03c4-Bench \u548c AppWorld \u4e0a\u663e\u793a\u5176\u4f18\u4e8e\u65e0\u8bb0\u5fc6\u548c\u5178\u578b\u8bb0\u5fc6\u57fa\u7ebf\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.28003", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u56fe\u8bb0\u5fc6", "\u5c0f\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.28003v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning from Failures: Heterogeneous Graph Memory for Small Language Model Tool-Using Agents", "tldr": "\u8bba\u6587\u63d0\u51fa FRESH\uff0c\u4e00\u79cd\u9762\u5411\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u5931\u8d25\u611f\u77e5\u68c0\u7d22\u6846\u67b6\uff0c\u5c06\u5386\u53f2\u6210\u529f\u4e0e\u5931\u8d25\u7ecf\u9a8c\u7ec4\u7ec7\u6210\u5f02\u6784\u56fe\u8bb0\u5fc6\u3002\u5b83\u663e\u5f0f\u5efa\u6a21\u4efb\u52a1\u3001\u52a8\u4f5c\u3001\u9519\u8bef\u3001\u4fee\u590d\u548c\u6267\u884c\u6761\u4ef6\u4e4b\u95f4\u7684\u4f9d\u8d56\uff0c\u5e2e\u52a9\u51bb\u7ed3\u7684\u5c0f/\u4e2d\u8bed\u8a00\u6a21\u578b\u51cf\u5c11\u91cd\u590d\u5931\u8d25\u3001\u63d0\u5347\u957f\u7a0b\u6709\u72b6\u6001\u73af\u5883\u4e2d\u7684\u5de5\u5177\u8c03\u7528\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u5728 \u03c4-Bench \u548c AppWorld \u4e0a\u663e\u793a\u5176\u4f18\u4e8e\u65e0\u8bb0\u5fc6\u548c\u5178\u578b\u8bb0\u5fc6\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Methods operating on Vision Transformer (ViT) feature spaces typically rely on Euclidean distance or cosine similarity. This assumes that every direction is equally meaningful, but there is no reason to believe the true task geometry has this property. The task-sensitive geometry of the feature space is given by the pullback metric $g(F) = J(F)^\\top J(F)$, where $J$ is the Jacobian of the decoder\u0027s output fed to a task-specific distance, with respect to the features. Storing the full $g$ is infeasible at modern scales, and for dense outputs such as depth maps even forming $J$ is impractical. We show that whether a low-rank approximation of this metric can be learned depends on the model-decoder pair, and we characterize this with a matrix-free diagnostic $\u03ba_{cap}(r)$ computable with a low number of Jacobian-vector products. For tractable pairs, we develop the Spectral Pullback Network (SPN), which learns a low-rank version of the metric from randomized power iteration, and we distill it into a $310$K-parameter importance head that predicts token importance directly from the features. When the Jacobian spectrum is too spread out for a low-rank approximation, passing the decoder\u0027s input features through a VAE bottleneck can restore tractability. Across DPT, DINOv2, CLIP, and VGGT backbones, $\u03ba_{cap}(r)$ predicts which learned-metric architectures are viable. The importance head reaches Spearman $\u03c1= 0.998$ on DINOv2 CLS, and our geometric token pruning reduces the additional depth error of ToMe-based token selection by $25\\%$ on DPT depth at prune ratio $0.5$, without fine-tuning the ViT. Project page: https://cyberiada.github.io/TaskInducedViTs/", "arxiv_id": "2609.27988", "arxiv_url": "https://arxiv.org/abs/2609.27988", "authors": ["Andrew Bond", "Ege Erdem \u00d6zl\u00fc", "Tuna \u00c7imen", "Ilkin Umut Melanlioglu", "Tolga Birdal", "Erkut Erdem", "Aykut Erdem"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u4efb\u52a1\u8bf1\u5bfc\u7684\u9ece\u66fc\u5ea6\u91cf\u523b\u753b ViT \u7279\u5f81\u7a7a\u95f4\u4e2d\u4e0d\u540c\u65b9\u5411\u7684\u91cd\u8981\u6027\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u663e\u5f0f\u6784\u9020\u96c5\u53ef\u6bd4\u77e9\u9635\u7684\u4f4e\u79e9\u53ef\u5b66\u4e60\u6027\u8bca\u65ad \u03ba_cap(r)\u3002\u5728\u53ef\u5904\u7406\u573a\u666f\u4e2d\uff0c\u4f5c\u8005\u8bad\u7ec3 Spectral Pullback Network \u5e76\u84b8\u998f\u51fa\u5c0f\u578b token \u91cd\u8981\u6027\u5934\uff0c\u7528\u4e8e\u66f4\u7b26\u5408\u4efb\u52a1\u51e0\u4f55\u7684 token \u526a\u679d\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u8bca\u65ad\u80fd\u9884\u6d4b\u4e0d\u540c\u6a21\u578b-\u89e3\u7801\u5668\u7ec4\u5408\u7684\u53ef\u884c\u6027\uff0c\u5e76\u5728\u6df1\u5ea6\u4f30\u8ba1\u4e2d\u5c06 ToMe \u526a\u679d\u5e26\u6765\u7684\u989d\u5916\u8bef\u5dee\u964d\u4f4e\u7ea6 25%\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27988", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9Transformer", "\u8868\u793a\u5b66\u4e60", "\u51e0\u4f55\u5b66\u4e60", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27988v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Task-Induced Riemannian Metrics for Vision Transformer Feature Spaces", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u4efb\u52a1\u8bf1\u5bfc\u7684\u9ece\u66fc\u5ea6\u91cf\u523b\u753b ViT \u7279\u5f81\u7a7a\u95f4\u4e2d\u4e0d\u540c\u65b9\u5411\u7684\u91cd\u8981\u6027\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u663e\u5f0f\u6784\u9020\u96c5\u53ef\u6bd4\u77e9\u9635\u7684\u4f4e\u79e9\u53ef\u5b66\u4e60\u6027\u8bca\u65ad \u03ba_cap(r)\u3002\u5728\u53ef\u5904\u7406\u573a\u666f\u4e2d\uff0c\u4f5c\u8005\u8bad\u7ec3 Spectral Pullback Network \u5e76\u84b8\u998f\u51fa\u5c0f\u578b token \u91cd\u8981\u6027\u5934\uff0c\u7528\u4e8e\u66f4\u7b26\u5408\u4efb\u52a1\u51e0\u4f55\u7684 token \u526a\u679d\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u8bca\u65ad\u80fd\u9884\u6d4b\u4e0d\u540c\u6a21\u578b-\u89e3\u7801\u5668\u7ec4\u5408\u7684\u53ef\u884c\u6027\uff0c\u5e76\u5728\u6df1\u5ea6\u4f30\u8ba1\u4e2d\u5c06 ToMe \u526a\u679d\u5e26\u6765\u7684\u989d\u5916\u8bef\u5dee\u964d\u4f4e\u7ea6 25%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have made substantial progress on medical question-answering, yet effective medical dialogue also requires learning to ask questions that uncover relevant patient information. To train such dialogue policies, a common pipeline combines supervised fine-tuning with reinforcement learning (RL) based on final diagnostic correctness. However, this outcome-based supervision does not directly distinguish the contributions of individual questions and provides no question-level feedback for unexecuted alternatives. To address this gap, we introduce PCQC (Privileged Counterfactual Question Credit), which uses privileged patient information during training to learn from questions never asked. During training, PCQC makes alternative questions directly comparable at the same dialogue state by using privileged patient facts to construct their answers. A frozen diagnostic scorer evaluates the diagnostic utility of each resulting question-answer pair by how strongly it supports the correct diagnosis. PCQC turns these comparisons into relative question credit that teaches the policy which questions to favor, directly supervising both executed and unexecuted questions alongside outcome-based RL without requiring complete rollouts for the unexecuted alternatives. Extensive experiments across four medical benchmarks demonstrate that PCQC achieves 63.10% mean diagnostic accuracy, outperforming GRPO and ATPO by 4.38 and 4.21 percentage points, respectively. These gains are achieved with 33.1% fewer inquiry turns than GRPO.", "arxiv_id": "2609.27987", "arxiv_url": "https://arxiv.org/abs/2609.27987", "authors": ["Chenxuan Li", "Jiayi Wan", "Xinrong Chen", "Zhongyu Zhao", "Xuecheng Shang", "Peixing Wan"], "brief": "\u672c\u6587\u63d0\u51fa PCQC\uff0c\u7528\u8bad\u7ec3\u65f6\u53ef\u89c1\u7684\u60a3\u8005\u7279\u6743\u4fe1\u606f\u4e3a\u672a\u88ab\u5b9e\u9645\u63d0\u95ee\u7684\u53cd\u4e8b\u5b9e\u95ee\u9898\u6784\u9020\u56de\u7b54\uff0c\u5e76\u7528\u51bb\u7ed3\u8bca\u65ad\u8bc4\u5206\u5668\u8bc4\u4f30\u5176\u5bf9\u6b63\u786e\u8bca\u65ad\u7684\u8d21\u732e\u3002\u8be5\u65b9\u6cd5\u4e3a\u591a\u8f6e\u533b\u7597\u95ee\u8bca\u4e2d\u7684\u95ee\u9898\u9009\u62e9\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\uff0c\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230 63.10% \u5e73\u5747\u8bca\u65ad\u51c6\u786e\u7387\uff0c\u4f18\u4e8e GRPO/ATPO\uff0c\u4e14\u95ee\u8bca\u8f6e\u6570\u51cf\u5c11 33.1%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27987", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u5bf9\u8bdd", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27987v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PCQC: Privileged Counterfactual Question Credit for Multi-Turn Medical Dialogue", "tldr": "\u672c\u6587\u63d0\u51fa PCQC\uff0c\u7528\u8bad\u7ec3\u65f6\u53ef\u89c1\u7684\u60a3\u8005\u7279\u6743\u4fe1\u606f\u4e3a\u672a\u88ab\u5b9e\u9645\u63d0\u95ee\u7684\u53cd\u4e8b\u5b9e\u95ee\u9898\u6784\u9020\u56de\u7b54\uff0c\u5e76\u7528\u51bb\u7ed3\u8bca\u65ad\u8bc4\u5206\u5668\u8bc4\u4f30\u5176\u5bf9\u6b63\u786e\u8bca\u65ad\u7684\u8d21\u732e\u3002\u8be5\u65b9\u6cd5\u4e3a\u591a\u8f6e\u533b\u7597\u95ee\u8bca\u4e2d\u7684\u95ee\u9898\u9009\u62e9\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\uff0c\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230 63.10% \u5e73\u5747\u8bca\u65ad\u51c6\u786e\u7387\uff0c\u4f18\u4e8e GRPO/ATPO\uff0c\u4e14\u95ee\u8bca\u8f6e\u6570\u51cf\u5c11 33.1%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate remaining discharge time (RDT) prediction is challenging in real-world battery applications because future load profiles are unknown and highly dynamic. To address the uncertainty of continuous RDT regression, this paper introduces Relative Discharge Stage (RDS), a battery-management indicator that represents the remaining discharge condition using five interpretable classes: Normal, Good, Moderate, Low, and Recharge Required. Unlike state of charge (SOC), which reflects the current charge level, RDS characterizes the remaining discharge process without requiring future-current information during inference. A physics-informed RDS classification framework is proposed, combining SOC estimation with lightweight temporal learning. The SOC-estimation component includes second-order ECM state and terminal-voltage prediction, hysteresis and OCV temperature correction, core-temperature estimation, and AEKF state correction, supported by OCV evaluation, online STC-ECM parameter adaptation, and pretrained neural residual-voltage correction. The measured current, terminal voltage, surface temperature, and estimated SOC are arranged into a sliding observation window and processed by a lightweight temporal convolutional network. Experiments on two public lithium-ion battery datasets demonstrate robust RDS classification, with accuracy exceeding 80% under varying load and thermal conditions.", "arxiv_id": "2609.27986", "arxiv_url": "https://arxiv.org/abs/2609.27986", "authors": ["Khoa Tran", "Tri Le", "Hung-Cuong Trinh", "Hung Tran-Nam"], "brief": "\u672c\u6587\u63d0\u51fa\u76f8\u5bf9\u653e\u7535\u9636\u6bb5\uff08RDS\uff09\u5206\u7c7b\u6307\u6807\uff0c\u7528\u4e94\u4e2a\u53ef\u89e3\u91ca\u7c7b\u522b\u63cf\u8ff0\u7535\u6c60\u5269\u4f59\u653e\u7535\u8fdb\u7a0b\uff0c\u4ee5\u66ff\u4ee3\u5728\u672a\u6765\u8d1f\u8f7d\u672a\u77e5\u65f6\u56f0\u96be\u7684\u5269\u4f59\u653e\u7535\u65f6\u95f4\u56de\u5f52\u3002\u65b9\u6cd5\u7ed3\u5408\u7269\u7406\u4fe1\u606fSOC\u4f30\u8ba1\u3001\u6e29\u5ea6/\u6ede\u56de/\u53c2\u6570\u81ea\u9002\u5e94\u6821\u6b63\u4e0e\u8f7b\u91cf\u65f6\u5e8f\u5377\u79ef\u7f51\u7edc\uff0c\u5728\u4e24\u4e2a\u516c\u5f00\u9502\u7535\u6c60\u6570\u636e\u96c6\u4e0a\u5206\u7c7b\u51c6\u786e\u7387\u8d85\u8fc780%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27986", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7535\u6c60\u7ba1\u7406", "\u65f6\u5e8f\u5efa\u6a21", "\u7269\u7406\u4fe1\u606f\u5b66\u4e60", "\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27986v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Relative Discharge Stage (RDS) Classification: A Practical Indicator of Battery Discharge Progress", "tldr": "\u672c\u6587\u63d0\u51fa\u76f8\u5bf9\u653e\u7535\u9636\u6bb5\uff08RDS\uff09\u5206\u7c7b\u6307\u6807\uff0c\u7528\u4e94\u4e2a\u53ef\u89e3\u91ca\u7c7b\u522b\u63cf\u8ff0\u7535\u6c60\u5269\u4f59\u653e\u7535\u8fdb\u7a0b\uff0c\u4ee5\u66ff\u4ee3\u5728\u672a\u6765\u8d1f\u8f7d\u672a\u77e5\u65f6\u56f0\u96be\u7684\u5269\u4f59\u653e\u7535\u65f6\u95f4\u56de\u5f52\u3002\u65b9\u6cd5\u7ed3\u5408\u7269\u7406\u4fe1\u606fSOC\u4f30\u8ba1\u3001\u6e29\u5ea6/\u6ede\u56de/\u53c2\u6570\u81ea\u9002\u5e94\u6821\u6b63\u4e0e\u8f7b\u91cf\u65f6\u5e8f\u5377\u79ef\u7f51\u7edc\uff0c\u5728\u4e24\u4e2a\u516c\u5f00\u9502\u7535\u6c60\u6570\u636e\u96c6\u4e0a\u5206\u7c7b\u51c6\u786e\u7387\u8d85\u8fc780%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we are concerned with matrices formed by block-diagonal factors interleaved with fixed permutations -- a flexible family of structured matrices. This class has recently drawn interest in deep learning architectures for its balanced expressivity-efficiency trade-off, yet efficient computational strategies for working with it remain to be found. We approach this problem through Riemannian geometry and examine under what conditions this class admits a smooth manifold structure. For the practically important case of orthogonal two-factor matrices, we derive the essential Riemannian tools and propose efficient algorithms for their implementation. The algorithms leverage automatic differentiation, support parameter sharing within each factor, and avoid explicit dense matrix construction. We test them within the Riemannian optimization framework on the best matrix approximation problem and for parameter-efficient fine-tuning of large language models. Beyond the two-factor setting, we study the geometric and matrix-theoretic properties of factorizations with a larger number of block-diagonal factors.", "arxiv_id": "2609.27982", "arxiv_url": "https://arxiv.org/abs/2609.27982", "authors": ["Ali Aliev", "Maxim Rakhuba"], "brief": "\u672c\u6587\u7814\u7a76\u7531\u5757\u5bf9\u89d2\u56e0\u5b50\u4e0e\u56fa\u5b9a\u7f6e\u6362\u4ea4\u9519\u5f62\u6210\u7684\u4f4e\u53c2\u6570\u6b63\u4ea4\u77e9\u9635\u65cf\uff0c\u5206\u6790\u5176\u6d41\u5f62\u7ed3\u6784\u5e76\u4e3a\u4e24\u56e0\u5b50\u60c5\u5f62\u63a8\u5bfc\u9ece\u66fc\u4f18\u5316\u6240\u9700\u5de5\u5177\u3002\u63d0\u51fa\u7684\u7b97\u6cd5\u53ef\u5229\u7528\u81ea\u52a8\u5fae\u5206\u3001\u652f\u6301\u53c2\u6570\u5171\u4eab\u4e14\u907f\u514d\u6784\u9020\u7a20\u5bc6\u77e9\u9635\uff0c\u5e76\u5728\u77e9\u9635\u8fd1\u4f3c\u548c\u5927\u8bed\u8a00\u6a21\u578b\u53c2\u6570\u9ad8\u6548\u5fae\u8c03\u4e2d\u9a8c\u8bc1\u4e86\u5b9e\u7528\u6027\u3002", "categories": ["cs.LG", "cs.AI", "math.DG", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27982", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ece\u66fc\u4f18\u5316", "\u6b63\u4ea4\u77e9\u9635", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u7ed3\u6784\u5316\u77e9\u9635"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27982v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Riemannian Structure and Optimization for a Class of Low-Parametric Orthogonal Matrices", "tldr": "\u672c\u6587\u7814\u7a76\u7531\u5757\u5bf9\u89d2\u56e0\u5b50\u4e0e\u56fa\u5b9a\u7f6e\u6362\u4ea4\u9519\u5f62\u6210\u7684\u4f4e\u53c2\u6570\u6b63\u4ea4\u77e9\u9635\u65cf\uff0c\u5206\u6790\u5176\u6d41\u5f62\u7ed3\u6784\u5e76\u4e3a\u4e24\u56e0\u5b50\u60c5\u5f62\u63a8\u5bfc\u9ece\u66fc\u4f18\u5316\u6240\u9700\u5de5\u5177\u3002\u63d0\u51fa\u7684\u7b97\u6cd5\u53ef\u5229\u7528\u81ea\u52a8\u5fae\u5206\u3001\u652f\u6301\u53c2\u6570\u5171\u4eab\u4e14\u907f\u514d\u6784\u9020\u7a20\u5bc6\u77e9\u9635\uff0c\u5e76\u5728\u77e9\u9635\u8fd1\u4f3c\u548c\u5927\u8bed\u8a00\u6a21\u578b\u53c2\u6570\u9ad8\u6548\u5fae\u8c03\u4e2d\u9a8c\u8bc1\u4e86\u5b9e\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "KV-cache eviction is typically evaluated through average quality-memory trade-offs, yet a small average loss can hide requests whose utility degrades materially. We reformulate eviction as a deployment risk-control problem: a material degradation occurs when eviction lowers task utility by more than a deployment-specified tolerance relative to full-KV inference on the same request, and deployment risk is the population frequency of such events. Given a reliability contract specifying a target risk level and confidence requirement, we use a compressor-agnostic post-hoc certification procedure to select a retention policy from calibration data with a finite-sample guarantee, falling back to full KV when no compressed policy is certified. Across multiple eviction methods, Llama and Mistral models, and LongBench and RULER-32K, the same contract supports substantially different levels of eviction: on Llama, it certifies SnapKV at 75% retention on LongBench but no tested compressed policy on RULER-32K, triggering full-KV fallback. Policies with empirical degradation rates below the 5% target can still fail finite-sample certification; on Llama LongBench, empirical thresholding selects uncertified policies that retain 5-10 percentage points less cache across fixed-budget methods. The proposed framework converts a deployment-level reliability requirement into a KV-memory operating point.", "arxiv_id": "2609.27981", "arxiv_url": "https://arxiv.org/abs/2609.27981", "authors": ["Beomgu Kang", "SoJin Yun", "Hojoon Kim", "Hyunseok Seo"], "brief": "\u8bba\u6587\u5c06 KV-cache \u6dd8\u6c70\u4ece\u5e73\u5747\u8d28\u91cf-\u5185\u5b58\u6743\u8861\u91cd\u65b0\u8868\u8ff0\u4e3a\u90e8\u7f72\u98ce\u9669\u63a7\u5236\u95ee\u9898\uff1a\u5f53\u538b\u7f29\u63a8\u7406\u76f8\u5bf9 full-KV \u7684\u4efb\u52a1\u6548\u7528\u4e0b\u964d\u8d85\u8fc7\u5bb9\u5fcd\u9608\u503c\u65f6\u89c6\u4e3a\u98ce\u9669\u4e8b\u4ef6\u3002\u4f5c\u8005\u63d0\u51fa\u4e0e\u538b\u7f29\u65b9\u6cd5\u65e0\u5173\u7684\u4e8b\u540e\u8ba4\u8bc1\u6d41\u7a0b\uff0c\u7528\u6821\u51c6\u6570\u636e\u5728\u6709\u9650\u6837\u672c\u4e0b\u4e3a\u4fdd\u7559\u7b56\u7565\u63d0\u4f9b\u98ce\u9669\u4fdd\u8bc1\uff0c\u672a\u901a\u8fc7\u8ba4\u8bc1\u5219\u56de\u9000\u5230 full-KV\uff1b\u5b9e\u9a8c\u663e\u793a\u540c\u4e00\u53ef\u9760\u6027\u5408\u7ea6\u4f1a\u5728\u4e0d\u540c\u6a21\u578b\u548c\u4efb\u52a1\u4e0a\u9009\u62e9\u663e\u8457\u4e0d\u540c\u7684\u7f13\u5b58\u4fdd\u7559\u7387\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27981", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["KV\u7f13\u5b58", "\u98ce\u9669\u63a7\u5236", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27981v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Risk-Controlled KV-Cache Eviction: From Memory Budgets to Risk Targets", "tldr": "\u8bba\u6587\u5c06 KV-cache \u6dd8\u6c70\u4ece\u5e73\u5747\u8d28\u91cf-\u5185\u5b58\u6743\u8861\u91cd\u65b0\u8868\u8ff0\u4e3a\u90e8\u7f72\u98ce\u9669\u63a7\u5236\u95ee\u9898\uff1a\u5f53\u538b\u7f29\u63a8\u7406\u76f8\u5bf9 full-KV \u7684\u4efb\u52a1\u6548\u7528\u4e0b\u964d\u8d85\u8fc7\u5bb9\u5fcd\u9608\u503c\u65f6\u89c6\u4e3a\u98ce\u9669\u4e8b\u4ef6\u3002\u4f5c\u8005\u63d0\u51fa\u4e0e\u538b\u7f29\u65b9\u6cd5\u65e0\u5173\u7684\u4e8b\u540e\u8ba4\u8bc1\u6d41\u7a0b\uff0c\u7528\u6821\u51c6\u6570\u636e\u5728\u6709\u9650\u6837\u672c\u4e0b\u4e3a\u4fdd\u7559\u7b56\u7565\u63d0\u4f9b\u98ce\u9669\u4fdd\u8bc1\uff0c\u672a\u901a\u8fc7\u8ba4\u8bc1\u5219\u56de\u9000\u5230 full-KV\uff1b\u5b9e\u9a8c\u663e\u793a\u540c\u4e00\u53ef\u9760\u6027\u5408\u7ea6\u4f1a\u5728\u4e0d\u540c\u6a21\u578b\u548c\u4efb\u52a1\u4e0a\u9009\u62e9\u663e\u8457\u4e0d\u540c\u7684\u7f13\u5b58\u4fdd\u7559\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pruning large pre-trained transformer-based ASR models such as OpenAI\u0027s Whisper has seen great adoption, as pruning the decoder led to significant end-to-end transcription speedups. For instance, the {\\tt whisper-large-v3-turbo} variant reduced the decoder from 32 to 4 layers, while Distill-Whisper similarly reduced the decoder to only 2 layers. Although some attention has been put towards reducing the size of the encoder, no approach has seen wide adoption. This could be due to the need for custom inference implementations to take advantage of the compressed model. We present an approach that ranks encoder layers by the leave-one-layer-out change in Word Error Rate (WER). The six layers that cause the least change are removed, corresponding to $18.5\\%$ of the encoder stack. The pruned model requires no custom inference code as it is simply a more shallow encoder with fewer layers. We further distill using unlabeled monolingual speech data to recover performance degradation caused by the zero-shot layer pruning. Mean WER across four languages increases to $20.1\\%$ after distillation, compared to $21.9\\%$ zero-shot, going from a baseline of $18.2\\%$. We release all of our code (https://github.com/rasgaard/whisper-encoder-layer-prune) and the pruned model (https://huggingface.co/rasgaard/whisper-large-v3-turbo-encoder-pruned).", "arxiv_id": "2609.27980", "arxiv_url": "https://arxiv.org/abs/2609.27980", "authors": ["Rasmus Aagaard", "Nicki Skafte Detlefsen"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9488\u5bf9 Whisper \u7f16\u7801\u5668\u7684\u5c42\u526a\u679d\u65b9\u6cd5\uff0c\u901a\u8fc7\u9010\u5c42\u79fb\u9664\u5e76\u89c2\u5bdf WER \u53d8\u5316\u6765\u9009\u62e9\u5f71\u54cd\u6700\u5c0f\u7684 6 \u5c42\uff0c\u51cf\u5c11\u7ea6 18.5% \u7f16\u7801\u5668\u5c42\u6570\u4e14\u65e0\u9700\u81ea\u5b9a\u4e49\u63a8\u7406\u4ee3\u7801\u3002\u968f\u540e\u4f7f\u7528\u65e0\u6807\u6ce8\u5355\u8bed\u8bed\u97f3\u8fdb\u884c\u84b8\u998f\u6062\u590d\u6027\u80fd\uff0c\u5e73\u5747 WER \u4ece\u96f6\u6837\u672c\u526a\u679d\u540e\u7684 21.9% \u964d\u81f3 20.1%\uff0c\u4f46\u4ecd\u9ad8\u4e8e\u539f\u59cb\u57fa\u7ebf 18.2%\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27980", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u6a21\u578b\u526a\u679d", "\u77e5\u8bc6\u84b8\u998f", "Whisper"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27980v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Six Layers Less: Encoder Pruning for Whisper with Label-Free Recovery", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9488\u5bf9 Whisper \u7f16\u7801\u5668\u7684\u5c42\u526a\u679d\u65b9\u6cd5\uff0c\u901a\u8fc7\u9010\u5c42\u79fb\u9664\u5e76\u89c2\u5bdf WER \u53d8\u5316\u6765\u9009\u62e9\u5f71\u54cd\u6700\u5c0f\u7684 6 \u5c42\uff0c\u51cf\u5c11\u7ea6 18.5% \u7f16\u7801\u5668\u5c42\u6570\u4e14\u65e0\u9700\u81ea\u5b9a\u4e49\u63a8\u7406\u4ee3\u7801\u3002\u968f\u540e\u4f7f\u7528\u65e0\u6807\u6ce8\u5355\u8bed\u8bed\u97f3\u8fdb\u884c\u84b8\u998f\u6062\u590d\u6027\u80fd\uff0c\u5e73\u5747 WER \u4ece\u96f6\u6837\u672c\u526a\u679d\u540e\u7684 21.9% \u964d\u81f3 20.1%\uff0c\u4f46\u4ecd\u9ad8\u4e8e\u539f\u59cb\u57fa\u7ebf 18.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The surge in AI-assisted generation of educational materials has outpaced our capacity to validate their pedagogical quality. Automated evaluation using Bloom Classifier models is a promising approach to assess educational materials at scale. These models show high accuracy within-distribution dataset (IID Dataset). However, applying the same models to new out-of-distribution (OOD) datasets such as AI-assisted generated questions could show performance degradation. To identify robust classifiers under dataset shift, we evaluated traditional Machine Learning (ML), transformer, and Large Language models on the Bloom level classification task. We also explored feature-engineering strategies incorporating NLP metrics, appending the learning objectives as part of the input, and text splicing to stabilize OOD performance. Our baseline tests show that TFPOS-IDF ML models perform poorly on OOD (Macro F1-score 0.48) compared to BERT (0.55) and LLMs (0.79). Text splicing improved macro F1-score performance of ML and BERT models (0.59 and 0.62, respectively). Appending the learning objectives with the input increased model performance on specific dataset. Model retraining provided the largest improvement across models and datasets. Overall, these findings highlight the trade-off on the use of pre-trained models with novel AI-assisted educational questions and how strategic feature enhancements help address loss in performance.", "arxiv_id": "2609.27749", "arxiv_url": "https://arxiv.org/abs/2609.27749", "authors": ["Michael Lawrence Castanares", "Princess Ventures", "Allan Tan"], "brief": "\u672c\u6587\u8bc4\u4f30\u4e86\u4f20\u7edf\u673a\u5668\u5b66\u4e60\u3001BERT \u548c\u5927\u8bed\u8a00\u6a21\u578b\u5728\u5e03\u9c81\u59c6\u8ba4\u77e5\u5c42\u7ea7\u5206\u7c7b\u4e2d\uff0c\u5bf9 AI \u8f85\u52a9\u751f\u6210\u6559\u80b2\u95ee\u9898\u7684\u6cdb\u5316\u80fd\u529b\u3002\u7ed3\u679c\u663e\u793a\u9884\u8bad\u7ec3\u6a21\u578b\u5728\u5206\u5e03\u5916\u6570\u636e\u4e0a\u660e\u663e\u9000\u5316\uff0c\u4f46\u5927\u8bed\u8a00\u6a21\u578b\u8868\u73b0\u6700\u597d\uff1b\u6587\u672c\u62fc\u63a5\u3001\u52a0\u5165\u5b66\u4e60\u76ee\u6807\u548c\u91cd\u65b0\u8bad\u7ec3\u53ef\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5176\u4e2d\u91cd\u65b0\u8bad\u7ec3\u6536\u76ca\u6700\u5927\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27749", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6559\u80b2AI", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u5206\u7c7b", "\u5206\u5e03\u5916\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27749v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluation of pre-trained models for pedagogical assessment of novel AI-assisted educational questions", "tldr": "\u672c\u6587\u8bc4\u4f30\u4e86\u4f20\u7edf\u673a\u5668\u5b66\u4e60\u3001BERT \u548c\u5927\u8bed\u8a00\u6a21\u578b\u5728\u5e03\u9c81\u59c6\u8ba4\u77e5\u5c42\u7ea7\u5206\u7c7b\u4e2d\uff0c\u5bf9 AI \u8f85\u52a9\u751f\u6210\u6559\u80b2\u95ee\u9898\u7684\u6cdb\u5316\u80fd\u529b\u3002\u7ed3\u679c\u663e\u793a\u9884\u8bad\u7ec3\u6a21\u578b\u5728\u5206\u5e03\u5916\u6570\u636e\u4e0a\u660e\u663e\u9000\u5316\uff0c\u4f46\u5927\u8bed\u8a00\u6a21\u578b\u8868\u73b0\u6700\u597d\uff1b\u6587\u672c\u62fc\u63a5\u3001\u52a0\u5165\u5b66\u4e60\u76ee\u6807\u548c\u91cd\u65b0\u8bad\u7ec3\u53ef\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5176\u4e2d\u91cd\u65b0\u8bad\u7ec3\u6536\u76ca\u6700\u5927\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In value-based reinforcement learning, improving the accuracy of policy evaluation has been shown to improve downstream policy optimization performance. The widely adopted family of approximations relying on $n$-step truncation yields computationally efficient value estimators but is inherently limited to a short evaluation horizon. In contrast, methods that exploit the global structure of the transition dynamics can accelerate policy evaluation, but their memory and computational requirements often limit scalability to large or continuous state spaces. To reconcile these limitations, we introduce Limiting-Kernel Q($\u03bb$) (LKQL), an off-policy value estimator that combines $n$-step truncation with a long-horizon approximation based on the limiting kernel (LK). LKQL has the same order of complexity as $n$-step estimators and integrates directly into both on- and off-policy actor-critic algorithms. We prove that, under aperiodicity and in the near-on-policy regime, the operator underlying LKQL improves the policy evaluation convergence rate over its truncated counterpart for sufficiently large $n$, and that LKQL itself converges almost surely to the optimal values in finite Markov decision processes (MDPs) under a fixed behavior policy. On the MuJoCo continuous-control benchmark, we show that LKQL improves over $n$-step baselines in most settings, particularly on long-horizon tasks.", "arxiv_id": "2609.27741", "arxiv_url": "https://arxiv.org/abs/2609.27741", "authors": ["Tolga Ok", "Arman Sharifi Kolarijani", "Peyman Mohajerin Esfahani", "Mohamad Amin Sharifi Kolarijani"], "brief": "\u672c\u6587\u63d0\u51fa Limiting-Kernel Q(\u03bb)\uff08LKQL\uff09\uff0c\u5c06 n \u6b65\u622a\u65ad\u4f30\u8ba1\u4e0e\u57fa\u4e8e\u6781\u9650\u6838\u7684\u957f\u65f6\u57df\u8fd1\u4f3c\u7ed3\u5408\uff0c\u7528\u4e8e\u79bb\u7b56\u7565\u4ef7\u503c\u8bc4\u4f30\u3002\u8be5\u65b9\u6cd5\u4fdd\u6301\u4e0e n \u6b65\u4f30\u8ba1\u540c\u9636\u590d\u6742\u5ea6\uff0c\u5e76\u5728\u7406\u8bba\u4e0a\u63d0\u5347\u6536\u655b\u901f\u5ea6\u3001\u4fdd\u8bc1\u6709\u9650 MDP \u4e2d\u6536\u655b\uff1b\u5728 MuJoCo \u957f\u65f6\u57df\u4efb\u52a1\u4e2d\u666e\u904d\u4f18\u4e8e n \u6b65\u57fa\u7ebf\u3002", "categories": ["cs.LG", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27741", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u4ef7\u503c\u4f30\u8ba1", "\u79bb\u7b56\u7565\u5b66\u4e60", "\u957f\u65f6\u57df"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27741v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Limiting-Kernel Q($\u03bb$): Bridging Short and Long Horizons", "tldr": "\u672c\u6587\u63d0\u51fa Limiting-Kernel Q(\u03bb)\uff08LKQL\uff09\uff0c\u5c06 n \u6b65\u622a\u65ad\u4f30\u8ba1\u4e0e\u57fa\u4e8e\u6781\u9650\u6838\u7684\u957f\u65f6\u57df\u8fd1\u4f3c\u7ed3\u5408\uff0c\u7528\u4e8e\u79bb\u7b56\u7565\u4ef7\u503c\u8bc4\u4f30\u3002\u8be5\u65b9\u6cd5\u4fdd\u6301\u4e0e n \u6b65\u4f30\u8ba1\u540c\u9636\u590d\u6742\u5ea6\uff0c\u5e76\u5728\u7406\u8bba\u4e0a\u63d0\u5347\u6536\u655b\u901f\u5ea6\u3001\u4fdd\u8bc1\u6709\u9650 MDP \u4e2d\u6536\u655b\uff1b\u5728 MuJoCo \u957f\u65f6\u57df\u4efb\u52a1\u4e2d\u666e\u904d\u4f18\u4e8e n \u6b65\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose the Memory-Efficient Neural Operator (MENO) as a high-performance PDE neural solver based on the Manifold Function Encoder (MFE).
