 MENO features three primary advantages: (1) MENO has a significantly smaller memory footprint and much faster training speed than other popular architectures, with the memory footprint being independent of the data resolution, and therefore holds the potential for scaling up to large-scale models. (2) MENO can accept PDE inputs of arbitrary form, including arbitrary geometric domains and arbitrary discretizations. In particular, it is capable of handling cross-geometry scenarios, i.e., where the input functions and the output solutions are defined on different manifolds. (3) MENO exhibits strong generalization capability, and achieves the best accuracy on most of the benchmarks we tested, compared with the results reported in the literature. The code is available on GitHub at https://github.com/jpzxshi/MENO, and all numerical examples in this paper can be run with a single command to reproduce the reported results.", "arxiv_id": "2609.27739", "arxiv_url": "https://arxiv.org/abs/2609.27739", "authors": ["Shengyang Xu", "Weijun Zhang", "Jun Hu", "Pengzhan Jin"], "brief": "\u672c\u6587\u63d0\u51fa MENO\uff0c\u4e00\u79cd\u57fa\u4e8e\u6d41\u5f62\u51fd\u6570\u7f16\u7801\u5668\u7684\u9ad8\u6027\u80fd PDE \u795e\u7ecf\u7b97\u5b50\u6c42\u89e3\u5668\u3002\u5b83\u5728\u5185\u5b58\u5360\u7528\u548c\u8bad\u7ec3\u901f\u5ea6\u4e0a\u663e\u8457\u4f18\u4e8e\u5e38\u89c1\u67b6\u6784\uff0c\u4e14\u5185\u5b58\u4e0e\u6570\u636e\u5206\u8fa8\u7387\u65e0\u5173\uff0c\u5e76\u80fd\u5904\u7406\u4efb\u610f\u51e0\u4f55\u57df\u3001\u4efb\u610f\u79bb\u6563\u4ee5\u53ca\u8de8\u51e0\u4f55\u8f93\u5165\u8f93\u51fa\u573a\u666f\u3002\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8868\u73b0\u51fa\u8f83\u5f3a\u6cdb\u5316\u80fd\u529b\uff0c\u5e76\u53d6\u5f97\u591a\u6570\u4efb\u52a1\u7684\u6700\u4f73\u7cbe\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27739", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u7b97\u5b50", "\u504f\u5fae\u5206\u65b9\u7a0b", "\u9ad8\u6548\u8bad\u7ec3", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27739v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MENO: Memory-Efficient Neural Operator", "tldr": "\u672c\u6587\u63d0\u51fa MENO\uff0c\u4e00\u79cd\u57fa\u4e8e\u6d41\u5f62\u51fd\u6570\u7f16\u7801\u5668\u7684\u9ad8\u6027\u80fd PDE \u795e\u7ecf\u7b97\u5b50\u6c42\u89e3\u5668\u3002\u5b83\u5728\u5185\u5b58\u5360\u7528\u548c\u8bad\u7ec3\u901f\u5ea6\u4e0a\u663e\u8457\u4f18\u4e8e\u5e38\u89c1\u67b6\u6784\uff0c\u4e14\u5185\u5b58\u4e0e\u6570\u636e\u5206\u8fa8\u7387\u65e0\u5173\uff0c\u5e76\u80fd\u5904\u7406\u4efb\u610f\u51e0\u4f55\u57df\u3001\u4efb\u610f\u79bb\u6563\u4ee5\u53ca\u8de8\u51e0\u4f55\u8f93\u5165\u8f93\u51fa\u573a\u666f\u3002\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8868\u73b0\u51fa\u8f83\u5f3a\u6cdb\u5316\u80fd\u529b\uff0c\u5e76\u53d6\u5f97\u591a\u6570\u4efb\u52a1\u7684\u6700\u4f73\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Newton-Schulz (NS) iteration has recently been used in the Muon optimizer to transform update matrices during the training of large language models. Motivated by its spectral effect, we investigate applying NS directly to Transformer attention representations. We introduce Newton-Schulz Attention (NS-Attn.), a parameter-free transformation applied to the output of each attention head. Each head output is arranged as a feature-by-token matrix and normalized by its Frobenius norm. We then apply a finite NS polynomial step and restore the original norm. The objective is to reduce spectral concentration and increase effective rank before standard head merging and output projection. Across ViT and Swin on CIFAR-10 and CIFAR-100, NS-Attn. improves final-epoch accuracy in all 12 matched-seed comparisons, with mean gains of 0.25--0.83 percentage points. ViT ablations show higher mean accuracy with one iteration than with two. Spectral analysis further shows reduced leading-eigenvalue concentration and increased effective rank. These gains incur additional inference latency.", "arxiv_id": "2609.27735", "arxiv_url": "https://arxiv.org/abs/2609.27735", "authors": ["Xiaohe Jiang", "Guoqiang Zhang", "Tianjin Huang", "Ronghui Mu"], "brief": "\u8bba\u6587\u63d0\u51fa NS-Attention\uff0c\u5c06\u65e0\u53c2\u6570\u7684 Newton-Schulz \u591a\u9879\u5f0f\u53d8\u6362\u76f4\u63a5\u4f5c\u7528\u4e8e\u89c6\u89c9 Transformer \u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u7684\u8f93\u51fa\uff0c\u4ee5\u964d\u4f4e\u8c31\u96c6\u4e2d\u5e76\u63d0\u5347\u6709\u6548\u79e9\u3002\u5728 ViT \u548c Swin \u7684 CIFAR-10/100 \u5b9e\u9a8c\u4e2d\uff0c\u6240\u6709 12 \u7ec4\u540c\u79cd\u5b50\u5bf9\u6bd4\u5747\u63d0\u5347\u6700\u7ec8\u7cbe\u5ea6\uff0c\u5e73\u5747\u589e\u76ca\u7ea6 0.25\u20130.83 \u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u4f1a\u589e\u52a0\u63a8\u7406\u5ef6\u8fdf\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27735", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9Transformer", "\u6ce8\u610f\u529b\u673a\u5236", "\u8c31\u5206\u6790", "\u6a21\u578b\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27735v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NS-ATTENTION: Newton-Schulz Transformations of Attention Outputs in Vision Transformers", "tldr": "\u8bba\u6587\u63d0\u51fa NS-Attention\uff0c\u5c06\u65e0\u53c2\u6570\u7684 Newton-Schulz \u591a\u9879\u5f0f\u53d8\u6362\u76f4\u63a5\u4f5c\u7528\u4e8e\u89c6\u89c9 Transformer \u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u7684\u8f93\u51fa\uff0c\u4ee5\u964d\u4f4e\u8c31\u96c6\u4e2d\u5e76\u63d0\u5347\u6709\u6548\u79e9\u3002\u5728 ViT \u548c Swin \u7684 CIFAR-10/100 \u5b9e\u9a8c\u4e2d\uff0c\u6240\u6709 12 \u7ec4\u540c\u79cd\u5b50\u5bf9\u6bd4\u5747\u63d0\u5347\u6700\u7ec8\u7cbe\u5ea6\uff0c\u5e73\u5747\u589e\u76ca\u7ea6 0.25\u20130.83 \u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u4f1a\u589e\u52a0\u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pathology vision-language foundation models vary in performance across diseases and tasks, with no single model consistently performing best. The high cost of expert pathology annotation can also limit the labeled data available for task-specific adaptation. Combining complementary pretrained representations is a potential approach to these limitations, yet learning an effective fusion from few labeled examples remains challenging. We introduce Few-shot Fusion Foundation Models of Computational Pathology (FFM-CP), which is a framework that combines multiple pathology vision-language models in the few-shot learning setting. The framework first aligns heterogeneous representations using a closed-form Orthogonal Procrustes transformation estimated from corresponding support images. This alignment preserves within-model feature geometry without training an additional alignment network. Within the aligned space, a unified graph enables information exchange across backbones by jointly refining support-image features and visual and textual class prototypes. These refined representations support complementary text-prototype and case-retrieval branches that capture semantic class knowledge and within-class visual variation, respectively. Each branch learns to combine predictions from all ordered backbone pairs, allowing queries encoded by one model to draw on evidence represented by another. We evaluate three backbone combinations on six histopathology datasets at 4, 8, and 16 shots per class. FFM-CP achieves higher mean macro-F1 than the strongest individually adapted member of each fused set in 50 of 54 comparisons. These findings suggest that combining complementary pretrained representations can improve histopathological classification when annotations are limited.", "arxiv_id": "2609.27710", "arxiv_url": "https://arxiv.org/abs/2609.27710", "authors": ["Anh-Tien Nguyen", "Trung DQ. Dang", "Nghiem Tuong Diep", "Bui Ngoc Han Nguyen", "Tan-Ha Mai", "Miriam Cindy Maurer", "Phuong Hoa Nguyen", "Thi Thuy Uyen Nguyen", "Youngjun Park", "Daniel Sonntag", "Duy Minh Ho Nguyen", "Anne-Christin Hauschild"], "brief": "\u672c\u6587\u63d0\u51fa FFM-CP\uff0c\u7528\u4e8e\u5c11\u6837\u672c\u8ba1\u7b97\u75c5\u7406\u5206\u7c7b\uff0c\u5c06\u591a\u4e2a\u75c5\u7406\u89c6\u89c9-\u8bed\u8a00\u57fa\u7840\u6a21\u578b\u7684\u8868\u793a\u901a\u8fc7\u95ed\u5f0f\u6b63\u4ea4 Procrustes \u5bf9\u9f50\uff0c\u5e76\u5728\u7edf\u4e00\u56fe\u4e2d\u878d\u5408\u652f\u6301\u6837\u672c\u4e0e\u89c6\u89c9/\u6587\u672c\u7c7b\u522b\u539f\u578b\u3002\u5b83\u57286\u4e2a\u7ec4\u7ec7\u75c5\u7406\u6570\u636e\u96c6\u30014/8/16-shot\u8bbe\u7f6e\u4e0b\uff0c\u76f8\u6bd4\u5404\u878d\u5408\u7ec4\u5408\u4e2d\u6700\u5f3a\u7684\u5355\u6a21\u578b\u9002\u914d\u65b9\u6cd5\u572854\u6b21\u6bd4\u8f83\u4e2d50\u6b21\u53d6\u5f97\u66f4\u9ad8\u5e73\u5747 macro-F1\uff0c\u8bf4\u660e\u8de8\u9aa8\u5e72\u878d\u5408\u80fd\u7f13\u89e3\u6807\u6ce8\u7a00\u7f3a\u4e0b\u5355\u6a21\u578b\u8868\u73b0\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27710", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u75c5\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5c11\u6837\u672c\u5b66\u4e60", "\u6a21\u578b\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27710v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FFM-CP: Cross-Backbone Fusion of Vision-Language Foundation Models for Few-Shot Computational Pathology", "tldr": "\u672c\u6587\u63d0\u51fa FFM-CP\uff0c\u7528\u4e8e\u5c11\u6837\u672c\u8ba1\u7b97\u75c5\u7406\u5206\u7c7b\uff0c\u5c06\u591a\u4e2a\u75c5\u7406\u89c6\u89c9-\u8bed\u8a00\u57fa\u7840\u6a21\u578b\u7684\u8868\u793a\u901a\u8fc7\u95ed\u5f0f\u6b63\u4ea4 Procrustes \u5bf9\u9f50\uff0c\u5e76\u5728\u7edf\u4e00\u56fe\u4e2d\u878d\u5408\u652f\u6301\u6837\u672c\u4e0e\u89c6\u89c9/\u6587\u672c\u7c7b\u522b\u539f\u578b\u3002\u5b83\u57286\u4e2a\u7ec4\u7ec7\u75c5\u7406\u6570\u636e\u96c6\u30014/8/16-shot\u8bbe\u7f6e\u4e0b\uff0c\u76f8\u6bd4\u5404\u878d\u5408\u7ec4\u5408\u4e2d\u6700\u5f3a\u7684\u5355\u6a21\u578b\u9002\u914d\u65b9\u6cd5\u572854\u6b21\u6bd4\u8f83\u4e2d50\u6b21\u53d6\u5f97\u66f4\u9ad8\u5e73\u5747 macro-F1\uff0c\u8bf4\u660e\u8de8\u9aa8\u5e72\u878d\u5408\u80fd\u7f13\u89e3\u6807\u6ce8\u7a00\u7f3a\u4e0b\u5355\u6a21\u578b\u8868\u73b0\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) achieves strong performance in sequential decision-making but remains brittle under dynamic uncertainty and distributional shifts. Robust Adversarial Reinforcement Learning (RARL) improves robustness via worst-case perturbations, but existing approaches frequently suffer from unstable optimization and degraded value estimation. In particular, overly aggressive adversaries can drive the agent toward uninformative failure states, while adversarial perturbations amplify disagreement between double critics and introduce biased value targets. We propose a unified framework, RACER (Risk-sensitive robust Adversarial critic ConsistEncy-regularized Reinforcement learning), that revisits adversarial RL from a risk-sensitive perspective. First, we introduce a state-dependent adversarial objective that adaptively regulates perturbation strength, suppressing harmful disturbances while preserving informative exploration. Second, we propose critic consistency regularization to reduce disagreement between Q-value estimators and stabilize learning. Comprehensive experiments on challenging continuous control benchmarks demonstrate that RACER consistently improves performance, robustness, and training stability over strong robust RL baselines.", "arxiv_id": "2609.27667", "arxiv_url": "https://arxiv.org/abs/2609.27667", "authors": ["Jiaxi Wu", "Tiantian Zhang", "Yuxing Wang", "Yongzhe Chang", "Xueqian Wang"], "brief": "\u672c\u6587\u63d0\u51fa RACER\uff0c\u4e00\u4e2a\u7ed3\u5408\u98ce\u9669\u654f\u611f\u5bf9\u6297\u76ee\u6807\u4e0e critic \u4e00\u81f4\u6027\u6b63\u5219\u7684\u9c81\u68d2\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u80fd\u81ea\u9002\u5e94\u63a7\u5236\u6270\u52a8\u5f3a\u5ea6\u3001\u51cf\u5c11\u53cc Q \u4f30\u8ba1\u5668\u5206\u6b67\uff0c\u5728\u8fde\u7eed\u63a7\u5236\u57fa\u51c6\u4e0a\u63d0\u5347\u6027\u80fd\u3001\u9c81\u68d2\u6027\u4e0e\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27667", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u9c81\u68d2\u5b66\u4e60", "\u98ce\u9669\u654f\u611f", "\u5bf9\u6297\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27667v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robust Adversarial Reinforcement Learning with Risk Sensitivity and Critic Consistency Regularization", "tldr": "\u672c\u6587\u63d0\u51fa RACER\uff0c\u4e00\u4e2a\u7ed3\u5408\u98ce\u9669\u654f\u611f\u5bf9\u6297\u76ee\u6807\u4e0e critic \u4e00\u81f4\u6027\u6b63\u5219\u7684\u9c81\u68d2\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u80fd\u81ea\u9002\u5e94\u63a7\u5236\u6270\u52a8\u5f3a\u5ea6\u3001\u51cf\u5c11\u53cc Q \u4f30\u8ba1\u5668\u5206\u6b67\uff0c\u5728\u8fde\u7eed\u63a7\u5236\u57fa\u51c6\u4e0a\u63d0\u5347\u6027\u80fd\u3001\u9c81\u68d2\u6027\u4e0e\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Private decentralized learning is affected by sampling noise, privacy noise, and decentralized bias under heterogeneous data. We propose Private Recursive Decentralized Optimization (PRDO). PRDO uses recursive estimation with same-batch gradient differences to reduce estimation errors caused by sampling and privacy noise, while its Exact Diffusion component corrects decentralized bias arising from data heterogeneity. Our analysis establishes a nonconvex convergence bound without assuming uniformly bounded data heterogeneity across nodes. It further gives a sufficient condition under which recursive gradient differences yield strictly lower query sensitivity than private Exact Diffusion, together with an example that rigorously satisfies this condition. Experiments show improved accuracy over the evaluated baselines.", "arxiv_id": "2609.27658", "arxiv_url": "https://arxiv.org/abs/2609.27658", "authors": ["Yizhao Fan", "Wenjian Luo", "Jiaojiao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u79c1\u6709\u9012\u5f52\u53bb\u4e2d\u5fc3\u5316\u4f18\u5316\u65b9\u6cd5 PRDO\uff0c\u7528\u540c\u6279\u6b21\u68af\u5ea6\u5dee\u7684\u9012\u5f52\u4f30\u8ba1\u964d\u4f4e\u91c7\u6837\u566a\u58f0\u548c\u9690\u79c1\u566a\u58f0\uff0c\u5e76\u7ed3\u5408 Exact Diffusion \u4fee\u6b63\u5f02\u6784\u6570\u636e\u4e0b\u7684\u53bb\u4e2d\u5fc3\u5316\u504f\u5dee\u3002\u7406\u8bba\u4e0a\u7ed9\u51fa\u975e\u51f8\u6536\u655b\u754c\u4e14\u4e0d\u9700\u5747\u5300\u6709\u754c\u5f02\u6784\u6027\u5047\u8bbe\uff0c\u5e76\u8bc1\u660e\u5728\u4e00\u5b9a\u6761\u4ef6\u4e0b\u67e5\u8be2\u654f\u611f\u5ea6\u4f4e\u4e8e\u79c1\u6709 Exact Diffusion\uff1b\u5b9e\u9a8c\u663e\u793a\u7cbe\u5ea6\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27658", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53bb\u4e2d\u5fc3\u5316\u4f18\u5316", "\u5dee\u5206\u9690\u79c1", "\u975e\u51f8\u4f18\u5316", "\u5f02\u6784\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27658v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Private Decentralized Optimization with Noise Reduction and Bias Correction", "tldr": "\u8bba\u6587\u63d0\u51fa\u79c1\u6709\u9012\u5f52\u53bb\u4e2d\u5fc3\u5316\u4f18\u5316\u65b9\u6cd5 PRDO\uff0c\u7528\u540c\u6279\u6b21\u68af\u5ea6\u5dee\u7684\u9012\u5f52\u4f30\u8ba1\u964d\u4f4e\u91c7\u6837\u566a\u58f0\u548c\u9690\u79c1\u566a\u58f0\uff0c\u5e76\u7ed3\u5408 Exact Diffusion \u4fee\u6b63\u5f02\u6784\u6570\u636e\u4e0b\u7684\u53bb\u4e2d\u5fc3\u5316\u504f\u5dee\u3002\u7406\u8bba\u4e0a\u7ed9\u51fa\u975e\u51f8\u6536\u655b\u754c\u4e14\u4e0d\u9700\u5747\u5300\u6709\u754c\u5f02\u6784\u6027\u5047\u8bbe\uff0c\u5e76\u8bc1\u660e\u5728\u4e00\u5b9a\u6761\u4ef6\u4e0b\u67e5\u8be2\u654f\u611f\u5ea6\u4f4e\u4e8e\u79c1\u6709 Exact Diffusion\uff1b\u5b9e\u9a8c\u663e\u793a\u7cbe\u5ea6\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Solutions based on large language models (LLMs) often rely on temperature sampling to improve accuracy and stability by aggregating multiple samples from the completion distribution. However, this memoryless approach is inherently suboptimal: because it lacks awareness of prior generations and their evaluations, it produces an increasing proportion of semantically duplicate answers as more samples are drawn, leading to diminishing returns. To address this limitation, we introduce FLEET, a novel method that integrates a memory mechanism into the generation process. FLEET represents each generation as a sparse trajectory through states whose entropy exceeds a predefined threshold and uses these trajectories to infer per-token utility scores that adjust the logits. Benchmark evaluations demonstrate that FLEET achieves the same accuracy as the repeated sampling baseline, with a 3x speedup, and substantially improves accuracy on complex coding tasks (LiveCodeBench Pass@32 increases from 59.9% to 66.2%) under the same budget. Furthermore, in the greedy-decoding configuration evaluated here, the approach is deterministic and uses a single calibration pass to derive its principal hyperparameters, requiring only minimal modifications to existing LLM pipelines.", "arxiv_id": "2609.27657", "arxiv_url": "https://arxiv.org/abs/2609.27657", "authors": ["Oleksii Streltsov", "Oleksandra Vitko"], "brief": "\u8bba\u6587\u63d0\u51fa FLEET\uff0c\u5728\u5927\u8bed\u8a00\u6a21\u578b\u751f\u6210\u4e2d\u52a0\u5165\u8bb0\u5fc6\u673a\u5236\uff1a\u5c06\u9ad8\u71b5\u72b6\u6001\u4e0a\u7684\u751f\u6210\u8868\u793a\u4e3a\u7a00\u758f\u8f68\u8ff9\uff0c\u5e76\u636e\u6b64\u4f30\u8ba1\u6bcf\u4e2a token \u7684\u6548\u7528\u6765\u8c03\u6574 logits\u3002\u76f8\u6bd4\u91cd\u590d\u6e29\u5ea6\u91c7\u6837\uff0cFLEET \u53ef\u5728\u76f8\u540c\u51c6\u786e\u7387\u4e0b\u5b9e\u73b0\u7ea6 3 \u500d\u52a0\u901f\uff0c\u5e76\u5728\u590d\u6742\u4ee3\u7801\u4efb\u52a1\u4e0a\u63d0\u5347 Pass@32\uff0859.9% \u5230 66.2%\uff09\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27657", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u751f\u6210", "\u91c7\u6837\u89e3\u7801", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27657v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FLEET: From Logits Entropy to Enhanced Trajectories in Text Generation", "tldr": "\u8bba\u6587\u63d0\u51fa FLEET\uff0c\u5728\u5927\u8bed\u8a00\u6a21\u578b\u751f\u6210\u4e2d\u52a0\u5165\u8bb0\u5fc6\u673a\u5236\uff1a\u5c06\u9ad8\u71b5\u72b6\u6001\u4e0a\u7684\u751f\u6210\u8868\u793a\u4e3a\u7a00\u758f\u8f68\u8ff9\uff0c\u5e76\u636e\u6b64\u4f30\u8ba1\u6bcf\u4e2a token \u7684\u6548\u7528\u6765\u8c03\u6574 logits\u3002\u76f8\u6bd4\u91cd\u590d\u6e29\u5ea6\u91c7\u6837\uff0cFLEET \u53ef\u5728\u76f8\u540c\u51c6\u786e\u7387\u4e0b\u5b9e\u73b0\u7ea6 3 \u500d\u52a0\u901f\uff0c\u5e76\u5728\u590d\u6742\u4ee3\u7801\u4efb\u52a1\u4e0a\u63d0\u5347 Pass@32\uff0859.9% \u5230 66.2%\uff09\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Verified income is often unavailable in digital loan applications, forcing lenders to rely on reported income and potentially leading to over-lending, overly conservative offers, or rejection of creditworthy applicants. Cross-institutional data-sharing constraints make this problem especially difficult for smaller lenders with limited training data. We introduce FedIncome, a federated learning framework for income estimation that enables institutions to train a shared model without pooling raw borrower records. Using more than one million LendingClub loans partitioned into $50$ state-level clients, we simulate a heterogeneous lending consortium. The best federated model achieves out-of-time $R^2=0.608$, compared with $0.619$ for a pooled centralised benchmark. Small-sample clients obtain an average out-of-time $R^2$ improvement of $3.8$ percentage points relative to the pooled centralised benchmark, while the fitted client-level relationship places the empirical crossover at approximately $4,790$ training observations in this setting. When pooling is infeasible and the relevant alternative is local-only training, federation improves out-of-time performance across all sample-size groups, with the largest gains for data-scarce clients. We also combine federated income estimates with state- and income-specific debt-to-income thresholds. In a retrospective decision analysis, replacing reported income with the federated estimate increases simulated approval rates with only modest changes in observed default rates. FedIncome supports collaborative learning under data-locality constraints with little aggregate loss relative to pooled training and larger gains relative to local-only estimation.", "arxiv_id": "2609.27654", "arxiv_url": "https://arxiv.org/abs/2609.27654", "authors": ["Sultan Amed", "Tanmay Sen", "Sayantan Banerjee"], "brief": "\u8bba\u6587\u63d0\u51fa FedIncome\uff0c\u7528\u8054\u90a6\u5b66\u4e60\u5728\u4e0d\u5171\u4eab\u539f\u59cb\u501f\u6b3e\u4eba\u6570\u636e\u7684\u524d\u63d0\u4e0b\uff0c\u8054\u5408\u591a\u5bb6\u673a\u6784\u8bad\u7ec3\u6536\u5165\u4f30\u8ba1\u6a21\u578b\uff0c\u7528\u4e8e\u6570\u5b57\u4fe1\u8d37\u4e2d\u7684\u6536\u5165\u6838\u9a8c\u7f3a\u5931\u95ee\u9898\u3002\u5728 LendingClub \u767e\u4e07\u7ea7\u8d37\u6b3e\u6570\u636e\u7684\u5dde\u7ea7\u5ba2\u6237\u7aef\u6a21\u62df\u4e2d\uff0c\u8054\u90a6\u6a21\u578b\u6027\u80fd\u63a5\u8fd1\u96c6\u4e2d\u5f0f\u8bad\u7ec3\uff0c\u5e76\u663e\u8457\u4f18\u4e8e\u672c\u5730\u5355\u72ec\u8bad\u7ec3\uff0c\u5c24\u5176\u5e2e\u52a9\u5c0f\u6837\u672c\u673a\u6784\uff1b\u7528\u4e8e\u5ba1\u6279\u56de\u6d4b\u65f6\u53ef\u63d0\u9ad8\u6a21\u62df\u901a\u8fc7\u7387\u4e14\u8fdd\u7ea6\u7387\u53d8\u5316\u6709\u9650\u3002", "categories": ["stat.ML", "cs.LG", "q-fin.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27654", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u91d1\u878d\u98ce\u63a7", "\u6536\u5165\u4f30\u8ba1", "\u9690\u79c1\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27654v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FedIncome: Federated Learning for Income Estimation in Digital Lending Under Data Sovereignty Constraints", "tldr": "\u8bba\u6587\u63d0\u51fa FedIncome\uff0c\u7528\u8054\u90a6\u5b66\u4e60\u5728\u4e0d\u5171\u4eab\u539f\u59cb\u501f\u6b3e\u4eba\u6570\u636e\u7684\u524d\u63d0\u4e0b\uff0c\u8054\u5408\u591a\u5bb6\u673a\u6784\u8bad\u7ec3\u6536\u5165\u4f30\u8ba1\u6a21\u578b\uff0c\u7528\u4e8e\u6570\u5b57\u4fe1\u8d37\u4e2d\u7684\u6536\u5165\u6838\u9a8c\u7f3a\u5931\u95ee\u9898\u3002\u5728 LendingClub \u767e\u4e07\u7ea7\u8d37\u6b3e\u6570\u636e\u7684\u5dde\u7ea7\u5ba2\u6237\u7aef\u6a21\u62df\u4e2d\uff0c\u8054\u90a6\u6a21\u578b\u6027\u80fd\u63a5\u8fd1\u96c6\u4e2d\u5f0f\u8bad\u7ec3\uff0c\u5e76\u663e\u8457\u4f18\u4e8e\u672c\u5730\u5355\u72ec\u8bad\u7ec3\uff0c\u5c24\u5176\u5e2e\u52a9\u5c0f\u6837\u672c\u673a\u6784\uff1b\u7528\u4e8e\u5ba1\u6279\u56de\u6d4b\u65f6\u53ef\u63d0\u9ad8\u6a21\u62df\u901a\u8fc7\u7387\u4e14\u8fdd\u7ea6\u7387\u53d8\u5316\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Traffic flow forecasting is essential to intelligent transportation systems. Large-scale traffic forecasting requires jointly modeling local spatial dependencies and cross-region context.Spatial dependencies between geographically neighboring nodes are heterogeneous due to differences in road identity and travel direction, while acquiring global information through allpairs node interactions incurs substantial computational costs. Therefore, capturing local heterogeneity while efficiently acquiring long-range context remains an important challenge in largescale traffic forecasting. To address these challenges, we propose LoReST, a Local-Region Spatial Temporal network that models spatial dependencies at two complementary granularities: node neighborhoods and road network regions. Specifically, relation-aware local aggregation captures heterogeneous dependencies within geographic neighborhoods through road and direction specific feature transformations. Cross-region interaction constructs region representations through mean pooling, exchanges long range context via inter-region attention, and broadcasts it back to nodes. By integrating local information aggregation with crossregion interaction, LoReST is able to effectively achieve spatial dependency learning in large-scale road networks. Experiments on four datasets of the LargeST benchmark show average relative reductions of 4.78%, 3.60%, and 5.75% in MAE, RMSE, and MAPE, respectively.", "arxiv_id": "2609.27637", "arxiv_url": "https://arxiv.org/abs/2609.27637", "authors": ["Qi Feng", "Zidong Wang", "Bo Li", "Xiaoguang Gao", "Jiayu Zhang", "Chenfeng Wang", "Kaifang Wan"], "brief": "\u672c\u6587\u63d0\u51fa LoReST \u7528\u4e8e\u5927\u89c4\u6a21\u4ea4\u901a\u6d41\u9884\u6d4b\uff0c\u540c\u65f6\u5efa\u6a21\u5c40\u90e8\u9053\u8def\u90bb\u57df\u7684\u5f02\u8d28\u7a7a\u95f4\u4f9d\u8d56\u548c\u8de8\u533a\u57df\u957f\u7a0b\u4e0a\u4e0b\u6587\u3002\u65b9\u6cd5\u901a\u8fc7\u5173\u7cfb\u611f\u77e5\u5c40\u90e8\u805a\u5408\u4e0e\u533a\u57df\u7ea7\u6ce8\u610f\u529b\u4ea4\u4e92\u964d\u4f4e\u5168\u5c40\u5efa\u6a21\u6210\u672c\uff0c\u5728 LargeST \u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u76f8\u6bd4\u57fa\u7ebf\u5e73\u5747\u964d\u4f4e MAE 4.78%\u3001RMSE 3.60%\u3001MAPE 5.75%\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27637", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ea4\u901a\u9884\u6d4b", "\u65f6\u7a7a\u5efa\u6a21", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27637v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Local Heterogeneity and Cross-Region Context for Large-Scale Traffic Forecasting", "tldr": "\u672c\u6587\u63d0\u51fa LoReST \u7528\u4e8e\u5927\u89c4\u6a21\u4ea4\u901a\u6d41\u9884\u6d4b\uff0c\u540c\u65f6\u5efa\u6a21\u5c40\u90e8\u9053\u8def\u90bb\u57df\u7684\u5f02\u8d28\u7a7a\u95f4\u4f9d\u8d56\u548c\u8de8\u533a\u57df\u957f\u7a0b\u4e0a\u4e0b\u6587\u3002\u65b9\u6cd5\u901a\u8fc7\u5173\u7cfb\u611f\u77e5\u5c40\u90e8\u805a\u5408\u4e0e\u533a\u57df\u7ea7\u6ce8\u610f\u529b\u4ea4\u4e92\u964d\u4f4e\u5168\u5c40\u5efa\u6a21\u6210\u672c\uff0c\u5728 LargeST \u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u76f8\u6bd4\u57fa\u7ebf\u5e73\u5747\u964d\u4f4e MAE 4.78%\u3001RMSE 3.60%\u3001MAPE 5.75%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "High-throughput single-cell data is now collected across large patient cohorts. Understanding patient-level heterogeneity from cellular-level data motivates phenoscaping: embedding each single-cell distribution as a \"datapoint,\" with distances given by optimal transport (OT). Computing geometry-aware OT at this scale, between all pairs of patient datasets, remains an open challenge, since existing methods either rely on Euclidean ground metrics that distort manifold structure or fail under sparse, unevenly sampled, or large-scale data. We present \\textbf{Pheno-GS} (Phenoscape-scale Geodesic Sinkhorn), which computes accurate, scalable geodesic transport distances under noisy, unbalanced, large-scale settings via three components: ($1$) graph connectivity regularization for well-defined geodesics on sparse/disconnected manifolds; ($2$) an unbalanced OT formulation via KL marginal penalties; and ($3$) a batched matrix algorithm computing all pairwise distances in one heat diffusion (over $200 \\times$ faster than Geodesic Sinkhorn for $500$ distributions). We validate Pheno-GS on synthetic benchmarks and a CyTOF perturbation dataset.", "arxiv_id": "2609.27633", "arxiv_url": "https://arxiv.org/abs/2609.27633", "authors": ["Alistair Wilkinson", "Christopher J. Tape", "Smita Krishnaswamy"], "brief": "\u672c\u6587\u63d0\u51fa Pheno-GS\uff0c\u7528\u4e8e\u5728\u5927\u89c4\u6a21\u5355\u7ec6\u80de\u60a3\u8005\u961f\u5217\u4e2d\u8ba1\u7b97\u5206\u5e03\u95f4\u7684\u51e0\u4f55\u611f\u77e5\u6700\u4f18\u4f20\u8f93\u8ddd\u79bb\uff0c\u4ee5\u652f\u6301\u628a\u6bcf\u4e2a\u60a3\u8005\u7684\u7ec6\u80de\u5206\u5e03\u5d4c\u5165\u4e3a\u8868\u578b\u666f\u89c2\u3002\u65b9\u6cd5\u7ed3\u5408\u56fe\u8fde\u901a\u6027\u6b63\u5219\u3001\u975e\u5e73\u8861\u6700\u4f18\u4f20\u8f93\u548c\u6279\u91cf\u77e9\u9635\u8ba1\u7b97\uff0c\u5728\u7a00\u758f\u3001\u566a\u58f0\u548c\u5927\u89c4\u6a21\u573a\u666f\u4e0b\u66f4\u7a33\u5b9a\uff0c\u5e76\u5728500\u4e2a\u5206\u5e03\u4e0a\u6bd4 Geodesic Sinkhorn \u5feb\u8d85\u8fc7200\u500d\u3002", "categories": ["cs.LG", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27633", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u7ec6\u80de\u5206\u6790", "\u6700\u4f18\u4f20\u8f93", "\u56fe\u5b66\u4e60", "\u751f\u7269\u4fe1\u606f\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27633v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pheno-GS: Phenoscape-scale Geodesic Sinkhorn", "tldr": "\u672c\u6587\u63d0\u51fa Pheno-GS\uff0c\u7528\u4e8e\u5728\u5927\u89c4\u6a21\u5355\u7ec6\u80de\u60a3\u8005\u961f\u5217\u4e2d\u8ba1\u7b97\u5206\u5e03\u95f4\u7684\u51e0\u4f55\u611f\u77e5\u6700\u4f18\u4f20\u8f93\u8ddd\u79bb\uff0c\u4ee5\u652f\u6301\u628a\u6bcf\u4e2a\u60a3\u8005\u7684\u7ec6\u80de\u5206\u5e03\u5d4c\u5165\u4e3a\u8868\u578b\u666f\u89c2\u3002\u65b9\u6cd5\u7ed3\u5408\u56fe\u8fde\u901a\u6027\u6b63\u5219\u3001\u975e\u5e73\u8861\u6700\u4f18\u4f20\u8f93\u548c\u6279\u91cf\u77e9\u9635\u8ba1\u7b97\uff0c\u5728\u7a00\u758f\u3001\u566a\u58f0\u548c\u5927\u89c4\u6a21\u573a\u666f\u4e0b\u66f4\u7a33\u5b9a\uff0c\u5e76\u5728500\u4e2a\u5206\u5e03\u4e0a\u6bd4 Geodesic Sinkhorn \u5feb\u8d85\u8fc7200\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study the problem of computational efficiency for linear bandits in high-dimensional settings with a finite arm set. In linear bandits, the increase in the dimension $d$ of the feature vectors leads to growing computational costs of $O(d^2)$ at each round of update. Traditional sketching-based methods such as SOFUL reduce computation via fixed-size matrix sketching, yet run the risk of incurring vacuous linear regret when the spectral tail of the data is heavy and the sketch size is inadequately selected. To guarantee regret convergence and effectively reduce computational costs, we introduce a clustering mechanism and propose the Cluster Sketch Linear Bandit (CS-LB) algorithm. Our method preserves the full covariance information in each cluster to guarantee robust sublinear regret without spectral-tail vulnerabilities, performs cluster switching by assigning a sentinel for each cluster, and reduces per-round update computation to $O(l^2d)$ via a tunable sketch size $l\u003cd$. Experiments on synthetic datasets demonstrate that our method consistently maintains a favorable trade-off between efficiency and regret.", "arxiv_id": "2609.27594", "arxiv_url": "https://arxiv.org/abs/2609.27594", "authors": ["Hantao Yang", "Hong Xie", "Defu Lian"], "brief": "\u8bba\u6587\u7814\u7a76\u9ad8\u7ef4\u6709\u9650\u81c2\u7ebf\u6027\u8001\u864e\u673a\u7684\u8ba1\u7b97\u6548\u7387\u95ee\u9898\uff0c\u63d0\u51fa Cluster Sketch Linear Bandit\uff08CS-LB\uff09\uff0c\u901a\u8fc7\u805a\u7c7b\u4fdd\u7559\u7c07\u5185\u5b8c\u6574\u534f\u65b9\u5dee\u4fe1\u606f\uff0c\u5e76\u7528\u53ef\u8c03\u8349\u56fe\u964d\u4f4e\u66f4\u65b0\u5f00\u9500\u3002\u8be5\u65b9\u6cd5\u907f\u514d\u4f20\u7edf\u56fa\u5b9a\u8349\u56fe\u5728\u91cd\u8c31\u5c3e\u6570\u636e\u4e0b\u53ef\u80fd\u51fa\u73b0\u7ebf\u6027\u9057\u61be\u7684\u95ee\u9898\uff0c\u5c06\u6bcf\u8f6e\u8ba1\u7b97\u964d\u81f3\u7ea6 O(l^2d)\uff0c\u5b9e\u9a8c\u663e\u793a\u5728\u6548\u7387\u4e0e\u9057\u61be\u4e4b\u95f4\u53d6\u5f97\u8f83\u597d\u6298\u4e2d\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27594", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ebf\u6027\u8001\u864e\u673a", "\u805a\u7c7b", "\u77e9\u9635\u8349\u56fe", "\u5728\u7ebf\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27594v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Efficient Linear Bandits via Cluster-Aware Sketching", "tldr": "\u8bba\u6587\u7814\u7a76\u9ad8\u7ef4\u6709\u9650\u81c2\u7ebf\u6027\u8001\u864e\u673a\u7684\u8ba1\u7b97\u6548\u7387\u95ee\u9898\uff0c\u63d0\u51fa Cluster Sketch Linear Bandit\uff08CS-LB\uff09\uff0c\u901a\u8fc7\u805a\u7c7b\u4fdd\u7559\u7c07\u5185\u5b8c\u6574\u534f\u65b9\u5dee\u4fe1\u606f\uff0c\u5e76\u7528\u53ef\u8c03\u8349\u56fe\u964d\u4f4e\u66f4\u65b0\u5f00\u9500\u3002\u8be5\u65b9\u6cd5\u907f\u514d\u4f20\u7edf\u56fa\u5b9a\u8349\u56fe\u5728\u91cd\u8c31\u5c3e\u6570\u636e\u4e0b\u53ef\u80fd\u51fa\u73b0\u7ebf\u6027\u9057\u61be\u7684\u95ee\u9898\uff0c\u5c06\u6bcf\u8f6e\u8ba1\u7b97\u964d\u81f3\u7ea6 O(l^2d)\uff0c\u5b9e\u9a8c\u663e\u793a\u5728\u6548\u7387\u4e0e\u9057\u61be\u4e4b\u95f4\u53d6\u5f97\u8f83\u597d\u6298\u4e2d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Step Law gives power-law formulas for the optimal peak learning rate eta* and batch size B* when pre-training language models. It was calibrated on models between 59M and 1B parameters; the small-model regime N \u003c 59M was never tested empirically by its authors. This regime matters for single-GPU training, interpretability research, educational experiments, and settings where larger models are infeasible on memory or cost grounds. We test whether Step Law transfers to small language models. We consider three outcomes: H1, the original coefficients work directly; H2, the power-law form holds but with different coefficients; and H3, a power law does not describe the optima in this regime. All experiments use a single nanoGPT/TinyStories pipeline with a 2048-token BPE vocabulary, AdamW, and a warmup-cosine schedule. The optimum for each (N, D) cell is extracted from the loss surface L(eta, B) via a local quadratic approximation in log-log coordinates over the smoothed training loss. The final dataset contains 29 unique (N, D) cells and 935 analysis-ready runs. The main refit uses 25 cells (815 runs) in the working range 4 \u003c= D/N \u003c= 600. On the pooled data we accept H2: the functional form is preserved, but the coefficients differ from the original. We obtain eta*(N, D) = 0.0985 N^(-0.508) D^(0.238) (R^2 = 0.834) and B*(D) = 3.6 x 10^(-4) D^(0.931) (R^2 = 0.950). Step Law\u0027s structural claim that B* is independent of N is reproduced (p = 0.87), but the growth of B* with D is nearly twice as steep as in the original work. Direct transfer of Step Law systematically overestimates the optimal learning rate: the median ratio eta_SL / eta* is approximately 4.0x, with a range of 2.4x to 6.6x.", "arxiv_id": "2609.27581", "arxiv_url": "https://arxiv.org/abs/2609.27581", "authors": ["Egor Romanyukov", "Timofey Novikov", "Timur Shokarov", "Elizaveta Zorkina", "Anastasia Palienko", "Stepan Dergachev"], "brief": "\u672c\u6587\u5b9e\u8bc1\u68c0\u9a8c Step Law \u662f\u5426\u80fd\u8fc1\u79fb\u5230 5900\u4e07\u53c2\u6570\u4ee5\u4e0b\u7684\u5c0f\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u3002\u7ed3\u679c\u8868\u660e\u5e42\u5f8b\u5f62\u5f0f\u4ecd\u6210\u7acb\uff0c\u4f46\u7cfb\u6570\u9700\u8981\u91cd\u65b0\u6821\u51c6\uff1b\u539f\u59cb Step Law \u4f1a\u7cfb\u7edf\u6027\u9ad8\u4f30\u6700\u4f18\u5b66\u4e60\u7387\u7ea64\u500d\uff0c\u540c\u65f6\u6279\u5927\u5c0f\u968f\u6570\u636e\u91cf\u589e\u957f\u66f4\u9661\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27581", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u7f29\u653e\u5b9a\u5f8b", "\u9884\u8bad\u7ec3", "\u8d85\u53c2\u6570"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27581v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Does Step Law Transfer to Small-Scale Language Models? An Empirical Recalibration Below 59M Parameters", "tldr": "\u672c\u6587\u5b9e\u8bc1\u68c0\u9a8c Step Law \u662f\u5426\u80fd\u8fc1\u79fb\u5230 5900\u4e07\u53c2\u6570\u4ee5\u4e0b\u7684\u5c0f\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u3002\u7ed3\u679c\u8868\u660e\u5e42\u5f8b\u5f62\u5f0f\u4ecd\u6210\u7acb\uff0c\u4f46\u7cfb\u6570\u9700\u8981\u91cd\u65b0\u6821\u51c6\uff1b\u539f\u59cb Step Law \u4f1a\u7cfb\u7edf\u6027\u9ad8\u4f30\u6700\u4f18\u5b66\u4e60\u7387\u7ea64\u500d\uff0c\u540c\u65f6\u6279\u5927\u5c0f\u968f\u6570\u636e\u91cf\u589e\u957f\u66f4\u9661\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal joint training often suffers from modality imbalance, where a dominant modality suppresses the optimization of others. Existing methods mainly balance modality learning by modulating gradient magnitudes or directions, modifying optimization objectives, or adjusting training strategies, with most interventions focusing on the current update. However, when combined with widely used momentum-based optimizers, the update also incorporates accumulated information from previous gradients, which is not explicitly addressed by current-step modulation alone. To address this issue, we propose Variance-Calibrated MomentuM (VCMM), which adapts gradient memory to modality-specific gradient dynamics. Specifically, VCMM estimates minibatch noise and temporal drift online and uses their relative strength to determine modality-specific momentum through a Kalman-inspired controller. We further center the control signal across modalities and apply exact bias correction for the time-varying first moment, enabling adaptive gradient memory without extra network passes or explicit learning-rate scaling. Experiments on four multimodal benchmarks demonstrate consistent improvements with modest training overhead.", "arxiv_id": "2609.27577", "arxiv_url": "https://arxiv.org/abs/2609.27577", "authors": ["Zhongjing Gu", "Chenyang Huang", "Yufa Feng", "Chong He", "Qinxu Ding", "Yiming Cui"], "brief": "\u8bba\u6587\u63d0\u51fa VCMM\uff0c\u4e00\u79cd\u9762\u5411\u591a\u6a21\u6001\u8054\u5408\u8bad\u7ec3\u7684\u65b9\u5dee\u6821\u51c6\u52a8\u91cf\u65b9\u6cd5\uff0c\u7528\u4e8e\u7f13\u89e3\u5f3a\u52bf\u6a21\u6001\u538b\u5236\u5f31\u52bf\u6a21\u6001\u4f18\u5316\u7684\u95ee\u9898\u3002\u5b83\u5728\u7ebf\u4f30\u8ba1\u5c0f\u6279\u91cf\u566a\u58f0\u4e0e\u65f6\u95f4\u6f02\u79fb\uff0c\u5e76\u7528\u7c7b Kalman \u63a7\u5236\u5668\u4e3a\u4e0d\u540c\u6a21\u6001\u81ea\u9002\u5e94\u8c03\u6574\u52a8\u91cf\uff0c\u5728\u56db\u4e2a\u591a\u6a21\u6001\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\u4e14\u5f00\u9500\u8f83\u5c0f\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27577", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u4f18\u5316\u5668", "\u52a8\u91cf", "\u6a21\u6001\u5931\u8861"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27577v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VCMM: Variance-Calibrated Momentum for Multimodal Learning", "tldr": "\u8bba\u6587\u63d0\u51fa VCMM\uff0c\u4e00\u79cd\u9762\u5411\u591a\u6a21\u6001\u8054\u5408\u8bad\u7ec3\u7684\u65b9\u5dee\u6821\u51c6\u52a8\u91cf\u65b9\u6cd5\uff0c\u7528\u4e8e\u7f13\u89e3\u5f3a\u52bf\u6a21\u6001\u538b\u5236\u5f31\u52bf\u6a21\u6001\u4f18\u5316\u7684\u95ee\u9898\u3002\u5b83\u5728\u7ebf\u4f30\u8ba1\u5c0f\u6279\u91cf\u566a\u58f0\u4e0e\u65f6\u95f4\u6f02\u79fb\uff0c\u5e76\u7528\u7c7b Kalman \u63a7\u5236\u5668\u4e3a\u4e0d\u540c\u6a21\u6001\u81ea\u9002\u5e94\u8c03\u6574\u52a8\u91cf\uff0c\u5728\u56db\u4e2a\u591a\u6a21\u6001\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\u4e14\u5f00\u9500\u8f83\u5c0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) has emerged as a key paradigm for improving the reasoning capabilities of large language models (LLMs). However, existing reward systems, such as rule-based and reward-model-based, often exhibit issues such as unstable optimization and reward hacking. In this work, we revisit the general reasoning of LLMs from a geometric perspective, conceptualizing it as a coupled manifold composed of three interdependent sub-manifolds: logical deduction, evaluation, and representation. Based on this perspective, response generation in RL can be interpreted as a decoupling process from the evaluation manifold, while reward estimation corresponds to a decoupling process from the logical deduction manifold. The limitations of rule-based and reward-model RL systems can be geometrically interpreted as the mismatch of policy-reward manifolds during RL process. To address the aforementioned misalignment, we propose Decoupling and Coupling Reinforcement Learning (DCRL) framework, which incorporates two key components: (1) a syllogistic logic-based prompt evolution mechanism that dynamically refines reward rubrics to enhance the expressiveness of the reward manifold; and (2) a policy-reward re-coupling mechanism that jointly updates the reward and policy models, ensuring consistent evaluation and mitigating manifold mismatch during training. Theoretical analysis and extensive experiments across multiple reasoning domains demonstrate that DCRL consistently outperforms both rule-based and reward-model baselines. Notably, a Qwen3-4B model trained under DCRL surpasses a Qwen3-32B baseline and approaches the performance of a Qwen3-235B model, highlighting superior effectiveness and generalization in RL.", "arxiv_id": "2609.27572", "arxiv_url": "https://arxiv.org/abs/2609.27572", "authors": ["Henan Sun", "Zehua Li", "Haitao Hu", "Qifan Zhang", "Jianfeng Zhang", "Nuo Chen", "Jia Li"], "brief": "\u672c\u6587\u4ece\u51e0\u4f55\u6d41\u5f62\u89c6\u89d2\u5206\u6790\u5927\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u7b56\u7565\u4e0e\u5956\u52b1\u4e0d\u5339\u914d\u95ee\u9898\uff0c\u5e76\u63d0\u51fa DCRL \u6846\u67b6\uff0c\u901a\u8fc7\u903b\u8f91\u63d0\u793a\u6f14\u5316\u6539\u8fdb\u5956\u52b1\u51c6\u5219\u3001\u8054\u5408\u66f4\u65b0\u5956\u52b1\u6a21\u578b\u4e0e\u7b56\u7565\u6a21\u578b\u6765\u91cd\u65b0\u8026\u5408\u4e8c\u8005\u3002\u5b9e\u9a8c\u663e\u793a DCRL \u5728\u591a\u4e2a\u63a8\u7406\u4efb\u52a1\u4e0a\u4f18\u4e8e\u89c4\u5219\u5956\u52b1\u548c\u5956\u52b1\u6a21\u578b\u57fa\u7ebf\uff0cQwen3-4B \u7ecf\u8bad\u7ec3\u540e\u53ef\u8d85\u8fc7 Qwen3-32B \u5e76\u63a5\u8fd1 Qwen3-235B\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27572", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u5956\u52b1\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27572v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DCRL: Decoupling and Coupling Reinforcement Learning via Policy-Reward Manifold Alignment", "tldr": "\u672c\u6587\u4ece\u51e0\u4f55\u6d41\u5f62\u89c6\u89d2\u5206\u6790\u5927\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u7b56\u7565\u4e0e\u5956\u52b1\u4e0d\u5339\u914d\u95ee\u9898\uff0c\u5e76\u63d0\u51fa DCRL \u6846\u67b6\uff0c\u901a\u8fc7\u903b\u8f91\u63d0\u793a\u6f14\u5316\u6539\u8fdb\u5956\u52b1\u51c6\u5219\u3001\u8054\u5408\u66f4\u65b0\u5956\u52b1\u6a21\u578b\u4e0e\u7b56\u7565\u6a21\u578b\u6765\u91cd\u65b0\u8026\u5408\u4e8c\u8005\u3002\u5b9e\u9a8c\u663e\u793a DCRL \u5728\u591a\u4e2a\u63a8\u7406\u4efb\u52a1\u4e0a\u4f18\u4e8e\u89c4\u5219\u5956\u52b1\u548c\u5956\u52b1\u6a21\u578b\u57fa\u7ebf\uff0cQwen3-4B \u7ecf\u8bad\u7ec3\u540e\u53ef\u8d85\u8fc7 Qwen3-32B \u5e76\u63a5\u8fd1 Qwen3-235B\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The brain does not rely on a single type of neuron to perform all kinds of tasks; instead, it designs different neurons for different tasks. The concept of task-based neurons represents a paradigm shift compared to task-based architectures. It argues that solving a specific problem requires customized neurons, as task-based neurons capture useful prior knowledge from task-related data. To facilitate the use of task-based neurons in scientific research and industrial applications, we introduce TNLearn, an open-source Python package that provides automated construction of task-based neurons and networks, enabling smooth training of task-based networks. Comprehensive documentation, including technical exposition, API reference, and representative examples, is available online. TNLearn is open-sourced at https://github.com/NewT123-WM/tnlearn and has become a PyTorch ecosystem project.", "arxiv_id": "2609.27564", "arxiv_url": "https://arxiv.org/abs/2609.27564", "authors": ["Meng Wang", "Tieyun Li", "Juntong Fan", "Hanyu Pei", "Jing-Xiao Liao", "Yaodong Yang", "Jianwei Ma", "Fenglei Fan"], "brief": "\u672c\u6587\u4ecb\u7ecd\u4e86 TNLearn\uff0c\u4e00\u4e2a\u7528\u4e8e\u4efb\u52a1\u578b\u795e\u7ecf\u5143\u7684\u5f00\u6e90 Python \u5305\uff0c\u53ef\u81ea\u52a8\u6784\u5efa\u4efb\u52a1\u578b\u795e\u7ecf\u5143\u4e0e\u7f51\u7edc\u5e76\u652f\u6301\u5e73\u6ed1\u8bad\u7ec3\u3002\u8be5\u5de5\u5177\u5df2\u5f00\u6e90\u5e76\u7eb3\u5165 PyTorch \u751f\u6001\uff0c\u65e8\u5728\u964d\u4f4e\u4efb\u52a1\u578b\u795e\u7ecf\u5143\u5728\u79d1\u7814\u548c\u5de5\u4e1a\u5e94\u7528\u4e2d\u7684\u4f7f\u7528\u95e8\u69db\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27564", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u7f51\u7edc", "\u4efb\u52a1\u578b\u795e\u7ecf\u5143", "\u6df1\u5ea6\u5b66\u4e60", "\u5f00\u6e90\u5de5\u5177"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27564v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TNLearn: An Open Source Python Package for Task-based Neurons", "tldr": "\u672c\u6587\u4ecb\u7ecd\u4e86 TNLearn\uff0c\u4e00\u4e2a\u7528\u4e8e\u4efb\u52a1\u578b\u795e\u7ecf\u5143\u7684\u5f00\u6e90 Python \u5305\uff0c\u53ef\u81ea\u52a8\u6784\u5efa\u4efb\u52a1\u578b\u795e\u7ecf\u5143\u4e0e\u7f51\u7edc\u5e76\u652f\u6301\u5e73\u6ed1\u8bad\u7ec3\u3002\u8be5\u5de5\u5177\u5df2\u5f00\u6e90\u5e76\u7eb3\u5165 PyTorch \u751f\u6001\uff0c\u65e8\u5728\u964d\u4f4e\u4efb\u52a1\u578b\u795e\u7ecf\u5143\u5728\u79d1\u7814\u548c\u5de5\u4e1a\u5e94\u7528\u4e2d\u7684\u4f7f\u7528\u95e8\u69db\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal learning is emerging as a powerful paradigm for AI for Physics (AI4Physics), where predicting physical systems requires the joint interpretation of heterogeneous observations, measurements, and domain knowledge. However, existing approaches typically represent physical quantities and governing equations as generic numerical or textual tokens, overlooking the physical constraints that determine their spatiotemporal interactions. To address this limitation, we introduce the \\textbf{physical-field modality} and propose \\textbf{PhyMo}, a physics-grounded multimodal framework that organizes heterogeneous measurements through PDE-associated operators. PhyMo follows a three-stage learning procedure: the physical-field encoder is first pretrained through field reconstruction under PDE residual supervision, its representations are subsequently aligned with visual embeddings in a shared latent space, and the fused multimodal representations are finally processed by corresponding downstream prediction heads. Experiments on five datasets spanning diverse physical environments show that PhyMo achieves state-of-the-art performance, compared to the strongest baseline on each dataset, demonstrating the superiority of PhyMo on multimodal representation learning in AI4Physics.", "arxiv_id": "2609.27554", "arxiv_url": "https://arxiv.org/abs/2609.27554", "authors": ["Henan Sun", "Haitao Hu", "Jin Liu", "Jianfeng Zhang", "Lujia Pan", "Nuo Chen", "Jia Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u7269\u7406\u573a\u6a21\u6001\u201d\u4e0e PhyMo \u6846\u67b6\uff0c\u7528 PDE \u76f8\u5173\u7b97\u5b50\u7ec4\u7ec7\u5f02\u6784\u7269\u7406\u6d4b\u91cf\uff0c\u5e76\u901a\u8fc7\u573a\u91cd\u5efa\u9884\u8bad\u7ec3\u3001\u89c6\u89c9\u5bf9\u9f50\u548c\u4e0b\u6e38\u878d\u5408\u9884\u6d4b\u8fdb\u884c\u591a\u6a21\u6001\u5b66\u4e60\u3002\u5728\u4e94\u4e2a\u4e0d\u540c\u7269\u7406\u73af\u5883\u6570\u636e\u96c6\u4e0a\uff0cPhyMo \u76f8\u6bd4\u5404\u81ea\u6700\u5f3a\u57fa\u7ebf\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u663e\u793a\u4e86\u7269\u7406\u7ea6\u675f\u8868\u5f81\u5bf9 AI4Physics \u591a\u6a21\u6001\u5efa\u6a21\u7684\u4f18\u52bf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27554", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "AI4Physics", "\u7269\u7406\u573a", "\u504f\u5fae\u5206\u65b9\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27554v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PhyMo: A Physical-Field Modality for Multimodal AI4Physics", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u7269\u7406\u573a\u6a21\u6001\u201d\u4e0e PhyMo \u6846\u67b6\uff0c\u7528 PDE \u76f8\u5173\u7b97\u5b50\u7ec4\u7ec7\u5f02\u6784\u7269\u7406\u6d4b\u91cf\uff0c\u5e76\u901a\u8fc7\u573a\u91cd\u5efa\u9884\u8bad\u7ec3\u3001\u89c6\u89c9\u5bf9\u9f50\u548c\u4e0b\u6e38\u878d\u5408\u9884\u6d4b\u8fdb\u884c\u591a\u6a21\u6001\u5b66\u4e60\u3002\u5728\u4e94\u4e2a\u4e0d\u540c\u7269\u7406\u73af\u5883\u6570\u636e\u96c6\u4e0a\uff0cPhyMo \u76f8\u6bd4\u5404\u81ea\u6700\u5f3a\u57fa\u7ebf\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u663e\u793a\u4e86\u7269\u7406\u7ea6\u675f\u8868\u5f81\u5bf9 AI4Physics \u591a\u6a21\u6001\u5efa\u6a21\u7684\u4f18\u52bf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Embodied reinforcement learning (RL) improves model capabilities with a pipeline of environment simulation, action generation, and model updates. These stages show heterogeneous CPU and GPU demands, making efficient resource utilization difficult. Recent systems overlap rollout (simulation and generation) with training for efficiency, but exclusive GPU allocation and synchronized barrier in rollout still leave substantial hardware resource waste. In this paper, we present EBRL, an asynchronous embodied RL training system with two core techniques. The asynchronous pipelined scheduler overlaps rollout and training, pipelines simulation and generation across environment groups, and carries out each environment independently, eliminating synchronization stalls. The fine-grained resource manager pools CPU cores and GPU streaming multiprocessors, and uses stage profiles and runtime feedback to adjust resource quotas and batch sizes to meet the shifting demands among stages. We implement EBRL on RLinf and evaluate it with four embodied policies and four simulation benchmarks across heterogeneous GPU testbeds. Experiments show that EBRL achieves 1.30-3.47 times the end-to-end rollout throughput and 2.5 times of training convergency compared to the SOTA embodied RL systems.", "arxiv_id": "2609.27547", "arxiv_url": "https://arxiv.org/abs/2609.27547", "authors": ["Liang Mi", "Weijun Wang", "Bowen Gao", "Tianze Yu", "Zixu Hao", "Han Xiao", "Xin Ding", "Mingzhe Huang", "Xin He", "Lu Shi", "Hao Wu", "Haipeng Dai", "Guihai Chen", "Yunxin Liu", "Ting Cao"], "brief": "\u672c\u6587\u63d0\u51fa EBRL\uff0c\u4e00\u4e2a\u7528\u4e8e\u5177\u8eab\u5f3a\u5316\u5b66\u4e60\u7684\u5f02\u6b65\u8bad\u7ec3\u7cfb\u7edf\uff0c\u901a\u8fc7\u6d41\u6c34\u7ebf\u8c03\u5ea6\u5c06\u4eff\u771f\u3001\u52a8\u4f5c\u751f\u6210\u4e0e\u8bad\u7ec3\u66f4\u5145\u5206\u91cd\u53e0\uff0c\u5e76\u6d88\u9664 rollout \u4e2d\u7684\u540c\u6b65\u7b49\u5f85\u3002\u5176\u7ec6\u7c92\u5ea6\u8d44\u6e90\u7ba1\u7406\u53ef\u52a8\u6001\u5206\u914d CPU \u4e0e GPU \u8d44\u6e90\uff0c\u5728\u591a\u79cd\u7b56\u7565\u548c\u4eff\u771f\u57fa\u51c6\u4e0a\u5c06\u7aef\u5230\u7aef rollout \u541e\u5410\u63d0\u5347 1.30-3.47 \u500d\uff0c\u8bad\u7ec3\u6536\u655b\u901f\u5ea6\u63d0\u5347\u7ea6 2.5 \u500d\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27547", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u5f3a\u5316\u5b66\u4e60", "\u7cfb\u7edf\u4f18\u5316", "\u8d44\u6e90\u8c03\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27547v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EBRL: Asynchronous Embodied RL by Multi-Grained Resource Management", "tldr": "\u672c\u6587\u63d0\u51fa EBRL\uff0c\u4e00\u4e2a\u7528\u4e8e\u5177\u8eab\u5f3a\u5316\u5b66\u4e60\u7684\u5f02\u6b65\u8bad\u7ec3\u7cfb\u7edf\uff0c\u901a\u8fc7\u6d41\u6c34\u7ebf\u8c03\u5ea6\u5c06\u4eff\u771f\u3001\u52a8\u4f5c\u751f\u6210\u4e0e\u8bad\u7ec3\u66f4\u5145\u5206\u91cd\u53e0\uff0c\u5e76\u6d88\u9664 rollout \u4e2d\u7684\u540c\u6b65\u7b49\u5f85\u3002\u5176\u7ec6\u7c92\u5ea6\u8d44\u6e90\u7ba1\u7406\u53ef\u52a8\u6001\u5206\u914d CPU \u4e0e GPU \u8d44\u6e90\uff0c\u5728\u591a\u79cd\u7b56\u7565\u548c\u4eff\u771f\u57fa\u51c6\u4e0a\u5c06\u7aef\u5230\u7aef rollout \u541e\u5410\u63d0\u5347 1.30-3.47 \u500d\uff0c\u8bad\u7ec3\u6536\u655b\u901f\u5ea6\u63d0\u5347\u7ea6 2.5 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Score-based diffusion models are increasingly considered in settings where the underlying data distribution may differ from the training distribution, yet existing theoretical guarantees largely focus on the no-shift setting. In this work, we study robust score estimation under Wasserstein perturbations of a reference distribution. For the Ornstein--Uhlenbeck diffusion, we show that robust estimation decomposes into two fundamental components: the statistical cost of learning the reference distribution and the intrinsic cost of distribution shift. The latter scales quadratically with the Wasserstein radius, and this dependence is minimax optimal. We construct an explicit finite-sample estimator achieving the resulting robust minimax rate without knowing the shift radius. When the reference distribution lies on an unknown low-dimensional subspace, the statistical term adapts to the intrinsic dimension while the shift cost remains unchanged. Finally, we show that the same decomposition governs positive-time reverse sampling and obtain matching minimax guarantees in KL divergence. Together, these results characterize how finite data, intrinsic dimension, and distribution shift affect the robustness of score-based diffusion models.", "arxiv_id": "2609.27546", "arxiv_url": "https://arxiv.org/abs/2609.27546", "authors": ["Wei Luo", "Neil K. Chada", "Shijie Zhang", "Lu Yu"], "brief": "\u672c\u6587\u4ece\u7406\u8bba\u4e0a\u7814\u7a76\u6269\u6563\u6a21\u578b\u5728\u8bad\u7ec3\u5206\u5e03\u4e0e\u6d4b\u8bd5\u5206\u5e03\u5b58\u5728 Wasserstein \u5206\u5e03\u504f\u79fb\u65f6\u7684\u9c81\u68d2\u6027\u3002\u7ed3\u679c\u8868\u660e\u9c81\u68d2\u5f97\u5206\u4f30\u8ba1\u53ef\u5206\u89e3\u4e3a\u5b66\u4e60\u53c2\u8003\u5206\u5e03\u7684\u7edf\u8ba1\u4ee3\u4ef7\u548c\u5206\u5e03\u504f\u79fb\u7684\u5185\u5728\u4ee3\u4ef7\uff0c\u540e\u8005\u968f\u504f\u79fb\u534a\u5f84\u4e8c\u6b21\u589e\u957f\u4e14\u8fbe\u5230\u6781\u5c0f\u6781\u5927\u6700\u4f18\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u5df2\u77e5\u504f\u79fb\u534a\u5f84\u7684\u6709\u9650\u6837\u672c\u4f30\u8ba1\u5668\u3002", "categories": ["math.ST", "cs.LG", "math.PR", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.27546", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5206\u5e03\u504f\u79fb", "\u9c81\u68d2\u6027", "\u7edf\u8ba1\u5b66\u4e60\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.27546v1", "published_at": "2026-09-23", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Robustness of Diffusion Models under Distribution Shift", "tldr": "\u672c\u6587\u4ece\u7406\u8bba\u4e0a\u7814\u7a76\u6269\u6563\u6a21\u578b\u5728\u8bad\u7ec3\u5206\u5e03\u4e0e\u6d4b\u8bd5\u5206\u5e03\u5b58\u5728 Wasserstein \u5206\u5e03\u504f\u79fb\u65f6\u7684\u9c81\u68d2\u6027\u3002\u7ed3\u679c\u8868\u660e\u9c81\u68d2\u5f97\u5206\u4f30\u8ba1\u53ef\u5206\u89e3\u4e3a\u5b66\u4e60\u53c2\u8003\u5206\u5e03\u7684\u7edf\u8ba1\u4ee3\u4ef7\u548c\u5206\u5e03\u504f\u79fb\u7684\u5185\u5728\u4ee3\u4ef7\uff0c\u540e\u8005\u968f\u504f\u79fb\u534a\u5f84\u4e8c\u6b21\u589e\u957f\u4e14\u8fbe\u5230\u6781\u5c0f\u6781\u5927\u6700\u4f18\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u5df2\u77e5\u504f\u79fb\u534a\u5f84\u7684\u6709\u9650\u6837\u672c\u4f30\u8ba1\u5668\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
