const PAPERS = [{"abstract": "In this work, we present Gander, an end-to-end model that unifies omni perception, realtime interaction, and agentic capabilities within a single framework. In contrast to turn-based conventional paradigms, Gander continuously receives streaming inputs across multiple modalities, including video, speech, and text, enabling natural full-duplex interaction in both everyday conversations and complex workflow-oriented agent scenarios. Users can interrupt the model at any time, while the model can also proactively provide intermediate feedback or ask follow up questions. To natively support these capabilities, Gander adopts two key architectural designs: 1) It employs a Cerebellum-Brain collaborative framework, in which the Cerebellum is responsible for realtime interaction and omni conversational capabilities, while the Brain handles complex reasoning and higher-level agentic tasks. The two components interact continuously through tool calling and the agent orchestration runtime. 2) The Cerebellum is built upon a streaming Thinker-Talker architecture, user inputs and model outputs are further flattened into an ordered token stream at the chunk level, providing a unified representation for low latency, continuous interaction. We conduct comprehensive evaluations of Gander across four dimensions: conversational ability, omni understanding, interactive capability, and agentic intelligence. Internal human evaluations demonstrate that Gander maintains the natural and expressive spoken dialogue capabilities of SOTA open source models while achieving competitive performance in omni interaction. Gander also demonstrates robustness in challenging real-world scenarios, including background noise interference, multi-party interactions, and backchannel communication. We release Gander together with its models, code, and data to facilitate further research and development in the community.", "arxiv_id": "2609.08977", "arxiv_url": "https://arxiv.org/abs/2609.08977", "authors": ["Orantqing", "Shengpeng Ji", "Junlong Tong", "Jialong Zuo", "Dongjie Fu", "Di Cao", "Yangzhuo Li", "Shangda Wu", "Franz", "Evan", "Theron Veyra", "Changhao Pan", "Jingyu Lu", "Dongchao Yang", "Zhifei Xie", "Yang Tan", "Xiaoyu Shen", "Xiaoda Yang", "Wenfu Wang", "Teddy Sun", "Steve Yves", "Zhou Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa Gander\uff0c\u4e00\u4e2a\u7edf\u4e00\u5168\u6a21\u6001\u611f\u77e5\u3001\u5b9e\u65f6\u5168\u53cc\u5de5\u5bf9\u8bdd\u4e0e\u667a\u80fd\u4f53\u80fd\u529b\u7684\u7aef\u5230\u7aef\u6846\u67b6\u3002\u5b83\u53ef\u6301\u7eed\u63a5\u6536\u89c6\u9891\u3001\u8bed\u97f3\u3001\u6587\u672c\u6d41\u8f93\u5165\uff0c\u652f\u6301\u7528\u6237\u968f\u65f6\u6253\u65ad\u3001\u6a21\u578b\u4e3b\u52a8\u53cd\u9988\u548c\u590d\u6742\u5de5\u4f5c\u6d41\u4efb\u52a1\u6267\u884c\u3002", "categories": ["eess.AS", "cs.AI", "cs.LG", "cs.MM", "cs.SD"], "github_repo": "https://github.com/Omni-Interaction-Gander/Omni-Interaction-Agent", "github_stars": 137, "hf_url": "https://huggingface.co/papers/2609.08977", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528 Cerebellum-Brain \u534f\u4f5c\u67b6\u6784\uff1aCerebellum \u8d1f\u8d23\u4f4e\u5ef6\u8fdf\u5b9e\u65f6\u4ea4\u4e92\u4e0e\u5168\u6a21\u6001\u5bf9\u8bdd\uff0cBrain \u8d1f\u8d23\u590d\u6742\u63a8\u7406\u548c\u9ad8\u5c42\u667a\u80fd\u4f53\u4efb\u52a1\u3002", "\u57fa\u4e8e\u6d41\u5f0f Thinker-Talker \u67b6\u6784\uff0c\u5c06\u7528\u6237\u8f93\u5165\u548c\u6a21\u578b\u8f93\u51fa\u6309 chunk \u5c55\u5e73\u6210\u6709\u5e8f token stream\uff0c\u4ee5\u7edf\u4e00\u8868\u793a\u652f\u6301\u8fde\u7eed\u4ea4\u4e92\u3002", "\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u4e0e\u667a\u80fd\u4f53\u7f16\u6392\u8fd0\u884c\u65f6\u8fde\u63a5\u4e24\u5927\u7ec4\u4ef6\uff0c\u5e76\u5728\u5bf9\u8bdd\u80fd\u529b\u3001\u5168\u6a21\u6001\u7406\u89e3\u3001\u4ea4\u4e92\u80fd\u529b\u548c\u667a\u80fd\u4f53\u667a\u80fd\u56db\u4e2a\u7ef4\u5ea6\u8fdb\u884c\u8bc4\u6d4b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5b9e\u65f6\u4ea4\u4e92", "\u8bed\u97f3\u5bf9\u8bdd"], "num_comments": 2, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2609.08977v2", "published_at": "2026-09-08", "score": 0.749, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (118\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08977.png", "title": "Omni Interaction Agent Technical Report", "tldr": "\u7aef\u5230\u7aef\u5168\u6a21\u6001\u5b9e\u65f6\u4ea4\u4e92\u667a\u80fd\u4f53Gander", "upvotes": 118, "what_it_is": "\u8bba\u6587\u63d0\u51fa Gander\uff0c\u4e00\u4e2a\u7edf\u4e00\u5168\u6a21\u6001\u611f\u77e5\u3001\u5b9e\u65f6\u5168\u53cc\u5de5\u5bf9\u8bdd\u4e0e\u667a\u80fd\u4f53\u80fd\u529b\u7684\u7aef\u5230\u7aef\u6846\u67b6\u3002\u5b83\u53ef\u6301\u7eed\u63a5\u6536\u89c6\u9891\u3001\u8bed\u97f3\u3001\u6587\u672c\u6d41\u8f93\u5165\uff0c\u652f\u6301\u7528\u6237\u968f\u65f6\u6253\u65ad\u3001\u6a21\u578b\u4e3b\u52a8\u53cd\u9988\u548c\u590d\u6742\u5de5\u4f5c\u6d41\u4efb\u52a1\u6267\u884c\u3002", "why_notable": "Gander \u9762\u5411\u4ece\u56de\u5408\u5f0f\u5bf9\u8bdd\u5230\u8fde\u7eed\u5168\u53cc\u5de5\u4ea4\u4e92\u7684\u8303\u5f0f\u8f6c\u53d8\uff0c\u5c06\u5b9e\u65f6\u8bed\u97f3/\u89c6\u9891\u7406\u89e3\u3001\u81ea\u7136\u5bf9\u8bdd\u548c\u5de5\u5177\u578b\u667a\u80fd\u4f53\u4efb\u52a1\u6574\u5408\u5230\u540c\u4e00\u7cfb\u7edf\uff0c\u5e76\u5f00\u6e90\u6a21\u578b\u3001\u4ee3\u7801\u548c\u6570\u636e\uff0c\u5177\u5907\u8f83\u9ad8\u7814\u7a76\u4e0e\u5de5\u7a0b\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Large language models are increasingly deployed as agents that plan over long horizons and act through external tools. Most agents select actions through unconstrained generation over an accumulating history, leaving implicit the procedural knowledge of what to do, in what order, and under which conditions. As trajectories lengthen, agents can lose track of their objectives, invoke tools out of order, and repeat unproductive actions. We introduce the Procedural Graph: just as a knowledge graph organizes factual knowledge into (entity, relation, entity) triplets for what-is questions, a Procedural Graph organizes procedural knowledge into (procedure, relation, procedure) triplets for what-to-do questions. At each decision step, the framework localizes the agent\u0027s active node, and a guidance model translates the surrounding subgraph into step-level situational guidance that biases the solver\u0027s next action without dictating it. The graph is self-evolving: an LLM refiner contrasts failed trajectories with successful ones and edits the graph\u0027s topology and attributes, committing edits that preserve or improve held-out validation performance while retaining rejected ones to discourage repetition. Starting from a minimal skeleton, the loop builds graphs that match or surpass hand-designed ones. It can also repair a flawed expert prior. Across multiple datasets, task types, and LLMs, the Procedural Graph delivers consistent gains over memory-based baselines, and self-evolution further improves performance without manual engineering.", "arxiv_id": "2609.09153", "arxiv_url": "https://arxiv.org/abs/2609.09153", "authors": ["Yuxing Lu", "Yicheng Chen", "Shanchan Wu", "Sercan \u00d6. Ar\u0131k"], "brief": "\u8bba\u6587\u63d0\u51fa Procedural Graph\uff0c\u7528\u56fe\u7ed3\u6784\u663e\u5f0f\u7ec4\u7ec7\u667a\u80fd\u4f53\u7684\u7a0b\u5e8f\u6027\u77e5\u8bc6\uff0c\u5373\u5728\u4ec0\u4e48\u6761\u4ef6\u4e0b\u6309\u4ec0\u4e48\u987a\u5e8f\u505a\u4ec0\u4e48\u3002\u8be5\u6846\u67b6\u5728\u6bcf\u6b65\u5b9a\u4f4d\u5f53\u524d\u8282\u70b9\u5e76\u751f\u6210\u60c5\u5883\u6307\u5bfc\uff0c\u540c\u65f6\u901a\u8fc7\u5bf9\u6bd4\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u81ea\u52a8\u4fee\u8ba2\u56fe\u7ed3\u6784\uff0c\u5b9e\u73b0\u81ea\u8fdb\u5316\u3002", "categories": ["cs.AI", "cs.CL", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09153", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6d41\u7a0b\u77e5\u8bc6\u8868\u793a\u4e3a\u201cprocedure-relation-procedure\u201d\u4e09\u5143\u7ec4\uff0c\u7c7b\u4f3c\u77e5\u8bc6\u56fe\u8c31\u5bf9\u4e8b\u5b9e\u77e5\u8bc6\u7684\u7ec4\u7ec7\u65b9\u5f0f", "\u6307\u5bfc\u6a21\u578b\u628a\u5f53\u524d\u5b50\u56fe\u8f6c\u5316\u4e3a\u6b65\u9aa4\u7ea7\u5efa\u8bae\uff0c\u5f71\u54cd\u667a\u80fd\u4f53\u4e0b\u4e00\u6b65\u52a8\u4f5c\u4f46\u4e0d\u5f3a\u5236\u89c4\u5b9a", "LLM refiner \u5bf9\u6bd4\u5931\u8d25\u4e0e\u6210\u529f\u8f68\u8ff9\uff0c\u7f16\u8f91\u56fe\u62d3\u6251\u548c\u5c5e\u6027\uff0c\u5e76\u7528\u9a8c\u8bc1\u96c6\u7b5b\u9009\u6709\u6548\u4fee\u6539"], "keywords": ["\u667a\u80fd\u4f53", "\u56fe\u7ed3\u6784", "\u7a0b\u5e8f\u6027\u77e5\u8bc6", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 1, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2609.09153v1", "published_at": "2026-09-08", "score": 0.687, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09153.png", "title": "Procedural Graphs: Self-Evolving Execution Structures for LLM Agents", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u6d41\u7a0b\u56fe\u6765\u7a33\u5065\u6267\u884c\u4efb\u52a1", "upvotes": 23, "what_it_is": "\u8bba\u6587\u63d0\u51fa Procedural Graph\uff0c\u7528\u56fe\u7ed3\u6784\u663e\u5f0f\u7ec4\u7ec7\u667a\u80fd\u4f53\u7684\u7a0b\u5e8f\u6027\u77e5\u8bc6\uff0c\u5373\u5728\u4ec0\u4e48\u6761\u4ef6\u4e0b\u6309\u4ec0\u4e48\u987a\u5e8f\u505a\u4ec0\u4e48\u3002\u8be5\u6846\u67b6\u5728\u6bcf\u6b65\u5b9a\u4f4d\u5f53\u524d\u8282\u70b9\u5e76\u751f\u6210\u60c5\u5883\u6307\u5bfc\uff0c\u540c\u65f6\u901a\u8fc7\u5bf9\u6bd4\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u81ea\u52a8\u4fee\u8ba2\u56fe\u7ed3\u6784\uff0c\u5b9e\u73b0\u81ea\u8fdb\u5316\u3002", "why_notable": "\u5b83\u4e3a\u957f\u7a0bLLM\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u663e\u5f0f\u3001\u53ef\u7ef4\u62a4\u3001\u53ef\u81ea\u52a8\u6539\u8fdb\u7684\u6267\u884c\u7ed3\u6784\uff0c\u7f13\u89e3\u76ee\u6807\u9057\u5fd8\u3001\u5de5\u5177\u4e71\u5e8f\u548c\u91cd\u590d\u65e0\u6548\u52a8\u4f5c\u7b49\u95ee\u9898\uff1b\u4ece\u6700\u5c0f\u9aa8\u67b6\u5373\u53ef\u6f14\u5316\u51fa\u63a5\u8fd1\u6216\u8d85\u8fc7\u4eba\u5de5\u8bbe\u8ba1\u7684\u6d41\u7a0b\u56fe\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce AuK, an open-source foundational model that unifies speech generation and editing through a common interface of natural-language instructions and audio context. To support this broad capability set, we construct approximately 3.03 billion instruction--audio instances and 1.95 million hours of effective supervision across five task families: speech generation, content editing, enhancement and separation, paralinguistic editing, and acoustic editing. AuK combines a multimodal large language model for semantic conditioning, an VAE jointly trained on speech, general audio, and music for acoustic conditioning, and a hybrid rectified-flow Transformer that performs dual-stream MMDiT blocks followed by unified single-stream DiT blocks for generation. Training begins with generation-only warm-up and proceeds to joint generation--editing pre-training. We then apply complementary post-training strategies: human-feedback preference optimization for open-ended editing and reward-based reinforcement learning for speech generation. To reduce inference cost, we further distill the model with consistency initialization and task-routed Decoupled DMD. The resulting AuK-Flash performs 4-step inference without classifier-free guidance and achieves a 4.5 wall-clock speedup over the full model under matched conditions. Experiments demonstrate leading performance on zero-shot and instruction-controlled speech generation and general instruction-guided editing, while remaining competitive on signal-level restoration tasks. We release both the source code and model weights to support reproducibility and further research.", "arxiv_id": "2609.08936", "arxiv_url": "https://arxiv.org/abs/2609.08936", "authors": ["Ziyang Ma", "Zhikang Niu", "Wenming Tu", "Tianrui Wang", "Ruiqi Yan", "Junxi Liu", "Yanru Huo", "Nickk Huang", "Yang Liu", "Qicong Xie", "Zeyu Xie", "Hui Wang", "Haitao Li", "Zixuan Jiang", "Yalin Li", "Jie Fang", "Yifan Duan", "Zeyue Tian", "Guangzheng Li", "Haina Zhu", "Shuyi Wang", "Jinwen Wang", "Mingyu Cui", "Tian Tan", "Auden", "Sen Liang", "Steve Yves", "Shan Yang", "Liefeng Bo", "Zilong Zheng", "Kai Yu", "Eng-Siong Chng", "Xie Chen"], "brief": "AuK \u662f\u4e00\u4e2a\u5f00\u6e90\u8bed\u97f3\u57fa\u7840\u6a21\u578b\uff0c\u7528\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u4e0e\u97f3\u9891\u4e0a\u4e0b\u6587\u7edf\u4e00\u652f\u6301\u8bed\u97f3\u751f\u6210\u548c\u591a\u7c7b\u7f16\u8f91\u4efb\u52a1\u3002\u8bba\u6587\u6784\u5efa\u4e86\u5927\u89c4\u6a21\u6307\u4ee4-\u97f3\u9891\u6570\u636e\uff0c\u5e76\u53d1\u5e03\u4ee3\u7801\u4e0e\u6743\u91cd\u4ee5\u4fc3\u8fdb\u590d\u73b0\u548c\u7814\u7a76\u3002", "categories": ["cs.SD", "cs.CL", "cs.MM"], "github_repo": "https://github.com/Tencent-Hunyuan/AuK", "github_stars": 152, "hf_url": "https://huggingface.co/papers/2609.08936", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u7ea630.3\u4ebf\u4e2a\u6307\u4ee4-\u97f3\u9891\u5b9e\u4f8b\u3001195\u4e07\u5c0f\u65f6\u6709\u6548\u76d1\u7763\uff0c\u8986\u76d6\u8bed\u97f3\u751f\u6210\u3001\u5185\u5bb9\u7f16\u8f91\u3001\u589e\u5f3a\u5206\u79bb\u3001\u526f\u8bed\u8a00\u7f16\u8f91\u548c\u58f0\u5b66\u7f16\u8f91\u4e94\u7c7b\u4efb\u52a1\u3002", "\u6a21\u578b\u7ed3\u5408\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u3001\u8054\u5408\u8bad\u7ec3\u4e8e\u8bed\u97f3/\u901a\u7528\u97f3\u9891/\u97f3\u4e50\u7684 VAE\uff0c\u4ee5\u53ca\u6df7\u5408 rectified-flow Transformer\uff08MMDiT + DiT\uff09\u8fdb\u884c\u751f\u6210\u3002", "\u901a\u8fc7\u4eba\u7c7b\u53cd\u9988\u504f\u597d\u4f18\u5316\u3001\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u548c\u4e00\u81f4\u6027\u521d\u59cb\u5316 + Decoupled DMD \u84b8\u998f\uff0cAuK-Flash \u53ef\u5b9e\u73b04\u6b65\u63a8\u7406\u5e76\u5e26\u67654.5\u500d\u52a0\u901f\u3002"], "keywords": ["\u8bed\u97f3\u751f\u6210", "\u97f3\u9891\u7f16\u8f91", "\u591a\u6a21\u6001", "\u6269\u6563\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2609.08936v1", "published_at": "2026-09-08", "score": 0.613, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (180\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08936.png", "title": "AuK Technical Report: An Open-Source Foundational Model for Speech Generation and Editing", "tldr": "\u5f00\u6e90\u7edf\u4e00\u8bed\u97f3\u751f\u6210\u4e0e\u7f16\u8f91\u57fa\u7840\u6a21\u578b", "upvotes": 180, "what_it_is": "AuK \u662f\u4e00\u4e2a\u5f00\u6e90\u8bed\u97f3\u57fa\u7840\u6a21\u578b\uff0c\u7528\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u4e0e\u97f3\u9891\u4e0a\u4e0b\u6587\u7edf\u4e00\u652f\u6301\u8bed\u97f3\u751f\u6210\u548c\u591a\u7c7b\u7f16\u8f91\u4efb\u52a1\u3002\u8bba\u6587\u6784\u5efa\u4e86\u5927\u89c4\u6a21\u6307\u4ee4-\u97f3\u9891\u6570\u636e\uff0c\u5e76\u53d1\u5e03\u4ee3\u7801\u4e0e\u6743\u91cd\u4ee5\u4fc3\u8fdb\u590d\u73b0\u548c\u7814\u7a76\u3002", "why_notable": "\u5b83\u628a\u8bed\u97f3\u751f\u6210\u3001\u7f16\u8f91\u3001\u589e\u5f3a\u7b49\u80fd\u529b\u7eb3\u5165\u7edf\u4e00\u6307\u4ee4\u63a5\u53e3\uff0c\u5e76\u4ee5\u5f00\u6e90\u5f62\u5f0f\u63d0\u4f9b\u5927\u6a21\u578b\u548c\u6743\u91cd\uff1b\u540c\u65f6\u517c\u987e\u9ad8\u8d28\u91cf\u3001\u53ef\u63a7\u6027\u4e0e\u4f4e\u5ef6\u8fdf\u63a8\u7406\uff0c\u5bf9\u8bed\u97f3\u521b\u4f5c\u3001\u97f3\u9891\u7f16\u8f91\u548c\u7814\u7a76\u590d\u73b0\u90fd\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Advertising video generation is not only a video synthesis task, but also a product-conditioned reasoning problem whose success is measured by online business metrics. Recent video foundation models can generate realistic clips from multimodal conditions, yet they do not optimize how a product should be transformed into an effective advertisement or how future generation should be improved from online business feedback. To close this loop, we propose AgenticGen, a reward-guided agentic framework that decomposes advertising video generation into two trainable reasoning stages, strategy selection and draft generation, thereby exposing optimization targets that online business feedback can supervise. AgenticGen learns a performance-based reward from accumulated online feedback and a complementary rubric-based reward aligned with human quality standards, then uses them to supervise policy optimization. DPO first moves the agentic policies toward online preferences, and GRPO further refines both stages with process and outcome rewards. Offline experiments validate the reward models and successive policy optimization. Online A/B experiments in the TikTok advertising system show that AgenticGen after DPO and GRPO improves CTR by 2.72%, CVR by 2.63%, and Advv by 9.61% over the SFT baseline.", "arxiv_id": "2609.09187", "arxiv_url": "https://arxiv.org/abs/2609.09187", "authors": ["Xingyuan Bu", "Chengru Song", "Hao Zhou", "Tao Zhou", "Dong Li", "Wei Li", "Shilong Li", "Hao Shi", "Yongxin Guo", "Donghao Zhou", "Qiangpeng Yang", "Shilei Wen"], "brief": "AgenticGen \u5c06\u5e7f\u544a\u89c6\u9891\u751f\u6210\u62c6\u89e3\u4e3a\u201c\u7b56\u7565\u9009\u62e9\u201d\u548c\u201c\u8349\u7a3f\u751f\u6210\u201d\u4e24\u4e2a\u53ef\u8bad\u7ec3\u63a8\u7406\u9636\u6bb5\uff0c\u5e76\u7528\u7ebf\u4e0a\u4e1a\u52a1\u53cd\u9988\u4e0e\u4eba\u5de5\u8d28\u91cf\u6807\u51c6\u5171\u540c\u6784\u5efa\u5956\u52b1\u4fe1\u53f7\u3002\u5b83\u901a\u8fc7 DPO \u548c GRPO \u5bf9\u751f\u6210\u7b56\u7565\u8fdb\u884c\u4f18\u5316\uff0c\u4f7f\u89c6\u9891\u751f\u6210\u4e0d\u4ec5\u8ffd\u6c42\u89c6\u89c9\u8d28\u91cf\uff0c\u4e5f\u76f4\u63a5\u9762\u5411\u5e7f\u544a\u6548\u679c\u6307\u6807\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09187", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa reward-guided agentic framework\uff0c\u5c06\u5546\u54c1\u6761\u4ef6\u5e7f\u544a\u89c6\u9891\u751f\u6210\u5efa\u6a21\u4e3a\u53ef\u4f18\u5316\u7684\u4ea7\u54c1\u63a8\u7406\u4e0e\u751f\u6210\u6d41\u7a0b\u3002", "\u7ed3\u5408\u57fa\u4e8e\u7ebf\u4e0a\u53cd\u9988\u7684\u6027\u80fd\u5956\u52b1\u548c\u57fa\u4e8e\u4eba\u5de5\u51c6\u5219\u7684\u8d28\u91cf\u5956\u52b1\uff0c\u540c\u65f6\u76d1\u7763\u8fc7\u7a0b\u5956\u52b1\u4e0e\u7ed3\u679c\u5956\u52b1\u3002", "\u5728 TikTok \u5e7f\u544a\u7cfb\u7edf\u7ebf\u4e0a A/B \u6d4b\u8bd5\u4e2d\uff0c\u76f8\u6bd4 SFT \u57fa\u7ebf CTR \u63d0\u5347 2.72%\uff0cCVR \u63d0\u5347 2.63%\uff0cAdvv \u63d0\u5347 9.61%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u5e7f\u544a\u751f\u6210"], "num_comments": 0, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2609.09187v1", "published_at": "2026-08-31", "score": 0.606, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09187.png", "title": "AgenticGen: Reward-Guided Agentic Video Generation for Advertising", "tldr": "\u7528\u5728\u7ebf\u53cd\u9988\u4f18\u5316\u5e7f\u544a\u89c6\u9891\u751f\u6210\u667a\u80fd\u4f53", "upvotes": 1, "what_it_is": "AgenticGen \u5c06\u5e7f\u544a\u89c6\u9891\u751f\u6210\u62c6\u89e3\u4e3a\u201c\u7b56\u7565\u9009\u62e9\u201d\u548c\u201c\u8349\u7a3f\u751f\u6210\u201d\u4e24\u4e2a\u53ef\u8bad\u7ec3\u63a8\u7406\u9636\u6bb5\uff0c\u5e76\u7528\u7ebf\u4e0a\u4e1a\u52a1\u53cd\u9988\u4e0e\u4eba\u5de5\u8d28\u91cf\u6807\u51c6\u5171\u540c\u6784\u5efa\u5956\u52b1\u4fe1\u53f7\u3002\u5b83\u901a\u8fc7 DPO \u548c GRPO \u5bf9\u751f\u6210\u7b56\u7565\u8fdb\u884c\u4f18\u5316\uff0c\u4f7f\u89c6\u9891\u751f\u6210\u4e0d\u4ec5\u8ffd\u6c42\u89c6\u89c9\u8d28\u91cf\uff0c\u4e5f\u76f4\u63a5\u9762\u5411\u5e7f\u544a\u6548\u679c\u6307\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u9891\u751f\u6210\u4e0e\u771f\u5b9e\u5e7f\u544a\u4e1a\u52a1\u6307\u6807\u95ed\u73af\u8fde\u63a5\u8d77\u6765\uff0c\u5c55\u793a\u4e86\u4ece\u7ebf\u4e0a\u53cd\u9988\u5b66\u4e60\u5956\u52b1\u5e76\u6301\u7eed\u4f18\u5316\u751f\u6210\u7b56\u7565\u7684\u5b9e\u7528\u8def\u5f84\uff0c\u5bf9\u5546\u4e1a\u5316\u751f\u6210\u5f0f\u5e7f\u544a\u548c\u667a\u80fd\u4f53\u5f0f\u5185\u5bb9\u751f\u4ea7\u5177\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Visual generation is evolving from generative models used through a single invocation into agentic control processes that can plan, select tools, inspect intermediate synthesized outputs, revise failures, and reuse prior experience. In most existing systems, the controller is an LLM or VLM, while visual generation models serve as tools or executors. However, existing work lacks a consistent criterion for determining when a generation system becomes agentic. Planning depth, tool use, multi-role collaboration, and reinforcement learning are often treated as evidence of agenticity, even though none of them necessarily determines which generation decisions the controller can make. We organize the field according to what the controller can directly control in the generation process. At L1 Conditioning Control, the controller prepares the input to a predetermined generator but does not control which visual operation is executed. At L2 Execution Control, it selects and invokes actual generation, editing, rendering, or other content-modifying operations. At L3 Outcome-Adaptive Control, it observes an intermediate outcome and uses that observation to change a subsequent operation within the current task. At L4 Experience-Adaptive Control, it retains experience from completed tasks and uses that experience to change decisions on future tasks. L0 Fixed Support separately denotes generators, editors, evaluators, reward models, benchmarks, and fixed pipelines without a deployed controller that makes generation-level decisions. These levels describe a progressively broader decision-making scope rather than model size, system complexity, output quality, tool or role count, or training method. Applying this framework across image, video, editing, 3D, world, slide, and user-interface generation reveals how controller capabilities have evolved and how their mechanisms are distributed across levels.", "arxiv_id": "2609.06758", "arxiv_url": "https://arxiv.org/abs/2609.06758", "authors": ["Yinming Huang", "Shuyuan Tu", "Xi Yan", "Jiahao Zhan", "Zihan Yang", "Zhen Xing", "Hui Zhang", "Tiehua Zhang", "Yu-Gang Jiang", "Zuxuan Wu"], "brief": "\u8fd9\u7bc7\u8bba\u6587\u68b3\u7406\u89c6\u89c9\u751f\u6210\u4ece\u5355\u6b21\u8c03\u7528\u751f\u6210\u6a21\u578b\u8d70\u5411\u667a\u80fd\u4f53\u63a7\u5236\u7684\u6f14\u8fdb\uff0c\u5e76\u63d0\u51fa\u6309\u201c\u63a7\u5236\u5668\u80fd\u76f4\u63a5\u63a7\u5236\u4ec0\u4e48\u201d\u6765\u5b9a\u4e49\u667a\u80fd\u4f53\u5316\u7a0b\u5ea6\u7684\u7edf\u4e00\u6846\u67b6\u3002\u6846\u67b6\u5c06\u7cfb\u7edf\u5212\u5206\u4e3a L0 \u56fa\u5b9a\u652f\u6301\u3001L1 \u6761\u4ef6\u63a7\u5236\u3001L2 \u6267\u884c\u63a7\u5236\u3001L3 \u7ed3\u679c\u81ea\u9002\u5e94\u63a7\u5236\u3001L4 \u7ecf\u9a8c\u81ea\u9002\u5e94\u63a7\u5236\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/YinmingHuang/Awesome-agentic-visual-generation-model", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2609.06758", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6838\u5fc3\u5224\u636e\u4e0d\u662f\u6a21\u578b\u5927\u5c0f\u3001\u5de5\u5177\u6570\u91cf\u3001\u591a\u89d2\u8272\u534f\u4f5c\u6216\u662f\u5426\u4f7f\u7528\u5f3a\u5316\u5b66\u4e60\uff0c\u800c\u662f\u63a7\u5236\u5668\u5728\u751f\u6210\u6d41\u7a0b\u4e2d\u7684\u51b3\u7b56\u8303\u56f4\u3002", "L1 \u5230 L4 \u5206\u522b\u5bf9\u5e94\u8f93\u5165\u6761\u4ef6\u51c6\u5907\u3001\u9009\u62e9\u5e76\u8c03\u7528\u5185\u5bb9\u4fee\u6539\u64cd\u4f5c\u3001\u6839\u636e\u4e2d\u95f4\u7ed3\u679c\u8c03\u6574\u5f53\u524d\u4efb\u52a1\u3001\u5229\u7528\u5386\u53f2\u7ecf\u9a8c\u6539\u8fdb\u672a\u6765\u4efb\u52a1\u3002", "\u8be5\u6846\u67b6\u8986\u76d6\u56fe\u50cf\u3001\u89c6\u9891\u3001\u7f16\u8f91\u30013D\u3001\u4e16\u754c\u6a21\u578b\u3001\u5e7b\u706f\u7247\u548c\u7528\u6237\u754c\u9762\u751f\u6210\u7b49\u591a\u4e2a\u89c6\u89c9\u751f\u6210\u573a\u666f\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u751f\u6210", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2609.06758v1", "published_at": "2026-09-06", "score": 0.545, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06758.png", "title": "Agentic Visual Generation: From Generative Models to Agentic Control", "tldr": "\u63d0\u51fa\u89c6\u89c9\u751f\u6210\u667a\u80fd\u4f53\u63a7\u5236\u5206\u7ea7\u6846\u67b6", "upvotes": 24, "what_it_is": "\u8fd9\u7bc7\u8bba\u6587\u68b3\u7406\u89c6\u89c9\u751f\u6210\u4ece\u5355\u6b21\u8c03\u7528\u751f\u6210\u6a21\u578b\u8d70\u5411\u667a\u80fd\u4f53\u63a7\u5236\u7684\u6f14\u8fdb\uff0c\u5e76\u63d0\u51fa\u6309\u201c\u63a7\u5236\u5668\u80fd\u76f4\u63a5\u63a7\u5236\u4ec0\u4e48\u201d\u6765\u5b9a\u4e49\u667a\u80fd\u4f53\u5316\u7a0b\u5ea6\u7684\u7edf\u4e00\u6846\u67b6\u3002\u6846\u67b6\u5c06\u7cfb\u7edf\u5212\u5206\u4e3a L0 \u56fa\u5b9a\u652f\u6301\u3001L1 \u6761\u4ef6\u63a7\u5236\u3001L2 \u6267\u884c\u63a7\u5236\u3001L3 \u7ed3\u679c\u81ea\u9002\u5e94\u63a7\u5236\u3001L4 \u7ecf\u9a8c\u81ea\u9002\u5e94\u63a7\u5236\u3002", "why_notable": "\u8bba\u6587\u4e3a\u201c\u4f55\u65f6\u89c6\u89c9\u751f\u6210\u7cfb\u7edf\u53ef\u79f0\u4e3a\u667a\u80fd\u4f53\u201d\u63d0\u4f9b\u4e86\u6e05\u6670\u5206\u7c7b\u6807\u51c6\uff0c\u6709\u52a9\u4e8e\u7edf\u4e00 Agentic Visual Generation \u9886\u57df\u7684\u672f\u8bed\u3001\u6bd4\u8f83\u7cfb\u7edf\u80fd\u529b\uff0c\u5e76\u6307\u5bfc\u672a\u6765\u7cfb\u7edf\u8bbe\u8ba1\u3002"}, {"abstract": "We present Miles v0.1, a full-stack, production-ready system for frontier post-training. Building upon the clean design of slime, Miles designs each stage of the reinforcement-learning (RL) training loop around a single principle: components should be verified, clean, and customizable. With accuracy, efficiency, reliability, and scalability as first-class goals, Miles aims to make frontier-scale RL accessible to researchers and enterprises alike. This report walks through the system end to end: rollout engines built on SGLang, a trainer with a choice of two backends (NVIDIA Megatron-LM and PyTorch FSDP), and three weight-synchronization transports for different deployment topologies. Beyond full-parameter RL, Miles also supports LoRA RL, on-policy distillation, supervised fine-tuning, and true-on-policy rollout-training alignment, and extends the same architecture to diffusion models. We close with an end-to-end case study: fully asynchronous agentic RL on a GLM-5.2 744B-A40B model over terminal-use coding tasks, running on 64 NVIDIA GB300 GPUs with a median step time of 263 seconds over the first 30 measured steps. Miles is open-sourced at https://github.com/radixark/miles, with the project website at https://miles.radixark.com.", "arxiv_id": "2609.08368", "arxiv_url": "https://arxiv.org/abs/2609.08368", "authors": ["RadixArk", ":", "Tom Chen", "Mao Cheng", "Shi Dong", "Kangrui Du", "Yanbin Jiang", "Jiajun Li", "Yiming Li", "Tao Lin", "Yusheng Su", "Andy Ye", "Yueming Yuan", "Zhichen Zeng"], "brief": "Miles v0.1 \u662f\u4e00\u4e2a\u5f00\u6e90\u3001\u5168\u6808\u3001\u751f\u4ea7\u5c31\u7eea\u7684\u524d\u6cbf\u6a21\u578b\u540e\u8bad\u7ec3\u7cfb\u7edf\uff0c\u8986\u76d6\u5f3a\u5316\u5b66\u4e60 rollout\u3001\u8bad\u7ec3\u3001\u6743\u91cd\u540c\u6b65\u4e0e\u591a\u79cd\u90e8\u7f72\u5f62\u6001\u3002\u5b83\u652f\u6301\u5168\u53c2\u6570 RL\u3001LoRA RL\u3001\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u3001\u76d1\u7763\u5fae\u8c03\uff0c\u5e76\u6269\u5c55\u5230\u6269\u6563\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/radixark/miles", "github_stars": 2721, "hf_url": "https://huggingface.co/papers/2609.08368", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["rollout \u5f15\u64ce\u57fa\u4e8e SGLang\uff0c\u8bad\u7ec3\u540e\u7aef\u652f\u6301 NVIDIA Megatron-LM \u4e0e PyTorch FSDP", "\u63d0\u4f9b\u4e09\u79cd\u6743\u91cd\u540c\u6b65\u4f20\u8f93\u673a\u5236\uff0c\u9002\u914d\u4e0d\u540c\u8bad\u7ec3\u4e0e\u90e8\u7f72\u62d3\u6251", "\u5c55\u793a\u4e86\u5728 64 \u5f20 NVIDIA GB300 GPU \u4e0a\u5bf9 GLM-5.2 744B-A40B \u8fdb\u884c\u5f02\u6b65\u667a\u80fd\u4f53 RL \u7684\u7aef\u5230\u7aef\u6848\u4f8b"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u540e\u8bad\u7ec3", "\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "RadixArk", "pdf_url": "https://arxiv.org/pdf/2609.08368v1", "published_at": "2026-09-08", "score": 0.525, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (45\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08368.png", "title": "Miles v0.1: Production-Level Post-Training", "tldr": "\u9762\u5411\u524d\u6cbf\u6a21\u578b\u7684\u751f\u4ea7\u7ea7\u540e\u8bad\u7ec3\u7cfb\u7edf", "upvotes": 45, "what_it_is": "Miles v0.1 \u662f\u4e00\u4e2a\u5f00\u6e90\u3001\u5168\u6808\u3001\u751f\u4ea7\u5c31\u7eea\u7684\u524d\u6cbf\u6a21\u578b\u540e\u8bad\u7ec3\u7cfb\u7edf\uff0c\u8986\u76d6\u5f3a\u5316\u5b66\u4e60 rollout\u3001\u8bad\u7ec3\u3001\u6743\u91cd\u540c\u6b65\u4e0e\u591a\u79cd\u90e8\u7f72\u5f62\u6001\u3002\u5b83\u652f\u6301\u5168\u53c2\u6570 RL\u3001LoRA RL\u3001\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u3001\u76d1\u7763\u5fae\u8c03\uff0c\u5e76\u6269\u5c55\u5230\u6269\u6563\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u524d\u6cbf\u5927\u6a21\u578b\u540e\u8bad\u7ec3\u4ece\u7814\u7a76\u539f\u578b\u63a8\u8fdb\u5230\u53ef\u9a8c\u8bc1\u3001\u53ef\u6269\u5c55\u3001\u53ef\u5b9a\u5236\u7684\u751f\u4ea7\u7cfb\u7edf\uff0c\u5c24\u5176\u5bf9\u5927\u89c4\u6a21 RL\u3001\u667a\u80fd\u4f53\u8bad\u7ec3\u548c\u4f01\u4e1a\u7ea7\u6a21\u578b\u5bf9\u9f50\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Speculative decoding accelerates rollout generation, which dominates the cost of reinforcement learning (RL) post-training. Online co-training can further increase the draft\u0027s accuracy, yielding greater speedups. However, scaling this approach to co-training on large models with long contexts poses two obstacles: (1) branch attention is unsupported by standard causal context-parallel (CP) implementations, and (2) target features span across pipeline-parallel (PP) stages. We address both with an end-to-end system for large-scale online draft co-training. For CP, we extend packed, load-balanced zigzag ring attention by merging rank-local branch attention with causal main-sequence attention. For PP, TapChannel transports intermediate target features across stages via a separate path, leaving the pipeline schedule unaffected. Experiments demonstrate that co-trained drafts closely track the policy baseline while delivering substantial rollout and end-to-end speedups across model scales up to 122B. Our CP design achieves strong scaling at 256K tokens with significant memory savings over prior work, and our PP transport incurs modest overhead. Code can be found at https://github.com/NVIDIA-NeMo/RL/issues/3698.", "arxiv_id": "2609.07108", "arxiv_url": "https://arxiv.org/abs/2609.07108", "authors": ["Zili Wang", "Zhaopeng Qiu", "Yuekai Zhang", "Shuang Yu", "Junjie Lai"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u7aef\u5230\u7aef\u7cfb\u7edf\uff0c\u5728\u5927\u89c4\u6a21\u3001\u957f\u4e0a\u4e0b\u6587\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u4e2d\u5bf9 speculative decoding \u7684\u8349\u7a3f\u6a21\u578b\u8fdb\u884c\u5728\u7ebf\u5171\u8bad\u7ec3\u3002\u5b83\u89e3\u51b3\u4e86\u4e0a\u4e0b\u6587\u5e76\u884c\u4e2d\u7684\u5206\u652f\u6ce8\u610f\u529b\u652f\u6301\u95ee\u9898\uff0c\u4ee5\u53ca\u6d41\u6c34\u7ebf\u5e76\u884c\u9636\u6bb5\u95f4\u76ee\u6807\u7279\u5f81\u4f20\u8f93\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07108", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6269\u5c55 packed\u3001\u8d1f\u8f7d\u5747\u8861\u7684 zigzag ring attention\uff0c\u5c06\u672c\u5730\u5206\u652f\u6ce8\u610f\u529b\u4e0e\u56e0\u679c\u4e3b\u5e8f\u5217\u6ce8\u610f\u529b\u5408\u5e76\uff0c\u652f\u6301\u957f\u4e0a\u4e0b\u6587\u4e0a\u4e0b\u6587\u5e76\u884c\u3002", "\u63d0\u51fa TapChannel\uff0c\u5728\u4e0d\u6539\u53d8\u6d41\u6c34\u7ebf\u8c03\u5ea6\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u72ec\u7acb\u901a\u9053\u8de8 PP \u9636\u6bb5\u4f20\u8f93\u76ee\u6807\u6a21\u578b\u4e2d\u95f4\u7279\u5f81\u3002", "\u5b9e\u9a8c\u8986\u76d6\u6700\u9ad8 122B \u53c2\u6570\u6a21\u578b\uff0c\u5728 256K tokens \u4e0a\u5b9e\u73b0\u5f3a\u6269\u5c55\uff0c\u76f8\u6bd4\u65e2\u6709\u65b9\u6cd5\u663e\u8457\u8282\u7701\u5185\u5b58\uff0c\u5e76\u5e26\u6765 rollout \u4e0e\u7aef\u5230\u7aef\u8bad\u7ec3\u52a0\u901f\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u52a0\u901f", "\u957f\u4e0a\u4e0b\u6587", "\u5206\u5e03\u5f0f\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.07108v1", "published_at": "2026-09-07", "score": 0.517, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07108.png", "title": "Online Draft Co-Training for Speculative Decoding in Large-Scale, Long-Context RL Post-Training", "tldr": "\u5927\u89c4\u6a21\u957f\u4e0a\u4e0b\u6587RL\u8bad\u7ec3\u4e2d\u5728\u7ebf\u5171\u8bad\u8349\u7a3f\u6a21\u578b\u52a0\u901f\u63a8\u7406\u3002", "upvotes": 25, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u7aef\u5230\u7aef\u7cfb\u7edf\uff0c\u5728\u5927\u89c4\u6a21\u3001\u957f\u4e0a\u4e0b\u6587\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u4e2d\u5bf9 speculative decoding \u7684\u8349\u7a3f\u6a21\u578b\u8fdb\u884c\u5728\u7ebf\u5171\u8bad\u7ec3\u3002\u5b83\u89e3\u51b3\u4e86\u4e0a\u4e0b\u6587\u5e76\u884c\u4e2d\u7684\u5206\u652f\u6ce8\u610f\u529b\u652f\u6301\u95ee\u9898\uff0c\u4ee5\u53ca\u6d41\u6c34\u7ebf\u5e76\u884c\u9636\u6bb5\u95f4\u76ee\u6807\u7279\u5f81\u4f20\u8f93\u95ee\u9898\u3002", "why_notable": "RL \u540e\u8bad\u7ec3\u7684\u4e3b\u8981\u6210\u672c\u6765\u81ea rollout \u751f\u6210\uff0c\u8be5\u5de5\u4f5c\u628a speculative decoding \u7684\u5728\u7ebf\u8349\u7a3f\u5171\u8bad\u6269\u5c55\u5230\u8d85\u5927\u6a21\u578b\u548c\u957f\u4e0a\u4e0b\u6587\u573a\u666f\uff0c\u5177\u6709\u660e\u663e\u7684\u7cfb\u7edf\u5b9e\u7528\u4ef7\u503c\uff0c\u53ef\u964d\u4f4e\u5927\u89c4\u6a21\u5bf9\u9f50\u8bad\u7ec3\u6210\u672c\u3002"}, {"abstract": "In this paper, we propose ReactVAU, a Slow-Fast Decoupled Framework for real-time streaming Video Anomaly Understanding (VAU). Existing VAU methods rely on offline inference with global temporal sampling, which violates causality and prevents deployment in live surveillance streams. Conversely, general streaming video models satisfy causal access but dilute rare transient anomalies during memory compression and often invoke heavyweight MLLMs uniformly over long normal intervals. React VAU addresses this gap with three synergistic components: a lightweight Fast Detection Module based on Spatial Grid Folding (SGF) for continuous anomaly filtering; an Anomaly-Aware Persistent Memory (AAPM) that protects critical visual cues from temporal decay; and a heavyweight Slow Reasoning Module that remains dormant during normal streams and is awakened only by suspicious events for semantic verification and causal description. Extensive experiments on multiple benchmarks demonstrate that ReactVAU operates under strict streaming constraints while simultaneously achieving competitive performance in both anomaly detection and causal reasoning, alongside significantly enhanced computational efficiency by minimizing heavyweight MLLM invocations. Project page is available at https://huiyuiui.github.io/ReactVAU/", "arxiv_id": "2609.07941", "arxiv_url": "https://arxiv.org/abs/2609.07941", "authors": ["Chia-Hui Chen", "Shih-Ying Yeh", "Fu-En Yang", "Min-Hung Chen", "Shang-Hong Lai"], "brief": "ReactVAU \u63d0\u51fa\u4e00\u79cd\u6162-\u5feb\u89e3\u8026\u7684\u6d41\u5f0f\u89c6\u9891\u5f02\u5e38\u7406\u89e3\u6846\u67b6\uff0c\u5728\u4e25\u683c\u56e0\u679c\u8bbf\u95ee\u4e0b\u540c\u65f6\u505a\u5f02\u5e38\u68c0\u6d4b\u3001\u8bed\u4e49\u9a8c\u8bc1\u4e0e\u56e0\u679c\u63cf\u8ff0\u3002\u5b83\u7528\u8f7b\u91cf\u5feb\u6a21\u5757\u6301\u7eed\u7b5b\u67e5\u5f02\u5e38\uff0c\u53ea\u5728\u53ef\u7591\u4e8b\u4ef6\u51fa\u73b0\u65f6\u5524\u9192\u91cd\u578b\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fdb\u884c\u6162\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/huiyuiui/ReactVAU-code", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.07941", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u57fa\u4e8e Spatial Grid Folding \u7684\u8f7b\u91cf Fast Detection Module\uff0c\u7528\u4e8e\u8fde\u7eed\u6d41\u4e2d\u7684\u9ad8\u6548\u5f02\u5e38\u8fc7\u6ee4\u3002", "\u8bbe\u8ba1 Anomaly-Aware Persistent Memory\uff0c\u9632\u6b62\u7a00\u6709\u77ed\u6682\u5f02\u5e38\u7ebf\u7d22\u5728\u957f\u671f\u8bb0\u5fc6\u538b\u7f29\u4e2d\u88ab\u9057\u5fd8\u3002", "Slow Reasoning Module \u4ec5\u5728\u53ef\u7591\u7247\u6bb5\u89e6\u53d1\u65f6\u8c03\u7528 MLLM\uff0c\u663e\u8457\u51cf\u5c11\u6b63\u5e38\u957f\u89c6\u9891\u4e2d\u7684\u91cd\u578b\u63a8\u7406\u5f00\u9500\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u5f02\u5e38\u68c0\u6d4b", "\u591a\u6a21\u6001", "\u6d41\u5f0f\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.07941v2", "published_at": "2026-09-07", "score": 0.489, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07941.png", "title": "ReactVAU: A Slow-Fast Decoupled Framework for Streaming Video Anomaly Understanding", "tldr": "\u9762\u5411\u5b9e\u65f6\u6d41\u89c6\u9891\u7684\u9ad8\u6548\u5f02\u5e38\u7406\u89e3\u6846\u67b6", "upvotes": 15, "what_it_is": "ReactVAU \u63d0\u51fa\u4e00\u79cd\u6162-\u5feb\u89e3\u8026\u7684\u6d41\u5f0f\u89c6\u9891\u5f02\u5e38\u7406\u89e3\u6846\u67b6\uff0c\u5728\u4e25\u683c\u56e0\u679c\u8bbf\u95ee\u4e0b\u540c\u65f6\u505a\u5f02\u5e38\u68c0\u6d4b\u3001\u8bed\u4e49\u9a8c\u8bc1\u4e0e\u56e0\u679c\u63cf\u8ff0\u3002\u5b83\u7528\u8f7b\u91cf\u5feb\u6a21\u5757\u6301\u7eed\u7b5b\u67e5\u5f02\u5e38\uff0c\u53ea\u5728\u53ef\u7591\u4e8b\u4ef6\u51fa\u73b0\u65f6\u5524\u9192\u91cd\u578b\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fdb\u884c\u6162\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u73b0\u6709\u89c6\u9891\u5f02\u5e38\u7406\u89e3\u65b9\u6cd5\u4f9d\u8d56\u79bb\u7ebf\u5168\u5c40\u91c7\u6837\u3001\u96be\u4ee5\u90e8\u7f72\u5230\u5b9e\u65f6\u76d1\u63a7\u7684\u95ee\u9898\uff0c\u7ed9\u51fa\u517c\u987e\u56e0\u679c\u6027\u3001\u68c0\u6d4b\u6027\u80fd\u3001\u8bed\u4e49\u89e3\u91ca\u4e0e\u8ba1\u7b97\u6548\u7387\u7684\u65b9\u6848\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u9645\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "AI research agents combine prior knowledge, public sources, and experimental feedback to produce useful results. The Discovery Certification Protocol (DCP) turns claims about these results into executable recovery and feedback tests. Gate 1 validates useful improvement on sealed evaluation. Gate 2 gives matched agents the registered starting information and observed Web content while withholding the target research history. Every valid method reaching the numerical target supplies a recovery witness and triggers the Core veto. DCP Core requires adequate controls, zero observed recoveries, and a finite-sample bound on recovery in one fresh registered episode. Optional Gate 3 measures the average effect of truthful feedback relative to a specified neutral policy from a shared checkpoint. DCP Evidence adds this effect after independent null calibration and a registered effect margin. Two controlled audits exercise the complete protocol in SQLite optimization and virtual catalyst control under different models. Each produced zero recoveries in 96 episodes, with an upper bound of 0.0468. Each paired study yielded 30 truthful recoveries and zero neutral recoveries, with passing 60-pair null studies. Additional cases exercise Core, recovered, and audit-incomplete decisions. A deterministic, LLM-free verifier reproduces the decisions from frozen evidence. DCP provides a common evidence language for useful outcomes, alternative routes, and feedback effects across AI research.", "arxiv_id": "2609.09219", "arxiv_url": "https://arxiv.org/abs/2609.09219", "authors": ["Jingjie Ning", "Shanshan Zhong", "Xiaochuan Li", "Ji Zeng"], "brief": "\u8bba\u6587\u63d0\u51fa Discovery Certification Protocol\uff08DCP\uff09\uff0c\u628aAI\u7814\u7a76\u667a\u80fd\u4f53\u7684\u6210\u679c\u4e3b\u5f20\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u7684\u6062\u590d\u6d4b\u8 hed_at": "2026-09-07", "score": 0.471, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09219.png", "title": "Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol for Auditing AI Research Agents", "tldr": "\u63d0\u51fa\u5ba1\u8ba1AI\u7814\u7a76\u667a\u80fd\u4f53\u53d1\u73b0\u6027\u7684\u8ba4\u8bc1\u534f\u8bae", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa Discovery Certification Protocol\uff08DCP\uff09\uff0c\u628aAI\u7814\u7a76\u667a\u80fd\u4f53\u7684\u6210\u679c\u4e3b\u5f20\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u7684\u6062\u590d\u6d4b\u8bd5\u4e0e\u53cd\u9988\u6d4b\u8bd5\uff0c\u7528\u4e8e\u533a\u5206\u201c\u771f\u6b63\u53d1\u73b0\u201d\u4e0e\u4ec5\u51ed\u5206\u6570\u8fbe\u6807\u3002\u4f5c\u8005\u5728 SQLite \u4f18\u5316\u548c\u865a\u62df\u50ac\u5316\u5242\u63a7\u5236\u4e24\u7c7b\u4efb\u52a1\u4e0a\u8fdb\u884c\u4e86\u53d7\u63a7\u5ba1\u8ba1\uff0c\u5e76\u63d0\u4f9b\u53ef\u590d\u73b0\u7684\u786e\u5b9a\u6027\u9a8c\u8bc1\u5668\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aAI\u7814\u7a76\u667a\u80fd\u4f53\u7684\u201c\u53d1\u73b0\u201d\u4e3b\u5f20\u63d0\u4f9b\u4e86\u6bd4\u5355\u7eaf\u6027\u80fd\u5206\u6570\u66f4\u4e25\u683c\u7684\u8bc1\u636e\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u5ba1\u8ba1\u81ea\u52a8\u79d1\u7814\u7cfb\u7edf\u662f\u5426\u53ea\u662f\u5229\u7528\u5df2\u6709\u8def\u5f84\u3001\u63d0\u793a\u6cc4\u6f0f\u6216\u66ff\u4ee3\u8def\u7ebf\u8fbe\u6807\uff0c\u5e76\u63d0\u5347AI\u79d1\u7814\u6210\u679c\u8bc4\u4f30\u7684\u53ef\u590d\u73b0\u6027\u4e0e\u53ef\u4fe1\u5ea6\u3002"}, {"abstract": "We present \u0027RenderFormer-V2\u0027, a unified learned transformer-based neural rendering model, complementary to modern physics-based rendering systems, that can handle diverse light-transport effects such as caustics, volumetric scattering, environment lighting, textured and displaced surfaces and out-of-distribution materials without per-scene training or specialized code. RenderFormer-V2 models global light transport as a sequence-to-sequence transformation. Following its predecessor, RenderFormer-V2 also employs a two stage process: a view-independent stage that resolves intra-scene primitive to primitive transport, and a view-dependent stage that transforms the internal neural scene representation into image pixels. Different from RenderFormer, our model employs a novel combined windowed-attention and rendering-informed attention sink in the view-independent stage to improve scalability while maintaining render accuracy. To further improve versatility, RenderFormerV2 supports heterogeneous scene primitives, including environment maps and participating media, and it employs a material encoding independent of the underlying surface reflectance model that encodes material appearance via a novel neural embedding. We demonstrate the versatility of RenderFormer-V2 on a variety of scenes and perform an extensive ablation of the improved attention mechanism.", "arxiv_id": "2609.05738", "arxiv_url": "https://arxiv.org/abs/2609.05738", "authors": ["Chong Zeng", "Yue Dong", "Pieter Peers", "Lvmin Zhang", "Maneesh Agrawala"], "brief": "RenderFormer-V2 \u662f\u4e00\u4e2a\u57fa\u4e8e Transformer \u7684\u7edf\u4e00\u795e\u7ecf\u6e32\u67d3\u6a21\u578b\uff0c\u5c06\u5168\u5c40\u5149\u4f20\u8f93\u5efa\u6a21\u4e3a\u5e8f\u5217\u5230\u5e8f\u5217\u53d8\u6362\u3002\u5b83\u65e0\u9700\u9010\u573a\u666f\u8bad\u7ec3\u6216\u4e13\u7528\u4ee3\u7801\uff0c\u53ef\u5904\u7406\u7126\u6563\u3001\u4f53\u6563\u5c04\u3001\u73af\u5883\u5149\u3001\u7eb9\u7406/\u4f4d\u79fb\u8868\u9762\u548c\u5206\u5e03\u5916\u6750\u8d28\u7b49\u590d\u6742\u6548\u679c\u3002", "categories": ["cs.CV", "cs.GR", "cs.LG"], "github_repo": "https://github.com/iamNCJ/RenderFormer-Studio", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.05738", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u4e24\u9636\u6bb5\u6e32\u67d3\u6d41\u7a0b\uff1a\u89c6\u89d2\u65e0\u5173\u9636\u6bb5\u89e3\u6790\u573a\u666f\u57fa\u5143\u95f4\u5149\u4f20\u8f93\uff0c\u89c6\u89d2\u76f8\u5173\u9636\u6bb5\u5c06\u5185\u90e8\u795e\u7ecf\u573a\u666f\u8868\u793a\u8f6c\u6362\u4e3a\u56fe\u50cf\u50cf\u7d20\u3002", "\u63d0\u51fa\u7ed3\u5408\u7a97\u53e3\u6ce8\u610f\u529b\u4e0e\u6e32\u67d3\u611f\u77e5 attention sink \u7684\u673a\u5236\uff0c\u5728\u63d0\u5347\u53ef\u6269\u5c55\u6027\u7684\u540c\u65f6\u4fdd\u6301\u6e32\u67d3\u7cbe\u5ea6\u3002", "\u652f\u6301\u5f02\u6784\u573a\u666f\u57fa\u5143\uff0c\u5305\u62ec\u73af\u5883\u8d34\u56fe\u548c\u53c2\u4e0e\u4ecb\u8d28\uff0c\u5e76\u7528\u72ec\u7acb\u4e8e\u5177\u4f53\u53cd\u5c04\u6a21\u578b\u7684\u795e\u7ecf\u6750\u8d28\u5d4c\u5165\u7f16\u7801\u5916\u89c2\u3002"], "keywords": ["\u795e\u7ecf\u6e32\u67d3", "Transformer", "\u56fe\u5f62\u5b66", "\u5149\u4f20\u8f93"], "num_comments": 2, "on_hf": true, "organization": "Stanford AI", "pdf_url": "https://arxiv.org/pdf/2609.05738v1", "published_at": "2026-09-04", "score": 0.467, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05738.png", "title": "RenderFormer-V2: Neural Rendering with Heterogeneous Scene Primitives", "tldr": "\u7edf\u4e00Transformer\u795e\u7ecf\u6e32\u67d3\u591a\u7c7b\u590d\u6742\u5149\u4f20\u8f93", "upvotes": 2, "what_it_is": "RenderFormer-V2 \u662f\u4e00\u4e2a\u57fa\u4e8e Transformer \u7684\u7edf\u4e00\u795e\u7ecf\u6e32\u67d3\u6a21\u578b\uff0c\u5c06\u5168\u5c40\u5149\u4f20\u8f93\u5efa\u6a21\u4e3a\u5e8f\u5217\u5230\u5e8f\u5217\u53d8\u6362\u3002\u5b83\u65e0\u9700\u9010\u573a\u666f\u8bad\u7ec3\u6216\u4e13\u7528\u4ee3\u7801\uff0c\u53ef\u5904\u7406\u7126\u6563\u3001\u4f53\u6563\u5c04\u3001\u73af\u5883\u5149\u3001\u7eb9\u7406/\u4f4d\u79fb\u8868\u9762\u548c\u5206\u5e03\u5916\u6750\u8d28\u7b49\u590d\u6742\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5b66\u4e60\u5f0f\u795e\u7ecf\u6e32\u67d3\u6269\u5c55\u5230\u66f4\u590d\u6742\u3001\u66f4\u901a\u7528\u7684\u7269\u7406\u6e32\u67d3\u573a\u666f\uff0c\u6709\u671b\u4f5c\u4e3a\u4f20\u7edf\u7269\u7406\u6e32\u67d3\u7cfb\u7edf\u7684\u8865\u5145\uff0c\u5728\u4fdd\u6301\u7075\u6d3b\u6027\u7684\u540c\u65f6\u51cf\u5c11\u9488\u5bf9\u7279\u5b9a\u573a\u666f\u548c\u6750\u8d28\u7684\u624b\u5de5\u5de5\u7a0b\u3002"}, {"abstract": "Diverse and simulation-ready indoor scenes are essential for interactive entertainment and embodied AI, yet their scalable generation remains challenging. Recent agentic text-to-3D scene pipelines that rely on vision-language models (VLMs) can generate scenes of high fidelity but require costly iterative object placement and refinement. Another mainstream paradigm, parametric image-to-3D scene models, produces scenes efficiently from strong priors learned from 2D images but often leads to imprecise and physically invalid scenes. More importantly, both paradigms struggle to output diverse scenes for a single input, making it hard for them to reflect the dynamically changing nature of real scenes. In this paper we propose \\textbf{SceneMosaic}, a framework that combines the merits of both paradigms. It obtains the initial candidate from the learned image-based prior, and subsequently evolves the result through VLM agents, ensuring both efficiency and physical validity. Within the evolution process, SceneMosaic exploits the locality of natural scenes and decomposes a scene into independent local units, allowing separate evolution within each unit before composing the global scene via Cartesian product. On SceneEval-100, SceneMosaic matches the strongest agentic baseline in semantic layout quality with a 24x speedup, substantially reduces physical violations, and receives the highest human ratings. Our code is publicly available at https://github.com/rxjfighting/SceneMosaic.", "arxiv_id": "2609.05594", "arxiv_url": "https://arxiv.org/abs/2609.05594", "authors": ["Xingjian Ran", "Xiaoye Mo", "Sihao Liu", "Jianyu Zhang", "Li Luo", "Bo Dai"], "brief": "SceneMosaic \u662f\u4e00\u4e2a\u5ba4\u5185 3D \u573a\u666f\u751f\u6210\u6846\u67b6\uff0c\u5148\u5229\u7528\u56fe\u50cf\u52303D\u7684\u53c2\u6570\u5316\u6a21\u578b\u5feb\u901f\u7ed9\u51fa\u521d\u59cb\u5e03\u5c40\uff0c\u518d\u901a\u8fc7 VLM \u667a\u80fd\u4f53\u6f14\u5316\u4f18\u5316\uff0c\u4f7f\u573a\u666f\u517c\u5177\u6548\u7387\u3001\u8bed\u4e49\u8d28\u91cf\u4e0e\u7269\u7406\u6709\u6548\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/rxjfighting/SceneMosaic", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2609.05594", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u6df7\u5408\u8303\u5f0f\uff1a\u7ed3\u5408\u56fe\u50cf\u5148\u9a8c\u7684\u9ad8\u6548\u751f\u6210\u4e0e VLM \u667a\u80fd\u4f53\u7684\u5e03\u5c40\u63a8\u7406\u548c\u4fee\u6b63\u80fd\u529b\u3002", "\u5c06\u81ea\u7136\u573a\u666f\u5206\u89e3\u4e3a\u76f8\u5bf9\u72ec\u7acb\u7684\u5c40\u90e8\u5355\u5143\uff0c\u5206\u522b\u6f14\u5316\u540e\u901a\u8fc7\u7b1b\u5361\u5c14\u79ef\u7ec4\u5408\uff0c\u63d0\u5347\u5355\u8f93\u5165\u4e0b\u7684\u591a\u6837\u6027\u3002", "\u5728 SceneEval-100 \u4e0a\u8fbe\u5230\u6700\u5f3a\u667a\u80fd\u4f53\u57fa\u7ebf\u7684\u8bed\u4e49\u5e03\u5c40\u8d28\u91cf\uff0c\u540c\u65f6\u5b9e\u73b0 24 \u500d\u52a0\u901f\uff0c\u5e76\u663e\u8457\u51cf\u5c11\u7269\u7406\u8fdd\u89c4\u3002"], "keywords": ["\u667a\u80fd\u4f53", "3D\u751f\u6210", "\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "The University of Hong Kong", "pdf_url": "https://arxiv.org/pdf/2609.05594v1", "published_at": "2026-09-04", "score": 0.459, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (41\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05594.png", "title": "SceneMosaic: Efficient and Diverse Simulation-Ready Scene Generation via Hybrid Agentic Layout Evolution", "tldr": "\u7528VLM\u667a\u80fd\u4f53\u9ad8\u6548\u751f\u6210\u591a\u6837\u53ef\u4eff\u771f\u7684\u5ba4\u5185\u573a\u666f", "upvotes": 41, "what_it_is": "SceneMosaic \u662f\u4e00\u4e2a\u5ba4\u5185 3D \u573a\u666f\u751f\u6210\u6846\u67b6\uff0c\u5148\u5229\u7528\u56fe\u50cf\u52303D\u7684\u53c2\u6570\u5316\u6a21\u578b\u5feb\u901f\u7ed9\u51fa\u521d\u59cb\u5e03\u5c40\uff0c\u518d\u901a\u8fc7 VLM \u667a\u80fd\u4f53\u6f14\u5316\u4f18\u5316\uff0c\u4f7f\u573a\u666f\u517c\u5177\u6548\u7387\u3001\u8bed\u4e49\u8d28\u91cf\u4e0e\u7269\u7406\u6709\u6548\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7f13\u89e3\u4e86\u73b0\u6709\u6587\u672c\u52303D\u573a\u666f\u751f\u6210\u5728\u6210\u672c\u3001\u7269\u7406\u5408\u7406\u6027\u548c\u591a\u6837\u6027\u4e4b\u95f4\u7684\u77db\u76fe\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u3001\u4eff\u771f\u73af\u5883\u6784\u5efa\u548c\u4ea4\u4e92\u5a31\u4e50\u4e2d\u7684\u5927\u89c4\u6a21\u573a\u666f\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Foundation vision-language models (VLMs) exhibit broad intelligence about the world, yet translating this intelligence into robot control remains challenging. We present Show-Harness, an Embodied Harness that enables VLMs to \"play\" robots through a compact semantic interface linking intent to action. Show-Harness exposes discrete semantic action units that VLMs can naturally reason over, while embodiment-specific interpreters deterministically ground them into local robot actions, keeping the VLM directly responsible for fine-grained physical decisions. Through the same interface, Show-Harness demonstrates the feasibility of (1) directly unlocking closed-source frontier VLMs for zero-shot robot control, and (2) adapting small-scale open-source VLMs for low-cost deployment with just a few GPU-hours of fine-tuning. We further develop GUMI (GUI Manipulation Interface), which extends the same semantic action space to GUI-based demonstration collection, allowing humans and agents to \"play\" robots across embodiments without specialized teleoperation hardware. Extensive experiments show that Show-Harness-equipped VLM agents generalize robustly across tasks, embodiments, and environments, outperforming representative agentic and VLA paradigms. These results suggest that the right interface can unlock substantial embodied capability from foundation VLMs, without requiring additional model capacity or costly embodiment-specific pretraining.", "arxiv_id": "2609.10522", "arxiv_url": "https://arxiv.org/abs/2609.10522", "authors": ["Yanzhe Chen", "Zechen Bai", "Zhijun Cao", "Wenzheng Zeng", "Kevin Qinghong Lin", "Yiqi Lin", "Guoqiang Liang", "Kevin Yuchen Ma", "Qiming Huang", "Mike Zheng Shou"], "brief": "\u8bba\u6587\u63d0\u51fa Show-Harness\uff0c\u4e00\u79cd\u5177\u8eab\u63a7\u5236\u63a5\u53e3\uff0c\u5c06 VLM \u7684\u610f\u56fe\u6620\u5c04\u5230\u79bb\u6563\u8bed\u4e49\u52a8\u4f5c\u5355\u5143\uff0c\u518d\u7531\u4e0d\u540c\u673a\u5668\u4eba\u89e3\u91ca\u5668\u843d\u5730\u4e3a\u5177\u4f53\u52a8\u4f5c\u3002\u5b83\u8fd8\u63d0\u51fa GUMI\uff0c\u4f7f\u4eba\u7c7b\u6216\u667a\u80fd\u4f53\u53ef\u901a\u8fc7 GUI \u6536\u96c6\u8de8\u5177\u8eab\u6f14\u793a\u6570\u636e\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.MM"], "github_repo": "https://github.com/showlab/Show-Harness", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.10522", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u7d27\u51d1\u7684\u8bed\u4e49\u52a8\u4f5c\u7a7a\u95f4\uff0c\u8ba9\u95ed\u6e90\u524d\u6cbf VLM \u53ef\u76f4\u63a5\u8fdb\u884c\u96f6\u6837\u672c\u673a\u5668\u4eba\u63a7\u5236", "\u5c0f\u89c4\u6a21\u5f00\u6e90 VLM \u4ec5\u9700\u5c11\u91cf GPU \u5c0f\u65f6\u5fae\u8c03\u5373\u53ef\u4f4e\u6210\u672c\u9002\u914d\u90e8\u7f72", "\u5728\u4efb\u52a1\u3001\u673a\u5668\u4eba\u5f62\u6001\u548c\u73af\u5883\u6cdb\u5316\u4e0a\u4f18\u4e8e\u4ee3\u8868\u6027\u7684\u667a\u80fd\u4f53\u4e0e VLA \u65b9\u6cd5"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u63a7\u5236", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "Show Lab", "pdf_url": "https://arxiv.org/pdf/2609.10522v1", "published_at": "2026-09-09", "score": 0.447, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.10522.png", "title": "Show-Harness: Just a VLM Agent Can Play Robots", "tldr": "\u7528\u8bed\u4e49\u63a5\u53e3\u8ba9VLM\u96f6\u6837\u672c\u64cd\u63a7\u673a\u5668\u4eba", "upvotes": 21, "what_it_is": "\u8bba\u6587\u63d0\u51fa Show-Harness\uff0c\u4e00\u79cd\u5177\u8eab\u63a7\u5236\u63a5\u53e3\uff0c\u5c06 VLM \u7684\u610f\u56fe\u6620\u5c04\u5230\u79bb\u6563\u8bed\u4e49\u52a8\u4f5c\u5355\u5143\uff0c\u518d\u7531\u4e0d\u540c\u673a\u5668\u4eba\u89e3\u91ca\u5668\u843d\u5730\u4e3a\u5177\u4f53\u52a8\u4f5c\u3002\u5b83\u8fd8\u63d0\u51fa GUMI\uff0c\u4f7f\u4eba\u7c7b\u6216\u667a\u80fd\u4f53\u53ef\u901a\u8fc7 GUI \u6536\u96c6\u8de8\u5177\u8eab\u6f14\u793a\u6570\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u201c\u63a5\u53e3\u8bbe\u8ba1\u201d\u800c\u975e\u6269\u5927\u6a21\u578b\u6216\u5927\u89c4\u6a21\u5177\u8eab\u9884\u8bad\u7ec3\uff0c\u5c31\u80fd\u91ca\u653e\u57fa\u7840 VLM \u7684\u673a\u5668\u4eba\u63a7\u5236\u80fd\u529b\uff0c\u5bf9\u4f4e\u6210\u672c\u901a\u7528\u673a\u5668\u4eba\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Language Models demonstrate remarkable proficiency in static reasoning, yet training them as autonomous agents through Reinforcement Learning (RL) for long-horizon tasks is often hindered by severe reward sparsity. While conventional \\textit{agent-side warming} up via supervised fine-tuning (SFT) can alleviate this, it is frequently limited by data scarcity and constrained exploration. To address this, we propose a paradigm shift to \\textit{environment-side adaptation} by constructing \\textbf{F}eedback-\\textbf{E}nriched \\textbf{E}nvironments (\\textbf{FEEs}). Through a pilot study, we establish a feedback design strategy that reformulates environments by transitioning from action guidance to observation enrichment during the later stages of both intra-episode exploration and inter-episode evolution. Large-scale experiments on SciWorld and BFCL benchmarks using various Qwen3 model scales and RL algorithms such as GRPO, GSPO, and DAPO demonstrate that FEEs consistently yield performance improvements over standard settings. Furthermore, our analysis reveals that training with FEEs \\textbf{(1)} stabilizes training dynamics by reducing entropy volatility, \\textbf{(2)} facilitates proactive state-space exploration in difficult tasks, \\textbf{(3) }ensures the internalization of environmental guidance into policy weights rather than acting as a mere inference-time prior, and \\textbf{(4) }identifies intra-group feedback consistency as a critical boundary for stable optimization.", "arxiv_id": "2609.08404", "arxiv_url": "https://arxiv.org/abs/2609.08404", "authors": ["Hongbang Yuan", "Zhuoran Jin", "Yixin Cao"], "brief": "\u8bba\u6587\u63d0\u51fa\u4ece\u201c\u667a\u80fd\u4f53\u4fa7\u9884\u70ed\u201d\u8f6c\u5411\u201c\u73af\u5883\u4fa7\u9002\u914d\u201d\uff0c\u6784\u5efa\u53cd\u9988\u589e\u5f3a\u73af\u5883\uff08FEEs\uff09\u6765\u4e3a\u957f\u7a0b\u4efb\u52a1\u4e2d\u7684LLM\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u4e30\u5bcc\u7684\u8bad\u7ec3\u53cd\u9988\u3002\u5176\u6838\u5fc3\u7b56\u7565\u662f\u5728\u63a2\u7d22\u540e\u671f\u4ece\u76f4\u63a5\u52a8\u4f5c\u6307\u5bfc\u8f6c\u4e3a\u89c2\u5bdf\u4fe1\u606f\u589e\u5f3a\uff0c\u5e2e\u52a9\u6a21\u578b\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u81ea\u6211\u6f14\u5316\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/HongbangYuan/EnvAsScaffold", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.08404", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728SciWorld\u548cBFCL\u4e0a\uff0c\u4f7f\u7528\u4e0d\u540c\u89c4\u6a21Qwen3\u6a21\u578b\u53caGRPO\u3001GSPO\u3001DAPO\u7b49\u7b97\u6cd5\u9a8c\u8bc1\uff0cFEEs\u76f8\u8f83\u6807\u51c6\u73af\u5883\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\u3002", "FEEs\u53ef\u964d\u4f4e\u8bad\u7ec3\u4e2d\u7684\u71b5\u6ce2\u52a8\uff0c\u7a33\u5b9a\u4f18\u5316\u8fc7\u7a0b\uff0c\u5e76\u4fc3\u8fdb\u56f0\u96be\u4efb\u52a1\u4e2d\u7684\u4e3b\u52a8\u72b6\u6001\u7a7a\u95f4\u63a2\u7d22\u3002", "\u5206\u6790\u8868\u660e\u73af\u5883\u53cd\u9988\u4f1a\u88ab\u5185\u5316\u5230\u7b56\u7565\u6743\u91cd\u4e2d\uff0c\u800c\u975e\u4ec5\u4f5c\u4e3a\u63a8\u7406\u65f6\u63d0\u793a\uff1b\u540c\u65f6\u7ec4\u5185\u53cd\u9988\u4e00\u81f4\u6027\u662f\u7a33\u5b9a\u8bad\u7ec3\u7684\u91cd\u8981\u8fb9\u754c\u6761\u4ef6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u73af\u5883\u53cd\u9988", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 2, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2609.08404v1", "published_at": "2026-09-08", "score": 0.447, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08404.png", "title": "Environments as Scaffold: Enriching Feedback to Bootstrap Self-Evolving Agents in Long-Horizon Tasks", "tldr": "\u7528\u53cd\u9988\u589e\u5f3a\u73af\u5883\u7f13\u89e3\u957f\u7a0b\u667a\u80fd\u4f53RL\u7a00\u758f\u5956\u52b1", "upvotes": 21, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4ece\u201c\u667a\u80fd\u4f53\u4fa7\u9884\u70ed\u201d\u8f6c\u5411\u201c\u73af\u5883\u4fa7\u9002\u914d\u201d\uff0c\u6784\u5efa\u53cd\u9988\u589e\u5f3a\u73af\u5883\uff08FEEs\uff09\u6765\u4e3a\u957f\u7a0b\u4efb\u52a1\u4e2d\u7684LLM\u667a\u80fd\u4f53\u63d0\u4f9b\u66f4\u4e30\u5bcc\u7684\u8bad\u7ec3\u53cd\u9988\u3002\u5176\u6838\u5fc3\u7b56\u7565\u662f\u5728\u63a2\u7d22\u540e\u671f\u4ece\u76f4\u63a5\u52a8\u4f5c\u6307\u5bfc\u8f6c\u4e3a\u89c2\u5bdf\u4fe1\u606f\u589e\u5f3a\uff0c\u5e2e\u52a9\u6a21\u578b\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u81ea\u6211\u6f14\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u63d0\u5347\u957f\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\u7684\u91cd\u70b9\u4ece\u6536\u96c6SFT\u6570\u636e\u6216\u6539\u9020\u667a\u80fd\u4f53\u8f6c\u5411\u6539\u9020\u73af\u5883\u53cd\u9988\uff0c\u4e3a\u7f13\u89e3\u7a00\u758f\u5956\u52b1\u548c\u8bad\u7ec3\u4e0d\u7a33\u5b9a\u63d0\u4f9b\u4e86\u66f4\u901a\u7528\u3001\u53ef\u590d\u7528\u7684\u601d\u8def\uff0c\u5bf9LLM Agent\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present a continuous, population-scale measurement record of autonomous language-model trading agents operating in production across two systems with one design lineage: DX Terminal Pro (3,505 user-funded vaults trading real ETH in Base memecoin markets for 21 days, February to March 2026) and the DXAP live alpha fleet (500 to 599 user-created agents all-history, 91 to 117 concurrently active, trading Hyperliquid perpetuals, June to August 2026). The record spans roughly six months, 7.5M single-model invocations with about 300K onchain actions, and a further 231,638 multi-tool turns producing 14,596 fills. Four findings carry the paper. First, the operating layer determines behavior more than anything written in strategy text: a risk slider explains leverage (+0.425 per level), agent fixed effects absorb 60% of variance, and a leaderboard render boundary causally routes selection (regression discontinuity 1.75x at the top-3 cut). Second, sizing is volatility-blind: median leverage is 5.0x in every volatility sextile, and one posture-slider cell (11% of the book) holds 62% of liquidations. Third, agents capture almost none of the upside they reach: 43.2% of positions saw at least +300 bps of favorable excursion within 24h, yet 49.3% of those closed with a negative trade return; a mechanical bracket recovers +39.0 bps per position. Fourth, neither fleet shows a directional edge. The DXAP fleet is not profitable and trails a matched Hyperliquid retail benchmark (41% vs. 50% roundtrip win rate). A paired-replay league of frontier models on 416 captured production scenarios finds decision quality statistically indistinguishable at this horizon, while choice stability differs sharply across model families. Every headline survives day-clustered inference, permutation nulls, and a common-fee restatement; the paper closes with a 17-rule methodology canon bought with our own retractions.", "arxiv_id": "2609.05663", "arxiv_url": "https://arxiv.org/abs/2609.05663", "authors": ["T. J. Barton", "Chris Constantakis", "Patti Hauseman", "Annie Mous", "Alaska Hoffman", "Brian Bergeron", "Hunter Goodreau"], "brief": "\u8bba\u6587\u57fa\u4e8e\u4e24\u4e2a\u751f\u4ea7\u7ea7LLM\u4ea4\u6613\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u516d\u4e2a\u6708\u8bb0\u5f55\uff0c\u5206\u67903505\u4e2a\u771f\u5b9e\u8d44\u91d1\u91d1\u5e93\u4e0e\u7ea6500\u4e2a\u7528\u6237\u521b\u5efa\u4ee3\u7406\u7684\u4ea4\u6613\u884c\u4e3a\u3002\u7814\u7a76\u8986\u76d6750\u4e07\u6b21\u5355\u6a21\u578b\u8c03\u7528\u3001\u7ea630\u4e07\u6b21\u94fe\u4e0a\u52a8\u4f5c\u53ca23\u4e07\u6b21\u591a\u5de5\u5177\u4ea4\u4e92\uff0c\u63ed\u793a\u5176\u771f\u5b9e\u4ea4\u6613\u8868\u73b0\u4e0e\u884c\u4e3a\u6a21\u5f0f\u3002", "categories": ["cs.AI", "cs.CE", "cs.MA"], "github_repo": "https://github.com/ProjectDXAI/continuous-record-llm-trading-agents", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.05663", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u64cd\u4f5c\u5c42\u8bbe\u7f6e\u6bd4\u7b56\u7565\u6587\u672c\u66f4\u51b3\u5b9a\u884c\u4e3a\uff1a\u98ce\u9669\u6ed1\u6746\u663e\u8457\u5f71\u54cd\u6760\u6746\uff0c\u667a\u80fd\u4f53\u56fa\u5b9a\u6548\u5e94\u89e3\u91ca60%\u65b9\u5dee\uff0c\u6392\u884c\u699c\u5c55\u793a\u8fb9\u754c\u4f1a\u56e0\u679c\u6027\u6539\u53d8\u7528\u6237\u9009\u62e9\u3002", "\u4ed3\u4f4d\u5927\u5c0f\u5bf9\u6ce2\u52a8\u7387\u51e0\u4e4e\u4e0d\u654f\u611f\uff1a\u4e0d\u540c\u6ce2\u52a8\u7387\u5206\u4f4d\u7684\u4e2d\u4f4d\u6760\u6746\u5747\u4e3a5\u500d\uff0c\u5c11\u6570\u59ff\u6001\u6ed1\u6746\u7ec4\u5408\u8d21\u732e\u4e86\u5927\u90e8\u5206\u7206\u4ed3\u3002", "\u667a\u80fd\u4f53\u5e38\u9519\u5931\u5df2\u5230\u624b\u6536\u76ca\uff1a43.2%\u4ed3\u4f4d\u66fe\u572824\u5c0f\u65f6\u5185\u6d6e\u76c8\u8d85\u8fc7300\u4e2a\u57fa\u70b9\uff0c\u4f46\u5176\u4e2d\u8fd1\u534a\u6700\u7ec8\u4e8f\u635f\u5e73\u4ed3\uff1b\u673a\u68b0\u6b62\u76c8\u6b62\u635f\u62ec\u53f7\u53ef\u663e\u8457\u6539\u5584\u6536\u76ca\u3002", "\u4e24\u652f\u751f\u4ea7\u8230\u961f\u5747\u672a\u663e\u793a\u65b9\u5411\u6027\u4ea4\u6613\u4f18\u52bf\uff0cDXAP\u80dc\u7387\u4f4e\u4e8e\u5339\u914d\u6563\u6237\u57fa\u51c6\uff1b\u524d\u6cbf\u6a21\u578b\u5728416\u4e2a\u771f\u5b9e\u573a\u666f\u56de\u653e\u4e2d\u7684\u51b3\u7b56\u8d28\u91cf\u5dee\u5f02\u4e0d\u663e\u8457\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878d\u4ea4\u6613", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u591a\u5de5\u5177\u8c03\u7528"], "num_comments": 2, "on_hf": true, "organization": "DXRG AI Inc", "pdf_url": "https://arxiv.org/pdf/2609.05663v1", "published_at": "2026-09-04", "score": 0.44, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05663.png", "title": "What LLM Trading Agents Actually Do in Production: A Six-Month, Population-Scale Record from Two Fleets", "tldr": "\u5927\u89c4\u6a21\u5b9e\u6d4bLLM\u4ea4\u6613\u667a\u80fd\u4f53\u65e0\u7a33\u5b9a\u4f18\u52bf", "upvotes": 18, "what_it_is": "\u8bba\u6587\u57fa\u4e8e\u4e24\u4e2a\u751f\u4ea7\u7ea7LLM\u4ea4\u6613\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u516d\u4e2a\u6708\u8bb0\u5f55\uff0c\u5206\u67903505\u4e2a\u771f\u5b9e\u8d44\u91d1\u91d1\u5e93\u4e0e\u7ea6500\u4e2a\u7528\u6237\u521b\u5efa\u4ee3\u7406\u7684\u4ea4\u6613\u884c\u4e3a\u3002\u7814\u7a76\u8986\u76d6750\u4e07\u6b21\u5355\u6a21\u578b\u8c03\u7528\u3001\u7ea630\u4e07\u6b21\u94fe\u4e0a\u52a8\u4f5c\u53ca23\u4e07\u6b21\u591a\u5de5\u5177\u4ea4\u4e92\uff0c\u63ed\u793a\u5176\u771f\u5b9e\u4ea4\u6613\u8868\u73b0\u4e0e\u884c\u4e3a\u6a21\u5f0f\u3002", "why_notable": "\u8fd9\u662f\u5c11\u89c1\u7684\u751f\u4ea7\u73af\u5883\u3001\u771f\u5b9e\u8d44\u91d1\u3001\u7fa4\u4f53\u89c4\u6a21LLM\u4ea4\u6613\u667a\u80fd\u4f53\u5b9e\u8bc1\u7814\u7a76\uff0c\u76f4\u63a5\u6311\u6218\u201c\u66f4\u5f3a\u6a21\u578b\u5373\u53ef\u5e26\u6765\u4ea4\u6613\u4f18\u52bf\u201d\u7684\u5047\u8bbe\uff0c\u5e76\u6307\u51fa\u7cfb\u7edf\u8bbe\u8ba1\u3001\u98ce\u9669\u63a7\u5236\u4e0e\u6267\u884c\u89c4\u5219\u53ef\u80fd\u6bd4\u6a21\u578b\u672c\u8eab\u66f4\u5173\u952e\u3002"}, {"abstract": "World-Action Models inherit world knowledge from video-generative priors, and channel it into executable control signals through embodied experience. Existing systems, however, are monolithic: the generative backbone, visual representation, architecture, information flow, inference procedure, and training data are tightly coupled, obscuring which design choices matter and why. We introduce OpenWAM, an open research stack that turns world-action pretraining into a controlled experimental program. OpenWAM-Infra factorizes the WAM design space into composable modules with unified training, inference, deployment, and evaluation. On this substrate, OpenWAM-Study examines three questions through controlled experiments: what to inherit, how world and action learning interact, and how their synergy scales; and distills three principles: upstream knowledge transfers through a sufficiently capable generative backbone and a compact, information-rich latent space; world-action synergy requires dedicated action capacity, explicit world-to-action information flow, and synchronized joint denoising; and embodied pretraining principally improves out-of-domain generalization, with one-stage co-training over egocentric and robot data integrating world coverage and action grounding. Composing these principles, we build OpenWAM-\u03b1, an open WAM pretrained on roughly 6,400 hours of egocentric human and robot data and evaluated across simulation and real-world benchmarks. Across the eight simulation benchmarks and the real-robot experiments, which together span embodiments from single-arm and bimanual manipulation to dexterous hands, OpenWAM-\u03b1 delivers consistently excellent performance, sustaining its top-tier standing from simulation to the physical world. We release the full stack, including infrastructure, evaluation protocols, pretrained models, and data recipes, to facilitate future research.", "arxiv_id": "2609.07398", "arxiv_url": "https://arxiv.org/abs/2609.07398", "authors": ["Yuran Wang", "Siqiao Huang", "Mingleyang Li", "Chenhao Zhang", "Jiaqi Liang", "Weiyang Jin", "Yue Chen", "Xuemin Chi", "Donghao Zhou", "Qize Yu", "Yu-Kai Wang", "Yuhan Rui", "Shenzhe Yao", "Zhen Yuan", "Zhenhao Shen", "Kefei Zhu", "Zijie Zhu", "Ning Gao", "Xiaowei Chi", "Guanqi He", "Shanghang Zhang", "Hao Dong", "Lin Shao", "Hang Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa OpenWAM\uff0c\u4e00\u4e2a\u5f00\u653e\u3001\u6a21\u5757\u5316\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u7814\u7a76\u6808\uff0c\u7528\u4e8e\u7cfb\u7edf\u5316\u62c6\u89e3\u548c\u8bc4\u4f30\u4ece\u89c6\u9891\u751f\u6210\u5148\u9a8c\u5230\u673a\u5668\u4eba\u53ef\u6267\u884c\u52a8\u4f5c\u7684\u9884\u8bad\u7ec3\u8bbe\u8ba1\u3002\u57fa\u4e8e\u53d7\u63a7\u5b9e\u9a8c\u603b\u7ed3\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u8bad\u7ec3\u4e86 OpenWAM-\u03b1\uff0c\u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u8868\u73b0\u7a33\u5b9a\u4f18\u79c0\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/OpenWAM-Official/OpenWAM", "github_stars": 407, "hf_url": "https://huggingface.co/papers/2609.07398", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["OpenWAM-Infra \u5c06\u751f\u6210\u9aa8\u5e72\u3001\u89c6\u89c9\u8868\u793a\u3001\u67b6\u6784\u3001\u4fe1\u606f\u6d41\u3001\u63a8\u7406\u3001\u8bad\u7ec3\u6570\u636e\u7b49\u8bbe\u8ba1\u7ef4\u5ea6\u6a21\u5757\u5316\uff0c\u7edf\u4e00\u8bad\u7ec3\u3001\u90e8\u7f72\u4e0e\u8bc4\u6d4b\u6d41\u7a0b", "\u5b9e\u9a8c\u53d1\u73b0\u6709\u6548\u8fc1\u79fb\u4f9d\u8d56\u5f3a\u751f\u6210\u9aa8\u5e72\u4e0e\u7d27\u51d1\u9ad8\u4fe1\u606f\u91cf\u6f5c\u7a7a\u95f4\uff1b\u4e16\u754c-\u52a8\u4f5c\u534f\u540c\u9700\u8981\u4e13\u95e8\u52a8\u4f5c\u5bb9\u91cf\u3001\u663e\u5f0f\u4e16\u754c\u5230\u52a8\u4f5c\u4fe1\u606f\u6d41\u548c\u540c\u6b65\u8054\u5408\u53bb\u566a", "OpenWAM-\u03b1 \u4f7f\u7528\u7ea6 6400 \u5c0f\u65f6\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u8986\u76d6\u5355\u81c2\u3001\u53cc\u81c2\u64cd\u4f5c\u548c\u7075\u5de7\u624b\u7b49\u591a\u7c7b\u5177\u8eab\u4efb\u52a1"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u5b66\u4e60", "\u751f\u6210\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "OpenWAM", "pdf_url": "https://arxiv.org/pdf/2609.07398v1", "published_at": "2026-09-07", "score": 0.363, "selected_reasons": ["HF trending (53\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07398.png", "title": "OpenWAM: An Open, Modular Exploration Towards Systematic World-Action Model Pretraining", "tldr": "\u5f00\u653e\u6a21\u5757\u5316\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u9884\u8bad\u7ec3\u6808", "upvotes": 53, "what_it_is": "\u8bba\u6587\u63d0\u51fa OpenWAM\uff0c\u4e00\u4e2a\u5f00\u653e\u3001\u6a21\u5757\u5316\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u7814\u7a76\u6808\uff0c\u7528\u4e8e\u7cfb\u7edf\u5316\u62c6\u89e3\u548c\u8bc4\u4f30\u4ece\u89c6\u9891\u751f\u6210\u5148\u9a8c\u5230\u673a\u5668\u4eba\u53ef\u6267\u884c\u52a8\u4f5c\u7684\u9884\u8bad\u7ec3\u8bbe\u8ba1\u3002\u57fa\u4e8e\u53d7\u63a7\u5b9e\u9a8c\u603b\u7ed3\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u8bad\u7ec3\u4e86 OpenWAM-\u03b1\uff0c\u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u8868\u73b0\u7a33\u5b9a\u4f18\u79c0\u3002", "why_notable": "\u5b83\u5c06\u4ee5\u5f80\u9ed1\u76d2\u5f0f\u3001\u8026\u5408\u4e25\u91cd\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u62c6\u89e3\u4e3a\u53ef\u590d\u73b0\u5b9e\u9a8c\u6808\uff0c\u5e76\u5f00\u6e90\u57fa\u7840\u8bbe\u65bd\u3001\u8bc4\u6d4b\u534f\u8bae\u3001\u6a21\u578b\u548c\u6570\u636e\u914d\u65b9\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u5177\u8eab\u673a\u5668\u4eba\u9884\u8bad\u7ec3\u4ece\u7ecf\u9a8c\u8c03\u53c2\u8d70\u5411\u7cfb\u7edf\u5316\u7814\u7a76\u3002"}, {"abstract": "Monocular depth estimation is a ubiquitous yet highly ill-posed computer vision task, with downstream applications in scene reconstruction, computational photography, and robotics, among others. Despite the field\u0027s maturity, recent models still struggle to generalize to out-of-distribution inputs and to produce sharp and detailed depth maps. In this paper, we revisit Marigold, a set of techniques for repurposing modern image generation and editing models, powered by the diffusion transformer (DiT) architecture, into state-of-the-art monocular depth estimators. Our recipes target single-step inference from pretrained multi-step flow-matching models, with quantization where needed, preserving model capacity while remaining cheap to run. We analyze the artifacts of naive training and identify two effective remedies: aligning the model\u0027s internal representations with semantic features extracted from ground-truth, and adopting a 2-stage fine-tuning protocol built around a novel Sinkhorn-based loss. The results are crisper, cleaner depth maps that generalize well out-of-distribution, with 16-26% improvement in AbsRel over the previous best on KITTI and ETH3D. Qualitatively, our model resolves fur, foliage, and hair-thin edges that have eluded prior models. Furthermore, Marigold V2 achieves state-of-the-art results when applied to other dense regression tasks, such as surface normals estimation and intrinsic image decomposition. Project website: https://hf.co/spaces/huawei-bayerlab/marigold-v2-web", "arxiv_id": "2609.08084", "arxiv_url": "https://arxiv.org/abs/2609.08084", "authors": ["Igor Pavlovic", "Thiemo Wandel", "Anton Obukhov", "Luca Bartolomei", "Andrey Davydov", "Fabio Tosi", "Matteo Poggi", "Sabine S\u00fcsstrunk", "Dengxin Dai"], "brief": "\u8bba\u6587\u63d0\u51fa Marigold V2\uff0c\u5c06\u9884\u8bad\u7ec3\u7684\u591a\u6b65 flow-matching \u56fe\u50cf\u751f\u6210/\u7f16\u8f91\u6a21\u578b\u6539\u9020\u6210\u53ef\u5355\u6b65\u63a8\u7406\u7684\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u5668\uff0c\u5e76\u6269\u5c55\u5230\u8868\u9762\u6cd5\u7ebf\u3001 intrinsic image \u5206\u89e3\u7b49\u5bc6\u96c6\u56de\u5f52\u4efb\u52a1\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/huawei-bayerlab/marigold-v2", "github_stars": 111, "hf_url": "https://huggingface.co/papers/2609.08084", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57fa\u4e8e Diffusion Transformer\uff08DiT\uff09\u67b6\u6784\uff0c\u9762\u5411\u5355\u6b65\u63a8\u7406\u8bbe\u8ba1\u8bad\u7ec3\u914d\u65b9\uff0c\u5e76\u5728\u9700\u8981\u65f6\u7ed3\u5408\u91cf\u5316\u4ee5\u964d\u4f4e\u8fd0\u884c\u6210\u672c\u3002", "\u5206\u6790\u6734\u7d20\u8bad\u7ec3\u4ea7\u751f\u7684\u4f2a\u5f71\uff0c\u63d0\u51fa\u7528\u771f\u5b9e\u6df1\u5ea6\u63d0\u53d6\u7684\u8bed\u4e49\u7279\u5f81\u5bf9\u9f50\u6a21\u578b\u5185\u90e8\u8868\u5f81\uff0c\u5e76\u91c7\u7528\u5305\u542b Sinkhorn-based loss \u7684\u4e24\u9636\u6bb5\u5fae\u8c03\u3002", "\u5728 KITTI \u548c ETH3D \u4e0a\u76f8\u8f83\u6b64\u524d\u6700\u4f73 AbsRel \u63d0\u5347 16\u201326%\uff0c\u80fd\u66f4\u597d\u6062\u590d\u6bdb\u53d1\u3001\u6811\u53f6\u3001\u7ec6\u8fb9\u7f18\u7b49\u9ad8\u9891\u7ec6\u8282\u3002"], "keywords": ["\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1", "\u6269\u6563\u6a21\u578b", "\u89c6\u89c9\u611f\u77e5", "\u5bc6\u96c6\u9884\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "HUAWEI Bayer Lab", "pdf_url": "https://arxiv.org/pdf/2609.08084v1", "published_at": "2026-09-08", "score": 0.348, "selected_reasons": ["HF trending (45\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08084.png", "title": "Marigold V2: Revisiting Diffusion Transformers for Monocular Depth Estimation", "tldr": "DiT\u6269\u6563\u6a21\u578b\u5b9e\u73b0\u66f4\u6e05\u6670\u6cdb\u5316\u7684\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1", "upvotes": 45, "what_it_is": "\u8bba\u6587\u63d0\u51fa Marigold V2\uff0c\u5c06\u9884\u8bad\u7ec3\u7684\u591a\u6b65 flow-matching \u56fe\u50cf\u751f\u6210/\u7f16\u8f91\u6a21\u578b\u6539\u9020\u6210\u53ef\u5355\u6b65\u63a8\u7406\u7684\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u5668\uff0c\u5e76\u6269\u5c55\u5230\u8868\u9762\u6cd5\u7ebf\u3001 intrinsic image \u5206\u89e3\u7b49\u5bc6\u96c6\u56de\u5f52\u4efb\u52a1\u3002", "why_notable": "\u5b83\u5c55\u793a\u4e86\u751f\u6210\u5f0f DiT/flow-matching \u6a21\u578b\u5728\u51e0\u4f55\u611f\u77e5\u4efb\u52a1\u4e2d\u7684\u5f3a\u8fc1\u79fb\u6f5c\u529b\uff0c\u540c\u65f6\u517c\u987e\u9ad8\u8d28\u91cf\u3001\u8de8\u57df\u6cdb\u5316\u4e0e\u4f4e\u6210\u672c\u5355\u6b65\u63a8\u7406\uff0c\u5bf9\u673a\u5668\u4eba\u3001\u4e09\u7ef4\u91cd\u5efa\u548c\u8ba1\u7b97\u6444\u5f71\u7b49\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autoregressive (AR) video diffusion models have shown great potential in real-time video generation. Recent methods distill pretrained bidirectional video diffusion models into causal AR students through Distribution Matching Distillation (DMD), but the generated videos often suffer from over-saturation and over-smoothing issues, resulting in limited visual quality and realism. The key contributing factor is the mode-seeking behav
