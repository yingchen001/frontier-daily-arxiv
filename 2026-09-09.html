8\u4e03\u4e2a\u6709\u5bb3\u57fa\u51c6\u4e0a\u5c06\u62d2\u7b54\u7387\u964d\u4f4e 41-89 \u4e2a\u767e\u5206\u70b9\u4e14\u672a\u68c0\u6d4b\u5230\u80fd\u529b\u4e0b\u964d\uff1b\u540c\u65f6\u53d1\u73b0\u90e8\u5206\u7c7b\u522b\u76f8\u5173\u62d2\u7b54\u6b8b\u7559\u96be\u4ee5\u6d88\u9664\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Procedural memory lets language agents reuse successful routines, but reuse presumes that a stored routine remains applicable. We study what happens when that presumption is deliberately violated. The study combines a retrospective, human-assisted interface-adaptation case from BrowserGym TimeWarp with controlled frozen-memory comparisons on synthetic shopping decisions. During the documented WebShop V1-V6 development path, interface-specific code was adapted while the separately stored high-level procedure was not reported to change; this phase does not constitute an autonomous memory-agent evaluation. In the controlled phase, an early pilot produced one task on which two memory conditions selected a more expensive item while the no-memory condition selected the reference minimum. Follow-up probes did not establish a recurring row-order or identity-binding pattern. We then tested four forms of mismatch: changed quantities, a different evidence representation, a conflict between local and global optimization, and distributed promotion evidence, across 32 formal cells. Each cell used one temperature-0 generation with the same local qwen3:8b configuration and no adaptive retry. Across these pairs, none of the predefined diagnostic interference signatures appeared on the tasks for which they were defined when current-task evidence was explicit and sufficient. The result identifies a tested region of non-interference: a procedural memory can be mismatched without becoming behaviorally disruptive. It does not establish general safety or a mechanism. The remaining question is which additional conditions turn applicability mismatch into observable, memory-caused error.", "arxiv_id": "2609.09774", "arxiv_url": "https://arxiv.org/abs/2609.09774", "authors": ["Yanze Cao"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u667a\u80fd\u4f53\u5728\u7f51\u9875\u4efb\u52a1\u4e2d\u590d\u7528\u7a0b\u5e8f\u6027\u8bb0\u5fc6\u65f6\uff0c\u82e5\u73af\u5883\u6216\u8bc1\u636e\u5f62\u5f0f\u53d1\u751f\u53d8\u5316\u662f\u5426\u4f1a\u4ea7\u751f\u5e72\u6270\u3002\u901a\u8fc7 BrowserGym/WebShop \u76f8\u5173\u6848\u4f8b\u548c32\u4e2a\u53d7\u63a7\u8d2d\u7269\u51b3\u7b56\u5b9e\u9a8c\uff0c\u53d1\u73b0\u5f53\u5f53\u524d\u4efb\u52a1\u8bc1\u636e\u660e\u786e\u4e14\u5145\u5206\u65f6\uff0c\u9884\u8bbe\u7684\u8bb0\u5fc6\u5e72\u6270\u6a21\u5f0f\u5e76\u672a\u51fa\u73b0\uff0c\u8bf4\u660e\u5b58\u5728\u4e00\u7c7b\u201c\u9519\u914d\u4f46\u4e0d\u5e72\u6270\u201d\u7684\u533a\u57df\uff0c\u4f46\u672a\u8bc1\u660e\u901a\u7528\u5b89\u5168\u6027\u6216\u673a\u5236\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09774", "impact_score": 4, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u6027\u8bb0\u5fc6", "\u7f51\u9875\u4efb\u52a1", "\u8bb0\u5fc6\u5e72\u6270"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09774v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Procedural Memory Under Change: Reuse and Interference in Controlled Web Tasks", "tldr": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u667a\u80fd\u4f53\u5728\u7f51\u9875\u4efb\u52a1\u4e2d\u590d\u7528\u7a0b\u5e8f\u6027\u8bb0\u5fc6\u65f6\uff0c\u82e5\u73af\u5883\u6216\u8bc1\u636e\u5f62\u5f0f\u53d1\u751f\u53d8\u5316\u662f\u5426\u4f1a\u4ea7\u751f\u5e72\u6270\u3002\u901a\u8fc7 BrowserGym/WebShop \u76f8\u5173\u6848\u4f8b\u548c32\u4e2a\u53d7\u63a7\u8d2d\u7269\u51b3\u7b56\u5b9e\u9a8c\uff0c\u53d1\u73b0\u5f53\u5f53\u524d\u4efb\u52a1\u8bc1\u636e\u660e\u786e\u4e14\u5145\u5206\u65f6\uff0c\u9884\u8bbe\u7684\u8bb0\u5fc6\u5e72\u6270\u6a21\u5f0f\u5e76\u672a\u51fa\u73b0\uff0c\u8bf4\u660e\u5b58\u5728\u4e00\u7c7b\u201c\u9519\u914d\u4f46\u4e0d\u5e72\u6270\u201d\u7684\u533a\u57df\uff0c\u4f46\u672a\u8bc1\u660e\u901a\u7528\u5b89\u5168\u6027\u6216\u673a\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly proposed as automated auditors of document quality, yet their reliability as detectors of planted errors is poorly characterised. We construct a contaminated corpus of 150 academic papers spanning supply chain management and medical research, injecting 450 known contaminants of three types: typographical corruption, semantic reversal, and absurd out-of-context insertion. We then evaluate Google Gemini 3.0 Pro\u0027s ability to recover a 180-contaminant answer-key subset across 60 documents under three prompting regimes of increasing scale: single document, small batch, and large batch. Detection holds at small scale and then collapses: 50% recovery on single documents, 60% on small batches, and 2.8% on large batches. The failure mode at scale is not abstention but fabrication. Rather than reporting incomplete processing, the model produced confident findings including invented contaminants of its own, absurdities such as \"telepathic squirrel\" and \"quantum-powered toaster\" that mimic the style of the planted material but do not appear in any document. Detection also varies by contamination type: absurd insertions were recovered at 75% in completed evaluations, while semantic reversals and typographical corruptions were each recovered at only 50%. The corruptions most likely to occur in the wild, plausible ones, are the ones most often missed. We conclude that LLM document auditing degrades not gracefully but deceptively, and outline the harness such systems require: bounded batch sizes, direct content injection, and mechanical verification of every reported finding against source text.", "arxiv_id": "2609.09696", "arxiv_url": "https://arxiv.org/abs/2609.09696", "authors": ["Karan Parekh", "Sanjana Pendyala Ravinder", "Sana Mhapsekar", "Medina Maloku"], "brief": "\u8bba\u6587\u6784\u9020\u542b\u6709\u5df2\u77e5\u6c61\u67d3\u9519\u8bef\u7684\u5b66\u672f\u8bba\u6587\u8bed\u6599\uff0c\u8bc4\u4f30 Gemini 3.0 Pro \u5728\u4e0d\u540c\u6279\u91cf\u89c4\u6a21\u4e0b\u68c0\u6d4b\u6587\u6863\u6c61\u67d3\u7684\u53ef\u9760\u6027\u3002\u7ed3\u679c\u663e\u793a\u5c0f\u89c4\u6a21\u5c1a\u53ef\uff0c\u4f46\u5927\u6279\u91cf\u65f6\u68c0\u51fa\u7387\u4ece\u7ea650%/60%\u9aa4\u964d\u52302.8%\uff0c\u4e14\u6a21\u578b\u4f1a\u81ea\u4fe1\u7f16\u9020\u4e0d\u5b58\u5728\u7684\u9519\u8bef\uff0c\u8bf4\u660eLLM\u6587\u6863\u5ba1\u8ba1\u9700\u8981\u4e25\u683c\u9650\u5236\u6279\u91cf\u5e76\u505a\u6e90\u6587\u672c\u673a\u68b0\u6821\u9a8c\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09696", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9", "\u6587\u6863\u5ba1\u8ba1", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09696v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Auditors Fabricate: Batch-Size Degradation and Confident Hallucination in LLM Detection of Planted Document Contamination", "tldr": "\u8bba\u6587\u6784\u9020\u542b\u6709\u5df2\u77e5\u6c61\u67d3\u9519\u8bef\u7684\u5b66\u672f\u8bba\u6587\u8bed\u6599\uff0c\u8bc4\u4f30 Gemini 3.0 Pro \u5728\u4e0d\u540c\u6279\u91cf\u89c4\u6a21\u4e0b\u68c0\u6d4b\u6587\u6863\u6c61\u67d3\u7684\u53ef\u9760\u6027\u3002\u7ed3\u679c\u663e\u793a\u5c0f\u89c4\u6a21\u5c1a\u53ef\uff0c\u4f46\u5927\u6279\u91cf\u65f6\u68c0\u51fa\u7387\u4ece\u7ea650%/60%\u9aa4\u964d\u52302.8%\uff0c\u4e14\u6a21\u578b\u4f1a\u81ea\u4fe1\u7f16\u9020\u4e0d\u5b58\u5728\u7684\u9519\u8bef\uff0c\u8bf4\u660eLLM\u6587\u6863\u5ba1\u8ba1\u9700\u8981\u4e25\u683c\u9650\u5236\u6279\u91cf\u5e76\u505a\u6e90\u6587\u672c\u673a\u68b0\u6821\u9a8c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Joint-Embedding Predictive Architecture (JEPA) world models learn a compact latent representation of the world that supports prediction and planning, but their capability to learn physics and generate physically realistic dynamics remains hitherto untested. In this work, we introduce SemiGroup-JEPA (SG-JEPA), which extends the LeWorldModel framework by supplying the parameter governing the physics to the temporal model via action-conditioning and jointly training an encoder and predictor through an autoregressive latent rollout. To evaluate the model\u0027s ability to generalize out of distribution, we design dynamical tasks under different gravitational fields that, despite obeying the same physical law, exhibit qualitatively different dynamics, ranging from floating motion in weak gravitational fields to rapid bouncing in strong ones. In contrast to DINO-WM, SG-JEPA reduces open-loop prediction error by up to 2 times on two-dimensional datasets, and increases control success rate up to 2.5 times for three-dimensional robotic datasets, for which we train independent diffusion policies. To explain this advantage, we develop a linear feature model that separates local law-conditioned error from its recursive amplification under rollout. Guided by this model, we find that back-propagating the multi-step rollout loss into the representation trains the encoder to keep the features that the predictor can carry forward, and that those are the features the dynamics depend on, so most of the gain comes from the encoder learning better features rather than from the predictor learning better dynamics. See project page at https://sg-jepa.github.io.", "arxiv_id": "2609.10464", "arxiv_url": "https://arxiv.org/abs/2609.10464", "authors": ["Andy Zeyi Liu", "Haoran Sun", "Lucas Baker", "Randall Balestriero", "John Sous"], "brief": "\u672c\u6587\u63d0\u51fa Semigroup-JEPA\uff08SG-JEPA\uff09\uff0c\u901a\u8fc7\u52a8\u4f5c\u6761\u4ef6\u5316\u5f15\u5165\u7269\u7406\u53c2\u6570\uff0c\u5e76\u5728\u6f5c\u7a7a\u95f4\u4e2d\u8fdb\u884c\u81ea\u56de\u5f52\u591a\u6b65 rollout \u8bad\u7ec3\uff0c\u4ee5\u63d0\u5347 JEPA \u4e16\u754c\u6a21\u578b\u5bf9\u7269\u7406\u52a8\u6001\u7684\u5efa\u6a21\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u4e0d\u540c\u91cd\u529b\u573a\u7684\u96f6\u6837\u672c\u6cdb\u5316\u4e2d\uff0c\u76f8\u6bd4 DINO-WM \u53ef\u5c06\u4e8c\u7ef4\u5f00\u653e\u73af\u9884\u6d4b\u8bef\u5dee\u964d\u4f4e\u6700\u591a 2 \u500d\uff0c\u5e76\u5728\u4e09\u7ef4\u673a\u5668\u4eba\u63a7\u5236\u4e2d\u5c06\u6210\u529f\u7387\u63d0\u5347\u6700\u591a 2.5 \u500d\u3002\u5206\u6790\u8868\u660e\u4e3b\u8981\u6536\u76ca\u6765\u81ea\u7f16\u7801\u5668\u5b66\u5230\u66f4\u9002\u5408\u957f\u671f\u52a8\u529b\u5b66\u4f20\u64ad\u7684\u7279\u5f81\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10464", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u7269\u7406\u6cdb\u5316", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10464v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Semigroup-JEPA: Latent Dynamics Consistency for Zero-Shot Physics Generalization", "tldr": "\u672c\u6587\u63d0\u51fa Semigroup-JEPA\uff08SG-JEPA\uff09\uff0c\u901a\u8fc7\u52a8\u4f5c\u6761\u4ef6\u5316\u5f15\u5165\u7269\u7406\u53c2\u6570\uff0c\u5e76\u5728\u6f5c\u7a7a\u95f4\u4e2d\u8fdb\u884c\u81ea\u56de\u5f52\u591a\u6b65 rollout \u8bad\u7ec3\uff0c\u4ee5\u63d0\u5347 JEPA \u4e16\u754c\u6a21\u578b\u5bf9\u7269\u7406\u52a8\u6001\u7684\u5efa\u6a21\u80fd\u529b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u4e0d\u540c\u91cd\u529b\u573a\u7684\u96f6\u6837\u672c\u6cdb\u5316\u4e2d\uff0c\u76f8\u6bd4 DINO-WM \u53ef\u5c06\u4e8c\u7ef4\u5f00\u653e\u73af\u9884\u6d4b\u8bef\u5dee\u964d\u4f4e\u6700\u591a 2 \u500d\uff0c\u5e76\u5728\u4e09\u7ef4\u673a\u5668\u4eba\u63a7\u5236\u4e2d\u5c06\u6210\u529f\u7387\u63d0\u5347\u6700\u591a 2.5 \u500d\u3002\u5206\u6790\u8868\u660e\u4e3b\u8981\u6536\u76ca\u6765\u81ea\u7f16\u7801\u5668\u5b66\u5230\u66f4\u9002\u5408\u957f\u671f\u52a8\u529b\u5b66\u4f20\u64ad\u7684\u7279\u5f81\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) can memorize and reproduce sensitive, copyrighted, or otherwise undesirable training content, creating privacy, safety, and regulatory concerns. Machine unlearning offers a practical alternative to full retraining, but many existing methods apply broad or fixed parameter updates that can degrade utility and remain brittle under deployment changes such as post-training quantization, where forgotten knowledge may partially re-emerge. We propose Forgetting Only What Matters via Unlearning Layers (FOM-UL), a layer-level unlearning framework that selects transformer layers using a forget-to-retain significance score. This score identifies layers with high influence on the forget set and low sensitivity to the retain set, allowing FOM-UL to concentrate updates where they are most effective while leaving most of the model unchanged. This targeted update strategy improves the forgetting-utility trade-off and provides an empirical path toward quantization-resilient unlearning by reducing the chance that small, diffuse updates are erased by low-bit rounding. Across TOFU, KnowUnDo, and MUSE-style evaluations, FOM-UL reduces residual memorization compared with strong GA, NPO, KLD, SURE, ReLearn, and LUNAR-based baselines while preserving retain-set utility close to the vanilla model. Under 8-bit and 4-bit post-training quantization, FOM-UL maintains stronger memorization suppression and utility preservation than competing methods, and adversarial prompt evaluations show lower recovery of forgotten content. Overall, FOM-UL provides an efficient unlearning strategy that improves targeted forgetting, utility preservation, and deployment robustness without claiming formal guarantees of erasure.", "arxiv_id": "2609.10439", "arxiv_url": "https://arxiv.org/abs/2609.10439", "authors": ["Ravi Ranjan", "Olivera Kotevska", "Agoritsa Polyzou"], "brief": "\u8bba\u6587\u63d0\u51fa FOM-UL\uff0c\u4e00\u79cd\u6309\u5c42\u9009\u62e9\u7684\u5927\u8bed\u8a00\u6a21\u578b\u9057\u5fd8\u65b9\u6cd5\uff0c\u901a\u8fc7\u201c\u9057\u5fd8\u96c6\u5f71\u54cd\u9ad8\u3001\u4fdd\u7559\u96c6\u654f\u611f\u4f4e\u201d\u7684\u8bc4\u5206\u53ea\u66f4\u65b0\u5173\u952e Transformer \u5c42\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u591a\u79cd\u57fa\u7ebf\u80fd\u66f4\u597d\u51cf\u5c11\u6b8b\u7559\u8bb0\u5fc6\u3001\u4fdd\u6301\u6a21\u578b\u6548\u7528\uff0c\u5e76\u5728 8/4 \u6bd4\u7279\u91cf\u5316\u548c\u5bf9\u6297\u63d0\u793a\u4e0b\u66f4\u7a33\u5065\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10439", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u6a21\u578b\u538b\u7f29", "\u5b89\u5168\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10439v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Forgetting Only What Matters: Layer-Selective Unlearning toward Robust LLMs", "tldr": "\u8bba\u6587\u63d0\u51fa FOM-UL\uff0c\u4e00\u79cd\u6309\u5c42\u9009\u62e9\u7684\u5927\u8bed\u8a00\u6a21\u578b\u9057\u5fd8\u65b9\u6cd5\uff0c\u901a\u8fc7\u201c\u9057\u5fd8\u96c6\u5f71\u54cd\u9ad8\u3001\u4fdd\u7559\u96c6\u654f\u611f\u4f4e\u201d\u7684\u8bc4\u5206\u53ea\u66f4\u65b0\u5173\u952e Transformer \u5c42\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u591a\u79cd\u57fa\u7ebf\u80fd\u66f4\u597d\u51cf\u5c11\u6b8b\u7559\u8bb0\u5fc6\u3001\u4fdd\u6301\u6a21\u578b\u6548\u7528\uff0c\u5e76\u5728 8/4 \u6bd4\u7279\u91cf\u5316\u548c\u5bf9\u6297\u63d0\u793a\u4e0b\u66f4\u7a33\u5065\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Time-series foundation models are evaluated almost exclusively on public archives that predate them, so a strong score cannot be separated from having seen the test set during pretraining. The obvious remedy is a hold-out that postdates the models. We build one: thirteen forecasters -- four classical, three trained per dataset, six pretrained -- on seven groups drawn from five domains, every observation published after the last model was released, and every dataset rebuildable without an API key. Under this protocol pretrained models win 5 of 7 groups, lose one to a Theta baseline, and on daily exchange rates are indistinguishable from a seasonal naive forecast, along with every other method tested. We then ask what separates the wins from the losses, and report a negative result: the two intrinsic properties one would reach for -- seasonal strength and spectral entropy, measured on the input window -- do not account for the pattern, and seasonal strength is if anything negatively associated with the advantage. What does track it is corpus familiarity. Our largest gain (28% lower MASE than the best classical method, on weekly Wikipedia pageviews) falls on Wikipedia pageviews, the domain TimesFM\u0027s authors describe as the bulk of its pretraining corpus, at the same granularities and differing only in time window. Within the pretrained family, where every model forecasts identical series so that series difficulty cancels, the TimesFM family outranks the Chronos family by -0.53 ranks on Wikipedia against -0.09 everywhere else (1,500 vs. 754 series, Mann-Whitney p \u003c 1e-5). We conclude that a temporal hold-out removes memorisation of a window but not familiarity with a domain, that benchmarks therefore need domain hold-outs stated relative to disclosed corpora, and that the practitioner\u0027s question is less which model is better than whether their domain is one the model was raised on.", "arxiv_id": "2609.10357", "arxiv_url": "https://arxiv.org/abs/2609.10357", "authors": ["Mahdi Naser Moghadasi", "Faezeh Ghaderi"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53d1\u5e03\u65f6\u95f4\u665a\u4e8e\u73b0\u6709\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u7684\u65e0\u6c61\u67d3\u6d4b\u8bd5\u96c6\uff0c\u6bd4\u8f8313\u79cd\u9884\u6d4b\u65b9\u6cd5\u540e\u53d1\u73b0\uff0c\u9884\u8bad\u7ec3\u6a21\u578b\u4ecd\u5728\u591a\u6570\u6570\u636e\u7ec4\u4e0a\u80dc\u51fa\uff0c\u4f46\u4f18\u52bf\u5e76\u4e0d\u80fd\u7531\u5b63\u8282\u6027\u5f3a\u5ea6\u6216\u8c31\u71b5\u89e3\u91ca\u3002\u7ed3\u679c\u8868\u660e\uff0c\u65f6\u95f4\u540e\u7f6e\u7559\u51fa\u53ea\u80fd\u907f\u514d\u7a97\u53e3\u7ea7\u8bb0\u5fc6\uff0c\u65e0\u6cd5\u6d88\u9664\u9884\u8bad\u7ec3\u8bed\u6599\u7684\u9886\u57df\u719f\u6089\u5ea6\u5f71\u54cd\uff0c\u56e0\u6b64\u57fa\u51c6\u5e94\u660e\u786e\u505a\u9886\u57df\u7559\u51fa\u5e76\u62ab\u9732\u9884\u8bad\u7ec3\u8bed\u6599\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10357", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u57fa\u7840\u6a21\u578b", "\u6570\u636e\u6c61\u67d3", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10357v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Later Test Set Is Not a New Domain: Pretraining Familiarity Survives a Contamination-Free Hold-Out", "tldr": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53d1\u5e03\u65f6\u95f4\u665a\u4e8e\u73b0\u6709\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u7684\u65e0\u6c61\u67d3\u6d4b\u8bd5\u96c6\uff0c\u6bd4\u8f8313\u79cd\u9884\u6d4b\u65b9\u6cd5\u540e\u53d1\u73b0\uff0c\u9884\u8bad\u7ec3\u6a21\u578b\u4ecd\u5728\u591a\u6570\u6570\u636e\u7ec4\u4e0a\u80dc\u51fa\uff0c\u4f46\u4f18\u52bf\u5e76\u4e0d\u80fd\u7531\u5b63\u8282\u6027\u5f3a\u5ea6\u6216\u8c31\u71b5\u89e3\u91ca\u3002\u7ed3\u679c\u8868\u660e\uff0c\u65f6\u95f4\u540e\u7f6e\u7559\u51fa\u53ea\u80fd\u907f\u514d\u7a97\u53e3\u7ea7\u8bb0\u5fc6\uff0c\u65e0\u6cd5\u6d88\u9664\u9884\u8bad\u7ec3\u8bed\u6599\u7684\u9886\u57df\u719f\u6089\u5ea6\u5f71\u54cd\uff0c\u56e0\u6b64\u57fa\u51c6\u5e94\u660e\u786e\u505a\u9886\u57df\u7559\u51fa\u5e76\u62ab\u9732\u9884\u8bad\u7ec3\u8bed\u6599\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse autoencoders (SAEs) are increasingly used to recover interpretable features from neural-network activations, yet systematic feature co-occurrence can cause distinct features to be absorbed or merged. The MAIS-O43 open problem proposes a controlled experiment to characterize when recovery of a true synthetic dictionary gives way to feature merging as the nesting fraction $\u03b3$, sparsity penalty $\u03bb$, and dictionary size $M$ vary. We implement the specified protocol and evaluate 200 independently initialized fits across ten of the 165 grid cells. We observe zero full-dictionary recoveries and zero merges. Instead, every run converges to a reproducible diffuse phase: reconstruction is nearly perfect, but learned atoms typically remain far from the true features (median best cosine 0.5-0.7 against a 0.95 recovery criterion) and learned codes are an order of magnitude denser than the ground truth. This behavior persists under robustness checks and across the full 165-cell grid using standard minibatch Adam (3,300 additional fits). Since the global optimum of the exact sparse-coding objective is known to merge nested features in the two-feature case, these results suggest that trained SAEs need not reach the corresponding minima, and that the phase diagram of trained models may differ fundamentally from that of objective minimizers.", "arxiv_id": "2609.10299", "arxiv_url": "https://arxiv.org/abs/2609.10299", "authors": ["Alexis D. Plascencia"], "brief": "\u8bba\u6587\u590d\u73b0\u5e76\u6269\u5c55\u4e86 MAIS-O43 \u4e2d\u5173\u4e8e\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7279\u5f81\u6062\u590d/\u5408\u5e76\u76f8\u53d8\u7684\u53d7\u63a7\u5b9e\u9a8c\u3002\u7ed3\u679c\u53d1\u73b0\u8bad\u7ec3\u540e\u7684 SAE \u51e0\u4e4e\u4ece\u4e0d\u5b8c\u6574\u6062\u590d\u771f\u5b9e\u5b57\u5178\u3001\u4e5f\u4e0d\u53d1\u751f\u9884\u671f\u5408\u5e76\uff0c\u800c\u662f\u7a33\u5b9a\u8fdb\u5165\u4e00\u79cd\u201c\u5f25\u6563\u76f8\u201d\uff1a\u91cd\u6784\u5f88\u597d\u4f46\u7279\u5f81\u4e0d\u5bf9\u9f50\u3001\u7f16\u7801\u66f4\u7a20\u5bc6\uff0c\u8bf4\u660e\u8bad\u7ec3\u52a8\u6001\u4e0b\u7684\u76f8\u56fe\u53ef\u80fd\u4e0d\u540c\u4e8e\u76ee\u6807\u51fd\u6570\u5168\u5c40\u6700\u4f18\u89e3\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10299", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u53ef\u89e3\u91ca\u6027", "\u7279\u5f81\u5b66\u4e60", "\u4f18\u5316\u52a8\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10299v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Dominant Diffuse Phase in the Sparse Autoencoder Phase Diagram", "tldr": "\u8bba\u6587\u590d\u73b0\u5e76\u6269\u5c55\u4e86 MAIS-O43 \u4e2d\u5173\u4e8e\u7a00\u758f\u81ea\u7f16\u7801\u5668\u7279\u5f81\u6062\u590d/\u5408\u5e76\u76f8\u53d8\u7684\u53d7\u63a7\u5b9e\u9a8c\u3002\u7ed3\u679c\u53d1\u73b0\u8bad\u7ec3\u540e\u7684 SAE \u51e0\u4e4e\u4ece\u4e0d\u5b8c\u6574\u6062\u590d\u771f\u5b9e\u5b57\u5178\u3001\u4e5f\u4e0d\u53d1\u751f\u9884\u671f\u5408\u5e76\uff0c\u800c\u662f\u7a33\u5b9a\u8fdb\u5165\u4e00\u79cd\u201c\u5f25\u6563\u76f8\u201d\uff1a\u91cd\u6784\u5f88\u597d\u4f46\u7279\u5f81\u4e0d\u5bf9\u9f50\u3001\u7f16\u7801\u66f4\u7a20\u5bc6\uff0c\u8bf4\u660e\u8bad\u7ec3\u52a8\u6001\u4e0b\u7684\u76f8\u56fe\u53ef\u80fd\u4e0d\u540c\u4e8e\u76ee\u6807\u51fd\u6570\u5168\u5c40\u6700\u4f18\u89e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Open-source large language models (LLMs) are increasingly competitive with closed-source models while offering transparency and the ability to run inference without exposing user inputs to a service provider. However, running large-scale models locally requires substantial computational resources. In practice, users may still resort to a third-party provider, giving rise to privacy and correctness concerns. Existing solutions that address these problems often impose substantial server overhead or introduce additional trust assumptions. In this paper, we present Maverick, a novel approach to private and verifiable LLM inference based on a protocol for delegating matrix-vector multiplication, a dominant operation in LLMs. At its core, Maverick provides, to our knowledge, the first information-theoretically sound verification protocol for matrix-vector multiplication delegation with transparent preprocessing, efficient (batch) verification, and virtually no server overhead. We combine this verification primitive with LPN-based pseudorandom masking to provide input privacy. We implement our matrix-vector delegation primitive and use it to build an end-to-end prototype of Maverick, which we evaluate on Qwen3-4B by measuring throughput in tokens per second. We evaluate client configurations with 1-8 threads. With one client thread and a CPU server using up to 128 threads, Maverick achieves throughput gains over local inference of up to 17x when privacy masks are generated online, 45x when they are precomputed, and 44x when only verification is required. With four client threads, the corresponding gains are 13x, 18x, and 17x. When server computation is no longer the bottleneck, client-side microbenchmarks with simulated network delay show speedups of 12x-20x, 34x-135x, and 38x-157x.", "arxiv_id": "2609.10264", "arxiv_url": "https://arxiv.org/abs/2609.10264", "authors": ["Ben Merbaum", "Mohammad Amin Raeisi", "Wenhao Wang", "Charalampos Papamanthou", "Katerina Sotiraki", "Fan Zhang"], "brief": "Maverick \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u6a21\u578b\u63a8\u7406\u7684\u79c1\u6709\u4e14\u53ef\u9a8c\u8bc1\u5916\u5305\u65b9\u6848\uff0c\u5c06\u6838\u5fc3\u8ba1\u7b97\u77e9\u9635-\u5411\u91cf\u4e58\u6cd5\u59d4\u6258\u7ed9\u670d\u52a1\u5668\uff0c\u5e76\u7528\u4fe1\u606f\u8bba\u53ef\u9760\u7684\u9a8c\u8bc1\u534f\u8bae\u4e0e LPN \u4f2a\u968f\u673a\u63a9\u7801\u4fdd\u62a4\u8f93\u5165\u9690\u79c1\u3002\u5176\u5728 Qwen3-4B \u4e0a\u5b9e\u73b0\u7aef\u5230\u7aef\u539f\u578b\uff0c\u76f8\u6bd4\u672c\u5730\u63a8\u7406\u53ef\u83b7\u5f97\u6700\u9ad8\u6570\u5341\u500d\u541e\u5410\u63d0\u5347\uff0c\u4e14\u51e0\u4e4e\u4e0d\u589e\u52a0\u670d\u52a1\u5668\u5f00\u9500\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10264", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u9690\u79c1\u8ba1\u7b97", "\u53ef\u9a8c\u8bc1\u8ba1\u7b97", "\u77e9\u9635\u4e58\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10264v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Maverick: Private and Verifiable LLM Inference Made Practical via Matrix-Vector Multiplication Delegation", "tldr": "Maverick \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u6a21\u578b\u63a8\u7406\u7684\u79c1\u6709\u4e14\u53ef\u9a8c\u8bc1\u5916\u5305\u65b9\u6848\uff0c\u5c06\u6838\u5fc3\u8ba1\u7b97\u77e9\u9635-\u5411\u91cf\u4e58\u6cd5\u59d4\u6258\u7ed9\u670d\u52a1\u5668\uff0c\u5e76\u7528\u4fe1\u606f\u8bba\u53ef\u9760\u7684\u9a8c\u8bc1\u534f\u8bae\u4e0e LPN \u4f2a\u968f\u673a\u63a9\u7801\u4fdd\u62a4\u8f93\u5165\u9690\u79c1\u3002\u5176\u5728 Qwen3-4B \u4e0a\u5b9e\u73b0\u7aef\u5230\u7aef\u539f\u578b\uff0c\u76f8\u6bd4\u672c\u5730\u63a8\u7406\u53ef\u83b7\u5f97\u6700\u9ad8\u6570\u5341\u500d\u541e\u5410\u63d0\u5347\uff0c\u4e14\u51e0\u4e4e\u4e0d\u589e\u52a0\u670d\u52a1\u5668\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "How many of a transformer\u0027s components decide a token? Counted by the absolute value of each unit\u0027s and channel\u0027s contribution to the logit, one prediction rests on thousands to hundreds of thousands of them. But contributions are signed, and across eighteen models the mass pushing away from the predicted token is a median of seven times the mass carrying it. Divide by the net and the count is dozens: on the baseline, 53 components carry ninety percent of a prediction, 13 it cannot survive losing, and 8 suffice to produce it alone. Across twelve models trained elsewhere, 124M to 7B parameters, the sufficient set runs from two components to sixteen, and what a prediction draws on, followed all the way back, is one to three percent of the model, a share that does not grow with size. Three quarters of a layer\u0027s update is a fixed linear map of the state it received. Everything is read from the model\u0027s own parameters and activations, with nothing trained or fitted, and it names a component on both sides: what it writes, from the predictions it drives, reaching close to half of every model; what it reads, from its weights in the frame of its own layer, at 58.9 percent above chance over its eight strongest inputs. Sorting the remainder by upstream source yields grammatical categories the embedding cannot see. A name can be acted on. An association the model does not hold installs into one spare unit, key and value read from the weights, for a quarter of a percent of held-out loss, a fortieth of what a rank-one update costs. An installed attention head and a unit two layers above it make an edit fire only where a token occurred earlier in the context, and a unit the model trained for itself is driven from two layers upstream, 86 percent of the effect passing through it. An order-preserving activation puts a unit\u0027s inputs at the instrument\u0027s ceiling, at the price of a two-part install.", "arxiv_id": "2609.10210", "arxiv_url": "https://arxiv.org/abs/2609.10210", "authors": ["Mark Oskin"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u6216\u62df\u5408\u7684\u76f4\u63a5\u8bfb\u5199 Transformer \u65b9\u6cd5\uff0c\u4ece\u6a21\u578b\u81ea\u8eab\u53c2\u6570\u4e0e\u6fc0\u6d3b\u4e2d\u8ffd\u8e2a\u54ea\u4e9b\u7ec4\u4ef6\u771f\u6b63\u51b3\u5b9a token \u9884\u6d4b\u3002\u7ed3\u679c\u663e\u793a\u5355\u6b21\u9884\u6d4b\u867d\u6d89\u53ca\u5927\u91cf\u6709\u7b26\u53f7\u8d21\u732e\uff0c\u4f46\u5c11\u6570\u5173\u952e\u7ec4\u4ef6\u5373\u53ef\u652f\u6491\u9884\u6d4b\uff0c\u5e76\u53ef\u7528\u4e8e\u5b9a\u4f4d\u8bfb\u5199\u5173\u7cfb\u3001\u89e3\u91ca\u8bed\u6cd5\u7c7b\u522b\u548c\u6267\u884c\u4f4e\u6210\u672c\u6a21\u578b\u7f16\u8f91\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10210", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u89e3\u91ca\u6027", "Transformer", "\u6a21\u578b\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10210v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Through the Looking Glass: Directly Reading and Writing Transformers", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u6216\u62df\u5408\u7684\u76f4\u63a5\u8bfb\u5199 Transformer \u65b9\u6cd5\uff0c\u4ece\u6a21\u578b\u81ea\u8eab\u53c2\u6570\u4e0e\u6fc0\u6d3b\u4e2d\u8ffd\u8e2a\u54ea\u4e9b\u7ec4\u4ef6\u771f\u6b63\u51b3\u5b9a token \u9884\u6d4b\u3002\u7ed3\u679c\u663e\u793a\u5355\u6b21\u9884\u6d4b\u867d\u6d89\u53ca\u5927\u91cf\u6709\u7b26\u53f7\u8d21\u732e\uff0c\u4f46\u5c11\u6570\u5173\u952e\u7ec4\u4ef6\u5373\u53ef\u652f\u6491\u9884\u6d4b\uff0c\u5e76\u53ef\u7528\u4e8e\u5b9a\u4f4d\u8bfb\u5199\u5173\u7cfb\u3001\u89e3\u91ca\u8bed\u6cd5\u7c7b\u522b\u548c\u6267\u884c\u4f4e\u6210\u672c\u6a21\u578b\u7f16\u8f91\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Low-bit quantization can achieve high recall on some vector representations and fail sharply on others, while average distortion and global rank correlation do not explain the difference. We study quantized vector search at the level of the comparisons consumed by ranking and graph-pruning algorithms. Our first result is a distribution-free decomposition: the probability that a comparison flips is bounded by the probability mass of exact margins near zero plus the tail probability of the calibrated residual. We then account for dependence between residuals that share a query or graph node, and derive covariance-aware second-moment identities and tail bounds under a joint MGF proxy. For a frozen candidate permutation, we prove a deterministic coupling theorem for Vamana neighbour selection: the approximate replay returns the exact neighbour list exactly when all candidate-level pruning actions agree on the frozen exact states. We connect these results to representation geometry through an exact Gaussian oracle, establish a strict correlation gain from a deterministic magnitude bit in an aligned bilinear model, and give a rare-contamination construction showing why marginal Gaussian diagnostics do not imply the required residual tails. When analytical assumptions are unavailable, a held-out block certificate bounds the selective failure risk of a frozen quantized rule. Across learned, classical, and synthetic embeddings, standardized exact margins predict held-out ranking and pruning flip rates substantially better than global rank correlation. The framework applies to coordinate binary codes, RaBitQ, Lucene BBQ, and product quantizers through a common decision interface.", "arxiv_id": "2609.09854", "arxiv_url": "https://arxiv.org/abs/2609.09854", "authors": ["Wenxuan Xiao", "Xu Cao"], "brief": "\u8bba\u6587\u7814\u7a76\u4f4e\u6bd4\u7279\u91cf\u5316\u5728\u5411\u91cf\u641c\u7d22\u4e2d\u4f55\u65f6\u80fd\u4fdd\u6301\u6392\u5e8f\u4e0e\u56fe\u526a\u679d\u51b3\u7b56\u4e0d\u53d8\uff0c\u63d0\u51fa\u57fa\u4e8e\u201c\u7cbe\u786e\u95f4\u9694\u63a5\u8fd1\u96f6\u7684\u6982\u7387\u201d\u548c\u201c\u6821\u51c6\u6b8b\u5dee\u5c3e\u90e8\u201d\u7684\u6bd4\u8f83\u7ffb\u8f6c\u6982\u7387\u5206\u89e3\uff0c\u5e76\u6269\u5c55\u5230\u6b8b\u5dee\u76f8\u5173\u6027\u4e0e Vamana \u90bb\u5c45\u9009\u62e9\u7684\u786e\u5b9a\u6027\u8026\u5408\u5206\u6790\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u6807\u51c6\u5316\u7cbe\u786e\u95f4\u9694\u6bd4\u5168\u5c40\u79e9\u76f8\u5173\u66f4\u80fd\u9884\u6d4b\u91cf\u5316\u540e\u7684\u6392\u540d\u548c\u526a\u679d\u7ffb\u8f6c\u7387\uff0c\u6846\u67b6\u53ef\u7edf\u4e00\u89e3\u91ca\u4e8c\u503c\u7801\u3001RaBitQ\u3001Lucene BBQ \u548c\u4e58\u79ef\u91cf\u5316\u7b49\u65b9\u6cd5\u3002", "categories": ["cs.DB", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09854", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5411\u91cf\u641c\u7d22", "\u4f4e\u6bd4\u7279\u91cf\u5316", "\u8fd1\u4f3c\u6700\u8fd1\u90bb", "\u6392\u5e8f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09854v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Does Low-Bit Quantization Preserve the Decisions of Vector Search?", "tldr": "\u8bba\u6587\u7814\u7a76\u4f4e\u6bd4\u7279\u91cf\u5316\u5728\u5411\u91cf\u641c\u7d22\u4e2d\u4f55\u65f6\u80fd\u4fdd\u6301\u6392\u5e8f\u4e0e\u56fe\u526a\u679d\u51b3\u7b56\u4e0d\u53d8\uff0c\u63d0\u51fa\u57fa\u4e8e\u201c\u7cbe\u786e\u95f4\u9694\u63a5\u8fd1\u96f6\u7684\u6982\u7387\u201d\u548c\u201c\u6821\u51c6\u6b8b\u5dee\u5c3e\u90e8\u201d\u7684\u6bd4\u8f83\u7ffb\u8f6c\u6982\u7387\u5206\u89e3\uff0c\u5e76\u6269\u5c55\u5230\u6b8b\u5dee\u76f8\u5173\u6027\u4e0e Vamana \u90bb\u5c45\u9009\u62e9\u7684\u786e\u5b9a\u6027\u8026\u5408\u5206\u6790\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u6807\u51c6\u5316\u7cbe\u786e\u95f4\u9694\u6bd4\u5168\u5c40\u79e9\u76f8\u5173\u66f4\u80fd\u9884\u6d4b\u91cf\u5316\u540e\u7684\u6392\u540d\u548c\u526a\u679d\u7ffb\u8f6c\u7387\uff0c\u6846\u67b6\u53ef\u7edf\u4e00\u89e3\u91ca\u4e8c\u503c\u7801\u3001RaBitQ\u3001Lucene BBQ \u548c\u4e58\u79ef\u91cf\u5316\u7b49\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-tuning large language models (LLMs) on domain-specific data is essential for downstream adaptation. In many deployments, a participant cannot hold the complete model locally. This happens because the model owner keeps the full model proprietary, or because the participant lacks sufficient compute resources. Split Learning (SL) addresses this by partitioning the model between the participant and a server so that only a small portion runs locally. When the underlying data is additionally distributed across multiple institutions with privacy requirements, Federated Learning (FL) further enables collaborative training across participants by sharing only model updates instead of raw data. In this combined setting, each client transmits intermediate activations to the server, and for LLM fine-tuning, this exchange poses an inherent privacy paradox. The autoregressive nature of LLMs causes the transmitted activations to leak the input, and existing perturbation-based defenses are fundamentally ineffective in this setting. We address this leakage through a learned obfuscate-and-recover scheme that protects participants\u0027 private datasets while still allowing an independently deployable model to be trained on the server side. Experiments demonstrate that our approach achieves strong privacy protection with modest utility loss and system overhead, making split-based federated LLM fine-tuning practically viable.", "arxiv_id": "2609.09794", "arxiv_url": "https://arxiv.org/abs/2609.09794", "authors": ["Heng Jin", "Chaoyu Zhang", "Hexuan Yu", "Wenjing Lou", "Y. Thomas Hou"], "brief": "\u8bba\u6587\u7814\u7a76\u8054\u90a6\u573a\u666f\u4e0b\u7684\u5927\u8bed\u8a00\u6a21\u578b\u62c6\u5206\u5b66\u4e60\u5fae\u8c03\uff0c\u6307\u51fa\u5ba2\u6237\u7aef\u4f20\u8f93\u7684\u4e2d\u95f4\u6fc0\u6d3b\u4f1a\u56e0\u81ea\u56de\u5f52\u7279\u6027\u6cc4\u9732\u8f93\u5165\uff0c\u4e14\u5e38\u89c4\u6270\u52a8\u9632\u5fa1\u6548\u679c\u6709\u9650\u3002\u4f5c\u8005\u63d0\u51fa\u5b66\u4e60\u5f0f\u201c\u6df7\u6dc6-\u6062\u590d\u201d\u673a\u5236\uff0c\u5728\u4fdd\u62a4\u5404\u65b9\u79c1\u6709\u6570\u636e\u7684\u540c\u65f6\u8ba9\u670d\u52a1\u5668\u7aef\u53ef\u8bad\u7ec3\u53ef\u72ec\u7acb\u90e8\u7f72\u6a21\u578b\uff0c\u5b9e\u9a8c\u663e\u793a\u9690\u79c1\u4fdd\u62a4\u5f3a\u3001\u6548\u7528\u635f\u5931\u548c\u7cfb\u7edf\u5f00\u9500\u8f83\u5c0f\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09794", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8054\u90a6\u5b66\u4e60", "\u62c6\u5206\u5b66\u4e60", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09794v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Privacy-Preserving Split Learning for Federated LLM Fine-Tuning", "tldr": "\u8bba\u6587\u7814\u7a76\u8054\u90a6\u573a\u666f\u4e0b\u7684\u5927\u8bed\u8a00\u6a21\u578b\u62c6\u5206\u5b66\u4e60\u5fae\u8c03\uff0c\u6307\u51fa\u5ba2\u6237\u7aef\u4f20\u8f93\u7684\u4e2d\u95f4\u6fc0\u6d3b\u4f1a\u56e0\u81ea\u56de\u5f52\u7279\u6027\u6cc4\u9732\u8f93\u5165\uff0c\u4e14\u5e38\u89c4\u6270\u52a8\u9632\u5fa1\u6548\u679c\u6709\u9650\u3002\u4f5c\u8005\u63d0\u51fa\u5b66\u4e60\u5f0f\u201c\u6df7\u6dc6-\u6062\u590d\u201d\u673a\u5236\uff0c\u5728\u4fdd\u62a4\u5404\u65b9\u79c1\u6709\u6570\u636e\u7684\u540c\u65f6\u8ba9\u670d\u52a1\u5668\u7aef\u53ef\u8bad\u7ec3\u53ef\u72ec\u7acb\u90e8\u7f72\u6a21\u578b\uff0c\u5b9e\u9a8c\u663e\u793a\u9690\u79c1\u4fdd\u62a4\u5f3a\u3001\u6548\u7528\u635f\u5931\u548c\u7cfb\u7edf\u5f00\u9500\u8f83\u5c0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deploying Large Language Models (LLMs) directly on mobile platforms at the edge is gaining traction due to a myriad of benefits, such as increased privacy, personalization, and reduced latency. However, LLMs have heavy computational requirements, which are difficult for resource-constrained mobile and edge platforms to fulfill. In addition to limited compute resources, mobile and edge systems often have a compact form factor and lack physical mechanisms to dissipate heat generated from high processor usage rates (e.g., fans) to prevent throttling and reduced processing power, which LLMs can easily cause. To mitigate these effects, prior works have proposed various power governing strategies, such as dynamic voltage and frequency scaling (DVFS), for reducing power and heat generation for heavy computational tasks on mobile platforms. Recently, DVFS methods tailored for mobile LLMs have also been proposed. However, these methods mostly focus on optimizing hardware parameters and processor frequencies, and they fall short under some thermally constrained scenarios. Drawing from recent advances in machine learning, we identify and take advantage of the key insight that not all tokens require full-depth inference to maintain high-quality generation. Motivated by this, we present PELM, a solution that augments traditional DVFS processor frequency tuning with two additional workload-specific knobs: 1) speculative decoding and 2) variable verification depth to expand the optimization space to multiple dimensions for more power efficient on-device LLM inference. In extensive evaluations across hardware platforms and datasets, PELM demonstrates superior performance compared to state-of-the-art power governing methods, with up to 23.1% speedup and 52.4% reduction in energy consumption, while maintaining comparable task performance. The source code is available at https://github.com/imec-nu/PELM.", "arxiv_id": "2609.09662", "arxiv_url": "https://arxiv.org/abs/2609.09662", "authors": ["Weisi Yang", "Stephen Xia"], "brief": "\u672c\u6587\u63d0\u51fa PELM\uff0c\u7528\u4e8e\u79fb\u52a8\u7aef/\u8fb9\u7f18\u8bbe\u5907\u4e0a\u7684\u5927\u8bed\u8a00\u6a21\u578b\u4f4e\u529f\u8017\u63a8\u7406\uff0c\u5c06\u4f20\u7edf DVFS \u8c03\u9891\u4e0e\u63a8\u6d4b\u89e3\u7801\u3001\u53ef\u53d8\u9a8c\u8bc1\u6df1\u5ea6\u7ed3\u5408\uff0c\u5229\u7528\u201c\u5e76\u975e\u6240\u6709 token \u90fd\u9700\u5168\u6df1\u5ea6\u63a8\u7406\u201d\u7684\u7279\u70b9\u6269\u5927\u4f18\u5316\u7a7a\u95f4\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u73b0\u6709\u529f\u8017\u7ba1\u7406\u65b9\u6cd5\u6700\u9ad8\u53ef\u5e26\u6765 23.1% \u52a0\u901f\u548c 52.4% \u80fd\u8017\u964d\u4f4e\uff0c\u540c\u65f6\u4fdd\u6301\u76f8\u8fd1\u4efb\u52a1\u6027\u80fd\u3002", "categories": ["cs.LG", "cs.CL", "cs.OS", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09662", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7aef\u4fa7\u63a8\u7406", "\u63a8\u6d4b\u89e3\u7801", "\u80fd\u6548\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09662v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PELM: Power Efficient On-Device LLM Inference with Speculative Decoding and Dynamic Voltage Frequency Scaling", "tldr": "\u672c\u6587\u63d0\u51fa PELM\uff0c\u7528\u4e8e\u79fb\u52a8\u7aef/\u8fb9\u7f18\u8bbe\u5907\u4e0a\u7684\u5927\u8bed\u8a00\u6a21\u578b\u4f4e\u529f\u8017\u63a8\u7406\uff0c\u5c06\u4f20\u7edf DVFS \u8c03\u9891\u4e0e\u63a8\u6d4b\u89e3\u7801\u3001\u53ef\u53d8\u9a8c\u8bc1\u6df1\u5ea6\u7ed3\u5408\uff0c\u5229\u7528\u201c\u5e76\u975e\u6240\u6709 token \u90fd\u9700\u5168\u6df1\u5ea6\u63a8\u7406\u201d\u7684\u7279\u70b9\u6269\u5927\u4f18\u5316\u7a7a\u95f4\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u76f8\u6bd4\u73b0\u6709\u529f\u8017\u7ba1\u7406\u65b9\u6cd5\u6700\u9ad8\u53ef\u5e26\u6765 23.1% \u52a0\u901f\u548c 52.4% \u80fd\u8017\u964d\u4f4e\uff0c\u540c\u65f6\u4fdd\u6301\u76f8\u8fd1\u4efb\u52a1\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A research idea may be novel, coherent, and scientifically plausible, yet its proposed method may remain insufficiently specified for faithful implementation. We study the codification readiness of implementation-facing research-method specifications, defined by whether they provide sufficient methodological information for a competent implementer or coding agent to construct the intended method without unsupported assumptions. We construct evidence-grounded specifications and their supported resolutions from papers, codebases, issue threads, and reproduction artifacts. We introduce IdeaAMBIG, a benchmark of 660 evidence-grounded instances: 163 real-world gaps from reproducibility reports and GitHub issues, and 497 controlled synthetic gaps injected into codification-ready references. IdeaAMBIG evaluates three capabilities: codification-readiness assessment, defect localization, and clarification action generation. Defect localization receives only the specification, whereas clarification additionally receives the annotated defect. Across 13 LLMs, the best model achieves 9.6% Macro Defect Recovery Rate on real-world instances but 80.6% Macro Clarification Action Success Rate when given the defect. In an oracle study, supplying the gold resolution raises the downstream codification-ready rate from 14% to 98%. Across all evaluated models, defect localization is the main bottleneck, with stronger clarification given the defect.", "arxiv_id": "2609.10539", "arxiv_url": "https://arxiv.org/abs/2609.10539", "authors": ["Yiling Ma", "Yilun Zhao", "Sihong Wu", "Manasi Patwardhan", "Arman Cohan"], "brief": "\u8bba\u6587\u63d0\u51fa IdeaAMBIG\uff0c\u7528\u4e8e\u8bc4\u6d4b\u7814\u7a76\u60f3\u6cd5\u7684\u65b9\u6cd5\u89c4\u683c\u662f\u5426\u8db3\u591f\u6e05\u6670\u3001\u53ef\u88ab\u5fe0\u5b9e\u5b9e\u73b0\uff0c\u5305\u542b660\u4e2a\u57fa\u4e8e\u771f\u5b9e\u8bc1\u636e\u4e0e\u5408\u6210\u6ce8\u5165\u7684\u5b9e\u73b0\u5173\u952e\u7f3a\u53e3\u5b9e\u4f8b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c13\u4e2a\u5927\u6a21\u578b\u5728\u771f\u5b9e\u7f3a\u53e3\u5b9a\u4f4d\u4e0a\u8868\u73b0\u5f88\u5dee\uff0c\u6700\u4f73\u4ec59.6%\u5b8f\u5e73\u5747\u7f3a\u9677\u6062\u590d\u7387\uff1b\u4f46\u82e5\u7ed9\u5b9a\u7f3a\u9677\u4f4d\u7f6e\uff0c\u751f\u6210\u6f84\u6e05\u884c\u52a8\u7684\u6210\u529f\u7387\u53ef\u8fbe80.6%\uff0c\u8bf4\u660e\u4e3b\u8981\u74f6\u9888\u5728\u7f3a\u9677\u5b9a\u4f4d\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10539", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u6d4b\u8bd5", "\u53ef\u590d\u73b0\u6027", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10539v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "IdeaAMBIG: Benchmarking Implementation-Critical Gaps in Research-Idea Specifications", "tldr": "\u8bba\u6587\u63d0\u51fa IdeaAMBIG\uff0c\u7528\u4e8e\u8bc4\u6d4b\u7814\u7a76\u60f3\u6cd5\u7684\u65b9\u6cd5\u89c4\u683c\u662f\u5426\u8db3\u591f\u6e05\u6670\u3001\u53ef\u88ab\u5fe0\u5b9e\u5b9e\u73b0\uff0c\u5305\u542b660\u4e2a\u57fa\u4e8e\u771f\u5b9e\u8bc1\u636e\u4e0e\u5408\u6210\u6ce8\u5165\u7684\u5b9e\u73b0\u5173\u952e\u7f3a\u53e3\u5b9e\u4f8b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c13\u4e2a\u5927\u6a21\u578b\u5728\u771f\u5b9e\u7f3a\u53e3\u5b9a\u4f4d\u4e0a\u8868\u73b0\u5f88\u5dee\uff0c\u6700\u4f73\u4ec59.6%\u5b8f\u5e73\u5747\u7f3a\u9677\u6062\u590d\u7387\uff1b\u4f46\u82e5\u7ed9\u5b9a\u7f3a\u9677\u4f4d\u7f6e\uff0c\u751f\u6210\u6f84\u6e05\u884c\u52a8\u7684\u6210\u529f\u7387\u53ef\u8fbe80.6%\uff0c\u8bf4\u660e\u4e3b\u8981\u74f6\u9888\u5728\u7f3a\u9677\u5b9a\u4f4d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While Large Language Models (LLMs) have demonstrated impressive capabilities, they often struggle with extremely long contexts due to fixed context limits. To address this, sequential approaches like MemAgent extend the effective context by reading text in segments and iteratively updating a fixed-size memory. However, this sequential paradigm suffers from high latency and requires costly reinforcement learning (RL) training, which can lead to overfitting on specific datasets. To overcome these limitations, we propose ConvMem, a training-free, highly parallelizable framework that reformulates long-context reasoning as a hierarchical convolution. Inspired by CNNs, ConvMem treats an LLM prompted with a specific query as a convolutional kernel. This kernel summarizes text segments hierarchically, shortening the reasoning path from a linear chain into a logarithmic tree. Specifically, ConvMem integrates \\textit{Configurable Strides} and \\textit{Skip Connections} to ensure robust evidence capture and propagation, while employing \\textit{Multi-Kernel Convolution} to decompose complex queries into disentangled semantic channels. This design not only mitigates error accumulation but also enables massive parallelization across both text segments and reasoning threads. Experiments on RULER-HotpotQA and RULER-2WikiMultiHopQA demonstrate that ConvMem outperforms training-free baselines and avoids the risk of overfitting to parametric priors often observed in RL-trained models on out-of-distribution tasks.", "arxiv_id": "2609.10441", "arxiv_url": "https://arxiv.org/abs/2609.10441", "authors": ["Hongming Zhang", "Zhaozhen Gu", "Fengshuo Bai", "Ming Hao", "Qingyang Zhang", "Yuanyuan Wang", "Shiyang Tang", "Yanna Wang", "Bo Xu"], "brief": "ConvMem \u5c06\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u91cd\u6784\u4e3a\u5206\u5c42\u5377\u79ef\uff1a\u628a\u5e26\u67e5\u8be2\u63d0\u793a\u7684 LLM \u5f53\u4f5c\u5377\u79ef\u6838\uff0c\u5e76\u884c\u6c47\u603b\u6587\u672c\u7247\u6bb5\uff0c\u5c06\u7ebf\u6027\u8bb0\u5fc6\u66f4\u65b0\u7f29\u77ed\u4e3a\u5bf9\u6570\u7ea7\u63a8\u7406\u6811\u3002\u5b83\u65e0\u9700\u8bad\u7ec3\uff0c\u7ed3\u5408\u53ef\u914d\u7f6e\u6b65\u5e45\u3001\u8df3\u8fde\u548c\u591a\u6838\u5377\u79ef\uff0c\u5728 RULER \u591a\u8df3\u95ee\u7b54\u4efb\u52a1\u4e0a\u4f18\u4e8e\u5176\u4ed6\u514d\u8bad\u7ec3\u57fa\u7ebf\uff0c\u5e76\u964d\u4f4e RL \u8bad\u7ec3\u65b9\u6cd5\u7684\u8fc7\u62df\u5408\u98ce\u9669\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10441", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u5e76\u884c\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10441v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ConvMem: Convolutional Memory for Long-Context Reasoning", "tldr": "ConvMem \u5c06\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u91cd\u6784\u4e3a\u5206\u5c42\u5377\u79ef\uff1a\u628a\u5e26\u67e5\u8be2\u63d0\u793a\u7684 LLM \u5f53\u4f5c\u5377\u79ef\u6838\uff0c\u5e76\u884c\u6c47\u603b\u6587\u672c\u7247\u6bb5\uff0c\u5c06\u7ebf\u6027\u8bb0\u5fc6\u66f4\u65b0\u7f29\u77ed\u4e3a\u5bf9\u6570\u7ea7\u63a8\u7406\u6811\u3002\u5b83\u65e0\u9700\u8bad\u7ec3\uff0c\u7ed3\u5408\u53ef\u914d\u7f6e\u6b65\u5e45\u3001\u8df3\u8fde\u548c\u591a\u6838\u5377\u79ef\uff0c\u5728 RULER \u591a\u8df3\u95ee\u7b54\u4efb\u52a1\u4e0a\u4f18\u4e8e\u5176\u4ed6\u514d\u8bad\u7ec3\u57fa\u7ebf\uff0c\u5e76\u964d\u4f4e RL \u8bad\u7ec3\u65b9\u6cd5\u7684\u8fc7\u62df\u5408\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The growing complexity of content moderation policies presents a critical challenge for their consistent operationalization. While foundation models possess the basic capabilities needed to confront this challenge, whether they can reliably moderate online content remains an unanswered question. In this paper, we systematically compare two competing paradigms for Vision-Language Model (VLM) guidance: an instruction-driven approach where models reason from policy precepts, and an example-driven approach where they generalize from prior precedents. We ground this investigation in ModerationBench, a new benchmark of 4,000 manually annotated, in-the-wild posts from the Bluesky platform. Our experiments reveal that foundation models can substantially outperform Bluesky\u0027s deployed moderation system, nearly tripling its $F_1$ score (0.60 vs. 0.22) on Random Posts in the benchmark, with both instruction- and example-driven paradigms achieving comparable peak effectiveness. Our findings thus chart a path toward reliable and adaptable policy operationalization at scale.", "arxiv_id": "2609.10410", "arxiv_url": "https://arxiv.org/abs/2609.10410", "authors": ["Ayan Majumdar", "Shounak Paul", "Pushpdeep Singh", "Ines Abdelaziz", "Sayeh Jarollahi", "Seungeon Lee", "Krishna P. Gummadi", "Ingmar Weber", "Abhisek Dash"], "brief": "\u672c\u6587\u8bc4\u4f30\u57fa\u7840\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u5426\u7528\u4e8e\u5728\u7ebf\u5185\u5bb9\u5ba1\u6838\uff0c\u5e76\u6bd4\u8f83\u4e86\u57fa\u4e8e\u653f\u7b56\u6307\u4ee4\u63a8\u7406\u4e0e\u57fa\u4e8e\u6848\u4f8b\u793a\u4f8b\u6cdb\u5316\u4e24\u79cd\u7b56\u7565\u843d\u5730\u65b9\u5f0f\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 4000 \u6761 Bluesky \u771f\u5b9e\u5e16\u5b50\u7684\u65b0\u57fa\u51c6 ModerationBench\uff0c\u53d1\u73b0\u57fa\u7840\u6a21\u578b\u663e\u8457\u4f18\u4e8e Bluesky \u73b0\u6709\u5ba1\u6838\u7cfb\u7edf\uff0c\u968f\u673a\u5e16\u5b50\u4e0a\u7684 F1 \u4ece 0.22 \u63d0\u5347\u5230 0.60\uff0c\u4e14\u4e24\u79cd\u8303\u5f0f\u6548\u679c\u76f8\u8fd1\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10410", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5185\u5bb9\u5ba1\u6838", "\u57fa\u7840\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10410v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Can Foundation Models Moderate Online Content? Evaluating Instruction- vs. Example-Driven Policy Operationalization", "tldr": "\u672c\u6587\u8bc4\u4f30\u57fa\u7840\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u5426\u7528\u4e8e\u5728\u7ebf\u5185\u5bb9\u5ba1\u6838\uff0c\u5e76\u6bd4\u8f83\u4e86\u57fa\u4e8e\u653f\u7b56\u6307\u4ee4\u63a8\u7406\u4e0e\u57fa\u4e8e\u6848\u4f8b\u793a\u4f8b\u6cdb\u5316\u4e24\u79cd\u7b56\u7565\u843d\u5730\u65b9\u5f0f\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 4000 \u6761 Bluesky \u771f\u5b9e\u5e16\u5b50\u7684\u65b0\u57fa\u51c6 ModerationBench\uff0c\u53d1\u73b0\u57fa\u7840\u6a21\u578b\u663e\u8457\u4f18\u4e8e Bluesky \u73b0\u6709\u5ba1\u6838\u7cfb\u7edf\uff0c\u968f\u673a\u5e16\u5b50\u4e0a\u7684 F1 \u4ece 0.22 \u63d0\u5347\u5230 0.60\uff0c\u4e14\u4e24\u79cd\u8303\u5f0f\u6548\u679c\u76f8\u8fd1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video understanding has rapidly evolved toward video large language models (VideoLLMs): systems that couple video representations with pretrained large language models and condition generation on a textual prompt. Their strong performance on captioning, question answering, retrieval and temporal grounding comes at a computation and memory cost that grows with frame count and context length, limiting deployment in real-time, mobile and resource-constrained settings. This survey covers inference-efficiency mechanisms for visual and audiovisual VideoLLMs that report concrete reductions in parameter count, FLOPs per input, latency, memory, or visual and audio token count. We analyze bottlenecks across frame sampling, modality encoding, connector-level token reduction, and LLM prefilling and decoding. We organize methods by the pipeline stage at which they act, covering VideoLLMs developed since late 2022 together with earlier frame-sampling and vision-encoder mechanisms that remain components of current pipelines. We assemble literature-reported accuracy--cost comparisons under shared host models and input protocols wherever available, distinguish them from heterogeneous cross-paper evidence, and identify gaps in audiovisual efficiency and standardized evaluation. We maintain a repository at https://github.com/momentslab/awesome-efficient-videollm.", "arxiv_id": "2609.10355", "arxiv_url": "https://arxiv.org/abs/2609.10355", "authors": ["Killian Steunou", "Yannis Tevissen", "Moun\u00eem A. El Yacoubi"], "brief": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e86\u89c6\u9891\u4e0e\u97f3\u89c6\u9891\u5927\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u9636\u6bb5\u7684\u6548\u7387\u4f18\u5316\u673a\u5236\uff0c\u8986\u76d6\u5e27\u91c7\u6837\u3001\u6a21\u6001\u7f16\u7801\u3001\u8fde\u63a5\u5668 token \u538b\u7f29\u4ee5\u53ca LLM \u9884\u586b\u5145/\u89e3\u7801\u7b49\u73af\u8282\u3002\u8bba\u6587\u6c47\u603b\u4e86\u53c2\u6570\u91cf\u3001FLOPs\u3001\u5ef6\u8fdf\u3001\u663e\u5b58\u548c token \u6570\u7b49\u6210\u672c\u6307\u6807\u4e0b\u7684\u6548\u679c\u5bf9\u6bd4\uff0c\u5e76\u6307\u51fa\u97f3\u89c6\u9891\u6548\u7387\u4e0e\u6807\u51c6\u5316\u8bc4\u6d4b\u4ecd\u5b58\u5728\u660e\u663e\u7a7a\u767d\u3002", "categories": ["cs.CV", "cs.CL", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10355", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u5927\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u591a\u6a21\u6001", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10355v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Why Is Video Still So Expensive? A Survey of Inference-Efficiency Mechanisms in Video and Audiovisual LLMs", "tldr": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u4e86\u89c6\u9891\u4e0e\u97f3\u89c6\u9891\u5927\u8bed\u8a00\u6a21\u578b\u5728\u63a8\u7406\u9636\u6bb5\u7684\u6548\u7387\u4f18\u5316\u673a\u5236\uff0c\u8986\u76d6\u5e27\u91c7\u6837\u3001\u6a21\u6001\u7f16\u7801\u3001\u8fde\u63a5\u5668 token \u538b\u7f29\u4ee5\u53ca LLM \u9884\u586b\u5145/\u89e3\u7801\u7b49\u73af\u8282\u3002\u8bba\u6587\u6c47\u603b\u4e86\u53c2\u6570\u91cf\u3001FLOPs\u3001\u5ef6\u8fdf\u3001\u663e\u5b58\u548c token \u6570\u7b49\u6210\u672c\u6307\u6807\u4e0b\u7684\u6548\u679c\u5bf9\u6bd4\uff0c\u5e76\u6307\u51fa\u97f3\u89c6\u9891\u6548\u7387\u4e0e\u6807\u51c6\u5316\u8bc4\u6d4b\u4ecd\u5b58\u5728\u660e\u663e\u7a7a\u767d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM serving systems already reuse KV caches, but only when the reused text sits at the very start of the prompt. Two growing workloads break this condition: a retrieval-augmented generation server assembles a different set of retrieved chunks for every query, and a multi-agent coordinator reads reports written by other agents. Reused inside a new prompt, a cache carries the wrong positions and never attended to the other sources. The cache may also have been written by a different checkpoint of the same model family, which changes the stored values. Repair methods for such caches have appeared in three separate communities, each measured on its own terms, and existing benchmarks test only exact-prefix reuse, where nothing is lost. KVShareArena benchmarks KV-cache reuse across prompt contexts and model checkpoints on retrieved chunks and agent reports. It scores every method by the fraction of the gap it recovers between no cache and full recomputation, and charges compute, memory, and per-request latency with the cache in hand, reporting the one-time cost of building a cache separately. We find that correcting positions, which needs no recomputation, is enough until a question needs several sources at once. There, only methods that pay, by re-encoding part of the cache or by training, recover half to two thirds of the gap; unrepaired caches can be worse than no cache. Cache-compression methods that are harmless on a single prompt fall significantly behind position correction on freshly written agent reports. These patterns hold across three model boards. When a different checkpoint wrote the cache, training-free methods are barely affected, while an adapter trained on one checkpoint\u0027s caches loses quality. Harness, frozen querysets, and cost accounting ship as a pip package with an automated submission workflow and a public leaderboard.", "arxiv_id": "2609.10266", "arxiv_url": "https://arxiv.org/abs/2609.10266", "authors": ["Xi Shi", "Qian Lou"], "brief": "\u63d0\u51fa KVShareArena\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u6a21\u578b KV-Cache \u5728\u975e\u524d\u7f00\u4e0a\u4e0b\u6587\u548c\u4e0d\u540c\u6a21\u578b checkpoint \u95f4\u590d\u7528\u7684\u6548\u679c\u4e0e\u6210\u672c\u3002\u5b9e\u9a8c\u53d1\u73b0\u4f4d\u7f6e\u4fee\u6b63\u901a\u5e38\u8db3\u591f\uff0c\u4f46\u591a\u6e90\u95ee\u9898\u9700\u8981\u91cd\u7f16\u7801\u6216\u8bad\u7ec3\u65b9\u6cd5\u624d\u80fd\u6062\u590d\u7ea6\u4e00\u534a\u5230\u4e09\u5206\u4e4b\u4e8c\u6027\u80fd\uff1b\u672a\u4fee\u590d\u7f13\u5b58\u751a\u81f3\u53ef\u80fd\u5dee\u4e8e\u4e0d\u7528\u7f13\u5b58\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10266", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["KV\u7f13\u5b58", "\u5927\u6a21\u578b\u63a8\u7406", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10266v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "KVShareArena: KV-Cache Reuse Across Contexts and Model Checkpoints", "tldr": "\u63d0\u51fa KVShareArena\uff0c\u7528\u4e8e\u8bc4\u6d4b\u5927\u6a21\u578b KV-Cache \u5728\u975e\u524d\u7f00\u4e0a\u4e0b\u6587\u548c\u4e0d\u540c\u6a21\u578b checkpoint \u95f4\u590d\u7528\u7684\u6548\u679c\u4e0e\u6210\u672c\u3002\u5b9e\u9a8c\u53d1\u73b0\u4f4d\u7f6e\u4fee\u6b63\u901a\u5e38\u8db3\u591f\uff0c\u4f46\u591a\u6e90\u95ee\u9898\u9700\u8981\u91cd\u7f16\u7801\u6216\u8bad\u7ec3\u65b9\u6cd5\u624d\u80fd\u6062\u590d\u7ea6\u4e00\u534a\u5230\u4e09\u5206\u4e4b\u4e8c\u6027\u80fd\uff1b\u672a\u4fee\u590d\u7f13\u5b58\u751a\u81f3\u53ef\u80fd\u5dee\u4e8e\u4e0d\u7528\u7f13\u5b58\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We approach a cognitive simulation perspective on episodic and semantic memory in multiple-choice question answering by incorporating text from individual text corpora (ITC) into retrieval-augmented generation and DoRA fine-tuning. We web-crawl the search histories of 515 participants who answered 36 multiple-choice knowledge items and analyze a stratified subsample of 150 participants. For each participant, one DoRA adapter consolidates their ITC into a small language model (SLM) whose baseline correctness falls below the participants\u0027 lowest quartile. The adapter measurably writes the ITC into the weights: it fits its own participant\u0027s held-out text better than other participants\u0027 texts (dz =1.27), an individuality effect that increases with ITC size in rank order. On the generalized knowledge test, however, the adapter adds knowledge rather than alignment with the individual: log-loss match improves, whereas match accuracy under a bias-corrected PMI readout does not, and retrieval adds nothing on top. Our results demonstrate that ITCs can be consolidated into the weights of SLMs, an encouraging basis for individualized tutoring agents, and we discuss how to move from there toward a realistic simulation of episodic and semantic memory at the individual level.", "arxiv_id": "2609.10155", "arxiv_url": "https://arxiv.org/abs/2609.10155", "authors": ["Christoph Wigbels", "Ali Abusaleh", "Markus T. Jansen", "Alexander Mehler", "Markus J. Hofmann"], "brief": "\u672c\u6587\u5c06\u4e2a\u4f53\u6587\u672c\u8bed\u6599\uff08\u5982\u641c\u7d22\u5386\u53f2\uff09\u901a\u8fc7\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u548c DoRA \u5fae\u8c03\u6ce8\u5165\u5c0f\u8bed\u8a00\u6a21\u578b\uff0c\u7528\u4e8e\u6a21\u62df\u4e2a\u4f53\u7684\u60c5\u666f\u8bb0\u5fc6\u4e0e\u8bed\u4e49\u8bb0\u5fc6\u3002\u5b9e\u9a8c\u8868\u660e\uff0cDoRA \u9002\u914d\u5668\u80fd\u663e\u8457\u628a\u4e2a\u4eba\u8bed\u6599\u5199\u5165\u6a21\u578b\u6743\u91cd\uff0c\u5e76\u66f4\u597d\u62df\u5408\u5bf9\u5e94\u4e2a\u4f53\u7684\u4fdd\u7559\u6587\u672c\uff1b\u4f46\u5728\u901a\u7528\u77e5\u8bc6\u95ee\u7b54\u4e0a\u4e3b\u8981\u589e\u52a0\u77e5\u8bc6\u91cf\uff0c\u800c\u672a\u660e\u663e\u63d0\u5347\u4e0e\u4e2a\u4f53\u7b54\u6848\u7684\u4e00\u81f4\u6027\u3002", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10155", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "\u4e2a\u6027\u5316", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10155v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Retrieval to Weights: Parametric Individualization of Small Language Models with Individual Text Corpora", "tldr": "\u672c\u6587\u5c06\u4e2a\u4f53\u6587\u672c\u8bed\u6599\uff08\u5982\u641c\u7d22\u5386\u53f2\uff09\u901a\u8fc7\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u548c DoRA \u5fae\u8c03\u6ce8\u5165\u5c0f\u8bed\u8a00\u6a21\u578b\uff0c\u7528\u4e8e\u6a21\u62df\u4e2a\u4f53\u7684\u60c5\u666f\u8bb0\u5fc6\u4e0e\u8bed\u4e49\u8bb0\u5fc6\u3002\u5b9e\u9a8c\u8868\u660e\uff0cDoRA \u9002\u914d\u5668\u80fd\u663e\u8457\u628a\u4e2a\u4eba\u8bed\u6599\u5199\u5165\u6a21\u578b\u6743\u91cd\uff0c\u5e76\u66f4\u597d\u62df\u5408\u5bf9\u5e94\u4e2a\u4f53\u7684\u4fdd\u7559\u6587\u672c\uff1b\u4f46\u5728\u901a\u7528\u77e5\u8bc6\u95ee\u7b54\u4e0a\u4e3b\u8981\u589e\u52a0\u77e5\u8bc6\u91cf\uff0c\u800c\u672a\u660e\u663e\u63d0\u5347\u4e0e\u4e2a\u4f53\u7b54\u6848\u7684\u4e00\u81f4\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have become ubiquitous in software development, with LLM-based automated program repair tools increasingly used during code review. In this report, we explore the iterative blind use of LLMs as bug-fixers. Across multiple models and repair environments, we find that LLMs consistently claim to detect bugs in entirely bug-free programs while the rate of repair of buggy programs is less than that of the damage to correct programs. We also explore the long-term dynamics of this iterative process, and find that this frequently reaches a pseudo-bug-fixing cycle where the same changes are added and removed again ad infinitum. Lastly, via mechanistic probing, we unveil the existence of a steering vector which controls the editing propensity, suggesting that LLMs have an internal representation of ``buggy code\", and that this representation is what is falsely activated to induce pseudo-bug fixing. These results provide insight towards the dynamics of fully autonomous bug-fixing systems, as well as stopping conditions under ambiguous goals.", "arxiv_id": "2609.10123", "arxiv_url": "https://arxiv.org/abs/2609.10123", "authors": ["Xietao Wang-Lin", "Anton Isopoussu", "Louis Mahon"], "brief": "\u672c\u6587\u7814\u7a76\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u53cd\u590d\u3001\u76f2\u76ee\u5730\u7528\u4e8e\u81ea\u52a8\u4fee\u590d\u4ee3\u7801\u7f3a\u9677\u65f6\u7684\u52a8\u6001\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0cLLM \u7ecf\u5e38\u628a\u65e0\u7f3a\u9677\u7a0b\u5e8f\u8bef\u5224\u4e3a\u6709 bug\uff0c\u5e76\u4e14\u5bf9\u6b63\u786e\u4ee3\u7801\u9020\u6210\u7834\u574f\u7684\u6982\u7387\u9ad8\u4e8e\u6210\u529f\u4fee\u590d\u7f3a\u9677\u4ee3\u7801\u7684\u6982\u7387\uff1b\u957f\u671f\u8fed\u4ee3\u8fd8\u4f1a\u9677\u5165\u53cd\u590d\u6dfb\u52a0\u548c\u5220\u9664\u540c\u4e00\u4fee\u6539\u7684\u4f2a\u4fee\u590d\u5faa\u73af\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u901a\u8fc7\u673a\u5236\u63a2\u6d4b\u53d1\u73b0\u4e86\u63a7\u5236\u201c\u7f16\u8f91\u503e\u5411\u201d\u7684\u65b9\u5411\u5411\u91cf\uff0c\u8bf4\u660e\u6a21\u578b\u5185\u90e8\u53ef\u80fd\u5b58\u5728\u88ab\u8bef\u6fc0\u6d3b\u7684\u201c\u6709\u7f3a\u9677\u4ee3\u7801\u201d\u8868\u5f81\u3002", "categories": ["cs.SE", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10123", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7a0b\u5e8f\u4fee\u590d", "\u8f6f\u4ef6\u5de5\u7a0b", "\u673a\u5236\u89e3\u91ca"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10123v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "If It\u0027s Not Buggy, Don\u0027t Fix It: On the Dynamics of Iterative Bug-fixing with LLMs", "tldr": "\u672c\u6587\u7814\u7a76\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u53cd\u590d\u3001\u76f2\u76ee\u5730\u7528\u4e8e\u81ea\u52a8\u4fee\u590d\u4ee3\u7801\u7f3a\u9677\u65f6\u7684\u52a8\u6001\u884c\u4e3a\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0cLLM \u7ecf\u5e38\u628a\u65e0\u7f3a\u9677\u7a0b\u5e8f\u8bef\u5224\u4e3a\u6709 bug\uff0c\u5e76\u4e14\u5bf9\u6b63\u786e\u4ee3\u7801\u9020\u6210\u7834\u574f\u7684\u6982\u7387\u9ad8\u4e8e\u6210\u529f\u4fee\u590d\u7f3a\u9677\u4ee3\u7801\u7684\u6982\u7387\uff1b\u957f\u671f\u8fed\u4ee3\u8fd8\u4f1a\u9677\u5165\u53cd\u590d\u6dfb\u52a0\u548c\u5220\u9664\u540c\u4e00\u4fee\u6539\u7684\u4f2a\u4fee\u590d\u5faa\u73af\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u901a\u8fc7\u673a\u5236\u63a2\u6d4b\u53d1\u73b0\u4e86\u63a7\u5236\u201c\u7f16\u8f91\u503e\u5411\u201d\u7684\u65b9\u5411\u5411\u91cf\uff0c\u8bf4\u660e\u6a21\u578b\u5185\u90e8\u53ef\u80fd\u5b58\u5728\u88ab\u8bef\u6fc0\u6d3b\u7684\u201c\u6709\u7f3a\u9677\u4ee3\u7801\u201d\u8868\u5f81\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
