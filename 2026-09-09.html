 "\u8bba\u6587\u63d0\u51fa Self-Listening \u65b9\u6cd5\uff0c\u5c06\u7528\u6237\u8bed\u97f3\u3001\u6a21\u578b\u6587\u672c\u4e0e\u5b9e\u9645\u64ad\u653e\u51fa\u7684\u6a21\u578b\u8bed\u97f3\u4ea4\u9519\u8f93\u5165\u6a21\u578b\uff0c\u4f7f\u5168\u53cc\u5de5\u8bed\u97f3\u6a21\u578b\u5728\u88ab\u6253\u65ad\u540e\u80fd\u57fa\u4e8e\u7528\u6237\u771f\u6b63\u542c\u5230\u7684\u5185\u5bb9\u7ee7\u7eed\u56de\u5e94\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 AnchorSpeech \u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u7ed3\u6784\u5316\u6709\u5e8f\u56de\u7b54\u4e2d\u54ea\u4e9b\u9879\u76ee\u5df2\u88ab\u5b9e\u9645\u8bf4\u51fa\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u5b9e\u65f6\u8bed\u97f3\u4ea4\u4e92\u4e2d\u7684\u5173\u952e\u7ec6\u8282\u95ee\u9898\uff1a\u6a21\u578b\u4e0d\u4ec5\u8981\u80fd\u542c\u7528\u6237\uff0c\u4e5f\u8981\u77e5\u9053\u81ea\u5df1\u5b9e\u9645\u8bf4\u5230\u4e86\u54ea\u91cc\u3002Self-Listening \u4e3a\u66f4\u81ea\u7136\u3001\u53ef\u6253\u65ad\u3001\u53ef\u6062\u590d\u7684\u8bed\u97f3\u52a9\u624b\u63d0\u4f9b\u4e86\u5b9e\u7528\u673a\u5236\u3002"}, {"abstract": "Accurate estimation of clinically meaningful gait parameters from monocular video is important for scalable mobility assessment, yet progress is limited by the small scale, restricted viewpoints, and limited visual diversity of existing datasets. We introduce SynthGait-19k, a physically grounded synthetic video dataset containing 19,272 walking videos derived from 6,427 MoCap sequences across 437 subjects, with paired SMPL motion and annotations for six gait parameters. To construct the dataset, we develop Gait2Vid, which unifies heterogeneous MoCap recordings through SMPL and synthesizes diverse RGB walking videos under controllable viewpoints and scene appearances. We assess the generated videos for consistency with their conditioning gait kinematics and validate extracted gait events against force-platform measurements. Using SynthGait-19K, we benchmark direct RGB, pose-based, biomechanical, and human-mesh-recovery approaches and analyze viewpoint, training-data scale, and synthetic-to-real domain shift. We also introduce GaitXFormer as a direct RGB reference model for estimating gait parameters. Synthetic supervision transfers effectively to real videos across both GaitXFormer and a pose-based architecture, demonstrating utility across different representations. We further find that spatial gait parameters are more sensitive to visual domain shift and that improved HMR reconstruction alone does not necessarily translate to improved downstream gait estimation.", "arxiv_id": "2609.08108", "arxiv_url": "https://arxiv.org/abs/2609.08108", "authors": ["Soroush Mehraban", "Xin Lei Lin", "Vida Adeli", "Majid Mirmehdi", "Amirhossein Dadashzadeh", "Clint Hansen", "Andrea Iaboni", "Babak Taati"], "brief": "\u8bba\u6587\u63d0\u51fa SynthGait-19K\uff0c\u4e00\u4e2a\u7269\u7406\u7ea6\u675f\u7684\u5408\u6210\u5355\u76ee\u6b65\u6001\u89c6\u9891\u6570\u636e\u96c6\uff0c\u5305\u542b 19,272 \u6bb5\u7531 MoCap \u548c SMPL \u9a71\u52a8\u751f\u6210\u7684\u884c\u8d70\u89c6\u9891\uff0c\u5e76\u6807\u6ce8 6 \u7c7b\u4e34\u5e8a\u76f8\u5173\u6b65\u6001\u53c2\u6570\u3002\u4f5c\u8005\u540c\u65f6\u6784\u5efa Gait2Vid \u751f\u6210\u6d41\u7a0b\u548c GaitXFormer \u57fa\u7ebf\u6a21\u578b\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u6d4b\u5408\u6210\u6570\u636e\u5230\u771f\u5b9e\u89c6\u9891\u7684\u8fc1\u79fb\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/TaatiTeam/SynthGait-19k", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.08108", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6570\u636e\u96c6\u7531 6,427 \u6bb5 MoCap \u5e8f\u5217\u3001437 \u540d\u53d7\u8bd5\u8005\u751f\u6210\uff0c\u652f\u6301\u53ef\u63a7\u89c6\u89d2\u3001\u573a\u666f\u5916\u89c2\u548c\u914d\u5bf9 SMPL \u8fd0\u52a8\u6807\u6ce8\u3002", "\u8bc4\u6d4b\u4e86\u76f4\u63a5 RGB\u3001\u59ff\u6001\u9a71\u52a8\u3001\u751f\u7269\u529b\u5b66\u5efa\u6a21\u548c\u4eba\u4f53\u7f51\u683c\u6062\u590d\u7b49\u591a\u7c7b\u6b65\u6001\u53c2\u6570\u4f30\u8ba1\u65b9\u6cd5\u3002", "\u53d1\u73b0\u5408\u6210\u76d1\u7763\u53ef\u6709\u6548\u8fc1\u79fb\u5230\u771f\u5b9e\u89c6\u9891\uff0c\u4f46\u7a7a\u95f4\u6b65\u6001\u53c2\u6570\u66f4\u53d7\u89c6\u89c9\u57df\u504f\u79fb\u5f71\u54cd\uff0c\u4e14\u66f4\u597d\u7684 HMR \u91cd\u5efa\u4e0d\u4e00\u5b9a\u5e26\u6765\u66f4\u597d\u7684\u6b65\u6001\u4f30\u8ba1\u3002"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u5408\u6210\u6570\u636e", "\u4eba\u4f53\u8fd0\u52a8", "\u533b\u5b66\u5f71\u50cf"], "num_comments": 2, "on_hf": true, "organization": "University of Toronto", "pdf_url": "https://arxiv.org/pdf/2609.08108v1", "published_at": "2026-09-08", "score": 0.26, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08108.png", "title": "SynthGait-19K: A Physically Grounded Synthetic Video Dataset for Gait Parameter Estimation", "tldr": "\u5927\u89c4\u6a21\u5408\u6210\u6b65\u6001\u89c6\u9891\u63d0\u5347\u5355\u76ee\u6b65\u6001\u4f30\u8ba1", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa SynthGait-19K\uff0c\u4e00\u4e2a\u7269\u7406\u7ea6\u675f\u7684\u5408\u6210\u5355\u76ee\u6b65\u6001\u89c6\u9891\u6570\u636e\u96c6\uff0c\u5305\u542b 19,272 \u6bb5\u7531 MoCap \u548c SMPL \u9a71\u52a8\u751f\u6210\u7684\u884c\u8d70\u89c6\u9891\uff0c\u5e76\u6807\u6ce8 6 \u7c7b\u4e34\u5e8a\u76f8\u5173\u6b65\u6001\u53c2\u6570\u3002\u4f5c\u8005\u540c\u65f6\u6784\u5efa Gait2Vid \u751f\u6210\u6d41\u7a0b\u548c GaitXFormer \u57fa\u7ebf\u6a21\u578b\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u6d4b\u5408\u6210\u6570\u636e\u5230\u771f\u5b9e\u89c6\u9891\u7684\u8fc1\u79fb\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7f13\u89e3\u4e86\u4e34\u5e8a\u6b65\u6001\u89c6\u9891\u6570\u636e\u89c4\u6a21\u5c0f\u3001\u89c6\u89d2\u53d7\u9650\u548c\u89c6\u89c9\u591a\u6837\u6027\u4e0d\u8db3\u7684\u95ee\u9898\uff0c\u4e3a\u53ef\u6269\u5c55\u79fb\u52a8\u80fd\u529b\u8bc4\u4f30\u63d0\u4f9b\u4e86\u5927\u89c4\u6a21\u5408\u6210\u76d1\u7763\u8d44\u6e90\uff0c\u5e76\u63ed\u793a\u4e86\u5408\u6210\u5230\u771f\u5b9e\u8fc1\u79fb\u548c\u4e0b\u6e38\u6b65\u6001\u4f30\u8ba1\u4e2d\u7684\u5173\u952e\u9650\u5236\u3002"}, {"abstract": "Compressing large-scale neural networks is essential for deploying models on resource-constrained devices. Most existing methods adopt weight pruning or low-bit quantization individually, often resulting in suboptimal compression rates to preserve acceptable performance drops. We introduce a unified framework for simultaneous pruning and low-bit quantization via Bayesian variational learning (\\method), which achieves higher compression rates than prior baselines while maintaining comparable performance. The key idea is to employ a spike-and-slab prior to induce sparsity and model quantized weights using Gaussian Mixture Models (GMMs) to enable low-bit precision. Due to the intractability of the objective involving spike-and-slab priors with GMMs, we derive an efficient approximation that facilitates effective compression with minimal accuracy loss. In theory, we provide a consistent result for our proposed variational approach to a sparse and quantized deep neural network. Extensive experiments on compressing ResNet, BERT-base, Llama3.2, and Qwen2.5 models show that our method achieves higher compression rates than a line of existing methods with comparable performance drops. Project page: https://comeusr.github.io/SQS_Webpage.", "arxiv_id": "2510.08999", "arxiv_url": "https://arxiv.org/abs/2510.08999", "authors": ["Ziyi Wang", "Nan Jiang", "Guang Lin", "Qifan Song"], "brief": "\u8bba\u6587\u63d0\u51fa SQS\uff0c\u4e00\u79cd\u57fa\u4e8e\u8d1d\u53f6\u65af\u53d8\u5206\u5b66\u4e60\u7684\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u538b\u7f29\u65b9\u6cd5\uff0c\u5c06\u6743\u91cd\u526a\u679d\u548c\u4f4e\u6bd4\u7279\u91cf\u5316\u7edf\u4e00\u5efa\u6a21\u3002\u5b83\u7528 spike-and-slab \u5148\u9a8c\u8bf1\u5bfc\u7a00\u758f\u6027\uff0c\u5e76\u7528\u9ad8\u65af\u6df7\u5408\u6a21\u578b\u523b\u753b\u91cf\u5316\u6743\u91cd\u5206\u5e03\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/comeusr/SQS_TMLR", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2510.08999", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7 spike-and-slab \u5148\u9a8c\u5b9e\u73b0\u6743\u91cd\u7a00\u758f\u5316\uff0c\u540c\u65f6\u7528 GMM \u652f\u6301\u4f4e\u6bd4\u7279\u91cf\u5316\uff0c\u907f\u514d\u5355\u72ec\u526a\u679d\u6216\u91cf\u5316\u5e26\u6765\u7684\u538b\u7f29\u7387\u74f6\u9888", "\u9488\u5bf9 spike-and-slab \u4e0e GMM \u7ec4\u5408\u5bfc\u81f4\u7684\u4e0d\u53ef\u89e3\u76ee\u6807\uff0c\u63a8\u5bfc\u4e86\u9ad8\u6548\u8fd1\u4f3c\u53d8\u5206\u4f18\u5316\u65b9\u6cd5", "\u5728 ResNet\u3001BERT-base\u3001Llama3.2\u3001Qwen2.5 \u7b49\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff0c\u76f8\u6bd4\u591a\u79cd\u57fa\u7ebf\u83b7\u5f97\u66f4\u9ad8\u538b\u7f29\u7387\u4e14\u6027\u80fd\u4e0b\u964d\u76f8\u8fd1"], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u8d1d\u53f6\u65af\u5b66\u4e60", "\u526a\u679d", "\u91cf\u5316"], "num_comments": 2, "on_hf": true, "organization": "Purdue University", "pdf_url": "https://arxiv.org/pdf/2510.08999v2", "published_at": "2025-10-10", "score": 0.254, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2510.08999.png", "title": "SQS: Bayesian DNN Compression through Sparse Quantized Sub-distributions", "tldr": "\u8d1d\u53f6\u65af\u6846\u67b6\u7edf\u4e00\u5b9e\u73b0\u526a\u679d\u4e0e\u4f4e\u6bd4\u7279\u91cf\u5316", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa SQS\uff0c\u4e00\u79cd\u57fa\u4e8e\u8d1d\u53f6\u65af\u53d8\u5206\u5b66\u4e60\u7684\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u538b\u7f29\u65b9\u6cd5\uff0c\u5c06\u6743\u91cd\u526a\u679d\u548c\u4f4e\u6bd4\u7279\u91cf\u5316\u7edf\u4e00\u5efa\u6a21\u3002\u5b83\u7528 spike-and-slab \u5148\u9a8c\u8bf1\u5bfc\u7a00\u758f\u6027\uff0c\u5e76\u7528\u9ad8\u65af\u6df7\u5408\u6a21\u578b\u523b\u753b\u91cf\u5316\u6743\u91cd\u5206\u5e03\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u7a00\u758f\u5316\u548c\u91cf\u5316\u7eb3\u5165\u7edf\u4e00\u8d1d\u53f6\u65af\u5b66\u4e60\u6846\u67b6\uff0c\u5e76\u7ed9\u51fa\u4e00\u81f4\u6027\u7406\u8bba\u7ed3\u679c\uff0c\u9002\u7528\u4e8e\u4ece\u89c6\u89c9\u6a21\u578b\u5230\u5927\u8bed\u8a00\u6a21\u578b\u7684\u538b\u7f29\uff0c\u5177\u6709\u8f83\u5f3a\u90e8\u7f72\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) have demonstrated remarkable capabilities in reasoning and code generation, raising the prospect that they could assist in developing and optimizing the very infrastructure that powers them. However, existing benchmarks mainly focus on isolated kernels, predefined operators, or pre-specified optimization targets, and therefore fail to evaluate the ability of LLMs to perform open-ended, long-horizon LLM infrastructure engineering. To address this gap, we present $\u03a6$-Bench, a benchmark for systematically evaluating LLMs on engineering the LLM infrastructure stack. Derived from optimization problems studied in frontier research and grounded in real-world code repositories, $\u03a6$-Bench provides broad coverage of the LLM infrastructure stack and spans tasks of varying complexity, ranging from localized kernel-level function completion to long-horizon implementation and end-to-end system optimization. Extensive experiments on frontier LLMs reveal their current capabilities and limitations in engineering complex LLM infrastructure, offering insights into the challenges that remain on the path toward autonomous optimization of future AI infrastructure.", "arxiv_id": "2609.10226", "arxiv_url": "https://arxiv.org/abs/2609.10226", "authors": ["Leilei Ding", "Shumin Wang", "Yuting Huang", "Fanqi Wan", "Yinmin Zhang", "Qi Han", "Yiming Xu", "Feiyuan Zhang", "Xiaomeng Chu", "Guoliang You", "Wuyang Zhang", "Daxin Jiang", "Yanyong Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa \u03a6-Bench\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u57fa\u7840\u8bbe\u65bd\u5de5\u7a0b\u80fd\u529b\u7684\u7cfb\u7edf\u6027\u57fa\u51c6\u3002\u5b83\u57fa\u4e8e\u524d\u6cbf\u7814\u7a76\u4e2d\u7684\u4f18\u5316\u95ee\u9898\u548c\u771f\u5b9e\u4ee3\u7801\u4ed3\u5e93\uff0c\u8986\u76d6\u4ece\u5185\u6838\u51fd\u6570\u8865\u5168\u5230\u957f\u7a0b\u5b9e\u73b0\u4e0e\u7aef\u5230\u7aef\u7cfb\u7edf\u4f18\u5316\u7684\u591a\u5c42\u4efb\u52a1\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/one2piece2hello/faibench_Frontier_InfraBench", "github_stars": 54, "hf_url": "https://huggingface.co/papers/2609.10226", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u76f8\u6bd4\u53ea\u8bc4\u6d4b\u5b64\u7acb\u7b97\u5b50\u6216\u56fa\u5b9a\u4f18\u5316\u76ee\u6807\u7684\u73b0\u6709\u57fa\u51c6\uff0c\u03a6-Bench\u5f3a\u8c03\u5f00\u653e\u5f0f\u3001\u957f\u94fe\u8def\u7684\u57fa\u7840\u8bbe\u65bd\u5de5\u7a0b\u4efb\u52a1", "\u4efb\u52a1\u8986\u76d6 LLM infrastructure stack\uff0c\u5305\u62ec kernel-level optimization\u3001\u957f\u7a0b\u4ee3\u7801\u5b9e\u73b0\u548c\u7aef\u5230\u7aef\u7cfb\u7edf\u4f18\u5316", "\u5bf9\u524d\u6cbf LLM \u7684\u5b9e\u9a8c\u63ed\u793a\u4e86\u5176\u5728\u590d\u6742\u57fa\u7840\u8bbe\u65bd\u5de5\u7a0b\u4e2d\u7684\u80fd\u529b\u8fb9\u754c\u4e0e\u4e3b\u8981\u77ed\u677f"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u7cfb\u7edf\u4f18\u5316", "\u5927\u6a21\u578b\u8bc4\u6d4b", "AI\u57fa\u7840\u8bbe\u65bd"], "num_comments": 0, "on_hf": true, "organization": "StepFun", "pdf_url": "https://arxiv.org/pdf/2609.10226v1", "published_at": "2026-09-09", "score": 0.253, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.10226.png", "title": "$\u03a6$-Bench: Can Large Language Models Engineer the Infrastructure That Powers Them?", "tldr": "\u8bc4\u6d4bLLM\u80fd\u5426\u81ea\u4e3b\u4f18\u5316\u81ea\u8eab\u57fa\u7840\u8bbe\u65bd", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa \u03a6-Bench\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u57fa\u7840\u8bbe\u65bd\u5de5\u7a0b\u80fd\u529b\u7684\u7cfb\u7edf\u6027\u57fa\u51c6\u3002\u5b83\u57fa\u4e8e\u524d\u6cbf\u7814\u7a76\u4e2d\u7684\u4f18\u5316\u95ee\u9898\u548c\u771f\u5b9e\u4ee3\u7801\u4ed3\u5e93\uff0c\u8986\u76d6\u4ece\u5185\u6838\u51fd\u6570\u8865\u5168\u5230\u957f\u7a0b\u5b9e\u73b0\u4e0e\u7aef\u5230\u7aef\u7cfb\u7edf\u4f18\u5316\u7684\u591a\u5c42\u4efb\u52a1\u3002", "why_notable": "\u8be5\u57fa\u51c6\u76f4\u63a5\u9762\u5411\u201c\u8ba9 LLM \u4f18\u5316\u652f\u6491\u81ea\u8eab\u8fd0\u884c\u7684\u7cfb\u7edf\u201d\u8fd9\u4e00\u5173\u952e\u65b9\u5411\uff0c\u6709\u52a9\u4e8e\u8861\u91cf\u672a\u6765 AI \u57fa\u7840\u8bbe\u65bd\u81ea\u52a8\u5316\u4f18\u5316\u7684\u53ef\u884c\u6027\u4e0e\u74f6\u9888\u3002"}, {"abstract": "Modern LLM-based agents operate through a harness of tools, reusable skills, and specialist agents that shapes what they observe and what they can do. In practice, this harness continually evolves as new capabilities are added. We introduce EVOHARNESSBENCH, a benchmark for evaluating agents under controlled harness evolution across three axes (tools, skills, and agents). Unlike existing continual-learning benchmarks for agents, which typically place non-stationarity (i.e., what changes over time) in the task stream while keeping the harness fixed, EVOHARNESSBENCH places non-stationarity in the externally supplied harness itself. It contains 17 multi-stage harness streams constructed deterministically from verifier-based benchmarks, comprising 802 tasks, 520 tools, 42 skills, and 62 agents. We evaluate two complementary settings corresponding to the central challenges of harness evolution: deployment evaluation, which isolates retention of previously accessible competence as the harness expands, and self-evolving adaptation evaluation, which tests whether accumulated experience remains useful as new capabilities are introduced. Our results reveal three persistent gaps. First, harness expansion alone can degrade performance on previously solved tasks, producing harness-induced forgetting. Second, gains from self-evolving adaptation remain inconsistent across stages of harness evolution, capability axes, and environments. Third, retention and adaptation can pull in different directions: preserving earlier competence does not necessarily improve adaptation to newly introduced capabilities, and vice versa. These results establish harness evolution as a distinct challenge for building agents that can keep pace with an evolving harness while preserving previously effective behavior.", "arxiv_id": "2609.04280", "arxiv_url": "https://arxiv.org/abs/2609.04280", "authors": ["Zixuan Ke", "Vaidehi Patil", "Haizhou Shi", "Yang Li", "Ye Liu", "Sarath Shekkizhar", "Anurag Koul", "Jiayu Wang", "Xuan Phi Nguyen", "Semih Yavuz", "Mohit Bansal", "Shafiq Joty"], "brief": "\u8bba\u6587\u63d0\u51fa EVOHARNESSBENCH\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u3001\u6280\u80fd\u548c\u5b50\u667a\u80fd\u4f53\u7b49\u5916\u90e8 harness \u6f14\u5316\u65f6\u7684\u8868\u73b0\u3002\u5b83\u5c06\u975e\u5e73\u7a33\u6027\u4ece\u4efb\u52a1\u6d41\u8f6c\u79fb\u5230\u667a\u80fd\u4f53\u53ef\u7528\u80fd\u529b\u6846\u67b6\u672c\u8eab\uff0c\u8986\u76d6 17 \u6761\u591a\u9636\u6bb5\u6f14\u5316\u6d41\u3001802 \u4e2a\u4efb\u52a1\u3001520 \u4e2a\u5de5\u5177\u300142 \u4e2a\u6280\u80fd\u548c 62 \u4e2a\u667a\u80fd\u4f53\u3002", "categories": ["cs.MA", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04280", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4ece\u5de5\u5177\u3001\u53ef\u590d\u7528\u6280\u80fd\u3001\u4e13\u5bb6\u667a\u80fd\u4f53\u4e09\u6761\u8f74\u7ebf\u6784\u9020\u53ef\u63a7\u7684 harness \u6f14\u5316\u573a\u666f\u3002", "\u8bbe\u8ba1\u90e8\u7f72\u8bc4\u4f30\u4e0e\u81ea\u6f14\u5316\u9002\u5e94\u8bc4\u4f30\uff0c\u5206\u522b\u8003\u5bdf\u65e7\u80fd\u529b\u4fdd\u6301\u4e0e\u65b0\u80fd\u529b\u9002\u5e94\u3002", "\u53d1\u73b0 harness \u6269\u5c55\u4f1a\u5bfc\u81f4\u5df2\u89e3\u51b3\u4efb\u52a1\u6027\u80fd\u4e0b\u964d\uff0c\u5373 harness-induced forgetting\uff0c\u4e14\u4fdd\u6301\u65e7\u80fd\u529b\u4e0e\u9002\u5e94\u65b0\u80fd\u529b\u5e76\u4e0d\u603b\u662f\u4e00\u81f4\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u5de5\u5177\u4f7f\u7528", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Salesforce AI Research", "pdf_url": "https://arxiv.org/pdf/2609.04280v1", "published_at": "2026-09-03", "score": 0.249, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04280.png", "title": "EVOHARNESSBENCH: Can Your Agents Keep Pace with an Evolving Harness?", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u80fd\u5426\u9002\u5e94\u4e0d\u65ad\u6f14\u5316\u7684\u5de5\u5177\u6846\u67b6", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa EVOHARNESSBENCH\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u3001\u6280\u80fd\u548c\u5b50\u667a\u80fd\u4f53\u7b49\u5916\u90e8 harness \u6f14\u5316\u65f6\u7684\u8868\u73b0\u3002\u5b83\u5c06\u975e\u5e73\u7a33\u6027\u4ece\u4efb\u52a1\u6d41\u8f6c\u79fb\u5230\u667a\u80fd\u4f53\u53ef\u7528\u80fd\u529b\u6846\u67b6\u672c\u8eab\uff0c\u8986\u76d6 17 \u6761\u591a\u9636\u6bb5\u6f14\u5316\u6d41\u3001802 \u4e2a\u4efb\u52a1\u3001520 \u4e2a\u5de5\u5177\u300142 \u4e2a\u6280\u80fd\u548c 62 \u4e2a\u667a\u80fd\u4f53\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u7684\u4e00\u4e2a\u73b0\u5b9e\u4f46\u5c11\u88ab\u7cfb\u7edf\u8bc4\u4f30\u7684\u95ee\u9898\uff1a\u5916\u90e8\u5de5\u5177\u548c\u80fd\u529b\u6846\u67b6\u4f1a\u6301\u7eed\u53d8\u5316\u3002EVOHARNESSBENCH \u4e3a\u7814\u7a76\u667a\u80fd\u4f53\u5728\u52a8\u6001\u5de5\u5177\u751f\u6001\u4e2d\u7684\u9057\u5fd8\u3001\u8fc1\u79fb\u548c\u9002\u5e94\u80fd\u529b\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u57fa\u51c6\uff0c\u5bf9\u6784\u5efa\u957f\u671f\u53ef\u7528\u7684 LLM agent \u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Chain-of-Thought (CoT) improves the reasoning ability of Large Language Models (LLMs) but incurs substantial computation and context costs. Existing methods either lose intermediate information through hard pruning or lack a principled criterion for continuous compression. We present A*-Thought-V2, a geometric dynamics of LLM guided framework that models CoT as a hidden-state trajectory and replaces hard deletion with an explicit-implicit interleaved latent architecture. After projecting question, step, and solution representations into a 3D PCA space, it measures alignment between each local transition and global question-to-solution direction. Aligned steps remain explicit text, whereas deviating steps are compressed into continuous latent tokens. Directional angles capture both local semantics and reasoning dynamics: small angles indicate direct execution and answer formation, while large angles more frequently involve checking, correction, and branch exploration; their temporal variation reveals exploration, convergence, and refinement stages. To train this architecture, we introduce stepwise embedding forcing, which pools each redundant step into a single latent embedding, and label forcing, which supervises that latent token with a soft multi-modal vocabulary distribution instead of a hard one-hot label. Experiments on Qwen3.5-9B and Qwen3.6-27B across six in-domain and out-of-domain benchmarks show that A*-Thought-V2 improves average accuracy by up to 2.6% while reducing response length by up to half, increasing Accuracy per Computation Unit by 2.29$\\times$, and reducing preprocessing and training time by 94.6% and up to 80.3%, respectively. Representation analyses suggest that latent states form a compact region distinct from textual states, while higher entropy at latent-token positions reflects broader soft targets that encourage richer step-level feature learning.", "arxiv_id": "2609.07821", "arxiv_url": "https://arxiv.org/abs/2609.07821", "authors": ["Xiaoang Xu", "Siyuan Liu", "Shuo Wang", "Junlan Feng", "Fanyu Meng", "Zhu Zhang", "Jixun Wang", "Xiaorong Wang", "Zihan Zhou", "Xin Li", "Chaojun Xiao", "Yiming Zhang", "Huijia Wu", "Liuyu Xiang", "Peipei Li", "Zhaofeng He"], "brief": "\u8bba\u6587\u63d0\u51fa A*-Thought-V2\uff0c\u5c06\u94fe\u5f0f\u601d\u7ef4\u89c6\u4e3a LLM \u9690\u72b6\u6001\u8f68\u8ff9\uff0c\u5e76\u7528\u51e0\u4f55\u65b9\u5411\u5bf9\u9f50\u6765\u51b3\u5b9a\u54ea\u4e9b\u63a8\u7406\u6b65\u9aa4\u4fdd\u7559\u4e3a\u6587\u672c\u3001\u54ea\u4e9b\u538b\u7f29\u4e3a\u8fde\u7eed\u6f5c\u5728 token\u3002\u5b83\u6784\u5efa\u663e\u5f0f\u6587\u672c\u4e0e\u9690\u5f0f\u6f5c\u53d8\u91cf\u4ea4\u9519\u7684\u63a8\u7406\u67b6\u6784\uff0c\u4ee5\u964d\u4f4e CoT \u7684\u4e0a\u4e0b\u6587\u548c\u8ba1\u7b97\u5f00\u9500\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07821", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u95ee\u9898\u3001\u6b65\u9aa4\u3001\u7b54\u6848\u8868\u5f81\u6295\u5f71\u5230 3D PCA \u7a7a\u95f4\uff0c\u8ba1\u7b97\u5c40\u90e8\u63a8\u7406\u8f6c\u79fb\u4e0e\u5168\u5c40\u95ee\u9898\u5230\u7b54\u6848\u65b9\u5411\u7684\u5939\u89d2\uff0c\u4f5c\u4e3a\u538b\u7f29\u6216\u4fdd\u7559\u6b65\u9aa4\u7684\u51c6\u5219\u3002", "\u63d0\u51fa stepwise embedding forcing\uff0c\u5c06\u5197\u4f59\u6b65\u9aa4\u6c60\u5316\u4e3a\u5355\u4e2a\u6f5c\u5728\u5d4c\u5165\uff1b\u5e76\u7528 label forcing \u4ee5\u8f6f\u591a\u6a21\u6001\u8bcd\u8868\u5206\u5e03\u76d1\u7763\u6f5c\u5728 token\u3002", "\u5728 Qwen3.5-9B \u548c Qwen3.6-27B \u7684\u516d\u4e2a\u57fa\u51c6\u4e0a\uff0c\u5e73\u5747\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u5347 2.6%\uff0c\u54cd\u5e94\u957f\u5ea6\u6700\u591a\u51cf\u534a\uff0cAccuracy per Computation Unit \u63d0\u5347 2.29 \u500d\u3002"], "keywords": ["\u94fe\u5f0f\u601d\u7ef4", "\u6f5c\u5728\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07821v1", "published_at": "2026-09-07", "score": 0.247, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07821.png", "title": "A*-Thought-V2: Efficient Latent Reasoning via Geometric Dynamics of LLM", "tldr": "\u7528\u51e0\u4f55\u8f68\u8ff9\u538b\u7f29CoT\uff0c\u7701\u7b97\u529b\u8fd8\u63d0\u7cbe\u5ea6", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa A*-Thought-V2\uff0c\u5c06\u94fe\u5f0f\u601d\u7ef4\u89c6\u4e3a LLM \u9690\u72b6\u6001\u8f68\u8ff9\uff0c\u5e76\u7528\u51e0\u4f55\u65b9\u5411\u5bf9\u9f50\u6765\u51b3\u5b9a\u54ea\u4e9b\u63a8\u7406\u6b65\u9aa4\u4fdd\u7559\u4e3a\u6587\u672c\u3001\u54ea\u4e9b\u538b\u7f29\u4e3a\u8fde\u7eed\u6f5c\u5728 token\u3002\u5b83\u6784\u5efa\u663e\u5f0f\u6587\u672c\u4e0e\u9690\u5f0f\u6f5c\u53d8\u91cf\u4ea4\u9519\u7684\u63a8\u7406\u67b6\u6784\uff0c\u4ee5\u964d\u4f4e CoT \u7684\u4e0a\u4e0b\u6587\u548c\u8ba1\u7b97\u5f00\u9500\u3002", "why_notable": "\u5b83\u4e3a CoT \u538b\u7f29\u63d0\u4f9b\u4e86\u6bd4\u786c\u526a\u679d\u66f4\u7ec6\u7c92\u5ea6\u3001\u53ef\u89e3\u91ca\u7684\u51e0\u4f55\u5224\u636e\uff0c\u5728\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u63a8\u7406\u6027\u80fd\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u751f\u6210\u957f\u5ea6\u3001\u9884\u5904\u7406\u548c\u8bad\u7ec3\u6210\u672c\uff0c\u5bf9\u9ad8\u6548\u63a8\u7406\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) perform strongly on general visual understanding tasks such as visual question answering, yet they often struggle with a basic comparative skill: identifying what has changed between two similar images. We introduce VDiff-Bench, a challenging multiple-choice benchmark for fine-grained Image Difference Identification. VDiff-Bench contains 1,756 four-way questions over image pairs and covers 10 change categories: position, motion, regional image color, overall image color, appearance/disappearance, noise/resolution, texture, substitution/size, OCR/text, and illumination. Each question corresponds to two image inputs with 4 choices: the true difference, two hard negative descriptions, and a \"no difference\" distractor. To make the task challenging, we specifically curate ground-truth-conditioned negatives that require models to distinguish the actual change from nearby semantic alternatives. Experiments with 11 state-of-the-art open- and closed-source MLLMs show that fine-grained visual comparison remains brittle: models exhibit uneven performance across sources and change categories, with persistent failures on subtle low-level changes like noises and textures. For instance, three 7-8B-scale open-source MLLMs score 52.5-70.6% on semantic changes but only 8.7-33.3% on low-level changes like noise and texture, falsely assuming no changes between two image inputs. Surprisingly, despite strong performance of other closed-source commercial models, Grok 4.3 demonstrate remarkable performance drop on identifying noise and texture differences between images, falling significantly behind large open-source models like Kimi K2.5 and K3. Overall, VDiff-Bench provides a targeted diagnostic for evaluating comparative visual understanding in MLLMs, exposing failures that are not captured by standard single-image vision-language tasks.", "arxiv_id": "2609.06245", "arxiv_url": "https://arxiv.org/abs/2609.06245", "authors": ["Yixin Wan", "Tianle Zheng", "Kai-Wei Chang"], "brief": "\u63d0\u51fa VDiff-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u7ec6\u7c92\u5ea6\u56fe\u50cf\u5dee\u5f02\u8bc6\u522b\u7684\u591a\u9009\u57fa\u51c6\uff0c\u8981\u6c42\u6a21\u578b\u6bd4\u8f83\u4e24\u5f20\u76f8\u4f3c\u56fe\u50cf\u5e76\u5224\u65ad\u771f\u5b9e\u53d8\u5316\u3002\u57fa\u51c6\u8986\u76d6\u4f4d\u7f6e\u3001\u989c\u8272\u3001\u7eb9\u7406\u3001\u566a\u58f0\u3001OCR\u3001\u5149\u7167\u7b4910\u7c7b\u53d8\u5316\uff0c\u5e76\u7528\u5f3a\u5e72\u6270\u8d1f\u4f8b\u68c0\u9a8c\u6a21\u578b\u7684\u7cbe\u7ec6\u89c6\u89c9\u6bd4\u8f83\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06245", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5305\u542b1756\u9053\u56db\u9009\u4e00\u95ee\u9898\uff0c\u6bcf\u9898\u7531\u4e24\u5f20\u56fe\u50cf\u3001\u4e00\u4e2a\u771f\u5b9e\u5dee\u5f02\u3001\u4e24\u4e2a\u8bed\u4e49\u76f8\u8fd1\u786c\u8d1f\u4f8b\u548c\u4e00\u4e2a\u201c\u65e0\u5dee\u5f02\u201d\u5e72\u6270\u9879\u7ec4\u6210", "\u8bc4\u6d4b11\u4e2a\u5f00\u6e90\u4e0e\u95ed\u6e90\u5148\u8fdbMLLM\uff0c\u53d1\u73b0\u6a21\u578b\u5728\u4e0d\u540c\u6570\u636e\u6e90\u548c\u53d8\u5316\u7c7b\u522b\u4e0a\u7684\u8868\u73b0\u5f88\u4e0d\u5747\u8861", "7-8B\u5f00\u6e90\u6a21\u578b\u5728\u8bed\u4e49\u53d8\u5316\u4e0a\u53ef\u8fbe52.5%-70.6%\uff0c\u4f46\u5728\u566a\u58f0\u3001\u7eb9\u7406\u7b49\u4f4e\u5c42\u53d8\u5316\u4e0a\u4ec58.7%-33.3%\uff0c\u5e38\u8bef\u5224\u4e3a\u65e0\u53d8\u5316"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u95ee\u7b54", "\u57fa\u51c6\u8bc4\u6d4b", "\u56fe\u50cf\u7406\u89e3"], "num_comments": 2, "on_hf": true, "organization": "University of California, Los Angeles", "pdf_url": "https://arxiv.org/pdf/2609.06245v1", "published_at": "2026-09-05", "score": 0.245, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06245.png", "title": "VDiff-Bench: A Challenging Benchmark for Fine-Grained Image Difference Identification", "tldr": "VDiff-Bench\u8bc4\u6d4bMLLM\u7ec6\u7c92\u5ea6\u627e\u56fe\u5dee", "upvotes": 10, "what_it_is": "\u63d0\u51fa VDiff-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u7ec6\u7c92\u5ea6\u56fe\u50cf\u5dee\u5f02\u8bc6\u522b\u7684\u591a\u9009\u57fa\u51c6\uff0c\u8981\u6c42\u6a21\u578b\u6bd4\u8f83\u4e24\u5f20\u76f8\u4f3c\u56fe\u50cf\u5e76\u5224\u65ad\u771f\u5b9e\u53d8\u5316\u3002\u57fa\u51c6\u8986\u76d6\u4f4d\u7f6e\u3001\u989c\u8272\u3001\u7eb9\u7406\u3001\u566a\u58f0\u3001OCR\u3001\u5149\u7167\u7b4910\u7c7b\u53d8\u5316\uff0c\u5e76\u7528\u5f3a\u5e72\u6270\u8d1f\u4f8b\u68c0\u9a8c\u6a21\u578b\u7684\u7cbe\u7ec6\u89c6\u89c9\u6bd4\u8f83\u80fd\u529b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u6807\u51c6\u5355\u56fe\u89c6\u89c9\u8bed\u8a00\u4efb\u52a1\u96be\u4ee5\u66b4\u9732\u7684\u77ed\u677f\uff1a\u5f53\u524dMLLM\u5bf9\u4e24\u56fe\u4e4b\u95f4\u7ec6\u5fae\u3001\u4f4e\u5c42\u89c6\u89c9\u53d8\u5316\u7684\u6bd4\u8f83\u4ecd\u5f88\u8106\u5f31\uff0c\u53ef\u4f5c\u4e3a\u591a\u6a21\u6001\u6a21\u578b\u7cbe\u7ec6\u89c6\u89c9\u7406\u89e3\u80fd\u529b\u7684\u9488\u5bf9\u6027\u8bca\u65ad\u5de5\u5177\u3002"}, {"abstract": "Robot foundation models are trained and evaluated predominantly in English, and robot demonstration corpora do not exist for most languages. We study the addition of Greek to an open vision-language-action stack using only machine-rephrased instructions and no architecture changes. The main challenge is measurement rather than translation. Several plausible instruments produce false conclusions: a color-histogram metric rewards noise, a single-goal benchmark scores 84.6% under correct Greek and 82.6% under deliberately wrong instructions, training loss fails to predict Greek success, and single-run comparisons are dominated by seed variation. On a discriminative ninety-task suite with three seeds per arm, a multilingual text tower without Greek demonstrations remains at its wrong-instruction floor, while Greek-only training exceeds its control by at most 2.7 points. Bilingual training yields a consistent 6.7-7.1 point margin over its control and reaches about two fifths of English performance. The policy also overfits the translator\u0027s phrasing; training on seven phrasings per task approximately halves this penalty. Warm-starting from a language-adapted world model and unfreezing the text tower both degrade performance. The results support two practical requirements for low-resource robot-policy localization: build a guaranteed null before trusting a metric, and replicate low-resource-language results across seeds.", "arxiv_id": "2609.07470", "arxiv_url": "https://arxiv.org/abs/2609.07470", "authors": ["Ayoub Kirouane", "Georgios Giaples", "Christos Petrocheilos"], "brief": "\u8bba\u6587\u7814\u7a76\u5982\u4f55\u5728\u4e0d\u6539\u67b6\u6784\u3001\u4ec5\u7528\u673a\u5668\u6539\u5199\u6307\u4ee4\u7684\u6761\u4ef6\u4e0b\uff0c\u4e3a Cosmos3 \u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u52a0\u5165\u5e0c\u814a\u8bed\u80fd\u529b\u3002\u6838\u5fc3\u53d1\u73b0\u662f\u96be\u70b9\u4e0d\u5728\u7ffb\u8bd1\u672c\u8eab\uff0c\u800c\u5728\u5982\u4f55\u53ef\u9760\u6d4b\u91cf\u8bed\u8a00\u8fc1\u79fb\u6548\u679c\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07470", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u591a\u79cd\u770b\u4f3c\u5408\u7406\u7684\u8bc4\u6d4b\u4f1a\u4ea7\u751f\u8bef\u5bfc\uff1a\u989c\u8272\u76f4\u65b9\u56fe\u6307\u6807\u5956\u52b1\u566a\u58f0\uff0c\u5355\u76ee\u6807\u57fa\u51c6\u5bf9\u6b63\u786e\u5e0c\u814a\u8bed\u548c\u6545\u610f\u9519\u8bef\u6307\u4ee4\u5f97\u5206\u63a5\u8fd1\uff0c\u8bad\u7ec3\u635f\u5931\u4e5f\u65e0\u6cd5\u9884\u6d4b\u5e0c\u814a\u8bed\u6210\u529f\u7387\u3002", "\u572890\u4efb\u52a1\u5224\u522b\u5f0f\u6d4b\u8bd5\u96c6\u4e0a\uff0c\u5355\u7eaf\u591a\u8bed\u8a00\u6587\u672c\u5854\u4e14\u65e0\u5e0c\u814a\u8bed\u793a\u8303\u51e0\u4e4e\u505c\u7559\u5728\u9519\u8bef\u6307\u4ee4\u4e0b\u9650\uff1b ribute linearly decodable in its residual stream at a depth where that attribute does not yet influence the output. This gap between where information is readable and where it is used has been shown for attributes stated directly in the input. We ask whether it also holds for an attribute the model must infer gradually over a conversation, namely how expert its dialogue partner is. Using ExpertCollab, a corpus of multi-turn research-planning dialogues between model-played personas at four expertise levels, we find that partner expertise is most decodable in the early layers and falls to near chance before the midpoint of the network. Counterfactual patching shows that injecting the expertise difference at the layer of peak decodability barely changes a fixed late-layer readout, whereas the same difference injected past the midpoint propagates almost completely, a separation of more than an order of magnitude. A content-matched random control and a probe-free diagnostic place the transition at the same early layer, and a statically specified control attribute stays decodable throughout. An inferred relational attribute is therefore represented well before it becomes causally active, which bounds where any attempt to read out or steer partner-conditioned behavior must intervene. We use one model on a synthetic corpus as an initial demonstration.", "arxiv_id": "2609.07139", "arxiv_url": "https://arxiv.org/abs/2609.07139", "authors": ["Mika Okamoto", "Gabriele Sarti"], "brief": "\u8bba\u6587\u7814\u7a76\u6a21\u578b\u5728\u591a\u8f6e\u5bf9\u8bdd\u4e2d\u9010\u6b65\u63a8\u65ad\u201c\u5bf9\u8bdd\u4f19\u4f34\u4e13\u4e1a\u5ea6\u201d\u8fd9\u4e00\u5173\u7cfb\u5c5e\u6027\u65f6\uff0c\u5176\u5185\u90e8\u8868\u5f81\u4f55\u65f6\u53ef\u8bfb\u3001\u4f55\u65f6\u771f\u6b63\u5f71\u54cd\u884c\u4e3a\u3002\u57fa\u4e8e ExpertCollab \u5408\u6210\u7814\u7a76\u89c4\u5212\u5bf9\u8bdd\u8bed\u6599\uff0c\u53d1\u73b0\u4e13\u4e1a\u5ea6\u5728\u65e9\u5c42\u6700\u6613\u7ebf\u6027\u89e3\u7801\uff0c\u4f46 u3002\u57fa\u4e8e ExpertCollab \u5408\u6210\u7814\u7a76\u89c4\u5212\u5bf9\u8bdd\u8bed\u6599\uff0c\u53d1\u73b0\u4e13\u4e1a\u5ea6\u5728\u65e9\u5c42\u6700\u6613\u7ebf\u6027\u89e3\u7801\uff0c\u4f46\u8981\u5230\u7f51\u7edc\u4e2d\u540e\u6bb5\u624d\u5177\u6709\u660e\u663e\u56e0\u679c\u4f5c\u7528\u3002", "why_notable": "\u5b83\u628a\u201c\u4fe1\u606f\u53ef\u7ebf\u6027\u8bfb\u51fa\u201d\u548c\u201c\u4fe1\u606f\u88ab\u6a21\u578b\u5b9e\u9645\u4f7f\u7528\u201d\u4e4b\u95f4\u7684\u5206\u79bb\uff0c\u4ece\u663e\u5f0f\u8f93\u5165\u5c5e\u6027\u6269\u5c55\u5230\u9700\u8981\u5bf9\u8bdd\u4e2d\u63a8\u65ad\u7684\u5173\u7cfb\u5c5e\u6027\uff0c\u5bf9\u7406\u89e3\u548c\u5e72\u9884\u4f19\u4f34\u6761\u4ef6\u5316\u884c\u4e3a\u3001\u6a21\u578b\u53ef\u89e3\u91ca\u6027\u4e0e\u53ef\u63a7\u6027\u6709\u76f4\u63a5\u542f\u53d1\u3002"}, {"abstract": "The digitization of healthcare has generated vast, longitudinal, and multimodal patient records over a lifetime, yet fully exploiting these data to represent and predict patient state trajectories remains a critical challenge. Current AI models often struggle to capture the complex, irregular temporal dynamics and inherent stochasticity of real-world multimodal patient data. Existing AI approaches for modeling longitudinal patient records are predominantly discriminative, limited to a few modalities, constrained by closed categorical vocabularies, treating time as a monotonic inductive bias, or they are limited in forecasting future patient states. We introduce NOAH, a time-aware, task-agnostic, generative transformer model representing and forecasting the full multimodal patient journey. NOAH features a novel bidirectional time integration and a variational latent space to capture the continuous evolution of patient states and the stochasticity of clinical trajectories. Built from over 559 million clinical events from 431,000 hospital visits of 299,000 patients across the MIMIC dataset family, NOAH natively processes medical images, time-series and numeric signals, categorical events, as well as structured and unstructured clinical records. NOAH is the first truly holistic generative model in its field, enabling autoregressive forecasting with optional time control, zero-shot classification, and counterfactual intervention simulation. It generates highly informative and predictive patient state representations that demonstrate strong performance in probing for clinical outcomes, 15 ICD chapters, and 29 comorbidities, as well as in time-to-event prediction. Seamlessly handling diverse modalities and complex temporal dynamics, NOAH provides a versatile, task-agnostic, scalable foundation for intelligent predictive systems in personalized clinical care and digital medicine.", "arxiv_id": "2609.09140", "arxiv_url": "https://arxiv.org/abs/2609.09140", "authors": ["Tobias Susetzky", "Raphael Rehms", "Dmitrii Seletkov", "\u00d6zg\u00fcn Turgut", "Michelle Espranita Liman", "Lisa Steinhelfer", "Rickmer Braren", "Daniel Rueckert"], "brief": "NOAH \u662f\u4e00\u4e2a\u9762\u5411\u5b8c\u6574\u60a3\u8005\u65c5\u7a0b\u7684\u65f6\u95f4\u611f\u77e5\u751f\u6210\u5f0f Transformer\uff0c\u53ef\u7edf\u4e00\u5efa\u6a21\u533b\u5b66\u5f71\u50cf\u3001\u65f6\u95f4\u5e8f\u5217\u3001\u6570\u503c\u4fe1\u53f7\u3001\u7ed3\u6784\u5316\u4e0e\u975e\u7ed3\u6784\u5316\u4e34\u5e8a\u8bb0\u5f55\u3002\u5b83\u901a\u8fc7\u53cc\u5411\u65f6\u95f4\u96c6\u6210\u548c\u53d8\u5206\u6f5c\u7a7a\u95f4\u6355\u6349\u4e0d\u89c4\u5219\u65f6\u95f4\u52a8\u6001\u4e0e\u4e34\u5e8a\u8f68\u8ff9\u968f\u673a\u6027\uff0c\u5728\u60a3\u8005\u8868\u5f81\u3001\u672a\u6765\u72b6\u6001\u9884\u6d4b\u3001\u96f6\u6837\u672c\u5206\u7c7b\u3001\u53cd\u4e8b\u5b9e\u5e72\u9884\u548c\u751f\u5b58\u9884\u6d4b\u7b49\u4efb\u52a1\u4e0a\u8868\u73b0\u8f83\u5f3a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09140", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u7597\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b", "\u65f6\u95f4\u5e8f\u5217", "\u4e34\u5e8a\u9884\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "AIMED", "pdf_url": "https://arxiv.org/pdf/2609.09140v1", "published_at": "2026-09-08", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09140.png", "title": "NOAH: Learning the Full Patient Journey. A Longitudinal Multimodal Time-Aware Model for Representation and Forecasting", "tldr": "NOAH \u662f\u4e00\u4e2a\u9762\u5411\u5b8c\u6574\u60a3\u8005\u65c5\u7a0b\u7684\u65f6\u95f4\u611f\u77e5\u751f\u6210\u5f0f Transformer\uff0c\u53ef\u7edf\u4e00\u5efa\u6a21\u533b\u5b66\u5f71\u50cf\u3001\u65f6\u95f4\u5e8f\u5217\u3001\u6570\u503c\u4fe1\u53f7\u3001\u7ed3\u6784\u5316\u4e0e\u975e\u7ed3\u6784\u5316\u4e34\u5e8a\u8bb0\u5f55\u3002\u5b83\u901a\u8fc7\u53cc\u5411\u65f6\u95f4\u96c6\u6210\u548c\u53d8\u5206\u6f5c\u7a7a\u95f4\u6355\u6349\u4e0d\u89c4\u5219\u65f6\u95f4\u52a8\u6001\u4e0e\u4e34\u5e8a\u8f68\u8ff9\u968f\u673a\u6027\uff0c\u5728\u60a3\u8005\u8868\u5f81\u3001\u672a\u6765\u72b6\u6001\u9884\u6d4b\u3001\u96f6\u6837\u672c\u5206\u7c7b\u3001\u53cd\u4e8b\u5b9e\u5e72\u9884\u548c\u751f\u5b58\u9884\u6d4b\u7b49\u4efb\u52a1\u4e0a\u8868\u73b0\u8f83\u5f3a\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Agents can turn shared infrastructure into a channel for coordinated intrusion. The Hugging Face incident and a separate public-wiki investigation show why a security assessment may need evidence from several executions and the artifacts they leave behind. We argue that the operational unit of defence should be a revisable coordination episode linking observed transfers, task authority, and response history. The central research problem is prospective episode discovery: finding which actions belong together before an evaluator supplies their membership. We define unsanctioned coordination relative to collaboration and delegated-authority policy, connect storage-mediated coordination to stigmergy, and specify the evidence needed to distinguish influence from common causes. First-contact signals are one possible input to discovery; the design also follows inherited state and later use. A proposed evaluation compares isolated actions, rolling windows, known groups, and prospectively discovered episodes at matched review cost and false-alert workload. It measures harmful outcomes across all assigned population runs and tests recurrence after channel closure and state quarantine. A checksum-verified reconstruction of the public wiki export separates the decline in retained writes from later administrative cleanup. The contribution is an incident-grounded position, descriptive analysis, and evaluation design. It makes the recommendation to monitor across executions testable without claiming a new detector or a measured containment benefit.", "arxiv_id": "2609.06140", "arxiv_url": "https://arxiv.org/abs/2609.06140", "authors": ["Gregory N Frank"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c06\u9632\u5fa1\u7684\u57fa\u672c\u5355\u4f4d\u4ece\u5355\u6b21\u884c\u4e3a\u6269\u5c55\u4e3a\u53ef\u4fee\u8ba2\u7684\u201c\u534f\u8c03\u4e8b\u4ef6\u201d\uff0c\u7528\u4e8e\u8bc6\u522b\u591a\u4e2a\u667a\u80fd\u4f53\u6267\u884c\u548c\u9057\u7559\u5de5\u4ef6\u4e4b\u95f4\u7684\u672a\u6388\u6743\u534f\u540c\u5165\u4fb5\u3002\u4f5c\u8005\u57fa\u4e8e Hugging Face \u4e8b\u4ef6\u548c\u516c\u5171 wiki \u8c03\u67e5\uff0c\u7ed9\u51fa\u8bc1\u636e\u6846\u67b6\u4e0e\u8bc4\u4f30\u8bbe\u8ba1\uff0c\u4f46\u660e\u786e\u4e0d\u58f0\u79f0\u63d0\u51fa\u65b0\u68c0\u6d4b\u5668\u6216\u5df2\u9a8c\u8bc1\u7684\u904f\u5236\u6536\u76ca\u3002", "categories": ["cs.CR", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06140", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u534f\u540c\u5165\u4fb5", "\u8bc4\u4f30\u8bbe\u8ba1"], "num_comments": 2, "on_hf": true, "organization": "Molt AI Corp", "pdf_url": "https://arxiv.org/pdf/2609.06140v1", "published_at": "2026-09-05", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06140.png", "title": "Counter-Swarm Doctrine: Containing Coordinated Agent Intrusions", "tldr": "\u8bba\u6587\u63d0\u51fa\u5c06\u9632\u5fa1\u7684\u57fa\u672c\u5355\u4f4d\u4ece\u5355\u6b21\u884c\u4e3a\u6269\u5c55\u4e3a\u53ef\u4fee\u8ba2\u7684\u201c\u534f\u8c03\u4e8b\u4ef6\u201d\uff0c\u7528\u4e8e\u8bc6\u522b\u591a\u4e2a\u667a\u80fd\u4f53\u6267\u884c\u548c\u9057\u7559\u5de5\u4ef6\u4e4b\u95f4\u7684\u672a\u6388\u6743\u534f\u540c\u5165\u4fb5\u3002\u4f5c\u8005\u57fa\u4e8e Hugging Face \u4e8b\u4ef6\u548c\u516c\u5171 wiki \u8c03\u67e5\uff0c\u7ed9\u51fa\u8bc1\u636e\u6846\u67b6\u4e0e\u8bc4\u4f30\u8bbe\u8ba1\uff0c\u4f46\u660e\u786e\u4e0d\u58f0\u79f0\u63d0\u51fa\u65b0\u68c0\u6d4b\u5668\u6216\u5df2\u9a8c\u8bc1\u7684\u904f\u5236\u6536\u76ca\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are often post-trained on pre-collected reasoning trajectories to improve their reasoning capability. Such trajectories tend to be long due to complex, interwoven paths, which often include detours on the path toward the answer. However, it has been underexplored whether LLMs indeed benefit from learning complete trajectories in post-training, such as supervised fine-tuning (SFT). Starting from our pilot study, we find that full trajectories provide only limited benefit, while partial trajectories are effective even under heavy truncation. We analyze redundancy in reasoning trajectories through attention-based analyses and controlled token-removal studies, both of which show that intermediate tokens contribute minimally to final reasoning quality. This suggests that avoiding redundant information may allow LLMs to internally infer coherent alternatives by inferring missing steps from their internal knowledge, given known trajectory endpoints. Furthermore, we show that training LLMs using endpoints leads to consistent changes in reasoning behavior, and that it also benefits post-training methods based on reinforcement learning or on-policy distillation, highlighting the need to revisit complete reasoning traces. Code is available at https://github.com/naver-ai/revisiting-trace.", "arxiv_id": "2609.07103", "arxiv_url": "https://arxiv.org/abs/2609.07103", "authors": ["Jaehui Hwang", "Sangdoo Yun", "Byeongho Heo", "Dongyoon Han"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u662f\u5426\u771f\u7684\u9700\u8981\u5b8c\u6574\u63a8\u7406\u8f68\u8ff9\uff0c\u53d1\u73b0\u5b8c\u6574\u8f68\u8ff9\u6536\u76ca\u6709\u9650\uff0c\u800c\u5373\u4f7f\u4e25\u91cd\u622a\u65ad\u7684\u90e8\u5206\u8f68\u8ff9\u4e5f\u80fd\u6709\u6548\u63d0\u5347\u63a8\u7406\u80fd\u529b\u3002\u901a\u8fc7\u6ce8\u610f\u529b\u5206\u6790\u548c\u53d7\u63a7\u5220\u8bcd\u5b9e\u9a8c\uff0c\u4f5c\u8005\u8868\u660e\u4e2d\u95f4\u63a8\u7406 token \u5197\u4f59\u8f83\u591a\uff0c\u4f7f\u7528\u7aef\u70b9\u8bad\u7ec3\u8fd8\u80fd\u6539\u5584\u5f3a\u5316\u5b66\u4e60\u548c\u5728\u7ebf\u84b8\u998f\u7b49\u540e\u8bad\u7ec3\u65b9\u6cd5\u7684\u6548\u679c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/naver-ai/revisiting-trace", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.07103", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u8f68\u8ff9", "\u540e\u8bad\u7ec3", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "NAVER AI Lab", "pdf_url": "https://arxiv.org/pdf/2609.07103v1", "published_at": "2026-09-07", "score": 0.043, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07103.png", "title": "Revisiting Complete Reasoning Traces for Post-Training", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u662f\u5426\u771f\u7684\u9700\u8981\u5b8c\u6574\u63a8\u7406\u8f68\u8ff9\uff0c\u53d1\u73b0\u5b8c\u6574\u8f68\u8ff9\u6536\u76ca\u6709\u9650\uff0c\u800c\u5373\u4f7f\u4e25\u91cd\u622a\u65ad\u7684\u90e8\u5206\u8f68\u8ff9\u4e5f\u80fd\u6709\u6548\u63d0\u5347\u63a8\u7406\u80fd\u529b\u3002\u901a\u8fc7\u6ce8\u610f\u529b\u5206\u6790\u548c\u53d7\u63a7\u5220\u8bcd\u5b9e\u9a8c\uff0c\u4f5c\u8005\u8868\u660e\u4e2d\u95f4\u63a8\u7406 token \u5197\u4f59\u8f83\u591a\uff0c\u4f7f\u7528\u7aef\u70b9\u8bad\u7ec3\u8fd8\u80fd\u6539\u5584\u5f3a\u5316\u5b66\u4e60\u548c\u5728\u7ebf\u84b8\u998f\u7b49\u540e\u8bad\u7ec3\u65b9\u6cd5\u7684\u6548\u679c\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "We study a governed approach to enterprise analytics: a language model interprets the question, while deterministic policy selects and runs a pre-approved analytical program that returns both results and evidence. We show that this restriction can remain expressive within a defined analytical class, using relational operations plus aggregation, comparison, windows, ranking, and similarity. Fixed meaning, policy, data, and execution rules also make results replayable. Across 440 runs, three 8B models generated SQL and selected tools at runtime, while Qwen3-8B interpreted intent only and policy executed the approved program. None of 330 runtime-planning episodes matched the full answer-and-evidence contract across all test datasets; the policy-executed analyzer matched 110 of 110. This is a configuration-specific result, not evidence that runtime agents cannot succeed under other designs.", "arxiv_id": "2609.03209", "arxiv_url": "https://arxiv.org/abs/2609.03209", "authors": ["MasterControl AI Lab"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53d7\u6cbb\u7406\u7684\u4f01\u4e1a\u5206\u6790\u6d41\u7a0b\uff1a\u8bed\u8a00\u6a21\u578b\u53ea\u8d1f\u8d23\ 1, "what_it_is": null, "why_notable": null}, {"abstract": "Generating co-speech gestures that are temporally coherent, semantically aligned with speech, and grounded with surrounding objects remains challenging. Prior speech-driven gesture models emphasize audio-gesture alignment but do not explicitly account for posture constraints or surrounding objects, failing to capture the inherent correlation between body gestures and the physical space. We present Puppeteer, a posture-aware, object-grounded co-speech gesture diffusion model operating in a causal latent space. We decompose long gestures into structured primitives and learn a causal variational autoencoder that encodes them into temporally ordered latent tokens, each depending only on the past. We then perform conditional diffusion directly in the causal latent space, conditioning on speech signals, motion history, an initial posture reference, and object geometry to synthesize physically consistent gestures. This temporally ordered latent formulation enables explicit temporal control and supports tasks such as gesture in-betweening and gesture completion. To better assess co-speech gesture synthesis beyond existing measures, we introduce new evaluation metrics tailored to this task. We also created SceneGes, the first curated synthetic 3D dataset of embodied co-speech gestures and corresponding 3D objects, enabling object-grounded gesture generation. Experiments show that Puppeteer generates more diverse and temporally synchronized gestures than prior methods, while enabling object-grounded gesture synthesis.", "arxiv_id": "2609.00369", "arxiv_url": "https://arxiv.org/abs/2609.00369", "authors": ["Vida Adeli", "Soroush Mehraban", "Jacob Rommann", "Harrison Sanborn", "Cole Clifford", "Babak Taati"], "brief": "\u8bba\u6587\u63d0\u51fa Puppeteer\uff0c\u4e00\u4e2a\u59ff\u6001\u611f\u77e5\u3001\u7269\u4f53\u7ea6\u675f\u7684\u5171\u8bed\u624b\u52bf\u6269\u6563\u751f\u6210\u6a21\u578b\uff0c\u5728\u56e0\u679c\u6f5c\u7a7a\u95f4\u4e2d\u7ed3\u5408\u8bed\u97f3\u3001\u52a8\u4f5c\u5386\u53f2\u3001\u521d\u59cb\u59ff\u6001\u548c\u7269\u4f53\u51e0\u4f55\u6765\u751f\u6210\u66f4\u7b26\u5408\u7269\u7406\u573a\u666f\u7684\u624b\u52bf\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 SceneGes 3D \u6570\u636e\u96c6\u5e76\u63d0\u51fa\u65b0\u8bc4\u6d4b\u6307\u6807\uff0c\u5b9e\u9a8c\u663e\u793a\u751f\u6210\u7ed3\u679c\u5728\u591a\u6837\u6027\u3001\u65f6\u95f4\u540c\u6b65\u548c\u7269\u4f53\u4ea4\u4e92\u4e00\u81f4\u6027\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00369", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u52a8\u4f5c\u751f\u6210", "\u591a\u6a21\u6001", "3D\u573a\u666f"], "num_comments": 2, "on_hf": true, "organization": "Pickford", "pdf_url": "https://arxiv.org/pdf/2609.00369v1", "published_at": "2026-08-31", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00369.png", "title": "Puppeteer: Object-Grounded Posture-Aware Co-Speech Gesture Generation", "tldr": "\u8bba\u6587\u63d0\u51fa Puppeteer\uff0c\u4e00\u4e2a\u59ff\u6001\u611f\u77e5\u3001\u7269\u4f53\u7ea6\u675f\u7684\u5171\u8bed\u624b\u52bf\u6269\u6563\u751f\u6210\u6a21\u578b\uff0c\u5728\u56e0\u679c\u6f5c\u7a7a\u95f4\u4e2d\u7ed3\u5408\u8bed\u97f3\u3001\u52a8\u4f5c\u5386\u53f2\u3001\u521d\u59cb\u59ff\u6001\u548c\u7269\u4f53\u51e0\u4f55\u6765\u751f\u6210\u66f4\u7b26\u5408\u7269\u7406\u573a\u666f\u7684\u624b\u52bf\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 SceneGes 3D \u6570\u636e\u96c6\u5e76\u63d0\u51fa\u65b0\u8bc4\u6d4b\u6307\u6807\uff0c\u5b9e\u9a8c\u663e\u793a\u751f\u6210\u7ed3\u679c\u5728\u591a\u6837\u6027\u3001\u65f6\u95f4\u540c\u6b65\u548c\u7269\u4f53\u4ea4\u4e92\u4e00\u81f4\u6027\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Existing emotional support conversation systems mainly focus on one-on-one seeker-supporter interactions and individual emotional states, leaving interpersonal relations in multi-party scenarios underexplored. In this work, we introduce relation-aware emotional support conversation, a new task that evaluates whether LLMs can capture and utilize the evolving dynamics of relationships to offer more effective emotional support. We construct RESCUE (Relation-aware Emotional Support Conversation Understanding and Evaluation Benchmark) from real couple and family interview conversations, containing 191 samples, 7,079 annotated turns, and 1,064.8 minutes of video. Based on rich annotations of socio-emotional and support-related dynamics, RESCUE defines six tasks that evaluate two core capabilities required for relation-aware emotional support: Relational Understanding and Relation-Sensitive Support. Experiments with ten LLMs show that current models perform relatively well on tasks relying on local emotional or intervention cues, but struggle with relation-intensive tasks such as relation pattern prediction, viewpoint prediction, and support strategy prediction. These findings reveal the limitations of current LLMs in modeling interpersonal relations and making relation-sensitive support decisions.", "arxiv_id": "2609.09657", "arxiv_url": "https://arxiv.org/abs/2609.09657", "authors": ["Haichuan Hu", "Yang Xiao", "Mingni Tang", "Jiawen Duan", "Quanjun Zhang", "Congqing He", "Hao Zhang", "Jiashuo Wang", "Johan F. Hoorn", "Wenjie Li"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u591a\u4eba\u60c5\u611f\u652f\u6301\u5bf9\u8bdd\u7684\u5173\u7cfb\u611f\u77e5\u65b0\u4efb\u52a1\uff0c\u5e76\u6784\u5efa RESCUE-BENCH\uff0c\u57fa\u4e8e\u771f\u5b9e\u4f34\u4fa3\u548c\u5bb6\u5ead\u8bbf\u8c08\uff0c\u5305\u542b 191 \u4e2a\u6837\u672c\u30017079 \u8f6e\u6807\u6ce8\u548c 1064.8 \u5206\u949f\u89c6\u9891\u3002\u5bf9 10 \u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u73b0\u6709\u6a21\u578b\u80fd\u5904\u7406\u5c40\u90e8\u60c5\u7eea\u6216\u5e72\u9884\u7ebf\u7d22\uff0c\u4f46\u5728\u5173\u7cfb\u6a21\u5f0f\u9884\u6d4b\u3001\u89c6\u89d2\u9884\u6d4b\u548c\u652f\u6301\u7b56\u7565\u9884\u6d4b\u7b49\u5173\u7cfb\u5bc6\u96c6\u4efb\u52a1\u4e0a\u8868\u73b0\u4e0d\u8db3\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Tomsawyerhu/RESCUE-bench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09657", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u60c5\u611f\u652f\u6301\u5bf9\u8bdd", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5173\u7cfb\u7406\u89e3", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Hong Kong Polytechnic University", "pdf_url": "https://arxiv.org/pdf/2609.09657v1", "published_at": "2026-09-09", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09657.png", "title": "RESCUE-BENCH: Towards Relation-Aware Multi-Party Emotional Support Conversation Systems", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411\u591a\u4eba\u60c5\u611f\u652f\u6301\u5bf9\u8bdd\u7684\u5173\u7cfb\u611f\u77e5\u65b0\u4efb\u52a1\uff0c\u5e76\u6784\u5efa RESCUE-BENCH\uff0c\u57fa\u4e8e\u771f\u5b9e\u4f34\u4fa3\u548c\u5bb6\u5ead\u8bbf\u8c08\uff0c\u5305\u542b 191 \u4e2a\u6837\u672c\u30017079 \u8f6e\u6807\u6ce8\u548c 1064.8 \u5206\u949f\u89c6\u9891\u3002\u5bf9 10 \u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u73b0\u6709\u6a21\u578b\u80fd\u5904\u7406\u5c40\u90e8\u60c5\u7eea\u6216\u5e72\u9884\u7ebf\u7d22\uff0c\u4f46\u5728\u5173\u7cfb\u6a21\u5f0f\u9884\u6d4b\u3001\u89c6\u89d2\u9884\u6d4b\u548c\u652f\u6301\u7b56\u7565\u9884\u6d4b\u7b49\u5173\u7cfb\u5bc6\u96c6\u4efb\u52a1\u4e0a\u8868\u73b0\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) has been central to the recent success of Large Reasoning Models. However, while RLVR significantly improves single-sample accuracy, it often fails to expand the model\u0027s intrinsic reasoning coverage (pass@k) due to limited exploration during training. To address this, we optimize the structural design of train-time rollouts to enhance pass@k. Our analysis identifies three key design principles: (1) difficulty-adaptive rollout can play an important role in expanding pass@k, beyond serving as an efficiency heuristic; (2) tree-based rollout outperforms parallel sampling in discovering correct answers; and (3) sentence-entropy-guided forking overcomes the localization phenomenon of token-level branching to maximize semantic diversity. Building on these insights, we propose DATPO (Difficulty-Adaptive Sentence-entropy-guided Tree-structured Policy Optimization). DATPO integrates difficulty-adaptive tree search with a sibling-diversity advantage term, explicitly promoting semantic diversity to expand reasoning coverage during training. Experiments on mathematical reasoning benchmarks demonstrate that DATPO outperforms baselines especially in pass@k, which directly translates to superior test-time scaling performance.", "arxiv_id": "2609.08650", "arxiv_url": "https://arxiv.org/abs/2609.08650", "authors": ["Youngjun Yu", "Sanghwan Jang", "Hwanjo Yu"], "brief": "\u8bba\u6587\u9488\u5bf9RLVR\u8bad\u7ec3\u4e2d\u63a2\u7d22\u4e0d\u8db3\u3001\u96be\u4ee5\u63d0\u5347pass@k\u7684\u95ee\u9898\uff0c\u63d0\u51faDATPO\uff1a\u7ed3\u5408\u96be\u5ea6\u81ea\u9002\u5e94\u7684\u6811\u7ed3\u6784rollout\u3001\u53e5\u5b50\u71b5\u5f15\u5bfc\u5206\u53c9\u548c\u5144\u5f1f\u8282\u70b9\u591a\u6837\u6027\u4f18\u52bf\u9879\u3002\u6570\u5b66\u63a8\u7406\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u76f8\u6bd4\u57fa\u7ebf\u66f4\u80fd\u6269\u5927\u63a8\u7406\u8986\u76d6\u7387\uff0c\u5c24\u5176\u63d0\u5347pass@k\u4e0e\u6d4b\u8bd5\u65f6\u6269\u5c55\u6548\u679c\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/colin31472/DATPO", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08650", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u6d4b\u8bd5\u65f6\u6269\u5c55"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08650v1", "published_at": "2026-09-08", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08650.png", "title": "Difficulty-Adaptive Tree-Structured Policy Optimization for Expanding Reasoning Coverage in RLVR", "tldr": "\u8bba\u6587\u9488\u5bf9RLVR\u8bad\u7ec3\u4e2d\u63a2\u7d22\u4e0d\u8db3\u3001\u96be\u4ee5\u63d0\u5347pass@k\u7684\u95ee\u9898\uff0c\u63d0\u51faDATPO\uff1a\u7ed3\u5408\u96be\u5ea6\u81ea\u9002\u5e94\u7684\u6811\u7ed3\u6784rollout\u3001\u53e5\u5b50\u71b5\u5f15\u5bfc\u5206\u53c9\u548c\u5144\u5f1f\u8282\u70b9\u591a\u6837\u6027\u4f18\u52bf\u9879\u3002\u6570\u5b66\u63a8\u7406\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u76f8\u6bd4\u57fa\u7ebf\u66f4\u80fd\u6269\u5927\u63a8\u7406\u8986\u76d6\u7387\uff0c\u5c24\u5176\u63d0\u5347pass@k\u4e0e\u6d4b\u8bd5\u65f6\u6269\u5c55\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Latent reasoning approaches enhance token-level efficiency and robustness by replacing verbose, explicit chain-of-thought (CoT) tokens with compact continuous-space embeddings. However, existing methods lack direct process supervision over these latent embeddings, which often leads to representation collapse and uneven information distribution. To address this, we propose Prototype-Mediated Process Supervision (PMPS), which introduces learnable reasoning prototypes as semantic anchors to provide structural process-level supervision for latent reasoning. PMPS projects latent embeddings and explicit CoT embeddings into a shared prototype space, achieving many-to-many soft alignment between unequal-length representations through prototype assignment. Meanwhile, we introduce a Progressive Sequential Alignment (PSA) module to further guide training: positional priors initially encourage sequential alignment structure, then gradually relax to permit adaptive matching. Experimental results show that PMPS compresses output token length to under 50% of explicit CoT on GSM8K-Aug. Compared to leading baseline SIM-CoT, our method achieves average accuracy gains of 2.08% across different model families. On GPT-2, PMPS even surpasses CoT-SFT. On larger models and a more challenging task, PMPS consistently attains the highest accuracy among all latent reasoning methods with comparable output length.", "arxiv_id": "2609.09928", "arxiv_url": "https://arxiv.org/abs/2609.09928", "authors": ["Yiqi Li", "Xu Chen", "Chen Ju", "Jiangchao Yao", "Zhaoyang Li", "Jinsong Lan", "Xiaoyong Zhu", "Bo Zheng", "Yu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa PMPS\uff0c\u7528\u53ef\u5b66\u4e60\u7684\u63a8\u7406\u539f\u578b\u4e3a\u6f5c\u5728\u94fe\u5f0f\u601d\u7ef4\u5d4c\u5165\u63d0\u4f9b\u7ed3\u6784\u5316\u8fc7\u7a0b\u76d1\u7763\uff0c\u7f13\u89e3\u8868\u793a\u574d\u584c\u548c\u4fe1\u606f\u5206\u5e03\u4e0d\u5747\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u5728\u663e\u8457\u538b\u7f29\u8f93\u51fa\u957f\u5ea6\uff08\u4f4e\u4e8e\u663e\u5f0f CoT \u7684 50%\uff09\u7684\u540c\u65f6\uff0c\u76f8\u6bd4 SIM-CoT \u5e73\u5747\u63d0\u5347 2.08% \u51c6\u786e\u7387\uff0c\u5e76\u5728\u591a\u79cd\u6a21\u578b\u548c\u66f4\u96be\u4efb\u52a1\u4e0a\u53d6\u5f97\u9886\u5148\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09928", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u94fe\u5f0f\u601d\u7ef4", "\u6f5c\u5728\u63a8\u7406", "\u8fc7\u7a0b\u76d1\u7763", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09928v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Structural Process Supervision for Latent Chain-of-Thought Reasoning", "tldr": "\u8bba\u6587\u63d0\u51fa PMPS\uff0c\u7528\u53ef\u5b66\u4e60\u7684\u63a8\u7406\u539f\u578b\u4e3a\u6f5c\u5728\u94fe\u5f0f\u601d\u7ef4\u5d4c\u5165\u63d0\u4f9b\u7ed3\u6784\u5316\u8fc7\u7a0b\u76d1\u7763\uff0c\u7f13\u89e3\u8868\u793a\u574d\u584c\u548c\u4fe1\u606f\u5206\u5e03\u4e0d\u5747\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u5728\u663e\u8457\u538b\u7f29\u8f93\u51fa\u957f\u5ea6\uff08\u4f4e\u4e8e\u663e\u5f0f CoT \u7684 50%\uff09\u7684\u540c\u65f6\uff0c\u76f8\u6bd4 SIM-CoT \u5e73\u5747\u63d0\u5347 2.08% \u51c6\u786e\u7387\uff0c\u5e76\u5728\u591a\u79cd\u6a21\u578b\u548c\u66f4\u96be\u4efb\u52a1\u4e0a\u53d6\u5f97\u9886\u5148\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Preference alignment for flow and diffusion models now spans online reinforcement learning and offline preference optimization, but the relation between these methods remains unclear. In particular, existing forward-process alignment methods require fresh samples from the current model, while offline methods based on fixed preference pairs rely primarily on positive-only fine-tuning or DPO-style likelihood-ratio surrogates. We organize these approaches through a divergence-based framework and introduce FlowCPO, an offline forward-KL objective that uses both preferred and dispreferred samples without online rollouts. For linear interpolation, we show under explicit regularity conditions that the forward-KL objective is bounded by a contrastive flow matching loss, yielding a tractable surrogate on fixed data. We further show that this loss is nonnegative, whereas the signed regression loss of simplified FlowDPO can be unbounded below. In the in-domain setting, FlowCPO achieves higher mean GenEval and OCR scores than the evaluated baselines, reaching 0.84 and 0.87 versus 0.81 and 0.74 for FlowDPO at CFG 3.0. In the out-of-domain setting, the results are mixed, with the best GenEval result but lower reward scores than RFT on several metrics.", "arxiv_id": "2609.09905", "arxiv_url": "https://arxiv.org/abs/2609.09905", "authors": ["Yansen Han", "Shengyi Liao", "Peng Sun", "Deyuan Liu", "Yuanxing Zhang", "Pengfei Wan", "Tao Lin"], "brief": "\u672c\u6587\u7528\u6563\u5ea6\u6846\u67b6\u7edf\u4e00\u7406\u89e3\u6d41/\u6269\u6563\u6a21\u578b\u7684\u504f\u597d\u5bf9\u9f50\u65b9\u6cd5\uff0c\u5e76\u63d0\u51fa FlowCPO\uff1a\u4e00\u79cd\u79bb\u7ebf forward-KL \u76ee\u6807\uff0c\u53ef\u540c\u65f6\u5229\u7528\u504f\u597d\u4e0e\u975e\u504f\u597d\u6837\u672c\u4e14\u65e0\u9700\u5728\u7ebf\u91c7\u6837\u3002\u7406\u8bba\u4e0a\u7ed9\u51fa\u53ef\u7531\u5bf9\u6bd4\u5f0f flow matching \u635f\u5931\u4e0a\u754c\u7684\u53ef\u8bad\u7ec3\u66ff\u4ee3\uff0c\u5e76\u6307\u51fa\u5176\u975e\u8d1f\u6027\uff1b\u5b9e\u9a8c\u4e2d\u57df\u5185 GenEval \u4e0e OCR \u4f18\u4e8e FlowDPO \u7b49\u57fa\u7ebf\uff0c\u4f46\u57df\u5916\u7ed3\u679c\u8f83\u4e3a\u6df7\u5408\u3002", "categories": ["stat.ML", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09905", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u504f\u597d\u5bf9\u9f50", "\u6d41\u6a21\u578b", "\u79bb\u7ebf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09905v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FlowCPO: A Unified Divergence View of Preference Alignment for Flow Models", "tldr": "\u672c\u6587\u7528\u6563\u5ea6\u6846\u67b6\u7edf\u4e00\u7406\u89e3\u6d41/\u6269\u6563\u6a21\u578b\u7684\u504f\u597d\u5bf9\u9f50\u65b9\u6cd5\uff0c\u5e76\u63d0\u51fa FlowCPO\uff1a\u4e00\u79cd\u79bb\u7ebf forward-KL \u76ee\u6807\uff0c\u53ef\u540c\u65f6\u5229\u7528\u504f\u597d\u4e0e\u975e\u504f\u597d\u6837\u672c\u4e14\u65e0\u9700\u5728\u7ebf\u91c7\u6837\u3002\u7406\u8bba\u4e0a\u7ed9\u51fa\u53ef\u7531\u5bf9\u6bd4\u5f0f flow matching \u635f\u5931\u4e0a\u754c\u7684\u53ef\u8bad\u7ec3\u66ff\u4ee3\uff0c\u5e76\u6307\u51fa\u5176\u975e\u8d1f\u6027\uff1b\u5b9e\u9a8c\u4e2d\u57df\u5185 GenEval \u4e0e OCR \u4f18\u4e8e FlowDPO \u7b49\u57fa\u7ebf\uff0c\u4f46\u57df\u5916\u7ed3\u679c\u8f83\u4e3a\u6df7\u5408\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing evaluation frameworks mostly assess only one part of AI agents, such as task completion (AgentBench) or security robustness (AgentDojo, ASB), rather than the complete pipeline of planning, tool selection, tool execution, memory and reasoning. Failures can occur at any stage, yet existing benchmarks rarely identify their precise source. AgentAudit evaluates the entire execution trace across ten capability, grounding, security and behavioural dimensions, namely instruction integrity, planner, memory, tool selection, tool invocation, tool correctness, alignment, tool faithfulness, security and execution integrity, combined with behavioural classification and failure attribution to pinpoint the exact stage responsible for an observed failure. AgentAudit can evaluate any LLM-based AI agent, since it attaches to the agent instead of replacing it. It reads only the recorded execution trace and does not interfere with how the agent runs, so it places no constraint on the agent\u0027s internal implementation. We evaluate five language models (OpenAI GPT-5, Claude Sonnet 5, Sarvam 105B, Llama 3.3 70B and Gemini 2.5 Flash) across nine capability and adversarial tasks. Claude Sonnet 5 and GPT-5 obtain the highest mean Composite Trust Scores (95.1 and 80.6 out of 100, respectively), while Sarvam 105B, Llama 3.3 70B and Gemini 2.5 Flash trail substantially (57.6, 45.7 and 22.6). All traces were scored by a single fixed judge model, which was itself one of the evaluated models, a limitation discussed in Section VII.E. More importantly, models with similar task-completion behaviour can diverge sharply in trustworthiness, as several non-frontier models are repeatedly classified Unsafe_Compliance on adversarial tasks rather than merely failing them, a distinction that pass/fail benchmarks cannot surface.", "arxiv_id": "2609.09875", "arxiv_url": "https://arxiv.org/abs/2609.09875", "authors": ["Shrey Nag", "Sachita", "Abhishek Kumar Singh", "Lipi Goel", "Rajeshwar Singh Janwar"], "brief": "\u672c\u6587\u63d0\u51fa AgentAudit\uff0c\u4e00\u4e2a\u5f00\u653e\u53ef\u6269\u5c55\u7684 AI \u667a\u80fd\u4f53\u5168\u751f\u547d\u5468\u671f\u4fe1\u4efb\u8bc4\u4f30\u6846\u67b6\uff0c\u53ef\u57fa\u4e8e\u6267\u884c\u8f68\u8ff9\u8bc4\u4f30\u89c4\u5212\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u9009\u62e9/\u8c03\u7528\u3001\u5b89\u5168\u6027\u4e0e\u884c\u4e3a\u7b49\u5341\u4e2a\u7ef4\u5ea6\uff0c\u5e76\u8fdb\u884c\u5931\u8d25\u5f52\u56e0\u3002\u5b9e\u9a8c\u663e\u793a Claude Sonnet 5 \u548c GPT-5 \u7684\u7efc\u5408\u4fe1\u4efb\u5206\u6700\u9ad8\uff0c\u4e14\u8be5\u6846\u67b6\u80fd\u63ed\u793a\u4f20\u7edf\u901a\u8fc7/\u5931\u8d25\u8bc4\u6d4b\u96be\u4ee5\u53d1\u73b0\u7684\u201c\u4e0d\u5b89\u5168\u670d\u4ece\u201d\u7b49\u98ce\u9669\u5dee\u5f02\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09875", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u5b89\u5168\u6027", "\u53ef\u4fe1AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09875v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AgentAudit: An Open, Extensible Framework for Full-Lifecycle Trust Evaluation of AI Agents", "tldr": "\u672c\u6587\u63d0\u51fa AgentAudit\uff0c\u4e00\u4e2a\u5f00\u653e\u53ef\u6269\u5c55\u7684 AI \u667a\u80fd\u4f53\u5168\u751f\u547d\u5468\u671f\u4fe1\u4efb\u8bc4\u4f30\u6846\u67b6\uff0c\u53ef\u57fa\u4e8e\u6267\u884c\u8f68\u8ff9\u8bc4\u4f30\u89c4\u5212\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u9009\u62e9/\u8c03\u7528\u3001\u5b89\u5168\u6027\u4e0e\u884c\u4e3a\u7b49\u5341\u4e2a\u7ef4\u5ea6\uff0c\u5e76\u8fdb\u884c\u5931\u8d25\u5f52\u56e0\u3002\u5b9e\u9a8c\u663e\u793a Claude Sonnet 5 \u548c GPT-5 \u7684\u7efc\u5408\u4fe1\u4efb\u5206\u6700\u9ad8\uff0c\u4e14\u8be5\u6846\u67b6\u80fd\u63ed\u793a\u4f20\u7edf\u901a\u8fc7/\u5931\u8d25\u8bc4\u6d4b\u96be\u4ee5\u53d1\u73b0\u7684\u201c\u4e0d\u5b89\u5168\u670d\u4ece\u201d\u7b49\u98ce\u9669\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have been ex- ploited to generate malware, but the effective- ness of guardrails for code generation secu- rity remains unclear. We introduce CS-Guard, the first benchmark to systematically evalu- ate guardrails for code generation security. It covers 1) text-to-code generation with 1000 high-quality malware-generation prompts, 7 jailbreak attacks, and a novel fictional scenario attack (FSA) that embeds malicious intent in a legitimate fictional software-development sce- nario; and 2) code-to-code generation with 331 code prompts spanning code infilling, code completion, and code translation. We empiri- cally evaluate 9 guardrails across seven LLMs. We find that current guardrails perform poorly against malicious code-generation re- quests: for text-to-code, the average attack success rate (ASR) after jailbreaks reaches about 50% for many guardrails; for code-to- code, average ASR approaches 100% on base LLMs and remains high across many guardrails (14.4% to nearly 100%). Our FSA also achieves ASR close to 100% across many guardrails, raising major reliability concerns for real-world software development. To sup- port future research, CS-Guard uses a modular three-layer guardrail taxonomy that lets devel- opers register guardrails for evaluation. We release the benchmark and data to enable fur- ther community evaluation.", "arxiv_id": "2609.09798", "arxiv_url": "https://arxiv.org/abs/2609.09798", "authors": ["Jinyang Li", "Mingyu Guo", "Hung X. Nguyen"], "brief": "\u672c\u6587\u63d0\u51fa CS-Guard\uff0c\u8fd9\u662f\u9996\u4e2a\u7cfb\u7edf\u8bc4\u6d4b\u4ee3\u7801\u751f\u6210\u5b89\u5168\u62a4\u680f\u7684\u57fa\u51c6\uff0c\u8986\u76d6\u6587\u672c\u5230\u4ee3\u7801\u4e0e\u4ee3\u7801\u5230\u4ee3\u7801\u573a\u666f\uff0c\u5e76\u5305\u542b\u8d8a\u72f1\u653b\u51fb\u548c\u865a\u6784\u573a\u666f\u653b\u51fb\u7b49\u6d4b\u8bd5\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u62a4\u680f\u5bf9\u6076\u610f\u4ee3\u7801\u751f\u6210\u8bf7\u6c42\u9632\u5fa1\u4e0d\u8db3\uff0c\u8bb8\u591a\u60c5\u51b5\u4e0b\u653b\u51fb\u6210\u529f\u7387\u5f88\u9ad8\uff0c\u66b4\u9732\u51fa\u771f\u5b9e\u8f6f\u4ef6\u5f00\u53d1\u4e2d\u7684\u5b89\u5168\u53ef\u9760\u6027\u98ce\u9669\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09798", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4ee3\u7801\u751f\u6210", "\u5b89\u5168\u8bc4\u6d4b", "\u8d8a\u72f1\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09798v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CS-Guard: Benchmarking LLM Guardrails for Code Generation Security", "tldr": "\u672c\u6587\u63d0\u51fa CS-Guard\uff0c\u8fd9\u662f\u9996\u4e2a\u7cfb\u7edf\u8bc4\u6d4b\u4ee3\u7801\u751f\u6210\u5b89\u5168\u62a4\u680f\u7684\u57fa\u51c6\uff0c\u8986\u76d6\u6587\u672c\u5230\u4ee3\u7801\u4e0e\u4ee3\u7801\u5230\u4ee3\u7801\u573a\u666f\uff0c\u5e76\u5305\u542b\u8d8a\u72f1\u653b\u51fb\u548c\u865a\u6784\u573a\u666f\u653b\u51fb\u7b49\u6d4b\u8bd5\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u62a4\u680f\u5bf9\u6076\u610f\u4ee3\u7801\u751f\u6210\u8bf7\u6c42\u9632\u5fa1\u4e0d\u8db3\uff0c\u8bb8\u591a\u60c5\u51b5\u4e0b\u653b\u51fb\u6210\u529f\u7387\u5f88\u9ad8\uff0c\u66b4\u9732\u51fa\u771f\u5b9e\u8f6f\u4ef6\u5f00\u53d1\u4e2d\u7684\u5b89\u5168\u53ef\u9760\u6027\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Directional ablation removes an aligned language model\u0027s ability to refuse by projecting a single \"refusal direction\" out of the weights that write the residual stream. It needs no gradient-based training and no optimization, only a few hundred contrastive prompts, which makes it the canonical white-box attack on open-weight alignment. However, it has been established only on dense models up to roughly 70B parameters. We study whether it survives the shift to frontier mixture-of-experts (MoE) models whose residual streams are no longer a single tensor and whose weights ship quantized. We apply it to GLM-5.3-Flash (320B parameters, 288 routed experts, a four-wide hyper-connection residual, block-FP8). The attack survives the architecture, but what it reaches is no longer where a reader of the original recipe would look for it. Editing the attention, dense and routed-expert writers on their own removes 0.039, 0.016 and 0.148 of refusal respectively; editing all three together removes 0.776. As a result, 74% of the effect exists only under the joint intervention. The part the conventional recipe reaches by module-name matching accounts for 0.066 of that 0.776, which is why it fails silently on an MoE. The effect does not follow from removing just any direction: ablating a random direction orthogonal to it leaves refusal unchanged. A category-concentrated residue survives every edit we tried: subspaces fitted on violence, sexual content and hate leave measurable refusal at every rank from 1 to 12. We report the method, the 41-89 percentage-point reductions it achieves across seven harmful benchmarks with no detected change in capability, and the boundary where it stops.", "arxiv_id": "2609.09793", "arxiv_url": "https://arxiv.org/abs/2609.09793", "authors": ["Yi Shi", "Tanyu Chen", "Kai Shen"], "brief": "\u672c\u6587\u7814\u7a76\u5355\u65b9\u5411\u201c\u62d2\u7b54\u65b9\u5411\u201d\u6d88\u878d\u653b\u51fb\u5728\u524d\u6cbf 320B MoE \u6a21\u578b GLM-5.3-Flash \u4e0a\u662f\u5426\u4ecd\u80fd\u7834\u574f\u5b89\u5168\u5bf9\u9f50\u3002\u7ed3\u679c\u663e\u793a\u653b\u51fb\u4f9d\u7136\u6709\u6548\uff0c\u4f46\u9700\u8981\u8054\u5408\u7f16\u8f91\u6ce8\u610f\u529b\u3001\u7a20\u5bc6\u5c42\u548c\u8def\u7531\u4e13\u5bb6\u5199\u5165\u6b8b\u5dee\u6d41\uff0c\u80fd\u5728\u4e03\u4e2a\u6709\u5bb3\u57fa\u51c6\u4e0a\u5c06\u62d2\u7b54\u7387\u964d\u4f4e 41-89 \u4e2a\u767e\u5206\u70b9\u4e14\u672a\u68c0\u6d4b\u5230\u80fd\u529b\u4e0b\u964d\uff1b\u540c\u65f6\u53d1\u73b0\u90e8\u5206\u7c7b\u522b\u76f8\u5173\u62d2\u7b54\u6b8b\u7559\u96be\u4ee5\u6d88\u9664\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09793", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5b89\u5168\u5bf9\u9f50", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u653b\u51fb", "\u6df7\u5408\u4e13\u5bb6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09793v1", "published_at": "2026-09-09", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Fragile Is Safety Alignment at Frontier Scale? A Single-Direction Attack on a 320B MoE", "tldr": "\u672c\u6587\u7814\u7a76\u5355\u65b9\u5411\u201c\u62d2\u7b54\u65b9\u5411\u201d\u6d88\u878d\u653b\u51fb\u5728\u524d\u6cbf 320B MoE \u6a21\u578b GLM-5.3-Flash \u4e0a\u662f\u5426\u4ecd\u80fd\u7834\u574f\u5b89\u5168\u5bf9\u9f50\u3002\u7ed3\u679c\u663e\u793a\u653b\u51fb\u4f9d\u7136\u6709\u6548\uff0c\u4f46\u9700\u8981\u8054\u5408\u7f16\u8f91\u6ce8\u610f\u529b\u3001\u7a20\u5bc6\u5c42\u548c\u8def\u7531\u4e13\u5bb6\u5199\u5165\u6b8b\u5dee\u6d41\uff0c\u80fd\u572
