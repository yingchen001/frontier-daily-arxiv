ior of the reverse KL objective in DMD, which can cause the student distribution to collapse onto only a few modes of the teacher distribution. To address this, we propose Mask Forcing, a Dual-Noise Masking Rollout strategy that perturbs the AR student self-rollout to mitigate mode collapse induced by reverse-KL mode seeking. The core idea is to inject cleaner signals into noisy rollout inputs via random masks along spatial and temporal axes during the self-rollout process of AR diffusion distillation. Such perturbations encourage the student rollouts to explore more regions of the teacher distribution, allowing DMD to provide learning signals beyond the modes already covered by the student. Moreover, the cleaner tokens act as denoising guidance for other noisier tokens, improving the intermediate rollout predictions and reducing error accumulation. Extensive experiments demonstrate that our method improves multiple AR video diffusion distillation methods with higher visual quality efficiently, without incorporating real video data or additional post-training stages.", "arxiv_id": "2609.09123", "arxiv_url": "https://arxiv.org/abs/2609.09123", "authors": ["Zhuoran Zhao", "Shengju Qian", "Tongtong Liang", "Xianghao Kong", "Songchun Zhang", "Junchao Huang", "Guian Fang", "Xin Wang", "Pan Hui", "Anyi Rao"], "brief": "\u672c\u6587\u63d0\u51fa Mask Forcing\uff0c\u4e00\u79cd\u7528\u4e8e\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u84b8\u998f\u7684 Dual-Noise Masking Rollout \u7b56\u7565\u3002\u5b83\u5728\u5b66\u751f\u6a21\u578b\u81ea\u56de\u6eda\u8fc7\u7a0b\u4e2d\u6cbf\u7a7a\u95f4\u548c\u65f6\u95f4\u7ef4\u5ea6\u968f\u673a\u6ce8\u5165\u66f4\u5e72\u51c0\u7684\u4fe1\u53f7\uff0c\u4ee5\u7f13\u89e3 DMD \u53cd\u5411 KL \u5e26\u6765\u7684\u6a21\u5f0f\u584c\u7f29\u4e0e\u753b\u9762\u8fc7\u9971\u548c\u3001\u8fc7\u5e73\u6ed1\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/delaprada/Mask-Forcing", "github_stars": 48, "hf_url": "https://huggingface.co/papers/2609.09123", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9 Distribution Matching Distillation \u4e2d\u53cd\u5411 KL \u7684 mode-seeking \u503e\u5411\uff0c\u663e\u5f0f\u6270\u52a8\u5b66\u751f\u6a21\u578b\u7684\u81ea\u56de\u6eda\u8f68\u8ff9\uff0c\u9f13\u52b1\u8986\u76d6\u6559\u5e08\u5206\u5e03\u7684\u66f4\u591a\u6a21\u5f0f", "\u901a\u8fc7\u7a7a\u95f4\u4e0e\u65f6\u95f4\u8f74\u968f\u673a mask\uff0c\u5c06\u8f83\u5e72\u51c0 token \u6df7\u5165\u5e26\u566a rollout \u8f93\u5165\uff0c\u4e3a\u5176\u4ed6\u9ad8\u566a token \u63d0\u4f9b\u53bb\u566a\u5f15\u5bfc\u5e76\u51cf\u5c11\u8bef\u5dee\u7d2f\u79ef", "\u65e0\u9700\u771f\u5b9e\u89c6\u9891\u6570\u636e\u6216\u989d\u5916\u540e\u8bad\u7ec3\u9636\u6bb5\uff0c\u53ef\u63d0\u5347\u591a\u79cd\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u84b8\u998f\u65b9\u6cd5\u7684\u89c6\u89c9\u8d28\u91cf\u4e0e\u771f\u5b9e\u611f"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u6a21\u578b\u84b8\u998f", "\u81ea\u56de\u5f52\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09123v1", "published_at": "2026-09-08", "score": 0.339, "selected_reasons": ["HF trending (43\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09123.png", "title": "Mask Forcing: Improving Autoregressive Video Diffusion Distillation via Dual-Noise Masking Rollout", "tldr": "\u7528\u53cc\u566a\u58f0\u63a9\u7801\u7f13\u89e3\u81ea\u56de\u5f52\u89c6\u9891\u84b8\u998f\u584c\u7f29", "upvotes": 43, "what_it_is": "\u672c\u6587\u63d0\u51fa Mask Forcing\uff0c\u4e00\u79cd\u7528\u4e8e\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u84b8\u998f\u7684 Dual-Noise Masking Rollout \u7b56\u7565\u3002\u5b83\u5728\u5b66\u751f\u6a21\u578b\u81ea\u56de\u6eda\u8fc7\u7a0b\u4e2d\u6cbf\u7a7a\u95f4\u548c\u65f6\u95f4\u7ef4\u5ea6\u968f\u673a\u6ce8\u5165\u66f4\u5e72\u51c0\u7684\u4fe1\u53f7\uff0c\u4ee5\u7f13\u89e3 DMD \u53cd\u5411 KL \u5e26\u6765\u7684\u6a21\u5f0f\u584c\u7f29\u4e0e\u753b\u9762\u8fc7\u9971\u548c\u3001\u8fc7\u5e73\u6ed1\u95ee\u9898\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u6293\u4f4f\u4e86\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u84b8\u998f\u4e2d\u8d28\u91cf\u9000\u5316\u7684\u5173\u952e\u6839\u56e0\u2014\u2014\u53cd\u5411 KL \u5bfc\u81f4\u7684\u6a21\u5f0f\u584c\u7f29\uff0c\u5e76\u7528\u7b80\u5355\u9ad8\u6548\u7684 rollout \u6270\u52a8\u673a\u5236\u6539\u5584\u751f\u6210\u591a\u6837\u6027\u548c\u7ec6\u8282\u8d28\u91cf\uff0c\u5bf9\u5b9e\u65f6\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u84b8\u998f\u4e0e\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Weak-to-strong generalization asks whether stronger models can learn from weaker supervisors and surpass them. This question is particularly important for successive model generations and multi-domain consolidation, where repeating frontier-scale post-training from scratch can be prohibitively expensive. Yet conventional distillation treats the weak teacher as an optimization target, potentially imposing its capacity ceiling on the student. We introduce On-Policy Reverse Distillation (OPRD), which evaluates the teacher\u0027s policy shift relative to its reference policy on student rollouts and amplifies the component of the student\u0027s verifier-driven policy gradient along that direction. By rescaling only verifier-supported updates, OPRD preserves the stationary points of policy optimization while accelerating learning beyond the teacher. In both successive model transfer and multi-teacher distillation, OPRD achieves higher performance with fewer student updates than existing RL and distillation approaches. Response-style analysis shows that OPRD students remain closer to models trained with verifier-based RL alone than to their weak teachers, suggesting that teacher guidance accelerates rather than redirects the student\u0027s own optimization. Results in conventional strong-to-weak distillation further demonstrate that OPRD effectively combines verifier-driven policy optimization with teacher guidance regardless of capacity ordering.", "arxiv_id": "2609.08798", "arxiv_url": "https://arxiv.org/abs/2609.08798", "authors": ["Youngrok Park", "Sangmin Bae", "Hojung Jung", "Jongwoo Ko", "Yunseon Choi", "Young Jin Kim", "Pashmina Cameron", "Aaron Courville", "Se-Young Yun"], "brief": "\u8bba\u6587\u63d0\u51fa On-Policy Reverse Distillation\uff08OPRD\uff09\uff0c\u5728\u5b66\u751f\u6a21\u578b\u751f\u6210\u8f68\u8ff9\u4e0a\u8bc4\u4f30\u5f31\u6559\u5e08\u76f8\u5bf9\u53c2\u8003\u7b56\u7565\u7684\u504f\u79fb\uff0c\u5e76\u653e\u5927\u5b66\u751f\u4e2d\u7531\u9a8c\u8bc1\u5668\u652f\u6301\u4e14\u4e0e\u8be5\u65b9\u5411\u4e00\u81f4\u7684\u7b56\u7565\u68af\u5ea6\u3002\u8be5\u65b9\u6cd5\u7528\u4e8e\u5f31\u5230\u5f3a\u6cdb\u5316\u3001\u8fde\u7eed\u6a21\u578b\u8fc1\u79fb\u548c\u591a\u6559\u5e08\u84b8\u998f\uff0c\u4f7f\u5b66\u751f\u5728\u4e0d\u88ab\u5f31\u6559\u5e08\u80fd\u529b\u4e0a\u9650\u675f\u7f1a\u7684\u60c5\u51b5\u4e0b\u52a0\u901f\u5b66\u4e60\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/raymin0223/on_policy_reverse_distillation", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.08798", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4e0d\u540c\u4e8e\u4f20\u7edf\u84b8\u998f\u628a\u6559\u5e08\u8f93\u51fa\u5f53\u4f5c\u4f18\u5316\u76ee\u6807\uff0cOPRD\u53ea\u91cd\u7f29\u653e\u9a8c\u8bc1\u5668\u652f\u6301\u7684\u66f4\u65b0\u65b9\u5411\uff0c\u4ece\u800c\u4fdd\u7559\u7b56\u7565\u4f18\u5316\u7684\u9a7b\u70b9\u5e76\u907f\u514d\u7b80\u5355\u6a21\u4eff\u5f31\u6559\u5e08\u3002", "\u5728\u8fde\u7eed\u6a21\u578b\u4ee3\u9645\u8fc1\u79fb\u548c\u591a\u6559\u5e08\u84b8\u998f\u5b9e\u9a8c\u4e2d\uff0cOPRD\u76f8\u6bd4\u73b0\u6709\u5f3a\u5316\u5b66\u4e60\u4e0e\u84b8\u998f\u65b9\u6cd5\u7528\u66f4\u5c11\u5b66\u751f\u66f4\u65b0\u53d6\u5f97\u66f4\u9ad8\u6027\u80fd\u3002", "\u54cd\u5e94\u98ce\u683c\u5206\u6790\u663e\u793a\uff0cOPRD\u5b66\u751f\u66f4\u63a5\u8fd1\u4ec5\u7528\u9a8c\u8bc1\u5668\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u7684\u6a21\u578b\uff0c\u800c\u975e\u5f31\u6559\u5e08\uff0c\u8bf4\u660e\u6559\u5e08\u4e3b\u8981\u8d77\u52a0\u901f\u800c\u975e\u91cd\u5b9a\u5411\u4f5c\u7528\u3002"], "keywords": ["\u5f31\u5230\u5f3a\u6cdb\u5316", "\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2609.08798v1", "published_at": "2026-09-08", "score": 0.338, "selected_reasons": ["HF trending (82\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08798.png", "title": "Eliciting Weak-to-Strong Generalization with On-Policy Reverse Distillation", "tldr": "OPRD\u8ba9\u5f3a\u6a21\u578b\u501f\u5f31\u6559\u5e08\u66f4\u5feb\u8d85\u8d8a\u6559\u5e08\u3002", "upvotes": 82, "what_it_is": "\u8bba\u6587\u63d0\u51fa On-Policy Reverse Distillation\uff08OPRD\uff09\uff0c\u5728\u5b66\u751f\u6a21\u578b\u751f\u6210\u8f68\u8ff9\u4e0a\u8bc4\u4f30\u5f31\u6559\u5e08\u76f8\u5bf9\u53c2\u8003\u7b56\u7565\u7684\u504f\u79fb\uff0c\u5e76\u653e\u5927\u5b66\u751f\u4e2d\u7531\u9a8c\u8bc1\u5668\u652f\u6301\u4e14\u4e0e\u8be5\u65b9\u5411\u4e00\u81f4\u7684\u7b56\u7565\u68af\u5ea6\u3002\u8be5\u65b9\u6cd5\u7528\u4e8e\u5f31\u5230\u5f3a\u6cdb\u5316\u3001\u8fde\u7eed\u6a21\u578b\u8fc1\u79fb\u548c\u591a\u6559\u5e08\u84b8\u998f\uff0c\u4f7f\u5b66\u751f\u5728\u4e0d\u88ab\u5f31\u6559\u5e08\u80fd\u529b\u4e0a\u9650\u675f\u7f1a\u7684\u60c5\u51b5\u4e0b\u52a0\u901f\u5b66\u4e60\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u524d\u6cbf\u6a21\u578b\u8fed\u4ee3\u548c\u591a\u9886\u57df\u80fd\u529b\u6574\u5408\u4e2d\u9ad8\u6210\u672c\u540e\u8bad\u7ec3\u95ee\u9898\uff0c\u63d0\u51fa\u4e00\u79cd\u53ef\u8ba9\u5f3a\u5b66\u751f\u4ece\u5f31\u76d1\u7763\u4e2d\u83b7\u76ca\u5e76\u7a81\u7834\u6559\u5e08\u4e0a\u9650\u7684\u7b56\u7565\u4f18\u5316\u5f0f\u84b8\u998f\u65b9\u6cd5\uff0c\u5bf9\u5f31\u5230\u5f3a\u6cdb\u5316\u548c\u4f4e\u6210\u672c\u6a21\u578b\u5347\u7ea7\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "World-action models (WAM) predict future states to guide robot actions, enabling learning from both action-free video and action-labeled interaction. Most inherit pretrained video generators, leaving WAM pretraining and scaling underexplored. We introduce Genie Envisioner Act 2.0 (GE-Act 2.0), a world-action model whose trainable generative and action components are all initialized from scratch on manipulation data. It combines a control-oriented autoencoder (CoAE), a single-step visual planner (SVP), and an inverse dynamics model (IDM). CoAE retains action- and instruction-relevant information under aggressive compression, while SVP produces a complete future state in one differentiable pass, so visual planning and inverse dynamics can be pretrained separately on complementary data. The components are then jointly trained with knowledge-aligned selective optimization (KASO), which reduces mismatched supervision by selecting only predicted futures judged behaviorally compatible with the recorded action. We evaluate pretrained checkpoints directly, without per-task fine-tuning, on 100 tasks across 20 manipulation skill groups with held-out scenes, backgrounds, lighting, and object instances. Scaling co-training data from 300 to 30,000 hours raises success from 17.1% to 44.1% on G1-OP and from 13.4% to 31.1% on G2-90D; despite comprising less than 2% of the co-training data, G2-90D improves by 17.7 points, suggesting cross-embodiment transfer. Gains span 19/20 and 18/20 skill groups, and skill-specific coverage strongly correlates with zero-shot out-of-distribution (OOD) success (Pearson r=0.80; Spearman rho=0.85). Under the same protocol, the model grounds object, color, shape, and position references in at least 90% of trials and follows explicit instructions even when they conflict with an already-committed behavior or a conventional scene association.", "arxiv_id": "2609.05588", "arxiv_url": "https://arxiv.org/abs/2609.05588", "authors": ["AgiBot Research Team", "Renhang Liu", "Wenzhi Zhao", "Zhuo Yang", "Liliang Chen", "Pengfei Zhou", "Shengcong Chen", "Guanghui Ren", "Youlun Peng", "Rongjun Jin", "Nan Wang", "Sukai Wang", "Xindong He", "Jinyuan Feng", "Ziyu Xiong", "Linqing Zhong", "Yifei Wei", "Feng Han", "Long Zhang", "Da Huang", "Nanshu Zhao", "Chenghao Yin", "Mo Wu", "Zhaodong Yan", "Kongtao Hu", "Yuxiang Yan", "Aogelijiang Niyazi", "Yu Fang", "Jia Zeng", "Lizhu Meng", "Daizhen Lv", "Haoyu Cao", "Zhiwen Hou", "Lianjin Ye", "Yuehan Niu", "Zhikai Cai", "Xuan Hu", "Hui Min", "Xiongfeng Cai", "Yue Liao", "Jing Wu", "Soujanya Poria", "Ye Li", "Sanping Zhou", "Maoqing Yao"], "brief": "\u8bba\u6587\u63d0\u51fa GE-Act 2.0\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u4ece\u96f6\u521d\u59cb\u5316\u5e76\u5728\u64cd\u4f5c\u6570\u636e\u4e0a\u9884\u8bad\u7ec3\u751f\u6210\u4e0e\u52a8\u4f5c\u7ec4\u4ef6\u3002\u5b83\u5c06\u63a7\u5236\u5bfc\u5411\u81ea\u7f16\u7801\u5668\u3001\u5355\u6b65\u89c6\u89c9\u89c4\u5212\u5668\u548c\u9006\u52a8\u529b\u5b66\u6a21\u578b\u5206\u79bb\u9884\u8bad\u7ec3\u540e\u8054\u5408\u4f18\u5316\uff0c\u5b9e\u73b0\u65e0\u9700\u4efb\u52a1\u5fae\u8c03\u7684\u96f6\u6837\u672c\u64cd\u4f5c\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05588", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["CoAE \u5728\u5f3a\u538b\u7f29\u4e0b\u4fdd\u7559\u4e0e\u52a8\u4f5c\u548c\u6307\u4ee4\u76f8\u5173\u7684\u4fe1\u606f\uff0cSVP \u4e00\u6b65\u751f\u6210\u5b8c\u6574\u672a\u6765\u89c6\u89c9\u72b6\u6001\uff0cIDM \u5c06\u9884\u6d4b\u672a\u6765\u72b6\u6001\u6620\u5c04\u4e3a\u52a8\u4f5c\u3002", "\u63d0\u51fa KASO \u77e5\u8bc6\u5bf9\u9f50\u9009\u62e9\u6027\u4f18\u5316\uff0c\u53ea\u4f7f\u7528\u4e0e\u8bb0\u5f55\u52a8\u4f5c\u5728\u884c\u4e3a\u4e0a\u517c\u5bb9\u7684\u9884\u6d4b\u672a\u6765\uff0c\u51cf\u5c11\u76d1\u7763\u4fe1\u53f7\u4e0d\u5339\u914d\u3002", "\u534f\u540c\u8bad\u7ec3\u6570\u636e\u4ece300\u5c0f\u65f6\u6269\u5c55\u52303\u4e07\u5c0f\u65f6\u540e\uff0cG1-OP\u6210\u529f\u7387\u753117.1%\u5347\u81f344.1%\uff0cG2-90D\u753113.4%\u5347\u81f331.1%\uff0c\u5e76\u663e\u793a\u8de8\u672c\u4f53\u8fc1\u79fb\u80fd\u529b\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u6a21\u4eff\u5b66\u4e60", "\u96f6\u6837\u672c\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": "AgiBot World", "pdf_url": "https://arxiv.org/pdf/2609.05588v1", "published_at": "2026-09-04", "score": 0.309, "selected_reasons": ["HF trending (49\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05588.png", "title": "GE-Act 2.0: Pretraining and Scaling a World-Action Model for Robotic Manipulation", "tldr": "\u4ece\u96f6\u9884\u8bad\u7ec3\u53ef\u6269\u5c55\u673a\u5668\u4eba\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b", "upvotes": 49, "what_it_is": "\u8bba\u6587\u63d0\u51fa GE-Act 2.0\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\uff0c\u4ece\u96f6\u521d\u59cb\u5316\u5e76\u5728\u64cd\u4f5c\u6570\u636e\u4e0a\u9884\u8bad\u7ec3\u751f\u6210\u4e0e\u52a8\u4f5c\u7ec4\u4ef6\u3002\u5b83\u5c06\u63a7\u5236\u5bfc\u5411\u81ea\u7f16\u7801\u5668\u3001\u5355\u6b65\u89c6\u89c9\u89c4\u5212\u5668\u548c\u9006\u52a8\u529b\u5b66\u6a21\u578b\u5206\u79bb\u9884\u8bad\u7ec3\u540e\u8054\u5408\u4f18\u5316\uff0c\u5b9e\u73b0\u65e0\u9700\u4efb\u52a1\u5fae\u8c03\u7684\u96f6\u6837\u672c\u64cd\u4f5c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7cfb\u7edf\u63a2\u7d22\u4e86\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u7684\u4ece\u96f6\u9884\u8bad\u7ec3\u4e0e\u6570\u636e\u89c4\u6a21\u5316\uff0c\u800c\u975e\u4f9d\u8d56\u73b0\u6210\u89c6\u9891\u751f\u6210\u5668\uff1b\u5728100\u4e2a\u4efb\u52a1\u300120\u7c7b\u6280\u80fd\u548c\u591a\u79cdOOD\u6761\u4ef6\u4e0b\u76f4\u63a5\u8bc4\u6d4b\uff0c\u5c55\u793a\u4e86\u53ef\u6269\u5c55\u7684\u96f6\u6837\u672c\u673a\u5668\u4eba\u64cd\u4f5c\u80fd\u529b\u4e0e\u8de8\u672c\u4f53\u6cdb\u5316\u6f5c\u529b\u3002"}, {"abstract": "Latent visual reasoning aims to perform multimodal reasoning through hidden-state computation rather than explicit textual chains of thought. However, visual information being present in a latent state does not imply that the model actually relies on that state when producing its answer, especially when alternative image-conditioned paths remain available. We introduce \\textbf{C}ausal \\textbf{V}isual \\textbf{R}ecurrent \\textbf{R}easoning (CVRR), which preserves pretrained visual competence while making recurrent computation the required image-conditioned path to prediction. CVRR initializes recurrence from the question hidden state after the pretrained vision-language model has incorporated the image, then repeatedly updates this state while re-reading the same fixed visual evidence. Before decoding, visual states and the original multimodal KV cache are removed so that only the final recurrent state carries image-conditioned information to the answer. Across the $V^*$, MMVP, BLINK, and MME-RealWorld-Lite benchmarks, CVRR retains strong performance under this strict interface, while compatible latent reasoners fail to recover comparable visual competence even when retrained under the same constraint. Causal interventions further show that predictions remain sensitive to recurrent content when the question is held fixed, and that persistent visual evidence causally revises the recurrent trajectory. These results distinguish latent informativeness from latent computation that is actually used for prediction.", "arxiv_id": "2609.06746", "arxiv_url": "https://arxiv.org/abs/2609.06746", "authors": ["Suhyeong Park", "Junha Jung", "Jaewoo Kang"], "brief": "\u8bba\u6587\u63d0\u51fa Causal Visual Recurrent Reasoning\uff08CVRR\uff09\uff0c\u5728\u4fdd\u7559\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u529b\u7684\u540c\u65f6\uff0c\u5f3a\u5236\u7b54\u6848\u53ea\u80fd\u4f9d\u8d56\u5faa\u73af\u66f4\u65b0\u540e\u7684\u6f5c\u72b6\u6001\u3002\u65b9\u6cd5\u5728\u89e3\u7801\u524d\u79fb\u9664\u89c6\u89c9\u72b6\u6001\u4e0e\u539f\u59cb\u591a\u6a21\u6001 KV cache\uff0c\u4f7f\u6700\u7ec8 recurrent state \u6210\u4e3a\u552f\u4e00\u643a\u5e26\u56fe\u50cf\u4fe1\u606f\u7684\u901a\u8def\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.LG"], "github_repo": "https://github.com/dmis-lab/CVRR", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.06746", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ece\u5df2\u878d\u5408\u56fe\u50cf\u7684\u95ee\u9898\u9690\u85cf\u72b6\u6001\u521d\u59cb\u5316\u5faa\u73af\u63a8\u7406\uff0c\u5e76\u5728\u6bcf\u8f6e\u66f4\u65b0\u4e2d\u91cd\u65b0\u8bfb\u53d6\u56fa\u5b9a\u89c6\u89c9\u8bc1\u636e", "\u89e3\u7801\u524d\u5220\u9664\u89c6\u89c9 states \u548c\u539f\u59cb\u591a\u6a21\u6001 KV cache\uff0c\u5207\u65ad\u66ff\u4ee3\u7684\u56fe\u50cf\u6761\u4ef6\u8def\u5f84", "\u5728 V*\u3001MMVP\u3001BLINK\u3001MME-RealWorld-Lite \u4e0a\u4fdd\u6301\u8f83\u5f3a\u6027\u80fd\uff0c\u5e76\u901a\u8fc7\u56e0\u679c\u5e72\u9884\u9a8c\u8bc1\u6a21\u578b\u786e\u5b9e\u4f9d\u8d56\u5faa\u73af\u6f5c\u72b6\u6001"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u63a8\u7406", "\u6f5c\u7a7a\u95f4\u63a8\u7406", "\u56e0\u679c\u5206\u6790"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06746v1", "published_at": "2026-09-06", "score": 0.309, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06746.png", "title": "Reason Through the Latent! Making Latent Visual Reasoning Necessary", "tldr": "\u8ba9\u89c6\u89c9\u63a8\u7406\u5fc5\u987b\u7ecf\u7531\u6f5c\u72b6\u6001\u5b8c\u6210", "upvotes": 30, "what_it_is": "\u8bba\u6587\u63d0\u51fa Causal Visual Recurrent Reasoning\uff08CVRR\uff09\uff0c\u5728\u4fdd\u7559\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u529b\u7684\u540c\u65f6\uff0c\u5f3a\u5236\u7b54\u6848\u53ea\u80fd\u4f9d\u8d56\u5faa\u73af\u66f4\u65b0\u540e\u7684\u6f5c\u72b6\u6001\u3002\u65b9\u6cd5\u5728\u89e3\u7801\u524d\u79fb\u9664\u89c6\u89c9\u72b6\u6001\u4e0e\u539f\u59cb\u591a\u6a21\u6001 KV cache\uff0c\u4f7f\u6700\u7ec8 recurrent state \u6210\u4e3a\u552f\u4e00\u643a\u5e26\u56fe\u50cf\u4fe1\u606f\u7684\u901a\u8def\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u533a\u5206\u4e86\u201c\u6f5c\u72b6\u6001\u4e2d\u542b\u6709\u89c6\u89c9\u4fe1\u606f\u201d\u548c\u201c\u6a21\u578b\u5b9e\u9645\u4f7f\u7528\u6f5c\u72b6\u6001\u8fdb\u884c\u63a8\u7406\u201d\u4e24\u4ef6\u4e8b\uff0c\u4e3a\u68c0\u9a8c\u548c\u6784\u5efa\u771f\u6b63\u7684\u6f5c\u7a7a\u95f4\u89c6\u89c9\u63a8\u7406\u673a\u5236\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u56e0\u679c\u63a5\u53e3\u4e0e\u5b9e\u9a8c\u8303\u5f0f\u3002"}, {"abstract": "Recent video world models generate increasingly realistic and interactive visual experiences, yet lack reliable mechanisms for maintaining persistent world state and enforcing programmable rules over extended interactions. We introduce Programmable World Model, a framework that decouples world-state evolution from visual observation generation. An agent translates natural-language instructions into executable programs that specify entity states and state-transition rules, enabling direct control over individual entities and their interactions. A lightweight engine executes these programs to update and maintain an explicit, persistent global world state, including off-screen entities and non-visual attributes. To connect world state with visual generation, we introduce state-augmented 3D oriented bounding boxes (OBBs) as an intermediate representation. This representation, together with the target camera trajectory, is deterministically compiled into pixel-aligned spatiotemporal conditioning signals for a pretrained video model serving as the generative renderer. This design allows users to create playable games with predefined mechanics, direct control over individual entities, and persistent world state throughout gameplay. We further introduce CombatStateBench, a benchmark for evaluating programmable world models. On CombatStateBench, our method achieves 94% Count Accuracy and 98% State Accuracy, substantially outperforming existing interactive video world models while supporting coherent long-horizon generation. These results demonstrate the effectiveness of separating explicit state evolution from generative rendering for building persistent, programmable worlds.", "arxiv_id": "2609.10540", "arxiv_url": "https://arxiv.org/abs/2609.10540", "authors": ["Zheng-Hui Huang", "Guixu Lin", "Jiacheng Lin", "Yi-Chuan Huang", "Ruihan Yu", "Muyao Niu", "Siqi Yang", "Yu-Lun Liu", "Yung-Yu Chuang", "Kaipeng Zhang", "Zhixiang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Programmable World Model\uff0c\u5c06\u4e16\u754c\u72b6\u6001\u6f14\u5316\u4e0e\u89c6\u89c9\u751f\u6210\u89e3\u8026\uff1a\u7528\u53ef\u6267\u884c\u7a0b\u5e8f\u7ef4\u62a4\u5b9e\u4f53\u72b6\u6001\u4e0e\u8f6c\u79fb\u89c4\u5219\uff0c\u518d\u5c06\u72b6\u6001\u8f6c\u4e3a\u65f6\u7a7a\u6761\u4ef6\u4fe1\u53f7\u9a71\u52a8\u9884\u8bad\u7ec3\u89c6\u9891\u6a21\u578b\u6e32\u67d3\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AlayaLab/pwm", "github_stars": 37, "hf_url": "https://huggingface.co/papers/2609.10540", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u81ea\u7136\u8bed\u8a00\u5230\u53ef\u6267\u884c\u7a0b\u5e8f\u7684\u8f6c\u6362\uff0c\u663e\u5f0f\u5b9a\u4e49\u5b9e\u4f53\u72b6\u6001\u3001\u975e\u89c6\u89c9\u5c5e\u6027\u548c\u72b6\u6001\u8f6c\u79fb\u89c4\u5219\uff0c\u652f\u6301\u957f\u671f\u6301\u4e45\u4e16\u754c\u72b6\u6001\u3002", "\u5f15\u5165\u5e26\u72b6\u6001\u589e\u5f3a\u7684 3D \u6709\u5411\u5305\u56f4\u76d2\u4f5c\u4e3a\u4e2d\u95f4\u8868\u793a\uff0c\u5e76\u7ed3\u5408\u76f8\u673a\u8f68\u8ff9\u751f\u6210\u50cf\u7d20\u5bf9\u9f50\u7684\u65f6\u7a7a\u6761\u4ef6\u4fe1\u53f7\u3002", "\u63d0\u51fa CombatStateBench\uff1b\u65b9\u6cd5\u8fbe\u5230 94% Count Accuracy \u548c 98% State Accuracy\uff0c\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u53ef\u7f16\u7a0b\u4eff\u771f", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10540v1", "published_at": "2026-09-09", "score": 0.302, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.10540.png", "title": "Programmable World Model", "tldr": "\u663e\u5f0f\u72b6\u6001\u9a71\u52a8\u53ef\u7f16\u7a0b\u89c6\u9891\u4e16\u754c\u6a21\u578b", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51fa Programmable World Model\uff0c\u5c06\u4e16\u754c\u72b6\u6001\u6f14\u5316\u4e0e\u89c6\u89c9\u751f\u6210\u89e3\u8026\uff1a\u7528\u53ef\u6267\u884c\u7a0b\u5e8f\u7ef4\u62a4\u5b9e\u4f53\u72b6\u6001\u4e0e\u8f6c\u79fb\u89c4\u5219\uff0c\u518d\u5c06\u72b6\u6001\u8f6c\u4e3a\u65f6\u7a7a\u6761\u4ef6\u4fe1\u53f7\u9a71\u52a8\u9884\u8bad\u7ec3\u89c6\u9891\u6a21\u578b\u6e32\u67d3\u3002", "why_notable": "\u5b83\u628a\u53ef\u63a7\u89c4\u5219\u7cfb\u7edf\u4e0e\u751f\u6210\u5f0f\u89c6\u9891\u6e32\u67d3\u5206\u79bb\uff0c\u7f13\u89e3\u4e86\u89c6\u9891\u4e16\u754c\u6a21\u578b\u96be\u4ee5\u4fdd\u6301\u957f\u671f\u4e00\u81f4\u72b6\u6001\u7684\u95ee\u9898\uff0c\u4e3a\u53ef\u73a9\u6e38\u620f\u3001\u4ea4\u4e92\u4eff\u771f\u548c\u53ef\u7f16\u7a0b\u865a\u62df\u73af\u5883\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u67b6\u6784\u3002"}, {"abstract": "Diffusion-based models enable monocular geometry estimation, yet their pixel-space precision is limited by a shared, under-studied error source: VAE reconstruction degradation. The 8x spatial compression in the VAE encoder-decoder degrades surface normals at object boundaries; even encoding and decoding ground-truth normals introduces 1.3--8.5\u00b0 of mean angular error (MAE), with edge MAE reaching 2.8x the global MAE. We present TransNormal-2, a FLUX.2-based rectified-flow framework with single-step deterministic inference that addresses this degradation on both sides of the VAE decoder: in how latent predictions are supervised during training, and in how decoded normals are corrected at inference. First, geometry-aware pixel-space losses, including inverse rendering self-consistency, von~Mises-Fisher angular loss, and wavelet edge-aware regularization, complement latent MSE by enforcing spherical normal geometry and diffuse image-formation cues after VAE decoding. Second, a lightweight Geometric Refinement Module (GRM) applies an RGB-guided residual correction to reduce boundary-localized decoding errors without freely rewriting the coarse prediction. On general-scene benchmarks, TransNormal-2 matches or exceeds MoGe-2 on all eight reported metrics while using only 1.4% as many task-specific normal annotations. The gains are clearest for transparent objects, reducing MAE by 4.2\u00b0 on ClearGrasp and 3.1\u00b0 on ClearPose over the strongest prior baselines. Code will be released at https://longxiang-ai.github.io/TransNormal-2.", "arxiv_id": "2609.06665", "arxiv_url": "https://arxiv.org/abs/2609.06665", "authors": ["Mingwei Li", "Yi Yang", "Hehe Fan"], "brief": "\u8bba\u6587\u63d0\u51fa TransNormal-2\uff0c\u4e00\u4e2a\u57fa\u4e8e FLUX.2 rectified flow \u7684\u5355\u76ee\u8868\u9762\u6cd5\u7ebf\u4f30\u8ba1\u6846\u67b6\u3002\u5b83\u9488\u5bf9\u6269\u6563/\u6d41\u6a21\u578b\u4e2d VAE 8\u500d\u538b\u7f29\u5bfc\u81f4\u7684\u8fb9\u754c\u6cd5\u7ebf\u91cd\u5efa\u8bef\u5dee\uff0c\u4ece\u8bad\u7ec3\u635f\u5931\u548c\u63a8\u7406\u540e\u5904\u7406\u4e24\u7aef\u8fdb\u884c\u51e0\u4f55\u7ea6\u675f\u4e0e\u4fee\u6b63\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/longxiang-ai/TransNormal-2", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.06665", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u5e76\u91cf\u5316 VAE \u91cd\u5efa\u9000\u5316\u662f\u6cd5\u7ebf\u4f30\u8ba1\u7cbe\u5ea6\u74f6\u9888\uff1a\u5373\u4fbf\u8f93\u5165\u771f\u503c\u6cd5\u7ebf\u518d\u7f16\u7801\u89e3\u7801\uff0c\u4e5f\u4f1a\u5e26\u6765 1.3\u20138.5\u00b0 \u5e73\u5747\u89d2\u8bef\u5dee\uff0c\u8fb9\u7f18\u8bef\u5dee\u6700\u9ad8\u8fbe\u5168\u5c40\u7684 2.8\u500d\u3002", "\u8bad\u7ec3\u4e2d\u5f15\u5165\u51e0\u4f55\u611f\u77e5\u50cf\u7d20\u7a7a\u95f4\u635f\u5931\uff0c\u5305\u62ec\u9006\u6e32\u67d3\u81ea\u4e00\u81f4\u6027\u3001von Mises-Fisher \u89d2\u5ea6\u635f\u5931\u548c\u5c0f\u6ce2\u8fb9\u7f18\u611f\u77e5\u6b63\u5219\uff0c\u4ee5\u8865\u5145 latent MSE\u3002", "\u63a8\u7406\u65f6\u4f7f\u7528\u8f7b\u91cf Geometric Refinement Module\uff0c\u901a\u8fc7 RGB \u5f15\u5bfc\u6b8b\u5dee\u6821\u6b63\u8fb9\u754c\u5c40\u90e8\u89e3\u7801\u9519\u8bef\uff0c\u5e76\u4fdd\u6301\u7c97\u9884\u6d4b\u6574\u4f53\u7ed3\u6784\uff1b\u5728\u900f\u660e\u7269\u4f53\u6570\u636e\u96c6\u4e0a\u76f8\u8f83\u6700\u5f3a\u57fa\u7ebf MAE \u964d\u4f4e 3.1\u20134.2\u00b0\u3002"], "keywords": ["\u5355\u76ee\u51e0\u4f55\u4f30\u8ba1", "\u6cd5\u7ebf\u4f30\u8ba1", "\u6d41\u6a21\u578b", "\u51e0\u4f55\u7ea6\u675f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06665v1", "published_at": "2026-09-06", "score": 0.302, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06665.png", "title": "TransNormal-2: Geometry-Grounded Rectified Flow with Edge-Aware Decoding for Precise Normal Estimation", "tldr": "\u7528\u51e0\u4f55\u7ea6\u675f\u4fee\u6b63VAE\u9000\u5316\u7684\u6cd5\u7ebf\u4f30\u8ba1", "upvotes": 18, "what_it_is": "\u8bba\u6587\u63d0\u51fa TransNormal-2\uff0c\u4e00\u4e2a\u57fa\u4e8e FLUX.2 rectified flow \u7684\u5355\u76ee\u8868\u9762\u6cd5\u7ebf\u4f30\u8ba1\u6846\u67b6\u3002\u5b83\u9488\u5bf9\u6269\u6563/\u6d41\u6a21\u578b\u4e2d VAE 8\u500d\u538b\u7f29\u5bfc\u81f4\u7684\u8fb9\u754c\u6cd5\u7ebf\u91cd\u5efa\u8bef\u5dee\uff0c\u4ece\u8bad\u7ec3\u635f\u5931\u548c\u63a8\u7406\u540e\u5904\u7406\u4e24\u7aef\u8fdb\u884c\u51e0\u4f55\u7ea6\u675f\u4e0e\u4fee\u6b63\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6293\u4f4f\u4e86\u751f\u6210\u5f0f\u51e0\u4f55\u4f30\u8ba1\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684 VAE \u89e3\u7801\u8bef\u5dee\u6765\u6e90\uff0c\u5c24\u5176\u6539\u5584\u7269\u4f53\u8fb9\u754c\u548c\u900f\u660e\u7269\u4f53\u7684\u6cd5\u7ebf\u4f30\u8ba1\uff1b\u540c\u65f6\u4ec5\u4f7f\u7528 MoGe-2 \u7ea6 1.4% \u7684\u4efb\u52a1\u6807\u6ce8\u91cf\u5374\u5728\u591a\u9879\u6307\u6807\u4e0a\u5339\u914d\u6216\u8d85\u8fc7\u5176\u8868\u73b0\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Linear attention is increasingly used in frontier language models for efficient long-context inference and constant-memory decoding. Its fixed-size recurrent memory, however, requires an online decision at each token: what to write and how strongly to overwrite existing associations before knowing which information future queries will require. Delta-rule models learn this strength from the current token embedding but do not track confidence in the memory estimate, preventing each write from adapting to accumulated evidence. To represent this uncertainty explicitly, we reformulate recurrent associative memory as a linear--Gaussian state-space model, for which the Kalman filter is the optimal recursive estimator, and introduce a new family of models, Kalman Delta Networks (KDNs). Within KDNs, the transition propagates both the memory state and its uncertainty, allowing the Kalman gain to weight each residual write by accumulated evidence and observation reliability. Under this formulation, Delta-style updates emerge as a special case that substitutes a token-wise isotropic surrogate for predictive covariance and omits covariance tracking. Exact tracking, however, entails a dense, state-dependent Riccati recursion that is poorly suited to GPU-parallel linear-attention scans. To address this issue, we introduce two scan-compatible KDN approximations. Diagonal KDN projects each one-step posterior onto the diagonal Gaussian family through online mean-field variational inference, whereas Isotropic KDN uses an isotropic approximation with a single uncertainty scalar per head. Their uncertainty recurrences are Mobius maps, enabling associative scans with logarithmic parallel depth. Across controlled pretraining at 750M and 1.3B parameters, KDN variants consistently improve perplexity and mean downstream accuracy over state-of-the-art linear-attention models.", "arxiv_id": "2609.07816", "arxiv_url": "https://arxiv.org/abs/2609.07816", "authors": ["Ngoc Bui", "Tinglin Huang", "Rex Ying"], "brief": "\u672c\u6587\u5c06\u7ebf\u6027\u6ce8\u610f\u529b\u4e2d\u7684\u5faa\u73af\u5173\u8054\u8bb0\u5fc6\u91cd\u6784\u4e3a\u7ebf\u6027\u9ad8\u65af\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\uff0c\u63d0\u51fa Kalman Delta Networks\uff08KDNs\uff09\u3002\u6a21\u578b\u663e\u5f0f\u8ddf\u8e2a\u8bb0\u5fc6\u72b6\u6001\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u7528\u5361\u5c14\u66fc\u589e\u76ca\u81ea\u9002\u5e94\u51b3\u5b9a\u6bcf\u6b21\u5199\u5165\u5bf9\u65e7\u8bb0\u5fc6\u7684\u8986\u76d6\u5f3a\u5ea6\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/ngocbh/kalman-delta-networks", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.07816", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa Delta-rule \u7ebf\u6027\u6ce8\u610f\u529b\u53ef\u89c6\u4e3a KDN \u7684\u7279\u4f8b\uff1a\u7528\u9010 token \u7684\u5404\u5411\u540c\u6027\u8fd1\u4f3c\u66ff\u4ee3\u9884\u6d4b\u534f\u65b9\u5dee\uff0c\u4e14\u4e0d\u8ddf\u8e2a\u771f\u5b9e\u4e0d\u786e\u5b9a\u6027\u3002", "\u4e3a\u907f\u514d\u7cbe\u786e Riccati \u9012\u5f52\u5e26\u6765\u7684\u9ad8\u6210\u672c\uff0c\u63d0\u51fa\u4e24\u79cd\u9002\u5408 GPU \u5e76\u884c scan \u7684\u8fd1\u4f3c\uff1aDiagonal KDN \u4e0e Isotropic KDN\u3002", "\u4e0d\u786e\u5b9a\u6027\u9012\u63a8\u53ef\u8868\u793a\u4e3a Mobius \u6620\u5c04\uff0c\u4ece\u800c\u652f\u6301\u5bf9\u6570\u6df1\u5ea6\u7684\u5173\u8054\u626b\u63cf\uff1b\u5728 7.5\u4ebf\u548c13\u4ebf\u53c2\u6570\u9884\u8bad\u7ec3\u4e2d\u4f18\u4e8e\u73b0\u6709\u7ebf\u6027\u6ce8\u610f\u529b\u6a21\u578b\u3002"], "keywords": ["\u7ebf\u6027\u6ce8\u610f\u529b", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027\u5efa\u6a21", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 2, "on_hf": true, "organization": "Yale University", "pdf_url": "https://arxiv.org/pdf/2609.07816v1", "published_at": "2026-09-07", "score": 0.299, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07816.png", "title": "Kalman Delta Networks: Uncertainty-aware Associative Memory", "tldr": "\u7528\u5361\u5c14\u66fc\u4e0d\u786e\u5b9a\u6027\u6539\u8fdb\u7ebf\u6027\u6ce8\u610f\u529b\u8bb0\u5fc6", "upvotes": 26, "what_it_is": "\u672c\u6587\u5c06\u7ebf\u6027\u6ce8\u610f\u529b\u4e2d\u7684\u5faa\u73af\u5173\u8054\u8bb0\u5fc6\u91cd\u6784\u4e3a\u7ebf\u6027\u9ad8\u65af\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\uff0c\u63d0\u51fa Kalman Delta Networks\uff08KDNs\uff09\u3002\u6a21\u578b\u663e\u5f0f\u8ddf\u8e2a\u8bb0\u5fc6\u72b6\u6001\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u7528\u5361\u5c14\u66fc\u589e\u76ca\u81ea\u9002\u5e94\u51b3\u5b9a\u6bcf\u6b21\u5199\u5165\u5bf9\u65e7\u8bb0\u5fc6\u7684\u8986\u76d6\u5f3a\u5ea6\u3002", "why_notable": "\u7ebf\u6027\u6ce8\u610f\u529b\u662f\u957f\u4e0a\u4e0b\u6587\u9ad8\u6548\u63a8\u7406\u7684\u91cd\u8981\u8def\u7ebf\uff0c\u4f46\u56fa\u5b9a\u5927\u5c0f\u8bb0\u5fc6\u5bb9\u6613\u9519\u8bef\u8986\u76d6\u4fe1\u606f\u3002KDN \u4e3a\u8bb0\u5fc6\u5199\u5165\u5f15\u5165\u539f\u5219\u6027\u7684\u8d1d\u53f6\u65af\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\uff0c\u540c\u65f6\u4fdd\u6301\u5e76\u884c\u53cb\u597d\uff0c\u5728\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u4e2d\u5e26\u6765\u56f0\u60d1\u5ea6\u548c\u4e0b\u6e38\u51c6\u786e\u7387\u63d0\u5347\u3002"}, {"abstract": "Video foundation models increasingly rely on large-scale pretraining data, yet the end-to-end data pipelines behind them remain largely closed and difficult to inspect or reuse. Researchers seeking to understand how video data recipes affect model pretraining often need to build substantial infrastructure before testing even a focused hypothesis. We present VIDAFORGE, an open research infrastructure that represents a video data recipe as an executable five-stage workflow from raw videos to training datasets. A decision in this workflow can be varied to construct alternative datasets while preserving how every sample was produced. To demon strate this research workflow, we compare data recipes with different coverage and quality in early from-scratch pretraining of Wan 2.1 and V-JEPA 2.1. Across both learning objectives, the broader-coverage recipe achieves the highest downstream benchmark scores, while loss-based evaluation favors different recipes. This study demonstrates how VidaForge connects data-recipe choices to downstream model performance. We further release VIDAFORGE-3M, containing 3.14 million scene level clips totaling 6,475 hours, with fine-grained annotations and curation signals for video data-recipe research.", "arxiv_id": "2609.06652", "arxiv_url": "https://arxiv.org/abs/2609.06652", "authors": ["Yan Ma", "Jiadi Su", "Zhulin Hu", "Ethan Chern", "Linhao Zhang", "Tiantian Mi", "Pengfei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa VidaForge\uff0c\u5c06\u89c6\u9891\u6570\u636e\u914d\u65b9\u8868\u793a\u4e3a\u4ece\u539f\u59cb\u89c6\u9891\u5230\u8bad\u7ec3\u6570\u636e\u96c6\u7684\u4e94\u9636\u6bb5\u53ef\u6267\u884c\u5de5\u4f5c\u6d41\uff0c\u53ef\u8ffd\u8e2a\u6bcf\u4e2a\u6837\u672c\u7684\u751f\u6210\u8fc7\u7a0b\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03 VIDAFORGE-3M\uff0c\u5305\u542b 314 \u4e07\u4e2a\u573a\u666f\u7ea7\u89c6\u9891\u7247\u6bb5\u30016475 \u5c0f\u65f6\u6570\u636e\u53ca\u7ec6\u7c92\u5ea6\u6807\u6ce8\u4e0e\u7b5b\u9009\u4fe1\u53f7\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/GAIR-NLP/VidaForge", "github_stars": 91, "hf_url": "https://huggingface.co/papers/2609.06652", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u652f\u6301\u7cfb\u7edf\u6027\u6539\u53d8\u6570\u636e\u8986\u76d6\u5ea6\u3001\u8d28\u91cf\u7b5b\u9009\u7b49\u914d\u65b9\u51b3\u7b56\uff0c\u5e76\u4fdd\u7559\u5b8c\u6574\u6570\u636e\u8840\u7f18\u4fe1\u606f", "\u5728 Wan 2.1 \u4e0e V-JEPA 2.1 \u7684\u65e9\u671f\u4ece\u96f6\u9884\u8bad\u7ec3\u4e2d\u6bd4\u8f83\u4e0d\u540c\u6570\u636e\u914d\u65b9", "\u5b9e\u9a8c\u663e\u793a\u8986\u76d6\u66f4\u5e7f\u7684\u6570\u636e\u914d\u65b9\u5728\u4e0b\u6e38\u57fa\u51c6\u4e0a\u8868\u73b0\u6700\u597d\uff0c\u800c\u57fa\u4e8e loss \u7684\u8bc4\u4f30\u504f\u597d\u4e0d\u540c\u914d\u65b9"], "keywords": ["\u89c6\u9891\u57fa\u7840\u6a21\u578b", "\u9884\u8bad\u7ec3\u6570\u636e", "\u6570\u636e\u5de5\u7a0b", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "VidaForge", "pdf_url": "https://arxiv.org/pdf/2609.06652v1", "published_at": "2026-09-06", "score": 0.298, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06652.png", "title": "VidaForge: Open Research Infrastructure for Video Pretraining Data Recipes", "tldr": "\u5f00\u653e\u89c6\u9891\u9884\u8bad\u7ec3\u6570\u636e\u914d\u65b9\u7814\u7a76\u57fa\u7840\u8bbe\u65bd", "upvotes": 18, "what_it_is": "\u8bba\u6587\u63d0\u51fa VidaForge\uff0c\u5c06\u89c6\u9891\u6570\u636e\u914d\u65b9\u8868\u793a\u4e3a\u4ece\u539f\u59cb\u89c6\u9891\u5230\u8bad\u7ec3\u6570\u636e\u96c6\u7684\u4e94\u9636\u6bb5\u53ef\u6267\u884c\u5de5\u4f5c\u6d41\uff0c\u53ef\u8ffd\u8e2a\u6bcf\u4e2a\u6837\u672c\u7684\u751f\u6210\u8fc7\u7a0b\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03 VIDAFORGE-3M\uff0c\u5305\u542b 314 \u4e07\u4e2a\u573a\u666f\u7ea7\u89c6\u9891\u7247\u6bb5\u30016475 \u5c0f\u65f6\u6570\u636e\u53ca\u7ec6\u7c92\u5ea6\u6807\u6ce8\u4e0e\u7b5b\u9009\u4fe1\u53f7\u3002", "why_notable": "\u89c6\u9891\u57fa\u7840\u6a21\u578b\u7684\u6570\u636e\u7ba1\u7ebf\u957f\u671f\u5c01\u95ed\u4e14\u96be\u590d\u73b0\uff0cVidaForge \u63d0\u4f9b\u4e86\u53ef\u6267\u884c\u3001\u53ef\u5ba1\u8ba1\u3001\u53ef\u590d\u7528\u7684\u5f00\u653e\u57fa\u7840\u8bbe\u65bd\uff0c\u6709\u52a9\u4e8e\u7814\u7a76\u6570\u636e\u914d\u65b9\u5982\u4f55\u5f71\u54cd\u89c6\u9891\u9884\u8bad\u7ec3\u4e0e\u4e0b\u6e38\u6027\u80fd\u3002"}, {"abstract": "Generating long-form multi-shot videos requires coherent within-shot motion and visually consistent narratives across shots. Existing video generators favor continuous motion and struggle to present complete shot sets when an entire narrative is packed along one temporal axis. We propose MovieGrid, a Multi-Grid Post-Training paradigm that decomposes a long video into shorter, temporally ordered chunks and arranges them on a spatial grid for joint modeling. This design reduces the number of shots handled by each temporal axis while enabling global information exchange across chunks. We construct the Multi-Grid Long Video (MGLV) dataset from 1,000 long-form videos using source video collection, hierarchical segmentation, grid video construction, and character-aware story annotation, producing 54K grid videos paired with story prompts. Our Noise-Free Random-Grid Training retains a random subset of chunks as clean visual context for denoising the remaining chunks. Grid Embedding encodes grid structure, character-aware Story Prompts link recurring entities, and Grid Boundary Loss stabilizes layouts. Under the same token budget, MovieGrid generates 6.05 times more shots than Temporal Packing in a 1,616-frame video. On a benchmark spanning five real-world categories, it achieves state-of-the-art intra-shot consistency (0.9131 versus 0.8086 for HoloCine) and inter-shot consistency (0.5914 versus 0.5384 for StoryMem). MovieGrid can further scale video length with minimal compromise through single or multiple generations.", "arxiv_id": "2609.06373", "arxiv_url": "https://arxiv.org/abs/2609.06373", "authors": ["Jiawei Mao", "Haoqin Tu", "Hardy Chen", "Yuhan Wang", "Keyang Xu", "Jieru Mei", "Hongliang Fei", "Ruogu Fang", "Wei Shao", "Cihang Xie", "Yuyin Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa MovieGrid\uff0c\u4e00\u79cd\u591a\u7f51\u683c\u540e\u8bad\u7ec3\u8303\u5f0f\uff0c\u5c06\u957f\u89c6\u9891\u62c6\u6210\u6309\u65f6\u95f4\u6392\u5e8f\u7684\u77ed\u7247\u6bb5\u5e76\u6392\u5e03\u5230\u7a7a\u95f4\u7f51\u683c\u4e2d\u8054\u5408\u5efa\u6a21\u3002\u5b83\u6784\u5efa\u4e86 MGLV \u6570\u636e\u96c6\uff0c\u5e76\u901a\u8fc7\u968f\u673a\u4fdd\u7559\u5e72\u51c0\u7f51\u683c\u4e0a\u4e0b\u6587\u3001\u7f51\u683c\u5d4c\u5165\u548c\u8fb9\u754c\u635f\u5931\u63d0\u5347\u957f\u7bc7\u591a\u955c\u5934\u89c6\u9891\u7684\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/jwmao1/moviegrid", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.06373", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u957f\u89c6\u9891\u5206\u89e3\u4e3a\u591a\u4e2a\u77ed chunk \u5e76\u653e\u5165\u7a7a\u95f4\u7f51\u683c\uff0c\u51cf\u5c11\u5355\u4e00\u65f6\u95f4\u8f74\u627f\u8f7d\u7684\u955c\u5934\u6570\u91cf\uff0c\u540c\u65f6\u652f\u6301\u8de8\u7247\u6bb5\u5168\u5c40\u4fe1\u606f\u4ea4\u6362\u3002", "\u6784\u5efa MGLV \u6570\u636e\u96c6\uff1a\u6765\u81ea 1000 \u4e2a\u957f\u89c6\u9891\uff0c\u5305\u542b 5.4 \u4e07\u4e2a\u7f51\u683c\u89c6\u9891\u53ca\u89d2\u8272\u611f\u77e5\u6545\u4e8b\u63d0\u793a\u3002", "\u5728\u76f8\u540c token \u9884\u7b97\u4e0b\uff0cMovieGrid \u5728 1616 \u5e27\u89c6\u9891\u4e2d\u53ef\u751f\u6210\u6bd4 Temporal Packing \u591a 6.05 \u500d\u7684\u955c\u5934\uff0c\u5e76\u5728\u955c\u5934\u5185\u4e00\u81f4\u6027\u548c\u955c\u5934\u95f4\u4e00\u81f4\u6027\u4e0a\u8fbe\u5230 SOTA\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u540e\u8bad\u7ec3", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06373v1", "published_at": "2026-09-06", "score": 0.298, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06373.png", "title": "Multi-Grid Post-Training for Long-Form Multi-Shot Video Generation", "tldr": "MovieGrid\u7528\u7a7a\u95f4\u7f51\u683c\u751f\u6210\u66f4\u957f\u591a\u955c\u5934\u89c6\u9891", "upvotes": 17, "what_it_is": "\u8bba\u6587\u63d0\u51fa MovieGrid\uff0c\u4e00\u79cd\u591a\u7f51\u683c\u540e\u8bad\u7ec3\u8303\u5f0f\uff0c\u5c06\u957f\u89c6\u9891\u62c6\u6210\u6309\u65f6\u95f4\u6392\u5e8f\u7684\u77ed\u7247\u6bb5\u5e76\u6392\u5e03\u5230\u7a7a\u95f4\u7f51\u683c\u4e2d\u8054\u5408\u5efa\u6a21\u3002\u5b83\u6784\u5efa\u4e86 MGLV \u6570\u636e\u96c6\uff0c\u5e76\u901a\u8fc7\u968f\u673a\u4fdd\u7559\u5e72\u51c0\u7f51\u683c\u4e0a\u4e0b\u6587\u3001\u7f51\u683c\u5d4c\u5165\u548c\u8fb9\u754c\u635f\u5931\u63d0\u5347\u957f\u7bc7\u591a\u955c\u5934\u89c6\u9891\u7684\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7ed5\u5f00\u4e86\u957f\u89c6\u9891\u751f\u6210\u4e2d\u5355\u65f6\u95f4\u8f74\u96be\u4ee5\u627f\u8f7d\u5b8c\u6574\u53d9\u4e8b\u7684\u95ee\u9898\uff0c\u7528\u7a7a\u95f4\u7f51\u683c\u5316\u5efa\u6a21\u663e\u8457\u6269\u5c55\u591a\u955c\u5934\u751f\u6210\u80fd\u529b\uff0c\u5bf9\u7535\u5f71\u7ea7\u957f\u89c6\u9891\u751f\u6210\u548c\u53d9\u4e8b\u4e00\u81f4\u6027\u5efa\u6a21\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We study the problem of navigating cluttered indoor environments with a humanoid robot. Unlike conventional methods that model navigation as a 2D path planning problem, humanoid traversal in cluttered environments requires continuous geometry-aware whole-body adaptation, including coordinated arm placement, torso adjustment, and gait modulation for collision-free movement through complex 3D spaces. We introduce TANGO, the first whole-body vision-language navigation framework for language-conditioned humanoid traversal in cluttered environments. Given a natural-language instruction and egocentric RGB observations, TANGO directly predicts 29-DoF joint-space actions for downstream whole-body control. We train TANGO entirely in simulation by synthesizing diverse collision-free traversal behaviors via global path planning, kinematic whole-body motion generation, obstacle-aware motion editing, and RL-based tracking. This pipeline provides dynamically feasible action supervision for learning language-conditioned whole-body policies. In extensive simulation experiments, TANGO demonstrates state-of-the-art performance in vision-language navigation, while outperforming strong modular baselines in navigating challenging scenes requiring obstacle negotiation. Lastly, we deploy TANGO zero-shot on a Unitree G1 humanoid robot, and observe robust language-guided traversal in cluttered real-world scenes without training on any real-world navigation data.", "arxiv_id": "2609.09158", "arxiv_url": "https://arxiv.org/abs/2609.09158", "authors": ["Anqi Li", "Yuxin Chen", "Zhaobo Li", "Zhuo Cao", "Junli Ren", "Masayoshi Tomizuka", "Dhruv Shah"], "brief": "\u8bba\u6587\u63d0\u51fa TANGO\uff0c\u4e00\u4e2a\u9762\u5411\u6742\u4e71\u5ba4\u5185\u73af\u5883\u7684\u4eba\u5f62\u673a\u5668\u4eba\u5168\u8eab\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u5bfc\u822a\u6846\u67b6\u3002\u5b83\u6839\u636e\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u548c\u7b2c\u4e00\u89c6\u89d2 RGB \u56fe\u50cf\uff0c\u76f4\u63a5\u9884\u6d4b 29 \u81ea\u7531\u5ea6\u5173\u8282\u7a7a\u95f4\u52a8\u4f5c\uff0c\u5b9e\u73b0\u624b\u81c2\u3001\u8eaf\u5e72\u4e0e\u6b65\u6001\u7684\u534f\u540c\u907f\u969c\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09158", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u4eba\u5f62\u673a\u5668\u4eba\u5bfc\u822a\u4ece\u4f20\u7edf 2D \u8def\u5f84\u89c4\u5212\u6269\u5c55\u4e3a\u8fde\u7eed\u3001\u51e0\u4f55\u611f\u77e5\u7684\u5168\u8eab\u52a8\u4f5c\u751f\u6210\u95ee\u9898", "\u5728\u4eff\u771f\u4e2d\u901a\u8fc7\u5168\u5c40\u8def\u5f84\u89c4\u5212\u3001\u8fd0\u52a8\u5b66\u5168\u8eab\u52a8\u4f5c\u751f\u6210\u3001\u969c\u788d\u611f\u77e5\u52a8\u4f5c\u7f16\u8f91\u548c\u5f3a\u5316\u5b66\u4e60\u8ddf\u8e2a\u5408\u6210\u53ef\u884c\u76d1\u7763\u6570\u636e", "\u5728\u4eff\u771f\u4e2d\u4f18\u4e8e\u6a21\u5757\u5316\u57fa\u7ebf\uff0c\u5e76\u5728 Unitree G1 \u4e0a\u5b9e\u73b0\u65e0\u771f\u5b9e\u5bfc\u822a\u6570\u636e\u8bad\u7ec3\u7684\u96f6\u6837\u672c\u90e8\u7f72"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u4eba\u5f62\u673a\u5668\u4eba", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09158v1", "published_at": "2026-09-08", "score": 0.282, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09158.png", "title": "TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model", "tldr": "TANGO\u8ba9\u4eba\u5f62\u673a\u5668\u4eba\u6309\u8bed\u8a00\u7a7f\u8d8a\u6742\u4e71\u5ba4\u5185", "upvotes": 19, "what_it_is": "\u8bba\u6587\u63d0\u51fa TANGO\uff0c\u4e00\u4e2a\u9762\u5411\u6742\u4e71\u5ba4\u5185\u73af\u5883\u7684\u4eba\u5f62\u673a\u5668\u4eba\u5168\u8eab\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u5bfc\u822a\u6846\u67b6\u3002\u5b83\u6839\u636e\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u548c\u7b2c\u4e00\u89c6\u89d2 RGB \u56fe\u50cf\uff0c\u76f4\u63a5\u9884\u6d4b 29 \u81ea\u7531\u5ea6\u5173\u8282\u7a7a\u95f4\u52a8\u4f5c\uff0c\u5b9e\u73b0\u624b\u81c2\u3001\u8eaf\u5e72\u4e0e\u6b65\u6001\u7684\u534f\u540c\u907f\u969c\u3002", "why_notable": "\u8fd9\u662f\u8f83\u65e9\u5c06\u89c6\u89c9-\u8bed\u8a00\u5bfc\u822a\u4e0e\u4eba\u5f62\u673a\u5668\u4eba\u5168\u8eab\u63a7\u5236\u6df1\u5ea6\u7ed3\u5408\u7684\u5de5\u4f5c\uff0c\u76f4\u63a5\u8f93\u51fa\u9ad8\u81ea\u7531\u5ea6\u5173\u8282\u52a8\u4f5c\uff0c\u5c55\u793a\u4e86\u8bed\u8a00\u6761\u4ef6\u4e0b\u7a7f\u8d8a\u590d\u6742 3D \u6742\u4e71\u73af\u5883\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "As large language models (LLMs) are increasingly deployed in alignment-sensitive contexts, activation steering has emerged as a lightweight, inference-time alternative to fine-tuning methods (e.g., RLHF, DPO) for behavioral control. However, existing work typically validates steering on isolated behaviors, leaving it unclear whether steering vectors encode coherent semantic structure or merely exploit behavior-specific shortcuts. We investigate whether the latent geometry of LLM steering vectors reflects theory-specified structure in human values and morality. Using Schwartz\u0027s Theory of Basic Human Values as our primary fine-grained framework, we introduce a 26K-sample benchmark covering 20 human values and analyze distribution-driven methods (e.g., CAA, SphericalSteer, ODESteer) and behavior-centric approaches (e.g., COLD-Steer, BiPO) across diverse model families and sizes. We find that distribution-driven methods recover human value topologies aligned with theoretical predictions (Spearman $\u03c1$ up to 0.51, $p \u003c 10^{-13}$). In contrast, behavior-centric methods achieve comparable steering performance but show little correlation with the expected value geometry. Geometric fidelity improves with model scale but drops after instruction tuning. Finally, better geometric alignment also leads to more human-consistent transfer across values: steering one value correctly lifts compatible values and suppresses opposing ones. Code and data are available at: https://github.com/DeepRCL/Steering_Geometry.", "arxiv_id": "2609.06289", "arxiv_url": "https://arxiv.org/abs/2609.06289", "authors": ["Mohammad Mahdi Abootorabi", "Armin Saghafian", "Ali Bazshoushtari", "Hamid Rezaei", "EunJeong Hwang", "Vered Shwartz", "Parvin Mousavi", "Purang Abolmaesumi"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u8986\u76d620\u7c7b\u4eba\u7c7b\u4ef7\u503c\u30012.6\u4e07\u6837\u672c\u7684\u57fa\u51c6\uff0c\u7528Schwartz\u57fa\u672c\u4eba\u7c7b\u4ef7\u503c\u7406\u8bba\u68c0\u9a8cLLM\u6fc0\u6d3b\u8f6c\u5411\u5411\u91cf\u7684\u6f5c\u5728\u51e0\u4f55\u7ed3\u6784\u3002\u7814\u7a76\u6bd4\u8f83\u591a\u7c7b\u8f6c\u5411\u65b9\u6cd5\uff0c\u53d1\u73b0\u5206\u5e03\u9a71\u52a8\u65b9\u6cd5\u80fd\u66f4\u597d\u6062\u590d\u7406\u8bba\u9884\u671f\u7684\u4ef7\u503c\u62d3\u6251\uff0c\u800c\u884c\u4e3a\u4e2d\u5fc3\u65b9\u6cd5\u867d\u80fd\u8f6c\u5411\u4f46\u51e0\u4f55\u4e00\u81f4\u6027\u8f83\u5f31\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/DeepRCL/Steering_Geometry", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.06289", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8eSchwartz\u4ef7\u503c\u7406\u8bba\u6784\u5efa26K\u6837\u672c\u57fa\u51c6\uff0c\u8986\u76d620\u79cd\u4eba\u7c7b\u4ef7\u503c\uff0c\u7528\u4e8e\u8bc4\u4f30\u8f6c\u5411\u7a7a\u95f4\u662f\u5426\u5177\u6709\u53ef\u89e3\u91ca\u8bed\u4e49\u51e0\u4f55\u3002", "CAA\u3001SphericalSteer\u3001ODESteer\u7b49\u5206\u5e03\u9a71\u52a8\u65b9\u6cd5\u4e0e\u7406\u8bba\u4ef7\u503c\u62d3\u6251\u663e\u8457\u76f8\u5173\uff0cSpearman\u76f8\u5173\u6700\u9ad8\u8fbe0.51\uff0cp \u003c 1e-13\u3002", "\u51e0\u4f55\u4fdd\u771f\u5ea6\u968f\u6a21\u578b\u89c4\u6a21\u63d0\u5347\u800c\u589e\u5f3a\uff0c\u4f46\u5728\u6307\u4ee4\u5fae\u8c03\u540e\u4e0b\u964d\uff1b\u66f4\u597d\u7684\u51e0\u4f55\u5bf9\u9f50\u8fd8\u80fd\u5e26\u6765\u66f4\u7b26\u5408\u4eba\u7c7b\u76f4\u89c9\u7684\u8de8\u4ef7\u503c\u8fc1\u79fb\u3002"], "keywords": ["\u6a21\u578b\u5bf9\u9f50", "\u6fc0\u6d3b\u8f6c\u5411", "\u4ef7\u503c\u5bf9\u9f50", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 3, "on_hf": true, "organization": "DeepRCL", "pdf_url": "https://arxiv.org/pdf/2609.06289v1", "published_at": "2026-09-05", "score": 0.277, "selected_reasons": ["HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06289.png", "title": "Steering Geometry: Validating Human Value Geometry in LLM Steering Space", "tldr": "\u9a8c\u8bc1LLM\u8f6c\u5411\u5411\u91cf\u8574\u542b\u4eba\u7c7b\u4ef7\u503c\u51e0\u4f55", "upvotes": 27, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u8986\u76d620\u7c7b\u4eba\u7c7b\u4ef7\u503c\u30012.6\u4e07\u6837\u672c\u7684\u57fa\u51c6\uff0c\u7528Schwartz\u57fa\u672c\u4eba\u7c7b\u4ef7\u503c\u7406\u8bba\u68c0\u9a8cLLM\u6fc0\u6d3b\u8f6c\u5411\u5411\u91cf\u7684\u6f5c\u5728\u51e0\u4f55\u7ed3\u6784\u3002\u7814\u7a76\u6bd4\u8f83\u591a\u7c7b\u8f6c\u5411\u65b9\u6cd5\uff0c\u53d1\u73b0\u5206\u5e03\u9a71\u52a8\u65b9\u6cd5\u80fd\u66f4\u597d\u6062\u590d\u7406\u8bba\u9884\u671f\u7684\u4ef7\u503c\u62d3\u6251\uff0c\u800c\u884c\u4e3a\u4e2d\u5fc3\u65b9\u6cd5\u867d\u80fd\u8f6c\u5411\u4f46\u51e0\u4f55\u4e00\u81f4\u6027\u8f83\u5f31\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06LLM\u6fc0\u6d3b\u8f6c\u5411\u4ece\u5355\u70b9\u884c\u4e3a\u63a7\u5236\u63a8\u8fdb\u5230\u7ed3\u6784\u5316\u4ef7\u503c\u5bf9\u9f50\u9a8c\u8bc1\uff0c\u63ed\u793a\u4e0d\u540c\u8f6c\u5411\u65b9\u6cd5\u662f\u5426\u771f\u6b63\u7f16\u7801\u4eba\u7c7b\u4ef7\u503c\u8bed\u4e49\u5173\u7cfb\uff0c\u5bf9\u53ef\u89e3\u91ca\u5bf9\u9f50\u3001\u8f7b\u91cf\u7ea7\u63a8\u7406\u65f6\u63a7\u5236\u548c\u5b89\u5168\u8bc4\u4f30\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Image relighting is traditionally tackled via complex inverse rendering pipelines, which suffer from ill-posed optimization, or single-image generative models that ignore crucial multi-view cues necessary for understanding 3D geometry and material interactions. To address these limitations, we introduce a feed-forward generative Transformer for direct single- and multi-view image relighting that entirely bypasses explicit intrinsic property estimation. Adapted from a video foundation model, our architecture features a latent illumination module that dynamically injects target environment maps into spatial features via cross-attention. Furthermore, we employ permutation-invariant positional encodings to symmetrically process unordered multi-view inputs without sequential bias. To train this robust data-driven model, we construct the massive Laval Objaverse Dataset (LOD), comprising 90K objects and 39K unique illuminations. Extensive experiments demonstrate state-of-the-art visual quality, photorealistic relighting quality, and strong zero-shot generalization across single-view, multi-view, and novel-view relighting tasks.", "arxiv_id": "2609.07414", "arxiv_url": "https://arxiv.org/abs/2609.07414", "authors": ["Hejun Wang", "Jinxi Li", "Junwei Jiang", "Shiwei Mao", "Hu Cheng", "Shouwang Huang", "Bo Yang"], "brief": "\u8bba\u6587\u63d0\u51fa RelightFormer\uff0c\u4e00\u4e2a\u524d\u9988\u751f\u6210\u5f0f Transformer\uff0c\u53ef\u76f4\u63a5\u8fdb\u884c\u5355\u89c6\u89d2\u4e0e\u591a\u89c6\u89d2\u7269\u4f53\u56fe\u50cf\u91cd\u6253\u5149\uff0c\u65e0\u9700\u663e\u5f0f\u4f30\u8ba1\u51e0\u4f55\u3001\u6750\u8d28\u7b49\u5185\u7980\u5c5e\u6027\u3002\u6a21\u578b\u6539\u9020\u81ea\u89c6\u9891\u57fa\u7840\u6a21\u578b\uff0c\u5e76\u6784\u5efa\u5927\u89c4\u6a21 Laval Objaverse Dataset \u7528\u4e8e\u8bad\u7ec3\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR", "cs.LG", "cs.MM"], "github_repo": "https://github.com/vLAR-group/RelightFormer", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.07414", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u6f5c\u5728\u5149\u7167\u6a21\u5757\u5c06\u76ee\u6807\u73af\u5883\u5149\u7167\u56fe\u4ee5\u4ea4\u53c9\u6ce8\u610f\u529b\u65b9\u5f0f\u6ce8\u5165\u7a7a\u95f4\u7279\u5f81\uff0c\u5b9e\u73b0\u53ef\u63a7\u91cd\u6253\u5149", "\u4f7f\u7528\u7f6e\u6362\u4e0d\u53d8\u4f4d\u7f6e\u7f16\u7801\u5904\u7406\u65e0\u5e8f\u591a\u89c6\u89d2\u8f93\u5165\uff0c\u907f\u514d\u89c6\u89d2\u987a\u5e8f\u5e26\u6765\u7684\u5e8f\u5217\u504f\u7f6e", "\u6784\u5efa\u5305\u542b9\u4e07\u4e2a\u7269\u4f53\u30013.9\u4e07\u79cd\u72ec\u7279\u5149\u7167\u7684 LOD \u6570\u636e\u96c6\uff0c\u5728\u5355\u89c6\u89d2\u3001\u591a\u89c6\u89d2\u548c\u65b0\u89c6\u89d2\u91cd\u6253\u5149\u4e0a\u53d6\u5f97\u9886\u5148\u6548\u679c"], "keywords": ["\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b", "\u4e09\u7ef4\u89c6\u89c9", "\u56fe\u50cf\u7f16\u8f91"], "num_comments": 2, "on_hf": true, "organization": "The Hong Kong Polytechnic University", "pdf_url": "https://arxiv.org/pdf/2609.07414v1", "published_at": "2026-09-07", "score": 0.27, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07414.png", "title": "RelightFormer: Feed-forward Generative Transformer for Multiview Object Relighting", "tldr": "\u7528\u751f\u6210\u5f0fTransformer\u5b9e\u73b0\u9ad8\u8d28\u91cf\u591a\u89c6\u89d2\u7269\u4f53\u91cd\u6253\u5149", "upvotes": 8, "what_it_is": "\u8bba\u6587\u63d0\u51fa RelightFormer\uff0c\u4e00\u4e2a\u524d\u9988\u751f\u6210\u5f0f Transformer\uff0c\u53ef\u76f4\u63a5\u8fdb\u884c\u5355\u89c6\u89d2\u4e0e\u591a\u89c6\u89d2\u7269\u4f53\u56fe\u50cf\u91cd\u6253\u5149\uff0c\u65e0\u9700\u663e\u5f0f\u4f30\u8ba1\u51e0\u4f55\u3001\u6750\u8d28\u7b49\u5185\u7980\u5c5e\u6027\u3002\u6a21\u578b\u6539\u9020\u81ea\u89c6\u9891\u57fa\u7840\u6a21\u578b\uff0c\u5e76\u6784\u5efa\u5927\u89c4\u6a21 Laval Objaverse Dataset \u7528\u4e8e\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7ed5\u5f00\u4f20\u7edf\u9006\u6e32\u67d3\u4e2d\u51e0\u4f55\u4e0e\u6750\u8d28\u5206\u89e3\u7684\u75c5\u6001\u4f18\u5316\u95ee\u9898\uff0c\u4ee5\u6570\u636e\u9a71\u52a8\u524d\u9988\u751f\u6210\u6a21\u578b\u5b9e\u73b0\u66f4\u9ad8\u6548\u3001\u66f4\u903c\u771f\u7684\u7269\u4f53\u91cd\u6253\u5149\uff0c\u5e76\u5c55\u793a\u4e86\u8f83\u5f3a\u96f6\u6837\u672c\u6cdb\u5316\u80fd\u529b\uff0c\u5bf9\u865a\u62df\u5185\u5bb9\u751f\u6210\u3001\u7535\u5546\u5c55\u793a\u548c\u5f71\u89c6\u56fe\u5f62\u7ba1\u7ebf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The growing realism and accessibility of manipulated and generated faces threaten the trustworthiness of digital media. To detect such forgeries, deepfake detectors based on vision foundation models have shown promising performance, but they typically rely on a single pretrained representation and are prone to overfitting to particular training distributions. To improve generalization to unseen forgeries, we propose UCF-Net, an uncertainty-aware cascaded fusion network that harnesses CLIP\u0027s language-aligned semantic priors and DINO\u0027s self-supervised visual-structure priors. UCF-Net extracts hierarchical features across Transformer depths, uses layer-wise expert aggregation to adaptively combine each encoder\u0027s multi-level cues, and performs weighted fusion of the resulting representations based on entropy-derived uncertainty. We further consolidate public deepfake datasets into a unified benchmark of approximately 4M images and construct a separate cross-generator evaluation set with over 8K face images from eight recent generators. On the unified benchmark, UCF-Net achieves the best mean AUC among the evaluated methods in both in-domain and cross-domain evaluations. On the cross-generator set, it adapts effectively with limited target-domain data, although zero-shot transfer remains challenging.", "arxiv_id": "2609.07670", "arxiv_url": "https://arxiv.org/abs/2609.07670", "authors": ["Xuechao Zou", "Yi Zhou", "Kai Li", "Shun Zhang", "Yuhui Chen", "Congyan Lang", "Junliang Xing"], "brief": "\u8bba\u6587\u63d0\u51faUCF-Net\uff0c\u4e00\u79cd\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u7684\u7ea7\u8054\u878d\u5408\u7f51\u7edc\uff0c\u7528\u4e8e\u901a\u7528\u6df1\u4f2a\u4eba\u8138\u56fe\u50cf\u68c0\u6d4b\u3002\u5b83\u7ed3\u5408CLIP\u7684\u8bed\u4e49\u5148\u9a8c\u4e0eDINO\u7684\u89c6\u89c9\u7ed3\u6784\u5148\u9a8c\uff0c\u5e76\u5728\u591a\u5c42Transformer\u7279\u5f81\u4e0a\u8fdb\u884c\u81ea\u9002\u5e94\u878d\u5408\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/XavierJiezou/UCF-Net", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.07670", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528CLIP\u548cDINO\u4e24\u7c7b\u89c6\u89c9\u57fa\u7840\u6a21\u578b\uff0c\u5206\u522b\u6355\u83b7\u8bed\u8a00\u5bf9\u9f50\u8bed\u4e49\u4fe1\u606f\u4e0e\u81ea\u76d1\u7763\u89c6\u89c9\u7ed3\u6784\u7ebf\u7d22", "\u8bbe\u8ba1\u5c42\u7ea7\u4e13\u5bb6\u805a\u5408\u4e0e\u57fa\u4e8e\u71b5\u7684\u4e0d\u786e\u5b9a\u6027\u52a0\u6743\u878d\u5408\uff0c\u52a8\u6001\u6574\u5408\u4e0d\u540c\u6df1\u5ea6\u548c\u4e0d\u540c\u7f16\u7801\u5668\u7684\u7279\u5f81", "\u6574\u5408\u7ea6400\u4e07\u5f20\u56fe\u50cf\u7684\u7edf\u4e00\u6df1\u4f2a\u57fa\u51c6\uff0c\u5e76\u6784\u5efa\u5305\u542b8\u4e2a\u65b0\u8fd1\u751f\u6210\u5668\u30018000\u4f59\u5f20\u4eba\u8138\u7684\u8de8\u751f\u6210\u5668\u8bc4\u6d4b\u96c6"], "keywords": ["\u6df1\u4f2a\u68c0\u6d4b", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u591a\u6a21\u6001", "\u4e0d\u786e\u5b9a\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07670v1", "published_at": "2026-09-07", "score": 0.27, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07670.png", "title": "Harnessing CLIP and DINO: An Uncertainty-Aware Cascaded Fusion Network for Generalizable Deepfake Image Detection", "tldr": "\u878d\u5408CLIP\u4e0eDINO\u63d0\u5347\u6df1\u4f2a\u68c0\u6d4b\u6cdb\u5316\u6027", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51faUCF-Net\uff0c\u4e00\u79cd\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u7684\u7ea7\u8054\u878d\u5408\u7f51\u7edc\uff0c\u7528\u4e8e\u901a\u7528\u6df1\u4f2a\u4eba\u8138\u56fe\u50cf\u68c0\u6d4b\u3002\u5b83\u7ed3\u5408CLIP\u7684\u8bed\u4e49\u5148\u9a8c\u4e0eDINO\u7684\u89c6\u89c9\u7ed3\u6784\u5148\u9a8c\uff0c\u5e76\u5728\u591a\u5c42Transformer\u7279\u5f81\u4e0a\u8fdb\u884c\u81ea\u9002\u5e94\u878d\u5408\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u6df1\u4f2a\u68c0\u6d4b\u4e2d\u6700\u5173\u952e\u7684\u8de8\u57df\u6cdb\u5316\u95ee\u9898\uff0c\u8bc1\u660e\u591a\u57fa\u7840\u6a21\u578b\u4e92\u8865\u878d\u5408\u4f18\u4e8e\u4f9d\u8d56\u5355\u4e00\u9884\u8bad\u7ec3\u8868\u793a\uff1b\u540c\u65f6\u63d0\u4f9b\u5927\u89c4\u6a21\u7edf\u4e00\u8bc4\u6d4b\u4e0e\u8de8\u751f\u6210\u5668\u6d4b\u8bd5\uff0c\u6709\u52a9\u4e8e\u66f4\u771f\u5b9e\u5730\u8861\u91cf\u68c0\u6d4b\u5668\u7684\u5b9e\u7528\u9c81\u68d2\u6027\u3002"}, {"abstract": "Transferring human hand demonstrations to robotic grippers has recently emerged as a cost-effective solution for robot learning. However, existing methods are largely confined to simple, planar tasks and fail to handle complex spatial movements (e.g., intricate trajectories involving rotations or flips) that are essential for robot manipulation. Motivated by this gap, we adopt an implicit, data-driven approach guided by fine-grained hand-pose motions. To this end, we introduce a scalable acquisition pipeline to collect hand-gripper paired demonstrations, governed by a rigorous protocol that prioritizes motion complexity and leverages a handheld gripper for seamless action mimicry. This yields a large-scale paired dataset comprising 6,189 episodes across 1,254 unique objects, exhibiting significantly higher spatial complexity than existing benchmarks. However, learning such complex mappings remains challenging. We observe that naive end-to-end generation of full gripper pose sequences is insufficient, as minor trajectory deviations compound rapidly under intricate dynamics. To address this, we propose a two-stage framework: Stage I predicts sparse gripper keyframes (initial and terminal) to simplify the mapping objective, while Stage II generates the full continuous action sequence conditioned on these keyframes. Furthermore, to mitigate cumulative drift, we keep the gripper\u0027s orientation being learned while post-optimizing its translation based on the grasping heuristic and kinematic consistency. In both simulation and real-robot experiments, our framework enables stable and precise hand-to-gripper transfer of complex spatial manipulations, significantly outperforming traditional baselines. Project page: https://cosmoh2g.github.io.", "arxiv_id": "2609.07498", "arxiv_url": "https://arxiv.org/abs/2609.07498", "authors": ["Hongxiang Zhao", "Mutian Xu", "Zeyu Jin", "Yiming Hao", "Shuguang Cui", "Xiaoguang Han"], "brief": "\u8bba\u6587\u63d0\u51fa CosmoH2G\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742\u7a7a\u95f4\u7269\u4f53\u64cd\u4f5c\u7684\u624b\u90e8\u793a\u8303\u5230\u673a\u5668\u4eba\u5939\u722a\u8fc1\u79fb\u6570\u636e\u96c6\uff0c\u5e76\u7ed9\u51fa\u914d\u5957\u4e24\u9636\u6bb5\u57fa\u7ebf\u65b9\u6cd5\u3002\u6570\u636e\u96c6\u5305\u542b 6,189 \u6bb5\u914d\u5bf9\u793a\u8303\u30011,254 \u4e2a\u7269\u4f53\uff0c\u8986\u76d6\u65cb\u8f6c\u3001\u7ffb\u8f6c\u7b49\u9ad8\u7a7a\u95f4\u590d\u6742\u5ea6\u52a8\u4f5c\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/GAP-LAB-CUHK-SZ/CosmoH2G", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07498", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u53ef\u6269\u5c55\u91c7\u96c6\u6d41\u7a0b\uff0c\u7528\u624b\u6301\u5939\u722a\u540c\u6b65\u91c7\u96c6\u4eba\u624b\u52a8\u4f5c\u4e0e\u5939\u722a\u52a8\u4f5c\uff0c\u5f3a\u8c03\u590d\u6742\u4e09\u7ef4\u8f68\u8ff9\u4e0e\u7ec6\u7c92\u5ea6\u624b\u59ff\u6001\u8fd0\u52a8\u3002", "\u63d0\u51fa\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u9884\u6d4b\u5939\u722a\u521d\u59cb\u4e0e\u7ec8\u6b62\u7a00\u758f\u5173\u952e\u5e27\uff0c\u518d\u57fa\u4e8e\u5173\u952e\u5e27\u751f\u6210\u5b8c\u6574\u8fde\u7eed\u52a8\u4f5c\u5e8f\u5217\u3002", "\u4e3a\u51cf\u5c11\u590d\u6742\u8f68\u8ff9\u4e2d\u7684\u7d2f\u8ba1\u6f02\u79fb\uff0c\u5b66\u4e60\u5939\u722a\u671d\u5411\uff0c\u540c\u65f6\u7ed3\u5408\u6293\u53d6\u542f\u53d1\u5f0f\u4e0e\u8fd0\u52a8\u5b66\u4e00\u81f4\u6027\u540e\u4f18\u5316\u5e73\u79fb\uff0c\u5728\u4eff\u771f\u548c\u771f\u673a\u4e2d\u4f18\u4e8e\u4f20\u7edf\u57fa\u7ebf\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u6570\u636e\u96c6", "\u8fd0\u52a8\u89c4\u5212"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07498v1", "published_at": "2026-09-07", "score": 0.267, "selected_reasons": ["HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07498.png", "title": "CosmoH2G: A Hand-to-Gripper Transfer Dataset and Baseline Method for Object Manipulation with Complex Spatial Movements", "tldr": "\u5927\u89c4\u6a21\u624b\u5230\u5939\u722a\u590d\u6742\u64cd\u4f5c\u8fc1\u79fb\u6570\u636e\u96c6\u4e0e\u57fa\u7ebf", "upvotes": 25, "what_it_is": "\u8bba\u6587\u63d0\u51fa CosmoH2G\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742\u7a7a\u95f4\u7269\u4f53\u64cd\u4f5c\u7684\u624b\u90e8\u793a\u8303\u5230\u673a\u5668\u4eba\u5939\u722a\u8fc1\u79fb\u6570\u636e\u96c6\uff0c\u5e76\u7ed9\u51fa\u914d\u5957\u4e24\u9636\u6bb5\u57fa\u7ebf\u65b9\u6cd5\u3002\u6570\u636e\u96c6\u5305\u542b 6,189 \u6bb5\u914d\u5bf9\u793a\u8303\u30011,254 \u4e2a\u7269\u4f53\uff0c\u8986\u76d6\u65cb\u8f6c\u3001\u7ffb\u8f6c\u7b49\u9ad8\u7a7a\u95f4\u590d\u6742\u5ea6\u52a8\u4f5c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86\u624b\u5230\u5939\u722a\u8fc1\u79fb\u5728\u590d\u6742\u4e09\u7ef4\u64cd\u4f5c\u573a\u666f\u4e2d\u7684\u6570\u636e\u7a7a\u7f3a\uff0c\u5e76\u8868\u660e\u76f4\u63a5\u7aef\u5230\u7aef\u751f\u6210\u5b8c\u6574\u8f68\u8ff9\u5bb9\u6613\u5931\u7a33\uff1b\u5176\u6570\u636e\u96c6\u548c\u5206\u9636\u6bb5\u5efa\u6a21\u601d\u8def\u6709\u671b\u63a8\u52a8\u4f4e\u6210\u672c\u673a\u5668\u4eba\u793a\u6559\u5b66\u4e60\u8d70\u5411\u66f4\u590d\u6742\u7684\u771f\u5b9e\u64cd\u4f5c\u4efb\u52a1\u3002"}, {"abstract": "We present Cadence, an error-bounded lossy compressor for numeric time series pairing a 330M-parameter time-series foundation model (Google TimesFM-3) with an adaptive arithmetic coder, guaranteeing $|\\hat{x}_t-x_t|\\le\u03c4$ on every sample. One negative result constrains the design space: for lossless coding a foundation model is worth nothing, because bits saved are logarithmic in predictor accuracy, $\u0394b=\\log_2(\\mathrm{MAE_{old}}/\\mathrm{MAE_{new}})$. So the $1.51\\times$ advantage TimesFM-3 holds over a 32-tap linear predictor buys 0.60 bits of 20.28, a median gain of +0.03%. Error-bounded coding escapes this at one point: once a forecast lands inside the band the residual index is zero and the sample nearly free. Cadence contributes: (1) an adaptive range coder with context-modelled binarization, beating xz/zstd on real indices by 9.7% (15/15) and reversing a finding from a general-purpose back end; (2) a determinism result -- predictions are not bit-identical across batch sizes, and no PyTorch configuration repairs this, forcing group size and execution device into the container format; and (3) domain localization on corpora postdating any plausible training cutoff. On 49 EIA-930 balancing-authority demand series (2026) Cadence gains 13.3% over the best of six classical predictors, and 28.3% on 50 MTA ridership series (2026): 21.4% median over 297 series-tolerance pairs, winning all 297. Against downsampling, what time-series databases deploy for retention, its guaranteed worst-case error is $28$--$56\\times$ tighter at equal size. End-to-end, once the context bootstrap is paid for, gains run from 6.8% at six months of hourly data to 15.1% asymptotically. Attempting to falsify the domain claim on SDRBench, theory predicts failure and delivers: -0.8% median, 0 of 27 pairs gaining. Three further negative results and eight retracted claims are reported in full.", "arxiv_id": "2609.06008", "arxiv_url": "https://arxiv.org/abs/2609.06008", "authors": ["Roberto Tacconelli"], "brief": "\u8bba\u6587\u63d0\u51fa Cadence\uff0c\u5c06 3.3 \u4ebf\u53c2\u6570\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b TimesFM-3 \u4e0e\u81ea\u9002\u5e94\u7b97\u672f\u7f16\u7801\u7ed3\u5408\uff0c\u7528\u4e8e\u6570\u503c\u9700\u6c42\u65f6\u95f4\u5e8f\u5217\u7684\u6709\u635f\u538b\u7f29\uff0c\u5e76\u4fdd\u8bc1\u6bcf\u4e2a\u6837\u672c\u7684\u91cd\u6784\u8bef\u5dee\u4e0d\u8d85\u8fc7\u7ed9\u5b9a\u9608\u503c \u03c4\u3002\u4f5c\u8005\u8fd8\u7cfb\u7edf\u5206\u6790\u4e86\u57fa\u7840\u6a21\u578b\u5728\u65e0\u635f\u538b\u7f29\u4e2d\u6536\u76ca\u5f88\u5c0f\u3001\u4f46\u5728\u8bef\u5dee\u6709\u754c\u538b\u7f29\u4e2d\u53ef\u663e\u8457\u53d1\u6325\u4f5c\u7528\u7684\u539f\u56e0\u3002", "categories": ["cs.IT", "cs.DB", "cs.LG"], "github_repo": "https://github.com/robtacconelli/Cadence", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.06008", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Cadence \u7684\u81ea\u9002\u5e94 range coder \u4e0e\u4e0a\u4e0b\u6587\u5efa\u6a21\u4e8c\u503c\u5316\u5728\u771f\u5b9e\u7d22\u5f15\u6570\u636e\u4e0a\u6bd4 xz/zstd \u5e73\u5747\u597d 9.7%\uff0c\u5e76\u5728 15/15 \u4e2a\u4efb\u52a1\u4e0a\u80dc\u51fa\u3002", "\u5728 2026 \u5e74 EIA-930 \u7535\u529b\u9700\u6c42\u5e8f\u5217\u4e0a\u76f8\u8f83\u516d\u79cd\u7ecf\u5178\u9884\u6d4b\u5668\u6700\u4f73\u8005\u63d0\u5347 13.3%\uff0c\u5728 2026 \u5e74 MTA \u5ba2\u6d41\u5e8f\u5217\u4e0a\u63d0\u5347 28.3%\uff0c\u5171 297 \u4e2a\u5e8f\u5217-\u5bb9\u5dee\u7ec4\u5408\u5168\u90e8\u83b7\u80dc\u3002", "\u53d1\u73b0 PyTorch \u63a8\u7406\u5728\u4e0d\u540c batch size \u4e0b\u9884\u6d4b\u4e0d\u5b8c\u5168\u786e\u5b9a\uff0c\u9700\u5c06 group size \u4e0e\u6267\u884c\u8bbe\u5907\u5199\u5165\u5bb9\u5668\u683c\u5f0f\u4ee5\u4fdd\u8bc1\u53ef\u89e3\u7801\u590d\u73b0\u3002"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u57fa\u7840\u6a21\u578b", "\u6570\u636e\u538b\u7f29", "\u7b97\u672f\u7f16\u7801"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06008v1", "published_at": "2026-09-05", "score": 0.265, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06008.png", "title": "Cadence: Error-Bounded Lossy Compression of Demand Time Series with a Time-Series Foundation Model", "tldr": "\u7528 TimesFM \u505a\u6709\u8bef\u5dee\u754c\u7684\u65f6\u5e8f\u538b\u7f29", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa Cadence\uff0c\u5c06 3.3 \u4ebf\u53c2\u6570\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b TimesFM-3 \u4e0e\u81ea\u9002\u5e94\u7b97\u672f\u7f16\u7801\u7ed3\u5408\uff0c\u7528\u4e8e\u6570\u503c\u9700\u6c42\u65f6\u95f4\u5e8f\u5217\u7684\u6709\u635f\u538b\u7f29\uff0c\u5e76\u4fdd\u8bc1\u6bcf\u4e2a\u6837\u672c\u7684\u91cd\u6784\u8bef\u5dee\u4e0d\u8d85\u8fc7\u7ed9\u5b9a\u9608\u503c \u03c4\u3002\u4f5c\u8005\u8fd8\u7cfb\u7edf\u5206\u6790\u4e86\u57fa\u7840\u6a21\u578b\u5728\u65e0\u635f\u538b\u7f29\u4e2d\u6536\u76ca\u5f88\u5c0f\u3001\u4f46\u5728\u8bef\u5dee\u6709\u754c\u538b\u7f29\u4e2d\u53ef\u663e\u8457\u53d1\u6325\u4f5c\u7528\u7684\u539f\u56e0\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c55\u793a\u4e86\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u5728\u4f20\u7edf\u65e0\u635f\u538b\u7f29\u4e2d\u4ef7\u503c\u6709\u9650\uff0c\u5374\u80fd\u5728\u8bef\u5dee\u6709\u754c\u6709\u635f\u538b\u7f29\u4e2d\u901a\u8fc7\u201c\u9884\u6d4b\u843d\u5165\u5bb9\u5dee\u5e26\u5373\u8fd1\u4e4e\u96f6\u6210\u672c\u7f16\u7801\u201d\u5e26\u6765\u5b9e\u9645\u6536\u76ca\uff1b\u540c\u65f6\u7ed9\u51fa\u5de5\u7a0b\u5c42\u9762\u7684\u786e\u5b9a\u6027\u95ee\u9898\u548c\u8d1f\u7ed3\u679c\uff0c\u5bf9\u65f6\u5e8f\u6570\u636e\u5e93\u957f\u671f\u5b58\u50a8\u538b\u7f29\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Full-duplex spoken language models can listen and speak simultaneously, enabling them to handle interruptions and backchannels in human conversation. However, text generation, speech synthesis, and audio playback proceed asynchronously. As a result, what a model believes it has said may not match what has actually been played to the user. We refer to the problem of recovering from an interruption while remaining aware of the model\u0027s realized speech as anchor interruption. To address this problem, we propose Self-Listening, a full-duplex modeling approach that interleaves user speech, model text, and the model\u0027s played speech. By feeding the realized speech output back to the model as an input stream, self-listening grounds interruption recovery in what the user has actually heard. We further introduce AnchorSpeech, a collection with homogeneous training and test splits for tracking which items of structured ordered responses have actually been spoken. AnchorSpeech-test evaluates whether a model can respond consistently with the last completed item before an interruption. Experiments show that, compared with full-duplex baselines, models equipped with self-listening mechanism achieve better anchoring performance.", "arxiv_id": "2609.05592", "arxiv_url": "https://arxiv.org/abs/2609.05592", "authors": ["Xuanning Zhou", "Junyi Ao", "Xiaotong Liu", "Tom Ko", "Benyou Wang", "Haizhou Li"], "brief": "\u8bba\u6587\u63d0\u51fa Self-Listening \u65b9\u6cd5\uff0c\u5c06\u7528\u6237\u8bed\u97f3\u3001\u6a21\u578b\u6587\u672c\u4e0e\u5b9e\u9645\u64ad\u653e\u51fa\u7684\u6a21\u578b\u8bed\u97f3\u4ea4\u9519\u8f93\u5165\u6a21\u578b\uff0c\u4f7f\u5168\u53cc\u5de5\u8bed\u97f3\u6a21\u578b\u5728\u88ab\u6253\u65ad\u540e\u80fd\u57fa\u4e8e\u7528\u6237\u771f\u6b63\u542c\u5230\u7684\u5185\u5bb9\u7ee7\u7eed\u56de\u5e94\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 AnchorSpeech \u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u7ed3\u6784\u5316\u6709\u5e8f\u56de\u7b54\u4e2d\u54ea\u4e9b\u9879\u76ee\u5df2\u88ab\u5b9e\u9645\u8bf4\u51fa\u3002", "categories": ["cs.SD"], "github_repo": "https://github.com/FreedomIntelligence/LoopSpeech", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.05592", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u5168\u53cc\u5de5\u8bed\u97f3\u6a21\u578b\u4e2d\u751f\u6210\u6587\u672c\u3001\u8bed\u97f3\u5408\u6210\u548c\u97f3\u9891\u64ad\u653e\u5f02\u6b65\uff0c\u5bfc\u81f4\u201c\u6a21\u578b\u4ee5\u4e3a\u8bf4\u8fc7\u201d\u548c\u201c\u7528\u6237\u5b9e\u9645\u542c\u5230\u201d\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002", "\u901a\u8fc7\u628a\u6a21\u578b\u5df2\u64ad\u653e\u8bed\u97f3\u4f5c\u4e3a\u8f93\u5165\u6d41\u53cd\u9988\u7ed9\u6a21\u578b\uff0c\u5b9e\u73b0\u5bf9\u4e2d\u65ad\u6062\u590d\u7684\u951a\u5b9a\u3002", "AnchorSpeech-test \u8bc4\u4f30\u6a21\u578b\u662f\u5426\u80fd\u6839\u636e\u88ab\u6253\u65ad\u524d\u6700\u540e\u5b8c\u6574\u8bf4\u51fa\u7684\u9879\u76ee\u4fdd\u6301\u4e00\u81f4\u56de\u5e94\uff0c\u5b9e\u9a8c\u663e\u793a\u4f18\u4e8e\u5168\u53cc\u5de5\u57fa\u7ebf\u3002"], "keywords": ["\u8bed\u97f3\u6a21\u578b", "\u5168\u53cc\u5de5\u5bf9\u8bdd", "\u591a\u6a21\u6001", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 2, "on_hf": true, "organization": "FreedomAI", "pdf_url": "https://arxiv.org/pdf/2609.05592v1", "published_at": "2026-09-04", "score": 0.262, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05592.png", "title": "What Did I Just Say? Self-Listening for Full-Duplex Speech Models", "tldr": "\u8ba9\u5168\u53cc\u5de5\u8bed\u97f3\u6a21\u578b\u542c\u89c1\u81ea\u5df1\u5df2\u8bf4\u5185\u5bb9\u3002", "upvotes": 16, "what_it_is":
