<style>

  input[type=search] { flex:1; min-width:220px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }

  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }
  .modal-box h2 { margin:0 30px 12px 0; font-size:20px; line-height:1.45; }
  .modal-box .abs { font-size:14px; line-height:1.75; white-space:pre-wrap; background:var(--bg);

  .modal-box .lbl { font-weight:700; margin:16px 0 6px; font-size:14px; }
  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .pdfwrap iframe { width:100%; height:100%; border:0; }

<script>
const PAPERS = [{"abstract": "We introduce OpenMobile-2, a near-frontier mobile agent with fully open training environments and recipes. We make three key advances: (1) Diverse environments with simulated commercial apps: We build MobileGym++, featuring 35 realistic, functionally rich commercial-style apps with cross-app workflows, while preserving full controllability for reset and verification. Together with newly configured apps in Android emulators, this yields a diverse playground spanning over 110 apps. (2) Open training data at scale: Building on this foundation, we curate nearly 12K mobile interaction trajectories for supervised fine-tuning and the largest open collection of verifiable RL training data for mobile agents, comprising over 2K executable tasks with automatic rewards. (3) Hybrid GUI and app-native tool use: We explore an experimental mobile-use setting where apps expose selected functionalities as app-native tools alongside their GUIs, allowing agents to interleave GUI actions and tool calls within a task. We implement this setting in MobileGym++ with over 300 carefully scoped tools across 50+ apps. Additionally, we introduce MobileGym++ Bench for complex, long-horizon commercial mobile scenarios, supporting both GUI-only and hybrid GUI-tool evaluation on a shared task suite. OpenMobile-2 performs competitively across established benchmarks, including AndroidWorld (79.9) and MobileWorld (50.4), while showing promising transfer to real-device mobile use, nearly doubling SPA-Bench performance from 31.9 to 59.6. All resources are available at https://os-copilot.github.io/OpenMobile2-Home/.", "arxiv_id": "2610.14157", "arxiv_url": "https://arxiv.org/abs/2610.14157", "authors": ["Chenyang Yan", "Yingying Zhang", "Kanzhi Cheng", "Qiushi Sun", "Zhengyuan Pan", "Zheng Ma", "Hang Yan", "Yian Wang", "Nuo Chen", "Jialin Cao", "Xingdong Gong", "Wenpo Song", "Han Chen", "Zichen Ding", "Fangzhi Xu", "Shujian Huang", "Xinyu Dai", "Yichen Liu", "Tiankuo Yao", "Bo Wang", "Ben Kao", "Jianbing Zhang", "Lewei Lu", "Dahua Lin"], "brief": "", "categories": ["cs.SE", "cs.CL", "cs.CV"], "github_repo": "https://github.com/OpenMobile2/OpenMobile2-Code", "github_stars": 27, "hf_url": "https://huggingface.co/papers/2610.14157", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": "Nanjing University", "pdf_url": "https://arxiv.org/pdf/2610.14157v1", "published_at": "2026-10-09", "score": 0.36, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (38\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14157.png", "title": "OpenMobile-2: Building Versatile Mobile Agents with Scalable Environments and App-Native Tools", "tldr": null, "upvotes": 38, "what_it_is": null, "why_notable": null}, {"abstract": "GPT-6-Astra demonstrates a level of competence in robotic manipulation and navigation that challenges the conventional paradigm of building specialized models for individual tasks and embodiments. In this report, we ask not only how capable GPT-6-Astra is, but what its capabilities imply for the field. First, we probe the limits of standalone GPT-6-Astra. We conduct a large-scale evaluation across 12 representative benchmarks spanning tabletop manipulation, humanoids, mobile platforms, and dexterous hands. Under a unified protocol that allows in-context learning (ICL) from training-set demonstrations and substantially increases the number of execution steps, GPT-6-Astra achieves unprecedented performance (Fig. 1). Future research may focus on improving 1) the generality of ICL 2) cost and execution time, 3) physical-state verification, 4) recovery from irreversible failures, and 5) long-horizon preservation of progress. Second, we study the agentic harness for embodied control. We identify that close-loop coordination between a high-level \"System 2\" reasoner (i.e., GPT-6-Astra) and a low-level \"System 1\" controller (e.g., \u03c00.5) is costly but effective. Third, we examine GPT-6-Astra on real-world deployment. Our experiments on 8 robot configurations reveal substantial gaps: 1) robot demonstrations required for ICL are expensive to collect, and 2) it is implausible to trade longer execution for higher success rates with physical constraints. Fourth, we envision the next generation of embodied benchmarks. We develop a prototype that 1) derives tasks from real-world needs, 2) provides no in-domain demonstrations, and 3) judges agents on a world clock that keeps running while they deliberate. Taken together, our results suggest that GPT-6-Astra has largely crossed the threshold of embodied competence, but not yet that of practical embodied intelligence.", "arxiv_id": "2610.22471", "arxiv_url": "https://arxiv.org/abs/2610.22471", "authors": ["SenseNova", "Joint Research Team", ":", "Zhongang Cai", "Ziang Cao", "Tailai Chen", "Han Chong Chua", "Linjun Dai", "Hanming Deng", "Hokin Deng", "Haiwen Diao", "Chenjing Ding", "Weichen Fan", "Xiao Fu", "Zerui Gong", "Chenyang Gu", "Zexin He", "Zhi Hou", "Bo Li", "Qinyue Li", "Quanzhou Li", "Xiaowan Li", "Zhichao Liao", "Dahua Lin", "Zilong Lin", "Bo Liu", "Chunxiao Liu", "Pengfei Liu", "Tianqi Liu", "Ziwei Liu", "Chen Change Loy", "Lewei Lu", "Jiapeng Luo", "Yuexiao Ma", "Liang Pan", "Xingang Pan", "Oscar Qian", "Ziyi Shang", "Yuyao Shao", "Dawei Su", "Dacheng Tao", "Qingyi Tao", "Quan Wang", "Ruisi Wang", "Xiaogang Wang", "Ziyi Wang", "Beichen Wen", "Donghao Wu", "Jiaxu Wu", "Silei Wu", "Xiaoming Wu", "Zhonghua Wu", "Hongcan Xiao", "Weiye Xu", "Atsushi Yamashita", "Lei Yang", "Zhe Yang", "Baiqiao Yin", "Wanqi Yin", "Hanfei Zhao", "Tianbo Zhong", "Long Zhuo", "Jing Zuo"], "brief": "", "categories": ["cs.RO", "cs.CV", "cs.LG", "cs.MM"], "github_repo": "https://github.com/OpenSenseNova/SenseNova-RoboRSI", "github_stars": 151, "hf_url": "https://huggingface.co/papers/2610.22471", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "SenseNova", "pdf_url": "https://arxiv.org/pdf/2610.22471v1", "published_at": "2026-10-15", "score": 0.343, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (240\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22471.png", "title": "Has GPT-6-Astra Achieved Embodied Intelligence?", "tldr": null, "upvotes": 240, "what_it_is": null, "why_notable": null}, {"abstract": "Can AI agents organize scientific investigations that lead to well-supported conclusions? To evaluate this capability, we introduce PhysClosureBench, a benchmark of 50 expert-verified, goal-specified research tasks spanning strong-field, attosecond, and neighboring physics areas. Each task specifies the research objective and essential scientific constraints, while leaving the agent to organize the investigation and determine how to generate and validate the evidence needed to answer the question. A 20-criterion Atomic Score measures local scientific accomplishment, while Research Closure (RC0--RC4) assesses how fully the investigation resolves the specified research question based on whether its indispensable evidence requirements and applicable scope conditions are satisfied. We evaluate seven frontier LLMs, where Claude-Opus-5 achieves the highest mean Atomic Score (6.29/10) but reaches RC4 in only 32.7% of attempts. Across the benchmark, 36.2% of attempts scoring at least 8/10 still fall short of RC4, while all seven models reach RC4 on substantially fewer tasks in all three runs than in at least one. Case-level analysis further illustrates how misinterpretation of generated results and unresolved physical applicability limits can lead to incomplete closure. Together, these results reveal a persistent gap between AI agents\u0027 local scientific accomplishments and their ability to achieve complete research closure.", "arxiv_id": "2610.21767", "arxiv_url": "https://arxiv.org/abs/2610.21767", "authors": ["Yijia Mao", "Song Dai", "Tao Chen", "Xiangyu Lu", "Linqian Zeng", "Chenxi Hu", "Sitong Zhou", "Dongyang He", "Xiaodan Mao", "Linxuan Zhang", "Tong Zhu", "Yafu Li", "Fangchen Yu", "Peng Ye", "Feng He", "Yu Cheng", "Yun Luo"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/uncertainty2019/PhysClosureBench", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.21767", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2610.21767v1", "published_at": "2026-10-15", "score": 0.329, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (36\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.21767.png", "title": "From Research Goals to Scientific Closure: Evaluating Agents Through Evidence-Supported Physics Research", "tldr": null, "upvotes": 36, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluation has been central to advances in AI, and it is equally critical to autonomous discovery. Yet scaling autonomous discovery to real-world engineering challenges faces a fundamental bottleneck: the cost of evaluating progress. In real settings, a single true evaluation, such as a full benchmark or serving trace, can take hours, so a search can afford only a handful of true evaluations. We present DuoDiscover, a search system that jointly discovers what to optimize and how to evaluate progress efficiently, through three mechanisms. First, each worker in a fleet of coding agents co-discovers an optimization target and a fast, tailored proxy evaluator, which we call a yardstick. The agent then hill-climbs the yardstick rather than the true evaluation. Second, since search can exploit gaps between a yardstick and the true objective, fidelity tests continually recheck each yardstick\u0027s ranking and invalidate any that drift. Third, the fleet is bottom-up, with no central decomposition of the problem. A lightweight orchestrator spawns and terminates agents, briefs running ones, and seeds new agents with others\u0027 confirmed work. DuoDiscover enables autonomous optimization from software to chip architecture. We demonstrate DuoDiscover on two repository-level benchmarks and four GPU and TPU kernel suites covering hundreds of kernels. On SWE-fficiency, it doubles the average speedup of human experts. On SOL-Exec, it ranks first on 121 of 235 kernels and in the top three on 212. On the heavily optimized vLLM and SQLite engines, DuoDiscover achieves 1.92$\\times$ and 1.38$\\times$ gains over the base code. On a CPU microarchitecture optimization task with evaluations of up to 28 hours, DuoDiscover surpasses both AlphaEvolve-based ArchAgent v2 and the best human design, with 1.65$\\times$ ArchAgent v2\u0027s gain in 16.7 days versus more than 40 days, advancing the frontier of autonomous chip design.", "arxiv_id": "2610.17184", "arxiv_url": "https://arxiv.org/abs/2610.17184", "authors": ["Shubham Agarwal", "Akshat Gupta", "Mike Heddes", "Dilara Soylu", "Rui Meng", "Patrick Tser Jern Kon", "Jiefeng Chen", "Mert Cemri", "Shu Liu", "Abe Gonzalez", "Akanksha Jain", "Bhavana Dalvi Mishra", "Linfeng Song", "Vilobh Meshram", "Xiangru Tang", "Jinsung Yoon", "Aditya Parameswaran", "Ion Stoica", "Vahab Mirrokni", "Burak Gokturk", "Parthasarathy Ranganathan", "Tomas Pfister", "Nanyun Peng", "Chun-Liang Li"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.17184", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2610.17184v1", "published_at": "2026-10-12", "score": 0.314, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17184.png", "title": "DuoDiscover: Scaling Autonomous Discovery Beyond the Evaluation Bottleneck", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Text-based world models have recently shown potential to simulate complex RL environment state transitions for a diverse set of use cases. However, no standardized benchmark exists to compare, study and improve these models. Through this paper, we attempt to solve this problem by building GlobeBench, a novel benchmark with 1,632 tasks across five separate domains and nineteen simulation skills. The tasks check whether models can predict the environment\u0027s response to a specific action given the full agent trajectory by understanding earlier state changes, following environment rules, and predicting the effects of actions on both related and unrelated objects. We compare the predicted environment response with an execution-derived reference, using a hybrid architecture with both deterministic gates and a semantic judge. Among 20 general-purpose LLMs and specialized text world models, GPT-6 Astra achieves the highest task success rate at 49.57%. We find that model accuracy decreases as actions affect a larger portion of the environment. Specifically, when the agent\u0027s changes must propagate to dependent objects, task success drops to an average of 5.1% across all 20 models. Although model strengths differ across tasks, 631 tasks remain unsolved by any model, suggesting a significant gap in general LLM capabilities as a world model.", "arxiv_id": "2610.22708", "arxiv_url": "https://arxiv.org/abs/2610.22708", "authors": ["Nicholas Saban", "Charvi Bannur", "Mariya Vasileva", "Darshan Deshpande"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/patronus-ai/globebench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22708", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Patronus AI", "pdf_url": "https://arxiv.org/pdf/2610.22708v1", "published_at": "2026-10-15", "score": 0.249, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22708.png", "title": "GlobeBench: Evaluating Text-Based World Model Capabilities for Scalable Environment Simulations", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents can keep scientific experiments running for months with little human supervision, but reliable autonomous research also requires scientific judgment. Evaluating scientific judgment is difficult because research decisions are open-ended and depend on project context. We construct Sci$\u03a0$vot, a 248-case benchmark of scientific judgment based on human corrections. The benchmark draws on records from six months of research in which senior researchers ran LLM agents on 26 projects across six scientific fields and repeatedly intervened to correct the agents\u0027 research judgments. In each case, an agent chooses between the original LLM plan and the human-corrected alternative, using only the project record available before the correction as context. We compare LLM and human performance and examine the effects of reasoning effort, access to the project record, and reconsideration. At medium reasoning effort with the project record, models systematically prefer the original LLM plan over the human-corrected alternative. Four of five frontier models perform below chance on the selected cases. The highest accuracy in the project condition across the tested models and reasoning effort settings is 63.5%, compared with 73.4% for fresh researchers. At medium effort, every model achieves lower accuracy with the project record than without it, and reconsideration does not consistently improve overall accuracy. Even with a human-corrected alternative available, frontier models struggle with the selected research decisions, while Sci$\u03a0$vot supports systematic evaluation of scientific judgment for LLM agents.", "arxiv_id": "2610.21082", "arxiv_url": "https://arxiv.org/abs/2610.21082", "authors": ["Youran Sun", "Xingyu Ren", "Chugang Yi", "Kejia Zhang", "Di Wu", "Yingkang Cao", "Allen Zhou", "Jianping Ye", "Suying Liu", "Jiaxuan Guo", "Jianda Du", "Weicheng Ye", "Kecheng Liu", "Hefan Zhang", "Haixin Wang", "Jie Xiao", "Eric Yang", "Haizhao Yang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21082", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21082v1", "published_at": "2026-10-15", "score": 0.222, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.21082.png", "title": "Sci$\u03a0$vot: Benchmarking Principal-Investigator Judgment at Pivotal Moments of Scientific AutoResearch Agents", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Web application development often proceeds through successive requests that extend an existing implementation. Yet web-generation benchmarks primarily evaluate development toward fixed specifications. We introduce EvoWeb, a novel benchmark comprising 320 cumulative requests over 32 web applications, grounded in real-world product features and structured by functional dependency graphs. Agents iteratively modify a persistent codebase, while a multimodal web agent tests each intermediate application in a live browser, assessing newly requested functionality, cross-request integration, and previously requested functionality. To characterize reliability throughout development, we integrate trajectory performance across user-tolerance thresholds rather than impose a fixed stopping criterion. Experiments across open- and closed-source frontier models show that EvoWeb reveals clear performance differences between models, with cross-request integration emerging as a key challenge. Further analysis shows that later requests with deeper or more numerous dependencies are solved less accurately, while runtime errors become more frequent over successive requests. EvoWeb provides a testbed for evaluating and improving coding agents in long-horizon, multi-request development.", "arxiv_id": "2610.16402", "arxiv_url": "https://arxiv.org/abs/2610.16402", "authors": ["David Nukrai", "Bar Alon", "Nativ Levy", "Ido Andrew Atad", "Ido Cohen", "Itamar Zimerman", "Lior Wolf", "Eli David", "Ilan Naiman"], "brief": "", "categories": ["cs.AI", "cs.SE"], "github_repo": "https://github.com/two-delta/EvoWeb", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.16402", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "TD Labs", "pdf_url": "https://arxiv.org/pdf/2610.16402v1", "published_at": "2026-10-12", "score": 0.219, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.16402.png", "title": "EvoWeb: A Benchmark for Coding Agents on Evolving Web Applications", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Enhancing the agentic capabilities of Large Language Models (LLMs) to tackle complex software engineering (SWE) and general terminal-usage problems is a pressing challenge. Current state-of-the-art LLMs often go through large-scale agentic Reinforcement Learning (RL). However, they mostly rely on high-level outcome rewards, with minimal consideration of low-level toolcall and mid-level workflow-stage rewards, which makes the training less effective. To overcome this limitation, we propose **Lean4AgenticRL**, which, to the best of our knowledge, is the first framework that grounds multi-level process rewards in the unified Lean4 formalization schema for open-ended agentic RL. **Lean4AgenticRL** first builds a *problem-specific workflow* system that balances the agent\u0027s own capability and controllability during execution, laying the foundation for further verification. Subsequently, our workflow formalization and multi-level reward annotation methods enable agent behavior verification within a general harness system. It provides multi-level rewards to support more effective agentic RL with the workflow-stage-normalized GRPO algorithm. Using **Lean4AgenticRL**, we train **LAR-9B/27B**, a family of models with enhanced agentic capability. Extensive experiments indicate that our model outperforms the leading model of similar size. **LAR-27B** achieves **77.3%** on TerminalBench-2.1. On average, our models outperform the base model by **9.89%** and surpass the second-best model of comparable size we know by **5.07%**. These results indicate the potential of integrating formal methods in enhancing open-ended agentic RL.", "arxiv_id": "2610.22448", "arxiv_url": "https://arxiv.org/abs/2610.22448", "authors": ["Ruida Wang", "Gerald Friedland", "Tong Zhang", "Chris Kong"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/RickySkywalker/Lean4AgenticRL", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.22448", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Amazon", "pdf_url": "https://arxiv.org/pdf/2610.22448v1", "published_at": "2026-10-15", "score": 0.199, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22448.png", "title": "Lean4AgenticRL: Advancing Agentic RL with Verifiable Multi-level Process Rewards", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Agents built on vision language models (VLMs) now compete with learned policies on robot manipulation leaderboards. We ask how far a coding agent can go when it controls a robot instead of a computer, and where it stops. Our system, HexaShell, keeps the harness thin: it only turns the agent\u0027s commands into robot motion. The agent drives a robot with two arms through one command line. It sees three RGB cameras and knows their calibration. After each failed attempt, the agent reads the log, finds the cause, and writes or fixes small programs called tools. In this way it keeps what it learns as code, as a coding agent does when it fixes a failing test. The tools may use only what the robot observes. They use triangulation to find where objects are, relative to each other and to the gripper. If two cameras see the same point, the point lies where the two camera rays meet. If a point lies on a known plane, such as the table or the top of a block, it lies where its ray meets that plane. When the head camera is not enough, the robot moves a wrist camera to get a second view. We build the tools on only ten layouts of one seed per task, then freeze them and test them on ten new layouts of the same seed. We use Codex with GPT-6-Astra at medium reasoning effort. On all 42 RoboDojo tasks, HexaShell reaches a success rate of 39.7% and a progress score of 48.0, averaged in the same way as the leaderboard. This is a new state of the art on RoboDojo. The limit is contact, not reasoning: pushing reaches 92.5% and memory tasks 65.0%, but tight insertion only 8.3%. When the agent fails, it usually sees the failure but cannot make the motion work. We open source the tools evolved so far at https://github.com/HexaFuture/HexaShell.", "arxiv_id": "2610.23479", "arxiv_url": "https://arxiv.org/abs/2610.23479", "authors": ["Hongcheng Gao", "Alex Zhou", "Jay Zhu", "Zelin Zheng", "Shijia Ge", "Xiping Li", "Di Wu", "Yazhe Wang", "Jianshu Zeng", "Xuan Shangguan", "Yongli Wang", "Yexing Wan", "Lingyu He", "Zhiqi Jia", "Sihang Wu", "Xiao He"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/HexaFuture/HexaShell", "github_stars": 32, "hf_url": "https://huggingface.co/papers/2610.23479", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "HexaFuture", "pdf_url": "https://arxiv.org/pdf/2610.23479v1", "published_at": "2026-10-16", "score": 0.187, "selected_reasons": ["HF trending (285\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.23479.png", "title": "HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents", "tldr": null, "upvotes": 285, "what_it_is": null, "why_notable": null}, {"abstract": "Decision models answer typed questions about an input with one probability per option, computed in a single forward pass without generating text. Like the fast System 1 of dual-process theory, they answer at once, but their depth is fixed at training time, so they spend the same computation on easy and hard questions. Models that reason in generated text can think longer, but they pay for every extra step in decoded tokens. We present LEV, a decision model that thinks deeper by rerunning its layers in a loop instead of generating tokens. LEV builds on a language model pretrained as a loop, reads the options after every loop step and trains all steps jointly, so one checkpoint can answer at any depth. On three looped backbones, accuracy rises with depth on the same weights, mostly on hard questions, and a 2.6B LEV goes from 63.2% at depth one to 76.2% at depth four on JevBench. On-demand depth, set per question by a small stopper with a threshold fitted on unlabelled requests, saves 15% to 24% of the computation at a cost of under one accuracy point, level with or slightly above a fixed mix of depths. On a locked test set, the 1.4B and 3B models are 5.4 to 8.8 points more accurate than dense (non-looped) models and cascades of the same latency below 50 ms.", "arxiv_id": "2610.20951", "arxiv_url": "https://arxiv.org/abs/2610.20951", "authors": ["Dingjie Song", "Zhiling Yan", "Yuxuan Zhang", "Lichao Sun"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/OpenLAIR/lev", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.20951", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.20951v1", "published_at": "2026-10-14", "score": 0.147, "selected_reasons": ["HF trending (127\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.20951.png", "title": "LEV: Thinking Fast and Deep with Looped Decision Models", "tldr": null, "upvotes": 127, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) commonly couple video and action experts through dense, layer-wise Mixture-of-Transformers (MoT) attention, exposing action prediction to irrelevant visual features while enforcing matched expert depths. This coupling hinders selective visual-feature use and introduces redundant computation. We introduce Bridge-of-Experts (BoE), instantiated as BridgeWAM, which aggregates visual, language, and proprioceptive priors through 32 Latent Bridge Queries (LBQs) into a shared, limited latent space. Joint video-action supervision lets action gradients guide the Video Expert toward representations better suited for action prediction, while the Action Expert learns to selectively retrieve task-relevant information through cross-attention. Decoupling expert depths and reusing LBQs during action denoising yield a 5.06B model with a 30-layer Video Expert and a two-layer Action Expert, achieving 98.25% success on LIBERO and 72.24% pooled success on LIBERO-Plus, demonstrating effective task execution and strong generalization with an ultralight action head. Ablations support joint representation adaptation and unified LBQ conditioning. Relative to Fast-WAM, BridgeWAM reduces single-sample inference FLOPs by 28.72% in simulation profiling and real-robot latency to 77.1 ms (a 2.47-fold speedup). Qualitative experimental results further indicate preferential attention to target objects and task destinations across perturbations.", "arxiv_id": "2610.14746", "arxiv_url": "https://arxiv.org/abs/2610.14746", "authors": ["Jiaxin Fang", "Ruitong Liu", "Zeyu Lai", "Xingyu Wang", "Mingyuan Jia", "Pingyue Sheng", "Weikang Wan", "Mengdi Xu", "Yuxiang Gao"], "brief": "", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/jxfang04/BridgeWAM-code", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2610.14746", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2610.14746v1", "published_at": "2026-10-10", "score": 0.13, "selected_reasons": ["HF trending (36\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14746.png", "title": "BridgeWAM: Bridging Video and Action Experts via Latent Bridge Queries", "tldr": null, "upvotes": 36, "what_it_is": null, "why_notable": null}, {"abstract": "Peer review is under strain from the growth of submissions, and review comments written by humans or AI can misstate what a paper says. We introduce ReviewFact, a benchmark that labels such factual errors in review comments under one definition across NLP, machine learning, and the natural sciences, and that measures cost and latency alongside accuracy. A frontier LLM checks comments well but must read the whole paper for each check, while cheap decision models, which score whether a statement holds in a text, fall far short on whole comments that mix several implicit assertions. PremiseCheck is a framework that combines the two. An LLM rewrites each comment as explicit premises without reading the paper, and a decision model checks each premise against the paper. When each comment is checked on its own, PremiseCheck reaches accuracy comparable to GPT-5.5 across all three fields at about half its cost, and on NLP reviews at a quarter of its cost and less than half its latency.", "arxiv_id": "2610.21046", "arxiv_url": "https://arxiv.org/abs/2610.21046", "authors": ["Dingjie Song", "Zhiling Yan", "Ziqian Zhang", "Yuxuan Zhang", "Lichao Sun"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/OpenLAIR/PremiseCheck", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.21046", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.21046v1", "published_at": "2026-10-15", "score": 0.122, "selected_reasons": ["HF trending (47\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.21046.png", "title": "PremiseCheck: Efficient Fact-Checking of Human and AI Peer Reviews", "tldr": null, "upvotes": 47, "what_it_is": null, "why_notable": null}, {"abstract": "Flow and diffusion models suffer from slow inference due to computationally expensive numerical integration. Distillation provides a promising way for a student model to learn from a teacher\u0027s dynamics, enabling one-step or few-step generation. However, existing methods often depend on curated distillation datasets, costly teacher rollouts, or auxiliary proxy networks, which complicate model training and scaling. In this work, we propose Consistent Distribution Matching, a simulation-free and data-free distillation method for accelerating diffusion and flow models while preserving strong generative capacity. Our key insight is to unify sample generation and score estimation with one student network. Thus, our framework uses only two models, a frozen teacher and a trainable student, and optimizes one objective. We prove that minimizing our objective indicates Wasserstein convergence of the student flow-map pushforwards to the teacher marginals. On ImageNet 256$\\times$256, our method attains an FID of 2.04 with a single function evaluation (1-NFE) and a 4-NFE FID of 1.37 within 40 epochs of training, surpassing the state-of-the-art distillation baselines without data. Our code code and model are available at https://consistentdmd.github.io/.", "arxiv_id": "2610.09221", "arxiv_url": "https://arxiv.org/abs/2610.09221", "authors": ["Yuxiang Fu", "Qi Yan", "Zike Wu", "Yongxing Zhang", "Purang Abolmaesumi", "Lele Wang", "Renjie Liao"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": "https://github.com/felix-yuxiang/CDMD", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2610.09221", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Vector Institute", "pdf_url": "https://arxiv.org/pdf/2610.09221v1", "published_at": "2026-10-06", "score": 0.095, "selected_reasons": ["HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.09221.png", "title": "Consistent Distribution Matching for Data-Free Diffusion Distillation", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval is a fundamental task in multimodal systems: given an image or text query, the goal is to find the most relevant images or texts in a collection, often using a shared embedding space. Reliable retrieval requires these embeddings to capture not only which concepts are present, but also how they are composed. One key compositional challenge is attribute--object binding: encoding which attributes belong to which objects. Existing benchmarks provide a limited view of this capability, typically covering a subset of modality pairings, simple two-object swaps, or small attribute sets. Consequently, it remains unclear how robustly current models preserve attribute--object bindings across different modality pairings and more complex settings. We therefore introduce SABER, a controlled benchmark for evaluating attribute--object binding across all four image and text modality pairings, spanning diverse attribute types and scenes with up to ten objects. Evaluating models on SABER reveals substantial binding failures in both CLIP-style dual encoders and recent MLLM-based embedders. These findings motivate us to ask how binding can be improved efficiently. While multimodal supervision may be effective, collecting suitable images is difficult and costly. Text, on the other hand, is well suited to binding supervision: it is cheap to generate, supports a broader range of attributes and enables precisely controlled hard negatives. We thus finetune an MLLM-based embedder exclusively on synthetic attribute-binding text. Despite the absence of image supervision, the gains transfer to cross-modal and image--image retrieval while preserving general multimodal embedding performance. Our model achieves SOTA results on SABER while also improving on negation and instance-retrieval benchmarks, demonstrating broader benefits of our binding-focused supervision.", "arxiv_id": "2610.22602", "arxiv_url": "https://arxiv.org/abs/2610.22602", "authors": ["Netanel Y. Tamir", "Michael Green", "Issar Tzachor", "Or Shimshi", "Dvir Samuel", "Or Patashnik", "Rami Ben-Ari"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Netanel-Tamir/Stuck-On-Shuffle", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.22602", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22602v1", "published_at": "2026-10-15", "score": 0.089, "selected_reasons": ["HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22602.png", "title": "Stuck on Shuffle: On Attribute-Object Binding in Vision-Language Models", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Creative intent in video editing can be expressed through text instructions (e.g., \"remove the people\"), image references (e.g., subject appearance), video references (e.g., camera movement), or a combination of the above. We introduce OmniXRef, a unified framework for multimodal multi-reference video editing that allows users to combine variable numbers of text, image, and video references to control diverse attributes of a source video. We first devise a unified input design with a reference-bank interface and introduce $R^2$-RoPE to support generalization to more references. Then our model, OmniXRef-Model, uses a single-stream diffusion transformer to jointly process the source video and multimodal context from an MLLM in an interleaved sequence. To address the scarcity of training data for video-reference editing, we construct OmniXRef-Data using synthesis pipelines for different editing tasks and combinations of references. We use curriculum learning to progressively increase task complexity and resolution. To support systematic evaluation of video as a control modality, we introduce OmniXRef-Bench, a benchmark for video-reference attribute transfer across Camera, Motion, Content, Style, and Visual Effects (VFX). Comprehensive evaluations show that our OmniXRef-Model outperforms task-specific baselines and commercial models.", "arxiv_id": "2610.22744", "arxiv_url": "https://arxiv.org/abs/2610.22744", "authors": ["Xiaoyan Cong", "Tianyu Wang", "Hyeonho Jeong", "Zhifei Zhang", "Yuqian Zhou", "Yijun Li", "Shaoteng Liu", "Zhe Lin", "Srinath Sridhar", "Soo Ye Kim"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22744", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Adobe Research", "pdf_url": "https://arxiv.org/pdf/2610.22744v1", "published_at": "2026-10-15", "score": 0.082, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22744.png", "title": "OmniXRef: A Unified Framework for Multimodal Multi-Reference Video Editing", "tldr": null, "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-turn image editing aims to modify an image according to a sequence of instructions, enabling more effective interactive visual content creation for users. However, existing methods often exhibit noticeable drift after only a few editing turns, manifesting in two aspects: 1) unstable visual quality, with accumulating artifacts and degraded details; and 2) inconsistent image content, with unintended changes to preserved regions and prior edits. To address these challenges, we propose MT Forcing, a novel training paradigm for multi-turn image editing with unified multimodal models (UMMs) based on autoregressive diffusion. Specifically, we propose Single-Turn Distribution Matching Distillation (Single-Turn DMD), which supervises student self-rollouts with a teacher that applies cumulative edits to the source image in a single turn, providing visual-quality guidance without recursive error accumulation. Additionally, we introduce Teacher-Forcing Guidance, which supervises history-dependent transitions on reference trajectories during warmup and as a regularizer during distillation, encouraging cross-turn content consistency beyond what per-turn distribution matching alone can ensure. Extensive experiments demonstrate that our approach significantly improves the multi-turn image editing capabilities of UMMs, yielding more stable visual quality and stronger cross-turn consistency.", "arxiv_id": "2610.25404", "arxiv_url": "https://arxiv.org/abs/2610.25404", "authors": ["Houyuan Chen", "Fanzhou Wang", "Xiangyu Fan", "Zesong Qiu", "Yukun Wei", "Songlin Yang", "Zhitao Yang", "Lvmin Zhang", "Pei Yang", "Hao Zhao", "Lei Yang", "Anyi Rao"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/houyuanchen111/MT-Forcing", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.25404", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "SenseNova", "pdf_url": "https://arxiv.org/pdf/2610.25404v1", "published_at": "2026-10-18", "score": 0.081, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25404.png", "title": "MT Forcing: Towards Stable and Consistent Multi-Turn Image Editing with Autoregressive Diffusion", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) progressively revise their predictions across Transformer layers, yet we typically observe only the final output, discarding the trajectory through which it is formed. We introduce Belief-Trajectory Energy(BTE), a model-grounded measure that characterizes an input through the layerwise predictive revisions it induces in a model. By mapping intermediate states into a shared predictive space, BTE provides a principled measure of belief change that can be summarized as either a scalar or a structured depth profile. Theoretically, we show that local BTE corresponds to predictive revision under the Fisher-Rao geometry, while the sequence of revisions captures information beyond the initial-to-final belief change. Empirically, scalar BTE provides a model-relative signal of difficulty across diverse reasoning tasks, while richer BTE representations support human-LLM review detection and fine-grained generator attribution, reaching up to $0.998$ macro-AUROC and $95.6\\%$ eight-way attribution accuracy. Further analysis shows that BTE develops throughout pretraining and is selectively reshaped by targeted training, demonstrating that the resulting measurement reflects what the scoring model has learned. Together, our results establish belief trajectories as a principled model-grounded signal and suggest a broader perspective in which learned models can themselves serve as instruments for characterizing the data they process. More demonstrations can be found at https://yingjiahao14.github.io/BTE-web/.", "arxiv_id": "2610.05114", "arxiv_url": "https://arxiv.org/abs/2610.05114", "authors": ["Jiahao Ying", "Wei Tang", "Boxian Ai", "Yaoning Wang", "Haotian Chen", "Wenhe Sun", "Caijun Xu", "Haozhan Cai", "Changyi Xiao", "Yixin Cao"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.05114", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.05114v1", "published_at": "2026-10-04", "score": 0.079, "selected_reasons": ["HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.05114.png", "title": "Belief-Trajectory Energy: Measuring the Path to a Prediction", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Whole-body tracking has become the interface through which operators drive humanoid robots, yet the references it consumes are recorded on level ground and carrying nothing, so the tracker is aware of neither the forces the robot must exchange with objects nor the terrain it must stand on. Existing controllers address one side of this gap: force-capable policies command an end-effector force but prescribe no whole-body pose, while terrain-adaptive trackers treat loads as disturbances to reject rather than wrenches to command. We present BRACE, a whole-body tracker that exerts and compensates commanded hand forces from diverse poses while following a flat-ground reference on sloped terrain. Rather than leaving the tracker to absorb the load and the slope, BRACE folds both into the reference it follows: terrain conformance lifts footholds and root onto the local surface, and a wrench transformation resolves the hand displacement that produces a force jointly with the center-of-mass and center- of-pressure shifts it induces, bounded by teacher-specific arm-effort limits. Separate exertion and compensation teachers are distilled by DAgger into one flow-matching student that runs on proprioception alone, without a height map or measured wrench, so a teleoperator (even in remote locations) can supply a flat- ground trajectory and the robot resolves slope and load onboard. We extensive experiments on the Unitree-G1 to demonstrate the ability of BRACE to exert, compensate force and handle diverse terrain in simulation and real robot experiments.", "arxiv_id": "2610.07052", "arxiv_url": "https://arxiv.org/abs/2610.07052", "authors": ["Sudarshan Harithas", "Chen Yu", "Juan Borbon", "Shubhankar Mondal", "Winston Zha", "Srinath Sridhar", "Dingqi Zhang", "Jiuguang Wang"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/multiplylabs/brace", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2610.07052", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Multiply Labs", "pdf_url": "https://arxiv.org/pdf/2610.07052v1", "published_at": "2026-10-05", "score": 0.074, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.07052.png", "title": "BRACE: Adapting Whole-Body References for Force and Terrain Aware Humanoid Motion Tracking", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) improves language-model by supervising a student on prefixes sampled from its own policy, but its supervision remains confined to the output space. Consequently, OPD transfers what a teacher predicts without supervising the intermediate computation that produces those predictions. Simply distilling intermediate representations like representation matching is insufficient since teacher and student representations may differ geometrically, and even well-aligned hidden states need not be usable by the student\u0027s subsequent computation. We introduce On-Policy Mechanism Distillation (OPMD), which transfers teacher-derived intermediate computation while explicitly accounting for its compatibility with the student. OPMD first constructs a student-compatible teacher that transforms teacher representations into intermediate states usable by the student\u0027s downstream computation, then it internalizes these states from on-policy trajectories. OPMD achieves the highest average accuracy among the evaluated distillation baselines in all three teacher--student settings, and generalizes to multi-teacher distillation and cross-family supervised fine-tuning. Further analyses show that mechanism supervision yields more effective reasoning and meaningfully alters the student\u0027s intermediate computation and solution strategies, supporting that it transfers information beyond output supervision alone. Together, these results establish mechanism-level supervision as an effective way to move on-policy distillation beyond output supervision, enabling students to learn inner mechanisms they can use and internalize.", "arxiv_id": "2610.14022", "arxiv_url": "https://arxiv.org/abs/2610.14022", "authors": ["Yingdong Shi", "Zhihong Li", "Changming Li", "Jingyi Yu", "Quan Li", "Kan Ren"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.14022", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "ShanghaiTech University", "pdf_url": "https://arxiv.org/pdf/2610.14022v1", "published_at": "2026-09-29", "score": 0.071, "selected_reasons": ["HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14022.png", "title": "OPMD: On-Policy Mechanism Distillation Beyond Output Supervision", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "In a small language model the vocabulary is the single largest part. In Gemma 3 270M the embedding table holds 168M of 268M parameters, and because quantisation methods leave the embedding in 16-bit, it is also most of the file once the rest of the model is compressed. We ask what that table actually buys. We replace it with one frozen table of 512-bit codes, 16 MB, with no trainable parameters, derived once from a pretrained embedding by principal-component projection and sign binarisation, and we train the same Gemma-shaped body from scratch on the same 2.05B tokens with and without it. The learned table buys 0.20 nats of validation loss for 2.6 times the trainable parameters, but on LAMBADA, HellaSwag and PIQA the frozen-table model is better or tied; only ARC-Easy favours the learned table. With a ternary BitNet b1.58 body the whole model is a 46 MB file, still ties the float model on LAMBADA and PIQA, and on a laptop CPU generates 615 to 740 tokens per second in 62 MB of memory, five to six times the speed of the float model\u0027s 8-bit GGUF in llama.cpp at a seventh of the memory. The frozen table wins by 1.7 to 2.3 nats on rare words, accepts 10,000 new words after training with a 3% cost where the learned table collapses by 43%, and all of it is released with the weights, the data and every evaluation answer.", "arxiv_id": "2610.22428", "arxiv_url": "https://arxiv.org/abs/2610.22428", "authors": ["Sai Kiran Bathula"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22428", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.22428v1", "published_at": "2026-10-15", "score": 0.065, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22428.png", "title": "Embeddings Are Overpriced? A Frozen 16 MB Vocabulary for Small and Ternary Language Models", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable deployment of LLM-based multi-agent systems calls for runtime auditors that predict terminal outcomes from observed execution prefixes. These auditors typically learn from a limited corpus of trajectories with verified outcomes. Expanding this corpus requires costly execution and verification, yet broader failure coverage alone provides no explicit criterion for identifying prefixes that the current auditor finds difficult to classify. To this end, we propose Dream2Discern, a runtime auditor trained through implicit augmentation guided by its own prediction loss. During Dream, we select perturbations of the auditor\u0027s representation operators to increase prediction loss on recorded prefixes, yielding hard latent variants. During Discern, the auditor learns to predict execution outcomes from these variants using the original labels. The variants are regenerated as the auditor learns, turning a limited corpus into a renewable source of hard examples and requiring no additional trajectory collection or outcome verification. Extensive evaluations on AFTraj-2K and StepShield show that Dream2Discern outperforms competitive failure auditors and achieves over 90% trajectory-level weighted accuracy on both benchmarks while balancing prediction accuracy and timeliness. Project page: https://zbox1005.github.io/dream2discern-project/", "arxiv_id": "2610.16071", "arxiv_url": "https://arxiv.org/abs/2610.16071", "authors": ["Boxuan Zhang", "Jianing Zhu", "Xiaotian Han", "Ruixiang Tang"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.MA"], "github_repo": "https://github.com/ZBox1005/Dream2Discern", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.16071", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Rutgers University", "pdf_url": "https://arxiv.org/pdf/2610.16071v1", "published_at": "2026-10-12", "score": 0.061, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.16071.png", "title": "Dream2Discern: Learning from Hard Latent Variants for Runtime Failure Prediction in Multi-Agent Systems", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Comparing financial disclosures across languages requires identifying shared accounting concepts and recovering all numerical facts that express them. Existing benchmarks evaluate aspects of these capabilities, but provide limited insight into whether both succeed on the same multilingual evidence. In particular, it remains unclear whether language models can recognize these concepts across languages and exhaustively recover their corresponding numerical evidence from the same contexts. We introduce MULTIFINGROUND, a benchmark designed to investigate this recognition-grounding gap in multilingual financial reports. Constructed from FY2025 disclosures of 90 issuers in English, French, and Greek, MULTIFINGROUND aligns independently authored reports through a shared accounting taxonomy and provides traceable fact-level annotations. The benchmark evaluates financial fact identification, concept recognition, exhaustive fact selection, and concept discrimination without candidate labels. Across 15 evaluated models, eight API and open-weight reference models achieve 97.3-99.4\\% concept recognition accuracy, yet miss at least one target fact in 26.6-41.9\\% of correctly recognized groups. Further analyses reveal substantial variation in concept discrimination and limited gains from the evaluated finance-specialized models. Our findings demonstrate that strong concept recognition can coexist with incomplete evidence recovery, highlighting the importance of evaluating semantic recognition and evidence completeness together.", "arxiv_id": "2610.19432", "arxiv_url": "https://arxiv.org/abs/2610.19432", "authors": ["Lingfei Qian", "Yan Wang", "Xueqing Peng", "Polydoros Giannouris", "Nadhem Zmandar", "Yi Han", "Yanguang Liu", "V\u00edctor Guti\u00e9rrez-Basulto"], "brief": "", "categories": ["cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.19432", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "The Fin AI", "pdf_url": "https://arxiv.org/pdf/2610.19432v1", "published_at": "2026-10-14", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19432.png", "title": "Recognition Is Not Grounding: Benchmarking Multilingual Financial Evidence Extraction", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon agents often struggle to recover from failures whose causes lie several steps earlier, beyond what local reflection or backtracking can resolve. We introduce BELIEFWEAVER, a framework that combines persistent evidence across attempts with prospective reasoning over repair directions. It maintains a relational belief state over frontiers, attempts, observations, and checkpoints. Execution evidence updates related frontier priorities across attempts and rollback, while diagnostic evidence gates execution. An implicit world model (IWM) evaluates repair hypotheses, predicts progress, and identifies relations among frontiers to guide exploration. We further distill these recurring IWM reasoning components into a 9B student through supervised fine-tuning and on-policy distillation (OPD). Across three terminal-based benchmarks, BELIEFWEAVER improves aggregate final score by 5.1 percentage points over native Terminus-2 continuation, with positive trends in exploration efficiency. The distilled 9B student improves final score by 9.8 percentage points over the reported native baseline while reducing estimated teacher API cost by 54.8% relative to the matched teacher. These results show that persistent evidence and prospective reasoning can improve recovery in long-horizon agent tasks while substantially reducing reliance on teacher-model inference.", "arxiv_id": "2610.18082", "arxiv_url": "https://arxiv.org/abs/2610.18082", "authors": ["Xiyang Wu", "Zhichao Liu", "Shengxin zhang", "Zongxia Li", "Ming Li", "Tianyi Zhou", "Dinesh Manocha"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.18082", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Agent Intelligence-Lab \ud83e\udd9e", "pdf_url": "https://arxiv.org/pdf/2610.18082v1", "published_at": "2026-10-13", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18082.png", "title": "Failure Recovery via Belief Updates and World Modeling for Long-Horizon Agents", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive language-model agents decompose tasks and delegate subtasks to child instances of the same policy, forming a tree of work. Training them, however, is hard: the final outcome is verifiable, but the self-invented intermediate subtasks are numerous and carry no ground truth. Existing methods score each node with a verifier or judge, which is costly at scale and blind to decomposition quality. We argue that a recursive agent must learn three coupled capabilities within one set of weights: decomposing problems into subtasks, solving them, and evaluating the outcomes, each requiring its own training signal. SERA (Self-Evaluating Recursive Agents) turns evaluation into a learned capability of the policy itself. Before delegating, the parent writes a rubric of weighted success criteria for each child subtask; a ranking objective against verified outcomes then trains rubric generation so that the criteria track genuine subtask success. In addition, a complementary leaf-coverage signal provides direct credit for task decomposition. Our central finding is that \\emph{training} the policy to generate aligned rubrics is what drives the gains: because the same weights both evaluate and execute, learning to judge subtasks sharpens the agent\u0027s ability to solve them. Notably, external supervision is also reduced: the judge is consulted only to train the rubric generator, while solving is trained against the agent\u0027s own rubric scores, which outperform direct use of the judge. Beyond training, the learned rubric doubles as an inference-time selector for tree search. On TextCraft-Synth and TextWorld-Sync, SERA improves over strong recursive-agent baselines by 5.38 and 13.14 points on average, and rubric-guided tree search at inference adds a further 2.43 points on TextWorld-Sync.", "arxiv_id": "2610.04902", "arxiv_url": "https://arxiv.org/abs/2610.04902", "authors": ["TianYi Lyu", "Xiaozhe Li", "Yang Li", "Yongkang Chen", "Kefei Tian", "Junbo Niu", "Zican Hu", "Hongbo Liu", "Mingliang Xiong", "Qingwen Liu"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/OliverLeeXZ/SERA", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.04902", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "TongjiUniversity", "pdf_url": "https://arxiv.org/pdf/2610.04902v1", "published_at": "2026-10-04", "score": 0.046, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.04902.png", "title": "Self-Evaluating Recursive Agents", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Automated identification of diatoms from microscopic images is a cornerstone of large-scale freshwater biomonitoring, yet the high diversity of species and strong class imbalance pose significant challenges for reliable classification. In this study, we develop a ResNet-18 baseline for a 759-class diatom dataset and investigate how calibrated confidence estimates support selective classification to reduce expert workload without sacrificing taxonomic integrity. While the initial model exhibits overconfidence with an Expected Calibration Error (ECE) of 0.117, post-hoc temperature scaling (T = 2.12) dramatically improves reliability, lowering the ECE to 0.055.By leveraging these calibrated probabilities within a triage framework, we demonstrate that a Selective Macro-F1 score of 99.01% can be maintained at 66.2% coverage (rejection threshold $\u03c4$ = 0.934). Qualitative analysis reveals that the system effectively functions as an intelligent filter, consistently deferring rare taxa-such as AAMB and AASI-and ambiguous morphologies for expert review. Our findings, supported by the torch-uncertainty framework, highlight the potential of simple calibration techniques to make automated diatom identification practical and robust, prioritizing the preservation of rare species metrics essential for ecological assessment. To support reproducibility, our code, environment specifications, and calibration results are available anonymously at https://anonymous.4open. science/r/greenprwksp-B53D/README.", "arxiv_id": "2610.25977", "arxiv_url": "https://arxiv.org/abs/2610.25977", "authors": ["Kamenan N\u0027Gadi", "Martin Laviale", "C{\u00e9}dric Pradalier", "J{\u00e9}r{\u00e9}my Fix"], "brief": "", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25977", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25977v1", "published_at": "2026-10-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On the Benefits of Uncertainty Estimation for Species Classification: A Case Study on Optimizing Expert re-Annotation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We set out to reproduce a recent hallucination-mitigation result on the POPE benchmark. The LLaVA-1.5-7B baseline we measured, 82.21 F1 on the adversarial split, sat 1.21 to 8.67 points above the adversarial baselines we planned to compare against (81.00, 79.30, and 73.54). We looked at the evaluation code and found a readout choice that moves F1 on its own. A two-token logit readout decides yes versus no by comparing two vocabulary IDs, 3582 (\"yes\") and 1217 (\"no\"). Across 9,000 greedy-decode questions spanning all three splits, neither ID is generated even once. The model emits \" Yes\" (token 3869) and \" No\" (token 1939), because SentencePiece prepends a space byte after the prompt suffix \"ASSISTANT:\". Read with an eight-token lookup that covers the space-prefixed surface forms, LLaVA-1.5-7B scores F1 0.8221, 0.8498, and 0.8713 on the adversarial, popular, and random splits. That 6.13-point adversarial shift exceeds the adversarial gain reported by five of the six papers we surveyed. None of them states its readout, and our reference ran under 4-bit NF4 quantization, so we cannot say how much of any reported gain a matched evaluation would keep. That comparison stays unresolved until readout and precision are matched. On the fixed baseline we run nine inference-time corrections of our own (none beat it) and dissect why the adversarial split resists logit-level intervention. In a 3,000-question probe, wrong predictions draw more image attention than correct ones (Cohen\u0027s $d=-0.46$, $p=1.4\\times10^{-24}$), the opposite of what grounding-based corrections assume. A four-readout audit across four further VLMs from three tokenizer families confirms the confound is protocol-level, not model-specific: porting the LLaVA-1.5 IDs verbatim drops F1 to 0.00 on the two disjoint-vocabulary models, whereas a tokenizer-derived readout holds between 0.80 and 0.92.", "arxiv_id": "2610.25964", "arxiv_url": "https://arxiv.org/abs/2610.25964", "authors": ["Kesav Kumar Jayakumar", "Karthigeyan Thilak"], "brief": "", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25964", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25964v1", "published_at": "2026-10-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Token-Set Choice Confounds POPE: A Systematic Audit of Yes/No Extraction in VLM Hallucination Evaluation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Joint 4D reconstruction of a human and object from a monocular video is essential for understanding how people interact with their environment. While recent methods have made noticeable progress, capturing such human-object interactions remains difficult due to two main challenges. First, a video typically contains composite semantic context spanning multiple interaction phases, making it difficult to track the temporal changes of the interaction in the reconstruction. Second, under human-object occlusion, a single-view observation contains incomplete visual information about the interaction, resulting in geometrically inconsistent reconstructions. To address these challenges, we introduce HORIA, built upon two core designs. First, we decompose the entire input video into temporally grounded and semantically distinct interaction phases with motion-aware captioning, obtaining a specific text description for each phase. Second, conditioned on these text descriptions of the interaction, we propose an interaction-aware re-rendering that compensates for the limited single-view observation. Specifically, we render the initially reconstructed 4D human and object from novel viewpoints and refine the renderings with a text-to-video diffusion prior, which provides auxiliary novel-view supervision beyond single-view cues. As a result, our framework produces temporally coherent and accurate 4D reconstructions under diverse interaction scenarios, achieving state-of-the-art performance.", "arxiv_id": "2610.25960", "arxiv_url": "https://arxiv.org/abs/2610.25960", "authors": ["Hyeongjin Nam", "Taeryung Lee", "Daniel Sungho Jung", "Kyoung Mu Lee"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25960", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25960v1", "published_at": "2026-10-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HORIA: 4D Human and Object Reconstruction from a Monocular Video with Interaction-Aware Re-Rendering", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Omni-modal large language models can jointly understand video, audio, and text, yet they remain weak at temporal grounding, a capability essential for real-world audio-visual applications. To understand this limitation, we look beyond final predictions and examine the model\u0027s internal temporal evidence. We identify a temporal generation gap: the internal attention of the model localizes the target moment more accurately than the timestamps it generates. To close this gap, we propose TACG (Temporal Attention-Consistency Grounding), a post-training method that treats internal attention as a reliable temporal pivot and aligns it with both the model prediction and the ground-truth annotation through attention-consistency training. We further build a 580K-sample training dataset by reconstructing temporal QA from dense audio-visual annotations and organizing general omni-modal instruction data. Using TACG and this training dataset, we train OmniGround, a general-purpose omni-modal model with stronger temporal grounding capability, without injecting any additional temporal cues. OmniGround reaches state-of-the-art omni-modal temporal grounding, including 37.5 mIoU on LongVALE and 35.7 mIoU on UnAV-100, while staying competitive on both general audio-visual understanding and vision-only grounding.", "arxiv_id": "2610.25929", "arxiv_url": "https://arxiv.org/abs/2610.25929", "authors": ["Zixuan Chen", "Depeng Wang", "Hao Lin", "Ke Xu", "Ya Guo", "Huijia Zhu", "Tanfeng Sun", "Xinghao Jiang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25929", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25929v1", "published_at": "2026-10-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OmniGround: Strengthening Omni-Modal Temporal Grounding via Attention-Consistency Training", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robot manipulation often depends on short-term cues - such as brief contacts, temporary occlusions, and intermediate object states - that are ambiguous in a single frame and can only be resolved by integrating observations over time. However, injecting historical information solely by enlarging the history window is computationally costly and frequently yields limited gains due to substantial redundancy and task-agnostic, inflexible sampling of observations. We propose CondenseVLA, a multi-frame VLA policy with a learnable decoder-side history condensation module for using short-term visual context in action decoding. Given a sequence of cached per-frame features from the VLM backbone, CondenseVLA distills observation history into a fixed set of slot tokens using learnable queries and multi-head cross-attention. Simple auxiliary regularization penalizes overlap among slot attention maps and decorrelates slot embeddings, encouraging complementary attention and reducing slot redundancy. Across the evaluated tasks, CondenseVLA improves Simpler-WidowX success from 58.7% to 69.8% (+11.1 percentage points), achieves 97.2% on LIBERO, and reaches 52.8% on real-world tasks. It achieves 21.6% success on memory-dependent RMBench tasks. These results support selective condensation of bounded recent visual evidence for action decoding, while harder multi-observation tasks expose the limits of a finite history window. Project page: https://github.com/FeiyangHong/CondenseVLA", "arxiv_id": "2610.25927", "arxiv_url": "https://arxiv.org/abs/2610.25927", "authors": ["Feiyang Hong", "Yujie Wei", "Bo Zhao", "Xiu Su", "Hongxun Yao", "Shuo Yang"], "brief": "", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25927", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25927v1", "published_at": "2026-10-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CondenseVLA: Learnable History Condensation for Efficient Multi-Frame VLA", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep research agents are increasingly capable of searching the open web and synthesizing evidence, yet they remain poorly suited to controllable report generation in multimodal deep research. This task requires agents to handle interleaved textual and visual inputs, gather multimodal evidence through multi-step web search, and deliver comprehensive illustrated reports under user-specified requirements. Existing systems face two limitations. During reasoning, they often underuse images discovered along the search trajectory; during generation, they tend to produce fixed-form answers with limited control over report granularity, multimodal composition, and evidence grounding. We introduce MIRA, a Multimodal Illustrated Deep Research Agent for controllable reports. MIRA integrates textual and visual evidence throughout research and writing. At its core, MIRA-Harness translates user requirements into generation contracts and connects four stages: evidence collection, report submission, feedback-driven revision, and final delivery. Building on this harness, MIRA-Data constructs high-quality multi-hop multimodal research trajectories, and we post-train foundation models to operate within the workflow. Using Qwen3.6-35B-A3B, MIRA achieves state-of-the-art performance among open agents on 7 representative, established multimodal-search and deep-research-agent benchmarks, while producing user-aligned illustrated reports with traceable textual and visual evidence.", "arxiv_id": "2610.25926", "arxiv_url": "https://arxiv.org/abs/2610.25926", "authors": ["Hongrui Wu", "Kaiwen Tuo", "Congcong Wang", "Gen Li", "Shuai Dong", "Xinlei Yu", "Yuqi Xu", "Haowen Hou", "Zelin Peng", "Jiaqi Wang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.25926", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25926v1", "published_at": "2026-10-19", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MIRA: A Multimodal Illustrated Deep Research Agent for Controllable Reports", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video vision-language models (VLMs) have strong semantic understanding, yet remain unreliable at precise temporal grounding. Existing gains from explicitly aligning video frames with absolute time suggest that VLMs may already encode accurate temporal locations internally but lose precision when expressing them as timestamps. Our analysis across four VLMs and two grounding datasets confirms this hypothesis: attention intervals outperform predicted intervals on approximately 66% of valid examples. We term this discrepancy the temporal generation gap. Because precise temporal annotations are expensive, this finding motivates closing the gap to improve temporal grounding using only unlabeled video-query pairs. We propose Self-Supervised Attention Policy Optimization (SAPO), which uses internal temporal attention as self-supervision for Group Relative Policy Optimization and applies a ground-truth-free criterion to select high-value samples. SAPO consistently improves temporal grounding across multiple datasets and models spanning weak to strong initial grounding ability. Relative mIoU gains reach 33.7% on Qwen2.5-VL-3B and 5.4% on the strong Time-R1-7B. The improvements transfer across datasets while preserving general video understanding.", "arxiv_id": "2610.25923", "arxiv_url": "http
