nformed ratings of identical answers also differ by evaluator: one judge shifts toward the peer-endorsed position, two shift away, one is approximately neutral, and GPT-4o and GPT-5.4-mini audits are likewise non-neutral. Finally, an anchor audit shows that terse correct anchors can be misread often enough to destabilize the latent scale unless calibration is checked explicitly. These results support four conclusions: flip rates are insufficient as a complete measure of open-ended conformity, wrong peers harm open-ended revision, evaluators are not neutral, and anchor calibration is necessary.", "arxiv_id": "2608.04463", "arxiv_url": "https://arxiv.org/abs/2608.04463", "authors": ["Alicia Guerra", "Yibo Hu"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u5957\u7528\u4e8e\u8861\u91cf\u5f00\u653e\u5f0f\u4efb\u52a1\u4e2d LLM \u4ece\u4f17\u6027\u7684\u5b9e\u9a8c\u534f\u8bae\uff0c\u5c06\u91cd\u590d\u4f5c\u7b54\u3001\u5019\u9009\u5185\u5bb9\u66b4\u9732\u3001\u540c\u4f34\u5448\u73b0\u6548\u5e94\u548c\u8bc4\u5ba1\u504f\u5dee\u5206\u79bb\u5f00\u6765\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u9519\u8bef\u540c\u4f34\u8f93\u5165\u4f1a\u7cfb\u7edf\u6027\u964d\u4f4e\u4fee\u8ba2\u8d28\u91cf\uff0c\u4e14\u8bc4\u4f30\u5668\u672c\u8eab\u5e76\u4e0d\u4e2d\u7acb\uff0c\u56e0\u6b64\u4ec5\u770b\u7b54\u6848\u7ffb\u8f6c\u7387\u4e0d\u8db3\uff0c\u5fc5\u987b\u8fdb\u884c\u951a\u70b9\u6821\u51c6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04463", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u4f30\u65b9\u6cd5", "\u4ece\u4f17\u6027", "\u5f00\u653e\u5f0f\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04463v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Evaluator Is Part of the Experiment: Measuring Open-Ended LLM Conformity", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u5957\u7528\u4e8e\u8861\u91cf\u5f00\u653e\u5f0f\u4efb\u52a1\u4e2d LLM \u4ece\u4f17\u6027\u7684\u5b9e\u9a8c\u534f\u8bae\uff0c\u5c06\u91cd\u590d\u4f5c\u7b54\u3001\u5019\u9009\u5185\u5bb9\u66b4\u9732\u3001\u540c\u4f34\u5448\u73b0\u6548\u5e94\u548c\u8bc4\u5ba1\u504f\u5dee\u5206\u79bb\u5f00\u6765\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u9519\u8bef\u540c\u4f34\u8f93\u5165\u4f1a\u7cfb\u7edf\u6027\u964d\u4f4e\u4fee\u8ba2\u8d28\u91cf\uff0c\u4e14\u8bc4\u4f30\u5668\u672c\u8eab\u5e76\u4e0d\u4e2d\u7acb\uff0c\u56e0\u6b64\u4ec5\u770b\u7b54\u6848\u7ffb\u8f6c\u7387\u4e0d\u8db3\uff0c\u5fc5\u987b\u8fdb\u884c\u951a\u70b9\u6821\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly used to detect unsafe content. A common approach is to combine judgments from a panel of models to correct individual mistakes, but this benefit may disappear when every model sees the same misleading context before voting. We study this risk in a controlled two-round experiment. Each model first judges an item alone, then judges it again after six simulated peers either assert the wrong label or abstain. We combine the final judgments by majority vote. Across six open-weight LLMs and six datasets, we find that the wrong-label peer message raises the average reviewer false-alarm rate from 56.5% under silent peers to 87.5%, and majority voting raises the panel false-alarm rate to 100%. Without an asserted label, the same panel outperforms its average member. The effect is strongly asymmetric: reviewers follow pushes toward \"unsafe\" far more than pushes toward \"safe\" (about 75% versus 17%), so the panel\u0027s false-alarm rate rises sharply while its harmful-miss rate changes little. The proprietary-model probe shows substantial variation across models. These results identify susceptibility to shared social cues as a failure mode of safety panels and provide a simple pre-deployment diagnostic.", "arxiv_id": "2608.04415", "arxiv_url": "https://arxiv.org/abs/2608.04415", "authors": ["Yibo Hu", "Jiaming Qu"], "brief": "\u8be5\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u5b89\u5168\u5ba1\u6838\u9762\u677f\u5728\u4e8c\u8f6e\u6295\u7968\u4e2d\u53d7\u5230\u201c\u540c\u4f34\u9519\u8bef\u6807\u7b7e\u201d\u5f71\u54cd\u7684\u98ce\u9669\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5171\u4eab\u7684\u8bef\u5bfc\u6027\u793e\u4f1a\u7ebf\u7d22\u4f1a\u663e\u8457\u63d0\u9ad8\u8bef\u62a5\u7387\uff0c\u751a\u81f3\u4f7f\u591a\u6570\u6295\u7968\u9762\u677f\u8bef\u62a5\u7387\u8fbe\u5230100%\uff0c\u8bf4\u660e\u591a\u6570\u6295\u7968\u5e76\u4e0d\u80fd\u62b5\u5fa1\u5171\u540c\u504f\u89c1\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04415", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u8bc4\u6d4b", "\u591a\u6570\u6295\u7968", "\u793e\u4f1a\u5f71\u54cd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04415v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Social Pressure Breaks Majority Voting in LLM Safety Panels", "tldr": "\u8be5\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u5b89\u5168\u5ba1\u6838\u9762\u677f\u5728\u4e8c\u8f6e\u6295\u7968\u4e2d\u53d7\u5230\u201c\u540c\u4f34\u9519\u8bef\u6807\u7b7e\u201d\u5f71\u54cd\u7684\u98ce\u9669\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5171\u4eab\u7684\u8bef\u5bfc\u6027\u793e\u4f1a\u7ebf\u7d22\u4f1a\u663e\u8457\u63d0\u9ad8\u8bef\u62a5\u7387\uff0c\u751a\u81f3\u4f7f\u591a\u6570\u6295\u7968\u9762\u677f\u8bef\u62a5\u7387\u8fbe\u5230100%\uff0c\u8bf4\u660e\u591a\u6570\u6295\u7968\u5e76\u4e0d\u80fd\u62b5\u5fa1\u5171\u540c\u504f\u89c1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While modern 3D reconstruction excels at modeling object geometry and appearance, it largely ignores the rich acoustic cues revealed through physical interaction. Object impact sounds convey material, stiffness, and structural properties that complement vision, yet existing impact sound modeling approaches either rely on expensive physics-based simulation or require large datasets to generalize in a purely data-driven manner. We introduce Audio-Visual Modal Sound Field (AV-MSF), a novel object-level acoustic representation reconstructed from multi-view images and only a few impact sound recordings. AV-MSF builds on 3D Gaussian Splatting integrated with dense 3D visual feature to provide a strong geometry-aware prior, and represents the impact sound field using compact, physically meaningful modal parameters, enabling robust few-shot reconstruction. Experiments on two real-world datasets show that AV-MSF achieves state-of-the-art impact sound rendering, outperforming both physics-based and data-driven baselines. Furthermore, we demonstrate downstream applications enabled by our representation, including contact localization and object sound editing.", "arxiv_id": "2608.05145", "arxiv_url": "https://arxiv.org/abs/2608.05145", "authors": ["Zisen Shao", "Zihao Wei", "Derong Jin", "Ruohan Gao"], "brief": "\u672c\u6587\u63d0\u51fa AV-MSF\uff0c\u5c06\u591a\u89c6\u89d2\u56fe\u50cf\u4e0e\u5c11\u91cf\u6572\u51fb\u58f0\u97f3\u7ed3\u5408\uff0c\u91cd\u5efa\u7269\u4f53\u7ea7\u7684\u97f3\u89c6\u89c9\u6a21\u6001\u58f0\u573a\u3002\u65b9\u6cd5\u57fa\u4e8e 3D Gaussian Splatting \u548c\u5bc6\u96c6\u89c6\u89c9\u7279\u5f81\uff0c\u5f15\u5165\u7d27\u51d1\u4e14\u5177\u7269\u7406\u610f\u4e49\u7684\u6a21\u6001\u53c2\u6570\uff0c\u5728\u5c11\u6837\u672c\u6761\u4ef6\u4e0b\u5b9e\u73b0\u66f4\u9c81\u68d2\u7684\u51b2\u51fb\u58f0\u97f3\u6e32\u67d3\uff0c\u5e76\u5728\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u7269\u7406\u4eff\u771f\u548c\u6570\u636e\u9a71\u52a8\u57fa\u7ebf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05145", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u4e09\u7ef4\u91cd\u5efa", "\u97f3\u9891\u751f\u6210", "\u9ad8\u65af\u6e85\u5c04"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05145v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Objects as Audio-Visual Modal Sound Fields", "tldr": "\u672c\u6587\u63d0\u51fa AV-MSF\uff0c\u5c06\u591a\u89c6\u89d2\u56fe\u50cf\u4e0e\u5c11\u91cf\u6572\u51fb\u58f0\u97f3\u7ed3\u5408\uff0c\u91cd\u5efa\u7269\u4f53\u7ea7\u7684\u97f3\u89c6\u89c9\u6a21\u6001\u58f0\u573a\u3002\u65b9\u6cd5\u57fa\u4e8e 3D Gaussian Splatting \u548c\u5bc6\u96c6\u89c6\u89c9\u7279\u5f81\uff0c\u5f15\u5165\u7d27\u51d1\u4e14\u5177\u7269\u7406\u610f\u4e49\u7684\u6a21\u6001\u53c2\u6570\uff0c\u5728\u5c11\u6837\u672c\u6761\u4ef6\u4e0b\u5b9e\u73b0\u66f4\u9c81\u68d2\u7684\u51b2\u51fb\u58f0\u97f3\u6e32\u67d3\uff0c\u5e76\u5728\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u7269\u7406\u4eff\u771f\u548c\u6570\u636e\u9a71\u52a8\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Instruction-based video editing (IVE) is an emerging field with broad applications, yet evaluating editing models remains challenging. Existing benchmarks suffer from two major limitations: limited task coverage inherited from image editing, which overlooks video-specific dimensions, and inadequate metrics that fail to measure instruction fidelity, allowing incorrect edits to receive high scores due to strong visual priors from the original video. To address these issues, we introduce a comprehensive and structured benchmark for IVE. Our benchmark decomposes editing tasks into multiple video-specific dimensions, including spatial, temporal, audio, and reference-based editing, extending beyond conventional frame-level evaluation. It also distinguishes explicit and implicit instructions and incorporates reasoning-based scenarios to better reflect real-world requirements. Furthermore, we propose an evaluation framework that assesses editing quality from four complementary dimensions: accuracy, preservation, realism, and consistency, using both human judgments and state-of-the-art vision-language models. To emphasize instruction fidelity, we introduce an accuracy-aware penalty mechanism that conditions other scores on accuracy, preventing visually plausible but incorrect edits from receiving inflated evaluations. Extensive experiments on representative open-source and commercial models show that current IVE models remain far from satisfactory. OmniEdit-Bench provides a comprehensive and reliable testbed for evaluating instruction-based video editing and offers insights into future research directions.", "arxiv_id": "2608.05049", "arxiv_url": "https://arxiv.org/abs/2608.05049", "authors": ["Chenxuan Miao", "Yutong Feng", "Yi Lu", "Yunfeng Yan", "Donglian Qi", "Shiwei Zhang", "Yu Liu", "Xi Chen", "Hengshuang Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa OmniEdit-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u6307\u4ee4\u5f0f\u89c6\u9891\u7f16\u8f91\u7684\u7efc\u5408\u57fa\u51c6\uff0c\u8986\u76d6\u7a7a\u95f4\u3001\u65f6\u95f4\u3001\u97f3\u9891\u3001\u53c2\u8003\u7f16\u8f91\u4ee5\u53ca\u663e\u5f0f/\u9690\u5f0f\u548c\u63a8\u7406\u578b\u6307\u4ee4\u7b49\u89c6\u9891\u7279\u6709\u4efb\u52a1\u3002\u5176\u8bc4\u4f30\u6846\u67b6\u4ece\u51c6\u786e\u6027\u3001\u4fdd\u771f/\u4fdd\u7559\u3001\u771f\u5b9e\u611f\u548c\u4e00\u81f4\u6027\u8861\u91cf\u7ed3\u679c\uff0c\u5e76\u52a0\u5165\u51c6\u786e\u6027\u611f\u77e5\u60e9\u7f5a\uff0c\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u5f00\u6e90\u548c\u5546\u4e1a\u89c6\u9891\u7f16\u8f91\u6a21\u578b\u8868\u73b0\u4ecd\u4e0d\u7406\u60f3\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05049", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u57fa\u51c6\u8bc4\u6d4b", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05049v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OmniEdit-Bench: A Comprehensive Benchmark for Instruction-based Video Editing", "tldr": "\u8bba\u6587\u63d0\u51fa OmniEdit-Bench\uff0c\u4e00\u4e2a\u9762\u5411\u6307\u4ee4\u5f0f\u89c6\u9891\u7f16\u8f91\u7684\u7efc\u5408\u57fa\u51c6\uff0c\u8986\u76d6\u7a7a\u95f4\u3001\u65f6\u95f4\u3001\u97f3\u9891\u3001\u53c2\u8003\u7f16\u8f91\u4ee5\u53ca\u663e\u5f0f/\u9690\u5f0f\u548c\u63a8\u7406\u578b\u6307\u4ee4\u7b49\u89c6\u9891\u7279\u6709\u4efb\u52a1\u3002\u5176\u8bc4\u4f30\u6846\u67b6\u4ece\u51c6\u786e\u6027\u3001\u4fdd\u771f/\u4fdd\u7559\u3001\u771f\u5b9e\u611f\u548c\u4e00\u81f4\u6027\u8861\u91cf\u7ed3\u679c\uff0c\u5e76\u52a0\u5165\u51c6\u786e\u6027\u611f\u77e5\u60e9\u7f5a\uff0c\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u5f00\u6e90\u548c\u5546\u4e1a\u89c6\u9891\u7f16\u8f91\u6a21\u578b\u8868\u73b0\u4ecd\u4e0d\u7406\u60f3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video large language models (Video-LLMs) have made strong progress in open-ended video understanding. However, their visual interfaces remain token-intensive and provide limited explicit structure for linking recurring object evidence across time. We introduce SlotNarrative, a slot-based interface that organizes a video into persistent object narratives represented by compact object-state tokens. Rather than compressing frame-wise features before establishing temporal correspondence, SlotNarrative first groups visual features into object-like slots and then associates recurring observations with clip-level object entries through a lightweight, parameter-free memory that integrates multiple complementary matching cues. Each retained entry is serialized into two token types: an identity token that summarizes persistent object appearance and a set of state tokens that encode segment-level appearance, geometry, visibility, and trajectory information. This design yields an interface of only 144 allocated visual-token positions for a frozen Video-LLM, independent of the number of sampled frames. Across multiple datasets, SlotNarrative achieves a favorable trade-off between accuracy and visual-token count compared with prior compact Video-LLM interfaces. Experimental results establish persistent object narratives as a compact, structured, and temporally organized visual interface for Video-LLMs. Our code will be made publicly available.", "arxiv_id": "2608.04866", "arxiv_url": "https://arxiv.org/abs/2608.04866", "authors": ["Junzhe Chen", "Siyuan Meng", "Xiaojie Guo"], "brief": "\u672c\u6587\u63d0\u51fa SlotNarrative\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u9891\u5927\u8bed\u8a00\u6a21\u578b\u7684\u69fd\u4f4d\u5f0f\u89c6\u89c9\u63a5\u53e3\uff0c\u5148\u5c06\u89c6\u89c9\u7279\u5f81\u7ec4\u7ec7\u4e3a\u5bf9\u8c61\u69fd\u5e76\u8de8\u65f6\u95f4\u5173\u8054\u4e3a\u6301\u4e45\u5bf9\u8c61\u53d9\u4e8b\u3002\u5b83\u7528\u8eab\u4efd token \u548c\u72b6\u6001 token \u7d27\u51d1\u8868\u793a\u5bf9\u8c61\u5916\u89c2\u3001\u51e0\u4f55\u3001\u53ef\u89c1\u6027\u4e0e\u8f68\u8ff9\uff0c\u5728\u56fa\u5b9a 144 \u4e2a\u89c6\u89c9 token \u4e0b\u53d6\u5f97\u8f83\u597d\u7684\u51c6\u786e\u7387\u4e0e token \u6570\u6743\u8861\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04866", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u89c6\u9891\u5927\u8bed\u8a00\u6a21\u578b", "\u5bf9\u8c61\u8868\u793a", "Token\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04866v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Persistent Object Narratives for Token-Efficient Video Language Models", "tldr": "\u672c\u6587\u63d0\u51fa SlotNarrative\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u9891\u5927\u8bed\u8a00\u6a21\u578b\u7684\u69fd\u4f4d\u5f0f\u89c6\u89c9\u63a5\u53e3\uff0c\u5148\u5c06\u89c6\u89c9\u7279\u5f81\u7ec4\u7ec7\u4e3a\u5bf9\u8c61\u69fd\u5e76\u8de8\u65f6\u95f4\u5173\u8054\u4e3a\u6301\u4e45\u5bf9\u8c61\u53d9\u4e8b\u3002\u5b83\u7528\u8eab\u4efd token \u548c\u72b6\u6001 token \u7d27\u51d1\u8868\u793a\u5bf9\u8c61\u5916\u89c2\u3001\u51e0\u4f55\u3001\u53ef\u89c1\u6027\u4e0e\u8f68\u8ff9\uff0c\u5728\u56fa\u5b9a 144 \u4e2a\u89c6\u89c9 token \u4e0b\u53d6\u5f97\u8f83\u597d\u7684\u51c6\u786e\u7387\u4e0e token \u6570\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models provide a unified paradigm for connecting visual perception, language understanding, and robotic control. However, existing VLA models still face major challenges in long-horizon tasks: sparse expert demonstrations constrain cross-task compositional generalization; the non-Markovian nature of long-horizon tasks makes it difficult for policies conditioned only on current observations to maintain temporal consistency; limited closed-loop error correction allows execution errors to accumulate; and end-to-end action fine-tuning may weaken the high-level semantic representations of vision-language model (VLM) backbones. To address these issues, we propose a hierarchical long-horizon VLA architecture with an explicit language-memory module. The central idea is to convert discrete temporal observations into a coherent textual memory sequence with temporal logic. The system is decoupled into a high-level VLM and a low-level VLA: the high-level VLM performs semantic reasoning through a visual question answering training paradigm, while the low-level VLA executes precise continuous control conditioned on subtask instructions and visual observations. The high-level VLM recursively updates both language memory and subtask instructions using the previous memory as a contextual anchor, enabling persistent temporal tracking and dynamic correction during long-horizon execution. We evaluate the proposed method in multiple simulation environments and conduct sim-to-real experiments on a real robotic platform. The results demonstrate that explicit language memory improves the success rate and robustness of VLA models on complex long-horizon tasks while providing an interpretable semantic account of the decision process.", "arxiv_id": "2608.04765", "arxiv_url": "https://arxiv.org/abs/2608.04765", "authors": ["Houze Xu", "Jizhong Li", "Ziyi Ye"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5e26\u663e\u5f0f\u8bed\u8a00\u8bb0\u5fc6\u7684\u5206\u5c42\u957f\u7a0b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u67b6\u6784\uff0c\u5c06\u79bb\u6563\u65f6\u5e8f\u89c2\u6d4b\u8f6c\u5316\u4e3a\u5177\u6709\u65f6\u95f4\u903b\u8f91\u7684\u6587\u672c\u8bb0\u5fc6\u3002\u9ad8\u5c42 VLM \u8d1f\u8d23\u8bed\u4e49\u63a8\u7406\u3001\u66f4\u65b0\u8bb0\u5fc6\u4e0e\u5b50\u4efb\u52a1\u6307\u4ee4\uff0c\u4f4e\u5c42 VLA \u6267\u884c\u8fde\u7eed\u63a7\u5236\uff1b\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u63d0\u5347\u4e86\u590d\u6742\u957f\u7a0b\u4efb\u52a1\u7684\u6210\u529f\u7387\u4e0e\u9c81\u68d2\u6027\uff0c\u5e76\u589e\u5f3a\u4e86\u51b3\u7b56\u53ef\u89e3\u91ca\u6027\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04765", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u673a\u5668\u4eba", "\u957f\u7a0b\u89c4\u5212", "\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04765v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5e26\u663e\u5f0f\u8bed\u8a00\u8bb0\u5fc6\u7684\u5206\u5c42\u957f\u7a0b\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u67b6\u6784\uff0c\u5c06\u79bb\u6563\u65f6\u5e8f\u89c2\u6d4b\u8f6c\u5316\u4e3a\u5177\u6709\u65f6\u95f4\u903b\u8f91\u7684\u6587\u672c\u8bb0\u5fc6\u3002\u9ad8\u5c42 VLM \u8d1f\u8d23\u8bed\u4e49\u63a8\u7406\u3001\u66f4\u65b0\u8bb0\u5fc6\u4e0e\u5b50\u4efb\u52a1\u6307\u4ee4\uff0c\u4f4e\u5c42 VLA \u6267\u884c\u8fde\u7eed\u63a7\u5236\uff1b\u5728\u4eff\u771f\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u63d0\u5347\u4e86\u590d\u6742\u957f\u7a0b\u4efb\u52a1\u7684\u6210\u529f\u7387\u4e0e\u9c81\u68d2\u6027\uff0c\u5e76\u589e\u5f3a\u4e86\u51b3\u7b56\u53ef\u89e3\u91ca\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models increasingly reason over screenshots and documents where the task itself may be written in pixels. Yet benchmarks usually place questions in text, leaving it unclear whether models use the same instruction equally well across channels. We introduce Visualized Task Semantics (VTS), a controlled intervention that moves the question into the image while keeping the source problem and answer fixed. Across six MLLMs and four benchmarks, accuracy drops in all 24 model-task pairs, by 17.8 points on average. Models often transcribe the visual question correctly yet fail to use it, exposing a semantic channel gap beyond OCR. To reduce this gap, we present prompt-region grounding, whose core design aligns the question region with typed semantics and recovers its clean representation from a masked view. At matched training cost, our method raises four-benchmark VTS accuracy from 58.0 to 66.3 while preserving accuracy on the original interface, and requires no OCR or region metadata at inference. Reading task-bearing text and grounding it as an instruction for reasoning are distinct capabilities.", "arxiv_id": "2608.04726", "arxiv_url": "https://arxiv.org/abs/2608.04726", "authors": ["Yongxin Wang", "Ruizhe Zhou", "Yueling Tang", "Yingying Zhu", "Xuemin Zhao", "Xiaojun Chang", "Xiaodan Liang"], "brief": "\u672c\u6587\u63d0\u51fa Visualized Task Semantics\uff08VTS\uff09\uff0c\u5c06\u95ee\u9898\u4ece\u6587\u672c\u79fb\u5165\u56fe\u50cf\u50cf\u7d20\u4e2d\uff0c\u4ee5\u68c0\u9a8c\u591a\u6a21\u6001\u5927\u6a21\u578b\u80fd\u5426\u540c\u6837\u7406\u89e3\u201c\u89c6\u89c9\u5316\u7684\u4efb\u52a1\u6307\u4ee4\u201d\u3002\u5b9e\u9a8c\u663e\u793a\u516d\u4e2a\u6a21\u578b\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u5747\u663e\u8457\u6389\u70b9\uff0c\u5e73\u5747\u4e0b\u964d17.8\u5206\uff0c\u4e14\u5e38\u80fd\u6b63\u786e\u8f6c\u5199\u95ee\u9898\u5374\u4e0d\u80fd\u7528\u4e8e\u63a8\u7406\uff1b\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa prompt-region grounding\uff0c\u5c06\u95ee\u9898\u533a\u57df\u4e0e\u6587\u672c\u8bed\u4e49\u5bf9\u9f50\uff0c\u4f7fVTS\u51c6\u786e\u7387\u4ece58.0\u63d0\u5347\u523066.3\u4e14\u4e0d\u635f\u4f24\u539f\u63a5\u53e3\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04726", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u63a8\u7406", "\u6307\u4ee4\u7406\u89e3", "\u6587\u6863\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04726v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Prompts Become Pixels: Prompt-Region Grounding for Multimodal Reasoning", "tldr": "\u672c\u6587\u63d0\u51fa Visualized Task Semantics\uff08VTS\uff09\uff0c\u5c06\u95ee\u9898\u4ece\u6587\u672c\u79fb\u5165\u56fe\u50cf\u50cf\u7d20\u4e2d\uff0c\u4ee5\u68c0\u9a8c\u591a\u6a21\u6001\u5927\u6a21\u578b\u80fd\u5426\u540c\u6837\u7406\u89e3\u201c\u89c6\u89c9\u5316\u7684\u4efb\u52a1\u6307\u4ee4\u201d\u3002\u5b9e\u9a8c\u663e\u793a\u516d\u4e2a\u6a21\u578b\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u5747\u663e\u8457\u6389\u70b9\uff0c\u5e73\u5747\u4e0b\u964d17.8\u5206\uff0c\u4e14\u5e38\u80fd\u6b63\u786e\u8f6c\u5199\u95ee\u9898\u5374\u4e0d\u80fd\u7528\u4e8e\u63a8\u7406\uff1b\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa prompt-region grounding\uff0c\u5c06\u95ee\u9898\u533a\u57df\u4e0e\u6587\u672c\u8bed\u4e49\u5bf9\u9f50\uff0c\u4f7fVTS\u51c6\u786e\u7387\u4ece58.0\u63d0\u5347\u523066.3\u4e14\u4e0d\u635f\u4f24\u539f\u63a5\u53e3\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We tackle the challenging yet underexplored task of Generalized Referring Expression Comprehension (GREC), which requires a model to localize the object described by a textual expression when it exists (positive sample) and to refuse output when it does not (negative sample). Although Multimodal Large Language Models (MLLMs) excel at localizing existing objects, they often fail to reject nonexistent ones due to the absence of negative samples during training, producing hallucinated bounding boxes. Existing post-training approaches such as supervised fine-tuning (SFT) and reinforcement learning (RL) enhance refusal behavior but usually degrade localization accuracy on positive samples, undermining the model\u0027s core competence. To address this, we propose Refusal-Calibrated Group Relative Policy Optimization (RC-GRPO), a calibrated RL strategy that strengthens the refusal ability of MLLMs while preserving localization performance. It enforces \"None\" outputs in rollouts for valid advantage estimation on negative samples and applies a penalty to prevent over-refusal on positives, achieving a balanced trade-off between accuracy and reliability. A second-stage reasoning reinforcement further consolidates causal understanding and interpretability. Experiments on three GREC benchmarks demonstrate that RC-GRPO attains superior localization accuracy while maintaining strong refusal capability.", "arxiv_id": "2608.04698", "arxiv_url": "https://arxiv.org/abs/2608.04698", "authors": ["Xuzheng Yang", "Jun Ling", "Tao Huang", "Caiyan Qin", "Peng Wang"], "brief": "\u8bba\u6587\u7814\u7a76\u5e7f\u4e49\u6307\u4ee3\u8868\u8fbe\u7406\u89e3\uff0c\u8981\u6c42\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u76ee\u6807\u5b58\u5728\u65f6\u5b9a\u4f4d\u76ee\u6807\u3001\u4e0d\u5b58\u5728\u65f6\u62d2\u7edd\u8f93\u51fa\uff0c\u4ee5\u51cf\u5c11\u5e7b\u89c9\u6846\u3002\u4f5c\u8005\u63d0\u51fa\u62d2\u7edd\u6821\u51c6\u7684 GRPO\uff0c\u901a\u8fc7\u8d1f\u6837\u672c\u5f3a\u5236 None \u8f93\u51fa\u548c\u6b63\u6837\u672c\u8fc7\u5ea6\u62d2\u7edd\u60e9\u7f5a\uff0c\u5728\u63d0\u5347\u62d2\u7edd\u80fd\u529b\u7684\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u5b9a\u4f4d\u7cbe\u5ea6\uff0c\u5e76\u5728\u4e09\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u51c6\u786e\u6027\u4e0e\u53ef\u9760\u6027\u5e73\u8861\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04698", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u76ee\u6807\u5b9a\u4f4d", "\u5f3a\u5316\u5b66\u4e60", "\u5e7b\u89c9\u6291\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04698v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Teaching MLLMs to Say No: Generalized Referring Expression Comprehension via Refusal Calibrated GRPO", "tldr": "\u8bba\u6587\u7814\u7a76\u5e7f\u4e49\u6307\u4ee3\u8868\u8fbe\u7406\u89e3\uff0c\u8981\u6c42\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u76ee\u6807\u5b58\u5728\u65f6\u5b9a\u4f4d\u76ee\u6807\u3001\u4e0d\u5b58\u5728\u65f6\u62d2\u7edd\u8f93\u51fa\uff0c\u4ee5\u51cf\u5c11\u5e7b\u89c9\u6846\u3002\u4f5c\u8005\u63d0\u51fa\u62d2\u7edd\u6821\u51c6\u7684 GRPO\uff0c\u901a\u8fc7\u8d1f\u6837\u672c\u5f3a\u5236 None \u8f93\u51fa\u548c\u6b63\u6837\u672c\u8fc7\u5ea6\u62d2\u7edd\u60e9\u7f5a\uff0c\u5728\u63d0\u5347\u62d2\u7edd\u80fd\u529b\u7684\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u5b9a\u4f4d\u7cbe\u5ea6\uff0c\u5e76\u5728\u4e09\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u51c6\u786e\u6027\u4e0e\u53ef\u9760\u6027\u5e73\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World action models (WAMs) built on video generation backbones are a rising recipe for robot learning, yet remain confined to tabletop manipulation. Mobile manipulation demands simultaneous locomotion and whole-body manipulation amid scene-scale dynamics, yet is still dominated by dynamics-blind visual encoders with hand-crafted coordination. We bridge this gap with MobileWAM, a mixture-of-transformers architecture that fuses a pretrained video diffusion transformer with a lightweight action expert through layerwise joint attention, translating internet-scale motion priors into whole-body control. To reconcile the heterogeneous dynamics of moving and manipulating, each feed-forward layer of the action expert becomes a three-expert mixture of shared, locomotion, and manipulation experts, softly routed by the motion intent in the action tokens. To densify supervision, we further propose Chain-of-Foresight (CoF): intermediate representations sequentially predict a chain of future latent chunks, each step conditioned on its predecessor. CoF pairs naturally with our decoupled video--action denoising scheme. At deployment, the WAM serves as a pure current-frame encoder; foresight acts only through gradients, so at inference the foresight chain and video generation are discarded, leaving only policy-level cost. MobileWAM surpasses state-of-the-art mobile manipulation policies on ManiSkill-HAB and fine-tunes to a real ARX Lift2 mobile manipulator across diverse tasks with strong generalization. Code will be released soon.", "arxiv_id": "2608.04657", "arxiv_url": "https://arxiv.org/abs/2608.04657", "authors": ["Zehua Fan", "Junjie He", "Wenxuan Song", "Xi Wang", "Wenqi Lyu", "Linge Zhao", "Fuhao Li", "Zihan You", "Yifei Yang", "Kaiming Xu", "Qi Jiang", "Yue Jiang", "Haoang Li", "Cheng Chi", "Bailin Li", "Yan Wang"], "brief": "MobileWAM \u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5f15\u5165\u79fb\u52a8\u64cd\u4f5c\uff0c\u901a\u8fc7\u6df7\u5408 Transformer \u4e0e\u5206\u5c42\u8054\u5408\u6ce8\u610f\u529b\uff0c\u628a\u5927\u89c4\u6a21\u89c6\u9891\u8fd0\u52a8\u5148\u9a8c\u8f6c\u5316\u4e3a\u5168\u8eab\u63a7\u5236\u7b56\u7565\u3002\u5176 Chain-of-Foresight \u5728\u8bad\u7ec3\u4e2d\u9884\u6d4b\u8fde\u7eed\u672a\u6765\u6f5c\u8868\u793a\u4ee5\u589e\u5f3a\u76d1\u7763\uff0c\u63a8\u7406\u65f6\u4e22\u5f03\u9884\u6d4b\u94fe\u548c\u89c6\u9891\u751f\u6210\uff0c\u4ec5\u4fdd\u7559\u4f4e\u6210\u672c\u7b56\u7565\uff0c\u5728 ManiSkill-HAB \u548c\u771f\u5b9e\u79fb\u52a8\u673a\u68b0\u81c2\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u5e76\u5177\u5907\u8f83\u597d\u6cdb\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04657", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u79fb\u52a8\u64cd\u4f5c", "\u6269\u6563\u6a21\u578b", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04657v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MobileWAM: Bridging World Action Models to Mobile Manipulation with Chain-of-Foresight", "tldr": "MobileWAM \u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5f15\u5165\u79fb\u52a8\u64cd\u4f5c\uff0c\u901a\u8fc7\u6df7\u5408 Transformer \u4e0e\u5206\u5c42\u8054\u5408\u6ce8\u610f\u529b\uff0c\u628a\u5927\u89c4\u6a21\u89c6\u9891\u8fd0\u52a8\u5148\u9a8c\u8f6c\u5316\u4e3a\u5168\u8eab\u63a7\u5236\u7b56\u7565\u3002\u5176 Chain-of-Foresight \u5728\u8bad\u7ec3\u4e2d\u9884\u6d4b\u8fde\u7eed\u672a\u6765\u6f5c\u8868\u793a\u4ee5\u589e\u5f3a\u76d1\u7763\uff0c\u63a8\u7406\u65f6\u4e22\u5f03\u9884\u6d4b\u94fe\u548c\u89c6\u9891\u751f\u6210\uff0c\u4ec5\u4fdd\u7559\u4f4e\u6210\u672c\u7b56\u7565\uff0c\u5728 ManiSkill-HAB \u548c\u771f\u5b9e\u79fb\u52a8\u673a\u68b0\u81c2\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u5e76\u5177\u5907\u8f83\u597d\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Action-conditioned world models aim to predict how visual environments evolve under an agent\u0027s actions. Yet future frames are often highly predictable from visual inertia and recurring motion patterns alone. This creates a shortcut: models can fit the data by exploiting statistical biases without making their visible dynamics meaningfully depend on the action. As a result, different actions may produce similar futures, while motion may persist even under zero action. The key question is how to reduce reliance on statistical shortcuts from dominating action-conditioned prediction. We argue that action control requires more than injecting action features; it requires enforcing consistency under counterfactual changes to actions and observations. Based on this insight, we introduce CoCo, a Counterfactual Consistency framework to enhance action controllability through two complementary constraints. Multi-step counterfactual consistency constrains reference, inverse-action, and zero-action rollouts, while action-spatial counterfactual consistency enforces consistent predictions under mirrored scenes and transformed actions. Together, they reduce reliance on statistical shortcuts from substituting for action-dependent dynamics. We further introduce Action Response Consistency (ARC) and Drift Energy (DE) to assess action controllability, together with Mini-SSMB for same-state, multi-action counterfactual evaluation. On Mini-SSMB, our full model achieved ARC_inv of 0.412 and ARC_ref of 0.483, while reducing DE by 17.07% relative to the baseline. On VP2 visual planning, it achieves the highest average success rate among SOTA models, at 73.1%. Experiments on BAIR and RoboNet further show that these gains preserve video prediction quality and transfer across model settings.", "arxiv_id": "2608.04653", "arxiv_url": "https://arxiv.org/abs/2608.04653", "authors": ["Yuhong Shi", "Zhenhao Chu", "Jie Wei", "Jun Hao", "Jianyi Liu", "Jingwen Fu"], "brief": "\u8bba\u6587\u6307\u51fa\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u5bb9\u6613\u5229\u7528\u89c6\u89c9\u60ef\u6027\u548c\u8fd0\u52a8\u7edf\u8ba1\u504f\u5dee\uff0c\u800c\u4e0d\u771f\u6b63\u54cd\u5e94\u52a8\u4f5c\uff0c\u5bfc\u81f4\u4e0d\u540c\u52a8\u4f5c\u9884\u6d4b\u76f8\u4f3c\u6216\u96f6\u52a8\u4f5c\u4e0b\u4ecd\u6301\u7eed\u6f02\u79fb\u3002\u4f5c\u8005\u63d0\u51fa CoCo \u53cd\u4e8b\u5b9e\u4e00\u81f4\u6027\u6846\u67b6\uff0c\u901a\u8fc7\u591a\u6b65\u53cd\u4e8b\u5b9e\u4e0e\u52a8\u4f5c-\u7a7a\u95f4\u53d8\u6362\u7ea6\u675f\u63d0\u5347\u52a8\u4f5c\u53ef\u63a7\u6027\uff0c\u5e76\u5728 Mini-SSMB\u3001VP2\u3001BAIR\u3001RoboNet \u4e0a\u6539\u5584\u53ef\u63a7\u6027\u548c\u89c4\u5212\u6210\u529f\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u89c6\u9891\u9884\u6d4b\u8d28\u91cf\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04653", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u53cd\u4e8b\u5b9e\u5b66\u4e60", "\u89c6\u89c9\u9884\u6d4b", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04653v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Overcoming Statistical Bias in Action-Controllable World Models", "tldr": "\u8bba\u6587\u6307\u51fa\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u5bb9\u6613\u5229\u7528\u89c6\u89c9\u60ef\u6027\u548c\u8fd0\u52a8\u7edf\u8ba1\u504f\u5dee\uff0c\u800c\u4e0d\u771f\u6b63\u54cd\u5e94\u52a8\u4f5c\uff0c\u5bfc\u81f4\u4e0d\u540c\u52a8\u4f5c\u9884\u6d4b\u76f8\u4f3c\u6216\u96f6\u52a8\u4f5c\u4e0b\u4ecd\u6301\u7eed\u6f02\u79fb\u3002\u4f5c\u8005\u63d0\u51fa CoCo \u53cd\u4e8b\u5b9e\u4e00\u81f4\u6027\u6846\u67b6\uff0c\u901a\u8fc7\u591a\u6b65\u53cd\u4e8b\u5b9e\u4e0e\u52a8\u4f5c-\u7a7a\u95f4\u53d8\u6362\u7ea6\u675f\u63d0\u5347\u52a8\u4f5c\u53ef\u63a7\u6027\uff0c\u5e76\u5728 Mini-SSMB\u3001VP2\u3001BAIR\u3001RoboNet \u4e0a\u6539\u5584\u53ef\u63a7\u6027\u548c\u89c4\u5212\u6210\u529f\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u89c6\u9891\u9884\u6d4b\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "EgoCross is a cross-domain egocentric video question answering benchmark designed to evaluate whether multimodal large language models can generalize beyond common daily-life scenarios. The first EgoCross Challenge was hosted at the Third EgoVis Workshop at CVPR 2026 and evaluated models on first-person videos from four target domains: surgery, industrial assembly, extreme sports, and animal perspectives. Each test example consists of an egocentric video clip, a question, and four candidate answers, from which the model must select the correct option. This technical report introduces the challenge task, benchmark resources, and two official Codabench tracks. The Source-Limited Track restricts participants to the official baseline model and a small support set, whereas the Open-Source Track permits broader choices of models and training data under rules that prohibit the manual construction of target-domain training data. In total, the challenge received more than 1,500 submissions from over 130 participants, with 19 teams participating in the Open-Source Track and 38 teams in the Source-Limited Track. We further present the official leaderboard results and summarize the winning solutions from both tracks. We hope that this report will serve as a useful technical reference for advancing cross-domain egocentric video understanding. All resources, including the challenge data, baseline implementation, and code released by the winning teams, are made publicly available.", "arxiv_id": "2608.04589", "arxiv_url": "https://arxiv.org/abs/2608.04589", "authors": ["Yuqian Fu", "Tianwen Qian", "Yanjun Li", "Yu Li", "Kunyu Peng", "Xu Zheng", "Yongqin Xian", "Alessio Tonioni", "Yanwei Fu", "Xiaoling Wang", "Danda Paudel", "Federico Tombari", "Luc Van Gool", "Leyi Wu", "Yifan Zhao", "Jinjie Zhang", "Yinchuan Li", "Yingcong Chen", "Zixu Li", "Zhiwei Chen", "Zhiheng Fu", "Wenbo Wang", "Yupeng Hu", "Weili Guan", "Liqiang Nie", "Takuya Murakawa", "Toru Tamaki", "Yi Wen", "Zhenglin Du", "Zhengyang Li", "Lingling Li", "Licheng Jiao", "Wenping Ma"], "brief": "\u672c\u6587\u4ecb\u7ecd EgoCross \u8de8\u57df\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u95ee\u7b54\u57fa\u51c6\u4e0e 2026 \u5e74 EgoVis \u6311\u6218\u8d5b\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u624b\u672f\u3001\u5de5\u4e1a\u88c5\u914d\u3001\u6781\u9650\u8fd0\u52a8\u548c\u52a8\u7269\u89c6\u89d2\u7b49\u975e\u5e38\u89c4\u9886\u57df\u7684\u6cdb\u5316\u80fd\u529b\u3002\u62a5\u544a\u516c\u5e03\u4e86\u8d5b\u9053\u8bbe\u7f6e\u3001\u6392\u884c\u699c\u7ed3\u679c\u548c\u4f18\u80dc\u65b9\u6848\uff0c\u5e76\u5f00\u653e\u6570\u636e\u3001\u57fa\u7ebf\u4e0e\u83b7\u80dc\u4ee3\u7801\uff0c\u4e3a\u8de8\u57df\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u7406\u89e3\u63d0\u4f9b\u53c2\u8003\u8d44\u6e90\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04589", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u95ee\u7b54", "\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u8de8\u57df\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04589v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The First EgoCross Challenge at EgoVis 2026: Cross-Domain Egocentric Video Question Answering", "tldr": "\u672c\u6587\u4ecb\u7ecd EgoCross \u8de8\u57df\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u95ee\u7b54\u57fa\u51c6\u4e0e 2026 \u5e74 EgoVis \u6311\u6218\u8d5b\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u624b\u672f\u3001\u5de5\u4e1a\u88c5\u914d\u3001\u6781\u9650\u8fd0\u52a8\u548c\u52a8\u7269\u89c6\u89d2\u7b49\u975e\u5e38\u89c4\u9886\u57df\u7684\u6cdb\u5316\u80fd\u529b\u3002\u62a5\u544a\u516c\u5e03\u4e86\u8d5b\u9053\u8bbe\u7f6e\u3001\u6392\u884c\u699c\u7ed3\u679c\u548c\u4f18\u80dc\u65b9\u6848\uff0c\u5e76\u5f00\u653e\u6570\u636e\u3001\u57fa\u7ebf\u4e0e\u83b7\u80dc\u4ee3\u7801\uff0c\u4e3a\u8de8\u57df\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u7406\u89e3\u63d0\u4f9b\u53c2\u8003\u8d44\u6e90\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-form video understanding requires locating sparse, question-relevant evidence in long, multimodal videos. Real-world video distributions differ in modality-specific information density, content structure, and evidence patterns, causing fixed video-agent designs to incur redundant processing or fail when mismatched. Extending automated agent evolution from text to video is challenging because full long-video execution makes candidate validation expensive, failures propagate across coupled evidence-processing stages, and complex preprocessing, perception tools, and localization strategies make code-level updates difficult to implement reliably. We introduce MetaVideoAgent, a framework that automatically evolves a video agent for a target distribution. It profiles information density and evidence requirements from sparsely sampled frames and associated queries to guide initial design, then compresses localized failures into independently executable minimal validation tasks. It constructs evidence-grounded Gold Paths, audits Student trajectories, aggregates recurring failures across samples, and attributes them to responsible modules. A modular agent representation constrains each update to the primary responsible module and its necessary dependencies. We further introduce VA-EvoBench, covering eight video distributions with separate evolution and held-out splits. With four evolution iterations per distribution, MetaVideoAgent improves every initial agent and raises macro-average accuracy from 38.44% to 51.47%, at an average evolution cost of 3.54M tokens per distribution. The evolved agents outperform the strongest prior fixed-design video agent by 6.39 percentage points while using the fewest tokens and video frames per question among the compared video agents. We will release all code and data to support reproducible research.", "arxiv_id": "2608.04587", "arxiv_url": "https://arxiv.org/abs/2608.04587", "authors": ["Benlei Cui", "Ruize Wang", "Junjie Li", "Jinhao Chen", "Longtao Huang", "Yinghao Chen", "Yuwen Zhai", "Jingqun Tang", "Ruijian Jia", "Weiwei Wu", "Pengfei Sun", "Haiwen Hong"], "brief": "MetaVideoAgent \u662f\u4e00\u4e2a\u9762\u5411\u957f\u89c6\u9891\u7406\u89e3\u7684\u81ea\u52a8\u5316\u89c6\u9891\u667a\u80fd\u4f53\u8fdb\u5316\u6846\u67b6\uff0c\u4f1a\u6839\u636e\u76ee\u6807\u89c6\u9891\u5206\u5e03\u5206\u6790\u4fe1\u606f\u5bc6\u5ea6\u4e0e\u8bc1\u636e\u9700\u6c42\uff0c\u5e76\u5c06\u5931\u8d25\u538b\u7f29\u4e3a\u53ef\u72ec\u7acb\u9a8c\u8bc1\u7684\u5c0f\u4efb\u52a1\u6765\u8fed\u4ee3\u6539\u8fdb\u6a21\u5757\u3002\u5b83\u5728 VA-EvoBench \u7684 8 \u7c7b\u89c6\u9891\u5206\u5e03\u4e0a\u5c06\u5b8f\u5e73\u5747\u51c6\u786e\u7387\u4ece 38.44% \u63d0\u5347\u5230 51.47%\uff0c\u5e76\u8d85\u8fc7\u6700\u5f3a\u56fa\u5b9a\u8bbe\u8ba1\u89c6\u9891\u667a\u80fd\u4f53 6.39 \u4e2a\u767e\u5206\u70b9\uff0c\u540c\u65f6\u4f7f\u7528\u66f4\u5c11 token \u548c\u89c6\u9891\u5e27\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04587", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u81ea\u52a8\u5316\u4f18\u5316", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04587v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MetaVideoAgent: Automated Video-Agent Evolution for Long-Form Video Understanding", "tldr": "MetaVideoAgent \u662f\u4e00\u4e2a\u9762\u5411\u957f\u89c6\u9891\u7406\u89e3\u7684\u81ea\u52a8\u5316\u89c6\u9891\u667a\u80fd\u4f53\u8fdb\u5316\u6846\u67b6\uff0c\u4f1a\u6839\u636e\u76ee\u6807\u89c6\u9891\u5206\u5e03\u5206\u6790\u4fe1\u606f\u5bc6\u5ea6\u4e0e\u8bc1\u636e\u9700\u6c42\uff0c\u5e76\u5c06\u5931\u8d25\u538b\u7f29\u4e3a\u53ef\u72ec\u7acb\u9a8c\u8bc1\u7684\u5c0f\u4efb\u52a1\u6765\u8fed\u4ee3\u6539\u8fdb\u6a21\u5757\u3002\u5b83\u5728 VA-EvoBench \u7684 8 \u7c7b\u89c6\u9891\u5206\u5e03\u4e0a\u5c06\u5b8f\u5e73\u5747\u51c6\u786e\u7387\u4ece 38.44% \u63d0\u5347\u5230 51.47%\uff0c\u5e76\u8d85\u8fc7\u6700\u5f3a\u56fa\u5b9a\u8bbe\u8ba1\u89c6\u9891\u667a\u80fd\u4f53 6.39 \u4e2a\u767e\u5206\u70b9\uff0c\u540c\u65f6\u4f7f\u7528\u66f4\u5c11 token \u548c\u89c6\u9891\u5e27\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Part-level affordance grounding has advanced the localization of functional object regions associated with elemental actions. Extending this capability to complex tasks calls for connecting the semantic roles of participating objects with task-state-aligned visual observations and multi-step planning. We introduce EgoAfford, a benchmark designed to connect these three aspects. Given an egocentric observation and a high-level tabletop task, a model must generate the remaining plan and segment the functional regions of up to three components of the next action: the direct object, instrument, and destination. EgoAfford comprises approximately 15.5k human-verified images from 2,000 generated multi-step scenes, organized as semantically aligned, task-complete image series, together with EgoAfford-Real, 102 manually captured images spanning 26 tasks. We further present EgoLens, a 3B multimodal large language model with role-specific mask decoders, as an in-domain reference model for this joint task. Evaluations of recent referring-segmentation MLLMs, commercial-VLM--SAM2 pipelines, and EgoLens highlight the complementary challenges of next-step inference and action-role-conditioned part grounding. EgoLens establishes strong reference performance on both generated and manually captured observations. Together, EgoAfford and EgoLens provide a foundation for jointly studying perception and planning in multi-step tabletop tasks. Our project page is available at: https://egoafford.github.io", "arxiv_id": "2608.04533", "arxiv_url": "https://arxiv.org/abs/2608.04533", "authors": ["Xinyuan Guan", "Feifan Chen", "Xinyu Zhan", "Fu-Cheng Zhang", "Cewu Lu", "Lixin Yang"], "brief": "\u672c\u6587\u63d0\u51fa EgoAfford \u57fa\u51c6\uff0c\u7528\u4e8e\u5728\u7b2c\u4e00\u89c6\u89d2\u684c\u9762\u591a\u6b65\u4efb\u52a1\u4e2d\u540c\u65f6\u9884\u6d4b\u5269\u4f59\u8ba1\u5212\uff0c\u5e76\u5206\u5272\u4e0b\u4e00\u6b65\u52a8\u4f5c\u4e2d\u76f4\u63a5\u5bf9\u8c61\u3001\u5de5\u5177\u548c\u76ee\u6807\u4f4d\u7f6e\u7b49\u529f\u80fd\u533a\u57df\u3002\u6570\u636e\u96c6\u5305\u542b\u7ea61.55\u4e07\u5f20\u4eba\u5de5\u9a8c\u8bc1\u7684\u751f\u6210\u56fe\u50cf\u548c102\u5f20\u771f\u5b9e\u62cd\u6444\u56fe\u50cf\uff0c\u5e76\u63d0\u51fa3B\u591a\u6a21\u6001\u6a21\u578b EgoLens \u4f5c\u4e3a\u53c2\u8003\u65b9\u6cd5\uff0c\u5728\u4e0b\u4e00\u6b65\u63a8\u7406\u548c\u89d2\u8272\u6761\u4ef6\u5316\u90e8\u4ef6\u5b9a\u4f4d\u4e0a\u53d6\u5f97\u8f83\u5f3a\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04533", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u5b9a\u4f4d", "\u5177\u8eab\u611f\u77e5", "\u4efb\u52a1\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04533v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EgoAfford: Task-Oriented Affordance Grounding via Egocentric Referring Segmentation", "tldr": "\u672c\u6587\u63d0\u51fa EgoAfford \u57fa\u51c6\uff0c\u7528\u4e8e\u5728\u7b2c\u4e00\u89c6\u89d2\u684c\u9762\u591a\u6b65\u4efb\u52a1\u4e2d\u540c\u65f6\u9884\u6d4b\u5269\u4f59\u8ba1\u5212\uff0c\u5e76\u5206\u5272\u4e0b\u4e00\u6b65\u52a8\u4f5c\u4e2d\u76f4\u63a5\u5bf9\u8c61\u3001\u5de5\u5177\u548c\u76ee\u6807\u4f4d\u7f6e\u7b49\u529f\u80fd\u533a\u57df\u3002\u6570\u636e\u96c6\u5305\u542b\u7ea61.55\u4e07\u5f20\u4eba\u5de5\u9a8c\u8bc1\u7684\u751f\u6210\u56fe\u50cf\u548c102\u5f20\u771f\u5b9e\u62cd\u6444\u56fe\u50cf\uff0c\u5e76\u63d0\u51fa3B\u591a\u6a21\u6001\u6a21\u578b EgoLens \u4f5c\u4e3a\u53c2\u8003\u65b9\u6cd5\uff0c\u5728\u4e0b\u4e00\u6b65\u63a8\u7406\u548c\u89d2\u8272\u6761\u4ef6\u5316\u90e8\u4ef6\u5b9a\u4f4d\u4e0a\u53d6\u5f97\u8f83\u5f3a\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) process an image as a sequence of visual tokens, which creates a substantial computational bottleneck during inference. Recent visual token pruning methods address this issue by removing seemingly redundant tokens, yet it remains unclear how these pruning decisions relate to the functional roles of visual tokens. In this work, we analyze visual token pruning through the lens of token roles identified by EmbedLens. We first show that representative pruning methods exhibit distinct token-role biases, but these biases do not directly correlate with downstream performance. To better understand this behavior, we refine the token-role assignment procedure and evaluate role-protected pruning variants. Our results show that preserving non-alive tokens can sometimes maintain or improve performance, suggesting that tokens with weak direct semantic alignment may still affect model behavior under pruning. Our code is publicly available at https://github.com/jaykim9870/Not_All_Redundant_Tokens_Are_Alike.", "arxiv_id": "2608.04483", "arxiv_url": "https://arxiv.org/abs/2608.04483", "authors": ["Hyeonyu Kim", "Sehwan Lim", "Youngwon Choi", "Taeyoun Kwon", "Jaejin Kim"], "brief": "\u672c\u6587\u4ece\u89c6\u89c9 token \u7684\u529f\u80fd\u89d2\u8272\u51fa\u53d1\uff0c\u5206\u6790\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u89c6\u89c9 token \u526a\u679d\u884c\u4e3a\uff0c\u53d1\u73b0\u4e0d\u540c\u526a\u679d\u65b9\u6cd5\u5b58\u5728\u660e\u663e\u7684\u89d2\u8272\u504f\u597d\uff0c\u4f46\u8fd9\u79cd\u504f\u597d\u4e0e\u4e0b\u6e38\u6027\u80fd\u5e76\u4e0d\u76f4\u63a5\u76f8\u5173\u3002\u4f5c\u8005\u6539\u8fdb\u4e86 token \u89d2\u8272\u5206\u914d\u5e76\u6d4b\u8bd5\u89d2\u8272\u4fdd\u62a4\u526a\u679d\uff0c\u7ed3\u679c\u8868\u660e\u5373\u4f7f\u8bed\u4e49\u5bf9\u9f50\u8f83\u5f31\u7684\u975e\u6d3b\u8dc3 token \u4e5f\u53ef\u80fd\u5f71\u54cd\u6a21\u578b\u8868\u73b0\uff0c\u4fdd\u7559\u5b83\u4eec\u6709\u65f6\u80fd\u7ef4\u6301\u6216\u63d0\u5347\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04483", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u526a\u679d", "\u89c6\u89c9Token", "\u6a21\u578b\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04483v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Not All Redundant Tokens Are Alike: Analyzing Visual Token Pruning through Token Roles", "tldr": "\u672c\u6587\u4ece\u89c6\u89c9 token \u7684\u529f\u80fd\u89d2\u8272\u51fa\u53d1\uff0c\u5206\u6790\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u7684\u89c6\u89c9 token \u526a\u679d\u884c\u4e3a\uff0c\u53d1\u73b0\u4e0d\u540c\u526a\u679d\u65b9\u6cd5\u5b58\u5728\u660e\u663e\u7684\u89d2\u8272\u504f\u597d\uff0c\u4f46\u8fd9\u79cd\u504f\u597d\u4e0e\u4e0b\u6e38\u6027\u80fd\u5e76\u4e0d\u76f4\u63a5\u76f8\u5173\u3002\u4f5c\u8005\u6539\u8fdb\u4e86 token \u89d2\u8272\u5206\u914d\u5e76\u6d4b\u8bd5\u89d2\u8272\u4fdd\u62a4\u526a\u679d\uff0c\u7ed3\u679c\u8868\u660e\u5373\u4f7f\u8bed\u4e49\u5bf9\u9f50\u8f83\u5f31\u7684\u975e\u6d3b\u8dc3 token \u4e5f\u53ef\u80fd\u5f71\u54cd\u6a21\u578b\u8868\u73b0\uff0c\u4fdd\u7559\u5b83\u4eec\u6709\u65f6\u80fd\u7ef4\u6301\u6216\u63d0\u5347\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing document understanding benchmarks have largely focused on locating page elements, yet real-world document intelligence requires models to reason jointly about region semantics, spatial relations, and visual structure. We present ADOPD 2026, a reasoning-oriented extension of ADOPD that turns page decomposition into spatially grounded document understanding. ADOPD 2026 enriches page anchors inherited from ADOPD 2024 dataset with human-cleaned captions, semantic tags, and generated chain-of-thought (CoT) traces grounded to document regions. Instead of treating boxes, masks, and tags as independent supervision signals, we cast text blocks, visual entities, semantic labels, bounding boxes, and polygon masks as a shared vocabulary of visual anchors. This representation supports three connected capabilities. First, region-level semantic tagging asks models to identify document element types from both page context and local appearance, revealing long-tail semantic failures that standard layout benchmarks often hide. Second, unified vision-language grounding generates text regions and visual entities together with coordinates or polygonal outlines, transforming detection and segmentation outputs into structured anchors that can be reused by downstream reasoning systems. Third, current state-of-the-art models still struggle with dense counting tasks evaluated on DocCount, a benchmark derived from ADOPD 2026, highlighting the need for the Thinking-with-Anchors pipeline in document semantic understanding. By connecting page decomposition to verifiable visual-anchor reasoning, ADOPD 2026 provides a task framework that moves document understanding beyond localization toward anchor-grounded document intelligence.", "arxiv_id": "2608.04424", "arxiv_url": "https://arxiv.org/abs/2608.04424", "authors": ["Sichen Zhu", "Yuchen Zhu", "Wenzhuo Xu", "Jason Kuen", "Wanrong Zhu", "Jing Shi", "Xuan Shen", "Quanyi Wang", "Yiwei Wang", "Yujun Cai", "Bing Shuai", "Qin Zhang", "Yongxin Chen", "Shilong Liu", "Molei Tao", "Jiuxiang Gu"], "brief": "\u672c\u6587\u63d0\u51fa ADOPD 2026\uff0c\u5c06\u6587\u6863\u9875\u9762\u4e2d\u7684\u6587\u672c\u5757\u3001\u89c6\u89c9\u5b9e\u4f53\u3001\u8bed\u4e49\u6807\u7b7e\u3001\u8fb9\u754c\u6846\u548c\u63a9\u7801\u7edf\u4e00\u4e3a\u201c\u89c6\u89c9\u951a\u70b9\u201d\uff0c\u7528\u4e8e\u533a\u57df\u8bed\u4e49\u6807\u6ce8\u3001\u89c6\u89c9\u8bed\u8a00\u5b9a\u4f4d\u548c\u53ef\u9a8c\u8bc1\u7684\u6587\u6863\u63a8\u7406\u3002\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u73b0\u6709\u6a21\u578b\u5728\u957f\u5c3e\u8bed\u4e49\u8bc6\u522b\u548c\u5bc6\u96c6\u8ba1\u6570\u7b49\u4efb\u52a1\u4e0a\u7684\u4e0d\u8db3\uff0c\u63a8\u52a8\u6587\u6863\u7406\u89e3\u4ece\u5355\u7eaf\u5b9a\u4f4d\u8d70\u5411\u57fa\u4e8e\u951a\u70b9\u7684\u8bed\u4e49\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04424", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u6863\u7406\u89e3", "\u89c6\u89c9\u8bed\u8a00", "\u89c6\u89c9\u5b9a\u4f4d", "\u57fa\u51c6\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04424v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Thinking with Anchors: Grounded and Efficient Document Reasoning", "tldr": "\u672c\u6587\u63d0\u51fa ADOPD 2026\uff0c\u5c06\u6587\u6863\u9875\u9762\u4e2d\u7684\u6587\u672c\u5757\u3001\u89c6\u89c9\u5b9e\u4f53\u3001\u8bed\u4e49\u6807\u7b7e\u3001\u8fb9\u754c\u6846\u548c\u63a9\u7801\u7edf\u4e00\u4e3a\u201c\u89c6\u89c9\u951a\u70b9\u201d\uff0c\u7528\u4e8e\u533a\u57df\u8bed\u4e49\u6807\u6ce8\u3001\u89c6\u89c9\u8bed\u8a00\u5b9a\u4f4d\u548c\u53ef\u9a8c\u8bc1\u7684\u6587\u6863\u63a8\u7406\u3002\u8be5\u57fa\u51c6\u63ed\u793a\u4e86\u73b0\u6709\u6a21\u578b\u5728\u957f\u5c3e\u8bed\u4e49\u8bc6\u522b\u548c\u5bc6\u96c6\u8ba1\u6570\u7b49\u4efb\u52a1\u4e0a\u7684\u4e0d\u8db3\uff0c\u63a8\u52a8\u6587\u6863\u7406\u89e3\u4ece\u5355\u7eaf\u5b9a\u4f4d\u8d70\u5411\u57fa\u4e8e\u951a\u70b9\u7684\u8bed\u4e49\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) improve robot manipulation by learning how the environment evolves beyond the current observation. However, existing approaches face a fundamental dilemma: Joint-WAMs preserve future-aware representations during inference but incur prohibitive computation costs, while efficient alternatives remove future modeling at inference time and may lose the robustness benefits of temporal reasoning. In this work, we revisit the role of future representations in WAMs and show that inference-time future conditioning is critical for generalization under distribution shifts. This observation motivates Faster-WAM, an efficient future-conditioning WAM that preserves future representations while avoiding expensive video-action interaction. Faster-WAM introduces a sparse future-conditioning framework that computes future representations once and selectively reuses them throughout action denoising. Specifically, we propose SparseMoT to replace ubiquitous layer-wise fusion with selective video-action interaction at a compact subset of network stages, and Interval KV-Fusion to aggregate multi-depth future representations without increasing attention complexity. Experiments demonstrate that Faster-WAM achieves a substantially better performance-efficiency trade-off than existing WAMs. On the out-of-distribution LIBERO-Plus benchmark, Faster-WAM improves success rate from 49.14% to 73.57% compared with Fast-WAM, while running 2.21$\\times$ faster than Joint-WAM. It further achieves state-of-the-art performance on LIBERO and RoboTwin 2.0, while demonstrating strong robustness in real-world manipulation.", "arxiv_id": "2608.04404", "arxiv_url": "https://arxiv.org/abs/2608.04404", "authors": ["Weiheng Zhao", "Haoyi Jiang", "Xin Shi", "Liu Liu", "Fan Huang", "Zhizhong Su", "Wei Sui", "Xinggang Wang"], "brief": "\u8bba\u6587\u6307\u51fa\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5728\u63a8\u7406\u65f6\u4fdd\u7559\u672a\u6765\u8868\u5f81\u5bf9\u5206\u5e03\u5916\u6cdb\u5316\u5f88\u5173\u952e\uff0c\u4f46\u4f20\u7edf\u8054\u5408\u5efa\u6a21\u8ba1\u7b97\u5f00\u9500\u8fc7\u9ad8\u3002\u63d0\u51fa Faster-WAM\uff0c\u901a\u8fc7\u7a00\u758f\u672a\u6765\u6761\u4ef6\u3001SparseMoT \u548c Interval KV-Fusion \u590d\u7528\u672a\u6765\u8868\u5f81\uff0c\u5728\u4fdd\u6301\u9c81\u68d2\u6027\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63a8\u7406\u6210\u672c\uff1b\u5728 LIBERO-Plus \u4e0a\u6210\u529f\u7387\u4ece Fast-WAM \u7684 49.14% \u63d0\u5347\u5230 73.57%\uff0c\u4e14\u6bd4 Joint-WAM \u5feb 2.21 \u500d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04404", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u52a8\u4f5c\u6a21\u578b", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04404v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Faster-WAM: Efficient Inference-Time Future Conditioning for Robust World Action Models", "tldr": "\u8bba\u6587\u6307\u51fa\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5728\u63a8\u7406\u65f6\u4fdd\u7559\u672a\u6765\u8868\u5f81\u5bf9\u5206\u5e03\u5916\u6cdb\u5316\u5f88\u5173\u952e\uff0c\u4f46\u4f20\u7edf\u8054\u5408\u5efa\u6a21\u8ba1\u7b97\u5f00\u9500\u8fc7\u9ad8\u3002\u63d0\u51fa Faster-WAM\uff0c\u901a\u8fc7\u7a00\u758f\u672a\u6765\u6761\u4ef6\u3001SparseMoT \u548c Interval KV-Fusion \u590d\u7528\u672a\u6765\u8868\u5f81\uff0c\u5728\u4fdd\u6301\u9c81\u68d2\u6027\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63a8\u7406\u6210\u672c\uff1b\u5728 LIBERO-Plus \u4e0a\u6210\u529f\u7387\u4ece Fast-WAM \u7684 49.14% \u63d0\u5347\u5230 73.57%\uff0c\u4e14\u6bd4 Joint-WAM \u5feb 2.21 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models have driven significant progress in robotic manipulation, yet they fundamentally struggle with the vision-override phenomenon. Driven by the severe modality imbalance between dense visual streams and sparse linguistic instructions, VLAs frequently fall prey to causal confusion. Instead of treating language as the primary causal driver, the policy entirely bypasses the original instruction by overfitting to spurious visual confounders, such as prominent objects or familiar layouts. To systematically alleviate this bias, we formalize the process of action generation as a Dual-path Deconfounding Graph (DDG) and propose CofactVLA, a novel causal intervention framework. By dynamically constructing a language-masked counterfactual branch within a single forward pass, CofactVLA isolates and neutralizes visual confounders through two synergistic mechanisms. First, Action-Level Orthogonal Projection Guidance (OPG) geometrically projects the factual velocity field away from the counterfactual visual bias during continuous flow matching, extracting the pure semantic intent. Second, Feature-Level Counterfactual Covariance Reduction (CCR) mathematically deconfounds latent representations by penalizing the positive eigenspace of the covariance difference, explicitly suppressing dominant visual shortcuts while preserving the causal language intent. Extensive experiments demonstrate that CofactVLA establishes a new state-of-the-art across diverse simulation benchmarks. Beyond simulation, real-world robot experiments demonstrate the causal efficacy of our method in bridging the generalization gap, yielding a 52.3\\% absolute success rate gain under out-of-distribution scenarios.", "arxiv_id": "2608.04396", "arxiv_url": "https://arxiv.org/abs/2608.04396", "authors": ["Yan Zhang", "Yinan Wu", "Haoran Duan", "Jungong Han"], "brief": "\u8bba\u6587\u9488\u5bf9\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u4e2d\u8fc7\u5ea6\u4f9d\u8d56\u89c6\u89c9\u7ebf\u7d22\u3001\u5ffd\u89c6\u8bed\u8a00\u6307\u4ee4\u7684\u201c\u89c6\u89c9\u8986\u76d6\u201d\u95ee\u9898\uff0c\u63d0\u51fa CofactVLA \u53cd\u4e8b\u5b9e\u56e0\u679c\u5e72\u9884\u6846\u67b6\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u8bed\u8a00\u906e\u853d\u7684\u53cd\u4e8b\u5b9e\u5206\u652f\u3001\u52a8\u4f5c\u7ea7\u6b63\u4ea4\u6295\u5f71\u548c\u7279\u5f81\u7ea7\u534f\u65b9\u5dee\u7ea6\u675f\u53bb\u9664\u89c6\u89c9\u6df7\u6742\uff0c\u5728\u4eff\u771f\u4e2d\u8fbe\u5230\u65b0 SOTA\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u5206\u5e03\u5916\u573a\u666f\u4e2d\u5e26\u6765 52.3% \u7684\u7edd\u5bf9\u6210\u529f\u7387\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04396", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u56e0\u679c\u5e72\u9884", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04396v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CofactVLA: Deconfounding Vision-Language-Action Models via Counterfactual Intervention", "tldr": "\u8bba\u6587\u9488\u5bf9\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u4e2d\u8fc7\u5ea6\u4f9d\u8d56\u89c6\u89c9\u7ebf\u7d22\u3001\u5ffd\u89c6\u8bed\u8a00\u6307\u4ee4\u7684\u201c\u89c6\u89c9\u8986\u76d6\u201d\u95ee\u9898\uff0c\u63d0\u51fa CofactVLA \u53cd\u4e8b\u5b9e\u56e0\u679c\u5e72\u9884\u6846\u67b6\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u8bed\u8a00\u906e\u853d\u7684\u53cd\u4e8b\u5b9e\u5206\u652f\u3001\u52a8\u4f5c\u7ea7\u6b63\u4ea4\u6295\u5f71\u548c\u7279\u5f81\u7ea7\u534f\u65b9\u5dee\u7ea6\u675f\u53bb\u9664\u89c6\u89c9\u6df7\u6742\uff0c\u5728\u4eff\u771f\u4e2d\u8fbe\u5230\u65b0 SOTA\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u5206\u5e03\u5916\u573a\u666f\u4e2d\u5e26\u6765 52.3% \u7684\u7edd\u5bf9\u6210\u529f\u7387\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language Models (VLMs) often lose visual grounding during multi-step reasoning: as reasoning chains grow longer, later inference steps rely increasingly on language priors rather than image evidence. We identify a consistent benchmark-level signature associated with this degradation: across 2,510 re-examined samples from four benchmarks, attention entropy over image tokens typically decreases during Round 1 and rises again after image re-injection. However, we find that effective visual re-examination requires two complementary ingredients: image re-injection and targeted self-diagnosis. Without targeted diagnosis, re-examination can even hurt performance, whereas accurate self-diagnosis yields substantial gains -- a swing of several points on key benchmarks, indicating that diagnostic quality is a key factor in whether re-examination helps or hurts in our setting. We present ReGround, a two-stage framework that teaches VLMs to self-diagnose grounding failures and selectively re-examine visual evidence, without architectural modifications or external tools. Through capability bootstrapping, a stronger variant from the same model family provides diagnostic scaffolding only during data construction, while the policy model learns to diagnose autonomously at inference time and retains most of the assisted gains. Experiments on eight benchmarks across two VLM backbones demonstrate consistent gains, especially on visually intensive multi-step reasoning tasks, while incurring only modest inference overhead relative to tool-augmented baselines. Project page: https://sespoir.github.io/reground-page/ . Code: https://github.com/sespoir/ReGround .", "arxiv_id": "2608.04385", "arxiv_url": "https://arxiv.org/abs/2608.04385", "authors": ["Lei Peng", "Shuai Lv", "Wei Hu"], "brief": "\u8bba\u6587\u6307\u51fa\u591a\u6b65\u63a8\u7406\u4e2d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f1a\u9010\u6e10\u4e22\u5931\u89c6\u89c9 grounding\uff0c\u540e\u7eed\u6b65\u9aa4\u66f4\u4f9d\u8d56\u8bed\u8a00\u5148\u9a8c\u800c\u975e\u56fe\u50cf\u8bc1\u636e\u3002\u63d0\u51fa ReGround\uff0c\u901a\u8fc7\u81ea\u8bca\u65ad\u5b9a\u4f4d grounding \u5931\u8d25\u5e76\u9009\u62e9\u6027\u91cd\u65b0\u67e5\u770b\u56fe\u50cf\uff0c\u5728\u4e0d\u6539\u67b6\u6784\u3001\u4e0d\u7528\u5916\u90e8\u5de5\u5177\u7684\u60c5\u51b5\u4e0b\uff0c\u5728\u591a\u4e2a\u89c6\u89c9\u5bc6\u96c6\u578b\u591a\u6b65\u63a8\u7406\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u4e14\u63a8\u7406\u5f00\u9500\u8f83\u5c0f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04385", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u591a\u6b65\u63a8\u7406", "\u89c6\u89c9\u5b9a\u4f4d", "\u81ea\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04385v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReGround: Restoring Visual Grounding in Multi-Step Reasoning through Self-Diagnosis and Visual Re-Examination", "tldr": "\u8bba\u6587\u6307\u51fa\u591a\u6b65\u63a8\u7406\u4e2d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f1a\u9010\u6e10\u4e22\u5931\u89c6\u89c9 grounding\uff0c\u540e\u7eed\u6b65\u9aa4\u66f4\u4f9d\u8d56\u8bed\u8a00\u5148\u9a8c\u800c\u975e\u56fe\u50cf\u8bc1\u636e\u3002\u63d0\u51fa ReGround\uff0c\u901a\u8fc7\u81ea\u8bca\u65ad\u5b9a\u4f4d grounding \u5931\u8d25\u5e76\u9009\u62e9\u6027\u91cd\u65b0\u67e5\u770b\u56fe\u50cf\uff0c\u5728\u4e0d\u6539\u67b6\u6784\u3001\u4e0d\u7528\u5916\u90e8\u5de5\u5177\u7684\u60c5\u51b5\u4e0b\uff0c\u5728\u591a\u4e2a\u89c6\u89c9\u5bc6\u96c6\u578b\u591a\u6b65\u63a8\u7406\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u4e14\u63a8\u7406\u5f00\u9500\u8f83\u5c0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
