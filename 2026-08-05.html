a8\u7406\u7684\u63a2\u7d22\u4e0e\u72b9\u8c6b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We identify a previously overlooked failure mode of ALiBi positional encoding: its linear bias scaling underflows floating-point precision, which zeroes out a large fraction of attention weights and renders the affected attention heads partially blind. We analyze this failure mode, characterize its impact, and examine four mitigation strategies. We further demonstrate its occurrence in state-of-the-art pretrained models based on ALiBi. Comprehensive pretraining experiments with 148M-parameter decoder models help us to disentangle its effects from out-of-context degradation. We find that ALiBi\u0027s failure mode can substantially impair token retrieval while having only a minor effect on standard decoder benchmarks. We propose four training-time mitigation strategies and evaluate them individually and in combinations, finding that log-scaled distances yield the most consistent improvements in passkey retrieval. Despite this problem, default ALiBi slopes remain a surprisingly strong baseline, particularly for needle-in-a-haystack retrieval. Based on these findings we provide concrete recommendations on how to train models with ALiBi.", "arxiv_id": "2608.03994", "arxiv_url": "https://arxiv.org/abs/2608.03994", "authors": ["Christopher Schr\u00f6der", "Lukas Gienapp", "Ferdinand Schlatt", "Martin Potthast", "Gerhard Heyer"], "brief": "\u8bba\u6587\u63ed\u793a\u4e86 ALiBi \u4f4d\u7f6e\u7f16\u7801\u4e2d\u4e00\u4e2a\u88ab\u5ffd\u89c6\u7684\u6570\u503c\u5931\u8d25\u6a21\u5f0f\uff1a\u7ebf\u6027\u504f\u7f6e\u5728\u957f\u8ddd\u79bb\u4e0b\u8d85\u51fa\u6d6e\u70b9\u7cbe\u5ea6\u8303\u56f4\uff0c\u4f7f\u5927\u91cf\u6ce8\u610f\u529b\u6743\u91cd\u88ab\u7f6e\u96f6\uff0c\u5bfc\u81f4\u90e8\u5206\u6ce8\u610f\u529b\u5934\u201c\u5931\u660e\u201d\u3002\u4f5c\u8005\u5206\u6790\u5176\u5f71\u54cd\uff0c\u5e76\u5728 148M \u53c2\u6570\u89e3\u7801\u5668\u9884\u8bad\u7ec3\u5b9e\u9a8c\u548c\u73b0\u6709 ALiBi \u9884\u8bad\u7ec3\u6a21\u578b\u4e2d\u9a8c\u8bc1\u8be5\u73b0\u8c61\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03994", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["ALiBi \u7684\u7ebf\u6027\u8ddd\u79bb\u504f\u7f6e\u53ef\u80fd\u5bfc\u81f4\u6ce8\u610f\u529b\u6743\u91cd\u4e0b\u6ea2\u4e3a\u96f6\uff0c\u5c24\u5176\u5f71\u54cd\u957f\u4e0a\u4e0b\u6587\u4e2d\u7684 token \u68c0\u7d22\u80fd\u529b\u3002", "\u8be5\u95ee\u9898\u5bf9\u6807\u51c6\u89e3\u7801\u5668\u57fa\u51c6\u5f71\u54cd\u8f83\u5c0f\uff0c\u4f46\u4f1a\u663e\u8457\u635f\u5bb3 passkey retrieval \u7b49\u957f\u8ddd\u79bb\u4fe1\u606f\u63d0\u53d6\u4efb\u52a1\u3002", "\u8bc4\u4f30\u4e86\u56db\u79cd\u8bad\u7ec3\u671f\u7f13\u89e3\u7b56\u7565\uff0c\u53d1\u73b0\u5bf9\u8ddd\u79bb\u53d6\u5bf9\u6570\u7f29\u653e\u5728\u68c0\u7d22\u4efb\u52a1\u4e0a\u6539\u8fdb\u6700\u7a33\u5b9a\u3002"], "keywords": ["\u4f4d\u7f6e\u7f16\u7801", "\u6ce8\u610f\u529b\u673a\u5236", "\u957f\u4e0a\u4e0b\u6587", "\u6570\u503c\u7a33\u5b9a\u6027"], "num_comments": 2, "on_hf": true, "organization": "CORAL NLP Research", "pdf_url": "https://arxiv.org/pdf/2608.03994v1", "published_at": "2026-08-04", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03994.png", "title": "When Attention Goes Blind: Numerical Failure in ALiBi Positional Encodings", "tldr": "ALiBi\u4f1a\u56e0\u6d6e\u70b9\u4e0b\u6ea2\u5bfc\u81f4\u6ce8\u610f\u529b\u5934\u5931\u660e\u3002", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63ed\u793a\u4e86 ALiBi \u4f4d\u7f6e\u7f16\u7801\u4e2d\u4e00\u4e2a\u88ab\u5ffd\u89c6\u7684\u6570\u503c\u5931\u8d25\u6a21\u5f0f\uff1a\u7ebf\u6027\u504f\u7f6e\u5728\u957f\u8ddd\u79bb\u4e0b\u8d85\u51fa\u6d6e\u70b9\u7cbe\u5ea6\u8303\u56f4\uff0c\u4f7f\u5927\u91cf\u6ce8\u610f\u529b\u6743\u91cd\u88ab\u7f6e\u96f6\uff0c\u5bfc\u81f4\u90e8\u5206\u6ce8\u610f\u529b\u5934\u201c\u5931\u660e\u201d\u3002\u4f5c\u8005\u5206\u6790\u5176\u5f71\u54cd\uff0c\u5e76\u5728 148M \u53c2\u6570\u89e3\u7801\u5668\u9884\u8bad\u7ec3\u5b9e\u9a8c\u548c\u73b0\u6709 ALiBi \u9884\u8bad\u7ec3\u6a21\u578b\u4e2d\u9a8c\u8bc1\u8be5\u73b0\u8c61\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u6307\u51fa\u4e86\u4e3b\u6d41\u4f4d\u7f6e\u7f16\u7801\u65b9\u6cd5 ALiBi \u7684\u5e95\u5c42\u6570\u503c\u7a33\u5b9a\u6027\u9690\u60a3\uff0c\u5e76\u7ed9\u51fa\u5b9e\u8bc1\u5206\u6790\u4e0e\u8bad\u7ec3\u5efa\u8bae\uff0c\u5bf9\u957f\u4e0a\u4e0b\u6587\u5927\u6a21\u578b\u7684\u53ef\u9760\u6027\u548c\u67b6\u6784\u9009\u62e9\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Leading open text-to-image models often carry complementary strengths: one may lead on preference-aligned aesthetics while another follows compositional instructions more faithfully. However, differences in their autoencoders and noise schedules make it difficult to transfer these strengths across models. In this paper, we present Poly-OPD, a framework that can consolidate complementary strengths of heterogeneous teachers into a single compact flow-matching student. To bridge the incompatible latent spaces of different teachers, Poly-OPD performs on-policy distillation through a pixel bridge. Each student-generated image is re-encoded by a selected teacher\u0027s encoder and refined from a noise level matched by magnitude under the teacher\u0027s noise schedule. The resulting target is further matched to the student in frozen DINOv2 space, enabling supervision across incompatible latent spaces. To retain complementary capabilities without cross-teacher interference, Poly-OPD uses a gradient compatibility diagnostic to organize its adapters: attention LoRA modules are shared across teachers, whereas feed-forward adapters remain teacher-specific. During distillation, a gap-aware curriculum devotes more training to compositional categories where the student still falls short of the teacher. As each gap narrows, training shifts toward categories with larger remaining gaps. By distilling FLUX.1-dev and Z-Image into a 2.5B SD3.5-Medium student, Poly-OPD improves GenEval from 67.3 to 73.3, surpassing both larger teachers, and raises DrawBench HPSv3 from 9.34 to 11.35, consolidating both strengths within a switchable model.", "arxiv_id": "2608.04349", "arxiv_url": "https://arxiv.org/abs/2608.04349", "authors": ["Siming Fu", "Haojun Xu", "Ruizhe He", "Zheming Fu", "Hualiang Wang", "Jie Huang", "Xiaoxiao Ma", "Mingchen Zhong", "Weihu Huang", "Xiaoxuan He", "Linjiang Huang", "Si Liu"], "brief": "Poly-OPD \u662f\u4e00\u4e2a\u9762\u5411\u5f02\u6784\u6587\u751f\u56fe\u6559\u5e08\u6a21\u578b\u7684\u5728\u7ebf\u84b8\u998f\u6846\u67b6\uff0c\u53ef\u5c06\u4e0d\u540c\u5f00\u6e90\u6a21\u578b\u5728\u5ba1\u7f8e\u504f\u597d\u4e0e\u7ec4\u5408\u6307\u4ee4\u9075\u5faa\u4e0a\u7684\u4e92\u8865\u4f18\u52bf\u6574\u5408\u5230\u4e00\u4e2a\u66f4\u5c0f\u7684 flow-matching \u5b66\u751f\u6a21\u578b\u4e2d\uff0c\u5e76\u652f\u6301\u6309\u80fd\u529b\u5207\u6362\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04349", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u201c\u50cf\u7d20\u6865\u201d\u89e3\u51b3\u4e0d\u540c\u6559\u5e08\u6a21\u578b\u81ea\u7f16\u7801\u5668\u4e0e\u566a\u58f0\u8c03\u5ea6\u4e0d\u517c\u5bb9\u7684\u95ee\u9898\uff1a\u5b66\u751f\u751f\u6210\u56fe\u50cf\u5148\u88ab\u9009\u5b9a\u6559\u5e08\u7f16\u7801\u5668\u91cd\u7f16\u7801\uff0c\u518d\u6309\u6559\u5e08\u566a\u58f0\u65e5\u7a0b\u8fdb\u884c\u7ec6\u5316\u76d1\u7763\u3002", "\u4f7f\u7528\u51bb\u7ed3\u7684 DINOv2 \u7279\u5f81\u7a7a\u95f4\u8fdb\u884c\u76ee\u6807\u5339\u914d\uff0c\u4f7f\u8de8\u5f02\u6784\u6f5c\u7a7a\u95f4\u7684\u84b8\u998f\u76d1\u7763\u6210\u4e3a\u53ef\u80fd\u3002", "\u5f15\u5165\u68af\u5ea6\u517c\u5bb9\u6027\u8bca\u65ad\u6765\u7ec4\u7ec7\u9002\u914d\u5668\uff1a\u6ce8\u610f\u529b LoRA \u5728\u6559\u5e08\u95f4\u5171\u4eab\uff0c\u524d\u9988\u9002\u914d\u5668\u4fdd\u6301\u6559\u5e08\u4e13\u5c5e\uff0c\u5e76\u7528 gap-aware curriculum \u5c06\u8bad\u7ec3\u8d44\u6e90\u52a8\u6001\u5206\u914d\u7ed9\u5b66\u751f\u4ecd\u843d\u540e\u7684\u7c7b\u522b\u3002"], "keywords": ["\u6587\u751f\u56fe", "\u77e5\u8bc6\u84b8\u998f", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "jingdong", "pdf_url": "https://arxiv.org/pdf/2608.04349v1", "published_at": "2026-08-05", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04349.png", "title": "Poly-OPD: Heterogeneous Multi-Teacher On-Policy Distillation for Capability-Selectable Flow Models", "tldr": "\u591a\u6559\u5e08\u84b8\u998f\u8ba9\u6587\u751f\u56fe\u6a21\u578b\u80fd\u529b\u53ef\u5207\u6362", "upvotes": 1, "what_it_is": "Poly-OPD \u662f\u4e00\u4e2a\u9762\u5411\u5f02\u6784\u6587\u751f\u56fe\u6559\u5e08\u6a21\u578b\u7684\u5728\u7ebf\u84b8\u998f\u6846\u67b6\uff0c\u53ef\u5c06\u4e0d\u540c\u5f00\u6e90\u6a21\u578b\u5728\u5ba1\u7f8e\u504f\u597d\u4e0e\u7ec4\u5408\u6307\u4ee4\u9075\u5faa\u4e0a\u7684\u4e92\u8865\u4f18\u52bf\u6574\u5408\u5230\u4e00\u4e2a\u66f4\u5c0f\u7684 flow-matching \u5b66\u751f\u6a21\u578b\u4e2d\uff0c\u5e76\u652f\u6301\u6309\u80fd\u529b\u5207\u6362\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c55\u793a\u4e86\u5982\u4f55\u628a\u591a\u4e2a\u5f3a\u6587\u751f\u56fe\u6a21\u578b\u7684\u4e92\u8865\u80fd\u529b\u6574\u5408\u8fdb\u5355\u4e00\u7d27\u51d1\u6a21\u578b\uff0c\u4e14\u5728 GenEval \u548c DrawBench HPSv3 \u4e0a\u8d85\u8fc7\u539f\u6559\u5e08\u6a21\u578b\uff0c\u5177\u6709\u8f83\u9ad8\u7684\u6a21\u578b\u538b\u7f29\u3001\u80fd\u529b\u878d\u5408\u4e0e\u53ef\u63a7\u751f\u6210\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Existing deep-research agents use a Search--Visit workflow that retrieves whole webpages without considering the structure they expose through titles, headings, sections, and metadata. This prevents agents from directly constraining retrieval to parts of a webpage and often carries irrelevant content into their context. We introduce \\textsc{Sieve}, a search--inspect--fetch strategy driven by a Boolean Query Language (BQL): it searches webpage fields to filter candidates, uses an interchangeable ranker to order them, presents structure-rich result cards for inspection, and fetches only selected sections. Across three QA collections, \\textsc{Sieve} is more accurate than the strongest conventional Search--Visit configuration on each collection while using $20.7$--$50.6\\%$ fewer tokens. Boolean filtering improves every tested ranker, and the accuracy--context advantage persists across retriever choices and agent backbones. Our implementation is included in the SkimSearchAgent library at https://github.com/ielab/skim-search-agent.", "arxiv_id": "2608.02751", "arxiv_url": "https://arxiv.org/abs/2608.02751", "authors": ["Shuai Wang", "Haodong Chen", "Yu Yin", "Shengyao Zhuang", "Bevan Koopman", "Guido Zuccon"], "brief": "\u8bba\u6587\u63d0\u51fa Sieve\uff0c\u4e00\u79cd\u9762\u5411\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u7684 search--inspect--fetch \u5de5\u4f5c\u6d41\u3002\u5b83\u7528\u5e03\u5c14\u67e5\u8be2\u8bed\u8a00\u6309\u7f51\u9875\u6807\u9898\u3001\u6807\u9898\u5c42\u7ea7\u3001\u7ae0\u8282\u548c\u5143\u6570\u636e\u7b49\u5b57\u6bb5\u8fc7\u6ee4\u7ed3\u679c\uff0c\u5148\u8ba9\u667a\u80fd\u4f53\u68c0\u67e5\u7ed3\u6784\u5316\u7ed3\u679c\u5361\u7247\uff0c\u518d\u53ea\u6293\u53d6\u6240\u9700\u7ae0\u8282\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL"], "github_repo": "https://github.com/ielab/skim-search-agent", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2608.02751", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5f15\u5165 BQL\uff08Boolean Query Language\uff09\u5bf9\u7f51\u9875\u7ed3\u6784\u5b57\u6bb5\u8fdb\u884c\u7cbe\u786e\u7ea6\u675f\uff0c\u907f\u514d\u6574\u9875\u6293\u53d6\u5e26\u6765\u7684\u65e0\u5173\u4e0a\u4e0b\u6587\u6c61\u67d3\u3002", "\u652f\u6301\u53ef\u66ff\u6362\u6392\u5e8f\u5668\uff1a\u5e03\u5c14\u8fc7\u6ee4\u4e0e\u4e0d\u540c ranker\u3001retriever \u548c\u667a\u80fd\u4f53\u9aa8\u5e72\u7ec4\u5408\u65f6\u5747\u80fd\u5e26\u6765\u6536\u76ca\u3002", "\u5728\u4e09\u4e2a\u95ee\u7b54\u6570\u636e\u96c6\u4e0a\uff0c\u76f8\u6bd4\u6700\u5f3a\u4f20\u7edf Search--Visit \u914d\u7f6e\u51c6\u786e\u7387\u66f4\u9ad8\uff0c\u540c\u65f6\u51cf\u5c11 20.7%--50.6% token \u4f7f\u7528\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u7f51\u9875\u641c\u7d22", "\u95ee\u7b54"], "num_comments": 2, "on_hf": true, "organization": "The Information Engineering Lab", "pdf_url": "https://arxiv.org/pdf/2608.02751v2", "published_at": "2026-08-03", "score": 0.221, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02751.png", "title": "Search, Inspect, Fetch: Exploiting Structure-Aware Boolean Retrieval for Deep-Research Agents", "tldr": "\u7ed3\u6784\u5316\u5e03\u5c14\u68c0\u7d22\u8ba9\u6df1\u7814\u667a\u80fd\u4f53\u66f4\u51c6\u66f4\u7701", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Sieve\uff0c\u4e00\u79cd\u9762\u5411\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u7684 search--inspect--fetch \u5de5\u4f5c\u6d41\u3002\u5b83\u7528\u5e03\u5c14\u67e5\u8be2\u8bed\u8a00\u6309\u7f51\u9875\u6807\u9898\u3001\u6807\u9898\u5c42\u7ea7\u3001\u7ae0\u8282\u548c\u5143\u6570\u636e\u7b49\u5b57\u6bb5\u8fc7\u6ee4\u7ed3\u679c\uff0c\u5148\u8ba9\u667a\u80fd\u4f53\u68c0\u67e5\u7ed3\u6784\u5316\u7ed3\u679c\u5361\u7247\uff0c\u518d\u53ea\u6293\u53d6\u6240\u9700\u7ae0\u8282\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4fe1\u606f\u68c0\u7d22\u4e2d\u7684\u7ed3\u6784\u5316\u5b57\u6bb5\u7ea6\u675f\u5f15\u5165\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u5728\u63d0\u5347\u7b54\u6848\u51c6\u786e\u6027\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u4e0a\u4e0b\u6587\u6210\u672c\uff0c\u5177\u6709\u76f4\u63a5\u7684\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A common task in legal Information Retrieval (IR) is to find relevant legal sources from case-law collections. While legal practice often requires pinpoint citations (pincites) to specific case paragraphs, most existing public legal IR datasets lack paragraph-level citation annotations. Yet, publicly available datasets with such information contain data leakage in the query text and exclude paragraphs that are neither citing nor cited from the corpora, creating an unrealistic and oversimplified retrieval setting, potentially leading to inflated performance. To address these limitations, we contribute a large-scale legal IR dataset constructed from Court of Justice of the European Union (CJEU) judgments. The dataset contains: (i) masked case/paragraph queries, with removed citation information; (ii) a corpus that includes all paragraphs; and (iii) case- and paragraph-level ground-truth citations, with partial human expert validation. Our dataset supports both the development and rigorous evaluation of legal IR methods, at multiple query-document levels (case-to-case, paragraph-to-case, and paragraph-to-paragraph retrieval). Link to dataset: https://huggingface.co/datasets/theresiavr/legalpincite", "arxiv_id": "2608.03756", "arxiv_url": "https://arxiv.org/abs/2608.03756", "authors": ["Theresia Veronika Rampisela", "Henrik Palmer Olsen", "Giovanni Colavizza"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 LegalPincite\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6b27\u76df\u6cd5\u9662\u5224\u51b3\u7684\u5927\u89c4\u6a21\u6cd5\u5f8b\u4fe1\u606f\u68c0\u7d22\u6570\u636e\u96c6\u3002\u5b83\u63d0\u4f9b\u53bb\u9664\u5f15\u7528\u6cc4\u6f0f\u7684\u67e5\u8be2\u3001\u5305\u542b\u5168\u90e8\u6bb5\u843d\u7684\u8bed\u6599\uff0c\u4ee5\u53ca\u6848\u4ef6\u7ea7\u548c\u6bb5\u843d\u7ea7\u5f15\u7528\u6807\u6ce8\u3002", "categories": ["cs.IR"], "github_repo": "https://github.com/theresiavr/legalpincite", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03756", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u652f\u6301 case-to-case\u3001paragraph-to-case\u3001paragraph-to-paragraph \u4e09\u79cd\u591a\u5c42\u7ea7\u68c0\u7d22\u4efb\u52a1", "\u901a\u8fc7\u906e\u853d\u6848\u4ef6\u548c\u6bb5\u843d\u5f15\u7528\u4fe1\u606f\uff0c\u964d\u4f4e\u67e5\u8be2\u6587\u672c\u4e2d\u7684\u6570\u636e\u6cc4\u6f0f\u98ce\u9669", "\u8bed\u6599\u5305\u542b\u6240\u6709\u6bb5\u843d\uff0c\u800c\u975e\u4ec5\u4fdd\u7559\u5f15\u7528\u6216\u88ab\u5f15\u7528\u6bb5\u843d\uff0c\u66f4\u63a5\u8fd1\u771f\u5b9e\u6cd5\u5f8b\u68c0\u7d22\u573a\u666f"], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u6cd5\u5f8b\u667a\u80fd", "\u6570\u636e\u96c6", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03756v1", "published_at": "2026-08-04", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03756.png", "title": "LegalPincite: Multi-level Legal Information Retrieval Dataset", "tldr": "\u9762\u5411\u6b27\u76df\u5224\u4f8b\u7684\u591a\u5c42\u7ea7\u6cd5\u5f8b\u68c0\u7d22\u6570\u636e\u96c6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 LegalPincite\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6b27\u76df\u6cd5\u9662\u5224\u51b3\u7684\u5927\u89c4\u6a21\u6cd5\u5f8b\u4fe1\u606f\u68c0\u7d22\u6570\u636e\u96c6\u3002\u5b83\u63d0\u4f9b\u53bb\u9664\u5f15\u7528\u6cc4\u6f0f\u7684\u67e5\u8be2\u3001\u5305\u542b\u5168\u90e8\u6bb5\u843d\u7684\u8bed\u6599\uff0c\u4ee5\u53ca\u6848\u4ef6\u7ea7\u548c\u6bb5\u843d\u7ea7\u5f15\u7528\u6807\u6ce8\u3002", "why_notable": "\u8be5\u6570\u636e\u96c6\u5f25\u8865\u4e86\u516c\u5f00\u6cd5\u5f8b\u68c0\u7d22\u57fa\u51c6\u7f3a\u5c11\u6bb5\u843d\u7ea7\u7cbe\u786e\u5f15\u7528\u6807\u6ce8\u7684\u95ee\u9898\uff0c\u5e76\u6539\u8fdb\u4e86\u4ee5\u5f80\u6570\u636e\u96c6\u8fc7\u4e8e\u7b80\u5316\u3001\u53ef\u80fd\u9ad8\u4f30\u6a21\u578b\u6027\u80fd\u7684\u7f3a\u9677\uff0c\u6709\u52a9\u4e8e\u66f4\u4e25\u683c\u8bc4\u4f30\u6cd5\u5f8b\u68c0\u7d22\u65b9\u6cd5\u3002"}, {"abstract": "Self-consistency assumes the most frequent answer among sampled reasoning traces is the most reliable, but this can fail in causal reasoning: samples often repeat the same confounding error, and votes fragment across multiple valid answers, letting an invalid answer win despite a valid minority trace. We introduce CALVER (Causal Axiom-Level VERification), a training-free symbolic verifier that scores structured traces against Pearl\u0027s causal criteria, including -separation, backdoor adjustment, and intervention, and selects the highest-scoring candidate without consulting a reference answer. On CLEAR find-one-valid queries that admit multiple graph-valid answers, CALVER reaches 42.1% where plurality, a reward model, an LLM judge, and model confidence remain near 30% on identical frozen pools. Scaling the judge to 72B does not close the gap. In an audited clean-core subset, 11 of 21 graph-valid CALVER selections differ from the benchmark\u0027s listed answer while still satisfying the requested predicate. The advantage widens with the sampling budget and reproduces across ten published Bayesian networks, a second model family, and settings where the model must build the graph from text. CALVER also improves thresholded average-treatment-effect decisions against exact ground truth, generalizes to logic under a truth-table checker, and scores each candidate in milliseconds on CPU. CALVER needs only a causal structure, supplied outright or built from the text; wherever that holds, selection can aggregate via causal validity.", "arxiv_id": "2608.03506", "arxiv_url": "https://arxiv.org/abs/2608.03506", "authors": ["Omatharv Bharat Vaidya", "Connor Thomas Jerzak", "Zayne Rea Sprague", "Fangcong Yin", "Nhat Ho"], "brief": "\u8bba\u6587\u63d0\u51fa CALVER\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u7b26\u53f7\u9a8c\u8bc1\u5668\uff0c\u7528 Pearl \u56e0\u679c\u51c6\u5219\u5bf9 LLM \u751f\u6210\u7684\u7ed3\u6784\u5316\u63a8\u7406\u8f68\u8ff9\u6253\u5206\uff0c\u5728\u591a\u7b54\u6848\u6709\u6548\u7684\u56e0\u679c\u63a8\u7406\u4efb\u52a1\u4e2d\u9009\u62e9\u6700\u5177\u56e0\u679c\u6709\u6548\u6027\u7684\u5019\u9009\u7b54\u6848\u3002", "categories": ["cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03506", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u81ea\u6d3d\u6295\u7968\u5728\u56e0\u679c\u63a8\u7406\u4e2d\u7684\u5931\u6548\uff1a\u9519\u8bef\u6df7\u6742\u63a8\u7406\u4f1a\u91cd\u590d\u51fa\u73b0\uff0c\u800c\u591a\u4e2a\u6709\u6548\u7b54\u6848\u4f1a\u5206\u6563\u7968\u6570\u3002", "CALVER \u68c0\u67e5 d-separation\u3001\u540e\u95e8\u8c03\u6574\u3001\u5e72\u9884\u7b49\u56e0\u679c\u516c\u7406\uff0c\u65e0\u9700\u53c2\u8003\u6807\u51c6\u7b54\u6848\u5373\u53ef\u5bf9\u5019\u9009\u63a8\u7406\u8bc4\u5206\u3002", "\u5728 CLEAR \u591a\u6709\u6548\u7b54\u6848\u67e5\u8be2\u4e0a\u8fbe\u5230 42.1%\uff0c\u663e\u8457\u9ad8\u4e8e\u591a\u6570\u6295\u7968\u3001\u5956\u52b1\u6a21\u578b\u3001LLM judge \u548c\u7f6e\u4fe1\u5ea6\u65b9\u6cd5\u7684\u7ea6 30%\u3002"], "keywords": ["\u56e0\u679c\u63a8\u7406", "\u7b26\u53f7\u9a8c\u8bc1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u6d3d\u91c7\u6837"], "num_comments": 2, "on_hf": true, "organization": "Jerzak Labs", "pdf_url": "https://arxiv.org/pdf/2608.03506v1", "published_at": "2026-08-04", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03506.png", "title": "When Many Answers Are Valid, Voting Fails: Symbolic Verification for Best-of-K Causal Reasoning in LLMs", "tldr": "\u7528\u56e0\u679c\u516c\u7406\u9a8c\u8bc1\u66ff\u4ee3\u6295\u7968\u9009\u62e9\u63a8\u7406\u7b54\u6848", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa CALVER\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u7b26\u53f7\u9a8c\u8bc1\u5668\uff0c\u7528 Pearl \u56e0\u679c\u51c6\u5219\u5bf9 LLM \u751f\u6210\u7684\u7ed3\u6784\u5316\u63a8\u7406\u8f68\u8ff9\u6253\u5206\uff0c\u5728\u591a\u7b54\u6848\u6709\u6548\u7684\u56e0\u679c\u63a8\u7406\u4efb\u52a1\u4e2d\u9009\u62e9\u6700\u5177\u56e0\u679c\u6709\u6548\u6027\u7684\u5019\u9009\u7b54\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u201c\u591a\u6570\u7b54\u6848\u66f4\u53ef\u9760\u201d\u7684\u5047\u8bbe\u5728\u591a\u89e3\u56e0\u679c\u63a8\u7406\u4e2d\u5e76\u4e0d\u7a33\u5065\uff0c\u5e76\u5c55\u793a\u7b26\u53f7\u56e0\u679c\u9a8c\u8bc1\u53ef\u4f5c\u4e3a\u8f7b\u91cf\u3001\u53ef\u89e3\u91ca\u3001\u53ef\u6269\u5c55\u7684\u7b54\u6848\u9009\u62e9\u673a\u5236\uff0c\u5bf9\u63d0\u5347 LLM \u590d\u6742\u63a8\u7406\u53ef\u9760\u6027\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "We introduce NOLLI, a procedurally generated English-Korean puzzle benchmark designed to diagnose where Korean performance gaps arise. It comprises 15 puzzle types (25 tasks; 7,500 items), with every instance seed-regenerable, verified to have a unique solution, and scored deterministically. Rather than equating harder with bigger, we calibrate difficulty behaviorally, tuning each generator until a fixed reference model lands in target accuracy bands. Its three-level design combines matched direct translations, script adaptations over Hangul jamo (sub-syllabic letters), and Korean-only tasks grounded in Korean culture or orthography. We evaluate 15 frontier, open-weight, and Korean-developed models; among the 12 above a 3% overall-accuracy floor, matched English-Korean accuracy is statistically equivalent within a +/- 10 pp margin (TOST), suggesting little cost from presentation language alone. Writing-system-intensive tasks show sharper gaps: Korean Cipher falls behind English by up to 68.7 pp, whereas Cryptarithmetic over the same jamo shows no systematic penalty, and Jamo Composition accuracy predicts Korean Cipher accuracy. These contrasts are diagnostic rather than causal, consistent with difficulty in multi-step sub-syllabic execution. Korean-only tasks separate rule-application deficits, which vary in sign, from a Kinship deficit positive in all 12. Finally, a salient size measure fails to grow from Easy to Hard in 7 of 15 types, making structural size an unreliable proxy for empirical difficulty.", "arxiv_id": "2608.04397", "arxiv_url": "https://arxiv.org/abs/2608.04397", "authors": ["Dasol Choi", "Joonyong Park", "Daegon Yu", "Soo Yong Kim", "Youngsook Song", "Seunghyeok Hong"], "brief": "\u8bba\u6587\u63d0\u51faNOLLI\uff0c\u4e00\u4e2a\u7a0b\u5e8f\u751f\u6210\u7684\u82f1\u97e9\u53cc\u8bed\u8c1c\u9898\u57fa\u51c6\uff0c\u7528\u4e8e\u5b9a\u4f4d\u5927\u6a21\u578b\u5728\u97e9\u8bed\u4efb\u52a1\u4e0a\u7684\u6027\u80fd\u5dee\u8ddd\u3002\u5b83\u5305\u542b15\u7c7b\u8c1c\u9898\u300125\u4e2a\u4efb\u52a1\u30017500\u9053\u9898\uff0c\u5e76\u901a\u8fc7\u884c\u4e3a\u6821\u51c6\u786e\u4fdd\u96be\u5ea6\u5206\u7ea7\u53ef\u9760\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/HAE-RAE/NOLLI", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04397", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u5305\u542b\u76f4\u8bd1\u5339\u914d\u4efb\u52a1\u3001\u97e9\u6587\u5b57\u6bcdjamo\u4e66\u5199\u7cfb\u7edf\u9002\u914d\u4efb\u52a1\uff0c\u4ee5\u53ca\u57fa\u4e8e\u97e9\u56fd\u6587\u5316\u6216\u6b63\u5b57\u6cd5\u7684\u97e9\u8bed\u4e13\u5c5e\u4efb\u52a1", "\u8bc4\u6d4b15\u4e2a\u524d\u6cbf\u3001\u5f00\u6e90\u548c\u97e9\u56fd\u672c\u571f\u6a21\u578b\u540e\u53d1\u73b0\uff0c\u5355\u7eaf\u5448\u73b0\u8bed\u8a00\u4e3a\u97e9\u8bed\u5e76\u4e0d\u4f1a\u663e\u8457\u964d\u4f4e\u8868\u73b0", "\u4e66\u5199\u7cfb\u7edf\u5bc6\u96c6\u4efb\u52a1\u5dee\u8ddd\u660e\u663e\uff1aKorean Cipher\u6700\u591a\u843d\u540e\u82f1\u658768.7\u4e2a\u767e\u5206\u70b9\uff0c\u4e14jamo\u7ec4\u5408\u80fd\u529b\u53ef\u9884\u6d4b\u8be5\u4efb\u52a1\u8868\u73b0"], "keywords": ["\u591a\u8bed\u8a00", "\u57fa\u51c6\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u97e9\u8bed"], "num_comments": 1, "on_hf": true, "organization": "HAE-RAE", "pdf_url": "https://arxiv.org/pdf/2608.04397v1", "published_at": "2026-08-05", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04397.png", "title": "NOLLI: A Difficulty-Calibrated Puzzle Benchmark for Diagnosing the English-Korean Performance Gap", "tldr": "NOLLI\u8bca\u65ad\u82f1\u97e9\u6a21\u578b\u80fd\u529b\u5dee\u8ddd\u6765\u6e90", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51faNOLLI\uff0c\u4e00\u4e2a\u7a0b\u5e8f\u751f\u6210\u7684\u82f1\u97e9\u53cc\u8bed\u8c1c\u9898\u57fa\u51c6\uff0c\u7528\u4e8e\u5b9a\u4f4d\u5927\u6a21\u578b\u5728\u97e9\u8bed\u4efb\u52a1\u4e0a\u7684\u6027\u80fd\u5dee\u8ddd\u3002\u5b83\u5305\u542b15\u7c7b\u8c1c\u9898\u300125\u4e2a\u4efb\u52a1\u30017500\u9053\u9898\uff0c\u5e76\u901a\u8fc7\u884c\u4e3a\u6821\u51c6\u786e\u4fdd\u96be\u5ea6\u5206\u7ea7\u53ef\u9760\u3002", "why_notable": "\u8be5\u7814\u7a76\u628a\u201c\u97e9\u8bed\u6027\u80fd\u5dee\u201d\u62c6\u89e3\u4e3a\u8bed\u8a00\u5448\u73b0\u3001\u4e66\u5199\u7cfb\u7edf\u3001\u591a\u6b65\u5b50\u97f3\u8282\u64cd\u4f5c\u3001\u6587\u5316\u77e5\u8bc6\u7b49\u56e0\u7d20\uff0c\u4e3a\u591a\u8bed\u8a00\u5927\u6a21\u578b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u53ef\u8bca\u65ad\u3001\u53ef\u590d\u73b0\u7684\u57fa\u51c6\u8bbe\u8ba1\u601d\u8def\u3002"}, {"abstract": "The abundance of casually captured monocular videos and images on social media provides a valuable source for immersive content creation, where generating novel views from such sparse observations can greatly enhance user experiences. However, producing photorealistic and geometrically consistent views with precise camera control remains challenging when input coverage is extremely limited. Reconstruction-based approaches such as NeRF and 3D Gaussian Splatting (3DGS) deteriorate severely under sparse inputs and fail to explicitly handle occlusions. Generative methods ease data requirements but still struggle with large-baseline view synthesis due to inaccurate or implicit geometric guidance. To overcome these limitations, we introduce UniWorld-View, a unified framework for controllable large-baseline novel view synthesis from monocular inputs. UniWorld-View integrates explicit 3D guidance with generative diffusion modeling to enable precise camera control and geometrically consistent view generation. The geometric guidance is obtained through an occlusion-aware point cloud rendering strategy that resolves visibility ambiguities and provides accurate priors for diffusion-based synthesis. By coupling this rendering strategy with powerful video diffusion backbones, UniWorld-View achieves high-fidelity novel view generation even under extreme camera motions and wide-baseline changes, and can further provide multi-view videos for downstream dynamic 3DGS reconstruction. Experiments on the WorldScore benchmark and zero-shot NVS benchmarks demonstrate the effectiveness of UniWorld-View in controllability, geometric consistency, and visual fidelity.", "arxiv_id": "2608.04701", "arxiv_url": "https://arxiv.org/abs/2608.04701", "authors": ["Haiyang Zhou", "Wangbo Yu", "Chaoran Feng", "Xunyu Zhou", "Yonghong Tian", "Li Yuan"], "brief": "UniWorld-View \u662f\u4e00\u4e2a\u9762\u5411\u5355\u76ee\u7a00\u758f\u8f93\u5165\u7684\u5927\u57fa\u7ebf\u65b0\u89c6\u89d2\u5408\u6210\u6846\u67b6\uff0c\u5c06\u663e\u5f0f3D\u51e0\u4f55\u5f15\u5bfc\u4e0e\u89c6\u9891\u6269\u6563\u6a21\u578b\u7ed3\u5408\uff0c\u5b9e\u73b0\u7cbe\u786e\u76f8\u673a\u63a7\u5236\u548c\u51e0\u4f55\u4e00\u81f4\u7684\u9ad8\u4fdd\u771f\u89c6\u56fe\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/PKU-YuanGroup/UniWorld-View", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04701", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u906e\u6321\u611f\u77e5\u70b9\u4e91\u6e32\u67d3\u7b56\u7565\uff0c\u663e\u5f0f\u5904\u7406\u53ef\u89c1\u6027\u6b67\u4e49\uff0c\u4e3a\u6269\u6563\u751f\u6210\u63d0\u4f9b\u66f4\u51c6\u786e\u7684\u51e0\u4f55\u5148\u9a8c", "\u7ed3\u5408\u5f3a\u89c6\u9891\u6269\u6563\u9aa8\u5e72\uff0c\u5728\u6781\u7aef\u76f8\u673a\u8fd0\u52a8\u548c\u5bbd\u57fa\u7ebf\u53d8\u5316\u4e0b\u4ecd\u80fd\u751f\u6210\u903c\u771f\u4e14\u4e00\u81f4\u7684\u65b0\u89c6\u89d2", "\u751f\u6210\u7684\u591a\u89c6\u89d2\u89c6\u9891\u53ef\u7528\u4e8e\u4e0b\u6e38\u52a8\u60013D Gaussian Splatting \u91cd\u5efa\uff0c\u5e76\u5728 WorldScore \u4e0e\u96f6\u6837\u672c NVS \u57fa\u51c6\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027"], "keywords": ["\u65b0\u89c6\u89d2\u5408\u6210", "\u89c6\u9891\u6269\u6563", "\u4e09\u7ef4\u91cd\u5efa", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04701v1", "published_at": "2026-08-05", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04701.png", "title": "UniWorld-View: Large-Baseline View Synthesis via Video Diffusion Models", "tldr": "\u7528\u89c6\u9891\u6269\u6563\u5b9e\u73b0\u5927\u57fa\u7ebf\u53ef\u63a7\u65b0\u89c6\u89d2\u5408\u6210", "upvotes": 1, "what_it_is": "UniWorld-View \u662f\u4e00\u4e2a\u9762\u5411\u5355\u76ee\u7a00\u758f\u8f93\u5165\u7684\u5927\u57fa\u7ebf\u65b0\u89c6\u89d2\u5408\u6210\u6846\u67b6\uff0c\u5c06\u663e\u5f0f3D\u51e0\u4f55\u5f15\u5bfc\u4e0e\u89c6\u9891\u6269\u6563\u6a21\u578b\u7ed3\u5408\uff0c\u5b9e\u73b0\u7cbe\u786e\u76f8\u673a\u63a7\u5236\u548c\u51e0\u4f55\u4e00\u81f4\u7684\u9ad8\u4fdd\u771f\u89c6\u56fe\u751f\u6210\u3002", "why_notable": "\u5b83\u9488\u5bf9\u7a00\u758f\u5355\u76ee\u8f93\u5165\u4e0b NeRF/3DGS \u6613\u9000\u5316\u3001\u751f\u6210\u5f0f\u65b9\u6cd5\u51e0\u4f55\u63a7\u5236\u4e0d\u8db3\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u663e\u5f0f\u51e0\u4f55\u4e0e\u89c6\u9891\u6269\u6563\u7ed3\u5408\u7684\u5b9e\u7528\u65b9\u6848\uff0c\u5bf9\u6c89\u6d78\u5f0f\u5185\u5bb9\u751f\u6210\u548c\u52a8\u60013D\u91cd\u5efa\u5177\u6709\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) has become a standard paradigm for post-training large language models (LLMs). While Group Relative Policy Optimization (GRPO) is widely adopted, it suffers from sparse reward signals and loses gradients entirely when all responses within a group receive identical rewards. On-policy distillation (OPD) offers a natural remedy by providing dense, token-level supervision from a teacher model. However, naively combining GRPO with OPD leads to degraded performance, due to three underlying causes: not all samples benefit from distillation; fitting too quickly to the teacher undermines the exploratory capacity of RL; and OPD\u0027s advantages are asymmetric, suppressing most tokens. To address these challenges, we propose RSTG (Recovering Learning Signals via Adaptive Teacher Guidance), which applies distillation selectively and precisely where it matters most. At the sample level, OPD is restricted to negative zero-variance prompts with each sample weighted by the teacher\u0027s confidence score. At the token level, distillation targets only tokens with high student entropy or large teacher-student divergence. We further augment training with SFT on correct trajectories generated by the teacher model, injecting positive gradient signals where RL yields none. Experiments demonstrate that RSTG substantially outperforms naive GRPO+OPD by +4.02% on math and +3.05% on code.", "arxiv_id": "2608.00782", "arxiv_url": "https://arxiv.org/abs/2608.00782", "authors": ["Zhuowen Han", "Jinwei Xiao", "Zhengxi Lu", "Renren Jin", "Zhiyuan Yao", "Yuxin Liu", "Hongyan Hao", "Yueqing Sun", "Yu Yang", "Qi GU", "Xunliang Cai", "Deyi Xiong"], "brief": "\u8bba\u6587\u63d0\u51fa RSTG\uff0c\u7528\u81ea\u9002\u5e94\u6559\u5e08\u6307\u5bfc\u6539\u8fdb RLVR \u4e2d\u7684 GRPO \u8bad\u7ec3\u3002\u5b83\u53ea\u5728\u8d1f\u5411\u96f6\u65b9\u5dee\u6837\u672c\u548c\u9ad8\u4ef7\u503c token \u4e0a\u8fdb\u884c\u84b8\u998f\uff0c\u5e76\u7ed3\u5408\u6559\u5e08\u751f\u6210\u6b63\u786e\u8f68\u8ff9\u7684 SFT\uff0c\u6062\u590d\u539f\u672c\u7f3a\u5931\u7684\u68af\u5ea6\u4fe1\u53f7\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00782", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9 GRPO \u5728\u7ec4\u5185\u5956\u52b1\u5168\u76f8\u540c\u65f6\u68af\u5ea6\u6d88\u5931\u3001\u5956\u52b1\u7a00\u758f\u7684\u95ee\u9898\uff0c\u5f15\u5165\u6309\u9700 on-policy distillation\u3002", "\u6837\u672c\u5c42\u9762\u4ec5\u5bf9\u8d1f\u5411\u96f6\u65b9\u5dee prompts \u84b8\u998f\uff0c\u5e76\u6309\u6559\u5e08\u7f6e\u4fe1\u5ea6\u52a0\u6743\uff0c\u907f\u514d\u76f2\u76ee\u6a21\u4eff\u6559\u5e08\u524a\u5f31\u63a2\u7d22\u3002", "token \u5c42\u9762\u53ea\u7ea6\u675f\u5b66\u751f\u9ad8\u71b5\u6216\u5e08\u751f\u5206\u6b67\u5927\u7684 token\uff0c\u5e76\u7528\u6559\u5e08\u6b63\u786e\u8f68\u8ff9 SFT \u6ce8\u5165\u6b63\u5411\u5b66\u4e60\u4fe1\u53f7\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00782v1", "published_at": "2026-08-01", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00782.png", "title": "Distill Where You Fail: Recovering Learning Signals of Negative RL-Groups from Adaptive Teacher Guidance", "tldr": "\u81ea\u9002\u5e94\u6559\u5e08\u84b8\u998f\u8865\u56deRL\u7a00\u758f\u5b66\u4e60\u4fe1\u53f7", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa RSTG\uff0c\u7528\u81ea\u9002\u5e94\u6559\u5e08\u6307\u5bfc\u6539\u8fdb RLVR \u4e2d\u7684 GRPO \u8bad\u7ec3\u3002\u5b83\u53ea\u5728\u8d1f\u5411\u96f6\u65b9\u5dee\u6837\u672c\u548c\u9ad8\u4ef7\u503c token \u4e0a\u8fdb\u884c\u84b8\u998f\uff0c\u5e76\u7ed3\u5408\u6559\u5e08\u751f\u6210\u6b63\u786e\u8f68\u8ff9\u7684 SFT\uff0c\u6062\u590d\u539f\u672c\u7f3a\u5931\u7684\u68af\u5ea6\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u6307\u51fa\u5e76\u4fee\u6b63\u4e86 GRPO \u4e0e\u6734\u7d20\u84b8\u998f\u7ed3\u5408\u4f1a\u9000\u5316\u7684\u5173\u952e\u539f\u56e0\uff0c\u5728\u6570\u5b66\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u5206\u522b\u8f83\u6734\u7d20 GRPO+OPD \u63d0\u5347 4.02% \u548c 3.05%\uff0c\u5bf9\u63d0\u5347 LLM \u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7a33\u5b9a\u6027\u4e0e\u6548\u7387\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "On-Policy Self-Distillation (OPSD) has become a standard post-training approach for improving visual reasoning in multimodal large language models (MLLMs). Existing methods draw privileged information from diverse input sources to guide self-distillation. Yet these designs overlook Modality Imbalance, a challenge inherent to MLLM reasoning. When textual information dominates generation, the model cannot fully integrate its multimodal input. Consequently, carefully designed privileged information remains underused, limiting the effectiveness of OPSD. To examine this limitation, we construct a Positive Teacher with the Zoom-In Image and a Negative Teacher with the Mask Image, which exhibit different degrees of Modality Imbalance. Changes in their reasoning correctness and token logits reveal that Modality Balance can itself serve as privileged information. Motivated by this finding, we introduce OPD-V, a visual OPSD paradigm that instantiates such information through the Positive Teacher and Negative Teacher. Positive Modality-Balance Logits Margins define a Modality-Balance Trust Region that selects the on-policy tokens used for self-distillation. Experiments across 6 benchmarks, 4 MLLM backbones, and 5 post-training methods show that OPD-V consistently improves reasoning performance while reducing training cost.", "arxiv_id": "2608.05131", "arxiv_url": "https://arxiv.org/abs/2608.05131", "authors": ["Aniri", "Jinhe Bi", "Peng Liao", "Zengjie Jin", "Volker Tresp", "Fei Shen", "Yunpu Ma", "Tat-Seng Chua"], "brief": "\u8bba\u6587\u6307\u51fa\u591a\u6a21\u6001\u5927\u6a21\u578b\u89c6\u89c9\u63a8\u7406\u4e2d\u7684 on-policy \u81ea\u84b8\u998f\u5e38\u53d7\u201c\u6587\u672c\u4e3b\u5bfc\u201d\u7684\u6a21\u6001\u4e0d\u5e73\u8861\u9650\u5236\u3002\u4f5c\u8005\u63d0\u51fa OPD-V\uff0c\u901a\u8fc7\u6b63/\u8d1f\u6559\u5e08\u6784\u9020\u6a21\u6001\u5e73\u8861\u4fe1\u53f7\uff0c\u5e76\u7528\u5176\u7b5b\u9009\u53ef\u4fe1 token \u8fdb\u884c\u81ea\u84b8\u998f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05131", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa Zoom-In Image \u6b63\u6559\u5e08\u4e0e Mask Image \u8d1f\u6559\u5e08\uff0c\u7528\u4e8e\u63ed\u793a\u4e0d\u540c\u7a0b\u5ea6\u7684\u6a21\u6001\u4e0d\u5e73\u8861\u5bf9\u63a8\u7406\u6b63\u786e\u6027\u548c logits \u7684\u5f71\u54cd", "\u63d0\u51fa Positive Modality-Balance Logits Margins\uff0c\u5e76\u5b9a\u4e49 Modality-Balance Trust Region \u6765\u9009\u62e9\u7528\u4e8e\u81ea\u84b8\u998f\u7684 on-policy token", "\u5728 6 \u4e2a\u57fa\u51c6\u30014 \u4e2a MLLM backbone \u548c 5 \u79cd\u540e\u8bad\u7ec3\u65b9\u6cd5\u4e0a\u9a8c\u8bc1\uff0c\u6301\u7eed\u63d0\u5347\u89c6\u89c9\u63a8\u7406\u6027\u80fd\u5e76\u964d\u4f4e\u8bad\u7ec3\u6210\u672c"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u63a8\u7406", "\u81ea\u84b8\u998f", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05131v1", "published_at": "2026-08-05", "score": 0.193, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05131.png", "title": "OPD-V: Visual On-Policy Self-Distillation with Modality Balance", "tldr": "\u7528\u6a21\u6001\u5e73\u8861\u6539\u8fdb\u89c6\u89c9\u81ea\u84b8\u998f", "upvotes": 1, "what_it_is": "\u8bba\u6587\u6307\u51fa\u591a\u6a21\u6001\u5927\u6a21\u578b\u89c6\u89c9\u63a8\u7406\u4e2d\u7684 on-policy \u81ea\u84b8\u998f\u5e38\u53d7\u201c\u6587\u672c\u4e3b\u5bfc\u201d\u7684\u6a21\u6001\u4e0d\u5e73\u8861\u9650\u5236\u3002\u4f5c\u8005\u63d0\u51fa OPD-V\uff0c\u901a\u8fc7\u6b63/\u8d1f\u6559\u5e08\u6784\u9020\u6a21\u6001\u5e73\u8861\u4fe1\u53f7\uff0c\u5e76\u7528\u5176\u7b5b\u9009\u53ef\u4fe1 token \u8fdb\u884c\u81ea\u84b8\u998f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u201c\u6a21\u6001\u5e73\u8861\u201d\u672c\u8eab\u4f5c\u4e3a\u7279\u6743\u4fe1\u606f\u7528\u4e8e\u89c6\u89c9\u81ea\u84b8\u998f\uff0c\u9488\u5bf9 MLLM \u89c6\u89c9\u63a8\u7406\u4e2d\u5e38\u89c1\u7684\u6587\u672c\u504f\u7f6e\u95ee\u9898\u7ed9\u51fa\u901a\u7528\u6539\u8fdb\u65b9\u6848\uff0c\u5177\u6709\u8f83\u597d\u7684\u53ef\u8fc1\u79fb\u6027\u548c\u8bad\u7ec3\u6548\u7387\u4ef7\u503c\u3002"}, {"abstract": "Context lengths of language models (LMs) have dramatically increased, driven by the demands for in-context learning, self-improvement, and long-horizon agentic workflows. Existing long-context corpora, however, are dominated by books, academic articles, and code repositories, which are finite resources and often scarce in long-distance dependencies. In this work, we introduce OctoLong, a context engineering pipeline that instruments an AST parser, a language server backend, and a package manager to facilitate the recursive retrieval of code references, enabling the curation of dependency-rich code contexts of millions of tokens in length. We then train OctoLong-Instruct, a suite of capable long-context open LMs, derived from base models ranging in size from 600M to 14B parameters, via context-extension mid-training on a ~50B-token mixture containing ~6.2B tokens of OctoLong code contexts, followed by ~10B tokens of instruction tuning. Our training ablations and experimental evaluations against 18 state-of-the-art open-weight long-context LMs show that supplanting just 12% of traditional context-extension corpora with OctoLong data yields substantial gains in long-range retrieval, long-term state tracking, repository-level code understanding, and downstream agentic tasks, while also enhancing API usage in short-context coding scenarios.", "arxiv_id": "2608.05141", "arxiv_url": "https://arxiv.org/abs/2608.05141", "authors": ["Indraneil Paul", "Falko Helm", "Goran Glava\u0161", "Iryna Gurevych"], "brief": "\u672c\u6587\u63d0\u51fa OctoLong\uff0c\u4e00\u4e2a\u5229\u7528 AST \u89e3\u6790\u5668\u3001\u8bed\u8a00\u670d\u52a1\u5668\u548c\u5305\u7ba1\u7406\u5668\u9012\u5f52\u68c0\u7d22\u4ee3\u7801\u5f15\u7528\u7684\u4e0a\u4e0b\u6587\u6784\u5efa\u6d41\u6c34\u7ebf\uff0c\u53ef\u751f\u6210\u767e\u4e07 token \u7ea7\u3001\u4f9d\u8d56\u5173\u7cfb\u4e30\u5bcc\u7684\u8de8\u4ed3\u5e93\u4ee3\u7801\u8bed\u6599\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u8fdb\u884c\u957f\u4e0a\u4e0b\u6587\u4e2d\u8bad\u7ec3\u540e\uff0cOctoLong-Instruct \u5728\u957f\u7a0b\u68c0\u7d22\u3001\u72b6\u6001\u8ddf\u8e2a\u3001\u4ed3\u5e93\u7ea7\u4ee3\u7801\u7406\u89e3\u548c\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u591a\u79cd\u5f00\u6e90\u957f\u4e0a\u4e0b\u6587\u6a21\u578b\u3002", "categories": ["cs.AI", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05141", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u4ee3\u7801\u6a21\u578b", "\u4e2d\u8bad\u7ec3", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05141v1", "published_at": "2026-08-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "OctoLong: Mid-Training On Cross-Repository Code Contexts Enhances Long-Context Modeling", "tldr": "\u672c\u6587\u63d0\u51fa OctoLong\uff0c\u4e00\u4e2a\u5229\u7528 AST \u89e3\u6790\u5668\u3001\u8bed\u8a00\u670d\u52a1\u5668\u548c\u5305\u7ba1\u7406\u5668\u9012\u5f52\u68c0\u7d22\u4ee3\u7801\u5f15\u7528\u7684\u4e0a\u4e0b\u6587\u6784\u5efa\u6d41\u6c34\u7ebf\uff0c\u53ef\u751f\u6210\u767e\u4e07 token \u7ea7\u3001\u4f9d\u8d56\u5173\u7cfb\u4e30\u5bcc\u7684\u8de8\u4ed3\u5e93\u4ee3\u7801\u8bed\u6599\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u8fdb\u884c\u957f\u4e0a\u4e0b\u6587\u4e2d\u8bad\u7ec3\u540e\uff0cOctoLong-Instruct \u5728\u957f\u7a0b\u68c0\u7d22\u3001\u72b6\u6001\u8ddf\u8e2a\u3001\u4ed3\u5e93\u7ea7\u4ee3\u7801\u7406\u89e3\u548c\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u591a\u79cd\u5f00\u6e90\u957f\u4e0a\u4e0b\u6587\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse matrix kernels are fundamental to scientific computing, graph analytics, and machine learning. Their GPU performance depends strongly on the input sparsity pattern and execution strategy. For the same SpMM on the same matrix, cuSPARSE exhibits a 350x performance gap between CSR and Blocked-ELL. Our study of multiple data formats, specialized systems, and sparse compilers shows that no single implementation consistently dominates across sparsity patterns and operators. This motivates a system that can adapt its representation, execution strategy, and hardware mapping to each workload and target GPU. We present SparseDitto, an LLM-based system that constructs a GPU kernel for each matrix, operator, and target GPU. SparseDitto supports SpMV, SpMM, and SpGEMM within a unified design framework. A lightweight additive model ranks established strategies using structural features of the input matrix. An architecture-aware planner then proposes several candidate designs. Coding and verification agents implement and refine them using measurements from the target GPU. Across three sparse operators and a diverse set of matrices, SparseDitto achieves a geometric-mean speedup of 2.68x over cuSPARSE on an NVIDIA RTX PRO 6000 GPU, with a maximum of 146.61x. On an NVIDIA H200 GPU, it achieves 2.79x, with a maximum of 78.5x. Its generated SpMM kernels also accelerate full-batch GCN training by up to 3.39x.", "arxiv_id": "2608.05033", "arxiv_url": "https://arxiv.org/abs/2608.05033", "authors": ["Shiyang Li", "Guangyan Sun", "Jinwei Tang", "Yanzhi Wang", "Mingyi Hong", "Caiwen Ding"], "brief": "SparseDitto \u662f\u4e00\u4e2a\u57fa\u4e8e\u5927\u6a21\u578b\u667a\u80fd\u4f53\u7684\u7cfb\u7edf\uff0c\u4f1a\u9488\u5bf9\u5177\u4f53\u7a00\u758f\u77e9\u9635\u3001\u7b97\u5b50\u548c\u76ee\u6807 GPU \u81ea\u52a8\u9009\u62e9\u8868\u793a\u3001\u6267\u884c\u7b56\u7565\u5e76\u751f\u6210\u5b9a\u5236\u6838\u51fd\u6570\u3002\u5b83\u5728 SpMV\u3001SpMM\u3001SpGEMM \u4e0a\u76f8\u8f83 cuSPARSE \u83b7\u5f97\u7ea6 2.7 \u500d\u51e0\u4f55\u5e73\u5747\u52a0\u901f\uff0c\u6700\u9ad8\u53ef\u8fbe 146.61 \u500d\uff0c\u5e76\u80fd\u52a0\u901f GCN \u8bad\u7ec3\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05033", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GPU\u5185\u6838", "\u7a00\u758f\u8ba1\u7b97", "\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05033v1", "published_at": "2026-08-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SparseDitto: Customizing GPU Kernels for Different Sparsity Patterns with LLM-Based Agentic System", "tldr": "SparseDitto \u662f\u4e00\u4e2a\u57fa\u4e8e\u5927\u6a21\u578b\u667a\u80fd\u4f53\u7684\u7cfb\u7edf\uff0c\u4f1a\u9488\u5bf9\u5177\u4f53\u7a00\u758f\u77e9\u9635\u3001\u7b97\u5b50\u548c\u76ee\u6807 GPU \u81ea\u52a8\u9009\u62e9\u8868\u793a\u3001\u6267\u884c\u7b56\u7565\u5e76\u751f\u6210\u5b9a\u5236\u6838\u51fd\u6570\u3002\u5b83\u5728 SpMV\u3001SpMM\u3001SpGEMM \u4e0a\u76f8\u8f83 cuSPARSE \u83b7\u5f97\u7ea6 2.7 \u500d\u51e0\u4f55\u5e73\u5747\u52a0\u901f\uff0c\u6700\u9ad8\u53ef\u8fbe 146.61 \u500d\uff0c\u5e76\u80fd\u52a0\u901f GCN \u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "CheMLFlow is an open-source platform for building and executing end-to-end, high-throughput, and agentic workflows for scientific and technological applications. CheMLFlow targets a common bottleneck in scientific machine learning development, where researchers often need to assemble data acquisition, curation, representation, model training, validation, screening, interpretation, and reporting into a reproducible pipeline, even when their primary research contribution concerns only one stage. CheMLFlow provides modular workflow components, ready-to-run reference pipelines, standardized artifacts, and evaluation outputs that reduce orchestration overhead and support benchmarking across methods and datasets. The platform is designed to be extensible, reproducible, and automation friendly, with pluggable representations and models, deterministic splits, explicit run artifacts, batch execution, and report generation. As scientific software increasingly moves toward agent assisted experimentation, CheMLFlow\u0027s configuration driven workflows and structured outputs also provide a practical interface for coding agents to help users construct experiments, inspect results, and summarize findings under human supervision. This article describes the system architecture, core workflows, and benchmarks that reach literature performance for quantum mechanical, physicochemical and bioactivity property prediction, and use cases involving time series datasets demonstrating applications beyond molecular chemistry datasets.", "arxiv_id": "2608.04942", "arxiv_url": "https://arxiv.org/abs/2608.04942", "authors": ["Brendan Smith", "Susana Lopez-Moreno", "Eric Dolores-Cuenca", "Sangil Kim", "Jose L. Mendoza-Cortes", "Nijamudheen Abdulrahiman"], "brief": "CheMLFlow \u662f\u4e00\u4e2a\u9762\u5411\u5316\u5b66\u4fe1\u606f\u5b66\u4e0e\u6750\u6599\u4fe1\u606f\u5b66\u7684\u5f00\u6e90\u5e73\u53f0\uff0c\u7528\u4e8e\u6784\u5efa\u53ef\u590d\u73b0\u7684\u7aef\u5230\u7aef\u9ad8\u901a\u91cf\u5de5\u4f5c\u6d41\uff0c\u8986\u76d6\u6570\u636e\u83b7\u53d6\u3001\u7279\u5f81\u8868\u793a\u3001\u6a21\u578b\u8bad\u7ec3\u3001\u9a8c\u8bc1\u3001\u7b5b\u9009\u3001\u89e3\u91ca\u4e0e\u62a5\u544a\u751f\u6210\u3002\u5176\u6a21\u5757\u5316\u7ec4\u4ef6\u548c\u6807\u51c6\u5316\u8f93\u51fa\u964d\u4f4e\u4e86\u6d41\u7a0b\u7f16\u6392\u6210\u672c\uff0c\u5e76\u5728\u91cf\u5b50\u529b\u5b66\u3001\u7406\u5316\u6027\u8d28\u3001\u751f\u7269\u6d3b\u6027\u9884\u6d4b\u7b49\u57fa\u51c6\u4e0a\u8fbe\u5230\u6587\u732e\u7ea7\u6027\u80fd\uff0c\u540c\u65f6\u652f\u6301\u667a\u80fd\u4f53\u8f85\u52a9\u5b9e\u9a8c\u3002", "categories": ["cs.LG", "cond-mat.mtrl-sci", "cond-mat.other", "cs.AI", "physics.chem-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04942", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u5b66\u673a\u5668\u5b66\u4e60", "\u5316\u5b66\u4fe1\u606f\u5b66", "\u6750\u6599\u4fe1\u606f\u5b66", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04942v1", "published_at": "2026-08-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CheMLFlow: An Open-Source Platform for Cheminformatics and Materials Informatics Applications", "tldr": "CheMLFlow \u662f\u4e00\u4e2a\u9762\u5411\u5316\u5b66\u4fe1\u606f\u5b66\u4e0e\u6750\u6599\u4fe1\u606f\u5b66\u7684\u5f00\u6e90\u5e73\u53f0\uff0c\u7528\u4e8e\u6784\u5efa\u53ef\u590d\u73b0\u7684\u7aef\u5230\u7aef\u9ad8\u901a\u91cf\u5de5\u4f5c\u6d41\uff0c\u8986\u76d6\u6570\u636e\u83b7\u53d6\u3001\u7279\u5f81\u8868\u793a\u3001\u6a21\u578b\u8bad\u7ec3\u3001\u9a8c\u8bc1\u3001\u7b5b\u9009\u3001\u89e3\u91ca\u4e0e\u62a5\u544a\u751f\u6210\u3002\u5176\u6a21\u5757\u5316\u7ec4\u4ef6\u548c\u6807\u51c6\u5316\u8f93\u51fa\u964d\u4f4e\u4e86\u6d41\u7a0b\u7f16\u6392\u6210\u672c\uff0c\u5e76\u5728\u91cf\u5b50\u529b\u5b66\u3001\u7406\u5316\u6027\u8d28\u3001\u751f\u7269\u6d3b\u6027\u9884\u6d4b\u7b49\u57fa\u51c6\u4e0a\u8fbe\u5230\u6587\u732e\u7ea7\u6027\u80fd\uff0c\u540c\u65f6\u652f\u6301\u667a\u80fd\u4f53\u8f85\u52a9\u5b9e\u9a8c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Training LLM agents commonly relies on supervised fine-tuning from expert trajectories or online reinforcement learning over human-specified tasks with handcrafted verifiers. Though effective, both remain bottlenecked by externally specified tasks and supervision signals, limiting the scalability and diversity of agent training. We study an environment learning paradigm in which agents acquire interaction and manipulation capabilities solely through environment interaction, without externally specified tasks. We propose State2State, an environment-derived mid-training method that converts explored environment states into training objectives, challenging agents to reach a specified target state. By deriving tasks from environment exploration and verifying success through rule-based state matching, State2State provides scalable and verifiable training objectives without expert supervision or manual task design. Experiments on ALFWorld and ScienceWorld show that State2State improves agent performance as a standalone environment-learning stage in most settings. As initialization for downstream RL, it further improves final performance and learning efficiency, with promising evidence of cross-environment generalization.", "arxiv_id": "2608.04934", "arxiv_url": "https://arxiv.org/abs/2608.04934", "authors": ["Xuanyu Lei", "Yiqi Zhu", "Chenliang Li", "Kaiming Liu", "Peng Li", "Ming Yan", "Jieping Ye", "Ya-Qin Zhang", "Yang Liu"], "brief": "\u672c\u6587\u63d0\u51fa State2State\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u73af\u5883\u884d\u751f\u4e2d\u671f\u8bad\u7ec3\u65b9\u6cd5\uff1a\u4e0d\u4f9d\u8d56\u4eba\u5de5\u4efb\u52a1\u3001\u4e13\u5bb6\u8f68\u8ff9\u6216\u624b\u5199\u76d1\u7763\uff0c\u800c\u662f\u628a\u667a\u80fd\u4f53\u63a2\u7d22\u5230\u7684\u73af\u5883\u72b6\u6001\u8f6c\u5316\u4e3a\u201c\u5230\u8fbe\u76ee\u6807\u72b6\u6001\u201d\u7684\u8bad\u7ec3\u76ee\u6807\u3002\u8be5\u65b9\u6cd5\u53ef\u7528\u89c4\u5219\u5316\u72b6\u6001\u5339\u914d\u81ea\u52a8\u9a8c\u8bc1\uff0c\u5728 ALFWorld \u548c ScienceWorld \u4e0a\u63d0\u5347\u4e86\u667a\u80fd\u4f53\u8868\u73b0\uff0c\u5e76\u80fd\u4f5c\u4e3a\u4e0b\u6e38\u5f3a\u5316\u5b66\u4e60\u521d\u59cb\u5316\u4ee5\u63d0\u9ad8\u6700\u7ec8\u6027\u80fd\u548c\u5b66\u4e60\u6548\u7387\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04934", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u73af\u5883\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04934v1", "published_at": "2026-08-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "State2State: Environment-Derived Mid-Training for LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa State2State\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u7684\u73af\u5883\u884d\u751f\u4e2d\u671f\u8bad\u7ec3\u65b9\u6cd5\uff1a\u4e0d\u4f9d\u8d56\u4eba\u5de5\u4efb\u52a1\u3001\u4e13\u5bb6\u8f68\u8ff9\u6216\u624b\u5199\u76d1\u7763\uff0c\u800c\u662f\u628a\u667a\u80fd\u4f53\u63a2\u7d22\u5230\u7684\u73af\u5883\u72b6\u6001\u8f6c\u5316\u4e3a\u201c\u5230\u8fbe\u76ee\u6807\u72b6\u6001\u201d\u7684\u8bad\u7ec3\u76ee\u6807\u3002\u8be5\u65b9\u6cd5\u53ef\u7528\u89c4\u5219\u5316\u72b6\u6001\u5339\u914d\u81ea\u52a8\u9a8c\u8bc1\uff0c\u5728 ALFWorld \u548c ScienceWorld \u4e0a\u63d0\u5347\u4e86\u667a\u80fd\u4f53\u8868\u73b0\uff0c\u5e76\u80fd\u4f5c\u4e3a\u4e0b\u6e38\u5f3a\u5316\u5b66\u4e60\u521d\u59cb\u5316\u4ee5\u63d0\u9ad8\u6700\u7ec8\u6027\u80fd\u548c\u5b66\u4e60\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Symbolic regression aims to discover closed-form equations from data, but existing LLM-guided methods often rely on a unified proposal loop that compresses heterogeneous search failures into a scalar score and a single prompt. We propose A-SR, a self-evolving agentic framework that shifts the control unit from expression edits to role-conditioned evidence views. A-SR coordinates formula discovery through routing among coordination protocols, an online evaluator-reward role policy, and state-routed process memory. During search, evaluator feedback characterizes reliability and productivity, updates role-level utilities, and routes elite motifs, failure traces, and validity diagnostics to different agents. The framework self-evolves at two timescales: within a run, it adapts the search process without updating LLM parameters; across runs, recorded trajectories can be distilled into open-source LLMs as role-conditioned proposal priors. Averaged over the four LSR-Synth scientific domains in LLM-SRBench, A-SR improves Acc@0.01 over baselines from 25.79% to 48.30% with Llama3.1-8B, while A-SR-LoRA improves the corresponding Qwen3-4B result from 24.58% to 38.29%. On four real-world scientific discovery tasks, A-SR obtains the best in-distribution or out-of-distribution normalized mean squared error on 7 of 8 reported metrics.", "arxiv_id": "2608.04872", "arxiv_url": "https://arxiv.org/abs/2608.04872", "authors": ["Wenxiao Zhao", "Dong Liu", "Kaiyi Xu", "Feng Liu", "Zhen Zhao", "Fei Ben", "Shu Wang", "Wenhao Li", "Yingnian Wu", "Fenghua Ling", "Haobo Li", "Lei Bai"], "brief": "\u8bba\u6587\u63d0\u51fa A-SR\uff0c\u4e00\u4e2a\u7528\u4e8e\u7b26\u53f7\u56de\u5f52\u7684\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u89d2\u8272\u5316\u8bc1\u636e\u89c6\u56fe\u3001\u5c42\u7ea7\u534f\u8c03\u534f\u8bae\u3001\u5728\u7ebf\u8bc4\u4f30\u5956\u52b1\u7b56\u7565\u548c\u8fc7\u7a0b\u8bb0\u5fc6\u6765\u7ec4\u7ec7\u516c\u5f0f\u641c\u7d22\u3002\u76f8\u6bd4\u4f20\u7edf LLM \u5f15\u5bfc\u7684\u5355\u4e00\u63d0\u8bae\u5faa\u73af\uff0cA-SR \u5728\u5408\u6210\u79d1\u5b66\u9886\u57df\u663e\u8457\u63d0\u5347 Acc@0.01\uff0c\u5e76\u5728\u771f\u5b9e\u79d1\u5b66\u53d1\u73b0\u4efb\u52a1\u7684\u5927\u591a\u6570\u6307\u6807\u4e0a\u53d6\u5f97\u6700\u4f73\u8bef\u5dee\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04872", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7b26\u53f7\u56de\u5f52", "\u5927\u8bed\u8a00\u6a21\u578b", "\u79d1\u5b66\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04872v1", "published_at": "2026-08-05", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A-SR: Self-Evolving Agentic LLMs for Symbolic Regression via Hierarchical Coordination", "tldr": "\u8bba\u6587\u63d0\u51fa A-SR\uff0c\u4e00\u4e2a\u7528\u4e8e\u7b26\u53f7\u56de\u5f52\u7684\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u901a\u8fc7\u89d2\u8272\u5316\u8bc1\u636e\u89c6\u56fe\u3001\u5c42\u7ea7\u534f\u8c03\u534f\u8bae\u3001\u5728\u7ebf\u8bc4\u4f30\u5956\u52b1\u7b56\u7565\u548c\u8fc7\u7a0b\u8bb0\u5fc6\u6765\u7ec4\u7ec7\u516c\u5f0f\u641c\u7d22\u3002\u76f8\u6bd4\u4f20\u7edf LLM \u5f15\u5bfc\u7684\u5355\u4e00\u63d0\u8bae\u5faa\u73af\uff0cA-SR \u5728\u5408\u6210\u79d1\u5b66\u9886\u57df\u663e\u8457\u63d0\u5347 Acc@0.01\uff0c\u5e76\u5728\u771f\u5b9e\u79d1\u5b66\u53d1\u73b0\u4efb\u52a1\u7684\u5927\u591a\u6570\u6307\u6807\u4e0a\u53d6\u5f97\u6700\u4f73\u8bef\u5dee\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chart question answering (CQA) requires multimodal large language models (MLLMs) to integrate visual comprehension with logical reasoning, yet current models struggle with accurate visual grounding and coherent reasoning chains. While extrinsic chain-of-thought prompting and visual cues significantly improve performance, current MLLMs lack intrinsic visual grounded reasoning capabilities, leading to inaccurate perception and reasoning disconnected from visual evidence. To address these limitations, we propose CURV, a curriculum learning framework that develops intrinsic visual reasoning capabilities by reformulating CQA as multi-step visual grounded reasoning, where each step coordinates logical reasoning with dynamic visual grounding through spatial attention concentration. To assist model learning, we further introduce CCQA, a three-level curriculum dataset with scalable synthetic generation across diverse chart types and reasoning patterns. Our curriculum systematically progresses from basic single-operation reasoning to complex multi-chart compositional tasks. Experiments demonstrate that CURV achieves up to $\\uparrow20.50\\%$ improvements over baselines and is generalizable to real-world benchmarks (up to $\\uparrow12.30\\%$) and out-of-domain multimodal reasoning tasks (up to $\\uparrow10.20\\%$), validating the effectiveness of internalizing visual reasoning with dynamic grounding for enhanced chart understanding capabilities. Code is available at: https://xhguo7.github.io/CURV/.", "arxiv_id": "2608.02833", "arxiv_url": "https://arxiv.org/abs/2608.02833", "authors": ["Xuehang Guo", "Pingyue Zhang", "Ruiyi Zhang", "Zhenhailong Wang", "Hanrui Lyu", "Heng Ji", "Tong Sun", "Qingyun Wang", "Manling Li"], "brief": "\u8bba\u6587\u63d0\u51fa CURV\uff0c\u5c06\u56fe\u8868\u95ee\u7b54\u91cd\u6784\u4e3a\u591a\u6b65\u89c6\u89c9\u624e\u6839\u63a8\u7406\uff0c\u901a\u8fc7\u8bfe\u7a0b\u5b66\u4e60\u8ba9\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u6bcf\u4e00\u6b65\u7ed3\u5408\u903b\u8f91\u63a8\u7406\u4e0e\u52a8\u6001\u89c6\u89c9\u5b9a\u4f4d\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u4e09\u5c42\u8bfe\u7a0b\u6570\u636e\u96c6 CCQA\uff0c\u5b9e\u9a8c\u663e\u793a\u76f8\u5bf9\u57fa\u7ebf\u6700\u9ad8\u63d0\u5347 20.50%\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u771f\u5b9e\u56fe\u8868\u57fa\u51c6\u548c\u57df\u5916\u591a\u6a21\u6001\u63a8\u7406\u4efb\u52a1\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": "https://github.com/xhguo7/CURV", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.02833", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u8868\u7406\u89e3", "\u89c6\u89c9\u63a8\u7406", "\u8bfe\u7a0b\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02833v1", "published_at": "2026-08-03", "score": 0.017, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02833.png", "title": "CURV: Enhancing Chart Understanding Through Curriculum Visual Grounded Reasoning", "tldr": "\u8bba\u6587\u63d0\u51fa CURV\uff0c\u5c06\u56fe\u8868\u95ee\u7b54\u91cd\u6784\u4e3a\u591a\u6b65\u89c6\u89c9\u624e\u6839\u63a8\u7406\uff0c\u901a\u8fc7\u8bfe\u7a0b\u5b66\u4e60\u8ba9\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u6bcf\u4e00\u6b65\u7ed3\u5408\u903b\u8f91\u63a8\u7406\u4e0e\u52a8\u6001\u89c6\u89c9\u5b9a\u4f4d\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u4e09\u5c42\u8bfe\u7a0b\u6570\u636e\u96c6 CCQA\uff0c\u5b9e\u9a8c\u663e\u793a\u76f8\u5bf9\u57fa\u7ebf\u6700\u9ad8\u63d0\u5347 20.50%\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u771f\u5b9e\u56fe\u8868\u57fa\u51c6\u548c\u57df\u5916\u591a\u6a21\u6001\u63a8\u7406\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Although Multimodal Large Language Models (MLLMs) have made substantial progress, their spatial reasoning may still produce intermediate judgments inconsistent with the input image, allowing errors to propagate through the reasoning chain and affect the final answer. Existing methods mainly improve spatial reasoning through training or additional spatial information, without considering whether the reasoning process itself is faithful to the model input. Our study shows that unfaithful reasoning chains significantly reduce final-answer accuracy. To address this issue, we propose a modular and training-free framework for spatial reasoning verification and correction. The framework constructs a Spatial Evidence Graph (SEG), which associates atomic spatial evidence extracted from Chain-of-Thought reasoning with visual entities, spatial relations, source steps, and visual evidence. Spatial Evidence Reliability Assessment (SERA) evaluates the reliability of visual evidence based on object existence, localization, and geometric measurements. The framework then identifies the earliest spatial evidence unit contradicted by reliable visual evidence and guides the original MLLM to revise the subsequent reasoning and final answer. Across 15 model-dataset settings, our method achieves an average accuracy of 68.94%, outperforming the compared baselines by 8.55 percentage points on average. Our code will be open-sourced.", "arxiv_id": "2608.04759", "arxiv_url": "https://arxiv.org/abs/2608.04759", "authors": ["Yang Yang", "Jiawei Chen", "Tairan Chen", "Zhaoxia Yin"], "brief": "\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u7a7a\u95f4\u63a8\u7406\u9a8c\u8bc1\u4e0e\u7ea0\u9519\u6846\u67b6\uff0c\u901a\u8fc7\u6784\u5efa\u7a7a\u95f4\u8bc1\u636e\u56fe\u5e76\u8bc4\u4f30\u89c6\u89c9\u8bc1\u636e\u53ef\u9760\u6027\uff0c\u5b9a\u4f4d\u63a8\u7406\u94fe\u4e2d\u6700\u65e9\u7684\u4e0d\u4e00\u81f4\u7a7a\u95f4\u8bc1\u636e\u3002\u8be5\u65b9\u6cd5\u5f15\u5bfc\u539f\u6a21\u578b\u4fee\u6b63\u540e\u7eed\u63a8\u7406\u548c\u7b54\u6848\uff0c\u572815\u4e2a\u6a21\u578b-\u6570\u636e\u96c6\u8bbe\u7f6e\u4e0a\u5e73\u5747\u51c6\u786e\u7387\u8fbe68.94%\uff0c\u8f83\u57fa\u7ebf\u63d0\u53478.55\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04759", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u7a7a\u95f4\u63a8\u7406", "\u601d\u7ef4\u94fe", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04759v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Trace, Verify, and Correct: A Training-Free Framework for Spatial Reasoning in Multimodal LLMs", "tldr": "\u63d0\u51fa\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u7a7a\u95f4\u63a8\u7406\u9a8c\u8bc1\u4e0e\u7ea0\u9519\u6846\u67b6\uff0c\u901a\u8fc7\u6784\u5efa\u7a7a\u95f4\u8bc1\u636e\u56fe\u5e76\u8bc4\u4f30\u89c6\u89c9\u8bc1\u636e\u53ef\u9760\u6027\uff0c\u5b9a\u4f4d\u63a8\u7406\u94fe\u4e2d\u6700\u65e9\u7684\u4e0d\u4e00\u81f4\u7a7a\u95f4\u8bc1\u636e\u3002\u8be5\u65b9\u6cd5\u5f15\u5bfc\u539f\u6a21\u578b\u4fee\u6b63\u540e\u7eed\u63a8\u7406\u548c\u7b54\u6848\uff0c\u572815\u4e2a\u6a21\u578b-\u6570\u636e\u96c6\u8bbe\u7f6e\u4e0a\u5e73\u5747\u51c6\u786e\u7387\u8fbe68.94%\uff0c\u8f83\u57fa\u7ebf\u63d0\u53478.55\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) have achieved significant success in speech-to-text translation (S2TT). However, when processing multilingual speech inputs, a single speech encoder shared across all languages suffers from the curse of multilinguality: languages at different resource levels compete for limited representation capacity, leading to strong high-resource performance but substantial degradation on low-resource speech. To address this problem and improve multilingual consistency, we propose MSRT, a novel framework built around a resource-aware Mixture of Speech Encoders (MoSE). MoSE uses an explicit language router to assign each utterance to an appropriate expert encoder. A frozen expert preserves high-resource language capabilities, while a trainable expert adapts to and specializes in medium- and low-resource languages. We further introduce a five-stage curriculum learning strategy that substantially reduces data dependence, requiring only 10 hours of paired S2TT data per language for effective alignment. We conduct extensive experiments on 45 languages, systematically evaluating all $45 \\times 44$ translation directions. Our 4B-parameter model achieves state-of-the-art performance, outperforming substantially larger baselines. Empirical analyses show that MoSE improves high-, medium-, and low-resource languages simultaneously, with the largest gains on low-resource speech, thereby breaking the curse of multilinguality without compromising high-resource performance. To support future multilingual S2TT research, we release our code and models.", "arxiv_id": "2608.04586", "arxiv_url": "https://arxiv.org/abs/2608.04586", "authors": ["Yexing Du", "Kaiyuan Liu", "Youcheng Pan", "Bo Yang", "Chengpeng Fu", "Yu Wang", "Ming Liu"], "brief": "\u8bba\u6587\u63d0\u51fa MSRT\uff0c\u901a\u8fc7\u8d44\u6e90\u611f\u77e5\u7684\u8bed\u97f3\u7f16\u7801\u5668\u6df7\u5408\uff08MoSE\uff09\u4e3a\u4e0d\u540c\u8d44\u6e90\u6c34\u5e73\u8bed\u8a00\u5206\u914d\u5408\u9002\u7684\u4e13\u5bb6\u7f16\u7801\u5668\uff0c\u7f13\u89e3\u591a\u8bed\u8a00\u8bed\u97f3\u7ffb\u8bd1\u4e2d\u5355\u4e00\u7f16\u7801\u5668\u5bb9\u91cf\u7ade\u4e89\u7684\u95ee\u9898\u3002\u5176 4B \u6a21\u578b\u5728 45 \u79cd\u8bed\u8a00\u7684\u591a\u5bf9\u591a\u8bed\u97f3\u5230\u6587\u672c\u7ffb\u8bd1\u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5c24\u5176\u663e\u8457\u63d0\u5347\u4f4e\u8d44\u6e90\u8bed\u8a00\uff0c\u540c\u65f6\u4e0d\u635f\u5bb3\u9ad8\u8d44\u6e90\u8bed\u8a00\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04586", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u7ffb\u8bd1", "\u591a\u8bed\u8a00", "\u6df7\u5408\u4e13\u5bb6", "\u4f4e\u8d44\u6e90\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04586v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Breaking the Curse ofMultilinguality inMany-to-Many Speech-to-Text Translation via a Resource-AwareMixture of Speech Encoders", "tldr": "\u8bba\u6587\u63d0\u51fa MSRT\uff0c\u901a\u8fc7\u8d44\u6e90\u611f\u77e5\u7684\u8bed\u97f3\u7f16\u7801\u5668\u6df7\u5408\uff08MoSE\uff09\u4e3a\u4e0d\u540c\u8d44\u6e90\u6c34\u5e73\u8bed\u8a00\u5206\u914d\u5408\u9002\u7684\u4e13\u5bb6\u7f16\u7801\u5668\uff0c\u7f13\u89e3\u591a\u8bed\u8a00\u8bed\u97f3\u7ffb\u8bd1\u4e2d\u5355\u4e00\u7f16\u7801\u5668\u5bb9\u91cf\u7ade\u4e89\u7684\u95ee\u9898\u3002\u5176 4B \u6a21\u578b\u5728 45 \u79cd\u8bed\u8a00\u7684\u591a\u5bf9\u591a\u8bed\u97f3\u5230\u6587\u672c\u7ffb\u8bd1\u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5c24\u5176\u663e\u8457\u63d0\u5347\u4f4e\u8d44\u6e90\u8bed\u8a00\uff0c\u540c\u65f6\u4e0d\u635f\u5bb3\u9ad8\u8d44\u6e90\u8bed\u8a00\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-based search agents are widely used for information-seeking tasks, but their reliance on external tool returns introduces a critical security risk: web content retrieved during execution is untrusted, exposing agents to prompt injection and goal hijacking. Prior work on search-agent safety primarily focuses on static web-content injection, but modern agents issue follow-up queries and cross-check competing sources, so a single injected page is often diluted or rejected. We show that the channel delivering search and page observations is a fragile security boundary: beyond exposing the agent to a single poisoned page, a mediated search interface can repeatedly steer how the agent gathers evidence and forms its final answer. Under a constrained tool-intermediary threat model, appending only one controlled result per query can substantially increase attack success when the evidence is coordinated across the agent\u0027s trajectory. We study this setting with a strategy-driven long-horizon attack system and introduce Authority-Chain Hijack (ACH), an expert-refined strategy that turns isolated search-result and page-content manipulations into a coherent evidence chain across seemingly corroborating sources. ACH achieves the highest Overall ASR among all baselines, reaching 55.9% / 83.3% ASR / MaxN ASR on the full SafeSearch test split. We further introduce Trace-Guided Strategy Evolution (TGSE), which automatically improves attacker strategies from execution traces, replacing manual redesign with trace-driven refinement; its strongest single setting reaches 71.4% / 95.0% in held-out evaluation.", "arxiv_id": "2608.04565", "arxiv_url": "https://arxiv.org/abs/2608.04565", "authors": ["Xuebin Li", "Hanqing Zhao", "Siyuan Liang", "Kejiang Chen", "Weiming Zhang", "Dacheng Tao", "Nenghai Yu"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u6a21\u578b\u641c\u7d22\u667a\u80fd\u4f53\u5728\u5916\u90e8\u641c\u7d22/\u7f51\u9875\u89c2\u6d4b\u901a\u9053\u4e2d\u7684\u5b89\u5168\u98ce\u9669\uff0c\u6307\u51fa\u653b\u51fb\u8005\u5373\u4f7f\u6bcf\u6b21\u67e5\u8be2\u53ea\u63d2\u5165\u4e00\u4e2a\u53d7\u63a7\u7ed3\u679c\uff0c\u4e5f\u80fd\u6cbf\u667a\u80fd\u4f53\u591a\u8f6e\u68c0\u7d22\u8f68\u8ff9\u6784\u9020\u8fde\u8d2f\u7684\u865a\u5047\u8bc1\u636e\u94fe\u3002\u63d0\u51fa Authority-Chain Hijack \u4e0e Trace-Guided Strategy Evolution \u653b\u51fb\u7b56\u7565\uff0c\u5728 SafeSearch \u6d4b\u8bd5\u4e2d\u663e\u8457\u63d0\u5347\u63d0\u793a\u6ce8\u5165/\u76ee\u6807\u52ab\u6301\u6210\u529f\u7387\uff0c\u6700\u9ad8\u8fbe\u5230 71.4% ASR\u300195.0% MaxN ASR\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04565", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u63d0\u793a\u6ce8\u5165", "\u7f51\u7edc\u5b89\u5168", "\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04565v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Breadcrumbing Search Agents", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u6a21\u578b\u641c\u7d22\u667a\u80fd\u4f53\u5728\u5916\u90e8\u641c\u7d22/\u7f51\u9875\u89c2\u6d4b\u901a\u9053\u4e2d\u7684\u5b89\u5168\u98ce\u9669\uff0c\u6307\u51fa\u653b\u51fb\u8005\u5373\u4f7f\u6bcf\u6b21\u67e5\u8be2\u53ea\u63d2\u5165\u4e00\u4e2a\u53d7\u63a7\u7ed3\u679c\uff0c\u4e5f\u80fd\u6cbf\u667a\u80fd\u4f53\u591a\u8f6e\u68c0\u7d22\u8f68\u8ff9\u6784\u9020\u8fde\u8d2f\u7684\u865a\u5047\u8bc1\u636e\u94fe\u3002\u63d0\u51fa Authority-Chain Hijack \u4e0e Trace-Guided Strategy Evolution \u653b\u51fb\u7b56\u7565\uff0c\u5728 SafeSearch \u6d4b\u8bd5\u4e2d\u663e\u8457\u63d0\u5347\u63d0\u793a\u6ce8\u5165/\u76ee\u6807\u52ab\u6301\u6210\u529f\u7387\uff0c\u6700\u9ad8\u8fbe\u5230 71.4% ASR\u300195.0% MaxN ASR\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Benchmarking machine unlearning methods is critical to understand whether sensitive knowledge is removed from large language models (LLMs) or not. Current unlearning benchmarks include mainly single-hop questions and a narrow set of multi-hop questions. Although effective, they still face two challenges. (1) Knowledge is not isolated, whereby diverse multi-hop reasoning paths can potentially induce knowledge leakage than normal queries. (2) Unlearning may be fragile: unlearned knowledge can be partially recovered through recovery attacks such as lightweight post-unlearning adaptation, making static evaluation insufficient. Therefore, in this paper, we introduce \\unlearning as a novel benchmark to understand robust LLM knowledge removal across diverse reasoning paths and recovery attacks. We experiment with this benchmark on 3 models, 6 unlearning methods, and 2 carefully curated datasets. Results show that existing methods are vulnerable to multi-hop reasoning paths and recovery attacks. We further explore the trade-off among forget quality, robustness, and model utility for LLM unlearning.", "arxiv_id": "2608.04519", "arxiv_url": "https://arxiv.org/abs/2608.04519", "authors": ["Haoting Qian", "Qingjie Zhang", "Zhicong Huang", "Cheng Hong", "Han Qiu"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u9057\u5fd8\u7684\u6297\u6cc4\u6f0f\u65b0\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u8df3\u63a8\u7406\u8def\u5f84\u4e0b\u654f\u611f\u77e5\u8bc6\u662f\u5426\u4ecd\u4f1a\u88ab\u8bf1\u5bfc\u6cc4\u9732\uff0c\u4ee5\u53ca\u9057\u5fd8\u540e\u662f\u5426\u80fd\u88ab\u8f7b\u91cf\u6062\u590d\u653b\u51fb\u91cd\u65b0\u627e\u56de\u3002\u5b9e\u9a8c\u8986\u76d63\u4e2a\u6a21\u578b\u30016\u79cd\u9057\u5fd8\u65b9\u6cd5\u548c2\u4e2a\u6570\u636e\u96c6\uff0c\u53d1\u73b0\u73b0\u6709\u65b9\u6cd5\u666e\u904d\u5bb9\u6613\u53d7\u5230\u591a\u8df3\u63a8\u7406\u4e0e\u6062\u590d\u653b\u51fb\u5f71\u54cd\uff0c\u5e76\u63ed\u793a\u9057\u5fd8\u8d28\u91cf\u3001\u9c81\u68d2\u6027\u548c\u6a21\u578b\u6548\u7528\u4e4b\u95f4\u7684\u6743\u8861\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04519", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u8df3\u63a8\u7406", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04519v1", "published_at": "2026-08-05", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Leak-Resistant Unlearning: A New Benchmark for Evaluating Multi-Hop Reasoning Consistency and Recovery Robustness", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u9057\u5fd8\u7684\u6297\u6cc4\u6f0f\u65b0\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u8df3\u63a8\u7406\u8def\u5f84\u4e0b\u654f\u611f\u77e5\u8bc6\u662f\u5426\u4ecd\u4f1a\u88ab\u8bf1\u5bfc\u6cc4\u9732\uff0c\u4ee5\u53ca\u9057\u5fd8\u540e\u662f\u5426\u80fd\u88ab\u8f7b\u91cf\u6062\u590d\u653b\u51fb\u91cd\u65b0\u627e\u56de\u3002\u5b9e\u9a8c\u8986\u76d63\u4e2a\u6a21\u578b\u30016\u79cd\u9057\u5fd8\u65b9\u6cd5\u548c2\u4e2a\u6570\u636e\u96c6\uff0c\u53d1\u73b0\u73b0\u6709\u65b9\u6cd5\u666e\u904d\u5bb9\u6613\u53d7\u5230\u591a\u8df3\u63a8\u7406\u4e0e\u6062\u590d\u653b\u51fb\u5f71\u54cd\uff0c\u5e76\u63ed\u793a\u9057\u5fd8\u8d28\u91cf\u3001\u9c81\u68d2\u6027\u548c\u6a21\u578b\u6548\u7528\u4e4b\u95f4\u7684\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Prior work on LLM conformity largely measures discrete answer flips under verifiable labels. Open-ended revisions require a different measurement strategy because answer quality is graded, latent, and judged imperfectly. We introduce an experimental protocol implemented across a pooled main peer-condition corpus and separately constructed decomposition corpora, allowing us to separate ordinary re-answering, candidate-content exposure, a bundled peer-presentation residual, and directional judge sensitivity to visible peer context. Across four open-weight generators and three benchmarks, all-wrong peer input produces the lowest-quality revisions in every generator-dataset cell. Blind and i
