const PAPERS = [{"abstract": "Modern agent frameworks equip large language models with external skill libraries to solve complex tasks. However, it remains unclear whether these systems can effectively evolve their skills and whether the resulting skills improve task-solving capabilities. To bridge this gap, we introduce ContinualSkillBench, a dynamic evaluation framework for in-context continual skill learning. It covers five representative domains, each containing 100 interconnected subtasks ordered by increasing difficulty and opportunities for cross-task skill reuse. Our experiments show that sequential execution generally improves performance, but the gains vary substantially across models and domains. Moreover, in-context learning performs comparably to explicit skill maintenance on average, suggesting that much of the improvement arises from adaptation to prior context and feedback rather than reusable skill abstraction alone. Explicit skills nevertheless provide selective benefits for tasks requiring reusable procedures or precise outputs. We further find that less capable models tend to accumulate larger, more fragmented collections of task-specific skills. These findings show that current in-context skill evolution mechanisms can support continual adaptation, but still struggle to consistently consolidate experience into robust and transferable skills.", "arxiv_id": "2608.03874", "arxiv_url": "https://arxiv.org/abs/2608.03874", "authors": ["Tianyi Guan", "Yiding Wang", "Haotong Yang", "Siyuan Cao", "Shirui Liu", "Yi Hu", "Jiaqi Li", "Muhan Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa ContinualSkillBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u5185\u6301\u7eed\u6280\u80fd\u5b66\u4e60\u7684\u52a8\u6001\u57fa\u51c6\u3002\u5b83\u8986\u76d65\u4e2a\u4ee3\u8868\u6027\u9886\u57df\uff0c\u6bcf\u4e2a\u9886\u57df\u5305\u542b100\u4e2a\u96be\u5ea6\u9012\u589e\u4e14\u53ef\u76f8\u4e92\u590d\u7528\u6280\u80fd\u7684\u5b50\u4efb\u52a1\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/gtynnn060110-hash/continual-skill-bench-final", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.03874", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u987a\u5e8f\u6267\u884c\u4efb\u52a1\u901a\u5e38\u80fd\u63d0\u5347\u8868\u73b0\uff0c\u4f46\u589e\u76ca\u5728\u4e0d\u540c\u6a21\u578b\u548c\u9886\u57df\u95f4\u5dee\u5f02\u5f88\u5927", "\u4e0a\u4e0b\u6587\u5185\u5b66\u4e60\u5e73\u5747\u4e0a\u63a5\u8fd1\u663e\u5f0f\u6280\u80fd\u5e93\u7ef4\u62a4\uff0c\u8bf4\u660e\u63d0\u5347\u5f88\u5927\u7a0b\u5ea6\u6765\u81ea\u5386\u53f2\u4e0a\u4e0b\u6587\u4e0e\u53cd\u9988\u9002\u5e94\uff0c\u800c\u975e\u771f\u6b63\u62bd\u8c61\u51fa\u53ef\u590d\u7528\u6280\u80fd", "\u663e\u5f0f\u6280\u80fd\u5728\u9700\u8981\u53ef\u590d\u7528\u6d41\u7a0b\u6216\u7cbe\u786e\u8f93\u51fa\u7684\u4efb\u52a1\u4e2d\u66f4\u6709\u5e2e\u52a9\uff0c\u8f83\u5f31\u6a21\u578b\u5219\u66f4\u6613\u79ef\u7d2f\u788e\u7247\u5316\u3001\u4efb\u52a1\u7279\u5b9a\u7684\u6280\u80fd"], "keywords": ["\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "\u6280\u80fd\u5b66\u4e60", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 4, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.03874v1", "published_at": "2026-08-04", "score": 0.647, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03874.png", "title": "ContinualSkillBench: Can LLM Agents Truly Evolve Their Capabilities?", "tldr": "\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u80fd\u5426\u6301\u7eed\u8fdb\u5316\u6280\u80fd", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa ContinualSkillBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u5185\u6301\u7eed\u6280\u80fd\u5b66\u4e60\u7684\u52a8\u6001\u5  how these proxies empower agents across three progressive levels: L.1 Inference-Time Guidance, where proxy outputs enrich in-context information for superior decisions; L.2 Training-Time Optimization, where proxy outputs yield rewards, critiques, or synthetic rollouts for policy learning; and L.3 Agent-Proxy Co-Evolution, where real-environment evidence continuously updates both the proxy and the agent for co-evolution. Ultimately, this work recasts world modeling into an agent-centric paradigm, establishing a roadmap for building world proxies that empower agents to plan better, learn faster, and evolve continually.", "arxiv_id": "2608.02713", "arxiv_url": "https://arxiv.org/abs/2608.02713", "authors": ["Yu Yang", "Xuemeng Yang", "Licheng Wen", "Lingdong Kong", "Xiaobin Hu", "Dongyue Lu", "Wei Chow", "Xiyan Huang", "Yuxiang Feng", "Yue Liao", "Jianbiao Mei", "Daocheng Fu", "Rong Wu", "Pinlong Cai", "Ran Yi", "Ying Tai", "Jiangning Zhang", "Botian Shi", "Yong Liu", "Shuicheng Yan"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u4e2d\u5fc3\u4ea4\u4e92\u5f0f\u4e16\u754c\u4ee3\u7406\u201d\u6982\u5ff5\uff0c\u5c06\u4e16\u754c\u6a21\u578b\u4ece\u9884\u6d4b\u7269\u7406\u72b6\u6001\u8f6c\u79fb\uff0c\u6269\u5c55\u4e3a\u63d0\u4f9b\u6267\u884c\u7ed3\u679c\u3001\u7ecf\u9a8c\u68c0\u7d22\u3001\u6280\u80fd\u4e0e\u9a8c\u8bc1\u4fe1\u53f7\u7b49\u667a\u80fd\u4f53\u53ef\u7528\u53cd\u9988\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u516d\u7c7b\u4e16\u754c\u4ee3\u7406\u53ca\u5176\u5728\u63a8\u7406\u6307\u5bfc\u3001\u8bad\u7ec3\u4f18\u5316\u548c\u667a\u80fd\u4f53-\u4ee3\u7406\u5171\u540c\u8fdb\u5316\u4e2d\u7684\u4f5c\u7528\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": "https://github.com/worldbench/awesome-agentic-world-model", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2608.02713", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u4e16\u754c\u5efa\u6a21\u8303\u5f0f\u4ece\u7269\u7406\u72b6\u6001\u9884\u6d4b\u626 e\u4e3a\u667a\u80fd\u4f53\u65f6\u4ee3\u7684\u4e16\u754c\u6a21\u578b\u5efa\u7acb\u66f4\u5e7f\u4e49\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u3001LLM Agent\u3001\u673a\u5668\u4eba\u5b66\u4e60\u548c\u6301\u7eed\u5b66\u4e60\u7cfb\u7edf\u7684\u8bbe\u8ba1\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Vision offers a critical axis for advancing foundation models, driving a shift towards natively unified multimodal pretraining. Despite this momentum, the design space and the fundamental mechanisms of how modalities interact during unified training remain underexplored. We provide empirical clarity through a systematic exploration of multimodal pretraining. Our controlled experiments on both synthetic and large-scale real-world datasets yield four key insights into the physics of multimodal pretraining: (i) Knowledge Flow: We disentangle how language, visual understanding, and visual generation transfer knowledge across modalities, revealing distinct patterns of influence and asymmetry; (ii) Synergy vs. Competition: We show that data \"complexity\" largely determines whether modalities are synergistic, identify architectural choices that promote synergy: such as shared attention and normalization with modality-specific feed-forward layers, and find that these behaviors generalize across different visual tokenizer designs; (iii) Early Unification: Unifying modalities from the very early stages and training them jointly is shown to be more effective than late alignment or sequential training. This process uncovers a vision laziness phenomenon, where delayed integration leads models to rely on language priors; (iv) Recipes: We derive efficient pretraining recipes that achieve strong generative performance using only 5% of the compute budget. These core findings are subsequently validated at scale by training multiple 13.5B MoE models on 2T tokens. We hope this study provides a principled foundation for understanding and scaling multimodal pretraining.", "arxiv_id": "2608.05000", "arxiv_url": "https://arxiv.org/abs/2608.05000", "authors": ["Junlin Han", "Shengbang Tong", "David Fan", "Minghao Chen", "Philip Torr", "Filippos Kokkinos", "Mike Lewis"], "brief": "\u8bba\u6587\u901a\u8fc7\u5408\u6210\u6570\u636e\u4e0e\u5927\u89c4\u6a21\u771f\u5b9e\u6570\u636e\u7684\u53d7\u63a7\u5b9e\u9a8c\uff0c\u7814\u7a76\u89c6\u89c9\u3001\u8bed\u8a00\u3001\u89c6\u89c9\u751f\u6210\u5728\u7edf\u4e00\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u4e2d\u7684\u76f8\u4e92\u4f5c\u7528\u673a\u5236\u3002\u4f5c\u8005\u603b\u7ed3\u51fa\u77e5\u8bc6\u6d41\u3001\u6a21\u6001\u534f\u540c/\u7ade\u4e89\u3001\u65e9\u671f\u7edf\u4e00\u8bad\u7ec3\u548c\u9ad8\u6548\u8bad\u7ec3\u914d\u65b9\u56db\u7c7b\u6838\u5fc3\u89c4\u5f8b\uff0c\u5e76\u57282T tokens\u300113.5B MoE\u6a21\u578b\u4e0a\u9a8c\u8bc1\u3002", "categories": ["cs.CV", "cs.LG", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05000", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63ed\u793a\u8bed\u8a00\u3001\u89c6\u89c9\u7406\u89e3\u4e0e\u89c6\u89c9\u751f\u6210\u4e4b\u95f4\u5b58\u5728\u975e\u5bf9\u79f0\u77e5\u8bc6\u8fc1\u79fb\uff0c\u4e0d\u540c\u6a21\u6001\u5bf9\u5f7c\u6b64\u7684\u5f71\u54cd\u6a21\u5f0f\u4e0d\u540c", "\u53d1\u73b0\u6570\u636e\u590d\u6742\u5ea6\u51b3\u5b9a\u6a21\u6001\u95f4\u66f4\u503e\u5411\u534f\u540c\u8fd8\u662f\u7ade\u4e89\uff0c\u5171\u4eab\u6ce8\u610f\u529b\u4e0e\u5f52\u4e00\u5316\u3001\u6a21\u6001\u4e13\u5c5eFFN\u7b49\u67b6\u6784\u66f4\u5229\u4e8e\u534f\u540c", "\u8bc1\u660e\u4ece\u8bad\u7ec3\u65e9\u671f\u5373\u7edf\u4e00\u591a\u6a21\u6001\u4f18\u4e8e\u540e\u671f\u5bf9\u9f50\u6216\u987a\u5e8f\u8bad\u7ec3\uff0c\u5e76\u53d1\u73b0\u5ef6\u8fdf\u878d\u5408\u4f1a\u5bfc\u81f4\u6a21\u578b\u4f9d\u8d56\u8bed\u8a00\u5148\u9a8c\u7684\u201c\u89c6\u89c9\u61d2\u60f0\u201d\u73b0\u8c61", "\u63d0\u51fa\u4ec5\u7528\u7ea65%\u7b97\u529b\u5373\u53ef\u83b7\u5f97\u5f3a\u89c6\u89c9\u751f\u6210\u80fd\u529b\u7684\u9ad8\u6548\u9884\u8bad\u7ec3\u914d\u65b9"], "keywords": ["\u591a\u6a21\u6001", "\u9884\u8bad\u7ec3", "\u57fa\u7840\u6a21\u578b", "\u89c6\u89c9\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "AI at Meta", "pdf_url": "https://arxiv.org/pdf/2608.05000v1", "published_at": "2026-08-05", "score": 0.523, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05000.png", "title": "Towards Physics of Multimodal Pretraining: Knowledge Flow, Modality Synergy, Early Unification, and Recipes", "tldr": "\u7cfb\u7edf\u63ed\u793a\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u4e2d\u7684\u77e5\u8bc6\u6d41\u4e0e\u534f\u540c\u89c4\u5f8b", "upvotes": 13, "what_it_is": "\u8bba\u6587\u901a\u8fc7\u5408\u6210\u6570\u636e\u4e0e\u5927\u89c4\u6a21\u771f\u5b9e\u6570\u636e\u7684\u53d7\u63a7\u5b9e\u9a8c\uff0c\u7814\u7a76\u89c6\u89c9\u3001\u8bed\u8a00\u3001\u89c6\u89c9\u751f\u6210\u5728\u7edf\u4e00\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u4e2d\u7684\u76f8\u4e92\u4f5c\u7528\u673a\u5236\u3002\u4f5c\u8005\u603b\u7ed3\u51fa\u77e5\u8bc6\u6d41\u3001\u6a21\u6001\u534f\u540c/\u7ade\u4e89\u3001\u65e9\u671f\u7edf\u4e00\u8bad\u7ec3\u548c\u9ad8\u6548\u8bad\u7ec3\u914d\u65b9\u56db\u7c7b\u6838\u5fc3\u89c4\u5f8b\uff0c\u5e76\u57282T tokens\u300113.5B MoE\u6a21\u578b\u4e0a\u9a8c\u8bc1\u3002", "why_notable": "\u8fd9\u7bc7\u5de5\u4f5c\u8bd5\u56fe\u4ece\u673a\u5236\u5c42\u9762\u89e3\u91ca\u7edf\u4e00\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u4e3a\u4f55\u6709\u6548\u3001\u4f55\u65f6\u5931\u6548\uff0c\u5e76\u7ed9\u51fa\u53ef\u6269\u5c55\u7684\u67b6\u6784\u4e0e\u8bad\u7ec3\u5efa\u8bae\uff0c\u5bf9\u6784\u5efa\u539f\u751f\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b\u5177\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Recursive self-improvement requires agents to turn accumulated experience into better future behavior. Personal AI agents offer a concrete setting for studying this capability because they retain preferences, task histories, tool routines, and learned skills across sessions. Yet whether retained experience actually improves them over time has not been systematically tested. We introduce PAST-Bench, a benchmark designed to isolate this question. Each agent runs through ordered sequences of fresh-session tasks under matched conditions that turn retained experience on and off. It spans 26 scenarios and 204 episodes across memory, procedural reuse, information gathering, and update. We report both later-task gains and whether those gains follow the intended save, retrieve, and update pathway. Across seven base models and four agent frameworks, improvement is real but uneven across capabilities. Agents with the same headline gain can differ markedly in whether that gain is supported by evidence of the intended pathway. Guided by these findings, we develop Hermes+, which extends Hermes with five targeted interventions across stages of the agent loop. Hermes+ raises the average gain from retained experience and provides clearer pathway evidence, with its strongest improvement on tasks requiring outdated state to be replaced, although the effect remains capability- and model-dependent. Together, PAST-Bench and Hermes+ provide an evaluation and diagnostic foundation for studying how persistent agents can progress from retaining experience to systematically improving through it. Code: https://github.com/Gen-Verse/PAST-Bench", "arxiv_id": "2608.04003", "arxiv_url": "https://arxiv.org/abs/2608.04003", "authors": ["Shuhan Xue", "Zixin Ding", "Yichen Shen", "Yinjie Wang", "Zhenfei Yin", "Yingcheng Wu", "Yuxin Chen", "Mengdi Wang", "Ling Yang"], "brief": "\u8bba\u6587\u63d0\u51fa PAST-Bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u4e2a\u4eba AI \u667a\u80fd\u4f53\u5728\u8de8\u4f1a\u8bdd\u4fdd\u7559\u7ecf\u9a8c\u540e\uff0c\u662f\u5426\u80fd\u5728\u540e\u7eed\u4efb\u52a1\u4e2d\u771f\u6b63\u63d0\u5347\u8868\u73b0\u3002\u57fa\u4e8e\u8bca\u65ad\u7ed3\u679c\uff0c\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa Hermes+\uff0c\u901a\u8fc7\u4e94\u9879\u667a\u80fd\u4f53\u5faa\u73af\u5e72\u9884\u589e\u5f3a\u7ecf\u9a8c\u4fdd\u5b58\u3001\u68c0\u7d22\u4e0e\u66f4\u65b0\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Gen-Verse/PAST-Bench", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.04003", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["PAST-Bench \u8986\u76d6 26 \u4e2a\u573a\u666f\u3001204 \u4e2a episode\uff0c\u4efb\u52a1\u5e8f\u5217\u5728\u5f00\u542f/\u5173\u95ed\u4fdd\u7559\u7ecf\u9a8c\u7684\u5339\u914d\u6761\u4ef6\u4e0b\u8fd0\u884c\u3002", "\u8bc4\u6d4b\u4e0d\u4ec5\u770b\u540e\u7eed\u4efb\u52a1\u6536\u76ca\uff0c\u8fd8\u68c0\u67e5\u6536\u76ca\u662f\u5426\u6765\u81ea\u9884\u671f\u7684\u4fdd\u5b58\u3001\u68c0\u7d22\u3001\u66f4\u65b0\u8def\u5f84\u3002", "\u5728 7 \u4e2a\u57fa\u7840\u6a21\u578b\u548c 4 \u4e2a\u667a\u80fd\u4f53\u6846\u67b6\u4e0a\uff0c\u7ecf\u9a8c\u5e26\u6765\u7684\u63d0\u5347\u771f\u5b9e\u5b58\u5728\u4f46\u4e0d\u5747\u8861\uff1bHermes+ \u63d0\u9ad8\u4e86\u5e73\u5747\u589e\u76ca\uff0c\u5c24\u5176\u6539\u5584\u8fc7\u65f6\u72b6\u6001\u66ff\u6362\u4efb\u52a1\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u57fa\u51c6\u8bc4\u6d4b", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 1, "on_hf": true, "organization": "Princeton University", "pdf_url": "https://arxiv.org/pdf/2608.04003v1", "published_at": "2026-08-04", "score": 0.509, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Princeton", "HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04003.png", "title": "PAST-Bench: Benchmarking the Foundations of Recursive Self-Improvement in Personal Agents", "tldr": "\u8bc4\u6d4b\u4e2a\u4eba\u667a\u80fd\u4f53\u80fd\u5426\u4ece\u7ecf\u9a8c\u4e2d\u81ea\u6211\u6539\u8fdb", "upvotes": 28, "what_it_is": "\u8bba\u6587\u63d0\u51fa PAST-Bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u4e2a\u4eba AI \u667a\u80fd\u4f53\u5728\u8de8\u4f1a\u8bdd\u4fdd\u7559\u7ecf\u9a8c\u540e\uff0c\u662f\u5426\u80fd\u5728\u540e\u7eed\u4efb\u52a1\u4e2d\u771f\u6b63\u63d0\u5347\u8868\u73b0\u3002\u57fa\u4e8e\u8bca\u65ad\u7ed3\u679c\uff0c\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa Hermes+\uff0c\u901a\u8fc7\u4e94\u9879\u667a\u80fd\u4f53\u5faa\u73af\u5e72\u9884\u589e\u5f3a\u7ecf\u9a8c\u4fdd\u5b58\u3001\u68c0\u7d22\u4e0e\u66f4\u65b0\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u201d\u843d\u5230\u53ef\u6d4b\u7684\u4e2a\u4eba\u667a\u80fd\u4f53\u573a\u666f\u4e2d\uff0c\u4e0d\u53ea\u8bc4\u4f30\u7ed3\u679c\u53d8\u597d\uff0c\u8fd8\u8bca\u65ad\u662f\u5426\u771f\u7684\u4f9d\u8d56\u957f\u671f\u7ecf\u9a8c\u673a\u5236\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u5b66\u4e60\u7684\u6301\u4e45\u5316\u667a\u80fd\u4f53\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Do Large Language Models (LLMs) possess genuine structural reasoning, or merely rely on surface-level pattern matching? The financial domain, demanding numerical precision and multi-step logic over long contexts, is an ideal testbed. Existing benchmarks fail to capture real-world industrial complexity, predominantly relying on multiple-choice questions or single-hop QA over cropped tables while ignoring intricate cross-statement dynamics and temporal de-cumulation. To bridge this gap, we introduce FinIndices, a large-scale benchmark evaluating data-processing fidelity over uncropped financial statements (up to 32K tokens). Utilizing an automated synthesis pipeline with adversarial traps, FinIndices encompasses Single-Index computation and Table-Index tabulation to test complex domain, temporal, and caliber reasoning. Our evaluation reveals two severe LLM vulnerabilities. First, a \"Knowledge Bottleneck\": despite memorizing formulas during pre-training, models demonstrate fragile pattern matching. Removing explicit formula hints causes performance to collapse (e.g., Gemini-3.1-Pro drops from 70.70% to 38.22% on table tasks), exposing fatal flaws in temporal de-cumulation and stock-flow caliber mismatch. Second, a \"Structural Bottleneck\": the intense cognitive load of generating multi-metric, multi-period tables actively drains reasoning capacity. Under structural pressure, LLMs that flawlessly execute isolated derivations regress to shallow heuristics, such as fetching incorrect adjacent columns or substituting deep accounting adjustments with lazy literal arithmetic. Finally, Supervised Fine-Tuning (SFT) yields substantial zero-hint gains (+8.54% Single, +3.82% Table), validating that structured logic can be partially restored via data-centric alignment.", "arxiv_id": "2607.28661", "arxiv_url": "https://arxiv.org/abs/2607.28661", "authors": ["Xinke Tong", "Xuanming Zhang", "Tianyi Tang", "An Yang", "Jiatu Hu", "Guojie Lin", "Zhenzhen Shi", "Lingfeng Zeng", "Boyu Yang", "Bing Zhao", "Hu Wei", "Lin Qu", "Dayiheng Liu"], "brief": "\u8bba\u6587\u63d0\u51fa FinIndices\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u672a\u88c1\u526a\u8d22\u52a1\u62a5\u8868\u7684\u957f\u4e0a\u4e0b\u6587\u91d1\u878d\u63a8\u7406\u57fa\u51c6\uff0c\u8986\u76d6\u6700\u957f 32K tokens \u7684\u62a5\u8868\u5904\u7406\u3002\u5b83\u901a\u8fc7\u81ea\u52a8\u5408\u6210\u4e0e\u5bf9\u6297\u9677\u9631\uff0c\u8bc4\u4f30\u6a21\u578b\u5728\u5355\u6307\u6807\u8ba1\u7b97\u548c\u591a\u671f\u591a\u6307\u6807\u8868\u683c\u751f\u6210\u4e2d\u7684\u7ed3\u6784\u5316\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.28661", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u201c\u77e5\u8bc6\u74f6\u9888\u201d\uff1a\u6a21\u578b\u867d\u8bb0\u4f4f\u8d22\u52a1\u516c\u5f0f\uff0c\u4f46\u7f3a\u5c11\u663e\u5f0f\u516c\u5f0f\u63d0\u793a\u65f6\u6027\u80fd\u5927\u5e45\u4e0b\u964d\uff0c\u5982 Gemini-3.1-Pro \u8868\u683c\u4efb\u52a1\u4ece 70.70% \u964d\u81f3 38.22%\u3002", "\u53d1\u73b0\u201c\u7ed3\u6784\u74f6\u9888\u201d\uff1a\u591a\u6307\u6807\u3001\u591a\u671f\u95f4\u8868\u683c\u751f\u6210\u4f1a\u663e\u8457\u6d88\u8017\u63a8\u7406\u80fd\u529b\uff0c\u6a21\u578b\u5bb9\u6613\u9000\u5316\u4e3a\u53d6\u76f8\u90bb\u5217\u3001\u5b57\u9762\u7b97\u672f\u7b49\u6d45\u5c42\u542f\u53d1\u5f0f\u3002", "\u76d1\u7763\u5fae\u8c03\u53ef\u90e8\u5206\u4fee\u590d\u7ed3\u6784\u5316\u903b\u8f91\uff0c\u5728\u65e0\u63d0\u793a\u6761\u4ef6\u4e0b\u5e26\u6765\u660e\u663e\u63d0\u5347\uff1a\u5355\u6307\u6807 +8.54%\uff0c\u8868\u683c\u4efb\u52a1 +3.82%\u3002"], "keywords": ["\u91d1\u878d\u63a8\u7406", "\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2607.28661v1", "published_at": "2026-07-22", "score": 0.507, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28661.png", "title": "Are the Financial Reasoning from LLMs Credible? A Real World Test over Long-Horizon Statements", "tldr": "FinIndices\u63ed\u793aLLM\u957f\u8d22\u62a5\u63a8\u7406\u8106\u5f31\u6027", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa FinIndices\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u672a\u88c1\u526a\u8d22\u52a1\u62a5\u8868\u7684\u957f\u4e0a\u4e0b\u6587\u91d1\u878d\u63a8\u7406\u57fa\u51c6\uff0c\u8986\u76d6\u6700\u957f 32K tokens \u7684\u62a5\u8868\u5904\u7406\u3002\u5b83\u901a\u8fc7\u81ea\u52a8\u5408\u6210\u4e0e\u5bf9\u6297\u9677\u9631\uff0c\u8bc4\u4f30\u6a21\u578b\u5728\u5355\u6307\u6807\u8ba1\u7b97\u548c\u591a\u671f\u591a\u6307\u6807\u8868\u683c\u751f\u6210\u4e2d\u7684\u7ed3\u6784\u5316\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u91d1\u878d\u63a8\u7406\u8bc4\u6d4b\u4ece\u7b80\u5316\u95ee\u7b54\u63a8\u8fdb\u5230\u771f\u5b9e\u957f\u62a5\u8868\u573a\u666f\uff0c\u63ed\u793a\u5f53\u524d LLM \u5728\u6570\u503c\u7cbe\u5ea6\u3001\u65f6\u5e8f\u53bb\u7d2f\u79ef\u548c\u4f1a\u8ba1\u53e3\u5f84\u5339\u914d\u4e0a\u7684\u7cfb\u7edf\u6027\u7f3a\u9677\uff0c\u5bf9\u91d1\u878d\u573a\u666f\u843d\u5730\u548c\u957f\u4e0a\u4e0b\u6587\u8bc4\u6d4b\u5177\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Text-to-image (T2I) models can produce visually compelling images, yet they remain limited on open-world tasks that require complex semantic understanding, multi-step reasoning, and the integration of external world knowledge. Existing efforts introduce agent capabilities into image generation, but they either prescribe a fixed workflow or place only a subset of the open-world image generation process under agent control. Consequently, reasoning, tool invocation, and image generation are not coordinated by a single policy. We propose ToolArtist, a fully agentic image generation model obtained by post-training a Unified Multimodal Model (UMM). ToolArtist dynamically orchestrates reasoning, external tool use, and native image generation within one unified policy. During Supervised Fine-Tuning (SFT), we equip a teacher agent with search tools alongside an image-generation tool. We then convert the collected trajectories into a UMM compatible format, where the image-generation tool is concealed while the resulting generated images are retained. During Reinforcement Learning (RL), we develop an agentic RL infrastructure for UMMs and introduce Reason-Act-Draw GRPO (RAD-GRPO), which uses complementary intent and quality rewards to jointly optimize the model. Experiments show that placing the entire open-world image-generation process under an agent policy consistently outperforms approaches with fixed pipelines or only partially agent-controlled components. We release the training data and the complete post-training infrastructure.", "arxiv_id": "2608.04436", "arxiv_url": "https://arxiv.org/abs/2608.04436", "authors": ["Jiahao Zhao", "Xiaomin Yu", "Zhongxiang Sun", "Fengwei Teng", "Chengwei Qin", "Xiaobin Hu", "Jun Xu", "Shuicheng Yan"], "brief": "\u8bba\u6587\u63d0\u51fa ToolArtist\uff0c\u901a\u8fc7\u540e\u8bad\u7ec3\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\uff0c\u4f7f\u5176\u5728\u5f00\u653e\u4e16\u754c\u56fe\u50cf\u751f\u6210\u4e2d\u7531\u540c\u4e00\u7b56\u7565\u52a8\u6001\u534f\u8c03\u63a8\u7406\u3001\u5916\u90e8\u5de5\u5177\u8c03\u7528\u4e0e\u539f\u751f\u56fe\u50cf\u751f\u6210\u3002\u65b9\u6cd5\u5305\u542b\u6559\u5e08\u667a\u80fd\u4f53\u8f68\u8ff9\u84b8\u998f\u5f0f SFT\uff0c\u4ee5\u53ca\u9762\u5411 UMM \u7684\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u548c RAD-GRPO \u4f18\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04436", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SFT \u9636\u6bb5\u8ba9\u6559\u5e08\u667a\u80fd\u4f53\u4f7f\u7528\u641c\u7d22\u5de5\u5177\u548c\u56fe\u50cf\u751f\u6210\u5de5\u5177\u6536\u96c6\u8f68\u8ff9\uff0c\u518d\u8f6c\u6362\u4e3a UMM \u53ef\u8bad\u7ec3\u683c\u5f0f\uff0c\u5e76\u9690\u85cf\u751f\u56fe\u5de5\u5177\u3001\u4fdd\u7559\u751f\u6210\u7ed3\u679c\u3002", "RL \u9636\u6bb5\u63d0\u51fa Reason-Act-Draw GRPO\uff0c\u7ed3\u5408\u610f\u56fe\u5956\u52b1\u4e0e\u56fe\u50cf\u8d28\u91cf\u5956\u52b1\uff0c\u8054\u5408\u4f18\u5316\u63a8\u7406\u3001\u884c\u52a8\u548c\u7ed8\u56fe\u80fd\u529b\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u5c06\u5f00\u653e\u4e16\u754c\u56fe\u50cf\u751f\u6210\u5168\u6d41\u7a0b\u7f6e\u4e8e\u5355\u4e00\u667a\u80fd\u4f53\u7b56\u7565\u4e0b\uff0c\u4f18\u4e8e\u56fa\u5b9a\u6d41\u6c34\u7ebf\u6216\u4ec5\u90e8\u5206\u7ec4\u4ef6\u7531\u667a\u80fd\u4f53\u63a7\u5236\u7684\u65b9\u6cd5\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u56fe\u50cf\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04436v1", "published_at": "2026-08-05", "score": 0.507, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04436.png", "title": "ToolArtist: Tool-Using Unified Multimodal Models for Agentic Image Generation", "tldr": "\u7edf\u4e00\u7b56\u7565\u9a71\u52a8\u63a8\u7406\u3001\u7528\u5de5\u5177\u4e0e\u751f\u56fe", "upvotes": 22, "what_it_is": "\u8bba\u6587\u63d0\u51fa ToolArtist\uff0c\u901a\u8fc7\u540e\u8bad\u7ec3\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\uff0c\u4f7f\u5176\u5728\u5f00\u653e\u4e16\u754c\u56fe\u50cf\u751f\u6210\u4e2d\u7531\u540c\u4e00\u7b56\u7565\u52a8\u6001\u534f\u8c03\u63a8\u7406\u3001\u5916\u90e8\u5de5\u5177\u8c03\u7528\u4e0e\u539f\u751f\u56fe\u50cf\u751f\u6210\u3002\u65b9\u6cd5\u5305\u542b\u6559\u5e08\u667a\u80fd\u4f53\u8f68\u8ff9\u84b8\u998f\u5f0f SFT\uff0c\u4ee5\u53ca\u9762\u5411 UMM \u7684\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u548c RAD-GRPO \u4f18\u5316\u3002", "why_notable": "\u5b83\u628a\u5de5\u5177\u4f7f\u7528\u3001\u77e5\u8bc6\u68c0\u7d22\u3001\u591a\u6b65\u63a8\u7406\u548c\u56fe\u50cf\u751f\u6210\u6574\u5408\u5230\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u5355\u4e00\u7b56\u7565\u4e2d\uff0c\u63a8\u52a8 T2I \u4ece\u9759\u6001\u751f\u6210\u5668\u8d70\u5411\u53ef\u81ea\u4e3b\u89c4\u5212\u7684\u667a\u80fd\u4f53\u5f0f\u521b\u4f5c\u7cfb\u7edf\uff0c\u5e76\u5f00\u6e90\u8bad\u7ec3\u6570\u636e\u4e0e\u540e\u8bad\u7ec3\u57fa\u7840\u8bbe\u65bd\u3002"}, {"abstract": "LLM agents are increasingly applied to open-ended everyday requests that span work, study, and life. These tasks are long-horizon, cross-environment, and multimodal, forcing the agent to preserve goals and constraints across many steps while navigating heterogeneous tools and attachments. While prior work has addressed individual failure modes such as goals drift, states loss, and context overflow, whether a single harness can manage them jointly and remain effective across backends has received less study. We present OneDayAgent, a long-horizon harness for autonomous agents. OneDayAgent turns an open-ended request into a managed execution process that decomposes tasks into bounded subtasks, maintains execution memory under context pressure, and verifies and repairs the final deliverable. We evaluate OneDayAgent on AgentIF-OneDay across 104 tasks. With the GLM-5.2 backend, OneDayAgent sets a new state of the art with an overall score of 0.821. The same harness runs across five backend LLMs from three model families, indicating the harness generalizes across backends without tuning, even as different models induce distinct execution styles under the same workflow.", "arxiv_id": "2608.05013", "arxiv_url": "https://arxiv.org/abs/2608.05013", "authors": ["Jingsheng Zheng", "Xinyuan Fang", "Jintian Zhang", "Zhengke Gui", "Huajun Chen", "Ningyu Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa OneDayAgent\uff0c\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f\u65e5\u5e38\u8bf7\u6c42\u7684\u957f\u7a0b\u81ea\u4e3b\u667a\u80fd\u4f53 harness\u3002\u5b83\u5c06\u4efb\u52a1\u62c6\u89e3\u4e3a\u6709\u8fb9\u754c\u7684\u5b50\u4efb\u52a1\uff0c\u5728\u4e0a\u4e0b\u6587\u538b\u529b\u4e0b\u7ef4\u62a4\u6267\u884c\u8bb0\u5fc6\uff0c\u5e76\u5bf9\u6700\u7ec8\u4ea4\u4ed8\u7269\u8fdb\u884c\u9a8c\u8bc1\u4e0e\u4fee\u590d\u3002", "categories": ["cs.CL", "cs.AI", "cs.HC", "cs.LG", "cs.MA"], "github_repo": "https://github.com/zjunlp/OneDayAgent", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05013", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9762\u5411\u5de5\u4f5c\u3001\u5b66\u4e60\u3001\u751f\u6d3b\u7b49\u957f\u7a0b\u3001\u8de8\u73af\u5883\u3001\u591a\u6a21\u6001\u4efb\u52a1\uff0c\u8054\u5408\u5904\u7406\u76ee\u6807\u6f02\u79fb\u3001\u72b6\u6001\u4e22\u5931\u548c\u4e0a\u4e0b\u6587\u6ea2\u51fa\u7b49\u95ee\u9898", "\u5728 AgentIF-OneDay \u7684 104 \u4e2a\u4efb\u52a1\u4e0a\u8bc4\u6d4b\uff0c\u7ed3\u5408 GLM-5.2 \u540e\u7aef\u53d6\u5f97 0.821 \u603b\u5206\uff0c\u8fbe\u5230\u65b0\u7684\u6700\u4f73\u7ed3\u679c", "\u540c\u4e00\u6846\u67b6\u53ef\u8fd0\u884c\u5728\u6765\u81ea\u4e09\u4e2a\u6a21\u578b\u5bb6\u65cf\u7684\u4e94\u4e2a\u540e\u7aef LLM \u4e0a\uff0c\u65e0\u9700\u9488\u5bf9\u6a21\u578b\u8c03\u53c2\uff0c\u663e\u793a\u51fa\u8f83\u597d\u7684\u540e\u7aef\u6cdb\u5316\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1", "\u4efb\u52a1\u89c4\u5212", "\u6267\u884c\u8bb0\u5fc6"], "num_comments": 1, "on_hf": true, "organization": "ZJUNLP", "pdf_url": "https://arxiv.org/pdf/2608.05013v1", "published_at": "2026-08-04", "score": 0.496, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05013.png", "title": "OneDayAgent: Towards a Long-Horizon Harness for Autonomous Agents", "tldr": "\u957f\u7a0b\u81ea\u4e3b\u667a\u80fd\u4f53\u901a\u7528\u6267\u884c\u6846\u67b6\u5237\u65b0\u57fa\u51c6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa OneDayAgent\uff0c\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f\u65e5\u5e38\u8bf7\u6c42\u7684\u957f\u7a0b\u81ea\u4e3b\u667a\u80fd\u4f53 harness\u3002\u5b83\u5c06\u4efb\u52a1\u62c6\u89e3\u4e3a\u6709\u8fb9\u754c\u7684\u5b50\u4efb\u52a1\uff0c\u5728\u4e0a\u4e0b\u6587\u538b\u529b\u4e0b\u7ef4\u62a4\u6267\u884c\u8bb0\u5fc6\uff0c\u5e76\u5bf9\u6700\u7ec8\u4ea4\u4ed8\u7269\u8fdb\u884c\u9a8c\u8bc1\u4e0e\u4fee\u590d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8\u957f\u7a0b\u667a\u80fd\u4f53\u4ece\u89c4\u5212\u3001\u8bb0\u5fc6\u5230\u4ea4\u4ed8\u9a8c\u8bc1\u7684\u5b8c\u6574\u6267\u884c\u95ed\u73af\uff0c\u800c\u975e\u5355\u70b9\u80fd\u529b\u4f18\u5316\uff1b\u5176\u8de8\u6a21\u578b\u901a\u7528\u6027\u8868\u660e\uff0c\u53ef\u9760\u667a\u80fd\u4f53\u7cfb\u7edf\u53ef\u80fd\u66f4\u591a\u4f9d\u8d56\u4e8e\u6267\u884c\u6846\u67b6\u4e0e\u6d41\u7a0b\u8bbe\u8ba1\u3002"}, {"abstract": "World Action Models (WAMs) have emerged as a promising paradigm by jointly modeling robot actions and future visual dynamics. However, their reliance on pixel-generative future supervision can entangle action-relevant state transitions with task-irrelevant visual content, limiting robustness under visual distribution shifts. We identify Training-Distribution Hallucination, a recurring phenomenon in which futures conditioned on visually shifted observations hallucinate training-domain content rather than remain faithful to the current scene. A controlled frame-triplet diagnosis further shows that DINOv3 features remain more stable across visual shifts while better preserving task-state distinctions than Wan-VAE latents. Rather than correcting the predicted futures, we propose Semantic-Temporal WAM (ST-WAM) to improve action robustness by using DINOv3 as a shared semantic representation for future prediction and history retrieval while retaining fine-grained VAE dynamics. Its Dual-Space Future Experts (DSFE) jointly predict future VAE latents and DINO features, while Current-Anchored Intent Retrieval (CAIR) retrieves task-relevant evidence from recent DINO history under the current visual-language context. ST-WAM is trained end-to-end without additional embodied pretraining or task-specific annotations, and requires no explicit future generation at inference. It achieves 98.7% on LIBERO and 92.8% on RoboTwin 2.0; more importantly, compared with Fast-WAM, it improves zero-shot LIBERO-Plus performance by 21.3 percentage points and more than doubles real-world success under visual shifts from 25.8% to 61.5%. These results demonstrate that semantic-temporal modeling effectively complements pixel-generative dynamics for robust manipulation.", "arxiv_id": "2607.28993", "arxiv_url": "https://arxiv.org/abs/2607.28993", "authors": ["Mingxin Wang", "Bin Hu", "Bin Qian", "Kaitao Jiang", "Haoning Wu", "Feng Yan", "Bowen Jing", "Ruiyang Hao", "Enyi Wang", "Kangning Niu", "Yandan Yang", "Mu Xu", "Yan Wang", "Houde Liu", "Tianlun Li"], "brief": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5728\u89c6\u89c9\u5206\u5e03\u504f\u79fb\u4e0b\u4f1a\u4ea7\u751f\u201c\u8bad\u7ec3\u5206\u5e03\u5e7b\u89c9\u201d\uff0c\u628a\u672a\u6765\u9884\u6d4b\u62c9\u56de\u8bad\u7ec3\u57df\u89c6\u89c9\u5185\u5bb9\u3002\u4e3a\u6b64\u63d0\u51fa ST-WAM\uff0c\u5c06 DINOv3 \u8bed\u4e49\u7279\u5f81\u4e0e VAE \u52a8\u6001\u7ed3\u5408\uff0c\u7528\u4e8e\u672a\u6765\u9884\u6d4b\u548c\u5386\u53f2\u68c0\u7d22\uff0c\u4ece\u800c\u63d0\u5347\u673a\u5668\u4eba\u64cd\u63a7\u7b56\u7565\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/Thu-WangMX/ST-WAM-Semantic-Temporal-World-Action-Model", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2607.28993", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u53d7\u63a7\u5e27\u4e09\u5143\u7ec4\u8bca\u65ad\u53d1\u73b0\uff0cDINOv3 \u7279\u5f81\u76f8\u6bd4 Wan-VAE \u6f5c\u53d8\u91cf\u5728\u89c6\u89c9\u504f\u79fb\u4e0b\u66f4\u7a33\u5b9a\uff0c\u540c\u65f6\u66f4\u80fd\u4fdd\u7559\u4efb\u52a1\u72b6\u6001\u5dee\u5f02\u3002", "\u63d0\u51fa\u53cc\u7a7a\u95f4\u672a\u6765\u4e13\u5bb6 DSFE\uff0c\u540c\u65f6\u9884\u6d4b\u672a\u6765 VAE \u6f5c\u53d8\u91cf\u4e0e DINO \u8bed\u4e49\u7279\u5f81\uff0c\u517c\u987e\u7ec6\u7c92\u5ea6\u52a8\u6001\u4e0e\u8bed\u4e49\u7a33\u5065\u6027\u3002", "\u63d0\u51fa\u5f53\u524d\u951a\u5b9a\u610f\u56fe\u68c0\u7d22 CAIR\uff0c\u5728\u5f53\u524d\u89c6\u89c9-\u8bed\u8a00\u4e0a\u4e0b\u6587\u4e0b\u4ece\u8fd1\u671f DINO \u5386\u53f2\u4e2d\u68c0\u7d22\u4efb\u52a1\u76f8\u5173\u8bc1\u636e\uff1b\u63a8\u7406\u65f6\u65e0\u9700\u663e\u5f0f\u751f\u6210\u672a\u6765\u5e27\u3002", "\u5728 LIBERO \u8fbe\u5230 98.7%\u3001RoboTwin 2.0 \u8fbe\u5230 92.8%\uff1bLIBERO-Plus \u96f6\u6837\u672c\u8f83 Fast-WAM \u63d0\u5347 21.3 \u4e2a\u767e\u5206\u70b9\uff0c\u771f\u5b9e\u573a\u666f\u89c6\u89c9\u504f\u79fb\u6210\u529f\u7387\u4ece 25.8% \u63d0\u5347\u81f3 61.5%\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u63a7", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u6cdb\u5316", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2607.28993v1", "published_at": "2026-07-31", "score": 0.489, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.28993.png", "title": "ST-WAM: Semantic-Temporal World Action Model for Robust Manipulation under Visual Distribution Shifts", "tldr": "\u7528\u8bed\u4e49\u65f6\u5e8f\u5efa\u6a21\u63d0\u5347\u89c6\u89c9\u8fc1\u79fb\u4e0b\u64cd\u63a7\u9c81\u68d2\u6027", "upvotes": 6, "what_it_is": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5728\u89c6\u89c9\u5206\u5e03\u504f\u79fb\u4e0b\u4f1a\u4ea7\u751f\u201c\u8bad\u7ec3\u5206\u5e03\u5e7b\u89c9\u201d\uff0c\u628a\u672a\u6765\u9884\u6d4b\u62c9\u56de\u8bad\u7ec3\u57df\u89c6\u89c9\u5185\u5bb9\u3002\u4e3a\u6b64\u63d0\u51fa ST-WAM\uff0c\u5c06 DINOv3 \u8bed\u4e49\u7279\u5f81\u4e0e VAE \u52a8\u6001\u7ed3\u5408\uff0c\u7528\u4e8e\u672a\u6765\u9884\u6d4b\u548c\u5386\u53f2\u68c0\u7d22\uff0c\u4ece\u800c\u63d0\u5347\u673a\u5668\u4eba\u64cd\u63a7\u7b56\u7565\u7684\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u9c81\u68d2\u8bed\u4e49\u8868\u5f81\u5f15\u5165\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff0c\u7f13\u89e3\u50cf\u7d20\u7ea7\u672a\u6765\u751f\u6210\u5bf9\u65e0\u5173\u89c6\u89c9\u5185\u5bb9\u7684\u8fc7\u62df\u5408\uff0c\u5bf9\u771f\u5b9e\u673a\u5668\u4eba\u5728\u5149\u7167\u3001\u80cc\u666f\u3001\u6750\u8d28\u7b49\u53d8\u5316\u4e0b\u7684\u6cdb\u5316\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "MLLM-based segmentation faces a core segmentation trilemma: high segmentation performance, preserved dialogue ability, and fast inference. Embedding-prediction methods may disrupt language modeling through pixel-level objectives, whereas next-token generation is inefficient for dense masks. We propose All-Mask Prediction, decoupling autoregressive dialogue from non-autoregressive mask prediction. Its binary instantiation, STAMP (Simultaneous Textual All-Mask Prediction), emits an in-vocabulary \u003cSEG\u003e trigger, fuses image-aligned mask tokens with corresponding patch features, and uses hybrid attention to classify all tokens as foreground or background in one pass. It thereby combines strong referring and reasoning segmentation with preserved multimodal ability and efficient inference. However, binary masks cannot retain multiple semantic or instance identities without repeated target-specific predictions. We therefore propose Structured All-Mask Prediction and develop STAMPlus. It generates a target list with explicit IDs and optional boxes, binds these IDs to a shared multi-class mask space, and jointly predicts all targets in one non-autoregressive pass. A single unified checkpoint retains STAMP\u0027s referring and reasoning capabilities while extending to open-vocabulary semantic, instance-aware, and remote-sensing small-target segmentation, where high-resolution mask-token scaling preserves finer spatial evidence. Across these settings, STAMPlus achieves state-of-the-art segmentation performance, preserves general multimodal instruction following, and reduces 12-category latency from 13.50s for repeated STAMP inference to 5.16s. Further analyses show that accurate target cues improve segmentation and learned spatial grounding benefits look-twice reasoning. Overall, STAMPlus resolves the trilemma beyond single-target prediction.", "arxiv_id": "2608.02791", "arxiv_url": "https://arxiv.org/abs/2608.02791", "authors": ["Jiazhen Liu", "Mingkuan Feng", "Long Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u7ed3\u6784\u5316\u5168\u63a9\u7801\u9884\u6d4b\u6846\u67b6 STAMPlus\uff0c\u5c06\u81ea\u56de\u5f52\u5bf9\u8bdd\u4e0e\u975e\u81ea\u56de\u5f52\u63a9\u7801\u9884\u6d4b\u89e3\u8026\u3002\u5b83\u901a\u8fc7\u751f\u6210\u5e26\u663e\u5f0f ID \u548c\u53ef\u9009\u6846\u7684\u76ee\u6807\u5217\u8868\uff0c\u628a\u591a\u76ee\u6807\u7ed1\u5b9a\u5230\u5171\u4eab\u591a\u7c7b\u63a9\u7801\u7a7a\u95f4\uff0c\u4e00\u6b21\u524d\u5411\u5b8c\u6210\u8bed\u4e49\u3001\u5b9e\u4f8b\u548c\u5c0f\u76ee\u6807\u5206\u5272\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/HKUST-LongGroup/STAMP", "github_stars": 40, "hf_url": "https://huggingface.co/papers/2608.02791", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5148\u63d0\u51fa\u4e8c\u503c\u7248\u672c STAMP\uff1a\u7528\u8bcd\u8868\u5185 \u003cSEG\u003e \u89e6\u53d1\u7b26\u3001\u56fe\u50cf\u5bf9\u9f50\u63a9\u7801 token \u4e0e patch \u7279\u5f81\u878d\u5408\uff0c\u5e76\u901a\u8fc7\u6df7\u5408\u6ce8\u610f\u529b\u4e00\u6b21\u6027\u5224\u522b\u524d\u666f/\u80cc\u666f\u3002", "STAMPlus \u6269\u5c55\u5230\u7ed3\u6784\u5316\u591a\u76ee\u6807\u5206\u5272\uff1a\u751f\u6210\u76ee\u6807 ID \u5217\u8868\u5e76\u8054\u5408\u9884\u6d4b\u6240\u6709\u76ee\u6807\uff0c\u907f\u514d\u5bf9\u6bcf\u4e2a\u7c7b\u522b\u6216\u5b9e\u4f8b\u53cd\u590d\u63a8\u7406\u3002", "\u5728\u6307\u4ee3\u8868\u8fbe\u5206\u5272\u3001\u63a8\u7406\u5206\u5272\u3001\u5f00\u653e\u8bcd\u6c47\u8bed\u4e49\u5206\u5272\u3001\u5b9e\u4f8b\u611f\u77e5\u5206\u5272\u548c\u9065\u611f\u5c0f\u76ee\u6807\u5206\u5272\u4e2d\u8fbe\u5230 SOTA\uff0c\u540c\u65f6\u5c06 12 \u7c7b\u522b\u5ef6\u8fdf\u4ece 13.50 \u79d2\u964d\u81f3 5.16 \u79d2\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u5206\u5272", "\u5f00\u653e\u8bcd\u6c47", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2608.02791v1", "published_at": "2026-08-03", "score": 0.488, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02791.png", "title": "Better, Stronger, Faster, and Broader: Structured All-Mask Prediction for MLLM-Based Segmentation", "tldr": "STAMPlus\u8ba9MLLM\u4e00\u6b21\u6027\u9ad8\u6548\u5206\u5272\u591a\u76ee\u6807", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u7ed3\u6784\u5316\u5168\u63a9\u7801\u9884\u6d4b\u6846\u67b6 STAMPlus\uff0c\u5c06\u81ea\u56de\u5f52\u5bf9\u8bdd\u4e0e\u975e\u81ea\u56de\u5f52\u63a9\u7801\u9884\u6d4b\u89e3\u8026\u3002\u5b83\u901a\u8fc7\u751f\u6210\u5e26\u663e\u5f0f ID \u548c\u53ef\u9009\u6846\u7684\u76ee\u6807\u5217\u8868\uff0c\u628a\u591a\u76ee\u6807\u7ed1\u5b9a\u5230\u5171\u4eab\u591a\u7c7b\u63a9\u7801\u7a7a\u95f4\uff0c\u4e00\u6b21\u524d\u5411\u5b8c\u6210\u8bed\u4e49\u3001\u5b9e\u4f8b\u548c\u5c0f\u76ee\u6807\u5206\u5272\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 MLLM \u5206\u5272\u4e2d\u6027\u80fd\u3001\u5bf9\u8bdd\u80fd\u529b\u548c\u63a8\u7406\u901f\u5ea6\u96be\u4ee5\u517c\u5f97\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u7edf\u4e00\u4e14\u9ad8\u6548\u7684\u975e\u81ea\u56de\u5f52\u63a9\u7801\u9884\u6d4b\u8303\u5f0f\uff1b\u76f8\u6bd4\u9010\u76ee\u6807\u751f\u6210\u6216\u50cf\u7d20\u7ea7\u5d4c\u5165\u9884\u6d4b\uff0c\u5b83\u66f4\u9002\u5408\u591a\u76ee\u6807\u5bc6\u96c6\u5206\u5272\uff0c\u5e76\u4fdd\u7559\u901a\u7528\u591a\u6a21\u6001\u6307\u4ee4\u8ddf\u968f\u80fd\u529b\u3002"}, {"abstract": "Personalized LLMs with persistent memory are increasingly deployed, yet the faithfulness of their user models remains unexamined. We study over-inference (OI): the phenomenon where LLMs fabricate user attributes beyond what evidence supports. We introduce MirageBench, comprising 150 personas balanced across stereotypical, counter-stereotypical, and neutral profiles, 6 personalization tasks spanning an ``imagination gradient\u0027\u0027, a four-way faithfulness taxonomy operationalized by an independent judge (validated against a blind human annotator on 400 claims: Cohen\u0027s kappa = 0.863 four-class, kappa = 0.900 binary), and a leaderboard of 12 models across 7 families on 143616 judged claims. We find that over-inference is pervasive: every one of the 12 models over-infers 35%--49% of its claims (cross-model mean 41.6%; claim-weighted 41.8%), with no model in this evaluation escaping it. Most strikingly, we surface a Self-Monitoring Inversion: at the model-selection level, models\u0027 self-assessed OI is negatively rank-correlated with their judge-measured OI (rho = -0.60, p = 0.044; exploratory, wide bootstrap CI [-0.90, +0.06], n = 12). The models that report the least over-inference tend to be flagged as fabricating the most, so self-reported confidence is a misleading signal for comparing models, even though within a single model self-audit still ranks that model\u0027s own claims moderately well (AUROC 0.58--0.83). We further show that OI is task-dependent (27%--59%) and that, in a multi-turn pilot, inferred attributes accumulate approximately linearly with little revision. MirageBench positions external verification, rather than model self-report, as a more reliable foundation for trustworthy personalization.", "arxiv_id": "2608.04570", "arxiv_url": "https://arxiv.org/abs/2608.04570", "authors": ["Yushi Sun", "Yanjie Zhang", "Rui Sheng"], "brief": "\u8bba\u6587\u7814\u7a76\u5e26\u6301\u4e45\u8bb0\u5fc6\u7684\u4e2a\u6027\u5316 LLM \u662f\u5426\u5fe0\u5b9e\u5efa\u6a21\u7528\u6237\uff0c\u805a\u7126\u201c\u8fc7\u5ea6\u63a8\u65ad\u201d\u73b0\u8c61\uff1a\u6a21\u578b\u751f\u6210\u7f3a\u4e4f\u8bc1\u636e\u652f\u6301\u7684\u7528\u6237\u5c5e\u6027\u3002\u4f5c\u8005\u63d0\u51fa MirageBench\uff0c\u8986\u76d6150\u4e2a\u7528\u6237\u753b\u50cf\u30016\u7c7b\u4e2a\u6027\u5316\u4efb\u52a1\uff0c\u5e76\u7528\u72ec\u7acb\u8bc4\u5224\u5668\u8bc4\u4f3012\u4e2a\u6a21\u578b\u7684143616\u6761\u58f0\u660e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04570", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["12\u4e2a\u6a21\u578b\u5747\u5b58\u5728\u663e\u8457\u8fc7\u5ea6\u63a8\u65ad\uff0c\u6bd4\u4f8b\u4e3a35%--49%\uff0c\u8de8\u6a21\u578b\u5e73\u5747\u7ea641.6%\u3002", "\u63d0\u51fa\u56db\u5206\u7c7b\u5fe0\u5b9e\u6027\u8bc4\u4f30\u4f53\u7cfb\uff0c\u5e76\u4e0e\u76f2\u4eba\u7c7b\u6807\u6ce8\u9a8c\u8bc1\u4e00\u81f4\u6027\u8f83\u9ad8\uff0c\u56db\u5206\u7c7b Cohen\u0027s kappa \u4e3a0.863\u3002", "\u53d1\u73b0\u201c\u81ea\u6211\u76d1\u63a7\u53cd\u8f6c\u201d\uff1a\u6a21\u578b\u81ea\u8bc4\u8fc7\u5ea6\u63a8\u65ad\u8d8a\u5c11\uff0c\u5916\u90e8\u8bc4\u5224\u4e2d\u53cd\u800c\u5f80\u5f80\u8fc7\u5ea6\u63a8\u65ad\u8d8a\u591a\uff0c\u8bf4\u660e\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u4e0d\u9002\u5408\u7528\u4e8e\u6a21\u578b\u6bd4\u8f83\u3002"], "keywords": ["\u4e2a\u6027\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u4fe1\u8bc4\u4f30", "\u8bb0\u5fc6"], "num_comments": 1, "on_hf": true, "organization": "HKUST", "pdf_url": "https://arxiv.org/pdf/2608.04570v1", "published_at": "2026-08-05", "score": 0.485, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04570.png", "title": "The Personalization Mirage: How LLMs Fabricate User Profiles, and Why Self-Monitoring Misleads", "tldr": "LLM\u4e2a\u6027\u5316\u4f1a\u7cfb\u7edf\u6027\u7f16\u9020\u7528\u6237\u753b\u50cf", "upvotes": 21, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5e26\u6301\u4e45\u8bb0\u5fc6\u7684\u4e2a\u6027\u5316 LLM \u662f\u5426\u5fe0\u5b9e\u5efa\u6a21\u7528\u6237\uff0c\u805a\u7126\u201c\u8fc7\u5ea6\u63a8\u65ad\u201d\u73b0\u8c61\uff1a\u6a21\u578b\u751f\u6210\u7f3a\u4e4f\u8bc1\u636e\u652f\u6301\u7684\u7528\u6237\u5c5e\u6027\u3002\u4f5c\u8005\u63d0\u51fa MirageBench\uff0c\u8986\u76d6150\u4e2a\u7528\u6237\u753b\u50cf\u30016\u7c7b\u4e2a\u6027\u5316\u4efb\u52a1\uff0c\u5e76\u7528\u72ec\u7acb\u8bc4\u5224\u5668\u8bc4\u4f3012\u4e2a\u6a21\u578b\u7684143616\u6761\u58f0\u660e\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u4e2a\u6027\u5316 LLM \u548c\u957f\u671f\u8bb0\u5fc6\u7cfb\u7edf\u4e2d\u7684\u5173\u952e\u53ef\u4fe1\u6027\u98ce\u9669\uff1a\u6a21\u578b\u53ef\u80fd\u5728\u7f3a\u4e4f\u8bc1\u636e\u65f6\u4e3b\u52a8\u8865\u5168\u751a\u81f3\u7f16\u9020\u7528\u6237\u7279\u5f81\u3002MirageBench \u4e3a\u8bc4\u4f30\u4e2a\u6027\u5316\u6a21\u578b\u7684\u5fe0\u5b9e\u6027\u63d0\u4f9b\u4e86\u7cfb\u7edf\u57fa\u51c6\uff0c\u5e76\u5f3a\u8c03\u5916\u90e8\u9a8c\u8bc1\u6bd4\u6a21\u578b\u81ea\u6211\u62a5\u544a\u66f4\u53ef\u9760\u3002"}, {"abstract": "Video world models predict future observations conditioned on historical observations and control signals, enabling long-horizon generation through autoregressive state transitions. Unlike conventional video generation models that primarily capture visual appearance and motion, video world models learn the underlying dynamics governing environment evolution under agent actions, providing a foundation for embodied AI and interactive simulation. Recent progress has largely relied on adapting pretrained video generation models through post-training or distillation. Although effective, these approaches often require complex training pipelines, substantial computational resources, and suffer from the mismatch between bidirectional pretraining and causal streaming inference. Recent studies have shown that training autoregressive video world models from scratch is feasible and scalable. However, the community still lacks a lightweight, transparent, and fully reproducible baseline trainable end-to-end with modest computational resources. We present MiniWorld, a reproducible framework for training streaming video world models from scratch. MiniWorld employs a block-causal Video Diffusion Transformer trained with Flow Matching in the latent space of a pretrained Video VAE. Building on Diffusion Forcing, it adopts a chunk-wise non-decreasing noise schedule and two-stage continued training to improve temporal modeling and stability. During inference, MiniWorld combines a rolling KV cache with pipelined asynchronous denoising for efficient streaming generation under bounded computation. The entire model can be trained within several days on a single 8-GPU server. By releasing the training and inference codebase and pretrained checkpoints, we hope MiniWorld will facilitate future research on video world modeling.", "arxiv_id": "2608.01127", "arxiv_url": "https://arxiv.org/abs/2608.01127", "authors": ["Yian Zhao", "Ruochong Zheng", "Hongcan Guo", "Yu Yan", "Jian Zhang", "Jie Chen"], "brief": "MiniWorld \u662f\u4e00\u4e2a\u4ece\u96f6\u8bad\u7ec3\u6d41\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u53ef\u590d\u73b0\u6846\u67b6\uff0c\u7528\u5386\u53f2\u89c2\u6d4b\u548c\u63a7\u5236\u4fe1\u53f7\u9884\u6d4b\u672a\u6765\u89c2\u6d4b\u3002\u5b83\u63d0\u4f9b\u8bad\u7ec3\u3001\u63a8\u7406\u4ee3\u7801\u4e0e\u9884\u8bad\u7ec3\u6743\u91cd\uff0c\u76ee\u6807\u662f\u5728\u8f83\u4f4e\u7b97\u529b\u4e0b\u63a8\u52a8\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7814\u7a76\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/zhao-yian/MiniWorld", "github_stars": 25, "hf_url": "https://huggingface.co/papers/2608.01127", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 block-causal Video Diffusion Transformer\uff0c\u5728\u9884\u8bad\u7ec3 Video VAE \u7684\u6f5c\u7a7a\u95f4\u4e2d\u7528 Flow Matching \u8bad\u7ec3", "\u501f\u9274 Diffusion Forcing\uff0c\u4f7f\u7528\u5206\u5757\u975e\u9012\u51cf\u566a\u58f0\u8c03\u5ea6\u4e0e\u4e24\u9636\u6bb5\u7ee7\u7eed\u8bad\u7ec3\uff0c\u63d0\u5347\u957f\u65f6\u5e8f\u5efa\u6a21\u7a33\u5b9a\u6027", "\u63a8\u7406\u9636\u6bb5\u7ed3\u5408\u6eda\u52a8 KV cache \u4e0e\u6d41\u6c34\u7ebf\u5f02\u6b65\u53bb\u566a\uff0c\u5b9e\u73b0\u6709\u754c\u8ba1\u7b97\u4e0b\u7684\u9ad8\u6548\u6d41\u5f0f\u751f\u6210"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2608.01127v2", "published_at": "2026-08-02", "score": 0.483, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01127.png", "title": "MiniWorld: Democratizing the Training of Video World Models from Scratch", "tldr": "\u4ece\u96f6\u8bad\u7ec3\u8f7b\u91cf\u53ef\u590d\u73b0\u89c6\u9891\u4e16\u754c\u6a21\u578b", "upvotes": 9, "what_it_is": "MiniWorld \u662f\u4e00\u4e2a\u4ece\u96f6\u8bad\u7ec3\u6d41\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u53ef\u590d\u73b0\u6846\u67b6\uff0c\u7528\u5386\u53f2\u89c2\u6d4b\u548c\u63a7\u5236\u4fe1\u53f7\u9884\u6d4b\u672a\u6765\u89c2\u6d4b\u3002\u5b83\u63d0\u4f9b\u8bad\u7ec3\u3001\u63a8\u7406\u4ee3\u7801\u4e0e\u9884\u8bad\u7ec3\u6743\u91cd\uff0c\u76ee\u6807\u662f\u5728\u8f83\u4f4e\u7b97\u529b\u4e0b\u63a8\u52a8\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7814\u7a76\u3002", "why_notable": "\u76f8\u6bd4\u4f9d\u8d56\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u590d\u6742\u65b9\u6848\uff0cMiniWorld \u5f3a\u8c03\u4ece\u96f6\u8bad\u7ec3\u3001\u900f\u660e\u53ef\u590d\u73b0\u548c\u4e2d\u7b49\u7b97\u529b\u53ef\u627f\u53d7\uff0c\u4e3a\u5177\u8eab\u667a\u80fd\u4e0e\u4ea4\u4e92\u5f0f\u4eff\u771f\u7684\u89c6\u9891\u4e16\u754c\u6a21\u578b\u63d0\u4f9b\u4e86\u5b9e\u7528\u57fa\u7ebf\u3002"}, {"abstract": "On-Policy distillation (OPD) transfers teacher capabilities by supervising student-sampled trajectories with dense token-level teacher signals. Recent selective OPD methods improve this process by prioritizing signals that are confident, informative, or learnable. However, the assumptions overlook a fundamental failure mode of language models: their token-level judgments can be driven by input-agnostic language priors, formatting conventions, or stereotyped reasoning templates rather than task-specific evidence. We refer to such optimization-relevant but weakly input-grounded supervision as spurious signals in OPD, which may produce large gradients while contributing little task-improving direction. To mitigate this issue, we propose SA-OPD, a Spurious-Signal-Aware On-Policy Distillation framework that identifies and filters misleading token-level supervision based on input-groundedness and optimization impact. SA-OPD introduces a lightweight input-groundedness proxy estimating whether a token-level distillation signal truly depends on the input. It then filters only tokens that simultaneously exhibit low input-groundedness and extreme distillation divergence, thereby removing high-impact spurious updates and achieving fine-grained OPD optimization. Extensive experiments on both large language model (LLM) and vision-language model (VLM) settings demonstrate that SA-OPD consistently outperforms Vanilla OPD and competitive selective methods. These results establish input-groundedness as a key dimension for OPD supervision selection and offer a simple, effective strategy for mitigating spurious updates.", "arxiv_id": "2608.03632", "arxiv_url": "https://arxiv.org/abs/2608.03632", "authors": ["Yinuo Jiang", "Yongjie Ye", "Zhou Tao", "Xiang Zhuang", "Qiang Zhang", "Huajun Chen", "Tiankai Li"], "brief": "\u8bba\u6587\u63d0\u51fa SA-OPD\uff0c\u4e00\u79cd\u4f2a\u4fe1\u53f7\u611f\u77e5\u7684\u5728\u7b56\u7565\u84b8\u998f\u6846\u67b6\uff0c\u7528\u4e8e\u8bc6\u522b\u5e76\u8fc7\u6ee4\u6559\u5e08\u6a21\u578b\u4e2d\u867d\u4ea7\u751f\u5927\u68af\u5ea6\u3001\u4f46\u4e0e\u8f93\u5165\u8bc1\u636e\u5f31\u76f8\u5173\u7684 token \u7ea7\u76d1\u7763\u4fe1\u53f7\u3002\u65b9\u6cd5\u901a\u8fc7\u8f93\u5165\u624e\u6839\u6027\u4ee3\u7406\u6307\u6807\u7ed3\u5408\u84b8\u998f\u6563\u5ea6\uff0c\u7cbe\u7ec6\u7b5b\u9664\u9ad8\u5f71\u54cd\u7684\u8bef\u5bfc\u66f4\u65b0\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/jjjyinuo/SA-OPD", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03632", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709\u9009\u62e9\u6027 OPD \u5ffd\u89c6\u4e86\u8bed\u8a00\u5148\u9a8c\u3001\u683c\u5f0f\u60ef\u4f8b\u548c\u523b\u677f\u63a8\u7406\u6a21\u677f\u5bfc\u81f4\u7684\u5f31\u8f93\u5165\u4f9d\u8d56\u4f2a\u76d1\u7763\u4fe1\u53f7\u3002", "\u8bbe\u8ba1\u8f7b\u91cf\u7ea7\u8f93\u5165\u624e\u6839\u6027\u4f30\u8ba1\uff0c\u7528\u4e8e\u5224\u65ad token \u7ea7\u6559\u5e08\u4fe1\u53f7\u662f\u5426\u771f\u6b63\u4f9d\u8d56\u5f53\u524d\u8f93\u5165\u3002", "\u4ec5\u8fc7\u6ee4\u4f4e\u8f93\u5165\u624e\u6839\u6027\u4e14\u84b8\u998f\u6563\u5ea6\u6781\u7aef\u7684 token\uff0c\u5728 LLM \u4e0e VLM \u5b9e\u9a8c\u4e2d\u5747\u4f18\u4e8e Vanilla OPD \u548c\u5176\u4ed6\u9009\u62e9\u6027\u84b8\u998f\u65b9\u6cd5\u3002"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u6a21\u6001", "\u6a21\u578b\u8bad\u7ec3"], "num_comments": 1, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2608.03632v1", "published_at": "2026-08-04", "score": 0.482, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03632.png", "title": "When Teachers Mislead: Spurious-Signal-Aware On-Policy Distillation", "tldr": "\u8fc7\u6ee4\u4f2a\u4fe1\u53f7\uff0c\u63d0\u5347\u5728\u7b56\u7565\u84b8\u998f\u6548\u679c", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa SA-OPD\uff0c\u4e00\u79cd\u4f2a\u4fe1\u53f7\u611f\u77e5\u7684\u5728\u7b56\u7565\u84b8\u998f\u6846\u67b6\uff0c\u7528\u4e8e\u8bc6\u522b\u5e76\u8fc7\u6ee4\u6559\u5e08\u6a21\u578b\u4e2d\u867d\u4ea7\u751f\u5927\u68af\u5ea6\u3001\u4f46\u4e0e\u8f93\u5165\u8bc1\u636e\u5f31\u76f8\u5173\u7684 token \u7ea7\u76d1\u7763\u4fe1\u53f7\u3002\u65b9\u6cd5\u901a\u8fc7\u8f93\u5165\u624e\u6839\u6027\u4ee3\u7406\u6307\u6807\u7ed3\u5408\u84b8\u998f\u6563\u5ea6\uff0c\u7cbe\u7ec6\u7b5b\u9664\u9ad8\u5f71\u54cd\u7684\u8bef\u5bfc\u66f4\u65b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u201c\u8f93\u5165\u624e\u6839\u6027\u201d\u5f15\u5165\u5728\u7b56\u7565\u84b8\u998f\u7684\u76d1\u7763\u7b5b\u9009\uff0c\u8865\u8db3\u4e86\u4ec5\u770b\u7f6e\u4fe1\u5ea6\u3001\u4fe1\u606f\u91cf\u6216\u53ef\u5b66\u4e60\u6027\u7684\u9009\u62e9\u7b56\u7565\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u6559\u5e08\u6a21\u578b\u8bed\u8a00\u5148\u9a8c\u5e26\u6765\u7684\u8bef\u5bfc\u6027\u68af\u5ea6\uff0c\u63d0\u5347 LLM/VLM \u84b8\u998f\u7684\u7a33\u5b9a\u6027\u4e0e\u5b9e\u7528\u6548\u679c\u3002"}, {"abstract": "Long-horizon reasoning in recent LLMs demands that the model switch between distinct skills inside a reasoning chain, such as first doing a math derivation, then using the result to plan a schedule. We call such problems cross-skill long-horizon tasks: multi-step tasks whose steps require different reasoning skills and depend on earlier outputs. Existing benchmarks often evaluate individual skills, lacking a principled way to measure how well a model switches between skills. We address this gap from both the evaluation and training sides. We introduce Skill Entropy, a measure of the difficulty of switching from one skill to another. We then propose Skill^2-Bench, a benchmark of cross-skill long-horizon tasks built over 558 skills across 9 verifiable and open-ended domains. Each task is assigned a task-level skill-entropy score and grouped into three difficulty levels. Evaluating 8 frontier and 4 open-source models on Skill^2-Bench reveals a skill-switching gap: accuracy decreases on higher-entropy tasks. We then turn skill entropy from a benchmark scale into a training signal. We propose Skill-Entropy RL, an RL framework where the model predicts not only the answer at each step but also the skill used to produce it. The reward combines step-level correctness with a skill-entropy reward that measures the alignment between the model-predicted skill sequence and the gold skill sequence. On Qwen3-4B-Instruct and Qwen3-1.7B, Skill-Entropy RL improves the Skill^2-Bench score from 34.4% to 68.4% and from 14.6% to 40.1%, respectively, outperforming competitive baselines. The same pipeline can be applied to off-the-shelf training data such as OpenR1-Math, indicating that skill entropy is a reusable training signal. Code available at: https://github.com/Gen-Verse/Skill-Entropy-RL", "arxiv_id": "2608.05139", "arxiv_url": "https://arxiv.org/abs/2608.05139", "authors": ["Yinghui He", "Ling Yang", "Jiarui Liu", "Yongjin Yang", "Lechen Zhang", "Yingcheng Wu", "Zhenfei Yin", "Mengdi Wang", "Sanjeev Arora"], "brief": "\u8bba\u6587\u63d0\u51fa Skill Entropy\uff0c\u7528\u4e8e\u523b\u753b\u957f\u7a0b\u63a8\u7406\u4e2d\u4ece\u4e00\u79cd\u6280\u80fd\u5207\u6362\u5230\u53e6\u4e00\u79cd\u6280\u80fd\u7684\u96be\u5ea6\uff1b\u5e76\u6784\u5efa Skill^2-Bench\uff0c\u8986\u76d6558\u79cd\u6280\u80fd\u30019\u4e2a\u9886\u57df\u7684\u8de8\u6280\u80fd\u957f\u7a0b\u4efb\u52a1\u3002\u540c\u65f6\u63d0\u51fa Skill-Entropy RL\uff0c\u5c06\u6280\u80fd\u5e8f\u5217\u9884\u6d4b\u4e0e\u6b65\u9aa4\u6b63\u786e\u6027\u7ed3\u5408\uff0c\u7528\u4f5c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4fe1\u53f7\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05139", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Skill^2-Bench \u4e3a\u6bcf\u4e2a\u4efb\u52a1\u5206\u914d\u4efb\u52a1\u7ea7\u6280\u80fd\u71b5\uff0c\u5e76\u6309\u96be\u5ea6\u5206\u4e3a\u4e09\u6863\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u8de8\u6280\u80fd\u5207\u6362\u80fd\u529b\u3002", "\u5bf98\u4e2a\u524d\u6cbf\u6a21\u578b\u548c4\u4e2a\u5f00\u6e90\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u9ad8\u6280\u80fd\u71b5\u4efb\u52a1\u4e0a\u51c6\u786e\u7387\u660e\u663e\u4e0b\u964d\uff0c\u5b58\u5728\u201c\u6280\u80fd\u5207\u6362\u7f3a\u53e3\u201d\u3002", "Skill-Entropy RL \u5728 Qwen3-4B-Instruct \u4e0a\u5c06\u5f97\u5206\u4ece34.4%\u63d0\u5347\u523068.4%\uff0c\u5728 Qwen3-1.7B \u4e0a\u4ece14.6%\u63d0\u5347\u523040.1%\uff0c\u4f18\u4e8e\u5f3a\u57fa\u7ebf\u3002"], "keywords": ["\u957f\u7a0b\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u57fa\u51c6\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Princeton University", "pdf_url": "https://arxiv.org/pdf/2608.05139v1", "published_at": "2026-08-05", "score": 0.462, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Princeton", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05139.png", "title": "Toward Skill-Native LLMs: Skill Entropy for Benchmarking and Training Long-Horizon Reasoning", "tldr": "\u7528\u6280\u80fd\u71b5\u8bc4\u6d4b\u5e76\u8bad\u7ec3\u957f\u7a0b\u8de8\u6280\u80fd\u63a8\u7406", "upvotes": 8, "what_it_is": "\u8bba\u6587\u63d0\u51fa Skill Entropy\uff0c\u7528\u4e8e\u523b\u753b\u957f\u7a0b\u63a8\u7406\u4e2d\u4ece\u4e00\u79cd\u6280\u80fd\u5207\u6362\u5230\u53e6\u4e00\u79cd\u6280\u80fd\u7684\u96be\u5ea6\uff1b\u5e76\u6784\u5efa Skill^2-Bench\uff0c\u8986\u76d6558\u79cd\u6280\u80fd\u30019\u4e2a\u9886\u57df\u7684\u8de8\u6280\u80fd\u957f\u7a0b\u4efb\u52a1\u3002\u540c\u65f6\u63d0\u51fa Skill-Entropy RL\uff0c\u5c06\u6280\u80fd\u5e8f\u5217\u9884\u6d4b\u4e0e\u6b65\u9aa4\u6b63\u786e\u6027\u7ed3\u5408\uff0c\u7528\u4f5c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u4fe1\u53f7\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u201c\u6280\u80fd\u5207\u6362\u96be\u5ea6\u201d\u5f62\u5f0f\u5316\u4e3a\u53ef\u8bc4\u6d4b\u3001\u53ef\u8bad\u7ec3\u7684\u4fe1\u53f7\uff0c\u8865\u8db3\u4e86\u73b0\u6709\u57fa\u51c6\u504f\u91cd\u5355\u4e00\u6280\u80fd\u7684\u4e0d\u8db3\uff0c\u5bf9\u63d0\u5347LLM\u590d\u6742\u957f\u7a0b\u63a8\u7406\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model agents have shown strong potential in complex interactive tasks, yet their reinforcement learning (RL) is often hindered by sparse rewards, as a long multi-turn trajectory may receive only a single outcome-level signal. On-policy self-distillation (OPSD) provides dense token-level supervision from a privileged teacher, but the teacher may not be reliable at every position. Existing methods commonly rely on isolated token-level discrepancies, which can be sensitive to noise, or assign a shared step-level weight that may overlook positional variation. We propose Persistent Consistency Self-Distillation (PCSD), which derives token-level distillation weights from the local persistence of teacher-favoring signals. PCSD combines adaptive windows with exponentially decayed aggregation to capture persistent relative teacher support, applies trend-aware modulation to attenuate locally declining support, and produces continuous weights through sigmoid gating. The resulting objective is jointly optimized with GRPO, combining dense teacher guidance with sparse environmental feedback. Without inference-time skills, PCSD achieves the best ALFWorld Overall results among all baselines on both backbones, exceeding GRPO by 15.6 and 13.3 points and SDAR by 6.2 and 5.5 points, while remaining competitive on WebShop and gaining 15.8 points over GRPO on unseen ALFWorld split.", "arxiv_id": "2608.01837", "arxiv_url": "https://arxiv.org/abs/2608.01837", "authors": ["Chunji Lv", "Yangguang Wei", "Junlin Liu", "Yang Gao", "Ming Liu", "Xinming Wang", "Jinyang Wu", "Guoren Wang", "Changsheng Li"], "brief": "\u8bba\u6587\u63d0\u51fa PCSD\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u81ea\u84b8\u998f\u65b9\u6cd5\u3002\u5b83\u6839\u636e\u6559\u5e08\u6a21\u578b\u504f\u597d\u4fe1\u53f7\u5728\u5c40\u90e8\u4e0a\u4e0b\u6587\u4e2d\u7684\u6301\u7eed\u6027\uff0c\u4e3a\u6bcf\u4e2a token \u751f\u6210\u66f4\u53ef\u9760\u7684\u84b8\u998f\u6743\u91cd\uff0c\u5e76\u4e0e GRPO \u8054\u5408\u4f18\u5316\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01837", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u7a00\u758f\u5956\u52b1\u4e0b\u591a\u8f6e\u8f68\u8ff9\u8bad\u7ec3\u56f0\u96be\uff0c\u5f15\u5165\u6765\u81ea\u7279\u6743\u6559\u5e08\u7684\u7a20\u5bc6 token \u7ea7\u76d1\u7763\u3002", "\u901a\u8fc7\u81ea\u9002\u5e94\u7a97\u53e3\u3001\u6307\u6570\u8870\u51cf\u805a\u5408\u3001\u8d8b\u52bf\u611f\u77e5\u8c03\u5236\u548c sigmoid \u95e8\u63a7\uff0c\u6355\u6349\u6559\u5e08\u4fe1\u53f7\u7684\u6301\u7eed\u652f\u6301\u800c\u975e\u5355\u70b9\u5dee\u5f02\u3002", "\u5728 ALFWorld \u4e0a\u663e\u8457\u4f18\u4e8e GRPO \u548c SDAR\uff1a\u4e24\u4e2a\u9aa8\u5e72\u6a21\u578b\u5206\u522b\u8f83 GRPO \u63d0\u5347 15.6 \u548c 13.3 \u5206\uff0c\u5e76\u5728\u672a\u89c1\u5212\u5206\u4e0a\u63d0\u5347 15.8 \u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Beijing Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2608.01837v1", "published_at": "2026-08-03", "score": 0.452, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (37\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01837.png", "title": "PCSD: Persistent Consistency for Self-Distillation in Agentic Reinforcement Learning", "tldr": "\u7528\u6301\u4e45\u4e00\u81f4\u6027\u63d0\u5347\u667a\u80fd\u4f53RL\u81ea\u84b8\u998f", "upvotes": 37, "what_it_is": "\u8bba\u6587\u63d0\u51fa PCSD\uff0c\u4e00\u79cd\u9762\u5411 LLM \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u81ea\u84b8\u998f\u65b9\u6cd5\u3002\u5b83\u6839\u636e\u6559\u5e08\u6a21\u578b\u504f\u597d\u4fe1\u53f7\u5728\u5c40\u90e8\u4e0a\u4e0b\u6587\u4e2d\u7684\u6301\u7eed\u6027\uff0c\u4e3a\u6bcf\u4e2a token \u751f\u6210\u66f4\u53ef\u9760\u7684\u84b8\u998f\u6743\u91cd\uff0c\u5e76\u4e0e GRPO \u8054\u5408\u4f18\u5316\u3002", "why_notable": "PCSD \u6539\u8fdb\u4e86\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u6559\u5e08\u84b8\u998f\u4fe1\u53f7\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\uff0c\u5728\u4e0d\u589e\u52a0\u63a8\u7406\u671f\u6280\u80fd\u6a21\u5757\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u4ea4\u4e92\u4efb\u52a1\u8868\u73b0\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u8bad\u7ec3\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Memory-augmented VLM agents act on persistent spatial knowledge, yet that knowledge silently goes stale as the environment changes. We ask what happens when an agent must reconcile a confident memory claim with a contradicting observation, and whether current models can catch the conflict before it becomes a safety-relevant mistake. Using a dynamic FrozenLake testbed, we pair a staleness-detection task with a downstream navigation task across three closed-source models and three open-weight VLMs under both text and image inputs (1,800 detection runs, and 12,000 text-mode navigation episodes over four LLM navigators at a shared 50-seed scale). Three findings emerge. First, text solvability does not imply visual grounding: models that flag stale entries reliably from text nonetheless span vision F1 from 0.887 down to 0.067 on the identical grids, and the weakest keeps making fluent, confident decisions that ignore the image. Second, consuming stale memory without an audit is a safety liability: in our primary GPT-4o setting, an agent that trusts raw memory dies more than twice as often as the same agent given no memory at all. Third, auditing helps but does not close the gap: a transparent read-time filter removes much of the safety cost in text mode, yet even oracle stale labels bring no further significant gain on the current grid size, and when visual auditing is unreliable, filtering yields no consistent benefit. Together these results frame spatial-memory staleness as a safety failure mode and isolate reliable visual grounding and action selection under memory--observation conflict as the central open challenges for memory-augmented agents.", "arxiv_id": "2608.04574", "arxiv_url": "https://arxiv.org/abs/2608.04574", "authors": ["Yushi Sun", "Yanjie Zhang"], "brief": "\u672c\u6587\u7528\u52a8\u6001 FrozenLake \u6d4b\u8bd5\u5e8a\u5b9e\u8bc1\u7814\u7a76\u8bb0\u5fc6\u589e\u5f3a VLM \u667a\u80fd\u4f53\u5728\u73af\u5883\u53d8\u5316\u540e\u5982\u4f55\u5904\u7406\u201c\u65e7\u8bb0\u5fc6\u201d\u4e0e\u5f53\u524d\u89c2\u5bdf\u7684\u51b2\u7a81\u3002\u8bba\u6587\u8bc4\u4f30\u4e86\u95ed\u6e90\u4e0e\u5f00\u6e90 VLM \u5728\u6587\u672c\u548c\u56fe\u50cf\u8f93\u5165\u4e0b\u7684\u8fc7\u671f\u8bb0\u5fc6\u68c0\u6d4b\u4e0e\u5bfc\u822a\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04574", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u4e86\u7a7a\u95f4\u8bb0\u5fc6\u8fc7\u671f\u68c0\u6d4b\u4efb\u52a1\u4e0e\u4e0b\u6e38\u5bfc\u822a\u4efb\u52a1\uff0c\u8986\u76d63\u4e2a\u95ed\u6e90\u6a21\u578b\u30013\u4e2a\u5f00\u6e90 VLM\u30011800\u6b21\u68c0\u6d4b\u8fd0\u884c\u548c12000\u6b21\u6587\u672c\u5bfc\u822a\u56de\u5408\u3002", "\u53d1\u73b0\u6587\u672c\u53ef\u89e3\u4e0d\u7b49\u4e8e\u89c6\u89c9\u624e\u6839\uff1a\u540c\u4e00\u7f51\u683c\u4e0a\u6a21\u578b\u6587\u672c\u68c0\u6d4b\u8f83\u597d\uff0c\u4f46\u89c6\u89c9 F1 \u4ece0.887\u52300.067\u5dee\u5f02\u5de8\u5927\uff0c\u5f31\u6a21\u578b\u4f1a\u81ea\u4fe1\u5730\u5ffd\u7565\u56fe\u50cf\u8bc1\u636e\u3002", "\u672a\u7ecf\u5ba1\u8ba1\u5730\u4f7f\u7528\u8fc7\u671f\u8bb0\u5fc6\u4f1a\u663e\u8457\u589e\u52a0\u5b89\u5168\u98ce\u9669\uff1a\u5728\u4e3b\u8981 GPT-4o \u8bbe\u7f6e\u4e2d\uff0c\u4fe1\u4efb\u539f\u59cb\u8bb0\u5fc6\u7684\u667a\u80fd\u4f53\u6b7b\u4ea1\u7387\u8d85\u8fc7\u65e0\u8bb0\u5fc6\u667a\u80fd\u4f53\u7684\u4e24\u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u8bb0\u5fc6\u673a\u5236", "\u5b89\u5168\u6027"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.04574v1", "published_at": "2026-08-05", "score": 0.451, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04574.png", "title": "When Memory Lies: An Empirical Study of Spatial Memory Staleness in VLM Agents", "tldr": "\u63ed\u793aVLM\u667a\u80fd\u4f53\u7a7a\u95f4\u8bb0\u5fc6\u8fc7\u671f\u7684\u5b89\u5168\u98ce\u9669", "upvotes": 5, "what_it_is": "\u672c\u6587\u7528\u52a8\u6001 FrozenLake \u6d4b\u8bd5\u5e8a\u5b9e\u8bc1\u7814\u7a76\u8bb0\u5fc6\u589e\u5f3a VLM \u667a\u80fd\u4f53\u5728\u73af\u5883\u53d8\u5316\u540e\u5982\u4f55\u5904\u7406\u201c\u65e7\u8bb0\u5fc6\u201d\u4e0e\u5f53\u524d\u89c2\u5bdf\u7684\u51b2\u7a81\u3002\u8bba\u6587\u8bc4\u4f30\u4e86\u95ed\u6e90\u4e0e\u5f00\u6e90 VLM \u5728\u6587\u672c\u548c\u56fe\u50cf\u8f93\u5165\u4e0b\u7684\u8fc7\u671f\u8bb0\u5fc6\u68c0\u6d4b\u4e0e\u5bfc\u822a\u8868\u73b0\u3002", "why_notable": "\u8bba\u6587\u5c06\u7a7a\u95f4\u8bb0\u5fc6\u8fc7\u671f\u660e\u786e\u523b\u753b\u4e3a\u8bb0\u5fc6\u589e\u5f3a\u667a\u80fd\u4f53\u7684\u5b89\u5168\u5931\u6548\u6a21\u5f0f\uff0c\u5e76\u6307\u51fa\u53ef\u9760\u89c6\u89c9\u624e\u6839\u3001\u8bb0\u5fc6\u5ba1\u8ba1\u548c\u51b2\u7a81\u4e0b\u52a8\u4f5c\u9009\u62e9\u662f\u5f53\u524d VLM/LLM \u667a\u80fd\u4f53\u843d\u5730\u4e2d\u7684\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "Interactive video world models are essential for long-horizon planning and exploration, yet they suffer from compounding errors. Post-training methods such as reinforcement learning (RL) can improve these models, but they hit a verification bottleneck: for arbitrary action sequences, no ground-truth future state exists to measure long-term drift. Our key insight is that reversible action cycles make this verification possible: a sequence composed with its inverse must analytically return to the initial state, yielding annotation-free supervision on long-horizon correctness. Building on this, we introduce WorldCycle, a self-verifiable RL framework that constructs closed action cycles and their repeated executions from ordinary action sequences, and optimizes two complementary rewards: a spatial closure reward enforcing symmetry between mirrored forward and reverse segments, and a temporal consistency reward aligning states across repeated cycle executions. These rewards force the model to learn actions as consistent state operators rather than memorized temporal patterns, and extend naturally to out-of-distribution composite action cycles that the base model handles poorly. We further release CycleBench, a diagnostic benchmark for state-returning ability under complex action structures. WorldCycle reduces state returning drift by up to 44% and lifts composite-action accuracy nearly 4x over the base model, providing a vital foundation for physically grounded world models.", "arxiv_id": "2608.04964", "arxiv_url": "https://arxiv.org/abs/2608.04964", "authors": ["Bohai Gu", "Yueyang Yuan", "Taiyi Wu", "Dazhao Du", "Jian Liu", "Xiaoyi Pang", "Jie Zhang", "Xiaocheng Lu", "Haobin Zhong", "Xiaotong Zhao", "Alan Zhao", "Song Guo"], "brief": "\u8bba\u6587\u63d0\u51fa WorldCycle\uff0c\u4e00\u79cd\u9762\u5411\u957f\u65f6\u7a0b\u4ea4\u4e92\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u81ea\u9a8c\u8bc1\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5229\u7528\u201c\u52a8\u4f5c\u5e8f\u5217+\u9006\u52a8\u4f5c\u5e94\u56de\u5230\u521d\u59cb\u72b6\u6001\u201d\u7684\u95ed\u73af\u6027\u8d28\uff0c\u5728\u65e0\u9700\u672a\u6765\u771f\u503c\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u4f18\u5316\u957f\u7a0b\u4e00\u81f4\u6027\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04964", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u9020\u95ed\u5408\u52a8\u4f5c\u5faa\u73af\u53ca\u5176\u91cd\u590d\u6267\u884c\uff0c\u7528\u53ef\u5206\u6790\u7684\u72b6\u6001\u8fd4\u56de\u7ea6\u675f\u89e3\u51b3\u957f\u65f6\u7a0b\u9a8c\u8bc1\u74f6\u9888", "\u8bbe\u8ba1\u7a7a\u95f4\u95ed\u5408\u5956\u52b1\u4e0e\u65f6\u95f4\u4e00\u81f4\u6027\u5956\u52b1\uff0c\u5206\u522b\u7ea6\u675f\u6b63\u53cd\u5411\u7247\u6bb5\u5bf9\u79f0\u6027\u548c\u591a\u8f6e\u5faa\u73af\u72b6\u6001\u5bf9\u9f50", "\u53d1\u5e03 CycleBench \u8bc4\u6d4b\u590d\u6742\u52a8\u4f5c\u7ed3\u6784\u4e0b\u7684\u72b6\u6001\u8fd4\u56de\u80fd\u529b\uff1b\u72b6\u6001\u8fd4\u56de\u6f02\u79fb\u6700\u591a\u964d\u4f4e44%\uff0c\u7ec4\u5408\u52a8\u4f5c\u51c6\u786e\u7387\u8f83\u57fa\u5ea7\u6a21\u578b\u63d0\u5347\u8fd14\u500d"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u89c6\u9891\u751f\u6210", "\u5177\u8eab\u667a\u80fd"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.04964v1", "published_at": "2026-08-05", "score": 0.448, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.04964.png", "title": "WorldCycle: Self-Verifiable Reinforcement Learning for Long-Horizon Video World Models", "tldr": "\u7528\u53ef\u9006\u52a8\u4f5c\u5faa\u73af\u81ea\u76d1\u7763\u5f3a\u5316\u89c6\u9891\u4e16\u754c\u6a21\u578b", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldCycle\uff0c\u4e00\u79cd\u9762\u5411\u957f\u65f6\u7a0b\u4ea4\u4e92\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u81ea\u9a8c\u8bc1\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5229\u7528\u201c\u52a8\u4f5c\u5e8f\u5217+\u9006\u52a8\u4f5c\u5e94\u56de\u5230\u521d\u59cb\u72b6\u6001\u201d\u7684\u95ed\u73af\u6027\u8d28\uff0c\u5728\u65e0\u9700\u672a\u6765\u771f\u503c\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u4f18\u5316\u957f\u7a0b\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u53ef\u9006\u52a8\u4f5c\u5faa\u73af\u8f6c\u5316\u4e3a\u65e0\u6807\u6ce8\u76d1\u7763\u4fe1\u53f7\uff0c\u4e3a\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u957f\u65f6\u7a0b\u7a33\u5b9a\u6027\u548c\u7269\u7406\u4e00\u81f4\u6027\u63d0\u4f9b\u4e86\u5b9e\u7528\u8bad\u7ec3\u8303\u5f0f\uff0c\u5bf9\u89c4\u5212\u3001\u63a2\u7d22\u548c\u5177\u8eab\u667a\u80fd\u4e2d\u7684\u4e16\u754c\u6a21\u578b\u5efa\u8bbe\u6709\u91cd\u8981\u4ef7\u503c\u3002"}, {"abstract": "Viscous stains, characterized by high viscosity and complex rheological properties, remain a major challenge for robotic surface cleaning. Conventional wiping often spreads the stain, while scrubbing provides stronger friction but risks damaging the surface. In this paper, we propose Push-Wiper, a framework that reformulates viscous stain cleaning as an aggregation problem. Push-Wiper employs a sponge to progressively gather stains through segmented pushing trajectories, followed by a post-processing phase that detaches the aggregated material and enables sponge self-cleaning. We adopt a stepwise strategy for stain gathering and leverage Diffusion Policy to generate adaptive pushing action sequences. These sequences are executed through our Arbitrary Surface Pose Interpolator (ASPI) and a hybrid force-position controller, allowing the method to generalize to stains with diverse spatial distributions. Push-Wiper achieves a cleaning score (CS), defined as the percentage of stain area removed, up to 130% higher than baseline methods. Without additional training, Push-Wiper also transfers in a zero-shot manner to solid residues, liquid spills, unseen viscous stains, and curved surfaces with varying geometries. Our experiments demonstrate the cleaning effectiveness of Push-Wiper and its strong generalization ability. The project website is available at https://push-wiper.github.io/.", "arxiv_id": "2608.00730", "arxiv_url": "https://arxiv.org/abs/2608.00730", "authors": ["Renhao Lu", "Mingxin Wang", "Chenyang Cao", "Yang Yang", "Guoping Pan", "Kangka
