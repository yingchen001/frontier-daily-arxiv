ng Dong", "Yi Cheng", "Houde Liu"], "brief": "\u8bba\u6587\u63d0\u51fa Push-Wiper\uff0c\u5c06\u9ad8\u9ecf\u5ea6\u6c61\u6e0d\u6e05\u6d01\u91cd\u6784\u4e3a\u201c\u805a\u62e2\u201d\u95ee\u9898\uff1a\u7528\u6d77\u7ef5\u6cbf\u5206\u6bb5\u63a8\u52a8\u8f68\u8ff9\u9010\u6b65\u6c47\u96c6\u6c61\u6e0d\uff0c\u518d\u901a\u8fc7\u540e\u5904\u7406\u5206\u79bb\u805a\u96c6\u7269\u5e76\u5b9e\u73b0\u6d77\u7ef5\u81ea\u6e05\u6d01\u3002\u7cfb\u7edf\u7ed3\u5408 Diffusion Policy\u3001\u4efb\u610f\u8868\u9762\u59ff\u6001\u63d2\u503c\u5668 ASPI \u4e0e\u529b-\u4f4d\u6df7\u5408\u63a7\u5236\uff0c\u5b9e\u73b0\u5bf9\u4e0d\u540c\u6c61\u6e0d\u5206\u5e03\u548c\u8868\u9762\u7684\u81ea\u9002\u5e94\u6e05\u6d01\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.00730", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u5206\u6b65\u6c61\u6e0d\u805a\u62e2\u7b56\u7565\uff0c\u907f\u514d\u4f20\u7edf\u64e6\u62ed\u6269\u6563\u6c61\u6e0d\u3001\u5f3a\u529b\u5237\u6d17\u635f\u4f24\u8868\u9762\u7684\u95ee\u9898", "\u5229\u7528 Diffusion Policy \u751f\u6210\u81ea\u9002\u5e94\u63a8\u52a8\u52a8\u4f5c\u5e8f\u5217\uff0c\u5e76\u901a\u8fc7 ASPI \u5728\u4efb\u610f\u8868\u9762\u59ff\u6001\u4e0a\u6267\u884c", "\u6e05\u6d01\u5f97\u5206\u6700\u9ad8\u6bd4\u57fa\u7ebf\u65b9\u6cd5\u63d0\u5347 130%\uff0c\u4e14\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u56fa\u4f53\u6b8b\u6e23\u3001\u6db2\u4f53\u6cfc\u6d12\u3001\u672a\u89c1\u9ecf\u6027\u6c61\u6e0d\u548c\u66f2\u9762"], "keywords": ["\u673a\u5668\u4eba", "\u6a21\u4eff\u5b66\u4e60", "\u6269\u6563\u7b56\u7565", "\u64cd\u4f5c\u63a7\u5236"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2608.00730v1", "published_at": "2026-08-01", "score": 0.445, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00730.png", "title": "Push-Wiper: Toward General-Purpose Robotic Cleaning across Varied Stains and Surfaces with Segmented Pushing Trajectories", "tldr": "\u7528\u5206\u6bb5\u63a8\u64e6\u8f68\u8ff9\u6cdb\u5316\u6e05\u6d01\u591a\u7c7b\u6c61\u6e0d", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa Push-Wiper\uff0c\u5c06\u9ad8\u9ecf\u5ea6\u6c61\u6e0d\u6e05\u6d01\u91cd\u6784\u4e3a\u201c\u805a\u62e2\u201d\u95ee\u9898\uff1a\u7528\u6d77\u7ef5\u6cbf\u5206\u6bb5\u63a8\u52a8\u8f68\u8ff9\u9010\u6b65\u6c47\u96c6\u6c61\u6e0d\uff0c\u518d\u901a\u8fc7\u540e\u5904\u7406\u5206\u79bb\u805a\u96c6\u7269\u5e76\u5b9e\u73b0\u6d77\u7ef5\u81ea\u6e05\u6d01\u3002\u7cfb\u7edf\u7ed3\u5408 Diffusion Policy\u3001\u4efb\u610f\u8868\u9762\u59ff\u6001\u63d2\u503c\u5668 ASPI \u4e0e\u529b-\u4f4d\u6df7\u5408\u63a7\u5236\uff0c\u5b9e\u73b0\u5bf9\u4e0d\u540c\u6c61\u6e0d\u5206\u5e03\u548c\u8868\u9762\u7684\u81ea\u9002\u5e94\u6e05\u6d01\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u673a\u5668\u4eba\u6e05\u6d01\u4ece\u7b80\u5355\u64e6\u62ed\u63a8\u8fdb\u5230\u9762\u5411\u590d\u6742\u6c61\u6e0d\u548c\u590d\u6742\u8868\u9762\u7684\u901a\u7528\u64cd\u4f5c\u7b56\u7565\uff0c\u5c55\u793a\u4e86\u5b66\u4e60\u5f0f\u7b56\u7565\u4e0e\u529b\u63a7\u7ed3\u5408\u5728\u5bb6\u52a1\u548c\u5de5\u4e1a\u6e05\u6d01\u673a\u5668\u4eba\u4e2d\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "On-policy training has emerged as a powerful post-training paradigm for improving the reasoning capabilities of large language models, and is often enhanced by golden trajectories from stronger expert models. However, when the expert fails on harder problems, existing trajectory-guided methods lose their main source of supervision, and these failed trajectories are typically discarded as negative samples. We argue that such failures, which we call Golden Negative Trajectories, can still provide valuable reasoning signals when treated not as demonstrations to imitate, but as flawed trajectories to reflect upon. We identify a Reflection Advantage: for hard problems, reflecting on a flawed trajectory can be easier and more effective than solving the problem directly from scratch. Motivated by this, we propose ReflectRL, a lightweight plug-and-play framework that learns from Golden Negative Trajectories during on-policy training. ReflectRL first uses these trajectories to elicit Reflective Reasoning, then applies Reflective-to-Direct Policy Transition to transfer the acquired reasoning behavior back to Direct Reasoning. Experiments across 9 benchmarks, 4 LLM backbones, and 4 on-policy training methods show that ReflectRL consistently improves reasoning performance with minimal overhead.", "arxiv_id": "2608.03972", "arxiv_url": "https://arxiv.org/abs/2608.03972", "authors": ["Jinhe Bi", "Chennan Zhou", "Zengjie Jin", "Aniri", "Shuo Lu", "Wenke Huang", "Hu Cao", "Xun Xiao", "Zhihong Zhu", "Volker Tresp", "Fei Shen", "Yunpu Ma", "Tat-Seng Chua"], "brief": "\u8bba\u6587\u63d0\u51fa ReflectRL\uff0c\u4e00\u4e2a\u8f7b\u91cf\u7ea7\u53ef\u63d2\u62d4\u7684\u5728\u7ebf\u7b56\u7565\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u5f3a\u6a21\u578b\u5728\u96be\u9898\u4e0a\u7684\u5931\u8d25\u8f68\u8ff9\u89c6\u4e3a\u201c\u9ec4\u91d1\u8d1f\u8f68\u8ff9\u201d\uff0c\u901a\u8fc7\u53cd\u601d\u5176\u9519\u8bef\u6765\u5b66\u4e60\u63a8\u7406\u4fe1\u53f7\uff0c\u518d\u8fc1\u79fb\u56de\u76f4\u63a5\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/bibisbar/ReflectRL", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.03972", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Reflection Advantage\uff1a\u5728\u96be\u9898\u4e0a\uff0c\u53cd\u601d\u6709\u7f3a\u9677\u7684\u63a8\u7406\u8f68\u8ff9\u5f80\u5f80\u6bd4\u4ece\u96f6\u76f4\u63a5\u6c42\u89e3\u66f4\u5bb9\u6613\u3001\u66f4\u6709\u6548", "\u6d41\u7a0b\u5305\u62ec\u5148\u7528\u5931\u8d25\u8f68\u8ff9\u6fc0\u53d1 Reflective Reasoning\uff0c\u518d\u901a\u8fc7 Reflective-to-Direct Policy Transition \u5c06\u53cd\u601d\u80fd\u529b\u8f6c\u5316\u4e3a\u76f4\u63a5\u63a8\u7406\u80fd\u529b", "\u57289\u4e2a\u57fa\u51c6\u30014\u79cdLLM\u9aa8\u5e72\u548c4\u79cd\u5728\u7ebf\u7b56\u7565\u8bad\u7ec3\u65b9\u6cd5\u4e0a\u5747\u5e26\u6765\u7a33\u5b9a\u63d0\u5347\uff0c\u4e14\u989d\u5916\u5f00\u9500\u8f83\u5c0f"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406", "\u540e\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2608.03972v1", "published_at": "2026-08-04", "score": 0.442, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03972.png", "title": "ReflectRL: Learning from Golden Negative Trajectories via Reflective-to-Direct Reasoning", "tldr": "\u5229\u7528\u4e13\u5bb6\u5931\u8d25\u8f68\u8ff9\u63d0\u5347LLM\u63a8\u7406\u8bad\u7ec3", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa ReflectRL\uff0c\u4e00\u4e2a\u8f7b\u91cf\u7ea7\u53ef\u63d2\u62d4\u7684\u5728\u7ebf\u7b56\u7565\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u5f3a\u6a21\u578b\u5728\u96be\u9898\u4e0a\u7684\u5931\u8d25\u8f68\u8ff9\u89c6\u4e3a\u201c\u9ec4\u91d1\u8d1f\u8f68\u8ff9\u201d\uff0c\u901a\u8fc7\u53cd\u601d\u5176\u9519\u8bef\u6765\u5b66\u4e60\u63a8\u7406\u4fe1\u53f7\uff0c\u518d\u8fc1\u79fb\u56de\u76f4\u63a5\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u901a\u5e38\u88ab\u4e22\u5f03\u7684\u4e13\u5bb6\u5931\u8d25\u6837\u672c\u8f6c\u5316\u4e3a\u6709\u6548\u76d1\u7763\u4fe1\u53f7\uff0c\u62d3\u5c55\u4e86LLM\u540e\u8bad\u7ec3\u4e2d\u8f68\u8ff9\u6570\u636e\u7684\u5229\u7528\u65b9\u5f0f\uff0c\u5bf9\u63d0\u5347\u590d\u6742\u63a8\u7406\u80fd\u529b\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Language remains an outlier in generative modeling: while images, video, and audio are increasingly modeled in continuous latent spaces, text generation still relies predominantly on discrete tokens. Existing continuous language models either inherit embedding spaces not designed for joint generation and decoding, or compress autoencoded latents to ease diffusion, sacrificing token-level fidelity. Instead of simplifying the representation to suit the generative model, we preserve a high-capacity, decodable text latent and design the diffusion model to learn its distribution directly. We introduce AURORA-LM, a continuous-latent diffusion language model that separates the construction of a decodable text representation from the modeling of its distribution. A Query-based Encoder-Decoder organizes text into a high-capacity, prefix-aligned latent sequence, and a Block-causal Diffusion Transformer learns its distribution through flow matching, generating blocks left to right while denoising positions within each block in parallel. Because such a latent is harder for diffusion to model, AURORA-LM restricts only the noisy-input pathway while retaining the full clean-latent prediction target, accommodating full-width latents without reducing decoder-facing capacity. We further calibrate the noise-level distribution to the latent width, and introduce self-trajectory consistency to bridge independently sampled training noise and iterative denoising at inference. AURORA-LM achieves the strongest performance among evaluated continuous and diffusion-based language models on OpenWebText free generation and XSum summarization. Scaling to 1B parameters with about 1500 EFLOPs of total compute yields further gains, surpassing a larger publicly released latent-diffusion language model under a matched evaluation protocol. All experiments are conducted on Ascend NPUs.", "arxiv_id": "2608.02602", "arxiv_url": "https://arxiv.org/abs/2608.02602", "authors": ["Jiajun Liang", "Yucheng Liao", "Yukang Cao", "Jiazhe Wei", "Ken Li", "Wende Tan", "Jiankun Zhang", "ZY Cui", "Jingkang Yang", "Liucheng Guo", "Shiqi Yang", "B. Yang", "Caifeng Shan", "Ziwei Liu", "Chenyang Si"], "brief": "\u8bba\u6587\u63d0\u51fa AURORA-LM\uff0c\u5c06\u53ef\u89e3\u7801\u6587\u672c\u8868\u793a\u6784\u5efa\u4e0e\u5176\u5206\u5e03\u5efa\u6a21\u5206\u79bb\uff1a\u5148\u7528\u67e5\u8be2\u5f0f\u7f16\u7801\u5668-\u89e3\u7801\u5668\u5f97\u5230\u524d\u7f00\u5bf9\u9f50\u7684\u9ad8\u5bb9\u91cf\u8fde\u7eed\u6f5c\u53d8\u91cf\uff0c\u518d\u7528\u5757\u56e0\u679c\u6269\u6563 Transformer \u8fdb\u884c\u751f\u6210\u3002\u6a21\u578b\u5728 OpenWebText \u81ea\u7531\u751f\u6210\u548c XSum \u6458\u8981\u4e0a\u8d85\u8fc7\u5df2\u6709\u8fde\u7eed/\u6269\u6563\u8bed\u8a00\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/fyv587/AURORA-LM", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2608.02602", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Query-based Encoder-Decoder \u5c06\u6587\u672c\u7ec4\u7ec7\u4e3a\u9ad8\u5bb9\u91cf\u3001\u524d\u7f00\u5bf9\u9f50\u4e14\u53ef\u89e3\u7801\u7684\u8fde\u7eed\u6f5c\u53d8\u91cf\u5e8f\u5217\uff0c\u907f\u514d\u4e3a\u9002\u914d\u6269\u6563\u800c\u727a\u7272 token \u7ea7\u4fdd\u771f\u5ea6\u3002", "Block-causal Diffusion Transformer \u901a\u8fc7 flow matching \u5b66\u4e60\u6f5c\u53d8\u91cf\u5206\u5e03\uff0c\u6309\u5757\u4ece\u5de6\u5230\u53f3\u751f\u6210\uff0c\u5e76\u5728\u5757\u5185\u5e76\u884c\u53bb\u566a\u3002", "\u63d0\u51fa\u566a\u58f0\u8f93\u5165\u901a\u8def\u9650\u5236\u3001\u6309\u6f5c\u53d8\u91cf\u5bbd\u5ea6\u6821\u51c6\u566a\u58f0\u6c34\u5e73\u5206\u5e03\uff0c\u4ee5\u53ca\u81ea\u8f68\u8ff9\u4e00\u81f4\u6027\uff0c\u7f13\u89e3\u9ad8\u7ef4\u6f5c\u53d8\u91cf\u6269\u6563\u5efa\u6a21\u96be\u9898\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u8fde\u7eed\u6f5c\u53d8\u91cf", "\u6587\u672c\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Nanjing University", "pdf_url": "https://arxiv.org/pdf/2608.02602v1", "published_at": "2026-08-03", "score": 0.348, "selected_reasons": ["HF trending (74\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02602.png", "title": "AURORA-LM: Autoencoding Unified Representation for Continuous-Latent Diffusion Language Modeling", "tldr": "\u7528\u9ad8\u5bb9\u91cf\u8fde\u7eed\u6f5c\u53d8\u91cf\u505a\u6269\u6563\u8bed\u8a00\u5efa\u6a21", "upvotes": 74, "what_it_is": "\u8bba\u6587\u63d0\u51fa AURORA-LM\uff0c\u5c06\u53ef\u89e3\u7801\u6587\u672c\u8868\u793a\u6784\u5efa\u4e0e\u5176\u5206\u5e03\u5efa\u6a21\u5206\u79bb\uff1a\u5148\u7528\u67e5\u8be2\u5f0f\u7f16\u7801\u5668-\u89e3\u7801\u5668\u5f97\u5230\u524d\u7f00\u5bf9\u9f50\u7684\u9ad8\u5bb9\u91cf\u8fde\u7eed\u6f5c\u53d8\u91cf\uff0c\u518d\u7528\u5757\u56e0\u679c\u6269\u6563 Transformer \u8fdb\u884c\u751f\u6210\u3002\u6a21\u578b\u5728 OpenWebText \u81ea\u7531\u751f\u6210\u548c XSum \u6458\u8981\u4e0a\u8d85\u8fc7\u5df2\u6709\u8fde\u7eed/\u6269\u6563\u8bed\u8a00\u6a21\u578b\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c1d\u8bd5\u628a\u8bed\u8a00\u751f\u6210\u4ece\u79bb\u6563 token \u63a8\u5411\u7c7b\u4f3c\u56fe\u50cf/\u97f3\u9891\u7684\u8fde\u7eed\u6f5c\u7a7a\u95f4\u751f\u6210\uff0c\u5e76\u5728\u8f83\u5927\u89c4\u6a21\u5b9e\u9a8c\u4e2d\u53d6\u5f97\u5f53\u524d\u8fde\u7eed\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u9886\u5148\u7ed3\u679c\uff0c\u53ef\u80fd\u4e3a\u975e\u81ea\u56de\u5f52\u6216\u6df7\u5408\u5f0f\u6587\u672c\u751f\u6210\u63d0\u4f9b\u65b0\u8def\u7ebf\u3002"}, {"abstract": "Industrial recommenders increasingly adopt the pretrain-then-transfer paradigm, yet behavioral distribution drift raises two questions: what to learn from behavior sequences, and how to transfer the learned knowledge while the pretrained model is continually refreshed. To resolve them, we propose Knowledge-Geometry Decoupling (KGD). For what to learn, conventional next-token prediction treats adjacency as dependency and may encode spurious transitions across unrelated sessions. We introduce Behavioral Multi-Token Prediction (BMTP) to retain only collaboratively or semantically related future items as supervision, yielding cleaner and more transferable behavioral knowledge. For how to transfer, pretrained knowledge and task-specific geometry impose conflicting optimization demands on shared parameters. To handle it, KGD assigns them to separate parameter sets: a refreshable encoder owns behavioral knowledge, while a task learner reads contextualized encoder states through read-only cross-attention and writes task-specific geometry through Anchored Calibration Residual (ACR) orthogonal to the pretrained embedding. The decoupled ownership enables continual knowledge refresh without task-gradient interference or invalidating downstream adaptation. KGD improves over strong pretrain-transfer baselines by 4-12% on eight public benchmarks and sustains its advantage over a 90-day production stream where baselines show no gains. KGD has been fully deployed in Shopee. In a live A/B test on Shopee Homepage Search, it increases GMV per user by 1.75% and advertising revenue by 1.53%, demonstrating its high practical value. We provide the core implementation of KGD at https://github.com/FuCongResearchSquad/KGD4REC.", "arxiv_id": "2608.02738", "arxiv_url": "https://arxiv.org/abs/2608.02738", "authors": ["Zixuan Wang", "Yuhong Chen", "Yuxuan Zhu", "Guidong Lei", "Zhiluohan Guo", "Yu Zhao", "Kun Wang", "Bangyang Hong", "Kangle Wu", "Yabo Ni", "Anxiang Zeng", "Cong Fu", "Hui Li"], "brief": "\u8bba\u6587\u63d0\u51fa Knowledge-Geometry Decoupling\uff08KGD\uff09\uff0c\u9762\u5411\u5de5\u4e1a\u6d41\u5f0f\u63a8\u8350\u4e2d\u7684\u9884\u8bad\u7ec3-\u8fc1\u79fb\u4e0e\u5206\u5e03\u6f02\u79fb\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u66f4\u5e72\u51c0\u7684\u884c\u4e3a\u76d1\u7763\u5b66\u4e60\u53ef\u8fc1\u79fb\u77e5\u8bc6\uff0c\u5e76\u5c06\u53ef\u5237\u65b0\u7684\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u4e0e\u4e0b\u6e38\u4efb\u52a1\u9002\u914d\u53c2\u6570\u89e3\u8026\u3002", "categories": ["cs.IR"], "github_repo": "https://github.com/FuCongResearchSquad/KGD4REC", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.02738", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Behavioral Multi-Token Prediction\uff08BMTP\uff09\uff0c\u53ea\u4fdd\u7559\u534f\u540c\u6216\u8bed\u4e49\u76f8\u5173\u7684\u672a\u6765\u7269\u54c1\u4f5c\u4e3a\u76d1\u7763\uff0c\u51cf\u5c11\u8de8\u4f1a\u8bdd\u4f2a\u8f6c\u79fb\u5e26\u6765\u7684\u566a\u58f0\u3002", "\u5c06\u9884\u8bad\u7ec3\u77e5\u8bc6\u4e0e\u4efb\u52a1\u7279\u5b9a\u51e0\u4f55\u5206\u914d\u7ed9\u4e0d\u540c\u53c2\u6570\uff1a\u7f16\u7801\u5668\u8d1f\u8d23\u53ef\u6301\u7eed\u5237\u65b0\u7684\u884c\u4e3a\u77e5\u8bc6\uff0c\u4efb\u52a1\u5b66\u4e60\u5668\u901a\u8fc7\u53ea\u8bfb\u4ea4\u53c9\u6ce8\u610f\u529b\u8bfb\u53d6\u7f16\u7801\u5668\u72b6\u6001\u3002", "\u4f7f\u7528 Anchored Calibration Residual\uff08ACR\uff09\u5728\u4e0e\u9884\u8bad\u7ec3\u5d4c\u5165\u6b63\u4ea4\u7684\u65b9\u5411\u5199\u5165\u4efb\u52a1\u9002\u914d\u4fe1\u606f\uff0c\u907f\u514d\u4efb\u52a1\u68af\u5ea6\u5e72\u6270\u9884\u8bad\u7ec3\u77e5\u8bc6\u5237\u65b0\u3002"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u9884\u8bad\u7ec3\u8fc1\u79fb", "\u6d41\u5f0f\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Personalized\u0026Inclusive Intelligence Research", "pdf_url": "https://arxiv.org/pdf/2608.02738v1", "published_at": "2026-08-03", "score": 0.34, "selected_reasons": ["HF trending (38\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02738.png", "title": "Knowledge-Geometry Decoupling: Refreshable Pretrained Transfer for Streaming Recommendation", "tldr": "\u89e3\u8026\u9884\u8bad\u7ec3\u77e5\u8bc6\u4e0e\u4efb\u52a1\u51e0\u4f55\uff0c\u63d0\u5347\u6d41\u5f0f\u63a8\u8350\u8fc1\u79fb", "upvotes": 38, "what_it_is": "\u8bba\u6587\u63d0\u51fa Knowledge-Geometry Decoupling\uff08KGD\uff09\uff0c\u9762\u5411\u5de5\u4e1a\u6d41\u5f0f\u63a8\u8350\u4e2d\u7684\u9884\u8bad\u7ec3-\u8fc1\u79fb\u4e0e\u5206\u5e03\u6f02\u79fb\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u66f4\u5e72\u51c0\u7684\u884c\u4e3a\u76d1\u7763\u5b66\u4e60\u53ef\u8fc1\u79fb\u77e5\u8bc6\uff0c\u5e76\u5c06\u53ef\u5237\u65b0\u7684\u9884\u8bad\u7ec3\u7f16\u7801\u5668\u4e0e\u4e0b\u6e38\u4efb\u52a1\u9002\u914d\u53c2\u6570\u89e3\u8026\u3002", "why_notable": "KGD\u5728\u516b\u4e2a\u516c\u5f00\u63a8\u8350\u57fa\u51c6\u4e0a\u8f83\u5f3a\u57fa\u7ebf\u63d0\u53474-12%\uff0c\u5e76\u572890\u5929\u751f\u4ea7\u6d41\u4e2d\u4fdd\u6301\u4f18\u52bf\uff1b\u5df2\u5b8c\u6574\u90e8\u7f72\u4e8eShopee\uff0c\u7ebf\u4e0aA/B\u6d4b\u8bd5\u5e26\u6765GMV per user\u63d0\u53471.75%\u3001\u5e7f\u544a\u6536\u5165\u63d0\u53471.53%\uff0c\u5177\u6709\u663e\u8457\u5de5\u4e1a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce Video-DeepResearch (Video-DR), extending multimodal agents from static images to continuous video streams, a setting that demands dense spatiotemporal grounding coupled with open-web exploration. Preliminary evaluations reveal two critical bottlenecks in current models: (1) modality bias, where agents bypass visual tools in favor of textual search, and (2) parametric knowledge leakage, where models rely on internal memory rather than genuine tool-augmented execution. To address these challenges, we propose Video-DR, featuring a decoupled perception-exploration pipeline with stage-wise tool unlocking that compels exhaustive cross-frame visual grounding prior to web retrieval. Our framework adopts a two-stage training recipe: supervised fine-tuning followed by Group Relative Policy Optimization (GRPO), enabling autonomous exploration that breaks the imitation-learning ceiling. Furthermore, we curate Video-DR-Bench, a human-AI collaborative benchmark comprising 200 complex, multi-hop VQA instances. Empirical results demonstrate that our Video-DeepResearch-35B-A3B establishes a new state-of-the-art of 64.0% average accuracy, surpassing proprietary Claude-4.5-Sonnet (59.0%) by 5.0 points and significantly outperforming GPT-5 (52.5%) and Gemini 2.5 Pro (57.5%). The 30B-A3B variant achieves 59.3%, competitive with Claude-4.5-Sonnet and demonstrating the effectiveness of our training paradigm even at compact scale. Code: https://github.com/Osilly/Vision-DeepResearch.", "arxiv_id": "2608.03979", "arxiv_url": "https://arxiv.org/abs/2608.03979", "authors": ["Zhen Fang", "Yu Zeng", "Wenxuan Huang", "Yiming Zhao", "Shiting Huang", "Tianfei Ren", "Qi Lu", "Qingnan Ren", "Qisheng Su", "Lionel Z. Wang", "Qingyu Yin", "Shuang Chen", "Zehui Chen", "Lin Chen", "Zhenfei Yin", "Yao Hu", "Shaohui Lin", "Wanli Ouyang", "Shaosheng Cao", "Feng Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa Video-DeepResearch\uff0c\u5c06\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4ece\u9759\u6001\u56fe\u50cf\u6269\u5c55\u5230\u8fde\u7eed\u89c6\u9891\u6d41\uff0c\u8981\u6c42\u5148\u8fdb\u884c\u5bc6\u96c6\u8de8\u5e27\u89c6\u89c9\u5b9a\u4f4d\uff0c\u518d\u5f00\u5c55\u5f00\u653e\u7f51\u7edc\u63a2\u7d22\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 Video-DR-Bench\uff0c\u5305\u542b 200 \u4e2a\u590d\u6742\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u4efb\u52a1\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03979", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6307\u51fa\u73b0\u6709\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5b58\u5728\u4e24\u5927\u74f6\u9888\uff1a\u504f\u5411\u6587\u672c\u641c\u7d22\u800c\u7ed5\u8fc7\u89c6\u89c9\u5de5\u5177\uff0c\u4ee5\u53ca\u4f9d\u8d56\u53c2\u6570\u8bb0\u5fc6\u800c\u975e\u771f\u5b9e\u5de5\u5177\u6267\u884c\u3002", "\u91c7\u7528\u89e3\u8026\u7684\u611f\u77e5-\u63a2\u7d22\u6d41\u6c34\u7ebf\u4e0e\u5206\u9636\u6bb5\u5de5\u5177\u89e3\u9501\u673a\u5236\uff0c\u5f3a\u5236\u6a21\u578b\u5728\u7f51\u9875\u68c0\u7d22\u524d\u5b8c\u6210\u5145\u5206\u7684\u8de8\u5e27\u89c6\u89c9 grounding\u3002", "\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u52a0 GRPO \u8bad\u7ec3\u5b9e\u73b0\u81ea\u4e3b\u63a2\u7d22\uff0c35B-A3B \u6a21\u578b\u5728 Video-DR-Bench \u4e0a\u8fbe\u5230 64.0% \u51c6\u786e\u7387\uff0c\u8d85\u8fc7 Claude-4.5-Sonnet\u3001GPT-5 \u548c Gemini 2.5 Pro\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03979v1", "published_at": "2026-08-04", "score": 0.307, "selected_reasons": ["HF trending (45\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03979.png", "title": "Video-DeepResearch: Towards the Next-Generation Multimodal Deepresearch Agent", "tldr": "\u9762\u5411\u89c6\u9891\u7684\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53", "upvotes": 45, "what_it_is": "\u8bba\u6587\u63d0\u51fa Video-DeepResearch\uff0c\u5c06\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4ece\u9759\u6001\u56fe\u50cf\u6269\u5c55\u5230\u8fde\u7eed\u89c6\u9891\u6d41\uff0c\u8981\u6c42\u5148\u8fdb\u884c\u5bc6\u96c6\u8de8\u5e27\u89c6\u89c9\u5b9a\u4f4d\uff0c\u518d\u5f00\u5c55\u5f00\u653e\u7f51\u7edc\u63a2\u7d22\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 Video-DR-Bench\uff0c\u5305\u542b 200 \u4e2a\u590d\u6742\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u4efb\u52a1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 DeepResearch \u8303\u5f0f\u63a8\u8fdb\u5230\u89c6\u9891\u573a\u666f\uff0c\u9488\u5bf9\u771f\u5b9e\u5de5\u5177\u4f7f\u7528\u4e2d\u7684\u89c6\u89c9\u9003\u907f\u548c\u77e5\u8bc6\u6cc4\u6f0f\u95ee\u9898\u7ed9\u51fa\u7cfb\u7edf\u6027\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u65b9\u6848\uff0c\u5e76\u5728\u590d\u6742\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u4e0a\u8d85\u8fc7\u591a\u4e2a\u95ed\u6e90\u5f3a\u6a21\u578b\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u667a\u80fd\u4f53\u4e0e\u591a\u6a21\u6001\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Omni-modal large language models (Omni-LLMs) have achieved remarkable performance on audio-visual understanding tasks, but processing long and highly redundant visual and audio token sequences incurs substantial computational overhead, demanding aggressive token compression for efficient deployment. Existing methods often degrade at low token budgets: pre-LLM compression may discard structurally important and globally distributed evidence, whereas inner-LLM compression often underexploits query-conditioned audio-visual collaboration. To address these limitations, we propose OmniPack, a training-free framework that coordinates structural compression before the LLM with task-relevant semantic refinement within the LLM. Before the LLM, OmniPack removes structural redundancy through modality-specific importance, global coverage, and similarity-aware merging. After sufficient multimodal interaction, it further consolidates diverse, task-relevant representations through textual guidance and audio-visual collaboration. Extensive experiments on five benchmarks with three Omni-LLM backbones demonstrate that OmniPack consistently achieves the best performance-efficiency trade-off across diverse retention ratios, outperforming all existing methods. Notably, on Qwen2.5-Omni-7B, OmniPack preserves 98.0% of the original performance while reducing FLOPs to 16.7%, and still retains 92.9% of the original performance with only 6.8% of the original FLOPs.", "arxiv_id": "2608.03812", "arxiv_url": "https://arxiv.org/abs/2608.03812", "authors": ["Wanshun Su", "Yang Shi", "Feihu Liu", "Ziwen Yu", "Yan Min", "Zhuoran Zhang", "Qixun Wang", "Haotian Wang", "Shixuan Liu", "Yuanxing Zhang", "Peng Wu", "Chengfu Huo", "Liang Ding"], "brief": "OmniPack \u662f\u4e00\u4e2a\u9762\u5411\u5168\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u8bad\u7ec3\u514d\u8d39\u4ee4\u724c\u538b\u7f29\u6846\u67b6\uff0c\u7ed3\u5408 LLM \u524d\u7684\u7ed3\u6784\u5197\u4f59\u538b\u7f29\u4e0e LLM \u5185\u7684\u4efb\u52a1\u8bed\u4e49\u7cbe\u70bc\u3002\u5b83\u65e8\u5728\u663e\u8457\u964d\u4f4e\u97f3\u89c6\u9891\u957f\u5e8f\u5217\u63a8\u7406\u5f00\u9500\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u591a\u6a21\u6001\u7406\u89e3\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/RowanSu/OmniPack", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2608.03812", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["LLM \u524d\u9636\u6bb5\u57fa\u4e8e\u6a21\u6001\u7279\u5b9a\u91cd\u8981\u6027\u3001\u5168\u5c40\u8986\u76d6\u4e0e\u76f8\u4f3c\u6027\u611f\u77e5\u5408\u5e76\uff0c\u538b\u7f29\u5197\u4f59\u89c6\u89c9\u548c\u97f3\u9891 token", "LLM \u5185\u9636\u6bb5\u5728\u5145\u5206\u591a\u6a21\u6001\u4ea4\u4e92\u540e\uff0c\u5229\u7528\u6587\u672c\u5f15\u5bfc\u4e0e\u97f3\u89c6\u9891\u534f\u4f5c\u8fdb\u4e00\u6b65\u4fdd\u7559\u4efb\u52a1\u76f8\u5173\u8868\u793a", "\u5728 5 \u4e2a\u57fa\u51c6\u30013 \u4e2a Omni-LLM \u9aa8\u5e72\u4e0a\u9a8c\u8bc1\uff1bQwen2.5-Omni-7B \u4e0a\u4ee5 16.7% FLOPs \u4fdd\u7559 98.0% \u539f\u6027\u80fd\uff0c6.8% FLOPs \u4e0b\u4ecd\u4fdd\u7559 92.9%"], "keywords": ["\u591a\u6a21\u6001", "\u4ee4\u724c\u538b\u7f29", "\u9ad8\u6548\u63a8\u7406", "\u97f3\u89c6\u9891\u7406\u89e3"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.03812v1", "published_at": "2026-08-04", "score": 0.306, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03812.png", "title": "OmniPack: Unified Token Compression for Efficient Omni-modal Large Language Models", "tldr": "\u8bad\u7ec3\u514d\u8d39\u5168\u6a21\u6001\u4ee4\u724c\u538b\u7f29\u6846\u67b6", "upvotes": 24, "what_it_is": "OmniPack \u662f\u4e00\u4e2a\u9762\u5411\u5168\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u8bad\u7ec3\u514d\u8d39\u4ee4\u724c\u538b\u7f29\u6846\u67b6\uff0c\u7ed3\u5408 LLM \u524d\u7684\u7ed3\u6784\u5197\u4f59\u538b\u7f29\u4e0e LLM \u5185\u7684\u4efb\u52a1\u8bed\u4e49\u7cbe\u70bc\u3002\u5b83\u65e8\u5728\u663e\u8457\u964d\u4f4e\u97f3\u89c6\u9891\u957f\u5e8f\u5217\u63a8\u7406\u5f00\u9500\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u591a\u6a21\u6001\u7406\u89e3\u6027\u80fd\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u63d0\u5347\u5168\u6a21\u6001 LLM \u7684\u63a8\u7406\u6548\u7387\uff0c\u5e76\u5728\u6781\u4f4e token/FLOPs \u9884\u7b97\u4e0b\u4f18\u4e8e\u73b0\u6709\u538b\u7f29\u65b9\u6cd5\uff0c\u5bf9\u97f3\u89c6\u9891\u591a\u6a21\u6001\u6a21\u578b\u90e8\u7f72\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Diffusion language models (dLLMs) offer an alternative to autoregressive (AR) language modeling, yet the scaling behavior of Mixture-of-Experts (MoE) dLLMs remains poorly understood. We systematically characterize how optimization hyperparameters, compute allocation, and architecture scale for MoE dLLMs, identifying quantitative differences from scaling trends previously reported for AR models. Specifically, for optimization, the optimal nominal batch size grows faster, while the optimal learning rate decays more rapidly with compute. For model--data allocation, IsoFLOP analysis reveals a slight data-side tilt: the optimal token budget grows faster than activated model-side computation. For MoE architecture, larger scales increasingly favor larger expert pools at fixed activated capacity, while moderate expert granularity remains consistently effective and the preferred fraction of activated capacity assigned to shared experts remains stable across scales. Guided by these findings, we train LLaDA MoE v2, a 30B-A3B dLLM, from scratch on 23.5T tokens. With approximately 65\\% as many pretraining tokens as Qwen3, LLaDA MoE v2 approaches Qwen3 on several knowledge, reasoning, and coding benchmarks. After supervised fine-tuning alone, it outperforms SDAR Chat on seven of eight reasoning and coding benchmarks and remains close to Qwen3 on several tasks. These results establish practical scaling laws and design principles for MoE dLLMs.", "arxiv_id": "2608.03457", "arxiv_url": "https://arxiv.org/abs/2608.03457", "authors": ["Fengqi Zhu", "Shaoxuan Xu", "Jingyang Ou", "Zebin You", "Yipeng Xing", "Huabin Liu", "Xiaolu Zhang", "Jun Zhou", "Zhenzhong Lan", "Yankai Lin", "Wayne Xin Zhao", "Jianguo Li", "Chongxuan Li", "Ji-Rong Wen"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u6df7\u5408\u4e13\u5bb6\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff08MoE dLLM\uff09\u5728\u4f18\u5316\u8d85\u53c2\u3001\u7b97\u529b\u5206\u914d\u548c\u67b6\u6784\u8bbe\u8ba1\u4e0a\u7684 scaling \u884c\u4e3a\uff0c\u5e76\u636e\u6b64\u4ece\u96f6\u8bad\u7ec3\u4e86 LLaDA MoE v2\u3002\u8be5\u6a21\u578b\u4e3a 30B-A3B \u89c4\u6a21\uff0c\u5728 23.5T token \u4e0a\u9884\u8bad\u7ec3\uff0c\u5728\u77e5\u8bc6\u3001\u63a8\u7406\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u63a5\u8fd1 Qwen3\uff0c\u5e76\u663e\u8457\u8d85\u8fc7 SDAR Chat\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.03457", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0 MoE dLLM \u4e0e\u81ea\u56de\u5f52\u6a21\u578b\u7684\u6269\u5c55\u8d8b\u52bf\u4e0d\u540c\uff1a\u6700\u4f18\u540d\u4e49 batch size \u968f\u7b97\u529b\u589e\u957f\u66f4\u5feb\uff0c\u6700\u4f18\u5b66\u4e60\u7387\u4e0b\u964d\u66f4\u5feb", "IsoFLOP \u5206\u6790\u663e\u793a\u6700\u4f18\u5206\u914d\u7565\u504f\u5411\u6570\u636e\u4fa7\uff1atoken \u9884\u7b97\u589e\u957f\u901f\u5ea6\u5feb\u4e8e\u6fc0\u6d3b\u6a21\u578b\u8ba1\u7b97\u91cf", "\u67b6\u6784\u4e0a\uff0c\u5927\u89c4\u6a21\u66f4\u504f\u597d\u56fa\u5b9a\u6fc0\u6d3b\u5bb9\u91cf\u4e0b\u66f4\u5927\u7684\u4e13\u5bb6\u6c60\uff0c\u4e2d\u7b49\u4e13\u5bb6\u7c92\u5ea6\u7a33\u5b9a\u6709\u6548\uff0c\u5171\u4eab\u4e13\u5bb6\u7684\u6fc0\u6d3b\u5bb9\u91cf\u5360\u6bd4\u5728\u4e0d\u540c\u89c4\u6a21\u4e0b\u8f83\u7a33\u5b9a"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u6269\u5c55\u89c4\u5f8b"], "num_comments": 2, "on_hf": true, "organization": "GSAI-ML", "pdf_url": "https://arxiv.org/pdf/2608.03457v1", "published_at": "2026-08-04", "score": 0.292, "selected_reasons": ["HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03457.png", "title": "LLaDA MoE v2: Scaling Mixture-of-Experts Diffusion Language Models", "tldr": "\u7cfb\u7edf\u603b\u7ed3MoE\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u6269\u5c55\u89c4\u5f8b", "upvotes": 25, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u6df7\u5408\u4e13\u5bb6\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff08MoE dLLM\uff09\u5728\u4f18\u5316\u8d85\u53c2\u3001\u7b97\u529b\u5206\u914d\u548c\u67b6\u6784\u8bbe\u8ba1\u4e0a\u7684 scaling \u884c\u4e3a\uff0c\u5e76\u636e\u6b64\u4ece\u96f6\u8bad\u7ec3\u4e86 LLaDA MoE v2\u3002\u8be5\u6a21\u578b\u4e3a 30B-A3B \u89c4\u6a21\uff0c\u5728 23.5T token \u4e0a\u9884\u8bad\u7ec3\uff0c\u5728\u77e5\u8bc6\u3001\u63a8\u7406\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u63a5\u8fd1 Qwen3\uff0c\u5e76\u663e\u8457\u8d85\u8fc7 SDAR Chat\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a MoE \u6269\u6563\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u7684 scaling laws \u548c\u67b6\u6784\u8bbe\u8ba1\u51c6\u5219\uff0c\u5e76\u7528\u5927\u89c4\u6a21\u5b9e\u8bad\u6a21\u578b\u9a8c\u8bc1\u4e86 dLLM \u5728\u4e3b\u6d41\u77e5\u8bc6\u3001\u63a8\u7406\u548c\u4ee3\u7801\u57fa\u51c6\u4e0a\u903c\u8fd1\u5f3a\u81ea\u56de\u5f52\u6a21\u578b\u7684\u6f5c\u529b\u3002"}, {"abstract": "Large Language Model (LLM) agents have seen rapid adoption in software engineering. As agents take a greater role in the actual generation of code, they are making larger changes, spanning tens to hundreds of lines. This makes manual review of agent results increasingly infeasible, leading developers to turn to explanations to understand enacted changes. Despite this, there are no benchmarks that evaluate the trustworthiness of agent-generated explanations. To bridge this gap, we propose ExplainBench, a benchmark to automatically evaluate explanations from coding agents. ExplainBench is based on the intuition that informative explanations should enable an LLM to correctly answer questions, allowing quantitative comparison of explanation quality between agents. With this observation, we construct a suite of questions that evaluates whether explanations accurately describe (1) the intended behavior of buggy code and (2) the effect of applying the agent patch itself. Experiments first reveal that explanation quality is a distinct axis of agent evaluation: ExplainBench ranks agents differently from the widely-used SWE-bench Verified benchmark. A deeper breakdown of explanation quality in agents shows frequent problems in explanations, such that explanations often claim that a patch is correct when it is not. Based on this insight, we implement and evaluate an explanation audit agent which runs additional tests to validate and refine explanations. This agent improved the explanations of all evaluated agents, demonstrating agent explanations can be automatically made more trustworthy.", "arxiv_id": "2607.26451", "arxiv_url": "https://arxiv.org/abs/2607.26451", "authors": ["Zhiyuan Pan", "Sungmin Kang", "Imam Nur Bani Yusuf", "Abhik Roychoudhury"], "brief": "\u8bba\u6587\u63d0\u51fa ExplainBench\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30\u4ee3\u7801\u667a\u80fd\u4f53\u751f\u6210\u7684\u8865\u4e01\u89e3\u91ca\u662f\u5426\u51c6\u786e\u53ef\u4fe1\u3002\u5176\u6838\u5fc3\u601d\u8def\u662f\uff1a\u9ad8\u8d28\u91cf\u89e3\u91ca\u5e94\u80fd\u5e2e\u52a9\u53e6\u4e00\u4e2a LLM \u6b63\u786e\u56de\u7b54\u5173\u4e8e\u539f\u59cb\u7f3a\u9677\u884c\u4e3a\u548c\u8865\u4e01\u6548\u679c\u7684\u95ee\u9898\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/explainbench/explainbench-cli", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.26451", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6784\u5efa\u95ee\u9898\u96c6\uff0c\u5206\u522b\u68c0\u9a8c\u89e3\u91ca\u662f\u5426\u51c6\u786e\u63cf\u8ff0 buggy \u4ee3\u7801\u7684\u9884\u671f\u884c\u4e3a\uff0c\u4ee5\u53ca\u667a\u80fd\u4f53\u8865\u4e01\u5b9e\u9645\u4ea7\u751f\u7684\u5f71\u54cd", "\u5b9e\u9a8c\u53d1\u73b0\u89e3\u91ca\u8d28\u91cf\u4e0e SWE-bench Verified \u7b49\u4fee\u590d\u80fd\u529b\u6392\u540d\u5e76\u4e0d\u4e00\u81f4\uff0c\u662f\u4ee3\u7801\u667a\u80fd\u4f53\u8bc4\u4f30\u4e2d\u7684\u72ec\u7acb\u7ef4\u5ea6", "\u63ed\u793a\u667a\u80fd\u4f53\u89e3\u91ca\u5e38\u89c1\u4e0d\u53ef\u4fe1\u95ee\u9898\uff0c\u4f8b\u5982\u8865\u4e01\u9519\u8bef\u65f6\u4ecd\u58f0\u79f0\u5176\u6b63\u786e\uff0c\u5e76\u63d0\u51fa\u901a\u8fc7\u989d\u5916\u6d4b\u8bd5\u5ba1\u8ba1\u89e3\u91ca\u7684 agent \u6765\u6539\u8fdb\u53ef\u4fe1\u5ea6"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.26451v1", "published_at": "2026-07-29", "score": 0.276, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.26451.png", "title": "ExplainBench: Evaluating Code Explanations from Agents", "tldr": "\u8bc4\u6d4b\u4ee3\u7801\u667a\u80fd\u4f53\u89e3\u91ca\u53ef\u4fe1\u5ea6\u7684\u65b0\u57fa\u51c6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa ExplainBench\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30\u4ee3\u7801\u667a\u80fd\u4f53\u751f\u6210\u7684\u8865\u4e01\u89e3\u91ca\u662f\u5426\u51c6\u786e\u53ef\u4fe1\u3002\u5176\u6838\u5fc3\u601d\u8def\u662f\uff1a\u9ad8\u8d28\u91cf\u89e3\u91ca\u5e94\u80fd\u5e2e\u52a9\u53e6\u4e00\u4e2a LLM \u6b63\u786e\u56de\u7b54\u5173\u4e8e\u539f\u59cb\u7f3a\u9677\u884c\u4e3a\u548c\u8865\u4e01\u6548\u679c\u7684\u95ee\u9898\u3002", "why_notable": "\u968f\u7740\u4ee3\u7801\u667a\u80fd\u4f53\u4fee\u6539\u89c4\u6a21\u6269\u5927\uff0c\u5f00\u53d1\u8005\u8d8a\u6765\u8d8a\u4f9d\u8d56\u89e3\u91ca\u6765\u5ba1\u67e5\u53d8\u66f4\uff1bExplainBench \u9996\u6b21\u7cfb\u7edf\u8861\u91cf\u89e3\u91ca\u53ef\u4fe1\u5ea6\uff0c\u5e76\u5c55\u793a\u89e3\u91ca\u53ef\u88ab\u81ea\u52a8\u5ba1\u8ba1\u548c\u6539\u8fdb\uff0c\u5bf9\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u843d\u5730\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Query-agnostic KV cache eviction compresses a context once and reuses the resulting cache for arbitrary future queries, but performance can collapse under tight budgets. Existing methods primarily improve which original KV pairs are retained. We introduce RestoreKV, which complements this selection-based formulation with learned restoration under the same total KV budget. Our key insight is that, although the information lost through eviction is context-specific, the mechanism for generating its compact complement can be shared across contexts. After context prefill, a few restore tokens attend to the full KV cache in a single LoRA-adapted pass, generating a compact, context-conditioned restore cache. The base importance scorer and eviction rule remain unchanged, and the adapters are disabled for all subsequent queries and decoding. RestoreKV is trained through parameter-efficient self-distillation from the frozen full-cache model, optimizing only $0.4\\%$ of the parameters and requiring no task-specific tuning. Across four backbones and four long-context benchmarks, RestoreKV substantially reduces compression-induced degradation. On Qwen3-4B, it improves 59 of 60 paired, budget-matched settings across five base eviction methods; at a $5\\%$ budget, it raises KVzip from $38.2$ to $73.2$ on RULER-4K. Applied to KVzip+, RestoreKV reaches $86.4$ RULER accuracy at $16\\times$ compression on the KVPress Benchmark, while adding less than $0.5\\%$ one-time cache-construction overhead in a 32K-context evaluation. Our project page is available at https://paper.pnu-cvsp.com/RestoreKV/", "arxiv_id": "2608.01247", "arxiv_url": "https://arxiv.org/abs/2608.01247", "authors": ["Changwoo Baek", "Seungjun Shin", "Kyeongbo Kong"], "brief": "RestoreKV \u662f\u4e00\u79cd\u9762\u5411\u67e5\u8be2\u65e0\u5173 KV cache \u9a71\u9010\u7684\u5b66\u4e60\u5f0f\u6062\u590d\u65b9\u6cd5\uff1a\u5728\u4fdd\u7559\u539f\u6709\u91cd\u8981\u6027\u6253\u5206\u548c\u9a71\u9010\u89c4\u5219\u4e0d\u53d8\u7684\u524d\u63d0\u4e0b\uff0c\u7528\u5c11\u91cf restore tokens \u4ece\u5b8c\u6574\u4e0a\u4e0b\u6587\u7f13\u5b58\u4e2d\u751f\u6210\u7d27\u51d1\u7684\u8865\u5145\u7f13\u5b58\u3002\u5b83\u901a\u8fc7\u51bb\u7ed3\u5168\u7f13\u5b58\u6a21\u578b\u8fdb\u884c\u53c2\u6570\u9ad8\u6548\u81ea\u84b8\u998f\u8bad\u7ec3\uff0c\u4ec5\u4f18\u5316 LoRA \u9002\u914d\u5668\uff0c\u5e76\u5728\u540e\u7eed\u67e5\u8be2\u4e0e\u89e3\u7801\u9636\u6bb5\u5173\u95ed\u9002\u914d\u5668\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.01247", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u201c\u9009\u62e9\u4fdd\u7559\u54ea\u4e9b KV\u201d\u4e0e\u201c\u5b66\u4e60\u6062\u590d\u88ab\u4e22\u5931\u4fe1\u606f\u201d\u7ed3\u5408\uff0c\u5728\u76f8\u540c\u603b KV \u9884\u7b97\u4e0b\u63d0\u5347\u538b\u7f29\u540e\u6027\u80fd", "restore tokens \u53ea\u5728\u4e0a\u4e0b\u6587\u9884\u586b\u5145\u540e\u8fdb\u884c\u4e00\u6b21 LoRA \u9002\u914d\u524d\u5411\uff0c\u751f\u6210\u4e0a\u4e0b\u6587\u6761\u4ef6\u5316\u7684 restore cache\uff0c\u67e5\u8be2\u9636\u6bb5\u4e0d\u589e\u52a0\u6301\u7eed\u5f00\u9500", "\u5728\u56db\u4e2a\u6a21\u578b\u548c\u56db\u4e2a\u957f\u4e0a\u4e0b\u6587\u57fa\u51c6\u4e0a\u7a33\u5b9a\u63d0\u5347\uff1bQwen3-4B \u4e0a 60 \u4e2a\u914d\u5bf9\u8bbe\u7f6e\u4e2d\u63d0\u5347 59 \u4e2a\uff0c5%\u9884\u7b97\u4e0b RULER-4K \u4ece 38.2 \u63d0\u5347\u5230 73.2"], "keywords": ["KV\u7f13\u5b58", "\u957f\u4e0a\u4e0b\u6587", "\u6a21\u578b\u538b\u7f29", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.01247v1", "published_at": "2026-08-02", "score": 0.267, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.01247.png", "title": "RestoreKV: Recovering Full-Cache Behavior Under Aggressive Query-Agnostic KV Cache Eviction", "tldr": "\u7528\u5c11\u91cf\u6062\u590dtoken\u8865\u56deKV\u9a71\u9010\u635f\u5931\u4fe1\u606f", "upvotes": 9, "what_it_is": "RestoreKV \u662f\u4e00\u79cd\u9762\u5411\u67e5\u8be2\u65e0\u5173 KV cache \u9a71\u9010\u7684\u5b66\u4e60\u5f0f\u6062\u590d\u65b9\u6cd5\uff1a\u5728\u4fdd\u7559\u539f\u6709\u91cd\u8981\u6027\u6253\u5206\u548c\u9a71\u9010\u89c4\u5219\u4e0d\u53d8\u7684\u524d\u63d0\u4e0b\uff0c\u7528\u5c11\u91cf restore tokens \u4ece\u5b8c\u6574\u4e0a\u4e0b\u6587\u7f13\u5b58\u4e2d\u751f\u6210\u7d27\u51d1\u7684\u8865\u5145\u7f13\u5b58\u3002\u5b83\u901a\u8fc7\u51bb\u7ed3\u5168\u7f13\u5b58\u6a21\u578b\u8fdb\u884c\u53c2\u6570\u9ad8\u6548\u81ea\u84b8\u998f\u8bad\u7ec3\uff0c\u4ec5\u4f18\u5316 LoRA \u9002\u914d\u5668\uff0c\u5e76\u5728\u540e\u7eed\u67e5\u8be2\u4e0e\u89e3\u7801\u9636\u6bb5\u5173\u95ed\u9002\u914d\u5668\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d KV cache \u538b\u7f29\u7684\u6838\u5fc3\u75db\u70b9\uff0c\u5728\u6781\u4f4e\u989d\u5916\u53c2\u6570\u548c\u51e0\u4e4e\u65e0\u8fd0\u884c\u65f6\u5f00\u9500\u4e0b\u663e\u8457\u6062\u590d\u5168\u7f13\u5b58\u6027\u80fd\uff0c\u53ef\u76f4\u63a5\u53e0\u52a0\u5230\u73b0\u6709\u67e5\u8be2\u65e0\u5173\u9a71\u9010\u65b9\u6cd5\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce a new problem domain for human action recognition: the fine-grained analysis of children\u0027s gait behaviors from standard RGB video. We specifically target the ambulatory patterns of children aged 3-17 years. Such behaviors arise naturally in the diagnosis and treatment of several critical developmental and neuromuscular disorders, such as cerebral palsy and hemiplegia. Despite their clinical value, current 3D sensor-based gait analysis systems are expensive, intrusive, and often impractical for young subjects. To address this, we introduce a new dataset comprising over 1,100 high-frame-rate (60 FPS) video sequences from 110 subjects, accompanied by synchronized, anonymized pose sequences. In each session, the child performs a 5-second \"walk-around\" task, capturing the gait cycle from multiple viewpoints. Crucially, we demonstrate that current state-of-the-art approaches, including gait foundation models and Multimodal Large Language Models (MLLMs), fail to effectively resolve these clinical nuances. We identify the key technical challenges in analyzing these erratic and subtle motor patterns and describe a unified end-to-end framework for decoding fundamental components of pediatric gait. Through comprehensive experimental results, we demonstrate the potential of this dataset to drive novel research questions and establish a rigorous baseline for automated child gait assessment.", "arxiv_id": "2608.00371", "arxiv_url": "https://arxiv.org/abs/2608.00371", "authors": ["Yifan Shen", "Boyi Li", "Meihuan Huang", "Yuanzhe Liu", "Xu Cao", "Jinyang Jin", "Zhengyuan Li", "Anglin Liu", "Junho Kim", "Jingyuan Zhu", "Lan Fangzhou", "Jianguo Cao", "Jintai Chen", "Ismini Lourentzou", "James Matthew Rehg"], "brief": "\u8bba\u6587\u5f15\u5165\u4ece\u666e\u901a RGB \u89c6\u9891\u5206\u6790\u513f\u7ae5\u6b65\u6001\u884c\u4e3a\u7684\u65b0\u4efb\u52a1\uff0c\u9762\u5411 3-17 \u5c81\u513f\u7ae5\u7684\u4e34\u5e8a\u76f8\u5173\u6b65\u6001\u6a21\u5f0f\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 110 \u540d\u53d7\u8bd5\u8005\u30011100 \u591a\u6bb5 60FPS \u89c6\u9891\u53ca\u540c\u6b65\u533f\u540d\u59ff\u6001\u5e8f\u5217\u7684\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51fa\u7aef\u5230\u7aef\u6846\u67b6\u6765\u89e3\u7801\u513f\u79d1\u6b65\u6001\u57fa\u7840\u7ec4\u4ef6\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/PediaMedAI/ChildrenGait", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.00371", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6570\u636e\u96c6\u8986\u76d6\u591a\u89c6\u89d2 5 \u79d2\u201cwalk-around\u201d\u4efb\u52a1\uff0c\u8bb0\u5f55\u513f\u7ae5\u5b8c\u6574\u6b65\u6001\u5468\u671f\uff0c\u9002\u5408\u7814\u7a76\u7ec6\u5fae\u548c\u4e0d\u7a33\u5b9a\u7684\u8fd0\u52a8\u6a21\u5f0f", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u6b65\u6001\u57fa\u7840\u6a21\u578b\u548c\u591a\u6a21\u6001\u5927\u6a21\u578b\u96be\u4ee5\u8bc6\u522b\u513f\u7ae5\u6b65\u6001\u4e2d\u7684\u4e34\u5e8a\u7ec6\u7c92\u5ea6\u5dee\u5f02", "\u5efa\u7acb\u81ea\u52a8\u5316\u513f\u7ae5\u6b65\u6001\u8bc4\u4f30\u7684\u7edf\u4e00\u57fa\u7ebf\uff0c\u7784\u51c6\u8111\u762b\u3001\u504f\u762b\u7b49\u53d1\u80b2\u4e0e\u795e\u7ecf\u808c\u8089\u969c\u788d\u76f8\u5173\u5e94\u7528"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u52a8\u4f5c\u8bc6\u522b", "\u59ff\u6001\u4f30\u8ba1", "\u533b\u7597AI"], "num_comments": 2, "on_hf": true, "organization": "PediaMed AI", "pdf_url": "https://arxiv.org/pdf/2608.00371v1", "published_at": "2026-08-01", "score": 0.256, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00371.png", "title": "Decoding Children\u0027s Gait Behavior", "tldr": "\u63d0\u51fa\u513f\u7ae5\u7ec6\u7c92\u5ea6\u6b65\u6001\u8bc6\u522b\u6570\u636e\u96c6\u4e0e\u57fa\u7ebf\u6846\u67b6", "upvotes": 11, "what_it_is": "\u8bba\u6587\u5f15\u5165\u4ece\u666e\u901a RGB \u89c6\u9891\u5206\u6790\u513f\u7ae5\u6b65\u6001\u884c\u4e3a\u7684\u65b0\u4efb\u52a1\uff0c\u9762\u5411 3-17 \u5c81\u513f\u7ae5\u7684\u4e34\u5e8a\u76f8\u5173\u6b65\u6001\u6a21\u5f0f\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u5305\u542b 110 \u540d\u53d7\u8bd5\u8005\u30011100 \u591a\u6bb5 60FPS \u89c6\u9891\u53ca\u540c\u6b65\u533f\u540d\u59ff\u6001\u5e8f\u5217\u7684\u6570\u636e\u96c6\uff0c\u5e76\u63d0\u51fa\u7aef\u5230\u7aef\u6846\u67b6\u6765\u89e3\u7801\u513f\u79d1\u6b65\u6001\u57fa\u7840\u7ec4\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u513f\u7ae5\u4e34\u5e8a\u6b65\u6001\u5206\u6790\u4ece\u6602\u8d35\u3001\u4fb5\u5165\u5f0f\u7684 3D \u4f20\u611f\u7cfb\u7edf\u63a8\u8fdb\u5230\u666e\u901a RGB \u89c6\u9891\u573a\u666f\uff0c\u5e76\u63d0\u4f9b\u65b0\u6570\u636e\u96c6\u4e0e\u57fa\u7ebf\uff0c\u6709\u671b\u63a8\u52a8\u4f4e\u6210\u672c\u513f\u79d1\u8fd0\u52a8\u8bc4\u4f30\u7814\u7a76\u3002"}, {"abstract": "Scientific poster construction compresses a long multimodal paper into a readable, editable canvas. Existing systems hide request-level failures by scoring only completed outputs; direct image generation is not element-editable, while coding-agent workflows are costly. PosterMELD is a template-conditioned multi-agent pipeline: capacity-aware slots guide writing before rendering, and deterministic gates plus vision-language model (VLM) review route failures to bounded repair. Each accepted request exports editable PowerPoint (PPTX) and Portable Network Graphics (PNG) artifacts; explicit design controls yield same-paper variants. Across 621 papers, Print-Ready Rate (PRR) counts requests passing geometric, readability, asset-integrity, and obvious-factual-error checks, with native editability reported separately. A frozen VLM assigns conditional Craftsmanship-Harmony-Expressiveness (CHE) scores to print-ready outputs. PosterMELD attains 81.3% PRR, 3.4 times P2P\u0027s rate and 5.2 times PosterGen\u0027s, and the highest conditional CHE among generated methods with multiple print-ready outputs. Native editability and explicit design controls are retained at a mean cost of USD 0.38 per request, 3.5% of Codex+Skill\u0027s. Code and resources are available at https://github.com/Shannon4Science/PosterMELD.", "arxiv_id": "2608.02218", "arxiv_url": "https://arxiv.org/abs/2608.02218", "authors": ["Haojie Hu", "Chenhao Dang", "Yaojia Liu", "Hengrui Kang", "Conghui He", "Weijia Li"], "brief": "PosterMELD \u662f\u4e00\u4e2a\u6a21\u677f\u6761\u4ef6\u5316\u7684\u591a\u667a\u80fd\u4f53\u8bba\u6587\u5230\u6d77\u62a5\u751f\u6210\u6d41\u7a0b\uff0c\u5c06\u957f\u7bc7\u591a\u6a21\u6001\u8bba\u6587\u538b\u7f29\u4e3a\u53ef\u8bfb\u3001\u53ef\u7f16\u8f91\u7684 PPTX/PNG \u6d77\u62a5\u3002\u5b83\u901a\u8fc7\u5bb9\u91cf\u611f\u77e5\u7248\u4f4d\u3001\u786e\u5b9a\u6027\u68c0\u67e5\u95e8\u4e0e VLM \u5ba1\u6838\uff0c\u5b9e\u73b0\u53ef\u63a7\u8bbe\u8ba1\u591a\u6837\u6027\u548c\u6709\u754c\u4fee\u590d\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Shannon4Science/PosterMELD", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.02218", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51fa Print-Ready Rate\uff08PRR\uff09\u8bc4\u6d4b\uff0c\u901a\u8fc7\u51e0\u4f55\u3001\u53ef\u8bfb\u6027\u3001\u7d20\u6750\u5b8c\u6574\u6027\u548c\u660e\u663e\u4e8b\u5b9e\u9519\u8bef\u68c0\u67e5\u6765\u7edf\u8ba1\u771f\u6b63\u53ef\u5370\u5237\u7684\u8bf7\u6c42\u7ed3\u679c", "\u5728 621 \u7bc7\u8bba\u6587\u4e0a\u8fbe\u5230 81.3% PRR\uff0c\u5206\u522b\u4e3a P2P \u7684 3.4 \u500d\u3001PosterGen \u7684 5.2 \u500d", "\u4fdd\u7559\u539f\u751f\u53ef\u7f16\u8f91\u6027\u4e0e\u663e\u5f0f\u8bbe\u8ba1\u63a7\u5236\uff0c\u5e73\u5747\u6bcf\u6b21\u8bf7\u6c42\u6210\u672c 0.38 \u7f8e\u5143\uff0c\u4ec5\u4e3a Codex+Skill \u7684 3.5%"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u6587\u6863\u751f\u6210", "\u81ea\u52a8\u5316\u8bbe\u8ba1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02218v1", "published_at": "2026-08-03", "score": 0.239, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02218.png", "title": "PosterMELD: Multi-Agent Paper-to-Poster Generation for Controllable Design Diversity with Editable Print-Ready Outputs", "tldr": "\u591a\u667a\u80fd\u4f53\u5c06\u8bba\u6587\u751f\u6210\u53ef\u7f16\u8f91\u5370\u5237\u6d77\u62a5", "upvotes": 6, "what_it_is": "PosterMELD \u662f\u4e00\u4e2a\u6a21\u677f\u6761\u4ef6\u5316\u7684\u591a\u667a\u80fd\u4f53\u8bba\u6587\u5230\u6d77\u62a5\u751f\u6210\u6d41\u7a0b\uff0c\u5c06\u957f\u7bc7\u591a\u6a21\u6001\u8bba\u6587\u538b\u7f29\u4e3a\u53ef\u8bfb\u3001\u53ef\u7f16\u8f91\u7684 PPTX/PNG \u6d77\u62a5\u3002\u5b83\u901a\u8fc7\u5bb9\u91cf\u611f\u77e5\u7248\u4f4d\u3001\u786e\u5b9a\u6027\u68c0\u67e5\u95e8\u4e0e VLM \u5ba1\u6838\uff0c\u5b9e\u73b0\u53ef\u63a7\u8bbe\u8ba1\u591a\u6837\u6027\u548c\u6709\u754c\u4fee\u590d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8bba\u6587\u6d77\u62a5\u751f\u6210\u4ece\u4e0d\u53ef\u7f16\u8f91\u7684\u56fe\u50cf\u8f93\u51fa\u63a8\u8fdb\u5230\u53ef\u7f16\u8f91\u3001\u53ef\u5370\u5237\u3001\u53ef\u63a7\u98ce\u683c\u53d8\u5316\u7684\u5b9e\u7528\u6d41\u7a0b\uff0c\u5e76\u4ee5\u8bf7\u6c42\u7ea7\u6210\u529f\u7387\u63ed\u793a\u4e86\u73b0\u6709\u7cfb\u7edf\u5e38\u88ab\u5b8c\u6210\u6837\u672c\u8bc4\u5206\u63a9\u76d6\u7684\u5931\u8d25\u95ee\u9898\u3002"}, {"abstract": "Weight-only quantization substantially reduces the storage of large language model (LLM) transformer blocks, but practical backends often retain the final language-modeling head (LM-head) in BF16 or FP16. Quantizing this projection naively can strongly perturb the vocabulary-logit distribution. We present ARCHead, a packed LM-head compressor that combines a quantized low-rank core, group-wise INT4 residuals, and a low-rank correction fitted in an activation-derived metric. ARCHead stores no dense BF16 head and reduces persistent LM-head storage by 3.7-3.9x. On Qwen3-8B-Base, it uses 25.6% of BF16 head storage while attaining 1.007 relative perplexity; storage-matched naive INT4 yields 1.14-1.16. Replacing the BF16 head left by AWQ or bitsandbytes adds only 0.006-0.007 cross-entropy, with less than 2% throughput change in our measurements. ARCHead therefore complements block quantizers by compressing the large output projection they can leave untouched. Code is available at https://github.com/suayptalha/archead.", "arxiv_id": "2608.02703", "arxiv_url": "https://arxiv.org/abs/2608.02703", "authors": ["\u015euayp Talha Kocabay", "Talha R\u00fczgar Akku\u015f", "Kamer Ali Yuksel"], "brief": "\u8bba\u6587\u63d0\u51fa ARCHead\uff0c\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u6700\u7ec8 LM-head \u7684\u538b\u7f29\u65b9\u6cd5\u3002\u5b83\u7ed3\u5408\u91cf\u5316\u4f4e\u79e9\u6838\u5fc3\u3001\u5206\u7ec4 INT4 \u6b8b\u5dee\u548c\u57fa\u4e8e\u6fc0\u6d3b\u5ea6\u91cf\u62df\u5408\u7684\u4f4e\u79e9\u6821\u6b63\uff0c\u5728\u4e0d\u4fdd\u7559 BF16 \u7a20\u5bc6\u8f93\u51fa\u5934\u7684\u60c5\u51b5\u4e0b\u538b\u7f29\u8bcd\u8868\u6295\u5f71\u5c42\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/suayptalha/archead", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.02703", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u73b0\u6709\u6743\u91cd\u91cf\u5316\u5e38\u4fdd\u7559 BF16/FP16 LM-head \u7684\u95ee\u9898\uff0c\u4e13\u95e8\u538b\u7f29\u6700\u7ec8\u8bed\u8a00\u5efa\u6a21\u8f93\u51fa\u6295\u5f71\u5c42", "\u91c7\u7528\u91cf\u5316\u4f4e\u79e9\u6838\u5fc3\u3001group-wise INT4 \u6b8b\u5dee\u4e0e activation-derived metric \u4e0b\u7684\u4f4e\u79e9\u6821\u6b63\uff0c\u51cf\u5c11\u5bf9\u8bcd\u8868 logit \u5206\u5e03\u7684\u6270\u52a8", "\u5728 Qwen3-8B-Base \u4e0a\u4ec5\u4f7f\u7528 BF16 head \u5b58\u50a8\u7684 25.6%\uff0c\u76f8\u5bf9\u56f0\u60d1\u5ea6 1.007\uff1b\u76f8\u6bd4\u540c\u7b49\u5b58\u50a8\u7684\u6734\u7d20 INT4 \u660e\u663e\u66f4\u7a33"], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u91cf\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4f4e\u79e9\u5206\u89e3"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.02703v1", "published_at": "2026-08-03", "score": 0.236, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.02703.png", "title": "ARCHead: Activation-Metric Residual Correction for Large Language Model Output Heads", "tldr": "ARCHead\u9ad8\u6548\u538b\u7f29LLM\u8f93\u51fa\u5934\u4e14\u51e0\u4e4e\u4e0d\u6389\u70b9", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa ARCHead\uff0c\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u6700\u7ec8 LM-head \u7684\u538b\u7f29\u65b9\u6cd5\u3002\u5b83\u7ed3\u5408\u91cf\u5316\u4f4e\u79e9\u6838\u5fc3\u3001\u5206\u7ec4 INT4 \u6b8b\u5dee\u548c\u57fa\u4e8e\u6fc0\u6d3b\u5ea6\u91cf\u62df\u5408\u7684\u4f4e\u79e9\u6821\u6b63\uff0c\u5728\u4e0d\u4fdd\u7559 BF16 \u7a20\u5bc6\u8f93\u51fa\u5934\u7684\u60c5\u51b5\u4e0b\u538b\u7f29\u8bcd\u8868\u6295\u5f71\u5c42\u3002", "why_notable": "LM-head \u5728\u5927\u8bcd\u8868\u6a21\u578b\u4e2d\u5360\u7528\u663e\u8457\u5b58\u50a8\uff0c\u800c\u8bb8\u591a\u91cf\u5316\u540e\u7aef\u4ecd\u5c06\u5176\u4fdd\u7559\u4e3a\u9ad8\u7cbe\u5ea6\u3002ARCHead\u8865\u9f50\u4e86Transformer\u5757\u91cf\u5316\u4e4b\u5916\u7684\u8f93\u51fa\u5934\u538b\u7f29\u7f3a\u53e3\uff0c\u5728\u7ea63.7-3.9\u500d\u5b58\u50a8\u8282\u7701\u4e0b\u51e0\u4e4e\u4e0d\u5f71\u54cd\u56f0\u60d1\u5ea6\u548c\u541e\u5410\uff0c\u5177\u6709\u76f4\u63a5\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Despite the remarkable recent progress of video world models, social interaction between users and the characters within these worlds remains unsupported. To fill this gap, we present HelloWorld, a video world model that enables social interaction with in-world characters. With a single button press, users can prompt the on-screen character to respond toward the camera, e.g., turning to the viewer, waving, nodding, or speaking a short greeting. To make these interactions natural, we propose a self-distillation pipeline that finetunes the video generation model on data synthesized by itself. Each synthesized clip contains both social interactions and camera motion, allowing the model to learn camera-pose conditioning without degrading interaction quality. At inference, we further introduce a training-free module that determines when the interaction occurs. Upon a button press, it modulates the cross-attention masks of the DiT so that the interaction-related text prompt attends only to the frames within the press window, temporally localizing the character\u0027s response. We further build HelloWorldBench, a 400-sample benchmark with three social interaction metrics alongside three conventional metrics, for evaluation. Experiments demonstrate that HelloWorld surpasses a variety of baselines in interaction quality, while maintaining state-of-the-art picture aesthetics and camera-pose following. Project page: https://github.com/AlayaLab/HelloWorld", "arxiv_id": "2608.05070", "arxiv_url": "https://arxiv.org/abs/2608.05070", "authors": ["Liangyang Ouyang", "Ruicong Liu", "Xuangeng Chu", "Kaipeng Zhang", "Yoichi Sato"], "brief": "HelloWorld \u662f\u4e00\u4e2a\u652f\u6301\u7528\u6237\u4e0e\u89c6\u9891\u4e16\u754c\u4e2d\u89d2\u8272\u8fdb\u884c\u793e\u4ea4\u4e92\u52a8\u7684\u89c6\u9891\u4e16\u754c\u6a21\u578b\u3002\u7528\u6237\u6309\u4e0b\u6309\u94ae\u540e\uff0c\u5c4f\u5e55\u89d2\u8272\u53ef\u81ea\u7136\u5730\u8f6c\u5411\u955c\u5934\u3001\u6325\u624b\u3001\u70b9\u5934\u6216\u77ed\u6682\u95ee\u5019\uff0c\u5e76\u4e0e\u76f8\u673a\u8fd0\u52a8\u4fdd\u6301\u4e00\u81f4\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AlayaLab/HelloWorld", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.05070", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u81ea\u84b8\u998f\u6d41\u7a0b\uff1a\u7528\u6a21\u578b\u81ea\u8eab\u5408\u6210\u5305\u542b\u793e\u4ea4\u4e92\u52a8\u4e0e\u76f8\u673a\u8fd0\u52a8\u7684\u89c6\u9891\u7247\u6bb5\uff0c\u518d\u7528\u4e8e\u5fae\u8c03\u89c6\u9891\u751f\u6210\u6a21\u578b", "\u5f15\u5165\u8bad\u7ec3-free \u63a8\u7406\u6a21\u5757\uff1a\u901a\u8fc7\u8c03\u5236 DiT \u7684\u4ea4\u53c9\u6ce8\u610f\u529b\u63a9\u7801\uff0c\u5c06\u4e92\u52a8\u63d0\u793a\u9650\u5236\u5728\u6309\u94ae\u6309\u4e0b\u7684\u65f6\u95f4\u7a97\u53e3\u5185", "\u6784\u5efa HelloWorldBench\uff1a\u5305\u542b 400 \u4e2a\u6837\u672c\uff0c\u8bc4\u4f30\u793e\u4ea4\u4e92\u52a8\u8d28\u91cf\u3001\u753b\u9762\u7f8e\u5b66\u4e0e\u76f8\u673a\u59ff\u6001\u8ddf\u968f\u7b49\u6307\u6807"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u865a\u62df\u89d2\u8272"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05070v1", "published_at": "2026-08-05", "score": 0.235, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05070.png", "title": "HelloWorld: Enabling Socially Interactive Characters in Video World Models", "tldr": "\u8ba9\u89c6\u9891\u4e16\u754c\u6a21\u578b\u89d2\u8272\u80fd\u5bf9\u7528\u6237\u4e92\u52a8\u56de\u5e94", "upvotes": 2, "what_it_is": "HelloWorld \u662f\u4e00\u4e2a\u652f\u6301\u7528\u6237\u4e0e\u89c6\u9891\u4e16\u754c\u4e2d\u89d2\u8272\u8fdb\u884c\u793e\u4ea4\u4e92\u52a8\u7684\u89c6\u9891\u4e16\u754c\u6a21\u578b\u3002\u7528\u6237\u6309\u4e0b\u6309\u94ae\u540e\uff0c\u5c4f\u5e55\u89d2\u8272\u53ef\u81ea\u7136\u5730\u8f6c\u5411\u955c\u5934\u3001\u6325\u624b\u3001\u70b9\u5934\u6216\u77ed\u6682\u95ee\u5019\uff0c\u5e76\u4e0e\u76f8\u673a\u8fd0\u52a8\u4fdd\u6301\u4e00\u81f4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7f3a\u4e4f\u89d2\u8272\u793e\u4ea4\u4e92\u52a8\u80fd\u529b\u7684\u77ed\u677f\uff0c\u4f7f\u751f\u6210\u5f0f\u89c6\u9891\u73af\u5883\u66f4\u63a5\u8fd1\u53ef\u4ea4\u4e92\u865a\u62df\u4e16\u754c\uff0c\u5bf9\u6e38\u620f\u3001\u865a\u62df\u4eba\u3001\u6c89\u6d78\u5f0f\u5185\u5bb9\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Leveraging pre-trained vision-language models (VLMs) to construct vision-language-action (VLA) models has emerged as a promising paradigm for 3D robot manipulation. However, existing 3D VLA methods remain data-hungry, exhibit limited generalization under distribution shifts, and lack explicit memory of past observations. These limitations hinder their application to data-scarce, open-world, and memory-dependent manipulation scenarios. Our previous work, BridgeVLA, improves data efficiency and generalization by preserving the input--output alignment of a pre-trained VLM during 3D action learning: raw point clouds are projected into multi-view images, and intermediate heatmaps are predicted before generating robot actions. In this work, we develop BridgeVLA++ by equipping BridgeVLA with a unified spatio-temporal memory architecture that models persistent spatial context and temporal interaction history. The resulting memory-augmented framework can reason over observation histories while preserving BridgeVLA\u0027s data efficiency and generalization capabilities. Extensive experiments show that our framework achieves strong performance on spatial manipulation tasks while exhibiting robust generalization. BridgeVLA++ further achieves state-of-the-art performance on two challenging memory-dependent manipulation benchmarks without sacrificing the data efficiency and generalization of the original BridgeVLA. In addition, BridgeVLA++ performs effectively in bimanual manipulation settings and is validated on an additional real-world robotic platform, demonstrating its scalability across tasks, environments, and robotic platforms. These results establish BridgeVLA++ as a unified 3D vision-language-action framework that simultaneously supports data-efficient learning, robust generalization, and effective memory-aware robot manipulation. Project website: https://bridgevla-plus.github.io/.", "arxiv_id": "2608.05042", "arxiv_url": "https://arxiv.org/abs/2608.05042", "authors": ["Peiyan Li", "Yuze Zhu", "Yixiang Chen", "Qisen Ma", "Yuan Xu", "Jiabing Yang", "He Guan", "Yan Huang", "Hongtao Wu", "Xiao Ma", "Tao Kong", "Liang Wang", "Tieniu Tan"], "brief": "\u8bba\u6587\u63d0\u51fa BridgeVLA++\uff0c\u5728 BridgeVLA \u7684\u591a\u89c6\u89d2\u6295\u5f71\u4e0e\u70ed\u56fe\u4e2d\u95f4\u8868\u793a\u57fa\u7840\u4e0a\uff0c\u52a0\u5165\u7edf\u4e00\u7684\u65f6\u7a7a\u8bb0\u5fc6\u67b6\u6784\u3002\u8be5\u6846\u67b6\u80fd\u540c\u65f6\u5efa\u6a21\u6301\u4e45\u7a7a\u95f4\u4e0a\u4e0b\u6587\u4e0e\u5386\u53f2\u4ea4\u4e92\u4fe1\u606f\uff0c\u7528\u4e8e\u6570\u636e\u9ad8\u6548\u3001\u53ef\u6cdb\u5316\u76843D\u673a\u5668\u4eba\u64cd\u4f5c\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.05042", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u65f6\u7a7a\u8bb0\u5fc6\u6a21\u5757\u8ba9\u6a21\u578b\u5229\u7528\u8fc7\u53bb\u89c2\u6d4b\uff0c\u89e3\u51b3\u8bb0\u5fc6\u4f9d\u8d56\u578b\u64cd\u4f5c\u4efb\u52a1\u4e2d\u7684\u5386\u53f2\u4fe1\u606f\u7f3a\u5931\u95ee\u9898", "\u5ef6\u7eed BridgeVLA \u4fdd\u6301\u9884\u8bad\u7ec3VLM\u8f93\u5165\u8f93\u51fa\u5bf9\u9f50\u7684\u601d\u8def\uff0c\u5c06\u70b9\u4e91\u8f6c\u4e3a\u591a\u89c6\u89d2\u56fe\u50cf\u5e76\u9884\u6d4b\u4e2d\u95f4\u70ed\u56fe\u4ee5\u63d0\u5347\u6570\u636e\u6548\u7387\u548c\u6cdb\u5316", "\u5728\u4e24\u4e2a\u8bb0\u5fc6\u4f9d\u8d56\u64cd\u4f5c\u57fa\u51c6\u4e0a\u8fbe\u5230SOTA\uff0c\u5e76\u6269\u5c55\u5230\u53cc\u81c2\u64cd\u4f5c\u548c\u771f\u5b9e\u673a\u5668\u4eba\u5e73\u53f0\u9a8c\u8bc1"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u65f6\u7a7a\u8bb0\u5fc6", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.05042v1", "published_at": "2026-08-05", "score": 0.233, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.05042.png", "title": "BridgeVLA++: A Data-Efficient, Generalizable, and Memory-Augmented Vision-Language-Action Framework for 3D Manipulation", "tldr": "\u5e26\u65f6\u7a7a\u8bb0\u5fc6\u7684\u9ad8\u65483D\u673a\u5668\u4ebaVLA\u6846\u67b6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa BridgeVLA++\uff0c\u5728 BridgeVLA \u7684\u591a\u89c6\u89d2\u6295\u5f71\u4e0e\u70ed\u56fe\u4e2d\u95f4\u8868\u793a\u57fa\u7840\u4e0a\uff0c\u52a0\u5165\u7edf\u4e00\u7684\u65f6\u7a7a\u8bb0\u5fc6\u67b6\u6784\u3002\u8be5\u6846\u67b6\u80fd\u540c\u65f6\u5efa\u6a21\u6301\u4e45\u7a7a\u95f4\u4e0a\u4e0b\u6587\u4e0e\u5386\u53f2\u4ea4\u4e92\u4fe1\u606f\uff0c\u7528\u4e8e\u6570\u636e\u9ad8\u6548\u3001\u53ef\u6cdb\u5316\u76843D\u673a\u5668\u4eba\u64cd\u4f5c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6570\u636e\u6548\u7387\u3001\u5206\u5e03\u5916\u6cdb\u5316\u548c\u8bb0\u5fc6\u611f\u77e5\u64cd\u4f5c\u7edf\u4e00\u5230\u4e00\u4e2a3D VLA\u6846\u67b6\u4e2d\uff0c\u5bf9\u5f00\u653e\u73af\u5883\u4e0b\u7684\u673a\u5668\u4eba\u957f\u671f\u4ea4\u4e92\u548c\u590d\u6742\u64cd\u4f5c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Audio-based piano transcription performs well on onset, pitch, and velocity, but the sustain pedal lets sound persist long after key release, so audio systems predict pedal-extended offsets rather than physical key release. Yet existing Visual Piano Transcription (VPT) systems focus on onset detection from short video windows, offset accuracy lags onset by a wide margin, and note-level velocity has not been reported. To address these gaps, we present V2N (Video to Notes), the first complete VPT system: a shared temporal backbone feeds task-specific heads for onset, offset, key hold, and velocity, jointly trained with per-frame supervision rather than only at the window center. Ablations show that multi-task supervision enables offset and velocity prediction while improving onset accuracy; longer temporal context yields further improvements. V2N sets new state-of-the-art results on PianoVAM and R3.", "arxiv_id": "2608.03419", "arxiv_url": "https://arxiv.org/abs/2608.03419", "authors": ["Yonghyun Kim", "Hoyeol Sohn", "Juhan Nam", "Alexander Lerch"], "brief": "\u8bba\u6587\u63d0\u51fa V2N\uff08Video to Notes\uff09\uff0c\u4e00\u4e2a\u57fa\u4e8e\u89c6\u9891\u7684\u5b8c\u6574\u94a2\u7434\u8f6c\u5f55\u7cfb\u7edf\uff0c\u53ef\u540c\u65f6\u9884\u6d4b\u51fb\u952e\u5f00\u59cb\u3001\u91ca\u653e\u3001\u6309\u952e\u4fdd\u6301\u4e0e\u529b\u5ea6\u3002\u5b83\u901a\u8fc7\u5171\u4eab\u65f6\u5e8f\u9aa8\u5e72\u548c\u591a\u4efb\u52a1\u5934\uff0c\u5e76\u91c7\u7528\u9010\u5e27\u76d1\u7763\uff0c\u5f25\u8865\u4e86\u73b0\u6709\u89c6\u89c9\u94a2\u7434\u8f6c\u5f55\u4e3b\u8981\u53ea\u505a onset \u68c0\u6d4b\u7684\u4e0d\u8db3\u3002", "categories": ["cs.SD", "cs.AI", "cs.CV", "cs.MM", "eess.IV"], "github_repo": "https://github.com/yonghyunk1m/V2N", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.03419", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u591a\u4efb\u52a1\u6846\u67b6\u540c\u65f6\u5efa\u6a21 onset\u3001offset\u3001key hold \u548c velocity\uff0c\u9996\u6b21\u5728\u89c6\u89c9\u94a2\u7434\u8f6c\u5f55\u4e2d\u62a5\u544a\u97f3\u7b26\u7ea7\u529b\u5ea6\u9884\u6d4b\u3002", "\u4f7f\u7528\u591a\u5e27\u957f\u65f6\u5e8f\u4e0a\u4e0b\u6587\u548c\u9010\u5e27\u76d1\u7763\uff0c\u800c\u975e\u53ea\u76d1\u7763\u89c6\u9891\u7a97\u53e3\u4e2d\u5fc3\u5e27\uff0c\u663e\u8457\u6539\u5584 offset \u4e0e velocity \u9884\u6d4b\u3002", "\u5728 PianoVAM \u548c R3 \u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u65b0\u7684\u89c6\u89c9\u94a2\u7434\u8f6c\u5f55\u6700\u4f18\u7ed3\u679c\uff0c\u5e76\u4e14\u591a\u4efb\u52a1\u8bad\u7ec3\u8fd8\u80fd\u63d0\u5347 onset \u51c6\u786e\u7387\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u97f3\u4e50\u4fe1\u606f\u68c0\u7d22", "\u89c6\u9891\u7406\u89e3", "\u65f6\u5e8f\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "PianoVAM", "pdf_url": "https://arxiv.org/pdf/2608.03419v1", "published_at": "2026-08-04", "score": 0.23, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.03419.png", "title": "Multi-Task Multi-Frame Visual Piano Transcription", "tldr": "\u9996\u4e2a\u5b8c\u6574\u89c6\u9891\u94a2\u7434\u8f6c\u5f55\u7cfb\u7edfV2N", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa V2N\uff08Video to Notes\uff09\uff0c\u4e00\u4e2a\u57fa\u4e8e\u89c6\u9891\u7684\u5b8c\u6574\u94a2\u7434\u8f6c\u5f55\u7cfb\u7edf\uff0c\u53ef\u540c\u65f6\u9884\u6d4b\u51fb\u952e\u5f00\u59cb\u3001\u91ca\u653e\u3001\u6309\u952e\u4fdd\u6301\u4e0e\u529b\u5ea6\u3002\u5b83\u901a\u8fc7\u5171\u4eab\u65f6\u5e8f\u9aa8\u5e72\u548c\u591a\u4efb\u52a1\u5934\uff0c\u5e76\u91c7\u7528\u9010\u5e27\u76d1\u7763\uff0c\u5f25\u8865\u4e86\u73b0\u6709\u89c6\u89c9\u94a2\u7434\u8f6c\u5f55\u4e3b\u8981\u53ea\u505a onset \u68c0\u6d4b\u7684\u4e0d\u8db3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u89c6\u89c9\u94a2\u7434\u8f6c\u5f55\u4ece\u201c\u68c0\u6d4b\u6309\u4e0b\u77ac\u95f4\u201d\u63a8\u8fdb\u5230\u5b8c\u6574\u97f3\u7b26\u7ea7\u8f6c\u5f55\uff0c\u5c24\u5176\u89e3\u51b3\u4e86\u97f3\u9891\u65b9\u6cd5\u53d7\u5ef6\u97f3\u8e0f\u677f\u5f71\u54cd\u96be\u4ee5\u533a\u5206\u771f\u5b9e\u677e\u952e\u7684\u95ee\u9898\uff0c\u5bf9\u97f3\u4e50\u4fe1\u606f\u68c0\u7d22\u3001\u81ea\u52a8\u4e50\u8c31\u751f\u6210\u548c\u591a\u6a21\u6001\u97f3\u4e50\u7406\u89e3\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The capabilities of an LLM agent depend not only on its model but on the harness: the executable program that constructs context, invokes tools, verifies results, and recovers from failure. Recent work shows that evolving the harness yields persistent improvements without updating model weights. Existing approaches, however, assume that all execution experience can be routed to a single optimizer, which evolves one harness along a sequential trajectory. Real agent ecosystems violate that assumption: users, organizations, and environments generate isolated streams of experience that cannot be pooled, so the experience most worth learning from is exactly the experience that cannot be directly centralized. We introduce EvolveNet, a paradigm of collaborative harness evolution that moves experience extraction to the data. A shared harness is broadcast to data-local agent deployments, each of which evolves it on its own workload. Only the resulting program adaptations are composed into an updated shared harness and redistributed, so that every participating agent inherits operational experience discovered by the others. By shifting the aggregation boundary from raw workloads to learned adaptations, EvolveNet keeps workloads local and allows multiple evolutionary searches to proceed concurrently with reduced serial depth. Because independently modified programs cannot be averaged like model parameters and may conflict when composed, EvolveNet introduces scope-typed, evidence-guided program aggregation. Across five settings spanning text-to-SQL, data-science coding, competitive programming, software engineering, and agentic workflows, EvolveNet improves the shared harness in all five, with the largest gains under heterogeneous workloads, and ablations attribute the improvement to composition of adaptations from different agents rather than to selecting among them.", "arxiv_id": "2608.04968", "arxiv_url": "https://arxiv.org/abs/2608.04968", "authors": ["Jun Nie", "Yonggang Zhang", "Qianshu Cai", "Yiu-ming Cheung", "Xinmei Tian", "Bo Han"], "brief": "\u8bba\u6587\u63d0\u51fa EvolveNet\uff0c\u8ba9\u591a\u4e2a\u672c\u5730\u90e8\u7f72\u7684 LLM \u667a\u80fd\u4f53\u5728\u5404\u81ea\u79c1\u6709\u5de5\u4f5c\u8d1f\u8f7d\u4e0a\u6f14\u5316\u6267\u884c\u6846\u67b6\uff08harness\uff09\uff0c\u518d\u53ea\u805a\u5408\u5b66\u5230\u7684\u7a0b\u5e8f\u6539\u52a8\u800c\u975e\u539f\u59cb\u6570\u636e\u3002\u5b83\u901a\u8fc7\u4f5c\u7528\u57df\u7c7b\u578b\u4e0e\u8bc1\u636e\u5f15\u5bfc\u7684\u7a0b\u5e8f\u805a\u5408\u89e3\u51b3\u6539\u52a8\u51b2\u7a81\uff0c\u5728\u6587\u672c\u5230 SQL\u3001\u4ee3\u7801\u3001\u8f6f\u4ef6\u5de5\u7a0b\u7b49\u4e94\u7c7b\u4efb\u52a1\u4e0a\u5747\u63d0\u5347\u5171\u4eab harness\uff0c\u5f02\u6784\u5de5\u4f5c\u8d1f\u8f7d\u4e0b\u6536\u76ca\u6700\u5927\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04968", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7a0b\u5e8f\u4f18\u5316", "\u534f\u540c\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04968v1", "published_at": "2026-08-05", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "EvolveNet: Collaborative Harness Evolution for Agent Self-Improvement", "tldr": "\u8bba\u6587\u63d0\u51fa EvolveNet\uff0c\u8ba9\u591a\u4e2a\u672c\u5730\u90e8\u7f72\u7684 LLM \u667a\u80fd\u4f53\u5728\u5404\u81ea\u79c1\u6709\u5de5\u4f5c\u8d1f\u8f7d\u4e0a\u6f14\u5316\u6267\u884c\u6846\u67b6\uff08harness\uff09\uff0c\u518d\u53ea\u805a\u5408\u5b66\u5230\u7684\u7a0b\u5e8f\u6539\u52a8\u800c\u975e\u539f\u59cb\u6570\u636e\u3002\u5b83\u901a\u8fc7\u4f5c\u7528\u57df\u7c7b\u578b\u4e0e\u8bc1\u636e\u5f15\u5bfc\u7684\u7a0b\u5e8f\u805a\u5408\u89e3\u51b3\u6539\u52a8\u51b2\u7a81\uff0c\u5728\u6587\u672c\u5230 SQL\u3001\u4ee3\u7801\u3001\u8f6f\u4ef6\u5de5\u7a0b\u7b49\u4e94\u7c7b\u4efb\u52a1\u4e0a\u5747\u63d0\u5347\u5171\u4eab harness\uff0c\u5f02\u6784\u5de5\u4f5c\u8d1f\u8f7d\u4e0b\u6536\u76ca\u6700\u5927\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-distillation (SD) has emerged as a compute-efficient alternative to reinforcement learning with verifiable rewards: a self-teacher, conditioned on privileged information (PI) about the answer such as a reference solution, supplies dense per-token supervision to a student that never sees it. Reported gains, however, come almost exclusively from narrow, low-difficulty settings, leaving open a basic question: as a lone objective, with no reward term, does SD teach anything? We reproduce SDPO\u0027s reported gains in its easy setting, then apply the identical setup to difficult tasks and find that it does not. Across question answering, mathematics, coding, and multi-turn agentic tool use, across reasoning modes, model sizes, and forms of PI, and under both the SDPO and OPSD recipes, the per-token loss falls steadily while validation accuracy does not improve and typically degrades. We explain this failure through a single causal chain from the loss to the model it produces. The chain begins with PI bias: having seen one particular reference solution, the teacher\u0027s per-token target is pulled toward that trajectory rather than toward correctness in general, an effect we quantify with a PI Bias Score. Trained to match this target everywhere, the student\u0027s objective becomes nearly blind to whether a rollout is correct, and the loss it assigns falls mostly on low-information tokens like stopwords, punctuation, uncertainty markers, rather than those that determine the answer; within correct rollouts the exploratory tokens incur the highest divergence, so it penalizes the hesitation that reasoning requires. The result is a flatter, less decisive student that is no better at reasoning: as a lone objective, SD optimizes a signal decoupled from task success.", "arxiv_id": "2608.04794", "arxiv_url": "https://arxiv.org/abs/2608.04794", "authors": ["Sarthak Harne", "Chinmay Karkar", "Yash Pandya", "Ahmed Awadallah", "Akshay Nambi"], "brief": "\u8bba\u6587\u7cfb\u7edf\u590d\u73b0\u5e76\u6269\u5c55\u4e86\u5e26\u7279\u6743\u4fe1\u606f\u6559\u5e08\u7684\u81ea\u84b8\u998f\u65b9\u6cd5\uff0c\u53d1\u73b0\u5176\u5728\u7b80\u5355\u4efb\u52a1\u4e0a\u6709\u6548\uff0c\u4f46\u5728\u95ee\u7b54\u3001\u6570\u5b66\u3001\u4ee3\u7801\u548c\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u7b49\u56f0\u96be\u4efb\u52a1\u4e2d\uff0c\u8bad\u7ec3\u635f\u5931\u4e0b\u964d\u5374\u9a8c\u8bc1\u51c6\u786e\u7387\u4e0d\u5347\u53cd\u964d\u3002\u4f5c\u8005\u6307\u51fa\u539f\u56e0\u662f\u6559\u5e08\u53d7\u53c2\u8003\u7b54\u6848\u8f68\u8ff9\u504f\u7f6e\u5f71\u54cd\uff0c\u5b66\u751f\u5b66\u4e60\u5230\u7684\u9010\u8bcd\u76d1\u7763\u4fe1\u53f7\u4e0e\u771f\u5b9e\u4efb\u52a1\u6210\u529f\u8131\u94a9\uff0c\u751a\u81f3\u60e9\u7f5a\u6709\u52a9\u4e8e\u63a8\u7406\u7684\u63a2\u7d22\u4e0e\u72b9\u8c6b\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.04794", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406", "\u504f\u7f6e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.04794v1", "published_at": "2026-08-05", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Privileged, but Biased: How PI-Conditioned Teachers Break Self-Distillation", "tldr": "\u8bba\u6587\u7cfb\u7edf\u590d\u73b0\u5e76\u6269\u5c55\u4e86\u5e26\u7279\u6743\u4fe1\u606f\u6559\u5e08\u7684\u81ea\u84b8\u998f\u65b9\u6cd5\uff0c\u53d1\u73b0\u5176\u5728\u7b80\u5355\u4efb\u52a1\u4e0a\u6709\u6548\uff0c\u4f46\u5728\u95ee\u7b54\u3001\u6570\u5b66\u3001\u4ee3\u7801\u548c\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u7b49\u56f0\u96be\u4efb\u52a1\u4e2d\uff0c\u8bad\u7ec3\u635f\u5931\u4e0b\u964d\u5374\u9a8c\u8bc1\u51c6\u786e\u7387\u4e0d\u5347\u53cd\u964d\u3002\u4f5c\u8005\u6307\u51fa\u539f\u56e0\u662f\u6559\u5e08\u53d7\u53c2\u8003\u7b54\u6848\u8f68\u8ff9\u504f\u7f6e\u5f71\u54cd\uff0c\u5b66\u751f\u5b66\u4e60\u5230\u7684\u9010\u8bcd\u76d1\u7763\u4fe1\u53f7\u4e0e\u771f\u5b9e\u4efb\u52a1\u6210\u529f\u8131\u94a9\uff0c\u751a\u81f3\u60e9\u7f5a\u6709\u52a9\u4e8e\u63
