cts geometric constraints into the 3D reconstruction networks through a lightweight point correspondence adapter, enabling the model to resolve ambiguities in challenging scenarios such as repetitive textures, symmetric structures, large viewpoint changes, or textureless regions. To evaluate interactive reconstruction, we curate a challenging benchmark specifically designed to expose failure modes of existing feed-forward 3D reconstruction methods. Experiments show that Click3R reduces reconstruction error with as few as a single correspondence click, improving performance on both standard and our curated benchmarks. Our results highlight that sparse human interaction provides an effective and practical mechanism for correcting geometric reconstruction errors.", "arxiv_id": "2611.12875", "arxiv_url": "https://arxiv.org/abs/2611.12875", "authors": ["Hao Gu", "Jin Yao", "Zezhou Cheng"], "brief": "Click3R\u8ba9\u7528\u6237\u5728\u56fe\u50cf\u5bf9\u4e2d\u70b9\u51fb\u5c11\u91cf\u5bf9\u5e94\u70b9\uff0c\u518d\u901a\u8fc7\u8f7b\u91cf\u70b9\u5bf9\u5e94\u9002\u914d\u5668\u5c06\u51e0\u4f55\u7ea6\u675f\u6ce8\u5165\u91cd\u5efa\u7f51\u7edc\uff0c\u5e2e\u52a9\u6a21\u578b\u6d88\u9664\u6b67\u4e49\u5e76\u4fee\u6b63\u4e09\u7ef4\u7ed3\u6784\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/UVA-Computer-Vision-Lab/click3r", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.12875", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8f7b\u91cf\u70b9\u5bf9\u5e94\u9002\u914d\u5668\u5c06\u4eba\u5de5\u5bf9\u5e94\u70b9\u8f6c\u4e3a\u51e0\u4f55\u7ea6\u675f", "\u4ec51\u7ec4\u5bf9\u5e94\u70b9\u70b9\u51fb\u5373\u53ef\u964d\u4f4e\u4e09\u7ef4\u91cd\u5efa\u8bef\u5dee", "\u6784\u5efa\u56f0\u96be\u57fa\u51c6\uff0c\u8986\u76d6\u91cd\u590d\u7eb9\u7406\u7b49\u91cd\u5efa\u5931\u8d25\u573a\u666f"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u4ea4\u4e92\u5f0f\u89c6\u89c9", "\u4eba\u673a\u534f\u540c"], "num_comments": 2, "on_hf": true, "organization": "UVA Computer Vision Lab", "pdf_url": "https://arxiv.org/pdf/2611.12875v1", "published_at": "2026-11-09", "score": 0.214, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12875.png", "title": "Click3R: Interactive Stereo 3D Reconstruction with Sparse Correspondence Clicks", "tldr": "\u7528\u6781\u5c11\u91cf\u8de8\u89c6\u89d2\u5bf9\u5e94\u70b9\u70b9\u51fb\uff0c\u8ba9\u524d\u9988\u4e09\u7ef4\u91cd\u5efa\u6a21\u578b\u80fd\u591f\u4ea4\u4e92\u4fee\u6b63\u51e0\u4f55\u9519\u8bef\u3002", "upvotes": 1, "what_it_is": "Click3R\u8ba9\u7528\u6237\u5728\u56fe\u50cf\u5bf9\u4e2d\u70b9\u51fb\u5c11\u91cf\u5bf9\u5e94\u70b9\uff0c\u518d\u901a\u8fc7\u8f7b\u91cf\u70b9\u5bf9\u5e94\u9002\u914d\u5668\u5c06\u51e0\u4f55\u7ea6\u675f\u6ce8\u5165\u91cd\u5efa\u7f51\u7edc\uff0c\u5e2e\u52a9\u6a21\u578b\u6d88\u9664\u6b67\u4e49\u5e76\u4fee\u6b63\u4e09\u7ef4\u7ed3\u6784\u3002", "why_notable": "\u628a\u4e00\u6b21\u6027\u9884\u6d4b\u7684\u4e09\u7ef4\u91cd\u5efa\u53d8\u6210\u53ef\u7ea0\u9519\u6d41\u7a0b\uff0c\u4ee5\u5c11\u91cf\u4eba\u5de5\u4ea4\u4e92\u6539\u5584\u56f0\u96be\u573a\u666f\uff0c\u5e76\u5728\u6807\u51c6\u4e0e\u81ea\u5efa\u57fa\u51c6\u4e0a\u9a8c\u8bc1\u6709\u6548\u6027\u3002"}, {"abstract": "Many of the most consequential advances promised by AI, from curing diseases and inventing new technologies to formulating new scientific theories, are fundamentally creative acts. Yet creativity is uniquely difficult to learn because it faces a creative paradox: learning to repeat past examples of creative success makes those specific examples more likely to recur, inhibiting the very creativity desired. This work argues that creativity is better modeled as an explicit process rather than as a property of individual artifacts, and proposes to learn the underlying generative principles behind the creative process. In particular, to escape the paradox, we introduce creative priming (CP), wherein a trained priming model generates a prompt-specific primer that assists a response model in being creative, explicitly decoupling the creative process from response generation. The priming model learns through GRPO, rewarding primers that lead to responses that are novel, high-quality, and diverse, thereby reinforcing the process that yields creative responses without reinforcing any specific response.", "arxiv_id": "2611.11740", "arxiv_url": "https://arxiv.org/abs/2611.11740", "authors": ["Alon Albalak", "Sebastian Gabriel", "David B. D\u0027Ambrosio", "Joel Lehman", "Kenneth O. Stanley"], "brief": "\u63d0\u51fa\u521b\u610f\u5f15\u5bfc\uff08CP\uff09\uff1a\u72ec\u7acb\u6a21\u578b\u6309\u4efb\u52a1\u751f\u6210\u5f15\u5bfc\u63d0\u793a\uff0c\u518d\u4ea4\u7ed9\u56de\u7b54\u6a21\u578b\u521b\u4f5c\u3002\u7528GRPO\u5956\u52b1\u80fd\u4fc3\u6210\u65b0\u9896\u3001\u4f18\u8d28\u4e14\u591a\u6837\u56de\u7b54\u7684\u63d0\u793a\uff0c\u5b66\u4e60\u521b\u4f5c\u8fc7\u7a0b\u800c\u975e\u56fa\u5b9a\u7b54\u6848\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.11740", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["CP\u5c06\u5f15\u5bfc\u63d0\u793a\u751f\u6210\u4e0e\u6700\u7ec8\u56de\u7b54\u751f\u6210\u89e3\u8026", "\u5f15\u5bfc\u6a21\u578b\u7528GRPO\u5b66\u4e60\u4efb\u52a1\u4e13\u5c5e\u63d0\u793a", "\u5956\u52b1\u517c\u987e\u56de\u7b54\u7684\u65b0\u9896\u6027\u3001\u8d28\u91cf\u4e0e\u591a\u6837\u6027"], "keywords": ["\u521b\u9020\u529b", "\u5f3a\u5316\u5b66\u4e60", "\u63d0\u793a\u751f\u6210"], "num_comments": 3, "on_hf": true, "organization": "Lila Sciences", "pdf_url": "https://arxiv.org/pdf/2611.11740v1", "published_at": "2026-11-09", "score": 0.213, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11740.png", "title": "Creative Priming: Decoupling Process from Product to Escape the Creative Paradox", "tldr": "\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u521b\u610f\u5f15\u5bfc\u6a21\u578b\uff0c\u5c06\u521b\u4f5c\u8fc7\u7a0b\u4e0e\u7b54\u6848\u89e3\u8026\uff0c\u51cf\u5c11\u6210\u529f\u8303\u4f8b\u590d\u73b0\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u521b\u610f\u5f15\u5bfc\uff08CP\uff09\uff1a\u72ec\u7acb\u6a21\u578b\u6309\u4efb\u52a1\u751f\u6210\u5f15\u5bfc\u63d0\u793a\uff0c\u518d\u4ea4\u7ed9\u56de\u7b54\u6a21\u578b\u521b\u4f5c\u3002\u7528GRPO\u5956\u52b1\u80fd\u4fc3\u6210\u65b0\u9896\u3001\u4f18\u8d28\u4e14\u591a\u6837\u56de\u7b54\u7684\u63d0\u793a\uff0c\u5b66\u4e60\u521b\u4f5c\u8fc7\u7a0b\u800c\u975e\u56fa\u5b9a\u7b54\u6848\u3002", "why_notable": "\u628a\u5f3a\u5316\u5b66\u4e60\u7684\u5956\u52b1\u5bf9\u8c61\u4ece\u5177\u4f53\u4f5c\u54c1\u8f6c\u5411\u751f\u6210\u4f5c\u54c1\u7684\u5f15\u5bfc\u8fc7\u7a0b\uff0c\u4e3a\u51cf\u5c11\u8303\u4f8b\u6a21\u4eff\u3001\u63d0\u5347\u6a21\u578b\u521b\u9020\u529b\u63d0\u4f9b\u4e86\u4e0d\u540c\u7684\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Vision Transformers (ViTs) perform strongly in face recognition (FR), yet their fixed-depth inference limits deployment in resource-constrained settings. We propose SD-ViT, a training framework that gives a usable exit at every block depth by making every depth produce discriminative embeddings, for budget-selected fixed-depth exits. Standard ViTs supervise intermediate layers only through backpropagation, so their intermediate representations are not directly optimized to form usable identity embeddings. SD-ViT adds a stochastic auxiliary signal: at each iteration a randomly selected intermediate block is passed through the same embedding head as the final layer and trained with a weighted margin-penalty softmax loss. The objective is thus stochastically sampled deep supervision through a shared classifier. Because both loss terms share that head and classifier, intermediate tokens are trained to map into the same embedding space as final-layer tokens. This matters for FR, where matching is by similarity: a probe processed at an early exit can be compared directly against full-depth gallery embeddings, with no gallery recomputation or adaptation layers. On established benchmarks, SD-ViT stays within 0.4 IJB-C points of the same backbone trained conventionally at full depth, while its early-exit probes recover over 96% of their own full-depth performance at 50% of the computational cost without modifying the reference gallery. A single verification threshold calibrated at full depth remains usable from quarter depth onward.", "arxiv_id": "2611.09987", "arxiv_url": "https://arxiv.org/abs/2611.09987", "authors": ["Guray Ozgur", "Tahar Chettaoui", "Eduarda Caldeira", "Naser Damer", "Fadi Boutros"], "brief": "SD-ViT\u6bcf\u8f6e\u968f\u673a\u9009\u53d6\u4e2d\u95f4\u5c42\uff0c\u7528\u5171\u4eab\u5d4c\u5165\u5934\u4e0e\u5206\u7c7b\u5668\u65bd\u52a0\u52a0\u6743\u95f4\u9694\u60e9\u7f5a\u635f\u5931\uff0c\u4f7f\u5404\u6df1\u5ea6\u8f93\u51fa\u5bf9\u9f50\u540c\u4e00\u5d4c\u5165\u7a7a\u95f4\uff0c\u652f\u6301\u6309\u9884\u7b97\u9009\u62e9\u56fa\u5b9a\u6df1\u5ea6\u9000\u51fa\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/gurayozgur/SD-ViT", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09987", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u968f\u673a\u91c7\u6837\u4e2d\u95f4\u5c42\uff0c\u5171\u4eab\u5d4c\u5165\u5934\u4e0e\u5206\u7c7b\u5668\u8fdb\u884c\u6df1\u76d1\u7763", "50%\u8ba1\u7b97\u6210\u672c\u4fdd\u7559\u81ea\u8eab\u5168\u6df1\u5ea6\u6027\u80fd\u768496%\u4ee5\u4e0a", "\u5168\u6df1\u5ea6\u6821\u51c6\u7684\u9a8c\u8bc1\u9608\u503c\u4ece\u56db\u5206\u4e4b\u4e00\u6df1\u5ea6\u8d77\u4ecd\u53ef\u7528"], "keywords": ["\u4eba\u8138\u8bc6\u522b", "\u89c6\u89c9Transformer", "\u6df1\u76d1\u7763", "\u63d0\u524d\u9000\u51fa"], "num_comments": 3, "on_hf": true, "organization": "Fraunhofer IGD", "pdf_url": "https://arxiv.org/pdf/2611.09987v1", "published_at": "2026-11-02", "score": 0.213, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09987.png", "title": "Stochastic Deep Supervision for Gallery-Consistent Early-Exit Face Recognition", "tldr": "\u968f\u673a\u6df1\u76d1\u7763\u8ba9\u4eba\u8138\u8bc6\u522b\u6a21\u578b\u534a\u7b97\u529b\u63d0\u524d\u9000\u51fa\uff0c\u540c\u65f6\u517c\u5bb9\u5168\u6df1\u5ea6\u5e95\u5e93\u3002", "upvotes": 2, "what_it_is": "SD-ViT\u6bcf\u8f6e\u968f\u673a\u9009\u53d6\u4e2d\u95f4\u5c42\uff0c\u7528\u5171\u4eab\u5d4c\u5165\u5934\u4e0e\u5206\u7c7b\u5668\u65bd\u52a0\u52a0\u6743\u95f4\u9694\u60e9\u7f5a\u635f\u5931\uff0c\u4f7f\u5404\u6df1\u5ea6\u8f93\u51fa\u5bf9\u9f50\u540c\u4e00\u5d4c\u5165\u7a7a\u95f4\uff0c\u652f\u6301\u6309\u9884\u7b97\u9009\u62e9\u56fa\u5b9a\u6df1\u5ea6\u9000\u51fa\u3002", "why_notable": "\u63d0\u524d\u9000\u51fa\u7684\u67e5\u8be2\u53ef\u76f4\u63a5\u5339\u914d\u5168\u6df1\u5ea6\u5e95\u5e93\uff0c\u65e0\u9700\u91cd\u7b97\u5e95\u5e93\u6216\u589e\u52a0\u9002\u914d\u5c42\uff1b\u5168\u6df1\u5ea6\u8868\u73b0\u4e0e\u5e38\u89c4\u8bad\u7ec3\u76f8\u5dee\u4e0d\u8d85\u8fc70.4\u4e2aIJB-C\u70b9\u3002"}, {"abstract": "Learning accurate off-policy state-action value functions (Q-functions) from offline datasets becomes harder as the task horizon grows. One-step temporal-difference (TD) learning bootstraps after every transition, so small per-step errors accumulate along the horizon, and early states can be badly misvalued even when the TD loss is small. Multi-step TD shortens this chain by following the dataset trajectory for several steps; however, since the behavior policy is often suboptimal, every followed action adds a bias, and no fixed number of steps suits a whole trajectory. In this paper, we propose Horizon-Scalable Q-Learning (HQL), a simple method that enables accurate long-horizon value learning by automatically balancing between one-step and multi-step returns. HQL extends a target through a dataset action only when the critic values it at least as highly as the best-of-N actions sampled from the BC policy, and otherwise falls back to a one-step target. We show that this rule is a principled off-policy correction that needs no action densities, which makes HQL compatible with expressive flow and diffusion policies. Experiments show that HQL avoids the failures of both one-step and multi-step TD on a combination-lock task across horizons, and outperforms prior horizon-reduction methods on long-horizon OGBench and OCBench tasks.", "arxiv_id": "2611.10987", "arxiv_url": "https://arxiv.org/abs/2611.10987", "authors": ["Haoran Xu", "Pragya Srivastava", "Xinjie Liu", "Siddhant Agarwal", "Amy Zhang"], "brief": "HQL\u81ea\u9002\u5e94\u5e73\u8861\u5355\u6b65\u4e0e\u591a\u6b65TD\uff1a\u4ec5\u5f53\u6570\u636e\u52a8\u4f5c\u4ef7\u503c\u4e0d\u4f4e\u4e8e\u884c\u4e3a\u514b\u9686\u7b56\u7565\u91c7\u6837\u7684\u6700\u4f73\u52a8\u4f5c\u65f6\u5ef6\u957f\u56de\u62a5\uff0c\u5426\u5219\u9000\u56de\u5355\u6b65\u76ee\u6807\uff0c\u4ee5\u51cf\u5c11\u8bef\u5dee\u7d2f\u79ef\u4e0e\u884c\u4e3a\u504f\u5dee\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/ryanxhr/hql", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.10987", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ee5BC\u7b56\u7565\u91c7\u6837\u7684best-of-N\u52a8\u4f5c\u4ef7\u503c\u51b3\u5b9a\u662f\u5426\u5ef6\u957f\u56de\u62a5", "\u79bb\u7b56\u7565\u6821\u6b63\u65e0\u9700\u52a8\u4f5c\u5bc6\u5ea6\uff0c\u517c\u5bb9\u6d41\u6a21\u578b\u4e0e\u6269\u6563\u7b56\u7565", "\u5728\u957f\u65f6\u57dfOGBench\u3001OCBench\u4e0a\u4f18\u4e8e\u65e2\u6709\u65f6\u57df\u7f29\u51cf\u65b9\u6cd5"], "keywords": ["\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60", "\u4ef7\u503c\u4f30\u8ba1", "\u65f6\u5e8f\u5dee\u5206\u5b66\u4e60", "\u957f\u65f6\u57df\u51b3\u7b56"], "num_comments": 2, "on_hf": true, "organization": "University of Texas at Austin", "pdf_url": "https://arxiv.org/pdf/2611.10987v1", "published_at": "2026-11-07", "score": 0.212, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10987.png", "title": "Horizon-Scalable Q-Learning", "tldr": "\u901a\u8fc7\u4ef7\u503c\u6bd4\u8f83\u81ea\u9002\u5e94\u9009\u62e9\u56de\u62a5\u6b65\u6570\uff0c\u63d0\u5347\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u7684\u957f\u65f6\u57df\u4ef7\u503c\u4f30\u8ba1\u3002", "upvotes": 1, "what_it_is": "HQL\u81ea\u9002\u5e94\u5e73\u8861\u5355\u6b65\u4e0e\u591a\u6b65TD\uff1a\u4ec5\u5f53\u6570\u636e\u52a8\u4f5c\u4ef7\u503c\u4e0d\u4f4e\u4e8e\u884c\u4e3a\u514b\u9686\u7b56\u7565\u91c7\u6837\u7684\u6700\u4f73\u52a8\u4f5c\u65f6\u5ef6\u957f\u56de\u62a5\uff0c\u5426\u5219\u9000\u56de\u5355\u6b65\u76ee\u6807\uff0c\u4ee5\u51cf\u5c11\u8bef\u5dee\u7d2f\u79ef\u4e0e\u884c\u4e3a\u504f\u5dee\u3002", "why_notable": "\u5b83\u5c06\u56de\u62a5\u6b65\u6570\u9009\u62e9\u53d8\u6210\u5c40\u90e8\u4ef7\u503c\u5224\u65ad\uff0c\u540c\u65f6\u7f13\u89e3\u5355\u6b65\u8bef\u5dee\u7d2f\u79ef\u548c\u591a\u6b65\u884c\u4e3a\u504f\u5dee\uff0c\u4e3a\u957f\u65f6\u57df\u79bb\u7ebf\u5b66\u4e60\u63d0\u4f9b\u7b80\u5355\u4e14\u517c\u5bb9\u751f\u6210\u5f0f\u7b56\u7565\u7684\u65b9\u6848\u3002"}, {"abstract": "Denoising and score estimation are classically linked through Tweedie\u0027s formula, which relates the posterior mean under Gaussian noise to the Stein score of the noisy marginal. In this work, we extend this perspective beyond Gaussian noise to a broad class of Gibbs (energy-based) noise distributions, with the generalized Gaussian family as an example. We derive the Energy-Tweedie identity: when the denoising posterior is viewed through the lens of scoring rules, the path derivative of a kernel scoring rule defined by the noise potential recovers the Stein score of the noisy marginal. Thus, the familiar correspondence between Gaussian noise, posterior means, squared loss, and Tweedie\u0027s formula is lifted to a distributional correspondence between Gibbs noise distributions, full posterior laws, kernel scoring rules, and the Energy-Tweedie identity, which gives a Tweedie-style relation for each noise potential. Among its consequences, this identity gives a posterior-samples-to-score route to score estimation, yields a principled criterion for estimating unknown noise parameters, and enables diffusion-style sampling along user-chosen paths through the noise-parameter space, supplying the score-based perspective on recent generative methods trained with scoring rules.", "arxiv_id": "2512.23818", "arxiv_url": "https://arxiv.org/abs/2512.23818", "authors": ["Andrej Leban"], "brief": "\u63d0\u51fa Energy-Tweedie \u6052\u7b49\u5f0f\uff0c\u5c06\u7ecf\u5178\u9ad8\u65af\u53bb\u566a\u5173\u7cfb\u63a8\u5e7f\u5230\u5409\u5e03\u65af\u566a\u58f0\u3002\u6838\u5fc3\u662f\u7528\u566a\u58f0\u52bf\u5b9a\u4e49\u6838\u8bc4\u5206\u89c4\u5219\uff0c\u4ee5\u5176\u8def\u5f84\u5bfc\u6570\u6062\u590d\u542b\u566a\u8fb9\u7f18\u5206\u5e03\u7684\u5f97\u5206\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": "https://github.com/andleb/et", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2512.23818", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Energy-Tweedie \u8fde\u63a5\u5b8c\u6574\u53bb\u566a\u540e\u9a8c\u4e0e Stein \u5f97\u5206", "\u8986\u76d6\u5409\u5e03\u65af\u566a\u58f0\uff0c\u4ee5\u5e7f\u4e49\u9ad8\u65af\u65cf\u4e3a\u4f8b", "\u4ece\u540e\u9a8c\u6837\u672c\u4f30\u8ba1\u5f97\u5206\uff0c\u5e76\u63a8\u5bfc\u672a\u77e5\u566a\u58f0\u53c2\u6570\u4f30\u8ba1\u51c6\u5219"], "keywords": ["\u53bb\u566a", "\u5f97\u5206\u4f30\u8ba1", "\u80fd\u91cf\u6a21\u578b", "\u751f\u6210\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "University of Michigan", "pdf_url": "https://arxiv.org/pdf/2512.23818v3", "published_at": "2025-12-29", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2512.23818.png", "title": "Energy-Tweedie: Score meets Score, Energy meets Energy", "tldr": "\u5c06\u53bb\u566a\u4e0e\u5f97\u5206\u4f30\u8ba1\u7684\u7ecf\u5178\u8054\u7cfb\u63a8\u5e7f\u81f3\u975e\u9ad8\u65af\u566a\u58f0\uff0c\u5e76\u652f\u6301\u66f4\u7075\u6d3b\u7684\u751f\u6210\u91c7\u6837\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51fa Energy-Tweedie \u6052\u7b49\u5f0f\uff0c\u5c06\u7ecf\u5178\u9ad8\u65af\u53bb\u566a\u5173\u7cfb\u63a8\u5e7f\u5230\u5409\u5e03\u65af\u566a\u58f0\u3002\u6838\u5fc3\u662f\u7528\u566a\u58f0\u52bf\u5b9a\u4e49\u6838\u8bc4\u5206\u89c4\u5219\uff0c\u4ee5\u5176\u8def\u5f84\u5bfc\u6570\u6062\u590d\u542b\u566a\u8fb9\u7f18\u5206\u5e03\u7684\u5f97\u5206\u3002", "why_notable": "\u628a\u4f9d\u8d56\u9ad8\u65af\u566a\u58f0\u4e0e\u540e\u9a8c\u5747\u503c\u7684\u7ecf\u5178\u5173\u7cfb\u6269\u5c55\u4e3a\u5206\u5e03\u5c42\u9762\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u4e3a\u8bc4\u5206\u89c4\u5219\u751f\u6210\u65b9\u6cd5\u53ca\u81ea\u9009\u566a\u58f0\u53c2\u6570\u8def\u5f84\u91c7\u6837\u63d0\u4f9b\u7406\u8bba\u4f9d\u636e\u3002"}, {"abstract": "KL-regularized reinforcement learning, the objective behind maximum-entropy RL and RL from human feedback, is variational inference in the graphical model of \"control as inference\": the regularized optimal policy is a posterior over trajectories, and the suboptimality of a policy is $\u03b2$ times a KL divergence between path measures. However, it is not known how many samples it takes to learn this posterior, even with a generative model. Earlier $1/\u03b5$ guarantees scale with $H^5$ in the effective horizon $H$, and no lower bound for MDPs depends on the temperature $\u03b2$. In this work, we show that for a discounted MDP with $K$ state-action pairs, the plug-in estimator finds a policy that is $\u03b5$-optimal from every initial state with $\\widetilde{O}(KH^3/(\u03b5\\max\\{\u03b5,\u03b2\\}) + KH)$ samples, and that no algorithm, even one that chooses where to sample, can do with fewer when $\u03b5\\lesssim \\min\\{H, H^2/\u03b2\\}$. For $\u03b5\u003c \u03b2$ this is a $1/\u03b5$ rate with the same horizon dependence as unregularized RL. We also find the exact asymptotic constant of the plug-in estimator, a Fisher-weighted variance of the estimated soft Q-function. The estimator is locally asymptotically minimax among methods that sample every pair equally often, and we give the allocation of samples that is optimal among adaptive designs. Simulations on small MDPs match the rates and the constants.", "arxiv_id": "2611.13480", "arxiv_url": "https://arxiv.org/abs/2611.13480", "authors": ["Andrew Liu"], "brief": "\u7814\u7a76\u6298\u6263MDP\u4e2dKL\u6b63\u5219\u5316\u7b56\u7565\u7684\u5b66\u4e60\u590d\u6742\u5ea6\uff0c\u4ee5\u751f\u6210\u6a21\u578b\u91c7\u6837\u6784\u5efa\u63d2\u4ef6\u4f30\u8ba1\u5668\uff0c\u8bc1\u660e\u5339\u914d\u7684\u6837\u672c\u4e0a\u4e0b\u754c\uff0c\u5e76\u523b\u753b\u6e10\u8fd1\u8bef\u5dee\u5e38\u6570\u4e0e\u6700\u4f18\u91c7\u6837\u5206\u914d\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13480", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u03b5\u003c\u03b2\u65f6\u6837\u672c\u91cf\u4e3a\u00d5(KH\u00b3/(\u03b5\u03b2)+KH)", "\u6ee1\u8db3\u7cbe\u5ea6\u6761\u4ef6\u65f6\uff0c\u4e0b\u754c\u8986\u76d6\u81ea\u9002\u5e94\u91c7\u6837\u7b97\u6cd5", "\u6e10\u8fd1\u5e38\u6570\u7531\u8f6fQ\u51fd\u6570\u7684Fisher\u52a0\u6743\u65b9\u5dee\u51b3\u5b9a"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u6837\u672c\u590d\u6742\u5ea6", "\u6b63\u5219\u5316", "\u6700\u4f18\u91c7\u6837"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13480v1", "published_at": "2026-11-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Sharp Sample Complexity of KL-Regularized Reinforcement Learning", "tldr": "\u7ed9\u51faKL\u6b63\u5219\u5316\u5f3a\u5316\u5b66\u4e60\u7684\u7d27\u81f4\u6837\u672c\u754c\uff0c\u63ed\u793a\u6e29\u5ea6\u4e0e\u7cbe\u5ea6\u7684\u53cc\u533a\u95f4\u89c4\u5f8b\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u6298\u6263MDP\u4e2dKL\u6b63\u5219\u5316\u7b56\u7565\u7684\u5b66\u4e60\u590d\u6742\u5ea6\uff0c\u4ee5\u751f\u6210\u6a21\u578b\u91c7\u6837\u6784\u5efa\u63d2\u4ef6\u4f30\u8ba1\u5668\uff0c\u8bc1\u660e\u5339\u914d\u7684\u6837\u672c\u4e0a\u4e0b\u754c\uff0c\u5e76\u523b\u753b\u6e10\u8fd1\u8bef\u5dee\u5e38\u6570\u4e0e\u6700\u4f18\u91c7\u6837\u5206\u914d\u3002", "why_notable": "\u5c06\u65e2\u67091/\u03b5\u4fdd\u8bc1\u7684\u65f6\u57df\u4f9d\u8d56\u4eceH\u2075\u964d\u81f3H\u00b3\uff0c\u5e76\u7ed9\u51fa\u4f9d\u8d56\u6e29\u5ea6\u7684\u5339\u914d\u4e0b\u754c\uff0c\u4e3a\u6700\u5927\u71b5\u5f3a\u5316\u5b66\u4e60\u4e0e\u4eba\u7c7b\u53cd\u9988\u5f3a\u5316\u5b66\u4e60\u63d0\u4f9b\u7406\u8bba\u57fa\u51c6\u3002"}, {"abstract": "Small multimodal models can misjudge emotion when words, voice, and visual cues conflict. We present EmoHarness, which runs such a model, the frozen student, inside a harness: the prompts, settings, and verification code around its calls. A human-written starting harness, the scaffold, numbers the student\u0027s visual observations, transcript, and prosody descriptions as citable evidence and has the student weigh candidate emotions against it. In Meta-Harness Evolving (MHE), a stronger LLM, the Builder, reads the student\u0027s errors and execution traces offline and edits the harness; static checks and validation gates decide which edits are kept, and the Builder never sees evaluation items. On 5,507 MME-Emotion items, EmoHarness raises task-macro Recognition by 7.6-13.4 points over a single video-only call for all four students and both Builders. Transcripts and prosody descriptions supply most of this boost (+5.38 to +10.71); the scaffold changes the audio-augmented call by -0.79 to +2.54, partly through extra multi-label predictions, and evolved edits add at most +0.95, although no evolved increment survives Holm correction. The harness\u0027s emotion context also transfers to IntentQA, with small gains for three of four students, none of which survives correction. EmoHarness thus boosts small multimodal students chiefly by supplying and organizing audio-derived evidence.", "arxiv_id": "2611.11994", "arxiv_url": "https://arxiv.org/abs/2611.11994", "authors": ["Fenghai Li", "Bingxuan Li", "Jiawen Zhang", "Yifan Shen", "Jiateng Liu", "Yutong Zhang", "Yue Guo"], "brief": "\u5c06\u51bb\u7ed3\u7684\u5c0f\u578b\u591a\u6a21\u6001\u6a21\u578b\u7f6e\u4e8e\u63d0\u793a\u4e0e\u9a8c\u8bc1\u6846\u67b6\u4e2d\uff0c\u7f16\u53f7\u5f15\u7528\u89c6\u89c9\u3001\u8f6c\u5f55\u548c\u97f5\u5f8b\u8bc1\u636e\u3002\u5f3a\u6a21\u578b\u79bb\u7ebf\u5206\u6790\u9519\u8bef\u5e76\u4fee\u6539\u6846\u67b6\uff0c\u518d\u7ecf\u9759\u6001\u68c0\u67e5\u548c\u9a8c\u8bc1\u7b5b\u9009\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV"], "github_repo": "https://github.com/Emo-Harness/EmoHarness", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.11994", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["5,507\u6761\u6837\u672c\u4e0a\uff0c4\u79cd\u5b66\u751f\u6a21\u578b\u8bc6\u522b\u63d0\u53477.6\u201413.4\u70b9", "\u8f6c\u5f55\u4e0e\u97f5\u5f8b\u63cf\u8ff0\u8d21\u732e\u4e3b\u8981\u589e\u76ca\uff1a5.38\u201410.71\u70b9", "MHE\u6f14\u5316\u989d\u5916\u63d0\u5347\u81f3\u591a0.95\u70b9\uff0c\u672a\u901a\u8fc7Holm\u6821\u6b63"], "keywords": ["\u591a\u6a21\u6001\u5b66\u4e60", "\u60c5\u7eea\u8bc6\u522b", "\u63d0\u793a\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.11994v1", "published_at": "2026-11-09", "score": 0.192, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11994.png", "title": "EmoHarness: Boosting Multimodal Emotion Understanding with Meta-Harness Evolving", "tldr": "\u901a\u8fc7\u7ec4\u7ec7\u97f3\u9891\u4e0e\u89c6\u89c9\u8bc1\u636e\u63d0\u5347\u5c0f\u6a21\u578b\u60c5\u7eea\u8bc6\u522b\uff0c\u4e3b\u8981\u589e\u76ca\u5e76\u975e\u6765\u81ea\u6846\u67b6\u81ea\u52a8\u6f14\u5316\u3002", "upvotes": 2, "what_it_is": "\u5c06\u51bb\u7ed3\u7684\u5c0f\u578b\u591a\u6a21\u6001\u6a21\u578b\u7f6e\u4e8e\u63d0\u793a\u4e0e\u9a8c\u8bc1\u6846\u67b6\u4e2d\uff0c\u7f16\u53f7\u5f15\u7528\u89c6\u89c9\u3001\u8f6c\u5f55\u548c\u97f5\u5f8b\u8bc1\u636e\u3002\u5f3a\u6a21\u578b\u79bb\u7ebf\u5206\u6790\u9519\u8bef\u5e76\u4fee\u6539\u6846\u67b6\uff0c\u518d\u7ecf\u9759\u6001\u68c0\u67e5\u548c\u9a8c\u8bc1\u7b5b\u9009\u3002", "why_notable": "\u7ed3\u679c\u533a\u5206\u4e86\u8bc1\u636e\u8865\u5145\u4e0e\u81ea\u52a8\u6f14\u5316\u7684\u5b9e\u9645\u8d21\u732e\uff1a\u5c0f\u6a21\u578b\u6539\u5584\u4e3b\u8981\u6765\u81ea\u97f3\u9891\u4fe1\u606f\u53ca\u5176\u7ec4\u7ec7\uff0c\u800c\u975e\u590d\u6742\u7684\u6846\u67b6\u4f18\u5316\u3002"}, {"abstract": "SDR-to-HDR reconstruction is an ill-posed problem in which clipped highlights, crushed shadows, and quantization artifacts must be recovered while preserving the original content. Latent diffusion models provide powerful generative priors for restoring missing detail, but their effectiveness is constrained by how HDR signals pass through the pretrained VAE. We find that common log-like encodings suppress low-luminance chromatic differences before generation, producing a dark-side collapse in the frozen-VAE latent. We introduce EquivFlow, a compact, invertible exposure-equivariant encoding that maps exposure changes to additive shifts while retaining a scale-independent chromatic component, without modifying the VAE. Encoding-level tests across pretrained image and video VAEs show that its exposure structure and deep-dark chroma transport persist across the tested hosts. Integrated into SDR-to-HDR video diffusion, EquivFlow delivers consistent chromatic-fidelity gains across the tested settings while retaining competitive reconstruction fidelity.", "arxiv_id": "2611.13504", "arxiv_url": "https://arxiv.org/abs/2611.13504", "authors": ["Donghoon Cha", "Bomseok Park", "Hansl von Kwon", "Ku DoHyung", "Hanwool Sul"], "brief": "\u63d0\u51fa\u53ef\u9006\u66dd\u5149\u7b49\u53d8\u7f16\u7801EquivFlow\uff0c\u5c06\u66dd\u5149\u53d8\u5316\u6620\u5c04\u4e3a\u52a0\u6027\u504f\u79fb\uff0c\u5e76\u4fdd\u7559\u5c3a\u5ea6\u65e0\u5173\u7684\u8272\u5f69\u5206\u91cf\uff1b\u65e0\u9700\u4fee\u6539\u9884\u8bad\u7ec3VAE\uff0c\u5373\u53ef\u63a5\u5165\u89c6\u9891\u6269\u6563\u91cd\u5efa\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13504", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u5e38\u89c1\u5bf9\u6570\u7c7b\u7f16\u7801\u5bfc\u81f4\u51bb\u7ed3VAE\u6697\u90e8\u8272\u5f69\u574d\u7f29", "EquivFlow\u4ee5\u66dd\u5149\u7b49\u53d8\u6620\u5c04\u4fdd\u7559\u6697\u90e8\u8272\u5f69", "\u8de8\u56fe\u50cf\u4e0e\u89c6\u9891VAE\u9a8c\u8bc1\uff0c\u91cd\u5efa\u8272\u5f69\u4fdd\u771f\u5ea6\u6301\u7eed\u63d0\u5347"], "keywords": ["\u9ad8\u52a8\u6001\u8303\u56f4", "\u89c6\u9891\u91cd\u5efa", "\u6269\u6563\u6a21\u578b", "\u53d8\u5206\u81ea\u7f16\u7801\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13504v1", "published_at": "2026-11-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dark Matters: VAE-Aware HDR Encoding for SDR-to-HDR Video Reconstruction", "tldr": "\u901a\u8fc7\u9002\u914d\u51bb\u7ed3\u7f16\u7801\u5668\u7684\u53ef\u9006\u6620\u5c04\uff0c\u6539\u5584\u89c6\u9891\u9ad8\u52a8\u6001\u8303\u56f4\u91cd\u5efa\u4e2d\u7684\u6697\u90e8\u8272\u5f69\u4fdd\u771f\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u53ef\u9006\u66dd\u5149\u7b49\u53d8\u7f16\u7801EquivFlow\uff0c\u5c06\u66dd\u5149\u53d8\u5316\u6620\u5c04\u4e3a\u52a0\u6027\u504f\u79fb\uff0c\u5e76\u4fdd\u7559\u5c3a\u5ea6\u65e0\u5173\u7684\u8272\u5f69\u5206\u91cf\uff1b\u65e0\u9700\u4fee\u6539\u9884\u8bad\u7ec3VAE\uff0c\u5373\u53ef\u63a5\u5165\u89c6\u9891\u6269\u6563\u91cd\u5efa\u3002", "why_notable": "\u5c06\u6539\u8fdb\u5207\u5165\u70b9\u4ece\u751f\u6210\u6a21\u578b\u8f6c\u5411\u8f93\u5165\u7f16\u7801\uff0c\u5728\u4e0d\u4fee\u6539VAE\u7684\u6761\u4ef6\u4e0b\u7f13\u89e3\u6697\u90e8\u4fe1\u606f\u635f\u5931\uff0c\u4e3a\u590d\u7528\u9884\u8bad\u7ec3\u6269\u6563\u6a21\u578b\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Open-Vocabulary Scene Graph Generation (OV-SGG) requires models to recognize visual relationships beyond the training vocabulary, yet existing methods often rely on dataset-specific object--predicate co-occurrence patterns. Under long-tailed distributions and noisy object localization, such reliance leads to biased, entangled relation representations, limiting both rare-relation recognition and generalization to unseen predicates. To address these challenges, we propose RaRe, a reasoning-aware relational representation learning framework that transforms MLLM-generated chain-of-thought (CoT) rationales into structured relation embeddings. Rather than using CoT only as an intermediate reasoning trace for final prediction, RaRe directly optimizes the rationale-derived representation space to improve inter-relation discriminability. Specifically, RaRe first aligns rationale embeddings with textualized relation descriptions through self-supervised contrastive learning, and then refines rationale generation with a specificity-oriented reinforcement learning objective that encourages semantically object-pair-specific relational evidence. Experiments on VG150 and PSG demonstrate improved category-balanced recognition over existing baselines, while the additional gains from learning vary across datasets and proposal settings. Code available at: https://artanic30.github.io/project_pages/RaRe.", "arxiv_id": "2611.13496", "arxiv_url": "https://arxiv.org/abs/2611.13496", "authors": ["Jiawei Xiao", "Boya Wang", "Longtian Qiu", "Shan Ning", "Xuming He"], "brief": "RaRe\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u751f\u6210\u7684\u601d\u7ef4\u94fe\u4f9d\u636e\u8f6c\u4e3a\u7ed3\u6784\u5316\u5173\u7cfb\u5d4c\u5165\uff0c\u901a\u8fc7\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u5bf9\u9f50\u5173\u7cfb\u63cf\u8ff0\uff0c\u518d\u7528\u5f3a\u8c03\u7279\u5f02\u6027\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u4f9d\u636e\u751f\u6210\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13496", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u5bf9\u9f50\u63a8\u7406\u5d4c\u5165\u4e0e\u6587\u672c\u5316\u5173\u7cfb\u63cf\u8ff0", "\u7279\u5f02\u6027\u5bfc\u5411\u5f3a\u5316\u5b66\u4e60\u9f13\u52b1\u5bf9\u8c61\u5bf9\u4e13\u5c5e\u5173\u7cfb\u8bc1\u636e", "VG150\u4e0ePSG\u7c7b\u522b\u5747\u8861\u8bc6\u522b\u63d0\u5347\uff0c\u589e\u76ca\u968f\u8bbe\u7f6e\u53d8\u5316"], "keywords": ["\u573a\u666f\u56fe\u751f\u6210", "\u5f00\u653e\u8bcd\u6c47\u8bc6\u522b", "\u5bf9\u6bd4\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13496v1", "published_at": "2026-11-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reasoning-Aware Relational Representation Learning for Open-Vocabulary Scene Graph Generation", "tldr": "\u5c06\u591a\u6a21\u6001\u63a8\u7406\u4f9d\u636e\u8f6c\u4e3a\u53ef\u5b66\u4e60\u5173\u7cfb\u8868\u793a\uff0c\u6539\u5584\u5f00\u653e\u8bcd\u6c47\u573a\u666f\u56fe\u7684\u5747\u8861\u8bc6\u522b\u3002", "upvotes": 0, "what_it_is": "RaRe\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u751f\u6210\u7684\u601d\u7ef4\u94fe\u4f9d\u636e\u8f6c\u4e3a\u7ed3\u6784\u5316\u5173\u7cfb\u5d4c\u5165\uff0c\u901a\u8fc7\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u5bf9\u9f50\u5173\u7cfb\u63cf\u8ff0\uff0c\u518d\u7528\u5f3a\u8c03\u7279\u5f02\u6027\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u4f9d\u636e\u751f\u6210\u3002", "why_notable": "\u628a\u601d\u7ef4\u94fe\u4ece\u9884\u6d4b\u4e2d\u95f4\u6b65\u9aa4\u53d8\u6210\u76f4\u63a5\u4f18\u5316\u7684\u8868\u793a\u7a7a\u95f4\uff0c\u4e3a\u7f13\u89e3\u5173\u7cfb\u5171\u73b0\u504f\u7f6e\u3001\u63d0\u5347\u7a00\u6709\u53ca\u672a\u89c1\u5173\u7cfb\u6cdb\u5316\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Existing Chinese educational corpora often suffer from fragmented coverage and a lack of systematic organization. In this paper, we propose WoW (\\textbf{Wo}rld Kno\\textbf{w}ledge), a large-scale dataset designed for the full-cycle training of foundation models. The construction of this dataset is driven by an Educational Knowledge Graph, which serves as a taxonomic backbone for the systematic collection and completion of missing educational modules across all levels. Compared to previous versions, this iteration provides enhanced systematicity, superior quality, and a larger scale, while incorporating multimodal signals and supporting every stage of model development. Experiments demonstrate that WoW significantly improves model performance across diverse benchmarks. To facilitate community research, we further provide an interactive platform for graph-based data selection and retrieval.", "arxiv_id": "2611.13487", "arxiv_url": "https://arxiv.org/abs/2611.13487", "authors": ["Tianze Sun", "Yongyao Duan", "Sam Chen"], "brief": "WoW\u4ee5\u6559\u80b2\u77e5\u8bc6\u56fe\u8c31\u4e3a\u5206\u7c7b\u9aa8\u67b6\uff0c\u7cfb\u7edf\u91c7\u96c6\u5e76\u8865\u9f50\u5404\u5c42\u7ea7\u6559\u80b2\u77e5\u8bc6\u6a21\u5757\uff1b\u7eb3\u5165\u591a\u6a21\u6001\u4fe1\u53f7\uff0c\u9762\u5411\u57fa\u7840\u6a21\u578b\u5168\u5468\u671f\u8bad\u7ec3\uff0c\u5e76\u63d0\u4f9b\u56fe\u8c31\u5f0f\u6570\u636e\u7b5b\u9009\u4e0e\u68c0\u7d22\u5e73\u53f0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13487", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6559\u80b2\u77e5\u8bc6\u56fe\u8c31\u9a71\u52a8\u5206\u7c7b\u91c7\u96c6\u4e0e\u7f3a\u5931\u6a21\u5757\u8865\u5168", "WoW\u7eb3\u5165\u591a\u6a21\u6001\u4fe1\u53f7\uff0c\u652f\u6301\u5168\u5468\u671f\u8bad\u7ec3", "\u591a\u9879\u57fa\u51c6\u6027\u80fd\u663e\u8457\u63d0\u5347\uff0c\u5e76\u63d0\u4f9b\u4ea4\u4e92\u5f0f\u68c0\u7d22\u5e73\u53f0"], "keywords": ["\u6559\u80b2\u8bed\u6599", "\u77e5\u8bc6\u56fe\u8c31", "\u591a\u6a21\u6001", "\u5927\u6a21\u578b\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13487v1", "published_at": "2026-11-10", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "The WoW: A Large-Scale World Knowledge Corpus for Full-Lifecycle LLM Training", "tldr": "\u4ee5\u6559\u80b2\u77e5\u8bc6\u56fe\u8c31\u7ec4\u7ec7\u5927\u89c4\u6a21\u4e2d\u6587\u77e5\u8bc6\u8bed\u6599\uff0c\u652f\u6301\u5927\u6a21\u578b\u5168\u5468\u671f\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": "WoW\u4ee5\u6559\u80b2\u77e5\u8bc6\u56fe\u8c31\u4e3a\u5206\u7c7b\u9aa8\u67b6\uff0c\u7cfb\u7edf\u91c7\u96c6\u5e76\u8865\u9f50\u5404\u5c42\u7ea7\u6559\u80b2\u77e5\u8bc6\u6a21\u5757\uff1b\u7eb3\u5165\u591a\u6a21\u6001\u4fe1\u53f7\uff0c\u9762\u5411\u57fa\u7840\u6a21\u578b\u5168\u5468\u671f\u8bad\u7ec3\uff0c\u5e76\u63d0\u4f9b\u56fe\u8c31\u5f0f\u6570\u636e\u7b5b\u9009\u4e0e\u68c0\u7d22\u5e73\u53f0\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u5c06\u96f6\u6563\u6559\u80b2\u8bed\u6599\u8f6c\u4e3a\u53ef\u7cfb\u7edf\u7ec4\u7ec7\u3001\u7b5b\u9009\u7684\u77e5\u8bc6\u8d44\u6e90\uff0c\u517c\u987e\u8bad\u7ec3\u9636\u6bb5\u8986\u76d6\u4e0e\u793e\u533a\u590d\u7528\uff0c\u5e76\u83b7\u5f97\u591a\u9879\u57fa\u51c6\u6027\u80fd\u63d0\u5347\u3002"}, {"abstract": "Nepali speakers regularly mix English words into conversation, but multilingual speech recognisers often struggle with language switches and the writing script used for English words. We study how to adapt SraVaani, a 449M-parameter hybrid TDT-CTC model, using a 172.8-hour corpus covering six Nepali speech domains. Its pretrained tokenizer does not support digits and several common symbols. Rather than replace it or discard these recordings, we generate Nepali and English readings for numbers and use zero-shot ASR output to select a plausible form. Full fine-tuning reduces test word error rate (WER) from 48.6% to 17.1%; a 12-epoch run reaches 16.3%, compared with 16.4% for fine-tuned Whisper large-v3-turbo. Freezing the encoder increases WER to 25.5%, while excluding numeric clips raises WER on numeric test speech from 14.3% to 21.3%. We also evaluate on FLEURS using both its original references and mixed-script alternatives. The comparison shows that transcription conventions explain part, but not all, of the out-of-domain performance loss.", "arxiv_id": "2611.13512", "arxiv_url": "https://arxiv.org/abs/2611.13512", "authors": ["Jeevan Neupane", "Janardan Bhetwal", "Kshitiz Paudel", "Anup Aryal", "Bipin Bashyal"], "brief": "\u7814\u7a76\u7528\u8986\u76d6\u516d\u4e2a\u9886\u57df\u7684\u5c3c\u82f1\u6df7\u5408\u8bed\u97f3\u9002\u914dSraVaani\u3002\u9488\u5bf9\u5206\u8bcd\u5668\u4e0d\u652f\u6301\u6570\u5b57\u548c\u90e8\u5206\u7b26\u53f7\u7684\u95ee\u9898\uff0c\u751f\u6210\u53cc\u8bed\u6570\u5b57\u8bfb\u6cd5\uff0c\u5e76\u7528\u96f6\u6837\u672c\u8bc6\u522b\u7ed3\u679c\u9009\u62e9\u5408\u7406\u5f62\u5f0f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13512", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u7528172.8\u5c0f\u65f6\u8bed\u6599\u5168\u91cf\u5fae\u8c03449M\u53c2\u6570TDT-CTC\u6a21\u578b", "\u5fae\u8c0312\u8f6e\u540eWER\u4e3a16.3%\uff0cWhisper\u5bf9\u7167\u4e3a16.4%", "\u6392\u9664\u6570\u5b57\u7247\u6bb5\u4f7f\u6570\u5b57\u8bed\u97f3WER\u4ece14.3%\u5347\u81f321.3%"], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u8bed\u8a00\u6df7\u5408", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13512v1", "published_at": "2026-11-10", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Nepali-English Code-Mixed Speech Recognition: Data Preparation and Adaptation of a Speech Foundation Model", "tldr": "\u901a\u8fc7\u6570\u5b57\u8bfb\u6cd5\u89c4\u8303\u5316\u4e0e\u5168\u91cf\u5fae\u8c03\uff0c\u663e\u8457\u6539\u5584\u5c3c\u82f1\u6df7\u5408\u8bed\u97f3\u8bc6\u522b\u6548\u679c\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528\u8986\u76d6\u516d\u4e2a\u9886\u57df\u7684\u5c3c\u82f1\u6df7\u5408\u8bed\u97f3\u9002\u914dSraVaani\u3002\u9488\u5bf9\u5206\u8bcd\u5668\u4e0d\u652f\u6301\u6570\u5b57\u548c\u90e8\u5206\u7b26\u53f7\u7684\u95ee\u9898\uff0c\u751f\u6210\u53cc\u8bed\u6570\u5b57\u8bfb\u6cd5\uff0c\u5e76\u7528\u96f6\u6837\u672c\u8bc6\u522b\u7ed3\u679c\u9009\u62e9\u5408\u7406\u5f62\u5f0f\u3002", "why_notable": "\u5c55\u793a\u4e86\u4fdd\u7559\u6570\u5b57\u8bed\u6599\u3001\u8c03\u6574\u8f6c\u5199\u65b9\u5f0f\u7684\u5b9e\u7528\u4ef7\u503c\uff1b\u540c\u65f6\u533a\u5206\u4e66\u5199\u89c4\u8303\u5dee\u5f02\u4e0e\u771f\u5b9e\u57df\u5916\u8bc6\u522b\u9000\u5316\uff0c\u4e3a\u4f4e\u8d44\u6e90\u6df7\u5408\u8bed\u97f3\u9002\u914d\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Integrating human feedback into language models has gained increasing attention as a means to align model outputs with human preferences, with Reinforcement Learning from Human Feedback (RLHF) serving as a prominent framework for preference-based alignment. Recent studies have incorporated eye-tracking (ET) data as an additional supervisory signal for reward model training, grounding reward learning in human reading behavior. Building on this approach, we extend prior fixation-centric models by leveraging established findings from cognitive psychology on human letter recognition. Specifically, we model visual attention as a spatially graded distribution centered on the current gaze location and incorporate this representation into reward model training. Our results show that the reward model trained with the proposed gaze distribution achieves higher preference prediction accuracy than a baseline model. Moreover, some results from our experiments are qualitatively consistent with established findings on human attention during reading, suggesting that they potentially capture cognitively meaningful aspects of human attention allocation.", "arxiv_id": "2611.13477", "arxiv_url": "https://arxiv.org/abs/2611.13477", "authors": ["Chaeho Lee", "Junyup Kim", "Wansoo Kim", "Young Min Jung", "Sang Ho Lee"], "brief": "\u5c06\u9605\u8bfb\u65f6\u7684\u89c6\u89c9\u6ce8\u610f\u5efa\u6a21\u4e3a\u56f4\u7ed5\u6ce8\u89c6\u70b9\u6e10\u53d8\u7684\u7a7a\u95f4\u5206\u5e03\uff0c\u7528\u4e8e\u589e\u5f3a\u5956\u52b1\u6a21\u578b\u8bad\u7ec3\uff1b\u504f\u597d\u9884\u6d4b\u51c6\u786e\u7387\u4f18\u4e8e\u57fa\u7ebf\uff0c\u90e8\u5206\u7ed3\u679c\u4e0e\u8ba4\u77e5\u5fc3\u7406\u5b66\u53d1\u73b0\u4e00\u81f4\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13477", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5956\u52b1\u6a21\u578b", "\u773c\u52a8\u8ffd\u8e2a", "\u4eba\u7c7b\u53cd\u9988", "\u89c6\u89c9\u6ce8\u610f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13477v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Leveraging Psychophysical Attentional Distribution for Gaze-Augmented Reward Modeling", "tldr": "\u5c06\u9605\u8bfb\u65f6\u7684\u89c6\u89c9\u6ce8\u610f\u5efa\u6a21\u4e3a\u56f4\u7ed5\u6ce8\u89c6\u70b9\u6e10\u53d8\u7684\u7a7a\u95f4\u5206\u5e03\uff0c\u7528\u4e8e\u589e\u5f3a\u5956\u52b1\u6a21\u578b\u8bad\u7ec3\uff1b\u504f\u597d\u9884\u6d4b\u51c6\u786e\u7387\u4f18\u4e8e\u57fa\u7ebf\uff0c\u90e8\u5206\u7ed3\u679c\u4e0e\u8ba4\u77e5\u5fc3\u7406\u5b66\u53d1\u73b0\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diabetic retinopathy (DR) lesions vary widely in shape, and microaneurysms (MAs) span only a few pixels. We hypothesize that modeling the spatial organization of lesion regions, with global context and shape-adaptive scanning, improves the segmentation of such small and irregular lesions. To test this, we propose D$^2$Mamba, which couples non-causal state space duality with deformable Mamba scanning. We evaluate it with five-fold cross-validation on the DDR dataset, comparing against representative segmentation baselines under an identical training protocol, and conduct ablations on each component. D$^2$Mamba achieved the best overall performance, with 33.87% mIoU, 2.99 percentage points above the strongest baseline. The largest gain appeared on MAs, the smallest and most easily missed lesions, where Dice improved by 10.06 percentage points. These results confirm our hypothesis that spatially adaptive state space modeling benefits tiny-lesion segmentation. Code and pretrained weights are available at https://github.com/PUREPANEL1/D2Mamba.", "arxiv_id": "2611.13514", "arxiv_url": "https://arxiv.org/abs/2611.13514", "authors": ["Chang Yu", "Siqing Li", "Yuanchen Liu", "Zhenyu Bu", "Luming Yang", "Alper Yilmaz"], "brief": "D\u00b2Mamba\u7ed3\u5408\u5168\u5c40\u4e0a\u4e0b\u6587\u4e0e\u5f62\u72b6\u81ea\u9002\u5e94\u626b\u63cf\u5206\u5272\u89c6\u7f51\u819c\u75c5\u7076\uff0c\u5728DDR\u4e0amIoU\u9886\u5148\u57fa\u7ebf2.99\u4e2a\u767e\u5206\u70b9\uff0c\u5fae\u52a8\u8109\u7624Dice\u63d0\u534710.06\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13514", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "\u5fae\u5c0f\u75c5\u7076"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13514v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Seeing the Small: Deformable Duality Mamba for Retinal Lesion Segmentation", "tldr": "D\u00b2Mamba\u7ed3\u5408\u5168\u5c40\u4e0a\u4e0b\u6587\u4e0e\u5f62\u72b6\u81ea\u9002\u5e94\u626b\u63cf\u5206\u5272\u89c6\u7f51\u819c\u75c5\u7076\uff0c\u5728DDR\u4e0amIoU\u9886\u5148\u57fa\u7ebf2.99\u4e2a\u767e\u5206\u70b9\uff0c\u5fae\u52a8\u8109\u7624Dice\u63d0\u534710.06\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose a novel conditional entropy function as a basis for quantifying predictive uncertainty in Evidential Deep Learning (EDL) for glaucoma detection from retinal fundus images. Using the EyePACS-AIROGS-light-V2 and RIM-ONE-DL datasets for validation, we found that our proposed EDL model regularized by conditional entropy function produced uncertainty estimates with substantially lower calibration errors than Deep Ensembles, MC Dropout, post-hoc calibration and the conventional EDL framework based on Dempster uncertainty. To further probe our models\u0027 interpretability, we analyzed Grad-CAM heatmaps using a focus index representing spatial concentration. Compared with the other uncertainty quantification methods, EDL models exhibited greater separation between the index distributions of correctly and incorrectly classified fundus images. In particular, false negatives were associated with localized Grad-CAM activations that were displaced from the optic disc, consistent with its established clinical importance in glaucoma assessment. Overall, our findings suggest that our proposed EDL framework for glaucoma detection provides not only enhanced uncertainty calibration but also admits a more physiologically consistent interpretability.", "arxiv_id": "2611.13513", "arxiv_url": "https://arxiv.org/abs/2611.13513", "authors": ["Hai Siong Tan", "Kuancheng Wang"], "brief": "\u63d0\u51fa\u6761\u4ef6\u71b5\u6b63\u5219\u5316\u7684\u8bc1\u636e\u6df1\u5ea6\u5b66\u4e60\u6a21\u578b\uff0c\u7528\u4e8e\u773c\u5e95\u56fe\u50cf\u9752\u5149\u773c\u68c0\u6d4b\uff1b\u5728\u4e24\u4e2a\u6570\u636e\u96c6\u4e0a\u964d\u4f4e\u4e0d\u786e\u5b9a\u6027\u6821\u51c6\u8bef\u5dee\uff0c\u5e76\u63ed\u793a\u6f0f\u8bca\u4e0e\u504f\u79bb\u89c6\u76d8\u7684\u5c40\u90e8\u6fc0\u6d3b\u76f8\u5173\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13513", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bc1\u636e\u6df1\u5ea6\u5b66\u4e60", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u533b\u5b66\u5f71\u50cf", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13513v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evidential Deep Learning with conditional entropy for glaucoma detection", "tldr": "\u63d0\u51fa\u6761\u4ef6\u71b5\u6b63\u5219\u5316\u7684\u8bc1\u636e\u6df1\u5ea6\u5b66\u4e60\u6a21\u578b\uff0c\u7528\u4e8e\u773c\u5e95\u56fe\u50cf\u9752\u5149\u773c\u68c0\u6d4b\uff1b\u5728\u4e24\u4e2a\u6570\u636e\u96c6\u4e0a\u964d\u4f4e\u4e0d\u786e\u5b9a\u6027\u6821\u51c6\u8bef\u5dee\uff0c\u5e76\u63ed\u793a\u6f0f\u8bca\u4e0e\u504f\u79bb\u89c6\u76d8\u7684\u5c40\u90e8\u6fc0\u6d3b\u76f8\u5173\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Remote sensing imagery acquired by Unmanned Aerial Vehicles (UAVs) supports wide range of applications; however, deploying machine learning (ML) models on resource-constrained aerial platforms introduces challenges beyond predictive accuracy, particularly when deployment data differ from the distributions observed during training. Such shifts are common in remote sensing due to geographic, sensor, seasonal, and other visual variations. A practical solution is to equip deployed models with mechanisms that detect emerging distribution shifts and support subsequent responsive actions. This paper presents an empirical case study of three open-source detection tools: (i) Alibi-Detect; (ii) NannyML; and (iii) PyTorch-OOD. Using cross-dataset remote-sensing shifts, we evaluate both detection effectiveness and computational latency of these tools. Our results reveal differences in detection behavior and processing cost across methods and implementations, highlighting trade-offs between detection capability and response-time. These findings motivate further work toward lightweight, and latency-aware monitoring mechanisms for resource-constrained systems.", "arxiv_id": "2611.13510", "arxiv_url": "https://arxiv.org/abs/2611.13510", "authors": ["Abdullah Almansour", "Ozan K. Tonguz"], "brief": "\u5bf9\u6bd4\u4e09\u79cd\u5f00\u6e90\u5de5\u5177\u5728\u9065\u611f\u8de8\u6570\u636e\u96c6\u5206\u5e03\u504f\u79fb\u68c0\u6d4b\u4e2d\u7684\u6548\u679c\u4e0e\u5ef6\u8fdf\uff0c\u53d1\u73b0\u5404\u65b9\u6cd5\u5728\u68c0\u6d4b\u80fd\u529b\u548c\u54cd\u5e94\u901f\u5ea6\u4e0a\u5b58\u5728\u6743\u8861\uff0c\u4e3a\u8d44\u6e90\u53d7\u9650\u65e0\u4eba\u673a\u7684\u8f7b\u91cf\u76d1\u6d4b\u63d0\u4f9b\u53c2\u8003\u3002", "categories": ["cs.CV", "cs.LG", "eess.IV", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13510", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9065\u611f\u5f71\u50cf", "\u5206\u5e03\u504f\u79fb", "\u6a21\u578b\u76d1\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13510v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Distribution Shift Detection in Remote Sensing Imagery using Machine Learning Models", "tldr": "\u5bf9\u6bd4\u4e09\u79cd\u5f00\u6e90\u5de5\u5177\u5728\u9065\u611f\u8de8\u6570\u636e\u96c6\u5206\u5e03\u504f\u79fb\u68c0\u6d4b\u4e2d\u7684\u6548\u679c\u4e0e\u5ef6\u8fdf\uff0c\u53d1\u73b0\u5404\u65b9\u6cd5\u5728\u68c0\u6d4b\u80fd\u529b\u548c\u54cd\u5e94\u901f\u5ea6\u4e0a\u5b58\u5728\u6743\u8861\uff0c\u4e3a\u8d44\u6e90\u53d7\u9650\u65e0\u4eba\u673a\u7684\u8f7b\u91cf\u76d1\u6d4b\u63d0\u4f9b\u53c2\u8003\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Compositional generalization is an important form of out-of-distribution generalization, defined as the ability to train on some combinations of modules (e.g., functions such as sort, filter) and then generalize to unseen combinations. Despite substantial empirical work evaluating compositional generalization in transformers, findings have been inconsistent because evaluations were often conducted on a limited set of train-test splits, defined in an ad hoc manner. Through a systematic evaluation, we identify two key aspects of the train-test distribution that strongly affect performance: composition equivalence and module coverage. We show that the apparent performance of direct models (trained only on final outputs) results primarily from exploiting composition equivalences, meaning different sequences of modules that reduce to identical end-to-end functions. When benchmarks eliminate these equivalences, performance drops significantly, showing their inability to generalize to compositions of known modules that produce novel end-to-end functions. We further demonstrate that performance degrades monotonically as module coverage shifts increase (when modules appear in different contexts between train and test), affecting both direct and step-by-step models (trained on intermediate and final outputs). These findings have concrete implications for benchmark design: benchmarks that include compositional equivalences can lead to significant overestimation of the generalization abilities of direct models, and benchmarks that include both module coverage violations and compositional equivalences can exacerbate shortcut learning. As a case study, we demonstrate the role of compositional equivalence on the generalization performance of the pre-trained model Llama3-8B on the code-output prediction task in the coding benchmark LiveCodeBench.", "arxiv_id": "2611.13498", "arxiv_url": "https://arxiv.org/abs/2611.13498", "authors": ["Purva Pruthi", "Andrew Yuan", "Alexander D\u0027Amour", "David Jensen"], "brief": "\u7cfb\u7edf\u8bc4\u4f30Transformer\u7ec4\u5408\u6cdb\u5316\uff0c\u53d1\u73b0\u7ec4\u5408\u7b49\u4ef7\u4f1a\u9ad8\u4f30\u6a21\u578b\u80fd\u529b\uff1b\u6d88\u9664\u7b49\u4ef7\u540e\u6027\u80fd\u663e\u8457\u4e0b\u964d\uff0c\u6a21\u5757\u4e0a\u4e0b\u6587\u8986\u76d6\u504f\u79fb\u4e5f\u6301\u7eed\u524a\u5f31\u76f4\u63a5\u4e0e\u5206\u6b65\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13498", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ec4\u5408\u6cdb\u5316", "\u5206\u5e03\u5916\u6cdb\u5316", "\u57fa\u51c6\u8bc4\u4f30", "\u6377\u5f84\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13498v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluating Compositional Generalization in Transformers: The Role of Composition Equivalence and Module Coverage", "tldr": "\u7cfb\u7edf\u8bc4\u4f30Transformer\u7ec4\u5408\u6cdb\u5316\uff0c\u53d1\u73b0\u7ec4\u5408\u7b49\u4ef7\u4f1a\u9ad8\u4f30\u6a21\u578b\u80fd\u529b\uff1b\u6d88\u9664\u7b49\u4ef7\u540e\u6027\u80fd\u663e\u8457\u4e0b\u964d\uff0c\u6a21\u5757\u4e0a\u4e0b\u6587\u8986\u76d6\u504f\u79fb\u4e5f\u6301\u7eed\u524a\u5f31\u76f4\u63a5\u4e0e\u5206\u6b65\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Simulation optimization typically returns a single estimated optimal point. When decisions also depend on criteria evaluated independently of simulation, such as resource cost, the decision maker instead needs the set of designs whose expected performance lies within a tolerance of the optimum, often choosing the tolerance only after seeing the tradeoffs. We study how to identify these near-optimal regions on a continuous design space, simultaneously for all tolerances up to a prescribed maximum $T$, with region estimation error at most $\u03b7$. We show that region identification is not a by-product of optimization. Specifically, when $\u03b1\u003e\u03bd$, any procedure, even one given the optimal design in advance, needs at least $\u03a9\\bigl(\u03b7^{-(2+d/\u03bd)}\\min\\{1,KT^{d/\u03b1}\\}\\bigr)$ simulation evaluations, where $d$ is the dimension, $\u03bd$ the smoothness, and $(K,\u03b1)$ the covering parameters that describe the geometry of the near-optimal designs. We propose SASORI, which returns an estimated optimal point and the regions for all tolerances from the same evaluations, matching this lower bound up to logarithmic factors. SASORI also achieves the optimal tradeoff between region estimation error and cumulative regret, and reduces to a minimax-optimal simulation optimization procedure at zero tolerance. Numerical experiments illustrate the effectiveness of our proposed method.", "arxiv_id": "2611.13489", "arxiv_url": "https://arxiv.org/abs/2611.13489", "authors": ["Yilin Zheng", "Haowei Wang", "Wenjia Wang", "Szu Hui Ng"], "brief": "\u7814\u7a76\u8fde\u7eed\u4eff\u771f\u4f18\u5316\u4e2d\u591a\u5bb9\u5dee\u4e0b\u7684\u8fd1\u4f18\u533a\u57df\u8bc6\u522b\uff0c\u8bc1\u660e\u5176\u72ec\u7acb\u590d\u6742\u5ea6\u4e0b\u754c\uff0c\u5e76\u63d0\u51fa\u81ea\u9002\u5e94\u91c7\u6837\u7b97\u6cd5SASORI\uff0c\u5728\u5bf9\u6570\u56e0\u5b50\u5185\u8fbe\u5230\u6700\u4f18\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13489", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eff\u771f\u4f18\u5316", "\u81ea\u9002\u5e94\u91c7\u6837", "\u6781\u5c0f\u6781\u5927\u590d\u6742\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13489v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Simultaneous Near-Optimal Region Identification in Continuous Simulation Optimization: Minimax Complexity and Adaptive Sampling", "tldr": "\u7814\u7a76\u8fde\u7eed\u4eff\u771f\u4f18\u5316\u4e2d\u591a\u5bb9\u5dee\u4e0b\u7684\u8fd1\u4f18\u533a\u57df\u8bc6\u522b\uff0c\u8bc1\u660e\u5176\u72ec\u7acb\u590d\u6742\u5ea6\u4e0b\u754c\uff0c\u5e76\u63d0\u51fa\u81ea\u9002\u5e94\u91c7\u6837\u7b97\u6cd5SASORI\uff0c\u5728\u5bf9\u6570\u56e0\u5b50\u5185\u8fbe\u5230\u6700\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable inference for rankings of large language models based on human pairwise comparisons must preserve the privacy of individual preference records. To meet this need, we develop methods for score and rank inference under the Bradley-Terry model with edge differential privacy. For an objective-perturbed estimator, a new leave-one-out analysis establishes finite-sample bounds on Euclidean and entrywise estimation errors. For sufficiently dense comparison graphs, the error bounds extend to smaller privacy budgets, including regimes in which its privacy term dominates its statistical term. A uniform asymptotic expansion yields asymptotically valid confidence intervals for individual scores and pairwise score differences. To improve finite-sample performance, we account for both regularization bias and privacy-induced randomness by combining a plug-in ridge-bias correction with Gaussian-Laplace calibration. We further establish a bootstrap procedure for simultaneous rank inference, providing asymptotically valid confidence sets for individual ranks and tests of top-$K$ membership. When  the connections between pixels, and topology-based losses still produce ordinary masks. Connectivity-based methods predict these connections directly, but they use binary connectivity targets over a fixed local range. Such labels give the same value to thin segments and to thick regions, and they cannot describe connections at larger offsets. To address these limitations, we propose Topology-preserving Multi-offset Affinity Learning (TMAL). TMAL uses soft affinities that emphasize thin regions near the boundary, and it predicts directional affinities at several offsets to reach further. It then combines these affinities with weights that come from the decoder features, so local continuity and wider context are used together. An auxiliary segmentation branch adds region-level supervision and keeps the overlap accuracy high. On the retinal vessel dataset DRIVE and the crack inspection dataset DeepCrack, TMAL reaches the highest Dice, IoU, and clDice scores, and it greatly reduces the connected-component error $\u0394\u03b2_0$. Code is available at https://github.com/suho-han/TMAL.", "arxiv_id": "2611.13511", "arxiv_url": "https://arxiv.org/abs/2611.13511", "authors": ["Suho Han", "Soungsill Park", "Kanghyun Ryu", "Yoseob Han"], "brief": "TMAL\u4ee5\u591a\u504f\u79fb\u8f6f\u4eb2\u548c\u529b\u5b66\u4e60\u50cf\u7d20\u8fde\u63a5\uff0c\u517c\u987e\u7ec6\u7ebf\u8fde\u7eed\u6027\u4e0e\u533a\u57df\u7cbe\u5ea6\u3002\u5728\u89c6\u7f51\u819c\u8840\u7ba1\u548c\u88c2\u7f1d\u6570\u636e\u96c6\u4e0a\uff0c\u5206\u5272\u6307\u6807\u9886\u5148\uff0c\u8fde\u901a\u5206\u91cf\u8bef\u5dee\u663e\u8457\u964d\u4f4e\u3002", "categories": ["cs.CV", "physics.med-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13511", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u5206\u5272", "\u62d3\u6251\u4fdd\u6301", "\u4eb2\u548c\u529b\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_ e both transition types. The proposed framework augments hand-centric spatiotemporal representations with object-aware features learned directly from the video and introduces a transition-aware event spotting formulation tailored to contact transitions, without relying on external object or hand-object interaction detectors during inference. To support this task, we present ContactTransition, a dataset comprising 4,021 egocentric videos with 8,498 touch and 8,077 release annotations, together with object-of-interest supervision. Experiments demonstrate that the proposed method consistently outperforms strong two-stage and end-to-end event-spotting baselines on both transition types. Finally, we show that detected contact transitions provide effective temporal anchors for downstream egocentric hand-object reasoning.", "arxiv_id": "2611.13486", "arxiv_url": "https://arxiv.org/abs/2611.13486", "authors": ["Huy Anh Nguyen", "Chang Dong", "Feras Dayoub", "Minh Hoai"], "brief": "\u63d0\u51fa\u8054\u5408\u5efa\u6a21\u624b\u4e0e\u7269\u4f53\u7684\u6846\u67b6\uff0c\u5b9a\u4f4d\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e2d\u7684\u63a5\u89e6\u4e0e\u91ca\u653e\u65f6\u523b\uff0c\u5e76\u6784\u5efa\u6807\u6ce8\u6570\u636e\u96c6\uff1b\u4e24\u7c7b\u68c0\u6d4b\u5747\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u53ef\u8f85\u52a9\u4e0b\u6e38\u4ea4\u4e92\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13486", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u624b\u7269\u4ea4\u4e92", "\u4e8b\u4ef6\u68c0\u6d4b", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13486v1", "published_at": "2026-11-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hand-Object Contact Transition Detection in Egocentric Video", "tldr": "\u63d0\u51fa\u8054\u5408\u5efa\u6a21\u let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
