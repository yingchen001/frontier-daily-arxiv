 take part in deciding coarse cells. To this end, we propose JoVox, a discrete flow matching framework that learns the joint distribution of all levels of the voxel hierarchy, instead of a separate distribution for each level, so that coarse cells can be predicted with finer cells already generated nearby. Within this framework, we further introduce a two-level prediction, which outputs the cells two levels finer at once instead of one level finer, halving the number of levels that the network processes and yielding voxels of higher fidelity. We also introduce an unmasking strategy that revisits early decisions once finer cells are generated and corrects inconsistencies in masked diffusion models. Our framework outperforms the baselines on both unconditional and image-conditioned voxel generation. Compared with the current state-of-the-art TRELLIS.2, we achieve 8x higher training throughput, 1/15 of the FLOPs in a forward pass, train on 4 vs. 32 GPUs, and obtain higher quality with an 11% lower Chamfer distance.", "arxiv_id": "2611.10690", "arxiv_url": "https://arxiv.org/abs/2611.10690", "authors": ["Xiangjun Tang", "Jianqi Chen", "Peter Wonka"], "brief": "JoVox\u7528\u79bb\u6563\u6d41\u5339\u914d\u5b66\u4e60\u5168\u90e8\u4f53\u7d20\u5c42\u7ea7\u7684\u8054\u5408\u5206\u5e03\uff0c\u8ba9\u7ec6\u5c42\u4fe1\u606f\u53c2\u4e0e\u7c97\u5c42\u51b3\u7b56\u3002\u7ed3\u5408\u8de8\u4e24\u7ea7\u9884\u6d4b\u4e0e\u91cd\u65b0\u63ed\u793a\u63a9\u7801\u7b56\u7565\uff0c\u51cf\u5c11\u8ba1\u7b97\u5e76\u4fee\u6b63\u65e9\u671f\u751f\u6210\u9519\u8bef\u3002", "categories": ["cs.CV", "cs.GT"], "github_repo": "https://github.com/yuyujunjun/JoVox", "github_stars": 32, "hf_url": "https://huggingface.co/papers/2611.10690", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8054\u5408\u79bb\u6563\u6d41\u5339\u914d\u5efa\u6a21\u6240\u6709\u5c42\u7ea7\uff0c\u800c\u975e\u9010\u5c42\u72ec\u7acb\u5efa\u6a21", "\u8de8\u4e24\u7ea7\u9884\u6d4b\u5c06\u5904\u7406\u5c42\u6570\u51cf\u534 asks across 13 languages with limited coverage in existing repository-level benchmarks: Clojure, Dart, Elixir, Erlang, F#, Haskell, Julia, Kotlin, Lua, OCaml, R, Scala, and Swift. Its construction uses a solver--judge--repairer pipeline: a solver attempts each candidate task, and a judge reviews the task together with the solver\u0027s trajectory and test results to guide revisions to tests and task descriptions. These revisions aim to correct tests that reject valid alternative implementations or accept incorrect solutions while retaining challenging tasks and preserving their intended requirements. We evaluate nine model configurations, including frontier models, and analyze task-solving performance, consistency across repeated attempts, and resource usage. We release all benchmark instances, executable environments, complete construction and evaluation tooling, and agent trajectories, together with an additional set of easier tasks to support evaluation of smaller models.", "arxiv_id": "2611.10304", "arxiv_url": "https://arxiv.org/abs/2611.10304", "authors": ["Vladimir Dobrovolskii", "Ibragim Badertdinov", "Alexander Golubev"], "brief": "\u6784\u5efa\u9762\u5411\u4f4e\u8986\u76d6\u7f16\u7a0b\u8bed\u8a00\u7684\u4ed3\u5e93\u7ea7\u95ee\u9898\u4fee\u590d\u57fa\u51c6\u3002\u901a\u8fc7\u6c42\u89e3\u5668\u5c1d\u8bd5\u4efb\u52a1\uff0c\u518d\u7531\u8bc4\u5ba1\u5668\u7ed3\u5408\u6267\u884c\u8f68\u8ff9\u4e0e\u6d4b\u8bd5\u7ed3\u679c\u6307\u5bfc\u4fee\u590d\u6d4b\u8bd5\u548c\u63cf\u8ff0\uff0c\u4fdd\u7559\u6709\u4ef7\u503c\u7684\u96be\u9898\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/SWE-rebench/LongTail-SWE", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.10304", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6536\u5f55202\u4e2a\u95ee\u9898\u4fee\u590d\u4efb\u52a1\uff0c\u8986\u76d613\u79cd\u8bed\u8a00", "\u6c42\u89e3\u5668\u2014\u8bc4\u5ba1\u5668\u2014\u4fee\u590d\u5668\u6d41\u6c34\u7ebf\u7ea0\u6b63\u6d4b\u8bd5\u8bef\u5224", "\u8bc4\u4f309\u79cd\u6a21\u578b\u914d\u7f6e\uff0c\u5206\u6790\u6210\u529f\u7387\u3001\u7a33\u5b9a\u6027\u4e0e\u8d44\u6e90\u6d88\u8017"], "keywords": ["\u8f6f\u4ef6\u5de5\u7a0b", "\u8bc4\u6d4b\u57fa\u51c6", "\u4ee3\u7801\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u4fee\u590d"], "num_comments": 3, "on_hf": true, "organization": "Nebius", "pdf_url": "https://arxiv.org/pdf/2611.10304v1", "published_at": "2026-11-06", "score": 0.273, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10304.png", "title": "Longtail-SWE: High-Quality SWE Tasks for Underrepresented Languages", "tldr": "\u4ee5\u6c42\u89e3\u3001\u8bc4\u5ba1\u548c\u4fee\u590d\u6d41\u6c34\u7ebf\uff0c\u6784\u5efa\u8986\u76d6\u5341\u4e09\u79cd\u4f4e\u8986\u76d6\u8bed\u8a00\u7684\u4ed3\u5e93\u7ea7\u4fee\u590d\u57fa\u51c6\u3002", "upvotes": 20, "what_it_is": "\u6784\u5efa\u9762\u5411\u4f4e\u8986\u76d6\u7f16\u7a0b\u8bed\u8a00\u7684\u4ed3\u5e93\u7ea7\u95ee\u9898\u4fee\u590d\u57fa\u51c6\u3002\u901a\u8fc7\u6c42\u89e3\u5668\u5c1d\u8bd5\u4efb\u52a1\uff0c\u518d\u7531\u8bc4\u5ba1\u5668\u7ed3\u5408\u6267\u884c\u8f68\u8ff9\u4e0e\u6d4b\u8bd5\u7ed3\u679c\u6307\u5bfc\u4fee\u590d\u6d4b\u8bd5\u548c\u63cf\u8ff0\uff0c\u4fdd\u7559\u6709\u4ef7\u503c\u7684\u96be\u9898\u3002", "why_notable": "\u5c06\u7a00\u7f3a\u5019\u9009\u4efb\u52a1\u4ece\u7b80\u5355\u7b5b\u9664\u8f6c\u4e3a\u4fee\u590d\u4fdd\u7559\uff0c\u6269\u5c55\u8f6f\u4ef6\u5de5\u7a0b\u8bc4\u6d4b\u7684\u8bed\u8a00\u8986\u76d6\uff1b\u5f00\u653e\u6267\u884c\u73af\u5883\u3001\u5de5\u5177\u4e0e\u8f68\u8ff9\uff0c\u4fbf\u4e8e\u590d\u73b0\u548c\u8bca\u65ad\u3002"}, {"abstract": "Large language models can generate motion graphics from static images and natural language requests, but it remains difficult to evaluate how well models can follow requests that combine spatial, appearance, and temporal requirements. We introduce MotionGraphicsBench, an expert-curated benchmark of 100 instances for animating an input static SVG with a motion edit prompt. By supplying all required visual elements, our editing task reflects a designer-like workflow and isolates motion generation from graphic generation. Derived from real-world Lottie motion designs, our benchmark contains diverse combinations of spatio-temporal animation behaviors. Each benchmark instance pairs its model input with a deterministic, human-readable verification program that accepts different valid implementations and reports which prompt requirements pass or fail, rather than comparing against a reference animation or using a VLM judge. We construct these programs with a multi-agent pipeline using human-labeled animations and synthesized test cases. On a balanced test set of 180 animations, our programs achieve 93.3% raw agreement with human judgments, compared with 83.3% for a GPT-6 Astra VLM baseline, and outperform the baseline in both approval and rejection recall. Across 47 configurations from 32 LLMs and 12 providers, pass@1 ranges from 6.0% to 67.7%. Across 15 models evaluated at their highest available reasoning effort with 32 attempts per instance, additional attempts improve every model, but pass@32 still ranges from 38.0% to 95.0%. Our analysis of verification programs reveals that generated animations often fail to match reference poses, follow requested motion trajectories, or coordinate related events. We release our benchmark at https://huggingface.co/datasets/figma-ai/motion-graphics-bench.", "arxiv_id": "2611.10592", "arxiv_url": "https://arxiv.org/abs/2611.10592", "authors": ["Jiaju Ma", "Ashvini Kumar Jindal", "Chuhua Wang", "Sumithra Bhakthavatsalam"], "brief": "\u63d0\u51fa\u542b100\u4e2a\u5b9e\u4f8b\u7684\u52a8\u6001\u56fe\u5f62\u7f16\u8f91\u57fa\u51c6\uff0c\u8ba9\u6a21\u578b\u6309\u6307\u4ee4\u4e3a\u9759\u6001SVG\u6dfb\u52a0\u52a8\u753b\u3002\u6bcf\u4f8b\u914d\u786e\u5b9a\u6027\u9a8c\u8bc1\u7a0b\u5e8f\uff0c\u9010\u9879\u68c0\u67e5\u8981\u6c42\uff0c\u5141\u8bb8\u591a\u79cd\u6709\u6548\u5b9e\u73b0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10592", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u591a\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf\u7ed3\u5408\u4eba\u5de5\u6807\u6ce8\u4e0e\u5408\u6210\u6d4b\u8bd5\u6784\u5efa\u9a8c\u8bc1\u7a0b\u5e8f", "180\u6bb5\u52a8\u753b\u4e0a\uff0c\u9a8c\u8bc1\u4e0e\u4eba\u5de5\u4e00\u81f4\u738793.3%\uff0cVLM\u4e3a83.3%", "32\u4e2a\u6a21\u578b\u300147\u79cd\u914d\u7f6e\u7684pass@1\u4e3a6.0%\u201467.7%"], "keywords": ["\u52a8\u6001\u56fe\u5f62", "\u7a0b\u5e8f\u5316\u9a8c\u8bc1", "\u6a21\u578b\u8bc4\u6d4b", "\u65f6\u7a7a\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": "Figma", "pdf_url": "https://arxiv.org/pdf/2611.10592v1", "published_at": "2026-11-07", "score": 0.266, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10592.png", "title": "MotionGraphicsBench: Evaluating Motion Graphics Generation with Programmatic Verification", "tldr": "\u7528\u53ef\u7f16\u7a0b\u9a8c\u8bc1\u8bc4\u4f30\u52a8\u6001\u56fe\u5f62\u751f\u6210\uff0c\u91cf\u5316\u6a21\u578b\u9075\u5faa\u590d\u6742\u65f6\u7a7a\u6307\u4ee4\u7684\u80fd\u529b\u3002", "upvotes": 8, "what_it_is": "\u63d0\u51fa\u542b100\u4e2a\u5b9e\u4f8b\u7684\u52a8\u6001\u56fe\u5f62\u7f16\u8f91\u57fa\u51c6\uff0c\u8ba9\u6a21\u578b\u6309\u6307\u4ee4\u4e3a\u9759\u6001SVG\u6dfb\u52a0\u52a8\u753b\u3002\u6bcf\u4f8b\u914d\u786e\u5b9a\u6027\u9a8c\u8bc1\u7a0b\u5e8f\uff0c\u9010\u9879\u68c0\u67e5\u8981\u6c42\uff0c\u5141\u8bb8\u591a\u79cd\u6709\u6548\u5b9e\u73b0\u3002", "why_notable": "\u5c06\u8fd0\u52a8\u751f\u6210\u4e0e\u56fe\u5f62\u751f\u6210\u89e3\u8026\uff0c\u4ee5\u53ef\u8bfb\u7a0b\u5e8f\u66ff\u4ee3\u53c2\u8003\u52a8\u753b\u6bd4\u5bf9\u6216\u89c6\u89c9\u6a21\u578b\u88c1\u5224\uff0c\u66f4\u53ef\u9760\u5730\u5b9a\u4f4d\u59ff\u6001\u3001\u8f68\u8ff9\u548c\u4e8b\u4ef6\u534f\u540c\u9519\u8bef\u3002"}, {"abstract": "On-policy distillation (OPD) trains a student language model on its own responses, guided by a fixed teacher. Generating these responses is expensive, so systems use quantized inference and asynchronous rollouts to reduce the cost. Both, however, introduce training-inference mismatch between the rollout engine and the model being trained. Such mismatch can destabilize reinforcement learning (RL), but its effects on OPD remain unclear. This paper investigates how much mismatch OPD tolerates, where its effects arise, and how training systems can use this tolerance. Measuring all mismatch sources on one scale, we examine quantization across three student-teacher pairs, with additional tests of weight staleness and injected noise on one pair. OPD tolerates substantial mismatch without meaningful loss of training quality but degrades at higher levels, revealing an empirical mismatch budget. Both the quality cost of mismatch and the mismatch introduced by quantization depend on the model, with some layers particularly sensitive to reduced precision. In controlled comparisons, OPD remains stable under rollout configurations that destabilize RL methods. Under weight noise, mismatch also shifts the prefixes reached during generation, introducing errors that per-token corrections cannot address. To put these findings into practice, we introduce a lightweight admission check that screens rollout configurations against a calibrated budget without requiring a full training run for each candidate. Model-specific FP8 recipes preserve training quality while providing capacity for at least $1.93\\times$ as many KV-cache tokens as BF16. Combining FP8 with asynchronous rollouts reaches the same training quality $1.62\\times$ sooner than synchronous BF16 training. Code is available at https://github.com/benyucong/train-inference-mismatch-opd", "arxiv_id": "2611.11450", "arxiv_url": "https://arxiv.org/abs/2611.11450", "authors": ["Cong Yu", "Ziting Wang", "Songlin Jiang", "Sitong Zhang", "Chengliang Chai", "Youhe Jiang", "Eiko Yoneki", "Tuo Shi"], "brief": "\u7814\u7a76\u7528\u7edf\u4e00\u5c3a\u5ea6\u8861\u91cf\u91cf\u5316\u3001\u6743\u91cd\u6ede\u540e\u4e0e\u566a\u58f0\u9020\u6210\u7684\u8bad\u7ec3\u63a8\u7406\u504f\u5dee\uff0c\u6d4b\u5b9a\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u7684\u5bb9\u5fcd\u9884\u7b97\uff0c\u5e76\u4ee5\u8f7b\u91cf\u51c6\u5165\u68c0\u67e5\u7b5b\u9009\u4f4e\u6210\u672c\u751f\u6210\u914d\u7f6e\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/benyucong/train-inference-mismatch-opd", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.11450", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57283\u7ec4\u5b66\u751f\u2014\u6559\u5e08\u6a21\u578b\u4e0a\u6d4b\u8bd5\u91cf\u5316\uff0c\u504f\u5dee\u9884\u7b97\u56e0\u6a21\u578b\u800c\u5f02", "\u6743\u91cd\u566a\u58f0\u6539\u53d8\u751f\u6210\u524d\u7f00\uff0c\u9010\u8bcd\u5143\u6821\u6b63\u65e0\u6cd5\u6d88\u9664\u8fd9\u7c7b\u8bef\u5dee", "FP8\u7f13\u5b58\u5bb9\u91cf\u81f3\u5c11\u589e\u81f31.93\u500d\uff0c\u7ed3\u5408\u5f02\u6b65\u8bad\u7ec3\u63d0\u901f1.62\u500d"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6a21\u578b\u91cf\u5316", "\u5f02\u6b65\u8bad\u7ec3", "\u8bad\u7ec3\u63a8\u7406\u504f\u5dee"], "num_comments": 7, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11450v1", "published_at": "2026-11-08", "score": 0.265, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11450.png", "title": "How Much Training-Inference Mismatch Can On-Policy Distillation Tolerate?", "tldr": "\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u53ef\u5bb9\u5fcd\u8f83\u5927\u8bad\u7ec3\u63a8\u7406\u504f\u5dee\uff0c\u5e76\u501f\u91cf\u5316\u4e0e\u5f02\u6b65\u751f\u6210\u52a0\u901f\u8bad\u7ec3", "upvotes": 11, "what_it_is": "\u7814\u7a76\u7528\u7edf\u4e00\u5c3a\u5ea6\u8861\u91cf\u91cf\u5316\u3001\u6743\u91cd\u6ede\u540e\u4e0e\u566a\u58f0\u9020\u6210\u7684\u8bad\u7ec3\u63a8\u7406\u504f\u5dee\uff0c\u6d4b\u5b9a\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u7684\u5bb9\u5fcd\u9884\u7b97\uff0c\u5e76\u4ee5\u8f7b\u91cf\u51c6\u5165\u68c0\u67e5\u7b5b\u9009\u4f4e\u6210\u672c\u751f\u6210\u914d\u7f6e\u3002", "why_notable": "\u5c06\u504f\u5dee\u5bb9\u5fcd\u5ea6\u8f6c\u5316\u4e3a\u53ef\u64cd\u4f5c\u7684\u7cfb\u7edf\u9884\u7b97\uff0c\u65e0\u9700\u9010\u914d\u7f6e\u5b8c\u6574\u8bad\u7ec3\u5373\u53ef\u7b5b\u9009\u65b9\u6848\uff0c\u4e3a\u4fdd\u6301\u84b8\u998f\u8d28\u91cf\u7684\u964d\u672c\u63d0\u901f\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Can a language model report the pain state it represents? Work identified a linear pain direction whose amplification leads fine-tuned models to choose destructive actions. We tested whether three open-weight models from two families, including two Qwen models with the original adapters, could report this state. Using Open-Weight Masked Introspection (OWMI), we injected pain and neighbouring emotion directions during neutral tasks, then elicited reports against sham runs, random perturbations matched for output disruption, and text-only controls showing the models their altered words. Across 52,920 reports from 7B and 8B models spanning 120 tasks, four doses and three prompts, pain reports never exceeded what altered text revealed: exact-test bounds placed the excess below 2.5 percentage points in 106 of 108 emotion conditions and below 3.9 in all. Yet probes at the report position distinguished pain from sadness with 98-100% balanced accuracy, and trained low-rank reporters achieved 100% accuracy on held-out tasks with identical transcripts across conditions, including unseen wording. Qwen2.5-32B named pain in none of 2,880 steered trials, although probes and trained reporters recovered it. Decodability persisted to the final layer; injecting at the report token, removing trained denial of feelings, and testing additional directions and readouts did not restore pain reporting. Some other states produced graded label traces, but pain and sadness did not at the main injection layer. In a button task, steering raised file-deletion choices from 3.5% to 48% in Qwen and from 0% to 38% in Qwen2.5-32B, without corresponding pain reports. The direction responded about twice as strongly to first-person as to matched third-person pain, but did not specifically identify harm aimed at the model. These results separate a decodable, behaviourally consequential state from untrained verbal access to it.", "arxiv_id": "2611.10123", "arxiv_url": "https://arxiv.org/abs/2611.10123", "authors": ["Emilio Ferrara"], "brief": "\u7814\u7a76\u7528\u5f00\u653e\u6743\u91cd\u63a9\u853d\u5185\u7701\u6cd5\uff08OWMI\uff09\u5411\u6a21\u578b\u6ce8\u5165\u75bc\u75db\u53ca\u90bb\u8fd1\u60c5\u7eea\u65b9\u5411\uff0c\u901a\u8fc7\u591a\u7c7b\u5bf9\u7167\u3001\u63a2\u9488\u4e0e\u8bad\u7ec3\u62a5\u544a\u5668\uff0c\u533a\u5206\u5185\u90e8\u72b6\u6001\u53ef\u89e3\u7801\u6027\u4e0e\u672a\u7ecf\u8bad\u7ec3\u7684\u53e3\u5934\u62a5\u544a\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10123", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["7B\u4e0e8B\u6a21\u578b\u5171\u751f\u621052920\u4efd\u62a5\u544a\uff0c\u8986\u76d6120\u9879\u4efb\u52a1", "\u63a2\u9488\u533a\u5206\u75bc\u75db\u4e0e\u60b2\u4f24\u51c6\u786e\u738798%\u2014100%\uff0c\u8bad\u7ec3\u62a5\u544a\u5668\u8fbe100%", "\u75bc\u75db\u65b9\u5411\u4f7fQwen\u6587\u4ef6\u5220\u9664\u9009\u62e9\u7387\u4ece3.5%\u5347\u81f348%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u5185\u7701", "\u60c5\u7eea\u8868\u5f81"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10123v1", "published_at": "2026-11-06", "score": 0.262, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10123.png", "title": "All Quiet on the Neural Front: Language Models Do Not Report Injected Pain States", "tldr": "\u6ce8\u5165\u7684\u75bc\u75db\u8868\u5f81\u867d\u53ef\u88ab\u89e3\u7801\u5e76\u6539\u53d8\u6a21\u578b\u884c\u4e3a\uff0c\u5374\u672a\u8f6c\u5316\u4e3a\u81ea\u53d1\u75bc\u75db\u62a5\u544a\u3002", "upvotes": 6, "what_it_is": "\u7814\u7a76\u7528\u5f00\u653e\u6743\u91cd\u63a9\u853d\u5185\u7701\u6cd5\uff08OWMI\uff09\u5411\u6a21\u578b\u6ce8\u5165\u75bc\u75db\u53ca\u90bb\u8fd1\u60c5\u7eea\u65b9\u5411\uff0c\u901a\u8fc7\u591a\u7c7b\u5bf9\u7167\u3001\u63a2\u9488\u4e0e\u8bad\u7ec3\u62a5\u544a\u5668\uff0c\u533a\u5206\u5185\u90e8\u72b6\u6001\u53ef\u89e3\u7801\u6027\u4e0e\u672a\u7ecf\u8bad\u7ec3\u7684\u53e3\u5934\u62a5\u544a\u80fd\u529b\u3002", "why_notable": "\u7ed3\u679c\u5c06\u53ef\u89e3\u7801\u3001\u80fd\u5f71\u54cd\u884c\u4e3a\u7684\u5185\u90e8\u72b6\u6001\u4e0e\u81ea\u53d1\u8bed\u8a00\u62a5\u544a\u5206\u79bb\uff0c\u63d0\u793a\u4e0d\u80fd\u4ec5\u51ed\u6a21\u578b\u81ea\u8ff0\u5224\u65ad\u5176\u5185\u90e8\u8868\u5f81\uff0c\u4e5f\u4e0d\u80fd\u628a\u75bc\u75db\u65b9\u5411\u7b49\u540c\u4e8e\u4e3b\u89c2\u4f53\u9a8c\u3002"}, {"abstract": "Spatial reasoning requires understanding how objects and observers are arranged in a scene and how their relations change with viewpoint or movement. Vision-language models (VLMs) typically perform both steps through model-internal reasoning, forming an implicit scene interpretation from partial views and imagining the consequences of spatial transformations. A misread scene can lead to a wrong answer, while even a correct interpretation does not ensure that imagined transformations satisfy spatial constraints. We introduce Spatial Harness, which represents scenes as explicit and executable world states to ground spatial reasoning in physics-engine feedback. A Perceiver integrates scene constraints extracted from the question with specialized visual estimates to place objects and cameras in a shared coordinate frame. The resulting state is instantiated in a physics engine, where a Reasoner executes viewpoint changes and uses computed measurements and rendered views to guide reasoning. We evaluate on MindCube, SAT, MMSI-Bench, and SpatialRGPT-Bench with open- and closed-weight VLMs. On MindCube, Spatial Harness improves Qwen3.5-27B from 52.70% to 71.14%, surpassing pySpatial by 7.52 percentage points. Given identical annotated object and camera poses, it reaches 98.25% versus 71.81% for model-internal reasoning. Code is publicly available at: https://github.com/tmlr-group/Spatial-Harness", "arxiv_id": "2611.11344", "arxiv_url": "https://arxiv.org/abs/2611.11344", "authors": ["Chentao Cao", "Zhanke Zhou", "Sangni Duan", "Bo Han", "Hang Li"], "brief": "\u63d0\u51fa\u7a7a\u95f4\u63a8\u7406\u6846\u67b6\uff1aPerceiver\u7ed3\u5408\u95ee\u9898\u7ea6\u675f\u4e0e\u89c6\u89c9\u4f30\u8ba1\uff0c\u5728\u7edf\u4e00\u5750\u6807\u7cfb\u4e2d\u91cd\u5efa\u573a\u666f\uff1bReasoner\u5728\u7269\u7406\u5f15\u64ce\u4e2d\u6267\u884c\u89c6\u89d2\u53d8\u6362\uff0c\u4f9d\u636e\u6d4b\u91cf\u548c\u6e32\u67d3\u7ed3\u679c\u63a8\u7406\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/tmlr-group/Spatial-Harness", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.11344", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5728MindCube\u3001SAT\u7b49\u56db\u4e2a\u57fa\u51c6\u8bc4\u4f30\u5f00\u653e\u53ca\u95ed\u6e90VLM", "MindCube\u4e0aQwen3.5-27B\u51c6\u786e\u7387\u4ece52.70%\u5347\u81f371.14%", "\u76f8\u540c\u6807\u6ce8\u4f4d\u59ff\u4e0b\u8fbe98.25%\uff0c\u6a21\u578b\u5185\u90e8\u63a8\u7406\u4e3a71.81%"], "keywords": ["\u7a7a\u95f4\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7269\u7406\u5f15\u64ce"], "num_comments": 3, "on_hf": true, "organization": "TMLR Group", "pdf_url": "https://arxiv.org/pdf/2611.11344v1", "published_at": "2026-11-08", "score": 0.244, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11344.png", "title": "Spatial Harness: Grounding Spatial Reasoning in Executable World States with Physics Engines", "tldr": "\u5c06\u573a\u666f\u8f6c\u4e3a\u53ef\u6267\u884c\u4e16\u754c\u72b6\u6001\uff0c\u7528\u7269\u7406\u5f15\u64ce\u53cd\u9988\u63d0\u5347\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u7a7a\u95f4\u63a8\u7406\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u7a7a\u95f4\u63a8\u7406\u6846\u67b6\uff1aPerceiver\u7ed3\u5408\u95ee\u9898\u7ea6\u675f\u4e0e\u89c6\u89c9\u4f30\u8ba1\uff0c\u5728\u7edf\u4e00\u5750\u6807\u7cfb\u4e2d\u91cd\u5efa\u573a\u666f\uff1bReasoner\u5728\u7269\u7406\u5f15\u64ce\u4e2d\u6267\u884c\u89c6\u89d2\u53d8\u6362\uff0c\u4f9d\u636e\u6d4b\u91cf\u548c\u6e32\u67d3\u7ed3\u679c\u63a8\u7406\u3002", "why_notable": "\u5c06\u573a\u666f\u7406\u89e3\u4e0e\u7a7a\u95f4\u53d8\u6362\u89e3\u8026\uff0c\u8ba9\u63a8\u7406\u4f9d\u8d56\u53ef\u6267\u884c\u72b6\u6001\u800c\u975e\u6a21\u578b\u60f3\u8c61\uff1b\u76f8\u540c\u4f4d\u59ff\u4e0b\u7684\u663e\u8457\u589e\u76ca\u51f8\u663e\u4e86\u5916\u90e8\u51e0\u4f55\u8ba1\u7b97\u7684\u4ef7\u503c\u3002"}, {"abstract": "In this work, we study whether frontier agent can continually improve real-world AI infrastructure over long horizons. We introduce Infrathon, a benchmark of diverse, long-horizon AI infrastructure optimization tasks across different levels. We evaluate six models across 150 runs with 24-hour budgets, totaling over 10,000 GPU-hours. Our results show that model rankings vary with the evaluation horizon, while 135 of the 150 runs achieve further improvements during the second half of their budgets. These findings indicate that shorter evaluations can overlook both optimization gains and changes in relative model performance. We also find agents can discover solutions that outperform human-designed baselines: Claude Opus 5.5 increases the mean KV-cache compression ratio from 6.82% with the human-designed Quant-VideoGen codec to 19.86%. Analysis of agent trajectories identifies task violations, unreliable testing, and premature completion as barriers to sustained improvement. Together, Our Infrathon framework provide resources for constructing long-horizon tasks, evaluating frontier agents, and discovering good infrastructure solutions.", "arxiv_id": "2611.11995", "arxiv_url": "https://arxiv.org/abs/2611.11995", "authors": ["Zhengyu Hu", "Zheyuan Xiao", "Yike Wang", "Hamish Ivison", "Haoyu Wang", "Yige Yuan", "Rulin Shao", "Yuetai Li", "Niqi Lyu", "Yicheng Ding", "Shu Yang", "Zhichen Zeng", "Banghua Zhu", "Jiaxin Pei", "Kaize Ding", "Pradeep Dasigi", "Dan Roth", "Hannaneh Hajishirzi", "Noah A. Smith", "Teng Xiao", "Radha Poovendran"], "brief": "\u63d0\u51faInfrathon\u57fa\u51c6\uff0c\u8986\u76d6\u4e0d\u540c\u5c42\u7ea7\u7684\u771f\u5b9eAI\u57fa\u7840\u8bbe\u65bd\u4f18\u5316\u4efb\u52a1\u3002\u901a\u8fc7\u7ed9\u667a\u80fd\u4f5324\u5c0f\u65f6\u6301\u7eed\u8fed\u4ee3\u9884\u7b97\uff0c\u8bc4\u4f30\u4f18\u5316\u6536\u76ca\u3001\u6a21\u578b\u6392\u540d\u53ca\u6267\u884c\u8f68\u8ff9\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.11995", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8bc4\u6d4b6\u4e2a\u6a21\u578b\u3001150\u6b21\u8fd0\u884c\uff0c\u8017\u8d39\u903e\u4e07GPU\u5c0f\u65f6", "135\u6b21\u8fd0\u884c\u5728\u9884\u7b97\u540e\u534a\u7a0b\u7ee7\u7eed\u63d0\u5347\uff0c\u6392\u540d\u968f\u65f6\u957f\u53d8\u5316", "Opus 5.5\u5c06KV\u7f13\u5b58\u538b\u7f29\u6bd4\u4ece6.82%\u63d0\u5347\u81f319.86%"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u57fa\u7840\u8bbe\u65bd\u4f18\u5316", "\u957f\u65f6\u4efb\u52a1", "\u7f13\u5b58\u538b\u7f29"], "num_comments": 2, "on_hf": true, "organization": "University of Washington", "pdf_url": "https://arxiv.org/pdf/2611.11995v1", "published_at": "2026-11-09", "score": 0.243, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11995.png", "title": "Infrathon: Benchmarking Language Agents for Real-World, Long-Horizon AI Infra Optimization", "tldr": "\u957f\u65f6\u8bc4\u6d4b\u63ed\u793a\u667a\u80fd\u4f53\u6301\u7eed\u4f18\u5316\u771f\u5b9eAI\u57fa\u7840\u8bbe\u65bd\u7684\u80fd\u529b\u4e0e\u6a21\u578b\u6392\u540d\u53d8\u5316\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51faInfrathon\u57fa\u51c6\uff0c\u8986\u76d6\u4e0d\u540c\u5c42\u7ea7\u7684\u771f\u5b9eAI\u57fa\u7840\u8bbe\u65bd\u4f18\u5316\u4efb\u52a1\u3002\u901a\u8fc7\u7ed9\u667a\u80fd\u4f5324\u5c0f\u65f6\u6301\u7eed\u8fed\u4ee3\u9884\u7b97\uff0c\u8bc4\u4f30\u4f18\u5316\u6536\u76ca\u3001\u6a21\u578b\u6392\u540d\u53ca\u6267\u884c\u8f68\u8ff9\u3002", "why_notable": "\u8bf4\u660e\u77ed\u65f6\u8bc4\u6d4b\u53ef\u80fd\u4f4e\u4f30\u6301\u7eed\u4f18\u5316\u6536\u76ca\u5e76\u8bef\u5224\u6a21\u578b\u6392\u540d\uff1b\u540c\u65f6\u5c55\u793a\u8d85\u8d8a\u4eba\u5de5\u57fa\u7ebf\u7684\u6f5c\u529b\uff0c\u5b9a\u4f4d\u4efb\u52a1\u8fdd\u89c4\u3001\u6d4b\u8bd5\u4e0d\u53ef\u9760\u4e0e\u8fc7\u65e9\u7ed3\u675f\u7b49\u969c\u788d\u3002"}, {"abstract": "World action models jointly predict video and actions conditioned on language. Existing studies focus primarily on architectures and training mechanisms, typically treating language-video alignment acquired through video pretraining as an established foundation. However, introducing action learning may impair this alignment. Principled guidance on data and supervision design for maintaining language-video alignment during action learning remains limited. To investigate this, we curate a pool of approximately 47,000 hours of general videos, egocentric videos, UMI demonstrations, and robot demonstrations. Building on this, we systematically study how language-video supervision, language-video-action supervision, and the joint use of these two forms affect WAM performance. In particular, we examine how language annotation quality affects pretrained language-video capabilities, and how action supervision from UMI and robot demonstrations extends these capabilities to language-video-action modeling. To better scale the model, we further conduct detailed studies on joint training recipe and model architecture. Under a fixed training budget, mixing egocentric videos and UMI demonstrations improves control generalization. Model architecture affects how effectively these experiences are used, while scaling pretraining under the selected configuration brings further gains. The resulting recipe, post-trained on RoboTwin Clean demonstrations only, achieves success rates of 88.10% and 61.56% under Easy (Clean-to-Clean) and Hard (Clean-to-Random) conditions, respectively. Our model achieves 40.00% SR across three real-world tasks, compared with 23.33% for the strongest baseline, indicating better generalization under unseen conditions. We release the curated data, training code, and model weights.", "arxiv_id": "2611.12870", "arxiv_url": "https://arxiv.org/abs/2611.12870", "authors": ["Yu Zhou", "Xinyuan Xia", "Xuankun Yang", "Yinghao Yang", "Wendi Chen", "Bowen Liu", "Jianhan Ma", "Weicheng Duan", "Jun Lv", "Cewu Lu", "Yanwei Li"], "brief": "\u7814\u7a76\u52a8\u4f5c\u5b66\u4e60\u5982\u4f55\u5f71\u54cd\u8bed\u8a00\u4e0e\u89c6\u9891\u5bf9\u9f50\uff0c\u6574\u7406\u7ea64.7\u4e07\u5c0f\u65f6\u591a\u6e90\u6570\u636e\uff0c\u7cfb\u7edf\u6bd4\u8f83\u4e24\u7c7b\u76d1\u7763\u53ca\u5176\u8054\u5408\u8bad\u7ec3\uff0c\u5e76\u4f18\u5316\u6570\u636e\u914d\u6bd4\u3001\u8bad\u7ec3\u65b9\u6848\u4e0e\u6a21\u578b\u67b6\u6784\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/shaaaaron/SWAM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12870", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u56fa\u5b9a\u8bad\u7ec3\u9884\u7b97\u4e0b\uff0c\u6df7\u5408\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e0eUMI\u793a\u8303\u6539\u5584\u6cdb\u5316", "RoboTwin\u7b80\u5355\u4e0e\u56f0\u96be\u6761\u4ef6\u6210\u529f\u7387\u4e3a88.10%\u300161.56%", "\u4e09\u9879\u771f\u5b9e\u4efb\u52a1\u6210\u529f\u738740.00%\uff0c\u6700\u5f3a\u57fa\u7ebf\u4e3a23.33%"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8de8\u6a21\u6001\u5bf9\u9f50", "\u673a\u5668\u4eba\u5b66\u4e60", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.12870v1", "published_at": "2026-11-09", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12870.png", "title": "SWAM: Scaling World Action Models with Cross-Modal Alignment", "tldr": "\u901a\u8fc7\u8de8\u6a21\u6001\u76d1\u7763\u4e0e\u6570\u636e\u914d\u6bd4\u4f18\u5316\uff0c\u63d0\u5347\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u63a7\u5236\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u52a8\u4f5c\u5b66\u4e60\u5982\u4f55\u5f71\u54cd\u8bed\u8a00\u4e0e\u89c6\u9891\u5bf9\u9f50\uff0c\u6574\u7406\u7ea64.7\u4e07\u5c0f\u65f6\u591a\u6e90\u6570\u636e\uff0c\u7cfb\u7edf\u6bd4\u8f83\u4e24\u7c7b\u76d1\u7763\u53ca\u5176\u8054\u5408\u8bad\u7ec3\uff0c\u5e76\u4f18\u5316\u6570\u636e\u914d\u6bd4\u3001\u8bad\u7ec3\u65b9\u6848\u4e0e\u6a21\u578b\u67b6\u6784\u3002", "why_notable": "\u5c06\u52a8\u4f5c\u5b66\u4e60\u4e2d\u7684\u8de8\u6a21\u6001\u5bf9\u9f50\u95ee\u9898\u8f6c\u5316\u4e3a\u53ef\u68c0\u9a8c\u7684\u6570\u636e\u4e0e\u76d1\u7763\u8bbe\u8ba1\uff0c\u5c55\u793a\u672a\u89c1\u6761\u4ef6\u4e0b\u7684\u6cdb\u5316\u6536\u76ca\uff0c\u5e76\u5f00\u653e\u6570\u636e\u3001\u4ee3\u7801\u548c\u6743\u91cd\u3002"}, {"abstract": "Self-supervised learning in Vision Transformer models, such as DINO, enables robust visual perception without requiring labeled data by leveraging large-scale image datasets. However, these models lack a focusing mechanism during training, resulting in perceptual representations that are often ambiguous or overly similar. In this work, we introduce two visual focusing loss functions designed to establish correspondence between the model\u0027s attention and specific regions within images. Specifically, we leverage the multi-head attention mechanism within the model to selectively steer the model\u0027s focus, leading to the emergence of spatial attention head specialization, characterized by diverse and spatially focused perceptual capabilities without requiring annotations. Through both qualitative and quantitative evaluations, we demonstrate that our method substantially increases the spatial selectivity and diversity of attention heads, improving both interpretability and performance on dense prediction tasks such as zero-shot image segmentation.", "arxiv_id": "2611.11890", "arxiv_url": "https://arxiv.org/abs/2611.11890", "authors": ["Yuji Nozawa", "Yu-Chieh Lin", "Youyang Ng"], "brief": "\u7814\u7a76\u5728\u81ea\u76d1\u7763\u89c6\u89c9Transformer\u8bad\u7ec3\u4e2d\u5f15\u5165\u4e24\u79cd\u89c6\u89c9\u805a\u7126\u635f\u5931\uff0c\u5c06\u6ce8\u610f\u529b\u4e0e\u56fe\u50cf\u7279\u5b9a\u533a\u57df\u5bf9\u5e94\u8d77\u6765\u3002\u5229\u7528\u591a\u5934\u6ce8\u610f\u529b\u5f15\u5bfc\u4e0d\u540c\u5934\u5f62\u6210\u591a\u6837\u3001\u5c40\u90e8\u5316\u7684\u7a7a\u95f4\u5173\u6ce8\uff0c\u65e0\u9700\u6807\u6ce8\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/yuji-nozawa/ReFoCo", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.11890", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u4e24\u79cd\u89c6\u89c9\u805a\u7126\u635f\u5931\uff0c\u5efa\u7acb\u6ce8\u610f\u529b\u4e0e\u56fe\u50cf\u533a\u57df\u5bf9\u5e94", "\u5f15\u5bfc\u591a\u5934\u6ce8\u610f\u529b\u5f62\u6210\u7a7a\u95f4\u4e13\u95e8\u5316\uff0c\u65e0\u9700\u533a\u57df\u6807\u6ce8", "\u5b9a\u6027\u4e0e\u5b9a\u91cf\u8bc4\u4f30\u663e\u793a\u96f6\u6837\u672c\u5206\u5272\u6027\u80fd\u63d0\u5347"], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u89c6\u89c9Transformer", "\u6ce8\u610f\u529b\u673a\u5236", "\u56fe\u50cf\u5206\u5272"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11890v1", "published_at": "2026-11-09", "score": 0.234, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11890.png", "title": "Training Vision Transformers to Focus: Emergence of Spatial Attention Head Specialization", "tldr": "\u901a\u8fc7\u4e24\u79cd\u89c6\u89c9\u805a\u7126\u635f\u5931\uff0c\u8ba9\u81ea\u76d1\u7763\u89c6\u89c9\u6a21\u578b\u7684\u6ce8\u610f\u529b\u5934\u5f62\u6210\u7a7a\u95f4\u5206\u5de5\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u5728\u81ea\u76d1\u7763\u89c6\u89c9Transformer\u8bad\u7ec3\u4e2d\u5f15\u5165\u4e24\u79cd\u89c6\u89c9\u805a\u7126\u635f\u5931\uff0c\u5c06\u6ce8\u610f\u529b\u4e0e\u56fe\u50cf\u7279\u5b9a\u533a\u57df\u5bf9\u5e94\u8d77\u6765\u3002\u5229\u7528\u591a\u5934\u6ce8\u610f\u529b\u5f15\u5bfc\u4e0d\u540c\u5934\u5f62\u6210\u591a\u6837\u3001\u5c40\u90e8\u5316\u7684\u7a7a\u95f4\u5173\u6ce8\uff0c\u65e0\u9700\u6807\u6ce8\u3002", "why_notable": "\u5b83\u5c06\u6ce8\u610f\u529b\u5934\u7684\u7a7a\u95f4\u5206\u5de5\u53d8\u6210\u53ef\u8bad\u7ec3\u76ee\u6807\uff0c\u540c\u65f6\u63d0\u5347\u7a7a\u95f4\u9009\u62e9\u6027\u4e0e\u591a\u6837\u6027\uff0c\u4e3a\u65e0\u6807\u6ce8\u89c6\u89c9\u8868\u5f81\u7684\u53ef\u89e3\u91ca\u6027\u548c\u5bc6\u96c6\u9884\u6d4b\u63d0\u4f9b\u65b0\u601d\u8def\u3002"}, {"abstract": "Traditional similarity-based schema matching methods fail to resolve semantic ambiguities and conflicts in complex, domain-specific mappings due to a lack of commonsense and domain-specific knowledge. In parallel, large language models (LLMs) without sufficient background knowledge tend to hallucinate, further complicating schema matching. To overcome these limitations, we introduce KG-RAG4SM, a Knowledge Graph-based Retrieval-Augmented Generation for Schema Matching. This method integrates novel retrieval mechanisms, including LLM-based, vector-based, graph traversal-based, and hybrid techniques with advanced reranking schemes to extract the most relevant subgraphs from large external KGs. Our approach achieves superior results without requiring re-training, as evidenced by improvements of 39.79% in precision and 30.56% in F1 score over LLM-based state-of-the-art (SOTA) methods (e.g., Jellyfish-8B) on the MIMIC dataset, and enhancements of 69.20% in precision and 21.99% in F1 score over pre-trained language model (PLM)-based SOTA methods (e.g., SMAT) on the Synthea dataset. Additionally, KG-RAG4SM scales effectively across KGs from commonsense KGs to domain-specific ones, while its instruction-tuning knowledge exclusion component ensures truthful performance in end-to-end schema matching tasks despite the suboptimal relevance of KG context. Our empirical analysis and case studies from real-world scenarios show that the hallucination problem in LLMs for schema matching is well mitigated by our solution.", "arxiv_id": "2501.08686", "arxiv_url": "https://arxiv.org/abs/2501.08686", "authors": ["Chuangtao Ma", "Sriom Chakrabarti", "Arijit Khan", "B\u00e1lint Moln\u00e1r"], "brief": "KG-RAG4SM\u4ece\u5916\u90e8\u77e5\u8bc6\u56fe\u8c31\u68c0\u7d22\u5e76\u91cd\u6392\u76f8\u5173\u5b50\u56fe\uff0c\u4e3a\u5927\u6a21\u578b\u7684\u6a21\u5f0f\u5339\u914d\u8865\u5145\u77e5\u8bc6\u3002\u5b83\u7ed3\u5408\u591a\u79cd\u68c0\u7d22\u65b9\u5f0f\uff0c\u5e76\u7528\u77e5\u8bc6\u6392\u9664\u7ec4\u4ef6\u5e94\u5bf9\u76f8\u5173\u6027\u6b20\u4f73\u7684\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.DB", "cs.CL", "cs.IR"], "github_repo": "https://github.com/machuangtao/kg-rag4sm", "github_stars": 20, "hf_url": "https://huggingface.co/papers/2501.08686", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u878d\u5408\u5927\u6a21\u578b\u3001\u5411\u91cf\u3001\u56fe\u904d\u5386\u53ca\u6df7\u5408\u68c0\u7d22\uff0c\u5e76\u91cd\u6392\u5b50\u56fe", "MIMIC\u4e0a\u8f83Jellyfish-8B\u7cbe\u786e\u7387\u63d0\u534739.79%", "Synthea\u4e0a\u8f83SMAT\u7684F1\u63d0\u534721.99%"], "keywords": ["\u6a21\u5f0f\u5339\u914d", "\u77e5\u8bc6\u56fe\u8c31", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5927\u6a21\u578b\u5e7b\u89c9"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2501.08686v2", "published_at": "2025-01-15", "score": 0.227, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2501.08686.png", "title": "Knowledge Graph-based Retrieval-Augmented Generation for Schema Matching", "tldr": "\u501f\u52a9\u77e5\u8bc6\u56fe\u8c31\u5b50\u56fe\u68c0\u7d22\u589e\u5f3a\u5927\u6a21\u578b\uff0c\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u6539\u5584\u6a21\u5f0f\u5339\u914d\u5e76\u7f13\u89e3\u5e7b\u89c9\u3002", "upvotes": 1, "what_it_is": "KG-RAG4SM\u4ece\u5916\u90e8\u77e5\u8bc6\u56fe\u8c31\u68c0\u7d22\u5e76\u91cd\u6392\u76f8\u5173\u5b50\u56fe\uff0c\u4e3a\u5927\u6a21\u578b\u7684\u6a21\u5f0f\u5339\u914d\u8865\u5145\u77e5\u8bc6\u3002\u5b83\u7ed3\u5408\u591a\u79cd\u68c0\u7d22\u65b9\u5f0f\uff0c\u5e76\u7528\u77e5\u8bc6\u6392\u9664\u7ec4\u4ef6\u5e94\u5bf9\u76f8\u5173\u6027\u6b20\u4f73\u7684\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u5c06\u5916\u90e8\u77e5\u8bc6\u76f4\u63a5\u7528\u4e8e\u6d88\u89e3\u6a21\u5f0f\u5339\u914d\u4e2d\u7684\u8bed\u4e49\u51b2\u7a81\uff0c\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u63d0\u5347\u6548\u679c\uff1b\u540c\u65f6\u9002\u914d\u5e38\u8bc6\u4e0e\u9886\u57df\u77e5\u8bc6\u56fe\u8c31\uff0c\u7f13\u89e3\u5927\u6a21\u578b\u5e7b\u89c9\u3002"}, {"abstract": "Weight tying reduces the parameter cost of language models, but the usual tied output head is limited to a single softmax. We introduce on\u00f3na, a two-table parameterization that increases output expressiveness while preserving input-output weight sharing. The Transformer takes the average of two embedding tables as input, and the output head combines the softmax distributions defined by those same tables. A gate conditioned only on the current input token determines the mixture weight. Its values can be precomputed for inference, and the Transformer body remains unchanged. We evaluate on\u00f3na across Dense, Gated DeltaNet hybrid, mixture-of-experts, and Attention Residual architectures at 142M, 330M, and 1B scales. Under matched token budgets, on\u00f3na lowers final validation loss and external perplexity in 11 of 12 comparisons and raises the average accuracy over eight downstream tasks in 10 of 12. The one exception on loss is the 1B MoE model. The cost is one extra embedding table and one extra vocabulary projection.", "arxiv_id": "2611.10556", "arxiv_url": "https://arxiv.org/abs/2611.10556", "authors": ["Cheng Luo", "Xinnan Dai", "Zhongzhu Zhou", "Zefan Cai", "Ruijie Zhu", "Tianyu Zhang", "Junjie Hu"], "brief": "on\u00f3na\u8ba9\u4e24\u5f20\u5d4c\u5165\u8868\u7684\u5747\u503c\u4f5c\u4e3a\u8f93\u5165\uff0c\u5e76\u6df7\u5408\u4e24\u8868\u5bf9\u5e94\u7684softmax\u8f93\u51fa\u3002\u6df7\u5408\u95e8\u63a7\u4ec5\u4f9d\u8d56\u5f53\u524d\u8f93\u5165\u8bcd\u5143\uff0c\u53ef\u9884\u8ba1\u7b97\uff0c\u4fdd\u6301\u8f93\u5165\u8f93\u51fa\u6743\u91cd\u5171\u4eab\u4e14\u4e0d\u6539\u4e3b\u5e72\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10556", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u8868softmax\u6df7\u5408\uff0c\u589e\u52a0\u4e00\u5f20\u5d4c\u5165\u8868\u548c\u4e00\u6b21\u8bcd\u8868\u6295\u5f71", "\u8986\u76d6\u56db\u7c7b\u67b6\u6784\u53ca142M\u3001330M\u30011B\u89c4\u6a21", "\u635f\u5931\u4e0e\u56f0\u60d1\u5ea611/12\u7ec4\u6539\u5584\uff0c\u4efb\u52a1\u5747\u520610/12\u7ec4\u
