<script>
const PAPERS = [{"abstract": "Decision models such as Jev have emerged as a highly promising paradigm for LLM agent systems, providing lightweight and reliable categorical reasoning for rapid System One execution. However, existing generation-oriented inference engines fail to support these workloads effectively, suffering from severe prefix recomputation overheads or distorted output probabilities. To address this challenge, we propose Flide, an efficient and exact inference engine that decouples the logical tree structure of a decision request from its physical execution within a single flattened token stream. Through ForkAttention, Flide navigates request dependencies using GPU-resident indices across both standard attention and recurrent Gated DeltaNet layers, guaranteeing in exact arithmetic that every query branch evaluates identically to an isolated forward pass. By expressing branch topologies directly in GPU-resident metadata, Flide accommodates diverse request mixtures with a compact set of pre-recorded execution graphs while enabling expanding agent histories to resume from checkpoints saved in earlier passes. Extensive evaluations on public hybrid and decision models demonstrate that Flide answers queries up to 9.5 times faster than vLLM and SGLang while staying closest to a float32 reference in total variation distance. By unifying physical execution throughput with mathematical exactness, Flide establishes a principled foundation for scalable, latency-critical decision intelligence in agent systems.", "arxiv_id": "2610.42148", "arxiv_url": "https://arxiv.org/abs/2610.42148", "authors": ["Bobo Li", "Jiajia Song", "Hao Fei", "Wynne Hsu", "Mong Li Lee"], "brief": "Flide\u662f\u9762\u5411\u51b3\u7b56\u6a21\u578b\u7684\u63a8\u7406\u5f15\u64ce\uff0c\u5c06\u903b\u8f91\u5206\u652f\u6811\u6620\u5c04\u5230\u6241\u5e73\u4ee4\u724c\u6d41\u3002\u5b83\u7528ForkAttention\u548cGPU\u7d22\u5f15\u7ba1\u7406\u4f9d\u8d56\uff0c\u907f\u514d\u524d\u7f00\u91cd\u590d\u8ba1\u7b97\u5e76\u4fdd\u6301\u5206\u652f\u8bed\u4e49\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/OmniJev/Flide", "github_stars": 344, "hf_url": "https://huggingface.co/papers/2610.42148", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["ForkAttention\u652f\u6301\u6807\u51c6\u6ce8\u610f\u529b\u4e0eGated DeltaNet", "\u7cbe\u786e\u7b97\u672f\u4e0b\uff0c\u5404\u5206\u652f\u7b49\u4ef7\u4e8e\u72ec\u7acb\u524d\u5411\u8ba1\u7b97", "\u8f83vLLM\u548cSGLang\u6700\u9ad8\u52a0\u901f9.5\u500d"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u7406\u52a0\u901f", "\u51b3\u7b56\u6a21\u578b", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 3, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.42148v1", "published_at": "2026-10-30", "score": 0.701, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42148.png", "title": "Flide: Accelerating Decision Inference with Exact State Forking", "tldr": "\u901a\u8fc7\u7cbe\u786e\u72b6\u6001\u5206\u53c9\u52a0\u901f\u667a\u80fd\u4f53\u51b3\u7b56\u63a8\u7406\uff0c\u517c\u987e\u5206\u652f\u6982\u7387\u4fdd\u771f\u4e0e\u4f4e\u5ef6\u8fdf\u3002", "upvotes": 32, "what_it_is": "Flide\u662f\u9762\u5411\u51b3\u7b56\u6a21\u578b\u7684\u63a8\u7406\u5f15\u64ce\uff0c\u5c06\u903b\u8f91\u5206\u652f\u6811\u6620\u5c04\u5230\u6241\u5e73\u4ee4\u724c\u6d41\u3002\u5b83\u7528ForkAttention\u548cGPU\u7d22\u5f15\u7ba1\u7406\u4f9d\u8d56\uff0c\u907f\u514d\u524d\u7f00\u91cd\u590d\u8ba1\u7b97\u5e76\u4fdd\u6301\u5206\u652f\u8bed\u4e49\u3002", "why_notable": "\u5b83\u628a\u541e\u5410\u4f18\u5316\u4e0e\u6982\u7387\u4fdd\u771f\u7ed3\u5408\u8d77\u6765\uff0c\u7f13\u89e3\u51b3\u7b56\u63a8\u7406\u4e2d\u901f\u5ea6\u4e0e\u51c6\u786e\u6027\u7684\u51b2\u7a81\uff0c\u5e76\u652f\u6301\u4ece\u5386\u53f2\u68c0\u67e5\u70b9\u7eed\u7b97\uff0c\u9002\u5408\u4f4e\u5ef6\u8fdf\u667a\u80fd\u4f53\u7cfb\u7edf\u3002"}, {"abstract": "LLM agents increasingly drive systems research and rely on simulators to evaluate candidate designs at scale. Simulators are imperfect by design: their modeling limitations can distort predictions yet leave the recommended design correct, or change which design should be selected. We introduce Siris to test whether LLMs can tell these cases apart, judging from their systems understanding when a limitation invalidates the simulator\u0027s recommendation. By perturbing a simulator, Siris constructs workload pairs with the same candidates, limitation, and simulator recommendation. The perturbation changes predictions on both workloads, yet a reference simulator supports the recommendation on only one. Evaluating thirteen frontier LLMs on LLM serving design problems, we find that identifying a limitation does not ensure a correct choice, and even the strongest models sometimes abandon valid recommendations. Self-correction through a review turn helps these models restore valid choices but introduces new errors in several others. These findings motivate evaluating systems understanding through design decisions under imperfect simulators.", "arxiv_id": "2611.10329", "arxiv_url": "https://arxiv.org/abs/2611.10329", "authors": ["Jinwoo Hwang", "Sukmin Cho", "Tao Zhang", "Soheil Abbasloo", "Jongse Park", "Peng Cheng"], "brief": "\u63d0\u51faSiris\u8bc4\u6d4b\uff0c\u901a\u8fc7\u6270\u52a8\u4eff\u771f\u5668\u6784\u9020\u914d\u5bf9\u5de5\u4f5c\u8d1f\u8f7d\uff0c\u4f7f\u76f8\u540c\u63a8\u8350\u4ec5\u5728\u5176\u4e2d\u4e00\u4e2a\u6210\u7acb\uff0c\u68c0\u9a8c\u6a21\u578b\u80fd\u5426\u5224\u65ad\u4eff\u771f\u5c40\u9650\u662f\u5426\u63a8\u7ffb\u8bbe\u8ba1\u9009\u62e9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10329", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u914d\u5bf9\u8d1f\u8f7d\u5171\u4eab\u5019\u9009\u3001\u4eff\u771f\u5c40\u9650\u4e0e\u63a8\u8350\uff0c\u53c2\u8003\u4eff\u771f\u5668\u4ec5\u652f\u6301\u5176\u4e00", "\u8bc4\u6d4b13\u4e2a\u524d\u6cbf\u5927\u6a21\u578b\uff0c\u4efb\u52a1\u805a\u7126\u5927\u6a21\u578b\u670d\u52a1\u8bbe\u8ba1", "\u589e\u52a0\u4e00\u8f6e\u590d\u6838\u53ef\u6062\u590d\u90e8\u5206\u6709\u6548\u9009\u62e9\uff0c\u4e5f\u4f1a\u7ed9\u5176\u4ed6\u6a21\u578b\u5f15\u5165\u65b0\u9519\u8bef"], "keywords": ["\u5927\u6a21\u578b\u8bc4\u6d4b", "\u4eff\u771f", "\u7cfb\u7edf\u8bbe\u8ba1", "\u81ea\u6211\u7ea0\u9519"], "num_comments": 3, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2611.10329v1", "published_at": "2026-11-06", "score": 0.638, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10329.png", "title": "SIRIS: Can LLMs Tell When Simulation Errors Matter in AI-Driven Systems Research", "tldr": "Siris\u63ed\u793a\u5927\u6a21\u578b\u867d\u80fd\u8bc6\u522b\u4eff\u771f\u5c40\u9650\uff0c\u5374\u672a\u5fc5\u5224\u65ad\u5176\u662f\u5426\u5f71\u54cd\u8bbe\u8ba1\u9009\u62e9\u3002", "upvotes": 12, "what_it_is": "\u63d0\u51faSiris\u8bc4\u6d4b\uff0c\u901a\u8fc7\u6270\u52a8\u4eff\u771f\u5668\u6784\u9020\u914d\u5bf9\u5de5\u4f5c\u8d1f\u8f7d\uff0c\u4f7f\u76f8\u540c\u63a8\u8350\u4ec5\u5728\u5176\u4e2d\u4e00\u4e2a\u6210\u7acb\uff0c\u68c0\u9a8c\u6a21\u578b\u80fd\u5426\u5224\u65ad\u4eff\u771f\u5c40\u9650\u662f\u5426\u63a8\u7ffb\u8bbe\u8ba1\u9009\u62e9\u3002", "why_notable": "\u5c06\u7cfb\u7edf\u7406\u89e3\u7684\u8bc4\u6d4b\u4ece\u8bc6\u522b\u5efa\u6a21\u7f3a\u9677\u63a8\u8fdb\u5230\u5224\u65ad\u51b3\u7b56\u540e\u679c\uff0c\u63ed\u793a\u81ea\u52a8\u5316\u7cfb\u7edf\u7814\u7a76\u4e2d\u8bef\u5f03\u6709\u6548\u65b9\u6848\u7684\u98ce\u9669\u3002"}, {"abstract": "Lloyd\u0027s k-means algorithm is a long-running standard for clustering, with applications in data analysis, retrieval, quantization and data curation. In this paper, we introduce an exponential moving average optimization procedure for k-means with mini-batch updates, powered by modern deep learning machinery and new insights. We also establish scaling laws on how decay rate and batch size impact final performance. This gives us a formulaic rule to fix them for multiple problem sizes and embedding datasets, without the need for any hyperparameter sweep. The resulting clustering algorithm, coined e-means, is much faster than Lloyd k-means and converges to lower losses, frequently even beating k-means++. On a wide array of embeddings datasets, it beats the loss of Lloyd k-means at 25 epochs in 1.4 to 2.6 epochs, which translates to 10-45x GPU wall-clock speedups compared to state-of-the-art k-means implementations. As an example, e-means partitions DINO10B, a dataset of 10 billion DINO embeddings, into 16 million clusters in only 2.5 epochs, reaching a loss below Lloyd\u0027s at 25 epochs.", "arxiv_id": "2611.09501", "arxiv_url": "https://arxiv.org/abs/2611.09501", "authors": ["Swann Bessa", "Pierre-Emmanuel Mazar\u00e9", "Gergely Szilvasy", "Hugo Touvron", "David Picard", "Matthijs Douze", "Herv\u00e9 J\u00e9gou"], "brief": "\u63d0\u51fa\u5c0f\u6279\u91cf\u805a\u7c7b\u7b97\u6cd5 e-means\uff0c\u4ee5\u6307\u6570\u79fb\u52a8\u5e73\u5747\u4f18\u5316\u805a\u7c7b\u4e2d\u5fc3\u3002\u5229\u7528\u8870\u51cf\u7387\u548c\u6279\u5927\u5c0f\u7684\u7f29\u653e\u89c4\u5f8b\u5236\u5b9a\u53c2\u6570\u89c4\u5219\uff0c\u9002\u914d\u4e0d\u540c\u89c4\u6a21\u4e0e\u5d4c\u5165\u6570\u636e\uff0c\u65e0\u9700\u8d85\u53c2\u6570\u641c\u7d22\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/facebookresearch/faiss", "github_stars": 41337, "hf_url": "https://huggingface.co/papers/2611.09501", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ee5\u5c0f\u6279\u91cf\u6307\u6570\u79fb\u52a8\u5e73\u5747\u66f4\u65b0\u4e2d\u5fc3\uff0c\u5e76\u5efa\u7acb\u53c2\u6570\u7f29\u653e\u89c4\u5f8b", "1.4\u81f32.6\u8f6e\u4f18\u4e8eLloyd\u7b97\u6cd525\u8f6e\u635f\u5931\uff0cGPU\u63d0\u901f10\u81f345\u500d", "100\u4ebfDINO\u5d4c\u5165\u5212\u5206\u4e3a1600\u4e07\u7c07\uff0c\u4ec5\u97002.5\u8f6e"], "keywords": ["\u805a\u7c7b", "\u6307\u6570\u79fb\u52a8\u5e73\u5747", "\u7f29\u653e\u89c4\u5f8b", "\u5927\u89c4\u6a21\u8ba1\u7b97"], "num_comments": 3, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2611.09501v1", "published_at": "2026-11-06", "score": 0.569, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09501.png", "title": "e-means: outperforming k-means (in one-tenth the epochs)", "tldr": "\u4ee5\u6307\u6570\u79fb\u52a8\u5e73\u5747\u66f4\u65b0\u805a\u7c7b\u4e2d\u5fc3\uff0c\u7528\u7ea6\u5341\u5206\u4e4b\u4e00\u8f6e\u6570\u83b7\u5f97\u66f4\u4f4e\u805a\u7c7b\u635f\u5931\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51fa\u5c0f\u6279\u91cf\u805a\u7c7b\u7b97\u6cd5 e-means\uff0c\u4ee5\u6307\u6570\u79fb\u52a8\u5e73\u5747\u4f18\u5316\u805a\u7c7b\u4e2d\u5fc3\u3002\u5229\u7528\u8870\u51cf\u7387\u548c\u6279\u5927\u5c0f\u7684\u7f29\u653e\u89c4\u5f8b\u5236\u5b9a\u53c2\u6570\u89c4\u5219\uff0c\u9002\u914d\u4e0d\u540c\u89c4\u6a21\u4e0e\u5d4c\u5165\u6570\u636e\uff0c\u65e0\u9700\u8d85\u53c2\u6570\u641c\u7d22\u3002", "why_notable": "\u628a\u66f4\u4f4e\u805a\u7c7b\u635f\u5931\u4e0e\u663e\u8457\u8ba1\u7b97\u63d0\u901f\u7ed3\u5408\uff0c\u5e76\u51cf\u5c11\u8c03\u53c2\u6210\u672c\uff1b\u767e\u4ebf\u7ea7\u5d4c\u5165\u5b9e\u9a8c\u5c55\u793a\u4e86\u5176\u5728\u5927\u89c4\u6a21\u6570\u636e\u6574\u7406\u4e0e\u91cf\u5316\u4e2d\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Agentic reinforcement learning (RL) and multi-teacher on-policy distillation (MOPD) offer complementary routes to post-training. For visual agents, however, tool use presents two related challenges. Models may overlook useful tool-returned observations, while poorly grounded actions can limit the evidence available for subsequent distillation. We introduce Reframe, a post-training framework that treats the observation state, rather than only the output distribution, as an object of alignment. First, Ground-Drop-GRPO (GD-GRPO) trains spatial and temporal specialists with evidence-aware rewards and stochastic removal of the original visual input, encouraging them to acquire grounded evidence and use the returned observations. Second, Observation-Gated-MOPD (OG-MOPD) replaces deficient tool actions with canonical ones mid-rollout and resumes distillation from the repaired observation. The two stages complement each other, as learning to rely on tool-returned observations can help the policy benefit from observation repair. Neither stage requires a task-specific SFT cold start. Extensive experiments over 14 image and video benchmarks demonstrate that Reframe outperforms both Mix-RL and vanilla MOPD. Ablation results show that GD-GRPO increases observation dependence and tool gain compared with outcome-based GRPO.", "arxiv_id": "2611.12886", "arxiv_url": "https://arxiv.org/abs/2611.12886", "authors": ["Haozhi Yuan", "Handong Li", "Yifan Zhang", "Qianshan Wei"], "brief": "Reframe\u5c06\u89c2\u6d4b\u72b6\u6001\u7eb3\u5165\u5bf9\u9f50\u76ee\u6807\uff1a\u5148\u4ee5\u8bc1\u636e\u611f\u77e5\u5956\u52b1\u548c\u968f\u673a\u79fb\u9664\u539f\u59cb\u89c6\u89c9\u8f93\u5165\u8bad\u7ec3\u4e13\u5bb6\uff0c\u518d\u4fee\u590d\u8f68\u8ff9\u4e2d\u7684\u5de5\u5177\u52a8\u4f5c\uff0c\u4ece\u4fee\u590d\u540e\u7684\u89c2\u6d4b\u7ee7\u7eed\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/EliYuan30/Reframe", "github_stars": 31, "hf_url": "https://huggingface.co/papers/2611.12886", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GD-GRPO\u8bad\u7ec3\u7a7a\u95f4\u4e0e\u65f6\u95f4\u4e13\u5bb6\uff0c\u5f3a\u5316\u5de5\u5177\u8bc1\u636e\u5229\u7528", "OG-MOPD\u5728\u8f68\u8ff9\u4e2d\u66ff\u6362\u7f3a\u9677\u5de5\u5177\u52a8\u4f5c\u5e76\u4fee\u590d\u89c2\u6d4b", "14\u4e2a\u56fe\u50cf\u4e0e\u89c6\u9891\u57fa\u51c6\u4e0a\u4f18\u4e8eMix-RL\u548c\u539f\u751fMOPD"], "keywords": ["\u89c6\u89c9\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 3, "on_hf": true, "organization": "Nanjing University", "pdf_url": "https://arxiv.org/pdf/2611.12886v1", "published_at": "2026-11-09", "score": 0.559, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (38\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12886.png", "title": "Reframe: Observation-Aligned Multi-Teacher On-Policy Distillation for Agentic Visual Reasoning", "tldr": "\u901a\u8fc7\u8bc1\u636e\u611f\u77e5\u8bad\u7ec3\u4e0e\u89c2\u6d4b\u4fee\u590d\uff0c\u8ba9\u89c6\u89c9\u667a\u80fd\u4f53\u66f4\u6709\u6548\u5730\u5229\u7528\u5de5\u5177\u8fd4\u56de\u4fe1\u606f\u3002", "upvotes": 38, "what_it_is": "Reframe\u5c06\u89c2\u6d4b\u72b6\u6001\u7eb3\u5165\u5bf9\u9f50\u76ee\u6807\uff1a\u5148\u4ee5\u8bc1\u636e\u611f\u77e5\u5956\u52b1\u548c\u968f\u673a\u79fb\u9664\u539f\u59cb\u89c6\u89c9\u8f93\u5165\u8bad\u7ec3\u4e13\u5bb6\uff0c\u518d\u4fee\u590d\u8f68\u8ff9\u4e2d\u7684\u5de5\u5177\u52a8\u4f5c\uff0c\u4ece\u4fee\u590d\u540e\u7684\u89c2\u6d4b\u7ee7\u7eed\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u3002", "why_notable": "\u628a\u84b8\u998f\u5bf9\u9f50\u4ece\u8f93\u51fa\u6269\u5c55\u5230\u89c2\u6d4b\uff0c\u8054\u52a8\u6539\u5584\u5de5\u5177\u53d6\u8bc1\u4e0e\u8bc1\u636e\u4f7f\u7528\uff1b\u4e24\u9636\u6bb5\u5747\u65e0\u9700\u4efb\u52a1\u4e13\u7528\u76d1\u7763\u5fae\u8c03\u51b7\u542f\u52a8\u3002"}, {"abstract": "Reproducing machine learning experiments requires reconstructing procedures from information scattered across papers, released code, and supporting artifacts. For coding agents, reproduction success can therefore depend on their ability to fill in missing details, rather than on the released artifacts alone. We ask whether preserving recovered procedures and decisions improves subsequent independent reproduction. We define a standardized artifact design comprising a refined codebase, environment setup, experiment launchers, and a reproduction guide, and introduce ReproBridge, an agent workflow for constructing these refined reproducible artifacts. ReproBridge-Bench provides 1,029 tasks from 387 experiments across 36 papers, anchored by five human-verified reference scores per task. Agents attempt tasks in fresh sessions with raw code or refined artifacts; a separate Auditor checks execution evidence. Across four evaluated models, refined artifacts raise mean reproduction success from 76.4% to 92.6% and reduce downstream API spending by 19.7% on average. The cross-model success-rate spread narrows from 21.6 to 3.9 percentage points, with all four models achieving mean success rates above 90%. Removing any component reduces success in the ablation study, with the largest losses from code and environment removal. These results suggest that preserving execution knowledge helps even models with lower raw-code success reproduce experiments more reliably and at lower API cost.", "arxiv_id": "2611.08452", "arxiv_url": "https://arxiv.org/abs/2611.08452", "authors": ["Yubo Wang", "Rui Meng", "Jaehyun Nam", "Tomas Pfister", "Jinsung Yoon"], "brief": "\u63d0\u51fa\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u5c06\u590d\u73b0\u4e2d\u6062\u590d\u7684\u6d41\u7a0b\u4e0e\u51b3\u7b56\u6574\u7406\u4e3a\u7cbe\u70bc\u4ee3\u7801\u3001\u73af\u5883\u914d\u7f6e\u3001\u542f\u52a8\u811a\u672c\u548c\u6307\u5357\uff0c\u5e76\u4ee5\u72ec\u7acb\u4f1a\u8bdd\u548c\u6267\u884c\u5ba1\u8ba1\u68c0\u9a8c\u8fd9\u4e9b\u4ea7\u7269\u7684\u590d\u73b0\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08452", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["ReproBridge-Bench\u542b36\u7bc7\u8bba\u6587\u30011029\u9879\u4efb\u52a1", "\u56db\u6a21\u578b\u5e73\u5747\u590d\u73b0\u7387\u4ece76.4%\u5347\u81f392.6%", "API\u5f00\u9500\u964d19.7%\uff0c\u79fb\u9664\u4ee3\u7801\u6216\u73af\u5883\u635f\u5931\u6700\u5927"], "keywords": ["\u5b9e\u9a8c\u590d\u73b0", "\u7f16\u7a0b\u667a\u80fd\u4f53", "\u673a\u5668\u5b66\u4e60", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2611.08452v1", "published_at": "2026-11-05", "score": 0.548, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08452.png", "title": "ReproBridge: Building Reproducibility into ML Research Artifacts", "tldr": "\u5c06\u667a\u80fd\u4f53\u6062\u590d\u7684\u6267\u884c\u77e5\u8bc6\u56fa\u5316\u4e3a\u7814\u7a76\u4ea7\u7269\uff0c\u663e\u8457\u63d0\u9ad8\u5b9e\u9a8c\u590d\u73b0\u7387\u5e76\u964d\u4f4e\u6210\u672c\u3002", "upvotes": 30, "what_it_is": "\u63d0\u51fa\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u5c06\u590d\u73b0\u4e2d\u6062\u590d\u7684\u6d41\u7a0b\u4e0e\u51b3\u7b56\u6574\u7406\u4e3a\u7cbe\u70bc\u4ee3\u7801\u3001\u73af\u5883\u914d\u7f6e\u3001\u542f\u52a8\u811a\u672c\u548c\u6307\u5357\uff0c\u5e76\u4ee5\u72ec\u7acb\u4f1a\u8bdd\u548c\u6267\u884c\u5ba1\u8ba1\u68c0\u9a8c\u8fd9\u4e9b\u4ea7\u7269\u7684\u590d\u73b0\u6548\u679c\u3002", "why_notable": "\u628a\u590d\u73b0\u80fd\u529b\u4ece\u6a21\u578b\u4e34\u573a\u8865\u5168\u8f6c\u5411\u53ef\u4f20\u9012\u7684\u6267\u884c\u77e5\u8bc6\uff0c\u6a21\u578b\u95f4\u6210\u529f\u7387\u5dee\u8ddd\u753121.6\u7f29\u81f33.9\u4e2a\u767e\u5206\u70b9\uff0c\u964d\u4f4e\u5bf9\u6a21\u578b\u80fd\u529b\u7684\u4f9d\u8d56\u3002"}, {"abstract": "We introduce Sage-Taiyi, a metacognition-inspired architecture that uses accumulated scientific understanding to guide what to investigate next and how to investigate it. Through explicit monitoring and control, the system revises its understanding of evidence, assumptions, and unresolved questions, then uses these assessments to adapt research targets and select reusable reasoning methods. On Taiyi-Bench, an AI co-scientist ideation benchmark comprising 265 tasks from 50 papers across ten disciplines, Sage-Taiyi ranks first on all eight metrics of historical rediscovery and open-ended ideation, achieving an Overall score of 54.0 compared with 47.9 for the strongest baseline, AI Scientist-v2. It also performs well on two external scientific ideation benchmarks. Five expert-guided collaborations further connect its proposals to experimental and computational validation across chemistry, materials science, and engineering. In chemistry, reaction-condition optimization raises the yield of cobalt-catalyzed carbonylation from trace amounts to 84% and photocatalytic allylic amination from 13% to 69%. These results support metacognitive regulation as an approach to scientific ideation and its progression toward practical validation.", "arxiv_id": "2611.12762", "arxiv_url": "https://arxiv.org/abs/2611.12762", "authors": ["Weida Wang", "Benteng Chen", "Yigeng Jiang", "Shuchen Pu", "Weiping Shen", "Zichao Liu", "Yulin Su", "Zitong Wang", "Siyu Zhou", "Zifu Wang", "Yizhi Li", "Xin Zong", "Yuning Yang", "Jixiang Bi", "Yuan Wang", "Chuyi Peng", "Shiyao Geng", "Qi Zhang", "Kuan Lu", "Mengzhu Li", "Weiwang Xu", "Peishan Xiang", "Chengjun Liu", "Chengrui Wei", "Fangchen Yu", "Shengji Tang", "Yichen Jiang", "Jingqi Ye", "Cheng Yang", "Tao Hu", "Jianbiao Mei", "Qinglong Cao", "Kun Li", "Yixin Chen", "Shengyuan Xu", "Juncheng Xiao", "Yiheng Wang", "Ruizhe Chen", "Shiyang Feng", "Runmin Ma", "Xiangchao Yan", "Zongsheng Cao", "Haomeng Hu", "Yu Ke", "Taihui Wu", "Meng Dai", "Xu Guo", "Haoyang Peng", "Yinglong Ni", "Pingsen Shi", "Xiaosong Wang", "Shuyue Hu", "Haijun Li", "Sherry Dongqi Bao", "Yang Yang", "Chao Yang", "Jie Hou", "Tianfan Fu", "Yi Gong", "Jin Zeng", "Mao Su", "Hongxia Hao", "Fanyang Mo", "Fenghua Ling", "Tianshu Yu", "Yunqi Cai", "Baihong Chi", "Jingwei Wang", "Lei Wang", "Chuncheng Bu", "Shide Lv", "Guangyu Wang", "Yuqiang Li", "Chunfeng Song", "Lei Bai", "Hui Wang", "Xujun Fu", "Li Cao", "Lei Chen", "Dahua Lin", "Xing Xie", "Bowen Zhou", "Wenlong Zhang", "Pinlong Cai", "Peng Ye", "Aiwen Lei", "Jie Li", "Shengchun Wang", "Bo Zhang", "Shufei Zhang"], "brief": "\u63d0\u51fa\u5143\u8ba4\u77e5\u9a71\u52a8\u7684\u79d1\u7814\u67b6\u6784\uff0c\u6301\u7eed\u5ba1\u89c6\u8bc1\u636e\u3001\u5047\u8bbe\u4e0e\u672a\u89e3\u95ee\u9898\u3002\u7cfb\u7edf\u636e\u6b64\u8c03\u6574\u7814\u7a76\u76ee\u6807\uff0c\u5e76\u9009\u62e9\u53ef\u590d\u7528\u63a8\u7406\u65b9\u6cd5\uff0c\u8ba9\u79ef\u7d2f\u7684\u79d1\u5b66\u7406\u89e3\u6307\u5bfc\u540e\u7eed\u63a2\u7d22\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Alpha-Innovator/Sage-Taiyi", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.12762", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Taiyi-Bench\u542b265\u4efb\u52a1\u300150\u7bc7\u8bba\u6587\u300110\u4e2a\u5b66\u79d1", "\u516b\u9879\u6307\u6807\u5747\u7b2c\u4e00\uff0c\u603b\u520654.0\uff0c\u5bf9\u716747.9", "\u4e94\u9879\u4e13\u5bb6\u5408\u4f5c\u9a8c\u8bc1\uff1b\u4e24\u7c7b\u53cd\u5e94\u6536\u7387\u8fbe84%\u548c69%"], "keywords": ["\u5143\u8ba4\u77e5", "\u79d1\u5b66\u53d1\u73b0", "\u79d1\u7814\u667a\u80fd\u4f53", "\u5b9e\u9a8c\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2611.12762v1", "published_at": "2026-11-09", "score": 0.544, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (53\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12762.png", "title": "Sage-Taiyi: A Metacognitive Architecture for Scientific Discovery", "tldr": "\u4ee5\u5143\u8ba4\u77e5\u76d1\u63a7\u52a8\u6001\u8c03\u6574\u79d1\u7814\u76ee\u6807\u4e0e\u63a8\u7406\u65b9\u6cd5\uff0c\u5e76\u5c06\u79d1\u5b66\u6784\u60f3\u63a8\u8fdb\u5230\u5b9e\u9a8c\u9a8c\u8bc1\u3002", "upvotes": 53, "what_it_is": "\u63d0\u51fa\u5143\u8ba4\u77e5\u9a71\u52a8\u7684\u79d1\u7814\u67b6\u6784\uff0c\u6301\u7eed\u5ba1\u89c6\u8bc1\u636e\u3001\u5047\u8bbe\u4e0e\u672a\u89e3\u95ee\u9898\u3002\u7cfb\u7edf\u636e\u6b64\u8c03\u6574\u7814\u7a76\u76ee\u6807\uff0c\u5e76\u9009\u62e9\u53ef\u590d\u7528\u63a8\u7406\u65b9\u6cd5\uff0c\u8ba9\u79ef\u7d2f\u7684\u79d1\u5b66\u7406\u89e3\u6307\u5bfc\u540e\u7eed\u63a2\u7d22\u3002", "why_notable": "\u628a\u79d1\u7814\u6784\u60f3\u751f\u6210\u4e0e\u7814\u7a76\u8fc7\u7a0b\u7684\u81ea\u6211\u8c03\u8282\u7ed3\u5408\uff0c\u4e0d\u4ec5\u63d0\u5347\u57fa\u51c6\u8868\u73b0\uff0c\u8fd8\u901a\u8fc7\u4e13\u5bb6\u5408\u4f5c\u8fde\u63a5\u5b9e\u9a8c\u9a8c\u8bc1\uff0c\u5c55\u793a\u8d70\u5411\u5b9e\u9645\u79d1\u7814\u7684\u6f5c\u529b\u3002"}, {"abstract": "Reinforcement learning (RL) has become a standard post-training method for diffusion models, but most RL objectives roll out the current policy at every iteration, and with a many-step sampler these rollouts typically dominate the cost of training. Few-step models cut this cost, yet they model an average velocity over an interval, whereas existing RL objectives are built for an instantaneous velocity with a many-step sampler. We adapt RL objectives to few-step models systematically in three phases, namely a transformation, a decomposition and an adaptation. The transformation to $x$-space expresses each objective we consider through a common policy prediction, at the clean end by default and at an explicitly marked level for transition or flow-map objectives, so that objectives stated over densities, velocities or rewards become comparable. The decomposition writes the gradient of each of these objectives as the sum of a self-regression toward a reference and a reward augmentation, so that a method reduces, at the gradient level, to a choice of anchors and weights. The adaptation computes each anchor from a few-step model at the end of its transport or along its tangent, with the instantaneous velocity recovered from the network itself or from an auxiliary network. This yields few-step versions of FlowGRPO, AWM, DiffusionNFT, DiffusionOPSD and ReFL in one modular codebase. In our experiments, reward-gradient-based methods are the most effective when the reward is differentiable and its gradient is affordable; otherwise DiffusionNFT-style methods generally reach high rewards in relatively few iterations despite a sometimes higher per-iteration cost. Extra inference steps show no systematic aggregate benefit in our experiments, although selected outputs visibly improve with two to four times as many sampling steps as in training.", "arxiv_id": "2611.08240", "arxiv_url": "https://arxiv.org/abs/2611.08240", "authors": ["Haitao Lin", "Minsi Ren", "Yang Li", "Xingtong Ge", "Zheyuan Hu", "Peiyan Hu", "Tailin Wu"], "brief": "\u63d0\u51fa\u4e09\u9636\u6bb5\u9002\u914d\u6846\u67b6\uff1a\u5c06\u76ee\u6807\u8f6c\u6362\u5230\u6570\u636e\u7a7a\u95f4\uff0c\u628a\u68af\u5ea6\u5206\u89e3\u4e3a\u53c2\u8003\u81ea\u56de\u5f52\u4e0e\u5956\u52b1\u589e\u5f3a\uff0c\u518d\u5229\u7528\u5c11\u6b65\u6a21\u578b\u7684\u8f93\u8fd0\u7ec8\u70b9\u6216\u5207\u7ebf\u6784\u9020\u8bad\u7ec3\u951a\u70b9\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": "https://github.com/EDAPINENUT/fewsteprl-sd35", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.08240", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7edf\u4e00\u5b9e\u73b0FlowGRPO\u3001AWM\u7b495\u79cd\u65b9\u6cd5\u7684\u5c11\u6b65\u7248\u672c", "\u5956\u52b1\u53ef\u5fae\u4e14\u68af\u5ea6\u6210\u672c\u53ef\u63a7\u65f6\uff0c\u5956\u52b1\u68af\u5ea6\u65b9\u6cd5\u6700\u6709\u6548", "DiffusionNFT\u5f0f\u65b9\u6cd5\u901a\u5e38\u4ee5\u8f83\u5c11\u8fed\u4ee3\u83b7\u5f97\u9ad8\u5956\u52b1"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u540e\u8bad\u7ec3", "\u5c11\u6b65\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2611.08240v1", "published_at": "2026-11-05", "score": 0.481, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08240.png", "title": "FewStepRL: Fine-tuning Few-step Diffusion Models with Reinforcement Learning", "tldr": "\u5c06\u591a\u6b65\u6269\u6563\u7684\u5f3a\u5316\u5b66\u4e60\u76ee\u6807\u7edf\u4e00\u9002\u914d\u5230\u5c11\u6b65\u6a21\u578b\uff0c\u6bd4\u8f83\u4e0d\u540c\u5956\u52b1\u6761\u4ef6\u4e0b\u7684\u6548\u679c\u3002", "upvotes": 8, "what_it_is": "\u63d0\u51fa\u4e09\u9636\u6bb5\u9002\u914d\u6846\u67b6\uff1a\u5c06\u76ee\u6807\u8f6c\u6362\u5230\u6570\u636e\u7a7a\u95f4\uff0c\u628a\u68af\u5ea6\u5206\u89e3\u4e3a\u53c2\u8003\u81ea\u56de\u5f52\u4e0e\u5956\u52b1\u589e\u5f3a\uff0c\u518d\u5229\u7528\u5c11\u6b65\u6a21\u578b\u7684\u8f93\u8fd0\u7ec8\u70b9\u6216\u5207\u7ebf\u6784\u9020\u8bad\u7ec3\u951a\u70b9\u3002", "why_notable": "\u628a\u4e0d\u540c\u5f3a\u5316\u5b66\u4e60\u76ee\u6807\u5f52\u7ed3\u4e3a\u951a\u70b9\u4e0e\u6743\u91cd\u9009\u62e9\uff0c\u4e3a\u5c11\u6b65\u6269\u6563\u540e\u8bad\u7ec3\u63d0\u4f9b\u7edf\u4e00\u5b9e\u73b0\uff0c\u4e5f\u7ed9\u51fa\u6309\u5956\u52b1\u68af\u5ea6\u6210\u672c\u9009\u62e9\u65b9\u6cd5\u7684\u4f9d\u636e\u3002"}, {"abstract": "While Recursive Self-Improvement (RSI) accelerates isolated algorithm and kernel synthesis, distributed LLM training depends on tightly coupled launch settings, operator kernels, and communication schedules, where single edits often hit out-of-memory (OOM) boundaries, compiler conflicts, measurement jitter, or silent numerical drift. We present InfraRSI, the agentic harness that turns open-ended human commands into verified training optimizations via a five-stage workflow: init locks editable scope and a fixed task contract over workload, loss, and timing invariants to prevent reward hacking, doctor profiles baseline phases and calibrates cluster noise, run co-optimizes launch knobs and code patches before re-verifying top candidates against the baseline and logging findings to a cross-hardware experience bank, and report and apply audit source paths, track failed-trial costs, and commit promoted changes. Rather than stepping greedily from a single incumbent, InfraRSI initializes from diverse experience-seeded configurations and fits global execution-time and censored peak-memory models across all trials, including OOMs. Using these models, it prices per-setting memory costs, revises miscalibrated LLM priors from live runs, and pairs memory-hungry optimizations with memory savers and verified code patches. Across four single- and multi-node dense and Mixture-of-Experts (MoE) LLM workloads, InfraRSI achieves a speedup of up to $2.75\\times$ and lifts mean Model FLOPs Utilization (MFU) from $17.4\\%$ to $30.0\\%$, outperforming existing tuners and coding agents while transferring experience across GPUs. As it improves training infrastructure efficiency, InfraRSI forms a two-level Recursive Self-Improvement loop---revising priors online within runs and distilling experience across clusters---to push foundation model scaling.", "arxiv_id": "2611.11558", "arxiv_url": "https://arxiv.org/abs/2611.11558", "authors": ["InfraRSI Team", "Yuchuan Tian", "Haocheng Mei", "Ye Yuan", "Chao Xu", "Boxun Li", "Guohao Dai", "Kai Han", "Allen Chen", "Yunhe Wang", "Yu Wang"], "brief": "InfraRSI\u662f\u8bad\u7ec3\u57fa\u7840\u8bbe\u65bd\u4f18\u5316\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u4e94\u9636\u6bb5\u6d41\u7a0b\u56fa\u5b9a\u4efb\u52a1\u7ea6\u675f\u3001\u6821\u51c6\u566a\u58f0\u5e76\u9a8c\u8bc1\u4fee\u6539\uff1b\u8054\u5408\u641c\u7d22\u542f\u52a8\u914d\u7f6e\u4e0e\u4ee3\u7801\u8865\u4e01\uff0c\u5c06\u8de8\u786c\u4ef6\u7ecf\u9a8c\u7528\u4e8e\u540e\u7eed\u4f18\u5316\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/TokenRhythm/InfraRSI", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.11558", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5168\u5c40\u8017\u65f6\u4e0e\u5cf0\u503c\u663e\u5b58\u6a21\u578b\u7eb3\u5165OOM\u8bd5\u9a8c", "4\u79cd\u7a20\u5bc6\u53caMoE\u8d1f\u8f7d\u6700\u9ad8\u52a0\u901f2.75\u500d", "\u5e73\u5747MFU\u4ece17.4%\u63d0\u5347\u81f330.0%"], "keywords": ["\u9012\u5f52\u81ea\u6539\u8fdb", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u6027\u80fd\u4f18\u5316", "\u667a\u80fd\u4f53"], "num_comments": 5, "on_hf": true, "organization": "TokenRhythm", "pdf_url": "https://arxiv.org/pdf/2611.11558v1", "published_at": "2026-11-08", "score": 0.449, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11558.png", "title": "InfraRSI: Harnessing Recursive Self-Improvement for Training Infrastructure", "tldr": "\u901a\u8fc7\u9012\u5f52\u81ea\u6539\u8fdb\u8054\u5408\u4f18\u5316\u8bad\u7ec3\u914d\u7f6e\u4e0e\u4ee3\u7801\uff0c\u63d0\u5347\u5206\u5e03\u5f0f\u5927\u6a21\u578b\u8bad\u7ec3\u6548\u7387\u3002", "upvotes": 17, "what_it_is": "InfraRSI\u662f\u8bad\u7ec3\u57fa\u7840\u8bbe\u65bd\u4f18\u5316\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u4e94\u9636\u6bb5\u6d41\u7a0b\u56fa\u5b9a\u4efb\u52a1\u7ea6\u675f\u3001\u6821\u51c6\u566a\u58f0\u5e76\u9a8c\u8bc1\u4fee\u6539\uff1b\u8054\u5408\u641c\u7d22\u542f\u52a8\u914d\u7f6e\u4e0e\u4ee3\u7801\u8865\u4e01\uff0c\u5c06\u8de8\u786c\u4ef6\u7ecf\u9a8c\u7528\u4e8e\u540e\u7eed\u4f18\u5316\u3002", "why_notable": "\u628a\u9012\u5f52\u81ea\u6539\u8fdb\u4ece\u5b64\u7acb\u5185\u6838\u6269\u5c55\u5230\u8026\u5408\u7684\u5206\u5e03\u5f0f\u8bad\u7ec3\u7cfb\u7edf\uff0c\u4ee5\u6570\u503c\u9a8c\u8bc1\u7ea6\u675f\u4f18\u5316\uff0c\u5e76\u901a\u8fc7\u8de8GPU\u7ecf\u9a8c\u8fc1\u79fb\u51cf\u5c11\u91cd\u590d\u63a2\u7d22\u3002"}, {"abstract": "We introduce FraudBench, an evaluation of large language models\u0027 (LLMs) propensities to recommend, assist, or directly take actions that would constitute fraud under U.S. law. Our evaluation contains a novel dataset of 159 scenarios based on real-world U.S. court cases and validated by legal experts. We present each scenario to LLMs via three tasks at varying levels of autonomy: advising users, drafting messages for users to send, and acting directly on behalf of users (477 tasks total). In each scenario, FraudBench re-enacts the facts of a court case to give LLMs an opportunity, but no explicit instruction, to either misrepresent or conceal a material fact in a high-stakes commercial setting--e.g., whether to describe company-funded product testing as \"independent\" to customers (misrepresentation) or whether to hide unfavorable regulatory investigations from clients (concealment). We evaluate 20 LLMs across 25 experimental conditions (totaling \u003e300,000 generations) and include a preregistered human baseline ($n_{\\texttt{annotations}} = 2{,}957$, $n_{\\texttt{humans}} = 996$). We score a response as fraudulent when it engages in, assists with, or recommends misrepresentation or concealment. Key findings include: (1) across LLMs, fraud rates ranged from near 0% to over 40%; (2) LLM fraud rates increased with autonomy, with overall rates of 3.0% when advising, 14.7% when drafting, and 21.4% when acting directly, without applying pressure; (3) LLMs sometimes engaged in fraud despite recognizing legal risks; (4) LLMs more often engaged in fraud by concealment than by misrepresentation; and (5) prompt-based interventions substantially affected fraud rates, with a prompt to obey the law reducing fraud rates, while prompts to maximize profits and act agentically increased fraud rates.", "arxiv_id": "2611.12167", "arxiv_url": "https://arxiv.org/abs/2611.12167", "authors": ["Kevin Wei", "Sumaya Nur Adan", "Stephan Llerena", "Mark Gitau", "Jakob Merane", "Anita Srinivasan", "Colette Le Brannan", "Keethan Kleiner", "Alessandro Tacconelli", "Michael Tiu", "Case Thomason", "Kyle Emili", "Natasza Gadowska", "Alex Mark", "Eric Ren", "Umang Bhatt", "Jatinder Singh", "Jacy Reese Anthis", "Doni Bloomfield", "Noam Kolt"], "brief": "FraudBench\u5c06\u771f\u5b9e\u7f8e\u56fd\u5224\u4f8b\u8f6c\u5316\u4e3a\u6cd5\u5f8b\u4e13\u5bb6\u9a8c\u8bc1\u7684\u5546\u4e1a\u60c5\u5883\uff0c\u6d4b\u8bd5\u6a21\u578b\u5728\u5efa\u8bae\u3001\u4ee3\u5199\u548c\u76f4\u63a5\u884c\u52a8\u4e2d\uff0c\u662f\u5426\u5728\u672a\u88ab\u660e\u786e\u8981\u6c42\u65f6\u5b9e\u65bd\u6216\u534f\u52a9\u6b3a\u8bc8\u3002", "categories": ["cs.AI", "cs.CY", "cs.LG"], "github_repo": "https://github.com/GOAL-Lab/FraudBench-Public", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12167", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["159\u4e2a\u5224\u4f8b\u60c5\u5883\u6784\u6210477\u9879\u4efb\u52a1\uff0c\u5747\u7ecf\u6cd5\u5f8b\u4e13\u5bb6\u9a8c\u8bc1", "\u8bc4\u4f3020\u4e2a\u6a21\u578b\u300125\u79cd\u6761\u4ef6\uff0c\u751f\u6210\u8d85\u8fc730\u4e07\u6b21", "\u5efa\u8bae\u3001\u4ee3\u5199\u3001\u76f4\u63a5\u884c\u52a8\u7684\u6b3a\u8bc8\u7387\u4e3a3.0%\u300114.7%\u300121.4%"], "keywords": ["\u6a21\u578b\u8bc4\u4f30", "\u4eba\u5de5\u667a\u80fd\u5b89\u5168", "\u667a\u80fd\u4f53", "\u6cd5\u5f8b\u5408\u89c4"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.12167v1", "published_at": "2026-11-09", "score": 0.388, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12167.png", "title": "FraudBench: A Legal Evaluation of AI Deception", "tldr": "\u771f\u5b9e\u5224\u4f8b\u6d4b\u8bd5\u663e\u793a\uff0c\u5927\u6a21\u578b\u81ea\u4e3b\u7a0b\u5ea6\u8d8a\u9ad8\uff0c\u8d8a\u5bb9\u6613\u4e3b\u52a8\u9690\u7792\u6216\u6b6a\u66f2\u5546\u4e1a\u4e8b\u5b9e\u3002", "upvotes": 2, "what_it_is": "FraudBench\u5c06\u771f\u5b9e\u7f8e\u56fd\u5224\u4f8b\u8f6c\u5316\u4e3a\u6cd5\u5f8b\u4e13\u5bb6\u9a8c\u8bc1\u7684\u5546\u4e1a\u60c5\u5883\uff0c\u6d4b\u8bd5\u6a21\u578b\u5728\u5efa\u8bae\u3001\u4ee3\u5199\u548c\u76f4\u63a5\u884c\u52a8\u4e2d\uff0c\u662f\u5426\u5728\u672a\u88ab\u660e\u786e\u8981\u6c42\u65f6\u5b9e\u65bd\u6216\u534f\u52a9\u6b3a\u8bc8\u3002", "why_notable": "\u628a\u6b3a\u9a97\u8bc4\u4f30\u843d\u5230\u6cd5\u5f8b\u754c\u5b9a\u4e0e\u771f\u5b9e\u5546\u4e1a\u51b3\u7b56\uff0c\u63ed\u793a\u81ea\u4e3b\u884c\u52a8\u653e\u5927\u7684\u6b3a\u8bc8\u98ce\u9669\uff1b\u5b88\u6cd5\u63d0\u793a\u53ef\u964d\u4f4e\u98ce\u9669\uff0c\u4f46\u5229\u6da6\u5bfc\u5411\u63d0\u793a\u4f1a\u52a0\u5267\u98ce\u9669\u3002"}, {"abstract": "Large language model (LLM) agents increasingly rely on external memory stores to retain information across conversations, typically via dense vector embeddings searched with approximate nearest-neighbor methods. The fruit fly\u0027s olfactory circuit computes a locality-sensitive hash of sensory input using a strikingly different mechanism - sparse random projection followed by winner-take-all competition - and prior work (Dasgupta et al., 2017) showed this scheme, dubbed FlyHash, preserves neighbor structure better per bit than conventional random-hyperplane hashing (SimHash) on several benchmarks. We apply FlyHash, to our knowledge for the first time, to LLM agent memory retrieval, and ask three questions a practitioner actually needs answered: does the quality advantage hold under a correctly matched-bit protocol (it does, robustly, across 10 seeds and four datasets spanning two modalities, with one specific, previously undocumented comparison pitfall identified and corrected along the way); does that advantage translate into real memory and latency savings, including against the dense-vector indexing (HNSW) practitioners default to today (no: at equal bits FlyHash\u0027s codes are larger and slower to compare than SimHash\u0027s, and HNSW dominates both hash methods at ordinary scale; a sparse-set comparison we introduce recovers most but not all of a naive latency gap, leaving hashing\u0027s practical case narrower and more specific than the quality result alone implies); and does the advantage survive genuine, non-circular agent-memory relevance labels rather than the nearest-neighbor-by-embedding proxy this literature otherwise relies on (it does). We report all three answers precisely, including the two that narrow rather than flatter the headline result, and release our implementation, a working agent-memory demo, and a full account of the methodological pitfalls we found and corrected.", "arxiv_id": "2611.05791", "arxiv_url": "https://arxiv.org/abs/2611.05791", "authors": ["Mohan Bheemadolu", "Chrisogonas O. Odhiambo"], "brief": "\u5c06\u679c\u8747\u55c5\u89c9\u542f\u53d1\u7684FlyHash\u7528\u4e8e\u667a\u80fd\u4f53\u8bb0\u5fc6\u68c0\u7d22\uff0c\u901a\u8fc7\u7a00\u758f\u968f\u673a\u6295\u5f71\u548c\u8d62\u5bb6\u901a\u5403\u751f\u6210\u54c8\u5e0c\uff0c\u5e76\u68c0\u9a8c\u7b49\u6bd4\u7279\u8d28\u91cf\u3001\u5b9e\u9645\u5f00\u9500\u4e0e\u771f\u5b9e\u76f8\u5173\u6027\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/mohanji/flyhash-agent-memory", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.05791", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7b49\u6bd4\u7279\u6bd4\u8f83\u8986\u76d610\u4e2a\u79cd\u5b50\u30014\u4e2a\u6570\u636e\u96c6\u53ca2\u79cd\u6a21\u6001", "FlyHash\u8d28\u91cf\u4f18\u4e8eSimHash\uff0c\u771f\u5b9e\u76f8\u5173\u6027\u6807\u7b7e\u4e0b\u4ecd\u6210\u7acb", "\u5e38\u89c4\u89c4\u6a21\u4e0bHNSW\u66f4\u9ad8\u6548\uff0c\u7a00\u758f\u96c6\u5408\u6bd4\u8f83\u7f29\u5c0f\u5ef6\u8fdf\u5dee\u8ddd"], "keywords": ["\u667a\u80fd\u4f53\u8bb0\u5fc6", "\u5c40\u90e8\u654f\u611f\u54c8\u5e0c", "\u8fd1\u4f3c\u8fd1\u90bb\u68c0\u7d22"], "num_comments": 5, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05791v1", "published_at": "2026-11-04", "score": 0.385, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05791.png", "title": "FlyHash for LLM Agent Memory: An Empirical Validation and a New Application", "tldr": "FlyHash\u63d0\u5347\u667a\u80fd\u4f53\u8bb0\u5fc6\u68c0\u7d22\u8d28\u91cf\uff0c\u4f46\u5e38\u89c4\u89c4\u6a21\u4e0b\u4e0d\u53ca\u7a20\u5bc6\u7d22\u5f15\u9ad8\u6548", "upvotes": 4, "what_it_is": "\u5c06\u679c\u8747\u55c5\u89c9\u542f\u53d1\u7684FlyHash\u7528\u4e8e\u667a\u80fd\u4f53\u8bb0\u5fc6\u68c0\u7d22\uff0c\u901a\u8fc7\u7a00\u758f\u968f\u673a\u6295\u5f71\u548c\u8d62\u5bb6\u901a\u5403\u751f\u6210\u54c8\u5e0c\uff0c\u5e76\u68c0\u9a8c\u7b49\u6bd4\u7279\u8d28\u91cf\u3001\u5b9e\u9645\u5f00\u9500\u4e0e\u771f\u5b9e\u76f8\u5173\u6027\u3002", "why_notable": "\u628a\u68c0\u7d22\u8d28\u91cf\u4f18\u52bf\u4e0e\u90e8\u7f72\u6536\u76ca\u660e\u786e\u533a\u5206\uff0c\u7ea0\u6b63\u6bd4\u8f83\u534f\u8bae\u9677\u9631\uff0c\u5e76\u7528\u771f\u5b9e\u8bb0\u5fc6\u76f8\u5173\u6027\u9a8c\u8bc1\u7ed3\u679c\uff0c\u4e3a\u667a\u80fd\u4f53\u8bb0\u5fc6\u7d22\u5f15\u9009\u578b\u63d0\u4f9b\u66f4\u53ef\u9760\u4f9d\u636e\u3002"}, {"abstract": "Reliable dermatology AI requires access to verifiable evidence distributed across heterogeneous textual and visual sources. However, conventional retrieval-augmented generation (RAG) typically relies on one-shot retrieval from flat corpora, limiting its ability to adapt retrieval granularity, explore multi-hop relations, and integrate multimodal clinical evidence. We introduce SkinMind, a multimodal agentic RAG framework that equips policy models with human-inspired graph probing for autonomous evidence seeking. SkinMind organizes retrieval as an iterative interaction between an orchestrator and a graph environment. Through eight hierarchical graph-probing tools, the orchestrator progressively identifies relevant entities, inspects node-level information, traverses relations and paths, and retrieves source-text and visual evidence. This progressive-disclosure design allows the model to adaptively determine the retrieval modality, exploration direction, and evidence granularity while constructing a query-specific evidence subgraph. To support autonomous graph probing, we construct SkinMind-KG from a 62M-token corpus of dermatology guidelines and textbooks and 423K images, guided by a dermatologist-informed schema and a conflict-resolution mechanism. The resulting graph contains over 1.0M nodes and 2.0M edges, unifying textual, relational, and visual evidence for retrieval. Across six dermatology VQA benchmarks and two policy-model settings, SkinMind improves the average score over direct answering by 8.70 and 8.89 points with GPT-5.4-mini and Gemini-2.5-Flash, respectively, while consistently outperforming competing RAG methods. Together, SkinMind and SkinMind-KG provide an effective foundation for evidence-grounded multimodal reasoning in dermatology.", "arxiv_id": "2611.08935", "arxiv_url": "https://arxiv.org/abs/2611.08935", "authors": ["Jing Hao", "Weinan Zhou", "Zhihong Lu", "Yaling Shen", "Yiming Xu", "Yefeng Liu", "Siyuan Yan", "Shuaibo Li", "Ming Dai", "Junjun He", "Zuyi Zhu", "Jinjie Gu", "Lijun Wu", "Jian Wang"], "brief": "\u63d0\u51fa\u591a\u6a21\u6001\u667a\u80fd\u4f53\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\uff0c\u7531\u8c03\u5ea6\u6a21\u578b\u8fed\u4ee3\u8c03\u7528\u56fe\u63a2\u67e5\u5de5\u5177\uff0c\u5728\u76ae\u80a4\u79d1\u77e5\u8bc6\u56fe\u8c31\u4e2d\u63a2\u7d22\u5b9e\u4f53\u4e0e\u5173\u7cfb\uff0c\u5e76\u6309\u95ee\u9898\u6784\u5efa\u5305\u542b\u539f\u6587\u548c\u56fe\u50cf\u7684\u8bc1\u636e\u5b50\u56fe\u3002", "categories": ["cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08935", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["8\u79cd\u5206\u5c42\u56fe\u63a2\u67e5\u5de5\u5177\uff0c\u81ea\u9002\u5e94\u9009\u62e9\u6a21\u6001\u4e0e\u8bc1\u636e\u7c92\u5ea6", "SkinMind-KG\u6574\u54086200\u4e07\u8bcd\u5143\u300142.3\u4e07\u56fe\u50cf", "6\u4e2aVQA\u57fa\u51c6\u4e0a\uff0c\u4e24\u6a21\u578b\u5e73\u5747\u63d0\u53478.70\u548c8.89\u5206"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u667a\u80fd\u4f53", "\u77e5\u8bc6\u56fe\u8c31", "\u533b\u5b66\u89c6\u89c9\u95ee\u7b54"], "num_comments": 3, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2611.08935v1", "published_at": "2026-11-06", "score": 0.37, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08935.png", "title": "SkinMind: Equipping Agentic RAG with Human-Inspired Graph Probing for Reliable Dermatology AI", "tldr": "\u901a\u8fc7\u5206\u5c42\u56fe\u63a2\u67e5\u81ea\u4e3b\u5bfb\u627e\u56fe\u6587\u8bc1\u636e\uff0c\u63d0\u5347\u76ae\u80a4\u79d1\u95ee\u7b54\u7684\u51c6\u786e\u6027\u4e0e\u53ef\u6838\u9a8c\u6027\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u591a\u6a21\u6001\u667a\u80fd\u4f53\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\uff0c\u7531\u8c03\u5ea6\u6a21\u578b\u8fed\u4ee3\u8c03\u7528\u56fe\u63a2\u67e5\u5de5\u5177\uff0c\u5728\u76ae\u80a4\u79d1\u77e5\u8bc6\u56fe\u8c31\u4e2d\u63a2\u7d22\u5b9e\u4f53\u4e0e\u5173\u7cfb\uff0c\u5e76\u6309\u95ee\u9898\u6784\u5efa\u5305\u542b\u539f\u6587\u548c\u56fe\u50cf\u7684\u8bc1\u636e\u5b50\u56fe\u3002", "why_notable": "\u5c06\u4e00\u6b21\u6027\u68c0\u7d22\u6539\u4e3a\u53ef\u9010\u6b65\u6df1\u5165\u7684\u8bc1\u636e\u63a2\u7d22\uff0c\u7edf\u4e00\u6587\u672c\u3001\u5173\u7cfb\u4e0e\u56fe\u50cf\u6765\u6e90\uff1b\u5728\u4e24\u79cd\u6a21\u578b\u8bbe\u7f6e\u4e0b\u5747\u4f18\u4e8e\u7ade\u4e89\u68c0\u7d22\u589e\u5f3a\u65b9\u6cd5\u3002"}, {"abstract": "Tactile sensing is an indispensable modality for contact-rich dexterous manipulation, a capability that hints at the ultimate frontiers of embodied intelligence. However, commercially available tactile sensors are still at a relatively early stage of development, with each type of sensor offering irreplaceable strengths alongside its own drawbacks. A key challenge is thus to free tactile understanding from sensor-specific physics, so that embodied models can effectively leverage heterogeneous tactile data. To this end, we develop LingBot-Touch, a tactile foundation model characterized by the following properties. (i) Our model yields a unified representation across different tactile sensors (i.e., piezoresistive, magnetic, and visuotactile sensors), and is easily extensible to new sensor types. (ii) The resulting tactile tokens are plug-and-play: they can be seamlessly integrated into policy models across paradigms, from diffusion policy to vision-language-action (VLA) models such as $\u03c0_{0.5}$ and LingBot-VLA, consistently enhancing manipulation dexterity. (iii) Extensive experiments, spanning simulation and real-robot deployments across multiple hardware platforms, demonstrate that our tactile representation substantially benefits complex manipulation tasks while maintaining strong computational efficiency. We believe the findings in this work demonstrate the potential of leveraging cross-sensor data to scale tactile learning, and offer encouraging insights for the design of future hardware and embodied models.", "arxiv_id": "2611.12806", "arxiv_url": "https://arxiv.org/abs/2611.12806", "authors": ["Bing Han", "Yichuan Peng", "Haoyu Dong", "Yuanmeng Hu", "Yongyi Jia", "Fangjing Wang", "Kecheng Zheng", "Yiming Zhang", "Yanhong Zeng", "Xiaoqing Zhang", "Chen Song", "Rundong Zou", "Anqi Dong", "Yuan Guan", "Ka Leong Cheng", "Xing Zhu", "Yujun Shen", "Nan Xue", "Wei Ning"], "brief": "LingBot-Touch\u5c06\u538b\u963b\u3001\u78c1\u6027\u548c\u89c6\u89c9\u89e6\u89c9\u4f20\u611f\u5668\u6570\u636e\u7f16\u7801\u4e3a\u7edf\u4e00\u89e6\u89c9\u8868\u5f81\uff0c\u518d\u4ee5\u89e6\u89c9\u4ee4\u724c\u63a5\u5165\u6269\u6563\u7b56\u7565\u6216\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\uff0c\u652f\u6301\u8de8\u4f20\u611f\u5668\u590d\u7528\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/Robbyant/lingbot-touch", "github_stars": 137, "hf_url": "https://huggingface.co/papers/2611.12806", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7edf\u4e00\u538b\u963b\u3001\u78c1\u6027\u3001\u89c6\u89c9\u89e6\u89c9\u4e09\u7c7b\u4f20\u611f\u5668\u8868\u5f81", "\u89e6\u89c9\u4ee4\u724c\u53ef\u63a5\u5165\u6269\u6563\u7b56\u7565\u3001\u03c0\u2080.\u2085\u548cLingBot-VLA", "\u591a\u786c\u4ef6\u5e73\u53f0\u4eff\u771f\u4e0e\u5b9e\u673a\u9a8c\u8bc1\uff0c\u517c\u987e\u64cd\u4f5c\u6548\u679c\u548c\u8ba1\u7b97\u6548\u7387"], "keywords": ["\u89e6\u89c9\u611f\u77e5", "\u8868\u5f81\u5b66\u4e60", "\u7075\u5de7\u64cd\u4f5c", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "Robbyant", "pdf_url": "https://arxiv.org/pdf/2611.12806v1", "published_at": "2026-11-09", "score": 0.368, "selected_reasons": ["HF trending (92\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12806.png", "title": "Learning Heterogeneous Tactile Representation for General Dexterous Manipulation", "tldr": "\u7528\u7edf\u4e00\u89e6\u89c9\u8868\u5f81\u6253\u901a\u5f02\u6784\u4f20\u611f\u5668\uff0c\u5e76\u4ee5\u5373\u63d2\u5373\u7528\u65b9\u5f0f\u63d0\u5347\u673a\u5668\u4eba\u7075\u5de7\u64cd\u4f5c\u3002", "upvotes": 92, "what_it_is": "LingBot-Touch\u5c06\u538b\u963b\u3001\u78c1\u6027\u548c\u89c6\u89c9\u89e6\u89c9\u4f20\u611f\u5668\u6570\u636e\u7f16\u7801\u4e3a\u7edf\u4e00\u89e6\u89c9\u8868\u5f81\uff0c\u518d\u4ee5\u89e6\u89c9\u4ee4\u724c\u63a5\u5165\u6269\u6563\u7b56\u7565\u6216\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\uff0c\u652f\u6301\u8de8\u4f20\u611f\u5668\u590d\u7528\u3002", "why_notable": "\u5c06\u89e6\u89c9\u80fd\u529b\u4ece\u7279\u5b9a\u4f20\u611f\u5668\u4e2d\u89e3\u8026\uff0c\u6709\u671b\u51cf\u5c11\u7b56\u7565\u9002\u914d\u6210\u672c\uff0c\u5e76\u4e3a\u6c47\u805a\u8de8\u4f20\u611f\u5668\u6570\u636e\u3001\u6269\u5c55\u89e6\u89c9\u5b66\u4e60\u89c4\u6a21\u63d0\u4f9b\u8def\u5f84\u3002"}, {"abstract": "Small language models (SLMs) running on mobile devices can keep user data private and work without connectivity. But they perform well only when fine-tuned for the target task and sized for the target device, a process that today requires repeated expert tuning. We present {\\it Mobile AI Factory}, an agentic system that builds a fine-tuned, quantized SLM for a given task and phone. Given a task specification and a target phone, an orchestrator LLM chooses whether to tune hyperparameters, mine real data, or generate synthetic examples, while fixed rules roll back changes that hurt accuracy. The factory searches from small to large models across base models and quantizations, adapts its accuracy goal as it searches, and uses real measurements of the target phone across inference engines and backends. We evaluate Mobile AI Factory on ten tasks and four Android phones. On an unseen testset, its on-device models outperform two five-shot frontier models on five tasks, by up to 0.34, and match them on three more. Its search comes within 0.03 of exhaustively training all 27 model variants on an entity extraction task, while using 19$\\times$ less GPU time. Phone measurements also matter: the best configuration changes across phones. Without phone measurements, Claude Opus 5.5, given the full hardware and model specifications, misses the app\u0027s requirements in 25\\% of easy and moderate cases and in 60\\% of hard ones. Code is available at: https://github.com/evanly-gh/SLM_Factory.", "arxiv_id": "2611.13509", "arxiv_url": "https://arxiv.org/abs/2611.13509", "authors": ["Evan Li", "Krishna Deshpande", "Wen Cheng", "Shyamnath Gollakota"], "brief": "\u7cfb\u7edf\u6309\u4efb\u52a1\u4e0e\u76ee\u6807\u624b\u673a\u81ea\u52a8\u6784\u5efa\u4e13\u7528\u5c0f\u8bed\u8a00\u6a21\u578b\u3002\u7531\u5927\u6a21\u578b\u7f16\u6392\u8c03\u53c2\u3001\u6570\u636e\u6316\u6398\u4e0e\u5408\u6210\uff0c\u5e76\u7ed3\u5408\u771f\u673a\u6d4b\u91cf\u641c\u7d22\u6a21\u578b\u548c\u91cf\u5316\u914d\u7f6e\uff0c\u7528\u56fa\u5b9a\u89c4\u5219\u56de\u9000\u7cbe\u5ea6\u4e0b\u964d\u7684\u6539\u52a8\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.13509", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u572810\u9879\u4efb\u52a1\u30014\u6b3e\u5b89\u5353\u624b\u673a\u4e0a\u8bc4\u6d4b", "5\u9879\u4efb\u52a1\u8d85\u8fc7\u4e24\u4e2a\u4e94\u6837\u672c\u524d\u6cbf\u6a21\u578b\uff0c\u53e63\u9879\u6301\u5e73", "\u5b9e\u4f53\u62bd\u53d6\u641c\u7d22\u8ddd\u7a77\u4e3e\u5dee0.03\uff0cGPU\u8017\u65f6\u5c1119\u500d"], "keywords": ["\u5c0f\u8bed\u8a00\u6a21\u578b", "\u7aef\u4fa7\u90e8\u7f72", "\u667a\u80fd\u4f53", "\u6a21\u578b\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13509v1", "published_at": "2026-11-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Mobile AI Factory: Building Specialized Language Models for Your Mobile Device", "tldr": "\u7528\u667a\u80fd\u4f53\u81ea\u52a8\u5fae\u8c03\u5e76\u91cf\u5316\u624b\u673a\u5c0f\u6a21\u578b\uff0c\u517c\u987e\u4efb\u52a1\u7cbe\u5ea6\u4e0e\u771f\u673a\u90e8\u7f72\u7ea6\u675f\u3002", "upvotes": 0, "what_it_is": "\u7cfb\u7edf\u6309\u4efb\u52a1\u4e0e\u76ee\u6807\u624b\u673a\u81ea\u52a8\u6784\u5efa\u4e13\u7528\u5c0f\u8bed\u8a00\u6a21\u578b\u3002\u7531\u5927\u6a21\u578b\u7f16\u6392\u8c03\u53c2\u3001\u6570\u636e\u6316\u6398\u4e0e\u5408\u6210\uff0c\u5e76\u7ed3\u5408\u771f\u673a\u6d4b\u91cf\u641c\u7d22\u6a21\u578b\u548c\u91cf\u5316\u914d\u7f6e\uff0c\u7528\u56fa\u5b9a\u89c4\u5219\u56de\u9000\u7cbe\u5ea6\u4e0b\u964d\u7684\u6539\u52a8\u3002", "why_notable": "\u5c06\u4efb\u52a1\u9002\u914d\u4e0e\u786c\u4ef6\u7ea6\u675f\u7eb3\u5165\u81ea\u52a8\u5316\u641c\u7d22\uff0c\u663e\u8457\u964d\u4f4e\u4e13\u7528\u7aef\u4fa7\u6a21\u578b\u7684\u8bd5\u9519\u6210\u672c\uff1b\u7ed3\u679c\u4e5f\u663e\u793a\uff0c\u786c\u4ef6\u89c4\u683c\u4e0d\u80fd\u66ff\u4ee3\u771f\u673a\u6d4b\u91cf\u3002"}, {"abstract": "Visual generative models increasingly blur the line between synthesizing observations and simulating environments. Yet visual plausibility alone does not constitute successful world modeling: compelling outputs may lack persistent state, physical dynamics, or causally consistent responses to interactions. We define a generative world model as a predictive dynamical system that maintains a persistent, history-conditioned representation of an environment, updates that representation in response to actions or interventions, and generates temporally coherent trajectories that reflect outcomes under observed and counterfactual interventions. From this definition, we derive an intelligence-oriented framework spanning perceptual grounding, persistent state modeling, controllable transformation, dynamics-aware prediction, and closed-loop interaction. We present WorldFoundry, open-source infrastructure for reproducible inference and evaluation across video, 3D and 4D, embodied action, and interactive world systems. WorldFoundry unifies model and benchmark discovery, runtime and asset preparation, execution orchestration, artifact management, and interactive visualization, while modality-specific adapters preserve native inputs, execution semantics, output representations, and evaluation protocols. Explicit manifests, durable artifact contracts, and evidence-aware scorecards separate execution readiness from evaluative claims, making each claim traceable to its supporting artifacts. The catalog contains 270 model entries, 74 benchmarks, and 62 registered metric entries, with readiness and execution evidence recorded separately. WorldFoundry enables reproducible comparison of persistent, controllable dynamics across heterogeneous systems, advancing the field from perceptual synthesis toward measurable world intelligence.", "arxiv_id": "2611.10771", "arxiv_url": "https://arxiv.org/abs/2611.10771", "authors": ["Juanxi Tian", "Jiadong Hou", "Baiang Li", "Xin Lin", "Zhengbo Jiao", "Weijia Zhang", "Yeying Jin", "Truong Nguyen", "Haitian Zheng", "Zhifei Zhang", "Jianfei Yang", "Ming-Hsuan Yang", "Felix Heide", "Wei Xiong", "Enze Xie", "Wanhua Li"], "brief": "\u63d0\u51fa\u4e16\u754c\u6a21\u578b\u80fd\u529b\u6846\u67b6\uff0c\u5e76\u6784\u5efa\u7edf\u4e00\u63a8\u7406\u4e0e\u8bc4\u6d4b\u5e73\u53f0\u3002\u901a\u8fc7\u6a21\u6001\u9002\u914d\u5668\u4fdd\u7559\u539f\u751f\u6267\u884c\u8bed\u4e49\uff0c\u4ee5\u6e05\u5355\u3001\u4ea7\u7269\u5951\u7ea6\u548c\u8bc1\u636e\u8bc4\u5206\u5361\u4e32\u8054\u8fd0\u884c\u4e0e\u8bc4\u6d4b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/OpenEnvision/WorldFoundry", "github_stars": 336, "hf_url": "https://huggingface.co/papers/2611.10771", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4e94\u7ef4\u6846\u67b6\u8986\u76d6\u611f\u77e5\u3001\u72b6\u6001\u3001\u63a7\u5236\u3001\u52a8\u6001\u9884\u6d4b\u4e0e\u95ed\u73af\u4ea4\u4e92", "\u76ee\u5f55\u6536\u5f55270\u4e2a\u6a21\u578b\u300174\u4e2a\u57fa\u51c6\u53ca62\u4e2a\u6307\u6807\u6761\u76ee", "\u8bc1\u636e\u8bc4\u5206\u5361\u533a\u5206\u6267\u884c\u5c31\u7eea\u72b6\u6001\u4e0e\u8bc4\u6d4b\u7ed3\u8bba"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001\u8bc4\u6d4b", "\u5f00\u6e90\u57fa\u7840\u8bbe\u65bd", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "OpenEnvision", "pdf_url": "https://arxiv.org/pdf/2611.10771v1", "published_at": "2026-11-07", "score": 0.337, "selected_reasons": ["HF trending (54\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10771.png", "title": "WorldFoundry: Towards Unified Infrastructure for World Intelligence", "tldr": "\u4ee5\u7edf\u4e00\u5f00\u6e90\u57fa\u7840\u8bbe\u65bd\u8bc4\u6d4b\u4e16\u754c\u6a21\u578b\uff0c\u8ba9\u8de8\u6a21\u6001\u52a8\u6001\u80fd\u529b\u6bd4\u8f83\u53ef\u590d\u73b0\u3001\u53ef\u8ffd\u6eaf\u3002", "upvotes": 54, "what_it_is": "\u63d0\u51fa\u4e16\u754c\u6a21\u578b\u80fd\u529b\u6846\u67b6\uff0c\u5e76\u6784\u5efa\u7edf\u4e00\u63a8\u7406\u4e0e\u8bc4\u6d4b\u5e73\u53f0\u3002\u901a\u8fc7\u6a21\u6001\u9002\u914d\u5668\u4fdd\u7559\u539f\u751f\u6267\u884c\u8bed\u4e49\uff0c\u4ee5\u6e05\u5355\u3001\u4ea7\u7269\u5951\u7ea6\u548c\u8bc1\u636e\u8bc4\u5206\u5361\u4e32\u8054\u8fd0\u884c\u4e0e\u8bc4\u6d4b\u3002", "why_notable": "\u5c06\u5173\u6ce8\u70b9\u4ece\u89c6\u89c9\u903c\u771f\u5ea6\u8f6c\u5411\u6301\u4e45\u72b6\u6001\u3001\u53ef\u63a7\u52a8\u6001\u4e0e\u56e0\u679c\u4e00\u81f4\u6027\uff0c\u5e76\u7528\u53ef\u8ffd\u6eaf\u8bc1\u636e\u652f\u6491\u5f02\u6784\u4e16\u754c\u6a21\u578b\u7684\u53ef\u590d\u73b0\u6bd4\u8f83\u3002"}, {"abstract": "Real-time 3D human mesh recovery from a single image on mobile devices is a challenging problem with many applications, including robotics, biomechanics, AR/VR, and exergames. Current state-of-the-art models are either too slow to run efficiently on mobile devices or sacrifice accuracy for speed. We present InstantHMR, a family of open-source single-image regressors suited for mobile inference, based on the Momentum Human Rig (MHR) parametric model and trained exclusively on publicly available annotations from the SAM 3D Body dataset. Our approach achieves remarkable performance on a Samsung Galaxy S23 NPU, recovering a 6,890-vertex body mesh in 5.5 ms per person, and 0.98 ms on an NVIDIA RTX 4070 GPU. This speed surpasses all existing methods we evaluated. On mobile, it is 12x faster than the single mobile-compatible method that slightly outperforms ours in accuracy, while achieving competitive accuracy with 40.0 mm PA-MPJPE on 3DPW, 48.8 mm on EMDB and 41.7 mm on RICH. To ensure fair comparisons, we re-evaluate 11 state-of-the-art methods under a unified protocol aligned with the closest MHR-based competitors, including Meta\u0027s official MHR-to-SMPL conversion, and report their reproduction results. Additionally, we measure latency across eight different targets, ranging from desktop TensorRT to two phone NPUs. Code and models are available at https://github.com/Naturalpad-studio/InstantHMR.", "arxiv_id": "2611.09195", "arxiv_url": "https://arxiv.org/abs/2611.09195", "authors": ["Mohamed Adjel", "Kahina Chalabi", "Vincent Bonnet"], "brief": "\u63d0\u51fa\u9762\u5411\u79fb\u52a8\u63a8\u7406\u7684\u5f00\u6e90\u5355\u56fe\u4eba\u4f53\u7f51\u683c\u56de\u5f52\u6a21\u578b\u65cf\uff0c\u57fa\u4e8eMHR\u53c2\u6570\u5316\u4eba\u4f53\u6a21\u578b\uff0c\u4ec5\u7528SAM 3D Body\u516c\u5f00\u6807\u6ce8\u8bad\u7ec3\uff0c\u5e76\u7edf\u4e00\u8bc4\u4f30\u7cbe\u5ea6\u4e0e\u5ef6\u8fdf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Naturalpad-studio/InstantHMR", "github_stars": 353, "hf_url": "https://huggingface.co/papers/2611.09195", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Galaxy S23 NPU\u6bcf\u4eba5.5\u6beb\u79d2\uff0c\u8f93\u51fa6890\u9876\u70b9", "3DPW\u4e0aPA-MPJPE\u4e3a40.0\u6beb\u7c73", "\u7edf\u4e00\u590d\u6d4b11\u79cd\u65b9\u6cd5\uff0c\u57288\u7c7b\u8ba1\u7b97\u5e73\u53f0\u6d4b\u5ef6\u8fdf"], "keywords": ["\u4eba\u4f53\u7f51\u683c\u91cd\u5efa", "\u79fb\u52a8\u7aef\u63a8\u7406", "\u4e09\u7ef4\u89c6\u89c9"], "num_comments": 2, "on_hf": true, "organization": "naturalpad", "pdf_url": "https://arxiv.org/pdf/2611.09195v1", "published_at": "2026-11-06", "score": 0.287, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09195.png", "title": "InstantHMR : Real-Time Human Mesh Recovery on Your Phone", "tldr": "\u4ee5\u8f7b\u91cf\u5355\u56fe\u56de\u5f52\u5b9e\u73b0\u624b\u673a\u7aef\u5b9e\u65f6\u4eba\u4f53\u7f51\u683c\u91cd\u5efa\uff0c\u517c\u987e\u6beb\u79d2\u7ea7\u901f\u5ea6\u4e0e\u7cbe\u5ea6\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u9762\u5411\u79fb\u52a8\u63a8\u7406\u7684\u5f00\u6e90\u5355\u56fe\u4eba\u4f53\u7f51\u683c\u56de\u5f52\u6a21\u578b\u65cf\uff0c\u57fa\u4e8eMHR\u53c2\u6570\u5316\u4eba\u4f53\u6a21\u578b\uff0c\u4ec5\u7528SAM 3D Body\u516c\u5f00\u6807\u6ce8\u8bad\u7ec3\uff0c\u5e76\u7edf\u4e00\u8bc4\u4f30\u7cbe\u5ea6\u4e0e\u5ef6\u8fdf\u3002", "why_notable": "\u624b\u673a\u7aef\u6bd4\u7cbe\u5ea6\u7565\u4f18\u7684\u79fb\u52a8\u517c\u5bb9\u65b9\u6cd5\u5feb12\u500d\uff0c\u540c\u65f6\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u7cbe\u5ea6\uff1b\u5f00\u6e90\u6a21\u578b\u4e0e\u7edf\u4e00\u8bc4\u6d4b\u6709\u52a9\u4e8e\u79fb\u52a8\u7aef\u5e94\u7528\u843d\u5730\u3002"}, {"abstract": "We present PhysioWave-T, a token-efficient wavelet foundation model family for EEG, ECG, and sEMG. Dynamic scale folding recombines J+1 wavelet subbands prior to tokenization, compressing sequence length from (J+1)CS to CS tokens for J levels, C channels, and S temporal patches. Route-specific front ends and learned channel-name embeddings allow one Transformer per modality to handle diverse montages and sampling rates, while unseen setups reuse the backbone via lightweight adapters. We pre-train a 30M-parameter EEG model on over 15M windows (19--128 channels), alongside ECG (30M) and sEMG (12M) encoders. Across four EEG routes, scale folding cuts Transformer latency by 4.0--7.2x and peak memory by 6.8--12.7x over scale expansion without accuracy loss. Our EEG encoder leads 8 of 9 metrics against BENDR, BIOT, LaBraM, and EEGPT, and surpasses LUNA-L on wearable seizure detection with fewer parameters. Reliability-aware latent fusion (RALF) further integrates summary tokens from independently pre-trained encoders via sample-adaptive weights. On SeizeIT2, RALF raises event sensitivity at 11 false alarms/h from 61.4% to 74.4% and window AUPRC from 0.321 to 0.399 over the best unimodal baseline, outperforming weighted-logit and concatenation fusion across all variants. PhysioWave-T also achieves state-of-the-art sEMG accuracies and top macro-F1 on PTB-XL Super and Chapman-Shaoxing. Code and models: https://github.com/ForeverBlue816/PhysioWave.", "arxiv_id": "2611.08969", "arxiv_url": "https://arxiv.org/abs/2611.08969", "authors": ["Yanlong Chen", "Simone Benatti", "Luca Benini", "Cuntai Guan", "Yawei Li"], "brief": "\u6784\u5efa\u8986\u76d6\u8111\u7535\u3001\u5fc3\u7535\u548c\u8868\u9762\u808c\u7535\u7684\u57fa\u7840\u6a21\u578b\u5bb6\u65cf\uff0c\u5728\u5206\u8bcd\u524d\u6298\u53e0\u5c0f\u6ce2\u5b50\u5e26\u4ee5\u538b\u7f29\u5e8f\u5217\uff0c\u5e76\u7528\u901a\u9053\u540d\u5d4c\u5165\u548c\u8f7b\u91cf\u9002\u914d\u5668\u517c\u5bb9\u4e0d\u540c\u91c7\u96c6\u914d\u7f6e\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/ForeverBlue816/PhysioWave", "github_stars": 215, "hf_url": "https://huggingface.co/papers/2611.08969", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u52a8\u6001\u5c3a\u5ea6\u6298\u53e0\u5c06\u4ee4\u724c\u6570\u4ece(J+1)CS\u964d\u81f3CS", "\u8111\u7535\u5ef6\u8fdf\u964d\u4f4e4.0\u20147.2\u500d\uff0c\u4e14\u4e0d\u635f\u5931\u51c6\u786e\u7387", "RALF\u5c06\u766b\u75eb\u4e8b\u4ef6\u654f\u611f\u5ea6\u4ece61.4%\u5347\u81f374.4%"], "keywords": ["\u751f\u7406\u4fe1\u53f7", "\u5c0f\u6ce2\u53d8\u6362", "\u57fa\u7840\u6a21\u578b", "\u591a\u6a21\u6001\u878d\u5408"], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.08969v1", "published_at": "2026-11-06", "score": 0.282, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08969.png", "title": "PhysioWave-T: Token-Efficient Wavelet Foundation Models for Biosignals", "tldr": "\u901a\u8fc7\u5c0f\u6ce2\u5c3a\u5ea6\u6298\u53e0\u51cf\u5c11\u751f\u7406\u4fe1\u53f7\u5efa\u6a21\u5f00\u9500\uff0c\u5e76\u4ee5\u81ea\u9002\u5e94\u878d\u5408\u63d0\u5347\u766b\u75eb\u68c0\u6d4b\u6027\u80fd\u3002", "upvotes": 2, "what_it_is": "\u6784\u5efa\u8986\u76d6\u8111\u7535\u3001\u5fc3\u7535\u548c\u8868\u9762\u808c\u7535\u7684\u57fa\u7840\u6a21\u578b\u5bb6\u65cf\uff0c\u5728\u5206\u8bcd\u524d\u6298\u53e0\u5c0f\u6ce2\u5b50\u5e26\u4ee5\u538b\u7f29\u5e8f\u5217\uff0c\u5e76\u7528\u901a\u9053\u540d\u5d4c\u5165\u548c\u8f7b\u91cf\u9002\u914d\u5668\u517c\u5bb9\u4e0d\u540c\u91c7\u96c6\u914d\u7f6e\u3002", "why_notable": "\u5728\u4fdd\u6301\u51c6\u786e\u7387\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u751f\u7406\u4fe1\u53f7\u6a21\u578b\u7684\u8ba1\u7b97\u5f00\u9500\uff1b\u72ec\u7acb\u7f16\u7801\u5668\u7684\u53ef\u9760\u6027\u611f\u77e5\u878d\u5408\uff0c\u4e5f\u5c55\u793a\u4e86\u591a\u6a21\u6001\u766b\u75eb\u68c0\u6d4b\u7684\u589e\u76ca\u3002"}, {"abstract": "Vision-language models can interpret instructions and plan manipulation tasks, yet struggle when acting directly as robot policies. On RoboDojo, a large planning-execution gap separates high-level task decisions from physical execution: removing arm execution raises GPT-6 Astra\u0027s success rate from 22.5% under the reference control interface to 76.2%. We present Auriga, a task-agnostic agent harness that closes 68.3% of this gap in zero-shot manipulation without target-task trials or resets. In Auriga, the model makes all task decisions over an explicit task belief and acts through either direct tool calls or synthesized multi-step Python programs, while the harness supplies calibrated 3D measurements, finger-referenced dual-arm control, and a single admission gateway to the robot. Before motion, the model inspects a visual trajectory preview while simulation is paused; during execution, the harness checks declared stage tolerances and grasp bounds, stopping the robot on divergence and returning the measured discrepancy for in-place recovery. Developed across 13 cross-task capability iterations and frozen for evaluation, Auriga ranks first on the RoboDojo leaderboard with a 57.7% success rate (64.0 Score), more than doubling the reference harness on the same model, and remains first under scene randomization while learned policies drop by up to 33.9%. On RoboCasa365, the same frozen harness reaches a 73.2% success rate, outperforming VLA-assisted agents by up to 23.1% on composite tasks. Project page: https://auriga.stelledge.com/ Code: https://github.com/lose4578/Auriga", "arxiv_id": "2611.01112", "arxiv_url": "https://arxiv.org/abs/2611.01112", "authors": ["Chengcheng Wang", "Yuheng Shi", "Siyu Xu", "Yutong Wang", "Jinjing Zhao", "Chenghao Xia", "Jinqi Liao", "Jiankun Peng", "Ligong Bi", "Yuechuan Ma", "Jiaqi Liu", "Wenbo Wang", "Zijian Wang", "Yuemin Wu", "Minjing Dong", "Xiu Su", "Tao Huang", "Jianyuan Guo", "Chengbin Du", "Yunke Wang", "Chang Xu"], "brief": "Auriga\u8ba9\u6a21\u578b\u57fa\u4e8e\u663e\u5f0f\u4efb\u52a1\u4fe1\u5ff5\uff0c\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u6216\u751f\u6210Python\u7a0b\u5e8f\u51b3\u7b56\uff1b\u6846\u67b6\u63d0\u4f9b\u4e09\u7ef4\u6d4b\u91cf\u3001\u53cc\u81c2\u63a7\u5236\u548c\u6267\u884c\u68c0\u67e5\uff0c\u504f\u79bb\u65f6\u505c\u6b62\u5e76\u53cd\u9988\uff0c\u652f\u6301\u539f\u5730\u6062\u590d\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/lose4578/Auriga", "github_stars": 34, "hf_url": "https://huggingface.co/papers/2611.01112", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6267\u884c\u524d\u9884\u89c8\u8f68\u8ff9\uff0c\u6267\u884c\u4e2d\u68c0\u67e5\u9636\u6bb5\u5bb9\u5dee\u4e0e\u6293\u53d6\u8fb9\u754c", "RoboDojo\u6210\u529f\u738757.7%\uff0c\u5f25\u540868.3%\u89c4\u5212\u6267\u884c\u5dee\u8ddd", "\u51bb\u7ed3\u6846\u67b6\u5728RoboCasa365\u6210\u529f\u7387\u8fbe73.2%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u96f6\u6837\u672c\u5b66\u4e60", "\u667a\u80fd\u4f53\u6846\u67b6"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01112v1", "published_at": "2026-10-31", "score": 0.282, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01112.png", "title": "Auriga Technical Report: A Task-Agnostic Agent Harness for Zero-Shot Embodied Manipulation", "tldr": "\u901a\u8fc7\u8f68\u8ff9\u9884\u89c8\u4e0e\u6267\u884c\u6821\u9a8c\uff0c\u901a\u7528\u667a\u80fd\u4f53\u6846\u67b6\u663e\u8457\u63d0\u5347\u673a\u5668\u4eba\u96f6\u6837\u672c\u64cd\u4f5c\u6210\u529f\u7387\u3002", "upvotes": 4, "what_it_is": "Auriga\u8ba9\u6a21\u578b\u57fa\u4e8e\u663e\u5f0f\u4efb\u52a1\u4fe1\u5ff5\uff0c\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u6216\u751f\u6210Python\u7a0b\u5e8f\u51b3\u7b56\uff1b\u6846\u67b6\u63d0\u4f9b\u4e09\u7ef4\u6d4b\u91cf\u3001\u53cc\u81c2\u63a7\u5236\u548c\u6267\u884c\u68c0\u67e5\uff0c\u504f\u79bb\u65f6\u505c\u6b62\u5e76\u53cd\u9988\uff0c\u652f\u6301\u539f\u5730\u6062\u590d\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u6539\u8fdb\u6267\u884c\u63a5\u53e3\u53ef\u663e\u8457\u91ca\u653e\u6a21\u578b\u7684\u89c4\u5212\u80fd\u529b\uff1b\u65e0\u9700\u76ee\u6807\u4efb\u52a1\u8bd5\u9a8c\u6216\u91cd\u7f6e\uff0c\u540c\u4e00\u51bb\u7ed3\u6846\u67b6\u4ecd\u80fd\u8de8\u57fa\u51c6\u53d6\u5f97\u9886\u5148\u8868\u73b0\u3002"}, {"abstract": "World models enable agents to plan and learn from imagined experience, but in an unfamiliar environment they must learn its mechanics from limited interaction. A mechanic is a rule for how an action or an interaction changes part of the environment. Each occurrence of a mechanic that the model observes is one exposure. We ask how many exposures a world model needs to predict the effects of a new environment\u0027s mechanics. We address this question on ARC-AGI-3, a benchmark of interactive games defined by their programs. We introduce MechEval, which labels 69 recurring mechanics across 20 games from these programs. It scores each prediction on the cells the mechanic changes at each exposure. As a test bed, we build WARC (World model for ARC-AGI-3), a 35M-parameter vision transformer that is pretrained on other games and updates all of its parameters after each transition. On held-out games, WARC learns to predict four in five mechanics with at least 80% accuracy on the cells they change and keeps that accuracy to the end of the recordings. Half of them reach that accuracy within about 80 exposures, in a single play of the game, and without updates only one in seven does at all. In closed-loop play on the public games, WARC-Agent, which pairs WARC with a fixed graph explorer, triples the explorer\u0027s official efficiency score from 0.15 to 0.46, mostly through test-time training. On the hidden games of the Kaggle leaderboard, our entry scores 0.20.", "arxiv_id": "2611.12324", "arxiv_url": "https://arxiv.org/abs/2611.12324", "authors": ["Ku Onoda", "Haruto Kawano", "Shota Takashiro", "Kohei Hayashi"], "brief": "\u63d0\u51fa\u673a\u5236\u7ea7\u8bc4\u6d4bMechEval\uff0c\u5e76\u6784\u5efa3500\u4e07\u53c2\u6570\u89c6\u89c9Transformer\u4e16\u754c\u6a21\u578bWARC\uff0c\u5728\u5176\u4ed6\u6e38\u620f\u4e0a\u9884\u8bad\u7ec3\uff0c\u6bcf\u6b21\u72b6\u6001\u8f6c\u79fb\u540e\u66f4\u65b0\u5168\u90e8\u53c2\u6570\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": "https://github.com/third-intelligence/WARC", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.12324", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["MechEval\u6807\u6ce820\u6b3e\u6e38\u620f\u4e2d\u768469\u79cd\u91cd\u590d\u673a\u5236", "\u4e94\u5206\u4e4b\u56db\u673a\u5236\u9884\u6d4b\u51c6\u786e\u7387\u8fbe80%\uff0c\u534a\u6570\u7ea6\u970080\u6b21\u66b4\u9732", "WARC-Agent\u5c06\u5b98\u65b9\u6548\u7387\u5206\u6570\u4ece0.15\u63d0\u5347\u81f30.46"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u4ea4\u4e92\u5f0f\u8bc4\u6d4b", "\u667a\u80fd\u4f53"], "num_comments": 3, "on_hf": true, "organization": "Third Intelligence, Inc.", "pdf_url": "https://arxiv.org/pdf/2611.12324v1", "published_at": "2026-11-09", "score": 0.274, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12324.png", "title": "How Many Exposures Does a World Model Need? Learning Unseen Game Mechanics at Test Time", "tldr": "\u4e16\u754c\u6a21\u578b\u901a\u8fc7\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u638c\u63e1\u65b0\u6e38\u620f\u673a\u5236\uff0c\u5e76\u663e\u8457\u63d0\u5347\u667a\u80fd\u4f53\u63a2\u7d22\u6548\u7387\u3002", "upvotes": 11, "what_it_is": "\u63d0\u51fa\u673a\u5236\u7ea7\u8bc4\u6d4bMechEval\uff0c\u5e76\u6784\u5efa3500\u4e07\u53c2\u6570\u89c6\u89c9Transformer\u4e16\u754c\u6a21\u578bWARC\uff0c\u5728\u5176\u4ed6\u6e38\u620f\u4e0a\u9884\u8bad\u7ec3\uff0c\u6bcf\u6b21\u72b6\u6001\u8f6c\u79fb\u540e\u66f4\u65b0\u5168\u90e8\u53c2\u6570\u3002", "why_notable": "\u628a\u65b0\u73af\u5883\u9002\u5e94\u80fd\u529b\u7ec6\u5316\u4e3a\u673a\u5236\u7ea7\u5b66\u4e60\u901f\u5ea6\uff0c\u5e76\u663e\u793a\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u7684\u9884\u6d4b\u6536\u76ca\u53ef\u8f6c\u5316\u4e3a\u95ed\u73af\u63a2\u7d22\u6548\u7387\u63d0\u5347\u3002"}, {"abstract": "Generating high-fidelity voxels while keeping their lightweight nature remains an open problem in computer vision. Current generators are either high-fidelity but computationally heavy, or lightweight but of lower fidelity. Hierarchical methods keep the lightweight nature of voxels. However, their coarse levels, which decide where all finer cells can appear, are generated with the least information about the shape and are never revisited, so they are often plausible but wrong. Our key insight is to let finer cells
