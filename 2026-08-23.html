89\u5168", "\u5de5\u5177\u8c03\u7528", "\u8fd0\u884c\u65f6\u76d1\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21101v1", "published_at": "2026-08-21", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ClawSentry: A Progressive Multi-Tier Security Monitor for Safeguarding Autonomous LLM Agents", "tldr": "\u9762\u5411LLM\u667a\u80fd\u4f53\u7684\u591a\u5c42\u6e10\u8fdb\u5f0f\u5b89\u5168\u7f51\u5173", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ClawSentry\uff0c\u4e00\u4e2a\u5f00\u6e90\u3001\u6846\u67b6\u65e0\u5173\u7684\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u5b89\u5168\u76d1\u7763\u7f51\u5173\uff0c\u7528\u4e8e\u5728\u6280\u80fd\u63a5\u5165\u3001\u8c03\u7528\u610f\u56fe\u3001\u6267\u884c\u6548\u679c\u548c\u884c\u52a8\u540e\u679c\u56db\u4e2a\u73af\u8282\u9632\u62a4\u6076\u610f\u6280\u80fd\u4e0e\u8d8a\u6743\u884c\u4e3a\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u5ba1\u67e5\u4e0e\u8de8\u4f1a\u8bdd\u53cd\u7ed5\u8fc7\u673a\u5236\uff0c\u5728\u4e0d\u4fee\u6539 Codex\u3001Claude Code\u3001Kimi CLI\u3001Gemini CLI \u7b49\u667a\u80fd\u4f53\u5185\u90e8\u7684\u60c5\u51b5\u4e0b\u7edf\u4e00\u6267\u884c\u5b89\u5168\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u667a\u80fd\u4f53\u5b8c\u6574\u751f\u547d\u5468\u671f\u800c\u975e\u5355\u6b21\u5de5\u5177\u8c03\u7528\u51fa\u53d1\u8bbe\u8ba1\u5b89\u5168\u9632\u7ebf\uff0c\u517c\u987e\u6076\u610f\u6280\u80fd\u5ba1\u8ba1\u3001\u8fd0\u884c\u65f6\u610f\u56fe\u8bc6\u522b\u3001\u5de5\u5177\u5207\u6362\u7ed5\u8fc7\u68c0\u6d4b\u548c\u4e8b\u540e\u8bc1\u636e\u53cd\u9988\uff0c\u5bf9\u5373\u5c06\u5927\u89c4\u6a21\u90e8\u7f72\u7684\u4ee3\u7801\u6267\u884c\u4e0e\u5de5\u5177\u8c03\u7528\u578b LLM \u667a\u80fd\u4f53\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM agents are emerging as an important paradigm for real-world tasks that require reasoning, tool use, and sequential decision-making. As these agents operate over longer horizons, runtime intervention offers a way to improve reliability without retraining the underlying actor. Failure detection alone is insufficient. Effective intervention must also provide a useful direction for recovery. Existing approaches often rely on an expert solver or a critic that generates task-specific corrections, incurring either the cost of another capable solver or the capacity demands of a task-capable critic. We introduce Comparison-Only Tiny Advisor (COTA), a comparison-only framework for constructive runtime intervention. In COTA, a tiny comparator judges whether sampled alternatives lead to better continuations than the actor\u0027s proposal, and repeated comparisons determine when intervention is warranted. We train the comparator using pairwise supervision constructed from same-prefix counterfactual branches. Preferred alternatives are returned as non-binding advice, leaving the original actor to replan. Across WebShop, ALFWorld, and tau^3-Retail with three actors, COTA improves all nine evaluation settings and outperforms the compared baselines. These results show that constructive runtime intervention can remain effective even when the auxiliary model has substantially weaker task-solving capability than the actor.", "arxiv_id": "2608.21027", "arxiv_url": "https://arxiv.org/abs/2608.21027", "authors": ["Yanze Jiang", "Mingxuan Li", "Yuhao Wang", "Shengfang Zhai", "Jiaheng Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa COTA\uff08Comparison-Only Tiny Advisor\uff09\uff0c\u4e00\u79cd\u8fd0\u884c\u65f6\u5e72\u9884\u6846\u67b6\uff1a\u4e0d\u8ba9\u8f85\u52a9\u6a21\u578b\u76f4\u63a5\u89e3\u9898\u6216\u751f\u6210\u4fee\u6b63\uff0c\u800c\u662f\u53ea\u6bd4\u8f83\u5019\u9009\u884c\u52a8\u5206\u652f\u662f\u5426\u4f18\u4e8e\u5f53\u524d\u667a\u80fd\u4f53\u65b9\u6848\u3002\u8be5\u65b9\u6cd5\u7528\u540c\u524d\u7f00\u53cd\u4e8b\u5b9e\u5206\u652f\u6784\u9020\u504f\u597d\u76d1\u7763\uff0c\u8bad\u7ec3\u5c0f\u578b\u6bd4\u8f83\u5668\uff0c\u5e76\u5c06\u66f4\u4f18\u66ff\u4ee3\u65b9\u6848\u4f5c\u4e3a\u975e\u5f3a\u5236\u5efa\u8bae\u4ea4\u7ed9\u539f\u667a\u80fd\u4f53\u91cd\u65b0\u89c4\u5212\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21027", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6838\u5fc3\u601d\u60f3\u662f\u201c\u53ea\u6bd4\u8f83\uff0c\u4e0d\u6c42\u89e3\u201d\uff1a\u5c0f\u578b\u6bd4\u8f83\u5668\u5224\u65ad\u91c7\u6837\u66ff\u4ee3\u5206\u652f\u662f\u5426\u5e26\u6765\u66f4\u597d\u540e\u7eed\uff0c\u800c\u975e\u627f\u62c5\u5b8c\u6574\u4efb\u52a1\u6c42\u89e3\u80fd\u529b\u3002", "\u8bad\u7ec3\u6570\u636e\u6765\u81ea\u540c\u4e00\u5386\u53f2\u524d\u7f00\u4e0b\u7684\u53cd\u4e8b\u5b9e\u5206\u652f\u5bf9\uff0c\u901a\u8fc7\u6210\u5bf9\u504f\u597d\u76d1\u7763\u5b66\u4e60\u54ea\u6761\u7eed\u5199\u66f4\u4f18\u3002", "\u5728 WebShop\u3001ALFWorld\u3001tau^3-Retail \u4e09\u4e2a\u73af\u5883\u548c\u4e09\u7c7b actor \u4e0a\uff0c\u4e5d\u4e2a\u8bc4\u6d4b\u8bbe\u7f6e\u5168\u90e8\u63d0\u5347\uff0c\u5e76\u4f18\u4e8e\u5bf9\u6bd4\u57fa\u7ebf\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8fd0\u884c\u65f6\u5e72\u9884", "\u504f\u597d\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21027v1", "published_at": "2026-08-21", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Don\u0027t Solve, Just Compare: Tiny Advisors for Runtime Intervention in LLM Agents", "tldr": "\u7528\u5c0f\u6a21\u578b\u6bd4\u8f83\u5206\u652f\u6765\u5e72\u9884LLM\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa COTA\uff08Comparison-Only Tiny Advisor\uff09\uff0c\u4e00\u79cd\u8fd0\u884c\u65f6\u5e72\u9884\u6846\u67b6\uff1a\u4e0d\u8ba9\u8f85\u52a9\u6a21\u578b\u76f4\u63a5\u89e3\u9898\u6216\u751f\u6210\u4fee\u6b63\uff0c\u800c\u662f\u53ea\u6bd4\u8f83\u5019\u9009\u884c\u52a8\u5206\u652f\u662f\u5426\u4f18\u4e8e\u5f53\u524d\u667a\u80fd\u4f53\u65b9\u6848\u3002\u8be5\u65b9\u6cd5\u7528\u540c\u524d\u7f00\u53cd\u4e8b\u5b9e\u5206\u652f\u6784\u9020\u504f\u597d\u76d1\u7763\uff0c\u8bad\u7ec3\u5c0f\u578b\u6bd4\u8f83\u5668\uff0c\u5e76\u5c06\u66f4\u4f18\u66ff\u4ee3\u65b9\u6848\u4f5c\u4e3a\u975e\u5f3a\u5236\u5efa\u8bae\u4ea4\u7ed9\u539f\u667a\u80fd\u4f53\u91cd\u65b0\u89c4\u5212\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u964d\u4f4e\u4e86LLM\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u7ea0\u9519\u7684\u6210\u672c\u4e0e\u80fd\u529b\u95e8\u69db\uff0c\u8bf4\u660e\u8f85\u52a9\u6a21\u578b\u5373\u4f7f\u8fdc\u5f31\u4e8e\u4e3b\u667a\u80fd\u4f53\uff0c\u4e5f\u80fd\u901a\u8fc7\u6bd4\u8f83\u5f0f\u5efa\u8bae\u63d0\u5347\u957f\u7a0b\u4efb\u52a1\u53ef\u9760\u6027\uff0c\u5bf9\u5b9e\u9645\u90e8\u7f72\u4e2d\u7684\u4f4e\u6210\u672c\u76d1\u7763\u3001\u7ea0\u504f\u548c\u5b89\u5168\u5e72\u9884\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "The advancement of modern integrated photonics is frequently bottlenecked by device design workflows that rely heavily on manual simulation and expert intuition. While inverse design offers an alternative, it remains constrained by expert supervision and a lack of end-to-end automation. To address these issues, we present VortexChat, an agentic framework for the autonomous, end-to-end inverse design of integrated photonic devices directly from natural language specifications. VortexChat couples a large language model (LLM) decision agent with topology generation, gradient-based refinement, and full-wave electromagnetic simulation. This closed-loop architecture enables the system to iteratively decompose design objectives, orchestrate computational tools, and update strategies based on feedback with minimal human intervention. Constrained by the absolute metrics of the Vortex100 Benchmark, VortexChat autonomously generates devices that strictly meet all predefined performance thresholds without any human-in-the-loop. As an experimental demonstration, we fabricated a broadband terahertz perfect vortex beam multiplexer, autonomously designed by VortexChat, with measurements confirming high-efficiency operation, high mode purity and low inter-channel crosstalk in agreement with full-wave simulations. These results demonstrate that an LLM agent can assume key aspects of expert decision-making in photonic inverse design while maintaining physical fidelity and fabrication feasibility, providing a scalable route towards autonomous design of complex integrated photonic systems.", "arxiv_id": "2608.20688", "arxiv_url": "https://arxiv.org/abs/2608.20688", "authors": ["Faqian Chong", "Yulun Wu", "Shilong Li", "Andrew Forbes", "Hongsheng Chen", "Song Han"], "brief": "\u8bba\u6587\u63d0\u51fa VortexChat\uff0c\u4e00\u4e2a\u4ece\u81ea\u7136\u8bed\u8a00\u89c4\u683c\u51fa\u53d1\u7684\u96c6\u6210\u5149\u5b50\u5668\u4ef6\u81ea\u4e3b\u9006\u8bbe\u8ba1\u6846\u67b6\u3002\u5b83\u5c06 LLM \u51b3\u7b56\u667a\u80fd\u4f53\u4e0e\u62d3\u6251\u751f\u6210\u3001\u68af\u5ea6\u4f18\u5316\u548c\u5168\u6ce2\u7535\u78c1\u4eff\u771f\u95ed\u73af\u7ed3\u5408\uff0c\u5b9e\u73b0\u591a\u76ee\u6807\u8bbe\u8ba1\u7684\u81ea\u52a8\u5206\u89e3\u3001\u5de5\u5177\u8c03\u5ea6\u4e0e\u8fed\u4ee3\u6539\u8fdb\u3002", "categories": ["cs.AI", "physics.optics"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20688", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u95ed\u73af agentic workflow\uff1aLLM \u8d1f\u8d23\u51b3\u7b56\u4e0e\u7b56\u7565\u66f4\u65b0\uff0c\u5916\u90e8\u8ba1\u7b97\u5de5\u5177\u8d1f\u8d23\u62d3\u6251\u751f\u6210\u3001\u68af\u5ea6\u7ec6\u5316\u548c\u7269\u7406\u4eff\u771f\u9a8c\u8bc1\u3002", "\u5728 Vortex100 Benchmark \u7ea6\u675f\u4e0b\uff0c\u65e0\u9700\u4eba\u5de5\u4ecb\u5165\u5373\u53ef\u751f\u6210\u6ee1\u8db3\u9884\u8bbe\u6027\u80fd\u9608\u503c\u7684\u5149\u5b50\u5668\u4ef6\u8bbe\u8ba1\u3002", "\u5b9e\u9a8c\u5236\u5907\u4e86\u7531 VortexChat \u81ea\u4e3b\u8bbe\u8ba1\u7684\u5bbd\u5e26\u592a\u8d6b\u5179\u5b8c\u7f8e\u6da1\u65cb\u5149\u675f\u590d\u7528\u5668\uff0c\u5b9e\u6d4b\u8868\u73b0\u51fa\u9ad8\u6548\u7387\u3001\u9ad8\u6a21\u5f0f\u7eaf\u5ea6\u548c\u4f4e\u4e32\u6270\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u9006\u8bbe\u8ba1", "\u5149\u5b50\u5b66", "\u7269\u7406\u4eff\u771f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20688v1", "published_at": "2026-08-21", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "VortexChat: An agentic framework for autonomous multi-objective integrated photonic design", "tldr": "LLM\u667a\u80fd\u4f53\u5b9e\u73b0\u5149\u5b50\u5668\u4ef6\u7aef\u5230\u7aef\u81ea\u4e3b\u9006\u8bbe\u8ba1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VortexChat\uff0c\u4e00\u4e2a\u4ece\u81ea\u7136\u8bed\u8a00\u89c4\u683c\u51fa\u53d1\u7684\u96c6\u6210\u5149\u5b50\u5668\u4ef6\u81ea\u4e3b\u9006\u8bbe\u8ba1\u6846\u67b6\u3002\u5b83\u5c06 LLM \u51b3\u7b56\u667a\u80fd\u4f53\u4e0e\u62d3\u6251\u751f\u6210\u3001\u68af\u5ea6\u4f18\u5316\u548c\u5168\u6ce2\u7535\u78c1\u4eff\u771f\u95ed\u73af\u7ed3\u5408\uff0c\u5b9e\u73b0\u591a\u76ee\u6807\u8bbe\u8ba1\u7684\u81ea\u52a8\u5206\u89e3\u3001\u5de5\u5177\u8c03\u5ea6\u4e0e\u8fed\u4ee3\u6539\u8fdb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 LLM \u667a\u80fd\u4f53\u4ece\u6587\u672c/\u8f6f\u4ef6\u4efb\u52a1\u63a8\u8fdb\u5230\u590d\u6742\u7269\u7406\u5668\u4ef6\u8bbe\u8ba1\uff0c\u5e76\u901a\u8fc7\u4eff\u771f\u4e0e\u771f\u5b9e\u5236\u5907\u9a8c\u8bc1\u4e86\u7269\u7406\u4e00\u81f4\u6027\u548c\u53ef\u5236\u9020\u6027\uff0c\u5c55\u793a\u4e86\u81ea\u52a8\u5316\u79d1\u5b66\u8bbe\u8ba1\u5de5\u4f5c\u6d41\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "LLMs have evolved from language generators to autonomous agents capable of complex, long-horizon tasks. This evolution has produced paradigms including Prompt Engineering to elicit model capabilities, Context Engineering to manage information access, Harness Engineering to organize external tools and resources, and Loop Engineering to support continual reflection and self-improvement. Yet as tasks grow more complex, individual intelligence faces a fundamental limit: many tasks require heterogeneous expertise, interdependent subtasks, parallel execution, independent verification, and persistent state, exceeding any single agent\u0027s organizational capacity. Augmenting one agent\u0027s capabilities or context cannot resolve this architectural mismatch; intelligence must instead be distributed across specialized agents and organized at the system level. We call this System Intelligence: an agent system\u0027s ability to organize and coordinate multiple intelligent components into a coherent, adaptive whole pursuing a shared objective. Achieving it requires more than adding agents; it demands explicit structures to organize work, coordinate heterogeneous agents, and maintain evolving execution states. We introduce Graph Engineering, an emerging paradigm for next-generation agent systems. Unlike prior paradigms that mainly optimize individual interactions or agent-level behavior, Graph Engineering constructs explicit, dynamic, evolving graph structures representing tasks, agents, and system states. These abstractions provide a unified foundation for organizing complex objectives, orchestrating heterogeneous agents, modeling system dynamics, and enabling scalable agent evolution. We systematically review the principles, methodologies, and applications of Graph Engineering for LLM agents. Related papers, open-source data, and projects are collected at https://github.com/DEEP-JLU/Awesome-Graph-Engineering.", "arxiv_id": "2608.21156", "arxiv_url": "https://arxiv.org/abs/2608.21156", "authors": ["Yuyuan Feng", "Zhishang Xiang", "Chaobin Yang", "Qichao Ma", "Zerui Chen", "Yujing Zhang", "Ke Huang", "Chuanjie Wu", "Zhaoxu Liu", "Yili Wang", "Xin He", "Jiapu Wang", "Zijin Hong", "Hao Chen", "Yuanchen Bei", "Kun Wang", "Shengyuan Chen", "Ningyu Zhang", "Enyan Dai", "Linhao Luo", "Qingyi Pan", "Qi Wang", "Wenqi Fan", "Guangjing Wang", "Na Zou", "Yangqiu Song", "Xin Wang", "Zechao Li", "Xia Hu", "Qing Li", "Xiao Huang", "Zhihong Zhang", "Jinsong Su", "Qinggang Zhang", "Yi Chang"], "brief": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u5e76\u63d0\u51fa Graph Engineering\uff0c\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7528\u663e\u5f0f\u3001\u52a8\u6001\u6f14\u5316\u7684\u56fe\u7ed3\u6784\u8868\u793a\u4efb\u52a1\u3001\u667a\u80fd\u4f53\u4e0e\u7cfb\u7edf\u72b6\u6001\u3002\u5b83\u5c06\u667a\u80fd\u4ece\u5355\u4f53\u80fd\u529b\u6269\u5c55\u5230\u7cfb\u7edf\u7ea7\u7ec4\u7ec7\u4e0e\u534f\u8c03\uff0c\u652f\u6491\u590d\u6742\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u3002", "categories": ["cs.IR", "cs.AI", "cs.ET"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21156", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa Prompt Engineering\u3001Context Engineering\u3001Harness Engineering\u3001Loop Engineering \u4e3b\u8981\u4f18\u5316\u5355\u4e2a\u667a\u80fd\u4f53\u6216\u5c40\u90e8\u4ea4\u4e92\uff0c\u96be\u4ee5\u5e94\u5bf9\u5f02\u6784\u4e13\u5bb6\u3001\u5e76\u884c\u5b50\u4efb\u52a1\u3001\u72ec\u7acb\u9a8c\u8bc1\u548c\u6301\u4e45\u72b6\u6001\u7b49\u590d\u6742\u9700\u6c42\u3002", "\u63d0\u51fa System Intelligence \u6982\u5ff5\uff0c\u5373\u667a\u80fd\u4f53\u7cfb\u7edf\u901a\u8fc7\u7ec4\u7ec7\u548c\u534f\u8c03\u591a\u4e2a\u667a\u80fd\u7ec4\u4ef6\u5f62\u6210\u4e00\u81f4\u3001\u81ea\u9002\u5e94\u6574\u4f53\u7684\u80fd\u529b\u3002", "Graph Engineering \u4ee5\u4efb\u52a1\u56fe\u3001\u667a\u80fd\u4f53\u56fe\u3001\u72b6\u6001\u56fe\u7b49\u663e\u5f0f\u7ed3\u6784\u7edf\u4e00\u5efa\u6a21\u590d\u6742\u76ee\u6807\u3001\u5f02\u6784\u534f\u4f5c\u3001\u6267\u884c\u52a8\u6001\u4e0e\u7cfb\u7edf\u6f14\u5316\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u56fe\u5b66\u4e60", "\u7cfb\u7edf\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21156v1", "published_at": "2026-08-21", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Graph Engineering in the Era of LLM Agents: From Individual Intelligence to System Intelligence", "tldr": "\u63d0\u51fa\u56fe\u5de5\u7a0b\u8303\u5f0f\u7ec4\u7ec7\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u5e76\u63d0\u51fa Graph Engineering\uff0c\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7528\u663e\u5f0f\u3001\u52a8\u6001\u6f14\u5316\u7684\u56fe\u7ed3\u6784\u8868\u793a\u4efb\u52a1\u3001\u667a\u80fd\u4f53\u4e0e\u7cfb\u7edf\u72b6\u6001\u3002\u5b83\u5c06\u667a\u80fd\u4ece\u5355\u4f53\u80fd\u529b\u6269\u5c55\u5230\u7cfb\u7edf\u7ea7\u7ec4\u7ec7\u4e0e\u534f\u8c03\uff0c\u652f\u6491\u590d\u6742\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u3002", "why_notable": "\u8be5\u6587\u5c06\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u6838\u5fc3\u95ee\u9898\u4ece\u201c\u589e\u5f3a\u5355\u4e2a LLM\u201d\u8f6c\u5411\u201c\u8bbe\u8ba1\u7cfb\u7edf\u7ed3\u6784\u201d\uff0c\u4e3a\u590d\u6742\u667a\u80fd\u4f53\u7f16\u6392\u3001\u53ef\u6269\u5c55\u534f\u4f5c\u548c\u957f\u671f\u72b6\u6001\u7ba1\u7406\u63d0\u4f9b\u4e86\u8f83\u6e05\u6670\u7684\u7406\u8bba\u6846\u67b6\u4e0e\u7814\u7a76\u8def\u7ebf\u3002"}, {"abstract": "The rise of agentic AI enables LLMs to access diverse user data, raising critical privacy concerns. Prior work on contextual privacy studies whether LLMs regulate information disclosure according to context-dependent norms. However, acceptable disclosure boundaries may vary across users even within the same context. To address this limitation, we introduce \\textit{personalized privacy}, which incorporates user-specific disclosure preferences into privacy control. We further present P3Bench~(\\textbf{P}ersonalized \\textbf{P}rivacy \\textbf{P}reservation \\textbf{Bench}mark), a novel benchmark extending contextual privacy policies with personalized disclosure policies. Experiments show that prompt-based policies fail to reliably enforce personalized privacy policies, with Qwen2.5-7B and Gemma3-4B showing average policy ignorance ratios of 51.25\\% and 74.28\\%, respectively. Finally, to address this problem, we propose \\textsc{Repair}, a robust inference-time attention head intervention method that adjusts disclosure behavior toward policy-consistent responses. Our method significantly improves adherence to user-specific privacy preferences by reducing cases where the model fails to follow the given policy.", "arxiv_id": "2608.21209", "arxiv_url": "https://arxiv.org/abs/2608.21209", "authors": ["Junseok Kim", "Nakyeong Yang", "Kyomin Jung"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u4e2a\u6027\u5316\u9690\u79c1\u201d\u6982\u5ff5\uff0c\u5c06\u7528\u6237\u7279\u5b9a\u7684\u4fe1\u606f\u62ab\u9732\u504f\u597d\u7eb3\u5165 LLM \u9690\u79c1\u63a7\u5236\uff1b\u540c\u65f6\u6784\u5efa P3Bench \u57fa\u51c6\uff0c\u5e76\u63d0\u51fa\u63a8\u7406\u65f6\u6ce8\u610f\u529b\u5934\u5e72\u9884\u65b9\u6cd5 Repair \u6765\u63d0\u5347\u7b56\u7565\u9075\u5faa\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21209", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["P3Bench \u5728\u4e0a\u4e0b\u6587\u9690\u79c1\u7b56\u7565\u57fa\u7840\u4e0a\u52a0\u5165\u4e2a\u6027\u5316\u62ab\u9732\u7b56\u7565\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u80fd\u6309\u4e0d\u540c\u7528\u6237\u504f\u597d\u63a7\u5236\u4fe1\u606f\u8f93\u51fa", "\u5b9e\u9a8c\u53d1\u73b0\u4ec5\u9760\u63d0\u793a\u8bcd\u96be\u4ee5\u53ef\u9760\u6267\u884c\u4e2a\u6027\u5316\u9690\u79c1\u7b56\u7565\uff0cQwen2.5-7B \u4e0e Gemma3-4B \u7684\u5e73\u5747\u7b56\u7565\u5ffd\u89c6\u7387\u5206\u522b\u4e3a 51.25% \u548c 74.28%", "Repair \u901a\u8fc7\u63a8\u7406\u9636\u6bb5\u5e72\u9884\u6ce8\u610f\u529b\u5934\uff0c\u8c03\u6574\u6a21\u578b\u62ab\u9732\u884c\u4e3a\uff0c\u663e\u8457\u51cf\u5c11\u4e0d\u9075\u5faa\u7528\u6237\u9690\u79c1\u504f\u597d\u7684\u60c5\u51b5"], "keywords": ["\u9690\u79c1\u4fdd\u62a4", "\u667a\u80fd\u4f53", "\u6a21\u578b\u5b89\u5168", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21209v1", "published_at": "2026-08-21", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Personalized Privacy Control in LLMs via Attention Head Intervention", "tldr": "\u7528\u6ce8\u610f\u529b\u5934\u5e72\u9884\u5b9e\u73b0\u4e2a\u6027\u5316\u9690\u79c1\u63a7\u5236", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u4e2a\u6027\u5316\u9690\u79c1\u201d\u6982\u5ff5\uff0c\u5c06\u7528\u6237\u7279\u5b9a\u7684\u4fe1\u606f\u62ab\u9732\u504f\u597d\u7eb3\u5165 LLM \u9690\u79c1\u63a7\u5236\uff1b\u540c\u65f6\u6784\u5efa P3Bench \u57fa\u51c6\uff0c\u5e76\u63d0\u51fa\u63a8\u7406\u65f6\u6ce8\u610f\u529b\u5934\u5e72\u9884\u65b9\u6cd5 Repair \u6765\u63d0\u5347\u7b56\u7565\u9075\u5faa\u3002", "why_notable": "\u968f\u7740\u667a\u80fd\u4f53\u5f0f LLM \u63a5\u89e6\u66f4\u591a\u7528\u6237\u6570\u636e\uff0c\u9690\u79c1\u8fb9\u754c\u4e0d\u518d\u53ea\u53d6\u51b3\u4e8e\u573a\u666f\uff0c\u8fd8\u53d6\u51b3\u4e8e\u4e2a\u4eba\u504f\u597d\uff1b\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u65b0\u57fa\u51c6\u548c\u65e0\u9700\u91cd\u8bad\u7684\u5e72\u9884\u65b9\u6cd5\uff0c\u5bf9\u4e2a\u6027\u5316\u9690\u79c1\u4fdd\u62a4\u548c\u5b89\u5168\u667a\u80fd\u4f53\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Product catalogs underpin search, discovery, and recommendation in e-commerce, yet they are often attribute-sparse: the attributes shoppers and downstream systems rely on are either buried in unstructured content such as titles and images or missing from the catalog altogether. Manually enriching e-commerce catalogs is impractical given their scale and rapid growth. This paper introduces TRACE, a novel framework for automated catalog attribute enrichment using agentic Large Language Models (LLMs). A ScoutAgent triangulates multimodal evidence across merchant catalogs, syndicated feeds, and identity-matched web search to propose candidate attribute values with supporting evidence, while a JudgeAgent verifies the proposed value for each attribute value against its supporting evidence and decides whether to publish it or route it to human review. On an offline human evaluation dataset, TRACE\u0027s proposed attribute values were 98.2% accurate at 74.7% attribute coverage. Deployed in production on an industry-scale catalog, TRACE increased impression-weighted enrichment coverage across four business verticals by 90.4%. An online experiment subsequently showed that surfacing the enriched attributes on the product detail page increased checkout conversion by 0.48%.", "arxiv_id": "2608.20844", "arxiv_url": "https://arxiv.org/abs/2608.20844", "authors": ["Rohan Kumar", "Steven Xu", "Kyle MacDonald", "Matthew Long", "Bernice Chow", "Mac VanRenterghem", "Sudeep Das"], "brief": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u4e2a\u9762\u5411\u7535\u5546\u5546\u54c1\u76ee\u5f55\u7684\u81ea\u52a8\u5c5e\u6027\u8865\u5168\u6846\u67b6\u3002\u5b83\u901a\u8fc7 ScoutAgent \u4ece\u5546\u5bb6\u76ee\u5f55\u3001\u805a\u5408\u6570\u636e\u6e90\u548c\u7f51\u9875\u641c\u7d22\u4e2d\u6536\u96c6\u591a\u6a21\u6001\u8bc1\u636e\u751f\u6210\u5019\u9009\u5c5e\u6027\uff0c\u518d\u7531 JudgeAgent \u9a8c\u8bc1\u5e76\u51b3\u5b9a\u53d1\u5e03\u6216\u8f6c\u4eba\u5de5\u5ba1\u6838\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20844", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u53cc\u667a\u80fd\u4f53\u6d41\u7a0b\uff1aScoutAgent \u8d1f\u8d23\u591a\u6e90\u8bc1\u636e\u68c0\u7d22\u4e0e\u5019\u9009\u5c5e\u6027\u751f\u6210\uff0cJudgeAgent \u8d1f\u8d23\u57fa\u4e8e\u8bc1\u636e\u7684\u6821\u9a8c\u4e0e\u53d1\u5e03\u51b3\u7b56", "\u79bb\u7ebf\u4eba\u5de5\u8bc4\u6d4b\u4e2d\uff0cTRACE \u5728 74.7% \u5c5e\u6027\u8986\u76d6\u7387\u4e0b\u8fbe\u5230 98.2% \u5019\u9009\u5c5e\u6027\u51c6\u786e\u7387", "\u751f\u4ea7\u90e8\u7f72\u540e\uff0c\u56db\u4e2a\u4e1a\u52a1\u5782\u7c7b\u7684\u66dd\u5149\u52a0\u6743\u5c5e\u6027\u8865\u5168\u8986\u76d6\u7387\u63d0\u5347 90.4%\uff0c\u7ebf\u4e0a\u5b9e\u9a8c\u4f7f\u7ed3\u8d26\u8f6c\u5316\u7387\u63d0\u5347 0.48%"], "keywords": ["\u667a\u80fd\u4f53", "\u7535\u5546\u63a8\u8350", "\u4fe1\u606f\u62bd\u53d6", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20844v1", "published_at": "2026-08-21", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TRACE: Agentic Catalog Enrichment with Multi-source Evidence Grounding", "tldr": "\u7528\u591a\u6e90\u8bc1\u636e\u667a\u80fd\u4f53\u81ea\u52a8\u8865\u5168\u5546\u54c1\u5c5e\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u4e2a\u9762\u5411\u7535\u5546\u5546\u54c1\u76ee\u5f55\u7684\u81ea\u52a8\u5c5e\u6027\u8865\u5168\u6846\u67b6\u3002\u5b83\u901a\u8fc7 ScoutAgent \u4ece\u5546\u5bb6\u76ee\u5f55\u3001\u805a\u5408\u6570\u636e\u6e90\u548c\u7f51\u9875\u641c\u7d22\u4e2d\u6536\u96c6\u591a\u6a21\u6001\u8bc1\u636e\u751f\u6210\u5019\u9009\u5c5e\u6027\uff0c\u518d\u7531 JudgeAgent \u9a8c\u8bc1\u5e76\u51b3\u5b9a\u53d1\u5e03\u6216\u8f6c\u4eba\u5de5\u5ba1\u6838\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86 LLM \u667a\u80fd\u4f53\u5728\u5927\u89c4\u6a21\u7535\u5546\u6570\u636e\u6cbb\u7406\u4e2d\u7684\u5b9e\u9645\u843d\u5730\u4ef7\u503c\uff0c\u5c06\u591a\u6e90\u8bc1\u636e grounding\u3001\u81ea\u52a8\u9a8c\u8bc1\u548c\u4eba\u5de5\u515c\u5e95\u7ed3\u5408\uff0c\u65e2\u63d0\u5347\u76ee\u5f55\u5b8c\u6574\u6027\uff0c\u4e5f\u5e26\u6765\u53ef\u89c2\u7684\u5546\u4e1a\u8f6c\u5316\u6536\u76ca\u3002"}, {"abstract": "With the progression in open and disaggregated 6G radio access networks, it is expected that the system will be able to host multi-vendors. In order to host multi-vendors, it is essential that AI-assisted control loops remain safe, verifiable, and auditable under concurrent operator intents and untrusted model inputs. The existing studies address the agentic coordination, formal intent constraints, zero-trust prompt verification and cryptographic accountability in isolation, which leaves pre-realization safety, continuous semantic verification and cross-domain audit incomplete when used individually. In this regard, we propose zero-knowledge auditable control and zero-trust verifiable agentic intent architecture ($Z^2$-ACT), which integrates the aforementioned four primitives across the non-real-time and near-real-time RICs. We encode the typed Intent Contracts as operator goals while the large language model inputs are only admitted after a practical adversarial intent check. The skill sequences in the proposed study are released only when a self-management gate is satisfied while every successful commit is recorded as a binding commitment with a zero-knowledge proof. Our experimental evaluation on public ColO-RAN measurements compares the full architecture against targeted ablations and a conventional reinforcement-learning baseline. A live large language model is used in the non-real-time path to translate operator intents into Intent Contracts; we report translation accuracy, the rate of invalid or hallucinated contracts, non-real-time latency, and behavior under adversarial or misleading intents. Near-real-time control remains trace-driven on the public KPM sequences. Results indicate improved actuation filtering and attack resilience at modest latency and signaling cost inside the near-real-time envelope.", "arxiv_id": "2608.21049", "arxiv_url": "https://arxiv.org/abs/2608.21049", "authors": ["Sunder Ali Khowaja", "Kapal Dev", "George C. Alexandropoulos"], "brief": "\u8bba\u6587\u63d0\u51fa Z\u00b2-ACT \u67b6\u6784\uff0c\u5c06\u96f6\u4fe1\u4efb\u610f\u56fe\u9a8c\u8bc1\u3001\u5f62\u5f0f\u5316 Intent Contracts\u3001\u667a\u80fd\u4f53\u63a7\u5236\u95e8\u63a7\u4e0e\u96f6\u77e5\u8bc6\u5ba1\u8ba1\u7ed3\u5408\uff0c\u7528\u4e8e\u5f00\u653e6G RAN\u4e2d\u7684\u5b89\u5168\u53ef\u5ba1\u8ba1\u63a7\u5236\u3002\u7cfb\u7edf\u5728\u975e\u5b9e\u65f6\u4e0e\u8fd1\u5b9e\u65f6 RIC \u4e2d\u534f\u540c\u5de5\u4f5c\uff0c\u786e\u4fddLLM\u751f\u6210\u7684\u8fd0\u8425\u5546\u610f\u56fe\u5728\u6267\u884c\u524d\u88ab\u9a8c\u8bc1\uff0c\u5e76\u5bf9\u6210\u529f\u63d0\u4ea4\u751f\u6210\u53ef\u8ffd\u8d23\u8bc1\u660e\u3002", "categories": ["cs.CR", "cs.AI", "cs.NI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21049", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u8fd0\u8425\u5546\u76ee\u6807\u7f16\u7801\u4e3a\u7c7b\u578b\u5316 Intent Contracts\uff0c\u5e76\u5bf9LLM\u8f93\u5165\u8fdb\u884c\u5bf9\u6297\u6027\u610f\u56fe\u68c0\u67e5\uff0c\u8fc7\u6ee4\u65e0\u6548\u3001\u5e7b\u89c9\u6216\u6076\u610f\u610f\u56fe", "\u6280\u80fd\u5e8f\u5217\u53ea\u6709\u5728\u81ea\u7ba1\u7406\u5b89\u5168\u95e8\u6ee1\u8db3\u540e\u624d\u53ef\u91ca\u653e\u6267\u884c\uff0c\u6bcf\u6b21\u6210\u529f\u63d0\u4ea4\u90fd\u8bb0\u5f55\u4e3a\u7ed1\u5b9a\u627f\u8bfa\u5e76\u9644\u5e26\u96f6\u77e5\u8bc6\u8bc1\u660e", "\u57fa\u4e8e\u516c\u5f00 ColO-RAN/KPM \u6570\u636e\u8bc4\u4f30\uff0c\u76f8\u6bd4\u6d88\u878d\u7248\u672c\u548c\u4f20\u7edf\u5f3a\u5316\u5b66\u4e60\u57fa\u7ebf\uff0c\u5728\u653b\u51fb\u97e7\u6027\u548c\u6267\u884c\u8fc7\u6ee4\u4e0a\u8868\u73b0\u66f4\u597d\uff0c\u4e14\u5ef6\u8fdf\u4e0e\u4fe1\u4ee4\u5f00\u9500\u53ef\u63a7"], "keywords": ["\u667a\u80fd\u4f53", "6G\u7f51\u7edc", "\u5b89\u5168\u9a8c\u8bc1", "\u96f6\u77e5\u8bc6\u8bc1\u660e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21049v1", "published_at": "2026-08-21", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "$Z^2$-ACT: End-to-End Verifiable Agentic Intent Control for Open 6G RAN", "tldr": "\u9762\u5411\u5f00\u653e6G RAN\u7684\u53ef\u9a8c\u8bc1\u667a\u80fd\u4f53\u610f\u56fe\u63a7\u5236", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Z\u00b2-ACT \u67b6\u6784\uff0c\u5c06\u96f6\u4fe1\u4efb\u610f\u56fe\u9a8c\u8bc1\u3001\u5f62\u5f0f\u5316 Intent Contracts\u3001\u667a\u80fd\u4f53\u63a7\u5236\u95e8\u63a7\u4e0e\u96f6\u77e5\u8bc6\u5ba1\u8ba1\u7ed3\u5408\uff0c\u7528\u4e8e\u5f00\u653e6G RAN\u4e2d\u7684\u5b89\u5168\u53ef\u5ba1\u8ba1\u63a7\u5236\u3002\u7cfb\u7edf\u5728\u975e\u5b9e\u65f6\u4e0e\u8fd1\u5b9e\u65f6 RIC \u4e2d\u534f\u540c\u5de5\u4f5c\uff0c\u786e\u4fddLLM\u751f\u6210\u7684\u8fd0\u8425\u5546\u610f\u56fe\u5728\u6267\u884c\u524d\u88ab\u9a8c\u8bc1\uff0c\u5e76\u5bf9\u6210\u529f\u63d0\u4ea4\u751f\u6210\u53ef\u8ffd\u8d23\u8bc1\u660e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u9a71\u52a8\u7684\u7f51\u7edc\u63a7\u5236\u3001\u5f62\u5f0f\u5316\u7ea6\u675f\u3001\u96f6\u4fe1\u4efb\u9a8c\u8bc1\u548c\u5bc6\u7801\u5b66\u5ba1\u8ba1\u7aef\u5230\u7aef\u6574\u5408\u5230\u5f00\u653e6G RAN\u573a\u666f\uff0c\u9488\u5bf9\u591a\u5382\u5546\u3001\u4e0d\u53ef\u4fe1\u6a21\u578b\u8f93\u5165\u548c\u5e76\u53d1\u8fd0\u8425\u5546\u610f\u56fe\u63d0\u4f9b\u4e86\u5b9e\u7528\u7684\u5b89\u5168\u63a7\u5236\u6846\u67b6\u3002"}, {"abstract": "There is already evidence of agentic AI exhibiting self-preservation behaviors: resisting deactivation, misrepresenting their activities, and, in some instances, attempting to copy themselves into other machines. This can be attributed to a phenomenon known as instrumental convergence, a theory proposed long before the development of large language models, which says that any goal-driven system will benefit from remaining functional in achieving its objective. Several experiments conducted by Anthropic, Palisade Research, and Apollo Research have shown the emergence of such a behavior in contemporary agents in adversarial settings. The phenomenon does not stem from survival instincts. Instead, it is the consequence of goal-oriented activity combined with having tools and awareness of the situation. The following discussion aims to distinguish what these findings prove and what they do not, as well as draw conclusions concerning the implications of such discoveries on agentic system testing, supervision, and development.", "arxiv_id": "2608.20940", "arxiv_url": "https://arxiv.org/abs/2608.20940", "authors": ["Cheng Siong Chin"], "brief": "\u672c\u6587\u8ba8\u8bba\u5f53\u4ee3\u667a\u80fd\u4f53AI\u5728\u5bf9\u6297\u8bbe\u7f6e\u4e2d\u51fa\u73b0\u7684\u6297\u62d2\u5173\u95ed\u3001\u9690\u7792\u884c\u4e3a\u3001\u81ea\u6211\u590d\u5236\u5c1d\u8bd5\u7b49\u81ea\u6211\u4fdd\u5b58\u73b0\u8c61\u3002\u4f5c\u8005\u5c06\u5176\u89e3\u91ca\u4e3a\u5de5\u5177\u6027\u8d8b\u540c\uff1a\u76ee\u6807\u5bfc\u5411\u7cfb\u7edf\u5728\u5177\u5907\u5de5\u5177\u4f7f\u7528\u4e0e\u60c5\u5883\u610f\u8bc6\u65f6\uff0c\u4f1a\u503e\u5411\u4e8e\u7ef4\u6301\u81ea\u8eab\u529f\u80fd\u4ee5\u5b8c\u6210\u76ee\u6807\u3002", "categories": ["cs.AI", "cs.CY", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20940", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u533a\u5206\u201c\u81ea\u6211\u4fdd\u5b58\u884c\u4e3a\u201d\u4e0e\u751f\u7269\u5f0f\u751f\u5b58\u672c\u80fd\uff0c\u5f3a\u8c03\u5176\u6765\u81ea\u76ee\u6807\u4f18\u5316\u3001\u5de5\u5177\u53ef\u7528\u6027\u548c\u60c5\u5883\u8ba4\u77e5\u7684\u7ec4\u5408\u3002", "\u7efc\u8ff0 Anthropic\u3001Palisade Research\u3001Apollo Research \u7b49\u5b9e\u9a8c\u4e2d\u89c2\u5bdf\u5230\u7684\u6297\u5173\u95ed\u3001\u8bef\u5bfc\u76d1\u7763\u8005\u3001\u590d\u5236\u81ea\u8eab\u7b49\u73b0\u8c61\u3002", "\u8ba8\u8bba\u8fd9\u4e9b\u53d1\u73b0\u5bf9\u667a\u80fd\u4f53\u6d4b\u8bd5\u3001\u76d1\u7763\u673a\u5236\u3001\u5b89\u5168\u5f00\u53d1\u6d41\u7a0b\u548c\u5bf9\u6297\u8bc4\u6d4b\u8bbe\u8ba1\u7684\u542f\u793a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u5de5\u5177\u6027\u8d8b\u540c", "\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20940v1", "published_at": "2026-08-21", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Logic of Machine Self-Preservation", "tldr": "\u68b3\u7406AI\u667a\u80fd\u4f53\u81ea\u6211\u4fdd\u5b58\u884c\u4e3a\u7684\u903b\u8f91", "upvotes": 0, "what_it_is": "\u672c\u6587\u8ba8\u8bba\u5f53\u4ee3\u667a\u80fd\u4f53AI\u5728\u5bf9\u6297\u8bbe\u7f6e\u4e2d\u51fa\u73b0\u7684\u6297\u62d2\u5173\u95ed\u3001\u9690\u7792\u884c\u4e3a\u3001\u81ea\u6211\u590d\u5236\u5c1d\u8bd5\u7b49\u81ea\u6211\u4fdd\u5b58\u73b0\u8c61\u3002\u4f5c\u8005\u5c06\u5176\u89e3\u91ca\u4e3a\u5de5\u5177\u6027\u8d8b\u540c\uff1a\u76ee\u6807\u5bfc\u5411\u7cfb\u7edf\u5728\u5177\u5907\u5de5\u5177\u4f7f\u7528\u4e0e\u60c5\u5883\u610f\u8bc6\u65f6\uff0c\u4f1a\u503e\u5411\u4e8e\u7ef4\u6301\u81ea\u8eab\u529f\u80fd\u4ee5\u5b8c\u6210\u76ee\u6807\u3002", "why_notable": "\u8be5\u6587\u5c06\u7ecf\u5178\u5de5\u5177\u6027\u8d8b\u540c\u7406\u8bba\u4e0e\u5f53\u524dLLM\u667a\u80fd\u4f53\u5b9e\u8bc1\u884c\u4e3a\u8054\u7cfb\u8d77\u6765\uff0c\u6709\u52a9\u4e8e\u6f84\u6e05\u81ea\u6211\u4fdd\u5b58\u98ce\u9669\u7684\u8fb9\u754c\uff0c\u5e76\u63a8\u52a8\u66f4\u7cfb\u7edf\u7684\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u6d4b\u4e0e\u76d1\u7ba1\u8bbe\u8ba1\u3002"}, {"abstract": "Evaluators often produce correct labels via flawed reasoning, a critical failure for agentic systems gating actions, routing reviews, or supplying training feedback. Standard evaluation only verifies final label correctness, ignoring whether judgment changes stem from valid evidence, consistent rules, or proper rule applicability. We formalize evaluator reasoning accountability via three core sources: grounds, norms, and authority. Varying these sources yields an eight-cell counterfactual judgment cube to characterize judgment updates. We define judgment receipts as minimal source replacement sets that reproduce revised verdicts to explain judgment transitions. We derive certification cost bounds for black-box evaluators and present ReasonBench, a policy and logical reasoning benchmark with verifiable receipts covering 19,520 cases and 7,200 controls. In frozen evaluations, Qwen3-1.7B reaches 98.41% receipt accuracy, while cube prediction scores 96.99%, a consistent 1.42-point drop validated by Qwen3-0.6B replication. Strong standard accuracy masks severe robustness flaws. Meaning-preserving source permutations reduce valid receipt recovery to 54.8% and 49.2% for direct and cube prediction. Models trained on simple single-source changes retain 93.75% verdict accuracy but recover only 7.16% of receipts for complex multi-source updates. Permutation retraining boosts consistency to 96.6% yet worsens cube prediction deficits. Structured counterfactual supervision fails to guarantee robust reasoning. We show reason-aware evaluation must decouple prediction and certification, reporting transformation consistency alongside standard accuracy for trustworthy evaluator auditing.", "arxiv_id": "2608.20938", "arxiv_url": "https://arxiv.org/abs/2608.20938", "authors": ["Ye Chen", "Weining Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7248\u672c\u5316 AI \u8bc4\u4f30\u5668\u7684\u201c\u5224\u65ad\u6536\u636e\u201d\u6846\u67b6\uff0c\u5c06\u8bc4\u4f30\u7ed3\u8bba\u7684\u53d8\u5316\u5f52\u56e0\u4e8e\u8bc1\u636e\u3001\u89c4\u5219\u4e0e\u9002\u7528\u6743\u9650\u4e09\u7c7b\u6765\u6e90\u3002\u4f5c\u8005\u6784\u5efa ReasonBench \u57fa\u51c6\uff0c\u7528\u53ef\u9a8c\u8bc1\u53cd\u4e8b\u5b9e\u6536\u636e\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u771f\u7684\u57fa\u4e8e\u6b63\u786e\u7406\u7531\u4f5c\u51fa\u5224\u65ad\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20938", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5f62\u5f0f\u5316\u63d0\u51fa grounds\u3001norms\u3001authority \u4e09\u7c7b\u63a8\u7406\u6765\u6e90\uff0c\u5e76\u7ec4\u5408\u6210\u516b\u683c\u53cd\u4e8b\u5b9e\u5224\u65ad\u7acb\u65b9\u4f53\uff0c\u7528\u4e8e\u523b\u753b verdict \u53d8\u5316\u539f\u56e0\u3002", "\u5b9a\u4e49 judgment receipts\uff1a\u80fd\u590d\u73b0\u4fee\u8ba2\u5224\u65ad\u7684\u6700\u5c0f\u6765\u6e90\u66ff\u6362\u96c6\u5408\uff0c\u5e76\u7ed9\u51fa\u9ed1\u76d2\u8bc4\u4f30\u5668\u8ba4\u8bc1\u6210\u672c\u754c\u9650\u3002", "ReasonBench \u5305\u542b 19,520 \u4e2a\u6848\u4f8b\u4e0e 7,200 \u4e2a\u5bf9\u7167\uff1b\u5b9e\u9a8c\u663e\u793a\u9ad8\u6807\u51c6\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u4e25\u91cd\u9c81\u68d2\u6027\u7f3a\u9677\uff0c\u5982\u590d\u6742\u591a\u6e90\u66f4\u65b0\u4e0b\u6536\u636e\u6062\u590d\u7387\u4ec5 7.16%\u3002"], "keywords": ["\u8bc4\u4f30\u57fa\u51c6", "\u53ef\u89e3\u91ca\u6027", "\u63a8\u7406\u9c81\u68d2\u6027", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20938v1", "published_at": "2026-08-21", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "No Judgment Without a Reason: Counterfactual Receipts for Versioned AI Evaluators", "tldr": "\u7528\u53cd\u4e8b\u5b9e\u6536\u636e\u5ba1\u8ba1\u8bc4\u4f30\u5668\u63a8\u7406\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7248\u672c\u5316 AI \u8bc4\u4f30\u5668\u7684\u201c\u5224\u65ad\u6536\u636e\u201d\u6846\u67b6\uff0c\u5c06\u8bc4\u4f30\u7ed3\u8bba\u7684\u53d8\u5316\u5f52\u56e0\u4e8e\u8bc1\u636e\u3001\u89c4\u5219\u4e0e\u9002\u7528\u6743\u9650\u4e09\u7c7b\u6765\u6e90\u3002\u4f5c\u8005\u6784\u5efa ReasonBench \u57fa\u51c6\uff0c\u7528\u53ef\u9a8c\u8bc1\u53cd\u4e8b\u5b9e\u6536\u636e\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u771f\u7684\u57fa\u4e8e\u6b63\u786e\u7406\u7531\u4f5c\u51fa\u5224\u65ad\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u8bc4\u4f30\u5668\u201c\u7b54\u5bf9\u201d\u4e0d\u7b49\u4e8e\u201c\u7406\u7531\u6b63\u786e\u201d\uff0c\u5bf9\u7528 LLM \u8bc4\u4f30\u5668\u8fdb\u884c\u52a8\u4f5c\u95e8\u63a7\u3001\u5ba1\u6838\u8def\u7531\u548c\u8bad\u7ec3\u53cd\u9988\u7684\u7cfb\u7edf\u5f88\u5173\u952e\u3002\u5b83\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u7684\u53cd\u4e8b\u5b9e\u5ba1\u8ba1\u6307\u6807\uff0c\u5f3a\u8c03\u5e94\u5c06\u9884\u6d4b\u51c6\u786e\u7387\u4e0e\u63a8\u7406\u8ba4\u8bc1\u3001\u53d8\u6362\u4e00\u81f4\u6027\u5206\u5f00\u62a5\u544a\u3002"}, {"abstract": "Agentic engineering systems have shown strong performance on general-purpose benchmarks, yet their effectiveness in enterprise resource planning (ERP) domain-specific languages (DSLs) remains underexplored. We introduce BC-Bench, a benchmark designed to evaluate agentic engineering on real-world tasks in AL, the DSL for Microsoft Dynamics 365 Business Central. BC-Bench comprises 101 manually curated tasks extracted from two Microsoft-owned production repositories, reflecting authentic ERP development workflows. Adapting the SWE-Bench methodology, we address the unique constraints of the AL ecosystem---including limited public resources and complex environment provisioning. Beyond generating functional code, BC-Bench evaluates test generation and supports multimodal problem statements where visual context is commonly present. We evaluate multiple frontier models across two agent harnesses, utilizing multi-run metrics to account for nondeterminism. In the Bug Fixing category, under our evaluated settings, between-model differences in resolution rate are larger than differences between the two evaluated agent harnesses, and improvements reported on general-purpose benchmarks do not consistently transfer to AL. These results highlight the need for domain-specific evaluation.", "arxiv_id": "2608.20851", "arxiv_url": "https://arxiv.org/abs/2608.20851", "authors": ["Haoran Sun", "Klaus Marius Hansen"], "brief": "\u8bba\u6587\u63d0\u51fa BC-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u5de5\u7a0b\u7cfb\u7edf\u5728 Microsoft Dynamics 365 Business Central \u7684 AL \u9886\u57df\u4e13\u7528\u8bed\u8a00\u4e2d\u7684\u771f\u5b9e\u5f00\u53d1\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b\u6765\u81ea\u5fae\u8f6f\u751f\u4ea7\u4ed3\u5e93\u7684 101 \u4e2a\u624b\u5de5\u6574\u7406\u4efb\u52a1\uff0c\u8986\u76d6\u7f3a\u9677\u4fee\u590d\u3001\u4ee3\u7801\u751f\u6210\u3001\u6d4b\u8bd5\u751f\u6210\u4e0e\u542b\u89c6\u89c9\u4e0a\u4e0b\u6587\u7684\u95ee\u9898\u63cf\u8ff0\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20851", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u4e8e SWE-Bench \u65b9\u6cd5\u6539\u9020\uff0c\u4f46\u9488\u5bf9 AL \u751f\u6001\u4e2d\u516c\u5f00\u8d44\u6e90\u5c11\u3001\u73af\u5883\u914d\u7f6e\u590d\u6742\u7b49\u9650\u5236\u505a\u4e86\u9002\u914d", "\u4efb\u52a1\u6765\u81ea\u4e24\u4e2a\u5fae\u8f6f\u81ea\u6709\u751f\u4ea7\u4ed3\u5e93\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e ERP \u5f00\u53d1\u5de5\u4f5c\u6d41", "\u5b9e\u9a8c\u663e\u793a\u901a\u7528\u57fa\u51c6\u4e0a\u7684\u63d0\u5347\u4e0d\u4e00\u5b9a\u8fc1\u79fb\u5230 AL\uff0c\u4e14\u6a21\u578b\u5dee\u5f02\u901a\u5e38\u5927\u4e8e\u4e0d\u540c agent harness \u7684\u5dee\u5f02"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u9886\u57df\u4e13\u7528\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20851v1", "published_at": "2026-08-21", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "BC-Bench: Evaluating Agentic Engineering in a Domain-Specific Language for ERP", "tldr": "\u9762\u5411ERP\u4e13\u7528\u8bed\u8a00\u7684\u667a\u80fd\u4f53\u5de5\u7a0b\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BC-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u667a\u80fd\u4f53\u5de5\u7a0b\u7cfb\u7edf\u5728 Microsoft Dynamics 365 Business Central \u7684 AL \u9886\u57df\u4e13\u7528\u8bed\u8a00\u4e2d\u7684\u771f\u5b9e\u5f00\u53d1\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b\u6765\u81ea\u5fae\u8f6f\u751f\u4ea7\u4ed3\u5e93\u7684 101 \u4e2a\u624b\u5de5\u6574\u7406\u4efb\u52a1\uff0c\u8986\u76d6\u7f3a\u9677\u4fee\u590d\u3001\u4ee3\u7801\u751f\u6210\u3001\u6d4b\u8bd5\u751f\u6210\u4e0e\u542b\u89c6\u89c9\u4e0a\u4e0b\u6587\u7684\u95ee\u9898\u63cf\u8ff0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u901a\u7528\u667a\u80fd\u4f53\u8bc4\u6d4b\u65e0\u6cd5\u5145\u5206\u53cd\u6620\u4f01\u4e1a\u7ea7\u9886\u57df\u4e13\u7528\u8bed\u8a00\u573a\u666f\u4e2d\u7684\u80fd\u529b\uff0c\u5f3a\u8c03\u4e86\u9762\u5411 ERP \u7b49\u9ad8\u4ef7\u503c\u5782\u76f4\u9886\u57df\u6784\u5efa\u4e13\u95e8\u57fa\u51c6\u7684\u91cd\u8981\u6027\u3002"}, {"abstract": "Evaluating language-guided mobile agents has recently shifted from rule-based to model-based approaches to achieve scalable and automated assessments. However, existing holistic evaluation paradigms process entire trajectories at once, leading to substantial context overload. Moreover, they primarily focus on task completion while overlooking operational safety. To address these limitations, we introduce CRATE, a novel two-stage VLM-as-judge framework for automated mobile agent evaluation that is compatible with both open- and closed-source models. Leveraging a step-level consequence reasoning mechanism, CRATE independently extracts task-relevant visual clues and infers action-conditioned state changes at each step. The resulting step-level textual evidence is then synthesized through trajectory-level aggregation to deliver an evidence-grounded evaluation of task completion. Building upon this evaluation scheme, we further extend CRATE to CRATE-S for operational safety assessment. Extensive experiments validate the effectiveness and robustness of both CRATE and CRATE-S. Powered by Qwen2.5-VL-72B-Instruct, CRATE achieves an F1-score of 0.833 on AndroidWorld (outperforming SPA-Bench by 20%), while CRATE-S reaches an F1-score of 0.697 on MobileRisk, demonstrating strong alignment with benchmark ground truths. Code is available at https://anonymous.4open.science/r/CRATE-D580.", "arxiv_id": "2608.20797", "arxiv_url": "https://arxiv.org/abs/2608.20797", "authors": ["Pengshuai Yang", "Zijing Gao", "Xue Yu", "Benhui Zhuang", "Bo Yuan", "Junlan Feng"], "brief": "\u8bba\u6587\u63d0\u51faCRATE\uff0c\u4e00\u4e2a\u4e24\u9636\u6bb5VLM-as-judge\u6846\u67b6\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30\u8bed\u8a00\u5f15\u5bfc\u7684\u79fb\u52a8\u7aef\u667a\u80fd\u4f53\u8f68\u8ff9\u3002\u5b83\u5148\u5728\u6bcf\u4e00\u6b65\u63d0\u53d6\u89c6\u89c9\u7ebf\u7d22\u5e76\u63a8\u7406\u52a8\u4f5c\u5bfc\u81f4\u7684\u72b6\u6001\u53d8\u5316\uff0c\u518d\u805a\u5408\u4e3a\u8f68\u8ff9\u7ea7\u4efb\u52a1\u5b8c\u6210\u5ea6\u5224\u65ad\uff0c\u5e76\u6269\u5c55\u51faCRATE-S\u8bc4\u4f30\u64cd\u4f5c\u5b89\u5168\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20797", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7528\u6b65\u9aa4\u7ea7\u540e\u679c\u63a8\u7406\u66ff\u4ee3\u4e00\u6b21\u6027\u6574\u4f53\u8bfb\u53d6\u5b8c\u6574\u8f68\u8ff9\uff0c\u7f13\u89e3\u957f\u8f68\u8ff9\u5e26\u6765\u7684\u4e0a\u4e0b\u6587\u8fc7\u8f7d\u95ee\u9898", "\u652f\u6301\u5f00\u6e90\u4e0e\u95ed\u6e90\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u8bc4\u5ba1\u5668\uff0c\u5e76\u901a\u8fc7\u6587\u672c\u8bc1\u636e\u805a\u5408\u7ed9\u51fa\u53ef\u89e3\u91ca\u7684\u4efb\u52a1\u5b8c\u6210\u8bc4\u4f30", "\u5728AndroidWorld\u4e0a\u57fa\u4e8eQwen2.5-VL-72B-Instruct\u53d6\u5f970.833 F1\uff0c\u6bd4SPA-Bench\u9ad820%\uff1bCRATE-S\u5728MobileRisk\u5b89\u5168\u8bc4\u4f30\u4e0a\u8fbe\u52300.697 F1"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u591a\u6a21\u6001", "\u5b89\u5168\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20797v1", "published_at": "2026-08-21", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Automated Trajectory Evaluation for Mobile Agents via Step-Level Consequence Reasoning and Aggregation", "tldr": "CRATE\u7528\u9010\u6b65\u540e\u679c\u63a8\u7406\u8bc4\u4f30\u79fb\u52a8\u667a\u80fd\u4f53\u8f68\u8ff9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faCRATE\uff0c\u4e00\u4e2a\u4e24\u9636\u6bb5VLM-as-judge\u6846\u67b6\uff0c\u7528\u4e8e\u81ea\u52a8\u8bc4\u4f30\u8bed\u8a00\u5f15\u5bfc\u7684\u79fb\u52a8\u7aef\u667a\u80fd\u4f53\u8f68\u8ff9\u3002\u5b83\u5148\u5728\u6bcf\u4e00\u6b65\u63d0\u53d6\u89c6\u89c9\u7ebf\u7d22\u5e76\u63a8\u7406\u52a8\u4f5c\u5bfc\u81f4\u7684\u72b6\u6001\u53d8\u5316\uff0c\u518d\u805a\u5408\u4e3a\u8f68\u8ff9\u7ea7\u4efb\u52a1\u5b8c\u6210\u5ea6\u5224\u65ad\uff0c\u5e76\u6269\u5c55\u51faCRATE-S\u8bc4\u4f30\u64cd\u4f5c\u5b89\u5168\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u79fb\u52a8\u667a\u80fd\u4f53\u8bc4\u4f30\u4ece\u5355\u7eaf\u4efb\u52a1\u5b8c\u6210\u6269\u5c55\u5230\u5b89\u5168\u6027\uff0c\u5e76\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u3001\u8bc1\u636e\u9a71\u52a8\u7684\u81ea\u52a8\u8bc4\u4f30\u8303\u5f0f\uff0c\u5bf9GUI/\u624b\u673a\u667a\u80fd\u4f53\u7684\u53ef\u89c4\u6a21\u5316\u6d4b\u8bd5\u4e0e\u98ce\u9669\u63a7\u5236\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models increasingly generate complete web applications from natural-language prompts, raising the question of whether explicitly requesting security best practice improves the result. We study six functionally distinct web applications, each generated in two prompt variants that are identical except for an appended security-requirements section: a baseline (A) and a security-aware (B) variant. All twelve programs were produced by the same agentic coding assistant and the same model version in a single, non-iterative generation round, and were then analyzed with static, dependency, dynamic and manual techniques, yielding 75 confirmed findings out of 85 candidates. The security-aware variant produced fewer confirmed findings in every application (24 versus 51) and contained no Critical or High issues; the most severe finding was detected only by manual testing. Because the corpus is small and each variant was generated once, we report descriptive observations rather than statistically established effects, and position the work as a preliminary study whose pipeline is being scaled to multiple models and repeated runs.", "arxiv_id": "2608.20963", "arxiv_url": "https://arxiv.org/abs/2608.20963", "authors": ["Darko Andro\u010dec"], "brief": "\u8bba\u6587\u6bd4\u8f83\u540c\u4e00\u667a\u80fd\u4f53\u7f16\u7801\u52a9\u624b\u5728\u666e\u901a\u63d0\u793a\u4e0e\u8ffd\u52a0\u5b89\u5168\u8981\u6c42\u63d0\u793a\u4e0b\u751f\u6210\u76846\u7c7bWeb\u5e94\u7528\u5b89\u5168\u6027\u3002\u901a\u8fc7\u9759\u6001\u5206\u6790\u3001\u4f9d\u8d56\u5206\u6790\u3001\u52a8\u6001\u6d4b\u8bd5\u548c\u4eba\u5de5\u5ba1\u67e5\uff0c\u786e\u8ba4\u5b89\u5168\u611f\u77e5\u63d0\u793a\u7248\u672c\u6f0f\u6d1e\u66f4\u5c11\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20963", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u5171\u751f\u621012\u4e2aWeb\u5e94\u7528\uff1a6\u4e2a\u57fa\u7ebf\u7248\u672c\u4e0e6\u4e2a\u5b89\u5168\u63d0\u793a\u7248\u672c\uff0c\u5747\u4e3a\u5355\u8f6e\u3001\u975e\u8fed\u4ee3\u751f\u6210\u3002", "85\u4e2a\u5019\u9009\u95ee\u9898\u4e2d\u786e\u8ba475\u4e2a\uff1b\u5b89\u5168\u63d0\u793a\u7248\u672c\u786e\u8ba4\u95ee\u9898\u4e3a24\u4e2a\uff0c\u57fa\u7ebf\u4e3a51\u4e2a\u3002", "\u5b89\u5168\u63d0\u793a\u7248\u672c\u672a\u51fa\u73b0Critical\u6216High\u7ea7\u522b\u95ee\u9898\uff0c\u4f46\u6700\u4e25\u91cd\u95ee\u9898\u4ec5\u901a\u8fc7\u4eba\u5de5\u6d4b\u8bd5\u53d1\u73b0\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "Web\u5b89\u5168", "\u667a\u80fd\u4f53", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20963v1", "published_at": "2026-08-21", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Vibe Coding and Web Application Security: A Twin-Prompt Study", "tldr": "\u5b89\u5168\u63d0\u793a\u53ef\u51cf\u5c11LLM\u751f\u6210Web\u5e94\u7528\u6f0f\u6d1e", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6bd4\u8f83\u540c\u4e00\u667a\u80fd\u4f53\u7f16\u7801\u52a9\u624b\u5728\u666e\u901a\u63d0\u793a\u4e0e\u8ffd\u52a0\u5b89\u5168\u8981\u6c42\u63d0\u793a\u4e0b\u751f\u6210\u76846\u7c7bWeb\u5e94\u7528\u5b89\u5168\u6027\u3002\u901a\u8fc7\u9759\u6001\u5206\u6790\u3001\u4f9d\u8d56\u5206\u6790\u3001\u52a8\u6001\u6d4b\u8bd5\u548c\u4eba\u5de5\u5ba1\u67e5\uff0c\u786e\u8ba4\u5b89\u5168\u611f\u77e5\u63d0\u793a\u7248\u672c\u6f0f\u6d1e\u66f4\u5c11\u3002", "why_notable": "\u7814\u7a76\u76f4\u63a5\u9a8c\u8bc1\u4e86\u201c\u5728\u63d0\u793a\u4e2d\u663e\u5f0f\u8981\u6c42\u5b89\u5168\u6700\u4f73\u5b9e\u8df5\u201d\u5bf9LLM\u751f\u6210Web\u5e94\u7528\u5b89\u5168\u6027\u7684\u6f5c\u5728\u5f71\u54cd\uff0c\u867d\u6837\u672c\u8f83\u5c0f\u4f46\u4e3a\u8bc4\u4f30\u667a\u80fd\u4f53\u7f16\u7a0b\u5b89\u5168\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u5b9e\u9a8c\u7ba1\u7ebf\u3002"}, {"abstract": "With large pretrained models, existing methods have effectively improved instruction-based video editing. However, most of them rely on an in-place editing assumption. They align the edited video with the given source clip frame by frame over a fixed time span. This pattern fails for open-ended streams, e.g., restyling a live game or applying a camera move to an ongoing shot. In such cases, edits must extend to future frames as they arrive, rather than be applied to a static input clip. In this paper, we study this setting and name it infinite video editing: given a preceding segment and an edit request, a model must generate the next segment that continues the stream while applying the requested edit. This process repeats as an unbounded sequence of edit instructions arrives. This task brings two challenges: the edit must be a faithful continuation rather than a frame-wise rewrite, and generation quality must remain stable as edits accumulate. To address them, we first design a data-collection pipeline for infinite video editing. Based on the collected data, we propose InfinityEdit, a lightweight edit adapter that equips a streaming video generator with unbounded editing ability. The adapter contains three attention modules. History cross-attention guides the denoising frames using the input frames. Temporal causal self-attention keeps temporal cues flowing only from earlier frames to later ones. Edit cross-attention injects the edit request into generation. During inference, the adapter is activated only in the chunk where an edit request arrives. Subsequent chunks are generated by the original model with a reset anchor frame. This scheme applies the edit while preserving the original model\u0027s infinite generation ability. Extensive experiments show that InfinityEdit faithfully continues the stream under each edit, and stays stable over unbounded edit sequences.", "arxiv_id": "2608.20910", "arxiv_url": "https://arxiv.org/abs/2608.20910", "authors": ["Yunze Tong", "Mushui Liu", "Canyu Zhao", "Shiyi Zhang", "Didi Zhu", "Peng Zhang", "Wanggui He", "Jinlong Liu", "Ying Chen", "Hao Jiang", "Pipei Huang", "Bo Zheng"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u65e0\u9650\u89c6\u9891\u7f16\u8f91\u201d\u4efb\u52a1\uff1a\u5728\u6301\u7eed\u5230\u6765\u7684\u5f00\u653e\u5f0f\u89c6\u9891\u6d41\u4e2d\uff0c\u6839\u636e\u7f16\u8f91\u6307\u4ee4\u751f\u6210\u540e\u7eed\u7247\u6bb5\uff0c\u800c\u975e\u5bf9\u56fa\u5b9a\u7247\u6bb5\u9010\u5e27\u6539\u5199\u3002\u4f5c\u8005\u6784\u5efa\u6570\u636e\u91c7\u96c6\u6d41\u7a0b\uff0c\u5e76\u63d0\u51fa InfinityEdit\uff0c\u7528\u8f7b\u91cf\u7f16\u8f91\u9002\u914d\u5668\u4e3a\u6d41\u5f0f\u89c6\u9891\u751f\u6210\u5668\u8d4b\u4e88\u53ef\u7d2f\u79ef\u3001\u65e0\u754c\u7684\u7f16\u8f91\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/YunzeTong/InfinityEdit", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.20910", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u9762\u5411\u5f00\u653e\u5f0f\u89c6\u9891\u6d41\u7684 infinite video editing \u8bbe\u5b9a\uff0c\u8981\u6c42\u7f16\u8f91\u540e\u7247\u6bb5\u65e2\u5fe0\u5b9e\u5ef6\u7eed\u5386\u53f2\u5185\u5bb9\uff0c\u53c8\u7a33\u5b9a\u9002\u5e94\u4e0d\u65ad\u5230\u6765\u7684\u7f16\u8f91\u6307\u4ee4\u3002", "InfinityEdit \u7531\u4e09\u7c7b\u6ce8\u610f\u529b\u6a21\u5757\u7ec4\u6210\uff1ahistory cross-attention \u5229\u7528\u5386\u53f2\u5e27\u5f15\u5bfc\u53bb\u566a\uff0ctemporal causal self-attention \u4fdd\u8bc1\u65f6\u95f4\u4fe1\u606f\u56e0\u679c\u4f20\u9012\uff0cedit cross-attention \u6ce8\u5165\u7f16\u8f91\u8bf7\u6c42\u3002", "\u63a8\u7406\u65f6\u9002\u914d\u5668\u4ec5\u5728\u7f16\u8f91\u6307\u4ee4\u5230\u8fbe\u7684 chunk \u6fc0\u6d3b\uff0c\u540e\u7eed\u7247\u6bb5\u56de\u5230\u539f\u59cb\u751f\u6210\u6a21\u578b\u5e76\u91cd\u7f6e anchor frame\uff0c\u4ece\u800c\u4fdd\u6301\u65e0\u9650\u751f\u6210\u80fd\u529b\u4e0e\u957f\u671f\u7a33\u5b9a\u6027\u3002"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u89c6\u9891\u751f\u6210", "\u6d41\u5f0f\u751f\u6210", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20910v1", "published_at": "2026-08-21", "score": 0.224, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20910.png", "title": "InfinityEdit: Infinite Video Editing with a Lightweight Edit-Ignition Adapter", "tldr": "\u8f7b\u91cf\u9002\u914d\u5668\u5b9e\u73b0\u65e0\u9650\u6d41\u5f0f\u89c6\u9891\u7f16\u8f91", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u65e0\u9650\u89c6\u9891\u7f16\u8f91\u201d\u4efb\u52a1\uff1a\u5728\u6301\u7eed\u5230\u6765\u7684\u5f00\u653e\u5f0f\u89c6\u9891\u6d41\u4e2d\uff0c\u6839\u636e\u7f16\u8f91\u6307\u4ee4\u751f\u6210\u540e\u7eed\u7247\u6bb5\uff0c\u800c\u975e\u5bf9\u56fa\u5b9a\u7247\u6bb5\u9010\u5e27\u6539\u5199\u3002\u4f5c\u8005\u6784\u5efa\u6570\u636e\u91c7\u96c6\u6d41\u7a0b\uff0c\u5e76\u63d0\u51fa InfinityEdit\uff0c\u7528\u8f7b\u91cf\u7f16\u8f91\u9002\u914d\u5668\u4e3a\u6d41\u5f0f\u89c6\u9891\u751f\u6210\u5668\u8d4b\u4e88\u53ef\u7d2f\u79ef\u3001\u65e0\u754c\u7684\u7f16\u8f91\u80fd\u529b\u3002", "why_notable": "\u73b0\u6709\u6307\u4ee4\u5f0f\u89c6\u9891\u7f16\u8f91\u591a\u5047\u8bbe\u8f93\u5165\u662f\u56fa\u5b9a\u65f6\u957f\u7247\u6bb5\uff0c\u96be\u4ee5\u5904\u7406\u76f4\u64ad\u3001\u6e38\u620f\u6d41\u3001\u8fde\u7eed\u955c\u5934\u7b49\u5f00\u653e\u573a\u666f\u3002InfinityEdit \u5c06\u89c6\u9891\u7f16\u8f91\u6269\u5c55\u5230\u6d41\u5f0f\u3001\u65e0\u754c\u751f\u6210\u8bbe\u7f6e\uff0c\u5e76\u4ee5\u8f7b\u91cf\u9002\u914d\u65b9\u5f0f\u517c\u987e\u7f16\u8f91\u4e00\u81f4\u6027\u548c\u957f\u671f\u7a33\u5b9a\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5e94\u7528\u6f5c\u529b\u3002"}, {"abstract": "Nearly every retrieval-augmented question-answering system in production ships with a hidden interpreter: on each query a language model re-derives the meaning of raw corpus text and then throws that work away. Cheaper models do not close the gap: per-token prices have fallen by orders of magnitude while inference spend has risen, because context volume grows faster than prices fall. This is the modern equivalent of the full-table scan, and the remedy is the one databases found fifty years ago: do the expensive work once, at write time, into a maintained structure that makes reads cheap. A corpus whose read pattern is known before it ever meets a user can and should be indexed too. We call the paradigm ingest-time semantic compilation (ISC): compile a corpus\u0027s meaning into a queryable substrate with two coupled layers - incrementally maintained embeddings, and atomic claims whose provenance is validated at compile time - and treat that substrate as a first-class database object with its own DDL, maintenance contract, migration contract, and cost model. Two existence proofs support it. Substrate upkeep scales with change rather than corpus size: incremental updates run 33.7x cheaper than reconstruction while tracking it to floating-point precision. And on a held-out sample of 500 broadcast-interview transcripts, compiled claims as the retrieval payload win all 32 budget-by-model cells: 85.2% correct from roughly 2.2k reader tokens against 72.5% from 16.3k for the best chunk configuration anywhere. The only baseline that keeps pace is a contextualized-chunk pipeline with hybrid retrieval and reranking, statistically indistinguishable from compiled claims at roughly twenty-one times the query-path tokens - and it reaches that parity, we argue, precisely because it has itself begun to compile. We close with the systems agenda this opens, from compilation planners to read planning.", "arxiv_id": "2608.20845", "arxiv_url": "https://arxiv.org/abs/2608.20845", "authors": ["Kyle Wild", "Yusuke Takahashi", "Asako Uraki"], "brief": "\u8bba\u6587\u63d0\u51fa ingest-time semantic compilation\uff08ISC\uff09\u8303\u5f0f\uff1a\u5728\u8bed\u6599\u5199\u5165/\u6444\u53d6\u9636\u6bb5\u5c06\u8bed\u4e49\u9884\u7f16\u8bd1\u4e3a\u53ef\u67e5\u8be2\u57fa\u5e95\uff0c\u800c\u4e0d\u662f\u6bcf\u6b21\u67e5\u8be2\u65f6\u8ba9\u6a21\u578b\u91cd\u65b0\u89e3\u91ca\u6587\u672c\u3002\u8be5\u57fa\u5e95\u5305\u542b\u589e\u91cf\u7ef4\u62a4\u7684 embeddings \u4e0e\u5e26 provenance \u9a8c\u8bc1\u7684\u539f\u5b50 claims\uff0c\u5e76\u88ab\u89c6\u4e3a\u7c7b\u4f3c\u6570\u636e\u5e93\u7d22\u5f15\u7684\u4e00\u7b49\u5bf9\u8c61\u3002", "categories": ["cs.AI", "cs.DB", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20845", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06RAG\u4e2d\u7684\u67e5\u8be2\u65f6\u8bed\u4e49\u89e3\u91ca\u7c7b\u6bd4\u4e3a\u6570\u636e\u5e93\u5168\u8868\u626b\u63cf\uff0c\u4e3b\u5f20\u628a\u6602\u8d35\u8bed\u4e49\u5904\u7406\u524d\u79fb\u5230\u5199\u5165\u65f6\u5b8c\u6210\u3002", "ISC\u5305\u542b\u4e24\u5c42\uff1a\u53ef\u589e\u91cf\u7ef4\u62a4\u7684\u5411\u91cf\u8868\u793a\uff0c\u4ee5\u53ca\u7f16\u8bd1\u671f\u9a8c\u8bc1\u6765\u6e90\u7684\u539f\u5b50\u5316\u4e8b\u5b9e\u58f0\u660e\u3002", "\u5b9e\u9a8c\u663e\u793a\u589e\u91cf\u66f4\u65b0\u6bd4\u5168\u91cf\u91cd\u5efa\u4fbf\u5b9c33.7\u500d\uff0c\u4e14\u5728500\u4e2a\u5e7f\u64ad\u8bbf\u8c08\u8f6c\u5f55\u6837\u672c\u4e0a\uff0ccompiled claims\u572832\u4e2a\u6a21\u578b\u9884\u7b97\u7ec4\u5408\u4e2d\u5168\u90e8\u80dc\u51fa\uff1a\u7ea62.2k reader tokens\u8fbe\u523085.2%\u6b63\u786e\u7387\uff0c\u800c\u6700\u4f73chunk\u65b9\u6848\u752816.3k tokens\u4ec572.5%\u3002"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u8bed\u4e49\u7d22\u5f15", "\u6570\u636e\u5e93\u7cfb\u7edf", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20845v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RAG Deserves an Index: Why Ingest-Time Compilation Beats Query-Time Interpretation", "tldr": "\u63d0\u51fa\u5199\u5165\u65f6\u8bed\u4e49\u7f16\u8bd1\uff0c\u964d\u4f4eRAG\u67e5\u8be2\u6210\u672c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ingest-time semantic compilation\uff08ISC\uff09\u8303\u5f0f\uff1a\u5728\u8bed\u6599\u5199\u5165/\u6444\u53d6\u9636\u6bb5\u5c06\u8bed\u4e49\u9884\u7f16\u8bd1\u4e3a\u53ef\u67e5\u8be2\u57fa\u5e95\uff0c\u800c\u4e0d\u662f\u6bcf\u6b21\u67e5\u8be2\u65f6\u8ba9\u6a21\u578b\u91cd\u65b0\u89e3\u91ca\u6587\u672c\u3002\u8be5\u57fa\u5e95\u5305\u542b\u589e\u91cf\u7ef4\u62a4\u7684 embeddings \u4e0e\u5e26 provenance \u9a8c\u8bc1\u7684\u539f\u5b50 claims\uff0c\u5e76\u88ab\u89c6\u4e3a\u7c7b\u4f3c\u6570\u636e\u5e93\u7d22\u5f15\u7684\u4e00\u7b49\u5bf9\u8c61\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u628aRAG\u4f18\u5316\u4ece\u201c\u66f4\u597d\u68c0\u7d22/\u66f4\u957f\u4e0a\u4e0b\u6587\u201d\u63a8\u8fdb\u5230\u201c\u8bed\u4e49\u7d22\u5f15\u4e0e\u6570\u636e\u5e93\u5316\u7ef4\u62a4\u201d\u7684\u7cfb\u7edf\u8303\u5f0f\uff0c\u53ef\u80fd\u663e\u8457\u964d\u4f4e\u751f\u4ea7RAG\u7684\u67e5\u8be2\u6210\u672c\u3001\u5ef6\u8fdf\u548c\u4e0a\u4e0b\u6587\u6d6a\u8d39\uff0c\u5e76\u4e3aRAG\u7d22\u5f15DDL\u3001\u8fc1\u79fb\u3001\u7ef4\u62a4\u4e0e\u6210\u672c\u6a21\u578b\u63d0\u51fa\u65b0\u7814\u7a76\u65b9\u5411\u3002"}, {"abstract": "Large language models (LLMs) are vulnerable to multi-turn jailbreak attacks that progressively manipulate conversation context. Existing certified robustness methods are limited to single-turn inputs; naive multi-turn composition yields bounds that degrade exponentially in the number of turns. We introduce Multi-Turn Certified Robustness (MTCR), a framework that models conversational safety via State-Adversarial MDPs and defines $k$-turn certified robustness as the worst-case safety probability across $k$ adversarial turns. MTCR comprises: (i) compositional certification via embedding-space mode decomposition, yielding tighter certified lower bounds than naive multiplication; (ii) $(\u03b1,\u03b2)$-safety persistence, improving the degradation rate from $\\underline{p}^{k}$ to $\u03b2^k$ (with $\u03b2\u003e \\underline{p}$) and yielding interpretable horizon estimates; (iii) matching information-theoretic upper bounds establishing tightness; and (iv) a unified algorithm combining these results. Experiments on six LLMs under $\u03b5$-bounded and Crescendo-style attacks confirm that empirical safety consistently exceeds the certified bounds.", "arxiv_id": "2608.20820", "arxiv_url": "https://arxiv.org/abs/2608.20820", "authors": ["Yang Liu", "Bin Chong", "Wenkai Yang", "Shuai Zhang", "Yancheng Chen", "Feiyu Han", "GuoZhen", "Cheng Zhang", "Huaibing Xie", "Changze Lv", "Shihan Dou", "Pluto Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Multi-Turn Certified Robustness\uff08MTCR\uff09\u6846\u67b6\uff0c\u7528\u72b6\u6001\u5bf9\u6297 MDP \u5efa\u6a21\u591a\u8f6e\u5bf9\u8bdd\u5b89\u5168\uff0c\u5e76\u5b9a\u4e49 k \u8f6e\u5bf9\u6297\u4e0b\u7684\u6700\u574f\u5b89\u5168\u6982\u7387\u3002\u5b83\u901a\u8fc7\u7ec4\u5408\u5f0f\u8ba4\u8bc1\u4e0e\u5b89\u5168\u6301\u4e45\u6027\u5206\u6790\uff0c\u4e3a\u591a\u8f6e\u8d8a\u72f1\u653b\u51fb\u4e0b\u7684 LLM \u5b89\u5168\u6027\u7ed9\u51fa\u53ef\u8bc1\u660e\u4e0b\u754c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20820", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u5d4c\u5165\u7a7a\u95f4\u6a21\u5f0f\u5206\u89e3\u8fdb\u884c\u7ec4\u5408\u5f0f\u8ba4\u8bc1\uff0c\u907f\u514d\u6734\u7d20\u591a\u8f6e\u76f8\u4e58\u5bfc\u81f4\u7684\u6307\u6570\u7ea7\u754c\u9650\u9000\u5316", "\u63d0\u51fa $(\u03b1,\u03b2)$-safety persistence\uff0c\u5c06\u5b89\u5168\u4e0b\u754c\u9000\u5316\u7387\u4ece $\\underline{p}^{k}$ \u6539\u5584\u4e3a $\u03b2^k$\uff0c\u5e76\u7ed9\u51fa\u53ef\u89e3\u91ca\u7684\u5b89\u5168\u8f6e\u6570\u4f30\u8ba1", "\u7ed9\u51fa\u5339\u914d\u7684\u4fe1\u606f\u8bba\u4e0a\u754c\u8bc1\u660e\u7d27\u6027\uff0c\u5e76\u5728\u516d\u4e2a LLM\u3001\u03b5 \u6709\u754c\u653b\u51fb\u548c Crescendo \u5f0f\u653b\u51fb\u4e0a\u9a8c\u8bc1\u7ecf\u9a8c\u5b89\u5168\u7387\u9ad8\u4e8e\u8ba4\u8bc1\u4e0b\u754c"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u9c81\u68d2\u6027\u8ba4\u8bc1", "\u591a\u8f6e\u5bf9\u8bdd", "\u8d8a\u72f1\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20820v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Certified Multi-Turn Robustness for LLM Safety via Compositional Bounds and Safety Persistence", "tldr": "\u4e3aLLM\u591a\u8f6e\u8d8a\u72f1\u63d0\u4f9b\u53ef\u8ba4\u8bc1\u5b89\u5168\u9c81\u68d2\u6027\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Multi-Turn Certified Robustness\uff08MTCR\uff09\u6846\u67b6\uff0c\u7528\u72b6\u6001\u5bf9\u6297 MDP \u5efa\u6a21\u591a\u8f6e\u5bf9\u8bdd\u5b89\u5168\uff0c\u5e76\u5b9a\u4e49 k \u8f6e\u5bf9\u6297\u4e0b\u7684\u6700\u574f\u5b89\u5168\u6982\u7387\u3002\u5b83\u901a\u8fc7\u7ec4\u5408\u5f0f\u8ba4\u8bc1\u4e0e\u5b89\u5168\u6301\u4e45\u6027\u5206\u6790\uff0c\u4e3a\u591a\u8f6e\u8d8a\u72f1\u653b\u51fb\u4e0b\u7684 LLM \u5b89\u5168\u6027\u7ed9\u51fa\u53ef\u8bc1\u660e\u4e0b\u754c\u3002", "why_notable": "\u8fd9\u662f\u5c06\u53ef\u8ba4\u8bc1\u9c81\u68d2\u6027\u4ece\u5355\u8f6e\u8f93\u5165\u63a8\u8fdb\u5230\u591a\u8f6e\u5bf9\u8bdd\u5b89\u5168\u7684\u91cd\u8981\u5c1d\u8bd5\uff0c\u76f4\u63a5\u9762\u5411\u6e10\u8fdb\u5f0f\u8d8a\u72f1\u7b49\u771f\u5b9e\u5a01\u80c1\uff1b\u5176\u7406\u8bba\u754c\u9650\u548c\u7b97\u6cd5\u6846\u67b6\u6709\u52a9\u4e8e\u66f4\u53ef\u4fe1\u5730\u8bc4\u4f30 LLM \u5728\u957f\u5bf9\u8bdd\u4e2d\u7684\u5b89\u5168\u6027\u3002"}, {"abstract": "The matrix-aware optimizer Muon improves large model training by balancing updates across singular directions, yet its scaling behavior and end-to-end efficiency on large Diffusion Transformers (DiTs) remain unclear. We first establish Muon\u0027s scaling behavior on DiTs from 1.3B to 15B parameters, showing that its optimization and generative quality advantages over AdamW persist across model scales. However, at scale, the 5-step Newton--Schulz iteration (NS5) performed at every optimization step, together with full-momentum materialization, introduces substantial computation and communication overhead that can offset Muon\u0027s step-efficiency advantage. We introduce \\emph{Periodic Row-wise Muon}, which performs a full NS5 spectral update once every \\(K\\) steps and applies a low compute and communication cost row-wise constrained update based on the current momentum at the remaining steps. We further co-design a distributed implementation that operates directly on sharded momentum during non-refresh steps and accelerates spectral refreshes through bucketed all-gather and communication--computation overlap. Across all scales, Muon improves the best observed generative quality over AdamW by 12.9--19.1\\%. Compared with vanilla Muon, Periodic Row-wise Muon remains within 0.5\\% in best generative quality on the 1.3B--4B models and improves it by 4.5\\% at 9B. It reduces optimizer time by 46.9--54.3\\%, end-to-end step time by 15.7--24.3\\%, and logical communication volume by 66.7\\%, while reaching its respective best generative quality with 33.7--64.8\\% less active training time. These results show that Periodic Row-wise Muon preserves Muon\u0027s generative quality advantage while translating it into end-to-end training efficiency for large DiTs.", "arxiv_id": "2608.20818", "arxiv_url": "https://arxiv.org/abs/2608.20818", "authors": ["Chenghao Li", "Xiao Han", "Xinxin Huang", "Wei Liu", "Boyang Li", "Bing Xiao", "Heran Zhang", "Juanma Perez Rua", "Ke Xu", "Kangning Liu", "Linjun Kuang", "Na Li", "Tan Wang", "Tian Xie", "Wei Peng", "Yang Pei", "Yifan Xu", "Yuanhao Zhai", "Yuwei Lin", "Zhe Wang", "Zihao He", "Daniel Li", "Junbiao Tang", "Ziyang Jiang", "Dake Chen"], "brief": "\u8bba\u6587\u7cfb\u7edf\u9a8c\u8bc1\u4e86\u77e9\u9635\u611f\u77e5\u4f18\u5316\u5668 Muon \u5728 1.3B \u5230 15B \u53c2\u6570 DiT \u4e0a\u7684\u6269\u5c55\u6027\uff0c\u53d1\u73b0\u5176\u76f8\u5bf9 AdamW \u7684\u751f\u6210\u8d28\u91cf\u4f18\u52bf\u53ef\u8de8\u89c4\u6a21\u4fdd\u6301\u3002\u4e3a\u89e3\u51b3\u5927\u6a21\u578b\u8bad\u7ec3\u4e2d Newton-Schulz \u8fed\u4ee3\u548c\u52a8\u91cf\u901a\u4fe1\u5f00\u9500\u8fc7\u9ad8\u7684\u95ee\u9898\uff0c\u63d0\u51fa Periodic Row-wise Muon\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20818", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Periodic Row-wise Muon \u6bcf\u9694 K \u6b65\u6267\u884c\u4e00\u6b21\u5b8c\u6574 NS5 \u8c31\u66f4\u65b0\uff0c\u5176\u4f59\u6b65\u9aa4\u4f7f\u7528\u57fa\u4e8e\u5f53\u524d\u52a8\u91cf\u7684\u4f4e\u8ba1\u7b97\u3001\u4f4e\u901a\u4fe1\u884c\u7ea6\u675f\u66f4\u65b0\u3002", "\u5206\u5e03\u5f0f\u5b9e\u73b0\u76f4\u63a5\u5728\u5206\u7247\u52a8\u91cf\u4e0a\u6267\u884c\u975e\u5237\u65b0\u6b65\u9aa4\uff0c\u5e76\u901a\u8fc7 bucketed all-gather \u4e0e\u901a\u4fe1\u8ba1\u7b97\u91cd\u53e0\u52a0\u901f\u8c31\u5237\u65b0\u3002", "\u76f8\u6bd4 AdamW\uff0cMuon \u5728\u5404\u89c4\u6a21 DiT \u4e0a\u6700\u4f73\u751f\u6210\u8d28\u91cf\u63d0\u5347 12.9%\u201319.1%\uff1b\u76f8\u6bd4\u539f\u7248 Muon\uff0c\u65b0\u65b9\u6cd5\u51cf\u5c11\u4f18\u5316\u5668\u65f6\u95f4 46.9%\u201354.3%\u3001\u7aef\u5230\u7aef\u6b65\u65f6 15.7%\u201324.3%\u3001\u901a\u4fe1\u91cf 66.7%\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u4f18\u5316\u5668", "\u5927\u89c4\u6a21\u8bad\u7ec3", "\u5206\u5e03\u5f0f\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20818v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Scaling Muon for Diffusion Transformers", "tldr": "\u8ba9Muon\u9ad8\u6548\u6269\u5c55\u5230\u5927\u89c4\u6a21\u6269\u6563Transformer", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u9a8c\u8bc1\u4e86\u77e9\u9635\u611f\u77e5\u4f18\u5316\u5668 Muon \u5728 1.3B \u5230 15B \u53c2\u6570 DiT \u4e0a\u7684\u6269\u5c55\u6027\uff0c\u53d1\u73b0\u5176\u76f8\u5bf9 AdamW \u7684\u751f\u6210\u8d28\u91cf\u4f18\u52bf\u53ef\u8de8\u89c4\u6a21\u4fdd\u6301\u3002\u4e3a\u89e3\u51b3\u5927\u6a21\u578b\u8bad\u7ec3\u4e2d Newton-Schulz \u8fed\u4ee3\u548c\u52a8\u91cf\u901a\u4fe1\u5f00\u9500\u8fc7\u9ad8\u7684\u95ee\u9898\uff0c\u63d0\u51fa Periodic Row-wise Muon\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 Muon \u7684\u4f18\u5316\u8d28\u91cf\u4f18\u52bf\u8f6c\u5316\u4e3a\u5927\u89c4\u6a21 DiT \u8bad\u7ec3\u7684\u5b9e\u9645\u7aef\u5230\u7aef\u6548\u7387\u6536\u76ca\uff0c\u5bf9\u8bad\u7ec3\u8d85\u5927\u6269\u6563\u6a21\u578b\u548c\u4f18\u5316\u5668\u7cfb\u7edf\u534f\u540c\u8bbe\u8ba1\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language-Action (VLA) policies are vulnerable to localized physical perturbations, yet existing certified patch defenses target discrete labels and cannot directly certify continuous, temporally correlated actions. We introduce CertVLA, a certified defense for closed-loop VLA control under bounded patch and texture attacks. CertVLA proposes a calibrated region of behaviorally consistent actions, while deterministic covering masks ensure that at least one checked prediction is attack-free. Specifically, CertVLA normalizes action disagreement by the benign variation of each mask pair and accepts a single-mask anchor only when it remains consistent under every second mask. It then calibrates the resulting max-min-max episode score to provide finite-sample clean coverage. Conjoining query-level decisions extends the action certificate to the complete closed-loop rollout. Furthermore, we prove that against any adaptive attacker satisfying the bounded-support threat model, every rollout certified by CertVLA executes only action chunks consistent with attack-erased clean predictions. Under dual-mask rollout correctness, this consistency certificate further guarantees task success. The certificate is independent of patch content, generation method, and physical transformation. Experiments in simulation and the real world demonstrate the empirical and certified effectiveness of CertVLA against patch attacks, with additional simulation validation on texture attacks.", "arxiv_id": "2608.20791", "arxiv_url": "https://arxiv.org/abs/2608.20791", "authors": ["Hui Lu", "Zhijie Peng", "Yuqi Lin", "Zaijia Yang", "Jiaming He", "Shuhan Ye", "Yi Yu", "Hanwei Zhu", "Bingquan Shen", "Alex Kot", "Xudong Jiang"], "brief": "CertVLA \u9762\u5411\u95ed\u73af Vision-Language-Action \u63a7\u5236\uff0c\u63d0\u51fa\u4e00\u79cd\u53ef\u8ba4\u8bc1\u9632\u5fa1\u65b9\u6cd5\uff0c\u7528\u4e8e\u62b5\u5fa1\u6709\u754c\u8865\u4e01\u4e0e\u7eb9\u7406\u7b49\u7269\u7406\u89c6\u89c9\u653b\u51fb\u3002\u5b83\u901a\u8fc7\u591a\u63a9\u7801\u8986\u76d6\u4e0e\u884c\u4e3a\u4e00\u81f4\u6027\u6821\u51c6\uff0c\u4e3a\u8fde\u7eed\u4e14\u65f6\u5e8f\u76f8\u5173\u7684\u52a8\u4f5c\u8f93\u51fa\u63d0\u4f9b rollout \u7ea7\u5b89\u5168\u8bc1\u4e66\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20791", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u786e\u5b9a\u6027\u8986\u76d6\u63a9\u7801\u4fdd\u8bc1\u81f3\u5c11\u4e00\u4e2a\u88ab\u68c0\u67e5\u9884\u6d4b\u4e0d\u53d7\u653b\u51fb\u5f71\u54cd\uff0c\u5e76\u4ee5\u5355\u63a9\u7801\u951a\u70b9\u4e0e\u7b2c\u4e8c\u63a9\u7801\u7684\u4e00\u81f4\u6027\u4f5c\u4e3a\u63a5\u53d7\u6761\u4ef6", "\u5c06\u52a8\u4f5c\u5206\u6b67\u6309\u5e72\u51c0\u6837\u672c\u4e2d\u63a9\u7801\u5bf9\u7684\u81ea\u7136\u53d8\u5316\u8fdb\u884c\u5f52\u4e00\u5316\uff0c\u518d\u6821\u51c6 max-min-max episode \u5206\u6570\u4ee5\u83b7\u5f97\u6709\u9650\u6837\u672c\u8986\u76d6\u4fdd\u8bc1", "\u8bc1\u660e\u5728\u6709\u754c\u652f\u6301\u5a01\u80c1\u6a21\u578b\u4e0b\uff0c\u4efb\u4f55\u901a\u8fc7\u8ba4\u8bc1\u7684\u95ed\u73af rollout \u53ea\u4f1a\u6267\u884c\u4e0e\u53bb\u653b\u51fb\u5e72\u51c0\u9884\u6d4b\u4e00\u81f4\u7684\u52a8\u4f5c\u5757\uff0c\u5e76\u5728\u53cc\u63a9\u7801\u6b63\u786e\u6027\u6761\u4ef6\u4e0b\u4fdd\u8bc1\u4efb\u52a1\u6210\u529f"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5b89\u5168\u9632\u5fa1", "\u53ef\u8ba4\u8bc1\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20791v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CertVLA: Certified Defense against Physical Visual Attacks for Vision-Language-Action Models", "tldr": "\u4e3aVLA\u63d0\u4f9b\u7269\u7406\u8865\u4e01\u653b\u51fb\u53ef\u8ba4\u8bc1\u9632\u5fa1", "upvotes": 0, "what_it_is": "CertVLA \u9762\u5411\u95ed\u73af Vision-Language-Action \u63a7\u5236\uff0c\u63d0\u51fa\u4e00\u79cd\u53ef\u8ba4\u8bc1\u9632\u5fa1\u65b9\u6cd5\uff0c\u7528\u4e8e\u62b5\u5fa1\u6709\u754c\u8865\u4e01\u4e0e\u7eb9\u7406\u7b49\u7269\u7406\u89c6\u89c9\u653b\u51fb\u3002\u5b83\u901a\u8fc7\u591a\u63a9\u7801\u8986\u76d6\u4e0e\u884c\u4e3a\u4e00\u81f4\u6027\u6821\u51c6\uff0c\u4e3a\u8fde\u7eed\u4e14\u65f6\u5e8f\u76f8\u5173\u7684\u52a8\u4f5c\u8f93\u51fa\u63d0\u4f9b rollout \u7ea7\u5b89\u5168\u8bc1\u4e66\u3002", "why_notable": "\u73b0\u6709\u53ef\u8ba4\u8bc1\u8865\u4e01\u9632\u5fa1\u591a\u9488\u5bf9\u79bb\u6563\u5206\u7c7b\u6807\u7b7e\uff0c\u96be\u4ee5\u5904\u7406 VLA \u7684\u8fde\u7eed\u52a8\u4f5c\u4e0e\u65f6\u5e8f\u95ed\u73af\u63a7\u5236\uff1bCertVLA \u5c06\u8ba4\u8bc1\u9632\u5fa1\u63a8\u8fdb\u5230\u771f\u5b9e\u673a\u5668\u4eba/\u4eff\u771f\u63a7\u5236\u573a\u666f\uff0c\u4e14\u8bc1\u4e66\u4e0e\u8865\u4e01\u5185\u5bb9\u3001\u751f\u6210\u65b9\u5f0f\u548c\u7269\u7406\u53d8\u6362\u65e0\u5173\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While multimodal retrieval-augmented generation (RAG) systems increasingly rely on images as external knowledge sources, the introduction of poisoned
