1134v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21134.png", "title": "Llama-Mobile: Efficient 2.7-Bit Quantization of VLMs", "tldr": "\u8ba911B\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8dd1\u4e0a\u624b\u673a", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Llama-Mobile\uff0c\u4e00\u4e2a\u9762\u5411\u79fb\u52a8\u7aef\u90e8\u7f72\u7684 VLM \u91cf\u5316\u6846\u67b6\u3002\u5b83\u5c06 Llama 3.2 11B Vision Instruct \u538b\u7f29\u5230 3.7GB\uff0c\u5e76\u652f\u6301\u5728 Arm CPU \u4e0a\u9ad8\u6548\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5927\u89c4\u6a21\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u624b\u673a\u7b49\u8fb9\u7f18\u8bbe\u5907\u4e0a\u672c\u5730\u8fd0\u884c\u7684\u53ef\u884c\u8def\u5f84\uff0c\u5bf9\u9690\u79c1\u4fdd\u62a4\u3001\u4f4e\u5ef6\u8fdf\u591a\u6a21\u6001\u5e94\u7528\u548c\u7aef\u4fa7 AI \u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vector graphics are prized for their resolution independence, compact storage, and direct editability, making differentiable optimization of their parametric primitives an attractive goal. Yet classical rasterization is discontinuous with respect to geometry, and existing remedies that smooth the forward pass demand increasingly elaborate heuristics as scene complexity grows. We trace this fragility to a gradient seesaw: design choices that improve forward geometric exactness can systematically degrade the induced gradient signal, and vice versa. To navigate this tension we introduce CubicSplat, a differentiable vector rasterizer that replaces B\u00e9zier closest-point solvers with uniform polyline surrogates whose geometric error is bounded at $O(S^{-2})$. The resulting static computation graph yields well-conditioned gradients by construction, while a compositing-derived visibility mechanism prunes degenerate primitives without auxiliary regularization. On DIV2K and Kodak benchmarks CubicSplat achieves state-of-the-art reconstruction quality with over 2 dB PSNR gain in the closed-fill setting, while training up to 4x faster than prior methods. The code is available at https://github.com/CubicSplat/repo", "arxiv_id": "2608.20803", "arxiv_url": "https://arxiv.org/abs/2608.20803", "authors": ["Chenglong Liu", "Xin Zhang", "Yimeng Zhu", "Liyang He", "Yixiao Ma", "Yu Su", "Zhenya Huang", "Qi Liu"], "brief": "\u8bba\u6587\u63d0\u51fa CubicSplat\uff0c\u4e00\u79cd\u9762\u5411\u77e2\u91cf\u56fe\u4f18\u5316\u7684\u53ef\u5fae\u5149\u6805\u5316\u5668\u3002\u5b83\u7528\u8bef\u5dee\u6709\u754c\u7684\u5747\u5300\u6298\u7ebf\u8fd1\u4f3c\u66ff\u4ee3 B\u00e9zier \u6700\u8fd1\u70b9\u6c42\u89e3\uff0c\u5728\u4fdd\u6301\u51e0\u4f55\u7cbe\u5ea6\u7684\u540c\u65f6\u6539\u5584\u68af\u5ea6\u7a33\u5b9a\u6027\u3002", "categories": ["cs.GR", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20803", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u201c\u68af\u5ea6\u8df7\u8df7\u677f\u201d\u95ee\u9898\uff1a\u524d\u5411\u51e0\u4f55\u8d8a\u7cbe\u786e\uff0c\u53ef\u80fd\u53cd\u800c\u5bfc\u81f4\u4f18\u5316\u68af\u5ea6\u4fe1\u53f7\u53d8\u5dee", "\u4f7f\u7528\u5747\u5300 polyline \u4ee3\u7406\u8868\u793a B\u00e9zier \u66f2\u7ebf\uff0c\u51e0\u4f55\u8bef\u5dee\u754c\u4e3a O(S^-2)\uff0c\u5e76\u5f62\u6210\u9759\u6001\u8ba1\u7b97\u56fe", "\u5728 DIV2K \u548c Kodak \u4e0a\u95ed\u5408\u586b\u5145\u573a\u666f PSNR \u63d0\u5347\u8d85\u8fc7 2 dB\uff0c\u8bad\u7ec3\u901f\u5ea6\u6700\u9ad8\u63d0\u5347 4 \u500d"], "keywords": ["\u53ef\u5fae\u6e32\u67d3", "\u77e2\u91cf\u56fe\u5f62", "\u8ba1\u7b97\u673a\u56fe\u5f62\u5b66", "\u56fe\u50cf\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20803v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CubicSplat: Differentiable Vector Graphics via Error-Bounded Forward Relaxation", "tldr": "\u66f4\u5feb\u66f4\u7a33\u7684\u53ef\u5fae\u77e2\u91cf\u56fe\u5149\u6805\u5316\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CubicSplat\uff0c\u4e00\u79cd\u9762\u5411\u77e2\u91cf\u56fe\u4f18\u5316\u7684\u53ef\u5fae\u5149\u6805\u5316\u5668\u3002\u5b83\u7528\u8bef\u5dee\u6709\u754c\u7684\u5747\u5300\u6298\u7ebf\u8fd1\u4f3c\u66ff\u4ee3 B\u00e9zier \u6700\u8fd1\u70b9\u6c42\u89e3\uff0c\u5728\u4fdd\u6301\u51e0\u4f55\u7cbe\u5ea6\u7684\u540c\u65f6\u6539\u5584\u68af\u5ea6\u7a33\u5b9a\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u540c\u65f6\u63d0\u5347\u4e86\u53ef\u5fae\u77e2\u91cf\u56fe\u4f18\u5316\u7684\u7a33\u5b9a\u6027\u3001\u91cd\u5efa\u8d28\u91cf\u548c\u8bad\u7ec3\u6548\u7387\uff0c\u5bf9\u77e2\u91cf\u56fe\u91cd\u5efa\u3001\u7f16\u8f91\u3001\u795e\u7ecf\u6e32\u67d3\u4e0e\u53ef\u5fae\u56fe\u5f62\u7ba1\u7ebf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Representation engineering offers a lightweight means of controlling language-model behavior by modifying intermediate hidden states, but its direct application to Mixture-of-Experts (MoE) models introduces a structural mismatch. We first verify this failure mode through a series of empirical studies and find that preserving clean routing substantially recovers steering performance and that routing is more sensitive to semantic content than to behavioral changes under controlled content. Motivated by these findings, we introduce RARE, a router-agnostic representation engineering framework for MoE language models. RARE projects arbitrary behavioral perturbations onto the null space of the router matrix, thereby removing router-visible components, and further corrects routing drift propagated to selected downstream layers. To decide the best perturbation estimator in this framework, we evaluate five estimators on six heterogeneous open-weight MoE models across three steering scenarios: harmfulness, truthfulness, and factual editing. On harmfulness steering, RARE reaches an average attack success rate of 53.3% while retaining 67.8% MMLU accuracy, yielding a stronger aggregate effectiveness--utility trade-off than baselines. It further improves average TruthfulQA MC1 accuracy from 41.0% to 58.6% and CounterFact efficacy from 16.8% to 96.3%. These results support routing consistency as an important architectural consideration for adapting representation engineering to MoE models.", "arxiv_id": "2608.21236", "arxiv_url": "https://arxiv.org/abs/2608.21236", "authors": ["Zhibo Zhang", "Zhen Ouyang", "Ling Shi", "Kailong Wang"], "brief": "\u8bba\u6587\u6307\u51fa\u5c06\u8868\u5f81\u5de5\u7a0b\u76f4\u63a5\u7528\u4e8eMoE\u8bed\u8a00\u6a21\u578b\u4f1a\u56e0\u6539\u53d8\u4e13\u5bb6\u8def\u7531\u800c\u5931\u6548\uff0c\u5e76\u63d0\u51faRARE\u6846\u67b6\u3002RARE\u5c06\u884c\u4e3a\u6270\u52a8\u6295\u5f71\u5230\u8def\u7531\u77e9\u9635\u7684\u96f6\u7a7a\u95f4\uff0c\u5e76\u6821\u6b63\u4e0b\u6e38\u8def\u7531\u6f02\u79fb\uff0c\u4ece\u800c\u5728\u4fdd\u6301\u8def\u7531\u4e00\u81f4\u7684\u540c\u65f6\u5b9e\u73b0\u6a21\u578b\u884c\u4e3a\u63a7\u5236\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21236", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b9e\u9a8c\u8bc1\u660eMoE\u8868\u5f81\u5e72\u9884\u7684\u5173\u952e\u5931\u8d25\u6a21\u5f0f\u662f\u8def\u7531\u88ab\u6270\u52a8\uff1b\u4fdd\u6301\u5e72\u51c0\u8def\u7531\u53ef\u663e\u8457\u6062\u590d\u63a7\u5236\u6548\u679c\u3002", "RARE\u5bf9\u4efb\u610f\u884c\u4e3a\u6270\u52a8\u53bb\u9664\u8def\u7531\u53ef\u89c1\u6210\u5206\uff0c\u5e76\u5bf9\u9009\u5b9a\u4e0b\u6e38\u5c42\u7684\u8def\u7531\u6f02\u79fb\u8fdb\u884c\u4fee\u6b63\u3002", "\u57286\u4e2a\u5f00\u6e90MoE\u6a21\u578b\u30013\u7c7b\u4efb\u52a1\u4e0a\u8bc4\u4f30\uff1a\u6709\u5bb3\u6027\u63a7\u5236\u3001\u771f\u5b9e\u6027\u63d0\u5347\u548c\u4e8b\u5b9e\u7f16\u8f91\uff1bTruthfulQA MC1\u753141.0%\u63d0\u5347\u81f358.6%\uff0cCounterFact\u6709\u6548\u6027\u753116.8%\u63d0\u5347\u81f396.3%\u3002"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u8868\u5f81\u5de5\u7a0b", "\u6a21\u578b\u5bf9\u9f50", "\u53ef\u63a7\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21236v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RARE: Decoupling Representation Steering from Expert Routing in Mixture-of-Experts Language Models", "tldr": "RARE\u8ba9MoE\u8868\u5f81\u5e72\u9884\u4e0d\u6270\u4e71\u4e13\u5bb6\u8def\u7531\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u5c06\u8868\u5f81\u5de5\u7a0b\u76f4\u63a5\u7528\u4e8eMoE\u8bed\u8a00\u6a21\u578b\u4f1a\u56e0\u6539\u53d8\u4e13\u5bb6\u8def\u7531\u800c\u5931\u6548\uff0c\u5e76\u63d0\u51faRARE\u6846\u67b6\u3002RARE\u5c06\u884c\u4e3a\u6270\u52a8\u6295\u5f71\u5230\u8def\u7531\u77e9\u9635\u7684\u96f6\u7a7a\u95f4\uff0c\u5e76\u6821\u6b63\u4e0b\u6e38\u8def\u7531\u6f02\u79fb\uff0c\u4ece\u800c\u5728\u4fdd\u6301\u8def\u7531\u4e00\u81f4\u7684\u540c\u65f6\u5b9e\u73b0\u6a21\u578b\u884c\u4e3a\u63a7\u5236\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8868\u5f81\u5de5\u7a0b\u4e0eMoE\u67b6\u6784\u4e2d\u7684\u4e13\u5bb6\u8def\u7531\u673a\u5236\u89e3\u8026\uff0c\u63ed\u793a\u4e86MoE\u6a21\u578b\u884c\u4e3a\u63a7\u5236\u4e2d\u7684\u7ed3\u6784\u6027\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u4e86\u8f7b\u91cf\u3001\u8def\u7531\u65e0\u5173\u7684\u9002\u914d\u65b9\u6cd5\uff0c\u5bf9\u5b89\u5168\u5bf9\u9f50\u3001\u4e8b\u5b9e\u7f16\u8f91\u548c\u53ef\u63a7\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We propose VT-MUSE, a Multimodal Unified SEquential representation learning framework for visuotactilemanipulation. Existing approaches often encode visual and tactile observations independently before fusion, limiting their ability to capture fine-grained cross-modal dependencies. Moreover, most methods focus on observations at the current time step and overlook the temporal evolution of contact. VT-MUSE addresses both limitations through a two-stage representation learning framework. In Stage I, modality specific encoders are jointly adapted via cross-modal temporal alignment and masked-view consistency. In Stage II, a conditional variational latent model processes masked visual sequences together with full tactile histories. Auxiliary decoders reconstruct the masked recent visual observations and predict tactile depth changes, encouraging the latent representation to retain both global visual context and local contact dynamics. The learned representation is subsequently integrated into a lightweight Transformer policy through gated cross-attention. On the simulation benchmark, VT-MUSE outperforms the strongest baseline evaluated on all tasks by 11 percentage points and also achieves substantial improvements in real-world experiments.", "arxiv_id": "2608.21290", "arxiv_url": "https://arxiv.org/abs/2608.21290", "authors": ["Congsheng Xu", "Qiaochu Yang", "Fangyuan Shi", "Yifan Han", "Baijun Chen", "Yiming Wang", "Haonan Zhao", "Daolin Ma", "Xiaokang Yang", "Hesheng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa VT-MUSE\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89e6\u89c9\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u4e24\u9636\u6bb5\u591a\u6a21\u6001\u65f6\u5e8f\u8868\u5f81\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u8de8\u6a21\u6001\u65f6\u95f4\u5bf9\u9f50\u3001\u63a9\u7801\u4e00\u81f4\u6027\u548c\u6761\u4ef6\u53d8\u5206\u6f5c\u53d8\u91cf\u5efa\u6a21\uff0c\u540c\u65f6\u6355\u6349\u89c6\u89c9\u5168\u5c40\u4e0a\u4e0b\u6587\u4e0e\u89e6\u89c9\u63a5\u89e6\u52a8\u6001\uff0c\u5e76\u63a5\u5165\u8f7b\u91cf Transformer \u7b56\u7565\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21290", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7b2c\u4e00\u9636\u6bb5\u8054\u5408\u9002\u914d\u89c6\u89c9\u4e0e\u89e6\u89c9\u7f16\u7801\u5668\uff0c\u5229\u7528\u8de8\u6a21\u6001\u65f6\u95f4\u5bf9\u9f50\u548c masked-view consistency \u5efa\u6a21\u7ec6\u7c92\u5ea6\u6a21\u6001\u4f9d\u8d56\u3002", "\u7b2c\u4e8c\u9636\u6bb5\u7528\u6761\u4ef6\u53d8\u5206\u6f5c\u53d8\u91cf\u6a21\u578b\u5904\u7406\u88ab\u63a9\u7801\u7684\u89c6\u89c9\u5e8f\u5217\u548c\u5b8c\u6574\u89e6\u89c9\u5386\u53f2\uff0c\u5e76\u901a\u8fc7\u8f85\u52a9\u89e3\u7801\u5668\u91cd\u5efa\u8fd1\u671f\u89c6\u89c9\u3001\u9884\u6d4b\u89e6\u89c9\u6df1\u5ea6\u53d8\u5316\u3002", "\u5728\u4eff\u771f\u57fa\u51c6\u4e0a\u8f83\u6700\u5f3a\u57fa\u7ebf\u5e73\u5747\u63d0\u5347 11 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u53d6\u5f97\u663e\u8457\u6539\u8fdb\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u591a\u6a21\u6001", "\u8868\u5f81\u5b66\u4e60", "\u89e6\u89c9\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21290v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "VT-MUSE: Multimodal Unified Sequential Visuotactile Representation Learning for Manipulation", "tldr": "\u7edf\u4e00\u65f6\u5e8f\u89c6\u89e6\u89c9\u8868\u5f81\u63d0\u5347\u673a\u5668\u4eba\u64cd\u4f5c\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VT-MUSE\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89e6\u89c9\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u4e24\u9636\u6bb5\u591a\u6a21\u6001\u65f6\u5e8f\u8868\u5f81\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u8de8\u6a21\u6001\u65f6\u95f4\u5bf9\u9f50\u3001\u63a9\u7801\u4e00\u81f4\u6027\u548c\u6761\u4ef6\u53d8\u5206\u6f5c\u53d8\u91cf\u5efa\u6a21\uff0c\u540c\u65f6\u6355\u6349\u89c6\u89c9\u5168\u5c40\u4e0a\u4e0b\u6587\u4e0e\u89e6\u89c9\u63a5\u89e6\u52a8\u6001\uff0c\u5e76\u63a5\u5165\u8f7b\u91cf Transformer \u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u89c6\u89e6\u89c9\u878d\u5408\u4e2d\u5e38\u89c1\u7684\u201c\u72ec\u7acb\u7f16\u7801\u540e\u878d\u5408\u201d\u548c\u201c\u5ffd\u7565\u63a5\u89e6\u65f6\u5e8f\u6f14\u5316\u201d\u95ee\u9898\uff0c\u63d0\u51fa\u7edf\u4e00\u7684\u65f6\u5e8f\u591a\u6a21\u6001\u8868\u5f81\u5b66\u4e60\u65b9\u6cd5\uff0c\u5bf9\u7cbe\u7ec6\u63a5\u89e6\u64cd\u4f5c\u548c\u771f\u5b9e\u673a\u5668\u4eba\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Token compression has become a key technique for reducing the inference cost of large foundation models, with approaches such as token pruning and KV-cache reuse widely adopted in vision-language models and recently explored for embodied agents. In embodied agents, tokens not only support perception and semantic understanding but also directly affect latency-sensitive closed-loop robot action prediction. Existing schemes typically guide compression using redundancy or importance cues, such as visual similarity, attention scores, and saliency. However, these cues only indirectly measure the key factor for safe compression: how much a token can change before causing an unacceptable deviation in downstream actions. This receiver-dependent tolerance is closely related to the principle of just noticeable difference (JND). Classical JND characterizes signal tolerance in the human visual system, while machine-oriented JND extends this concept to downstream machine responses. Building on this progression, we introduce Action-JND, which extends JND modeling to embodied perception by defining noticeability through the language-conditioned action response of a vision-language-action (VLA) policy in closed-loop control. A token change is considered admissible only when the induced action deviation remains within a tolerated margin. To realize this concept, we develop a lightweight token-wise JND estimator in deep visual-feature space to predict the maximum tolerable perturbation while preserving policy responses. The resulting action-tolerance score serves as a plug-and-play criterion for VLA compression paradigms, including stale-KV reuse and token pruning, prioritizing action-tolerant tokens for compression. Experiments on the LIBERO benchmark with OpenVLA and OpenVLA-OFT demonstrate that Action-JND consistently improves compression reliability, especially under aggressive compression ratios.", "arxiv_id": "2608.21247", "arxiv_url": "https://arxiv.org/abs/2608.21247", "authors": ["Zhuoyuan Li", "Rui Zhao", "Jin Wang", "Hanwei Zhu", "Cong Zhang", "Giuseppe Valenzise", "Weisi Lin", "Kin-Man Lam"], "brief": "\u8bba\u6587\u63d0\u51fa Action-JND\uff0c\u5c06\u201c\u6070\u53ef\u5bdf\u89c9\u5dee\u5f02\u201d\u6269\u5c55\u5230\u5177\u8eab\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u4e2d\uff0c\u7528\u4e0b\u6e38\u52a8\u4f5c\u504f\u5dee\u6765\u5b9a\u4e49 token \u53d8\u5316\u662f\u5426\u53ef\u63a5\u53d7\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u8bbe\u8ba1\u8f7b\u91cf\u7ea7\u9010 token JND \u4f30\u8ba1\u5668\uff0c\u7528\u4e8e\u6307\u5bfc stale-KV \u590d\u7528\u548c token pruning \u7b49\u538b\u7f29\u7b56\u7565\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21247", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4e0d\u518d\u4ec5\u4f9d\u8d56\u89c6\u89c9\u76f8\u4f3c\u5ea6\u3001\u6ce8\u610f\u529b\u6216\u663e\u8457\u6027\uff0c\u800c\u662f\u76f4\u63a5\u8861\u91cf token \u6270\u52a8\u5bf9\u95ed\u73af\u52a8\u4f5c\u9884\u6d4b\u7684\u5f71\u54cd\u3002", "\u5728\u6df1\u5c42\u89c6\u89c9\u7279\u5f81\u7a7a\u95f4\u4e2d\u4f30\u8ba1\u6bcf\u4e2a token \u7684\u6700\u5927\u53ef\u5bb9\u5fcd\u6270\u52a8\uff0c\u751f\u6210 action-tolerance score \u4f5c\u4e3a\u901a\u7528\u538b\u7f29\u51c6\u5219\u3002", "\u5728 LIBERO \u57fa\u51c6\u4e0a\u7ed3\u5408 OpenVLA \u4e0e OpenVLA-OFT \u9a8c\u8bc1\uff0c\u5728\u9ad8\u538b\u7f29\u7387\u4e0b\u663e\u8457\u63d0\u5347\u538b\u7f29\u53ef\u9760\u6027\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "Token\u538b\u7f29", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21247v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Just Noticeable Difference Modeling for Token Compression in Vision-Language-Action Models", "tldr": "\u7528Action-JND\u6307\u5bfcVLA\u5b89\u5168\u538b\u7f29\u89c6\u89c9token", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Action-JND\uff0c\u5c06\u201c\u6070\u53ef\u5bdf\u89c9\u5dee\u5f02\u201d\u6269\u5c55\u5230\u5177\u8eab\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u4e2d\uff0c\u7528\u4e0b\u6e38\u52a8\u4f5c\u504f\u5dee\u6765\u5b9a\u4e49 token \u53d8\u5316\u662f\u5426\u53ef\u63a5\u53d7\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u8bbe\u8ba1\u8f7b\u91cf\u7ea7\u9010 token JND \u4f30\u8ba1\u5668\uff0c\u7528\u4e8e\u6307\u5bfc stale-KV \u590d\u7528\u548c token pruning \u7b49\u538b\u7f29\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u538b\u7f29\u76ee\u6807\u4ece\u201c\u4fdd\u7559\u89c6\u89c9/\u8bed\u4e49\u4fe1\u606f\u201d\u63a8\u8fdb\u5230\u201c\u4fdd\u6301\u673a\u5668\u4eba\u52a8\u4f5c\u5b89\u5168\u7a33\u5b9a\u201d\uff0c\u66f4\u8d34\u8fd1\u5177\u8eab\u667a\u80fd\u90e8\u7f72\u4e2d\u7684\u4f4e\u5ef6\u8fdf\u4e0e\u53ef\u9760\u6027\u9700\u6c42\uff0c\u5bf9VLA\u6a21\u578b\u9ad8\u6548\u63a8\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "3D Gaussian Splatting has achieved remarkable success in novel view synthesis. However, extracting high-fidelity surfaces directly from 3DGS remains challenging due to its discrete and unstructured nature. Existing 3DGS-based reconstruction methods typically rely on multi-view geometric consistency or local constraints. Without an explicit structured geometric prior during optimization, these methods often struggle to resolve structural ambiguities, leading to artifacts and floaters, particularly in textureless or occluded regions. To address this limitation, we propose TopoSurfel, a novel framework that closes the loop between Gaussian surfels and continuous meshes. Unlike recent methods that incorporate mesh extraction into the differentiable pipeline by introducing auxiliary neural networks or extra per-Gaussian parameters, we dynamically extract a continuous proxy mesh via a non-trainable differentiable iso-surfacing process. Leveraging this differentiable connection, we introduce a mesh-guided surfel evolution strategy, including normal alignment and geometry-aware density control, to effectively suppress floaters and fill surface holes. Furthermore, to address the initialization challenges in large-scale environments, we propose a spatially aware hybrid re-initialization strategy that ensures robust reconstruction across complex scenes. Extensive experiments demonstrate that TopoSurfel achieves competitive geometric reconstruction accuracy while maintaining high-quality mesh-based novel view synthesis. The code for our method is available at https://github.com/Fan-Treasure/TopoSurfel.", "arxiv_id": "2608.20687", "arxiv_url": "https://arxiv.org/abs/2608.20687", "authors": ["Chuanjin Fan", "Wenjie Chang", "Bohao Liao", "Yujia Chen", "Wenfei Yang", "Tianzhu Zhang"], "brief": "TopoSurfel \u63d0\u51fa\u4e00\u79cd\u5728 Gaussian surfels \u4e0e\u8fde\u7eed\u7f51\u683c\u4e4b\u95f4\u95ed\u73af\u4f18\u5316\u7684\u8868\u9762\u91cd\u5efa\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u975e\u53ef\u8bad\u7ec3\u7684\u53ef\u5fae\u7b49\u503c\u9762\u63d0\u53d6\u52a8\u6001\u751f\u6210\u4ee3\u7406\u7f51\u683c\uff0c\u5e76\u7528\u7f51\u683c\u5148\u9a8c\u6307\u5bfc\u9ad8\u65af\u9762\u5143\u6f14\u5316\u3002", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20687", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u52a8\u6001\u63d0\u53d6\u8fde\u7eed\u4ee3\u7406\u7f51\u683c\uff0c\u65e0\u9700\u5f15\u5165\u989d\u5916\u795e\u7ecf\u7f51\u7edc\u6216\u6bcf\u4e2a\u9ad8\u65af\u7684\u65b0\u589e\u53ef\u8bad\u7ec3\u53c2\u6570", "\u63d0\u51fa\u7f51\u683c\u5f15\u5bfc\u7684\u9762\u5143\u6f14\u5316\u7b56\u7565\uff0c\u5305\u62ec\u6cd5\u7ebf\u5bf9\u9f50\u548c\u51e0\u4f55\u611f\u77e5\u5bc6\u5ea6\u63a7\u5236\uff0c\u4ee5\u51cf\u5c11\u6f02\u6d6e\u4f2a\u5f71\u5e76\u586b\u8865\u5b54\u6d1e", "\u8bbe\u8ba1\u7a7a\u95f4\u611f\u77e5\u7684\u6df7\u5408\u91cd\u521d\u59cb\u5316\u7b56\u7565\uff0c\u63d0\u5347\u5927\u89c4\u6a21\u590d\u6742\u573a\u666f\u4e2d\u7684\u91cd\u5efa\u9c81\u68d2\u6027"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u9ad8\u65af\u6cfc\u6e85", "\u7f51\u683c\u91cd\u5efa", "\u795e\u7ecf\u6e32\u67d3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20687v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "TopoSurfel: Closing the Loop between Gaussian Surfels and Meshes for Surface Reconstruction", "tldr": "\u7528\u53ef\u5fae\u7f51\u683c\u53cd\u54fa\u9ad8\u65af\u9762\u5143\u91cd\u5efa\u9ad8\u8d28\u91cf\u8868\u9762", "upvotes": 0, "what_it_is": "TopoSurfel \u63d0\u51fa\u4e00\u79cd\u5728 Gaussian surfels \u4e0e\u8fde\u7eed\u7f51\u683c\u4e4b\u95f4\u95ed\u73af\u4f18\u5316\u7684\u8868\u9762\u91cd\u5efa\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u975e\u53ef\u8bad\u7ec3\u7684\u53ef\u5fae\u7b49\u503c\u9762\u63d0\u53d6\u52a8\u6001\u751f\u6210\u4ee3\u7406\u7f51\u683c\uff0c\u5e76\u7528\u7f51\u683c\u5148\u9a8c\u6307\u5bfc\u9ad8\u65af\u9762\u5143\u6f14\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 3D Gaussian Splatting \u8868\u9762\u63d0\u53d6\u4e2d\u7f3a\u4e4f\u7ed3\u6784\u5316\u51e0\u4f55\u5148\u9a8c\u7684\u95ee\u9898\uff0c\u5efa\u7acb\u4e86\u9ad8\u65af\u8868\u793a\u4e0e\u663e\u5f0f\u7f51\u683c\u4e4b\u95f4\u7684\u53ef\u5fae\u95ed\u73af\uff0c\u6709\u671b\u63d0\u5347\u7eb9\u7406\u7f3a\u5931\u3001\u906e\u6321\u533a\u57df\u7684\u51e0\u4f55\u5b8c\u6574\u6027\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u597d\u7684\u65b0\u89c6\u89d2\u5408\u6210\u8d28\u91cf\u3002"}, {"abstract": "This technical report presents AudioWorldSim, an open-source platform designed to generate realistic binaural audio datasets and advance research in audio-based machine learning, particularly world models. Built as a custom extension of Meta\u0027s SoundSpaces 2.0 platform, AudioWorldSim leverages their comprehensive acoustics framework, but focuses on the automatic rollout of random agent navigations, as well as implements crucial fixes to how continuous sound is composed. AudioWorldSim is made publicly available to the research community at https://github.com/Luizerko/AudioWorldSim to facilitate reproducibility.", "arxiv_id": "2608.21075", "arxiv_url": "https://arxiv.org/abs/2608.21075", "authors": ["Luis Vitor Zerkowski", "Luiz Velho"], "brief": "AudioWorldSim \u662f\u57fa\u4e8e Meta SoundSpaces 2.0 \u6269\u5c55\u7684\u5f00\u6e90\u5e73\u53f0\uff0c\u7528\u4e8e\u81ea\u52a8\u751f\u6210\u903c\u771f\u7684\u53cc\u8033\u97f3\u9891\u6570\u636e\u96c6\u3002\u5b83\u9762\u5411\u97f3\u9891\u673a\u5668\u5b66\u4e60\u4e0e\u4e16\u754c\u6a21\u578b\u7814\u7a76\uff0c\u652f\u6301\u968f\u673a\u667a\u80fd\u4f53\u5bfc\u822a\u8f68\u8ff9\u7684\u81ea\u52a8 rollout\uff0c\u5e76\u4fee\u590d\u4e86\u8fde\u7eed\u58f0\u97f3\u5408\u6210\u4e2d\u7684\u5173\u952e\u95ee\u9898\u3002", "categories": ["cs.SD", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21075", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e SoundSpaces 2.0 \u7684\u58f0\u5b66\u4eff\u771f\u6846\u67b6\uff0c\u751f\u6210\u73b0\u5b9e\u611f\u8f83\u5f3a\u7684\u53cc\u8033\u97f3\u9891\u6570\u636e", "\u652f\u6301\u968f\u673a\u5bfc\u822a\u8f68\u8ff9\u81ea\u52a8\u91c7\u6837\uff0c\u4fbf\u4e8e\u6784\u5efa\u9762\u5411\u4e16\u754c\u6a21\u578b\u7684\u65f6\u5e8f\u97f3\u9891\u6570\u636e\u96c6", "\u4fee\u590d\u8fde\u7eed\u58f0\u97f3\u7ec4\u5408\u65b9\u5f0f\u4e2d\u7684\u95ee\u9898\uff0c\u5e76\u5f00\u6e90\u4ee3\u7801\u4ee5\u63d0\u5347\u53ef\u590d\u73b0\u6027"], "keywords": ["\u97f3\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21075v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "AudioWorldSim: Realistic Binaural Audio Datasets For World Models", "tldr": "\u5f00\u6e90\u5e73\u53f0\u751f\u6210\u903c\u771f\u53cc\u8033\u97f3\u9891\u4e16\u754c\u6a21\u578b\u6570\u636e\u3002", "upvotes": 0, "what_it_is": "AudioWorldSim \u662f\u57fa\u4e8e Meta SoundSpaces 2.0 \u6269\u5c55\u7684\u5f00\u6e90\u5e73\u53f0\uff0c\u7528\u4e8e\u81ea\u52a8\u751f\u6210\u903c\u771f\u7684\u53cc\u8033\u97f3\u9891\u6570\u636e\u96c6\u3002\u5b83\u9762\u5411\u97f3\u9891\u673a\u5668\u5b66\u4e60\u4e0e\u4e16\u754c\u6a21\u578b\u7814\u7a76\uff0c\u652f\u6301\u968f\u673a\u667a\u80fd\u4f53\u5bfc\u822a\u8f68\u8ff9\u7684\u81ea\u52a8 rollout\uff0c\u5e76\u4fee\u590d\u4e86\u8fde\u7eed\u58f0\u97f3\u5408\u6210\u4e2d\u7684\u5173\u952e\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u97f3\u9891\u4e16\u754c\u6a21\u578b\u7814\u7a76\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u7684\u6570\u636e\u751f\u6210\u5de5\u5177\uff0c\u964d\u4f4e\u4e86\u6784\u5efa\u903c\u771f\u53cc\u8033\u97f3\u9891\u73af\u5883\u6570\u636e\u7684\u95e8\u69db\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u5177\u8eab\u611f\u77e5\u3001\u7a7a\u95f4\u97f3\u9891\u7406\u89e3\u548c\u97f3\u9891\u9884\u6d4b\u6a21\u578b\u7684\u53d1\u5c55\u3002"}, {"abstract": "Search Agents face a severe reliability crisis during reinforcement learning (RL) fine-tuning. Heuristic Top-K retrieval often causes critical evidence loss or noise inclusion, while over-confidence induced by progressive RL leads to hallucinated answers and redundant searches. To build highly reliable agents, we introduce Conformal Prediction (CP) and propose Conformalized Agentic Search (CAS). This framework establishes reliability guarantees on both the retrieval and training sides: on the retrieval side, an Adaptive Prediction Set (APS), a specific CP realization, translates statistical coverage into dynamic document truncation to construct prediction sets that are adaptive in size; on the training side, Adaptive Conformal Inference (ACI), a dynamic CP algorithm, dynamically constructs prediction sets with controllable coverage to quantify answer confidence, which is then used to penalize low-confidence trajectories within the Group Relative Policy Optimization (GRPO) objective, ensuring the model learns only from reliable ones. Experiments across single-hop and multi-hop QA datasets demonstrate that our framework significantly improves reasoning accuracy while drastically reducing redundant tool invocations, establishing a highly reliable and efficient agent paradigm. Our code is available at https://github.com/S1llyBird/CAS.", "arxiv_id": "2608.20771", "arxiv_url": "https://arxiv.org/abs/2608.20771", "authors": ["Zixi Zhu", "Jiayuan Su", "Jian Zhang", "Yu Lin", "Hongwei Wang"], "brief": "\u8bba\u6587\u63d0\u51fa CAS\uff0c\u5c06\u4fdd\u5f62\u9884\u6d4b\u5f15\u5165\u641c\u7d22\u667a\u80fd\u4f53\uff0c\u5728\u68c0\u7d22\u7aef\u7528\u81ea\u9002\u5e94\u9884\u6d4b\u96c6\u52a8\u6001\u622a\u65ad\u6587\u6863\uff0c\u5728\u8bad\u7ec3\u7aef\u7528\u81ea\u9002\u5e94\u4fdd\u5f62\u63a8\u65ad\u4f30\u8ba1\u7b54\u6848\u7f6e\u4fe1\u5ea6\u5e76\u60e9\u7f5a\u4f4e\u7f6e\u4fe1\u8f68\u8ff9\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u5355\u8df3\u548c\u591a\u8df3\u95ee\u7b54\u4e2d\u63d0\u5347\u63a8\u7406\u51c6\u786e\u7387\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u5197\u4f59\u5de5\u5177\u8c03\u7528\uff0c\u63d0\u9ad8\u667a\u80fd\u4f53\u53ef\u9760\u6027\u4e0e\u6548\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20771", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a", "\u5f3a\u5316\u5b66\u4e60", "\u4fdd\u5f62\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20771v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CAS: Conformalized Agentic Search via Adaptive Retrieval and Policy Weighting", "tldr": "\u8bba\u6587\u63d0\u51fa CAS\uff0c\u5c06\u4fdd\u5f62\u9884\u6d4b\u5f15\u5165\u641c\u7d22\u667a\u80fd\u4f53\uff0c\u5728\u68c0\u7d22\u7aef\u7528\u81ea\u9002\u5e94\u9884\u6d4b\u96c6\u52a8\u6001\u622a\u65ad\u6587\u6863\uff0c\u5728\u8bad\u7ec3\u7aef\u7528\u81ea\u9002\u5e94\u4fdd\u5f62\u63a8\u65ad\u4f30\u8ba1\u7b54\u6848\u7f6e\u4fe1\u5ea6\u5e76\u60e9\u7f5a\u4f4e\u7f6e\u4fe1\u8f68\u8ff9\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u5355\u8df3\u548c\u591a\u8df3\u95ee\u7b54\u4e2d\u63d0\u5347\u63a8\u7406\u51c6\u786e\u7387\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u5197\u4f59\u5de5\u5177\u8c03\u7528\uff0c\u63d0\u9ad8\u667a\u80fd\u4f53\u53ef\u9760\u6027\u4e0e\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language-model agents can improve after failure or carry text across episodes without revising what counts as success. We study the narrower attribution problem of criterion revision: when criterion K0 accepts an outcome violating a broader commitment B, what observations justify saying that the system formed and persistently used K1? We require five non-compensatory conditions: criterion-failure detection, a model-emitted proposal, new-episode transfer, intervention sensitivity on the claimed carrier, and preservation. We evaluate CMB-0.1 on twelve cross-domain cases and four arms: stateless inference, append-only history, model-generated but harness-committed state, and evaluator-written oracle state. Seven mechanism fixtures yield 84 deterministic scorer trials; four local quantized artifacts yield 96 calls and 192 model-case-arm trials. No model trial satisfies all five conditions, but this zero does not establish general capability absence. Eleven calls remain invalid after one retry; several commitments disclose the target distinction; the harness performs commits; deletion reuses a stateless call; and conflict changes multiple factors. Qwen2.5-7B answers every transfer and preservation item without revision state, exposing zero-state reconstruction. These failures make CMB-0.1 an instrument-calibration result rather than a model ranking. We derive a prospective, trace-anchored CMB-0.4 protocol requiring concealed transfer, explicit WRITE/NO-WRITE/ESCALATE actions, a separately logged policy-selected commit, matched interventions, repeated hidden items, and a frozen executable oracle. It is a successor design, not a completed confirmatory result. The paper contributes a measurement chain, an empirical diagnosis of its first implementation, and a more discriminating protocol for future tests of criterion revision.", "arxiv_id": "2608.20729", "arxiv_url": "https://arxiv.org/abs/2608.20729", "authors": ["Guodong Xu"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u5931\u8d25\u540e\u662f\u5426\u771f\u6b63\u4fee\u8ba2\u201c\u6210\u529f\u6807\u51c6\u201d\uff0c\u5e76\u63d0\u51fa\u4e94\u4e2a\u4e0d\u53ef\u76f8\u4e92\u8865\u507f\u7684\u5224\u5b9a\u6761\u4ef6\u3002\u5bf9 CMB-0.1 \u7684\u591a\u7ec4\u5b9e\u9a8c\u663e\u793a\u6ca1\u6709\u6a21\u578b\u8bd5\u9a8c\u540c\u65f6\u6ee1\u8db3\u5168\u90e8\u6761\u4ef6\uff0c\u4f46\u4f5c\u8005\u6307\u51fa\u8fd9\u66f4\u591a\u66b4\u9732\u4e86\u6d4b\u91cf\u5de5\u5177\u7684\u5931\u6548\u6a21\u5f0f\uff0c\u800c\u975e\u8bc1\u660e\u6a21\u578b\u6ca1\u6709\u8be5\u80fd\u529b\uff0c\u5e76\u63d0\u51fa\u66f4\u4e25\u683c\u7684 trace-anchored CMB-0.4 \u540e\u7eed\u534f\u8bae\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20729", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u534f\u8bae", "\u6a21\u578b\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20729v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Calibrating Criterion Revision in LLM Agents: Failure Modes and a Trace-Anchored Protocol", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u5931\u8d25\u540e\u662f\u5426\u771f\u6b63\u4fee\u8ba2\u201c\u6210\u529f\u6807\u51c6\u201d\uff0c\u5e76\u63d0\u51fa\u4e94\u4e2a\u4e0d\u53ef\u76f8\u4e92\u8865\u507f\u7684\u5224\u5b9a\u6761\u4ef6\u3002\u5bf9 CMB-0.1 \u7684\u591a\u7ec4\u5b9e\u9a8c\u663e\u793a\u6ca1\u6709\u6a21\u578b\u8bd5\u9a8c\u540c\u65f6\u6ee1\u8db3\u5168\u90e8\u6761\u4ef6\uff0c\u4f46\u4f5c\u8005\u6307\u51fa\u8fd9\u66f4\u591a\u66b4\u9732\u4e86\u6d4b\u91cf\u5de5\u5177\u7684\u5931\u6548\u6a21\u5f0f\uff0c\u800c\u975e\u8bc1\u660e\u6a21\u578b\u6ca1\u6709\u8be5\u80fd\u529b\uff0c\u5e76\u63d0\u51fa\u66f4\u4e25\u683c\u7684 trace-anchored CMB-0.4 \u540e\u7eed\u534f\u8bae\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-refinement, typically structured as generation, critique, and revision, is a widely adopted paradigm for improving LLM generation and serves as a core mechanism in many LLM agents. While the three stages involve different cognitive demands, most existing approaches conveniently treat the model size as an implementation detail rather than a subject of study, which may lead to a waste of resources. Little work has systematically examined how model size affects each stage or whether effective self-refinement requires equally capable models for generation, critique, and revision. We present the first stage-wise model size study of the self-refinement pipeline on 5 benchmarks from different domains using 6 model sizes of Qwen3 and 4 model sizes of Gemma 3. We conclude that larger generators and refiners generally improve the pipeline, whereas an undersized refiner can even harm performance. Second, performance is highly insensitive to the size of the critic, although including even a small critic consistently outperforms omitting critique altogether. Our findings demonstrate that model capacity should not be allocated uniformly across self-refinement pipelines. Instead, different stages exhibit distinct size scaling characteristics, providing practical guidance for designing more computationally efficient multi-stage language model systems.", "arxiv_id": "2608.21345", "arxiv_url": "https://arxiv.org/abs/2608.21345", "authors": ["Zhuoyi Yang", "Ian G. Harris", "Salar Hashemitaheri", "Cassie Huang", "Yuangang Li", "Hyunwoo Oh", "Paul Dourish", "Tony Givargis", "Mohsen Imani", "Li Zhang"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u81ea\u6211\u7cbe\u70bc\u6d41\u7a0b\u4e2d\u751f\u6210\u3001\u6279\u8bc4\u3001\u4fee\u8ba2\u4e09\u4e2a\u9636\u6bb5\u5e94\u5982\u4f55\u5206\u914d\u6a21\u578b\u5bb9\u91cf\uff0c\u8986\u76d6 Qwen3 \u4e0e Gemma 3 \u7684\u591a\u79cd\u6a21\u578b\u89c4\u6a21\u548c 5 \u4e2a\u57fa\u51c6\u3002\u7ed3\u679c\u53d1\u73b0\u751f\u6210\u5668\u548c\u4fee\u8ba2\u5668\u8d8a\u5927\u901a\u5e38\u8d8a\u597d\uff0c\u8fc7\u5c0f\u7684\u4fee\u8ba2\u5668\u4f1a\u635f\u5bb3\u6027\u80fd\uff1b\u800c\u6279\u8bc4\u5668\u5bf9\u89c4\u6a21\u4e0d\u654f\u611f\uff0c\u5373\u4f7f\u5c0f\u6279\u8bc4\u5668\u4e5f\u4f18\u4e8e\u5b8c\u5168\u7701\u7565\u6279\u8bc4\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21345", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u6211\u7cbe\u70bc", "\u667a\u80fd\u4f53", "\u6a21\u578b\u7f29\u653e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21345v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Asymmetric Capacity Allocation in Self-Refinement Pipelines", "tldr": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u81ea\u6211\u7cbe\u70bc\u6d41\u7a0b\u4e2d\u751f\u6210\u3001\u6279\u8bc4\u3001\u4fee\u8ba2\u4e09\u4e2a\u9636\u6bb5\u5e94\u5982\u4f55\u5206\u914d\u6a21\u578b\u5bb9\u91cf\uff0c\u8986\u76d6 Qwen3 \u4e0e Gemma 3 \u7684\u591a\u79cd\u6a21\u578b\u89c4\u6a21\u548c 5 \u4e2a\u57fa\u51c6\u3002\u7ed3\u679c\u53d1\u73b0\u751f\u6210\u5668\u548c\u4fee\u8ba2\u5668\u8d8a\u5927\u901a\u5e38\u8d8a\u597d\uff0c\u8fc7\u5c0f\u7684\u4fee\u8ba2\u5668\u4f1a\u635f\u5bb3\u6027\u80fd\uff1b\u800c\u6279\u8bc4\u5668\u5bf9\u89c4\u6a21\u4e0d\u654f\u611f\uff0c\u5373\u4f7f\u5c0f\u6279\u8bc4\u5668\u4e5f\u4f18\u4e8e\u5b8c\u5168\u7701\u7565\u6279\u8bc4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic large language model (LLM) systems are reshaping scientific workflows in chemistry and drug discovery, but evaluating their open-ended, tool-augmented outputs remains a fundamental bottleneck. Reference-based metrics such as BLEU and ROUGE fail to capture semantic correctness, while expert human evaluation does not scale to the iteration speed these systems demand. The LLM-as-a-Judge paradigm has emerged as a scalable alternative, but existing drug discovery benchmarks deploy LLM judges without validating their alignment with human experts. In this work, we present an LLM-as-a-Judge evaluation framework for ChatInvent, an agentic drug discovery assistant deployed at AstraZeneca, with four contributions. First, we define four output-quality evaluation dimensions---Completeness, Relevancy, Structural Clarity, and Scope Adherence---alongside deterministic Tool Call Correctness checks. Second, we validate the judge through a human alignment study with five expert annotators, comparing Gemini 3.1 Pro, Claude Opus 4.7, GPT-5, and Llama 3.1 70B as candidate judges. Third, we optimize the best-performing judge using few-shot demonstrations of human-annotated examples, improving alignment with the human majority vote from 0.80 to 0.86. Fourth, applying the optimized judge to 70 held-out questions, we surface concrete limitations and find that informal phrasings do not systematically degrade output quality; if anything, it is helpful to have the LLM rewrite the original question before querying the agent. Our framework provides a reusable template for human-aligned evaluation of agentic systems in scientific domains.", "arxiv_id": "2608.21057", "arxiv_url": "https://arxiv.org/abs/2608.21057", "authors": ["Emma Granqvist", "Roc\u00edo Mercado", "Samuel Genheden"], "brief": "\u672c\u6587\u4e3a\u963f\u65af\u5229\u5eb7\u7684\u836f\u7269\u53d1\u73b0\u667a\u80fd\u4f53 ChatInvent \u8bbe\u8ba1\u4e86\u4e00\u4e2a\u57fa\u4e8e LLM-as-a-Judge \u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u8986\u76d6\u5b8c\u6574\u6027\u3001\u76f8\u5173\u6027\u3001\u7ed3\u6784\u6e05\u6670\u5ea6\u3001\u8303\u56f4\u9075\u5faa\u548c\u5de5\u5177\u8c03\u7528\u6b63\u786e\u6027\u3002\u901a\u8fc7\u4e13\u5bb6\u6807\u6ce8\u5bf9\u9f50\u6bd4\u8f83\u591a\u79cd\u5927\u6a21\u578b\u88c1\u5224\uff0c\u5e76\u7528\u5c11\u6837\u672c\u4eba\u7c7b\u6807\u6ce8\u793a\u4f8b\u5c06\u4e0e\u4eba\u7c7b\u591a\u6570\u6295\u7968\u7684\u4e00\u81f4\u6027\u4ece 0.80 \u63d0\u5347\u5230 0.86\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21057", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b", "\u836f\u7269\u53d1\u73b0", "\u4eba\u7c7b\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21057v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Designing a Robust LLM-Based Evaluation System for Agentic AI in Drug Discovery Through Human Alignment", "tldr": "\u672c\u6587\u4e3a\u963f\u65af\u5229\u5eb7\u7684\u836f\u7269\u53d1\u73b0\u667a\u80fd\u4f53 ChatInvent \u8bbe\u8ba1\u4e86\u4e00\u4e2a\u57fa\u4e8e LLM-as-a-Judge \u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u8986\u76d6\u5b8c\u6574\u6027\u3001\u76f8\u5173\u6027\u3001\u7ed3\u6784\u6e05\u6670\u5ea6\u3001\u8303\u56f4\u9075\u5faa\u548c\u5de5\u5177\u8c03\u7528\u6b63\u786e\u6027\u3002\u901a\u8fc7\u4e13\u5bb6\u6807\u6ce8\u5bf9\u9f50\u6bd4\u8f83\u591a\u79cd\u5927\u6a21\u578b\u88c1\u5224\uff0c\u5e76\u7528\u5c11\u6837\u672c\u4eba\u7c7b\u6807\u6ce8\u793a\u4f8b\u5c06\u4e0e\u4eba\u7c7b\u591a\u6570\u6295\u7968\u7684\u4e00\u81f4\u6027\u4ece 0.80 \u63d0\u5347\u5230 0.86\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "High-performance ML systems increasingly rely on GPU kernels whose editable source is unavailable, generated, or too distant from final machine code to expose remaining optimizations. Existing LLM kernel optimizers and autotuners mainly operate on CUDA, Triton, HIP, or tensor-program source and validate against reference implementations. We study a stricter setting: optimizing an already compiled AMDGPU code object, where the deployed binary is the only behavioral oracle. We present AsmEvo, an agentic assembly-level optimizer for AMD GPU kernels. Given an AMDGPU code object K0, AsmEvo reconstructs a reassemblable representation, proposes low-level edits with a long-horizon agent, rebuilds an ABI-preserving optimized object, and accepts candidates only after differential verification against K0 under identical launches. AsmEvo combines code-object recovery, metadata-aware rebuilding, profiling-guided hot-window editing, correctness-gated timing, and conservative in-place patch fallback. We conduct extensive experiments with AsmEvo on various AMD GPU kernels. On MI308X, AsmEvo improves 29 of 30 selected KernelBench kernels, reaching 1.35x geometric-mean and 3.88x maximum speedup. On MI300X production workloads, it improves all evaluated AITer binaries and vLLM/SGLang Triton assembly kernels, reaching 1.09x/1.31x and 1.18x/1.34x geometric-mean/maximum speedups, respectively, while preserving functional equivalence.", "arxiv_id": "2608.20711", "arxiv_url": "https://arxiv.org/abs/2608.20711", "authors": ["Ji Liu", "Puyuan Yang", "Rongzhang Zheng", "Fan Wang", "Jinglin Wang", "Muhammad A. Awad", "Mortis Huang", "Andy Chang", "Zekai Li", "Zeping Li", "Zihao An", "Yue Liu", "Yuchen Yang", "Jianghui Wang", "Chushi Chen", "Ziqiong Liu", "Fuwei Yang", "Dong Li", "Wen Heng Chung", "Shengcai Liu", "Emad Barsoum"], "brief": "AsmEvo \u9762\u5411\u53ea\u6709\u5df2\u7f16\u8bd1 AMDGPU \u4e8c\u8fdb\u5236\u53ef\u7528\u7684\u4e25\u683c\u573a\u666f\uff0c\u4f7f\u7528\u957f\u7a0b\u667a\u80fd\u4f53\u5728\u6c47\u7f16\u7ea7\u91cd\u6784\u3001\u7f16\u8f91\u3001\u91cd\u5efa\u5e76\u4f18\u5316 GPU kernel\u3002\u5b83\u901a\u8fc7\u4e0e\u539f\u59cb\u4e8c\u8fdb\u5236\u7684\u5dee\u5206\u9a8c\u8bc1\u4fdd\u8bc1\u529f\u80fd\u7b49\u4ef7\uff0c\u5728 MI308X KernelBench \u4e0a\u83b7\u5f97 1.35 \u500d\u51e0\u4f55\u5e73\u5747\u52a0\u901f\u3001\u6700\u9ad8 3.88 \u500d\uff0c\u5728 MI300X \u751f\u4ea7\u8d1f\u8f7d\u4e0a\u4e5f\u5b9e\u73b0\u7a33\u5b9a\u52a0\u901f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20711", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "GPU\u4f18\u5316", "\u6c47\u7f16\u4f18\u5316", "\u7a0b\u5e8f\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20711v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AsmEvo: Agentic Assembly-Level Optimization of AMD GPU Kernels with Functional Equivalence Verification", "tldr": "AsmEvo \u9762\u5411\u53ea\u6709\u5df2\u7f16\u8bd1 AMDGPU \u4e8c\u8fdb\u5236\u53ef\u7528\u7684\u4e25\u683c\u573a\u666f\uff0c\u4f7f\u7528\u957f\u7a0b\u667a\u80fd\u4f53\u5728\u6c47\u7f16\u7ea7\u91cd\u6784\u3001\u7f16\u8f91\u3001\u91cd\u5efa\u5e76\u4f18\u5316 GPU kernel\u3002\u5b83\u901a\u8fc7\u4e0e\u539f\u59cb\u4e8c\u8fdb\u5236\u7684\u5dee\u5206\u9a8c\u8bc1\u4fdd\u8bc1\u529f\u80fd\u7b49\u4ef7\uff0c\u5728 MI308X KernelBench \u4e0a\u83b7\u5f97 1.35 \u500d\u51e0\u4f55\u5e73\u5747\u52a0\u901f\u3001\u6700\u9ad8 3.88 \u500d\uff0c\u5728 MI300X \u751f\u4ea7\u8d1f\u8f7d\u4e0a\u4e5f\u5b9e\u73b0\u7a33\u5b9a\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Identity-preserving video generation aims to synthesize videos that follow natural-language instructions while maintaining the visual identity of a given subject. Recent commercial video generation models have achieved strong visual quality and motion realism, but they still suffer from identity drift, incomplete instruction following, and missing visual details under complex prompts. Since these models are usually closed-source black boxes, directly improving them through parameter optimization is often infeasible. We therefore propose Agentic Enhancement and Semantic Repair (AESR), a lightweight enhancement framework for identity-preserving video generation. To improve prompt construction before generation and mitigate the above failures, AESR introduces a global agentic prompt enhancement module. This module learns model-specific prompting formats from official documentation, acquires human-centered video generation priors from human-interaction data, and accumulates test-domain identity-preserving generation experience into a reusable playbook through an agentic loop. To further repair errors in videos generated with enhanced prompts, AESR introduces a sample-level visual semantic repair module, which uses a VLM to locate erroneous video segments and design repair instructions, edits selected frames into explicit visual references, and guides a video editing model to fix local semantic or identity-related errors. We also adopt a lightweight Mixture-of-Experts selection strategy to choose reliable outputs from different generation and refinement paths. Under the official evaluation protocol of the ACM MM 2026 Identity-Preserving Video Generation Challenge, our system MIPL\\_Video ranked first in Track 1, demonstrating the effectiveness of AESR for practical identity-preserving video generation. The code is available at https://github.com/oceanflowlab/AESR.", "arxiv_id": "2608.20749", "arxiv_url": "https://arxiv.org/abs/2608.20749", "authors": ["Jiayi Gao", "Changcheng Hua", "Jiaqi Tang", "Yuxin Peng", "Yang Liu"], "brief": "\u672c\u6587\u63d0\u51fa AESR\uff0c\u4e00\u4e2a\u9762\u5411\u9ed1\u76d2\u6587\u751f\u89c6\u9891\u6a21\u578b\u7684\u8f7b\u91cf\u589e\u5f3a\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u590d\u6742\u63d0\u793a\u4e0b\u4fdd\u6301\u4e3b\u4f53\u8eab\u4efd\u4e00\u81f4\u3002\u65b9\u6cd5\u901a\u8fc7\u667a\u80fd\u4f53\u5f0f\u63d0\u793a\u589e\u5f3a\u3001VLM \u9a71\u52a8\u7684\u8bed\u4e49\u4fee\u590d\u548c MoE \u8f93\u51fa\u9009\u62e9\u6765\u51cf\u5c11\u8eab\u4efd\u6f02\u79fb\u3001\u6307\u4ee4\u9057\u6f0f\u4e0e\u7ec6\u8282\u9519\u8bef\uff0c\u5e76\u5728 ACM MM 2026 \u8eab\u4efd\u4fdd\u6301\u89c6\u9891\u751f\u6210\u6311\u6218 Track 1 \u4e2d\u6392\u540d\u7b2c\u4e00\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20749", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6587\u751f\u89c6\u9891", "\u8eab\u4efd\u4fdd\u6301", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20749v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Identity-Preserving Text-to-Video Generation via Agentic Enhancement and Semantic Repair", "tldr": "\u672c\u6587\u63d0\u51fa AESR\uff0c\u4e00\u4e2a\u9762\u5411\u9ed1\u76d2\u6587\u751f\u89c6\u9891\u6a21\u578b\u7684\u8f7b\u91cf\u589e\u5f3a\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u590d\u6742\u63d0\u793a\u4e0b\u4fdd\u6301\u4e3b\u4f53\u8eab\u4efd\u4e00\u81f4\u3002\u65b9\u6cd5\u901a\u8fc7\u667a\u80fd\u4f53\u5f0f\u63d0\u793a\u589e\u5f3a\u3001VLM \u9a71\u52a8\u7684\u8bed\u4e49\u4fee\u590d\u548c MoE \u8f93\u51fa\u9009\u62e9\u6765\u51cf\u5c11\u8eab\u4efd\u6f02\u79fb\u3001\u6307\u4ee4\u9057\u6f0f\u4e0e\u7ec6\u8282\u9519\u8bef\uff0c\u5e76\u5728 ACM MM 2026 \u8eab\u4efd\u4fdd\u6301\u89c6\u9891\u751f\u6210\u6311\u6218 Track 1 \u4e2d\u6392\u540d\u7b2c\u4e00\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Animating articulated 3D meshes via text requires satisfying strict kinematic constraints, modeling causal interactions between parts, and achieving instruction fidelity. Due to the absence of task-specific training data and explicit articulation supervision, existing data-driven mesh animation methods are largely inapplicable to this setting. To address this, we propose ArtiMo, a novel agent-driven framework for text-guided articulated mesh animation. Operating in a zero-shot manner, ArtiMo develops an agentic pipeline powered by Large Language and Vision-Language Models (LLMs/VLMs) to orchestrate motion generation. By synergizing the explicit kinematic constraints of URDF with the agent\u0027s reasoning and planning capabilities, it effectively produces causally coherent part motions and interactions without requiring model fine-tuning. To ensure motion correctness, the agent additionally utilizes a visual self-improvement mechanism: generated animations are rendered into compact keyframes and motion cues, enabling the VLM to iteratively diagnose and correct errors. Furthermore, we contribute a new benchmark dataset spanning 21 articulated object categories, featuring high-quality motion annotations enriched with causal relationships. Extensive experiments demonstrate that ArtiMo significantly outperforms baselines, particularly on complex, causally driven motions. The project page is available at https://zou-2004.github.io/ArtiMo/.", "arxiv_id": "2608.20699", "arxiv_url": "https://arxiv.org/abs/2608.20699", "authors": ["Chunyu Zou", "Peng Dai", "Yi-Hua Huang", "Ze Yuan", "Jingwei Huang", "Yeming Yao", "Xiaojuan Qi"], "brief": "ArtiMo \u63d0\u51fa\u4e00\u79cd\u96f6\u6837\u672c\u7684\u667a\u80fd\u4f53\u9a71\u52a8\u6846\u67b6\uff0c\u7528 LLM/VLM \u7ed3\u5408 URDF \u8fd0\u52a8\u5b66\u7ea6\u675f\uff0c\u5c06\u6587\u672c\u6307\u4ee4\u8f6c\u5316\u4e3a\u5173\u8282\u5f0f 3D \u7f51\u683c\u52a8\u753b\u3002\u5b83\u901a\u8fc7\u6e32\u67d3\u5173\u952e\u5e27\u4e0e\u8fd0\u52a8\u7ebf\u7d22\u8fdb\u884c\u89c6\u89c9\u81ea\u6211\u8bca\u65ad\u548c\u4fee\u6b63\uff0c\u5728\u590d\u6742\u56e0\u679c\u90e8\u4ef6\u8fd0\u52a8\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u63d0\u4f9b\u4e86\u65b0\u7684\u5173\u8282\u7269\u4f53\u52a8\u753b\u57fa\u51c6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20699", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e09\u7ef4\u52a8\u753b", "\u591a\u6a21\u6001", "\u7f51\u683c\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20699v1", "published_at": "2026-08-21", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ArtiMo: Agent-Driven Articulated Mesh Animation", "tldr": "ArtiMo \u63d0\u51fa\u4e00\u79cd\u96f6\u6837\u672c\u7684\u667a\u80fd\u4f53\u9a71\u52a8\u6846\u67b6\uff0c\u7528 LLM/VLM \u7ed3\u5408 URDF \u8fd0\u52a8\u5b66\u7ea6\u675f\uff0c\u5c06\u6587\u672c\u6307\u4ee4\u8f6c\u5316\u4e3a\u5173\u8282\u5f0f 3D \u7f51\u683c\u52a8\u753b\u3002\u5b83\u901a\u8fc7\u6e32\u67d3\u5173\u952e\u5e27\u4e0e\u8fd0\u52a8\u7ebf\u7d22\u8fdb\u884c\u89c6\u89c9\u81ea\u6211\u8bca\u65ad\u548c\u4fee\u6b63\uff0c\u5728\u590d\u6742\u56e0\u679c\u90e8\u4ef6\u8fd0\u52a8\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u63d0\u4f9b\u4e86\u65b0\u7684\u5173\u8282\u7269\u4f53\u52a8\u753b\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We develop a new direct accelerated Newton method for minimizing convex functions with Lipschitz continuous Hessian. The algorithm uses only primal variables and performs just one linear solve per iteration. With a simple predetermined choice of parameters, it achieves the global convergence rate of $O(1/k^3)$ in terms of the functional residual. To the best of our knowledge, this is the first second-order method for this problem class attaining this rate while relying solely on one linear system solve per iteration (without solving auxiliary nonlinear regularized subproblems, such as cubic regularization, performing nonlinear parameter searches, or using dual extragradient corrections). Our method can be implemented in a Hessian-free way, using an inexact linear system solver, while preserving the fast global rate. We further extend our construction to arbitrary geometry through Bregman divergence, and to composite optimization problems.", "arxiv_id": "2608.21359", "arxiv_url": "https://arxiv.org/abs/2608.21359", "authors": ["Nikita Doikov"], "brief": "\u63d0\u51fa\u4e00\u79cd\u65b0\u7684\u76f4\u63a5\u52a0\u901f\u725b\u987f\u6cd5\uff0c\u7528\u4e8e\u6700\u5c0f\u5316 Hessian Lipschitz \u8fde\u7eed\u7684\u51f8\u51fd\u6570\u3002\u8be5\u65b9\u6cd5\u53ea\u4f7f\u7528\u539f\u59cb\u53d8\u91cf\u3001\u6bcf\u8f6e\u4ec5\u9700\u89e3\u4e00\u4e2a\u7ebf\u6027\u7cfb\u7edf\uff0c\u5373\u53ef\u8fbe\u5230\u51fd\u6570\u6b8b\u5dee\u5168\u5c40 O(1/k^3) \u6536\u655b\u7387\uff0c\u5e76\u53ef\u6269\u5c55\u5230 Hessian-free\u3001Bregman \u51e0\u4f55\u548c\u590d\u5408\u4f18\u5316\u573a\u666f\u3002", "categories": ["math.OC", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21359", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u51f8\u4f18\u5316", "\u725b\u987f\u6cd5", "\u4e8c\u9636\u4f18\u5316", "\u52a0\u901f\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21359v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Primal Acceleration of Newton\u0027s Method", "tldr": "\u63d0\u51fa\u4e00\u79cd\u65b0\u7684\u76f4\u63a5\u52a0\u901f\u725b\u987f\u6cd5\uff0c\u7528\u4e8e\u6700\u5c0f\u5316 Hessian Lipschitz \u8fde\u7eed\u7684\u51f8\u51fd\u6570\u3002\u8be5\u65b9\u6cd5\u53ea\u4f7f\u7528\u539f\u59cb\u53d8\u91cf\u3001\u6bcf\u8f6e\u4ec5\u9700\u89e3\u4e00\u4e2a\u7ebf\u6027\u7cfb\u7edf\uff0c\u5373\u53ef\u8fbe\u5230\u51fd\u6570\u6b8b\u5dee\u5168\u5c40 O(1/k^3) \u6536\u655b\u7387\uff0c\u5e76\u53ef\u6269\u5c55\u5230 Hessian-free\u3001Bregman \u51e0\u4f55\u548c\u590d\u5408\u4f18\u5316\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In professional life sciences workflows, scientists routinely interpret visual artifacts (gel blots, microscopy images, plasmid maps, flow cytometry plots, molecular structures, ...) to inform research decisions. We introduce VIALS, a visual question-answering benchmark with 161 such interpretation tasks, spanning the types of artifacts examined throughout experimental workflows in the biotech industry (rather than polished figures from publications and textbooks). While frontier vision-language models can now fluently describe natural images, we find that they are unable to accurately interpret these scientific images, reflecting limitations in domain knowledge and domain-specific visual reasoning capabilities. In contrast, scientists with relevant domain expertise find these visual interpretation tasks straightforward. AI that cannot similarly interpret such images will have limited utility in professional life sciences workflows, where such artifacts are central to how scientists reason, communicate, and make decisions.", "arxiv_id": "2608.21357", "arxiv_url": "https://arxiv.org/abs/2608.21357", "authors": ["Elaine Lau", "Thanuka Udumulla", "Lee Izhaki-Tavor", "Francisco Guzm\u00e1n", "Nicholas Magazine", "Jonas Mueller"], "brief": "\u8bba\u6587\u63d0\u51fa VIALS\uff0c\u4e00\u4e2a\u9762\u5411\u751f\u547d\u79d1\u5b66\u5de5\u4f5c\u6d41\u4e2d\u771f\u5b9e\u89c6\u89c9\u4ea7\u7269\u7684\u95ee\u7b54\u57fa\u51c6\uff0c\u6db5\u76d6\u51dd\u80f6\u56fe\u3001\u663e\u5fae\u56fe\u3001\u8d28\u7c92\u56fe\u3001\u6d41\u5f0f\u7ec6\u80de\u56fe\u3001\u5206\u5b50\u7ed3\u6784\u7b49 161 \u4e2a\u89e3\u91ca\u4efb\u52a1\u3002\u5b9e\u9a8c\u53d1\u73b0\u524d\u6cbf\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u867d\u80fd\u63cf\u8ff0\u81ea\u7136\u56fe\u50cf\uff0c\u4f46\u5728\u8fd9\u4e9b\u4e13\u4e1a\u79d1\u5b66\u56fe\u50cf\u7406\u89e3\u4e0a\u8868\u73b0\u4e0d\u4f73\uff0c\u66b4\u9732\u51fa\u9886\u57df\u77e5\u8bc6\u548c\u4e13\u4e1a\u89c6\u89c9\u63a8\u7406\u80fd\u529b\u7684\u4e0d\u8db3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21357", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u95ee\u7b54", "\u751f\u547d\u79d1\u5b66", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u79d1\u5b66\u56fe\u50cf\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21357v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VIALS: A Benchmark for Visual Interpretation of Artifacts in the Life Sciences", "tldr": "\u8bba\u6587\u63d0\u51fa VIALS\uff0c\u4e00\u4e2a\u9762\u5411\u751f\u547d\u79d1\u5b66\u5de5\u4f5c\u6d41\u4e2d\u771f\u5b9e\u89c6\u89c9\u4ea7\u7269\u7684\u95ee\u7b54\u57fa\u51c6\uff0c\u6db5\u76d6\u51dd\u80f6\u56fe\u3001\u663e\u5fae\u56fe\u3001\u8d28\u7c92\u56fe\u3001\u6d41\u5f0f\u7ec6\u80de\u56fe\u3001\u5206\u5b50\u7ed3\u6784\u7b49 161 \u4e2a\u89e3\u91ca\u4efb\u52a1\u3002\u5b9e\u9a8c\u53d1\u73b0\u524d\u6cbf\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u867d\u80fd\u63cf\u8ff0\u81ea\u7136\u56fe\u50cf\uff0c\u4f46\u5728\u8fd9\u4e9b\u4e13\u4e1a\u79d1\u5b66\u56fe\u50cf\u7406\u89e3\u4e0a\u8868\u73b0\u4e0d\u4f73\uff0c\u66b4\u9732\u51fa\u9886\u57df\u77e5\u8bc6\u548c\u4e13\u4e1a\u89c6\u89c9\u63a8\u7406\u80fd\u529b\u7684\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "For sixty years, machine verification has been a major cost overhead, affordable only for exceptional artifacts. Here we report that generative AI inverts this relationship: at AI speed, machine verification is not only economical but essential to productivity --- it is the incorruptible referee that lets one person safely direct autonomous machine work at scale. In five weeks, one researcher on consumer AI subscriptions directed a small fleet of AI agents from application code, through a verified compiler and executive, to a RISC-V processor taped out on a community silicon shuttle; no proof passed through human review, and no RTL was written by a human. The working discipline --- the Salt method --- rests on a proof kernel no hallucinated proof can pass: mathematical claims travel between agents as kernel-checked artifacts, and human attention is reserved for statements, designs, and rulings. Verification is stated link by link, from the Lean 4 kernel to SAT-checked equivalence at the silicon boundary. We publish the complete accounting: theorem provenance, a pre-registered token meter, floor-bounded human time, and an error ledger whose catch numbering runs to #256 --- a monotone counter over the mathematics campaign\u0027s append-only flags ledger, maintained 2026-07-07 to 2026-07-20 (one number, #79, was never assigned; later catches are recorded un-numbered) --- against zero incorrect proofs reaching the record.", "arxiv_id": "2608.21356", "arxiv_url": "https://arxiv.org/abs/2608.21356", "authors": ["Jason Hickey"], "brief": "\u8bba\u6587\u62a5\u544a\u4e86\u4e00\u79cd\u540d\u4e3a Salt \u7684\u5de5\u4f5c\u6d41\uff1a\u7528\u751f\u6210\u5f0f AI \u667a\u80fd\u4f53\u534f\u4f5c\u5b8c\u6210\u4ece\u5e94\u7528\u4ee3\u7801\u3001\u9a8c\u8bc1\u7f16\u8bd1\u5668\u5230 RISC-V \u5904\u7406\u5668\u6d41\u7247\u7684\u7aef\u5230\u7aef\u6784\u5efa\uff0c\u5e76\u7528 Lean 4\u3001SAT \u7b49\u673a\u5668\u9a8c\u8bc1\u4f5c\u4e3a\u4e0d\u53ef\u7ed5\u8fc7\u7684\u88c1\u5224\u3002\u4f5c\u8005\u79f0\u5355\u4eba\u5728\u4e94\u5468\u5185\u501f\u52a9\u6d88\u8d39\u7ea7 AI \u670d\u52a1\u5b8c\u6210\u8be5\u6d41\u7a0b\uff0c\u4e14\u6ca1\u6709\u9519\u8bef\u8bc1\u660e\u8fdb\u5165\u6700\u7ec8\u8bb0\u5f55\uff0c\u5c55\u793a\u4e86\u201cAI \u751f\u6210 + \u5f62\u5f0f\u5316\u9a8c\u8bc1\u201d\u5728\u5927\u89c4\u6a21\u81ea\u4e3b\u5de5\u7a0b\u4e2d\u7684\u6f5c\u529b\u3002", "categories": ["cs.SE", "cs.AI", "cs.AR", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21356", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u7f16\u8bd1\u5668", "\u82af\u7247\u8bbe\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21356v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AI with Authority, from Application to Silicon", "tldr": "\u8bba\u6587\u62a5\u544a\u4e86\u4e00\u79cd\u540d\u4e3a Salt \u7684\u5de5\u4f5c\u6d41\uff1a\u7528\u751f\u6210\u5f0f AI \u667a\u80fd\u4f53\u534f\u4f5c\u5b8c\u6210\u4ece\u5e94\u7528\u4ee3\u7801\u3001\u9a8c\u8bc1\u7f16\u8bd1\u5668\u5230 RISC-V \u5904\u7406\u5668\u6d41\u7247\u7684\u7aef\u5230\u7aef\u6784\u5efa\uff0c\u5e76\u7528 Lean 4\u3001SAT \u7b49\u673a\u5668\u9a8c\u8bc1\u4f5c\u4e3a\u4e0d\u53ef\u7ed5\u8fc7\u7684\u88c1\u5224\u3002\u4f5c\u8005\u79f0\u5355\u4eba\u5728\u4e94\u5468\u5185\u501f\u52a9\u6d88\u8d39\u7ea7 AI \u670d\u52a1\u5b8c\u6210\u8be5\u6d41\u7a0b\uff0c\u4e14\u6ca1\u6709\u9519\u8bef\u8bc1\u660e\u8fdb\u5165\u6700\u7ec8\u8bb0\u5f55\uff0c\u5c55\u793a\u4e86\u201cAI \u751f\u6210 + \u5f62\u5f0f\u5316\u9a8c\u8bc1\u201d\u5728\u5927\u89c4\u6a21\u81ea\u4e3b\u5de5\u7a0b\u4e2d\u7684\u6f5c\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Contextualization is essential for production automatic speech recognition (ASR) systems, where user-provided phrases must be recognized accurately under strict latency constraints. Although many context-biasing methods improve recognition accuracy, they often do not address the practical requirements of modern production ASR systems: streaming inference, efficient batched decoding, user-specific context lists, and low runtime overhead. We propose TurboBias 2.0, a production-oriented framework for efficient phrase boosting in Transducer-based ASR systems. The framework extends GPU-accelerated TurboBias with a case-insensitive boosting graph and per-stream batched decoding, allowing each utterance in a batch to use an independent context-biasing configuration. This enables personalized context biasing for multiple simultaneous users without sharing or mixing their context lists. The proposed framework supports both offline and streaming inference and can be used with greedy and beam-search decoding. Experiments show that TurboBias 2.0 improves contextual phrase recognition while preserving low latency and high throughput.", "arxiv_id": "2608.21343", "arxiv_url": "https://arxiv.org/abs/2608.21343", "authors": ["Vladimir Bataev", "Lilit Grigoryan", "Andrei Andrusenko", "Nikolay Karpov", "Vitaly Lavrukhin", "Boris Ginsburg"], "brief": "TurboBias 2.0 \u9762\u5411\u751f\u4ea7\u7ea7 Transducer ASR\uff0c\u63d0\u4f9b\u6d41\u5f0f\u4e0a\u4e0b\u6587\u504f\u7f6e/\u77ed\u8bed\u589e\u5f3a\uff0c\u652f\u6301\u5927\u5c0f\u5199\u4e0d\u654f\u611f\u7684 boosting \u56fe\u548c\u6309\u6d41\u72ec\u7acb\u914d\u7f6e\u7684\u6279\u91cf\u89e3\u7801\u3002\u5b9e\u9a8c\u8868\u660e\u5b83\u80fd\u63d0\u5347\u7528\u6237\u81ea\u5b9a\u4e49\u77ed\u8bed\u8bc6\u522b\u51c6\u786e\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u4f4e\u5ef6\u8fdf\u548c\u9ad8\u541e\u5410\uff0c\u9002\u5408\u591a\u7528\u6237\u4e2a\u6027\u5316 ASR \u573a\u666f\u3002", "categories": ["eess.AS", "cs.AI", "cs.CL", "cs.LG", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21343", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u4e0a\u4e0b\u6587\u504f\u7f6e", "\u6d41\u5f0f\u63a8\u7406", "\u6279\u91cf\u89e3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21343v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TurboBias 2.0: Streaming Context-Biasing for Production-Efficient ASR Systems", "tldr": "TurboBias 2.0 \u9762\u5411\u751f\u4ea7\u7ea7 Transducer ASR\uff0c\u63d0\u4f9b\u6d41\u5f0f\u4e0a\u4e0b\u6587\u504f\u7f6e/\u77ed\u8bed\u589e\u5f3a\uff0c\u652f\u6301\u5927\u5c0f\u5199\u4e0d\u654f\u611f\u7684 boosting \u56fe\u548c\u6309\u6d41\u72ec\u7acb\u914d\u7f6e\u7684\u6279\u91cf\u89e3\u7801\u3002\u5b9e\u9a8c\u8868\u660e\u5b83\u80fd\u63d0\u5347\u7528\u6237\u81ea\u5b9a\u4e49\u77ed\u8bed\u8bc6\u522b\u51c6\u786e\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u4f4e\u5ef6\u8fdf\u548c\u9ad8\u541e\u5410\uff0c\u9002\u5408\u591a\u7528\u6237\u4e2a\u6027\u5316 ASR \u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep-learning models of anatomy can be numerically plausible yet anatomically impossible, and they generalize poorly when data are scarce. We introduce Anatomy-Informed Neural Networks (AINN), in which soft anatomic priors enter as penalty terms in the loss (e.g., a branching penalty that treats a renal transplant artery off the iliac instead of the aorta as unexpected rather than impossible), in direct analogy to a physics-informed neural network, and hard anatomic priors (e.g., continuity of the vessel) are built into the architecture and state representation, making such invalid predictions impossible by construction wherever the prior admits architectural enforcement. We develop it on a clinical test case with limited data: how the aortoiliac tree deforms when a stiff wire is introduced endoluminally. This is important to contemporary aortic surgery and will matter to autonomous endovascular navigation. We lift the vessel centerline and the wire path from R^3 to curves of frames in the Lie group SE(3), and couple a Cosserat-rod wire to a tortuosity-modulated, anatomically anchored vessel through a unilateral lumen-contact inequality. The prediction is a constrained minimizer of the coupled elastic energy, with contact forces as its Lagrange multipliers. Supervision is a Wasserstein-2 optimal-transport loss between the predicted projection through the C-arm geometry and the observed angiogram, so a 2D angiogram can train a 3D prediction. The kinematics, loss and projection are verified against known ground truth; the mechanics solver only against its own optimality conditions, and predicted displacement is not yet mesh-converged. Here, no network is trained. Future work will transfer this in silico model to real CT scans and test whether it improves predictive accuracy and reduces the training data required.", "arxiv_id": "2608.21332", "arxiv_url": "https://arxiv.org/abs/2608.21332", "authors": ["David P. Stonko"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u89e3\u5256\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc\u201d\u6846\u67b6\uff0c\u5c06\u8f6f\u6027\u89e3\u5256\u5148\u9a8c\u5199\u5165\u635f\u5931\u51fd\u6570\u3001\u786c\u6027\u89e3\u5256\u7ea6\u675f\u5199\u5165\u67b6\u6784\uff0c\u4ee5\u51cf\u5c11\u6570\u636e\u7a00\u7f3a\u4e0b\u89e3\u5256\u4e0a\u4e0d\u53ef\u80fd\u7684\u9884\u6d4b\u3002\u4f5c\u8005\u4ee5\u5bfc\u4e1d\u5bfc\u81f4\u4e3b\u52a8\u8109-\u9ac2\u52a8\u8109\u5f62\u53d8\u4e3a\u6848\u4f8b\uff0c\u7ed9\u51fa\u57fa\u4e8e SE(3)\u3001Cosserat \u6746\u548c\u8840\u7ba1\u63a5\u89e6\u7ea6\u675f\u7684\u7269\u7406/\u51e0\u4f55\u5efa\u6a21\uff0c\u5e76\u75282D\u8840\u7ba1\u9020\u5f71\u76d1\u77633D\u9884\u6d4b\uff1b\u4f46\u76ee\u524d\u5c1a\u672a\u8bad\u7ec3\u7f51\u7edc\uff0c\u9a8c\u8bc1\u4ecd\u8f83\u521d\u6b65\u3002", "categories": ["cs.AI", "cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21332", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u89e3\u5256\u5148\u9a8c", "\u7269\u7406\u7ea6\u675f\u5b66\u4e60", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21332v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Anatomy-Informed Neural Networks: Encoding Anatomic Priors in Loss and Architecture, with an SE(3) Formulation of Guidewire-Induced Aortoiliac Deformation", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u89e3\u5256\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc\u201d\u6846\u67b6\uff0c\u5c06\u8f6f\u6027\u89e3\u5256\u5148\u9a8c\u5199\u5165\u635f\u5931\u51fd\u6570\u3001\u786c\u6027\u89e3\u5256\u7ea6\u675f\u5199\u5165\u67b6\u6784\uff0c\u4ee5\u51cf\u5c11\u6570\u636e\u7a00\u7f3a\u4e0b\u89e3\u5256\u4e0a\u4e0d\u53ef\u80fd\u7684\u9884\u6d4b\u3002\u4f5c\u8005\u4ee5\u5bfc\u4e1d\u5bfc\u81f4\u4e3b\u52a8\u8109-\u9ac2\u52a8\u8109\u5f62\u53d8\u4e3a\u6848\u4f8b\uff0c\u7ed9\u51fa\u57fa\u4e8e SE(3)\u3001Cosserat \u6746\u548c\u8840\u7ba1\u63a5\u89e6\u7ea6\u675f\u7684\u7269\u7406/\u51e0\u4f55\u5efa\u6a21\uff0c\u5e76\u75282D\u8840\u7ba1\u9020\u5f71\u76d1\u77633D\u9884\u6d4b\uff1b\u4f46\u76ee\u524d\u5c1a\u672a\u8bad\u7ec3\u7f51\u7edc\uff0c\u9a8c\u8bc1\u4ecd\u8f83\u521d\u6b65\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We formalize the Steiner Traveling Salesman Problem (Steiner-TSP) on Graphs of Convex Sets (GCS), which seeks a minimum-cost closed trajectory through required convex sets while allowing optional transit vertices and revisits. To explore the resulting infinite solution space, we propose a unified branch-and-bound search over rooted walk prefixes. Additive lower-bound-graph costs bound committed prefixes, while a cut-separated connected-flow relaxation lower-bounds the residual cost of visiting every remaining target and returning to the root. Under a uniform positive-cost assumption, best-first traversal terminates after finitely many expansions on every feasible instance without an initial incumbent, whereas depth-first traversal does so once a finite incumbent is available. For a user-specified factor $\u03b5\\geq1$, a global lower bound certifies that either strategy\u0027s incumbent cost is at most $\u03b5$ times the global optimum. We further demonstrate joint sensing-mode, visitation-order, and continuous-trajectory selection for a mobile-manipulator inspection task, including action precedences expressed in linear temporal logic over finite traces (LTL$_f$). Both traversal strategies find feasible solutions on all benchmark instances within 30s with mean certified optimality gaps of 28.1% and 29.7%, respectively, whereas two recent baselines succeed on only about half of the instances", "arxiv_id": "2608.21319", "arxiv_url": "https://arxiv.org/abs/2608.21319", "authors": ["Jingtao Tang", "Hang Ma"], "brief": "\u672c\u6587\u5c06\u51f8\u96c6\u56fe\u4e0a\u7684 Steiner-TSP \u5f62\u5f0f\u5316\uff0c\u7528\u4e8e\u5728\u5fc5\u987b\u8bbf\u95ee\u7684\u51f8\u96c6\u95f4\u5bfb\u627e\u6700\u5c0f\u6210\u672c\u95ed\u5408\u8f68\u8ff9\uff0c\u540c\u65f6\u5141\u8bb8\u53ef\u9009\u4e2d\u8f6c\u70b9\u548c\u91cd\u590d\u8bbf\u95ee\u3002\u63d0\u51fa\u7edf\u4e00\u7684\u5206\u652f\u5b9a\u754c\u641c\u7d22\u4e0e\u6b8b\u4f59\u8fde\u901a\u6d41\u677e\u5f1b\u4e0b\u754c\uff0c\u53ef\u5728\u4e00\u5b9a\u6761\u4ef6\u4e0b\u6709\u9650\u7ec8\u6b62\u5e76\u7ed9\u51fa \u03b5 \u8fd1\u4f3c\u6700\u4f18\u6027\u8bc1\u4e66\uff1b\u5728\u79fb\u52a8\u673a\u68b0\u81c2\u5de1\u68c0\u57fa\u51c6\u4e0a\uff0c30 \u79d2\u5185\u5747\u80fd\u627e\u5230\u53ef\u884c\u89e3\uff0c\u5e73\u5747\u8ba4\u8bc1\u6700\u4f18\u6027\u95f4\u9699\u7ea6 28%\u201330%\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21319", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8def\u5f84\u89c4\u5212", "\u5206\u652f\u5b9a\u754c", "\u673a\u5668\u4eba", "\u51f8\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21319v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unified Branch-and-Bound Search for the Steiner Traveling Salesman Problem on Graphs of Convex Sets", "tldr": "\u672c\u6587\u5c06\u51f8\u96c6\u56fe\u4e0a\u7684 Steiner-TSP \u5f62\u5f0f\u5316\uff0c\u7528\u4e8e\u5728\u5fc5\u987b\u8bbf\u95ee\u7684\u51f8\u96c6\u95f4\u5bfb\u627e\u6700\u5c0f\u6210\u672c\u95ed\u5408\u8f68\u8ff9\uff0c\u540c\u65f6\u5141\u8bb8\u53ef\u9009\u4e2d\u8f6c\u70b9\u548c\u91cd\u590d\u8bbf\u95ee\u3002\u63d0\u51fa\u7edf\u4e00\u7684\u5206\u652f\u5b9a\u754c\u641c\u7d22\u4e0e\u6b8b\u4f59\u8fde\u901a\u6d41\u677e\u5f1b\u4e0b\u754c\uff0c\u53ef\u5728\u4e00\u5b9a\u6761\u4ef6\u4e0b\u6709\u9650\u7ec8\u6b62\u5e76\u7ed9\u51fa \u03b5 \u8fd1\u4f3c\u6700\u4f18\u6027\u8bc1\u4e66\uff1b\u5728\u79fb\u52a8\u673a\u68b0\u81c2\u5de1\u68c0\u57fa\u51c6\u4e0a\uff0c30 \u79d2\u5185\u5747\u80fd\u627e\u5230\u53ef\u884c\u89e3\uff0c\u5e73\u5747\u8ba4\u8bc1\u6700\u4f18\u6027\u95f4\u9699\u7ea6 28%\u201330%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The European Union (EU) has emerged as a leading regulatory body in the development of sustainability and privacy regulations. While new regulation requirements vary, many include a documentation artifact to ensure compliance. Notably, the Ecodesign for Sustainable Products Regulation (ESPR) introduces Digital Product Passports (DPPs) for life cycle transparency, while the General Data Protection Regulation (GDPR) mandates Data Protection Impact Assessments (DPIAs) to mitigate privacy risks. Creating these compliance artifacts, however, is challenging. Industrial data, which often exists in heterogeneous formats and is scattered across company and supplier systems, is required for DPPs and can be difficult to extract into compliant DPP formatting. Furthermore, DPIA documents require interdisciplinary expertise and follow no standardized format, making development difficult for novel systems. To address the particular complexity of compliance artifact creation for both regulations, researchers have proposed the use of LLMs in the generation process; however, the impact of the aforementioned problems on the output of these systems is largely unaddressed. This work investigates the existing research gap by exploring how data extraction instructions and regulatory vagueness impact the quality and consistency of LLM-produced compliance artifacts. The resulting artifacts are evaluated by benchmarking different models against manually created ground-truth schemas. The results reveal that less strict guidelines, such as DPIA formatting, require higher context prompts to maintain consistency and completeness. Stricter guidelines, such as formatting for Digital Battery Passports (DBP), result in consistent results regardless of prompt context, but may lead to more hallucinations in the output", "arxiv_id": "2608.21317", "arxiv_url": "https://arxiv.org/abs/2608.21317", "authors": ["Adriana Watson", "Marco B\u00fccheler", "Grant Richards"], "brief": "\u672c\u6587\u8bc4\u4f30\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u8f85\u52a9\u751f\u6210\u5408\u89c4\u6587\u6863\u7684\u53ef\u9760\u6027\uff0c\u805a\u7126\u6b27\u76df\u53ef\u6301\u7eed\u4ea7\u54c1\u6570\u5b57\u62a4\u7167\u4e0eGDPR\u6570\u636e\u4fdd\u62a4\u5f71\u54cd\u8bc4\u4f30\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u683c\u5f0f\u8981\u6c42\u8f83\u5bbd\u677e\u7684DPIA\u9700\u8981\u66f4\u9ad8\u4e0a\u4e0b\u6587\u63d0\u793a\u624d\u80fd\u4fdd\u8bc1\u5b8c\u6574\u6027\u548c\u4e00\u81f4\u6027\uff0c\u800c\u683c\u5f0f\u66f4\u4e25\u683c\u7684\u6570\u5b57\u7535\u6c60\u62a4\u7167\u8f93\u51fa\u66f4\u7a33\u5b9a\u4f46\u66f4\u6613\u51fa\u73b0\u5e7b\u89c9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21317", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5408\u89c4\u5ba1\u67e5", "\u9690\u79c1\u4fdd\u62a4", "\u53ef\u6301\u7eed\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21317v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Regulation to Implementation: A Critical Evaluation of LLM-Assisted Regulatory Compliance in Industry", "tldr": "\u672c\u6587\u8bc4\u4f30\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u8f85\u52a9\u751f\u6210\u5408\u89c4\u6587\u6863\u7684\u53ef\u9760\u6027\uff0c\u805a\u7126\u6b27\u76df\u53ef\u6301\u7eed\u4ea7\u54c1\u6570\u5b57\u62a4\u7167\u4e0eGDPR\u6570\u636e\u4fdd\u62a4\u5f71\u54cd\u8bc4\u4f30\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u683c\u5f0f\u8981\u6c42\u8f83\u5bbd\u677e\u7684DPIA\u9700\u8981\u66f4\u9ad8\u4e0a\u4e0b\u6587\u63d0\u793a\u624d\u80fd\u4fdd\u8bc1\u5b8c\u6574\u6027\u548c\u4e00\u81f4\u6027\uff0c\u800c\u683c\u5f0f\u66f4\u4e25\u683c\u7684\u6570\u5b57\u7535\u6c60\u62a4\u7167\u8f93\u51fa\u66f4\u7a33\u5b9a\u4f46\u66f4\u6613\u51fa\u73b0\u5e7b\u89c9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning (RL) has demonstrated significant gains in image captioning, yet it is still limited in encouragin
