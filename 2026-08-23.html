 visual evidence can severely compromise multimodal large language model (MLLM) generation. Unlike prior attacks that rely on altering textual metadata, we introduce Vis-Poison, a novel visual knowledge poisoning attack where the poisoned image itself is the attacker-controlled payload, without manipulating captions, summaries, metadata, or other associated text. Specifically, this attack is instantiated through an automated multi-agent method that constructs visually plausible poisoned images. To assess its impact, we evaluate Vis-Poison across two representative multimodal RAG pipelines, four embedding models, and six generation models. Empirically, Vis-Poison achieves an end-to-end attack success rate of 40.16\\% to 65.40\\% against 30k-entry multimodal knowledge bases in \\emph{black-box} settings. Moreover, Vis-Poison remains effective against various MLLMs that can answer correctly from parametric knowledge alone, with an average success rate above 60\\%. Code and data are available at https://github.com/SWUFE-DB-Group/Vis-Poison.", "arxiv_id": "2608.20756", "arxiv_url": "https://arxiv.org/abs/2608.20756", "authors": ["Rujin Liang", "Zhongpu Chen", "Yuhao Lei", "Xin Miao"], "brief": "\u8bba\u6587\u63d0\u51fa Vis-Poison\uff0c\u4e00\u79cd\u9488\u5bf9\u591a\u6a21\u6001 RAG \u7684\u89c6\u89c9\u77e5\u8bc6\u6295\u6bd2\u653b\u51fb\uff1a\u653b\u51fb\u8005\u4e0d\u6539\u5199\u6587\u672c\u5143\u6570\u636e\uff0c\u800c\u662f\u5c06\u88ab\u68c0\u7d22\u7684\u56fe\u50cf\u672c\u8eab\u4f5c\u4e3a\u6076\u610f\u8f7d\u8377\u3002\u4f5c\u8005\u901a\u8fc7\u81ea\u52a8\u5316\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\u751f\u6210\u89c6\u89c9\u4e0a\u5408\u7406\u7684\u6295\u6bd2\u56fe\u50cf\uff0c\u5e76\u7cfb\u7edf\u8bc4\u4f30\u5176\u5bf9 MLLM \u751f\u6210\u7ed3\u679c\u7684\u5f71\u54cd\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20756", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u653b\u51fb\u4e0d\u4f9d\u8d56\u7be1\u6539 captions\u3001\u6458\u8981\u6216 metadata\uff0c\u4ec5\u901a\u8fc7\u56fe\u50cf\u5185\u5bb9\u8bef\u5bfc\u591a\u6a21\u6001\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u3002", "\u5728\u4e24\u7c7b\u591a\u6a21\u6001 RAG \u6d41\u6c34\u7ebf\u30014 \u4e2a\u5d4c\u5165\u6a21\u578b\u30016 \u4e2a\u751f\u6210\u6a21\u578b\u4e0a\u8bc4\u6d4b\uff0c\u8986\u76d6 3 \u4e07\u6761\u89c4\u6a21\u77e5\u8bc6\u5e93\u3002", "\u9ed1\u76d2\u8bbe\u7f6e\u4e0b\u7aef\u5230\u7aef\u653b\u51fb\u6210\u529f\u7387\u8fbe 40.16%\u201365.40%\uff0c\u5373\u4f7f\u6a21\u578b\u51ed\u53c2\u6570\u77e5\u8bc6\u672c\u53ef\u7b54\u5bf9\uff0c\u5e73\u5747\u6210\u529f\u7387\u4ecd\u8d85\u8fc7 60%\u3002"], "keywords": ["\u591a\u6a21\u6001", "RAG", "\u5b89\u5168\u653b\u51fb", "\u89c6\u89c9\u77e5\u8bc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20756v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Vis-Poison: Poisoning Visual Knowledge in Multimodal Retrieval-Augmented Generation", "tldr": "\u7528\u4f2a\u9020\u56fe\u50cf\u6295\u6bd2\u591a\u6a21\u6001RAG\u77e5\u8bc6\u5e93", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Vis-Poison\uff0c\u4e00\u79cd\u9488\u5bf9\u591a\u6a21\u6001 RAG \u7684\u89c6\u89c9\u77e5\u8bc6\u6295\u6bd2\u653b\u51fb\uff1a\u653b\u51fb\u8005\u4e0d\u6539\u5199\u6587\u672c\u5143\u6570\u636e\uff0c\u800c\u662f\u5c06\u88ab\u68c0\u7d22\u7684\u56fe\u50cf\u672c\u8eab\u4f5c\u4e3a\u6076\u610f\u8f7d\u8377\u3002\u4f5c\u8005\u901a\u8fc7\u81ea\u52a8\u5316\u591a\u667a\u80fd\u4f53\u6d41\u7a0b\u751f\u6210\u89c6\u89c9\u4e0a\u5408\u7406\u7684\u6295\u6bd2\u56fe\u50cf\uff0c\u5e76\u7cfb\u7edf\u8bc4\u4f30\u5176\u5bf9 MLLM \u751f\u6210\u7ed3\u679c\u7684\u5f71\u54cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86\u591a\u6a21\u6001 RAG \u4e2d\u201c\u89c6\u89c9\u8bc1\u636e\u201d\u672c\u8eab\u7684\u5b89\u5168\u8106\u5f31\u6027\uff0c\u8bf4\u660e\u4ec5\u4fdd\u62a4\u6587\u672c\u5143\u6570\u636e\u8fdc\u8fdc\u4e0d\u591f\uff1b\u5bf9\u672a\u6765\u56fe\u50cf\u68c0\u7d22\u3001\u77e5\u8bc6\u5e93\u6e05\u6d17\u4e0e MLLM \u5b89\u5168\u9632\u62a4\u5177\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Behaviour Cloning (BC) has driven remarkable progress in robot manipulation, yet it is fundamentally limited by its inability to self-improve: a policy that fails cannot learn from that failure without additional human demonstrations. Reinforcement Learning fine-tuning offers a path to self-improvement but has proven difficult to scale to the multi-billion-parameter models underpinning modern robot policies. We propose Q-Planning, which equips a large visuomotor BC policy with a small off-policy Q-function. Because a Q-function estimates value rather than imitates actions, it can be trained on the same successful demonstrations as the BC policy and later absorb both successful and failed deployment rollouts, an asymmetry BC does not have. We exploit this asymmetry to enable value-guided action selection at inference (a single-step Q-weighted average over BC draws) and online self-improvement that fine-tunes only the Q-function, leaving the BC weights untouched. On LIBERO and bimanual RoboTwin, ten iterations of self-improvement lift every benchmark score we tested (LIBERO-10 93% to 99%, RoboTwin 83.8% to 91.4%) and shorten successful episodes on the near-ceiling suites (LIBERO-Object, LIBERO-Goal). On two contact-rich bimanual real-robot tasks, the same loop (BC frozen, no human intervention) improves purely from its own deployment rollouts: stack-cups 40% to 90% and insert-wallet 25% to 80% in five iterations, whereas SFT on successful rollouts alone stalls at 55% and 30%. Under an identical online budget Q-Planning is the only method, among Best-of-N, filtered SFT, IBRL, DSRL, and DAWR, that improves stably from failures without training an auxiliary actor.", "arxiv_id": "2608.21204", "arxiv_url": "https://arxiv.org/abs/2608.21204", "authors": ["Varun Giridhar", "Anant Khandelwal", "Jeremy A. Collins", "Ignat Georgiev", "Animesh Garg"], "brief": "\u8bba\u6587\u63d0\u51fa Q-Planning\uff1a\u5728\u5927\u578b\u89c6\u89c9\u8fd0\u52a8\u884c\u4e3a\u514b\u9686\u7b56\u7565\u65c1\u52a0\u5165\u4e00\u4e2a\u5c0f\u578b\u79bb\u7b56\u7565 Q \u51fd\u6570\uff0c\u7528\u4ef7\u503c\u8bc4\u4f30\u6307\u5bfc\u63a8\u7406\u65f6\u52a8\u4f5c\u9009\u62e9\u3002\u90e8\u7f72\u540e\u53ea\u7528\u6210\u529f\u4e0e\u5931\u8d25\u8f68\u8ff9\u7ee7\u7eed\u8bad\u7ec3 Q \u51fd\u6570\u3001\u51bb\u7ed3 BC \u4e3b\u6a21\u578b\uff0c\u4ece\u800c\u5b9e\u73b0\u65e0\u9700\u4eba\u5de5\u793a\u8303\u7684\u5728\u7ebf\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21204", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Q\u51fd\u6570\u53ef\u5148\u5728\u6210\u529f\u793a\u8303\u4e0a\u8bad\u7ec3\uff0c\u540e\u7eed\u5438\u6536\u6210\u529f\u548c\u5931\u8d25\u7684\u90e8\u7f72\u8f68\u8ff9\uff0c\u5f25\u8865\u884c\u4e3a\u514b\u9686\u65e0\u6cd5\u4ece\u5931\u8d25\u4e2d\u5b66\u4e60\u7684\u7f3a\u9677\u3002", "\u63a8\u7406\u65f6\u4eceBC\u7b56\u7565\u91c7\u6837\u591a\u4e2a\u52a8\u4f5c\uff0c\u5e76\u7528Q\u503c\u505a\u5355\u6b65\u52a0\u6743\u5e73\u5747\u9009\u62e9\u52a8\u4f5c\uff1b\u5728\u7ebf\u9636\u6bb5\u4ec5\u5fae\u8c03Q\u51fd\u6570\uff0c\u4e0d\u66f4\u65b0\u591a\u5341\u4ebf\u53c2\u6570BC\u6a21\u578b\u3002", "\u5728LIBERO-10\u4e0a\u4ece93%\u63d0\u5347\u523099%\uff0cRoboTwin\u4ece83.8%\u63d0\u5347\u523091.4%\uff1b\u771f\u5b9e\u53cc\u81c2\u4efb\u52a1\u4e2dstack-cups\u4ece40%\u523090%\uff0cinsert-wallet\u4ece25%\u523080%\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u884c\u4e3a\u514b\u9686", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21204v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Imitation: Self-Improving Robot Policies via Off-Policy Q-Planning", "tldr": "\u7528\u5c0f\u578bQ\u51fd\u6570\u8ba9\u673a\u5668\u4ebaBC\u7b56\u7565\u81ea\u6211\u6539\u8fdb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Q-Planning\uff1a\u5728\u5927\u578b\u89c6\u89c9\u8fd0\u52a8\u884c\u4e3a\u514b\u9686\u7b56\u7565\u65c1\u52a0\u5165\u4e00\u4e2a\u5c0f\u578b\u79bb\u7b56\u7565 Q \u51fd\u6570\uff0c\u7528\u4ef7\u503c\u8bc4\u4f30\u6307\u5bfc\u63a8\u7406\u65f6\u52a8\u4f5c\u9009\u62e9\u3002\u90e8\u7f72\u540e\u53ea\u7528\u6210\u529f\u4e0e\u5931\u8d25\u8f68\u8ff9\u7ee7\u7eed\u8bad\u7ec3 Q \u51fd\u6570\u3001\u51bb\u7ed3 BC \u4e3b\u6a21\u578b\uff0c\u4ece\u800c\u5b9e\u73b0\u65e0\u9700\u4eba\u5de5\u793a\u8303\u7684\u5728\u7ebf\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "\u5b83\u63d0\u4f9b\u4e86\u4e00\u79cd\u8f7b\u91cf\u3001\u53ef\u6269\u5c55\u7684\u673a\u5668\u4eba\u7b56\u7565\u81ea\u6539\u8fdb\u8def\u5f84\uff1a\u4e0d\u5fc5\u5bf9\u5927\u6a21\u578b\u505a\u5f3a\u5316\u5b66\u4e60\u5fae\u8c03\uff0c\u4e5f\u4e0d\u4f9d\u8d56\u65b0\u589e\u4eba\u5de5\u793a\u8303\uff0c\u5c31\u80fd\u7a33\u5b9a\u5229\u7528\u5931\u8d25\u7ecf\u9a8c\u63d0\u5347\u771f\u5b9e\u673a\u5668\u4eba\u8868\u73b0\u3002"}, {"abstract": "Every way of teaching a deployed language model something new -- full fine-tuning, adapter merging, model editing -- replaces the released checkpoint, and with it every evaluation and cache that referred to those exact bits. We instead learn inside the dequantization gap: with the integer codes and scales of a 4-bit release frozen, new knowledge is written only into the per-weight residual that lives strictly inside each quantization decision cell. Re-quantization then returns the released artifact bit-for-bit, a machine-checkable guarantee; updates are exactly revocable by dropping the residual; and drift is bounded. We give six propositions and three training paths, including CellFill, a bounded reparameterization that makes invariance structural rather than enforced. Exact invariance turns out to be nearly free: across three paired seeds the constrained dense path matches an unconstrained reference whose weights provably escape the artifact (58.9 vs 59.3 percent fact recall; paired difference -0.5 points, 95% CI [-5.0,+4.0]), and is better on held-out cross-domain perplexity. Against the natural null hypothesis -- serving the same update as an unmerged adapter -- projecting into the cells reduces cross-domain forgetting in every run that converged, and a diverged control shows the boundary: projection is a trust region, not a repair. What no method escapes is the cost of knowledge itself, and the apparent free lunch of in-domain perplexity improving past the anchor is an artifact of rehearsal sharing a corpus with the metric. Methods differ threefold at matched rehearsal in knowledge bought per point of cross-domain perplexity, a ranking that is not the recall ranking. The method transfers to a 27B hybrid linear-attention model (2.4e10 constrained weights, verified bit-identical), where matched recall costs about half as much cross-domain perplexity as at 1.7B.", "arxiv_id": "2608.20873", "arxiv_url": "https://arxiv.org/abs/2608.20873", "authors": ["Zifeng Liu", "Zhiyong Du", "Yaxin Lu", "Yiming Mao", "Zhenhe Wang", "Wenqi Shi", "Zhengkun Jing"], "brief": "\u8bba\u6587\u63d0\u51fa CellFill\uff1a\u57284-bit\u91cf\u5316\u6a21\u578b\u7684\u6574\u6570\u7801\u4e0e\u5c3a\u5ea6\u51bb\u7ed3\u65f6\uff0c\u53ea\u5b66\u4e60\u6bcf\u4e2a\u6743\u91cd\u4f4d\u4e8e\u91cf\u5316\u51b3\u7b56\u5355\u5143\u5185\u90e8\u7684\u6b8b\u5dee\uff0c\u4ece\u800c\u6ce8\u5165\u65b0\u77e5\u8bc6\u3002\u91cd\u65b0\u91cf\u5316\u540e\u53d1\u5e03\u68c0\u67e5\u70b9\u53ef\u9010\u6bd4\u7279\u4fdd\u6301\u4e00\u81f4\uff0c\u66f4\u65b0\u4e5f\u53ef\u901a\u8fc7\u5220\u9664\u6b8b\u5dee\u7cbe\u786e\u64a4\u9500\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20873", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6838\u5fc3\u7ea6\u675f\u662f\u628a\u6743\u91cd\u66f4\u65b0\u9650\u5236\u5728\u91cf\u5316\u51b3\u7b56\u5355\u5143\u5185\uff0c\u4f7f\u6a21\u578b\u91cd\u65b0\u91cf\u5316\u540e\u4e0e\u539f\u59cb\u53d1\u5e03artifact bit-identical\uff0c\u5e76\u63d0\u4f9b\u53ef\u673a\u5668\u9a8c\u8bc1\u7684\u4e0d\u53d8\u6027\u4fdd\u8bc1\u3002", "\u63d0\u51fa\u516d\u4e2a\u547d\u9898\u548c\u4e09\u6761\u8bad\u7ec3\u8def\u5f84\uff0c\u5176\u4e2d CellFill \u901a\u8fc7\u6709\u754c\u91cd\u53c2\u6570\u5316\u8ba9\u4e0d\u53d8\u6027\u6210\u4e3a\u7ed3\u6784\u6027\u7ea6\u675f\uff0c\u800c\u975e\u8bad\u7ec3\u540e\u7684\u989d\u5916\u6295\u5f71\u3002", "\u5b9e\u9a8c\u663e\u793a\u53d7\u7ea6\u675f\u66f4\u65b0\u51e0\u4e4e\u4e0d\u635f\u5931\u4e8b\u5b9e\u53ec\u56de\u7387\uff0c\u5e76\u5728\u8de8\u57df\u56f0\u60d1\u5ea6\u4e0a\u4f18\u4e8e\u672a\u5408\u5e76adapter\uff1b\u65b9\u6cd5\u8fd8\u6269\u5c55\u523027B\u6df7\u5408\u7ebf\u6027\u6ce8\u610f\u529b\u6a21\u578b\uff0c\u9a8c\u8bc1\u4e862.4e10\u4e2a\u53d7\u7ea6\u675f\u6743\u91cd\u7684\u6bd4\u7279\u4e00\u81f4\u6027\u3002"], "keywords": ["\u6a21\u578b\u7f16\u8f91", "\u91cf\u5316\u6a21\u578b", "\u6301\u7eed\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20873v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Nothing Changed but the Model: CellFill -- Bounded In-Cell Learning for Bit-Identical, Revocable Updates to Quantized LLMs", "tldr": "\u5728\u91cf\u5316\u95f4\u9699\u5185\u66f4\u65b0LLM\u4e14\u4fdd\u6301\u6743\u91cd\u6bd4\u7279\u4e0d\u53d8", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CellFill\uff1a\u57284-bit\u91cf\u5316\u6a21\u578b\u7684\u6574\u6570\u7801\u4e0e\u5c3a\u5ea6\u51bb\u7ed3\u65f6\uff0c\u53ea\u5b66\u4e60\u6bcf\u4e2a\u6743\u91cd\u4f4d\u4e8e\u91cf\u5316\u51b3\u7b56\u5355\u5143\u5185\u90e8\u7684\u6b8b\u5dee\uff0c\u4ece\u800c\u6ce8\u5165\u65b0\u77e5\u8bc6\u3002\u91cd\u65b0\u91cf\u5316\u540e\u53d1\u5e03\u68c0\u67e5\u70b9\u53ef\u9010\u6bd4\u7279\u4fdd\u6301\u4e00\u81f4\uff0c\u66f4\u65b0\u4e5f\u53ef\u901a\u8fc7\u5220\u9664\u6b8b\u5dee\u7cbe\u786e\u64a4\u9500\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u9488\u5bf9\u5df2\u90e8\u7f72\u91cf\u5316LLM\u7684\u201c\u53ef\u66f4\u65b0\u4f46\u4e0d\u6539\u53d8\u53d1\u5e03\u68c0\u67e5\u70b9\u201d\u96be\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u64a4\u9500\u3001\u53ef\u9a8c\u8bc1\u3001\u6f02\u79fb\u6709\u754c\u7684\u5b66\u4e60\u65b9\u5f0f\uff0c\u6709\u671b\u964d\u4f4e\u6a21\u578b\u70ed\u66f4\u65b0\u5bf9\u8bc4\u6d4b\u3001\u7f13\u5b58\u3001\u5408\u89c4\u548c\u590d\u73b0\u5b9e\u9a8c\u7684\u7834\u574f\u6210\u672c\u3002"}, {"abstract": "Large language models often rely on Chain-of-Thought (CoT) reasoning to solve complex tasks, but verbose reasoning traces introduce substantial inference overhead. CoT compression shortens generation, yet aggressive compression may disrupt logical coherence and degrade performance. We formalize this trade-off as the \\textit{Context-Generation Substitution Law}, where explicit reasoning context substitutes for part of decode-time generation. Based on this principle, we propose \\textit{Memory-Augmented Compression}, a training-free framework that constructs reusable reasoning memories from historical traces and retrieves them as prefill-side scaffolds. Rather than using raw demonstrations, these memories summarize reusable reasoning patterns, key constraints, and critical operations to compensate for information lost during compression. Experiments show that Memory consistently improves prompt-based Chain-of-Draft (CoD) compression across mathematical reasoning, complex reasoning, and science question answering tasks, yielding accuracy gains of 21.4, 28.0, 29.5, and 6.61 points over CoD on GSM8K, MATH, BBH, and MMLU-Sci, while achieving a 1.14--1.49$\\times$ latency speedup over standard CoT. Memory is also compatible with token-level, reasoning-trace-level, and inference-state compression mechanisms. Further analyzes show that the gains come from relevant reasoning memories rather than simply increasing context length.", "arxiv_id": "2608.21265", "arxiv_url": "https://arxiv.org/abs/2608.21265", "authors": ["Simeng Zhang", "Yilong Chen", "Wenyuan Zhang", "Zhenyu Zhang", "Yao Chen", "Junyuan Shang", "Tingwen Liu"], "brief": "\u8bba\u6587\u5f62\u5f0f\u5316\u4e86\u201c\u4e0a\u4e0b\u6587-\u751f\u6210\u66ff\u4ee3\u5f8b\u201d\uff0c\u6307\u51fa\u663e\u5f0f\u63a8\u7406\u4e0a\u4e0b\u6587\u53ef\u66ff\u4ee3\u90e8\u5206\u89e3\u7801\u65f6\u751f\u6210\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 Memory-Augmented Compression\uff0c\u4ece\u5386\u53f2\u63a8\u7406\u8f68\u8ff9\u4e2d\u6784\u5efa\u53ef\u590d\u7528\u63a8\u7406\u8bb0\u5fc6\uff0c\u5728\u63a8\u7406\u524d\u68c0\u7d22\u4e3a\u538b\u7f29CoT\u63d0\u4f9b\u811a\u624b\u67b6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21265", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bb0\u5fc6\u4e0d\u662f\u539f\u59cb\u793a\u4f8b\uff0c\u800c\u662f\u603b\u7ed3\u53ef\u590d\u7528\u63a8\u7406\u6a21\u5f0f\u3001\u5173\u952e\u7ea6\u675f\u548c\u5173\u952e\u64cd\u4f5c\uff0c\u7528\u4e8e\u5f25\u8865\u538b\u7f29\u63a8\u7406\u94fe\u4e22\u5931\u7684\u4fe1\u606f\u3002", "\u5728 GSM8K\u3001MATH\u3001BBH\u3001MMLU-Sci \u4e0a\uff0c\u76f8\u6bd4 Chain-of-Draft \u538b\u7f29\u5206\u522b\u63d0\u5347 21.4\u300128.0\u300129.5\u30016.61 \u4e2a\u767e\u5206\u70b9\u3002", "\u76f8\u8f83\u6807\u51c6 CoT \u83b7\u5f97 1.14\u20131.49 \u500d\u5ef6\u8fdf\u52a0\u901f\uff0c\u5e76\u517c\u5bb9 token \u7ea7\u3001\u63a8\u7406\u8f68\u8ff9\u7ea7\u548c\u63a8\u7406\u72b6\u6001\u538b\u7f29\u65b9\u6cd5\u3002"], "keywords": ["\u94fe\u5f0f\u601d\u7ef4", "\u63a8\u7406\u538b\u7f29", "\u68c0\u7d22\u589e\u5f3a", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21265v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Memory Augmentation Unlocks Efficient Chain-of-Thought Reasoning", "tldr": "\u7528\u53ef\u68c0\u7d22\u8bb0\u5fc6\u63d0\u5347\u538b\u7f29CoT\u6548\u7387\u4e0e\u51c6\u786e\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5f62\u5f0f\u5316\u4e86\u201c\u4e0a\u4e0b\u6587-\u751f\u6210\u66ff\u4ee3\u5f8b\u201d\uff0c\u6307\u51fa\u663e\u5f0f\u63a8\u7406\u4e0a\u4e0b\u6587\u53ef\u66ff\u4ee3\u90e8\u5206\u89e3\u7801\u65f6\u751f\u6210\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 Memory-Augmented Compression\uff0c\u4ece\u5386\u53f2\u63a8\u7406\u8f68\u8ff9\u4e2d\u6784\u5efa\u53ef\u590d\u7528\u63a8\u7406\u8bb0\u5fc6\uff0c\u5728\u63a8\u7406\u524d\u68c0\u7d22\u4e3a\u538b\u7f29CoT\u63d0\u4f9b\u811a\u624b\u67b6\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u5197\u957fCoT\u7684\u90e8\u5206\u8ba1\u7b97\u8f6c\u79fb\u5230\u53ef\u590d\u7528\u4e0a\u4e0b\u6587\u8bb0\u5fc6\u4e2d\uff0c\u5728\u65e0\u9700\u8bad\u7ec3\u7684\u524d\u63d0\u4e0b\u540c\u65f6\u6539\u5584\u538b\u7f29\u63a8\u7406\u7684\u51c6\u786e\u7387\u4e0e\u5ef6\u8fdf\uff0c\u4e3a\u4f4e\u6210\u672c\u90e8\u7f72\u590d\u6742\u63a8\u7406\u578bLLM\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Recent omni-modal large language models (Omni-LLMs) show great potential as real-time video assistants, which continuously perceive environments and guide users to achieve specific goals. Unlike traditional passive video understanding, interactive assistants should actively combine visual states, user goals, and prior knowledge to provide effective help. Evaluating this is rather challenging, as the model\u0027s unpredictable response dynamically changes the user\u0027s subsequent actions, which static offline datasets cannot accommodate. To address this bottleneck, we introduce OmniAssistBench. To solve the issue of diverging interaction paths where the same user goal can be achieved through various methods, we provide models with predefined priors derived from the source video, requiring them to guide users along the exact same routes. Since real interaction videos are rare, we construct the dataset by reverse-engineering existing Internet videos. We deduce logical user goals and segment the videos into multi-turn clips to simulate continuous interactions. This rigorous pipeline required over 1000 expert person-hours to build the dataset. Results show that the proprietary Gemini-3-Pro reaches 66.4 out of the max point of 100, while the open-source Qwen3-Omni-Instruct achieves 51.2. Although current models generally understand user inputs, they frequently provide incorrect or incomplete answers. Specifically, they struggle with visual prompts (e.g., hand gestures), fail to maintain historical context during multi-turn interactions, and fail to delay response until the target event. Results indicate substantial room for improvement before models can become reliable assistants.", "arxiv_id": "2608.21360", "arxiv_url": "https://arxiv.org/abs/2608.21360", "authors": ["Xianyun Sun", "Chaoyou Fu", "Zhengye Zhang", "Feiyang Duan", "Qingyuan Cao", "Yonghui Niu", "Sihang Yuan", "Ge Zhang", "Caifeng Shan"], "brief": "\u8bba\u6587\u63d0\u51fa OmniAssistBench\uff0c\u7528\u4e8e\u8bc4\u4f30 Omni-LLMs \u5728\u8fde\u7eed\u89c6\u9891\u573a\u666f\u4e2d\u4f5c\u4e3a\u5b9e\u65f6\u52a9\u624b\u7684\u80fd\u529b\u3002\u5b83\u901a\u8fc7\u53cd\u5411\u89e3\u6790\u4e92\u8054\u7f51\u89c6\u9891\uff0c\u6784\u9020\u5e26\u7528\u6237\u76ee\u6807\u3001\u9884\u8bbe\u5148\u9a8c\u548c\u591a\u8f6e\u4ea4\u4e92\u7247\u6bb5\u7684\u6570\u636e\u96c6\uff0c\u6a21\u62df\u6a21\u578b\u6307\u5bfc\u7528\u6237\u5b8c\u6210\u4efb\u52a1\u7684\u8fc7\u7a0b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21360", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4e3a\u907f\u514d\u540c\u4e00\u76ee\u6807\u5b58\u5728\u591a\u79cd\u5b8c\u6210\u8def\u5f84\uff0c\u57fa\u51c6\u5411\u6a21\u578b\u63d0\u4f9b\u6765\u81ea\u6e90\u89c6\u9891\u7684\u9884\u8bbe\u5148\u9a8c\uff0c\u8981\u6c42\u5176\u6cbf\u539f\u89c6\u9891\u8def\u7ebf\u8fdb\u884c\u6307\u5bfc\u3002", "\u6570\u636e\u96c6\u7531\u73b0\u6709\u4e92\u8054\u7f51\u89c6\u9891\u53cd\u5411\u6784\u5efa\uff0c\u63a8\u7406\u7528\u6237\u76ee\u6807\u5e76\u5207\u5206\u4e3a\u591a\u8f6e\u4ea4\u4e92\u7247\u6bb5\uff0c\u8017\u8d39\u8d85\u8fc71000\u5c0f\u65f6\u4e13\u5bb6\u6807\u6ce8\u4e0e\u6574\u7406\u3002", "\u8bc4\u6d4b\u663e\u793a Gemini-3-Pro \u5f97\u520666.4/100\uff0cQwen3-Omni-Instruct \u5f97\u520651.2/100\uff1b\u6a21\u578b\u5728\u624b\u52bf\u7b49\u89c6\u89c9\u63d0\u793a\u3001\u591a\u8f6e\u5386\u53f2\u4fdd\u6301\u3001\u7b49\u5f85\u76ee\u6807\u4e8b\u4ef6\u540e\u518d\u54cd\u5e94\u7b49\u65b9\u9762\u4ecd\u660e\u663e\u4e0d\u8db3\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21360v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "OmniAssistBench: Assistant-style Interaction Benchmark for Omni-LLMs", "tldr": "\u9762\u5411\u5168\u6a21\u6001\u52a9\u624b\u4ea4\u4e92\u7684\u89c6\u9891\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OmniAssistBench\uff0c\u7528\u4e8e\u8bc4\u4f30 Omni-LLMs \u5728\u8fde\u7eed\u89c6\u9891\u573a\u666f\u4e2d\u4f5c\u4e3a\u5b9e\u65f6\u52a9\u624b\u7684\u80fd\u529b\u3002\u5b83\u901a\u8fc7\u53cd\u5411\u89e3\u6790\u4e92\u8054\u7f51\u89c6\u9891\uff0c\u6784\u9020\u5e26\u7528\u6237\u76ee\u6807\u3001\u9884\u8bbe\u5148\u9a8c\u548c\u591a\u8f6e\u4ea4\u4e92\u7247\u6bb5\u7684\u6570\u636e\u96c6\uff0c\u6a21\u62df\u6a21\u578b\u6307\u5bfc\u7528\u6237\u5b8c\u6210\u4efb\u52a1\u7684\u8fc7\u7a0b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u4ece\u9759\u6001\u89c6\u9891\u7406\u89e3\u8f6c\u5411\u52a8\u6001\u52a9\u624b\u5f0f\u4ea4\u4e92\u8bc4\u4f30\uff0c\u66f4\u8d34\u8fd1\u672a\u6765\u5b9e\u65f6\u591a\u6a21\u6001\u52a9\u624b\u7684\u5b9e\u9645\u4f7f\u7528\u573a\u666f\uff0c\u63ed\u793a\u4e86\u5f53\u524d Omni-LLMs \u8ddd\u79bb\u53ef\u9760\u4ea4\u4e92\u5f0f\u667a\u80fd\u4f53\u4ecd\u6709\u8f83\u5927\u5dee\u8ddd\u3002"}, {"abstract": "Omnimodal generation is central to a wide range of content creation and editing applications. In-context conditioning is essential to this paradigm. It allows diffusion transformers to process text instructions and visual references in a shared attention sequence. However, each reference image introduces thousands of tokens. Computation therefore grows rapidly with the number of references. Existing methods reduce computation through structured sparse attention, which limits interactions between reference and target tokens. This structure also makes the reference K and V independent of the denoising target, allowing them to be computed once and reused across steps. However, it blocks visual references from attending to the text instruction. This substantially degrades instruction following and reference fidelity in multi-reference editing. To resolve this conflict, we jointly redesign the token sequence and attention mask. Our beyond-mask design uses static text anchors to connect the instruction to the reference branch. It preserves exact K and V reuse without adding parameters. However, this direct architectural conversion degrades generation quality. We recover the lost performance through teacher-forced velocity distillation, followed by a short on-policy stage in which the teacher supervises student-visited states. To our knowledge, this is the first use of on-policy distillation for architectural recovery in diffusion models. Across three image-editing benchmarks, our method matches full-attention generation quality. With five reference images, it accelerates the complete 40-step denoising process by 3.92x, while static text anchors introduce negligible runtime overhead; the speedup reaches 5.47x at ten references in our scaling study.", "arxiv_id": "2608.21229", "arxiv_url": "https://arxiv.org/abs/2608.21229", "authors": ["Yangshuai Liu", "Zheming Li", "Jiaao Li", "Kang He", "Ziliang Lai", "Zhitai Liu", "Chengru Song"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 in-context Diffusion Transformer \u7684\u9ad8\u6548\u53c2\u8003\u7f13\u5b58\u65b9\u6cd5\uff0c\u901a\u8fc7\u91cd\u65b0\u8bbe\u8ba1 token \u5e8f\u5217\u4e0e\u6ce8\u610f\u529b\u63a9\u7801\uff0c\u8ba9\u89c6\u89c9\u53c2\u8003\u4ecd\u80fd\u5229\u7528\u6587\u672c\u6307\u4ee4\u4fe1\u606f\uff0c\u540c\u65f6\u4fdd\u6301\u53c2\u8003 K/V \u53ef\u7cbe\u786e\u590d\u7528\u3002\u4f5c\u8005\u8fd8\u7528\u901f\u5ea6\u84b8\u998f\u548c\u77ed\u7a0b on-policy \u84b8\u998f\u6062\u590d\u67b6\u6784\u6539\u52a8\u5e26\u6765\u7684\u751f\u6210\u8d28\u91cf\u635f\u5931\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21229", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa beyond-mask \u8bbe\u8ba1\uff1a\u7528\u9759\u6001\u6587\u672c\u951a\u70b9\u8fde\u63a5\u6307\u4ee4\u4e0e\u53c2\u8003\u5206\u652f\uff0c\u5728\u4e0d\u589e\u52a0\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u4fdd\u7559\u7cbe\u786e K/V \u7f13\u5b58\u3002", "\u76f8\u6bd4\u7ed3\u6784\u5316\u7a00\u758f\u6ce8\u610f\u529b\uff0c\u907f\u514d\u4e86\u53c2\u8003\u56fe\u50cf\u65e0\u6cd5\u5173\u6ce8\u6587\u672c\u6307\u4ee4\u7684\u95ee\u9898\uff0c\u63d0\u5347\u591a\u53c2\u8003\u7f16\u8f91\u4e2d\u7684\u6307\u4ee4\u9075\u5faa\u4e0e\u53c2\u8003\u4fdd\u771f\u5ea6\u3002", "\u5728\u4e09\u4e2a\u56fe\u50cf\u7f16\u8f91\u57fa\u51c6\u4e0a\u8fbe\u5230\u63a5\u8fd1\u5168\u6ce8\u610f\u529b\u7684\u8d28\u91cf\uff1b5 \u5f20\u53c2\u8003\u56fe\u65f6 40 \u6b65\u53bb\u566a\u52a0\u901f 3.92 \u500d\uff0c10 \u5f20\u53c2\u8003\u56fe\u65f6\u52a0\u901f 5.47 \u500d\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u56fe\u50cf\u7f16\u8f91", "\u6ce8\u610f\u529b\u673a\u5236", "\u6a21\u578b\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21229v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Anchoring Instruction Outside Mask: Exact Reference Caching for Efficient In-Context Diffusion Transformers", "tldr": "\u7528\u6587\u672c\u951a\u70b9\u5b9e\u73b0\u591a\u53c2\u8003\u6269\u6563\u7f16\u8f91\u9ad8\u6548\u7f13\u5b58", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 in-context Diffusion Transformer \u7684\u9ad8\u6548\u53c2\u8003\u7f13\u5b58\u65b9\u6cd5\uff0c\u901a\u8fc7\u91cd\u65b0\u8bbe\u8ba1 token \u5e8f\u5217\u4e0e\u6ce8\u610f\u529b\u63a9\u7801\uff0c\u8ba9\u89c6\u89c9\u53c2\u8003\u4ecd\u80fd\u5229\u7528\u6587\u672c\u6307\u4ee4\u4fe1\u606f\uff0c\u540c\u65f6\u4fdd\u6301\u53c2\u8003 K/V \u53ef\u7cbe\u786e\u590d\u7528\u3002\u4f5c\u8005\u8fd8\u7528\u901f\u5ea6\u84b8\u998f\u548c\u77ed\u7a0b on-policy \u84b8\u998f\u6062\u590d\u67b6\u6784\u6539\u52a8\u5e26\u6765\u7684\u751f\u6210\u8d28\u91cf\u635f\u5931\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u89e3\u51b3\u4e86\u591a\u53c2\u8003 in-context \u6269\u6563\u751f\u6210\u4e2d\u8d28\u91cf\u4e0e\u6548\u7387\u7684\u6838\u5fc3\u77db\u76fe\uff1a\u65e2\u80fd\u8ba9\u53c2\u8003\u56fe\u50cf\u611f\u77e5\u6587\u672c\u6307\u4ee4\uff0c\u53c8\u80fd\u8de8\u53bb\u566a\u6b65\u590d\u7528\u53c2\u8003 K/V\uff0c\u5927\u5e45\u964d\u4f4e\u591a\u53c2\u8003\u7f16\u8f91\u6210\u672c\uff1b\u5176 on-policy \u84b8\u998f\u7528\u4e8e\u6269\u6563\u6a21\u578b\u67b6\u6784\u6062\u590d\u4e5f\u5177\u6709\u65b9\u6cd5\u521b\u65b0\u6027\u3002"}, {"abstract": "Long-form video understanding remains challenging for video agents due to the mismatch between query demands and evidence acquisition strategies. Although recent planning-before-perception methods outperform query-agnostic pipelines, they often rely on a single dominant strategy, either generation-based strategy or retrieval-based strategy, limiting their ability to handle diverse query demands. We propose Route2Look, a lightweight and model-agnostic framework for query-adaptive evidence acquisition in long-form video understanding. Route2Look operates in a Route-Look-Memorize loop with three tools: Global Browse for holistic context, Temporal Ground for explicit temporal cues, and Semantic Retrieve for semantic search. The core component is a routing policy that dynamically selects evidence acquisition tools based on the query. To build this policy, Route2Look adopts a two-stage design: first distilling the routing skill from differential contrastive analysis between generation-based and retrieval-based trajectories, and then applying the distilled skill with hard routing rules and continue-or-stop criteria during inference. Experiments on challenging long-video benchmarks show that Route2Look achieves state-of-the-art performance while maintaining strong frame efficiency across datasets and query types. Oracle routing analysis further reveals the potential of query-adaptive evidence acquisition for future long-form video understanding.", "arxiv_id": "2608.20805", "arxiv_url": "https://arxiv.org/abs/2608.20805", "authors": ["Tianyue Wang", "Xuying Wu", "Yuxiang Ma", "Ruiming Liang", "Jiaxuan Kang", "Yanchao Hao", "Zheng Wei", "Leigang Qu", "Haiyun Guo", "Jinqiao Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Route2Look\uff0c\u4e00\u4e2a\u8f7b\u91cf\u3001\u6a21\u578b\u65e0\u5173\u7684\u957f\u89c6\u9891\u7406\u89e3\u6846\u67b6\uff0c\u901a\u8fc7\u201c\u8def\u7531-\u67e5\u770b-\u8bb0\u5fc6\u201d\u5faa\u73af\u6309\u67e5\u8be2\u9700\u6c42\u52a8\u6001\u83b7\u53d6\u8bc1\u636e\u3002\u5b83\u7ed3\u5408\u5168\u5c40\u6d4f\u89c8\u3001\u65f6\u95f4\u5b9a\u4f4d\u548c\u8bed\u4e49\u68c0\u7d22\u4e09\u7c7b\u5de5\u5177\uff0c\u5e76\u7528\u84b8\u998f\u5f97\u5230\u7684\u8def\u7531\u7b56\u7565\u51b3\u5b9a\u4f55\u65f6\u7528\u54ea\u79cd\u5de5\u5177\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20805", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u9488\u5bf9\u957f\u89c6\u9891\u95ee\u7b54\u4e2d\u201c\u95ee\u9898\u9700\u6c42\u201d\u548c\u201c\u8bc1\u636e\u83b7\u53d6\u7b56\u7565\u201d\u4e0d\u5339\u914d\u7684\u95ee\u9898\uff0c\u907f\u514d\u53ea\u4f9d\u8d56\u751f\u6210\u5f0f\u6216\u68c0\u7d22\u5f0f\u5355\u4e00\u8def\u7ebf\u3002", "\u8def\u7531\u7b56\u7565\u901a\u8fc7\u4e24\u9636\u6bb5\u6784\u5efa\uff1a\u5148\u4ece\u751f\u6210\u5f0f\u4e0e\u68c0\u7d22\u5f0f\u8f68\u8ff9\u7684\u5dee\u5206\u5bf9\u6bd4\u5206\u6790\u4e2d\u84b8\u998f\u8def\u7531\u80fd\u529b\uff0c\u518d\u5728\u63a8\u7406\u65f6\u7528\u786c\u8def\u7531\u89c4\u5219\u548c\u7ee7\u7eed/\u505c\u6b62\u51c6\u5219\u6267\u884c\u3002", "\u5728\u591a\u4e2a\u957f\u89c6\u9891\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u5e27\u6548\u7387\uff1bOracle \u8def\u7531\u5206\u6790\u663e\u793a\u81ea\u9002\u5e94\u53d6\u8bc1\u4ecd\u6709\u63d0\u5347\u7a7a\u95f4\u3002"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20805v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Routing Before Looking: Query-Adaptive Evidence Acquisition for Long-form Video Understanding", "tldr": "\u6309\u95ee\u9898\u81ea\u9002\u5e94\u9009\u62e9\u957f\u89c6\u9891\u53d6\u8bc1\u5de5\u5177\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Route2Look\uff0c\u4e00\u4e2a\u8f7b\u91cf\u3001\u6a21\u578b\u65e0\u5173\u7684\u957f\u89c6\u9891\u7406\u89e3\u6846\u67b6\uff0c\u901a\u8fc7\u201c\u8def\u7531-\u67e5\u770b-\u8bb0\u5fc6\u201d\u5faa\u73af\u6309\u67e5\u8be2\u9700\u6c42\u52a8\u6001\u83b7\u53d6\u8bc1\u636e\u3002\u5b83\u7ed3\u5408\u5168\u5c40\u6d4f\u89c8\u3001\u65f6\u95f4\u5b9a\u4f4d\u548c\u8bed\u4e49\u68c0\u7d22\u4e09\u7c7b\u5de5\u5177\uff0c\u5e76\u7528\u84b8\u998f\u5f97\u5230\u7684\u8def\u7531\u7b56\u7565\u51b3\u5b9a\u4f55\u65f6\u7528\u54ea\u79cd\u5de5\u5177\u3002", "why_notable": "\u5b83\u628a\u957f\u89c6\u9891\u7406\u89e3\u4e2d\u7684\u611f\u77e5\u8fc7\u7a0b\u663e\u5f0f\u505a\u6210\u6309\u67e5\u8be2\u52a8\u6001\u8c03\u5ea6\u7684\u5de5\u5177\u4f7f\u7528\u95ee\u9898\uff0c\u5728\u6027\u80fd\u548c\u5e27\u6548\u7387\u4e4b\u95f4\u53d6\u5f97\u66f4\u597d\u5e73\u8861\uff0c\u5bf9\u89c6\u9891\u667a\u80fd\u4f53\u548c\u957f\u4e0a\u4e0b\u6587\u591a\u6a21\u6001\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Open-world 3D affordance grounding requires localizing functional object parts in 3D given free-form language queries. Existing methods typically assume pre-built object-centric 3D geometry and closed affordance ontologies, limiting deployment from raw RGB observations. We present AffordAny, an end-to-end framework that uses one monocular RGB image to construct large-scale text-conditioned 3D part supervision, ground affordances with a frozen vision-language model (VLM) guided decoder, and improve open-world generalization through pseudo-label self-training. Our automated pipeline produces a benchmark of 5,334 objects and 10,633 part-level samples spanning 473 categories, an order-of-magnitude increase in categorical diversity over prior work. The decoder progressively fuses frozen Cosmos-2B features with 3D geometry through spatial projection, instruction-conditioned semantic compression, and bidirectional geometry-semantics interaction. Minimal-perturbation pseudo-label self-training further adds new objects without human annotation. Under a systematic generalization protocol evaluating unseen objects, unseen categories, and unseen instruction paraphrases, our approach achieves 0.428 IoU on unseen objects and 0.315 IoU on unseen categories after self-training, with unseen-category mIoU improving by 6.3% relative (p\u003c0.01) and an instruction sensitivity gap of only 0.105, demonstrating effectiveness and robustness of our method.", "arxiv_id": "2608.20720", "arxiv_url": "https://arxiv.org/abs/2608.20720", "authors": ["Junqi Wu", "Kaihua Tang", "Xuanwen Chen", "Hongzhi Li", "Jianqiang Huang", "Xian-Sheng Hua"], "brief": "\u8bba\u6587\u63d0\u51fa AffordAny\uff0c\u4e00\u4e2a\u4ece\u5355\u5f20\u5355\u76ee RGB \u56fe\u50cf\u51fa\u53d1\u8fdb\u884c\u5f00\u653e\u4e16\u754c 3D \u53ef\u4f9b\u6027 grounding \u7684\u7aef\u5230\u7aef\u6846\u67b6\u3002\u5b83\u81ea\u52a8\u6784\u5efa\u6587\u672c\u6761\u4ef6\u76843D\u90e8\u4ef6\u76d1\u7763\u6570\u636e\uff0c\u5e76\u7528\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5f15\u5bfc\u7684\u89e3\u7801\u5668\u7ed3\u5408\u51e0\u4f55\u63a8\u7406\u5b9a\u4f4d\u529f\u80fd\u6027\u7269\u4f53\u90e8\u4ef6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20720", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u81ea\u52a8\u751f\u6210\u5305\u542b5334\u4e2a\u7269\u4f53\u300110633\u4e2a\u90e8\u4ef6\u7ea7\u6837\u672c\u3001\u8986\u76d6473\u7c7b\u7269\u4f53\u7684\u57fa\u51c6\u6570\u636e\uff0c\u7c7b\u522b\u591a\u6837\u6027\u8f83\u4ee5\u5f80\u63d0\u5347\u7ea6\u4e00\u4e2a\u6570\u91cf\u7ea7", "\u89e3\u7801\u5668\u878d\u5408\u51bb\u7ed3 Cosmos-2B \u89c6\u89c9\u8bed\u8a00\u7279\u5f81\u4e0e3D\u51e0\u4f55\uff0c\u901a\u8fc7\u7a7a\u95f4\u6295\u5f71\u3001\u6307\u4ee4\u6761\u4ef6\u8bed\u4e49\u538b\u7f29\u548c\u51e0\u4f55-\u8bed\u4e49\u53cc\u5411\u4ea4\u4e92\u5b8c\u6210\u5b9a\u4f4d", "\u91c7\u7528\u6700\u5c0f\u6270\u52a8\u4f2a\u6807\u7b7e\u81ea\u8bad\u7ec3\uff0c\u5728\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u60c5\u51b5\u4e0b\u6269\u5c55\u65b0\u7269\u4f53\uff0c\u5e76\u63d0\u5347\u672a\u89c1\u7c7b\u522b\u6cdb\u5316\u6027\u80fd"], "keywords": ["3D\u89c6\u89c9", "\u53ef\u4f9b\u6027", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f00\u653e\u4e16\u754c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20720v1", "published_at": "2026-08-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AffordAny: Open-World 3D Affordance Grounding from Monocular RGB Images via Vision-Language-Guided Geometric Reasoning", "tldr": "\u5355\u76eeRGB\u5b9e\u73b0\u5f00\u653e\u4e16\u754c3D\u53ef\u4f9b\u6027\u5b9a\u4f4d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AffordAny\uff0c\u4e00\u4e2a\u4ece\u5355\u5f20\u5355\u76ee RGB \u56fe\u50cf\u51fa\u53d1\u8fdb\u884c\u5f00\u653e\u4e16\u754c 3D \u53ef\u4f9b\u6027 grounding \u7684\u7aef\u5230\u7aef\u6846\u67b6\u3002\u5b83\u81ea\u52a8\u6784\u5efa\u6587\u672c\u6761\u4ef6\u76843D\u90e8\u4ef6\u76d1\u7763\u6570\u636e\uff0c\u5e76\u7528\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5f15\u5bfc\u7684\u89e3\u7801\u5668\u7ed3\u5408\u51e0\u4f55\u63a8\u7406\u5b9a\u4f4d\u529f\u80fd\u6027\u7269\u4f53\u90e8\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7a81\u7834\u4e86\u4ee5\u5f80\u4f9d\u8d56\u9884\u5efa\u7269\u4f53\u4e2d\u5fc33D\u51e0\u4f55\u548c\u5c01\u95ed\u53ef\u4f9b\u6027\u7c7b\u522b\u7684\u9650\u5236\uff0c\u4f7f\u5355\u5f20RGB\u56fe\u50cf\u4e5f\u80fd\u8fdb\u884c\u5f00\u653e\u8bcd\u88683D\u529f\u80fd\u90e8\u4ef6\u5b9a\u4f4d\uff1b\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u3001\u5177\u8eab\u611f\u77e5\u548c\u5f00\u653e\u4e16\u754c\u573a\u666f\u7406\u89e3\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Improving the safety of large language models (LLMs) often comes at the expense of utility, as globally applied safety tuning may affect model responses to both harmful and benign inputs. We propose \\textbf{C}ontinuous \\textbf{L}at\\textbf{E}nt \\textbf{A}dapter \\textbf{R}outing (CLEAR), a conditional safety adaptation framework that uses a lightweight hidden-state gate to continuously control the activation strength of a safety low-rank adapter. CLEAR aims to reduce harmful completions while avoiding unnecessary changes to the frozen backbone that could degrade performance on benign prompts. Experiments on widely used safety and utility benchmarks show that CLEAR improves robustness on HarmBench while reducing the utility degradation observed with globally applied safety tuning such as SFT or standard low-rank adaptation (LoRA). On Llama-3-8B-Instruct, CLEAR reduces HarmBench ASR from 32.3\\% to 0.5\\%, while retaining most of the base model\u0027s utility and achieving up to 7.1 percentage points higher GSM8K accuracy than globally applied SFT or LoRA. These results suggest that CLEAR is a promising mechanism for improving the safety--utility trade-off in LLM alignment.", "arxiv_id": "2608.21278", "arxiv_url": "https://arxiv.org/abs/2608.21278", "authors": ["Chengxiao Wang", "Enyi Jiang", "Xiaojing Liao", "Sanmi Koyejo"], "brief": "\u8bba\u6587\u63d0\u51fa CLEAR\uff0c\u4e00\u79cd\u6761\u4ef6\u5f0f LLM \u5b89\u5168\u5bf9\u9f50\u6846\u67b6\uff0c\u901a\u8fc7\u8f7b\u91cf\u9690\u85cf\u72b6\u6001\u95e8\u63a7\u8fde\u7eed\u8c03\u8282\u5b89\u5168 LoRA \u9002\u914d\u5668\u7684\u6fc0\u6d3b\u5f3a\u5ea6\u3002\u5b83\u5728\u6709\u5bb3\u8f93\u5165\u4e0a\u589e\u5f3a\u62d2\u7b54\u4e0e\u9632\u62a4\uff0c\u5728\u826f\u6027\u8f93\u5165\u4e0a\u5c3d\u91cf\u4fdd\u6301\u51bb\u7ed3\u57fa\u5ea7\u6a21\u578b\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21278", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u8fde\u7eed\u6f5c\u5728\u8def\u7531\u673a\u5236\uff0c\u6839\u636e\u9690\u85cf\u72b6\u6001\u52a8\u6001\u63a7\u5236\u5b89\u5168\u4f4e\u79e9\u9002\u914d\u5668\u5f3a\u5ea6\uff0c\u800c\u975e\u5168\u5c40\u7edf\u4e00\u65bd\u52a0\u5b89\u5168\u5fae\u8c03\u3002", "\u5728 Llama-3-8B-Instruct \u4e0a\u5c06 HarmBench \u653b\u51fb\u6210\u529f\u7387\u4ece 32.3% \u964d\u81f3 0.5%\u3002", "\u76f8\u6bd4\u5168\u5c40 SFT \u6216\u6807\u51c6 LoRA\uff0cCLEAR \u66f4\u5c11\u635f\u5bb3\u5b9e\u7528\u6027\u80fd\uff0cGSM8K \u51c6\u786e\u7387\u6700\u9ad8\u63d0\u5347 7.1 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50", "LoRA", "\u6a21\u578b\u8def\u7531"], "num_comments": 1, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2608.21278v1", "published_at": "2026-08-21", "score": 0.18, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21278.png", "title": "CLEAR: Continuous Latent Adapter Routing for Utility-Preserving LLM Safety Alignment", "tldr": "\u7528\u9690\u72b6\u6001\u95e8\u63a7\u6309\u9700\u6fc0\u6d3b\u5b89\u5168\u9002\u914d\u5668", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CLEAR\uff0c\u4e00\u79cd\u6761\u4ef6\u5f0f LLM \u5b89\u5168\u5bf9\u9f50\u6846\u67b6\uff0c\u901a\u8fc7\u8f7b\u91cf\u9690\u85cf\u72b6\u6001\u95e8\u63a7\u8fde\u7eed\u8c03\u8282\u5b89\u5168 LoRA \u9002\u914d\u5668\u7684\u6fc0\u6d3b\u5f3a\u5ea6\u3002\u5b83\u5728\u6709\u5bb3\u8f93\u5165\u4e0a\u589e\u5f3a\u62d2\u7b54\u4e0e\u9632\u62a4\uff0c\u5728\u826f\u6027\u8f93\u5165\u4e0a\u5c3d\u91cf\u4fdd\u6301\u51bb\u7ed3\u57fa\u5ea7\u6a21\u578b\u80fd\u529b\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u5b89\u5168\u5bf9\u9f50\u4e2d\u7684\u6838\u5fc3\u77db\u76fe\u2014\u2014\u5b89\u5168\u6027\u63d0\u5347\u5e38\u4f34\u968f\u901a\u7528\u80fd\u529b\u4e0b\u964d\u2014\u2014\u63d0\u51fa\u4e86\u66f4\u7ec6\u7c92\u5ea6\u3001\u6309\u9700\u542f\u7528\u7684\u9002\u914d\u673a\u5236\uff0c\u5177\u6709\u8f83\u597d\u7684\u5b9e\u7528\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Organizations maintain task-specific adapters for open-weight language models, and each new base-model release forces a migration decision: retain existing specialists, port adapters, refresh from preserved behavior, or retrain. Prior transfer work evaluates isolated model pairs, without studying these choices across real model release sequences. We present UpgradeBench, a decision-driven longitudinal benchmark covering four consecutive Qwen releases, one continuation checkpoint, six tasks, and two model sizes, augmented by OLMo checkpoints with known training lineage. The benchmark disentangles three core questions: whether a new checkpoint improves fixed-recipe retrained specialist performance, whether specialization assets transfer across versions, and what recovery resources are usable. We observe upgrade gains differ across task-scale-release episodes: some retrained baselines improve while others stay within training noise, with durability ranging from under one release interval for text-to-SQL to over fourteen months for intent classification. Direct adapter copying depends neither on architecture nor model family: on OLMo, retention drops from 0.88-0.99 at 46B-token continued pretraining to zero at 2.9T tokens; annealing and model souping introduce no extra harm, with portability decaying with continued-pretraining distance. Given preserved input data, teacher relabeling recovers target-base specialists without fresh gold annotations, though compute savings are not guaranteed. Simulating a fixed decision policy over 33 upgrade episodes yields 0.37pp mean quality regret with zero behavioral regressions at one-third the compute and label cost of full retraining. A lightweight CKA probe over 256 prompts predicts cross-version adapter portability (Spearman 0.74 across eight model pairs). We release per-example predictions, cost logs, split manifests, and evaluation code.", "arxiv_id": "2608.20918", "arxiv_url": "https://arxiv.org/abs/2608.20918", "authors": ["Ye Chen", "Weining Zhang"], "brief": "\u672c\u6587\u63d0\u51fa UpgradeBench\uff0c\u4e00\u4e2a\u9762\u5411\u7ec4\u7ec7\u7ef4\u62a4\u4efb\u52a1\u4e13\u7528\u9002\u914d\u5668\u65f6\u7684\u7eb5\u5411\u5347\u7ea7\u51b3\u7b56\u57fa\u51c6\uff0c\u8986\u76d6\u8fde\u7eed Qwen \u7248\u672c\u3001OLMo \u8bad\u7ec3\u8c31\u7cfb\u30016 \u4e2a\u4efb\u52a1\u548c\u4e24\u79cd\u6a21\u578b\u89c4\u6a21\u3002\u5b83\u7cfb\u7edf\u6bd4\u8f83\u4fdd\u7559\u65e7\u4e13\u5bb6\u3001\u8fc1\u79fb\u9002\u914d\u5668\u3001\u7528\u4fdd\u7559\u6570\u636e\u6062\u590d\u884c\u4e3a\u3001\u91cd\u65b0\u8bad\u7ec3\u7b49\u5347\u7ea7\u7b56\u7565\u7684\u6548\u679c\u4e0e\u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20918", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u62c6\u89e3\u4e09\u7c7b\u95ee\u9898\uff1a\u65b0\u57fa\u5ea7\u662f\u5426\u63d0\u5347\u56fa\u5b9a\u914d\u65b9\u91cd\u8bad\u4e13\u5bb6\u3001\u4e13\u7528\u8d44\u4ea7\u80fd\u5426\u8de8\u7248\u672c\u8fc1\u79fb\u3001\u53ef\u7528\u6062\u590d\u8d44\u6e90\u80fd\u5e26\u6765\u591a\u5c11\u6536\u76ca\u3002", "\u9002\u914d\u5668\u53ef\u79fb\u690d\u6027\u968f\u7ee7\u7eed\u9884\u8bad\u7ec3\u8ddd\u79bb\u8870\u51cf\uff1aOLMo \u4e2d\u4ece 46B token \u540e\u7684 0.88-0.99 \u4fdd\u7559\u7387\uff0c\u4e0b\u964d\u5230 2.9T token \u540e\u63a5\u8fd1\u4e3a\u96f6\u3002", "\u56fa\u5b9a\u5347\u7ea7\u7b56\u7565\u5728 33 \u4e2a\u5347\u7ea7\u7247\u6bb5\u4e2d\u5b9e\u73b0\u5e73\u5747\u4ec5 0.37 \u4e2a\u767e\u5206\u70b9\u8d28\u91cf\u9057\u61be\u3001\u65e0\u884c\u4e3a\u56de\u9000\uff0c\u5e76\u5c06\u8ba1\u7b97\u548c\u6807\u6ce8\u6210\u672c\u964d\u81f3\u5168\u91cf\u91cd\u8bad\u7684\u4e09\u5206\u4e4b\u4e00\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8fc1\u79fb", "\u5fae\u8c03", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20918v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "UpgradeBench: A Decision-Centric Benchmark for Upgrading Fine-Tuned LLM Specialists", "tldr": "\u8bc4\u6d4b\u5fae\u8c03LLM\u4e13\u5bb6\u7684\u7248\u672c\u5347\u7ea7\u51b3\u7b56", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa UpgradeBench\uff0c\u4e00\u4e2a\u9762\u5411\u7ec4\u7ec7\u7ef4\u62a4\u4efb\u52a1\u4e13\u7528\u9002\u914d\u5668\u65f6\u7684\u7eb5\u5411\u5347\u7ea7\u51b3\u7b56\u57fa\u51c6\uff0c\u8986\u76d6\u8fde\u7eed Qwen \u7248\u672c\u3001OLMo \u8bad\u7ec3\u8c31\u7cfb\u30016 \u4e2a\u4efb\u52a1\u548c\u4e24\u79cd\u6a21\u578b\u89c4\u6a21\u3002\u5b83\u7cfb\u7edf\u6bd4\u8f83\u4fdd\u7559\u65e7\u4e13\u5bb6\u3001\u8fc1\u79fb\u9002\u914d\u5668\u3001\u7528\u4fdd\u7559\u6570\u636e\u6062\u590d\u884c\u4e3a\u3001\u91cd\u65b0\u8bad\u7ec3\u7b49\u5347\u7ea7\u7b56\u7565\u7684\u6548\u679c\u4e0e\u6210\u672c\u3002", "why_notable": "\u5b83\u628a\u6a21\u578b\u7248\u672c\u5347\u7ea7\u4ece\u5355\u70b9\u8fc1\u79fb\u5b9e\u9a8c\u8f6c\u5316\u4e3a\u771f\u5b9e\u53d1\u5e03\u5e8f\u5217\u4e2d\u7684\u6210\u672c-\u8d28\u91cf\u51b3\u7b56\u95ee\u9898\uff0c\u4e3a\u4f01\u4e1a\u7ef4\u62a4\u5927\u91cf\u5fae\u8c03\u4e13\u5bb6\u6a21\u578b\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u8bc4\u6d4b\u3001\u7ecf\u9a8c\u89c4\u5f8b\u548c\u8f7b\u91cf\u9884\u6d4b\u5de5\u5177\u3002"}, {"abstract": "Evaluation of long-context Large Language Models (LLMs) has advanced rapidly. However, most existing benchmarks are limited to the document level and focus mainly on high-resource languages, leaving many fine-grained challenges insufficiently evaluated. To address this gap, we present MGAL, the first multilingual, granularity- and position-aware long-context benchmark. MGAL is constructed from United Nations (UN) reports spanning 8K to 128K tokens across the six official UN languages. It covers four coherent levels of linguistic granularity (word, sentence, paragraph, and document) and further stratifies entries by their position within the document (begin, middle, and end), indexed at both the document and paragraph levels. This design enables systematic diagnosis of multilingual long-context comprehension across different granularities. Through extensive experiments and analyses, we find that: (1) LLMs perform well at word-level tasks but struggle with coarser-grained ones; and (2) Closed-source models retain a clear performance advantage in lower-resource languages. We further identify two new challenges: (1) Under local semantic crowding, where neighboring sentences share topics and entities, models tend to follow surface cues (e.g., connectives like ``however\u0027\u0027 or repeated entities) rather than the discourse role of the sentence in surrounding context (e.g., background, outcome); and (2) A gap between fluency and consistency in generated outputs, where models produce text that reads smoothly but drifts from the source facts. In addition, we observe several patterns in line with prior studies, including reliance on nearby evidence and reuse of options under uncertainty.", "arxiv_id": "2608.20853", "arxiv_url": "https://arxiv.org/abs/2608.20853", "authors": ["Chunhan Li", "Chenglin Xu", "Zongyang Zhang", "Jiale Liu", "Zhuoxi Rao", "Xudong Jia", "Junxiu He", "Menglin Yang", "Wenjuan Gong", "Zhengzhe Liu", "Chengwei Qin"], "brief": "MGAL \u662f\u4e00\u4e2a\u9762\u5411\u957f\u4e0a\u4e0b\u6587 LLM \u7684\u591a\u8bed\u8a00\u3001\u7c92\u5ea6\u611f\u77e5\u3001\u4f4d\u7f6e\u611f\u77e5\u8bc4\u6d4b\u57fa\u51c6\uff0c\u57fa\u4e8e 8K \u5230 128K tokens \u7684\u8054\u5408\u56fd\u62a5\u544a\u6784\u5efa\u3002\u5b83\u8986\u76d6\u8054\u5408\u56fd\u516d\u79cd\u5b98\u65b9\u8bed\u8a00\uff0c\u5e76\u6309\u8bcd\u3001\u53e5\u3001\u6bb5\u843d\u3001\u6587\u6863\u56db\u4e2a\u7c92\u5ea6\u4ee5\u53ca\u6587\u6863/\u6bb5\u843d\u4e2d\u7684\u4f4d\u7f6e\u8fdb\u884c\u7cfb\u7edf\u8bc4\u6d4b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20853", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6\u82f1\u8bed\u3001\u6cd5\u8bed\u3001\u897f\u73ed\u7259\u8bed\u3001\u4fc4\u8bed\u3001\u963f\u62c9\u4f2f\u8bed\u3001\u4e2d\u6587\u516d\u79cd\u8054\u5408\u56fd\u5b98\u65b9\u8bed\u8a00\uff0c\u6587\u672c\u957f\u5ea6\u4ece 8K \u5230 128K tokens\u3002", "\u4efb\u52a1\u6309\u8bcd\u3001\u53e5\u3001\u6bb5\u843d\u3001\u6587\u6863\u56db\u4e2a\u8bed\u8a00\u7c92\u5ea6\u5212\u5206\uff0c\u5e76\u8fdb\u4e00\u6b65\u6807\u6ce8 begin/middle/end \u7b49\u4f4d\u7f6e\u4fe1\u606f\uff0c\u7528\u4e8e\u8bca\u65ad\u957f\u4e0a\u4e0b\u6587\u7406\u89e3\u80fd\u529b\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u6a21\u578b\u5728\u8bcd\u7ea7\u4efb\u52a1\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u66f4\u7c97\u7c92\u5ea6\u7406\u89e3\u4e0a\u660e\u663e\u4e0b\u964d\uff1b\u95ed\u6e90\u6a21\u578b\u5728\u4f4e\u8d44\u6e90\u8bed\u8a00\u4e0a\u4ecd\u6709\u4f18\u52bf\u3002"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u591a\u8bed\u8a00", "\u6a21\u578b\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20853v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MGAL: A Multilingual Granularity-Aware Long-Context Benchmark", "tldr": "\u9996\u4e2a\u591a\u8bed\u591a\u7c92\u5ea6\u957f\u4e0a\u4e0b\u6587\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "MGAL \u662f\u4e00\u4e2a\u9762\u5411\u957f\u4e0a\u4e0b\u6587 LLM \u7684\u591a\u8bed\u8a00\u3001\u7c92\u5ea6\u611f\u77e5\u3001\u4f4d\u7f6e\u611f\u77e5\u8bc4\u6d4b\u57fa\u51c6\uff0c\u57fa\u4e8e 8K \u5230 128K tokens \u7684\u8054\u5408\u56fd\u62a5\u544a\u6784\u5efa\u3002\u5b83\u8986\u76d6\u8054\u5408\u56fd\u516d\u79cd\u5b98\u65b9\u8bed\u8a00\uff0c\u5e76\u6309\u8bcd\u3001\u53e5\u3001\u6bb5\u843d\u3001\u6587\u6863\u56db\u4e2a\u7c92\u5ea6\u4ee5\u53ca\u6587\u6863/\u6bb5\u843d\u4e2d\u7684\u4f4d\u7f6e\u8fdb\u884c\u7cfb\u7edf\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5f25\u8865\u4e86\u73b0\u6709\u957f\u4e0a\u4e0b\u6587\u8bc4\u6d4b\u504f\u91cd\u6587\u6863\u7ea7\u548c\u9ad8\u8d44\u6e90\u8bed\u8a00\u7684\u4e0d\u8db3\uff0c\u80fd\u66f4\u7ec6\u81f4\u63ed\u793a\u591a\u8bed\u8a00\u957f\u4e0a\u4e0b\u6587\u6a21\u578b\u5728\u8bed\u4e49\u62e5\u6324\u3001\u4f4d\u7f6e\u4f9d\u8d56\u3001\u4e8b\u5b9e\u4e00\u81f4\u6027\u7b49\u65b9\u9762\u7684\u77ed\u677f\uff0c\u5bf9\u6a21\u578b\u8bca\u65ad\u548c\u6539\u8fdb\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "This paper investigates the development of causal foundation models for bounding the effect of interventions and counterfactuals from observational data. We show that a canonical prior can be defined with full support over the space of structural causal models with discrete observables. With this canonical prior, we translate the problem of bounding counterfactuals into that of learning distributions over functions that map data (and possibly structural assumptions) to a causal query of interest. This extends the promising causal foundational modelling paradigm to the estimation of partially-identifiable causal effects, i.e., under unobserved confounding, where multiple values are equally compatible with the observed data and prior structural assumptions.", "arxiv_id": "2608.20841", "arxiv_url": "https://arxiv.org/abs/2608.20841", "authors": ["Alexis Bellot", "Anish Dhir"], "brief": "\u672c\u6587\u7814\u7a76\u9762\u5411\u56e0\u679c\u63a8\u65ad\u7684\u57fa\u7840\u6a21\u578b\uff0c\u7528\u4e8e\u4ece\u89c2\u6d4b\u6570\u636e\u4e2d\u7ed9\u51fa\u5e72\u9884\u6548\u5e94\u4e0e\u53cd\u4e8b\u5b9e\u67e5\u8be2\u7684\u4e0a\u4e0b\u754c\u3002\u4f5c\u8005\u63d0\u51fa\u5728\u79bb\u6563\u53ef\u89c2\u6d4b\u53d8\u91cf\u7684\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u7a7a\u95f4\u4e0a\u5177\u6709\u5168\u652f\u6491\u7684\u89c4\u8303\u5148\u9a8c\uff0c\u5e76\u5c06\u53cd\u4e8b\u5b9e\u8fb9\u754c\u4f30\u8ba1\u8f6c\u5316\u4e3a\u5b66\u4e60\u4ece\u6570\u636e\u548c\u7ed3\u6784\u5047\u8bbe\u5230\u56e0\u679c\u67e5\u8be2\u7684\u51fd\u6570\u5206\u5e03\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20841", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9762\u5411\u5b58\u5728\u672a\u89c2\u6d4b\u6df7\u6742\u7684\u90e8\u5206\u53ef\u8bc6\u522b\u573a\u666f\uff0c\u800c\u975e\u53ea\u4f30\u8ba1\u552f\u4e00\u53ef\u8bc6\u522b\u7684\u56e0\u679c\u6548\u5e94", "\u6784\u9020\u8986\u76d6\u79bb\u6563\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u7a7a\u95f4\u7684\u89c4\u8303\u5148\u9a8c\uff0c\u4e3a\u8bad\u7ec3\u56e0\u679c\u57fa\u7840\u6a21\u578b\u63d0\u4f9b\u7406\u8bba\u57fa\u7840", "\u5c06\u56e0\u679c\u8fb9\u754c\u95ee\u9898\u8868\u8ff0\u4e3a\u51fd\u6570\u5206\u5e03\u5b66\u4e60\uff0c\u53ef\u540c\u65f6\u5904\u7406\u89c2\u6d4b\u6570\u636e\u4e0e\u53ef\u80fd\u7684\u7ed3\u6784\u5047\u8bbe"], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u57fa\u7840\u6a21\u578b", "\u53cd\u4e8b\u5b9e\u63a8\u7406", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20841v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Foundation Models for Partial Causal Identification", "tldr": "\u7528\u57fa\u7840\u6a21\u578b\u4f30\u8ba1\u90e8\u5206\u53ef\u8bc6\u522b\u56e0\u679c\u6548\u5e94\u8fb9\u754c", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u9762\u5411\u56e0\u679c\u63a8\u65ad\u7684\u57fa\u7840\u6a21\u578b\uff0c\u7528\u4e8e\u4ece\u89c2\u6d4b\u6570\u636e\u4e2d\u7ed9\u51fa\u5e72\u9884\u6548\u5e94\u4e0e\u53cd\u4e8b\u5b9e\u67e5\u8be2\u7684\u4e0a\u4e0b\u754c\u3002\u4f5c\u8005\u63d0\u51fa\u5728\u79bb\u6563\u53ef\u89c2\u6d4b\u53d8\u91cf\u7684\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u7a7a\u95f4\u4e0a\u5177\u6709\u5168\u652f\u6491\u7684\u89c4\u8303\u5148\u9a8c\uff0c\u5e76\u5c06\u53cd\u4e8b\u5b9e\u8fb9\u754c\u4f30\u8ba1\u8f6c\u5316\u4e3a\u5b66\u4e60\u4ece\u6570\u636e\u548c\u7ed3\u6784\u5047\u8bbe\u5230\u56e0\u679c\u67e5\u8be2\u7684\u51fd\u6570\u5206\u5e03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u56e0\u679c\u57fa\u7840\u6a21\u578b\u8303\u5f0f\u6269\u5c55\u5230\u66f4\u73b0\u5b9e\u4e5f\u66f4\u56f0\u96be\u7684\u90e8\u5206\u8bc6\u522b\u95ee\u9898\uff0c\u6709\u671b\u5728\u5b58\u5728\u9690\u85cf\u6df7\u6742\u3001\u65e0\u6cd5\u70b9\u4f30\u8ba1\u56e0\u679c\u6548\u5e94\u7684\u573a\u666f\u4e2d\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u4e0d\u786e\u5b9a\u6027\u8fb9\u754c\u3002"}, {"abstract": "Supervised fine-tuning (SFT) can degrade factual behavior outside the target domain. This degradation is often described as catastrophic forgetting, yet open-ended factual failures do not necessarily imply that the underlying facts have been erased. In this work, we identify a more specific phenomenon, factual access failure: after domain SFT, models can still recognize or rank the correct answer under constrained evaluation, while failing to produce it in closed-book generation. Through benchmark-level comparisons, same-fact multiple-choice and generation probes, and failure-mode analysis, we show that SFT-induced factual degradation reflects both genuine wrong-answer generations and expression-level failures such as verbosity, formatting mismatch, and exact-match artifacts. To address this problem, we introduce Recall-Anchored Distillation (RAD), a base-anchored self-distillation objective that preserves out-of-distribution generation behavior by aligning the adapted model with the original base model\u0027s soft continuation distribution on unlabeled OOD text. RAD requires no gold OOD answers, external judges, or labeled factual data. Across three backbones fine-tuned on MedMCQA, RAD recovers a consistent portion of the lost OOD recall while preserving target-domain adaptation. Compared with replay on the same OOD text, RAD shows that the key preservation signal is the base model\u0027s soft distribution rather than additional text exposure alone.", "arxiv_id": "2608.20794", "arxiv_url": "https://arxiv.org/abs/2608.20794", "authors": ["Haodong Chen", "Yadong Wang", "Shengtao Wen", "Dong Liang", "Xiang Chen"], "brief": "\u8bba\u6587\u6307\u51fa\u9886\u57dfSFT\u540e\u7684\u4e8b\u5b9e\u80fd\u529b\u4e0b\u964d\u5e76\u4e0d\u603b\u662f\u77e5\u8bc6\u88ab\u9057\u5fd8\uff0c\u800c\u53ef\u80fd\u662f\u201c\u4e8b\u5b9e\u8bbf\u95ee\u5931\u8d25\u201d\uff1a\u6a21\u578b\u4ecd\u80fd\u8bc6\u522b\u6b63\u786e\u7b54\u6848\uff0c\u5374\u65e0\u6cd5\u5728\u95ed\u5377\u751f\u6210\u4e2d\u8bf4\u51fa\u3002\u4f5c\u8005\u63d0\u51faRecall-Anchored Distillation\uff08RAD\uff09\uff0c\u7528\u539f\u59cb\u57fa\u5ea7\u6a21\u578b\u5728\u65e0\u6807\u6ce8OOD\u6587\u672c\u4e0a\u7684\u8f6f\u7eed\u5199\u5206\u5e03\u6765\u7ea6\u675f\u5fae\u8c03\u6a21\u578b\uff0c\u4fdd\u7559\u57df\u5916\u4e8b\u5b9e\u751f\u6210\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20794", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u57fa\u51c6\u5bf9\u6bd4\u3001\u540c\u4e00\u4e8b\u5b9e\u7684\u9009\u62e9\u9898\u4e0e\u751f\u6210\u5f0f\u63a2\u9488\uff0c\u533a\u5206\u771f\u5b9e\u7b54\u9519\u4e0e\u8868\u8fbe\u5c42\u5931\u8d25\uff0c\u5982\u5197\u957f\u3001\u683c\u5f0f\u4e0d\u5339\u914d\u3001\u7cbe\u786e\u5339\u914d\u8bc4\u6d4b\u4f2a\u5dee\u3002", "RAD\u4e0d\u9700\u8981OOD\u91d1\u6807\u7b54\u6848\u3001\u5916\u90e8\u8bc4\u5ba1\u5668\u6216\u6807\u6ce8\u4e8b\u5b9e\u6570\u636e\uff0c\u53ea\u9700\u65e0\u6807\u6ce8\u57df\u5916\u6587\u672c\u548c\u57fa\u5ea7\u6a21\u578b\u8f6f\u5206\u5e03\u3002", "\u5728\u4e09\u4e2a\u6a21\u578b\u9aa8\u5e72\u3001MedMCQA\u9886\u57df\u5fae\u8c03\u8bbe\u7f6e\u4e0b\uff0cRAD\u80fd\u7a33\u5b9a\u6062\u590d\u90e8\u5206\u4e22\u5931\u7684OOD\u53ec\u56de\uff0c\u540c\u65f6\u4fdd\u6301\u76ee\u6807\u9886\u57df\u9002\u5e94\u6548\u679c\u3002"], "keywords": ["\u76d1\u7763\u5fae\u8c03", "\u77e5\u8bc6\u4fdd\u6301", "\u77e5\u8bc6\u84b8\u998f", "\u4e8b\u5b9e\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20794v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Knowing but Not Saying: Preventing Factual Access Failures in LLM SFT via Recall-Anchored Distillation", "tldr": "\u7528\u57fa\u5ea7\u5206\u5e03\u84b8\u998f\u7f13\u89e3SFT\u4e8b\u5b9e\u8bbf\u95ee\u5931\u8d25", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u9886\u57dfSFT\u540e\u7684\u4e8b\u5b9e\u80fd\u529b\u4e0b\u964d\u5e76\u4e0d\u603b\u662f\u77e5\u8bc6\u88ab\u9057\u5fd8\uff0c\u800c\u53ef\u80fd\u662f\u201c\u4e8b\u5b9e\u8bbf\u95ee\u5931\u8d25\u201d\uff1a\u6a21\u578b\u4ecd\u80fd\u8bc6\u522b\u6b63\u786e\u7b54\u6848\uff0c\u5374\u65e0\u6cd5\u5728\u95ed\u5377\u751f\u6210\u4e2d\u8bf4\u51fa\u3002\u4f5c\u8005\u63d0\u51faRecall-Anchored Distillation\uff08RAD\uff09\uff0c\u7528\u539f\u59cb\u57fa\u5ea7\u6a21\u578b\u5728\u65e0\u6807\u6ce8OOD\u6587\u672c\u4e0a\u7684\u8f6f\u7eed\u5199\u5206\u5e03\u6765\u7ea6\u675f\u5fae\u8c03\u6a21\u578b\uff0c\u4fdd\u7559\u57df\u5916\u4e8b\u5b9e\u751f\u6210\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ec6\u5316\u4e86SFT\u540e\u4e8b\u5b9e\u9000\u5316\u7684\u6210\u56e0\uff0c\u5c06\u201c\u707e\u96be\u6027\u9057\u5fd8\u201d\u62c6\u89e3\u4e3a\u66f4\u53ef\u8bca\u65ad\u7684\u4e8b\u5b9e\u8bbf\u95ee\u95ee\u9898\uff0c\u5e76\u63d0\u51fa\u4f4e\u6807\u6ce8\u6210\u672c\u7684\u4fdd\u6301\u65b9\u6cd5\uff1b\u5bf9\u533b\u7597\u7b49\u9886\u57df\u5fae\u8c03\u4e2d\u517c\u987e\u4e13\u4e1a\u9002\u5e94\u4e0e\u901a\u7528\u4e8b\u5b9e\u53ef\u9760\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Manipulating moving objects requires a policy to anticipate contact events, yet vision-language-action (VLA) policies are commonly fine-tuned from the current observation alone. World action models (WAMs) learn predictive dynamics, but running a video-scale teacher or explicitly imagining future frames at deployment is costly. We introduce ForeTime-VLA, a dense pi0.5 policy that distills a future-aware, action-equivalent representation from a frozen Fast-WAM-derived teacher while remaining causal at inference. Offline, current and future video latents are compressed into a whitened 64-D target. Online, an eight-frame history encoder predicts this target together with manipulation phase and normalized time-to-transition. Four future tokens and one phase token condition the VLM prefix, while the predicted future and transition horizon condition the action expert. Training retains the original flow-matching action target and adds cosine, relational geometry, phase, time-to-transition, and action-equivalence objectives. On a deduplicated conveyor-belt dataset, we compare 40k-step checkpoints on 768 matched windows per split. Test MAE decreases from 0.134119 to 0.130593 (2.63%; paired-bootstrap 95% CI: 0.82-4.48% improvement), and test L2 decreases by 3.02%, at a 2.46-2.93% latency cost. In quantitative real-robot evaluation, ForeTime-VLA achieves 81.1% stationary and 58.9% slow-moving grasp success, exceeding the next-best reference by 12.2 and 22.2 percentage points, respectively. Across three belt speeds, it completes 44/90 grasps versus 23/90 for pi0.5, including 11/30 versus 2/30 at fast speed. The agreement between offline orientation gains and reduced real-robot contact-pose failures supports causal future-token distillation as an effective way to improve dynamic manipulation without deploying the world-model teacher.", "arxiv_id": "2608.20735", "arxiv_url": "https://arxiv.org/abs/2608.20735", "authors": ["Siyuan Ma", "Yutian Zhang", "Boshi Zhang", "Qinglian Wu", "Jiaqi Zhai", "Dong Wei", "Xiaojin Huang"], "brief": "\u8bba\u6587\u63d0\u51fa ForeTime-VLA\uff1a\u4ece\u51bb\u7ed3\u7684\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u6559\u5e08\u4e2d\u84b8\u998f\u201c\u672a\u6765\u611f\u77e5\u3001\u52a8\u4f5c\u7b49\u4ef7\u201d\u7684\u8868\u793a\uff0c\u8ba9 VLA \u7b56\u7565\u5728\u63a8\u7406\u65f6\u65e0\u9700\u751f\u6210\u672a\u6765\u89c6\u9891\u4e5f\u80fd\u9884\u5224\u63a5\u89e6\u4e8b\u4ef6\u3002\u8be5\u65b9\u6cd5\u9762\u5411\u4f20\u9001\u5e26\u52a8\u6001\u7269\u4f53\u6293\u53d6\uff0c\u5728\u4fdd\u6301\u56e0\u679c\u63a8\u7406\u7684\u540c\u65f6\u63d0\u5347\u771f\u5b9e\u673a\u5668\u4eba\u6210\u529f\u7387\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20735", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u79bb\u7ebf\u5c06\u5f53\u524d\u4e0e\u672a\u6765\u89c6\u9891\u6f5c\u53d8\u91cf\u538b\u7f29\u4e3a\u767d\u5316\u768464\u7ef4\u76ee\u6807\uff0c\u5728\u7ebf\u75318\u5e27\u5386\u53f2\u7f16\u7801\u5668\u9884\u6d4b\u672a\u6765\u8868\u793a\u3001\u64cd\u4f5c\u9636\u6bb5\u548c\u5230\u9636\u6bb5\u8f6c\u6362\u7684\u5f52\u4e00\u5316\u65f6\u95f4\u3002", "\u75284\u4e2a\u672a\u6765Token\u548c1\u4e2a\u9636\u6bb5Token\u6761\u4ef6\u5316VLM\u524d\u7f00\uff0c\u5e76\u5c06\u9884\u6d4b\u672a\u6765\u4e0e\u8f6c\u6362\u65f6\u8ddd\u8f93\u5165\u52a8\u4f5c\u4e13\u5bb6\uff0c\u540c\u65f6\u52a0\u5165\u4f59\u5f26\u3001\u5173\u7cfb\u51e0\u4f55\u3001\u9636\u6bb5\u3001\u65f6\u95f4\u5230\u8f6c\u6362\u548c\u52a8\u4f5c\u7b49\u4ef7\u635f\u5931\u3002", "\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\uff0cForeTime-VLA\u5728\u9759\u6b62\u548c\u6162\u901f\u79fb\u52a8\u6293\u53d6\u4e0a\u5206\u522b\u8fbe\u523081.1%\u548c58.9%\u6210\u529f\u7387\uff1b\u4e09\u79cd\u4f20\u9001\u5e26\u901f\u5ea6\u5171\u5b8c\u621044/90\u6b21\u6293\u53d6\uff0c\u660e\u663e\u4f18\u4e8epi0.5\u768423/90\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "VLA", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20735v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ForeTime-VLA: Causal Future-Token Distillation from a World Action Model for Conveyor-Belt Manipulation", "tldr": "\u7528\u672a\u6765Token\u84b8\u998f\u63d0\u5347\u4f20\u9001\u5e26\u6293\u53d6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ForeTime-VLA\uff1a\u4ece\u51bb\u7ed3\u7684\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u6559\u5e08\u4e2d\u84b8\u998f\u201c\u672a\u6765\u611f\u77e5\u3001\u52a8\u4f5c\u7b49\u4ef7\u201d\u7684\u8868\u793a\uff0c\u8ba9 VLA \u7b56\u7565\u5728\u63a8\u7406\u65f6\u65e0\u9700\u751f\u6210\u672a\u6765\u89c6\u9891\u4e5f\u80fd\u9884\u5224\u63a5\u89e6\u4e8b\u4ef6\u3002\u8be5\u65b9\u6cd5\u9762\u5411\u4f20\u9001\u5e26\u52a8\u6001\u7269\u4f53\u6293\u53d6\uff0c\u5728\u4fdd\u6301\u56e0\u679c\u63a8\u7406\u7684\u540c\u65f6\u63d0\u5347\u771f\u5b9e\u673a\u5668\u4eba\u6210\u529f\u7387\u3002", "why_notable": "\u5b83\u63d0\u4f9b\u4e86\u4e00\u79cd\u4f4e\u5f00\u9500\u5229\u7528\u4e16\u754c\u6a21\u578b\u9884\u6d4b\u80fd\u529b\u7684\u65b9\u6cd5\uff1a\u628a\u672a\u6765\u52a8\u6001\u77e5\u8bc6\u84b8\u998f\u8fdb\u56e0\u679cVLA\u7b56\u7565\uff0c\u800c\u4e0d\u662f\u90e8\u7f72\u6602\u8d35\u7684\u89c6\u9891\u7ea7\u4e16\u754c\u6a21\u578b\u3002\u8fd9\u5bf9\u52a8\u6001\u73af\u5883\u4e2d\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\uff0c\u5c24\u5176\u662f\u9700\u8981\u63d0\u524d\u9884\u5224\u63a5\u89e6\u59ff\u6001\u548c\u65f6\u673a\u7684\u4efb\u52a1\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) has no model of time: when a fact changes across a coding session - a function is renamed, an endpoint moves, a dependency is bumped - RAG retrieves both the old and new value with near-identical similarity and cannot tell which is current, so it serves the superseded value. Paper 1 showed, on synthetic single-value benchmarks, that a deterministic (subject, relation, object) supersession memory eliminates this failure. Here we validate it end-to-end on real software history. From 707 real GitHub issues (SWE-bench Lite + Verified) we extract 130 clean atomic state transitions, a fix that changes one identifiable value from a pre-fix to a post-fix form, and render each marker-free (the stale and current statements differ only in the value). On this set, MemStrata reaches 0.91 answer accuracy versus RAG\u0027s 0.57-0.59; and, the structural result, when forced to answer RAG serves the superseded value 36-38% of the time (an LLM reranker does not help) while MemStrata drives this to ~0, at RAG retrieval latency (~2.1 s vs ~18 s for the reranker). We are explicit about scope: only ~18% of real fixes are clean atomic transitions; Paper 2 isolates the memory mechanism on that class, and extraction coverage of the remaining fixes is the orthogonal problem we defer to follow-on work. A real product bug surfaced and was fixed during the study (a case/punctuation-insensitive value comparison), with the moat property (deterministic-supersession accuracy on clean code mutations) preserved and verified.", "arxiv_id": "2608.20685", "arxiv_url": "https://arxiv.org/abs/2608.20685", "authors": ["Neeraj Yadav"], "brief": "\u672c\u6587\u5728\u771f\u5b9e GitHub \u4fee\u590d\u5386\u53f2\u4e0a\u9a8c\u8bc1 MemStrata\uff1a\u7528\u786e\u5b9a\u6027\u7684\u201c\u4e3b\u8bed-\u5173\u7cfb-\u5bbe\u8bed\u201d\u66ff\u6362\u8bb0\u5fc6\u5efa\u6a21\u4e8b\u5b9e\u968f\u65f6\u95f4\u7684\u5e9f\u6b62\u5173\u7cfb\uff0c\u907f\u514d RAG \u540c\u65f6\u53ec\u56de\u65b0\u65e7\u4e8b\u5b9e\u540e\u8bef\u7528\u65e7\u503c\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20685", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4ece SWE-bench Lite \u4e0e Verified \u7684 707 \u4e2a\u771f\u5b9e GitHub issue \u4e2d\u63d0\u53d6\u51fa 130 \u4e2a\u5e72\u51c0\u7684\u539f\u5b50\u72b6\u6001\u8fc1\u79fb\u6837\u672c\u3002", "MemStrata \u7b54\u6848\u51c6\u786e\u7387\u8fbe 0.91\uff0c\u663e\u8457\u9ad8\u4e8e RAG \u7684 0.57-0.59\u3002", "RAG \u88ab\u8feb\u56de\u7b54\u65f6\u6709 36-38% \u4f1a\u8f93\u51fa\u5df2\u5e9f\u6b62\u503c\uff0cLLM reranker \u65e0\u660e\u663e\u5e2e\u52a9\uff1bMemStrata \u5c06\u8be5\u9519\u8bef\u964d\u81f3\u63a5\u8fd1 0\uff0c\u4e14\u5ef6\u8fdf\u63a5\u8fd1\u666e\u901a RAG\u3002"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u8bb0\u5fc6\u673a\u5236", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20685v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Temporal Validity on Real Software Histories: Eliminating Stale-Fact Errors in Code-Assistant Memory over GitHub Fixes", "tldr": "\u7528\u786e\u5b9a\u6027\u8bb0\u5fc6\u6d88\u9664\u4ee3\u7801\u52a9\u624b\u9648\u65e7\u4e8b\u5b9e\u9519\u8bef", "upvotes": 0, "what_it_is": "\u672c\u6587\u5728\u771f\u5b9e GitHub \u4fee\u590d\u5386\u53f2\u4e0a\u9a8c\u8bc1 MemStrata\uff1a\u7528\u786e\u5b9a\u6027\u7684\u201c\u4e3b\u8bed-\u5173\u7cfb-\u5bbe\u8bed\u201d\u66ff\u6362\u8bb0\u5fc6\u5efa\u6a21\u4e8b\u5b9e\u968f\u65f6\u95f4\u7684\u5e9f\u6b62\u5173\u7cfb\uff0c\u907f\u514d RAG \u540c\u65f6\u53ec\u56de\u65b0\u65e7\u4e8b\u5b9e\u540e\u8bef\u7528\u65e7\u503c\u3002", "why_notable": "\u5b83\u63ed\u793a\u4e86 RAG \u5728\u4ee3\u7801\u573a\u666f\u4e2d\u7f3a\u4e4f\u65f6\u95f4\u6709\u6548\u6027\u5efa\u6a21\u7684\u7cfb\u7edf\u6027\u7f3a\u9677\uff0c\u5e76\u5728\u771f\u5b9e\u8f6f\u4ef6\u5386\u53f2\u4e0a\u8bc1\u660e\u7b80\u5355\u786e\u5b9a\u6027\u66ff\u6362\u8bb0\u5fc6\u53ef\u663e\u8457\u51cf\u5c11\u9648\u65e7\u4e8b\u5b9e\u9519\u8bef\uff0c\u5bf9\u4ee3\u7801\u52a9\u624b\u548c\u667a\u80fd\u4f53\u8bb0\u5fc6\u8bbe\u8ba1\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Machines that understand humans should perceive the present and anticipate the future. Existing human-centric vision model are pretrained on human images, set the state of the art in static dense perception, so motion and anticipation are out of reach. Here we present Human-JEPA, a human-centric vision model trained on video by anchored forecasting: dense targets are pinned to a frozen copy of the initialization, preventing a silent collapse of dense perception, and block masks are replaced by a pure past-to-future split, avoiding a five-point action tax and a seventeen-point re-identification collapse. Under frozen probes, Human-JEPA leads the pixel-anchored specialists on pose and person re-identification at 2.7 times fewer parameters, conceding high-resolution dense parsing, and its released predictor head is the first that does not degrade anticipation. A single safely adapted model thus serves both halves of understanding humans.", "arxiv_id": "2608.21160", "arxiv_url": "https://arxiv.org/abs/2608.21160", "authors": ["Hui Wei", "Licai Sun", "Guoying Zhao"], "brief": "\u672c\u6587\u63d0\u51fa Human-JEPA\uff0c\u4e00\u4e2a\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u89c6\u9891\u89c6\u89c9\u6a21\u578b\uff0c\u901a\u8fc7\u89c6\u9891\u9884\u8bad\u7ec3\u540c\u65f6\u652f\u6301\u5f53\u524d\u4eba\u4f53\u5bc6\u96c6\u611f\u77e5\u4e0e\u672a\u6765\u52a8\u4f5c/\u72b6\u6001\u9884\u6d4b\u3002\u5b83\u7528 anchored forecasting \u5c06\u5bc6\u96c6\u76ee\u6807\u951a\u5b9a\u5230\u521d\u59cb\u5316\u7684\u51bb\u7ed3\u526f\u672c\uff0c\u907f\u514d\u9884\u8bad\u7ec3\u635f\u5bb3\u59ff\u6001\u3001\u91cd\u8bc6\u522b\u7b49\u9759\u6001\u611f\u77e5\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21160", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u7eaf\u8fc7\u53bb\u5230\u672a\u6765\u7684\u65f6\u5e8f\u5207\u5206\u66ff\u4ee3\u5e38\u89c1\u5757\u63a9\u7801\uff0c\u51cf\u5c11\u52a8\u4f5c\u8bc6\u522b\u4e0e\u91cd\u8bc6\u522b\u6027\u80fd\u574d\u584c\u95ee\u9898\u3002", "\u5728\u51bb\u7ed3\u63a2\u9488\u8bc4\u6d4b\u4e0b\uff0c\u4ee5\u7ea6 2.7 \u500d\u66f4\u5c11\u53c2\u6570\u8d85\u8fc7\u50cf\u7d20\u951a\u5b9a\u4e13\u7528\u6a21\u578b\u7684\u59ff\u6001\u4f30\u8ba1\u4e0e\u884c\u4eba\u91cd\u8bc6\u522b\u8868\u73b0\u3002", "\u53d1\u5e03\u7684 predictor head \u53ef\u7528\u4e8e\u672a\u6765\u9884\u6d4b\uff0c\u4e14\u4e0d\u4f1a\u964d\u4f4e anticipation \u80fd\u529b\uff1b\u4f46\u5728\u9ad8\u5206\u8fa8\u7387\u5bc6\u96c6\u89e3\u6790\u4e0a\u6709\u6240\u8ba9\u6b65\u3002"], "keywords": ["\u4eba\u4f53\u89c6\u89c9", "\u89c6\u9891\u9884\u8bad\u7ec3", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u52a8\u4f5c\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21160v1", "published_at": "2026-08-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Human-JEPA: A Human-Centric Vision Model that Perceives and Anticipates", "tldr": "\u9762\u5411\u4eba\u4f53\u611f\u77e5\u4e0e\u9884\u6d4b\u7684\u89c6\u9891\u9884\u8bad\u7ec3\u6a21\u578b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Human-JEPA\uff0c\u4e00\u4e2a\u4ee5\u4eba\u4e3a\u4e2d\u5fc3\u7684\u89c6\u9891\u89c6\u89c9\u6a21\u578b\uff0c\u901a\u8fc7\u89c6\u9891\u9884\u8bad\u7ec3\u540c\u65f6\u652f\u6301\u5f53\u524d\u4eba\u4f53\u5bc6\u96c6\u611f\u77e5\u4e0e\u672a\u6765\u52a8\u4f5c/\u72b6\u6001\u9884\u6d4b\u3002\u5b83\u7528 anchored forecasting \u5c06\u5bc6\u96c6\u76ee\u6807\u951a\u5b9a\u5230\u521d\u59cb\u5316\u7684\u51bb\u7ed3\u526f\u672c\uff0c\u907f\u514d\u9884\u8bad\u7ec3\u635f\u5bb3\u59ff\u6001\u3001\u91cd\u8bc6\u522b\u7b49\u9759\u6001\u611f\u77e5\u80fd\u529b\u3002", "why_notable": "\u5b83\u5c1d\u8bd5\u628a\u4eba\u4f53\u9759\u6001\u5bc6\u96c6\u611f\u77e5\u4e0e\u52a8\u6001\u672a\u6765\u9884\u6d4b\u7edf\u4e00\u5230\u4e00\u4e2a\u5b89\u5168\u9002\u914d\u7684\u89c6\u9891\u9884\u8bad\u7ec3\u6a21\u578b\u4e2d\uff0c\u7f13\u89e3\u4e86\u4eba\u7c7b\u4e2d\u5fc3\u89c6\u89c9\u6a21\u578b\u957f\u671f\u504f\u5411\u9759\u6001\u56fe\u50cf\u3001\u96be\u4ee5\u5904\u7406\u8fd0\u52a8\u4e0e\u9884\u5224\u7684\u95ee\u9898\u3002"}, {"abstract": "Deploying vision-language models (VLMs) on mobile devices is challenging due to their significant memory and compute requirements. We present a framework for quantizing VLMs for efficient inference on resource-constrained hardware. Our approach combines a quantization pipeline that uses the model itself to generate training data and does not require access to the training setup, with a novel 2.7-bit-per-parameter format supporting efficient execution on Arm CPUs. We validate our approach by compressing the Llama 3.2 11B Vision Instruct model to 3.7 GB with 8-bit activations, preserving strong performance on a set of standard visual question answering tasks.", "arxiv_id": "2608.21134", "arxiv_url": "https://arxiv.org/abs/2608.21134", "authors": ["Luka Ribar", "Jeevan Bhoot", "Douglas Orr"], "brief": "\u672c\u6587\u63d0\u51fa Llama-Mobile\uff0c\u4e00\u4e2a\u9762\u5411\u79fb\u52a8\u7aef\u90e8\u7f72\u7684 VLM \u91cf\u5316\u6846\u67b6\u3002\u5b83\u5c06 Llama 3.2 11B Vision Instruct \u538b\u7f29\u5230 3.7GB\uff0c\u5e76\u652f\u6301\u5728 Arm CPU \u4e0a\u9ad8\u6548\u63a8\u7406\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21134", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u65e0\u9700\u539f\u59cb\u8bad\u7ec3\u6d41\u7a0b\u7684\u6570\u636e\u751f\u6210\u5f0f\u91cf\u5316\u7ba1\u7ebf\uff0c\u7531\u6a21\u578b\u81ea\u8eab\u751f\u6210\u91cf\u5316\u8bad\u7ec3\u6570\u636e", "\u63d0\u51fa\u6bcf\u53c2\u6570 2.7-bit \u7684\u65b0\u91cf\u5316\u683c\u5f0f\uff0c\u540c\u65f6\u4f7f\u7528 8-bit \u6fc0\u6d3b\u4ee5\u517c\u987e\u7cbe\u5ea6\u4e0e\u6267\u884c\u6548\u7387", "\u5728\u6807\u51c6\u89c6\u89c9\u95ee\u7b54\u4efb\u52a1\u4e0a\u9a8c\u8bc1\uff0c\u538b\u7f29\u540e\u4ecd\u4fdd\u6301\u8f83\u5f3a\u6027\u80fd\uff0c\u9002\u5408\u8d44\u6e90\u53d7\u9650\u79fb\u52a8\u786c\u4ef6"], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u91cf\u5316", "\u7aef\u4fa7\u90e8\u7f72", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.2
