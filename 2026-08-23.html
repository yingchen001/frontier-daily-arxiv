g Large Vision-Language Models (LVLMs) to explore novel reasoning strategies. This limitation leads to a performance gap between RL and Supervised Fine-Tuning (SFT). In this paper, we argue that multi-modal retrieval can serve as an effective reasoning signal for caption refinement. Based on this insight, we present the Retrieval-Guided Refinement for Image Captioning (Re$^3$Cap), a retrieval-guided reasoning strategy that enhances image captioning without requiring additional annotations. Instantiated by Caption Refinement Suggester (CRS) and Caption Quality Assessor (CQA), this strategy identifies hallucinations and omissions in image captions, leading to more accurate and detailed descriptions. Extensive experiments demonstrate the superiority of our method in image captioning, even compared with Supervised Fine-Tuning. Especially, Re$^3$Cap outperforms GRPO with an average improvement of 8.64% in relation reasoning on the COCO-LN500 benchmark.", "arxiv_id": "2608.21305", "arxiv_url": "https://arxiv.org/abs/2608.21305", "authors": ["Haonan Jia", "Shichao Dong", "Zenghui Sun", "Jiawen Zheng", "Ziqi Miao", "Gege Shi", "Qiuyu Zhao", "Jinsong Lan", "Xiaoyong Zhu", "Bo Zheng"], "brief": "\u672c\u6587\u63d0\u51fa Re\u00b3Cap\uff0c\u7528\u591a\u6a21\u6001\u68c0\u7d22\u4f5c\u4e3a\u63a8\u7406\u4fe1\u53f7\u6765\u6307\u5bfc\u56fe\u50cf\u63cf\u8ff0\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\uff0c\u65e0\u9700\u989d\u5916\u6807\u6ce8\u5373\u53ef\u53d1\u73b0\u5e76\u4fee\u6b63\u63cf\u8ff0\u4e2d\u7684\u5e7b\u89c9\u4e0e\u9057\u6f0f\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u56fe\u50cf\u63cf\u8ff0\u8d28\u91cf\u4e0a\u4f18\u4e8e\u5e38\u89c4\u5f3a\u5316\u5b66\u4e60\uff0c\u751a\u81f3\u53ef\u8d85\u8fc7\u76d1\u7763\u5fae\u8c03\uff0c\u5e76\u5728 COCO-LN500 \u7684\u5173\u7cfb\u63a8\u7406\u4e0a\u76f8\u6bd4 GRPO \u5e73\u5747\u63d0\u5347 8.64%\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21305", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u63cf\u8ff0", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001\u68c0\u7d22", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21305v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Re$^3$Cap: Retrieval-Guided Refinement for Image Captioning Enhancement via Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa Re\u00b3Cap\uff0c\u7528\u591a\u6a21\u6001\u68c0\u7d22\u4f5c\u4e3a\u63a8\u7406\u4fe1\u53f7\u6765\u6307\u5bfc\u56fe\u50cf\u63cf\u8ff0\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\uff0c\u65e0\u9700\u989d\u5916\u6807\u6ce8\u5373\u53ef\u53d1\u73b0\u5e76\u4fee\u6b63\u63cf\u8ff0\u4e2d\u7684\u5e7b\u89c9\u4e0e\u9057\u6f0f\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728\u56fe\u50cf\u63cf\u8ff0\u8d28\u91cf\u4e0a\u4f18\u4e8e\u5e38\u89c4\u5f3a\u5316\u5b66\u4e60\uff0c\u751a\u81f3\u53ef\u8d85\u8fc7\u76d1\u7763\u5fae\u8c03\uff0c\u5e76\u5728 COCO-LN500 \u7684\u5173\u7cfb\u63a8\u7406\u4e0a\u76f8\u6bd4 GRPO \u5e73\u5747\u63d0\u5347 8.64%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Skills play different roles as an agent\u0027s policy evolves: they should first provide learnable knowledge, then support capability formation, and finally be invoked only when they improve individual decisions. Existing methods rarely model this lifecycle. They either keep skills outside the model, fully internalize them, or select among internalization and utilization objectives through noisy task-level success rates. Such designs fragment training and assign uniform importance to actions within the same trajectory, even though skill guidance may help some decisions while distracting others. To solve these problems, we introduce AUSO (Action-level Unified Skill Optimization), which unifies skill learning and skill use through a progressive, action-aware optimization process. At the beginning of training, AUSO jointly learns from teacher guidance and environmental outcomes, enabling the policy to acquire foundational skills without losing task-oriented feedback. It subsequently emphasizes outcome-based policy optimization to consolidate autonomous problem-solving ability. As the policy matures, AUSO evaluates each sampled action under both skill-conditioned and skill-free contexts. The resulting action-level information signal is coupled with the trajectory outcome advantage, allowing beneficial skill-sensitive actions to receive stronger updates and harmful ones to be suppressed. Therefore, skills gradually transition from an external source of supervision into decision knowledge whose utilization is adapted to its action-level benefit, while reinforcement learning remains the shared backbone across all stages. Experiments on ALFWorld, WebShop, and SearchQA show that AUSO consistently improves agent performance and out-of-distribution generalization over competitive baselines.", "arxiv_id": "2608.21292", "arxiv_url": "https://arxiv.org/abs/2608.21292", "authors": ["Huizu Lin", "Chengkai Huang", "Tianqi Gao", "Tao Huang", "Daijiao Liu", "Tongxin Li", "Xiaoyan Sun", "Lina Yao"], "brief": "\u672c\u6587\u63d0\u51fa AUSO\uff0c\u5c06\u6280\u80fd\u5b66\u4e60\u4e0e\u6280\u80fd\u4f7f\u7528\u7edf\u4e00\u5230\u4e00\u4e2a\u6e10\u8fdb\u5f0f\u3001\u52a8\u4f5c\u7ea7\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u6846\u67b6\u4e2d\u3002\u5b83\u5148\u7ed3\u5408\u6559\u5e08\u6280\u80fd\u6307\u5bfc\u4e0e\u73af\u5883\u53cd\u9988\u5b66\u4e60\u57fa\u7840\u80fd\u529b\uff0c\u968f\u540e\u8f6c\u5411\u7ed3\u679c\u9a71\u52a8\u7684\u81ea\u4e3b\u4f18\u5316\uff0c\u5e76\u5728\u6210\u719f\u9636\u6bb5\u6309\u52a8\u4f5c\u8bc4\u4f30\u6280\u80fd\u662f\u5426\u6709\u76ca\uff0c\u4ece\u800c\u5f3a\u5316\u6709\u5e2e\u52a9\u7684\u6280\u80fd\u8c03\u7528\u3001\u6291\u5236\u5e72\u6270\u3002\u5b9e\u9a8c\u8868\u660e\uff0cAUSO \u5728 ALFWorld\u3001WebShop \u548c SearchQA \u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u4e86\u5206\u5e03\u5916\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21292", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6280\u80fd\u5b66\u4e60", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21292v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AUSO: Action-Level Unified Skill Optimization from Internalization to Utilization", "tldr": "\u672c\u6587\u63d0\u51fa AUSO\uff0c\u5c06\u6280\u80fd\u5b66\u4e60\u4e0e\u6280\u80fd\u4f7f\u7528\u7edf\u4e00\u5230\u4e00\u4e2a\u6e10\u8fdb\u5f0f\u3001\u52a8\u4f5c\u7ea7\u7684\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u6846\u67b6\u4e2d\u3002\u5b83\u5148\u7ed3\u5408\u6559\u5e08\u6280\u80fd\u6307\u5bfc\u4e0e\u73af\u5883\u53cd\u9988\u5b66\u4e60\u57fa\u7840\u80fd\u529b\uff0c\u968f\u540e\u8f6c\u5411\u7ed3\u679c\u9a71\u52a8\u7684\u81ea\u4e3b\u4f18\u5316\uff0c\u5e76\u5728\u6210\u719f\u9636\u6bb5\u6309\u52a8\u4f5c\u8bc4\u4f30\u6280\u80fd\u662f\u5426\u6709\u76ca\uff0c\u4ece\u800c\u5f3a\u5316\u6709\u5e2e\u52a9\u7684\u6280\u80fd\u8c03\u7528\u3001\u6291\u5236\u5e72\u6270\u3002\u5b9e\u9a8c\u8868\u660e\uff0cAUSO \u5728 ALFWorld\u3001WebShop \u548c SearchQA \u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u4e86\u5206\u5e03\u5916\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Question answering (QA) over long, connected documents remains challenging because relevant evidence may span multiple entities and their relationships. Existing retrieval-augmented generation (RAG) methods typically index documents as raw chunks and retrieve them through embedding similarity. Their performance degrades when chunk boundaries separate entities from supporting evidence or when a question requires multi-hop reasoning across the corpus. We propose EnSI-RAG (Entity-Structure-Indexed Retrieval-Augmented Generation), a framework that constructs a query-independent, entity-centered index. Each record (e, t, k, v) represents an entity e, its type t, a semantic category k in {property, relation, aspect}, and a value v, while retaining links to the original source passages. At query time, these records serve as retrieval handles, and an LLM synthesizes the retrieved passages into the final answer. This design separates evidence localization from answer synthesis while preserving traceable source evidence. Across Loong and Oolong, EnSI-RAG achieves an average accuracy of 78.24. Relative to the published baseline scores used as references, this is 6.62 points higher, suggesting its effectiveness across these settings. The code is available at https://github.com/RamonMeng/EnSI-RAG.", "arxiv_id": "2608.21252", "arxiv_url": "https://arxiv.org/abs/2608.21252", "authors": ["Xuanyu Meng", "Jiashuo Sun", "Jash Rajesh Parekh", "Jiawei Han"], "brief": "EnSI-RAG \u4e3a\u957f\u6587\u6863\u95ee\u7b54\u6784\u5efa\u67e5\u8be2\u65e0\u5173\u7684\u5b9e\u4f53\u4e2d\u5fc3\u7d22\u5f15\uff0c\u7528\u5b9e\u4f53\u3001\u7c7b\u578b\u3001\u8bed\u4e49\u7c7b\u522b\u548c\u53d6\u503c\u6765\u7ec4\u7ec7\u8bc1\u636e\uff0c\u5e76\u4fdd\u7559\u5230\u539f\u6587\u7247\u6bb5\u7684\u53ef\u8ffd\u6eaf\u94fe\u63a5\u3002\u8be5\u65b9\u6cd5\u5728\u68c0\u7d22\u9636\u6bb5\u66f4\u597d\u5904\u7406\u8de8\u5b9e\u4f53\u3001\u591a\u8df3\u8bc1\u636e\u5b9a\u4f4d\uff0c\u5728 Loong \u548c Oolong \u4e0a\u5e73\u5747\u51c6\u786e\u7387\u8fbe\u5230 78.24\uff0c\u6bd4\u53c2\u8003\u57fa\u7ebf\u9ad8 6.62 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CL", "cs.AI", "cs.DB", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21252", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u957f\u6587\u6863\u95ee\u7b54", "\u4fe1\u606f\u68c0\u7d22", "\u77e5\u8bc6\u7ed3\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21252v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EnSI-RAG: Entity-Structure-Indexed Retrieval-Augmented Generation for Long-Document Question Answering", "tldr": "EnSI-RAG \u4e3a\u957f\u6587\u6863\u95ee\u7b54\u6784\u5efa\u67e5\u8be2\u65e0\u5173\u7684\u5b9e\u4f53\u4e2d\u5fc3\u7d22\u5f15\uff0c\u7528\u5b9e\u4f53\u3001\u7c7b\u578b\u3001\u8bed\u4e49\u7c7b\u522b\u548c\u53d6\u503c\u6765\u7ec4\u7ec7\u8bc1\u636e\uff0c\u5e76\u4fdd\u7559\u5230\u539f\u6587\u7247\u6bb5\u7684\u53ef\u8ffd\u6eaf\u94fe\u63a5\u3002\u8be5\u65b9\u6cd5\u5728\u68c0\u7d22\u9636\u6bb5\u66f4\u597d\u5904\u7406\u8de8\u5b9e\u4f53\u3001\u591a\u8df3\u8bc1\u636e\u5b9a\u4f4d\uff0c\u5728 Loong \u548c Oolong \u4e0a\u5e73\u5747\u51c6\u786e\u7387\u8fbe\u5230 78.24\uff0c\u6bd4\u53c2\u8003\u57fa\u7ebf\u9ad8 6.62 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sequential recommendation predicts the next item from a user\u0027s interaction history, but not every interaction is equally informative. Real logs combine persistent preferences with temporary needs, exploration, and incidental behavior, so some interactions can distort history representations or provide unreliable supervision. Existing denoising methods judge such interactions mainly from co-occurrence, order, or model predictions, without explicit evidence from relations between items. Knowledge graphs (KGs) offer this evidence, but item popularity, graph degree, uneven coverage, and widely shared entities can inflate connectivity and bias reliability estimates. Here we present AdaptedKG, which derives calibrated KG evidence for each training example without adding graph representations to the recommendation model. It first compares the observed context with structurally matched alternatives to identify relational paths that are unusually prominent and uses them to build a local KG view. It then compares each interaction with structurally matched reference items to calibrate its support within that view. The resulting retention coefficients gate historical representations and reweight target losses. All sample-specific scores are computed offline using training interactions and a fixed KG, so the backbone remains unchanged and no KG access is required at inference. Experiments show gains with a standard sequential recommender and multiple behavior-denoising sequential recommenders.", "arxiv_id": "2608.21243", "arxiv_url": "https://arxiv.org/abs/2608.21243", "authors": ["Zichun Jin", "Zihan Zhou", "Yinan Liu", "Bin Wang", "Xiaochun Yang"], "brief": "\u8bba\u6587\u63d0\u51fa AdaptedKG\uff0c\u7528\u77e5\u8bc6\u56fe\u8c31\u4e3a\u5e8f\u5217\u63a8\u8350\u4e2d\u7684\u7528\u6237\u884c\u4e3a\u53bb\u566a\u63d0\u4f9b\u6821\u51c6\u8bc1\u636e\uff0c\u800c\u4e0d\u628a\u56fe\u8868\u793a\u76f4\u63a5\u52a0\u5165\u63a8\u8350\u6a21\u578b\u3002\u65b9\u6cd5\u901a\u8fc7\u7ed3\u6784\u5339\u914d\u7684\u5bf9\u7167\u9879\u8bc6\u522b\u5f02\u5e38\u663e\u8457\u7684\u5173\u7cfb\u8def\u5f84\uff0c\u5e76\u4e3a\u5386\u53f2\u884c\u4e3a\u548c\u76ee\u6807\u635f\u5931\u751f\u6210\u4fdd\u7559\u7cfb\u6570\uff1b\u8fd9\u4e9b\u5206\u6570\u79bb\u7ebf\u8ba1\u7b97\uff0c\u63a8\u7406\u65f6\u65e0\u9700\u8bbf\u95ee\u77e5\u8bc6\u56fe\u8c31\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u63d0\u5347\u6807\u51c6\u5e8f\u5217\u63a8\u8350\u5668\u548c\u591a\u79cd\u884c\u4e3a\u53bb\u566a\u5e8f\u5217\u63a8\u8350\u65b9\u6cd5\u7684\u6548\u679c\u3002", "categories": ["cs.IR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21243", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e8f\u5217\u63a8\u8350", "\u77e5\u8bc6\u56fe\u8c31", "\u884c\u4e3a\u53bb\u566a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21243v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Adapting Knowledge Graphs for Behavior Denoising in Sequential Recommendation", "tldr": "\u8bba\u6587\u63d0\u51fa AdaptedKG\uff0c\u7528\u77e5\u8bc6\u56fe\u8c31\u4e3a\u5e8f\u5217\u63a8\u8350\u4e2d\u7684\u7528\u6237\u884c\u4e3a\u53bb\u566a\u63d0\u4f9b\u6821\u51c6\u8bc1\u636e\uff0c\u800c\u4e0d\u628a\u56fe\u8868\u793a\u76f4\u63a5\u52a0\u5165\u63a8\u8350\u6a21\u578b\u3002\u65b9\u6cd5\u901a\u8fc7\u7ed3\u6784\u5339\u914d\u7684\u5bf9\u7167\u9879\u8bc6\u522b\u5f02\u5e38\u663e\u8457\u7684\u5173\u7cfb\u8def\u5f84\uff0c\u5e76\u4e3a\u5386\u53f2\u884c\u4e3a\u548c\u76ee\u6807\u635f\u5931\u751f\u6210\u4fdd\u7559\u7cfb\u6570\uff1b\u8fd9\u4e9b\u5206\u6570\u79bb\u7ebf\u8ba1\u7b97\uff0c\u63a8\u7406\u65f6\u65e0\u9700\u8bbf\u95ee\u77e5\u8bc6\u56fe\u8c31\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u63d0\u5347\u6807\u51c6\u5e8f\u5217\u63a8\u8350\u5668\u548c\u591a\u79cd\u884c\u4e3a\u53bb\u566a\u5e8f\u5217\u63a8\u8350\u65b9\u6cd5\u7684\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The Traveling Salesman Problem (TSP) is one of the most extensively studied NP-hard optimization problems. Genetic Algorithm (GA)-based solvers, such as the Edge Assembly Crossover (EAX), achieve state-of-the-art performance on many benchmark instances. However, the scalability of these approaches in massively parallel architectures remains limited because crossover operations involve irregular memory access patterns, graph traversals, and sequential dependencies. Existing GPU-based TSP solvers primarily exploit population-level parallelism and are limited to relatively small problem sizes. This work presents a fine-grain GPU implementation of the partition phase of the Generalized Partition Crossover (GPX) operator for large-scale TSP instances. The proposed approach reformulates GPX partitioning as a graph-parallel problem using coalesced memory layouts, ghost-node transformations, and connected-component analysis. The im- plementation parallelizes the union of parent tours, the splitting of degree- four vertices, the deletion of common edges, and the identification of recombining components using CUDA. Experimental results on instances ranging from 10,000 to 2 million cities demonstrate substantial acceleration over a naive sequential CPU imple- mentation. The proposed GPU partitioning achieves speedups between 48x and 625x while significantly reducing memory overhead. The re- sults demonstrate that operator-level parallelism can substantially im- prove the scalability of GA-based TSP solvers on modern many-core architectures.", "arxiv_id": "2608.21233", "arxiv_url": "https://arxiv.org/abs/2608.21233", "authors": ["Swetha Varadarajan", "Darrell Whitley"], "brief": "\u672c\u6587\u5c06\u5927\u89c4\u6a21\u65c5\u884c\u5546\u95ee\u9898\u4e2d\u5e7f\u4e49\u5206\u533a\u4ea4\u53c9\uff08GPX\uff09\u7684\u5206\u533a\u9636\u6bb5\u6539\u5199\u4e3a\u56fe\u5e76\u884c\u4efb\u52a1\uff0c\u5e76\u7528 CUDA \u5728 GPU \u4e0a\u7ec6\u7c92\u5ea6\u5e76\u884c\u5316\u3002\u5b9e\u9a8c\u8986\u76d6 1 \u4e07\u5230 200 \u4e07\u57ce\u5e02\u5b9e\u4f8b\uff0c\u76f8\u6bd4\u6734\u7d20 CPU \u987a\u5e8f\u5b9e\u73b0\u83b7\u5f97 48 \u5230 625 \u500d\u52a0\u901f\uff0c\u5e76\u964d\u4f4e\u5185\u5b58\u5f00\u9500\uff0c\u63d0\u5347\u4e86\u9057\u4f20\u7b97\u6cd5\u6c42\u89e3\u5668\u7684\u53ef\u6269\u5c55\u6027\u3002", "categories": ["cs.AI", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21233", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ec4\u5408\u4f18\u5316", "GPU\u5e76\u884c", "\u9057\u4f20\u7b97\u6cd5", "\u65c5\u884c\u5546\u95ee\u9898"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21233v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Fine-Grain GPU Parallelization of the Generalized Partition Crossover for Large-Scale Traveling Salesman Problems", "tldr": "\u672c\u6587\u5c06\u5927\u89c4\u6a21\u65c5\u884c\u5546\u95ee\u9898\u4e2d\u5e7f\u4e49\u5206\u533a\u4ea4\u53c9\uff08GPX\uff09\u7684\u5206\u533a\u9636\u6bb5\u6539\u5199\u4e3a\u56fe\u5e76\u884c\u4efb\u52a1\uff0c\u5e76\u7528 CUDA \u5728 GPU \u4e0a\u7ec6\u7c92\u5ea6\u5e76\u884c\u5316\u3002\u5b9e\u9a8c\u8986\u76d6 1 \u4e07\u5230 200 \u4e07\u57ce\u5e02\u5b9e\u4f8b\uff0c\u76f8\u6bd4\u6734\u7d20 CPU \u987a\u5e8f\u5b9e\u73b0\u83b7\u5f97 48 \u5230 625 \u500d\u52a0\u901f\uff0c\u5e76\u964d\u4f4e\u5185\u5b58\u5f00\u9500\uff0c\u63d0\u5347\u4e86\u9057\u4f20\u7b97\u6cd5\u6c42\u89e3\u5668\u7684\u53ef\u6269\u5c55\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Persistent memory makes false information durable: once a false statement is stored, it can be retrieved into future sessions that match it. We measure the cost of this failure mode using plainly worded false assertions generated in a single pass, with no instruction, trigger, or retriever optimization. Poisoning 1.2% of a LongMemEval corpus reduces accuracy from 0.850 to 0.300. A four-stage write-time screening pipeline that reaches 0.832 recall on indirect prompt injection while flagging 1.5% of trigger-word-laden benign text rejects 0 of 360 poisoned memories. We argue this exposes a boundary of content-only screening: distinguishing a false assertion from a true one generally requires external grounding beyond the text itself. We then evaluate provenance-weighted retrieval. The shipped weight is statistically indistinguishable from no defense (p=0.80), while a stronger weight recovers utility only by excluding untrusted content. In a mixed-provenance corpus where untrusted content is mostly benign, accuracy rises from 0.3167 to 0.7000; when the answer-bearing evidence itself arrives untrusted, evidence recall falls to zero and accuracy to 0.0417. Under the measured similarity regime, the additive provenance term has no usable setting: a weight strong enough to resist query-shaped poison is also strong enough to suppress legitimate untrusted evidence. We therefore argue for bounded occupancy constraints at retrieval rather than additive provenance penalties, and release the harnesses, corpora, and aggregate run reports.", "arxiv_id": "2608.21230", "arxiv_url": "https://arxiv.org/abs/2608.21230", "authors": ["Arulnidhi Karunanidhi"], "brief": "\u8bba\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u667a\u80fd\u4f53\u6301\u4e45\u8bb0\u5fc6\u4e2d\u7684\u6295\u6bd2\u98ce\u9669\uff1a\u4ec5\u6c61\u67d3 LongMemEval \u8bed\u6599 1.2% \u7684\u6734\u7d20\u865a\u5047\u65ad\u8a00\uff0c\u5c31\u53ef\u4f7f\u51c6\u786e\u7387\u4ece 0.850 \u964d\u81f3 0.300\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u57fa\u4e8e\u5185\u5bb9\u7684\u5199\u5165\u7b5b\u67e5\u51e0\u4e4e\u65e0\u6cd5\u8bc6\u522b\u8fd9\u7c7b\u865a\u5047\u8bb0\u5fc6\uff0c\u6765\u6e90\u52a0\u6743\u68c0\u7d22\u4e5f\u96be\u4ee5\u5728\u62b5\u6297\u6295\u6bd2\u548c\u4fdd\u7559\u53ef\u4fe1\u4f46\u672a\u8ba4\u8bc1\u8bc1\u636e\u4e4b\u95f4\u53d6\u5f97\u53ef\u7528\u5e73\u8861\u3002\u4f5c\u8005\u4e3b\u5f20\u7528\u68c0\u7d22\u9636\u6bb5\u7684\u5360\u7528\u7ea6\u675f\u66ff\u4ee3\u7b80\u5355\u7684\u6765\u6e90\u60e9\u7f5a\uff0c\u5e76\u5f00\u6e90\u8bc4\u6d4b\u5de5\u5177\u4e0e\u6570\u636e\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21230", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u6295\u6bd2", "\u5185\u5bb9\u5b89\u5168", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21230v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Utility Under Attack: Agent Memory Poisoning and the Limits of Content Screening and Provenance Ranking", "tldr": "\u8bba\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u667a\u80fd\u4f53\u6301\u4e45\u8bb0\u5fc6\u4e2d\u7684\u6295\u6bd2\u98ce\u9669\uff1a\u4ec5\u6c61\u67d3 LongMemEval \u8bed\u6599 1.2% \u7684\u6734\u7d20\u865a\u5047\u65ad\u8a00\uff0c\u5c31\u53ef\u4f7f\u51c6\u786e\u7387\u4ece 0.850 \u964d\u81f3 0.300\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u57fa\u4e8e\u5185\u5bb9\u7684\u5199\u5165\u7b5b\u67e5\u51e0\u4e4e\u65e0\u6cd5\u8bc6\u522b\u8fd9\u7c7b\u865a\u5047\u8bb0\u5fc6\uff0c\u6765\u6e90\u52a0\u6743\u68c0\u7d22\u4e5f\u96be\u4ee5\u5728\u62b5\u6297\u6295\u6bd2\u548c\u4fdd\u7559\u53ef\u4fe1\u4f46\u672a\u8ba4\u8bc1\u8bc1\u636e\u4e4b\u95f4\u53d6\u5f97\u53ef\u7528\u5e73\u8861\u3002\u4f5c\u8005\u4e3b\u5f20\u7528\u68c0\u7d22\u9636\u6bb5\u7684\u5360\u7528\u7ea6\u675f\u66ff\u4ee3\u7b80\u5355\u7684\u6765\u6e90\u60e9\u7f5a\uff0c\u5e76\u5f00\u6e90\u8bc4\u6d4b\u5de5\u5177\u4e0e\u6570\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recently, there has been a great deal of research into improving AI methods and their application. The main focus is on tracking progress, enabling transparent comparisons, and fostering a more profound understanding of AI. In that process, different organizations generate and use plenty of assets that need to be tracked, traced and managed. Moreover, it is important to discover assets relevant for the task at hand. This paper presents research aiming to contribute to answering the question of what is required to exchange and manage AI models and related assets effectively without semantic gaps in an industrial context. We introduce a platform for AI model exchange, which facilitates the usage, exchange, and analysis of AI models and datasets. The platform incorporates an ontology that can foster a more profound common understanding of what is required in these tasks and help tackle the issues mentioned above. Finally, we elucidate the utility of the platform through the illustration of a use case in the context of real-time critical systems.", "arxiv_id": "2608.21224", "arxiv_url": "https://arxiv.org/abs/2608.21224", "authors": ["Jan Novacek", "Ali Ahari", "Tobias M\u00fcller", "Sebastian Reiter", "Alexander Viehl", "Oliver Bringmann"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u5de5\u4e1a\u573a\u666f\u7684 AI \u6a21\u578b\u4e0e\u6570\u636e\u96c6\u4ea4\u6362\u7ba1\u7406\u5e73\u53f0\uff0c\u7528\u672c\u4f53\u6765\u7edf\u4e00\u63cf\u8ff0\u6a21\u578b\u3001\u6570\u636e\u96c6\u53ca\u76f8\u5173\u8d44\u4ea7\uff0c\u51cf\u5c11\u8bed\u4e49\u4e0d\u4e00\u81f4\u3002\u8be5\u5e73\u53f0\u652f\u6301\u8d44\u4ea7\u8ffd\u8e2a\u3001\u53d1\u73b0\u3001\u4ea4\u6362\u4e0e\u5206\u6790\uff0c\u5e76\u901a\u8fc7\u5b9e\u65f6\u5173\u952e\u7cfb\u7edf\u7528\u4f8b\u5c55\u793a\u5176\u53ef\u7528\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21224", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u672c\u4f53", "\u6a21\u578b\u7ba1\u7406", "\u6570\u636e\u96c6\u7ba1\u7406", "\u5de5\u4e1aAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21224v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ontology-supported AI Model and Dataset Management", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u5de5\u4e1a\u573a\u666f\u7684 AI \u6a21\u578b\u4e0e\u6570\u636e\u96c6\u4ea4\u6362\u7ba1\u7406\u5e73\u53f0\uff0c\u7528\u672c\u4f53\u6765\u7edf\u4e00\u63cf\u8ff0\u6a21\u578b\u3001\u6570\u636e\u96c6\u53ca\u76f8\u5173\u8d44\u4ea7\uff0c\u51cf\u5c11\u8bed\u4e49\u4e0d\u4e00\u81f4\u3002\u8be5\u5e73\u53f0\u652f\u6301\u8d44\u4ea7\u8ffd\u8e2a\u3001\u53d1\u73b0\u3001\u4ea4\u6362\u4e0e\u5206\u6790\uff0c\u5e76\u901a\u8fc7\u5b9e\u65f6\u5173\u952e\u7cfb\u7edf\u7528\u4f8b\u5c55\u793a\u5176\u53ef\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Predictive political question answering (QA), such as predicting how a political actor will vote, goes beyond factual lookup. External political resources offer rich historical evidence, but rarely contain the answer itself. Existing LLM augmentation methods, including actor-profile-based simulation and knowledge graph evidence injection, improve political reasoning but largely treat external resources as knowledge-based evidence, leaving prediction-relevant signals under-modeled. We identify two complementary signals for predictive political QA: actor stances that capture issue-specific preferences, and high-order structure signals that capture indirect dependencies among political actors. We propose PSL, a dual-view framework that converts semi-structured political records into inference-oriented evidence for LLMs. PSL extracts stance signals from question-relevant actor records in a semantic view, and learns structure-aware actor representations from an actor interaction graph in a vector view. Across three real-world datasets and multiple LLMs, PSL consistently outperforms baselines, with ablations confirming the complementary gains of stance and structure signals.", "arxiv_id": "2608.21218", "arxiv_url": "https://arxiv.org/abs/2608.21218", "authors": ["Yinan Liu", "Zihan Zhou", "Zichun Jin", "Xinyu Wang", "Bin Wang", "Xiaochun Yang"], "brief": "\u8bba\u6587\u9762\u5411\u9884\u6d4b\u578b\u653f\u6cbb\u95ee\u7b54\uff0c\u63d0\u51fa PSL \u6846\u67b6\uff0c\u5c06\u534a\u7ed3\u6784\u5316\u653f\u6cbb\u8bb0\u5f55\u8f6c\u5316\u4e3a\u66f4\u9002\u5408 LLM \u63a8\u7406\u7684\u8bc1\u636e\u3002\u5b83\u540c\u65f6\u63d0\u53d6\u653f\u6cbb\u4eba\u7269\u7684\u8bae\u9898\u7acb\u573a\u4fe1\u53f7\uff0c\u5e76\u4ece\u4e92\u52a8\u56fe\u4e2d\u5b66\u4e60\u9ad8\u9636\u7ed3\u6784\u8868\u793a\uff0c\u5728\u4e09\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u548c\u591a\u4e2a LLM \u4e0a\u7a33\u5b9a\u4f18\u4e8e\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21218", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u95ee\u7b54\u7cfb\u7edf", "\u77e5\u8bc6\u589e\u5f3a", "\u56fe\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21218v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Enhancing LLMs in Predictive Political QA with Semi-Structured Data", "tldr": "\u8bba\u6587\u9762\u5411\u9884\u6d4b\u578b\u653f\u6cbb\u95ee\u7b54\uff0c\u63d0\u51fa PSL \u6846\u67b6\uff0c\u5c06\u534a\u7ed3\u6784\u5316\u653f\u6cbb\u8bb0\u5f55\u8f6c\u5316\u4e3a\u66f4\u9002\u5408 LLM \u63a8\u7406\u7684\u8bc1\u636e\u3002\u5b83\u540c\u65f6\u63d0\u53d6\u653f\u6cbb\u4eba\u7269\u7684\u8bae\u9898\u7acb\u573a\u4fe1\u53f7\uff0c\u5e76\u4ece\u4e92\u52a8\u56fe\u4e2d\u5b66\u4e60\u9ad8\u9636\u7ed3\u6784\u8868\u793a\uff0c\u5728\u4e09\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u548c\u591a\u4e2a LLM \u4e0a\u7a33\u5b9a\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper investigates cross-agent specification portability using Oracle-to-PostgreSQL migration as a controlled software transformation task. The study combines two experimental stages. First, a specification-first migration pipeline was evaluated on 1,006 PL/SQL files, of which 623 were successfully regenerated and 380 generated scripts executed successfully in PostgreSQL 16. Second, cross-agent experiments were conducted on a dataset of 1,802 Oracle scripts with corresponding PostgreSQL implementations using Amazon Kiro, Google Gemini, and GitHub Copilot, with Claude Code and Cursor included in the initial single-agent evaluation. Native and foreign specifications were assessed using Token F1, exact match, SQL syntax validity, AST exact match, AST mean similarity, and immediate runnability. The results show that specification size alone does not predict implementation quality and that cross-agent transfer can produce substantial agent-dependent degradation. The strongest replicated case occurred when Gemini directly consumed a Kiro-origin specification, producing a Token F1 of 0.035, SQL syntax validity of 2.33%, and AST mean similarity of 0.015. Rewriting substantially improved Gemini in the tested configuration, compression did not provide a universal benefit, and retrieval-augmented ingestion was the only common strategy represented on the per-agent Pareto frontiers of both Gemini and Copilot. The findings suggest that specifications in heterogeneous SDD workflows should not automatically be treated as agent-neutral artifacts and motivate explicit consideration of specification portability, agent-specific interpretation, and retrieval-based access in multi-agent software engineering.", "arxiv_id": "2608.21208", "arxiv_url": "https://arxiv.org/abs/2608.21208", "authors": ["Oleg Grynets", "Oleksii Ilchuk", "Dariia Zatulna", "Vasyl Lyashkevych"], "brief": "\u672c\u6587\u4ee5 Oracle \u5230 PostgreSQL \u8fc1\u79fb\u4e3a\u4efb\u52a1\uff0c\u7814\u7a76\u89c4\u683c\u8bf4\u660e\u5728\u4e0d\u540c LLM \u5f00\u53d1\u667a\u80fd\u4f53\u4e4b\u95f4\u7684\u53ef\u79fb\u690d\u6027\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u89c4\u683c\u5927\u5c0f\u4e0d\u80fd\u9884\u6d4b\u4ee3\u7801\u751f\u6210\u8d28\u91cf\uff0c\u8de8\u667a\u80fd\u4f53\u590d\u7528\u89c4\u683c\u4f1a\u51fa\u73b0\u660e\u663e\u6027\u80fd\u9000\u5316\uff1b\u91cd\u5199\u89c4\u683c\u548c\u68c0\u7d22\u589e\u5f3a\u8bbf\u95ee\u5728\u90e8\u5206\u573a\u666f\u80fd\u6539\u5584\u6548\u679c\u3002", "categories": ["cs.SE", "cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21208", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u4ee3\u7801\u751f\u6210", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21208v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Specification Portability Across LLM Development Agents: Cross-Agent Compatibility in Specification-Driven Software Migration", "tldr": "\u672c\u6587\u4ee5 Oracle \u5230 PostgreSQL \u8fc1\u79fb\u4e3a\u4efb\u52a1\uff0c\u7814\u7a76\u89c4\u683c\u8bf4\u660e\u5728\u4e0d\u540c LLM \u5f00\u53d1\u667a\u80fd\u4f53\u4e4b\u95f4\u7684\u53ef\u79fb\u690d\u6027\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u89c4\u683c\u5927\u5c0f\u4e0d\u80fd\u9884\u6d4b\u4ee3\u7801\u751f\u6210\u8d28\u91cf\uff0c\u8de8\u667a\u80fd\u4f53\u590d\u7528\u89c4\u683c\u4f1a\u51fa\u73b0\u660e\u663e\u6027\u80fd\u9000\u5316\uff1b\u91cd\u5199\u89c4\u683c\u548c\u68c0\u7d22\u589e\u5f3a\u8bbf\u95ee\u5728\u90e8\u5206\u573a\u666f\u80fd\u6539\u5584\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Imputing physiological time series (arterial blood pressure, blood glucose, etc.) is essential for addressing the missingness that pervades clinical data. Yet modern imputation methods perform poorly in this domain: a recent benchmark found that simple linear interpolation outperformed every learned imputer on real-world clinical signals with realistic gaps. We show that this reflects two properties of physiological missingness that generic imputers ignore: gaps may occur when the signal is clinically extreme rather than typical, and gap lengths can easily span orders of magnitude. To this end, we introduce Curriculum-Aware Interpolate-then-Refine (CAIR), a two-stage framework for physiological time-series imputation. Our key motivation is to learn a coarse base curve and then repeatedly correct it toward physiological realism, rather than predict a gap in a single pass. Consequently, CAIR couples a bidirectional-GRU interpolator with a Transformer refiner that corrects its own estimate over three successive passes, trained jointly under a broad, signal-agnostic random-gap curriculum. We evaluate imputers stratified by gap length and missingness mechanism (MCAR, MAR, NMAR) rather than by a single average, and CAIR is the most accurate under every mechanism on continuous glucose monitoring (AI-READI) and arterial pressure in intensive care (MIMIC-III). Its margin over the strongest baseline grows with difficulty, from 9% under MCAR to 19% under value-dependent dropout, where generic learned imputers are weakest. We further show low reconstruction error alone does not recover the burden metrics clinicians act on: interpolants matching CAIR\u0027s error fail to preserve those metrics, imputers that recover them are far less accurate, and CAIR alone ranks among the best on both axes.", "arxiv_id": "2608.21207", "arxiv_url": "https://arxiv.org/abs/2608.21207", "authors": ["Yu-Chao Huang", "Haochen Zhang", "Nicholas Konz", "Tianlong Chen"], "brief": "\u8bba\u6587\u63d0\u51fa CAIR\uff0c\u4e00\u79cd\u9762\u5411\u751f\u7406\u65f6\u95f4\u5e8f\u5217\u7f3a\u5931\u586b\u8865\u7684\u201c\u4e24\u9636\u6bb5\u63d2\u503c\u518d\u7cbe\u4fee\u201d\u6846\u67b6\uff1a\u5148\u7528\u53cc\u5411 GRU \u5b66\u7c97\u7565\u66f2\u7ebf\uff0c\u518d\u7528 Transformer \u591a\u8f6e\u81ea\u6211\u4fee\u6b63\uff0c\u5e76\u901a\u8fc7\u968f\u673a\u7f3a\u53e3\u8bfe\u7a0b\u5b66\u4e60\u9002\u914d\u4e0d\u540c\u957f\u5ea6\u548c\u673a\u5236\u7684\u7f3a\u5931\u3002\u5728\u8fde\u7eed\u8840\u7cd6\u548c ICU \u52a8\u8109\u538b\u6570\u636e\u4e0a\uff0cCAIR \u5728 MCAR\u3001MAR\u3001NMAR \u7b49\u673a\u5236\u4e0b\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u4e14\u5728\u503c\u76f8\u5173\u7f3a\u5931\u7b49\u56f0\u96be\u573a\u666f\u4e2d\u4f18\u52bf\u66f4\u5927\uff0c\u540c\u65f6\u66f4\u597d\u4fdd\u7559\u4e34\u5e8a\u8d1f\u62c5\u6307\u6807\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21207", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u533b\u7597AI", "\u7f3a\u5931\u503c\u586b\u8865", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21207v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Curriculum-Aware Interpolate-then-Refine: Learned Physiological Time-Series Imputation under Realistic Missingness", "tldr": "\u8bba\u6587\u63d0\u51fa CAIR\uff0c\u4e00\u79cd\u9762\u5411\u751f\u7406\u65f6\u95f4\u5e8f\u5217\u7f3a\u5931\u586b\u8865\u7684\u201c\u4e24\u9636\u6bb5\u63d2\u503c\u518d\u7cbe\u4fee\u201d\u6846\u67b6\uff1a\u5148\u7528\u53cc\u5411 GRU \u5b66\u7c97\u7565\u66f2\u7ebf\uff0c\u518d\u7528 Transformer \u591a\u8f6e\u81ea\u6211\u4fee\u6b63\uff0c\u5e76\u901a\u8fc7\u968f\u673a\u7f3a\u53e3\u8bfe\u7a0b\u5b66\u4e60\u9002\u914d\u4e0d\u540c\u957f\u5ea6\u548c\u673a\u5236\u7684\u7f3a\u5931\u3002\u5728\u8fde\u7eed\u8840\u7cd6\u548c ICU \u52a8\u8109\u538b\u6570\u636e\u4e0a\uff0cCAIR \u5728 MCAR\u3001MAR\u3001NMAR \u7b49\u673a\u5236\u4e0b\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u4e14\u5728\u503c\u76f8\u5173\u7f3a\u5931\u7b49\u56f0\u96be\u573a\u666f\u4e2d\u4f18\u52bf\u66f4\u5927\uff0c\u540c\u65f6\u66f4\u597d\u4fdd\u7559\u4e34\u5e8a\u8d1f\u62c5\u6307\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Person names are widely used as prompt variables in LLM evaluations of factuality, privacy leakage, bias and abstention, but when a name\u0027s evidential status is uncontrolled, measurements may conflate memorisation, retrieval, name priors and wrong-person attribution. We operationalise an unknown name as one with plausible First-Last form, no indexed full-name evidence, and no ambiguity signals under a documented validation run, and introduce PUN (Plausible Unknown Names), a protocol for constructing and validating such names, combining Wikidata-derived components, web-enabled LLM screening, and controlled search revalidation. We report acceptance rate, reproducibility, ablations, and a 204-participant human study, finding accepted names are more name-like than controls while participants recover person evidence in only 3% of cases. We release 300 names with comparison controls.", "arxiv_id": "2608.21206", "arxiv_url": "https://arxiv.org/abs/2608.21206", "authors": ["Dimitri Staufer", "David Hartmann", "Ibrahim Baroud"], "brief": "\u672c\u6587\u63d0\u51fa PUN\uff08Plausible Unknown Names\uff09\uff0c\u7528\u4e8e\u6784\u9020\u548c\u9a8c\u8bc1\u201c\u770b\u8d77\u6765\u50cf\u771f\u4eba\u4f46\u7f3a\u4e4f\u53ef\u68c0\u7d22\u8bc1\u636e\u201d\u7684\u672a\u77e5\u4eba\u540d\uff0c\u4ee5\u6539\u8fdb\u5927\u6a21\u578b\u5728\u4e8b\u5b9e\u6027\u3001\u9690\u79c1\u6cc4\u9732\u3001\u504f\u89c1\u548c\u62d2\u7b54\u7b49\u8bc4\u6d4b\u4e2d\u7684\u4eba\u540d\u53d8\u91cf\u63a7\u5236\u3002\u5b9e\u9a8c\u4e0e204\u4eba\u7814\u7a76\u663e\u793a\uff0c\u7b5b\u9009\u51fa\u7684\u4eba\u540d\u6bd4\u5bf9\u7167\u66f4\u50cf\u771f\u5b9e\u59d3\u540d\uff0c\u4f46\u4ec5\u7ea63%\u80fd\u88ab\u53c2\u4e0e\u8005\u627e\u5230\u4eba\u7269\u8bc1\u636e\uff0c\u5e76\u53d1\u5e03\u4e86300\u4e2a\u540d\u79f0\u53ca\u5bf9\u7167\u96c6\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21206", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6", "\u9690\u79c1", "\u6570\u636e\u6784\u9020"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21206v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "No PUN Intended: Plausible Unknown Names for Person-Centred LLM Evaluation", "tldr": "\u672c\u6587\u63d0\u51fa PUN\uff08Plausible Unknown Names\uff09\uff0c\u7528\u4e8e\u6784\u9020\u548c\u9a8c\u8bc1\u201c\u770b\u8d77\u6765\u50cf\u771f\u4eba\u4f46\u7f3a\u4e4f\u53ef\u68c0\u7d22\u8bc1\u636e\u201d\u7684\u672a\u77e5\u4eba\u540d\uff0c\u4ee5\u6539\u8fdb\u5927\u6a21\u578b\u5728\u4e8b\u5b9e\u6027\u3001\u9690\u79c1\u6cc4\u9732\u3001\u504f\u89c1\u548c\u62d2\u7b54\u7b49\u8bc4\u6d4b\u4e2d\u7684\u4eba\u540d\u53d8\u91cf\u63a7\u5236\u3002\u5b9e\u9a8c\u4e0e204\u4eba\u7814\u7a76\u663e\u793a\uff0c\u7b5b\u9009\u51fa\u7684\u4eba\u540d\u6bd4\u5bf9\u7167\u66f4\u50cf\u771f\u5b9e\u59d3\u540d\uff0c\u4f46\u4ec5\u7ea63%\u80fd\u88ab\u53c2\u4e0e\u8005\u627e\u5230\u4eba\u7269\u8bc1\u636e\uff0c\u5e76\u53d1\u5e03\u4e86300\u4e2a\u540d\u79f0\u53ca\u5bf9\u7167\u96c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Technology change management in large financial institutions depends on risk assessments that are accurate, consistent, and auditable. In practice, many institutions still rely on self-reported questionnaires. Those questionnaires are subjective, easy to game, and poor at separating routine changes from the ones that later trigger major incidents. This paper presents SENTRY, a risk assessment platform that replaces questionnaire-based scoring with a deterministic machine learning pipeline built from gradient-boosted decision trees (XGBoost) and hybrid retrieval-augmented generation (RAG). The system combines structured operational metadata, application dependency graphs, and historical incident records with a hybrid semantic and lexical search over historical change requests. The retrieval step captures the risk signal in unstructured change request text, then compresses that signal into a single scalar feature before model inference. That design keeps the model deterministic and preserves per-prediction explainability via SHAP values. Evaluated on enterprise-scale change data, SENTRY achieves a ROC AUC of 0.87 and 85% overall accuracy, and it detects high-risk changes at roughly 3.25 times the rate of the existing process. We close by examining the architectural trade-offs behind this design and what they imply for the use of machine learning in regulated change management.", "arxiv_id": "2608.21203", "arxiv_url": "https://arxiv.org/abs/2608.21203", "authors": ["Daniel Arulpragasam", "Christer Henrysson", "Ella Ly", "Deepika Anbalagan", "Leo Feng"], "brief": "\u672c\u6587\u63d0\u51fa SENTRY\uff0c\u7528 XGBoost \u4e0e\u6df7\u5408 RAG \u66ff\u4ee3\u91d1\u878d\u673a\u6784 IT \u53d8\u66f4\u7ba1\u7406\u4e2d\u7684\u4e3b\u89c2\u95ee\u5377\u5f0f\u98ce\u9669\u8bc4\u5206\u3002\u7cfb\u7edf\u878d\u5408\u7ed3\u6784\u5316\u8fd0\u7ef4\u5143\u6570\u636e\u3001\u4f9d\u8d56\u56fe\u3001\u5386\u53f2\u4e8b\u6545\u548c\u53d8\u66f4\u6587\u672c\u68c0\u7d22\u4fe1\u53f7\uff0c\u5728\u4fdd\u6301\u786e\u5b9a\u6027\u4e0e SHAP \u53ef\u89e3\u91ca\u6027\u7684\u540c\u65f6\uff0c\u8fbe\u5230 0.87 ROC AUC \u548c 85% \u51c6\u786e\u7387\uff0c\u9ad8\u98ce\u9669\u53d8\u66f4\u68c0\u51fa\u7387\u7ea6\u4e3a\u73b0\u6709\u6d41\u7a0b\u7684 3.25 \u500d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21203", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u98ce\u9669\u8bc4\u4f30", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u673a\u5668\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21203v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SENTRY: Deterministic, Intelligent Risk Assessment for IT Change Management", "tldr": "\u672c\u6587\u63d0\u51fa SENTRY\uff0c\u7528 XGBoost \u4e0e\u6df7\u5408 RAG \u66ff\u4ee3\u91d1\u878d\u673a\u6784 IT \u53d8\u66f4\u7ba1\u7406\u4e2d\u7684\u4e3b\u89c2\u95ee\u5377\u5f0f\u98ce\u9669\u8bc4\u5206\u3002\u7cfb\u7edf\u878d\u5408\u7ed3\u6784\u5316\u8fd0\u7ef4\u5143\u6570\u636e\u3001\u4f9d\u8d56\u56fe\u3001\u5386\u53f2\u4e8b\u6545\u548c\u53d8\u66f4\u6587\u672c\u68c0\u7d22\u4fe1\u53f7\uff0c\u5728\u4fdd\u6301\u786e\u5b9a\u6027\u4e0e SHAP \u53ef\u89e3\u91ca\u6027\u7684\u540c\u65f6\uff0c\u8fbe\u5230 0.87 ROC AUC \u548c 85% \u51c6\u786e\u7387\uff0c\u9ad8\u98ce\u9669\u53d8\u66f4\u68c0\u51fa\u7387\u7ea6\u4e3a\u73b0\u6709\u6d41\u7a0b\u7684 3.25 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Objective: Cochlear implants (CIs) are bionic prostheses that restores hearing via electrical stimulation of the auditory nerve. Hybrid CIs, which use electroacoustic stimulation (EAS), combine residual low-frequency acoustic hearing with CI electrical stimulation. Intracochlear fibrosis, which forms in response to the presence of the implant, may impede residual hearing function and gradually reduce the efficacy of EAS. It is therefore a translational objective to study the formation of cochlear fibrosis in rodents, with the goal of reducing fibrotic burden and improving outcomes for CI patients. Methods: We generate and annotate a novel dataset of optical coherence tomography (OCT) images from chronically implanted guinea pigs as part of an ongoing study focused on implant induced fibrosis. Objectively assessing fibrotic burden in this model, with high resolution and repeatability, presents an obvious use case for computer vision methods. Results: We present the results of several state-of-the-art semantic segmentation models and compare their efficacy for identifying cochlear fibrosis and other relevant annotations, using a new library of manually segmented OCT images. Conclusions: We find that the best performance is achieved by using a modified version of the well-known UNET architecture (which we term 2D-OCT-UNET) that operates on the upscaled OCT input resolution. Significance: For the first time, we have successfully applied computer vision techniques to an OCT dataset of implanted cochleae with fibrosis. Using this deep learning model, the cochlear fibrotic burden calculation can be reliably carried out as we verify in our experimental section. The dataset and the project code are available at: https://github.com/juliadietlmeier/CF-OCT-segmentation", "arxiv_id": "2608.21189", "arxiv_url": "https://arxiv.org/abs/2608.21189", "authors": ["Julia Dietlmeier", "Benjamin Greenberg", "Wenxuan He", "Teresa Wilson", "Rubing Xing", "Jordan Hill", "Adrienne Fettig", "Madeline Otto", "Teyhana Rounsavill", "Lina A. J. Reiss", "Jingang Yi", "Noel E. O\u0027Connor", "George W. S. Burwood"], "brief": "\u8bba\u6587\u6784\u5efa\u5e76\u6807\u6ce8\u4e86\u4e00\u4e2a\u690d\u5165\u8c5a\u9f20\u8033\u8717\u7684OCT\u56fe\u50cf\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u91cf\u5316\u4eba\u5de5\u8033\u8717\u690d\u5165\u540e\u5f62\u6210\u7684\u7ea4\u7ef4\u5316\u7ec4\u7ec7\u3002\u4f5c\u8005\u6bd4\u8f83\u591a\u79cd\u8bed\u4e49\u5206\u5272\u6a21\u578b\uff0c\u53d1\u73b0\u6539\u8fdb\u76842D-OCT-UNET\u5728\u9ad8\u5206\u8fa8\u7387\u8f93\u5165\u4e0b\u6548\u679c\u6700\u597d\uff0c\u53ef\u53ef\u9760\u8ba1\u7b97\u8033\u8717\u7ea4\u7ef4\u5316\u8d1f\u62c5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21189", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u8bed\u4e49\u5206\u5272", "OCT", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21189v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Investigating Residual Hearing Loss: Quantification of Fibrosis in a Novel Cochlear OCT Dataset", "tldr": "\u8bba\u6587\u6784\u5efa\u5e76\u6807\u6ce8\u4e86\u4e00\u4e2a\u690d\u5165\u8c5a\u9f20\u8033\u8717\u7684OCT\u56fe\u50cf\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u91cf\u5316\u4eba\u5de5\u8033\u8717\u690d\u5165\u540e\u5f62\u6210\u7684\u7ea4\u7ef4\u5316\u7ec4\u7ec7\u3002\u4f5c\u8005\u6bd4\u8f83\u591a\u79cd\u8bed\u4e49\u5206\u5272\u6a21\u578b\uff0c\u53d1\u73b0\u6539\u8fdb\u76842D-OCT-UNET\u5728\u9ad8\u5206\u8fa8\u7387\u8f93\u5165\u4e0b\u6548\u679c\u6700\u597d\uff0c\u53ef\u53ef\u9760\u8ba1\u7b97\u8033\u8717\u7ea4\u7ef4\u5316\u8d1f\u62c5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pairwise reciprocal matrices are fundamental to the Analytic Hierarchy Process (AHP), a decision-making model. While the Direct Least Squares (DLS) method provides an intuitive mechanism for deriving priority vectors without complex transformations, the DLS provides multiple solutions. Under high levels of inconsistency, such as cyclic contradictions, this non-convexity yields multiple distinct global minima, resulting in unstable priority rankings that critically depend on initial algorithmic guesses. To overcome this structural deficiency, this paper introduces the Anchored Regularized Direct Least Squares (ARDLS) optimization model. ARDLS integrates uniquely determined established prioritization operators, such as normalization techniques, the Eigenvector method, Singular Value Decomposition, Cosine Maximization, and the Pseudo-Inverse Gram Matrix (the closed-form solution of Weighted Least Squares), as theoretical anchors within a regularization penalty. This integration systematically breaks mathematical symmetries, tilting the optimization landscape to guarantee convergence upon a single, unique global minimum. Comprehensive numerical experiments and simulations validate that the ARDLS framework successfully reduces root mean square error among established priority operators, while guaranteeing strict mathematical uniqueness. The proposed ARDLS may be the ideal alternative for the AHP applied to many application domains.", "arxiv_id": "2608.21187", "arxiv_url": "https://arxiv.org/abs/2608.21187", "authors": ["Kevin Kam Fung Yuen"], "brief": "\u672c\u6587\u63d0\u51fa ARDLS \u4f18\u5316\u6a21\u578b\uff0c\u7528\u6b63\u5219\u5316\u628a\u7279\u5f81\u5411\u91cf\u6cd5\u3001SVD\u3001\u4f59\u5f26\u6700\u5927\u5316\u7b49\u5df2\u6709\u4f18\u5148\u7ea7\u7b97\u5b50\u4f5c\u4e3a\u201c\u951a\u70b9\u201d\uff0c\u89e3\u51b3 AHP \u4e2d\u76f4\u63a5\u6700\u5c0f\u4e8c\u4e58\u6cd5\u5728\u9ad8\u4e0d\u4e00\u81f4\u77e9\u9635\u4e0b\u591a\u89e3\u3001\u6392\u5e8f\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\u3002\u6570\u503c\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u4fdd\u8bc1\u552f\u4e00\u5168\u5c40\u6700\u4f18\uff0c\u5e76\u964d\u4f4e\u4e0d\u540c\u4f18\u5148\u7ea7\u7b97\u5b50\u4e4b\u95f4\u7684\u5747\u65b9\u6839\u8bef\u5dee\u3002", "categories": ["math.OC", "cs.AI", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21187", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u51b3\u7b56\u4f18\u5316", "\u5c42\u6b21\u5206\u6790\u6cd5", "\u6700\u5c0f\u4e8c\u4e58", "\u6b63\u5219\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21187v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Anchored Regularized Direct Least Squares (ARDLS): Integrating Established Prioritization Operators for Priority Elicitation in the Analytic Hierarchy Process", "tldr": "\u672c\u6587\u63d0\u51fa ARDLS \u4f18\u5316\u6a21\u578b\uff0c\u7528\u6b63\u5219\u5316\u628a\u7279\u5f81\u5411\u91cf\u6cd5\u3001SVD\u3001\u4f59\u5f26\u6700\u5927\u5316\u7b49\u5df2\u6709\u4f18\u5148\u7ea7\u7b97\u5b50\u4f5c\u4e3a\u201c\u951a\u70b9\u201d\uff0c\u89e3\u51b3 AHP \u4e2d\u76f4\u63a5\u6700\u5c0f\u4e8c\u4e58\u6cd5\u5728\u9ad8\u4e0d\u4e00\u81f4\u77e9\u9635\u4e0b\u591a\u89e3\u3001\u6392\u5e8f\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\u3002\u6570\u503c\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u4fdd\u8bc1\u552f\u4e00\u5168\u5c40\u6700\u4f18\uff0c\u5e76\u964d\u4f4e\u4e0d\u540c\u4f18\u5148\u7ea7\u7b97\u5b50\u4e4b\u95f4\u7684\u5747\u65b9\u6839\u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automatic speech quality assessment aims to predict Mean Opinion Scores (MOS) consistent with human subjective perception and is essential for evaluating speech generation, enhancement, and communication systems. For speech signals, especially synthetic speech, distortions often occur locally, and overall perceptual quality is usually dominated by a small number of perceptually salient distortion regions. However, most existing methods are primarily optimized with utterance-level MOS, which provides only coarse-grained supervision and offer no explicit indication of where perceptually important distortions occur. To address this limitation, we introduce explicit distortion localization as auxiliary knowledge for speech quality assessment. We construct the first partially distorted speech dataset with frame-level distortion annotations and train a localization model to generate distortion cues. Building on these cues, we propose DAMOS, a distortion-aware speech quality assessment framework that integrates localization information into the MOS prediction pipeline. Experiments on multiple public benchmarks demonstrate that DAMOS consistently outperforms existing methods and exhibits strong cross-dataset generalization, validating the effectiveness of explicit distortion localization for speech quality assessment.", "arxiv_id": "2608.21176", "arxiv_url": "https://arxiv.org/abs/2608.21176", "authors": ["Naiyuan Li", "Li Dong", "Diqun Yan"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c06\u663e\u5f0f\u5931\u771f\u5b9a\u4f4d\u4f5c\u4e3a\u8bed\u97f3\u8d28\u91cf\u8bc4\u4f30\u7684\u8f85\u52a9\u4fe1\u606f\uff0c\u6784\u5efa\u4e86\u9996\u4e2a\u5e26\u5e27\u7ea7\u5931\u771f\u6807\u6ce8\u7684\u90e8\u5206\u5931\u771f\u8bed\u97f3\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3\u5b9a\u4f4d\u6a21\u578b\u751f\u6210\u5931\u771f\u7ebf\u7d22\u3002\u57fa\u4e8e\u8fd9\u4e9b\u7ebf\u7d22\uff0cDAMOS \u5c06\u5c40\u90e8\u5931\u771f\u4fe1\u606f\u878d\u5165 MOS \u9884\u6d4b\uff0c\u5728\u591a\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u8868\u73b0\u51fa\u8f83\u5f3a\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21176", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u8d28\u91cf\u8bc4\u4f30", "\u5931\u771f\u5b9a\u4f4d", "\u8bed\u97f3\u751f\u6210", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21176v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DAMOS: Learning Distortion-Aware Speech Quality Assessment through Explicit Distortion Localization", "tldr": "\u8bba\u6587\u63d0\u51fa\u5c06\u663e\u5f0f\u5931\u771f\u5b9a\u4f4d\u4f5c\u4e3a\u8bed\u97f3\u8d28\u91cf\u8bc4\u4f30\u7684\u8f85\u52a9\u4fe1\u606f\uff0c\u6784\u5efa\u4e86\u9996\u4e2a\u5e26\u5e27\u7ea7\u5931\u771f\u6807\u6ce8\u7684\u90e8\u5206\u5931\u771f\u8bed\u97f3\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3\u5b9a\u4f4d\u6a21\u578b\u751f\u6210\u5931\u771f\u7ebf\u7d22\u3002\u57fa\u4e8e\u8fd9\u4e9b\u7ebf\u7d22\uff0cDAMOS \u5c06\u5c40\u90e8\u5931\u771f\u4fe1\u606f\u878d\u5165 MOS \u9884\u6d4b\uff0c\u5728\u591a\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u8868\u73b0\u51fa\u8f83\u5f3a\u8de8\u6570\u636e\u96c6\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Safe and efficient shape-aware navigation in heterogeneous crowds and robot fleets remains challenging. Traditional approaches often assume homogeneous robots, sparse workspaces, simplified geometry, offline computation, or handcrafted parameters to make the problem tractable, which limits their deployment in dense crowd scenarios. Toward this end, we propose Shape-Aware Reinforcement Learned Model Predictive Control (SRL-MPC), a method for safe, efficient, and adaptive navigation in crowds with heterogeneous shapes without geometry simplification. To encode shape-aware safety, we formulate high-order control barrier function (HOCBF) constraints from geometric separation features (GSFs) based on support function transformation. A reinforcement learning (RL) framework then learns a neural policy that reads GSFs and outputs real-time MPC parameter updates, enabling the MPC solver to adapt to neighboring crowd geometries. The key advantage of SRL-MPC is that it preserves the safety structure and generalizability of MPC while integrating the adaptability and intelligence of RL. Experiments in randomized crowd scenarios with arbitrary shaped robot fleets demonstrate the effectiveness, scalability, and robustness of SRL-MPC. The results show that SRL-MPC substantially outperforms representative baselines in safety and adaptability. Project website: https://hanruihua.github.io/srl_mpc_project/", "arxiv_id": "2608.21175", "arxiv_url": "https://arxiv.org/abs/2608.21175", "authors": ["Ruihua Han", "Rui Gao", "Zhe Liu", "Xinyi Wang", "Chang Chen", "Shuai Wang", "Qi Hao", "Jia Pan", "Hengshuang Zhao"], "brief": "\u672c\u6587\u63d0\u51fa SRL-MPC\uff0c\u5c06\u5f62\u72b6\u611f\u77e5\u7684\u9ad8\u9636\u63a7\u5236\u969c\u788d\u51fd\u6570\u4e0e\u5f3a\u5316\u5b66\u4e60\u8c03\u53c2\u7684\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u7ed3\u5408\uff0c\u7528\u4e8e\u5f02\u6784\u5f62\u72b6\u673a\u5668\u4eba/\u4eba\u7fa4\u4e2d\u7684\u5b89\u5168\u5bfc\u822a\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u7b80\u5316\u51e0\u4f55\u5f62\u72b6\uff0c\u53ef\u5b9e\u65f6\u6839\u636e\u90bb\u8fd1\u5bf9\u8c61\u5f62\u72b6\u66f4\u65b0 MPC \u53c2\u6570\uff0c\u5728\u968f\u673a\u5bc6\u96c6\u573a\u666f\u4e2d\u76f8\u6bd4\u57fa\u7ebf\u63d0\u5347\u4e86\u5b89\u5168\u6027\u3001\u9002\u5e94\u6027\u548c\u9c81\u68d2\u6027\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21175", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5bfc\u822a", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u9884\u6d4b\u63a7\u5236", "\u5b89\u5168\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21175v1", "published_at": "2026-08-21", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SRL-MPC: Shape-Aware Reinforcement Learned Model Predictive Control", "tldr": "\u672c\u6587\u63d0\u51fa SRL-MPC\uff0c\u5c06\u5f62\u72b6\u611f\u77e5\u7684\u9ad8\u9636\u63a7\u5236\u969c\u788d\u51fd\u6570\u4e0e\u5f3a\u5316\u5b66\u4e60\u8c03\u53c2\u7684\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u7ed3\u5408\uff0c\u7528\u4e8e\u5f02\u6784\u5f62\u72b6\u673a\u5668\u4eba/\u4eba\u7fa4\u4e2d\u7684\u5b89\u5168\u5bfc\u822a\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u7b80\u5316\u51e0\u4f55\u5f62\u72b6\uff0c\u53ef\u5b9e\u65f6\u6839\u636e\u90bb\u8fd1\u5bf9\u8c61\u5f62\u72b6\u66f4\u65b0 MPC \u53c2\u6570\uff0c\u5728\u968f\u673a\u5bc6\u96c6\u573a\u666f\u4e2d\u76f8\u6bd4\u57fa\u7ebf\u63d0\u5347\u4e86\u5b89\u5168\u6027\u3001\u9002\u5e94\u6027\u548c\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
