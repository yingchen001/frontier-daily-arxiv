957f\u89c6\u9891\u95ee\u7b54\u573a\u666f\u4e2d\u517c\u987e\u7cbe\u5ea6\u3001\u53c2\u6570\u89c4\u6a21\u4e0e\u63a8\u7406\u6548\u7387\u3002"}, {"abstract": "We present PhysBrain 1.5, a unified model for understanding physical environments, generating actions, and predicting future states. Motivated by the physical loop of observation, interaction, and environmental change, we bring these capabilities into a common learning framework. Starting from a general vision--language model, we encode language responses, end-effector motion, and dense visual targets as discrete sequences and jointly optimize them with autoregressive next-token prediction. Pre-training draws its embodied supervision entirely from human interaction videos, using task-centered episodes to pair semantic and spatial context with recovered motion and subsequent observations. We then adapt the model through supervised fine-tuning on a mixture of human demonstrations, robot trajectories, and simulated experience. Across 28 embodied understanding benchmarks, our 8B model achieves an average score of 72.5, setting a new open-source state of the art and performing on par with leading proprietary models such as GPT-6-Astra and Gemini 3.6 Flash. It achieves the best open-source results on 14 benchmarks while retaining general multimodal capabilities. Beyond these understanding evaluations, qualitative examples show the model\u0027s ability to produce end-effector trajectories and predict future scenes through spatially aligned RGB, depth, and robot-mask outputs.", "arxiv_id": "2609.14973", "arxiv_url": "https://arxiv.org/abs/2609.14973", "authors": ["DeepCybo Team", "Yu Bin", "Haipeng Cao", "Zheng Chang", "Kai Chen", "Youning Chen", "Kailin Deng", "Yichao Du", "Xiaotong Fu", "Haoyang Ge", "Yunlong Guo", "Chenliu Hao", "Jiyan He", "Xuguo He", "Yakun Hou", "Kai Hu", "Cong Huang", "Tuopusen Huang", "Yu Huang", "Hong Li", "Peize Li", "Shijie Lian", "Xiaopeng Lin", "Yun Lin", "Haibao Liu", "Haochen Liu", "Qiuzhi Liu", "Shengcai Liu", "Zhiqiang Liu", "Tao Luo", "Peng Ren", "Shuo Ren", "Chaoyi Ruan", "Zhaolong Shen", "Yukun Shi", "Qiyuan Su", "Yuxuan Tian", "Yining Wang", "Changti Wu", "Hao Wu", "Xueyin Xu", "Ruoqi Yang", "Zhaoyang Yang", "Hang Yuan", "Zhaoyang Zeng", "Hanwen Zhang", "Ruimeng Zhang", "Yao Zhang", "Yibo Zhang", "Yuxiang Zhang", "Zhirui Zhang", "Ziyi Zhang", "Zubin Zheng", "Zishen Zhuang"], "brief": "PhysBrain 1.5 \u4ece\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u51fa\u53d1\uff0c\u5c06\u8bed\u8a00\u56de\u5e94\u3001\u672b\u7aef\u6267\u884c\u5668\u8fd0\u52a8\u548c\u5bc6\u96c6\u89c6\u89c9\u76ee\u6807\u7edf\u4e00\u7f16\u7801\u4e3a\u79bb\u6563\u5e8f\u5217\uff0c\u7528\u81ea\u56de\u5f52 next-token \u9884\u6d4b\u5171\u540c\u8bad\u7ec3\u3002\u6a21\u578b\u5148\u4ece\u4eba\u7c7b\u4ea4\u4e92\u89c6\u9891\u4e2d\u83b7\u53d6\u5177\u8eab\u76d1\u7763\uff0c\u518d\u901a\u8fc7\u4eba\u7c7b\u793a\u8303\u3001\u673a\u5668\u4eba\u8f68\u8ff9\u548c\u4eff\u771f\u6570\u636e\u8fdb\u884c\u76d1\u7763\u5fae\u8c03\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/DeepCybo-PhysAI/PhysBrain-1.5", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2609.14973", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u628a\u7269\u7406\u73af\u5883\u4e2d\u7684\u89c2\u5bdf\u3001\u4ea4\u4e92\u3001\u73af\u5883\u53d8\u5316\u7eb3\u5165\u540c\u4e00\u5b66\u4e60\u6846\u67b6\uff0c\u540c\u65f6\u652f\u6301\u7406\u89e3\u3001\u52a8\u4f5c\u751f\u6210\u548c\u672a\u6765\u72b6\u6001\u9884\u6d4b", "8B \u6a21\u578b\u5728 28 \u4e2a\u5177\u8eab\u7406\u89e3\u57fa\u51c6\u4e0a\u5e73\u5747\u5f97\u5206 72.5\uff0c\u8fbe\u5230\u65b0\u7684\u5f00\u6e90 SOTA\uff0c\u5e76\u5728 14 \u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u4f73\u5f00\u6e90\u7ed3\u679c", "\u9664\u6587\u672c\u4e0e\u591a\u6a21\u6001\u7406\u89e3\u5916\uff0c\u8fd8\u80fd\u751f\u6210\u672b\u7aef\u6267\u884c\u5668\u8f68\u8ff9\uff0c\u5e76\u9884\u6d4b\u7a7a\u95f4\u5bf9\u9f50\u7684 RGB\u3001\u6df1\u5ea6\u548c\u673a\u5668\u4eba\u63a9\u7801\u7b49\u672a\u6765\u573a\u666f\u8f93\u51fa"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "DeepCybo", "pdf_url": "https://arxiv.org/pdf/2609.14973", "published_at": "2026-09-14", "score": 0.333, "selected_reasons": ["HF trending (56\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14973.png", "title": "PhysBrain 1.5: From Vision-Language Models to Physical Foundation Models", "tldr": "\u7edf\u4e00\u7269\u7406\u7406\u89e3\u3001\u884c\u52a8\u751f\u6210\u4e0e\u672a\u6765\u9884\u6d4b\u7684\u5177\u8eab\u57fa\u7840\u6a21\u578b", "upvotes": 56, "what_it_is": "PhysBrain 1.5 \u4ece\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u51fa\u53d1\uff0c\u5c06\u8bed\u8a00\u56de\u5e94\u3001\u672b\u7aef\u6267\u884c\u5668\u8fd0\u52a8\u548c\u5bc6\u96c6\u89c6\u89c9\u76ee\u6807\u7edf\u4e00\u7f16\u7801\u4e3a\u79bb\u6563\u5e8f\u5217\uff0c\u7528\u81ea\u56de\u5f52 next-token \u9884\u6d4b\u5171\u540c\u8bad\u7ec3\u3002\u6a21\u578b\u5148\u4ece\u4eba\u7c7b\u4ea4\u4e92\u89c6\u9891\u4e2d\u83b7\u53d6\u5177\u8eab\u76d1\u7763\uff0c\u518d\u901a\u8fc7\u4eba\u7c7b\u793a\u8303\u3001\u673a\u5668\u4eba\u8f68\u8ff9\u548c\u4eff\u771f\u6570\u636e\u8fdb\u884c\u76d1\u7763\u5fae\u8c03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8fdb\u4e00\u6b65\u6269\u5c55\u4e3a\u9762\u5411\u7269\u7406\u4e16\u754c\u7684\u57fa\u7840\u6a21\u578b\uff0c\u5c1d\u8bd5\u7528\u7edf\u4e00\u81ea\u56de\u5f52\u5efa\u6a21\u8fde\u63a5\u8bed\u4e49\u7406\u89e3\u3001\u673a\u5668\u4eba\u52a8\u4f5c\u548c\u73af\u5883\u6f14\u5316\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u548c\u673a\u5668\u4eba\u901a\u7528\u6a21\u578b\u5177\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Digital agents must often adapt to new environments whose interfaces, tools, and failure modes are not fully captured by pretrained models. We introduce \\textbf{RSIAgent}, a training-free multi-agent framework for recursive self-improvement through autonomous memory construction. RSIAgent coordinates curriculum, actor, and verifier agents to continually explore the environment, validate outcomes, and retain environment-specific knowledge, including reusable causal relationships between actions, conditions, and consequences. It further adopts a \\textbf{broad-then-deep} exploration strategy, combining parallel broad recursive self-exploration for discovering diverse environment structures with focused deep self-exploration for uncovering hard cases, hidden constraints, boundary conditions, and previously unknown causal dependencies. The resulting memory is frozen and can be directly reused for downstream tasks without updating model parameters. Experiments on OSWorld-v2 and Agent\u0027s Last Exam show that RSIAgent substantially improves strong open-source models, enabling Kimi-K3 and GLM-5.3 to outperform frontier closed-source models including GPT-6.", "arxiv_id": "2609.15364", "arxiv_url": "https://arxiv.org/abs/2609.15364", "authors": ["Sibo Zhu", "Shicheng Fan", "Xinyue Wang", "Wenyi Wu", "Kun Zhou", "Biwei Huang"], "brief": "\u8bba\u6587\u63d0\u51fa RSIAgent\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u667a\u80fd\u4f53\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u6846\u67b6\uff0c\u901a\u8fc7\u81ea\u4e3b\u63a2\u7d22\u65b0\u73af\u5883\u5e76\u6784\u5efa\u53ef\u590d\u7528\u8bb0\u5fc6\u6765\u63d0\u5347\u6570\u5b57\u667a\u80fd\u4f53\u8868\u73b0\u3002\u5b83\u534f\u8c03\u8bfe\u7a0b\u3001\u6267\u884c\u8005\u548c\u9a8c\u8bc1\u8005\u667a\u80fd\u4f53\uff0c\u8bb0\u5f55\u52a8\u4f5c\u3001\u6761\u4ef6\u4e0e\u7ed3\u679c\u4e4b\u95f4\u7684\u56e0\u679c\u5173\u7cfb\uff0c\u4f9b\u4e0b\u6e38\u4efb\u52a1\u76f4\u63a5\u590d\u7528\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV"], "github_repo": "https://github.com/AetherLabsAI/RSIAgent", "github_stars": 50, "hf_url": "https://huggingface.co/papers/2609.15364", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u201c\u5148\u5e7f\u540e\u6df1\u201d\u63a2\u7d22\u7b56\u7565\uff1a\u5148\u5e76\u884c\u5e7f\u6cdb\u63a2\u7d22\u73af\u5883\u7ed3\u6784\uff0c\u518d\u9488\u5bf9\u96be\u4f8b\u3001\u9690\u85cf\u7ea6\u675f\u548c\u8fb9\u754c\u6761\u4ef6\u8fdb\u884c\u6df1\u5ea6\u63a2\u7d22\u3002", "\u6784\u5efa\u51bb\u7ed3\u7684\u73af\u5883\u7279\u5b9a\u8bb0\u5fc6\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u5373\u53ef\u8fc1\u79fb\u5230\u540e\u7eed\u4efb\u52a1\u3002", "\u5728 OSWorld-v2 \u548c Agent\u0027s Last Exam \u4e0a\u663e\u8457\u63d0\u5347\u5f00\u6e90\u6a21\u578b\u8868\u73b0\uff0c\u4f7f Kimi-K3\u3001GLM-5.3 \u8d85\u8fc7\u5305\u62ec GPT-6 \u5728\u5185\u7684\u95ed\u6e90\u524d\u6cbf\u6a21\u578b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u81ea\u6211\u6539\u8fdb", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 1, "on_hf": true, "organization": "AetherLabs-AI", "pdf_url": "https://arxiv.org/pdf/2609.15364", "published_at": "2026-09-14", "score": 0.305, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15364.png", "title": "RSIAgent: Autonomous Exploration for Recursive Self-improvement in New Environments", "tldr": "\u591a\u667a\u80fd\u4f53\u81ea\u4e3b\u63a2\u7d22\u6784\u5efa\u73af\u5883\u8bb0\u5fc6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa RSIAgent\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u667a\u80fd\u4f53\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u6846\u67b6\uff0c\u901a\u8fc7\u81ea\u4e3b\u63a2\u7d22\u65b0\u73af\u5883\u5e76\u6784\u5efa\u53ef\u590d\u7528\u8bb0\u5fc6\u6765\u63d0\u5347\u6570\u5b57\u667a\u80fd\u4f53\u8868\u73b0\u3002\u5b83\u534f\u8c03\u8bfe\u7a0b\u3001\u6267\u884c\u8005\u548c\u9a8c\u8bc1\u8005\u667a\u80fd\u4f53\uff0c\u8bb0\u5f55\u52a8\u4f5c\u3001\u6761\u4ef6\u4e0e\u7ed3\u679c\u4e4b\u95f4\u7684\u56e0\u679c\u5173\u7cfb\uff0c\u4f9b\u4e0b\u6e38\u4efb\u52a1\u76f4\u63a5\u590d\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u4ece\u53c2\u6570\u8bad\u7ec3\u8f6c\u5411\u53ef\u9a8c\u8bc1\u7684\u73af\u5883\u8bb0\u5fc6\u6784\u5efa\uff0c\u9002\u5408\u771f\u5b9e\u8f6f\u4ef6\u73af\u5883\u4e2d\u63a5\u53e3\u672a\u77e5\u3001\u5931\u8d25\u6a21\u5f0f\u590d\u6742\u7684\u667a\u80fd\u4f53\u90e8\u7f72\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reacting to sudden physical hazards (catching a slipping plate, dodging a falling knife) is both a meaningful test of embodied intelligence and a hard requirement for deploying multimodal large language models (MLLMs) as the decision coreof household robots. Existing evaluations, however, probe intuitive physics passively through question answering over videos, or target deliberate, long-horizon tasks such as navigation and rearrangement; none measure whether a model can turn physical understanding into immediate, safety-critical action. We introduce ReactHuman, the first physics-grounded benchmark for human-like reactive decision-making, in which the evaluated MLLM acts as the brain of a simulated humanoid facing sudden household hazards; it spans 17 event families and over 1,000 bit-for-bit reproducible scenes with exact, annotation-free ground truth derived from 240 Hz rigid-body simulation, including adversarial objects whose appearance contradicts their physics (a foam anvil, a steel apple). We further design a five-metric suite that scores each reaction along three axes: reasonable, safe, and physically grounded. We physically execute every committed plan so that decisions have observable consequences. With this harness we evaluate seven representative MLLMs. Results show that reactive safety is far from solved: models mishandle roughly one hazard in three, act from fixed dispositions rather than the observed scene, trust appearance over motion, and miss interception points at meter scale even when the chosen action is correct; none of these failures shrink with model scale. ReactHuman thus offers both a fine-grained diagnosis and a scalable training signal toward physically grounded, safety-aware embodied agents. The benchmark can be found here: https://huggingface.co/datasets/Alan123/reacthuman-benchmark-scaled", "arxiv_id": "2609.10895", "arxiv_url": "https://arxiv.org/abs/2609.10895", "authors": ["Yizhan Li", "Jianxin You", "Mengyang Xiong", "Yinhuan Chen", "Zicheng Zhao", "Dekun Wu", "Dongqing Zhang", "Bang Liu"], "brief": "ReactHuman \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u7269\u7406\u57fa\u7840\u53cd\u5e94\u51b3\u7b56\u57fa\u51c6\uff0c\u8ba9\u6a21\u578b\u4f5c\u4e3a\u6a21\u62df\u4eba\u5f62\u673a\u5668\u4eba\u7684\u201c\u5927\u8111\u201d\u5904\u7406\u5bb6\u5ead\u7a81\u53d1\u5371\u9669\u3002\u5b83\u901a\u8fc7\u9ad8\u9891\u521a\u4f53\u4eff\u771f\u751f\u6210\u53ef\u590d\u73b0\u573a\u666f\u548c\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u771f\u5b9e\u7269\u7406\u7ed3\u679c\uff0c\u5e76\u5b9e\u9645\u6267\u884c\u6a21\u578b\u8ba1\u5212\u6765\u89c2\u5bdf\u540e\u679c\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10895", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8986\u76d617\u7c7b\u7a81\u53d1\u5bb6\u5ead\u5371\u9669\u4e8b\u4ef6\u30011000\u591a\u4e2a\u53ef\u9010\u6bd4\u7279\u590d\u73b0\u7684\u4eff\u771f\u573a\u666f\uff0c\u5305\u542b\u6ce1\u6cab\u94c1\u7827\u3001\u94a2\u5236\u82f9\u679c\u7b49\u5916\u89c2\u4e0e\u7269\u7406\u5c5e\u6027\u51b2\u7a81\u7684\u5bf9\u6297\u7269\u4f53", "\u63d0\u51fa\u4e94\u9879\u6307\u6807\uff0c\u4ece\u5408\u7406\u6027\u3001\u5b89\u5168\u6027\u3001\u7269\u7406 grounded \u7a0b\u5ea6\u4e09\u4e2a\u7ef4\u5ea6\u8bc4\u4f30\u53cd\u5e94\u51b3\u7b56", "\u8bc4\u6d4b7\u4e2a\u4ee3\u8868\u6027MLLM\u53d1\u73b0\uff1a\u6a21\u578b\u7ea6\u4e09\u5206\u4e4b\u4e00\u5371\u9669\u5904\u7406\u5931\u8d25\uff0c\u5e38\u4f9d\u8d56\u56fa\u5b9a\u504f\u597d\u6216\u5916\u89c2\u5224\u65ad\uff0c\u4e14\u89c4\u6a21\u589e\u5927\u672a\u660e\u663e\u7f13\u89e3"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u7269\u7406\u4eff\u771f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.10895", "published_at": "2026-09-09", "score": 0.299, "selected_reasons": ["HF trending (33\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.10895.png", "title": "ReactHuman: A Physics-Grounded Benchmark for Human-Like Reactive Decision-Making in Embodied Multimodal LLMs", "tldr": "\u8bc4\u6d4b\u5177\u8eabMLLM\u5e94\u5bf9\u7a81\u53d1\u7269\u7406\u5371\u9669\u7684\u80fd\u529b", "upvotes": 33, "what_it_is": "ReactHuman \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u7269\u7406\u57fa\u7840\u53cd\u5e94\u51b3\u7b56\u57fa\u51c6\uff0c\u8ba9\u6a21\u578b\u4f5c\u4e3a\u6a21\u62df\u4eba\u5f62\u673a\u5668\u4eba\u7684\u201c\u5927\u8111\u201d\u5904\u7406\u5bb6\u5ead\u7a81\u53d1\u5371\u9669\u3002\u5b83\u901a\u8fc7\u9ad8\u9891\u521a\u4f53\u4eff\u771f\u751f\u6210\u53ef\u590d\u73b0\u573a\u666f\u548c\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u771f\u5b9e\u7269\u7406\u7ed3\u679c\uff0c\u5e76\u5b9e\u9645\u6267\u884c\u6a21\u578b\u8ba1\u5212\u6765\u89c2\u5bdf\u540e\u679c\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a\u76f4\u89c9\u7269\u7406\u7406\u89e3\u4ece\u88ab\u52a8\u95ee\u7b54\u63a8\u8fdb\u5230\u5b89\u5168\u5173\u952e\u7684\u5373\u65f6\u884c\u52a8\u8bc4\u4f30\uff0c\u80fd\u7ec6\u7c92\u5ea6\u66b4\u9732\u5177\u8eab\u667a\u80fd\u5728\u771f\u5b9e\u90e8\u7f72\u524d\u7684\u53cd\u5e94\u5b89\u5168\u77ed\u677f\uff0c\u5e76\u4e3a\u8bad\u7ec3\u7269\u7406 grounded\u3001\u5b89\u5168\u611f\u77e5\u7684\u5177\u8eab\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u6269\u5c55\u4fe1\u53f7\u3002"}, {"abstract": "We introduce StepAudio 3 Gen, a general-purpose audio generation model that supports zero-shot text-to-speech (TTS), voice design, vocal generation, sound effects, music, vibe speech, and mixtures of multiple audio types within a unified framework. At its core, StepAudio 3 Gen is a discrete autoregressive generator that models audio directly over residual vector quantization (RVQ) tokens, departing from the diffusion Transformer-based continuous generation paradigm prevalent in recent general audio models. Its StepAudio Tokenizer represents general audio at 12.5 Hz in a shared $16 \\times 2048$ residual code space, jointly quantizing semantic and waveform-level acoustic features so that each code layer preserves both types of information. For generation, the backbone predicts the first codebook along the time axis using autoregressive modeling, while a lightweight causal Transformer completes the remaining fifteen codebooks along the codebook axis. Our study further identifies three key design principles: (1) interference-aware progressive pretraining for acquiring audio capabilities while preserving the textual abilities of the large language model, (2) RVQ Adaptor for effectively incorporating multi-codebook acoustic representations, and (3) discrete autoregressive modeling over a shared representation across general audio domains. With progressive pretraining, multi-task instruction training, and supervised fine-tuning, StepAudio 3 Gen achieves state-of-the-art performance on both TTS and voice design, while retaining strong generation capabilities across speech, vocals, sound effects, and music. Audio samples are available at https://stepaudiollm.github.io/step-audio-3-gen/.", "arxiv_id": "2609.12945", "arxiv_url": "https://arxiv.org/abs/2609.12945", "authors": ["Bin Lin", "Bo Zhao", "Boyang Wang", "Boyang Zhang", "Boyong Wu", "Chao Yan", "Chen Geng", "Chen Wu", "Cheng Yi", "Chengli Feng", "Chenglin Zhu", "DanNi Wan", "Daxin Jiang", "Dongqing Pang", "Fei Tian", "Feng Tian", "Future Li", "Gang Yu", "Guanglong Yang", "Jia Peng", "Jiahao Song", "Jiamin Fan", "Jiangjie Zhen", "Jianzheng Gao", "Jun Chen", "Li Xie", "Lifang Zhang", "Lingli Ji", "Liying Shi", "Lun Cai", "Min Xu", "Na Wang", "Peilin Li", "Peng Yang", "Pengfei Tan", "Qingjian Lin", "Ruijie Xiong", "Runze Li", "Shenghua Hu", "Shi Qiu", "Siqi Tu", "Siyi Zhou", "Tianjiao Deng", "Wanying Lu", "Weiming Niu", "Wen Sun", "WenWen Qu", "Xiangyu Zhang", "Xianwei Zhang", "XiaoSu Su", "Xing Chen", "Xinyu Liu", "Xuerui Yang", "Yang Li", "Yang Yang", "Yechang Huang", "Yibo Zhu", "Yifan Zhang", "Yiyang Xu", "Yu Fu", "Yu Luo", "Yu Zhou", "Yumang Wang", "Yunzhou Ju", "Yuxiang Yang", "Zekai Liu", "Zengwei Yao", "Zhenwei Mou", "Zheqi Dai", "Zhiyue Wu", "Zichao Zhou"], "brief": "StepAudio 3 Gen \u662f\u4e00\u4e2a\u901a\u7528\u97f3\u9891\u751f\u6210\u6a21\u578b\uff0c\u7edf\u4e00\u652f\u6301\u96f6\u6837\u672c TTS\u3001\u58f0\u97f3\u8bbe\u8ba1\u3001\u4eba\u58f0\u3001\u97f3\u6548\u3001\u97f3\u4e50\u53ca\u6df7\u5408\u97f3\u9891\u751f\u6210\u3002\u5b83\u7528 RVQ \u79bb\u6563 token \u76f4\u63a5\u5efa\u6a21\u97f3\u9891\uff0c\u66ff\u4ee3\u8fd1\u671f\u901a\u7528\u97f3\u9891\u6a21\u578b\u5e38\u89c1\u7684\u8fde\u7eed\u6269\u6563 Transformer \u8303\u5f0f\u3002", "categories": ["cs.SD", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12945", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["StepAudio Tokenizer \u4ee5 12.5 Hz \u5c06\u901a\u7528\u97f3\u9891\u8868\u793a\u5230\u5171\u4eab\u7684 16\u00d72048 RVQ \u6b8b\u5dee\u7801\u672c\u7a7a\u95f4\uff0c\u540c\u65f6\u4fdd\u7559\u8bed\u4e49\u4e0e\u6ce2\u5f62\u7ea7\u58f0\u5b66\u4fe1\u606f\u3002", "\u751f\u6210\u4e3b\u5e72\u6cbf\u65f6\u95f4\u8f74\u81ea\u56de\u5f52\u9884\u6d4b\u7b2c\u4e00\u4e2a\u7801\u672c\uff0c\u518d\u7531\u8f7b\u91cf\u56e0\u679c Transformer \u6cbf\u7801\u672c\u8f74\u8865\u5168\u5176\u4f59 15 \u4e2a\u7801\u672c\u3002", "\u63d0\u51fa\u5e72\u6270\u611f\u77e5\u6e10\u8fdb\u9884  operates on part-level assets. A naive idea is to run a 3D segmentation network on the fused mesh that TRELLIS.2 generates, but such pipelines are slow and bounded by the accuracy of the segmentation. We want a simple way to extend an existing native 3D generator to the part level. But we face a critical problem: the O-Voxel grid stores one sheet of surface per voxel, so a single volume cannot represent the interface where two parts touch, at any resolution. We introduce a dual-volume representation to solve this problem and put forward KaiNinja, a part-level extension of TRELLIS.2 built on a dual-volume form of its O-Voxel representation. KaiNinja keeps the generation speed and quality of TRELLIS.2 while extending it to the part level, with no mask or segmenter in the pipeline. Its training data come from sources of many kinds, including CAD models and assets authored by an LLM-driven agent; to our knowledge it is the first 3D generative model trained on agent-authored part data. Surprisingly, we also find that whole-object fidelity improves over the same backbone fine-tuned on the same dataset. Against part generation pipelines of different paradigms, it lowers whole-object Chamfer distance by 40% and raises strict part F-score by 16%.", "arxiv_id": "2609.15659", "arxiv_url": "https://arxiv.org/abs/2609.15659", "authors": ["Ruihan Yu", "Lian Fu", "Muyao Niu", "Zheng-hui Huang", "Yu-Ju Tsai", "Sho Kuno", "Fengbo Lan", "Yonghao Yu", "Erwin Wu", "Ming-Hsuan Yang", "Kaipeng Zhang", "Zhixiang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa KaiNinja\uff0c\u5c06 TRELLIS.2 \u7b49\u539f\u751f 3D \u751f\u6210\u5668\u4ece\u6574\u7269\u4f53\u7f51\u683c\u6269\u5c55\u5230\u90e8\u4ef6\u7ea7\u751f\u6210\u3002\u6838\u5fc3\u662f\u7528\u53cc\u4f53\u79ef\u8868\u793a\u6539\u9020 O-Voxel\uff0c\u89e3\u51b3\u63a5\u89e6\u90e8\u4ef6\u754c\u9762\u65e0\u6cd5\u7531\u5355\u4f53\u79ef\u8868\u8fbe\u7684\u95ee\u9898\u3002", "categories": ["cs.GR", "cs.AI", "cs.CV"], "github_repo": "https://github.com/AlayaLab/KaiNinja", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2609.15659", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa dual-volume representation\uff0c\u4f7f\u76f8\u90bb\u90e8\u4ef6\u7684\u63a5\u89e6\u754c\u9762\u53ef\u88ab\u663e\u5f0f\u8868\u793a\uff0c\u65e0\u9700\u540e\u5904\u7406\u5206\u5272\u7f51\u7edc\u6216\u63a9\u7801\u6d41\u7a0b\u3002", "\u5728\u4fdd\u6301 TRELLIS.2 \u751f\u6210\u901f\u5ea6\u4e0e\u51e0\u4f55/\u6750\u8d28\u8d28\u91cf\u7684\u540c\u65f6\uff0c\u76f4\u63a5\u8f93\u51fa\u90e8\u4ef6\u7ea7 3D \u8d44\u4ea7\uff0c\u4fbf\u4e8e\u7f16\u8f91\u3001\u7ed1\u5b9a\u548c\u4eff\u771f\u3002", "\u8bad\u7ec3\u6570\u636e\u6df7\u5408 CAD \u6a21\u578b\u4e0e LLM \u9a71\u52a8\u667a\u80fd\u4f53\u521b\u4f5c\u7684\u90e8\u4ef6\u6570\u636e\uff1b\u76f8\u6bd4\u4e0d\u540c\u8303\u5f0f\u7684\u90e8\u4ef6\u751f\u6210\u7ba1\u7ebf\uff0c\u6574\u7269\u4f53 Chamfer \u8ddd\u79bb\u964d\u4f4e 40%\uff0c\u4e25\u683c\u90e8\u4ef6 F-score \u63d0\u5347 16%\u3002"], "keywords": ["3D\u751f\u6210", "\u90e8\u4ef6\u7ea7\u5efa\u6a21", "\u591a\u6a21\u6001", "\u6570\u636e\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Alaya Lab", "pdf_url": "https://arxiv.org/pdf/2609.15659", "published_at": "2026-09-14", "score": 0.29, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15659.png", "title": "Kaininja: Extending Native 3D Generators to the Part Level", "tldr": "KaiNinja\u8ba93D\u751f\u6210\u5668\u76f4\u63a5\u751f\u6210\u90e8\u4ef6\u7ea7\u8d44\u4ea7", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa KaiNinja\uff0c\u5c06 TRELLIS.2 \u7b49\u539f\u751f 3D \u751f\u6210\u5668\u4ece\u6574\u7269\u4f53\u7f51\u683c\u6269\u5c55\u5230\u90e8\u4ef6\u7ea7\u751f\u6210\u3002\u6838\u5fc3\u662f\u7528\u53cc\u4f53\u79ef\u8868\u793a\u6539\u9020 O-Voxel\uff0c\u89e3\u51b3\u63a5\u89e6\u90e8\u4ef6\u754c\u9762\u65e0\u6cd5\u7531\u5355\u4f53\u79ef\u8868\u8fbe\u7684\u95ee\u9898\u3002", "why_notable": "\u5b83\u628a\u9ad8\u4fdd\u771f\u539f\u751f 3D \u751f\u6210\u4ece\u201c\u5355\u4e2a\u878d\u5408\u7269\u4f53\u201d\u63a8\u8fdb\u5230\u201c\u53ef\u64cd\u4f5c\u7684\u90e8\u4ef6\u7ea7\u8d44\u4ea7\u201d\uff0c\u7ed5\u5f00\u4e86\u6162\u4e14\u53d7\u9650\u4e8e\u7cbe\u5ea6\u7684\u7f51\u683c\u5206\u5272\u540e\u5904\u7406\uff0c\u5bf9 3D \u5185\u5bb9\u751f\u4ea7\u3001\u53ef\u7f16\u8f91\u751f\u6210\u548c\u7269\u7406\u4eff\u771f\u90fd\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Direct Preference Optimization (DPO) simplifies alignment through pairwise comparisons but assumes all observed preferences are reliable. Real data often violates this assumption, leading to reversed, weak, or ambiguous labels that cause harmful policy updates. To address this, we propose Posterior Label Correction DPO (PLC-DPO) to robustly optimize preferences by routing each pair\u0027s training signal as a clean, flip, or tie case. The key idea is to use the calibrated policy-reference margin as online evidence to take appropriate correction actions. This reframes noisy preference learning as actively correcting supervision direction and strength rather than merely filtering suspicious examples. Across 57 dataset-model-benchmark cells, PLC-DPO obtains the best mean win rate against DPO (60.5 vs. 55.5 for the next-best method). Injected-noise and tie stress tests, human disagreement analysis, and self-confirmation diagnostics further show that the routing remains stable and distinguishes flipped from weakly directional pairs.", "arxiv_id": "2608.30597", "arxiv_url": "https://arxiv.org/abs/2608.30597", "authors": ["Boryeong Cho", "Sumyeong Ahn", "Se-Young Yun"], "brief": "\u8bba\u6587\u63d0\u51fa PLC-DPO\uff0c\u5728 DPO \u8bad\u7ec3\u4e2d\u6839\u636e\u5728\u7ebf\u6821\u51c6\u7684 policy-reference margin\uff0c\u5c06\u504f\u597d\u6837\u672c\u8def\u7531\u4e3a\u5e72\u51c0\u3001\u7ffb\u8f6c\u6216\u5e73\u5c40\u4e09\u7c7b\uff0c\u5e76\u76f8\u5e94\u7ea0\u6b63\u76d1\u7763\u65b9\u5411\u4e0e\u5f3a\u5ea6\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/VennTum99/PLC-DPO", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2608.30597", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u771f\u5b9e\u504f\u597d\u6570\u636e\u4e2d\u7684\u53cd\u5411\u6807\u7b7e\u3001\u5f31\u504f\u597d\u548c\u6b67\u4e49\u6807\u7b7e\uff0c\u907f\u514d DPO \u76f2\u76ee\u4fe1\u4efb\u89c2\u6d4b\u504f\u597d\u5e26\u6765\u7684\u6709\u5bb3\u66f4\u65b0", "\u5229\u7528\u6821\u51c6\u540e\u7684\u7b56\u7565-\u53c2\u8003\u6a21\u578b\u8fb9\u9645\u4f5c\u4e3a\u5728\u7ebf\u8bc1\u636e\uff0c\u52a8\u6001\u5224\u65ad\u6837\u672c\u5e94\u6b63\u5e38\u8bad\u7ec3\u3001\u7ffb\u8f6c\u6807\u7b7e\u8fd8\u662f\u89c6\u4e3a\u5e73\u5c40", "\u5728 57 \u4e2a\u6570\u636e\u96c6-\u6a21\u578b-\u57fa\u51c6\u7ec4\u5408\u4e2d\uff0cPLC-DPO \u76f8\u5bf9 DPO \u7684\u5e73\u5747\u80dc\u7387\u4e3a 60.5\uff0c\u9ad8\u4e8e\u6b21\u4f18\u65b9\u6cd5\u7684 55.5"], "keywords": ["\u504f\u597d\u4f18\u5316", "\u5bf9\u9f50", "\u9c81\u68d2\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2608.30597", "published_at": "2026-08-31", "score": 0.281, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30597.png", "title": "PLC-DPO: Posterior Label Correction in Noisy and Ambiguous Preference Optimization", "tldr": "\u7528\u540e\u9a8c\u6807\u7b7e\u7ea0\u6b63\u63d0\u5347\u566a\u58f0\u504f\u597d\u4f18\u5316", "upvotes": 24, "what_it_is": "\u8bba\u6587\u63d0\u51fa PLC-DPO\uff0c\u5728 DPO \u8bad\u7ec3\u4e2d\u6839\u636e\u5728\u7ebf\u6821\u51c6\u7684 policy-reference margin\uff0c\u5c06\u504f\u597d\u6837\u672c\u8def\u7531\u4e3a\u5e72\u51c0\u3001\u7ffb\u8f6c\u6216\u5e73\u5c40\u4e09\u7c7b\uff0c\u5e76\u76f8\u5e94\u7ea0\u6b63\u76d1\u7763\u65b9\u5411\u4e0e\u5f3a\u5ea6\u3002", "why_notable": "\u5b83\u5c06\u566a\u58f0\u504f\u597d\u5b66\u4e60\u4ece\u201c\u8fc7\u6ee4\u53ef\u7591\u6837\u672c\u201d\u63a8\u8fdb\u5230\u201c\u4e3b\u52a8\u7ea0\u6b63\u76d1\u7763\u4fe1\u53f7\u201d\uff0c\u5bf9\u63d0\u5347 LLM \u5bf9\u9f50\u8bad\u7ec3\u5728\u771f\u5b9e\u3001\u6709\u4e89\u8bae\u504f\u597d\u6570\u636e\u4e0a\u7684\u9c81\u68d2\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Streaming omni-modal models must decide what and when to answer from the video chunks and synchronized audio observed so far. Visual cues often support an interpretation before an utterance or sound event is complete. If that interpretation enters memory as a fact, later reasoning can keep relaying it even after audio contradicts it. We call this failure premature cross-modal commitment. We propose Omni-Streaming Thinking (OST), which generates structured outputs that include evidence observed so far, forecasts of future evidence, and claims based on this evidence. Each claim is initially marked as pending and linked to a future verification interval. Audio and visual evidence are stored separately, and OST checks a claim against the evidence from the specified modality at the end of the verification interval. When contradictory evidence is detected, a refutation process reduces the influence of the claim and its dependent states, and then guides a state update using the new evidence. An answer gate decides whether the answer-critical claims meet the conditions for giving a response. Using a frozen Qwen3-Omni-30B-A3B-Instruct backbone with lightweight adaptation, OST outperforms the strongest open baselines on five streaming and audio-visual benchmarks by more than 10% relative on average. We also introduce OST-DiagBench, which holds video fixed and edits audio to test agreement, absence, contradiction, coexistence, and subtitle-speech conflict. OST reaches d-prime = 2.95, compared with at most 1.38 for open baselines, while reducing vision-induced auditory hallucinations.", "arxiv_id": "2609.15128", "arxiv_url": "https://arxiv.org/abs/2609.15128", "authors": ["Enjun Du", "Siyi Liu", "Ziyu Zheng", "Jingyu Li", "Yiwen Guo", "Yongqi Zhang", "Difan Zou"], "brief": "\u8bba\u6587\u63d0\u51fa Omni-Streaming Thinking\uff08OST\uff09\uff0c\u8ba9\u6d41\u5f0f\u5168\u6a21\u6001\u6a21\u578b\u5728\u89c6\u9891\u4e0e\u97f3\u9891\u5c1a\u672a\u5b8c\u6574\u5230\u8fbe\u65f6\uff0c\u5c06\u8bc1\u636e\u3001\u9884\u6d4b\u4e0e\u58f0\u660e\u7ed3\u6784\u5316\u8868\u793a\uff0c\u5e76\u5ef6\u8fdf\u9a8c\u8bc1\u5173\u952e\u58f0\u660e\u3002\u5b83\u901a\u8fc7\u5206\u79bb\u97f3\u89c6\u9891\u8bc1\u636e\u3001\u8bbe\u7f6e\u9a8c\u8bc1\u533a\u95f4\u3001\u53cd\u9a73\u673a\u5236\u548c\u56de\u7b54\u95e8\u63a7\uff0c\u51cf\u5c11\u89c6\u89c9\u5148\u9a8c\u5bfc\u81f4\u7684\u542c\u89c9\u5e7b\u89c9\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15128", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u4e2a\u58f0\u660e\u5148\u6807\u8bb0\u4e3a pending\uff0c\u5e76\u7ed1\u5b9a\u672a\u6765\u9a8c\u8bc1\u533a\u95f4\uff0c\u907f\u514d\u628a\u65e9\u671f\u89c6\u89c9\u63a8\u65ad\u76f4\u63a5\u56fa\u5316\u4e3a\u4e8b\u5b9e", "\u97f3\u9891\u4e0e\u89c6\u89c9\u8bc1\u636e\u5206\u5f00\u5b58\u50a8\uff0c\u9a8c\u8bc1\u671f\u7ed3\u675f\u540e\u6309\u6307\u5b9a\u6a21\u6001\u68c0\u67e5\u58f0\u660e\uff0c\u53d1\u73b0\u77db\u76fe\u65f6\u524a\u5f31\u76f8\u5173\u72b6\u6001\u5f71\u54cd\u5e76\u66f4\u65b0\u63a8\u7406\u72b6\u6001", "\u57fa\u4e8e\u51bb\u7ed3\u7684 Qwen3-Omni-30B-A3B-Instruct \u8f7b\u91cf\u9002\u914d\uff0c\u5728\u4e94\u4e2a\u6d41\u5f0f\u4e0e\u97f3\u89c6\u9891\u57fa\u51c6\u4e0a\u8f83\u6700\u5f3a\u5f00\u653e\u57fa\u7ebf\u5e73\u5747\u76f8\u5bf9\u63d0\u5347\u8d85\u8fc7 10%"], "keywords": ["\u591a\u6a21\u6001", "\u6d41\u5f0f\u63a8\u7406", "\u5e7b\u89c9\u6291\u5236", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15128", "published_at": "2026-09-14", "score": 0.271, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15128.png", "title": "Omni-Streaming Thinking", "tldr": "\u964d\u4f4e\u6d41\u5f0f\u5168\u6a21\u6001\u6a21\u578b\u7684\u8fc7\u65e9\u8de8\u6a21\u6001\u627f\u8bfa", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa Omni-Streaming Thinking\uff08OST\uff09\uff0c\u8ba9\u6d41\u5f0f\u5168\u6a21\u6001\u6a21\u578b\u5728\u89c6\u9891\u4e0e\u97f3\u9891\u5c1a\u672a\u5b8c\u6574\u5230\u8fbe\u65f6\uff0c\u5c06\u8bc1\u636e\u3001\u9884\u6d4b\u4e0e\u58f0\u660e\u7ed3\u6784\u5316\u8868\u793a\uff0c\u5e76\u5ef6\u8fdf\u9a8c\u8bc1\u5173\u952e\u58f0\u660e\u3002\u5b83\u901a\u8fc7\u5206\u79bb\u97f3\u89c6\u9891\u8bc1\u636e\u3001\u8bbe\u7f6e\u9a8c\u8bc1\u533a\u95f4\u3001\u53cd\u9a73\u673a\u5236\u548c\u56de\u7b54\u95e8\u63a7\uff0c\u51cf\u5c11\u89c6\u89c9\u5148\u9a8c\u5bfc\u81f4\u7684\u542c\u89c9\u5e7b\u89c9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u6d41\u5f0f\u5168\u6a21\u6001\u6a21\u578b\u4e2d\u7684\u201c\u8fc7\u65e9\u8de8\u6a21\u6001\u627f\u8bfa\u201d\u63d0\u51fa\u4e86\u660e\u786e\u673a\u5236\uff0c\u5e76\u5f15\u5165 OST-DiagBench \u4e13\u95e8\u6d4b\u8bd5\u97f3\u89c6\u9891\u4e00\u81f4\u3001\u7f3a\u5931\u3001\u77db\u76fe\u3001\u5171\u5b58\u548c\u5b57\u5e55-\u8bed\u97f3\u51b2\u7a81\u7b49\u573a\u666f\uff0c\u663e\u8457\u964d\u4f4e\u89c6\u89c9\u8bf1\u5bfc\u7684\u542c\u89c9\u5e7b\u89c9\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Computer-use agents increasingly interact with browsers, terminals, file systems, and external services, introducing safety risks that emerge through runtime behavior rather than generated content alone. Existing guard models target static prompts and responses and are poorly suited to agent execution; existing executable safety platforms produce evaluation verdicts rather than the normalized supervision a guard model needs to learn across heterogeneous agent frameworks. We introduce HazardAuditor, an execution-grounded framework that closes both gaps. Its infrastructure runs heterogeneous agents (Claude Code, Codex, Hermes, and OpenClaw) in controlled environments and normalizes their interactions into a canonical event representation for cross-framework supervision. We further observe that token-level post-training objectives create a structural mismatch for generative guards, causing longer rationales to dominate gradient updates. Guard Policy Optimization (GuardPO) addresses this by converting deterministic safety outcomes into sequence-level advantages and normalizing rationale and verdict regions, making the safety decision the effective unit of optimization. Across multiple benchmarks and heterogeneous computer-use systems, HazardAuditor improves accuracy by up to 16.5 percentage points over the strongest prior guard. Code, models, and evaluation artifacts will be available at https://yunhao-feng.github.io/HazardAuditor/.", "arxiv_id": "2609.15134", "arxiv_url": "https://arxiv.org/abs/2609.15134", "authors": ["Yunhao Feng", "Ruixiao Lin", "Ming Wen", "Yanming Guo", "Xingjun Ma", "Yutao Wu", "Xinhao Deng", "Shouling Ji"], "brief": "\u8bba\u6587\u63d0\u51fa HazardAuditor\uff0c\u7528\u53d7\u63a7\u73af\u5883\u8fd0\u884c\u591a\u79cd computer-use agents\uff0c\u5e76\u5c06\u6d4f\u89c8\u5668\u3001\u7ec8\u7aef\u3001\u6587\u4ef6\u7cfb\u7edf\u7b49\u4ea4\u4e92\u7edf\u4e00\u4e3a\u89c4\u8303\u4e8b\u4ef6\u8868\u793a\uff0c\u7528\u4e8e\u8bad\u7ec3\u8de8\u6846\u67b6\u5b89\u5168\u5b88\u536b\u6a21\u578b\u3002\u8fd8\u63d0\u51fa Guard Policy Optimization\uff0c\u5c06\u786e\u5b9a\u6027\u5b89\u5168\u7ed3\u679c\u8f6c\u4e3a\u5e8f\u5217\u7ea7\u4f18\u52bf\uff0c\u7f13\u89e3\u751f\u6210\u5f0f guard \u4e2d\u957f\u63a8\u7406\u6587\u672c\u4e3b\u5bfc\u8bad\u7ec3\u7684\u95ee\u9898\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Yunhao-Feng/HazardAuditor", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.15134", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u652f\u6301 Claude Code\u3001Codex\u3001Hermes\u3001OpenClaw \u7b49\u5f02\u6784\u667a\u80fd\u4f53\uff0c\u5728\u771f\u5b9e\u6267\u884c\u8f68\u8ff9\u4e2d\u6355\u6349\u8fd0\u884c\u65f6\u5b89\u5168\u98ce\u9669", "\u5c06\u4e0d\u540c\u6846\u67b6\u7684\u64cd\u4f5c\u5f52\u4e00\u5316\u4e3a canonical event representation\uff0c\u4fbf\u4e8e\u8de8\u7cfb\u7edf\u76d1\u7763\u4e0e\u8bc4\u6d4b", "GuardPO \u4ee5\u5b89\u5168\u5224\u5b9a\u4e3a\u4f18\u5316\u6838\u5fc3\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u76f8\u8f83\u6700\u5f3a\u65e2\u6709 guard \u51c6\u786e\u7387\u6700\u9ad8\u63d0\u5347 16.5 \u4e2a\u767e\u5206\u70b9"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u7535\u8111\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2609.15134", "published_at": "2026-09-14", "score": 0.267, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15134.png", "title": "HazardAuditor: From Executable Threats to Safer Computer-Use Agents", "tldr": "\u9762\u5411\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u6267\u884c\u7ea7\u5b89\u5168\u5ba1\u8ba1\u6846\u67b6", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa HazardAuditor\uff0c\u7528\u53d7\u63a7\u73af\u5883\u8fd0\u884c\u591a\u79cd computer-use agents\uff0c\u5e76\u5c06\u6d4f\u89c8\u5668\u3001\u7ec8\u7aef\u3001\u6587\u4ef6\u7cfb\u7edf\u7b49\u4ea4\u4e92\u7edf\u4e00\u4e3a\u89c4\u8303\u4e8b\u4ef6\u8868\u793a\uff0c\u7528\u4e8e\u8bad\u7ec3\u8de8\u6846\u67b6\u5b89\u5168\u5b88\u536b\u6a21\u578b\u3002\u8fd8\u63d0\u51fa Guard Policy Optimization\uff0c\u5c06\u786e\u5b9a\u6027\u5b89\u5168\u7ed3\u679c\u8f6c\u4e3a\u5e8f\u5217\u7ea7\u4f18\u52bf\uff0c\u7f13\u89e3\u751f\u6210\u5f0f guard \u4e2d\u957f\u63a8\u7406\u6587\u672c\u4e3b\u5bfc\u8bad\u7ec3\u7684\u95ee\u9898\u3002", "why_notable": "\u73b0\u6709\u5b89\u5168\u6a21\u578b\u591a\u5173\u6ce8\u9759\u6001\u63d0\u793a\u4e0e\u56de\u590d\uff0c\u96be\u4ee5\u8986\u76d6\u667a\u80fd\u4f53\u6267\u884c\u8fc7\u7a0b\u4e2d\u7684\u5b9e\u9645\u98ce\u9669\uff1bHazardAuditor \u5c06\u53ef\u6267\u884c\u5a01\u80c1\u3001\u7edf\u4e00\u76d1\u7763\u548c guard \u8bad\u7ec3\u8fde\u63a5\u8d77\u6765\uff0c\u5bf9\u6784\u5efa\u66f4\u5b89\u5168\u7684\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Natural interaction in digital and physical environments requires continuous perception and timely responses. Spoken dialogue relies on acoustic and linguistic cues, while video interaction also requires grounding the conversation in evolving visual context. We present Realtime-Venus, a proactive full-duplex interaction system with two separately trained 9B models: Realtime-Venus-Omni for audio-visual interaction and Realtime-Venus-Audio for spoken interaction. Each model serves as a complete conversational frontend, integrating continuous perception, conversational control, and native speech generation through a shared causal timeline for user inputs, model outputs, and delegation events. A dual-loop runtime coordinates live interaction with background reasoning and tool execution. Foreground interaction continues while Realtime-Venus-Harness executes tasks asynchronously and returns results for integration into the ongoing dialogue. Both models follow a common post-training recipe combining offline understanding, proactive full-duplex trajectories, and delegation workflows. Among the evaluated online models, Realtime-Venus-Omni achieves the highest scores on six of eight video benchmarks, including StreamingBench (70.2%), OVO-Bench (64.7%), and Daily-Omni (81.3%). Across eight audio understanding and spoken question answering benchmarks, Realtime-Venus-Audio leads the compared models on MMAU (78.0%), MMAU-Pro (63.2%), Llama Questions (83.8%), and Speech CMMLU (67.8%), while matching the best VoiceBench AlpacaEval score of 4.81. On Full-Duplex-Bench v1.5, Realtime-Venus-Audio responds to 75% of user interruptions and achieves continuation rates of 97%, 88%, and 86% under backchannels, other-directed speech, and background speech, respectively, exceeding Gemini 3.1 Live and GPT-4o on all three continuation metrics.", "arxiv_id": "2609.13814", "arxiv_url": "https://arxiv.org/abs/2609.13814", "authors": ["Ruixiang Zhao", "Hualei Wang", "Renhe Sun", "Enzhi Zhou", "Jincenzi Wu", "Xujie Song", "Kexin Shi", "Zihang Liu", "Pengcheng Zhu", "Jiayi Zhou", "Baoyue Zhang", "Changhao Zhang", "Zitong Wang", "Jinhong Wang", "Tong Niu", "Jingjing Liu", "Junan Lin", "Haolin He", "Hengshuo Chu", "Yuhui Chen", "Jian Liu", "Yuge Huang", "Junliang Xing", "Yuntao Wang", "Weiqiang Wang", "Chun Yu", "Yuanchun Shi"], "brief": "\u8bba\u6587\u63d0\u51fa Realtime-Venus\uff0c\u4e00\u4e2a\u4e3b\u52a8\u5f0f\u5168\u53cc\u5de5\u4ea4\u4e92\u7cfb\u7edf\uff0c\u5305\u542b\u97f3\u89c6\u9891\u6a21\u578b Realtime-Venus-Omni \u548c\u8bed\u97f3\u6a21\u578b Realtime-Venus-Audio\u3002\u7cfb\u7edf\u7528\u5171\u4eab\u56e0\u679c\u65f6\u95f4\u7ebf\u7edf\u4e00\u7528\u6237\u8f93\u5165\u3001\u6a21\u578b\u8f93\u51fa\u4e0e\u59d4\u6d3e\u4e8b\u4ef6\uff0c\u5e76\u901a\u8fc7\u53cc\u5faa\u73af\u8fd0\u884c\u65f6\u5728\u524d\u53f0\u6301\u7eed\u5bf9\u8bdd\u3001\u540e\u53f0\u5f02\u6b65\u63a8\u7406\u548c\u6267\u884c\u5de5\u5177\u3002", "categories": ["cs.CV", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13814", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4e24\u4e2a 9B \u6a21\u578b\u5206\u522b\u9762\u5411\u97f3\u89c6\u9891\u4ea4\u4e92\u4e0e\u7eaf\u8bed\u97f3\u4ea4\u4e92\uff0c\u96c6\u6210\u8fde\u7eed\u611f\u77e5\u3001\u5bf9\u8bdd\u63a7\u5236\u548c\u539f\u751f\u8bed\u97f3\u751f\u6210\u3002", "\u63d0\u51fa\u53cc\u5faa\u73af\u8fd0\u884 3001\u5168\u53cc\u5de5\u5bf9\u8bdd\u63a7\u5236\u548c\u5de5\u5177\u59d4\u6d3e\u6574\u5408\u5230\u7edf\u4e00\u7cfb\u7edf\u4e2d\uff0c\u63d0\u5347\u4e86 AI \u5728\u6301\u7eed\u8bed\u97f3/\u89c6\u9891\u4ea4\u4e92\u573a\u666f\u4e2d\u7684\u81ea\u7136\u6027\u3001\u9c81\u68d2\u6027\u548c\u4efb\u52a1\u6267\u884c\u80fd\u529b\uff0c\u5bf9\u5b9e\u65f6\u52a9\u624b\u3001\u5177\u8eab\u4ea4\u4e92\u548c\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We demonstrate that a general-purpose agent can directly drive a physical robot throughout task execution without any task-specific or environment-specific training. We introduce Agent as Policy (AGP), which places task planning and execution under the agent\u0027s control. Given a task and a robot interface, the agent interprets visual evidence, writes executable programs, issues motion commands, and revises its actions in response to physical outcomes. This brings the agent\u0027s reasoning and programming capabilities into continuous interaction with the physical world. We study AGP across multiple real-world manipulation tasks spanning precision manipulation, dynamic motions, and deformable objects. These include assembly from human videos, block construction from goal images, dice flipping, targeted throwing, and bimanual towel folding. Across assembly, block construction, and dice flipping, AGP succeeds in at least eight of ten trials for each evaluated task configuration. We further study efficiency through task experience accumulation and find that reusing saved procedures and programs shortens execution time across repeated trials. These findings support a path for general-purpose agents to act as robot policies, extending their autonomy to physical manipulation through runtime reasoning, programming, and interaction.", "arxiv_id": "2609.12541", "arxiv_url": "https://arxiv.org/abs/2609.12541", "authors": ["Mengzhao Jia", "Yang Lin", "Xixin Zhang", "Zhihan Zhang", "Xiaobai Liu", "Meng Jiang"], "brief": "\u8bba\u6587\u63d0\u51fa Agent as Policy\uff08AGP\uff09\uff0c\u8ba9\u901a\u7528\u667a\u80fd\u4f53\u5728\u65e0\u9700\u4efb\u52a1\u6216\u73af\u5883\u4e13\u9879\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\uff0c\u76f4\u63a5\u63a7\u5236\u771f\u5b9e\u673a\u5668\u4eba\u5b8c\u6210\u64cd\u4f5c\u4efb\u52a1\u3002\u667a\u80fd\u4f53\u901a\u8fc7\u89c6\u89c9\u7406\u89e3\u3001\u7f16\u5199\u53ef\u6267\u884c\u7a0b\u5e8f\u3001\u53d1\u51fa\u8fd0\u52a8\u6307\u4ee4\uff0c\u5e76\u6839\u636e\u7269\u7406\u53cd\u9988\u5b9e\u65f6\u4fee\u6b63\u884c\u4e3a\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12541", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["AGP \u5c06\u4efb\u52a1\u89c4\u5212\u4e0e\u6267\u884c\u7edf\u4e00\u4ea4\u7ed9\u901a\u7528\u667a\u80fd\u4f53\uff0c\u652f\u6301\u8fd0\u884c\u65f6\u63a8\u7406\u3001\u7f16\u7a0b\u548c\u7269\u7406\u4ea4\u4e92\u95ed\u73af\u3002", "\u5728\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u9a8c\u8bc1\u4e86\u88c5\u914d\u3001\u79ef\u6728\u642d\u5efa\u3001\u9ab0\u5b50\u7ffb\u8f6c\u3001\u5b9a\u5411\u6295\u63b7\u3001\u53cc\u81c2\u6bdb\u5dfe\u6298\u53e0\u7b49\u591a\u7c7b\u64cd\u4f5c\u4efb\u52a1\u3002", "\u5728\u88c5\u914d\u3001\u79ef\u6728\u642d\u5efa\u548c\u9ab0\u5b50\u7ffb\u8f6c\u4efb\u52a1\u4e2d\uff0c\u5404\u8bc4\u4f30\u914d\u7f6e\u81f3\u5c11\u8fbe\u5230 8/10 \u6b21\u6210\u529f\uff0c\u5e76\u53ef\u901a\u8fc7\u590d\u7528\u7ecf\u9a8c\u7a0b\u5e8f\u7f29\u77ed\u91cd\u590d\u6267\u884c\u65f6\u95f4\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u5177\u8eab\u667a\u80fd", "\u7a0b\u5e8f\u751f\u6210"], "num_comments": 3, "on_hf": true, "organization": "University of Notre Dame", "pdf_url": "https://arxiv.org/pdf/2609.12541", "published_at": "2026-09-14", "score": 0.245, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.12541.png", "title": "Agent as Policy for Robotic Manipulation", "tldr": "\u901a\u7528\u667a\u80fd\u4f53\u53ef\u76f4\u63a5\u5145\u5f53\u673a\u5668\u4eba\u64cd\u4f5c\u7b56\u7565", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agent as Policy\uff08AGP\uff09\uff0c\u8ba9\u901a\u7528\u667a\u80fd\u4f53\u5728\u65e0\u9700\u4efb\u52a1\u6216\u73af\u5883\u4e13\u9879\u8bad\u7ec3\u7684\u60c5\u51b5\u4e0b\uff0c\u76f4\u63a5\u63a7\u5236\u771f\u5b9e\u673a\u5668\u4eba\u5b8c\u6210\u64cd\u4f5c\u4efb\u52a1\u3002\u667a\u80fd\u4f53\u901a\u8fc7\u89c6\u89c9\u7406\u89e3\u3001\u7f16\u5199\u53ef\u6267\u884c\u7a0b\u5e8f\u3001\u53d1\u51fa\u8fd0\u52a8\u6307\u4ee4\uff0c\u5e76\u6839\u636e\u7269\u7406\u53cd\u9988\u5b9e\u65f6\u4fee\u6b63\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u901a\u7528\u667a\u80fd\u4f53\u65e0\u9700\u4e13\u95e8\u8bad\u7ec3\u5373\u53ef\u4f5c\u4e3a\u673a\u5668\u4eba\u7b56\u7565\u6267\u884c\u771f\u5b9e\u7269\u7406\u64cd\u4f5c\uff0c\u62d3\u5c55\u4e86 LLM/\u901a\u7528\u667a\u80fd\u4f53\u4ece\u6570\u5b57\u4efb\u52a1\u5230\u5177\u8eab\u63a7\u5236\u7684\u8fb9\u754c\uff0c\u5bf9\u901a\u7528\u673a\u5668\u4eba\u81ea\u4e3b\u6027\u5177\u6709\u91cd\u8981\u542f\u53d1\u3002"}, {"abstract": "In this technical report, we propose Pelican-Sim 1.0, a general world model simulator for embodied intelligence that predicts future observations from visual context and robot actions to support downstream learning and decision making. The model incorporates four key design features: (1) Unified action representation: a 28-dimensional action value space covering most mainstream embodiments, keeping one model valid across heterogeneous devices. (2) Action-visual injection: URDF- and camera-rendered action videos bridge actions and pixels, giving markedly better controllability across embodiments, scenes, and tasks (PSNR +0.904 over alternative fusion baselines). (3) Sparse mixture-of-experts (MoE): sparse MoE layers add capacity for heterogeneous dynamics and absorb the action modality while reducing inter-modality conflict (FVD -6.530 vs. the dense backbone). (4) Efficient rollout generation: causal adaptation and few-step distillation yield a four-step autoregressive simulator, achieving a 5.67-fold speedup over the 35-step model. Benefiting from these designs, we train on approximately one million real-world and simulated trajectories and obtain large gains in action controllability and video quality: PSNR improves over the strongest evaluated baselines by 4.636 on AgiBotWorld Beta, 2.080 on RoboMIND, and 10.343 on RoboTwin, with the adapted EWMBench DYN score up 0.426 on RoboTwin. Relying on this, four downstream applications on RoboTwin succeed: 500 generated trajectories added to 50 demonstrations per task raise policy success from 70% to 93%; policy evaluation reaches a Pearson correlation of 0.994 across five checkpoints; and relative success gains reach 47.7% for action selection and 20.3% for policy improvement. Qualitative generalization across trajectory, scene, object, embodiment, and viewpoint shifts highlights its potential as a general-purpose world model simulator.", "arxiv_id": "2609.12036", "arxiv_url": "https://arxiv.org/abs/2609.12036", "authors": ["Shilong Zou", "Shilin Zhang", "Yingji Zhang", "Yuhang Huang", "Yi Zhang", "Zeyuan Ding", "Han Dong", "Junwei Liao", "Yong Dai", "Jian Tang", "Xiaozhu Ju"], "brief": "Pelican-Sim 1.0 \u662f\u9762\u5411\u5177\u8eab\u667a\u80fd\u7684\u901a\u7528\u4e16\u754c\u6a21\u578b\u6a21\u62df\u5668\uff0c\u53ef\u6839\u636e\u89c6\u89c9\u4e0a\u4e0b\u6587\u548c\u673a\u5668\u4eba\u52a8\u4f5c\u9884\u6d4b\u672a\u6765\u89c2\u6d4b\uff0c\u5e76\u670d\u52a1\u4e8e\u7b56\u7565\u5b66\u4e60\u3001\u8bc4\u4f30\u548c\u52a8\u4f5c\u9009\u62e9\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u52a8\u4f5c\u7a7a\u95f4\u3001\u52a8\u4f5c-\u89c6\u89c9\u6ce8\u5165\u3001\u7a00\u758f MoE \u4e0e\u9ad8\u6548\u81ea\u56de\u5f52\u751f\u6210\uff0c\u8986\u76d6\u591a\u79cd\u673a\u5668\u4eba\u5f62\u6001\u4e0e\u4efb\u52a1\u573a\u666f\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/ZouShilong1024/Pelican-Sim1.0", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.12036", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa 28 \u7ef4\u7edf\u4e00\u52a8\u4f5c\u8868\u793a\uff0c\u8986\u76d6\u591a\u6570\u4e3b\u6d41\u673a\u5668\u4eba\u5f62\u6001\uff0c\u4f7f\u5355\u4e00\u6a21\u578b\u53ef\u8de8\u5f02\u6784\u8bbe\u5907\u4f7f\u7528\u3002", "\u7528 URDF \u548c\u76f8\u673a\u6e32\u67d3\u52a8\u4f5c\u89c6\u9891\u5b9e\u73b0\u52a8\u4f5c-\u89c6\u89c9\u6ce8\u5165\uff0c\u589e\u5f3a\u8de8\u5f62\u6001\u3001\u573a\u666f\u548c\u4efb\u52a1\u7684\u53ef\u63a7\u6027\uff0cPSNR \u8f83\u878d\u5408\u57fa\u7ebf\u63d0\u5347 0.904\u3002", "\u7a00\u758f MoE \u63d0\u5347\u5f02\u6784\u52a8\u529b\u5b66\u5efa\u6a21\u80fd\u529b\u5e76\u7f13\u89e3\u6a21\u6001\u51b2\u7a81\uff0cFVD \u8f83 dense backbone \u964d\u4f4e 6.530\uff1b\u7ed3\u5408\u56e0\u679c\u9002\u914d\u4e0e\u5c11\u6b65\u84b8\u998f\uff0c\u5c06 35 \u6b65\u6a21\u578b\u52a0\u901f\u4e3a 4 \u6b65\u81ea\u56de\u5f52\u6a21\u62df\u5668\uff0c\u901f\u5ea6\u63d0\u5347 5.67 \u500d\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u5b66\u4e60", "\u6df7\u5408\u4e13\u5bb6"], "num_comments": 2, "on_hf": true, "organization": "X-Humanoid", "pdf_url": "https://arxiv.org/pdf/2609.12036", "published_at": "2026-09-10", "score": 0.242, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.12036.png", "title": "Pelican-Sim 1.0: A General World Model Simulator for Embodied Intelligence", "tldr": "\u901a\u7528\u5177\u8eab\u4e16\u754c\u6a21\u578b\u6a21\u62df\u5668\u663e\u8457\u63d0\u5347\u673a\u5668\u4eba\u9884\u6d4b\u4e0e\u51b3\u7b56\u3002", "upvotes": 2, "what_it_is": "Pelican-Sim 1.0 \u662f\u9762\u5411\u5177\u8eab\u667a\u80fd\u7684\u901a\u7528\u4e16\u754c\u6a21\u578b\u6a21\u62df\u5668\uff0c\u53ef\u6839\u636e\u89c6\u89c9\u4e0a\u4e0b\u6587\u548c\u673a\u5668\u4eba\u52a8\u4f5c\u9884\u6d4b\u672a\u6765\u89c2\u6d4b\uff0c\u5e76\u670d\u52a1\u4e8e\u7b56\u7565\u5b66\u4e60\u3001\u8bc4\u4f30\u548c\u52a8\u4f5c\u9009\u62e9\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u52a8\u4f5c\u7a7a\u95f4\u3001\u52a8\u4f5c-\u89c6\u89c9\u6ce8\u5165\u3001\u7a00\u758f MoE \u4e0e\u9ad8\u6548\u81ea\u56de\u5f52\u751f\u6210\uff0c\u8986\u76d6\u591a\u79cd\u673a\u5668\u4eba\u5f62\u6001\u4e0e\u4efb\u52a1\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5728\u7ea6\u767e\u4e07\u6761\u771f\u5b9e\u4e0e\u4eff\u771f\u8f68\u8ff9\u4e0a\u8bad\u7ec3\uff0c\u5e76\u5728\u591a\u4e2a\u673a\u5668\u4eba\u6570\u636e\u96c6\u4e0a\u663e\u8457\u63d0\u5347\u89c6\u9891\u9884\u6d4b\u8d28\u91cf\u548c\u52a8\u4f5c\u53ef\u63a7\u6027\uff1b\u66f4\u91cd\u8981\u7684\u662f\uff0c\u5b83\u5c55\u793a\u4e86\u4e16\u754c\u6a21\u578b\u53ef\u76f4\u63a5\u63d0\u5347\u4e0b\u6e38\u7b56\u7565\u5b66\u4e60\u3001\u7b56\u7565\u8bc4\u4f30\u3001\u52a8\u4f5c\u9009\u62e9\u548c\u7b56\u7565\u6539\u8fdb\u7684\u6548\u679c\uff0c\u4f53\u73b0\u51fa\u901a\u7528\u5177\u8eab\u6a21\u62df\u5668\u4f5c\u4e3a\u673a\u5668\u4eba\u5b66\u4e60\u57fa\u7840\u8bbe\u65bd\u7684\u6f5c\u529b\u3002"}, {"abstract": "Part-aware 3D asset generation enables applications such as editing, articulation, simulation, and fabrication, yet existing methods can generate visually complete individual parts without ensuring that they form a valid physical assembly. Consequently, generated neighboring parts may interpenetrate, lack valid connections, or collapse under gravity. We propose a physics-guided framework for improving single-image part-aware 3D generation with physically compatible geometry and stable connections. Our method resolves inter-part penetration, recovers a contact graph between neighboring parts, and introduces parameterized connectors at their contact surfaces. Using feedback from physical simulation, we refine connector placement, orientation, and dimensions to improve assembly stability while preserving the generated geometry. We further introduce a physics-based evaluation protocol that complements conventional geometric metrics by directly testing assembly validity and stability under gravity. Experiments comparing against multiple part-aware 3D generators show substantial improvements in physical realizability and stability while maintaining geometric quality. We additionally validate the resulting parts through 3D printing and real-world assembly.", "arxiv_id": "2609.13146", "arxiv_url": "https://arxiv.org/abs/2609.13146", "authors": ["Yu-Rou Tuan", "Hao-Tang Tsui", "Nicolas Ugrinovic", "Kris Kitani", "Xiaoxuan Ma"], "brief": "SNAP3D\u63d0\u51fa\u4e00\u4e2a\u7269\u7406\u5f15\u5bfc\u6846\u67b6\uff0c\u7528\u4e8e\u6539\u8fdb\u5355\u56fe\u50cf\u90e8\u4ef6\u7ea73D\u751f\u6210\uff0c\u4f7f\u751f\u6210\u7684\u591a\u4e2a\u90e8\u4ef6\u4e0d\u4ec5\u5916\u89c2\u5408\u7406\uff0c\u8fd8\u80fd\u5f62\u6210\u7a33\u5b9a\u3001\u53ef\u88c5\u914d\u7684\u7269\u7406\u7ed3\u6784\u3002\u65b9\u6cd5\u901a\u8fc7\u6d88\u9664\u90e8\u4ef6\u7a7f\u63d2\u3001\u6062\u590d\u63a5\u89e6\u56fe\uff0c\u5e76\u5728\u63a5\u89e6\u9762\u52a0\u5165\u53c2\u6570\u5316\u8fde\u63a5\u4ef6\uff0c\u518d\u501f\u52a9\u7269\u7406\u4eff\u771f\u53cd\u9988\u4f18\u5316\u88c5\u914d\u7a33\u5b9a\u6027\u3002", "categories": ["cs.GR", "cs.CV"], "github_repo": "https://github.com/LucyTuan/SNAP3D", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2609.13146", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u73b0\u6709\u90e8\u4ef6\u7ea73D\u751f\u6210\u4e2d\u5e38\u89c1\u7684\u90e8\u4ef6\u4e92\u76f8\u7a7f\u900f\u3001\u7f3a\u5c11\u8fde\u63a5\u3001\u91cd\u529b\u4e0b\u574d\u584c\u7b49\u95ee\u9898\uff0c\u5f15\u5165\u7269\u7406\u7ea6\u675f\u8fdb\u884c\u540e\u5904\u7406\u4e0e\u4f18\u5316\u3002", "\u6784\u5efa\u90bb\u63a5\u90e8\u4ef6\u7684\u63a5\u89e6\u56fe\uff0c\u5e76\u5728\u63a5\u89e6\u533a\u57df\u751f\u6210\u53ef\u8c03\u53c2\u6570\u531 \u5e94\u7528\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We study adaptive routing of prompts to large language model (LLM) experts to maximize response quality in an online setting with limited feedback. We formulate it as a bandit problem with $K$ actions that represent experts and $d$ features that encode prompts, over a horizon of $T$ rounds. We propose algorithms that strategically select and observe rewards to minimize regret. In the full-information setting, we achieve a regret of $\\tilde{O}(d T / \\sqrt{m})$, while in the bandit setting we achieve $\\tilde{O}(d T \\sqrt{K / m})$, where $m \\ll T$ is a budget on feedback. Our experiments show that we efficiently learn high-quality routing strategies across diverse LLMs from limited feedback.", "arxiv_id": "2609.05820", "arxiv_url": "https://arxiv.org/abs/2609.05820", "authors": ["Wang Wei", "Soumyabrata Pal", "Koyel Mukherjee", "Franck Dernoncourt", "Ryan A. Rossi", "Branislav Kveton", "Hoda Eldardiry"], "brief": "\u8bba\u6587\u5c06\u63d0\u793a\u8bcd\u81ea\u9002\u5e94\u8def\u7531\u5230\u4e0d\u540cLLM\u4e13\u5bb6\u7684\u95ee\u9898\u5efa\u6a21\u4e3a\u5e26\u4e0a\u4e0b\u6587\u7684\u591a\u81c2\u8001\u864e\u673a\uff0c\u5728\u53cd\u9988\u9884\u7b97\u6709\u9650\u7684\u5728\u7ebf\u573a\u666f\u4e2d\u6700\u5927\u5316\u56de\u7b54\u8d28\u91cf\u3002\u4f5c\u8005\u63d0\u51fa\u4e86\u5168\u4fe1\u606f\u4e0ebandit\u8bbe\u7f6e\u4e0b\u7684\u7b97\u6cd5\uff0c\u5e76\u7ed9\u51fa\u9057\u61be\u754c\u5206\u6790\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05820", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06LLM\u4e13\u5bb6\u9009\u62e9\u5efa\u6a21\u4e3aK\u4e2a\u52a8\u4f5c\u3001d\u7ef4\u63d0\u793a\u7279\u5f81\u3001T\u8f6e\u4ea4\u4e92\u7684\u5728\u7ebf\u5b66\u4e60\u95ee\u9898", "\u5728\u5168\u4fe1\u606f\u8bbe\u7f6e\u4e0b\u8fbe\u5230\u7ea6O(dT/\u221am)\u9057\u61be\uff0c\u5728bandit\u8bbe\u7f6e\u4e0b\u8fbe\u5230\u7ea6O(dT\u221a(K/m))\u9057\u61be\uff0c\u5176\u4e2dm\u662f\u8fdc\u5c0f\u4e8eT\u7684\u53cd\u9988\u9884\u7b97", "\u5b9e\u9a8c\u663e\u793a\u53ef\u5728\u6709\u9650\u53cd\u9988\u4e0b\u5b66\u4e60\u5230\u8de8\u591a\u79cdLLM\u7684\u9ad8\u8d28\u91cf\u8def\u7531\u7b56\u7565"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5728\u7ebf\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u8001\u864e\u673a", "\u6a21\u578b\u8def\u7531"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05820", "published_at": "2026-09-05", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05820.png", "title": "Online Learning with LLM Experts from Limited Feedback", "tldr": "\u7528\u6709\u9650\u53cd\u9988\u5728\u7ebf\u5b66\u4e60\u8def\u7531\u5230\u6700\u4f73LLM\u4e13\u5bb6", "upvotes": 5, "what_it_is": "\u8bba\u6587\u5c06\u63d0\u793a\u8bcd\u81ea\u9002\u5e94\u8def\u7531\u5230\u4e0d\u540cLLM\u4e13\u5bb6\u7684\u95ee\u9898\u5efa\u6a21\u4e3a\u5e26\u4e0a\u4e0b\u6587\u7684\u591a\u81c2\u8001\u864e\u673a\uff0c\u5728\u53cd\u9988\u9884\u7b97\u6709\u9650\u7684\u5728\u7ebf\u573a\u666f\u4e2d\u6700\u5927\u5316\u56de\u7b54\u8d28\u91cf\u3002\u4f5c\u8005\u63d0\u51fa\u4e86\u5168\u4fe1\u606f\u4e0ebandit\u8bbe\u7f6e\u4e0b\u7684\u7b97\u6cd5\uff0c\u5e76\u7ed9\u51fa\u9057\u61be\u754c\u5206\u6790\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u591aLLM\u7cfb\u7edf\u4e2d\u7684\u4e13\u5bb6\u8def\u7531\u63d0\u4f9b\u4e86\u7406\u8bba\u5316\u7684\u5728\u7ebf\u5b66\u4e60\u6846\u67b6\uff0c\u5c24\u5176\u5173\u6ce8\u771f\u5b9e\u5e94\u7528\u4e2d\u53cd\u9988\u7a00\u7f3a\u7684\u95ee\u9898\uff0c\u5bf9\u964d\u4f4e\u8bc4\u4f30\u6210\u672c\u3001\u63d0\u5347\u6a21\u578b\u7ec4\u5408\u6548\u679c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are rapidly evolving from conversational assistants into agentic AI systems that reason, plan, invoke tools, maintain persistent memory, communicate with other agents, and execute multi-step tasks. At the same time, modern models exhibit substantially stronger native safety alignment than earlier generations on which many jailbreak attacks and defenses were originally studied. This shift raises a fundamental question: \\textit{which established jailbreak-security findings remain valid in the era of modern LLMs and agentic AI?} We address this question through a Systematization of Knowledge (SoK) that reframes jailbreak security around the full agentic execution pipeline. We develop unified taxonomies of attacks and defenses spanning user interaction, planning and reasoning, memory, tool use, and inter-agent communication, and introduce a security--utility--efficiency evaluation framework that separates native harmful-prompt safety, adversarial jailbreak robustness, and agent-level security outcomes. We further conduct a controlled empirical study of representative attacks and defenses within a common agentic framework. Our results reveal three important gaps. First, strong native alignment does not imply robustness to adversarial jailbreaks. Second, defense effectiveness is highly model-, attack-, and component-dependent and can come at substantial cost in over-refusal, utility, and latency. Third, low final-response attack success can mask severe intermediate compromise: planning, memory, and tool interactions may remain unsafe even when the final response is successfully filtered. These findings motivate a shift from response-centric jailbreak defense toward cross-layer, execution-aware security that protects agent state, component transitions, and external actions while preserving practical utility and efficiency.", "arxiv_id": "2609.12413", "arxiv_url": "https://arxiv.org/abs/2609.12413", "authors": ["Md Jueal Mia", "Yanzhao Wu", "Selcuk Uluagac", "M. Hadi Amini"], "brief": "\u8fd9\u7bc7 SoK \u8bba\u6587\u91cd\u65b0\u68b3\u7406\u4e86\u667a\u80fd\u4f53\u65f6\u4ee3\u7684\u8d8a\u72f1\u5b89\u5168\u95ee\u9898\uff0c\u5c06\u653b\u51fb\u4e0e\u9632\u5fa1\u6269\u5c55\u5230\u7528\u6237\u4ea4\u4e92\u3001\u89c4\u5212\u63a8\u7406\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u8c03\u7528\u548c\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u7b49\u5b8c\u6574\u6267\u884c\u94fe\u8def\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u73b0\u4ee3\u5927\u6a21\u578b\u7684\u539f\u751f\u5b89\u5168\u5bf9\u9f50\u5e76\u4e0d\u7b49\u4e8e\u80fd\u62b5\u6297\u5bf9\u6297\u6027\u8d8a\u72f1\uff0c\u4e14\u4ec5\u770b\u6700\u7ec8\u56de\u590d\u4f1a\u63a9\u76d6\u89c4\u5212\u3001\u8bb0\u5fc6\u548c\u5de5\u5177\u73af\u8282\u7684\u4e2d\u95f4\u5c42\u98ce\u9669\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12413", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12413", "published_at": "2026-09-11", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SoK: Rethinking Jailbreaking in the Era of Agentic AI: Attacks, Defenses, and Practical Consideration", "tldr": "\u8fd9\u7bc7 SoK \u8bba\u6587\u91cd\u65b0\u68b3\u7406\u4e86\u667a\u80fd\u4f53\u65f6\u4ee3\u7684\u8d8a\u72f1\u5b89\u5168\u95ee\u9898\uff0c\u5c06\u653b\u51fb\u4e0e\u9632\u5fa1\u6269\u5c55\u5230\u7528\u6237\u4ea4\u4e92\u3001\u89c4\u5212\u63a8\u7406\u3001\u8bb0\u5fc6\u3001\u5de5\u5177\u8c03\u7528\u548c\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u7b49\u5b8c\u6574\u6267\u884c\u94fe\u8def\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u73b0\u4ee3\u5927\u6a21\u578b\u7684\u539f\u751f\u5b89\u5168\u5bf9\u9f50\u5e76\u4e0d\u7b49\u4e8e\u80fd\u62b5\u6297\u5bf9\u6297\u6027\u8d8a\u72f1\uff0c\u4e14\u4ec5\u770b\u6700\u7ec8\u56de\u590d\u4f1a\u63a9\u76d6\u89c4\u5212\u3001\u8bb0\u5fc6\u548c\u5de5\u5177\u73af\u8282\u7684\u4e2d\u95f4\u5c42\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic pipelines for structured-query generation are rapidly expanding, but it is unclear which part of the loop produces the gain. We use LAST-CQ -- a five-agent, training-free, execution-grounded Text-to-Cypher framework -- as an instrumented testbed, running three counterfactuals over 2,471 live-database queries and six backbones spanning three vendor scale tiers. Removing correction is worth between 3.1% aggregate execution-BLEU against the single-pass system and 12.3% against a no-refinement counterfactual (up to 80.7% for the weakest backbone). Replacing schema-grounded, LLM-synthesised feedback with raw database error strings costs almost nothing (20.9% vs. 19.9% naive exact match; \u003c0.2% end-to-end; equivalent within $\\pm 0.075$ set-F1 by two one-sided tests). Spending the same call budget on parallel sampling degrades quality by 10-11%. What works is detecting failure and routing it to a retry, not the feedback sophistication or number of samples. LAST-CQ itself recovers 91.7% of queries that fail under single-pass generation, while a query that succeeds first time still costs exactly one LLM call. We also show that n-gram overlap on serialised results is not a bound in either direction: it over-scores against set equivalence on 65.9% of results while under-scoring against judged semantics. Finally, we calibrate our LLM judge against blind human labels and find it optimistic by 9 points.", "arxiv_id": "2609.12746", "arxiv_url": "https://arxiv.org/abs/2609.12746", "authors": ["Ioannis Prokopiou", "Athanasios Aidinis", "Panagiotis-Christos Kyrmpatsos", "Pantelis Vikatos"], "brief": "\u672c\u6587\u7528 LAST-CQ \u8fd9\u4e00\u514d\u8bad\u7ec3\u3001\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u7684\u4e94\u667a\u80fd\u4f53 Text-to-Cypher \u6846\u67b6\u505a\u6d88\u878d\u5b9e\u9a8c\uff0c\u5206\u6790\u7ed3\u6784\u5316\u67e5\u8be2\u751f\u6210\u4e2d\u81ea\u6211\u4fee\u6b63\u6536\u76ca\u6765\u81ea\u54ea\u91cc\u3002\u7ed3\u679c\u663e\u793a\uff0c\u771f\u6b63\u6709\u6548\u7684\u662f\u68c0\u6d4b\u5931\u8d25\u5e76\u89e6\u53d1\u91cd\u8bd5\uff0c\u800c\u4e0d\u662f\u590d\u6742\u53cd\u9988\u6216\u5e76\u884c\u91c7\u6837\uff1bLAST-CQ \u53ef\u6062\u590d\u5355\u6b21\u751f\u6210\u5931\u8d25\u67e5\u8be2\u7684 91.7%\uff0c\u4e14\u9996\u6b21\u6210\u529f\u53ea\u9700\u4e00\u6b21 LLM \u8c03\u7528\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12746", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u672c\u5230\u67e5\u8be2", "\u81ea\u6211\u4fee\u6b63", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12746", "published_at": "2026-09-11", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "What Drives Recovery in Agentic Text-to-Cypher? LAST-CQ: An LLM Agent Self-Refinement Framework", "tldr": "\u672c\u6587\u7528 LAST-CQ \u8fd9\u4e00\u514d\u8bad\u7ec3\u3001\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u7684\u4e94\u667a\u80fd\u4f53 Text-to-Cypher \u6846\u67b6\u505a\u6d88\u878d\u5b9e\u9a8c\uff0c\u5206\u6790\u7ed3\u6784\u5316\u67e5\u8be2\u751f\u6210\u4e2d\u81ea\u6211\u4fee\u6b63\u6536\u76ca\u6765\u81ea\u54ea\u91cc\u3002\u7ed3\u679c\u663e\u793a\uff0c\u771f\u6b63\u6709\u6548\u7684\u662f\u68c0\u6d4b\u5931\u8d25\u5e76\u89e6\u53d1\u91cd\u8bd5\uff0c\u800c\u4e0d\u662f\u590d\u6742\u53cd\u9988\u6216\u5e76\u884c\u91c7\u6837\uff1bLAST-CQ \u53ef\u6062\u590d\u5355\u6b21\u751f\u6210\u5931\u8d25\u67e5\u8be2\u7684 91.7%\uff0c\u4e14\u9996\u6b21\u6210\u529f\u53ea\u9700\u4e00\u6b21 LLM \u8c03\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present our submission to the EgoProactive track of the ECCV 2026 Wearable AI Challenge, which ranked first in the large-model division and second in the \u003c=2B division. The task requires a wearable assistant to decide after each eight-second segment of egocentric video whether to intervene or remain silent. Our approach has two main components. First, we reformulate intervention timing as single-token classification. Rather than generating either $interrupt$\u003cutterance\u003e or $silent$, the model predicts yes or no, and we derive the decision from the renormalised probabilities of these two tokens. This formulation improved macro-F1 by 0.249 and G-mean by 0.30 over free-form generation. Second, because labelled data were limited to the released validation set, we generated additional supervision using a tool-calling video agent that inspects each clip and assigns intervention timestamps. A narration-only alternative was four times larger and ten times cheaper, but transferred worse than supervision from an unrelated real corpus, suggesting that visual grounding is more important than annotation volume for this task.", "arxiv_id": "2609.07099", "arxiv_url": "https://arxiv.org/abs/2609.07099", "authors": ["Logesh Kumar Umapathi"], "brief": "\u672c\u6587\u662f ECCV 2026 Wearable AI Challenge EgoProactive \u8d5b\u9053\u65b9\u6848\uff0c\u9762\u5411\u53ef\u7a7f\u6234\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\uff0c\u5224\u65ad\u6bcf 8 \u79d2\u7247\u6bb5\u540e\u662f\u5426\u5e94\u4e3b\u52a8\u5e72\u9884\u3002\u65b9\u6cd5\u5c06\u5e72\u9884\u65f6\u673a\u6539\u5199\u4e3a yes/no \u5355 token \u5206\u7c7b\uff0c\u5e76\u7528\u5de5\u5177\u8c03\u7528\u89c6\u9891\u667a\u80fd\u4f53\u751f\u6210\u5e26\u89c6\u89c9\u4f9d\u636e\u7684\u989d\u5916\u76d1\u7763\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/ambient-intelligence-hq/egoproactive-verbalizer", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07099", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u539f\u672c\u751f\u6210\u201cinterrupt+\u8bdd\u8bed\u201d\u6216\u201csilent\u201d\u7684\u4efb\u52a1\u6539\u4e3a yes/no \u5355 token \u5206\u7c7b\uff0c\u5e76\u57fa\u4e8e\u4e24\u4e2a token \u7684\u91cd\u5f52\u4e00\u5316\u6982\u7387\u505a\u51b3\u7b56\u3002", "\u76f8\u6bd4\u81ea\u7531\u751f\u6210\uff0c\u5355 token \u5206\u7c7b\u5c06 macro-F1 \u63d0\u5347 0.249\u3001G-mean \u63d0\u5347 0.30\u3002", "\u989d\u5916\u76d1\u7763\u7531\u5de5\u5177\u8c03\u7528\u89c6\u9891\u667a\u80fd\u4f53\u9010\u7247\u6bb5\u68c0\u67e5\u5e76\u6807\u6ce8\u5e72\u9884\u65f6\u95f4\uff1b\u7ed3\u679c\u8868\u660e\u89c6\u89c9 grounding \u6bd4\u5355\u7eaf\u6269\u5927\u6807\u6ce8\u91cf\u66f4\u5173\u952e\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u591a\u6a21\u6001", "\u53ef\u7a7f\u6234AI"], "num_comments": 2, "on_hf": true, "organization": "Ambient Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.07099", "published_at": "2026-09-10", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07099.png", "title": "Ambient @ EgoProactive 2026 : Proactive Egocentric Assistance with Visually Grounded Supervision", "tldr": "\u7528\u89c6\u89c9\u76d1\u7763\u63d0\u5347\u7b2c\u4e00\u89c6\u89d2\u4e3b\u52a8\u8f85\u52a9", "upvotes": 3, "what_it_is": "\u672c\u6587\u662f ECCV 2026 Wearable AI Challenge EgoProactive \u8d5b\u9053\u65b9\u6848\uff0c\u9762\u5411\u53ef\u7a7f\u6234\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\uff0c\u5224\u65ad\u6bcf 8 \u79d2\u7247\u6bb5\u540e\u662f\u5426\u5e94\u4e3b\u52a8\u5e72\u9884\u3002\u65b9\u6cd5\u5c06\u5e72\u9884\u65f6\u673a\u6539\u5199\u4e3a yes/no \u5355 token \u5206\u7c7b\uff0c\u5e76\u7528\u5de5\u5177\u8c03\u7528\u89c6\u9891\u667a\u80fd\u4f53\u751f\u6210\u5e26\u89c6\u89c9\u4f9d\u636e\u7684\u989d\u5916\u76d1\u7763\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u6311\u6218\u8d5b\u5927\u6a21\u578b\u7ec4\u7b2c\u4e00\u3001\u22642B \u7ec4\u7b2c\u4e8c\uff0c\u5c55\u793a\u4e86\u7b80\u5355\u5224\u522b\u5f0f\u91cd\u6784\u548c\u89c6\u89c9 grounded \u76d1\u7763\u5728\u53ef\u7a7f\u6234\u4e3b\u52a8\u52a9\u624b\u4e2d\u7684\u5b9e\u7528\u4ef7\u503c\uff0c\u4e5f\u4e3a\u4f4e\u8d44\u6e90\u7b2c\u4e00\u89c6\u89d2\u667a\u80fd\u4f53\u8bad\u7ec3\u63d0\u4f9b\u4e86\u7ecf\u9a8c\u3002"}, {"abstract": "3D point-cloud observations are inherently ambiguous in complex, cluttered manipulation scenes, where target objects may be partially occluded or tightly intermingled with visually similar distractors. As a result, standard 3D diffusion policies often struggle to localize and exploit task-relevant geometry as scene complexity grows. We propose \\textbf{Attention-DP3}, a spatially object-aware 3D diffusion policy that injects object-level geometric cues via attention while keeping the DP3 diffusion backbone unchanged. Our pipeline performs open-vocabulary 2D segmentation on RGB images, then lifts predicted target masks into 3D using calibrated camera geometry to obtain object-centric geometric priors. We incorporate these cues through Tri-field Attentional Conditioning, which constructs three complementary fields: (i) a targetness field to anchor the target object, (ii) an intra-target saliency field to emphasize task-relevant geometry within the target, and (iii) a backgroundness field to suppress distractors and clutter. Experiments on Adroit, DexArt, MetaWorld, and the real-world SO101 platform show consistent improvements over DP3, achieving state-of-the-art performance across benchmarks. Notably, as distractor objects increase, DP3 drops sharply, whereas Attention-DP3 remains stable and outperforms DP3 by up to 31\\% under heavy clutter. The code is publicly available at https://github.com/zhangzhongbo2213/Attention-DP3.", "arxiv_id": "2609.13318", "arxiv_url": "https://arxiv.org/abs/2609.13318", "authors": ["Changbo Yan", "Zhongbo Zhang", "Zaibin Zhang", "Yifan Wang", "Lijun Wang", "Huchuan Lu"], "brief": "\u8bba\u6587\u63d0\u51fa Attention-DP3\uff0c\u5728\u4e0d\u6539\u53d8 DP3 \u6269\u6563\u9aa8\u5e72\u7684\u524d\u63d0\u4e0b\uff0c\u5c06\u5f00\u653e\u8bcd\u6c472D\u5206\u5272\u5f97\u5230\u7684\u76ee\u6807\u63a9\u7801\u63d0\u5347\u52303D\uff0c\u4f5c\u4e3a\u7269\u4f53\u7ea7\u51e0\u4f55\u5148\u9a8c\u6ce8\u5165\u7b56\u7565\u3002\u901a\u8fc7\u51e0\u4f55\u5bf9\u9f50\u7684\u6ce8\u610f\u529b\u6761\u4ef6\uff0c\u8ba9\u673a\u5668\u4eba\u5728\u906e\u6321\u3001\u6742\u4e71\u548c\u76f8\u4f3c\u5e72\u6270\u7269\u573a\u666f\u4e2d\u66f4\u7a33\u5b9a\u5730\u5b9a\u4f4d\u5e76\u5229\u7528\u4efb\u52a1\u76f8\u5173\u51e0\u4f55\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/zhangzhongbo2213/Attention-DP3", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.13318", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5148\u5728RGB\u56fe\u50cf\u4e0a\u505a\u5f00\u653e\u8bcd\u6c472D\u5206\u5272\uff0c\u518d\u5229\u7528\u76f8\u673a\u6807\u5b9a\u5c06\u76ee\u6807\u63a9\u7801\u63d0\u5347\u5230\u70b9\u4e91\u7a7a\u95f4\uff0c\u83b7\u5f97\u7269\u4f53\u4e2d\u5fc3\u76843D\u51e0\u4f55\u63d0\u793a\u3002", "\u63d0\u51fa Tri-field Attentional Conditioning\uff1a\u76ee\u6807\u6027\u573a\u951a\u5b9a\u76ee\u6807\u7269\u4f53\uff0c\u76ee\u6807\u5185\u663e\u8457\u6027\u573a\u7a81\u51fa\u5173\u952e\u51e0\u4f55\uff0c\u80cc\u666f\u6027\u573a\u6291\u5236\u5e72\u6270\u7269\u548c\u6742\u4e71\u80cc\u666f\u3002", "\u5728 Adroit\u3001DexArt\u3001MetaWorld \u548c\u771f\u5b9e SO101 \u5e73\u53f0\u4e0a\u5747\u4f18\u4e8e DP3\uff1b\u91cd\u5ea6\u6742\u4e71\u573a\u666f\u4e0b\u76f8\u5bf9 DP3 \u6700\u9ad8\u63d0\u534731%\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u6269\u6563\u7b56\u7565", "\u4e09\u7ef4\u611f\u77e5", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "DaLian University of Technology", "pdf_url": "https://arxiv.org/pdf/2609.13318", "published_at": "2026-09-10", "score": 0.212, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13318.png", "title": "Attention-DP3: Spatially Object-aware 3D Diffusion Policy via Geometry-aligned Attentional Conditioning", "tldr": "\u7528\u76ee\u6807\u611f\u77e5\u6ce8\u610f\u529b\u589e\u5f3a3D\u6269\u6563\u64cd\u4f5c\u7b56\u7565", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Attention-DP3\uff0c\u5728\u4e0d\u6539\u53d8 DP3 \u6269\u6563\u9aa8\u5e72\u7684\u524d\u63d0\u4e0b\uff0c\u5c06\u5f00\u653e\u8bcd\u6c472D\u5206\u5272\u5f97\u5230\u7684\u76ee\u6807\u63a9\u7801\u63d0\u5347\u52303D\uff0c\u4f5c\u4e3a\u7269\u4f53\u7ea7\u51e0\u4f55\u5148\u9a8c\u6ce8\u5165\u7b56\u7565\u3002\u901a\u8fc7\u51e0\u4f55\u5bf9\u9f50\u7684\u6ce8\u610f\u529b\u6761\u4ef6\uff0c\u8ba9\u673a\u5668\u4eba\u5728\u906e\u6321\u3001\u6742\u4e71\u548c\u76f8\u4f3c\u5e72\u6270\u7269\u573a\u666f\u4e2d\u66f4\u7a33\u5b9a\u5730\u5b9a\u4f4d\u5e76\u5229\u7528\u4efb\u52a1\u76f8\u5173\u51e0\u4f55\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf93D\u6269\u6563\u7b56\u7565\u5728\u590d\u6742\u64cd\u4f5c\u573a\u666f\u4e2d\u96be\u4ee5\u533a\u5206\u76ee\u6807\u4e0e\u5e72\u6270\u7269\u7684\u75db\u70b9\uff0c\u5f15\u5165\u5f00\u653e\u8bcd\u6c47\u611f\u77e5\u4e0e\u51e0\u4f55\u5bf9\u9f50\u6ce8\u610f\u529b\uff0c\u5728\u4fdd\u6301\u539f\u6709\u6269\u6563\u9aa8\u5e72\u4e0d\u53d8\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u9c81\u68d2\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "In hybrid forecasting, a language model is often one of several available signals. A system may already have a market, crowd, or statistical forecast and must decide whether the model adds useful information or should be ignored. The relevant target is therefore not standalone model accuracy, but relative competence, defined as the model\u0027s marginal value beyond the available external forecast. Under Brier loss, we characterize when model disagreement can improve an external forecast and derive the gain from using domain-specific rather than global pooling weights. We then introduce a competence gate that estimates domain-level source weights from resolved outcomes, shrinks uncertain estimates toward a global weight, and recalibrates the pooled forecast. Across 2,357 resolved binary questions and five language models, the gate improves the main external baseline from 0.0771 to 0.0732 Brier and significantly outperforms global forecast combinations. The gain remains significant under leakage controls and against a leakage-safe time-series prior on the pooled structured set, with separate evidence on FRED. In contrast, the gate gives no significant improvement on the official ForecastBench market subset, where it largely defers to the market. Across four Qwen models, verbal confidence does not reliably identify when the model outperforms the external forecast, while outcome-estimated competence supports better abstention decisions. These results provide a practical approach for selective model use based on measured marginal value.", "arxiv_id": "2609.12101", "arxiv_url": "https://arxiv.org/abs/2609.12101", "authors": ["Aditi Tiwari", "Aashrith Bandaru", "Heng Ji"], "brief": "\u8bba\u6587\u7814\u7a76\u6df7\u5408\u4e8b\u4ef6\u9884\u6d4b\u4e2d\u8bed\u8a00\u6a21\u578b\u76f8\u5bf9\u5916\u90e8\u57fa\u7ebf\u7684\u201c\u8fb9\u9645\u4ef7\u503c\u201d\uff0c\u800c\u975e\u5355\u72ec\u51c6\u786e\u7387\u3002\u4f5c\u8005\u63d0\u51fa competence gate\uff0c\u6839\u636e\u5df2\u63ed\u6653\u7ed3\u679c\u4f30\u8ba1\u4e0d\u540c\u9886\u57df\u7684\u6a21\u578b\u4e0e\u5916\u90e8\u9884\u6d4b\u6743\u91cd\uff0c\u5e76\u5728\u4e0d\u786e\u5b9a\u65f6\u5411\u5168\u5c40\u6743\u91cd\u6536\u7f29\u3001\u518d\u6821\u51c6\u6700\u7ec8\u9884\u6d4b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12101", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 Brier loss \u4e0b\u523b\u753b\u6a21\u5
