78b\u5206\u6b67\u4f55\u65f6\u80fd\u6539\u8fdb\u5916\u90e8\u9884\u6d4b\uff0c\u5e76\u63a8\u5bfc\u9886\u57df\u7279\u5b9a\u6c60\u5316\u6743\u91cd\u76f8\u5bf9\u5168\u5c40\u6743\u91cd\u7684\u6536\u76ca\u3002", "\u5728 2357 \u4e2a\u5df2\u89e3\u51b3\u4e8c\u5206\u7c7b\u95ee\u9898\u548c 5 \u4e2a\u8bed\u8a00\u6a21\u578b\u4e0a\uff0c\u5c06\u4e3b\u8981\u5916\u90e8\u57fa\u7ebf Brier \u4ece 0.0771 \u964d\u81f3 0.0732\uff0c\u663e\u8457\u4f18\u4e8e\u5168\u5c40\u7ec4\u5408\u65b9\u6cd5\u3002", "Qwen \u7cfb\u5217\u5b9e\u9a8c\u663e\u793a\uff0c\u8bed\u8a00\u6a21\u578b\u7684\u53e3\u5934\u7f6e\u4fe1\u5ea6\u4e0d\u80fd\u53ef\u9760\u5224\u65ad\u5176\u662f\u5426\u4f18\u4e8e\u5916\u90e8\u9884\u6d4b\uff0c\u800c\u57fa\u4e8e\u7ed3\u679c\u4f30\u8ba1\u7684\u80fd\u529b\u66f4\u9002\u5408\u51b3\u5b9a\u662f\u5426\u5f03\u7528\u6a21\u578b\u3002"], "keywords": ["\u4e8b\u4ef6\u9884\u6d4b", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u96c6\u6210", "\u6821\u51c6"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2609.12101", "published_at": "2026-09-10", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.12101.png", "title": "Competence-Gated Pooling of Language Models and Priors for Event Forecasting", "tldr": "\u7528\u80fd\u529b\u95e8\u63a7\u5224\u65ad\u8bed\u8a00\u6a21\u578b\u4f55\u65f6\u8be5\u53c2\u4e0e\u9884\u6d4b", "upvotes": 2, "what_it_is": "\u8bba\u6587\u7814\u7a76\u6df7\u5408\u4e8b\u4ef6\u9884\u6d4b\u4e2d\u8bed\u8a00\u6a21\u578b\u76f8\u5bf9\u5916\u90e8\u57fa\u7ebf\u7684\u201c\u8fb9\u9645\u4ef7\u503c\u201d\uff0c\u800c\u975e\u5355\u72ec\u51c6\u786e\u7387\u3002\u4f5c\u8005\u63d0\u51fa competence gate\uff0c\u6839\u636e\u5df2\u63ed\u6653\u7ed3\u679c\u4f30\u8ba1\u4e0d\u540c\u9886\u57df\u7684\u6a21\u578b\u4e0e\u5916\u90e8\u9884\u6d4b\u6743\u91cd\uff0c\u5e76\u5728\u4e0d\u786e\u5b9a\u65f6\u5411\u5168\u5c40\u6743\u91cd\u6536\u7f29\u3001\u518d\u6821\u51c6\u6700\u7ec8\u9884\u6d4b\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u8bed\u8a00\u6a21\u578b\u7528\u4e8e\u9884\u6d4b\u7684\u6838\u5fc3\u95ee\u9898\u4ece\u201c\u6a21\u578b\u51c6\u4e0d\u51c6\u201d\u8f6c\u5411\u201c\u76f8\u5bf9\u5df2\u6709\u5e02\u573a\u3001\u7fa4\u4f53\u6216\u7edf\u8ba1\u9884\u6d4b\u662f\u5426\u6709\u589e\u91cf\u4ef7\u503c\u201d\uff0c\u63d0\u4f9b\u4e86\u53ef\u843d\u5730\u7684\u9009\u62e9\u6027\u4f7f\u7528\u4e0e\u5f03\u7528\u673a\u5236\uff0c\u5bf9\u771f\u5b9e\u9884\u6d4b\u7cfb\u7edf\u66f4\u5b9e\u7528\u3002"}, {"abstract": "Objects in post-fire environments often undergo irreversible physical transformations that change their geometry, material state, and visual appearance. Detecting and identifying these remnants is critical for locating hazards, reconstructing pre-incident contents, and inventorying losses. Unlike standard image corruptions, these degradations affect the physical structure of the object itself. To study this setting, we introduce TRACE, a transformation-aware benchmark for post-fire object understanding. TRACE contains 21.4K real-image-grounded synthetic scenes and paired object-level pristine-to-degraded progressions spanning 499 object identities across 189 categories. We define five tasks targeting localization and pre-degradation understanding: degraded-object detection, pristine-state recovery and retrieval, original material recovery, pristine description generation, and functional reasoning. Existing models degrade sharply with severity. From the least to the most severe level, RF-DETR mAP decreases by 71% relative, while InternVL3.5 retrieval R@1 falls from 93.85 to 28.11. To address this, we propose the Feature Recovery Module (FRM), a plug-and-play module that maps degraded encoder features to pristine-aligned representations while keeping the host frozen. Trained only with paired feature supervision, FRM improves scene-level detection, CLIP/SigLIP2 feature recovery, and all four object-level VLM tasks, with larger gains under more severe degradation. Across VLM hosts and severity levels, relative gains average 12.5% for retrieval, 20.1% for material recovery, 13.2% for description generation, and 12.4% for functional reasoning.", "arxiv_id": "2609.12078", "arxiv_url": "https://arxiv.org/abs/2609.12078", "authors": ["Aditi Tiwari", "Sofia Stoica", "Savya Khosla", "David Forsyth", "Heng Ji"], "brief": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u4e2a\u9762\u5411\u706b\u707e\u540e\u4e0d\u53ef\u9006\u635f\u6bc1\u7269\u4f53\u7406\u89e3\u7684\u57fa\u51c6\uff0c\u8986\u76d6\u68c0\u6d4b\u3001\u539f\u59cb\u72b6\u6001\u6062\u590d\u3001\u6750\u8d28\u8bc6\u522b\u3001\u63cf\u8ff0\u751f\u6210\u548c\u529f\u80fd\u63a8\u7406\u7b49\u4efb\u52a1\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u5373\u63d2\u5373\u7528\u7684 Feature Recovery Module\uff0c\u5c06\u635f\u6bc1\u7279\u5f81\u6620\u5c04\u5230\u63a5\u8fd1\u539f\u59cb\u7269\u4f53\u7684\u8868\u5f81\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12078", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["TRACE \u5305\u542b 2.14 \u4e07\u4e2a\u57fa\u4e8e\u771f\u5b9e\u56fe\u50cf\u7684\u5408\u6210\u573a\u666f\uff0c\u8986\u76d6 499 \u4e2a\u7269\u4f53\u8eab\u4efd\u3001189 \u4e2a\u7c7b\u522b\uff0c\u5e76\u63d0\u4f9b\u4ece\u5b8c\u597d\u5230\u635f\u6bc1\u7684\u5bf9\u8c61\u7ea7\u914d\u5bf9\u8fc7\u7a0b\u3002", "\u73b0\u6709\u89c6\u89c9\u4e0e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u635f\u6bc1\u52a0\u5267\u65f6\u6027\u80fd\u5927\u5e45\u4e0b\u964d\uff0c\u4f8b\u5982 RF-DETR mAP \u76f8\u5bf9\u4e0b\u964d 71%\uff0cInternVL3.5 \u68c0\u7d22 R@1 \u4ece 93.85 \u964d\u81f3 28.11\u3002", "FRM \u5728\u51bb\u7ed3\u5bbf\u4e3b\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\uff0c\u4ec5\u7528\u914d\u5bf9\u7279\u5f81\u76d1\u7763\u8bad\u7ec3\uff0c\u53ef\u63d0\u5347\u68c0\u6d4b\u3001CLIP/SigLIP2 \u7279\u5f81\u6062\u590d\u53ca\u591a\u9879 VLM \u4efb\u52a1\uff0c\u4e25\u91cd\u635f\u6bc1\u573a\u666f\u6536\u76ca\u66f4\u660e\u663e\u3002"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7279\u5f81\u6062\u590d", "\u6570\u636e\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2609.12078", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.12078.png", "title": "Feature Recovery for Object Understanding After Irreversible Fire Damage", "tldr": "\u706b\u707e\u635f\u6bc1\u7269\u4f53\u7406\u89e3\u57fa\u51c6\u4e0e\u7279\u5f81\u6062\u590d\u6a21\u5757", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u4e2a\u9762\u5411\u706b\u707e\u540e\u4e0d\u53ef\u9006\u635f\u6bc1\u7269\u4f53\u7406\u89e3\u7684\u57fa\u51c6\uff0c\u8986\u76d6\u68c0\u6d4b\u3001\u539f\u59cb\u72b6\u6001\u6062\u590d\u3001\u6750\u8d28\u8bc6\u522b\u3001\u63cf\u8ff0\u751f\u6210\u548c\u529f\u80fd\u63a8\u7406\u7b49\u4efb\u52a1\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u5373\u63d2\u5373\u7528\u7684 Feature Recovery Module\uff0c\u5c06\u635f\u6bc1\u7279\u5f81\u6620\u5c04\u5230\u63a5\u8fd1\u539f\u59cb\u7269\u4f53\u7684\u8868\u5f81\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u89c9\u7406\u89e3\u4ece\u5e38\u89c4\u56fe\u50cf\u6270\u52a8\u6269\u5c55\u5230\u7269\u4f53\u7269\u7406\u7ed3\u6784\u88ab\u4e0d\u53ef\u9006\u6539\u53d8\u7684\u771f\u5b9e\u707e\u540e\u573a\u666f\uff0c\u5e76\u63d0\u4f9b\u7cfb\u7edf\u57fa\u51c6\u4e0e\u8f7b\u91cf\u9002\u914d\u65b9\u6cd5\uff0c\u5bf9\u707e\u5bb3\u54cd\u5e94\u3001\u635f\u5931\u76d8\u70b9\u548c\u5b89\u5168\u9690\u60a3\u5b9a\u4f4d\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Fine-grained robotic manipulation depends on understanding parts, not only whole objects. Existing 3D foundation models tend to be either generalized but object-aware, or part-aware but limited to closed-set taxonomies, which weakens zero-shot transfer. We study text-conditioned 3D part segmentation, where a free-form phrase selects a functional part on point cloud. We introduce UniPart, a feed-forward cross-modal 3D Transformer that conditions CLIP text embedding. To scale supervision, we build LangPart-1M with 160K+ Objaverse assets and 8M text to part pairs using multi-view consistent part generation. We further manually label a high-quality subset, LangPart-4K, for fine-tuning and evaluation. UniPart achieves strong zero-shot results on open-vocabulary part benchmarks and transfers to language-conditioned part grasping in real world.", "arxiv_id": "2609.12898", "arxiv_url": "https://arxiv.org/abs/2609.12898", "authors": ["Xinqiang Yu", "Zekun qi", "Jiawei He", "Wenyao Zhang", "Xuchuan Chen", "Guaocai Yao", "Li Yi", "Zhaoxiang Zhang", "He Wang"], "brief": "\u8bba\u6587\u63d0\u51fa UniPart\uff0c\u4e00\u4e2a\u6587\u672c\u6761\u4ef6\u7684\u8de8\u6a21\u60013D Transformer\uff0c\u53ef\u6839\u636e\u81ea\u7531\u8bed\u8a00\u77ed\u8bed\u5728\u70b9\u4e91\u4e2d\u5b9a\u4f4d\u5e76\u5206\u5272\u529f\u80fd\u90e8\u4ef6\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u5927\u89c4\u6a21 LangPart-1M \u6570\u636e\u96c6\u53ca\u9ad8\u8d28\u91cf LangPart-4K \u5b50\u96c6\uff0c\u7528\u4e8e\u8bad\u7ec3\u3001\u5fae\u8c03\u548c\u8bc4\u6d4b\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12898", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ee5 CLIP \u6587\u672c\u5d4c\u5165\u4e3a\u6761\u4ef6\uff0c\u76f4\u63a5\u57283D\u70b9\u4e91\u4e0a\u8fdb\u884c\u8bed\u8a00\u6307\u4ee3\u7684\u90e8\u4ef6\u5206\u5272", "\u6784\u5efa LangPart-1M\uff0c\u5305\u542b16\u4e07\u591a\u4e2a Objaverse \u8d44\u4ea7\u548c800\u4e07\u7ec4\u6587\u672c-\u90e8\u4ef6\u914d\u5bf9", "\u5728\u5f00\u653e\u8bcd\u6c47\u90e8\u4ef6\u5206\u5272\u57fa\u51c6\u4e0a\u53d6\u5f97\u5f3a\u96f6\u6837\u672c\u6548\u679c\uff0c\u5e76\u8fc1\u79fb\u5230\u771f\u5b9e\u673a\u5668\u4eba\u8bed\u8a00\u6761\u4ef6\u90e8\u4ef6\u6293\u53d6"], "keywords": ["3D\u89c6\u89c9", "\u5f00\u653e\u8bcd\u6c47", "\u673a\u5668\u4eba", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12898", "published_at": "2026-09-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "UniPart: Towards Zero-shot Language-Grounded 3D Part Segmentation for Embodied Interaction", "tldr": "UniPart\u5b9e\u73b0\u5f00\u653e\u8bcd\u6c473D\u90e8\u4ef6\u5206\u5272", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa UniPart\uff0c\u4e00\u4e2a\u6587\u672c\u6761\u4ef6\u7684\u8de8\u6a21\u60013D Transformer\uff0c\u53ef\u6839\u636e\u81ea\u7531\u8bed\u8a00\u77ed\u8bed\u5728\u70b9\u4e91\u4e2d\u5b9a\u4f4d\u5e76\u5206\u5272\u529f\u80fd\u90e8\u4ef6\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u5927\u89c4\u6a21 LangPart-1M \u6570\u636e\u96c6\u53ca\u9ad8\u8d28\u91cf LangPart-4K \u5b50\u96c6\uff0c\u7528\u4e8e\u8bad\u7ec3\u3001\u5fae\u8c03\u548c\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f25\u5408\u4e86\u901a\u75283D\u57fa\u7840\u6a21\u578b\u7f3a\u4e4f\u90e8\u4ef6\u7406\u89e3\u3001\u4f20\u7edf\u90e8\u4ef6\u6a21\u578b\u4f9d\u8d56\u5c01\u95ed\u7c7b\u522b\u7684\u95ee\u9898\uff0c\u5bf9\u7cbe\u7ec6\u5316\u673a\u5668\u4eba\u64cd\u4f5c\u548c\u5177\u8eab\u4ea4\u4e92\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A single SM utilization percentage can make an LLM inference workload look compute-saturated while hiding how much useful work is being done. The problem is not that the counter is wrong, but that it collapses several different mechanisms into one number. This is most severe during decode, where each request contributes only one new token and dense projection GEMMs become small-row matrix multiplications. On Hopper, the bfloat16 GMMA path executes these operations in fixed 64-row matrix fragments, so small-batch decode can fill only a small fraction of each fragment with real token rows. In this paper, we profile vLLM with FlashAttention-3 and cuBLASLt on an H100 NVL across cold prefill, warm prefill, and decode, sweeping sequence length and batch size. We replace the usual single utilization number with eight counter-validated views derived from raw Nsight Compute reports, each pinned to an NCU counter or explicit formula. Together, these views map utilization gaps to concrete mechanisms - fragment fill, occupancy limits, stall signatures, wave quantization, and kernel selection - across four production models and six per-layer kernel roles.", "arxiv_id": "2609.12923", "arxiv_url": "https://arxiv.org/abs/2609.12923", "authors": ["Mohammad Siavashi", "Gerald Q. Maguire", "Dejan Kostic", "Marco Chiesa"], "brief": "\u672c\u6587\u7cfb\u7edf\u5256\u6790 Nvidia Hopper\uff08H100 NVL\uff09\u4e0a LLM \u63a8\u7406\u7684 GPU \u5229\u7528\u7387\uff0c\u6307\u51fa\u5355\u4e00 SM \u5229\u7528\u7387\u4f1a\u63a9\u76d6\u771f\u5b9e\u6709\u6548\u8ba1\u7b97\u3002\u4f5c\u8005\u57fa\u4e8e vLLM\u3001FlashAttention-3 \u4e0e cuBLASLt\uff0c\u5bf9 prefill \u4e0e decode \u9636\u6bb5\u8fdb\u884c profiling\uff0c\u5e76\u63d0\u51fa\u516b\u79cd\u7531 Nsight Compute \u8ba1\u6570\u5668\u9a8c\u8bc1\u7684\u5229\u7528\u7387\u89c6\u89d2\u3002", "categories": ["cs.PF", "cs.AR", "cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12923", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63ed\u793a decode \u9636\u6bb5\u5c0f\u6279\u91cf GEMM \u5728 Hopper bfloat16 GMMA \u7684\u56fa\u5b9a 64 \u884c fragment \u4e0b\u5b58\u5728\u4e25\u91cd fragment fill \u6d6a\u8d39", "\u8986\u76d6\u51b7\u542f\u52a8 prefill\u3001warm prefill \u4e0e decode\uff0c\u626b\u63cf\u4e0d\u540c\u5e8f\u5217\u957f\u5ea6\u548c batch size\uff0c\u5e76\u5206\u6790\u56db\u4e2a\u751f\u4ea7\u7ea7\u6a21\u578b\u4e0e\u516d\u7c7b\u9010\u5c42 kernel \u89d2\u8272", "\u5c06\u5229\u7528\u7387\u7f3a\u53e3\u5f52\u56e0\u5230\u5177\u4f53\u673a\u5236\uff0c\u5305\u62ec fragment \u586b\u5145\u7387\u3001occupancy \u9650\u5236\u3001stall \u7279\u5f81\u3001wave \u91cf\u5316\u548c kernel \u9009\u62e9"], "keywords": ["LLM\u63a8\u7406", "GPU\u6027\u80fd", "\u7cfb\u7edf\u4f18\u5316", "\u6027\u80fd\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12923", "published_at": "2026-09-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dissecting GPU Utilization for LLM Inference on Nvidia Hopper", "tldr": "\u7ec6\u62c6Hopper\u4e0aLLM\u63a8\u7406GPU\u5229\u7528\u7387\u5047\u8c61", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u5256\u6790 Nvidia Hopper\uff08H100 NVL\uff09\u4e0a LLM \u63a8\u7406\u7684 GPU \u5229\u7528\u7387\uff0c\u6307\u51fa\u5355\u4e00 SM \u5229\u7528\u7387\u4f1a\u63a9\u76d6\u771f\u5b9e\u6709\u6548\u8ba1\u7b97\u3002\u4f5c\u8005\u57fa\u4e8e vLLM\u3001FlashAttention-3 \u4e0e cuBLASLt\uff0c\u5bf9 prefill \u4e0e decode \u9636\u6bb5\u8fdb\u884c profiling\uff0c\u5e76\u63d0\u51fa\u516b\u79cd\u7531 Nsight Compute \u8ba1\u6570\u5668\u9a8c\u8bc1\u7684\u5229\u7528\u7387\u89c6\u89d2\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a LLM \u63a8\u7406\u6027\u80fd\u5206\u6790\u63d0\u4f9b\u4e86\u6bd4\u5355\u4e00 GPU \u5229\u7528\u7387\u66f4\u7ec6\u7c92\u5ea6\u3001\u53ef\u9a8c\u8bc1\u7684\u8bca\u65ad\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u5b9a\u4f4d decode \u4f4e\u6548\u6839\u56e0\u5e76\u6307\u5bfc\u63a8\u7406\u7cfb\u7edf\u3001kernel \u4e0e\u6279\u5904\u7406\u7b56\u7565\u4f18\u5316\u3002"}, {"abstract": "Traditional large language models (LLMs) are scoped to individual user sessions, limiting their knowledge to a single conversation and preventing them from learning user preferences that evolve over time. Existing agentic memory systems address this limitation but generally operate at the individual-user level, restricting the public knowledge that could be shared across users to improve downstream responses. We introduce AIM (Agentic Interoperable Memory), a unified, privacy-aware memory framework that enables multi-agent, multi-user LLM systems to persistently manage private and shared memory. AIM dynamically classifies information as private, scoped to one user and inaccessible to others, or public, accessible to all users. It enforces index-level access controls so that private memories are retrievable only by their owner, protecting sensitive data while allowing beneficial shared knowledge to improve coordination and consistency. We also introduce MUMBench (Multi-User Memory Benchmark), a dataset of multi-user interactions containing private and shareable information across four domains. To our knowledge, MUMBench is the first public dataset designed to evaluate multiple memory operations, including retrieval, creation, update, and deletion, in a multi-user environment. Across three independent runs on MUMBench, AIM achieves 96.0% visibility classification accuracy, 58.8% strict operation accuracy, and 70.5% state-aware operation accuracy.", "arxiv_id": "2609.12320", "arxiv_url": "https://arxiv.org/abs/2609.12320", "authors": ["Zachary Johnson", "Nigel Boachie Kumankumah", "Somya Chatterjee", "Tejas Sathyamurthi", "Min Chen", "Xinyi Alice Li", "Xiao Wang", "Emily Morgan Gelchie", "Jessica Lin", "Sadid A. Hasan", "Sulaiman Vesal"], "brief": "\u8bba\u6587\u63d0\u51fa AIM\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u667a\u80fd\u4f53\u3001\u591a\u7528\u6237 LLM \u7cfb\u7edf\u7684\u9690\u79c1\u611f\u77e5\u53ef\u4e92\u64cd\u4f5c\u8bb0\u5fc6\u6846\u67b6\uff0c\u53ef\u52a8\u6001\u533a\u5206\u79c1\u6709\u8bb0\u5fc6\u4e0e\u516c\u5171\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u7d22\u5f15\u7ea7\u8bbf\u95ee\u63a7\u5236\u4fdd\u62a4\u7528\u6237\u9690\u79c1\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03 MUMBench \u591a\u7528\u6237\u8bb0\u5fc6\u8bc4\u6d4b\u96c6\uff1b\u5b9e\u9a8c\u4e2d AIM \u8fbe\u5230 96.0% \u53ef\u89c1\u6027\u5206\u7c7b\u51c6\u786e\u7387\u300158.8% \u4e25\u683c\u64cd\u4f5c\u51c6\u786e\u7387\u548c 70.5% \u72b6\u6001\u611f\u77e5\u64cd\u4f5c\u51c6\u786e\u7387\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12320", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u9690\u79c1\u4fdd\u62a4", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12320", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AIM: A Privacy-Aware Interoperable Memory Framework for Multi-Agent Multi-User LLM Systems", "tldr": "\u8bba\u6587\u63d0\u51fa AIM\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u667a\u80fd\u4f53\u3001\u591a\u7528\u6237 LLM \u7cfb\u7edf\u7684\u9690\u79c1\u611f\u77e5\u53ef\u4e92\u64cd\u4f5c\u8bb0\u5fc6\u6846\u67b6\uff0c\u53ef\u52a8\u6001\u533a\u5206\u79c1\u6709\u8bb0\u5fc6\u4e0e\u516c\u5171\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u7d22\u5f15\u7ea7\u8bbf\u95ee\u63a7\u5236\u4fdd\u62a4\u7528\u6237\u9690\u79c1\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03 MUMBench \u591a\u7528\u6237\u8bb0\u5fc6\u8bc4\u6d4b\u96c6\uff1b\u5b9e\u9a8c\u4e2d AIM \u8fbe\u5230 96.0% \u53ef\u89c1\u6027\u5206\u7c7b\u51c6\u786e\u7387\u300158.8% \u4e25\u683c\u64cd\u4f5c\u51c6\u786e\u7387\u548c 70.5% \u72b6\u6001\u611f\u77e5\u64cd\u4f5c\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning is now the standard way to train large language model agents on long-horizon tasks, where dozens of interdependent actions precede a single sparse reward. Critic-free, group-relative methods such as GRPO suit this regime, but they broadcast one trajectory-level scalar to every step and cannot say which decision drove the outcome. GiGPO recovers a step-level signal by grouping time steps that share an anchor state, yet it merges the step- and episode-level estimates under one fixed weight, spending the same resolution on a pivotal branching decision as on a routine, near-deterministic transition. We argue that the right resolution is state-dependent, and propose GACA, a critic-free estimator whose granularity follows an uncertainty-based criticality proxy. GACA scores every step by the negative log-likelihood its own rollout already records, then blends the two advantages with a per-step weight that grows with that score, so the gradient places more weight on the fine-grained signal at above-average NLL and on the episode-level signal below it. We derive an exact risk decomposition for the implemented mixture and show that sufficiently small modulation improves on fixed mixing under positive directional alignment. A separate conditional result bounds local action-value variation using expected NLL, while an error-projection analysis characterizes when mixing adds value beyond scalar uncertainty reweighting. On ALFWorld and WebShop, GACA improves task success over GRPO and GiGPO at both 1.5B and 7B scales.", "arxiv_id": "2609.12424", "arxiv_url": "https://arxiv.org/abs/2609.12424", "authors": ["Taoran Liang", "Yang Liu", "Shang Luo", "Yingguang Yang", "Rongrong Zhang", "Yingzong Min", "Yulin Huang", "Jianshen Zhang", "Yongzhi Qi", "Kefu Xu", "Congjing Ran", "Bin Chong"], "brief": "\u672c\u6587\u63d0\u51fa GACA\uff0c\u7528\u4e8e\u957f\u65f6\u7a0b LLM \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u81ea\u9002\u5e94\u4fe1\u7528\u5206\u914d\u3002\u5b83\u6839\u636e\u6bcf\u6b65\u8d1f\u5bf9\u6570\u4f3c\u7136\u4f30\u8ba1\u72b6\u6001\u5173\u952e\u6027\uff0c\u5728\u6b65\u7ea7\u4e0e\u8f68\u8ff9\u7ea7\u4f18\u52bf\u4e4b\u95f4\u52a8\u6001\u6df7\u5408\uff1b\u5728 ALFWorld \u548c WebShop \u4e0a\uff0c\u76f8\u6bd4 GRPO \u4e0e GiGPO \u63d0\u5347\u4e86\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12424", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12424", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Granularity-Adaptive Credit Assignment for Long-Horizon LLM Agent Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa GACA\uff0c\u7528\u4e8e\u957f\u65f6\u7a0b LLM \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u81ea\u9002\u5e94\u4fe1\u7528\u5206\u914d\u3002\u5b83\u6839\u636e\u6bcf\u6b65\u8d1f\u5bf9\u6570\u4f3c\u7136\u4f30\u8ba1\u72b6\u6001\u5173\u952e\u6027\uff0c\u5728\u6b65\u7ea7\u4e0e\u8f68\u8ff9\u7ea7\u4f18\u52bf\u4e4b\u95f4\u52a8\u6001\u6df7\u5408\uff1b\u5728 ALFWorld \u548c WebShop \u4e0a\uff0c\u76f8\u6bd4 GRPO \u4e0e GiGPO \u63d0\u5347\u4e86\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-running LLM agents require memory mechanisms that maintain coherent internal states across interactions. We study a lifecycle-labeled memory setting in which write episodes provide lifecycle metadata during training, and phase-aware readout is used during evaluation. This setting reflects the need to distinguish information that should remain influential across future interactions from information that should affect only the current context. A mismatch between these lifecycles can cause temporary information to overwrite durable knowledge, leading to behavioral drift in persistent agents. Within this setting, we introduce \\textbf{LifeFuse-Mem}, a lifecycle-aware neural memory framework that separates information according to its temporal commitment. LifeFuse-Mem uses dedicated memory components and lifecycle-aware updates to allow stable and transient knowledge to evolve locally without converting temporary context into durable state. On the controlled anti-overwrite benchmark, LifeFuse-Mem improves acquisition-controlled retention and reduces temporary overwrite; on two public long-memory benchmarks, it remains broadly competitive. These results suggest that explicit lifecycle signals can help diagnose and mitigate overwrite in compact online memory.", "arxiv_id": "2609.12436", "arxiv_url": "https://arxiv.org/abs/2609.12436", "authors": ["Hanyu Zhao", "Yuqian Feng", "Zhenyu Song", "Yuanchao Cheng", "Yance Jiao", "Tengfei Pan", "Li Du"], "brief": "\u672c\u6587\u63d0\u51fa LifeFuse-Mem\uff0c\u4e00\u79cd\u751f\u547d\u5468\u671f\u611f\u77e5\u7684\u795e\u7ecf\u8bb0\u5fc6\u6846\u67b6\uff0c\u5c06\u6301\u4e45\u77e5\u8bc6\u4e0e\u4e34\u65f6\u4e0a\u4e0b\u6587\u5206\u79bb\u66f4\u65b0\uff0c\u907f\u514d\u77ed\u671f\u4fe1\u606f\u8986\u76d6\u957f\u671f\u72b6\u6001\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u53d7\u63a7\u6297\u8986\u76d6\u57fa\u51c6\u4e0a\u63d0\u5347\u4fdd\u7559\u80fd\u529b\u5e76\u51cf\u5c11\u4e34\u65f6\u8986\u76d6\uff0c\u5728\u4e24\u4e2a\u516c\u5f00\u957f\u8bb0\u5fc6\u57fa\u51c6\u4e0a\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12436", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u795e\u7ecf\u8bb0\u5fc6", "\u72b6\u6001\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12436", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LifeFuse-Mem: Lifecycle-Aware State Fusion Against Temporary Overwriting for Long-Term Memory", "tldr": "\u672c\u6587\u63d0\u51fa LifeFuse-Mem\uff0c\u4e00\u79cd\u751f\u547d\u5468\u671f\u611f\u77e5\u7684\u795e\u7ecf\u8bb0\u5fc6\u6846\u67b6\uff0c\u5c06\u6301\u4e45\u77e5\u8bc6\u4e0e\u4e34\u65f6\u4e0a\u4e0b\u6587\u5206\u79bb\u66f4\u65b0\uff0c\u907f\u514d\u77ed\u671f\u4fe1\u606f\u8986\u76d6\u957f\u671f\u72b6\u6001\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u53d7\u63a7\u6297\u8986\u76d6\u57fa\u51c6\u4e0a\u63d0\u5347\u4fdd\u7559\u80fd\u529b\u5e76\u51cf\u5c11\u4e34\u65f6\u8986\u76d6\uff0c\u5728\u4e24\u4e2a\u516c\u5f00\u957f\u8bb0\u5fc6\u57fa\u51c6\u4e0a\u4e5f\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Social-deduction games such as Werewolf are increasingly used to evaluate LLM agents, but existing evaluations often rely on final game outcomes. We propose a belief-shift evaluation benchmark in Werewolf for analyzing communication skills through belief updating. Using LLM-played games, we annotate suspicion and accusation messages and measure how an observing village-side model\u0027s beliefs change after each message. We evaluate 40 open-weight LLM configurations on 1,224 annotated messages. Our results show that larger models better distinguish true wolves from villagers based on game history, but accusations still strongly influence their beliefs. Models become more suspicious of the accused target and less suspicious of the accuser, especially when the accuser is trusted, even if the accuser is wolf-aligned. Larger models better resist accusations from accusers they already distrust. Overall, our findings suggest that current open-weight LLMs up to 120B parameters still struggle to integrate accusation content with source trust in strategic communication. Our benchmark and code are available at https://rlg.iis.sinica.edu.tw/papers/werewolf-accusation-benchmark.", "arxiv_id": "2609.12446", "arxiv_url": "https://arxiv.org/abs/2609.12446", "authors": ["Yu-Yu Yang", "Ti-Rong Wu", "Hung Guei", "Hsing-Yu Chen", "I-Chen Wu"], "brief": "\u672c\u6587\u63d0\u51fa\u72fc\u4eba\u6740\u4e2d\u7684\u4fe1\u5ff5\u53d8\u5316\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4e0d\u53ea\u770b\u6700\u7ec8\u80dc\u8d1f\uff0c\u800c\u662f\u5206\u6790LLM\u5728\u770b\u5230\u6000\u7591\u548c\u6307\u63a7\u53d1\u8a00\u540e\u5982\u4f55\u66f4\u65b0\u5bf9\u73a9\u5bb6\u8eab\u4efd\u7684\u5224\u65ad\u3002\u5bf940\u79cd\u5f00\u6e90LLM\u914d\u7f6e\u30011224\u6761\u6807\u6ce8\u6d88\u606f\u7684\u5b9e\u9a8c\u8868\u660e\uff0c\u5927\u6a21\u578b\u66f4\u80fd\u4f9d\u636e\u5386\u53f2\u533a\u5206\u72fc\u4eba\u548c\u6751\u6c11\uff0c\u4f46\u4ecd\u5bb9\u6613\u88ab\u6307\u63a7\u5f71\u54cd\uff0c\u5c24\u5176\u4f1a\u66f4\u6000\u7591\u88ab\u6307\u63a7\u8005\u5e76\u964d\u4f4e\u5bf9\u6307\u63a7\u8005\u7684\u6000\u7591\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5f53\u524d\u6700\u9ad8\u5230120B\u53c2\u6570\u7684\u5f00\u6e90LLM\u4ecd\u96be\u4ee5\u5728\u7b56\u7565\u4ea4\u6d41\u4e2d\u540c\u65f6\u6574\u5408\u6307\u63a7\u5185\u5bb9\u4e0e\u4fe1\u606f\u6e90\u53ef\u4fe1\u5ea6\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12446", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u535a\u5f08\u63a8\u7406", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12446", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Do LLMs Trust the Accuser or the Accusation? Measuring Belief Shifts in Werewolf", "tldr": "\u672c\u6587\u63d0\u51fa\u72fc\u4eba\u6740\u4e2d\u7684\u4fe1\u5ff5\u53d8\u5316\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4e0d\u53ea\u770b\u6700\u7ec8\u80dc\u8d1f\uff0c\u800c\u662f\u5206\u6790LLM\u5728\u770b\u5230\u6000\u7591\u548c\u6307\u63a7\u53d1\u8a00\u540e\u5982\u4f55\u66f4\u65b0\u5bf9\u73a9\u5bb6\u8eab\u4efd\u7684\u5224\u65ad\u3002\u5bf940\u79cd\u5f00\u6e90LLM\u914d\u7f6e\u30011224\u6761\u6807\u6ce8\u6d88\u606f\u7684\u5b9e\u9a8c\u8868\u660e\uff0c\u5927\u6a21\u578b\u66f4\u80fd\u4f9d\u636e\u5386\u53f2\u533a\u5206\u72fc\u4eba\u548c\u6751\u6c11\uff0c\u4f46\u4ecd\u5bb9\u6613\u88ab\u6307\u63a7\u5f71\u54cd\uff0c\u5c24\u5176\u4f1a\u66f4\u6000\u7591\u88ab\u6307\u63a7\u8005\u5e76\u964d\u4f4e\u5bf9\u6307\u63a7\u8005\u7684\u6000\u7591\u3002\u7ed3\u679c\u663e\u793a\uff0c\u5f53\u524d\u6700\u9ad8\u5230120B\u53c2\u6570\u7684\u5f00\u6e90LLM\u4ecd\u96be\u4ee5\u5728\u7b56\u7565\u4ea4\u6d41\u4e2d\u540c\u65f6\u6574\u5408\u6307\u63a7\u5185\u5bb9\u4e0e\u4fe1\u606f\u6e90\u53ef\u4fe1\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Open-ended reinforcement learning often relies on rubric-based rewards for tasks without directly verifiable answers. Yet the policy and reward system form a dynamic feedback loop: as the policy optimizes the current reward, an initially useful reward system may become unreliable due to reward hacking or reduced response discriminability. The reward system should therefore evolve rather than remain fixed during training. Existing dynamic-rubric methods adapt evaluation criteria, but reward failures can also arise from scoring mechanisms or signal composition. We introduce EvoRS, a self-evolving RL framework that evolves the reward system from on-policy experience, representing it as an executable Reward-DAG. Specifically, an agentic designer updates this system from on-policy rollouts and reward traces to maintain train-time reliability. Across writing and roleplay, EvoRS achieves the best quality under all three judges, outperforming the policy by \\(2.107\\) and \\(4.767\\) points, respectively, while reducing reward hacking and coverage failures and preserving reward informativeness. Ablations confirm that a comprehensive fixed reward system cannot remain reliable in open-ended tasks and must evolve throughout training.", "arxiv_id": "2609.12459", "arxiv_url": "https://arxiv.org/abs/2609.12459", "authors": ["Weiyuan Li", "Aili Chen", "Xintao Wang", "Yikai Zhang", "Qingqing Dong", "Jinghan Xu", "Hongru Hou", "Wenxuan Zhao", "Chengkun Lang", "Jun Gao", "Yuanli Guo", "Hongcheng Guo", "Yanghua Xiao", "Deqing Yang"], "brief": "\u672c\u6587\u63d0\u51fa EvoRS\uff0c\u8ba9\u5f00\u653e\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u5956\u52b1\u7cfb\u7edf\u968f\u8bad\u7ec3\u8fc7\u7a0b\u81ea\u6211\u6f14\u5316\uff0c\u800c\u4e0d\u662f\u56fa\u5b9a\u4f7f\u7528\u4eba\u5de5\u89c4\u5219\u3002\u5b83\u5c06\u5956\u52b1\u8868\u793a\u4e3a\u53ef\u6267\u884c\u7684 Reward-DAG\uff0c\u5e76\u7531\u667a\u80fd\u4f53\u5f0f\u8bbe\u8ba1\u5668\u57fa\u4e8e on-policy \u8f68\u8ff9\u548c\u5956\u52b1\u8bb0\u5f55\u66f4\u65b0\uff0c\u4ece\u800c\u51cf\u5c11\u5956\u52b1\u9ed1\u5ba2\u3001\u8986\u76d6\u5931\u8d25\u5e76\u63d0\u5347\u5199\u4f5c\u548c\u89d2\u8272\u626e\u6f14\u4efb\u52a1\u8d28\u91cf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12459", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u5efa\u6a21", "\u667a\u80fd\u4f53", "\u5f00\u653e\u5f0f\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12459", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "EvoRS: On-Policy Self-Evolution of Reward Systems for Open-Ended Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa EvoRS\uff0c\u8ba9\u5f00\u653e\u5f0f\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u5956\u52b1\u7cfb\u7edf\u968f\u8bad\u7ec3\u8fc7\u7a0b\u81ea\u6211\u6f14\u5316\uff0c\u800c\u4e0d\u662f\u56fa\u5b9a\u4f7f\u7528\u4eba\u5de5\u89c4\u5219\u3002\u5b83\u5c06\u5956\u52b1\u8868\u793a\u4e3a\u53ef\u6267\u884c\u7684 Reward-DAG\uff0c\u5e76\u7531\u667a\u80fd\u4f53\u5f0f\u8bbe\u8ba1\u5668\u57fa\u4e8e on-policy \u8f68\u8ff9\u548c\u5956\u52b1\u8bb0\u5f55\u66f4\u65b0\uff0c\u4ece\u800c\u51cf\u5c11\u5956\u52b1\u9ed1\u5ba2\u3001\u8986\u76d6\u5931\u8d25\u5e76\u63d0\u5347\u5199\u4f5c\u548c\u89d2\u8272\u626e\u6f14\u4efb\u52a1\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce AMDKernelVault, an open HIP and Triton kernel corpus and training framework for recent AMD CDNA GPUs. Existing LLM-based kernel agents are largely CUDA/NVIDIA-centric and often depend on repeated frontier-LLM calls for generation, reflection, and optimization. To address this gap, we develop HIPKernelGen and TritonKernelGen, agent-driven pipelines that transform PyTorch references into HIP or Triton kernels, compile and validate candidates under ROCm, and latency-profile them on AMD hardware. The corpus contains 62,153 execution-verified HIP kernel samples, 2,377 production-grounded ROCm Libraries QA entries, and 39,893 Triton kernels. We further train Qwen3-8B with supervised fine-tuning and execution-aware reinforcement learning as a demonstration of the corpus\u0027s utility. Under fixed evaluation budgets, it achieves the highest correctness among the compared models on PyTorch-to-HIP (34.0% Pass@1), TritonBench-G (33.2% Corr@3), and ROCmBench (41.94% Corr@3), but does not uniformly lead compilation or speed metrics. The corpus and documentation are available at https://huggingface.co/datasets/amd/AIG-Datasets, and the associated training and kernel-generation code is available at https://github.com/AMD-AGI/hip_kernel_llm_lab.", "arxiv_id": "2609.12471", "arxiv_url": "https://arxiv.org/abs/2609.12471", "authors": ["Ji Liu", "Saptarshi Majumder", "Yiqing Huang", "Wenwen Ouyang", "Umang Pandey", "Zeping Li", "Chushi Chen", "Zihao An", "Puyuan Yang", "Zekai Li", "Sina Rafati", "Ziqiong Liu", "Pratik Prabhanjan Brahma", "Dong Li", "Zicheng Liu", "Sharon Zhou", "Emad Barsoum"], "brief": "\u8bba\u6587\u53d1\u5e03 AMDKernelVault\uff0c\u4e00\u4e2a\u9762\u5411 AMD CDNA GPU \u7684 HIP/Triton \u5185\u6838\u8bed\u6599\u4e0e\u8bad\u7ec3\u6846\u67b6\uff0c\u5305\u542b\u5927\u91cf\u53ef\u6267\u884c\u9a8c\u8bc1\u7684 HIP\u3001Triton \u5185\u6838\u53ca ROCm QA \u6570\u636e\u3002\u4f5c\u8005\u7528\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf\u751f\u6210\u3001\u7f16\u8bd1\u3001\u9a8c\u8bc1\u5e76\u6d4b\u901f\u5185\u6838\uff0c\u5e76\u57fa\u4e8e\u8be5\u8bed\u6599\u5bf9 Qwen3-8B \u8fdb\u884c\u76d1\u7763\u5fae\u8c03\u548c\u6267\u884c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\uff0c\u5728\u591a\u4e2a AMD \u5185\u6838\u751f\u6210\u8bc4\u6d4b\u4e0a\u53d6\u5f97\u6700\u9ad8\u6b63\u786e\u7387\uff0c\u4f46\u7f16\u8bd1\u7387\u548c\u901f\u5ea6\u5e76\u975e\u5168\u9762\u9886\u5148\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12471", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "GPU\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12471", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AMDKernelVault: Large-Scale Datasets and Agentic Training for AMD GPU Kernel Optimization", "tldr": "\u8bba\u6587\u53d1\u5e03 AMDKernelVault\uff0c\u4e00\u4e2a\u9762\u5411 AMD CDNA GPU \u7684 HIP/Triton \u5185\u6838\u8bed\u6599\u4e0e\u8bad\u7ec3\u6846\u67b6\uff0c\u5305\u542b\u5927\u91cf\u53ef\u6267\u884c\u9a8c\u8bc1\u7684 HIP\u3001Triton \u5185\u6838\u53ca ROCm QA \u6570\u636e\u3002\u4f5c\u8005\u7528\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf\u751f\u6210\u3001\u7f16\u8bd1\u3001\u9a8c\u8bc1\u5e76\u6d4b\u901f\u5185\u6838\uff0c\u5e76\u57fa\u4e8e\u8be5\u8bed\u6599\u5bf9 Qwen3-8B \u8fdb\u884c\u76d1\u7763\u5fae\u8c03\u548c\u6267\u884c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\uff0c\u5728\u591a\u4e2a AMD \u5185\u6838\u751f\u6210\u8bc4\u6d4b\u4e0a\u53d6\u5f97\u6700\u9ad8\u6b63\u786e\u7387\uff0c\u4f46\u7f16\u8bd1\u7387\u548c\u901f\u5ea6\u5e76\u975e\u5168\u9762\u9886\u5148\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-Video Question Answering (LVQA) requires locating decisive evidence in hour-scale videos under a limited frame budget. Most training-free methods apply the same frame-selection strategy to all questions, despite substantial variation in the evidence required by different question types. Our analysis shows that the relative effectiveness of frame-selection strategies varies across semantic categories and benchmarks, motivating adaptive evidence acquisition. In this paper, we introduce AutoSkill, a source-supervised framework for automatically discovering and routing executable frame-selection skills. Starting from a small labelled source pool, LLM agents iteratively propose, implement, evaluate, and refine candidate skills. For a target benchmark, AutoSkill uses only unlabelled question and option text to induce a shared semantic taxonomy, rewrite labelled source examples into the target style, and estimate a category-to-skill mapping. Neither target videos nor target answers are used in this process. At inference time, each question is assigned one skill, which selects the frames used in a single inference of the frozen video MLLM. Across five long-video benchmark splits, AutoSkill improves Qwen2.5-VL-7B and Qwen3.5-4B by 2.4% and 1.2%, respectively, demonstrating the effectiveness of our AutoSkill.", "arxiv_id": "2609.12517", "arxiv_url": "https://arxiv.org/abs/2609.12517", "authors": ["Jian Hu", "Zixu Cheng", "Da Li", "Wei Li", "Ziquan Liu", "Shaogang Gong"], "brief": "\u672c\u6587\u63d0\u51fa AutoSkill\uff0c\u7528\u4e8e\u957f\u89c6\u9891\u95ee\u7b54\u4e2d\u6839\u636e\u95ee\u9898\u7c7b\u578b\u81ea\u9002\u5e94\u9009\u62e9\u5e27\u9009\u62e9\u7b56\u7565\uff0c\u800c\u4e0d\u662f\u5bf9\u6240\u6709\u95ee\u9898\u4f7f\u7528\u540c\u4e00\u79cd\u91c7\u6837\u65b9\u6cd5\u3002\u8be5\u65b9\u6cd5\u7528\u5c11\u91cf\u6e90\u57df\u6807\u6ce8\u6570\u636e\u8ba9 LLM \u667a\u80fd\u4f53\u81ea\u52a8\u53d1\u73b0\u3001\u5b9e\u73b0\u548c\u4f18\u5316\u5e27\u9009\u62e9\u6280\u80fd\uff0c\u5e76\u5728\u76ee\u6807\u57fa\u51c6\u4e0a\u4ec5\u7528\u672a\u6807\u6ce8\u6587\u672c\u5efa\u7acb\u7c7b\u522b\u5230\u6280\u80fd\u7684\u8def\u7531\u3002\u5b9e\u9a8c\u5728\u4e94\u4e2a\u957f\u89c6\u9891\u57fa\u51c6\u5212\u5206\u4e0a\u63d0\u5347\u4e86 Qwen2.5-VL-7B \u548c Qwen3.5-4B \u7684\u8868\u73b0\uff0c\u5206\u522b\u5e26\u6765 2.4% \u548c 1.2% \u589e\u76ca\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12517", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u957f\u89c6\u9891\u95ee\u7b54", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u5e27\u9009\u62e9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12517", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "One Skill Does Not Fit All: Automatic Discovery and Taxonomy-Guided Routing of Frame-Selection Skills for Long-Video Question Answering", "tldr": "\u672c\u6587\u63d0\u51fa AutoSkill\uff0c\u7528\u4e8e\u957f\u89c6\u9891\u95ee\u7b54\u4e2d\u6839\u636e\u95ee\u9898\u7c7b\u578b\u81ea\u9002\u5e94\u9009\u62e9\u5e27\u9009\u62e9\u7b56\u7565\uff0c\u800c\u4e0d\u662f\u5bf9\u6240\u6709\u95ee\u9898\u4f7f\u7528\u540c\u4e00\u79cd\u91c7\u6837\u65b9\u6cd5\u3002\u8be5\u65b9\u6cd5\u7528\u5c11\u91cf\u6e90\u57df\u6807\u6ce8\u6570\u636e\u8ba9 LLM \u667a\u80fd\u4f53\u81ea\u52a8\u53d1\u73b0\u3001\u5b9e\u73b0\u548c\u4f18\u5316\u5e27\u9009\u62e9\u6280\u80fd\uff0c\u5e76\u5728\u76ee\u6807\u57fa\u51c6\u4e0a\u4ec5\u7528\u672a\u6807\u6ce8\u6587\u672c\u5efa\u7acb\u7c7b\u522b\u5230\u6280\u80fd\u7684\u8def\u7531\u3002\u5b9e\u9a8c\u5728\u4e94\u4e2a\u957f\u89c6\u9891\u57fa\u51c6\u5212\u5206\u4e0a\u63d0\u5347\u4e86 Qwen2.5-VL-7B \u548c Qwen3.5-4B \u7684\u8868\u73b0\uff0c\u5206\u522b\u5e26\u6765 2.4% \u548c 1.2% \u589e\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world Earth observation (EO) agents must translate high-level scientific questions into executable workflows to acquire observations, prepare data, perform domain computations, and derive conclusions from runtime evidence. Existing EO agents typically start from supplied observations, while benchmarks typically provide prepared inputs or candidate answers, leaving full-chain open-world EO execution largely untested. We present Earth-Agent-Pro, an execution-adaptive Plan-and-Execute framework using expert-authored skills to constrain planning and runtime tool use. Workflow-centered structured memory records planned steps, accepted evidence, and their dependencies, enabling repair of only the affected workflow suffix when runtime evidence invalidates a step. Separate large language model adapters use sequence-level supervised fine-tuning for planner workflow composition and node-level group relative policy optimization with locally verifiable rewards for executor tool-argument grounding. Earth-Bench-Pro instantiates 248 expert-curated task cores as 744 questions under three matched regimes. Its 248 Open-World Execution questions span RGB imagery, spectral observations, and remote sensing products, pairing high-level requests with runtime data requirements, executable trajectories, and open-ended answers grounded in execution evidence. With a shared GPT-5 backbone, Earth-Agent-Pro achieves 66.13% LLM-as-Judge accuracy, exceeding ReAct by 20.95 points in this metric and 24.44 points in Tools-In-Order. Joint adapter tuning raises Qwen3.5-9B LLM-as-Judge accuracy from 38.31% to 50.00%, an 11.69-point gain over the untuned configuration. Planning-only evaluation and execution with the reference workflow show that the adapters improve workflow composition and argument grounding, respectively. Code and datasets will be released soon.", "arxiv_id": "2609.12533", "arxiv_url": "https://arxiv.org/abs/2609.12533", "authors": ["Zhutao Lv", "Chenhao Dang", "Yi Feng", "Yanpei Gong", "Xiaolei Wang", "Junyan Ye", "Conghui He", "Weijia Li"], "brief": "\u8bba\u6587\u63d0\u51fa Earth-Agent-Pro\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u5730\u7403\u89c2\u6d4b\u4efb\u52a1\u7684\u5168\u94fe\u8def\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u5c06\u9ad8\u5c42\u79d1\u5b66\u95ee\u9898\u8f6c\u5316\u4e3a\u6570\u636e\u83b7\u53d6\u3001\u9884\u5904\u7406\u3001\u8ba1\u7b97\u5206\u6790\u5230\u7ed3\u8bba\u751f\u6210\u7684\u53ef\u6267\u884c\u5de5\u4f5c\u6d41\u3002\u5176\u7ed3\u6784\u5316\u8bb0\u5fc6\u4e0e\u81ea\u9002\u5e94\u4fee\u590d\u673a\u5236\u63d0\u5347\u4e86\u5f00\u653e\u4e16\u754c\u6267\u884c\u80fd\u529b\uff0c\u5728 Earth-Bench-Pro \u4e0a\u76f8\u8f83 ReAct \u663e\u8457\u63d0\u9ad8\u51c6\u786e\u7387\u4e0e\u5de5\u5177\u8c03\u7528\u987a\u5e8f\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12533", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5730\u7403\u89c2\u6d4b", "\u5de5\u5177\u4f7f\u7528", "\u5de5\u4f5c\u6d41\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12533", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Earth-Agent-Pro: Towards Real-World Full-Chain Earth Observation with Agents", "tldr": "\u8bba\u6587\u63d0\u51fa Earth-Agent-Pro\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u5730\u7403\u89c2\u6d4b\u4efb\u52a1\u7684\u5168\u94fe\u8def\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u5c06\u9ad8\u5c42\u79d1\u5b66\u95ee\u9898\u8f6c\u5316\u4e3a\u6570\u636e\u83b7\u53d6\u3001\u9884\u5904\u7406\u3001\u8ba1\u7b97\u5206\u6790\u5230\u7ed3\u8bba\u751f\u6210\u7684\u53ef\u6267\u884c\u5de5\u4f5c\u6d41\u3002\u5176\u7ed3\u6784\u5316\u8bb0\u5fc6\u4e0e\u81ea\u9002\u5e94\u4fee\u590d\u673a\u5236\u63d0\u5347\u4e86\u5f00\u653e\u4e16\u754c\u6267\u884c\u80fd\u529b\uff0c\u5728 Earth-Bench-Pro \u4e0a\u76f8\u8f83 ReAct \u663e\u8457\u63d0\u9ad8\u51c6\u786e\u7387\u4e0e\u5de5\u5177\u8c03\u7528\u987a\u5e8f\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents are expected to continuously adapt to new tasks and environments over their lifetime by reusing past experience. However, existing memory-based agents struggle to transfer reusable experience across environments and suffer from catastrophic forgetting as experience accumulated. To address these challenges, we propose LifeMem, a lifelong learning framework that enables agents to transfer knowledge across multiple environments. During learning, LifeMem clusters accumulated interaction trajectories based on underlying workflows to extract reusable skills. When solving a new task at inference time, the agent recalls relevant skills and trajectories to guide actions. To validate our method, we conduct experiments across 10 environments and over 13k tasks with 2k newly annotated interaction trajectories. Results show that LifeMem enables effective experience reuse in lifelong learning, achieving both reduced forgetting on learned tasks and superior cross-task transfer. Further analysis reveals that task streaming impacts learning, while consolidating structurally similar trajectories within memory boosts performance.", "arxiv_id": "2609.12655", "arxiv_url": "https://arxiv.org/abs/2609.12655", "authors": ["Yuli Qiu", "Yutong Li", "Wei Su", "Zeming Liu", "Wanxiang Che", "Heyan Huang", "Haifeng Wang", "Yuang Guo"], "brief": "LifeMem \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u7ec8\u8eab\u5b66\u4e60\u8bb0\u5fc6\u6846\u67b6\uff0c\u901a\u8fc7\u6309\u6f5c\u5728\u5de5\u4f5c\u6d41\u805a\u7c7b\u4ea4\u4e92\u8f68\u8ff9\u6765\u62bd\u53d6\u53ef\u590d\u7528\u6280\u80fd\u3002\u5728\u65b0\u4efb\u52a1\u4e2d\uff0c\u667a\u80fd\u4f53\u68c0\u7d22\u76f8\u5173\u6280\u80fd\u548c\u8f68\u8ff9\u6307\u5bfc\u884c\u52a8\uff1b\u5728 10 \u4e2a\u73af\u5883\u30011.3 \u4e07\u591a\u4e2a\u4efb\u52a1\u4e0a\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u5b83\u80fd\u51cf\u5c11\u707e\u96be\u6027\u9057\u5fd8\u5e76\u63d0\u5347\u8de8\u4efb\u52a1\u8fc1\u79fb\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12655", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7ec8\u8eab\u5b66\u4e60", "\u8bb0\u5fc6\u673a\u5236", "\u77e5\u8bc6\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12655", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LifeMem: Enabling Lifelong Experience Reuse for LLM Agents", "tldr": "LifeMem \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u7684\u7ec8\u8eab\u5b66\u4e60\u8bb0\u5fc6\u6846\u67b6\uff0c\u901a\u8fc7\u6309\u6f5c\u5728\u5de5\u4f5c\u6d41\u805a\u7c7b\u4ea4\u4e92\u8f68\u8ff9\u6765\u62bd\u53d6\u53ef\u590d\u7528\u6280\u80fd\u3002\u5728\u65b0\u4efb\u52a1\u4e2d\uff0c\u667a\u80fd\u4f53\u68c0\u7d22\u76f8\u5173\u6280\u80fd\u548c\u8f68\u8ff9\u6307\u5bfc\u884c\u52a8\uff1b\u5728 10 \u4e2a\u73af\u5883\u30011.3 \u4e07\u591a\u4e2a\u4efb\u52a1\u4e0a\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u5b83\u80fd\u51cf\u5c11\u707e\u96be\u6027\u9057\u5fd8\u5e76\u63d0\u5347\u8de8\u4efb\u52a1\u8fc1\u79fb\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Editing is a core component of video production, requiring creative planning and decisions under multiple constraints. Here, we report methods for agentic tooling for automated video editing across three tasks varying in editorial goal, complexity and creativity, namely scene previews, video summaries and cinematic trailers. We evaluate the outputs and discuss implications for automation and agency.", "arxiv_id": "2609.12769", "arxiv_url": "https://arxiv.org/abs/2609.12769", "authors": ["Surabhi S. Nath", "Kim Ferres", "Milan Petrovi\u0107", "Lion Schulz"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u5957\u7edf\u4e00\u7684\u667a\u80fd\u4f53\u89c6\u9891\u7f16\u8f91\u5de5\u5177\uff0c\u8986\u76d6\u573a\u666f\u9884\u89c8\u3001\u89c6\u9891\u6458\u8981\u548c\u7535\u5f71\u9884\u544a\u7247\u4e09\u7c7b\u4efb\u52a1\uff0c\u9762\u5411\u4e0d\u540c\u590d\u6742\u5ea6\u4e0e\u521b\u610f\u9700\u6c42\u8fdb\u884c\u81ea\u52a8\u5316\u526a\u8f91\u3002\u4f5c\u8005\u5bf9\u751f\u6210\u7ed3\u679c\u8fdb\u884c\u8bc4\u4f30\uff0c\u5e76\u8ba8\u8bba\u4e86\u89c6\u9891\u7f16\u8f91\u81ea\u52a8\u5316\u4e2d\u4eba\u7c7b\u521b\u610f\u63a7\u5236\u4e0e\u667a\u80fd\u4f53\u81ea\u4e3b\u6027\u7684\u5f71\u54cd\u3002", "categories": ["cs.AI", "cs.HC", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12769", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u7f16\u8f91", "\u591a\u5a92\u4f53", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12769", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Unified Agentic Video Editing Across Levels of Complexity and Creativity", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u5957\u7edf\u4e00\u7684\u667a\u80fd\u4f53\u89c6\u9891\u7f16\u8f91\u5de5\u5177\uff0c\u8986\u76d6\u573a\u666f\u9884\u89c8\u3001\u89c6\u9891\u6458\u8981\u548c\u7535\u5f71\u9884\u544a\u7247\u4e09\u7c7b\u4efb\u52a1\uff0c\u9762\u5411\u4e0d\u540c\u590d\u6742\u5ea6\u4e0e\u521b\u610f\u9700\u6c42\u8fdb\u884c\u81ea\u52a8\u5316\u526a\u8f91\u3002\u4f5c\u8005\u5bf9\u751f\u6210\u7ed3\u679c\u8fdb\u884c\u8bc4\u4f30\uff0c\u5e76\u8ba8\u8bba\u4e86\u89c6\u9891\u7f16\u8f91\u81ea\u52a8\u5316\u4e2d\u4eba\u7c7b\u521b\u610f\u63a7\u5236\u4e0e\u667a\u80fd\u4f53\u81ea\u4e3b\u6027\u7684\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long video understanding often behaves like a visual needle-in-a-haystack problem: query-relevant evidence is sparsely distributed across long temporal spans, while packing dense frames into a single VLM context incurs \\textit{context rot} and high cost. Existing video agents often rely on query-agnostic offline preprocessing or ad hoc tool sets, which can miss query-specific details and waste computation. In this work, we present VideoXAgent, a purely online video-agent harness for long video understanding that starts from the given video file and user query, plans and decomposes the task, invokes specialized expert tools on demand, and aggregates multimodal evidence to produce a final answer while resolving conflicts among observations. To support this on-demand invocation, we design a suite of heterogeneous expert tools guided by a data-driven taxonomy of atomic capabilities, spanning scripts, VLMs, and domain models (e.g., detection, OCR, ASR, face recognition). The harness further enforces objective evidence prompting and budget-aware control to curb hallucination and non-termination. Across Video-MME-Long, LongVideoBench-Long, LVBench, and MINERVA, VideoXAgent is competitive with frontier LMMs and video agents under a smaller context footprint---about 50k tokens of agent context per sample, even on hour-long videos. In particular, on complex video-reasoning benchmarks such as MINERVA, it matches this level while using only about 15\\% of the context of a 1,024-frame dense-packing baseline. Notably, the harness remains effective with a visually weak or even text-only orchestrator, suggesting that strong long-video understanding can emerge from progressive agentic evidence seeking rather than from packing the full video into a single context. Project page: https://go-agent-x.github.io/video_agent_harness/", "arxiv_id": "2609.12818", "arxiv_url": "https://arxiv.org/abs/2609.12818", "authors": ["Sen Yang", "Boqiang Duan", "Jing Yang", "Weihao Bo", "Jie Liu", "Boyuan Tong", "Ze Feng", "Wenkang Zhang", "Jingdong Wang", "Hua Wu"], "brief": "\u672c\u6587\u63d0\u51fa VideoXAgent\uff0c\u4e00\u4e2a\u7eaf\u5728\u7ebf\u7684\u957f\u89c6\u9891\u7406\u89e3\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u6839\u636e\u89c6\u9891\u548c\u95ee\u9898\u52a8\u6001\u89c4\u5212\u3001\u8c03\u7528\u68c0\u6d4b\u3001OCR\u3001ASR\u3001\u4eba\u8138\u8bc6\u522b\u3001VLM \u7b49\u4e13\u5bb6\u5de5\u5177\uff0c\u5e76\u6c47\u603b\u8bc1\u636e\u751f\u6210\u7b54\u6848\u3002\u5b83\u5728\u591a\u4e2a\u957f\u89c6\u9891\u57fa\u51c6\u4e0a\u63a5\u8fd1\u524d\u6cbf\u5927\u6a21\u578b/\u667a\u80fd\u4f53\u8868\u73b0\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u4e0a\u4e0b\u6587\u5f00\u9500\uff0c\u5728 MINERVA \u4e0a\u4ec5\u7528\u7ea6 15% \u7684\u7a20\u5bc6\u5e27\u8f93\u5165\u4e0a\u4e0b\u6587\u5373\u53ef\u8fbe\u5230\u76f8\u8fd1\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12818", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12818", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Online Video Agent Harness for Long Video Understanding", "tldr": "\u672c\u6587\u63d0\u51fa VideoXAgent\uff0c\u4e00\u4e2a\u7eaf\u5728\u7ebf\u7684\u957f\u89c6\u9891\u7406\u89e3\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u6839\u636e\u89c6\u9891\u548c\u95ee\u9898\u52a8\u6001\u89c4\u5212\u3001\u8c03\u7528\u68c0\u6d4b\u3001OCR\u3001ASR\u3001\u4eba\u8138\u8bc6\u522b\u3001VLM \u7b49\u4e13\u5bb6\u5de5\u5177\uff0c\u5e76\u6c47\u603b\u8bc1\u636e\u751f\u6210\u7b54\u6848\u3002\u5b83\u5728\u591a\u4e2a\u957f\u89c6\u9891\u57fa\u51c6\u4e0a\u63a5\u8fd1\u524d\u6cbf\u5927\u6a21\u578b/\u667a\u80fd\u4f53\u8868\u73b0\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u4e0a\u4e0b\u6587\u5f00\u9500\uff0c\u5728 MINERVA \u4e0a\u4ec5\u7528\u7ea6 15% \u7684\u7a20\u5bc6\u5e27\u8f93\u5165\u4e0a\u4e0b\u6587\u5373\u53ef\u8fbe\u5230\u76f8\u8fd1\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-based agents rely on heterogeneous interaction capabilities to accomplish complex tasks. Existing approaches often distribute these capabilities across multiple LoRA adapters, which increases adapter storage requirements and introduces routing overhead during inference. A single LoRA avoids this overhead, but learning from diverse agent trajectories under a fixed rank budget presents two challenges. First, trajectories with different interaction traces and parameter gradients can induce equivalent changes in decision distributions, causing repeated updates to overemphasize redundant behavioral changes. Second, an aggregated update may exceed the rank budget of the adapter, and approximating it in weight space can distort the decision changes that it is intended to produce. We propose BQ-LoRA, a low-rank adaptation framework that organizes trajectory updates through a local behavior quotient manifold. It contains two modules, i.e., behavior quotient balancing (BQB) and decision preserving compression (DPC). BQB constructs the quotient manifold from decision distributions and reweights trajectory update directions according to their local density in the quotient tangent space. DPC projects the balanced gradient onto the intrinsic fixed rank tangent space and refactorizes the resulting target by jointly controlling effective weight error and distortion of decision distributions. Experiments on AppWorld and BrowseComp-Plus compare BQ-LoRA with standard LoRA and recent low-rank adaptation methods, while separate ablations evaluate the complementary contributions of both components.", "arxiv_id": "2609.12896", "arxiv_url": "https://arxiv.org/abs/2609.12896", "authors": ["Pengyang Zhou", "Xiaobin Tu", "Zhengxi Liu", "Rongkun Xue", "Haochen Li", "Miancan Liu", "Ziyuan Chen", "Yinggui Wang", "Jinkui Ren", "Xiantao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa BQ-LoRA\uff0c\u7528\u5355\u4e2a\u4f4e\u79e9 LoRA \u9002\u914d\u5668\u5b66\u4e60\u591a\u6837\u5316 LLM \u667a\u80fd\u4f53\u8f68\u8ff9\uff0c\u51cf\u5c11\u591a\u9002\u914d\u5668\u5e26\u6765\u7684\u5b58\u50a8\u4e0e\u63a8\u7406\u8def\u7531\u5f00\u9500\u3002\u65b9\u6cd5\u901a\u8fc7\u884c\u4e3a\u5546\u5e73\u8861\u53bb\u9664\u5197\u4f59\u884c\u4e3a\u66f4\u65b0\uff0c\u5e76\u7528\u51b3\u7b56\u4fdd\u6301\u538b\u7f29\u5728\u56fa\u5b9a\u79e9\u9884\u7b97\u4e0b\u5c3d\u91cf\u4fdd\u7559\u51b3\u7b56\u5206\u5e03\u6548\u679c\uff0c\u5728 AppWorld \u548c BrowseComp-Plus \u4e0a\u4f18\u4e8e\u6807\u51c6 LoRA \u7b49\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12896", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4f4e\u79e9\u9002\u914d", "LoRA"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12896", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Behavior Quotient Learning for Low-Rank Adaptation of LLM Agents", "tldr": "\u8bba\u6587\u63d0\u51fa BQ-LoRA\uff0c\u7528\u5355\u4e2a\u4f4e\u79e9 LoRA \u9002\u914d\u5668\u5b66\u4e60\u591a\u6837\u5316 LLM \u667a\u80fd\u4f53\u8f68\u8ff9\uff0c\u51cf\u5c11\u591a\u9002\u914d\u5668\u5e26\u6765\u7684\u5b58\u50a8\u4e0e\u63a8\u7406\u8def\u7531\u5f00\u9500\u3002\u65b9\u6cd5\u901a\u8fc7\u884c\u4e3a\u5546\u5e73\u8861\u53bb\u9664\u5197\u4f59\u884c\u4e3a\u66f4\u65b0\uff0c\u5e76\u7528\u51b3\u7b56\u4fdd\u6301\u538b\u7f29\u5728\u56fa\u5b9a\u79e9\u9884\u7b97\u4e0b\u5c3d\u91cf\u4fdd\u7559\u51b3\u7b56\u5206\u5e03\u6548\u679c\uff0c\u5728 AppWorld \u548c BrowseComp-Plus \u4e0a\u4f18\u4e8e\u6807\u51c6 LoRA \u7b49\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic systems offer a promising way to automate embodied benchmark construction, but existing approaches typically cover isolated stages or remain specialized to predefined environments and task families. More importantly, multi-step construction produces dependent intermediate artifacts that are often passed downstream without artifact-specific verification, allowing local defects to propagate into the final benchmark. We present Embodied-BenchForge, an agentic framework that transforms user-specified evaluation intents into complete embodied benchmark artifacts. It formulates construction as Closed-Loop Benchmark Synthesis, integrating forward artifact synthesis with backward verification and repair. Skill-Orchestrated Artifact Synthesis composes typed and reusable skills into executable workflows, while an artifact dependency graph records intermediate outputs and their dependencies. Requirement-Guided Verification and Repair applies artifact-specific contracts throughout construction and uses provenance to trigger local re-execution or upstream rollback when verification fails. Embodied-BenchForge constructs six benchmarks covering diverse embodied scenarios in the Offline EQA Track, together with one interactive benchmark containing 220 executable tasks in the Interactive Embodied Track. Evaluations of representative MLLMs and embodied agents show that the benchmarks distinguish model capabilities in both observation-based understanding and closed-loop execution. Quality assessment and ablations validate benchmark quality and the effectiveness of verification and repair, while repair and skill-reuse analyses demonstrate efficient localized recovery and cross-benchmark reusability.", "arxiv_id": "2609.13082", "arxiv_url": "https://arxiv.org/abs/2609.13082", "authors": ["Baoyang Jiang", "Fengchun Zhang", "Leyuan Wang", "Haotian Li", "Yida Wang", "Zhe Ji", "Jinshan Lai", "Xi Ren", "Danyang Li", "Zheng Yang", "Jianwei Hu", "Qiang Ma"], "brief": "\u8bba\u6587\u63d0\u51fa Embodied-BenchForge\uff0c\u4e00\u4e2a\u7528\u4e8e\u5177\u8eab\u57fa\u51c6\u6784\u5efa\u7684\u95ed\u73af\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u53ef\u5c06\u7528\u6237\u8bc4\u6d4b\u610f\u56fe\u81ea\u52a8\u8f6c\u5316\u4e3a\u5b8c\u6574\u57fa\u51c6\u3002\u5b83\u901a\u8fc7\u6280\u80fd\u7f16\u6392\u3001 artifact \u4f9d\u8d56\u56fe\u4ee5\u53ca\u9762\u5411\u9700\u6c42\u7684\u9a8c\u8bc1\u4e0e\u4fee\u590d\uff0c\u51cf\u5c11\u4e2d\u95f4\u9519\u8bef\u4f20\u64ad\uff0c\u5e76\u6784\u5efa\u4e86\u591a\u4e2a\u79bb\u7ebf\u4e0e\u4ea4\u4e92\u5f0f\u5177\u8eab\u57fa\u51c6\uff0c\u80fd\u6709\u6548\u533a\u5206\u591a\u6a21\u6001\u6a21\u578b\u548c\u5177\u8eab\u667a\u80fd\u4f53\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13082", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd", "\u57fa\u51c6\u6784\u5efa", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13082", "published_at": "2026-09-11", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Embodied-BenchForge: A Closed-Loop Agentic Workflow for Embodied Benchmark Construction", "tldr": "\u8bba\u6587\u63d0\u51fa Embodied-BenchForge\uff0c\u4e00\u4e2a\u7528\u4e8e\u5177\u8eab\u57fa\u51c6\u6784\u5efa\u7684\u95ed\u73af\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u53ef\u5c06\u7528\u6237\u8bc4\u6d4b\u610f\u56fe\u81ea\u52a8\u8f6c\u5316\u4e3a\u5b8c\u6574\u57fa\u51c6\u3002\u5b83\u901a\u8fc7\u6280\u80fd\u7f16\u6392\u3001 artifact \u4f9d\u8d56\u56fe\u4ee5\u53ca\u9762\u5411\u9700\u6c42\u7684\u9a8c\u8bc1\u4e0e\u4fee\u590d\uff0c\u51cf\u5c11\u4e2d\u95f4\u9519\u8bef\u4f20\u64ad\uff0c\u5e76\u6784\u5efa\u4e86\u591a\u4e2a\u79bb\u7ebf\u4e0e\u4ea4\u4e92\u5f0f\u5177\u8eab\u57fa\u51c6\uff0c\u80fd\u6709\u6548\u533a\u5206\u591a\u6a21\u6001\u6a21\u578b\u548c\u5177\u8eab\u667a\u80fd\u4f53\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mixture-of-Experts (MoE) creates a structural advantage for offloading: only a small fraction of activated experts need to reside in device memory, and if they can be loaded in time for computation, offloading can in principle approach full-load performance, where all model weights reside in device memory. Yet translating MoE\u0027s structural advantage into practical offloading gains remains challenging. We propose SeqMoE to bridge this gap. To maximize expert hits, we build predictive memory management: (i) Sequence-to-sequence prediction. We are the first to recast expert activation prediction as sequence modeling, enabling accurate multi-step, multi-layer forecasts that provide a long and reliable window for downstream decisions. (ii) Joint prefetch scheduling. We formulate prefetch scheduling as Job Sequencing with Deadlines to maximize expected expert hits and improve bandwidth efficiency. (iii) Forecast-driven caching. Leveraging the recursive nature of sequence modeling, we introduce a probabilistic Belady policy for future-aware eviction. To eliminate execution bottleneck, we develop (iv) Graph-compatible offloading runtime. We derive general runtime principles encompassing compute-transparent expert placement and synchronization-free orchestration disciplines for end-to-end graph capture. With 45% expert residency, SeqMoE averages a 96.97% hit rate and 80.22% of full-load performance, advancing the state of the art in MoE offloading.", "arxiv_id": "2609.12978", "arxiv_url": "https://arxiv.org/abs/2609.12978", "authors": ["Zihan Wang", "Yuqi Wang", "Lei Gong", "Cheng Tang", "Wenqi Lou", "Teng Wang", "Chao Wang", "Xuehai Zhou"], "brief": "SeqMoE \u9762\u5411 MoE \u6a21\u578b\u63d0\u51fa\u9884\u6d4b\u5f0f\u663e\u5b58\u7ba1\u7406\u4e0e\u56fe\u517c\u5bb9\u5378\u8f7d\u8fd0\u884c\u65f6\uff0c\u5c06\u4e13\u5bb6\u6fc0\u6d3b\u9884\u6d4b\u5efa\u6a21\u4e3a\u5e8f\u5217\u5230\u5e8f\u5217\u95ee\u9898\uff0c\u5e76\u8054\u5408\u9884\u53d6\u8c03\u5ea6\u4e0e\u672a\u6765\u611f\u77e5\u7f13\u5b58\u3002\u5b9e\u9a8c\u4e2d\u5728\u4ec5 45% \u4e13\u5bb6\u5e38\u9a7b\u663e\u5b58\u65f6\u8fbe\u5230 96.97% \u547d\u4e2d\u7387\u548c 80.22% \u7684\u5168\u52a0\u8f7d\u6027\u80fd\uff0c\u663e\u8457\u63d0\u5347 MoE \u5378\u8f7d\u6548\u7387\u3002", "categories": ["cs.OS", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12978", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u5378\u8f7d", "\u5e8f\u5217\u5efa\u6a21", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12978", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SeqMoE: Toward Full-Load Performance via Predictive and Graph-Compatible MoE Offloading", "tldr": "SeqMoE \u9762\u5411 MoE \u6a21\u578b\u63d0\u51fa\u9884\u6d4b\u5f0f\u663e\u5b58\u7ba1\u7406\u4e0e\u56fe\u517c\u5bb9\u5378\u8f7d\u8fd0\u884c\u65f6\uff0c\u5c06\u4e13\u5bb6\u6fc0\u6d3b\u9884\u6d4b\u5efa\u6a21\u4e3a\u5e8f\u5217\u5230\u5e8f\u5217\u95ee\u9898\uff0c\u5e76\u8054\u5408\u9884\u53d6\u8c03\u5ea6\u4e0e\u672a\u6765\u611f\u77e5\u7f13\u5b58\u3002\u5b9e\u9a8c\u4e2d\u5728\u4ec5 45% \u4e13\u5bb6\u5e38\u9a7b\u663e\u5b58\u65f6\u8fbe\u5230 96.97% \u547d\u4e2d\u7387\u548c 80.22% \u7684\u5168\u52a0\u8f7d\u6027\u80fd\uff0c\u663e\u8457\u63d0\u5347 MoE \u5378\u8f7d\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Binary-choice truth benchmarks ask models to choose between a correct and an incorrect answer, but if the two answers differ systematically in surface-level features, models can exceed chance without performing the intended reasoning. We show that this failure mode is detectable and can be exploited by downstream classifiers. In TruthfulQA, a simple six-feature logistic classifier achieves substantial accuracy in separating correct from incorrect answers. We further show that similar surface-level artifacts are present in additional benchmarks. To counteract this, we developed a general mechanism to clean them by removing the most leakage-reinforcing pairs. We release a version of TruthfulQA with surface-feature leakage reduced close to chance and provide a mechanism, Audit-Prune, so that the datasets can be cleaned before release.", "arxiv_id": "2609.13003", "arxiv_url": "https://arxiv.org/abs/2609.13003", "authors": ["Foad Namjoo", "Remy Ogasawara", "Amirali Abdullah", "Cullen Anderson", "Narmeen Fatimah Oozeer", "Jeff M. Phillips"], "brief": "\u8bba\u6587\u6307\u51fa\u4e8c\u9009\u4e00\u771f\u5b9e\u6027\u8bc4\u6d4b\u4e2d\uff0c\u6b63\u786e\u4e0e\u9519\u8bef\u7b54\u6848\u53ef\u80fd\u5b58\u5728\u8868\u5c42\u7279\u5f81\u5dee\u5f02\uff0c\u5bfc\u81f4\u6a21\u578b\u65e0\u9700\u771f\u6b63\u63a8\u7406\u4e5f\u80fd\u8d85\u8fc7\u968f\u673a\u6c34\u5e73\uff1b\u5728 TruthfulQA \u4e0a\uff0c\u7b80\u5355\u7684\u516d\u7279\u5f81\u903b\u8f91\u56de\u5f52\u5373\u53ef\u533a\u5206\u6b63\u786e\u4e0e\u9519\u8bef\u7b54\u6848\u3002\u4f5c\u8005\u63d0\u51fa Audit-Prune \u673a\u5236\uff0c\u5220\u9664\u6700\u6613\u9020\u6210\u6cc4\u6f0f\u7684\u6837\u672c\u5bf9\uff0c\u5e76\u53d1\u5e03\u4e86\u8868\u5c42\u7279\u5f81\u6cc4\u6f0f\u63a5\u8fd1\u968f\u673a\u6c34\u5e73\u7684\u6e05\u7406\u7248 TruthfulQA\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13003", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u771f\u5b9e\u6027\u8bc4\u6d4b", "\u6570\u636e\u6cc4\u6f0f", "\u57fa\u51c6\u6e05\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13003", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Judging by the Cover: Cleaning LLM Truthfulness Benchmarks to Avoid Surface-Level Feature Leakage", "tldr": "\u8bba\u6587\u6307\u51fa\u4e8c\u9009\u4e00\u771f\u5b9e\u6027\u8bc4\u6d4b\u4e2d\uff0c\u6b63\u786e\u4e0e\u9519\u8bef\u7b54\u6848\u53ef\u80fd\u5b58\u5728\u8868\u5c42\u7279\u5f81\u5dee\u5f02\uff0c\u5bfc\u81f4\u6a21\u578b\u65e0\u9700\u771f\u6b63\u63a8\u7406\u4e5f\u80fd\u8d85\u8fc7\u968f\u673a\u6c34\u5e73\uff1b\u5728 TruthfulQA \u4e0a\uff0c\u7b80\u5355\u7684\u516d\u7279\u5f81\u903b\u8f91\u56de\u5f52\u5373\u53ef\u533a\u5206\u6b63\u786e\u4e0e\u9519\u8bef\u7b54\u6848\u3002\u4f5c\u8005\u63d0\u51fa Audit-Prune \u673a\u5236\uff0c\u5220\u9664\u6700\u6613\u9020\u6210\u6cc4\u6f0f\u7684\u6837\u672c\u5bf9\uff0c\u5e76\u53d1\u5e03\u4e86\u8868\u5c42\u7279\u5f81\u6cc4\u6f0f\u63a5\u8fd1\u968f\u673a\u6c34\u5e73\u7684\u6e05\u7406\u7248 TruthfulQA\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) have achieved strong performance on a wide range of natural language tasks, and recent benchmarks suggest that they are increasingly adept at multi-hop reasoning. However, these benchmarks are typically short-horizon, requiring only a small number of retrieval or inference steps, and provide limited evidence of reliability on real-world tasks that involve following manuals spanning hundreds of pages with complex, interdependent guidelines. In this paper, we introduce Tasks over Application Manuals (TAM), a benchmark for evaluating long-horizon procedural reasoning. We construct TAM by curating real-world tasks from two domains: ICD-10-CM clinical coding (mapping medical conditions to diagnostic codes) and U.S. federal sentencing (computing crime sentencing guideline outcomes, specifically offense levels), with human-validated labels. Each task requires following an authoritative manual with tens of thousands of rules and executing a sequence of interdependent steps across different sections to produce an exact answer. We evaluate general-purpose prompting approaches, including retrieval-augmented generation, ReAct-style prompting, and an agent-harness baseline on GPT-5, and find that the best exact-match performance remains extremely low: 1% on ICD-10-CM coding and 15.5% on sentencing tasks. These results show that current benchmarks may overestimate LLM reasoning ability and miss a key challenge: reliably following long, rule-based procedures. The complete TAM data and code are publicly available.", "arxiv_id": "2609.13005", "arxiv_url": "https://arxiv.org/abs/2609.13005", "authors": ["Utkarsh Soni", "Syed Shariyar Murtaza", "Yifan Nie", "Sachin Chandrasekhar", "Eugene Wen"], "brief": "\u8bba\u6587\u63d0\u51fa TAM \u57fa\u51c6\uff0c\u7528\u771f\u5b9e ICD-10-CM \u4e34\u5e8a\u7f16\u7801\u548c\u7f8e\u56fd\u8054\u90a6\u91cf\u5211\u4efb\u52a1\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u6570\u767e\u9875\u624b\u518c\u4e0a\u7684\u957f\u7a0b\u7a0b\u5e8f\u5316\u63a8\u7406\u80fd\u529b\u3002\u5373\u4f7f\u7528 GPT-5\u3001RAG\u3001ReAct \u548c\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u6700\u4f73\u7cbe\u786e\u5339\u914d\u7387\u4ecd\u5f88\u4f4e\uff0c\u4e34\u5e8a\u7f16\u7801\u4ec5 1%\u3001\u91cf\u5211\u4efb\u52a1 15.5%\uff0c\u663e\u793a\u73b0\u6709\u57fa\u51c6\u9ad8\u4f30\u4e86\u5927\u6a21\u578b\u7684\u590d\u6742\u89c4\u5219\u6267\u884c\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13005", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u957f\u7a0b\u63a8\u7406", "\u7a0b\u5e8f\u5316\u63a8\u7406", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13005", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tasks over Application Manuals: Revealing Gaps in Long-Horizon Procedural Reasoning for Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa TAM \u57fa\u51c6\uff0c\u7528\u771f\u5b9e ICD-10-CM \u4e34\u5e8a\u7f16\u7801\u548c\u7f8e\u56fd\u8054\u90a6\u91cf\u5211\u4efb\u52a1\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u6570\u767e\u9875\u624b\u518c\u4e0a\u7684\u957f\u7a0b\u7a0b\u5e8f\u5316\u63a8\u7406\u80fd\u529b\u3002\u5373\u4f7f\u7528 GPT-5\u3001RAG\u3001ReAct \u548c\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u6700\u4f73\u7cbe\u786e\u5339\u914d\u7387\u4ecd\u5f88\u4f4e\uff0c\u4e34\u5e8a\u7f16\u7801\u4ec5 1%\u3001\u91cf\u5211\u4efb\u52a1 15.5%\uff0c\u663e\u793a\u73b0\u6709\u57fa\u51c6\u9ad8\u4f30\u4e86\u5927\u6a21\u578b\u7684\u590d\u6742\u89c4\u5219\u6267\u884c\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Low reported scores on leading physics benchmarks, including those featured in the Artificial Analysis Intelligence Index (2026), suggest that frontier language models still struggle with advanced physics, a demanding test of their scientific reasoning and quantitative problem-solving abilities. Yet this impression does not always align with domain experts\u0027 experiences using these models in their work. We revisit these reported findings by evaluating frontier models on six widely used physics benchmarks and auditing them with experts, focusing on text-only problems with verifiable final answers. For each subfield of physics, faculty and graduate researchers with relevant expertise carefully review problem statements, reference solutions, and model responses to distinguish genuine model errors from grader errors, incorrect reference solutions, and ambiguous or underspecified questions. Most audited cases initially evaluated as incorrect reflect these benchmarking issues rather than errors in the models\u0027 physics reasoning. We then ask experts to address these benchmarking issues by correcting erroneous reference solutions and repairing or excluding flawed questions. We find that GPT-5.6-Sol\u0027s measured mean@4 rises from 47.3% to 78.7% on HLE-Physics and from 61.0% to 87.2% on CMT-Benchmark, while its corrected pass@4 reaches 94.4% on the 54 retained CritPt challenges. Corrected scores are computed on the retained evaluation subsets following expert review. Scores on the audited subsets of UGPhysics, PRISM-Physics, and PHYBench also rise substantially after correction. These findings suggest that current benchmarks substantially understate frontier models\u0027 ability to solve well-posed physics problems. Near-saturation on these closed-ended tasks highlights the need for more demanding, expert-validated evaluations.", "arxiv_id": "2609.13009", "arxiv_url": "https://arxiv.org/abs/2609.13009", "authors": ["Ali Ansari", "Haoran Sun", "Andy Zeyi Liu", "Mark Jabbour", "Yongshan Ding", "Steven Girvin", "Yu He", "Sohrab Ismail-Beigi", "Aleksander Kubica", "Owen D. Miller", "Corey O\u0027Hern", "Vidvuds Ozolins", "David Poland", "A. Douglas Stone", "Frank C. van den Bosch", "Logan Wright", "Navid Akbari", "Santanu Antu", "Kangle Cai", "Andrew Calabrese-Day", "Mateo C\u00e1rdenes Wuttig", "Meng Cheng", "Barry T. Chiang", "Ali Ghorashi", "Shouzhen Gu", "Haoyang Huang", "Zhibo Kang", "Lukas Kienesberger", "Hantian Liu", "Charles Lomba", "Zhongling Lu", "Wenchao Ma", "Rohin E. McIntosh", "Evan McKinney", "Ivan Rojkov", "Xulei Sun", "Yarone Meir Tokayer", "Naveen Balaji Umasankar", "Mira Varma", "Leda Wang", "Qimin Wang", "Tyler Wang", "Haoyu Wei", "Jinming Yang", "Jinchen Zhao", "Sherlock Tingrui Zhao", "Qinyuan Zheng", "Jay S. Zou", "Lucas Baker", "Arman Cohan", "John Sous"], "brief": "\u8bba\u6587\u91cd\u65b0\u8bc4\u4f30\u4e86\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u5728\u516d\u4e2a\u7269\u7406\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\uff0c\u5e76\u7531\u7269\u7406\u4e13\u5bb6\u5ba1\u67e5\u9898\u76ee\u3001\u53c2\u8003\u7b54\u6848\u4e0e\u6a21\u578b\u56de\u590d\u3002\u7ed3\u679c\u53d1\u73b0\u8bb8\u591a\u201c\u9519\u8bef\u201d\u5176\u5b9e\u6765\u81ea\u8bc4\u5206\u5668\u3001\u53c2\u8003\u7b54\u6848\u6216\u9898\u76ee\u672c\u8eab\u7684\u95ee\u9898\uff1b\u4fee\u6b63\u540e GPT-5.6-Sol \u7b49\u6a21\u578b\u5206\u6570\u5927\u5e45\u4e0a\u5347\uff0c\u591a\u4e2a\u57fa\u51c6\u63a5\u8fd1\u9971\u548c\u3002\u4f5c\u8005\u8ba4\u4e3a\u73b0\u6709\u7269\u7406\u8bc4\u6d4b\u4f4e\u4f30\u4e86\u524d\u6cbf\u6a21\u578b\u80fd\u529b\uff0c\u9700\u8981\u66f4\u4e25\u683c\u3001\u4e13\u5bb6\u9a8c\u8bc1\u7684\u65b0\u57fa\u51c6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13009", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u79d1\u5b66\u63a8\u7406", "\u57fa\u51c6\u8bc4\u6d4b", "\u7269\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13009", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Good Are Frontier Models at Physics? Expert Re-Grading Reveals Broken Evaluations and Near-Saturation of Leading Benchmarks", "tldr": "\u8bba\u6587\u91cd\u65b0\u8bc4\u4f30\u4e86\u524d\u6cbf\u8bed\u8a00\u6a21\u578b\u5728\u516d\u4e2a\u7269\u7406\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\uff0c\u5e76\u7531\u7269\u7406\u4e13\u5bb6\u5ba1\u67e5\u9898\u76ee\u3001\u53c2\u8003\u7b54\u6848\u4e0e\u6a21\u578b\u56de\u590d\u3002\u7ed3\u679c\u53d1\u73b0\u8bb8\u591a\u201c\u9519\u8bef\u201d\u5176\u5b9e\u6765\u81ea\u8bc4\u5206\u5668\u3001\u53c2\u8003\u7b54\u6848\u6216\u9898\u76ee\u672c\u8eab\u7684\u95ee\u9898\uff1b\u4fee\u6b63\u540e GPT-5.6-Sol \u7b49\u6a21\u578b\u5206\u6570\u5927\u5e45\u4e0a\u5347\uff0c\u591a\u4e2a\u57fa\u51c6\u63a5\u8fd1\u9971\u548c\u3002\u4f5c
