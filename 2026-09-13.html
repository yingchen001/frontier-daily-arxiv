\u8005\u8ba4\u4e3a\u73b0\u6709\u7269\u7406\u8bc4\u6d4b\u4f4e\u4f30\u4e86\u524d\u6cbf\u6a21\u578b\u80fd\u529b\uff0c\u9700\u8981\u66f4\u4e25\u683c\u3001\u4e13\u5bb6\u9a8c\u8bc1\u7684\u65b0\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speech-to-speech translation (S2ST) has advanced significantly with speech LLMs, offering the potential for joint optimization and preserving non-linguistic information. However, these models struggle with predicting high-bitrate speech tokens in LLMs, and face the challenge of relying on S2ST training data with ideally aligned speaker identity and prosody. We propose using low-bitrate tokens based on single-layer vector quantization, trained to reconstruct self-supervised learning (SSL) features. We also employ a separate token-to-waveform decoder named Autowave-X, which is also conditioned on the source speech to improve non-linguistic transfer, thereby relaxing the training data constraints. With the integration of these techniques, we propose an S2ST model named Kraken, which augments a pre-trained LLM with speech feature inputs and the low-bitrate token outputs, followed by Autowave-X vocoder. We built the model upon Qwen3-8B and trained it using 150k hours of multilingual and multitask speech data. We demonstrated that our model exhibited better translation quality than SeamlessM4T-Large v2 and Qwen2.5-Omni, along with improved speaker and prosody transfer capabilities.", "arxiv_id": "2609.13045", "arxiv_url": "https://arxiv.org/abs/2609.13045", "authors": ["Hayato Futami", "Hassan Shahmohammadi", "Tushar Dhyani", "Alkis Koudounas", "Rapha\u00ebl Lafargue", "Yosuke Kashiwagi", "Quentin Jodelet", "Emiru Tsunoo"], "brief": "\u8bba\u6587\u63d0\u51fa Kraken\uff0c\u4e00\u79cd\u57fa\u4e8e LLM \u7684\u8bed\u97f3\u5230\u8bed\u97f3\u7ffb\u8bd1\u6a21\u578b\uff0c\u4f7f\u7528\u5355\u5c42 VQ \u7684\u4f4e\u7801\u7387\u8bed\u97f3 token \u964d\u4f4e LLM \u9884\u6d4b\u96be\u5ea6\uff0c\u5e76\u901a\u8fc7\u53cc\u8def\u5f84\u6e90\u8bed\u97f3\u6761\u4ef6\u589e\u5f3a\u8bf4\u8bdd\u4eba\u548c\u97f5\u5f8b\u8fc1\u79fb\u3002\u6a21\u578b\u57fa\u4e8e Qwen3-8B\u3001\u4f7f\u7528 15 \u4e07\u5c0f\u65f6\u591a\u8bed\u79cd\u591a\u4efb\u52a1\u8bed\u97f3\u6570\u636e\u8bad\u7ec3\uff0c\u5728\u7ffb\u8bd1\u8d28\u91cf\u4e0a\u4f18\u4e8e SeamlessM4T-Large v2 \u548c Qwen2.5-Omni\uff0c\u540c\u65f6\u63d0\u5347\u975e\u8bed\u8a00\u4fe1\u606f\u4fdd\u7559\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13045", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u7ffb\u8bd1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bed\u97f3\u5408\u6210", "\u591a\u8bed\u79cd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13045", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Kraken: LLM-based Speech-to-Speech Translation via Low-bitrate VQ and Dual-path Source Conditioning", "tldr": "\u8bba\u6587\u63d0\u51fa Kraken\uff0c\u4e00\u79cd\u57fa\u4e8e LLM \u7684\u8bed\u97f3\u5230\u8bed\u97f3\u7ffb\u8bd1\u6a21\u578b\uff0c\u4f7f\u7528\u5355\u5c42 VQ \u7684\u4f4e\u7801\u7387\u8bed\u97f3 token \u964d\u4f4e LLM \u9884\u6d4b\u96be\u5ea6\uff0c\u5e76\u901a\u8fc7\u53cc\u8def\u5f84\u6e90\u8bed\u97f3\u6761\u4ef6\u589e\u5f3a\u8bf4\u8bdd\u4eba\u548c\u97f5\u5f8b\u8fc1\u79fb\u3002\u6a21\u578b\u57fa\u4e8e Qwen3-8B\u3001\u4f7f\u7528 15 \u4e07\u5c0f\u65f6\u591a\u8bed\u79cd\u591a\u4efb\u52a1\u8bed\u97f3\u6570\u636e\u8bad\u7ec3\uff0c\u5728\u7ffb\u8bd1\u8d28\u91cf\u4e0a\u4f18\u4e8e SeamlessM4T-Large v2 \u548c Qwen2.5-Omni\uff0c\u540c\u65f6\u63d0\u5347\u975e\u8bed\u8a00\u4fe1\u606f\u4fdd\u7559\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual goal and dynamics prediction can provide language-conditioned robot policies with both a target outcome and a representation of action-dependent scene changes. We bring these predictions into action generation and selection through a shared trajectory model. Dynin-Robotics implements this formulation on Dynin-Omni, an omnimodal masked-diffusion backbone, representing language, visual observations, goals, and actions as discrete tokens. By varying conditioning and target spans, the same model learns action prediction, action-conditioned next-observation prediction, terminal goal-state prediction, and trajectory-to-instruction reconstruction. These interfaces support test-time scaling through goal prediction, action-candidate evaluation, and joint refinement of action and future-state predictions. We continually pretrain the model on approximately 1.33 million trajectories from 48 Open X-Embodiment datasets and adapt it separately to downstream domains. On two VLABench tasks, robot pretraining improves adaptation within a fixed Stage-2 step budget, and the full objective mixture improves shifted-instruction success over Policy-only post-training under the same coupled decoder. Combining goal guidance with joint action-next-state denoising further improves shifted-instruction success over action-only decoding; the benefit depends on how the predictions are composed. Dynin-Robotics achieves competitive performance on LIBERO and zero-shot LIBERO-Plus, together with a 78.4% average success rate across four manipulation conditions on a Franka Research 3 robot. An optimized block-parallel implementation accelerates model-side action decoding by up to 29.2x relative to the base implementation under the reported profiling setup. These results support shared trajectory modeling as a common interface for learning complementary robot objectives and composing their predictions during control.", "arxiv_id": "2609.13053", "arxiv_url": "https://arxiv.org/abs/2609.13053", "authors": ["Hoeun Lee", "Jaeik Kim", "Jusang Oh", "Jinhyeok Kim", "Geon Choi", "Hyeonggeun Kim", "Jaeyoung Do"], "brief": "Dynin-Robotics \u57fa\u4e8e\u5168\u6a21\u6001\u63a9\u7801\u6269\u6563\u9aa8\u5e72 Dynin-Omni\uff0c\u5c06\u8bed\u8a00\u3001\u89c6\u89c9\u3001\u76ee\u6807\u548c\u52a8\u4f5c\u7edf\u4e00\u4e3a\u79bb\u6563 token\uff0c\u8054\u5408\u5b66\u4e60\u52a8\u4f5c\u9884\u6d4b\u3001\u672a\u6765\u89c2\u6d4b\u9884\u6d4b\u3001\u76ee\u6807\u72b6\u6001\u9884\u6d4b\u548c\u8f68\u8ff9\u5230\u6307\u4ee4\u91cd\u5efa\u3002\u901a\u8fc7\u5927\u89c4\u6a21\u673a\u5668\u4eba\u8f68\u8ff9\u9884\u8bad\u7ec3\u4e0e\u6d4b\u8bd5\u65f6\u76ee\u6807\u5f15\u5bfc\u3001\u52a8\u4f5c\u5019\u9009\u8bc4\u4f30\u548c\u8054\u5408\u53bb\u566a\uff0c\u5728 VLABench\u3001LIBERO\u3001\u771f\u5b9e Franka \u673a\u5668\u4eba\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\uff0c\u5e76\u5c06\u52a8\u4f5c\u89e3\u7801\u52a0\u901f\u6700\u9ad8 29.2 \u500d\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13053", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13053", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model", "tldr": "Dynin-Robotics \u57fa\u4e8e\u5168\u6a21\u6001\u63a9\u7801\u6269\u6563\u9aa8\u5e72 Dynin-Omni\uff0c\u5c06\u8bed\u8a00\u3001\u89c6\u89c9\u3001\u76ee\u6807\u548c\u52a8\u4f5c\u7edf\u4e00\u4e3a\u79bb\u6563 token\uff0c\u8054\u5408\u5b66\u4e60\u52a8\u4f5c\u9884\u6d4b\u3001\u672a\u6765\u89c2\u6d4b\u9884\u6d4b\u3001\u76ee\u6807\u72b6\u6001\u9884\u6d4b\u548c\u8f68\u8ff9\u5230\u6307\u4ee4\u91cd\u5efa\u3002\u901a\u8fc7\u5927\u89c4\u6a21\u673a\u5668\u4eba\u8f68\u8ff9\u9884\u8bad\u7ec3\u4e0e\u6d4b\u8bd5\u65f6\u76ee\u6807\u5f15\u5bfc\u3001\u52a8\u4f5c\u5019\u9009\u8bc4\u4f30\u548c\u8054\u5408\u53bb\u566a\uff0c\u5728 VLABench\u3001LIBERO\u3001\u771f\u5b9e Franka \u673a\u5668\u4eba\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\uff0c\u5e76\u5c06\u52a8\u4f5c\u89e3\u7801\u52a0\u901f\u6700\u9ad8 29.2 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion Language Models (DLMs) offer promising parallel generation capabilities but lag behind autoregressive models in complex reasoning and tool-use tasks. While Reinforcement Learning (RL) has recently been applied to enhance DLMs, standard RL approaches suffer from an exploration bottleneck. To address this, we inject reasoning priors from a stronger teacher model to guide RL exploration. In this paper, we introduce CanvasAnneal, a curriculum-guided diffusion RL framework. During the initial RL phase, we warm-start exploration by injecting teacher-generated reasoning traces into the initial diffusion canvas. As training progresses, we gradually remove this guidance and require the model to generate more of the reasoning trajectory independently. Across mathematical reasoning and tool-use benchmarks, CanvasAnneal improves over standard diffu-GRPO on MATH500, Countdown, and Tau2 and substantially accelerates reward improvement on several tasks, while gains are task-dependent. Our results suggest that structured training-time guidance can alleviate exploration bottlenecks in diffusion RL and speed up convergence on harder tasks.", "arxiv_id": "2609.13060", "arxiv_url": "https://arxiv.org/abs/2609.13060", "authors": ["Blake Olson", "Yuhang Song", "Emmett McQuinn", "Yuan Shangguan"], "brief": "\u8bba\u6587\u63d0\u51fa CanvasAnneal\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u8bfe\u7a0b\u5f0f\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u5728\u8bad\u7ec3\u65e9\u671f\u5411\u6269\u6563\u753b\u5e03\u6ce8\u5165\u5f3a\u6559\u5e08\u6a21\u578b\u751f\u6210\u7684\u63a8\u7406\u8f68\u8ff9\u6765\u6539\u5584\u63a2\u7d22\u3002\u968f\u540e\u9010\u6b65\u9000\u706b\u79fb\u9664\u6559\u5e08\u5f15\u5bfc\uff0c\u8ba9\u6a21\u578b\u72ec\u7acb\u751f\u6210\u63a8\u7406\u8fc7\u7a0b\uff1b\u5728\u6570\u5b66\u63a8\u7406\u548c\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u4e0a\u76f8\u6bd4\u6807\u51c6 diffu-GRPO \u6709\u63d0\u5347\uff0c\u5e76\u80fd\u52a0\u901f\u5956\u52b1\u6536\u655b\uff0c\u4f46\u6536\u76ca\u4f9d\u4efb\u52a1\u800c\u5f02\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13060", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u8bfe\u7a0b\u5b66\u4e60", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13060", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CanvasAnneal: Curriculum Reinforcement Learning for Diffusion Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa CanvasAnneal\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u8bfe\u7a0b\u5f0f\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u5728\u8bad\u7ec3\u65e9\u671f\u5411\u6269\u6563\u753b\u5e03\u6ce8\u5165\u5f3a\u6559\u5e08\u6a21\u578b\u751f\u6210\u7684\u63a8\u7406\u8f68\u8ff9\u6765\u6539\u5584\u63a2\u7d22\u3002\u968f\u540e\u9010\u6b65\u9000\u706b\u79fb\u9664\u6559\u5e08\u5f15\u5bfc\uff0c\u8ba9\u6a21\u578b\u72ec\u7acb\u751f\u6210\u63a8\u7406\u8fc7\u7a0b\uff1b\u5728\u6570\u5b66\u63a8\u7406\u548c\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u4e0a\u76f8\u6bd4\u6807\u51c6 diffu-GRPO \u6709\u63d0\u5347\uff0c\u5e76\u80fd\u52a0\u901f\u5956\u52b1\u6536\u655b\uff0c\u4f46\u6536\u76ca\u4f9d\u4efb\u52a1\u800c\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conversational voice agents have advanced significantly, offering increasingly natural human-machine interactions through both cascaded and end-to-end architectures. However, while recent benchmarks extensively evaluate dyadic interactions and passive audio comprehension, they largely overlook a prevalent real-world scenario: multi-party conversations. Evaluating agents in these settings is fundamentally more challenging than in dyadic interactions due to the exponentially greater conversational complexity. For voice agents to integrate seamlessly into human group dynamics, they must not only generate contextually appropriate responses but also demonstrate a nuanced understanding of open turn-taking. To address this gap, we introduce Multiparty Bench (MP-Bench), the first benchmark specifically designed to objectively evaluate conversational speech systems as active participants within multi-party contexts. MP-Bench assesses agent behavior along two primary dimensions: turn-taking awareness and response appropriateness. Additionally, we incorporate comprehension-based question-answering tasks as a complementary evaluation. By benchmarking 12 voice agents, we find that real-time voice agents stay at or below 22% on multiparty comprehension and remain near chance on multiparty turn-taking, exposing an open challenge for real-time voice agents under multiparty scenario.", "arxiv_id": "2609.13076", "arxiv_url": "https://arxiv.org/abs/2609.13076", "authors": ["Yi-Jen Shih", "Shih-Yun Shan Kuan", "Guan-Ting Lin", "Kai-Wei Chang", "Siddhant Arora", "Shu-wen Yang", "Abdelrahman Mohamed", "Shinji Watanabe", "Hung-yi Lee", "David Harwath"], "brief": "\u8bba\u6587\u63d0\u51fa MP-Bench\uff0c\u9996\u4e2a\u9762\u5411\u591a\u65b9\u5bf9\u8bdd\u573a\u666f\u7684\u8bed\u97f3\u667a\u80fd\u4f53\u5ba2\u89c2\u8bc4\u6d4b\u57fa\u51c6\uff0c\u91cd\u70b9\u8003\u5bdf\u8f6e\u6b21\u63a5\u7ba1\u610f\u8bc6\u3001\u56de\u5e94\u662f\u5426\u5408\u9002\uff0c\u5e76\u8865\u5145\u591a\u65b9\u7406\u89e3\u95ee\u7b54\u4efb\u52a1\u3002\u5bf912\u4e2a\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u5b9e\u65f6\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u591a\u65b9\u7406\u89e3\u4e0a\u4e0d\u8d85\u8fc722%\uff0c\u591a\u65b9\u8f6e\u6b21\u5224\u65ad\u63a5\u8fd1\u968f\u673a\uff0c\u66b4\u9732\u51fa\u5f53\u524d\u7cfb\u7edf\u5728\u7fa4\u4f53\u5bf9\u8bdd\u53c2\u4e0e\u4e2d\u7684\u660e\u663e\u77ed\u677f\u3002", "categories": ["eess.AS", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13076", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u667a\u80fd\u4f53", "\u591a\u65b9\u5bf9\u8bdd", "\u57fa\u51c6\u8bc4\u6d4b", "\u5bf9\u8bdd\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13076", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MP-Bench: Evaluating Voice Agents as a Multiparty Conversation Participant", "tldr": "\u8bba\u6587\u63d0\u51fa MP-Bench\uff0c\u9996\u4e2a\u9762\u5411\u591a\u65b9\u5bf9\u8bdd\u573a\u666f\u7684\u8bed\u97f3\u667a\u80fd\u4f53\u5ba2\u89c2\u8bc4\u6d4b\u57fa\u51c6\uff0c\u91cd\u70b9\u8003\u5bdf\u8f6e\u6b21\u63a5\u7ba1\u610f\u8bc6\u3001\u56de\u5e94\u662f\u5426\u5408\u9002\uff0c\u5e76\u8865\u5145\u591a\u65b9\u7406\u89e3\u95ee\u7b54\u4efb\u52a1\u3002\u5bf912\u4e2a\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u5b9e\u65f6\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u591a\u65b9\u7406\u89e3\u4e0a\u4e0d\u8d85\u8fc722%\uff0c\u591a\u65b9\u8f6e\u6b21\u5224\u65ad\u63a5\u8fd1\u968f\u673a\uff0c\u66b4\u9732\u51fa\u5f53\u524d\u7cfb\u7edf\u5728\u7fa4\u4f53\u5bf9\u8bdd\u53c2\u4e0e\u4e2d\u7684\u660e\u663e\u77ed\u677f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Full-duplex evaluation often emphasizes whether an agent keeps speaking or stops. That binary cannot express a third response humans use routinely: continuing to speak while incorporating what the listener just contributed. The contribution may be a missing word, a correction or a clarification. We introduce Duplex Cue, an evaluation of this \\emph{in-turn adaptation} in full-duplex voice agents. Duplex Cue separates listener intent (backchannel, collaboration, or interruption) from speaker behavior: continuing unchanged, adapting within the turn, or yielding. Adaptation includes acknowledgment as well as content revision. In a single-model case study using 300 human-confirmed cues from unscripted English conversations, we compare recorded human responses with PersonaPlex continuations generated while replaying the listener\u0027s audio. We retain 208 pairs with the ongoing speaker active at cue onset and a scorable response in each condition. On the 66 collaborative pairs, recorded speakers adapt in 68.2\\% of cases, compared with 34.8\\% for PersonaPlex. The model otherwise continues unchanged (42.4\\%) or yields (22.7\\%). These findings show why evaluating natural voice interaction requires measuring how an agent responds to a listener\u0027s contribution as well as whether it keeps speaking.", "arxiv_id": "2609.13117", "arxiv_url": "https://arxiv.org/abs/2609.13117", "authors": ["Yunqi Lu", "Tyler Baumgartner", "Nikhil Johri", "Brandon Tai", "Candice Fan", "Luc Debaupte", "Ruben Aguilar", "Bill Wang", "Yi Zhong"], "brief": "\u8bba\u6587\u63d0\u51fa Duplex Cue\uff0c\u7528\u4e8e\u8bc4\u4f30\u5168\u53cc\u5de5\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u88ab\u542c\u8005\u63d2\u8bdd/\u8865\u5145\u65f6\u662f\u5426\u80fd\u5728\u5f53\u524d\u8f6e\u6b21\u5185\u9002\u5e94\uff0c\u800c\u4e0d\u53ea\u662f\u7ee7\u7eed\u8bf4\u6216\u505c\u6b62\u8bf4\u3002\u57fa\u4e8e300\u4e2a\u4eba\u7c7b\u786e\u8ba4\u7684\u65e0\u811a\u672c\u82f1\u8bed\u5bf9\u8bdd\u7ebf\u7d22\uff0c\u6848\u4f8b\u7814\u7a76\u663e\u793a\u5728\u4eba\u7c7b\u534f\u4f5c\u6027\u63d0\u793a\u4e2d\u8bf4\u8bdd\u8005\u670968.2%\u4f1a\u9002\u5e94\uff0c\u800c PersonaPlex \u4ec534.8%\uff0c\u66f4\u591a\u662f\u539f\u6837\u7ee7\u7eed\u6216\u8ba9\u51fa\u8bdd\u8f6e\u3002", "categories": ["cs.CL", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13117", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bed\u97f3\u4ea4\u4e92", "\u5bf9\u8bdd\u8bc4\u4f30", "\u5168\u53cc\u5de5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13117", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Continue, Adapt, or Yield: In-Turn Adaptation to Overlapping Speech in Full-Duplex Agents", "tldr": "\u8bba\u6587\u63d0\u51fa Duplex Cue\uff0c\u7528\u4e8e\u8bc4\u4f30\u5168\u53cc\u5de5\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u88ab\u542c\u8005\u63d2\u8bdd/\u8865\u5145\u65f6\u662f\u5426\u80fd\u5728\u5f53\u524d\u8f6e\u6b21\u5185\u9002\u5e94\uff0c\u800c\u4e0d\u53ea\u662f\u7ee7\u7eed\u8bf4\u6216\u505c\u6b62\u8bf4\u3002\u57fa\u4e8e300\u4e2a\u4eba\u7c7b\u786e\u8ba4\u7684\u65e0\u811a\u672c\u82f1\u8bed\u5bf9\u8bdd\u7ebf\u7d22\uff0c\u6848\u4f8b\u7814\u7a76\u663e\u793a\u5728\u4eba\u7c7b\u534f\u4f5c\u6027\u63d0\u793a\u4e2d\u8bf4\u8bdd\u8005\u670968.2%\u4f1a\u9002\u5e94\uff0c\u800c PersonaPlex \u4ec534.8%\uff0c\u66f4\u591a\u662f\u539f\u6837\u7ee7\u7eed\u6216\u8ba9\u51fa\u8bdd\u8f6e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier language models are more aggressively using subquadratic attention to reduce the memory footprint and compute requirements during inference while still delivering frontier accuracy. While existing systems make dense attention-centric disaggregated serving decisions, we show that disaggregating inference around the unique arithmetic intensity and memory footprint of subquadratic attention LLMs can achieve significant throughput and energy efficiency gains on emerging DRAM-based and SRAM-only heterogeneous systems. We introduce SQD (SubQuadratic Disaggregation), a fine-grained heterogeneous disaggregation scheme that splits decode by quadratic and subquadratic attention rather than by operator type, and that applies across subquadratic attention variants. For sparse attention LLMs, we disaggregate decode into top-k selection, which must index through the full KV, and top-k attention plus FFN, which have static memory footprints. For linear and sliding-window attention LLMs, we disaggregate decode into dense attention layers and subquadratic attention layers plus FFN. In an adjusted 8xB200 heterogeneous system proxy, we observe average tokens/J improvements of 53% on GLM 5.2, 31% on Nemotron 3 Ultra, and 56% on Gemma 4 31B over the strongest GPU-only baselines. In an analytical model of a Rubin plus LPX system with fixed power budgets, we observe 1.2x to 1.5x tighter achievable latencies and up to 3.6x higher throughput over the best baseline of attention-FFN disaggregation. Our experiments also reveal architectural insights on chip and interconnect provisioning for next-generation heterogeneous systems serving subquadratic attention.", "arxiv_id": "2609.13134", "arxiv_url": "https://arxiv.org/abs/2609.13134", "authors": ["Arya Tschand", "Yaosheng Fu", "Vikram Sharma Mailthody", "Nicolai Oswald", "Po-An Tsai", "Ritchie Zhao", "Oreste Villa", "Vijay Janapa Reddi", "Karu Sankaralingam"], "brief": "\u8bba\u6587\u63d0\u51fa SQD\uff08SubQuadratic Disaggregation\uff09\uff0c\u9488\u5bf9\u6b21\u4e8c\u6b21\u6ce8\u610f\u529b\u6a21\u578b\u7684\u7b97\u672f\u5f3a\u5ea6\u4e0e\u5185\u5b58\u5360\u7528\u7279\u70b9\uff0c\u5c06\u89e3\u7801\u9636\u6bb5\u6309\u4e8c\u6b21/\u6b21\u4e8c\u6b21\u6ce8\u610f\u529b\u7ec6\u7c92\u5ea6\u62c6\u5206\u5230\u5f02\u6784\u7cfb\u7edf\u4e0a\uff0c\u800c\u4e0d\u662f\u6cbf\u7528\u9762\u5411\u7a20\u5bc6\u6ce8\u610f\u529b\u7684\u7b97\u5b50\u7ea7\u62c6\u5206\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u5f02\u6784\u7cfb\u7edf\u4ee3\u7406\u4e0a\u53ef\u663e\u8457\u63d0\u5347\u80fd\u6548\u4e0e\u541e\u5410\uff0c\u4f8b\u5982 tokens/J \u76f8\u6bd4 GPU-only \u57fa\u7ebf\u63d0\u5347\u7ea6 31% \u5230 56%\uff0c\u5206\u6790\u6a21\u578b\u4e2d\u541e\u5410\u6700\u9ad8\u63d0\u5347 3.6 \u500d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13134", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6ce8\u610f\u529b\u673a\u5236", "\u5f02\u6784\u8ba1\u7b97", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13134", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rethinking Heterogeneous System Disaggregation for Subquadratic Attention", "tldr": "\u8bba\u6587\u63d0\u51fa SQD\uff08SubQuadratic Disaggregation\uff09\uff0c\u9488\u5bf9\u6b21\u4e8c\u6b21\u6ce8\u610f\u529b\u6a21\u578b\u7684\u7b97\u672f\u5f3a\u5ea6\u4e0e\u5185\u5b58\u5360\u7528\u7279\u70b9\uff0c\u5c06\u89e3\u7801\u9636\u6bb5\u6309\u4e8c\u6b21/\u6b21\u4e8c\u6b21\u6ce8\u610f\u529b\u7ec6\u7c92\u5ea6\u62c6\u5206\u5230\u5f02\u6784\u7cfb\u7edf\u4e0a\uff0c\u800c\u4e0d\u662f\u6cbf\u7528\u9762\u5411\u7a20\u5bc6\u6ce8\u610f\u529b\u7684\u7b97\u5b50\u7ea7\u62c6\u5206\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u5f02\u6784\u7cfb\u7edf\u4ee3\u7406\u4e0a\u53ef\u663e\u8457\u63d0\u5347\u80fd\u6548\u4e0e\u541e\u5410\uff0c\u4f8b\u5982 tokens/J \u76f8\u6bd4 GPU-only \u57fa\u7ebf\u63d0\u5347\u7ea6 31% \u5230 56%\uff0c\u5206\u6790\u6a21\u578b\u4e2d\u541e\u5410\u6700\u9ad8\u63d0\u5347 3.6 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A growing body of work establishes that large language models are not mere statistical memorizers, but are capable of in-context learning: performing inference at test time using only examples provided in the prompt, without any parameter updates. Prior theoretical work has shown that this capability extends to supervised learning tasks such as linear regression. We prove that in-context learning extends further to \\emph{data generation}: frozen transformers can simulate iterative generative samplers from in-context samples. We first show that transformers can realize closed-form and smoothed closed-form diffusion samplers. The construction identifies a concrete generative role for softmax attention: it computes responsibility weights and weighted empirical averages, while feedforward layers implement Euler updates. To empirically relate these constructions to pretrained language models, we study \\emph{semantic-topic sampling}: prompts consisting of words drawn from a common semantic category, such as animals, foods, or cities. Across transformer layers, the normalized hidden states exhibit a two-stage geometry: they move toward a uniform spherical reference in intermediate layers and then return to structured, topic-dependent representations near the output. We further measure an interacting-particle energy on these hidden-state clouds and observe the same U-shape pattern. We then prove that transformers can approximate an energy-based sampler, constructing the same U-shape energy across the layers.", "arxiv_id": "2609.08981", "arxiv_url": "https://arxiv.org/abs/2609.08981", "authors": ["Arman Adibi", "Alireza Jafari", "Mohammad Ghavamzadeh", "Hadi Daneshmand"], "brief": "\u8bba\u6587\u8bc1\u660e\u51bb\u7ed3\u7684 Transformer \u4e0d\u4ec5\u80fd\u505a\u4e0a\u4e0b\u6587\u5b66\u4e60\u63a8\u7406\uff0c\u8fd8\u80fd\u57fa\u4e8e\u63d0\u793a\u4e2d\u7684\u6837\u672c\u6a21\u62df\u8fed\u4ee3\u5f0f\u751f\u6210\u91c7\u6837\u5668\u3002\u4f5c\u8005\u6784\u9020\u4e86\u95ed\u5f0f\u6269\u6563\u3001\u5e73\u6ed1\u95ed\u5f0f\u6269\u6563\u548c\u80fd\u91cf\u6a21\u578b\u91c7\u6837\u7684 Transformer \u5b9e\u73b0\uff0c\u5e76\u5728\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u8bed\u4e49\u4e3b\u9898\u91c7\u6837\u4e2d\u89c2\u5bdf\u5230\u4e0e\u7406\u8bba\u4e00\u81f4\u7684\u5c42\u95f4 U \u5f62\u51e0\u4f55/\u80fd\u91cf\u53d8\u5316\u3002", "categories": ["cs.LG", "cs.AI", "stat.AP", "stat.CO", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08981", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e0a\u4e0b\u6587\u5b66\u4e60", "Transformer", "\u6269\u6563\u6a21\u578b", "\u80fd\u91cf\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08981", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Transformers as In-Context Samplers: From Closed-Form Diffusion to Estimation-Free Sampling", "tldr": "\u8bba\u6587\u8bc1\u660e\u51bb\u7ed3\u7684 Transformer \u4e0d\u4ec5\u80fd\u505a\u4e0a\u4e0b\u6587\u5b66\u4e60\u63a8\u7406\uff0c\u8fd8\u80fd\u57fa\u4e8e\u63d0\u793a\u4e2d\u7684\u6837\u672c\u6a21\u62df\u8fed\u4ee3\u5f0f\u751f\u6210\u91c7\u6837\u5668\u3002\u4f5c\u8005\u6784\u9020\u4e86\u95ed\u5f0f\u6269\u6563\u3001\u5e73\u6ed1\u95ed\u5f0f\u6269\u6563\u548c\u80fd\u91cf\u6a21\u578b\u91c7\u6837\u7684 Transformer \u5b9e\u73b0\uff0c\u5e76\u5728\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u8bed\u4e49\u4e3b\u9898\u91c7\u6837\u4e2d\u89c2\u5bdf\u5230\u4e0e\u7406\u8bba\u4e00\u81f4\u7684\u5c42\u95f4 U \u5f62\u51e0\u4f55/\u80fd\u91cf\u53d8\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Finger-level motor decoding is important for naturalistic brain-computer interface (BCI) control, yet individual-finger decoding from scalp electroencephalography (EEG) remains challenging because finger representations are spatially close in the sensorimotor cortex and blurred by volume conduction. Leveraging the high spatial resolution of functional MRI (fMRI), we introduce fMRI Representation-Informed Shared-Space Training (FRIST), a two-stage EEG decoding framework that first learns fMRI-informed spectral projections from simultaneous EEG-fMRI recordings and then uses fMRI-derived class geometry to guide residual refinement of EEG predictions. FRIST transfers information across recordings through shared finger labels without requiring paired trials and uses only EEG at inference. We evaluated 12 able-bodied participants during movement execution (ME) and motor imagery (MI) under two-class and three-class chronological session-held-out decoding simulating the online scenario. Using EEGNet as the EEG feature extractor, FRIST increased group average accuracy from 66.93% to 74.53% for two-class ME, from 44.83% to 56.58% for three-class ME, from 80.78% to 85.63% for two-class MI, and from 60.93% to 69.90% for three-class MI compared with the EEG-only EEGNet baseline. FRIST is also shown to improve EEG-only decoding when the target participant\u0027s own fMRI data were unavailable. FRIST also generalized across multiple EEG decoding backbones, reaching 87.40% in two-class MI and 72.54% in three-class MI with EEG Conformer as the EEG feature extractor. These findings indicate that fMRI provide useful spatial constraints for EEG representation learning. FRIST improves noninvasive EEG-based finger-level BCI decoding, offering a multimodal strategy for integrating the spatial specificity of fMRI with real-time applicability of EEG.", "arxiv_id": "2609.12298", "arxiv_url": "https://arxiv.org/abs/2609.12298", "authors": ["Jintao Zhang", "Yidan Ding", "Joshua Kosnoff", "Maxim Karrenbach", "Hanwen Wang", "Bin He"], "brief": "\u8bba\u6587\u63d0\u51fa FRIST\uff0c\u4e00\u79cd\u7528 fMRI \u8868\u5f81\u6307\u5bfc EEG \u8bad\u7ec3\u7684\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u4ece\u540c\u6b65 EEG-fMRI \u4e2d\u5b66\u4e60 fMRI \u611f\u77e5\u7684\u9891\u8c31\u6295\u5f71\uff0c\u518d\u7528 fMRI \u6d3e\u751f\u7684\u7c7b\u522b\u51e0\u4f55\u4f18\u5316 EEG \u9884\u6d4b\u3002\u8be5\u65b9\u6cd5\u63a8\u7406\u65f6\u53ea\u9700 EEG\uff0c\u5728\u624b\u6307\u7ea7\u8fd0\u52a8\u6267\u884c/\u8fd0\u52a8\u60f3\u8c61\u89e3\u7801\u4e0a\u663e\u8457\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u53ef\u6cdb\u5316\u5230\u4e0d\u540c EEG \u9aa8\u5e72\u7f51\u7edc\u548c\u7f3a\u5c11\u4e2a\u4f53 fMRI \u7684\u573a\u666f\u3002", "categories": ["cs.LG", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12298", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8111\u673a\u63a5\u53e3", "\u591a\u6a21\u6001", "\u8868\u5f81\u5b66\u4e60", "EEG\u89e3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12298", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FRIST: FMRI Representation Informed Shared-space Training Improves EEG-only Individual-Finger BCI Decoding", "tldr": "\u8bba\u6587\u63d0\u51fa FRIST\uff0c\u4e00\u79cd\u7528 fMRI \u8868\u5f81\u6307\u5bfc EEG \u8bad\u7ec3\u7684\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u4ece\u540c\u6b65 EEG-fMRI \u4e2d\u5b66\u4e60 fMRI \u611f\u77e5\u7684\u9891\u8c31\u6295\u5f71\uff0c\u518d\u7528 fMRI \u6d3e\u751f\u7684\u7c7b\u522b\u51e0\u4f55\u4f18\u5316 EEG \u9884\u6d4b\u3002\u8be5\u65b9\u6cd5\u63a8\u7406\u65f6\u53ea\u9700 EEG\uff0c\u5728\u624b\u6307\u7ea7\u8fd0\u52a8\u6267\u884c/\u8fd0\u52a8\u60f3\u8c61\u89e3\u7801\u4e0a\u663e\u8457\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u53ef\u6cdb\u5316\u5230\u4e0d\u540c EEG \u9aa8\u5e72\u7f51\u7edc\u548c\u7f3a\u5c11\u4e2a\u4f53 fMRI \u7684\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Small models are made more capable through distillation from a larger one that shares their tokenization scheme. However, do distilled byte and token models behave similarly in terms of scaling trends as compute and data increases? To enable this comparison, we introduce two variants to efficiently convert token logits to Byte Logits: 1) approximate: Marginalize-It, and 2) exact: End-Of-Token. We then present the first large scale study of overtraining decoder-only dense transformer models varying two dimensions simultaneously: the tokenization scheme (Tokens, Bytes, Bytes w/ eot) and the training objective (Distillation vs. Cross-Entropy), sweeping layer-parameter-matched models with roughly 1 billion parameters up to 1 trillion bytes of data. Across eight benchmarks spanning three categories: Multiple Choice QA, Language Generation, and Machine Translation, we find that Token-1B models outperform byte models (End-Of-Token-1B and Bytes-1B) in the low-FLOP regime but eventually plateau; byte models start worse yet surpass Token-1B models with more compute, reaching a higher downstream task performance ceiling. Extrapolating the average top-1 error vs. validation BPB scaling laws predicts that, asymptotically, distilled End-Of-Token-1B outperforms distilled Token-1B by up to 4%. They are also far more data efficient, matching the performance of distilled Token-1B using only one-sixth of the training data. Moreover, by operating over a small vocabulary of 256 bytes instead of on the order of 100K tokens, they circumvent the need for top-k truncation during logit dumping, while also reducing logit storage costs to roughly one-fifth. Finally, our downstream performance scaling laws predict that our distilled End-Of-Token-1B models asymptotically surpass the Llama 3.2-1B, Gemma-3-1B-pt, and Gemma 2B models on averaged downstream tasks by up to 6.5%, 8.1%, and 2.1%, respectively.", "arxiv_id": "2609.12303", "arxiv_url": "https://arxiv.org/abs/2609.12303", "authors": ["Kalyani Marathe", "Artidoro Pagnoni", "Tomasz Limisiewicz", "Margaret Li", "Mike Lewis", "Luke Zettlemoyer", "Srinivasan Iyer"], "brief": "\u8bba\u6587\u7814\u7a76\u5b57\u8282\u7ea7\u5c0f\u6a21\u578b\u7684\u84b8\u998f\u4e0e\u6269\u5c55\u89c4\u5f8b\uff0c\u63d0\u51fa\u4e24\u79cd\u5c06 token logits \u8f6c\u4e3a byte logits \u7684\u65b9\u6cd5\uff0c\u5e76\u5728\u7ea6 10\u4ebf\u53c2\u6570\u6a21\u578b\u3001\u6700\u9ad8 1\u4e07\u4ebf\u5b57\u8282\u6570\u636e\u4e0a\u8fdb\u884c\u5927\u89c4\u6a21\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a token \u6a21\u578b\u5728\u4f4e\u7b97\u529b\u4e0b\u66f4\u5f3a\u4f46\u8f83\u65e9\u8fbe\u5230\u74f6\u9888\uff0c\u5b57\u8282\u6a21\u578b\u968f\u7b97\u529b\u589e\u52a0\u53ef\u8d85\u8fc7 token \u6a21\u578b\uff0c\u84b8\u998f\u7248 End-Of-Token \u5b57\u8282\u6a21\u578b\u8fd8\u663e\u8457\u63d0\u5347\u6570\u636e\u6548\u7387\u5e76\u964d\u4f4e logits \u5b58\u50a8\u6210\u672c\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12303", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u5b57\u8282\u6a21\u578b", "\u6269\u5c55\u89c4\u5f8b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12303", "published_at": "2026-09-11", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Breaking the Token Ceiling: Distilling Smaller, Stronger Byte Models", "tldr": "\u8bba\u6587\u7814\u7a76\u5b57\u8282\u7ea7\u5c0f\u6a21\u578b\u7684\u84b8\u998f\u4e0e\u6269\u5c55\u89c4\u5f8b\uff0c\u63d0\u51fa\u4e24\u79cd\u5c06 token logits \u8f6c\u4e3a byte logits \u7684\u65b9\u6cd5\uff0c\u5e76\u5728\u7ea6 10\u4ebf\u53c2\u6570\u6a21\u578b\u3001\u6700\u9ad8 1\u4e07\u4ebf\u5b57\u8282\u6570\u636e\u4e0a\u8fdb\u884c\u5927\u89c4\u6a21\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a token \u6a21\u578b\u5728\u4f4e\u7b97\u529b\u4e0b\u66f4\u5f3a\u4f46\u8f83\u65e9\u8fbe\u5230\u74f6\u9888\uff0c\u5b57\u8282\u6a21\u578b\u968f\u7b97\u529b\u589e\u52a0\u53ef\u8d85\u8fc7 token \u6a21\u578b\uff0c\u84b8\u998f\u7248 End-Of-Token \u5b57\u8282\u6a21\u578b\u8fd8\u663e\u8457\u63d0\u5347\u6570\u636e\u6548\u7387\u5e76\u964d\u4f4e logits \u5b58\u50a8\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Wrist-worn IMU has been widely used for daily-life health monitoring. Yet, it does not fully represent whole-body dynamics, for which the body center of mass (COM) is considered the physiological reference standard. Therefore, this work proposes a simplified kinematic model (KM), which is designed to map the wrist IMU to the COM acceleration. It is built upon several reductive assumptions that enable the solvability of the dynamic equations based on wrist IMU measurements alone. This work further proposes three types of hybrid AI modeling methods, namely human kinematic model-based neural network (HKM-NN) models, to leverage the power of both grey-box and black-box modeling. The HKM-NN methods include serial learning (ser-) and two approaches of simultaneous learning (sim1- and sim2-). The proposed models are trained and tested using our dataset, which includes wrist IMU measurements and ground-truth COM measurements from 10 healthy volunteers during six gait activities and sit-to-stand (SS) transitional movement. The results demonstrate the feasibility of estimating COM acceleration from wrist IMU measurements. Our KM model yields satisfactory results, with an error ranging from 6.7% to 12.5% for gait activities and 5.6% for the SS. In comparison with the KM model, our HKM-NN models significantly enhance the performance, achieving 5.3% to 9.3% errors for gait activities, and the best error of 3.9% for the SS. In addition, the HKM-NN models demonstrate distinct robustness characteristics under noisy test conditions, with sim1-/sim2- generally maintaining greater robustness under Gaussian perturbations, while the KM model exhibits comparatively strong robustness under salt-and-pepper noise. These findings highlight the importance of combining biomechanical structure with data-driven learning for wearable sensing applications operating under imperfect and noisy measurement conditions.", "arxiv_id": "2609.12304", "arxiv_url": "https://arxiv.org/abs/2609.12304", "authors": ["Shuhao Que", "Valentina Breschi", "Ying Wang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7269\u7406-\u4eba\u5de5\u667a\u80fd\u6df7\u5408\u6846\u67b6\uff0c\u7528\u8155\u6234 IMU \u4f30\u8ba1\u4eba\u4f53\u8d28\u5fc3\u52a0\u901f\u5ea6\uff0c\u5148\u6784\u5efa\u7b80\u5 e of modern power grids. Furthermore, increasing sophistication in attack techniques demands anomaly detection systems (ADS) that are accurate, interpretable, and reliable to support DER cybersecurity. While ML-based ADS provide strong detection capabilities, their black-box nature reduces operator trust and limits Security Operation Center\u0027s (SOC) ability to effectively interpret alerts and respond, highlighting the need for explainable Artificial Intelligence (XAI) to ensure transparency and operational confidence. This paper presents an XAI-based anomaly detection framework tailored for DER networks (ExCYDER). The proposed framework uses a self-verifying mechanism that validates ADS alerts to ensure trustworthy decision-making. ExCYDER combines LightGBM with SHAP to check whether each model decision aligns with its feature-attribution evidence, allowing the system to confirm that its internal reasoning is consistent and reliable. Experiments on a realistic DNP3 dataset achieved over 98% detection accuracy, an average rule--SHAP consistency of 44.6%, a SHAP latency of 14.5 ms per alert, and a confidence deviation within 5%, demonstrating stable verification behavior with minimal computational overhead. The framework distinguished between coherent and inconsistent alerts without compromising detection accuracy, demonstrating that integrated verification within XAI-based ADS enhances interpretability, auditability, and operational robustness for DER-focused SOCs.", "arxiv_id": "2609.12305", "arxiv_url": "https://arxiv.org/abs/2609.12305", "authors": ["Damilola Popoola", "Souradeep Bhattacharya", "Manimaran Govindarasu"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u5206\u5e03\u5f0f\u80fd\u6e90\u7f51\u7edc\u5b89\u5168\u7684\u53ef\u89e3\u91ca\u5f02\u5e38\u68c0\u6d4b\u6846\u67b6 ExCYDER\uff0c\u5c06 LightGBM \u4e0e SHAP \u7ed3\u5408\uff0c\u5e76\u7528\u81ea\u9a8c\u8bc1\u673a\u5236\u68c0\u67e5\u544a\u8b66\u51b3\u7b56\u662f\u5426\u4e0e\u7279\u5f81\u5f52\u56e0\u8bc1 let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
