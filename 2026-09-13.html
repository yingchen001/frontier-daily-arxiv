const PAPERS = [{"abstract": "Post-training attention sparsification reduces the quadratic cumulative attention cost of pretrained Transformers by selecting a small set of context units (tokens or blocks) for each query. Existing trainable methods usually use a lightweight selector to score context units, followed by hard Top-K selection that blocks gradients from the language modeling loss. Consequently, these methods commonly distill layer-wise dense attention distributions. Although this encourages the selector to rank context units by dense attention weights in the original model, the ranking is not directly aligned with their impact on predictions under a fixed attention budget (i.e., the number of attended context units per query), potentially wasting the limited budget on less useful units. To address this misalignment, we propose Simple Attention Sparsification (SAS), a gated sparse attention mechanism that optimizes context ranking end-to-end with the language modeling loss. The key idea is to inject the selector\u0027s continuous scores into attention logits during training, allowing the loss to update the selector through standard backpropagation. We identify several choices crucial for this simple design to work well in practice: placing the gate inside the attention softmax in log form, using normalized softmax gates to calibrate historical context against the always-retained current block, and preserving continuous selector scores so the model learns relative priorities rather than only hard selections. To support long-sequence training, we implement a memory-efficient Triton kernel that integrates SAS into FlashAttention-style computation. Across reasoning, long-context understanding, and agentic tasks, SAS consistently outperforms trainable sparse attention baselines across attention budgets, with especially large gains under tight budgets, demonstrating more effective context ranking for downstream tasks.", "arxiv_id": "2609.13141", "arxiv_url": "ht nderestimate worst-case vulnerability: across three LLaMA-3-8B backdoor settings, holding the model, clean data, and poison count fixed, attack success ranges from 3% to 80% depending only on which poison set is chosen. We formalize poison selection as oracle-budgeted set optimization and introduce SAILS (Set-level Audit-Informed Iterative Learned Selection), which learns a set scorer from a few hundred finetune-and-evaluate runs, ranks millions of candidate sets, and audits only a small shortlist. SAILS improves held-out attack success by 30 percentage points on average over the strongest influence baselines, transfers from small-scale to full-scale finetuning, and extends to code-generation, agentic, and API-only backdoors.", "arxiv_id": "2609.15029", "arxiv_url": "https://arxiv.org/abs/2609.15029", "authors": ["Aashiq Muhamed", "Mona T. Diab", "Virginia Smith", "Andrew Ilyas", "Matthew Jagielski"], "brief": "\u8bba\u6587\u5c06\u540e\u95e8\u6295\u6bd2\u4e2d\u7684\u6bd2\u6837\u672c\u9009\u62e9\u5f62\u5f0f\u5316\u4e3a\u5e26\u8bc4\u4f30\u9884\u7b97\u7684\u96c6\u5408\u4f18\u5316\u95ee\u9898\uff0c\u5e76\u63d0\u51fa SAILS \u65b9\u6cd5\u3002SAILS \u901a\u8fc7\u5c11\u91cf\u5fae\u8c03\u4e0e\u8bc4\u4f30\u8fd0\u884c\u5b66\u4e60\u96c6\u5408\u8bc4\u5206\u5668\uff0c\u4ece\u6d77\u91cf\u5019\u9009\u6bd2\u96c6\u91cc\u7b5b\u9009\u66f4\u9ad8\u98ce\u9669\u7684\u6295\u6bd2\u96c6\u5408\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.CR"], "github_repo": "https://github.com/aashiqmuhamed/poison-set-selection", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.15029", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u4e09\u4e2a LLaMA-3-8B \u540e\u95e8\u8bbe\u7f6e\u4e2d\uff0c\u6a21\u578b\u3001\u5e72\u51c0\u6570\u636e\u548c\u6295\u6bd2\u6570\u91cf\u4e0d\u53d8\uff0c\u4ec5\u66f4\u6362\u6bd2\u6837\u672c\u96c6\u5408\u5373\u53ef\u4f7f\u653b\u51fb\u6210\u529f\u7387\u4ece 3% \u6ce2\u52a8\u5230 80%\u3002", "SAILS \u7528\u6570\u767e\u6b21 finetune-and-evaluate \u8fd0\u884c\u8bad\u7ec3\u96c6\u5408\u7ea7\u8bc4\u5206\u5668\uff0c\u6392\u5e8f\u6570\u767e\u4e07\u5019\u9009\u96c6\u5408\uff0c\u5e76\u53ea\u5ba1\u8ba1\u5c11\u91cf\u5019\u9009\u3002", "\u76f8\u6bd4\u6700\u5f3a influence baseline\uff0cSAILS \u5728 held-out \u653b\u51fb\u6210\u529f\u7387\u4e0a\u5e73\u5747\u63d0\u5347 30 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u5927\u89c4\u6a21\u5fae\u8c03\u3001\u4ee3\u7801\u751f\u6210\u3001\u667a\u80fd\u4f53\u548c API-only \u540e\u95e8\u573a\u666f\u3002"], "keywords": ["\u540e\u95e8\u653b\u51fb", "\u6570\u636e\u6295\u6bd2", "\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "Anthropic", "pdf_url": "https://arxiv.org/pdf/2609.15029", "published_at": "2026-09-14", "score": 0.643, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Anthropic", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15029.png", "title": "Pick Your Poison: Learning to Select Poison Sets for Stronger LLM Backdoor Attacks", "tldr": "\u5b66\u4e60\u6311\u9009\u6bd2\u6837\u672c\u663e\u8457\u589e\u5f3aLLM\u540e\u95e8\u653b\u51fb", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5c06\u540e\u95e8\u6295\u6bd2\u4e2d\u7684\u6bd2\u6837\u672c\u9009\u62e9\u5f62\u5f0f\u5316\u4e3a\u5e26\u8bc4\u4f30\u9884\u7b97\u7684\u96c6\u5408\u4f18\u5316\u95ee\u9898\uff0c\u5e76\u63d0\u51fa SAILS \u65b9\u6cd5\u3002SAILS \u901a\u8fc7\u5c11\u91cf\u5fae\u8c03\u4e0e\u8bc4\u4f30\u8fd0\u884c\u5b66\u4e60\u96c6\u5408\u8bc4\u5206\u5668\uff0c\u4ece\u6d77\u91cf\u5019\u9009\u6bd2\u96c6\u91cc\u7b5b\u9009\u66f4\u9ad8\u98ce\u9669\u7684\u6295\u6bd2\u96c6\u5408\u3002", "why_notable": "\u8be5\u7814\u7a76\u8868\u660e\u968f\u673a\u91c7\u6837\u6bd2\u6837\u672c\u4f1a\u4e25\u91cd\u4f4e\u4f30 LLM \u5fae\u8c03\u540e\u95e8\u7684\u6700\u574f\u60c5\u51b5\u98ce\u9669\uff0c\u5e76\u63d0\u4f9b\u4e86\u4e00\u79cd\u66f4\u7cfb\u7edf\u7684\u7ea2\u961f\u8bc4\u4f30\u65b9\u6cd5\uff0c\u5bf9\u6a21\u578b\u5b89\u5168\u5ba1\u8ba1\u3001\u6570\u636e\u6cbb\u7406\u548c\u5fae\u8c03\u9632\u62a4\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recursive self-improvement is becoming increasingly vital for autonomous AI agents, where progress hinges on discovering high-value solutions across complex domains. The driver of this process is effective exploration, however, managing and improving exploration strategies remains a major bottleneck. Current systems face a fundamental dilemma: fixed strategies fail to adapt as search spaces scale, while online policy optimization requires navigating vast meta-search spaces under delayed and expensive feedback over long-horizon rollouts. We introduce \\textsc{Dream-RSI}, a framework for scalable and recursively self-improving exploration. A lightweight orchestration layer makes exploration explicit and programmable while leaving the underlying coding agent unchanged. Our key insight is that accumulated discovery history can serve as a replay simulator over the realized search space. By performing dreaming in the replay simulator constructed from historical discovery trees, \\textsc{Dream-RSI} secures immediate, low-cost off-policy feedback to evaluate and refine exploration policies without invoking repetitive, expensive online evaluations. The improved policy is subsequently redeployed online to drive further discovery, continuously expanding the simulator pool in a self-improving loop. Across algorithm engineering, mathematical optimization, and GPU kernel engineering, \\textsc{Dream-RSI} achieves competitive or improved discovery quality while substantially reducing discovery cost in several settings.", "arxiv_id": "2609.14858", "arxiv_url": "https://arxiv.org/abs/2609.14858", "authors": ["Tong Zheng", "Xidong Wu", "Zheng Zhang", "Zhankui He", "Chaoyi Zhang", "Benjamin Coleman", "Ruoqiao Wei", "Di Bai", "Haolin Liu", "Rui Liu", "Xue Wang", "Yue Zhuan", "Wang-Cheng Kang", "Renkai Xiang", "Heng Huang", "Xinwu Cheng", "Yunsong Guo"], "brief": "Dream-RSI \u662f\u4e00\u4e2a\u9762\u5411\u81ea\u4e3b AI \u667a\u80fd\u4f53\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u6846\u67b6\uff0c\u5c06\u63a2\u7d22\u8fc7\u7a0b\u663e\u5f0f\u5316\u3001\u53ef\u7f16\u7a0b\u5316\uff0c\u540c\u65f6\u4e0d\u6539\u53d8\u5e95\u5c42\u7f16\u7801\u667a\u80fd\u4f53\u3002\u5b83\u5229\u7528\u5386\u53f2\u53d1\u73b0\u8f68\u8ff9\u6784\u5efa\u56de\u653e\u6a21\u62df\u5668\uff0c\u5728\u79bb\u7ebf\u201c\u505a\u68a6\u201d\u4e2d\u8bc4\u4f30\u548c\u6539\u8fdb\u63a2\u7d22\u7b56\u7565\uff0c\u518d\u90e8\u7f72\u5230\u5728\u7ebf\u641c\u7d22\u5f62\u6210\u81ea\u589e\u5f3a\u5faa\u73af\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/zhengkid/Dream-RSI", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.14858", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7d2f\u79ef\u7684 discovery trees \u4f5c\u4e3a\u5df2\u5b9e\u73b0\u641c\u7d22\u7a7a\u95f4\u7684 replay simulator\uff0c\u63d0\u4f9b\u5373\u65f6\u3001\u4f4e\u6210\u672c\u7684\u79bb\u7b56\u7565\u53cd\u9988\u3002", "\u907f\u514d\u5728\u957f\u5468\u671f\u5728\u7ebf rollout \u4e2d\u53cd\u590d\u8fdb\u884c\u6602\u8d35\u8bc4\u4f30\uff0c\u7f13\u89e3\u63a2\u7d22\u7b56\u7565\u5143\u4f18\u5316\u6210\u672c\u9ad8\u3001\u53cd\u9988\u5ef6\u8fdf\u5927\u7684\u95ee\u9898\u3002", "\u5728\u7b97\u6cd5\u5de5\u7a0b\u3001\u6570\u5b66\u4f18\u5316\u548c GPU kernel \u5de5\u7a0b\u4efb\u52a1\u4e0a\uff0c\u5728\u591a\u79cd\u8bbe\u7f6e\u4e2d\u4ee5\u66f4\u4f4e\u53d1\u73b0\u6210\u672c\u8fbe\u5230\u7ade\u4e89\u6027\u6216\u66f4\u4f18\u7ed3\u679c\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u79bb\u7b56\u7565\u5b66\u4e60", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2609.14858", "published_at": "2026-09-14", "score": 0.595, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (127\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14858.png", "title": "Dream-RSI: Recursive Self-Improvement through Evolving Worlds", "tldr": "\u7528\u5386\u53f2\u53d1\u73b0\u6811\u4f4e\u6210\u672c\u4f18\u5316\u667a\u80fd\u4f53\u63a2\u7d22\u7b56\u7565", "upvotes": 127, "what_it_is": "Dream-RSI \u662f\u4e00\u4e2a\u9762\u5411\u81ea\u4e3b AI \u667a\u80fd\u4f53\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u6846\u67b6\uff0c\u5c06\u63a2\u7d22\u8fc7\u7a0b\u663e\u5f0f\u5316\u3001\u53ef\u7f16\u7a0b\u5316\uff0c\u540c\u65f6\u4e0d\u6539\u53d8\u5e95\u5c42\u7f16\u7801\u667a\u80fd\u4f53\u3002\u5b83\u5229\u7528\u5386\u53f2\u53d1\u73b0\u8f68\u8ff9\u6784\u5efa\u56de\u653e\u6a21\u62df\u5668\uff0c\u5728\u79bb\u7ebf\u201c\u505a\u68a6\u201d\u4e2d\u8bc4\u4f30\u548c\u6539\u8fdb\u63a2\u7d22\u7b56\u7565\uff0c\u518d\u90e8\u7f72\u5230\u5728\u7ebf\u641c\u7d22\u5f62\u6210\u81ea\u589e\u5f3a\u5faa\u73af\u3002", "why_notable": "\u8bba\u6587\u628a\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u7684\u6838\u5fc3\u74f6\u9888\u4ece\u201c\u8ba9\u6a21\u578b\u76f4\u63a5\u5728\u7ebf\u8bd5\u9519\u201d\u8f6c\u5411\u201c\u5229\u7528\u5386\u53f2\u53d1\u73b0\u8fdb\u884c\u79bb\u7ebf\u7b56\u7565\u6539\u8fdb\u201d\uff0c\u4e3a coding agent \u548c\u81ea\u52a8\u5316\u79d1\u7814/\u5de5\u7a0b\u4f18\u5316\u63d0\u4f9b\u4e86\u66f4\u53ef\u6269\u5c55\u3001\u6210\u672c\u66f4\u4f4e\u7684\u63a2\u7d22\u673a\u5236\u3002"}, {"abstract": "In this work, we present ZGCM-1, a fully open 7B dense foundation model trained from scratch with extreme data, system, and algorithmic efficiency. ZGCM-1 is founded on a core premise: compact models cannot passively memorize the open web, but can overcome parametric capacity limits by coupling deliberate internal thinking with active external tool use. To support this paradigm across a 256K context, we develop an end-to-end, high-efficiency open training recipe: Architecture \u0026 System Co-design: interleaved gated sliding-window and full attention, and a stable FP8 Muon optimizer; Progressive Curriculum \u0026 MDP Mid-Training: context scaling across 16K, 64K, and 256K, and the reformulation of interaction traces into Markov Decision Processes. Furthermore, we establish an AI-native R\u0026D workflow where agent swarms autonomously manage cluster operations, data curation, and rapid diagnostic evaluation. Extensive evaluations show that ZGCM-1-7B is competitive across 7B model family on general benchmarks. On several challenging mathematical reasoning and agentic search suites, it remains competitive with frontier models orders of magnitude larger, such as Qwen3-235B-A22B and GLM-5.1. We also show that our pre-training design offers a ~4.2x efficiency improvement in 16K pre-training time-to-loss. Across the full development lifecycle, we distill eight actionable empirical findings-spanning architectural scaling, SFT quality pruning, long-context generalization, and agentic co-training dynamics. To facilitate community research, we open-source model weights from the pre-training, mid-training, and post-training stages, intermediate checkpoints, training code, per-stage data and data recipes, and W\u0026B logs.", "arxiv_id": "2609.13356", "arxiv_url": "https://arxiv.org/abs/2609.13356", "authors": ["Jiyan He", "Guang Liang", "Hao Liu", "Haoxiang Guan", "Jinbo Sun", "Junyi Guo", "Wenjun Feng", "Yantai Xie", "Yifei Shen", "Bin Shao", "Chuyang Wei", "Kai Chen", "Kexin Zhou", "Minghang Zhu", "Shuxin Zheng", "Tie-Yan Liu", "Taine Zhao", "Wenhui Zhu", "Xueyin Xu", "Xiaoqing Zhang", "Yatao Li", "Yuxuan Ren"], "brief": "\u63d0\u51fa\u5e76\u5f00\u6e90 ZGCM-1\uff0c\u4e00\u4e2a\u4ece\u96f6\u8bad\u7ec3\u7684 7B \u7a20\u5bc6\u57fa\u7840\u6a21\u578b\uff0c\u5f3a\u8c03\u901a\u8fc7\u5185\u90e8\u63a8\u7406\u4e0e\u5916\u90e8\u5de5\u5177\u4f7f\u7528\u5f25\u8865\u5c0f\u6a21\u578b\u53c2\u6570\u5bb9\u91cf\u9650\u5236\u3002\u8bba\u6587\u540c\u65f6\u7ed9\u51fa\u8986\u76d rks places it at the low-cost knee of the observed cost--performance Pareto frontier. Supporting evaluations in tool calling, coding, and instruction following further show that this specialization preserves broad agentic capability. We release the model weights and a subset of the training data to support research on practical co-work agents and agentic post-training.", "arxiv_id": "2609.11977", "arxiv_url": "https://arxiv.org/abs/2609.11977", "authors": ["Wenhui Chen", "Shiwen Cheng", "Hao Dong", "Chenda Duan", "Ruixiang Feng", "Zhong Guan", "Boqiang Guo", "Xueyuan Han", "Haojie Hao", "Liangmeng Huang", "Zhelong Huang", "Xinke Kong", "Hongyu Li", "Jiazheng Li", "Junbo Li", "Qingchuan Li", "Yukun Lian", "Chang Liu", "Tianyu Liu", "Zicheng Liu", "Shuyi Ouyang", "Yijun Pan", "Kunyu Shi", "Xiaojun Tang", "Bingquan Wang", "Kesu Wang", "Yuchen Wang", "Sibo Wei", "Sicong Xie", "Xiaoying Xing", "Yi Xu", "Zhijun Xu", "Hongwei Xue", "Qingcheng Zeng", "Di Zhang", "Guannan Zhang", "Haochen Zhang", "Tianlong Zhang", "Tianyu Zhao", "Tianyu Zhao", "Yanjun Zheng", "Jialong Zhu", "Zijian Zou"], "brief": "\u8bba\u6587\u63d0\u51fa Occamy-1.0\uff0c\u4e00\u4e2a\u57fa\u4e8e Qwen3.6-35B-A3B \u7ee7\u7eed\u8bad\u7ec3\u7684\u534f\u4f5c\u578b\u667a\u80fd\u4f53\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u6267\u884c\u843d\u5730\u6570\u636e\u3001\u53ef\u56de\u653e\u957f\u7a0b\u8f68\u8ff9\u548c\u5206\u9636\u6bb5\u540e\u8bad\u7ec3\uff0c\u63d0\u5347\u591a\u6b65\u5de5\u4f5c\u6d41\u4e2d\u7684\u5de5\u5177\u4f7f\u7528\u3001\u4ee3\u7801\u3001\u6587\u4ef6\u64cd\u4f5c\u4e0e\u4efb\u52a1\u8ddf\u8fdb\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Accio-Lab/occamy", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2609.11977", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa execution-grounded \u6570\u636e\u4e0e\u591a\u73af\u5883\u957f\u7a0b\u8f68\u8ff9\uff0c\u8986\u76d6\u4fe1\u606f\u641c\u96c6\u3001\u5de5\u5177\u8c03\u7528\u3001\u7f16\u u66f4\u5927\u524d\u6cbf\u7cfb\u7edf\uff0c\u5e76\u5f00\u653e\u6743\u91cd\u548c\u90e8\u5206\u8bad\u7ec3\u6570\u636e\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u5b9e\u7528\u578b\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\u7814\u7a76\u3002"}, {"abstract": "Robot foundation models achieve strong in-distribution performance but often degrade under visual distribution shifts. When learning to generate actions from pretrained visual representations, models may exploit task-irrelevant visual cues that correlate with demonstrated actions within the training distribution. Such vision-action shortcuts can undermine generalization when these correlations change under distribution shifts. Mitigating these shortcuts requires constraining how visual information is used for action generation while preserving task-relevant spatial information. We propose Latent Interface Training (LIT), a framework-agnostic two-stage strategy that first establishes a spatial-goal-conditioned action prior without images, then constrains visual conditioning through a pose-supervised latent interface. Stage 1 trains the action expert to generate action chunks conditioned on language, robot state, and each demonstrated chunk\u0027s terminal SE(3) end-effector pose, learning goal-directed action generation independently of visual cues. Stage 2 introduces a latent interface that aggregates visual and semantic representations and serves as the pretrained action expert\u0027s only visual conditioning pathway. The interface is supervised to reconstruct the terminal pose previously used to condition Stage 1, encouraging it to retain the goal-relevant spatial information needed for action generation. Across four vision-language-action and world-action architectures (Pi0.5, MolmoAct2, FAST-WAM, and ImageWAM), LIT improves overall LIBERO-Plus success by 3.87-10.70 percentage points while preserving or improving average LIBERO success. Real-world evaluations show 13.30-16.70 percentage-point gains in success aggregated across three tasks under unseen camera configurations, lighting variations, and distractors.", "arxiv_id": "2609.12641", "arxiv_url": "https://arxiv.org/abs/2609.12641", "authors": ["Jianman Lin", "Shailesh Shailesh", "Zhongyi Luo", "Jiafei Duan"], "brief": "\u8bba\u6587\u63d0\u51fa Latent Interface Training\uff08LIT\uff09\uff0c\u4e00\u79cd\u9002\u914d\u591a\u79cd\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b\u7684\u4e24\u9636\u6bb5\u8bad\u7ec3\u7b56\u7565\u3002\u5b83\u5148\u5728\u65e0\u56fe\u50cf\u6761\u4ef6\u4e0b\u5b66\u4e60\u7531\u8bed\u8a00\u3001\u673a\u5668\u4eba\u72b6\u6001\u548c\u672b\u7aef SE(3) \u4f4d\u59ff\u9a71\u52a8\u7684\u52a8\u4f5c\u5148\u9a8c\uff0c\u518d\u7528\u53d7\u4f4d\u59ff\u76d1\u7763\u7684\u6f5c\u5728\u63a5\u53e3\u9650\u5236\u89c6\u89c9\u4fe1\u606f\u8fdb\u5165\u52a8\u4f5c\u751f\u6210\u8fc7\u7a0b\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/MAGICLAB-NUS/LIT", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2609.12641", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u89c6\u89c9\u5206\u5e03\u504f\u79fb\u4e0b\u7684 vision-action shortcut\uff1a\u6a21\u578b\u53ef\u80fd\u4f9d\u8d56\u4e0e\u52a8\u4f5c\u5076\u7136\u76f8\u5173\u7684\u65e0\u5173\u89c6\u89c9\u7ebf\u7d22\uff0c\u5bfc\u81f4\u6cdb\u5316\u5931\u8d25\u3002", "\u7b2c\u4e00\u9636\u6bb5\u8bad\u7ec3\u7a7a\u95f4\u76ee\u6807\u6761\u4ef6\u52a8\u4f5c\u4e13\u5bb6\uff0c\u57fa\u4e8e\u8bed\u8a00\u3001\u72b6\u6001\u548c\u52a8\u4f5c\u7247\u6bb5\u7ec8\u6b62\u672b\u7aef\u4f4d\u59ff\u751f\u6210 action chunks\uff0c\u51cf\u5c11\u5bf9\u89c6\u89c9\u6377\u5f84\u7684\u4f9d\u8d56\u3002", "\u7b2c\u4e8c\u9636\u6bb5\u8ba9\u89c6\u89c9/\u8bed\u4e49\u7279\u5f81\u53ea\u80fd\u901a\u8fc7\u6f5c\u5728\u63a5\u53e3\u5f71\u54cd\u52a8\u4f5c\u4e13\u5bb6\uff0c\u5e76\u76d1\u7763\u8be5\u63a5\u53e3\u91cd\u5efa\u7ec8\u6b62\u4f4d\u59ff\uff0c\u4ee5\u4fdd\u7559\u4efb\u52a1\u76f8\u5173\u7a7a\u95f4\u4fe1\u606f\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4 . We introduce Atria Dawn Preview, a foundation agentic language model designed for scientific research and engineering workflows, with the goal of expanding the frontier of agent productivity in the real world. This model is trained via a Verifiable Experience Pipeline that connects tool-mediated interactions to executable environments and externally verified outcomes. Across 16 benchmarks spanning real-world research, engineering, and digital work, Atria Dawn Preview is competitive with frontier agents and achieves the highest reported score on five of them. Beyond standalone performance, we examine the real research-and-development process behind this model as a case study of human--AI collaboration, analyzing 769 task records from 56 participants together with agent logs. When asked to evaluate completed tasks under comparable conditions, participants rated about one-third of completed AI-assisted tasks as infeasible without AI. More strikingly, agents frequently propose methods and implement revisions, while humans retain most final decisions and guide exploration through judgment and feedback. These observations indicate a shift from task-level execution to project-level partnership, with human effort concentrating on what is worth pursuing and how evidence should guide research. Progress toward more autonomous AI research must therefore advance both the capacity for discovery and the capacity for meaningful human oversight, preserving accountable human authority over the risks and direction of continued development.", "arxiv_id": "2609.15818", "arxiv_url": "https://arxiv.org/abs/2609.15818", "authors": ["Honglin Guo", "Tao Gui", "Yicheng Chen", "Guanting Dong", "Qiming Ge", "Yuyang Hu", "Zixian Huang", "Jiajie Jin", "Alexander Lam", "Yining Li", "Jiahang Lin", "Yanjiang Liu", "Xinyu Lu", "Haijun Lv", "Junlin Shang", "Qisheng Su", "Guoqiang Wang", "Rui Wang", "Zhecan Wang", "Hao Xiang", "Xinchen Xie", "Shuhao Xing", "Xiaoyu Xing", "Wanghan Xu", "Xinyu Yang", "
