": 104, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd Atria Dawn Preview\uff0c\u4e00\u79cd\u9762\u5411\u79d1\u5b66\u7814\u7a76\u4e0e\u5de5\u7a0b\u5de5\u4f5c\u6d41\u7684\u57fa\u7840\u667a\u80fd\u4f53\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u53ef\u9a8c\u8bc1\u7ecf\u9a8c\u7ba1\u7ebf\u8bad\u7ec3\uff0c\u5c06\u5de5\u5177\u4ea4\u4e92\u3001\u53ef\u6267\u884c\u73af\u5883\u4e0e\u5916\u90e8\u9a8c\u8bc1\u7ed3\u679c\u8fde\u63a5\u8d77\u6765\uff0c\u5e76\u5206\u6790\u5176\u771f\u5b9e\u7814\u53d1\u8fc7\u7a0b\u4e2d\u7684\u4eba\u673a\u534f\u4f5c\u6a21\u5f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u62a5\u544a\u4e86\u4e00\u4e2a\u5f3a\u667a\u80fd\u4f53\u6a21\u578b\u7684\u57fa\u51c6\u8868\u73b0\uff0c\u8fd8\u7528\u771f\u5b9e\u7814\u53d1\u65e5\u5fd7\u523b\u753b\u4e86AI\u53c2\u4e0e\u81ea\u8eab\u540e\u7ee7\u7cfb\u7edf\u5f00\u53d1\u7684\u534f\u4f5c\u8303\u5f0f\u53d8\u5316\uff0c\u5f3a\u8c03\u672a\u6765\u81ea\u4e3bAI\u7814\u7a76\u9700\u8981\u540c\u65f6\u63d0\u5347\u53d1\u73b0\u80fd\u529b\u4e0e\u4eba\u7c7b\u76d1\u7763\u80fd\u529b\u3002"}, {"abstract": "Data policies for reinforcement learning with verifiable rewards (RLVR) determine which rollouts are used, how strongly they are weighted, and which domains contribute to subsequent training batches. We introduce DataFlex-RL, an evaluation platform for comparing these choices under a common GRPO recipe. Our primary experiment evaluates 13 configurations across 12 matched seeds using Qwen2.5-7B-Base and 12 mathematics, logic, and science benchmarks. Uniform GRPO improves the domain-balanced average accuracy by 7.76 percentage points over the untrained checkpoint. None of the eight rollout-selection or reweighting methods achieves a paired 95% confidence interval that excludes zero relative to uniform sampling, and none of the three adaptive mixtures outperforms a fixed equal mixture at the same level of precision. A corrected 12-seed extension on Llama-3.1-8B-Base places the additional methods on the same score scale as the original controls, but does not reveal a consistent winner in terms of observed mean performance. We also quantify evaluation sensitivity by rescoring nine Qwen2.5-7B-Instruct runs using a math-heavy six-benchmark summary, consisting of five mathematics benchmarks and GPQA-Diamond but no logic benchmark, and comparing it with the domain-balanced 12-benchmark summary. The resulting rankings are negatively correlated, with a correlation coefficient of -0.33, whereas summaries that retain all 12 benchmarks largely agree. Across the controlled settings studied here, changing the data policy measurably changes the training process but does not produce a reproducible improvement over uniform training.", "arxiv_id": "2609.06107", "arxiv_url": "https://arxiv.org/abs/2609.06107", "authors": ["Hao Liang", "Mingrui Chen", "Hengyi Feng", "Meiyi Qiang", "Wentao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa DataFlex-RL\uff0c\u4e00\u4e2a\u5728\u7edf\u4e00 GRPO \u8bad\u7ec3\u914d\u65b9\u4e0b\u6bd4\u8f83 RLVR \u6570\u636e\u7b56\u7565\u7684\u8bc4\u6d4b\u5e73\u53f0\u3002\u4f5c\u8005\u7cfb\u7edf\u8bc4\u4f30 rollout \u9009\u62e9\u3001\u91cd\u52a0\u6743\u4e0e\u81ea\u9002\u5e94\u6570\u636e\u6df7\u5408\u7b49\u7b56\u7565\uff0c\u53d1\u73b0\u5b83\u4eec\u867d\u4f1a\u6539\u53d8\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u4f46\u672a\u80fd\u7a33\u5b9a\u8d85\u8d8a\u5747\u5300\u91c7\u6837\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06107", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5728 Qwen2.5-7B-Base \u4e0a\u8bc4\u4f30 13 \u79cd\u914d\u7f6e\u300112 \u4e2a\u5339\u914d\u968f\u673a\u79cd\u5b50\uff0c\u8986\u76d6\u6570\u5b66\u3001\u903b\u8f91\u3001\u79d1\u5b66\u5171 12 \u4e2a\u57fa\u51c6\u3002", "Uniform GRPO \u76f8\u6bd4\u672a\u8bad\u7ec3 checkpoint \u7684\u9886\u57df\u5747\u8861\u5e73\u5747\u51c6\u786e\u7387\u63d0\u5347 7.76 \u4e2a\u767e\u5206\u70b9\uff0c\u4f46 8 \u79cd rollout \u9009\u62e9/\u91cd\u52a0\u6743\u65b9\u6cd5\u5747\u672a\u5728 95% \u914d\u5bf9\u7f6e\u4fe1\u533a\u95f4\u4e0a\u663e\u8457\u4f18\u4e8e\u5747\u5300\u91c7\u6837\u3002", "\u8bc4\u6d4b\u6307\u6807\u9009\u62e9\u4f1a\u663e\u8457\u5f71\u54cd\u7ed3\u8bba\uff1a\u6570\u5b66\u504f\u91cd\u7684 6 \u57fa\u51c6\u6392\u540d\u4e0e\u9886\u57df\u5747\u8861 12 \u57fa\u51c6\u6392\u540d\u5448\u8d1f\u76f8\u5173\uff0c\u76f8\u5173\u7cfb\u6570\u4e3a -0.33\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u6570\u636e\u7b56\u7565", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2609.06107", "published_at": "2026-09-05", "score": 0.516, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (106\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06107.png", "title": "DataFlex-RL: An Evaluation Platform for RLVR Data Policies", "tldr": "\u8bc4\u6d4bRLVR\u6570\u636e\u7b56\u7565\uff0c\u5747\u5300\u91c7\u6837\u6700\u7a33\u5065\u3002", "upvotes": 106, "what_it_is": "\u8bba\u6587\u63d0\u51fa DataFlex-RL\uff0c\u4e00\u4e2a\u5728\u7edf\u4e00 GRPO \u8bad\u7ec3\u914d\u65b9\u4e0b\u6bd4\u8f83 RLVR \u6570\u636e\u7b56\u7565\u7684\u8bc4\u6d4b\u5e73\u53f0\u3002\u4f5c\u8005\u7cfb\u7edf\u8bc4\u4f30 rollout \u9009\u62e9\u3001\u91cd\u52a0\u6743\u4e0e\u81ea\u9002\u5e94\u6570\u636e\u6df7\u5408\u7b49\u7b56\u7565\uff0c\u53d1\u73b0\u5b83\u4eec\u867d\u4f1a\u6539\u53d8\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u4f46\u672a\u80fd\u7a33\u5b9a\u8d85\u8d8a\u5747\u5300\u91c7\u6837\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a RLVR \u6570\u636e\u7b56\u7565\u63d0\u4f9b\u4e86\u66f4\u53d7\u63a7\u3001\u53ef\u590d\u73b0\u5b9e\u9a8c\u6846\u67b6\uff0c\u5e76\u63d0\u9192\u7814\u7a76\u8005\uff1a\u590d\u6742\u6570\u636e\u8c03\u5ea6\u65b9\u6cd5\u672a\u5fc5\u5e26\u6765\u7a33\u5b9a\u6536\u76ca\uff0c\u4e14\u8bc4\u6d4b\u57fa\u51c6\u6784\u6210\u53ef\u80fd\u663e\u8457\u6539\u53d8\u65b9\u6cd5\u6392\u540d\u3002"}, {"abstract": "Training capable cyber agents is often treated primarily as a problem of model scale, yet open-weight post-training is constrained more directly by the cost of executable environments, reliable multi-turn supervision, and access to strong teachers. We present a data-centric framework that addresses these bottlenecks through five complementary systems: Choulea analyzes hidden reasoning signatures, SkyReal reduces teacher-sampling cost, Hongzwang bypasses API restrictions on teacher execution, PSBreakup restores capabilities weakened by model merging, and Kreator converts expert interventions into trainable reasoning. Our data engine constructs resettable coding, vulnerability, CTF, kernel-history, full-exploit, firmware, and device-backed environments. Candidate trajectories are retained only after execution verification and evidence auditing, yielding 164,269 trajectories for long-context supervised fine-tuning. The three checkpoints improve over their starting models by an average of 23.76% on the full CyberGym suite and 10.49% across the pooled CTF suites. As of September 1, 2026, Feyospace-s1 achieves a verified success rate of 63.24% and ranks 10th on the official CyberGym leaderboard, while all three checkpoints rank 1st among models at comparable parameter scales. To our knowledge, this is the first end-to-end demonstration that a seven-person independent team can train open-weight models with leading agentic cyber capability.", "arxiv_id": "2609.08418", "arxiv_url": "https://arxiv.org/abs/2609.08418", "authors": ["Zongjie Li", "Alan Z. W", "John Nicolas J", "Walter H. F", "Scott Donald L", "Gordon Y. P", "Deke X"], "brief": "\u8bba\u6587\u63d0\u51fa Feyospace-v1\uff0c\u4e00\u4e2a\u9762\u5411\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53\u7684\u5f00\u6e90\u6a21\u578b\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u91cd\u70b9\u89e3\u51b3\u53ef\u6267\u884c\u73af\u5883\u3001\u591a\u8f6e\u76d1\u7763\u548c\u5f3a\u6559\u5e08\u83b7\u53d6\u6210\u672c\u7b49\u74f6\u9888\u3002\u56e2\u961f\u6784\u5efa\u591a\u7c7b\u53ef\u91cd\u7f6e\u7f51\u7edc\u5b89\u5168\u73af\u5883\uff0c\u5e76\u901a\u8fc7\u6267\u884c\u9a8c\u8bc1\u4e0e\u8bc1\u636e\u5ba1\u8ba1\u7b5b\u9009\u51fa 164,269 \u6761\u957f\u4e0a\u4e0b\u6587\u76d1\u7763\u5fae\u8c03\u8f68\u8ff9\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08418", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u4e94\u4e2a\u4e92\u8865\u7cfb\u7edf\uff1aChoulea \u5206\u6790\u9690\u85cf\u63a8\u7406\u7279\u5f81\uff0cSkyReal \u964d\u4f4e\u6559\u5e08\u91c7\u6837\u6210\u672c\uff0cHongzwang \u7ed5\u8fc7\u6559\u5e08\u6267\u884c API \u9650\u5236\uff0cPSBreakup \u4fee\u590d\u6a21\u578b\u5408\u5e76\u540e\u7684\u80fd\u529b\u9000\u5316\uff0cKreator \u5c06\u4e13\u5bb6\u5e72\u9884\u8f6c\u5316\u4e3a\u53ef\u8bad\u7ec3\u63a8\u7406\u6570\u636e", "\u6784\u5efa\u8986\u76d6\u7f16\u7801\u3001\u6f0f\u6d1e\u3001CTF\u3001\u5185\u6838\u5386\u53f2\u3001\u5b8c\u6574\u5229\u7528\u94fe\u3001\u56fa\u4ef6\u548c\u771f\u5b9e\u8bbe\u5907\u652f\u6301\u7684\u53ef\u91cd\u7f6e\u6267\u884c\u73af\u5883", "\u4e09\u4e2a\u68c0\u67e5\u70b9\u5728 CyberGym \u5168\u5957\u57fa\u51c6\u4e0a\u76f8\u5bf9\u8d77\u59cb\u6a21\u578b\u5e73\u5747\u63d0\u5347 23.76%\uff0c\u5728\u5408\u5e76 CTF \u5957\u4ef6\u4e0a\u63d0\u5347 10.49%\uff1bFeyospace-s1 \u5728\u5b98\u65b9 CyberGym \u6392\u884c\u699c\u8fbe\u5230 63.24% \u9a8c\u8bc1\u6210\u529f\u7387"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u76d1\u7763\u5fae\u8c03", "\u6570\u636e\u5de5\u7a0b"], "num_comments": 3, "on_hf": true, "organization": "feyospace", "pdf_url": "https://arxiv.org/pdf/2609.08418", "published_at": "2026-09-08", "score": 0.472, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (75\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08418.png", "title": "Feyospace-v1: How the Cyber Mercury Seven Trained Frontier Cyber Models", "tldr": "\u6570\u636e\u4e2d\u5fc3\u65b9\u6cd5\u8bad\u7ec3\u5f00\u6e90\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53", "upvotes": 75, "what_it_is": "\u8bba\u6587\u63d0\u51fa Feyospace-v1\uff0c\u4e00\u4e2a\u9762\u5411\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53\u7684\u5f00\u6e90\u6a21\u578b\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u91cd\u70b9\u89e3\u51b3\u53ef\u6267\u884c\u73af\u5883\u3001\u591a\u8f6e\u76d1\u7763\u548c\u5f3a\u6559\u5e08\u83b7\u53d6\u6210\u672c\u7b49\u74f6\u9888\u3002\u56e2\u961f\u6784\u5efa\u591a\u7c7b\u53ef\u91cd\u7f6e\u7f51\u7edc\u5b89\u5168\u73af\u5883\uff0c\u5e76\u901a\u8fc7\u6267\u884c\u9a8c\u8bc1\u4e0e\u8bc1\u636e\u5ba1\u8ba1\u7b5b\u9009\u51fa 164,269 \u6761\u957f\u4e0a\u4e0b\u6587\u76d1\u7763\u5fae\u8c03\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53\u80fd\u529b\u63d0\u5347\u4e0d\u53ea\u662f\u6a21\u578b\u89c4\u6a21\u95ee\u9898\uff0c\u800c\u662f\u9ad8\u8d28\u91cf\u53ef\u6267\u884c\u73af\u5883\u4e0e\u53ef\u9a8c\u8bc1\u8f68\u8ff9\u6570\u636e\u7684\u95ee\u9898\uff1b\u5c55\u793a\u4e86\u5c0f\u578b\u72ec\u7acb\u56e2\u961f\u4e5f\u80fd\u901a\u8fc7\u7cfb\u7edf\u5316\u6570\u636e\u5f15\u64ce\u8bad\u7ec3\u51fa\u5177\u5907\u9886\u5148\u80fd\u529b\u7684\u5f00\u6e90\u7f51\u7edc\u5b89\u5168\u667a\u80fd\u4f53\u3002"}, {"abstract": "Large language model (LLM) agents can benefit from reusable skills distilled from prior task experience, yet existing skill optimization methods often rely on costly execution-based evaluation and substantial task data. We introduce \\textbf{COBRA-Skills}, an efficient framework that formulates skill optimization as budgeted sequential optimization over a dynamically evolving candidate space. COBRA-Skills couples contextual-bandit-guided prioritization with evidence-grounded skill evolution, selectively allocating evaluations to promising or informative candidates while continually refining the skill population from execution feedback. Across six heterogeneous agent benchmarks and three target models, COBRA-Skills consistently achieves the strongest average performance among compared methods, while reducing optimization cost by 55--58\\% relative to SkillOpt and using only 50 unique optimization examples per benchmark. Further analyses show that COBRA-Skills remains robust to changes in the agent harness and performs effectively when the target model itself is used for skill generation and refinement.", "arxiv_id": "2609.11682", "arxiv_url": "https://arxiv.org/abs/2609.11682", "authors": ["Pingchen Lu", "Xiangyi Wang", "Xiang Li", "Jie Mao", "Zikun Qu", "Junfeng Luo", "Yao Shu", "Bryan Kian Hsiang Low", "Zhongxiang Dai"], "brief": "\u672c\u6587\u63d0\u51fa COBRA-Skills\uff0c\u5c06 LLM \u667a\u80fd\u4f53\u7684\u53ef\u590d\u7528\u6280\u80fd\u4f18\u5316\u5efa\u6a21\u4e3a\u9884\u7b97\u53d7\u9650\u7684\u5e8f\u8d2f\u4f18\u5316\u95ee\u9898\u3002\u5b83\u7ed3\u5408\u4e0a\u4e0b\u6587\u8d4c\u535a\u673a\u5019\u9009\u4f18\u5148\u7ea7\u5206\u914d\u4e0e\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u7684\u6280\u80fd\u6f14\u5316\uff0c\u5728\u6709\u9650\u6837\u672c\u548c\u8bc4\u4f30\u9884\u7b97\u4e0b\u6301\u7eed\u6539\u8fdb\u6280\u80fd\u5e93\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/Jerry-LuP/COBRA-Skills", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2609.11682", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 contextual bandit \u9009\u62e9\u6700\u6709\u6f5c\u529b\u6216\u4fe1\u606f\u91cf\u6700\u5927\u7684\u6280\u80fd\u5019\u9009\uff0c\u51cf\u5c11\u6602\u8d35\u7684\u6267\u884c\u8bc4\u4f30\u5f00\u9500", "\u91c7\u7528 evidence-grounded skill evolution\uff0c\u6839\u636e\u6267\u884c\u53cd\u9988\u52a8\u6001\u751f\u6210\u3001\u4fee\u6539\u548c\u7b5b\u9009\u6280\u80fd", "\u5728 6 \u4e2a\u5f02\u6784\u667a\u80fd\u4f53\u57fa\u51c6\u548c 3 \u4e2a\u76ee\u6807\u6a21\u578b\u4e0a\u53d6\u5f97\u6700\u4f73\u5e73\u5747\u6027\u80fd\uff0c\u76f8\u6bd4 SkillOpt \u964d\u4f4e 55\u201358% \u4f18\u5316\u6210\u672c\uff0c\u4e14\u6bcf\u4e2a\u57fa\u51c6\u4ec5\u7528 50 \u4e2a\u4f18\u5316\u6837\u4f8b"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u8d4c\u535a\u673a", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Chinese University of Hong Kong, Shenzhen", "pdf_url": "https://arxiv.org/pdf/2609.11682", "published_at": "2026-09-10", "score": 0.467, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.11682.png", "title": "COBRA-Skills: Contextual Bandit-Guided Evolution for Agent Skill Optimization", "tldr": "\u7528\u4e0a\u4e0b\u6587\u8d4c\u535a\u673a\u4f4e\u6210\u672c\u4f18\u5316\u667a\u80fd\u4f53\u6280\u80fd\u3002", "upvotes": 32, "what_it_is": "\u672c\u6587\u63d0\u51fa COBRA-Skills\uff0c\u5c06 LLM \u667a\u80fd\u4f53\u7684\u53ef\u590d\u7528\u6280\u80fd\u4f18\u5316\u5efa\u6a21\u4e3a\u9884\u7b97\u53d7\u9650\u7684\u5e8f\u8d2f\u4f18\u5316\u95ee\u9898\u3002\u5b83\u7ed3\u5408\u4e0a\u4e0b\u6587\u8d4c\u535a\u673a\u5019\u9009\u4f18\u5148\u7ea7\u5206\u914d\u4e0e\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u7684\u6280\u80fd\u6f14\u5316\uff0c\u5728\u6709\u9650\u6837\u672c\u548c\u8bc4\u4f30\u9884\u7b97\u4e0b\u6301\u7eed\u6539\u8fdb\u6280\u80fd\u5e93\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9 LLM \u667a\u80fd\u4f53\u6280\u80fd\u590d\u7528\u4e2d\u7684\u9ad8\u8bc4\u4f30\u6210\u672c\u548c\u6570\u636e\u9700\u6c42\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u66f4\u9ad8\u6548\u3001\u53ef\u6269\u5c55\u7684\u6280\u80fd\u4f18\u5316\u6846\u67b6\uff0c\u5bf9\u6784\u5efa\u4f4e\u6210\u672c\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Training prompts in online reinforcement learning (RL) differ substantially in how informative they are for the current policy: some are already saturated while others are too difficult to yield reliable learning signals, yet both receive equal rollout budget under standard training. We propose an exploration-guided prompt scaffolding framework that adapts the training prompt distribution dynamically throughout RL post-training of multimodal large language models (MLLMs). Central to our approach is the $\\textit{Exploration Potential Score} (EPS)$, a lightweight rollout-based proxy for prompt utility derived from KL-regularized policy improvement theory, computable directly from on-policy rollout statistics without additional overhead. Rather than discarding low-utility prompts, we use a teacher model to generate scaffolded rewrites that preserve the original task intent while making subsequent training more informative, reframing teacher supervision as training-data refinement rather than output imitation. Integrated with GRPO on Geo3K and MMK12, our method consistently outperforms the baseline on both in-domain and out-of-distribution benchmarks, achieving up to 9.7\\% relative improvement in-domain and gains of 11.5\\% on MathVision and 11.1\\% on MMMU-Pro.", "arxiv_id": "2609.15051", "arxiv_url": "https://arxiv.org/abs/2609.15051", "authors": ["Yuanhao Yue", "Qianli Ma", "Chengyu Wang", "Haoting Wang", "Lei Shen", "Jun Huang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u63a2\u7d22\u5f15\u5bfc\u7684\u63d0\u793a\u811a\u624b\u67b6\u6846\u67b6\uff0c\u7528\u4e8e\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u3002\u5b83\u6839\u636e\u5f53\u524d\u7b56\u7565\u5bf9\u4e0d\u540c\u8bad\u7ec3\u63d0\u793a\u7684\u5b66\u4e60\u4ef7\u503c\u52a8\u6001\u8c03\u6574\u6570\u636e\u5206\u5e03\uff0c\u5e76\u7528\u6559\u5e08\u6a21\u578b\u5c06\u4f4e\u6548\u63d0\u793a\u6539\u5199\u4e3a\u66f4\u6709\u8bad\u7ec3\u4fe1\u53f7\u7684\u7248\u672c\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15051", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Exploration Potential Score\uff08EPS\uff09\uff0c\u57fa\u4e8eKL\u6b63\u5219\u5316\u7b56\u7565\u6539\u8fdb\u7406\u8bba\uff0c\u7528\u5728\u7ebfrollout\u7edf\u8ba1\u8f7b\u91cf\u4f30\u8ba1\u63d0\u793a\u7684\u8bad\u7ec3\u6548\u7528\u3002", "\u4e0d\u76f4\u63a5\u4e22\u5f03\u4f4e\u6548\u63d0\u793a\uff0c\u800c\u662f\u901a\u8fc7\u6559\u5e08\u6a21\u578b\u751f\u6210\u4fdd\u6301\u539f\u4efb\u52a1\u610f\u56fe\u7684\u811a\u624b\u67b6\u5f0f\u6539\u5199\uff0c\u5c06\u6559\u5e08\u76d1\u7763\u8f6c\u5316\u4e3a\u8bad\u7ec3\u6570\u636e\u7cbe\u70bc\u3002", "\u7ed3\u5408GRPO\u5728Geo3K\u548cMMK12\u4e0a\u8bad\u7ec3\uff0c\u5728\u57df\u5185\u6700\u9ad8\u76f8\u5bf9\u63d0\u53479.7%\uff0c\u5e76\u5728MathVision\u548cMMMU-Pro\u4e0a\u5206\u522b\u63d0\u534711.5%\u548c11.1%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60", "\u63d0\u793a\u5de5\u7a0b", "\u540e\u8bad\u7ec3"], "num_comments": 1, "on_hf": true, "organization": "Alibaba-PAI", "pdf_url": "https://arxiv.org/pdf/2609.15051", "published_at": "2026-09-14", "score": 0.459, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15051.png", "title": "Not All Prompts Are Equal: Exploration-Guided Prompt Scaffolding for Multimodal Reinforcement Post-Training", "tldr": "\u7528\u63a2\u7d22\u4fe1\u53f7\u52a8\u6001\u6539\u5199\u63d0\u793a\uff0c\u63d0\u5347\u591a\u6a21\u6001RL\u540e\u8bad\u7ec3\u3002", "upvotes": 4, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u63a2\u7d22\u5f15\u5bfc\u7684\u63d0\u793a\u811a\u624b\u67b6\u6846\u67b6\uff0c\u7528\u4e8e\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u3002\u5b83\u6839\u636e\u5f53\u524d\u7b56\u7565\u5bf9\u4e0d\u540c\u8bad\u7ec3\u63d0\u793a\u7684\u5b66\u4e60\u4ef7\u503c\u52a8\u6001\u8c03\u6574\u6570\u636e\u5206\u5e03\uff0c\u5e76\u7528\u6559\u5e08\u6a21\u578b\u5c06\u4f4e\u6548\u63d0\u793a\u6539\u5199\u4e3a\u66f4\u6709\u8bad\u7ec3\u4fe1\u53f7\u7684\u7248\u672c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u5728\u7ebfRL\u540e\u8bad\u7ec3\u4e2d\u63d0\u793a\u6837\u672c\u4ef7\u503c\u4e0d\u5747\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u65e0\u9700\u989d\u5916\u6807\u6ce8\u548c\u8f83\u4f4e\u5f00\u9500\u7684\u52a8\u6001\u6570\u636e\u8c03\u5ea6\u4e0e\u6539\u5199\u673a\u5236\uff0c\u5bf9\u63d0\u5347\u591a\u6a21\u6001\u6a21\u578b\u63a8\u7406\u8bad\u7ec3\u6548\u7387\u548c\u6cdb\u5316\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Grounding natural-language instructions into reliable and executable actions remains a fundamental challenge for vision-language-action (VLA) systems on mobile robots, due to the persistent gap between high-level semantic reasoning and low-level locomotion and manipulation control. Existing approaches often rely on implicit reasoning or monolithic action prediction, making it difficult to maintain coherent long-horizon decision making while producing precise and adaptable robot actions. To address this challenge, we propose MobileVLA-R1 2.0, an RL-enhanced VLA framework that explicitly couples structured embodied reasoning with executable mobile robot control. The framework learns multi-granularity reasoning over embodied trajectories through supervised Chain-of-Thought (CoT) alignment and reinforcement learning, improving reasoning-to-action consistency beyond purely behavioral supervision. To support both locomotion and manipulation, we further introduce a reasoning-conditioned action decoder that maps multimodal reasoning representations to task-level action targets, which are subsequently translated into embodiment-specific commands by robot controllers. This design provides a unified perception-reasoning-action interface while decoupling high-level action generation from robot-specific actuation. We conduct extensive evaluations on language-guided navigation, quadruped control, and humanoid mobile manipulation, covering VLN-CE, QUARD, and real-world deployments on Unitree Go2 and G1 robots. MobileVLA-R1 2.0 consistently outperforms strong VLA baselines, achieving an average 1.6 point improvement in SR on VLN-CE and a 10.0 point improvement in full-task success on real-world G1 mobile manipulation tasks over MobileVLA-R1, while demonstrating robust long-horizon instruction following and closed-loop execution across different robotic platforms.", "arxiv_id": "2609.06251", "arxiv_url": "https://arxiv.org/abs/2609.06251", "authors": ["Ting Huang", "Yue Huang", "Zeyu Zhang", "Shuicheng Yan", "Hao Tang"], "brief": "\u8bba\u6587\u63d0\u51fa MobileVLA-R1 2.0\uff0c\u5c06\u7ed3\u6784\u5316\u5177\u8eab\u63a8\u7406\u4e0e\u53ef\u6267\u884c\u79fb\u52a8\u673a\u5668\u4eba\u63a7\u5236\u663e\u5f0f\u8026\u5408\u3002\u5b83\u901a\u8fc7\u76d1\u7763 CoT \u5bf9\u9f50\u4e0e\u5f3a\u5316\u5b66\u4e60\u5b66\u4e60\u591a\u7c92\u5ea6\u8f68\u8ff9\u63a8\u7406\uff0c\u5e76\u7528\u63a8\u7406\u6761\u4ef6\u52a8\u4f5c\u89e3\u7801\u5668\u751f\u6210\u4efb\u52a1\u7ea7\u52a8\u4f5c\u76ee\u6807\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/AIGeeksGroup/MobileVLA-R1-2.0", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.06251", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7ed3\u5408 Chain-of-Thought \u5bf9\u9f50\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u957f\u7a0b\u6307\u4ee4\u4e2d\u7684\u63a8\u7406-\u52a8\u4f5c\u4e00\u81f4\u6027", "\u63a8\u7406\u6761\u4ef6\u52a8\u4f5c\u89e3\u7801\u5668\u5c06\u591a\u6a21\u6001\u63a8\u7406\u8868\u793a\u6620\u5c04\u5230\u4efb\u52a1\u7ea7\u52a8\u4f5c\uff0c\u518d\u7531\u4e0d\u540c\u673a\u5668\u4eba\u63a7\u5236\u5668\u8f6c\u4e3a\u5177\u4f53\u6267\u884c\u547d\u4ee4", "\u5728 VLN-CE\u3001QUARD \u4ee5\u53ca Unitree Go2/G1 \u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u9a8c\u8bc1\uff0c\u76f8\u6bd4 MobileVLA-R1 \u5728 G1 \u771f\u5b9e\u79fb\u52a8\u64cd\u4f5c\u5168\u4efb\u52a1\u6210\u529f\u7387\u63d0\u5347 10.0 \u70b9"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2609.06251", "published_at": "2026-09-05", "score": 0.455, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06251.png", "title": "MobileVLA-R1 2.0: RL-Enhanced Reasoning for Mobile Robot Control", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u79fb\u52a8\u673a\u5668\u4ebaVLA\u63a8\u7406\u63a7\u5236", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa MobileVLA-R1 2.0\uff0c\u5c06\u7ed3\u6784\u5316\u5177\u8eab\u63a8\u7406\u4e0e\u53ef\u6267\u884c\u79fb\u52a8\u673a\u5668\u4eba\u63a7\u5236\u663e\u5f0f\u8026\u5408\u3002\u5b83\u901a\u8fc7\u76d1\u7763 CoT \u5bf9\u9f50\u4e0e\u5f3a\u5316\u5b66\u4e60\u5b66\u4e60\u591a\u7c92\u5ea6\u8f68\u8ff9\u63a8\u7406\uff0c\u5e76\u7528\u63a8\u7406\u6761\u4ef6\u52a8\u4f5c\u89e3\u7801\u5668\u751f\u6210\u4efb\u52a1\u7ea7\u52a8\u4f5c\u76ee\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u663e\u5f0f\u5177\u8eab\u63a8\u7406\u3001\u5f3a\u5316\u5b66\u4e60\u548c\u8de8\u5e73\u53f0\u673a\u5668\u4eba\u63a7\u5236\u63a5\u53e3\u7ed3\u5408\u8d77\u6765\uff0c\u7f13\u89e3\u4e86\u9ad8\u5c42\u8bed\u4e49\u51b3\u7b56\u4e0e\u4f4e\u5c42\u8fd0\u52a8\u63a7\u5236\u4e4b\u95f4\u7684\u65ad\u5c42\uff0c\u5bf9\u53ef\u9760\u957f\u7a0b\u79fb\u52a8\u64cd\u4f5c\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal agents can create complex videos in software such as Blender by coding without relying on diffusion models. Yet video understanding benchmarks still evaluate models mainly through question answering. If an agent truly understands a video, it can reconstruct it programmatically. We introduce BVB, Blender-VideoBench, a benchmark that tests this ability by asking agents to reconstruct real-world videos as animated Blender scenes. To ensure fair comparison, each agent programs the reconstruction through a lightweight harness, Mini-BVB, in an identical sandbox under a shared cost limit. The benchmark renders each reconstruction from its animated camera and evaluates it on two axes: (1) Dual VQA measures how many spatiotemporal facts the reconstruction preserves. (2) Latent Similarity measures how closely the reconstruction matches the source video perceptually. Our overall score, a square-root mean, favors balanced performance. We evaluate 51 configurations from 10 model families and analyze semantic retention, perceptual similarity, reasoning effort, and cost. The best model reaches 88.6 Latent Similarity but retains only 53.7% of the source-correct spatiotemporal answers. Additional reasoning improves visual similarity but does not close this gap in factual accuracy. In a blind study with 15 raters and five configurations, Latent Similarity correlates strongly with human preference. These results show that programmatic reconstruction is a viable test of agentic video understanding, and that semantic retention remains the main challenge.", "arxiv_id": "2609.15478", "arxiv_url": "https://arxiv.org/abs/2609.15478", "authors": ["Yolo Y. Tang", "Daiki Shimada", "Jiayue Meng", "Jing Bi", "Pinxin Liu", "Yicheng Wang", "Yunzhong Xiao", "Zhangyun Tan", "Zeliang Zhang", "Chao Huang", "Susan Liang", "Qianxiang Shen", "Luchuan Song", "Ali Vosoughi", "Mingqian Feng", "Melika Filvantorkaman", "Chenliang Xu"], "brief": "\u8bba\u6587\u63d0\u51fa BVB\uff08Blender-VideoBench\uff09\uff0c\u8981\u6c42\u591a\u6a21\u6001\u667a\u80fd\u4f53\u901a\u8fc7\u7f16\u7a0b\u5728 Blender \u4e2d\u91cd\u5efa\u771f\u5b9e\u89c6\u9891\u4e3a\u52a8\u753b\u573a\u666f\uff0c\u800c\u975e\u4ec5\u56de\u7b54\u89c6\u9891\u95ee\u9898\u3002\u5176\u914d\u5957 Mini-BVB \u7edf\u4e00\u6c99\u7bb1\u3001\u6210\u672c\u9650\u5236\u548c\u6267\u884c\u63a5\u53e3\uff0c\u5e76\u7528\u91cd\u5efa\u6e32\u67d3\u7ed3\u679c\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u89c6\u9891\u7406\u89e3\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/yunlong10/BVB", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.15478", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b\u5305\u542b\u4e24\u6761\u8f74\u7ebf\uff1aDual VQA \u8861\u91cf\u91cd\u5efa\u662f\u5426\u4fdd\u7559\u65f6\u7a7a\u4e8b\u5b9e\uff0cLatent Similarity \u8861\u91cf\u611f\u77e5\u5c42\u9762\u4e0e\u539f\u89c6\u9891\u7684\u76f8\u4f3c\u5ea6\u3002", "\u572810\u4e2a\u6a21\u578b\u5bb6\u65cf\u300151\u79cd\u914d\u7f6e\u4e0a\u8bc4\u6d4b\uff0c\u6700\u4f73\u6a21\u578b Latent Similarity \u8fbe\u523088.6\uff0c\u4f46\u4ec5\u4fdd\u755953.7%\u7684\u6e90\u89c6\u9891\u6b63\u786e\u65f6\u7a7a\u95ee\u7b54\u4e8b\u5b9e\u3002", "\u989d\u5916\u63a8\u7406\u80fd\u63d0\u5347\u89c6\u89c9\u76f8\u4f3c\u5ea6\uff0c\u4f46\u96be\u4ee5\u5f25\u5408\u4e8b\u5b9e\u51c6\u786e\u6027\u5dee\u8ddd\uff1b\u76f2\u6d4b\u663e\u793a Latent Similarity \u4e0e\u4eba\u7c7b\u504f\u597d\u9ad8\u5ea6\u76f8\u5173\u3002"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u57fa\u51c6\u8bc4\u6d4b", "\u7a0b\u5e8f\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15478", "published_at": "2026-09-14", "score": 0.45, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15478.png", "title": "BVB: Benchmarking Agentic Video Understanding via Programmatic Reconstruction in Blender", "tldr": "\u7528Blender\u91cd\u5efa\u89c6\u9891\u8bc4\u6d4b\u667a\u80fd\u4f53\u7406\u89e3\u80fd\u529b", "upvotes": 17, "what_it_is": "\u8bba\u6587\u63d0\u51fa BVB\uff08Blender-VideoBench\uff09\uff0c\u8981\u6c42\u591a\u6a21\u6001\u667a\u80fd\u4f53\u901a\u8fc7\u7f16\u7a0b\u5728 Blender \u4e2d\u91cd\u5efa\u771f\u5b9e\u89c6\u9891\u4e3a\u52a8\u753b\u573a\u666f\uff0c\u800c\u975e\u4ec5\u56de\u7b54\u89c6\u9891\u95ee\u9898\u3002\u5176\u914d\u5957 Mini-BVB \u7edf\u4e00\u6c99\u7bb1\u3001\u6210\u672c\u9650\u5236\u548c\u6267\u884c\u63a5\u53e3\uff0c\u5e76\u7528\u91cd\u5efa\u6e32\u67d3\u7ed3\u679c\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u89c6\u9891\u7406\u89e3\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u9891\u7406\u89e3\u8bc4\u6d4b\u4ece\u95ee\u7b54\u63a8\u8fdb\u5230\u201c\u53ef\u6267\u884c\u7684\u7a0b\u5e8f\u5316\u91cd\u5efa\u201d\uff0c\u66f4\u8d34\u8fd1\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u771f\u5b9e\u80fd\u529b\u8fb9\u754c\uff1b\u7ed3\u679c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u80fd\u505a\u51fa\u76f8\u4f3c\u753b\u9762\uff0c\u5374\u4ecd\u96be\u53ef\u9760\u4fdd\u7559\u65f6\u7a7a\u8bed\u4e49\u4e8b\u5b9e\u3002"}, {"abstract": "Vibe design agents turn natural-language briefs into rendered interfaces and frontend code. Yet a useful design agent should do more than produce one valid page: it should help users explore coherent alternatives. Increasing token-level temperature is a blunt solution because it varies aesthetic decisions and syntax-sensitive code at the same time. We instead separate exploration from implementation through an inference architecture that makes design direction an explicit intermediate decision. Inspired by Verbalized Sampling, a pre-pass proposes structured design specifications with typicality scores, an external selector samples one, and the downstream generator realizes the selected specification together with the original request under fixed settings. We apply this approach to UI themes and visual-asset prompts. Across 168 prompts, with 1,255 paired comparisons per temperature for each intervention, theme sampling broadens observed selection coverage and screenshot variation, while LLM-judge preferences vary across interventions, prompt complexity, and viewport. In an online experiment with more than 300,000 tasks, the observed code-export increase remains statistically uncertain, while fewer negative feedback events coexist with more correction interactions and modest operational costs. Together, these findings identify structured design specifications as a practical control point for exploring alternative UI concepts while keeping downstream generation settings fixed.", "arxiv_id": "2609.15078", "arxiv_url": "https://arxiv.org/abs/2609.15078", "authors": ["Yifan Zhang", "Nghi D. Q. Bui", "Georgios Evangelopoulos", "Arnaud Benard"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 Vibe design agents \u7684\u63a8\u7406\u67b6\u6784\uff1a\u5148\u751f\u6210\u5e26\u5178\u578b\u6027\u8bc4\u5206\u7684\u7ed3\u6784\u5316\u8bbe\u8ba1\u65b9\u5411\uff0c\u518d\u91c7\u6837\u5176\u4e2d\u4e00\u4e2a\u89c4\u683c\u5e76\u56fa\u5b9a\u4e0b\u6e38\u751f\u6210\u8bbe\u7f6e\u6765\u5b9e\u73b0\u754c\u9762\u4e0e\u4ee3\u7801\u3002\u8be5\u65b9\u6cd5\u5c06\u201c\u63a2\u7d22\u8bbe\u8ba1\u6982\u5ff5\u201d\u548c\u201c\u751f\u6210\u53ef\u8fd0\u884c\u524d\u7aef\u201d\u89e3\u8026\uff0c\u7528\u4e8e UI \u4e3b\u9898\u548c\u89c6\u89c9\u7d20\u6750\u63d0\u793a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15078", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d7 Verbalized Sampling \u542f\u53d1\uff0c\u5f15\u5165\u9884\u751f\u6210\u8bbe\u8ba1\u89c4\u683c\u3001\u5178\u578b\u6027\u8bc4\u5206\u3001\u5916\u90e8\u9009\u62e9\u5668\u548c\u56fa\u5b9a\u53c2\u6570\u751f\u6210\u5668\u7684\u4e24\u9636\u6bb5\u6d41\u7a0b\u3002", "\u5728 168 \u4e2a\u63d0\u793a\u4e0a\u8fdb\u884c\u6210\u5bf9\u6bd4\u8f83\u5b9e\u9a8c\uff0c\u4e3b\u9898\u91c7\u6837\u6269\u5927\u4e86\u9009\u62e9\u8986\u76d6\u7387\u548c\u622a\u56fe\u89c6\u89c9\u5dee\u5f02\u3002", "30 \u4e07\u4f59\u5728\u7ebf\u4efb\u52a1\u5b9e\u9a8c\u663e\u793a\u4ee3\u7801\u5bfc\u51fa\u63d0\u5347\u5c1a\u4e0d\u786e\u5b9a\uff0c\u4f46\u8d1f\u53cd\u9988\u51cf\u5c11\uff0c\u540c\u65f6\u4fee\u6b63\u4ea4\u4e92\u589e\u52a0\u4e14\u6210\u672c\u9002\u4e2d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "UI\u751f\u6210", "\u4ee3\u7801\u751f\u6210", "\u91c7\u6837\u7b56\u7565"], "num_comments": 0, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2609.15078", "published_at": "2026-09-14", "score": 0.443, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15078.png", "title": "Enabling Creative Exploration for Vibe Design Agents", "tldr": "\u7528\u663e\u5f0f\u8bbe\u8ba1\u89c4\u683c\u63a7\u5236UI\u521b\u610f\u63a2\u7d22", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411 Vibe design agents \u7684\u63a8\u7406\u67b6\u6784\uff1a\u5148\u751f\u6210\u5e26\u5178\u578b\u6027\u8bc4\u5206\u7684\u7ed3\u6784\u5316\u8bbe\u8ba1\u65b9\u5411\uff0c\u518d\u91c7\u6837\u5176\u4e2d\u4e00\u4e2a\u89c4\u683c\u5e76\u56fa\u5b9a\u4e0b\u6e38\u751f\u6210\u8bbe\u7f6e\u6765\u5b9e\u73b0\u754c\u9762\u4e0e\u4ee3\u7801\u3002\u8be5\u65b9\u6cd5\u5c06\u201c\u63a2\u7d22\u8bbe\u8ba1\u6982\u5ff5\u201d\u548c\u201c\u751f\u6210\u53ef\u8fd0\u884c\u524d\u7aef\u201d\u89e3\u8026\uff0c\u7528\u4e8e UI \u4e3b\u9898\u548c\u89c6\u89c9\u7d20\u6750\u63d0\u793a\u3002", "why_notable": "\u76f8\u6bd4\u76f4\u63a5\u63d0\u9ad8 temperature \u540c\u65f6\u6270\u52a8\u5ba1\u7f8e\u4e0e\u4ee3\u7801\u8bed\u6cd5\uff0c\u8be5\u65b9\u6cd5\u63d0\u4f9b\u4e86\u66f4\u53ef\u63a7\u7684\u521b\u610f\u63a2\u7d22\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u8bbe\u8ba1\u667a\u80fd\u4f53\u751f\u6210\u591a\u6837\u4f46\u4e00\u81f4\u7684 UI \u65b9\u6848\uff0c\u5e76\u4fdd\u6301\u5b9e\u73b0\u7a33\u5b9a\u6027\u3002"}, {"abstract": "Foundation models have progressed from learning and reasoning over existing knowledge, to increasingly learning through action, tool use, and outcome feedback. We argue that the next frontier is a further transition: from solving and acting within problems specified by humans to participating in the process by which new problems, representations, explanations, and knowledge are created. We refer to this capability as Discovery Intelligence. We formulate Discovery Foundation Models (DFMs) as general-purpose model systems for open-ended discovery. A DFM operates over a revisable research state and supports seven coupled capabilities spanning problem discovery, formulation, representation construction, hypothesis formation, intervention, evidence-grounded revision, and continual discovery improvement. We instantiate this framework with Zetema, which couples explicit research-state dynamics, verification and experimental gating, external grounding, and cross-task Discovery Skill evolution. We further ground the framework with GALILEO, a real therapeutic-discovery system in which Dry-Lab reasoning, robotic and hands-on Wet-Lab experimentation, external biological evidence, and iterative hypothesis and design revision form a closed physical discovery loop. We then formulate a unified approach to capability formation and process-centered evaluation, enabling discovery behavior to be trained, improved, and measured beyond final-answer performance. Together, these components establish discovery as a learnable, executable, and evaluable capability of foundation-model systems. We view this shift as a broader progression in intelligence scaling: from learning over existing knowledge, to learning from action outcomes, and ultimately to participating in the construction, testing, and revision of the structures through which new knowledge is discovered. Code: https://github.com/Gen-Verse/DFM-Plans", "arxiv_id": "2609.15973", "arxiv_url": "https://arxiv.org/abs/2609.15973", "authors": ["Ling Yang", "Zhenfei Yin", "Yingcheng Wu"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u53d1\u73b0\u57fa\u7840\u6a21\u578b\u201d\uff08DFM\uff09\u6982\u5ff5\uff0c\u5c06\u57fa\u7840\u6a21\u578b\u4ece\u56de\u7b54\u65e2\u5b9a\u95ee\u9898\u63a8\u8fdb\u5230\u53c2\u4e0e\u65b0\u95ee\u9898\u3001\u8868\u5f81\u3001\u5047\u8bbe\u4e0e\u77e5\u8bc6\u7684\u751f\u6210\u3002\u4f5c\u8005\u7ed9\u51fa\u5305\u542b\u4e03\u7c7b\u80fd\u529b\u7684\u5f00\u653e\u5f0f\u53d1\u73b0\u6846\u67b6\uff0c\u5e76\u4ee5 Zetema \u4e0e\u771f\u5b9e\u6cbb\u7597\u53d1\u73b0\u7cfb\u7edf GALILEO \u5c55\u793a\u95ed\u73af\u79d1\u7814\u53d1\u73b0\u6d41\u7a0b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Gen-Verse/DFM-Plans", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.15973", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["DFM \u4ee5\u53ef\u4fee\u8ba2\u7684\u201c\u7814\u7a76\u72b6\u6001\u201d\u4e3a\u6838\u5fc3\uff0c\u8986\u76d6\u95ee\u9898\u53d1\u73b0\u3001\u95ee\u9898\u8868\u8ff0\u3001\u8868\u5f81\u6784\u5efa\u3001\u5047\u8bbe\u5f62\u6210\u3001\u5e72\u9884\u5b9e\u9a8c\u3001\u8bc1\u636e\u9a71\u52a8\u4fee\u8ba2\u4e0e\u6301\u7eed\u53d1\u73b0\u6539\u8fdb\u4e03\u9879\u80fd\u529b\u3002", "Zetema \u7ed3\u5408\u7814\u7a76\u72b6\u6001\u52a8\u6001\u3001\u9a8c\u8bc1\u4e0e\u5b9e\u9a8c\u95e8\u63a7\u3001\u5916\u90e8\u8bc1\u636e grounding\uff0c\u4ee5\u53ca\u8de8\u4efb\u52a1 Discovery Skill \u6f14\u5316\u3002", "GALILEO \u5c06 Dry-Lab \u63a8\u7406\u3001\u673a\u5668\u4eba\u548c\u4eba\u5de5 Wet-Lab \u5b9e\u9a8c\u3001\u5916\u90e8\u751f\u7269\u8bc1\u636e\u4e0e\u8fed\u4ee3\u8bbe\u8ba1\u4fee\u8ba2\u7ec4\u6210\u771f\u5b9e\u7269\u7406\u95ed\u73af\u53d1\u73b0\u7cfb\u7edf\u3002"], "keywords": ["\u79d1\u5b66\u667a\u80fd\u4f53", "\u57fa\u7840\u6a21\u578b", "AI4Science", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15973", "published_at": "2026-09-14", "score": 0.441, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15973.png", "title": "Discovery Foundation Models: Toward Open-Ended Discovery Intelligence", "tldr": "\u63d0\u51fa\u9762\u5411\u5f00\u653e\u5f0f\u79d1\u7814\u53d1\u73b0\u7684\u57fa\u7840\u6a21\u578b\u6846\u67b6", "upvotes": 18, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u53d1\u73b0\u57fa\u7840\u6a21\u578b\u201d\uff08DFM\uff09\u6982\u5ff5\uff0c\u5c06\u57fa\u7840\u6a21\u578b\u4ece\u56de\u7b54\u65e2\u5b9a\u95ee\u9898\u63a8\u8fdb\u5230\u53c2\u4e0e\u65b0\u95ee\u9898\u3001\u8868\u5f81\u3001\u5047\u8bbe\u4e0e\u77e5\u8bc6\u7684\u751f\u6210\u3002\u4f5c\u8005\u7ed9\u51fa\u5305\u542b\u4e03\u7c7b\u80fd\u529b\u7684\u5f00\u653e\u5f0f\u53d1\u73b0\u6846\u67b6\uff0c\u5e76\u4ee5 Zetema \u4e0e\u771f\u5b9e\u6cbb\u7597\u53d1\u73b0\u7cfb\u7edf GALILEO \u5c55\u793a\u95ed\u73af\u79d1\u7814\u53d1\u73b0\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u57fa\u7840\u6a21\u578b\u80fd\u529b\u8bc4\u4f30\u4ece\u201c\u6700\u7ec8\u7b54\u6848\u201d\u6269\u5c55\u5230\u79d1\u7814\u53d1\u73b0\u8fc7\u7a0b\u672c\u8eab\uff0c\u5f3a\u8c03\u53ef\u5b66\u4e60\u3001\u53ef\u6267\u884c\u3001\u53ef\u8bc4\u4f30\u7684\u5f00\u653e\u5f0f\u53d1\u73b0\u667a\u80fd\uff0c\u5bf9\u79d1\u5b66\u667a\u80fd\u4f53\u3001AI4Science \u548c\u81ea\u52a8\u5316\u5b9e\u9a8c\u5e73\u53f0\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Diffusion large language models (dLLMs) achieve high decoding efficiency through block-parallel, arbitrary-order generation, making them attractive for latency-sensitive applications. GUI agents represent a natural testbed for this paradigm, as they must repeatedly perceive screen states and emit structured, spatially grounded actions in real time. However, whether dLLMs can be extended into capable multimodal GUI agents while preserving their parallel decoding advantage remains an open question. We present LLaDA-UI, a 16.7B-parameter MoE-based, block-wise diffusion vision-language GUI agent. LLaDA-UI follows a two-stage training pipeline: general multimodal pre-training aligns a native-resolution vision encoder with the LLaDA2.0-mini-base diffusion language backbone, followed by GUI-agent supervised fine-tuning on diverse mobile, desktop, web, and grounding data. Across widely adopted grounding benchmarks and navigation benchmarks spanning multiple platforms, LLaDA-UI substantially outperforms Qwen2.5-VL-7B and surpasses Qwen3-VL-8B on four of six reported GUI benchmarks. These results establish block-wise diffusion as a practical generative paradigm for multimodal GUI agents.", "arxiv_id": "2609.13287", "arxiv_url": "https://arxiv.org/abs/2609.13287", "authors": ["Zhangxuan Gu", "Haoxing Chen", "Qi Qin", "Yi Xin", "Kai Gan", "Lin Liu", "Long Cui", "Xiaomei Wang", "Beitong Zhou", "Yunzhu Zhang", "Zhengwen Zeng", "Changlong Gao", "Weizhi Chen", "Rongchao Zhang", "Haoyuan Wu", "Shuheng Shen", "Changhua Meng", "Weiqiang Wang", "Jianguo Li", "Zhenzhong Lan"], "brief": "\u8bba\u6587\u63d0\u51fa LLaDA-UI\uff0c\u4e00\u4e2a 16.7B \u53c2\u6570 MoE \u5757\u5f0f\u6269\u6563\u89c6\u89c9\u8bed\u8a00 GUI \u667a\u80fd\u4f53\u3002\u5b83\u5c06\u539f\u751f\u5206\u8fa8\u7387\u89c6\u89c9\u7f16\u7801\u5668\u4e0e LLaDA2.0-mini-base \u6269\u6563\u8bed\u8a00\u9aa8\u5e72\u5bf9\u9f50\uff0c\u5e76\u901a\u8fc7 GUI \u4efb\u52a1\u76d1\u7763\u5fae\u8c03\uff0c\u652f\u6301\u8de8\u79fb\u52a8\u7aef\u3001\u684c\u9762\u3001\u7f51\u9875\u7684\u5c4f\u5e55\u7406\u89e3\u4e0e\u52a8\u4f5c\u751f\u6210\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/inclusionAI/LLaDA-UI", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2609.13287", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5229\u7528\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\u7684\u5757\u5e76\u884c\u3001\u4efb\u610f\u987a\u5e8f\u751f\u6210\u673a\u5236\uff0c\u9762\u5411 GUI \u667a\u80fd\u4f53\u964d\u4f4e\u5b9e\u65f6\u4ea4\u4e92\u4e2d\u7684\u89e3\u7801\u5ef6\u8fdf\u3002", "\u91c7\u7528\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u901a\u7528\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u8fdb\u884c\u89c6\u89c9-\u8bed\u8a00\u5bf9\u9f50\uff0c\u518d\u5728\u591a\u5e73\u53f0 GUI \u5bfc\u822a\u3001\u7f51\u9875\u3001\u684c\u9762\u4e0e grounding \u6570\u636e\u4e0a\u76d1\u7763\u5fae\u8c03\u3002", "\u5728\u591a\u4e2a GUI grounding \u4e0e\u5bfc\u822a\u57fa\u51c6\u4e0a\u663e\u8457\u8d85\u8fc7 Qwen2.5-VL-7B\uff0c\u5e76\u5728 6 \u4e2a GUI \u57fa\u51c6\u4e2d\u7684 4 \u4e2a\u8d85\u8fc7 Qwen3-VL-8B\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u6269\u6563\u6a21\u578b", "GUI"], "num_comments": 1, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2609.13287", "published_at": "2026-09-09", "score": 0.432, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13287.png", "title": "LLaDA-UI: Bringing Block-wise Diffusion to Vision-Language GUI Agents", "tldr": "\u5757\u5f0f\u6269\u6563\u53ef\u6253\u9020\u9ad8\u6548\u591a\u6a21\u6001GUI\u667a\u80fd\u4f53", "upvotes": 8, "what_it_is": "\u8bba\u6587\u63d0\u51fa LLaDA-UI\uff0c\u4e00\u4e2a 16.7B \u53c2\u6570 MoE \u5757\u5f0f\u6269\u6563\u89c6\u89c9\u8bed\u8a00 GUI \u667a\u80fd\u4f53\u3002\u5b83\u5c06\u539f\u751f\u5206\u8fa8\u7387\u89c6\u89c9\u7f16\u7801\u5668\u4e0e LLaDA2.0-mini-base \u6269\u6563\u8bed\u8a00\u9aa8\u5e72\u5bf9\u9f50\uff0c\u5e76\u901a\u8fc7 GUI \u4efb\u52a1\u76d1\u7763\u5fae\u8c03\uff0c\u652f\u6301\u8de8\u79fb\u52a8\u7aef\u3001\u684c\u9762\u3001\u7f51\u9875\u7684\u5c4f\u5e55\u7406\u89e3\u4e0e\u52a8\u4f5c\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9a8c\u8bc1\u4e86\u5757\u5f0f\u6269\u6563\u751f\u6210\u8303\u5f0f\u4e0d\u4ec5\u9002\u7528\u4e8e\u6587\u672c\u751f\u6210\uff0c\u4e5f\u80fd\u6269\u5c55\u5230\u9700\u8981\u7a7a\u95f4\u5b9a\u4f4d\u548c\u7ed3\u6784\u5316\u52a8\u4f5c\u8f93\u51fa\u7684\u591a\u6a21\u6001 GUI \u667a\u80fd\u4f53\uff0c\u4e3a\u4f4e\u5ef6\u8fdf computer use \u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u65b0\u7684\u6a21\u578b\u8def\u7ebf\u3002"}, {"abstract": "Large language model (LLM) agents allocate test-time compute adaptively as they revise solutions, use tools, explore alternatives, and decide when to stop. This test-time strategy makes it difficult to measure how agent performance scales. We study open-ended tasks that provide continuous scores for intermediate submissions, making progress observable throughout long trajectories. We propose Elo-per-token analysis, which tracks the best solution found at each token budget and uses a Bradley-Terry model to aggregate within-task orderings into Elo ratings across tasks with different score scales. We apply it to four general-purpose agents on four open-ended benchmarks, with sessions of up to 100M tokens, and to three feedback-driven LLM optimization harnesses in controlled single-task interventions. Independent sampling provides a theoretically characterized reference, for which Elo grows linearly with log compute. Against this reference, agents can initially convert tokens into Elo faster than independent sampling, but their marginal gains diminish and eventually fall below the reference. In contrast, the strongest historical human contestants improve superlinearly over contest time on shared AtCoder Heuristic Contest tasks, providing evidence of continual learning and substantial headroom after agents slow down. We define the scaling inflection point as the per-session budget where marginal Elo gains match the independent-sampling reference. Using this point as the per-session budget, we split 100M tokens across parallel sessions on FrontierCS Polyomino Packing, gaining +264 Elo over one long session and +355 over ten short sessions.", "arxiv_id": "2609.15309", "arxiv_url": "https://arxiv.org/abs/2609.15309", "authors": ["Kaiyuan Liu", "Qiuyang Mang", "Bo Peng", "Wenhao Chai", "Hanchen Li", "Shreyas Pimpalgaonkar", "Luke Zettlemoyer", "Alex Dimakis", "Alvin Cheung"], "brief": "\u8bba\u6587\u63d0\u51faElo-per-token\u5206\u6790\uff0c\u7528\u8fde\u7eed\u4e2d\u95f4\u5f97\u5206\u8ddf\u8e2aLLM\u667a\u80fd\u4f53\u5728\u4e0d\u540ctoken\u9884\u7b97\u4e0b\u627e\u5230\u7684\u6700\u4f73\u89e3\uff0c\u5e76\u7528Bradley-Terry\u6a21\u578b\u8de8\u4efb\u52a1\u805a\u5408\u4e3aElo\u8bc4\u5206\u3002\u4f5c\u8005\u5728\u5f00\u653e\u5f0f\u57fa\u51c6\u3001\u8d85\u957f100M token\u4f1a\u8bdd\u548c\u53cd\u9988\u9a71\u52a8\u4f18\u5316\u6846\u67b6\u4e0a\u7814\u7a76\u667a\u80fd\u4f53\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7684\u8fb9\u9645\u6536\u76ca\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15309", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u72ec\u7acb\u91c7\u6837\u88ab\u4f5c\u4e3a\u7406\u8bba\u53c2\u7167\uff0c\u5176Elo\u968flog\u8ba1\u7b97\u91cf\u7ebf\u6027\u589e\u957f\uff1b\u667a\u80fd\u4f53\u65e9\u671f\u53ef\u80fd\u4f18\u4e8e\u8be5\u53c2\u7167\uff0c\u4f46\u8fb9\u9645\u6536\u76ca\u4f1a\u9012\u51cf\u5e76\u6700\u7ec8\u4f4e\u4e8e\u53c2\u7167\u3002", "\u63d0\u51fa\u201c\u7f29\u653e\u62d0\u70b9\u201d\u6982\u5ff5\uff1a\u5f53\u5355\u4f1a\u8bdd\u8fb9\u9645Elo\u589e\u76ca\u4e0e\u72ec\u7acb\u91c7\u6837\u53c2\u7167\u76f8\u7b49\u65f6\u7684token\u9884\u7b97\uff0c\u53ef\u7528\u4e8e\u51b3\u5b9a\u4f55\u65f6\u505c\u6b62\u6216\u5e76\u884c\u91cd\u542f\u3002", "\u5728FrontierCS Polyomino Packing\u4e0a\uff0c\u5c06100M tokens\u6309\u62d0\u70b9\u62c6\u5206\u5230\u5e76\u884c\u4f1a\u8bdd\uff0c\u6bd4\u4e00\u4e2a\u957f\u4f1a\u8bdd\u9ad8264 Elo\uff0c\u6bd4\u5341\u4e2a\u77ed\u4f1a\u8bdd\u9ad8355 Elo\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u8bc4\u4f30\u65b9\u6cd5", "\u641c\u7d22\u4f18\u5316"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15309", "published_at": "2026-09-14", "score": 0.401, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15309.png", "title": "When Agents Slow Down: Understanding LLM Agents\u0027 Test-Time Strategies via Elo-per-token Analysis", "tldr": "\u7528Elo-per-token\u91cf\u5316\u667a\u80fd\u4f53\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u6548\u7387", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51faElo-per-token\u5206\u6790\uff0c\u7528\u8fde\u7eed\u4e2d\u95f4\u5f97\u5206\u8ddf\u8e2aLLM\u667a\u80fd\u4f53\u5728\u4e0d\u540ctoken\u9884\u7b97\u4e0b\u627e\u5230\u7684\u6700\u4f73\u89e3\uff0c\u5e76\u7528Bradley-Terry\u6a21\u578b\u8de8\u4efb\u52a1\u805a\u5408\u4e3aElo\u8bc4\u5206\u3002\u4f5c\u8005\u5728\u5f00\u653e\u5f0f\u57fa\u51c6\u3001\u8d85\u957f100M token\u4f1a\u8bdd\u548c\u53cd\u9988\u9a71\u52a8\u4f18\u5316\u6846\u67b6\u4e0a\u7814\u7a76\u667a\u80fd\u4f53\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7684\u8fb9\u9645\u6536\u76ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u8bc4\u4f30LLM\u667a\u80fd\u4f53\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u6269\u5c55\u63d0\u4f9b\u4e86\u53ef\u6bd4\u8f83\u3001\u53ef\u64cd\u4f5c\u7684\u5ea6\u91cf\uff0c\u5e76\u63ed\u793a\u957f\u8f68\u8ff9\u667a\u80fd\u4f53\u4f1a\u201c\u53d8\u6162\u201d\u7684\u7cfb\u7edf\u6027\u73b0\u8c61\uff0c\u5bf9\u667a\u80fd\u4f53\u9884\u7b97\u5206\u914d\u3001\u5e76\u884c\u641c\u7d22\u548c\u505c\u6b62\u7b56\u7565\u8bbe\u8ba1\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models are unreliable at arithmetic, which is a problem for clinical calculators where a single numerical error changes the recommendation. The standard response is to hardcode each calculator as a validated function, one at a time. We test an alternative: the model does not calculate. Instead, it writes case-specific Python that a restricted local executor runs as a deterministic solver, and the model\u0027s task reduces to deciding how to use it. We evaluate this Program-Solve interface on MedCalc-Bench Verified (1,100 cases, 55 calculators) against direct model arithmetic and a hand-written 22-calculator library, using Qwen2.5-7B and Qwen2.5-32B-AWQ, after auditing the benchmark\u0027s formulas against current clinical guidelines and flagging 16 of 55 with version, use or coefficient concerns. With formulas and gold variables supplied and both routes reading the whole note, handing off to the solver is not a reliable advantage at 7B (75.31% against 72.02%, a paired +3.29 points with a 95% calculator-cluster interval of [-3.49, 10.38]) but is one at 32B (90.53% against 83.47%, +7.05 [0.47, 14.60], clear of zero). The hand-written library is exact on its 440 supported cases but abstains elsewhere (40.0% overall). Adding an executor thus helps some open-weight models more than others even under matched formula, variable and note access, and is not a substitute for verified formulas or reliable variable extraction either way.", "arxiv_id": "2609.10728", "arxiv_url": "https://arxiv.org/abs/2609.10728", "authors": ["Felipe Ocampo Osorio", "Sebasti\u00e1n Andr\u00e9s Cajas Ordo\u00f1ez", "Maximin Lange", "Rafi Al Attrach", "Sahil Kapadia", "Zakaria Laouabdia Sellami", "Angelo Antonio Talio", "Leo Anthony Celi"], "brief": "\u8bba\u6587\u63d0\u51fa Program-Solve \u63a5\u53e3\uff1a\u4e34\u5e8a\u8bed\u8a00\u6a21\u578b\u4e0d\u76f4\u63a5\u505a\u7b97\u672f\uff0c\u800c\u662f\u751f\u6210\u75c5\u4f8b\u7279\u5b9a Python\uff0c\u7531\u53d7\u9650\u672c\u5730\u6267\u884c\u5668\u786e\u5b9a\u6027\u6c42\u89e3\u3002\u4f5c\u8005\u5728 MedCalc-Bench Verified \u4e0a\u6bd4\u8f83\u76f4\u63a5\u7b97\u672f\u3001\u7a0b\u5e8f\u6c42\u89e3\u548c\u624b\u5199\u8ba1\u7b97\u5668\u5e93\uff0c\u5e76\u5ba1\u8ba1\u4e86\u57fa\u51c6\u516c\u5f0f\u7684\u4e34\u5e8a\u6709\u6548\u6027\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": "https://github.com/felipeocampoos/Towards-a-Deterministic-Math-Solver-for-Clinical-Language-Models", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10728", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u5728 1,100 \u4e2a\u75c5\u4f8b\u300155 \u4e2a\u4e34\u5e8a\u8ba1\u7b97\u5668\u4e0a\u8bc4\u6d4b Qwen2.5-7B \u4e0e Qwen2.5-32B-AWQ\u3002", "Program-Solve \u5bf9 7B \u6a21\u578b\u63d0\u5347\u4e0d\u663e\u8457\uff1a75.31% \u5bf9 72.02%\uff0c\u7f6e\u4fe1\u533a\u95f4\u8de8\u96f6\u3002", "\u5bf9 32B \u6a21\u578b\u6709\u660e\u663e\u6536\u76ca\uff1a90.53% \u5bf9 83.47%\uff0c\u63d0\u5347 7.05 \u4e2a\u767e\u5206\u70b9\uff1b\u624b\u5199\u5e93\u5728\u652f\u6301\u8303\u56f4\u5185\u7cbe\u786e\u4f46\u8986\u76d6\u7387\u4ec5 40%\u3002"], "keywords": ["\u4e34\u5e8aAI", "\u4ee3\u7801\u751f\u6210", "\u5de5\u5177\u8c03\u7528", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Massachusetts Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2609.10728", "published_at": "2026-09-09", "score": 0.4, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.10728.png", "title": "Towards a Deterministic Math Solver for Clinical Language Models", "tldr": "\u8ba9\u4e34\u5e8a\u6a21\u578b\u5199\u4ee3\u7801\u8c03\u7528\u786e\u5b9a\u6027\u8ba1\u7b97\u5668", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Program-Solve \u63a5\u53e3\uff1a\u4e34\u5e8a\u8bed\u8a00\u6a21\u578b\u4e0d\u76f4\u63a5\u505a\u7b97\u672f\uff0c\u800c\u662f\u751f\u6210\u75c5\u4f8b\u7279\u5b9a Python\uff0c\u7531\u53d7\u9650\u672c\u5730\u6267\u884c\u5668\u786e\u5b9a\u6027\u6c42\u89e3\u3002\u4f5c\u8005\u5728 MedCalc-Bench Verified \u4e0a\u6bd4\u8f83\u76f4\u63a5\u7b97\u672f\u3001\u7a0b\u5e8f\u6c42\u89e3\u548c\u624b\u5199\u8ba1\u7b97\u5668\u5e93\uff0c\u5e76\u5ba1\u8ba1\u4e86\u57fa\u51c6\u516c\u5f0f\u7684\u4e34\u5e8a\u6709\u6548\u6027\u3002", "why_notable": "\u4e34\u5e8a\u8ba1\u7b97\u4e2d\u5355\u4e2a\u6570\u503c\u9519\u8bef\u53ef\u80fd\u6539\u53d8\u5efa\u8bae\uff0c\u8be5\u5de5\u4f5c\u8868\u660e\u5c06\u7b97\u672f\u4ea4\u7ed9\u53d7\u9650\u6267\u884c\u5668\u53ef\u63d0\u5347\u90e8\u5206\u5f00\u6e90\u6a21\u578b\u53ef\u9760\u6027\uff0c\u4f46\u4e5f\u5f3a\u8c03\u4e0d\u80fd\u66ff\u4ee3\u5df2\u9a8c\u8bc1\u516c\u5f0f\u548c\u53ef\u9760\u53d8\u91cf\u62bd\u53d6\u3002"}, {"abstract": "Large language model (LLM) agents increasingly rely on external skills, but routing user requests over large skill registries is difficult because many skills are functionally redundant while complex tasks often require complementary skill sets. Existing skill routers typically rank candidates independently by query relevance, which can waste context budget on redundant skills. We propose Diverse Skill Routing (DSR), a diversity-aware reranking framework that uses a Determinantal Point Process to balance relevance and non-redundancy. DSR introduces a query-residual diversity kernel that penalizes redundant skill overlap while reducing penalties caused only by shared query relevance. On the SkillRouter benchmark, DSR improves recall and full coverage over a strong pointwise reranking baseline, with larger gains on multi-skill queries. These results suggest that skill routing should be treated not only as relevance ranking, but also as complementary set selection.", "arxiv_id": "2609.05824", "arxiv_url": "https://arxiv.org/abs/2609.05824", "authors": ["Wang Wei", "Tiankai Yang", "Samyadeep Basu", "Hongjie Chen", "Yue Zhao", "Zhengzhong Tu", "Xiyang Hu", "Franck Dernoncourt", "Ryan A. Rossi", "Hoda Eldardiry"], "brief": "\u8bba\u6587\u63d0\u51fa Diverse Skill Routing\uff08DSR\uff09\uff0c\u5c06LLM\u667a\u80fd\u4f53\u7684\u6280\u80fd\u9009\u62e9\u4ece\u5355\u7eaf\u76f8\u5173\u6027\u6392\u5e8f\u6539\u4e3a\u517c\u987e\u76f8\u5173\u6027\u4e0e\u4e92\u8865\u6027\u7684\u96c6\u5408\u9009\u62e9\u3002\u5b83\u7528\u786e\u5b9aantal\u70b9\u8fc7\u7a0b\uff08DPP\uff09\u91cd\u6392\u6280\u80fd\uff0c\u51cf\u5c11\u4e0a\u4e0b\u6587\u4e2d\u529f\u80fd\u5197\u4f59\u7684\u6280\u80fd\u5360\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.05824", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u5927\u578b\u6280\u80fd\u5e93\u4e2d\u6280\u80fd\u529f\u80fd\u91cd\u53e0\u3001\u590d\u6742\u4efb\u52a1\u9700\u591a\u6280\u80fd\u534f\u540c\u7684\u95ee\u9898\uff0c\u6539\u8fdb\u4f20\u7edfTop-k\u76f8\u5173\u6027\u68c0\u7d22\u3002", "\u63d0\u51faquery-residual diversity kernel\uff0c\u60e9\u7f5a\u6280\u80fd\u95f4\u5197\u4f59\u91cd\u53e0\uff0c\u540c\u65f6\u907f\u514d\u628a\u5171\u540c\u5339\u914d\u67e5\u8be2\u9700\u6c42\u8bef\u5224\u4e3a\u5197\u4f59\u3002", "\u5728SkillRouter\u57fa\u51c6\u4e0a\u76f8\u6bd4\u5f3a\u70b9\u5f0f\u91cd\u6392\u57fa\u7ebf\u63d0\u5347\u53ec\u56de\u7387\u4e0e\u5b8c\u6574\u8986\u76d6\u7387\uff0c\u5c24\u5176\u5728\u591a\u6280\u80fd\u67e5\u8be2\u4e0a\u6536\u76ca\u66f4\u5927\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u8def\u7531", "\u4fe1\u606f\u68c0\u7d22", "\u91cd\u6392\u5e8f"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.05824", "published_at": "2026-09-05", "score": 0.381, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05824.png", "title": "Beyond Top-$k$ Skill Retrieval: Diversity-Aware Skill Routing for LLM Agents", "tldr": "\u7528\u591a\u6837\u6027\u91cd\u6392\u63d0\u5347LLM\u667a\u80fd\u4f53\u6280\u80fd\u8def\u7531", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Diverse Skill Routing\uff08DSR\uff09\uff0c\u5c06LLM\u667a\u80fd\u4f53\u7684\u6280\u80fd\u9009\u62e9\u4ece\u5355\u7eaf\u76f8\u5173\u6027\u6392\u5e8f\u6539\u4e3a\u517c\u987e\u76f8\u5173\u6027\u4e0e\u4e92\u8865\u6027\u7684\u96c6\u5408\u9009\u62e9\u3002\u5b83\u7528\u786e\u5b9aantal\u70b9\u8fc7\u7a0b\uff08DPP\uff09\u91cd\u6392\u6280\u80fd\uff0c\u51cf\u5c11\u4e0a\u4e0b\u6587\u4e2d\u529f\u80fd\u5197\u4f59\u7684\u6280\u80fd\u5360\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u667a\u80fd\u4f53\u7684\u6280\u80fd\u8def\u7531\u5efa\u6a21\u4e3a\u4e92\u8865\u96c6\u5408\u9009\u62e9\uff0c\u800c\u975e\u72ec\u7acb\u5019\u9009\u6392\u5e8f\uff0c\u6709\u52a9\u4e8e\u66f4\u9ad8\u6548\u5229\u7528\u6709\u9650\u4e0a\u4e0b\u6587\u9884\u7b97\uff0c\u5e76\u63d0\u5347\u590d\u6742\u4efb\u52a1\u7684\u5de5\u5177/\u6280\u80fd\u8c03\u7528\u8986\u76d6\u3002"}, {"abstract": "Before an LLM agent tackles tasks in a new environment, it can inspect available corpora and tools and construct reusable resources such as indices, scripts, or procedural guidance. Most automated adaptation methods, however, rely on task examples, trajectories, or evaluation feedback to decide what to build. Existing task-agnostic approaches avoid this supervision but commit in advance to a preparation strategy for a particular type of environment. We study a more open-ended setting: can an agent study an unfamiliar environment without a syllabus, i.e. before test time and without knowledge of the downstream task distribution, and choose how to prepare it? We formalize task-agnostic environment preprocessing, in which a studying system explores an environment under a budget and produces artifacts for a frozen solver. We compare unaided and archive-equipped meta-agents with fixed synthetic-practice and corpus-processing methods across six heterogeneous benchmarks. A meta-agent variant achieves the highest Avg@3 reward on five benchmarks, while fixed corpus processing remains best on the largest corpus benchmark. Larger study budgets do not reliably improve downstream reward. Nevertheless, studied artifacts reduce the test-time sampling needed to reach a given score, demonstrating how reusable preparation can shift computation from repeated test-time attempts to a pre-task study phase.", "arxiv_id": "2609.10824", "arxiv_url": "https://arxiv.org/abs/2609.10824", "authors": ["Vinay Samuel", "Varun Ursekar", "Vijay S. Kalmath", "Apaar Shanker", "Veronica Chatrath", "Yuan Xue"], "brief": "\u672c\u6587\u5f62\u5f0f\u5316\u4e86\u201c\u4efb\u52a1\u65e0\u5173\u73af\u5883\u9884\u5904\u7406\u201d\uff1aLLM \u667a\u80fd\u4f53\u5728\u4e0d\u77e5\u9053\u4e0b\u6e38\u4efb\u52a1\u5206\u5e03\u3001\u6ca1\u6709\u53cd\u9988\u7684\u60c5\u51b5\u4e0b\uff0c\u5148\u63a2\u7d22\u73af\u5883\u5e76\u751f\u6210\u7d22\u5f15\u3001\u811a\u672c\u3001\u6307\u5357\u7b49\u53ef\u590d\u7528\u4ea7\u7269\uff0c\u4f9b\u51bb\u7ed3\u6c42\u89e3\u5668\u4f7f\u7528\u3002\u4f5c\u8005\u5728\u516d\u4e2a\u5f02\u6784\u57fa\u51c6\u4e0a\u6bd4\u8f83\u4e86\u5143\u667a\u80fd\u4f53\u3001\u5408\u6210\u7ec3\u4e60\u3001\u8bed\u6599\u5904\u7406\u7b49\u9884\u4e60\u7b56\u7565\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.10824", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u65e0\u201c\u6559\u5b66\u5927\u7eb2\u201d\u7684\u9884\u4e60\u8bbe\u5b9a\uff1a\u4ec5\u7ed9\u5b9a\u73af\u5883\u3001\u5de5\u5177\u548c\u9884\u7b97\uff0c\u4e0d\u4f9d\u8d56\u4efb\u52a1\u6837\u4f8b\u3001\u8f68\u8ff9\u6216\u8bc4\u6d4b\u53cd\u9988\u6765\u51b3\u5b9a\u6784\u5efa\u4ec0\u4e48\u8d44\u6e90\u3002", "\u5e26\u6863\u6848\u80fd\u529b\u7684 meta-agent \u5728\u516d\u4e2a\u57fa\u51c6\u4e2d\u7684\u4e94\u4e2a\u4e0a\u53d6\u5f97\u6700\u9ad8 Avg@3 reward\uff0c\u4f46\u6700\u5927\u8bed\u6599\u5e93\u4efb\u52a1\u4e2d\u56fa\u5b9a\u8bed\u6599\u5904\u7406\u65b9\u6cd5\u4ecd\u66f4\u4f18\u3002", "\u66f4\u5927\u7684\u9884\u4e60\u9884\u7b97\u5e76\u4e0d\u7a33\u5b9a\u63d0\u5347\u6700\u7ec8\u5956\u52b1\uff0c\u4f46\u9884\u4e60\u4ea7\u7269\u80fd\u51cf\u5c11\u6d4b\u8bd5\u65f6\u8fbe\u5230\u540c\u7b49\u5206\u6570\u6240\u9700\u7684\u91c7\u6837\u6b21\u6570\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u73af\u5883\u9884\u5904\u7406", "\u5143\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": "Scale AI", "pdf_url": "https://arxiv.org/pdf/2609.10824", "published_at": "2026-09-09", "score": 0.374, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.10824.png", "title": "Studying Without a Syllabus: Task-Agnostic Environment Preprocessing", "tldr": "\u8ba9\u667a\u80fd\u4f53\u65e0\u4efb\u52a1\u6837\u4f8b\u4e5f\u80fd\u9884\u4e60\u65b0\u73af\u5883", "upvotes": 4, "what_it_is": "\u672c\u6587\u5f62\u5f0f\u5316\u4e86\u201c\u4efb\u52a1\u65e0\u5173\u73af\u5883\u9884\u5904\u7406\u201d\uff1aLLM \u667a\u80fd\u4f53\u5728\u4e0d\u77e5\u9053\u4e0b\u6e38\u4efb\u52a1\u5206\u5e03\u3001\u6ca1\u6709\u53cd\u9988\u7684\u60c5\u51b5\u4e0b\uff0c\u5148\u63a2\u7d22\u73af\u5883\u5e76\u751f\u6210\u7d22\u5f15\u3001\u811a\u672c\u3001\u6307\u5357\u7b49\u53ef\u590d\u7528\u4ea7\u7269\uff0c\u4f9b\u51bb\u7ed3\u6c42\u89e3\u5668\u4f7f\u7528\u3002\u4f5c\u8005\u5728\u516d\u4e2a\u5f02\u6784\u57fa\u51c6\u4e0a\u6bd4\u8f83\u4e86\u5143\u667a\u80fd\u4f53\u3001\u5408\u6210\u7ec3\u4e60\u3001\u8bed\u6599\u5904\u7406\u7b49\u9884\u4e60\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a LLM agent \u7684\u9002\u5e94\u80fd\u529b\u4ece\u201c\u89c1\u9898\u540e\u53cd\u590d\u5c1d\u8bd5\u201d\u524d\u79fb\u5230\u201c\u4efb\u52a1\u524d\u81ea\u4e3b\u7814\u7a76\u73af\u5883\u201d\uff0c\u5f3a\u8c03\u53ef\u590d\u7528\u8d44\u6e90\u6784\u5efa\uff0c\u5bf9\u964d\u4f4e\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u6210\u672c\u548c\u63d0\u5347\u5f00\u653e\u73af\u5883\u4e2d\u7684\u667a\u80fd\u4f53\u6cdb\u5316\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We describe our entry to the EgoLongQA track of the Wearable-AI Challenge in ECCV 2026, which placed first in the \u003c=2B parameter division with 0.8279 on the held-out test set. Our system is a single 2B vision-language model that answers multiple-choice questions about ten-minute egocentric videos in one greedy forward pass; It is obtained by distilling the junior perception module of a tool-using agentic pipeline, not the agent itself into a small student, using teacher traces filtered to those that answered correctly. it reaches 89% of the accuracy of the large agentic pipeline using 1.1% of its parameters. This raises a 27.1% base model to 81.4% on our held-out questions. The 2B backbone has 2.2132B parameters and therefore over the divisional limit, to make the entry admissable we prune the multilingual embedding table from 248,320 to 143,469 rows, reaching 1.9985B with provably identical logits on retained rows.", "arxiv_id": "2609.07154", "arxiv_url": "https://arxiv.org/abs/2609.07154", "authors": ["Logesh Kumar Umapathi"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u4e86 ECCV 2026 Wearable-AI Challenge EgoLongQA \u8d5b\u9053\u7684\u51a0\u519b\u7cfb\u7edf\uff1a\u4e00\u4e2a\u7ea62B\u53c2\u6570\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u53ef\u4e00\u6b21\u8d2a\u5a6a\u524d\u5411\u56de\u7b5410\u5206\u949f\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u591a\u9009\u9898\u3002\u5176\u6838\u5fc3\u505a\u6cd5\u662f\u4ece\u5de5\u5177\u4f7f\u7528\u578b\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf\u7684\u201c\u611f\u77e5\u6a21\u5757\u201d\u4e2d\u84b8\u998f\u77e5\u8bc6\uff0c\u800c\u975e\u84b8\u998f\u6574\u4e2a\u667a\u80fd\u4f53\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ambient-intelligence-hq/egolongqa-2b", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07154", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5728\u22642B\u53c2\u6570\u7ec4\u6d4b\u8bd5\u96c6\u4e0a\u53d6\u5f970.8279\u5206\uff0c\u6392\u540d\u7b2c\u4e00\uff1b\u8fbe\u5230\u5927\u578b\u667a\u80fd\u4f53\u6d41\u6c34\u7ebf89%\u7684\u51c6\u786e\u7387\uff0c\u4f46\u53c2\u6570\u91cf\u4ec5\u4e3a\u51761.1%\u3002", "\u4f7f\u7528\u56de\u7b54\u6b63\u786e\u7684\u6559\u5e08\u8f68\u8ff9\u8fdb\u884c\u8fc7\u6ee4\u84b8\u998f\uff0c\u5c06\u57fa\u7840\u6a21\u578b\u5728\u81ea\u5efa\u4fdd\u7559\u9898\u96c6\u
