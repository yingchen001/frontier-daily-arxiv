29\u4e2d\u7684\u5206\u6563\u6587\u672c\u4e0e\u56fe\u50cf\u53cd\u5e94\u77e5\u8bc6\u5927\u89c4\u6a21\u81ea\u52a8\u8f6c\u5316\u4e3a\u53ef\u68c0\u7d22\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u4f9b\u667a\u80fd\u4f53\u8c03\u7528\u7684\u7ed3\u6784\u5316\u8d44\u6e90\uff0c\u5177\u6709\u8f83\u5f3a\u6570\u636e\u57fa\u7840\u8bbe\u65bd\u4ef7\u503c\u3002"}, {"abstract": "Recursive Super-Resolution (SR) extends fixed-scale SR to extreme magnification by repeatedly feeding predictions back into the same model, analogous to zooming an image repeatedly. However, ground truth availability at every scale, especially at depth, remains challenging as the required source resolution grows geometrically, leaving deeper predictions unsupervised. We present OracleZoom, an on-policy distillation-inspired, reference-constrained framework that trains on its trajectory while carrying the last ground-truth evidence beyond the supervision boundary. Direct and cross-scale supervision constrain verifiable content, while a no-reference quality objective guides unresolved fine-scale detail. A KL-constrained pretrained latent prior limits quality-driven drift, while EMA consistency stabilizes the supervision boundary. Across seven datasets, OracleZoom achieves the state-of-the-art SR quality across zooming scales, averaging 0.713 CLIPIQA, with larger gains on deeper scales, while significantly reducing hallucinations. Code, data, and models are available at https://dipta007.github.io/OracleZoom/ .", "arxiv_id": "2609.06490", "arxiv_url": "https://arxiv.org/abs/2609.06490", "authors": ["Shubhashis Roy Dipta", "Sourajit Saha", "Shaswati Saha", "Nobin Sarwar"], "brief": "OracleZoom \u662f\u4e00\u79cd\u9762\u5411\u6781\u7aef\u653e\u5927\u7684\u9012\u5f52\u56fe\u50cf\u8d85\u5206\u8fa8\u7387\u8bad\u7ec3\u6846\u67b6\uff0c\u5728\u6a21\u578b\u81ea\u8eab\u9012\u5f52\u751f\u6210\u7684\u8f68\u8ff9\u4e0a\u8fdb\u884c on-policy \u81ea\u84b8\u998f\uff0c\u5e76\u7528\u6700\u540e\u53ef\u9a8c\u8bc1\u7684\u771f\u503c\u53c2\u8003\u7ea6\u675f\u540e\u7eed\u5c3a\u5ea6\u3002\u5b83\u7ed3\u5408\u8de8\u5c3a\u5ea6\u76d1\u7763\u3001\u65e0\u53c2\u8003\u8d28\u91cf\u76ee\u6807\u3001\u9884\u8bad\u7ec3\u6f5c\u7a7a\u95f4\u5148\u9a8c\u548c EMA \u4e00\u81f4\u6027\u6765\u63d0\u5347\u6df1\u5c42\u653e\u5927\u8d28\u91cf\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/dipta007/OracleZoom", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.06490", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u9012\u5f52\u8d85\u5206\u5728\u6df1\u5c42\u5c3a\u5ea6\u7f3a\u5c11\u9010\u7ea7\u771f\u503c\u76d1\u7763\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u53c2\u8003\u7ea6\u675f\u7684 on-policy \u8bad\u7ec3\u8303\u5f0f\u3002", "\u7528\u76f4\u63a5\u76d1\u7763\u548c\u8de8\u5c3a\u5ea6\u76d1\u7763\u7ea6\u675f\u53ef\u9a8c\u8bc1\u5185\u5bb9\uff0c\u7528\u65e0\u53c2\u8003\u8d28\u91cf\u76ee\u6807\u5f15\u5bfc\u4e0d\u53ef\u9a8c\u8bc1\u7684\u7ec6\u7c92\u5ea6\u7ec6\u8282\u3002", "KL \u7ea6\u675f\u7684\u9884\u8bad\u7ec3\u6f5c\u7a7a\u95f4\u5148\u9a8c\u6291\u5236\u8d28\u91cf\u4f18\u5316\u5e26\u6765\u7684\u6f02\u79fb\uff0cEMA \u4e00\u81f4\u6027\u7a33\u5b9a\u76d1\u7763\u8fb9\u754c\uff1b\u5728\u4e03\u4e2a\u6570\u636e\u96c6\u4e0a\u8fbe\u5230\u5e73\u5747 0.713 CLIPIQA\uff0c\u5e76\u5728\u6df1\u5c42\u5c3a\u5ea6\u663e\u8457\u51cf\u5c11\u5e7b\u89c9\u3002"], "keywords": ["\u8d85\u5206\u8fa8\u7387", "\u81ea\u84b8\u998f", "\u56fe\u50cf\u751f\u6210", "\u89c6\u89c9\u8d28\u91cf\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06490v1", "published_at": "2026-09-06", "score": 0.242, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06490.png", "title": "OracleZoom: On-Policy Self-Distillation Inspired Reference-Constrained Recursive Image Super Resolution", "tldr": "\u81ea\u84b8\u998f\u9012\u5f52\u8d85\u5206\u8fa8\u7387\u51cf\u5c11\u6df1\u5c42\u5e7b\u89c9", "upvotes": 6, "what_it_is": "OracleZoom \u662f\u4e00\u79cd\u9762\u5411\u6781\u7aef\u653e\u5927\u7684\u9012\u5f52\u56fe\u50cf\u8d85\u5206\u8fa8\u7387\u8bad\u7ec3\u6846\u67b6\uff0c\u5728\u6a21\u578b\u81ea\u8eab\u9012\u5f52\u751f\u6210\u7684\u8f68\u8ff9\u4e0a\u8fdb\u884c on-policy \u81ea\u84b8\u998f\uff0c\u5e76\u7528\u6700\u540e\u53ef\u9a8c\u8bc1\u7684\u771f\u503c\u53c2\u8003\u7ea6\u675f\u540e\u7eed\u5c3a\u5ea6\u3002\u5b83\u7ed3\u5408\u8de8\u5c3a\u5ea6\u76d1\u7763\u3001\u65e0\u53c2\u8003\u8d28\u91cf\u76ee\u6807\u3001\u9884\u8bad\u7ec3\u6f5c\u7a7a\u95f4\u5148\u9a8c\u548c EMA \u4e00\u81f4\u6027\u6765\u63d0\u5347\u6df1\u5c42\u653e\u5927\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u9012\u5f52\u8d85\u5206\u8fa8\u7387\u4e2d\u6700\u68d8\u624b\u7684\u6df1\u5c42\u65e0\u76d1\u7763\u4e0e\u5e7b\u89c9\u95ee\u9898\uff0c\u628a\u81ea\u84b8\u998f\u3001\u53c2\u8003\u7ea6\u675f\u548c\u5148\u9a8c\u6b63\u5219\u7ed3\u5408\u8d77\u6765\uff0c\u4f7f\u6781\u7aef\u653e\u5927\u66f4\u7a33\u5b9a\u3001\u66f4\u53ef\u4fe1\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u56fe\u50cf\u589e\u5f3a\u4e0e\u89c6\u89c9\u751f\u6210\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce DF26, a novel benchmark for detecting AI-generated videos containing fully synthetic clips produced by recent text-to-video and image-to-video models. The videos capture single-person public-speaking scenarios, spanning direct-to-camera recordings, official statements, and studio interviews - 271 real and 2,420 synthetic videos generated by seven modern video models. The study on DF26 shows that human performance in detecting AI-generated videos, as well as state-of-the-art deepfake detectors, is close to random chance. Our results highlight the limitations of current evaluation protocols and motivate the need for benchmarks that explicitly measure robustness to modern generative model distribution shifts.", "arxiv_id": "2609.07369", "arxiv_url": "https://arxiv.org/abs/2609.07369", "authors": ["Severyn Shykula", "Andrii Yermakov", "Ivan Samarskyi", "Dmytro Mishkin", "Jan Cech", "Anastasiia Mishchuk"], "brief": "\u8bba\u6587\u63d0\u51fa DF26\uff0c\u4e00\u4e2a\u9762\u5411\u73b0\u4ee3\u6587\u751f\u89c6\u9891\u4e0e\u56fe\u751f\u89c6\u9891\u6a21\u578b\u7684 AI \u751f\u6210\u89c6\u9891\u68c0\u6d4b\u57fa\u51c6\u3002\u6570\u636e\u8986\u76d6\u5355\u4eba\u516c\u5f00\u8bb2\u8bdd\u573a\u666f\uff0c\u5305\u542b 271 \u4e2a\u771f\u5b9e\u89c6\u9891\u548c 2420 \u4e2a\u7531 7 \u4e2a\u5148\u8fdb\u89c6\u9891\u751f\u6210\u6a21\u578b\u5408\u6210\u7684\u89c6\u9891\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07369", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["DF26 \u805a\u7126\u76f4\u9762\u955c\u5934\u8bb2\u8bdd\u3001\u5b98\u65b9\u58f0\u660e\u3001\u6f14\u64ad\u5ba4\u8bbf\u8c08\u7b49\u9ad8\u73b0\u5b9e\u611f\u5355\u4eba\u516c\u5171\u53d1\u8a00\u573a\u666f", "\u4eba\u7c7b\u4e0e\u5f53\u524d\u6700\u5148\u8fdb deepfake \u68c0\u6d4b\u5668\u5728\u8be5\u57fa\u51c6\u4e0a\u7684\u8868\u73b0\u63a5\u8fd1\u968f\u673a\u731c\u6d4b", "\u7ed3\u679c\u63ed\u793a\u73b0\u6709\u68c0\u6d4b\u8bc4\u6d4b\u534f\u8bae\u96be\u4ee5\u5e94\u5bf9\u73b0\u4ee3\u751f\u6210\u6a21\u578b\u5e26\u6765\u7684\u5206\u5e03\u8fc1\u79fb"], "keywords": ["\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07369v1", "published_at": "2026-09-07", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.07369.png", "title": "DF26: We Cannot Tell Fake From Real Anymore", "tldr": "\u65b0\u57fa\u51c6\u663e\u793a\u771f\u5047AI\u89c6\u9891\u5df2\u96be\u5206\u8fa8", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa DF26\uff0c\u4e00\u4e2a\u9762\u5411\u73b0\u4ee3\u6587\u751f\u89c6\u9891\u4e0e\u56fe\u751f\u89c6\u9891\u6a21\u578b\u7684 AI \u751f\u6210\u89c6\u9891\u68c0\u6d4b\u57fa\u51c6\u3002\u6570\u636e\u8986\u76d6\u5355\u4eba\u516c\u5f00\u8bb2\u8bdd\u573a\u666f\uff0c\u5305\u542b 271 \u4e2a\u771f\u5b9e\u89c6\u9891\u548c 2420 \u4e2a\u7531 7 \u4e2a\u5148\u8fdb\u89c6\u9891\u751f\u6210\u6a21\u578b\u5408\u6210\u7684\u89c6\u9891\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u8868\u660e\u73b0\u4ee3\u89c6\u9891\u751f\u6210\u6a21\u578b\u5df2\u663e\u8457\u524a\u5f31\u4eba\u7c7b\u548c\u68c0\u6d4b\u5668\u533a\u5206\u771f\u5047\u7684\u80fd\u529b\uff0c\u4e3a deepfake \u68c0\u6d4b\u9886\u57df\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u73b0\u5b9e\u5a01\u80c1\u7684\u65b0\u8bc4\u6d4b\u6807\u51c6\uff0c\u4e5f\u51f8\u663e\u9c81\u68d2\u68c0\u6d4b\u65b9\u6cd5\u7684\u7d27\u8feb\u6027\u3002"}, {"abstract": "Large language models used for code editing can be trained and deployed in at least two output regimes: direct generation, where the model emits the entire modified file in one shot, and iterative diff-based generation (\"steps\"), where the model emits a sequence of localized search/replace edits applied one at a time until it signals completion or a step budget is exhausted. The diff-based regime is attractive because it mirrors how developers edit code and should require far fewer generated tokens per turn. We train two code models - a 100M-parameter model trained from scratch (Rainbow-Pony-100M) and a fine-tuned Qwen2.5-Coder-0.5B - in both regimes on a shared Flutter/Dart dataset, and evaluate all four resulting models on a held-out set of approx 1,790 tasks per model. Direct generation substantially outperforms diff-based generation on every metric we measure - compilation/static-analysis pass rate, bits-per-byte, character-level similarity to the reference, and blinded LLM-judge ratings of goal fulfillment, correctness, and code quality - and the gap persists after controlling for task difficulty via a matched-ID comparison and when restricting to code that compiles on both sides. We then identify a single, architecture-independent mechanism behind the conditions where diff-based generation does win: it is competitive on short, spatially localized edits, and its category-level wins concentrate in exactly the two task categories - refactoring and error-handling/edge-case fixes - with the lowest mean edit-step count in our dataset. We term this task locality and discuss its implications for when an edit-based training regime is and is not the right choice for a code-editing model.", "arxiv_id": "2609.05779", "arxiv_url": "https://arxiv.org/abs/2609.05779", "authors": ["Andrej Andrejev"], "brief": "\u672c\u6587\u6bd4\u8f83\u4ee3\u7801\u7f16\u8f91\u6a21\u578b\u7684\u4e24\u79cd\u8f93\u51fa\u8303\u5f0f\uff1a\u4e00\u6b21\u6027\u751f\u6210\u5b8c\u6574\u4fee\u6539\u6587\u4ef6\uff0c\u4ee5\u53ca\u9010\u6b65\u751f\u6210\u5c40\u90e8search/replace diff\u3002\u4f5c\u8005\u5728\u540c\u4e00Flutter/Dart\u6570\u636e\u96c6\u4e0a\u8bad\u7ec3100M\u81ea\u7814\u6a21\u578b\u548c\u5fae\u8c03Qwen2.5-Coder-0.5B\uff0c\u5e76\u7cfb\u7edf\u8bc4\u4f30\u56db\u4e2a\u6a21\u578b\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/bbidpa/rainbow-pony", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.05779", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u76f4\u63a5\u751f\u6210\u5728\u7f16\u8bd1/\u9759\u6001\u5206\u6790\u901a\u8fc7\u7387\u3001bits-per-byte\u3001\u5b57\u7b26\u7ea7\u76f8\u4f3c\u5ea6\u4ee5\u53caLLM\u76f2\u8bc4\u7684\u76ee\u6807\u5b8c\u6210\u5ea6\u3001\u6b63\u786e\u6027\u3001\u4ee3\u7801\u8d28\u91cf\u4e0a\u5168\u9762\u9886\u5148\u3002", "\u5dee\u8ddd\u5728\u63a7\u5236\u4efb\u52a1\u96be\u5ea6\u7684matched-ID\u6bd4\u8f83\u4e2d\u4f9d\u7136\u5b58\u5728\uff0c\u5e76\u4e14\u5728\u53cc\u65b9\u4ee3\u7801\u90fd\u53ef\u7f16\u8bd1\u7684\u5b50\u96c6\u4e0a\u4ecd\u4fdd\u6301\u3002", "diff\u65b9\u6848\u53ea\u5728\u77ed\u4e14\u proving with large language models are small collections drawn from competition math, such as the IMO and Putnam, that poorly represent field-specific applications. We introduce StochBench, a Lean 4 benchmark of 450 graduate stochastic-processes problems at varying abstraction levels, each paired with its natural-language source. Addressing a field underrepresented in Mathlib, it covers finite and countable Markov chains, renewal processes, random walks, martingales, stopping times, queues, Brownian motion, stochastic calculus, weak convergence, and Poisson and continuous-time Markov processes. Our Opus 4.8-based agent achieves a 34.9% proof rate (157/450) under a 15-minute per-problem limit. StochBench better represents domain-specific applied mathematics while remaining challenging for advanced provers.", "arxiv_id": "2609.09264", "arxiv_url": "https://arxiv.org/abs/2609.09264", "authors": ["Idan Davidovich", "Debargha Ganguly", "Vikash Singh", "Vipin Chaudhary"], "brief": "\u8bba\u6587\u63d0\u51fa StochBench\uff0c\u4e00\u4e2a\u5305\u542b450\u9053\u7814\u7a76\u751f\u7ea7\u968f\u673a\u8fc7\u7a0b\u95ee\u9898\u7684 Lean 4 \u57fa\u51c6\uff0c\u5e76\u914d\u6709\u81ea\u7136\u8bed\u8a00\u9898\u6e90\u3002\u5b83\u8986\u76d6\u9a6c\u5c14\u53ef\u592b\u94fe\u3001\u9785\u3001\u5e03\u6717\u8fd0\u52a8\u3001\u968f\u673a\u5fae\u79ef\u5206\u7b49\u5e94\u7528\u6570\u5b66\u4e3b\u9898\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5f62\u5f0f\u5316\u5b9a\u7406\u8bc1\u660e\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09264", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6570\u636e\u96c6\u5305\u542b450\u4e2a\u4e0d\u540c\u62bd\u8c61\u5c42\u7ea7\u7684\u968f\u673a\u8fc7\u7a0b\u95ee\u9898\uff0c\u5f25\u8865 Mathlib \u4e2d\u8be5\u9886\u57df\u8986\u76d6\u4e0d\u8db3", "\u8986\u76d6\u6709\u9650/\u53ef\u6570\u9a6c\u5c14\u53ef\u592b\u94fe\u3001\u66f4\u65b0\u8fc7\u7a0b\u3001\u968f\u673a\u6e38\u8d70\u3001\u505c\u65f6\u3001\u961f\u5217\u3001\u6cca\u677e\u8fc7\u7a0b\u3001\u8fde\u7eed\u65f6\u95f4\u9a6c\u5c14\u53ef\u592b\u8fc7\u7a0b\u7b49\u4e3b\u9898", "\u57fa\u4e8e Opus 4.8 \u7684\u8bc1\u660e\u667a\u80fd\u4f53\u5728\u6bcf\u989815\u5206\u949f\u9650\u5236\u4e0b\u5b8c\u6210157\u9898\uff0c\u8bc1\u660e\u7387\u4e3a34.9%"], "keywords": ["\u5f62\u5f0f\u5316\u8bc1\u660e", "\u968f\u673a\u8fc7\u7a0b", "Lean", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09264v1", "published_at": "2026-09-08", "score": 0.233, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09264.png", "title": "StochBench: A Domain-Specific Benchmark for Stochastic Processes in Lean", "tldr": "\u9762\u5411\u968f\u673a\u8fc7\u7a0b\u7684Lean\u5f62\u5f0f\u5316\u8bc1\u660e\u57fa\u51c6", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa StochBench\uff0c\u4e00\u4e2a\u5305\u542b450\u9053\u7814\u7a76\u751f\u7ea7\u968f\u673a\u8fc7\u7a0b\u95ee\u9898\u7684 Lean 4 \u57fa\u51c6\uff0c\u5e76\u914d\u6709\u81ea\u7136\u8bed\u8a00\u9898\u6e90\u3002\u5b83\u8986\u76d6\u9a6c\u5c14\u53ef\u592b\u94fe\u3001\u9785\u3001\u5e03\u6717\u8fd0\u52a8\u3001\u968f\u673a\u5fae\u79ef\u5206\u7b49\u5e94\u7528\u6570\u5b66\u4e3b\u9898\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5f62\u5f0f\u5316\u5b9a\u7406\u8bc1\u660e\u80fd\u529b\u3002", "why_notable": "\u76f8\u6bd4IMO\u3001Putnam\u7b49\u7ade\u8d5b\u6570\u5b66\u57fa\u51c6\uff0cStochBench\u66f4\u8d34\u8fd1\u9886\u57df\u5316\u5e94\u7528\u6570\u5b66\u573a\u666f\uff0c\u80fd\u66f4\u771f\u5b9e\u5730\u8861\u91cfLLM\u5728\u4e13\u4e1a\u5b9a\u7406\u8bc1\u660e\u4e2d\u7684\u80fd\u529b\u4e0e\u77ed\u677f\u3002"}, {"abstract": "AI-powered search products such as ChatGPT search, Google\u0027s AI Overviews, and Perplexity provide LLM-synthesized answers grounded in live web results. We developed OreoLook (formerly lixSearch), an open-source answer engine using automated browser agents and provider-routed LLM inference. Its local search, caching, session-management, and embedding stack runs on commodity CPU hardware; answer synthesis is performed by a remote inference provider. As usage grew, sessions lost context, equivalent queries triggered redundant work, and URLs were repeatedly embedded across sessions. We present a three-layer caching architecture: (1) a Session Context Window maintaining a rolling window of recent messages in Redis with automatic overflow to Huffman-compressed disk archives; (2) a Semantic Query Cache catches rephrasings via cosine similarity on embedding vectors, eliminating redundant LLM invocations; and (3) a URL Embedding Cache that deduplicates embedding computations across sessions. Deployed on a single 8-vCPU Intel Cascade Lake server (2 GHz, 32 GB RAM) running 30 Hypercorn worker processes across three containerized replicas, the evaluated system reported an 89.3% aggregate Redis keyspace hit rate with 0.1 ms read latency and just 1.38 MB of memory overhead. A background LRU eviction daemon migrates idle sessions from Redis to disk and re-hydrates them on demand, enabling conversations that can be resumed hours or days later under the configured retention policy.", "arxiv_id": "2609.05463", "arxiv_url": "https://arxiv.org/abs/2609.05463", "authors": ["Ayushman Bhattacharya", "Nihal Gazi"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u5f00\u6e90\u7b54\u6848\u5f15\u64ce OreoLook \u7684\u4e09\u5c42\u7f13\u5b58\u67b6\u6784\uff0c\u7528\u4e8e\u5728\u666e\u901a CPU \u670d\u52a1\u5668\u4e0a\u652f\u6491\u4f4e\u5ef6\u8fdf LLM \u7f51\u9875\u641c\u7d22\u3002\u7cfb\u7edf\u901a\u8fc7\u4f1a\u8bdd\u4e0a\u4e0b\u6587\u7f13\u5b58\u3001\u8bed\u4e49\u67e5\u8be2\u7f13\u5b58\u548c URL \u5d4c\u5165\u7f13\u5b58\uff0c\u51cf\u5c11\u91cd\u590d\u63a8\u7406\u3001\u91cd\u590d\u5d4c\u5165\u548c\u4f1a\u8bdd\u4e0a\u4e0b\u6587\u4e22\u5931\u3002", "categories": ["cs.DC", "cs.PF"], "github_repo": "https://github.com/pollinations/search.elixpo", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2609.05463", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["Session Context Window \u5c06\u8fd1\u671f\u5bf9\u8bdd\u4fdd\u5b58\u5728 Redis \u4e2d\uff0c\u6ea2\u51fa\u5185\u5bb9\u81ea\u52a8\u8fc1\u79fb\u5230 Huffman \u538b\u7f29\u78c1\u76d8\u5f52\u6863\uff0c\u5e76\u53ef\u6309\u9700\u6062\u590d\u3002", "Semantic Query Cache \u57fa\u4e8e\u5d4c\u5165\u5411\u91cf\u4f59\u5f26\u76f8\u4f3c\u5ea6\u8bc6\u522b\u6539\u5199\u67e5\u8be2\uff0c\u907f\u514d\u7b49\u4ef7\u95ee\u9898\u91cd\u590d\u8c03\u7528\u8fdc\u7a0b LLM\u3002", "URL Embedding Cache \u8de8\u4f1a\u8bdd\u590d\u7528\u7f51\u9875 URL \u7684\u5d4c\u5165\u7ed3\u679c\uff0c\u5728\u5355\u53f0 8-vCPU \u670d\u52a1\u5668\u4e0a\u5b9e\u73b0 89.3% Redis \u547d\u4e2d\u7387\u30010.1 ms \u8bfb\u53d6\u5ef6\u8fdf\u548c 1.38 MB \u5185\u5b58\u5f00\u9500\u3002"], "keywords": ["LLM\u641c\u7d22", "\u7f13\u5b58\u7cfb\u7edf", "\u5411\u91cf\u68c0\u7d22", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "Pollinations", "pdf_url": "https://arxiv.org/pdf/2609.05463v1", "published_at": "2026-08-12", "score": 0.231, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.05463.png", "title": "A Three-Layer Caching Architecture for Low-Latency LLM Web Search on Commodity CPU Hardware", "tldr": "\u4e09\u5c42\u7f13\u5b58\u964d\u4f4eLLM\u7f51\u9875\u641c\u7d22\u5ef6\u8fdf\u4e0e\u5197\u4f59\u8ba1\u7b97", "upvotes": 5, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd\u5f00\u6e90\u7b54\u6848\u5f15\u64ce OreoLook \u7684\u4e09\u5c42\u7f13\u5b58\u67b6\u6784\uff0c\u7528\u4e8e\u5728\u666e\u901a CPU \u670d\u52a1\u5668\u4e0a\u652f\u6491\u4f4e\u5ef6\u8fdf LLM \u7f51\u9875\u641c\u7d22\u3002\u7cfb\u7edf\u901a\u8fc7\u4f1a\u8bdd\u4e0a\u4e0b\u6587\u7f13\u5b58\u3001\u8bed\u4e49\u67e5\u8be2\u7f13\u5b58\u548c URL \u5d4c\u5165\u7f13\u5b58\uff0c\u51cf\u5c11\u91cd\u590d\u63a8\u7406\u3001\u91cd\u590d\u5d4c\u5165\u548c\u4f1a\u8bdd\u4e0a\u4e0b\u6587\u4e22\u5931\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126 LLM \u641c\u7d22\u7cfb\u7edf\u7684\u5de5\u7a0b\u74f6\u9888\uff0c\u5c55\u793a\u4e86\u5728\u5ec9\u4ef7 CPU \u786c\u4ef6\u4e0a\u901a\u8fc7\u591a\u5c42\u7f13\u5b58\u663e\u8457\u964d\u4f4e\u5ef6\u8fdf\u548c\u5197\u4f59\u6210\u672c\u7684\u53ef\u884c\u65b9\u6848\uff0c\u5bf9\u5f00\u6e90\u641c\u7d22\u5f15\u64ce\u3001RAG \u7cfb\u7edf\u548c\u8f7b\u91cf\u5316\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Chemistry, Manufacturing and Controls (CMC) process development generates an enormous body of technical information across a multi-stage, knowledge-intensive continuum from drug discovery to commercial manufacturing. This knowledge is traditionally fragmented across functions and heterogeneous formats, causing traceability gaps and significant knowledge-management costs during technology transfer and regulatory filing. We present a modular agentic-AI platform that converts a heterogeneous corpus of process-development documents into a queryable, dual-layer knowledge graph. A base knowledge layer builds a lexical graph with a Document-Section-Chunk hierarchy through lossless ingestion of digital, scanned, handwritten, and multilingual documents, while an intelligence layer extracts ontology-aligned entities and bridges cross-document concepts through a provenance-anchored domain graph. LLM agents operate across both layers, selecting the retrieval path best suited to each question. We evaluate the lexical layer with a novel three-tier protocol measuring the deployment-fidelity of a retrieval-augmented generation (RAG) system on proprietary data, demonstrated on 505 questions curated from 38 development reports of a Sanofi small-molecule program. Tier-1 multiple-choice accuracy of 95% signals strong platform reliability; the stricter Tier-2 LLM-judge pass rate of 85%, which degrades on comparative and corpus-wide questions, reveals a failure taxonomy that Tier-1 accuracy alone fails to capture. A router agent selects between layers according to question type. We anticipate this protocol will enable future designers of agentic platforms to assess their systems against nonpublic databases, and that graph-based architectures will see broader adoption in pharma as a means of transforming fragmented document repositories into structured process intelligence.", "arxiv_id": "2609.11493", "arxiv_url": "https://arxiv.org/abs/2609.11493", "authors": ["Reza Amirmoshiri", "Faryad Sahneh", "Yasser Jangjou"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u836f\u7269 CMC \u5de5\u827a\u5f00\u53d1\u7684\u6a21\u5757\u5316\u667a\u80fd\u4f53 AI \u5e73\u53f0\uff0c\u5c06\u5f02\u6784\u5de5\u827a\u6587\u6863\u8f6c\u5316\u4e3a\u53ef\u67e5\u8be2\u7684\u53cc\u5c42\u77e5\u8bc6\u56fe\u8c31\uff1a\u5e95\u5c42\u4fdd\u7559\u6587\u6863\u7ed3\u6784\u4e0e\u6587\u672c\u5c42\u7ea7\uff0c\u4e0a\u5c42\u62bd\u53d6\u672c\u4f53\u5bf9\u9f50\u5b9e\u4f53\u5e76\u5efa\u7acb\u8de8\u6587\u6863\u9886\u57df\u5173\u7cfb\u3002\u7cfb\u7edf\u5728\u8d5b\u8bfa\u83f2\u5c0f\u5206\u5b50\u9879\u76ee\u7684 38 \u4efd\u62a5\u544a\u3001505 \u4e2a\u95ee\u9898\u4e0a\u8bc4\u4f30\uff0c\u9009\u62e9\u9898\u51c6\u786e\u7387\u8fbe 95%\uff0c\u66f4\u4e25\u683c\u7684 LLM \u88c1\u5224\u901a\u8fc7\u7387\u4e3a 85%\uff0c\u5e76\u63ed\u793a\u4e86\u590d\u6742\u6bd4\u8f83\u548c\u5168\u8bed\u6599\u95ee\u9898\u4e0a\u7684\u5931\u8d25\u6a21\u5f0f\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11493", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u56fe\u8c31", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u533b\u836f\u5236\u9020"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11493v1", "published_at": "2026-09-10", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From Document Silos to Process Intelligence: A Multi-Layer Knowledge Graph for CMC Process Development", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u836f\u7269 CMC \u5de5\u827a\u5f00\u53d1\u7684\u6a21\u5757\u5316\u667a\u80fd\u4f53 AI \u5e73\u53f0\uff0c\u5c06\u5f02\u6784\u5de5\u827a\u6587\u6863\u8f6c\u5316\u4e3a\u53ef\u67e5\u8be2\u7684\u53cc\u5c42\u77e5\u8bc6\u56fe\u8c31\uff1a\u5e95\u5c42\u4fdd\u7559\u6587\u6863\u7ed3\u6784\u4e0e\u6587\u672c\u5c42\u7ea7\uff0c\u4e0a\u5c42\u62bd\u53d6\u672c\u4f53\u5bf9\u9f50\u5b9e\u4f53\u5e76\u5efa\u7acb\u8de8\u6587\u6863\u9886\u57df\u5173\u7cfb\u3002\u7cfb\u7edf\u5728\u8d5b\u8bfa\u83f2\u5c0f\u5206\u5b50\u9879\u76ee\u7684 38 \u4efd\u62a5\u544a\u3001505 \u4e2a\u95ee\u9898\u4e0a\u8bc4\u4f30\uff0c\u9009\u62e9\u9898\u51c6\u786e\u7387\u8fbe 95%\uff0c\u66f4\u4e25\u683c\u7684 LLM \u88c1\u5224\u901a\u8fc7\u7387\u4e3a 85%\uff0c\u5e76\u63ed\u793a\u4e86\u590d\u6742\u6bd4\u8f83\u548c\u5168\u8bed\u6599\u95ee\u9898\u4e0a\u7684\u5931\u8d25\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Unraveling reaction mechanisms is central to modern chemistry, yet automating these investigations remains challenging because computational workflows still rely heavily on expert intervention. Here we introduce ARCHE, an autonomous agentic system that integrates a general-purpose reasoning model, a domain-specialized computational chemistry model, and a structured tool registry to transform mechanistic inquiry into a scalable, self-validating process. ARCHE interprets scientific questions, generates and prioritizes mechanistic hypotheses, orchestrates computational workflows, and iteratively refines conclusions based on computed evidence within a closed loop. We validate its capabilities across three increasingly demanding scenarios: reconstructing stereocontrolling transition states and validating the corresponding reaction mechanism in a previously reported asymmetric catalytic reaction; proposing and validating a plausible radical pathway through iterative hypothesis refinement for a recently discovered but unpublished $\u03b1$-iodoboronate C-I cleavage reaction; and identifying a chemically interpretable descriptor that governs selectivity in nickel-catalysed migratory cross-coupling reactions. By coupling agentic reasoning with rigorous computational validation, ARCHE advances autonomous mechanistic discovery and establishes a foundation for broader machine-assisted chemical research. The code for ARCHE is publicly available at https://github.com/JetAstra/Arche-Harness.", "arxiv_id": "2609.11147", "arxiv_url": "https://arxiv.org/abs/2609.11147", "authors": ["Dong Li", "Sixuan Mi", "Zihao Ye", "Huan Xiong", "Tao XU", "Tong Zhu", "Aijia Zhang", "Junqi Gao", "Kaiyan Zhang", "Shijie Wang", "Bowen Zhou", "Yuqiang Li", "Biqing Qi"], "brief": "\u8bba\u6587\u63d0\u51fa ARCHE\uff0c\u4e00\u4e2a\u9762\u5411\u5316\u5b66\u53cd\u5e94\u673a\u7406\u53d1\u73b0\u7684\u81ea\u4e3b\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7ed3\u5408\u901a\u7528\u63a8\u7406\u6a21\u578b\u3001\u8ba1\u7b97\u5316\u5b66\u4e13\u7528\u6a21\u578b\u548c\u5de5\u5177\u6ce8\u518c\u8868\uff0c\u80fd\u81ea\u52a8\u63d0\u51fa\u5047\u8bbe\u3001\u8c03\u5ea6\u8ba1\u7b97\u5e76\u57fa\u4e8e\u8bc1\u636e\u8fed\u4ee3\u9a8c\u8bc1\u3002\u5b83\u5728\u4e0d\u5bf9\u79f0\u50ac\u5316\u3001\u81ea\u7531\u57fa\u53cd\u5e94\u8def\u5f84\u548c\u954d\u50ac\u5316\u9009\u62e9\u6027\u63cf\u8ff0\u7b26\u53d1\u73b0\u7b49\u6848\u4f8b\u4e2d\u5c55\u793a\u4e86\u8f83\u5f3a\u7684\u81ea\u4e3b\u673a\u7406\u63a8\u65ad\u4e0e\u9a8c\u8bc1\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11147", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5316\u5b66\u53d1\u73b0", "\u79d1\u5b66\u8ba1\u7b97", "\u81ea\u52a8\u5316\u5de5\u4f5c\u6d41"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11147v1", "published_at": "2026-09-10", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Autonomous Chemical Mechanistic Discovery through Agentic Reasoning and Validation", "tldr": "\u8bba\u6587\u63d0\u51fa ARCHE\uff0c\u4e00\u4e2a\u9762\u5411\u5316\u5b66\u53cd\u5e94\u673a\u7406\u53d1\u73b0\u7684\u81ea\u4e3b\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7ed3\u5408\u901a\u7528\u63a8\u7406\u6a21\u578b\u3001\u8ba1\u7b97\u5316\u5b66\u4e13\u7528\u6a21\u578b\u548c\u5de5\u5177\u6ce8\u518c\u8868\uff0c\u80fd\u81ea\u52a8\u63d0\u51fa\u5047\u8bbe\u3001\u8c03\u5ea6\u8ba1\u7b97\u5e76\u57fa\u4e8e\u8bc1\u636e\u8fed\u4ee3\u9a8c\u8bc1\u3002\u5b83\u5728\u4e0d\u5bf9\u79f0\u50ac\u5316\u3001\u81ea\u7531\u57fa\u53cd\u5e94\u8def\u5f84\u548c\u954d\u50ac\u5316\u9009\u62e9\u6027\u63cf\u8ff0\u7b26\u53d1\u73b0\u7b49\u6848\u4f8b\u4e2d\u5c55\u793a\u4e86\u8f83\u5f3a\u7684\u81ea\u4e3b\u673a\u7406\u63a8\u65ad\u4e0e\u9a8c\u8bc1\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Invasive coronary angiography (CAG) is the gold standard for diagnosing coronary artery disease, but interpretation varies substantially among observers. Existing AI systems can improve consistency but lack auditable decision processes and are limited in comprehensive open-ended assessment, undermining clinician trust and clinical adoption readiness. We developed CARDEA, a unified large vision-language model that serves as the inference core of a CAG pipeline. It was trained solely on public datasets and closed-ended tasks in three stages: visual feature alignment, a self-distilled Chain-of-Box (CoB) cold start, and reinforcement learning with verifiable rewards (RLVR) with a CoB reward encouraging bounding-box use in the reasoning trace. We assessed its two study-level diagnoses, dominance classification and complexity assessment, against a dedicated classifier and two interventional cardiologists. Report generation was excluded from training and evaluated zero-shot across stages on an external cohort using vessel-severity macro-$F_1$. CARDEA trailed the classifier on in-distribution dominance but drew level under domain shift (accuracy, 0.91 [95% confidence interval (CI), 0.86 to 0.95]) and was comparable to the cardiologists on complexity assessment (accuracy, 0.90 [CI, 0.82 to 0.97]). Only RLVR improved zero-shot report generation, raising its vessel-severity macro-$F_1$ (0.686 [CI, 0.664 to 0.707]) above the untuned base model (0.513) and over twice the always-normal floor (0.312). CARDEA runs an end-to-end CAG pipeline from raw multi-view videos through keyframe selection to study-level diagnosis while exposing auditable spatial evidence behind its conclusions. RLVR on verifiable closed-ended tasks surfaced open-ended reporting ability that supervised imitation did not. Clinical use requires prospective validation against expert cardiologists.", "arxiv_id": "2609.06931", "arxiv_url": "https://arxiv.org/abs/2609.06931", "authors": ["Jia-Jen Lee", "Shih-Yen Hou", "Kee Koon Ng", "Wei-Chun Wang", "Shih-Sheng Chang"], "brief": "CARDEA \u662f\u4e00\u4e2a\u7528\u4e8e\u51a0\u8109\u9020\u5f71\uff08CAG\uff09\u89e3\u8bfb\u7684\u7edf\u4e00\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u53ef\u4ece\u539f\u59cb\u591a\u89c6\u89d2\u89c6\u9891\u8fdb\u884c\u5173\u952e\u5e27\u9009\u62e9\u3001\u8bca\u65ad\u5224\u65ad\uff0c\u5e76\u7ed9\u51fa\u57fa\u4e8e\u7a7a\u95f4\u8bc1\u636e\u7684\u53ef\u5ba1\u8ba1\u63a8\u7406\u3002\u6a21\u578b\u901a\u8fc7\u89c6\u89c9\u7279\u5f81\u5bf9\u9f50\u3001\u81ea\u84b8\u998f Chain-of-Box \u51b7\u542f\u52a8\u548c\u5e26\u53ef\u9a8c\u8bc1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u8bad\u7ec3\u5f97\u5230\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/benbayibaurba/cardea", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06931", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Chain-of-Box \u63a8\u7406\u673a\u5236\uff0c\u9f13\u52b1\u6a21\u578b\u5728\u63a8\u7406\u8f68\u8ff9\u4e2d\u4f7f\u7528 bounding box\uff0c\u5c06\u8bca\u65ad\u7ed3\u8bba\u4e0e\u53ef\u89c6\u5316\u7a7a\u95f4\u8bc1\u636e\u5173\u8054\u8d77\u6765\u3002", "\u5728\u4f18\u52bf\u578b\u5206\u7c7b\u7684\u5206\u5e03\u5916\u6d4b\u8bd5\u4e2d\u8fbe\u5230 0.91 \u51c6\u786e\u7387\uff0c\u5e76\u5728\u590d\u6742\u5ea6\u8bc4\u4f30\u4e0a\u63a5\u8fd1\u4ecb\u5165\u5fc3\u810f\u75c5\u4e13\u5bb6\u6c34\u5e73\uff0c\u51c6\u786e\u7387\u4e3a 0.90\u3002", "RLVR \u663e\u8457\u63d0\u5347\u96f6\u6837\u672c\u62a5\u544a\u751f\u6210\u80fd\u529b\uff0c\u8840\u7ba1-\u72ed\u7a84\u4e25\u91cd\u5ea6 macro-F1 \u4ece\u57fa\u5ea7\u6a21\u578b\u7684 0.513 \u63d0\u5347\u5230 0.686\u3002"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06931v1", "published_at": "2026-09-07", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06931.png", "title": "CARDEA: Auditable Reasoning Grounded in Spatial Evidence for End-to-End Coronary Angiography Interpretation", "tldr": "\u53ef\u5ba1\u8ba1\u51a0\u8109\u9020\u5f71\u5927\u6a21\u578b\u5b9e\u73b0\u7aef\u5230\u7aef\u8bca\u65ad", "upvotes": 1, "what_it_is": "CARDEA \u662f\u4e00\u4e2a\u7528\u4e8e\u51a0\u8109\u9020\u5f71\uff08CAG\uff09\u89e3\u8bfb\u7684\u7edf\u4e00\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u53ef\u4ece\u539f\u59cb\u591a\u89c6\u89d2\u89c6\u9891\u8fdb\u884c\u5173\u952e\u5e27\u9009\u62e9\u3001\u8bca\u65ad\u5224\u65ad\uff0c\u5e76\u7ed9\u51fa\u57fa\u4e8e\u7a7a\u95f4\u8bc1\u636e\u7684\u53ef\u5ba1\u8ba1\u63a8\u7406\u3002\u6a21\u578b\u901a\u8fc7\u89c6\u89c9\u7279\u5f81\u5bf9\u9f50\u3001\u81ea\u84b8\u998f Chain-of-Box \u51b7\u542f\u52a8\u548c\u5e26\u53ef\u9a8c\u8bc1\u5956\u52b1\u7684\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u8bad\u7ec3\u5f97\u5230\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5c06\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5f15\u5165\u9ad8\u98ce\u9669\u533b\u5b66\u5f71\u50cf\u8bca\u65ad\uff0c\u5e76\u5f3a\u8c03\u53ef\u5ba1\u8ba1\u63a8\u7406\u4e0e\u7a7a\u95f4\u8bc1\u636e\u7ed1\u5b9a\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u4e34\u5e8a\u53ef\u4fe1\u5ea6\uff1b\u540c\u65f6\u663e\u793a\u5728\u95ed\u5408\u4efb\u52a1\u4e0a\u8fdb\u884c\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff0c\u80fd\u591f\u6fc0\u53d1\u5f00\u653e\u5f0f\u62a5\u544a\u751f\u6210\u80fd\u529b\u3002"}, {"abstract": "Training strategy, namely whether to retrain from scratch or fine-tune from the previous checkpoint, is an overlooked decision variable in active learning. We show that this choice has exploitable structure: retraining is most useful in early rounds, when each batch can substantially reshape the labeled distribution, while fine-tuning becomes safer once the model trajectory stabilizes. We propose HybridAL, an adaptive training schedule that monitors an online stabilization signal and switches from retraining to fine-tuning after sustained stabilization. Two complementary signals, spectral exponent change $\u0394\u03b1$ (weight-based) and accuracy change $\u0394$Acc (validation-based), span different points on the time-calibration trade-off. Across three encoder backbones and six text-classification tasks (five seeds each), HybridAL keeps endpoint macro-F1 non-inferior to retraining and fine-tuning at a 0.010 margin, saves up to 49% of retraining time, and recovers a substantial fraction of retraining\u0027s calibration advantage as measured by negative log-likelihood (NLL). Compared with schedules that switch at a pre-committed round, HybridAL obtains lower NLL at moderate additional cost, showing that trajectory-dependent switching provides a stronger time-calibration trade-off than fixed early switching.", "arxiv_id": "2609.06806", "arxiv_url": "https://arxiv.org/abs/2609.06806", "authors": ["Nagham Omar", "Maya Rozenshtein", "Evgeny Mishlyakov", "Avigdor Gal"], "brief": "\u8bba\u6587\u6307\u51fa\u4e3b\u52a8\u5b66\u4e60\u4e2d\u201c\u4ece\u5934\u91cd\u8bad\u8fd8\u662f\u57fa\u4e8e\u4e0a\u4e00\u8f6e\u5fae\u8c03\u201d\u662f\u88ab\u5ffd\u89c6\u4f46\u91cd\u8981\u7684\u8bad\u7ec3\u7b56\u7565\u53d8\u91cf\u3002\u4f5c\u8005\u63d0\u51fa HybridAL\uff0c\u901a\u8fc7\u5728\u7ebf\u7a33\u5b9a\u5316\u4fe1\u53f7\u5224\u65ad\u6a21\u578b\u8f68\u8ff9\u662f\u5426\u7a33\u5b9a\uff0c\u5e76\u5728\u5408\u9002\u65f6\u673a\u4ece\u91cd\u8bad\u5207\u6362\u5230\u5fae\u8c03\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/naghamo/hybridAL", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06806", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u91cd\u8bad\u5728\u4e3b\u52a8\u5b66\u4e60\u65e9\u671f\u66f4\u6709\u4ef7\u503c\uff0c\u56e0\u65b0\u589e\u6807\u6ce8\u6279\u6b21\u4f1a\u663e\u8457\u6539\u53d8\u6570\u636e\u5206\u5e03\uff1b\u540e\u671f\u6a21\u578b\u8f68\u8ff9\u7a33\u5b9a\u540e\u5fae\u8c03\u66f4\u9ad8\u6548\u4e14\u98ce\u9669\u66f4\u4f4e", "\u63d0\u51fa\u4e24\u7c7b\u5207\u6362\u4fe1\u53f7\uff1a\u57fa\u4e8e\u6743\u91cd\u7684\u8c31\u6307\u6570\u53d8\u5316 \u0394\u03b1\uff0c\u4ee5\u53ca\u57fa\u4e8e\u9a8c\u8bc1\u96c6\u7684\u51c6\u786e\u7387\u53d8\u5316 \u0394Acc\uff0c\u5bf9\u5e94\u4e0d\u540c\u65f6\u95f4\u6210\u672c\u4e0e\u6821\u51c6\u6548\u679c\u6743\u8861", "\u57283\u79cd\u7f16\u7801\u5668\u9aa8\u5e72\u548c6\u4e2a\u6587\u672c\u5206\u7c7b\u4efb\u52a1\u4e0a\uff0cHybridAL\u5728macro-F1\u4e0d\u52a3\u4e8e\u91cd\u8bad/\u5fae\u8c03\u7684\u540c\u65f6\uff0c\u6700\u591a\u8282\u770149%\u91cd\u8bad\u65f6\u95f4\uff0c\u5e76\u6539\u5584NLL\u6821\u51c6\u8868\u73b0"], "keywords": ["\u4e3b\u52a8\u5b66\u4e60", "\u5fae\u8c03", "\u6a21\u578b\u6821\u51c6", "\u6587\u672c\u5206\u7c7b"], "num_comments": 2, "on_hf": true, "organization": "Technion Israel institute of technology", "pdf_url": "https://arxiv.org/pdf/2609.06806v1", "published_at": "2026-09-06", "score": 0.214, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06806.png", "title": "Train Smarter, Not Harder: Switching Signal-Guided Training in Active Learning", "tldr": "\u4e3b\u52a8\u5b66\u4e60\u4e2d\u81ea\u9002\u5e94\u5207\u6362\u91cd\u8bad\u4e0e\u5fae\u8c03", "upvotes": 8, "what_it_is": "\u8bba\u6587\u6307\u51fa\u4e3b\u52a8\u5b66\u4e60\u4e2d\u201c\u4ece\u5934\u91cd\u8bad\u8fd8\u662f\u57fa\u4e8e\u4e0a\u4e00\u8f6e\u5fae\u8c03\u201d\u662f\u88ab\u5ffd\u89c6\u4f46\u91cd\u8981\u7684\u8bad\u7ec3\u7b56\u7565\u53d8\u91cf\u3002\u4f5c\u8005\u63d0\u51fa HybridAL\uff0c\u901a\u8fc7\u5728\u7ebf\u7a33\u5b9a\u5316\u4fe1\u53f7\u5224\u65ad\u6a21\u578b\u8f68\u8ff9\u662f\u5426\u7a33\u5b9a\uff0c\u5e76\u5728\u5408\u9002\u65f6\u673a\u4ece\u91cd\u8bad\u5207\u6362\u5230\u5fae\u8c03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e3b\u52a8\u5b66\u4e60\u4e2d\u7684\u8bad\u7ec3\u65b9\u5f0f\u9009\u62e9\u4ece\u56fa\u5b9a\u7b56\u7565\u53d8\u4e3a\u8f68\u8ff9\u81ea\u9002\u5e94\u51b3\u7b56\uff0c\u5728\u4fdd\u6301\u6027\u80fd\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u8bad\u7ec3\u6210\u672c\uff0c\u5e76\u517c\u987e\u6a21\u578b\u6821\u51c6\uff0c\u5bf9\u5b9e\u9645\u4f4e\u6807\u6ce8\u573a\u666f\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) improves knowledge-intensive large language model (LLM) applications by conditioning generation on retrieved documents, but longer contexts increase latency, key-value (KV) cache memory, and token cost. Post-retrieval compression can reduce this cost, yet existing compressors often operate independently for each query, rely on auxiliary models or rewriting, and introduce online overhead that can offset the benefit of shorter prompts. We revisit RAG compression from a data-mining perspective by aggregating historical query--document--model interactions into reusable evidence views. We first show that modern compressors have unstable gains over simple truncation and can add substantial inference-time latency. We then propose Reusable Evidence View Aggregation (REVA), a framework that mines the target generator\u0027s historical attention traces into a document-keyed, budget-agnostic score store. REVA maps token-level attention to readable word units, aggregates importance across repeated document accesses, and renders budget-specific plain-text views that preserve document order and the standard RAG interface. Across four representative benchmarks and modern LLMs, REVA improves generation quality by 1.0--5.8 points over existing advances, while reducing compression overhead by a factor of 5.3 to 15.6, adding less than 40 ms of latency.", "arxiv_id": "2609.11209", "arxiv_url": "https://arxiv.org/abs/2609.11209", "authors": ["Tuan Nguyen", "Qiran Hu", "Banruo Liu", "Khoa D. Doan", "Kok-Seng Wong", "Fan Lai"], "brief": "\u672c\u6587\u63d0\u51fa REVA\uff0c\u4e00\u79cd\u9762\u5411 RAG \u670d\u52a1\u7684\u53ef\u590d\u7528\u8bc1\u636e\u89c6\u56fe\u805a\u5408\u6846\u67b6\u3002\u5b83\u4ece\u76ee\u6807\u751f\u6210\u6a21\u578b\u7684\u5386\u53f2\u6ce8\u610f\u529b\u8f68\u8ff9\u4e2d\u6316\u6398\u6587\u6863\u7ea7\u91cd\u8981\u6027\u5206\u6570\uff0c\u5e76\u6309\u9884\u7b97\u751f\u6210\u4fdd\u6301\u539f\u6587\u987a\u5e8f\u7684\u538b\u7f29\u89c6\u56fe\u3002", "categories": ["cs.LG", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11209", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u73b0\u6709\u540e\u68c0\u7d22\u538b\u7f29\u5668\u76f8\u8f83\u7b80\u5355\u622a\u65ad\u6536\u76ca\u4e0d\u7a33\u5b9a\uff0c\u4e14\u5e38\u5f15\u5165\u663e\u8457\u5728\u7ebf\u63a8\u7406\u5ef6\u8fdf", "REVA \u5c06 token \u7ea7\u6ce8\u610f\u529b\u6620\u5c04\u5230\u53ef\u8bfb\u8bcd\u5355\u5143\uff0c\u5e76\u8de8\u91cd\u590d\u6587\u6863\u8bbf\u95ee\u805a\u5408\u91cd\u8981\u6027\uff0c\u5f62\u6210\u6587\u6863\u952e\u63a7\u3001\u9884\u7b97\u65e0\u5173\u7684\u5206\u6570\u5b58\u50a8", "\u5728\u56db\u4e2a\u4ee3\u8868\u6027\u57fa\u51c6\u548c\u73b0\u4ee3 LLM \u4e0a\uff0cREVA \u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u63d0\u5347\u751f\u6210\u8d28\u91cf 1.0\u20135.8 \u5206\uff0c\u538b\u7f29\u5f00\u9500\u964d\u4f4e 5.3\u201315.6 \u500d\uff0c\u989d\u5916\u5ef6\u8fdf\u4f4e\u4e8e 40 \u6beb\u79d2"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u4e0a\u4e0b\u6587\u538b\u7f29", "\u6ce8\u610f\u529b\u673a\u5236", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11209v1", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "REVA: Reusable Evidence View Aggregation for Context-Efficient RAG Serving", "tldr": "\u590d\u7528\u5386\u53f2\u6ce8\u610f\u529b\u8bc1\u636e\uff0c\u9ad8\u6548\u538b\u7f29RAG\u4e0a\u4e0b\u6587", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa REVA\uff0c\u4e00\u79cd\u9762\u5411 RAG \u670d\u52a1\u7684\u53ef\u590d\u7528\u8bc1\u636e\u89c6\u56fe\u805a\u5408\u6846\u67b6\u3002\u5b83\u4ece\u76ee\u6807\u751f\u6210\u6a21\u578b\u7684\u5386\u53f2\u6ce8\u610f\u529b\u8f68\u8ff9\u4e2d\u6316\u6398\u6587\u6863\u7ea7\u91cd\u8981\u6027\u5206\u6570\uff0c\u5e76\u6309\u9884\u7b97\u751f\u6210\u4fdd\u6301\u539f\u6587\u987a\u5e8f\u7684\u538b\u7f29\u89c6\u56fe\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a RAG \u538b\u7f29\u4ece\u9010\u67e5\u8be2\u5728\u7ebf\u5904\u7406\u8f6c\u5411\u53ef\u590d\u7528\u7684\u6570\u636e\u6316\u6398\u5f0f\u9884\u805a\u5408\uff0c\u5728\u4e0d\u6539\u53d8\u6807\u51c6 RAG \u63a5\u53e3\u7684\u524d\u63d0\u4e0b\u540c\u65f6\u63d0\u5347\u8d28\u91cf\u4e0e\u670d\u52a1\u6548\u7387\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models learn similar behaviours, yet it remains unclear what structure they share or how to change one behaviour without disturbing others. The Fisher-Rao geometry of next-token probabilities connects these questions: behaviour determines this geometry up to output-preserving symmetries, whereas activation geometry depends on coordinates. Across transformer, state-space and recurrent models, output geometries agree more strongly than activation geometries, and shared geometry supports semantic-category transfer. Agreement with human word choices increases with predictive accuracy, scale and training, and improves further after model-only calibration. Token probabilities and read-out geometry jointly predict the spectrum and its effective dimension. Controlled language assignments show that geometry follows the language law across architectures. Pretraining corpus statistics predict held-out fact acquisition without recalibration, while randomised experiments show that deeper evidence substantially delays acquisition across every tested architecture and evidence construction. Finally, the geometry prescribes minimum-disturbance local interventions, predicts their relative cost, and supports reusable control: updates learned on donor prompts transfer to unseen prompts while better preserving behaviour on reference prompts than Euclidean control. The same geometric correction improves steering, editing, attribution, dictionary learning and fine-tuning.", "arxiv_id": "2609.11063", "arxiv_url": "https://arxiv.org/abs/2609.11063", "authors": ["Dario Picozzi"], "brief": "\u672c\u6587\u4ece\u4e0b\u4e00\u8bcd\u6982\u7387\u7684Fisher-Rao\u4fe1\u606f\u51e0\u4f55\u51fa\u53d1\uff0c\u7cfb\u7edf\u7814\u7a76\u4e0d\u540c\u67b6\u6784\u8bed\u8a00\u6a21\u578b\u5171\u4eab\u7684\u884c\u4e3a\u7ed3\u6784\u53ca\u5176\u53ef\u63a7\u6027\u3002\u4f5c\u8005\u53d1\u73b0\u8f93\u51fa\u51e0\u4f55\u6bd4\u6fc0\u6d3b\u51e0\u4f55\u66f4\u8de8\u6a21\u578b\u4e00\u81f4\uff0c\u5e76\u53ef\u7528\u4e8e\u8bed\u4e49\u8fc1\u79fb\u3001\u77e5\u8bc6\u83b7\u5f97\u9884\u6d4b\u548c\u4f4e\u6270\u52a8\u6a21\u578b\u5e72\u9884\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11063", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728Transformer\u3001\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u548c\u5faa\u73af\u6a21\u578b\u4e2d\uff0c\u8f93\u51fa\u6982\u7387\u51e0\u4f55\u7684\u4e00\u81f4\u6027\u663e\u8457\u5f3a\u4e8e\u6fc0\u6d3b\u7a7a\u95f4\u51e0\u4f55\u3002", "Fisher-Rao\u51e0\u4f55\u4e0e\u4eba\u7c7b\u8bcd\u9009\u62e9\u3001\u6a21\u578b\u89c4\u6a21\u3001\u8bad\u7ec3\u8fdb\u5ea6\u3001\u8bed\u6599\u7edf\u8ba1\u548c\u4e8b\u5b9e\u4e60\u5f97\u901f\u5ea6\u76f8\u5173\uff0c\u53ef\u9884\u6d4b\u6709\u6548\u7ef4\u5ea6\u4e0e\u77e5\u8bc6\u83b7\u5f97\u3002", "\u57fa\u4e8e\u8be5\u51e0\u4f55\u53ef\u8bbe\u8ba1\u6700\u5c0f\u6270\u52a8\u5c40\u90e8\u5e72\u9884\uff0c\u63d0\u5347steering\u3001\u7f16\u8f91\u3001\u5f52\u56e0\u3001\u5b57\u5178\u5b66\u4e60\u548c\u5fae\u8c03\u7684\u884c\u4e3a\u4fdd\u6301\u80fd\u529b\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u51e0\u4f55", "\u6a21\u578b\u53ef\u63a7", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11063v1", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The information geometry of large language models is shared, learned, and controllable", "tldr": "LLM\u5171\u4eab\u53ef\u63a7\u7684Fisher-Rao\u8f93\u51fa\u51e0\u4f55", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ece\u4e0b\u4e00\u8bcd\u6982\u7387\u7684Fisher-Rao\u4fe1\u606f\u51e0\u4f55\u51fa\u53d1\uff0c\u7cfb\u7edf\u7814\u7a76\u4e0d\u540c\u67b6\u6784\u8bed\u8a00\u6a21\u578b\u5171\u4eab\u7684\u884c\u4e3a\u7ed3\u6784\u53ca\u5176\u53ef\u63a7\u6027\u3002\u4f5c\u8005\u53d1\u73b0\u8f93\u51fa\u51e0\u4f55\u6bd4\u6fc0\u6d3b\u51e0\u4f55\u66f4\u8de8\u6a21\u578b\u4e00\u81f4\uff0c\u5e76\u53ef\u7528\u4e8e\u8bed\u4e49\u8fc1\u79fb\u3001\u77e5\u8bc6\u83b7\u5f97\u9884\u6d4b\u548c\u4f4e\u6270\u52a8\u6a21\u578b\u5e72\u9884\u3002", "why_notable": "\u8bba\u6587\u5c06LLM\u884c\u4e3a\u76f8\u4f3c\u6027\u3001\u77e5\u8bc6\u4e60\u5f97\u548c\u53ef\u63a7\u7f16\u8f91\u7edf\u4e00\u5230\u4fe1\u606f\u51e0\u4f55\u6846\u67b6\u4e0b\uff0c\u63d0\u4f9b\u4e86\u6bd4\u6b27\u6c0f\u6fc0\u6d3b\u7a7a\u95f4\u66f4\u7a33\u5065\u7684\u8de8\u67b6\u6784\u5206\u6790\u4e0e\u5e72\u9884\u5de5\u5177\uff0c\u5bf9\u6a21\u578b\u89e3\u91ca\u6027\u548c\u5b89\u5168\u53ef\u63a7\u5fae\u8c03\u5177\u6709\u8f83\u9ad8\u4ef7\u503c\u3002"}, {"abstract": "Large language models are often fine-tuned, shared, or downloaded from third parties, so a deployed model may carry a hidden backdoor that behaves normally on benign inputs but switches to attacker-controlled behavior when a secret trigger appears. While backdoors can be audited before deployment, runtime monitoring remains important for models that are frequently updated. The challenge is that LLM serving is latency-sensitive: existing inference-time detectors either rely on assumptions about the trigger form, which can fail on stealthy attacks, or require extra model computation, such as input perturbations or an additional generation pass. We introduce SpecGuard, an inference-time backdoor detector that repurposes speculative decoding at zero added model-computation cost. Speculative decoding speeds up inference by using a small draft model to propose tokens and a target model to verify them. We observe that this verification process already exposes a useful signal: when a backdoor is triggered, the target model shifts toward the attacker\u0027s behavior, while a clean draft model does not predict this shift, causing the draft-token acceptance rate to change. We formalize when this signal appears and show that an attacker who suppresses it must also weaken the backdoor. Across diverse backdoor types and model families, SpecGuard reliably detects triggered behavior, including stealthy cases where input-level filters are blind, while avoiding the extra generation cost of existing runtime detectors. Speculative decoding therefore doubles as a free, always-on signal for detecting backdoored LLM behavior.", "arxiv_id": "2609.11799", "arxiv_url": "https://arxiv.org/abs/2609.11799", "authors": ["Rui Wen", "Ahmed Salem", "Andrew Paverd", "Mark Russinovich", "Zheng Li"], "brief": "\u8bba\u6587\u63d0\u51fa SpecGuard\uff0c\u5c06\u63a8\u6d4b\u89e3\u7801\u4e2d\u7684\u8349\u7a3f\u6a21\u578b token \u63a5\u53d7\u7387\u4f5c\u4e3a\u8fd0\u884c\u65f6\u540e\u95e8\u68c0\u6d4b\u4fe1\u53f7\u3002\u540e\u95e8\u89e6\u53d1\u65f6\uff0c\u76ee\u6807\u6a21\u578b\u8f6c\u5411\u653b\u51fb\u8005\u884c\u4e3a\u800c\u5e72\u51c0\u8349\u7a3f\u6a21\u578b\u65e0\u6cd5\u9884\u6d4b\u8be5\u504f\u79fb\uff0c\u4ece\u800c\u5bfc\u81f4\u63a5\u53d7\u7387\u5f02\u5e38\u53d8\u5316\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11799", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u989d\u5916\u6a21\u578b\u8ba1\u7b97\uff1a\u590d\u7528\u63a8\u6d4b\u89e3\u7801\u7684\u9a8c\u8bc1\u8fc7\u7a0b\uff0c\u4e0d\u589e\u52a0\u989d\u5916\u751f\u6210\u8f6e\u6b21\u6216\u8f93\u5165\u6270\u52a8\u5f00\u9500", "\u53ef\u68c0\u6d4b\u9690\u853d\u89e6\u53d1\uff1a\u4e0d\u4f9d\u8d56\u89e6\u53d1\u5668\u5f62\u5f0f\u5047\u8bbe\uff0c\u80fd\u8986\u76d6\u8f93\u5165\u7ea7\u8fc7\u6ee4\u5668\u96be\u4ee5\u53d1\u73b0\u7684 stealthy backdoor", "\u7406\u8bba\u5206\u6790\u8868\u660e\uff0c\u653b\u51fb\u8005\u82e5\u538b\u5236\u63a5\u53d7\u7387\u4fe1\u53f7\uff0c\u901a\u5e38\u4f1a\u524a\u5f31\u540e\u95e8\u6548\u679c"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u540e\u95e8\u68c0\u6d4b", "\u63a8\u6d4b\u89e3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11799v1", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SpecGuard: Inference-Time Backdoor Detection For Free", "tldr": "\u7528\u63a8\u6d4b\u89e3\u7801\u514d\u8d39\u68c0\u6d4bLLM\u540e\u95e8\u89e6\u53d1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SpecGuard\uff0c\u5c06\u63a8\u6d4b\u89e3\u7801\u4e2d\u7684\u8349\u7a3f\u6a21\u578b token \u63a5\u53d7\u7387\u4f5c\u4e3a\u8fd0\u884c\u65f6\u540e\u95e8\u68c0\u6d4b\u4fe1\u53f7\u3002\u540e\u95e8\u89e6\u53d1\u65f6\uff0c\u76ee\u6807\u6a21\u578b\u8f6c\u5411\u653b\u51fb\u8005\u884c\u4e3a\u800c\u5e72\u51c0\u8349\u7a3f\u6a21\u578b\u65e0\u6cd5\u9884\u6d4b\u8be5\u504f\u79fb\uff0c\u4ece\u800c\u5bfc\u81f4\u63a5\u53d7\u7387\u5f02\u5e38\u53d8\u5316\u3002", "why_notable": "\u5b83\u628a\u539f\u672c\u7528\u4e8e\u52a0\u901f\u63a8\u7406\u7684\u63a8\u6d4b\u89e3\u7801\u53d8\u6210\u201c\u514d\u8d39\u201d\u7684\u5728\u7ebf\u5b89\u5168\u76d1\u63a7\u4fe1\u53f7\uff0c\u9002\u5408\u9891\u7e41\u66f4\u65b0\u3001\u7b2c\u4e09\u65b9\u5fae\u8c03\u6216\u4e0b\u8f7d\u7684 LLM \u90e8\u7f72\u573a\u666f\uff0c\u517c\u987e\u4f4e\u5ef6\u8fdf\u4e0e\u540e\u95e8\u68c0\u6d4b\u80fd\u529b\u3002"}, {"abstract": "While Multimodal Large Language Models (MLLMs) have achieved remarkable progress across diverse tasks, they suffer from hallucinations where generated outputs contradict or misrepresent input semantics. Existing research typically addresses hallucination detection within a single modality or task type, limiting generalizability. We introduce OmniHallu, a unified hallucination detection framework spanning both comprehension and generation tasks across image, video, and audio modalities. We contribute OmniHallu-Bench, a 10,000-sample benchmark with claim-level human annotations covering six cross-modal tasks: image-to-text (I2T), video-to-text (V2T), audio-to-text (A2T), text-to-image (T2I), text-to-video (T2V), and text-to-audio (T2A). Our multi-agent architecture decomposes model outputs into atomic claims, verifies them through modality-specific experts, and aggregates evidence via structured reasoning. We further propose a preference-optimized trainable verifier that approximates the multi-agent decision boundary, reducing expert calls by 66% with minimal performance loss. Extensive experiments reveal a consistent modality-dependent performance gradient and provide fine-grained insights into cross-modal hallucination patterns.", "arxiv_id": "2609.11244", "arxiv_url": "https://arxiv.org/abs/2609.11244", "authors": ["Jianjiang Yang", "Peihang Li", "Shanqing Xu", "Mengchen Qian", "Lu Zhang", "Meng Luo"], "brief": "\u8bba\u6587\u63d0\u51fa OmniHallu\uff0c\u4e00\u4e2a\u8986\u76d6\u56fe\u50cf\u3001\u89c6\u9891\u3001\u97f3\u9891\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u5e7b\u89c9\u68c0\u6d4b\u6846\u67b6\uff0c\u7edf\u4e00\u5904\u7406\u7406\u89e3\u7c7b\u4e0e\u751f\u6210\u7c7b\u8de8\u6a21\u6001\u4efb\u52a1\u3002\u4f5c\u8005\u540c\u65f6\u6784\u5efa\u4e86\u542b 1 \u4e07\u6837\u672c\u3001\u5e26 claim \u7ea7\u4eba\u5de5\u6807\u6ce8\u7684 OmniHallu-Bench\uff0c\u8986\u76d6 I2T\u3001V2T\u3001A2T\u3001T2I\u3001T2V\u3001T2A \u516d\u7c7b\u4efb\u52a1\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11244", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u6a21\u578b\u8f93\u51fa\u62c6\u89e3\u4e3a\u539f\u5b50\u5316 claim\uff0c\u518d\u7531\u56fe\u50cf\u3001\u89c6\u9891\u3001\u97f3\u9891\u7b49\u6a21\u6001\u4e13\u5bb6\u5206\u522b\u9a8c\u8bc1\uff0c\u5e76\u901a\u8fc7\u7ed3\u6784\u5316\u63a8\u7406\u805a\u5408\u8bc1\u636e\u3002", "\u63d0\u51fa\u504f\u597d\u4f18\u5316\u7684\u53ef\u8bad\u7ec3\u9a8c\u8bc1\u5668\uff0c\u7528\u4e8e\u8fd1\u4f3c\u591a\u667a\u80fd\u4f53\u5224\u51b3\u8fb9\u754c\uff0c\u5728\u6027\u80fd\u635f\u5931\u8f83\u5c0f\u7684\u60c5\u51b5\u4e0b\u51cf\u5c11 66% \u4e13\u5bb6\u8c03\u7528\u3002", "\u5b9e\u9a8c\u63ed\u793a\u4e86\u8de8\u6a21\u6001\u5e7b\u89c9\u68c0\u6d4b\u4e2d\u7a33\u5b9a\u7684\u6a21\u6001\u76f8\u5173\u6027\u80fd\u68af\u5ea6\uff0c\u5e76\u5206\u6790\u4e86\u4e0d\u540c\u4efb\u52a1\u4e0e\u6a21\u6001\u4e0b\u7684\u7ec6\u7c92\u5ea6\u5e7b\u89c9\u6a21\u5f0f\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u68c0\u6d4b", "\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11244v1", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "OmniHallu: Unified Hallucination Detection for Cross-Modal Comprehension and Generation in Multimodal Large Language Models", "tldr": "\u7edf\u4e00\u68c0\u6d4b\u591a\u6a21\u6001\u7406\u89e3\u4e0e\u751f\u6210\u5e7b\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OmniHallu\uff0c\u4e00\u4e2a\u8986\u76d6\u56fe\u50cf\u3001\u89c6\u9891\u3001\u97f3\u9891\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u5e7b\u89c9\u68c0\u6d4b\u6846\u67b6\uff0c\u7edf\u4e00\u5904\u7406\u7406\u89e3\u7c7b\u4e0e\u751f\u6210\u7c7b\u8de8\u6a21\u6001\u4efb\u52a1\u3002\u4f5c\u8005\u540c\u65f6\u6784\u5efa\u4e86\u542b 1 \u4e07\u6837\u672c\u3001\u5e26 claim \u7ea7\u4eba\u5de5\u6807\u6ce8\u7684 OmniHallu-Bench\uff0c\u8986\u76d6 I2T\u3001V2T\u3001A2T\u3001T2I\u3001T2V\u3001T2A \u516d\u7c7b\u4efb\u52a1\u3002", "why_notable": "\u4ee5\u5f80\u591a\u6a21\u6001\u5e7b\u89c9\u68c0\u6d4b\u591a\u5c40\u9650\u4e8e\u5355\u4e00\u6a21\u6001\u6216\u5355\u4e00\u4efb\u52a1\uff0cOmniHallu \u5c06\u7406\u89e3\u4e0e\u751f\u6210\u3001\u89c6\u89c9/\u89c6\u9891/\u97f3\u9891\u7edf\u4e00\u5230\u540c\u4e00\u68c0\u6d4b\u6846\u67b6\u548c\u57fa\u51c6\u4e2d\uff0c\u6709\u52a9\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u4e0e\u6539\u8fdb MLLM \u7684\u53ef\u9760\u6027\u3002"}, {"abstract": "Soft context compression condenses a context into a few memory tokens that a frozen LLM consumes in place of the raw text, but existing compressors fix the compression ratio at training and inference: each deployed ratio requires a separately trained model, and the chosen ratio is applied uniformly to all inputs, whose actual needs vary drastically. We propose FlexComp, a method-agnostic framework that decouples the ratio from both training and deployment: Matryoshka-style training samples the memory budget $K$ per instance, turning one model into an any-ratio compressor, and the budget is then chosen per input by: (1) confidence-based cascade routing or (2) a lightweight learned $K$ predictor. Across ICAE, 500xCompressor, and SAC on MRQA, a single FlexComp model matches separately trained fixed-ratio specialists with minimal degradation. Cascade routing preserves over 98% of the mildest ratio\u0027s accuracy at up to 266x average compression; the $K$ predictor, in a single compression-decoding pass, reaches 158-236x within 0.7 F1 of the mildest ratio. At serving-scale batch sizes, the $K$ predictor cuts context KV cache by 50% and improves decoding throughput by 47%.", "arxiv_id": "2609.11192", "arxiv_url": "https://arxiv.org/abs/2609.11192", "authors": ["Kaiyan Zhao", "Zhongtao Miao", "Akiko Aizawa", "Yoshimasa Tsuruoka"], "brief": "FlexComp \u662f\u4e00\u4e2a\u4e0e\u5177\u4f53\u538b\u7f29\u5668\u65e0\u5173\u7684\u8f6f\u4e0a\u4e0b\u6587\u538b\u7f29\u6846\u67b6\uff0c\u901a\u8fc7\u8bad\u7ec3\u65f6\u968f\u673a\u91c7\u6837\u8bb0\u5fc6 token \u9884\u7b97\uff0c\u4f7f\u5355\u4e2a\u6a21\u578b\u652f\u6301\u4efb\u610f\u538b\u7f29\u7387\u3002\u63a8\u7406\u65f6\u518d\u6309\u8f93\u5165\u96be\u5ea6\u52a8\u6001\u9009\u62e9\u538b\u7f29\u9884\u7b97\uff0c\u800c\u975e\u5bf9\u6240\u6709\u6837\u672c\u4f7f\u7528\u56fa\u5b9a\u6bd4\u4f8b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11192", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 Matryoshka \u5f0f\u8bad\u7ec3\uff0c\u6bcf\u4e2a\u6837\u672c\u968f\u673a\u91c7\u6837\u8bb0\u5fc6\u9884\u7b97 K\uff0c\u8ba9\u4e00\u4e2a\u538b\u7f29\u6a21\u578b\u8986\u76d6\u591a\u79cd\u538b\u7f29\u7387\u3002", "\u63d0\u51fa\u4e24\u79cd\u52a8\u6001\u9884\u7b97\u9009\u62e9\u65b9\u5f0f\uff1a\u57fa\u4e8e\u7f6e\u4fe1\u5ea6\u7684\u7ea7\u8054\u8def\u7531\uff0c\u4ee5\u53ca\u8f7b\u91cf\u7ea7\u5b66\u4e60\u578b K \u9884\u6d4b\u5668\u3002", "\u5728 ICAE\u3001500xCompressor\u3001SAC \u4e0e MRQA \u4e0a\uff0c\u5355\u4e2a FlexComp \u6a21\u578b\u63a5\u8fd1\u591a\u4e2a\u56fa\u5b9a\u538b\u7f29\u7387\u4e13\u5bb6\u6a21\u578b\u8868\u73b0\uff1bK \u9884\u6d4b\u5668\u53ef\u5728 158-236x \u538b\u7f29\u4e0b F1 \u4ec5\u4f4e\u4e8e\u6700\u6e29\u548c\u6bd4\u4f8b 0.7\uff0c\u5e76\u51cf\u5c11 50% KV cache\u3001\u63d0\u5347 47% \u89e3\u7801\u541e\u5410\u3002"], "keywords": ["\u4e0a\u4e0b\u6587\u538b\u7f29", "\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11192v1", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FlexComp: One Model for Every Ratio in Context Compression", "tldr": "\u4e00\u6a21\u591a\u7387\u7684\u81ea\u9002\u5e94\u4e0a\u4e0b\u6587\u538b\u7f29\u6846\u67b6", "upvotes": 0, "what_it_is": "FlexComp \u662f\u4e00\u4e2a\u4e0e\u5177\u4f53\u538b\u7f29\u5668\u65e0\u5173\u7684\u8f6f\u4e0a\u4e0b\u6587\u538b\u7f29\u6846\u67b6\uff0c\u901a\u8fc7\u8bad\u7ec3\u65f6\u968f\u673a\u91c7\u6837\u8bb0\u5fc6 token \u9884\u7b97\uff0c\u4f7f\u5355\u4e2a\u6a21\u578b\u652f\u6301\u4efb\u610f\u538b\u7f29\u7387\u3002\u63a8\u7406\u65f6\u518d\u6309\u8f93\u5165\u96be\u5ea6\u52a8\u6001\u9009\u62e9\u538b\u7f29\u9884\u7b97\uff0c\u800c\u975e\u5bf9\u6240\u6709\u6837\u672c\u4f7f\u7528\u56fa\u5b9a\u6bd4\u4f8b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86\u4e0a\u4e0b\u6587\u538b\u7f29\u4e2d\u201c\u6bcf\u4e2a\u538b\u7f29\u7387\u90fd\u8981\u5355\u72ec\u8bad\u7ec3\u6a21\u578b\u201d\u548c\u201c\u6240\u6709\u8f93\u5165\u7edf\u4e00\u538b\u7f29\u201d\u7684\u4f4e\u6548\u95ee\u9898\uff0c\u4f7f\u957f\u4e0a\u4e0b\u6587 LLM \u90e8\u7f72\u80fd\u6309\u6837\u672c\u81ea\u9002\u5e94\u8282\u7701\u8ba1\u7b97\u4e0e\u663e\u5b58\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autoregressive video world models enable interactive, long-horizon exploration, but flexible control remains challenging. Exploring a source video from new viewpoints requires the generated rollout to remain synchronised with the recorded event, place observed content in the requested view, plausibly complete newly exposed regions, and recover previously generated appearance on revisits. Existing methods typically address these requirements through task-specific modules or additional training. We present World in World, a training-free inference-time interface that converts heterogeneous control evidence into camera- and time-labelled clean visual states, which are read through the native self attention of a frozen causal video model. The evidence comprises source-video observations, target-view scene projections, geometry renderings that guide completion of newly exposed subject regions, and retrieved generated states beyond the rolling cache. Each evidence source carries token-level support and its own availability schedule. A correspondence router combines persistent point identities with geometry to establish token correspondences, guiding supported queries towards matching source-video tokens. Evidence-wise attention CFG (EWA) then independently regulates each auxiliary channel\u0027s additional contribution using attention responses from the same denoising forward pass. The shared interface supports camera-controlled rerendering, long-horizon revisiting, and human-motion transfer with the same frozen backbone. We evaluate World in World on camera-controlled video rerendering under diverse viewpoint changes, assessing perceptual quality, temporal consistency, and camera-following accuracy.", "arxiv_id": "2609.11548", "arxiv_url": "https://arxiv.org/abs/2609.11548", "authors": ["Chenxi Song", "Yanming Yang", "Chi Zhang"], "brief": "\u672c\u6587\u63d0\u51fa World in World\uff0c\u4e00\u79cd\u63a8\u7406\u65f6\u3001\u65e0\u9700\u8bad\u7ec3\u7684\u63a7\u5236\u63a5\u53e3\uff0c\u7528\u4e8e\u8ba9\u51bb\u7ed3\u7684\u81ea\u56de\u5f52\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5728\u65b0\u89c6\u89d2\u4e0b\u91cd\u6e32\u67d3\u548c\u957f\u7a0b\u63a2\u7d22\u6e90\u89c6\u9891\u3002\u5b83\u5c06\u591a\u6e90\u63a7\u5236\u8bc1\u636e\u8f6c\u6210\u5e26\u76f8\u673a\u4e0e\u65f6\u95f4\u6807\u8bb0\u7684\u89c6\u89c9\u72b6\u6001\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u539f\u751f\u81ea\u6ce8\u610f\u529b\u8bfb\u53d6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11548", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6574\u5408\u6e90\u89c6\u9891\u89c2\u6d4b\u3001\u76ee\u6807\u89c6\u89d2\u573a\u666f\u6295\u5f71\u3001\u51e0\u4f55\u6e32\u67d3\u8865\u5168\u63d0\u793a\u3001\u4ee5\u53ca\u6eda\u52a8\u7f13\u5b58\u5916\u7684\u5386\u53f2\u751f\u6210\u72b6\u6001\u7b49\u5f02\u6784\u8bc1\u636e\u3002", "\u63d0\u51fa correspondence router\uff0c\u7528\u6301\u4e45\u70b9\u8eab\u4efd\u4e0e\u51e0\u4f55\u5173\u7cfb\u5efa\u7acb token \u5bf9\u5e94\uff0c\u5f15\u5bfc\u67e5\u8be2\u5bf9\u9f50\u6e90\u89c6\u9891\u5185\u5bb9\u3002", "\u63d0\u51fa evidence-wise attention CFG\uff0c\u5229\u7528\u540c\u4e00\u6b21\u53bb\u566a\u524d\u5411\u4e2d\u7684\u6ce8\u610f\u529b\u54cd\u5e94\uff0c\u72ec\u7acb\u8c03\u8282\u4e0d\u540c\u8f85\u52a9\u8bc1\u636e\u901a\u9053\u7684\u8d21\u732e\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u53ef\u63a7\u751f\u6210", "\u591a\u89c6\u89d2\u91cd\u6e32\u67d3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11548v1", "published_at": "2026-09-10", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "World in World: Explore the World with World Models", "tldr": "\u514d\u8bad\u7ec3\u63a5\u53e3\u8ba9\u89c6\u9891\u4e16\u754c\u6a21\u578b\u53ef\u63a7\u63a2\u7d22", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa World in World\uff0c\u4e00\u79cd\u63a8\u7406\u65f6\u3001\u65e0\u9700\u8bad\u7ec3\u7684\u63a7\u5236\u63a5\u53e3\uff0c\u7528\u4e8e\u8ba9\u51bb\u7ed3\u7684\u81ea\u56de\u5f52\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5728\u65b0\u89c6\u89d2\u4e0b\u91cd\u6e32\u67d3\u548c\u957f\u7a0b\u63a2\u7d22\u6e90\u89c6\u9891\u3002\u5b83\u5c06\u591a\u6e90\u63a7\u5236\u8bc1\u636e\u8f6c\u6210\u5e26\u76f8\u673a\u4e0e\u65f6\u95f4\u6807\u8bb0\u7684\u89c6\u89c9\u72b6\u6001\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u539f\u751f\u81ea\u6ce8\u610f\u529b\u8bfb\u53d6\u3002", "why_notable": "\u5b83\u4e0d\u6539\u52a8\u3001\u4e0d\u91cd\u8bad\u5e95\u5c42\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u5c31\u80fd\u652f\u6301\u76f8\u673a\u63a7\u5236\u91cd\u6e32\u67d3\u3001\u957f\u7a0b\u56de\u8bbf\u548c\u4eba\u4f53\u8fd0\u52a8\u8fc1\u79fb\uff0c\u63d0\u5347\u4e86\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5728\u4ea4\u4e92\u5f0f\u53ef\u63a7\u63a2\u7d22\u4e2d\u7684\u5b9e\u7528\u6027\u4e0e\u6cdb\u5316\u6027\u3002"}, {"abstract": "Cooperative AI agents are evaluated against other AIs, yet human cooperation relies on implicit conventions---shared protocols for reading meaning beyond the literal message---which AI-AI benchmarks may not capture. We propose the \\emph{convention gap}, the difference between the failure probability predicted from the literal content of communication and the observed failure rate, as a metric of implicit communication. In the card game Hanabi, the finite deck and deterministic hint constraints make this posterior exactly computable. We replayed about 101,000 play actions from three public datasets of human-human (hanab.live), AI-AI (HOAD), and human-AI (HanabiData) games. The gap was +26.2 percentage points (pp) in human pairs, $-$0.7~pp in AI pairs, and +16.4~pp in human-AI pairs, and was concentrated on plays of cards that had received no hints (+46~pp in human pairs). Within human-AI play, the literal information available to humans was similar across the three AI partners (mean predicted failure 38--41\\%), but human failure rates ranged from 14.4\\% to 34.4\\% and the gap from +24.1 to +6.2~pp; the partner eliciting the largest gap produced the fewest human failures. Game score carried different information: it depended on each corpus\u0027s roster composition, whereas the gap separated human from AI play at the agent level. As a known-answer check, Off-Belief Learning agents, whose convention content is controlled by construction, gave a gap of +1.6~pp at the convention-free level, rising monotonically to +21.7~pp. These results suggest that convention compatibility, rather than AI-AI performance, may predict an AI\u0027s effectiveness with human partners.", "arxiv_id": "2609.11489", "arxiv_url": "https://arxiv.org/abs/2609.11489", "authors": ["Makoto Fukushima", "Hua-Dong Xiong", "Ehsan Moradi Pari"], "brief": "\u8bba\u6587\u63d0\u51fa convention gap \u6307\u6807\uff0c\u7528\u201c\u4ec5\u6309\u5b57\u9762\u4fe1\u606f\u9884\u6d4b\u7684\u5931\u8d25\u7387\u201d\u4e0e\u201c\u5b9e\u9645\u5931\u8d25\u7387\u201d\u7684\u5dee\u503c\u6765\u5ea6\u91cf\u5408\u4f5c\u4e2d\u7684\u9690\u5f0f\u60ef\u4f8b\u6c9f\u901a\u3002\u4f5c\u8005\u5728 Hanabi \u6e38\u620f\u4e2d\u7cbe\u786e\u8ba1\u7b97\u540e\u9a8c\uff0c\u5e76\u7528\u4eba-\u4eba\u3001AI-AI\u3001\u4eba-AI \u6570\u636e\u9a8c\u8bc1\u8be5\u6307\u6807\u3002", "categories": ["cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11489", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u56de\u653e\u7ea610.1\u4e07\u6b21\u51fa\u724c\u52a8\u4f5c\uff0c\u8986\u76d6 human-human\u3001AI-AI\u3001human-AI \u4e09\u7c7b\u516c\u5f00 Hanabi \u6570\u636e\u96c6\u3002", "\u4eba\u7c7b\u5bf9\u5c40\u7684\u60ef\u4f8b\u5dee\u8ddd\u4e3a +26.2 \u4e2a\u767e\u5206\u70b9\uff0cAI-AI \u4ec5\u4e3a -0.7 \u4e2a\u767e\u5206\u70b9\uff0c\u4eba-AI \u4e3a +16.4 \u4e2a\u767e\u5206\u70b9\uff0c\u5dee\u8ddd\u4e3b\u8981\u96c6\u4e2d\u5728\u65e0\u63d0\u793a\u724c\u7684\u51fa\u724c\u884c\u4e3a\u4e0a\u3002", "\u5728\u4eba-AI\u5bf9\u5c40\u4e2d\uff0c\u4e0d\u540cAI\u7ed9\u4eba\u7c7b\u7684\u5b57\u9762\u4fe1\u606f\u76f8\u8fd1\uff0c\u4f46\u4eba\u7c7b\u5931\u8d25\u7387\u548c\u60ef\u4f8b\u5dee\u8ddd\u5dee\u5f02\u663e\u8457\uff0c\u8bf4\u660e\u60ef\u4f8b\u517c\u5bb9\u6027\u6bd4AI-AI\u5f97\u5206\u66f4\u80fd\u9884\u6d4b\u4eba\u7c7b\u534f\u4f5c\u6548\u679c\u3002"], "keywords": ["\u534f\u4f5c\u667a\u80fd\u4f53", "\u4eba\u673a\u534f\u4f5c", "\u8bc4\u6d4b\u6307\u6807", "\u9690\u5f0f\u6c9f\u901a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11489v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "The Convention Gap: Towards Measuring Implicit Communication in Cooperative AI Evaluation", "tldr": "\u63d0\u51fa\u201c\u60ef\u4f8b\u5dee\u8ddd\u201d\u8861\u91cf\u534f\u4f5cAI\u9690\u5f0f\u6c9f\u901a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa convention gap \u6307\u6807\uff0c\u7528\u201c\u4ec5\u6309\u5b57\u9762\u4fe1\u606f\u9884\u6d4b\u7684\u5931\u8d25\u7387\u201d\u4e0e\u201c\u5b9e\u9645\u5931\u8d25\u7387\u201d\u7684\u5dee\u503c\u6765\u5ea6\u91cf\u5408\u4f5c\u4e2d\u7684\u9690\u5f0f\u60ef\u4f8b\u6c9f\u901a\u3002\u4f5c\u8005\u5728 Hanabi \u6e38\u620f\u4e2d\u7cbe\u786e\u8ba1\u7b97\u540e\u9a8c\uff0c\u5e76\u7528\u4eba-\u4eba\u3001AI-AI\u3001\u4eba-AI \u6570\u636e\u9a8c\u8bc1\u8be5\u6307\u6807\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u201c\u9690\u5f0f\u6c9f\u901a/\u5171\u4eab\u60ef\u4f8b\u201d\u8f6c\u5316\u4e3a\u53ef\u8ba1\u7b97\u6307\u6807\uff0c\u6307\u51fa\u4f20\u7edfAI-AI\u57fa\u51c6\u53ef\u80fd\u4f4e\u4f30\u4eba\u7c7b\u534f\u4f5c\u6240\u9700\u7684\u793e\u4f1a\u7ea6\u5b9a\u80fd\u529b\uff0c\u5bf9\u5408\u4f5cAI\u548c\u4eba\u673a\u534f\u4f5c\u8bc4\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A wrong answer does not show whether the model lacked the needed information or held it and failed to use it. On an entity-obligation binding task, a language model can emit an incorrect prompt-supplied binding while a linear probe can recover the correct one from its frozen hidden state. We measure how often this occurs across 16 public checkpoints, each evaluated with three seeds. We fit a probe on a training fold, select its layer on a validation fold, and report results on a disjoint test fold. On the trials each model gets wrong, probe accuracy exceeds the strict present-obligation baseline, 1/K = 0.125, by +0.196 (95% CI [+0.101, +0.296], bootstrapped over models). A query-entity counterfactual rules out token presence and recency. A score built from the sign of probe-output disagreement improves failure detection over the model\u0027s own confidence by +0.079 AUROC (95% CI [+0.036, +0.126]). Raw probe confidence gives no measurable improvement over model confidence. Steering the residual stream toward the probe-decoded binding, with no gold label, raises accuracy on all eight models tested by a mean of +0.168 (95% CI [+0.066, +0.280]). Where recent studies report that probe-detected errors are resistant to interventions, we find that in-context binding is a setting in which probes are actionable.", "arxiv_id": "2609.11216", "arxiv_url": "https://arxiv.org/abs/2609.11216", "authors": ["Manas Venkata Sai Ravulapalli", "Samrath Singh Chadha", "Abhinav M. Hari"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u5b9e\u4f53-\u4e49\u52a1\u7ed1\u5b9a\u4efb\u52a1\u4e2d\u7b54\u9519\u65f6\uff0c\u662f\u5426\u5176\u5b9e\u5df2\u5728\u9690\u85cf\u72b6\u6001\u4e2d\u7f16\u7801\u4e86\u6b63\u786e\u7ed1\u5b9a\u3002\u4f5c\u8005\u53d1\u73b0\u7ebf\u6027\u63a2\u9488\u80fd\u4ece\u51bb\u7ed3\u9690\u85cf\u72b6\u6001\u6062\u590d\u6b63\u786e\u7b54\u6848\uff0c\u5e76\u53ef\u7528\u4e8e\u68c0\u6d4b\u5931\u8d25\u4e0e\u65e0\u6807\u7b7e\u5e72\u9884\u4fee\u590d\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11216", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u572816\u4e2a\u516c\u5f00\u6a21\u578b\u68c0\u67e5\u70b9\u3001\u6bcf\u4e2a3\u4e2a\u968f\u673a\u79cd\u5b50\u4e0a\u8bc4\u4f30\uff1b\u6a21\u578b\u7b54\u9519\u6837\u672c\u4e2d\uff0c\u63a2\u9488\u51c6\u786e\u7387\u663e\u8457\u9ad8\u4e8e1/K=0.125\u7684\u4e25\u683c\u57fa\u7ebf\uff0c\u5e73\u5747\u63d0\u5347+0.196\u3002", "\u901a\u8fc7\u67e5\u8be2\u5b9e\u4f53\u53cd\u4e8b\u5b9e\u5b9e\u9a8c\u6392\u9664\u4e86\u63a2\u9488\u4ec5\u4f9d\u8d56\u8bcd\u5143\u51fa\u73b0\u6216\u8fd1\u56e0\u6548\u5e94\u7684\u89e3\u91ca\u3002", "\u57fa\u4e8e\u63a2\u9488\u8f93\u51fa\u4e0e\u6a21\u578b\u8f93\u51fa\u4e0d\u4e00\u81f4\u7684\u7b26\u53f7\u5206\u6570\uff0c\u76f8\u6bd4\u6a21\u578b\u81ea\u8eab\u7f6e\u4fe1\u5ea6\u5c06\u5931\u8d25\u68c0\u6d4bAUROC\u63d0\u5347+0.079\uff1b\u8fdb\u4e00\u6b65\u7528\u63a2\u9488\u89e3\u7801\u7ed3\u679c\u5f15\u5bfc\u6b8b\u5dee\u6d41\uff0c\u4f7f8\u4e2a\u6d4b\u8bd5\u6a21\u578b\u5e73\u5747\u51c6\u786e\u7387\u63d0\u5347+0.168\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u63a2\u9488", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u4fee\u590d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11216v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Legible Failures: Detecting and Repairing In-Context Binding Errors", "tldr": "\u63a2\u9488\u53ef\u53d1\u73b0\u5e76\u4fee\u590d\u4e0a\u4e0b\u6587\u7ed1\u5b9a\u9519\u8bef", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u5b9e\u4f53-\u4e49\u52a1\u7ed1\u5b9a\u4efb\u52a1\u4e2d\u7b54\u9519\u65f6\uff0c\u662f\u5426\u5176\u5b9e\u5df2\u5728\u9690\u85cf\u72b6\u6001\u4e2d\u7f16\u7801\u4e86\u6b63\u786e\u7ed1\u5b9a\u3002\u4f5c\u8005\u53d1\u73b0\u7ebf\u6027\u63a2\u9488\u80fd\u4ece\u51bb\u7ed3\u9690\u85cf\u72b6\u6001\u6062\u590d\u6b63\u786e\u7b54\u6848\uff0c\u5e76\u53ef\u7528\u4e8e\u68c0\u6d4b\u5931\u8d25\u4e0e\u65e0\u6807\u7b7e\u5e72\u9884\u4fee\u590d\u3002", "why_notable": "\u8bba\u6587\u8868\u660e\u67d0\u4e9b\u6a21\u578b\u9519\u8bef\u662f\u201c\u53ef\u8bfb\u7684\u201d\uff1a\u6b63\u786e\u7b54\u6848\u867d\u672a\u8f93\u51fa\uff0c\u5374\u5b58\u5728\u4e8e\u5185\u90e8\u8868\u793a\u4e2d\uff0c\u5e76\u4e14\u63a2\u9488\u4e0d\u4ec5\u80fd\u8bca\u65ad\u9519\u8bef\uff0c\u8fd8\u80fd\u5728\u65e0\u91d1\u6807\u60c5\u51b5\u4e0b\u6307\u5bfc\u4fee\u590d\u3002\u8fd9\u4e3a\u53ef\u89e3\u91ca\u6027\u3001\u53ef\u9760\u6027\u68c0\u6d4b\u548c\u63a8\u7406\u65f6\u5e72\u9884\u63d0\u4f9b\u4e86\u5b9e\u7528\u8bc1\u636e\u3002"}, {"abstract": "Structured pruning of large language models (LLMs) offers hardware-efficient compression, yet existing methods require calibration data, gradient computation, or large auxiliary policy networks at pruning time. LILA (\\emph{Latent-Informed Layer Analysis}) scores neuron importance via the Kolmogorov--Smirnov (KS) distance between empirical singular value distributions of the full and neuron-ablated feed-forward network (FFN) weight matrix, providing a closed-form spectral rule requiring no training, calibration data, or auxiliary network. Without any fine-tuning, LILA surpasses PruneNet (45M-parameter RL policy) by 1.57~pp in zero-shot accuracy on LLaMA-2-7B at 25\\% sparsity, and outperforms WikiText-2-calibrated SliceGPT by up to 6.0~pp across all sparsity levels, while preserving the original architecture. After one epoch of LoRA recovery fine-tuning, LILA achieves highly competitive performance, matching the heavily calibrated SliceGPT baseline to within a 0.48~pp margin across LLaMA-2-7B and Phi-2, despite using zero calibration data. A Neural Tangent Kernel analysis confirms a 22$\\times$ reduction in functional distortion versus random pruning, providing theoretical grounding for the spectral importance criterion. Finally, extending LILA to dynamically allocate sparsity budgets via KS-scores yields state-of-the-art generative preservation at moderate compression, while uncovering fundamental single-layer architectural bottlenecks at higher compression regimes.", "arxiv_id": "2609.11163", "arxiv_url": "https://arxiv.org/abs/2609.11163", "authors": ["Sankar Behera", "Dhruv Singh", "Anshika Agnihotri", "Raj Kumar Choudhary", "Satyadev Ahlawat", "Yamuna Prasad"], "brief": "\u8bba\u6587\u63d0\u51fa LILA\uff0c\u901a\u8fc7\u6bd4\u8f83\u5b8c\u6574\u4e0e\u795e\u7ecf\u5143\u6d88\u878d\u540e FFN \u6743\u91cd\u77e9\u9635\u7684\u5947\u5f02\u503c\u7ecf\u9a8c\u5206\u5e03 KS \u8ddd\u79bb\u6765\u8bc4\u4f30\u795e\u7ecf\u5143\u91cd\u8981\u6027\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u3001\u6821\u51c6\u6570\u636e\u3001\u68af\u5ea6\u6216\u8f85\u52a9\u7f51\u7edc\uff0c\u5373\u53ef\u8fdb\u884c\u4fdd\u6301\u539f\u67b6\u6784\u7684\u7ed3\u6784\u5316\u526a\u679d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11163", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u95ed\u5f0f\u8c31\u91cd\u8981\u6027\u51c6\u5219\uff0c\u57fa\u4e8e\u5947\u5f02\u503c\u5206\u5e03\u7684 Kolmogorov\u2013Smirnov \u8ddd\u79bb\u9009\u62e9\u5f85\u526a FFN \u795e\u7ecf\u5143", "\u5728 LLaMA-2-7B 25% \u7a00\u758f\u5ea6\u4e0b\uff0c\u96f6\u5fae\u8c03\u96f6\u6837\u672c\u51c6\u786e\u7387\u8d85\u8fc7\u5e26 45M \u53c2\u6570 RL \u7b56\u7565\u7684 PruneNet 1.57 \u4e2a\u767e\u5206\u70b9", "\u65e0\u9700\u6821\u51c6\u6570\u636e\u4ecd\u4f18\u4e8e WikiText-2 \u6821\u51c6\u7684 SliceGPT \u6700\u9ad8 6.0 \u4e2a\u767e\u5206\u70b9\uff1b\u7ecf\u4e00\u8f6e LoRA \u6062\u590d\u540e\u63a5\u8fd1\u5f3a\u6821\u51c6\u57fa\u7ebf"], "keywords": ["\u6a21\u578b\u538b\u7f29", "\u7ed3\u6784\u5316\u526a\u679d", "\u5927\u
