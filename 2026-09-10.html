8bed\u8a00\u6a21\u578b", "\u8c31\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11163v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LILA: Calibration-Free Structured Pruning of Large Language Models via Latent Spectral Geometry", "tldr": "\u65e0\u9700\u6821\u51c6\u6570\u636e\u7684LLM\u8c31\u51e0\u4f55\u7ed3\u6784\u5316\u526a\u679d\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LILA\uff0c\u901a\u8fc7\u6bd4\u8f83\u5b8c\u6574\u4e0e\u795e\u7ecf\u5143\u6d88\u878d\u540e FFN \u6743\u91cd\u77e9\u9635\u7684\u5947\u5f02\u503c\u7ecf\u9a8c\u5206\u5e03 KS \u8ddd\u79bb\u6765\u8bc4\u4f30\u795e\u7ecf\u5143\u91cd\u8981\u6027\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u3001\u6821\u51c6\u6570\u636e\u3001\u68af\u5ea6\u6216\u8f85\u52a9\u7f51\u7edc\uff0c\u5373\u53ef\u8fdb\u884c\u4fdd\u6301\u539f\u67b6\u6784\u7684\u7ed3\u6784\u5316\u526a\u679d\u3002", "why_notable": "LILA \u5c06 LLM \u7ed3\u6784\u5316\u526a\u679d\u4ece\u4f9d\u8d56\u6821\u51c6\u6570\u636e\u548c\u590d\u6742\u4f18\u5316\u8f6c\u5411\u7eaf\u6743\u91cd\u8c31\u51e0\u4f55\u5206\u6790\uff0c\u663e\u8457\u964d\u4f4e\u526a\u679d\u6210\u672c\uff0c\u5e76\u5728\u591a\u4e2a\u6a21\u578b\u4e0e\u7a00\u758f\u5ea6\u4e0b\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7ed3\u679c\uff0c\u5177\u5907\u5b9e\u7528\u538b\u7f29\u4ef7\u503c\u3002"}, {"abstract": "Large language models are increasingly used as judges to measure social bias in text, yet the passages they judge are often noisy, containing typos, informal spelling, and broken punctuation. The consequences of such surface noise for social bias measurement remain unclear. To investigate this question, we apply five realistic noise conditions at multiple intensity levels to 3,822 stereotype-related responses and compare the resulting bias judgments with those on the original text. We find that such surface noise does not degrade bias measurement symmetrically: it is far more likely to turn neutral judgments into biased ones than biased judgments into neutral ones, by up to a 120x margin. We further observe two non-obvious effects across four LLM judges: in the most fragile judge the distortion is at its purest at mild, realistic noise levels, where erasure is scarcest, and as judges grow robust it attenuates toward parity rather than reversing. Bias measured on noisy text is therefore systematically overestimated, most in the categories that matter most for fairness.", "arxiv_id": "2609.11067", "arxiv_url": "https://arxiv.org/abs/2609.11067", "authors": ["DongHyun Ryu", "Jaehyeok Lee", "YeongJun Hwang", "JinYeong Bak"], "brief": "\u672c\u6587\u7814\u7a76\u5728\u542b\u9519\u522b\u5b57\u3001\u975e\u6b63\u5f0f\u62fc\u5199\u548c\u7834\u788e\u6807\u70b9\u7b49\u8868\u9762\u566a\u58f0\u4e0b\uff0cLLM-as-a-Judge\u8fdb\u884c\u793e\u4f1a\u504f\u89c1\u6d4b\u91cf\u7684\u53ef\u9760\u6027\u3002\u4f5c\u8005\u5bf93822\u6761\u4e0e\u523b\u677f\u5370\u8c61\u76f8\u5173\u7684\u56de\u590d\u65bd\u52a0\u4e94\u7c7b\u771f\u5b9e\u566a\u58f0\uff0c\u5e76\u6bd4\u8f83\u56db\u79cdLLM\u88c1\u5224\u5728\u539f\u6587\u4e0e\u566a\u58f0\u6587\u672c\u4e0a\u7684\u504f\u89c1\u5224\u65ad\u5dee\u5f02\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11067", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8868\u9762\u566a\u58f0\u5bfc\u81f4\u504f\u89c1\u6d4b\u91cf\u975e\u5bf9\u79f0\u5931\u771f\uff1a\u4e2d\u6027\u6587\u672c\u88ab\u8bef\u5224\u4e3a\u6709\u504f\u7684\u6982\u7387\u8fdc\u9ad8\u4e8e\u6709\u504f\u6587\u672c\u88ab\u8bef\u5224\u4e3a\u4e2d\u6027\uff0c\u6700\u9ad8\u76f8\u5dee120\u500d\u3002", "\u6700\u8106\u5f31\u7684LLM\u88c1\u5224\u5728\u8f7b\u5ea6\u3001\u73b0\u5b9e\u566a\u58f0\u4e0b\u5931\u771f\u6700\u660e\u663e\uff0c\u800c\u4e0d\u662f\u5728\u6700\u5f3a\u566a\u58f0\u4e0b\uff1b\u6b64\u65f6\u504f\u89c1\u201c\u64e6\u9664\u201d\u6700\u5c11\u3001\u865a\u5047\u504f\u89c1\u6700\u591a\u3002", "\u968f\u7740\u88c1\u5224\u6a21\u578b\u66f4\u9c81\u68d2\uff0c\u5931\u771f\u8d8b\u5411\u4e8e\u51cf\u5f31\u5e76\u63a5\u8fd1\u5747\u8861\uff0c\u800c\u4e0d\u662f\u53cd\u5411\u4f4e\u4f30\u504f\u89c1\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u504f\u89c1\u8bc4\u4f30", "\u9c81\u68d2\u6027", "\u516c\u5e73\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11067v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Noise Fabricates Bias: The Fragility of LLM-as-a-Judge Bias Measurement under Noisy Text", "tldr": "\u566a\u58f0\u6587\u672c\u4f1a\u663e\u8457\u653e\u5927LLM\u504f\u89c1\u6d4b\u91cf", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5728\u542b\u9519\u522b\u5b57\u3001\u975e\u6b63\u5f0f\u62fc\u5199\u548c\u7834\u788e\u6807\u70b9\u7b49\u8868\u9762\u566a\u58f0\u4e0b\uff0cLLM-as-a-Judge\u8fdb\u884c\u793e\u4f1a\u504f\u89c1\u6d4b\u91cf\u7684\u53ef\u9760\u6027\u3002\u4f5c\u8005\u5bf93822\u6761\u4e0e\u523b\u677f\u5370\u8c61\u76f8\u5173\u7684\u56de\u590d\u65bd\u52a0\u4e94\u7c7b\u771f\u5b9e\u566a\u58f0\uff0c\u5e76\u6bd4\u8f83\u56db\u79cdLLM\u88c1\u5224\u5728\u539f\u6587\u4e0e\u566a\u58f0\u6587\u672c\u4e0a\u7684\u504f\u89c1\u5224\u65ad\u5dee\u5f02\u3002", "why_notable": "\u8bba\u6587\u63ed\u793a\u4e86\u7528LLM\u8bc4\u4f30\u793e\u4f1a\u504f\u89c1\u65f6\u4e00\u4e2a\u91cd\u8981\u4f46\u6613\u88ab\u5ffd\u89c6\u7684\u53ef\u9760\u6027\u95ee\u9898\uff1a\u771f\u5b9e\u4e16\u754c\u6587\u672c\u566a\u58f0\u4f1a\u7cfb\u7edf\u6027\u9ad8\u4f30\u504f\u89c1\uff0c\u5c24\u5176\u5f71\u54cd\u516c\u5e73\u6027\u8bc4\u4f30\u4e2d\u6700\u5173\u952e\u7684\u7c7b\u522b\u3002\u8fd9\u5bf9\u504f\u89c1\u57fa\u51c6\u3001\u5185\u5bb9\u5ba1\u6838\u548c\u6a21\u578b\u5b89\u5168\u8bc4\u6d4b\u5177\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Allowing large language models (LLMs) to retrieve information from a set of trusted documents can increase reliability and reduce hallucination. However, recent work has demonstrated that retrieval-augmented generation (RAG) can have unintended side effects on the overall safety of the generated responses, when prompted for harmful or dangerous content. A clearer understanding of the mechanisms leading to this result is needed, as increasing numbers of end users turn to RAG to incorporate corporate documents and knowledge bases into LLM-based systems. We introduce RAG-Safety-Bench, a benchmark to measure the safety impact of RAG on LLM models. By removing the confounding effect of retriever quality, and cleanly separating the problem into four conditions -- non-RAG, RAG with an oracle document containing the answer to the harmful request, RAG with documents related to the harmful request but without the specific answer, and RAG with random, safe documents -- the benchmark isolates the impacts of different factors in the observed safety degradation. We report results across five open-source LLMs, showing an inverse relationship between benign and unsafe capability, strong evidence that baseline safety guardrails do not lead to downstream safety guarantees in the RAG case, and model-specific support for previous findings that even benign documents can lead to unsafe generation in retrieval-enabled systems.", "arxiv_id": "2609.11758", "arxiv_url": "https://arxiv.org/abs/2609.11758", "authors": ["Adithiyan Rajan Indira Saravanan", "Kathleen C. Fraser"], "brief": "\u672c\u6587\u63d0\u51fa RAG-Safety-Bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u5bf9\u5927\u6a21\u578b\u5b89\u5168\u8f93\u51fa\u7684\u5f71\u54cd\u3002\u5b83\u901a\u8fc7\u63a7\u5236\u68c0\u7d22\u5668\u8d28\u91cf\uff0c\u5e76\u8bbe\u7f6e\u975eRAG\u3001\u7b54\u6848\u6587\u6863\u3001\u76f8\u5173\u4f46\u65e0\u7b54\u6848\u6587\u6863\u3001\u968f\u673a\u5b89\u5168\u6587\u6863\u56db\u79cd\u6761\u4ef6\uff0c\u9694\u79bb\u4e0d\u540c\u56e0\u7d20\u5bfc\u81f4\u7684\u5b89\u5168\u9000\u5316\u3002", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11758", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u6d88\u9664\u4e86\u68c0\u7d22\u8d28\u91cf\u8fd9\u4e00\u6df7\u6742\u56e0\u7d20\uff0c\u4e13\u6ce8\u5206\u6790RAG\u4e0a\u4e0b\u6587\u672c\u8eab\u5982\u4f55\u5f71\u54cd\u5b89\u5168\u6027\u3002", "\u5728\u4e94\u4e2a\u5f00\u6e90LLM\u4e0a\u5b9e\u9a8c\uff0c\u53d1\u73b0\u826f\u6027\u80fd\u529b\u4e0e\u4e0d\u5b89\u5168\u80fd\u529b\u4e4b\u95f4\u5b58\u5728\u53cd\u5411\u5173\u7cfb\u3002", "\u7ed3\u679c\u663e\u793a\u57fa\u7840\u5b89\u5168\u62a4\u680f\u5728RAG\u573a\u666f\u4e0b\u4e0d\u80fd\u4fdd\u8bc1\u4e0b\u6e38\u5b89\u5168\uff0c\u751a\u81f3\u5b89\u5168\u6587\u6863\u4e5f\u53ef\u80fd\u8bf1\u53d1\u4e0d\u5b89\u5168\u751f\u6210\u3002"], "keywords": ["RAG", "\u5927\u6a21\u578b\u5b89\u5168", "\u68c0\u7d22\u589e\u5f3a", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11758v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RAG-Safety-Bench: Reliable Evaluation of Retrieval-Augmented LLM Safety", "tldr": "\u8bc4\u6d4bRAG\u5bf9LLM\u5b89\u5168\u6027\u7684\u771f\u5b9e\u5f71\u54cd", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa RAG-Safety-Bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u5bf9\u5927\u6a21\u578b\u5b89\u5168\u8f93\u51fa\u7684\u5f71\u54cd\u3002\u5b83\u901a\u8fc7\u63a7\u5236\u68c0\u7d22\u5668\u8d28\u91cf\uff0c\u5e76\u8bbe\u7f6e\u975eRAG\u3001\u7b54\u6848\u6587\u6863\u3001\u76f8\u5173\u4f46\u65e0\u7b54\u6848\u6587\u6863\u3001\u968f\u673a\u5b89\u5168\u6587\u6863\u56db\u79cd\u6761\u4ef6\uff0c\u9694\u79bb\u4e0d\u540c\u56e0\u7d20\u5bfc\u81f4\u7684\u5b89\u5168\u9000\u5316\u3002", "why_notable": "\u968f\u7740\u4f01\u4e1a\u77e5\u8bc6\u5e93\u548c\u6587\u6863\u63a5\u5165LLM\u7cfb\u7edf\u8d8a\u6765\u8d8a\u666e\u904d\uff0cRAG\u7684\u5b89\u5168\u98ce\u9669\u6210\u4e3a\u5b9e\u9645\u90e8\u7f72\u4e2d\u7684\u5173\u952e\u95ee\u9898\uff1b\u8be5\u57fa\u51c6\u4e3a\u5b9a\u4f4dRAG\u5b89\u5168\u9000\u5316\u673a\u5236\u548c\u6539\u8fdb\u9632\u62a4\u7b56\u7565\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u8bc4\u6d4b\u5de5\u5177\u3002"}, {"abstract": "Reproducibility is essential to scientific progress, yet the growing volume and complexity of scientific publications make exhaustive manual verification increasingly impractical. Although recent advances in large language model (LLM) agents enable automated experiment reproduction, existing evaluations largely focus on final repositories and are typically limited to machine learning (ML). We introduce AgentActionBench, a process-oriented benchmark for evaluating agent-based experiment reproduction across ML and AI4Science domains. Our framework uses an MCP-based Action Recorder to capture agents\u0027 behaviour throughout the reproduction process and evaluates the resulting traces with paper-specific rubrics. AgentActionBench contains 150 papers, including 120 ML papers and 30 AI4Science papers. A human-annotated subset covering 10% of the benchmark provides validation data, while model-assisted augmentation expands the full benchmark to more than 10,000 rubric items. Experimental results show that current systems remain limited, with execution as the primary bottleneck. Meanwhile, the strong Pearson and Spearman correlations between model-generated and human-annotated rubrics validate the reliability of our scalable rubric-generation approach.", "arxiv_id": "2609.11117", "arxiv_url": "https://arxiv.org/abs/2609.11117", "authors": ["Hanhua Hong", "Yizhi Li", "Luu Gia Huy", "Jian Yang", "Ming Zhou", "Chenghua Lin"], "brief": "\u8bba\u6587\u4ecb\u7ecd NLPCC 2026 \u5171\u4eab\u4efb\u52a1 11\uff0c\u5e76\u63d0\u51fa AgentActionBench\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u4ece\u79d1\u5b66\u8bba\u6587\u4e2d\u590d\u73b0\u5b9e\u9a8c\u7684\u5168\u8fc7\u7a0b\u8868\u73b0\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u673a\u5668\u5b66\u4e60\u4e0e AI4Science \u8bba\u6587\uff0c\u901a\u8fc7\u8bb0\u5f55\u667a\u80fd\u4f53\u64cd\u4f5c\u8f68\u8ff9\u5e76\u7ed3\u5408\u8bba\u6587\u7ea7\u8bc4\u5206\u7ec6\u5219\u8fdb\u884c\u8bc4\u6d4b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11117", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5305\u542b 150 \u7bc7\u8bba\u6587\uff0c\u5176\u4e2d 120 \u7bc7\u673a\u5668\u5b66\u4e60\u8bba\u6587\u300130 \u7bc7 AI4Science \u8bba\u6587", "\u4f7f\u7528\u57fa\u4e8e MCP \u7684 Action Recorder \u6355\u83b7\u667a\u80fd\u4f53\u590d\u73b0\u8fc7\u7a0b\u4e2d\u7684\u884c\u4e3a\u8f68\u8ff9\uff0c\u800c\u975e\u53ea\u8bc4\u4f30\u6700\u7ec8\u4ed3\u5e93", "10% \u57fa\u51c6\u7531\u4eba\u5de5\u6807\u6ce8\u9a8c\u8bc1\uff0c\u5e76\u901a\u8fc7\u6a21\u578b\u8f85\u52a9\u6269\u5c55\u5230\u8d85\u8fc7 10000 \u6761\u8bc4\u5206\u7ec6\u5219"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u8ba1\u7b97", "\u57fa\u51c6\u8bc4\u6d4b", "\u5b9e\u9a8c\u590d\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11117v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Overview of the NLPCC 2026 Shared Task 11: Agent-Based Experiment Reproduction from Scientific Papers", "tldr": "\u9762\u5411\u8bba\u6587\u5b9e\u9a8c\u590d\u73b0\u7684\u667a\u80fd\u4f53\u8fc7\u7a0b\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd NLPCC 2026 \u5171\u4eab\u4efb\u52a1 11\uff0c\u5e76\u63d0\u51fa AgentActionBench\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u4ece\u79d1\u5b66\u8bba\u6587\u4e2d\u590d\u73b0\u5b9e\u9a8c\u7684\u5168\u8fc7\u7a0b\u8868\u73b0\u3002\u8be5\u57fa\u51c6\u8986\u76d6\u673a\u5668\u5b66\u4e60\u4e0e AI4Science \u8bba\u6587\uff0c\u901a\u8fc7\u8bb0\u5f55\u667a\u80fd\u4f53\u64cd\u4f5c\u8f68\u8ff9\u5e76\u7ed3\u5408\u8bba\u6587\u7ea7\u8bc4\u5206\u7ec6\u5219\u8fdb\u884c\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5b9e\u9a8c\u590d\u73b0\u8bc4\u6d4b\u4ece\u7ed3\u679c\u5bfc\u5411\u63a8\u8fdb\u5230\u8fc7\u7a0b\u5bfc\u5411\uff0c\u5e76\u6269\u5c55\u5230 AI4Science \u573a\u666f\uff0c\u4e3a\u79d1\u5b66\u7814\u7a76\u81ea\u52a8\u5316\u548c LLM \u667a\u80fd\u4f53\u80fd\u529b\u8bc4\u4f30\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u3001\u53ef\u6269\u5c55\u7684\u57fa\u51c6\u3002"}, {"abstract": "As Omni-modal large language models (Omni-LLMs) take in audio, video and text together, their KV cache memory cost grows. KV cache quantization is the de facto approach in text-only LLMs, but its application to Omni-LLMs remains unexplored. In this paper, we analyze how TurboQuant, a representative rotation-based KV cache quantization method, behaves on multimodal caches and identify two critical issues: temporal key drift and heterogeneous value geometry. To address these, we propose OmniKVQuant, a training-free framework that (i) sets the key quantization range over each short window of the input stream; and (ii) rotates values separately per modality. On Qwen2.5-Omni and Qwen3-Omni, OmniKVQuant enables 2-bit KV caches while substantially preserving performance across seven audio-visual benchmarks. We further provide a fused Triton decode kernel that unpacks the 2-bit cache during attention, so no dense FP16 cache is ever built. Code: https://github.com/kaistmm/OmniKVQuant", "arxiv_id": "2609.11582", "arxiv_url": "https://arxiv.org/abs/2609.11582", "authors": ["Suho Yoo", "Hyunjong Ok", "Jongmin Choi", "Jihoo Jung", "Joon Son Chung"], "brief": "\u8bba\u6587\u63d0\u51fa OmniKVQuant\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u5168\u6a21\u6001\u5927\u6a21\u578b KV cache \u91cf\u5316\u6846\u67b6\uff0c\u9488\u5bf9\u97f3\u9891\u3001\u89c6\u9891\u3001\u6587\u672c\u6df7\u5408\u8f93\u5165\u4e0b\u7f13\u5b58\u663e\u5b58\u5f00\u9500\u5feb\u901f\u589e\u957f\u7684\u95ee\u9898\u3002\u5b83\u5206\u6790\u4e86\u65cb\u8f6c\u5f0f\u91cf\u5316\u65b9\u6cd5\u5728\u591a\u6a21\u6001\u7f13\u5b58\u4e2d\u7684\u5931\u6548\u539f\u56e0\uff0c\u5e76\u5728 Qwen2.5-Omni\u3001Qwen3-Omni \u4e0a\u5b9e\u73b0\u4f4e\u6bd4\u7279\u7f13\u5b58\u538b\u7f29\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11582", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u591a\u6a21\u6001 KV cache \u4e2d\u5b58\u5728 temporal key drift \u4e0e heterogeneous value geometry \u4e24\u4e2a\u5173\u952e\u95ee\u9898\uff0c\u5bfc\u81f4\u6587\u672c\u6a21\u578b\u91cf\u5316\u65b9\u6cd5\u96be\u4ee5\u76f4\u63a5\u8fc1\u79fb\u3002", "\u5bf9 key \u91c7\u7528\u77ed\u65f6\u95f4\u7a97\u53e3\u5185\u52a8\u6001\u8bbe\u5b9a\u91cf\u5316\u8303\u56f4\uff0c\u5bf9 value \u6309\u6a21\u6001\u5206\u522b\u65cb\u8f6c\uff0c\u4ee5\u9002\u914d\u4e0d\u540c\u6a21\u6001\u7684\u51e0\u4f55\u5206\u5e03\u3002", "\u652f\u6301 2-bit KV cache\uff0c\u5e76\u63d0\u4f9b\u878d\u5408 Triton \u89e3\u7801 kernel\uff0c\u5728 attention \u4e2d\u76f4\u63a5\u89e3\u5305\uff0c\u907f\u514d\u6784\u5efa FP16 \u7a20\u5bc6\u7f13\u5b58\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u6a21\u578b\u538b\u7f29", "KV\u7f13\u5b58", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11582v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OmniKVQuant: KV Cache Quantization for Omni-LLMs", "tldr": "\u9762\u5411\u5168\u6a21\u6001LLM\u76842-bit KV\u7f13\u5b58\u91cf\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OmniKVQuant\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u5168\u6a21\u6001\u5927\u6a21\u578b KV cache \u91cf\u5316\u6846\u67b6\uff0c\u9488\u5bf9\u97f3\u9891\u3001\u89c6\u9891\u3001\u6587\u672c\u6df7\u5408\u8f93\u5165\u4e0b\u7f13\u5b58\u663e\u5b58\u5f00\u9500\u5feb\u901f\u589e\u957f\u7684\u95ee\u9898\u3002\u5b83\u5206\u6790\u4e86\u65cb\u8f6c\u5f0f\u91cf\u5316\u65b9\u6cd5\u5728\u591a\u6a21\u6001\u7f13\u5b58\u4e2d\u7684\u5931\u6548\u539f\u56e0\uff0c\u5e76\u5728 Qwen2.5-Omni\u3001Qwen3-Omni \u4e0a\u5b9e\u73b0\u4f4e\u6bd4\u7279\u7f13\u5b58\u538b\u7f29\u3002", "why_notable": "\u5168\u6a21\u6001\u5927\u6a21\u578b\u7684\u957f\u97f3\u89c6\u9891\u8f93\u5165\u4f1a\u663e\u8457\u653e\u5927 KV cache \u663e\u5b58\u538b\u529b\uff0c\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u5c06\u7f13\u5b58\u538b\u5230 2-bit\uff0c\u5e76\u5728\u4e03\u4e2a\u97f3\u89c6\u9891\u57fa\u51c6\u4e0a\u8f83\u597d\u4fdd\u6301\u6027\u80fd\uff0c\u5177\u6709\u76f4\u63a5\u7684\u63a8\u7406\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Multi-subject video generation faces two key challenges: uncontrollable fidelity strength and potential semantic drift. We address these by analyzing the internal mechanisms of Diffusion Transformers (DiTs). We found that certain attention blocks naturally form an Intrinsic Spatial Grounding Map (ISGM) that precisely locates reference subjects. Building on this insight, we propose Dual-phase Intrinsic Attention Leveraging (DIAL), a framework that uses these internal signals for both training and inference. In low-noise stages, we use ISGM to guide the attention mechanism, allowing precise control over fidelity strength during inference without retraining. In high-noise stages, we use these same maps to automatically build preference pairs at no additional cost for Reinforcement Learning (RL). This RL procedure effectively anchors the model\u0027s attention to reference subjects and mitigates semantic drift. Extensive experiments show that DIAL significantly outperforms baseline models on the OpenS2V-Eval benchmark, consistently improving identity consistency and enabling controllable fidelity strength.", "arxiv_id": "2609.11507", "arxiv_url": "https://arxiv.org/abs/2609.11507", "authors": ["Niange Yu", "Ye Tian", "Biaolong Chen", "Miao Lu", "Aixi Zhang", "Hao Jiang", "Yunhai Tong", "Pipei Huang"], "brief": "\u672c\u6587\u53d1\u73b0 DiT \u7684\u90e8\u5206\u6ce8\u610f\u529b\u5757\u4f1a\u81ea\u7136\u5f62\u6210\u53ef\u5b9a\u4f4d\u53c2\u8003\u4e3b\u4f53\u7684\u5185\u5728\u7a7a\u95f4\u5b9a\u4f4d\u56fe\uff08ISGM\uff09\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa DIAL\uff0c\u5728\u8bad\u7ec3\u4e0e\u63a8\u7406\u9636\u6bb5\u5229\u7528\u8fd9\u4e9b\u5185\u90e8\u4fe1\u53f7\uff0c\u5b9e\u73b0\u591a\u4e3b\u4f53\u89c6\u9891\u751f\u6210\u4e2d\u7684\u8eab\u4efd\u4fdd\u771f\u53ef\u63a7\u4e0e\u8bed\u4e49\u6f02\u79fb\u7f13\u89e3\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11507", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u4f4e\u566a\u58f0\u9636\u6bb5\u7528 ISGM \u5f15\u5bfc\u6ce8\u610f\u529b\uff0c\u4f7f\u63a8\u7406\u65f6\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u8c03\u8282\u53c2\u8003\u4e3b\u4f53\u4fdd\u771f\u5f3a\u5ea6", "\u5728\u9ad8\u566a\u58f0\u9636\u6bb5\u7528 ISGM \u81ea\u52a8\u6784\u9020\u504f\u597d\u5bf9\uff0c\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u5bf9\u9f50\uff0c\u964d\u4f4e\u989d\u5916\u6807\u6ce8\u6216\u751f\u6210\u6210\u672c", "\u5728 OpenS2V-Eval \u57fa\u51c6\u4e0a\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\uff0c\u63d0\u5347\u8eab\u4efd\u4e00\u81f4\u6027\u5e76\u652f\u6301\u53ef\u63a7\u4fdd\u771f\u5ea6"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u6ce8\u610f\u529b\u673a\u5236", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11507v1", "published_at": "2026-09-10", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Harnessing Intrinsic Subject-Aware Attention for Controllable Multi-Subject Video Generation", "tldr": "\u5229\u7528\u5185\u5728\u6ce8\u610f\u529b\u53ef\u63a7\u751f\u6210\u591a\u4e3b\u4f53\u89c6\u9891", "upvotes": 0, "what_it_is": "\u672c\u6587\u53d1\u73b0 DiT \u7684\u90e8\u5206\u6ce8\u610f\u529b\u5757\u4f1a\u81ea\u7136\u5f62\u6210\u53ef\u5b9a\u4f4d\u53c2\u8003\u4e3b\u4f53\u7684\u5185\u5728\u7a7a\u95f4\u5b9a\u4f4d\u56fe\uff08ISGM\uff09\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa DIAL\uff0c\u5728\u8bad\u7ec3\u4e0e\u63a8\u7406\u9636\u6bb5\u5229\u7528\u8fd9\u4e9b\u5185\u90e8\u4fe1\u53f7\uff0c\u5b9e\u73b0\u591a\u4e3b\u4f53\u89c6\u9891\u751f\u6210\u4e2d\u7684\u8eab\u4efd\u4fdd\u771f\u53ef\u63a7\u4e0e\u8bed\u4e49\u6f02\u79fb\u7f13\u89e3\u3002", "why_notable": "\u8bba\u6587\u5c06\u6269\u6563 Transformer \u5185\u90e8\u81ea\u53d1\u5f62\u6210\u7684\u6ce8\u610f\u529b\u5b9a\u4f4d\u4fe1\u53f7\u8f6c\u5316\u4e3a\u53ef\u63a7\u751f\u6210\u4e0e\u504f\u597d\u5b66\u4e60\u76d1\u7763\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u4f4e\u6210\u672c\u63d0\u5347\u591a\u4e3b\u4f53\u89c6\u9891\u4e00\u81f4\u6027\u548c\u53ef\u63a7\u6027\u7684\u5b9e\u7528\u65b9\u6cd5\u3002"}, {"abstract": "Code world models represent worlds as executable programs, but this representation alone does not determine how to construct a complex world. We introduce Recursive Code World Models (RCWM), a framework for reconstructing complex 3D worlds in code from a single reference image. RCWM couples a Recursive Scene Program (RSP) representation with a construction solver that recursively calls itself. An RSP represents the executable world as compositional scene code, while each solver call follows the same complete process: establish the whole, recursively reconstruct unresolved parts, and revisit the whole to refine their composition. This global-local-global recursion gives fine-scale structures their own perception-and-editing loops while preserving scene-wide geometry and relationships. Reference-aligned views propagate a shared camera projection across levels, while parent revisitation addresses boundaries, spatial relations, and shared errors that emerge after local refinement. A vision-language coding agent directly compares reference images with scene renders to guide refinement, recursive descent, and return. Across complex scenes, RCWM outperforms prior code-based image-to-scene reconstruction methods. Ablation studies further support the benefits of recursive construction and suggest that deeper calls can improve finer-scale reconstruction. RCWM provides a recursive construction principle for building complex executable worlds from visual evidence.", "arxiv_id": "2609.11499", "arxiv_url": "https://arxiv.org/abs/2609.11499", "authors": ["Zhiqi Li", "Yuxuan Liao", "Bo Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa Recursive Code World Models\uff08RCWM\uff09\uff0c\u5c06\u590d\u67423D\u573a\u666f\u8868\u793a\u4e3a\u53ef\u6267\u884c\u7684\u9012\u5f52\u573a\u666f\u7a0b\u5e8f\uff0c\u5e76\u901a\u8fc7\u9012\u5f52\u6784\u5efa\u6c42\u89e3\u5668\u4ece\u5355\u5f20\u53c2\u8003\u56fe\u50cf\u91cd\u5efa\u4e16\u754c\u3002\u7cfb\u7edf\u5728\u5168\u5c40\u2014\u5c40\u90e8\u2014\u5168\u5c40\u5faa\u73af\u4e2d\u4e0d\u65ad\u7ec6\u5316\u5b50\u7ed3\u6784\uff0c\u540c\u65f6\u4fdd\u6301\u6574\u4f53\u51e0\u4f55\u4e0e\u7a7a\u95f4\u5173\u7cfb\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11499", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51fa Recursive Scene Program\uff08RSP\uff09\uff0c\u7528\u7ec4\u5408\u5f0f\u573a\u666f\u4ee3\u7801\u8868\u8fbe\u53ef\u6267\u884c3D\u4e16\u754c", "\u6784\u5efa\u6c42\u89e3\u5668\u9012\u5f52\u5904\u7406\u672a\u89e3\u6790\u90e8\u5206\uff0c\u5e76\u5728\u5c40\u90e8\u7ec6\u5316\u540e\u56de\u5230\u7236\u7ea7\u4fee\u6b63\u8fb9\u754c\u3001\u5173\u7cfb\u4e0e\u5171\u4eab\u8bef\u5dee", "\u5f15\u5165\u89c6\u89c9\u8bed\u8a00\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u5bf9\u6bd4\u53c2\u8003\u56fe\u50cf\u4e0e\u6e32\u67d3\u7ed3\u679c\u6765\u6307\u5bfc\u4ee3\u7801\u7f16\u8f91\u3001\u9012\u5f52\u4e0b\u94bb\u54 e checkpoint\u0027s property, not its method\u0027s. What does the moving is not the removed data surviving in the state: exchanging kept records for removed ones inside a fixed fitting pool moves a published cell by almost nothing, while how far a checkpoint\u0027s shipped state has drifted from any refit does track it. The consequence for a published decision is real but narrow: twelve verdicts cross, four clear a measured recalibration budget, two clear it on every replicate, and a population we trained and sited near its own criterion yields none. A release should therefore name the fitting convention beside the number, on the batch-normalized vision models where this channel exists.", "arxiv_id": "2609.11490", "arxiv_url": "https://arxiv.org/abs/2609.11490", "authors": ["Junlong Shen Xingyu Li"], "brief": "\u8bba\u6587\u5ba1\u8ba1\u4e86263\u4e2a\u5df2\u53d1\u5e03\u7684\u5e26\u6279\u5f52\u4e00\u5316\uff08BatchNorm\uff09\u68c0\u67e5\u70b9\uff0c\u53d1\u73b0\u673a\u5668\u9057\u5fd8\u8bc4\u6d4b\u4e2d\u7684\u516c\u5f00\u6307\u6807\u4f1a\u56e0BN\u7edf\u8ba1\u7684\u62df\u5408\u7ea6\u5b9a\u800c\u5728\u5355\u4e2a\u68c0\u67e5\u70b9\u5c42\u9762\u53d1\u751f\u660e\u663e\u53d8\u5316\u3002\u4f5c\u8005\u8868\u660e\u8fd9\u79cd\u53d8\u5316\u5e76\u975e\u56e0\u4e3a\u88ab\u5220\u9664\u6570\u636e\u4ecd\u6b8b\u7559\u5728\u6a21\u578b\u72b6\u6001\u4e2d\uff0c\u800c\u4e3b\u8981\u6765\u81ea\u53d1\u5e03\u7684BN\u72b6\u6001\u4e0e\u5728\u4fdd\u7559\u6570\u636e\u4e0a\u91cd\u62df\u5408\u540e\u7684\u72b6\u6001\u5b58\u5728\u6f02\u79fb\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11490", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728221\u4e2a\u53d1\u5e03\u68c0\u67e5\u70b9\u4e2d\uff0c47\u4e2a\u5728\u6743\u91cd\u5b8c\u5168\u76f8\u540c\u3001\u4ec5\u7528\u4fdd\u7559\u6570\u636e\u91cd\u62df\u5408BN\u7edf\u8ba1\u540e\uff0c\u6307\u6807\u53d8\u5316\u8d85\u8fc7\u8be5\u53d1\u5e03\u81ea\u8eab\u96 6\u6001\u5b58\u5728\u6f02\u79fb\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u673a\u5668\u9057\u5fd8\u8bc4\u6d4b\u4e2d\u4e00\u4e2a\u5bb9\u6613\u88ab\u5ffd\u89c6\u4f46\u4f1a\u5f71\u54cd\u7ed3\u8bba\u7684\u590d\u73b0\u6027\u901a\u9053\uff1aBatchNorm\u7edf\u8ba1\u5e76\u975e\u68af\u5ea6\u8bad\u7ec3\u53c2\u6570\uff0c\u5374\u4f1a\u6539\u53d8\u9057\u5fd8\u5ba1\u8ba1\u7ed3\u679c\u3002\u5b83\u5efa\u8bae\u53d1\u5e03\u9057\u5fd8\u7ed3\u679c\u65f6\u5fc5\u987b\u660e\u786eBN\u7edf\u8ba1\u62df\u5408\u7ea6\u5b9a\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u673a\u5668\u9057\u5fd8\u57fa\u51c6\u548c\u5ba1\u8ba1\u7ed3\u8bba\u7684\u53ef\u4fe1\u5ea6\u3002"}, {"abstract": "We study K/V-cache interventions -- transplanting a target-conditioned K/V trajectory into a source-persona generation -- as a structured surface for persona control in decoder-only language models. Across 13 intervention configurations applied to Llama-3.1-8B for a fixed source-to-target persona pair, we report two consistent dissociations between representation-level alignment and behavioral expression, plus a common failure under position perturbations. First, all layer-band K/V replacements (early, mid, late) achieve strong local V-space alignment (V-gap 0.91, 0.89, 0.84), but only mid-layer replacement (layers 9-20) combines substantial target-marker expression with preserved lexical diversity. Second, full and mid-layer replacement induce comparable alignment (V-gap 0.94 vs. 0.89) yet produce different lexical-diversity profiles (TTR 0.65 vs. 0.77). Third, position perturbations (lag and shuffle) apply distinct operations yet uniformly suppress target-persona expression -- a common behavioral failure rather than a strict dissociation. Representation-level similarity metrics alone are thus not sufficient predictors of downstream persona expression in the regimes we study; the K/V cache emerges as a controllable but structurally constrained intervention surface. Because the transplanted trajectory carries the target\u0027s own generated token history, we characterize the intervention as trajectory-level transplantation rather than isolated persona-representation injection; a same-token-sequence control, decoding an identical token sequence under source vs. target conditioning, reproduces the sign and layer localization of the L28 representational shift, indicating the shift is not explained solely by imported token history. These findings characterize representation-behavior dissociation in a high-signal setting rather than establishing universality across models or persona pairs.", "arxiv_id": "2609.11020", "arxiv_url": "https://arxiv.org/abs/2609.11020", "authors": ["Yu Sun", "Mengyin Lu", "Cong Feng", "Guangming Lu", "Huimin Han"], "brief": "\u8bba\u6587\u7814\u7a76\u5728\u89e3\u7801\u5668\u8bed\u8a00\u6a21\u578b\u4e2d\u79fb\u690d\u76ee\u6807\u4eba\u683c\u6761\u4ef6\u4e0b\u7684 K/V-cache \u8f68\u8ff9\uff0c\u4ee5\u63a7\u5236\u6e90\u4eba\u683c\u751f\u6210\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8868\u5f81\u5c42\u9762\u7684\u76f8\u4f3c\u6216\u5bf9\u9f50\u5e76\u4e0d\u80fd\u53ef\u9760\u9884\u6d4b\u6700\u7ec8\u7684\u4eba\u683c\u884c\u4e3a\u8868\u8fbe\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11020", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728 Llama-3.1-8B \u4e0a\u6d4b\u8bd5 13 \u79cd K/V-cache \u5e72\u9884\u914d\u7f6e\uff0c\u6bd4\u8f83\u4e0d\u540c\u5c42\u6bb5\u66ff\u6362\u5bf9\u4eba\u683c\u8868\u8fbe\u4e0e\u8bcd\u6c47\u591a\u6837\u6027\u7684\u5f71\u54cd\u3002", "\u65e9/\u4e2d/\u665a\u5c42\u66ff\u6362\u90fd\u80fd\u5e26\u6765\u8f83\u5f3a\u7684\u5c40\u90e8 V \u7a7a\u95f4\u5bf9\u9f50\uff0c\u4f46\u53ea\u6709\u4e2d\u5c42\u66ff\u6362\uff089-20 \u5c42\uff09\u540c\u65f6\u5b9e\u73b0\u8f83\u660e\u663e\u76ee\u6807\u4eba\u683c\u6807\u8bb0\u8868\u8fbe\u548c\u8f83\u597d\u8bcd\u6c47\u591a\u6837\u6027\u3002", "\u5168\u5c42\u4e0e\u4e2d\u5c42\u66ff\u6362\u7684\u8868\u5f81\u5bf9\u9f50\u7a0b\u5ea6\u76f8\u8fd1\uff0c\u5374\u4ea7\u751f\u4e0d\u540c\u7684\u8bcd\u6c47\u591a\u6837\u6027\uff1b\u4f4d\u7f6e\u6ede\u540e\u4e0e\u6253\u4e71\u90fd\u4f1a\u6291\u5236\u76ee\u6807\u4eba\u683c\u8868\u8fbe\uff0c\u663e\u793a K/V \u8f68\u8ff9\u5b58\u5728\u7ed3\u6784\u7ea6\u675f\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u53ef\u63a7\u751f\u6210", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "K/V\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11020v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "K/V-Cache Interventions Dissociate Representation Alignment from Persona Expression in Decoder-Only Language Models", "tldr": "K/V\u7f13\u5b58\u5e72\u9884\u63ed\u793a\u8868\u5f81\u5bf9\u9f50\u4e0d\u7b49\u4e8e\u4eba\u683c\u8868\u8fbe", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5728\u89e3\u7801\u5668\u8bed\u8a00\u6a21\u578b\u4e2d\u79fb\u690d\u76ee\u6807\u4eba\u683c\u6761\u4ef6\u4e0b\u7684 K/V-cache \u8f68\u8ff9\uff0c\u4ee5\u63a7\u5236\u6e90\u4eba\u683c\u751f\u6210\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8868\u5f81\u5c42\u9762\u7684\u76f8\u4f3c\u6216\u5bf9\u9f50\u5e76\u4e0d\u80fd\u53ef\u9760\u9884\u6d4b\u6700\u7ec8\u7684\u4eba\u683c\u884c\u4e3a\u8868\u8fbe\u3002", "why_notable": "\u8be5\u7814\u7a76\u7ec6\u5316\u4e86\u8bed\u8a00\u6a21\u578b\u201c\u5185\u90e8\u8868\u5f81\u5bf9\u9f50\u201d\u4e0e\u201c\u5916\u90e8\u884c\u4e3a\u8868\u8fbe\u201d\u4e4b\u95f4\u7684\u5173\u7cfb\uff0c\u63d0\u9192\u4ec5\u9760\u8868\u5f81\u76f8\u4f3c\u5ea6\u8bc4\u4f30\u4eba\u683c\u6216\u98ce\u683c\u63a7\u5236\u5e76\u4e0d\u5145\u5206\uff0c\u4e5f\u4e3a\u57fa\u4e8e K/V-cache \u7684\u53ef\u63a7\u751f\u6210\u63d0\u4f9b\u4e86\u673a\u5236\u6027\u89c2\u5bdf\u3002"}, {"abstract": "State-of-the-art retrieval-augmented generation (RAG) methods exploit document structures to acquire sufficient evidence, but often incur substantial token costs. To reduce structural-context tokens without compromising high RAG accuracy, we present {\\sf VikingRAG}, a directory-aware semantic data management system that tightly integrates semantic and structural access to support structural-context-efficient, evidence-gap-driven multi-round retrieval. To further reduce token overhead of multi-round interaction, we materialize agentic multi-round retrieval traces as experience edges, and reuse these edges for similar queries, avoiding repeated multi-round exploration. To additionally reduce token costs when agentic multi-round retrieval is unnecessary, we introduce an adaptive escalation strategy that answers from one-round experience-augmented retrieval when the evidence is sufficient, and invokes agentic multi-round retrieval only otherwise. Experiments on real datasets show that the base system {\\sf VikingRAG} matches high accuracy of state-of-the-art methods while consuming only 11.6\\%--51.9\\% of their tokens. With retrieval-trace reuse and adaptive escalation, token costs drop to 5.1\\%--32.5\\% while maintaining competitive accuracy and practical document-storage performance, showing the utility of this work for emerging AI knowledge bases.", "arxiv_id": "2609.11390", "arxiv_url": "https://arxiv.org/abs/2609.11390", "authors": ["Peiyuan Gao", "Gaoyuan Zhang", "Haojie Qin", "Yahui Sun", "Qianyi Zhang", "Yunhao Zhang", "Zeyu Wang", "Wei Lu"], "brief": "VikingRAG \u662f\u4e00\u4e2a\u9762\u5411\u7ed3\u6784\u5316\u6587\u6863\u7684\u76ee\u5f55\u611f\u77e5 RAG \u7cfb\u7edf\uff0c\u7ed3\u5408\u8bed\u4e49\u4e0e\u7ed3\u6784\u8bbf\u95ee\uff0c\u8fdb\u884c\u8bc1\u636e\u7f3a\u53e3\u9a71\u52a8\u7684\u591a\u8f6e\u68c0\u7d22\u3002\u5b83\u901a\u8fc7\u590d\u7528\u591a\u8f6e\u68c0\u7d22\u8f68\u8ff9\u548c\u81ea\u9002\u5e94\u5347\u7ea7\u7b56\u7565\u663e\u8457\u964d\u4f4e token \u5f00\u9500\uff0c\u5728\u4fdd\u6301\u63a5\u8fd1\u5148\u8fdb\u65b9\u6cd5\u51c6\u786e\u7387\u7684\u540c\u65f6\u4ec5\u6d88\u8017\u7ea6 5.1%--32.5% \u7684 token\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL", "cs.DB", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11390", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u667a\u80fd\u4f53", "\u7ed3\u6784\u5316\u6587\u6863", "\u77e5\u8bc6\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11390v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VikingRAG: Accurate and Token-efficient Retrieval-augmented Generation over Structured Documents", "tldr": "VikingRAG \u662f\u4e00\u4e2a\u9762\u5411\u7ed3\u6784\u5316\u6587\u6863\u7684\u76ee\u5f55\u611f\u77e5 RAG \u7cfb\u7edf\uff0c\u7ed3\u5408\u8bed\u4e49\u4e0e\u7ed3\u6784\u8bbf\u95ee\uff0c\u8fdb\u884c\u8bc1\u636e\u7f3a\u53e3\u9a71\u52a8\u7684\u591a\u8f6e\u68c0\u7d22\u3002\u5b83\u901a\u8fc7\u590d\u7528\u591a\u8f6e\u68c0\u7d22\u8f68\u8ff9\u548c\u81ea\u9002\u5e94\u5347\u7ea7\u7b56\u7565\u663e\u8457\u964d\u4f4e token \u5f00\u9500\uff0c\u5728\u4fdd\u6301\u63a5\u8fd1\u5148\u8fdb\u65b9\u6cd5\u51c6\u786e\u7387\u7684\u540c\u65f6\u4ec5\u6d88\u8017\u7ea6 5.1%--32.5% \u7684 token\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon robot manipulation requires memory, but not necessarily inside the action policy. To address such tasks, current agentic systems often combine VLAs with planners and geometric tools, sometimes using additional depth or calibrated geometry. These systems confound attribution: gains may come from richer observations or alternative motor tools, while failures may stem from either the policy or an under-specified language interface. We isolate this question through a deliberately constrained design: less tool breadth, but greater interface bandwidth. 2AM makes a multimodal Agent the sole holder of task memory and a single RGB-based, episodically stateless Action Model the sole executor of task-relevant motion. The Agent compiles interaction history into subtask language and optional 2D grasp, place, and move hints that bind its physical intention at different time scales. To teach this steerability to the VLA, we augment demonstrations with structured hint labels and train under condition dropout, spatial noise, and temporal jitter to tolerate imperfect Agent outputs. On LIBERO-Mem, without depth, online geometry, or planner-based object motion, 2AM reaches 76.3% average completion, a 61.5-point improvement over the strongest reported baseline of 14.8%, together with 63.0% relaxed and 11.8% strict success. These results show that task memory can remain Agent-side. They further show that Action Model capability depends not only on what the policy has learned, but on how precisely the Agent can steer it.", "arxiv_id": "2609.11308", "arxiv_url": "https://arxiv.org/abs/2609.11308", "authors": ["Yutong Hu", "Fengjiao Chen", "Xuezhi Cao", "Renaud Detry"], "brief": "\u672c\u6587\u63d0\u51fa 2AM\uff0c\u5c06\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u7684\u8bb0\u5fc6\u5b8c\u5168\u653e\u5728\u591a\u6a21\u6001\u667a\u80fd\u4f53\u4fa7\uff0c\u800c\u52a8\u4f5c\u6a21\u578b\u4fdd\u6301\u57fa\u4e8e\u5355\u5e27 RGB\u3001\u65e0\u60c5\u8282\u8bb0\u5fc6\uff0c\u53ea\u8d1f\u8d23\u6267\u884c\u7531\u8bed\u8a00\u548c\u53ef\u9009 2D \u6293\u53d6/\u653e\u7f6e/\u79fb\u52a8\u63d0\u793a\u5f15\u5bfc\u7684\u52a8\u4f5c\u3002\u901a\u8fc7\u5e26\u7ed3\u6784\u5316\u63d0\u793a\u7684\u6570\u636e\u589e\u5f3a\u4e0e\u9c81\u68d2\u8bad\u7ec3\uff0c2AM \u5728 LIBERO-Mem \u4e0a\u8fbe\u5230 76.3% \u5e73\u5747\u5b8c\u6210\u7387\uff0c\u663e\u8457\u8d85\u8fc7\u6b64\u524d\u6700\u5f3a\u57fa\u7ebf\u7684 14.8%\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11308", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u957f\u671f\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11308v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "2AM: Grounding Agent-Side Memory as Guidance for Steerable Action Models in Long-Horizon Manipulation", "tldr": "\u672c\u6587\u63d0\u51fa 2AM\uff0c\u5c06\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u7684\u8bb0\u5fc6\u5b8c\u5168\u653e\u5728\u591a\u6a21\u6001\u667a\u80fd\u4f53\u4fa7\uff0c\u800c\u52a8\u4f5c\u6a21\u578b\u4fdd\u6301\u57fa\u4e8e\u5355\u5e27 RGB\u3001\u65e0\u60c5\u8282\u8bb0\u5fc6\uff0c\u53ea\u8d1f\u8d23\u6267\u884c\u7531\u8bed\u8a00\u548c\u53ef\u9009 2D \u6293\u53d6/\u653e\u7f6e/\u79fb\u52a8\u63d0\u793a\u5f15\u5bfc\u7684\u52a8\u4f5c\u3002\u901a\u8fc7\u5e26\u7ed3\u6784\u5316\u63d0\u793a\u7684\u6570\u636e\u589e\u5f3a\u4e0e\u9c81\u68d2\u8bad\u7ec3\uff0c2AM \u5728 LIBERO-Mem \u4e0a\u8fbe\u5230 76.3% \u5e73\u5747\u5b8c\u6210\u7387\uff0c\u663e\u8457\u8d85\u8fc7\u6b64\u524d\u6700\u5f3a\u57fa\u7ebf\u7684 14.8%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI shopping assistants increasingly redirect consumer discovery, creating an urgent need for tools that support seller-side competitive decision-making. We present a multi-agent AI system that automates competitive visibility measurement and root cause diagnosis in LLM-mediated ecommerce. The system introduces Agentic Share-of-Search (ASoS) as the decision target, deploys query agents across leading AI platforms, and uses a ReAct-based diagnostic agent to recommend prioritized merchandising interventions. A 100-trial ablation study, presented as a feasibility evaluation of this prototype, shows the agent recovers the ablated signal in 39% of trials (95% CI: 30.0% - 48.8%, 5.5x over chance), rising to 63.9% among high-correlation ablations.", "arxiv_id": "2609.11190", "arxiv_url": "https://arxiv.org/abs/2609.11190", "authors": ["Spandan Ghose Chowdhury"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411 LLM \u7535\u5546\u5bfc\u8d2d\u573a\u666f\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7528\u4e8e\u81ea\u52a8\u8861\u91cf\u5356\u5bb6\u7684\u7ade\u4e89\u53ef\u89c1\u6027\u5e76\u8bca\u65ad\u539f\u56e0\u3002\u7cfb\u7edf\u5b9a\u4e49\u4e86 Agentic Share-of-Search \u6307\u6807\uff0c\u8c03\u7528\u591a\u4e2a\u67e5\u8be2\u667a\u80fd\u4f53\u8de8\u5e73\u53f0\u91c7\u96c6\u7ed3\u679c\uff0c\u5e76\u7528 ReAct \u8bca\u65ad\u667a\u80fd\u4f53\u7ed9\u51fa\u5546\u54c1\u8fd0\u8425\u4f18\u5316\u5efa\u8bae\uff1b\u539f\u578b\u6d88\u878d\u5b9e\u9a8c\u4e2d\u53ef\u5728 39% \u8bd5\u9a8c\u4e2d\u6062\u590d\u88ab\u79fb\u9664\u4fe1\u53f7\uff0c\u9ad8\u76f8\u5173\u573a\u666f\u63d0\u5347\u81f3 63.9%\u3002", "categories": ["cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11190", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7535\u5546\u641c\u7d22", "\u4fe1\u606f\u68c0\u7d22", "\u51b3\u7b56\u652f\u6301"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11190v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Share-of-Search: A Multi-Agent AI System for Competitive Decision-Making in LLM-Mediated E-Commerce", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411 LLM \u7535\u5546\u5bfc\u8d2d\u573a\u666f\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7528\u4e8e\u81ea\u52a8\u8861\u91cf\u5356\u5bb6\u7684\u7ade\u4e89\u53ef\u89c1\u6027\u5e76\u8bca\u65ad\u539f\u56e0\u3002\u7cfb\u7edf\u5b9a\u4e49\u4e86 Agentic Share-of-Search \u6307\u6807\uff0c\u8c03\u7528\u591a\u4e2a\u67e5\u8be2\u667a\u80fd\u4f53\u8de8\u5e73\u53f0\u91c7\u96c6\u7ed3\u679c\uff0c\u5e76\u7528 ReAct \u8bca\u65ad\u667a\u80fd\u4f53\u7ed9\u51fa\u5546\u54c1\u8fd0\u8425\u4f18\u5316\u5efa\u8bae\uff1b\u539f\u578b\u6d88\u878d\u5b9e\u9a8c\u4e2d\u53ef\u5728 39% \u8bd5\u9a8c\u4e2d\u6062\u590d\u88ab\u79fb\u9664\u4fe1\u53f7\uff0c\u9ad8\u76f8\u5173\u573a\u666f\u63d0\u5347\u81f3 63.9%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Benchmark researchers and developers of large language models (LLMs) and other AI systems need to find relevant evaluations, locate their benchmark datasets and code, and understand the settings behind reported scores. We present Benchmark Radar, a living database and search engine for retrieval and discovery of AI benchmarks, covering LLM evaluation, agentic and tool-use benchmarks, coding, reasoning, safety, and domain-specific evaluations. The system combines daily discovery of benchmark papers, repositories, datasets, and releases with a searchable benchmark catalog, mentions in model cards and technical reports, and score histories. It retains source identities and citations so readers can inspect candidate benchmarks and their evaluation evidence. Daily discovery draws on 37 sources: 13 direct connectors and 24 first-party research and engineering feeds. The catalog contains 1,283 source records drawn from 4 benchmark catalogs and 12,916 numeric observations on 790 records. We describe collection and retrieval, audit the full catalog, and examine benchmark saturation, adoption trends, and the limits of score comparisons. A worked example walks through a complete prior-art search, showing how to query the catalog and inspect benchmark evidence when designing a new evaluation. We release the web dashboard with a benchmark leaderboard, a Pareto frontier view of score against measured use, saturation and trend views, daily feeds, downloadable evidence, a command-line interface (CLI) for offline queries, and reproducible analysis.", "arxiv_id": "2609.11115", "arxiv_url": "https://arxiv.org/abs/2609.11115", "authors": ["Koutian Wu", "Junjie Zhou", "Ergan Shang", "Jiayu Wang", "Pengqian Han", "Junkai Wang", "Wanghan Xu"], "brief": "\u672c\u6587\u4ecb\u7ecd Benchmark Radar\uff0c\u4e00\u4e2a\u6301\u7eed\u66f4\u65b0\u7684 AI \u57fa\u51c6\u6570\u636e\u5e93\u4e0e\u641c\u7d22\u5f15\u64ce\uff0c\u7528\u4e8e\u53d1\u73b0\u548c\u68c0\u7d22\u5927\u6a21\u578b\u3001\u667a\u80fd\u4f53\u3001\u4ee3\u7801\u3001\u63a8\u7406\u3001\u5b89\u5168\u7b49\u8bc4\u6d4b\u57fa\u51c6\u53ca\u5176\u6570\u636e\u3001\u4ee3\u7801\u548c\u5206\u6570\u8bb0\u5f55\u3002\u7cfb\u7edf\u6574\u5408\u591a\u6e90\u6bcf\u65e5\u66f4\u65b0\u3001\u6392\u884c\u699c\u3001\u8d8b\u52bf\u4e0e\u9971\u548c\u5ea6\u5206\u6790\u3001CLI \u548c\u53ef\u590d\u73b0\u8bc1\u636e\uff0c\u5e2e\u52a9\u7814\u7a76\u8005\u66f4\u7cfb\u7edf\u5730\u505a\u57fa\u51c6\u8c03\u7814\u548c\u6bd4\u8f83\u3002", "categories": ["cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11115", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u57fa\u51c6\u8bc4\u6d4b", "\u4fe1\u606f\u68c0\u7d22", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6392\u884c\u699c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11115v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Benchmark Radar: A Living Database and Search Engine for AI Benchmarks and Evaluation", "tldr": "\u672c\u6587\u4ecb\u7ecd Benchmark Radar\uff0c\u4e00\u4e2a\u6301\u7eed\u66f4\u65b0\u7684 AI \u57fa\u51c6\u6570\u636e\u5e93\u4e0e\u641c\u7d22\u5f15\u64ce\uff0c\u7528\u4e8e\u53d1\u73b0\u548c\u68c0\u7d22\u5927\u6a21\u578b\u3001\u667a\u80fd\u4f53\u3001\u4ee3\u7801\u3001\u63a8\u7406\u3001\u5b89\u5168\u7b49\u8bc4\u6d4b\u57fa\u51c6\u53ca\u5176\u6570\u636e\u3001\u4ee3\u7801\u548c\u5206\u6570\u8bb0\u5f55\u3002\u7cfb\u7edf\u6574\u5408\u591a\u6e90\u6bcf\u65e5\u66f4\u65b0\u3001\u6392\u884c\u699c\u3001\u8d8b\u52bf\u4e0e\u9971\u548c\u5ea6\u5206\u6790\u3001CLI \u548c\u53ef\u590d\u73b0\u8bc1\u636e\uff0c\u5e2e\u52a9\u7814\u7a76\u8005\u66f4\u7cfb\u7edf\u5730\u505a\u57fa\u51c6\u8c03\u7814\u548c\u6bd4\u8f83\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The term agent in artificial intelligence lacks a standard definition, complicating the evaluation, comparison, and reproducibility of AI agent research. We address this ambiguity through a survey organized around five dimensions of agenticness: environmental interaction, learning and adaptation, autonomy, goal-directed behavior, and temporal coherence. For each dimension, we examine how the underlying capability has been conceptualized across prior work and synthesize the metrics, benchmarks, and evaluation frameworks used to assess it. This review provides a structured account of the current landscape of agent evaluation, highlighting both established approaches and areas where evaluation remains limited or inconsistent. We additionally introduce the Agent Compendium, a public-facing digital resource that organizes and extends the evaluation methods identified through this review. Together, the survey and compendium provide a common structure for evaluating and comparing agent capabilities across AI systems, supporting more reproducible research, clearer communication, and more systematic study of artificial agents.", "arxiv_id": "2609.11018", "arxiv_url": "https://arxiv.org/abs/2609.11018", "authors": ["Mia Lassiter", "Brinnae Bent"], "brief": "\u8fd9\u7bc7\u7efc\u8ff0\u9488\u5bf9 AI \u667a\u80fd\u4f53\u7f3a\u4e4f\u7edf\u4e00\u5b9a\u4e49\u7684\u95ee\u9898\uff0c\u4ece\u73af\u5883\u4ea4\u4e92\u3001\u5b66\u4e60\u9002\u5e94\u3001\u81ea\u4e3b\u6027\u3001\u76ee\u6807\u5bfc\u5411\u548c\u65f6\u95f4\u4e00\u81f4\u6027\u4e94\u4e2a\u7ef4\u5ea6\u68b3\u7406\u201c\u667a\u80fd\u4f53\u6027\u201d\u3002\u8bba\u6587\u6c47\u603b\u4e86\u76f8\u5173\u6307\u6807\u3001\u57fa\u51c6\u4e0e\u8bc4\u4f30\u6846\u67b6\uff0c\u5e76\u53d1\u5e03 Agent Compendium \u8d44\u6e90\uff0c\u4ee5\u4fc3\u8fdb\u667a\u80fd\u4f53\u80fd\u529b\u7684\u53ef\u6bd4\u8bc4\u4f30\u548c\u53ef\u590d\u73b0\u7814\u7a76\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11018", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u4f30\u57fa\u51c6", "\u7efc\u8ff0", "\u53ef\u590d\u73b0\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11018v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Defining AI Agents: A Compendium of Criteria, Metrics, and Benchmarks", "tldr": "\u8fd9\u7bc7\u7efc\u8ff0\u9488\u5bf9 AI \u667a\u80fd\u4f53\u7f3a\u4e4f\u7edf\u4e00\u5b9a\u4e49\u7684\u95ee\u9898\uff0c\u4ece\u73af\u5883\u4ea4\u4e92\u3001\u5b66\u4e60\u9002\u5e94\u3001\u81ea\u4e3b\u6027\u3001\u76ee\u6807\u5bfc\u5411\u548c\u65f6\u95f4\u4e00\u81f4\u6027\u4e94\u4e2a\u7ef4\u5ea6\u68b3\u7406\u201c\u667a\u80fd\u4f53\u6027\u201d\u3002\u8bba\u6587\u6c47\u603b\u4e86\u76f8\u5173\u6307\u6807\u3001\u57fa\u51c6\u4e0e\u8bc4\u4f30\u6846\u67b6\uff0c\u5e76\u53d1\u5e03 Agent Compendium \u8d44\u6e90\uff0c\u4ee5\u4fc3\u8fdb\u667a\u80fd\u4f53\u80fd\u529b\u7684\u53ef\u6bd4\u8bc4\u4f30\u548c\u53ef\u590d\u73b0\u7814\u7a76\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Datacenter GPU power is the binding constraint on LLM serving capacity, and production serving has shifted to prefill/decode (PD) disaggregation. Deploying NVIDIA\u0027s Max-Q inference profile on a disaggregated B200 system, we found its realized gain modest (+8.6% tokens/J), model-dependent, and carrying a mean end-to-end latency cost (+5.2%) that throughput-only evaluation does not surface; the profile also applies one setting to prefill and decode GPUs that operate in opposite hardware regimes. We hypothesize that the optimal power setting is a property of the deployed (model, quantization, engine, hardware) combination rather than of the GPU class, that each lane warrants its own profile, and that converting SLO headroom into energy safely requires latency-gated calibration under a runtime SLO guard rather than a fixed recipe. We present a phase-decoupled, model-calibrated controller: the prefill lane runs under an SM-clock window whose floor is a latency guarantee by construction, and the decode lane under a power cap placed by automatic calibration just above a measured throughput/latency cliff. Because a disaggregated decode lane draws flat, memory-bound power, the cap binds continuously, the reactive-overshoot weakness that led POLCA to reject capping is absent, and the GPU\u0027s own power manager retains throughput under the cap. On an 8x B200 node serving Qwen3-Coder-480B (FP8) under agentic load, our balanced mode delivers +20.4% tokens/J at +3.5% mean e2e versus +8.6% at +5.2% for Max-Q, a Pareto improvement on both axes. On Qwen3-235B-A22B (NVFP4) every operating mode meets the ITL-p99 SLO in every repetition; both vendor profiles miss it. A decode-actuator A/B shows the calibrated cap beats static clock locks, and a three-day sustained run saves 32.3% of a lane pair\u0027s electricity. Both models are MoE; a dense model recovers roughly 5x less, so we scope our claims to MoE serving.", "arxiv_id": "2609.11133", "arxiv_url": "https://arxiv.org/abs/2609.11133", "authors": ["Jae Gon Kim", "Donghoon Yoo", "Hanyul Ryu", "Sungho Ha", "Juyeon Lee", "Soojung Ryu"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u89e3\u8026\u5f0f LLM \u670d\u52a1\u7684\u5206\u9636\u6bb5\u529f\u8017\u63a7\u5236\uff1aprefill \u4e0e decode \u5206\u522b\u6821\u51c6\u65f6\u949f/\u529f\u7387\u4e0a\u9650\uff0c\u5e76\u7528\u5ef6\u8fdf SLO \u4fdd\u62a4\u907f\u514d\u56fa\u5b9a\u7b56\u7565\u5e26\u6765\u7684\u6027\u80fd\u98ce\u9669\u3002\u5728 B200 \u4e0a\u670d\u52a1 MoE \u6a21\u578b\u65f6\uff0c\u76f8\u6bd4 NVIDIA Max-Q \u83b7\u5f97\u66f4\u9ad8\u80fd\u6548\u4e0e\u66f4\u4f4e\u5ef6\u8fdf\u4ee3\u4ef7\uff0c\u4f8b\u5982 Qwen3-Coder-480B \u4e0a tokens/J \u63d0\u5347 20.4%\uff0c\u4e09\u5929\u8fd0\u884c\u8282\u7701 32.3% \u7535\u529b\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11133", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u670d\u52a1", "\u529f\u8017\u63a7\u5236", "\u6570\u636e\u4e2d\u5fc3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11133v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Phase-Decoupled, Model-Calibrated Power Control for Disaggregated LLM Serving", "tldr": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u89e3\u8026\u5f0f LLM \u670d\u52a1\u7684\u5206\u9636\u6bb5\u529f\u8017\u63a7\u5236\uff1aprefill \u4e0e decode \u5206\u522b\u6821\u51c6\u65f6\u949f/\u529f\u7387\u4e0a\u9650\uff0c\u5e76\u7528\u5ef6\u8fdf SLO \u4fdd\u62a4\u907f\u514d\u56fa\u5b9a\u7b56\u7565\u5e26\u6765\u7684\u6027\u80fd\u98ce\u9669\u3002\u5728 B200 \u4e0a\u670d\u52a1 MoE \u6a21\u578b\u65f6\uff0c\u76f8\u6bd4 NVIDIA Max-Q \u83b7\u5f97\u66f4\u9ad8\u80fd\u6548\u4e0e\u66f4\u4f4e\u5ef6\u8fdf\u4ee3\u4ef7\uff0c\u4f8b\u5982 Qwen3-Coder-480B \u4e0a tokens/J \u63d0\u5347 20.4%\uff0c\u4e09\u5929\u8fd0\u884c\u8282\u7701 32.3% \u7535\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neurosymbolic systems rely on mathematical solvers to guarantee reasoning correctness, yet solvers are fundamentally blind to whether a formal translation maintains strict reference-equivalence to a designated formalization. We formalize this vulnerability as Verdict-Preserving-Unfaithfulness (VPU): a failure mode where an incorrect encoding executes successfully and matches the expected verdict. We theoretically prove that structural, verdict-only verification heuristics are mathematically bounded to chance-level detection on these deceptively valid traces. To resolve this, we introduce Generative Verification (GenV), which distills an offline Z3-equivalence oracle into a reference-free, continuous reference-equivalence score by repurposing the language model\u0027s native vocabulary space. Mechanistic analysis via decision-projected logit lenses and sparse autoencoders shows this generative readout natively extracts precise spatial error coordinates without explicit localization training. Empirically, our oracle-mined verifier (GenV+HN) achieves 0.961 AUROC in reference-equivalence verification, generalizes zero-shot across unseen translators and divergent formal styles, and yields an 11.3-point downstream accuracy gain in agentic test-time compute allocation.", "arxiv_id": "2609.11085", "arxiv_url": "https://arxiv.org/abs/2609.11085", "authors": ["Vikash Singh", "Debargha Ganguly", "Aman Goel", "Ali Torkamani", "Xiaoxue Han", "Joseph Lilien", "Ferhat Erata", "Vipin Chaudhary"], "brief": "\u8bba\u6587\u6307\u51fa\u81ea\u52a8\u5f62\u5f0f\u5316\u4e2d\u5b58\u5728\u201c\u5224\u51b3\u4fdd\u6301\u4f46\u4e0d\u5fe0\u5b9e\u201d\u7684\u6f0f\u6d1e\uff1a\u9519\u8bef\u7ffb\u8bd1\u4e5f\u53ef\u80fd\u901a\u8fc7\u6c42\u89e3\u5668\u5e76\u5f97\u5230\u76f8\u540c\u7ed3\u679c\uff0c\u4e14\u4ec5\u770b\u6c42\u89e3\u5668\u5224\u51b3\u7684\u9a8c\u8bc1\u65b9\u6cd5\u7406\u8bba\u4e0a\u96be\u4ee5\u68c0\u6d4b\u3002\u4f5c\u8005\u63d0\u51fa\u751f\u6210\u5f0f\u9a8c\u8bc1 GenV\uff0c\u5c06\u79bb\u7ebf Z3 \u7b49\u4ef7 oracle \u84b8\u998f\u4e3a\u65e0\u9700\u53c2\u8003\u7b54\u6848\u7684\u8fde\u7eed\u7b49\u4ef7\u8bc4\u5206\uff0c\u5728\u7b49\u4ef7\u9a8c\u8bc1\u4e0a\u8fbe\u5230 0.961 AUROC\uff0c\u5e76\u63d0\u5347\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u5206\u914d\u4e0b\u6e38\u51c6\u786e\u7387 11.3 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11085", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u5f62\u5f0f\u5316", "\u751f\u6210\u5f0f\u5956\u52b1\u6a21\u578b", "\u795e\u7ecf\u7b26\u53f7", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11085v1", "published_at": "2026-09-10", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Solver Verdicts: Generative Reward Models for Autoformalization", "tldr": "\u8bba\u6587\u6307\u51fa\u81ea\u52a8\u5f62\u5f0f\u5316\u4e2d\u5b58\u5728\u201c\u5224\u51b3\u4fdd\u6301\u4f46\u4e0d\u5fe0\u5b9e\u201d\u7684\u6f0f\u6d1e\uff1a\u9519\u8bef\u7ffb\u8bd1\u4e5f\u53ef\u80fd\u901a\u8fc7\u6c42\u89e3\u5668\u5e76\u5f97\u5230\u76f8\u540c\u7ed3\u679c\uff0c\u4e14\u4ec5\u770b\u6c42\u89e3\u5668\u5224\u51b3\u7684\u9a8c\u8bc1\u65b9\u6cd5\u7406\u8bba\u4e0a\u96be\u4ee5\u68c0\u6d4b\u3002\u4f5c\u8005\u63d0\u51fa\u751f\u6210\u5f0f\u9a8c\u8bc1 GenV\uff0c\u5c06\u79bb\u7ebf Z3 \u7b49\u4ef7 oracle \u84b8\u998f\u4e3a\u65e0\u9700\u53c2\u8003\u7b54\u6848\u7684\u8fde\u7eed\u7b49\u4ef7\u8bc4\u5206\uff0c\u5728\u7b49\u4ef7\u9a8c\u8bc1\u4e0a\u8fbe\u5230 0.961 AUROC\uff0c\u5e76\u63d0\u5347\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u5206\u914d\u4e0b\u6e38\u51c6\u786e\u7387 11.3 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the rising demand to decouple objects from 3D scenes, we propose SAMV-DUSt3R, an end-to-end model that injects SAM2 2D masks into MV-DUSt3R reconstruction. A Cross Flow Mask Block uses these masks to steer the network toward the target instance, jointly improving shape accuracy and achieving object-level disentanglement without multi-stage pipelines. To ensure reconstruction stability, a lightweight Spatial RankGNN selects the optimal reference view with a selection accuracy of 73.5\\%. Extensive experiments demonstrate that our method boosts average reconstruction precision by 11\\% across various metrics compared to state-of-the-art baselines. These results reveal a strong instance-disentanglement capability and clear benefits for driving, robotics, AR/VR, and heritage digitisation.", "arxiv_id": "2609.11279", "arxiv_url": "https://arxiv.org/abs/2609.11279", "authors": ["Langxu Zhao", "Zuan Gu", "Yingdan Zhang", "Pengfei Zhao", "Tianhan Gao"], "brief": "\u672c\u6587\u63d0\u51fa SAMV-DUSt3R\uff0c\u5c06 SAM2 \u7684\u4e8c\u7ef4\u5b9e\u4f8b\u63a9\u7801\u6ce8\u5165 MV-DUSt3R \u7a00\u758f\u591a\u89c6\u89d2\u91cd\u5efa\uff0c\u5b9e\u73b0\u9762\u5411\u76ee\u6807\u7269\u4f53\u7684\u4e09\u7ef4\u573a\u666f\u89e3\u8026\u3002\u5176 Cross Flow Mask Block \u63d0\u5347\u5b9e\u4f8b\u5f62\u72b6\u91cd\u5efa\u7cbe\u5ea6\uff0c\u8f7b\u91cf Spatial RankGNN \u9009\u62e9\u6700\u4f73\u53c2\u8003\u89c6\u89d2\uff1b\u5b9e\u9a8c\u663e\u793a\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u5e73\u5747\u91cd\u5efa\u7cbe\u5ea6\u63d0\u5347 11%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11279", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u5b9e\u4f8b\u5206\u5272", "\u591a\u89c6\u89d2", "\u573a\u666f\u89e3\u8026"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11279v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SAMV-DUSt3R: Instance-Centric 3D Scene Decoupling from Sparse Multi-Views", "tldr": "\u672c\u6587\u63d0\u51fa SAMV-DUSt3R\uff0c\u5c06 SAM2 \u7684\u4e8c\u7ef4\u5b9e\u4f8b\u63a9\u7801\u6ce8\u5165 MV-DUSt3R \u7a00\u758f\u591a\u89c6\u89d2\u91cd\u5efa\uff0c\u5b9e\u73b0\u9762\u5411\u76ee\u6807\u7269\u4f53\u7684\u4e09\u7ef4\u573a\u666f\u89e3\u8026\u3002\u5176 Cross Flow Mask Block \u63d0\u5347\u5b9e\u4f8b\u5f62\u72b6\u91cd\u5efa\u7cbe\u5ea6\uff0c\u8f7b\u91cf Spatial RankGNN \u9009\u62e9\u6700\u4f73\u53c2\u8003\u89c6\u89d2\uff1b\u5b9e\u9a8c\u663e\u793a\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u5e73\u5747\u91cd\u5efa\u7cbe\u5ea6\u63d0\u5347 11%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Few-step distillation improves the efficiency of autoregressive (AR) video generation, but often causes diversity collapse: under the same prompt, different noise samples tend to produce highly similar videos with weakened motion dynamics. We analyze this degradation in Distribution Matching Distillation (DMD)-distilled AR video generators and find that, in the autoregressive setting, it takes the form of a structured uncertainty collapse: the mode-seeking bias of DMD maps different noise samples to nearly identical first chunks, and the deterministic AR cache then propagates this collapsed state to all subsequent chunks, turning a local loss of stochasticity at the rollout root into a global suppression of temporal variation. Based on this analysis, we propose Uncertainty DMD, a simple uncertainty-injection framework that restores stochasticity at two key stages of AR generation: a timestep perturbation for the first chunk to increase first-chunk diversity, and a stochastic cache-writing mechanism for later chunks to preserve uncertainty in autoregressive conditioning. The method requires no architectural changes and introduces only lightweight perturbation operations. The same perturbation mechanisms are used during both training and inference. Experiments show that Uncertainty DMD consistently improves diversity and motion dynamics while maintaining comparable per-sample visual quality.", "arxiv_id": "2609.11265", "arxiv_url": "https://arxiv.org/abs/2609.11265", "authors": ["Zixuan Duan", "Xunzhi Xiang", "Yabo Chen", "Xin Zhang", "Changhan Liu", "Haibin Huang", "Chi Zhang", "Qi Fan", "Xuelong Li"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u5c11\u6b65\u81ea\u56de\u5f52\u89c6\u9891\u84b8\u998f\u4e2d\u7684\u591a\u6837\u6027\u5d29\u584c\u73b0\u8c61\uff0c\u6307\u51fa DMD \u7684\u6a21\u5f0f\u5bfb\u4f18\u4f1a\u8ba9\u9996\u4e2a\u89c6\u9891\u5757\u968f\u673a\u6027\u584c\u7f29\uff0c\u5e76\u901a\u8fc7\u786e\u5b9a\u6027 AR \u7f13\u5b58\u4f20\u64ad\u5230\u540e\u7eed\u65f6\u95f4\u6bb5\u3002\u4f5c\u8005\u63d0\u51fa Uncertainty DMD\uff0c\u5728\u9996\u5757\u52a0\u5165\u65f6\u95f4\u6b65\u6270\u52a8\u3001\u5728\u540e\u7eed\u5757\u91c7\u7528\u968f\u673a\u7f13\u5b58\u5199\u5165\uff0c\u65e0\u9700\u6539\u67b6\u6784\u5373\u53ef\u63d0\u5347\u89c6\u9891\u591a\u6837\u6027\u548c\u8fd0\u52a8\u52a8\u6001\uff0c\u540c\u65f6\u4fdd\u6301\u76f8\u8fd1\u753b\u8d28\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11265", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u77e5\u8bc6\u84b8\u998f", "\u81ea\u56de\u5f52\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11265v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Uncertainty DMD: Restoring Diversity in Few-Step Autoregressive Video Distillation", "tldr": "\u8bba\u6587\u5206\u6790\u4e86\u5c11\u6b65\u81ea\u56de\u5f52\u89c6\u9891\u84b8\u998f\u4e2d\u7684\u591a\u6837\u6027\u5d29\u584c\u73b0\u8c61\uff0c\u6307\u51fa DMD \u7684\u6a21\u5f0f\u5bfb\u4f18\u4f1a\u8ba9\u9996\u4e2a\u89c6\u9891\u5757\u968f\u673a\u6027\u584c\u7f29\uff0c\u5e76\u901a\u8fc7\u786e\u5b9a\u6027 AR \u7f13\u5b58\u4f20\u64ad\u5230\u540e\u7eed\u65f6\u95f4\u6bb5\u3002\u4f5c\u8005\u63d0\u51fa Uncertainty DMD\uff0c\u5728\u9996\u5757\u52a0\u5165\u65f6\u95f4\u6b65\u6270\u52a8\u3001\u5728\u540e\u7eed\u5757\u91c7\u7528\u968f\u673a\u7f13\u5b58\u5199\u5165\uff0c\u65e0\u9700\u6539\u67b6\u6784\u5373\u53ef\u63d0\u5347\u89c6\u9891\u591a\u6837\u6027\u548c\u8fd0\u52a8\u52a8\u6001\uff0c\u540c\u65f6\u4fdd\u6301\u76f8\u8fd1\u753b\u8d28\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time adaptation (TTA) offers many ways to update a deployed model without labels, but choosing the wrong update can make a strong source model worse. Recent methods therefore try to predict which adaptation will work from unlabeled test data. We ask a prior question: does the evidence given to the selector contain enough information to determine the best action at all? We show that this is not guaranteed, even with a perfect selector. If an observation channel makes two deployments look the same while their TTA rankings differ, reliable selection is impossible from that channel; richer evidence can restore the decision only when it resolves the relevant ambiguity. We make this boundary exact in a finite-batch Gaussian TTA model, where doing nothing beats mean recentering for small shifts, recentering wins beyond a unique critical shift, and the boundary shrinks as $1/\\sqrt n$. Public benchmark studies on CIFAR-100-C and DomainNet-126 show the same failure mode with modern TTA methods: changing only deployment structure can reverse the oracle action while global order-blind evidence remains unchanged. The result is a practical way to separate two failure modes that are usually mixed together: a weak selector versus an information channel that cannot support the desired decision in the first place.", "arxiv_id": "2609.11235", "arxiv_url": "https://arxiv.org/abs/2609.11235", "authors": ["Kartik Jhawar", "Lipo Wang"], "brief": "\u672c\u6587\u7814\u7a76\u65e0\u6807\u7b7e\u8bc1\u636e\u662f\u5426\u8db3\u4ee5\u51b3\u5b9a\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\uff08TTA\uff09\u7684\u6700\u4f73\u66f4\u65b0\u7b56\u7565\uff0c\u6307\u51fa\u5373\u4f7f\u9009\u62e9\u5668\u5b8c\u7f8e\uff0c\u82e5\u89c2\u6d4b\u901a\u9053\u65e0\u6cd5\u533a\u5206\u90e8\u7f72\u5dee\u5f02\uff0c\u4e5f\u53ef\u80fd\u65e0\u6cd5\u53ef\u9760\u9009\u62e9\u3002\u4f5c\u8005\u5728\u6709\u9650\u6279\u91cf\u9ad8\u65af\u6a21\u578b\u4e2d\u7ed9\u51fa\u53ef\u8bc6\u522b\u8fb9\u754c\uff0c\u5e76\u5728 CIFAR-100-C\u3001DomainNet-126 \u4e0a\u9a8c\u8bc1\u73b0\u4ee3 TTA \u65b9\u6cd5\u4e5f\u5b58\u5728\u8be5\u5931\u6548\u6a21\u5f0f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11235", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u9886\u57df\u6cdb\u5316", "\u53ef\u8bc6\u522b\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11235v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When is Test-Time Adaptation Identifiable From Unlabeled Evidence?", "tldr": "\u672c\u6587\u7814\u7a76\u65e0\u6807\u7b7e\u8bc1\u636e\u662f\u5426\u8db3\u4ee5\u51b3\u5b9a\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94\uff08TTA\uff09\u7684\u6700\u4f73\u66f4\u65b0\u7b56\u7565\uff0c\u6307\u51fa\u5373\u4f7f\u9009\u62e9\u5668\u5b8c\u7f8e\uff0c\u82e5\u89c2\u6d4b\u901a\u9053\u65e0\u6cd5\u533a\u5206\u90e8\u7f72\u5dee\u5f02\uff0c\u4e5f\u53ef\u80fd\u65e0\u6cd5\u53ef\u9760\u9009\u62e9\u3002\u4f5c\u8005\u5728\u6709\u9650\u6279\u91cf\u9ad8\u65af\u6a21\u578b\u4e2d\u7ed9\u51fa\u53ef\u8bc6\u522b\u8fb9\u754c\uff0c\u5e76\u5728 CIFAR-100-C\u3001DomainNet-126 \u4e0a\u9a8c\u8bc1\u73b0\u4ee3 TTA \u65b9\u6cd5\u4e5f\u5b58\u5728\u8be5\u5931\u6548\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most Deepfake detectors report near-perfect AUC scores on their reference benchmarks. However, a recent ICML position paper argues that these evaluations collectively neglect the impact of modern smartphone photography: the widely used on-device neural image-signal processing pipelines (like multi-sensor fusion or noise and motion-blur suppression) increasingly shift the imaging paradigm from simple lens projections towards computational photography. Hence, devices actually generate, rather than record photos. This increases the risk that deepfake detectors may flag ordinary phone photos as fake. Due to the lack of large-scale datasets containing images from modern smartphones, this hypothesis has so far only been tested in small proof-of-concept studies. The aim of this paper is to close this gap. We introduce LAION-Mobile, an open dataset containing about 1 million smartphone images with EXIF metadata distilled from re-LAION-5B. Evaluating twelve state-of-the-art deepfake detectors with their original paper checkpoints on a 9,115-image evaluation sample of this pool (DIRE on 738), we report three key findings: (i) On modern AI content no detector exceeds AUC 0.624, and five of twelve fall below chance. (ii) Real-photo false-alarm rates are an artefact of threshold calibration: thresholds fitted on legacy GAN data make several detectors look deployable (less than 11 percent FPR), yet the same detectors flag 17-91 percent of real photos once the identical criterion is refit on modern content. (iii) Consequently, no detector both beats chance on modern AI content and keeps a deployable real-photo false-alarm rate. Mirroring the device mix of web collections, the corpus probes the first neural-ISP generation (2018-2020); current flagships are essentially absent, leaving the modern-ISP regime as the open gap.", "arxiv_id": "2609.11134", "arxiv_url": "https://arxiv.org/abs/2609.11134", "authors": ["Achim von Stryk", "Janis Keuper"], "brief": "\u8bba\u6587\u53d1\u5e03 LAION-Mobile\uff0c\u4e00\u4e2a\u4ece re-LAION-5B \u63d0\u53d6\u7684\u7ea6\u767e\u4e07\u5f20\u5e26 EXIF \u5143\u6570\u636e\u7684\u667a\u80fd\u624b\u673a\u7167\u7247\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b\u5668\u5728\u771f\u5b9e\u624b\u673a\u6444\u5f71\u4e0a\u7684\u53ef\u9760\u6027\u3002\u5bf9 12 \u4e2a\u4e3b\u6d41\u68c0\u6d4b\u5668\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u5b83\u4eec\u5728\u73b0\u4ee3 AI \u5185\u5bb9\u4e0a\u8868\u73b0\u5f88\u5f31\uff0c\u4e14\u9608\u503c\u6821\u51c6\u4f1a\u5bfc\u81f4\u771f\u5b9e\u624b\u673a\u7167\u7247\u88ab\u5927\u91cf\u8bef\u62a5\u4e3a\u4f2a\u9020\uff0c\u5c1a\u65e0\u65b9\u6cd5\u80fd\u540c\u65f6\u6709\u6548\u68c0\u6d4b\u73b0\u4ee3\u751f\u6210\u5185\u5bb9\u5e76\u4fdd\u6301\u4f4e\u8bef\u62a5\u7387\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11134", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b", "\u6570\u636e\u96c6", "\u8ba1\u7b97\u6444\u5f71", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11134v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LAION-Mobile: Evaluating Deepfake Detectors On One Million Smartphone Photos", "tldr": "\u8bba\u6587\u53d1\u5e03 LAION-Mobile\uff0c\u4e00\u4e2a\u4ece re-LAION-5B \u63d0\u53d6\u7684\u7ea6\u767e\u4e07\u5f20\u5e26 EXIF \u5143\u6570\u636e\u7684\u667a\u80fd\u624b\u673a\u7167\u7247\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6df1\u5ea6\u4f2a\u9020\u68c0\u6d4b\u5668\u5728\u771f\u5b9e\u624b\u673a\u6444\u5f71\u4e0a\u7684\u53ef\u9760\u6027\u3002\u5bf9 12 \u4e2a\u4e3b\u6d41\u68c0\u6d4b\u5668\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u5b83\u4eec\u5728\u73b0\u4ee3 AI \u5185\u5bb9\u4e0a\u8868\u73b0\u5f88\u5f31\uff0c\u4e14\u9608\u503c\u6821\u51c6\u4f1a\u5bfc\u81f4\u771f\u5b9e\u624b\u673a\u7167\u7247\u88ab\u5927\u91cf\u8bef\u62a5\u4e3a\u4f2a\u9020\uff0c\u5c1a\u65e0\u65b9\u6cd5\u80fd\u540c\u65f6\u6709\u6548\u68c0\u6d4b\u73b0\u4ee3\u751f\u6210\u5185\u5bb9\u5e76\u4fdd\u6301\u4f4e\u8bef\u62a5\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neural audio codecs are a fundamental component of modern speech generation systems. While recent codecs achieve increasingly low bitrates, reducing frame rate remains challenging, as each token must preserve more information while maintaining reconstruction quality. We present ZipCodec, a streaming neural speech codec operating at 6.25 Hz and 0.80 kbps with a theoretical latency of 160 ms. Our approach combines large-scale WavLM distillation with a redesigned transformer-based architecture, a scalar spherical quantizer, and a latency-aware streaming decoder. Experiments show that ZipCodec substantially outperforms existing streaming codecs at comparable bitrates in both reconstruction and downstream tasks, while operating at a significantly lower frame rate. Despite its 842M parameters, ZipCodec achieves real-time single-stream inference on a consumer-grade CPU. Demo samples, code and checkpoints are available at https://lucadellalib.github.io/zipcodec-web/.", "arxiv_id": "2609.11642", "arxiv_url": "https://arxiv.org/abs/2609.11642", "authors": ["Luca Della Libera", "Cem Subakan", "Mirco Ravanelli"], "brief": "ZipCodec \u63d0\u51fa\u4e00\u79cd\u8d85\u4f4e\u5e27\u7387\u6d41\u5f0f\u795e\u7ecf\u8bed\u97f3\u7f16\u7801\u5668\uff0c\u4ee5 6.25 Hz\u30010.80 kbps \u5de5\u4f5c\uff0c\u7406\u8bba\u5ef6\u8fdf\u4e3a 160 ms\u3002\u5b83\u7ed3\u5408 WavLM \u84b8\u998f\u3001Transformer \u67b6\u6784\u3001\u7403\u9762\u6807\u91cf\u91cf\u5316\u548c\u4f4e\u5ef6\u8fdf\u89e3\u7801\uff0c\u5728\u91cd\u5efa\u8d28\u91cf\u548c\u4e0b\u6e38\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u540c\u7801\u7387\u6d41\u5f0f\u7f16\u7801\u5668\uff0c\u5e76\u53ef\u5728\u6d88\u8d39\u7ea7 CPU \u5b9e\u65f6\u63a8\u7406\u3002", "categories": ["cs.SD", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11642", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u7f16\u7801", "\u6d41\u5f0f\u97f3\u9891", "\u795e\u7ecf\u7f16\u89e3\u7801", "\u6a21\u578b\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11642v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ZipCodec: Ultra-Low-Frame-Rate Streaming Speech Coding", "tldr": "ZipCodec \u63d0\u51fa\u4e00\u79cd\u8d85\u4f4e\u5e27\u7387\u6d41\u5f0f\u795e\u7ecf\u8bed\u97f3\u7f16\u7801\u5668\uff0c\u4ee5 6.25 Hz\u30010.80 kbps \u5de5\u4f5c\uff0c\u7406\u8bba\u5ef6\u8fdf\u4e3a 160 ms\u3002\u5b83\u7ed3\u5408 WavLM \u84b8\u998f\u3001Transformer \u67b6\u6784\u3001\u7403\u9762\u6807\u91cf\u91cf\u5316\u548c\u4f4e\u5ef6\u8fdf\u89e3\u7801\uff0c\u5728\u91cd\u5efa\u8d28\u91cf\u548c\u4e0b\u6e38\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u540c\u7801\u7387\u6d41\u5f0f\u7f16\u7801\u5668\uff0c\u5e76\u53ef\u5728\u6d88\u8d39\u7ea7 CPU \u5b9e\u65f6\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The energy transition is reshaping residential electricity consumption through the increasing adoption of distributed generation, electrified appliances, and demand-response programs. Understanding these evolving behaviors requires access to granular smart-meter data for applications such as load forecasting, appliance detection, and demand-side flexibility analysis. However, such data are subject to strict access restrictions and data-protection regulations. Thus, realistic synthetic alternatives are necessary. In this paper, we introduce LoaDiff, a diffusion-based generative model for year-long, sub-hourly smart-meter load curves. LoaDiff supports flexible conditioning on static household attributes, such as appliance ownership, and dynamic contextual variables, including calendar information and outdoor temperature. We evaluate the model against multiple generative baselines on three residential electricity-consumption datasets. Our experiments assess four complementary dimensions: fidelity and diversity, training-record memorization risk, downstream utility for load forecasting and appliance detection, and conditional controllability under alternative temperature conditions. The results show that LoaDiff generates realistic and diverse load profiles, achieves a favorable trade-off between generation quality and limited evidence of memorization, preserves information useful for downstream energy applications, and responds coherently to changes in conditioning variables.", "arxiv_id": "2609.11639", "arxiv_url": "https://arxiv.org/abs/2609.11639", "authors": ["Mariia Baranova", "Adrien Petralia", "Etienne Le Naour", "Nathan Etourneau", "Guillaume Hofmann", "Themis Palpanas"], "brief": "\u8bba\u6587\u63d0\u51fa LoaDiff\uff0c\u4e00\u4e2a\u7528\u4e8e\u751f\u6210\u5168\u5e74\u4e9a\u5c0f\u65f6\u7ea7\u667a\u80fd\u7535\u8868\u7528\u7535\u66f2\u7ebf\u7684\u6761\u4ef6\u6269\u6563\u6a21\u578b\uff0c\u53ef\u7ed3\u5408\u5bb6\u7535\u62e5\u6709\u60c5\u51b5\u3001\u65e5\u5386\u4fe1\u606f\u548c\u5ba4\u5916\u6e29\u5ea6\u7b49\u9759\u6001/\u52a8\u6001\u6761\u4ef6\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u771f\u5b9e\u6027\u3001\u591a\u6837\u6027\u3001\u4e0b\u6e38\u8d1f\u8377\u9884\u6d4b\u4e0e\u5bb6\u7535\u68c0\u6d4b\u6548\u7528\u3001\u6761\u4ef6\u53ef\u63a7\u6027\u65b9\u9762\u4f18\u4e8e\u6216\u63a5\u8fd1\u591a\u79cd\u57fa\u7ebf\uff0c\u540c\u65f6\u8bb0\u5fc6\u8bad\u7ec3\u6570\u636e\u7684\u98ce\u9669\u8f83\u4f4e\u3002", "categories": ["cs.LG", "cs.AI", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11639", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u65f6\u95f4\u5e8f\u5217\u751f\u6210", "\u80fd\u6e90\u5206\u6790", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11639v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LoaDiff: Conditional Generation of Electricity Consumption Time Series for Energy Analytics", "tldr": "\u8bba\u6587\u63d0\u51fa LoaDiff\uff0c\u4e00\u4e2a\u7528\u4e8e\u751f\u6210\u5168\u5e74\u4e9a\u5c0f\u65f6\u7ea7\u667a\u80fd\u7535\u8868
