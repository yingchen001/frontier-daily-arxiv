\u7528\u7535\u66f2\u7ebf\u7684\u6761\u4ef6\u6269\u6563\u6a21\u578b\uff0c\u53ef\u7ed3\u5408\u5bb6\u7535\u62e5\u6709\u60c5\u51b5\u3001\u65e5\u5386\u4fe1\u606f\u548c\u5ba4\u5916\u6e29\u5ea6\u7b49\u9759\u6001/\u52a8\u6001\u6761\u4ef6\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u771f\u5b9e\u6027\u3001\u591a\u6837\u6027\u3001\u4e0b\u6e38\u8d1f\u8377\u9884\u6d4b\u4e0e\u5bb6\u7535\u68c0\u6d4b\u6548\u7528\u3001\u6761\u4ef6\u53ef\u63a7\u6027\u65b9\u9762\u4f18\u4e8e\u6216\u63a5\u8fd1\u591a\u79cd\u57fa\u7ebf\uff0c\u540c\u65f6\u8bb0\u5fc6\u8bad\u7ec3\u6570\u636e\u7684\u98ce\u9669\u8f83\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Domain practitioners understand their business constraints but may lack operations-research expertise or dedicated support. LLM-based optimization agents translate natural-language requirements into models or solver programs that established optimization tools can execute. This progress makes optimization more accessible, but real-world operations are dynamic: changing demand, resources, and priorities require updates to data, constraints, and objectives. Methods centered on isolated requests offer limited support for rapid adaptation that preserves earlier decisions and reuses useful search results. We introduce MAPLE (Memory-Augmented Planning with Language and Evolution), an agent for maintaining optimization problems through successive natural-language requests. MAPLE combines language-based problem construction with mathematical programming and evolutionary search. It retains the optimization program, accepted plans, earlier updates, and candidate solutions for subsequent requests. We introduce NLDO, a benchmark of 15 trajectories and 180 updates spanning selection, scheduling, rostering, routing, and cloud-resource placement. In the main evaluation, MAPLE completes all trajectories and achieves online scalar quality of 0.951 and a Pareto hypervolume ratio of 0.875. Controlled comparisons further show that maintaining executable state improves update validity and can preserve useful search information across substantial revisions.", "arxiv_id": "2609.11636", "arxiv_url": "https://arxiv.org/abs/2609.11636", "authors": ["Kesheng Chen", "Yamin Hu", "Wenjian Luo"], "brief": "MAPLE \u662f\u4e00\u4e2a\u9762\u5411\u52a8\u6001\u4f18\u5316\u95ee\u9898\u7684\u667a\u80fd\u4f53\uff0c\u53ef\u901a\u8fc7\u8fde\u7eed\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u7ef4\u62a4\u548c\u66f4\u65b0\u4f18\u5316\u6a21\u578b\u3002\u5b83\u7ed3\u5408\u8bed\u8a00\u5efa\u6a21\u3001\u6570\u5b66\u89c4\u5212\u4e0e\u8fdb\u5316\u641c\u7d22\uff0c\u5e76\u5229\u7528\u8bb0\u5fc6\u4fdd\u7559\u7a0b\u5e8f\u3001\u5386\u53f2\u65b9\u6848\u548c\u5019\u9009\u89e3\uff0c\u5728 NLDO \u57fa\u51c6\u4e0a\u5b8c\u6210\u6240\u6709\u8f68\u8ff9\u5e76\u53d6\u5f97\u8f83\u9ad8\u5728\u7ebf\u8d28\u91cf\u4e0e\u5e15\u7d2f\u6258\u8d85\u4f53\u79ef\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11636", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4f18\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8fdb\u5316\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11636v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MAPLE: Memory-Augmented Planning with Language and Evolution", "tldr": "MAPLE \u662f\u4e00\u4e2a\u9762\u5411\u52a8\u6001\u4f18\u5316\u95ee\u9898\u7684\u667a\u80fd\u4f53\uff0c\u53ef\u901a\u8fc7\u8fde\u7eed\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u7ef4\u62a4\u548c\u66f4\u65b0\u4f18\u5316\u6a21\u578b\u3002\u5b83\u7ed3\u5408\u8bed\u8a00\u5efa\u6a21\u3001\u6570\u5b66\u89c4\u5212\u4e0e\u8fdb\u5316\u641c\u7d22\uff0c\u5e76\u5229\u7528\u8bb0\u5fc6\u4fdd\u7559\u7a0b\u5e8f\u3001\u5386\u53f2\u65b9\u6848\u548c\u5019\u9009\u89e3\uff0c\u5728 NLDO \u57fa\u51c6\u4e0a\u5b8c\u6210\u6240\u6709\u8f68\u8ff9\u5e76\u53d6\u5f97\u8f83\u9ad8\u5728\u7ebf\u8d28\u91cf\u4e0e\u5e15\u7d2f\u6258\u8d85\u4f53\u79ef\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this work, we develop an inverse Physics-Informed Neural Network (PINN) framework to infer the dependence of the scrape-off layer (SOL) perpendicular heat conductivity on plasma density and temperature, $\u03ba_\\perp(n,T)$. The method combines radial profile measurements of electron density and temperature with the residual of a reduced one-dimensional SOL transport equation, so that the inferred conductivity is constrained by both the measurements and the underlying transport model. Three neural networks are trained simultaneously: two reconstruct the temperature and density profiles as functions of the radial coordinate and transported power, while a third represents the effective conductivity as a function of the local density and temperature. The framework is first validated using synthetic data generated from a prescribed conductivity function, allowing the inferred $\u03ba_\\perp(n,T)$ to be compared directly with the ground truth. The model recovers the imposed functional dependence with errors below $10~\\%$ in the data-constrained region. Bootstrap resampling is shown to provide a practical indicator of prediction reliability and consistency. A scan in the number of plasma profiles used for training and the number of radial measurement positions per profile identifies a practical trade-off between reconstruction accuracy and data availability. Finally, the method is applied to an experimental dataset from the TJ-II stellarator obtained with the helium-beam diagnostic. This exploratory application provides an initial estimate of the effective SOL conductivity and illustrates the potential of inverse PINNs for extracting transport information from plasma edge measurements.", "arxiv_id": "2609.11628", "arxiv_url": "https://arxiv.org/abs/2609.11628", "authors": ["J. Gallego", "P. Protopapas", "A. Bustos", "A. Alonso", "S. Barquero", "A. Baciero", "I. Rivera", "J. A. Mor\u00ed\u00f1igo", "R. Mayo-Garc\u00eda"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9006\u5411\u7269\u7406\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc\uff08PINN\uff09\u6846\u67b6\uff0c\u7528\u7b49\u79bb\u5b50\u4f53\u8fb9\u7f18\u5f84\u5411\u5bc6\u5ea6\u3001\u6e29\u5ea6\u6d4b\u91cf\u548c\u7b80\u5316\u8f93\u8fd0\u65b9\u7a0b\u6b8b\u5dee\u5171\u540c\u7ea6\u675f\uff0c\u63a8\u65ad\u4eff\u661f\u5668\u522e\u524a\u5c42\u4e2d\u7684\u5782\u76f4\u70ed\u5bfc\u7387\u968f\u5bc6\u5ea6\u548c\u6e29\u5ea6\u7684\u5173\u7cfb\u3002\u5408\u6210\u6570\u636e\u9a8c\u8bc1\u4e2d\uff0c\u5728\u6709\u6570\u636e\u7ea6\u675f\u533a\u57df\u53ef\u5c06\u5bfc\u70ed\u7387\u51fd\u6570\u6062\u590d\u5230\u4f4e\u4e8e10%\u7684\u8bef\u5dee\uff0c\u5e76\u7528bootstrap\u8bc4\u4f30\u53ef\u9760\u6027\uff1b\u5728TJ-II\u5b9e\u9a8c\u6570\u636e\u4e0a\u7684\u521d\u6b65\u5e94\u7528\u5c55\u793a\u4e86\u4ece\u8fb9\u7f18\u6d4b\u91cf\u4e2d\u63d0\u53d6\u8f93\u8fd0\u4fe1\u606f\u7684\u6f5c\u529b\u3002", "categories": ["physics.plasm-ph", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11628", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7269\u7406\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc", "\u7b49\u79bb\u5b50\u4f53", "\u53cd\u95ee\u9898", "\u8f93\u8fd0\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11628v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Physics-Informed Neural Networks to Infer the Perpendicular Energy Conductivity in the Scrape-Off Layer of Stellarator Devices", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9006\u5411\u7269\u7406\u4fe1\u606f\u795e\u7ecf\u7f51\u7edc\uff08PINN\uff09\u6846\u67b6\uff0c\u7528\u7b49\u79bb\u5b50\u4f53\u8fb9\u7f18\u5f84\u5411\u5bc6\u5ea6\u3001\u6e29\u5ea6\u6d4b\u91cf\u548c\u7b80\u5316\u8f93\u8fd0\u65b9\u7a0b\u6b8b\u5dee\u5171\u540c\u7ea6\u675f\uff0c\u63a8\u65ad\u4eff\u661f\u5668\u522e\u524a\u5c42\u4e2d\u7684\u5782\u76f4\u70ed\u5bfc\u7387\u968f\u5bc6\u5ea6\u548c\u6e29\u5ea6\u7684\u5173\u7cfb\u3002\u5408\u6210\u6570\u636e\u9a8c\u8bc1\u4e2d\uff0c\u5728\u6709\u6570\u636e\u7ea6\u675f\u533a\u57df\u53ef\u5c06\u5bfc\u70ed\u7387\u51fd\u6570\u6062\u590d\u5230\u4f4e\u4e8e10%\u7684\u8bef\u5dee\uff0c\u5e76\u7528bootstrap\u8bc4\u4f30\u53ef\u9760\u6027\uff1b\u5728TJ-II\u5b9e\u9a8c\u6570\u636e\u4e0a\u7684\u521d\u6b65\u5e94\u7528\u5c55\u793a\u4e86\u4ece\u8fb9\u7f18\u6d4b\u91cf\u4e2d\u63d0\u53d6\u8f93\u8fd0\u4fe1\u606f\u7684\u6f5c\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper presents a novel approach for data-driven self-learning control of highly flexible, modular manufacturing systems. Specifically, we employ a novel framework for model-based reinforcement learning which introduces approximate inverse process models within the training of reinforcement policies. This approach disentangles the learning of actuation dynamics and the dynamics in state space, resulting in RL-based training solely within the task space. We propose a lightweight feedforward architecture for approximate inverse models and integrate them within the policy network of standard RL algorithms. We apply the approach to a laboratory modular production testbed with heterogeneous production modules. The results underline the efficiency improvements for modular manufacturing units in terms of both performance and training speed, particularly for off-policy algorithms.", "arxiv_id": "2609.11615", "arxiv_url": "https://arxiv.org/abs/2609.11615", "authors": ["Andreas Schwung", "Steve Yuwono", "Sofiene Lassoued", "Dorothea Schwung"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u6a21\u5757\u5316\u5236\u9020\u7cfb\u7edf\u7684\u6a21\u578b\u5f0f\u5f3a\u5316\u5b66\u4e60\u63a7\u5236\u6846\u67b6\uff0c\u5728\u7b56\u7565\u8bad\u7ec3\u4e2d\u5f15\u5165\u8fd1\u4f3c\u9006\u8fc7\u7a0b\u6a21\u578b\uff0c\u5c06\u6267\u884c\u5668\u52a8\u6001\u4e0e\u72b6\u6001\u7a7a\u95f4\u52a8\u6001\u89e3\u8026\u3002\u8be5\u65b9\u6cd5\u5728\u5b9e\u9a8c\u5ba4\u6a21\u5757\u5316\u751f\u4ea7\u5e73\u53f0\u4e0a\u63d0\u5347\u4e86\u63a7\u5236\u6027\u80fd\u4e0e\u8bad\u7ec3\u901f\u5ea6\uff0c\u5c24\u5176\u5bf9\u79bb\u7b56\u7565\u7b97\u6cd5\u6548\u679c\u66f4\u660e\u663e\u3002", "categories": ["cs.AI", "cs.LG", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11615", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u5f0f\u5b66\u4e60", "\u5de5\u4e1a\u63a7\u5236", "\u6a21\u5757\u5316\u5236\u9020"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11615v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Distributed Optimization of Modular Production Systems using Model-based Reinforcement Learning with Inverse Models", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u6a21\u5757\u5316\u5236\u9020\u7cfb\u7edf\u7684\u6a21\u578b\u5f0f\u5f3a\u5316\u5b66\u4e60\u63a7\u5236\u6846\u67b6\uff0c\u5728\u7b56\u7565\u8bad\u7ec3\u4e2d\u5f15\u5165\u8fd1\u4f3c\u9006\u8fc7\u7a0b\u6a21\u578b\uff0c\u5c06\u6267\u884c\u5668\u52a8\u6001\u4e0e\u72b6\u6001\u7a7a\u95f4\u52a8\u6001\u89e3\u8026\u3002\u8be5\u65b9\u6cd5\u5728\u5b9e\u9a8c\u5ba4\u6a21\u5757\u5316\u751f\u4ea7\u5e73\u53f0\u4e0a\u63d0\u5347\u4e86\u63a7\u5236\u6027\u80fd\u4e0e\u8bad\u7ec3\u901f\u5ea6\uff0c\u5c24\u5176\u5bf9\u79bb\u7b56\u7565\u7b97\u6cd5\u6548\u679c\u66f4\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When forecasting a firm\u0027s future financial performance, alternative data - data collected from non-traditional sources such as consumer transactions, web traffic, and prediction markets - can provide timely signals about firms\u0027 operating activities and broader market conditions. These signals may reveal information that is not captured by traditional public sources and can therefore provide complementary information for forecasting firms\u0027 future financial performance. However, firm-level alternative data often have limited historical coverage, are relevant only to specific prediction targets or subsets of firms, and are distributed across numerous heterogeneous channels, making them difficult to incorporate flexibly into conventional forecasting approaches. Meanwhile, large language models (LLMs) can interpret instructions, learn from in-context examples, and generate predictions by combining heterogeneous information without task-specific parameter updates. Motivated by this potential flexibility, we investigate whether an LLM can forecast firm performance by integrating alternative data with other financial information through in-context learning. We propose a two-agent framework that first identifies the firms for which each alternative data channel is likely to be informative and then predicts revenue using firm- and channel-specific context. We evaluate the framework across four commercial alternative data channels. In our experiments, adding alternative data in context alongside other financial information improves the LLM\u0027s forecasting relative to either source alone, and these forecasts are more accurate than those of standard forecasting baselines. These findings suggest that LLMs provide a flexible and practical approach to integrating alternative data with heterogeneous financial information.", "arxiv_id": "2609.11607", "arxiv_url": "https://arxiv.org/abs/2609.11607", "authors": ["Jihoon Kwon", "Lawrence Liu", "Daekyung Park", "Sumin Kim", "Haverty Jack", "Hoyoung Lee", "Katherine Bjorkman", "Josh McKenney", "Peter Laurelli", "Nicole Kagan", "Zach Golkhou", "Thorsten Neumann", "Edward Tong", "Pete Petersen", "Yoon Kim", "Alejandro Lopez-Lira", "Yongjae Lee", "Chanyeol Choi"], "brief": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u7528\u5927\u8bed\u8a00\u6a21\u578b\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u6574\u5408\u4ea4\u6613\u3001\u7f51\u7ad9\u6d41\u91cf\u3001\u9884\u6d4b\u5e02\u573a\u7b49\u53e6\u7c7b\u6570\u636e\u6765\u9884\u6d4b\u4f01\u4e1a\u6536\u5165\u3002\u63d0\u51fa\u4e24\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5148\u5224\u65ad\u7279\u5b9a\u53e6\u7c7b\u6570\u636e\u6e20\u9053\u5bf9\u54ea\u4e9b\u516c\u53f8\u6709\u7528\uff0c\u518d\u7ed3\u5408\u516c\u53f8\u4e0e\u6e20\u9053\u4e0a\u4e0b\u6587\u8fdb\u884c\u9884\u6d4b\uff1b\u5b9e\u9a8c\u663e\u793a\uff0c\u52a0\u5165\u53e6\u7c7b\u6570\u636e\u540e\u9884\u6d4b\u7cbe\u5ea6\u4f18\u4e8e\u5355\u4e00\u4fe1\u606f\u6e90\u548c\u4f20\u7edf\u57fa\u7ebf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11607", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u91d1\u878d\u9884\u6d4b", "\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11607v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Making Alternative Data Work: Context-Augmented LLMs for Financial Forecasting", "tldr": "\u672c\u6587\u7814\u7a76\u5982\u4f55\u7528\u5927\u8bed\u8a00\u6a21\u578b\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u6574\u5408\u4ea4\u6613\u3001\u7f51\u7ad9\u6d41\u91cf\u3001\u9884\u6d4b\u5e02\u573a\u7b49\u53e6\u7c7b\u6570\u636e\u6765\u9884\u6d4b\u4f01\u4e1a\u6536\u5165\u3002\u63d0\u51fa\u4e24\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5148\u5224\u65ad\u7279\u5b9a\u53e6\u7c7b\u6570\u636e\u6e20\u9053\u5bf9\u54ea\u4e9b\u516c\u53f8\u6709\u7528\uff0c\u518d\u7ed3\u5408\u516c\u53f8\u4e0e\u6e20\u9053\u4e0a\u4e0b\u6587\u8fdb\u884c\u9884\u6d4b\uff1b\u5b9e\u9a8c\u663e\u793a\uff0c\u52a0\u5165\u53e6\u7c7b\u6570\u636e\u540e\u9884\u6d4b\u7cbe\u5ea6\u4f18\u4e8e\u5355\u4e00\u4fe1\u606f\u6e90\u548c\u4f20\u7edf\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Boundary representation (B-rep) is the standard format used by modern CAD systems for parametric 3D models. It turns out, the exact same solid can be represented by different B-reps: for example, two engineers using different operations, a geometry kernel rebuilding the file, and an export setting repartitioning faces will lead to different B-reps even though the underlying solid remains the same. We show that existing B-rep encoders are not robust to variation in the B-rep with the same solid on perturbations applied to standard benchmarks, naturally occurring variations inherent to CAD software, and differences in how designers model the same part via a human dataset we created in FreeCAD. The performance of popular B-rep encoders often collapses catastrophically. We propose the canonical region graph, an input representation whose nodes, features and coordinate frame are derived from the solid itself and show theoretical invariance guarantees on repartitioning and rigid motions. It matches the strongest baseline on standard benchmarks, and is stable under every perturbation we test.", "arxiv_id": "2609.11573", "arxiv_url": "https://arxiv.org/abs/2609.11573", "authors": ["Heinrich Jiang", "Hager Yasser Mohamed", "Alexander Hitt", "Valeriia Lomakina", "Henning Jiang", "Jennifer Jang"], "brief": "\u8bba\u6587\u6307\u51fa\u540c\u4e00CAD\u5b9e\u4f53\u53ef\u5bf9\u5e94\u591a\u79cd\u4e0d\u540cB-rep\u6587\u4ef6\u8868\u793a\uff0c\u73b0\u6709B-rep\u7f16\u7801\u5668\u5728\u8fd9\u79cd\u8868\u793a\u53d8\u5316\u4e0b\u9c81\u68d2\u6027\u5f88\u5dee\uff0c\u6027\u80fd\u53ef\u80fd\u4e25\u91cd\u5d29\u6e83\u3002\u4f5c\u8005\u63d0\u51fa\u4ece\u5b9e\u4f53\u672c\u8eab\u5bfc\u51fa\u7684\u89c4\u8303\u533a\u57df\u56fe\uff0c\u5177\u5907\u5bf9\u91cd\u5206\u5272\u548c\u521a\u4f53\u8fd0\u52a8\u7684\u4e0d\u53d8\u6027\uff0c\u5728\u6807\u51c6\u57fa\u51c6\u4e0a\u4fdd\u6301\u5f3a\u57fa\u7ebf\u6027\u80fd\uff0c\u5e76\u5728\u591a\u79cd\u6270\u52a8\u4e0b\u66f4\u7a33\u5b9a\u3002", "categories": ["cs.CV", "cs.AI", "cs.CG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11573", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u89c6\u89c9", "CAD", "\u51e0\u4f55\u8868\u793a", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11573v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learn the Solid, Not the File: Canonical Inputs for Neural Networks on CAD Boundary Representations", "tldr": "\u8bba\u6587\u6307\u51fa\u540c\u4e00CAD\u5b9e\u4f53\u53ef\u5bf9\u5e94\u591a\u79cd\u4e0d\u540cB-rep\u6587\u4ef6\u8868\u793a\uff0c\u73b0\u6709B-rep\u7f16\u7801\u5668\u5728\u8fd9\u79cd\u8868\u793a\u53d8\u5316\u4e0b\u9c81\u68d2\u6027\u5f88\u5dee\uff0c\u6027\u80fd\u53ef\u80fd\u4e25\u91cd\u5d29\u6e83\u3002\u4f5c\u8005\u63d0\u51fa\u4ece\u5b9e\u4f53\u672c\u8eab\u5bfc\u51fa\u7684\u89c4\u8303\u533a\u57df\u56fe\uff0c\u5177\u5907\u5bf9\u91cd\u5206\u5272\u548c\u521a\u4f53\u8fd0\u52a8\u7684\u4e0d\u53d8\u6027\uff0c\u5728\u6807\u51c6\u57fa\u51c6\u4e0a\u4fdd\u6301\u5f3a\u57fa\u7ebf\u6027\u80fd\uff0c\u5e76\u5728\u591a\u79cd\u6270\u52a8\u4e0b\u66f4\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present EXYGEN (EXplore Your Graphs ENgine), a framework for knowledge graph (KG) understanding that enables conversational access to KGs at scale. We address two questions in sequence. First, how effectively can LLMs perform text-to-SPARQL generation given only automatically derived structured metadata and small graph samples, rather than task-specific fine-tuning? We integrate VoID descriptions and ShEx schemas into a retrieval-augmented generation (RAG) pipeline and ablate KG-derived context on the SciQA benchmark. Our best configuration -- combining ShEx schemas, retrieved triples, and example question-query pairs -- reaches an exact match of 0.419 on execution results without any LLM fine-tuning. We further find that lexical metrics such as F1 poorly predict query correctness, and that larger general-purpose LLMs can outperform smaller code-specialized ones once given sufficient context. Second, we ask how to generate the structured metadata that this method relies on from very large KGs, where KG metadata generation becomes computationally intractable. We introduce a predicate-coverage-aware parallel graph sampling strategy that preserves structural diversity while remaining computationally tractable. On OpenCitations Meta and GESIS, it retains high predicate coverage with minimal triple loss and reduces runtime by over 80x; on ORKG, sampling is not just faster but the only tractable path to obtain complete metadata. Together, these results show that structured schema context and lightweight prompting can substantially reduce reliance on fine-tuning for scalable conversational access to KGs, though closing the remaining gap to fully fine-tuned approaches will likely require reducing dependence on curated question-query exemplars -- whether through synthetic generation or an execution-feedback-driven approach -- and validating these findings beyond a single benchmark.", "arxiv_id": "2609.11569", "arxiv_url": "https://arxiv.org/abs/2609.11569", "authors": ["Harshdeep Singh", "Yurui Zhu", "Giovanni Colavizza", "Matteo Romanello"], "brief": "\u672c\u6587\u63d0\u51fa EXYGEN\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u77e5\u8bc6\u56fe\u8c31\u7684\u5bf9\u8bdd\u5f0f\u7406\u89e3\u6846\u67b6\uff0c\u901a\u8fc7\u5c06 VoID\u3001ShEx \u6a21\u5f0f\u3001\u68c0\u7d22\u4e09\u5143\u7ec4\u548c\u793a\u4f8b\u95ee\u7b54-SparQL \u5bf9\u7eb3\u5165 RAG \u6d41\u7a0b\uff0c\u5728\u65e0\u9700\u5fae\u8c03\u7684\u60c5\u51b5\u4e0b\u5b9e\u73b0\u6587\u672c\u5230 SPARQL \u67e5\u8be2\u751f\u6210\u3002\u5176\u6700\u4f73\u914d\u7f6e\u5728 SciQA \u4e0a\u8fbe\u5230 0.419 \u7684\u6267\u884c\u7ed3\u679c\u7cbe\u786e\u5339\u914d\uff0c\u5e76\u63d0\u51fa\u8c13\u8bcd\u8986\u76d6\u611f\u77e5\u7684\u5e76\u884c\u91c7\u6837\u65b9\u6cd5\uff0c\u4f7f\u5927\u56fe\u8c31\u5143\u6570\u636e\u751f\u6210\u8fd0\u884c\u65f6\u95f4\u964d\u4f4e 80 \u500d\u4ee5\u4e0a\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11569", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bed\u4e49\u67e5\u8be2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11569v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Enabling Knowledge Graph Understanding at Scale with the EXplore Your Graphs ENgine (EXYGEN)", "tldr": "\u672c\u6587\u63d0\u51fa EXYGEN\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u77e5\u8bc6\u56fe\u8c31\u7684\u5bf9\u8bdd\u5f0f\u7406\u89e3\u6846\u67b6\uff0c\u901a\u8fc7\u5c06 VoID\u3001ShEx \u6a21\u5f0f\u3001\u68c0\u7d22\u4e09\u5143\u7ec4\u548c\u793a\u4f8b\u95ee\u7b54-SparQL \u5bf9\u7eb3\u5165 RAG \u6d41\u7a0b\uff0c\u5728\u65e0\u9700\u5fae\u8c03\u7684\u60c5\u51b5\u4e0b\u5b9e\u73b0\u6587\u672c\u5230 SPARQL \u67e5\u8be2\u751f\u6210\u3002\u5176\u6700\u4f73\u914d\u7f6e\u5728 SciQA \u4e0a\u8fbe\u5230 0.419 \u7684\u6267\u884c\u7ed3\u679c\u7cbe\u786e\u5339\u914d\uff0c\u5e76\u63d0\u51fa\u8c13\u8bcd\u8986\u76d6\u611f\u77e5\u7684\u5e76\u884c\u91c7\u6837\u65b9\u6cd5\uff0c\u4f7f\u5927\u56fe\u8c31\u5143\u6570\u636e\u751f\u6210\u8fd0\u884c\u65f6\u95f4\u964d\u4f4e 80 \u500d\u4ee5\u4e0a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Early diagnosis of melanoma is critical for improving patient survival rates. However, accurately distinguishing melanoma from other skin lesions remains a significant clinical challenge due to the high visual similarity among lesion types and variability in image acquisition conditions. Artificial intelligence, particularly machine learning, has emerged as a promising tool to support dermatological diagnosis by automating feature extraction from medical images. Among the available approaches, convolutional neural networks (CNNs) have demonstrated strong performance in image classification tasks, making them well-suited for analyzing both dermatoscopic and histopathological images, given their ability to capture hierarchical visual patterns relevant to lesion characterization. Nevertheless, despite numerous pre-trained CNN architectures having been proposed, selecting the most appropriate one for a given imaging modality remains an open challenge. In this study, we evaluate pre-trained convolutional neural networks (CNNs) for skin lesion classification using dermatoscopic and histopathological image datasets. Experiments were conducted on the HAM10000, ISIC 2018, and CR-AI4SkIN datasets, evaluating the ResNet50, VGG16, VGG19, MobileNet, and InceptionV3 architectures under the same training protocol. The experimental evaluation showed that the models achieved accuracies ranging from 71% (InceptionV3 on ISIC 2018) to 84% (ResNet50 on HAM10000) on dermatoscopic images. For histopathological images, accuracies ranged from 72% (VGG19) to 83% (ResNet50) on the CR-AI4SkIN dataset. The results demonstrate that model performance differs between dermatoscopic and histopathological image modalities, showing that architectures exhibiting similar performance on dermatoscopic images exhibit different performance on histopathological data.", "arxiv_id": "2609.11550", "arxiv_url": "https://arxiv.org/abs/2609.11550", "authors": ["Wagner Moreno Schmitz", "Marco Antonio de Castro Barbosa", "Thiago Magalh\u00e3es Amaral", "Dalcimar Casanova", "Jefferson Tales Oliva"], "brief": "\u672c\u6587\u5728 HAM10000\u3001ISIC 2018 \u548c CR-AI4SkIN \u6570\u636e\u96c6\u4e0a\uff0c\u5bf9 ResNet50\u3001VGG\u3001MobileNet\u3001InceptionV3 \u7b49\u9884\u8bad\u7ec3 CNN \u8fdb\u884c\u9ed1\u8272\u7d20\u7624/\u76ae\u80a4\u75c5\u7076\u5206\u7c7b\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a ResNet50\u6574\u4f53\u8868\u73b0\u6700\u597d\uff0c\u76ae\u80a4\u955c\u56fe\u50cf\u6700\u9ad8\u8fbe84%\u51c6\u786e\u7387\uff0c\u7ec4\u7ec7\u75c5\u7406\u56fe\u50cf\u6700\u9ad8\u8fbe83%\uff0c\u4e14\u4e0d\u540c\u6210\u50cf\u6a21\u6001\u4e0b\u6a21\u578b\u8868\u73b0\u5dee\u5f02\u660e\u663e\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11550", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u5377\u79ef\u795e\u7ecf\u7f51\u7edc", "\u76ae\u80a4\u75c5\u53d8\u5206\u7c7b", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11550v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Comparative Evaluation of Pre-trained Convolutional Neural Networks for Melanoma Detection", "tldr": "\u672c\u6587\u5728 HAM10000\u3001ISIC 2018 \u548c CR-AI4SkIN \u6570\u636e\u96c6\u4e0a\uff0c\u5bf9 ResNet50\u3001VGG\u3001MobileNet\u3001InceptionV3 \u7b49\u9884\u8bad\u7ec3 CNN \u8fdb\u884c\u9ed1\u8272\u7d20\u7624/\u76ae\u80a4\u75c5\u7076\u5206\u7c7b\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a ResNet50\u6574\u4f53\u8868\u73b0\u6700\u597d\uff0c\u76ae\u80a4\u955c\u56fe\u50cf\u6700\u9ad8\u8fbe84%\u51c6\u786e\u7387\uff0c\u7ec4\u7ec7\u75c5\u7406\u56fe\u50cf\u6700\u9ad8\u8fbe83%\uff0c\u4e14\u4e0d\u540c\u6210\u50cf\u6a21\u6001\u4e0b\u6a21\u578b\u8868\u73b0\u5dee\u5f02\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) training is among the fastest-growing sources of electricity demand in modern data centers, and power availability is a primary bottleneck to continued AI infrastructure growth. Making the power consumption of these workloads flexible could unlock additional power for AI growth, limit increases in electricity prices, and improve the utilization of existing grid infrastructure. However, to realize this flexibility, we must first understand how the performance of training workloads changes when GPU power is reduced. This paper presents the first systematic characterization of \\emph{job power elasticity} (the sensitivity of throughput to power reductions) in LLM training. To quantify elasticity, we introduce the \\emph{Power Flexibility Index (PFI)}, a normalized metric that quantifies the performance cost of power reductions and provides a control primitive for SLA-aware power flexibility. We collect data from 131 LLM training runs on H200 (plus 24 H200 validation runs and 34 matched H100 runs), including both dense and mixture-of-experts models, pretraining and fine-tuning tasks, and up to 32 GPUs. We find that LLM training jobs exhibit substantial but variable power elasticity, and we identify telemetry signals that predict PFI at runtime. Finally, we demonstrate that PFI-aware power allocation maximizes total tokens/second throughput under power constraints. Under a 30\\% power reduction, PFI-aware power allocation recovers ~1.5k tokens/s per job, 63\\% of the performance gap between an equal-weight allocation and an oracle with perfect information. Our results establish power elasticity as a measurable property of training jobs and provide a foundation for power-aware, grid-responsive AI infrastructure.", "arxiv_id": "2609.11542", "arxiv_url": "https://arxiv.org/abs/2609.11542", "authors": ["Philip Colangelo", "Charles Dawson", "Shayan Sengupta", "Ayse Coskun", "Varun Sivaram"], "brief": "\u8bba\u6587\u7cfb\u7edf\u523b\u753b\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3\u5728\u964d\u4f4e GPU \u529f\u8017\u65f6\u7684\u541e\u5410\u53d8\u5316\uff0c\u63d0\u51fa\u529f\u7387\u7075\u6d3b\u6027\u6307\u6570\uff08PFI\uff09\u6765\u91cf\u5316\u6027\u80fd\u4ee3\u4ef7\u5e76\u652f\u6301 SLA \u611f\u77e5\u7684\u529f\u7387\u63a7\u5236\u3002\u57fa\u4e8e H200/H100 \u4e0a 189 \u6b21\u8bad\u7ec3\u5b9e\u9a8c\uff0c\u53d1\u73b0\u8bad\u7ec3\u4efb\u52a1\u5b58\u5728\u663e\u8457\u4f46\u5dee\u5f02\u8f83\u5927\u7684\u529f\u7387\u5f39\u6027\uff0c\u4e14\u53ef\u7528\u8fd0\u884c\u65f6\u9065\u6d4b\u4fe1\u53f7\u9884\u6d4b\uff1b\u5728 30% \u529f\u7387\u524a\u51cf\u4e0b\uff0cPFI \u611f\u77e5\u5206\u914d\u53ef\u663e\u8457\u6062\u590d\u541e\u5410\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11542", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "AI\u57fa\u7840\u8bbe\u65bd", "\u529f\u8017\u4f18\u5316", "\u6570\u636e\u4e2d\u5fc3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11542v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Characterizing Job Power Elasticity for Power-Flexible AI Training", "tldr": "\u8bba\u6587\u7cfb\u7edf\u523b\u753b\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u8bad\u7ec3\u5728\u964d\u4f4e GPU \u529f\u8017\u65f6\u7684\u541e\u5410\u53d8\u5316\uff0c\u63d0\u51fa\u529f\u7387\u7075\u6d3b\u6027\u6307\u6570\uff08PFI\uff09\u6765\u91cf\u5316\u6027\u80fd\u4ee3\u4ef7\u5e76\u652f\u6301 SLA \u611f\u77e5\u7684\u529f\u7387\u63a7\u5236\u3002\u57fa\u4e8e H200/H100 \u4e0a 189 \u6b21\u8bad\u7ec3\u5b9e\u9a8c\uff0c\u53d1\u73b0\u8bad\u7ec3\u4efb\u52a1\u5b58\u5728\u663e\u8457\u4f46\u5dee\u5f02\u8f83\u5927\u7684\u529f\u7387\u5f39\u6027\uff0c\u4e14\u53ef\u7528\u8fd0\u884c\u65f6\u9065\u6d4b\u4fe1\u53f7\u9884\u6d4b\uff1b\u5728 30% \u529f\u7387\u524a\u51cf\u4e0b\uff0cPFI \u611f\u77e5\u5206\u914d\u53ef\u663e\u8457\u6062\u590d\u541e\u5410\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Commercial text-to-image systems silently revise user prompts before generating images, a step users typically cannot disable or even see. Yet, existing audits of cultural bias examine only the final images and treat generation as a single pipeline, so they cannot tell where the bias originates. We introduce WORLDVIEW, a multilingual benchmark of 8,960 prompts across 15 languages and 31 language-context pairings. Using it, we audit the revision layer in three systems (DALL-E-3, Imagen-4, GPT-Image-1.5) through a three-step analysis of how heavily it marks each cultural context, whether it flattens that context into a narrow vocabulary, and whether that vocabulary is stereotypical. Relative to a no-context English baseline, the US is the least-marked context, while non-Western and non-Anglophone contexts are marked far more heavily, flattened into narrow vocabularies applied across topically diverse prompts, and reduced to recognizable cultural stereotypes. Comparing images from original versus revised prompts on models without a revision layer, we identify the layer itself as a previously undocumented, causal source of this stereotyping. To locate cultural bias, and fix it, we must audit the system as deployed, not the model alone.", "arxiv_id": "2609.11532", "arxiv_url": "https://arxiv.org/abs/2609.11532", "authors": ["Aleksandra Urman", "Elsa Lichtenegger", "Salima Jaoua", "Azza Bouleimen", "Robin Forsberg", "Corinna Hertweck", "Stefania Ionescu", "Nicol\u00f2 Pagan", "Ancsa Hannak", "Joachim Baumann"], "brief": "\u8bba\u6587\u63d0\u51fa WORLDVIEW \u591a\u8bed\u8a00\u57fa\u51c6\uff0c\u5ba1\u8ba1 DALL-E-3\u3001Imagen-4\u3001GPT-Image-1.5 \u7b49\u6587\u751f\u56fe\u7cfb\u7edf\u4e2d\u7528\u6237\u4e0d\u53ef\u89c1\u7684\u63d0\u793a\u8bcd\u6539\u5199\u5c42\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u76f8\u6bd4\u82f1\u8bed\u7f8e\u56fd\u8bed\u5883\uff0c\u975e\u897f\u65b9\u548c\u975e\u82f1\u8bed\u8bed\u5883\u4f1a\u88ab\u66f4\u5f3a\u5730\u6587\u5316\u6807\u8bb0\uff0c\u5e76\u88ab\u538b\u7f29\u6210\u72ed\u7a84\u4e14\u523b\u677f\u7684\u6587\u5316\u8bcd\u6c47\uff1b\u5b9e\u9a8c\u8fdb\u4e00\u6b65\u8868\u660e\u63d0\u793a\u8bcd\u6539\u5199\u5c42\u672c\u8eab\u662f\u523b\u677f\u5316\u504f\u5dee\u7684\u56e0\u679c\u6765\u6e90\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11532", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u751f\u56fe", "\u6587\u5316\u504f\u89c1", "\u63d0\u793a\u8bcd\u6539\u5199", "\u591a\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11532v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prompt Revision as a Source of Cultural Bias in Text-to-Image Systems", "tldr": "\u8bba\u6587\u63d0\u51fa WORLDVIEW \u591a\u8bed\u8a00\u57fa\u51c6\uff0c\u5ba1\u8ba1 DALL-E-3\u3001Imagen-4\u3001GPT-Image-1.5 \u7b49\u6587\u751f\u56fe\u7cfb\u7edf\u4e2d\u7528\u6237\u4e0d\u53ef\u89c1\u7684\u63d0\u793a\u8bcd\u6539\u5199\u5c42\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u76f8\u6bd4\u82f1\u8bed\u7f8e\u56fd\u8bed\u5883\uff0c\u975e\u897f\u65b9\u548c\u975e\u82f1\u8bed\u8bed\u5883\u4f1a\u88ab\u66f4\u5f3a\u5730\u6587\u5316\u6807\u8bb0\uff0c\u5e76\u88ab\u538b\u7f29\u6210\u72ed\u7a84\u4e14\u523b\u677f\u7684\u6587\u5316\u8bcd\u6c47\uff1b\u5b9e\u9a8c\u8fdb\u4e00\u6b65\u8868\u660e\u63d0\u793a\u8bcd\u6539\u5199\u5c42\u672c\u8eab\u662f\u523b\u677f\u5316\u504f\u5dee\u7684\u56e0\u679c\u6765\u6e90\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable, low-latency perception is crucial for Formula Student Driverless vehicles, yet many existing pipelines rely on deep learning and multi-sensor fusion, often requiring GPU acceleration. This paper presents a lightweight LiDAR-only perception pipeline tailored for CPU execution, combining ground removal, IMU-based motion compensation, DBSCAN clustering, and geometric feature-based Random Forest classification. Feature importance analysis reduced the model input from 12 to 7 features while preserving performance. Evaluated on 2,371 labeled clusters collected from real FSD events, the pipeline achieves an F1-score of 98.33% and an end-to-end runtime of 3.13 ms on CPU-only hardware. The released dataset, labeling tool, and trained models provide a practical and reproducible baseline for other resource-constrained autonomous racing teams.", "arxiv_id": "2609.11527", "arxiv_url": "https://arxiv.org/abs/2609.11527", "authors": ["M\u00e1rk Mez\u0151-Kerekes", "P\u00e9ter Praksz", "Chang Liu"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411 Formula Student Driverless \u7684\u8f7b\u91cf\u7ea7 LiDAR-only \u9525\u6876\u68c0\u6d4b\u6d41\u6c34\u7ebf\uff0c\u7ed3\u5408\u5730\u9762\u53bb\u9664\u3001IMU \u8fd0\u52a8\u8865\u507f\u3001DBSCAN \u805a\u7c7b\u548c\u57fa\u4e8e\u51e0\u4f55\u7279\u5f81\u7684\u968f\u673a\u68ee\u6797\u5206\u7c7b\uff0c\u53ef\u5728\u7eaf CPU \u4e0a\u8fd0\u884c\u3002\u901a\u8fc7\u7279\u5f81\u91cd\u8981\u6027\u5206\u6790\u5c06\u8f93\u5165\u7279\u5f81\u4ece 12 \u4e2a\u964d\u5230 7 \u4e2a\uff0c\u5728\u771f\u5b9e\u8d5b\u4e8b\u6570\u636e\u4e0a\u8fbe\u5230 98.33% F1 \u5206\u6570\uff0c\u7aef\u5230\u7aef\u5ef6\u8fdf\u4ec5 3.13 ms\uff0c\u5e76\u5f00\u6e90\u6570\u636e\u96c6\u3001\u6807\u6ce8\u5de5\u5177\u548c\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11527", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u6fc0\u5149\u96f7\u8fbe", "\u968f\u673a\u68ee\u6797", "\u76ee\u6807\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11527v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Lightweight LiDAR-Based Cone Detection Framework Using Random Forest for Formula Student Driverless", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411 Formula Student Driverless \u7684\u8f7b\u91cf\u7ea7 LiDAR-only \u9525\u6876\u68c0\u6d4b\u6d41\u6c34\u7ebf\uff0c\u7ed3\u5408\u5730\u9762\u53bb\u9664\u3001IMU \u8fd0\u52a8\u8865\u507f\u3001DBSCAN \u805a\u7c7b\u548c\u57fa\u4e8e\u51e0\u4f55\u7279\u5f81\u7684\u968f\u673a\u68ee\u6797\u5206\u7c7b\uff0c\u53ef\u5728\u7eaf CPU \u4e0a\u8fd0\u884c\u3002\u901a\u8fc7\u7279\u5f81\u91cd\u8981\u6027\u5206\u6790\u5c06\u8f93\u5165\u7279\u5f81\u4ece 12 \u4e2a\u964d\u5230 7 \u4e2a\uff0c\u5728\u771f\u5b9e\u8d5b\u4e8b\u6570\u636e\u4e0a\u8fbe\u5230 98.33% F1 \u5206\u6570\uff0c\u7aef\u5230\u7aef\u5ef6\u8fdf\u4ec5 3.13 ms\uff0c\u5e76\u5f00\u6e90\u6570\u636e\u96c6\u3001\u6807\u6ce8\u5de5\u5177\u548c\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we address the problem of graphic design template creation, which generates a background image and a layout of foreground elements over the background to form a harmonious composition from an input text. Prior work on graphic design generation mostly adopts a sequential paradigm, where design elements are generated sequentially. We argue that such a sequential scheme falls short of faithfully capturing the dependency between the background and layout (and thus the joint image-layout distribution), which limits the quality of generated design templates. To overcome this limitation, we propose a model, InterIL, which jointly generates the two modalities, background image and layout, in a single generative process. The novel design of our joint model connects the backbones of pretrained image and layout diffusion models with a learnable communication module to explicitly model bidirectional image-layout interaction. During training, the image and layout backbones are frozen to maintain and leverage the vast pretrained single-modality prior knowledge, while only the communication module is updated, so that the model can focus on learning image-layout interaction and thereby better capture the joint image-layout distribution for improved composition harmony. Our model has no design-specific inductive bias, which allows it to better preserve the original characteristics of realistic designs. We further introduce a test-time guidance strategy to enable users to impose their specific preferences on generated results. Our experiments show that, compared with prior approaches, our model can generate significantly better results in terms of image, layout and image-layout harmonization, producing outputs closer to real samples. We also demonstrate the flexibility of our model in enforcing user preferences at inference without retraining.", "arxiv_id": "2609.11519", "arxiv_url": "https://arxiv.org/abs/2609.11519", "authors": ["Shirong Yang", "Bo Yang", "Ying Cao"], "brief": "\u8bba\u6587\u63d0\u51fa InterIL\uff0c\u7528\u4e8e\u4ece\u6587\u672c\u8054\u5408\u751f\u6210\u8bbe\u8ba1\u6a21\u677f\u4e2d\u7684\u80cc\u666f\u56fe\u50cf\u4e0e\u524d\u666f\u5e03\u5c40\uff0c\u800c\u4e0d\u662f\u6309\u987a\u5e8f\u751f\u6210\u5143\u7d20\u3002\u65b9\u6cd5\u8fde\u63a5\u51bb\u7ed3\u7684\u9884\u8bad\u7ec3\u56fe\u50cf\u6269\u6563\u6a21\u578b\u548c\u5e03\u5c40\u6269\u6563\u6a21\u578b\uff0c\u5e76\u4ec5\u8bad\u7ec3\u901a\u4fe1\u6a21\u5757\u6765\u5b66\u4e60\u53cc\u5411\u56fe\u50cf-\u5e03\u5c40\u4ea4\u4e92\uff0c\u751f\u6210\u7ed3\u679c\u5728\u56fe\u50cf\u8d28\u91cf\u3001\u5e03\u5c40\u8d28\u91cf\u4e0e\u6574\u4f53\u534f\u8c03\u6027\u4e0a\u4f18\u4e8e\u4ee5\u5f80\u65b9\u6cd5\u3002\u8fd8\u652f\u6301\u6d4b\u8bd5\u65f6\u5f15\u5bfc\uff0c\u8ba9\u7528\u6237\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u65bd\u52a0\u504f\u597d\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11519", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u56fe\u6587\u751f\u6210", "\u5e03\u5c40\u751f\u6210", "\u8bbe\u8ba1\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11519v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Interaction between Image and Layout Priors for Joint Image-Layout Generation in Design Templates", "tldr": "\u8bba\u6587\u63d0\u51fa InterIL\uff0c\u7528\u4e8e\u4ece\u6587\u672c\u8054\u5408\u751f\u6210\u8bbe\u8ba1\u6a21\u677f\u4e2d\u7684\u80cc\u666f\u56fe\u50cf\u4e0e\u524d\u666f\u5e03\u5c40\uff0c\u800c\u4e0d\u662f\u6309\u987a\u5e8f\u751f\u6210\u5143\u7d20\u3002\u65b9\u6cd5\u8fde\u63a5\u51bb\u7ed3\u7684\u9884\u8bad\u7ec3\u56fe\u50cf\u6269\u6563\u6a21\u578b\u548c\u5e03\u5c40\u6269\u6563\u6a21\u578b\uff0c\u5e76\u4ec5\u8bad\u7ec3\u901a\u4fe1\u6a21\u5757\u6765\u5b66\u4e60\u53cc\u5411\u56fe\u50cf-\u5e03\u5c40\u4ea4\u4e92\uff0c\u751f\u6210\u7ed3\u679c\u5728\u56fe\u50cf\u8d28\u91cf\u3001\u5e03\u5c40\u8d28\u91cf\u4e0e\u6574\u4f53\u534f\u8c03\u6027\u4e0a\u4f18\u4e8e\u4ee5\u5f80\u65b9\u6cd5\u3002\u8fd8\u652f\u6301\u6d4b\u8bd5\u65f6\u5f15\u5bfc\uff0c\u8ba9\u7528\u6237\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u65bd\u52a0\u504f\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Quantifier instantiation is currently the main approach to non-ground SMT solving: solvers generate ground instances and solve the resulting ground SMT problems with CDCL(T)-style reasoning. When a conflict is found, conflict analysis learns only a ground clause, even though the conflict comes from instances of non-ground clauses. Yet non-ground reasoning can give exponentially shorter proofs than purely ground reasoning. We propose a calculus that consists of ground instantiations, CDCL(T)-style rules, and non-ground conflict analysis. The solver reasons on ground instances, but the resolution steps of conflict analysis are performed on their original non-ground clauses. This produces learned clauses that are typically more general than the ground conflict. With a suitable strategy, the learned clauses are even non-redundant. We also show how chronological backtracking can be included in SMT solving. Our calculus gives a common setting for CDCL(T)-style SMT solving, a range of instantiation-based procedures, and non-ground clause learning, and we prove that it simulates CDCL, SCL(FOL), SCL(T), and even Resolution.", "arxiv_id": "2609.11509", "arxiv_url": "https://arxiv.org/abs/2609.11509", "authors": ["Yasmine Briefs", "Christoph Weidenbach"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5c06 SMT \u6c42\u89e3\u4e2d\u7684\u57fa\u5b9e\u4f8b\u5316\u3001CDCL(T) \u63a8\u7406\u4e0e\u975e\u57fa\u51b2\u7a81\u5206\u6790\u7ed3\u5408\u7684\u6f14\u7b97\u6846\u67b6\u3002\u6c42\u89e3\u5668\u4ecd\u5728\u57fa\u5b9e\u4f8b\u4e0a\u63a8\u7406\uff0c\u4f46\u51b2\u7a81\u5b66\u4e60\u56de\u5230\u539f\u59cb\u975e\u57fa\u5b50\u53e5\u4e0a\u505a\u5f52\u7ed3\uff0c\u4ece\u800c\u5b66\u4e60\u66f4\u4e00\u822c\u4e14\u5728\u5408\u9002\u7b56\u7565\u4e0b\u975e\u5197\u4f59\u7684\u5b50\u53e5\uff0c\u5e76\u53ef\u6a21\u62df\u591a\u79cd\u73b0\u6709\u63a8\u7406\u4f53\u7cfb\u3002", "categories": ["cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11509", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["SMT\u6c42\u89e3", "\u975e\u57fa\u63a8\u7406", "\u5b50\u53e5\u5b66\u4e60", "\u81ea\u52a8\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11509v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Extending SMT Solving with Non-Ground Clause Learning", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5c06 SMT \u6c42\u89e3\u4e2d\u7684\u57fa\u5b9e\u4f8b\u5316\u3001CDCL(T) \u63a8\u7406\u4e0e\u975e\u57fa\u51b2\u7a81\u5206\u6790\u7ed3\u5408\u7684\u6f14\u7b97\u6846\u67b6\u3002\u6c42\u89e3\u5668\u4ecd\u5728\u57fa\u5b9e\u4f8b\u4e0a\u63a8\u7406\uff0c\u4f46\u51b2\u7a81\u5b66\u4e60\u56de\u5230\ a\u52a8\u673a\u7b49\u6570\u636e\u53ef\u964d\u4f4e\u540e\u7eed\u8bed\u8a00\u5efa\u6a21\u635f\u5931\u5e76\u51cf\u5c11\u6743\u91cd\u8fc1\u79fb\u5e45\u5ea6\uff0c\u4f46\u5bf9\u4e0b\u6e38\u8bed\u8a00\u4efb\u52a1\u63d0\u5347\u4e0d\u7a33\u5b9a\uff0c\u4e14\u4e0d\u5982\u76f4\u63a5\u589e\u52a0\u8bed\u8a00\u6570\u636e\u6709\u6548\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11505", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u7ed3\u6784\u5148\u9a8c", "\u8fc1\u79fb\u5b66\u4e60", "\u6570\u636e\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11505v1", "published_at": "2026-09-10", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Structural priors for data-efficient language learning", "tldr": "\u672c\u6587\u7814\u7a76\u5148\u7528\u975e\u8bed\u8a00\u7b26\u53f7\u6570\u636e\u9884\u8bad\u7ec3\u6a21\u578b\uff0c\u4ee5\u5f15\u5165\u7ed3\u6784\u5148\u9a8c\u5e76\u63d0\u5347\u4f4e\u6570\u636e\u8bed\u8a00\u5b66\u4e60\u6548\u7387\u3002\u97f3\u4e50\u3001\u6982\u7387\u6587\u6cd5\u3001\u5143\u80de\u81ea\u52a8\u673a\u7b49\u6570\u636e\u53ef\u964d\u4f4e\u540e\u7eed\u8bed\u8a00\u5efa\u6a21\u635f\u5931\u5e76\u51cf\u5c11\u6743\u91cd\u8fc1\u79fb\u5e45\u5ea6\uff0c\u4f46\u5bf9\u4e0b\u6e38\u8bed\u8a00\u4efb\u52a1\u63d0\u5347\u4e0d\u7a33\u5b9a\uff0c\u4e14\u4e0d\u5982\u76f4\u63a5\u589e\u52a0\u8bed\u8a00\u6570\u636e\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Practical uncertainty quantification (UQ) for large language models must decide, from a single generation, whether a specific answer should be trusted. Existing methods either sample multiple generations, read only output-token probabilities, or reduce the model\u0027s internal computation to a single hidden state. We introduce ActMap, a white-box representation that compresses the generation-time hidden- state trajectory (every layer, every generated token) into a fixed $12 \\times 32 \\times 128$ tensor of temporal-statistic channels that preserves structure across transformer depth and pooled hidden coordinates. The map is captured during the generation pass with no measurable overhead, has a fixed shape across model depths and hidden sizes, and occupies 96 KiB: a compact artifact that can be retained for audit-relevant generations and probed directly, with occlusion analysis localizing the classifier\u0027s signal to mid-depth regions of the map. A lightweight classifier, instantiated as a compact Vision Transformer, reads an estimated correctness probability from each map in a fraction of a millisecond; capacity-matched MLPs perform comparably, indicating the representation itself carries the result. Trained and evaluated in-domain on short-answer QA, direct- answer math, and summarization factuality with three instruction-tuned 7-8B models, ActMap consistently outperforms sampling, token-probability, attention, and embedding baselines, and matches ACT-ViT, a detector trained on dense activation tensors $67 \\times$ larger, at essentially the same mean AUROC with lower calibration error on ten of twelve pairs. The resulting score supports abstention, routing, and selective verification from a single generation, making it a practical primitive for scalable oversight of deployed models.", "arxiv_id": "2609.11498", "arxiv_url": "https://arxiv.org/abs/2609.11498", "authors": ["Jacopo Dardini", "Roberta Calegari"], "brief": "ActMap \u63d0\u51fa\u4e00\u79cd\u767d\u76d2\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u65b9\u6cd5\uff0c\u5728\u5355\u6b21\u751f\u6210\u8fc7\u7a0b\u4e2d\u628a\u5404\u5c42\u3001\u5404\u751f\u6210 token \u7684\u9690\u85cf\u72b6\u6001\u8f68\u8ff9\u538b\u7f29\u6210\u56fa\u5b9a\u5927\u5c0f\u7684\u6fc0\u6d3b\u56fe\uff0c\u7528\u4e8e\u5224\u65ad\u7b54\u6848\u662f\u5426\u53ef\u4fe1\u3002\u8f7b\u91cf\u5206\u7c7b\u5668\u5373\  research. The methodology used to measure these differences depends on the specific research area. A phonetics researcher may demonstrate accent variation by comparing vowel formants in paired recordings of individual words. These results will be interpretable, but the recordings will be time-consuming to collect and may not be representative of connected speech. Accented Text-to-Speech (TTS) research has pushed towards using accent embeddings derived from accent classification tasks. These embeddings can be produced from any speech recording, but are not readily interpretable. In this paper, we demonstrate that articulatory representations created through articulatory inversion can be used as an interpretable basis for accent comparison and that optimal transport provides a framework for accent comparison across arbitrary recording types.", "arxiv_id": "2609.11458", "arxiv_url": "https://arxiv.org/abs/2609.11458", "authors": ["Charles McGhee", "Mark J. F. Gales", "Kate M. Knill"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u53d1\u97f3\u53cd\u6f14\u5f97\u5230\u7684\u53d1\u97f3\u5668\u5b98\u8868\u5f81\u6765\u8861\u91cf\u8bf4\u8bdd\u4eba\u4e4b\u95f4\u7684\u53e3\u97f3\u8ddd\u79bb\uff0c\u4f7f\u53e3\u97f3\u5dee\u5f02\u6bd4\u8f83\u66f4\u5177\u53ef\u89e3\u91ca\u6027\u3002\u65b9\u6cd5\u7ed3\u5408\u6700\u4f18\u4f20\u8f93\uff0c\u53ef\u5728\u4e0d\u540c\u7c7b\u578b\u8bed\u97f3\u5f55\u97f3\u4e4b\u95f4\u8fdb\u884c\u7075\u6d3b\u7684\u53e3\u97f3\u6bd4\u8f83\uff0c\u517c\u987e\u4f20\u7edf\u8bed\u97f3\u5b66\u89e3\u91ca\u6027\u4e0e\u5d4c\u5165\u65b9\u6cd5\u7684\u9002\u7528\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11458", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u6280\u672f", "\u53e3\u97f3\u6d4b\u91cf", "\u53ef\u89e3\u91ca\u6027", "\u6700\u4f18\u4f20\u8f93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pd   const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
