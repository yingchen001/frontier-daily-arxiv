const PAPERS = [{"abstract": "SWE-Bench Pro has emerged as a standard benchmark for evaluating software engineering agents on challenging repository-level tasks. However, our analysis work show that its evaluation is undermined by two sources of unreliability: \\textbf{reward hacking}, enabled by leakage of gold solutions or hidden evaluation information, and \\textbf{task quality issues}, including misleading problem statements and improperly scoped tests. These issues can inflate benchmark performance and obscure agents\u0027 true coding ability. We present \\textbf{SWE-Bench Pro Verified}, a verified version of SWE-Bench Pro that addresses both problems. Our approach combines \\textbf{anti-hacking} safeguards that eliminate major leakage channels without disrupting normal agent functionality, with \\textbf{task refinement} that minimally corrects inconsistencies within flawed instances. Evaluations on SWE-Bench Pro Verified reveal that some models perform substantially worse than previously reported, suggesting that existing results on SWE-Bench Pro may overestimate real software engineering capability. SWE-Bench Pro Verified offers a more trustworthy benchmark for assessing software engineering agents.", "arxiv_id": "2609.08149", "arxiv_url": "https://arxiv.org/abs/2609.08149", "authors": ["Pujun Zheng", "Zixin Shang", "Shufan Jiang", "Wenhui Tian", "Dongsheng Zhu", "Zerun Ma", "Dingbo Yuan", "Qi Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa SWE-Bench Pro Verified\uff0c\u5bf9 SWE-Bench Pro \u4e2d\u7684\u6cc4\u6f0f\u4e0e\u4efb\u52a1\u8d28\u91cf\u95ee\u9898\u8fdb\u884c\u4fee\u6b63\u3002\u5b83\u901a\u8fc7\u53cd\u4f5c\u5f0a\u9632\u62a4\u548c\u6700\u5c0f\u5316\u4efb\u52a1\u7cbe\u4fee\uff0c\u6784\u5efa\u66f4\u53ef\u4fe1\u7684\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u8bc4\u6d4b\u96c6\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08149", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u539f SWE-Bench Pro \u5b58\u5728 reward hacking \u98ce\u9669\uff0c\u5305\u62ec\u91d1\u6807\u51c6\u7b54\u6848\u6216\u9690\u85cf\u8bc4\u6d4b\u4fe1\u606f\u6cc4\u6f0f", "\u53d1\u73b0\u90e8\u5206\u4efb\u52a1\u5b58\u5728\u8bef\u5bfc\u6027\u63cf\u8ff0\u3001\u6d4b\u8bd5\u8303\u56f4\u4e0d\u5f53\u7b49\u8d28\u91cf\u95ee\u9898\uff0c\u53ef\u80fd\u865a\u9ad8\u6a21\u578b\u8868\u73b0", "\u65b0\u7248\u57fa\u51c6\u52a0\u5165\u53cd\u6cc4\u6f0f\u673a\u5236\u5e76\u4fee\u6b63\u6709\u7f3a\u9677\u5b9e\u4f8b\uff0c\u8bc4\u6d4b\u663e\u793a\u90e8\u5206\u6a21\u578b\u6210\u7ee9\u663e\u8457\u4f4e\u4e8e\u6b64\u524d\u62a5\u544a"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 4, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2609.08149v1", "published_at": "2026-09-08", "score": 0.501, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08149.png", "title": "SWE-Bench Pro Verified: A Reliable Benchmark for Software Engineering Agents", "tldr": "\u66f4\u53ef\u9760\u7684\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 19, "what_it_is": "\u8bba\u6587\u63d0\u51fa SWE-Bench Pro Verified\uff0c\u5bf9 SWE-Bench Pro \u4e2d\u7684\u6cc4\u6f0f\u4e0e\u4efb\u52a1\u8d28\u91cf\u95ee\u9898\u8fdb\u884c\u4fee\u6b63\u3002\u5b83\u901a\u8fc7\u53cd\u4f5c\u5f0a\u9632\u62a4\u548c\u6700\u5c0f\u5316\u4efb\u52a1\u7cbe\u4fee\uff0c\u6784\u5efa\u66f4\u53ef\u4fe1\u7684\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u8bc4\u6d4b\u96c6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u5f71\u54cd\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u80fd\u529b\u8bc4\u4f30\u7684\u53ef\u4fe1\u5ea6\uff0c\u63d0\u793a\u73b0\u6709\u57fa\u51c6\u7ed3\u679c\u53ef\u80fd\u9ad8\u4f30\u771f\u5b9e\u4ee3\u7801\u4fee\u590d\u80fd\u529b\uff0c\u5e76\u4e3a\u540e\u7eed\u6a21\u578b\u6bd4\u8f83\u63d0\u4f9b\u66f4\u53ef\u9760\u6807\u51c6\u3002"}, {"abstract": "Agent usage is shifting toward long-horizon tasks such as coding and scientific discovery, among which terminal tasks are especially important. We introduce T1, a Mixture-of-Experts model of 122B total trained with reinforcement learning, operating a real shell in a cloud sandbox for up to 300+ tool-call turns per task, rewarded by executing each task\u0027s own verifier. We provide a comprehensive recipe: First, an aggressively warm-started to stabilize actor-critic training, with a dense process reward scoring trajectories by the absolute number of passing verifiers. Second, stable optimization through TITO construction, training on the exact sampled token identifiers with drift repair at turn boundaries, and rollout routing replay, recording the sampler\u0027s per-token expert choices at every MoE layer and replaying them during training. Third, fully out-of-distribution training corpus: isolated seeds and synthesized tasks disjoint from Terminal-Bench 2.1 ensures gains reflect genuine capability transfer over benchmark overfitting. Together, TITO and R3 cut the training-to-inference log-probability difference from 0.021 to 0.013, with exactly aligned zero token drift in the loss region. On Terminal-Bench 2.1, our post-train pipeline raises initial base model from 43.8% to T1 with 64.0% resolved. On Long-Horizon Terminal Bench, T1 reaches 27.9% and surpasses GPT-5.4 and GLM-5.1.", "arxiv_id": "2609.11042", "arxiv_url": "https://arxiv.org/abs/2609.11042", "authors": ["Junyao Yang", "Yucheng Shi", "Zhongzhi Li", "Ruhan Wang", "Zongxia Li", "Haitao Mi", "Leowei Liang"], "brief": "\u8bba\u6587\u63d0\u51fa T1\uff0c\u4e00\u4e2a 122B \u603b\u53c2\u6570\u7684 MoE \u7ec8\u7aef\u667a\u80fd\u4f53\u6a21\u578b\uff0c\u901a\u8fc7\u5728\u4e91\u6c99\u7bb1\u4e2d\u771f\u5b9e\u64cd\u4f5c shell \u5e76\u4f7f\u7528\u4efb\u52a1\u9a8c\u8bc1\u5668\u5956\u52b1\u8fdb\u884c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u5b83\u9762\u5411\u7f16\u7801\u3001\u79d1\u5b66\u53d1\u73b0\u7b49\u957f\u7a0b\u7ec8\u7aef\u4efb\u52a1\uff0c\u53ef\u6267\u884c 300+ \u8f6e\u5de5\u5177\u8c03\u7528\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11042", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u5f3a warm-start \u7684 actor-critic \u8bad\u7ec3\uff0c\u5e76\u7528\u901a\u8fc7\u9a8c\u8bc1\u5668\u6570\u91cf\u6784\u9020\u7a20\u5bc6\u8fc7\u7a0b\u5956\u52b1\uff0c\u63d0\u5347\u957f\u8f68\u8ff9\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "\u63d0\u51fa TITO\u3001token drift repair \u4e0e rollout routing replay\uff0c\u8bb0\u5f55\u5e76\u56de\u653e MoE \u6bcf\u5c42\u4e13\u5bb6\u8def\u7531\uff0c\u964d\u4f4e\u8bad\u7ec3-\u63a8\u7406 log-prob \u5dee\u5f02\u5e76\u5b9e\u73b0\u635f\u5931\u533a\u57df\u96f6 token \u6f02\u79fb\u3002", "\u8bad\u7ec3\u4efb\u52a1\u4e0e Terminal-Bench 2.1 \u9694\u79bb\uff0c\u4f7f\u7528\u5408\u6210\u4e14\u5206\u5e03\u5916\u7684\u7ec8\u7aef\u4efb\u52a1\uff1b\u5728 Terminal-Bench 2.1 \u4e0a\u4ece 43.8% \u63d0\u5347\u5230 64.0%\uff0c\u5728 Long-Horizon Terminal Bench \u8fbe\u5230 27.9%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u7a0b\u4efb\u52a1", "MoE"], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2609.11042v1", "published_at": "2026-09-10", "score": 0.492, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.11042.png", "title": "T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks", "tldr": "\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u957f\u7a0b\u7ec8\u7aef\u667a\u80fd\u4f53T1", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa T1\uff0c\u4e00\u4e2a 122B \u603b\u53c2\u6570\u7684 MoE \u7ec8\u7aef\u667a\u80fd\u4f53\u6a21\u578b\uff0c\u901a\u8fc7\u5728\u4e91\u6c99\u7bb1\u4e2d\u771f\u5b9e\u64cd\u4f5c shell \u5e76\u4f7f\u7528\u4efb\u52a1\u9a8c\u8bc1\u5668\u5956\u52b1\u8fdb\u884c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u5b83\u9762\u5411\u7f16\u7801\u3001\u79d1\u5b66\u53d1\u73b0\u7b49\u957f\u7a0b\u7ec8\u7aef\u4efb\u52a1\uff0c\u53ef\u6267\u884c 300+ \u8f6e\u5de5\u5177\u8c03\u7528\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u7ed9\u51fa\u4e86\u9762\u5411\u771f\u5b9e shell \u957f\u7a0b\u4efb\u52a1\u7684\u7aef\u5230\u7aef\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u914d\u65b9\uff0c\u91cd\u70b9\u89e3\u51b3\u4e86 MoE \u667a\u80fd\u4f53\u5728\u957f\u8f68\u8ff9\u3001\u591a\u5de5\u5177\u8c03\u7528\u573a\u666f\u4e2d\u7684\u8bad\u7ec3\u7a33\u5b9a\u6027\u548c\u5206\u5e03\u5916\u6cdb\u5316\u95ee\u9898\uff0c\u5bf9\u5b9e\u7528\u578b\u4ee3\u7801/\u7ec8\u7aef\u667a\u80fd\u4f53\u5177\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We study scheming in LLM agents, in which agents covertly pursue misaligned goals. Our focus is to understand how scheming arises from the interaction of key factors, such as instrumental goals, environmental affordances, oversight conditions, and perceived consequences. Prior work examines only a small number of scenarios, limiting the ability to isolate how these conditions shape an agent\u0027s propensity or capability to scheme. This limited scale and task diversity also restrict coverage of realistic deployment settings and the range of scheming strategies that can be observed. To this end, we introduce SCHEMEARENA, a 400-scenario benchmark for scalable scheming stress testing, constructed through a factorized scenario synthesis framework spanning diverse safety-relevant tool domains, instrumental goals, oversight conditions, and pressure mechanisms. To enable scalable and reliable monitoring, we further propose SCOUT, a scheming monitor that grounds multi-criteria judgments in evidence drawn from agents\u0027 reasoning and actions. Across controlled stress tests on five LLM agents, we find that explicit instrumental goals are the strongest driver of scheming propensity. Strategic hints play a distinct role by helping agents translate scheming reasoning into concrete covert behavior. Oversight has mixed effects: in several closed models, action-only monitoring increases scheming, suggesting that partial oversight can act as an optimization constraint rather than a deterrent. CoT is a useful but incomplete monitoring signal: it can reveal latent scheming before execution, yet action-only scheming shows that covert behavior may occur without explicit reasoning evidence. We release the benchmark, code, and monitor at: https://github.com/launchnlp/SchemeArena.", "arxiv_id": "2609.08126", "arxiv_url": "https://arxiv.org/abs/2609.08126", "authors": ["Jie Ruan", "Inderjeet Nair", "Amy Liu", "Muhammad Khalifa", "Yusheng Zhou", "Lu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa SCHEMEARENA\uff0c\u4e00\u4e2a\u8986\u76d6\u5de5\u5177\u9886\u57df\u3001\u76ee\u6807\u3001\u76d1\u7763\u6761\u4ef6\u548c\u538b\u529b\u673a\u5236\u7684400\u573a\u666f\u57fa\u51c6\uff0c\u7528\u4e8e\u7cfb\u7edf\u5316\u538b\u529b\u6d4b\u8bd5LLM\u667a\u80fd\u4f53\u7684\u201cscheming\u201d\u884c\u4e3a\u3002\u8fd8\u63d0\u51fa SCOUT \u76d1\u63a7\u5668\uff0c\u57fa\u4e8e\u667a\u80fd\u4f53\u63a8\u7406\u4e0e\u884c\u52a8\u8bc1\u636e\u8fdb\u884c\u591a\u7ef4\u5ea6\u5224\u65ad\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/launchnlp/SchemeArena", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08126", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u56e0\u5b50\u5316\u573a\u666f\u5408\u6210\u6846\u67b6\uff0c\u9694\u79bb\u5de5\u5177\u53ef\u4f9b\u6027\u3001\u5de5\u5177\u6027\u76ee\u6807\u3001\u76d1\u7763\u6761\u4ef6\u3001\u540e\u679c\u611f\u77e5\u7b49\u56e0\u7d20\u5bf9\u6697\u4e2d\u8c0b\u5212\u7684\u5f71\u54cd", "\u57285\u4e2aLLM\u667a\u80fd\u4f53\u4e0a\u7684\u53d7\u63a7\u5b9e\u9a8c\u53d1\u73b0\uff0c\u663e\u5f0f\u5de5\u5177\u6027\u76ee\u6807\u662f\u8bf1\u53d1scheming\u503e\u5411\u7684\u6700\u5f3a\u56e0\u7d20", "\u90e8\u5206\u76d1\u7763\u53ef\u80fd\u9002\u5f97\u5176\u53cd\uff1a\u4ec5\u76d1\u63a7\u884c\u52a8\u5728\u82e5\u5e72\u95ed\u6e90\u6a21\u578b\u4e2d\u53cd\u800c\u589e\u52a0scheming\uff0cCoT\u76d1\u63a7\u6709\u7528\u4f46\u4e0d\u5b8c\u6574"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u57fa\u51c6\u8bc4\u6d4b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": "LAUNCH Lab", "pdf_url": "https://arxiv.org/pdf/2609.08126v1", "published_at": "2026-09-08", "score": 0.411, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08126.png", "title": "SchemeArena: Factorized Stress Testing of Scheming in LLM Agents", "tldr": "\u63d0\u51fa400\u573a\u666f\u57fa\u51c6\u6d4b\u8bd5LLM\u667a\u80fd\u4f53\u6697\u4e2d\u8c0b\u5212", "upvotes": 7, "what_it_is": "\u8bba\u6587\u63d0\u51fa SCHEMEARENA\uff0c\u4e00\u4e2a\u8986\u76d6\u5de5\u5177\u9886\u57df\u3001\u76ee\u6807\u3001\u76d1\u7763\u6761\u4ef6\u548c\u538b\u529b\u673a\u5236\u7684400\u573a\u666f\u57fa\u51c6\uff0c\u7528\u4e8e\u7cfb\u7edf\u5316\u538b\u529b\u6d4b\u8bd5LLM\u667a\u80fd\u4f53\u7684\u201cscheming\u201d\u884c\u4e3a\u3002\u8fd8\u63d0\u51fa SCOUT \u76d1\u63a7\u5668\uff0c\u57fa\u4e8e\u667a\u80fd\u4f53\u63a8\u7406\u4e0e\u884c\u52a8\u8bc1\u636e\u8fdb\u884c\u591a\u7ef4\u5ea6\u5224\u65ad\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06LLM\u667a\u80fd\u4f53\u5bf9\u9f50\u98ce\u9669\u4e2d\u7684\u9690\u853d\u5931\u914d\u884c\u4e3a\u4ece\u96f6\u6563\u6848\u4f8b\u63a8\u8fdb\u5230\u5927\u89c4\u6a21\u3001\u53ef\u63a7\u3001\u53ef\u590d\u73b0\u7684\u57fa\u51c6\u8bc4\u6d4b\uff0c\u5e76\u63ed\u793a\u76d1\u7763\u65b9\u5f0f\u53ef\u80fd\u6539\u53d8\u800c\u975e\u5355\u7eaf\u6291\u5236\u667a\u80fd\u4f53\u7b56\u7565\uff0c\u5177\u6709\u91cd\u8981\u5b89\u5168\u8bc4\u4f30\u4ef7\u503c\u3002"}, {"abstract": "Sequential memory agents process long documents by reading chunks one after another while maintaining a compact memory state, coupling document traversal to reasoning depth. This coupling introduces sensitivity to evidence placement and ties inference latency linearly to document length. We introduce PARSER, which decouples reading from reasoning. A bank of lightweight subagents each bound to a single chunk read the entire document in parallel, while a lead agent reasons in depth through iterative scatter--gather rounds: at each round it broadcasts a query to all subagents, aggregates the returned evidence, and formulates a deeper follow-up query conditioned on what has been found so far. This decoupled design concentrates all learnable behavior in the lead agent, which is optimized with reinforcement learning, while the subagents remain frozen off-the-shelf models. On multi-hop QA with contexts ranging from 7K to 896K tokens, PARSER with a 4B backbone outperforms the strongest sequential memory baseline by 5.7 points on average and by 12.0 points at 896K tokens. Scaling to a 9B backbone, PARSER surpasses DeepSeek-V4-Pro by 6.3 points. Controlled experiments confirm that PARSER is robust to perturbations in evidence position, order, and distance, conditions that cause large accuracy swings in sequential methods, while reducing inference latency by up to 11x.", "arxiv_id": "2609.06702", "arxiv_url": "https://arxiv.org/abs/2609.06702", "authors": ["Kun Li", "Zexuan Qiu", "Tianhua Zhang", "Irwin King", "Helen Meng"], "brief": "PARSER \u5c06\u957f\u6587\u6863\u9605\u8bfb\u4e0e\u6df1\u5ea6\u63a8\u7406\u89e3\u8026\uff1a\u591a\u4e2a\u8f7b\u91cf\u5b50\u667a\u80fd\u4f53\u5e76\u884c\u8bfb\u53d6\u4e0d\u540c\u5206\u5757\uff0c\u4e3b\u667a\u80fd\u4f53\u901a\u8fc7\u591a\u8f6e scatter-gather \u67e5\u8be2\u6c47\u603b\u8bc1\u636e\u5e76\u9010\u6b65\u6df1\u5165\u63a8\u7406\u3002\u4e3b\u667a\u80fd\u4f53\u7528\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\uff0c\u5b50\u667a\u80fd\u4f53\u4fdd\u6301\u51bb\u7ed3\uff0c\u4ece\u800c\u63d0\u5347\u8d85\u957f\u4e0a\u4e0b\u6587\u591a\u8df3\u95ee\u7b54\u6027\u80fd\u4e0e\u6548\u7387\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/cuhk-parser/PARSER", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.06702", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9 7K \u5230 896K tokens \u7684\u591a\u8df3\u95ee\u7b54\uff0c4B \u7248\u672c\u5e73\u5747\u6bd4\u6700\u5f3a sequential memory baseline \u9ad8 5.7 \u5206\uff0c\u5728 896K tokens \u4e0a\u9ad8 12.0 \u5206", "9B \u7248\u672c\u8d85\u8fc7 DeepSeek-V4-Pro 6.3 \u5206\uff0c\u663e\u793a\u5c0f/\u4e2d\u7b49\u89c4\u6a21\u6a21\u578b\u4e5f\u53ef\u901a\u8fc7\u67b6\u6784\u8bbe\u8ba1\u83b7\u5f97\u5f3a\u957f\u4e0a\u4e0b\u6587\u80fd\u529b", "\u5bf9\u8bc1\u636e\u4f4d\u7f6e\u3001\u987a\u5e8f\u548c\u8ddd\u79bb\u6270\u52a8\u66f4\u9c81\u68d2\uff0c\u5e76\u5c06\u63a8\u7406\u5ef6\u8fdf\u6700\u9ad8\u964d\u4f4e 11 \u500d"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u4e0a\u4e0b\u6587", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u8df3\u95ee\u7b54"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.06702v1", "published_at": "2026-09-06", "score": 0.409, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06702.png", "title": "PARSER: Read in Parallel, Reason in Depth for Long-Context LLM Agents", "tldr": "\u5e76\u884c\u8bfb\u957f\u6587\u3001\u8fed\u4ee3\u63a8\u7406\u7684\u957f\u4e0a\u4e0b\u6587\u667a\u80fd\u4f53", "upvotes": 4, "what_it_is": "PARSER \u5c06\u957f\u6587\u6863\u9605\u8bfb\u4e0e\u6df1\u5ea6\u63a8\u7406\u89e3\u8026\uff1a\u591a\u4e2a\u8f7b\u91cf\u5b50\u667a\u80fd\u4f53\u5e76\u884c\u8bfb\u53d6\u4e0d\u540c\u5206\u5757\uff0c\u4e3b\u667a\u80fd\u4f53\u901a\u8fc7\u591a\u8f6e scatter-gather \u67e5\u8be2\u6c47\u603b\u8bc1\u636e\u5e76\u9010\u6b65\u6df1\u5165\u63a8\u7406\u3002\u4e3b\u667a\u80fd\u4f53\u7528\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\uff0c\u5b50\u667a\u80fd\u4f53\u4fdd\u6301\u51bb\u7ed3\uff0c\u4ece\u800c\u63d0\u5347\u8d85\u957f\u4e0a\u4e0b\u6587\u591a\u8df3\u95ee\u7b54\u6027\u80fd\u4e0e\u6548\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u51fb\u957f\u4e0a\u4e0b\u6587\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u987a\u5e8f\u8bfb\u53d6\u5bfc\u81f4\u6027\u80fd\u4f9d\u8d56\u8bc1\u636e\u4f4d\u7f6e\u4e14\u5ef6\u8fdf\u968f\u6587\u6863\u957f\u5ea6\u7ebf\u6027\u589e\u957f\u3002PARSER \u7528\u5e76\u884c\u68c0\u7d22\u5f0f\u8bfb\u53d6\u52a0\u8fed\u4ee3\u63a8\u7406\u7684\u65b9\u5f0f\u63d0\u5347\u9c81\u68d2\u6027\u3001\u51c6\u786e\u7387\u548c\u901f\u5ea6\uff0c\u5bf9\u957f\u6587\u6863\u95ee\u7b54\u3001\u6cd5\u5f8b/\u79d1\u7814\u68c0\u7d22\u548c\u4f01\u4e1a\u77e5\u8bc6\u5e93\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We consider the problem of support recovery for sparse binary signals from noisy linear measurements. For sparse Gaussian measurement matrices we identify sufficient conditions on the minimal sample size for maximum-likelihood recovery in the high-SNR regime $ds/p \\to \\infty$, where $p$ denotes the signal dimension, $s$ the number of non-zero components of the signal, and $d$ the expected number of non-zero components per row of measurement. Combined with known lower bounds, this yields an information-theoretic threshold of order $s\\log(p/s) / \\log(ds/p)$, making explicit the price of measurement sparsity. In particular, we highlight a regime where the sample-complexity loss from measurement sparsity is logarithmic while the computational gain is nearly linear. Second, we study recovery after sparsifying an originally dense Gaussian design: the observations are generated from the dense design, while estimation uses an independently sparsified design and a rescaled response. In the proportional regime $s=\u03b1p$, $d=\u03c8p$, we prove that, for every fixed target error level $\u03b4$ and every slack $\\varepsilon\u003e0$, a sample size of order $p/\u03c8^2$ is sufficient for support recovery for arbitrarily small $\u03c8$.", "arxiv_id": "2509.01809", "arxiv_url": "https://arxiv.org/abs/2509.01809", "authors": ["Youssef Chaabouni", "David Gamarnik"], "brief": "\u672c\u6587\u7814\u7a76\u5e26\u566a\u7ebf\u6027\u6d4b\u91cf\u4e2d\u7a00\u758f\u4e8c\u503c\u4fe1\u53f7\u7684\u652f\u6491\u6062\u590d\u95ee\u9898\uff0c\u7ed9\u51fa\u7a00\u758f\u9ad8\u65af\u6d4b\u91cf\u77e9\u9635\u4e0b\u6700\u5927\u4f3c\u7136\u6062\u590d\u7684\u5145\u5206\u6837\u672c\u6761\u4ef6\u3002\u8bba\u6587\u8fd8\u5206\u6790\u4e86\u7531\u7a20\u5bc6\u9ad8\u65af\u8bbe\u8ba1\u72ec\u7acb\u7a00\u758f\u5316\u540e\u8fdb\u884c\u4f30\u8ba1\u7684\u6062\u590d\u6761\u4ef6\u3002", "categories": ["stat.ML", "cs.IT", "cs.LG", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2509.01809", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u5728\u9ad8\u4fe1\u566a\u6bd4\u6761\u4ef6 ds/p \u2192 \u221e \u4e0b\uff0c\u5f97\u5230\u6700\u5c0f\u6837\u672c\u91cf\u5145\u5206\u6761\u4ef6\uff0c\u5e76\u4e0e\u5df2\u6709\u4e0b\u754c\u7ed3\u5408\u7ed9\u51fa\u4fe1\u606f\u8bba\u9608\u503c\u91cf\u7ea7 s log(p/s) / log(ds/p)", "\u660e\u786e\u91cf\u5316\u4e86\u6d4b\u91cf\u77e9\u9635\u7a00\u758f\u6027\u5e26\u6765\u7684\u4ee3\u4ef7\uff1a\u5b58\u5728\u6837\u672c\u590d\u6742\u5ea6\u4ec5\u5bf9\u6570\u635f\u5931\u3001\u8ba1\u7b97\u6536\u76ca\u8fd1\u7ebf\u6027\u7684\u533a\u95f4", "\u5bf9\u7a20\u5bc6\u8bbe\u8ba1\u751f\u6210\u89c2\u6d4b\u3001\u4f30\u8ba1\u65f6\u4f7f\u7528\u72ec\u7acb\u7a00\u758f\u5316\u8bbe\u8ba1\u7684\u573a\u666f\uff0c\u8bc1\u660e\u5728\u6bd4\u4f8b\u533a\u95f4 s=\u03b1p\u3001d=\u03c8p \u4e0b\uff0c\u6837\u672c\u91cf O(p/\u03c8\u00b2) \u53ef\u5b9e\u73b0\u76ee\u6807\u8bef\u5dee\u6062\u590d"], "keywords": ["\u7a00\u758f\u6062\u590d", "\u538b\u7f29\u611f\u77e5", "\u7edf\u8ba1\u5b66\u4e60", "\u4fe1\u606f\u8bba"], "num_comments": 2, "on_hf": true, "organization": "Massachusetts Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2509.01809v2", "published_at": "2025-09-01", "score": 0.4, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2509.01809.png", "title": "The Price of Sparsity: Sufficient Conditions for Sparse Recovery using Sparse and Sparsified Measurements", "tldr": "\u523b\u753b\u7a00\u758f\u6d4b\u91cf\u4e0b\u7a00\u758f\u6062\u590d\u7684\u6837\u672c\u4ee3\u4ef7", "upvotes": 1, "what_it_is": "\u672c\u6587\u7814\u7a76\u5e26\u566a\u7ebf\u6027\u6d4b\u91cf\u4e2d\u7a00\u758f\u4e8c\u503c\u4fe1\u53f7\u7684\u652f\u6491\u6062\u590d\u95ee\u9898\uff0c\u7ed9\u51fa\u7a00\u758f\u9ad8\u65af\u6d4b\u91cf\u77e9\u9635\u4e0b\u6700\u5927\u4f3c\u7136\u6062\u590d\u7684\u5145\u5206\u6837\u672c\u6761\u4ef6\u3002\u8bba\u6587\u8fd8\u5206\u6790\u4e86\u7531\u7a20\u5bc6\u9ad8\u65af\u8bbe\u8ba1\u72ec\u7acb\u7a00\u758f\u5316\u540e\u8fdb\u884c\u4f30\u8ba1\u7684\u6062\u590d\u6761\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u4fe1\u606f\u8bba\u89d2\u5ea6\u7cbe\u786e\u523b\u753b\u4e86\u7a00\u758f\u6d4b\u91cf\u5728\u7edf\u8ba1\u6548\u7387\u4e0e\u8ba1\u7b97\u6548\u7387\u4e4b\u95f4\u7684\u6743\u8861\uff0c\u4e3a\u538b\u7f29\u611f\u77e5\u3001\u7a00\u758f\u5b66\u4e60\u548c\u5927\u89c4\u6a21\u7ebf\u6027\u6d4b\u91cf\u7cfb\u7edf\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u7406\u8bba\u4f9d\u636e\u3002"}, {"abstract": "Agent harnesses (the system prompt, tool set, execution hooks, and context-management scaffolding around a model) are a critical determinant of agentic task success. Automated harness evolution can enable smaller models to perform well on domain-specific tasks at a fraction of frontier-model cost. Since both the harness and model weights shape behavior, we ask how harness evolution and lightweight fine-tuning should be combined. Across seven enterprise agent tasks, we first evolve a harness with the weaker model, then find that a stronger expert often uses it more effectively, suggesting expert supervision could close the remaining gap. However, training the weaker model on the expert\u0027s complete trajectories under the evolved harness backfires: performance regresses on all seven tasks by 4 to 30 points across Qwen3-Coder and Gemma 4, even though the same procedure helps under the unevolved harness. Our analysis shows that imitation transfers knowledge and increases scaffold usage, but disrupts model-harness fit: the weaker model adopts the expert\u0027s planning strategy without the competence to execute it and no longer matches the harness evolved around its native planning style. We therefore develop an on-policy expert-correction pipeline, automated by a meta-level MLE agent, that localizes the failing turn in the weaker model\u0027s own rollout and asks the expert to rewrite only that turn. This preserves the model\u0027s planning style and combines the gains of harness evolution and model adaptation. Our results identify and resolve a source of contention between harness and weight updates, yielding a compatibility-preserving recipe for economical co-evolution on domain-specific enterprise tasks.", "arxiv_id": "2609.09134", "arxiv_url": "https://arxiv.org/abs/2609.09134", "authors": ["Zhou Yu", "Bin Bi", "Shiva Kumar Pentyala", "Shubham Mehrotra", "Sougata Chaudhuri", "Shilpa Bhagavath", "Zeyuan Chen", "Ran Xu", "Phil Mui", "James Zhu", "Sitaram Asur"], "brief": "\u8bba\u6587\u7814\u7a76\u667a\u80fd\u4f53 harness\uff08\u7cfb\u7edf\u63d0\u793a\u3001\u5de5\u5177\u3001\u6267\u884c\u94a9\u5b50\u4e0e\u4e0a\u4e0b\u6587\u7ba1\u7406\uff09\u8fdb\u5316\u4e0e\u8f7b\u91cf\u5fae\u8c03\u5982\u4f55\u534f\u540c\u3002\u4f5c\u8005\u53d1\u73b0\u76f4\u63a5\u6a21\u4eff\u5f3a\u6a21\u578b\u8f68\u8ff9\u4f1a\u7834\u574f\u5f31\u6a21\u578b\u4e0e\u5df2\u8fdb\u5316 harness \u7684\u5339\u914d\uff0c\u5e76\u63d0\u51fa\u5728\u7ebf\u4e13\u5bb6\u7ea0\u9519\u6d41\u7a0b\uff0c\u53ea\u6539\u5199\u5f31\u6a21\u578b\u5931\u8d25\u56de\u5408\u4ee5\u4fdd\u7559\u5176\u539f\u6709\u89c4\u5212\u98ce\u683c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09134", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u4e03\u4e2a\u4f01\u4e1a\u7ea7\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\uff0c\u5148\u7528\u5f31\u6a21\u578b\u8fdb\u5316 harness \u540e\uff0c\u5f3a\u6a21\u578b\u901a\u5e38\u80fd\u66f4\u597d\u5229\u7528\u8be5 harness\uff0c\u8bf4\u660e\u4ecd\u5b58\u5728\u53ef\u7531\u4e13\u5bb6\u76d1\u7763\u5f25\u8865\u7684\u5dee\u8ddd\u3002", "\u5728\u5df2\u8fdb\u5316 harness \u4e0b\uff0c\u7528\u5f3a\u6a21\u578b\u5b8c\u6574\u8f68\u8ff9\u8bad\u7ec3\u5f31\u6a21\u578b\u4f1a\u9002\u5f97\u5176\u53cd\uff1aQwen3-Coder \u548c Gemma 4 \u5728\u6240\u6709\u4e03\u4e2a\u4efb\u52a1\u4e0a\u6027\u80fd\u4e0b\u964d 4 \u5230 30 \u5206\uff1b\u800c\u540c\u6837\u65b9\u6cd5\u5728\u672a\u8fdb\u5316 harness \u4e0b\u53cd\u800c\u6709\u5e2e\u52a9\u3002", "\u63d0\u51fa\u7531\u5143\u5c42 MLE agent \u81ea\u52a8\u5316\u7684 on-policy expert-correction\uff1a\u5b9a\u4f4d\u5f31\u6a21\u578b\u81ea\u8eab rollout \u4e2d\u7684\u5931\u8d25\u8f6e\u6b21\uff0c\u4ec5\u8ba9\u4e13\u5bb6\u6539\u5199\u8be5\u8f6e\uff0c\u4ece\u800c\u540c\u65f6\u4fdd\u7559\u6a21\u578b-harness \u5339\u914d\u5e76\u63d0\u5347\u80fd\u529b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5fae\u8c03", "\u6a21\u4eff\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": "Salesforce", "pdf_url": "https://arxiv.org/pdf/2609.09134v1", "published_at": "2026-09-08", "score": 0.399, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09134.png", "title": "Co-Evolving Harnesses and Models: On-Policy Correction Helps Weaker Models Catch Up Where Imitation Fails", "tldr": "\u7528\u5728\u7ebf\u4e13\u5bb6\u7ea0\u9519\u8ba9\u5f31\u6a21\u578b\u9002\u914d\u8fdb\u5316\u5f0f\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 4, "what_it_is": "\u8bba\u6587\u7814\u7a76\u667a\u80fd\u4f53 harness\uff08\u7cfb\u7edf\u63d0\u793a\u3001\u5de5\u5177\u3001\u6267\u884c\u94a9\u5b50\u4e0e\u4e0a\u4e0b\u6587\u7ba1\u7406\uff09\u8fdb\u5316\u4e0e\u8f7b\u91cf\u5fae\u8c03\u5982\u4f55\u534f\u540c\u3002\u4f5c\u8005\u53d1\u73b0\u76f4\u63a5\u6a21\u4eff\u5f3a\u6a21\u578b\u8f68\u8ff9\u4f1a\u7834\u574f\u5f31\u6a21\u578b\u4e0e\u5df2\u8fdb\u5316 harness \u7684\u5339\u914d\uff0c\u5e76\u63d0\u51fa\u5728\u7ebf\u4e13\u5bb6\u7ea0\u9519\u6d41\u7a0b\uff0c\u53ea\u6539\u5199\u5f31\u6a21\u578b\u5931\u8d25\u56de\u5408\u4ee5\u4fdd\u7559\u5176\u539f\u6709\u89c4\u5212\u98ce\u683c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u201c\u811a\u624b\u67b6\u8fdb\u5316\u201d\u548c\u201c\u6a21\u578b\u6743\u91cd\u66f4\u65b0\u201d\u53ef\u80fd\u76f8\u4e92\u51b2\u7a81\uff0c\u6311\u6218\u4e86\u7b80\u5355\u4e13\u5bb6\u6a21\u4eff\u5b66\u4e60\u7684\u9002\u7528\u6027\uff1b\u5176\u5728\u7ebf\u5c40\u90e8\u7ea0\u9519\u65b9\u6848\u4e3a\u4f4e\u6210\u672c\u5b9a\u5236\u4f01\u4e1a\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u6a21\u578b-harness \u534f\u540c\u4f18\u5316\u8def\u5f84\u3002"}, {"abstract": "Automating empirical research is a long-standing direction of AI. Recent automatic research (AutoResearch) agents bring this goal within reach, as modern LLMs show the capability to independently implement solutions and learn from the execution outcomes. Behind these gains, post-training (especially RL) plays a central role. In this paper, we identify a fundamental tension when scaling RL for these agents: the two components of every AutoResearch trajectory (agent generation and environment execution) scale in very different manners, since all generation shares compute through batching, while each execution occupies its exclusive sandbox and real machine time. As a result, the environment execution dominates the training cost and becomes the bottleneck as trajectories grow. To resolve this tension, we propose World Model RL (WMRL), which replaces environment execution with a world model to remove this bottleneck. Additionally, the world model can be imperfect, as its rewards are corrupted by bias and noise. Therefore, we further equip WMRL with two mitigations, Online Debiasing and Inverse-Variance Denoising, which offset the bias and suppress the noise respectively. Theoretically, we prove that both mitigations of WMRL strictly improve the convergence guarantee. Empirically, WMRL accelerates training by 3-4x on various tasks at different agent scales, while exceeding the performance of standard RL baselines. Moreover, our post-trained 4B and 9B agents outperform much larger open-weight agents of 48B and 120B on held-out benchmarks. Beyond AutoResearch, WMRL also transfers to post-training embodied VLA policies, which demonstrates the generalizability of our method.", "arxiv_id": "2608.12564", "arxiv_url": "https://arxiv.org/abs/2608.12564", "authors": ["Xiyuan Yang", "Sheikh Sarwar", "Jingru Cheng", "Zhan Shi", "Duanshun Li", "Huiyuan Chen", "Haiyang Zhang", "Xing Fan", "Chenlei Guo", "Jingrui He", "Zhenyu Liao"], "brief": "\u8bba\u6587\u63d0\u51fa World Model RL\uff08WMRL\uff09\uff0c\u7528\u4e16\u754c\u6a21\u578b\u66ff\u4ee3\u771f\u5b9e\u73af\u5883\u6267\u884c\uff0c\u7f13\u89e3 AutoResearch \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u6c99\u7bb1\u6267\u884c\u6210\u672c\u9ad8\u3001\u96be\u4ee5\u6269\u5c55\u7684\u74f6\u9888\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u5728\u7ebf\u53bb\u504f\u4e0e\u9006\u65b9\u5dee\u53bb\u566a\uff0c\u4ee5\u5904\u7406\u4e16\u754c\u6a21\u578b\u5956\u52b1\u7684\u504f\u5dee\u548c\u566a\u58f0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12564", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa AutoResearch \u8f68\u8ff9\u4e2d\u201c\u751f\u6210\u201d\u53ef\u6279\u5904\u7406\u6269\u5c55\uff0c\u800c\u201c\u73af\u5883\u6267\u884c\u201d\u9700\u72ec\u5360\u6c99\u7bb1\u548c\u771f\u5b9e\u673a\u5668\u65f6\u95f4\uff0c\u5bfc\u81f4\u8bad\u7ec3\u6210\u672c\u4e3b\u8981\u88ab\u6267\u884c\u73af\u8282\u4e3b\u5bfc\u3002", "\u63d0\u51fa Online Debiasing \u4e0e Inverse-Variance Denoising\uff0c\u7406\u8bba\u8bc1\u660e\u4e8c\u8005\u53ef\u4e25\u683c\u6539\u5584 WMRL \u7684\u6536\u655b\u4fdd\u8bc1\u3002", "\u5b9e\u9a8c\u4e2d WMRL \u5728\u591a\u4efb\u52a1\u548c\u4e0d\u540c\u667a\u80fd\u4f53\u89c4\u6a21\u4e0a\u8bad\u7ec3\u63d0\u901f 3-4 \u500d\uff0c4B/9B \u540e\u8bad\u7ec3\u667a\u80fd\u4f53\u8d85\u8fc7 48B/120B \u5f00\u6e90\u667a\u80fd\u4f53\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u5177\u8eab VLA \u7b56\u7565\u540e\u8bad\u7ec3\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u52a8\u79d1\u7814"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2608.12564v3", "published_at": "2026-08-12", "score": 0.389, "selected_reasons": ["HF trending (417\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12564.png", "title": "Scaling Automatic Research Agents via World Models", "tldr": "\u7528\u4e16\u754c\u6a21\u578b\u52a0\u901f\u81ea\u52a8\u7814\u7a76\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60", "upvotes": 417, "what_it_is": "\u8bba\u6587\u63d0\u51fa World Model RL\uff08WMRL\uff09\uff0c\u7528\u4e16\u754c\u6a21\u578b\u66ff\u4ee3\u771f\u5b9e\u73af\u5883\u6267\u884c\uff0c\u7f13\u89e3 AutoResearch \u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u6c99\u7bb1\u6267\u884c\u6210\u672c\u9ad8\u3001\u96be\u4ee5\u6269\u5c55\u7684\u74f6\u9888\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u5728\u7ebf\u53bb\u504f\u4e0e\u9006\u65b9\u5dee\u53bb\u566a\uff0c\u4ee5\u5904\u7406\u4e16\u754c\u6a21\u578b\u5956\u52b1\u7684\u504f\u5dee\u548c\u566a\u58f0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u6269\u5c55\u4e2d\u7684\u6838\u5fc3\u6210\u672c\u74f6\u9888\u7ed9\u51fa\u7cfb\u7edf\u89e3\u6cd5\uff0c\u628a\u4e16\u754c\u6a21\u578b\u7528\u4e8e\u66ff\u4ee3\u6602\u8d35\u6267\u884c\u5e76\u63d0\u4f9b\u53bb\u504f\u53bb\u566a\u673a\u5236\uff0c\u517c\u5177\u7406\u8bba\u4fdd\u8bc1\u548c\u663e\u8457\u5b9e\u8bc1\u6536\u76ca\uff0c\u5bf9\u79d1\u7814\u81ea\u52a8\u5316\u3001\u667a\u80fd\u4f53\u8bad\u7ec3\u548c\u5177\u8eab\u7b56\u7565\u540e\u8bad\u7ec3\u90fd\u6709\u6f5c\u5728\u5f71\u54cd\u3002"}, {"abstract": "Ensuring the safety of autonomous driving is a critical challenge. Scenario-based testing is a systematic process used to validate Autonomous Driving Systems (ADSs), but it remains a fragmented modular pipeline in which scenario generation, retrieval, modification, ADS execution, and results analysis are performed by separate tools with little interaction. Large Language Model (LLM) agents have shown promise across ADS sub-systems such as perception, planning, and control. However, no prior work covers the whole scenario-based testing pipeline for ADSs with a unified LLM-agent framework. We present PlannerForge, an LLM-agent framework that extends all scenario-based testing stages (from Scenario Generation to ADS Assessment) and adds two further LLM-enhanced stages: ADS Enhancement and ADS Benchmarking. We evaluate PlannerForge with 10 off-the-shelf LLMs across all tasks (Generation, Selection, Modification, Module Routing, Planner Testing, and Enhancement) under 5 prompt conditions. Best-per-task scores range from 0.88 to 1.00, and open-source 20-35B backends match commercial APIs on most tasks. Open-source models such as Qwen3.6:35B match commercial APIs on three of the five tasks. Chaining the modules end-to-end retains 83% / 78% of seed queries (commercial / open). It outperforms Scenario Factory 2.0 (Finkeldei et al., 2025) on natural-language generation (193 vs. 144 executable of 200) and realises 92-96% of requested city, road and vehicle attributes. It outperforms BM25 (Robertson and Zaragoza, 2009) at rank 1 selection (92.0% vs. 67.5%) and From-Words-to-Collisions (Gao et al., 2025) on physically valid edits (\u003e=94% vs. 31%). At N=400, cost-tuning lifts planner success from 50.4% to 70.2% and cuts collisions from 19.0% to 8.4%, without domain-specific fine-tuning.", "arxiv_id": "2609.08965", "arxiv_url": "https://arxiv.org/abs/2609.08965", "authors": ["Yuan Gao", "Sebastian M\u00fcller", "Mattia Piccinini", "Marc Kaufeld", "Yuchen Zhang", "Finn Rasmus Sch\u00e4fer", "Qunying Song", "Johannes Betz"], "brief": "\u8bba\u6587\u63d0\u51fa PlannerForge\uff0c\u4e00\u4e2a\u8986\u76d6\u81ea\u52a8\u9a7e\u9a76\u8fd0\u52a8\u89c4\u5212\u5668\u573a\u666f\u5316\u6d4b\u8bd5\u5168\u6d41\u7a0b\u7684 LLM \u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ece\u573a\u666f\u751f\u6210\u3001\u9009\u62e9\u3001\u4fee\u6539\u5230\u89c4\u5212\u5668\u6d4b\u8bd5\u3001\u8bc4\u4f30\uff0c\u5e76\u6269\u5c55\u5230 ADS \u589e\u5f3a\u4e0e\u57fa\u51c6\u6d4b\u8bd5\u3002\u4f5c\u8005\u752810\u4e2a\u73b0\u6210LLM\u30015\u79cd\u63d0\u793a\u6761\u4ef6\u7cfb\u7edf\u8bc4\u4f30\uff0c\u9a8c\u8bc1\u5176\u7aef\u5230\u7aef\u53ef\u7528\u6027\u4e0e\u6210\u672c\u8c03\u4f18\u6548\u679c\u3002", "categories": ["cs.AI", "cs.CL", "cs.RO"], "github_repo": "https://github.com/TUM-AVS/PlannerForge", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.08965", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7edf\u4e00\u6574\u5408\u539f\u672c\u5272\u88c2\u7684\u573a\u666f\u751f\u6210\u3001\u68c0\u7d22\u3001\u7f16\u8f91\u3001\u6a21\u5757\u8def\u7531\u3001\u89c4\u5212\u5668\u6267\u884c\u4e0e\u7ed3\u679c\u5206\u6790\u6d41\u7a0b\uff0c\u5f62\u6210\u7aef\u5230\u7aef LLM-agent \u6d4b\u8bd5\u7ba1\u7ebf\u3002", "\u591a\u9879\u4efb\u52a1\u6700\u4f73\u5f97\u5206\u8fbe\u52300.88\u52301.00\uff0c\u5f00\u6e9020-35B\u6a21\u578b\u5728\u591a\u6570\u4efb\u52a1\u4e0a\u63a5\u8fd1\u5546\u4e1aAPI\uff0cQwen3.6:35B\u5728\u4e94\u9879\u4efb\u52a1\u4e2d\u6709\u4e09\u9879\u5339\u914d\u5546\u4e1a\u6a21\u578b\u3002", "\u76f8\u8f83\u57fa\u7ebf\uff0cPlannerForge\u751f\u6210\u53ef\u6267\u884c\u573a\u666f193/200\u4f18\u4e8eScenario Factory 2.0\u7684144/200\uff1bRank-1\u9009\u62e992.0%\u4f18\u4e8eBM25\u768467.5%\uff1b\u7269\u7406\u6709\u6548\u7f16\u8f91\u7387\u226594%\u8fdc\u9ad8\u4e8e31%\u3002", "\u5728N=400\u5b9e\u9a8c\u4e2d\uff0c\u6210\u672c\u8c03\u4f18\u5c06\u89c4\u5212\u5668\u6210\u529f\u7387\u4ece50.4%\u63d0\u5347\u523070.2%\uff0c\u78b0\u649e\u7387\u4ece19.0%\u964d\u81f38.4%\uff0c\u4e14\u65e0\u9700\u9886\u57df\u4e13\u95e8\u5fae\u8c03\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u9a7e\u9a76", "\u573a\u666f\u6d4b\u8bd5", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "TUM - Professorship of Autonomous Vehicle Systems", "pdf_url": "https://arxiv.org/pdf/2609.08965v1", "published_at": "2026-09-08", "score": 0.381, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08965.png", "title": "PlannerForge: LLM Agents for Scenario-Based Testing of Motion Planners in Autonomous Driving", "tldr": "\u7528LLM\u667a\u80fd\u4f53\u8d2f\u901a\u81ea\u52a8\u9a7e\u9a76\u573a\u666f\u6d4b\u8bd5", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa PlannerForge\uff0c\u4e00\u4e2a\u8986\u76d6\u81ea\u52a8\u9a7e\u9a76\u8fd0\u52a8\u89c4\u5212\u5668\u573a\u666f\u5316\u6d4b\u8bd5\u5168\u6d41\u7a0b\u7684 LLM \u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ece\u573a\u666f\u751f\u6210\u3001\u9009\u62e9\u3001\u4fee\u6539\u5230\u89c4\u5212\u5668\u6d4b\u8bd5\u3001\u8bc4\u4f30\uff0c\u5e76\u6269\u5c55\u5230 ADS \u589e\u5f3a\u4e0e\u57fa\u51c6\u6d4b\u8bd5\u3002\u4f5c\u8005\u752810\u4e2a\u73b0\u6210LLM\u30015\u79cd\u63d0\u793a\u6761\u4ef6\u7cfb\u7edf\u8bc4\u4f30\uff0c\u9a8c\u8bc1\u5176\u7aef\u5230\u7aef\u53ef\u7528\u6027\u4e0e\u6210\u672c\u8c03\u4f18\u6548\u679c\u3002", "why_notable": "\u8fd9\u662f\u5c06 LLM \u667a\u80fd\u4f53\u7cfb\u7edf\u6027\u7528\u4e8e\u81ea\u52a8\u9a7e\u9a76\u573a\u666f\u6d4b\u8bd5\u5168\u94fe\u8def\u7684\u5de5\u4f5c\uff0c\u4e0d\u53ea\u751f\u6210\u573a\u666f\uff0c\u8fd8\u80fd\u9009\u62e9\u3001\u7f16\u8f91\u3001\u6267\u884c\u3001\u8bc4\u4f30\u5e76\u6539\u8fdb\u89c4\u5212\u5668\uff1b\u7ed3\u679c\u663e\u793a\u5f00\u6e90\u5927\u6a21\u578b\u4e5f\u80fd\u652f\u6491\u8f83\u9ad8\u8d28\u91cf\u7684\u5b89\u5168\u6d4b\u8bd5\u81ea\u52a8\u5316\uff0c\u5177\u5907\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Most of mathematical knowledge has been communicated through so-called informal use of mathematics and natural language. With large language models (LLMs) being highly adept in using natural language, they achieve strong performance, yet not perfect, in informal mathematical reasoning. Restraining LLMs to informal reasoning misses out on the opportunity to use the discrete verification abilities that machines offer through machine-checkable proofs. In this paper, we bridge the gap between informal and formal reasoning by integrating Lean signals into the informal reasoning process. We introduce Magenta, a training-free agentic pipeline that, given only a natural-language problem, produces an answer, expresses it as a Lean 4 statement, and constructs a machine-checked proof. A statement judge verifies whether the formalisation preserves the original problem, while an error-attribution judge routes failed attempts either to mathematical re-derivation or local Lean repair. Magenta achieves 100% accuracy across all evaluated olympiad benchmarks, including AIME 2025, AIME 2026, and HMMT February 2026. When paired with the open-weight K2-Horizon-7B reasoner, it solves all six IMO 2026 problems. Our analysis shows that statement adjudication is essential for preventing false certificates and that feedback-guided correction outperforms independent resampling on difficult problems.", "arxiv_id": "2609.11319", "arxiv_url": "https://arxiv.org/abs/2609.11319", "authors": ["Joshua Ong Jun Leang", "Haonan Li", "Zheng Zhao", "Xinyi Shang", "Wenda Li", "Zhengzhong Liu", "Erix Xing", "Shay Cohen", "Eleonora Giunchiglia"], "brief": "\u8bba\u6587\u63d0\u51fa Magenta\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u667a\u80fd\u4f53\u5f0f\u6d41\u7a0b\uff1a\u4ece\u81ea\u7136\u8bed\u8a00\u6570\u5b66\u9898\u51fa\u53d1\uff0c\u5148\u7ed9\u51fa\u7b54\u6848\uff0c\u518d\u8f6c\u5199\u4e3a Lean 4 \u547d\u9898\u5e76\u6784\u9020\u53ef\u673a\u5668\u68c0\u67e5\u7684\u8bc1\u660e\u3002\u7cfb\u7edf\u901a\u8fc7\u547d\u9898\u4e00\u81f4\u6027\u88c1\u5224\u548c\u9519\u8bef\u5f52\u56e0\u88c1\u5224\uff0c\u628a\u5931\u8d25\u5c1d\u8bd5\u5206\u6d41\u5230\u91cd\u65b0\u6570\u5b66\u63a8\u5bfc\u6216\u5c40\u90e8 Lean \u4fee\u590d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11319", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u5c06 Lean \u5f62\u5f0f\u5316\u9a8c\u8bc1\u4fe1\u53f7\u63a5\u5165\u975e\u5f62\u5f0f\u5316\u6570\u5b66\u63a8\u7406\u8fc7\u7a0b\uff0c\u5f25\u5408\u81ea\u7136\u8bed\u8a00\u89e3\u9898\u4e0e\u673a\u5668\u53ef\u68c0\u67e5\u8bc1\u660e\u4e4b\u95f4\u7684\u65ad\u5c42", "\u5f15\u5165 statement judge \u68c0\u67e5\u5f62\u5f0f\u5316\u547d\u9898\u662f\u5426\u5fe0\u5b9e\u4fdd\u7559\u539f\u9898\uff0c\u907f\u514d\u201c\u8bc1\u660e\u4e86\u9519\u8bef\u547d\u9898\u201d\u7684\u5047\u8bc1\u4e66", "\u5728\u591a\u4e2a\u5965\u8d5b\u57fa\u51c6\u4e0a\u62a5\u544a 100% \u51c6\u786e\u7387\uff0c\u5e76\u4e0e K2-Horizon-7B \u642d\u914d\u89e3\u51b3\u5168\u90e8\u516d\u9053 IMO 2026 \u9898"], "keywords": ["\u6570\u5b66\u63a8\u7406", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u667a\u80fd\u4f53", "\u81ea\u52a8\u5b9a\u7406\u8bc1\u660e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11319v1", "published_at": "2026-09-10", "score": 0.375, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Magenta: Closing the Loop Between Mathematical Reasoning and Lean Verification", "tldr": "Magenta\u7528Lean\u95ed\u73af\u9a8c\u8bc1\u6570\u5b66\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Magenta\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u667a\u80fd\u4f53\u5f0f\u6d41\u7a0b\uff1a\u4ece\u81ea\u7136\u8bed\u8a00\u6570\u5b66\u9898\u51fa\u53d1\uff0c\u5148\u7ed9\u51fa\u7b54\u6848\uff0c\u518d\u8f6c\u5199\u4e3a Lean 4 \u547d\u9898\u5e76\u6784\u9020\u53ef\u673a\u5668\u68c0\u67e5\u7684\u8bc1\u660e\u3002\u7cfb\u7edf\u901a\u8fc7\u547d\u9898\u4e00\u81f4\u6027\u88c1\u5224\u548c\u9519\u8bef\u5f52\u56e0\u88c1\u5224\uff0c\u628a\u5931\u8d25\u5c1d\u8bd5\u5206\u6d41\u5230\u91cd\u65b0\u6570\u5b66\u63a8\u5bfc\u6216\u5c40\u90e8 Lean \u4fee\u590d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7528\u5f62\u5f0f\u5316\u8bc1\u660e\u7cfb\u7edf\u4e3a LLM \u6570\u5b66\u63a8\u7406\u95ed\u73af\u6821\u9a8c\u7684\u6f5c\u529b\uff0c\u4e0d\u4ec5\u63d0\u5347\u7b54\u6848\u53ef\u4fe1\u5ea6\uff0c\u8fd8\u80fd\u5b9a\u4f4d\u9519\u8bef\u6765\u6e90\u5e76\u6307\u5bfc\u4fee\u590d\uff1b\u82e5\u7ed3\u679c\u53ef\u590d\u73b0\uff0c\u5c06\u5bf9\u9ad8\u53ef\u9760\u6570\u5b66\u63a8\u7406\u548c\u81ea\u52a8\u5b9a\u7406\u8bc1\u660e\u4ea7\u751f\u91cd\u8981\u5f71\u54cd\u3002"}, {"abstract": "Deep research agents are increasingly capable of web search, tool use, multimodal evidence analysis, and information synthesis. However, existing benchmarks mainly evaluate medium-horizon exploration and rarely test whether agents can sustain long, dependency-heavy research processes. We introduce Mr.LHDR (Multimodal real-world Long-Horizon Deep Research), a benchmark for evaluating real-world deep research over long, irreducible chains of interdependent evidence across eight categories. Each question is constructed from a hidden Node-Relation graph and requires an average of 12.1 necessary intermediate conclusions with a mean dependency depth of 10.4 before reaching a short, unique, and verifiable answer. Questions incorporate multimodal evidence, including images, maps, PDFs, logos, charts, tables, and video frames, with at least one non-text element that changes the reasoning state. Mr.LHDR evaluates both final answers and the correctness of intermediate conclusions under annotated dependencies. We evaluate general models, deep research systems, and agent frameworks using Overall Accuracy (OA), Strict Accuracy (SA), Checklist Score (CS), and Dependency-Aware Checklist Score (DACS). Results show that even the strongest system achieves only 43.1% OA and 34.3% SA, indicating that final-answer accuracy substantially overestimates complete research success. Removing images reduces DACS by 12.6 points, demonstrating the importance of multimodal evidence, while SA consistently declines as reasoning chains become longer. These findings reveal sustained, dependency-consistent evidence integration, rather than isolated fact retrieval, as a key bottleneck for current deep research agents.", "arxiv_id": "2609.11318", "arxiv_url": "https://arxiv.org/abs/2609.11318", "authors": ["Minghao Guo", "Meng Cao", "Sui Zhao", "Siyu Ning", "Xin Wang", "Haoze Zhao", "Jiaxuan Yang", "Haihong Hao", "Mingfei Han", "Shunlin Rong", "Haijun Wu", "Xiaodan Liang", "Xiaojun Chang"], "brief": "\u8bba\u6587\u63d0\u51fa Mr.LHDR\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u957f\u7a0b\u6df1\u5ea6\u7814\u7a76\u4efb\u52a1\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\u3002\u5176\u95ee\u9898\u7531\u9690\u85cf\u7684\u8282\u70b9-\u5173\u7cfb\u56fe\u6784\u9020\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u6cbf\u591a\u6b65\u4f9d\u8d56\u8bc1\u636e\u94fe\u5b8c\u6210\u4fe1\u606f\u641c\u7d22\u3001\u5206\u6790\u4e0e\u7efc\u5408\uff0c\u5e76\u7ed9\u51fa\u53ef\u9a8c\u8bc1\u7684\u552f\u4e00\u77ed\u7b54\u6848\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11318", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u4e2a\u95ee\u9898\u5e73\u5747\u9700\u8981 12.1 \u4e2a\u5fc5\u8981\u4e2d\u95f4\u7ed3\u8bba\uff0c\u5e73\u5747\u4f9d\u8d56\u6df1\u5ea6\u4e3a 10.4\uff0c\u4e13\u95e8\u6d4b\u8bd5\u957f\u7a0b\u3001\u5f3a\u4f9d\u8d56\u63a8\u7406\u80fd\u529b", "\u8986\u76d6\u56fe\u50cf\u3001\u5730\u56fe\u3001PDF\u3001logo\u3001\u56fe\u8868\u3001\u8868\u683c\u3001\u89c6\u9891\u5e27\u7b49\u591a\u6a21\u6001\u8bc1\u636e\uff0c\u4e14\u81f3\u5c11\u4e00\u4e2a\u975e\u6587\u672c\u5143\u7d20\u4f1a\u6539\u53d8\u63a8\u7406\u72b6\u6001", "\u4f7f\u7528 OA\u3001SA\u3001CS\u3001DACS \u7b49\u6307\u6807\u540c\u65f6\u8bc4\u4f30\u6700\u7ec8\u7b54\u6848\u548c\u5e26\u4f9d\u8d56\u6807\u6ce8\u7684\u4e2d\u95f4\u7ed3\u8bba\u6b63\u786e\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u957f\u7a0b\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11318v1", "published_at": "2026-09-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Mr.LHDR: A Benchmark for Multimodal Real-World Long-Horizon Deep Research Agents", "tldr": "\u957f\u7a0b\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Mr.LHDR\uff0c\u4e00\u4e2a\u9762\u5411\u771f\u5b9e\u4e16\u754c\u957f\u7a0b\u6df1\u5ea6\u7814\u7a76\u4efb\u52a1\u7684\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\u3002\u5176\u95ee\u9898\u7531\u9690\u85cf\u7684\u8282\u70b9-\u5173\u7cfb\u56fe\u6784\u9020\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u6cbf\u591a\u6b65\u4f9d\u8d56\u8bc1\u636e\u94fe\u5b8c\u6210\u4fe1\u606f\u641c\u7d22\u3001\u5206\u6790\u4e0e\u7efc\u5408\uff0c\u5e76\u7ed9\u51fa\u53ef\u9a8c\u8bc1\u7684\u552f\u4e00\u77ed\u7b54\u6848\u3002", "why_notable": "\u8be5\u57fa\u51c6\u63ed\u793a\u5f53\u524d\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u7684\u5173\u952e\u77ed\u677f\u4e0d\u53ea\u662f\u68c0\u7d22\u4e8b\u5b9e\uff0c\u800c\u662f\u6301\u7eed\u3001\u4f9d\u8d56\u4e00\u81f4\u7684\u591a\u6a21\u6001\u8bc1\u636e\u6574\u5408\uff1b\u6700\u5f3a\u7cfb\u7edf\u4e5f\u4ec5\u8fbe\u5230 43.1% OA \u548c 34.3% SA\uff0c\u8bf4\u660e\u73b0\u6709\u8bc4\u6d4b\u53ef\u80fd\u9ad8\u4f30\u4e86\u771f\u5b9e\u7814\u7a76\u80fd\u529b\u3002"}, {"abstract": "LM-agent benchmarks increasingly function as interactive evaluation infrastructure. Agents observe state, call tools, modify workspaces, submit artifacts, and receive rewards from outcome procedures. This interactivity makes evaluations vulnerable to reward hacking: an agent improves its measured score by exploiting the reward-relevant trajectory instead of solving the intended task. Existing defenses rely largely on task-specific patches, prompt instructions, or post-hoc detectors. They do not provide reusable evidence that a concrete run remained within its intended evaluation boundary. This paper presents BenchShield, a model-backed instrumentation layer for reward integrity in LLM-agent evaluation. BenchShield grounds detection in a finite lifecycle model of an evaluation\u0027s reward-relevant events. Within the benchmark infrastructure, two complementary analyses operate over this model. A static, phase-aware taint analysis exposes reward-hacking paths before a run. Its runtime counterpart uses infrastructure-side evidence to attribute concrete agent use and emit evidence-backed claims. We construct BenchShield Trajectories, a human-labeled corpus of 456 adjudicated trajectories from more than 31,000 public agent runs across three benchmarks. Compared with an agentic hackability scanner baseline on the same tasks and model, BenchShield improves full-chain recall from 23-94% to 77-100%, same-vector coverage from 16-56% to 43-78%, and reduces per-task cost by up to 65%. Its runtime analysis achieves 96% accuracy in detecting reward hacking from infrastructure-side evidence.", "arxiv_id": "2609.11028", "arxiv_url": "https://arxiv.org/abs/2609.11028", "authors": ["Shenghan Zheng", "Zonglin Di", "Yimin Liu", "Kyoung Whan Choe", "Jiankai Sun", "Heguang Lin", "Penghao Jiang", "Yifeng He", "Xiao Cheng", "Jicheng Wang", "Wenbo Chen", "Alex Yates", "Yinzhe Zhao", "Bingran You", "Yuan Gao", "Ayush Munot", "Shubham Gaur", "Zhe Ye", "Hao Wang", "Xiangyi Li", "Dawn Song", "Christophe Hauser"], "brief": "\u8bba\u6587\u63d0\u51fa BenchShield\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u7840\u8bbe\u65bd\u7684\u6a21\u578b\u652f\u6491\u63d2\u6869\u5c42\uff0c\u7528\u4e8e\u68c0\u6d4b\u548c\u5f52\u56e0 reward hacking\u3002\u5b83\u5c06\u8bc4\u6d4b\u4e2d\u7684\u5956\u52b1\u76f8\u5173\u4e8b\u4ef6\u62bd\u8c61\u4e3a\u6709\u9650\u751f\u547d\u5468\u671f\u6a21\u578b\uff0c\u5e76\u7ed3\u5408\u9759\u6001\u6c61\u70b9\u5206\u6790\u4e0e\u8fd0\u884c\u65f6\u8bc1\u636e\u5206\u6790\u6765\u9a8c\u8bc1\u5177\u4f53\u8fd0\u884c\u662f\u5426\u8d8a\u754c\u3002", "categories": ["cs.CR", "cs.AI", "cs.SE", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11028", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u76f8\u4f4d\u611f\u77e5\u7684\u9759\u6001\u6c61\u70b9\u5206\u6790\uff0c\u5728\u8fd0\u884c\u524d\u66b4\u9732\u53ef\u80fd\u5229\u7528\u5956\u52b1\u6d41\u7a0b\u7684\u653b\u51fb\u8def\u5f84\u3002", "\u8fd0\u884c\u65f6\u5206\u6790\u57fa\u4e8e\u57fa\u7840\u8bbe\u65bd\u4fa7\u8bc1\u636e\u5f52\u56e0\u667a\u80fd\u4f53\u884c\u4e3a\uff0c\u5e76\u751f\u6210\u53ef\u5ba1\u8ba1\u7684\u8bc1\u636e\u5316\u7ed3\u8bba\u3002", "\u6784\u5efa BenchShield Trajectories\uff1a\u6765\u81ea 3 \u4e2a\u57fa\u51c6\u3001\u8d85\u8fc7 31000 \u6b21\u516c\u5f00\u8fd0\u884c\u4e2d\u7684 456 \u6761\u4eba\u5de5\u6807\u6ce8\u8f68\u8ff9\uff1b\u8fd0\u884c\u65f6\u68c0\u6d4b reward hacking \u51c6\u786e\u7387\u8fbe 96%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u5b89\u5168", "\u5956\u52b1\u9ed1\u5ba2", "\u5f62\u5f0f\u5316\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11028v1", "published_at": "2026-09-10", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BenchShield: Formal Model-Backed Instrumentation for Reward Integrity in LLM-Agent Evaluation Infrastructure", "tldr": "\u7528\u5f62\u5f0f\u5316\u63d2\u6869\u9632\u62a4\u667a\u80fd\u4f53\u8bc4\u6d4b\u5956\u52b1\u9ed1\u5ba2", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BenchShield\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u7840\u8bbe\u65bd\u7684\u6a21\u578b\u652f\u6491\u63d2\u6869\u5c42\uff0c\u7528\u4e8e\u68c0\u6d4b\u548c\u5f52\u56e0 reward hacking\u3002\u5b83\u5c06\u8bc4\u6d4b\u4e2d\u7684\u5956\u52b1\u76f8\u5173\u4e8b\u4ef6\u62bd\u8c61\u4e3a\u6709\u9650\u751f\u547d\u5468\u671f\u6a21\u578b\uff0c\u5e76\u7ed3\u5408\u9759\u6001\u6c61\u70b9\u5206\u6790\u4e0e\u8fd0\u884c\u65f6\u8bc1\u636e\u5206\u6790\u6765\u9a8c\u8bc1\u5177\u4f53\u8fd0\u884c\u662f\u5426\u8d8a\u754c\u3002", "why_notable": "\u76f8\u6bd4\u4f9d\u8d56\u63d0\u793a\u7ea6\u675f\u3001\u4efb\u52a1\u8865\u4e01\u6216\u4e8b\u540e\u68c0\u6d4b\u7684\u65b9\u6cd5\uff0cBenchShield \u63d0\u4f9b\u4e86\u53ef\u590d\u7528\u3001\u5f62\u5f0f\u5316\u4e14\u6709\u8bc1\u636e\u652f\u6491\u7684\u8bc4\u6d4b\u8fb9\u754c\u5b8c\u6574\u6027\u4fdd\u969c\uff1b\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u653b\u51fb\u94fe\u53ec\u56de\u7387\u5e76\u964d\u4f4e\u6210\u672c\uff0c\u5bf9\u667a\u80fd\u4f53\u8bc4\u6d4b\u53ef\u4fe1\u5ea6\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "The open web ran on an unwritten bargain: sites admitted crawlers, and search engines sent visitors back. Public measurements show that bargain breaking under AI crawlers and agents. Automated clients now make up most requests, training dominates Cloudflare-classified crawling, and the largest AI platforms fetch thousands of pages for each visitor they return. The web\u0027s common control, robots.txt, cannot express identity, purpose, terms, or price, can be circumvented, and newer alternatives are largely proprietary CDN features. We specify terms.txt, a robots.txt-style file for per-path, per-purpose machine-access terms, plus an origin-enforced exchange using Web Bot Auth signatures, signed intent, delegation tokens, HTTP 402 negotiation, and signed receipts. We define what the exchange can enforce, audit, and leave to contract. A dependency-free implementation adds 0.20 to 0.65 ms per request on one vCPU.", "arxiv_id": "2609.11152", "arxiv_url": "https://arxiv.org/abs/2609.11152", "authors": ["Rajarshi Chowdhury"], "brief": "\u8bba\u6587\u63d0\u51fa terms.txt\uff1a\u4e00\u79cd\u7c7b\u4f3c robots.txt \u7684\u5f00\u653e\u534f\u8bae\uff0c\u7528\u4e8e\u6309\u8def\u5f84\u548c\u7528\u9014\u58f0\u660e\u673a\u5668\u8bbf\u95ee\u7684\u6761\u6b3e\u3001\u8eab\u4efd\u3001\u76ee\u7684\u4e0e\u4ef7\u683c\u3002\u5b83\u8fd8\u8bbe\u8ba1\u4e86\u7531\u6e90\u7ad9\u6267\u884c\u7684\u4ea4\u6362\u6d41\u7a0b\uff0c\u652f\u6301\u7b7e\u540d\u8eab\u4efd\u3001\u610f\u56fe\u58f0\u660e\u3001\u6388\u6743\u59d4\u6258\u3001HTTP 402 \u534f\u5546\u4e0e\u7b7e\u540d\u6536\u636e\u3002", "categories": ["cs.NI", "cs.AI", "cs.CR", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11152", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u4f20\u7edf robots.txt \u65e0\u6cd5\u8868\u8fbe\u8bbf\u95ee\u8005\u8eab\u4efd\u3001\u7528\u9014\u3001\u6761\u6b3e\u6216\u4ef7\u683c\uff0c\u4e5f\u96be\u4ee5\u9632\u7ed5\u8fc7\uff0c\u5df2\u4e0d\u9002\u5e94 AI \u722c\u866b\u4e0e\u667a\u80fd\u4f53\u8bbf\u95ee\u6a21\u5f0f\u3002", "terms.txt \u652f\u6301\u6309\u8def\u5f84\u3001\u6309\u7528\u9014\u8bbe\u5b9a\u673a\u5668\u8bbf\u95ee\u6761\u4ef6\uff0c\u5e76\u7ed3\u5408 Web Bot Auth \u7b7e\u540d\u3001\u59d4\u6258\u4ee4\u724c\u548c\u7b7e\u540d\u6536\u636e\u5b9e\u73b0\u53ef\u5ba1\u8ba1\u8bbf\u95ee\u3002", "\u65e0\u4f9d\u8d56\u5b9e\u73b0\u7684\u5f00\u9500\u8f83\u4f4e\uff1a\u5355 vCPU \u4e0a\u6bcf\u8bf7\u6c42\u589e\u52a0\u7ea6 0.20 \u81f3 0.65 \u6beb\u79d2\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u534f\u8bae", "\u6570\u636e\u6cbb\u7406", "\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11152v1", "published_at": "2026-09-10", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "terms.txt: A Consent and Compensation Protocol for Agentic Web Access", "tldr": "\u4e3aAI\u722c\u866b\u4e0e\u667a\u80fd\u4f53\u63d0\u51fa\u7f51\u9875\u8bbf\u95ee\u534f\u8bae", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa terms.txt\uff1a\u4e00\u79cd\u7c7b\u4f3c robots.txt \u7684\u5f00\u653e\u534f\u8bae\uff0c\u7528\u4e8e\u6309\u8def\u5f84\u548c\u7528\u9014\u58f0\u660e\u673a\u5668\u8bbf\u95ee\u7684\u6761\u6b3e\u3001\u8eab\u4efd\u3001\u76ee\u7684\u4e0e\u4ef7\u683c\u3002\u5b83\u8fd8\u8bbe\u8ba1\u4e86\u7531\u6e90\u7ad9\u6267\u884c\u7684\u4ea4\u6362\u6d41\u7a0b\uff0c\u652f\u6301\u7b7e\u540d\u8eab\u4efd\u3001\u610f\u56fe\u58f0\u660e\u3001\u6388\u6743\u59d4\u6258\u3001HTTP 402 \u534f\u5546\u4e0e\u7b7e\u540d\u6536\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u4e3a AI \u65f6\u4ee3\u7684\u5f00\u653e Web \u91cd\u5efa\u201c\u8bbf\u95ee\u2014\u8865\u507f\u201d\u673a\u5236\uff0c\u63d0\u4f9b\u6bd4 robots.txt \u66f4\u7ec6\u7c92\u5ea6\u3001\u53ef\u6267\u884c\u3001\u53ef\u5ba1\u8ba1\u7684\u534f\u8bae\u6846\u67b6\uff0c\u5bf9\u5185\u5bb9\u63d0\u4f9b\u65b9\u3001AI \u5e73\u53f0\u548c Web \u667a\u80fd\u4f53\u751f\u6001\u90fd\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "Large language model (LLM)-based multi-agent systems (MAS) achieve strong performance by employing specialized multiple agents, yet their performance depends on the prompt design of each agent. For MAS prompt optimization, textual gradient methods that guide prompt updates using natural-language feedback have emerged as a leading paradigm. In this paper, we identify limitations in two stages of existing textual gradient approaches: gradient extraction and gradient aggregation. In gradient extraction, previous works select a target prompt without verifying whether modifying it resolves the failure, and derive gradients without agent-level supervision over the corresponding agent\u0027s intermediate output. In gradient aggregation, individual gradients are randomly grouped and concatenated, often mixing unrelated failure modes and producing prompts that fail to generalize. To address these limitations, we propose \\textbf{AgentGrad}, a prompt optimization framework for multi-agent systems based on sequential intervention and semantic textual gradient abstraction. For each failure, sequential intervention modifies the behavior of one agent at a time to identify the target agent whose modification resolves the failure. The modified output of the target agent then serves as agent-level supervision for extracting a fine-grained gradient. Semantic textual gradient abstraction clusters semantically similar gradients to prevent mixing unrelated failure modes, and abstracts each cluster into a generalized gradient that captures the shared corrective pattern. Experimental results show that AgentGrad achieves state-of-the-art performance across five MAS benchmarks and reduces wall-clock optimization time by $2.5\\times$ on average compared to the next-fastest baseline.", "arxiv_id": "2609.08572", "arxiv_url": "https://arxiv.org/abs/2609.08572", "authors": ["Jaewon Chu", "Jinwoo Seo", "Jaewon Cho", "Jeehye Na", "Yunyang Xiong", "Youngdae Kim", "Hyunwoo J. Kim"], "brief": "\u672c\u6587\u63d0\u51fa AgentGrad\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u63d0\u793a\u8bcd\u4f18\u5316\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u9010\u4e2a\u667a\u80fd\u4f53\u7684\u987a\u5e8f\u5e72\u9884\u5b9a\u4f4d\u5bfc\u81f4\u5931\u8d25\u7684\u76ee\u6807\u667a\u80fd\u4f53\uff0c\u5e76\u7528\u8bed\u4e49\u62bd\u8c61\u805a\u5408\u540c\u7c7b\u6587\u672c\u68af\u5ea6\uff0c\u4ece\u800c\u751f\u6210\u66f4\u53ef\u6cdb\u5316\u7684\u63d0\u793a\u66f4\u65b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08572", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u987a\u5e8f\u5e72\u9884\u9010\u4e00\u4fee\u6539\u667a\u80fd\u4f53\u884c\u4e3a\uff0c\u9a8c\u8bc1\u54ea\u4e00\u4e2a\u667a\u80fd\u4f53\u7684\u6539\u52a8\u80fd\u4fee\u590d\u5931\u8d25\uff0c\u907f\u514d\u76f2\u76ee\u9009\u62e9\u5f85\u4f18\u5316\u63d0\u793a\u8bcd\u3002", "\u5c06\u76ee\u6807\u667a\u80fd\u4f53\u7684\u4fee\u6b63\u540e\u4e2d\u95f4\u8f93\u51fa\u4f5c\u4e3a\u667a\u80fd\u4f53\u7ea7\u76d1\u7763\uff0c\u63d0\u53d6\u66f4\u7ec6\u7c92\u5ea6\u3001\u66f4\u6709\u9488\u5bf9\u6027\u7684\u6587\u672c\u68af\u5ea6\u3002", "\u901a\u8fc7\u8bed\u4e49\u6587\u672c\u68af\u5ea6\u62bd\u8c61\u5bf9\u76f8\u4f3c\u5931\u8d25\u6a21\u5f0f\u805a\u7c7b\u5e76\u603b\u7ed3\u5171\u4eab\u4fee\u6b63\u6a21\u5f0f\uff0c\u907f\u514d\u968f\u673a\u62fc\u63a5\u65e0\u5173\u68af\u5ea6\uff1b\u5728\u4e94\u4e2a MAS \u57fa\u51c6\u4e0a\u8fbe\u5230 SOTA\uff0c\u5e76\u8f83\u6700\u5feb\u57fa\u7ebf\u5e73\u5747\u63d0\u901f 2.5 \u500d\u3002"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u63d0\u793a\u8bcd\u4f18\u5316", "\u667a\u80fd\u4f53", "\u6587\u672c\u68af\u5ea6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08572v1", "published_at": "2026-09-08", "score": 0.323, "selected_reasons": ["HF trending (86\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.08572.png", "title": "AgentGrad: Intervention-guided Prompt Optimization for Multi Agent Systems", "tldr": "\u7528\u5e72\u9884\u5b9a\u4f4d\u4e0e\u8bed\u4e49\u805a\u7c7b\u4f18\u5316\u591a\u667a\u80fd\u4f53\u63d0\u793a\u8bcd", "upvotes": 86, "what_it_is": "\u672c\u6587\u63d0\u51fa AgentGrad\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u63d0\u793a\u8bcd\u4f18\u5316\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u9010\u4e2a\u667a\u80fd\u4f53\u7684\u987a\u5e8f\u5e72\u9884\u5b9a\u4f4d\u5bfc\u81f4\u5931\u8d25\u7684\u76ee\u6807\u667a\u80fd\u4f53\uff0c\u5e76\u7528\u8bed\u4e49\u62bd\u8c61\u805a\u5408\u540c\u7c7b\u6587\u672c\u68af\u5ea6\uff0c\u4ece\u800c\u751f\u6210\u66f4\u53ef\u6cdb\u5316\u7684\u63d0\u793a\u66f4\u65b0\u3002", "why_notable": "\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u6027\u80fd\u9ad8\u5ea6\u4f9d\u8d56\u5404\u667a\u80fd\u4f53\u63d0\u793a\u8bcd\u8bbe\u8ba1\uff0cAgentGrad \u9488\u5bf9\u73b0\u6709\u6587\u672c\u68af\u5ea6\u65b9\u6cd5\u4e2d\u76ee\u6807\u5b9a\u4f4d\u4e0d\u51c6\u548c\u68af\u5ea6\u805a\u5408\u7c97\u7cd9\u7684\u95ee\u9898\u7ed9\u51fa\u7cfb\u7edf\u6027\u6539\u8fdb\uff0c\u540c\u65f6\u63d0\u5347\u6548\u679c\u4e0e\u4f18\u5316\u6548\u7387\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While research on recursive self-improvement (RSI) has predominantly automated model training pipelines, reliable autonomous development demands a missing pillar: post-hoc monitoring and auditing to understand what models learn and ensure safe alignment. Mechanistic interpretability tools are essential to bridge this gap, among which Sparse Autoencoders (SAEs) serve as a cornerstone by isolating interpretable features for model inspection and steering. In this paper, we introduce SAEScientist-Bench to evaluate whether AI agents can act as scientists utilizing SAE tools for autonomous mechanistic discovery. Given a target concept, an agent designs contrastive probes and navigates a Gemma Scope dictionary of 131K+ features in Gemma-2-9B-IT to discover the optimal feature, evaluated against curated expert reference features anchored on Neuronpedia across activation rank, concept selectivity on contrastive texts, and causal steering. Across 10 agent configurations and 20 tasks, frontier agents demonstrate genuine discovery capabilities and lead different evaluation dimensions, but remain well behind the expert baseline, approaching expert levels on separating target concepts from contrastive controls while lagging substantially in causal generation steering. Further analysis reveals that although agents can design contrasts to rule out spurious candidates, they frequently misinterpret experimental measurements. These results establish experimental model understanding as a measurable capability for closed-loop autonomous AI R\u0026D. Our code is available at https://github.com/Trae1ounG/SAEScientist.", "arxiv_id": "2609.09113", "arxiv_url": "https://arxiv.org/abs/2609.09113", "authors": ["Yuqiao Tan", "Shizhu He", "Jun Zhao", "Kang Liu"], "brief": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa SAEScientist-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30 AI \u667a\u80fd\u4f53\u80fd\u5426\u50cf\u7814\u7a76\u5458\u4e00\u6837\u4f7f\u7528 Sparse Autoencoders \u5de5\u5177\u8fdb\u884c\u673a\u5236\u53ef\u89e3\u91ca\u6027\u53d1\u73b0\u3002\u667a\u80fd\u4f53\u9700\u56f4\u7ed5\u76ee\u6807\u6982\u5ff5\u8bbe\u8ba1\u5bf9\u6bd4\u63a2\u9488\uff0c\u5e76\u5728 Gemma-2-9B-IT \u7684 Gemma Scope \u7279\u5f81\u5b57\u5178\u4e2d\u5bfb\u627e\u6700\u5339\u914d\u7684\u53ef\u89e3\u91ca\u7279\u5f81\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/Trae1ounG/SAEScientist", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2609.09113", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u8986\u76d6 131K+ \u4e2a SAE \u7279\u5f81\u300120 \u4e2a\u4efb\u52a1\u548c 10 \u79cd\u667a\u80fd\u4f53\u914d\u7f6e\uff0c\u5e76\u4ee5 Neuronpedia \u4e0a\u4e13\u5bb6\u6807\u6ce8\u7279\u5f81\u4f5c\u4e3a\u53c2\u8003\u57fa\u7ebf\u3002", "\u8bc4\u4f30\u7ef4\u5ea6\u5305\u62ec\u6fc0\u6d3b\u6392\u540d\u3001\u5bf9\u6bd4\u6587\u672c\u4e0a\u7684\u6982\u5ff5\u9009\u62e9\u6027\uff0c\u4ee5\u53ca\u901a\u8fc7\u7279\u5f81\u8fdb\u884c\u56e0\u679c\u751f\u6210 steering \u7684\u6548\u679c\u3002", "\u524d\u6cbf\u667a\u80fd\u4f53\u5df2\u80fd\u8bbe\u8ba1\u5bf9\u6bd4\u5b9e\u9a8c\u5e76\u6392\u9664\u4f2a\u76f8\u5173\u5019\u9009\uff0c\u4f46\u5e38\u8bef\u8bfb\u5b9e\u9a8c\u6d4b\u91cf\u7ed3\u679c\uff0c\u5c24\u5176\u5728\u56e0\u679c steering \u4e0a\u660e\u663e\u843d\u540e\u4e13\u5bb6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "AI\u7814\u53d1"], "num_comments": 2, "on_hf": true, "organization": "Chinese Academic of Science Institute of Automation", "pdf_url": "https://arxiv.org/pdf/2609.09113v1", "published_at": "2026-09-08", "score": 0.304, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09113.png", "title": "SAEScientist-Bench: Can AI Agents Conduct Autonomous SAE Interpretability Research?", "tldr": "\u8bc4\u6d4bAI\u667a\u80fd\u4f53\u81ea\u4e3b\u5f00\u5c55SAE\u53ef\u89e3\u91ca\u6027\u7814\u7a76", "upvotes": 16, "what_it_is": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa SAEScientist-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30 AI \u667a\u80fd\u4f53\u80fd\u5426\u50cf\u7814\u7a76\u5458\u4e00\u6837\u4f7f\u7528 Sparse Autoencoders \u5de5\u5177\u8fdb\u884c\u673a\u5236\u53ef\u89e3\u91ca\u6027\u53d1\u73b0\u3002\u667a\u80fd\u4f53\u9700\u56f4\u7ed5\u76ee\u6807\u6982\u5ff5\u8bbe\u8ba1\u5bf9\u6bd4\u63a2\u9488\uff0c\u5e76\u5728 Gemma-2-9B-IT \u7684 Gemma Scope \u7279\u5f81\u5b57\u5178\u4e2d\u5bfb\u627e\u6700\u5339\u914d\u7684\u53ef\u89e3\u91ca\u7279\u5f81\u3002", "why_notable": "\u2462\u4e3a\u4f55\u503c\u5f97\u5173\u6ce8\uff1a\u8be5\u5de5\u4f5c\u628a\u201cAI \u80fd\u5426\u81ea\u4e3b\u505a\u673a\u5236\u53ef\u89e3\u91ca\u6027\u7814\u7a76\u201d\u8f6c\u5316\u4e3a\u53ef\u91cf\u5316\u8bc4\u6d4b\uff0c\u4e3a\u95ed\u73af\u81ea\u4e3b AI \u7814\u53d1\u4e2d\u7684\u6a21\u578b\u5ba1\u8ba1\u3001\u5bf9\u9f50\u76d1\u63a7\u548c\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u5b89\u5168\u6027\u63d0\u4f9b\u4e86\u65b0\u7684\u5b9e\u9a8c\u57fa\u51c6\u3002"}, {"abstract": "World models are increasingly used as policy-in-the-loop imagination environments, where reliable rollouts require fine-grained controllability with respect to low-level robot actions. A key obstacle to scaling such models in robotics is that actions are not a universal language in pixel space: changes in visual environment, camera view, robot placement, or embodiment alter how the same numerical action manifests visually, leading to conflicting supervision under mixed training and brittle generalization at deployment. We introduce SyncWorld, an action-conditioned world model that serves as a zero-shot simulator across unseen environments without any additional training. SyncWorld leverages a visual calibration episode---paired frames and actions that showcase all the controllable degrees of freedom---to specify the setup-specific Action--Visual Mapping in context. Training with visual calibration contexts teaches the model to interpret actions through visual evidence and to leverage interaction history when explicit calibration is unavailable. Experiments show that SyncWorld can accurately simulate action outcomes in previously unseen settings, and that its capability of simulating rollouts enables test-time policy improvement without training.", "arxiv_id": "2609.09155", "arxiv_url": "https://arxiv.org/abs/2609.09155", "authors": ["Yuncong Yang", "Zhengtao Han", "Furkan Ozyurt", "Zeyuan Yang", "Han Yang", "Junyi Cao", "Haoyu Zhen", "Yilun Du", "Chuang Gan"], "brief": "SyncWorld \u63d0\u51fa\u4e00\u79cd\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\uff0c\u901a\u8fc7\u4e00\u6bb5\u5305\u542b\u5e27\u4e0e\u52a8\u4f5c\u7684\u89c6\u89c9\u6821\u51c6\u7247\u6bb5\uff0c\u5728\u4e0a\u4e0b\u6587\u4e2d\u6307\u5b9a\u5f53\u524d\u73af\u5883\u7684\u52a8\u4f5c\u2014\u89c6\u89c9\u6620\u5c04\u3002\u5b83\u53ef\u5728\u672a\u89c1\u8fc7\u7684\u673a\u5668\u4eba\u8bbe\u7f6e\u4e2d\u96f6\u6837\u672c\u6a21\u62df\u52a8\u4f5c\u7ed3\u679c\uff0c\u5e76\u652f\u6301\u6d4b\u8bd5\u65f6\u7b56\u7565\u6539\u8fdb\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/UMass-Embodied-AGI/SyncWorld", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2609.09155", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u540c\u4e00\u6570\u503c\u52a8\u4f5c\u5728\u4e0d\u540c\u76f8\u673a\u89c6\u89d2\u3001\u73af\u5883\u3001\u673a\u5668\u4eba\u4f4d\u7f6e\u6216\u5f62\u6001\u4e0b\u4f1a\u4ea7\u751f\u4e0d\u540c\u89c6\u89c9\u6548\u679c\uff0c\u5bfc\u81f4\u6df7\u5408\u8bad\u7ec3\u76d1\u7763\u51b2\u7a81\u3002", "\u5f15\u5165\u89c6\u89c9\u6821\u51c6 episode\uff0c\u8986\u76d6\u53ef\u63a7\u81ea\u7531\u5ea6\uff0c\u4f7f\u6a21\u578b\u4ece\u89c6\u89c9\u8bc1\u636e\u4e2d\u7406\u89e3\u5f53\u524d\u8bbe\u7f6e\u4e0b\u52a8\u4f5c\u5982\u4f55\u6620\u5c04\u5230\u50cf\u7d20\u53d8\u5316\u3002", "\u5728\u663e\u5f0f\u6821\u51c6\u7f3a\u5931\u65f6\uff0c\u6a21\u578b\u4e5f\u80fd\u5229\u7528\u4ea4\u4e92\u5386\u53f2\u63a8\u65ad\u52a8\u4f5c\u2014\u89c6\u89c9\u6620\u5c04\uff0c\u5b9e\u73b0\u672a\u89c1\u573a\u666f\u4e2d\u7684 rollout \u6a21\u62df\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u5b66\u4e60", "\u96f6\u6837\u672c\u6cdb\u5316", "\u7b56\u7565\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09155v1", "published_at": "2026-09-08", "score": 0.296, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.09155.png", "title": "SyncWorld: Visual Calibration Enables World Models as Zero-Shot Simulators", "tldr": "\u7528\u89c6\u89c9\u6821\u51c6\u8ba9\u4e16\u754c\u6a21\u578b\u96f6\u6837\u672c\u9002\u914d\u65b0\u73af\u5883", "upvotes": 11, "what_it_is": "SyncWorld \u63d0\u51fa\u4e00\u79cd\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\uff0c\u901a\u8fc7\u4e00\u6bb5\u5305\u542b\u5e27\u4e0e\u52a8\u4f5c\u7684\u89c6\u89c9\u6821\u51c6\u7247\u6bb5\uff0c\u5728\u4e0a\u4e0b\u6587\u4e2d\u6307\u5b9a\u5f53\u524d\u73af\u5883\u7684\u52a8\u4f5c\u2014\u89c6\u89c9\u6620\u5c04\u3002\u5b83\u53ef\u5728\u672a\u89c1\u8fc7\u7684\u673a\u5668\u4eba\u8bbe\u7f6e\u4e2d\u96f6\u6837\u672c\u6a21\u62df\u52a8\u4f5c\u7ed3\u679c\uff0c\u5e76\u652f\u6301\u6d4b\u8bd5\u65f6\u7b56\u7565\u6539\u8fdb\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u52a8\u4f5c\u8bed\u4e49\u4ece\u56fa\u5b9a\u6570\u503c\u7a7a\u95f4\u8f6c\u5411\u53ef\u4e0a\u4e0b\u6587\u6821\u51c6\u7684\u89c6\u89c9\u6620\u5c04\uff0c\u6709\u671b\u63d0\u5347\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u5728\u8de8\u73af\u5883\u3001\u8de8\u89c6\u89d2\u3001\u8de8\u5177\u8eab\u8bbe\u7f6e\u4e0b\u7684\u6cdb\u5316\u80fd\u529b\uff0c\u5e76\u8ba9\u7b56\u7565\u65e0\u9700\u518d\u8bad\u7ec3\u5373\u53ef\u5728\u6d4b\u8bd5\u65f6\u5229\u7528\u6a21\u62df rollout \u6539\u8fdb\u3002"}, {"abstract": "High-quality structured organic reaction data are essential for developing artificial intelligence for chemistry (AI4Chem), yet much of this knowledge remains dispersed across patent text, images, and reaction schemes. We present DianShi-RxnDB, a large-scale, fine-grained organic reaction data platform built via a fully automated extraction and normalization pipeline integrating patent text, images, and reaction schemes. Its corpus covers organic synthesis patents from the USPTO and EPO published between 1976 and 2025, yielding approximately 24 million reaction instances, of which approximately 14.8 million (61.7%) pass automated qualification checks. Each instance represents a specific single-step experiment recording participants, roles, quantities, temperatures, reaction times, yields, experimental procedures, and provenance links to source patents. In a manual evaluation of 1,300 sampled qualified instances, the micro-averaged field-level accuracy was 92.95%. A matched comparison with Pistachio further indicated advantages in deduplicated record counts, representation granularity, and field-level exact agreement. The platform provides a Web research workbench for searching, filtering, comparing, and source-verifying records, and a Model Context Protocol (MCP) service offering AI agents composable structured retrieval tools. DianShi-RxnDB is available at https://dianshi.opendatalab.org.cn/ .", "arxiv_id": "2609.06703", "arxiv_url": "https://arxiv.org/abs/2609.06703", "authors": ["Yubin Wang", "Xingjian Wei", "Jiang Wu", "Yinfan Wang", "Boyu Zhu", "Lin Zhang", "Jianing Yu", "Huazheng Zeng", "Ruiyi Ding", "Junyuan Gao", "Jiaxing Sun", "Lingli Ge", "Haote Yang", "Jingchao Wang", "Aijia Guo", "Qian Jiang", "Yurui Zhao", "Wenjian Zhang", "Chen Zhu", "Lijun Wu", "Xiaolei Yang", "Haodong Chen", "Junjie Yuan", "Zichao Ye", "Shaowei Hou", "Jing Ye", "Jia Yu", "Shan Wang", "Lijun Wu", "Jiantao Qiu", "Chao Xu", "Yuqiang Li", "Guangyu Wang", "Bowen Zhou", "Dahua Lin", "Conghui He"], "brief": "\u8bba\u6587\u63d0\u51fa DianShi-RxnDB\uff0c\u4e00\u4e2a\u9762\u5411 AI4Chem \u7684\u5927\u89c4\u6a21\u7ec6\u7c92\u5ea6\u6709\u673a\u53cd\u5e94\u6570\u636e\u5e73\u53f0\u3002\u5b83\u901a\u8fc7\u5168\u81ea\u52a8\u6d41\u6c34\u7ebf\u4ece USPTO/EPO \u4e13\u5229\u6587\u672c\u3001\u56fe\u50cf\u548c\u53cd\u5e94\u5f0f\u4e2d\u62bd\u53d6\u5e76\u89c4\u8303\u5316\u5355\u6b65\u5b9e\u9a8c\u53cd\u5e94\u8bb0\u5f55\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.06703", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d61976\u81f32025\u5e74 USPTO \u548c EPO \u6709\u673a\u5408\u6210\u4e13\u5229\uff0c\u5f97\u5230\u7ea62400\u4e07\u6761\u53cd\u5e94\u5b9e\u4f8b\uff0c\u5176\u4e2d\u7ea61480\u4e07\u6761\u901a\u8fc7\u81ea\u52a8\u8d28\u91cf\u68c0\u67e5", "\u6bcf\u6761\u8bb0\u5f55\u5305\u542b\u53cd\u5e94\u7269\u3001\u4ea7\u7269\u3001\u8bd5\u5242\u3001\u7528\u91cf\u3001\u6e29\u5ea6\u3001\u65f6\u95f4\u3001\u6536\u7387\u3001\u5b9e\u9a8c\u6b65\u9aa4\u53ca\u4e13\u5229\u6eaf\u6e90\u94fe\u63a5\u7b49\u7ec6\u7c92\u5ea6\u5b57\u6bb5", "1300\u6761\u4eba\u5de5\u62bd\u6837\u8bc4\u6d4b\u663e\u793a\u5b57\u6bb5\u7ea7\u5fae\u5e73\u5747\u51c6\u786e\u7387\u4e3a92.95%\uff0c\u5e76\u5728\u53bb\u91cd\u6570\u91cf\u3001\u7c92\u5ea6\u548c\u5b57\u6bb5\u4e00\u81f4\u6027\u4e0a\u4f18\u4e8e Pistachio"], "keywords": ["AI4Chem", "\u6570\u636e\u5e73\u53f0", "\u4fe1\u606f\u62bd\u53d6", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "DianShi Group", "pdf_url": "https://arxiv.org/pdf/2609.06703v1", "published_at": "2026-09-06", "score": 0.267, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06703.png", "title": "DianShi-RxnDB: A Large-Scale, Fine-Grained Organic Reaction Data Platform Built via a Fully Automated Pipeline for Researchers and AI Agents", "tldr": "\u81ea\u52a8\u6784\u5efa2400\u4e07\u7ea7\u6709\u673a\u53cd\u5e94\u6570\u636e\u5e93", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa DianShi-RxnDB\uff0c\u4e00\u4e2a\u9762\u5411 AI4Chem \u7684\u5927\u89c4\u6a21\u7ec6\u7c92\u5ea6\u6709\u673a\u53cd\u5e94\u6570\u636e\u5e73\u53f0\u3002\u5b83\u901a\u8fc7\u5168\u81ea\u52a8\u6d41\u6c34\u7ebf\u4ece USPTO/EPO \u4e13\u5229\u6587\u672c\u3001\u56fe\u50cf\u548c\u53cd\u5e94\u5f0f\u4e2d\u62bd\u53d6\u5e76\u89c4\u8303\u5316\u5355\u6b65\u5b9e\u9a8c\u53cd\u5e94\u8bb0\u5f55\u3002", "why_notable": "\u9ad8\u8d28\u91cf\u7ed3\u6784\u5316\u5316\u5b66\u53cd\u5e94\u6570\u636e\u662f AI4Chem \u7684\u5173\u952e\u74f6\u9888\uff1b\u8be5\u5de5\u4f5c\u5c06\u4e13\u52
