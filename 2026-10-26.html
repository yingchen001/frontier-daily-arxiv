<style>

  * { box-sizing:border-box; }

  .meta-line { color:var(--muted); font-size:13px; margin:10px 0; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 2px 12px rgba(37,99,235,.12); }
  .card.top { border-top:3px solid #f59e0b; }
  .card h3 { margin:0 0 8px; font-size:16px; line-height:1.4; }

  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }
  .modal-box h2 { margin:0 30px 12px 0; font-size:20px; line-height:1.45; }
  .modal-box .abs { font-size:14px; line-height:1.75; white-space:pre-wrap; background:var(--bg);

  .modal-box .lbl { font-weight:700; margin:16px 0 6px; font-size:14px; }
  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .pdfwrap iframe { width:100%; height:100%; border:0; }
  .pdfhint { font-size:12px; color:var(--muted); margin-top:6px; }

<script>
const PAPERS = [{"abstract": "Even a carefully proofread paper can leave small gaps in its proofs or its stated assumptions. We introduce PaperFormalizer, a Lean-based agentic pipeline that helps authors find and close such gaps in their own papers and turn each paper into a Lean-verified version. Starting from the LaTeX source, PaperFormalizer transcribes the paper into a dependency graph of statements, audits each statement in natural language for faithfulness, ambiguity and correctness, and then formalizes and proves the statements in Lean against Mathlib, optional domain libraries and the author\u0027s personal toolkit. Only the author knows what a statement is meant to say and how a formalization gap in a result is best fixed. The pipeline therefore stops and asks the author whenever a statement admits more than one reading, presents every repair, in natural language and TeX symbols, as a proposal that the author can accept, decline or redirect, and leaves to the author every decision that could potentially change what the paper claims. The output is an annotated and revised version of the paper, a report of the changes, and Lean code in which each declaration is linked to the statement it formalizes. The author\u0027s toolkit grows as more papers are formalized, and authors can share their verified papers so that researchers who build on them can reuse their Lean code. By making verified papers practical to produce, PaperFormalizer aims to make research that rests on mathematical proofs more robust. PaperFormalizer runs inside a coding agent (Claude Code or Codex) and is available at https://github.com/Jiyuan-Tan/PaperFormalizer. Papers with Lean code shared by users are available at https://paperformalizer.org.", "arxiv_id": "2610.31810", "arxiv_url": "https://arxiv.org/abs/2610.31810", "authors": ["Jiyuan Tan", "Vasilis Syrgkanis", "Jose Blanchet"], "brief": "", "categories": ["cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31810", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2610.31810v1", "published_at": "2026-10-22", "score": 0.431, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31810.png", "title": "PaperFormalizer: Author-in-the-Loop Autoformalization of Research Papers in Lean", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Language models can make personalized recommendations from rich item content, user history, and feedback. However, evaluating many candidates with full-text inputs incurs substantial online computation and limits serving throughput. We introduce DuoLM, a framework for fast and effective personalized recommendation that integrates a compact recommendation model with an efficient serving runtime. An encoder LLM learns compact item representations for offline reuse, while a personalized ranker LLM combines them with user history and feedback for recommendation. We train both models end to end with recommendation supervision and teacher distillation. The runtime further accelerates inference through virtual token IDs for embedding access, shared history computation, and CUDA Graph replay. Benchmark results show that our framework achieves recommendation quality comparable to that of the expert teacher model. On a single H100, it delivers approximately 26,400 candidate scores per second, about $60\\times$ the throughput of the teacher served with vLLM and automatic prefix caching.", "arxiv_id": "2610.24481", "arxiv_url": "https://arxiv.org/abs/2610.24481", "authors": ["Jiang Wu", "Yutong Song", "Hongbo Wang", "Guanghe Cao", "Jeff Lei Liang"], "brief": "", "categories": ["cs.IR"], "github_repo": "https://github.com/jiangLLM/DuoLM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.24481", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "GoogleDeepMind", "pdf_url": "https://arxiv.org/pdf/2610.24481v2", "published_at": "2026-10-17", "score": 0.304, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24481.png", "title": "DuoLM: Fast and Effective Personalized Recommendation with Language Models", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive video world models require coordinated control over viewing perspectives, character actions, and camera motion. Existing methods typically leave view modes implicit in text captions, conflate action with camera motion, and inject controls through fragmented architectural pathways that capture interdependencies only indirectly. In this work, we present World-in-Context, an interactive world modeling framework powered by In-Context Conditioning (ICC). Rather than relying on specialized conditioning pathways, World-in-Context unifies view, action, and camera controls into explicit tokens contextualized directly within a shared self-attention space. Our formulation reveals that (i) explicit view tokens disentangle conflicting dynamics and unlock emergent view switching from single-view data, while (ii) action and camera inputs play complementary roles in governing local responsiveness and global stability. To preserve temporal continuity across execution intervals, we further introduce Interaction-Transport RoPE (IT-RoPE), parameterizing temporal attention with accumulated control transitions. On WBench, World-in-Context-5B achieves navigation performance on par with 22B EchoWM ($81.5$ vs. $81.6$) and attains a $93.8\\%$ perspective-switching success rate, substantially outperforming existing 5B baselines ($18.8\\%$). Controlled analyses further demonstrate compounding advantages of World-in-Context under richer conditioning mixtures, favorable data efficiency, and natural applicability to causal rollouts.", "arxiv_id": "2610.33169", "arxiv_url": "https://arxiv.org/abs/2610.33169", "authors": ["Harold Haodong Chen", "Rui Peng", "Rongjin Guo", "Lingteng Qiu", "Kejie Qiu", "Chao Xu", "Zilong Dong"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/aigc3d/World-in-Context", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.33169", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "TongyiLab", "pdf_url": "https://arxiv.org/pdf/2610.33169v1", "published_at": "2026-10-23", "score": 0.292, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33169.png", "title": "World-in-Context: Interactive Video World Modeling with In-Context Conditioning", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "People have long dreamed of an assistant that is always there to guide them and remind what they forget, from new dishes to lost keys. Powered by multimodal large language models (MLLMs), egocentric AI assistants on wearable devices are bringing this dream within reach: they see what the user sees and give instructions for user\u0027s physical work when necessary. However, testing such assistance is challenging and usually requires real people. The expensive and rare real interaction data leaves a key question unanswered: Can today\u0027s MLLMs truly help people in physical world? To answer this question, we propose InteractiveWorld, the first verifiable environment for closed-loop interaction between human and AI assistant. Unlike existing robot-centric simulators, InteractiveWorld lets the assistant guide a human agent who observes the scene, understands instructions, and acts independently. It thus realistically simulates how AI assistant collaborates with human: the assistant instructs, the human acts, and the environment executes actions and updates what they see next. Building on it, we introduce InteractiveBench, the first dynamic benchmark for egocentric AI assistants, with 120 multi-turn tasks across six categories. In each task, the assistant guides the human in real time, and every instruction shapes the outcome, which is scored by verifiable, state-based rewards. Experiments with 12 frontier MLLMs show they are still far from reliable assistants. Even the strongest model, Claude Fable 5.1, achieves at most 20% and 25% on long-horizon Guidance and Planning tasks, respectively. Overall, our work offers a verifiable platform and a rigorous evaluation set, laying a solid foundation for research on interactive MLLM assistants that truly help people in the physical world.", "arxiv_id": "2610.33966", "arxiv_url": "https://arxiv.org/abs/2610.33966", "authors": ["Qinsi Wang", "Wei Wen", "Chong Zhou", "Saksham Suri", "Zechun Liu", "Lemeng Wu", "Hai Helen Li", "Yiran Chen", "Raghuraman Krishnamoorthi", "Qi Qian"], "brief": "", "categories": ["cs.HC", "cs.CV"], "github_repo": "https://github.com/facebookresearch/InteractiveWorld", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33966", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2610.33966v1", "published_at": "2026-10-25", "score": 0.291, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33966.png", "title": "InteractiveWorld: A Verifiable Human-Centric Environment for Building Better Interactive MLLM Assistants", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "The life-cycle of robotics foundation models crucially depends on data labels. Outcome reward labels are needed for monitoring real-world deployments. Process reward labels are needed during RL post-training. Timestamped captions are needed for filtering and balancing pretraining data. We present Flora, an industrial-quality data engine used for training GR00T models, that simultaneously covers these capabilities. Flora achieves SOTA scores on the captioning benchmark WGO-Bench and reward benchmarks RoboReward and Robometer. On internal benchmarks it is competitive with GPT-6 Astra while beating other frontier models. The model is substantially cheaper than API-based alternatives, roughly 125 times cheaper than GPT-6 Astra. Florais battle tested at scale, labeling 200,000 hours of data per day across 512 GB300s. By open-sourcing our data engine, we enable researchers to scale custom robotics datasets and explore emerging applications such as physical auto-research and human-to-robot transfer.", "arxiv_id": "2610.31779", "arxiv_url": "https://arxiv.org/abs/2610.31779", "authors": ["Sicong Leng", "Yunze Man", "Zhiqi Li", "Jing Wang", "Yuhe Zhang", "Ryan Punamiya", "Siddharth Patki", "Kaiyuan Zheng", "Zi-ang Cao", "Zhiding Yu", "Sifei Liu", "Danfei Xu", "Ben Levin", "Jan Kautz", "Yuke Zhu", "Johan Bjorck", "Linxi \"Jim\" Fan"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/NVIDIA/Flora", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2610.31779", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2610.31779v1", "published_at": "2026-10-22", "score": 0.257, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31779.png", "title": "FLORA: An Open Model Suite for Scaling Robotics Data Engines", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In joint-embedding predictive architectures (JEPA), an encoder and a predictor are trained together to produce a representation that minimizes the error in predicting the representation of the next observation. Because the representations of both the current and the next observation are learned, it is unclear which features they will include. Earlier characterizations describe the features JEPA selects in terms of their individual predictability, raising the concern that unpredictable features, like a traffic light, will not be encoded into the representation. However, the prediction error is also affected by the relationships between features, e.g., the light\u0027s color helps predict whether the traffic will stop. We propose the predictive closure characterization, which accounts for these relationships. Based on a reformulation of the JEPA training objective, we show that selection depends on properties of feature sets. This view agrees with earlier works when features evolve independently, but makes new predictions when they do not, for instance that a feature like the traffic light can still be retained. We test this characterization in controlled experiments, which show that unpredictable features can become better represented when they help predict other features, and that changing one feature\u0027s predictive relationships can affect how well others are represented. We also demonstrate implications for steering feature selection: targeting one feature with an auxiliary objective, or supplying it to the predictor as side information, can strengthen the representation of another feature whose future values it helps predict, so steering can be indirect.", "arxiv_id": "2610.27364", "arxiv_url": "https://arxiv.org/abs/2610.27364", "authors": ["Mosh Levy", "Aly Lidayan", "Yoav Goldberg"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/Mosh0110/predictive-closure", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.27364", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of California, Berkeley", "pdf_url": "https://arxiv.org/pdf/2610.27364v1", "published_at": "2026-10-19", "score": 0.244, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Berkeley", "HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.27364.png", "title": "Predictive Closure: A Set-Level Characterization of JEPA\u0027s Feature Selection", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Continual learning is the ability of LLM agents to improve over time by acquiring, refining, and applying knowledge from experience while retaining useful prior knowledge. It is essential for agents learning over long time horizons, yet current evaluations largely assess individual task performance rather than improvement through accumulated experience. We introduce Continual Learning Exam (CLE), a large-scale benchmark developed by 50+ domain experts to measure experience-driven improvement in realistic professional workflows. CLE comprises 120 human-authored tasks, each organised as a five-level ladder, yielding 600 levels spanning 89 professional roles across 12 occupational domains. Agents must pass each level to unlock the next, with later levels building on experience accumulated during earlier assignments. An evaluation agent assesses each submission against human-authored rubrics. We compare a single-submission setting with one that provides diagnostic feedback after failure and allows one revision. Across 17 harness-model configurations using frontier LLMs, feedback and revision yield a median completion gain of 5.3 percentage points. Yet the best-performing system clears only 47.7% of levels and completes all five levels in just 23.3% of tasks, highlighting the difficulty of sustained learning from experience for existing frontier LLMs. As such, the dataset can also be used to post-train LLMs to strengthen their continual learning capabilities.", "arxiv_id": "2610.33956", "arxiv_url": "https://arxiv.org/abs/2610.33956", "authors": ["Haoyu Zhao", "Sitian Tu", "Yuxuan Huang", "Huichi Zhou", "Zhangyue Yin", "Jiahao Huang", "Jingyuan Xu", "Tianmiao Shi", "Jin Shi", "Nianxi Zhang", "Yangmiao Zhang", "Zhuolang Chan", "Huiyan Hu", "Chenchao Sheng", "Yaqing Luo", "Yue Chen", "Huaxiu Yao", "Meng Fang", "Jun Wang"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.CV"], "github_repo": "https://github.com/haoyu-zhao/Continual-Learning-Exam", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.33956", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "University College London", "pdf_url": "https://arxiv.org/pdf/2610.33956v1", "published_at": "2026-10-25", "score": 0.215, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33956.png", "title": "Continual Learning Exam: Benchmarking Long-Horizon RSI and Experiential Learning in LLM Agents", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "When humans collaborate with AI agents on long-horizon tasks, what happens to the agents\u0027 contributions? For solving long-horizon tasks, humans place greater importance on ongoing interaction with AI agents (e.g., revising plans) than on an agent\u0027s ability to complete the task in a single attempt. However, most agentic benchmarks have focused more on automation. Strong performance on such benchmarks does not imply effective real-world collaboration. Professional workflows offer a useful setting, as they often involve interdependent steps. To address this gap, we introduce Kolab, a new dataset of 115+ hours of screen recordings of 50 professionals from 40 occupations collaborating with agents on realistic, long-horizon problems. Kolab also contains participants\u0027 collaboration and output quality judgments. Our analysis reveals diverse collaboration patterns, highlighting the importance of when and how professionals coordinate with agents. A collaborative agent must do two things that automation benchmarks never test: anticipate whether experts will adopt, modify, or reject its contribution once it leaves the chat window to guide its next steps, and assess collaboration quality from the unfolding workflow without constant expert feedback. Our benchmark operationalizes both: (1) forecasting how professionals use agent contributions at diverse workflows, and (2) verifying their judgments of collaboration satisfaction and output quality. Findings show that frontier models, both agentic and non-agentic, overestimate collaboration with experts and struggle to distinguish between high- and low-quality collaboration. Longer workflow context does not consistently improve these predictions. As frontier agents cannot yet understand long-horizon collaboration with experts, we position Kolab as a valuable dataset for studying human-agent collaboration grounded in real professional workflows.", "arxiv_id": "2610.21109", "arxiv_url": "https://arxiv.org/abs/2610.21109", "authors": ["Shirley Anugrah Hayati", "Patricia Anugrah Setiani", "Ruizi Wang", "Zhouyi Li", "Khanh Chi Le", "Young-Jun Lee", "Dongyeop Kang"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.HC", "cs.LG"], "github_repo": "https://github.com/minnesotanlp/kolab", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.21109", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Minnesota NLP", "pdf_url": "https://arxiv.org/pdf/2610.21109v1", "published_at": "2026-10-15", "score": 0.204, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.21109.png", "title": "Kolab: Benchmarking Human-Agent Collaboration in Long-Horizon Workflows", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Precise camera control is essential for cinematic character video generation, yet existing methods struggle to follow large-angle trajectories with combined rotation, translation, and radius variation from arbitrary initial azimuths. Such viewpoint changes also reveal character regions unseen in the initial frame, causing geometric distortions, appearance degradation, and identity drift. To systematically study these coupled challenges, we introduce CLACT, a large-scale Character-centric dataset and benchmark covering diverse Large-Angle Camera Trajectories, with accurate camera geometry and multi-view character observations for training and evaluation. We further propose WorldCast, a framework for world-consistent character video generation under diverse large-angle camera motions. Specifically, we back-project the initial frame into a 3D point cloud using estimated depth, align the point-cloud scale with the target camera trajectory, and render it along the trajectory to obtain explicit geometric guidance and coverage masks. To complement the incomplete character information, we introduce Geometry-Aligned Memory Attention (GAMA). Using relative camera poses estimated jointly from the initial frame and multi-view character anchors, we express anchor and target-view geometry in a common coordinate frame. GAMA uses this geometric alignment to guide the retrieval and injection of view-relevant character features during generation. Evaluations across diverse large-angle camera trajectories demonstrate accurate trajectory following while preserving character geometry, appearance, and identity.", "arxiv_id": "2610.33135", "arxiv_url": "https://arxiv.org/abs/2610.33135", "authors": ["Lei Cao", "Yu Liu", "Wenhua Liao", "Peng Zhang", "Fei Wang", "Hao Zhang", "Jiajun Le", "Daiguo Zhou", "Jian Luan", "Jiayi Ma"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/PixCtrol/WorldCast", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.33135", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.33135v1", "published_at": "2026-10-23", "score": 0.114, "selected_reasons": ["HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33135.png", "title": "WorldCast: World-Consistent Character Video Generation with Large-Angle Camera Control", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce TWIG (Tree-structured Weights with Inherited Gates), a representation in which every weight of a neural network is the end of a path of small discrete decisions: a sign, a shift by a power of two, a zero gate, an index into a shared table. Weights that belong together share the upper part of their paths, and each decision is inherited by every weight below it, so it is stored once and applied once. This simple change has three consequences. Any trained network can be written as a TWIG, and when the decisions are powers of two its weight layers become circuits made almost entirely of wires and adders, suited to chips whose weights are fixed at fabrication. Pruning, quantization, low-rank factorization, codebooks and weight sharing become edits of one object, so a single optimizer can choose among all of them for a whole network. And choosing the decisions is the ground-state problem of a higher-order Boltzmann machine whose interactions follow the paths of the tree, the problem class that annealers and quantum optimizers are built to solve. Today these questions are handled apart: each compression method brings its own format and solver, a circuit with fixed weights needs a dedicated constant multiplier for every weight, and discrete solvers reach only narrow subproblems such as rounding. Weight formats have long been moving toward shared decisions, through group scales, shared exponents, microexponents and sparse weights; TWIG takes this trend to its end, and every common format is a shallow TWIG at no extra cost. On five weight matrices of a large language model, a flat tree whose signed power-of-two terms are chosen per weight for circuit cost, with no group scales, needs 9--15\\% fewer additions than GPTQ at equal layer error at 3- and 4-bit accuracy on typical matrices, and 20--55\\% fewer on matrices with strong outliers.", "arxiv_id": "2610.31931", "arxiv_url": "https://arxiv.org/abs/2610.31931", "authors": ["Ammar Ali", "Stamatis Lefkimmiatis"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/ammarali32/StateTree-Representation", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.31931", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ITMO University", "pdf_url": "https://arxiv.org/pdf/2610.31931v1", "published_at": "2026-10-22", "score": 0.11, "selected_reasons": ["HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31931.png", "title": "Every Weight Is a Path of Shared Discrete Decisions", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "Behavior cloning for robotic manipulation is highly sensitive to the coverage of its training data, yet collecting diverse successful demonstrations remains costly. We study reinforcement learning (RL) not as a deployable controller, but as a data generator for downstream visuomotor imitation learning. Our key premise is that multiple successful solution modes cover a broader range of successful trajectories than repeatedly collecting a single narrow solution. We introduce DiscoDemo, which trains a privileged latent-conditioned RL generator with a parallel reverse curriculum and a success-gated diversity objective to discover diverse solutions while preserving task success. The trained generator produces multiple successful closed-loop behaviors, which are safety-filtered and exported as a static dataset for downstream imitation learning. Across four manipulation tasks, DiscoDemo produces broader successful-state coverage and improves downstream visuomotor policies in both simulation and the real world. Averaged across tasks, downstream success increases to 62% from 40% for the strongest baseline in simulation, and to 78% from 39% on the real robot, respectively. These results suggest that successful solution diversity improves imitation learning for a pretrained flow-matching VLA and remains complementary to corrective data collection. Project page: https://davian-robotics.github.io/DiscoDemo", "arxiv_id": "2610.32093", "arxiv_url": "https://arxiv.org/abs/2610.32093", "authors": ["Minho Park", "Kinam Kim", "Donghu Kim", "Byungkun Lee", "Dongyoon Hwang", "Yongjae Shin", "Junha Hyung", "Hojoon Lee", "Jaegul Choo"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/DAVIAN-Robotics/DiscoDemo", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2610.32093", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "DAVIAN Robotics", "pdf_url": "https://arxiv.org/pdf/2610.32093v1", "published_at": "2026-10-23", "score": 0.085, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.32093.png", "title": "DiscoDemo: Discovering Efficient and Diverse Robot Demonstrations for Imitation Learning", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "World Models (WMs) can support Multimodal Agents (MAs) through simulated experience, while Agent trajectories can inform World Model refinement. Evaluating this interaction requires separate evidence about action selection and state evolution. We introduce Dual Exam, which tests Agents under fixed environment response mechanisms and World Models under fixed action interventions across physical, digital, social, and scientific domains. The Agent track compares 10 configurations on 1,088 items in 15 reporting categories. The World Model track contains 400 cases across eight scenarios; 15 configurations have full coverage and one covers six scenarios. GPT 6 Astra leads the case-weighted Agent Index at 31.3, and GPT-Image-2 leads the full-coverage WM Overall at 21.7. These scores use different tasks and metrics and are not directly comparable. A 150-case pilot of one coupled pairing records zero task successes and motivates component-level diagnosis. Results reveal uneven task performance and failures to preserve task-relevant state. Their value for predicting coupled success or sustained reciprocal learning remains to be established.", "arxiv_id": "2610.31066", "arxiv_url": "https://arxiv.org/abs/2610.31066", "authors": ["Zhefan Rao", "Meng Chu", "Xuan Zhang", "Jingfan Chen", "Guohao Cai", "Runyi Li", "Shiyi Du", "Ning Lu", "Xu Huang", "Zhixuan Chen", "Feng Nie", "Harold Haodong Chen", "Hanwen Wang", "Wen-Jie Shu", "Yajing Bai", "Xianfeng Wu", "Xuanhua He", "Shuhan Guo", "Ziyue Ma", "Ruichuan An", "Long Bai", "Miaosen Chai", "Wenhao Chai", "Jingye Chen", "Qi Chen", "Xuhang Chen", "Wei Chow", "Minghao Fu", "Yunhao Gou", "Haokun Gui", "Dong Huang", "Wei Huang", "Zi Cheng Huang", "Haibo Jin", "Lingdong Kong", "Leung Chun Ho", "Tianqin Li", "Yanheng Li", "Jiayuan Liu", "Jiyang Liu", "Mingyu Liu", "Shaoteng Liu", "Xiaocheng Lu", "Yawen Luo", "Zeyu Qin", "Tiancheng Shen", "Yueqi Song", "Zhaolong Su", "Hengkai Tan", "Tianhao Tang", "Yiran Tao", "Juncheng Wang", "Qinghe Wang", "Shangshang Wang", "Yingying Wang", "Fang Wu", "Tiange Xiang", "Qiushi Yang", "Weicai Ye", "Weichen Yu", "Jiarui Zhang", "Jize Zhang", "Liuzhou Zhang", "Renrui Zhang", "Sheng Zhang", "Wenhu Zhang", "Junru Zhao", "Lingting Zhu", "Yuxin Zuo", "Yutong Bai", "Long Chen", "Yang Deng", "Ziqi Huang", "Yeying Jin", "Weijia Li", "Kevin Qinghong Lin", "Quande Liu", "See-Kiong Ng", "Hongliang Ren", "Hongru Wang", "Shujun Wang", "Qifeng Chen", "Haoxuan Che"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31066", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31066v1", "published_at": "2026-10-22", "score": 0.081, "selected_reasons": ["HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31066.png", "title": "Dual Exam: Controlled Evaluation of Multimodal Agents and World Models", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "The rapid growth of microdramas has increased demand for high-quality script production. Long-form microdrama script generation with LLMs requires both diverse plot progression and long-range narrative coherence. Our observations reveal that candidate continuations increasingly concentrate on fewer narrative mechanisms as generation progresses, while conventional retrieval may reinforce trope reuse and overlook historical information essential to future plots. To address these challenges, we propose DraMaze, a multi-agent pipeline that explores diverse causal paths through trope memory-guided evolutionary tree search and mutation. It further constructs a Backward Narrative Dependency Tree to organize, retain, and retrieve historical memories based on future narrative goals. We also introduce MiDramaBench, a bilingual benchmark for evaluating script logic and creative quality across different script lengths, together with causal-pattern metrics for narrative repetition and diversity. Experiments show consistent improvements across three backbone LLMs. For 60-episode scripts of up to 60k words, DraMaze reduces causal-pattern repetition by 32.1% and achieves a Logic score of 82.5, outperforming the best-performing baseline by 8.5 points.", "arxiv_id": "2610.32002", "arxiv_url": "https://arxiv.org/abs/2610.32002", "authors": ["Siyang He", "Qiqi Wang", "Fan Liu", "Yuncheng Huang", "Pengfei Xu", "Xi Chen", "Ziwei He", "Xipeng Qiu"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.32002", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.32002v1", "published_at": "2026-10-22", "score": 0.074, "selected_reasons": ["HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.32002.png", "title": "DraMaze: A Multi-Agent Pipeline with Future-Aware Memory for Diverse Microdrama Script Generation", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Successful tool-use trajectories are not necessarily useful supervision. Even successful interactions may underrepresent multi-step dependencies or contain actions that are unjustified by the information visible to the agent at decision time. We identify two coupled requirements for effective trajectory supervision: compositional coverage, so that important observation-action dependencies are represented, and decision grounding, so that each supervised action is supported by the learner-visible interaction history. We introduce Trajectory2Gym, which constructs executable interactions around under-supported compositional structures and derives supervision only from grounded decisions in their realized executions. Structural-support selection allocates the resulting experience, while parent-normalized supervised fine-tuning preserves the semantic interaction as the unit of training weight. This reframes trajectory generation as the deliberate construction of learnable interaction experience, rather than the collection of successful trajectories. Across five Qwen3 scales, Trajectory2Gym improves Tau1, Tau2, and BFCL at every tested scale, increasing the equal-weight three-benchmark mean by 16.9-29.8 percentage points. The gains are strongest in stateful and multi-turn interaction, where later decisions depend on earlier observations and feedback. Our results suggest that scaling tool-use agents depends not only on collecting more successful trajectories, but on constructing interactions whose dependencies are represented and whose decisions are learnable from the agent\u0027s visible history.", "arxiv_id": "2610.33568", "arxiv_url": "https://arxiv.org/abs/2610.33568", "authors": ["Yihao Hu", "Zhihao Wen", "Yitong Lin", "Siyuan Lu", "Pan Wang", "Wei Wu", "Jiang-Ming Yang", "Tao Lin"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/yihaohu0118/Trajectory2Gym", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33568", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ant-international", "pdf_url": "https://arxiv.org/pdf/2610.33568v1", "published_at": "2026-10-24", "score": 0.055, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33568.png", "title": "Trajectory2Gym: Decision-Grounded Compositional Interaction Synthesis for Tool-Use Agents", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Developing general-purpose algorithms with global asymptotic convergence guarantees for Nash equilibria of general-sum games remains a longstanding challenge. This paper extends the fixed-point bundle framework for finite-dimensional variational inequalities (VIs) from simplex domains to product-of-simplex domains, enabling its direct application to Nash equilibrium computation. The resulting fixed-point bundle exhibits a composite fiber bundle structure. The key innovation is to construct an equivalent VI on a simplex and establish the equivalence between the two fixed-point bundle frameworks via a fiber bundle isomorphism. Exploiting this geometric equivalence, we show that the path-following algorithm for VIs on product-of-simplex domains inherits the global linear convergence guarantees of the simplex-domain framework. In numerical experiments, the algorithm attained a precision of $10^{-5}$ on all 5600 randomly generated game instances, with dimension ranging from 2-player 128-action to 128-player 2-action. Code and data are available at https://github.com/shb20tsinghua/FiberBundle_VI.", "arxiv_id": "2609.16158", "arxiv_url": "https://arxiv.org/abs/2609.16158", "authors": ["Hongbo Sun"], "brief": "", "categories": ["math.OC", "cs.GT", "cs.MA"], "github_repo": "https://github.com/shb20tsinghua/FiberBundle_VI", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.16158", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16158v2", "published_at": "2026-09-14", "score": 0.045, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.16158.png", "title": "The fixed-point bundle method over product-of-simplex domains arising from game equilibria", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "The growth of time-series datasets and foundation models has made dataset comparison a central part of time-series workflows. Assessing source-target transfer before model adaptation requires similarity estimates that can summarize transfer-related dataset relationships without exhaustive source-target evaluation over every candidate pair. Many metrics have been proposed for measuring similarity between time-series datasets, but they capture different dataset relationships and vary in how well they align with downstream utility across tasks. We evaluate this gap by measuring the correlation between source-target similarity scores and downstream forecasting errors in out-of-distribution and transfer-learning settings. We propose Domain-Integrated Similarity Cost (DISC), a learnable aggregation framework that uses calibration transfer observations to select, weight, and combine similarity metrics for different downstream tasks. By integrating complementary metric values, DISC better distinguishes source-target dataset differences that matter for downstream behavior. After calibration, DISC scores source-target pairs using only their similarity-metric values and yields higher alignment than single-metric references on the reported split. These results show that time-series dataset similarity is task-dependent, and that learned metric integration provides a stronger proxy for downstream transfer behavior than manually selecting one similarity metric.", "arxiv_id": "2610.31288", "arxiv_url": "https://arxiv.org/abs/2610.31288", "authors": ["Yen-Ku Liu", "Hongjie Chen", "Franck Dernoncourt", "Ryan Rossi"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31288", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31288v1", "published_at": "2026-10-22", "score": 0.045, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31288.png", "title": "DISC: Domain-Integrated Similarity Cost for Time-Series Dataset", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding is a technique that accelerates the inference speed of autoregressive large language models (LLMs) by sampling from a faster, lower quality draft model. Traditionally, a fundamental characteristic of speculative decoding is that it is lossless with respect to the verifier distribution, guaranteeing speed without sacrificing quality. This differs from recently developed diffusion LLMs (dLLMs), which are notably able to achieve substantial speedups by degrading the quality of their outputs with less diffusion effort. Because diffusion models are able to sample faster than autoregressive models by generating tokens in parallel, they are considered strong candidates for draft models in speculative diffusion. While it is widely understood that diffusion models can sacrifice quality for speed, speculative decoding itself can also be generalized to generate lossy samples faster using more lenient acceptance criteria with respect to the verifier distribution. Presented with the two parameters of diffusion effort and speculative decoding leniency, this paper explores the full achievable Pareto frontier via joint variations of these parameters. Our experiments show that jointly varying diffusion effort and acceptance leniency can extend the speed-quality Pareto frontier over single step diffusion drafting.", "arxiv_id": "2610.31819", "arxiv_url": "https://arxiv.org/abs/2610.31819", "authors": ["Aaron Zorel", "Guy Van den Broeck", "Aditya Grover", "Daniel Israel"], "brief": "", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31819", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of California, Los Angeles", "pdf_url": "https://arxiv.org/pdf/2610.31819v1", "published_at": "2026-10-22", "score": 0.043, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31819.png", "title": "Speculative Diffusion is a Tale of Two Tradeoffs", "tldr": null, "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Lyapunov functions and barrier certificates give state-space guarantees of stability and safety, but synthesizing and verifying them---especially for nonlinear, high-dimensional systems---remains an open challenge. Existing pipelines verify candidates with numerical solvers (sum-of-squares programs), interval methods, or satisfiability-modulo-theories (SMT) solvers, which often require relaxations, are conservative, or scale poorly with model dimension and nonlinearity. These limitations have also shaped benchmark design: standard test suites are dominated by low-dimensional polynomial systems chosen to suit what solvers can handle rather than what engineering applications require. We address both sides of this challenge. First, we introduce DynaCertBench, a benchmark of 105 instances: 80 non-redundant systems curated from the literature, extended with high-dimensional and control-constrained variants and new nonlinearly coupled systems, comprehensively spanning stability, region-of-attraction, forward-invariance, and safety tasks. Second, we present LLM2Cert, an LLM-driven framework that synthesizes candidate certificates and verifies them against their proof obligations: each obligation is routed to an SMT solver or directly to the Lean Proof-Repair agent. On DynaCertBench, LLM2Cert verifies 81 of 105 instances ($77.1\\%$), a $17.1$ percentage point improvement over one-shot proposal without feedback. On the 81 fixed certificates, LLM2Cert verifies 22 that All-SMT leaves unresolved. Code and data are available at https://github.com/FormalCert-AI/llm2cert.", "arxiv_id": "2610.30524", "arxiv_url": "https://arxiv.org/abs/2610.30524", "authors": ["Zhipeng Cao", "Peiyang Song", "Nikolaus Vertovec", "Weiru Cui", "Zhihao Yang", "Mingkang Liu", "Luxia Lin", "Bai Xue", "Alessandro Abate"], "brief": "", "categories": ["eess.SY", "cs.AI", "cs.LG", "math.OC"], "github_repo": "https://github.com/FormalCert-AI/llm2cert", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.30524", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "FormalCert-AI", "pdf_url": "https://arxiv.org/pdf/2610.30524v1", "published_at": "2026-10-21", "score": 0.042, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30524.png", "title": "LLM2Cert: LLM Synthesis of Certificates with SMT/Lean Verification", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Developing general-purpose algorithms with global asymptotic convergence guarantees for variational inequalities (VIs) remains a longstanding challenge. This paper proposes a path-following framework for finite-dimensional VIs with arbitrary continuous mappings and polytope domains. The approach first transforms a general VI into a smooth VI on a simplex. Its key innovation is to formulate the resulting problem on a fiber bundle, called the fixed-point bundle, whose geometric structure enables the systematic integration of initialization, path-following, and singularity avoidance. Without imposing monotonicity or similar assumptions, the framework guarantees global linear convergence for nonsingular solutions and global linear convergence up to any prescribed precision for singular solutions. In numerical experiments, the algorithm attained a precision of $10^{-5}$ on all 6400 randomly generated instances, with dimensions up to 1024. Code and data are available at https://github.com/shb20tsinghua/FiberBundle_VI.", "arxiv_id": "2606.00778", "arxiv_url": "https://arxiv.org/abs/2606.00778", "authors": ["Hongbo Sun"], "brief": "", "categories": ["math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2606.00778", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2606.00778v3", "published_at": "2026-05-30", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2606.00778.png", "title": "A path-following framework on fiber bundle for variational inequalities", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Publishers and funders increasingly ask authors to disclose how AI tools contributed to a piece of research. In computational work the repository is where an author or an auditor would look for the answer, and we ask what it can actually supply. We audit two single-investigator repositories by the same author in the same field, each carrying a different class of agent residue: a prescriptive trace of standing rule files and a narrative trace of a running agent scratchpad, in repositories of 466 and 103 commits. The two are legible in opposite ways. 85.6% of the lines ever committed to the prescriptive trace are visible at the current revision, and a standing rule states a conclusion and discards the episode behind it; the narrative trace records episodes and shows 21.8%. Counted by revision the gap is far smaller: 15 of the prescriptive trace\u0027s 41 revisions leave no visible line, against 18 of the narrative trace\u0027s 41. The Co-Authored-By trailer, the field an automated audit reads, is one of three AI trailer keys Project A carries and covers 66 of the 121 commits carrying any. In Project B it has low sensitivity against an explicit within-repository proxy: 39 commits revise a file maintained to hold an agent\u0027s working notes and 1 (2.6%) carries the trailer. Project A\u0027s repository-level rate is unstable in time too, stepping from 2.7% to 17.7% across a boundary we did not specify in advance. Repository channels disagree, and neither rate can be read as an involvement rate; we do not isolate the cause, and say so. We give a field-by-field account of which provenance claims such traces support, which they cannot, and which they answer confidently and wrongly, construct an auditable evidence ledger, and derive the requirements this places on any system meant to record research provenance as it happens.", "arxiv_id": "2610.28655", "arxiv_url": "https://arxiv.org/abs/2610.28655", "authors": ["Koutian Wu", "Zesen Huang", "Hejia Geng"], "brief": "", "categories": ["cs.DL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/ktwu01/git-provenance-auditor", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.28655", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.28655v1", "published_at": "2026-10-09", "score": 0.033, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.28655.png", "title": "What Git Does Not Record: Provenance Legibility in Two AI-Assisted Research Repositories", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Biometric authentication systems increasingly use privacy-preserving mechanisms to protect sensitive templates. However, the authentication interface itself may still leak information that enables reconstruction attacks. Prior attacks exploit released similarity scores, whereas more advanced systems reveal only the binary accept/reject decision. This binary feedback provides substantially less information, making template reconstruction far more challenging. In this work, we introduce query-efficient reconstruction attacks under extremely limited feedback, addressing two key limitations of prior attacks. First, we introduce the first attack that reconstructs protected biometric templates using only authentication success/failure feedback by exploiting the geometric constraints of biometric authentication. Second, we introduce distribution-aware query-efficient reconstruction methods for score-releasing systems, achieving a more realistic threat model by reducing the number of required queries by a factor of $5\\times$ compared to recent prior score-based attacks. Finally, we combine these two insights by incorporating a pretrained facial diffusion prior into our geometric binary attack, reducing the number of required queries by a factor of $5\\times$. Our findings reveal a fundamental security limitation of biometric authentication: independently of the template protection mechanism, the authentication process itself exposes geometric information that can enable perfect template reconstruction up to numerical precision. Moreover, the distribution of biometric templates can be leveraged to make significantly more effective reconstruction attacks.", "arxiv_id": "2610.25118", "arxiv_url": "https://arxiv.org/abs/2610.25118", "authors": ["Eliron Rahimi", "Margarita Osadchy", "Orr Dunkelman"], "brief": "", "categories": ["cs.CR"], "github_repo": "https://github.com/ElironRahimi/geometric_biometric_reconstruction", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.25118", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.25118v1", "published_at": "2026-10-18", "score": 0.031, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.25118.png", "title": "How Much Feedback Is Needed to Break Template Protection? The Geometric Vulnerability of Biometric Authentication", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Structured knowledge retrieval acquires task-relevant evidence from structured knowledge sources for downstream tasks. Existing methods rely on unconstrained retrieval or predefined query-rule supervision, such as author-paper rules for scientific discovery and anatomy-drug rules for precision medicine. Such supervision is rarely available in practice. We propose Co-Adaptive Rule Routing and Constraining Retrieval (CoRE), which jointly learns which reasoning rule to assign to each query and how to retrieve evidence under that rule, without predefined query-rule pairs. A routing agent selects a rule, and its corresponding retriever traverses the knowledge base and ranks evidence that satisfies the rule\u0027s constraints. Because routing and retrieval are interdependent, CoRE alternates between reinforcement learning for the routing policy and contrastive learning for the rule-constrained retriever. The selected rules provide supervision for retriever training, while retrieval performance rewards the routing policy. This closed-loop process enables both components to co-adapt without explicit query-rule supervision. Experiments on STaRK-QA datasets across scientific discovery, biomedical reasoning, and e-commerce knowledge management demonstrate CoRE\u0027s effectiveness. Ablations show the benefit of co-adapting the router and retriever. Generation-based routing transfers across datasets and benefits from multi-domain pretraining followed by target-specific fine-tuning. Analysis of rule usage across queries also informs automatic rule refinement and discovery.", "arxiv_id": "2610.14465", "arxiv_url": "https://arxiv.org/abs/2610.14465", "authors": ["Zhisheng Qi", "Haoyu Han", "Jiaxi Li", "Bing He", "Huiyuan Chen", "Franck Dernoncourt", "Ryan A. Rossi", "Mahantesh M. Halappanavar", "Jin Lu", "Yu Zhang", "Tianming Liu", "Yu Wang"], "brief": "", "categories": ["cs.IR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.14465", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.14465v2", "published_at": "2026-10-10", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14465.png", "title": "Co-adaptive Rule Routing and Constraining for Structured Knowledge Retrieval", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "We examine how closely pretrained LeWorldModel (LeWM) reproduces the effects of small action changes. Using matched simulator and model responses, we measure action sensitivity with Gram matrices at three perturbation scales. Across nearly a thousand states from Reacher and OGBench Cube, the most sensitive action directions differ by median angles of about $36^\\circ$ and $42^\\circ$, respectively, at the smallest scale. Increasing the perturbation tenfold reduces median normalized Gram discrepancy by roughly 70\\% on Reacher and 47\\% on Cube. Geometry measured in pixels and embeddings varies more across scales than the chosen physical-state geometry. On held-out directions, environment Grams achieve median embedding response errors of 17\\% and 28\\%, compared with 26\\% and 38\\% for an isotropic reference with the same trace. LeWM\u0027s errors are higher at this scale. These findings support scale-specific evaluation of action sensitivity; its effect on control remains an open question.", "arxiv_id": "2610.31716", "arxiv_url": "https://arxiv.org/abs/2610.31716", "authors": ["Vasil Vasilev", "Siddharth Nayak"], "brief": "", "categories": ["cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31716", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.31716v1", "published_at": "2026-10-22", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31716.png", "title": "Does LeWorldModel Preserve Local Action Geometry?", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Slider-based control aims to give users continuous, fine-grained control over the intensity of individual edits in instruction-based image editing. However, existing approaches fail to deliver reliable continuous controllability: traversing a slider can produce abrupt visual jumps and non-monotonic changes, while jointly controlled sliders can interfere with one another. To systematically study these limitations, we introduce SlideBench, a comprehensive benchmark for continuous image editing spanning diverse editing categories and equipped with a unified suite of metrics quantifying monotonic progression, perceptual continuity, and inter-slider disentanglement. Building on these observations, we propose SliderEdit++, which explicitly regularizes the intermediate editing trajectory rather than supervising only its endpoints. Our method combines velocity- and semantic-space trajectory regularization with spectral control to encourage smooth, predictable slider traversal, together with a disentanglement objective that reduces interference between independently controlled edits. On SlideBench, SliderEdit++ achieves state-of-the-art performance, improving the overall score by 18.5% relative to the strongest baseline. At the same time, using a few-step editing backbone makes our method approximately 3x to 20x faster than existing slider-based approaches, enabling substantially more responsive interactive editing.", "arxiv_id": "2610.14253", "arxiv_url": "https://arxiv.org/abs/2610.14253", "authors": ["Arman Zarei", "Sayan Nag", "Bryan Wang", "Franck Dernoncourt", "Varun Manjunatha", "Nedim Lipka", "Soheil Feizi", "Samyadeep Basu"], "brief": "", "categories": ["cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.14253", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.14253v2", "published_at": "2026-10-09", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14253.png", "title": "SliderEdit++: Improved Slider Trajectories in Instruction-Based Image Editing", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Recent methods for injecting graph structure into LLM prompts include graph soft prompting, in which a graph neural network (GNN) learns graph-specific tokens that capture relational information among entities in textual prompts. G-Retriever combines graph soft prompts with a verbalized description of the same graph to strengthen the textual prompt signal. We conduct an in-depth analysis of G-Retriever and uncover a pathological behavior we term token collapse. Across three benchmarks, three graph encoders, two LLM families, and both frozen and LoRA-adapted models, G-Retriever\u0027s graph tokens become almost indistinguishable across inputs. We provide evidence that the same failure is inherited by subsequent methods, even with multi-token pooling. Under the standard setup, swapping a token with the dataset mean, a token from another example, or one derived from a corrupted graph produces no resolved answer-level effect in accuracy. Moreover, a learned constant prompt that never accesses the graph matches or surpasses G-Retriever on all three benchmarks. These findings indicate that, rather than conveying graph content as intended, the collapsed token functions primarily as a generic soft prompt. We also examine conditions linked to this collapse and propose a two-stage procedure that yields non-collapsed tokens while maintaining competitive performance in most cases. However, token variability alone does not prove that the model uses graph information: via interventions and decoding probes, we show that depending on the configuration, a token can reflect the question, an answer prior, or graph-derived content that the LLM may or may not use. Overall, our results offer a practical approach to evaluating graph-token alignment rather than inferring it from task accuracy alone. Code to reproduce our experiments is available at https://github.com/difra100/Token_Collapse_KGQA.", "arxiv_id": "2610.31572", "arxiv_url": "https://arxiv.org/abs/2610.31572", "authors": ["Andrea Giuseppe Di Francesco", "Rishabh Jain", "Franco Maria Nardini", "Nicola Tonellotto", "Pietro Li\u00f2", "Fabrizio Silvestri"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/difra100/Token_Collapse_KGQA", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.31572", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Sapienza University of Rome", "pdf_url": "https://arxiv.org/pdf/2610.31572v1", "published_at": "2026-10-22", "score": 0.013, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31572.png", "title": "On the Token Collapse Phenomenon in Textual Graph Soft Prompting", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models have become an important paradigm for robotic manipulation by unifying visual perception, language understanding, and action generation. Since reliable manipulation requires sufficient observation of objects, end-effectors, and their spatial relationships, multi-view inputs are widely used to provide complementary spatial information. However, our experiments show that existing VLA models do not fully exploit such multi-view complementarity. The policy tends to persistently rely on the wrist view, lacking the ability to dynamically adjust global-local view dependency across manipulation stages, which limits stage adaptability and robustness. To address this issue, we propose FocusVLA, a stage-aware multi-view routing framework. FocusVLA predicts future interaction intent from historical actions and uses it to guide dynamic view routing during action generation. By adaptively coordinating global and local observations across different task stages, FocusVLA improves multi-view utilization. On RoboTwin 2.0, FocusVLA improves the average success rate over the strongest baseline $\u03c0_{0.5}$ by 10.10 pp. In real-world evaluation, FocusVLA improves the success rate from 71.7\\% to 85.0\\%, achieving a 13.3\\% gain over $\u03c0_{0.5}$. Moreover, the intent prediction and dynamic routing modules of FocusVLA can be integrated into existing VLA frameworks without modifying their core architectures.", "arxiv_id": "2610.31423", "arxiv_url": "https://arxiv.org/abs/2610.31423", "authors": ["Huixin Xu", "Ziya Yu", "Peng Li"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.31423", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Technology Center of Software Engineering of ISCAS", "pdf_url": "https://arxiv.org/pdf/2610.31423v1", "published_at": "2026-10-22", "score": 0.007, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.31423.png", "title": "FocusVLA: Future-Intent Guided Dynamic View Routing for Vision-Language-Action Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Structured scientific spectra encode rich physical information while obeying hard constraints, such as conservation laws and characteristic spectral geometry. Accurate prediction of these spectra is central to materials discovery, yet existing methods often treat them as unconstrained sequences and therefore fail to enforce the underlying physical structure. Taking electronic density of states (eDOS) as the prototypical example, we introduce DeepSciReasoner, a general paradigm for predicting scientific spectra under physical constraints. The framework combines structure-aware spectrum decoding with constraint-preserving physical reasoning, allowing predictions to capture rich spectral structure while respecting the underlying physics. We evaluate DeepSciReasoner on eDOS, phonon density of states (phDOS), X-ray absorption near-edge structure (XANES), and Raman spectra, where it substantially improves prediction accuracy while maintaining physical consistency. These results establish DeepSciReasoner as a reusable blueprint for structured scientific spectrum prediction under hard physical constraints.", "arxiv_id": "2610.34021", "arxiv_url": "https://arxiv.org/abs/2610.34021", "authors": ["Yingheng Wang", "Tao Yu", "Shufeng Kong", "Francesco Ricci", "John M. Gregoire", "Carla P. Gomes"], "brief": "", "categories": ["cond-mat.mtrl-sci", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34021", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34021v1", "published_at": "2026-10-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Deep Scientific Reasoning under Physical Constraints: Structure-Aware Spectrum Prediction", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present BriLLM-MetaPred, the first engineering implementation of the MetaPred machine-learning framework established by a mathematical theory of AGI, instantiated for language modeling. The theory argues that MetaPred is both necessary and sufficient as a machine-learning primitive for general cognition. Taking this theoretical conclusion as a design premise, we report an implementation of the primitive for language modeling. A single continuously evolving dynamical state serves as both the context representation and the state from which predictions are read out. Continuous measurement of its own state reduces finite-depth inconsistency, maintains internal consistency, and provides an endogenous dynamical self-supervision signal in fixed-point form. The single dynamical state of MetaPred intrinsically couples training and inference. MetaPred therefore exhibits symmetry across almost all key elements of machine learning, an intuitive and observable property of the mathematical optimum over the space of all machine-learning paradigms. BriLLM-MetaPred is neither another recurrent language model nor an extension of BriLLM. It provides a bridge between two prior contributions: the construction and motivation of the MetaPred primitive provided by AGI theory, and the SiFu learning paradigm provided by BriLLM (Zhao et al., 2025). The latter\u0027s node-signal-flow design enables the primitive to run on available software and hardware accelerators. Our implementation of BriLLM-MetaPred achieves predictive performance comparable to a GPT baseline of the same size. This provides initial evidence for the engineering feasibility of the MetaPred framework established by the mathematical theory of AGI. MetaPred is the first machine-learning paradigm derived entirely from mathematical theory rather than assembled and incrementally improved through human design---and perhaps the last such paradigm.", "arxiv_id": "2610.34018", "arxiv_url": "https://arxiv.org/abs/2610.34018", "authors": ["Junyuan Liu", "Hongyue Lin", "Jiale Hong", "Yi Zhao", "Hai Zhao"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34018", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34018v1", "published_at": "2026-10-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "BriLLM-MetaPred: A Representation-Prediction Unity Language Model with Adaptive Self-Measurement", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conventional federated learners implicitly optimize for global means, creating a \"one-size-fits-all\" paradigm that inevitably suppresses the minority under cross-site heterogeneity. To bridge this critical gap, we present Fed-Universe, a generalizable Semantic-Geometric-Topological-Human (S-G-T-H) architecture that transforms passive averaging into an active negotiation for decentralized alignment. The S-layer deploys an edge-capable LLM as a semantic surrogate to translate heterogeneous inputs into standardized patient profile prompts. The G-layer enforces geometric quality assurance (GQA) via a mapping f: Theta -\u003e Q from the statistical parameter space to a physically interpretable quality domain, employing a cosine similarity gate to retain minority updates based on physical geometry rather than statistical proximity. The T-layer executes topological Pareto control, identifying a sensitivity-based knee point (lambda_k) to balance multi-objective aggregation without majority degradation. Finally, the H-layer operationalizes a cognitive twin dynamic to mirror the user\u0027s real-time psychological state, dynamically adapting human-computer interaction modes via active intent alignment. To ground this theoretical architecture empirically, we validated the S-G-T core on a binational synthetic clinical network simulation. This proof-of-concept demonstrated a \"zero-sum escape\": a minority node (\u003c3% data volume) achieved utility parity (loss reduction from 0.857 to 0.340) alongside dominant hubs. Our Fed-Universe framework is being expanded along two focused pillars: institutional multimodal alignment (Fed-Ultra) and individual cognitive intent alignment (Fed-Human).", "arxiv_id": "2610.34009", "arxiv_url": "https://arxiv.org/abs/2610.34009", "authors": ["Ting Xu", "Henry Leung"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34009", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34009v1", "published_at": "2026-10-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Fed-Universe: A Semantic-Geometric-Topological-Human (S-G-T-H) Stack for Negotiated Alignment in Federated Systems", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy self-distillation (OPSD) trains a student on its own reasoning trajectories using token-level supervision from a reference-conditioned teacher initialized from the same model. However, access to the reference can induce teacher behaviors that undermine independent reasoning in thinking models, leading to reference hallucinations, where the student cites an unavailable reference to justify reasoning steps, and reconsideration suppression, where the teacher discourages verification and revision at uncertain steps. We introduce Steered-Teacher OPSD (ST-OPSD) to jointly address these failure modes through activation steering. ST-OPSD extracts two directions from model-generated reasoning trajectories and applies them to the teacher\u0027s hidden states during distillation target computation, suppressing reference-invoking behavior and encouraging reconsideration with marker-family calibration. The student learns from the resulting teacher distributions without being steered. Experiments on AIME and HMMT show that ST-OPSD improves accuracy over vanilla OPSD and other interventions while restoring reconsideration and reference-hallucination rates to base-model levels.", "arxiv_id": "2610.34005", "arxiv_url": "https://arxiv.org/abs/2610.34005", "authors": ["Tiejin Chen", "Xiaoou Liu", "Hanyang Chen", "Hua Wei"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34005", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34005v1", "published_at": "2026-10-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Steering the Teacher: Improving On-Policy Self-Distillation for Thinking Models", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Template-based crystal structure prediction (CSP) transfers a known crystal structure to a new composition by element substitution, so its accuracy depends on retrieving suitable templates, mapping elements and ranking the resulting candidates correctly. Auditing the original TCSP2.0 implementation on the T180 benchmark, we found that 469 of its 2,347 selected structures (20%) have the wrong composition, caused by element mappings that ignore stoichiometric coefficients and by sequential text substitution that cascades or corrupts element symbols. We propose TCSP3.0, which enforces coefficient-preserving mappings, substitutes species simultaneously on parsed structures and validates every candidate\u0027s composition and cell. It further adds periodic-number retrieval, soft oxidation-state evidence, radius-compatibility scoring, structural deduplication, and ORB-v3 machine-learning-potential relaxation and energy ranking of its candidates, as used by deep generative CSP baselines. TCSP3.0 achieves Top-1 and Top-20 match rates of 72.2% and 90.6% on T180, compared with 28.3% and 45.6% for TCSP2.0, and a Top-20 match rate of 74.0% on a new 800-target benchmark (T800). On T180 it also outperforms PNcsp+ and deep generative models CrystalFlow and MaskGXT (Top-1 72.2% versus at most 63.9%). Even without relaxation, TCSP3.0 reaches 67.8% at Top-1 and 90.6% at Top-20 in a median of 28 s per target on two CPU cores, about ten times faster than CrystalFlow. Paired ten-arm ablations on T180 and T800 show that most of the improvement comes from the correctness fixes; structural deduplication significantly improves the Top-5 match rate, embedding-based retrieval is required for coverage, and the remaining scoring features have small or null effects.", "arxiv_id": "2610.34029", "arxiv_url": "https://arxiv.org/abs/2610.34029", "authors": ["Ying Feng", "Jeffrey Hu", "Lai Wei", "Liang Tao", "Madeline Miklos", "Dipannoy Das Gupta", "Hossein Erfanshekooh", "Jianjun Hu"], "brief": "", "categories": ["cond-mat.mtrl-sci", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34029", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34029v1", "published_at": "2026-10-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TCSP3.0: Template-Based Crystal Structure Prediction with Coefficient-Preserving Element Substitution and Structural Diversity", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The differential neural tangent kernel (DNTK) is a tool for analyzing the training dynamics of overparameterized physics informed neural networks. In this work, we investiga
