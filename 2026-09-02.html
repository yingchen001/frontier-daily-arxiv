7684\u540e\u7f00\u641c\u7d22\u66ff\u4ee3\u8fc7\u6df1\u7684\u8d2a\u5fc3\u641c\u7d22\u3002\u5b83\u7ed3\u5408\u5c3e\u90e8\u805a\u7126\u5bf9\u6297\u635f\u5931\u3001\u6e90\u6a21\u578b\u635f\u5931\u4e0e\u884c\u4e3a\u8986\u76d6\u6765\u7b5b\u9009\u540e\u7f00\uff0c\u5728\u591a\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u63d0\u5347\u653b\u51fb\u6210\u529f\u7387\u5e76\u51cf\u5c11\u4f18\u5316\u65f6\u95f4\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02172", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u5bf9\u6297\u4f18\u5316", "\u63d0\u793a\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02172v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Breadth Beats Depth: Improving GCG-Based Jailbreak Optimization with Breadth-Oriented Suffix Search", "tldr": "\u8bba\u6587\u63d0\u51fa BOSS\uff0c\u4e00\u4e2a\u53ef\u63d2\u62d4\u7684 GCG \u8d8a\u72f1\u653b\u51fb\u4f18\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u9762\u5411\u5e7f\u5ea6\u7684\u540e\u7f00\u641c\u7d22\u66ff\u4ee3\u8fc7\u6df1\u7684\u8d2a\u5fc3\u641c\u7d22\u3002\u5b83\u7ed3\u5408\u5c3e\u90e8\u805a\u7126\u5bf9\u6297\u635f\u5931\u3001\u6e90\u6a21\u578b\u635f\u5931\u4e0e\u884c\u4e3a\u8986\u76d6\u6765\u7b5b\u9009\u540e\u7f00\uff0c\u5728\u591a\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u63d0\u5347\u653b\u51fb\u6210\u529f\u7387\u5e76\u51cf\u5c11\u4f18\u5316\u65f6\u95f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Steering aligns large language models (LLMs) by injecting a bias into selected activations at inference time, offering a far cheaper alternative to weight-update methods such as supervised fine-tuning or reinforcement learning. However, most existing training-free steering methods are input-independent: a single direction is fitted once and shared across all inputs. This is fundamentally limiting as different inputs occupy different regions of the activation space and admit different optimal steering directions toward the same target concept, much as the gradient with respect to a fixed loss varies from input to input. We close this gap with IDEEA (Input-Dependent stEEring via Activation cluster matching), a training-free framework for input-dependent steering. IDEEA clusters the positive and negative activation supports per attention head, and solves an optimal-matching problem to construct a set of cluster-conditional directions, all about the target concept. At inference time, it picks from this pool of directions and uses the one that best matches the input\u0027s own activation for steering. IDEEA aligns the model toward the target concept while preserving the input\u0027s original representation, evidence that activations encoding a concept occupy several distinct sub-regions of the representation space rather than a single one. IDEEA improves the truth $\\times$ info rate in TruthfulQA by an average of 9.9% (up to 23.5%) over the best input-independent baseline.", "arxiv_id": "2609.02089", "arxiv_url": "https://arxiv.org/abs/2609.02089", "authors": ["Zheng Wang", "Muchen Li", "Renjie Liao", "Yan Leng"], "brief": "\u672c\u6587\u63d0\u51fa IDEEA\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u8f93\u5165\u4f9d\u8d56\u5f0f\u5927\u8bed\u8a00\u6a21\u578b\u6fc0\u6d3b steering \u65b9\u6cd5\uff0c\u901a\u8fc7\u5bf9\u6b63\u8d1f\u6fc0\u6d3b\u7c07\u8fdb\u884c\u5339\u914d\uff0c\u4e3a\u4e0d\u540c\u8f93\u5165\u9009\u62e9\u66f4\u5408\u9002\u7684\u6982\u5ff5\u5f15\u5bfc\u65b9\u5411\u3002\u76f8\u6bd4\u4f20\u7edf\u5355\u4e00\u5168\u5c40\u65b9\u5411\u65b9\u6cd5\uff0c\u5b83\u5728\u4fdd\u6301\u8f93\u5165\u539f\u6709\u8868\u793a\u7684\u540c\u65f6\u66f4\u597d\u5730\u5bf9\u9f50\u76ee\u6807\u6982\u5ff5\uff0c\u5728 TruthfulQA \u4e0a truth\u00d7info \u6307\u6807\u5e73\u5747\u63d0\u5347 9.9%\uff0c\u6700\u9ad8\u63d0\u5347 23.5%\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02089", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5bf9\u9f50", "\u6fc0\u6d3b\u5f15\u5bfc", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02089v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "IDEEA: training-free Input-Dependent stEEring via Activation cluster matching", "tldr": "\u672c\u6587\u63d0\u51fa IDEEA\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u8f93\u5165\u4f9d\u8d56\u5f0f\u5927\u8bed\u8a00\u6a21\u578b\u6fc0\u6d3b steering \u65b9\u6cd5\uff0c\u901a\u8fc7\u5bf9\u6b63\u8d1f\u6fc0\u6d3b\u7c07\u8fdb\u884c\u5339\u914d\uff0c\u4e3a\u4e0d\u540c\u8f93\u5165\u9009\u62e9\u66f4\u5408\u9002\u7684\u6982\u5ff5\u5f15\u5bfc\u65b9\u5411\u3002\u76f8\u6bd4\u4f20\u7edf\u5355\u4e00\u5168\u5c40\u65b9\u5411\u65b9\u6cd5\uff0c\u5b83\u5728\u4fdd\u6301\u8f93\u5165\u539f\u6709\u8868\u793a\u7684\u540c\u65f6\u66f4\u597d\u5730\u5bf9\u9f50\u76ee\u6807\u6982\u5ff5\uff0c\u5728 TruthfulQA \u4e0a truth\u00d7info \u6307\u6807\u5e73\u5747\u63d0\u5347 9.9%\uff0c\u6700\u9ad8\u63d0\u5347 23.5%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLMs latent-state reasoning methods replace discrete intermediate tokens with continuous states, such as weighted mixtures of token embeddings, to retain multiple possible reasoning directions rather than committing to one. Yet pretrained language models often fail to preserve these mixtures. We study why through a combination of theoretical analysis and controlled empirical investigations on a variety of models. We identify three independent, distinct sources of failure. First, transformer architectures already distort mixture geometry, and training substantially amplifies this effect. Moreover, the failure can occur even if the model transports mixtures perfectly linearly: the softmax readout and autoregressive feedback form a dynamical system that either amplifies small differences until one component of the mixture dominates or contracts different mixtures until they become indistinguishable. We verify this theoretical prediction empirically: the observed transition between contraction and amplification occurs near the theoretical threshold derived by our analysis, and pretrained-model rollouts lie predominantly on the amplifying side. Finally, we generalize to mixtures of many components and show that exact preservation generally requires context-dependent correction, whose required dimensionality can grow with the number of components.", "arxiv_id": "2609.02049", "arxiv_url": "https://arxiv.org/abs/2609.02049", "authors": ["Ali Backour"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u4e2d\u7528\u8fde\u7eed\u6f5c\u72b6\u6001/\u8bcd\u5d4c\u5165\u6df7\u5408\u6765\u8868\u793a\u591a\u6761\u63a8\u7406\u8def\u5f84\u65f6\uff0c\u4e3a\u4f55\u8fd9\u4e9b\u6df7\u5408\u72b6\u6001\u4f1a\u574d\u7f29\u3002\u4f5c\u8005\u4ece\u7406\u8bba\u548c\u53d7\u63a7\u5b9e\u9a8c\u53d1\u73b0\u4e09\u7c7b\u5931\u6548\u6765\u6e90\uff1aTransformer \u4e0e\u8bad\u7ec3\u4f1a\u626d\u66f2\u6df7\u5408\u51e0\u4f55\uff0csoftmax \u8bfb\u51fa\u548c\u81ea\u56de\u5f52\u53cd\u9988\u4f1a\u653e\u5927\u5dee\u5f02\u6216\u538b\u7f29\u6df7\u5408\uff0c\u591a\u6210\u5206\u6df7\u5408\u8fd8\u9700\u8981\u9ad8\u7ef4\u4e14\u4f9d\u8d56\u4e0a\u4e0b\u6587\u7684\u6821\u6b63\u3002\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u7406\u8bba\u9884\u6d4b\u7684\u6536\u7f29/\u653e\u5927\u8f6c\u53d8\u9608\u503c\uff0c\u8bf4\u660e\u9884\u8bad\u7ec3\u6a21\u578b\u901a\u5e38\u66f4\u5bb9\u6613\u8d70\u5411\u5355\u4e00\u6210\u5206\u4e3b\u5bfc\u7684\u574d\u7f29\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02049", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6f5c\u72b6\u6001\u63a8\u7406", "\u8868\u793a\u5b66\u4e60", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02049v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Dynamics of Continuous Mixture Collapse in Language Models", "tldr": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u4e2d\u7528\u8fde\u7eed\u6f5c\u72b6\u6001/\u8bcd\u5d4c\u5165\u6df7\u5408\u6765\u8868\u793a\u591a\u6761\u63a8\u7406\u8def\u5f84\u65f6\uff0c\u4e3a\u4f55\u8fd9\u4e9b\u6df7\u5408\u72b6\u6001\u4f1a\u574d\u7f29\u3002\u4f5c\u8005\u4ece\u7406\u8bba\u548c\u53d7\u63a7\u5b9e\u9a8c\u53d1\u73b0\u4e09\u7c7b\u5931\u6548\u6765\u6e90\uff1aTransformer \u4e0e\u8bad\u7ec3\u4f1a\u626d\u66f2\u6df7\u5408\u51e0\u4f55\uff0csoftmax \u8bfb\u51fa\u548c\u81ea\u56de\u5f52\u53cd\u9988\u4f1a\u653e\u5927\u5dee\u5f02\u6216\u538b\u7f29\u6df7\u5408\uff0c\u591a\u6210\u5206\u6df7\u5408\u8fd8\u9700\u8981\u9ad8\u7ef4\u4e14\u4f9d\u8d56\u4e0a\u4e0b\u6587\u7684\u6821\u6b63\u3002\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u7406\u8bba\u9884\u6d4b\u7684\u6536\u7f29/\u653e\u5927\u8f6c\u53d8\u9608\u503c\uff0c\u8bf4\u660e\u9884\u8bad\u7ec3\u6a21\u578b\u901a\u5e38\u66f4\u5bb9\u6613\u8d70\u5411\u5355\u4e00\u6210\u5206\u4e3b\u5bfc\u7684\u574d\u7f29\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Harnessing naturally occurring feedback from user interactions offers a promising learning signal for Large Language Models (LLMs). However, recent studies suggest this feedback is inherently noisy and difficult to leverage effectively. We challenge this conception by demonstrating that user feedback is a highly actionable signal for improvement, and that its perceived ineffectiveness stems from a systematic bias in current evaluation paradigms. To isolate the usefulness of feedback, we construct synthetic data with a definitive ground truth, alongside naturalistic data to validate that our findings hold in real-world scenarios. By comparing model revisions generated with and without access to feedback across both settings, we show that feedback-informed revisions resolve targeted issues at significantly higher rates than baseline revisions. Finally, we expose the root of the evaluation bias: when a model successfully fixes an issue exclusively due to feedback, LLM judges frequently fail to identify the genuinely corrected response, systematically preferring inferior baseline outputs instead.", "arxiv_id": "2609.02859", "arxiv_url": "https://arxiv.org/abs/2609.02859", "authors": ["Shachar Don-Yehiya", "Leshem Choshen", "Omri Abend"], "brief": "\u8bba\u6587\u6311\u6218\u201c\u7528\u6237\u53cd\u9988\u566a\u58f0\u5927\u3001\u96be\u5229\u7528\u201d\u7684\u89c2\u70b9\uff0c\u6784\u9020\u6709\u771f\u503c\u7684\u5408\u6210\u6570\u636e\u5e76\u7ed3\u5408\u771f\u5b9e\u4ea4\u4e92\u6570\u636e\uff0c\u6bd4\u8f83\u6709\u65e0\u7528\u6237\u53cd\u9988\u65f6\u6a21\u578b\u4fee\u8ba2\u7684\u6548\u679c\u3002\u7ed3\u679c\u663e\u793a\uff0c\u7528\u6237\u53cd\u9988\u80fd\u663e\u8457\u63d0\u9ad8\u9488\u5bf9\u6027\u95ee\u9898\u4fee\u590d\u7387\uff1b\u73b0\u6709\u8bc4\u6d4b\u4f4e\u4f30\u5176\u4ef7\u503c\uff0c\u662f\u56e0\u4e3aLLM\u8bc4\u5ba1\u5e38\u65e0\u6cd5\u8bc6\u522b\u7531\u53cd\u9988\u5e26\u6765\u7684\u771f\u5b9e\u6539\u8fdb\uff0c\u53cd\u800c\u504f\u597d\u8f83\u5dee\u7684\u57fa\u7ebf\u8f93\u51fa\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02859", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7528\u6237\u53cd\u9988", "\u6a21\u578b\u8bc4\u6d4b", "\u504f\u597d\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02859v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "User Feedback Provides a Unique Signal that LLMs Can not Detect", "tldr": "\u8bba\u6587\u6311\u6218\u201c\u7528\u6237\u53cd\u9988\u566a\u58f0\u5927\u3001\u96be\u5229\u7528\u201d\u7684\u89c2\u70b9\uff0c\u6784\u9020\u6709\u771f\u503c\u7684\u5408\u6210\u6570\u636e\u5e76\u7ed3\u5408\u771f\u5b9e\u4ea4\u4e92\u6570\u636e\uff0c\u6bd4\u8f83\u6709\u65e0\u7528\u6237\u53cd\u9988\u65f6\u6a21\u578b\u4fee\u8ba2\u7684\u6548\u679c\u3002\u7ed3\u679c\u663e\u793a\uff0c\u7528\u6237\u53cd\u9988\u80fd\u663e\u8457\u63d0\u9ad8\u9488\u5bf9\u6027\u95ee\u9898\u4fee\u590d\u7387\uff1b\u73b0\u6709\u8bc4\u6d4b\u4f4e\u4f30\u5176\u4ef7\u503c\uff0c\u662f\u56e0\u4e3aLLM\u8bc4\u5ba1\u5e38\u65e0\u6cd5\u8bc6\u522b\u7531\u53cd\u9988\u5e26\u6765\u7684\u771f\u5b9e\u6539\u8fdb\uff0c\u53cd\u800c\u504f\u597d\u8f83\u5dee\u7684\u57fa\u7ebf\u8f93\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Transformers process information causally, but long-context reasoning may depend on task state discovered only later. We formalize this mismatch through conditional state update tasks. For causal state update processors, providing the condition first can require exponentially less memory in the worst case than providing it last. Motivated by this principle, we introduce Trace as State. We use collected reasoning traces as a textual proxy for task state and place it before the long-context block on a fresh pass, allowing information derived previously to guide rereading. We conduct extensive experiments on Trace as State and Trace Append, a matched control that uses the same task state proxy but put it after the context. Across three models and three long-context datasets, Trace as State outperforms Trace Append in 26 of 27 reported combinations of model, task, and metric. On GraphWalks Parents, exact match lifts DeepSeek V4 Pro Preview from 29.2% on the initial pass and 43.0% with Trace Appendto 81.8% with Trace as State, and from 66.4% and 83.2% to 100.0% for GLM-5.2. These results show that placing traces before the context can improve long-context reasoning while retaining the causal transformer structure.", "arxiv_id": "2609.02702", "arxiv_url": "https://arxiv.org/abs/2609.02702", "authors": ["Xu Zou", "Jie Tang"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cTrace as State\u201d\uff0c\u628a\u4e0a\u4e00\u8f6e\u751f\u6210\u7684\u63a8\u7406\u8f68\u8ff9\u4f5c\u4e3a\u4efb\u52a1\u72b6\u6001\u653e\u5728\u957f\u4e0a\u4e0b\u6587\u4e4b\u524d\uff0c\u8ba9\u56e0\u679c Transformer \u5728\u91cd\u8bfb\u4e0a\u4e0b\u6587\u65f6\u5148\u83b7\u5f97\u6761\u4ef6\u4fe1\u606f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u628a\u8f68\u8ff9\u8ffd\u52a0\u5728\u4e0a\u4e0b\u6587\u4e4b\u540e\u7684\u5bf9\u7167\u65b9\u6cd5\uff0c\u8be5\u65b9\u6cd5\u5728\u591a\u6570\u6a21\u578b\u3001\u4efb\u52a1\u548c\u6307\u6807\u4e0a\u663e\u8457\u66f4\u597d\uff0c\u90e8\u5206\u957f\u4e0a\u4e0b\u6587\u56fe\u63a8\u7406\u4efb\u52a1\u51c6\u786e\u7387\u5927\u5e45\u63d0\u5347\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02702", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u8f68\u8ff9", "Transformer", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02702v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Trace as State: Reasoning Traces as Conditional States for Long-Context Transformers", "tldr": "\u8bba\u6587\u63d0\u51fa\u201cTrace as State\u201d\uff0c\u628a\u4e0a\u4e00\u8f6e\u751f\u6210\u7684\u63a8\u7406\u8f68\u8ff9\u4f5c\u4e3a\u4efb\u52a1\u72b6\u6001\u653e\u5728\u957f\u4e0a\u4e0b\u6587\u4e4b\u524d\uff0c\u8ba9\u56e0\u679c Transformer \u5728\u91cd\u8bfb\u4e0a\u4e0b\u6587\u65f6\u5148\u83b7\u5f97\u6761\u4ef6\u4fe1\u606f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u628a\u8f68\u8ff9\u8ffd\u52a0\u5728\u4e0a\u4e0b\u6587\u4e4b\u540e\u7684\u5bf9\u7167\u65b9\u6cd5\uff0c\u8be5\u65b9\u6cd5\u5728\u591a\u6570\u6a21\u578b\u3001\u4efb\u52a1\u548c\u6307\u6807\u4e0a\u663e\u8457\u66f4\u597d\uff0c\u90e8\u5206\u957f\u4e0a\u4e0b\u6587\u56fe\u63a8\u7406\u4efb\u52a1\u51c6\u786e\u7387\u5927\u5e45\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in audio-language modeling have been driven by large-scale audio captioning datasets. However, existing datasets remain limited by low semantic diversity, generic descriptions lacking acoustic details, and one-to-one audio-caption mappings that poorly reflect the inherent ambiguity of auditory perception. We introduce SonicCaps, a large-scale audio captioning dataset comprising ~15M captions paired with ~700k audio clips, generated using a multi-modal large language model (Qwen3-Omni) conditioned on both audio and text. To explicitly promote diversity, we generate around 24 captions per audio via structured prompt engineering and few- shot generation, spanning main descriptions, rephrased variants (verbosity, style) and semantic tags. Human evaluation shows that SonicCaps is rated significantly higher than existing captioning datasets, with fine-grained analyses indicating that our captions are perceived as more descriptive and precise, which strongly correlates with quality judgments. Finally, training CLAP models on SonicCaps with a multi-caption sampling strategy consistently improves audio retrieval and zero-shot classification, with stronger generalization across public and commercial benchmarks. We release both SonicCaps and two specialized CLAP models on hugging face: https://huggingface.co/datasets/Zineb/SonicCaps.", "arxiv_id": "2609.02343", "arxiv_url": "https://arxiv.org/abs/2609.02343", "authors": ["Zineb Lahrichi", "Marc Ferras", "Ga\u00ebl Richard", "Geoffroy Peeters"], "brief": "\u672c\u6587\u63d0\u51fa SonicCaps\uff0c\u4e00\u4e2a\u5305\u542b\u7ea670\u4e07\u97f3\u9891\u4e0e1500\u4e07\u7ec6\u7c92\u5ea6\u5b57\u5e55\u7684\u5927\u89c4\u6a21\u97f3\u9891\u5b57\u5e55\u6570\u636e\u96c6\uff0c\u5229\u7528\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4e3a\u6bcf\u6bb5\u97f3\u9891\u751f\u6210\u591a\u6837\u5316\u63cf\u8ff0\u3001\u6539\u5199\u548c\u8bed\u4e49\u6807\u7b7e\u3002\u4eba\u5de5\u8bc4\u6d4b\u663e\u793a\u5176\u5b57\u5e55\u66f4\u5177\u4f53\u3001\u66f4\u51c6\u786e\uff1b\u7528\u5176\u8bad\u7ec3 CLAP \u53ef\u7a33\u5b9a\u63d0\u5347\u97f3\u9891\u68c0\u7d22\u548c\u96f6\u6837\u672c\u5206\u7c7b\uff0c\u5e76\u5728\u591a\u79cd\u57fa\u51c6\u4e0a\u6cdb\u5316\u66f4\u5f3a\u3002", "categories": ["cs.SD", "cs.CL", "cs.MM", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02343", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u6570\u636e\u96c6", "\u97f3\u9891\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02343v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SonicCaps: Large-Scale Diverse and Fine-Grained Captioning for Improved Audio-Retrieval", "tldr": "\u672c\u6587\u63d0\u51fa SonicCaps\uff0c\u4e00\u4e2a\u5305\u542b\u7ea670\u4e07\u97f3\u9891\u4e0e1500\u4e07\u7ec6\u7c92\u5ea6\u5b57\u5e55\u7684\u5927\u89c4\u6a21\u97f3\u9891\u5b57\u5e55\u6570\u636e\u96c6\uff0c\u5229\u7528\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4e3a\u6bcf\u6bb5\u97f3\u9891\u751f\u6210\u591a\u6837\u5316\u63cf\u8ff0\u3001\u6539\u5199\u548c\u8bed\u4e49\u6807\u7b7e\u3002\u4eba\u5de5\u8bc4\u6d4b\u663e\u793a\u5176\u5b57\u5e55\u66f4\u5177\u4f53\u3001\u66f4\u51c6\u786e\uff1b\u7528\u5176\u8bad\u7ec3 CLAP \u53ef\u7a33\u5b9a\u63d0\u5347\u97f3\u9891\u68c0\u7d22\u548c\u96f6\u6837\u672c\u5206\u7c7b\uff0c\u5e76\u5728\u591a\u79cd\u57fa\u51c6\u4e0a\u6cdb\u5316\u66f4\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world personally identifiable information (PII) redaction often operates on document images---scans, screenshots, and PDF renderings---where OCR errors, layout structure, and visual noise determine whether sensitive information is actually removed. Existing PII benchmarks are mostly text-centric and do not measure document-level redaction risk: a page remains unsafe if even one identifier is missed. We introduce LeakageBench, a challenge set of 500 document images with 11,954 GDPR-aligned PII annotations spanning direct identifiers, linkage keys, and contextual re-identification surfaces. We evaluate generic OCR pipelines, commercial and task-adapted OCR-dependent detectors, and OCR-free vision-language models using entity-level F1, group-wise leakage, and document-level leakage metrics. Code Interpreter raises GPT-5.5 localization F1 from 0.090 to 0.249, but critical page-level leakage remains 0.968. These results show that stronger detection and tool assistance improve localization without making most pages safe for release. LeakageBench provides a diagnostic benchmark for high-recall, spatially grounded PII redaction in document images.", "arxiv_id": "2609.02207", "arxiv_url": "https://arxiv.org/abs/2609.02207", "authors": ["Vishnu Prasad Vijaya Kumar", "Santhosh Venkatesh", "Ivan P. Yamshchikov"], "brief": "\u8bba\u6587\u63d0\u51fa LeakageBench\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u6863\u56fe\u50cf\u7684 PII \u8131\u654f\u6cc4\u6f0f\u98ce\u9669\u57fa\u51c6\uff0c\u5305\u542b500\u5f20\u6587\u6863\u56fe\u50cf\u548c\u8fd11.2\u4e07\u4e2a\u7b26\u5408 GDPR \u7684\u4e2a\u4eba\u4fe1\u606f\u6807\u6ce8\u3002\u8bc4\u6d4b\u663e\u793a\u5373\u4f7f\u5de5\u5177\u8f85\u52a9\u80fd\u63d0\u5347\u5b9a\u4f4d F1\uff0c\u591a\u6570\u9875\u9762\u4ecd\u5b58\u5728\u4e25\u91cd\u6cc4\u6f0f\u98ce\u9669\uff0c\u8bf4\u660e\u5f53\u524d OCR/\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8ddd\u79bb\u5b89\u5168\u53d1\u5e03\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02207", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9690\u79c1\u4fdd\u62a4", "\u6587\u6863\u7406\u89e3", "OCR", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02207v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LeakageBench: Document-Level Leakage Risk for Redacting Personally Identifiable Information in Document Images", "tldr": "\u8bba\u6587\u63d0\u51fa LeakageBench\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u6863\u56fe\u50cf\u7684 PII \u8131\u654f\u6cc4\u6f0f\u98ce\u9669\u57fa\u51c6\uff0c\u5305\u542b500\u5f20\u6587\u6863\u56fe\u50cf\u548c\u8fd11.2\u4e07\u4e2a\u7b26\u5408 GDPR \u7684\u4e2a\u4eba\u4fe1\u606f\u6807\u6ce8\u3002\u8bc4\u6d4b\u663e\u793a\u5373\u4f7f\u5de5\u5177\u8f85\u52a9\u80fd\u63d0\u5347\u5b9a\u4f4d F1\uff0c\u591a\u6570\u9875\u9762\u4ecd\u5b58\u5728\u4e25\u91cd\u6cc4\u6f0f\u98ce\u9669\uff0c\u8bf4\u660e\u5f53\u524d OCR/\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8ddd\u79bb\u5b89\u5168\u53d1\u5e03\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific knowledge graphs organize entities and relations extracted from scientific literature, but they remain inherently incomplete. Missing typed links in such graphs can therefore represent plausible scientific hypotheses, such as unexplored associations between materials and applications. However, scientific hypothesis discovery is challenging because true discoveries are extremely sparse among typed candidate pairs: graph neural networks (GNNs) are efficient but unreliable for ambiguous cases, while large language models (LLMs) are knowledgeable but too costly to apply exhaustively and are not naturally grounded in graph structures. We propose HyGRAIL, a cost-aware and evidence-grounded framework that combines heterogeneous GNN triage with LLM-based hypothesis review. HyGRAIL first uses a GNN to score candidate hypotheses and identify a validation-calibrated ambiguous region, routing only graph-uncertain cases to LLM review. For each routed hypothesis, HyGRAIL retrieves node-level associations and multi-hop relational paths from the knowledge graph (KG), then converts this structured evidence into natural language through template-based or LLM-based naturalization. An LLM review agent finally judges each hard hypothesis using the naturalized evidence and validation-selected decision criteria. On MatKG, HyGRAIL achieves the best F1 score of 0.429, improving over the strongest prior baseline by 0.242 F1 points and over the GNN-only baseline by 0.322. Meanwhile, GNN triage reduces the LLM call rate by 54.36% on average. Ablation studies further show that retrieved graph evidence is crucial for reliable hypothesis verification and that compact, two-sided evidence is more effective than simply increasing retrieval quantity.", "arxiv_id": "2609.02056", "arxiv_url": "https://arxiv.org/abs/2609.02056", "authors": ["Yihang Sun", "Zhihan Zhu", "Zhiyuan Jiang", "Jingyi Ge", "Zixuan Li", "Jiaxuan You"], "brief": "HyGRAIL \u5c06\u5f02\u6784\u56fe\u795e\u7ecf\u7f51\u7edc\u7b5b\u9009\u4e0e\u5927\u8bed\u8a00\u6a21\u578b\u8bc1\u636e\u5ba1\u67e5\u7ed3\u5408\uff0c\u7528\u77e5\u8bc6\u56fe\u8c31\u4e2d\u7684\u8282\u70b9\u5173\u8054\u548c\u591a\u8df3\u8def\u5f84\u4e3a\u79d1\u5b66\u5047\u8bbe\u9a8c\u8bc1\u63d0\u4f9b\u4f9d\u636e\u3002\u5b83\u5728 MatKG \u4e0a\u53d6\u5f97\u6700\u4f73 F1=0.429\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 0.242\uff0c\u540c\u65f6\u5e73\u5747\u51cf\u5c11 54.36% \u7684 LLM \u8c03\u7528\u6210\u672c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02056", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u5927\u8bed\u8a00\u6a21\u578b", "\u79d1\u5b66\u53d1\u73b0", "\u56fe\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02056v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HyGRAIL: Cost-Aware and Evidence-Grounded Scientific Hypothesis Discovery over Knowledge Graphs", "tldr": "HyGRAIL \u5c06\u5f02\u6784\u56fe\u795e\u7ecf\u7f51\u7edc\u7b5b\u9009\u4e0e\u5927\u8bed\u8a00\u6a21\u578b\u8bc1\u636e\u5ba1\u67e5\u7ed3\u5408\uff0c\u7528\u77e5\u8bc6\u56fe\u8c31\u4e2d\u7684\u8282\u70b9\u5173\u8054\u548c\u591a\u8df3\u8def\u5f84\u4e3a\u79d1\u5b66\u5047\u8bbe\u9a8c\u8bc1\u63d0\u4f9b\u4f9d\u636e\u3002\u5b83\u5728 MatKG \u4e0a\u53d6\u5f97\u6700\u4f73 F1=0.429\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 0.242\uff0c\u540c\u65f6\u5e73\u5747\u51cf\u5c11 54.36% \u7684 LLM \u8c03\u7528\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Instruction-tuning data are judged by quality metrics, and tuned models are judged by benchmarks, but both judgments pass through an output interface: the surface format in which an answer is written. Using gradient signatures across 12 tasks, four semantically equivalent interfaces, three model families, and controlled corruptions, we show that this interface confounds both measurements. Spectral statistics such as effective rank are provably invariant to interface rotation and empirically blind to semantic corruption, while the direction of the update carries the quality signal. The interface-varying residual is not noise: it identifies each unit\u0027s own target task perfectly across all three families. Capability itself is stored relative to the training interface: a skill that raises accuracy by more than 40 points under the training format can be nearly invisible under every other, and correcting a single generation budget flips the measured effect of fine-tuning on GSM8K from a gain into a large loss. Pre-registered interventions delimit where this geometry stops short of control. Data quality and model capability are interface-conditioned quantities, and current practice often reports the interface instead of the content.", "arxiv_id": "2609.02015", "arxiv_url": "https://arxiv.org/abs/2609.02015", "authors": ["Chengguang Gan", "Hanjun Wei", "Yunhao Liang", "Qinghao Zhang", "Shiwen Ni", "Zhixi Cai"], "brief": "\u8bba\u6587\u6307\u51fa\u6307\u4ee4\u5fae\u8c03\u4e2d\u7684\u6570\u636e\u8d28\u91cf\u8bc4\u4f30\u548c\u80fd\u529b\u8bc4\u6d4b\u90fd\u4f1a\u88ab\u7b54\u6848\u7684\u8868\u9762\u8f93\u51fa\u683c\u5f0f\u663e\u8457\u6df7\u6dc6\u3002\u901a\u8fc7\u591a\u4efb\u52a1\u3001\u591a\u63a5\u53e3\u548c\u591a\u6a21\u578b\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8bed\u4e49\u7b49\u4ef7\u7684\u683c\u5f0f\u4f1a\u6539\u53d8\u68af\u5ea6\u65b9\u5411\u4e0e\u80fd\u529b\u663e\u73b0\uff0c\u751a\u81f3\u8ba9\u5fae\u8c03\u6548\u679c\u4ece\u63d0\u5347\u53d8\u6210\u5927\u5e45\u4e0b\u964d\uff0c\u8bf4\u660e\u5f53\u524d\u8bc4\u6d4b\u53ef\u80fd\u6d4b\u5230\u7684\u662f\u63a5\u53e3\u800c\u975e\u5185\u5bb9\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02015", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6307\u4ee4\u5fae\u8c03", "\u6570\u636e\u8d28\u91cf", "\u6a21\u578b\u8bc4\u6d4b", "\u8f93\u51fa\u683c\u5f0f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02015v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Output Format Confounds Data Quality and Capability in Instruction Tuning", "tldr": "\u8bba\u6587\u6307\u51fa\u6307\u4ee4\u5fae\u8c03\u4e2d\u7684\u6570\u636e\u8d28\u91cf\u8bc4\u4f30\u548c\u80fd\u529b\u8bc4\u6d4b\u90fd\u4f1a\u88ab\u7b54\u6848\u7684\u8868\u9762\u8f93\u51fa\u683c\u5f0f\u663e\u8457\u6df7\u6dc6\u3002\u901a\u8fc7\u591a\u4efb\u52a1\u3001\u591a\u63a5\u53e3\u548c\u591a\u6a21\u578b\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8bed\u4e49\u7b49\u4ef7\u7684\u683c\u5f0f\u4f1a\u6539\u53d8\u68af\u5ea6\u65b9\u5411\u4e0e\u80fd\u529b\u663e\u73b0\uff0c\u751a\u81f3\u8ba9\u5fae\u8c03\u6548\u679c\u4ece\u63d0\u5347\u53d8\u6210\u5927\u5e45\u4e0b\u964d\uff0c\u8bf4\u660e\u5f53\u524d\u8bc4\u6d4b\u53ef\u80fd\u6d4b\u5230\u7684\u662f\u63a5\u53e3\u800c\u975e\u5185\u5bb9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advancements in unified generative models (UGMs) and world simulators have achieved unprecedented results in visual perception and synthesis. However, these models primarily rely on surface-level event alignment, leaving the capacity for high-level visual reasoning underexplored. True visual generative intelligence demands \"Reasoning-to-Generation\", an ability to infer latent rules from visual inputs and manifest solutions through precise, logically constrained visual outcomes. We introduce RIG-BENCH, a novel comprehensive benchmark that systematically evaluates Reasoning-driven Image Generation (RIG) across four cognitively demanding domains: Concept-based, Transformation-based, Pattern \u0026 Structure, and Scenario-based. Featuring 2000 curated samples, RIG-BENCH serves as a rigorous stress test for RIG. Our extensive evaluations of state-of-the-art UGMs and image/video generation models reveal a significant reasoning-generation gap, wherein models frequently produce locally plausible but globally illogical outputs. RIG-BENCH provides a vital diagnostic framework to guide the development of next-generation, logically grounded UGMs and world simulators.", "arxiv_id": "2609.02864", "arxiv_url": "https://arxiv.org/abs/2609.02864", "authors": ["Yutong Liu", "Nan Huang", "Xu Cao", "James M. Rehg"], "brief": "\u8bba\u6587\u63d0\u51fa RIG-BENCH\uff0c\u4e00\u4e2a\u9762\u5411\u201c\u63a8\u7406\u9a71\u52a8\u56fe\u50cf\u751f\u6210\u201d\u7684\u7cfb\u7edf\u57fa\u51c6\uff0c\u5305\u542b2000\u4e2a\u6837\u672c\uff0c\u8986\u76d6\u6982\u5ff5\u3001\u53d8\u6362\u3001\u6a21\u5f0f\u7ed3\u6784\u548c\u573a\u666f\u56db\u7c7b\u9ad8\u8ba4\u77e5\u4efb\u52a1\u3002\u5bf9\u73b0\u6709\u7edf\u4e00\u751f\u6210\u6a21\u578b\u548c\u56fe\u50cf/\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u5b83\u4eec\u5e38\u751f\u6210\u5c40\u90e8\u5408\u7406\u4f46\u5168\u5c40\u903b\u8f91\u9519\u8bef\u7684\u7ed3\u679c\uff0c\u66b4\u9732\u51fa\u660e\u663e\u7684\u63a8\u7406-\u751f\u6210\u80fd\u529b\u5dee\u8ddd\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02864", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u89c6\u89c9\u63a8\u7406", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02864v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Thinking in Pictures: A Systematic Benchmark for Reasoning-driven Image Generation", "tldr": "\u8bba\u6587\u63d0\u51fa RIG-BENCH\uff0c\u4e00\u4e2a\u9762\u5411\u201c\u63a8\u7406\u9a71\u52a8\u56fe\u50cf\u751f\u6210\u201d\u7684\u7cfb\u7edf\u57fa\u51c6\uff0c\u5305\u542b2000\u4e2a\u6837\u672c\uff0c\u8986\u76d6\u6982\u5ff5\u3001\u53d8\u6362\u3001\u6a21\u5f0f\u7ed3\u6784\u548c\u573a\u666f\u56db\u7c7b\u9ad8\u8ba4\u77e5\u4efb\u52a1\u3002\u5bf9\u73b0\u6709\u7edf\u4e00\u751f\u6210\u6a21\u578b\u548c\u56fe\u50cf/\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u5b83\u4eec\u5e38\u751f\u6210\u5c40\u90e8\u5408\u7406\u4f46\u5168\u5c40\u903b\u8f91\u9519\u8bef\u7684\u7ed3\u679c\uff0c\u66b4\u9732\u51fa\u660e\u663e\u7684\u63a8\u7406-\u751f\u6210\u80fd\u529b\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Current evaluations and training of multimodal models predominantly focus on multi-image tasks, largely overlooking interleaved text-image scenarios. In such multi-image tasks, text typically serves merely as task instructions, lacking deep semantic interaction with the visual content. In contrast, realworld applications like text-image co-creation, character tracking, and spatial reconstruction require constant interaction between text and images. Consequently, models must possess a deep understanding of these interleaved contexts. To bridge this gap, we introduce a novel benchmark, TIC-Bench (deeply interleaved Text-Image Contexts), designed to evaluate the capability of models to integrate text-image clues and recover the ground truth facts within deeply interleaved contexts. This benchmark encompasses three core domains: Logical, Temporal, and Spatial Association, which are further categorized into eight specific types, comprising a total of 2,280 questions. We evaluated 10 state-of-the-art MLLMs and observed a substantial performance gap compared to human experts, together with persistent difficulties in integrating evidence distributed across interleaved visual and textual inputs. Ultimately, this benchmark provides a valuable analytical tool for assessing and advancing the ability of multimodal models to effectively integrate text and image information in deeply interleaved contexts. TIC-Bench is publicly available at https://huggingface.co/datasets/pino10010/TIC-Bench", "arxiv_id": "2609.02573", "arxiv_url": "https://arxiv.org/abs/2609.02573", "authors": ["Zihao Wang", "Xi Xiang", "Yuwen Sun", "Yingyu Li", "Yabo Zhang", "Yihan Zeng", "Fan Li", "Wangmeng Zuo"], "brief": "\u8bba\u6587\u63d0\u51fa TIC-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u6df1\u5ea6\u4ea4\u9519\u7684\u6587\u672c-\u56fe\u50cf\u4e0a\u4e0b\u6587\u4e2d\u6574\u5408\u7ebf\u7d22\u3001\u8fd8\u539f\u4e8b\u5b9e\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6\u903b\u8f91\u3001\u65f6\u95f4\u3001\u7a7a\u95f4\u5173\u8054\u4e09\u5927\u9886\u57df\u5171 2280 \u4e2a\u95ee\u9898\uff0c\u8bc4\u6d4b\u663e\u793a 10 \u4e2a\u4e3b\u6d41\u6a21\u578b\u4e0e\u4eba\u7c7b\u4e13\u5bb6\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\uff0c\u5c24\u5176\u96be\u4ee5\u878d\u5408\u5206\u6563\u5728\u6587\u672c\u548c\u56fe\u50cf\u4e2d\u7684\u8bc1\u636e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02573", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u6587\u672c\u56fe\u50cf\u7406\u89e3", "\u57fa\u51c6\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02573v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Deeply Interleaved Text-Image Contexts for Multimodal LLMs Assessment", "tldr": "\u8bba\u6587\u63d0\u51fa TIC-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u6df1\u5ea6\u4ea4\u9519\u7684\u6587\u672c-\u56fe\u50cf\u4e0a\u4e0b\u6587\u4e2d\u6574\u5408\u7ebf\u7d22\u3001\u8fd8\u539f\u4e8b\u5b9e\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6\u903b\u8f91\u3001\u65f6\u95f4\u3001\u7a7a\u95f4\u5173\u8054\u4e09\u5927\u9886\u57df\u5171 2280 \u4e2a\u95ee\u9898\uff0c\u8bc4\u6d4b\u663e\u793a 10 \u4e2a\u4e3b\u6d41\u6a21\u578b\u4e0e\u4eba\u7c7b\u4e13\u5bb6\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\uff0c\u5c24\u5176\u96be\u4ee5\u878d\u5408\u5206\u6563\u5728\u6587\u672c\u548c\u56fe\u50cf\u4e2d\u7684\u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) leverage the capabilities of large-scale pretrained video diffusion models to jointly predict future observations and actions, inheriting rich visual and physical priors from internet-scale video. This has made them a promising paradigm for robot policy learning, yet the prevailing models operate exclusively on RGB observations and do not leverage 3D information. To bridge this gap, we introduce a Spatially Aware World Action Model (SA-WAM), which repurposes a pretrained video model for joint action, RGB, and depth prediction, enabling 3D-aware world modeling and action prediction within a single diffusion backbone. We use a nonlinear encoding that maps the unbounded depth signal into the bounded input domain expected by the frozen VAE tokenizer. This allows us to reuse the tokenizer without 3D-specific fine-tuning, incorporating geometric information without sacrificing the pretrained priors. SA-WAM achieves state-of-the-art results on the RoboCasa and LIBERO-Plus benchmarks, while simultaneously improving future-state predictions. Furthermore, SA-WAM outperforms strong baselines in real-world evaluation using a UR5 robotic arm, with strong gains in randomized environments. We analyze the correlation between world model prediction quality and rollout success, providing insights into WAM performance and avenues for its improvement.", "arxiv_id": "2609.02531", "arxiv_url": "https://arxiv.org/abs/2609.02531", "authors": ["Javier Alejandro Lopetegui Gonzalez", "Paul Pacaud", "Cordelia Schmid"], "brief": "\u63d0\u51fa\u7a7a\u95f4\u611f\u77e5\u4e16\u754c\u52a8\u4f5c\u6a21\u578b SA-WAM\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u6269\u5c55\u4e3a\u540c\u65f6\u9884\u6d4b\u52a8\u4f5c\u3001RGB \u4e0e\u6df1\u5ea6\uff0c\u4ece\u800c\u5728\u540c\u4e00\u6269\u6563\u9aa8\u5e72\u4e2d\u5f15\u5165 3D \u51e0\u4f55\u611f\u77e5\u3002\u901a\u8fc7\u975e\u7ebf\u6027\u6df1\u5ea6\u7f16\u7801\u590d\u7528\u51bb\u7ed3\u7684 VAE tokenizer\uff0c\u5728 RoboCasa\u3001LIBERO-Plus \u548c\u771f\u5b9e UR5 \u673a\u68b0\u81c2\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u672a\u6765\u72b6\u6001\u9884\u6d4b\u8d28\u91cf\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02531", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u6269\u6563\u6a21\u578b", "\u4e16\u754c\u6a21\u578b", "\u4e09\u7ef4\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02531v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Spatially Aware World Action Model via Geometric Latent Diffusion", "tldr": "\u63d0\u51fa\u7a7a\u95f4\u611f\u77e5\u4e16\u754c\u52a8\u4f5c\u6a21\u578b SA-WAM\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u6269\u6563\u6a21\u578b\u6269\u5c55\u4e3a\u540c\u65f6\u9884\u6d4b\u52a8\u4f5c\u3001RGB \u4e0e\u6df1\u5ea6\uff0c\u4ece\u800c\u5728\u540c\u4e00\u6269\u6563\u9aa8\u5e72\u4e2d\u5f15\u5165 3D \u51e0\u4f55\u611f\u77e5\u3002\u901a\u8fc7\u975e\u7ebf\u6027\u6df1\u5ea6\u7f16\u7801\u590d\u7528\u51bb\u7ed3\u7684 VAE tokenizer\uff0c\u5728 RoboCasa\u3001LIBERO-Plus \u548c\u771f\u5b9e UR5 \u673a\u68b0\u81c2\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u63d0\u5347\u672a\u6765\u72b6\u6001\u9884\u6d4b\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual grounding maps language referents to spatial targets and is central to open-vocabulary perception with vision-language models. Existing methods have made substantial progress on single-frame and video-based visual grounding, yet under streaming inputs they still suffer from identity drift, cross-frame inconsistency, and fragile localization under partial occlusion. To address these issues, we present TempoGround, a VLM-native framework that detects cross-frame object correspondence and explicitly models object presence states, thereby enabling accurate and consistent visual grounding under streaming inputs. The key is a curriculum prediction mechanism guided by state-aware cross-frame correspondence: TempoGround resolves 2D instance association, predicts whether each object newly enters, continues in, or leaves the view, decodes the 2D box, and then lifts it to a camera-frame 3D box. As token-level supervision alone cannot capture the geometric objectives of streaming grounding, we further introduce Streaming Grounding Reinforcement (SGR), which optimizes TempoGround with verifiable Grounding, Identity, and Consistency rewards, jointly reinforcing persistent localization and temporally consistent predictions. We carefully design a three-stage training strategy and train TempoGround on large-scale data. We evaluate visual grounding under causally streaming inputs on multiple challenging benchmarks: TempoGround improves F1_2D@0.5 and F1_2D@0.95 by 4.4 and 0.5 on average, and F1_3D@0.25 and AP_3D by 6.2 and 7.5, respectively. These results demonstrate that TempoGround provides a practical foundation for visual grounding under streaming inputs.", "arxiv_id": "2609.02359", "arxiv_url": "https://arxiv.org/abs/2609.02359", "authors": ["Leqian Ding", "Junning Qiu", "Manwen Yang", "Yu Guo", "Fei Wang"], "brief": "TempoGround \u9762\u5411\u6d41\u5f0f\u8f93\u5165\u7684\u89c6\u89c9\u5b9a\u4f4d\u4efb\u52a1\uff0c\u5229\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u8de8\u5e27\u76ee\u6807\u5bf9\u5e94\u5efa\u6a21\uff0c\u5e76\u663e\u5f0f\u9884\u6d4b\u76ee\u6807\u8fdb\u5165\u3001\u6301\u7eed\u5b58\u5728\u6216\u79bb\u5f00\u7b49\u72b6\u6001\uff0c\u4ee5\u7f13\u89e3\u8eab\u4efd\u6f02\u79fb\u3001\u8de8\u5e27\u4e0d\u4e00\u81f4\u548c\u906e\u6321\u4e0b\u5b9a\u4f4d\u4e0d\u7a33\u7684\u95ee\u9898\u3002\u8bba\u6587\u8fd8\u63d0\u51fa Streaming Grounding Reinforcement\uff0c\u901a\u8fc7\u53ef\u9a8c\u8bc1\u7684\u5b9a\u4f4d\u3001\u8eab\u4efd\u548c\u4e00\u81f4\u6027\u5956\u52b1\u5f3a\u5316\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347 2D/3D \u6d41\u5f0f\u89c6\u89c9\u5b9a\u4f4d\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02359", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u5b9a\u4f4d", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u65f6\u5e8f\u5efa\u6a21", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02359v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TempoGround: State-Aware Streaming Visual Grounding with Vision-Language Models", "tldr": "TempoGround \u9762\u5411\u6d41\u5f0f\u8f93\u5165\u7684\u89c6\u89c9\u5b9a\u4f4d\u4efb\u52a1\uff0c\u5229\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u8de8\u5e27\u76ee\u6807\u5bf9\u5e94\u5efa\u6a21\uff0c\u5e76\u663e\u5f0f\u9884\u6d4b\u76ee\u6807\u8fdb\u5165\u3001\u6301\u7eed\u5b58\u5728\u6216\u79bb\u5f00\u7b49\u72b6\u6001\uff0c\u4ee5\u7f13\u89e3\u8eab\u4efd\u6f02\u79fb\u3001\u8de8\u5e27\u4e0d\u4e00\u81f4\u548c\u906e\u6321\u4e0b\u5b9a\u4f4d\u4e0d\u7a33\u7684\u95ee\u9898\u3002\u8bba\u6587\u8fd8\u63d0\u51fa Streaming Grounding Reinforcement\uff0c\u901a\u8fc7\u53ef\u9a8c\u8bc1\u7684\u5b9a\u4f4d\u3001\u8eab\u4efd\u548c\u4e00\u81f4\u6027\u5956\u52b1\u5f3a\u5316\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347 2D/3D \u6d41\u5f0f\u89c6\u89c9\u5b9a\u4f4d\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language Navigation (VLN) requires an embodied agent to follow natural-language instructions in unseen environments. Recent progress has been largely driven by Multimodal Large Language Models (MLLMs). Existing methods follow a next-step action prediction paradigm, supervising only the expert action, which requires a high quantity of data for training. They also rely on cognitive maps, accumulated historical frames, or external 3D tools to maintain states, leading to high computational and memory overhead. To realize resource efficiency VLN, we propose LookStep, a unified end-to-end framework that combines Language Centric Future State Modeling and Event Driven Rolling Memory that uses language labels to generate coarse-grained navigation progress and future states for each candidate action, while autonomously deciding whether to write each observation into a bounded rolling memory with a semantic role. We validate LookStep empirically. On VLN-CE tasks, LookStep outperforms existing methods under the same training settings, achieving a 49.7\\% success rate on R2R-CE Val-Unseen with better memory efficiency and less data usage. Code and model is available at https://github.com/kunyang-YU/LookStep.", "arxiv_id": "2609.02350", "arxiv_url": "https://arxiv.org/abs/2609.02350", "authors": ["Kun-Yang Yu", "Yingzhe Li", "Hongyu Xu", "Shi-Yu Tian", "Zhi Zhou", "Yang Chen", "Ming Yang", "Sheng Wang", "Qing Yu", "Lan-Zhe Guo", "Yu-Feng Li"], "brief": "LookStep \u9762\u5411\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\uff0c\u63d0\u51fa\u8bed\u8a00\u4e2d\u5fc3\u7684\u672a\u6765\u72b6\u6001\u5efa\u6a21\u548c\u4e8b\u4ef6\u9a71\u52a8\u6eda\u52a8\u8bb0\u5fc6\uff0c\u8ba9\u667a\u80fd\u4f53\u9884\u6d4b\u5019\u9009\u52a8\u4f5c\u7684\u5bfc\u822a\u8fdb\u5c55\u5e76\u6309\u9700\u5199\u5165\u8bed\u4e49\u8bb0\u5fc6\u3002\u5b83\u5728 VLN-CE \u4e0a\u4f18\u4e8e\u540c\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u7684\u5df2\u6709\u65b9\u6cd5\uff0c\u5728 R2R-CE Val-Unseen \u8fbe\u5230 49.7% \u6210\u529f\u7387\uff0c\u540c\u65f6\u964d\u4f4e\u8bb0\u5fc6\u5f00\u9500\u548c\u6570\u636e\u9700\u6c42\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02350", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u591a\u6a21\u6001", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02350v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LookStep: Efficient Vision-Language Navigation with Linguistic Foresight and Event Driven Memory", "tldr": "LookStep \u9762\u5411\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\uff0c\u63d0\u51fa\u8bed\u8a00\u4e2d\u5fc3\u7684\u672a\u6765\u72b6\u6001\u5efa\u6a21\u548c\u4e8b\u4ef6\u9a71\u52a8\u6eda\u52a8\u8bb0\u5fc6\uff0c\u8ba9\u667a\u80fd\u4f53\u9884\u6d4b\u5019\u9009\u52a8\u4f5c\u7684\u5bfc\u822a\u8fdb\u5c55\u5e76\u6309\u9700\u5199\u5165\u8bed\u4e49\u8bb0\u5fc6\u3002\u5b83\u5728 VLN-CE \u4e0a\u4f18\u4e8e\u540c\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u7684\u5df2\u6709\u65b9\u6cd5\uff0c\u5728 R2R-CE Val-Unseen \u8fbe\u5230 49.7% \u6210\u529f\u7387\uff0c\u540c\u65f6\u964d\u4f4e\u8bb0\u5fc6\u5f00\u9500\u548c\u6570\u636e\u9700\u6c42\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Rendering accurate text remains difficult for image generation and editing models, especially when the target contains long, complex, and densely arranged text or rare characters. Existing approaches either improve native text rendering through stronger backbones and data-centric training without explicit glyph priors, or incorporate glyph priors through specialized designs that remain insufficiently accurate and robust under challenging scenarios. We introduce GlyphAnchor, a novel text-rendering enhancement method for both text-to-image and image-editing diffusion transformer models. GlyphAnchor enhances the backbone with lightweight glyph patch conditions whose positions are anchored to the target image through the model\u0027s native positional encoding. We train this capability with staged supervised finetuning and further refine it with text-aware post-training to improve robustness. We also introduce InfoTextBench, a benchmark for evaluating text-rich visual text rendering in both generation and editing settings. Experiments across multiple backbones and benchmarks, including long, complex, and densely arranged text and rare character scenarios, show that GlyphAnchor consistently improves text fidelity while preserving overall image quality.", "arxiv_id": "2609.02349", "arxiv_url": "https://arxiv.org/abs/2609.02349", "authors": ["Qiang Xiang", "Shuang Sun", "Binglei Li", "Yibo Chen", "Xu Tang", "Yao Hu", "Junping Zhang"], "brief": "GlyphAnchor \u4e3a\u6587\u751f\u56fe\u548c\u56fe\u50cf\u7f16\u8f91\u6269\u6563 Transformer \u5f15\u5165\u4f4d\u7f6e\u951a\u5b9a\u7684\u8f7b\u91cf\u5b57\u5f62\u5148\u9a8c\uff0c\u901a\u8fc7\u539f\u751f\u4f4d\u7f6e\u7f16\u7801\u5bf9\u9f50\u76ee\u6807\u56fe\u50cf\u4f4d\u7f6e\uff0c\u5e76\u7ed3\u5408\u5206\u9636\u6bb5\u5fae\u8c03\u4e0e\u6587\u672c\u611f\u77e5\u540e\u8bad\u7ec3\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u957f\u6587\u672c\u3001\u5bc6\u96c6\u6587\u672c\u3001\u590d\u6742\u6392\u7248\u548c\u7f55\u89c1\u5b57\u7b26\u573a\u666f\u4e2d\u63d0\u5347\u6587\u5b57\u51c6\u786e\u6027\uff0c\u540c\u65f6\u4fdd\u6301\u56fe\u50cf\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02349", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6587\u5b57\u6e32\u67d3", "\u56fe\u50cf\u751f\u6210", "\u56fe\u50cf\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02349v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GlyphAnchor: Enhancing Visual Text Rendering via Position-Anchored Glyph Priors", "tldr": "GlyphAnchor \u4e3a\u6587\u751f\u56fe\u548c\u56fe\u50cf\u7f16\u8f91\u6269\u6563 Transformer \u5f15\u5165\u4f4d\u7f6e\u951a\u5b9a\u7684\u8f7b\u91cf\u5b57\u5f62\u5148\u9a8c\uff0c\u901a\u8fc7\u539f\u751f\u4f4d\u7f6e\u7f16\u7801\u5bf9\u9f50\u76ee\u6807\u56fe\u50cf\u4f4d\u7f6e\uff0c\u5e76\u7ed3\u5408\u5206\u9636\u6bb5\u5fae\u8c03\u4e0e\u6587\u672c\u611f\u77e5\u540e\u8bad\u7ec3\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u957f\u6587\u672c\u3001\u5bc6\u96c6\u6587\u672c\u3001\u590d\u6742\u6392\u7248\u548c\u7f55\u89c1\u5b57\u7b26\u573a\u666f\u4e2d\u63d0\u5347\u6587\u5b57\u51c6\u786e\u6027\uff0c\u540c\u65f6\u4fdd\u6301\u56fe\u50cf\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action models (VLAs) have shown strong potential in autonomous driving by leveraging multimodal pretraining for instruction following, visual reasoning, and scene-level generalization. In robotic manipulation, scaling VLA fine-tuning across multiple robot setups--especially when unifying representations across embodiments--has been shown to improve in-dataset performance and cross-embodiment generalization; in autonomous driving, however, VLAs remain largely trained on individual datasets and are rarely evaluated for zero-shot transfer to unseen datasets and camera rigs; furthermore naively adding more datasets to the training data does not necessarily lead to better performance within seen embodiments. To address these problems, we study multi-dataset training for the driving task and BEV-Forcing, an auxiliary objective that transfers ground-plane object-layout information from a specialized Bird\u0027s-Eye-View model into the VLA backbone. By encouraging the model to represent object position through a shared BEV spatial interface, we show that an auxiliary task such as BEV-Forcing can improve both in-distribution and out-of-distribution performance when training on a small number of camera rigs. As the number of training embodiments increases, however, the benefits of the auxiliary task are reduced; we present this as evidence that new techniques in the literature may see their benefits diminish when simply scaling up training diversity, which motivates presenting results taking into account data scaling.", "arxiv_id": "2609.02341", "arxiv_url": "https://arxiv.org/abs/2609.02341", "authors": ["Caio Azevedo", "Stefano Sabatini", "Sascha Hornauer", "Fabien Moutarde"], "brief": "\u672c\u6587\u7814\u7a76\u81ea\u52a8\u9a7e\u9a76\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\u5728\u4e0d\u540c\u6570\u636e\u96c6\u548c\u76f8\u673a\u914d\u7f6e\u95f4\u7684\u96f6\u6837\u672c\u8fc1\u79fb\uff0c\u63d0\u51fa BEV-Forcing \u8f85\u52a9\u76ee\u6807\uff0c\u5c06\u9e1f\u77b0\u56fe\u7269\u4f53\u5e03\u5c40\u77e5\u8bc6\u6ce8\u5165 VLA \u8868\u5f81\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u8bad\u7ec3\u76f8\u673a\u914d\u7f6e\u8f83\u5c11\u65f6\u53ef\u63d0\u5347\u5206\u5e03\u5185\u548c\u5206\u5e03\u5916\u8868\u73b0\uff0c\u4f46\u968f\u7740\u8bad\u7ec3\u5177\u8eab/\u76f8\u673a\u591a\u6837\u6027\u589e\u52a0\uff0c\u8be5\u8f85\u52a9\u4efb\u52a1\u6536\u76ca\u4f1a\u51cf\u5f31\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02341", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u96f6\u6837\u672c\u8fc1\u79fb", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02341v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Zero-Shot Transfer Across Embodiments For Driving VLAs", "tldr": "\u672c\u6587\u7814\u7a76\u81ea\u52a8\u9a7e\u9a76\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\u5728\u4e0d\u540c\u6570\u636e\u96c6\u548c\u76f8\u673a\u914d\u7f6e\u95f4\u7684\u96f6\u6837\u672c\u8fc1\u79fb\uff0c\u63d0\u51fa BEV-Forcing \u8f85\u52a9\u76ee\u6807\uff0c\u5c06\u9e1f\u77b0\u56fe\u7269\u4f53\u5e03\u5c40\u77e5\u8bc6\u6ce8\u5165 VLA \u8868\u5f81\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u8bad\u7ec3\u76f8\u673a\u914d\u7f6e\u8f83\u5c11\u65f6\u53ef\u63d0\u5347\u5206\u5e03\u5185\u548c\u5206\u5e03\u5916\u8868\u73b0\uff0c\u4f46\u968f\u7740\u8bad\u7ec3\u5177\u8eab/\u76f8\u673a\u591a\u6837\u6027\u589e\u52a0\uff0c\u8be5\u8f85\u52a9\u4efb\u52a1\u6536\u76ca\u4f1a\u51cf\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent text-to-image models have become increasingly capable of rendering explicit text, but reliable localized text control requires more than generating the correct string. In applications such as product labeling, signage, and interface design, target text should be rendered within a designated text-bearing region without altering the predefined subject identity or surrounding scene semantics. We refer to violations of this requirement as target-text-associated semantic leakage, in which target-text semantics are expressed through non-textual visual content beyond the designated anchor. Existing visual-text benchmarks primarily evaluate readability, spelling accuracy, and layout, leaving this form of semantic leakage largely unexamined. We introduce T2LSC-Bench, a controlled diagnostic benchmark comprising 50 seed subjects and 1,200 prompt cases per model, yielding 7,160 evaluated images across six models. Its factorized design varies semantic relation, scene openness, prompt mode, and language. A dual-branch protocol combines OCR-VLM text verification with structured VLM semantic judgments to measure Text-at-Anchor Accuracy (TAA), Semantic Subject Preservation (SSP), Semantic Leakage Rate (SLR), and Conditional Semantic Leakage Rate (cSLR). Under stress-test conditions, SLR increases from 1.2% to 18.1% and cSLR from 1.3% to 18.2%, whereas TAA decreases only from 91.4% to 90.9%. Anti-leakage prompting reduces SLR from 16.6% to 8.4% without degrading rendering accuracy. Human validation on 420 images shows strong agreement between automatic and adjudicated annotations. These results show that accurate text rendering does not guarantee local containment of target-text semantics.", "arxiv_id": "2609.02255", "arxiv_url": "https://arxiv.org/abs/2609.02255", "authors": ["Yan Wang", "Xinyi Hou", "Weiguo Lin", "Junjun Si", "Siwei Ma"], "brief": "\u672c\u6587\u63d0\u51fa T2LSC-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u6587\u751f\u56fe\u6a21\u578b\u5728\u6307\u5b9a\u5c40\u90e8\u533a\u57df\u6e32\u67d3\u6587\u5b57\u65f6\uff0c\u662f\u5426\u4f1a\u628a\u76ee\u6807\u6587\u5b57\u8bed\u4e49\u6cc4\u6f0f\u5230\u5468\u56f4\u975e\u6587\u5b57\u89c6\u89c9\u5185\u5bb9\u4e2d\u3002\u5b9e\u9a8c\u8986\u76d66\u4e2a\u6a21\u578b\uff0c\u53d1\u73b0\u538b\u529b\u6761\u4ef6\u4e0b\u8bed\u4e49\u6cc4\u6f0f\u7387\u663e\u8457\u4e0a\u5347\uff0c\u800c\u6587\u5b57\u6e32\u67d3\u51c6\u786e\u7387\u51e0\u4e4e\u4e0d\u53d8\uff1b\u53cd\u6cc4\u6f0f\u63d0\u793a\u53ef\u964d\u4f4e\u6cc4\u6f0f\u4e14\u4e0d\u635f\u5bb3\u6e32\u67d3\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02255", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u751f\u56fe", "\u57fa\u51c6\u6d4b\u8bd5", "\u8bed\u4e49\u63a7\u5236", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02255v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "T2LSC-Bench: Benchmarking Localized Semantic Control in Text-to-Image Generation", "tldr": "\u672c\u6587\u63d0\u51fa T2LSC-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u6587\u751f\u56fe\u6a21\u578b\u5728\u6307\u5b9a\u5c40\u90e8\u533a\u57df\u6e32\u67d3\u6587\u5b57\u65f6\uff0c\u662f\u5426\u4f1a\u628a\u76ee\u6807\u6587\u5b57\u8bed\u4e49\u6cc4\u6f0f\u5230\u5468\u56f4\u975e\u6587\u5b57\u89c6\u89c9\u5185\u5bb9\u4e2d\u3002\u5b9e\u9a8c\u8986\u76d66\u4e2a\u6a21\u578b\uff0c\u53d1\u73b0\u538b\u529b\u6761\u4ef6\u4e0b\u8bed\u4e49\u6cc4\u6f0f\u7387\u663e\u8457\u4e0a\u5347\uff0c\u800c\u6587\u5b57\u6e32\u67d3\u51c6\u786e\u7387\u51e0\u4e4e\u4e0d\u53d8\uff1b\u53cd\u6cc4\u6f0f\u63d0\u793a\u53ef\u964d\u4f4e\u6cc4\u6f0f\u4e14\u4e0d\u635f\u5bb3\u6e32\u67d3\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) aim to control robots by stochastically generating visual futures and then decoding actions, but empirical observations indicate that the results can strongly depend on which future is selected. We propose World-Coherent-Decoding (WCD), a self-verifying test-time planning framework that treats WAM rollouts as falsifiable future--action hypotheses. At each decision step, WCD samples multiple candidates from a frozen WAM and ranks them using internal generative signals: flow-based video surprisal for visual plausibility and action path effort for action-generation stability. After execution, the realized observation audits the selected imagination, yielding an imagination--reality mismatch that trains a lightweight online predictor for future candidate selection. Thus, WCD converts delayed self-verification into pre-execution reliability estimation without updating the backbone model. On RoboTwin 2.0, WCD improves Hard success under limited randomized-scene supervision from $55.80\\%$ to $60.90\\%$, with a $+16.43$ gains on Horizon-3 tasks, and shows qualitative robustness on real Franka visual-shift tests. These results highlight a simple principle: test-time scaling for WAMs depends less on sampling more futures than on selecting reliable ones.", "arxiv_id": "2609.02159", "arxiv_url": "https://arxiv.org/abs/2609.02159", "authors": ["Chuhan Zhang", "Seiji Ito", "Kenta Hoshino", "Satoshi Ikehata", "Ikuro Sato"], "brief": "\u63d0\u51fa World-Coherent Decoding\uff08WCD\uff09\uff0c\u5728\u6d4b\u8bd5\u65f6\u4ece\u51bb\u7ed3\u7684\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e2d\u91c7\u6837\u591a\u4e2a\u89c6\u89c9\u672a\u6765\u4e0e\u52a8\u4f5c\u5019\u9009\uff0c\u5e76\u7528\u89c6\u9891\u60ca\u8bb6\u5ea6\u3001\u52a8\u4f5c\u8def\u5f84\u7a33\u5b9a\u6027\u4ee5\u53ca\u6267\u884c\u540e\u7684\u60f3\u8c61-\u73b0\u5b9e\u504f\u5dee\u6765\u7b5b\u9009\u66f4\u53ef\u9760\u7684\u65b9\u6848\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u66f4\u65b0\u4e3b\u5e72\u6a21\u578b\uff0c\u5728 RoboTwin 2.0 \u4e0a\u5c06\u56f0\u96be\u4efb\u52a1\u6210\u529f\u7387\u4ece 55.80% \u63d0\u5347\u5230 60.90%\uff0c\u5e76\u5728\u957f\u65f6\u57df\u4efb\u52a1\u548c\u771f\u5b9e Franka \u89c6\u89c9\u504f\u79fb\u6d4b\u8bd5\u4e2d\u8868\u73b0\u51fa\u66f4\u5f3a\u9c81\u68d2\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02159", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u63a7\u5236", "\u6d4b\u8bd5\u65f6\u89c4\u5212", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02159v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "World-Coherent Decoding: Self-Verifying Test-Time Planning for World Action Models", "tldr": "\u63d0\u51fa World-Coherent Decoding\uff08WCD\uff09\uff0c\u5728\u6d4b\u8bd5\u65f6\u4ece\u51bb\u7ed3\u7684\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e2d\u91c7\u6837\u591a\u4e2a\u89c6\u89c9\u672a\u6765\u4e0e\u52a8\u4f5c\u5019\u9009\uff0c\u5e76\u7528\u89c6\u9891\u60ca\u8bb6\u5ea6\u3001\u52a8\u4f5c\u8def\u5f84\u7a33\u5b9a\u6027\u4ee5\u53ca\u6267\u884c\u540e\u7684\u60f3\u8c61-\u73b0\u5b9e\u504f\u5dee\u6765\u7b5b\u9009\u66f4\u53ef\u9760\u7684\u65b9\u6848\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u66f4\u65b0\u4e3b\u5e72\u6a21\u578b\uff0c\u5728 RoboTwin 2.0 \u4e0a\u5c06\u56f0\u96be\u4efb\u52a1\u6210\u529f\u7387\u4ece 55.80% \u63d0\u5347\u5230 60.90%\uff0c\u5e76\u5728\u957f\u65f6\u57df\u4efb\u52a1\u548c\u771f\u5b9e Franka \u89c6\u89c9\u504f\u79fb\u6d4b\u8bd5\u4e2d\u8868\u73b0\u51fa\u66f4\u5f3a\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models have achieved remarkable progress in front-end web development, generating interactive webpages from multimodal references such as screenshots and interaction videos. However, existing work largely emphasizes visual metrics such as aesthetics and layout similarity, while overlooking the more critical validation of interactive functionality. We present RILA, an execution-driven agent that puts browser rendering in the loop, iteratively editing generated code from runtime interaction feedback. RILA introduces an Action Interaction Verification (AIV) module that replays the reference interaction trajectory on the generated webpage to collect grounded execution-aware observations, and an Execution-aware Rendering Score (ERS) that jointly measures interaction correctness and visual fidelity to guide iterative optimization. We further build an execution-verified data synthesis pipeline that produces diverse, high-quality training data, offering gains complementary to inference-time optimization. On IWR-Bench, RILA consistently improves both interaction and visual fidelity across foundation models. Notably, with our training pipeline, RILA lifts the compact Qwen3.5-9B backbone from 40.40% to 57.52%, surpassing far larger one-shot generators, including the 1T-parameter Kimi-K2.6 (55.61%) and the proprietary GPT-5.5 (55.74%).", "arxiv_id": "2609.02088", "arxiv_url": "https://arxiv.org/abs/2609.02088", "authors": ["Yilong Guo", "Hanqi Chen", "Zixiao Ye", "Guanzhong Wang", "Chen Yu", "Zeyu Chen"], "brief": "\u8bba\u6587\u63d0\u51fa RILA\uff0c\u4e00\u4e2a\u5c06\u6d4f\u89c8\u5668\u6e32\u67d3\u4e0e\u4ea4\u4e92\u6267\u884c\u53cd\u9988\u7eb3\u5165\u5faa\u73af\u7684\u524d\u7aef\u7f51\u9875\u751f\u6210\u667a\u80fd\u4f53\uff0c\u53ef\u6839\u636e\u8fd0\u884c\u65f6\u89c2\u5bdf\u8fed\u4ee3\u4fee\u6539\u4ee3\u7801\u3002\u5176 AIV \u6a21\u5757\u9a8c\u8bc1\u53c2\u8003\u4ea4\u4e92\u8f68\u8ff9\uff0cERS \u540c\u65f6\u8bc4\u4f30\u4ea4\u4e92\u6b63\u786e\u6027\u4e0e\u89c6\u89c9\u4e00\u81f4\u6027\uff1b\u5728 IWR-Bench \u4e0a\u663e\u8457\u63d0\u5347\u591a\u79cd\u6a21\u578b\u8868\u73b0\uff0c\u5e76\u8ba9 9B \u6a21\u578b\u8d85\u8fc7\u66f4\u5927\u89c4\u6a21\u7684\u4e00\u6b21\u6027\u751f\u6210\u5668\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02088", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u7f51\u9875\u751f\u6210", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02088v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rendering-in-the-Loop: An Execution-Driven Agent for Interactive Web Development", "tldr": "\u8bba\u6587\u63d0\u51fa RILA\uff0c\u4e00\u4e2a\u5c06\u6d4f\u89c8\u5668\u6e32\u67d3\u4e0e\u4ea4\u4e92\u6267\u884c\u53cd\u9988\u7eb3\u5165\u5faa\u73af\u7684\u524d\u7aef\u7f51\u9875\u751f\u6210\u667a\u80fd\u4f53\uff0c\u53ef\u6839\u636e\u8fd0\u884c\u65f6\u89c2\u5bdf\u8fed\u4ee3\u4fee\u6539\u4ee3\u7801\u3002\u5176 AIV \u6a21\u5757\u9a8c\u8bc1\u53c2\u8003\u4ea4\u4e92\u8f68\u8ff9\uff0cERS \u540c\u65f6\u8bc4\u4f30\u4ea4\u4e92\u6b63\u786e\u6027\u4e0e\u89c6\u89c9\u4e00\u81f4\u6027\uff1b\u5728 IWR-Bench \u4e0a\u663e\u8457\u63d0\u5347\u591a\u79cd\u6a21\u578b\u8868\u73b0\uff0c\u5e76\u8ba9 9B \u6a21\u578b\u8d85\u8fc7\u66f4\u5927\u89c4\u6a21\u7684\u4e00\u6b21\u6027\u751f\u6210\u5668\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
