state from those reached by alternative actions. We train these models using a branching web-agent dataset derived from WebArena Go-Browse trajectories, where every decision point contains multiple alternative actions and their resulting states. Experiments on our held-out predicted-state matching benchmark show that our approach outperforms world models trained with supervised next-state prediction. We further show that our approach improves PRM-style action ranking on WebPRMBench compared with action-only PRMs and PRMs augmented with supervised-next-state world models. Finally, on WebArena-Lite, using our world model for test-time action selection improves end-to-end task success. Our project page is available at: https://dhruvpendharkar.github.io/dwm/.", "arxiv_id": "2609.02885", "arxiv_url": "https://arxiv.org/abs/2609.02885", "authors": ["Kelvin Li", "Dhruv Pendharkar", "Anish Pahilajani", "Chuyi Shang", "Leon Oks", "Leonid Karlinsky", "Rogerio Feris", "Trevor Darrell", "Roei Herzig"], "brief": "\u8bba\u6587\u63d0\u51fa predicted-state matching \u8bad\u7ec3\u76ee\u6807\uff0c\u8ba9\u7f51\u9875\u667a\u80fd\u4f53\u7684\u4e16\u754c\u6a21\u578b\u4e0d\u4ec5\u9884\u6d4b\u4e0b\u4e00\u72b6\u6001\uff0c\u8fd8\u80fd\u533a\u5206\u771f\u5b9e\u52a8\u4f5c\u7ed3\u679c\u4e0e\u66ff\u4ee3\u52a8\u4f5c\u7ed3\u679c\u3002\u4f5c\u8005\u57fa\u4e8e WebArena Go-Browse \u6784\u5efa\u5206\u652f\u8f68\u8ff9\u6570\u636e\u96c6\uff0c\u5e76\u9a8c\u8bc1\u8be5\u6a21\u578b\u53ef\u6539\u8fdb\u6d4b\u8bd5\u65f6\u52a8\u4f5c\u9009\u62e9\u4e0e\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02885", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u4f20\u7edf\u76d1\u7763\u5f0f\u4e0b\u4e00\u72b6\u6001\u9884\u6d4b\u4e0e\u4e0b\u6e38 ranker/PRM \u7684\u5224\u522b\u9700\u6c42\u4e0d\u5339\u914d\uff0c\u751f\u6210\u6b63\u786e\u5feb\u7167\u4e0d\u7b49\u4e8e\u80fd\u6709\u6548\u533a\u5206\u5019\u9009\u52a8\u4f5c", "\u63d0\u51fa predicted-state matching\uff1a\u8981\u6c42\u9884\u6d4b\u72b6\u6001\u80fd\u4ece\u591a\u4e2a\u66ff\u4ee3\u52a8\u4f5c\u5bfc\u81f4\u7684\u72b6\u6001\u4e2d\u8bc6\u522b\u771f\u5b9e\u7ed3\u679c", "\u5728 predicted-state matching \u57fa\u51c6\u3001WebPRMBench \u52a8\u4f5c\u6392\u5e8f\u548c WebArena-Lite \u7aef\u5230\u7aef\u4efb\u52a1\u4e0a\u5747\u4f18\u4e8e\u76d1\u7763\u5f0f\u4e16\u754c\u6a21\u578b\u6216 action-only PRM"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u7f51\u9875\u81ea\u52a8\u5316", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02885v1", "published_at": "2026-09-02", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Discriminative World Models for Web Agents", "tldr": "\u7528\u5224\u522b\u5f0f\u4e16\u754c\u6a21\u578b\u63d0\u5347\u7f51\u9875\u667a\u80fd\u4f53\u51b3\u7b56", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa predicted-state matching \u8bad\u7ec3\u76ee\u6807\uff0c\u8ba9\u7f51\u9875\u667a\u80fd\u4f53\u7684\u4e16\u754c\u6a21\u578b\u4e0d\u4ec5\u9884\u6d4b\u4e0b\u4e00\u72b6\u6001\uff0c\u8fd8\u80fd\u533a\u5206\u771f\u5b9e\u52a8\u4f5c\u7ed3\u679c\u4e0e\u66ff\u4ee3\u52a8\u4f5c\u7ed3\u679c\u3002\u4f5c\u8005\u57fa\u4e8e WebArena Go-Browse \u6784\u5efa\u5206\u652f\u8f68\u8ff9\u6570\u636e\u96c6\uff0c\u5e76\u9a8c\u8bc1\u8be5\u6a21\u578b\u53ef\u6539\u8fdb\u6d4b\u8bd5\u65f6\u52a8\u4f5c\u9009\u62e9\u4e0e\u4efb\u52a1\u6210\u529f\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7f51\u9875\u667a\u80fd\u4f53\u7684\u4e16\u754c\u6a21\u578b\u8bad\u7ec3\u4ece\u201c\u751f\u6210\u5f0f\u8fd8\u539f\u72b6\u6001\u201d\u8f6c\u5411\u201c\u9762\u5411\u51b3\u7b56\u7684\u5224\u522b\u5f0f\u5efa\u6a21\u201d\uff0c\u66f4\u8d34\u5408\u6d4b\u8bd5\u65f6\u52a8\u4f5c\u9009\u62e9\u9700\u6c42\uff0c\u5bf9\u63d0\u5347 Web Agent \u7684\u53ef\u9760\u6027\u548c\u4efb\u52a1\u6210\u529f\u7387\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "GUI agents increasingly operate across websites, mobile apps, and desktop environments, yet the field still reports progress primarily through task success. We argue that practical deployment depends equally on efficiency: how much context, computation, action budget, and runtime overhead an agent consumes while succeeding. This survey studies efficient GUI agents through an end-to-end systems lens that preserves the current technical axes of observation efficiency, context and memory efficiency, action efficiency, and planner-side/system efficiency. For each subsection, we expand the seed literature through targeted search plus backward and forward citation chaining, then synthesize the dominant mechanisms, reported efficiency signals, and new overheads they introduce. Across the literature, recent progress converges on a small set of recurring ideas: selective reading instead of full-context ingestion, global-to-local visual allocation, recoverable memory rather than raw history replay, verification-aware control, and hybrid runtimes that can switch between GUI and non-GUI execution. We conclude by identifying the main open problems, including honest accounting of verifier cost, cross-benchmark comparability, and co-design of observation, memory, and execution layers under real latency and privacy constraints.", "arxiv_id": "2609.02309", "arxiv_url": "https://arxiv.org/abs/2609.02309", "authors": ["Bizhe Bai", "Jiakang Yuan", "Hongming Wu", "Xinyue Wang", "Jie Ren", "Siyao Chen", "Yuchen Ya", "Fan Bai", "Pai Peng", "Huafeng Qin", "Tao Chen"], "brief": "\u672c\u6587\u4ece\u7cfb\u7edf\u89c6\u89d2\u7efc\u8ff0GUI\u667a\u80fd\u4f53\u7684\u6548\u7387\u95ee\u9898\uff0c\u4e0d\u53ea\u5173\u6ce8\u4efb\u52a1\u6210\u529f\u7387\uff0c\u8fd8\u8003\u5bdf\u4e0a\u4e0b\u6587\u3001\u8ba1\u7b97\u3001\u52a8\u4f5c\u9884\u7b97\u4e0e\u8fd0\u884c\u65f6\u5f00\u9500\u3002\u8bba\u6587\u6309\u89c2\u5bdf\u3001\u8bb0\u5fc6\u3001\u52a8\u4f5c\u548c\u89c4\u5212/\u7cfb\u7edf\u8fd0\u884c\u65f6\u4f18\u5316\u56db\u6761\u4e3b\u7ebf\u68b3\u7406\u73b0\u6709\u65b9\u6cd5\u4e0e\u5f00\u653e\u95ee\u9898\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02309", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u603b\u7ed3\u4e86\u9009\u62e9\u6027\u8bfb\u53d6\u3001\u5168\u5c40\u5230\u5c40\u90e8\u89c6\u89c9\u5206\u914d\u3001\u53ef\u6062\u590d\u8bb0\u5fc6\u3001\u9a8c\u8bc1\u611f\u77e5\u63a7\u5236\u3001GUI\u4e0e\u975eGUI\u6df7\u5408\u6267\u884c\u7b49\u9ad8\u9891\u673a\u5236", "\u5f3a\u8c03\u4e0d\u540c\u4f18\u5316\u4f1a\u5f15\u5165\u65b0\u7684\u5f00\u9500\uff0c\u5982\u9a8c\u8bc1\u5668\u6210\u672c\u3001\u8bb0\u5fc6\u7ef4\u62a4\u6210\u672c\u548c\u7cfb\u7edf\u5207\u6362\u6210\u672c\uff0c\u9700\u8981\u7edf\u4e00\u6838\u7b97", "\u6307\u51fa\u8de8\u57fa\u51c6\u6548\u7387\u6307\u6807\u4e0d\u53ef\u6bd4\u3001\u771f\u5b9e\u5ef6\u8fdf\u4e0e\u9690\u79c1\u7ea6\u675f\u4e0b\u7684\u591a\u5c42\u534f\u540c\u8bbe\u8ba1\u4ecd\u662f\u5173\u952e\u6311\u6218"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u7cfb\u7edf\u4f18\u5316", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02309v1", "published_at": "2026-09-02", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Efficient GUI Agents: A Systems Survey of Observation, Memory, Action, and Runtime Optimization", "tldr": "\u7cfb\u7edf\u7efc\u8ff0\u9ad8\u6548GUI\u667a\u80fd\u4f53\u7684\u4f18\u5316\u8def\u5f84", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ece\u7cfb\u7edf\u89c6\u89d2\u7efc\u8ff0GUI\u667a\u80fd\u4f53\u7684\u6548\u7387\u95ee\u9898\uff0c\u4e0d\u53ea\u5173\u6ce8\u4efb\u52a1\u6210\u529f\u7387\uff0c\u8fd8\u8003\u5bdf\u4e0a\u4e0b\u6587\u3001\u8ba1\u7b97\u3001\u52a8\u4f5c\u9884\u7b97\u4e0e\u8fd0\u884c\u65f6\u5f00\u9500\u3002\u8bba\u6587\u6309\u89c2\u5bdf\u3001\u8bb0\u5fc6\u3001\u52a8\u4f5c\u548c\u89c4\u5212/\u7cfb\u7edf\u8fd0\u884c\u65f6\u4f18\u5316\u56db\u6761\u4e3b\u7ebf\u68b3\u7406\u73b0\u6709\u65b9\u6cd5\u4e0e\u5f00\u653e\u95ee\u9898\u3002", "why_notable": "GUI\u667a\u80fd\u4f53\u6b63\u8d70\u5411\u771f\u5b9e\u7f51\u9875\u3001\u79fb\u52a8\u7aef\u548c\u684c\u9762\u73af\u5883\uff0c\u6548\u7387\u5c06\u76f4\u63a5\u51b3\u5b9a\u53ef\u90e8\u7f72\u6027\u3002\u8be5\u7efc\u8ff0\u4e3a\u9886\u57df\u63d0\u4f9b\u4e86\u6bd4\u6210\u529f\u7387\u66f4\u5b8c\u6574\u7684\u7cfb\u7edf\u8bc4\u4f30\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u66f4\u4f4e\u6210\u672c\u3001\u66f4\u53ef\u9760\u7684GUI\u667a\u80fd\u4f53\u8bbe\u8ba1\u3002"}, {"abstract": "We introduce SolarWM, a fully open foundation for building interactive video world models from data preparation through long-horizon inference. Training across heterogeneous data sources and video backbones is challenging: datasets differ in temporal scale, camera geometry, visual quality, motion, and captioning styles, while video generators use distinct representations and architectures. Naive data mixing and model-specific implementations therefore produce inconsistent supervision and make results difficult to reproduce and compare. SolarWM addresses this coupling with a reconfigurable multi-source data engine and a backbone-native adaptation framework. The engine converts 1.43 million canonical clips from 10 datasets into a unified, frame-aligned contract covering visual observations, metric camera geometry, captions, quality metadata, selection decisions, and provenance, while decoupling source processing from mixture construction. Under shared camera-conditioning, training, and inference interfaces, we instantiate four 5B--33B models based on Wan2.2, LTX-2.5, and MiniMax-H3 while preserving their native representations and objectives. A unified three-stage recipe combines bidirectional adaptation, teacher-forced autoregressive initialization, and distribution matching distillation. The resulting causal models enable real-time interaction over rollouts ranging from minutes to hours after being trained on only 5s sequences. By releasing the resulting data, pipeline, recipes, weights, and framework, SolarWM provides a reproducible and extensible foundation for interactive world-model research.", "arxiv_id": "2609.02886", "arxiv_url": "https://arxiv.org/abs/2609.02886", "authors": ["Junchao Huang", "Guian Fang", "Shengju Qian", "Xianghao Kong", "Zhuoran Zhao", "Wei Huang", "Yihua Du", "Zixin Zhang", "Justin Cui", "Yuchao Gu", "Yukang Chen", "Xinting Hu", "Tianyu He", "Shaoshuai Shi", "Zhuotao Tian", "Xin Wang", "Mike Zheng Shou", "Li Jiang"], "brief": "SolarWM \u63d0\u51fa\u4e00\u4e2a\u4ece\u6570\u636e\u51c6\u5907\u5230\u957f\u65f6\u63a8\u7406\u7684\u5168\u5f00\u653e\u89c6\u9891\u4e16\u754c\u6a21\u578b\u57fa\u7840\u6846\u67b6\u3002\u5b83\u7edf\u4e00\u591a\u6e90\u89c6\u9891\u6570\u636e\u3001\u76f8\u673a\u6761\u4ef6\u4e0e\u4e0d\u540c\u89c6\u9891\u751f\u6210\u9aa8\u5e72\u7684\u9002\u914d\u6d41\u7a0b\uff0c\u5e76\u8bad\u7ec3\u51fa\u53ef\u8fdb\u884c\u5206\u949f\u5230\u5c0f\u65f6\u7ea7\u4ea4\u4e92\u5f0f rollout \u7684\u56e0\u679c\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Junchao-cs/SolarWM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02886", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u591a\u6e90\u6570\u636e\u5f15\u64ce\uff0c\u5c0610\u4e2a\u6570\u636e\u96c6\u7684143\u4e07\u6761\u89c4\u8303\u5316\u89c6\u9891\u7247\u6bb5\u7edf\u4e00\u4e3a\u5e27\u5bf9\u9f50\u683c\u5f0f\uff0c\u5305\u542b\u89c6\u89c9\u89c2\u6d4b\u3001\u76f8\u673a\u51e0\u4f55\u3001\u5b57\u5e55\u3001\u8d28\u91cf\u5143\u6570\u636e\u3001\u7b5b\u9009\u51b3\u7b56\u4e0e\u6eaf\u6e90\u4fe1\u606f", "\u63d0\u51fa backbone-native \u9002\u914d\u6846\u67b6\uff0c\u5728\u5171\u4eab\u76f8\u673a\u6761\u4ef6\u3001\u8bad\u7ec3\u548c\u63a8\u7406\u63a5\u53e3\u4e0b\uff0c\u9002\u914d Wan2.2\u3001LTX-2.5\u3001MiniMax-H3 \u7b495B\u523033B\u89c6\u9891\u6a21\u578b\uff0c\u540c\u65f6\u4fdd\u7559\u5176\u539f\u751f\u8868\u793a\u4e0e\u76ee\u6807", "\u91c7\u7528\u4e09\u9636\u6bb5\u8bad\u7ec3\u6d41\u7a0b\uff1a\u53cc\u5411\u9002\u914d\u3001teacher-forced \u81ea\u56de\u5f52\u521d\u59cb\u5316\u3001\u5206\u5e03\u5339\u914d\u84b8\u998f\uff0c\u4f7f\u4ec5\u75285\u79d2\u5e8f\u5217\u8bad\u7ec3\u7684\u6a21\u578b\u53ef\u8fdb\u884c\u5206\u949f\u5230\u5c0f\u65f6\u7ea7\u5b9e\u65f6\u4ea4\u4e92\u63a8\u7406"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u5f00\u653e\u6570\u636e"], "num_comments": 1, "on_hf": true, "organization": "Chinese University of Hong Kong, Shenzhen", "pdf_url": "https://arxiv.org/pdf/2609.02886v1", "published_at": "2026-09-02", "score": 0.315, "selected_reasons": ["HF trending (68\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02886.png", "title": "SolarWM: Open Data and Scalable Training for Long-Horizon Video World Models", "tldr": "\u5f00\u653e\u6846\u67b6\u652f\u6491\u957f\u65f6\u89c6\u9891\u4e16\u754c\u6a21\u578b\u8bad\u7ec3", "upvotes": 68, "what_it_is": "SolarWM \u63d0\u51fa\u4e00\u4e2a\u4ece\u6570\u636e\u51c6\u5907\u5230\u957f\u65f6\u63a8\u7406\u7684\u5168\u5f00\u653e\u89c6\u9891\u4e16\u754c\u6a21\u578b\u57fa\u7840\u6846\u67b6\u3002\u5b83\u7edf\u4e00\u591a\u6e90\u89c6\u9891\u6570\u636e\u3001\u76f8\u673a\u6761\u4ef6\u4e0e\u4e0d\u540c\u89c6\u9891\u751f\u6210\u9aa8\u5e72\u7684\u9002\u914d\u6d41\u7a0b\uff0c\u5e76\u8bad\u7ec3\u51fa\u53ef\u8fdb\u884c\u5206\u949f\u5230\u5c0f\u65f6\u7ea7\u4ea4\u4e92\u5f0f rollout \u7684\u56e0\u679c\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u65f6\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u5173\u952e\u74f6\u9888\u2014\u2014\u591a\u6e90\u6570\u636e\u4e0d\u4e00\u81f4\u3001\u9aa8\u5e72\u6a21\u578b\u9002\u914d\u56f0\u96be\u3001\u7ed3\u679c\u96be\u590d\u73b0\u2014\u2014\u7cfb\u7edf\u5316\u89e3\u8026\uff0c\u5e76\u5f00\u653e\u6570\u636e\u3001\u6d41\u7a0b\u3001\u914d\u65b9\u3001\u6743\u91cd\u548c\u6846\u67b6\uff0c\u6709\u671b\u6210\u4e3a\u53ef\u590d\u73b0\u7684\u4e16\u754c\u6a21\u578b\u7814\u7a76\u57fa\u5ea7\u3002"}, {"abstract": "Data-residency constraints force enterprises to self-host LLMs, but continuous adoption of newer models without decommissioning their predecessors expands the serving fleet, fragmenting a finite GPU pool. We consolidate traffic from over 200 internal applications onto a single model by closing quality gaps identified through production error analysis along three axes: instruction following, function-calling, and internal task distribution. Quality is tracked by offline benchmarks stratified to production traffic and scored by deterministic verifiers or calibrated LLM judges. Rather than optimising all objectives jointly, which introduces cross-domain reward interference, we train a separate GRPO expert per axis and merge them via two-stage SLERP. Each expert\u0027s reward exposes a distinct failure mode, namely semantic collapse, over-calling, and verbosity hacking, each requiring a domain-specific fix. In non-reasoning mode the recipe surpasses a ${\\sim}7\\times$ larger by total parameters baseline on the in-house Arena with 69.6 to 65.8, instruction following with 0.85 to 0.83, and function-calling with 0.79 to 0.77, while lifting general dialogue benchmarks. The model absorbs 50% of platform traffic, 116M requests per month, at a fraction of the serving cost.", "arxiv_id": "2609.01572", "arxiv_url": "https://arxiv.org/abs/2609.01572", "authors": ["Olga Tsymboi", "Dmitrii Stoianov", "Ramil Latypov", "Danil Taranets", "Daniil Dryabin", "Mikhail Gashkov", "Viktor Zelenkovskiy", "Aleksandr Fida", "Gleb Alektorov", "Nikita Gulyakov", "Arthur Babkin", "Aleksandr Medvedev", "Pavel Gein", "Anatolii Potapov"], "brief": "\u8bba\u6587\u9762\u5 ing a Self-Hosted LLM That Covers the Corporate Request Mix", "tldr": "\u7528\u5206\u4e13\u5bb6GRPO\u5408\u5e76\u6253\u9020\u4f01\u4e1a\u81ea\u6258\u7ba1\u5355\u6a21\u578b", "upvotes": 32, "what_it_is": "\u8bba\u6587\u9762\u5411\u4f01\u4e1a\u6570\u636e\u9a7b\u7559\u4e0eGPU\u8d44\u6e90\u53d7\u9650\u573a\u666f\uff0c\u5c06200\u591a\u4e2a\u5185\u90e8\u5e94\u7528\u7684\u751f\u4ea7\u6d41\u91cf\u6574\u5408\u5230\u4e00\u4e2a\u81ea\u6258\u7ba1LLM\u4e0a\u3002\u4f5c\u8005\u57fa\u4e8e\u751f\u4ea7\u9519\u8bef\u5206\u6790\uff0c\u5206\u522b\u8865\u9f50\u6307\u4ee4\u9075\u5faa\u3001\u51fd\u6570\u8c03\u7528\u548c\u5185\u90e8\u4efb\u52a1\u5206\u5e03\u4e09\u7c7b\u8d28\u91cf\u77ed\u677f\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u7ed9\u51fa\u4e86\u4e00\u5957\u4ece\u771f\u5b9e\u751f\u4ea7\u6d41\u91cf\u51fa\u53d1\u7684\u4f01\u4e1aLLM\u540e\u8bad\u7ec3\u4e0e\u90e8\u7f72\u65b9\u6848\uff0c\u5c55\u793a\u4e86\u5982\u4f55\u7528\u66f4\u5c0f\u3001\u66f4\u7edf\u4e00\u7684\u81ea\u6258\u7ba1\u6a21\u578b\u66ff\u4ee3\u81a8\u80c0\u7684\u591a\u6a21\u578b\u670d\u52a1\u96c6\u7fa4\uff0c\u5e76\u5728\u4f01\u4e1a\u5185\u90e8Arena\u3001\u6307\u4ee4\u9075\u5faa\u548c\u51fd\u6570\u8c03\u7528\u4e0a\u8d85\u8fc7\u7ea67\u500d\u53c2\u6570\u91cf\u7684\u57fa\u7ebf\uff0c\u5177\u6709\u5f88\u5f3a\u7684\u5de5\u7a0b\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Language models spend most of their attention on a small fraction of context, yet they read the entire KV cache to find the few tokens that matter. If the user asks about a previous detail in a 1M-token conversation, global attention layers must scan the full context to generate each token of the reply. A prominent approach mitigates this cost by pre-selecting relevant tokens via lightweight proxy scores, but this extrinsic scoring still incurs O(N) per step. We take an intrinsic approach motivated by the simple question: wouldn\u0027t the model already know which parts of the context are relevant? To this end, we introduce Declarative Attention (DA), a protocol that elicits the model to declare where it needs to attend within its chain-of-thought, partitioning generation into three modes: \u003cglobal\u003e (full context), \u003cfocus\u003e (a specific region), and \u003clocal\u003e (recent output only). The inference engine parses these declarations like tool calls and skips most of the KV cache read. Under zero-shot evaluation across 15 long-context tasks, DA on off-the-shelf models (Gemma-4-31B, Qwen-3.6-27B) significantly reduces total attended tokens during decoding (52.0%, 31.1%) with modest accuracy drops (1.27pp, 2.75pp) that shrink with model scale. DA unlocks a new axis of sparse attention, with further potential under training-based methods that future work can explore.", "arxiv_id": "2609.02737", "arxiv_url": "https://arxiv.org/abs/2609.02737", "authors": ["Namgyu Ho", "Huzama Ahmad", "Woosung Koh", "Se-Young Yun", "Tal Schuster", "Cicero Nogueira dos Santos"], "brief": "\u8bba\u6587\u63d0\u51fa Declarative Attention\uff08DA\uff09\uff1a\u8ba9\u8bed\u8a00\u6a21\u578b\u5728\u601d\u7ef4\u94fe\u4e2d\u58f0\u660e\u63a5\u4e0b\u6765\u9700\u8981\u5168\u5c40\u3001\u805a\u7126\u67d0\u6bb5\u6216\u4ec5\u5c40\u90e8\u6ce8\u610f\u529b\u3002\u63a8\u7406\u5f15\u64ce\u50cf\u89e3\u6790\u5de5\u5177\u8c03\u7528\u4e00\u6837\u8bfb\u53d6\u8fd9\u4e9b\u58f0\u660e\uff0c\u4ece\u800c\u8df3\u8fc7\u5927\u90e8\u5206 KV cache \u626b\u63cf\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02737", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u751f\u6210\u5212\u5206\u4e3a \u003cglobal\u003e\u3001\u003cfocus\u003e\u3001\u003clocal\u003e \u4e09\u79cd\u6ce8\u610f\u529b\u6a21\u5f0f\uff0c\u5229\u7528\u6a21\u578b\u81ea\u8eab\u5224\u65ad\u76f8\u5173\u4e0a\u4e0b\u6587\u4f4d\u7f6e", "\u5728 15 \u4e2a\u957f\u4e0a\u4e0b\u6587\u4efb\u52a1\u4e0a\u96f6\u6837\u672c\u8bc4\u6d4b\uff0cGemma-4-31B \u4e0e Qwen-3.6-27B \u5206\u522b\u51cf\u5c11 52.0% \u548c 31.1% \u7684\u89e3\u7801\u5173\u6ce8 token", "\u51c6\u786e\u7387\u4ec5\u5c0f\u5e45\u4e0b\u964d 1.27 \u548c 2.75 \u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u968f\u6a21\u578b\u89c4\u6a21\u589e\u5927\u4e0b\u964d\u8d8b\u5c0f"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u7a00\u758f\u6ce8\u610f\u529b", "KV cache", "\u63a8\u7406\u52a0\u901f"], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2609.02737v1", "published_at": "2026-09-02", "score": 0.285, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02737.png", "title": "Language Models Can Control Their Own Attention", "tldr": "\u8ba9\u6a21\u578b\u81ea\u884c\u58f0\u660e\u9700\u5173\u6ce8\u7684\u4e0a\u4e0b\u6587\u533a\u57df", "upvotes": 21, "what_it_is": "\u8bba\u6587\u63d0\u51fa Declarative Attention\uff08DA\uff09\uff1a\u8ba9\u8bed\u8a00\u6a21\u578b\u5728\u601d\u7ef4\u94fe\u4e2d\u58f0\u660e\u63a5\u4e0b\u6765\u9700\u8981\u5168\u5c40\u3001\u805a\u7126\u67d0\u6bb5\u6216\u4ec5\u5c40\u90e8\u6ce8\u610f\u529b\u3002\u63a8\u7406\u5f15\u64ce\u50cf\u89e3\u6790\u5de5\u5177\u8c03\u7528\u4e00\u6837\u8bfb\u53d6\u8fd9\u4e9b\u58f0\u660e\uff0c\u4ece\u800c\u8df3\u8fc7\u5927\u90e8\u5206 KV cache \u626b\u63cf\u3002", "why_notable": "\u5b83\u628a\u957f\u4e0a\u4e0b\u6587\u7a00\u758f\u6ce8\u610f\u529b\u4ece\u5916\u90e8\u6253\u5206\u7b5b\u9009\u8f6c\u5411\u6a21\u578b\u5185\u751f\u58f0\u660e\uff0c\u907f\u514d\u6bcf\u6b65 O(N) \u4ee3\u7406\u626b\u63cf\uff0c\u4e3a\u964d\u4f4e\u767e\u4e07 token \u4e0a\u4e0b\u6587\u63a8\u7406\u6210\u672c\u63d0\u4f9b\u4e86\u7b80\u5355\u4e14\u53ef\u6269\u5c55\u7684\u65b0\u65b9\u5411\u3002"}, {"abstract": "Text-rich visual inputs require models that can read, retrieve, and compress language directly in pixel space, yet existing pixel-text encoders struggle with fixed resolution pretraining, visual shortcut learning, weak visual grounding, and multilingual visual text understanding. In this work, we investigate the fundamental design principles required for robust visual text representation learning. Through systematic controlled ablations, we identify four critical components: variable image resolutions and rendered font sizes provide spatial proxies for high-resolution document generalization; natural image-text pairs are indispensable for grounding and prevent text-only collapse; layout-aware rendering helps prevent pixel-level shortcuts; and a two-stage multilingual curriculum enables effective cross-lingual alignment. By integrating these principles into a scalable training recipe, we train Pixel Linguist II, a native-resolution vision encoder trained with on-the-fly rendering, unified contrastive grounding, and a multilingual curriculum over 280M training examples. Pixel Linguist II sets new state-of-the-art results on English, cross-lingual, and multilingual Visual STS and ViDoRe, while also enabling better MLLM downstream evaluation. Notably, Pixel Linguist II remains robust under 80\\% visual token compression, showing great promise for optical context compression. Our code and resources are available at https://github.com/Pixel-Linguist/Pixel-Linguist-II.", "arxiv_id": "2609.01147", "arxiv_url": "https://arxiv.org/abs/2609.01147", "authors": ["Chaohao Yuan", "Ruifeng Yuan", "Zhuoxu Huang", "Yu Rong", "Hong Cheng", "Hou Pong Chan", "Chenghao Xiao"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u50cf\u7d20\u7a7a\u95f4\u4e2d\u6587\u672c\u8868\u5f81\u5b66\u4e60\u7684\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u636e\u6b64\u8bad\u7ec3\u4e86\u539f\u751f\u5206\u8fa8\u7387\u89c6\u89c9\u7f16\u7801\u5668 Pixel Linguist II\u3002\u6a21\u578b\u7ed3\u5408\u52a8\u6001\u6e32\u67d3\u3001\u7edf\u4e00\u5bf9\u6bd4 grounding \u4e0e\u591a\u8bed\u8a00\u8bfe\u7a0b\u5b66\u4e60\uff0c\u5728\u591a\u9879\u89c6\u89c9\u6587\u672c\u8bed\u4e49\u4efb\u52a1\u4e0a\u8fbe\u5230\u65b0SOTA\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01147", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u53d7\u63a7\u6d88\u878d\u603b\u7ed3\u56db\u4e2a\u5173\u952e\u56e0\u7d20\uff1a\u53ef\u53d8\u56fe\u50cf\u5206\u8fa8\u7387\u4e0e\u5b57\u4f53\u5927\u5c0f\u3001\u81ea\u7136\u56fe\u6587\u5bf9\u3001\u5e03\u5c40\u611f\u77e5\u6e32\u67d3\u3001\u4e24\u9636\u6bb5\u591a\u8bed\u8a00\u8bfe\u7a0b\u3002", "\u4f7f\u7528\u7ea62.8\u4ebf\u8bad\u7ec3\u6837\u672c\uff0c\u652f\u6301\u82f1\u8bed\u3001\u8de8\u8bed\u8a00\u4e0e\u591a\u8bed\u8a00 Visual STS \u548c ViDoRe \u4efb\u52a1\u3002", "\u572880%\u89c6\u89c9token\u538b\u7f29\u4e0b\u4ecd\u4fdd\u6301\u9c81\u68d2\uff0c\u663e\u793a\u51fa\u7528\u4e8e\u5149\u5b66\u4e0a\u4e0b\u6587\u538b\u7f29\u7684\u6f5c\u529b\u3002"], "keywords": ["\u89c6\u89c9\u6587\u672c", "\u591a\u6a21\u6001", "\u8868\u5f81\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u538b\u7f29"], "num_comments": 2, "on_hf": true, "organization": "LCO-Embedding", "pdf_url": "https://arxiv.org/pdf/2609.01147v1", "published_at": "2026-09-01", "score": 0.281, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01147.png", "title": "On the Design Fundamentals of Pixel Text Representation Learning", "tldr": "Pixel Linguist II\u63d0\u5347\u50cf\u7d20\u7ea7\u6587\u672c\u8868\u5f81\u5b66\u4e60\u3002", "upvotes": 16, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u50cf\u7d20\u7a7a\u95f4\u4e2d\u6587\u672c\u8868\u5f81\u5b66\u4e60\u7684\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u636e\u6b64\u8bad\u7ec3\u4e86\u539f\u751f\u5206\u8fa8\u7387\u89c6\u89c9\u7f16\u7801\u5668 Pixel Linguist II\u3002\u6a21\u578b\u7ed3\u5408\u52a8\u6001\u6e32\u67d3\u3001\u7edf\u4e00\u5bf9\u6bd4 grounding \u4e0e\u591a\u8bed\u8a00\u8bfe\u7a0b\u5b66\u4e60\uff0c\u5728\u591a\u9879\u89c6\u89c9\u6587\u672c\u8bed\u4e49\u4efb\u52a1\u4e0a\u8fbe\u5230\u65b0SOTA\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u63d0\u51fa\u4e86\u5f3a\u6a21\u578b\uff0c\u8fd8\u660e\u786e\u4e86\u50cf\u7d20\u7ea7\u6587\u672c\u7f16\u7801\u5668\u907f\u514d\u6377\u5f84\u5b66\u4e60\u3001\u63d0\u5347\u89c6\u89c9 grounding \u4e0e\u8de8\u8bed\u8a00\u6cdb\u5316\u7684\u8bad\u7ec3\u8303\u5f0f\uff0c\u5bf9\u6587\u6863\u7406\u89e3\u3001\u591a\u8bed\u8a00OCR\u66ff\u4ee3\u65b9\u6848\u548c\u591a\u6a21\u6001\u5927\u6a21\u578b\u538b\u7f29\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) has emerged as a powerful paradigm for large language model (LLM) post-training, but its reliance on coarse outcome rewards leads to limited guidance on intermediate reasoning processes. Existing approaches such as process reward modeling and on-policy distillation introduce additional constraints, such as reliance on a specialized reward model or assuming identical reasoning patterns between teacher and student. Nevertheless, we observe that once a reasoning process first goes wrong, evaluating the subsequent reasoning provides limited additional information, as it is already conditioned on an invalid prefix. Therefore, we propose Cliff, a reward shaping strategy that utilizes an off-the-shelf LLM as a teacher to identify the first mistake in each rollout. As a result, the rollout is naturally decomposed into two parts: a correct prefix and an incorrect suffix. Cliff then converts this signal into token-level advantages, assigning positive advantages for the correct prefix and negative feedback afterward. Experiments across 12 different scenarios demonstrate that Cliff consistently improves reasoning performance, outperforming on-policy distillation by 15% and standard GRPO by 7%, even with teachers of modest capability. Furthermore, we analyse the role of ``ground truth\u0027\u0027 in Cliff and investigate its training dynamics. These results establish Cliff as a simple, general and effective approach for improving RLVR with richer, fine-grained supervision.", "arxiv_id": "2609.02817", "arxiv_url": "https://arxiv.org/abs/2609.02817", "authors": ["Peixuan Han", "Runhui Wang", "Ketan Ramaneti", "Jie Hao", "Gerald Friedland", "Chris Kong"], "brief": "\u8bba\u6587\u63d0\u51fa Cliff\uff0c\u4e00\u79cd\u9762\u5411 RLVR \u7684\u5956\u52b1\u5851\u5f62\u65b9\u6cd5\uff1a\u7528\u73b0\u6210 LLM \u6559\u5e08\u5728\u63a8\u7406\u8f68\u8ff9\u4e2d\u5b9a\u4f4d\u201c\u7b2c\u4e00\u4e2a\u9519\u8bef\u201d\uff0c\u5c06\u8f68\u8ff9\u5206\u6210\u6b63\u786e\u524d\u7f00\u4e0e\u9519\u8bef\u540e\u7f00\uff0c\u5e76\u8f6c\u5316\u4e3a token \u7ea7\u4f18\u52bf\u4fe1\u53f7\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02817", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6838\u5fc3\u89c2\u5bdf\u662f\uff1a\u63a8\u7406\u4e00\u65e6\u9996\u6b21\u51fa\u9519\uff0c\u540e\u7eed\u5185\u5bb9\u5df2\u57fa\u4e8e\u65e0\u6548\u524d\u7f00\uff0c\u7ee7\u7eed\u8bc4\u4f30\u7684\u4fe1\u606f\u589e\u76ca\u6709\u9650\u3002", "Cliff \u7ed9\u6b63\u786e\u524d\u7f00\u5206\u914d\u6b63\u4f18\u52bf\u3001\u9519\u8bef\u4e4b\u540e\u5206\u914d\u8d1f\u53cd\u9988\uff0c\u4ece\u800c\u63d0\u4f9b\u6bd4\u6700\u7ec8\u7b54\u6848\u5956\u52b1\u66f4\u7ec6\u7c92\u5ea6\u7684\u8fc7\u7a0b\u76d1\u7763\u3002", "\u5728 12 \u4e2a\u573a\u666f\u4e2d\u7a33\u5b9a\u63d0\u5347\u63a8\u7406\u8868\u73b0\uff0c\u76f8\u6bd4 on-policy distillation \u63d0\u5347 15%\uff0c\u76f8\u6bd4\u6807\u51c6 GRPO \u63d0\u5347 7%\uff0c\u4e14\u4e2d\u7b49\u80fd\u529b\u6559\u5e08\u4e5f\u6709\u6548\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u8fc7\u7a0b\u5956\u52b1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02817v1", "published_at": "2026-09-02", "score": 0.275, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02817.png", "title": "Cliff: Learning Process Rewards from the First Mistake", "tldr": "\u7528\u9996\u4e2a\u9519\u8bef\u5b9a\u4f4d\u6539\u8fdbLLM\u63a8\u7406\u5f3a\u5316\u5b66\u4e60", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51fa Cliff\uff0c\u4e00\u79cd\u9762\u5411 RLVR \u7684\u5956\u52b1\u5851\u5f62\u65b9\u6cd5\uff1a\u7528\u73b0\u6210 LLM \u6559\u5e08\u5728\u63a8\u7406\u8f68\u8ff9\u4e2d\u5b9a\u4f4d\u201c\u7b2c\u4e00\u4e2a\u9519\u8bef\u201d\uff0c\u5c06\u8f68\u8ff9\u5206\u6210\u6b63\u786e\u524d\u7f00\u4e0e\u9519\u8bef\u540e\u7f00\uff0c\u5e76\u8f6c\u5316\u4e3a token \u7ea7\u4f18\u52bf\u4fe1\u53f7\u3002", "why_notable": "Cliff \u4e0d\u4f9d\u8d56\u4e13\u95e8\u8bad\u7ec3\u7684\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b\uff0c\u4e5f\u4e0d\u8981\u6c42\u6559\u5e08\u4e0e\u5b66\u751f\u63a8\u7406\u6a21\u5f0f\u4e00\u81f4\uff0c\u4e3a RLVR \u63d0\u4f9b\u4e86\u4e00\u79cd\u7b80\u5355\u3001\u901a\u7528\u4e14\u7ec6\u7c92\u5ea6\u7684\u5956\u52b1\u589e\u5f3a\u65b9\u6848\uff0c\u6709\u671b\u964d\u4f4e\u9ad8\u8d28\u91cf\u8fc7\u7a0b\u76d1\u7763\u7684\u6210\u672c\u3002"}, {"abstract": "Cognitive language agents have achieved substantial progress by equipping language models with memory, tools, and decision-making procedures, enabling agents to reason and act in interactive environments. Existing frameworks largely cast these agents as systems for solving user-specified, bounded tasks. An increasingly important goal is for language agents to provide persistent assistance in long-lived settings where user needs, context, and service procedures persist and change, and to remain useful across the broad range of tasks that arise over time. Yet we still lack a framework to characterize persistent AI agents, organize existing work, and guide future development. To this end, we propose a Perception-Centered Architecture for Persistent Agents (Pera). Pera describes a persistent agent organized around perception and control components that continually perceive service-relevant signals from episodic task executions, internal context, and changes in the surrounding environment, and use these signals to construct lifecycle tasks. These tasks drive the ongoing operation and adaptation of the agent\u0027s service procedures. We use Pera to retrospectively organize recent work, examine a detailed case study, and offer forward-looking insights for building more capable persistent agents. Just as software engineering moved from programming in the small to programming in the large, Pera frames the evolution of language agents as an analogous architectural transition toward long-lived, adaptive intelligence systems.", "arxiv_id": "2608.30478", "arxiv_url": "https://arxiv.org/abs/2608.30478", "authors": ["Shihan Dou", "Haoxiang Jia", "Shichun Liu", "Feng Chen", "Chenhao Huang", "Yujiong Shen", "Shaofan Liu", "Jiayi Chen", "Jiahang Lin", "Honglin Guo", "Qianyu He", "Minghao Guo", "Ziyi Ye", "Pluto Zhou", "Tao Gui", "Qi Zhang", "Xuanjing Huang"], "brief": "\u8bba\u6587\u63d0\u51fa Perception-Centered Architecture for Persistent Agents\uff08Pera\uff09\uff0c\u7528\u4e8e\u523b\u753b\u957f\u671f\u8fd0\u884c\u3001\u6301\u7eed\u9002\u5e94\u7684\u8bed\u8a00\u667a\u80fd\u4f53\u3002\u8be5\u67b6\u6784\u5f3a\u8c03\u667a\u80fd\u4f53\u4ece\u4efb\u52a1\u6267\u884c\u3001\u5185\u90e8\u72b6\u6001\u548c\u73af\u5883\u53d8\u5316\u4e2d\u6301\u7eed\u611f\u77e5\u4fe1\u53f7\uff0c\u5e76\u751f\u6210\u751f\u547d\u5468\u671f\u4efb\u52a1\u6765\u9a71\u52a8\u670d\u52a1\u6d41\u7a0b\u66f4\u65b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30478", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u667a\u80fd\u4f53\u4ece\u201c\u5b8c\u6210\u6709\u754c\u7528\u6237\u4efb\u52a1\u201d\u6269\u5c55\u5230\u201c\u957f\u671f\u63d0\u4f9b\u6301\u7eed\u670d\u52a1\u201d\u7684\u6301\u4e45\u5f62\u6001", "\u4ee5\u611f\u77e5\u4e0e\u63a7\u5236\u7ec4\u4ef6\u4e3a\u6838\u5fc3\uff0c\u6301\u7eed\u6574\u5408\u4efb\u52a1\u3001\u4e0a\u4e0b\u6587\u548c\u73af\u5883\u4fe1\u53f7", "\u7528\u751f\u547d\u5468\u671f\u4efb\u52a1\u7ec4\u7ec7\u667a\u80fd\u4f53\u7684\u8fd0\u884c\u3001\u7ef4\u62a4\u3001\u9002\u914d\u4e0e\u670d\u52a1\u6d41\u7a0b\u6f14\u5316"], "keywords": ["\u667a\u80fd\u4f53", "\u8bed\u8a00\u6a21\u578b", "\u957f\u671f\u8bb0\u5fc6", "\u7cfb\u7edf\u67b6\u6784"], "num_comments": 2, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2608.30478v1", "published_at": "2026-08-31", "score": 0.242, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30478.png", "title": "Agents in the Large: Perception-Centered Architecture for Persistent Agents", "tldr": "\u63d0\u51fa\u9762\u5411\u6301\u4e45\u667a\u80fd\u4f53\u7684\u611f\u77e5\u4e2d\u5fc3\u67b6\u6784Pera", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa Perception-Centered Architecture for Persistent Agents\uff08Pera\uff09\uff0c\u7528\u4e8e\u523b\u753b\u957f\u671f\u8fd0\u884c\u3001\u6301\u7eed\u9002\u5e94\u7684\u8bed\u8a00\u667a\u80fd\u4f53\u3002\u8be5\u67b6\u6784\u5f3a\u8c03\u667a\u80fd\u4f53\u4ece\u4efb\u52a1\u6267\u884c\u3001\u5185\u90e8\u72b6\u6001\u548c\u73af\u5883\u53d8\u5316\u4e2d\u6301\u7eed\u611f\u77e5\u4fe1\u53f7\uff0c\u5e76\u751f\u6210\u751f\u547d\u5468\u671f\u4efb\u52a1\u6765\u9a71\u52a8\u670d\u52a1\u6d41\u7a0b\u66f4\u65b0\u3002", "why_notable": "\u8fd9\u662f\u4e00\u7bc7\u504f\u6846\u67b6\u4e0e\u7efc\u8ff0\u6027\u8d28\u7684\u5de5\u4f5c\uff0c\u4e3a\u6301\u4e45 AI \u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u7edf\u4e00\u6982\u5ff5\u6a21\u578b\uff0c\u6709\u52a9\u4e8e\u6574\u7406\u73b0\u6709\u7814\u7a76\u5e76\u6307\u5bfc\u957f\u671f\u3001\u81ea\u9002\u5e94\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u8bbe\u8ba1\u3002"}, {"abstract": "Coding agents are now commonly evaluated on the SWE-bench family of benchmarks, whose tasks are built from curated GitHub issues: long, structured, and information-rich. Real user requests, however, are typically far shorter and less structured. To characterize this gap, we define a six-category information taxonomy and four dimensions of linguistic style, and apply them to real user prompts from SWE-chat and problem statements from SWE-bench Verified and Pro. We find that requests carrying only a problem statement, alone or with limited additional context, account for 88% of real prompts but just 7% of benchmark problems. Furthermore, 87% of real prompts are casually written whereas 94% of benchmark problems are formal. Guided by these observations, we introduce RealSWE, 381 multi-variant task families derived from SWE-bench Verified and Pro. Variants within each family share the same underlying task and gold patch while differing only in information composition and linguistic style. Evaluating seven contemporary LLMs with RealSWE, we find that i) realistic inputs reduce resolution rates by 6.4 pp on average and can change model rankings. Controlled analysis further shows that ii) including Desired Behavior and Motivation significantly affects performance, whereas Environment Information and Reproduction Steps merely add tokens without measurable benefit; iii) linguistic style has only small, model-dependent effects. These findings provide actionable guidance for users and agents: explicitly stating the desired behavior and motivation, which most real prompts omit, substantially improves the LLM\u0027s software engineering performance.", "arxiv_id": "2608.27831", "arxiv_url": "https://arxiv.org/abs/2608.27831", "authors": ["Gyuhyeong Kim", "Hyojung Gwon", "Jeonghyeon Kim", "Kyuhong Shim", "Sunjae Lee"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u771f\u5b9e\u8f6f\u4ef6\u5de5\u7a0b\u8bf7\u6c42\u4e0e SWE-bench \u7c7b\u57fa\u51c6\u4e4b\u95f4\u7684\u4fe1\u606f\u91cf\u548c\u8bed\u8a00\u98ce\u683c\u5dee\u8ddd\uff0c\u5e76\u63d0\u51fa RealSWE\uff1a\u57fa\u4e8e SWE-bench Verified/Pro \u6784\u5efa\u7684 381 \u7ec4\u591a\u53d8\u4f53\u4efb\u52a1\u3002\u5404\u53d8\u4f53\u5171\u4eab\u540c\u4e00\u5e95\u5c42\u4efb\u52a1\u548c\u6807\u51c6\u8865\u4e01\uff0c\u4ec5\u6539\u53d8\u4fe1\u606f\u7ec4\u6210\u4e0e\u8868\u8fbe\u98ce\u683c\uff0c\u7528\u4e8e\u66f4\u771f\u5b9e\u5730\u8bc4\u4f30\u4ee3\u7801\u667a\u80fd\u4f53\u3002", "categories": ["cs.AI", "cs.LG", "cs.SE"], "github_repo": "https://github.com/gyuhyeong-x/RealSWE", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27831", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u771f\u5b9e SWE-chat \u8bf7\u6c42\u4e2d\uff0c88% \u4ec5\u5305\u542b\u95ee\u9898\u9648\u8ff0\u6216\u5c11\u91cf\u4e0a\u4e0b\u6587\uff1b\u800c SWE-bench \u95ee\u9898\u4e2d\u8fd9\u7c7b\u8bf7\u6c42\u4ec5\u5360 7%\u3002", "87% \u771f\u5b9e\u7528\u6237\u63d0\u793a\u4e3a\u968f\u610f\u8868\u8fbe\uff0c94% \u57fa\u51c6\u95ee\u9898\u5219\u662f\u6b63\u5f0f\u5199\u6cd5\uff0c\u663e\u793a\u73b0\u6709\u8bc4\u6d4b\u4e0e\u771f\u5b9e\u4f7f\u7528\u573a\u666f\u5b58\u5728\u660e\u663e\u9519\u4f4d\u3002", "\u5728 7 \u4e2a\u5f53\u4ee3 LLM \u4e0a\u8bc4\u6d4b\u53d1\u73b0\uff0c\u771f\u5b9e\u5316\u8f93\u5165\u5e73\u5747\u4f7f\u4fee\u590d\u6210\u529f\u7387\u4e0b\u964d 6.4 \u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u53ef\u80fd\u6539\u53d8\u6a21\u578b\u6392\u540d\uff1b\u660e\u786e\u5199\u51fa\u671f\u671b\u884c\u4e3a\u548c\u52a8\u673a\u80fd\u663e\u8457\u63d0\u5347\u8868\u73b0\u3002"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 3, "on_hf": true, "organization": "Sungkyunkwan University", "pdf_url": "https://arxiv.org/pdf/2608.27831v2", "published_at": "2026-08-28", "score": 0.238, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27831.png", "title": "RealSWE: A Compositional Evaluation of Coding Agents under Realistic User Requests", "tldr": "\u771f\u5b9e\u7528\u6237\u8bf7\u6c42\u663e\u8457\u62c9\u4f4e\u4ee3\u7801\u667a\u80fd\u4f53\u8868\u73b0", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5206\u6790\u4e86\u771f\u5b9e\u8f6f\u4ef6\u5de5\u7a0b\u8bf7\u6c42\u4e0e SWE-bench \u7c7b\u57fa\u51c6\u4e4b\u95f4\u7684\u4fe1\u606f\u91cf\u548c\u8bed\u8a00\u98ce\u683c\u5dee\u8ddd\uff0c\u5e76\u63d0\u51fa RealSWE\uff1a\u57fa\u4e8e SWE-bench Verified/Pro \u6784\u5efa\u7684 381 \u7ec4\u591a\u53d8\u4f53\u4efb\u52a1\u3002\u5404\u53d8\u4f53\u5171\u4eab\u540c\u4e00\u5e95\u5c42\u4efb\u52a1\u548c\u6807\u51c6\u8865\u4e01\uff0c\u4ec5\u6539\u53d8\u4fe1\u606f\u7ec4\u6210\u4e0e\u8868\u8fbe\u98ce\u683c\uff0c\u7528\u4e8e\u66f4\u771f\u5b9e\u5730\u8bc4\u4f30\u4ee3\u7801\u667a\u80fd\u4f53\u3002", "why_notable": "RealSWE \u5c06\u540c\u4e00\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u62c6\u6210\u53ef\u63a7\u7684\u4fe1\u606f\u4e0e\u98ce\u683c\u53d8\u4f53\uff0c\u80fd\u66f4\u7cbe\u786e\u8861\u91cf\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u7528\u6237\u8bf7\u6c42\u4e0b\u7684\u9c81\u68d2\u6027\uff0c\u5e76\u7ed9\u51fa\u5b9e\u7528\u63d0\u793a\uff1a\u7528\u6237\u5e94\u660e\u786e\u671f\u671b\u884c\u4e3a\u548c\u95ee\u9898\u52a8\u673a\uff0c\u800c\u73af\u5883\u4fe1\u606f\u548c\u590d\u73b0\u6b65\u9aa4\u672a\u5fc5\u5e26\u6765\u53ef\u6d4b\u6536\u76ca\u3002"}, {"abstract": "AI is increasingly used in the R\\\u0026D process that produces future AI systems. We study the conditions under which this feedback becomes self-amplifying. Our model describes how the rate of AI capability growth depends on baseline research productivity, recursive feedback, and the increasing difficulty of research progress. We derive a recursive reproduction number, $\\mathcal{R}_{\\mathrm{AI}}$, that determines whether improvements are amplified or damped across development cycles. This quantity compares the strength of feedback with the rate at which further progress becomes more difficult. When $\\mathcal{R}_{\\mathrm{AI}}\u003e1$, the effects of improvements compound across development cycles, placing the system in a self-amplifying regime. When $\\mathcal{R}_{\\mathrm{AI}}\u003c1$, their effects weaken across cycles. The transition depends on the structure of the AI R\\\u0026D feedback loop and need not occur at any particular level of model capability. A system can therefore enter a self-amplifying regime before acceleration becomes visible, while rapid progress can also occur without self-amplification. Higher baseline research productivity can accelerate progress without changing whether the system is self-amplifying, but the duration of the development cycle becomes a limiting timescale for amplification. Increasing research difficulty can end a period of self-amplification. Extending the model to multiple research actors shows that improvements shared across organizations can make the overall research ecosystem self-amplifying even when no individual actor is. The framework identifies measurable properties of AI R\\\u0026D systems that can help distinguish recursive amplification from rapid progress driven by other sources, including the strength of recursive feedback, how effectively improvements propagate into successor systems, cycle duration, and the increasing difficulty of further progress.", "arxiv_id": "2609.00137", "arxiv_url": "https://arxiv.org/abs/2609.00137", "authors": ["Mikhail Burtsev"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u63cf\u8ff0AI\u53c2\u4e0e\u672a\u6765AI\u7814\u53d1\u53cd\u9988\u5faa\u73af\u7684\u7406\u8bba\u6a21\u578b\uff0c\u5206\u6790\u80fd\u529b\u589e\u957f\u4f55\u65f6\u4f1a\u4ece\u666e\u901a\u52a0\u901f\u8f6c\u4e3a\u9012\u5f52\u81ea\u653e\u5927\u3002\u6838\u5fc3\u63d0\u51fa\u9012\u5f52\u518d\u751f\u6570 R_AI\uff0c\u7528\u4e8e\u5224\u65ad\u6539\u8fdb\u5728\u8fed\u4ee3\u5f00\u53d1\u5468\u671f\u4e2d\u662f\u88ab\u653e\u5927\u8fd8\u662f\u8870\u51cf\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/burtsev/recursive-criticality-ai", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00137", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["R_AI \u6bd4\u8f83\u9012\u5f52\u53cd\u9988\u5f3a\u5ea6\u4e0e\u7814\u7a76\u96be\u5ea6\u4e0a\u5347\u901f\u5ea6\uff1b\u5f53 R_AI\u003e1 \u65f6\u8fdb\u5165\u81ea\u653e\u5927\u533a\u95f4\uff0cR_AI\u003c1 \u65f6\u6539\u8fdb\u6548\u5e94\u9010\u8f6e\u51cf\u5f31", "\u81ea\u653e\u5927\u8f6c\u53d8\u4e0d\u5fc5\u53d1\u751f\u5728\u67d0\u4e2a\u56fa\u5b9a\u6a21\u578b\u80fd\u529b\u6c34\u5e73\uff0c\u53ef\u80fd\u5728\u5916\u90e8\u52a0\u901f\u5c1a\u4e0d\u660e\u663e\u524d\u51fa\u73b0\uff0c\u4e5f\u53ef\u80fd\u5b58\u5728\u5feb\u901f\u8fdb\u6b65\u4f46\u975e\u9012\u5f52\u81ea\u653e\u5927", "\u591a\u7814\u7a76\u4e3b\u4f53\u6269\u5c55\u8868\u660e\uff0c\u8de8\u7ec4\u7ec7\u5171\u4eab\u6539\u8fdb\u53ef\u80fd\u8ba9\u6574\u4e2aAI\u7814\u53d1\u751f\u6001\u81ea\u653e\u5927\uff0c\u5373\u4f7f\u5355\u4e2a\u673a\u6784\u81ea\u8eab\u5e76\u672a\u8fbe\u5230\u4e34\u754c"], "keywords": ["AI\u6cbb\u7406", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u7814\u53d1\u81ea\u52a8\u5316", "\u7406\u8bba\u6a21\u578b"], "num_comments": 6, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00137v1", "published_at": "2026-08-31", "score": 0.234, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00137.png", "title": "Recursive Criticality of AI Self-Improvement", "tldr": "\u63d0\u51fa\u5224\u5b9aAI\u81ea\u6211\u6539\u8fdb\u653e\u5927\u7684\u4e34\u754c\u6307\u6807", "upvotes": 5, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u63cf\u8ff0AI\u53c2\u4e0e\u672a\u6765AI\u7814\u53d1\u53cd\u9988\u5faa\u73af\u7684\u7406\u8bba\u6a21\u578b\uff0c\u5206\u6790\u80fd\u529b\u589e\u957f\u4f55\u65f6\u4f1a\u4ece\u666e\u901a\u52a0\u901f\u8f6c\u4e3a\u9012\u5f52\u81ea\u653e\u5927\u3002\u6838\u5fc3\u63d0\u51fa\u9012\u5f52\u518d\u751f\u6570 R_AI\uff0c\u7528\u4e8e\u5224\u65ad\u6539\u8fdb\u5728\u8fed\u4ee3\u5f00\u53d1\u5468\u671f\u4e2d\u662f\u88ab\u653e\u5927\u8fd8\u662f\u8870\u51cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u8ba8\u8bbaAI\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u63d0\u4f9b\u4e86\u53ef\u91cf\u5316\u6846\u67b6\uff0c\u533a\u5206\u201c\u666e\u901a\u5feb\u901f\u8fdb\u6b65\u201d\u548c\u201c\u53cd\u9988\u9a71\u52a8\u7684\u81ea\u653e\u5927\u201d\uff0c\u5e76\u6307\u51fa\u53cd\u9988\u5f3a\u5ea6\u3001\u6539\u8fdb\u4f20\u9012\u6548\u7387\u3001\u5f00\u53d1\u5468\u671f\u548c\u7814\u7a76\u96be\u5ea6\u7b49\u53ef\u89c2\u6d4b\u53d8\u91cf\u5bf9\u98ce\u9669\u8bc4\u4f30\u4e0e\u6cbb\u7406\u76d1\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Information retrieval (IR) increasingly targets open-ended queries that admit diverse perspectives. Existing IR benchmarks, however, focus primarily on closed-ended queries, while even open-ended benchmarks largely consist of queries whose supporting documents span a single subject domain and modality. We introduce Multi$^3$IR, a benchmark that evaluates how well retrievers cover the multifaceted perspectives of open-ended queries across diverse domains and modalities. It comprises 104.9K Stack Exchange queries, each annotated with perspective descriptions that capture the query\u0027s implicit viewpoints. We further propose SPIN, a parameter- and label-efficient method that learns noise vectors to steer embeddings toward diverse yet meaningful semantic directions. Experiments show that existing multimodal retrievers suffer from single-perspective bias, while SPIN substantially improves perspective coverage on Multi$^3$IR and generalizes well to unseen open-ended IR benchmarks. The dataset and experimental code are available at https://github.com/seokwon99/Multi3IR.", "arxiv_id": "2608.30949", "arxiv_url": "https://arxiv.org/abs/2608.30949", "authors": ["Seokwon Song", "Sohyeon Kim", "Gunhee Kim"], "brief": "\u8bba\u6587\u63d0\u51fa Multi\u00b3IR \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u68c0\u7d22\u5668\u5728\u5f00\u653e\u5f0f\u tive Multi-domain Multi-modal Information Retrieval", "tldr": "\u9762\u5411\u5f00\u653e\u5f0f\u67e5\u8be2\u7684\u591a\u89c6\u89d2\u591a\u6a21\u6001\u68c0\u7d22\u57fa\u51c6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Multi\u00b3IR \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u68c0\u7d22\u5668\u5728\u5f00\u653e\u5f0f\u67e5\u8be2\u4e2d\u8986\u76d6\u591a\u79cd\u9690\u542b\u89c6\u89d2\u3001\u8de8\u9886\u57df\u4e0e\u8de8\u6a21\u6001\u8bc1\u636e\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b 104.9K \u4e2a Stack Exchange \u67e5\u8be2\uff0c\u5e76\u4e3a\u6bcf\u4e2a\u67e5\u8be2\u6807\u6ce8\u89c6\u89d2\u63cf\u8ff0\uff1b\u540c\u65f6\u63d0\u51fa SPIN \u65b9\u6cd5\uff0c\u901a\u8fc7\u5b66\u4e60\u566a\u58f0\u5411\u91cf\u5f15\u5bfc\u5d4c\u5165\u5230\u591a\u6837\u4e14\u6709\u610f\u4e49\u7684\u8bed\u4e49\u65b9\u5411\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u4fe1\u606f\u68c0\u7d22\u8bc4\u6d4b\u4ece\u4f20\u7edf\u95ed\u5408\u5f0f\u3001\u5355\u89c6\u89d2\u76f8\u5173\u6027\u63a8\u8fdb\u5230\u5f00\u653e\u5f0f\u3001\u591a\u89c6\u89d2\u3001\u591a\u6a21\u6001\u573a\u666f\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u7528\u6237\u590d\u6742\u67e5\u8be2\uff1b\u540c\u65f6\u63d0\u51fa\u8f7b\u91cf\u65b9\u6cd5\u7f13\u89e3\u68c0\u7d22\u5668\u5355\u89c6\u89d2\u504f\u7f6e\uff0c\u5bf9\u641c\u7d22\u3001\u95ee\u7b54\u548c RAG \u7cfb\u7edf\u8bc4\u4f30\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Test-time adaptation (TTA) typically assumes that model parameters can be updated at inference time. This assumption is restrictive for inference-only accelerators, frozen or third-party models, and memory-constrained deployments, and standard BatchNorm-based TTA configurations may also become inactive on architectures without BatchNorm. We study adaptation when the learned model must remain frozen. We introduce CASTER, a gradient-free method that stores source class statistics in a discriminative subspace, estimates a class-shared affine transformation from target-batch moments, and analytically transports the source class distributions before classification. CASTER requires no backward pass, optimizer state, or stored source feature bank. Across four backbones and seven datasets, it outperforms k-NN on identical frozen features in 27 of 28 backbone-dataset settings while retaining a median of 18x less state. Affine transport is not always reliable. On ImageNet-C, where batches contain only 64 samples for 1000 classes, unconditional transport loses 21.2 top-1 points. We therefore introduce an empirical residual-to-margin transportability certificate. Across 307 evaluation cells, every transport losing more than 10 points has certificate value above 3.9, although benign and destructive regimes are not perfectly separated. Gating converts an average $-3.35$-point effect of unconditional transport into a +1.69-point gain, and performance remains within 0.3 points of the best threshold over a broad threshold range. Finally, we show that this certificate is mechanism-specific: when applied to Tent, it accepts only $4.3\\%$ of updates and preserves 0.6% of Tent\u0027s available gain. These results position CASTER as a lightweight adaptation mechanism for frozen-model deployment, together with an explicit account of when its safety signal is informative and when it is not.", "arxiv_id": "2609.00374", "arxiv_url": "https://arxiv.org/abs/2609.00374", "authors": ["Salim Khazem", "Ibrahim Mohamed Serouis"], "brief": "\u8bba\u6587\u63d0\u51fa CASTER\uff0c\u4e00\u79cd\u9762\u5411\u51bb\u7ed3\u6a21\u578b\u90e8\u7f72\u7684\u65e0\u68af\u5ea6\u6d4b\u8bd5\u65f6\u9002\u5e94\u65b9\u6cd5\u3002\u5b83\u5728\u5224\u522b\u5b50\u7a7a\u95f4\u4e2d\u4fdd\u5b58\u6e90\u57df\u7c7b\u522b\u7edf\u8ba1\u91cf\uff0c\u7528\u76ee\u6807\u6279\u6b21\u77e9\u4f30\u8ba1\u5171\u4eab\u4eff\u5c04\u53d8\u6362\uff0c\u5e76\u89e3\u6790\u5730\u642c\u8fd0\u6e90\u7c7b\u5206\u5e03\u540e\u8fdb\u884c\u5206\u7c7b\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00374", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u53cd\u5411\u4f20\u64ad\u3001\u4f18\u5316\u5668\u72b6\u6001\u6216\u6e90\u7279\u5f81\u5e93\uff0c\u9002\u5408\u63a8\u7406-only \u52a0\u901f\u5668\u3001\u7b2c\u4e09\u65b9\u51bb\u7ed3\u6a21\u578b\u548c\u5185\u5b58\u53d7\u9650\u573a\u666f\u3002", "\u57284\u79cd\u9aa8\u5e72\u7f51\u7edc\u30017\u4e2a\u6570\u636e\u96c6\u4e0a\uff0cCASTER \u572828\u4e2a\u8bbe\u7f6e\u4e2d\u768427\u4e2a\u4f18\u4e8e\u76f8\u540c\u51bb\u7ed3\u7279\u5f81\u4e0a\u7684 k-NN\uff0c\u540c\u65f6\u72b6\u6001\u91cf\u4e2d\u4f4d\u6570\u51cf\u5c1118\u500d\u3002", "\u63d0\u51fa residual-to-margin \u53ef\u642c\u8fd0\u6027\u8bc1\u4e66\uff0c\u7528\u4e8e\u5224\u65ad\u4eff\u5c04\u642c\u8fd0\u662f\u5426\u5b89\u5168\uff1b\u5728307\u4e2a\u8bc4\u6d4b\u5355\u5143\u4e2d\uff0c\u6240\u6709\u635f\u5931\u8d85\u8fc710\u70b9\u7684\u642c\u8fd0\u5176\u8bc1\u4e66\u503c\u5747\u9ad8\u4e8e3.9\u3002"], "keywords": ["\u6d4b\u8bd5\u65f6\u9002\u5e94", "\u51bb\u7ed3\u6a21\u578b", "\u65e0\u68af\u5ea6\u5b66\u4e60", "\u6a21\u578b\u90e8\u7f72"], "num_comments": 2, "on_hf": true, "organization": "Talan", "pdf_url": "https://arxiv.org/pdf/2609.00374v1", "published_at": "2026-08-31", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00374.png", "title": "Adapting Without Gradients: Affine Statistics Transport and What Its Certificate Can Tell You", "tldr": "CASTER\u8ba9\u51bb\u7ed3\u6a21\u578b\u65e0\u68af\u5ea6\u5b8c\u6210\u6d4b\u8bd5\u65f6\u9002\u5e94\u3002", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa CASTER\uff0c\u4e00\u79cd\u9762\u5411\u51bb\u7ed3\u6a21\u578b\u90e8\u7f72\u7684\u65e0\u68af\u5ea6\u6d4b\u8bd5\u65f6\u9002\u5e94\u65b9\u6cd5\u3002\u5b83\u5728\u5224\u522b\u5b50\u7a7a\u95f4\u4e2d\u4fdd\u5b58\u6e90\u57df\u7c7b\u522b\u7edf\u8ba1\u91cf\uff0c\u7528\u76ee\u6807\u6279\u6b21\u77e9\u4f30\u8ba1\u5171\u4eab\u4eff\u5c04\u53d8\u6362\uff0c\u5e76\u89e3\u6790\u5730\u642c\u8fd0\u6e90\u7c7b\u5206\u5e03\u540e\u8fdb\u884c\u5206\u7c7b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6d4b\u8bd5\u65f6\u9002\u5e94\u4ece\u201c\u5fc5\u987b\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u201d\u6269\u5c55\u5230\u5b8c\u5168\u51bb\u7ed3\u6a21\u578b\u573a\u666f\uff0c\u5e76\u7ed9\u51fa\u8f7b\u91cf\u673a\u5236\u53ca\u53ef\u89e3\u91ca\u7684\u5b89\u5168\u95e8\u63a7\u4fe1\u53f7\uff0c\u5bf9\u5b9e\u9645\u90e8\u7f72\u4e2d\u7684\u4f4e\u6210\u672c\u3001\u4f4e\u6743\u9650\u6a21\u578b\u81ea\u9002\u5e94\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Understanding animal motion is fundamental to modeling animal behavior and biomechanics, yet progress in this area lags far behind human motion research due to the scarcity of high-quality motion data. While human motion can be captured in controlled environments, it is impractical for most animal species, resulting in small, domain-limited datasets that restrict downstream applications such as animation. To address this challenge, we introduce Kirin, a framework that reconstructs motion from video, learns motion priors at scale, and generates realistic motion that can be directly applied to animated assets. Using large collections of in-the-wild animal videos, we reconstruct 3D motion sequences and pair them with captions to create AiM3D, the first large-scale dataset offering aligned video-text-motion tuples for quadruped animals. Building on this dataset, we develop a visual-guided motion generation model that conditions on both text and image to guide the generation of realistic motion across diverse animal species. Finally, by leveraging an off-the-shelf image-to-3D model, we automatically rig and animate 3D meshes using generated motion, producing ready-to-render animated animals. Together, our dataset and framework establish a new foundation for large-scale, text and image conditioned animal motion generation and animation. Project page: https://kirin-ani.github.io/.", "arxiv_id": "2609.01823", "arxiv_url": "https://arxiv.org/abs/2609.01823", "authors": ["Brian Nlong Zhao", "Zhuoyang Pan", "James M. Rehg", "Jiajun Wu", "Shangzhe Wu"], "brief": "\u8bba\u6587\u63d0\u51fa Kirin \u6846\u67b6\uff0c\u4ece\u5927\u89c4\u6a21\u91ce\u5916\u52a8\u7269\u89c6\u9891\u4e2d\u91cd\u5efa\u4e09\u7ef4\u8fd0\u52a8\u3001\u5b66\u4e60\u8fd0\u52a8\u5148\u9a8c\uff0c\u5e76\u751f\u6210\u53ef\u76f4\u63a5\u9a71\u52a8\u52a8\u753b\u8d44\u4ea7\u7684\u56db\u8db3\u52a8\u7269\u8fd0\u52a8\u3002\u540c\u65f6\u6784\u5efa AiM3D\uff0c\u8fd9\u662f\u9996\u4e2a\u5927\u89c4\u6a21\u89c6\u9891-\u6587\u672c-\u8fd0\u52a8\u5bf9\u9f50\u7684\u56db\u8db3\u52a8\u7269\u6570\u636e\u96c6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01823", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u91ce\u5916\u52a8\u7269\u89c6\u9891\u81ea\u52a8\u91cd\u5efa\u4e09\u7ef4\u8fd0\u52a8\u5e8f\u5217\uff0c\u5e76\u4e0e\u6587\u672c\u63cf\u8ff0\u914d\u5bf9\u5f62\u6210\u89c6\u9891-\u6587\u672c-\u8fd0\u52a8\u4e09\u5143\u7ec4", "\u63d0\u51fa\u540c\u65f6\u4ee5\u6587\u672c\u548c\u56fe\u50cf\u4e3a\u6761\u4ef6\u7684\u89c6\u89c9\u5f15\u5bfc\u8fd0\u52a8\u751f\u6210\u6a21\u578b\uff0c\u652f\u6301\u591a\u7269\u79cd\u771f\u5b9e\u52a8\u7269\u8fd0\u52a8\u751f\u6210", "\u7ed3\u5408\u73b0\u6210 image-to-3D \u6a21\u578b\u5b9e\u73b0\u81ea\u52a8\u7ed1\u5b9a\u4e0e\u52a8\u753b\u5316\uff0c\u751f\u6210\u53ef\u6e32\u67d3\u7684\u4e09\u7ef4\u52a8\u7269\u52a8\u753b"], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u8fd0\u52a8\u751f\u6210", "\u591a\u6a21\u6001", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01823v1", "published_at": "2026-09-01", "score": 0.229, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01823.png", "title": "Kirin: Animal Motion Generation from In-the-Wild Video", "tldr": "\u4ece\u91ce\u5916\u89c6\u9891\u751f\u6210\u53ef\u52a8\u753b\u5316\u52a8\u7269\u8fd0\u52a8", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Kirin \u6846\u67b6\uff0c\u4ece\u5927\u89c4\u6a21\u91ce\u5916\u52a8\u7269\u89c6\u9891\u4e2d\u91cd\u5efa\u4e09\u7ef4\u8fd0\u52a8\u3001\u5b66\u4e60\u8fd0\u52a8\u5148\u9a8c\uff0c\u5e76\u751f\u6210\u53ef\u76f4\u63a5\u9a71\u52a8\u52a8\u753b\u8d44\u4ea7\u7684\u56db\u8db3\u52a8\u7269\u8fd0\u52a8\u3002\u540c\u65f6\u6784\u5efa AiM3D\uff0c\u8fd9\u662f\u9996\u4e2a\u5927\u89c4\u6a21\u89c6\u9891-\u6587\u672c-\u8fd0\u52a8\u5bf9\u9f50\u7684\u56db\u8db3\u52a8\u7269\u6570\u636e\u96c6\u3002", "why_notable": "\u52a8\u7269\u8fd0\u52a8\u6570\u636e\u957f\u671f\u7a00\u7f3a\uff0c\u9650\u5236\u4e86\u52a8\u7269\u884c\u4e3a\u5efa\u6a21\u3001\u751f\u7269\u529b\u5b66\u548c\u52a8\u753b\u751f\u6210\u3002Kirin \u5c06\u91ce\u5916\u89c6\u9891\u8f6c\u5316\u4e3a\u5927\u89c4\u6a21\u53ef\u5b66\u4e60\u8fd0\u52a8\u6570\u636e\uff0c\u5e76\u6253\u901a\u4ece\u56fe\u50cf/\u6587\u672c\u5230\u53ef\u6e32\u67d3\u4e09\u7ef4\u52a8\u7269\u52a8\u753b\u7684\u6d41\u7a0b\uff0c\u4e3a\u52a8\u7269\u8fd0\u52a8\u751f\u6210\u63d0\u4f9b\u4e86\u57fa\u7840\u6570\u636e\u4e0e\u5b9e\u7528\u6846\u67b6\u3002"}, {"abstract": "Faithfully translating research papers into repository-level implementations remains challenging because papers often describe methods at a high level, leave implementation assumptions implicit, and require generated repositories to preserve method logic, evaluation protocols, and cross-file consistency. Despite recent advances in paper-to-code agents, their intermediate outputs are often presented as free-form plans or summaries that downstream coding agents may ignore, reinterpret, or compress, leading to algorithmic simplification and inconsistent repository structure. To address these challenges, we introduce PaperCompiler, a paper-to-code generation framework that compiles paper-grounded evidence into explicit repository-level implementation specifications. PaperCompiler grounds implementation-relevant evidence while preserving source provenance and distinguishing paper-supported, inferred, externally delegated, and unresolved information. The resulting specifications encode non-degradation requirements, ownership assignments, cross-file dependencies, and file-level constraints. Repository generation proceeds under these compiled specifications while retaining flexibility over local engineering choices not fixed by the paper. PaperCompiler outperforms strong baselines on Paper2CodeBench, achieving a 13.8% relative improvement in reference-based fidelity (from 3.64 to 4.15) and reducing high-severity evaluator critiques (from 13.2% to 6.1%).", "arxiv_id": "2609.02272", "arxiv_url": "https://arxiv.org/abs/2609.02272", "authors": ["Yunhao Liu", "Hong Phuc Pham", "Jaehong Yoon"], "brief": "PaperCompiler \u662f\u4e00\u4e2a paper-to-code \u751f\u6210\u6846\u67b6\uff0c\u5c06\u8bba\u6587\u4e2d\u7684\u5b9e\u73b0\u76f8\u5173\u8bc1\u636e\u7f16\u8bd1\u4e3a\u663e\u5f0f\u7684\u4ed3\u5e93\u7ea7\u5b9e\u73b0\u89c4\u8303\u3002\u5b83\u4fdd\u7559\u8bc1\u636e\u6765\u6e90\uff0c\u5e76\u533a\u5206\u8bba\u6587\u652f\u6301\u3001\u63a8\u65ad\u3001\u5916\u90e8\u59d4\u6258\u548c\u672a\u89e3\u51b3\u4fe1\u606f\uff0c\u4ee5\u6307\u5bfc\u540e\u7eed\u4ee3\u7801\u4ed3\u5e93\u751f\u6210\u3002", "categories": ["cs.CL", "cs.AI", "cs.SE"], "github_repo": "https://github.com/Daethalous/PaperCompiler", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02272", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u89c4\u8303\u4e2d\u7f16\u7801\u975e\u9000\u5316\u8981\u6c42\u3001\u6587\u4ef6\u5f52\u5c5e\u3001\u8de8\u6587\u4ef6\u4f9d\u8d56\u548c\u6587\u4ef6\u7ea7\u7ea6\u675f\uff0c\u51cf\u5c11\u7f16\u7801\u9636\u6bb5\u5bf9\u8bba\u6587\u65b9\u6cd5\u7684\u7b80\u5316\u6216\u8bef\u89e3", "\u5728\u4fdd\u6301\u8bba\u6587\u56fa\u5b9a\u8981\u6c42\u7684\u540c\u65f6\uff0c\u5141\u8bb8\u5c40\u90e8\u5de5\u7a0b\u5b9e\u73b0\u6709\u4e00\u5b9a\u7075\u6d3b\u6027", "\u5728 Paper2CodeBench \u4e0a\u76f8\u8f83\u5f3a\u57fa\u7ebf\u5c06\u53c2\u8003\u4e00\u81f4\u6027\u8bc4\u5206\u4ece 3.64 \u63d0\u5347\u5230 4.15\uff0c\u5e76\u5c06\u9ad8\u4e25\u91cd\u6027\u8bc4\u4ef7\u6279\u8bc4\u4ece 13.2% \u964d\u81f3 6.1%"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bba\u6587\u590d\u73b0"], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University Singapore", "pdf_url": "https://arxiv.org/pdf/2609.02272v1", "published_at": "2026-09-02", "score": 0.226, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02272.png", "title": "PaperCompiler: Faithful Paper-to-Code Generation via Repository-Level Specification Compilation", "tldr": "\u5c06\u8bba\u6587\u8bc1\u636e\u7f16\u8bd1\u6210\u4ed3\u5e93\u7ea7\u4ee3\u7801\u89c4\u8303", "upvotes": 5, "what_it_is": "PaperCompiler \u662f\u4e00\u4e2a paper-to-code \u751f\u6210\u6846\u67b6\uff0c\u5c06\u8bba\u6587\u4e2d\u7684\u5b9e\u73b0\u76f8\u5173\u8bc1\u636e\u7f16\u8bd1\u4e3a\u663e\u5f0f\u7684\u4ed3\u5e93\u7ea7\u5b9e\u73b0\u89c4\u8303\u3002\u5b83\u4fdd\u7559\u8bc1\u636e\u6765\u6e90\uff0c\u5e76\u533a\u5206\u8bba\u6587\u652f\u6301\u3001\u63a8\u65ad\u3001\u5916\u90e8\u59d4\u6258\u548c\u672a\u89e3\u51b3\u4fe1\u606f\uff0c\u4ee5\u6307\u5bfc\u540e\u7eed\u4ee3\u7801\u4ed3\u5e93\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u81ea\u7531\u5f62\u5f0f\u7684\u8bba\u6587\u7406\u89e3\u7ed3\u679c\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u7684\u4ed3\u5e93\u7ea7\u89c4\u8303\uff0c\u63d0\u5347\u4e86\u8bba\u6587\u5230\u4ee3\u7801\u751f\u6210\u7684\u5fe0\u5b9e\u5ea6\u548c\u8de8\u6587\u4ef6\u4e00\u81f4\u6027\uff0c\u5bf9\u79d1\u7814\u590d\u73b0\u548c\u81ea\u52a8\u5316\u4ee3\u7801\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Embedding-based code retrieval is a core component of coding agents and retrieval-augmented code generation, where retrieving correct code matters more than retrieving lexically similar code. Existing code-retrieval benchmarks do not plant controlled, execution-verified single-edit variants of each query\u0027s canonical implementation in the search pool, leaving the question of whether embeddings can functionally discriminate correct from near-clone-but-incorrect code unanswered in a retrieval setting. Resolving this requires a benchmark whose search pool itself contains the relevant counterfactuals -- execution-verified buggy variants near-identical to each canonical -- so that a retriever\u0027s rank ordering can be directly tested for functional discrimination rather than topical or identity overlap. We introduce ExecRetrieval, 939 Python tasks each paired with one execution-verified canonical implementation and up to four execution-verified buggy distractors, each generated by a mechanical mutation making a single targeted edit, and evaluate 23 dense embedding configurations plus BM25 under provider-native invocation with paired McNemar tests and query-level bootstrap intervals. With near-clone counterfactuals in the pool, the top hosted system reaches exec@10 = 1.00 but only exec@1 = 0.331; rank-1 misses are paired buggy variants 91.5-99.4% of the time across the four leading systems, and the canonical scores below at least one of its four paired distractors in 67-78% of queries on the leading systems. The full dataset, execution oracle, embedding matrices, environment snapshot, and pairwise statistical tests are released at the URL in Appendix D.", "arxiv_id": "2609.01865", "arxiv_url": "https://arxiv.org/abs/2609.01865", "authors": ["Aaryan Kapoor", "Md Abdullah Al Hafiz Khan"], "brief": "\u8bba\u6587\u63d0\u51fa ExecRetrieval \u57fa\u51c6\uff0c\u7528\u6267\u884c\u9a8c\u8bc1\u7684\u6b63\u786e Python \u5b9e\u73b0\u53ca\u5355\u7f16\u8f91\u9519\u8bef\u8fd1\u514b\u9686\u53d8\u4f53\uff0c\u6d4b\u8bd5\u4ee3\u7801\u5d4c\u5165\u68c0\u7d22\u662f\u5426\u80fd\u6309\u529f\u80fd\u6b63\u786e\u6027\u6392\u5e8f\u3002\u4f5c\u8005\u8bc4\u4f30\u4e86 23 \u79cd\u7a20\u5bc6\u5d4c\u5165\u914d\u7f6e\u548c BM25\uff0c\u5e76\u53d1\u5e03\u6570\u636e\u3001\u6267\u884c oracle\u3001\u5d4c\u5165\u77e9\u9635\u4e0e\u7edf\u8ba1\u68c0\u9a8c\u7ed3\u679c\u3002", "categories": ["cs.SE", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01865", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5305\u542b 939 \u4e2a Python \u4efb\u52a1\uff0c\u6bcf\u4e2a\u4efb\u52a1\u914d\u6709 1 \u4e2a\u6267\u884c\u9a8c\u8bc1\u7684\u89c4\u8303\u5b9e\u73b0\u548c\u6700\u591a 4 \u4e2a\u5355\u70b9\u673a\u68b0\u53d8\u5f02\u751f\u6210\u7684\u9519\u8bef\u5e72\u6270\u9879", "\u9886\u5148 hosted \u7cfb\u7edf exec@10 \u53ef\u8fbe 1.00\uff0c\u4f46 exec@1 \u4ec5\u4e3a 0.331\uff0c\u8bf4\u660e\u80fd\u53ec\u56de\u6b63\u786e\u4ee3\u7801\u4f46\u5e38\u65e0\u6cd5\u6392\u5230\u7b2c\u4e00", "\u56db\u4e2a\u9886\u5148\u7cfb\u7edf\u4e2d\uff0crank-1 \u5931\u8bef\u6709 91.5%\u201399.4% \u662f\u914d\u5bf9\u9519\u8bef\u8fd1\u514b\u9686\uff1b67%\u201378% \u67e5\u8be2\u4e2d\u6b63\u786e\u5b9e\u73b0\u5f97\u5206\u4f4e\u4e8e\u81f3\u5c11\u4e00\u4e2a\u9519\u8bef\u5e72\u6270\u9879"], "keywords": ["\u4ee3\u7801\u68c0\u7d22", "\u4ee3\u7801\u751f\u6210", "\u5d4c\u5165\u6a21\u578b", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "Kennesaw State University", "pdf_url": "https://arxiv.org/pdf/2609.01865v1", "published_at": "2026-09-01", "score": 0.216, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01865.png", "title": "ExecRetrieval: Measuring the Functional-Correctness Gap in Code-Embedding Retrieval", "tldr": "\u4ee3\u7801\u68c0\u7d22\u5d4c\u5165\u96be\u8fa8\u8fd1\u4f3c\u4f46\u9519\u8bef\u5b9e\u73b0", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa ExecRetrieval \u57fa\u51c6\uff0c\u7528\u6267\u884c\u9a8c\u8bc1\u7684\u6b63\u786e Python \u5b9e\u73b0\u53ca\u5355\u7f16\u8f91\u9519\u8bef\u8fd1\u514b\u9686\u53d8\u4f53\uff0c\u6d4b\u8bd5\u4ee3\u7801\u5d4c\u5165\u68c0\u7d22\u662f\u5426\u80fd\u6309\u529f\u80fd\u6b63\u786e\u6027\u6392\u5e8f\u3002\u4f5c\u8005\u8bc4\u4f30\u4e86 23 \u79cd\u7a20\u5bc6\u5d4c\u5165\u914d\u7f6e\u548c BM25\uff0c\u5e76\u53d1\u5e03\u6570\u636e\u3001\u6267\u884c oracle\u3001\u5d4c\u5165\u77e9\u9635\u4e0e\u7edf\u8ba1\u68c0\u9a8c\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4ee3\u7801\u68c0\u7d22\u8bc4\u6d4b\u4ece\u201c\u8bed\u4e49/\u8bcd\u9762\u76f8\u4f3c\u201d\u63a8\u8fdb\u5230\u201c\u529f\u80fd\u6b63\u786e\u6027\u533a\u5206\u201d\uff0c\u76f4\u63a5\u63ed\u793a\u5f53\u524d\u4ee3\u7801\u5d4c\u5165\u5728 RAG \u4ee3\u7801\u751f\u6210\u548c\u7f16\u7801\u667a\u80fd\u4f53\u4e2d\u7684\u5173\u952e\u77ed\u677f\uff0c\u5bf9\u68c0\u7d22\u5668\u9009\u62e9\u3001\u8bad\u7ec3\u76ee\u6807\u548c\u5b89\u5168\u53ef\u9760\u4ee3\u7801\u751f\u6210\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Adapting the communication topology of an LLM multi-agent system to each query improves both accuracy and efficiency, yet current designers treat this as conditional graph generation: a variational, autoregressive, or diffusion decoder searches the $N \\times N$ adjacency space, and a graph-network proxy trained on utility and a structural cost such as edge count ranks the sampled candidates. We argue that this formulation is misaligned with the problem. Empirically, topologies that survive a reward filter collapse to about six distinct graphs even when the codebook capacity grows from 8 to 64; edge count is negatively correlated with measured token consumption (Pearson $r \\approx -0.4$), so sparsifying the graph makes inference more expensive; and a message-passing scorer over agent-profile nodes is adjacency-invariant whenever agents share a profile---the default configuration of published benchmarks---so it cannot rank candidates at all in that regime. These three facts motivate Codebook Agent: a vector-quantized autoencoder compresses successful topologies into a query-independent 16-entry codebook; a reward-weighted MLP maps the query embedding to a distribution over codes; and an MLP proxy that reads the flattened adjacency, regressed on measured utility and per-task normalized token cost, reranks the top decoded candidates in a single batched forward pass. With no iterative search and no message passing at test time, Codebook Agent is the most accurate method on all six benchmarks we compare (84.6 average against 83.0 for the strongest prior designer), emits a topology in 2.4 ms, and uses 21.9--33.2% fewer LLM tokens.", "arxiv_id": "2609.02264", "arxiv_url": "https://arxiv.org/abs/2609.02264", "authors": ["Jinxi Yu", "Yubei Li", "Eric Hanchen Jiang", "Zhi Zhang", "Dong Liu", "Wenxiao Zhao", "Levina Li", "Kai-Wei Chang", "Ying Nian Wu"], "brief": "\u8bba\u6587\u63d0\u51fa Codebook Agent\uff0c\u5c06\u6210\u529f\u7684\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u62d3\u6251\u538b\u7f29\u4e3a\u67e5\u8be2\u65e0\u5173\u7684\u79bb\u6563\u7801\u672c\uff0c\u518d\u6839\u636e\u67e5\u8be2\u9009\u62e9\u5e76\u91cd\u6392\u5019\u9009\u62d3\u6251\u3002\u5b83\u907f\u514d\u4e86\u4f20\u7edf\u6761\u4ef6\u56fe\u751f\u6210\u7684\u8fed\u4ee3\u641c\u7d22\uff0c\u5728\u6d4b\u8bd5\u65f6\u7528\u8f7b\u91cf MLP \u5373\u53ef\u8f93\u51fa\u62d3\u6251\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02264", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u53d1\u73b0\u73b0\u6709\u62d3\u6251\u8bbe\u8ba1\u8303\u5f0f\u5b58\u5728\u9519\u914d\uff1a\u9ad8\u5956\u52b1\u62d3\u6251\u4f1a\u574d\u7f29\u5230\u7ea66\u79cd\u56fe\uff0c\u6269\u5927\u7801\u672c\u5bb9\u91cf\u4e5f\u96be\u4ee5\u589e\u52a0\u6709\u6548\u591a\u6837\u6027\u3002", "\u5b9e\u6d4b\u8fb9\u6570\u4e0e token \u6d88\u8017\u5448\u8d1f\u76f8\u5173\uff08Pearson r\u2248-0.4\uff09\uff0c\u8bf4\u660e\u7b80\u5355\u7a00\u758f\u5316\u901a\u4fe1\u56fe\u4e0d\u4e00\u5b9a\u66f4\u7701\u6210\u672c\u3002", "Codebook Agent \u57286\u4e2a\u57fa\u51c6\u4e0a\u5e73\u5747\u51c6\u786e\u738784.6\uff0c\u4f18\u4e8e\u6700\u5f3a\u5148\u524d\u65b9\u6cd583.0\uff0c\u62d3\u6251\u751f\u6210\u4ec5\u97002.4\u6beb\u79d2\uff0c\u5e76\u51cf\u5c1121.9%\u201333.2%\u7684LLM token\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u62d3\u6251\u4f18\u5316", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02264v1", "published_at": "2026-09-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Codebook Agent: Amortized Topology Design for LLM Multi-Agent Systems", "tldr": "\u7528\u7801\u672c\u5feb\u901f\u9009\u62e9LLM\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u62d3\u6251", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Codebook Agent\uff0c\u5c06\u6210\u529f\u7684\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u62d3\u6251\u538b\u7f29\u4e3a\u67e5\u8be2\u65e0\u5173\u7684\u79bb\u6563\u7801\u672c\uff0c\u518d\u6839\u636e\u67e5\u8be2\u9009\u62e9\u5e76\u91cd\u6392\u5019\u9009\u62d3\u6251\u3002\u5b83\u907f\u514d\u4e86\u4f20\u7edf\u6761\u4ef6\u56fe\u751f\u6210\u7684\u8fed\u4ee3\u641c\u7d22\uff0c\u5728\u6d4b\u8bd5\u65f6\u7528\u8f7b\u91cf MLP \u5373\u53ef\u8f93\u51fa\u62d3\u6251\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u91cd\u65b0\u5ba1\u89c6\u4e86LLM\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u62d3\u6251\u81ea\u9002\u5e94\u95ee\u9898\uff0c\u6307\u51fa\u4e3b\u6d41\u56fe\u751f\u6210\u4e0e\u6d88\u606f\u4f20\u9012\u8bc4\u5206\u5668\u7684\u5173\u952e\u7f3a\u9677\uff0c\u5e76\u7528\u79bb\u6563\u7801\u672c\u5b9e\u73b0\u66f4\u5feb\u3001\u66f4\u51c6\u3001\u66f4\u7701token\u7684\u62d3\u6251\u9009\u62e9\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u7cfb\u7edf\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Deep research agents augment large language models with external tools to answer complex, long-horizon questions through multi-turn reasoning. Learning from prior experience is crucial for continual improvement, yet existing methods either retrieve verbose task-specific traces that burden decision-making, or distill procedural skills that remain decoupled from downstream policy adaptation. We propose APEx, a hierarchical experience utilization framework that organizes interaction history into instance-level trajectory memories and category-level procedural skills, and couples them through a closed-loop architecture of Executor, Distiller, and Planner. The three modules are optimized via a three-stage alternating GRPO training paradigm, enabling reward-guided skill distillation rather than fixed-prompt generation. At test time, distilled skills serve as procedural priors for online Planner adaptation through skill-guided test-time reinforcement learning, allowing ground-truth-free self-improvement with skill-alignment regularization to prevent policy drift. Experiments on 7 benchmarks demonstrate that APEx achieves state-of-the-art performance, surpassing GPT-5.4 by 14.7 points and the strongest memory-augmented baseline by 3.0 points.", "arxiv_id": "2609.02253", "arxiv_url": "https://arxiv.org/abs/2609.02253", "authors": ["Jie Ding", "Rui Sun", "Xinyuan Zhang", "Zeyu Zhang", "Xin Liu"], "brief": "\u8bba\u6587\u63d0\u51fa APEx\uff0c\u4e00\u4e2a\u5c42\u6b21\u5316\u7ecf\u9a8c\u5229\u7528\u6846\u67b6\uff0c\u5c06\u5386\u53f2\u4ea4\u4e92\u7ec4\u7ec7\u4e3a\u5b9e\u4f8b\u7ea7\u8f68\u8ff9\u8bb0\u5fc6\u4e0e\u7c7b\u522b\u7ea7\u7a0b\u5e8f\u6280\u80fd\uff0c\u5e76\u901a\u8fc7 Executor\u3001Distiller\u3001Planner \u95ed\u73af\u534f\u540c\u3002\u5b83\u7528\u4e09\u9636\u6bb5\u4ea4\u66ff GRPO \u8bad\u7ec3\u5b9e\u73b0\u5956\u52b1\u5f15\u5bfc\u7684\u6280\u80fd\u84b8\u998f\uff0c\u5e76\u5728\u6d4b\u8bd5\u65f6\u7528\u6280\u80fd\u5f15\u5bfc\u7684\u5f3a\u5316\u5b66\u4e60\u8fdb\u884c\u5728\u7ebf\u81ea\u9002\u5e94\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02253", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u5197\u957f\u4efb\u52a1\u8f68\u8ff9\u538b\u7f29\u4e3a\u53ef\u590d\u7528\u7684\u7a0b\u5e8f\u6280\u80fd\uff0c\u540c\u65f6\u4fdd\u7559\u5b9e\u4f8b\u7ea7\u8bb0\u5fc6\u4ee5\u652f\u6301\u5177\u4f53\u95ee\u9898\u6c42\u89e3\u3002", "\u63d0\u51fa Executor\u3001Distiller\u3001Planner \u95ed\u73af\u67b6\u6784\uff0c\u5e76\u7528\u4e09\u9636\u6bb5\u4ea4\u66ff GRPO \u4f18\u5316\uff0c\u4f7f\u6280\u80fd\u84b8\u998f\u53d7\u5956\u52b1\u4fe1\u53f7\u9a71\u52a8\u3002", "\u6d4b\u8bd5\u65f6\u65e0\u9700\u771f\u5b9e\u7b54\u6848\uff0c\u901a\u8fc7\u6280\u80fd\u5f15\u5bfc\u7684 test-time RL \u81ea\u6211\u6539\u8fdb\uff0c\u5e76\u7528\u6280\u80fd\u5bf9\u9f50\u6b63\u5219\u6291\u5236\u7b56\u7565\u6f02\u79fb\uff1b\u5728 7 \u4e2a\u57fa\u51c6\u4e0a\u8d85\u8fc7 GPT-5.4 14.7 \u5206\u3001\u8d85\u8fc7\u6700\u5f3a\u8bb0\u5fc6\u589e\u5f3a\u57fa\u7ebf 3.0 \u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u8bb0\u5fc6\u589e\u5f3a", "\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02253v1", "published_at": "2026-09-02", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "APEx: Distillation of Agent Procedural Experience for Adaptive Deep Research Question Answering", "tldr": "APEx\u8ba9\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u4ece\u7ecf\u9a8c\u4e2d\u81ea\u9002\u5e94\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa APEx\uff0c\u4e00\u4e2a\u5c42\u6b21\u5316\u7ecf\u9a8c\u5229\u7528\u6846\u67b6\uff0c\u5c06\u5386\u53f2\u4ea4\u4e92\u7ec4\u7ec7\u4e3a\u5b9e\u4f8b\u7ea7\u8f68\u8ff9\u8bb0\u5fc6\u4e0e\u7c7b\u522b\u7ea7\u7a0b\u5e8f\u6280\u80fd\uff0c\u5e76\u901a\u8fc7 Executor\u3001Distiller\u3001Planner \u95ed\u73af\u534f\u540c\u3002\u5b83\u7528\u4e09\u9636\u6bb5\u4ea4\u66ff GRPO \u8bad\u7ec3\u5b9e\u73b0\u5956\u52b1\u5f15\u5bfc\u7684\u6280\u80fd\u84b8\u998f\uff0c\u5e76\u5728\u6d4b\u8bd5\u65f6\u7528\u6280\u80fd\u5f15\u5bfc\u7684\u5f3a\u5316\u5b66\u4e60\u8fdb\u884c\u5728\u7ebf\u81ea\u9002\u5e94\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u671f\u7ecf\u9a8c\u8bb0\u5fc6\u3001\u6280\u80fd\u84b8\u998f\u4e0e\u6d4b\u8bd5\u65f6\u7b56\u7565\u81ea\u9002\u5e94\u7ed3\u5408\u8d77\u6765\uff0c\u76f4\u63a5\u9762\u5411\u590d\u6742\u957f\u7a0b\u7814\u7a76\u95ee\u7b54\u667a\u80fd\u4f53\u7684\u6301\u7eed\u6539\u8fdb\u95ee\u9898\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u667a\u80fd\u4f53\u8bad\u7ec3\u4e0e\u5b9e\u7528\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Dexterous manipulation policies learned by imitation are typically evaluated for robustness to variation in scenes, objects, or instructions, but their performance across task execution speeds is less often examined. This leaves open how much temporal robustness a learner retains relative to the expert it imitates. We compare an expert and learner under the same task conditions, initial-condition draws, and speedup factors. We instantiate the evaluation in ParcelStow, a contact-rich task in which the robot acquires, reorients, and inserts a parcel. The demonstrations span the speedup range for the manipulation phases after parcel acquisition. A scripted expert and an Action Chunking with Transformers (ACT) policy trained from the expert\u0027s demonstrations both achieve 100 percent task success at nominal speed. Their success rates diverge within the demonstrated range: at its maximum, expert success is 84 percent and ACT success is 53 percent. Two ACT policies with different parameter initializations show similar degradation, decreasing by 34 and 48 percentage points from nominal speed to the maximum demonstrated speed, compared with 16 points for the expert. Stage-level analysis shows tha
