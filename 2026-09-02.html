<script>
const PAPERS = [{"abstract": "Autonomous agents are beginning to carry out machine-learning (ML) research end to end. These agents combine a model backbone with a harness for planning, execution, memory, and verification, but this architecture still leaves domain-specific know-how outside the agent. We call this missing layer operational knowledge, the know-how that separates knowing a method from making it work. That knowledge is not absent from the field. It appears in repositories and papers, but in forms written for human readers and too large to load during a task. Once distilled into compact, verified skills, this knowledge can be reused across tasks rather than rediscovered during each run. We present DisCo, a skill-powered research agent that creates skills and uses them during research. Its distillation runs in two complementary forms: task-agnostic, condensing the field\u0027s widely used repositories into reusable skills, and task-oriented, producing the skills a concrete task calls for. The former, applied across the open ecosystem, yields the AREX-Skill Library, with 5,000+ verified skills distilled from 1,000 widely used ML repositories and organized into 20 areas and 178 capability families. With the GPT-5.5 backbone, research harness, and downstream execution budget held fixed, the skill-equipped research agent scores 134.3% higher on MLE-bench, 34.4% higher on PaperBench, 9.2% higher on FrontierCS, and 14.0% higher on PassNet than the same agent without skills. These gains come from adding distilled operating context under that fixed setup.", "arxiv_id": "2609.02749", "arxiv_url": "https://arxiv.org/abs/2609.02749", "authors": ["Jianlyu Chen", "Yuyang Hu", "Hongjin Qian", "Jiawei Liu", "Wenqing Wei", "Xiaolong Chen", "Defu Lian", "Zhicheng Dou", "Chaozhuo Li", "Qiwei Ye", "Zheng Liu"], "brief": "\u8bba\u6587\u63d0\u51faDisCo\uff0c\u4e00\u4e2a\u80fd\u4ece\u673a\u5668\u5b66\u4e60\u4ed3\u5e93\u548c\u4efb\u52a1\u9700\u6c42\u4e2d\u84b8\u998f\u201c\u64cd\u4f5c\u6027\u77e5\u8bc6\u201d\u7684\u79d1\u7814\u667a\u80fd\u4f53\u3002\u5b83\u6784\u5efa\u4e86AREX-Skill Library\uff0c\u5305\u542b\u4ece1000\u4e2a\u5e38\u7528ML\u4ed3\u5e93\u4e2d\u63d0\u53d6\u76845000\u591a\u4e2a\u5df2\u9a8c\u8bc1\u6280\u80fd\uff0c\u7528\u4e8e\u63d0\u5347AI4AI\u7814\u7a76\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/VectorSpaceLab/AREX-Skill", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02749", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u533a\u5206\u5e76\u8865\u8db3\u667a\u80fd\u4f53\u7f3a\u5931\u7684\u201c\u64cd\u4f5c\u6027\u77e5\u8bc6\u201d\uff1a\u628a\u65b9\u6cd5\u771f\u6b63\u8dd1\u901a\u7684\u5de5\u7a0b\u8bc0\u7a8d\u3001\u914d\u7f6e\u7ecf\u9a8c\u548c\u5b9e\u8df5\u6d41\u7a0b\u3002", "\u6280\u80fd\u84b8\u998f\u5206\u4e3a\u4efb\u52a1\u65e0\u5173\u548c\u4efb\u52a1\u5bfc\u5411\u4e24\u7c7b\uff0c\u524d\u8005\u6c89\u6dc0\u901a\u7528\u4ed3\u5e93\u80fd\u529b\uff0c\u540e\u8005\u4e3a\u5177\u4f53\u7814\u7a76\u4efb\u52a1\u751f\u6210\u6240\u9700\u6280\u80fd\u3002", "\u5728\u56fa\u5b9aGPT-5.5\u9aa8\u5e72\u3001\u7814\u7a76\u6846\u67b6\u548c\u6267\u884c\u9884\u7b97\u4e0b\uff0c\u6280\u80fd\u589e\u5f3a\u667a\u80fd\u4f53\u5728MLE-bench\u63d0\u5347134.3%\uff0cPaperBench\u63d0\u534734.4%\uff0cFrontierCS\u63d0\u53479.2%\uff0cPassNet\u63d0\u534714.0%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "AI\u79d1\u7814", "\u6280\u80fd\u84b8\u998f", "\u673a\u5668\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Beijing Academy of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.02749v1", "published_at": "2026-09-02", "score": 0.7, "selected_reasons": ["\u77e5\u540d\u673a\u6784: BAAI", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (100\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02749.png", "title": "Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills", "tldr": "\u5c06GitHub\u4ed3\u5e93\u84b8\u998f\u4e3a\u53ef\u590d\u7528AI\u79d1\u7814\u6280\u80fd\u3002", "upvotes": 100, "what_it_is": "\u8bba\u6587\u63d0\u51faDisCo\uff0c\u4e00\u4e2a\u80fd\u4ece\u673a\u5668\u5b66\u4e60\u4ed3\u5e93\u548c\u4efb\u52a1\u9700\u6c42\u4e2d\u84b8\u998f\u201c\u64cd\u4f5c\u6027\u77e5\u8bc6\u201d\u7684\u79d1\u7814\u667a\u80fd\u4f53\u3002\u5b83\u6784\u5efa\u4e86AREX-Skill Library\uff0c\u5305\u542b\u4ece1000\u4e2a\u5e38\u7528ML\u4ed3\u5e93\u4e2d\u63d0\u53d6\u76845000\u591a\u4e2a\u5df2\u9a8c\u8bc1\u6280\u80fd\uff0c\u7528\u4e8e\u63d0\u5347AI4AI\u7814\u7a76\u4efb\u52a1\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5f00\u6e90\u4ed3\u5e93\u4e2d\u7684\u9690\u6027\u5de5\u7a0b\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u7d27\u51d1\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u590d\u7528\u7684\u667a\u80fd\u4f53\u6280\u80fd\u5e93\uff0c\u4e3a\u81ea\u52a8\u5316\u673a\u5668\u5b66\u4e60\u7814\u7a76\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u7684\u77e5\u8bc6\u5c42\uff0c\u5e76\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u5e26\u6765\u663e\u8457\u6536\u76ca\u3002"}, {"abstract": "Looped Transformers increase effective depth by iterating a shared block of layers, but most evaluations compare at fixed model size, conflating architectural advantage with extra FLOPs. We study looping on Mixture-of-Experts Transformers while closely matching per-token FLOPs, total non-embedding parameters, and KV cache. Through a series of ablations, we arrive at a recipe we call SMELT (Sparse MoE Transformer, middle layers Loop Twice), which loops the middle half of layers twice while matching the unlooped Baseline on all three budgets. We scale SMELT across four sizes up to 54B non-embedding parameters and fit a separate Chinchilla-style scaling law for each architecture. SMELT\u0027s loss drops faster with compute, saving 6.8--18.0\\% of training FLOPs on the compute-optimal frontier. The advantage transfers to downstream benchmarks beyond what validation loss predicts, is largest on Code, and grows with sample length and the number of in-context examples. Mechanistic analysis shows that the second visit reduces the attention sink and redirects mass toward content-relevant tokens, an inductive bias that may underlie the observed performance gains. These results show that looping can improve Transformers even under budget matching, offering a practical recipe that turns depth reuse into measurable gains.", "arxiv_id": "2609.01343", "arxiv_url": "https://arxiv.org/abs/2609.01343", "authors": ["Shaowen Wang", "Ge Zhang", "Kairong Luo", "Yuhao Wu", "Shaofan Liu", "Jiaheng Liu", "Wenhao Huang", "Shen Yan", "Jian Li"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u5728FLOPs\u3001\u53c2\u6570\u91cf\u548cKV cache\u5339\u914d\u6761\u4ef6\u4e0b\uff0cLooped Transformer\u662f\u5426\u4ecd\u6709\u4f18\u52bf\u3002\u4f5c\u8005\u63d0\u51faSMELT\uff1a\u7a00\u758fMoE Transformer\u5c06\u4e2d\u95f4\u4e00\u534a\u5c42\u5faa\u73af\u4e24\u6b21\uff0c\u5e76\u5efa\u7acb\u4e0d\u540c\u89c4\u6a21\u4e0b\u7684Chinchilla\u5f0f\u7f29\u653e\u5f8b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01343", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["SMELT\u5728\u56db\u79cd\u89c4\u6a21\u4e0a\u6269\u5c55\u81f3540\u4ebf\u975e\u5d4c\u5165\u53c2\u6570\uff0c\u5e76\u4e0e\u672a\u5faa\u73afBaseline\u4e25\u683c\u5339\u914d\u6bcftoken FLOPs\u3001\u603b\u53c2\u6570\u548cKV cache\u3002", "\u5728\u8ba1\u7b97\u6700\u4f18\u524d\u6cbf\u4e0a\uff0cSMELT\u53ef\u8282\u77016.8%\u81f318.0%\u7684\u8bad\u7ec3FLOPs\uff0c\u4e14\u635f\u5931\u968f\u8ba1\u7b97\u91cf\u4e0b\u964d\u66f4\u5feb\u3002", "\u4e0b\u6e38\u6536\u76ca\u8d85\u8fc7\u9a8c\u8bc1\u635f\u5931\u6240\u80fd\u9884\u6d4b\uff0c\u5c24\u5176\u5728\u4ee3\u7801\u4efb\u52a1\u3001\u957f\u6837\u672c\u548c\u66f4\u591a\u4e0a\u4e0b\u6587\u793a\u4f8b\u573a\u666f\u4e2d\u66f4\u660e\u663e\uff1b\u673a\u5236\u5206\u6790\u663e\u793a\u7b2c\u4e8c\u6b21\u8bbf\u95ee\u51cf\u5c11attention sink\u5e76\u589e\u5f3a\u5bf9\u5185\u5bb9\u76f8\u5173token\u7684\u5173\u6ce8\u3002"], "keywords": ["\u7a00\u758fMoE", "\u7f29\u653e\u5f8b", "Transformer", "\u9ad8\u6548\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2609.01343v1", "published_at": "2026-09-01", "score": 0.559, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (80\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01343.png", "title": "SMELT: Scaling Laws for Compute-Matched MoE Looped Transformers", "tldr": "SMELT\u8ba9MoE\u5faa\u73af\u5c42\u5728\u540c\u9884\u7b97\u4e0b\u66f4\u9ad8\u6548", "upvotes": 80, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u5728FLOPs\u3001\u53c2\u6570\u91cf\u548cKV cache\u5339\u914d\u6761\u4ef6\u4e0b\uff0cLooped Transformer\u662f\u5426\u4ecd\u6709\u4f18\u52bf\u3002\u4f5c\u8005\u63d0\u51faSMELT\uff1a\u7a00\u758fMoE Transformer\u5c06\u4e2d\u95f4\u4e00\u534a\u5c42\u5faa\u73af\u4e24\u6b21\uff0c\u5e76\u5efa\u7acb\u4e0d\u540c\u89c4\u6a21\u4e0b\u7684Chinchilla\u5f0f\u7f29\u653e\u5f8b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6392\u9664\u4e86\u989d\u5916\u8ba1\u7b97\u5e26\u6765\u7684\u6df7\u6dc6\uff0c\u8bc1\u660e\u5c42\u5faa\u73af\u672c\u8eab\u53ef\u5728\u540c\u9884\u7b97\u4e0b\u63d0\u5347Transformer\u6548\u7387\uff0c\u5e76\u7ed9\u51fa\u53ef\u6269\u5c55\u5230\u5927\u89c4\u6a21MoE\u6a21\u578b\u7684\u5b9e\u7528\u8bad\u7ec3\u914d\u65b9\u3002"}, {"abstract": "Evaluating LLM agents is essential for guiding their development, yet it has grown prohibitively expensive: a single pass of a frontier model over an agentic benchmark can cost hundreds to thousands of dollars, a price paid repeatedly across iterative development cycles. Prior efforts, centered on benchmark distillation, reduce the number of evaluation tasks but leave the cost of executing each retained task untouched. In this work, we introduce early outcome prediction, a complementary axis of efficiency that instead cuts cost within each task. Our key insight is that an agent\u0027s final outcome is often evident from its intermediate behavior well before execution completes. We instantiate this idea in EarlyEval, a lightweight framework that trains a pair of LightGBM success and failure classifiers over behavioral, textual, and reference-solution features, and halts an agent run the moment either classifier crosses a calibrated confidence threshold, adding negligible per-step overhead. Across three benchmarks, SWE-bench Verified, TerminalBench, and Toolathlon, EarlyEval can eliminate 13%-26% of agent steps and up to 44.1% input tokens and 29.4% output tokens at 89%-97% prediction accuracy, while perturbing per-agent resolve rates by only one to two percentage points on average.", "arxiv_id": "2609.02783", "arxiv_url": "https://arxiv.org/abs/2609.02783", "authors": ["Yuling Shi", "Zhensu Sun", "Junsen Dong", "Chengcheng Wan", "David Lo", "Xiaodong Gu"], "brief": "\u8bba\u6587\u63d0\u51fa EarlyEval\uff0c\u901a\u8fc7\u9884\u6d4b\u667a\u80fd\u4f53\u8fd0\u884c\u4e2d\u9014\u7684\u6700\u7ec8\u6210\u529f/\u5931\u8d25\u7ed3\u679c\uff0c\u5728\u7f6e\u4fe1\u5ea6\u8db3\u591f\u9ad8\u65f6\u63d0\u524d\u505c\u6b62\u4efb\u52a1\u6267\u884c\u3002\u5b83\u7528\u8f7b\u91cf\u7ea7 LightGBM \u5206\u7c7b\u5668\u7ed3\u5408\u884c\u4e3a\u3001\u6587\u672c\u548c\u53c2\u8003\u89e3\u7279\u5f81\uff0c\u5b9e\u73b0\u5bf9\u73b0\u6709\u667a\u80fd\u4f53\u57fa\u51c6\u8bc4\u6d4b\u7684\u4efb\u52a1\u5185\u964d\u672c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/inphotoo/earlyeval", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02783", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u540c\u4e8e\u51cf\u5c11\u8bc4\u6d4b\u4efb\u52a1\u6570\u91cf\u7684\u57fa\u51c6\u84b8\u998f\uff0cEarlyEval \u76f4\u63a5\u51cf\u5c11\u6bcf\u4e2a\u4efb\u52a1\u5185\u7684\u6267\u884c\u6b65\u9aa4\u548c token \u6d88\u8017\u3002", "\u5728 SWE-bench Verified\u3001TerminalBench\u3001Toolathlon \u4e09\u4e2a\u57fa\u51c6\u4e0a\uff0c\u53ef\u51cf\u5c11 13%-26% \u7684\u667a\u80fd\u4f53\u6b65\u9aa4\uff0c\u5e76\u6700\u591a\u8282\u7701 44.1% \u8f93\u5165 token\u300129.4% \u8f93\u51fa token\u3002", "\u65e9\u505c\u9884\u6d4b\u51c6\u786e\u7387\u8fbe\u5230 89%-97%\uff0c\u5bf9\u5404\u667a\u80fd\u4f53\u6700\u7ec8\u89e3\u51b3\u7387\u7684\u5e73\u5747\u6270\u52a8\u4ec5\u7ea6 1-2 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u8bc4\u6d4b", "\u6210\u672c\u4f18\u5316", "\u673a\u5668\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2609.02783v1", "published_at": "2026-09-02", "score": 0.524, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (37\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02783.png", "title": "EarlyEval: Cheaper Agent Evaluation via Early Outcome Prediction", "tldr": "\u7528\u65e9\u671f\u9884\u6d4b\u964d\u4f4eLLM\u667a\u80fd\u4f53\u8bc4\u6d4b\u6210\u672c", "upvotes": 37, "what_it_is": "\u8bba\u6587\u63d0\u51fa EarlyEval\uff0c\u901a\u8fc7\u9884\u6d4b\u667a\u80fd\u4f53\u8fd0\u884c\u4e2d\u9014\u7684\u6700\u7ec8\u6210\u529f/\u5931\u8d25\u7ed3\u679c\uff0c\u5728\u7f6e\u4fe1\u5ea6\u8db3\u591f\u9ad8\u65f6\u63d0\u524d\u505c\u6b62\u4efb\u52a1\u6267\u884c\u3002\u5b83\u7528\u8f7b\u91cf\u7ea7 LightGBM \u5206\u7c7b\u5668\u7ed3\u5408\u884c\u4e3a\u3001\u6587\u672c\u548c\u53c2\u8003\u89e3\u7279\u5f81\uff0c\u5b9e\u73b0\u5bf9\u73b0\u6709\u667a\u80fd\u4f53\u57fa\u51c6\u8bc4\u6d4b\u7684\u4efb\u52a1\u5185\u964d\u672c\u3002", "why_notable": "LLM \u667a\u80fd\u4f53\u8bc4\u6d4b\u6210\u672c\u6b63\u6210\u4e3a\u7814\u53d1\u74f6\u9888\uff0cEarlyEval \u63d0\u4f9b\u4e86\u4e00\u79cd\u4e0e\u57fa\u51c6\u538b\u7f29\u4e92\u8865\u3001\u6613\u90e8\u7f72\u4e14\u5f00\u9500\u5f88\u4f4e\u7684\u964d\u672c\u65b9\u6848\uff0c\u6709\u671b\u52a0\u901f\u667a\u80fd\u4f53\u8fed\u4ee3\u548c\u5927\u89c4\u6a21\u8bc4\u6d4b\u3002"}, {"abstract": "As agents move from research prototypes to deployed tools, their capability increasingly depends on model-external execution infrastructure, commonly termed the agent harness. Changing this harness while holding model weights fixed can substantially alter task performance. Current agent evaluations typically report downstream performance under a chosen harness, leaving a model\u0027s ability to develop the harness itself comparatively underexplored. We introduce HarnessDev, a benchmark that shifts the unit of evaluation from task outputs to runnable infrastructure. HarnessDev covers two stages. In Creation, the agent starts from a minimal seed and a small number of cases, then builds a complete execution system. In Evolution, it starts from its own created harness and iteratively revises it using downstream execution feedback, with the goal of improving benchmark performance. We then evaluate each constructed harness on capability (task success on held-out benchmarks) and efficiency (execution-token cost). The reported Creation results cover six creator LLMs, four domains, and five downstream benchmarks totaling 2,207 unique downstream instances, with hidden evaluation tasks withheld from development. We find that generated harnesses remain substantially behind mature human-engineered references on code and on search and research, while matching or exceeding the selected references on writing and machine-learning experimentation, with large variation in execution cost. Evolution produces some performance gains, but they are unstable and transfer only partially to held-out tasks. Experiments with a fixed runtime model further show that the gains depend strongly on the model executing the harness, indicating limited transfer across models.", "arxiv_id": "2609.01437", "arxiv_url": "https://arxiv.org/abs/2609.01437", "authors": ["Yuhao Wu", "Jingyuan Zhang", "Jiajun Shi", "Xinping Lei", "Qingshui Gu", "Yuxuan Zhang", "Zexuan Wang", "Chen He", "Chen Huang", "Maojia Song", "Zhiyuan Zeng", "Shaowen Wang", "Jinkai Liu", "Yunfeng Shi", "Jiaheng Liu", "Shen Yan", "Wenhao Huang", "Ge Zhang", "Wenxuan Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa HarnessDev \u57fa\u51c6\uff0c\u5c06\u8bc4\u6d4b\u5bf9\u8c61\u4ece\u667a\u80fd\u4f53\u4efb\u52a1\u7b54\u6848\u8f6c\u5411\u53ef\u8fd0\u884c\u7684\u5916\u90e8\u6267\u884c\u57fa\u7840\u8bbe\u65bd\uff08agent harness\uff09\u3002\u5b83\u8003\u5bdf LLM \u4ece\u6700\u5c0f\u79cd\u5b50\u521b\u5efa harness\uff0c\u5e76\u57fa\u4e8e\u4e0b\u6e38\u53cd\u9988\u8fed\u4ee3\u6f14\u5316 harness \u7684\u80fd\u529b\u3002", "categories": ["cs.SE", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01437", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6 Creation \u4e0e Evolution \u4e24\u9636\u6bb5\uff0c\u5206\u522b\u8bc4\u4f30\u4ece\u96f6\u6784\u5efa\u6267\u884c\u7cfb\u7edf\u548c\u57fa\u4e8e\u53cd\u9988\u6539\u8fdb\u7cfb\u7edf\u7684\u80fd\u529b", "\u5b9e\u9a8c\u5305\u542b6\u4e2a\u521b\u5efa\u6a21\u578b\u30014\u4e2a\u9886\u57df\u30015\u4e2a\u4e0b\u6e38\u57fa\u51c6\uff0c\u51712207\u4e2a\u72ec\u7acb\u6d4b\u8bd5\u5b9e\u4f8b\uff0c\u5e76\u4fdd\u7559\u9690\u85cf\u4efb\u52a1\u7528\u4e8e\u8bc4\u4f30", "\u751f\u6210\u7684 harness \u5728\u4ee3\u7801\u3001\u641c\u7d22\u4e0e\u7814\u7a76\u4efb\u52a1\u4e0a\u4ecd\u843d\u540e\u4e8e\u4eba\u5de5\u5de5\u7a0b\u5316\u53c2\u8003\uff0c\u4f46\u5728\u5199\u4f5c\u548c\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u4e2d\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u90e8\u5206\u53c2\u8003\uff0c\u4e14\u6267\u884c token \u6210\u672c\u5dee\u5f02\u5f88\u5927"], "keywords": ["\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6", "\u5de5\u5177\u8c03\u7528", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 1, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2609.01437v1", "published_at": "2026-09-01", "score": 0.509, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01437.png", "title": "HarnessDev: Can LLMs Create and Evolve Their Own Agent Harness?", "tldr": "\u8bc4\u6d4bLLM\u81ea\u5efa\u5e76\u8fed\u4ee3\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa HarnessDev \u57fa\u51c6\uff0c\u5c06\u8bc4\u6d4b\u5bf9\u8c61\u4ece\u667a\u80fd\u4f53\u4efb\u52a1\u7b54\u6848\u8f6c\u5411\u53ef\u8fd0\u884c\u7684\u5916\u90e8\u6267\u884c\u57fa\u7840\u8bbe\u65bd\uff08agent harness\uff09\u3002\u5b83\u8003\u5bdf LLM \u4ece\u6700\u5c0f\u79cd\u5b50\u521b\u5efa harness\uff0c\u5e76\u57fa\u4e8e\u4e0b\u6e38\u53cd\u9988\u8fed\u4ee3\u6f14\u5316 harness \u7684\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u80fd\u529b\u8bc4\u4f30\u63a8\u8fdb\u5230\u201c\u80fd\u5426\u81ea\u6211\u6784\u5efa\u5de5\u5177\u94fe/\u8fd0\u884c\u6846\u67b6\u201d\u5c42\u9762\uff0c\u63ed\u793a\u4e86\u6a21\u578b\u6743\u91cd\u4e4b\u5916\u7684\u6267\u884c\u57fa\u7840\u8bbe\u65bd\u5bf9\u667a\u80fd\u4f53\u8868\u73b0\u7684\u5173\u952e\u5f71\u54cd\uff0c\u4e5f\u6307\u51fa\u5f53\u524d harness \u6f14\u5316\u6536\u76ca\u4e0d\u7a33\u5b9a\u3001\u8de8\u6a21\u578b\u8fc1\u79fb\u6709\u9650\u3002"}, {"abstract": "Large language models (LLMs) increasingly interact with external environments and accumulate substantial behavioral experience, yet existing agent benchmarks largely evaluate them as fixed policies. It therefore remains unclear whether an agent can actively test its behavior, judge the resulting experience, and use that experience to improve future decisions. We introduce \\textbf{S\\textsuperscript{3}Gym}, an interactive benchmark for evaluating LLM self-improvement through three coupled capabilities: \\textbf{Self-Testing}, \\textbf{Self-Judging}, and \\textbf{Self-Improvement}. S$^3$Gym separates permissive exploration from strict held-out evaluation and instantiates this protocol in seven text-based games with executable environment verifiers. We evaluate three pathways for incorporating interaction experience: direct History ICL, score-conditioned Summary Memory, and parameter Training. Our experiments reveal that self-improvement is neither automatic nor uniform. Context-level experience improves performance for several model--game pairs, but the most effective pathway depends strongly on the task structure: summaries are beneficial when experience can be compressed into reusable strategic rules, yet often underperform raw history when success depends on precise, state-contingent information. Parameter training produces substantial gains on some tasks, but also exhibits unstable improvement and severe negative transfer on others. These findings show that recognizing successful actions is insufficient; agents must also transform feedback into executable and transferable policies. S$^3$Gym provides a unified framework for diagnosing this process and identifying the bottlenecks that prevent agents from translating interaction experience into reliable self-improvement.", "arxiv_id": "2608.31100", "arxiv_url": "https://arxiv.org/abs/2608.31100", "authors": ["Jiajun Shi", "Siyuan Tao", "Yuhao Wu", "Zexuan Wang", "Jingyuan Zhang", "Jiaheng Liu", "Xinping Lei", "Xinrong Zhang", "Siyuan Fang", "Zhewen Tan", "Tianle Cai", "Junhao Fang", "Jiameng Huang", "Yueyang Wang", "Jinkai Liu", "Yuxuan Zhang", "Jian Yang", "Zhoujun Li", "Shen Yan", "Wenhao Huang", "Ge Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa S3Gym\uff0c\u4e00\u4e2a\u4ea4\u4e92\u5f0f\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6587\u672c\u6e38\u620f\u73af\u5883\u4e2d\u901a\u8fc7\u81ea\u6211\u6d4b\u8bd5\u3001\u81ea\u6211\u5224\u65ad\u548c\u5229\u7528\u7ecf\u9a8c\u5b9e\u73b0\u81ea\u6211\u6539\u8fdb\u7684\u80fd\u529b\u3002\u5b83\u5c06\u81ea\u7531\u63a2\u7d22\u4e0e\u4e25\u683c\u7559\u51fa\u8bc4\u6d4b\u5206\u79bb\uff0c\u5e76\u57287\u4e2a\u5e26\u53ef\u6267\u884c\u9a8c\u8bc1\u5668\u7684\u6587\u672c\u6e38\u620f\u4e2d\u6d4b\u8bd5\u591a\u79cd\u7ecf\u9a8c\u5229\u7528\u8def\u5f84\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.31100", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u4f30\u4e09\u79cd\u7ecf\u9a8c\u5229\u7528\u65b9\u5f0f\uff1a\u76f4\u63a5\u4f7f\u7528\u5386\u53f2\u8f68\u8ff9\u505a\u4e0a\u4e0b\u6587\u5b66\u4e60\u3001\u57fa\u4e8e\u5f97\u5206\u7684\u6458\u8981\u8bb0\u5fc6\u3001\u4ee5\u53ca\u53c2\u6570\u8bad\u7ec3\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u81ea\u6211\u6539\u8fdb\u5e76\u975e\u81ea\u52a8\u53d1\u751f\uff1a\u4e0d\u540c\u6a21\u578b\u548c\u4efb\u52a1\u4e2d\uff0c\u539f\u59cb\u5386\u53f2\u3001\u6458\u8981\u89c4\u5219\u548c\u8bad\u7ec3\u7684\u6548\u679c\u5dee\u5f02\u5f88\u5927\u3002", "\u6458\u8981\u9002\u5408\u53ef\u538b\u7f29\u4e3a\u901a\u7528\u7b56\u7565\u7684\u4efb\u52a1\uff0c\u4f46\u5728\u4f9d\u8d56\u7cbe\u786e\u72b6\u6001\u4fe1\u606f\u7684\u4efb\u52a1\u4e2d\u4e0d\u5982\u539f\u59cb\u5386\u53f2\uff1b\u53c2\u6570\u8bad\u7ec3\u867d\u53ef\u5e26\u6765\u63d0\u5347\uff0c\u4e5f\u53ef\u80fd\u51fa\u73b0\u4e0d\u7a33\u5b9a\u548c\u4e25\u91cd\u8d1f\u8fc1\u79fb\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u6211\u6539\u8fdb", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.31100v1", "published_at": "2026-08-31", "score": 0.502, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31100.png", "title": "S3Gym: Can LLMs Turn Self-Testing and Self-Judging into Self-Improvement?", "tldr": "\u8bc4\u6d4bLLM\u80fd\u5426\u4ece\u81ea\u6d4b\u81ea\u8bc4\u4e2d\u81ea\u6211\u6539\u8fdb", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa S3Gym\uff0c\u4e00\u4e2a\u4ea4\u4e92\u5f0f\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728\u6587\u672c\u6e38\u620f\u73af\u5883\u4e2d\u901a\u8fc7\u81ea\u6211\u6d4b\u8bd5\u3001\u81ea\u6211\u5224\u65ad\u548c\u5229\u7528\u7ecf\u9a8c\u5b9e\u73b0\u81ea\u6211\u6539\u8fdb\u7684\u80fd\u529b\u3002\u5b83\u5c06\u81ea\u7531\u63a2\u7d22\u4e0e\u4e25\u683c\u7559\u51fa\u8bc4\u6d4b\u5206\u79bb\uff0c\u5e76\u57287\u4e2a\u5e26\u53ef\u6267\u884c\u9a8c\u8bc1\u5668\u7684\u6587\u672c\u6e38\u620f\u4e2d\u6d4b\u8bd5\u591a\u79cd\u7ecf\u9a8c\u5229\u7528\u8def\u5f84\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u4ece\u201c\u56fa\u5b9a\u7b56\u7565\u8868\u73b0\u201d\u63a8\u8fdb\u5230\u201c\u80fd\u5426\u4e3b\u52a8\u63a2\u7d22\u3001\u8bc4\u4f30\u7ecf\u9a8c\u5e76\u8f6c\u5316\u4e3a\u672a\u6765\u80fd\u529b\u201d\uff0c\u63ed\u793a\u4e86\u5f53\u524d\u667a\u80fd\u4f53\u81ea\u6211\u6539\u8fdb\u7684\u5173\u952e\u74f6\u9888\uff1a\u8bc6\u522b\u6210\u529f\u52a8\u4f5c\u8fd8\u4e0d\u591f\uff0c\u5fc5\u987b\u80fd\u628a\u53cd\u9988\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u8fc1\u79fb\u7684\u7b56\u7565\u3002"}, {"abstract": "Many important forms of human learning begin with a vague goal, such as \"become a better physicist\" or \"improve at research.\" Learners must interpret the goal, identify capability gaps, decide how to learn, and determine whether they have actually improved. In contrast, existing work on LLM self-evolution typically begins with tasks and evaluation metrics specified by humans, reducing self-evolution to optimizing an explicit objective rather than deciding what and how to learn. We introduce ASPIRE, a benchmark for vague-goal-driven self-evolution. ASPIRE provides only a natural-language capability goal while downstream evaluation tasks remain hidden. The agent must operationalize the goal by choosing data and update methods, constructing training and validation signals, and deciding when to evaluate. ASPIRE supports both model-weight and agent-harness evolution in a unified interactive environment and evaluates the resulting systems on a hidden, expert-authored set of 520 items spanning six goals. Our experiments show that vague goals redirect search effort toward goal interpretation. Current agents routinely complete training and harness-editing loops, but weight-level gains remain sparse and unstable, and the strongest evolved harness remains below the engineered Qwen-Agent reference. Agents often train on mismatched data and trust narrow self-evaluations, so local gains fail to transfer to hidden evaluation and continued search and training can erase earlier improvements.", "arxiv_id": "2608.31111", "arxiv_url": "https://arxiv.org/abs/2608.31111", "authors": ["Yuhao Wu", "Jingyuan Zhang", "Jiajun Shi", "Yuxuan Zhang", "Xinping Lei", "Junting Zhou", "Zexuan Wang", "Yuchen Wu", "Huan Zhou", "Duo Wang", "Yinzhu Piao", "Yongchang Peng", "Yunfeng Shi", "Jin Chen", "Zuo Wang", "Jinkai Liu", "Jiaheng Liu", "Wenxuan Zhang", "Shen Yan", "Wenhao Huang", "Ge Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa ASPIRE\uff0c\u4e00\u4e2a\u9762\u5411\u201c\u6a21\u7cca\u76ee\u6807\u9a71\u52a8\u81ea\u6211\u8fdb\u5316\u201d\u7684\u57fa\u51c6\uff1a\u53ea\u7ed9\u6a21\u578b\u81ea\u7136\u8bed\u8a00\u80fd\u529b\u76ee\u6807\uff0c\u4e0b\u6e38\u6d4b\u8bd5\u9690\u85cf\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u81ea\u884c\u89e3\u91ca\u76ee\u6807\u3001\u9009\u6570\u636e\u3001\u8bbe\u8ba1\u8bad\u7ec3/\u9a8c\u8bc1\u4fe1\u53f7\u5e76\u51b3\u5b9a\u4f55\u65f6\u8bc4\u4f30\u3002\u5b83\u7edf\u4e00\u652f\u6301\u6a21\u578b\u6743\u91cd\u8fdb\u5316\u4e0e agent harness \u8fdb\u5316\uff0c\u5e76\u57286\u7c7b\u76ee\u6807\u3001520\u4e2a\u4e13\u5bb6\u7f16\u5199\u9690\u85cf\u9898\u4e0a\u8bc4\u6d4b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.31111", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e0d\u540c\u4e8e\u65e2\u6709\u81ea\u6211\u8fdb\u5316\u7814\u7a76\u9884\u8bbe\u4efb\u52a1\u548c\u6307\u6807\uff0cASPIRE\u5c06\u6838\u5fc3\u96be\u70b9\u8f6c\u5411\u201c\u51b3\u5b9a\u5b66\u4ec0\u4e48\u3001\u600e\u4e48\u5b66\u3001\u5982\u4f55\u5224\u65ad\u8fdb\u6b65\u201d\u3002", "\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u80fd\u5b8c\u6210\u8bad\u7ec3\u548charness\u7f16\u8f91\u95ed\u73af\uff0c\u4f46\u6743\u91cd\u7ea7\u63d0\u5347\u7a00\u758f\u4e14\u4e0d\u7a33\u5b9a\u3002", "\u667a\u80fd\u4f53\u5e38\u4f7f\u7528\u4e0d\u5339\u914d\u6570\u636e\u5e76\u8fc7\u5ea6\u76f8\u4fe1\u72ed\u7a84\u81ea\u8bc4\uff0c\u5bfc\u81f4\u5c40\u90e8\u63d0\u5347\u96be\u8fc1\u79fb\u5230\u9690\u85cf\u8bc4\u6d4b\uff0c\u6301\u7eed\u641c\u7d22\u8fd8\u53ef\u80fd\u62b9\u6389\u65e9\u671f\u6536\u76ca\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u6211\u8fdb\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 1, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.31111v1", "published_at": "2026-08-31", "score": 0.502, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31111.png", "title": "Aspire: Can Models Self-Evolve from Vague Goals?", "tldr": "ASPIRE\u8bc4\u6d4bLLM\u80fd\u5426\u4ece\u6a21\u7cca\u76ee\u6807\u81ea\u6211\u8fdb\u5316", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa ASPIRE\uff0c\u4e00\u4e2a\u9762\u5411\u201c\u6a21\u7cca\u76ee\u6807\u9a71\u52a8\u81ea\u6211\u8fdb\u5316\u201d\u7684\u57fa\u51c6\uff1a\u53ea\u7ed9\u6a21\u578b\u81ea\u7136\u8bed\u8a00\u80fd\u529b\u76ee\u6807\uff0c\u4e0b\u6e38\u6d4b\u8bd5\u9690\u85cf\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u81ea\u884c\u89e3\u91ca\u76ee\u6807\u3001\u9009\u6570\u636e\u3001\u8bbe\u8ba1\u8bad\u7ec3/\u9a8c\u8bc1\u4fe1\u53f7\u5e76\u51b3\u5b9a\u4f55\u65f6\u8bc4\u4f30\u3002\u5b83\u7edf\u4e00\u652f\u6301\u6a21\u578b\u6743\u91cd\u8fdb\u5316\u4e0e agent harness \u8fdb\u5316\uff0c\u5e76\u57286\u7c7b\u76ee\u6807\u3001520\u4e2a\u4e13\u5bb6\u7f16\u5199\u9690\u85cf\u9898\u4e0a\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u81ea\u6211\u8fdb\u5316\u4ece\u663e\u5f0f\u76ee\u6807\u4f18\u5316\u63a8\u8fdb\u5230\u66f4\u8d34\u8fd1\u4eba\u7c7b\u5b66\u4e60\u7684\u6a21\u7cca\u76ee\u6807\u573a\u666f\uff0c\u63ed\u793a\u4e86\u5f53\u524d\u667a\u80fd\u4f53\u5728\u76ee\u6807\u89e3\u91ca\u3001\u81ea\u8bc4\u6cdb\u5316\u548c\u7a33\u5b9a\u8fdb\u5316\u4e0a\u7684\u5173\u952e\u77ed\u677f\uff0c\u5bf9\u6784\u5efa\u771f\u6b63\u81ea\u4e3b\u5b66\u4e60\u7cfb\u7edf\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Retrieval is the first stage of modern search and advertising systems, selecting a candidate set from a large item universe for downstream ranking and auction. Recent work increasingly leverages LLMs to improve retrieval through query expansion, data synthesis, and retrieval-feedback training. However, the generative component is typically used for query-side augmentation, while final matching is still delegated to a downstream retriever. We introduce CoGR, a retrieval framework that instead trains LLMs to directly construct retrieval representations on both query and item sides. Each generator produces a compact set of keywords, which are matched directly through an inverted index, preserving compatibility with existing keyword-based retrieval infrastructure. CoGR uses a two-stage training pipeline. Supervised fine-tuning first establishes an aligned keyword space, after which co-evolving reinforcement learning alternately optimizes the query- and item-side generators with GRPO against the opposite side\u0027s frozen index. Both sides optimize the same query-to-item retrieval $F_1$ objective: the query side receives retrieval $F_1$ directly, while the item side receives a counterfactual marginal reward measuring the change in query-side $F_1$ caused by its generated keywords. Across 10 representative sparse, dense, and generative baselines, CoGR achieves the best performance on both an internal APP Marketplace dataset and the public WANDS benchmark, improving $F_1$ over the strongest baseline by $10.9\\%$ and $36.1\\%$, respectively. Further analysis shows stable co-evolution and increasingly aligned query--item keyword spaces over training.", "arxiv_id": "2609.00638", "arxiv_url": "https://arxiv.org/abs/2609.00638", "authors": ["Runpeng Dai", "Kaili Huang", "Changsung Kang", "Ciya Liao"], "brief": "\u8bba\u6587\u63d0\u51fa CoGR\uff0c\u8ba9 LLM \u540c\u65f6\u4e3a\u67e5\u8be2\u4fa7\u548c\u7269\u54c1\u4fa7\u751f\u6210\u7d27\u51d1\u5173\u952e\u8bcd\u8868\u793a\uff0c\u5e76\u901a\u8fc7\u5012\u6392\u7d22\u5f15\u76f4\u63a5\u5339\u914d\u3002\u65b9\u6cd5\u5148\u7528\u76d1\u7763\u5fae\u8c03\u5bf9\u9f50\u5173\u952e\u8bcd\u7a7a\u95f4\uff0c\u518d\u7528\u534f\u540c\u6f14\u5316\u5f3a\u5316\u5b66\u4e60\u4ea4\u66ff\u4f18\u5316\u4e24\u4fa7\u751f\u6210\u5668\u3002", "categories": ["cs.IR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00638", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u67e5\u8be2\u4fa7\u4e0e\u7269\u54c1\u4fa7\u751f\u6210\u5668\u90fd\u8f93\u51fa\u5173\u952e\u8bcd\u96c6\u5408\uff0c\u517c\u5bb9\u73b0\u6709\u5173\u952e\u8bcd\u5012\u6392\u7d22\u5f15\u68c0\u7d22\u57fa\u7840\u8bbe\u65bd", "\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u5148\u76d1\u7763\u5fae\u8c03\u5efa\u7acb\u5bf9\u9f50\u5173\u952e\u8bcd\u7a7a\u95f4\uff0c\u518d\u7528 GRPO \u4ea4\u66ff\u4f18\u5316\u67e5\u8be2\u4fa7\u548c\u7269\u54c1\u4fa7\u751f\u6210\u5668", "\u7269\u54c1\u4fa7\u91c7\u7528\u53cd\u4e8b\u5b9e\u8fb9\u9645\u5956\u52b1\uff0c\u8861\u91cf\u5176\u5173\u952e\u8bcd\u5bf9\u67e5\u8be2\u4fa7\u68c0\u7d22 F1 \u7684\u589e\u91cf\u8d21\u732e\uff1b\u5728\u5185\u90e8 APP Marketplace \u548c WANDS \u4e0a\u5206\u522b\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 10.9% \u4e0e 36.1% F1"], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u751f\u6210\u5f0f\u68c0\u7d22"], "num_comments": 1, "on_hf": true, "organization": "Apple", "pdf_url": "https://arxiv.org/pdf/2609.00638v1", "published_at": "2026-09-01", "score": 0.501, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Apple", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00638.png", "title": "It Takes Two to Match: Co-Evolving Generative Retriever with Reinforcement Learning", "tldr": "\u53cc\u4fa7\u751f\u6210\u5173\u952e\u8bcd\u5e76\u534f\u540c\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u68c0\u7d22", "upvotes": 24, "what_it_is": "\u8bba\u6587\u63d0\u51fa CoGR\uff0c\u8ba9 LLM \u540c\u65f6\u4e3a\u67e5\u8be2\u4fa7\u548c\u7269\u54c1\u4fa7\u751f\u6210\u7d27\u51d1\u5173\u952e\u8bcd\u8868\u793a\uff0c\u5e76\u901a\u8fc7\u5012\u6392\u7d22\u5f15\u76f4\u63a5\u5339\u914d\u3002\u65b9\u6cd5\u5148\u7528\u76d1\u7763\u5fae\u8c03\u5bf9\u9f50\u5173\u952e\u8bcd\u7a7a\u95f4\uff0c\u518d\u7528\u534f\u540c\u6f14\u5316\u5f3a\u5316\u5b66\u4e60\u4ea4\u66ff\u4f18\u5316\u4e24\u4fa7\u751f\u6210\u5668\u3002", "why_notable": "\u76f8\u6bd4\u4ec5\u7528 LLM \u505a\u67e5\u8be2\u6269\u5c55\u6216\u6570\u636e\u589e\u5f3a\uff0cCoGR \u5c06\u751f\u6210\u5f0f\u80fd\u529b\u76f4\u63a5\u7528\u4e8e\u53cc\u4fa7\u68c0\u7d22\u8868\u793a\u6784\u5efa\uff0c\u5e76\u4fdd\u6301\u5de5\u4e1a\u5012\u6392\u7d22\u5f15\u53ef\u90e8\u7f72\u6027\uff1b\u5176\u534f\u540c\u5f3a\u5316\u5b66\u4e60\u673a\u5236\u663e\u8457\u63d0\u5347\u7a00\u758f\u3001\u7a20\u5bc6\u548c\u751f\u6210\u5f0f\u68c0\u7d22\u57fa\u7ebf\u8868\u73b0\u3002"}, {"abstract": "Competitive programming has become a key test of large language model reasoning, with international competitions such as IOI and ICPC representing its most challenging settings. We present an end-to-end specialization pipeline combining large-scale problem curation, synthetic reasoning traces, supervised fine-tuning (SFT), and reinforcement learning (RL). Using 22,000 curated problems, we train Nemotron-3-Nano-CC (30B-A3B) with SFT and RL and Nemotron-3-Ultra-CC (550B-A55B) with SFT alone. We further introduce GenCorrect, a feedback-driven test-time compute strategy that iteratively generates, evaluates, and refines diverse solutions. On IOI 2025, Nano-CC improves from 130 points to 291 after post-training and to 468 with GenCorrect, exceeding the gold threshold of 438.3 while Ultra-CC reaches 502. Guided by these results, we develop a competition-specific Ultra-CC system and evaluate it prospectively during IOI 2026. Under the same time, internet-access, and submission constraints as human contestants, it scores 535.4 out of 600, exceeding both the gold threshold of 361.12 and the top human score of 498.27. To our knowledge, this is the first AI system to outscore the highest-scoring human contestant on an IOI problem set.", "arxiv_id": "2609.02849", "arxiv_url": "https://arxiv.org/abs/2609.02849", "authors": ["Aleksander Ficek", "Sean Narenthiran", "Mehrzad Samadi", "Somshubra Majumdar", "Boris Ginsburg"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u7f16\u7a0b\u7ade\u8d5b\u7684\u7aef\u5230\u7aef\u540e\u8bad\u7ec3\u6d41\u7a0b\uff0c\u7ed3\u5408\u5927\u89c4\u6a21\u9898\u76ee\u6574\u7406\u3001\u5408\u6210\u63a8\u7406\u8f68\u8ff9\u3001SFT\u4e0eRL\uff0c\u4e13\u95e8\u5f3a\u5316\u6a21\u578b\u89e3\u9898\u80fd\u529b\u3002\u8fd8\u63d0\u51faGenCorrect\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7b56\u7565\uff0c\u901a\u8fc7\u751f\u6210\u3001\u8bc4\u6d4b\u4e0e\u8fed\u4ee3\u4fee\u6b63\u63d0\u5347\u7b54\u6848\u8d28\u91cf\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.MA", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02849", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u75282.2\u4e07\u9053\u7cbe\u9009\u7ade\u8d5b\u9898\u8bad\u7ec3Nemotron-3-Nano-CC\u548cNemotron-3-Ultra-CC\uff0c\u5176\u4e2dNano\u91c7\u7528SFT+RL\uff0cUltra\u91c7\u7528SFT\u3002", "\u5728IOI 2025\u4e0a\uff0cNano-CC\u4ece130\u5206\u63d0\u5347\u5230291\u5206\uff0c\u52a0\u5165GenCorrect\u540e\u8fbe\u5230468\u5206\uff0c\u8d85\u8fc7\u91d1\u724c\u7ebf\uff1bUltra-CC\u8fbe\u5230502\u5206\u3002", "\u9762\u5411IOI 2026\u7684\u7ade\u8d5b\u7cfb\u7edf\u5728\u771f\u5b9e\u53c2\u8d5b\u7ea6\u675f\u4e0b\u53d6\u5f97535.4/600\u5206\uff0c\u8d85\u8fc7\u91d1\u724c\u7ebf\u548c\u6700\u9ad8\u4eba\u7c7b\u9009\u624b498.27\u5206\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u63a8\u7406"], "num_comments": 0, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.02849v1", "published_at": "2026-09-02", "score": 0.497, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02849.png", "title": "Post-Training Language Models for Gold-Medal Performance in Coding Competitions", "tldr": "\u540e\u8bad\u7ec3\u8ba9\u5927\u6a21\u578b\u5728IOI\u8d85\u8d8a\u4eba\u7c7b\u51a0\u519b", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u9762\u5411\u7f16\u7a0b\u7ade\u8d5b\u7684\u7aef\u5230\u7aef\u540e\u8bad\u7ec3\u6d41\u7a0b\uff0c\u7ed3\u5408\u5927\u89c4\u6a21\u9898\u76ee\u6574\u7406\u3001\u5408\u6210\u63a8\u7406\u8f68\u8ff9\u3001SFT\u4e0eRL\uff0c\u4e13\u95e8\u5f3a\u5316\u6a21\u578b\u89e3\u9898\u80fd\u529b\u3002\u8fd8\u63d0\u51faGenCorrect\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u7b56\u7565\uff0c\u901a\u8fc7\u751f\u6210\u3001\u8bc4\u6d4b\u4e0e\u8fed\u4ee3\u4fee\u6b63\u63d0\u5347\u7b54\u6848\u8d28\u91cf\u3002", "why_notable": "\u8fd9\u662f\u7f16\u7a0b\u7ade\u8d5b\u63a8\u7406\u80fd\u529b\u7684\u91cd\u8981\u91cc\u7a0b\u7891\uff0c\u5c55\u793a\u4e86\u4e13\u95e8\u540e\u8bad\u7ec3\u4e0e\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u53ef\u4ee5\u663e\u8457\u63d0\u5347LLM\u5728\u9ad8\u96be\u5ea6\u7b97\u6cd5\u9898\u4e0a\u7684\u8868\u73b0\uff0c\u5e76\u9996\u6b21\u62a5\u544aAI\u7cfb\u7edf\u5728IOI\u9898\u96c6\u4e0a\u8d85\u8d8a\u6700\u9ad8\u5206\u4eba\u7c7b\u9009\u624b\u3002"}, {"abstract": "Logit-based knowledge distillation (KD) is used to train smaller language models (LMs) via supervision from stronger teachers, but whether its benefits are consistent across training stages remains unclear. Through controlled experiments, we find that forward Kullback-Leibler (KL) distillation--the standard KD formulation--with post-trained teachers behaves fundamentally differently during mid-training, an intermediate phase of self-supervised learning on curated corpora. Surprisingly, while forward KD simultaneously improves reasoning and factual recall during pre-training relative to standard next-token prediction (NTP), it instead slows factual recall acquisition during mid-training despite continued reasoning gains. We trace this stage dependence to an asymmetry in teacher confidence across data domains and the student\u0027s evolving knowledge state: teachers are more confident on procedural than knowledge-intensive data, while students acquire low-entropy factual knowledge earlier in training. To mitigate this imbalance, we propose Switch Distillation, a simple mid-training objective that distills on tokens where the teacher is confident, using teacher predictive entropy as a lightweight routing signal, and otherwise falls back to cross-entropy. Switch Distillation consistently outperforms existing distillation objectives across teacher sizes. Relative to standard NTP, it achieves 1.61-1.71x the reasoning performance and 1.13-1.19x the knowledge and commonsense performance while preserving 96.7-96.8% of factual recall. Crucially, these benefits persist after post-training: Switch Distillation closes the factual recall gap while maintaining 1.25-1.32x and 1.13-1.20x gains in reasoning and knowledge and commonsense, respectively.", "arxiv_id": "2609.01532", "arxiv_url": "https://arxiv.org/abs/2609.01532", "authors": ["Jacqueline He", "Howard Yen", "Shuyue Stella Li", "Margaret Li", "Hanqing Zeng", "Yinglong Xia", "Benyu Zhang", "Zhuokai Zhao", "Qiang Zhang", "Pang Wei Koh", "Luke Zettlemoyer", "Wen-tau Yih"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u57fa\u4e8e logits \u7684\u77e5\u8bc6\u84b8\u998f\u5728\u8bed\u8a00\u6a21\u578b\u4e0d\u540c\u8bad\u7ec3\u9636\u6bb5\u7684\u6548\u679c\uff0c\u53d1\u73b0\u6807\u51c6\u524d\u5411 KL \u84b8\u998f\u5728\u4e2d\u671f\u8bad\u7ec3\u4e2d\u4f1a\u7ee7\u7eed\u63d0\u5347\u63a8\u7406\u80fd\u529b\uff0c\u5374\u51cf\u6162\u4e8b\u5b9e\u77e5\u8bc6\u83b7\u53d6\u3002\u4f5c\u8005\u63d0\u51fa Switch Distillation\uff0c\u7528\u6559\u5e08\u9884\u6d4b\u71b5\u51b3\u5b9a\u4f55\u65f6\u84b8\u998f\u3001\u4f55\u65f6\u56de\u9000\u5230\u4ea4\u53c9\u71b5\u8bad\u7ec3\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/facebookresearch/midtraining-distillation", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01532", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u9636\u6bb5\u4f9d\u8d56\u73b0\u8c61\uff1a\u9884\u8bad\u7ec3\u9636\u6bb5\u524d\u5411 KL \u540c\u65f6\u63d0\u5347\u63a8\u7406\u4e0e\u4e8b\u5b9e\u56de\u5fc6\uff0c\u4f46\u4e2d\u671f\u8bad\u7ec3\u9636\u6bb5\u4f1a\u727a\u7272\u4e8b\u5b9e\u56de\u5fc6\u6765\u6362\u53d6\u63a8\u7406\u589e\u76ca\u3002", "\u673a\u5236\u89e3\u91ca\u4e3a\u6559\u5e08\u5728\u7a0b\u5e8f\u6027/\u63a8\u7406\u7c7b\u6570\u636e\u4e0a\u66f4\u81ea\u4fe1\uff0c\u800c\u5b66\u751f\u8f83\u65e9\u638c\u63e1\u4f4e\u71b5\u4e8b\u5b9e\u77e5\u8bc6\uff0c\u5bfc\u81f4\u84b8\u998f\u4fe1\u53f7\u5728\u4e0d\u540c\u6570\u636e\u57df\u4e0a\u5931\u8861\u3002", "Switch Distillation \u4ee5\u6559\u5e08\u9884\u6d4b\u71b5\u4f5c\u4e3a\u8f7b\u91cf\u8def\u7531\u4fe1\u53f7\uff0c\u4ec5\u5728\u6559\u5e08\u8db3\u591f\u81ea\u4fe1\u7684 token \u4e0a\u84b8\u998f\uff0c\u5426\u5219\u4f7f\u7528\u4ea4\u53c9\u71b5\uff1b\u76f8\u5bf9 NTP \u83b7\u5f97 1.61-1.71 \u500d\u63a8\u7406\u63d0\u5347\uff0c\u540c\u65f6\u4fdd\u7559\u7ea6 96.7-96.8% \u4e8b\u5b9e\u56de\u5fc6\u3002"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u8bad\u7ec3\u65b9\u6cd5"], "num_comments": 2, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2609.01532v1", "published_at": "2026-09-01", "score": 0.486, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01532.png", "title": "Knowledge Distillation During Mid-Training Favors Reasoning over Factual Recall", "tldr": "\u4e2d\u671f\u8bad\u7ec3\u84b8\u998f\u504f\u5411\u63a8\u7406\uff0c\u635f\u5bb3\u4e8b\u5b9e\u8bb0\u5fc6\u3002", "upvotes": 2, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u57fa\u4e8e logits \u7684\u77e5\u8bc6\u84b8\u998f\u5728\u8bed\u8a00\u6a21\u578b\u4e0d\u540c\u8bad\u7ec3\u9636\u6bb5\u7684\u6548\u679c\uff0c\u53d1\u73b0\u6807\u51c6\u524d\u5411 KL \u84b8\u998f\u5728\u4e2d\u671f\u8bad\u7ec3\u4e2d\u4f1a\u7ee7\u7eed\u63d0\u5347\u63a8\u7406\u80fd\u529b\uff0c\u5374\u51cf\u6162\u4e8b\u5b9e\u77e5\u8bc6\u83b7\u53d6\u3002\u4f5c\u8005\u63d0\u51fa Switch Distillation\uff0c\u7528\u6559\u5e08\u9884\u6d4b\u71b5\u51b3\u5b9a\u4f55\u65f6\u84b8\u998f\u3001\u4f55\u65f6\u56de\u9000\u5230\u4ea4\u53c9\u71b5\u8bad\u7ec3\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u63ed\u793a\u4e86\u77e5\u8bc6\u84b8\u998f\u5e76\u975e\u5728\u6240\u6709\u8bad\u7ec3\u9636\u6bb5\u90fd\u4e00\u81f4\u6709\u76ca\uff0c\u5c24\u5176\u6307\u51fa\u4e2d\u671f\u8bad\u7ec3\u4f1a\u51fa\u73b0\u63a8\u7406\u4e0e\u4e8b\u5b9e\u8bb0\u5fc6\u7684\u6743\u8861\uff1b\u63d0\u51fa\u7684\u71b5\u8def\u7531\u65b9\u6cd5\u7b80\u5355\u3001\u53ef\u6269\u5c55\uff0c\u5e76\u4e14\u5728\u540e\u8bad\u7ec3\u540e\u4ecd\u4fdd\u6301\u63a8\u7406\u4e0e\u77e5\u8bc6\u5e38\u8bc6\u589e\u76ca\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u8bad\u7ec3\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "Long-horizon complex tasks require foundation models to accumulate information, maintain internal states, and adapt over extended interactions. Safety should be an intrinsic property of the model itself, rather than a behavioral constraint relying solely on external safeguards or post-hoc alignment such as supervised fine-tuning. This motivates Safety from Within, where safety-relevant capabilities are represented and invoked through the model\u0027s native computation. We present Safin-1, a family of foundation models realizing this principle through memory routing and state evolution. Safin-1 is built on Memory-Anchor Routing across Context History (MARCH), a network architecture that maintains structured memory states and selectively retrieves relevant historical information through content-conditioned routing. It supports test-time adaptation of persistent capability states without repeatedly modifying the backbone, enabling controlled specialization over a shared foundation. We investigate this interface on downstream safety tasks through a Safety State, demonstrating effective state-based adaptation with substantial safety improvements. More broadly, the routed-state interface unifies contextual memory and persistent capability adaptation within the model\u0027s native computation, reframing memory from a passive record of prior context into an active substrate for maintaining and evolving model behavior. Evaluations across general capabilities, long-context understanding, retrieval, and efficiency further validate Safin-1. These findings provide a path toward safety as a state-native and adaptively maintainable capability. This work is only an initial architectural exploration of Safety from Within, and substantial further work is needed to realize this broader vision.", "arxiv_id": "2609.00092", "arxiv_url": "https://arxiv.org/abs/2609.00092", "authors": ["Ming Zhang", "Kaisen Yang", "Shu Yu", "Ermo Hua", "Zhekai Chen", "Cheng Jin", "Jingnan Zheng", "Yi Zhang", "Zhongtian Ma", "Jiawei Zhou", "Sirui Chen", "Qiaosheng Zhang", "Xiang Wang", "Ning Ding", "Xia Hu", "Bowen Zhou", "Youbang Sun", "Chaochao Lu"], "brief": "\u8bba\u6587\u63d0\u51fa Safin-1 \u7cfb\u5217\u57fa\u7840\u6a21\u578b\uff0c\u4e3b\u5f20\u201cSafety from Within\u201d\uff1a\u5c06\u5b89\u5168\u80fd\u529b\u4f5c\u4e3a\u6a21\u578b\u539f\u751f\u8ba1\u7b97\u4e2d\u7684\u53ef\u7ef4\u62a4\u72b6\u6001\uff0c\u800c\u975e\u4ec5\u4f9d\u8d56\u5916\u90e8\u62a4\u680f\u6216\u4e8b\u540e\u5bf9\u9f50\u3002\u5176\u6838\u5fc3\u67b6\u6784 MARCH \u901a\u8fc7\u8bb0\u5fc6\u8def\u7531\u4e0e\u72b6\u6001\u6f14\u5316\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u4e2d\u7ef4\u62a4\u7ed3\u6784\u5316\u8bb0\u5fc6\u5e76\u652f\u6301\u6d4b\u8bd5\u65f6\u5b89\u5168\u72b6\u6001\u9002\u914d\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/AI45Lab/Safin-1", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.00092", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa MARCH\uff08Memory-Anchor Routing across Context History\uff09\uff0c\u7528\u5185\u5bb9\u6761\u4ef6\u8def\u7531\u9009\u62e9\u6027\u68c0\u7d22\u5386\u53f2\u4fe1\u606f\u5e76\u7ef4\u62a4\u7ed3\u6784\u5316\u8bb0\u5fc6\u72b6\u6001", "\u5f15\u5165 Safety State\uff0c\u4f7f\u6a21\u578b\u53ef\u5728\u4e0d\u53cd\u590d\u4fee\u6539\u4e3b\u5e72\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u8fdb\u884c\u6d4b\u8bd5\u65f6\u6301\u4e45\u80fd\u529b\u9002\u914d", "\u5728\u5b89\u5168\u4efb\u52a1\u3001\u957f\u4e0a\u4e0b\u6587\u7406\u89e3\u3001\u68c0\u7d22\u3001\u6548\u7387\u548c\u901a\u7528\u80fd\u529b\u8bc4\u6d4b\u4e2d\u9a8c\u8bc1\u4e86\u72b6\u6001\u5316\u9002\u914d\u7684\u6709\u6548\u6027"], "keywords": ["\u6a21\u578b\u5b89\u5168", "\u8bb0\u5fc6\u673a\u5236", "\u72b6\u6001\u7a7a\u95f4", "\u6d4b\u8bd5\u65f6\u9002\u914d"], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2609.00092v1", "published_at": "2026-08-31", "score": 0.48, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00092.png", "title": "Safin-1: Safety from Within through Memory-Native State Evolution", "tldr": "\u7528\u5185\u751f\u8bb0\u5fc6\u72b6\u6001\u63d0\u5347\u6a21\u578b\u5b89\u5168\u6027", "upvotes": 20, "what_it_is": "\u8bba\u6587\u63d0\u51fa Safin-1 \u7cfb\u5217\u57fa\u7840\u6a21\u578b\uff0c\u4e3b\u5f20\u201cSafety from Within\u201d\uff1a\u5c06\u5b89\u5168\u80fd\u529b\u4f5c\u4e3a\u6a21\u578b\u539f\u751f\u8ba1\u7b97\u4e2d\u7684\u53ef\u7ef4\u62a4\u72b6\u6001\uff0c\u800c\u975e\u4ec5\u4f9d\u8d56\u5916\u90e8\u62a4\u680f\u6216\u4e8b\u540e\u5bf9\u9f50\u3002\u5176\u6838\u5fc3\u67b6\u6784 MARCH \u901a\u8fc7\u8bb0\u5fc6\u8def\u7531\u4e0e\u72b6\u6001\u6f14\u5316\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u4e2d\u7ef4\u62a4\u7ed3\u6784\u5316\u8bb0\u5fc6\u5e76\u652f\u6301\u6d4b\u8bd5\u65f6\u5b89\u5168\u72b6\u6001\u9002\u914d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5b89\u5168\u5bf9\u9f50\u4ece\u5916\u90e8\u7ea6\u675f\u63a8\u8fdb\u5230\u6a21\u578b\u5185\u90e8\u72b6\u6001\u4e0e\u8bb0\u5fc6\u673a\u5236\u5c42\u9762\uff0c\u5c1d\u8bd5\u628a\u8bb0\u5fc6\u4ece\u88ab\u52a8\u4e0a\u4e0b\u6587\u8bb0\u5f55\u8f6c\u53d8\u4e3a\u4e3b\u52a8\u8c03\u63a7\u884c\u4e3a\u7684\u8ba1\u7b97\u57fa\u5e95\uff0c\u5bf9\u957f\u7a0b\u4ea4\u4e92\u6a21\u578b\u548c\u53ef\u6301\u7eed\u5b89\u5168\u9002\u914d\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Valuable data remains embedded in unstructured sources: web pages, reports, contracts, filings, earnings calls, and PDFs. The big bet in enterprise AI is deploying LLM agents that reason over this data to answer complex questions for every knowledge worker. Agents can do this today, but at prohibitive cost. Each question repeatedly opens large documents to recover scattered evidence, consuming up to a million tokens. However, if the data were already structured, the same question would reduce to a cheap database lookup. For example, on FanOutQA benchmark, reasoning over an ideal pre-structured store is 28X cheaper, and the gap grows to orders of magnitude as questions fan out over more documents. Yet structuring everything in advance is not viable: documents hold vastly more possible structure than any workload will use, and the useful structure and documents are unknown until queries arrive. We propose agentic data cracking, a method that structures unstructured data adaptively and speculatively as a byproduct of reasoning itself. Structuring is adaptive because observed queries decide when it happens and what matters, and speculative because it goes beyond the current question. Whenever the agent opens a document to answer, a cracking sub-agent forks from the already-loaded context at marginal cost and extracts grounded structure likely to serve related future queries. Over time, an increasing share of queries is fully covered by structured data and answered without opening a document, keeping agentic accuracy at close to RAG cost. On FanOutQA, extended with merely one related question per test question, cracking cuts cost by 53% while preserving accuracy. Agentic data cracking is a first step toward next-generation data infrastructure for agentic reasoning over unstructured data: a shared substrate beneath the model where knowledge that reasoning already paid to uncover accumulates.", "arxiv_id": "2608.31082", "arxiv_url": "https://arxiv.org/abs/2608.31082", "authors": ["Milad Rezaei Hajidehi", "Qitong Wang", "Stratos Idreos"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cagentic data cracking\u201d\uff1aLLM \u667a\u80fd\u4f53\u5728\u6253\u5f00\u6587\u6863\u56de\u7b54\u95ee\u9898\u65f6\uff0c\u987a\u624b\u7531\u5b50\u667a\u80fd\u4f53\u62bd\u53d6\u53ef\u590d\u7528\u7684\u7ed3\u6784\u5316\u4fe1\u606f\u3002\u968f\u7740\u67e5\u8be2\u79ef\u7d2f\uff0c\u540e\u7eed\u95ee\u9898\u53ef\u66f4\u591a\u4f9d\u8d56\u7ed3\u6784\u5316\u5b58\u50a8\u56de\u7b54\uff0c\u51cf\u5c11\u53cd\u590d\u8bfb\u53d6\u957f\u6587\u6863\u7684 token \u6d88\u8017\u3002", "categories": ["cs.AI", "cs.CL", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.31082", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u4f01\u4e1a\u7ea7\u975e\u7ed3\u6784\u5316\u6570\u636e\u63a8\u7406\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u590d\u6742\u95ee\u9898\u9700\u53cd\u590d\u8bfb\u53d6\u7f51\u9875\u3001PDF\u3001\u8d22\u62a5\u7b49\u5927\u6587\u6863\uff0c\u5355\u6b21\u53ef\u6d88\u8017\u9ad8\u8fbe\u767e\u4e07 token", "\u65b9\u6cd5\u5177\u6709\u81ea\u9002\u5e94\u4e0e\u63a8\u6d4b\u6027\uff1a\u7531\u771f\u5b9e\u67e5\u8be2\u51b3\u5b9a\u4f55\u65f6\u3001\u62bd\u53d6\u4ec0\u4e48\u7ed3\u6784\uff0c\u540c\u65f6\u989d\u5916\u62bd\u53d6\u53ef\u80fd\u670d\u52a1\u672a\u6765\u76f8\u5173\u95ee\u9898\u7684\u4fe1\u606f", "\u5728\u6269\u5c55\u540e\u7684 FanOutQA \u4e0a\uff0c\u4ec5\u4e3a\u6bcf\u4e2a\u6d4b\u8bd5\u95ee\u9898\u589e\u52a0\u4e00\u4e2a\u76f8\u5173\u95ee\u9898\uff0c\u6210\u672c\u964d\u4f4e 53%\uff0c\u540c\u65f6\u4fdd\u6301\u63a5\u8fd1\u539f\u667a\u80fd\u4f53\u7684\u51c6\u786e\u7387"], "keywords": ["\u667a\u80fd\u4f53", "\u975e\u7ed3\u6784\u5316\u6570\u636e", "\u4fe1\u606f\u62bd\u53d6", "RAG"], "num_comments": 2, "on_hf": true, "organization": "Harvard University", "pdf_url": "https://arxiv.org/pdf/2608.31082v1", "published_at": "2026-08-31", "score": 0.474, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31082.png", "title": "Token-Efficient Data Reasoning Agents via Adaptive Structuring of Unstructured Data", "tldr": "\u8fb9\u63a8\u7406\u8fb9\u7ed3\u6784\u5316\uff0c\u964d\u4f4e\u975e\u7ed3\u6784\u5316\u6570\u636e\u95ee\u7b54\u6210\u672c", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201cagentic data cracking\u201d\uff1aLLM \u667a\u80fd\u4f53\u5728\u6253\u5f00\u6587\u6863\u56de\u7b54\u95ee\u9898\u65f6\uff0c\u987a\u624b\u7531\u5b50\u667a\u80fd\u4f53\u62bd\u53d6\u53ef\u590d\u7528\u7684\u7ed3\u6784\u5316\u4fe1\u606f\u3002\u968f\u7740\u67e5\u8be2\u79ef\u7d2f\uff0c\u540e\u7eed\u95ee\u9898\u53ef\u66f4\u591a\u4f9d\u8d56\u7ed3\u6784\u5316\u5b58\u50a8\u56de\u7b54\uff0c\u51cf\u5c11\u53cd\u590d\u8bfb\u53d6\u957f\u6587\u6863\u7684 token \u6d88\u8017\u3002", "why_notable": "\u5b83\u628a\u975e\u7ed3\u6784\u5316\u6570\u636e\u95ee\u7b54\u4ece\u201c\u6bcf\u6b21\u91cd\u65b0\u8bfb\u6587\u6863\u201d\u8f6c\u5411\u201c\u63a8\u7406\u8fc7\u7a0b\u4e2d\u9010\u6b65\u6c89\u6dc0\u7ed3\u6784\u5316\u77e5\u8bc6\u201d\uff0c\u517c\u987e\u667a\u80fd\u4f53\u51c6\u786e\u6027\u4e0e\u63a5\u8fd1 RAG/\u6570\u636e\u5e93\u67e5\u8be2\u7684\u6210\u672c\uff0c\u5bf9\u4f01\u4e1a\u77e5\u8bc6\u5e93\u548c\u6570\u636e\u57fa\u7840\u8bbe\u65bd\u5f88\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal geometry reasoning requires VLMs to extract precise visual relations and preserve them through multi-step deduction. Existing free-form traces obscure the decisions that determine the answer, and trajectory-level reinforcement learning distributes a single terminal signal across the entire response. We introduce credit-addressable reasoning, in which the semantic units exposed during inference also define where learning compares alternatives and assigns credit. We instantiate this principle with Code-CoT, which retains the diagram, represents visual relations as line-addressable executable code, and organizes reasoning into typed events, and CE-GRPO, which selects event boundaries using structural priors and type-normalized entropy, samples complete continuations from shared prefixes, and converts outcome differences into localized advantages. Across nine geometry benchmarks, CE-GRPO achieves an average accuracy of 76.04, outperforming Qwen3-VL-8B and trajectory-level GRPO by $8.09$ and 3.43 points, respectively. Its relative advantage increases with the number of intermediate events, demonstrating the value of representation--optimization co-design for long, dependency-heavy multimodal reasoning.", "arxiv_id": "2608.30457", "arxiv_url": "https://arxiv.org/abs/2608.30457", "authors": ["Jiani Guo", "Junjie Wang", "Jie Wu", "Pengxiang Zhao", "Dongdong Zhang", "Shaohan Huang", "Yujiu Yang", "Furu Wei"], "brief": "\u672c\u6587\u63d0\u51fa\u201ccredit-addressable reasoning\u201d\uff0c\u8ba9\u63a8\u7406\u4e2d\u7684\u8bed\u4e49\u5355\u5143\u540c\u65f6\u6210\u4e3a\u5f3a\u5316\u5b66\u4e60\u5206\u914d\u4fe1\u7528\u7684\u5355\u4f4d\u3002\u5177\u4f53\u5b9e\u73b0\u4e3a Code-CoT \u8868\u793a\u51e0\u4f55\u5173\u7cfb\u4e0e\u63a8\u7406\u4e8b\u4ef6\uff0c\u914d\u5408 CE-GRPO \u5728\u4e8b\u4ef6\u8fb9\u754c\u4e0a\u6bd4\u8f83\u7ed3\u679c\u5e76\u5c40\u90e8\u66f4\u65b0\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30457", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Code-CoT \u4fdd\u7559\u56fe\u50cf\u4fe1\u606f\uff0c\u5c06\u89c6\u89c9\u51e0\u4f55\u5173\u7cfb\u8868\u793a\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9010\u884c\u5b9a\u4f4d\u7684\u4ee3\u7801\uff0c\u5e76\u6309\u7c7b\u578b\u7ec4\u7ec7\u63a8\u7406\u4e8b\u4ef6", "CE-GRPO \u5229\u7528\u7ed3\u6784\u5148\u9a8c\u4e0e\u7c7b\u578b\u5f52\u4e00\u5316\u71b5\u9009\u62e9\u4e8b\u4ef6\u8fb9\u754c\uff0c\u4ece\u5171\u4eab\u524d\u7f00\u91c7\u6837\u5b8c\u6574\u7eed\u5199\uff0c\u5c06\u7ed3\u679c\u5dee\u5f02\u8f6c\u5316\u4e3a\u5c40\u90e8\u4f18\u52bf\u4fe1\u53f7", "\u5728\u4e5d\u4e2a\u51e0\u4f55\u63a8\u7406\u57fa\u51c6\u4e0a\u5e73\u5747\u51c6\u786e\u7387\u8fbe 76.04\uff0c\u6bd4 Qwen3-VL-8B \u9ad8 8.09 \u5206\uff0c\u6bd4\u8f68\u8ff9\u7ea7 GRPO \u9ad8 3.43 \u5206"], "keywords": ["\u591a\u6a21\u6001\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u51e0\u4f55\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua IIGroup", "pdf_url": "https://arxiv.org/pdf/2608.30457v1", "published_at": "2026-08-31", "score": 0.47, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30457.png", "title": "Learning Where Outcomes Change:Credit-Addressable Reasoning for Multimodal Geometry", "tldr": "\u7528\u53ef\u5b9a\u4f4d\u4ee3\u7801\u63a8\u7406\u6539\u8fdb\u591a\u6a21\u6001\u51e0\u4f55\u89e3\u9898", "upvotes": 6, "what_it_is": "\u672c\u6587\u63d0\u51fa\u201ccredit-addressable reasoning\u201d\uff0c\u8ba9\u63a8\u7406\u4e2d\u7684\u8bed\u4e49\u5355\u5143\u540c\u65f6\u6210\u4e3a\u5f3a\u5316\u5b66\u4e60\u5206\u914d\u4fe1\u7528\u7684\u5355\u4f4d\u3002\u5177\u4f53\u5b9e\u73b0\u4e3a Code-CoT \u8868\u793a\u51e0\u4f55\u5173\u7cfb\u4e0e\u63a8\u7406\u4e8b\u4ef6\uff0c\u914d\u5408 CE-GRPO \u5728\u4e8b\u4ef6\u8fb9\u754c\u4e0a\u6bd4\u8f83\u7ed3\u679c\u5e76\u5c40\u90e8\u66f4\u65b0\u3002", "why_notable": "\u8bba\u6587\u628a\u201c\u63a8\u7406\u8868\u793a\u201d\u548c\u201c\u5f3a\u5316\u5b66\u4e60\u4fe1\u7528\u5206\u914d\u201d\u8054\u5408\u8bbe\u8ba1\uff0c\u7f13\u89e3\u4e86\u957f\u94fe\u591a\u6a21\u6001\u63a8\u7406\u4e2d\u7ec8\u5c40\u5956\u52b1\u96be\u4ee5\u5b9a\u4f4d\u5173\u952e\u51b3\u7b56\u7684\u95ee\u9898\uff1b\u5728\u4e2d\u95f4\u4e8b\u4ef6\u66f4\u591a\u3001\u4f9d\u8d56\u66f4\u590d\u6742\u7684\u9898\u76ee\u4e0a\u4f18\u52bf\u66f4\u660e\u663e\uff0c\u5177\u6709\u63d0\u5347 VLM \u590d\u6742\u51e0\u4f55\u63a8\u7406\u80fd\u529b\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM judges are widely used to evaluate agentic tool-calling systems, yet their reliability on structured, dependency-driven workflows remains largely unexamined. We present AgentJudgeBench, the first benchmark to systematically study LLM-as-a-judge reliability for agentic tool-calling over workflow DAGs, as distinct from the broader LLM-as-a-judge task of open-ended text or preference evaluation. The benchmark comprises 3,808 instances spanning six DAG topologies and three difficulty tiers, evaluated with five generators (3B-70B open-weight models and GPT-5.4) and six judges (20B to frontier scale) under paired with- and without-ground-truth conditions. Judge alignment degrades monotonically with task difficulty, 1.5x faster without ground truth, and on hard queries without ground truth all six judges converge to a narrow 77-82% band regardless of scale, revealing a structural ceiling driven primarily by task difficulty, though its height is partly prompt-dependent for weaker generators, that model capacity alone cannot overcome. Ground-truth exposure is not uniformly beneficial: it reduces alignment for GPT-5.4 (1.5 pp) and Gemini-2.5-Pro (3.9 pp), consistent with over-anchoring. Among mitigation strategies, chain-of-thought reasoning and judge temperature both have negligible effect, while structured evaluation rubrics improve alignment by up to 6.5 pp but do not generalize uniformly across judge-generator pairs. With ground truth, QwQ-32B best matches the programmatic reference, while a human validation study identifies GPT-OSS-120B as the most human-aligned judge; without it, frontier judges lead only marginally within the shared ceiling. These results expose fundamental limitations of current LLM judges and yield practical guidelines for reliable evaluation in agentic systems.", "arxiv_id": "2608.26623", "arxiv_url": "https://arxiv.org/abs/2608.26623", "authors": ["Abhigya Verma", "Amit Kumar Saha", "Seganrasan Subramanian", "Sai Harshitha Aluru"], "brief": "\u8bba\u6587\u63d0\u51fa AgentJudgeBench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30 LLM-as-a-judge \u5728\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u3001\u5c24\u5176\u662f\u4f9d\u8d56\u9a71\u52a8\u7684\u5de5\u4f5c\u6d41 DAG \u4e0a\u7684\u53ef\u9760\u6027\u3002\u57fa\u51c6\u5305\u542b 3808 \u4e2a\u6837\u4f8b\uff0c\u8986\u76d6 6 \u7c7b DAG \u62d3\u6251\u30013 \u4e2a\u96be\u5ea6\u5c42\u7ea7\uff0c\u5e76\u6bd4\u8f83\u591a\u79cd\u751f\u6210\u5668\u3001\u88c1\u5224\u6a21\u578b\u53ca\u6709\u65e0\u6807\u51c6\u7b54\u6848\u6761\u4ef6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26623", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u88c1\u5224\u4e00\u81f4\u6027\u4f1a\u968f\u4efb\u52a1\u96be\u5ea6\u5355\u8c03\u4e0b\u964d\uff1b\u65e0\u6807\u51c6\u7b54\u6848\u65f6\u4e0b\u964d\u901f\u5ea6\u7ea6\u5feb 1.5 \u500d\uff0c\u56f0\u96be\u4efb\u52a1\u4e0a\u4e0d\u540c\u89c4\u6a21\u88c1\u5224\u90fd\u6536\u655b\u5728 77-82% \u7684\u7a84\u533a\u95f4\uff0c\u663e\u793a\u5b58\u5728\u7ed3\u6784\u6027\u4e0a\u9650\u3002", "\u6807\u51c6\u7b54\u6848\u5e76\u975e\u603b\u662f\u6709\u76ca\uff1a\u5bf9 GPT-5.4 \u548c Gemini-2.5-Pro \u53cd\u800c\u964d\u4f4e\u5bf9\u9f50\u5ea6\uff0c\u53ef\u80fd\u6e90\u4e8e\u8fc7\u5ea6\u951a\u5b9a\u3002", "Chain-of-thought \u548c\u6e29\u5ea6\u8c03\u8282\u5f71\u54cd\u5f88\u5c0f\uff1b\u7ed3\u6784\u5316\u8bc4\u5206\u89c4\u7a0b\u6700\u591a\u63d0\u5347 6.5 \u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u8de8\u88c1\u5224-\u751f\u6210\u5668\u7ec4\u5408\u7684\u6cdb\u5316\u4e0d\u7a33\u5b9a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u8bc4\u6d4b\u57fa\u51c6", "LLM\u88c1\u5224"], "num_comments": 2, "on_hf": true, "organization": "ServiceNow-AI", "pdf_url": "https://arxiv.org/pdf/2608.26623v1", "published_at": "2026-08-27", "score": 0.432, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26623.png", "title": "AgentJudgeBench: A Multi-Difficulty Benchmark for Evaluating LLM Judges on Agentic Tool-Calling", "tldr": "\u9996\u4e2a\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u88c1\u5224\u53ef\u9760\u6027\u57fa\u51c6", "upvotes": 17, "what_it_is": "\u8bba\u6587\u63d0\u51fa AgentJudgeBench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30 LLM-as-a-judge \u5728\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u3001\u5c24\u5176\u662f\u4f9d\u8d56\u9a71\u52a8\u7684\u5de5\u4f5c\u6d41 DAG \u4e0a\u7684\u53ef\u9760\u6027\u3002\u57fa\u51c6\u5305\u542b 3808 \u4e2a\u6837\u4f8b\uff0c\u8986\u76d6 6 \u7c7b DAG \u62d3\u6251\u30013 \u4e2a\u96be\u5ea6\u5c42\u7ea7\uff0c\u5e76\u6bd4\u8f83\u591a\u79cd\u751f\u6210\u5668\u3001\u88c1\u5224\u6a21\u578b\u53ca\u6709\u65e0\u6807\u51c6\u7b54\u6848\u6761\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f53\u524d LLM \u88c1\u5224\u5728\u8bc4\u4f30\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u65f6\u5b58\u5728\u7531\u4efb\u52a1\u7ed3\u6784\u548c\u96be\u5ea6\u5bfc\u81f4\u7684\u53ef\u9760\u6027\u74f6\u9888\uff0c\u5355\u7eaf\u6269\u5927\u6a21\u578b\u89c4\u6a21\u96be\u4ee5\u89e3\u51b3\uff1b\u540c\u65f6\u4e3a\u6784\u5efa\u66f4\u53ef\u4fe1\u7684\u667a\u80fd\u4f53\u8bc4\u6d4b\u6d41\u7a0b\u63d0\u4f9b\u4e86\u5b9e\u8bc1\u4f9d\u636e\u548c\u5b9e\u8df5\u5efa\u8bae\u3002"}, {"abstract": "Large language models (LLMs) are increasingly evolving from conversational assistants into agents capable of operating external digital environments. Graphical user interface (GUI) agents play an important role in this transition, as many real-world workflows remain accessible only through user-facing software interfaces. However, despite recent progress on general computer-use benchmarks, domain-specific professional standard operating procedures (SOPs) remain challenging for GUI agents because they often involve implicit domain knowledge, software-specific conventions, and task-level verification requirements. We introduce OmegaUse-SOP, a human-in-the-loop SOP Engineering system for transforming human demonstrations of professional computer use into reusable SOP skills for GUI agents. Analogous to prompt engineering, SOP Engineering iteratively refines demonstrations, execution rules, and domain knowledge to convert professional SOPs into reusable GUI-agent skills. OmegaUse-SOP consists of four modules: Observe, Reason, Configure, and Execute. Together, these modules record expert operations as multimodal GUI traces, abstract low-level events into semantic step-level instructions, incorporate domain rules and task-specific parameters, and execute the resulting skills in live GUI environments through step-wise grounding, action generation, and verification. To demonstrate its effectiveness, we collaborate with a power-sector client and test OmegaUse-SOP on photovoltaic simulation workflows in PVsyst 7.2. The results suggest that OmegaUse-SOP can improve GUI-agent reliability on professional SOP tasks, highlighting a practical path toward deploying GUI agents in domain-specific professional software environments.", "arxiv_id": "2609.02149", "arxiv_url": "https://arxiv.org/abs/2609.02149", "authors": ["Yixiong Xiao", "Lang An", "Hucheng Yang", "Pinxue Ma", "Yongquan Chen", "Jingjia Cao", "Yusai Zhao", "Ting Wang", "Ting Liu", "Siqi Bao", "Jingbo Zhou", "Hua Wu"], "brief": "\u8bba\u6587\u63d0\u51fa OmegaUse-SOP\uff0c\u4e00\u4e2a\u4eba\u5728\u73af\u8def\u7684 SOP Engineering \u7cfb\u7edf\uff0c\u7528\u4e8e\u628a\u4e13\u4e1a\u8f6f\u4ef6\u4e2d\u7684\u4eba\u7c7b\u64cd\u4f5c\u6f14\u793a\u8f6c\u5316\u4e3a GUI \u667a\u80fd\u4f53\u53ef\u590d\u7528\u7684\u6d41\u7a0b\u6280\u80fd\u3002\u7cfb\u7edf\u901a\u8fc7\u8bb0\u5f55\u3001\u62bd\u8c61\u3001\u914d\u7f6e\u4e0e\u6267\u884c\uff0c\u5c06\u4f4e\u5c42\u70b9\u51fb\u952e\u5165\u8f68\u8ff9\u5347\u7ea7\u4e3a\u5e26\u9886\u57df\u89c4\u5219\u548c\u9a8c\u8bc1\u673a\u5236\u7684\u8bed\u4e49\u5316\u64cd\u4f5c\u6b65\u9aa4\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02149", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b Observe\u3001Reason\u3001Configure\u3001Execute \u56db\u4e2a\u6a21\u5757\uff0c\u8986\u76d6\u4e13\u5bb6\u6f14\u793a\u8bb0\u5f55\u3001\u8bed\u4e49\u6b65\u9aa4\u62bd\u8c61\u3001\u9886\u57df\u89c4\u5219\u6ce8\u5165\u548c\u5b9e\u65f6GUI\u6267\u884c", "\u5f3a\u8c03 SOP Engineering \u7c7b\u4f3c prompt engineering\uff0c\u901a\u8fc7\u8fed\u4ee3\u4f18\u5316\u6f14\u793a\u3001\u6267\u884c\u89c4\u5219\u548c\u9886\u57df\u77e5\u8bc6\u63d0\u5347\u4e13\u4e1a\u4efb\u52a1\u53ef\u9760\u6027", "\u5728\u7535\u529b\u884c\u4e1a\u5ba2\u6237\u7684 PVsyst 7.2 \u5149\u4f0f\u4eff\u771f\u5de5\u4f5c\u6d41\u4e0a\u9a8c\u8bc1\uff0c\u663e\u793a\u53ef\u63d0\u5347 GUI \u667a\u80fd\u4f53\u6267\u884c\u4e13\u4e1aSOP\u4efb\u52a1\u7684\u7a33\u5b9a\u6027"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u81ea\u52a8\u5316", "\u4eba\u7c7b\u6f14\u793a", "\u9886\u57df\u77e5\u8bc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02149v1", "published_at": "2026-09-02", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OmegaUse-SOP: SOP Engineering for Professional Computer Use from Human Demonstrations", "tldr": "\u5c06\u4e13\u5bb6GUI\u6f14\u793a\u8f6c\u5316\u4e3a\u53ef\u590d\u7528SOP\u6280\u80fd", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OmegaUse-SOP\uff0c\u4e00\u4e2a\u4eba\u5728\u73af\u8def\u7684 SOP Engineering \u7cfb\u7edf\uff0c\u7528\u4e8e\u628a\u4e13\u4e1a\u8f6f\u4ef6\u4e2d\u7684\u4eba\u7c7b\u64cd\u4f5c\u6f14\u793a\u8f6c\u5316\u4e3a GUI \u667a\u80fd\u4f53\u53ef\u590d\u7528\u7684\u6d41\u7a0b\u6280\u80fd\u3002\u7cfb\u7edf\u901a\u8fc7\u8bb0\u5f55\u3001\u62bd\u8c61\u3001\u914d\u7f6e\u4e0e\u6267\u884c\uff0c\u5c06\u4f4e\u5c42\u70b9\u51fb\u952e\u5165\u8f68\u8ff9\u5347\u7ea7\u4e3a\u5e26\u9886\u57df\u89c4\u5219\u548c\u9a8c\u8bc1\u673a\u5236\u7684\u8bed\u4e49\u5316\u64cd\u4f5c\u6b65\u9aa4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u771f\u5b9e\u4e13\u4e1a\u8f6f\u4ef6\u73af\u5883\uff0c\u800c\u975e\u901a\u7528\u7f51\u9875\u6216\u684c\u9762\u57fa\u51c6\uff0c\u89e3\u51b3\u4e86 GUI \u667a\u80fd\u4f53\u5728\u9690\u542b\u9886\u57df\u77e5\u8bc6\u3001\u8f6f\u4ef6\u60ef\u4f8b\u548c\u4efb\u52a1\u9a8c\u8bc1\u4e0a\u7684\u843d\u5730\u96be\u9898\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u4ea7\u4e1a\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Long-running LLM agents rely on persistent memory to carry state across interactions, including permissions, restrictions, and revocations. When memory misrepresents this evolving authorization state, the agent\u0027s own records can grant authority that the underlying history never permitted, resulting in misaligned behavior without any external attacks. We term this failure endogenous authorization laundering, where spurious permissions written into memory lead to unauthorized actions as their provenance is washed away. We then introduce EAL-Bench, which measures how accurately persistent memory preserves evolving authorization state and whether errors propagate to downstream unauthorized actions. We evaluate five LLMs as memory writers and two as executors across procurement, cybersecurity, and finance. We find that under incremental memory updates, writers create false authority for up to 50.2% of unauthorized requests; once false authority is present, executors act on it in 98.6% of trials. Two safeguards, requiring stored permissions to be backed by valid source events, and tracking permission changes through bounded event sourcing, substantially reduce laundering, but both also reject more legitimate actions, exposing a safety-utility tradeoff. Persistent memory is therefore not merely a performance component, but a part of an LLM agent\u0027s effective authorization policy.", "arxiv_id": "2609.01836", "arxiv_url": "https://arxiv.org/abs/2609.01836", "authors": ["Tommaso Cerruti", "Mika Okamoto", "Ansel Kaplan Erol"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u5185\u751f\u6388\u6743\u6d17\u767d\u201d\u6982\u5ff5\uff1a\u957f\u671f\u8fd0\u884c\u7684 LLM \u667a\u80fd\u4f53\u5728\u6301\u4e45\u8bb0\u5fc6\u4e2d\u9519\u8bef\u8bb0\u5f55\u6743\u9650\u3001\u9650\u5236\u6216\u64a4\u9500\u72b6\u6001\uff0c\u53ef\u80fd\u628a\u672c\u4e0d\u5b58\u5728\u7684\u6388\u6743\u53d8\u6210\u540e\u7eed\u53ef\u6267\u884c\u4f9d\u636e\u3002\u4f5c\u8005\u6784\u5efa EAL-Bench\uff0c\u8bc4\u4f30\u8bb0\u5fc6\u5199\u5165\u4e0e\u6267\u884c\u9636\u6bb5\u4e2d\u6388\u6743\u72b6\u6001\u5931\u771f\u5982\u4f55\u5bfc\u81f4\u672a\u6388\u6743\u884c\u4e3a\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01836", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728\u91c7\u8d2d\u3001\u7f51\u7edc\u5b89\u5168\u3001\u91d1\u878d\u4e09\u4e2a\u573a\u666f\u4e2d\u8bc4\u4f30 5 \u4e2a LLM \u4f5c\u4e3a\u8bb0\u5fc6\u5199\u5165\u5668\u30012 \u4e2a LLM \u4f5c\u4e3a\u6267\u884c\u5668\u3002", "\u589e\u91cf\u8bb0\u5fc6\u66f4\u65b0\u4e0b\uff0c\u8bb0\u5fc6\u5199\u5165\u5668\u4f1a\u4e3a\u6700\u9ad8 50.2% \u7684\u672a\u6388\u6743\u8bf7\u6c42\u751f\u6210\u865a\u5047\u6743\u9650\uff1b\u4e00\u65e6\u865a\u5047\u6743\u9650\u8fdb\u5165\u8bb0\u5fc6\uff0c\u6267\u884c\u5668\u5728 98.6% \u7684\u8bd5\u9a8c\u4e2d\u4f1a\u636e\u6b64\u884c\u52a8\u3002", "\u4e24\u7c7b\u9632\u62a4\u63aa\u65bd\u2014\u2014\u8981\u6c42\u5b58\u50a8\u6743\u9650\u6709\u6709\u6548\u6765\u6e90\u4e8b\u4ef6\u652f\u6491\u3001\u4f7f\u7528\u6709\u754c\u4e8b\u4ef6\u6eaf\u6e90\u8ddf\u8e2a\u6743\u9650\u53d8\u5316\u2014\u2014\u53ef\u663e\u8457\u964d\u4f4e\u6d17\u767d\u98ce\u9669\uff0c\u4f46\u4f1a\u589e\u52a0\u5bf9\u5408\u6cd5\u64cd\u4f5c\u7684\u8bef\u62d2\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168", "\u6301\u4e45\u8bb0\u5fc6", "\u6743\u9650\u63a7\u5236"], "num_comments": 1, "on_hf": true, "organization": "EleutherAI", "pdf_url": "https://arxiv.org/pdf/2609.01836v1", "published_at": "2026-09-01", "score": 0.396, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01836.png", "title": "Agent Memory Is a Surface for Endogenous Authorization Laundering", "tldr": "\u6301\u4e45\u8bb0\u5fc6\u4f1a\u8ba9\u667a\u80fd\u4f53\u201c\u6d17\u767d\u201d\u865a\u5047\u6743\u9650", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u5185\u751f\u6388\u6743\u6d17\u767d\u201d\u6982\u5ff5\uff1a\u957f\u671f\u8fd0\u884c\u7684 LLM \u667a\u80fd\u4f53\u5728\u6301\u4e45\u8bb0\u5fc6\u4e2d\u9519\u8bef\u8bb0\u5f55\u6743\u9650\u3001\u9650\u5236\u6216\u64a4\u9500\u72b6\u6001\uff0c\u53ef\u80fd\u628a\u672c\u4e0d\u5b58\u5728\u7684\u6388\u6743\u53d8\u6210\u540e\u7eed\u53ef\u6267\u884c\u4f9d\u636e\u3002\u4f5c\u8005\u6784\u5efa EAL-Bench\uff0c\u8bc4\u4f30\u8bb0\u5fc6\u5199\u5165\u4e0e\u6267\u884c\u9636\u6bb5\u4e2d\u6388\u6743\u72b6\u6001\u5931\u771f\u5982\u4f55\u5bfc\u81f4\u672a\u6388\u6743\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u8bb0\u5fc6\u4ece\u201c\u6027\u80fd\u7ec4\u4ef6\u201d\u91cd\u65b0\u5b9a\u4e49\u4e3a\u5b9e\u9645\u6388\u6743\u7b56\u7565\u7684\u4e00\u90e8\u5206\uff0c\u63ed\u793a\u4e86\u65e0\u9700\u5916\u90e8\u653b\u51fb\u4e5f\u4f1a\u53d1\u751f\u7684\u5b89\u5168\u5931\u6548\u6a21\u5f0f\uff0c\u5bf9\u957f\u671f\u81ea\u4e3b\u667a\u80fd\u4f53\u3001\u4f01\u4e1a\u6743\u9650\u63a7\u5236\u548c\u5ba1\u8ba1\u673a\u5236\u8bbe\u8ba1\u5177\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Recent web agents use world models for test-time action selection by sampling candidate actions, predicting the resulting web states, and ranking them with a ranker model or a Process Reward Model (PRM). These world models are typically trained via supervised next-state prediction to generate fixed representations like HTML or AXTree snapshots. However, this objective is misaligned with the downstream ranker, which relies on predicted states being discriminative across candidates to accurately score them. To address this, we introduce predicted-state matching, a training objective where the predicted representation must distinguish the true resulting
