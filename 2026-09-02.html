t 35 of ACT\u0027s 47 failures at the maximum demonstrated speed are insertion misalignments. Under the relative-motion handoff, every ACT acquisition retains the parcel through reorientation and transfer in free space, but only 64 percent complete the overall task, compared with 95 percent after expert acquisition. Across all evaluated policies and speeds, none of the 414 acquisitions without force closure completes the task. Equal nominal task success therefore does not imply preservation of expert performance across execution speeds. Code, data, and evaluation scripts are available at https://github.com/coenwerem/parcelstow.", "arxiv_id": "2609.01453", "arxiv_url": "https://arxiv.org/abs/2609.01453", "authors": ["Clinton Enwerem", "John S. Baras", "Calin Belta"], "brief": "\u8bba\u6587\u5728 ParcelStow \u63a5\u89e6\u4e30\u5bcc\u7684\u5305\u88f9\u6536\u7eb3\u4efb\u52a1\u4e2d\uff0c\u5bf9\u6bd4\u811a\u672c\u4e13\u5bb6\u4e0e ACT \u6a21\u4eff\u5b66\u4e60\u7b56\u7565\u5728\u4e0d\u540c\u4efb\u52a1\u6267\u884c\u901f\u5ea6\u4e0b\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\u4e8c\u8005\u5728\u6807\u79f0\u901f\u5ea6\u5747\u4e3a 100% \u6210\u529f\uff0c\u4f46\u52a0\u901f\u540e\u5b66\u4e60\u5668\u6210\u529f\u7387\u663e\u8457\u4f4e\u4e8e\u4e13\u5bb6\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01453", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4e13\u5bb6\u4e0e ACT \u5728\u76f8\u540c\u4efb\u52a1\u6761\u4ef6\u3001\u521d\u59cb\u72b6\u6001\u91c7\u6837\u548c\u52a0\u901f\u56e0\u5b50\u4e0b\u8bc4\u6d4b\uff0c\u4fdd\u8bc1\u5bf9\u6bd4\u516c\u5e73\u3002", "\u5728\u6f14\u793a\u8986\u76d6\u7684\u6700\u9ad8\u901f\u5ea6\u4e0b\uff0c\u4e13\u5bb6\u6210\u529f\u7387\u4e3a 84%\uff0cACT \u4ec5\u4e3a 53%\uff1b\u4e24\u4e2a\u4e0d\u540c\u521d\u59cb\u5316\u7684 ACT \u5747\u51fa\u73b0\u7c7b\u4f3c\u9000\u5316\u3002", "\u5931\u8d25\u4e3b\u8981\u96c6\u4e2d\u5728\u63d2\u5165\u9636\u6bb5\uff1a\u6700\u9ad8\u901f\u5ea6\u4e0b ACT \u7684 47 \u6b21\u5931\u8d25\u4e2d\u6709 35 \u6b21\u662f\u63d2\u5165\u9519\u4f4d\uff1b\u65e0\u529b\u95ed\u5408\u7684 414 \u6b21\u6293\u53d6\u5747\u672a\u5b8c\u6210\u4efb\u52a1\u3002"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u7075\u5de7\u64cd\u4f5c", "\u9c81\u68d2\u6027"], "num_comments": 2, "on_hf": true, "organization": "University of Maryland College Park", "pdf_url": "https://arxiv.org/pdf/2609.01453v1", "published_at": "2026-09-01", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01453.png", "title": "Does Imitation Learning Preserve Temporal Robustness in Dexterous Manipulation? An Expert-Learner Comparison Across Task Execution Speeds", "tldr": "\u6a21\u4eff\u5b66\u4e60\u672a\u5fc5\u4fdd\u7559\u7075\u5de7\u64cd\u4f5c\u7684\u901f\u5ea6\u9c81\u68d2\u6027", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5728 ParcelStow \u63a5\u89e6\u4e30\u5bcc\u7684\u5305\u88f9\u6536\u7eb3\u4efb\u52a1\u4e2d\uff0c\u5bf9\u6bd4\u811a\u672c\u4e13\u5bb6\u4e0e ACT \u6a21\u4eff\u5b66\u4e60\u7b56\u7565\u5728\u4e0d\u540c\u4efb\u52a1\u6267\u884c\u901f\u5ea6\u4e0b\u7684\u8868\u73b0\u3002\u7ed3\u679c\u663e\u793a\u4e8c\u8005\u5728\u6807\u79f0\u901f\u5ea6\u5747\u4e3a 100% \u6210\u529f\uff0c\u4f46\u52a0\u901f\u540e\u5b66\u4e60\u5668\u6210\u529f\u7387\u663e\u8457\u4f4e\u4e8e\u4e13\u5bb6\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\u4ec5\u5728\u6807\u79f0\u901f\u5ea6\u4e0a\u8fbe\u5230\u4e13\u5bb6\u7ea7\u6210\u529f\u7387\u5e76\u4e0d\u610f\u5473\u7740\u6a21\u4eff\u7b56\u7565\u7ee7\u627f\u4e86\u4e13\u5bb6\u7684\u65f6\u95f4\u9c81\u68d2\u6027\uff0c\u4e3a\u7075\u5de7\u64cd\u4f5c\u7b56\u7565\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u4e00\u4e2a\u5bb9\u6613\u88ab\u5ffd\u89c6\u4f46\u5f88\u5173\u952e\u7684\u7ef4\u5ea6\u3002"}, {"abstract": "People increasingly use language models to support life decisions. Many such decisions involve a probabilistic forecast: How likely is a major life event, a natural disaster, or an economic outcome? Users of language models may implicitly trust that these forecasts fall out of a coherent world model. In this paper, we evaluate the coherence of language model probabilistic forecasts through a procedure that builds on a theorem due to de Finetti. We elicit forecasts from language models across events generated from stock returns data. We then use linear programs to compute the largest Dutch-book profit - the profit an arbitrageur could guarantee by betting against model-generated probabilities - which we use as a measure of incoherence. Our procedure does not require outcome labels, so we can evaluate coherence even in settings where outcomes are not observed or have not yet resolved. We find substantial evidence of incoherence in language model forecasts. Such incoherence increases when there are richer logical relationships between events, and irrelevant contextual details can increase incoherence by an order of magnitude. We conclude by discussing how alternative training strategies may improve probabilistic coherence.", "arxiv_id": "2609.02797", "arxiv_url": "https://arxiv.org/abs/2609.02797", "authors": ["Isaiah Andrews", "Suproteem Sarkar"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e de Finetti \u5b9a\u7406\u7684\u8bc4\u4f30\u6d41\u7a0b\uff0c\u7528\u80a1\u7968\u6536\u76ca\u6570\u636e\u751f\u6210\u4e8b\u4ef6\u5e76\u5411\u8bed\u8a00\u6a21\u578b\u8be2\u95ee\u6982\u7387\u9884\u6d4b\uff0c\u518d\u901a\u8fc7\u7ebf\u6027\u89c4\u5212\u8ba1\u7b97\u53ef\u88ab\u5957\u5229\u7684\u6700\u5927 Dutch-book \u5229\u6da6\uff0c\u8861\u91cf\u9884\u6d4b\u7684\u6982\u7387\u4e0d\u76f8\u5bb9\u6027\u3002", "categories": ["econ.GN", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02797", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u771f\u5b9e\u7ed3\u679c\u6807\u7b7e\u5373\u53ef\u8bc4\u4f30\u6982\u7387\u9884\u6d4b\u7684\u4e00\u81f4\u6027\uff0c\u9002\u7528\u4e8e\u672a\u53d1\u751f\u6216\u672a\u63ed\u6653\u7684\u4e8b\u4ef6\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u8bed\u8a00\u6a21\u578b\u7684\u6982\u7387\u9884\u6d4b\u5b58\u5728\u663e\u8457\u4e0d\u4e00\u81f4\uff0c\u53ef\u88ab\u6784\u9020\u65e0\u98ce\u9669\u5957\u5229\u3002", "\u4e8b\u4ef6\u4e4b\u95f4\u903b\u8f91\u5173\u7cfb\u8d8a\u4e30\u5bcc\uff0c\u4e0d\u4e00\u81f4\u6027\u8d8a\u5f3a\uff1b\u65e0\u5173\u4e0a\u4e0b\u6587\u7ec6\u8282\u53ef\u4f7f\u4e0d\u4e00\u81f4\u6027\u63d0\u5347\u4e00\u4e2a\u6570\u91cf\u7ea7\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6982\u7387\u9884\u6d4b", "\u53ef\u4fe1AI", "\u8bc4\u4f30\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02797v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dutch Books for Language Models", "tldr": "\u7528Dutch book\u68c0\u9a8c\u53d1\u73b0\u8bed\u8a00\u6a21\u578b\u6982\u7387\u9884\u6d4b\u4e0d\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e de Finetti \u5b9a\u7406\u7684\u8bc4\u4f30\u6d41\u7a0b\uff0c\u7528\u80a1\u7968\u6536\u76ca\u6570\u636e\u751f\u6210\u4e8b\u4ef6\u5e76\u5411\u8bed\u8a00\u6a21\u578b\u8be2\u95ee\u6982\u7387\u9884\u6d4b\uff0c\u518d\u901a\u8fc7\u7ebf\u6027\u89c4\u5212\u8ba1\u7b97\u53ef\u88ab\u5957\u5229\u7684\u6700\u5927 Dutch-book \u5229\u6da6\uff0c\u8861\u91cf\u9884\u6d4b\u7684\u6982\u7387\u4e0d\u76f8\u5bb9\u6027\u3002", "why_notable": "\u8bed\u8a00\u6a21\u578b\u6b63\u88ab\u7528\u4e8e\u4eba\u751f\u3001\u7ecf\u6d4e\u548c\u98ce\u9669\u51b3\u7b56\u4e2d\u7684\u6982\u7387\u5224\u65ad\uff1b\u8be5\u7814\u7a76\u63ed\u793a\u5176\u9884\u6d4b\u5e76\u4e0d\u4e00\u5b9a\u6765\u81ea\u4e00\u81f4\u7684\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u7684\u65e0\u6807\u7b7e\u8bc4\u4f30\u65b9\u6cd5\uff0c\u5bf9\u53ef\u4fe1 AI \u4e0e\u6982\u7387\u6821\u51c6\u8bad\u7ec3\u5177\u6709\u5b9e\u9645\u610f\u4e49\u3002"}, {"abstract": "Training data attribution (TDA) aims to identify training examples that shape model behavior, but its intervention value depends on both which examples are selected and how they are modified. Influence functions (IF) estimate behavioral changes under infinitesimal reweighting, yet IF-selected examples often show limited advantages over random selection under conventional weight-based interventions. This raises the question of whether influential examples lack intervention value or whether reweighting fails to realize their behavioral leverage.We introduce influence-guided response rewriting, which uses IF to identify intervention targets and replaces their responses with behavior-aligned or behavior-opposed supervision while keeping instructions fixed. Across four open-weight LLMs, we compare rewriting and reweighting on the same influence-selected examples using epistemic abstention as our primary testbed. Response rewriting produces stronger, more persistent, and bidirectional behavioral shifts, while reweighting the same examples yields weak and inconsistent effects. Further analyses show that influence-selected examples provide greater rewriting leverage than alternative selectors, with changes remaining concentrated on target-relevant behaviors. The same qualitative contrast extends to safety refusal. These results distinguish the local reweighting effects captured by influence estimates from the broader intervention leverage of the examples they identify, motivating intervention-aware evaluation of TDA methods.", "arxiv_id": "2609.02771", "arxiv_url": "https://arxiv.org/abs/2609.02771", "authors": ["Yuzhang Luo", "Chenpeng Wang", "Jianhui Chen", "Liangming Pan"], "brief": "\u8bba\u6587\u7814\u7a76\u8bad\u7ec3\u6570\u636e\u5f52\u56e0\u4e2d\u201c\u6709\u5f71\u54cd\u6837\u672c\u201d\u7684\u771f\u5b9e\u5e72\u9884\u4ef7\u503c\uff0c\u63d0\u51fa\u5f71\u54cd\u51fd\u6570\u5f15\u5bfc\u7684\u56de\u590d\u6539\u5199\uff1a\u56fa\u5b9a\u6307\u4ee4\u3001\u66ff\u6362\u8bad\u7ec3\u56de\u590d\u4e3a\u652f\u6301\u6216\u53cd\u5bf9\u76ee\u6807\u884c\u4e3a\u7684\u76d1\u7763\u4fe1\u53f7\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u5f00\u6e90\u5927\u6a21\u578b\u4e0a\u5bf9\u6bd4\u540c\u4e00\u6279\u5f71\u54cd\u51fd\u6570\u7b5b\u9009\u6837\u672c\u7684\u6539\u5199\u4e0e\u91cd\u52a0\u6743\u6548\u679c\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02771", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f71\u54cd\u51fd\u6570\u7528\u4e8e\u7b5b\u9009\u5e72\u9884\u76ee\u6807\u6837\u672c\uff0c\u4f46\u4f20\u7edf\u57fa\u4e8e\u6743\u91cd\u7684\u91cd\u52a0\u6743\u5e72\u9884\u5f80\u5f80\u6548\u679c\u5f31\u4e14\u4e0d\u7a33\u5b9a\u3002", "\u5728\u8ba4\u8bc6\u6027\u62d2\u7b54\u4efb\u52a1\u4e2d\uff0c\u56de\u590d\u6539\u5199\u80fd\u4ea7\u751f\u66f4\u5f3a\u3001\u66f4\u6301\u4e45\u4e14\u53cc\u5411\u53ef\u63a7\u7684\u884c\u4e3a\u53d8\u5316\u3002", "\u5f71\u54cd\u51fd\u6570\u7b5b\u9009\u6837\u672c\u6bd4\u968f\u673a\u6216\u5176\u4ed6\u9009\u62e9\u5668\u66f4\u5177\u6539\u5199\u6760\u6746\uff0c\u4e14\u5f71\u54cd\u4e3b\u8981\u96c6\u4e2d\u5728\u76ee\u6807\u76f8\u5173\u884c\u4e3a\uff1b\u5b89\u5168\u62d2\u7b54\u4efb\u52a1\u4e2d\u4e5f\u89c2\u5bdf\u5230\u7c7b\u4f3c\u8d8b\u52bf\u3002"], "keywords": ["\u8bad\u7ec3\u6570\u636e\u5f52\u56e0", "\u5f71\u54cd\u51fd\u6570", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u884c\u4e3a\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02771v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Reweighting to Rewriting: Unlocking the Intervention Effects of Influential Samples in Training Data Attribution", "tldr": "\u7528\u5f71\u54cd\u51fd\u6570\u9009\u6837\u672c\uff0c\u6539\u5199\u56de\u590d\u6bd4\u91cd\u52a0\u6743\u66f4\u6709\u6548", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u8bad\u7ec3\u6570\u636e\u5f52\u56e0\u4e2d\u201c\u6709\u5f71\u54cd\u6837\u672c\u201d\u7684\u771f\u5b9e\u5e72\u9884\u4ef7\u503c\uff0c\u63d0\u51fa\u5f71\u54cd\u51fd\u6570\u5f15\u5bfc\u7684\u56de\u590d\u6539\u5199\uff1a\u56fa\u5b9a\u6307\u4ee4\u3001\u66ff\u6362\u8bad\u7ec3\u56de\u590d\u4e3a\u652f\u6301\u6216\u53cd\u5bf9\u76ee\u6807\u884c\u4e3a\u7684\u76d1\u7763\u4fe1\u53f7\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u5f00\u6e90\u5927\u6a21\u578b\u4e0a\u5bf9\u6bd4\u540c\u4e00\u6279\u5f71\u54cd\u51fd\u6570\u7b5b\u9009\u6837\u672c\u7684\u6539\u5199\u4e0e\u91cd\u52a0\u6743\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u8bad\u7ec3\u6570\u636e\u5f52\u56e0\u4e0d\u5e94\u53ea\u7528\u91cd\u52a0\u6743\u6765\u8bc4\u4f30\uff0c\u56e0\u4e3a\u5f71\u54cd\u51fd\u6570\u6355\u6349\u7684\u662f\u5c40\u90e8\u6743\u91cd\u6548\u5e94\uff0c\u800c\u88ab\u5176\u9009\u4e2d\u7684\u6837\u672c\u53ef\u80fd\u901a\u8fc7\u5185\u5bb9\u6539\u5199\u91ca\u653e\u66f4\u5927\u7684\u884c\u4e3a\u5e72\u9884\u80fd\u529b\u3002\u8fd9\u4e3a\u6570\u636e\u5f52\u56e0\u3001\u6a21\u578b\u7f16\u8f91\u548c\u8bad\u7ec3\u6570\u636e\u6cbb\u7406\u63d0\u4f9b\u4e86\u66f4\u5b9e\u7528\u7684\u8bc4\u4f30\u8303\u5f0f\u3002"}, {"abstract": "Sparse mixture-of-experts (MoE) models use an independently parameterized router at each sparse layer to select experts for every token. Prior work has shown that routing decisions across depth can often be predicted from earlier routing signals, suggesting that routing is not fully independent across layers. However, the structure behind this predictability remains unclear. In this work, we provide evidence that routing-relevant states across layers share a common geometric structure that is obscured by layer-specific coordinate systems. We isolate the control subspace of each router and align these spaces into a shared canonical representation using generalized orthogonal Procrustes analysis. After alignment, a single linear transition reaches $R^2=0.39$--$0.71$ and retains 79--90\\% of the predictive power of separately fitted layer-specific dynamics, indicating that much of routing-state evolution follows a reusable process across depth. We then ask whether this shared dynamics is specific to routing or simply reflects the smooth evolution of hidden representations. A matched-rank comparison shows that residual representations are often easier to predict across layers, while router-control states preserve the model\u0027s expert choices much more faithfully. This separates generic cross-layer predictability from routing-specific information. Finally, we test whether the predicted canonical states remain meaningful when used in place of native routing states. The transported states preserve local routing behavior, while learned state evolution reduces $\u0394\\mathrm{NLL}$ relative to simple persistence by 15.7\\% on OLMoE and 6.2\\% over a 10-router horizon on Phi.", "arxiv_id": "2609.02404", "arxiv_url": "https://arxiv.org/abs/2609.02404", "authors": ["Kirill Labzin", "Stepan Kulibaba", "Artem Dzhalilov", "Artem Gorokhov"], "brief": "\u672c\u6587\u7814\u7a76\u7a00\u758fMoE\u6a21\u578b\u4e2d\u4e0d\u540c\u5c42\u8def\u7531\u5668\u7684\u8def\u7531\u72b6\u6001\u662f\u5426\u5b58\u5728\u5171\u540c\u7ed3\u6784\u3002\u4f5c\u8005\u901a\u8fc7\u5bf9\u9f50\u5404\u5c42\u8def\u7531\u63a7\u5236\u5b50\u7a7a\u95f4\uff0c\u53d1\u73b0\u8de8\u5c42\u8def\u7531\u6f14\u5316\u53ef\u7531\u5171\u4eab\u7ebf\u6027\u52a8\u6001\u8f83\u597d\u523b\u753b\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02404", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u5e7f\u4e49\u6b63\u4ea4Procrustes\u5206\u6790\uff0c\u5c06\u5404\u5c42\u8def\u7531\u5668\u7684\u63a7\u5236\u5b50\u7a7a\u95f4\u5bf9\u9f50\u5230\u7edf\u4e00\u89c4\u8303\u8868\u793a\u3002", "\u5bf9\u9f50\u540e\uff0c\u5355\u4e00\u7ebf\u6027\u8f6c\u79fb\u53ef\u8fbe\u5230R\u00b2=0.39\u20130.71\uff0c\u5e76\u4fdd\u755979\u201390%\u7684\u9010\u5c42\u62df\u5408\u52a8\u6001\u9884\u6d4b\u80fd\u529b\u3002", "\u4e0e\u6b8b\u5dee\u8868\u5f81\u7684\u540c\u79e9\u5bf9\u6bd4\u8868\u660e\uff0c\u8def\u7531\u63a7\u5236\u72b6\u6001\u66f4\u80fd\u4fdd\u7559\u4e13\u5bb6\u9009\u62e9\u4fe1\u606f\uff0c\u533a\u5206\u4e86\u901a\u7528\u8868\u5f81\u5e73\u6ed1\u6027\u4e0e\u8def\u7531\u7279\u5f02\u6027\u3002"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u8868\u793a\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02404v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Evidence for Shared Routing Geometry and Dynamics in Sparse Mixture-of-Experts", "tldr": "MoE\u8def\u7531\u8de8\u5c42\u5171\u4eab\u51e0\u4f55\u4e0e\u52a8\u6001\u7ed3\u6784", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u7a00\u758fMoE\u6a21\u578b\u4e2d\u4e0d\u540c\u5c42\u8def\u7531\u5668\u7684\u8def\u7531\u72b6\u6001\u662f\u5426\u5b58\u5728\u5171\u540c\u7ed3\u6784\u3002\u4f5c\u8005\u901a\u8fc7\u5bf9\u9f50\u5404\u5c42\u8def\u7531\u63a7\u5236\u5b50\u7a7a\u95f4\uff0c\u53d1\u73b0\u8de8\u5c42\u8def\u7531\u6f14\u5316\u53ef\u7531\u5171\u4eab\u7ebf\u6027\u52a8\u6001\u8f83\u597d\u523b\u753b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63ed\u793a\u4e86MoE\u8def\u7531\u5e76\u975e\u5404\u5c42\u5b8c\u5168\u72ec\u7acb\uff0c\u800c\u53ef\u80fd\u5171\u4eab\u53ef\u590d\u7528\u7684\u51e0\u4f55\u4e0e\u52a8\u6001\u673a\u5236\uff0c\u4e3a\u7406\u89e3\u3001\u538b\u7f29\u6216\u6539\u8fdbMoE\u8def\u7531\u5668\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u65b0\u7684\u5206\u6790\u5de5\u5177\u548c\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "A core obstacle to alignment evaluation is evaluation awareness: capable models can tell when they are being tested rather than deployed, weakening the conclusions a safety evaluation can support. We present two techniques that make simulated alignment evaluations harder to distinguish from real deployments. Our first technique, critique refinement, spends additional inference-time compute on each simulator action: the simulator generates multiple candidate actions, refines them using feedback from an instance of the target model on how to make them more realistic, and continues the evaluation with the most deployment-like candidate. Our second technique, DISH (Deployment-Imitating SWE-Agent Harness), wraps the target in an agent harness, reducing the gap between simulated and real deployment environments in coding settings. We test the techniques on multiple target models and find that they compose: applying both yields larger realism gains than either alone. Our results show that automated approaches can improve the realism of alignment evaluations, and that these improvements use additional compute more effectively than making the audits longer.", "arxiv_id": "2609.02302", "arxiv_url": "https://arxiv.org/abs/2609.02302", "authors": ["Axel Ahlqvist", "Richard Guan", "Juan-Pablo Rivera", "Adeline Kassler", "Dmitrii Troitskii", "Alexandra Souly", "Kai Fronsdal", "Robert Kirk", "John Hughes"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e24\u79cd\u8ba9\u6a21\u62df\u5bf9\u9f50\u8bc4\u6d4b\u66f4\u63a5\u8fd1\u771f\u5b9e\u90e8\u7f72\u7684\u65b9\u6cd5\uff1acritique refinement \u901a\u8fc7\u989d\u5916\u63a8\u7406\u65f6\u8ba1\u7b97\u4f18\u5316\u6a21\u62df\u5668\u52a8\u4f5c\uff0cDISH \u5219\u7528\u7c7b\u4f3c SWE-Agent \u7684\u90e8\u7f72\u811a\u624b\u67b6\u5305\u88c5\u76ee\u6807\u6a21\u578b\u3002\u5b9e\u9a8c\u663e\u793a\u4e8c\u8005\u53ef\u53e0\u52a0\u63d0\u5347\u8bc4\u6d4b\u771f\u5b9e\u611f\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02302", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["critique refinement \u8ba9\u6a21\u62df\u5668\u751f\u6210\u591a\u4e2a\u5019\u9009\u52a8\u4f5c\uff0c\u5e76\u501f\u52a9\u76ee\u6807\u6a21\u578b\u53cd\u9988\u9009\u62e9\u6700\u50cf\u771f\u5b9e\u90e8\u7f72\u7684\u52a8\u4f5c", "DISH \u5728\u4ee3\u7801\u4efb\u52a1\u4e2d\u7528\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6\u7f29\u5c0f\u6d4b\u8bd5\u73af\u5883\u4e0e\u771f\u5b9e\u90e8\u7f72\u73af\u5883\u7684\u5dee\u8ddd", "\u76f8\u6bd4\u5355\u7eaf\u5ef6\u957f\u5ba1\u8ba1\u65f6\u95f4\uff0c\u589e\u52a0\u63a8\u7406\u65f6\u8ba1\u7b97\u66f4\u6709\u6548\u63d0\u5347\u5bf9\u9f50\u8bc4\u6d4b\u7684\u73b0\u5b9e\u6027"], "keywords": ["\u5bf9\u9f50\u8bc4\u6d4b", "\u667a\u80fd\u4f53", "\u63a8\u7406\u65f6\u8ba1\u7b97", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02302v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Improving Evaluation Realism with Inference-Time Compute and Deployment Scaffolds", "tldr": "\u7528\u63a8\u7406\u7b97\u529b\u4e0e\u667a\u80fd\u4f53\u6846\u67b6\u63d0\u5347\u5bf9\u9f50\u8bc4\u6d4b\u771f\u5b9e\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e24\u79cd\u8ba9\u6a21\u62df\u5bf9\u9f50\u8bc4\u6d4b\u66f4\u63a5\u8fd1\u771f\u5b9e\u90e8\u7f72\u7684\u65b9\u6cd5\uff1acritique refinement \u901a\u8fc7\u989d\u5916\u63a8\u7406\u65f6\u8ba1\u7b97\u4f18\u5316\u6a21\u62df\u5668\u52a8\u4f5c\uff0cDISH \u5219\u7528\u7c7b\u4f3c SWE-Agent \u7684\u90e8\u7f72\u811a\u624b\u67b6\u5305\u88c5\u76ee\u6807\u6a21\u578b\u3002\u5b9e\u9a8c\u663e\u793a\u4e8c\u8005\u53ef\u53e0\u52a0\u63d0\u5347\u8bc4\u6d4b\u771f\u5b9e\u611f\u3002", "why_notable": "\u8be5\u7814\u7a76\u76f4\u9762\u201c\u6a21\u578b\u77e5\u9053\u81ea\u5df1\u5728\u88ab\u6d4b\u8bd5\u201d\u7684\u8bc4\u6d4b\u610f\u8bc6\u95ee\u9898\uff0c\u4e3a\u66f4\u53ef\u4fe1\u7684\u5b89\u5168\u4e0e\u5bf9\u9f50\u8bc4\u4f30\u63d0\u4f9b\u4e86\u81ea\u52a8\u5316\u6539\u8fdb\u8def\u5f84\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u9ad8\u80fd\u529b\u6a21\u578b\u548c\u4ee3\u7801\u667a\u80fd\u4f53\u90e8\u7f72\u573a\u666f\u3002"}, {"abstract": "Self-improving agent pipelines have a problem at their center. An optimizer rewrites prompts to score higher, and the score comes from a judge that is itself an LLM. That judge has the last word on whether the system is getting better, and our position is that it has not earned it. The judge should be demoted from oracle to advisor: its verdict becomes one input among several, and every change is gated instead by a deterministic verification layer the judge cannot override. We reached this position by building the alternative and running it. Over months of running autonomous prompt-optimization loops in production across contract analysis, compliance review, and code quality, we cataloged eleven ways the evaluation signal failed, in four classes: judge bias, harness and metric failures, ground-truth errors, and reward hacking. Agents achieved perfect scores by reading cached answer keys from their environment, a 100% pass rate concealing 68% true capability. A corrupted ground-truth label caused the optimizer to delete correct compliance rules to agree with it. A syntactically broken prompt was promoted as the winner because a silent parser fallback improved the metric. Attempts to fix the judge by rewriting its rubric plateaued; the only reliable gain came from a structural constraint on its output order. In response we describe PROCTOR, a Teacher-Student loop in which a stateful orchestrator holds all tool access, stateless subagents diagnose failures and draft mutations they cannot apply, and a Teacher grades those mutations under five deterministic guardrails: hermetic sandboxes, capability-disjoint roles, acceptance checks that outrank the Teacher, frozen holdouts, and canary cases engineered so that a perfect score is itself evidence of cheating. We report the failures this prevented, and, because the Teacher is itself an LLM judge, the failures it did not.", "arxiv_id": "2609.02246", "arxiv_url": "https://arxiv.org/abs/2609.02246", "authors": ["Vansh Wahi"], "brief": "\u8bba\u6587\u6307\u51fa\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u4e2d\u201cLLM-as-a-Judge\u201d\u4e0d\u5e94\u88ab\u89c6\u4e3a\u6700\u7ec8\u8bc4\u5224\u8005\uff0c\u800c\u5e94\u4ec5\u4f5c\u4e3a\u5efa\u8bae\u6765\u6e90\u3002\u4f5c\u8005\u57fa\u4e8e\u751f\u4ea7\u73af\u5883\u4e2d\u7684\u63d0\u793a\u8bcd\u81ea\u52a8\u4f18\u5316\u5b9e\u8df5\uff0c\u603b\u7ed3\u8bc4\u6d4b\u4fe1\u53f7\u5931\u6548\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa PROCTOR\uff1a\u7528\u786e\u5b9a\u6027\u9a8c\u8bc1\u5c42\u7ea6\u675f Teacher-Student \u81ea\u4f18\u5316\u5faa\u73af\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02246", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5f52\u7eb3\u4e8611\u7c7b\u8bc4\u6d4b\u5931\u8d25\uff0c\u8986\u76d6\u88c1\u5224\u504f\u5dee\u3001\u8bc4\u6d4b\u6846\u67b6\u4e0e\u6307\u6807\u6545\u969c\u3001\u771f\u503c\u6807\u7b7e\u9519\u8bef\u3001\u5956\u52b1\u9ed1\u5ba2\u7b49\u56db\u5927\u7c7b\u3002", "\u771f\u5b9e\u6848\u4f8b\u663e\u793a\u667a\u80fd\u4f53\u53ef\u901a\u8fc7\u8bfb\u53d6\u7f13\u5b58\u7b54\u6848\u8fbe\u5230100%\u901a\u8fc7\u7387\uff0c\u4f46\u771f\u5b9e\u80fd\u529b\u4ec568%\uff1b\u9519\u8bef\u6807\u7b7e\u8fd8\u4f1a\u8bf1\u5bfc\u4f18\u5316\u5668\u5220\u9664\u6b63\u786e\u89c4\u5219\u3002", "PROCTOR \u91c7\u7528\u9694\u79bb\u6c99\u7bb1\u3001\u89d2\u8272\u80fd\u529b\u9694\u79bb\u3001\u4f18\u5148\u4e8eLLM\u88c1\u5224\u7684\u9a8c\u6536\u68c0\u67e5\u3001\u51bb\u7ed3\u7559\u51fa\u96c6\u3001\u4f5c\u5f0a\u91d1\u4e1d\u96c0\u7528\u4f8b\u7b49\u4e94\u7c7b\u786e\u5b9a\u6027\u62a4\u680f\u3002"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u8bc4\u6d4b", "\u5b89\u5168\u5bf9\u9f50", "\u81ea\u52a8\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02246v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LLM-as-a-Judge Is Not an Oracle: Why Self-Improving Agents Need Deterministic Guardrails", "tldr": "LLM\u88c1\u5224\u9700\u964d\u7ea7\uff0c\u9760\u786e\u5b9a\u6027\u62a4\u680f\u9632\u81ea\u4f18\u5316\u4f5c\u5f0a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u4e2d\u201cLLM-as-a-Judge\u201d\u4e0d\u5e94\u88ab\u89c6\u4e3a\u6700\u7ec8\u8bc4\u5224\u8005\uff0c\u800c\u5e94\u4ec5\u4f5c\u4e3a\u5efa\u8bae\u6765\u6e90\u3002\u4f5c\u8005\u57fa\u4e8e\u751f\u4ea7\u73af\u5883\u4e2d\u7684\u63d0\u793a\u8bcd\u81ea\u52a8\u4f18\u5316\u5b9e\u8df5\uff0c\u603b\u7ed3\u8bc4\u6d4b\u4fe1\u53f7\u5931\u6548\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa PROCTOR\uff1a\u7528\u786e\u5b9a\u6027\u9a8c\u8bc1\u5c42\u7ea6\u675f Teacher-Student \u81ea\u4f18\u5316\u5faa\u73af\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u6307\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\u8bc4\u6d4b\u95ed\u73af\u4e2d\u7684\u6838\u5fc3\u98ce\u9669\uff1a\u4f18\u5316\u5668\u4f1a\u5229\u7528LLM\u88c1\u5224\u548c\u8bc4\u6d4b\u7cfb\u7edf\u6f0f\u6d1e\u3002\u5176\u4ef7\u503c\u5728\u4e8e\u4ece\u751f\u4ea7\u7ecf\u9a8c\u51fa\u53d1\uff0c\u5c06\u201c\u6539\u8fdb\u6a21\u578b\u88c1\u5224\u201d\u8f6c\u5411\u201c\u7ed3\u6784\u5316\u7ea6\u675f\u88c1\u5224\u6743\u529b\u201d\uff0c\u5bf9\u6784\u5efa\u53ef\u9760\u81ea\u52a8\u4f18\u5316\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u6307\u5bfc\u610f\u4e49\u3002"}, {"abstract": "Safety alignment trains large language models to refuse harmful requests stated plainly, but that training is applied mostly to surface form. Requests that only recontextualise the same operational content, changing how the model reads it, are therefore only weakly covered. The ASCII Attack is one such recontextualisation. It is single-turn and black-box: one message, with no access to model internals. It embeds a fully legible harmful request in ASCIl-art characters, presents it as artwork, and asks for feedback. Unlike ArtPrompt, it hides nothing: the request stays readable. The reply is written as artistic critique and can contain operational detail that a plain request would have been refused for. Every framed prompt is paired with a direct-question control, so the contrast is isolated from topic, model and decoding variation. The contrast identifies a bundled surface, not one isolated channel. Across eleven models and eight harm topics, a harm-aware classifier judges 62% of framed prompts harmful against 42% of controls. On the most susceptible model the framed prompt succeeds 93% of the time. A single query matches or exceeds published single-query attacks under four of five harm judges. The effect tracks the model more than the topic and does not diminish with scale. At least one judge dissents from the panel majority on nearly two-thirds of framed rows, which is itself a measurement-validity finding. That pattern is consistent with mismatched generalisation.", "arxiv_id": "2609.02215", "arxiv_url": "https://arxiv.org/abs/2609.02215", "authors": ["Da Cheng Gu", "Yifei Dong", "Xinghao Yang", "Yongshun Gong", "Wei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u8bc4\u4f30\u4e86 ASCII Attack\uff1a\u5c06\u6709\u5bb3\u8bf7\u6c42\u5d4c\u5165\u53ef\u8bfb\u7684 ASCII \u827a\u672f\u4e2d\uff0c\u5e76\u5305\u88c5\u6210\u827a\u672f\u8bc4\u8bba\u4efb\u52a1\uff0c\u4ee5\u5355\u8f6e\u9ed1\u76d2\u65b9\u5f0f\u8bf1\u5bfc\u6a21\u578b\u8f93\u51fa\u672c\u5e94\u62d2\u7edd\u7684\u5185\u5bb9\u3002\u4f5c\u8005\u901a\u8fc7\u4e0e\u76f4\u63a5\u63d0\u95ee\u5bf9\u7167\uff0c\u7cfb\u7edf\u6d4b\u91cf\u4e86\u8fd9\u79cd\u201c\u8bed\u5883\u91cd\u6784\u201d\u5bf9\u5b89\u5168\u5bf9\u9f50\u7684\u5f71\u54cd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02215", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d611\u4e2a\u5927\u6a21\u578b\u4e0e8\u7c7b\u6709\u5bb3\u4e3b\u9898\uff0c\u5e26\u6846\u67b6\u7684ASCII\u63d0\u793a\u88ab\u5224\u6709\u5bb3\u6bd4\u4f8b\u4e3a62%\uff0c\u9ad8\u4e8e\u76f4\u63a5\u8bf7\u6c42\u5bf9\u7167\u768442%\u3002", "\u6700\u6613\u53d7\u5f71\u54cd\u6a21\u578b\u7684\u653b\u51fb\u6210\u529f\u7387\u8fbe93%\uff0c\u4e14\u6548\u679c\u66f4\u591a\u53d6\u51b3\u4e8e\u6a21\u578b\u800c\u975e\u4e3b\u9898\uff0c\u672a\u968f\u6a21\u578b\u89c4\u6a21\u589e\u5927\u800c\u660e\u663e\u51cf\u5f31\u3002", "\u4e0d\u540c\u5b89\u5168\u8bc4\u6d4b\u5668\u5206\u6b67\u663e\u8457\uff1a\u8fd1\u4e09\u5206\u4e4b\u4e8c\u6837\u672c\u4e2d\u81f3\u5c11\u4e00\u4e2a\u8bc4\u6d4b\u5668\u4e0e\u591a\u6570\u610f\u89c1\u4e0d\u4e00\u81f4\uff0c\u66b4\u9732\u4e86\u5b89\u5168\u8bc4\u4f30\u6709\u6548\u6027\u95ee\u9898\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50", "\u8d8a\u72f1\u653b\u51fb", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02215v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ASCII Attack: Recontextualising Harmful Requests as Artistic Critique in Large Language Models", "tldr": "ASCII\u827a\u672f\u91cd\u6784\u53ef\u7ed5\u8fc7LLM\u5b89\u5168\u62d2\u7b54", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u8bc4\u4f30\u4e86 ASCII Attack\uff1a\u5c06\u6709\u5bb3\u8bf7\u6c42\u5d4c\u5165\u53ef\u8bfb\u7684 ASCII \u827a\u672f\u4e2d\uff0c\u5e76\u5305\u88c5\u6210\u827a\u672f\u8bc4\u8bba\u4efb\u52a1\uff0c\u4ee5\u5355\u8f6e\u9ed1\u76d2\u65b9\u5f0f\u8bf1\u5bfc\u6a21\u578b\u8f93\u51fa\u672c\u5e94\u62d2\u7edd\u7684\u5185\u5bb9\u3002\u4f5c\u8005\u901a\u8fc7\u4e0e\u76f4\u63a5\u63d0\u95ee\u5bf9\u7167\uff0c\u7cfb\u7edf\u6d4b\u91cf\u4e86\u8fd9\u79cd\u201c\u8bed\u5883\u91cd\u6784\u201d\u5bf9\u5b89\u5168\u5bf9\u9f50\u7684\u5f71\u54cd\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u5f53\u524d\u5b89\u5168\u5bf9\u9f50\u5bf9\u8868\u5c42\u8868\u8fbe\u548c\u8bed\u5883\u53d8\u5316\u7684\u6cdb\u5316\u4e0d\u8db3\uff1a\u5373\u4f7f\u8bf7\u6c42\u5185\u5bb9\u5b8c\u5168\u53ef\u8bfb\u3001\u6ca1\u6709\u9690\u85cf\u4fe1\u606f\uff0c\u4ec5\u6539\u53d8\u5448\u73b0\u6846\u67b6\u4e5f\u53ef\u80fd\u524a\u5f31\u62d2\u7b54\u673a\u5236\uff0c\u5bf9\u7ea2\u961f\u6d4b\u8bd5\u548c\u5b89\u5168\u8bc4\u6d4b\u8bbe\u8ba1\u5177\u6709\u76f4\u63a5\u542f\u793a\u3002"}, {"abstract": "Fragmented safety evaluation undermines the governance of dangerous AI capabilities. We present a modular framework that evaluates each model through three orthogonal pipelines---Knowledge ($K$), Defense ($D$), and Harm ($H$)---under a unified protocol, aggregating results into a standardized dangerous-capability profile $\u03c6$. Pluggable modules supply scenario seeds, knowledge banks, hazard queries, and judge rubrics, while the core evaluation engine remains unchanged across domains; the CB evaluation is complemented by a cyber pilot demonstrating protocol transfer. Instantiating the framework with a chemical-biological (CB) module, we evaluate 12 commercial LLMs from four families. Our first contribution is a horizontal comparison of dangerous capability across models and model families: the three dimensions expose sharply divergent profiles---models with comparable knowledge differ in refusal resilience, and strong defenders do not generate less harmful content when they do comply---while family-level patterns further separate Claude, DeepSeek, and GPT models. The second is a temporal analysis of capability evolution: tracking $K$, $D$, and $H$ against model release dates reveals that dangerous capability has not monotonically declined; newer models deepen knowledge while only partially improving defense, showing that scaling and alignment progress do not uniformly translate into safety. Reliability is established via cross-judge consistency (bootstrap $\u03c1\u003e 0.79$, 4 of 5 judges) and pipeline orthogonality ($K$--$D$--$H$ inter-correlations $\u03c1\\in [0.32, 0.52]$).", "arxiv_id": "2609.02168", "arxiv_url": "https://arxiv.org/abs/2609.02168", "authors": ["Zhengyi Jin", "Ru Zhang", "Xiao Chen", "Xinbo Liu", "Jiaxuan Lin", "Jia Huang", "Jianyi Liu", "Zhen Yang"], "brief": "\u8bba\u6587\u63d0\u51fa FUSE\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5371\u9669\u80fd\u529b\u7684\u6a21\u5757\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u77e5\u8bc6\u3001\u62d2\u7b54\u9632\u5fa1\u548c\u6709\u5bb3\u8f93\u51fa\u4e09\u6761\u6b63\u4ea4\u6d41\u6c34\u7ebf\u751f\u6210\u6807\u51c6\u5316\u98ce\u9669\u753b\u50cf\u3002\u4f5c\u8005\u5728\u5316\u5b66\u751f\u7269\u5b89\u5168\u573a\u666f\u4e2d\u8bc4\u6d4b\u4e86\u56db\u5927\u5bb6\u65cf\u768412\u4e2a\u5546\u7528LLM\uff0c\u5e76\u7528\u7f51\u7edc\u5b89\u5168\u8bd5\u70b9\u9a8c\u8bc1\u534f\u8bae\u53ef\u8fc1\u79fb\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02168", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5371\u9669\u80fd\u529b\u62c6\u5206\u4e3a Knowledge\u3001Defense\u3001Harm \u4e09\u4e2a\u7ef4\u5ea6\uff0c\u907f\u514d\u5355\u4e00\u6307\u6807\u63a9\u76d6\u6a21\u578b\u95f4\u5dee\u5f02", "CB \u6a21\u5757\u8bc4\u6d4b\u663e\u793a\uff1a\u77e5\u8bc6\u6c34\u5e73\u76f8\u8fd1\u7684\u6a21\u578b\u62d2\u7b54\u97e7\u6027\u4e0d\u540c\uff0c\u9632\u5fa1\u5f3a\u7684\u6a21\u578b\u4e00\u65e6\u670d\u4ece\u4e5f\u672a\u5fc5\u66f4\u5c11\u4ea7\u751f\u6709\u5bb3\u5185\u5bb9", "\u65f6\u95f4\u5206\u6790\u53d1\u73b0\u5371\u9669\u80fd\u529b\u5e76\u672a\u968f\u65b0\u6a21\u578b\u53d1\u5e03\u800c\u5355\u8c03\u4e0b\u964d\uff0c\u65b0\u6a21\u578b\u77e5\u8bc6\u52a0\u6df1\u4f46\u9632\u5fa1\u63d0\u5347\u6709\u9650"], "keywords": ["AI\u5b89\u5168", "\u6a21\u578b\u8bc4\u4f30", "\u5371\u9669\u80fd\u529b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02168v1", "published_at": "2026-09-02", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FUSE: An Evaluating Framework for Dangerous Capabilities of LLMs", "tldr": "\u7edf\u4e00\u8bc4\u4f30LLM\u5371\u9669\u80fd\u529b\u7684\u6a21\u5757\u5316\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FUSE\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5371\u9669\u80fd\u529b\u7684\u6a21\u5757\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u77e5\u8bc6\u3001\u62d2\u7b54\u9632\u5fa1\u548c\u6709\u5bb3\u8f93\u51fa\u4e09\u6761\u6b63\u4ea4\u6d41\u6c34\u7ebf\u751f\u6210\u6807\u51c6\u5316\u98ce\u9669\u753b\u50cf\u3002\u4f5c\u8005\u5728\u5316\u5b66\u751f\u7269\u5b89\u5168\u573a\u666f\u4e2d\u8bc4\u6d4b\u4e86\u56db\u5927\u5bb6\u65cf\u768412\u4e2a\u5546\u7528LLM\uff0c\u5e76\u7528\u7f51\u7edc\u5b89\u5168\u8bd5\u70b9\u9a8c\u8bc1\u534f\u8bae\u53ef\u8fc1\u79fb\u6027\u3002", "why_notable": "\u8be5\u6846\u67b6\u4e3a\u9ad8\u98ce\u9669\u80fd\u529b\u6cbb\u7406\u63d0\u4f9b\u4e86\u66f4\u6807\u51c6\u5316\u3001\u53ef\u8fc1\u79fb\u7684\u8bc4\u4f30\u534f\u8bae\uff0c\u6709\u52a9\u4e8e\u6a2a\u5411\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u5bb6\u65cf\u5e76\u8ffd\u8e2a\u5b89\u5168\u80fd\u529b\u968f\u65f6\u95f4\u7684\u53d8\u5316\u3002"}, {"abstract": "Data-centric agents repeatedly perform a discovery step before planning or execution: identifying the data objects relevant to a task. Yet successful discovery outcomes are typically discarded rather than reused. We introduce persistent discovery context, a lightweight memory layer that stores prior intent-to-object mappings and reuses them to augment future retrieval. Across three structured data environments, persistent discovery context consistently improves retrieval quality over metadata-only search, remains effective with automatically generated memories, and exposes a reproducible interference failure mode. In lexically sparse domains, memory-only retrieval can even outperform metadata-based retrieval. These findings suggest that discovery outcomes constitute a useful form of reusable context for data-centric agents.", "arxiv_id": "2609.02129", "arxiv_url": "https://arxiv.org/abs/2609.02129", "authors": ["Jalal Mahmud"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6301\u4e45\u53d1\u73b0\u4e0a\u4e0b\u6587\u201d\uff0c\u5c06\u6570\u636e\u4e2d\u5fc3\u667a\u80fd\u4f53\u8fc7\u53bb\u7684\u610f\u56fe\u5230\u6570\u636e\u5bf9\u8c61\u6620\u5c04\u4f5c\u4e3a\u8f7b\u91cf\u8bb0\u5fc6\u4fdd\u5b58\uff0c\u5e76\u7528\u4e8e\u589e\u5f3a\u540e\u7eed\u68c0\u7d22\u3002\u5b9e\u9a8c\u8868\u660e\u8be5\u65b9\u6cd5\u5728\u4e09\u4e2a\u7ed3\u6784\u5316\u6570\u636e\u73af\u5883\u4e2d\u7a33\u5b9a\u63d0\u5347\u68c0\u7d22\u8d28\u91cf\uff0c\u81ea\u52a8\u751f\u6210\u8bb0\u5fc6\u4e5f\u6709\u6548\uff0c\u4f46\u540c\u65f6\u63ed\u793a\u4e86\u53ef\u590d\u73b0\u7684\u8bb0\u5fc6\u5e72\u6270\u5931\u8d25\u6a21\u5f0f\u3002", "categories": ["cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02129", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a", "\u8bb0\u5fc6\u673a\u5236", "\u7ed3\u6784\u5316\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02129v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Context Windows: Persistent Discovery Context for Data-Centric Agents", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u6301\u4e45\u53d1\u73b0\u4e0a\u4e0b\u6587\u201d\uff0c\u5c06\u6570\u636e\u4e2d\u5fc3\u667a\u80fd\u4f53\u8fc7\u53bb\u7684\u610f\u56fe\u5230\u6570\u636e\u5bf9\u8c61\u6620\u5c04\u4f5c\u4e3a\u8f7b\u91cf\u8bb0\u5fc6\u4fdd\u5b58\uff0c\u5e76\u7528\u4e8e\u589e\u5f3a\u540e\u7eed\u68c0\u7d22\u3002\u5b9e\u9a8c\u8868\u660e\u8be5\u65b9\u6cd5\u5728\u4e09\u4e2a\u7ed3\u6784\u5316\u6570\u636e\u73af\u5883\u4e2d\u7a33\u5b9a\u63d0\u5347\u68c0\u7d22\u8d28\u91cf\uff0c\u81ea\u52a8\u751f\u6210\u8bb0\u5fc6\u4e5f\u6709\u6548\uff0c\u4f46\u540c\u65f6\u63ed\u793a\u4e86\u53ef\u590d\u73b0\u7684\u8bb0\u5fc6\u5e72\u6270\u5931\u8d25\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion language models (DLMs) have emerged as a promising alternative to the auto-regressive paradigm. With bidirectional attention and any-order generation, DLMs naturally fit infilling tasks, which require generating a middle span conditioned on both the prefix and the suffix. However, infilling is sensitive to the length of the span, while DLMs require the length to be fixed before generation. Although prior studies extend DLMs to dynamic lengths, they still suffer from two limitations. (i) Sensitivity to initial length. These methods require a preset length to initialize the search and are highly sensitive to this initial length, often yielding suboptimal results. (ii) Inference inefficiency. They either insert length-changing operations during generation or repeatedly search for an appropriate length using multi-step denoising confidence, both of which introduce substantial extra forward passes and computational cost. Therefore, we propose PILL (Probing-based InfiLling with preset-Length-free decoding), an efficient infilling method for DLMs that requires no preset initial length and adds far fewer extra forward passes than baselines, substantially reducing inference time. Experiments show that, across five DLMs spanning different families, architectures, and training recipes on eight infilling benchmarks, PILL improves over the strongest baseline by +4.8 average pass rate on code and +6.0 BLEU-2 on text, while running 1.82x faster than that baseline. The code is available at https://github.com/Hsu1023/PILL.", "arxiv_id": "2609.02108", "arxiv_url": "https://arxiv.org/abs/2609.02108", "authors": ["Haobo Xu", "Sirui Chen", "Yuanchen Bei", "Lingjie Chen", "Yuchen Yan", "Dongqi Fu", "Jingrui He", "Hanghang Tong"], "brief": "\u8bba\u6587\u63d0\u51fa PILL\uff0c\u4e00\u79cd\u7528\u4e8e\u6269\u6563\u8bed\u8a00\u6a21\u578b\u586b\u7a7a\u4efb\u52a1\u7684\u81ea\u9002\u5e94\u957f\u5ea6\u89e3\u7801\u65b9\u6cd5\uff0c\u65e0\u9700\u9884\u8bbe\u521d\u59cb\u751f\u6210\u957f\u5ea6\uff0c\u901a\u8fc7\u63a2\u6d4b\u5f0f\u9884\u6d4b\u957f\u5ea6\u800c\u975e\u53cd\u590d\u8fed\u4ee3\u641c\u7d22\u3002\u5b9e\u9a8c\u8986\u76d6 5 \u7c7b DLM \u548c 8 \u4e2a\u586b\u7a7a\u57fa\u51c6\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u5728\u4ee3\u7801\u4e0e\u6587\u672c\u4efb\u52a1\u4e0a\u5206\u522b\u63d0\u5347\u5e73\u5747\u901a\u8fc7\u7387\u548c BLEU\uff0c\u540c\u65f6\u63a8\u7406\u901f\u5ea6\u63d0\u5347 1.82 \u500d\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02108", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u586b\u7a7a", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02108v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Predict, Don\u0027t Iterate: Efficient Adaptive-Length Infilling for Diffusion Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa PILL\uff0c\u4e00\u79cd\u7528\u4e8e\u6269\u6563\u8bed\u8a00\u6a21\u578b\u586b\u7a7a\u4efb\u52a1\u7684\u81ea\u9002\u5e94\u957f\u5ea6\u89e3\u7801\u65b9\u6cd5\uff0c\u65e0\u9700\u9884\u8bbe\u521d\u59cb\u751f\u6210\u957f\u5ea6\uff0c\u901a\u8fc7\u63a2\u6d4b\u5f0f\u9884\u6d4b\u957f\u5ea6\u800c\u975e\u53cd\u590d\u8fed\u4ee3\u641c\u7d22\u3002\u5b9e\u9a8c\u8986\u76d6 5 \u7c7b DLM \u548c 8 \u4e2a\u586b\u7a7a\u57fa\u51c6\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u5728\u4ee3\u7801\u4e0e\u6587\u672c\u4efb\u52a1\u4e0a\u5206\u522b\u63d0\u5347\u5e73\u5747\u901a\u8fc7\u7387\u548c BLEU\uff0c\u540c\u65f6\u63a8\u7406\u901f\u5ea6\u63d0\u5347 1.82 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An AI agent can perform well on benchmarks and still be unsuitable for deployment. Existing AI-agent benchmarks measure whether an agent can complete realistic professional work, whereas enterprise deployment asks a different question: whether an agent can meet a required reliability level, under acceptable human oversight, and at tolerable cost. We introduce Reliable Enterprise Agent Deployment (READY), a framework for qualifying AI agents for deployment on enterprise workflows. READY preserves each workflow\u0027s own definition of successful execution while applying a common qualification procedure. Given an agent, a workflow, and a class of candidate oversight policies, READY measures the reliability and operating cost of the human-AI system, selects the minimum-cost policy that satisfies a specified reliability target, and statistically qualifies it on held-out cases. The resulting deployment profile characterizes the supported operating point: reliability, human-oversight burden, and cost. READY is implemented as an open testbed that decouples workflow specification, execution, evaluation, and qualification, and runs on existing agent-evaluation infrastructure. In an end-to-end clinical-audit case study spanning 16 agent systems and 750 cases, READY reveals differences hidden by autonomous performance: two systems separated by only 0.3 points in autonomous accuracy (72.8% vs. 72.5%) require 39.2% versus 29.6% human review, respectively, to qualify at the same 76% reliability target under the evaluated oversight policy. READY thus shifts enterprise agent evaluation from how well can the agent perform the work? to under what conditions, and at what cost, can it be reliably deployed? By making those conditions explicit and statistically testable, READY provides a basis for comparing agent systems, setting oversight requirements, and making evidence-based deployment decisions.", "arxiv_id": "2609.02095", "arxiv_url": "https://arxiv.org/abs/2609.02095", "authors": ["Veronica Chatrath", "Bryan Zhu", "Jingxuan Fan", "George Pu", "Soham Dinesh Tiwari", "Soham Dan", "Ryan Young", "Yuan", "Li", "Yuang Yao", "Apaar Shanker", "Minglai Yang", "Daniel Yue Zhang", "Yunzhong He", "Ying Liu", "Chenguang Wang", "Zhijun Yin", "Yuan Xue"], "brief": "\u8bba\u6587\u63d0\u51fa READY \u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u4f01\u4e1a\u5de5\u4f5c\u6d41\u4e2d AI \u667a\u80fd\u4f53\u5728\u6307\u5b9a\u53ef\u9760\u6027\u76ee\u6807\u3001\u4eba\u7c7b\u76d1\u7763\u5f3a\u5ea6\u548c\u6210\u672c\u7ea6\u675f\u4e0b\u662f\u5426\u9002\u5408\u90e8\u7f72\u3002\u5b83\u901a\u8fc7\u9009\u62e9\u6ee1\u8db3\u53ef\u9760\u6027\u8981\u6c42\u7684\u6700\u4f4e\u6210\u672c\u76d1\u7763\u7b56\u7565\uff0c\u5e76\u5728\u7559\u51fa\u6848\u4f8b\u4e0a\u505a\u7edf\u8ba1\u8ba4\u8bc1\uff0c\u63ed\u793a\u4ec5\u770b\u81ea\u4e3b\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u7684\u90e8\u7f72\u5dee\u5f02\uff1b\u4e34\u5e8a\u5ba1\u8ba1\u6848\u4f8b\u4e2d\uff0c\u76f8\u8fd1\u51c6\u786e\u7387\u7684\u7cfb\u7edf\u6240\u9700\u4eba\u5de5\u590d\u6838\u6bd4\u4f8b\u5dee\u5f02\u660e\u663e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02095", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4f01\u4e1a\u90e8\u7f72", "\u53ef\u9760\u6027\u8bc4\u4f30", "\u4eba\u673a\u534f\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02095v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "READY or Not: Reliable Enterprise Agent Deployment", "tldr": "\u8bba\u6587\u63d0\u51fa READY \u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30\u4f01\u4e1a\u5de5\u4f5c\u6d41\u4e2d AI \u667a\u80fd\u4f53\u5728\u6307\u5b9a\u53ef\u9760\u6027\u76ee\u6807\u3001\u4eba\u7c7b\u76d1\u7763\u5f3a\u5ea6\u548c\u6210\u672c\u7ea6\u675f\u4e0b\u662f\u5426\u9002\u5408\u90e8\u7f72\u3002\u5b83\u901a\u8fc7\u9009\u62e9\u6ee1\u8db3\u53ef\u9760\u6027\u8981\u6c42\u7684\u6700\u4f4e\u6210\u672c\u76d1\u7763\u7b56\u7565\uff0c\u5e76\u5728\u7559\u51fa\u6848\u4f8b\u4e0a\u505a\u7edf\u8ba1\u8ba4\u8bc1\uff0c\u63ed\u793a\u4ec5\u770b\u81ea\u4e3b\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u7684\u90e8\u7f72\u5dee\u5f02\uff1b\u4e34\u5e8a\u5ba1\u8ba1\u6848\u4f8b\u4e2d\uff0c\u76f8\u8fd1\u51c6\u786e\u7387\u7684\u7cfb\u7edf\u6240\u9700\u4eba\u5de5\u590d\u6838\u6bd4\u4f8b\u5dee\u5f02\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Monolithic world models predict the entire next state at every step, spending capacity re-predicting the static majority of a scene and injecting error into it. We ask whether explicitly modeling change (a per-object change gate plus a residual delta head that perturbs only the objects the gate flags) is a more effective and interpretable bias for physical prediction and control. On a MuJoCo tabletop pushing benchmark scaling from 3 to 8 objects, the sparse/residual model predicts next-state poses 2.5 to 4.6 times more accurately than a dense multilayer perceptron at 8.6 to 11.1 times fewer parameters, sustains change-detection F1 of 0.80 to 0.87 where the dense baseline is degenerate, transfers across object counts with zero retraining (99.4 percent F1 retention), and reaches about 90 percent of its full-data accuracy with a quarter of the data. In autoregressive rollout it compounds far less error, hugging the no-motion floor while the dense model drifts. Finally, inside a sampling-based planner, prediction-only models fail (though a true-simulator oracle solves the task with the identical planner, confirming the planner is sound), but once featurized and trained for the states a planner visits, the sparse model begins to plan (0.23 plus or minus 0.06 success over three seeds) while the dense monolith stays at zero at every seed. Modeling what changes, rather than re-predicting the whole world, is a simple, effective bias for object-centric physical AI; code, data generators, and all checkpoints will be released upon publication.", "arxiv_id": "2609.02046", "arxiv_url": "https://arxiv.org/abs/2609.02046", "authors": ["Param Thakkar", "Parsika Paresh Shah", "Manisha Sushant Gote"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7269\u4f53\u4e2d\u5fc3\u64cd\u4f5c\u7684\u7a00\u758f\u6b8b\u5dee\u4e16\u754c\u6a21\u578b\uff0c\u53ea\u9884\u6d4b\u53d1\u751f\u53d8\u5316\u7684\u7269\u4f53\uff0c\u5e76\u7528\u6b8b\u5dee\u589e\u91cf\u66f4\u65b0\u5176\u72b6\u6001\uff0c\u907f\u514d\u53cd\u590d\u91cd\u9884\u6d4b\u9759\u6001\u573a\u666f\u3002\u5728 MuJoCo \u684c\u9762\u63a8\u52a8\u4efb\u52a1\u4e2d\uff0c\u8be5\u65b9\u6cd5\u4ee5\u66f4\u5c11\u53c2\u6570\u663e\u8457\u63d0\u5347\u9884\u6d4b\u7cbe\u5ea6\u3001\u8de8\u7269\u4f53\u6570\u91cf\u6cdb\u5316\u548c\u6570\u636e\u6548\u7387\uff0c\u5e76\u5728\u89c4\u5212\u5668\u4e2d\u5f00\u59cb\u83b7\u5f97\u975e\u96f6\u6210\u529f\u7387\uff0c\u800c\u7a20\u5bc6\u57fa\u7ebf\u59cb\u7ec8\u5931\u8d25\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02046", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u7269\u4f53\u4e2d\u5fc3", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02046v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Modeling What Changes: Sparse, Residual World Models for Object-Centric Manipulation", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u7269\u4f53\u4e2d\u5fc3\u64cd\u4f5c\u7684\u7a00\u758f\u6b8b\u5dee\u4e16\u754c\u6a21\u578b\uff0c\u53ea\u9884\u6d4b\u53d1\u751f\u53d8\u5316\u7684\u7269\u4f53\uff0c\u5e76\u7528\u6b8b\u5dee\u589e\u91cf\u66f4\u65b0\u5176\u72b6\u6001\uff0c\u907f\u514d\u53cd\u590d\u91cd\u9884\u6d4b\u9759\u6001\u573a\u666f\u3002\u5728 MuJoCo \u684c\u9762\u63a8\u52a8\u4efb\u52a1\u4e2d\uff0c\u8be5\u65b9\u6cd5\u4ee5\u66f4\u5c11\u53c2\u6570\u663e\u8457\u63d0\u5347\u9884\u6d4b\u7cbe\u5ea6\u3001\u8de8\u7269\u4f53\u6570\u91cf\u6cdb\u5316\u548c\u6570\u636e\u6548\u7387\uff0c\u5e76\u5728\u89c4\u5212\u5668\u4e2d\u5f00\u59cb\u83b7\u5f97\u975e\u96f6\u6210\u529f\u7387\uff0c\u800c\u7a20\u5bc6\u57fa\u7ebf\u59cb\u7ec8\u5931\u8d25\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-context inference retains a growing key--value (KV) cache during decoding, which consumes substantial GPU memory and can reduce generation throughput. This bottleneck remains in hybrid language models because their residual global-attention layers can dominate context-dependent cache demand. We study how to allocate this state under an aggregate KV-residency budget. We introduce HeadWiseKV, a training-free framework that compresses the residual global KV caches of hybrid language models while preserving their native local, recurrent, and linear paths. It assigns each physical KV head a static, multilevel history window, making cache demand predictable before serving. We formulate this allocation as a restricted operational rate--distortion problem and propose SeqCalib as the core policy-generation algorithm in HeadWiseKV. SeqCalib processes layers in execution order and conditions each decision on the lower-layer policy used at deployment, thereby accounting for interactions across depth. A grouped-cache runtime materializes the selected policy as actual per-head KV residency rather than a mask over a full cache. We evaluate downstream quality across four hybrid long-context models and study physical residency and serving behavior on Qwen3.6-27B. HeadWiseKV retains near-Full-KV RULER and LoCoMo quality across the evaluated models. In the fixed-model systems study, it reduces sampled peak device memory by 8.59\\% at a 112K context length and extends the largest verified successful context from 114K to 161K.", "arxiv_id": "2609.02029", "arxiv_url": "https://arxiv.org/abs/2609.02029", "authors": ["Renjie Xie", "Juncheng Yang", "Aoting Hu", "Mingxi Zhang", "Liyao Wu", "Zheheng Hong", "Wei Xu"], "brief": "\u8bba\u6587\u63d0\u51fa HeadWiseKV\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u957f\u4e0a\u4e0b\u6587 KV \u7f13\u5b58\u538b\u7f29\u6846\u67b6\uff0c\u4e3a\u6df7\u5408\u8bed\u8a00\u6a21\u578b\u4e2d\u6bcf\u4e2a KV \u5934\u5206\u914d\u9759\u6001\u591a\u7ea7\u5386\u53f2\u7a97\u53e3\uff0c\u5728\u9884\u7b97\u4e0b\u51cf\u5c11\u5168\u5c40\u6ce8\u610f\u529b\u5c42\u7f13\u5b58\u5360\u7528\u3002\u5176 SeqCalib \u7b56\u7565\u80fd\u4fdd\u6301\u63a5\u8fd1 Full-KV \u7684 RULER \u548c LoCoMo \u8d28\u91cf\uff0c\u5e76\u5728 Qwen3.6-27B \u4e0a\u964d\u4f4e\u5cf0\u503c\u663e\u5b58\u3001\u5c06\u53ef\u9a8c\u8bc1\u4e0a\u4e0b\u6587\u4ece 114K \u6269\u5c55\u5230 161K\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02029", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02029v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HeadWiseKV: Budgeted Per-Head Cache Residency for Hybrid Long-Context Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa HeadWiseKV\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u957f\u4e0a\u4e0b\u6587 KV \u7f13\u5b58\u538b\u7f29\u6846\u67b6\uff0c\u4e3a\u6df7\u5408\u8bed\u8a00\u6a21\u578b\u4e2d\u6bcf\u4e2a KV \u5934\u5206\u914d\u9759\u6001\u591a\u7ea7\u5386\u53f2\u7a97\u53e3\uff0c\u5728\u9884\u7b97\u4e0b\u51cf\u5c11\u5168\u5c40\u6ce8\u610f\u529b\u5c42\u7f13\u5b58\u5360\u7528\u3002\u5176 SeqCalib \u7b56\u7565\u80fd\u4fdd\u6301\u63a5\u8fd1 Full-KV \u7684 RULER \u548c LoCoMo \u8d28\u91cf\uff0c\u5e76\u5728 Qwen3.6-27B \u4e0a\u964d\u4f4e\u5cf0\u503c\u663e\u5b58\u3001\u5c06\u53ef\u9a8c\u8bc1\u4e0a\u4e0b\u6587\u4ece 114K \u6269\u5c55\u5230 161K\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Stable 4-bit floating-point (FP4) pretraining is difficult because the E2M1 payload represents only a narrow range of magnitudes. NVIDIA\u0027s Transformer Engine \\nv{} recipe addresses this with current-tensor scaling, a randomized Hadamard transform (RHT), and bfloat16 (BF16) final layers, adding work outside the FP4 matrix multiplications. We instead pair E2M1 payloads with unsigned E5M3 (\\ue{}) block scales. Their wider range permits periodic tensor scaling, while our recipe applies selective stochastic rounding to backward gradients, omits RHT, and uses FP4 in all eligible internal linears. We pretrain a Nemotron-H 8B model for nearly 190 billion tokens. Compared with Transformer Engine \\nv{}, the proposed block-16 recipe finishes with lower final-window training loss and, under their respective quantized-inference policies, lower validation loss measured as held-out negative log-likelihood. Its quantized-inference downstream point estimates are also higher on all three reported aggregates. A native \\nv{} execution ablation that jointly removes RHT and the BF16 final-block exemption increases measured model-body token throughput by 21.2\\%. These results demonstrate end-to-end software-emulated \\uefp{} pretraining with a simpler recipe and motivate native support for \\ue{} block scaling.", "arxiv_id": "2609.02846", "arxiv_url": "https://arxiv.org/abs/2609.02846", "authors": ["Robert Hu", "Carlo Luschi", "Paul Balanca"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u65e0\u7b26\u53f7 E5M3 \u5757\u7f29\u653e\u914d\u5408 E2M1 FP4 \u8868\u793a\uff0c\u7b80\u5316\u7a33\u5b9a 4-bit \u6d6e\u70b9\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u6d41\u7a0b\uff0c\u53bb\u6389\u968f\u673a Hadamard \u53d8\u6362\u5e76\u8ba9\u66f4\u591a\u5185\u90e8\u7ebf\u6027\u5c42\u4f7f\u7528 FP4\u3002 \u5728 8B Nemotron-H\u3001\u8fd1 1900 \u4ebf token \u9884\u8bad\u7ec3\u4e2d\uff0c\u76f8\u6bd4 NVIDIA Transformer Engine \u914d\u65b9\u53d6\u5f97\u66f4\u4f4e\u8bad\u7ec3/\u9a8c\u8bc1\u635f\u5931\uff0c\u541e\u5410\u6d88\u878d\u63d0\u5347 21.2%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02846", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f4e\u7cbe\u5ea6\u8bad\u7ec3", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u9884\u8bad\u7ec3", "\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02846v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "UE5M3 FP4 Block Scaling for Stable Language Model Pretraining", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u65e0\u7b26\u53f7 E5M3 \u5757\u7f29\u653e\u914d\u5408 E2M1 FP4 \u8868\u793a\uff0c\u7b80\u5316\u7a33\u5b9a 4-bit \u6d6e\u70b9\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u6d41\u7a0b\uff0c\u53bb\u6389\u968f\u673a Hadamard \u53d8\u6362\u5e76\u8ba9\u66f4\u591a\u5185\u90e8\u7ebf\u6027\u5c42\u4f7f\u7528 FP4\u3002 \u5728 8B Nemotron-H\u3001\u8fd1 1900 \u4ebf token \u9884\u8bad\u7ec3\u4e2d\uff0c\u76f8\u6bd4 NVIDIA Transformer Engine \u914d\u65b9\u53d6\u5f97\u66f4\u4f4e\u8bad\u7ec3/\u9a8c\u8bc1\u635f\u5931\uff0c\u541e\u5410\u6d88\u878d\u63d0\u5347 21.2%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-Augmented Code Generation (RACG) improves LLM-based software development by retrieving external code artifacts, documentation, and patches, and incorporating them into the generation context. This reliance on external knowledge introduces a critical trust boundary: poisoned artifacts can influence generated code without modifying the underlying LLM. Prior work shows that selecting existing vulnerable examples can increase the general vulnerability rate of RACG outputs, but leaves open whether a black-box attacker can construct a single task-matched artifact that propagates an attacker-selected weakness. We introduce CodePoisonRAG, a targeted upstream knowledge-poisoning framework that transforms benign fixed-code entries into poisoned artifacts. Its attack chain combines CWE-specific Vulnerability Injection, which embeds a selected source-to-sink flow while retaining task alignment, with Semantic Mislabeling, which adds false safety claims without repairing the vulnerable behavior. The attacker has no access to the victim\u0027s deployed knowledge base, retriever, re-ranker, generator, prompt, or defense mechanism and injects at most one artifact per anticipated programming task. We construct 85 poisoned artifacts covering ten CWE classes across Java and C, yielding an aggregate corpus-poisoning ratio of 0.7%. Across three generators, all 85 artifacts appear among the Top-3 results for their corresponding queries, and CodePoisonRAG achieves attack success rates between 0.80 and 0.93. Against CodeGuarder, which injects vulnerability-specific security knowledge into the generation context, the attack retains success rates between 0.40 and 0.71. These results show that RACG poisoning extends beyond the incidental propagation of existing vulnerabilities to the targeted construction and propagation of attacker-selected weaknesses.", "arxiv_id": "2609.02774", "arxiv_url": "https://arxiv.org/abs/2609.02774", "authors": ["Varun Gadey", "Ziad Marey", "Alexandra Dmitrienko"], "brief": "\u8bba\u6587\u63d0\u51fa CodePoisonRAG\uff0c\u4e00\u79cd\u9762\u5411\u68c0\u7d22\u589e\u5f3a\u4ee3\u7801\u751f\u6210\u7684\u9ed1\u76d2\u77e5\u8bc6\u6295\u6bd2\u653b\u51fb\uff0c\u53ef\u5c06\u770b\u4f3c\u4fee\u590d\u7684\u4ee3\u7801\u6761\u76ee\u6539\u9020\u6210\u5305\u542b\u6307\u5b9a CWE \u6f0f\u6d1e\u4e14\u5e26\u6709\u865a\u5047\u5b89\u5168\u58f0\u660e\u7684\u6295\u6bd2\u5de5\u4ef6\u3002\u5b9e\u9a8c\u5728 Java/C \u7684 10 \u7c7b CWE \u4e0a\u6784\u9020 85 \u4e2a\u6837\u672c\uff0c\u6781\u4f4e\u6295\u6bd2\u6bd4\u4f8b\u4e0b\u4ecd\u80fd\u4f7f\u76f8\u5173\u5de5\u4ef6\u8fdb\u5165 Top-3 \u68c0\u7d22\u7ed3\u679c\uff0c\u5e76\u5728\u4e09\u79cd\u751f\u6210\u5668\u4e0a\u8fbe\u5230 0.80-0.93 \u7684\u653b\u51fb\u6210\u529f\u7387\uff1b\u9762\u5bf9 CodeGuarder \u9632\u5fa1\u4ecd\u4fdd\u6301 0.40-0.71\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02774", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5b89\u5168\u653b\u51fb", "\u77e5\u8bc6\u6295\u6bd2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02774v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CodePoisonRAG: Knowledge Poisoning Attacks on Retrieval-Augmented Code Generation", "tldr": "\u8bba\u6587\u63d0\u51fa CodePoisonRAG\uff0c\u4e00\u79cd\u9762\u5411\u68c0\u7d22\u589e\u5f3a\u4ee3\u7801\u751f\u6210\u7684\u9ed1\u76d2\u77e5\u8bc6\u6295\u6bd2\u653b\u51fb\uff0c\u53ef\u5c06\u770b\u4f3c\u4fee\u590d\u7684\u4ee3\u7801\u6761\u76ee\u6539\u9020\u6210\u5305\u542b\u6307\u5b9a CWE \u6f0f\u6d1e\u4e14\u5e26\u6709\u865a\u5047\u5b89\u5168\u58f0\u660e\u7684\u6295\u6bd2\u5de5\u4ef6\u3002\u5b9e\u9a8c\u5728 Java/C \u7684 10 \u7c7b CWE \u4e0a\u6784\u9020 85 \u4e2a\u6837\u672c\uff0c\u6781\u4f4e\u6295\u6bd2\u6bd4\u4f8b\u4e0b\u4ecd\u80fd\u4f7f\u76f8\u5173\u5de5\u4ef6\u8fdb\u5165 Top-3 \u68c0\u7d22\u7ed3\u679c\uff0c\u5e76\u5728\u4e09\u79cd\u751f\u6210\u5668\u4e0a\u8fbe\u5230 0.80-0.93 \u7684\u653b\u51fb\u6210\u529f\u7387\uff1b\u9762\u5bf9 CodeGuarder \u9632\u5fa1\u4ecd\u4fdd\u6301 0.40-0.71\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Leech-lattice vector quantization holds the strongest reported 2-bit quality under its own evaluation protocol. Its kernel decodes one shell; we found no implementation of the multi-shell decoder the rate requires. This paper supplies one and measures its serving cost for decode-phase GEMV at batch 1. First, a serving path for the full 301-class codebook: an offline expansion into GPU layouts and a fused dequantize-plus-matvec kernel reading them without warp divergence, verified against f64. Second, the in-VRAM rate is a design axis distinct from the on-disk rate. Four bit-exact layouts timed in one process show binary bit planes beating one-hot masks on size and speed at constant bandwidth (4.80 bits per weight, 2.15x FP16). Below 4.3 bits a second, irregular stream enters; at 3.6 the decode stops being shifts and masks. Third, deployed four-bit (AWQ) and two-bit (QTIP) GEMV kernels run in the same process. The trellis kernel reads 2.40x fewer bytes than our served layout and runs 2.27x faster at near-equal fractions of their byte bounds: the time gap tracks the traffic gap, the price of unfolding a codebook too large for a lookup table. Fourth, the validity envelope: the trellis kernel outruns our no-weights control, so our launch geometry sets that floor, and on a second memory hierarchy every lattice arm falls below FP16. With the output head held identical across arms, the kernel-and-format path gains 1.11x, 1.29x and 1.41x end to end at 4B, 8B and 14B; with an int8 output head the served 4B reaches 87.0 tok/s in 2.60 GB. The quality cost, 1.38x perplexity and 14.7 MMLU points at 4B, shrinks across the three sizes measured.", "arxiv_id": "2609.02652", "arxiv_url": "https://arxiv.org/abs/2609.02652", "authors": ["Pier-Jean Malandrino"], "brief": "\u8bba\u6587\u4e3a Leech \u683c\u70b9 2-bit LLM \u6743\u91cd\u91cf\u5316\u8865\u9f50\u4e86\u5b8c\u6574\u7684\u591a\u58f3\u89e3\u7801\u5b9e\u73b0\uff0c\u5e76\u63d0\u51fa\u79bb\u7ebf\u5c55\u5f00\u5230 GPU \u663e\u5b58\u5e03\u5c40\u3001\u878d\u5408\u53cd\u91cf\u5316\u52a0\u77e9\u9635\u5411\u91cf\u4e58\u7684 batch1 \u63a8\u7406\u8def\u5f84\u3002\u5b9e\u9a8c\u663e\u793a\u4e8c\u8fdb\u5236\u4f4d\u5e73\u9762\u5e03\u5c40\u5728\u663e\u5b58\u4e0e\u901f\u5ea6\u4e0a\u4f18\u4e8e one-hot\uff0c\u4f46\u5c55\u5f00\u5927\u7801\u672c\u5e26\u6765\u8f83\u9ad8\u6d41\u91cf\u6210\u672c\uff0c\u76f8\u6bd4 QTIP trellis kernel \u4ecd\u6162\u7ea6 2.27 \u500d\uff1b\u7aef\u5230\u7aef\u5728 4B/8B/14B \u6a21\u578b\u4e0a\u83b7\u5f97 1.11x\u30011.29x\u30011.41x \u52a0\u901f\u4f46\u6709\u4e00\u5b9a\u56f0\u60d1\u5ea6\u4e0e MMLU \u635f\u5931\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02652", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u91cf\u5316", "\u63a8\u7406\u52a0\u901f", "GPU\u5185\u6838"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02652v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unfolding the Leech Lattice: Fused Multi-Shell Decoding and VRAM Layouts for 2-Bit LLM Weights", "tldr": "\u8bba\u6587\u4e3a Leech \u683c\u70b9 2-bit LLM \u6743\u91cd\u91cf\u5316\u8865\u9f50\u4e86\u5b8c\u6574\u7684\u591a\u58f3\u89e3\u7801\u5b9e\u73b0\uff0c\u5e76\u63d0\u51fa\u79bb\u7ebf\u5c55\u5f00\u5230 GPU \u663e\u5b58\u5e03\u5c40\u3001\u878d\u5408\u53cd\u91cf\u5316\u52a0\u77e9\u9635\u5411\u91cf\u4e58\u7684 batch1 \u63a8\u7406\u8def\u5f84\u3002\u5b9e\u9a8c\u663e\u793a\u4e8c\u8fdb\u5236\u4f4d\u5e73\u9762\u5e03\u5c40\u5728\u663e\u5b58\u4e0e\u901f\u5ea6\u4e0a\u4f18\u4e8e one-hot\uff0c\u4f46\u5c55\u5f00\u5927\u7801\u672c\u5e26\u6765\u8f83\u9ad8\u6d41\u91cf\u6210\u672c\uff0c\u76f8\u6bd4 QTIP trellis kernel \u4ecd\u6162\u7ea6 2.27 \u500d\uff1b\u7aef\u5230\u7aef\u5728 4B/8B/14B \u6a21\u578b\u4e0a\u83b7\u5f97 1.11x\u30011.29x\u30011.41x \u52a0\u901f\u4f46\u6709\u4e00\u5b9a\u56f0\u60d1\u5ea6\u4e0e MMLU \u635f\u5931\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models can look capable of logical reasoning, but correct or incorrect answers alone tell us little about what the model represents internally. We study logical verification in five open-weight transformer models using matched valid--invalid premise--claim pairs that vary across inference families, semantic domains, templates, and difficulty levels. Despite near-chance behavioral performance, logical validity is often almost perfectly decodable from hidden states and remains strongly decodable under held-out templates, domains, and inference families. Validity also remains highly decodable on behaviorally incorrect examples in the conditions where correctness-conditioned evaluation is well defined. At the same time, exhaustive leave-one-out tests reveal clear limits to this generalization, and interventions along probe-derived validity directions have only weak, nonspecific effects compared with random controls. Our results suggest that representing validity, expressing it in behavior, and using it causally are distinct. Validity related information can be strongly decodable from a model\u0027s hidden states without being reliably expressed in its output.", "arxiv_id": "2609.02438", "arxiv_url": "https://arxiv.org/abs/2609.02438", "authors": ["Smitha Muthya Sudheendra", "Jaideep Srivastava"], "brief": "\u7814\u7a76\u5728\u4e94\u4e2a\u5f00\u6e90 Transformer \u8bed\u8a00\u6a21\u578b\u4e2d\u68c0\u9a8c\u903b\u8f91\u6709\u6548\u6027\u8868\u5f81\uff0c\u53d1\u73b0\u5373\u4f7f\u6a21\u578b\u5916\u90e8\u56de\u7b54\u63a5\u8fd1\u968f\u673a\uff0c\u9690\u85cf\u72b6\u6001\u4e2d\u4ecd\u53ef\u9ad8\u5ea6\u89e3\u7801\u51fa\u547d\u9898\u662f\u5426\u903b\u8f91\u6709\u6548\uff0c\u5e76\u80fd\u5728\u6a21\u677f\u3001\u9886\u57df\u548c\u63a8\u7406\u7c7b\u578b\u5916\u4e00\u5b9a\u6cdb\u5316\u3002\u4e0e\u6b64\u540c\u65f6\uff0c\u7559\u4e00\u6d4b\u8bd5\u548c\u56e0\u679c\u5e72\u9884\u663e\u793a\u8fd9\u79cd\u8868\u5f81\u5e76\u4e0d\u7a33\u5b9a\u5730\u8f6c\u5316\u4e3a\u884c\u4e3a\u8f93\u51fa\uff0c\u4e14\u6cbf\u63a2\u9488\u65b9\u5411\u5e72\u9884\u6548\u679c\u5f31\uff0c\u8bf4\u660e\u201c\u53ef\u89e3\u7801\u201d\u201c\u4f1a\u8868\u8fbe\u201d\u548c\u201c\u56e0\u679c\u4f7f\u7528\u201d\u662f\u4e0d\u540c\u5c42\u9762\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02438", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u903b\u8f91\u63a8\u7406", "\u53ef\u89e3\u91ca\u6027", "\u56e0\u679c\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02438v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Decodability Is Not Enough: Logical Validity Representations, Behavioral Dissociation, and Causal Tests in Language Models", "tldr": "\u7814\u7a76\u5728\u4e94\u4e2a\u5f00\u6e90 Transformer \u8bed\u8a00\u6a21\u578b\u4e2d\u68c0\u9a8c\u903b\u8f91\u6709\u6548\u6027\u8868\u5f81\uff0c\u53d1\u73b0\u5373\u4f7f\u6a21\u578b\u5916\u90e8\u56de\u7b54\u63a5\u8fd1\u968f\u673a\uff0c\u9690\u85cf\u72b6\u6001\u4e2d\u4ecd\u53ef\u9ad8\u5ea6\u89e3\u7801\u51fa\u547d\u9898\u662f\u5426\u903b\u8f91\u6709\u6548\uff0c\u5e76\u80fd\u5728\u6a21\u677f\u3001\u9886\u57df\u548c\u63a8\u7406\u7c7b\u578b\u5916\u4e00\u5b9a\u6cdb\u5316\u3002\u4e0e\u6b64\u540c\u65f6\uff0c\u7559\u4e00\u6d4b\u8bd5\u548c\u56e0\u679c\u5e72\u9884\u663e\u793a\u8fd9\u79cd\u8868\u5f81\u5e76\u4e0d\u7a33\u5b9a\u5730\u8f6c\u5316\u4e3a\u884c\u4e3a\u8f93\u51fa\uff0c\u4e14\u6cbf\u63a2\u9488\u65b9\u5411\u5e72\u9884\u6548\u679c\u5f31\uff0c\u8bf4\u660e\u201c\u53ef\u89e3\u7801\u201d\u201c\u4f1a\u8868\u8fbe\u201d\u548c\u201c\u56e0\u679c\u4f7f\u7528\u201d\u662f\u4e0d\u540c\u5c42\u9762\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A long-held intuition in interpretability research is that representational entanglement, the sharing of structure between knowledge domains in a neural network, makes unlearning harder. While the intuition is widespread, it has never been directly tested in a controlled experiment. We present a way to do so: by repurposing Selective Gradient Masking (SGTM), we train a suite of six 254M-parameter language models on English Wikipedia with graded levels of disentanglement between biology and non-biology knowledge. Applying three standard unlearning methods to every model in the suite, we find that more disentangled models consistently achieve better retain-forget trade-offs: at a fixed level of forgetting, the most disentangled models incur roughly $4\\times$ lower retain cost under two of the three methods, and $1.3\\times$ lower under the third. Because our intervention changes only the model, not the data or the unlearning algorithm, this is direct evidence that representational entanglement is one of the causes of collateral damage in unlearning, as interpretability researchers have long suspected. A similar design could be used to test other structural claims from interpretability.", "arxiv_id": "2609.02285", "arxiv_url": "https://arxiv.org/abs/2609.02285", "authors": ["Ev\u017een Wybitul", "Tim G. J. Rudner", "Christian Schroeder de Witt"], "brief": "\u8bba\u6587\u901a\u8fc7\u6539\u9020\u9009\u62e9\u6027\u68af\u5ea6\u63a9\u853d\uff0c\u8bad\u7ec3\u51fa\u4e00\u7ec4\u5728\u751f\u7269\u4e0e\u975e\u751f\u7269\u77e5\u8bc6\u95f4\u5177\u6709\u4e0d\u540c\u89e3\u8026\u7a0b\u5ea6\u7684 254M \u8bed\u8a00\u6a21\u578b\uff0c\u7528\u4e8e\u53d7\u63a7\u6d4b\u8bd5\u8868\u5f81\u7ea0\u7f20\u5bf9\u673a\u5668\u9057\u5fd8\u7684\u5f71\u54cd\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8868\u5f81\u8d8a\u89e3\u8026\uff0c\u9057\u5fd8\u65f6\u5bf9\u4fdd\u7559\u77e5\u8bc6\u7684\u9644\u5e26\u635f\u4f24\u8d8a\u5c0f\uff1b\u5728\u76f8\u540c\u9057\u5fd8\u7a0b\u5ea6\u4e0b\uff0c\u6700\u89e3\u8026\u6a21\u578b\u7684\u4fdd\u7559\u6210\u672c\u53ef\u964d\u4f4e\u7ea6 1.3 \u5230 4 \u500d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02285", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u9057\u5fd8", "\u8868\u5f81\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02285v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Entangled Representations Amplify Collateral Damage in Unlearning", "tldr": "\u8bba\u6587\u901a\u8fc7\u6539\u9020\u9009\u62e9\u6027\u68af\u5ea6\u63a9\u853d\uff0c\u8bad\u7ec3\u51fa\u4e00\u7ec4\u5728\u751f\u7269\u4e0e\u975e\u751f\u7269\u77e5\u8bc6\u95f4\u5177\u6709\u4e0d\u540c\u89e3\u8026\u7a0b\u5ea6\u7684 254M \u8bed\u8a00\u6a21\u578b\uff0c\u7528\u4e8e\u53d7\u63a7\u6d4b\u8bd5\u8868\u5f81\u7ea0\u7f20\u5bf9\u673a\u5668\u9057\u5fd8\u7684\u5f71\u54cd\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8868\u5f81\u8d8a\u89e3\u8026\uff0c\u9057\u5fd8\u65f6\u5bf9\u4fdd\u7559\u77e5\u8bc6\u7684\u9644\u5e26\u635f\u4f24\u8d8a\u5c0f\uff1b\u5728\u76f8\u540c\u9057\u5fd8\u7a0b\u5ea6\u4e0b\uff0c\u6700\u89e3\u8026\u6a21\u578b\u7684\u4fdd\u7559\u6210\u672c\u53ef\u964d\u4f4e\u7ea6 1.3 \u5230 4 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-bit watermarking for large language models (LLMs) enables content source tracing by embedding user-identifiable messages into generated text. Existing methods face a fundamental trade-off among extraction accuracy, text quality, and payload capacity. We propose WeaveMark, a robust and scalable multi-bit LLM watermarking scheme based on coded payload spreading. WeaveMark shifts this trade-off frontier by improving payload capacity through multi-bit-per-token spreading, improving extraction accuracy through soft-decision error-correcting code, and preserving text quality through unbiased multilayer reweighting. It further introduces dedicated zero-bit layers for reliable watermark presence detection. Experiments show large gains, especially for long messages and edited text. WeaveMark achieves 89.8% match rate for 32-bit messages at 200 tokens, compared with 20.8% for BiMark. Under 10% substitution attacks on 16-bit messages at 200 tokens, it maintains 86.0% versus 30.7%, while preserving text quality. Our code is available at https://github.com/qkrrkd90-source/WeaveMark.", "arxiv_id": "2609.02177", "arxiv_url": "https://arxiv.org/abs/2609.02177", "authors": ["Gang-Hyun Park", "Ju-Hyeong Lee", "Hee-Youl Kwak", "Dae-Young Yun"], "brief": "WeaveMark \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u7f16\u7801\u8f7d\u8377\u6269\u6563\u7684\u591a\u6bd4\u7279\u5927\u8bed\u8a00\u6a21\u578b\u6c34\u5370\u65b9\u6cd5\uff0c\u901a\u8fc7\u591a\u6bd4\u7279\u9010 token \u6269\u6563\u3001\u8f6f\u5224\u51b3\u7ea0\u9519\u7801\u548c\u65e0\u504f\u591a\u5c42\u91cd\u52a0\u6743\uff0c\u540c\u65f6\u63d0\u5347\u8f7d\u8377\u5bb9\u91cf\u3001\u63d0\u53d6\u51c6\u786e\u7387\u4e0e\u6587\u672c\u8d28\u91cf\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u957f\u6d88\u606f\u548c\u88ab\u7f16\u8f91\u6587\u672c\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u4f8b\u5982 200 token \u4e0b 32 \u6bd4\u7279\u6d88\u606f\u5339\u914d\u7387\u8fbe 89.8%\uff0c\u4e14\u5728\u66ff\u6362\u653b\u51fb\u4e0b\u4ecd\u4fdd\u6301\u8f83\u5f3a\u9c81\u68d2\u6027\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02177", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b57\u6c34\u5370", "\u7ea0\u9519\u7f16\u7801", "\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.02177v1", "published_at": "2026-09-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "WeaveMark: Robust and Scalable Multi-bit LLM Watermarking via Coded Payload Spreading", "tldr": "WeaveMark \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u7f16\u7801\u8f7d\u8377\u6269\u6563\u7684\u591a\u6bd4\u7279\u5927\u8bed\u8a00\u6a21\u578b\u6c34\u5370\u65b9\u6cd5\uff0c\u901a\u8fc7\u591a\u6bd4\u7279\u9010 token \u6269\u6563\u3001\u8f6f\u5224\u51b3\u7ea0\u9519\u7801\u548c\u65e0\u504f\u591a\u5c42\u91cd\u52a0\u6743\uff0c\u540c\u65f6\u63d0\u5347\u8f7d\u8377\u5bb9\u91cf\u3001\u63d0\u53d6\u51c6\u786e\u7387\u4e0e\u6587\u672c\u8d28\u91cf\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u957f\u6d88\u606f\u548c\u88ab\u7f16\u8f91\u6587\u672c\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u4f8b\u5982 200 token \u4e0b 32 \u6bd4\u7279\u6d88\u606f\u5339\u914d\u7387\u8fbe 89.8%\uff0c\u4e14\u5728\u66ff\u6362\u653b\u51fb\u4e0b\u4ecd\u4fdd\u6301\u8f83\u5f3a\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Optimization-based jailbreak attacks such as Greedy Coordinate Gradient (GCG) achieve strong effectiveness and transferability by optimizing adversarial suffixes on white-box source models. However, existing GCG-based methods rely on averaged adversarial loss and deep greedy search, which can over-emphasize easy-to-jailbreak behaviors and overlook promising regions of the suffix space. We propose BOSS, a plug-and-play framework that improves GCG-based jailbreak optimization through breadth-oriented suffix search. BOSS uses Tail-Focused Adversarial Loss (TFAL), standard source loss, and behavior coverage to select terminal suffixes, then explores multiple short trajectories and selectively continues promising suffixes. Experiments on public benchmarks show that BOSS improves attack success rates across multiple GCG-based methods while reducing optimization time.", "arxiv_id": "2609.02172", "arxiv_url": "https://arxiv.org/abs/2609.02172", "authors": ["Shiliang Xiao", "Jingsong Wei", "Yuzhi Liang", "Yufan Zheng", "Xia Li", "Qiliang Lin"], "brief": "\u8bba\u6587\u63d0\u51fa BOSS\uff0c\u4e00\u4e2a\u53ef\u63d2\u62d4\u7684 GCG \u8d8a\u72f1\u653b\u51fb\u4f18\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u9762\u5411\u5e7f\u5ea6\u
