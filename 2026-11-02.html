<script>
const PAPERS = [{"abstract": "Progress toward artificial general intelligence (AGI) has largely relied on scaling a resource-intensive executive, System-2, through larger models, more data and compute, longer reasoning, and more agents. We ask whether the next stage may come instead from co-designing it with System-1, a lightweight, semantically aware predictor that evaluates candidate interactions before execution, so that System-2 acts only on those worth their cost. Our answer is a qualified yes. We study \\textit{conditional interaction}, a predict--gate--execute--update loop: System-1 estimates each candidate\u0027s utility, System-2 executes those admitted by an adaptive threshold, and the outcomes update System-1. The loop spans training, test-time reasoning, adaptive decision-making, and agentic tool use, with utility and cost defined by the application. Under ideal screening and equal execution costs, execution compute falls by a factor approaching $1/\u03c1_u$, where $\u03c1_u$ is the density of utility-relevant interactions (cost-weighted when costs differ); prediction errors, exploration, and distribution shift reduce the saving. We bound selection regret by predictor error and the utility margin. These results motivate our central hypothesis: $\u03c1_u$ is a measurable coordinate of scaling efficiency and makes informative compute a better description of scaling than total compute.", "arxiv_id": "2610.39497", "arxiv_url": "https://arxiv.org/abs/2610.39497", "authors": ["Qi Wang", "Yun Qu", "Lizhou Cai", "Heming Zou", "Haoang Chi", "Yiqin Lv", "Xiang Li", "Haiyan Feng", "Mengyu Ge", "Yize Geng", "Yuhang Jiang", "Yixiu Mao", "Xiangyang Ji"], "brief": "\u7814\u7a76\u4ee5\u6761\u4ef6\u4ea4\u4e92\u66ff\u4ee3\u76f2\u76ee\u6269\u5c55\u6267\u884c\u7b97\u529b\uff1aSystem-1\u9884\u6d4b\u5019\u9009\u4ea4\u4e92\u6548\u7528\uff0c\u7ecf\u81ea\u9002\u5e94\u9608\u503c\u7b5b\u9009\u540e\u7531System-2\u6267\u884c\uff0c\u518d\u7528\u7ed3\u679c\u66f4\u65b0\u9884\u6d4b\u5668\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39497", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6761\u4ef6\u4ea4\u4e92\u91c7\u7528\u9884\u6d4b\u2014\u95e8\u63a7\u2014\u6267\u884c\u2014\u66f4\u65b0\u95ed\u73af", "\u7406\u60f3\u7b5b\u9009\u4e0b\uff0c\u6267\u884c\u7b97\u529b\u8282\u7701\u500d\u6570\u8d8b\u8fd11/\u03c1_u", "\u4ee5\u9884\u6d4b\u8bef\u5dee\u548c\u6548\u7528\u95f4\u9694\u7ea6\u675f\u9009\u62e9\u9057\u61be"], "keywords": ["\u7b97\u529b\u6548\u7387", "\u6761\u4ef6\u8ba1\u7b97", "\u667a\u80fd\u4f53", "\u6548\u7528\u9884\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2610.39497v1", "published_at": "2026-10-29", "score": 0.721, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (54\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39497.png", "title": "Does Scaling Toward AGI Depend on What System-1 Lets System-2 Execute?", "tldr": "\u7528\u8f7b\u91cf\u9884\u6d4b\u5668\u7b5b\u9009\u9ad8\u4ef7\u503c\u4ea4\u4e92\uff0c\u8ba9\u6602\u8d35\u63a8\u7406\u7cfb\u7edf\u53ea\u6267\u884c\u503c\u5f97\u6d88\u8017\u7b97\u529b\u7684\u64cd\u4f5c\u3002", "upvotes": 54, "what_it_is": "\u7814\u7a76\u4ee5\u6761\u4ef6\u4ea4\u4e92\u66ff\u4ee3\u76f2\u76ee\u6269\u5c55\u6267\u884c\u7b97\u529b\uff1aSystem-1\u9884\u6d4b\u5019\u9009\u4ea4\u4e92\u6548\u7528\uff0c\u7ecf\u81ea\u9002\u5e94\u9608\u503c\u7b5b\u9009\u540e\u7531System-2\u6267\u884c\uff0c\u518d\u7528\u7ed3\u679c\u66f4\u65b0\u9884\u6d4b\u5668\u3002", "why_notable": "\u5c06\u6269\u5c55\u6548\u7387\u4e0e\u6709\u6548\u4ea4\u4e92\u5bc6\u5ea6\u8054\u7cfb\u8d77\u6765\uff0c\u4e3a\u8bad\u7ec3\u3001\u63a8\u7406\u53ca\u5de5\u5177\u8c03\u7528\u63d0\u4f9b\u7edf\u4e00\u7684\u7b97\u529b\u7b5b\u9009\u89c6\u89d2\uff0c\u5f3a\u8c03\u6709\u6548\u7b97\u529b\u800c\u975e\u603b\u7b97\u529b\u3002"}, {"abstract": "Recent advances in video world models have enabled the generation of increasingly realistic and interactive virtual environments, opening new possibilities for player-customizable gameplay. Agentic frameworks further advance this direction by decoupling explicit game logic and controllable world representations from visual generation. However, existing approaches support only simple game settings and predefined motion patterns, generalize poorly to unseen environments and characters, and offer limited real-time interactivity. In this paper, we introduce Wizard, an agentic game world model that enables real-time, precise control over character motions while generalizing zero-shot across novel scenes, characters, and actions. To achieve this, we construct a diverse dataset spanning 750 scenes and 178 characters, incorporating skeleton and geometry information as structured representations. We leverage these representations as intermediate proxies to condition a video generation model, together with an adaptive masking mechanism that improves alignment between the conditioning signals and generated video rollouts. Furthermore, we introduce an agentic framework that explicitly maintains and updates game states, allowing players to freely configure their virtual worlds and exercise fine-grained control over character motions while preserving visual quality and gameplay consistency. By combining agentic control with structured proxy-based generation, our framework unlocks new possibilities for player-driven game creation with real-time, generalizable, and mechanically consistent world simulation.", "arxiv_id": "2610.40339", "arxiv_url": "https://arxiv.org/abs/2610.40339", "authors": ["Yuzhe Wu", "Zijun Lin", "Yeying Jin"], "brief": "Wizard\u5c06\u9aa8\u67b6\u548c\u51e0\u4f55\u4fe1\u606f\u4f5c\u4e3a\u4e2d\u95f4\u4ee3\u7406\uff0c\u5f15\u5bfc\u89c6\u9891\u6a21\u578b\u751f\u6210\u6e38\u620f\u753b\u9762\uff1b\u667a\u80fd\u4f53\u663e\u5f0f\u7ef4\u62a4\u5e76\u66f4\u65b0\u6e38\u620f\u72b6\u6001\uff0c\u7ed3\u5408\u81ea\u9002\u5e94\u63a9\u7801\u534f\u8c03\u63a7\u5236\u4fe1\u53f7\u4e0e\u89c6\u89c9\u8f93\u51fa\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40339", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u8986\u76d6750\u4e2a\u573a\u666f\u3001178\u4e2a\u89d2\u8272\u7684\u7ed3\u6784\u5316\u6570\u636e\u96c6", "\u9aa8\u67b6\u4e0e\u51e0\u4f55\u4ee3\u7406\u7ed3\u5408\u81ea\u9002\u5e94\u63a9\u7801\uff0c\u6539\u5584\u751f\u6210\u5bf9\u9f50", "\u663e\u5f0f\u66f4\u65b0\u6e38\u620f\u72b6\u6001\uff0c\u652f\u6301\u65b0\u573a\u666f\u3001\u89d2\u8272\u53ca\u52a8\u4f5c\u96f6\u6837\u672c\u63a7\u5236"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u53ef\u63a7\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2610.40339v1", "published_at": "2026-10-29", "score": 0.641, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40339.png", "title": "Wizard: Manipulate Any World in Real Time via Agentic Control", "tldr": "\u901a\u8fc7\u667a\u80fd\u4f53\u72b6\u6001\u7ba1\u7406\u4e0e\u7ed3\u6784\u5316\u4ee3\u7406\u751f\u6210\uff0c\u5b9e\u73b0\u8de8\u573a\u666f\u7684\u5b9e\u65f6\u89d2\u8272\u52a8\u4f5c\u63a7\u5236\u3002", "upvotes": 24, "what_it_is": "Wizard\u5c06\u9aa8\u67b6\u548c\u51e0\u4f55\u4fe1\u606f\u4f5c\u4e3a\u4e2d\u95f4\u4ee3\u7406\uff0c\u5f15\u5bfc\u89c6\u9891\u6a21\u578b\u751f\u6210\u6e38\u620f\u753b\u9762\uff1b\u667a\u80fd\u4f53\u663e\u5f0f\u7ef4\u62a4\u5e76\u66f4\u65b0\u6e38\u620f\u72b6\u6001\uff0c\u7ed3\u5408\u81ea\u9002\u5e94\u63a9\u7801\u534f\u8c03\u63a7\u5236\u4fe1\u53f7\u4e0e\u89c6\u89c9\u8f93\u51fa\u3002", "why_notable": "\u5c06\u6e38\u620f\u903b\u8f91\u4e0e\u89c6\u89c9\u751f\u6210\u89e3\u8026\uff0c\u4f7f\u73a9\u5bb6\u80fd\u81ea\u7531\u914d\u7f6e\u4e16\u754c\u5e76\u7ec6\u7c92\u5ea6\u63a7\u5236\u52a8\u4f5c\uff0c\u4e3a\u517c\u987e\u753b\u8d28\u3001\u5b9e\u65f6\u4ea4\u4e92\u4e0e\u89c4\u5219\u4e00\u81f4\u6027\u7684\u6e38\u620f\u751f\u6210\u63d0\u4f9b\u8def\u5f84\u3002"}, {"abstract": "Short-video search needs compact query rewriters that recover users\u0027 personalized intent from ambiguous queries under strict latency constraints. Existing LLM-based methods have improved rewriting by using synthetic reasoning and subsequent consumption-behavioral feedback. However, overemphasizing subsequent consumption can favor engaging content over the user\u0027s immediate need, causing intent drift even when rewritten queries are grounded in behavioral history. We propose WeFair, Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in WeChat short-video search. WeFair uses human feedback according to how directly it reflects personalized intent, assigning feedback fidelity to a progression from demonstration to preference to verification. We first mine actual queries and user reformulations from search sessions, and then screen them for contextual support. In the demonstration stage, a supervised fine-tuning curriculum progresses from large-scale context-to-query learning to reasoning and direct prediction on human reformulation and preservation. In the preference stage, direct preference optimization learns relative preferences from subsequent consumption feedback. In the verification stage, group relative policy optimization rewards exact agreement with reformulation or preservation targets to constrain intent drift. Further analysis shows that broad supervision benefits the full curriculum supervised training, while strict verification achieves better performance than auxiliary rewards. In offline experiments, WeFair-2B outperforms strong rewriting baselines in overall accuracy and intent preservation. An online A/B test shows relative increases of 2.593% in effective video-view rate and a 2.350% relative reduction in query reformulation rate. WeFair-2B has been deployed in the WeChat short-video search system, which serves over 100 million queries per day.", "arxiv_id": "2610.16927", "arxiv_url": "https://arxiv.org/abs/2610.16927", "authors": ["Yingtao Ren", "Aolin Li", "Cheng Cheng", "Huiyun Hu", "Huasheng Liang", "Baoxing Xie", "Jun Yuan", "Haijun Wu", "Yiwei Fu", "Chenxing Wang"], "brief": "WeFair\u4ece\u771f\u5b9e\u641c\u7d22\u4f1a\u8bdd\u6316\u6398\u67e5\u8be2\u53ca\u7528\u6237\u6539\u5199\uff0c\u5e76\u7b5b\u9009\u4e0a\u4e0b\u6587\u652f\u6301\u3002\u6309\u53cd\u9988\u4fdd\u771f\u5ea6\u4e32\u8054\u76d1\u7763\u5fae\u8c03\u3001\u504f\u597d\u4f18\u5316\u548c\u4e25\u683c\u9a8c\u8bc1\uff0c\u51cf\u5c11\u6d88\u8d39\u884c\u4e3a\u5956\u52b1\u5e26\u6765\u7684\u610f\u56fe\u6f02\u79fb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.16927", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bfe\u7a0b\u5f0fSFT\uff1a\u4ece\u4e0a\u4e0b\u6587\u5b66\u4e60\u5230\u63a8\u7406\u4e0e\u76f4\u63a5\u9884\u6d4b", "DPO\u5b66\u4e60\u6d88\u8d39\u504f\u597d\uff0cGRPO\u5956\u52b1\u7cbe\u786e\u5339\u914d\u610f\u56fe\u76ee\u6807", "\u7ebf\u4e0a\u6709\u6548\u89c2\u770b\u7387\u53472.593%\uff0c\u6539\u5199\u7387\u964d2.350%"], "keywords": ["\u67e5\u8be2\u6539\u5199", "\u4e2a\u6027\u5316\u641c\u7d22", "\u4eba\u7c7b\u53cd\u9988\u5bf9\u9f50", "\u610f\u56fe\u4fdd\u771f"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2610.16927v2", "published_at": "2026-10-12", "score": 0.518, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.16927.png", "title": "WeFair: Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in Short-Video Search", "tldr": "\u7528\u5206\u5c42\u4eba\u7c7b\u53cd\u9988\u8bad\u7ec3\u5c0f\u6a21\u578b\u6539\u5199\u77ed\u89c6\u9891\u641c\u7d22\u67e5\u8be2\uff0c\u517c\u987e\u4e2a\u6027\u5316\u4e0e\u610f\u56fe\u4fdd\u771f\u3002", "upvotes": 26, "what_it_is": "WeFair\u4ece\u771f\u5b9e\u641c\u7d22\u4f1a\u8bdd\u6316\u6398\u67e5\u8be2\u53ca\u7528\u6237\u6539\u5199\uff0c\u5e76\u7b5b\u9009\u4e0a\u4e0b\u6587\u652f\u6301\u3002\u6309\u53cd\u9988\u4fdd\u771f\u5ea6\u4e32\u8054\u76d1\u7763\u5fae\u8c03\u3001\u504f\u597d\u4f18\u5316\u548c\u4e25\u683c\u9a8c\u8bc1\uff0c\u51cf\u5c11\u6d88\u8d39\u884c\u4e3a\u5956\u52b1\u5e26\u6765\u7684\u610f\u56fe\u6f02\u79fb\u3002", "why_notable": "\u628a\u7528\u6237\u5373\u65f6\u610f\u56fe\u4e0e\u540e\u7eed\u6d88\u8d39\u504f\u597d\u5206\u5f00\u7ea6\u675f\uff0c\u907f\u514d\u53ea\u4f18\u5316\u5185\u5bb9\u5438\u5f15\u529b\uff1b2B\u6a21\u578b\u5df2\u90e8\u7f72\u4e8e\u65e5\u5747\u8d85\u4e00\u4ebf\u6b21\u67e5\u8be2\u7684\u641c\u7d22\u7cfb\u7edf\u3002"}, {"abstract": "In recent years, agentic orchestration has been widely applied to solve complex human tasks. However, existing orchestration learning still faces key challenges, including hand-designed curricula, advantage collapse when a task\u0027s rollouts all reach the same outcome, and unreliable evaluation signals that judge each skill by one noisy score. To address these challenges, we propose R$^2$Orch, a new paradigm of Recursive Self-Play Orchestration: an inner loop of self-play that improves the orchestrator on self-chosen tasks, and an outer loop that improves how the inner loop improves. To support this paradigm, we introduce Recursive Learnability, a training objective that rewards a Proposer for choosing tasks whose rollouts keep reaching different outcomes as skills are withdrawn. Built on this objective, we further propose Skill Withdrawal, in which the outer loop withdraws each skill once a controlled evaluation within self-play shows that the orchestrator performs as well without it. Moreover, the two loops form one cycle: failures are distilled into skills, skills into parameters, and withdrawals lead the Proposer to new failures, so the orchestrator moves toward zero-skill deployment. Experimental results on twelve datasets show that R$^2$Orch consistently outperforms baselines across question answering, math, code, and interactive tasks. Our code is available at https://github.com/beita6969/R2Orch.", "arxiv_id": "2610.22740", "arxiv_url": "https://arxiv.org/abs/2610.22740", "authors": ["Mingda Zhang", "Yun Huang", "Qiang Huang", "Yanjin Li", "Rui Qian", "Qichao Zhao", "Tiesunlong Shen", "Na Zhao", "Jian Wang", "Xiaoying Tang"], "brief": "\u63d0\u51fa\u53cc\u5c42\u81ea\u535a\u5f08\u8bad\u7ec3\uff1a\u5185\u5faa\u73af\u5728\u81ea\u4e3b\u9009\u9898\u4e2d\u6539\u8fdb\u7f16\u6392\u5668\uff0c\u5916\u5faa\u73af\u4f18\u5316\u9009\u9898\u4e0e\u6280\u80fd\u64a4\u56de\uff0c\u5c06\u5931\u8d25\u63d0\u70bc\u4e3a\u6280\u80fd\u3001\u518d\u5185\u5316\u8fdb\u53c2\u6570\uff0c\u63a8\u52a8\u96f6\u5916\u90e8\u6280\u80fd\u90e8\u7f72\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22740", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Recursive Learnability\u5956\u52b1\u64a4\u56de\u6280\u80fd\u540e\u4ecd\u6709\u6210\u8d25\u5dee\u5f02\u7684\u9009\u9898", "Skill Withdrawal\u4ee5\u53d7\u63a7\u8bc4\u4f30\u5224\u65ad\u6280\u80fd\u662f\u5426\u53ef\u64a4\u56de", "12\u4e2a\u6570\u636e\u96c6\u8986\u76d6\u95ee\u7b54\u3001\u6570\u5b66\u3001\u4ee3\u7801\u4e0e\u4ea4\u4e92\u4efb\u52a1\uff0c\u5747\u4f18\u4e8e\u57fa\u7ebf"], "keywords": ["\u667a\u80fd\u4f53\u7f16\u6392", "\u81ea\u535a\u5f08", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u6280\u80fd\u5185\u5316"], "num_comments": 2, "on_hf": true, "organization": "Chinese University of Hong Kong, Shenzhen", "pdf_url": "https://arxiv.org/pdf/2610.22740v2", "published_at": "2026-10-15", "score": 0.475, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (90\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22740.png", "title": "R$^2$Orch: Recursive Self-Improvement for Agent Orchestration via Self-Play within a Skill-Internalization Loop", "tldr": "\u901a\u8fc7\u9012\u5f52\u81ea\u535a\u5f08\u4e0e\u6280\u80fd\u64a4\u56de\uff0c\u8ba9\u667a\u80fd\u4f53\u7f16\u6392\u5668\u5c06\u5916\u90e8\u6280\u80fd\u9010\u6b65\u5185\u5316\u4e3a\u81ea\u8eab\u80fd\u529b\u3002", "upvotes": 90, "what_it_is": "\u63d0\u51fa\u53cc\u5c42\u81ea\u535a\u5f08\u8bad\u7ec3\uff1a\u5185\u5faa\u73af\u5728\u81ea\u4e3b\u9009\u9898\u4e2d\u6539\u8fdb\u7f16\u6392\u5668\uff0c\u5916\u5faa\u73af\u4f18\u5316\u9009\u9898\u4e0e\u6280\u80fd\u64a4\u56de\uff0c\u5c06\u5931\u8d25\u63d0\u70bc\u4e3a\u6280\u80fd\u3001\u518d\u5185\u5316\u8fdb\u53c2\u6570\uff0c\u63a8\u52a8\u96f6\u5916\u90e8\u6280\u80fd\u90e8\u7f72\u3002", "why_notable": "\u5c06\u9009\u9898\u3001\u6280\u80fd\u79ef\u7d2f\u4e0e\u6280\u80fd\u64a4\u56de\u8fde\u6210\u95ed\u73af\uff0c\u51cf\u5c11\u624b\u5de5\u8bfe\u7a0b\u548c\u5916\u90e8\u6280\u80fd\u4f9d\u8d56\uff0c\u4e3a\u667a\u80fd\u4f53\u7f16\u6392\u7684\u6301\u7eed\u81ea\u6211\u6539\u8fdb\u63d0\u4f9b\u53ef\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "An effective agent memory system should adapt to a user\u0027s history and task requirements. Human-annotated supervision can guide this adaptation by providing feedback for evaluating and improving memory designs. Yet suitable labels are rarely available for new user histories, and manually constructing QA pairs and supporting evidence is costly. We introduce MemSteer, which turns unlabeled user histories into question-answer (QA) supervision with supporting evidence for memory-design optimization. MemSteer constructs an evidence-grounded answer plan that specifies how facts across related records jointly support a reference answer. The plan guides question generation, while source-grounded auditing and blind answer recovery check the resulting annotations. To study the utility of this supervision, we develop MemSteer-Opt, which combines QA-based design evaluation with evidence-guided failure diagnosis to revise memory store, retrieval, and context construction without updating model parameters. Experiments on ATM-Bench and RHELM show that this supervision is competitive with official-QA-guided optimization. Relative to Base-BM25, MemSteer-Opt improves ATM-Bench Question Score by 13.4 points and RHELM accuracy by 4.1 and 6.6 points without and with external data, respectively. The supervision also benefits two existing optimizers on ATM-Bench, while new-user experiments demonstrate continued design optimization using supervision generated from the target histories.", "arxiv_id": "2610.39276", "arxiv_url": "https://arxiv.org/abs/2610.39276", "authors": ["Jie Huang", "Cuiling Lan", "Qize Yu", "Xiulian Peng", "Yan Lu"], "brief": "MemSteer\u4ee5\u8de8\u8bb0\u5f55\u8bc1\u636e\u6784\u5efa\u7b54\u6848\u8ba1\u5212\uff0c\u751f\u6210\u95ee\u7b54\u5e76\u5ba1\u6838\u3001\u9a8c\u8bc1\u3002MemSteer-Opt\u636e\u6b64\u8bc4\u4f30\u8bb0\u5fc6\u8bbe\u8ba1\u3001\u8bca\u65ad\u5931\u8d25\uff0c\u8fed\u4ee3\u5b58\u50a8\u3001\u68c0\u7d22\u4e0e\u4e0a\u4e0b\u6587\u6784\u5efa\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39276", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bc1\u636e\u7b54\u6848\u8ba1\u5212\u6307\u5bfc\u51fa\u9898\uff0c\u6765\u6e90\u5ba1\u6838\u4e0e\u76f2\u7b54\u6062\u590d\u6821\u9a8c\u6807\u6ce8", "MemSteer-Opt\u4f18\u5316\u8bb0\u5fc6\u8bbe\u8ba1\uff0c\u4e0d\u66f4\u65b0\u6a21\u578b\u53c2\u6570", "\u8f83BM25\uff0cATM\u8bc4\u5206\u589e13.4\u70b9\uff0cRHELM\u589e4.1/6.6\u70b9"], "keywords": ["\u667a\u80fd\u4f53\u8bb0\u5fc6", "\u5408\u6210\u76d1\u7763", "\u95ee\u7b54\u751f\u6210", "\u68c0\u7d22\u4f18\u5316"], "num_comments": 1, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2610.39276v1", "published_at": "2026-10-29", "score": 0.468, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39276.png", "title": "MemSteer: Turning User Histories into Supervision for Agent Memory Optimization", "tldr": "\u5c06\u65e0\u6807\u6ce8\u7528\u6237\u5386\u53f2\u8f6c\u4e3a\u5e26\u8bc1\u636e\u7684\u95ee\u7b54\u76d1\u7763\uff0c\u65e0\u9700\u8c03\u53c2\u5373\u53ef\u4f18\u5316\u667a\u80fd\u4f53\u8bb0\u5fc6\u3002", "upvotes": 6, "what_it_is": "MemSteer\u4ee5\u8de8\u8bb0\u5f55\u8bc1\u636e\u6784\u5efa\u7b54\u6848\u8ba1\u5212\uff0c\u751f\u6210\u95ee\u7b54\u5e76\u5ba1\u6838\u3001\u9a8c\u8bc1\u3002MemSteer-Opt\u636e\u6b64\u8bc4\u4f30\u8bb0\u5fc6\u8bbe\u8ba1\u3001\u8bca\u65ad\u5931\u8d25\uff0c\u8fed\u4ee3\u5b58\u50a8\u3001\u68c0\u7d22\u4e0e\u4e0a\u4e0b\u6587\u6784\u5efa\u3002", "why_notable": "\u628a\u6602\u8d35\u7684\u4eba\u5de5\u76d1\u7763\u8f6c\u4e3a\u53ef\u4ece\u7528\u6237\u5386\u53f2\u751f\u6210\u7684\u4f18\u5316\u4fe1\u53f7\uff0c\u6548\u679c\u53ef\u5ab2\u7f8e\u5b98\u65b9\u95ee\u7b54\u76d1\u7763\uff0c\u5e76\u652f\u6301\u65b0\u7528\u6237\u7684\u6301\u7eed\u8bb0\u5fc6\u9002\u914d\u3002"}, {"abstract": "Foundation models are becoming remarkably reliable at high-level reasoning, yet they remain too slow and costly to serve as fine-grained controllers. Conversely, fast policies like VLAs and whole-body controllers offer more efficient reflexes, but struggle to generalize. While pairing a deliberative brain (foundation models) with a reactive cerebellum (fast policies) seems natural for embodied systems, two obstacles remain: methods are built and scored on incompatible stacks, and their asynchronous coordination is difficult. For example, an agent that calls the VLA in the agentic loop can stall the fast execution, while a VLA that calls the agent on errors tends to re-trigger fallbacks repeatedly or completely miss silent failures. To address this, we propose REA (Routed Embodied Agent), a unified runtime where a deliberative System 2, an embodied router System 1 and reactive System 0 policies cooperate under a single golden rule - no running policy waits on the brain. Instead of querying the brain at each failure, REA employs a route memory that stores each policy\u0027s measured success ahead of time, a boundary-triggered judge gate that consults the brain on policy execution, and a shared-budget escalation ladder for bounded recovery. Evaluated on 3,000 test episodes across 60 LIBERO-Pro tasks, REA reaches 95.9% success and beats the best single-agent baseline in its own policy pool (94.7%) while reducing control steps by 25% and control time by 17%. In a separate 100-episode RoboTwin 2.0 study, REA achieves 84% success with VLA policies and 86% with VLA+code, compared with 80% for the strongest single VLA baseline MEDex. These results demonstrate learned and programmatic policies operating within the same runtime. REA also transfers to BEHAVIOR-1K and a real Unitree G1 humanoid, achieving the highest observed success among the compared methods.", "arxiv_id": "2610.42053", "arxiv_url": "https://arxiv.org/abs/2610.42053", "authors": ["Pengfei Zhou", "Yixing Ma", "Zhengfeiyang Zhang", "Haoyuan Chen", "Zhenglin Wan", "Hexin Wang", "Wangbo Zhao", "Yang You"], "brief": "REA\u5c06\u57fa\u7840\u6a21\u578b\u3001\u5177\u8eab\u8def\u7531\u5668\u4e0e\u5feb\u901f\u7b56\u7565\u7eb3\u5165\u7edf\u4e00\u8fd0\u884c\u65f6\uff0c\u6267\u884c\u7b56\u7565\u65e0\u9700\u7b49\u5f85\u9ad8\u5c42\u63a8\u7406\u3002\u5b83\u4ee5\u8def\u7531\u8bb0\u5fc6\u3001\u8fb9\u754c\u89e6\u53d1\u5224\u5b9a\u548c\u5171\u4eab\u9884\u7b97\u5347\u7ea7\u673a\u5236\u534f\u8c03\u7b56\u7565\u9009\u62e9\u4e0e\u6545\u969c\u6062\u590d\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.42053", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["System 2/1/0\u5f02\u6b65\u534f\u4f5c\uff0c\u8fd0\u884c\u7b56\u7565\u4e0d\u7b49\u5f85\u9ad8\u5c42\u63a8\u7406", "LIBERO-Pro\uff1a3000\u56de\u5408\u300160\u4efb\u52a1\uff0c\u6210\u529f\u738795.9%", "\u8f83\u6700\u4f73\u5355\u667a\u80fd\u4f53\u57fa\u7ebf\uff0c\u63a7\u5236\u6b65\u6570\u51cf25%\u3001\u65f6\u95f4\u51cf17%"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u5f02\u6b65\u63a7\u5236", "\u7b56\u7565\u8def\u7531", "\u673a\u5668\u4eba"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.42053v1", "published_at": "2026-10-30", "score": 0.458, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (44\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42053.png", "title": "REA: A Routed Embodied Agent Runtime for Asynchronous Brain-Cerebellum Control", "tldr": "\u901a\u8fc7\u5f02\u6b65\u8def\u7531\u534f\u8c03\u6162\u63a8\u7406\u4e0e\u5feb\u7b56\u7565\uff0c\u8ba9\u5177\u8eab\u667a\u80fd\u4f53\u5728\u4e0d\u963b\u585e\u63a7\u5236\u65f6\u9ad8\u6548\u6062\u590d\u3002", "upvotes": 44, "what_it_is": "REA\u5c06\u57fa\u7840\u6a21\u578b\u3001\u5177\u8eab\u8def\u7531\u5668\u4e0e\u5feb\u901f\u7b56\u7565\u7eb3\u5165\u7edf\u4e00\u8fd0\u884c\u65f6\uff0c\u6267\u884c\u7b56\u7565\u65e0\u9700\u7b49\u5f85\u9ad8\u5c42\u63a8\u7406\u3002\u5b83\u4ee5\u8def\u7531\u8bb0\u5fc6\u3001\u8fb9\u754c\u89e6\u53d1\u5224\u5b9a\u548c\u5171\u4eab\u9884\u7b97\u5347\u7ea7\u673a\u5236\u534f\u8c03\u7b56\u7565\u9009\u62e9\u4e0e\u6545\u969c\u6062\u590d\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u628a\u5b66\u4e60\u7b56\u7565\u4e0e\u7a0b\u5e8f\u5316\u7b56\u7565\u63a5\u5165\u540c\u4e00\u6267\u884c\u6846\u67b6\uff0c\u5728\u63d0\u5347\u6210\u529f\u7387\u7684\u540c\u65f6\u964d\u4f4e\u63a7\u5236\u5f00\u9500\uff0c\u5e76\u5c55\u793a\u5411\u771f\u5b9e\u4eba\u5f62\u673a\u5668\u4eba\u7684\u8fc1\u79fb\u3002"}, {"abstract": "A capable voice assistant must do more than recognize words; it must understand requests, reason over context, sustain conversations, and act through tools. We present Apriel Voice 27B Preview, an open speech-language model that unifies these capabilities within a shared reasoning backbone while retaining text and image input modalities. Built on the post-trained Gemma 4 26B-A4B checkpoint, Apriel Voice directly processes speech and generates both responses and tool calls without requiring a separate dialogue model. We introduce a two-stage training procedure to adapt the model to speech. The first stage establishes the speech interface, while the second jointly adapts the projector and backbone through supervised fine-tuning, text replay, and source-dependent cross-entropy and forward Kullback--Leibler divergence supervision. Automatically constructed speech-conditioned dialogues provide conversational training data, while local teacher serving, overlapping teacher and student computation, and fused full-vocabulary losses enable efficient online distillation. In thinking mode, Apriel Voice achieves a score of 98.90 on Big Bench Audio, 81.13 on Speech-BFCL, and a task success rate of 65.51% on $\u03c4$-Voice, with a mean latency of 1.91 seconds. It also achieves 51.27% English EVA accuracy and 74.13% experience pass@1. Finally, we deploy Apriel Voice 27B Preview on a custom serving platform to support interactive voice interactions.", "arxiv_id": "2610.40738", "arxiv_url": "https://arxiv.org/abs/2610.40738", "authors": ["Aman Tiwari", "Akshay Kalkunte", "Akintunde Oladipo", "Jash Shah", "Tara Bogavelli", "Hoang Nguyen", "Nishanth Madhusudhan", "Vishal Juneja", "Sridhar Nemala", "Srinivas Sunkara", "Sathwik Tejaswi Madhusudhan", "Shruthan Radhakrishna", "Masoud Hashemi", "Kelechi Ogueji", "Khalil Slimi", "Saloni Mittal", "Pulkit Pattnaik", "Shashank Maiya", "Dhruv Jhamb", "Esakkivel Esakkiraja", "Katrina Stankiewicz", "Gabrielle Gauthier Melan\u00e7on", "Fanny Riols", "Amit Saha", "Lakshmi Sirisha Chodisetty", "Nitin Aggarwal", "Anil Madamala", "Sagar Davasam", "Segan Subramanian", "Vikas Yadav", "Sai Rajeswar Mudumba"], "brief": "\u57fa\u4e8eGemma 4\u6784\u5efa\u5f00\u653e\u8bed\u97f3\u8bed\u8a00\u6a21\u578b\uff0c\u4fdd\u7559\u6587\u672c\u548c\u56fe\u50cf\u8f93\u5165\u3002\u4e24\u9636\u6bb5\u8bad\u7ec3\u5148\u5efa\u7acb\u8bed\u97f3\u63a5\u53e3\uff0c\u518d\u8054\u5408\u9002\u914d\u6295\u5f71\u5668\u4e0e\u63a8\u7406\u9aa8\u5e72\uff0c\u76f4\u63a5\u751f\u6210\u56de\u590d\u548c\u5de5\u5177\u8c03\u7528\u3002", "categories": ["cs.SD", "cs.CL", "cs.LG", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40738", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8054\u5408\u9002\u914d\u91c7\u7528\u76d1\u7763\u5fae\u8c03\u3001\u6587\u672c\u56de\u653e\u4e0e\u524d\u5411KL\u84b8\u998f", "\u601d\u8003\u6a21\u5f0f\u4e0bSpeech-BFCL\u5f97\u520681.13", "\u03c4-Voice\u4efb\u52a1\u6210\u529f\u738765.51%\uff0c\u5e73\u5747\u5ef6\u8fdf1.91\u79d2"], "keywords": ["\u8bed\u97f3\u8bed\u8a00\u6a21\u578b", "\u5de5\u5177\u8c03\u7528", "\u5728\u7ebf\u84b8\u998f", "\u591a\u6a21\u6001\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "ServiceNow-AI", "pdf_url": "https://arxiv.org/pdf/2610.40738v1", "published_at": "2026-10-29", "score": 0.449, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (33\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40738.png", "title": "Apriel Voice 27B Preview: An Open Model for Speech, Reasoning, and Tool Use", "tldr": "\u5f00\u653e\u8bed\u97f3\u6a21\u578b\u4ee5\u5171\u4eab\u63a8\u7406\u9aa8\u5e72\u8d2f\u901a\u8bed\u97f3\u7406\u89e3\u3001\u4e0a\u4e0b\u6587\u63a8\u7406\u4e0e\u5de5\u5177\u8c03\u7528", "upvotes": 33, "what_it_is": "\u57fa\u4e8eGemma 4\u6784\u5efa\u5f00\u653e\u8bed\u97f3\u8bed\u8a00\u6a21\u578b\uff0c\u4fdd\u7559\u6587\u672c\u548c\u56fe\u50cf\u8f93\u5165\u3002\u4e24\u9636\u6bb5\u8bad\u7ec3\u5148\u5efa\u7acb\u8bed\u97f3\u63a5\u53e3\uff0c\u518d\u8054\u5408\u9002\u914d\u6295\u5f71\u5668\u4e0e\u63a8\u7406\u9aa8\u5e72\uff0c\u76f4\u63a5\u751f\u6210\u56de\u590d\u548c\u5de5\u5177\u8c03\u7528\u3002", "why_notable": "\u5c06\u8bed\u97f3\u4ea4\u4e92\u4e0e\u5de5\u5177\u6267\u884c\u6574\u5408\u8fdb\u540c\u4e00\u6a21\u578b\uff0c\u65e0\u9700\u72ec\u7acb\u5bf9\u8bdd\u6a21\u578b\uff1b\u540c\u65f6\u62a5\u544a\u4efb\u52a1\u6210\u529f\u7387\u4e0e\u5ef6\u8fdf\uff0c\u4e3a\u5f00\u653e\u8bed\u97f3\u52a9\u624b\u7684\u5b9e\u7528\u5316\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "Federated learning (FL) keeps raw data local, but most deployments still rely on a trusted coordinator for client admission, checkpoint distribution, update collection, aggregation, and rewards. This paper presents AuditFL, a contract-backed clearing layer for auditable FL in open settings. AuditFL keeps training and aggregation off chain, stores model artifacts in an assumed reliable off-chain artifact store, and records only content identifiers and economic state on chain. Clients reserve update tickets with deposits, publish update identifiers, and later claim refunds or rewards; the task coordinator publishes global checkpoints and finalizes rounds through deterministic settlement rules. The design does not remove the aggregator, but makes its on-chain round decisions attributable, replayable, auditable, and economically constrained. We implement AuditFL as both a deterministic state-machine prototype and a Solidity contract on a local Ethereum-compatible Anvil chain. On full MNIST with Dirichlet non-IID splits, 12 rounds, and up to 200 clients, AuditFL preserves the Plain FL learning trajectory while its overhead follows closed-form control-plane models. At 200 clients, the contract run issues 5,026 transactions, stores 2,413 off-chain artifacts (144.9 MiB), and consumes 829.7M EVM gas, dominated by per-client reserve and publish calls. Controlled dropout, invalid-update, and artifact-unavailability stress tests reduce inclusion nearly linearly but still finalize rounds, with final-accuracy changes remaining within a few tenths of an accuracy percentage point even under high injected failure rates.", "arxiv_id": "2610.41278", "arxiv_url": "https://arxiv.org/abs/2610.41278", "authors": ["Alexandros Balla", "Spyros Lalis"], "brief": "AuditFL\u5c06\u8bad\u7ec3\u3001\u805a\u5408\u548c\u6a21\u578b\u5b58\u50a8\u7559\u5728\u94fe\u4e0b\uff0c\u4ec5\u628a\u5185\u5bb9\u6807\u8bc6\u4e0e\u7ecf\u6d4e\u72b6\u6001\u4e0a\u94fe\u3002\u5ba2\u6237\u7aef\u901a\u8fc7\u62bc\u91d1\u9884\u7559\u66f4\u65b0\u51ed\u8bc1\uff0c\u534f\u8c03\u8005\u6309\u786e\u5b9a\u6027\u89c4\u5219\u5b8c\u6210\u8f6e\u6b21\u7ed3\u7b97\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": "https://github.com/katastrofh/AuditFL", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.41278", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u4fdd\u7559\u805a\u5408\u8005\uff0c\u4ee5\u62bc\u91d1\u548c\u786e\u5b9a\u6027\u7ed3\u7b97\u7ea6\u675f\u5176\u94fe\u4e0a\u51b3\u7b56", "MNIST\u975e\u72ec\u7acb\u540c\u5206\u5e03\u5b9e\u9a8c\u8986\u76d612\u8f6e\u3001\u6700\u591a200\u5ba2\u6237\u7aef", "200\u5ba2\u6237\u7aef\u6d88\u8017829.7M gas\uff0c\u4e3b\u8981\u6765\u81ea\u9884\u7559\u4e0e\u53d1\u5e03\u8c03\u7528"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u667a\u80fd\u5408\u7ea6", "\u533a\u5757\u94fe", "\u53ef\u5ba1\u8ba1\u6027"], "num_comments": 1, "on_hf": true, "organization": "HKUST", "pdf_url": "https://arxiv.org/pdf/2610.41278v1", "published_at": "2026-10-30", "score": 0.361, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41278.png", "title": "AuditFL: A Contract-Backed Clearing Layer for Open Federated Learning", "tldr": "\u901a\u8fc7\u667a\u80fd\u5408\u7ea6\u7ea6\u675f\u8054\u90a6\u5b66\u4e60\u8f6e\u6b21\u7ed3\u7b97\uff0c\u8ba9\u5f00\u653e\u53c2\u4e0e\u4e0b\u7684\u534f\u8c03\u51b3\u7b56\u53ef\u5ba1\u8ba1\u3002", "upvotes": 0, "what_it_is": "AuditFL\u5c06\u8bad\u7ec3\u3001\u805a\u5408\u548c\u6a21\u578b\u5b58\u50a8\u7559\u5728\u94fe\u4e0b\uff0c\u4ec5\u628a\u5185\u5bb9\u6807\u8bc6\u4e0e\u7ecf\u6d4e\u72b6\u6001\u4e0a\u94fe\u3002\u5ba2\u6237\u7aef\u901a\u8fc7\u62bc\u91d1\u9884\u7559\u66f4\u65b0\u51ed\u8bc1\uff0c\u534f\u8c03\u8005\u6309\u786e\u5b9a\u6027\u89c4\u5219\u5b8c\u6210\u8f6e\u6b21\u7ed3\u7b97\u3002", "why_notable": "\u5b83\u4e0d\u8bd5\u56fe\u6d88\u9664\u805a\u5408\u8005\uff0c\u800c\u662f\u8ba9\u534f\u8c03\u51b3\u7b56\u53ef\u5f52\u8d23\u3001\u53ef\u56de\u653e\uff1b\u5b9e\u9a8c\u663e\u793a\u53ef\u4fdd\u6301\u5b66\u4e60\u8f68\u8ff9\uff0c\u540c\u65f6\u91cf\u5316\u94fe\u4e0a\u63a7\u5236\u6210\u672c\u3002"}, {"abstract": "Dense 3D tracking from monocular video requires establishing point correspondences over time, estimating their depth, and inferring their trajectories during occlusion. Existing methods typically learn these tasks jointly, a demanding objective given the scarcity of 4D supervision. We show that strong pretrained 2D trackers and 3D geometry models provide an effective foundation: lifted trajectories, with occluded segments simply interpolated, already rival dedicated 3D trackers using the same geometry. However, lifted trajectories inherit correspondence and depth errors, and under occlusion, their depth comes from the occluder rather than the tracked point. We introduce ReLift, an efficient feed-forward framework that recasts dense 3D tracking as geometric trajectory repair and completion. At its core, a trajectory corrector alternates attention along and across trajectories to preserve reliable observations, repair corrupted positions, and complete missing motion. Using only geometric inputs allows us to train directly on 3D trajectories with simulated lifting errors, decoupling training from images and from any specific tracker or geometry model. Concentrating 4D supervision on trajectory refinement yields a reusable model that consistently improves lifted trajectories across trackers and geometry providers without retraining, so it benefits directly from future advances in either component. On WorldTrack, ReLift achieves state-of-the-art mean accuracy, improving on the strongest baselines by 2.1 APD on all points and 3.0 on dynamic points, with faster configurations remaining competitive with leading 3D trackers while running faster than 4RC. Visit our supplementry page for more examples and code.", "arxiv_id": "2610.42136", "arxiv_url": "https://arxiv.org/abs/2610.42136", "authors": ["Assaf Singer", "Maroun Khriesh", "Noam Rotstein", "Yoni Kasten", "Or Litany"], "brief": "ReLift\u5148\u7528\u9884\u8bad\u7ec3\u4e8c\u7ef4\u8ddf\u8e2a\u5668\u548c\u4e09\u7ef4\u51e0\u4f55\u6a21\u578b\u751f\u6210\u4e09\u7ef4\u8f68\u8ff9\uff0c\u518d\u4ee5\u6cbf\u8f68\u8ff9\u53ca\u8de8\u8f68\u8ff9\u4ea4\u66ff\u6ce8\u610f\u529b\u4fee\u590d\u9519\u8bef\u3001\u8865\u5168\u906e\u6321\u8fd0\u52a8\uff1b\u8bad\u7ec3\u4ec5\u4f7f\u7528\u5e26\u6a21\u62df\u8bef\u5dee\u7684\u4e09\u7ef4\u8f68\u8ff9\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ReLift3D/ReLift", "github_stars": 31, "hf_url": "https://huggingface.co/papers/2610.42136", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8f68\u8ff9\u6821\u6b63\u5668\u4ea4\u66ff\u4f7f\u7528\u6cbf\u8f68\u8ff9\u4e0e\u8de8\u8f68\u8ff9\u6ce8\u610f\u529b", "\u4ec5\u7528\u51e0\u4f55\u8f93\u5165\u8bad\u7ec3\uff0c\u8de8\u8ddf\u8e2a\u5668\u4e0e\u51e0\u4f55\u6a21\u578b\u65e0\u9700\u91cd\u8bad", "WorldTrack\u5168\u70b9\u4e0e\u52a8\u6001\u70b9APD\u5206\u522b\u63d0\u53472.1\u30013.0"], "keywords": ["\u4e09\u7ef4\u8ddf\u8e2a", "\u5355\u76ee\u89c6\u9891", "\u8f68\u8ff9\u4fee\u590d", "\u906e\u6321\u8865\u5168"], "num_comments": 8, "on_hf": true, "organization": "Technion Israel institute of technology", "pdf_url": "https://arxiv.org/pdf/2610.42136v1", "published_at": "2026-10-30", "score": 0.326, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42136.png", "title": "ReLift: Dense 3D Tracking as Lifted Trajectory Repair", "tldr": "\u5c06\u5355\u76ee\u89c6\u9891\u4e09\u7ef4\u8ddf\u8e2a\u8f6c\u4e3a\u8f68\u8ff9\u4fee\u590d\uff0c\u590d\u7528\u9884\u8bad\u7ec3\u6a21\u578b\u5e76\u63d0\u5347\u906e\u6321\u4e0b\u7684\u7cbe\u5ea6\u3002", "upvotes": 22, "what_it_is": "ReLift\u5148\u7528\u9884\u8bad\u7ec3\u4e8c\u7ef4\u8ddf\u8e2a\u5668\u548c\u4e09\u7ef4\u51e0\u4f55\u6a21\u578b\u751f\u6210\u4e09\u7ef4\u8f68\u8ff9\uff0c\u518d\u4ee5\u6cbf\u8f68\u8ff9\u53ca\u8de8\u8f68\u8ff9\u4ea4\u66ff\u6ce8\u610f\u529b\u4fee\u590d\u9519\u8bef\u3001\u8865\u5168\u906e\u6321\u8fd0\u52a8\uff1b\u8bad\u7ec3\u4ec5\u4f7f\u7528\u5e26\u6a21\u62df\u8bef\u5dee\u7684\u4e09\u7ef4\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u7a00\u7f3a\u7684\u56db\u7ef4\u76d1\u7763\u96c6\u4e2d\u7528\u4e8e\u8f68\u8ff9\u7cbe\u4fee\uff0c\u907f\u514d\u8054\u5408\u5b66\u4e60\u5168\u90e8\u4efb\u52a1\uff1b\u53ef\u76f4\u63a5\u53d7\u76ca\u4e8e\u4e0a\u6e38\u6a21\u578b\u5347\u7ea7\uff0c\u5e76\u5728\u7cbe\u5ea6\u4e0e\u8fd0\u884c\u901f\u5ea6\u95f4\u63d0\u4f9b\u5b9e\u7528\u9009\u62e9\u3002"}, {"abstract": "Recent work has demonstrated agents driving protein design workflows, either through orchestration of specialized tools or direct manipulation of sequences. Yet the fidelity with which agents follow protein design instructions and the factors contributing to their effectiveness remain understudied. We examine agentic antibody design under two settings: when explicit molecular-editing instructions are provided and when agents receive only previously-scored sequences and are prompted to propose improvements. We call the first task-guided and the second black-box design. For the task-guided setting, we curate ten expert-validated affinity-improvement tasks and show that LLM judges closely reproduce programmatic evaluations of instruction following. We then study two augmentations: access to antibody-relevant tools and to previously scored design history. Tools improve instruction following (IF) and sequence space exploration while reducing optimization performance, whereas design history reduces IF but improves optimization performance at the expense of exploration. Finally, we combine taskguided and black-box design within an in silico optimization loop and show that our agentic optimizer performs comparably to an established Bayesian optimization baseline.", "arxiv_id": "2611.00558", "arxiv_url": "https://arxiv.org/abs/2611.00558", "authors": ["Asli Alpman", "Nick Bhattacharya", "Aaron Solomon", "Hunter Elliott"], "brief": "\u7814\u7a76\u6bd4\u8f83\u660e\u786e\u5206\u5b50\u7f16\u8f91\u6307\u4ee4\u4e0e\u4ec5\u51ed\u5df2\u8bc4\u5206\u5e8f\u5217\u6539\u8fdb\u4e24\u79cd\u6297\u4f53\u8bbe\u8ba1\u6a21\u5f0f\uff0c\u5e76\u6d4b\u8bd5\u5de5\u5177\u548c\u8bbe\u8ba1\u5386\u53f2\u7684\u4f5c\u7528\uff0c\u6700\u540e\u5c06\u4e24\u79cd\u6a21\u5f0f\u7ed3\u5408\uff0c\u6784\u5efa\u8ba1\u7b97\u673a\u5185\u4f18\u5316\u5faa\u73af\u3002", "categories": ["q-bio.QM", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00558", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["10\u9879\u4e13\u5bb6\u9a8c\u8bc1\u4efb\u52a1\u4e2d\uff0cLLM\u8bc4\u5ba1\u63a5\u8fd1\u7a0b\u5e8f\u5316\u6307\u4ee4\u8bc4\u4f30", "\u5de5\u5177\u63d0\u5347\u6307\u4ee4\u9075\u5faa\u548c\u63a2\u7d22\uff0c\u5374\u964d\u4f4e\u4f18\u5316\u8868\u73b0", "\u8bbe\u8ba1\u5386\u53f2\u6539\u5584\u4f18\u5316\u4f46\u524a\u5f31\u9075\u5faa\u4e0e\u63a2\u7d22\uff1b\u7ec4\u5408\u4f18\u5316\u63a5\u8fd1\u8d1d\u53f6\u65af\u57fa\u7ebf"], "keywords": ["\u6297\u4f53\u8bbe\u8ba1", "\u667a\u80fd\u4f53", "\u8d1d\u53f6\u65af\u4f18\u5316", "\u6307\u4ee4\u9075\u5faa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00558v1", "published_at": "2026-10-31", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Can agents reliably design therapeutic antibodies?", "tldr": "\u6297\u4f53\u8bbe\u8ba1\u667a\u80fd\u4f53\u4e2d\uff0c\u5de5\u5177\u4e0e\u5386\u53f2\u53cd\u9988\u5bf9\u6307\u4ee4\u9075\u5faa\u548c\u4f18\u5316\u8868\u73b0\u4ea7\u751f\u76f8\u53cd\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u6bd4\u8f83\u660e\u786e\u5206\u5b50\u7f16\u8f91\u6307\u4ee4\u4e0e\u4ec5\u51ed\u5df2\u8bc4\u5206\u5e8f\u5217\u6539\u8fdb\u4e24\u79cd\u6297\u4f53\u8bbe\u8ba1\u6a21\u5f0f\uff0c\u5e76\u6d4b\u8bd5\u5de5\u5177\u548c\u8bbe\u8ba1\u5386\u53f2\u7684\u4f5c\u7528\uff0c\u6700\u540e\u5c06\u4e24\u79cd\u6a21\u5f0f\u7ed3\u5408\uff0c\u6784\u5efa\u8ba1\u7b97\u673a\u5185\u4f18\u5316\u5faa\u73af\u3002", "why_notable": "\u63ed\u793a\u6297\u4f53\u8bbe\u8ba1\u4e2d\u6307\u4ee4\u9075\u5faa\u3001\u5e8f\u5217\u63a2\u7d22\u4e0e\u4f18\u5316\u6548\u679c\u5e76\u975e\u540c\u6b65\u63d0\u5347\uff0c\u4e3a\u667a\u80fd\u4f53\u5de5\u5177\u914d\u7f6e\u548c\u53cd\u9988\u673a\u5236\u8bbe\u8ba1\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u8bc4\u4f30\u4f9d\u636e\u3002"}, {"abstract": "Across coding, web, and tool-use tasks, language-model agents are now routinely trained with the same recipe: supervised fine-tuning (SFT) to learn the interface, then multi-turn reinforcement learning (RL) to master it. Code-as-policy (CaP) casts robot manipulation in the same form, as the policy writes code against robot APIs and reads back the results, so the same recipe should apply. Yet existing CaP agents sidestep training: they either prompt closed frontier models or delegate manipulation to pre-trained vision-language-action models (VLAs) and high-level skills, while small open vision-language models (VLMs) fail outright. We present CaPtain, an open post-training pipeline that turns a small open VLM into a capable CaP agent, with no VLA, frontier model, or privileged state at test time. CaPtain trains and deploys the policy inside CaPtain-Harness, which exposes low-level perception, geometry, and guarded-motion primitives across simulation and real hardware. We first align the base model via SFT on synthetic trajectories generated with GPT-6 Astra, then apply multi-turn RL. Multi-turn RL must credit tens of agent requests, whose physical effects often surface turns later, from a single end-of-episode outcome. We therefore introduce a physical critic that reads privileged simulator state, never seen by the policy, and credits each request by how much it changes the predicted chance of success. Starting from Qwen3.5-4B (0% zero-shot), CaPtain-4B reaches 55.4% held-out LIBERO success after SFT and 73.8% after RL. On LIBERO-PRO, it reaches 78.5%, surpassing several frontier-model agents, and its RL gains persist across three perturbation suites (+17.6 to +21.2 points). Without target-domain training, it attains 83.3% on SimplerEnv WidowX, exceeds frontier models on CaP-Bench, and runs on a real robot after simulation-only adaptation. We release all code, data, and model weights.", "arxiv_id": "2610.40799", "arxiv_url": "https://arxiv.org/abs/2610.40799", "authors": ["Yijia Fan", "Xilin He", "Yilei Jiang", "Dongming Wu", "Jiaxu Wang", "Xiangyu Yue"], "brief": "CaPtain\u662f\u5f00\u653e\u7684\u673a\u5668\u4eba\u4ee3\u7801\u7b56\u7565\u540e\u8bad\u7ec3\u6d41\u6c34\u7ebf\uff0c\u5148\u7528\u5408\u6210\u8f68\u8ff9\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u4ee5\u7269\u7406\u8bc4\u8bba\u5bb6\u6307\u5bfc\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\uff0c\u901a\u8fc7\u7edf\u4e00\u63a5\u53e3\u8c03\u7528\u611f\u77e5\u3001\u51e0\u4f55\u4e0e\u5b89\u5168\u8fd0\u52a8\u539f\u8bed\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/waltstephen/CaPtain", "github_stars": 50, "hf_url": "https://huggingface.co/papers/2 a\u90e8\u7f72\u3002"}, {"abstract": "Direct-policy World Action Models (WAM) have demonstrated the benefits of decoupling action generation from explicit future visual prediction for efficient inference in autonomous driving and embodied control. However, they still require tens of denoising steps to achieve competitive action quality, incurring substantial latency and hindering real-time deployment. Simply reducing the number of denoising steps will collapse the nonlinear multi-step denoising trajectory into coarse updates, substantially degrading action quality. To reduce the denoising steps while enabling real-time action generation, we present an effective world action model with one-step action generation, namely OSWAM, for autonomous driving and embodied control. We argue that it is the absence of structured action priors in random noise initialization that forces direct-policy WAMs to recover coherent action sequences through iterative denoising. Hence, we construct imagination tokens to initialize the diffusion process, providing physical priors and action-conditioned representations. We further introduce privileged information distillation with future conditioning to enhance future-aware action generation. As a result, OSWAM can efficiently and effectively generate high quality actions in just one diffusion step. Our experiments demonstrate that OSWAM achieves comparable or even better results in both autonomous driving and embodied control than direct-policy WAM and Joint-WAM that require tens of steps. It obtains approximately $3\\times$ speedup over direct-policy WAM baselines and supports real-time compiled inference with latency as low as 40ms on an NVIDIA RTX 5090 GPU. The project page is available at https://gwenzhang.github.io/OSWAM/", "arxiv_id": "2610.35850", "arxiv_url": "https://arxiv.org/abs/2610.35850", "authors": ["Guowen Zhang", "Liyi Chen", "Xu Hu", "Pengfei Wang", "Jingfan Chen", "Chenhang He", "Lei Zhang"], "brief": "OSWAM\u9762\u5411\u81
