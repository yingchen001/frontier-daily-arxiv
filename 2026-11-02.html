rl": "https://arxiv.org/abs/2611.00624", "authors": ["Ignacio Cano", "Amir Saadat", "Rishipal Singh Bhatia", "Samuel Ginzburg", "Patrick C. Toulme", "Ioannis Zarkadas", "Praveen Narayanan", "Pratik Bhatu", "Nicolas Basile", "Alexander Dietm\u00fcller", "Ruishan Wang", "Jacob Wahlgren", "Victor Barros", "Subhankar Shah", "Michael Kuperstein", "Farzin Houshmand", "Emma Sevastian", "Peter Gavin", "Karthik Srinivasa Murthy", "Berkin Ilbeyi", "Amit Sabne", "Eli Bendersky"], "brief": "\u63d0\u51fa\u9762\u5411\u8c37\u6b4c XLA:TPU \u7f16\u8bd1\u5668\u7684\u751f\u4ea7\u7ea7\u9a8c\u8bc1\u4e0e\u6392\u969c\u65b9\u6cd5\u3002\u7ed3\u5408\u5408\u6210\u7a0b\u5e8f\u3001\u771f\u5b9e\u751f\u4ea7\u8f68\u8ff9\u548c\u667a\u80fd\u4f53\u7fa4\u751f\u6210\u6d4b\u8bd5\uff0c\u518d\u901a\u8fc7\u5206\u5c42\u5dee\u5206\u5c06\u6545\u969c\u5b9a\u4f4d\u5230\u878d\u5408\u5185\u6838\u4e2d\u7684\u5355\u4e2a\u7b97\u5b50\u3002", "categories": ["cs.AI", "cs.LG", "cs.PL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00624", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6a21\u7cca\u6d4b\u8bd5\u7ed3\u5408\u5408\u6210\u7a0b\u5e8f\u4e0e\u771f\u5b9e\u751f\u4ea7\u8f68\u8ff9", "AI \u667a\u80fd\u4f53\u7fa4\u81ea\u4e3b\u751f\u6210\u538b\u529b\u6d4b\u8bd5\u3001\u590d\u73b0\u6545\u969c\u5e76\u8349\u62df\u4fee\u590d", "\u5206\u5c42\u5dee\u5206\u8f85\u52a9\u4fee\u590d\u8d85142\u4e2a\u7f3a\u9677\uff0c\u53e6103\u9879\u5f85\u5ba1"], "keywords": ["\u7f16\u8bd1\u5668\u9a8c\u8bc1", "\u6a21\u7cca\u6d4b\u8bd5", "\u5dee\u5206\u6d4b\u8bd5", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00624v1", "published_at": "2026-10-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "XLA from the Trenches: Correctness on TPU Workloads at Scale", "tldr": "\u878d\u5408\u6a21\u7cca\u6d4b\u8bd5\u3001\u667a\u80fd\u4f53\u7fa4\u4e0e\u5206\u5c42\u5dee\u5206\u5b9a\u4f4d\uff0c\u5728\u751f\u4ea7\u73af\u5883\u6392\u67e5\u5e76\u4fee\u590d\u5927\u89c4\u6a21\u7f16\u8bd1\u7f3a\u9677\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9762\u5411\u8c37\u6b4c XLA:TPU \u7f16\u8bd1\u5668\u7684\u751f\u4ea7\u7ea7\u9a8c\u8bc1\u4e0e\u6392\u969c\u65b9\u6cd5\u3002\u7ed3\u5408\u5408\u6210\u7a0b\u5e8f\u3001\u771f\u5b9e\u751f\u4ea7\u8f68\u8ff9\u548c\u667a\u80fd\u4f53\u7fa4\u751f\u6210\u6d4b\u8bd5\uff0c\u518d\u901a\u8fc7\u5206\u5c42\u5dee\u5206\u5c06\u6545\u969c\u5b9a\u4f4d\u5230\u878d\u5408\u5185\u6838\u4e2d\u7684\u5355\u4e2a\u7b97\u5b50\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u5c06\u7f16\u8bd1\u5668\u6b63\u786e\u6027\u9a8c\u8bc1\u843d\u5730\u5230\u8d85\u5927\u89c4\u6a21\u751f\u4ea7\u8d1f\u8f7d\uff0c\u5b9a\u4f4d\u96be\u4ee5\u663e\u5f0f\u62a5\u9519\u7684\u6570\u503c\u4e0e\u5185\u5b58\u7f3a\u9677\uff0c\u964d\u4f4e\u8bad\u7ec3\u548c\u5728\u7ebf\u670d\u52a1\u98ce\u9669\u3002"}, {"abstract": "State of the art latent dynamics world models achieve impressive performance for robot planning. But do they actually encode the physics of the world? In this paper, we show that popular world models today achieve strong results on tasks that reduce to image similarity but forget key details about objects in the scene like mass, deformation, friction, and bounciness. We achieve this by defining precisely what ought to be encoded in such a world model and introducing two new evaluation methods that can directly tease physical properties and easily scale to new ones. Our evaluation, which we call Roz, includes 10 contrastive tasks and 3 continuous tasks, totaling 1734 individual scenarios. We validate our eval on control tasks. On our own model, AnonWM, we find that performance roughly improves with training steps, while not necessarily being correlated with reconstruction MSE. We argue current model failures are a symptom of evaluation strategies (probes and planners) that are opaque, model-specific, and high-compute. Roz requires only a model that can ingest still frames or video, a way to extract latents, and a distance function between them, and it can be run in one pass. We hope future evaluations will adopt Roz\u0027s evaluation techniques. More broadly, we hope Roz can be a case study for a future where benchmarks allow rapid iteration and comparison across models.", "arxiv_id": "2611.00612", "arxiv_url": "https://arxiv.org/abs/2611.00612", "authors": ["Kenneth Ge", "Dhruv Sheth", "Kunvar Thaman"], "brief": "\u63d0\u51fa\u7269\u7406\u5c5e\u6027\u8bc4\u6d4b\u6846\u67b6Roz\uff0c\u4ee5\u4e24\u7c7b\u8bc4\u6d4b\u76f4\u63a5\u68c0\u9a8c\u4e16\u754c\u6a21\u578b\u6f5c\u53d8\u91cf\u662f\u5426\u7f16\u7801\u8d28\u91cf\u3001\u6469\u64e6\u7b49\u6027\u8d28\u3002\u4ec5\u9700\u56fe\u50cf\u6216\u89c6\u9891\u8f93\u5165\u3001\u6f5c\u53d8\u91cf\u53ca\u8ddd\u79bb\u51fd\u6570\uff0c\u5373\u53ef\u5355\u904d\u8fd0\u884c\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00612", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Roz\u542b10\u9879\u5bf9\u6bd4\u4efb\u52a1\u30013\u9879\u8fde\u7eed\u4efb\u52a1\uff0c\u51711734\u4e2a\u573a\u666f", "\u4e24\u7c7b\u8bc4\u6d4b\u68c0\u9a8c\u8d28\u91cf\u3001\u5f62\u53d8\u3001\u6469\u64e6\u4e0e\u5f39\u6027\u7b49\u7269\u7406\u5c5e\u6027", "AnonWM\u8bc4\u6d4b\u8868\u73b0\u968f\u8bad\u7ec3\u5927\u81f4\u6539\u5584\uff0c\u4e0e\u91cd\u5efaMSE\u672a\u5fc5\u76f8\u5173"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u7269\u7406\u8868\u5f81", "\u673a\u5668\u4eba\u89c4\u5212", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00612v1", "published_at": "2026-10-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Roz: A Taste Test for World Model Latents", "tldr": "\u8f7b\u91cf\u6f5c\u53d8\u91cf\u8bc4\u6d4b\u63ed\u793a\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b\u867d\u64c5\u957f\u89c4\u5212\uff0c\u5374\u53ef\u80fd\u9057\u6f0f\u5173\u952e\u7269\u7406\u5c5e\u6027\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u7269\u7406\u5c5e\u6027\u8bc4\u6d4b\u6846\u67b6Roz\uff0c\u4ee5\u4e24\u7c7b\u8bc4\u6d4b\u76f4\u63a5\u68c0\u9a8c\u4e16\u754c\u6a21\u578b\u6f5c\u53d8\u91cf\u662f\u5426\u7f16\u7801\u8d28\u91cf\u3001\u6469\u64e6\u7b49\u6027\u8d28\u3002\u4ec5\u9700\u56fe\u50cf\u6216\u89c6\u9891\u8f93\u5165\u3001\u6f5c\u53d8\u91cf\u53ca\u8ddd\u79bb\u51fd\u6570\uff0c\u5373\u53ef\u5355\u904d\u8fd0\u884c\u3002", "why_notable": "\u5c06\u56fe\u50cf\u76f8\u4f3c\u6027\u8868\u73b0\u4e0e\u7269\u7406\u8868\u5f81\u80fd\u529b\u533a\u5206\u5f00\u6765\uff0c\u63d0\u4f9b\u4f4e\u8ba1\u7b97\u3001\u6613\u6269\u5c55\u7684\u8bc4\u6d4b\u8def\u5f84\uff0c\u4fbf\u4e8e\u8de8\u6a21\u578b\u6bd4\u8f83\u4e0e\u5feb\u901f\u8fed\u4ee3\u3002"}, {"abstract": "A growing body of work reports benefits from orthogonality constraints in fine-tuning large language models (LLMs). These results raise an open question: do orthogonality constraints also help LLM pre-training? We conduct a systematic empirical study of decoder-only LLM pre-training with models ranging from 360M to 3.1B parameters, trained on nearly 200B tokens. We examine fourteen variants of orthogonality training: some constrain the weight matrix itself, while others use orthogonal factors to reparameterize it. Because a strictly orthogonal square matrix loses half of its degrees of freedom, we also study block-wise orthogonality, where every $d$ rows form a row-orthonormal (Stiefel) matrix and the block size $d$ is a hyperparameter. Among block sizes ranging from 1 to the shorter side of the matrix, no $d\u003e1$ used throughout the network reliably outperforms $d=1$, and large blocks are clearly worse; the one placement that helps, symmetric positive-definite factors on the query and key projections, loses its small gain as models grow. At $d=1$, the constraint reduces to sphere optimization, with each row direction on its own unit sphere, which by itself already improves on tuned Muon. The same two findings hold for a diffusion transformer trained on ImageNet, and after fine-tuning, downstream accuracy does not separate the parameterizations. Our conclusion is that, across the realizations we tried, orthogonality between rows does not help language-model pre-training beyond sphere optimization. Since this appears to conflict with several prior results, we re-examine five prior methods in pre-training and fine-tuning that report orthogonality improvements. In each case the reported gain is attributable to numerical precision, training horizon, optimizer realization, or per-row norm control rather than to the orthogonality the methods impose.", "arxiv_id": "2611.00593", "arxiv_url": "https://arxiv.org/abs/2611.00593", "authors": ["Kai Hu", "Li Zhang", "Weichen Yu", "Matt Fredrikson", "Haoqi Hu"], "brief": "\u7814\u7a76\u7cfb\u7edf\u6bd4\u8f83\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u7684\u5341\u56db\u79cd\u6b63\u4ea4\u8bad\u7ec3\u65b9\u6848\uff0c\u8986\u76d6\u76f4\u63a5\u7ea6\u675f\u4e0e\u6b63\u4ea4\u56e0\u5b50\u91cd\u53c2\u6570\u5316\uff1b\u901a\u8fc7\u6539\u53d8\u5206\u5757\u5927\u5c0f\uff0c\u533a\u5206\u884c\u95f4\u6b63\u4ea4\u6027\u4e0e\u9010\u884c\u8303\u6570\u63a7\u5236\u7684\u4f5c\u7528\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00593", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d63.6\u4ebf\u81f331\u4ebf\u53c2\u6570\u6a21\u578b\uff0c\u8bad\u7ec3\u8fd12000\u4ebf\u8bcd\u5143", "\u5206\u5757\u6b63\u4ea4\u4e2d\uff0cd\u003e1\u672a\u7a33\u5b9a\u80dc\u8fc7d=1\u7403\u9762\u4f18\u5316", "\u590d\u67e5\u4e94\u79cd\u65e2\u6709\u65b9\u6cd5\uff0c\u6536\u76ca\u6765\u81ea\u7cbe\u5ea6\u7b49\u975e\u6b63\u4ea4\u56e0\u7d20"], "keywords": ["\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3", "\u6b63\u4ea4\u7ea6\u675f", "\u7403\u9762\u4f18\u5316", "\u4f18\u5316\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00593v1", "published_at": "2026-10-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Do Orthogonality Constraints Help Language-Model Training Beyond Sphere Optimization?", "tldr": "\u5927\u89c4\u6a21\u5b9e\u9a8c\u8868\u660e\uff0c\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u884c\u95f4\u6b63\u4ea4\u7ea6\u675f\u5e76\u672a\u4f18\u4e8e\u9010\u884c\u7403\u9762\u4f18\u5316\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7cfb\u7edf\u6bd4\u8f83\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u7684\u5341\u56db\u79cd\u6b63\u4ea4\u8bad\u7ec3\u65b9\u6848\uff0c\u8986\u76d6\u76f4\u63a5\u7ea6\u675f\u4e0e\u6b63\u4ea4\u56e0\u5b50\u91cd\u53c2\u6570\u5316\uff1b\u901a\u8fc7\u6539\u53d8\u5206\u5757\u5927\u5c0f\uff0c\u533a\u5206\u884c\u95f4\u6b63\u4ea4\u6027\u4e0e\u9010\u884c\u8303\u6570\u63a7\u5236\u7684\u4f5c\u7528\u3002", "why_notable": "\u628a\u6b63\u4ea4\u6027\u672c\u8eab\u4e0e\u8303\u6570\u63a7\u5236\u3001\u4f18\u5316\u5668\u5b9e\u73b0\u7b49\u56e0\u7d20\u62c6\u5f00\u9a8c\u8bc1\uff0c\u7ea0\u6b63\u5bf9\u65e2\u6709\u6536\u76ca\u7684\u5f52\u56e0\uff0c\u4e5f\u4e3a\u9884\u8bad\u7ec3\u9009\u62e9\u66f4\u7b80\u5355\u7684\u7ea6\u675f\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "This paper presents TurnTurk-GPT, a text-based turn-taking predictor for Turkish obtained by fine-tuning a Turkish GPT-2 model with the TurnGPT objective on synthetic and real dialogue, and evaluates it on real Turkish conversation against rule baselines, a zero-shot Turkish language model and a widely used multilingual end-of-turn detector. Evaluation uses word-level decision points on unpunctuated, lower-cased text approximating the output of streaming speech recognisers, recording-disjoint and speaker-disjoint folds, nested threshold selection and paired cluster bootstrap tests. TurnTurk-GPT outperforms the multilingual detector under both recording-disjoint and speaker-disjoint evaluation. It outperforms the zero-shot language model only when the test speakers occur in training; on unseen speakers the two are statistically indistinguishable. Removing the suffixes of the turn-final word reduces AP by up to 44%, against 2% for a sentence-internal word, locating the Turkish end-of-turn cue in verb-final morphology. Synthetic dialogue alone yields the weakest trained model, and when a speaker pauses the zero-shot and multilingual baselines remain close to chance. The model and the evaluation protocol are publicly released.", "arxiv_id": "2610.42010", "arxiv_url": "https://arxiv.org/abs/2610.42010", "authors": ["Ahmet Tu\u011frul Bayrak", "Fatma Nur Korkmaz", "Nur Ya\u011fmur Tuncer", "Mustafa Serta\u00e7 T\u00fcrkel"], "brief": "\u4ee5\u571f\u8033\u5176\u8bedGPT-2\u4e3a\u5e95\u5ea7\uff0c\u7528TurnGPT\u76ee\u6807\u5728\u5408\u6210\u548c\u771f\u5b9e\u5bf9\u8bdd\u4e0a\u5fae\u8c03\u3002\u9488\u5bf9\u6a21\u62df\u6d41\u5f0f\u8bed\u97f3\u8bc6\u522b\u8f93\u51fa\u7684\u65e0\u6807\u70b9\u6587\u672c\uff0c\u9010\u8bcd\u9884\u6d4b\u5f53\u524d\u8bdd\u8f6e\u662f\u5426\u7ed3\u675f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.42010", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5f55\u97f3\u9694\u79bb\u4e0e\u8bf4\u8bdd\u4eba\u9694\u79bb\u8bc4\u6d4b\u5747\u4f18\u4e8e\u591a\u8bed\u8a00\u68c0\u6d4b\u5668", "\u672a\u89c1\u8bf4\u8bdd\u4eba\u4e0a\uff0c\u4e0e\u96f6\u6837\u672c\u6a21\u578b\u65e0\u663e\u8457\u5dee\u5f02", "\u79fb\u9664\u8f6e\u672b\u8bcd\u540e\u7f00\u4f7fAP\u6700\u591a\u4e0b\u964d44%\uff0c\u53e5\u4e2d\u4ec52%"], "keywords": ["\u8bdd\u8f6e\u9884\u6d4b", "\u571f\u8033\u5176\u8bed", "\u8bed\u97f3\u5bf9\u8bdd", "\u5f62\u6001\u5b66"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.42010v1", "published_at": "2026-10-30", "score": 0.183, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42010.png", "title": "TurnTurk-GPT: Text-Based Turn-Taking Prediction for Turkish", "tldr": "\u5fae\u8c03\u571f\u8033\u5176\u8bed\u6a21\u578b\u9884\u6d4b\u5bf9\u8bdd\u8f6e\u6b21\u7ed3\u675f\uff0c\u63ed\u793a\u8bcd\u5c3e\u5f62\u6001\u7ebf\u7d22\u4e0e\u8de8\u8bf4\u8bdd\u4eba\u6cdb\u5316\u9650\u5236\u3002", "upvotes": 2, "what_it_is": "\u4ee5\u571f\u8033\u5176\u8bedGPT-2\u4e3a\u5e95\u5ea7\uff0c\u7528TurnGPT\u76ee\u6807\u5728\u5408\u6210\u548c\u771f\u5b9e\u5bf9\u8bdd\u4e0a\u5fae\u8c03\u3002\u9488\u5bf9\u6a21\u62df\u6d41\u5f0f\u8bed\u97f3\u8bc6\u522b\u8f93\u51fa\u7684\u65e0\u6807\u70b9\u6587\u672c\uff0c\u9010\u8bcd\u9884\u6d4b\u5f53\u524d\u8bdd\u8f6e\u662f\u5426\u7ed3\u675f\u3002", "why_notable": "\u628a\u8bdd\u8f6e\u7ed3\u675f\u7ebf\u7d22\u5b9a\u4f4d\u5230\u571f\u8033\u5176\u8bed\u8bcd\u5c3e\u5f62\u6001\uff0c\u5e76\u63ed\u793a\u6536\u76ca\u5bf9\u8bf4\u8bdd\u4eba\u91cd\u5408\u7684\u4f9d\u8d56\uff1b\u516c\u5f00\u6a21\u578b\u4e0e\u4e25\u683c\u8bc4\u6d4b\u534f\u8bae\uff0c\u4e3a\u8bed\u97f3\u5bf9\u8bdd\u7cfb\u7edf\u63d0\u4f9b\u53ef\u590d\u7528\u57fa\u51c6\u3002"}, {"abstract": "Attribution graphs over the features of sparse autoencoders (SAEs) are used to predict what an ablation does and are compared across training seeds. A TopK SAE keeps the largest preactivations at each token, and a feature\u0027s margin is its preactivation\u0027s distance to the cutoff. On five public TopK SAE pairs from three Pythia models, zeroing one feature moves a next layer feature across the cutoff in 0.74 of cases or more, and the crossings carry most of the response\u0027s energy. Over writes that scale a feature\u0027s code by three factors, the graph built on the features active beforehand has a median relative error of 0.247 or more. The margin graph adds the first order change to every preactivation and reranks, at the same cost, and errs by at most 0.033. At the median, the crossing features\u0027 decoded change is 1.24 times the model\u0027s own change in norm or more. Between seeds of one testbed, sparse maps between features explain 0.85 of a graph\u0027s energy on its active features, and 0.47 once the other seed\u0027s graph keeps only its own. The largest model studied is pythia-160m.", "arxiv_id": "2611.00606", "arxiv_url": "https://arxiv.org/abs/2611.00606", "authors": ["Karl Li"], "brief": "\u7814\u7a76\u68c0\u9a8cTopK\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5f52\u56e0\u56fe\u5bf9\u7279\u5f81\u5e72\u9884\u7684\u9884\u6d4b\u80fd\u529b\u3002\u63d0\u51fa\u8fb9\u9645\u56fe\uff0c\u5bf9\u5168\u90e8\u9884\u6fc0\u6d3b\u65bd\u52a0\u4e00\u9636\u53d8\u5316\u5e76\u91cd\u65b0\u6392\u5e8f\uff0c\u4ee5\u6355\u6349\u5e72\u9884\u5f15\u8d77\u7684\u6fc0\u6d3b\u96c6\u5408\u53d8\u5316\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00606", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e09\u79cdPythia\u6a21\u578b\u7684\u4e94\u5bf9SAE\u4e2d\uff0c\u6d88\u878d\u89e6\u53d1\u9608\u503c\u8de8\u8d8a\u7684\u6bd4\u4f8b\u81f3\u5c1174%", "\u8fb9\u9645\u56fe\u540c\u6210\u672c\u4e0b\uff0c\u4e2d\u4f4d\u76f8\u5bf9\u8bef\u5dee\u4ece\u81f3\u5c110.247\u964d\u81f3\u81f3\u591a0.033", "\u8de8\u79cd\u5b50\u7279\u5f81\u6620\u5c04\u89e3\u91ca\u56fe\u80fd\u91cf\u7684\u6bd4\u4f8b\uff0c\u53d7\u6fc0\u6d3b\u96c6\u5408\u9650\u5236\u4ece0.85\u964d\u81f30.47"], "keywords": ["\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u5f52\u56e0\u56fe", "\u7279\u5f81\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00606v1", "published_at": "2026-10-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Sparse Autoencoder Attribution Graphs Are Decided at the Margin", "tldr": "\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5f52\u56e0\u56fe\u7684\u8bef\u5dee\u4e3b\u8981\u6765\u81ea\u6fc0\u6d3b\u9608\u503c\u8de8\u8d8a\uff0c\u8fb9\u9645\u56fe\u53ef\u663e\u8457\u6539\u5584\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u68c0\u9a8cTopK\u7a00\u758f\u81ea\u7f16\u7801\u5668\u5f52\u56e0\u56fe\u5bf9\u7279\u5f81\u5e72\u9884\u7684\u9884\u6d4b\u80fd\u529b\u3002\u63d0\u51fa\u8fb9\u9645\u56fe\uff0c\u5bf9\u5168\u90e8\u9884\u6fc0\u6d3b\u65bd\u52a0\u4e00\u9636\u53d8\u5316\u5e76\u91cd\u65b0\u6392\u5e8f\uff0c\u4ee5\u6355\u6349\u5e72\u9884\u5f15\u8d77\u7684\u6fc0\u6d3b\u96c6\u5408\u53d8\u5316\u3002", "why_notable": "\u7ed3\u679c\u6307\u51fa\uff0c\u56fa\u5b9a\u6fc0\u6d3b\u96c6\u5408\u4f1a\u9057\u6f0f\u5e72\u9884\u54cd\u5e94\u7684\u4e3b\u8981\u90e8\u5206\uff1b\u8fb9\u9645\u56fe\u63d0\u4f9b\u4f4e\u6210\u672c\u4fee\u6b63\uff0c\u4e5f\u63ed\u793a\u8de8\u8bad\u7ec3\u79cd\u5b50\u6bd4\u8f83\u5f52\u56e0\u56fe\u65f6\u7684\u7ed3\u6784\u6027\u969c\u788d\u3002"}, {"abstract": "Recently, reinforcement learning from verifiable rewards (RLVR) is practically very important, where the leading approach is group relative policy optimization (GRPO) that typically faces a trade-off between rollout efficiency and downstream performance. To improve efficiency while preserving performance, existing selective rollout methods mainly exploit only source-side training dynamics to optimize the discrete distribution over source prompts. However, in practice, the source training dataset is rarely identically distributed to the target test dataset. When such a mismatch exists, due to legal or privacy constraints, it is usually not acceptable to share target prompts themselves with the RLVR trainer. Nevertheless, it is still possible for the target data owner to provide limited aggregated feedback from a small held-out target set without revealing target prompts or rollout traces. In this paper, we propose learning-to-reweight rollout (L2RR) that explicitly incorporates target-side performance feedback into GRPO. Specifically, L2RR learns a discrete sampling distribution over source prompts by optimizing a bi-level objective that maximizes accuracy on a held-out target dataset, while simultaneously penalizing rollouts that provide little incremental learning information. Empirical studies on six math reasoning benchmarks and three model scales show that L2RR improves target-domain performance and increases rollout efficiency.", "arxiv_id": "2611.00586", "arxiv_url": "https://arxiv.org/abs/2611.00586", "authors": ["Zhen-Yu Zhang", "Jiandong Zhang", "Huaxiu Yao", "Gang Niu", "Masashi Sugiyama"], "brief": "\u63d0\u51fa\u5b66\u4e60\u5f0f\u91cd\u52a0\u6743\u91c7\u6837\u65b9\u6cd5L2RR\uff0c\u5c06\u76ee\u6807\u57df\u805a\u5408\u6027\u80fd\u53cd\u9988\u5f15\u5165GRPO\u3002\u901a\u8fc7\u53cc\u5c42\u4f18\u5316\u5b66\u4e60\u6e90\u63d0\u793a\u91c7\u6837\u5206\u5e03\uff0c\u63d0\u9ad8\u76ee\u6807\u96c6\u51c6\u786e\u7387\u5e76\u60e9\u7f5a\u589e\u91cf\u5b66\u4e60\u4fe1\u606f\u8f83\u5c11\u7684\u91c7\u6837\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00586", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["L2RR\u4ee5\u53cc\u5c42\u76ee\u6807\u4f18\u5316\u6e90\u63d0\u793a\u7684\u79bb\u6563\u91c7\u6837\u5206\u5e03", "\u76ee\u6807\u4fa7\u4ec5\u63d0\u4f9b\u805a\u5408\u53cd\u9988\uff0c\u4e0d\u5171\u4eab\u63d0\u793a\u6216\u751f\u6210\u8f68\u8ff9", "\u57286\u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u30013\u79cd\u6a21\u578b\u89c4\u6a21\u4e0a\u9a8c\u8bc1"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u504f\u79fb", "\u91c7\u6837\u4f18\u5316", "\u6570\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00586v1", "published_at": "2026-10-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dataset Mismatch Matters in Group Relative Policy Optimization for Reinforcement Learning from Verifiable Rewards", "tldr": "\u5229\u7528\u76ee\u6807\u57df\u805a\u5408\u53cd\u9988\u91cd\u52a0\u6743\u8bad\u7ec3\u63d0\u793a\uff0c\u517c\u987e\u6570\u5b66\u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u7684\u6548\u679c\u4e0e\u91c7\u6837\u6548\u7387\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u5b66\u4e60\u5f0f\u91cd\u52a0\u6743\u91c7\u6837\u65b9\u6cd5L2RR\uff0c\u5c06\u76ee\u6807\u57df\u805a\u5408\u6027\u80fd\u53cd\u9988\u5f15\u5165GRPO\u3002\u901a\u8fc7\u53cc\u5c42\u4f18\u5316\u5b66\u4e60\u6e90\u63d0\u793a\u91c7\u6837\u5206\u5e03\uff0c\u63d0\u9ad8\u76ee\u6807\u96c6\u51c6\u786e\u7387\u5e76\u60e9\u7f5a\u589e\u91cf\u5b66\u4e60\u4fe1\u606f\u8f83\u5c11\u7684\u91c7\u6837\u3002", "why_notable": "\u628a\u91c7\u6837\u4f18\u5316\u4ece\u6e90\u4fa7\u8bad\u7ec3\u52a8\u6001\u6269\u5c55\u5230\u76ee\u6807\u57df\u9700\u6c42\uff0c\u5728\u4e0d\u5171\u4eab\u76ee\u6807\u63d0\u793a\u7684\u7ea6\u675f\u4e0b\u7f13\u89e3\u6570\u636e\u5206\u5e03\u9519\u914d\uff0c\u540c\u65f6\u63d0\u5347\u76ee\u6807\u57df\u8868\u73b0\u4e0e\u91c7\u6837\u6548\u7387\u3002"}, {"abstract": "Automated configuration of mixed-integer programming (MIP) solvers largely relies on black-box optimization. Each trial requires an expensive solver run and provides only a scalar outcome, so tuning can require many such evaluations. Human experts take a different approach. They inspect solver logs, identify performance bottlenecks, and adjust the parameters that address them. We propose Log-Driven Semantic Tuning (LDST), which uses a large language model (LLM) to automate this process. LDST extracts compact diagnostics from solver logs, uses the LLM to propose sparse edits to the current best configuration based on parameter meanings and observed solver behavior, and validates each proposal before execution. A regime-adaptive objective selects the tuning signal according to the information available from a time-limited run, while a log-based completion signal estimates completion time from branch-and-bound tree growth recorded in ordinary solver logs, so that solved and unsolved runs share one time scale. On 215 instances from five benchmark sets, LDST reduces geometric-mean loss by 43.9% on easy instances and 16.7% on intermediate instances relative to the best of SMAC3, RBFOpt, and random search. In both regimes, LDST achieves a lower loss with 10 proposals than any of these baselines achieves with 50. Configurations that LDST tunes on a single instance also transfer better than baseline configurations to unseen instances of the same family.", "arxiv_id": "2611.00621", "arxiv_url": "https://arxiv.org/abs/2611.00621", "authors": ["Zhengzhong Ricky You", "Kaizhao Sun", "Zeping Min", "Wotao Yin", "Xinshang Wang"], "brief": "LDST\u4ece\u6c42\u89e3\u65e5\u5fd7\u63d0\u53d6\u7d27\u51d1\u8bca\u65ad\uff0c\u8ba9\u5927\u6a21\u578b\u7ed3\u5408\u53c2\u6570\u8bed\u4e49\u4e0e\u6c42\u89e3\u884c\u4e3a\uff0c\u5bf9\u5f53\u524d\u6700\u4f18\u914d\u7f6e\u63d0\u51fa\u7a00\u758f\u4fee\u6539\uff0c\u5e76\u5728\u6267\u884c\u524d\u9a8c\u8bc1\uff1b\u540c\u65f6\u81ea\u9002\u5e94\u9009\u62e9\u8c03\u4f18\u4fe1\u53f7\u3002", "categories": ["math.OC", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00621", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5229\u7528\u5206\u652f\u5b9a\u754c\u6811\u589e\u957f\u4f30\u8ba1\u5b8c\u6210\u65f6\u95f4\uff0c\u7edf\u4e00\u5df2\u89e3\u4e0e\u672a\u89e3\u8fd0\u884c\u5c3a\u5ea6", "215\u4e2a\u5b9e\u4f8b\u30015\u7ec4\u57fa\u51c6\uff1a\u7b80\u5355\u4e0e\u4e2d\u7b49\u5b9e\u4f8b\u635f\u5931\u964d43.9%\u300116.7%", "LDST\u4ec510\u6b21\u63d0\u6848\uff0c\u635f\u5931\u4f4e\u4e8e\u4e09\u79cd\u57fa\u7ebf\u540450\u6b21\u8bd5\u9a8c"], "keywords": ["\u6df7\u5408\u6574\u6570\u89c4\u5212", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u52a8\u8c03\u53c2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00621v1", "published_at": "2026-10-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Log-Driven Semantic Tuning for Mixed Integer Programming Solvers", "tldr": "\u8ba9\u5927\u6a21\u578b\u8bfb\u6c42\u89e3\u65e5\u5fd7\u5e76\u5b9a\u5411\u8c03\u53c2\uff0c\u4ee5\u66f4\u5c11\u8bd5\u9a8c\u6539\u5584\u6df7\u5408\u6574\u6570\u89c4\u5212\u6c42\u89e3\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": "LDST\u4ece\u6c42\u89e3\u65e5\u5fd7\u63d0\u53d6\u7d27\u51d1\u8bca\u65ad\uff0c\u8ba9\u5927\u6a21\u578b\u7ed3\u5408\u53c2\u6570\u8bed\u4e49\u4e0e\u6c42\u89e3\u884c\u4e3a\uff0c\u5bf9\u5f53\u524d\u6700\u4f18\u914d\u7f6e\u63d0\u51fa\u7a00\u758f\u4fee\u6539\uff0c\u5e76\u5728\u6267\u884c\u524d\u9a8c\u8bc1\uff1b\u540c\u65f6\u81ea\u9002\u5e94\u9009\u62e9\u8c03\u4f18\u4fe1\u53f7\u3002", "why_notable": "\u5c06\u65e5\u5fd7\u4e2d\u7684\u884c\u4e3a\u4fe1\u606f\u8f6c\u5316\u4e3a\u5b9a\u5411\u8c03\u53c2\u4f9d\u636e\uff0c\u51cf\u5c11\u6602\u8d35\u6c42\u89e3\u8bd5\u9a8c\uff1b\u5355\u5b9e\u4f8b\u8c03\u51fa\u7684\u914d\u7f6e\u4e5f\u66f4\u80fd\u8fc1\u79fb\u5230\u540c\u65cf\u672a\u89c1\u5b9e\u4f8b\u3002"}, {"abstract": "Natural-language driven smart home control remains challenging: cloud-hosted Large Language Models (LLMs) raise privacy concerns, while local Small Language Models (SLMs) can generate invalid actions or misinterpret requests. We introduce Trail (Typed Registry-Anchored Inference for Language commands in Smart Homes), a fully local framework that replaces open-ended command generation with hierarchical typed decisions. Trail exploits the natural structure of a home\u0027s action space, selecting a room, device, and operation from candidates derived from the runtime device registry. This ensures valid actions while enabling confidence-based abstention when requests cannot be reliably resolved. We also design a structured memory module that uses typed decisions to support user preferences, device references, and multi-turn interactions. To evaluate Trail, we extend HomeBench and generate three datasets: Trek-Base, which tests natural-language variation; Trek-Robust, which evaluates robustness to changes in the home and its description; and Trek-Memory, which assesses conversational memory across multi-turn interactions. Trail achieves 85.3% accuracy on Trek-Robust versus 69.8% for a finetuned Qwen3.5-4B baseline, while remaining competitive on Trek-Base requests. With memory, Trail resolves 75.6% of the requests that depend on earlier turns, compared with 42.5% for the finetuned baseline given conversation history.", "arxiv_id": "2611.00610", "arxiv_url": "https://arxiv.org/abs/2611.00610", "authors": ["Maleeha Masood", "Deepak Vasisht", "Indranil Gupta"], "brief": "Trail\u662f\u5168\u672c\u5730\u667a\u80fd\u5bb6\u5c45\u63a7\u5236\u6846\u67b6\uff0c\u4ece\u8fd0\u884c\u65f6\u8bbe\u5907\u6ce8\u518c\u8868\u63d0\u53d6\u5019\u9009\uff0c\u9010\u5c42\u9009\u62e9\u623f\u95f4\u3001\u8bbe\u5907\u4e0e\u64cd\u4f5c\uff0c\u5e76\u4ee5\u7ed3\u6784\u5316\u8bb0\u5fc6\u652f\u6301\u504f\u597d\u3001\u8bbe\u5907\u6307\u4ee3\u548c\u591a\u8f6e\u4ea4\u4e92\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00610", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5206\u5c42\u7c7b\u578b\u51b3\u7b56\u7ea6\u675f\u52a8\u4f5c\u5408\u6cd5\u6027\uff0c\u4f4e\u7f6e\u4fe1\u5ea6\u65f6\u62d2\u7edd\u6267\u884c", "Trek-Robust\u51c6\u786e\u738785.3%\uff0c\u57fa\u7ebf\u4e3a69.8%", "\u8bb0\u5fc6\u4f9d\u8d56\u8bf7\u6c42\u89e3\u51b3\u738775.6%\uff0c\u57fa\u7ebf\u4e3a42.5%"], "keywords": ["\u667a\u80fd\u5bb6\u5c45", "\u5c0f\u8bed\u8a00\u6a21\u578b", "\u7ed3\u6784\u5316\u51b3\u7b56", "\u5bf9\u8bdd\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00610v1", "published_at": "2026-10-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Trail: Accurate Local Smart Home Control Using Decision Models", "tldr": "\u4ee5\u5206\u5c42\u7c7b\u578b\u51b3\u7b56\u66ff\u4ee3\u81ea\u7531\u751f\u6210\uff0c\u8ba9\u672c\u5730\u667a\u80fd\u5bb6\u5c45\u63a7\u5236\u66f4\u51c6\u786e\u5e76\u652f\u6301\u591a\u8f6e\u8bb0\u5fc6\u3002", "upvotes": 0, "what_it_is": "Trail\u662f\u5168\u672c\u5730\u667a\u80fd\u5bb6\u5c45\u63a7\u5236\u6846\u67b6\uff0c\u4ece\u8fd0\u884c\u65f6\u8bbe\u5907\u6ce8\u518c\u8868\u63d0\u53d6\u5019\u9009\uff0c\u9010\u5c42\u9009\u62e9\u623f\u95f4\u3001\u8bbe\u5907\u4e0e\u64cd\u4f5c\uff0c\u5e76\u4ee5\u7ed3\u6784\u5316\u8bb0\u5fc6\u652f\u6301\u504f\u597d\u3001\u8bbe\u5907\u6307\u4ee3\u548c\u591a\u8f6e\u4ea4\u4e92\u3002", "why_notable": "\u5c06\u5f00\u653e\u5f0f\u751f\u6210\u8f6c\u4e3a\u8bbe\u5907\u6ce8\u518c\u8868\u7ea6\u675f\u4e0b\u7684\u51b3\u7b56\uff0c\u5728\u4fdd\u7559\u672c\u5730\u9690\u79c1\u4f18\u52bf\u7684\u540c\u65f6\uff0c\u663e\u8457\u63d0\u5347\u73af\u5883\u53d8\u5316\u9c81\u68d2\u6027\u4e0e\u591a\u8f6e\u6307\u4ee4\u7406\u89e3\u80fd\u529b\u3002"}, {"abstract": "Electrocardiograms (ECGs) may contain physiological information related to hereditary cancer susceptibility, but its relationship with future cancer risk remains unclear. Here, we present ECG2Gene, a two-stage deep-learning framework that derives digital phenotypes related to germline tumor susceptibility from routine 12-lead ECGs and predicts future cancer risk. In Stage 1, carrier status for pathogenic or likely pathogenic variants in ATM, BRIP1, CHEK2, PALB2, BRCA1, and BRCA2 supervises a multitask model that generates six continuous ECG-derived gene scores. In Stage 2, XGBoost integrates these scores with clinical variables to predict subsequent breast and ovarian cancer in women and prostate cancer in men. We also introduce ECG-Wide Association Analysis (EWAS) to characterize associations between ECG-derived gene scores and ECG waveforms. Across the clinical feature combinations evaluated in UK Biobank, the best-performing sex-specific models achieve AUROCs of 0.683, 0.633, and 0.660 for breast, ovarian, and prostate cancer, respectively. In external evaluations, models combining ECG-derived gene scores with age achieve prostate cancer AUROCs of 0.709 and 0.579 among men in the overall China Kadoorie Biobank and MIMIC-IV-ECG cohorts, respectively. ECG2Gene links genetically supervised ECG phenotyping and waveform association analysis to future cancer outcomes, demonstrating the potential of routine ECGs combined with clinical information for non-invasive, opportunistic cancer risk assessment.", "arxiv_id": "2611.00614", "arxiv_url": "https://arxiv.org/abs/2611.00614", "authors": ["Shanwei Zhang", "Qinghao Zhao", "Yize Zhao", "Jun Li", "Yongchao Long", "Jinshuai Gu", "Ling Yang", "Huaidong Du", "Yiping Chen", "Zhengming Chen", "Dianjianyi Sun", "Jun Lv", "Liming Li", "Iona Y. Millwood", "Robin G. Walters", "Canqing Yu", "Yuxi Zhou", "Shenyong Chen", "Shenda Hong"], "brief": "\u63d0\u51fa\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u4ee5\u516d\u79cd\u80bf\u7624\u6613\u611f\u57fa\u56e0\u7684\u81f4\u75c5\u53d8\u5f02\u643a\u5e26\u72b6\u6001\u76d1\u7763\u5fc3\u7535\u591a\u4efb\u52a1\u6a21\u578b\uff0c\u751f\u6210\u57fa\u56e0\u8bc4\u5206\uff1b\u518d\u7528XGBoost\u7ed3\u5408\u4e34\u5e8a\u53d8\u91cf\u9884\u6d4b\u672a\u6765\u764c\u75c7\u98ce\u9669\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00614", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["12\u5bfc\u8054\u5fc3\u7535\u751f\u6210\u516d\u79cd\u6613\u611f\u57fa\u56e0\u7684\u8fde\u7eed\u8bc4\u5206", "\u82f1\u56fd\u961f\u5217\u4e09\u764c\u79cdAUROC\u4e3a0.633\u81f30.683", "EWAS\u5206\u6790\u57fa\u56e0\u8bc4\u5206\u4e0e\u5fc3\u7535\u6ce2\u5f62\u7684\u5173\u8054"], "keywords": ["\u5fc3\u7535\u56fe", "\u764c\u75c7\u98ce\u9669\u9884\u6d4b", "\u9057\u4f20\u6613\u611f\u6027", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00614v1", "published_at": "2026-10-31", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "ECG2Gene: Deep Learning-Based Germline Tumor Susceptibility Gene Risk Assessment Using Electrocardiograms", "tldr": "\u7528\u9057\u4f20\u6807\u7b7e\u8bad\u7ec3\u5fc3\u7535\u6a21\u578b\uff0c\u7ed3\u5408\u4e34\u5e8a\u53d8\u91cf\u8bc4\u4f30\u4e09\u7c7b\u764c\u75c7\u7684\u672a\u6765\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u4ee5\u516d\u79cd\u80bf\u7624\u6613\u611f\u57fa\u56e0\u7684\u81f4\u75c5\u53d8\u5f02\u643a\u5e26\u72b6\u6001\u76d1\u7763\u5fc3\u7535\u591a\u4efb\u52a1\u6a21\u578b\uff0c\u751f\u6210\u57fa\u56e0\u8bc4\u5206\uff1b\u518d\u7528XGBoost\u7ed3\u5408\u4e34\u5e8a\u53d8\u91cf\u9884\u6d4b\u672a\u6765\u764c\u75c7\u98ce\u9669\u3002", "why_notable": "\u5c06\u9057\u4f20\u76d1\u7763\u4fe1\u53f7\u8f6c\u5316\u4e3a\u5e38\u89c4\u5fc3\u7535\u4e2d\u7684\u98ce\u9669\u8868\u578b\uff0c\u4e3a\u65e0\u521b\u764c\u75c7\u98ce\u9669\u7b5b\u67e5\u63d0\u4f9b\u65b0\u8def\u5f84\uff1b\u4f46\u5916\u90e8\u961f\u5217\u8868\u73b0\u5dee\u5f02\u63d0\u793a\u6cdb\u5316\u4ecd\u662f\u5173\u952e\u3002"}, {"abstract": "Adam keeps two FP32 moments per parameter, twice the bytes of the FP32 weights, yet compressing them is risky: the update divides by the square root of the second moment, so small reconstruction errors can change the restored computation substantially. We study guarded moment compression, in which a coordinate\u0027s decoded moments are accepted only if they reproduce the native FP32 Adam update to within a tolerance $\u03c4$, in units of the learning rate, for every gradient in a clipped domain; all other coordinates are stored exactly. The natural certificate, which ranges each update separately over gradient intervals, fails: on one million trained OPT-125M coordinates it escapes 98.9% of coordinates and the payload grows to 126.6% of raw FP32. Our key observation is that both updates consume the same gradient and parameter. Bounding their difference directly, with FP32 rounding-error allowances and a fixed mixed linear-logarithmic gradient partition, cuts escapes to 0.53% and the payload to 28.3% at $\u03c4=0.01$. Across 120 complete-checkpoint restores of OPT-125M and ResNet-18, with four trained seeds and three training fractions per model, guarded 8-bit log codes shrink moment payloads by 69.5% and 71.9% relative to FP32, 40.8% and 45.4% relative to equally guarded BF16, and 29.3% and 37.6% relative to equally guarded blockwise 8-bit, and every restored first update stays within tolerance. Encoding and restoration together take 2.3-2.6$\\times$ as long as guarded BF16 but less time than guarded blockwise 8-bit. Searching both moment codes jointly saves under 0.001% more bytes at 6% more codec time, so per-moment rounding suffices. The guarantee covers the first restored update under a pinned Torch operation model; we measure subsequent training empirically.", "arxiv_id": "2611.00589", "arxiv_url": "https://arxiv.org/abs/2611.00589", "authors": ["Annan Zhang", "Shengjie Song", "Wenshuai Yao", "Lihao Zhang", "Tianmiao"], "brief": "\u63d0\u51fa\u5171\u4eab\u68af\u5ea6\u8bef\u5dee\u754c\u4fdd\u62a4\u7684Adam\u72b6\u6001\u538b\u7f29\uff0c\u4f7f\u6062\u590d\u540e\u7684\u9996\u6b21\u66f4\u65b0\u6ee1\u8db3\u5bb9\u5dee\uff1b\u4e24\u7c7b\u6a21\u578b\u7684\u52a8\u91cf\u5b58\u50a8\u51cf\u5c11\u7ea6\u4e03\u6210\uff0c\u4f46\u7f16\u89e3\u7801\u6162\u4e8e\u53d7\u4fdd\u62a4BF16\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00589", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f18\u5316\u5668", "\u72b6\u6001\u538b\u7f29", "\u8bef\u5dee\u754c", "\u6a21\u578b\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00589v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Guarded Compression of Adam Optimizer State with Shared-Gradient Bounds", "tldr": "\u63d0\u51fa\u5171\u4eab\u68af\u5ea6\u8bef\u5dee\u754c\u4fdd\u62a4\u7684Adam\u72b6\u6001\u538b\u7f29\uff0c\u4f7f\u6062\u590d\u540e\u7684\u9996\u6b21\u66f4\u65b0\u6ee1\u8db3\u5bb9\u5dee\uff1b\u4e24\u7c7b\u6a21\u578b\u7684\u52a8\u91cf\u5b58\u50a8\u51cf\u5c11\u7ea6\u4e03\u6210\uff0c\u4f46\u7f16\u89e3\u7801\u6162\u4e8e\u53d7\u4fdd\u62a4BF16\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding accelerates LLM inference with a drafter whose proposed tokens are verified by the target model in parallel. Under lossless speculative sampling, a draft token is accepted with probability one minus the total variation (TV) distance between the target and draft distributions, yet drafters are often trained with cross-entropy (CE) or KL. We first show that under matched and well-tuned training, TV matches or surpasses several published draft-training objectives when fine-tuning, and a fixed TV and KL mixture does the same when training from scratch. We identify two remaining problems, TV\u0027s vanishing gradients on undercovered tokens and the prefix products that starve later positions in acceptance-length objectives. To address both, we derive TVP, a loss family based on expected acceptance length, whose power parameter interpolates between coverage and acceptance oriented objectives. Annealing the power from zero to one gives the highest or tied-highest acceptance length across three drafter architectures and three target models, including longer drafts and block verification. TVP improves acceptance length over CE by 9.8% when fine-tuning, and over the public DFlash2 training recipes by 6.2 to 12.9%.", "arxiv_id": "2611.00588", "arxiv_url": "https://arxiv.org/abs/2611.00588", "authors": ["Aaryam Sharma"], "brief": "\u63d0\u51fa\u9762\u5411\u63a8\u6d4b\u89e3\u7801\u7684TVP\u8bad\u7ec3\u635f\u5931\uff0c\u7f13\u89e3\u68af\u5ea6\u6d88\u5931\u4e0e\u540e\u7eed\u4f4d\u7f6e\u8bad\u7ec3\u4e0d\u8db3\uff1b\u8de8\u591a\u79cd\u67b6\u6784\u8868\u73b0\u9886\u5148\u6216\u6301\u5e73\uff0c\u5fae\u8c03\u65f6\u63a5\u53d7\u957f\u5ea6\u8f83\u4ea4\u53c9\u71b5\u63d0\u53479.8%\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00588", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u5927\u6a21\u578b\u63a8\u7406", "\u635f\u5931\u51fd\u6570"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00588v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TVP: TV is Almost All You Need for Speculative Decoding", "tldr": "\u63d0\u51fa\u9762\u5411\u63a8\u6d4b\u89e3\u7801\u7684TVP\u8bad\u7ec3\u635f\u5931\uff0c\u7f13\u89e3\u68af\u5ea6\u6d88\u5931\u4e0e\u540e\u7eed\u4f4d\u7f6e\u8bad\u7ec3\u4e0d\u8db3\uff1b\u8de8\u591a\u79cd\u67b6\u6784\u8868\u73b0\u9886\u5148\u6216\u6301\u5e73\uff0c\u5fae\u8c03\u65f6\u63a5\u53d7\u957f\u5ea6\u8f83\u4ea4\u53c9\u71b5\u63d0\u53479.8%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Attention is the computational core of large language models, yet the verifiers that bound how far an attention head\u0027s output can move under input perturbations give no guarantee on how loose their bounds are. A weak certificate therefore cannot be told apart from a fragile model. We develop a conic programming theory of attention certification that supplies this guarantee. We prove that the difficulty lies not in the softmax but in the bilinear interaction of a varying query with the keys. This interaction makes certification NP-hard over boxes and inapproximable once the attention logits can move by a constant amount. A fixed query or listed token substitutions, by contrast, make the exact worst case efficiently computable. An exponential cone moment relaxation then certifies a head with an error bounded quadratically in the perturbation radius by computable quantities, an order that cannot be improved. We also show that relaxations that treat a network one operation at a time, linear bound propagation among them, pay on second-order terms a sum of per-operation maxima instead of one coupled maximum. Computational results on GPT-2 indicate that the theory carries over to a trained model. Against exact worst cases with the query fixed, the certificate attains the predicted second-order accuracy. It is tighter than linear bound propagation on every head, and the looseness of bound propagation tracks the predicted per-operation excess.", "arxiv_id": "2611.00585", "arxiv_url": "https://arxiv.org/abs/2611.00585", "authors": ["Masoud Ataei"], "brief": "\u63d0\u51fa\u6ce8\u610f\u529b\u8ba4\u8bc1\u7684\u9525\u89c4\u5212\u7406\u8bba\uff0c\u8bc1\u660e\u52a8\u6001\u67e5\u8be2\u4e0e\u952e\u7684\u53cc\u7ebf\u6027\u4ea4\u4e92\u5bfc\u81f4\u8ba1\u7b97\u56f0\u96be\uff0c\u5e76\u7ed9\u51fa\u4e8c\u9636\u6700\u4f18\u8bef\u5dee\u754c\uff1bGPT-2\u5b9e\u9a8c\u663e\u793a\uff0c\u8bc1\u4e66\u5728\u6240\u6709\u6ce8\u610f\u529b\u5934\u4e0a\u5747\u7d27\u4e8e\u7ebf\u6027\u754c\u4f20\u64ad\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00585", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u9c81\u68d2\u6027\u8ba4\u8bc1", "\u9525\u89c4\u5212", "\u8ba1\u7b97\u590d\u6742\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00585v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Conic Certification of Transformer Attention", "tldr": "\u63d0\u51fa\u6ce8\u610f\u529b\u8ba4\u8bc1\u7684\u9525\u89c4\u5212\u7406\u8bba\uff0c\u8bc1\u660e\u52a8\u6001\u67e5\u8be2\u4e0e\u952e\u7684\u53cc\u7ebf\u6027\u4ea4\u4e92\u5bfc\u81f4\u8ba1\u7b97\u56f0\u96be\uff0c\u5e76\u7ed9\u51fa\u4e8c\u9636\u6700\u4f18\u8bef\u5dee\u754c\uff1bGPT-2\u5b9e\u9a8c\u663e\u793a\uff0c\u8bc1\u4e66\u5728\u6240\u6709\u6ce8\u610f\u529b\u5934\u4e0a\u5747\u7d27\u4e8e\u7ebf\u6027\u754c\u4f20\u64ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific discovery advances when evidence from different investigations is brought into contact. Yet paper-centric communication leaves experimental results fragmented, delayed, or unreported, creating a \"scientific memory wall\" between growing computational capabilities and the evidence accessible to AI systems. We envision a different dynamic: in a network of intelligent laboratories, a failed or overlooked experiment in one domain could trigger a hypothesis in another, whose testing generates evidence that stimulates further investigations. Such chains of information collision and empirical validation could transform isolated discovery loops into a cumulative scientific process. We propose Evolving Scientific Intelligence (ESI), an architectural blueprint for enabling these evidence-driven chain reactions. ESI preserves experimental records in shared, computable scientific memory, where evidence from different domains can be recombined into testable hypotheses. It jointly selects candidates and evaluation methods according to scientific value, reliability, and cost, then coordinates physical tests across distributed experimental nodes. Their feedback revises hypotheses and evaluators, while slower meta-control reassesses research objectives and decision criteria to guard against self-reinforcing errors and misguided optimization. We call for an Information Manhattan Project to build the infrastructure for scientific intelligence that evolves through experimentally grounded chains of discovery.", "arxiv_id": "2611.00580", "arxiv_url": "https://arxiv.org/abs/2611.00580", "authors": ["Yuheng Ding"], "brief": "\u63d0\u51faESI\u67b6\u6784\uff0c\u4ee5\u5171\u4eab\u79d1\u5b66\u8bb0\u5fc6\u91cd\u7ec4\u8de8\u9886\u57df\u8bc1\u636e\uff0c\u5e76\u534f\u8c03\u5206\u5e03\u5f0f\u5b9e\u9a8c\u5f62\u6210\u53cd\u9988\u95ed\u73af\uff1b\u5c1a\u5c5e\u84dd\u56fe\uff0c\u65e8\u5728\u7a81\u7834\u8bc1\u636e\u788e\u7247\u5316\u5e76\u6291\u5236\u81ea\u6211\u5f3a\u5316\u9519\u8bef\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00580", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u5b66\u667a\u80fd", "\u79d1\u5b66\u53d1\u73b0", "\u5206\u5e03\u5f0f\u5b9e\u9a8c", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00580v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evolving Scientific Intelligence: From Fragmented Evidence to Distributed Experimental Loops", "tldr": "\u63d0\u51faESI\u67b6\u6784\uff0c\u4ee5\u5171\u4eab\u79d1\u5b66\u8bb0\u5fc6\u91cd\u7ec4\u8de8\u9886\u57df\u8bc1\u636e\uff0c\u5e76\u534f\u8c03\u5206\u5e03\u5f0f\u5b9e\u9a8c\u5f62\u6210\u53cd\u9988\u95ed\u73af\uff1b\u5c1a\u5c5e\u84dd\u56fe\uff0c\u65e8\u5728\u7a81\u7834\u8bc1\u636e\u788e\u7247\u5316\u5e76\u6291\u5236\u81ea\u6211\u5f3a\u5316\u9519\u8bef\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A deployed model sees its inputs for free, but checking whether its risk has risen requires costly labels. We study how to spend a label budget so that a risk increase is detected quickly while false alarms stay controlled, including under input shifts that keep the risk below a safety threshold $\u03c4$. Let $A$ be the false-alarm control scale and $h(r)=\\mathrm{kl}(r,\u03c4)$ the Bernoulli KL divergence between the changed risk $r$ and $\u03c4$. At label rate $b=c/\\log A$, we prove that every rule that chooses requests from its own label history has worst-case (Lorden) delay at least $(1/h(r)+1/c)\\log A$ to first order: besides collecting evidence, it must wait for its next label. The bound needs only a label budget on one finite stretch of safe source data and false-alarm control over an initial window; a bound on the average time to false alarm does not suffice. When a harmful change also shifts the inputs, a rule that lets the inputs trigger labeling attains delay $\\log A/h(r)$ to first order on a fixed Gaussian model, so free covariates save at least $1/b$ rounds. A hybrid rule adds a label-history fallback for risk changes that leave the inputs unchanged. Synthetic experiments and two ACS tasks, with strengthened label-only baselines, show the predicted pattern. The covariate trigger has a cost: because its budget is calibrated on the source, a benign input shift can make it request nearly every label.", "arxiv_id": "2611.00576", "arxiv_url": "https://arxiv.org/abs/2611.00576", "authors": ["Yanze Cao"], "brief": "\u7814\u7a76\u6807\u7b7e\u9884\u7b97\u4e0b\u7684\u98ce\u9669\u53d8\u5316\u68c0\u6d4b\uff0c\u8bc1\u660e\u5229\u7528\u514d\u8d39\u8f93\u5165\u7279\u5f81\u89e6\u53d1\u6807\u6ce8\u53ef\u964d\u4f4e\u68c0\u6d4b\u5ef6\u8fdf\uff0c\u5e76\u7ecf\u5408\u6210\u4e0e\u771f\u5b9e\u4efb\u52a1\u9a8c\u8bc1\uff1b\u4f46\u826f\u6027\u8f93\u5165\u504f\u79fb\u53ef\u80fd\u5bfc\u81f4\u6807\u6ce8\u8bf7\u6c42\u6fc0\u589e\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00576", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u98ce\u9669\u76d1\u6d4b", "\u6807\u7b7e\u9884\u7b97", "\u8f93\u5165\u504f\u79fb", "\u53d8\u5316\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00576v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The First-Order Value of Free Covariates in Budgeted Risk Monitoring", "tldr": "\u7814\u7a76\u6807\u7b7e\u9884\u7b97\u4e0b\u7684\u98ce\u9669\u53d8\u5316\u68c0\u6d4b\uff0c\u8bc1\u660e\u5229\u7528\u514d\u8d39\u8f93\u5165\u7279\u5f81\u89e6\u53d1\u6807\u6ce8\u53ef\u964d\u4f4e\u68c0\u6d4b\u5ef6\u8fdf\uff0c\u5e76\u7ecf\u5408\u6210\u4e0e\u771f\u5b9e\u4efb\u52a1\u9a8c\u8bc1\uff1b\u4f46\u826f\u6027\u8f93\u5165\u504f\u79fb\u53ef\u80fd\u5bfc\u81f4\u6807\u6ce8\u8bf7\u6c42\u6fc0\u589e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tabular foundation models (TFMs) enable in-context prediction on unseen tabular datasets without task-specific training. Mechanistic work has shown that increasing the depth of the ICL Transformer yields weak gains, leaving the main headroom for gains in the synthetic pretraining prior and column-row encoder upstream of the ICL backbone. We introduce TabAbax, a TFM built on TabICLv2 that focuses all modifications on these two upstream components. On the prior side, we further improve the quality and complexity of the synthetic pretraining prior. On the encoder side, a two-pass column-row stack strengthens cross-feature interactions before row compression, using learned Fourier scalar encoding from TabFM and Causilo. Evaluations on BeyondArena and TabArena show strong regression-centric gains: TabAbax reaches 1,238 Elo on the 142-dataset BeyondArena suite (10th of 41 evaluated methods), 1,676 Elo on TabArena\u0027s overall 51-dataset suite (11th of 99 methods, +115 over TabICLv2), and 2,024 Elo on TabArena\u0027s regression benchmark (7th of 99 methods, +336 over TabICLv2, +21 over TabFM). A prior-only ablation confirms the attribution: the improved prior alone yields +228 Elo for regression, demonstrating that prior quality is the dominant knob for improving regression performance.", "arxiv_id": "2611.00562", "arxiv_url": "https://arxiv.org/abs/2611.00562", "authors": ["Zhixiong Cheng", "Xiaoyun Gao", "Shiyuan Han", "Jingjing Suo", "Zhengli Wang"], "brief": "TabAbax\u57fa\u4e8eTabICLv2\u6539\u8fdb\u5408\u6210\u9884\u8bad\u7ec3\u5148\u9a8c\u4e0e\u5217\u884c\u7f16\u7801\u5668\uff0c\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u56de\u5f52\u6027\u80fd\uff1b\u6d88\u878d\u663e\u793a\uff0c\u5148\u9a8c\u8d28\u91cf\u662f\u56de\u5f52\u6027\u80fd\u63d0\u5347\u7684\u4e3b\u8981\u56e0\u7d20\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00562", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u57fa\u7840\u6a21\u578b", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u5408\u6210\u6570\u636e", "\u56de\u5f52"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00562v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TabAbax: A Tabular Foundation Model Technical Report", "tldr": "TabAbax\u57fa\u4e8eTabICLv2\u6539\u8fdb\u5408\u6210\u9884\u8bad\u7ec3\u5148\u9a8c\u4e0e\u5217\u884c\u7f16\u7801\u5668\uff0c\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u56de\u5f52\u6027\u80fd\uff1b\u6d88\u878d\u663e\u793a\uff0c\u5148\u9a8c\u8d28\u91cf\u662f\u56de\u5f52\u6027\u80fd\u63d0\u5347\u7684\u4e3b\u8981\u56e0\u7d20\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Inference-time scaling enhances a model\u0027s reasoning by extending its chain-of-thought (CoT). However, existing approaches typically rely on a single policy trained with outcome-reward reinforcement learning (RL), which often suffers from long-horizon plan failures where the implicit plan drifts from valid strategies, especially for small LMs with limited capacity. To address this, we propose Multi-Level Reasoning (MLR), which reformulates long-CoT generation as a two-level stochastic process. A high-level planner generates structured step descriptors specifying both the reasoning mode and the semantic subgoal. The low-level executor then produces detailed reasoning conditioned on these descriptors, forming an alternating plan--execute loop. To maintain scalability, we adopt a minimal design where the base model serves as the low-level policy and a lightweight LoRA module implements the high-level policy. For training, we observe that outcome-reward RL provides sparse and delayed feedback for long trajectories (e.g., several thousand tokens), hindering credit assignment. We therefore introduce iterative Step-DPO, a process-level preference optimization scheme that leverages Twisted Sequential Monte Carlo (TSMC) to provide scalable stepwise supervision. This yields more effective training, improved stability, and higher accuracy. Extensive experiments on challenging math, science, and logical reasoning benchmarks show that, under the same reduced data budget (10% SFT and 5% preference relative to the DeepSeek-R1 distillation setup), MLR outperforms both SFT-based distillation and strong RL/preference-optimization baselines across multiple base models and tasks. Moreover, MLR exhibits slower performance degradation on long-horizon reasoning, demonstrating stronger robustness under extended CoT generation.", "arxiv_id": "2611.00616", "arxiv_url": "https://arxiv.org/abs/2611.00616", "authors": ["Siheng Xiong", "Ali Payani", "Faramarz Fekri"], "brief": "\u63d0\u51fa\u591a\u5c42\u63a8\u7406\u6846\u67b6\uff0c\u7531\u89c4\u5212\u5668\u6307\u5b9a\u63a8\u7406\u6a21\u5f0f\u548c\u5b50\u76ee\u6807\uff0c\u6267\u884c\u5668\u5c55\u5f00\u63a8\u7406\uff0c\u5e76\u7528\u9010\u6b65\u504f\u597d\u4f18\u5316\u8bad\u7ec3\u3002\u5728\u8f83\u5c11\u6570\u636e\u4e0b\uff0c\u8be5\u65b9\u6cd5\u8d85\u8d8a\u591a\u79cd\u57fa\u7ebf\uff0c\u4e14\u957f\u7a0b\u63a8\u7406\u9000\u5316\u66f4\u6162\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00616", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u5c42\u63a8\u7406", "\u601d\u7ef4\u94fe", "\u504f\u597d\u4f18\u5316", "\u63a8\u7406\u65f6\u6269\u5c55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00616v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Enhancing Language Model Reasoning with Structured Multi-Level Modeling", "tldr": "\u63d0\u51fa\u591a\u5c42\u63a8\u7406\u6846\u67b6\uff0c\u7531\u89c4\u5212\u5668\u6307\u5b9a\u63a8\u7406\u6a21\u5f0f\u548c\u5b50\u76ee\u6807\uff0c\u6267\u884c\u5668\u5c55\u5f00\u63a8\u7406\uff0c\u5e76\u7528\u9010\u6b65\u504f\u597d\u4f18\u5316\u8bad\u7ec3\u3002\u5728\u8f83\u5c11\u6570\u636e\u4e0b\uff0c\u8be5\u65b9\u6cd5\u8d85\u8d8a\u591a\u79cd\u57fa\u7ebf\uff0c\u4e14\u957f\u7a0b\u63a8\u7406\u9000\u5316\u66f4\u6162\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Does eliciting five weighted estimates within a single response change how a language model responds to information? Across anchoring, hindsight, base-rate, conjunction, and status-quo/default tasks, we compare direct numerical answers with a multi-estimate response format, contrasting source framings, explicitly random cues, and probability-consistency constraints. We evaluate three completed configurations--gpt-6.1-sol, claude-sonnet-5.5, and Qwen3-8B (reasoning disabled, analyzed descriptively). In the first two configurations, direct elicitation yielded near-zero irrelevant-anchor indices and status-quo effects, while remaining responsive to informative sources and informed advice. Of 23 preregistered confirmatory tests, six rejected after Holm adjustment; however, all six absolute point estimates fell below their prespecified smallest effect sizes of interest without establishing equivalence. Moreover, while separate versus joint elicitation shifted conjunction judgments, interpretation is constrained by between-call noise. Ultimately, multi-estimate elicitation failed to produce uniform debiasing or response attenuation across tasks and models, though post hoc correlations between candidate spread and anchoring error motivate independent predictive validation. Materials: https://github.com/asj252/llm-judgment-studies", "arxiv_id": "2611.00597", "arxiv_url": "https://arxiv.org/abs/2611.00597", "authors": ["An-Sheng Jhang"], "brief": "\u7814\u7a76\u6bd4\u8f83\u76f4\u63a5\u56de\u7b54\u4e0e\u5355\u6b21\u751f\u6210\u4e94\u4e2a\u52a0\u6743\u4f30\u8ba1\u5728\u591a\u79cd\u8ba4\u77e5\u504f\u5dee\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\u3002\u591a\u4f30\u8ba1\u6cd5\u672a\u80fd\u8de8\u4efb\u52a1\u548c\u6a21\u578b\u7a33\u5b9a\u6d88\u9664\u504f\u5dee\uff0c\u663e\u8457\u7ed3\u679c\u7684\u6548\u5e94\u91cf\u4e5f\u5747\u4f4e\u4e8e\u9884\u8bbe\u5173\u6ce8\u9608\u503c\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00597", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8ba4\u77e5\u504f\u5dee", "\u5224\u65ad\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00597v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multi-Estimate Elicitation Does Not Uniformly Debias Language Model Judgments", "tldr": "\u7814\u7a76\u6bd4\u8f83\u76f4\u63a5\u56de\u7b54\u4e0e\u5355\u6b21\u751f\u6210\u4e94\u4e2a\u52a0\u6743\u4f30\u8ba1\u5728\u591a\u79cd\u8ba4\u77e5\u504f\u5dee\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\u3002\u591a\u4f30\u8ba1\u6cd5\u672a\u80fd\u8de8\u4efb\u52a1\u548c\u6a21\u578b\u7a33\u5b9a\u6d88\u9664\u504f\u5dee\uff0c\u663e\u8457\u7ed3\u679c\u7684\u6548\u5e94\u91cf\u4e5f\u5747\u4f4e\u4e8e\u9884\u8bbe\u5173\u6ce8\u9608\u503c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Finding the passage that answers a question is the first step of most practical systems built on documents, and for Tajik we found no openly described model for it. We present Saidzoda-Tajik-E5-Large, a Tajik text embedder built from multilingual-e5-large-instruct (560M parameters). We asked our own Tajik language model to write questions for passages from Tajik laws, tax documents, Wikipedia and web text, and trained on 235,140 question and passage pairs for one epoch, with hard negatives chosen by another embedder and English and Russian pairs mixed in so the model would not forget those languages. On laws the model had never seen, the right passage is among the top ten results for 93.6% of questions, up from 80.2%; on tax documents, 94.5% against 82.6%. On Belebele, the one test we have that was written by people, the gain is smaller and not confirmed (92.2% to 95.2%, with touching intervals), and Russian and English do not change. On law and tax questions written in the same style as its training questions, it is tied with Giga-Embeddings-3B, a model five times its size; on Belebele the 3B and 8B models score slightly higher, and only after we fine-tuned them on our data are they clearly ahead. We also report what failed: training in bfloat16 broke the model, and replacing Tajik letters with similar Russian ones did not help. Our law, tax and Wikipedia test questions come from the same model that wrote the training questions, so we treat those scores as an upper limit until questions written by Tajik speakers are available.", "arxiv_id": "2611.00592", "arxiv_url": "https://arxiv.org/abs/2611.00592", "authors": ["Tohir Saidzoda", "Nekruz Maxudov", "Bedil Karimov", "Abubakr Abdullozoda", "Amin Jalilov", "Jonibek Kishvarov", "Rahmonali Sharipov", "Mariyamkhon Shodyeva"], "brief": "\u7528\u5408\u6210\u95ee\u7b54\u5fae\u8c035.6\u4ebf\u53c2\u6570\u5854\u5409\u514b\u8bed\u5d4c\u5165\u6a21\u578b\uff0c\u6cd5\u5f8b\u548c\u7a0e\u52a1\u68c0\u7d22\u524d\u5341\u53ec\u56de\u7387\u63d0\u5347\u7ea612\u81f313\u4e2a\u767e\u5206\u70b9\uff1b\u4eba\u5de5\u6d4b\u8bd5\u96c6\u589e\u76ca\u5c1a\u4e0d\u663e\u8457\uff0c\u5408\u6210\u8bc4\u6d4b\u53ef\u80fd\u504f\u4e50\u89c2\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00592", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u6587\u672c\u5d4c\u5165", "\u4fe1\u606f\u68c0\u7d22", "\u5408\u6210\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00592v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Saidzoda-Tajik-E5-Large: Fine-Tuning a 560M Embedder for Tajik Retrieval", "tldr": "\u7528\u5408\u6210\u95ee\u7b54\u5fae\u8c035.6\u4ebf\u53c2\u6570\u5854\u5409\u514b\u8bed\u5d4c\u5165\u6a21\u578b\uff0c\u6cd5\u5f8b\u548c\u7a0e\u52a1\u68c0\u7d22\u524d\u5341\u53ec\u56de\u7387\u63d0\u5347\u7ea612\u81f313\u4e2a\u767e\u5206\u70b9\uff1b\u4eba\u5de5\u6d4b\u8bd5\u96c6\u589e\u76ca\u5c1a\u4e0d\u663e\u8457\uff0c\u5408\u6210\u8bc4\u6d4b\u53ef\u80fd\u504f\u4e50\u89c2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time search can improve structured planning, but when methods differ in prompts, post-processing, and selection, it is unclear what an observed gain should be attributed to. We study this question on DisasterBench, where models compose typed multi-tool workflows, by decomposing inference into three observable stages: whether a correct workflow is discovered, whether it survives structural validation, and whether it is finally selected. Comparing independent sampling, a nominal tree-search configuration, and multi-operator search under controlled inference budgets on two model families, we find that (i) the nominal tree-search configuration realizes non-adaptive complete-workflow sampling, and independent sampling with its expansion prompt reproduces its candidate discovery without constructing a tree; (ii) structural validation never removes the last correct workflow in our evaluated candidate pools, whereas majority voting leaves a discovered correct workflow unselected on 10-19% of tasks per pool, with an audit confirming substantive tool-choice or information-flow errors in 57 of 60 examined cases; and (iii) a tool-specification-aware verifier recovers some of these losses but overturns more correct decisions than it fixes. Our results motivate auditing realized rather than nominal inference pipelines, and reporting discovery, validity, and selection separately.", "arxiv_id": "2611.00579", "arxiv_url": "https://arxiv.org/abs/2611.00579", "authors": ["Zhitong Chen", "Weifeng Zhang", "Kai Yin", "Zhiyuan Wang", "Ali Mostafavi", "James Caverlee"], "brief": "\u8bba\u6587\u62c6\u89e3\u591a\u5de5\u5177\u5de5\u4f5c\u6d41\u89c4\u5212\u7684\u6d4b\u8bd5\u65f6\u63a8\u7406\u6d41\u7a0b\uff0c\u53d1\u73b0\u6807\u79f0\u6811\u641c\u7d22\u5b9e\u9645\u9000\u5316\u4e3a\u72ec\u7acb\u91c7\u6837\uff1b\u591a\u6570\u6295\u7968\u5e38\u6f0f\u9009\u6b63\u786e\u7ed3\u679c\uff0c\u5de5\u5177\u89c4\u8303\u9a8c\u8bc1\u5668\u7684\u7ea0\u9519\u6536\u76ca\u4e5f\u4e0d\u8db3\u4ee5\u62b5\u6d88\u8bef\u5224\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00579", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u641c\u7d22", "\u5de5\u4f5c\u6d41\u89c4\u5212", "\u7ed3\u679c\u9009\u62e9", "\u63a8\u7406\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00579v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Apparent Search Gains to Selection Failures: Auditing Test-Time Inference in Structured Workflow Planning", "tldr": "\u8bba\u6587\u62c6\u89e3\u591a\u5de5\u5177\u5de5\u4f5c\u6d41\u89c4\u5212\u7684\u6d4b\u8bd5\u65f6\u63a8\u7406\u6d41\u7a0b\uff0c\u53d1\u73b0\u6807\u79f0\u6811\u641c\u7d22\u5b9e\u9645\u9000\u5316\u4e3a\u72ec\u7acb\u91c7\u6837\uff1b\u591a\u6570\u6295\u7968\u5e38\u6f0f\u9009\u6b63\u786e\u7ed3\u679c\uff0c\u5de5\u5177\u89c4\u8303\u9a8c\u8bc1\u5668\u7684\u7ea0\u9519\u6536\u76ca\u4e5f\u4e0d\u8db3\u4ee5\u62b5\u6d88\u8bef\u5224\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language model (VLM) unlearning is often treated as an objective-design problem: given multimodal forget data, the goal is to optimize a loss that removes undesirable behavior while preserving retained capabilities. We argue that this view overlooks an equally important data-centric question: how should each forget example be represented before optimization? Existing methods typically keep image-conditioned failures in their original image-text form, implicitly assuming that pixels are the right route for unlearning whenever pixels appear in the input. We challenge this assumption by constructing modality-decomposed versions of VLM benchmarks, enabling controlled comparisons among image-only, text-only, and multimodal representations of the same examples. Our modality-mixing experiments show that unsafe instruction-following behavior is more effectively suppressed through textual representations than through images alone, while purely text-only unlearning can still weaken visual grounding when the target behavior depends on visual evidence. Motivated by this trade-off, we introduce ModRoute, a gradient-guided per-sample modality routing strategy that selectively converts high visual-pressure examples to text-only form while keeping the remaining examples multimodal. Notably, on VLGuard with LLaVA-1.5-7B, ModRoute has the strongest composite unlearning-utility score of 0.847 at $\u03b3=0.5$, a 2.5% improvement over the best random-switching score and $\\geq$46% better than pure multimodal or text unlearning. Overall, our results show that effective VLM unlearning depends not only on the objective, but also on the composition and per-sample modality routing of the unlearning data.", "arxiv_id": "2611.00608", "arxiv_url": "https://arxiv.org/abs/2611.00608", "authors": ["Laura Yao", "Haochen Zhang", "Jinhao Duan", "Sijia Liu", "Tianlong Chen"], "brief": "\u63d0\u51fa\u68af\u5ea6\u5f15\u5bfc\u7684\u9010\u6837\u672c\u6a21\u6001\u8def\u7531\uff0c\u5c06\u90e8\u5206\u9057\u5fd8\u6570\u636e\u8f6c\u4e3a\u7eaf\u6587\u672c\u4ee5\u517c\u987e\u5b89\u5168\u6027\u4e0e\u89c6\u89c9\u80fd\u529b\uff1b\u5728VLGuard\u4e0a\u7efc\u5408\u5f97\u5206\u8fbe0.847\uff0c\u4f18\u4e8e\u968f\u673a\u5207\u6362\u53ca\u5355\u4e00\u6a21\u6001\u7b56\u7565\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00608", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u6a21\u6001\u8def\u7531", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00608v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Words Before Pixels: Selective Modality Routing for Vision-Language Model Unlearning", "tldr": "\u63d0\u51fa\u68af\u5ea6\u5f15\u5bfc\u7684\u9010\u6837\u672c\u6a21\u6001\u8def\u7531\uff0c\u5c06\u90e8\u5206\u9057\u5fd8\u6570\u636e\u8f6c\u4e3a\u7eaf\u6587\u672c\u4ee5\u517c\u987e\u5b89\u5168\u6027\u4e0e\u89c6\u89c9\u80fd\u529b\uff1b\u5728VLGuard\u4e0a\u7efc\u5408\u5f97\u5206\u8fbe0.847\uff0c\u4f18\u4e8e\u968f\u673a\u5207\u6362\u53ca\u5355\u4e00\u6a21\u6001\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Structured channel pruning for convolutional neural networks (CNNs) plays an important role in pattern recognition and deep learning. Nevertheless, existing methods usually calculate channel importance scores based on the magnitudes of individual filters, making it difficult to distinguish shared redundancy from individual channel contributions. To tackle this limitation, we propose a novel structured channel pruning method termed bi-sparse matrix factorization (BSMF). Specifically, BSMF characterizes the convolutional weight matrix as output-channel coefficients over a shared basis with row-wise $\\ell_{2,p}$-norm and column-wise $\\ell_{2,q}$-norm regularization terms, respectively. Note that $p,q\\in[0,1)$, which, to our best knowledge, has not been explored in the literature. To solve the resulting non-convex optimization problem, we develop an efficient update scheme built upon the alternating direction method of multipliers (ADMM), in which all subproblems admit closed-form solutions. After that, a compact CNN is obtained by reconstructing the convolutional filters from the learned factors and discarding the redundant channels. Extensive experiments on the CIFAR-10 and ImageNet-1K datasets demonstrate that our proposed BSMF achieves significant network compression while maintaining high reconstruction accuracy. The source code is publicly available at https://github.com/xianchaoxiu/BSMF", "arxiv_id": "2611.00566", "arxiv_url": "https://arxiv.org/abs/2611.00566", "authors": ["Jingjing Liu", "Ziyang Wang", "Xianchao Xiu", "Wanquan Liu"], "brief": "\u63d0\u51fa\u53cc\u7a00\u758f\u77e9\u9635\u5206\u89e3\u65b9\u6cd5\uff0c\u7ed3\u5408\u5171\u4eab\u57fa\u548c\u901a\u9053\u7cfb\u6570\u533a\u5206\u5197\u4f59\uff0c\u5e76\u7528\u95ed\u5f0f\u66f4\u65b0\u526a\u679d\u5377\u79ef\u7f51\u7edc\uff1b\u5b9e\u9a8c\u8868\u660e\u8be5\u65b9\u6cd5\u80fd\u663e\u8457\u538b\u7f29\u6a21\u578b\u5e76\u4fdd\u6301\u8f83\u9ad8\u91cd\u6784\u7cbe\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00566", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ed3\u6784\u5316\u526a\u679d", "\u77e9\u9635\u5206\u89e3", "\u6a21\u578b\u538b\u7f29", "\u5377\u79ef\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00566v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Structured Channel Network Pruning with Bi-Sparse Matrix Factorization", "tldr": "\u63d0\u51fa\u53cc\u7a00\u758f\u77e9\u9635\u5206\u89e3\u65b9\u6cd5\uff0c\u7ed3\u5408\u5171\u4eab\u57fa\u548c\u901a\u9053\u7cfb\u6570\u533a\u5206\u5197\u4f59\uff0c\u5e76\u7528\u95ed\u5f0f\u66f4\u65b0\u526a\u679d\u5377\u79ef\u7f51\u7edc\uff1b\u5b9e\u9a8c\u8868\u660e\u8be5\u65b9\u6cd5\u80fd\u663e\u8457\u538b\u7f29\u6a21\u578b\u5e76\u4fdd\u6301\u8f83\u9ad8\u91cd\u6784\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large gaps in seismic acquisition disrupt reflection events and hinder spectral recovery. Existing seismic interpolation deep unfolding networks primarily rely on localized spatial priors, limiting their ability to aggregate the global context necessary for reconstructing these extensive missing regions. We propose a spatial-spectral interactive projection-onto-convex-sets network (SSI-POCS) to tackle this severely ill-posed problem. By unfolding the classical iterative solver, our network integrates physical consistency with dual-domain deep priors via learned transforms, soft thresholding, and exact data reinsertion. Within the learned prior, a spatial Restormer branch captures local waveform structures, while a fast Fourier convolution (FFC) branch extracts global context, effectively suppressing incoherent components and enhancing spectral energy concentration in the $f-k$ domain. A dual-domain fusion module exchanges these complementary features via bidirectional channel attention and gated modulation, yielding substantial interpolation improvements. To overcome the severe loss of lateral continuity caused by large gaps, we introduce structural similarity (SSIM) supervision, complemented by focal frequency loss (FFL) and transform consistency constraints to suppress incoherent high-frequency components and regularize training. Experiments on a synthetic salt dome and a North Sea field dataset under 50% random and consecutive trace removal demonstrate the effectiveness of SSI-POCS. It significantly enhances event continuity across large gaps and mitigates artifacts, achieving a 3.285~dB SNR improvement over the best competing method while reducing parameters by 75.66%.", "arxiv_id": "2611.00556", "arxiv_url": "https://arxiv.org/abs/2611.00556", "authors": ["Baisong Jiang", "Chunxia Zhang", "Anxiang Di", "Xiaoli Wei", "Xiangyu Zhao", "Deng Xiong", "Chuangji Meng"], "brief": "\u63d0\u51fa\u7a7a\u95f4\u4e0e\u9891\u8c31\u4ea4\u4e92\u7684\u6df1\u5ea6\u5c55\u5f00\u7f51\u7edc\uff0c\u7ed3\u5408\u7269\u7406\u4e00\u81f4\u6027\u548c\u53cc\u57df\u5148\u9a8c\uff0c\u4fee\u590d\u5730\u9707\u6570\u636e\u5927\u8303\u56f4\u7f3a\u5931\uff1b\u5b9e\u9a8c\u4e2d\u4fe1\u566a\u6bd4\u63d0\u53473.285 dB\uff0c\u53c2\u6570\u91cf\u51cf\u5c1175.66%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00556", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5730\u9707\u6570\u636e\u63d2\u503c", "\u6df1\u5ea6\u5c55\u5f00", "\u9891\u8c31\u5206\u6790", "\u6570\u636e\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.00556v1", "published_at": "2026-10-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Spatial-Spectral Interactive POCS Network for Large-Gap Seismic Data Interpolation", "tldr": "\u63d0\u51fa\u7a7a\u95f4\u4e0e\u9891\u8c31\u4ea4\u4e92\u7684\u6df1\u5ea6\u5c55\u5f00\u7f51\u7edc\uff0c\u7ed3\u5408\u7269\u7406\u4e00\u81f4\u6027\u548c\u53cc\u57df\u5148\u9a8c\uff0c\u4fee\u590d\u5730\u9707\u6570\u636e\u5927\u8303\u56f4\u7f3a\u5931\uff1b\u5b9e\u9a8c\u4e2d\u4fe1\u566a\u6bd4\u63d0\u53473.285 dB\uff0c\u53c2\u6570\u91cf\u51cf\u5c1175.66%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
