u5148\u9a8c\u4e0e\u52a8\u4f5c\u6761\u4ef6\u8868\u5f81\uff0c\u518d\u901a\u8fc7\u672a\u6765\u6761\u4ef6\u7279\u6743\u4fe1\u606f\u84b8\u998f\u5b9e\u73b0\u9ad8\u8d28\u91cf\u5355\u6b65\u52a8\u4f5c\u751f\u6210\u3002", "why_notable": "\u5c06\u6570\u5341\u6b65\u53bb\u566a\u538b\u7f29\u81f3\u4e00\u6b65\uff0c\u5728\u9a7e\u9a76\u4e0e\u5177\u8eab\u63a7\u5236\u4efb\u52a1\u4e0a\u8fbe\u5230\u76f8\u5f53\u6216\u66f4\u4f18\u6548\u679c\uff0c\u4e3a\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u5b9e\u65f6\u90e8\u7f72\u63d0\u4f9b\u4e86\u5177\u4f53\u8def\u5f84\u3002"}, {"abstract": "Real-world forgery is inherently heterogeneous: it manifests not only as digital manipulation but also as physical spoofing, and is carried not only by images but also by videos. Despite substantial progress, a unified anti-forgery foundation model covering such a broad threat spectrum remains absent. In this paper, we present Venus-DefakerOne2, which substantially extends the forensic capability boundary along both the forgery-form and media-type dimensions. Trained on tens of millions of open-source and in-house samples, it incorporates two key designs. Tide-Style-Tuning alternates LoRA and full-parameter fine-tuning to balance computational efficiency, generalization, and hard-sample fitting while mitigating catastrophic forgetting. Entropy-based Test Adaptation determines the optimal prediction modality by analyzing prediction entropy. Venus-DefakerOne2 achieves new state-of-the-art performance across a comprehensive suite of benchmarks, including DeepFake faces (96.7%), AI-generated images (93.3%), tampered documents (87.6%), manipulated natural images (89.6%), physical spoofs (93.1%), and AI-generated videos (96.0%). It significantly outperforms both specialized expert models and its predecessor, DefakerOne, establishing itself as a powerful and versatile foundation model for binary-decision forensic tasks.", "arxiv_id": "2610.37918", "arxiv_url": "https://arxiv.org/abs/2610.37918", "authors": ["Chenfan Qu", "Yachao Liang", "Mingqi Fang", "Jiangwei Xie", "Zhenming Wang", "Baoyue Zhang", "Changjiang Jiang", "Zheng Chang", "Fanli Jin", "Xuekang Zhu", "Kaiwen Feng", "Junchi Li", "Weihong Zhang", "Haoyue Wang", "Chenfeng Zhang", "Yinan Xia", "Fangming Cui", "Dong Fan", "Jingjing Liu", "Tianyi Zhang", "Luobin Chen", "Ji-Zhe Zhou", "Sheng Li", "Wei Wang", "Bin Li", "Ran He", "Xinpeng Zhang", "Linna Zhou", "Jian Liu", "Weiqiang Wang"], "brief": "\u63d0\u51fa\u7edf\u4e00\u7684\u89c6\u89c9\u9632\u4f2a\u57fa\u7840\u6a21\u578b\uff0c\u7528\u6570\u5343\u4e07\u5f00\u6e90\u53ca\u5185\u90e8\u6837\u672c\u8bad\u7ec3\u3002\u4ea4\u66ff\u8fdb\u884cLoRA\u4e0e\u5168\u53c2\u6570\u5fae\u8c03\uff0c\u5e76\u4f9d\u636e\u9884\u6d4b\u71b5\u9009\u62e9\u9884\u6d4b\u6a21\u6001\uff0c\u8986\u76d6\u56fe\u50cf\u548c\u89c6\u9891\u7684\u4e8c\u5206\u7c7b\u53d6\u8bc1\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/inclusionAI/DefakerOne2", "github_stars": 34, "hf_url": "https://huggingface.co/papers/2610.37918", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Tide-Style-Tuning\u4ea4\u66ff\u5fae\u8c03\uff0c\u517c\u987e\u6548\u7387\u4e0e\u6297\u9057\u5fd8", "\u57fa\u4e8e\u71b5\u7684\u6d4b\u8bd5\u9002\u914d\u9009\u62e9\u6700\u4f18\u9884\u6d4b\u6a21\u6001", "DeepFake\u4eba\u813896.7%\uff0cAI\u751f\u6210\u89c6\u989196.0%"], "keywords": ["\u89c6\u89c9\u53d6\u8bc1", "\u4f2a\u9020\u68c0\u6d4b", "\u57fa\u7840\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u9002\u914d"], "num_comments": 1, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2610.37918v1", "published_at": "2026-10-27", "score": 0.313, "selected_reasons": ["HF trending (19\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37918.png", "title": "Venus-DefakerOne2: A Vision-Forensics Foundation Model with Broader Coverage", "tldr": "\u7edf\u4e00\u8986\u76d6\u6570\u5b57\u7be1\u6539\u4e0e\u7269\u7406\u6b3a\u9a97\uff0c\u5728\u56fe\u50cf\u548c\u89c6\u9891\u591a\u7c7b\u53d6\u8bc1\u4efb\u52a1\u4e0a\u5237\u65b0\u6027\u80fd\u3002", "upvotes": 19, "what_it_is": "\u63d0\u51fa\u7edf\u4e00\u7684\u89c6\u89c9\u9632\u4f2a\u57fa\u7840\u6a21\u578b\uff0c\u7528\u6570\u5343\u4e07\u5f00\u6e90\u53ca\u5185\u90e8\u6837\u672c\u8bad\u7ec3\u3002\u4ea4\u66ff\u8fdb\u884cLoRA\u4e0e\u5168\u53c2\u6570\u5fae\u8c03\uff0c\u5e76\u4f9d\u636e\u9884\u6d4b\u71b5\u9009\u62e9\u9884\u6d4b\u6a21\u6001\uff0c\u8986\u76d6\u56fe\u50cf\u548c\u89c6\u9891\u7684\u4e8c\u5206\u7c7b\u53d6\u8bc1\u3002", "why_notable": "\u5c06\u901a\u5e38\u5206\u6563\u7684\u6570\u5b57\u4f2a\u9020\u4e0e\u7269\u7406\u6b3a\u9a97\u68c0\u6d4b\u7eb3\u5165\u540c\u4e00\u6a21\u578b\uff0c\u5728\u516d\u7c7b\u57fa\u51c6\u4e0a\u9886\u5148\u4e13\u7528\u6a21\u578b\uff0c\u5c55\u793a\u8de8\u5a92\u4f53\u7edf\u4e00\u53d6\u8bc1\u7684\u6f5c\u529b\u3002"}, {"abstract": "Unified Multimodal Models (UMMs) achieve remarkable success on diverse multimodal understanding and generation tasks, yet they still struggle to effectively leverage language-based chain-of-thought reasoning for image generation. As a result, existing reasoning-augmented UMMs often fail to inherit the test-time scaling and fine-grained controllability observed in large language models. We attribute this failure to a fundamental modality mismatch: reasoning is performed in a discrete token space, whereas image generation operates in a continuous space. To bridge this gap, we introduce a Latent Reasoning framework in Continuous space (LARC), which alleviates the token-level bottleneck by reasoning over continuous hidden states. Specifically, the training framework consists of two stages: (i) curriculum supervised fine-tuning (SFT), and (ii) information-gain reinforcement learning (RL). First, the curriculum SFT stage gradually converts token-level reasoning into latent reasoning. Subsequently, the information-gain RL stage self-evolves latent reasoning without ground truth supervision. Experiments across diverse text-to-image generation benchmarks show that LARC consistently improves generation quality, prompt following, and compositional fidelity. Notably, LARC achieves state-of-the-art performance on GenEval with a 7%p gain over BAGEL and demonstrates clear test-time scaling behavior, outperforming token-based generation under both parallel and sequential test-time scaling strategies.", "arxiv_id": "2610.42149", "arxiv_url": "https://arxiv.org/abs/2610.42149", "authors": ["Byungwoo Jeon", "Yoonwoo Jeong", "Hyunseok Lee", "Minsu Cho", "Jinwoo Shin"], "brief": "LARC\u5728\u8fde\u7eed\u9690\u72b6\u6001\u4e2d\u63a8\u7406\uff0c\u7f13\u89e3\u79bb\u6563\u8bed\u8a00\u63a8\u7406\u4e0e\u8fde\u7eed\u56fe\u50cf\u751f\u6210\u7684\u9519\u914d\u3002\u5148\u7528\u8bfe\u7a0b\u76d1\u7763\u5fae\u8c03\u5c06\u6587\u672c\u63a8\u7406\u9010\u6b65\u8f6c\u4e3a\u6f5c\u5728\u63a8\u7406\uff0c\u518d\u4ee5\u4fe1\u606f\u589e\u76ca\u5f3a\u5316\u5b66\u4e60\u81ea\u4e3b\u4f18\u5316\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": "https://github.com/rootyJeon/LARC", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.42149", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bfe\u7a0bSFT\u9010\u6b65\u5c06\u8bcd\u5143\u7ea7\u63a8\u7406\u8f6c\u6362\u4e3a\u8fde\u7eed\u6f5c\u5728\u63a8\u7406", "\u4fe1\u606f\u589e\u76caRL\u65e0\u9700\u771f\u503c\u76d1\u7763\u5373\u53ef\u4f18\u5316\u6f5c\u5728\u63a8\u7406", "GenEval\u8f83BAGEL\u63d0\u53477\u4e2a\u767e\u5206\u70b9\uff0c\u652f\u6301\u5e76\u884c\u4e0e\u4e32\u884c\u63a8\u7406\u6269\u5c55"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u6f5c\u5728\u63a8\u7406", "\u56fe\u50cf\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2610.42149v1", "published_at": "2026-10-30", "score": 0.304, "selected_reasons": ["HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42149.png", "title": "Latent Reasoning in Continuous Space for Unified Multimodal Models", "tldr": "\u4ee5\u8fde\u7eed\u9690\u72b6\u6001\u66ff\u4ee3\u6587\u672c\u63a8\u7406\uff0c\u8ba9\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u66f4\u7cbe\u51c6\u751f\u6210\u56fe\u50cf\u5e76\u53d7\u76ca\u4e8e\u63a8\u7406\u6269\u5c55\u3002", "upvotes": 25, "what_it_is": "LARC\u5728\u8fde\u7eed\u9690\u72b6\u6001\u4e2d\u63a8\u7406\uff0c\u7f13\u89e3\u79bb\u6563\u8bed\u8a00\u63a8\u7406\u4e0e\u8fde\u7eed\u56fe\u50cf\u751f\u6210\u7684\u9519\u914d\u3002\u5148\u7528\u8bfe\u7a0b\u76d1\u7763\u5fae\u8c03\u5c06\u6587\u672c\u63a8\u7406\u9010\u6b65\u8f6c\u4e3a\u6f5c\u5728\u63a8\u7406\uff0c\u518d\u4ee5\u4fe1\u606f\u589e\u76ca\u5f3a\u5316\u5b66\u4e60\u81ea\u4e3b\u4f18\u5316\u3002", "why_notable": "\u5c06\u63a8\u7406\u76f4\u63a5\u63a5\u5165\u56fe\u50cf\u751f\u6210\u7684\u8fde\u7eed\u7a7a\u95f4\uff0c\u540c\u65f6\u6539\u5584\u751f\u6210\u8d28\u91cf\u3001\u63d0\u793a\u9075\u5faa\u4e0e\u7ec4\u5408\u4fdd\u771f\u5ea6\uff0c\u4e3a\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u63a8\u7406\u65f6\u6269\u5c55\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Multi-agent systems (MAS) require both effective coordination and specialized task execution. Existing prompt optimization approaches typically couple these functions within agent-specific prompts. We introduce Coordinator-Executor Prompt Optimization (CEPO), a general framework for improving prompt optimization in MAS. CEPO separates system-level coordination from agent-level execution through a shared coordinator prompt and agent-specific executor prompts, and guides their updates according to their respective roles. This structure allows shared coordination rules to be refined consistently across agents while keeping execution instructions separately adjustable. CEPO provides the prompt structure and optimization guidance, while existing prompt optimizers perform the underlying search. Extensive experiments spanning 11 benchmarks across four domains demonstrate that applying CEPO to four existing prompt optimizers consistently improves their performance. Ablations and qualitative analyses support the proposed design, while controlled studies on a document-understanding MAS further demonstrate improved optimization budget efficiency and performance scaling with the number of agents.", "arxiv_id": "2610.34722", "arxiv_url": "https://arxiv.org/abs/2610.34722", "authors": ["Jongha Kim", "Seohyun Lee", "Jonathan Minho Chung", "Jinsung Yoon", "Hyunwoo J. Kim"], "brief": "CEPO\u5c06\u591a\u667a\u80fd\u4f53\u63d0\u793a\u62c6\u4e3a\u5171\u4eab\u534f\u8c03\u63d0\u793a\u4e0e\u5404\u667a\u80fd\u4f53\u4e13\u5c5e\u6267\u884c\u63d0\u793a\uff0c\u6309\u804c\u8d23\u5206\u522b\u6307\u5bfc\u66f4\u65b0\u3002\u5b83\u63d0\u4f9b\u7ed3\u6784\u4e0e\u4f18\u5316\u6307\u5bfc\uff0c\u5e95\u5c42\u641c\u7d22\u4ecd\u4ea4\u7ed9\u73b0\u6709\u63d0\u793a\u4f18\u5316\u5668\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/mlvlab/CEPO", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2610.34722", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["CEPO\u5206\u79bb\u5171\u4eab\u534f\u8c03\u89c4\u5219\u4e0e\u667a\u80fd\u4f53\u4e13\u5c5e\u6267\u884c\u6307\u4ee4", "\u8986\u76d6\u56db\u4e2a\u9886\u57df\u300111\u4e2a\u57fa\u51c6\uff0c\u63d0\u5347\u56db\u79cd\u63d0\u793a\u4f18\u5316\u5668\u8868\u73b0", "\u6587\u6863\u7406\u89e3\u5b9e\u9a8c\u663e\u793a\u9884\u7b97\u6548\u7387\u4e0e\u667a\u80fd\u4f53\u6570\u91cf\u6269\u5c55\u8868\u73b0\u6539\u5584"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u63d0\u793a\u4f18\u5316", "\u667a\u80fd\u4f53\u534f\u8c03"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34722v1", "published_at": "2026-10-26", "score": 0.284, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34722.png", "title": "CEPO: A General Framework for Improving Prompt Optimization in Multi-Agent Systems", "tldr": "\u901a\u8fc7\u62c6\u5206\u5171\u4eab\u534f\u8c03\u4e0e\u4e13\u5c5e\u6267\u884c\u63d0\u793a\uff0c\u63d0\u5347\u591a\u667a\u80fd\u4f53\u63d0\u793a\u4f18\u5316\u7684\u6548\u679c\u4e0e\u9884\u7b97\u6548\u7387\u3002", "upvotes": 20, "what_it_is": "CEPO\u5c06\u591a\u667a\u80fd\u4f53\u63d0\u793a\u62c6\u4e3a\u5171\u4eab\u534f\u8c03\u63d0\u793a\u4e0e\u5404\u667a\u80fd\u4f53\u4e13\u5c5e\u6267\u884c\u63d0\u793a\uff0c\u6309\u804c\u8d23\u5206\u522b\u6307\u5bfc\u66f4\u65b0\u3002\u5b83\u63d0\u4f9b\u7ed3\u6784\u4e0e\u4f18\u5316\u6307\u5bfc\uff0c\u5e95\u5c42\u641c\u7d22\u4ecd\u4ea4\u7ed9\u73b0\u6709\u63d0\u793a\u4f18\u5316\u5668\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u65e0\u9700\u66ff\u6362\u5e95\u5c42\u4f18\u5316\u5668\uff0c\u5c31\u80fd\u7edf\u4e00\u6539\u8fdb\u8de8\u667a\u80fd\u4f53\u534f\u8c03\u5e76\u4fdd\u7559\u6267\u884c\u6307\u4ee4\u7684\u72ec\u7acb\u8c03\u6574\uff0c\u591a\u9886\u57df\u5b9e\u9a8c\u652f\u6301\u5176\u901a\u7528\u6027\u3002"}, {"abstract": "Achieving the broad task generalization of embodied models in physical environments remains a central challenge in robot learning. We study this challenge in World Action Models (WAMs) through two complementary capabilities: video generalization, which predicts the visual evolution of new tasks, and action generalization, which translates these predictions into executable behavior through a video-to-action bridge. By varying video and action supervision for tasks outside an initial training set, we examine their respective contributions to task transfer. On RoboTwin 2.0, using only in-distribution video-action supervision yields a 25.07% success rate on out-of-distribution tasks. Introducing videos of these tasks without their action labels raises success to 55.90%, while adding just one action-labeled demonstration per task further improves it to 70.70%. These findings suggest that broader video coverage enables task transfer by leveraging existing inverse-dynamics capabilities, while even sparse action supervision further strengthens those capabilities. Guided by this perspective, we introduce WorldBridge, a WAM with separate video and action experts connected through structured attention and trained with joint flow matching. WorldBridge incorporates visual memory at two temporal scales and action forcing, alongside a unified data processing pipeline that standardizes and filters heterogeneous robot trajectories and egocentric hand-derived supervision. Across multiple manipulation benchmarks, WorldBridge achieves state-of-the-art performance among the compared methods, including 96.23% on RoboTwin 2.0 full data setting and 80.9% on clean to random setting, 82.8% on RoboCasa GR1 TableTop, and 57.6% on DOMINO Level-1. Our study highlights the complementary roles of video prediction and action grounding in developing robots that generalize across tasks.", "arxiv_id": "2610.40748", "arxiv_url": "https://arxiv.org/abs/2610.40748", "authors": ["Jun Cen", "Yubo Guo", "Hao Li", "Liangkai Li", "Yaoxu Lyu", "Meng Wei", "Zeqi Xiao", "Sizhe Yang", "Yuqiang Yang", "Yifan Ye", "Shanghang Zhang", "Duo Zheng"], "brief": "WorldBridge\u5c06\u89c6\u9891\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\u62c6\u4e3a\u72ec\u7acb\u4e13\u5bb6\uff0c\u4ee5\u7ed3\u6784\u5316\u6ce8\u610f\u529b\u8fde\u63a5\uff0c\u5e76\u7528\u8054\u5408\u6d41\u5339\u914d\u8bad\u7ec3\uff1b\u7ed3\u5408\u53cc\u65f6\u95f4\u5c3a\u5ea6\u89c6\u89c9\u8bb0\u5fc6\u4e0e\u52a8\u4f5c\u5f3a\u5236\u673a\u5236\uff0c\u589e\u5f3a\u8de8\u4efb\u52a1\u64cd\u4f5c\u80fd\u529b\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40748", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u65b0\u4efb\u52a1\u4ec5\u52a0\u89c6\u9891\uff0c\u6210\u529f\u7387\u4ece25.07%\u5347\u81f355.90%", "\u6bcf\u4e2a\u65b0\u4efb\u52a1\u518d\u52a01\u6761\u52a8\u4f5c\u6807\u6ce8\u793a\u8303\uff0c\u6210\u529f\u7387\u8fbe70.70%", "RoboTwin 2.0\u5168\u6570\u636e\u8bbe\u7f6e\u6210\u529f\u738796.23%"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u4e16\u754c\u6a21\u578b", "\u4efb\u52a1\u6cdb\u5316", "\u6d41\u5339\u914d"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.40748v1", "published_at": "2026-10-29", "score": 0.271, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40748.png", "title": "WorldBridge: Bridging Video and Action for Task Generalization in World Action Models", "tldr": "\u901a\u8fc7\u89c6\u9891\u4e0e\u52a8\u4f5c\u4e13\u5bb6\u534f\u540c\u5efa\u6a21\uff0c\u673a\u5668\u4eba\u53ef\u501f\u52a9\u65e0\u52a8\u4f5c\u6807\u7b7e\u89c6\u9891\u8fc1\u79fb\u5230\u65b0\u4efb\u52a1\u3002", "upvotes": 12, "what_it_is": "WorldBridge\u5c06\u89c6\u9891\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\u62c6\u4e3a\u72ec\u7acb\u4e13\u5bb6\uff0c\u4ee5\u7ed3\u6784\u5316\u6ce8\u610f\u529b\u8fde\u63a5\uff0c\u5e76\u7528\u8054\u5408\u6d41\u5339\u914d\u8bad\u7ec3\uff1b\u7ed3\u5408\u53cc\u65f6\u95f4\u5c3a\u5ea6\u89c6\u89c9\u8bb0\u5fc6\u4e0e\u52a8\u4f5c\u5f3a\u5236\u673a\u5236\uff0c\u589e\u5f3a\u8de8\u4efb\u52a1\u64cd\u4f5c\u80fd\u529b\u3002", "why_notable": "\u5b9e\u9a8c\u91cf\u5316\u4e86\u89c6\u9891\u8986\u76d6\u4e0e\u7a00\u758f\u52a8\u4f5c\u76d1\u7763\u7684\u4e92\u8865\u4ef7\u503c\uff0c\u4e3a\u964d\u4f4e\u65b0\u4efb\u52a1\u52a8\u4f5c\u6807\u6ce8\u6210\u672c\u63d0\u4f9b\u4e86\u4f9d\u636e\uff0c\u5e76\u5728\u591a\u4e2a\u64cd\u4f5c\u57fa\u51c6\u4e0a\u53d6\u5f97\u9886\u5148\u8868\u73b0\u3002"}, {"abstract": "On-policy reinforcement learning for large language models assumes that training responses are sampled from the current policy. In practice, an inference engine samples the responses and a separate trainer computes the gradients, and the \\textbf{training-inference mismatch} between the two makes the training data off-policy. The mismatch has two sources, the numerics of the engine and the stale weights of asynchronous sampling, and a correction that stabilizes training under one source can fail under the other. \\textit{We ask which property of a mismatch source decides the correction it needs.} Evaluating the trainer at the sampler\u0027s weights splits each sampled-token error exactly into a \\textit{numerical discrepancy} of the engine and a \\textit{policy lag} of the trainer, and we follow both through training. The numerical discrepancy stays approximately constant, so it biases the updates by a nearly fixed amount, and centering the score at each prefix removes its leading bias. The policy lag is produced by the trainer\u0027s own updates: the bias it leaves enters the next update, which enlarges the next lag and closes a feedback loop. Importance weighting cuts this loop only while the lag ratio stays concentrated, and on Qwen3-1.7B it fails at the step where the effective sample size of the ratio falls below one half. From this account we derive the \\textbf{discrepancy-lag correction} (DLC), which centers the numerical discrepancy, clips the lag ratio against the sampler\u0027s weights and resynchronizes the sampler when this effective sample size falls below one half. Under a stale sampler, DLC keeps the KL divergence from on-policy training within twice the KL between two independent on-policy trainings on Qwen3-0.6B and Qwen3-1.7B, and its resynchronization prevents collapses that the per-token corrections leave and that a KL measured on the sampler\u0027s prefixes does not detect.", "arxiv_id": "2610.40945", "arxiv_url": "https://arxiv.org/abs/2610.40945", "authors": ["Yu Li", "Yufa Zhou", "Tian Lan"], "brief": "\u7814\u7a76\u5c06\u91c7\u6837\u8bcd\u5143\u8bef\u5dee\u7cbe\u786e\u62c6\u4e3a\u5f15\u64ce\u6570\u503c\u504f\u5dee\u4e0e\u8bad\u7ec3\u5668\u7b56\u7565\u6ede\u540e\uff0c\u63d0\u51faDLC\uff1a\u5206\u522b\u4e2d\u5fc3\u5316\u504f\u5dee\u3001\u88c1\u526a\u6ede\u540e\u6bd4\u7387\uff0c\u5e76\u6309\u6709\u6548\u6837\u672c\u91cf\u89e6\u53d1\u91c7\u6837\u5668\u6743\u91cd\u540c\u6b65\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/Skylanding/Training-Inference-Mismatch", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.40945", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6570\u503c\u504f\u5dee\u8fd1\u4f3c\u6052\u5b9a\uff0c\u7b56\u7565\u6ede\u540e\u5f62\u6210\u66f4\u65b0\u53cd\u9988\u73af\u3002", "DLC\u5728\u6709\u6548\u6837\u672c\u91cf\u4f4e\u4e8e\u4e00\u534a\u65f6\u540c\u6b65\u91c7\u6837\u5668\u3002", "\u4e24\u6b3eQwen3\u6a21\u578b\u4e2d\uff0c\u504f\u79bb\u540c\u7b56\u7565\u8bad\u7ec3\u7684KL\u4e0d\u8d85\u57fa\u7ebf\u4e24\u500d\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f02\u6b65\u8bad\u7ec3", "\u91cd\u8981\u6027\u52a0\u6743"], "num_comments": 1, "on_hf": true, "organization": "George Washington University", "pdf_url": "https://arxiv.org/pdf/2610.40945v1", "published_at": "2026-10-29", "score": 0.271, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40945.png", "title": "On the Origin and Evolution of Training-Inference Mismatch in LLM Reinforcement Learning", "tldr": "\u5c06\u8bad\u7ec3\u63a8\u7406\u5931\u914d\u62c6\u4e3a\u6570\u503c\u504f\u5dee\u4e0e\u7b56\u7565\u6ede\u540e\uff0c\u9488\u5bf9\u6027\u6821\u6b63\u4ee5\u7a33\u5b9a\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u3002", "upvotes": 8, "what_it_is": "\u7814\u7a76\u5c06\u91c7\u6837\u8bcd\u5143\u8bef\u5dee\u7cbe\u786e\u62c6\u4e3a\u5f15\u64ce\u6570\u503c\u504f\u5dee\u4e0e\u8bad\u7ec3\u5668\u7b56\u7565\u6ede\u540e\uff0c\u63d0\u51faDLC\uff1a\u5206\u522b\u4e2d\u5fc3\u5316\u504f\u5dee\u3001\u88c1\u526a\u6ede\u540e\u6bd4\u7387\uff0c\u5e76\u6309\u6709\u6548\u6837\u672c\u91cf\u89e6\u53d1\u91c7\u6837\u5668\u6743\u91cd\u540c\u6b65\u3002", "why_notable": "\u63ed\u793a\u4e0d\u540c\u5931\u914d\u6765\u6e90\u4e3a\u4f55\u9700\u8981\u4e0d\u540c\u6821\u6b63\uff0c\u7ed9\u51fa\u53ef\u64cd\u4f5c\u7684\u540c\u6b65\u89e6\u53d1\u6307\u6807\uff1b\u8fd8\u80fd\u9632\u6b62\u9010\u8bcd\u5143\u6821\u6b63\u9057\u7559\u3001\u91c7\u6837\u524d\u7f00KL\u672a\u80fd\u5bdf\u89c9\u7684\u8bad\u7ec3\u5d29\u6e83\u3002"}, {"abstract": "An action seen once and the same action seen three times receive the same action-recognition label, so that supervision does not require a model to count. Answers shared across histories that differ in event order, accumulation, or relations leave those distinctions unconstrained; we call this state under-specification. Visible-State Supervision (ViSS) addresses it by training on source-grounded probes of event identity, order, accumulation, relation change, and answer sufficiency; under the same recent-frame interface it improves OVO-Bench over a strict-matched generic temporal supervision baseline while remaining comparable on StreamingBench, with the largest gain in hallucination detection. Test-Time Causal View Search (TVS) then adapts evidence access while keeping the learned model fixed, expanding from recent frames to sparse event and compact history views on demand. The two interventions separate representation from view selection: supervision particularly benefits hallucination detection and causal reasoning, access particularly benefits event recall and forward reasoning. Together they reach the best reported accuracy among the published systems compared here on StreamingBench and OVO-Bench at a fraction of the processed frames of exhaustive selection, and strict replay shows that most of the remaining gap to a three-view oracle is a correct answer that was later replaced. Streaming accuracy depends on what supervision asks the model to keep, what evidence inference exposes, and whether the model keeps a correct answer once it has one.", "arxiv_id": "2610.34926", "arxiv_url": "https://arxiv.org/abs/2610.34926", "authors": ["Yihao Hu", "Pan Wang", "Yitong Lin", "Zhihao Wen", "Deyuan Liu", "Hang Wang", "Mingda Wan", "Yiwen Zhao", "Yutong Li", "Yuchen Mao", "Tao Lin"], "brief": "\u63d0\u51fa\u53ef\u89c1\u72b6\u6001\u76d1\u7763ViSS\uff0c\u7528\u4e8b\u4ef6\u987a\u5e8f\u3001\u7d2f\u79ef\u4e0e\u5173\u7cfb\u53d8\u5316\u7b49\u63a2\u9488\u8bad\u7ec3\u6a21\u578b\uff1b\u518d\u4ee5TVS\u5728\u63a8\u7406\u65f6\u6309\u9700\u6269\u5c55\u89c6\u9891\u89c6\u56fe\uff0c\u5c06\u8868\u5f81\u5b66\u4e60\u4e0e\u8bc1\u636e\u9009\u62e9\u5206\u5f00\u4f18\u5316\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/yihaohu0118/ViSS", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.34926", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["ViSS\u4ee5\u6e90\u89c6\u9891\u4e3a\u4f9d\u636e\uff0c\u76d1\u7763\u4e8b\u4ef6\u8eab\u4efd\u3001\u987a\u5e8f\u548c\u7d2f\u79ef\u7b49\u72b6\u6001", "TVS\u56fa\u5b9a\u6a21\u578b\uff0c\u6309\u9700\u641c\u7d22\u8fd1\u671f\u5e27\u3001\u7a00\u758f\u4e8b\u4ef6\u4e0e\u7d27\u51d1\u5386\u53f2\u89c6\u56fe", "\u4e24\u8005\u7ed3\u5408\u5728StreamingBench\u4e0eOVO-Bench\u5747\u9886\u5148\u6240\u6bd4\u5df2\u53d1\u8868\u7cfb\u7edf"], "keywords": ["\u6d41\u5f0f\u89c6\u9891\u7406\u89e3", "\u76d1\u7763\u5b66\u4e60", "\u8bc1\u636e\u9009\u62e9", "\u5e7b\u89c9\u68c0\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "LINs lab", "pdf_url": "https://arxiv.org/pdf/2610.34926v1", "published_at": "2026-10-26", "score": 0.266, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34926.png", "title": "Supervising the Visible State: Separating Representation from View Selection in Streaming Video", "tldr": "\u901a\u8fc7\u53ef\u89c1\u72b6\u6001\u76d1\u7763\u4e0e\u6309\u9700\u8bc1\u636e\u641c\u7d22\uff0c\u63d0\u5347\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u51c6\u786e\u7387\u5e76\u51cf\u5c11\u5904\u7406\u5e27\u6570\u3002", "upvotes": 5, "what_it_is": "\u63d0\u51fa\u53ef\u89c1\u72b6\u6001\u76d1\u7763ViSS\uff0c\u7528\u4e8b\u4ef6\u987a\u5e8f\u3001\u7d2f\u79ef\u4e0e\u5173\u7cfb\u53d8\u5316\u7b49\u63a2\u9488\u8bad\u7ec3\u6a21\u578b\uff1b\u518d\u4ee5TVS\u5728\u63a8\u7406\u65f6\u6309\u9700\u6269\u5c55\u89c6\u9891\u89c6\u56fe\uff0c\u5c06\u8868\u5f81\u5b66\u4e60\u4e0e\u8bc1\u636e\u9009\u62e9\u5206\u5f00\u4f18\u5316\u3002", "why_notable": "\u63ed\u793a\u76d1\u7763\u76ee\u6807\u4e0e\u8bc1\u636e\u8bbf\u95ee\u5206\u522b\u5f71\u54cd\u4e0d\u540c\u63a8\u7406\u80fd\u529b\uff0c\u4ee5\u66f4\u5c11\u5904\u7406\u5e27\u53d6\u5f97\u9886\u5148\u8868\u73b0\uff1b\u56de\u653e\u8fd8\u53d1\u73b0\uff0c\u5269\u4f59\u8bef\u5dee\u591a\u6e90\u4e8e\u6b63\u786e\u7b54\u6848\u88ab\u540e\u7eed\u66ff\u6362\u3002"}, {"abstract": "Vision-Language-Action (VLA) models have demonstrated promising capabilities in robotic manipulation by integrating visual perception, language understanding, and action generation. Recent advances have further incorporated future prediction to enhance the understanding of environmental dynamics and task progression. However, existing methods often model short-term dynamics and long-term task objectives separately, while directly incorporating predicted futures into action policies without sufficiently considering their relevance to current action requirements. To address these limitations, we propose HiFOR, a hierarchical foresight framework with action-guided world retrieval. Specifically, Hierarchical Foresight Prediction jointly predicts short-term state evolution, semantic milestones, and final goal states through a Hierarchical Dependency Mask (HDM), establishing dependencies across temporal horizons. Building upon these predictions, Structure-Aware Latent World Modeling organizes future latent representations along the horizon, view, and spatial dimensions to facilitate fine-grained retrieval. Furthermore, Action-Guided Factorized World Retrieval adaptively retrieves relevant future information from the structured latent world based on evolving action representations during denoising, providing targeted guidance for action generation. Extensive experiments on two simulation benchmarks and six real-world robotic manipulation tasks demonstrate the effectiveness of our approach.", "arxiv_id": "2610.40373", "arxiv_url": "https://arxiv.org/abs/2610.40373", "authors": ["Rongxing Ding", "Hongyu Qu", "Kehong Wu", "Xudong Wang", "Fan Zhang", "Xinguang Xiang", "Xiangbo Shu"], "brief": "HiFOR\u5c06\u77ed\u671f\u72b6\u6001\u3001\u8bed\u4e49\u91cc\u7a0b\u7891\u4e0e\u6700\u7ec8\u76ee\u6807\u8054\u5408\u9884\u6d4b\uff0c\u6784\u5efa\u7ed3\u6784\u5316\u672a\u6765\u6f5c\u5728\u4e16\u754c\uff1b\u518d\u4f9d\u636e\u53bb\u566a\u4e2d\u7684\u52a8\u4f5c\u8868\u793a\uff0c\u68c0\u7d22\u76f8\u5173\u672a\u6765\u4fe1\u606f\u4ee5\u6307\u5bfc\u52a8\u4f5c\u751f\u6210\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40373", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["HDM\u5efa\u7acb\u77ed\u671f\u72b6\u6001\u3001\u8bed\u4e49\u91cc\u7a0b\u7891\u4e0e\u76ee\u6807\u95f4\u4f9d\u8d56", "\u6f5c\u5728\u4e16\u754c\u6309\u65f6\u95f4\u8de8\u5ea6\u3001\u89c6\u89d2\u548c\u7a7a\u95f4\u7ef4\u5ea6\u7ec4\u7ec7", "\u52a8\u4f5c\u5f15\u5bfc\u68c0\u7d22\uff0c\u57282\u4e2a\u4eff\u771f\u57fa\u51c6\u53ca6\u9879\u5b9e\u673a\u4efb\u52a1\u9a8c\u8bc1"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u672a\u6765\u9884\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.40373v1", "published_at": "2026-10-29", "score": 0.265, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40373.png", "title": "HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model", "tldr": "\u901a\u8fc7\u5206\u5c42\u9884\u6d4b\u672a\u6765\u5e76\u6309\u5f53\u524d\u52a8\u4f5c\u9700\u6c42\u68c0\u7d22\u4fe1\u606f\uff0c\u63d0\u5347\u673a\u5668\u4eba\u64cd\u4f5c\u51b3\u7b56\u3002", "upvotes": 23, "what_it_is": "HiFOR\u5c06\u77ed\u671f\u72b6\u6001\u3001\u8bed\u4e49\u91cc\u7a0b\u7891\u4e0e\u6700\u7ec8\u76ee\u6807\u8054\u5408\u9884\u6d4b\uff0c\u6784\u5efa\u7ed3\u6784\u5316\u672a\u6765\u6f5c\u5728\u4e16\u754c\uff1b\u518d\u4f9d\u636e\u53bb\u566a\u4e2d\u7684\u52a8\u4f5c\u8868\u793a\uff0c\u68c0\u7d22\u76f8\u5173\u672a\u6765\u4fe1\u606f\u4ee5\u6307\u5bfc\u52a8\u4f5c\u751f\u6210\u3002", "why_notable": "\u628a\u8de8\u65f6\u95f4\u5c3a\u5ea6\u9884\u6d4b\u4e0e\u52a8\u4f5c\u76f8\u5173\u6027\u7b5b\u9009\u8fde\u63a5\u8d77\u6765\uff0c\u4f7f\u672a\u6765\u4fe1\u606f\u66f4\u6709\u9488\u5bf9\u6027\u5730\u670d\u52a1\u63a7\u5236\uff0c\u5e76\u901a\u8fc7\u4eff\u771f\u4e0e\u5b9e\u673a\u64cd\u4f5c\u9a8c\u8bc1\u6709\u6548\u6027\u3002"}, {"abstract": "To succeed in real-world long-horizon software development, coding agents must satisfy multi-dimensional task specifications, such as interface compatibility and error handling, and do so without breaking existing dependencies. However, current works lack specification in both quantity and diversity, often emphasizing primary goals while ignoring complex constraints. Synthesizing tasks to bridge this gap presents two challenges: naively adding specifications risks reducing tasks to trivial checklists rather than compelling joint reasoning, and verifying these subtle interactions risks overlooking hidden flaws or rejecting valid alternatives. To address these challenges, we introduce CodeSpecWeave, a framework for synthesizing tasks with rich, interdependent specifications. Grounded in real developer seeds, a synthesis agent iteratively develops both coupled task requirements and executable tests, while a review agent audits solution trajectories from multiple models to guarantee test reliability. Using this pipeline, we construct 4,670 training tasks across 2,865 repositories. Applying Reinforcement learning on these tasks significantly improves performance over the base model on DeepSWE-v1.1, largely outperforming existing baselines. Furthermore, we curate CodeSpecWeave-Bench, a rigorous benchmark comprising 100 tasks and 1,044 specifications, which clearly separates frontier models and reveals significant headroom in handling interdependent engineering constraints.", "arxiv_id": "2610.40256", "arxiv_url": "https://arxiv.org/abs/2610.40256", "authors": ["Yishuo Cai", "Minzheng Wang", "Liang Zhao", "Linghao Zhang", "Lei Li", "Shicheng Li", "Xu Sun", "Fuli Luo"], "brief": "CodeSpecWeave\u4ece\u771f\u5b9e\u5f00\u53d1\u4efb\u52a1\u51fa\u53d1\uff0c\u7531\u5408\u6210\u667a\u80fd\u4f53\u8fed\u4ee3\u751f\u6210\u8026\u5408\u9700\u6c42\u548c\u53ef\u6267\u884c\u6d4b\u8bd5\uff0c\u518d\u7531\u5ba1\u67e5\u667a\u80fd\u4f53\u6838\u9a8c\u591a\u6a21\u578b\u89e3\u9898\u8f68\u8ff9\uff0c\u6784\u5efa\u8bad\u7ec3\u96c6\u4e0e\u8bc4\u6d4b\u96c6\u3002", "categories": ["cs.SE", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40256", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5408\u6210\u4e0e\u5ba1\u67e5\u53cc\u667a\u80fd\u4f53\u534f\u4f5c\uff0c\u6821\u9a8c\u8026\u5408\u9700\u6c42\u53ca\u6d4b\u8bd5", "\u8bad\u7ec3\u96c6\u542b4,670\u4e2a\u4efb\u52a1\uff0c\u8986\u76d62,865\u4e2a\u4ed3\u5e93", "\u57fa\u51c6\u542b100\u4e2a\u4efb\u52a1\u30011,044\u9879\u89c4\u683c\u8981\u6c42"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u9700\u6c42\u7ea6\u675f", "\u5f3a\u5316\u5b66\u4e60", "\u8f6f\u4ef6\u6d4b\u8bd5"], "num_comments": 2, "on_hf": true, "organization": "Xiaomi MiMo", "pdf_url": "https://arxiv.org/pdf/2610.40256v1", "published_at": "2026-10-29", "score": 0.264, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbna scores are open.", "arxiv_id": "2610.40727", "arxiv_url": "https://arxiv.org/abs/2610.40727", "authors": ["Arbaz Siddiqui"], "brief": "VoxLock\u5fae\u8c03\u56e0\u679c\u76ee\u6807\u8bf4\u8bdd\u4eba\u63d0\u53d6\u6a21\u578bREAL-TSE\uff0c\u7528\u901a\u8bdd\u5185\u622a\u53d6\u7684\u8bed\u97f3\u4f5c\u4e3a\u76ee\u6807\u6837\u672c\uff0c\u65e0\u9700\u5355\u72ec\u6ce8\u518c\u3002\u4ee5\u771f\u5b9e\u5f55\u97f3\u7684\u8f6c\u5199\u9519\u8bef\u7387\u8bc4\u4f30\u8fc7\u6ee4\u6548\u679c\u3002", "categories": ["eess.AS"], "github_repo": "https://github.com/arbazsiddiqui/voxlock", "github_stars": 88, "hf_url": "https://huggingface.co/papers/2610.40727", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5355GPU\u5fae\u8c032700\u4e07\u53c2\u6570REAL-TSE", "265\u6bb5Krisp\u5f55\u97f3\u4e0aWER\u4ece23.21%\u964d\u81f34.95%", "8\u4f4d\u6a21\u578b\u5360\u5355CPU\u7ebf\u7a0b77%\uff0c\u7b97\u6cd5\u5ef6\u8fdf24\u6beb\u79d2"], "keywords": ["\u76ee\u6807\u8bf4\u8bdd\u4eba\u63d0\u53d6", "\u8bed\u97f3\u8bc6\u522b", "\u8bed\u97f3\u667a\u80fd\u4f53", "\u6a21\u578b\u91cf\u5316"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.40727v1", "published_at": "2026-10-29", "score": 0.259, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40727.png", "title": "VoxLock: Target-Speaker Extraction for Voice Agents Without an Enrollment Step", "tldr": "\u4ece\u901a\u8bdd\u4e2d\u76f4\u63a5\u622a\u53d6\u58f0\u7eb9\u6837\u672c\uff0c\u65e0\u9700\u9884\u6ce8\u518c\u5373\u53ef\u4f4e\u5ef6\u8fdf\u8fc7\u6ee4\u975e\u76ee\u6807\u8bf4\u8bdd\u4eba\u3002", "upvotes": 3, "what_it_is": "VoxLock\u5fae\u8c03\u56e0\u679c\u76ee\u6807\u8bf4\u8bdd\u4eba\u63d0\u53d6\u6a21\u578bREAL-TSE\uff0c\u7528\u901a\u8bdd\u5185\u622a\u53d6\u7684\u8bed\u97f3\u4f5c\u4e3a\u76ee\u6807\u6837\u672c\uff0c\u65e0\u9700\u5355\u72ec\u6ce8\u518c\u3002\u4ee5\u771f\u5b9e\u5f55\u97f3\u7684\u8f6c\u5199\u9519\u8bef\u7387\u8bc4\u4f30\u8fc7\u6ee4\u6548\u679c\u3002", "why_notable": "\u628a\u514d\u6ce8\u518c\u7684\u8bf4\u8bdd\u4eba\u8fc7\u6ee4\u505a\u5230\u4e86\u4f4e\u5ef6\u8fdfCPU\u90e8\u7f72\uff1b85\u5206\u949f\u7eaf\u80cc\u666f\u8bed\u97f3\u4ec5\u6f0f\u51659\u4e2a\u8bcd\uff0c\u6a21\u578b\u3001\u4ee3\u7801\u4e0e\u9010\u6587\u4ef6\u8bc4\u5206\u5747\u5df2\u5f00\u653e\u3002"}, {"abstract": "Recent work shows that a frozen robot policy performs far better inside an agent harness, where control code decides when to query the policy, consult vision tools, or command the arm directly. Yet today these harnesses are built by hand and redesigned for each new robot or benchmark. We show that harness design can be automated, offering a strong alternative to finetuning on a novel setup. In RoboArchitect, a coding model observes a robot\u0027s rollouts, diagnoses failures, and iteratively revises the harness around the frozen policy. The harness evolves on a set of episodes for its optimization and is evaluated on held-out scenes and tasks. Without updating any model weights, RoboArchitect raises average success from 9.7% to 43.3% on unseen scenes (4.5x) and from 12.7% to 40.2% on unseen tasks (3.2x), across multiple benchmarks and policies. The gains are largest where the benchmark is far from the policy\u0027s training data: wrapping a general-purpose policy, the evolved harness yields a specialist that often outperforms even the finetuned version. Intuitive control strategies are automatically designed, such as lifting a jammed arm clear or reaching in horizontally when an obstacle blocks the way from above. The harness also evolves its own persistent memory, carrying learned experience, such as effective grasp depths, into later decisions. These results suggest that substantial headroom in robotic manipulation lies in the agent harness, and its design can be effectively automated and optimized without weight updates.", "arxiv_id": "2610.42141", "arxiv_url": "https://arxiv.org/abs/2610.42141", "authors": ["Shengguang Wu", "Suning Huang", "Cherie Ho", "Ria Doshi", "Hao Zhu", "Serena Yeung-Levy"], "brief": "RoboArchitect\u8ba9\u4ee3\u7801\u6a21\u578b\u89c2\u5bdf\u673a\u5668\u4eba\u6267\u884c\u8f68\u8ff9\u3001\u8bca\u65ad\u5931\u8d25\uff0c\u8fed\u4ee3\u4fee\u6539\u51bb\u7ed3\u7b56\u7565\u5916\u56f4\u7684\u63a7\u5236\u6846\u67b6\uff0c\u5e76\u81ea\u52a8\u6784\u5efa\u6301\u4e45\u8bb0\u5fc6\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": "https://github.com/roboarchitect-ai/RoboArchitect", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.42141", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4ee3\u7801\u6a21\u578b\u8fed\u4ee3\u4fee\u6539\u63a7\u5236\u6846\u67b6\uff0c\u534f\u8c03\u7b56\u7565\u3001\u89c6\u89c9\u5de5\u5177\u4e0e\u673a\u68b0\u81c2", "\u672a\u89c1\u573a\u666f\u6210\u529f\u73879.7%\u219243.3%\uff0c\u4efb\u52a112.7%\u219240.2%", "\u81ea\u52a8\u6f14\u5316\u6301\u4e45\u8bb0\u5fc6\uff0c\u5c06\u6709\u6548\u6293\u53d6\u6df1\u5ea6\u7b49\u7ecf\u9a8c\u7528\u4e8e\u540e\u7eed\u51b3\u7b56"], "keywords": ["\u673a\u5668\u4eba\u64cd\u63a7", "\u667a\u80fd\u4f53", "\u81ea\u52a8\u7f16\u7a0b", "\u6301\u4e45\u8bb0\u5fc6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.42141v1", "published_at": "2026-10-30", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42141.png", "title": "RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory", "tldr": "\u901a\u8fc7\u81ea\u52a8\u6539\u5199\u63a7\u5236\u6846\u67b6\u4e0e\u79ef\u7d2f\u6301\u4e45\u8bb0\u5fc6\uff0c\u51bb\u7ed3\u673a\u5668\u4eba\u7b56\u7565\u4e5f\u80fd\u663e\u8457\u63d0\u5347\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 5, "what_it_is": "RoboArchitect\u8ba9\u4ee3\u7801\u6a21\u578b\u89c2\u5bdf\u673a\u5668\u4eba\u6267\u884c\u8f68\u8ff9\u3001\u8bca\u65ad\u5931\u8d25\uff0c\u8fed\u4ee3\u4fee\u6539\u51bb\u7ed3\u7b56\u7565\u5916\u56f4\u7684\u63a7\u5236\u6846\u67b6\uff0c\u5e76\u81ea\u52a8\u6784\u5efa\u6301\u4e45\u8bb0\u5fc6\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u3002", "why_notable": "\u5b83\u5c06\u673a\u5668\u4eba\u9002\u914d\u7684\u4f18\u5316\u5bf9\u8c61\u4ece\u6a21\u578b\u6743\u91cd\u8f6c\u5411\u63a7\u5236\u6846\u67b6\uff1b\u8de8\u57fa\u51c6\u7ed3\u679c\u8868\u660e\uff0c\u8fd9\u6761\u8def\u7ebf\u53ef\u663e\u8457\u6539\u5584\u6cdb\u5316\uff0c\u90e8\u5206\u60c5\u51b5\u4e0b\u8d85\u8fc7\u5fae\u8c03\u7248\u672c\u3002"}, {"abstract": "Large language model agents are increasingly used for scientific discovery. However, existing benchmarks mix law inference with programming, score data fitting instead of prediction on unseen inputs, and do not separate empirical evidence from pretrained priors. We introduce SciGame, a controlled benchmark that converts scientific literature into structured scientific cards. Each card yields a pair of Original and dimensionally consistent Counterfactual environments with the same task interface. SciGame contains a Historical collection of canonical laws and a live Temporal collection curated from papers published after model knowledge cutoffs. It evaluates agents in candidate-guided Identification and open-ended Discovery settings. Each setting runs under Prior-only, Fixed, and Adaptive protocols. Experiments on five frontier models yield three findings. First, familiar priors hurt performance once the governing relation is altered. Second, adaptive experimentation helps the strongest models but harms weaker ones under limited budgets. Third, good explanations can hide quantitative failures. Recovering the exact symbolic form remains the main bottleneck, even when agents interpret evidence correctly. Current agents can investigate systems actively, but inducing exact laws in unfamiliar settings remains an open challenge.", "arxiv_id": "2610.37919", "arxiv_url": "https://arxiv.org/abs/2610.37919", "authors": ["Yusheng Zhao", "Bowei He", "Xue Liu", "Mingxiao Li"], "brief": "\u5c06\u79d1\u5b66\u6587\u732e\u8f6c\u4e3a\u7ed3\u6784\u5316\u79d1\u5b66\u5361\u7247\uff0c\u6784\u5efa\u63a5\u53e3\u76f8\u540c\u3001\u91cf\u7eb2\u4e00\u81f4\u7684\u539f\u59cb\u4e0e\u53cd\u4e8b\u5b9e\u73af\u5883\u3002\u901a\u8fc7\u5019\u9009\u8bc6\u522b\u548c\u5f00\u653e\u53d1\u73b0\u4efb\u52a1\uff0c\u533a\u5206\u9884\u8bad\u7ec3\u5148\u9a8c\u3001\u5b9e\u9a8c\u8bc1\u636e\u4e0e\u4e3b\u52a8\u63a2\u7d22\u7684\u8d21\u732e\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/yushengzh/scigame", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.37919", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["Historical\u4e0eTemporal\u96c6\u5408\u8986\u76d6\u7ecf\u5178\u89c4\u5f8b\u53ca\u77e5\u8bc6\u622a\u6b62\u540e\u8bba\u6587", "\u8bbe\u7f6ePrior-only\u3001Fixed\u3001Adaptive\u4e09\u79cd\u534f\u8bae", "\u6d4b\u8bd55\u4e2a\u524d\u6cbf\u6a21\u578b\uff0c\u7cbe\u786e\u7b26\u53f7\u5f62\u5f0f\u6062\u590d\u4ecd\u662f\u4e3b\u8981\u74f6\u9888"], "keywords": ["\u79d1\u5b66\u53d1\u73b0", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u53cd\u4e8b\u5b9e\u73af\u5883", "\u7b26\u53f7\u63a8\u65ad"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37919v1", "published_at": "2026-10-27", "score": 0.253, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37919.png", "title": "SciGame: Let Agents Play the Scientific Discovery Games in the Real and Counterfactual World", "tldr": "SciGame\u4ee5\u771f\u5b9e\u4e0e\u53cd\u4e8b\u5b9e\u79d1\u5b66\u73af\u5883\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u80fd\u5426\u6446\u8131\u5148\u9a8c\u5e76\u53d1\u73b0\u7cbe\u786e\u89c4\u5f8b\u3002", "upvotes": 3, "what_it_is": "\u5c06\u79d1\u5b66\u6587\u732e\u8f6c\u4e3a\u7ed3\u6784\u5316\u79d1\u5b66\u5361\u7247\uff0c\u6784\u5efa\u63a5\u53e3\u76f8\u540c\u3001\u91cf\u7eb2\u4e00\u81f4\u7684\u539f\u59cb\u4e0e\u53cd\u4e8b\u5b9e\u73af\u5883\u3002\u901a\u8fc7\u5019\u9009\u8bc6\u522b\u548c\u5f00\u653e\u53d1\u73b0\u4efb\u52a1\uff0c\u533a\u5206\u9884\u8bad\u7ec3\u5148\u9a8c\u3001\u5b9e\u9a8c\u8bc1\u636e\u4e0e\u4e3b\u52a8\u63a2\u7d22\u7684\u8d21\u732e\u3002", "why_notable": "\u5b83\u5c06\u79d1\u5b66\u63a8\u65ad\u4e0e\u7f16\u7a0b\u3001\u6570\u636e\u62df\u5408\u89e3\u8026\uff0c\u68c0\u9a8c\u672a\u89c1\u8f93\u5165\u4e0a\u7684\u9884\u6d4b\u80fd\u529b\uff1b\u7ed3\u679c\u63ed\u793a\u719f\u6089\u5148\u9a8c\u53ef\u80fd\u8bef\u5bfc\u53d1\u73b0\uff0c\u6d41\u7545\u89e3\u91ca\u4e5f\u4f1a\u63a9\u76d6\u5b9a\u91cf\u5931\u8d25\u3002"}, {"abstract": "An observer sees only part of the surrounding world, yet must keep track of what lies beyond the current view. Spatial perception therefore involves more than recognizing individual images: it calls for a persistent spatial state that is updated under self-motion and used to guide action. Do visual foundation models provide representations that support such a state? We study this question through four levels of spatial capability---spatial structure, object persistence, predictive spatial update, and actionability---using frozen-feature probes on ten representations under streaming egocentric observations of static indoor environments. The resulting capability profiles vary across tasks, network layers, and prefix lengths: strong readout of the visible scene does not ensure accurate object persistence or future-feature retrieval. Matched controls separate readout accuracy from reliance on visual history and motion. Native future prediction retains recoverable spatial structure, but a spatial reader trained on real features does not transfer to predicted features unchanged. Finally, goal-dependent candidate selection does not establish reliable continuous action utility: predicted actions respond to goal changes, yet supplying the correct goal does not reliably improve progress. Across the four levels, object persistence and actionability build on camera-pose readout, whereas feature prediction builds on visible-scene readout. Together, these findings motivate evaluating spatial representations not only by what can be decoded from them, but by whether that information is maintained beyond observation, updated predictively, and used for goal-directed action.", "arxiv_id": "2610.40636", "arxiv_url": "https://arxiv.org/abs/2610.40636", "authors": ["Baiqiao Yin", "Zhongang Cai", "Ruisi Wang", "Qiwei Liang", "Lei Yang", "Ziwei Liu"], "brief": "\u7814\u7a76\u4ee5\u9759\u6001\u5ba4\u5185\u73af\u5883\u7684\u6d41\u5f0f\u7b2c\u4e00\u89c6\u89d2\u89c2\u6d4b\uff0c\u5bf9\u5341\u79cd\u8868\u5f81\u8fdb\u884c\u51bb\u7ed3\u7279\u5f81\u63a2\u6d4b\u3002\u4ece\u7a7a\u95f4\u7ed3\u6784\u3001\u7269\u4f53\u6301\u7eed\u6027\u3001\u9884\u6d4b\u6027\u7a7a\u95f4\u66f4\u65b0\u548c\u884c\u52a8\u53ef\u7528\u6027\u56db\u5c42\u8bc4\u4f30\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40636", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5341\u79cd\u8868\u5f81\u7684\u80fd\u529b\u968f\u4efb\u52a1\u3001\u7f51\u7edc\u5c42\u548c\u89c2\u6d4b\u5e8f\u5217\u957f\u5ea6\u53d8\u5316", "\u5339\u914d\u5bf9\u7167\u533a\u5206\u8bfb\u51fa\u51c6\u786e\u7387\u4e0e\u89c6\u89c9\u5386\u53f2\u3001\u8fd0\u52a8\u4fe1\u606f\u4f9d\u8d56", "\u771f\u5b9e\u7279\u5f81\u8bad\u7ec3\u7684\u7a7a\u95f4\u8bfb\u51fa\u5668\u4e0d\u80fd\u76f4\u63a5\u8fc1\u79fb\u81f3\u9884\u6d4b\u7279\u5f81"], "keywords": ["\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u7a7a\u95f4\u8868\u5f81", "\u7b2c\u4e00\u89c6\u89d2\u611f\u77e5", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2610.40636v1", "published_at": "2026-10-29", "score": 0.253, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40636.png", "title": "Probing Spatial State Representations in Visual Foundation Models", "tldr": "\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u80fd\u8bfb\u51fa\u5f53\u524d\u573a\u666f\uff0c\u5374\u672a\u5fc5\u80fd\u6301\u7eed\u8bb0\u4f4f\u7a7a\u95f4\u5e76\u6709\u6548\u6307\u5bfc\u884c\u52a8\u3002", "upvotes": 14, "what_it_is": "\u7814\u7a76\u4ee5\u9759\u6001\u5ba4\u5185\u73af\u5883\u7684\u6d41\u5f0f\u7b2c\u4e00\u89c6\u89d2\u89c2\u6d4b\uff0c\u5bf9\u5341\u79cd\u8868\u5f81\u8fdb\u884c\u51bb\u7ed3\u7279\u5f81\u63a2\u6d4b\u3002\u4ece\u7a7a\u95f4\u7ed3\u6784\u3001\u7269\u4f53\u6301\u7eed\u6027\u3001\u9884\u6d4b\u6027\u7a7a\u95f4\u66f4\u65b0\u548c\u884c\u52a8\u53ef\u7528\u6027\u56db\u5c42\u8bc4\u4f30\u80fd\u529b\u3002", "why_notable": "\u5b83\u63ed\u793a\u4e86\u573a\u666f\u4fe1\u606f\u53ef\u89e3\u7801\u4e0e\u7a7a\u95f4\u72b6\u6001\u53ef\u7528\u4e4b\u95f4\u7684\u843d\u5dee\uff0c\u4e3a\u89c6\u89c9\u6a21\u578b\u8bc4\u6d4b\u8865\u4e0a\u6301\u7eed\u8bb0\u5fc6\u3001\u9884\u6d4b\u66f4\u65b0\u548c\u76ee\u6807\u5bfc\u5411\u884c\u52a8\u4e09\u4e2a\u7ef4\u5ea6\u3002"}, {"abstract": "Proactive agents must decide whether, when, and how far to assist without an explicit request. Existing evaluations often rely on automated scores or binary verdicts, offering limited human diagnosis of evidence use and intervention quality. To address these gaps, we introduce HALO, Human-Grounded GrAnular EvaLuation of PrOactive Agents. HALO-Arena covers 4 proactive need types, Dependency, Blockage, Risk, and Opportunity, across 10 everyday domains and 50 personal environments. Scenarios require agents to retrieve evidence from structured databases or unstructured documents before judging whether assistance is warranted and choosing its scope. On HALO-Arena, we construct HALO-8K, a dataset of 8,000 responses from 10 models across 400 scenarios, annotated by 20 experts for action level, acceptability verdicts, and human diagnosis. For rejected responses, human diagnosis covers timing, intensity, and other issues. Recorded reasoning tokens and retrieval rounds measure the effort behind these responses. The best proprietary and open-source models achieve 72.88% and 56.63% acceptability, respectively. Our central finding is that over-proactivity is the dominant observed failure mode, with Premature timing or Excessive intensity accounting for 61.20% of rejected responses. Further analyses yield complementary findings on the balance between intervention and restraint, evidence acquisition, and the calibration of timing and intensity.", "arxiv_id": "2610.39086", "arxiv_url": "https://arxiv.org/abs/2610.39086", "authors": ["Wenqi Pei", "Xinyu Wang", "Jinrui Liu", "Cynthia Zhuge", "Jie Sheng", "Zihan Wang", "Tenghao Huang", "Muhao Chen"], "brief": "HALO\u6784\u5efa\u9700\u8981\u5148\u68c0\u7d22\u8bc1\u636e\u518d\u51b3\u5b9a\u662f\u5426\u53ca\u5982\u4f55\u4ecb\u5165\u7684\u573a\u666f\uff0c\u5e76\u4ee5\u4e13\u5bb6\u6807\u6ce8\u8bc4\u4f30\u884c\u52a8\u7ea7\u522b\u3001\u53ef\u63a5\u53d7\u6027\u548c\u5931\u8d25\u539f\u56e0\uff0c\u7ed3\u5408\u63a8\u7406\u4e0e\u68c0\u7d22\u5f00\u9500\u5206\u6790\u4e3b\u52a8\u6027\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/CedricPei/HALO", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.39086", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["HALO-Arena\u8986\u76d64\u7c7b\u9700\u6c42\u300110\u4e2a\u9886\u57df\u53ca50\u4e2a\u4e2a\u4eba\u73af\u5883", "HALO-8K\u542b400\u573a\u666f\u300110\u6a21\u578b\u76848000\u6761\u54cd\u5e94\uff0c\u753120\u4e13\u5bb6\u6807\u6ce8", "\u88ab\u62d2\u54cd\u5e94\u4e2d\uff0c\u8fc7\u65e9\u6216\u8fc7\u5f3a\u4ecb\u5165\u536061.20%"], "keywords": ["\u4e3b\u52a8\u667a\u80fd\u4f53", "\u4eba\u7c7b\u8bc4\u4f30", "\u8bc1\u636e\u68c0\u7d22", "\u884c\u4e3a\u6821\u51c6"], "num_comments": 2, "on_hf": true, "organization": "2077AI", "pdf_url": "https://arxiv.org/pdf/2610.39086v1", "published_at": "2026-10-29", "score": 0.248, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39086.png", "title": "HALO: Human-Grounded Granular Evaluation of Proactive Agents", "tldr": "\u4ee5\u4e13\u5bb6\u7ec6\u7c92\u5ea6\u6807\u6ce8\u8bc4\u4f30\u4e3b\u52a8\u667a\u80fd\u4f53\uff0c\u53d1\u73b0\u8fc7\u65e9\u6216\u8fc7\u5f3a\u4ecb\u5165\u662f\u4e3b\u8981\u5931\u8d25\u6a21\u5f0f\u3002", "upvotes": 7, "what_it_is": "HALO\u6784\u5efa\u9700\u8981\u5148\u68c0\u7d22\u8bc1\u636e\u518d\u51b3\u5b9a\u662f\u5426\u53ca\u5982\u4f55\u4ecb\u5165\u7684\u573a\u666f\uff0c\u5e76\u4ee5\u4e13\u5bb6\u6807\u6ce8\u8bc4\u4f30\u884c\u52a8\u7ea7\u522b\u3001\u53ef\u63a5\u53d7\u6027\u548c\u5931\u8d25\u539f\u56e0\uff0c\u7ed3\u5408\u63a8\u7406\u4e0e\u68c0\u7d22\u5f00\u9500\u5206\u6790\u4e3b\u52a8\u6027\u3002", "why_notable": "\u5c06\u4e3b\u52a8\u667a\u80fd\u4f53\u8bc4\u4f30\u4ece\u4e8c\u5143\u5224\u5b9a\u63a8\u8fdb\u5230\u53ef\u8bca\u65ad\u7684\u4eba\u7c7b\u8bc4\u4ef7\uff0c\u7a81\u51fa\u4ecb\u5165\u65f6\u673a\u4e0e\u5f3a\u5ea6\u6821\u51c6\u7684\u91cd\u8981\u6027\uff0c\u4e3a\u51cf\u5c11\u8fc7\u5ea6\u4e3b\u52a8\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "World action models (WAMs) learn latent variables from observations and use these to both predict the evolution of the scene and to generate actions. The prediction has to be of the whole scene, whereas only a portion of the scene causes actions. WAMs fitted to demonstrations do not, in general, guarantee that they will generate actions solely from the latent causes of the demonstrated actions (the action-relevant latent variables), as the model could just as well learn to imitate in this way whilst entangling the action-relevant latent variables with the nuisance variables. We therefore separate out what causes action from what prediction depends on. We prove that under a sparsity constraint the latent variables used to generate actions are an invertible function of the action-relevant latent variables alone and the true structure is identified up to a permutation of the latent variables. This requires neither sufficient temporal dependence nor any assumptions on how the unobserved regimes evolve and holds even when the action-relevant latent variables are statistically dependent on the rest. We therefore propose CWAM (Causal WAM), which incorporates the constraint into a pretrained WAM by adding a sparse routing path to its action head, with the world modeling objective remaining unchanged. Experiments on both synthetic data and real-world robots validate the theory as well as showcase the improved efficiency in closed-loop success.", "arxiv_id": "2610.42096", "arxiv_url": "https://arxiv.org/abs/2610.42096", "authors": ["Juntao Cheng", "Jinzhou Tang", "Fan Feng", "Henrik I. Christensen", "Yujia Zheng"], "brief": "\u63d0\u51faCWAM\uff0c\u5728\u9884\u8bad\u7ec3\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u52a8\u4f5c\u5934\u52a0\u5165\u7a00\u758f\u8def\u7531\uff0c\u4fdd\u6301\u4e16\u754c\u5efa\u6a21\u76ee\u6807\u4e0d\u53d8\uff0c\u4f7f\u52a8\u4f5c\u751f\u6210\u4ec5\u4f9d\u8d56\u52a8\u4f5c\u76f8\u5173\u6f5c\u53d8\u91cf\uff0c\u800c\u975e\u573a\u666f\u4e2d\u7684\u5e72\u6270\u56e0\u7d20\u3002", "categories": ["cs.AI", "cs.RO", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.42096", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7a00\u758f\u7ea6\u675f\u4e0b\uff0c\u52a8\u4f5c\u6f5c\u53d8\u91cf\u53ef\u8fa8\u8bc6\u81f3\u6392\u5217\u7b49\u4ef7", "\u7406\u8bba\u5141\u8bb8\u52a8\u4f5c\u76f8\u5173\u6f5c\u53d8\u91cf\u4e0e\u5e72\u6270\u53d8\u91cf\u7edf\u8ba1\u4f9d\u8d56", "\u5408\u6210\u6570\u636e\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u9a8c\u8bc1\u95ed\u73af\u6210\u529f\u6548\u7387\u63d0\u5347"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u56e0\u679c\u5b66\u4e60", "\u7a00\u758f\u5efa\u6a21", "\u673a\u5668\u4eba\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Causal Intelligence", "pdf_url": "https://arxiv.org/pdf/2610.42096v1", "published_at": "2026-10-30", "score": 0.243, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42096.png", "title": "CausalWAM: Learning the Causes of Actions in World Action Models", "tldr": "\u901a\u8fc7\u7a00\u758f\u8def\u7531\u5206\u79bb\u52a8\u4f5c\u56e0\u679c\u6f5c\u53d8\u91cf\u4e0e\u5e72\u6270\u56e0\u7d20\uff0c\u63d0\u5347\u673a\u5668\u4eba\u95ed\u73af\u6267\u884c\u6548\u7387\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51faCWAM\uff0c\u5728\u9884\u8bad\u7ec3\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u52a8\u4f5c\u5934\u52a0\u5165\u7a00\u758f\u8def\u7531\uff0c\u4fdd\u6301\u4e16\u754c\u5efa\u6a21\u76ee\u6807\u4e0d\u53d8\uff0c\u4f7f\u52a8\u4f5c\u751f\u6210\u4ec5\u4f9d\u8d56\u52a8\u4f5c\u76f8\u5173\u6f5c\u53d8\u91cf\uff0c\u800c\u975e\u573a\u666f\u4e2d\u7684\u5e72\u6270\u56e0\u7d20\u3002", "why_notable": "\u5c06\u5168\u573a\u666f\u9884\u6d4b\u4e0e\u52a8\u4f5c\u751f\u6210\u7684\u56e0\u679c\u4f9d\u8d56\u5206\u5f00\uff0c\u5e76\u7ed9\u51fa\u53ef\u8fa8\u8bc6\u6027\u4fdd\u8bc1\uff0c\u4e3a\u51cf\u5c11\u6a21\u4eff\u5b66\u4e60\u4e2d\u7684\u5e72\u6270\u4f9d\u8d56\u63d0\u4f9b\u7406\u8bba\u4e0e\u5b9e\u8bc1\u652f\u6301\u3002"}, {"abstract": "As publications and products on time series forecasting (TSF) proliferate, researchers face a growing burden of analyzing existing work. First, not all publications release code. For instance, only about 20% of arXiv TSF papers have a code link in the surveyed period. Second, released code also requires manual maintenance. Thus, TSF researchers must constantly adapt or implement existing works. However, independent implementations can differ in experimental settings and are difficult to maintain. We therefore propose to use AI agents for benchmarking TSF research and even supporting autoresearch, e.g., developing new TSF models. Yet directly applying existing coding agents, such as Claude Code and Codex, is suboptimal: prohibitive costs, limited scalability to large research projects (e.g., benchmarking), and lack of self-maintenance. To address these challenges, we propose TSFLab, a self-improving agent-agnostic \"workbench\" that equips compatible coding agents with shared resources and tools for low-cost TSF research and continuous maintenance of research resources. Our experiments cover reproduction, benchmarking, and new method development. In reproduction and benchmarking, TSFLab improves task completion by 20-163% and cuts fresh tokens per completed task by 11-66% across baselines. A pilot study of agent-driven method development also shows improved forecasting accuracy via TSFLab, with 32.8-73.6% fewer fresh tokens and 9.2-68.8% less development time than the other settings.", "arxiv_id": "2610.40901", "arxiv_url": "https://arxiv.org/abs/2610.40901", "authors": ["ChengAo Shen", "Yanjun Zhao", "Haoxin Liu", "Bonnie Chen", "Miles Ma", "Dongjin Song", "Hanghang Tong", "Qingsong Wen", "Jingrui He", "Jingchao Ni"], "brief": "TSFLab\u4e3a\u517c\u5bb9\u7684\u7f16\u7801\u667a\u80fd\u4f53\u63d0\u4f9b\u5171\u4eab\u8d44\u6e90\u4e0e\u5de5\u5177\uff0c\u652f\u6301\u65f6\u5e8f\u9884\u6d4b\u8bba\u6587\u590d\u73b0\u3001\u57fa\u51c6\u6d4b\u8bd5\u548c\u65b0\u65b9\u6cd5\u5f00\u53d1\uff0c\u5e76\u901a\u8fc7\u6301\u7eed\u7ef4\u62a4\u7814\u7a76\u8d44\u6e90\u51cf\u5c11\u91cd\u590d\u5b9e\u73b0\u4e0e\u9002\u914d\u6210\u672c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/D2I-Group/TSFLab", "github_stars": 65, "hf_url": "https://huggingface.co/papers/2610.40901", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u590d\u73b0\u4e0e\u57fa\u51c6\u6d4b\u8bd5\u4efb\u52a1\u5b8c\u6210\u7387\u63d0\u534720\u2013163%", "\u6bcf\u9879\u5b8c\u6210\u4efb\u52a1\u7684\u65b0\u751f\u6210\u8bcd\u5143\u51cf\u5c1111\u201366%", "\u65b9\u6cd5\u5f00\u53d1\u8bd5\u9a8c\u8017\u65f6\u51cf\u5c119.2\u201368.8%"], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u667a\u80fd\u4f53", "\u81ea\u52a8\u5316\u79d1\u7814", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 1, "on_hf": true, "organization": "Data to Intelligence (D2I) Group @ UH", "pdf_url": "https://arxiv.org/pdf/2610.40901v1", "published_at": "2026-10-29", "score": 0.234, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40901.png", "title": "TSFLab: A Self-Improving Agent-Agnostic Workbench for Time Series Forecasting Research", "tldr": "\u7528\u5171\u4eab\u5de5\u5177\u4e0e\u81ea\u7ef4\u62a4\u5de5\u4f5c\u53f0\u63d0\u5347\u667a\u80fd\u4f53\u65f6\u5e8f\u9884\u6d4b\u7814\u7a76\u6548\u7387\uff0c\u964d\u4f4e\u590d\u73b0\u548c\u5f00\u53d1\u6210\u672c\u3002", "upvotes": 1, "what_it_is": "TSFLab\u4e3a\u517c\u5bb9\u7684\u7f16\u7801\u667a\u80fd\u4f53\u63d0\u4f9b\u5171\u4eab\u8d44\u6e90\u4e0e\u5de5\u5177\uff0c\u652f\u6301\u65f6\u5e8f\u9884\u6d4b\u8bba\u6587\u590d\u73b0\u3001\u57fa\u51c6\u6d4b\u8bd5\u548c\u65b0\u65b9\u6cd5\u5f00\u53d1\uff0c\u5e76\u901a\u8fc7\u6301\u7eed\u7ef4\u62a4\u7814\u7a76\u8d44\u6e90\u51cf\u5c11\u91cd\u590d\u5b9e\u73b0\u4e0e\u9002\u914d\u6210\u672c\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u628a\u7f16\u7801\u667a\u80fd\u4f53\u63a5\u5165\u53ef\u6301\u7eed\u7ef4\u62a4\u7684\u7814\u7a76\u5de5\u4f5c\u6d41\uff0c\u5728\u63d0\u9ad8\u4efb\u52a1\u5b8c\u6210\u7387\u7684\u540c\u65f6\u964d\u4f4e\u8bcd\u5143\u6210\u672c\uff0c\u5e76\u521d\u6b65\u5c55\u793a\u81ea\u52a8\u5f00\u53d1\u9884\u6d4b\u65b9\u6cd5\u7684\u6f5c\u529b\u3002"}, {"abstract": "Training acceleration methods for diffusion transformers, such as REPA and dispersive regularization, are commonly explained by additional supervision, spatial-structure priors, or improved feature geometry. We revisit this view and uncover a striking internal change: the AdaLN-Zero residual gate $\u03b1$, which directly controls how conditioned updates enter the residual stream, is substantially reorganized by these methods. This observation motivates our hypothesis that acceleration arises, at least in part, from reshaping the residual gating pathway rather than solely from the feature structures explicitly imposed by auxiliary objectives. Supporting this view, accelerated models are markedly more sensitive to perturbations of $\u03b1$, and their gate geometry reflects semantic relationships among classes. We further introduce the normalized participation ratio (nPR) to characterize the channel-wise organization of the gates and find that, across REPA teachers, projector architectures, and radial-objective targets, broader gate participation accompanies better generation quality. Guided by this insight, we propose a simple teacher-free radial objective that promotes broader gate participation through feature-norm regularization, without pairwise feature comparisons. On ImageNet $256\\times256$ with SiT-B/2, our method improves FID over dispersive loss while increasing mean gate participation over timesteps and classes, further supporting the link between gate organization and training acceleration. Our results identify residual-gate reorganization as a measurable axis of diffusion training acceleration and suggest a simple direction for further acceleration.", "arxiv_id": "2610.40914", "arxiv_url": "https://arxiv.org/abs/2610.40914", "authors": ["Junha Park", "Jaemyung Yu", "Jaehui Hwang", "Jong-Seok Lee", "Dongyoon Han"], "brief": "\u7814\u7a76\u4eceAdaLN-Zero\u6b8b\u5dee\u95e8\u63a7\u5207\u5165\uff0c\u5206\u6790\u6269\u6563\u6a21\u578b\u8bad\u7ec3\u52a0\u901f\u7684\u5185\u90e8\u673a\u5236\uff1b\u7528\u5f52\u4e00\u5316\u53c2\u4e0e\u7387\u8861\u91cf\u901a\u9053\u53c2\u4e0e\uff0c\u5e76\u8bbe\u8ba1\u7279\u5f81\u8303\u6570\u6b63\u5219\u4fc3\u8fdb\u66f4\u5e7f\u6cdb\u7684\u95e8\u63a7\u53c2\u4e0e\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40914", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["REPA\u7b49\u52a0\u901f\u6a21\u578b\u5bf9\u6b8b\u5dee\u95e8\u03b1\u6270\u52a8\u66f4\u654f\u611f", "\u5f52\u4e00\u5316\u53c2\u4e0e\u7387nPR\u8d8a\u9ad8\uff0c\u751f\u6210\u8d28\u91cf\u901a\u5e38\u8d8a\u597d", "\u65e0\u6559\u5e08\u5f84\u5411\u76ee\u6807\u5728SiT-B/2\u4e0a\u4f18\u4e8e\u5206\u6563\u635f\u5931\u7684FID"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bad\u7ec3\u52a0\u901f", "\u6b8b\u5dee\u95e8\u63a7", "\u7279\u5f81\u6b63\u5219\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.40914v1", "published_at": "2026-10-29", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40914.png", "title": "No Channels Left Behind: Understanding Diffusion Acceleration through Residual Gates", "tldr": "\u7814\u7a76\u63ed\u793a\u6269\u6563\u8bad\u7ec3\u52a0\u901f\u4e0e\u6b8b\u5dee\u95e8\u63a7\u91cd\u7ec4\u6709\u5173\uff0c\u5e76\u63d0\u51fa\u65e0\u6559\u5e08\u6b63\u5219\u65b9\u6cd5\u6539\u5584\u751f\u6210\u8d28\u91cf\u3002", "upvotes": 5, "what_it_is": "\u7814\u7a76\u4eceAdaLN-Zero\u6b8b\u5dee\u95e8\u63a7\u5207\u5165\uff0c\u5206\u6790\u6269\u6563\u6a21\u578b\u8bad\u7ec3\u52a0\u901f\u7684\u5185\u90e8\u673a\u5236\uff1b\u7528\u5f52\u4e00\u5316\u53c2\u4e0e\u7387\u8861\u91cf\u901a\u9053\u53c2\u4e0e\uff0c\u5e76\u8bbe\u8ba1\u7279\u5f81\u8303\u6570\u6b63\u5219\u4fc3\u8fdb\u66f4\u5e7f\u6cdb\u7684\u95e8\u63a7\u53c2\u4e0e\u3002", "why_notable": "\u5c06\u52a0\u901f\u673a\u5236\u7684\u89e3\u91ca\u4ece\u7279\u5f81\u7ed3\u6784\u6269\u5c55\u5230\u53ef\u6d4b\u91cf\u7684\u6b8b\u5dee\u95e8\u63a7\u7ec4\u7ec7\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u6559\u5e08\u6216\u6210\u5bf9\u7279\u5f81\u6bd4\u8f83\u7684\u6539\u8fdb\u65b9\u5411\u3002"}, {"abstract": "Metis is a bet that better data, better training methods and new architectures can buy what a bigger parameter count cannot, at a fraction of the cost. Metis-1.6 is its latest step: two language models built from scratch by a single researcher, Praxis (2.94B parameters, 0.46B active per pass) and Logos (10.23B parameters, 1.18B active per pass). Both run a hybrid Mamba-2 and attention mixture-of-experts stack twice for every token, so each token gets a second look. Each was trained on 1.02T tokens in total: 804.76B of pretraining, 18B of context extension to 131,072 tokens, and 200B of supervised fine-tuning. Metis-1.6 was never meant to challenge frontier models, and across 40 post-trained benchmarks it mostly does not: Logos averages 52.93, seventh of 17 models in its comparison set and within a point of Qwen3-4B. But it gets there on roughly a twelfth of the median training data of the comparators that disclose it, and with fewer active parameters per token than any model that beats it, which puts it on the Pareto frontier for both. In mathematics it ranks second of 30 models, with 67.50% on AIME 2025 and 63.64% on HMMT February 2026. It is weak at code, instruction following and long context. The rest of the report is the part I found most valuable: what went wrong. The optimizer I configured never ran, and attention trained with AdamW for all of pretraining. A 1.77B-parameter n-gram memory learned to switch itself off. Five fine-tuning choices cost capability. And a length reward under group-mean normalization punished correct solutions for being long once a group\u0027s pass rate passed 2/3, a sign inversion I prove and fix with a one-line clamp. I close with the 10B-token ablations behind MoRE (Mixture of Recursive Experts), the looped architecture of Metis-1.7.", "arxiv_id": "2610.37903", "arxiv_url": "https://arxiv.org/abs/2610.37903", "authors": ["Giulianno Vollmer"], "brief": "\u5355\u4eba\u4ece\u96f6\u8bad\u7ec3\u4e24\u4e2a\u8bed\u8a00\u6a21\u578b\uff0c\u5c06Mamba-2\u3001\u6ce8\u610f\u529b\u4e0e\u6df7\u5408\u4e13\u5bb6\u7ed3\u5408\uff0c\u6bcf\u4e2a\u8bcd\u5143\u8fd0\u884c\u4e24\u904d\u3002\u62a5\u544a\u540c\u65f6\u62ab\u9732\u8bad\u7ec3\u5931\u8bef\u3001\u5fae\u8c03\u635f\u5931\u53ca\u5956\u52b1\u4fee\u6b63\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/lernex/dromos", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37903", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Praxis\u4e0eLogos\u5206\u522b\u6fc0\u6d3b0.46B\u30011.18B\u53c2\u6570", "\u5404\u8bad\u7ec31.02T\u8bcd\u5143\uff1bLogos\u5728AIME 2025\u83b767.50%", "\u7ec4\u5747\u503c\u5f52\u4e00\u5316\u4f7f\u957f\u5ea6\u5956\u52b1\u53cd\u8f6c\uff0c\u7528\u5355\u884c\u622a\u65ad\u4fee\u6b63"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u8bad\u7ec3", "\u5956\u52b1\u8bbe\u8ba1"], "num_comments": 2, "on_hf": true, "organization": "Lernex", "pdf_url": "https://arxiv.org/pdf/2610.37903v1", "published_at": "2026-10-27", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37903.png", "title": "Think Twice: The Metis-1.6 Technical Report", "tldr": "\u4ee5\u6df7\u5408\u4e13\u5bb6\u67b6\u6784\u9010\u8bcd\u8ba1\u7b97\u4e24\u904d\uff0c\u8f83\u5c11\u8bad\u7ec3\u6570\u636e\u4e0e\u6fc0\u6d3b\u53c2\u6570\u6362\u53d6\u6709\u7ade\u4e89\u529b\u7684\u6570\u5b66\u8868\u73b0\u3002", "upvotes": 4, "what_it_is": "\u5355\u4eba\u4ece\u96f6\u8bad\u7ec3\u4e24\u4e2a\u8bed\u8a00\u6a21\u578b\uff0c\u5c06Mamba-2\u3001\u6ce8\u610f\u529b\u4e0e\u6df7\u5408\u4e13\u5bb6\u7ed3\u5408\uff0c\u6bcf\u4e2a\u8bcd\u5143\u8fd0\u884c\u4e24\u904d\u3002\u62a5\u544a\u540c\u65f6\u62ab\u9732\u8bad\u7ec3\u5931\u8bef\u3001\u5fae\u8c03\u635f\u5931\u53ca\u5956\u52b1\u4fee\u6b63\u3002", "why_notable": "\u5c55\u793a\u4f4e\u6fc0\u6d3b\u53c2\u6570\u4e0e\u8f83\u5c11\u6570\u636e\u4e0b\u7684\u6570\u5b66\u80fd\u529b\uff0c\u5e76\u516c\u5f00\u4f18\u5316\u5668\u5931\u914d\u548c\u5956\u52b1\u8bbe\u8ba1\u5931\u8bef\uff0c\u4e3a\u9ad8\u6548\u8bad\u7ec3\u4e0e\u6545\u969c\u6392\u67e5\u63d0\u4f9b\u5177\u4f53\u6848\u4f8b\u3002"}, {"abstract": "Perceiving human body motion is critical for multimodal systems that understand and assist people. Yet current evaluations of Multimodal Large Language Models (MLLMs) largely focus on objects, scenes, and coarse actions, leaving their ability to reason about the body itself poorly assessed. This is especially challenging from the egocentric perspective, in which the body is only partially visible and motion must be inferred from occluded and temporally distributed cues. We introduce SOMA, a benchmark for fine-grained body-motion understanding from egocentric video, comprising 1,632 human-verified questions across three capability axes: body configuration, motion dynamics, and temporal reasoning. We evaluate 37 leading closed-source, open-source, and specialized egocentric MLLMs, complemented by an extensive human evaluation. We find that humans also find this task difficult from video alone (68.5% accuracy), yet clearly outperform the strongest MLLM (Qwen3.6-27B), which reaches 50.0% zero-shot accuracy. Our error analysis shows that MLLMs often misread the wearer\u0027s own body, misjudge events in time, and are prone to biases such as favoring the right hand or under-counting repetitions. To narrow the gap to human performance and support further progress, we introduce a training dataset of aligned video, body motion, and language supervision, and a multimodal baseline that jointly learns from these modalities. By identifying common failure modes and missing capabilities in current MLLMs, we hope SOMA will inspire future research on body-motion understanding and multimodal reasoning. Full benchmark, training data, and code will be released at: https://cnai.epfl.ch/soma", "arxiv_id": "2610.36384", "arxiv_url": "https://arxiv.org/abs/2610.36384", "authors": ["Matea Tashkovska", "Na\u00ebl Ouerghemi", "Haozhe Qi", "Alexander Mathis"], "brief": "\u6784\u5efa\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e2d\u7684\u7ec6\u7c92\u5ea6\u8eab\u4f53\u8fd0\u52a8\u8bc4\u6d4b\uff0c\u8986\u76d6\u59ff\u6001\u3001\u8fd0\u52a8\u52a8\u6001\u4e0e\u65f6\u95f4\u63a8\u7406\uff1b\u540c\u65f6\u63d0\u4f9b\u89c6\u9891\u3001\u8eab\u4f53\u8fd0\u52a8\u548c\u8bed\u8a00\u5bf9\u9f50\u7684\u8bad\u7ec3\u6570\u636e\u53ca\u8054\u5408\u5b66\u4e60\u57fa\u7ebf\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "q-bio.NC"], "github_repo": "https://github.com/amathislab/soma", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.36384", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SOMA\u542b1,632\u9053\u4eba\u7c7b\u6838\u9a8c\u95ee\u9898\uff0c\u8986\u76d6\u4e09\u7c7b\u80fd\u529b", "\u8bc4\u6d4b37\u4e2a\u6a21\u578b\uff1a\u6700\u4f73\u96f6\u6837\u672c\u51c6\u786e\u738750.0%\uff0c\u4eba\u7c7b68.5%", "\u9519\u8bef\u5206\u6790\u53d1\u73b0\u53f3\u624b\u504f\u597d\u3001\u91cd\u590d\u6b21\u6570\u4f4e\u4f30\u53ca\u65f6\u95f4\u8bef\u5224"], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891", "\u8eab\u4f53\u8fd0\u52a8\u7406\u89e3", "\u65f6\u95f4\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Mathis Group @ EPFL", "pdf_url": "https://arxiv.org/pdf/2610.36384v1", "published_at": "2026-10-26", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36384.png", "title": "SOMA: A Benchmark for Fine-Grained Egocentric Behavior and Body-Motion Understanding", "tldr": "\u65b0\u57fa\u51c6\u63ed\u793a\u591a\u6a21\u6001\u5927\u6a21\u578b\u7406\u89e3\u7b2c\u4e00\u89c6\u89d2\u8eab\u4f53\u8fd0\u52a8\u7684\u77ed\u677f\uff0c\u5e76\u63d0\u4f9b\u8de8\u6a21\u6001\u8bad\u7ec3\u8d44\u6e90\u3002", "upvotes": 4, "what_it_is": "\u6784\u5efa\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e2d\u7684\u7ec6\u7c92\u5ea6\u8eab\u4f53\u8fd0\u52a8\u8bc4\u6d4b\uff0c\u8986\u76d6\u59ff\u6001\u3001\u8fd0\u52a8\u52a8\u6001\u4e0e\u65f6\u95f4\u63a8\u7406\uff1b\u540c\u65f6\u63d0\u4f9b\u89c6\u9891\u3001\u8eab\u4f53\u8fd0\u52a8\u548c\u8bed\u8a00\u5bf9\u9f50\u7684\u8bad\u7ec3\u6570\u636e\u53ca\u8054\u5408\u5b66\u4e60\u57fa\u7ebf\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u7126\u70b9\u4ece\u7269\u4f53\u4e0e\u7c97\u7c92\u5ea6\u52a8\u4f5c\u8f6c\u5411\u4f69\u6234\u8005\u81ea\u8eab\u8eab\u4f53\uff0c\u91cf\u5316\u6a21\u578b\u4e0e\u4eba\u7c7b\u7684\u5dee\u8ddd\uff0c\u5e76\u4e3a\u8eab\u4f53\u8fd0\u52a8\u7406\u89e3\u63d0\u4f9b\u9488\u5bf9\u6027\u7684\u8bad\u7ec3\u5165\u53e3\u3002"}, {"abstract": "Do research agents have taste, the judgment of which experiments are worth running before their outcomes are known? We give six frontier models seven recent NLP papers. Each model, working as a research agent alone or as a team, proposes minimum viable experiments (MVEs), forecasts whether each will pass a threshold it sets and ranks them. A separate executor then attempts every MVE, including those ranked last, and three model auditors judge the results. Of 415 MVEs, 194 are judged sound, valuable and new, but fewer than half of these (73) are also judged beyond the seed paper and non obvious. The agents\u0027 first choices match the auditors\u0027 most valued experiment more often than a random pick, but are not shown to improve on choosing the experiment written first. Their forecasts beat a base rate but are not measurably more accurate than those of a fresh instance of the same model given only the paper and registrations. Teams cost more without a clear overall improvement in proposal quality. The agents produce many worthwhile experiments, but the evidence that their rankings improve the choice of which to run remains limited. The evaluation harness and a dataset of all 415 MVEs, with their forecasts and audited outcomes, are available at https://github.com/ArtKanke/rTaste.", "arxiv_id": "2610.40488", "arxiv_url": "https://arxiv.org/abs/2610.40488", "authors": ["Art Kanke"], "brief": "rTaste\u8bc4\u4f30\u7814\u7a76\u667a\u80fd\u4f53\u5728\u7ed3\u679c\u672a\u77e5\u65f6\u9009\u62e9\u5b9e\u9a8c\u7684\u5224\u65ad\u529b\uff1a\u8ba9\u516d\u4e2a\u524d\u6cbf\u6a21\u578b\u57fa\u4e8e\u4e03\u7bc7NLP\u8bba\u6587\u63d0\u51fa\u3001\u9884\u6d4b\u5e76\u6392\u5e8f\u6700\u5c0f\u53ef\u884c\u5b9e\u9a8c\uff0c\u518d\u72ec\u7acb\u6267\u884c\u5e76\u5ba1\u8ba1\u7ed3\u679c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/ArtKanke/rTaste", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.40488", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["415\u4e2a\u6700\u5c0f\u53ef\u884c\u5b9e\u9a8c\u4e2d194\u4e2a\u83b7\u8ba4\u53ef\uff0c\u4ec573\u4e2a\u8d85\u8d8a\u539f\u8bba\u6587\u4e14\u975e\u663e\u7136", "\u6392\u5e8f\u4f18\u4e8e\u968f\u673a\u9009\u62e9\uff0c\u4f46\u672a\u663e\u793a\u4f18\u4e8e\u9009\u53d6\u6700\u5148\u5199\u51fa\u7684\u5b9e\u9a8c", "\u9884\u6d4b\u4f18\u4e8e\u57fa\u51c6\u53d1\u751f\u7387\uff1b\u56e2\u961f\u6210\u672c\u66f4\u9ad8\u4f46\u8d28\u91cf\u65e0\u660e\u786e\u63d0\u5347"], "keywords": ["\u79d1\u7814\u667a\u80fd\u4f53", "\u5b9e\u9a8c\u8bbe\u8ba1", "\u9884\u6d4b\u8bc4\u4f30", "\u79d1\u7814\u5224\u65ad"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.40488v1", "published_at": "2026-10-29", "score": 0.217, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40488.png", "title": "rTaste: Do Research Agents Have Taste? Evaluating Early Stage Research Judgment", "tldr": "\u7814\u7a76\u667a\u80fd\u4f53\u80fd\u63d0\u51fa\u6709\u4ef7\u503c\u7684\u5b9e\u9a8c\uff0c\u4f46\u5176\u6392\u5e8f\u5c1a\u672a\u663e\u793a\u51fa\u4f18\u4e8e\u76f4\u63a5\u9009\u9996\u4e2a\u65b9\u6848\u3002", "upvotes": 2, "what_it_is": "rTaste\u8bc4\u4f30\u7814\u7a76\u667a\u80fd\u4f53\u5728\u7ed3\u679c\u672a\u77e5\u65f6\u9009\u62e9\u5b9e\u9a8c\u7684\u5224\u65ad\u529b\uff1a\u8ba9\u516d\u4e2a\u524d\u6cbf\u6a21\u578b\u57fa\u4e8e\u4e03\u7bc7NLP\u8bba\u6587\u63d0\u51fa\u3001\u9884\u6d4b\u5e76\u6392\u5e8f\u6700\u5c0f\u53ef\u884c\u5b9e\u9a8c\uff0c\u518d\u72ec\u7acb\u6267\u884c\u5e76\u5ba1\u8ba1\u7ed3\u679c\u3002", "why_notable": "\u5c06\u7814\u7a76\u8bc4\u4f30\u4ece\u65b9\u6848\u751f\u6210\u63a8\u8fdb\u5230\u5b9e\u9645\u6267\u884c\uff0c\u533a\u5206\u5b9e\u9a8c\u4ef7\u503c\u4e0e\u9009\u62e9\u80fd\u529b\uff0c\u5e76\u5f00\u653e\u5b8c\u6574\u6570\u636e\uff0c\u4e3a\u68c0\u9a8c\u79d1\u7814\u667a\u80fd\u4f53\u7684\u5224\u65ad\u529b\u63d0\u4f9b\u57fa\u51c6\u3002"}, {"abstract": "Accelerating modern foundational models has pushed domain-specific compilers toward increasingly complex, multi-tiered optimization pipelines. However, this heavy optimization focus introduces delicate tradeoffs between peak execution performance and correctness. Subtle codegen defects can trigger numerical degradation and memory or buffer corruption, invalidating multi-million-dollar training runs and degrading live serving quality without raising obvious compiler errors. In this paper, we present a battle-tested methodology for verifying and triaging Google\u0027s XLA:TPU compiler at hyperscale. We leverage fuzzing techniques, combining synthetic program generation with real production traces, while orchestrating AI agent swarms to autonomously generate stress tests, reproduce failures, and draft fixes. To pinpoint root causes in full workloads, we pair this with a hierarchical differential pipeline that bisects large graphs down to individual failing operations inside fused kernels. Deployed in production, our framework has already driven the resolution of over 142 compiler bugs (with 103 additional findings under review), from which we distill pragmatic lessons learned.", "arxiv_id": "2611.00624", "arxiv_u
