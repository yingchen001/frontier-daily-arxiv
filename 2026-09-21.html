2609.24083v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Content Generation to Learning Support: Pedagogy-Guided Generative Video Tutors for STEM Learning", "tldr": "\u7528\u6559\u5b66\u6cd5\u5f15\u5bfc\u751f\u6210STEM\u89c6\u9891\u5bfc\u5e08\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PIVOT\uff0c\u4e00\u4e2a\u9762\u5411 STEM \u5b66\u4e60\u7684\u751f\u6210\u5f0f\u89c6\u9891\u8f85\u5bfc\u6846\u67b6\u3002\u5b83\u5c06\u6559\u5b66\u539f\u5219\u8d2f\u7a7f\u5206\u955c\u751f\u6210\u3001\u4ee3\u7801\u9a71\u52a8\u89c6\u9891\u751f\u6210\u3001\u6559\u5b66\u9a8c\u8bc1\u3001\u6d4b\u8bc4\u4e0e\u8bef\u89e3\u7ea0\u6b63\u7b49\u73af\u8282\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u8ffd\u6c42\u89c6\u89c9\u8fde\u8d2f\u7684\u6559\u80b2\u89c6\u9891\u751f\u6210\uff0c\u8be5\u5de5\u4f5c\u5f3a\u8c03\u5b66\u4e60\u652f\u6301\u4e0e\u6559\u5b66\u95ed\u73af\uff0c\u4e3a\u751f\u6210\u5f0f\u6559\u80b2\u5185\u5bb9\u4ece\u201c\u5185\u5bb9\u751f\u4ea7\u201d\u8d70\u5411\u201c\u6709\u6548\u6559\u5b66\u201d\u63d0\u4f9b\u4e86\u7cfb\u7edf\u6846\u67b6\u3002"}, {"abstract": "Crash datasets that carry an investigator narrative hold information the coded fields omit. Coding those narratives at scale has been blocked by three obstacles. Frontier large language models are costly at that scale, their generated text cannot be verified, and no rule says how much output a human must check. This paper formulates narrative coding as gated, typed decisions answered by Jev, a System One model that returns probabilities over analyst-defined options and generates no text. A screen covered 499,500 Texas narratives and 195,857 were coded with a 27-question schema. Cost is governed by schema size rather than narrative length. The probabilities are audited against coded fields and against 2,416 blinded human judgments drawn under a stated sampling design. Two frontier large language models are benchmarked on the same records. Against human labels the typed model attains an F1 of 0.908. One frontier model gains 0.059 and the other is indistinguishable from it. Calibration varies by model rather than by paradigm, so each model must be audited. Recalibration on the same labels reduces calibration error by a factor of 3.3. Agreement with coded fields understates fidelity to the narrative by a median of 0.26 in kappa. A resolution-floor bound covers any model that reports probabilities on a discrete grid. A review budget over flagged records gives the records a human must read per variable and per year. Adding the calibrated variables to the coded fields raises the injury and fatal crashes attributed to nine factors by 10,747 per year.", "arxiv_id": "2609.24052", "arxiv_url": "https://arxiv.org/abs/2609.24052", "authors": ["Amir Rafe", "Subasish Das"], "brief": "\u8bba\u6587\u5c06\u8b66\u65b9\u4e8b\u6545\u53d9\u8ff0\u7f16\u7801\u5efa\u6a21\u4e3a\u5e26\u95e8\u63a7\u7684\u7c7b\u578b\u5316\u6982\u7387\u51b3\u7b56\uff0c\u4f7f\u7528\u4e0d\u751f\u6210\u6587\u672c\u7684 System One \u6a21\u578b Jev\uff0c\u5728\u8fd150\u4e07\u6761\u5fb7\u5dde\u4e8b\u6545\u53d9\u8ff0\u4e0a\u63d0\u53d6\u7ed3\u6784\u5316\u53d8\u91cf\u3002\u7814\u7a76\u8fd8\u7ed9\u51fa\u4eba\u5de5\u62bd\u68c0\u3001\u6821\u51c6\u3001\u91cd\u6821\u51c6\u4e0e\u5ba1\u6838\u9884\u7b97\u7684\u8bc4\u4f30\u6846\u67b6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24052", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6499,500\u6761\u5fb7\u5dde\u4e8b\u6545\u53d9\u8ff0\uff0c\u5176\u4e2d195,857\u6761\u630927\u4e2a\u95ee\u9898\u7684\u6a21\u5f0f\u5b8c\u6210\u7f16\u7801\uff0c\u6210\u672c\u4e3b\u8981\u7531\u6a21\u5f0f\u89c4\u6a21\u800c\u975e\u53d9\u8ff0\u957f\u5ea6\u51b3\u5b9a", "Jev \u76f8\u5bf9\u76f2\u5ba1\u4eba\u5de5\u6807\u7b7e\u8fbe\u52300.908\u7684F1\uff0c\u5e76\u4e0e\u4e24\u4e2a\u524d\u6cbf\u5927\u8bed\u8a00\u6a21\u578b\u5728\u76f8\u540c\u8bb0\u5f55\u4e0a\u8fdb\u884c\u57fa\u51c6\u6bd4\u8f83", "\u6a21\u578b\u6821\u51c6\u9700\u9010\u6a21\u578b\u5ba1\u8ba1\uff1b\u57fa\u4e8e\u540c\u4e00\u6279\u6807\u7b7e\u91cd\u6821\u51c6\u53ef\u5c06\u6821\u51c6\u8bef\u5dee\u964d\u4f4e3.3\u500d\uff0c\u4e14\u4ec5\u4e0e\u5df2\u6709\u7f16\u7801\u5b57\u6bb5\u6bd4\u8f83\u4f1a\u4f4e\u4f30\u53d9\u8ff0\u4fdd\u771f\u5ea6"], "keywords": ["\u4fe1\u606f\u62bd\u53d6", "\u6587\u672c\u5206\u7c7b", "\u6a21\u578b\u6821\u51c6", "\u793e\u4f1a\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24052v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Calibrated Decisions at Scale: Converting Police Crash Narratives into Probabilistic Crash Variables with a System One Model (Jev)", "tldr": "\u7528\u6982\u7387\u6a21\u578b\u4f4e\u6210\u672c\u7f16\u7801\u4e8b\u6545\u53d9\u8ff0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u8b66\u65b9\u4e8b\u6545\u53d9\u8ff0\u7f16\u7801\u5efa\u6a21\u4e3a\u5e26\u95e8\u63a7\u7684\u7c7b\u578b\u5316\u6982\u7387\u51b3\u7b56\uff0c\u4f7f\u7528\u4e0d\u751f\u6210\u6587\u672c\u7684 System One \u6a21\u578b Jev\uff0c\u5728\u8fd150\u4e07\u6761\u5fb7\u5dde\u4e8b\u6545\u53d9\u8ff0\u4e0a\u63d0\u53d6\u7ed3\u6784\u5316\u53d8\u91cf\u3002\u7814\u7a76\u8fd8\u7ed9\u51fa\u4eba\u5de5\u62bd\u68c0\u3001\u6821\u51c6\u3001\u91cd\u6821\u51c6\u4e0e\u5ba1\u6838\u9884\u7b97\u7684\u8bc4\u4f30\u6846\u67b6\u3002", "why_notable": "\u5b83\u63d0\u4f9b\u4e86\u4e00\u79cd\u9762\u5411\u5927\u89c4\u6a21\u516c\u5171\u5b89\u5168\u6587\u672c\u7684\u53ef\u5ba1\u8ba1\u3001\u4f4e\u6210\u672c\u3001\u6982\u7387\u5316\u4fe1\u606f\u62bd\u53d6\u65b9\u6848\uff0c\u907f\u514d\u81ea\u7531\u6587\u672c\u751f\u6210\u5e26\u6765\u7684\u4e0d\u53ef\u9a8c\u8bc1\u95ee\u9898\uff0c\u5e76\u80fd\u91cf\u5316\u4eba\u5de5\u590d\u6838\u9700\u6c42\uff1b\u65b0\u589e\u6821\u51c6\u53d8\u91cf\u663e\u8457\u6539\u53d8\u5bf9\u4e8b\u6545\u81f4\u56e0\u7684\u7edf\u8ba1\u4f30\u8ba1\uff0c\u5177\u6709\u5b9e\u9645\u653f\u7b56\u4e0e\u6570\u636e\u6cbb\u7406\u4ef7\u503c\u3002"}, {"abstract": "Tool-use agent traces identify messages and API calls, but procedural analyses also need explicit units of action and inspectable links to their evidence. We present Canonical Procedural Actions (CPAs), an annotation protocol that records a procedural function, its first agent-event anchor, the agent events that realize it, and separate contextual evidence. Multiple actions may share a message anchor without an inferred within-message order. A retail case study produces a versioned 24-entry codebook through open induction, recorded consolidation, and successive application audits. Two isolated LLM contexts annotate 32 trajectories disjoint from development at the trajectory level, producing 499 and 491 occurrences with anchor-label overlap A=0.982. Requiring identical context-event references reduces overlap to 0.798. These are structural repeatability measures, not semantic accuracy: 16 of 26 task IDs also occur in development, and historical tool payloads were truncated to 110 characters. Retrospective controls show that collapsing all labels raises overlap to 0.986, while simple endpoint rules reproduce the tool-anchored portion with 0.997 overlap. Assistant-message actions have 0.971 overlap, with a per-label minimum of 0.816. Applying the frozen codebook to 244 further trajectories yields 4,058 records, including eight diagnostic outcomes. The contribution is an explicit, auditable annotation instrument and a case study of its construction and measurement limits; human-reference validity and downstream utility remain to be established.", "arxiv_id": "2609.24264", "arxiv_url": "https://arxiv.org/abs/2609.24264", "authors": ["Songqi Li", "Dongqing Li", "Zheqiao Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa Canonical Procedural Actions\uff08CPA\uff09\uff0c\u7528\u4e8e\u628a\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u8f68\u8ff9\u4e2d\u7684\u6d88\u606f\u3001API \u8c03\u7528\u4e0e\u66f4\u9ad8\u5c42\u7684\u8fc7\u7a0b\u6027\u52a8\u4f5c\u663e\u5f0f\u5bf9\u9f50\u3002\u5b83\u8bb0\u5f55\u52a8\u4f5c\u529f\u80fd\u3001\u9996\u4e2a\u4e8b\u4ef6\u951a\u70b9\u3001\u5b9e\u73b0\u8be5\u52a8\u4f5c\u7684\u4e8b\u4ef6\u4ee5\u53ca\u72ec\u7acb\u4e0a\u4e0b\u6587\u8bc1\u636e\uff0c\u5e76\u901a\u8fc7\u96f6\u552e\u573a\u666f\u6848\u4f8b\u6784\u5efa\u548c\u5ba1\u8ba1\u6807\u6ce8\u624b\u518c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24264", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u6784\u5efa\u4e86\u4e00\u4e2a\u7248\u672c\u5316\u7684 24 \u9879\u4ee3\u7801\u672c\uff0c\u5e76\u901a\u8fc7\u5f00\u653e\u5f52\u7eb3\u3001\u5408\u5e76\u8bb0\u5f55\u548c\u591a\u8f6e\u5e94\u7528\u5ba1\u8ba1\u5f62\u6210\u6807\u6ce8\u534f\u8bae\u3002", "\u4e24\u4e2a\u9694\u79bb LLM \u6807\u6ce8\u4e0a\u4e0b\u6587\u5728 32 \u6761\u672a\u53c2\u4e0e\u5f00\u53d1\u7684\u8f68\u8ff9\u4e0a\u5206\u522b\u5f97\u5230 499 \u548c 491 \u4e2a\u52a8\u4f5c\u5b9e\u4f8b\uff0c\u951a\u70b9-\u6807\u7b7e\u91cd\u53e0\u7387\u8fbe 0.982\uff1b\u82e5\u8981\u6c42\u4e0a\u4e0b\u6587\u4e8b\u4ef6\u5f15\u7528\u5b8c\u5168\u4e00\u81f4\uff0c\u91cd\u53e0\u7387\u964d\u81f3 0.798\u3002", "\u5c06\u51bb\u7ed3\u4ee3\u7801\u672c\u5e94\u7528\u5230\u989d\u5916 244 \u6761\u8f68\u8ff9\uff0c\u751f\u6210 4,058 \u6761\u8bb0\u5f55\u548c 8 \u7c7b\u8bca\u65ad\u7ed3\u679c\uff0c\u4f46\u4f5c\u8005\u5f3a\u8c03\u8fd9\u8861\u91cf\u7684\u662f\u7ed3\u6784\u53ef\u91cd\u590d\u6027\u800c\u975e\u8bed\u4e49\u51c6\u786e\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u6570\u636e\u6807\u6ce8", "\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24264v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Canonical Procedural Actions: An Auditable Annotation Protocol for Tool-Use Agent Traces", "tldr": "\u63d0\u51fa\u53ef\u5ba1\u8ba1\u7684\u5de5\u5177\u667a\u80fd\u4f53\u884c\u4e3a\u6807\u6ce8\u534f\u8bae", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Canonical Procedural Actions\uff08CPA\uff09\uff0c\u7528\u4e8e\u628a\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u8f68\u8ff9\u4e2d\u7684\u6d88\u606f\u3001API \u8c03\u7528\u4e0e\u66f4\u9ad8\u5c42\u7684\u8fc7\u7a0b\u6027\u52a8\u4f5c\u663e\u5f0f\u5bf9\u9f50\u3002\u5b83\u8bb0\u5f55\u52a8\u4f5c\u529f\u80fd\u3001\u9996\u4e2a\u4e8b\u4ef6\u951a\u70b9\u3001\u5b9e\u73b0\u8be5\u52a8\u4f5c\u7684\u4e8b\u4ef6\u4ee5\u53ca\u72ec\u7acb\u4e0a\u4e0b\u6587\u8bc1\u636e\uff0c\u5e76\u901a\u8fc7\u96f6\u552e\u573a\u666f\u6848\u4f8b\u6784\u5efa\u548c\u5ba1\u8ba1\u6807\u6ce8\u624b\u518c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u8bc4\u4f30\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u201c\u53ef\u5ba1\u8ba1\u8fc7\u7a0b\u6807\u6ce8\u201d\u95ee\u9898\uff0c\u4e3a\u5206\u6790\u667a\u80fd\u4f53\u8f68\u8ff9\u3001\u590d\u73b0\u5b9e\u9a8c\u548c\u6784\u5efa\u8bca\u65ad\u6570\u636e\u63d0\u4f9b\u4e86\u66f4\u900f\u660e\u7684\u4e2d\u95f4\u8868\u793a\u3002\u4e0d\u8fc7\u5176\u4eba\u5de5\u53c2\u8003\u6709\u6548\u6027\u4e0e\u4e0b\u6e38\u5b9e\u7528\u4ef7\u503c\u4ecd\u9700\u8fdb\u4e00\u6b65\u9a8c\u8bc1\u3002"}, {"abstract": "Functional annotation of newly sequenced proteins remains a bottleneck in molecular biology: the number of sequences in public repositories grows far faster than the capacity for manual curation. Most computational approaches consider annotation as multi-label classification over a fixed ontology, which constrains predictions to a predefined label set. In this work we study the the protein annotation as a sequence-to-text generation problem. We fine-tune the 3B-parameter Ministral 3 base model with QLoRA (4-bit NF4 quantization with low-rank adapters) on sequence annotation pairs. We assess predictions with an LLM-as-expert protocol: a GPT model prompted as a senior molecular-biology curator scores organism identification as binary and function annotation quality. We conclude that QLoRA-fine-tuned compact LLMs can generate curator-style annotations with genuine biological value for a substantial subset of proteins. We also discuss future directions in data quality, model scaling, and evidence grounding that are needed to make the approach sufficiently reliable for practical use.", "arxiv_id": "2609.24538", "arxiv_url": "https://arxiv.org/abs/2609.24538", "authors": ["Demian Pavlyshenko", "Bohdan Pavlyshenko"], "brief": "\u8bba\u6587\u5c06\u86cb\u767d\u8d28\u529f\u80fd\u6ce8\u91ca\u4ece\u56fa\u5b9a\u672c\u4f53\u7684\u591a\u6807\u7b7e\u5206\u7c7b\uff0c\u6539\u5199\u4e3a\u5e8f\u5217\u5230\u6587\u672c\u751f\u6210\u4efb\u52a1\u3002\u4f5c\u8005\u7528QLoRA\u5fae\u8c033B\u53c2\u6570Ministral\u6a21\u578b\uff0c\u4f7f\u5176\u6839\u636e\u86cb\u767d\u5e8f\u5217\u751f\u6210\u7c7b\u4f3c\u4eba\u5de5\u7b56\u5c55\u5458\u98ce\u683c\u7684\u529f\u80fd\u6ce8\u91ca\u3002", "categories": ["cs.CL", "cs.AI", "cs.NE", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24538", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u75284-bit NF4\u91cf\u5316\u4e0e\u4f4e\u79e9\u9002\u914d\u5668\u7684QLoRA\u65b9\u6848\uff0c\u4f4e\u6210\u672c\u5fae\u8c03\u7d27\u51d1\u578b\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0d\u5c40\u9650\u4e8e\u9884\u5b9a\u4e49\u6807\u7b7e\u96c6\uff0c\u800c\u662f\u751f\u6210\u81ea\u7531\u6587\u672c\u5f62\u5f0f\u7684\u86cb\u767d\u529f\u80fd\u4e0e\u751f\u7269\u5b66\u63cf\u8ff0", "\u4f7f\u7528LLM-as-expert\u8bc4\u4f30\u534f\u8bae\uff0c\u8ba9GPT\u626e\u6f14\u9ad8\u7ea7\u5206\u5b50\u751f\u7269\u5b66\u7b56\u5c55\u5458\uff0c\u5bf9\u7269\u79cd\u8bc6\u522b\u548c\u529f\u80fd\u6ce8\u91ca\u8d28\u91cf\u6253\u5206"], "keywords": ["\u86cb\u767d\u8d28\u6ce8\u91ca", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u751f\u7269\u4fe1\u606f\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24538v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "QLoRA Fine-Tuning of Ministral LLM for Sequence-to-Function Protein Annotation", "tldr": "\u7528QLoRA\u5fae\u8c03\u5c0f\u578bLLM\u751f\u6210\u86cb\u767d\u529f\u80fd\u6ce8\u91ca", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u86cb\u767d\u8d28\u529f\u80fd\u6ce8\u91ca\u4ece\u56fa\u5b9a\u672c\u4f53\u7684\u591a\u6807\u7b7e\u5206\u7c7b\uff0c\u6539\u5199\u4e3a\u5e8f\u5217\u5230\u6587\u672c\u751f\u6210\u4efb\u52a1\u3002\u4f5c\u8005\u7528QLoRA\u5fae\u8c033B\u53c2\u6570Ministral\u6a21\u578b\uff0c\u4f7f\u5176\u6839\u636e\u86cb\u767d\u5e8f\u5217\u751f\u6210\u7c7b\u4f3c\u4eba\u5de5\u7b56\u5c55\u5458\u98ce\u683c\u7684\u529f\u80fd\u6ce8\u91ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63a2\u7d22\u4e86\u7528\u751f\u6210\u5f0fLLM\u7f13\u89e3\u86cb\u767d\u6ce8\u91ca\u74f6\u9888\u7684\u53ef\u884c\u6027\uff0c\u5c55\u793a\u5c0f\u578b\u5fae\u8c03\u6a21\u578b\u5728\u90e8\u5206\u86cb\u767d\u4e0a\u53ef\u4ea7\u51fa\u6709\u751f\u7269\u5b66\u4ef7\u503c\u7684\u6ce8\u91ca\uff1b\u4f46\u5b9e\u9645\u5e94\u7528\u4ecd\u4f9d\u8d56\u66f4\u9ad8\u8d28\u91cf\u6570\u636e\u3001\u6a21\u578b\u6269\u5c55\u4e0e\u8bc1\u636e\u6eaf\u6e90\u3002"}, {"abstract": "Speech-to-text engines are extremely needed nowadays for different applications, representing an essential enabler in human-robot interaction. Still, some languages suffer from the lack of labeled speech data, especially in the Arabic dialects or any low-resource languages. The need for a self-supervised training process and self-training using noisy training is proven to be one of the up-and-coming feasible solutions. This article proposes an end-to-end, transformers-based model with a framework for low-resource languages. In addition, the framework incorporates customized audio-to-text processing algorithms to achieve a highly efficient Jordanian Arabic dialect speech-to-text system. The proposed framework enables ingesting data from many sources, making the ground truth from external sources possible by speeding up the manual annotation process. The framework allows the training process using noisy student training and self-supervised learning to utilize the unlabeled data in both pre- and post-training stages and incorporate multiple types of data augmentation. The proposed self-training approach outperforms the fine-tuned Wav2Vec model by 5% in terms of word error rate reduction. The outcome of this work provides the research community with a Jordanian-spoken data set along with an end-to-end approach to deal with low-resource languages. This is done by utilizing the power of the pretraining, post-training, and injecting noisy labeled and augmented data with minimal human intervention. It enables the development of new applications in the field of Arabic language speech-to-text area like the question-answering systems and intelligent control systems, and it will add human-like perception and hearing sensors to intelligent robots.", "arxiv_id": "2609.24410", "arxiv_url": "https://arxiv.org/abs/2609.24410", "authors": ["Ali A. Safieh", "Ibrahim Abu Alhaol", "Rawan Ghnemat"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7aef\u5230\u7aef\u3001\u57fa\u4e8e Transformer \u7684\u7ea6\u65e6\u963f\u62c9\u4f2f\u8bed\u65b9\u8a00 speech-to-text \u6846\u67b6\uff0c\u9762\u5411\u4f4e\u8d44\u6e90\u8bed\u8a00\u573a\u666f\u3002\u6846\u67b6\u7ed3\u5408\u81ea\u76d1\u7763\u5b66\u4e60\u3001\u566a\u58f0\u5b66\u751f\u8bad\u7ec3\u3001\u6570\u636e\u589e\u5f3a\u4e0e\u534a\u81ea\u52a8\u6807\u6ce8\u6d41\u7a0b\uff0c\u4ee5\u5145\u5206\u5229\u7528\u672a\u6807\u6ce8\u548c\u566a\u58f0\u6807\u6ce8\u8bed\u97f3\u6570\u636e\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24410", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u652f\u6301\u4ece\u591a\u6e90\u6570\u636e\u6444\u53d6\u8bed\u97f3\uff0c\u5e76\u901a\u8fc7\u5916\u90e8\u8d44\u6e90\u751f\u6210 ground truth\uff0c\u52a0\u901f\u4eba\u5de5\u6807\u6ce8\u6d41\u7a0b", "\u5728\u9884\u8bad\u7ec3\u548c\u540e\u8bad\u7ec3\u9636\u6bb5\u5229\u7528\u672a\u6807\u6ce8\u6570\u636e\uff0c\u7ed3\u5408 noisy student training \u4e0e\u591a\u79cd\u97f3\u9891\u6570\u636e\u589e\u5f3a", "\u76f8\u6bd4\u5fae\u8c03 Wav2Vec \u6a21\u578b\uff0c\u8bcd\u9519\u8bef\u7387\u76f8\u5bf9\u964d\u4f4e\u7ea6 5%\uff0c\u5e76\u53d1\u5e03\u7ea6\u65e6\u53e3\u8bed\u6570\u636e\u96c6"], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u963f\u62c9\u4f2f\u8bed"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24410v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "End-to-end Jordanian dialect speech-to-text self-supervised learning framework", "tldr": "\u9762\u5411\u7ea6\u65e6\u963f\u8bed\u65b9\u8a00\u7684\u4f4e\u8d44\u6e90\u8bed\u97f3\u8bc6\u522b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7aef\u5230\u7aef\u3001\u57fa\u4e8e Transformer \u7684\u7ea6\u65e6\u963f\u62c9\u4f2f\u8bed\u65b9\u8a00 speech-to-text \u6846\u67b6\uff0c\u9762\u5411\u4f4e\u8d44\u6e90\u8bed\u8a00\u573a\u666f\u3002\u6846\u67b6\u7ed3\u5408\u81ea\u76d1\u7763\u5b66\u4e60\u3001\u566a\u58f0\u5b66\u751f\u8bad\u7ec3\u3001\u6570\u636e\u589e\u5f3a\u4e0e\u534a\u81ea\u52a8\u6807\u6ce8\u6d41\u7a0b\uff0c\u4ee5\u5145\u5206\u5229\u7528\u672a\u6807\u6ce8\u548c\u566a\u58f0\u6807\u6ce8\u8bed\u97f3\u6570\u636e\u3002", "why_notable": "\u963f\u62c9\u4f2f\u65b9\u8a00\u8bed\u97f3\u8bc6\u522b\u957f\u671f\u53d7\u9650\u4e8e\u6807\u6ce8\u6570\u636e\u7a00\u7f3a\uff0c\u672c\u6587\u63d0\u4f9b\u4e86\u9762\u5411\u4f4e\u8d44\u6e90\u65b9\u8a00\u7684\u5b8c\u6574\u8bad\u7ec3\u6846\u67b6\u548c\u6570\u636e\u8d44\u6e90\uff0c\u5bf9\u963f\u8bed\u8bed\u97f3\u52a9\u624b\u3001\u95ee\u7b54\u7cfb\u7edf\u3001\u667a\u80fd\u63a7\u5236\u548c\u673a\u5668\u4eba\u542c\u89c9\u611f\u77e5\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Post-training often improves task performance but can degrade confidence calibration, leaving post-trained language models (PoLMs) more overconfident than their corresponding pretrained language models (PLMs). Because task-specific labeled calibration data can be costly or unavailable, the corresponding pretrained PLM provides a natural label-free reference for post-hoc calibration. Prior agreement-gated PLM-referenced calibration fits a scalar temperature using only examples on which the PoLM and its PLM reference agree, excluding disagreement examples because direct alignment can drive the fitted temperature excessively high and induce under-confidence. We revisit this binary treatment. A controlled reintroduction diagnostic reveals a non-monotonic aggregate effect: admitting a moderate fraction of disagreement examples can improve calibration, whereas the benefit diminishes as unit-weight inclusion approaches the full disagreement set. We introduce SupportCal, a label-free post-hoc method that retains agreement examples at unit weight and assigns disagreement examples continuous weights based on the own-base PLM\u0027s relative support and corroboration from pretrained references selected from a size-compatible candidate pool. We further characterize when the resulting weighted objective admits a finite optimal temperature. Across MedMCQA and MathQA, SupportCal yields lower ECE than the agreement-only baseline for nearly all evaluated target-model configurations; supplementary TweetEval Sentiment results show the same pattern on a fixed-label classification task.", "arxiv_id": "2609.24303", "arxiv_url": "https://arxiv.org/abs/2609.24303", "authors": ["Linhan Luo", "Lequan Lin", "Dai Shi", "Feng Chen", "Jos\u00e9 Miguel Hern\u00e1ndez-Lobato", "Junbin Gao"], "brief": "\u672c\u6587\u63d0\u51fa SupportCal\uff0c\u4e00\u79cd\u9762\u5411\u540e\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u65e0\u6807\u7b7e\u540e\u9a8c\u7f6e\u4fe1\u5ea6\u6821\u51c6\u65b9\u6cd5\u3002\u5b83\u5229\u7528\u5bf9\u5e94\u9884\u8bad\u7ec3\u6a21\u578b\u53ca\u540c\u89c4\u6a21\u9884\u8bad\u7ec3\u53c2\u8003\u6a21\u578b\uff0c\u5bf9\u6a21\u578b\u5206\u6b67\u6837\u672c\u8fdb\u884c\u8fde\u7eed\u52a0\u6743\uff0c\u800c\u975e\u7b80\u5355\u4e22\u5f03\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24303", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u5206\u6b67\u6837\u672c\u5e76\u975e\u5168\u65e0\u4ef7\u503c\uff1a\u9002\u5ea6\u7eb3\u5165\u53ef\u6539\u5584\u6821\u51c6\uff0c\u4f46\u5168\u91cf\u7b49\u6743\u7eb3\u5165\u4f1a\u5bfc\u81f4\u6e29\u5ea6\u8fc7\u9ad8\u548c\u6b20\u7f6e\u4fe1\u3002", "SupportCal \u5bf9\u4e00\u81f4\u6837\u672c\u8d4b\u4e88\u5355\u4f4d\u6743\u91cd\uff0c\u5bf9\u5206\u6b67\u6837\u672c\u4f9d\u636e\u81ea\u6709 PLM \u7684\u76f8\u5bf9\u652f\u6301\u5ea6\u548c\u5176\u4ed6\u9884\u8bad\u7ec3\u53c2\u8003\u6a21\u578b\u7684\u4f50\u8bc1\u7a0b\u5ea6\u52a0\u6743\u3002", "\u5728 MedMCQA\u3001MathQA \u4ee5\u53ca TweetEval Sentiment \u4e0a\uff0cSupportCal \u7684 ECE \u51e0\u4e4e\u5168\u9762\u4f4e\u4e8e\u4ec5\u4f7f\u7528\u4e00\u81f4\u6837\u672c\u7684\u57fa\u7ebf\u3002"], "keywords": ["\u6a21\u578b\u6821\u51c6", "\u5927\u8bed\u8a00\u6a21\u578b", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24303v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "SupportCal: Label-Free Calibration of Post-Trained LLMs via Reference Support and Corroboration", "tldr": "\u7528\u9884\u8bad\u7ec3\u6a21\u578b\u652f\u6301\u5ea6\u65e0\u6807\u7b7e\u6821\u51c6\u540e\u8bad\u7ec3LLM", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa SupportCal\uff0c\u4e00\u79cd\u9762\u5411\u540e\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u65e0\u6807\u7b7e\u540e\u9a8c\u7f6e\u4fe1\u5ea6\u6821\u51c6\u65b9\u6cd5\u3002\u5b83\u5229\u7528\u5bf9\u5e94\u9884\u8bad\u7ec3\u6a21\u578b\u53ca\u540c\u89c4\u6a21\u9884\u8bad\u7ec3\u53c2\u8003\u6a21\u578b\uff0c\u5bf9\u6a21\u578b\u5206\u6b67\u6837\u672c\u8fdb\u884c\u8fde\u7eed\u52a0\u6743\uff0c\u800c\u975e\u7b80\u5355\u4e22\u5f03\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e0d\u4f9d\u8d56\u4efb\u52a1\u6807\u6ce8\u6821\u51c6\u96c6\uff0c\u9002\u5408\u771f\u5b9e\u573a\u666f\u4e2d\u96be\u4ee5\u83b7\u53d6\u6821\u51c6\u6807\u7b7e\u7684\u540e\u8bad\u7ec3 LLM\uff1b\u540c\u65f6\u6539\u8fdb\u4e86\u4ee5 PLM \u4e3a\u53c2\u8003\u7684\u6e29\u5ea6\u7f29\u653e\u7b56\u7565\uff0c\u5bf9\u63d0\u5347\u6a21\u578b\u7f6e\u4fe1\u5ea6\u53ef\u9760\u6027\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) have shown remarkable progress in natural language understanding, yet their effectiveness in specialized fields like astronomy and astrodynamics remains limited due to challenges in multi-step reasoning, symbolic manipulation, and domain-specific terminology. To address this, we present Taramandal-GPT (Constellation-GPT), a domain-adapted framework built on the Qwen3-8b backbone, enhanced with a Retrieval-Augmented Generation (RAG) pipeline and a fallback mechanism for improved contextual precision. We evaluate it on the Astrodynamics Problems Benchmark (APBench), a dataset of 299 questions covering foundational to advanced levels of space science. Using a dual evaluation method - numeric margin-based scoring and semantic similarity assessment - Taramandal-GPT achieves competitive performance against state-of-the-art open- and closed-source models, with notable strength in thinking-intensive tasks. These results highlight the value of specialized LLMs for domains demanding accuracy and interpretability, positioning Taramandal-GPT as a step toward reliable Artificial Intelligence (AI) assistants for astrophysics, spacecraft engineering, and space exploration.", "arxiv_id": "2609.24246", "arxiv_url": "https://arxiv.org/abs/2609.24246", "authors": ["Akhil Sharma", "Jatin Gupta", "Ali Imam Abidi"], "brief": "\u8bba\u6587\u63d0\u51fa Taramandal-GPT\uff0c\u4e00\u4e2a\u57fa\u4e8e Qwen3-8B \u7684\u5929\u4f53\u52a8\u529b\u5b66\u9886\u57df\u9002\u914d\u6846\u67b6\uff0c\u7ed3\u5408\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u4e0e\u56de\u9000\u673a\u5236\u6765\u63d0\u5347\u4e13\u4e1a\u95ee\u9898\u6c42\u89e3\u3002\u4f5c\u8005\u5728 APBench 299\u9053\u7a7a\u95f4\u79d1\u5b66\u9898\u4e0a\u8bc4\u4f30\uff0c\u8986\u76d6\u57fa\u7840\u5230\u9ad8\u7ea7\u96be\u5ea6\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24246", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165 RAG \u6d41\u6c34\u7ebf\u4e0e\u56de\u9000\u673a\u5236\uff0c\u63d0\u9ad8\u5929\u4f53\u52a8\u529b\u5b66\u672f\u8bed\u3001\u516c\u5f0f\u548c\u4e0a\u4e0b\u6587\u5339\u914d\u7684\u51c6\u786e\u6027", "\u91c7\u7528\u6570\u503c\u8bef\u5dee\u8fb9\u754c\u8bc4\u5206\u4e0e\u8bed\u4e49\u76f8\u4f3c\u5ea6\u8bc4\u4f30\u7684\u53cc\u91cd\u8bc4\u4ef7\u65b9\u6cd5", "\u5728\u601d\u8003\u5bc6\u96c6\u578b\u4efb\u52a1\u4e0a\u8868\u73b0\u7a81\u51fa\uff0c\u53ef\u4e0e\u90e8\u5206\u5f00\u6e90\u548c\u95ed\u6e90\u5148\u8fdb\u6a21\u578b\u7ade\u4e89"], "keywords": ["\u9886\u57df\u5927\u6a21\u578b", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u79d1\u5b66\u63a8\u7406", "\u822a\u5929"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24246v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Taramandal-GPT: Enhancing Astrodynamics Problem-Solving with Knowledge Retrieval and Structured Thinking", "tldr": "\u9762\u5411\u5929\u4f53\u52a8\u529b\u5b66\u7684RAG\u589e\u5f3a\u4e13\u7528LLM\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Taramandal-GPT\uff0c\u4e00\u4e2a\u57fa\u4e8e Qwen3-8B \u7684\u5929\u4f53\u52a8\u529b\u5b66\u9886\u57df\u9002\u914d\u6846\u67b6\uff0c\u7ed3\u5408\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u4e0e\u56de\u9000\u673a\u5236\u6765\u63d0\u5347\u4e13\u4e1a\u95ee\u9898\u6c42\u89e3\u3002\u4f5c\u8005\u5728 APBench 299\u9053\u7a7a\u95f4\u79d1\u5b66\u9898\u4e0a\u8bc4\u4f30\uff0c\u8986\u76d6\u57fa\u7840\u5230\u9ad8\u7ea7\u96be\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5c0f\u89c4\u6a21\u9886\u57df\u9002\u914d\u6a21\u578b\u901a\u8fc7\u77e5\u8bc6\u68c0\u7d22\u548c\u7ed3\u6784\u5316\u63a8\u7406\u53ef\u5728\u9ad8\u7cbe\u5ea6\u79d1\u5b66\u5de5\u7a0b\u4efb\u52a1\u4e2d\u83b7\u5f97\u5b9e\u7528\u80fd\u529b\uff0c\u5bf9\u6784\u5efa\u53ef\u9760\u7684\u822a\u5929\u3001\u5929\u4f53\u7269\u7406 AI \u52a9\u624b\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Traditionally, the reliability of news publishers is assessed by expert organisations that evaluate editorial practices, transparency and factual standards at source. When this process is translated into a computational approach, the problem is often formulated at the level of individual articles, with models being trained on a set of pre-labelled articles and their performance being evaluated in a test phase. In this work, we investigate news source reliability inference as a source-level prediction problem. We propose a two-stage framework in which transformer-based language models first estimate the reliability of individual articles and subsequently aggregate article-level predictions to infer the reliability of previously unseen publishers. To approximate realistic deployment conditions, we enforce a strict publisher-disjoint evaluation protocol, ensuring that no publisher appears in both training and test sets. Experiments on 19,476 political news articles from 439 English-language publishers labeled with NewsGuard reliability ratings show that aggregation substantially improves robustness and performance, increasing accuracy from approximately 0.60 at the article level to 0.69 at the publisher level. Finally, we analyze how prediction errors vary across political orientations, revealing statistically significant associations between political leaning and misclassification patterns. Overall, our findings show that publisher reliability can be inferred from aggregated textual signals alone, supporting scalable and content-based approaches to automated news source assessment.", "arxiv_id": "2609.24219", "arxiv_url": "https://arxiv.org/abs/2609.24219", "authors": ["John Bianchi", "Manuel Pratelli", "Fabio Pinelli", "Marinella Petrocchi"], "brief": "\u672c\u6587\u5c06\u65b0\u95fb\u53ef\u9760\u6027\u8bc4\u4f30\u4ece\u5355\u7bc7\u6587\u7ae0\u5206\u7c7b\u63d0\u5347\u5230\u53d1\u5e03\u65b9\u5c42\u9762\uff0c\u63d0\u51fa\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u7528Transformer\u6a21\u578b\u9884\u6d4b\u6587\u7ae0\u53ef\u9760\u6027\uff0c\u518d\u805a\u5408\u591a\u7bc7\u6587\u7ae0\u7ed3\u679c\u63a8\u65ad\u672a\u89c1\u8fc7\u53d1\u5e03\u65b9\u7684\u53ef\u9760\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24219", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u4e25\u683c\u7684\u53d1\u5e03\u65b9\u4e0d\u91cd\u53e0\u8bc4\u4f30\u534f\u8bae\uff0c\u907f\u514d\u540c\u4e00\u65b0\u95fb\u6e90\u540c\u65f6\u51fa\u73b0\u5728\u8bad\u7ec3\u96c6\u548c\u6d4b\u8bd5\u96c6\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u90e8\u7f72\u573a\u666f", "\u5728439\u5bb6\u82f1\u6587\u65b0\u95fb\u53d1\u5e03\u65b9\u768419,476\u7bc7\u653f\u6cbb\u65b0\u95fb\u4e0a\u5b9e\u9a8c\uff0c\u6807\u7b7e\u6765\u81eaNewsGuard\u53ef\u9760\u6027\u8bc4\u7ea7", "\u805a\u5408\u540e\u53d1\u5e03\u65b9\u5c42\u9762\u51c6\u786e\u7387\u7ea60.69\uff0c\u663e\u8457\u9ad8\u4e8e\u5355\u7bc7\u6587\u7ae0\u5c42\u9762\u7684\u7ea60.60\uff0c\u5e76\u5206\u6790\u4e86\u653f\u6cbb\u503e\u5411\u4e0e\u8bef\u5206\u7c7b\u6a21\u5f0f\u7684\u7edf\u8ba1\u5173\u8054"], "keywords": ["\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u65b0\u95fb\u53ef\u4fe1\u5ea6", "\u6587\u672c\u5206\u7c7b", "\u4fe1\u606f\u8d28\u91cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24219v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "From Articles to Publishers: Aggregating Language Model Predictions for News Source Reliability Inference", "tldr": "\u805a\u5408\u6587\u7ae0\u9884\u6d4b\u53ef\u63a8\u65ad\u65b0\u95fb\u6e90\u53ef\u9760\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u5c06\u65b0\u95fb\u53ef\u9760\u6027\u8bc4\u4f30\u4ece\u5355\u7bc7\u6587\u7ae0\u5206\u7c7b\u63d0\u5347\u5230\u53d1\u5e03\u65b9\u5c42\u9762\uff0c\u63d0\u51fa\u4e24\u9636\u6bb5\u6846\u67b6\uff1a\u5148\u7528Transformer\u6a21\u578b\u9884\u6d4b\u6587\u7ae0\u53ef\u9760\u6027\uff0c\u518d\u805a\u5408\u591a\u7bc7\u6587\u7ae0\u7ed3\u679c\u63a8\u65ad\u672a\u89c1\u8fc7\u53d1\u5e03\u65b9\u7684\u53ef\u9760\u6027\u3002", "why_notable": "\u8bba\u6587\u5f3a\u8c03\u65b0\u95fb\u6e90\u53ef\u9760\u6027\u5e94\u5728\u53d1\u5e03\u65b9\u5c42\u9762\u5efa\u6a21\uff0c\u5e76\u8bc1\u660e\u4ec5\u51ed\u6587\u672c\u4fe1\u53f7\u805a\u5408\u5373\u53ef\u83b7\u5f97\u66f4\u7a33\u5065\u7684\u81ea\u52a8\u5316\u8bc4\u4f30\uff0c\u4e3a\u5927\u89c4\u6a21\u65b0\u95fb\u6e90\u4fe1\u8a89\u76d1\u6d4b\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Evaluation scores used around LLM systems -- including reward models, rerankers, and LLM judges -- can track surface form instead of the quality they claim to measure. When presented with a terse correct solution and a commented buggy solution for the same MBPP problem, a public preference reward model selects the correct one no better than a coin flip (0.507). Subtracting the predictable surface component from such scores is increasingly common, but removal alone does not yield a more valid measurement: the removed component may carry construct-relevant signal, and residualization cannot tell which is which. Under designed interventions -- unit-test labels with comment-only edits -- residualization attenuates the reward model\u0027s format effects by about 0.12 on both correct and buggy code, while the correct-versus-buggy margins move by less than 0.01. In observational NLI and QA settings, we freeze a held-out replication before scoring and re-evaluate it using labels from disjoint annotators; this supports only a narrower conclusion: better agreement with the construct labels on a pre-declared slice where a surface-only predictor errs, not a repaired score. Full-population agreement falls in every observational setting with a reported positive slice gain, and within-question ranking falls in every such QA setting. When construct and surface features are entangled, residualization can decorrelate a score while degrading construct alignment, and, in a controlled model, configurations just as damaging to construct alignment pass every pre-adjustment check, so no committed gate is a guarantee. We assemble these distinctions into a reporting protocol whose outcomes, refusal included, state what an adjusted score may be claimed to show: an audit-time diagnostic reported beside the construct-alignment cost it incurs, never a replacement for the raw score.", "arxiv_id": "2609.24194", "arxiv_url": "https://arxiv.org/abs/2609.24194", "authors": ["Daein Weon", "Dongho Kang"], "brief": "\u8bba\u6587\u7814\u7a76 LLM \u8bc4\u4f30\u5206\u6570\u4e2d\u7531\u8868\u9762\u683c\u5f0f\u5f15\u8d77\u7684\u504f\u5dee\uff0c\u5e76\u7cfb\u7edf\u68c0\u9a8c\u201c\u6b8b\u5dee\u5316\u201d\u53bb\u9664\u53ef\u9884\u6d4b\u8868\u9762\u6210\u5206\u7684\u6548\u679c\u3002\u7ed3\u679c\u8868\u660e\uff0c\u6b8b\u5dee\u5316\u80fd\u5728\u7279\u5b9a\u5207\u7247\u4e0a\u51cf\u5f31\u683c\u5f0f\u6548\u5e94\uff0c\u4f46\u4e5f\u53ef\u80fd\u964d\u4f4e\u4e0e\u771f\u5b9e\u6784\u5ff5\u6807\u7b7e\u7684\u4e00\u81f4\u6027\uff0c\u4e0d\u80fd\u88ab\u5f53\u4f5c\u4fee\u590d\u540e\u7684\u65b0\u8bc4 gh-conflict review scenarios. The code and implementation details are publicly available at https://github.com/Wangxz729/reliability-aware-meta-review.", "arxiv_id": "2609.24028", "arxiv_url": "https://arxiv.org/abs/2609.24028", "authors": ["Xinzhe Wang", "Fei Tao", "Jiang Xie", "Hong Yu", "Ye Wang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u9760\u6027\u611f\u77e5\u7684\u5143\u8bc4\u5ba1\u751f\u6210\u6846\u67b6\uff0c\u4e0d\u518d\u5c06\u591a\u4efd\u5ba1\u7a3f\u610f\u89c1\u7b49\u6743\u6c47\u603b\uff0c\u800c\u662f\u8bc6\u522b\u4e0d\u540c\u65b9\u9762\u4e0b\u7684\u610f\u89c1\u51b2\u7a81\u5e76\u8bc4\u4f30\u8bc1\u636e\u53ef\u9760\u6027\u3002\u6a21\u578b\u636e\u6b64\u52a0\u6743\u751f\u6210\u5143\u8bc4\u5ba1\uff0c\u4f18\u5148\u91c7\u7eb3\u66f4\u6709\u652f\u6301\u5ea6\u3001\u66f4\u9ad8\u8d28\u91cf\u7684\u8bba\u636e\uff0c\u540c\u65f6\u4fdd\u7559\u591a\u5143\u89c2\u70b9\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24028", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u62bd\u53d6\u5ba1\u7a3f\u610f\u89c1\u4e2d\u7684\u65b9\u9762\u7ea7\u89c2\u70b9\uff0c\u5e76\u5728\u6bcf\u4e2a\u65b9\u9762\u5185\u8bc6\u522b\u76f8\u4e92\u51b2\u7a81\u7684\u8bc1\u636e", "\u540c\u65f6\u4f30\u8ba1\u89c2\u70b9\u7ea7\u652f\u6301\u5ea6\u4e0e\u5ba1\u7a3f\u7ea7\u8d28\u91cf\uff0c\u7528\u4e8e\u8861\u91cf\u4e0d\u540c\u53cd\u9988\u7684\u53ef\u9760\u6027", "\u5728\u81ea\u52a8\u8bc4\u6d4b\u548c\u4eba\u5de5\u8bc4\u6d4b\u4e2d\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5c24\u5176\u5728\u9ad8\u51b2\u7a81\u5ba1\u7a3f\u573a\u666f\u4e0b\u63d0\u5347\u51b2\u7a81\u8bc6\u522b\u4e0e\u89e3\u51b3\u80fd\u529b"], "keywords": ["\u81ea\u7136\u8bed\u8a00\u751f\u6210", "\u591a\u6587\u6863\u6458\u8981", "\u5b66\u672f\u8bc4\u5ba1", "\u53ef\u9760\u6027\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24028v1", "published_at": "2026-09-21", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "When Evidence Conflicts: Reliability-aware Meta-review Generation", "tldr": "\u7528\u53ef\u9760\u6027\u52a0\u6743\u89e3\u51b3\u5143\u8bc4\u5ba1\u4e2d\u7684\u8bc1\u636e\u51b2\u7a81", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u9760\u6027\u611f\u77e5\u7684\u5143\u8bc4\u5ba1\u751f\u6210\u6846\u67b6\uff0c\u4e0d\u518d\u5c06\u591a\u4efd\u5ba1\u7a3f\u610f\u89c1\u7b49\u6743\u6c47\u603b\uff0c\u800c\u662f\u8bc6\u522b\u4e0d\u540c\u65b9\u9762\u4e0b\u7684\u610f\u89c1\u51b2\u7a81\u5e76\u8bc4\u4f30\u8bc1\u636e\u53ef\u9760\u6027\u3002\u6a21\u578b\u636e\u6b64\u52a0\u6743\u751f\u6210\u5143\u8bc4\u5ba1\uff0c\u4f18\u5148\u91c7\u7eb3\u66f4\u6709\u652f\u6301\u5ea6\u3001\u66f4\u9ad8\u8d28\u91cf\u7684\u8bba\u636e\uff0c\u540c\u65f6\u4fdd\u7559\u591a\u5143\u89c2\u70b9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5b66\u672f\u8bc4\u5ba1\u6c47\u603b\u4e2d\u5e38\u89c1\u7684\u610f\u89c1\u51b2\u7a81\u95ee\u9898\uff0c\u5f15\u5165\u53ef\u9760\u6027\u5efa\u6a21\u800c\u975e\u7b80\u5355\u591a\u6587\u6863\u6458\u8981\uff0c\u6709\u52a9\u4e8e\u751f\u6210\u66f4\u516c\u6b63\u3001\u53ef\u89e3\u91ca\u4e14\u66f4\u7b26\u5408\u51b3\u7b56\u9700\u6c42\u7684\u5143\u8bc4\u5ba1\u3002"}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
