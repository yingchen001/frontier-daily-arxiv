u88ab\u52a8\u5904\u7406\u8f6c\u5411\u4e3b\u52a8\u9002\u5e94\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 LLM \u667a\u80fd\u4f53\u8303\u5f0f\u7cfb\u7edf\u6027\u5f15\u5165\u6570\u636e\u5e93\u4e0e\u6570\u636e\u79d1\u5b66\u57fa\u7840\u8bbe\u65bd\uff0c\u8bd5\u56fe\u628a\u4f20\u7edf\u6570\u636e\u7cfb\u7edf\u4ece\u9759\u6001\u3001\u4eba\u5de5\u8bbe\u8ba1\u7684\u5de5\u5177\u5347\u7ea7\u4e3a\u5177\u5907\u8bed\u4e49\u7406\u89e3\u3001\u4efb\u52a1\u89c4\u5212\u548c\u81ea\u6211\u4f18\u5316\u80fd\u529b\u7684\u81ea\u6cbb\u7cfb\u7edf\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u7814\u7a76\u6846\u67b6\u4ef7\u503c\u548c\u5de5\u7a0b\u843d\u5730\u6f5c\u529b\u3002"}, {"abstract": "Deploying Large Language Models (LLMs) in healthcare requires robust performance across two complementary dimensions - diagnostic reasoning: the convergent, evidence-driven task of inferring a patient\u0027s condition from clinical data to produce a diagnosis, and clinical healthcare reasoning: the broader, navigational judgment required to communicate, plan, and adapt across multi-turn clinical interactions where a single correct answer may not exist. Recent benchmarks such as HealthBench and MedXpertQA reveal persistent weaknesses in both areas, exposing failures in complex diagnostic scenarios and limitations in contextual, patient-centered dialogue. We introduce a sequential training framework that targets these facets using synthetic data and rubric-based reinforcement learning. First, we improve diagnostic reasoning using MedBullets-derived questions with rule- and rubric-guided Reinforcement Learning (RL). We then shift to clinical reasoning by generating 5.3k synthetic multi-turn scenarios, each paired with multi-dimensional rubrics to comprehensively assess the response. This approach yields over 10% improvement on MedXpertQA, and our 30B model achieves 50.1% accuracy on HealthBench-Hard, surpassing proprietary baselines including GPT-5 (thinking). Our results show that targeted synthetic datasets and rubric-based training can systematically improve both diagnostic and interactive clinical reasoning in medical LLMs.", "arxiv_id": "2609.24480", "arxiv_url": "https://arxiv.org/abs/2609.24480", "authors": ["Kalash Shah", "Kunal Singh", "Snehan J", "Shreyas Singh"], "brief": "\u8bba\u6587\u63d0\u51fa Fathom-Vaidya\uff0c\u4e00\u4e2a\u9762\u5411\u533b\u7597\u5927\u6a21\u578b\u7684\u987a\u5e8f\u8bad\u7ec3\u6846\u67b6\uff1a\u5148\u7528 MedBullets \u884d\u751f\u9898\u548c\u89c4\u5219/\u91cf\u89c4\u5f15\u5bfc\u7684\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u8bca\u65ad\u63a8\u7406\uff0c\u518d\u7528 5.3k \u5408\u6210\u591a\u8f6e\u4e34\u5e8a\u573a\u666f\u53ca\u591a\u7ef4\u91cf\u89c4\u8bad\u7ec3\u4ea4\u4e92\u5f0f\u4e34\u5e8a\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24480", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u533b\u7597\u63a8\u7406\u62c6\u5206\u4e3a\u8bca\u65ad\u63a8\u7406\u4e0e\u4e34\u5e8a\u4ea4\u4e92\u63a8\u7406\u4e24\u7c7b\u80fd\u529b\uff0c\u5e76\u91c7\u7528\u5206\u9636\u6bb5\u8bad\u7ec3\u5206\u522b\u4f18\u5316\u3002", "\u6784\u5efa 5.3k \u4e2a\u5408\u6210\u591a\u8f6e\u4e34\u5e8a\u573a\u666f\uff0c\u6bcf\u4e2a\u573a\u666f\u914d\u5957\u591a\u7ef4 rubric\uff0c\u7528\u4e8e\u66f4\u7ec6\u7c92\u5ea6\u8bc4\u4f30\u548c\u5956\u52b1\u5efa\u6a21\u3002", "\u5728 MedXpertQA \u4e0a\u63d0\u5347\u8d85\u8fc7 10%\uff0c30B \u6a21\u578b\u5728 HealthBench-Hard \u8fbe\u5230 50.1% \u51c6\u786e\u7387\uff0c\u8d85\u8fc7\u5305\u62ec GPT-5\uff08thinking\uff09\u5728\u5185\u7684\u4e13\u6709\u57fa\u7ebf\u3002"], "keywords": ["\u533b\u7597\u5927\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5408\u6210\u6570\u636e", "\u63a8\u7406\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24480v1", "published_at": "2026-09-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Fathom-Vaidya: Advancing Medical Reasoning with Rubric-Based Rewards", "tldr": "\u7528\u91cf\u89c4\u5956\u52b1\u63d0\u5347\u533b\u7597LLM\u8bca\u65ad\u4e0e\u4e34\u5e8a\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Fathom-Vaidya\uff0c\u4e00\u4e2a\u9762\u5411\u533b\u7597\u5927\u6a21\u578b\u7684\u987a\u5e8f\u8bad\u7ec3\u6846\u67b6\uff1a\u5148\u7528 MedBullets \u884d\u751f\u9898\u548c\u89c4\u5219/\u91cf\u89c4\u5f15\u5bfc\u7684\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u8bca\u65ad\u63a8\u7406\uff0c\u518d\u7528 5.3k \u5408\u6210\u591a\u8f6e\u4e34\u5e8a\u573a\u666f\u53ca\u591a\u7ef4\u91cf\u89c4\u8bad\u7ec3\u4ea4\u4e92\u5f0f\u4e34\u5e8a\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5408\u6210\u533b\u7597\u6570\u636e\u4e0e\u91cf\u89c4\u9a71\u52a8\u5f3a\u5316\u5b66\u4e60\u5728\u9ad8\u98ce\u9669\u533b\u7597\u573a\u666f\u4e2d\u7684\u5b9e\u7528\u6f5c\u529b\uff0c\u4e0d\u4ec5\u63d0\u5347\u5355\u7b54\u6848\u8bca\u65ad\u80fd\u529b\uff0c\u4e5f\u6539\u5584\u66f4\u8d34\u8fd1\u771f\u5b9e\u95ee\u8bca\u7684\u591a\u8f6e\u3001\u5f00\u653e\u5f0f\u4e34\u5e8a\u63a8\u7406\u8868\u73b0\u3002"}, {"abstract": "Medical image interpretation is central to diagnosis and care, yet adapting general-purpose multimodal large language models (MLLMs) often requires resource-intensive domain-specific fine-tuning. Here we introduce representation-guided in-context learning (RG-ICL), a training-free inference framework that retrieves query-aligned demonstrations using frozen encoders, without task-specific parameter updates. Across eight datasets spanning histopathology, radiology and retinal fundoscopy, RG-ICL improved classification (mean gain 20 percentage points) and visual question answering (VQA) (mean gain 13 percentage points) over no-context and conventional ICL, approaching or exceeding training-based comparators. Which cases were retrieved mattered more than how many: 6 query-aligned cases outperformed up to 32 randomly selected ones, whereas fixed or random cases often reduced accuracy below baseline. For VQA, aligning reference cases with both image content and question intent produced further gains. These findings indicate that for medical image interpretation, curating which reference cases an MLLM sees is a practical alternative to retraining it.", "arxiv_id": "2609.24057", "arxiv_url": "https://arxiv.org/abs/2609.24057", "authors": ["Minda Zhao", "Fangyu Hu", "Yan Luo", "Yutong Yang", "Jiahui Cai", "Kaichen Zhou", "Manling Li", "Paul Liang", "Yilun Du", "Lucy Q. Shen", "Mengyu Wang"], "brief": "\u63d0\u51fa\u8868\u793a\u5f15\u5bfc\u7684\u4e0a\u4e0b\u6587\u5b66\u4e60\uff08RG-ICL\uff09\uff0c\u7528\u51bb\u7ed3\u7f16\u7801\u5668\u68c0\u7d22\u4e0e\u67e5\u8be2\u5339\u914d\u7684\u533b\u5b66\u56fe\u50cf\u793a\u4f8b\uff0c\u5e2e\u52a9\u901a\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fdb\u884c\u5206\u7c7b\u548cVQA\uff0c\u65e0\u9700\u9886\u57df\u5fae\u8c03\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24057", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6\u75c5\u7406\u3001\u653e\u5c04\u3001\u773c\u5e95\u7b498\u4e2a\u6570\u636e\u96c6\uff0c\u5206\u7c7b\u5e73\u5747\u63d0\u534720\u4e2a\u767e\u5206\u70b9\uff0cVQA\u5e73\u5747\u63d0\u534713\u4e2a\u767e\u5206\u70b9", "\u68c0\u7d22\u793a\u4f8b\u7684\u76f8\u5173\u6027\u6bd4\u6570\u91cf\u66f4\u91cd\u8981\uff1a6\u4e2a\u67e5\u8be2\u5bf9\u9f50\u6848\u4f8b\u4f18\u4e8e\u6700\u591a32\u4e2a\u968f\u673a\u6848\u4f8b", "VQA\u4e2d\u540c\u65f6\u5bf9\u9f50\u56fe\u50cf\u5185\u5bb9\u4e0e\u95ee\u9898\u610f\u56fe\u53ef\u8fdb\u4e00\u6b65\u63d0\u5347\u6548\u679c\uff0c\u968f\u673a\u6216\u56fa\u5b9a\u793a\u4f8b\u53ef\u80fd\u4f4e\u4e8e\u65e0\u4e0a\u4e0b\u6587\u57fa\u7ebf"], "keywords": ["\u591a\u6a21\u6001", "\u533b\u5b66\u5f71\u50cf", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24057v1", "published_at": "2026-09-21", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Representation-guided in-context learning for medical image interpretation with multimodal large language models", "tldr": "\u7528\u68c0\u7d22\u793a\u4f8b\u514d\u8bad\u7ec3\u63d0\u5347\u533b\u5b66\u56fe\u50cfMLLM\u89e3\u8bfb", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u8868\u793a\u5f15\u5bfc\u7684\u4e0a\u4e0b\u6587\u5b66\u4e60\uff08RG-ICL\uff09\uff0c\u7528\u51bb\u7ed3\u7f16\u7801\u5668\u68c0\u7d22\u4e0e\u67e5\u8be2\u5339\u914d\u7684\u533b\u5b66\u56fe\u50cf\u793a\u4f8b\uff0c\u5e2e\u52a9\u901a\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u8fdb\u884c\u5206\u7c7b\u548cVQA\uff0c\u65e0\u9700\u9886\u57df\u5fae\u8c03\u3002", "why_notable": "\u8bc1\u660e\u5728\u533b\u5b66\u56fe\u50cf\u573a\u666f\u4e2d\uff0c\u7cbe\u5fc3\u9009\u62e9\u53c2\u8003\u6848\u4f8b\u53ef\u4f5c\u4e3a\u66ff\u4ee3\u6602\u8d35\u5fae\u8c03\u7684\u5b9e\u7528\u65b9\u6848\uff0c\u964d\u4f4eMLLM\u533b\u5b66\u9002\u914d\u6210\u672c\u5e76\u63d0\u5347\u53ef\u7528\u6027\u3002"}, {"abstract": "In recent years, large language models (LLMs) have emerged as a popular alternative for evaluation. Often referred to as LLMs as judges (LLJs), these systems have been widely adopted by researchers and practitioners across a broad range of measurement tasks, driven by their strong performance, scalability, and cost-effectiveness relative to human judgment. However, a growing body of work has shown that the use of LLJs raise concerns about their validity and reliability as evaluators. Existing efforts to address these challenges have largely focused on developing bias-mitigation techniques and refining prompting strategies. While these approaches represent an important step forward, they primarily offer technical fixes and leave a more fundamental challenge unaddressed: the lack of standardized, transparent, and reproducible evaluation practices. In this paper, we introduce LLJ Cards, a framework that synthesizes best practices from measurement theory, natural language generation, and machine learning literature into practical guidelines for LLJ-based evaluations. While LLJs offer a promising path toward scalable evaluation, their effective use requires grounding in rigorous evaluation principles to ensure validity, reliability, and reproducibility. LLJ Cards addresses this need by providing a structured framework for applying these principles in the design and reporting of automated evaluations.", "arxiv_id": "2609.24516", "arxiv_url": "https://arxiv.org/abs/2609.24516", "authors": ["Khaoula Chehbouni", "Melina Medjdoub", "Florian Carichon", "Golnoosh Farnadi", "Jackie Chi Kit Cheung"], "brief": "\u8bba\u6587\u63d0\u51fa LLJ Cards\uff0c\u4e00\u4e2a\u9762\u5411\u201cLLM as Judge\u201d\u8bc4\u6d4b\u7684\u7ed3\u6784\u5316\u6846\u67b6\uff0c\u5c06\u6d4b\u91cf\u7406\u8bba\u3001\u81ea\u7136\u8bed\u8a00\u751f\u6210\u4e0e\u673a\u5668\u5b66\u4e60\u8bc4\u4f30\u4e2d\u7684\u6700\u4f73\u5b9e\u8df5\u6574\u7406\u4e3a\u53ef\u6267\u884c\u6307\u5357\u3002\u5b83\u5f3a\u8c03\u5728\u8bbe\u8ba1\u4e0e\u62a5\u544a\u81ea\u52a8\u5316\u8bc4\u6d4b\u65f6\u63d0\u5347\u6709\u6548\u6027\u3001\u53ef\u9760\u6027\u3001\u900f\u660e\u5ea6\u548c\u53ef\u590d\u73b0\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24516", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709LLM\u88c1\u5224\u7814\u7a76\u591a\u805a\u7126\u504f\u5dee\u7f13\u89e3\u548c\u63d0\u793a\u4f18\u5316\uff0c\u4f46\u7f3a\u5c11\u6807\u51c6\u5316\u3001\u900f\u660e\u3001\u53ef\u590d\u73b0\u7684\u8bc4\u6d4b\u6d41\u7a0b", "\u4ece\u6d4b\u91cf\u7406\u8bba\u3001NLG\u8bc4\u4f30\u548c\u673a\u5668\u5b66\u4e60\u6587\u732e\u4e2d\u7efc\u5408\u63d0\u70bcLLJ\u8bc4\u6d4b\u6700\u4f73\u5b9e\u8df5", "\u63d0\u4f9b\u7ed3\u6784\u5316\u62a5\u544a\u6846\u67b6\uff0c\u5e2e\u52a9\u7814\u7a76\u8005\u8bf4\u660e\u8bc4\u6d4b\u76ee\u6807\u3001\u88c1\u5224\u6a21\u578b\u3001\u63d0\u793a\u3001\u8bc4\u5206\u6807\u51c6\u3001\u9a8c\u8bc1\u4e0e\u53ef\u9760\u6027\u5206\u6790"], "keywords": ["\u6a21\u578b\u8bc4\u6d4b", "LLM\u88c1\u5224", "\u53ef\u4fe1AI", "\u81ea\u7136\u8bed\u8a00\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24516v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LLJ Cards: Best practices for the Use of LLMs as Judges", "tldr": "\u63d0\u51faLLJ Cards\u89c4\u8303LLM\u88c1\u5224\u8bc4\u6d4b\u5b9e\u8df5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LLJ Cards\uff0c\u4e00\u4e2a\u9762\u5411\u201cLLM as Judge\u201d\u8bc4\u6d4b\u7684\u7ed3\u6784\u5316\u6846\u67b6\uff0c\u5c06\u6d4b\u91cf\u7406\u8bba\u3001\u81ea\u7136\u8bed\u8a00\u751f\u6210\u4e0e\u673a\u5668\u5b66\u4e60\u8bc4\u4f30\u4e2d\u7684\u6700\u4f73\u5b9e\u8df5\u6574\u7406\u4e3a\u53ef\u6267\u884c\u6307\u5357\u3002\u5b83\u5f3a\u8c03\u5728\u8bbe\u8ba1\u4e0e\u62a5\u544a\u81ea\u52a8\u5316\u8bc4\u6d4b\u65f6\u63d0\u5347\u6709\u6548\u6027\u3001\u53ef\u9760\u6027\u3001\u900f\u660e\u5ea6\u548c\u53ef\u590d\u73b0\u6027\u3002", "why_notable": "LLM\u88c1\u5224\u5df2\u6210\u4e3a\u5927\u89c4\u6a21\u8bc4\u6d4b\u7684\u91cd\u8981\u5de5\u5177\uff0c\u4f46\u5176\u53ef\u4fe1\u5ea6\u5e38\u53d7\u8d28\u7591\uff1bLLJ Cards\u5c06\u95ee\u9898\u4ece\u5355\u7eaf\u6280\u672f\u8c03\u53c2\u63a8\u8fdb\u5230\u8bc4\u6d4b\u89c4\u8303\u5316\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u81ea\u52a8\u8bc4\u6d4b\u7ed3\u679c\u7684\u53ef\u89e3\u91ca\u6027\u548c\u53ef\u590d\u73b0\u6027\u3002"}, {"abstract": "Sparse on-policy distillation (OPD) allocates teacher supervision to a small subset of tokens in student-generated trajectories. However, useful teacher guidance can yield a noisy update when its gradient is estimated from a sampled next token. We study this estimation problem at a fixed prefix in information geometry and propose an information-efficiency ratio (IER) based on a signal-to-noise decomposition. IER characterizes relative gradient estimation error under an optimal scalar baseline. A candidate-set approximation enables token selection based on IER and its combination with existing usefulness scores, while retaining the sampled reverse-KL training objective. On mathematical and medical reasoning tasks, adding IER improves existing selectors in multiple settings, with sparse configurations matching or exceeding full OPD without token selection at small token budgets of 0.1\\%--1\\%. These results support accounting for both usefulness and gradient-estimation reliability when allocating sparse supervision. Our code is available at https://github.com/BruceSheng1202/IER-OPD.", "arxiv_id": "2609.24432", "arxiv_url": "https://arxiv.org/abs/2609.24432", "authors": ["Huanxin Sheng", "Zhiling Ye", "Haonan Wang", "Jian Wang", "Jinjie Gu", "Jian Kang"], "brief": "\u8bba\u6587\u7814\u7a76\u7a00\u758f\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\uff0c\u6559\u5e08\u76d1\u7763\u53ea\u5206\u914d\u7ed9\u5c11\u91cf\u5b66\u751f\u751f\u6210token\u65f6\u7684\u68af\u5ea6\u4f30\u8ba1\u566a\u58f0\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51fa\u4fe1\u606f\u6548\u7387\u6bd4\uff08IER\uff09\u6765\u8861\u91cf\u68af\u5ea6\u4f30\u8ba1\u53ef\u9760\u6027\uff0c\u5e76\u7528\u4e8e\u6539\u8fdbtoken\u9009\u62e9\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24432", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5728\u56fa\u5b9a\u524d\u7f00\u7684\u4fe1\u606f\u51e0\u4f55\u89c6\u89d2\u4e0b\uff0c\u5c06\u68af\u5ea6\u4f30\u8ba1\u8bef\u5dee\u5206\u89e3\u4e3a\u4fe1\u53f7\u4e0e\u566a\u58f0\uff0c\u5e76\u5b9a\u4e49IER\u8861\u91cf\u76f8\u5bf9\u8bef\u5dee", "\u901a\u8fc7\u5019\u9009\u96c6\u8fd1\u4f3c\u5b9e\u73b0\u53ef\u64cd\u4f5c\u7684token\u9009\u62e9\uff0c\u53ef\u4e0e\u5df2\u6709\u201c\u6709\u7528\u6027\u201d\u8bc4\u5206\u7ed3\u5408\uff0c\u540c\u65f6\u4fdd\u6301\u91c7\u6837reverse-KL\u8bad\u7ec3\u76ee\u6807", "\u5728\u6570\u5b66\u4e0e\u533b\u7597\u63a8\u7406\u4efb\u52a1\u4e2d\uff0c0.1%--1% token\u9884\u7b97\u5373\u53ef\u5339\u914d\u6216\u8d85\u8fc7\u5b8c\u6574OPD\uff0c\u63d0\u5347\u591a\u4e2a\u73b0\u6709\u9009\u62e9\u5668"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u68af\u5ea6\u4f30\u8ba1", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24432v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "1% of Tokens Can Be Enough: On Gradient Estimation in On-Policy Distillation", "tldr": "\u7528IER\u8ba91%\u76d1\u7763token\u84b8\u998f\u4e5f\u6709\u6548", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u7a00\u758f\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\uff0c\u6559\u5e08\u76d1\u7763\u53ea\u5206\u914d\u7ed9\u5c11\u91cf\u5b66\u751f\u751f\u6210token\u65f6\u7684\u68af\u5ea6\u4f30\u8ba1\u566a\u58f0\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51fa\u4fe1\u606f\u6548\u7387\u6bd4\uff08IER\uff09\u6765\u8861\u91cf\u68af\u5ea6\u4f30\u8ba1\u53ef\u9760\u6027\uff0c\u5e76\u7528\u4e8e\u6539\u8fdbtoken\u9009\u62e9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u7a00\u758f\u84b8\u998f\u4e0d\u4ec5\u8981\u9009\u201c\u6709\u7528\u201d\u7684token\uff0c\u8fd8\u8981\u8003\u8651\u68af\u5ea6\u4f30\u8ba1\u662f\u5426\u53ef\u9760\uff0c\u4e3a\u4f4e\u6210\u672c\u5bf9\u9f50\u548c\u63a8\u7406\u84b8\u998f\u63d0\u4f9b\u4e86\u5b9e\u7528\u9009\u62e9\u51c6\u5219\u3002"}, {"abstract": "We reproduce and stress-test the work of Yu et al. (2023), who characterize how language models (LMs) arbitrate between memorized knowledge and contradictory in-context statements. We replicate their world-capitals experiments on 31 models spanning Pythia, GPT-2, Qwen3, and Ministral families, including base and post-trained variants, and extend evaluations to five additional knowledge relation types from the ParaConflict dataset. We empirically confirm most of their original findings: larger models and higher-frequency entities tend to favor memorized answers, with substantial family-level variance. However, several conclusions do not generalize cleanly: entity-frequency effects disappear on Qwen3-14B and 32B; post-training shifts the memory-context trade-off inconsistently across families; question phrasing alone can change a model\u0027s reliance on memorized knowledge by up to 80 percentage points; and semantically unrelated prose can mimic coherent supporting context. Our results clarify where Yu et al.\u0027s claims hold and to what extent they generalize to other prompts.", "arxiv_id": "2609.24238", "arxiv_url": "https://arxiv.org/abs/2609.24238", "authors": ["Guilhem Fouilh\u00e9", "Nicholas Asher", "Philippe Muller"], "brief": "\u8bba\u6587\u590d\u73b0\u5e76\u538b\u529b\u6d4b\u8bd5 Yu et al. (2023) \u5173\u4e8e\u8bed\u8a00\u6a21\u578b\u5728\u5185\u90e8\u8bb0\u5fc6\u4e0e\u77db\u76fe\u4e0a\u4e0b\u6587\u4e4b\u95f4\u5982\u4f55\u53d6\u820d\u7684\u7814\u7a76\u3002\u4f5c\u8005\u5728 31 \u4e2a Pythia\u3001GPT-2\u3001Qwen3\u3001Ministral \u7cfb\u5217\u6a21\u578b\u4e0a\u6269\u5c55\u5230\u591a\u7c7b\u77e5\u8bc6\u5173\u7cfb\uff0c\u68c0\u9a8c\u539f\u7ed3\u8bba\u7684\u6cdb\u5316\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24238", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u786e\u8ba4\u591a\u6570\u539f\u53d1\u73b0\uff1a\u66f4\u5927\u6a21\u578b\u548c\u66f4\u9ad8\u9891\u5b9e\u4f53\u66f4\u503e\u5411\u8f93\u51fa\u8bb0\u5fc6\u4e2d\u7684\u4e8b\u5b9e\u7b54\u6848\uff0c\u4f46\u4e0d\u540c\u6a21\u578b\u5bb6\u65cf\u5dee\u5f02\u663e\u8457\u3002", "\u53d1\u73b0\u82e5\u5e72\u7ed3\u8bba\u4e0d\u7a33\u5b9a\uff1aQwen3-14B/32B \u4e0a\u5b9e\u4f53\u9891\u7387\u6548\u5e94\u6d88\u5931\uff0c\u540e\u8bad\u7ec3\u5bf9\u8bb0\u5fc6-\u4e0a\u4e0b\u6587\u6743\u8861\u7684\u5f71\u54cd\u56e0\u5bb6\u65cf\u800c\u5f02\u3002", "\u63d0\u793a\u8bcd\u5f62\u5f0f\u5f71\u54cd\u5f88\u5927\uff1a\u4ec5\u6539\u53d8\u95ee\u9898\u63aa\u8f9e\u5c31\u53ef\u4f7f\u6a21\u578b\u4f9d\u8d56\u8bb0\u5fc6\u7684\u6bd4\u4f8b\u53d8\u5316\u6700\u9ad8 80 \u4e2a\u767e\u5206\u70b9\uff0c\u65e0\u5173\u6587\u672c\u4e5f\u53ef\u80fd\u88ab\u6a21\u578b\u5f53\u4f5c\u652f\u6301\u6027\u4e0a\u4e0b\u6587\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u4e8b\u5b9e\u8bb0\u5fc6", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24238v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Memory vs. Context? Influential Factors of Factual Recall in Language Models", "tldr": "\u7cfb\u7edf\u590d\u73b0\u5b9e\u6d4b\u6a21\u578b\u8bb0\u5fc6\u4e0e\u4e0a\u4e0b\u6587\u53d6\u820d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u590d\u73b0\u5e76\u538b\u529b\u6d4b\u8bd5 Yu et al. (2023) \u5173\u4e8e\u8bed\u8a00\u6a21\u578b\u5728\u5185\u90e8\u8bb0\u5fc6\u4e0e\u77db\u76fe\u4e0a\u4e0b\u6587\u4e4b\u95f4\u5982\u4f55\u53d6\u820d\u7684\u7814\u7a76\u3002\u4f5c\u8005\u5728 31 \u4e2a Pythia\u3001GPT-2\u3001Qwen3\u3001Ministral \u7cfb\u5217\u6a21\u578b\u4e0a\u6269\u5c55\u5230\u591a\u7c7b\u77e5\u8bc6\u5173\u7cfb\uff0c\u68c0\u9a8c\u539f\u7ed3\u8bba\u7684\u6cdb\u5316\u6027\u3002", "why_notable": "\u8fd9\u9879\u7814\u7a76\u4e3a\u8bc4\u4f30\u8bed\u8a00\u6a21\u578b\u4e8b\u5b9e\u53ec\u56de\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u5b9e\u8bc1\u8fb9\u754c\uff0c\u8868\u660e\u201c\u6a21\u578b\u4f55\u65f6\u76f8\u4fe1\u8bb0\u5fc6\u3001\u4f55\u65f6\u76f8\u4fe1\u4e0a\u4e0b\u6587\u201d\u9ad8\u5ea6\u4f9d\u8d56\u6a21\u578b\u5bb6\u65cf\u3001\u8bad\u7ec3\u9636\u6bb5\u548c\u63d0\u793a\u5f62\u5f0f\uff0c\u5bf9\u53ef\u9760\u95ee\u7b54\u3001\u5e7b\u89c9\u5206\u6790\u548c\u68c0\u7d22\u589e\u5f3a\u7cfb\u7edf\u8bbe\u8ba1\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) is hard to monitor in production: exhaustive relevance labels do not exist for non-stationary multi-million-passage corpora that re-index in real time. As a result, retrieval quality is generally understudied and often deprioritised in favour of generation-oriented metrics. In this work, we propose auditing retrieval coverage by probing for evidence of missing documents rather than enumerating every relevant one. Our method Re:CAP (REtrieval Coverage Audit by iterative Probing) is a reference-free audit loop applied to a deployed RAG pipeline\u0027s initial answer and retrieved context: it identifies the topics already covered, generates probing questions for plausibly missing topics, retrieves candidate documents, and applies an LLM-as-judge to retain only those that introduce previously-unretrieved information. On four public benchmarks, Re:CAP recovers 9-29% of gold labels that flat BM25 top-500 cannot reach, rising to 48% on TREC-COVID. On MuSiQue Re:CAP beats flat hybrid top-500 by +12.9 pp on recall at less than half the document budget. An ensemble BM25, dense, and hybrid baseline (top-500 each) still leaves out 21.2% of gold docs on TREC-COVID that Re:CAP recovers; human annotators judge that 78.9% of those structurally distinct documents add new information to the baseline answer (Fleiss $\u03ba$ = 0.79, n = 123), and 73.9% on live production traffic (n = 180). End-to-end recall is reproducible to within $\\pm$1% across three independent runs, making Re:CAP a stable instrument for periodic retrieval audits.", "arxiv_id": "2609.24122", "arxiv_url": "https://arxiv.org/abs/2609.24122", "authors": ["Aviral Joshi", "Hanoz Bhathena", "Max Nelson", "Saket Sharma"], "brief": "\u8bba\u6587\u63d0\u51fa Re:CAP\uff0c\u4e00\u79cd\u65e0\u9700\u5b8c\u6574\u76f8\u5173\u6027\u6807\u6ce8\u7684\u751f\u4ea7\u7ea7 RAG \u68c0\u7d22\u8986\u76d6\u7387\u5ba1\u8ba1\u65b9\u6cd5\u3002\u5b83\u4ece\u521d\u59cb\u56de\u7b54\u4e0e\u5df2\u68c0\u7d22\u4e0a\u4e0b\u6587\u51fa\u53d1\uff0c\u8fed\u4ee3\u751f\u6210\u63a2\u6d4b\u95ee\u9898\uff0c\u5bfb\u627e\u5e76\u9a8c\u8bc1\u53ef\u80fd\u88ab\u9057\u6f0f\u7684\u65b0\u4fe1\u606f\u6587\u6863\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24122", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u201c\u5bfb\u627e\u9057\u6f0f\u8bc1\u636e\u201d\u800c\u975e\u679a\u4e3e\u6240\u6709\u76f8\u5173\u6587\u6863\uff0c\u9002\u914d\u52a8\u6001\u66f4\u65b0\u3001\u767e\u4e07\u7ea7\u8bed\u6599\u7684\u751f\u4ea7 RAG \u573a\u666f", "\u6d41\u7a0b\u5305\u62ec\u8bc6\u522b\u5df2\u8986\u76d6\u4e3b\u9898\u3001\u751f\u6210\u7f3a\u5931\u4e3b\u9898\u63a2\u6d4b\u95ee\u9898\u3001\u68c0\u7d22\u5019\u9009\u6587\u6863\uff0c\u5e76\u7528 LLM-as-judge \u8fc7\u6ee4\u65b0\u589e\u4fe1\u606f", "\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8ffd\u56de BM25 top-500 \u65e0\u6cd5\u8986\u76d6\u7684 9\u201329% \u91d1\u6807\u6587\u6863\uff0cTREC-COVID \u4e0a\u6700\u9ad8\u8fbe 48%"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u4fe1\u606f\u68c0\u7d22", "\u8bc4\u4f30\u5ba1\u8ba1", "LLM\u8bc4\u5224"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24122v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Re:CAP - Auditing Retrieval Coverage in Production RAG Pipelines", "tldr": "Re:CAP\u4e3b\u52a8\u63a2\u6d4bRAG\u9057\u6f0f\u6587\u6863", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Re:CAP\uff0c\u4e00\u79cd\u65e0\u9700\u5b8c\u6574\u76f8\u5173\u6027\u6807\u6ce8\u7684\u751f\u4ea7\u7ea7 RAG \u68c0\u7d22\u8986\u76d6\u7387\u5ba1\u8ba1\u65b9\u6cd5\u3002\u5b83\u4ece\u521d\u59cb\u56de\u7b54\u4e0e\u5df2\u68c0\u7d22\u4e0a\u4e0b\u6587\u51fa\u53d1\uff0c\u8fed\u4ee3\u751f\u6210\u63a2\u6d4b\u95ee\u9898\uff0c\u5bfb\u627e\u5e76\u9a8c\u8bc1\u53ef\u80fd\u88ab\u9057\u6f0f\u7684\u65b0\u4fe1\u606f\u6587\u6863\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a RAG \u8bc4\u4f30\u91cd\u70b9\u4ece\u751f\u6210\u8d28\u91cf\u6269\u5c55\u5230\u68c0\u7d22\u8986\u76d6\u7387\uff0c\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u3001\u65e0\u9700\u53c2\u8003\u6807\u6ce8\u7684\u751f\u4ea7\u5ba1\u8ba1\u5de5\u5177\uff0c\u5bf9\u53d1\u73b0\u7cfb\u7edf\u6027\u6f0f\u68c0\u548c\u6539\u8fdb\u77e5\u8bc6\u8986\u76d6\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Best-of-$N$ is a widely used inference strategy for complex reasoning, whose effectiveness depends on whether sampled candidates can cover diverse and high-quality reasoning paths. However, post-trained reasoning models often suffer from \\emph{exploration collapse}, where independent rollouts repeatedly follow similar reasoning paths and limit the gains from increasing the rollout budget. Existing methods alleviate this issue by promoting broader exploration, but do not explicitly guide exploration toward continuations that make meaningful progress, resulting in limited exploration efficiency. To address this, we propose \\emph{\\underline{S}tate-conditioned \\underline{P}rogress-guided \\underline{S}teering} (SPS), a training-free latent steering framework. Specifically, SPS constructs a state-conditioned Direction Bank containing multiple progress-guided steering vectors for different prefix-state regions. During online inference, SPS retrieves a suitable steering vector based on the current prefix state and applies it at high-uncertainty transitions to guide the next reasoning step toward meaningful progress. Extensive experiments across multiple model scales and benchmarks demonstrate that SPS consistently outperforms strong baselines. Further analyses validate the effectiveness of its key designs and offer valuable insights for future research. The code is available at https://github.com/rattlesnakey/SPS.", "arxiv_id": "2609.24066", "arxiv_url": "https://arxiv.org/abs/2609.24066", "authors": ["Hengyuan Zhang", "Chenming Shang", "Zunhai Su", "Xiao Liang", "Hui Shen", "Jing Xiong", "Dawei Li", "Shiping Yang", "Kailai Yang", "Wei Zhang", "Ruobing Xie", "Hayden Kwok-Hay So", "Ngai Wong"], "brief": "\u8bba\u6587\u63d0\u51fa SPS\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u72b6\u6001\u6761\u4ef6\u5316\u9690\u7a7a\u95f4\u8f6c\u5411\u6846\u67b6\uff0c\u7528\u4e8e\u7f13\u89e3 Best-of-N \u63a8\u7406\u4e2d\u7684\u201c\u63a2\u7d22\u574d\u7f29\u201d\u3002\u5b83\u6839\u636e\u5f53\u524d\u63a8\u7406\u524d\u7f00\u72b6\u6001\u68c0\u7d22\u5408\u9002\u7684\u8fdb\u5c55\u5f15\u5bfc\u5411\u91cf\uff0c\u5e76\u5728\u9ad8\u4e0d\u786e\u5b9a\u8f6c\u79fb\u5904\u5f15\u5bfc\u6a21\u578b\u8d70\u5411\u66f4\u6709\u4ef7\u503c\u7684\u63a8\u7406\u5ef6\u7eed\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24066", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u72b6\u6001\u6761\u4ef6\u5316 Direction Bank\uff0c\u4e3a\u4e0d\u540c\u524d\u7f00\u72b6\u6001\u533a\u57df\u5b58\u50a8\u591a\u7ec4\u8fdb\u5c55\u5f15\u5bfc steering vectors", "\u5728\u7ebf\u63a8\u7406\u65f6\u4f9d\u636e\u5f53\u524d prefix state \u52a8\u6001\u68c0\u7d22\u8f6c\u5411\u5411\u91cf\uff0c\u4ec5\u5728\u9ad8\u4e0d\u786e\u5b9a\u6027\u6b65\u9aa4\u65bd\u52a0\u5e72\u9884", "\u5728\u591a\u4e2a\u6a21\u578b\u89c4\u6a21\u548c\u63a8\u7406\u57fa\u51c6\u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf\uff0c\u5e76\u9a8c\u8bc1\u4e86\u72b6\u6001\u6761\u4ef6\u5316\u4e0e\u8fdb\u5c55\u5f15\u5bfc\u8bbe\u8ba1\u7684\u6709\u6548\u6027"], "keywords": ["\u63a8\u7406\u4f18\u5316", "\u9690\u7a7a\u95f4\u63a7\u5236", "\u91c7\u6837\u7b56\u7565", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24066v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Efficient Reasoning Exploration via State-Conditioned Latent Steering with Progress Guidance", "tldr": "\u7528\u8fdb\u5c55\u5f15\u5bfc\u7684\u9690\u7a7a\u95f4\u8f6c\u5411\u63d0\u5347\u63a8\u7406\u91c7\u6837\u6548\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SPS\uff0c\u4e00\u79cd\u514d\u8bad\u7ec3\u7684\u72b6\u6001\u6761\u4ef6\u5316\u9690\u7a7a\u95f4\u8f6c\u5411\u6846\u67b6\uff0c\u7528\u4e8e\u7f13\u89e3 Best-of-N \u63a8\u7406\u4e2d\u7684\u201c\u63a2\u7d22\u574d\u7f29\u201d\u3002\u5b83\u6839\u636e\u5f53\u524d\u63a8\u7406\u524d\u7f00\u72b6\u6001\u68c0\u7d22\u5408\u9002\u7684\u8fdb\u5c55\u5f15\u5bfc\u5411\u91cf\uff0c\u5e76\u5728\u9ad8\u4e0d\u786e\u5b9a\u8f6c\u79fb\u5904\u5f15\u5bfc\u6a21\u578b\u8d70\u5411\u66f4\u6709\u4ef7\u503c\u7684\u63a8\u7406\u5ef6\u7eed\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e0d\u9700\u8981\u91cd\u65b0\u8bad\u7ec3\u6a21\u578b\uff0c\u5374\u80fd\u63d0\u5347\u590d\u6742\u63a8\u7406\u4e2d\u591a\u6837\u91c7\u6837\u7684\u6709\u6548\u6027\uff0c\u51cf\u5c11\u91cd\u590d\u8def\u5f84\u5e26\u6765\u7684\u9884\u7b97\u6d6a\u8d39\uff0c\u5bf9\u63d0\u5347 LLM \u63a8\u7406\u65f6\u641c\u7d22\u6548\u7387\u548c Best-of-N \u6027\u80fd\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Concepts are commonly defined as abstract, compact representations of knowledge and treated as basic units of intelligent behavior. Yet, cognition, psychology, and AI lack a shared mathematical language for them. Modern systems represent concepts as vectors, distributions, symbols, graphs, and other structures, but these formalisms are typically treated as competing rather than as solutions to a common problem. We propose an operation-based view that evaluates mathematical frameworks by the conceptual operations they support, identifying thirteen operations (including similarity, composition, generalization, and grounding) that recur across cognition, psychology, and AI. We show that ten frameworks embody distinct commitments to concepts as self-contained content, relational structure, or evolving process, and that these commitments determine which operations each supports naturally. For example, vector-based models facilitate graded similarity and generalization but struggle with explicit composition, whereas symbolic models support composition but offer but generalize poorly. No single framework we examined naturally supports all operations without extension. We test this account empirically using categorization as a case study, operationalizing nine theories on the same items against human judgments. Despite addressing the same conceptual question, the theories produce different procedures and results, demonstrating that mathematical commitment shapes what a theory can explain. We call for hybrid formalisms that treat content, relation, and process as jointly primary.", "arxiv_id": "2609.24554", "arxiv_url": "https://arxiv.org/abs/2609.24554", "authors": ["Chen Shani"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4ee5\u201c\u6982\u5ff5\u64cd\u4f5c\u201d\u4e3a\u6838\u5fc3\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u7528\u76f8\u4f3c\u6027\u3001\u7ec4\u5408\u3001\u6cdb\u5316\u3001\u843d\u5730\u7b49\u5341\u4e09\u7c7b\u64cd\u4f5c\u6765\u6bd4\u8f83\u4e0d\u540c\u6982\u5ff5\u6570\u5b66\u5f62\u5f0f\u3002\u4f5c\u8005\u5206\u6790\u5341\u79cd\u5e38\u89c1\u6846\u67b6\uff0c\u5e76\u4ee5\u5206\u7c7b\u4efb\u52a1\u5b9e\u8bc1\u5c55\u793a\uff1a\u4e0d\u540c\u6570\u5b66\u627f\u8bfa\u4f1a\u6539\u53d8\u7406\u8bba\u80fd\u89e3\u91ca\u7684\u5185\u5bb9\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24554", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5f52\u7eb3\u51fa\u5341\u4e09\u79cd\u8de8\u8ba4\u77e5\u79d1\u5b66\u3001\u5fc3\u7406\u5b66\u4e0e AI \u53cd\u590d\u51fa\u73b0\u7684\u6982\u5ff5\u64cd\u4f5c\uff0c\u5305\u62ec\u76f8\u4f3c\u6027\u3001\u7ec4\u5408\u3001\u6cdb\u5316\u3001\u62bd\u8c61\u3001\u843d\u5730\u7b49\u3002", "\u6bd4\u8f83\u5411\u91cf\u3001\u7b26\u53f7\u3001\u56fe\u3001\u5206\u5e03\u7b49\u5341\u7c7b\u6982\u5ff5\u8868\u793a\u6846\u67b6\uff0c\u6307\u51fa\u5b83\u4eec\u5206\u522b\u504f\u5411\u5185\u5bb9\u3001\u5173\u7cfb\u6216\u8fc7\u7a0b\uff0c\u5929\u7136\u652f\u6301\u7684\u64cd\u4f5c\u4e0d\u540c\u3002", "\u4ee5\u4eba\u7c7b\u5206\u7c7b\u5224\u65ad\u4e3a\u6848\u4f8b\uff0c\u7edf\u4e00\u5b9e\u73b0\u4e5d\u79cd\u7406\u8bba\u5e76\u5bf9\u6bd4\u7ed3\u679c\uff0c\u8bc1\u660e\u5373\u4f7f\u9762\u5bf9\u540c\u4e00\u6982\u5ff5\u95ee\u9898\uff0c\u4e0d\u540c\u5f62\u5f0f\u5316\u5047\u8bbe\u4e5f\u4f1a\u4ea7\u751f\u4e0d\u540c\u7a0b\u5e8f\u4e0e\u89e3\u91ca\u3002"], "keywords": ["\u6982\u5ff5\u8868\u793a", "\u8ba4\u77e5\u5efa\u6a21", "\u7b26\u53f7\u63a8\u7406", "\u5411\u91cf\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24554v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Toward a Unified Mathematics of Concepts", "tldr": "\u63d0\u51fa\u6982\u5ff5\u7814\u7a76\u7684\u7edf\u4e00\u64cd\u4f5c\u6570\u5b66\u89c6\u89d2", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4ee5\u201c\u6982\u5ff5\u64cd\u4f5c\u201d\u4e3a\u6838\u5fc3\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u7528\u76f8\u4f3c\u6027\u3001\u7ec4\u5408\u3001\u6cdb\u5316\u3001\u843d\u5730\u7b49\u5341\u4e09\u7c7b\u64cd\u4f5c\u6765\u6bd4\u8f83\u4e0d\u540c\u6982\u5ff5\u6570\u5b66\u5f62\u5f0f\u3002\u4f5c\u8005\u5206\u6790\u5341\u79cd\u5e38\u89c1\u6846\u67b6\uff0c\u5e76\u4ee5\u5206\u7c7b\u4efb\u52a1\u5b9e\u8bc1\u5c55\u793a\uff1a\u4e0d\u540c\u6570\u5b66\u627f\u8bfa\u4f1a\u6539\u53d8\u7406\u8bba\u80fd\u89e3\u91ca\u7684\u5185\u5bb9\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u8bd5\u56fe\u4e3a\u201c\u6982\u5ff5\u201d\u8fd9\u4e00 AI \u4e0e\u8ba4\u77e5\u79d1\u5b66\u6838\u5fc3\u5bf9\u8c61\u5efa\u7acb\u5171\u540c\u6570\u5b66\u8bed\u8a00\uff0c\u6307\u51fa\u5355\u4e00\u8868\u793a\u8303\u5f0f\u96be\u4ee5\u8986\u76d6\u5168\u90e8\u6982\u5ff5\u64cd\u4f5c\uff0c\u63a8\u52a8\u9762\u5411\u5185\u5bb9\u3001\u5173\u7cfb\u4e0e\u8fc7\u7a0b\u7684\u6df7\u5408\u6982\u5ff5\u5f62\u5f0f\u5316\u3002"}, {"abstract": "In-context learning (ICL) based on large language models (LLMs) has shown promising potential in alleviating performance bottlenecks caused by the limited availability of annotated data in Named Entity Recognition (NER). However, existing methods still face issues of retrieval misalignment and generation uncertainty, making their performance heavily dependent on the LLM\u0027s capabilities. As the parameter scale of LLMs decreases, their performance in few-shot settings deteriorates significantly. In this paper, we propose a novel unified retrieval-augmented framework, URA-NER, including three key components: Progressive Granularity Retrieval (PGR), Model-aware Representation Enhancement (MaRE), and Reason-aware Knowledge Verification. PGR is a two-stage retrieval mechanism that achieves stage alignment. It first retrieves demonstrations for span detection based on the query\u0027s global semantics, and then for type classification based on the specific entity context, providing fine-grained local information. Moreover, MaRE employs entity pre-recognition to guide the construction of representations, ensuring the query and demonstrations are aligned within the LLM\u0027s semantic space and attention pattern. In addition, to mitigate generation uncertainty, we propose RaKV, a closed-loop \"generation-retrieval-verification\" process. It explicates the LLM\u0027s reasoning paths, leverages them for the retrieval of external knowledge, and reorganizes the knowledge into verification evidence aligned with the original reasoning paths. We conduct extensive experiments on multiple low-resource NER datasets. Results demonstrate that URA-NER significantly enhances the performance of LLMs under low-resource settings, with particularly pronounced gains for smaller LLMs, achieving new state-of-the-art results on several benchmarks.", "arxiv_id": "2609.24372", "arxiv_url": "https://arxiv.org/abs/2609.24372", "authors": ["Jingyu Wang", "Shijie Wu", "Fusheng Jin"], "brief": "\u8bba\u6587\u63d0\u51fa URA-NER\uff0c\u4e00\u4e2a\u9762\u5411\u4f4e\u8d44\u6e90\u547d\u540d\u5b9e\u4f53\u8bc6\u522b\u7684\u7edf\u4e00\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u5206\u9636\u6bb5\u68c0\u7d22\u3001\u6a21\u578b\u611f\u77e5\u8868\u793a\u589e\u5f3a\u548c\u57fa\u4e8e\u63a8\u7406\u7684\u77e5\u8bc6\u9a8c\u8bc1\uff0c\u63d0\u5347\u5c11\u6837\u672c ICL \u573a\u666f\u4e0b LLM \u7684 NER \u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24372", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u6e10\u8fdb\u7c92\u5ea6\u68c0\u7d22 PGR\uff1a\u5148\u6309\u5168\u5c40\u8bed\u4e49\u68c0\u7d22\u7528\u4e8e\u5b9e\u4f53\u8de8\u5ea6\u68c0\u6d4b\u7684\u793a\u4f8b\uff0c\u518d\u6309\u5b9e\u4f53\u5c40\u90e8\u4e0a\u4e0b\u6587\u68c0\u7d22\u7528\u4e8e\u7c7b\u578b\u5206\u7c7b\u7684\u793a\u4f8b\u3002", "\u63d0\u51fa MaRE\uff1a\u5229\u7528\u5b9e\u4f53\u9884\u8bc6\u522b\u6784\u9020\u66f4\u8d34\u5408 LLM \u8bed\u4e49\u7a7a\u95f4\u548c\u6ce8\u610f\u529b\u6a21\u5f0f\u7684\u67e5\u8be2\u4e0e\u793a\u4f8b\u8868\u793a\uff0c\u7f13\u89e3\u68c0\u7d22\u9519\u914d\u3002", "\u63d0\u51fa RaKV\uff1a\u901a\u8fc7\u201c\u751f\u6210-\u68c0\u7d22-\u9a8c\u8bc1\u201d\u95ed\u73af\u663e\u5f0f\u5316\u63a8\u7406\u8def\u5f84\uff0c\u5e76\u68c0\u7d22\u5916\u90e8\u77e5\u8bc6\u5f62\u6210\u9a8c\u8bc1\u8bc1\u636e\uff0c\u964d\u4f4e\u751f\u6210\u4e0d\u786e\u5b9a\u6027\u3002"], "keywords": ["\u4fe1\u606f\u62bd\u53d6", "\u68c0\u7d22\u589e\u5f3a", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4f4e\u8d44\u6e90\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24372v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "URA-NER: A Unified Retrieval-Augmented Framework with Retrieval Alignment and Uncertainty Reduction for Low-Resource NER", "tldr": "\u68c0\u7d22\u5bf9\u9f50\u4e0e\u4e0d\u786e\u5b9a\u6027\u964d\u4f4e\u63d0\u5347\u4f4e\u8d44\u6e90NER", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa URA-NER\uff0c\u4e00\u4e2a\u9762\u5411\u4f4e\u8d44\u6e90\u547d\u540d\u5b9e\u4f53\u8bc6\u522b\u7684\u7edf\u4e00\u68c0\u7d22\u589e\u5f3a\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u5206\u9636\u6bb5\u68c0\u7d22\u3001\u6a21\u578b\u611f\u77e5\u8868\u793a\u589e\u5f3a\u548c\u57fa\u4e8e\u63a8\u7406\u7684\u77e5\u8bc6\u9a8c\u8bc1\uff0c\u63d0\u5347\u5c11\u6837\u672c ICL \u573a\u666f\u4e0b LLM \u7684 NER \u8868\u73b0\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u4f4e\u8d44\u6e90 NER \u4e2d\u68c0\u7d22\u4e0d\u5bf9\u9f50\u548c\u5c0f\u6a21\u578b\u751f\u6210\u4e0d\u7a33\u5b9a\u7684\u5173\u952e\u75db\u70b9\uff0c\u5c24\u5176\u663e\u8457\u63d0\u5347\u8f83\u5c0f LLM \u7684\u5c11\u6837\u672c\u6027\u80fd\uff0c\u5e76\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230\u65b0\u7684\u6700\u4f18\u7ed3\u679c\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Cross-domain Named Entity Recognition (CD-NER) aims to transfer the rich knowledge in the source domain to the target domain. Recent studies adopting decomposition or generation paradigms have achieved significant performance improvements, demonstrating high accuracy in entity span detection. However, during entity type classification, models severely suffer from entity type confusion, the erroneous tendency that models classify entities of one type in the text as another similar but incorrect type. To address this issue, we first propose a Multidimensional Confusion Quantification Model (MCQM) that quantifies a model\u0027s confusion extent between entity types from three dimensions: source-target hierarchy analysis, semantic similarity analysis, and explicit data evaluation. Moreover, we propose the Progressive Bidirectional Reasoning Chain (PBRC). PBRC leverages the source-target hierarchy and confusion analysis from the MCQM to prompt the LLM to generate two-stage reasoning information. The two-stage reasoning information is utilized to augment the knowledge of the model, significantly mitigating entity type confusion and improving the model\u0027s generalization performance. Experimental results demonstrate that our method achieves new state-of-the-art results on all domains of the CrossNER dataset.", "arxiv_id": "2609.24357", "arxiv_url": "https://arxiv.org/abs/2609.24357", "authors": ["Jingyu Wang", "Shijie Wu", "Fusheng Jin"], "brief": "\u672c\u6587\u9488\u5bf9\u8de8\u57df\u547d\u540d\u5b9e\u4f53\u8bc6\u522b\u4e2d\u7684\u5b9e\u4f53\u7c7b\u578b\u6df7\u6dc6\u95ee\u9898\uff0c\u63d0\u51fa\u591a\u7ef4\u6df7\u6dc6\u91cf\u5316\u6a21\u578bMCQM\uff0c\u4ece\u5c42\u7ea7\u5173\u7cfb\u3001\u8bed\u4e49\u76f8\u4f3c\u5ea6\u548c\u663e\u5f0f\u6570\u636e\u8bc4\u4f30\u4e09\u65b9\u9762\u8861\u91cf\u7c7b\u578b\u95f4\u6df7\u6dc6\u7a0b\u5ea6\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u6e10\u8fdb\u5f0f\u53cc\u5411\u63a8\u7406\u94fePBRC\uff0c\u5f15\u5bfcLLM\u751f\u6210\u4e24\u9636\u6bb5\u63a8\u7406\u4fe1\u606f\u4ee5\u589e\u5f3a\u6a21\u578b\u77e5\u8bc6\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24357", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["MCQM\u4ece\u6e90\u57df-\u76ee\u6807\u57df\u5c42\u7ea7\u7ed3\u6784\u3001\u5b9e\u4f53\u7c7b\u578b\u8bed\u4e49\u76f8\u4f3c\u6027\u3001\u5b9e\u9645\u9884\u6d4b\u8868\u73b0\u4e09\u4e2a\u7ef4\u5ea6\u91cf\u5316\u7c7b\u578b\u6df7\u6dc6\u3002", "PBRC\u5229\u7528MCQM\u5f97\u5230\u7684\u5c42\u7ea7\u4e0e\u6df7\u6dc6\u5206\u6790\uff0c\u6784\u9020\u53cc\u9636\u6bb5\u63a8\u7406\u4fe1\u606f\uff0c\u5e2e\u52a9\u6a21\u578b\u533a\u5206\u76f8\u4f3c\u5b9e\u4f53\u7c7b\u578b\u3002", "\u5728CrossNER\u6240\u6709\u9886\u57df\u4e0a\u53d6\u5f97\u65b0\u7684SOTA\u7ed3\u679c\uff0c\u663e\u8457\u63d0\u5347\u8de8\u57df\u6cdb\u5316\u80fd\u529b\u3002"], "keywords": ["\u547d\u540d\u5b9e\u4f53\u8bc6\u522b", "\u8de8\u57df\u8fc1\u79fb", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u62bd\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24357v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Mitigating Entity Type Confusion in Cross-Domain NER via Multidimensional Quantification and Reasoning Enhancement", "tldr": "\u7528\u6df7\u6dc6\u91cf\u5316\u4e0e\u63a8\u7406\u589e\u5f3a\u7f13\u89e3\u8de8\u57dfNER\u7c7b\u578b\u6df7\u6dc6", "upvotes": 0, "what_it_is": "\u672c\u6587\u9488\u5bf9\u8de8\u57df\u547d\u540d\u5b9e\u4f53\u8bc6\u522b\u4e2d\u7684\u5b9e\u4f53\u7c7b\u578b\u6df7\u6dc6\u95ee\u9898\uff0c\u63d0\u51fa\u591a\u7ef4\u6df7\u6dc6\u91cf\u5316\u6a21\u578bMCQM\uff0c\u4ece\u5c42\u7ea7\u5173\u7cfb\u3001\u8bed\u4e49\u76f8\u4f3c\u5ea6\u548c\u663e\u5f0f\u6570\u636e\u8bc4\u4f30\u4e09\u65b9\u9762\u8861\u91cf\u7c7b\u578b\u95f4\u6df7\u6dc6\u7a0b\u5ea6\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u6e10\u8fdb\u5f0f\u53cc\u5411\u63a8\u7406\u94fePBRC\uff0c\u5f15\u5bfcLLM\u751f\u6210\u4e24\u9636\u6bb5\u63a8\u7406\u4fe1\u606f\u4ee5\u589e\u5f3a\u6a21\u578b\u77e5\u8bc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u8de8\u57dfNER\u4e2d\u5e38\u88ab\u5ffd\u89c6\u7684\u201c\u7c7b\u578b\u5206\u7c7b\u9519\u8bef\u201d\u800c\u975e\u4ec5\u5b9e\u4f53\u8fb9\u754c\u68c0\u6d4b\uff0c\u901a\u8fc7\u53ef\u91cf\u5316\u6df7\u6dc6\u5206\u6790\u7ed3\u5408LLM\u63a8\u7406\u589e\u5f3a\uff0c\u4e3a\u4f4e\u8d44\u6e90/\u8de8\u9886\u57df\u4fe1\u606f\u62bd\u53d6\u63d0\u4f9b\u4e86\u5b9e\u7528\u6539\u8fdb\u8def\u5f84\u3002"}, {"abstract": "Text-to-speech models for Bantu tonal languages are challenged by a tonal system that is rooted in both the lexis (i.e., the inventory of words, stems, and affixes) and the grammar (i.e., morpho-syntax). To complicate matters, the standard writing systems of these languages often omit tone markings and syllable duration information, which must be disambiguated by the reader based on context. Motivated by linguistic descriptions of Bantu language tone systems, we propose an end-to-end text-to-speech model that augments the text encoding mechanism with a morpho-syntactic prior. We replace the standard phoneme encoder in the VITS architecture with a morpheme sequence encoder and a phoneme-to-morpheme attention network. We posit that, by using this explicit morphological modeling, we can capture the information required to produce the correct tone. Experiments conducted on the Kinyarwanda language, a tonal and morphologically complex Bantu language, reveal substantial TTS improvement from this morphological modeling. Specifically, the proposed method significantly improves the naturalness, intonation, and intelligibility of the produced synthetic voices.", "arxiv_id": "2609.24310", "arxiv_url": "https://arxiv.org/abs/2609.24310", "authors": ["Antoine Nzeyimana"], "brief": "\u8bba\u6587\u63d0\u51fa Morpho-VITS\uff0c\u5728 VITS \u7aef\u5230\u7aef\u8bed\u97f3\u5408\u6210\u6846\u67b6\u4e2d\u5f15\u5165\u5f62\u6001-\u53e5\u6cd5\u5148\u9a8c\uff0c\u7528\u4e8e\u89e3\u51b3\u73ed\u56fe\u58f0\u8c03\u8bed\u8a00\u4e66\u5199\u4e2d\u5e38\u7701\u7565\u58f0\u8c03\u4e0e\u97f3\u8282\u65f6\u957f\u7684\u95ee\u9898\u3002\u6a21\u578b\u4ee5\u8bcd\u7d20\u5e8f\u5217\u7f16\u7801\u5668\u548c\u97f3\u7d20\u5230\u8bcd\u7d20\u6ce8\u610f\u529b\u7f51\u7edc\u66ff\u4ee3\u6807\u51c6\u97f3\u7d20\u7f16\u7801\u5668\uff0c\u4ee5\u66f4\u597d\u9884\u6d4b\u6b63\u786e\u58f0\u8c03\u3002", "categories": ["eess.AS", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24310", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u57fa\u5c3c\u4e9a\u5362\u65fa\u8fbe\u8bed\u8fd9\u7c7b\u58f0\u8c03\u548c\u5f62\u6001\u590d\u6742\u7684\u73ed\u56fe\u8bed\u8a00\uff0c\u663e\u5f0f\u5efa\u6a21\u8bcd\u7d20\u4e0e\u8bed\u6cd5\u4fe1\u606f", "\u5728 VITS \u4e2d\u52a0\u5165 morpheme sequence encoder \u4e0e phoneme-to-morpheme attention network", "\u5b9e\u9a8c\u663e\u793a\u5408\u6210\u8bed\u97f3\u5728\u81ea\u7136\u5ea6\u3001\u8bed\u8c03\u548c\u53ef\u61c2\u5ea6\u4e0a\u5747\u663e\u8457\u63d0\u5347"], "keywords": ["\u8bed\u97f3\u5408\u6210", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u5f62\u6001\u5efa\u6a21", "\u58f0\u8c03\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24310v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Morpho-VITS: Variational Inference with Morphological Modeling for End-to-End Speech Synthesis of a Tonal Bantu Language", "tldr": "\u7528\u5f62\u6001\u5efa\u6a21\u63d0\u5347\u73ed\u56fe\u58f0\u8c03\u8bed\u97f3\u5408\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Morpho-VITS\uff0c\u5728 VITS \u7aef\u5230\u7aef\u8bed\u97f3\u5408\u6210\u6846\u67b6\u4e2d\u5f15\u5165\u5f62\u6001-\u53e5\u6cd5\u5148\u9a8c\uff0c\u7528\u4e8e\u89e3\u51b3\u73ed\u56fe\u58f0\u8c03\u8bed\u8a00\u4e66\u5199\u4e2d\u5e38\u7701\u7565\u58f0\u8c03\u4e0e\u97f3\u8282\u65f6\u957f\u7684\u95ee\u9898\u3002\u6a21\u578b\u4ee5\u8bcd\u7d20\u5e8f\u5217\u7f16\u7801\u5668\u548c\u97f3\u7d20\u5230\u8bcd\u7d20\u6ce8\u610f\u529b\u7f51\u7edc\u66ff\u4ee3\u6807\u51c6\u97f3\u7d20\u7f16\u7801\u5668\uff0c\u4ee5\u66f4\u597d\u9884\u6d4b\u6b63\u786e\u58f0\u8c03\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8bed\u8a00\u5b66\u4e2d\u7684\u5f62\u6001-\u53e5\u6cd5\u58f0\u8c03\u89c4\u5f8b\u76f4\u63a5\u878d\u5165\u795e\u7ecf TTS\uff0c\u5bf9\u4f4e\u8d44\u6e90\u3001\u5f62\u6001\u590d\u6742\u4e14\u6b63\u5b57\u6cd5\u7f3a\u5c11\u58f0\u8c03\u6807\u6ce8\u7684\u8bed\u8a00\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\uff0c\u4e5f\u5c55\u793a\u4e86\u8bed\u8a00\u5b66\u5148\u9a8c\u5728\u7aef\u5230\u7aef\u8bed\u97f3\u5408\u6210\u4e2d\u7684\u6709\u6548\u6027\u3002"}, {"abstract": "Text-to-speech (TTS) corpora are costly to record, yet many utterances add little new phonetic information. Core-set selection reduces this cost by choosing a small training subset under a fixed audio-duration budget. We represent a corpus as a phonotactic graph that links each utterance to its most phonemically similar ones, and we first test whether this graph has structure. In Bangla and English corpora, its clustering is 199 and 56 times that of a size-matched random graph, and its modularity is more than twice that of a degree-preserving random graph. We then propose Community Representative, a selector that samples across graph communities and spreads its choices within each one, starting from utterances rich in rare phonemes. At every budget and in both languages, it covers more rare phoneme bigrams than random and entropy-based selection, and this lead holds on held-out utterances. TTS models trained on its 20% core-sets have a significantly lower character error rate (CER) than models trained on equal-duration random or entropy-based subsets in both languages. When all models train for the same number of epochs, the Bangla core-set model also outperforms full-corpus training (3.93% vs. 4.47% CER) with 4.5x less training time.", "arxiv_id": "2609.24275", "arxiv_url": "https://arxiv.org/abs/2609.24275", "authors": ["Mizbaul Haque Maruf", "Muhammad Nur Yanhaona"], "brief": "\u8bba\u6587\u5c06TTS\u8bed\u6599\u8868\u793a\u4e3a\u57fa\u4e8e\u97f3\u7d20\u76f8\u4f3c\u5ea6\u8fde\u63a5\u7684\u97f3\u7cfb\u56fe\uff0c\u5e76\u9a8c\u8bc1\u5176\u5b58\u5728\u663e\u8457\u793e\u533a\u7ed3\u6784\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u63d0\u51faCommunity Representative\u65b9\u6cd5\uff0c\u5728\u97f3\u7cfb\u793e\u533a\u95f4\u5747\u8861\u91c7\u6837\u3001\u793e\u533a\u5185\u5206\u6563\u9009\u62e9\uff0c\u4ee5\u66f4\u5c11\u8bed\u97f3\u6570\u636e\u8bad\u7ec3\u66f4\u597d\u7684TTS\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24275", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5b5f\u52a0\u62c9\u8bed\u548c\u82f1\u8bed\u8bed\u6599\u7684\u97f3\u7cfb\u56fe\u805a\u7c7b\u7cfb\u6570\u5206\u522b\u662f\u540c\u89c4\u6a21\u968f\u673a\u56fe\u7684199\u500d\u548c56\u500d\uff0c\u6a21\u5757\u5ea6\u4e5f\u8d85\u8fc7\u4fdd\u5ea6\u968f\u673a\u56fe\u76842\u500d", "\u9009\u62e9\u7b56\u7565\u4f18\u5148\u8986\u76d6\u542b\u7a00\u6709\u97f3\u7d20\u7684\u53e5\u5b50\uff0c\u5e76\u5728\u4e0d\u540c\u793e\u533a\u4e2d\u5206\u6563\u91c7\u6837\uff0c\u63d0\u5347\u7a00\u6709\u97f3\u7d20\u4e8c\u5143\u7ec4\u8986\u76d6\u7387", "\u4f7f\u752820%\u6838\u5fc3\u96c6\u8bad\u7ec3\u7684TTS\u5728\u4e24\u79cd\u8bed\u8a00\u4e0aCER\u663e\u8457\u4f4e\u4e8e\u7b49\u65f6\u957f\u968f\u673a\u9009\u62e9\u548c\u71b5\u9009\u62e9\uff1b\u5b5f\u52a0\u62c9\u8bed\u8fd8\u4ee54.5\u500d\u66f4\u5c11\u8bad\u7ec3\u65f6\u95f4\u4f18\u4e8e\u5168\u91cf\u8bad\u7ec3"], "keywords": ["\u8bed\u97f3\u5408\u6210", "\u6570\u636e\u9009\u62e9", "\u56fe\u5b66\u4e60", "\u4f4e\u8d44\u6e90\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24275v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Structure Before Sampling: Community-Aware Core-Set Selection for Data-Efficient Text-to-Speech", "tldr": "\u7528\u97f3\u7cfb\u56fe\u793e\u533a\u9009\u62e9\u9ad8\u6548TTS\u6838\u5fc3\u96c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06TTS\u8bed\u6599\u8868\u793a\u4e3a\u57fa\u4e8e\u97f3\u7d20\u76f8\u4f3c\u5ea6\u8fde\u63a5\u7684\u97f3\u7cfb\u56fe\uff0c\u5e76\u9a8c\u8bc1\u5176\u5b58\u5728\u663e\u8457\u793e\u533a\u7ed3\u6784\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u63d0\u51faCommunity Representative\u65b9\u6cd5\uff0c\u5728\u97f3\u7cfb\u793e\u533a\u95f4\u5747\u8861\u91c7\u6837\u3001\u793e\u533a\u5185\u5206\u6563\u9009\u62e9\uff0c\u4ee5\u66f4\u5c11\u8bed\u97f3\u6570\u636e\u8bad\u7ec3\u66f4\u597d\u7684TTS\u6a21\u578b\u3002", "why_notable": "\u5b83\u628a\u8bed\u6599\u9009\u62e9\u4ece\u7b80\u5355\u7edf\u8ba1\u91c7\u6837\u63a8\u8fdb\u5230\u7ed3\u6784\u5316\u56fe\u793e\u533a\u5efa\u6a21\uff0c\u80fd\u5728\u6602\u8d35\u7684TTS\u5f55\u5236\u573a\u666f\u4e2d\u663e\u8457\u51cf\u5c11\u6570\u636e\u4e0e\u8bad\u7ec3\u6210\u672c\uff0c\u540c\u65f6\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u8bed\u97f3\u5408\u6210\u8d28\u91cf\u3002"}, {"abstract": "Evaluation benchmarks for Indian language automatic speech recognition (ASR) suffer from two systematic biases: optimistic scores from clean, controlled audio conditions, and pessimistic scores from overly rigid transcription standards that penalize valid linguistic variations. We introduce Vimarsha, a 100-hour benchmark spanning all 22 scheduled Indian languages, designed to address both distortions. Vimarsha combines demographically diverse on-field recordings with carefully mined in-the-wild audio selected for acoustic difficulty, alongside a lattice of variations framework that encodes multiple valid transcriptions per utterance. Evaluations of 10 state-of-the-art ASR models reveal substantial shifts in model rankings under realistic conditions, geographic and demographic performance disparities, and systematic failure modes across speaking rates and acoustic environments.", "arxiv_id": "2609.24199", "arxiv_url": "https://arxiv.org/abs/2609.24199", "authors": ["Kaushal Santosh Bhogale", "Srija Anand", "Sadakopa Ramakrishnan Thothathiri", "Tahir Javed", "Sshubam Verma", "Mitesh M. Khapra"], "brief": "\u8bba\u6587\u63d0\u51fa Vimarsha\uff0c\u4e00\u4e2a\u8986\u76d6\u5370\u5ea6\u5168\u90e822\u79cd\u5b98\u65b9\u8bed\u8a00\u3001\u603b\u8ba1100\u5c0f\u65f6\u7684\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u7ed3\u5408\u4eba\u53e3\u7edf\u8ba1\u591a\u6837\u7684\u5b9e\u5730\u5f55\u97f3\u3001\u58f0\u5b66\u56f0\u96be\u7684\u91ce\u5916\u97f3\u9891\uff0c\u5e76\u7528\u201c\u53d8\u4f53\u683c\u201d\u8868\u793a\u540c\u4e00\u53e5\u8bdd\u7684\u591a\u79cd\u5408\u6cd5\u8f6c\u5199\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24199", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u73b0\u6709\u5370\u5ea6\u8bed\u8a00ASR\u8bc4\u6d4b\u4e2d\u201c\u5e72\u51c0\u97f3\u9891\u5bfc\u81f4\u8fc7\u5ea6\u4e50\u89c2\u201d\u548c\u201c\u8f6c\u5199\u6807\u51c6\u8fc7\u4e25\u5bfc\u81f4\u8fc7\u5ea6\u60b2\u89c2\u201d\u7684\u53cc\u91cd\u504f\u5dee\u8fdb\u884c\u4fee\u6b63", "\u8bc4\u6d4b10\u4e2a\u5148\u8fdbASR\u6a21\u578b\u540e\u53d1\u73b0\uff0c\u5728\u771f\u5b9e\u6761\u4ef6\u4e0b\u6a21\u578b\u6392\u540d\u4f1a\u663e\u8457\u53d8\u5316\uff0c\u5e76\u66b4\u9732\u5730\u57df\u4e0e\u4eba\u53e3\u7fa4\u4f53\u95f4\u7684\u6027\u80fd\u5dee\u5f02", "\u5206\u6790\u4e86\u8bed\u901f\u3001\u58f0\u5b66\u73af\u5883\u7b49\u56e0\u7d20\u4e0b\u7684\u7cfb\u7edf\u6027\u5931\u8d25\u6a21\u5f0f\uff0c\u4e3a\u66f4\u516c\u5e73\u53ef\u9760\u7684\u591a\u8bed\u8a00ASR\u8bc4\u6d4b\u63d0\u4f9b\u4f9d\u636e"], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u591a\u8bed\u8a00", "\u8bc4\u6d4b\u57fa\u51c6", "\u516c\u5e73\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24199v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Vimarsha: Faithful ASR Evaluation for Indian Languages with Demographic Diversity, In-the-Wild Audio and Spelling Variations", "tldr": "\u9762\u5411\u5370\u5ea622\u79cd\u8bed\u8a00\u7684\u771f\u5b9eASR\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Vimarsha\uff0c\u4e00\u4e2a\u8986\u76d6\u5370\u5ea6\u5168\u90e822\u79cd\u5b98\u65b9\u8bed\u8a00\u3001\u603b\u8ba1100\u5c0f\u65f6\u7684\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u8bc4\u6d4b\u57fa\u51c6\u3002\u5b83\u7ed3\u5408\u4eba\u53e3\u7edf\u8ba1\u591a\u6837\u7684\u5b9e\u5730\u5f55\u97f3\u3001\u58f0\u5b66\u56f0\u96be\u7684\u91ce\u5916\u97f3\u9891\uff0c\u5e76\u7528\u201c\u53d8\u4f53\u683c\u201d\u8868\u793a\u540c\u4e00\u53e5\u8bdd\u7684\u591a\u79cd\u5408\u6cd5\u8f6c\u5199\u3002", "why_notable": "\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e\u4f7f\u7528\u573a\u666f\uff0c\u5e76\u627f\u8ba4\u5370\u5ea6\u8bed\u8a00\u4e2d\u5e38\u89c1\u7684\u62fc\u5199\u548c\u8f6c\u5199\u53d8\u4f53\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u4f4e\u8d44\u6e90\u4e0e\u591a\u65b9\u8a00\u73af\u5883\u4e0b\u66f4\u516c\u5e73\u3001\u53ef\u4fe1\u7684\u8bed\u97f3\u8bc6\u522b\u8bc4\u6d4b\u3002"}, {"abstract": "Looped Language Models (LoopLMs) perform \"latent reasoning\" by recursively refining internal latent representations with shared weights, offering a more effective alternative to explicit verbal reasoning. Despite their effectiveness, we find that LoopLMs remain prone to loop instability: unstable refinement across iterations can produce localized uncertain \"hard\" tokens associated with reasoning errors. To address this, we propose LoopCD, loop-wise contrastive decoding that enhances the reasoning performance of LoopLMs by intervening on these tokens at inference time. Specifically, we exploit the internal dynamics of LoopLMs and contrast the logits from earlier iterations with logits from the last refined iteration to form the final sampling distribution. We find that this strategy is highly efficient, introducing only negligible inference overhead and requiring no additional training, while effectively improving reasoning performance by naturally refining reasoning-critical hard tokens. Extensive experiments show that our method improves the performance of recent representative LoopLMs across various reasoning tasks.", "arxiv_id": "2609.24196", "arxiv_url": "https://arxiv.org/abs/2609.24196", "authors": ["Byeongho Yu", "Junhyuk So", "Eunhyeok Park"], "brief": "\u672c\u6587\u63d0\u51fa LoopCD\uff0c\u4e00\u79cd\u9762\u5411 Looped Language Models \u7684\u63a8\u7406\u671f\u89e3\u7801\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u65e9\u671f\u5faa\u73af\u8fed\u4ee3\u4e0e\u6700\u7ec8\u8fed\u4ee3\u7684 logits\uff0c\u4fee\u6b63\u5faa\u73af\u4e0d\u7a33\u5b9a\u5bfc\u81f4\u7684\u9ad8\u4e0d\u786e\u5b9a\u201c\u96be token\u201d\uff0c\u4ece\u800c\u63d0\u5347\u63a8\u7406\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24196", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0 LoopLM \u5728\u9012\u5f52\u7ec6\u5316\u6f5c\u8868\u793a\u65f6\u5b58\u5728\u5faa\u73af\u4e0d\u7a33\u5b9a\uff0c\u5c40\u90e8\u9ad8\u4e0d\u786e\u5b9a token \u5f80\u5f80\u4e0e\u63a8\u7406\u9519\u8bef\u76f8\u5173", "LoopCD \u65e0\u9700\u989d\u5916\u8bad\u7ec3\uff0c\u5728\u63a8\u7406\u9636\u6bb5\u5229\u7528\u4e0d\u540c\u5faa\u73af\u8fed\u4ee3\u7684 logits \u505a\u5bf9\u6bd4\uff0c\u5f62\u6210\u6700\u7ec8\u91c7\u6837\u5206\u5e03", "\u5728\u591a\u79cd\u63a8\u7406\u4efb\u52a1\u548c\u4ee3\u8868\u6027 LoopLM \u4e0a\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\uff0c\u4e14\u4ec5\u5e26\u6765\u53ef\u5ffd\u7565\u7684\u63a8\u7406\u5f00\u9500"], "keywords": ["\u63a8\u7406\u589e\u5f3a", "\u5bf9\u6bd4\u89e3\u7801", "\u8bed\u8a00\u6a21\u578b", "\u6f5c\u5728\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24196v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LoopCD: Loop-wise Contrastive Decoding for Improving Reasoning in Looped Language Models", "tldr": "\u7528\u5faa\u73af\u5bf9\u6bd4\u89e3\u7801\u63d0\u5347LoopLM\u63a8\u7406\u7a33\u5b9a\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa LoopCD\uff0c\u4e00\u79cd\u9762\u5411 Looped Language Models \u7684\u63a8\u7406\u671f\u89e3\u7801\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u5bf9\u6bd4\u65e9\u671f\u5faa\u73af\u8fed\u4ee3\u4e0e\u6700\u7ec8\u8fed\u4ee3\u7684 logits\uff0c\u4fee\u6b63\u5faa\u73af\u4e0d\u7a33\u5b9a\u5bfc\u81f4\u7684\u9ad8\u4e0d\u786e\u5b9a\u201c\u96be token\u201d\uff0c\u4ece\u800c\u63d0\u5347\u63a8\u7406\u8868\u73b0\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5229\u7528 LoopLM \u5185\u90e8\u8fed\u4ee3\u52a8\u6001\u8fdb\u884c\u89e3\u7801\u5e72\u9884\uff0c\u4e0d\u6539\u6a21\u578b\u3001\u4e0d\u52a0\u8bad\u7ec3\u5373\u53ef\u6539\u5584\u6f5c\u5728\u63a8\u7406\u8d28\u91cf\uff0c\u5bf9\u63d0\u5347\u9ad8\u6548\u63a8\u7406\u6a21\u578b\u7684\u53ef\u9760\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Legal information in Bangladesh is inaccessible to most citizens. Statutory text is English-only, trained lawyers are concentrated in urban centres, and cloud-dependent AI fails where mobile connectivity is unreliable, a setting in which hallucinated legal text causes direct harm. The system addresses statutory interpretation only; queries that require judicial precedent or case-law reasoning fall outside its scope. We target the statutory access gap by compressing a 9-billion-parameter Gemma-2 teacher into a 2-billion-parameter student through two-phase progressive knowledge distillation. Phase 1 performs supervised fine-tuning on 9,429 quality-gated legal question-answer pairs (65% acceptance from 14,514 generated queries); Phase 2 minimises sparse Kullback-Leibler divergence against the teacher\u0027s top-50 per-token logits at temperature tau = 4.0, implemented via QLoRA (4-bit NF4, rank-32 LoRA adapters). Prior legal language models target general legal English; this system specialises in Bangladeshi statutory law. Every response is grounded through hybrid retrieval combining dense semantic search (60%) and BM25 (40%) across 36,029 statutory passages from the Bangladesh Constitution and national legislation. On a 50-query English benchmark, the distilled model reaches ROUGE-L 0.4715 and BERTScore F1 0.5679, a 103% ROUGE-L and 143% BERTScore gain over the retrieval-augmented undistilled baseline (ROUGE-L 0.2323, BERTScore 0.2340). The adapter quantises to 1.6 GB (GGUF Q4_K_M) and runs at 4-8 tokens per second on a Pixel 6 with no network access. Cross-lingual evaluation on 50 Bangla queries yields ROUGE-L 0.4083 and BERTScore 0.8133, showing effective retrieval from Bangla input against an English-only corpus. In a single-evaluator pilot, a practising lawyer rated 50 responses at a weighted mean of 4.16/5 (90% rated 4 or 5), supporting utility beyond text-overlap metrics.", "arxiv_id": "2609.24177", "arxiv_url": "https://arxiv.org/abs/2609.24177", "authors": ["MD. Nafis Kamal", "Mahadi Hasan Fahim", "Talha Ridwan", "Nadifa Zaman", "Fariha Roushon Florin", "Farig Yousuf Sadeque", "Saadat Rafid Ahmed"], "brief": "\u8be5\u8bba\u6587\u9762\u5411\u5b5f\u52a0\u62c9\u56fd\u6210\u6587\u6cd5\u68c0\u7d22\u95ee\u7b54\uff0c\u5c069B Gemma-2\u6559\u5e08\u6a21\u578b\u901a\u8fc7\u4e24\u9636\u6bb5\u77e5\u8bc6\u84b8\u998f\u538b\u7f29\u4e3a2B\u5b66\u751f\u6a21\u578b\uff0c\u5e76\u7ed3\u5408\u6df7\u5408\u68c0\u7d22\u5b9e\u73b0\u6cd5\u6761\u4f9d\u636e\u751f\u6210\u3002\u7cfb\u7edf\u4e13\u6ce8\u4e8e\u5baa\u6cd5\u4e0e\u56fd\u5bb6\u7acb\u6cd5\u7684 statutory interpretation\uff0c\u4e0d\u8986\u76d6\u5224\u4f8b\u63a8\u7406\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24177", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u75289429\u6761\u8d28\u91cf\u7b5b\u9009\u6cd5\u5f8b\u95ee\u7b54\u8fdb\u884c\u76d1\u7763\u5fae\u8c03\uff0c\u518d\u4ee5\u6559\u5e08\u6a21\u578btop-50 logits\u8fdb\u884c\u7a00\u758fKL\u84b8\u998f\uff0c\u91c7\u7528QLoRA 4-bit NF4\u4e0erank-32\u9002\u914d\u5668", "\u68c0\u7d22\u8986\u76d636029\u6bb5\u5b5f\u52a0\u62c9\u5baa\u6cd5\u4e0e\u56fd\u5bb6\u7acb\u6cd5\u6587\u672c\uff0c\u91c7\u752860%\u7a20\u5bc6\u8bed\u4e49\u68c0\u7d22\u4e0e40% BM25\u7684\u6df7\u5408\u68c0\u7d22\u6765\u964d\u4f4e\u5e7b\u89c9", "\u84b8\u998f\u540e\u82f1\u6587\u57fa\u51c6ROUGE-L\u8fbe0.4715\u3001BERTScore F1\u8fbe0.5679\uff1b\u91cf\u5316\u9002\u914d\u56681.6GB\uff0c\u53ef\u5728Pixel 6\u79bb\u7ebf\u4ee54-8 tokens/s\u8fd0\u884c"], "keywords": ["\u6cd5\u5f8b\u5927\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u7aef\u4fa7\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24177v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Efficient LLM Distillation for Bangladesh Legal Context: A Smartphone-Compatible Retrieval-Augmented Generation Model", "tldr": "\u5c06\u5b5f\u52a0\u62c9\u6cd5\u5f8bRAG\u84b8\u998f\u5230\u624b\u673a\u79bb\u7ebf\u8fd0\u884c", "upvotes": 0, "what_it_is": "\u8be5\u8bba\u6587\u9762\u5411\u5b5f\u52a0\u62c9\u56fd\u6210\u6587\u6cd5\u68c0\u7d22\u95ee\u7b54\uff0c\u5c069B Gemma-2\u6559\u5e08\u6a21\u578b\u901a\u8fc7\u4e24\u9636\u6bb5\u77e5\u8bc6\u84b8\u998f\u538b\u7f29\u4e3a2B\u5b66\u751f\u6a21\u578b\uff0c\u5e76\u7ed3\u5408\u6df7\u5408\u68c0\u7d22\u5b9e\u73b0\u6cd5\u6761\u4f9d\u636e\u751f\u6210\u3002\u7cfb\u7edf\u4e13\u6ce8\u4e8e\u5baa\u6cd5\u4e0e\u56fd\u5bb6\u7acb\u6cd5\u7684 statutory interpretation\uff0c\u4e0d\u8986\u76d6\u5224\u4f8b\u63a8\u7406\u3002", "why_notable": "\u5b83\u628a\u6cd5\u5f8bRAG\u3001\u77e5\u8bc6\u84b8\u998f\u548c\u7aef\u4fa7\u91cf\u5316\u7ed3\u5408\uff0c\u7528\u4e8e\u7f51\u7edc\u4e0d\u7a33\u5b9a\u4e14\u6cd5\u5f8b\u8d44\u6e90\u7a00\u7f3a\u7684\u5b5f\u52a0\u62c9\u573a\u666f\uff0c\u5c55\u793a\u4e86\u5c0f\u6a21\u578b\u5728\u4f4e\u8d44\u6e90\u53f8\u6cd5\u4fe1\u606f\u83b7\u53d6\u4e2d\u7684\u5b9e\u9645\u53ef\u7528\u6027\u4e0e\u793e\u4f1a\u4ef7\u503c\u3002"}, {"abstract": "Most existing time series forecasting methods rely solely on numerical observations, overlooking rich contextual information from auxiliary texts. Recent multimodal approaches attempt to incorporate textual signals, but they often treat text as static features or use large language models as forecasting backbones, limiting their ability to capture temporal dynamics and increasing computational cost. To address these challenges, we propose TAC-Time, a unified framework that transforms textual information into additional temporal channels. By modeling text features jointly with numerical sequences in a shared temporal backbone, TAC-Time preserves temporal continuity and periodic structures while remaining efficient and scalable. This formulation also enables systematic interpretability analyses. We show strong cross-modal dependencies through attention and frequency-domain analyses, and identify predictive textual signals whose correlation-aware alignment yields partial forecasting improvements. Extensive experiments on real-world multimodal benchmarks demonstrate that TAC-Time outperforms prior methods.", "arxiv_id": "2609.24156", "arxiv_url": "https://arxiv.org/abs/2609.24156", "authors": ["Jiayi Liang", "Xiaotian Gu", "Xinyu Xie", "Yuanbin Wu", "Xiaoling Wang"], "brief": "\u8bba\u6587\u63d0\u51fa TAC-Time\uff0c\u628a\u8f85\u52a9\u6587\u672c\u4fe1\u606f\u7f16\u7801\u4e3a\u989d\u5916\u7684\u65f6\u95f4\u5e8f\u5217\u901a\u9053\uff0c\u4e0e\u6570\u503c\u5e8f\u5217\u5728\u5171\u4eab\u65f6\u95f4\u9aa8\u5e72\u4e2d\u8054\u5408\u5efa\u6a21\u3002\u8be5\u65b9\u6cd5\u907f\u514d\u4f9d\u8d56\u5927\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u9884\u6d4b\u4e3b\u5e72\uff0c\u517c\u987e\u65f6\u95f4\u8fde\u7eed\u6027\u3001\u5468\u671f\u7ed3\u6784\u3001\u6548\u7387\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24156", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u6587\u672c\u7279\u5f81\u89c6\u4e3a\u968f\u65f6\u95f4\u53d8\u5316\u7684\u901a\u9053\uff0c\u800c\u975e\u9759\u6001\u7279\u5f81\uff0c\u4ece\u800c\u66f4\u597d\u6355\u6349\u8de8\u6a21\u6001\u65f6\u95f4\u52a8\u6001", "\u901a\u8fc7\u6ce8\u610f\u529b\u5206\u6790\u548c\u9891\u57df\u5206\u6790\u63ed\u793a\u6587\u672c\u4e0e\u6570\u503c\u5e8f\u5217\u4e4b\u95f4\u7684\u5f3a\u8de8\u6a21\u6001\u4f9d\u8d56", "\u5728\u771f\u5b9e\u591a\u6a21\u6001\u65f6\u95f4\u5e8f\u5217\u57fa\u51c6\u4e0a\u4f18\u4e8e\u5df2\u6709\u65b9\u6cd5\uff0c\u5e76\u901a\u8fc7\u76f8\u5173\u6027\u611f\u77e5\u5bf9\u9f50\u8fdb\u4e00\u6b65\u63d0\u5347\u90e8\u5206\u9884\u6d4b\u6548\u679c"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u591a\u6a21\u6001", "\u6587\u672c\u5efa\u6a21", "\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24156v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "TAC-Time: Texts as Channels For Multimodal Time Series Forecasting", "tldr": "\u5c06\u6587\u672c\u8f6c\u4e3a\u65f6\u95f4\u901a\u9053\u63d0\u5347\u591a\u6a21\u6001\u9884\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TAC-Time\uff0c\u628a\u8f85\u52a9\u6587\u672c\u4fe1\u606f\u7f16\u7801\u4e3a\u989d\u5916\u7684\u65f6\u95f4\u5e8f\u5217\u901a\u9053\uff0c\u4e0e\u6570\u503c\u5e8f\u5217\u5728\u5171\u4eab\u65f6\u95f4\u9aa8\u5e72\u4e2d\u8054\u5408\u5efa\u6a21\u3002\u8be5\u65b9\u6cd5\u907f\u514d\u4f9d\u8d56\u5927\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u9884\u6d4b\u4e3b\u5e72\uff0c\u517c\u987e\u65f6\u95f4\u8fde\u7eed\u6027\u3001\u5468\u671f\u7ed3\u6784\u3001\u6548\u7387\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u4e2d\u5229\u7528\u6587\u672c\u4e0a\u4e0b\u6587\u63d0\u4f9b\u4e86\u66f4\u8f7b\u91cf\u3001\u53ef\u6269\u5c55\u7684\u7edf\u4e00\u5efa\u6a21\u8303\u5f0f\uff0c\u517c\u5177\u6027\u80fd\u63d0\u5347\u548c\u53ef\u89e3\u91ca\u5206\u6790\u4ef7\u503c\uff0c\u9002\u5408\u91d1\u878d\u3001\u4ea4\u901a\u3001\u8206\u60c5\u7b49\u542b\u6587\u672c\u4fe1\u53f7\u7684\u9884\u6d4b\u573a\u666f\u3002"}, {"abstract": "Questions scraped from the web are used across academia and industry as a proxy for what people want to know. Across QA training data, retrieval benchmarks, and content strategy, questions on a page are assumed to reflect human intent. We test this assumption at scale by extracting 13.4B question occurrences across 110 FineWeb snapshots (2013-2025), and report three findings. First, you can tell who is asking: provenance (the host/page of questions) leaves a signal in question form, and a logistic model can separate genuine user questions from templated/manufactured ones at AUC 0.725 via length and surrounding context rather than question type, though only 0.554 against commerce FAQ writing. Second, question frequency does not measure demand: the most-frequent questions are boilerplate/templated (over 70% of the top thousand), so occurrence counts measure how often a string was published and not how often it was asked. Third, over twelve years the genuine share of occurrences fell by 79% (42-56% after controlling for crawl composition), with question length and context decreasing. We present the first diachronic, occurrence-level measurement of web question provenance, and find the crawlable web\u0027s questions have shifted from being asked by humans toward manufactured for machines to read.", "arxiv_id": "2609.24106", "arxiv_url": "https://arxiv.org/abs/2609.24106", "authors": ["Calvin Zhou", "Vincent McCloskey", "Krishna Srinivasan"], "brief": "\u8bba\u6587\u5927\u89c4\u6a21\u5206\u67902013-2025\u5e74FineWeb\u4e2d13.4B\u4e2a\u7f51\u9875\u95ee\u9898\u51fa\u73b0\u8bb0\u5f55\uff0c\u7814\u7a76\u7f51\u9875\u95ee\u9898\u662f\u5426\u771f\u5b9e\u53cd\u6620\u4eba\u7c7b\u4fe1\u606f\u9700\u6c42\u3002\u7ed3\u679c\u53d1\u73b0\u95ee\u9898\u7684\u6765\u6e90\u4f1a\u663e\u8457\u5f71\u54cd\u5176\u5f62\u5f0f\uff0c\u9891\u6b21\u66f4\u591a\u53cd\u6620\u53d1\u5e03\u673a\u5236\u800c\u975e\u771f\u5b9e\u9700\u6c42\uff0c\u4e14\u771f\u5b9e\u7528\u6237\u63d0\u95ee\u5360\u6bd4\u957f\u671f\u5927\u5e45\u4e0b\u964d\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24106", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u4e86110\u4e2aFineWeb\u5feb\u7167\u4e2d\u7684\u95ee\u9898\u51fa\u73b0\u7ea7\u6d4b\u91cf\uff0c\u8986\u76d613.4B\u6761\u95ee\u9898\u8bb0\u5f55\uff0c\u662f\u9996\u4e2a\u9762\u5411\u7f51\u9875\u95ee\u9898\u6765\u6e90\u7684\u957f\u671f\u5386\u65f6\u5206\u6790\u3002", "\u4ec5\u51ed\u95ee\u9898\u957f\u5ea6\u4e0e\u4e0a\u4e0b\u6587\u7b49\u7279\u5f81\uff0c\u903b\u8f91\u56de\u5f52\u6a21\u578b\u53ef\u533a\u5206\u771f\u5b9e\u7528\u6237\u95ee\u9898\u4e0e\u6a21\u677f\u5316/\u5236\u9020\u95ee\u9898\uff0cAUC\u8fbe0.725\uff0c\u4f46\u5bf9\u5546\u4e1aFAQ\u5199\u4f5c\u533a\u5206\u8f83\u5f31\u3002", "\u9ad8\u9891\u95ee\u9898\u4e3b\u8981\u662f\u6837\u677f\u5316\u5185\u5bb9\uff0c\u524d1000\u4e2a\u9ad8\u9891\u95ee\u9898\u4e2d\u8d85\u8fc770%\u4e3a\u6a21\u677f/\u56fa\u5b9a\u8bdd\u672f\uff0c\u8bf4\u660e\u51fa\u73b0\u9891\u6b21\u4e0d\u80fd\u7b49\u540c\u4e8e\u7528\u6237\u9700\u6c42\u5f3a\u5ea6\u3002", "12\u5e74\u95f4\u771f\u5b9e\u95ee\u9898\u51fa\u73b0\u5360\u6bd4\u4e0b\u964d79%\uff0c\u63a7\u5236\u6293\u53d6\u7ec4\u6210\u540e\u4ecd\u4e0b\u964d42-56%\uff0c\u663e\u793a\u53ef\u6293\u53d6\u7f51\u9875\u4e2d\u7684\u95ee\u9898\u8d8a\u6765\u8d8a\u9762\u5411\u673a\u5668\u9605\u8bfb\u800c\u975e\u4eba\u7c7b\u63d0\u95ee\u3002"], "keywords": ["\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u6570\u636e\u8d28\u91cf", "\u7f51\u7edc\u8bed\u6599", "\u95ee\u7b54\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.24106v1", "published_at": "2026-09-21", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "You Can Tell Who\u0027s Asking: What the Web\u0027s Questions Are Made Of, and Where They Come From", "tldr": "\u7f51\u9875\u95ee\u9898\u6b63\u4ece\u4eba\u7c7b\u63d0\u95ee\u8f6c\u5411\u673a\u5668\u5316\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5927\u89c4\u6a21\u5206\u67902013-2025\u5e74FineWeb\u4e2d13.4B\u4e2a\u7f51\u9875\u95ee\u9898\u51fa\u73b0\u8bb0\u5f55\uff0c\u7814\u7a76\u7f51\u9875\u95ee\u9898\u662f\u5426\u771f\u5b9e\u53cd\u6620\u4eba\u7c7b\u4fe1\u606f\u9700\u6c42\u3002\u7ed3\u679c\u53d1\u73b0\u95ee\u9898\u7684\u6765\u6e90\u4f1a\u663e\u8457\u5f71\u54cd\u5176\u5f62\u5f0f\uff0c\u9891\u6b21\u66f4\u591a\u53cd\u6620\u53d1\u5e03\u673a\u5236\u800c\u975e\u771f\u5b9e\u9700\u6c42\uff0c\u4e14\u771f\u5b9e\u7528\u6237\u63d0\u95ee\u5360\u6bd4\u957f\u671f\u5927\u5e45\u4e0b\u964d\u3002", "why_notable": "\u8fd9\u9879\u7814\u7a76\u6311\u6218\u4e86\u95ee\u7b54\u8bad\u7ec3\u6570\u636e\u3001\u68c0\u7d22\u8bc4\u6d4b\u548c\u5185\u5bb9\u7b56\u7565\u4e2d\u201c\u7f51\u9875\u95ee\u9898\u4ee3\u8868\u4eba\u7c7b\u610f\u56fe\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u5bf9\u6570\u636e\u96c6\u6784\u5efa\u3001\u641c\u7d22\u8bc4\u6d4b\u3001\u9700\u6c42\u5206\u6790\u548cLLM\u8bad\u7ec3\u8bed\u6599\u6e05\u6d17\u90fd\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Generative AI enables scalable production of educational videos, but current systems largely focus on producing visually coherent content rather than supporting learning. As a result, generated videos often lack explicit pedagogical structure, reliable quality control, and mechanisms for assessing learner understanding or addressing misconceptions. In this work, we introduce PIVOT (Pedagogy-guided Instructional VideO Tutoring), a generative video tutoring framework for STEM learning via learning-centered instructional support.1 Inspired by conventional teaching workflows, our framework integrates pedagogy into the full generation pipeline: it first uses instructional principles to guide storyboard generation, then produces verified multimodal videos through code-centric generation and a pedagogical verification harness, and finally connects videos with assessment and misconception-aware remediation. Experiments and expert evaluations across four STEM domains show that our framework produces educational videos with pedagogically aligned content, clear and engaging presentation, coherent instructional flow, and perceived effectiveness for learning. These findings suggest a human-centered perspective on educational content generation: generative systems should be evaluated and designed not only by what they produce, but also by how they support teaching practices, learner understanding, and corrective feedback.", "arxiv_id": "2609.24083", "arxiv_url": "https://arxiv.org/abs/2609.24083", "authors": ["Xinchen Ma", "Shuimu Wang", "Gaole He", "Yanbin Zhang", "Chunyang Wang", "Yunshi Lan", "Weining Qian"], "brief": "\u8bba\u6587\u63d0\u51fa PIVOT\uff0c\u4e00\u4e2a\u9762\u5411 STEM \u5b66\u4e60\u7684\u751f\u6210\u5f0f\u89c6\u9891\u8f85\u5bfc\u6846\u67b6\u3002\u5b83\u5c06\u6559\u5b66\u539f\u5219\u8d2f\u7a7f\u5206\u955c\u751f\u6210\u3001\u4ee3\u7801\u9a71\u52a8\u89c6\u9891\u751f\u6210\u3001\u6559\u5b66\u9a8c\u8bc1\u3001\u6d4b\u8bc4\u4e0e\u8bef\u89e3\u7ea0\u6b63\u7b49\u73af\u8282\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.24083", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7528\u6559\u5b66\u539f\u5219\u6307\u5bfc storyboard \u751f\u6210\uff0c\u4f7f\u89c6\u9891\u5177\u5907\u660e\u786e\u6559\u5b66\u7ed3\u6784\u4e0e\u8fde\u8d2f\u8bb2\u89e3\u6d41\u7a0b", "\u91c7\u7528\u4ee3\u7801\u4e2d\u5fc3\u7684\u591a\u6a21\u6001\u89c6\u9891\u751f\u6210\uff0c\u5e76\u52a0\u5165\u6559\u5b66\u9a8c\u8bc1\u673a\u5236\u63d0\u5347\u5185\u5bb9\u53ef\u9760\u6027", "\u5c06\u751f\u6210\u89c6\u9891\u4e0e\u5b66\u4e60\u8bc4\u4f30\u3001\u5e38\u89c1\u8bef\u89e3\u8bc6\u522b\u548c\u8865\u6551\u8bb2\u89e3\u76f8\u8fde\u63a5"], "keywords": ["\u6559\u80b2\u667a\u80fd", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u4e2a\u6027\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/
