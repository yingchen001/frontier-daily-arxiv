<style>

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }

  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }
  .modal-box h2 { margin:0 30px 12px 0; font-size:20px; line-height:1.45; }

  .modal-box .lbl { font-weight:700; margin:16px 0 6px; font-size:14px; }
  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .pdfwrap iframe { width:100%; height:100%; border:0; }

<script>
const PAPERS = [{"abstract": "Language model agents often abandon correct work when a user challenges it, yet simply telling them to stand firm makes them ignore real mistakes. Once an agent reads a complaint, it tends to discount its own earlier checks in order to agree with the user. We introduce Thinking-in-Bets, a training-free method in which an agent writes a short private record of its main claims, the checks supporting them, and its confidence before reading user feedback. When challenged, the agent consults this Claim Checklist to keep verified work intact while investigating uncertain or newly challenged parts. We evaluate five Gemini models (3.5 Flash-Lite, 3.5 Flash, 3.6 Flash, 3.8 Flash, and 4.0 Argon) across eight benchmarks: SWE-Together, SWE-Interact, and DeepSWE for software engineering, Agents\u0027 Last Exam for professional reports, Humanity\u0027s Last Exam and SycEval for academic reasoning, Vals Finance for financial analysis, and Terminal-Bench for command-line tasks. Recording claims before criticism nearly eliminates false reversals in patch review and protects passing report drafts under mistaken pushback, whereas writing the same record after reading the complaint recovers very little of the gain. In multi-turn coding, pre-reply claim records substantially reduce unnecessary file edits after mistaken complaints, and gating the record so it is written only when the agent is uncertain lowers token overhead while fixing more real bugs than the baseline. Even in non-interactive tasks without user feedback, listing the key claims in a draft and re-checking the weakest one before submission improves both answer accuracy and confidence estimates across all tested models.", "arxiv_id": "2610.34654", "arxiv_url": "https://arxiv.org/abs/2610.34654", "authors": ["Nghi D. Q. Bui"], "brief": "", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34654", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2610.34654v1", "published_at": "2026-10-26", "score": 0.472, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34654.png", "title": "Thinking-in-Bets at Test Time Reduces Sycophantic Revisions in LLM Agents", "tldr": null, "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Reusable Web-agent verification requires a rule to follow changing requirements and support subsequent execution. We introduce AgentProofBench, which connects paired tests of a frozen acceptance rule to execution from identical saved openings. The resource spans 97 tasks, 79 families, and four Web services. Experiments with DeepSeek Flash/Pro establish two linked measurements. Across 48 families, complete-panel and decision-replay tests retain 82/96 Flash and 79/96 Pro source programs; paired reuse-rebuild BA intervals are [-5.47, 1.57] and [-10.16, 0.00] percentage points. Across 22 execution families, deployment-state panel correctness separates program assignments whose two saved openings are both delivered correctly: 32/33 assignments with error-free panels, versus 1/11 with panel errors. All reference-defined program-gate regressions and withheld deliveries occur in the latter group. Neutral continuation attains the highest correct delivery under the tested generic feedback, providing a concrete baseline for measuring the value added by a gate. Released instructions, states, programs, reference rules, and trajectories connect each test failure to its execution consequences. AgentProofBench makes reusable verification assessable at both the requirement and policy levels.", "arxiv_id": "2610.34634", "arxiv_url": "https://arxiv.org/abs/2610.34634", "authors": ["Jingjie Ning", "Xueqi Li", "Yi Lu", "Yibo Kong"], "brief": "", "categories": ["cs.MA", "cs.AI", "cs.SE"], "github_repo": "https://github.com/EthanNing/AgentProofBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34634", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.34634v1", "published_at": "2026-10-25", "score": 0.449, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34634.png", "title": "AgentProofBench: Benchmarking Reusable Verifiers for Web Agents", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "An agent that truly knows and acts on behalf of its user has been a long-standing promise of AI assistants. Computer-use agents bring this promise within reach by capably executing fully specified tasks across apps. However, real-world user requests are often underspecified. To act correctly for the particular user, an agent must infer some missing information from the user\u0027s activity history and ask for other information that only the user can provide, without making unsupported assumptions or burdening the user with unnecessary questions. We present iPrefBench, a benchmark for evaluating the infer and ask capabilities of personal mobile-use agents in an executable iOS environment with an interactive simulated user. Grounded in a coherent persona with 3,051 past activity events, iPrefBench comprises 130 underspecified user tasks across 26 apps. Each omitted user-dependent requirement is, by construction, either history-inferable or ask-only. iPrefBench evaluates personalized mobile agents on both whether agents complete tasks correctly for the user (i.e., personalized task completion) and whether they seek user input when necessary (i.e., user-agent interaction). Evaluation of 7 frontier agents reveals a substantial gap between execution and personalization. Agents achieve high action completion scores (up to 91.6%) but low full task success (up to 47.7%) because personalization lags behind. They especially struggle with ask-only information, failing to request enough necessary information. Our findings highlight a challenge for personalized agents in knowing what to infer and when to ask. We hope that iPrefBench can serve as a valuable testbed for building agents that know their user and work with them.", "arxiv_id": "2610.34735", "arxiv_url": "https://arxiv.org/abs/2610.34735", "authors": ["Yuting Ning", "Ruijia Cheng", "Sushobhan Ghosh", "Peitong Duan", "HungShi Lin", "Abhishek Sundararajan", "Shreyash Pandey", "Huan Sun", "Jeffrey Nichols", "Eldon Schoop"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34735", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Apple", "pdf_url": "https://arxiv.org/pdf/2610.34735v1", "published_at": "2026-10-26", "score": 0.438, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Apple", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34735.png", "title": "iPrefBench: A User-Centric Benchmark for Personalized Mobile Use Agents", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models are shifting from offline passive understanding toward online proactive interaction. However, prevailing methods largely rely on explicit requests while miss the implicit user intent (e.g., \"where should I click next?\" while a user navigate a website), meanwhile fail to update the state simultaneously as user requests might update continuously. These limitations make them less suited to intent-aware interaction in practical. To address these challenges, we introduce StreamVibe-Bench, a new benchmark serving as testbed for user intent interaction, with 4.1K evaluation samples and 85K training samples spanning explicit, implicit, and dynamic intents. Building on this benchmark, we develop StreamVibe-VL, a streaming proactive model that infers implicit user intents from continuous observations and dynamically tailors its interactions as these intents evolve. We further introduce StreamVibe-Harness, which maintains user intents as persistent states with a fleixble lifecycles via a hierarchical memory to track the latest user intent and environmental state. Our experiments reveal three key findings: (i) StreamVibe-VL preserves strong general video understanding while improving response timing and answer quality by 10.7% over other baselines; (ii) existing proactive models remain limited in understanding user intent and deciding when to respond, especially under implicit and dynamic intents; and (iii) StreamVibe-Harness further improves response consistency and adaptation over sustained interaction, resulting in a 12.3% gain in proactive interaction.", "arxiv_id": "2610.34662", "arxiv_url": "https://arxiv.org/abs/2610.34662", "authors": ["Chengzhi Liu", "Yuxiang Lai", "Yuzhe Yang", "Yanqing Liu", "Jiheng Hou", "Yue Cao", "Haonan Wang", "Ruixi Fan", "Lan Wang", "Sheng Liu", "Songyou Peng", "Yale Song", "Kevin Qinghong Lin", "Xin Eric Wang", "Jui-Hsin Lai", "Youbao Tang"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34662", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2610.34662v1", "published_at": "2026-10-26", "score": 0.4, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (246\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34662.png", "title": "StreamVibe: Proactive Video Agents for Evolving User Intent", "tldr": null, "upvotes": 246, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent systems often rely on predefined collaboration structures, limiting their ability to adapt to diverse task requirements. We introduce DynaFlow, a framework that integrates free-form executable workflow synthesis into the action space of the main agent. The agent decides when collaboration is needed and generates task-specific programs that coordinate sub-agents through sequential or parallel execution, structured information exchange, and verification. Execution results and traces inform subsequent actions, enabling the agent to adapt collaboration as reasoning progresses. We train only the main agent through supervised fine-tuning on distilled trajectories, followed by refinement on examples filtered for unsupported premises, biased verification, and information-flow defects. All sub-agents remain fixed, separating orchestration learning from executor capability improvement. Across six benchmarks spanning mathematical reasoning, scientific question answering, and multi-hop retrieval, DynaFlow achieves 88.08% overall accuracy in Forced mode, outperforming the strongest evaluated baseline by 10.90 percentage points with the same Qwen3.5-27B backbone. Workflow analysis finds more explicit use, verification, and refinement of upstream outputs after training, highlighting cross-stage information flow as a key dimension of multi-agent orchestration.", "arxiv_id": "2610.34467", "arxiv_url": "https://arxiv.org/abs/2610.34467", "authors": ["Ruhao Liu", "Qi Li", "Shizun Wang", "Xinchao Wang"], "brief": "", "categories": ["cs.MA"], "github_repo": "https://github.com/amiya-special/Dynaflow", "github_stars": 53, "hf_url": "https://huggingface.co/papers/2610.34467", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.34467v1", "published_at": "2026-10-25", "score": 0.378, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (189\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34467.png", "title": "DynaFlow: Learning Free-Form Multi-Agent Orchestration", "tldr": null, "upvotes": 189, "what_it_is": null, "why_notable": null}, {"abstract": "Critic-free methods are widely used in reinforcement learning with verifiable rewards (RLVR) for long chain-of-thought (CoT) reasoning, avoiding difficult and costly critic training. Common alternatives lack token-level credit assignment and typically rely on grouped rollouts to estimate prompt-specific baselines. A critic can address both limitations, but long-CoT critic training is hindered by insufficient coverage of trajectories with diverse lengths and early gradients dominated by the newly initialized value head. We introduce S3AC (Stabilized, Selective, and Scalable Actor-Critic) for LLM reasoning, built around a practical critic-training recipe. The trained critic provides token-specific advantages and prompt-specific baselines. Using the prompt-level baseline to estimate difficulty, we propose Difficulty-Aware Prompt Sampling (DAPS). DAPS combines this estimate with outcome history to select prompts before generation, reducing rollout waste without offline difficulty initialization. S3AC improves group-rollout performance across dense and mixture-of-experts models from 1.5B to 397B parameters, outperforming a modern GRPO variant (GRPO-X). At 35B, it sustains single-rollout training while tested critic-free baselines deteriorate after initial gains.", "arxiv_id": "2610.35518", "arxiv_url": "https://arxiv.org/abs/2610.35518", "authors": ["Shuo Shen", "Guangran Cheng", "Chengqi Lyu", "Xiangsen Wang", "Yanan Sun", "Wenwei Zhang"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/InternLM/xtuner", "github_stars": 5220, "hf_url": "https://huggingface.co/papers/2610.35518", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2610.35518v1", "published_at": "2026-10-26", "score": 0.368, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (16\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35518.png", "title": "S3AC: Stabilized, Selective, and Scalable Actor-Critic for LLM Reasoning", "tldr": null, "upvotes": 16, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive world generation requires models to follow successive commands while preserving relevant history and action consequences. We present Hy-Nomas, a video world model with an 8B diffusion backbone that supports free-form text instructions and continuous camera control across multiple interaction turns. It generates variable-length segments conditioned on current inputs and cached history. Our central design aligns structured video captions with action-aware causal attention: descriptive context remains accessible across segments, while action instructions are restricted to their intended temporal windows. A vision-language Prompt Enhancer (PE) translates user requests and multimodal interaction histories into structured conditions for the next segment. A multi-stage curriculum progressively introduces causal generation, text interaction, camera control, and training on model-generated histories, followed by diffusion distillation. In human evaluation, Hy-Nomas shows superior performance over existing world models. We release model weights, code and benchmarks, together with a lightweight adaptation workflow, to support reproducible research on interactive world generation.", "arxiv_id": "2610.36729", "arxiv_url": "https://arxiv.org/abs/2610.36729", "authors": ["Qiaoling Chen", "Jiaxiang Cheng", "Xueqing Deng", "Tiankai Hang", "Ji Hou", "Jiaqi Li", "Yifan Liu", "Tao Lu", "Junshu Tang", "Yu Tang", "Yao Teng", "Yu Tian", "Heng Wang", "Weizhi Wang", "Xiyao Wang", "Xilun Wu", "Mingyu Yang", "Yangbin Yu", "Rui Zhao", "Longjun Cao", "Linghao Chen", "Haoyi Duan", "Jiaming Han", "Mingji Han", "Enhua Jiang", "Shunkai Li", "Yanzhe Liang", "Qinwei Ma", "Cong Wang", "Lei Wang", "Bing Wu", "Ke Xing", "Ray Ying", "Zhentao Yu", "Key Zhang", "Yuan Zhou", "Zhengguang Zhou", "Kai Zou"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Tencent-Hunyuan/Hy-Nomas", "github_stars": 274, "hf_url": "https://huggingface.co/papers/2610.36729", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2610.36729v1", "published_at": "2026-10-27", "score": 0.35, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36729.png", "title": "Hy-Nomas: Towards Free-form Interactive World Generation", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Scaling vision-language-action (VLA) models is constrained by scarce action-labeled demonstrations and incompatible control spaces across robot embodiments. We present RynnVLA-Latent, a framework that turns heterogeneous interaction videos into scalable supervision for robot policy pretraining. At its core, RynnLAM learns continuous, 3D-grounded latent actions from visual transitions without requiring native robot controls. By combining residual future-feature prediction, camera-compensated 3D-flow supervision, and camera-motion decoupling, RynnLAM encourages representations that capture control-relevant motion rather than appearance changes alone. We apply RynnLAM to 30.1K hours of human, robot, and simulation videos, producing 745.52M latent-action descriptors. RynnVLA-Latent then learns to predict latent-action chunks from visual observations and language through flow matching, before adapting its pretrained backbone and action expert to embodiment-specific robot actions. The resulting 4B policy achieves 98.8% success on LIBERO, 84.7% on LIBERO-Plus without benchmark-specific adaptation, 51.9% average success across five VLABench tracks, and 88.6% average success on the RoboTwin 2.0 bimanual benchmark. It also achieves the highest observed success rates among the compared methods on six real-world manipulation tasks across dexterous-hand and mobile-gripper platforms. Together with representation ablations and data-scaling results, these findings demonstrate the potential of latent-action supervision for scaling robot policy learning beyond native action-labeled data.", "arxiv_id": "2610.34356", "arxiv_url": "https://arxiv.org/abs/2610.34356", "authors": ["Haoyu Zhao", "Xingyue Zhao", "Zhian Su", "Bohan Hou", "Yinzhou Tang", "Fengyi Wang", "Kehan Li", "Yuming Jiang", "Siteng Huang", "Xin Li", "Zhenyu Zeng", "Mingxiu Chen", "Deli Zhao", "Zhongyu Li"], "brief": "", "categories": ["cs.RO"], "github_repo": "https://github.com/alibaba-damo-academy/RynnVLA-Latent", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.34356", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "DAMO Academy", "pdf_url": "https://arxiv.org/pdf/2610.34356v1", "published_at": "2026-10-25", "score": 0.335, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34356.png", "title": "RynnVLA-Latent: Scaling Robotic Manipulation Foundation Models with 3D-Grounded Latent Actions", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Rubric-based rewards enable effective reinforcement learning on non-verifiable tasks. However, because these rewards are typically defined as a weighted measure of rubric coverage, models are trained primarily to maximize a recall objective. As a result, RL-trained models produce responses that are more complete but also more verbose and contain more unnecessary or factually incorrect content, leading them to be less preferred than responses from the base model. To address this issue, we present the FORK reward, which jointly optimizes recall and a novel precision objective, which requires each unit of a model response to be both necessary and factually correct, as measured by rubric-driven necessity credits and a factual-correctness grader, respectively. Our experimental results show that FORK outperforms existing rubric-based RL methods and achieves Pareto-optimal performance that balances rubric coverage and overall response quality. Compared to the original recall-based reward, FORK substantially improves precision and reduces response length while achieving similar rubric coverage, which leads to significantly higher win rate compared to the base policy (e.g., from 10.6% to 68.0% on RubricHub-Medical and from 22.1% to 74.1% on HealthBench).", "arxiv_id": "2610.33512", "arxiv_url": "https://arxiv.org/abs/2610.33512", "authors": ["Hyun Ryu", "Jong-Heon Kim", "Yiqing Xie", "Seungone Kim", "Carolyn Rose", "Eunho Yang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/JHKim631/FORK", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.33512", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.33512v1", "published_at": "2026-10-24", "score": 0.331, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (34\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33512.png", "title": "Eat Your Precision: Precision Objective Mitigates Reward Hacking in Rubric-based RL", "tldr": null, "upvotes": 34, "what_it_is": null, "why_notable": null}, {"abstract": "Learning visual design is essential for prompt enhancement (PE) to turn underspecified user requests into coherent visual specifications for text-to-image (T2I) generation. Existing methods preserve user intent and improve overall visual appeal, with less explicit emphasis on fine-grained design dimensions. To address this gap, we introduce Qwen-Image-PE, which learns visual design through two-stage training. Supervised fine-tuning with Caption-Based Reverse Distillation (CRD) uses dense captions of well-designed images as design supervision. Reinforcement learning with Groupwise Design Reward (GDR) jointly compares all candidate images for the same request to refine lighting, composition, layout, and detail. On Qwen-Image-Bench with Qwen-Image-2.1, Qwen-Image-PE-397B improves over original requests by 7.81 points, while Qwen-Image-PE-9B outperforms all evaluated PE baselines. Further evaluations show gains in visual design, aesthetics, image quality, and human preference. We find that PE scales along three axes: training data, model size, and information density, with sufficient information density as a prerequisite for effective enhancement. Moreover, we demonstrate that Qwen-Image-PE generalizes to four additional T2I backbones, even surpassing native prompt enhancers on HunyuanImage-2.1 and FLUX 3 Image Klein. We release Qwen-Image-PE-9B at https://huggingface.co/Qwen/Qwen-Image-2.1-PE-T2I.", "arxiv_id": "2610.33472", "arxiv_url": "https://arxiv.org/abs/2610.33472", "authors": ["Zekai Zhang", "Yanran Zhang", "Shengming Yin", "Yan Shu", "Zhening Liu", "Bingxuan Zhao", "Chenyang Zhu", "Donghao Zhou", "Jiahao Li", "Jiahao Wang", "Jie Zhang", "Kaiyuan Gao", "Kun Yan", "Lihan Jiang", "Ningyuan Tang", "Qihang Ai", "Rui Song", "Shuo Cao", "Xiao Xu", "Xiaoyue Chen", "Yuxiang Chen", "Zhendong Wang", "Zhouyang Li", "Zihao Liu", "Zikai Zhou", "Bo Zheng", "Huishuai Zhang", "Dongyan Zhao", "Chenfei Wu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33472", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2610.33472v1", "published_at": "2026-10-24", "score": 0.328, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (24\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33472.png", "title": "Qwen-Image-PE: Learning Visual Design for Text-to-Image Prompt Enhancement", "tldr": null, "upvotes": 24, "what_it_is": null, "why_notable": null}, {"abstract": "Localized AI manipulations in long-form videos often affect brief events within otherwise authentic content, making video-level classification insufficient for forensic analysis. Existing audio-visual deepfake benchmarks largely focus on short talking-head clips, while long-form temporal forensics remains predominantly visual. We introduce AV-FABLE, a dual-timeline benchmark for sparse manipulations in open-scene long-form audio-visual videos. AV-FABLE contains 16,650 pristine--manipulated twin pairs (998 hours) created with 27 editing configurations, with separate audio and visual timelines that enable modality-specific temporal localization and expose errors hidden by joint-timeline evaluation. On AV-FABLE, zero-shot prompting of audio-visual large language models (AV-LLMs) yields near-chance detection and poor temporal localization. In contrast, supervised readouts of their frozen perception features recover strong forensic signals, suggesting manipulation evidence is encoded in these representations but not effectively exposed through language outputs. Motivated by this observation, we propose NFSR(Native Forensics via Separated Readouts), which reads frozen AV-LLM features with separate audio and visual temporal decoders. NFSR achieves the best audio-visual localization performance in-domain and across all three out-of-distribution settings, including transfer to held-out videos from an external long-video forensic benchmark. AV-FABLE, code, and model weights will be publicly released.", "arxiv_id": "2610.33413", "arxiv_url": "https://arxiv.org/abs/2610.33413", "authors": ["Yuesheng Huang", "Hoi Fan Au", "Jiaqi Hou", "Ruicheng Zhang", "Jiarui He", "Haocheng Yang", "Bin Hu", "Kewei Zhang", "Weijian Deng", "Jun Zhou", "Xiu Li"], "brief": "", "categories": ["cs.CV", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33413", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2610.33413v1", "published_at": "2026-10-24", "score": 0.315, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (38\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33413.png", "title": "AV-FABLE: Audio-Visual Manipulation Forensics in Long-Form Videos", "tldr": null, "upvotes": 38, "what_it_is": null, "why_notable": null}, {"abstract": "Large-scale AI training increasingly relies on massive video datasets with random temporal sampling patterns. However, existing video storage paradigms are optimized for sequential playback and employ sophisticated inter-frame reference structures to maximize compression efficiency. When applied to the random-sampling workloads of AI training, these paradigms face substantial decoding-efficiency bottlenecks. Workarounds such as independent JPEG frames and short groups of pictures (GOPs) reduce decoding work at the cost of larger storage and transfer volumes. In this paper, we identify two sources of decode amplification: sequential reconstruction of unrelated frames and reconstruction of the reference chains required by sampled targets. We address both sources by co-designing the decoding schedule and video reference structure. Dependency-aware sparse decoding reconstructs only requested frames and their required references, skipping unrelated reconstruction without transcoding the source videos. Optional offline Dependency-Decoupled Random Access (DDRA) encoding further reduces reference reconstruction by restricting each interior frame to two bounding intra-coded anchors. Together, sparse decoding and DDRA retain inter-frame prediction while bounding reconstruction to at most three frames per requested target, independent of the intra period. Experiments on a large-scale robotics corpus show that, at comparable reconstruction quality, our method achieves $1.45\\times$ the loading throughput of LeRobot v3 with 58.7% less media payload.", "arxiv_id": "2610.33079", "arxiv_url": "https://arxiv.org/abs/2610.33079", "authors": ["Zetian Song", "Qize Yu", "Yue Chen", "Bohan Zhou", "Bowen Ping", "Yuqi Ye", "Haocheng Tang", "Haotian Zhang", "Qizhe Wang", "Shiyu Huang", "Jiaqi Zhang", "Siwei Ma", "Wen Gao"], "brief": "", "categories": ["cs.CV", "eess.IV"], "github_repo": "https://github.com/kaname-madoka18/codec4AI", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.33079", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2610.33079v1", "published_at": "2026-10-21", "score": 0.298, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33079.png", "title": "Rethinking Video Storage for AI Training: Breaking Cross-Frame Dependencies for Efficient Random Access", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Generative models increasingly expose a reasoning effort setting that lets users scale inference-time compute, trading higher cost for potentially improved performance. Users must choose an effort level before knowing whether extra reasoning will help, and even a successful run does not reveal whether the effort purchased was necessary. Reasoning effort is therefore a credence good: buyers observe the outcome but cannot assess the marginal value of the computation they paid for. In this work, we measure the counterfactual effect of effort levels on both proprietary and open-weight models on four benchmarks, spanning single-call reasoning and long-horizon agentic tasks. Effort, it turns out, does not consistently preserve tasks that lower effort solves, can overspend, and can change trajectory behavior. First, we find that although higher effort can raise accuracy in aggregate, it frequently fails on tasks that lower effort solved. Second, on the subset of easy tasks that every effort level solves, higher effort is generally more costly, with the highest effort level costing up to 42x as much as the lowest. Lastly, effort changes not only how many tokens are used, but also how agents solve tasks: at higher effort, agents verify their own work more heavily and more often search for solutions than work through problems directly, both of which lengthen trajectories without necessarily altering the outcome. These findings show that naively choosing the highest level is not only cost-inefficient but also offers no guarantee of the best instance-level performance. A simple alternative, starting at the lowest effort and escalating only after a verified failure, matches or improves on fixed top effort across all models and benchmarks at lower cost for most proprietary models.", "arxiv_id": "2610.34491", "arxiv_url": "https://arxiv.org/abs/2610.34491", "authors": ["Kaiser Sun", "Yongchan Kwon", "Zain Hasan", "Shang Zhu", "Kaitlyn Zhou", "Federico Bianchi"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/KaiserWhoLearns/ReasoningEffortLLM", "github_stars": 34, "hf_url": "https://huggingface.co/papers/2610.34491", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Together", "pdf_url": "https://arxiv.org/pdf/2610.34491v1", "published_at": "2026-10-25", "score": 0.289, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34491.png", "title": "What Effort Level Should I Choose? On the Economics of Reasoning Effort in LLM Agents", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Can LLM agents carry a hard real-world problem from raw data to a system that holds its own against people? We study this in Hearthstone Battlegrounds, an eight-player auto-battler with stochastic shops and battles, hidden information and nearly a thousand interacting cards. We present AutoTavern, a self-improving research system: specialised LLM research agents share a typed research memory, every claim passes verification gates, and live games close the loop, so the agents improve the simulator, opponents and policy and, from the same feedback, their own research process; a human sets goals and rules on ambiguous mechanics. In 20 days AutoTavern built TavernGym, the first faithful, full-content reproduction of the live game, and delivered 23 versions of TavernAgent, trained with PPO against opponents calibrated to real games. TavernAgent plays complete games on the live ladder by itself: its rating rose from 6,000 to about 15,000 and, on the public leaderboard\u0027s measure, its last 20 records average a placement of 1.60 with 80% first places, better than the server\u0027s ten highest-rated players on every statistic (2.34, 59%). TavernBench, 960 tasks in 40 scenarios, shows that the system the agents built is the strongest player: TavernAgent answers 91% of the play tasks against at most 63% for frontier LLMs, and decides in 0.03 s where they need up to 26 s; within the second a live turn allows, it keeps 90% and no LLM more than 26%. LLM agents build far better than they play. We will open-source TavernBench and TavernGym at https://github.com/MCG-NJU/AutoTavern.", "arxiv_id": "2610.33845", "arxiv_url": "https://arxiv.org/abs/2610.33845", "authors": ["Changlian Ma", "Limin Wang"], "brief": "", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": "https://github.com/MCG-NJU/AutoTavern", "github_stars": 68, "hf_url": "https://huggingface.co/papers/2610.33845", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.33845v1", "published_at": "2026-10-24", "score": 0.264, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33845.png", "title": "Build, Don\u0027t Play: Self-Improving LLM Research Agents Develop a Hearthstone Battlegrounds AI That Rivals Top Players", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive self-improvement (RSI), in which a system also improves the way it improves, is a long-standing aspiration on the path to AGI. Language agents increasingly store procedural knowledge in reusable skills. Optimizing skills offers a direct way to achieve RSI, because the optimization procedure itself can be encoded as a skill. Existing skill optimizers, however, follow a hand-designed procedure. Even methods that evolve a meta-skill confine it to a fixed pipeline and relearn it for each task. We present Skill$^{\\infty}$, which makes skill optimization recursively self-improving: a meta agent follows a meta-skill to optimize task skills and optimizes the meta-skill itself using the same procedure. The optimization is agent-led. The meta agent diagnoses execution traces, proposes candidates, requests independent reviews, and allocates the search budget. The meta-skill defines these steps, allowing self-improvement to rewrite them. This meta-skill is also decoupled from task skills, refined on multiple skill optimization tasks and then reused to optimize task skills across diverse domains. As in deployment, skills at both levels are standard packages loaded through native skill discovery. On 83 SkillsBench tasks, Skill$^{\\infty}$ reaches a pass rate of 60.7%, compared with 56.4% for human-curated skills and 54.5% for SkillEvolver.", "arxiv_id": "2610.35434", "arxiv_url": "https://arxiv.org/abs/2610.35434", "authors": ["Wangcheng Tao", "Zhanglu Yan", "Han Wu", "Weng-Fai Wong"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.35434", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.35434v1", "published_at": "2026-10-26", "score": 0.264, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35434.png", "title": "Skill$^{\\infty}$: Recursive Self-Improvement for Agent Skill Optimization", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "The rise of large language models (LLMs) has opened a path toward generalist embodied AI, raising the question of how LLMs can act in the physical world. One straightforward approach is training the model to generate actions: collect robot-action data and video demonstration, refine LLM architecture with an action head, and train a vision-language-action (VLA) model at scale. However, we argue that coding agents have the potential to realize generalist embodied manipulation. All they need is a simple yet effective robot harness. We present RoboHarness: a robotic harness that gives LLM agents a visual-geometric control panel so that they can directly understand and invoke embodied tasks. With RoboHarness, Qwen3.8-Flash-Next outperforms state-of-the-art VLA models on BEHAVIOR Challenge 2025 tasks. The implementation is open source.", "arxiv_id": "2610.14018", "arxiv_url": "https://arxiv.org/abs/2610.14018", "authors": ["Bince Qu", "Wei Chen", "Bo Zhang"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/BinceQu/RoboHarness", "github_stars": 269, "hf_url": "https://huggingface.co/papers/2610.14018", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2610.14018v2", "published_at": "2026-09-29", "score": 0.263, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14018.png", "title": "RoboHarness: A Simple Harness Outperforms VLA and World Action Models", "tldr": null, "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) has emerged as the primary paradigm for optimizing Large Language Model (LLM) agents, yet efficient critic-free algorithms (e.g., GRPO) suffer from a fundamental uniform credit assignment dilemma that broadcasts trajectory-level advantages equally to all actions. Our analysis reveals that this uniformity inherently reinforces structurally unreasonable actions in preferred trajectories and ignores each action\u0027s downstream deviations in unpreferred ones. To resolve this without introducing critic overhead, we propose Progress-Aware Advantage Shaping (ProAS), a plug-and-play framework that leverages a dynamically evolving Agentic Reference Graph (ARG) to achieve fine-grained credit assignment via Masking Unreasonable Incentives (MUI) and Asymmetric Penalty Redistribution (APR). Extensive experiments across Qwen2.5-1.5B-Instruct and Qwen2.5-7B-Instruct demonstrate that ProAS universally elevates mainstream group-based baselines to new state-of-the-art performance, achieving peak success rates of 91.9% and 94.3% on ALFWorld, alongside 66.7% and 70.8% on WebShop, respectively. Furthermore, it accelerates training convergence by up to $2.44\\times$ while maintaining strong robustness against imperfect or distilled ARGs. Codes: https://github.com/LINs-lab/ProAS", "arxiv_id": "2610.18683", "arxiv_url": "https://arxiv.org/abs/2610.18683", "authors": ["Bowen Ding", "Mingda Wan", "Yuhan Chen", "Jiyao Yuan", "Qi Zhu", "Futing Wang", "Heyuan Deng", "Fei Mi", "Lifeng Shang", "Tao Lin"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/LINs-lab/ProAS", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2610.18683", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "LINs lab", "pdf_url": "https://arxiv.org/pdf/2610.18683v2", "published_at": "2026-10-13", "score": 0.255, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18683.png", "title": "ProAS: A Progress-Aware Advantage Shaping Framework for Multi-Turn Agentic Reinforcement Learning", "tldr": null, "upvotes": 18, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents must decide when another search is worth its cost. Answer-success probabilities capture question difficulty, while this decision requires estimating the additional benefit of search. We introduce SearchHorizonBench, a benchmark for learning and evaluating search value from execution experience. Paired continuations and repeated executions separate expected search gain from generation noise and connect prediction quality to decision utility. The resource contains 45,632 executions across 3,168 questions. On 1,632 held-out questions, historical calibration reduces Brier error by 16.2%, with the improvement concentrated in success-level information. Search gains have a standard deviation of 21.4 percentage points, and tested historical estimators explain less than 2% of this variance in point estimates. Matched-configuration learning curves probe this distinction across training scales. At the reference token price, free selection observations yield a 2.49-point utility opportunity over the best constant action, driven primarily by gain information. Reusable histories, frozen splits, strong baselines and scoring tools provide a common foundation for developing and evaluating value-aware search agents.", "arxiv_id": "2610.34714", "arxiv_url": "https://arxiv.org/abs/2610.34714", "authors": ["Jingjie Ning", "Xueqi Li", "Yibo Kong"], "brief": "", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/EthanNing/SearchHorizonBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34714", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.34714v1", "published_at": "2026-10-26", "score": 0.248, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34714.png", "title": "SearchHorizonBench: A Benchmark for Search Value in AI Agents", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Harness self-evolution offers a practical route for LLM agents to improve from execution experience without updating model parameters. Its effectiveness depends on whether models can successfully act on the guidance provided by their harnesses. However, we find that harness benefits are not uniform across model capabilities: skills that improve stronger models can provide little benefit or even degrade performance for weaker ones. Across seven models and three benchmarks, we identify 103 task-skill pairs where skills improve GPT-5.6-luna by 31.1 points but degrade Gemma-4-E4B by 8.8 points. In 86% of failed weak-model runs, the violated requirement is already stated in the skill. This motivates skill adaptation: reformulating existing skills to match the executor\u0027s capabilities and make their guidance easier to execute. To achieve this, we diagnose failures in tool execution, context management, instruction following, and verification, and distill these diagnoses into a fixed meta-skill that guides adaptation during harness self-evolution. Guided by the meta-skill, a capable external rewriter, Kimi-K3, adapts skills without execution evidence, improving the three weak executors by 5.1-14.1 points over the original skills. We then incorporate this adaptation into a five-round self-evolution loop, where each model revises its own skill from execution trajectories and verifier feedback. Across seven executors, from Gemma-4-E4B to Kimi-K2.5, the meta-skill consistently improves final scores by 2.0-5.1 points over the same loop without the meta-skill. Our findings provide practical design guidance for developing more effective harness self-evolution methods.", "arxiv_id": "2610.33024", "arxiv_url": "https://arxiv.org/abs/2610.33024", "authors": ["Zhihao Yang", "Haojin Wang", "Juncheng Wu", "Kuan Zhang", "Yukun Chen", "Run Luo", "Yaojie Lu", "Yuyin Zhou", "Lu Wang", "Xianpei Han"], "brief": "", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/zhihaoyang30/skill-adaptation-code", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.33024", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "University of Chinese Academy of Sciences ", "pdf_url": "https://arxiv.org/pdf/2610.33024v1", "published_at": "2026-10-10", "score": 0.242, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33024.png", "title": "Evolving to Match Capabilities: Improving Harness Self-Evolution via Skill Adaptation", "tldr": null, "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Patent examination is a challenging real-world task that requires agents to discover sparse prior art, iteratively refine queries, inspect technical evidence, and produce novelty assessments documented in Office Actions (OAs) across heterogeneous scientific and technical domains. However, existing benchmarks largely focus on static and limited candidate sets, leaving the full search--reasoning--assessment process underexplored. We present PatEx-Gym, the first framework for developing and evaluating agents for patent examination, which integrates three components. First, PatEx-Bench provides 1K realistic examination tasks, two large-scale retrieval corpora containing over 1M patents and 52K scientific papers, and a harness runtime supporting iterative search, document visits, reasoning, and OA generation. Second, we introduce PASS, an annotation-free Prior-Art Agentic Search Trajectory Synthesis framework. Specifically, it exploits document visits as implicit relevance signals and evidence-acquisition anchors to model intra-turn query behavior, inter-turn search progression, and trajectory-level evidence and outcome quality, yielding PatEx-SynData. Third, we train PatEx-Agent at the 4B scale via supervised fine-tuning on the curated trajectories, establishing a lightweight baseline. Extensive experiments show that final decision accuracy alone does not fully reflect examination quality, while prior-art discovery remains difficult even for strong frontier models. Our PatEx-Agent achieves competitive performance against substantially larger general-purpose agents. These results show that training on PatEx-SynData enables a compact 4B model to serve as a competitive baseline for prior-art search and patent examination. We view patent examination as a demanding testbed for agentic search and deep research agents.", "arxiv_id": "2610.33503", "arxiv_url": "https://arxiv.org/abs/2610.33503", "authors": ["Qiyao Wang", "Xinyi Chen", "Hongbo Wang", "Jiayuan Lu", "Jianhang Li", "Minghuan Tan", "Yuan Lin", "Min Yang"], "brief": "", "categories": ["cs.IR", "cs.AI", "cs.CL"], "github_repo": "https://github.com/AIforIP/PatEx-Gym", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2610.33503", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "IP Intelligence", "pdf_url": "https://arxiv.org/pdf/2610.33503v1", "published_at": "2026-10-24", "score": 0.239, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33503.png", "title": "Novel or Not? PatEx-Gym: Agentic Prior-Art Search for Novelty Assessment in Patent Examination", "tldr": null, "upvotes": 10, "what_it_is": null, "why_notable": null}, {"abstract": "We propose Nemotron-Labs-Diffusion-Uni (NLD-Uni), a unified discrete diffusion large language model (DLLM) for visual understanding and generation tasks. Compared with prior unified diffusion models, NLD-Uni introduces two major innovations. First, we propose a unified cross-paradigm on-policy distillation (OPD) framework that successfully transfers the visual understanding ability of autoregressive VLMs and visual generation ability of continuous flow models, to a unified DLLM. Second, NLD-Uni incorporates a novel progressive self-refining diffusion process that gradually corrupts each token across multiple steps during training, as opposed to adopting the conventional masked diffusion formulation that directly corrupts a clean image token to an uninformative mask token. At inference, this design allows NLD-Uni to make intermediate commit to a token, enabling progressive self-refinement for better visual quality. Through extensive experiments, we show that NLD-Uni achieves state-of-the-art performance among unified DLLMs on diverse tasks including visual question-answering, multi-modal reasoning, object grounding, text-to-image generation, and image editing.", "arxiv_id": "2610.36466", "arxiv_url": "https://arxiv.org/abs/2610.36466", "authors": ["Shufan Li", "Hanrong Ye", "Greg Heinrich", "Yonggan Fu", "Haotian Zhang", "Sifei Liu", "Aditya Grover", "Pavlo Molchanov"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/NVlabs/Nemotron-Labs-Diffusion-Uni", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.36466", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2610.36466v1", "published_at": "2026-10-27", "score": 0.236, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36466.png", "title": "Nemotron-Labs-Diffusion-Uni: Elastic Self-Refining Unified Diffusion LLM with Cross-Paradigm On-Policy Distillation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Heads of Security (HoS), a prompt injection defense that enforces instruction-data separation via a small set of learned per-head attention gates. HoS learns how each head should redistribute attention between trusted and untrusted tokens, enabling models to reason over untrusted content without following injected instructions. We evaluate HoS on Llama-3.3-70B-Instruct and GPT-OSS-20B. We compare it against SecAlign++, a state-of-the-art finetuning-based defense, and ASIDE, a defense that, like ours, builds instruction-data separation into the model architecture. We show that HoS offers greater robustness to adaptive attacks, better performance on standard utility benchmarks, and matches top performance on standard agentic prompt injection benchmarks. More specifically, the black-box RL-Hammer attack reaches 97% ASR against GPT-OSS-20B and 85% against SecAlign, but only 10% against HoS. Claudini, a state-of-the-art white-box attack, strengthened against HoS through autoresearch, requires 3 times more FLOPs to reach the same ASR on HoS as it does on GPT-OSS-20B or SecAlign. HoS preserves base-model utility across standard multiple-choice benchmarks and prompting setups, whereas SecAlign and ASIDE degrade in few-shot settings. On agentic benchmarks with static attacks, HoS and SecAlign perform similarly and substantially improve the security-utility trade-off over the base model. ASIDE struggles with tool use, achieving only 10% utility. These results show that prompt injection robustness can be achieved and improved through targeted attention interventions.", "arxiv_id": "2610.37657", "arxiv_url": "https://arxiv.org/abs/2610.37657", "authors": ["Igor Shilov", "Xiaoxue Yang", "Alexander Panfilov", "Evgenii Kortukov", "Matthieu Meeus", "Peter Romov", "Wojciech Samek", "Jonas Geiping", "Yves-Alexandre de Montjoye"], "brief": "", "categories": ["cs.LG", "cs.CL", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37657", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37657v1", "published_at": "2026-10-27", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Heads of Security: Learned Attention Gates Improve Prompt Injection Robustness", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multilingual multi-hop document question answering (MMHop-DocQA) requires locating and integrating evidence across complex layouts, document pages, and diverse languages. Existing approaches include single-pass processing and adaptive tool use, but learning to coordinate evidence acquisition, cross-page integration, and answer verification remains challenging. To address this challenge, we present DocSkill, an agentic framework with a learned skill-orchestration policy for adaptive evidence acquisition and reasoning. The policy selects, revisits, or skips skills according to the evolving evidence state. To construct supervision for skill orchestration, bounded Monte Carlo Tree Search (MCTS) explores alternative skill trajectories offline. These trajectories provide demonstrations for supervised fine-tuning (SFT) and preference pairs for Direct Preference Optimization (DPO). We further introduce MMHop-DocBench, a multilingual multi-hop document QA dataset with training and test splits, containing 60K QA pairs across 10 languages and eight document domains. Its HopGen pipeline builds hierarchical page-element graphs to derive traceable cross-page evidence paths and generate grounded QA pairs with page- and element-level evidence annotations. Experiments show that DocSkill with Qwen3-VL-8B achieves 41.0 accuracy and 49.2 F1 on MMHop-DocBench, exceeding the strongest evaluated baseline by 5.5 and 6.3 points, respectively, and achieving competitive performance on MMLongBench-Doc and DocBench.", "arxiv_id": "2610.36759", "arxiv_url": "https://arxiv.org/abs/2610.36759", "authors": ["Jing Huang", "Zhiya Tan", "Changtao Miao", "Shutao Gong", "Yang Wang", "Joey Tianyi Zhou", "Jianshu Li", "Ying Yan"], "brief": "", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.36759", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.36759v1", "published_at": "2026-10-27", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DocSkill: Skill-Integrated Agentic Reasoning for Multilingual Multi-Hop Document Question Answering", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multilingual automatic speech recognition (ASR) has achieved rapid progress with large-scale pretrained models and multilingual speech corpora. Previous studies have proved the pivotal role of data sampling in multilingual ASR performance. However, existing sampling strategies largely rely on time-consuming manual, heuristic-based designs. To address this, we propose a linguistic-aware agentic data sampling framework that introduces a data sampling LLM agent into the multilingual ASR training loop. The agent is driven by a linguistically grounded rubric that analyzes ASR errors from phonological, morphological, and syntactic perspectives, and uses the resulting feedback together with training statistics, budget constraints, and algorithm profiles to select domain-level, sample-level, and token-level sampling strategies. This design turns evaluation results into adaptive data-selection decisions rather than treating WER/CER as final endpoints only. We conduct experiments on twelve Common Voice languages using Whisper-medium as the ASR backbone. The results show that our method achieves performance better than full-data training while using less training data and lower computational resources, and substantially accelerates training convergence compared to conventional sampling strategies.", "arxiv_id": "2610.36538", "arxiv_url": "https://arxiv.org/abs/2610.36538", "authors": ["Zhiheng Qian", "Junhao Du", "Jing Peng", "Hanqi Li", "Kunyang Peng", "Feng Xue", "Lu Chen", "Shuai Wang", "Kai Yu"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.36538", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.36538v1", "published_at": "2026-10-27", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic Data Sampling Framework for Multilingual ASR via Linguistic-Aware Error-Driven Optimization", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recursive self-improvement (RSI) requires an agentic system to design, train, and evaluate its own successor. Data-driven post-training is a central part of that loop, yet existing evaluations measure it on a single benchmark, where an agent selects from a static pool or distills a stronger model to push one score up in one run. Real post-training is multi-domain, and a gain in one domain has to be weighed against a regression in another. We propose ParetoRSI-Gym, in which an agent searches for data, curates it, trains, reads back per-domain results, and repeats, with everything but the data held fixed: the initial LLM, the five domains (math, code, finance, medicine, science), the toolset, and the SFT pipeline. Generalization benchmarks in each domain separate capability gains from overfitting to the scores the agent optimizes against. Across three agent systems, three base models, five rounds and multiple seeds, the strongest system, Claude Code with Opus-5, raises the generalization scores of its proxy-best checkpoint by 9.2% relative to the starting model (+2.3 absolute points), averaged with equal weight over three base models and five domains, with a single-domain relative gain of up to 63% (medicine on Ministral-3-3B). Further analysis shows that the harness matters as much as the model it drives, and that each agent keeps a unique data selection strategy. We see our work as a step towards evaluation of RSI systems in real-world machine learning engineering.", "arxiv_id": "2610.34386", "arxiv_url": "https://arxiv.org/abs/2610.34386", "authors": ["Haojin Wang", "Yangzhen Wu", "Zeyi Chen", "Jian Xie", "Jiaying Ye", "Lili Meng", "Shuyun Tang", "Shangding Gu", "Dawn Song"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/haojinw0027/ParetoRSI-GYM", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.34386", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34386v1", "published_at": "2026-10-25", "score": 0.223, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34386.png", "title": "ParetoRSI-Gym: Can AI Agents Improve Language Models Across Multiple Domains?", "tldr": null, "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in general-purpose AI models and agentic systems have enabled them to perform some CAD tasks. A systematic assessment is now needed to establish what these systems can accomplish and how well their outputs meet engineering requirements. This paper presents an empirical study of GPT-6 Astra, a SOTA general-purpose AI model, across four basic CAD tasks: model understanding, generation, editing, and evaluation. We design test cases spanning different levels of complexity and engineering requirements. The results show that GPT-6 Astra can support multiple stages of CAD workflows, with successful outcomes in cases involving nontrivial geometric complexity. This suggests that general-purpose AI is beginning to offer practical value in almost all steps in CAD workflow. However, gaps remain between generating visually plausible geometry and producing valid, functional, and editable CAD models. Recurring errors in freeform geometry, parameter dependencies, and mating relationships between parts limit engineering usefulness. Agentic iterative refinement can improve results but does not consistently resolve critical errors; long completion times further constrain practical use.", "arxiv_id": "2610.24451", "arxiv_url": "https://arxiv.org/abs/2610.24451", "authors": ["Qiang Zou", "Jiajun Shen", "Zhijie Yang", "Yuhao Wang", "Shitianyi Leng", "Dongshuo Yin"], "brief": "", "categories": ["cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.24451", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2610.24451v1", "published_at": "2026-10-17", "score": 0.211, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.24451.png", "title": "Assessing the CAD Capabilities of General-Purpose AI Models: A Case Study of GPT-6 Astra", "tldr": null, "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific discovery often begins with an unexpected observation that prompts a new research question. In a world with altered physical laws, can large language models (LLMs) notice unexpected behavior, such as heavier objects falling more slowly, and discover the law through experiments without being told what to investigate? To evaluate this ability, we introduce LongChang, an automated framework that creates simulated worlds with altered physics, where one or more laws differ from ordinary physics. The evaluated LLMs act as explorers, manipulating objects and building tools to investigate their own questions without research tasks or hints about these laws. Separate LLM agents generate and review scenes, review tool designs, and evaluate reports for correctness and experimental support using the altered physical laws and exploration records. These records guide scene evolution for further exploration, allowing the full cycle to run without human intervention. Among 12 LLMs, GPT-6-Astra achieves a discovery rate of 16.7%, while the other 11 score 0%. The exploration records reveal uninvestigated anomalies and only partial identification of the altered physical laws.", "arxiv_id": "2610.37649", "arxiv_url": "https://arxiv.org/abs/2610.37649", "authors": ["Zhen Yang", "Wen Wang", "Xander Xu", "Ying-Cong Chen"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37649", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37649v1", "published_at": "2026-10-27", "score": 0.173, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37649.png", "title": "Can LLMs Uncover Hidden Physical Laws through Free Exploration?", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon agents continuously encounter reusable procedural knowledge, yet existing systems typically rely either on model adaptation or external memory, trading persistent learning for rapid reuse. This limitation is especially important for Web agents that repeatedly execute related multi-step workflows. We propose HaMo, a Harness-Model collaborative framework that combines fast non-parametric experience accumulation with slow parametric adaptation. HaMo distills trajectories into strategy-level experience cards for immediate retrieval, while an experience-conditioned continual learning objective trains the model to interpret, ground, and execute retrieved strategies across changing contexts. A retrieval-coverage-based selection mechanism further identifies compact and complementary trajectories for parameter updates. Experiments show that HaMo outperforms harness-only and model-only adaptation under within-domain and cross-domain shifts, improving both retention and adaptation. These results highlight the importance of jointly preserving procedural experience and internalizing the competence to transfer and execute it across tasks.", "arxiv_id": "2610.34724", "arxiv_url": "https://arxiv.org/abs/2610.34724", "authors": ["Zhen Bi", "Zhizhi Peng", "Yan Wang", "Xueshu Chen", "Haofei Zhang", "Yaobo Zhang", "Zeyu Yang", "Qing Shen", "Jungang Lou"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.34724", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34724v1", "published_at": "2026-10-26", "score": 0.173, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34724.png", "title": "Harness-Model Collaboration for Long-Horizon Continual Learning", "tldr": null, "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "As foundation models evolve from information generation to digital work execution, agents are increasingly capable of completing complex tasks across tools, applications, and workflows. However, existing research lacks a unified perspective on how agents reliably accomplish delegated work. To address this gap, we present a work-centric, system-level perspective that views work agents as systems combining foundation models and runtime harnesses to execute tasks in stateful workspaces and deliver verifiable outcomes. We introduce two complementary dimensions, work persistence and work openness, to characterize working conditions, and classify digital work into five forms according to task scope and organization. Building on this framework, we identify five core capability families required for reliable work execution and examine approaches to model optimization, harness optimization, and their joint optimization. We further analyze existing evaluation methods and metrics from the perspective of work outcomes. Finally, we discuss future research directions, including sustained work delegation, adaptation to open environments, and the interaction between work execution and capability improvement. This paper provides a unified framework for understanding, optimizing, and evaluating work agents, supporting the development of systems capable of delivering reliable, verifiable, and practically valuable work outcomes.", "arxiv_id": "2610.35845", "arxiv_url": "https://arxiv.org/abs/2610.35845", "authors": ["Zishan Xu", "Enjun Du", "Mingqi Gao", "Cheng Yang", "Junhao Shen", "Zirong Chen", "Zhiyuan Yao", "Yifu Guo", "Yuquan Lu", "Jinyang Huang", "Zhengxi Lu", "Siyi Liu", "Ziyu Zheng", "Yongqi Zhang", "Difan Zou", "Weiwen Liu"], "brief": "", "categories": ["cs.LG"], "github_repo": "https://github.com/EnjunDu/awesome-working-agent", "github_stars": 56, "hf_url": "https://huggingface.co/papers/2610.35845", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2610.35845v1", "published_at": "2026-10-26", "score": 0.163, "selected_reasons": ["HF trending (104\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35845.png", "title": "Work Agents: Systems, Capabilities, and Optimization", "tldr": null, "upvotes": 104, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents have made substantial progress in domains where they have a non-trivial amount of time to deliberate between actions, such as mathematics, software engineering, and performing tasks on desktop applications. It is less clear how such models fare in settings that demand real-time interaction, such as playing a video game or operating a physical device. In these settings, the environment state may evolve as the agent is reasoning, or even as the underlying model is performing a forward pass. To gain insight into the real-time interaction capabilities of vision-language agents, we introduce Gym-Anything-RT. Our key idea is to construct visual minigames that demand a portfolio of capabilities required for interactive real-time settings. Gym-Anything-RT uses an agentic pipeline to automatically generate such environments based on a taxonomy of six capabilities required for real-time interaction, including the ability to perceive the environment and act under an evolving environment state. A key feature of Gym-Anything-RT is that it allows for controlled comparison of real-time interaction capabilities: we can run the same minigame in real time, or pause or slow down the environment to relax the requirement for real-time actions. We use Gym-Anything-RT to construct 100 real-time minigames and evaluate AI agents on them. We find large capability gaps in real-time interaction. For example, GPT-6 Astra (xHigh) achieves a pass rate of only 9.0% on the real-time minigames, which rises to 75.0% when the environment is paused. We also identify intriguing behaviors by the most powerful frontier agents: for instance, when given the ability to write code, these agents write code that bypasses the need to perceive and act in real time. We publicly release Gym-Anything-RT and the generated minigames to spur further research on AI agents in real-time interactive settings.", "arxiv_id": "2610.37567", "arxiv_url": "https://arxiv.org/abs/2610.37567", "authors": ["Pranjal Aggarwal", "Sean Welleck"], "brief": "", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37567", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37567v1", "published_at": "2026-10-27", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Gym-Anything-RT: Scaling Real-Time Environments for Vision-Language Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Failure diagnosers for robot manipulation are increasingly vision--language models (VLMs), trained and evaluated on single-arm failures produced by perturbing a successful demonstration. Bimanual tool use adds failures of other kinds: a tool that slips out of its socket while still held, two correct gestures made at different times, and attempts that fail for two reasons at once. On a simulated bimanual tool-use task whose failure causes are read from the recorded trace, we measure what each sensing channel lets a diagnoser tell. The tool\u0027s slip is read on the tool hand; which hand was late is read on both arms, while a sensor on one hand reads its own hand\u0027s delay and at most part of the other\u0027s; and whether a late attempt was also pushed too weakly is not identifiable from passive sensing when the tool hand is late. Within two attempts, a repair policy that escalates when the cause is not identifiable repairs as many failures as one told the true cause. A VLM\u0027s internal state carries the late hand almost perfectly, along a direction no closer to the one its answer reads than a random one; whether the answer reports it depends on the wording of the question.", "arxiv_id": "2610.37533", "arxiv_url": "https://arxiv.org/abs/2610.37533", "authors": ["Baptiste Bonin", "Caro Strickland", "Audrey Durand"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37533", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37533v1", "published_at": "2026-10-27", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Which Hand Was Late? Diagnosis for Robot Failure Recovery in Bimanual Tool Use", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "GUI memory should preserve the results of past actions and learn reusable operations. This is difficult in long-horizon workflows, where agents must use information across applications and useful operations are interleaved with failed attempts. We introduce Task Advancement Memory (TAM), which defines task advancement as verified task progress, and supports ongoing task execution and learns reusable operations. During execution, Task Advancement State represents how verified task progress changes the remaining goals, allowing the agent to build on earlier achievements across applications. After each task, advancement supervision identifies and abstracts the interactions that produced a verified local result. The learned operations preserve the relation between required inputs, expected outcomes, and verification conditions. This retains locally successful operations from both successful and failed tasks. On MobileWorld GUI-only tasks, Advancement State alone raises success from 12.0% to 28.2%. Full TAM achieves a 17.6% relative gain in task success over the strongest evaluated baseline and reduces lifecycle tokens per solved task by 38.7%. On SPA-Bench, TAM achieves state-of-the-art ta
