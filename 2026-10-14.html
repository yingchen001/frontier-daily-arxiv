<style>
  :root {

    :root { --bg:#0f1115; --card:#1a1d24; --fg:#e5e7eb; --muted:#9ca3af;
            --border:#2a2e37; --accent:#60a5fa; --tag:#1e293b; --tag-fg:#93c5fd;

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .container { max-width:1280px; margin:0 auto; padding:20px 18px 60px; }
  header h1 { margin:0; font-size:22px; }
  header .meta { color:var(--muted); font-size:13px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0 6px; }
  input[type=search], select { background:var(--card); color:var(--fg); border:1px solid var(--border);
         border-radius:8px; padding:7px 11px; font-size:14px; }
  input[type=search] { flex:1; min-width:220px; }
  .filter-group { margin:8px 0; }
  .filter-group .label { font-size:12px; color:var(--muted); margin-right:6px; }
  .tabs { display:inline-flex; gap:6px; flex-wrap:wrap; }
  .tab { padding:4px 11px; border:1px solid var(--border); border-radius:16px; cursor:pointer;

  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .meta-line { color:var(--muted); font-size:13px; margin:10px 0; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:16px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 2px 12px rgba(37,99,235,.12); }
  .card.top { border-top:3px solid #f59e0b; }
  .card h3 { margin:0 0 8px; font-size:16px; line-height:1.4; }
  .card h3 .rank { color:var(--accent); font-weight:700; margin-right:5px; }
  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }
  .sec ul { margin:3px 0 3px 18px; padding:0; }
  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; font-size:28px; line-height:1; color:var(--muted); cursor:pointer; }
  .modal-box h2 { margin:0 30px 12px 0; font-size:20px; line-height:1.45; }
  .modal-box .abs { font-size:14px; line-height:1.75; white-space:pre-wrap; background:var(--bg);

  .modal-box .lbl { font-weight:700; margin:16px 0 6px; font-size:14px; }
  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .pdfwrap iframe { width:100%; height:100%; border:0; }
  .pdfhint { font-size:12px; color:var(--muted); margin-top:6px; }

<script>
const PAPERS = [{"abstract": "City-scale 3D grounding is commonly formulated as candidate ranking, which requires precomputed instance proposals and becomes inefficient in large outdoor scenes. We propose Urbex, an agentic vision-language framework that instead casts grounding as active spatial search. Urbex represents a city-scale 3D scene as an interactive multi-view environment, allowing a VLM agent to query landmarks, zoom into local regions, render oblique views, and commit a grounded bounding box. We optimize this tool-use policy with reinforcement learning on CityRefer, using smooth localization rewards and lightweight shaping rewards for efficient exploration. Experiments show that Urbex achieves the best Hit@1 and IoU on CityRefer, supports candidate-free grounding without ground-truth boxes, and is substantially faster than the strongest city-scale ranking baseline. Zero-shot results on STPLS3D-Refer further indicate improved cross-scene robustness.", "arxiv_id": "2610.18356", "arxiv_url": "https://arxiv.org/abs/2610.18356", "authors": ["Yu Wang", "Rui Dai", "Wei Chen", "Yi Wang", "Bo Dang", "Kaikui Liu", "Xiangxiang Chu", "Yansheng Li"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/AMAP-ML/Urbex", "github_stars": 83, "hf_url": "https://huggingface.co/papers/2610.18356", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "alibaba", "pdf_url": "https://arxiv.org/pdf/2610.18356v1", "published_at": "2026-10-13", "score": 0.553, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (111\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18356.png", "title": "Urbex: Agentic Spatial Grounding for City-Scale 3D Scenes", "tldr": null, "upvotes": 111, "what_it_is": null, "why_notable": null}, {"abstract": "How can we build an agent that thinks beyond human language, yet still acts through it in the external environment? Modern LLM agents still reason and interact through text, while latent reasoning offers an efficient internal medium but lacks native tool access and reasoning transparency. We bridge these two directions with Hybrid Reasoning Agents (HybridAgents), which dynamically navigate between latent reasoning and text-based interaction throughout a unified generation process. Architecturally, a lightweight HybridLink enables seamless transitions between text and latent modes, while the agent\u0027s continuous working memory preserves lossless hybrid context across multiple turns. These designs preserve tool-integrated agentic capabilities while making latent thoughts directly inspectable. Building on this architecture, we further develop dedicated post-training algorithms for hybrid reasoning: HybridSFT stabilizes tool-integrated hybrid generation by teaching the backbone to coordinate with HybridLink, then HybridRL scales reasoning by learning when to think in latent space and when to act through text. We evaluate HybridAgent at 3 model scales across 11 benchmarks covering mathematics, science, medicine, search, and agentic reasoning. Compared with frontier LLM Agents and agentic frameworks spanning both text-based and latent methods, HybridAgent consistently improves performance by 10.4%, while delivering 35.5%-54.7% token reduction, 1.8x-2.6x faster inference, and 2.7x-3.7x cost savings. Code and data are available at https://github.com/togethercomputer/HybridAgent.", "arxiv_id": "2610.18861", "arxiv_url": "https://arxiv.org/abs/2610.18861", "authors": ["Jiaru Zou", "Yunzhe Qi", "Sirui Chen", "Federico Bianchi", "Shang Zhu", "Pan Lu", "Jingrui He", "James Zou"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/togethercomputer/HybridAgent", "github_stars": 20, "hf_url": "https://huggingface.co/papers/2610.18861", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2610.18861v1", "published_at": "2026-10-13", "score": 0.552, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18861.png", "title": "Hybrid Reasoning Agents", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents\u0027 capabilities depend not only on their underlying models but also on their execution harnesses. Recursive self-improvement (RSI) offers a promising approach to automatically evolve these harnesses. However, deploying RSI in open-world settings still faces two critical challenges. First, open-world tasks are typically unseen during the harness design phase and novel at test time, leaving no ground-truth verifiers to reliably guide online harness edits. Second, the RSI process remains highly task-specific and fails to generalize to novel scenarios. We introduce Harness^2, a plug-and-play, recursive agent harnessing framework that addresses these challenges through two connected levels of recursion. Task-level recursion refines the current task\u0027s harness using a contrastive Propose-Probe-Compose step that reliably guides edits without ground-truth verifiers, and can be scaled further via parallel or sequential recursion. Harnessing-level recursion then extracts experience from these edits to update a continual improvement harness, enabling the agent to better adapt to future tasks. Across three professional benchmarks and four model-harness configurations, a single step consistently improves GLM-5 and Gemini 3.5 Flash over their base harnesses, yielding gains of up to 11.5 points on WorkBuddy-Bench, 4.5 points on JobBench, and 11.8 percentage points on LAB, with further gains as the task-level recursion budget increases.", "arxiv_id": "2610.14224", "arxiv_url": "https://arxiv.org/abs/2610.14224", "authors": ["Ruiyao Xu", "Yanfei Chen", "Zhongying CuiZhu", "Bhavana Dalvi Mishra", "Yifei Ming", "Han Yu", "Rujun Han", "Chen-Yu Lee", "Tomas Pfister"], "brief": "", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/google-research/harness2", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2610.14224", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2610.14224v1", "published_at": "2026-10-09", "score": 0.542, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (88\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14224.png", "title": "Harness^2: Recursive Agent Harnessing for an Open World", "tldr": null, "upvotes": 88, "what_it_is": null, "why_notable": null}, {"abstract": "Chest X-ray (CXR) interpretation often requires integrating visual findings with task-specific evidence rather than relying on direct visual recognition alone. While tool-augmented medical agents can supply such evidence via external modules, they often lack explicit mechanisms for learning when auxiliary evidence is needed and for preventing inapplicable quantitative evidence from entering diagnostic reasoning. To address this, we propose X-Ragent, a post-training framework for tool-augmented reinforcement learning that decouples learned auxiliary-evidence seeking from validity-gated quantitative measurement acquisition for evidence-grounded CXR reasoning. We construct Rad-CoT, a 7.7K-sample corpus combining causally ordered tool-augmented trajectories with report-style diagnostic reasoning, and use it to initialize Qwen3-VL-8B via agentic supervised fine-tuning (SFT). We then optimize the policy with Group Relative Policy Optimization (GRPO) using an accuracy-gated reward that applies process-level terms for measurement consistency and auxiliary-tool cost only to correct trajectories, preventing plausible process behavior from compensating for an incorrect diagnosis. Across three CXR benchmarks, X-Ragent achieves the strongest results, including an 8.6-point improvement on the fully held-out ChestAgentBench. By seeking evidence selectively and admitting only valid measurements, X-Ragent supports more faithful and evidence-grounded CXR reasoning.", "arxiv_id": "2610.16811", "arxiv_url": "https://arxiv.org/abs/2610.16811", "authors": ["Yi Wang", "Zhenlong Yuan", "Yuchan Guo", "Maolei Huang", "Zijian Song", "Dapeng Zhang", "Rongbin Tan", "Jiyuan Wang", "Zhiyuan Wang", "Fangfang Lin", "Shuhan Song", "Huawei Cao"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.16811", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2610.16811v1", "published_at": "2026-10-12", "score": 0.489, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (66\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.16811.png", "title": "X-Ragent: Tool-Augmented Reinforcement Learning for Evidence-Grounded Chest X-Ray Reasoning", "tldr": null, "upvotes": 66, "what_it_is": null, "why_notable": null}, {"abstract": "Post-training is crucial for improving text-to-image models, yet existing pipelines typically rely on manually curated training data and fixed training distributions. We introduce APT (Agentic Post-Training), a fully automated framework that adaptively post-trains a base model according to its evolving capability profile. APT coordinates three agents to construct evaluation sets from user requirements, diagnose model-specific strengths and failure modes, and generate reinforcement learning data with an adaptive prompt distribution that emphasizes underperforming capabilities. By repeatedly evaluating, diagnosing, and updating the generator, APT lets the current model\u0027s behavior shape its next training tasks, forming a feedback loop inspired by recursive self-improvement. For general-purpose settings without user-specified evaluation scenarios, we further develop an evaluation harness that enables broad and diverse evaluation set generation. Experiments across multiple base models, benchmarks, and generation architectures demonstrate that APT is model-agnostic, benchmark-agnostic, architecture-agnostic, and fully automated.", "arxiv_id": "2610.18097", "arxiv_url": "https://arxiv.org/abs/2610.18097", "authors": ["Sirui Zhang", "Fangyun Wei", "Dong Chen", "Jinjing Zhao", "Yitong Wang", "Yunuo Chen", "Baining Guo", "Zheng-Jun Zha"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/siruizhang30/APT", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.18097", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2610.18097v1", "published_at": "2026-10-13", "score": 0.47, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (13\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18097.png", "title": "APT: Feedback-Driven Agentic Post-Training for Text-to-Image Generation", "tldr": null, "upvotes": 13, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable video reasoning requires models to produce correct answers and expose supporting visual evidence. Open-o3-Video enables verifiable reasoning by embedding timestamps and object-level bounding boxes into reasoning traces, but is restricted to frames from an initial sparse sampler. We introduce Open-o3-Video-v2, which formulates video reasoning as a unified agentic evidencegrounded process. The model identifies missing information, acquires additional observations, grounds the moments and objects supporting its reasoning, and writes this evidence into the trajectory before continuing or answering. To support this behavior, we construct STGR-v2-CoT135K, including 52K multi-turn agentic grounded reasoning trajectories, and STGR-v2-RL-13K for reinforcement learning. We further propose Clue-Seek GRPO (CS-GRPO), which tracks how tool calls change accumulated evidence, rewards clue coverage and step-wise gains, and penalizes excessive, repetitive, or uninformative retrieval. On V-STaR, Open-o3-Video-v2-4B achieves 40.4% mAM and 56.3% mLGM, outperforming its Qwen3-VL-4B backbone by 8.5% and 12.6%, respectively. It also delivers consistent gains across general video understanding, long-video reasoning, and temporal grounding benchmarks. These results show that active evidence acquisition and verifiable object-level grounding are complementary for reliable video reasoning. The code and models are released at https://msalab-pku.github.io/projects/Open-o3-Video-v2.", "arxiv_id": "2610.17656", "arxiv_url": "https://arxiv.org/abs/2610.17656", "authors": ["Jiahao Meng", "Zhongyuan Bao", "Yue Tan", "Haiquan Wen", "Renrui Zhang", "Anna Wang", "Jason Li", "Yanwei Fu", "Yunhai Tong", "Ming-Hsuan Yang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Multimedia-Semantic-Analytics-Lab/Open-o3-Video-v2", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2610.17656", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2610.17656v1", "published_at": "2026-10-13", "score": 0.47, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (19\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17656.png", "title": "Open-o3-Video-v2: Seek, Ground, and Reason with Verifiable Spatio-Temporal Evidence", "tldr": null, "upvotes": 19, "what_it_is": null, "why_notable": null}, {"abstract": "Generating information-rich visual artifacts such as slides, posters, and dashboards as code is appealing because the outputs are structured, editable, and verifiable. Yet code models cannot see how their choices of layout and color come together on the canvas, often limiting spatial planning and aesthetic quality. Image generators excel at visual design but can misrender requested content, making their outputs unreliable targets for direct reproduction. We therefore introduce AesCode, which generates code grounded in the content prompt while using an image generated from the same prompt as an aesthetic guidance. To do so, AesCode represents the target as a design graph that describes the whole canvas and makes each property attributable. From this graph, we derive complementary cross-modal rewards: deterministic verifiers score properties parsable from code and rendering, while a VLM judge assesses the non-parsable ones with a sample-specific Visual Graph Rubric (VGR) tied to graph elements and relations. We optimize these decoupled rewards through reinforcement learning with per-channel normalization to jointly improve spatial planning, aesthetic quality, and verifiable correctness. To evaluate this setting, we build a benchmark that scores verifiable correctness and visual quality separately, with visual scores highly consistent with human judgments. We find that reference images substantially improve the visual quality of code generated by existing models, and ablations show that AesCode benefits from references both as model input and as a source of visual rewards. Relative to same-scale Qwen3-VL baselines given the same references, AesCode-8B and AesCode-32B improve visual quality by 31.1 and 22.4 percentage points, reaching scores comparable to those of closed-source frontier models such as GPT-5.5 and Claude Opus 4.8.", "arxiv_id": "2610.18860", "arxiv_url": "https://arxiv.org/abs/2610.18860", "authors": ["Xin Gao", "Yifan Yang", "Xin Li", "Pan Wang", "Yan Li", "Muzhao Tian", "Mingxi Cheng", "Bei Liu", "Kai Qiu", "Qi Dai", "Dong Chen", "Yue Dong", "Leandros Tassiulas", "Rex Ying", "Ji Li", "Chong Luo"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/microsoft/AesCode", "github_stars": 63, "hf_url": "https://huggingface.co/papers/2610.18860", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2610.18860v1", "published_at": "2026-10-13", "score": 0.392, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (80\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18860.png", "title": "AesCode: Aesthetic Code Generation with Decoupled Cross-Modal Rewards", "tldr": null, "upvotes": 80, "what_it_is": null, "why_notable": null}, {"abstract": "System one models enable direct, low-latency decision-making. Yet recent practice of predicting an answer from serialized text does not, by itself, respect the structure of a decision problem. We argue that current designs underemphasize four important structural requirements. (i) null-aware: Models should distinguish answer absence from uncertainty among candidates; (ii) permutation-invariant: Reordering alternatives should not change the decision; (iii) option-scalable: Growing candidate sets should not require redefining the output space; (iv) cacheable: Request-independent computation over recurring alternatives should be reusable across requests. We introduce Jeva, a decision-native architecture that addresses these requirements jointly. A shared encoder independently represents the request and each option, while a compact decision stack refines only the request state against immutable option memory. Symmetric aggregation yields permutation-equivariant probabilities; shared scoring accommodates variable-size candidate sets. A separate coverage estimate distinguishes answer absence from candidate competition, enabling explicit null outcomes. Request-independent option representations and layer projections support reuse across newly assembled sets. These mechanisms unify Choice, Noul, and Score outputs. Across evaluations, Jeva combines strong typed-decision performance with near-perfect null detection and no decision flips under any tested permutations. It scales to thousands of candidates and substantially reduces latency through cross-request reuse without changing decisions.", "arxiv_id": "2610.18773", "arxiv_url": "https://arxiv.org/abs/2610.18773", "authors": ["Qi Li", "Xinchao Wang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/LiQiiiii/Jeva", "github_stars": 63, "hf_url": "https://huggingface.co/papers/2610.18773", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2610.18773v1", "published_at": "2026-10-13", "score": 0.391, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (270\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18773.png", "title": "Jeva: System One Models from First Principles", "tldr": null, "upvotes": 270, "what_it_is": null, "why_notable": null}, {"abstract": "AI coding agents now write much of the code that ships, yet whether that code is secure remains unclear. We introduce the Last Secure Code Benchmark, a comprehensive evaluation of secure code generation by coding agents. Built from 150 real vulnerabilities, its 450 tasks span seven widely used languages (Java, C, C++, JavaScript, Python, PHP, and Go), 24 CWEs including 21 of the 2025 CWE Top 25 and 8 of the Top 10 KEV weaknesses, more than any benchmark we compare with, and three vibe-coding scenarios: filling in a function, writing a file, and building a repository\u0027s source tree from scratch. Every task asks only for functionality, through a specification that never mentions security, and hidden functional and security tests grade the result. Across six frontier agents, 73.6% to 91.3% of tasks pass functionally, yet even the strongest, Claude Fable 5, produces code that is both functional and secure for only 25.1% of tasks, and the others for 16.4% to 24.7%. The best model only passes 12% of the vulnerability scenarios across all vibe coding setting, posing strong concern on the security of the code written by vibe coding.", "arxiv_id": "2610.14766", "arxiv_url": "https://arxiv.org/abs/2610.14766", "authors": ["Tianyi Wu", "Chao Ge", "Peng Chen", "Fengji Zhang", "Yongxing Wu", "Yuchong Xie", "Jian Li", "Chaoyuan Peng", "Kaikai Zhang", "Dong Huang", "Mingzhe Du", "Yukai Huang", "Jiaheng Zhang", "Terry Yue Zhuo", "See-Kiong Ng"], "brief": "", "categories": ["cs.CR", "cs.AI"], "github_repo": "https://github.com/alibaba/last-secure-code-benchmark", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2610.14766", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2610.14766v1", "published_at": "2026-10-10", "score": 0.379, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (61\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14766.png", "title": "Last Secure Code Benchmark: Is the Code You Vibe Secure?", "tldr": null, "upvotes": 61, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-player interactive world models aim to simulate shared environments from multiple players\u0027 perspectives, but achieving robust generation while scaling to more players remains challenging. Existing approaches that rely on fully-connected communication (e.g., Solaris) incur quadratic attention costs as the number of players grows, while centralized approaches (e.g., $\u03b3$-World) suffer from interference between unrelated events in a shared global representation. To address these challenges, we present Multics, a multi-player video generation framework with hierarchical communication that structures information exchange across player, group, and global levels. This hierarchy introduces group tokens into self-attention as intermediate group-level representations that aggregate locally relevant player information. These tokens connect to global tokens for cross-group communication, while the hierarchical topology limits direct mixing between unrelated local events. Group-token parameters are shared across group slots, allowing the same communication module to accommodate varying numbers of players without introducing new group-specific parameters. We further propose budget-constrained dynamic grouping based on recent camera trajectories, which adaptively groups relevant players while limiting unnecessary communication. Experiments demonstrate that Multics achieves state-of-the-art performance in 4- and 6-player settings, with improved cross-player consistency, player-specific action and camera controllability, and interference robustness. Moreover, Multics generalizes from 4-player training to 6-, 8-, and 10-player inference without retraining, while reducing self-attention computation compared with fully-connected communication.", "arxiv_id": "2610.17201", "arxiv_url": "https://arxiv.org/abs/2610.17201", "authors": ["Kaiyi Huang", "Wangbo Yu", "Yukun Huang", "Jiwen Yu", "Kunhao Liu", "Donglin Yang", "Wenbo Hu", "Ying Shan", "Xihui Liu"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/TencentARC/Multics", "github_stars": 60, "hf_url": "https://huggingface.co/papers/2610.17201", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "ARC Lab, Tencent", "pdf_url": "https://arxiv.org/pdf/2610.17201v1", "published_at": "2026-10-12", "score": 0.373, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (56\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17201.png", "title": "Multics: Generative Multi-Player World Model with Hierarchical Communication", "tldr": null, "upvotes": 56, "what_it_is": null, "why_notable": null}, {"abstract": "In long-horizon tool-calling tasks, LLM agents can fail not only because of tool-use errors, but also because of ineffective interaction with users. Yet existing benchmarks largely assume cooperative and behaviorally stable users, leaving the effect of emotional variation on agent reliability underexplored. We introduce $\u03c4$-Emotion-Bench, a ten-domain benchmark for evaluating tool-calling agents under controlled emotion-conditioned user interactions while preserving the underlying task objective. To scale both benchmark construction and agent training, we introduce Tracer, a scalable agentic data-generation pipeline that constructs grounded, policy-valid tasks and collects trajectories through an interactive agent--user--environment harness. By allowing dissatisfied users to terminate inefficient interactions, the harness provides an interaction-aware signal that filters trajectories with excessive user dependence and favors effective tool use. Experiments with two user simulators show that frontier agents remain unreliable, with substantial gaps between average task success and consistent task completion. Tracer-generated supervision consistently improves Qwen3 models across scales, generalizes to unseen domains, and transfers to $\u03c4$-Bench and $\u03c4$-Trait. Behavioral analyses further show that higher task success is associated with a better balance between tool execution and necessary user follow-up. Overall, $\u03c4$-Emotion-Bench and Tracer provide a scalable framework for evaluating agent reliability under diverse user behaviors and improving tool-calling agents through interaction-aware supervision.", "arxiv_id": "2610.19560", "arxiv_url": "https://arxiv.org/abs/2610.19560", "authors": ["Rishitosh Kumar Singh", "Amir Saeidi", "Shamanthak Hegde", "Shrinidhi Kumbhar", "Chitta Baral"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/sahsaeedi/tau-emotion-bench", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.19560", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Arizona State University", "pdf_url": "https://arxiv.org/pdf/2610.19560v1", "published_at": "2026-10-14", "score": 0.369, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19560.png", "title": "$\u03c4$-Emotion-Bench: Exposing the Interaction Fragility of LLM Agents through Real-World User Emotions", "tldr": null, "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce LensErase, a general-purpose mask-based Erase Anything foundation model designed to cover a broad spectrum of real-world erase scenarios. LensErase supports diverse objects, visual text, watermarks, associated visual effects, multiple-object removal, and a wide range of object scales, aspect ratios, and image resolutions. First, to enable such broad coverage, we construct LensErase-100M, a large-scale dataset containing 101.07 million paired source-mask-target examples spanning diverse erase scenarios. Second, we pretrain LensErase from the text-to-image model Lens, adapting its strong generative prior to mask-based erasing. To efficiently incorporate the source image and erase mask, we propose Mask-Aware RoPE, a 3D rotary positional encoding that directly injects mask information into the source-image tokens without introducing a separate mask token sequence. Finally, we refine the model through supervised fine-tuning and reinforcement learning with contract-guided, region-aware rewards, and apply TraceFusion at inference to preserve high-fidelity content outside the effective edit region. Across six public benchmarks and the proposed LensErase-Bench, LensErase achieves substantial improvements under both reference-based objective metrics and reference-free VLM evaluation. We hope LensErase can serve as a foundational model for erase-related applications and systems.", "arxiv_id": "2610.18072", "arxiv_url": "https://arxiv.org/abs/2610.18072", "authors": ["Yunuo Chen", "Xiuyu Wu", "Qinhong Yang", "Jinjing Zhao", "Yanchen Dong", "Sirui Zhang", "Dong Chen", "Fangyun Wei", "Lei Shi", "Ji Li", "Dongdong Chen", "Guo Lu", "Yan Lu", "Baining Guo"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/LensFamily/LensErase", "github_stars": 29, "hf_url": "https://huggingface.co/papers/2610.18072", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2610.18072v1", "published_at": "2026-10-13", "score": 0.358, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (27\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18072.png", "title": "LensErase: A Foundation Model for Erase Anything", "tldr": null, "upvotes": 27, "what_it_is": null, "why_notable": null}, {"abstract": "Computer-use agents have demonstrated strong capabilities in interpreting screens and executing keyboard and mouse actions. However, games, with their visually rich worlds and diverse mechanics, remain challenging and offer a demanding next step toward general digital control. Current game-agent learning pipelines often rely on large-scale demonstrations with limited coverage of dynamic game states, while scalable environments for interactive training remain difficult to obtain. We introduce Player-1, a post-training framework for learning game control beyond demonstrations through synthetic experience. We extend the computer-use action space with relative pointer motion, sustained inputs, and composite actions. For supervised initialization, we fine-tune computer-use models on 6,044 curated gameplay trajectories that pair recorded actions with task instructions and visual reasoning. We construct Player-1-Gym, sixteen synthetic 2D and 3D environments designed around control demands shared across games. Programmatically verifiable rewards and randomized observations and control dynamics support multi-environment reinforcement learning with PPO. The resulting Player-1-9B and Player-1-35B-A3B improve MineDojo-300 success over their SFT policies by 27.8 and 17.7 percentage points, respectively. Player-1-9B reaches 38.33% success compared with 12.63% for the strongest evaluated baseline, with further gains over SFT on ViZDoom-10 and GameWorld. Further analyses show that broader synthetic environment coverage improves transfer, while the use of composite actions that combine multiple keyboard and mouse inputs increases during RL. We demonstrate that learning from synthetic experience substantially improves game control beyond supervised initialization, with gains that generalize beyond the RL training suite.", "arxiv_id": "2610.20584", "arxiv_url": "https://arxiv.org/abs/2610.20584", "authors": ["Mingyu Ouyang", "Yiran Wang", "Siyuan Hu", "Xingyilang Yin", "Huiqiang Sun", "Guangzhi Wang", "Junfu Pu", "Cheng Cheng", "Honghao Chen", "Ying Shan", "Mike Zheng Shou", "Hwee Tou Ng"], "brief": "", "categories": ["cs.CV", "cs.AI", "cs.HC"], "github_repo": "https://github.com/TencentARC/Player-1", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.20584", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "ARC Lab, Tencent", "pdf_url": "https://arxiv.org/pdf/2610.20584v1", "published_at": "2026-10-14", "score": 0.352, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (77\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.20584.png", "title": "Player-1: Learning to Play from Synthetic Experience", "tldr": null, "upvotes": 77, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language navigation requires agents to follow natural-language instructions to reach target locations, making high-quality language supervision essential. Since human annotation is costly, prior work has explored scalable data synthesis methods. However, existing methods typically either use separate models for navigation and instruction generation or couple the two tasks through task-specific components; most also annotate the full trajectory corpus with a fixed model before updating, which can cause generated supervision to lag behind the evolving policy. Therefore, we introduce RSI-Nav, a data-centric recursive self-improvement framework for navigation via policy-synchronized language-action dual bootstrapping, which unifies vision-language-to-action instruction following and vision-action-to-language instruction generation within a shared model. Specifically, after supervised fine-tuning establishes fundamental capabilities, RSI-Nav progressively processes unlabeled trajectories in small shards. The current model generates instructions for these trajectories, executes them to evaluate goal completion and path efficiency, retains qualified samples, and immediately updates itself before processing the next shard. This shard-wise update keeps newly generated supervision aligned with the evolving policy. We also incorporate spatial understanding data, since stronger spatial reasoning benefits navigation. Extensive experiments show that RSI-Nav reaches 68.6% SR on R2R-CE and 72.4% SR on RxR-CE, while providing stronger instruction-generation utility and modestly improved spatial understanding after recursive evolution.", "arxiv_id": "2610.15782", "arxiv_url": "https://arxiv.org/abs/2610.15782", "authors": ["Songze Li", "Haoming Gu", "Ziyang Gong", "Zhitong Wang", "Gengze Zhou", "Zun Wang", "Yuhan Zhu", "Tianxiang Jiang", "Juanzi Li", "Qi Wu", "Weinan Zhang", "Yu Qiao", "Wenwei Zhang", "Yi Wang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/OpenGVLab/RSI-Nav", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2610.15782", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "OpenGVLab", "pdf_url": "https://arxiv.org/pdf/2610.15782v1", "published_at": "2026-10-11", "score": 0.332, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.15782.png", "title": "Data-Centric Recursive Self-Improvement for Navigation via Policy-Synchronized Language-Action Dual Bootstrapping", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models have evolved from single-turn chatbots into interactive agents capable of long-horizon reasoning. In real deployments, MCP tool services can return noisy feedback and users may intervene to correct the agent, but existing methods provide limited supervision for reflection learning and failure recovery. To bridge this gap, we propose Agent-Reflex, a general training framework for incentivizing proactive reflection in agents. Specifically, Agent-Reflex comprises three stages. First, Environment Reflection Skill Discovery (RSD) injects grounded tool-feedback perturbations into environment scaling, samples a capability-diverse LLM pool, mines matched success-failure pairs, and summarizes reusable reflection meta-skills. Building on this skill library, we then apply Reflective Supervised Fine-Tuning (ReSFT) that converts each skill into supervision for self-reflection, skill recovery, and user-centric correction, strengthening complementary reflective behaviors. Finally, we propose On-Policy Reflective Policy Optimization (ORPO) to combine agentic reinforcement learning under noisy interactions with reflection-guided on-policy distillation to further elicit proactive reflection. Built on Qwen3-8B, Agent-Reflex reaches 58.6 overall on five long-horizon tool-use benchmarks and 29.1 on AgentNoiseBench, surpassing strong environment-scaling and reflection baselines. Experiments on six challenging agent benchmark suites demonstrate the effectiveness of Agent-Reflex. Further analyses show that Agent-Reflex improves agents\u0027 robustness to noise while maintaining stable training dynamics, supporting scalable agent training. Our code is available at https://github.com/RUC-NLPIR/Agent-Reflex.", "arxiv_id": "2610.17953", "arxiv_url": "https://arxiv.org/abs/2610.17953", "authors": ["Guanting Dong", "Xinyu Yang", "Jiajie Jin", "Yuyang Hu", "Xiaoshuai Song", "Yifei Chen", "Xiaoxi Li", "Jiejun Tan", "Yutao Zhu", "Tat-Seng Chua", "Ji-Rong Wen", "Zhicheng Dou"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/RUC-NLPIR/Agent-Reflex", "github_stars": 55, "hf_url": "https://huggingface.co/papers/2610.17953", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NLPIR Lab @ RUC", "pdf_url": "https://arxiv.org/pdf/2610.17953v1", "published_at": "2026-10-13", "score": 0.329, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (195\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17953.png", "title": "Agent-Reflex: Teaching Language Agents to Act Reflectively", "tldr": null, "upvotes": 195, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents are emerging as an important new class of users of desktop applications. However, existing desktop interfaces were designed for human end users or application developers, leaving agents to interpret visual controls or discover and compose low-level software operations. This mismatch can hinder even capable agents, yet it remains unclear what interface properties make desktop software easier for agents to use. To study this question, we treat software evolution as a natural source of interface variation and introduce DeskIF-Bench, a benchmark of 255 artifact-verified tasks across six desktop applications. By holding the task, agent, and verifier fixed while varying the software release, we measure how interface changes affect agent performance. Across two models and six applications, the newest release consistently outperforms the oldest. Trajectory analysis identifies three relevant interface properties: discoverability, granularity, and observability. Guided by these properties, we develop ANIS, a framework that synthesizes agent-native interfaces from the capabilities of installed applications. On an expanded evaluation of 368 tasks across eight applications, atomic interfaces improve success over native SDK use by 3.8 and 3.5 percentage points with DeepSeek V4 Flash and Claude Haiku 4.5, respectively, while reducing online token usage by approximately 73%. Goal-level commands further raise success to 74.5% and 67.4%, respectively.", "arxiv_id": "2610.15765", "arxiv_url": "https://arxiv.org/abs/2610.15765", "authors": ["Alan Wu", "Wei Tao", "Yiwen Guo"], "brief": "", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/co-evolve-lab/ANIS", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.15765", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2610.15765v1", "published_at": "2026-10-11", "score": 0.326, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.15765.png", "title": "A Decade in a Day: Synthesizing Agent-Native Interfaces from Human-Oriented Software Evolution", "tldr": null, "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "Distilling capable language-model agents into smaller models requires aligning the student\u0027s behavior with the teacher\u0027s. This raises a fundamental question: at which states and at what granularity should this alignment be performed? Offline imitation provides dense but token-specific supervision and can suffer from state-distribution mismatch. Token-level on-policy distillation (OPD) addresses this mismatch but typically requires teacher token probabilities and compatible tokenization. We argue that semantic actions provide a natural unit of supervision for agent distillation. We introduce ActionOPD, an action-level on-policy distillation method motivated by maximizing expected teacher-action likelihood at student-encountered states. At each such state, ActionOPD samples actions from both the student and a black-box teacher, rewarding student actions according to their semantic agreement with the sampled teacher actions. Through policy optimization, ActionOPD aligns the student\u0027s action-level behavior with the teacher\u0027s decisions without requiring reproduction of teacher-written reasoning or access to teacher token probabilities. Training Qwen3-4B and Qwen3-8B with two teachers on diverse, curated tool-use tasks yields average gains of 3.3-6.9 percentage points across four out-of-distribution benchmarks. ActionOPD scales favorably with student size and teacher capability, without requiring the teacher and student to share a model family or tokenizer. On $\u03c4^2$-bench, ActionOPD achieves competitive performance against offline distillation and token-level OPD. We further explore Self-ActionOPD with a same-model teacher and privileged context. These results establish ActionOPD as a promising approach to agent distillation.", "arxiv_id": "2610.19820", "arxiv_url": "https://arxiv.org/abs/2610.19820", "authors": ["Huining Yuan", "Xiangmin Yi", "Zelai Xu", "Zixu Wang", "Xinlei Chen", "Xiao-Ping Zhang", "Yu Wang", "Chao Yu"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/thu-nics/ActionOPD", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.19820", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tsinghua-NICS-EFC", "pdf_url": "https://arxiv.org/pdf/2610.19820v1", "published_at": "2026-10-14", "score": 0.324, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (35\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.19820.png", "title": "ActionOPD: Distilling Decisions, Not Tokens", "tldr": null, "upvotes": 35, "what_it_is": null, "why_notable": null}, {"abstract": "Few-step distillation reduces the sampling cost of diffusion and flow models, but existing approaches often require auxiliary score models or specialized architectures. We show that simple on-policy velocity regression already provides a strong foundation for 4-NFE generation. To represent teacher velocity variation within each coarse transition, we introduce Pivot, a training-only residual proxy that separates local corrections from the student\u0027s interval-mean prediction. We further repel the student from weaker teacher predictions, providing a lightweight mechanism for avoiding undesirable modes. The resulting framework, Simplified Matching Distillation (SMD), remains entirely regression-based, requires neither online score estimation nor adversarial training, and leaves the deployed generator unchanged. We evaluate SMD on image generation and editing, 3D generation, video synthesis, and joint audio--video generation, scaling to 33 billion parameters. At 4-NFE, SMD outperforms strong few-step baselines and surpasses multi-step teachers on several benchmarks. It also supports cross-model, multi-teacher, and causal-video distillation.", "arxiv_id": "2610.18472", "arxiv_url": "https://arxiv.org/abs/2610.18472", "authors": ["Jiawei Zhang", "Ziyu Wan", "Nanye Ma", "Long Zhao", "Dong Chen", "Hongyu Liu", "Qifeng Chen", "Dongdong Chen"], "brief": "", "categories": ["cs.CV", "cs.LG", "eess.IV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.18472", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2610.18472v1", "published_at": "2026-10-13", "score": 0.315, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18472.png", "title": "Simplifying and Improving On-Policy Distillation for Few-Step Diffusion", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Long-form agentic video generation must turn a screenplay into shots that remain spatially and temporally consistent across nonconsecutive requests. Passing prompts or recent frames between shots does not provide a shared spatial frame for revisiting a scene or a time-indexed record for replaying an earlier event. We present Any Time, Any Space (ATAS), which compiles a screenplay into shot requests with explicit location, camera, and event-time references. Before generation, it retrieves relevant evidence from a scene memory of registered static geometry and an event memory of dynamic observations indexed by scene, event, and time. After generation, ATAS reconstructs and registers the clip. It updates memory only when review and state checks accept the observation, while film delivery remains independent of memory admission. Across four video generators, ATAS improves all reported cross-shot consistency measures and achieves the highest aggregate benchmark score for each backbone. It also outperforms the compared agents and 3D-guided methods on target-image spatial revisit, leads three event-recapture criteria, and receives the highest human ratings on all six criteria. The video results and code are available on our project page: https://lhmd.top/atas/.", "arxiv_id": "2610.20571", "arxiv_url": "https://arxiv.org/abs/2610.20571", "authors": ["Weijie Wang", "Haomin Zhang", "Ye Li", "Akide Liu", "Zeyu Zhang", "Haoyu Zhao", "Yefei He", "Donny Y. Chen", "Feng Chen", "Bohan Zhuang"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/ziplab/ATAS", "github_stars": 65, "hf_url": "https://huggingface.co/papers/2610.20571", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2610.20571v1", "published_at": "2026-10-14", "score": 0.311, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (100\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.20571.png", "title": "Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation", "tldr": null, "upvotes": 100, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluating the physical consistency of generated videos remains a fundamental challenge. Existing approaches rely on off-the-shelf vision-language models, which can often be myopic to physical dynamics, or fine-tuned evaluators trained on human annotations, which overfit to dataset-specific cues and fail to generalize. A key challenge is that existing supervision sources provide either relative ordering or absolute scores, but not both reliably and consistently across varied settings. To this end, we introduce PhyProbe, an evaluator that extracts features from a frozen pretrained spatio-temporal encoder and maps them to a scalar physical consistency violation score via a lightweight scoring head. PhyProbe is trained through a unified objective combining pairwise ranking, regression on noisy scalar annotations, and anchor-based calibration over a curated set of heterogeneous supervision sources. Experiments show that PhyProbe outperforms prior methods on most pairwise benchmarks spanning real-generated and generated-generated pairs under varying correspondence, with the largest gains in no-correspondence and generated-generated settings where existing fine-tuned evaluators degrade sharply. PhyProbe achieves strong correlation with human judgments, with close agreement between rank-based and linear metrics, indicating that scores are both well ordered and anchored to a stable [0, 1] scale. Further, despite being trained on supervision indicative of physical consistency, without explicit general-preference labels, PhyProbe also performs competitively on human preference benchmarks: consistent with the observation that physics violations are entangled with broader quality degradations.", "arxiv_id": "2609.38377", "arxiv_url": "https://arxiv.org/abs/2609.38377", "authors": ["Max Ku", "Jiaojiao Fan", "Zekun Hao", "Francesco Ferroni", "Heng Wang", "Wenhu Chen", "Ming-Yu Liu", "Prithvijit Chattopadhyay"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/vinesmsuic/PhyProbe", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.38377", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.38377v1", "published_at": "2026-09-29", "score": 0.306, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (14\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38377.png", "title": "PhyProbe: Rethinking Physical Consistency Evaluation in Generated Videos", "tldr": null, "upvotes": 14, "what_it_is": null, "why_notable": null}, {"abstract": "Deep research (DR) agents address open-ended information needs through multi-step reasoning, long-horizon web search, and evidence synthesis. However, existing benchmarks primarily focus on academic research or synthetic tasks, leaving DR agents\u0027 capabilities in real-world life and professional productivity settings insufficiently evaluated. To bridge this gap, we introduce LifeSearch, a challenging benchmark comprising 203 Chinese and English tasks derived from real-user query seeds across 7 concrete life and productivity domains. With more than 4,500 hours of human annotation, we construct over 4,000 expert-written, fine-grained rubrics, covering both report-content criteria for coverage and accuracy and concrete criteria specifying values, units, dates, and URLs. We conduct extensive experiments on 12 advanced DR agents under a unified evaluation harness, systematically analyzing their performance patterns and failure modes. We find that even the best-performing frontier agent, GPT-5.6 Sol, achieves a score of only 63.4%, leaving substantial room for improvement on realistic life and professional DR tasks. We select the grading configuration by comparing candidate LLM judges against human rubric labels, and a human ranking study shows strong alignment between aggregate benchmark scores and human judgments (Spearman\u0027s $\u03c1= 0.89$, Kendall\u0027s $\u03c4= 0.81$). LifeSearch provides a rigorous evaluation framework and foundation for advancing DR agents toward real-world life and productivity.", "arxiv_id": "2610.18092", "arxiv_url": "https://arxiv.org/abs/2610.18092", "authors": ["Yibo Wang", "Senjie Jin", "Yansong Ning", "Xinbing Liang", "Haotian Luo", "Jiazheng Zhang", "Yuxuan He", "Will Wu", "Clarenceai"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.18092", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2610.18092v1", "published_at": "2026-10-13", "score": 0.302, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18092.png", "title": "LifeSearch: Benchmarking Deep Research Agents for Real-World Life and Productivity", "tldr": null, "upvotes": 15, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly deployed as autonomous agents for automated program repair, patching software vulnerabilities through multi-step reasoning and tool use. Yet these systems typically validate a patch against the same evidence used to construct it -- a static alert, sanitizer trace, published exploit, or test suite. A patch that blocks that one piece of evidence can therefore look successful while remaining vulnerable to the same vulnerability with some variation. We present P2Patch, a generative adversarial repair system that treats each patch as a new attack target. Starting from a normalized vulnerability finding, an exploitation agent constructs a reproducing proof of vulnerability (PoV), a patching agent repairs the program, and the exploitation agent then attacks the patched program for a distinct same-vulnerability exploit. Every successful exploit becomes a permanent repair requirement, and the final patch must block all PoVs accumulated during the patching process, with construction-time PoVs kept strictly separate from held-out evaluation oracles. Across 101 C/C++ and Java CVE subjects, this adversarial loop surfaces a distinct confirmed exploit in 41% of runs after the patch has already blocked its original construction-time PoV. Against single-pass repair from the same finding using Claude Code, P2Patch raises held-out fix-closed coverage from 78.1% to 84.7% and beyond-upstream coverage from 42.1% to 62.5%. Under the same held-out oracles, it also certifies more attack paths as blocked than recent state-of-the-art agentic repair systems on overlapping subjects. These results show that adversarial testing and independent security oracles expose repair gaps that one-shot validation misses.", "arxiv_id": "2610.20245", "arxiv_url": "https://arxiv.org/abs/2610.20245", "authors": ["Mohsen Iranmanesh", "Sina Moradi Sabet", "Sina Marefat", "Ali Javidi Ghasr", "Maxime Newman Nereyabagabo", "Kousha Amouzesh", "Jaivir Malhi", "Vinci Velasco", "Alex Chung", "Mohammad A. Tayebi"], "brief": "", "categories": ["cs.CR", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.20245", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.20245v1", "published_at": "2026-10-14", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "P2Patch: Exploit-Guided Vulnerability Repair", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) post-training improves robot foundation models (RFMs) beyond their demonstrations, but real-world deployment demands more: learning new tasks efficiently while retaining previously acquired behaviors. Existing continual RL methods on top of VLAs mitigate forgetting but rely on on-policy updates with limited forward transfer, whereas off-policy methods improve single-task sample efficiency without addressing learner persistence across tasks. We propose ACCRUE, a continual off-policy RL framework that carries lightweight actor and critic networks across tasks, allowing each stage to reuse behavioral and value knowledge acquired through prior RL. The inherited critic adapts only on current-task transitions and guides current-task actor learning, while prior behavior is preserved by distilling the actor toward cached targets on a small number of retained episodes. Fixed visual features keep the inherited learner and its replay compatible with base-policy updates. Across contact-rich assembly sequences in simulation and on real-robot hardware, ACCRUE accelerates subsequent-task learning with near-zero forgetting and significantly reduces real-robot training time by 31.0\\% to 68.5\\%.", "arxiv_id": "2610.18596", "arxiv_url": "https://arxiv.org/abs/2610.18596", "authors": ["Changyeon Kim", "Kimin Lee", "Yashraj Narang", "Yijie Guo"], "brief": "", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.18596", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2610.18596v1", "published_at": "2026-10-13", "score": 0.299, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18596.png", "title": "ACCRUE: Continual Off-Policy Reinforcement Learning for Robot Foundation Models", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning (RL) has emerged as a key driver for LLM reasoning. This capability is equally pivotal in long-context scenarios---such as long-dialogue understanding and structured data analysis---where the challenge extends beyond consuming tokens to performing rigorous deduction. While existing efforts focus on data synthesis or architectural changes, recent work points out that relying solely on sparse, outcome-only rewards yields limited gains, as such coarse signals are often insufficient to effectively guide the complex long-context reasoning. To address this, we propose LongR, a unified framework that enhances long-context performance by integrating a dynamic ``Think-and-Read\u0027\u0027 mechanism---which interleaves reasoning with document consultation---with a contextual density reward based on relative information gain to quantify the utility of the relevant documents, without evidence annotations. Empirically, LongR achieves a gain of over 9\\% on LongBench v2 and consistent improvements on RULER and InfiniteBench, demonstrating robust efficiency in navigating extensive contexts. Furthermore, LongR consistently enhances performance across diverse RL algorithms (e.g., DAPO, GSPO). Finally, we conduct in-depth analyses to investigate the impact of reasoning chain length on efficiency and the model\u0027s robustness against distractors.", "arxiv_id": "2602.05758", "arxiv_url": "https://arxiv.org/abs/2602.05758", "authors": ["Qize Yu", "Zijun Chen", "Chen Wu", "Yue Chen", "Yiyao Yu", "Tingfeng Hui", "Bowen Ping", "Junchi Yan", "Baobao Chang"], "brief": "", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2602.05758", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2602.05758v2", "published_at": "2026-02-05", "score": 0.286, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (12\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2602.05758.png", "title": "LongR: Unleashing Long-Context Reasoning via Reinforcement Learning with Dense Utility Rewards", "tldr": null, "upvotes": 12, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon agents have drawn growing attention for their ability to work autonomously -- from hours to days -- on economically valuable tasks, a capability essential to automated discovery and recursive self-improvement (RSI). Yet open-source models still struggle on long-horizon tasks, largely for lack of both training data and a working recipe, and scaling both is hard: long, complex tasks are difficult to curate and verify, and their rewards are sparse. We address both. First, we introduce Tev-Gym, the first long-horizon agent training dataset with verifiable, dense, progressive rewards -- 1,170 verified task environments across 7 domains. It is built on a latent-world-first approach that first constructs a latent world: a complete and correct hidden specification of the task domain, workflow, and expected state after each step. Each task is then progressively rendered from this specification into an agent-facing environment, enabling controllable complexity and a natural progress metric. Second, we turn this metric into a training recipe: via progress-potential reward shaping (PPRS), we convert progress into a dense per-step reward that improves training efficiency and makes otherwise-intractable tasks trainable. Training with this recipe yields Tev-27B, which achieves substantial gains on the Agents\u0027 Last Exam computing and math sciences domains (ALE-CM), matching GPT-6 Astra and Claude Opus 5 at Pass@5. Despite training only on ALE-related data, it generalizes to the Terminal-Bench (TB) 3.0 and 4.0 subsets, surpassing GLM 5.2 and Gemini 3.7 Flash, and reaches Claude Opus 4.8-level performance on middle-horizon tasks such as TB 2.1.", "arxiv_id": "2610.18868", "arxiv_url": "https://arxiv.org/abs/2610.18868", "authors": ["Wenbo Hu", "Shraman Pramanick", "Krishna Kumar Singh", "Nanyun Peng", "Kai-Wei Chang", "Yong Jae Lee"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.18868", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.18868v1", "published_at": "2026-10-13", "score": 0.276, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (96\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.18868.png", "title": "Tev: Scaling Long-Horizon Agentic Environments with Dense Progress Rewards", "tldr": null, "upvotes": 96, "what_it_is": null, "why_notable": null}, {"abstract": "Effective social interaction requires more than fluent responses: agents must reach plans that fit the participants\u0027 needs and circumstances. Existing evaluations of social agents mainly rely on LLM judges that rate the conversation, without checking the resulting plan. We introduce HICO-Bench, a benchmark of 180 everyday coordination scenarios, such as resource allocation, scheduling, and authorization, in which two agents with private information converse and then independently record the plan they agreed on. A program checks Feasibility (the two records match and satisfy both participants\u0027 private conditions), and an LLM judge checks Integrity (the conversation supports the recorded plan); passing both is a Verified Success. Each scenario has two versions that share the same public context but differ in one private condition, so the correct plan differs between them. Across thirteen LLMs, 36% of conversations rated highly for goal completion fail Verified Success. To learn from outcomes that arrive only at the end of a conversation, we propose Paired-Credit Policy Optimization (PaCPO). After each turn, PaCPO asks the agent for a tentative plan, checks it in both versions of the scenario, and rewards the turns after which the tentative plans fit their respective versions. PaCPO raises Qwen3-8B\u0027s Verified Success from 20.4% to 28.3%.", "arxiv_id": "2610.20195", "arxiv_url": "https://arxiv.org/abs/2610.20195", "authors": ["Caixin Kang", "Ke Wang", "Yuchuan Wu", "Xiaoqiang Wang", "Ling Li", "Bingxue Qiu", "Yongbin Li", "Yoichi Sato"], "brief": "", "categories": ["cs.CL", "cs.AI", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.20195", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Tongyi-ConvAI", "pdf_url": "https://arxiv.org/pdf/2610.20195v1", "published_at": "2026-10-14", "score": 0.271, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.20195.png", "title": "What Makes a Social Agent\u0027s Interactions Effective? Learning from Verifiable Outcomes in Paired Worlds", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in vision-language models (VLMs) have substantially improved the capabilities of GUI agents, while memory augmentation has emerged as a promising approach for reusing knowledge from past interactions. However, existing memory augmented GUI agents typically adopt a fixed representation strategy, providing retrieved experience as a static modality. It remains unclear whether a single memory modality is consistently optimal, or how modality preference changes across interaction steps. In this work, we conduct a systematic study of memory modality in VLM based GUI agents. Across GUI benchmarks, we find that the preferred memory representation is strongly step dependent. Motivated by the finding, we introduce \\textbf{SwitchMem}, a routing framework that dynamically selects between textual and visual memory representations at each step. Across three GUI benchmarks, SwitchMem outperforms memory augmented baselines that rely on static memory representations. Our findings validate our claim that memory modality is a step dependent decision rather than a fixed design choice. Code and project resources are available at https://txxnrd.github.io/switchmem", "arxiv_id": "2610.17928", "arxiv_url": "https://arxiv.org/abs/2610.17928", "authors": ["Taeyun Roh", "Suhyeong Park", "Gijin Kim", "Wonjune Jang", "Jaewoo Kang"], "brief": "", "categories": ["cs.AI"], "github_repo": "https://github.com/dmis-lab/SwitchMem", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.17928", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Korea University", "pdf_url": "https://arxiv.org/pdf/2610.17928v1", "published_at": "2026-10-13", "score": 0.261, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (41\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.17928.png", "title": "Learning How to Remember: Memory Modality Selection for GUI Agents", "tldr": null, "upvotes": 41, "what_it_is": null, "why_notable": null}, {"abstract": "Determining whether an image is AI-generated does not establish whether the situation it depicts is factually supported. We formulate Image Factuality Assessment: given an image and a generic verification instruction, a system returns a supported or refuted verdict with an evidence-grounded explanation. Without a supplied textual claim, the system must progressively refine factual questions during investigation and align external evidence with the specific situation depicted. We introduce EviLens, an expert-reviewed benchmark of 10,174 supported and refuted images from controlled construction and web collection, covering twelve factual error types and evaluating both verdict accuracy and evidence sufficiency. We develop EviScene, a multimodal ReAct agent that interleaves visual inspection, external retrieval, and evidence analysis, using new findings to refine its questions and revisit relevant image details. We train a compact policy with supervised fine-tuning on reviewed teacher trajectories, followed by privileged on-policy self-distillation applied to verified decisions from the policy\u0027s own investigations. On the 1,527-image test set, the trained Qwen3.5-9B agent achieves 79.05% balanced accuracy and a Strict Evidence Sufficiency Rate (SESR) of 52.26%, improving over the same-backbone base agent by 6.71 and 9.37 percentage points, respectively. Its SESR is the highest among the evaluated agents.Code, models, and data will be released at https://github.com/wangzian828/EVISCENE and https://huggingface.co/ZiAnwang/EviScene.", "arxiv_id": "2610.14609", "arxiv_url": "https://arxiv.org/abs/2610.14609", "authors": ["ZiAn Wang", "Ruiqi Liu", "Zhengbo Zhang", "Yi Han", "Jialiang Shen", "Ruoxin Chen", "Manni Cui", "Ximo Zhu", "Jin Jiang", "Mingzhe Liu", "Linhao Wang", "Wenhao Wang", "Shu Wu"], "brief": "", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.14609", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.14609v1", "published_at": "2026-10-10", "score": 0.258, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (47\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.14609.png", "title": "EviScene: Beyond \"Is It AI?\" for Agentic Image Factuality Assessment", "tldr": null, "upvotes": 47, "what_it_is": null, "why_notable": null}, {"abstract": "Reconstructing reference videos as editable dynamic 3D scenes is an important path toward controllable video generation for filmmaking: these scenes provide modifiable, renderable visual proxies that enable explicit control over scene layout, subject actions, and camera behavior. To evaluate agents\u0027 ability to reconstruct editable dynamic 3D scenes from dynamic reference videos, we introduce CineRecon, a benchmark comprising 50 reference videos and 360 annotated evaluation clips. The reference videos span film, real-world footage, and games. Given a complete video, an agent uses tools to construct, animate, render, and refine its reconstruction. We evaluate this task under three representation settings: Proxy, Simplified, and Detailed. These settings increase geometric and appearance requirements while retaining the same requirements for spatial relations, camera behavior, and subject dynamics. This design tests whether agents can reproduce the events in a video when detailed appearance is unnecessary, and how performance changes as representation requirements increase. For evaluation, we construct checklists that associate observable properties and events with specific entities and times. A vision-language judge compares timestamp-aligned reference and rendered frames across 11 categories, grouped into camera, static, and dynamic consistency dimensions. We evaluate 12 models using their corresponding agent harnesses and find failures across all three dimensions. Subject motions and interactions remain difficult to reproduce even under the Proxy setting.", "arxiv_id": "2610.16577", "arxiv_url": "https://arxiv.org/abs/2610.16577", "authors": ["Jialei Wang", "Zehan Wang", "XiaoYang Wu", "Ziang Zhang", "Siyu Chen", "Jiaer Huang", "Yujia Zhang", "Tianyu Pang", "Hengshuang Zhao"], "brief": "", "categories": ["cs.CV"], "github_repo": "https://github.com/Unc1eW4ng/CineRecon", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.16577", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "The University of Hong Kong", "pdf_url": "https://arxiv.org/pdf/2610.16577v1", "published_at": "2026-10-12", "score": 0.253, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (21\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.16577.png", "title": "CineRecon: Benchmarking Frontier Models for Agentic Cinematic Reconstruction", "tldr": null, "upvotes": 21, "what_it_is": null, "why_notable": null}, {"abstract": "As robotic hardware and learning methods advance, humanoids need tools to perform tasks beyond their inherent physical limits. Successful tool use requires selecting a suitable tool and coordinating manipulation and, when needed, locomotion to complete the task. Existing benchmarks do not jointly evaluate these capabilities on a humanoid. We introduce HumanoidToolBench, an 18-task benchmark spanning three scenarios, three execution levels, and two tool-set modes, together with ToolBook, a dataset of 3.1k demonstrations collected in simulation and on a real Unitree G1. Evaluation of seven policies in simulation and three on the real robot reveals substantial gaps between selecting a suitable tool and completing the task. Focused GR00T N1.7 probes show reduced selection accuracy on unseen tools and continued task execution under unrelated instructions. Code and data are available at https://snu-pi.github.io/HumanoidToolBench/.", "arxiv_id": "2610.02089", "arxiv_url": "https://arxiv.org/abs/2610.02089", "authors": ["Kyochul Jang", "Seohyeon Park", "Ohchul Kwon", "Sangjun Park", "Junhyeok Choi", "Seungyeop Yi", "Chaeyun Kim", "Sangkyu Lee", "Idan Szpektor", "Avi Caciularu", "Jongmin Park", "Youngjae Yu"], "brief": "", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/SNU-PI/HumanoidToolBench", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2610.02089", "impact_score": null, "is_agent": null, "is_top": false, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "SNU PI", "pdf_url": "https://arxiv.org/pdf/2610.02089v1", "published_at": "2026-10-01", "
