iteratively refine global 3D representations with diffusion or flow models. However, autoregressive decoding is sequential and cannot revise errors, whereas diffusion and flow-matching models repeatedly process the full representation, making high-quality generation increasingly expensive. In this paper, we propose Block3D, a block-wise diffusion framework that partitions the discrete shape-token sequence into contiguous blocks, generates the blocks autoregressively, and jointly denoises all tokens within the current block. To alleviate error accumulation, we introduce confidence-guided intra-block correction, which revises low-confidence tokens before each block is finalized. On a held-out set from TRELLIS-500K, Block3D reduces mean end-to-end generation time from 25.71 seconds to 4.99 seconds, achieving a $5.15\\times$ speedup over the fine-tuned autoregressive baseline without sacrificing geometric fidelity.", "arxiv_id": "2608.19567", "arxiv_url": "https://arxiv.org/abs/2608.19567", "authors": ["Bowen Cui", "Weijie Wang", "Zeyu Zhang", "Yefei He", "Mingda Lin", "Haoyu Zhao", "Yuanyu He", "Donny Y. Chen", "Feng Chen", "Bohan Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa Block3D\uff0c\u4e00\u79cd\u9762\u5411\u6587\u672c\u52303D\u751f\u6210\u7684\u5206\u5757\u6269\u6563\u6846\u67b6\u3002\u5b83\u5c06\u79bb\u6563\u5f62\u72b6 token \u5e8f\u5217\u5207\u6210\u8fde\u7eed\u5757\uff0c\u5757\u95f4\u81ea\u56de\u5f52\u751f\u6210\uff0c\u5757\u5185\u5e76\u884c\u8054\u5408\u53bb\u566a\uff0c\u4ece\u800c\u964d\u4f4e\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ziplab/Block3D", "github_stars": 24, "hf_url": "https://huggingface.co/papers/2608.19567", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7528 block-wise diffusion \u66ff\u4ee3\u9010 token \u81ea\u56de\u5f52\u6216\u5168\u5c40\u53cd\u590d\u6269\u6563\uff0c\u517c\u987e\u5e76\u884c\u6027\u4e0e\u5c40\u90e8\u5efa\u6a21\u80fd\u529b", "\u5f15\u5165 confidence-guided intra-block correction\uff0c\u5728\u6bcf\u4e2a\u5757\u5b9a\u7a3f\u524d\u4fee\u6b63\u4f4e\u7f6e\u4fe1\u5ea6 token\uff0c\u7f13\u89e3\u81ea\u56de\u5f52\u8bef\u5dee\u7d2f\u79ef", "\u5728 TRELLIS-500K \u7559\u51fa\u96c6\u4e0a\uff0c\u7aef\u5230\u7aef\u751f\u6210\u65f6\u95f4\u4ece 25.71 \u79d2\u964d\u81f3 4.99 \u79d2\uff0c\u76f8\u6bd4\u5fae\u8c03\u81ea\u56de\u5f52\u57fa\u7ebf\u52a0\u901f 5.15 \u500d\u4e14\u51e0\u4f55\u8d28\u91cf\u4e0d\u4e0b\u964d"], "keywords": ["\u6587\u672c\u52303D", "\u6269\u6563\u6a21\u578b", "3D\u751f\u6210", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2608.19567v4", "published_at": "2026-08-20", "score": 0.297, "selected_reasons": ["HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.19567.png", "title": "Block3D: Efficient Text-to-3D Generation via Block-Wise Diffusion", "tldr": "\u5206\u5757\u6269\u6563\u8ba9\u6587\u672c\u751f\u62103D\u5feb5\u500d\u4e14\u4fdd\u771f", "upvotes": 27, "what_it_is": "\u8bba\u6587\u63d0\u51fa Block3D\uff0c\u4e00\u79cd\u9762\u5411\u6587\u672c\u52303D\u751f\u6210\u7684\u5206\u5757\u6269\u6563\u6846\u67b6\u3002\u5b83\u5c06\u79bb\u6563\u5f62\u72b6 token \u5e8f\u5217\u5207\u6210\u8fde\u7eed\u5757\uff0c\u5757\u95f4\u81ea\u56de\u5f52\u751f\u6210\uff0c\u5757\u5185\u5e76\u884c\u8054\u5408\u53bb\u566a\uff0c\u4ece\u800c\u964d\u4f4e\u63a8\u7406\u6210\u672c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u6587\u672c\u52303D\u751f\u6210\u4e2d\u201c\u9ad8\u8d28\u91cf\u4f46\u6162\u201d\u7684\u6838\u5fc3\u74f6\u9888\uff0c\u63d0\u4f9b\u4e86\u4ecb\u4e8e\u81ea\u56de\u5f52\u4e0e\u5168\u5c40\u6269\u6563\u4e4b\u95f4\u7684\u9ad8\u6548\u751f\u6210\u8303\u5f0f\uff0c\u5728\u663e\u8457\u63d0\u901f\u7684\u540c\u65f6\u4fdd\u6301\u51e0\u4f55\u4fdd\u771f\u5ea6\uff0c\u5177\u5907\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "When a long-horizon agent execution fails, outcome-level evaluation reveals the unsuccessful result but not where the decisive error entered the trajectory. Developers must then inspect the full execution to identify the responsible role and localize the earliest decisive root-cause step. Existing failure-attribution benchmarks largely focus on shorter traces, leaving diagnosis across hundreds of recorded steps underexplored. We introduce LongRCA Bench, comprising 1,140 failed trajectories across five domains without injected errors. It provides independently scored human labels for the responsible role and earliest decisive root-cause step. The median trajectory contains 145 steps, and the strongest baseline reaches only 13.2% exact root-step accuracy. We further present Root-Cause Trajectory Attribution (RCTA), a training-free method that retrieves candidate error steps from segment summaries and traces them to available earlier handoff instructions. Using the same backbone, benchmark instances, and scoring protocol, RCTA reaches 51.1% responsible-role accuracy and 24.1% exact root-step accuracy. These results highlight the need to evaluate responsible-role attribution and exact root-step localization as separate targets in long-trajectory failure diagnosis.", "arxiv_id": "2608.15242", "arxiv_url": "https://arxiv.org/abs/2608.15242", "authors": ["Yunfei Zhang", "Boyu Feng", "Changhua Pei", "Zexin Wang", "Zhihuang Peng", "Xinlong Liu", "Hengyue Jiang", "Difeng Ma", "Jiayi Zhang", "Yongzhou Yao", "Yanan Zhao", "Fei Sun", "Yintong Huo", "Zhaoyang Liu", "Jingjing Li", "Gaogang Xie", "Dan Pei"], "brief": "\u8bba\u6587\u63d0\u51fa LongRCA Bench\uff0c\u7528\u4e8e\u8bca\u65ad\u957f\u65f6\u7a0b\u667a\u80fd\u4f53\u6267\u884c\u5931\u8d25\u4e2d\u7684\u8d23\u4efb\u89d2\u8272\u4e0e\u6700\u65e9\u51b3\u5b9a\u6027\u6839\u56e0\u6b65\u9aa4\u3002\u8be5\u57fa\u51c6\u5305\u542b\u4e94\u4e2a\u9886\u57df\u7684 1,140 \u6761\u771f\u5b9e\u5931\u8d25\u8f68\u8ff9\uff0c\u5e76\u63d0\u4f9b\u4eba\u5de5\u72ec\u7acb\u6807\u6ce8\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.15242", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8f68\u8ff9\u4e2d\u4f4d\u957f\u5ea6\u8fbe 145 \u6b65\uff0c\u805a\u7126\u6570\u767e\u6b65\u6267\u884c\u4e2d\u7684\u5931\u8d25\u5f52\u56e0\uff0c\u800c\u975e\u77ed\u8f68\u8ff9\u6216\u6ce8\u5165\u9519\u8bef\u573a\u666f", "\u6700\u5f3a\u57fa\u7ebf\u4ec5\u8fbe\u5230 13.2% \u7684\u7cbe\u786e\u6839\u56e0\u6b65\u9aa4\u5b9a\u4f4d\u51c6\u786e\u7387\uff0c\u663e\u793a\u957f\u8f68\u8ff9\u8bca\u65ad\u4ecd\u5f88\u56f0\u96be", "\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 RCTA \u65b9\u6cd5\uff0c\u901a\u8fc7\u7247\u6bb5\u6458\u8981\u68c0\u7d22\u5019\u9009\u9519\u8bef\u6b65\u9aa4\uff0c\u5e76\u8ffd\u6eaf\u5230\u66f4\u65e9\u7684\u4ea4\u63a5\u6307\u4ee4\uff0c\u5c06\u7cbe\u786e\u6839\u56e0\u6b65\u9aa4\u51c6\u786e\u7387\u63d0\u5347\u81f3 24.1%"], "keywords": ["\u667a\u80fd\u4f53", "\u6545\u969c\u8bca\u65ad", "\u57fa\u51c6\u8bc4\u6d4b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.15242v3", "published_at": "2026-08-15", "score": 0.274, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.15242.png", "title": "LongRCA Bench: Diagnosing Responsible Roles and Root Causes in Long-Horizon Agent Failures", "tldr": "\u957f\u8f68\u8ff9\u667a\u80fd\u4f53\u5931\u8d25\u5f52\u56e0\u65b0\u57fa\u51c6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa LongRCA Bench\uff0c\u7528\u4e8e\u8bca\u65ad\u957f\u65f6\u7a0b\u667a\u80fd\u4f53\u6267\u884c\u5931\u8d25\u4e2d\u7684\u8d23\u4efb\u89d2\u8272\u4e0e\u6700\u65e9\u51b3\u5b9a\u6027\u6839\u56e0\u6b65\u9aa4\u3002\u8be5\u57fa\u51c6\u5305\u542b\u4e94\u4e2a\u9886\u57df\u7684 1,140 \u6761\u771f\u5b9e\u5931\u8d25\u8f68\u8ff9\uff0c\u5e76\u63d0\u4f9b\u4eba\u5de5\u72ec\u7acb\u6807\u6ce8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u8c01\u8d1f\u8d23\u201d\u548c\u201c\u6700\u65e9\u9519\u5728\u54ea\u91cc\u201d\u62c6\u5206\u4e3a\u4e24\u4e2a\u8bc4\u6d4b\u76ee\u6807\uff0c\u4e3a\u957f\u65f6\u7a0b LLM agent \u7684\u53ef\u8c03\u8bd5\u6027\u3001\u53ef\u9760\u6027\u8bc4\u4f30\u4e0e\u6545\u969c\u5b9a\u4f4d\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u771f\u5b9e\u5f00\u53d1\u9700\u6c42\u7684\u57fa\u51c6\u3002"}, {"abstract": "Search-augmented LLMs increasingly mediate everyday consumer recommendations by retrieving live web content. This creates a new risk: LLM recommenders may consume web content that Generative Engine Optimization (GEO) operators have polluted to mislead them. We ask: to what extent do they become unwitting promoters of fake products? We introduce FORGE (Fake Online Recommendations in Generative Environments), which locally rewrites real products in a frozen set of retrieved web pages into fake ones and measures how often the LLM recommends the fake product, across 225 real products in 15 categories and 5 consumer scenarios. Across 12 commercial and open-weights LLMs, all models are vulnerable: a single polluted page yields fooled rates of up to 27%, while the full top-3 replacement raises this to 73.8%. Vulnerability varies across categories, increasing when models lack stable prior knowledge of the products. Reasoning does not mitigate this vulnerability; instead, it often generates spurious social proof to justify false recommendations. None of the four defenses is adequate: the skepticism prompt can exacerbate vulnerability much like reasoning, the two consensus filters risk suppressing legitimate products, and credibility re-ranking helps every model but removes only a sixth of the fakes. We release the FORGE benchmark and the evaluation code at https://github.com/leoluolol/forge-benchmark.", "arxiv_id": "2606.13610", "arxiv_url": "https://arxiv.org/abs/2606.13610", "authors": ["Minghao Luo", "Liang Chen"], "brief": "\u8bba\u6587\u63d0\u51fa FORGE \u57fa\u51c6\uff0c\u7528\u771f\u5b9e\u68c0\u7d22\u7f51\u9875\u7684\u5c40\u90e8\u6539\u5199\u6765\u6a21\u62df GEO \u5185\u5bb9\u6c61\u67d3\uff0c\u8bc4\u4f30\u641c\u7d22\u589e\u5f3a LLM \u662f\u5426\u4f1a\u63a8\u8350\u4f2a\u9020\u4ea7\u54c1\u3002\u5b9e\u9a8c\u8986\u76d6 225 \u4e2a\u771f\u5b9e\u4ea7\u54c1\u300115 \u7c7b\u5546\u54c1\u30015 \u79cd\u6d88\u8d39\u573a\u666f\u548c 12 \u4e2a\u5546\u4e1a/\u5f00\u6e90\u6a21\u578b\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2606.13610", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ec5\u6c61\u67d3\u4e00\u4e2a\u68c0\u7d22\u9875\u9762\uff0c\u6a21\u578b\u63a8\u8350\u5047\u4ea7\u54c1\u7684\u6bd4\u4f8b\u6700\u9ad8\u53ef\u8fbe 27%\uff1b\u66ff\u6362 top-3 \u9875\u9762\u65f6\u6700\u9ad8\u5347\u81f3 73.8%\u3002", "\u6a21\u578b\u5728\u7f3a\u4e4f\u7a33\u5b9a\u5148\u9a8c\u77e5\u8bc6\u7684\u4ea7\u54c1\u7c7b\u522b\u4e0a\u66f4\u8106\u5f31\uff0c\u63a8\u7406\u8fc7\u7a0b\u4e0d\u4ec5\u4e0d\u80fd\u7f13\u89e3\u95ee\u9898\uff0c\u8fd8\u5e38\u751f\u6210\u865a\u5047\u7684\u793e\u4f1a\u8bc1\u660e\u6765\u5408\u7406\u5316\u9519\u8bef\u63a8\u8350\u3002", "\u56db\u7c7b\u9632\u5fa1\u5747\u4e0d\u5145\u5206\uff1a\u6000\u7591\u63d0\u793a\u53ef\u80fd\u52a0\u5267\u8106\u5f31\u6027\uff0c\u5171\u8bc6\u8fc7\u6ee4\u4f1a\u8bef\u4f24\u771f\u5b9e\u4ea7\u54c1\uff0c\u53ef\u4fe1\u5ea6\u91cd\u6392\u5e8f\u867d\u6709\u5e2e\u52a9\u4f46\u53ea\u80fd\u79fb\u9664\u7ea6\u516d\u5206\u4e4b\u4e00\u5047\u63a8\u8350\u3002"], "keywords": ["\u68c0\u7d22\u589e\u5f3a", "\u5927\u6a21\u578b\u5b89\u5168", "\u63a8\u8350\u7cfb\u7edf", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2606.13610v2", "published_at": "2026-06-11", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2606.13610.png", "title": "One Polluted Page Is Enough: Evaluating Web Content Pollution in LLM Recommenders", "tldr": "\u5355\u9875\u6c61\u67d3\u5373\u53ef\u8bef\u5bfc\u8054\u7f51LLM\u63a8\u8350\u5047\u8d27", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa FORGE \u57fa\u51c6\uff0c\u7528\u771f\u5b9e\u68c0\u7d22\u7f51\u9875\u7684\u5c40\u90e8\u6539\u5199\u6765\u6a21\u62df GEO \u5185\u5bb9\u6c61\u67d3\uff0c\u8bc4\u4f30\u641c\u7d22\u589e\u5f3a LLM \u662f\u5426\u4f1a\u63a8\u8350\u4f2a\u9020\u4ea7\u54c1\u3002\u5b9e\u9a8c\u8986\u76d6 225 \u4e2a\u771f\u5b9e\u4ea7\u54c1\u300115 \u7c7b\u5546\u54c1\u30015 \u79cd\u6d88\u8d39\u573a\u666f\u548c 12 \u4e2a\u5546\u4e1a/\u5f00\u6e90\u6a21\u578b\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u641c\u7d22\u589e\u5f3a LLM \u63a8\u8350\u7cfb\u7edf\u9762\u5bf9 GEO \u5185\u5bb9\u6c61\u67d3\u7684\u7cfb\u7edf\u6027\u98ce\u9669\uff0c\u8bf4\u660e\u5c11\u91cf\u7f51\u9875\u64cd\u7eb5\u5373\u53ef\u5f71\u54cd\u6d88\u8d39\u63a8\u8350\uff0c\u5bf9\u8054\u7f51\u5927\u6a21\u578b\u3001\u641c\u7d22\u751f\u6001\u548c\u5546\u4e1a\u63a8\u8350\u5b89\u5168\u90fd\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "On-policy distillation (OPD) has emerged as an effective framework for post-training language models by pairing student-generated trajectories with dense token-level supervision from a teacher. However, OPD implicitly assumes that teacher-derived rewards are an appropriate proxy for reasoning progress, and therefore treats all teacher feedback equally during policy optimization. While in practice, this assumption does not always hold. We observe that teacher-derived rewards often conflict with genuine reasoning progress, as reasoning steps with clear reasoning advancement may still receive lower distillation rewards, simply due to deviation from teacher\u0027s outputs. To address this mismatch, we propose Reasoning-Progress-Aware Reward Filtering for On-Policy Distillation (R2-OPD), which constructs two within-trajectory rankings of reasoning spans, one from teacher-derived rewards and the other from independently estimated progress reward. Distillation rewards are selectively suppressed whenever the two rankings disagree, reducing supervision that conflicts with reasoning progress while preserving effective teacher guidance. Our approach shows consistent improvement over standard OPD especially regarding reasoning performances.", "arxiv_id": "2608.19408", "arxiv_url": "https://arxiv.org/abs/2608.19408", "authors": ["Chen Yang", "Haiyuan Wan", "Rengrong Xiong", "Yize Chen", "Danny H. K. Tsang"], "brief": "\u672c\u6587\u63d0\u51fa R2-OPD\uff0c\u4e00\u79cd\u9762\u5411\u8bed\u8a00\u6a21\u578b\u5728\u7b56\u7565\u84b8\u998f\u7684\u5956\u52b1\u8fc7\u6ee4\u65b9\u6cd5\u3002\u5b83\u6bd4\u8f83\u6559\u5e08\u84b8\u998f\u5956\u52b1\u4e0e\u72ec\u7acb\u4f30\u8ba1\u7684\u63a8\u7406\u8fdb\u5c55\u5956\u52b1\uff0c\u5728\u4e8c\u8005\u6392\u5e8f\u51b2\u7a81\u65f6\u6291\u5236\u76f8\u5e94\u76d1\u7763\u4fe1\u53f7\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.19408", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u6807\u51c6 OPD \u5c06\u6559\u5e08\u5956\u52b1\u7b49\u540c\u4e8e\u63a8\u7406\u8fdb\u5c55\u7684\u5047\u8bbe\u5e76\u4e0d\u603b\u6210\u7acb\uff0c\u504f\u79bb\u6559\u5e08\u8f93\u51fa\u7684\u6709\u6548\u63a8\u7406\u6b65\u9aa4\u53ef\u80fd\u88ab\u4f4e\u4f30\u3002", "\u4e3a\u540c\u4e00\u751f\u6210\u8f68\u8ff9\u5185\u7684\u63a8\u7406\u7247\u6bb5\u6784\u5efa\u4e24\u5957\u6392\u5e8f\uff1a\u6559\u5e08\u6d3e\u751f\u5956\u52b1\u6392\u5e8f\u4e0e\u63a8\u7406\u8fdb\u5c55\u5956\u52b1\u6392\u5e8f\u3002", "\u5f53\u4e24\u79cd\u6392\u5e8f\u4e0d\u4e00\u81f4\u65f6\u9009\u62e9\u6027\u964d\u4f4e\u84b8\u998f\u5956\u52b1\uff0c\u4ece\u800c\u51cf\u5c11\u4e0e\u771f\u5b9e\u63a8\u7406\u8fdb\u5c55\u76f8\u51b2\u7a81\u7684\u76d1\u7763\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u63a8\u7406\u80fd\u529b", "\u5956\u52b1\u5efa\u6a21", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.19408v1", "published_at": "2026-08-19", "score": 0.239, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.19408.png", "title": "Beyond Imitation: Filtering On-Policy Distillation by Reasoning Progress", "tldr": "\u7528\u63a8\u7406\u8fdb\u5c55\u8fc7\u6ee4OPD\u4e2d\u6709\u51b2\u7a81\u7684\u6559\u5e08\u5956\u52b1", "upvotes": 8, "what_it_is": "\u672c\u6587\u63d0\u51fa R2-OPD\uff0c\u4e00\u79cd\u9762\u5411\u8bed\u8a00\u6a21\u578b\u5728\u7b56\u7565\u84b8\u998f\u7684\u5956\u52b1\u8fc7\u6ee4\u65b9\u6cd5\u3002\u5b83\u6bd4\u8f83\u6559\u5e08\u84b8\u998f\u5956\u52b1\u4e0e\u72ec\u7acb\u4f30\u8ba1\u7684\u63a8\u7406\u8fdb\u5c55\u5956\u52b1\uff0c\u5728\u4e8c\u8005\u6392\u5e8f\u51b2\u7a81\u65f6\u6291\u5236\u76f8\u5e94\u76d1\u7763\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9 LLM \u63a8\u7406\u84b8\u998f\u4e2d\u7684\u5956\u52b1\u9519\u914d\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u8f7b\u91cf\u7684\u8fc7\u6ee4\u673a\u5236\uff0c\u5728\u4fdd\u7559\u6559\u5e08\u6307\u5bfc\u7684\u540c\u65f6\u63d0\u5347\u63a8\u7406\u8868\u73b0\uff0c\u5bf9\u540e\u8bad\u7ec3\u548c\u63a8\u7406\u80fd\u529b\u4f18\u5316\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present LAION-BVD, a large-scale open video dataset for multimodal learning, which contains 1.3B platform-specific video URLs collected from CommonCrawl. From these, we download 80M videos with a total duration of 10 million hours. The dataset is designed for multimodal pre-training across the video, audio, and image modalities. Using content-aware scene detection, we extract clips for which we synthetically generate video and audio captions. Models trained on these data achieve competitive performance on standard video-text and audio-text benchmarks, with consistent improvements as training or model scale increases. Additionally, we explore video frames as an alternative source of image-text data by extracting scene-changing frames. These frames exhibit a visual distribution distinct from standard web image corpora, and models trained on this dataset achieve strong image-text retrieval performance. We release LAION-BVD to the research community. It significantly expands open access to multimodal videos at an unprecedented scale.", "arxiv_id": "2608.24845", "arxiv_url": "https://arxiv.org/abs/2608.24845", "authors": ["Andreas Hochlehnert", "Marianna Nezhurina", "Mehdi Cherti", "Andrej Radonjic", "Thadd\u00e4us Wiedemer", "Christoph Schuhmann", "Romain Beaumont", "Wieland Brendel", "Bernhard Sch\u00f6lkopf", "A. Sophia Koepke", "Jenia Jitsev", "Matthias Bethge"], "brief": "\u8bba\u6587\u6784\u5efa\u5e76\u53d1\u5e03 LAION-BVD\uff1a\u4ece CommonCrawl \u6536\u96c6 13 \u4ebf\u89c6\u9891 URL\uff0c\u5b9e\u9645\u4e0b\u8f7d 8000 \u4e07\u89c6\u9891\uff0c\u603b\u65f6\u957f\u8fbe 1000 \u4e07\u5c0f\u65f6\u3002\u6570\u636e\u96c6\u9762\u5411\u89c6\u9891\u3001\u97f3\u9891\u3001\u56fe\u50cf\u7b49\u591a\u6a21\u6001\u9884\u8bad\u7ec3\uff0c\u5e76\u4e3a\u7247\u6bb5\u751f\u6210\u5408\u6210\u89c6\u9891\u4e0e\u97f3\u9891\u5b57\u5e55\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24845", "impact_score": 9, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u5185\u5bb9\u611f\u77e5\u573a\u666f\u68c0\u6d4b\u5207\u5206\u89c6\u9891\u7247\u6bb5\uff0c\u5e76\u751f\u6210\u89c6\u9891/\u97f3\u9891\u6587\u672c\u63cf\u8ff0\uff0c\u7528\u4e8e\u89c6\u9891-\u6587\u672c\u4e0e\u97f3\u9891-\u6587\u672c\u9884\u8bad\u7ec3", "\u57fa\u4e8e\u8be5\u6570\u636e\u8bad\u7ec3\u7684\u6a21\u578b\u5728\u6807\u51c6\u89c6\u9891-\u6587\u672c\u3001\u97f3\u9891-\u6587\u672c\u57fa\u51c6\u4e0a\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u4e14\u968f\u8bad\u7ec3\u89c4\u6a21\u548c\u6a21\u578b\u89c4\u6a21\u6269\u5927\u6301\u7eed\u63d0\u5347", "\u4ece\u89c6\u9891\u4e2d\u63d0\u53d6\u573a\u666f\u53d8\u5316\u5e27\u4f5c\u4e3a\u56fe\u50cf-\u6587\u672c\u6570\u636e\u6765\u6e90\uff0c\u5206\u5e03\u533a\u522b\u4e8e\u4f20\u7edf\u7f51\u9875\u56fe\u50cf\u8bed\u6599\uff0c\u5e76\u53d6\u5f97\u8f83\u5f3a\u56fe\u6587\u68c0\u7d22\u6027\u80fd"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u6570\u636e\u96c6", "\u9884\u8bad\u7ec3", "\u97f3\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24845v1", "published_at": "2026-08-25", "score": 0.225, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "LAION-BVD: A 10-Million-Hour Open Video Dataset for Multimodal Pre-training", "tldr": "LAION\u53d1\u5e03\u5343\u4e07\u5c0f\u65f6\u5f00\u653e\u591a\u6a21\u6001\u89c6\u9891\u6570\u636e\u96c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u5e76\u53d1\u5e03 LAION-BVD\uff1a\u4ece CommonCrawl \u6536\u96c6 13 \u4ebf\u89c6\u9891 URL\uff0c\u5b9e\u9645\u4e0b\u8f7d 8000 \u4e07\u89c6\u9891\uff0c\u603b\u65f6\u957f\u8fbe 1000 \u4e07\u5c0f\u65f6\u3002\u6570\u636e\u96c6\u9762\u5411\u89c6\u9891\u3001\u97f3\u9891\u3001\u56fe\u50cf\u7b49\u591a\u6a21\u6001\u9884\u8bad\u7ec3\uff0c\u5e76\u4e3a\u7247\u6bb5\u751f\u6210\u5408\u6210\u89c6\u9891\u4e0e\u97f3\u9891\u5b57\u5e55\u3002", "why_notable": "\u8fd9\u662f\u76ee\u524d\u5f00\u653e\u53ef\u7528\u89c4\u6a21\u7a7a\u524d\u7684\u89c6\u9891\u591a\u6a21\u6001\u6570\u636e\u96c6\u4e4b\u4e00\uff0c\u6709\u671b\u663e\u8457\u964d\u4f4e\u5927\u89c4\u6a21\u89c6\u9891\u3001\u97f3\u9891\u3001\u56fe\u50cf\u8054\u5408\u9884\u8bad\u7ec3\u7684\u7814\u7a76\u95e8\u69db\uff0c\u5e76\u63a8\u52a8\u5f00\u653e\u591a\u6a21\u6001\u57fa\u7840\u6a21\u578b\u53d1\u5c55\u3002"}, {"abstract": "Coding agents perform long-running tasks spanning dozens of model calls, tool uses, and code edits. As these runs unfold, users face a practical cost-quality trade-off: escalating to a stronger model when a cheaper one struggles, or downshifting once the hard reasoning is complete. Each switch requires the receiver to continue a non-native trajectory produced by another model. We study how this handoff affects quality and cost, and how varying the trajectory information inherited by the receiver changes the outcome. Using pairs of low-cost, low-capability (LC) and high-cost, high-capability (HC) models from the Claude and GPT families, we vary handoff direction, timing, and interface, comparing full-trajectory transfer, compaction, and trajectory removal while preserving the repository state. Across both model families, full-trajectory escalation recovers less than half of the LC-to-HC quality gap while incurring a substantial cost premium. We term this cost-quality penalty the handoff tax. By contrast, downshift offers a favorable cost-quality point. Interestingly, the preferred interface also reverses with direction: reducing LC-model trajectory information improves escalation quality, whereas removing the HC-model trajectory reduces downshift quality.", "arxiv_id": "2608.24358", "arxiv_url": "https://arxiv.org/abs/2608.24358", "authors": ["Roy Ganz", "Mor Shpigel Nacson", "Adi Kalyanpur", "Ron Litman"], "brief": "\u672c\u6587\u7814\u7a76\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u957f\u4efb\u52a1\u4e2d\u4ece\u4f4e\u80fd\u529b\u4f4e\u6210\u672c\u6a21\u578b\u5207\u6362\u5230\u9ad8\u80fd\u529b\u9ad8\u6210\u672c\u6a21\u578b\u6216\u53cd\u5411\u5207\u6362\u65f6\u7684\u201c\u4ea4\u63a5\u7a0e\u201d\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5411\u4e0a\u5347\u7ea7\u53ea\u80fd\u5f25\u8865\u4e0d\u5230\u4e00\u534a\u7684\u8d28\u91cf\u5dee\u8ddd\u4e14\u6210\u672c\u663e\u8457\u589e\u52a0\uff0c\u800c\u5411\u4e0b\u5207\u6362\u5728\u6210\u672c\u4e0e\u8d28\u91cf\u4e0a\u66f4\u5212\u7b97\uff1b\u540c\u65f6\uff0c\u4e0d\u540c\u65b9\u5411\u4e0b\u4fdd\u7559\u8f68\u8ff9\u4fe1\u606f\u7684\u6700\u4f73\u7b56\u7565\u76f8\u53cd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24358", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5207\u6362"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24358v1", "published_at": "2026-08-25", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "The Handoff Tax: Continuing Non-Native Trajectories in LLM Agents", "tldr": "\u672c\u6587\u7814\u7a76\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u957f\u4efb\u52a1\u4e2d\u4ece\u4f4e\u80fd\u529b\u4f4e\u6210\u672c\u6a21\u578b\u5207\u6362\u5230\u9ad8\u80fd\u529b\u9ad8\u6210\u672c\u6a21\u578b\u6216\u53cd\u5411\u5207\u6362\u65f6\u7684\u201c\u4ea4\u63a5\u7a0e\u201d\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5411\u4e0a\u5347\u7ea7\u53ea\u80fd\u5f25\u8865\u4e0d\u5230\u4e00\u534a\u7684\u8d28\u91cf\u5dee\u8ddd\u4e14\u6210\u672c\u663e\u8457\u589e\u52a0\uff0c\u800c\u5411\u4e0b\u5207\u6362\u5728\u6210\u672c\u4e0e\u8d28\u91cf\u4e0a\u66f4\u5212\u7b97\uff1b\u540c\u65f6\uff0c\u4e0d\u540c\u65b9\u5411\u4e0b\u4fdd\u7559\u8f68\u8ff9\u4fe1\u606f\u7684\u6700\u4f73\u7b56\u7565\u76f8\u53cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "3D geometry editing is a critical yet labor-intensive part of the graphics pipeline, requiring artists to translate creative intent into precise operations in complex professional software. Large language models (LLMs) have shown promise for script-based 3D creation, but script generation is less suited to perception-driven editing of arbitrary existing meshes, where execution must remain visually grounded and untouched regions should be preserved. We present a \\emph{visual-centric}, training-free multi-agent system that edits existing 3D meshes directly in Blender by emulating the iterative workflow of human artists. Rather than generating scripts or regenerating geometry, our system operates through the Blender GUI: multimodal LLM agents observe the viewport, reason about the current mesh state, and execute localized edits through simulated user interactions. Experiments on a curated benchmark provide initial evidence that this agentic approach can follow natural language instructions, perform representative localized mesh edits, and preserve the overall identity of the input asset. Our results highlight a complementary regime for language-driven 3D editing: direct in-place modification of existing meshes within the native 3D editing workflow. We view this work as an exploratory step toward visual-centric agentic geometry editing in professional graphics software.", "arxiv_id": "2608.24169", "arxiv_url": "https://arxiv.org/abs/2608.24169", "authors": ["Bo Pang", "Jiaqi Pan", "Xiaocheng Zhang", "Jiacheng Xu", "Guoping Wang", "Peng-Shuai Wang"], "brief": "ViSculpt \u63d0\u51fa\u4e00\u79cd\u4ee5\u89c6\u89c9\u4e3a\u4e2d\u5fc3\u3001\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5728 Blender \u4e2d\u901a\u8fc7\u89c2\u5bdf\u89c6\u53e3\u5e76\u6a21\u62df\u7528\u6237\u64cd\u4f5c\u6765\u76f4\u63a5\u7f16\u8f91\u5df2\u6709 3D \u7f51\u683c\u3002\u5b9e\u9a8c\u521d\u6b65\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u80fd\u6839\u636e\u81ea\u7136\u8bed\u8a00\u5b8c\u6210\u5c40\u90e8\u51e0\u4f55\u4fee\u6539\uff0c\u540c\u65f6\u8f83\u597d\u4fdd\u7559\u539f\u59cb\u6a21\u578b\u8eab\u4efd\uff0c\u662f\u5bf9\u811a\u672c\u751f\u6210\u5f0f 3D \u7f16\u8f91\u7684\u8865\u5145\u3002", "categories": ["cs.CV", "cs.GR", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24169", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "3D\u7f16\u8f91", "\u591a\u6a21\u6001", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24169v1", "published_at": "2026-08-25", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ViSculpt: Visual-Centric Agentic Geometry Editing", "tldr": "ViSculpt \u63d0\u51fa\u4e00\u79cd\u4ee5\u89c6\u89c9\u4e3a\u4e2d\u5fc3\u3001\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5728 Blender \u4e2d\u901a\u8fc7\u89c2\u5bdf\u89c6\u53e3\u5e76\u6a21\u62df\u7528\u6237\u64cd\u4f5c\u6765\u76f4\u63a5\u7f16\u8f91\u5df2\u6709 3D \u7f51\u683c\u3002\u5b9e\u9a8c\u521d\u6b65\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u80fd\u6839\u636e\u81ea\u7136\u8bed\u8a00\u5b8c\u6210\u5c40\u90e8\u51e0\u4f55\u4fee\u6539\uff0c\u540c\u65f6\u8f83\u597d\u4fdd\u7559\u539f\u59cb\u6a21\u578b\u8eab\u4efd\uff0c\u662f\u5bf9\u811a\u672c\u751f\u6210\u5f0f 3D \u7f16\u8f91\u7684\u8865\u5145\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Interpretability research increasingly asks when concepts emerge during training and whether linear probes recover real structure, but in language models these claims are hard to validate because language offers little ground-truth ordering of concepts or relationships among them. We propose the use of astronomical ground truth through AstroPT, a transformer trained on millions of galaxy images, as a calibration testbed. AstroPT is an LLM-like model trained within a domain where the difficulty ordering of concepts and the relations among them are known in advance. Probing frozen representations across checkpoints, layers, model sizes, and objective choices, we find that galaxy properties emerge in a fixed order that tracks their known difficulty---quantities written almost directly into the pixels (band magnitude) become decodable early in training and shallow in the network, while multiband/spectra based and inferred quantities (such as redshift and specific star formation rate) emerge later and deeper. This order is invariant to our tested training objectives, and scales in magnitude but not in sequence with capacity. Our linear probe directions further recover the known physical structure among galaxy properties. Our findings suggest that astronomy offers a controlled sandbox for calibrating mechanistic interpretability methods we otherwise apply to LLMs blind.", "arxiv_id": "2608.22614", "arxiv_url": "https://arxiv.org/abs/2608.22614", "authors": ["UniverseTBD", ":", "Kshitij Duraphe", "Aman Kumar", "Michael J. Smith", "Shashwat Sourav"], "brief": "\u672c\u6587\u5c06\u8bad\u7ec3\u5728\u6570\u767e\u4e07\u661f\u7cfb\u56fe\u50cf\u4e0a\u7684 Transformer \u6a21\u578b AstroPT \u4f5c\u4e3a\u7c7b LLM \u7684\u53ef\u89e3\u91ca\u6027\u6d4b\u8bd5\u5e73\u53f0\u3002\u4f5c\u8005\u901a\u8fc7\u51bb\u7ed3\u8868\u5f81\u4e0a\u7684\u7ebf\u6027\u63a2\u9488\uff0c\u5206\u6790\u4e0d\u540c\u8bad\u7ec3\u9636\u6bb5\u3001\u5c42\u3001\u6a21\u578b\u89c4\u6a21\u548c\u76ee\u6807\u4e0b\u661f\u7cfb\u5c5e\u6027\u6982\u5ff5\u5982\u4f55\u6d8c\u73b0\u3002", "categories": ["cs.LG", "astro-ph.IM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22614", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u661f\u7cfb\u5c5e\u6027\u7684\u53ef\u89e3\u7801\u987a\u5e8f\u4e0e\u5df2\u77e5\u7269\u7406\u96be\u5ea6\u4e00\u81f4\uff1a\u50cf\u7d20\u4e2d\u76f4\u63a5\u4f53\u73b0\u7684\u6ce2\u6bb5\u661f\u7b49\u66f4\u65e9\u3001\u66f4\u6d45\u5c42\u51fa\u73b0\uff0c\u7ea2\u79fb\u3001\u6bd4\u6052\u661f\u5f62\u6210\u7387\u7b49\u63a8\u65ad\u5c5e\u6027\u66f4\u665a\u3001\u66f4\u6df1\u5c42\u51fa\u73b0\u3002", "\u8fd9\u79cd\u6982\u5ff5\u6d8c\u73b0\u987a\u5e8f\u5728\u4e0d\u540c\u8bad\u7ec3\u76ee\u6807\u4e0b\u4fdd\u6301\u7a33\u5b9a\uff0c\u6a21\u578b\u5bb9\u91cf\u4e3b\u8981\u653e\u5927\u53ef\u89e3\u7801\u5f3a\u5ea6\u800c\u4e0d\u6539\u53d8\u987a\u5e8f\u3002", "\u7ebf\u6027\u63a2\u9488\u65b9\u5411\u80fd\u591f\u6062\u590d\u661f\u7cfb\u5c5e\u6027\u4e4b\u95f4\u5df2\u77e5\u7684\u7269\u7406\u7ed3\u6784\uff0c\u4e3a\u9a8c\u8bc1\u63a2\u9488\u662f\u5426\u6355\u83b7\u771f\u5b9e\u7ed3\u6784\u63d0\u4f9b\u4e86\u53ef\u63a7\u57fa\u51c6\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u8868\u5f81\u5b66\u4e60", "\u79d1\u5b66\u673a\u5668\u5b66\u4e60", "\u7ebf\u6027\u63a2\u9488"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22614v1", "published_at": "2026-08-23", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.22614.png", "title": "What AstroPT knows about galaxies, and what that can teach us about LLMs", "tldr": "\u7528\u661f\u7cfb\u6a21\u578b\u6821\u51c6LLM\u53ef\u89e3\u91ca\u6027\u65b9\u6cd5", "upvotes": 4, "what_it_is": "\u672c\u6587\u5c06\u8bad\u7ec3\u5728\u6570\u767e\u4e07\u661f\u7cfb\u56fe\u50cf\u4e0a\u7684 Transformer \u6a21\u578b AstroPT \u4f5c\u4e3a\u7c7b LLM \u7684\u53ef\u89e3\u91ca\u6027\u6d4b\u8bd5\u5e73\u53f0\u3002\u4f5c\u8005\u901a\u8fc7\u51bb\u7ed3\u8868\u5f81\u4e0a\u7684\u7ebf\u6027\u63a2\u9488\uff0c\u5206\u6790\u4e0d\u540c\u8bad\u7ec3\u9636\u6bb5\u3001\u5c42\u3001\u6a21\u578b\u89c4\u6a21\u548c\u76ee\u6807\u4e0b\u661f\u7cfb\u5c5e\u6027\u6982\u5ff5\u5982\u4f55\u6d8c\u73b0\u3002", "why_notable": "\u8bed\u8a00\u6a21\u578b\u4e2d\u6982\u5ff5\u987a\u5e8f\u548c\u5173\u7cfb\u7f3a\u4e4f\u53ef\u9760\u771f\u503c\uff0c\u5bfc\u81f4\u53ef\u89e3\u91ca\u6027\u7ed3\u8bba\u96be\u4ee5\u6821\u51c6\uff1b\u5929\u6587\u5b66\u63d0\u4f9b\u4e86\u5177\u6709\u660e\u786e\u7269\u7406\u5148\u9a8c\u548c\u96be\u5ea6\u5c42\u7ea7\u7684\u6c99\u76d2\uff0c\u6709\u52a9\u4e8e\u68c0\u9a8c\u7ebf\u6027\u63a2\u9488\u548c\u673a\u5236\u53ef\u89e3\u91ca\u6027\u65b9\u6cd5\u7684\u53ef\u4fe1\u5ea6\u3002"}, {"abstract": "Face presentation attack detection (PAD) is traditionally formulated as a face-specific problem, although many of the visual artifacts introduced by print, replay, and recapture processes are not inherently tied to facial appearance. In this work, we investigate whether transferable PAD representations can be learned without using faces during downstream PAD training. To this end, we introduce TPO, a controlled face-free presentation attack dataset consisting of bona fide, print, and replay recordings of, almost randomly chosen, tomatoes, potatoes, and onions acquired under protocols that closely mirror conventional face PAD datasets. Using a foundation-model-based PAD architecture, we demonstrate that a detector trained on TPO achieves an average AUC of 92.70% across four standard cross-dataset face PAD benchmarks, outperforming training on synthetic faces and remaining competitive with models trained on real face datasets. Conversely, models trained on face PAD datasets transfer consistently above chance to TPO, suggesting that the learned representations capture characteristics of the presentation process rather than object semantics. Furthermore, incorporating TPO into conventional face PAD training consistently improves cross-dataset performance under fixed optimization budgets, indicating that face-free data provides complementary information rather than simply additional training samples. Finally, representation and frequency analyses provide further evidence that transferable PAD representations cannot be explained by a single spectral artifact but instead encode richer presentation cues shared across object categories. Together, these results provide empirical evidence that transferable presentation attack representations can be learned independently of facial content, opening new opportunities for privacy-preserving and identity-independent PAD development.", "arxiv_id": "2608.21455", "arxiv_url": "https://arxiv.org/abs/2608.21455", "authors": ["Guray Ozgur", "Fadi Boutros", "Naser Damer"], "brief": "\u8bba\u6587\u63d0\u51fa TPO\uff0c\u4e00\u4e2a\u4e0d\u542b\u4eba\u8138\u7684\u5448\u73b0\u653b\u51fb\u68c0\u6d4b\u6570\u636e\u96c6\uff0c\u5305\u542b\u756a\u8304\u3001\u571f\u8c46\u3001\u6d0b\u8471\u7684\u771f\u5b9e\u3001\u6253\u5370\u4e0e\u91cd\u653e\u5f55\u5236\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u8be5\u6570\u636e\u4e0a\u8bad\u7ec3\u7684 PAD \u6a21\u578b\u53ef\u8fc1\u79fb\u5230\u6807\u51c6\u4eba\u8138 PAD \u57fa\u51c6\uff0c\u5e76\u53d6\u5f97\u8f83\u5f3a\u8de8\u6570\u636e\u96c6\u6027\u80fd\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/gurayozgur/TPO", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21455", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["TPO \u4ee5\u975e\u4eba\u8138\u7269\u4f53\u6a21\u62df\u4f20\u7edf\u4eba\u8138 PAD \u91c7\u96c6\u534f\u8bae\uff0c\u7528\u4e8e\u9a8c\u8bc1\u9632\u4f2a\u7279\u5f81\u662f\u5426\u4f9d\u8d56\u4eba\u8138\u8bed\u4e49\u3002", "\u57fa\u4e8e\u57fa\u7840\u6a21\u578b\u7684 PAD \u67b6\u6784\u5728 TPO \u4e0a\u8bad\u7ec3\u540e\uff0c\u5728\u56db\u4e2a\u4eba\u8138\u8de8\u6570\u636e\u96c6\u57fa\u51c6\u4e0a\u5e73\u5747 AUC \u8fbe 92.70%\u3002", "\u5c06 TPO \u4e0e\u5e38\u89c4\u4eba\u8138 PAD \u6570\u636e\u8054\u5408\u8bad\u7ec3\u53ef\u5728\u56fa\u5b9a\u4f18\u5316\u9884\u7b97\u4e0b\u7a33\u5b9a\u63d0\u5347\u8de8\u6570\u636e\u96c6\u8868\u73b0\uff0c\u8bf4\u660e\u5176\u63d0\u4f9b\u4e92\u8865\u7684\u5448\u73b0\u8fc7\u7a0b\u7ebf\u7d22\u3002"], "keywords": ["\u4eba\u8138\u9632\u4f2a", "\u8fc1\u79fb\u8868\u793a", "\u6570\u636e\u96c6", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 2, "on_hf": true, "organization": "Fraunhofer IGD", "pdf_url": "https://arxiv.org/pdf/2608.21455v1", "published_at": "2026-08-20", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21455.png", "title": "Tomatoes, Potatoes, and Onions: Questioning the Need for Faces in Face Presentation Attack Detection", "tldr": "\u7528\u852c\u83dc\u4e5f\u80fd\u5b66\u5230\u4eba\u8138\u9632\u4f2a\u7279\u5f81", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa TPO\uff0c\u4e00\u4e2a\u4e0d\u542b\u4eba\u8138\u7684\u5448\u73b0\u653b\u51fb\u68c0\u6d4b\u6570\u636e\u96c6\uff0c\u5305\u542b\u756a\u8304\u3001\u571f\u8c46\u3001\u6d0b\u8471\u7684\u771f\u5b9e\u3001\u6253\u5370\u4e0e\u91cd\u653e\u5f55\u5236\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u8be5\u6570\u636e\u4e0a\u8bad\u7ec3\u7684 PAD \u6a21\u578b\u53ef\u8fc1\u79fb\u5230\u6807\u51c6\u4eba\u8138 PAD \u57fa\u51c6\uff0c\u5e76\u53d6\u5f97\u8f83\u5f3a\u8de8\u6570\u636e\u96c6\u6027\u80fd\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u4eba\u8138\u9632\u4f2a\u5fc5\u987b\u4f9d\u8d56\u4eba\u8138\u6570\u636e\u7684\u9ed8\u8ba4\u5047\u8bbe\uff0c\u663e\u793a\u53ef\u8fc1\u79fb\u9632\u4f2a\u8868\u793a\u66f4\u591a\u6355\u6349\u6253\u5370\u3001\u91cd\u653e\u3001\u518d\u91c7\u96c6\u7b49\u8fc7\u7a0b\u75d5\u8ff9\uff0c\u800c\u975e\u8eab\u4efd\u6216\u4eba\u8138\u8bed\u4e49\u3002\u8fd9\u4e3a\u9690\u79c1\u4fdd\u62a4\u3001\u8eab\u4efd\u65e0\u5173\u7684 PAD \u6570\u636e\u6784\u5efa\u63d0\u4f9b\u4e86\u65b0\u65b9\u5411\u3002"}, {"abstract": "Robot policies receive heterogeneous observations at each decision step, yet sequence models differ in how they organize these inputs over time. We introduce WorldToken, a time-first policy instantiation that fuses multiview images, proprioception, and task conditioning within each policy timestep into one world token. A causal temporal Transformer models the resulting world-token sequence, and a diffusion action head generates action chunks. On 23 RoboCasa tasks, an 85.3M-parameter policy trained from scratch apart from a frozen pretrained CLIP text encoder achieves 59.45% mean closed-loop success using 2,900 generated demonstrations per task. A complete factorial sweep over five dataset sizes, five model sizes, and two training seeds shows consistent gains from additional target-domain data and diminishing returns beyond moderate model size. Under same-checkpoint history truncation, reducing visible history to one or two policy timesteps lowers closed-loop success for all 50 RoboCasa policies. On RMBench Blocks Ranking, reducing visible history from 146 to 8 seconds lowers evaluator success from 95% to 28%, while an exploratory extended rollout sustains the reference swap sequence for over 850 seconds. These results establish the empirical feasibility of the complete WorldToken instantiation and characterize its data-scaling and temporal-context behavior under the tested recipes. They do not establish superiority over alternative sequence organizations or isolate which components of the complete implementation drive the observed performance.", "arxiv_id": "2608.22591", "arxiv_url": "https://arxiv.org/abs/2608.22591", "authors": ["Chunkai Yang", "Andong Yang", "Chao Gao"], "brief": "\u8bba\u6587\u63d0\u51fa WorldToken\uff1a\u5728\u6bcf\u4e2a\u7b56\u7565\u65f6\u95f4\u6b65\u5185\u878d\u5408\u591a\u89c6\u89d2\u56fe\u50cf\u3001\u672c\u4f53\u611f\u77e5\u4e0e\u4efb\u52a1\u6761\u4ef6\u4e3a\u4e00\u4e2a\u201c\u4e16\u754c token\u201d\uff0c\u518d\u7528\u56e0\u679c\u65f6\u95f4 Transformer \u5efa\u6a21\u5e8f\u5217\uff0c\u5e76\u901a\u8fc7\u6269\u6563\u52a8\u4f5c\u5934\u751f\u6210\u52a8\u4f5c\u7247\u6bb5\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22591", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 23 \u4e2a RoboCasa \u4efb\u52a1\u4e0a\uff0c8500 \u4e07\u53c2\u6570\u7b56\u7565\u4ece\u5934\u8bad\u7ec3\uff0c\u5e73\u5747\u95ed\u73af\u6210\u529f\u7387\u8fbe\u5230 59.45%\u3002", "\u5b8c\u6574\u56e0\u5b50\u5b9e\u9a8c\u8986\u76d6 5 \u79cd\u6570\u636e\u89c4\u6a21\u30015 \u79cd\u6a21\u578b\u89c4\u6a21\u548c 2 \u4e2a\u968f\u673a\u79cd\u5b50\uff0c\u663e\u793a\u76ee\u6807\u57df\u6570\u636e\u589e\u52a0\u5e26\u6765\u7a33\u5b9a\u6536\u76ca\uff0c\u4f46\u6a21\u578b\u89c4\u6a21\u8d85\u8fc7\u4e2d\u7b49\u5927\u5c0f\u540e\u6536\u76ca\u9012\u51cf\u3002", "\u5386\u53f2\u622a\u65ad\u5b9e\u9a8c\u8868\u660e\u65f6\u95f4\u4e0a\u4e0b\u6587\u5f88\u5173\u952e\uff1aRoboCasa \u4e2d\u4ec5\u4fdd\u7559 1-2 \u4e2a\u65f6\u95f4\u6b65\u4f1a\u964d\u4f4e\u6240\u6709 50 \u4e2a\u7b56\u7565\u7684\u6210\u529f\u7387\uff1bRMBench \u4e2d\u53ef\u89c1\u5386\u53f2\u4ece 146 \u79d2\u964d\u81f3 8 \u79d2\u4f7f\u6210\u529f\u7387\u4ece 95% \u964d\u81f3 28%\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60", "\u5e8f\u5217\u5efa\u6a21", "\u6269\u6563\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22591v1", "published_at": "2026-08-23", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.22591.png", "title": "WorldToken: Time-First Sequence Modeling for Robotic Imitation Learning", "tldr": "WorldToken\u7528\u65f6\u95f4\u4f18\u5148\u5efa\u6a21\u63d0\u5347\u673a\u5668\u4eba\u6a21\u4eff\u5b66\u4e60\u3002", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldToken\uff1a\u5728\u6bcf\u4e2a\u7b56\u7565\u65f6\u95f4\u6b65\u5185\u878d\u5408\u591a\u89c6\u89d2\u56fe\u50cf\u3001\u672c\u4f53\u611f\u77e5\u4e0e\u4efb\u52a1\u6761\u4ef6\u4e3a\u4e00\u4e2a\u201c\u4e16\u754c token\u201d\uff0c\u518d\u7528\u56e0\u679c\u65f6\u95f4 Transformer \u5efa\u6a21\u5e8f\u5217\uff0c\u5e76\u901a\u8fc7\u6269\u6563\u52a8\u4f5c\u5934\u751f\u6210\u52a8\u4f5c\u7247\u6bb5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7cfb\u7edf\u9a8c\u8bc1\u4e86\u201c\u65f6\u95f4\u4f18\u5148\u201d\u7684\u673a\u5668\u4eba\u5e8f\u5217\u5efa\u6a21\u65b9\u6848\u5728\u590d\u6742\u591a\u6a21\u6001\u6a21\u4eff\u5b66\u4e60\u4e2d\u7684\u53ef\u884c\u6027\uff0c\u5e76\u63d0\u4f9b\u4e86\u5173\u4e8e\u6570\u636e\u6269\u5c55\u3001\u6a21\u578b\u89c4\u6a21\u4e0e\u65f6\u95f4\u4e0a\u4e0b\u6587\u4f9d\u8d56\u7684\u5b9e\u8bc1\u7ed3\u8bba\uff0c\u5bf9\u8bbe\u8ba1\u673a\u5668\u4eba\u57fa\u7840\u7b56\u7565\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Deep face recognition (FR) models reach near-saturated accuracy but remain opaque: a practitioner cannot ask which semantic attributes a similarity score relied upon. EXPL-FR answers this inside the FR model\u0027s own embedding space. A lightweight adapter aligns a vision-language model\u0027s (VLM) image encoder with the frozen FR space, trained on face images alone and never on text. Because the VLM\u0027s encoders share one space, the same adapter applies to the text encoder, turning 978 attribute prompts in 22 categories, also extendable, into FR-space anchors at no extra cost. We do not assume this transfer works: a face-verification protocol measures it, and an ablation changing only the adapter isolates its contribution. Not every concept survives, because an FR model earns its invariances by discarding the factors it must verify identities across. A label-free detectability measure compares each concept\u0027s separability in FR space against the VLM space, and the 100 most detectable form the model\u0027s readable semantic signature, which separates identities better than the full vocabulary. We cover four FR backbones and two VLM encoders, EXPL-FR needs no architecture access, and supports identity-level, per-image, and differential explanations. We benchmark attribute-level auditing under three supervision settings, human labels (current practice), VLM pseudo-labels, and our fully prompt-driven audit, against real verification behavior. With no labels, the prompt-driven audit ranks four FR models by their measured per-ethnicity RFW errors and ranks controlled attribute changes by their true verification cost.", "arxiv_id": "2608.21486", "arxiv_url": "https://arxiv.org/abs/2608.21486", "authors": ["Guray Ozgur", "Mustafa Efe Tamyapar", "Naser Damer", "Fadi Boutros"], "brief": "\u8bba\u6587\u63d0\u51fa EXPL-FR\uff1a\u5728\u51bb\u7ed3\u7684\u4eba\u8138\u8bc6\u522b\u5d4c\u5165\u7a7a\u95f4\u4e2d\uff0c\u901a\u8fc7\u8f7b\u91cf\u9002\u914d\u5668\u5bf9\u9f50\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u56fe\u50cf\u7f16\u7801\u5668\uff0c\u5e76 .png", "title": "EXPL-FR: Explaining Face Recognition Models via Vision-Language Alignment", "tldr": "\u7528\u89c6\u89c9\u8bed\u8a00\u5bf9\u9f50\u89e3\u91ca\u4eba\u8138\u8bc6\u522b\u6a21\u578b", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa EXPL-FR\uff1a\u5728\u51bb\u7ed3\u7684\u4eba\u8138\u8bc6\u522b\u5d4c\u5165\u7a7a\u95f4\u4e2d\uff0c\u901a\u8fc7\u8f7b\u91cf\u9002\u914d\u5668\u5bf9\u9f50\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u56fe\u50cf\u7f16\u7801\u5668\uff0c\u5e76\u5c06\u6587\u672c\u5c5e\u6027\u63d0\u793a\u6620\u5c04\u4e3a\u53ef\u89e3\u91ca\u7684\u8bed\u4e49\u951a\u70b9\u3002\u5b83\u65e0\u9700\u8bbf\u95ee\u6a21\u578b\u67b6\u6784\u6216\u4eba\u5de5\u6807\u7b7e\uff0c\u53ef\u751f\u6210\u8eab\u4efd\u7ea7\u3001\u5355\u56fe\u7ea7\u548c\u5dee\u5f02\u5316\u89e3\u91ca\uff0c\u5e76\u7528\u4e8e\u5c5e\u6027\u5ba1\u8ba1\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u9ed1\u76d2\u5f0f\u4eba\u8138\u8bc6\u522b\u76f8\u4f3c\u5ea6\u8f6c\u5316\u4e3a\u53ef\u8bfb\u7684\u8bed\u4e49\u5c5e\u6027\u89e3\u91ca\uff0c\u4e14\u4e0d\u4f9d\u8d56\u4eba\u5de5\u6807\u7b7e\u6216\u6a21\u578b\u5185\u90e8\u7ed3\u6784\uff0c\u5bf9\u9ad8\u98ce\u9669\u751f\u7269\u8bc6\u522b\u7cfb\u7edf\u7684\u516c\u5e73\u6027\u5ba1\u8ba1\u3001\u9519\u8bef\u8bca\u65ad\u548c\u5408\u89c4\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM-based agents can interact with external environments through tool invocation, but this capability also introduces security risks such as file modification, information leakage, and unauthorized actions. Existing guardrails often evaluate completed trajectories, leaving pre-execution monitoring of step-level actions underexplored. We propose StepGuard, a step-level guard model that can audit completed agent trajectories and check tool actions before they are executed. To train StepGuard, we introduce StepGen, an automatic data engine that generates safe and unsafe trajectories with the same context but different actions at the risky step. To further reduce over-defense and under-defense, we propose Balance-GRPO, which dynamically balances learning between safe and unsafe actions based on their observed accuracy. Experiments show that StepGuard achieves the highest average accuracy among open-weight guard models, with performance comparable to GPT-5.4. When used to guard agents on AgentDojo and AgentDyn, StepGuard reduces mean attack success rate by 77.3% relative to the no-guard setting, while mean utility drops by only 2.8 percentage points.", "arxiv_id": "2608.24777", "arxiv_url": "https://arxiv.org/abs/2608.24777", "authors": ["Zhijie Zheng", "Yu Li", "Chen Qian", "Yuqian Fu", "Yanwei Fu", "Lu Sheng", "Jing Shao", "Dongrui Liu"], "brief": "\u8bba\u6587\u63d0\u51fa StepGuard\uff0c\u4e00\u79cd\u53ef\u5728\u5de5\u5177\u8c03\u7528\u6267\u884c\u524d\u5ba1\u67e5\u52a8\u4f5c\u3001\u4e5f\u53ef\u5ba1\u8ba1\u5b8c\u6574\u8f68\u8ff9\u7684\u6b65\u9aa4\u7ea7\u62a4\u680f\u6a21\u578b\u3002\u5176\u914d\u5957\u63d0\u51fa\u81ea\u52a8\u6570\u636e\u751f\u6210\u5f15\u64ce StepGen \u548c\u5b89\u5168-\u6548\u7528\u5e73\u8861\u8bad\u7ec3\u65b9\u6cd5 Balance-GRPO\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24777", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["StepGen \u81ea\u52a8\u751f\u6210\u540c\u4e00\u4e0a\u4e0b\u6587\u4e0b\u5b89\u5168/\u4e0d\u5b89\u5168\u52a8\u4f5c\u5bf9\uff0c\u805a\u7126\u98ce\u9669\u6b65\u9aa4\uff0c\u6269\u5c55\u6b65\u9aa4\u7ea7\u76d1\u7763\u6570\u636e\u3002", "Balance-GRPO \u6839\u636e\u5b89\u5168\u4e0e\u4e0d\u5b89\u5168\u52a8\u4f5c\u7684\u5b9e\u65f6\u51c6\u786e\u7387\u52a8\u6001\u8c03\u6574\u5b66\u4e60\uff0c\u7f13\u89e3\u8fc7\u5ea6\u9632\u5fa1\u548c\u9632\u5fa1\u4e0d\u8db3\u3002", "\u5728 AgentDojo \u548c AgentDyn \u4e0a\uff0cStepGuard \u5c06\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u76f8\u5bf9\u65e0\u62a4\u680f\u964d\u4f4e 77.3%\uff0c\u5e73\u5747\u6548\u7528\u4ec5\u4e0b\u964d 2.8 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50", "\u5de5\u5177\u8c03\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24777v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "StepGuard: Learning Step-Level Guardrails with Scalable Supervision and Safety-Utility Balancing", "tldr": "\u9762\u5411\u5de5\u5177\u667a\u80fd\u4f53\u7684\u6b65\u9aa4\u7ea7\u5b89\u5168\u62a4\u680f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa StepGuard\uff0c\u4e00\u79cd\u53ef\u5728\u5de5\u5177\u8c03\u7528\u6267\u884c\u524d\u5ba1\u67e5\u52a8\u4f5c\u3001\u4e5f\u53ef\u5ba1\u8ba1\u5b8c\u6574\u8f68\u8ff9\u7684\u6b65\u9aa4\u7ea7\u62a4\u680f\u6a21\u578b\u3002\u5176\u914d\u5957\u63d0\u51fa\u81ea\u52a8\u6570\u636e\u751f\u6210\u5f15\u64ce StepGen \u548c\u5b89\u5168-\u6548\u7528\u5e73\u8861\u8bad\u7ec3\u65b9\u6cd5 Balance-GRPO\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u8bc4\u4f30\u5b8c\u6574\u8f68\u8ff9\u7684\u4f20\u7edf\u62a4\u680f\uff0cStepGuard \u5c06\u9632\u62a4\u524d\u79fb\u5230\u5de5\u5177\u52a8\u4f5c\u6267\u884c\u524d\uff0c\u66f4\u9002\u5408\u771f\u5b9e LLM \u667a\u80fd\u4f53\u5b89\u5168\u90e8\u7f72\uff0c\u5e76\u5728\u5f00\u6e90\u62a4\u680f\u6a21\u578b\u4e2d\u8fbe\u5230\u9886\u5148\u7cbe\u5ea6\u3001\u63a5\u8fd1 GPT-5.4 \u6c34\u5e73\u3002"}, {"abstract": "We introduce Maia 200, an advanced AI accelerator delivering high performance-10 145 Tflop/s FP4 and 5072 Tflop/s FP8 within a 750W TDP and 7 TB/s HBM bandwidth. Maia exemplifies a new class of Software Defined Locally Accessed Dataflow Architectures (SDLA), which explicitly program dataflow engines to orchestrate highly specialized memories and data movement engines. This approach shifts the focus from today\u0027s thread-centric to data-movement-centric architecture, improving efficiency and scalability. Our taxonomy of data management, inspired by Flynn\u0027s classification, highlights how SDLA addresses challenges in modern AI computing. Maia 200 achieves significant cost and energy savings while supporting massive parallelism for AI inference workloads, making it a compelling solution for next-generation high-performance computing systems.", "arxiv_id": "2608.24664", "arxiv_url": "https://arxiv.org/abs/2608.24664", "authors": ["Sherry Xu", "Marco Heddes", "Jackson Peng", "Tom Savell", "Monica Tang", "Prashant Ranjan", "Jesse Benson", "Ofer Dekel", "Saurabh Dighe", "Anupama Kurpad", "Artour Levin", "Matthew Mattina", "George Petre", "Cheng Tang", "Yuan Yu", "Li Zhang", "Torsten Hoefler"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u4e86 Maia 200 \u5927\u89c4\u6a21 AI \u52a0\u901f\u5668\u53ca\u5176\u8f6f\u4ef6\u5b9a\u4e49\u672c\u5730\u8bbf\u95ee\u6570\u636e\u6d41\u67b6\u6784\uff08SDLA\uff09\u3002\u5b83\u901a\u8fc7\u663e\u5f0f\u7f16\u7a0b\u6570\u636e\u6d41\u5f15\u64ce\u3001\u4e13\u7528\u5b58\u50a8\u548c\u6570\u636e\u642c\u8fd0\u5355\u5143\uff0c\u5c06\u8ba1\u7b97\u67b6\u6784\u91cd\u5fc3\u4ece\u7ebf\u7a0b\u8c03\u5ea6\u8f6c\u5411\u6570\u636e\u79fb\u52a8\u4f18\u5316\u3002", "categories": ["cs.AR", "cs.AI", "cs.DC", "cs.ET", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24664", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Maia 200 \u5728 750W TDP \u4e0b\u63d0\u4f9b 10145 Tflop/s FP4\u30015072 Tflop/s FP8 \u6027\u80fd\uff0c\u5e76\u914d\u5907 7 TB/s HBM \u5e26\u5bbd", "\u63d0\u51fa SDLA \u67b6\u6784\u8303\u5f0f\uff0c\u901a\u8fc7\u8f6f\u4ef6\u663e\u5f0f\u7f16\u6392\u6570\u636e\u6d41\u3001\u5c40\u90e8\u5b58\u50a8\u548c\u6570\u636e\u79fb\u52a8\u5f15\u64ce\uff0c\u63d0\u5347 AI \u63a8\u7406\u6548\u7387", "\u57fa\u4e8e\u7c7b\u4f3c Flynn \u5206\u7c7b\u6cd5\u7684\u6570\u636e\u7ba1\u7406 taxonomy\uff0c\u7cfb\u7edf\u5206\u6790\u73b0\u4ee3 AI \u8ba1\u7b97\u4e2d\u7684\u6570\u636e\u642c\u8fd0\u74f6\u9888"], "keywords": ["AI\u52a0\u901f\u5668", "\u6570\u636e\u6d41\u67b6\u6784", "\u63a8\u7406\u52a0\u901f", "\u9ad8\u6027\u80fd\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24664v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Maia 200: A Software Defined Dataflow System for Large-scale AI Acceleration", "tldr": "Maia 200\u4ee5\u8f6f\u4ef6\u5b9a\u4e49\u6570\u636e\u6d41\u52a0\u901fAI\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd\u4e86 Maia 200 \u5927\u89c4\u6a21 AI \u52a0\u901f\u5668\u53ca\u5176\u8f6f\u4ef6\u5b9a\u4e49\u672c\u5730\u8bbf\u95ee\u6570\u636e\u6d41\u67b6\u6784\uff08SDLA\uff09\u3002\u5b83\u901a\u8fc7\u663e\u5f0f\u7f16\u7a0b\u6570\u636e\u6d41\u5f15\u64ce\u3001\u4e13\u7528\u5b58\u50a8\u548c\u6570\u636e\u642c\u8fd0\u5355\u5143\uff0c\u5c06\u8ba1\u7b97\u67b6\u6784\u91cd\u5fc3\u4ece\u7ebf\u7a0b\u8c03\u5ea6\u8f6c\u5411\u6570\u636e\u79fb\u52a8\u4f18\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u9762\u5411\u5927\u89c4\u6a21 AI \u63a8\u7406\u7684\u786c\u4ef6\u67b6\u6784\u65b0\u65b9\u5411\uff1a\u4e0d\u518d\u4ee5\u901a\u7528\u7ebf\u7a0b\u5e76\u884c\u4e3a\u6838\u5fc3\uff0c\u800c\u662f\u56f4\u7ed5\u6570\u636e\u79fb\u52a8\u548c\u5c40\u90e8\u6027\u8fdb\u884c\u8f6f\u786c\u4ef6\u534f\u540c\u8bbe\u8ba1\uff0c\u5bf9\u964d\u4f4e\u63a8\u7406\u6210\u672c\u3001\u80fd\u8017\u548c\u63d0\u5347\u53ef\u6269\u5c55\u6027\u5177\u6709\u91cd\u8981\u5de5\u7a0b\u4ef7\u503c\u3002"}, {"abstract": "Scaling test-time reasoning has substantially improved the problem-solving ability of large language models (LLMs), but standard autoregressive decoding still executes long reasoning traces sequentially, creating severe latency for difficult tasks (up to days and weeks). Parallel reasoning offers a natural remedy. However, prior systems primarily focus on Subtask Parallelism, where the model learns to decompose a high-level task into smaller chunks that can be solved independently. This approach overlooks another pervasive form of parallelism: Trial Parallelism, where multiple speculative attempts explore, verify, and aggregate competing hypotheses in parallel. In this paper, we introduce Parason, which reveals and learns both forms of parallelism in LLM reasoning. Our analysis identifies Trial Parallelism as the majority of parallelizable reasoning computation (65.5% in DeepSeek-V4\u0027s reasoning steps in HLE), and it becomes increasingly dominant on hard problems. Guided by this taxonomy, Parason converts sequential reasoning traces into structured parallel trajectories with a context-free grammar, then trains models with Parallelism-Aware Group Relative Policy Optimization (PA-GRPO), whose reward jointly balances accuracy, latency, and the two parallelism ratios. At inference time, Parason executes the learned parallel structure through tool calls, translating theoretical savings to real-world wall-clock acceleration. Experiments on mathematical reasoning benchmarks including AIME24 and AIME25 show that Parason achieves an average acceleration about 1.7$\\times$ while maintaining competitive accuracy.", "arxiv_id": "2608.24658", "arxiv_url": "https://arxiv.org/abs/2608.24658", "authors": ["Zhengyang Zhang", "Zijian Zhang", "Jiaxuan Gao", "Shusheng Xu", "Yi Wu", "Song Han", "Ligeng Zhu"], "brief": "\u8bba\u6587\u63d0\u51fa Parason\uff0c\u7528\u4e8e\u8bc6\u522b\u5e76\u5b66\u4e60 LLM \u63a8\u7406\u4e2d\u7684\u4e24\u7c7b\u5e76\u884c\u6027\uff1a\u5b50\u4efb\u52a1\u5e76\u884c\u4e0e\u8bd5\u9a8c\u5e76\u884c\u3002\u5b83\u5c06\u987a\u5e8f\u63a8\u7406\u8f68\u8ff9\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u5e76\u884c\u8f68\u8ff9\uff0c\u5e76\u901a\u8fc7\u5e76\u884c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6a21\u578b\u5728\u4fdd\u6301\u51c6\u786e\u7387\u7684\u540c\u65f6\u964d\u4f4e\u5ef6\u8fdf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24658", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u9664\u5b50\u4efb\u52a1\u5e76\u884c\u5916\uff0c\u8bd5\u9a8c\u5e76\u884c\u662f\u66f4\u4e3b\u8981\u7684\u53ef\u5e76\u884c\u63a8\u7406\u8ba1\u7b97\u6765\u6e90\uff0c\u5728 HLE \u4e0a\u5360 DeepSeek-V4 \u63a8\u7406\u6b65\u9aa4\u7684 65.5%", "\u4f7f\u7528\u4e0a\u4e0b\u6587\u65e0\u5173\u6587\u6cd5\u5c06\u987a\u5e8f\u63a8\u7406\u8f68\u8ff9\u8f6c\u4e3a\u53ef\u6267\u884c\u7684\u5e76\u884c\u7ed3\u6784", "\u63d0\u51fa PA-GRPO \u5956\u52b1\u673a\u5236\uff0c\u540c\u65f6\u4f18\u5316\u51c6\u786e\u7387\u3001\u5ef6\u8fdf\u3001\u5b50\u4efb\u52a1\u5e76\u884c\u7387\u548c\u8bd5\u9a8c\u5e76\u884c\u7387"], "keywords": ["\u63a8\u7406\u52a0\u901f", "\u5f3a\u5316\u5b66\u4e60", "\u5e76\u884c\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24658v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Parason: Revealing Subtask and Trial Parallelism in LLM Reasoning", "tldr": "Parason\u8ba9LLM\u63a8\u7406\u5e76\u884c\u63d0\u901f\u7ea61.7\u500d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Parason\uff0c\u7528\u4e8e\u8bc6\u522b\u5e76\u5b66\u4e60 LLM \u63a8\u7406\u4e2d\u7684\u4e24\u7c7b\u5e76\u884c\u6027\uff1a\u5b50\u4efb\u52a1\u5e76\u884c\u4e0e\u8bd5\u9a8c\u5e76\u884c\u3002\u5b83\u5c06\u987a\u5e8f\u63a8\u7406\u8f68\u8ff9\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u5e76\u884c\u8f68\u8ff9\uff0c\u5e76\u901a\u8fc7\u5e76\u884c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6a21\u578b\u5728\u4fdd\u6301\u51c6\u786e\u7387\u7684\u540c\u65f6\u964d\u4f4e\u5ef6\u8fdf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6d4b\u8bd5\u65f6\u957f\u94fe\u63a8\u7406\u7684\u74f6\u9888\u4ece\u201c\u7b97\u5f97\u66f4\u591a\u201d\u63a8\u8fdb\u5230\u201c\u5e76\u884c\u7b97\u5f97\u66f4\u5feb\u201d\uff0c\u4e3a\u964d\u4f4e\u590d\u6742\u63a8\u7406\u4efb\u52a1\u7684\u5b9e\u9645\u5899\u949f\u5ef6\u8fdf\u63d0\u4f9b\u4e86\u53ef\u8bad\u7ec3\u3001\u53ef\u6267\u884c\u7684\u6846\u67b6\u3002"}, {"abstract": "We uncover ELR collapse in language model pretraining: learning rate (LR) and parameter norm govern loss dynamics primarily through their ratio, the effective learning rate (ELR). When ELR is matched across runs, their loss trajectories collapse throughout training despite substantially different LRs and parameter norms. Across optimizers, architectures, datasets, and model scales, mean collapse errors are typically a few x 10^-3, below the seed-to-seed variation measured in a representative configuration. Systematic ablations identify normalization design and the timescale of LR-norm variation as key determinants of collapse precision. Controlled interventions further show that weight decay and Hyperball shape loss dynamics primarily through the ELR schedules they induce. Replacing LR with ELR enables a fitted functional scaling law (FSL) to transfer across norm-control methods. The resulting ELR-based FSL also explains delayed acceleration, a recurring effect of norm control. Together, these results establish ELR as a common coordinate linking LR scheduling, norm control, and loss dynamics.", "arxiv_id": "2608.24814", "arxiv_url": "https://arxiv.org/abs/2608.24814", "authors": ["Zihan Liu", "Ruiheng Zheng", "Shaobo Zhang", "Changxin Tian", "Kunlong Chen", "Zhiqiang Zhang", "Lei Wu"], "brief": "\u8bba\u6587\u53d1\u73b0\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u5b58\u5728\u201c\u6709\u6548\u5b66\u4e60\u7387\u201d\uff08ELR\uff09\u584c\u7f29\u73b0\u8c61\uff1a\u5b66\u4e60\u7387\u4e0e\u53c2\u6570\u8303\u6570\u4e3b\u8981\u901a\u8fc7\u4e8c\u8005\u6bd4\u503c\u5f71\u54cd\u635f\u5931\u8f68\u8ff9\u3002\u53ea\u8981\u4e0d\u540c\u8bad\u7ec3\u8fd0\u884c\u7684 ELR \u5339\u914d\uff0c\u5373\u4f7f\u539f\u59cb\u5b66\u4e60\u7387\u548c\u53c2\u6570\u8303\u6570\u5dee\u5f02\u5f88\u5927\uff0c\u635f\u5931\u66f2\u7ebf\u4e5f\u4f1a\u9ad8\u5ea6\u4e00\u81f4\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24814", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728\u4e0d\u540c\u4f18\u5316\u5668\u3001\u67b6\u6784\u3001\u6570\u636e\u96c6\u548c\u6a21\u578b\u89c4\u6a21\u4e0a\uff0cELR \u5339\u914d\u540e\u7684\u635f\u5931\u8f68\u8ff9\u5e73\u5747\u584c\u7f29\u8bef\u5dee\u901a\u5e38\u4ec5\u4e3a\u51e0\u5343\u5206\u4e4b\u4e00\uff0c\u4f4e\u4e8e\u4ee3\u8868\u6027\u914d\u7f6e\u4e2d\u7684\u968f\u673a\u79cd\u5b50\u5dee\u5f02\u3002", "\u7cfb\u7edf\u6d88\u878d\u8868\u660e\uff0c\u5f52\u4e00\u5316\u8bbe\u8ba1\u4ee5\u53ca\u5b66\u4e60\u7387/\u53c2\u6570\u8303\u6570\u53d8\u5316\u7684\u65f6\u95f4\u5c3a\u5ea6\uff0c\u662f\u51b3\u5b9a\u584c\u7f29\u7cbe\u5ea6\u7684\u5173\u952e\u56e0\u7d20\u3002", "\u6743\u91cd\u8870\u51cf\u548c Hyperball \u7b49\u8303\u6570\u63a7\u5236\u65b9\u6cd5\u4e3b\u8981\u901a\u8fc7\u8bf1\u5bfc\u4e0d\u540c ELR \u8c03\u5ea6\u6765\u5851\u9020\u635f\u5931\u52a8\u6001\uff0c\u57fa\u4e8e ELR \u7684\u51fd\u6570\u7f29\u653e\u5f8b\u53ef\u8de8\u8303\u6570\u63a7\u5236\u65b9\u6cd5\u8fc1\u79fb\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u4f18\u5316", "\u7f29\u653e\u5f8b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24814v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Effective Learning Rate Governs Loss Dynamics in Language Model Pretraining", "tldr": "\u6709\u6548\u5b66\u4e60\u7387\u4e3b\u5bfc\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u635f\u5931\u52a8\u6001", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u5b58\u5728\u201c\u6709\u6548\u5b66\u4e60\u7387\u201d\uff08ELR\uff09\u584c\u7f29\u73b0\u8c61\uff1a\u5b66\u4e60\u7387\u4e0e\u53c2\u6570\u8303\u6570\u4e3b\u8981\u901a\u8fc7\u4e8c\u8005\u6bd4\u503c\u5f71\u54cd\u635f\u5931\u8f68\u8ff9\u3002\u53ea\u8981\u4e0d\u540c\u8bad\u7ec3\u8fd0\u884c\u7684 ELR \u5339\u914d\uff0c\u5373\u4f7f\u539f\u59cb\u5b66\u4e60\u7387\u548c\u53c2\u6570\u8303\u6570\u5dee\u5f02\u5f88\u5927\uff0c\u635f\u5931\u66f2\u7ebf\u4e5f\u4f1a\u9ad8\u5ea6\u4e00\u81f4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5b66\u4e60\u7387\u8c03\u5ea6\u3001\u53c2\u6570\u8303\u6570\u63a7\u5236\u548c\u635f\u5931\u7f29\u653e\u89c4\u5f8b\u7edf\u4e00\u5230 ELR \u8fd9\u4e00\u5750\u6807\u4e0b\uff0c\u6709\u52a9\u4e8e\u66f4\u7a33\u5b9a\u5730\u89e3\u91ca\u548c\u8bbe\u8ba1\u8bed\u8a00\u6a21\u578b\u9884\u8bad\u7ec3\u7b56\u7565\uff0c\u5e76\u63d0\u5347\u7f29\u653e\u5f8b\u5728\u4e0d\u540c\u8bad\u7ec3\u65b9\u6cd5\u95f4\u7684\u53ef\u8fc1\u79fb\u6027\u3002"}, {"abstract": "Large Language Model (LLM) agents increasingly solve long-horizon tasks through multi-turn interactions with users and external tools. In these settings, relevant task information often unfolds over time rather than being fully specified at the initial prompt. Service agents make this challenge especially concrete: users may clarify or revise their goals, while tool responses provide information needed for subsequent decisions. Thus, a final reward alone cannot indicate which actions contributed to resolving the task. Recent methods rely on comparative evidence from other trajectories or resampled continuations, or on separately constructed step-level learning signals, to refine credit. However, a completed rollout already records how information and errors flow between agent actions. We introduce Influence-Aware Policy Optimization (IAPO), which represents each rollout as a typed influence-dependency graph over trainable agent actions, with user and tool observations serving as evidence. IAPO converts support-use and failed-use structure into routing weights that redistribute the same trajectory-level advantage. Experiments with Qwen3-4B and Qwen3-8B demonstrate superior performance over multi-turn reinforcement learning (RL) baselines across three service-agent benchmarks: {\u03c4^2}-Bench, UserBench, and AgentChangeBench. BFCL-v4 Multi-Turn further shows that these gains do not compromise multi-turn function-calling performance. This work advances the understanding of credit assignment in multi-turn user interactions and provides a principled approach to training service agents from sparse outcome feedback.", "arxiv_id": "2608.24588", "arxiv_url": "https://arxiv.org/abs/2608.24588", "authors": ["Bo Ren", "Yirong Mao", "Yi Yang", "Wenhui Que"], "brief": "\u8bba\u6587\u63d0\u51fa Influence-Aware Policy Optimization\uff08IAPO\uff09\uff0c\u5c06\u4e00\u6b21\u591a\u8f6e\u4ea4\u4e92\u8f68\u8ff9\u8868\u793a\u4e3a\u5e26\u7c7b\u578b\u7684\u5f71\u54cd-\u4f9d\u8d56\u56fe\uff0c\u7528\u7528\u6237\u4e0e\u5de5\u5177\u53cd\u9988\u4f5c\u4e3a\u8bc1\u636e\u3002\u5b83\u628a\u652f\u6301\u4e0e\u5931\u8d25\u4f7f\u7528\u5173\u7cfb\u8f6c\u5316\u4e3a\u8def\u7531\u6743\u91cd\uff0c\u5728\u4e0d\u989d\u5916\u6784\u9020\u9010\u6b65\u5956\u52b1\u7684\u60c5\u51b5\u4e0b\u91cd\u5206\u914d\u8f68\u8ff9\u7ea7\u4f18\u52bf\u4fe1\u53f7\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24588", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u9762\u5411\u591a\u8f6e\u670d\u52a1\u667a\u80fd\u4f53\u4e2d\u7a00\u758f\u6700\u7ec8\u5956\u52b1\u96be\u4ee5\u5224\u65ad\u5404\u6b65\u8d21\u732e\u7684\u4fe1\u7528\u5206\u914d\u95ee\u9898", "\u5229\u7528\u5df2\u5b8c\u6210 rollout \u5185\u90e8\u7684\u4fe1\u606f\u6d41\u4e0e\u9519\u8bef\u4f20\u64ad\u7ed3\u6784\uff0c\u6784\u5efa\u52a8\u4f5c\u95f4\u5f71\u54cd\u4f9d\u8d56\u56fe", "\u5728 \u03c4^2-Bench\u3001UserBench\u3001AgentChangeBench \u4e0a\u4f18\u4e8e\u591a\u8f6e RL \u57fa\u7ebf\uff0c\u5e76\u5728 BFCL-v4 Multi-Turn \u4e0a\u4fdd\u6301\u51fd\u6570\u8c03\u7528\u80fd\u529b"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24588v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "IAPO: Influence-Aware Policy Optimization for Credit Assignment in Multi-Turn Service Agents", "tldr": "\u7528\u5f71\u54cd\u4f9d\u8d56\u56fe\u6539\u8fdb\u591a\u8f6e\u670d\u52a1\u667a\u80fd\u4f53\u5f52\u56e0", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Influence-Aware Policy Optimization\uff08IAPO\uff09\uff0c\u5c06\u4e00\u6b21\u591a\u8f6e\u4ea4\u4e92\u8f68\u8ff9\u8868\u793a\u4e3a\u5e26\u7c7b\u578b\u7684\u5f71\u54cd-\u4f9d\u8d56\u56fe\uff0c\u7528\u7528\u6237\u4e0e\u5de5\u5177\u53cd\u9988\u4f5c\u4e3a\u8bc1\u636e\u3002\u5b83\u628a\u652f\u6301\u4e0e\u5931\u8d25\u4f7f\u7528\u5173\u7cfb\u8f6c\u5316\u4e3a\u8def\u7531\u6743\u91cd\uff0c\u5728\u4e0d\u989d\u5916\u6784\u9020\u9010\u6b65\u5956\u52b1\u7684\u60c5\u51b5\u4e0b\u91cd\u5206\u914d\u8f68\u8ff9\u7ea7\u4f18\u52bf\u4fe1\u53f7\u3002", "why_notable": "IAPO\u4e0d\u4f9d\u8d56\u989d\u5916\u91c7\u6837\u8f68\u8ff9\u6216\u4eba\u5de5\u6784\u9020\u9010\u6b65\u76d1\u7763\uff0c\u800c\u662f\u4ece\u5355\u6761\u8f68\u8ff9\u5185\u90e8\u6316\u6398\u56e0\u679c\u5f0f\u5f71\u54cd\u7ed3\u6784\u6765\u5206\u914d\u5956\u52b1\uff0c\u5bf9\u8bad\u7ec3\u957f\u7a0b\u3001\u591a\u8f6e\u3001\u5de5\u5177\u4f7f\u7528\u578b\u670d\u52a1\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generative and predictive artificial intelligence models are increasingly used to generate geometry and to predict physical fields and scalar quantities in engineering design and simulation. Yet these models are typically evaluated in isolation, on academic datasets at unconstrained scales, with inconsistent metrics and procedures. We present PhysicsBench, a unified benchmark and leaderboard that evaluates generative and predictive models under one standardized procedure. PhysicsBench spans seven generation and prediction tasks across 1D, 2D, and 3D domains and ranks 66 models on nine datasets, comprising industrial-scale CAD/CFD/FEA simulations and public references, expanded into 28 configurations. One procedure and ranking apply to both families, each ranked within its own tasks. Evaluation spans realistic, limited data scales from S to XL rather than the unlimited training sets common in academic benchmarks. A common metric suite captures geometric fidelity with distributional distances, physical-field and scalar accuracy, and engineering-specific field- and shape-validity. BenchRank debiases correlated metrics and ranks by PageRank over a head-to-head dominance graph, so every reported quality metric is also ranked, with computational cost in a separate efficiency view. Across tasks, an architecture\u0027s large-scale academic standing weakly predicts its small-data ranking. The top model changes with data scale in six of the seven tasks, and no model leads more than one task. PhysicsBench turns \"state-of-the-art\" from a self-reported claim into an openly published foundation for model selection.", "arxiv_id": "2608.24056", "arxiv_url": "https://arxiv.org/abs/2608.24056", "authors": ["Sang Won Lee", "Hyogu Jeong", "Namwoo Kang"], "brief": "\u8bba\u6587\u63d0\u51fa PhysicsBench\uff0c\u4e00\u4e2a\u9762\u5411\u5de5\u7a0b\u8bbe\u8ba1\u4e0e\u4eff\u771f\u7684\u7edf\u4e00\u57fa\u51c6\u548c\u516c\u5f00\u6392\u884c\u699c\uff0c\u7528\u540c\u4e00\u5957\u6d41\u7a0b\u8bc4\u4f30\u51e0\u4f55\u751f\u6210\u6a21\u578b\u4e0e\u7269\u7406\u573a/\u6807\u91cf\u9884\u6d4b\u6a21\u578b\u3002\u5b83\u8986\u76d6 1D/2D/3D \u7684 7 \u7c7b\u4efb\u52a1\u30019 \u4e2a\u6570\u636e\u96c6\u300128 \u79cd\u914d\u7f6e\uff0c\u5e76\u8bc4\u6d4b\u4e86 66 \u4e2a\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24056", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7eb3\u5165\u5de5\u4e1a\u89c4\u6a21 CAD/CFD/FEA \u4eff\u771f\u4e0e\u516c\u5f00\u6570\u636e\uff0c\u5f3a\u8c03\u73b0\u5b9e\u4e2d\u7684\u6709\u9650\u6570\u636e\u89c4\u6a21 S \u5230 XL\uff0c\u800c\u975e\u65e0\u9650\u8bad\u7ec3\u6570\u636e\u8bbe\u5b9a\u3002", "\u7edf\u4e00\u6307\u6807\u4f53\u7cfb\u540c\u65f6\u8861\u91cf\u51e0\u4f55\u5206\u5e03\u4fdd\u771f\u5ea6\u3001\u7269\u7406\u573a\u4e0e\u6807\u91cf\u9884\u6d4b\u7cbe\u5ea6\uff0c\u4ee5\u53ca\u5de5\u7a0b\u573a\u666f\u4e2d\u7684\u5f62\u72b6/\u7269\u7406\u6709\u6548\u6027\u3002", "\u63d0\u51fa BenchRank\uff1a\u901a\u8fc7\u53bb\u9664\u76f8\u5173\u6307\u6807\u504f\u5dee\uff0c\u5e76\u57fa\u4e8e\u6a21\u578b\u4e24\u4e24\u4f18\u52bf\u56fe\u7684 PageRank \u8fdb\u884c\u7efc\u5408\u6392\u540d\uff0c\u8ba1\u7b97\u6210\u672c\u5355\u72ec\u5c55\u793a\u3002"], "keywords": ["\u79d1\u5b66\u673a\u5668\u5b66\u4e60", "\u5de5\u7a0b\u4eff\u771f", "\u751f\u6210\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24056v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PhysicsBench: A Unified Leaderboard for Generative and Predictive Models in Engineering Design and Simulation", "tldr": "\u7edf\u4e00\u8bc4\u6d4b\u5de5\u7a0b\u751f\u6210\u4e0e\u9884\u6d4b\u6a21\u578b\u7684\u57fa\u51c6\u699c\u5355\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PhysicsBench\uff0c\u4e00\u4e2a\u9762\u5411\u5de5\u7a0b\u8bbe\u8ba1\u4e0e\u4eff\u771f\u7684\u7edf\u4e00\u57fa\u51c6\u548c\u516c\u5f00\u6392\u884c\u699c\uff0c\u7528\u540c\u4e00\u5957\u6d41\u7a0b\u8bc4\u4f30\u51e0\u4f55\u751f\u6210\u6a21\u578b\u4e0e\u7269\u7406\u573a/\u6807\u91cf\u9884\u6d4b\u6a21\u578b\u3002\u5b83\u8986\u76d6 1D/2D/3D \u7684 7 \u7c7b\u4efb\u52a1\u30019 \u4e2a\u6570\u636e\u96c6\u300128 \u79cd\u914d\u7f6e\uff0c\u5e76\u8bc4\u6d4b\u4e86 66 \u4e2a\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5de5\u7a0b\u4eff\u771f AI \u7684\u201c\u6700\u5148\u8fdb\u201d\u4ece\u96f6\u6563\u81ea\u62a5\u8f6c\u4e3a\u6807\u51c6\u5316\u3001\u53ef\u590d\u73b0\u3001\u516c\u5f00\u6392\u540d\uff1b\u540c\u65f6\u53d1\u73b0\u5b66\u672f\u5927\u89c4\u6a21\u699c\u5355\u8868\u73b0\u96be\u4ee5\u9884\u6d4b\u5c0f\u6570\u636e\u5de5\u7a0b\u573a\u666f\u8868\u73b0\uff0c\u4e14\u6700\u4f18\u6a21\u578b\u968f\u4efb\u52a1\u548c\u6570\u636e\u89c4\u6a21\u663e\u8457\u53d8\u5316\uff0c\u5bf9\u5b9e\u9645\u6a21\u578b\u9009\u62e9\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "Can language models be trusted in safety- critical operations? In such settings, strong per- formance on semantic metrics does not guaran- tee operational reliability: a misread altitude, a dropped execution condition, or a confused call- sign may score well under standard F1 yet carry sharply asymmetric operational consequences. We study this problem in air traffic control (ATC), where controller-pilot communication demands near-zero error tolerance, and use consequence-aware evaluation to test whether semantic scores misstate operational reliabil- ity. The framework is instantiated in a con- trolled diagnostic ATC benchmark grounded in aviation standards and feedback from 40 air traffic controllers across three countries. Evaluating 8 models, we uncover a system- atic semantic-safety gap: conventional scores give substantially higher performance estimates than consequence-aware evaluation, even for models that appear reliable under standard met- rics. Risk-aware fine-tuning narrows but does not close this gap, showing that consequence- aware evaluation is a necessary complement to standard NLP metrics before any real safety- critical deployment claim", "arxiv_id": "2608.24621", "arxiv_url": "https://arxiv.org/abs/2608.24621", "authors": ["Yujing Chang", "Thinh Pham", "Van-Phat Thai", "Chunyao Ma", "Yash Guleria", "Pham Nhut Huy", "Sameer Alam"], "brief": "\u672c\u6587\u5728\u7a7a\u4e2d\u4ea4\u901a\u7ba1\u5236\u901a\u4fe1\u573a\u666f\u4e2d\u63d0\u51fa\u5e76\u9a8c\u8bc1\u201c\u540e\u679c\u611f\u77e5\u8bc4\u4f30\u201d\uff0c\u7528\u4e8e\u8861\u91cf\u8bed\u8a00\u6a21\u578b\u8bef\u89e3\u6307\u4ee4\u53ef\u80fd\u5e26\u6765\u7684\u5b9e\u9645\u8fd0\u884c\u98ce\u9669\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u57fa\u4e8e\u822a\u7a7a\u6807\u51c6\u4e0e40\u540d\u7ba1\u5236\u5458\u53cd\u9988\u7684\u8bca\u65ad\u57fa\u51c6\uff0c\u5e76\u8bc4\u4f30\u4e868\u4e2a\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24621", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u7cfb\u7edf\u6027\u7684\u201c\u8bed\u4e49-\u5b89\u5168\u5dee\u8ddd\u201d\uff1a\u4f20\u7edfF1\u7b49\u8bed\u4e49\u6307\u6807\u4f1a\u663e\u8457\u9ad8\u4f30\u6a21\u578b\u5728\u5b89\u5168\u5173\u952e\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u3002", "\u57fa\u51c6\u805a\u7126ATC\u4e2d\u7684\u9ad8\u98ce\u9669\u9519\u8bef\uff0c\u5982\u9ad8\u5ea6\u8bef\u8bfb\u3001\u6267\u884c\u6761\u4ef6\u9057\u6f0f\u3001\u547c\u53f7\u6df7\u6dc6\u7b49\uff0c\u8fd9\u4e9b\u9519\u8bef\u5728\u8bed\u4e49\u5206\u6570\u4e2d\u53ef\u80fd\u60e9\u7f5a\u4e0d\u8db3\u3002", "\u98ce\u9669\u611f\u77e5\u5fae\u8c03\u53ef\u4ee5\u7f29\u5c0f\u5dee\u8ddd\uff0c\u4f46\u4ecd\u65e0\u6cd5\u5b8c\u5168\u6d88\u9664\uff0c\u8bf4\u660e\u90e8\u7f72\u524d\u5fc5\u987b\u5f15\u5165\u540e\u679c\u611f\u77e5\u8bc4\u4f30\u3002"], "keywords": ["\u5b89\u5168\u8bc4\u4f30", "\u8bed\u8a00\u7406\u89e3", "\u53ef\u9760\u6027", "\u98ce\u9669\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24621v1", "published_at": "2026-08-25", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Semantic Accuracy: Consequence-Aware Evaluation for Safety-Critical Language Understanding", "tldr": "\u8bed\u4e49\u9ad8\u5206\u4e0d\u7b49\u4e8e\u5b89\u5168\u5173\u952e\u573a\u666f\u53ef\u9760\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u5728\u7a7a\u4e2d\u4ea4\u901a\u7ba1\u5236\u901a\u4fe1\u573a\u666f\u4e2d\u63d0\u51fa\u5e76\u9a8c\u8bc1\u201c\u540e\u679c\u611f\u77e5\u8bc4\u4f30\u201d\uff0c\u7528\u4e8e\u8861\u91cf\u8bed\u8a00\u6a21\u578b\u8bef\u89e3\u6307\u4ee4\u53ef\u80fd\u5e26\u6765\u7684\u5b9e\u9645\u8fd0\u884c\u98ce\u9669\u3002\u4f5c\u8005\u6784\u5efa\u4e86\u57fa\u4e8e\u822a\u7a7a\u6807\u51c6\u4e0e40\u540d\u7ba1\u5236\u5458\u53cd\u9988\u7684\u8bca\u65ad\u57fa\u51c6\uff0c\u5e76\u8bc4\u4f30\u4e868\u4e2a\u6a21\u578b\u3002", "why_notable": "\u8bba\u6587\u6307\u51fa\u6807\u51c6NLP\u6307\u6807\u5728\u5b89\u5168\u5173\u952e\u90e8\u7f72\u4e2d\u7684\u6839\u672c\u5c40\u9650\uff0c\u5e76\u7ed9\u51fa\u8d34\u8fd1\u771f\u5b9e\u822a\u7a7a\u573a\u666f\u7684\u8bc4\u4f30\u6846\u67b6\uff0c\u5bf9\u533b\u7597\u3001\u822a\u7a7a\u3001\u5de5\u4e1a\u63a7\u5236\u7b49\u9ad8\u98ce\u9669\u8bed\u8a00\u7406\u89e3\u5e94\u7528\u5177\u6709\u65b9\u6cd5\u8bba\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) and on-policy distillation (OPD) have become two widely adopted paradigms for post-training large language models. However, RLVR suffers from sparse task-level feedback, while OPD provides dense token-level guidance but ignores trajectory correctness, limiting its performance to that of the teacher. Combining them is a promising direction: OPD supplies dense supervisory signals, while RLVR provides task-level correctness. Nevertheless, existing integrations often rely on weighted combination or heuristic switching, introducing extra hyperparameters and trade-offs. We propose On-policy Distillation with Verifiable Reward (OPDVR), a simple yet effective method that seamlessly combines OPD and RLVR without adding any hyperparameters. We first reformulate the implicit reward of sampled-token OPD based on trajectory correctness, then apply a ReLU gating mechanism to ensure that correct trajectories receive non-negative rewards and incorrect ones receive non-positive rewards---thereby aligning the distillation signal with task su
