ccess while preserving the teacher\u0027s distributional guidance. Furthermore, our modification transforms sampled-token OPD into a proper RLVR method, making it readily combinable with any policy gradient algorithm, such as GRPO. Experiments on six reasoning benchmarks show that OPDVR consistently outperforms standard OPD. Our code is available at https://github.com/LeapLabTHU/OPDVR.", "arxiv_id": "2608.24696", "arxiv_url": "https://arxiv.org/abs/2608.24696", "authors": ["Wenze Lin", "Jiale Zhao", "Xitai Jiang", "Songde Rao", "Yining Li", "Shenzhi Wang", "Bingxiang He", "Gao Huang"], "brief": "\u8bba\u6587\u63d0\u51fa OPDVR\uff0c\u5c06\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u7684\u5bc6\u96c6 token \u7ea7\u6307\u5bfc\u4e0e\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u7684\u4efb\u52a1\u6b63\u786e\u6027\u53cd\u9988\u7edf\u4e00\u8d77\u6765\u3002\u65b9\u6cd5\u901a\u8fc7\u57fa\u4e8e\u8f68\u8ff9\u6b63\u786e\u6027\u91cd\u6784 OPD \u9690\u5f0f\u5956\u52b1\uff0c\u5e76\u7528 ReLU \u95e8\u63a7\u4f7f\u84b8\u998f\u4fe1\u53f7\u4e0e\u4efb\u52a1\u6210\u529f\u5bf9\u9f50\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/LeapLabTHU/OPDVR", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24696", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u989d\u5916\u8d85\u53c2\u6570\uff0c\u907f\u514d\u73b0\u6709\u52a0\u6743\u7ec4\u5408\u6216\u542f\u53d1\u5f0f\u5207\u6362\u5e26\u6765\u7684\u6743\u8861\u95ee\u9898", "\u5c06\u6b63\u786e\u8f68\u8ff9\u7ea6\u675f\u4e3a\u975e\u8d1f\u5956\u52b1\u3001\u9519\u8bef\u8f68\u8ff9\u7ea6\u675f\u4e3a\u975e\u6b63\u5956\u52b1\uff0c\u540c\u65f6\u4fdd\u7559\u6559\u5e08\u5206\u5e03\u6307\u5bfc", "\u628a sampled-token OPD \u8f6c\u5316\u4e3a\u89c4\u8303\u7684 RLVR \u5f62\u5f0f\uff0c\u53ef\u76f4\u63a5\u7ed3\u5408 GRPO \u7b49\u7b56\u7565\u68af\u5ea6\u7b97\u6cd5\uff0c\u5e76\u5728\u516d\u4e2a\u63a8\u7406\u57fa\u51c6\u4e0a\u4f18\u4e8e\u6807\u51c6 OPD"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24696v1", "published_at": "2026-08-25", "score": 0.193, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24696.png", "title": "On-policy Distillation with Verifiable Reward", "tldr": "\u7528\u53ef\u9a8c\u8bc1\u5956\u52b1\u6821\u6b63\u5728\u7ebf\u84b8\u998f\u8bad\u7ec3LLM", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa OPDVR\uff0c\u5c06\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u7684\u5bc6\u96c6 token \u7ea7\u6307\u5bfc\u4e0e\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u7684\u4efb\u52a1\u6b63\u786e\u6027\u53cd\u9988\u7edf\u4e00\u8d77\u6765\u3002\u65b9\u6cd5\u901a\u8fc7\u57fa\u4e8e\u8f68\u8ff9\u6b63\u786e\u6027\u91cd\u6784 OPD \u9690\u5f0f\u5956\u52b1\uff0c\u5e76\u7528 ReLU \u95e8\u63a7\u4f7f\u84b8\u998f\u4fe1\u53f7\u4e0e\u4efb\u52a1\u6210\u529f\u5bf9\u9f50\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a LLM \u540e\u8bad\u7ec3\u4e2d\u201c\u84b8\u998f\u63d0\u4f9b\u5bc6\u96c6\u76d1\u7763\u3001RLVR\u4fdd\u8bc1\u7ed3\u679c\u6b63\u786e\u201d\u7684\u7ed3\u5408\u63d0\u4f9b\u4e86\u66f4\u7b80\u6d01\u7edf\u4e00\u7684\u6846\u67b6\uff0c\u53ef\u80fd\u63d0\u5347\u63a8\u7406\u6a21\u578b\u8bad\u7ec3\u7684\u7a33\u5b9a\u6027\u4e0e\u6027\u80fd\u4e0a\u9650\u3002"}, {"abstract": "Generative models are commonly ranked by Fr\u00e9chet Inception Distance (FID) and Kernel Inception Distance (KID), yet FID\u0027s first-two-moment summary can miss distributional differences, and a reported scalar gap alone is not a calibrated test against sampling variation. FID\u0027s moment restriction has concrete consequences: on ImageNet, visually unrecognizable images optimized only to match the reference Inception mean and covariance obtain FID $24.7$ versus $58.6$ for held-out real images (lower is better). Moreover, FID and KID are scalar discrepancies that are unchanged when the two samples are exchanged and therefore do not encode the direction of a dispersion change: under-dispersion, as can occur in mode collapse, versus over-dispersion. We introduce \\textbf{ZID} (\\emph{Z-resolved Integrated Diagnostic}), which combines six standardized location- and dispersion-sensitive arms from a rank graph (RISE) and Gaussian kernels (GPK at two bandwidths). Rather than asking one scalar to serve incompatible roles, ZID reports three linked outputs: an index for ranking departure magnitude, a permutation $p$-value for testing distributional equality, and a signed dispersion readout for diagnosis. In controlled experiments, ZID detects a broad range of departures, and its score tracks increasing severity along the corresponding sweeps, including cases in which FID is flat or reversed. On DiT-XL/2 and SiT-XL/2 guidance sweeps, ZID detects departure from real data, and its signed readout labels the high-guidance diversity collapse as under-dispersion.", "arxiv_id": "2608.24881", "arxiv_url": "https://arxiv.org/abs/2608.24881", "authors": ["Hao Chen"], "brief": "\u8bba\u6587\u6307\u51faFID/KID\u4f5c\u4e3a\u5355\u4e00\u6807\u91cf\u4f1a\u9057\u6f0f\u5206\u5e03\u5dee\u5f02\uff0c\u4e14\u65e0\u6cd5\u533a\u5206\u6b20\u5206\u6563\u4e0e\u8fc7\u5206\u6563\u3002\u4f5c\u8005\u63d0\u51faZID\uff0c\u5c06\u591a\u79cd\u6807\u51c6\u5316\u7684\u4f4d\u7f6e\u4e0e\u5206\u6563\u5ea6\u8bca\u65ad\u7ed3\u5408\uff0c\u8f93\u51fa\u504f\u5dee\u6392\u540d\u3001\u7f6e\u6362\u68c0\u9a8cp\u503c\u548c\u6709\u7b26\u53f7\u5206\u6563\u8bca\u65ad\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24881", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6784\u9020\u7684\u56fe\u50cf\u53ef\u4ec5\u5339\u914dInception\u5747\u503c\u548c\u534f\u65b9\u5dee\uff0c\u5728ImageNet\u4e0aFID\u4f18\u4e8e\u771f\u5b9e\u7559\u51fa\u56fe\u50cf\uff0c\u66b4\u9732FID\u53ea\u770b\u524d\u4e24\u9636\u77e9\u7684\u7f3a\u9677", "ZID\u7ed3\u5408RISE\u79e9\u56fe\u4e0e\u4e24\u79cd\u5e26\u5bbd\u7684GPK\u9ad8\u65af\u6838\uff0c\u5171\u516d\u4e2a\u4f4d\u7f6e/\u5206\u6563\u654f\u611f\u5206\u652f", "\u5728\u53d7\u63a7\u5b9e\u9a8c\u548cDiT-XL/2\u3001SiT-XL/2 guidance sweep\u4e2d\uff0cZID\u80fd\u68c0\u6d4bFID\u5e73\u5766\u6216\u53cd\u5411\u65f6\u7684\u504f\u5dee\uff0c\u5e76\u8bc6\u522b\u9ad8guidance\u5bfc\u81f4\u7684\u6b20\u5206\u6563/\u591a\u6837\u6027\u574d\u7f29"], "keywords": ["\u751f\u6210\u6a21\u578b\u8bc4\u4f30", "\u7edf\u8ba1\u68c0\u9a8c", "\u6269\u6563\u6a21\u578b", "\u6a21\u5f0f\u574d\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24881v1", "published_at": "2026-08-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What FID Hides: Detecting, Ranking, and Diagnosing Deviations in Generative Evaluation", "tldr": "ZID\u8865\u8db3FID\u76f2\u533a\uff0c\u80fd\u68c0\u9a8c\u5e76\u8bca\u65ad\u751f\u6210\u5206\u5e03\u504f\u5dee", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51faFID/KID\u4f5c\u4e3a\u5355\u4e00\u6807\u91cf\u4f1a\u9057\u6f0f\u5206\u5e03\u5dee\u5f02\uff0c\u4e14\u65e0\u6cd5\u533a\u5206\u6b20\u5206\u6563\u4e0e\u8fc7\u5206\u6563\u3002\u4f5c\u8005\u63d0\u51faZID\uff0c\u5c06\u591a\u79cd\u6807\u51c6\u5316\u7684\u4f4d\u7f6e\u4e0e\u5206\u6563\u5ea6\u8bca\u65ad\u7ed3\u5408\uff0c\u8f93\u51fa\u504f\u5dee\u6392\u540d\u3001\u7f6e\u6362\u68c0\u9a8cp\u503c\u548c\u6709\u7b26\u53f7\u5206\u6563\u8bca\u65ad\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u751f\u6210\u6a21\u578b\u8bc4\u4f30\u63d0\u4f9b\u4e86\u6bd4FID\u66f4\u53ef\u89e3\u91ca\u3001\u66f4\u53ef\u68c0\u9a8c\u7684\u66ff\u4ee3\u65b9\u6848\uff0c\u4e0d\u4ec5\u80fd\u6392\u5e8f\u6a21\u578b\u597d\u574f\uff0c\u8fd8\u80fd\u7ed9\u51fa\u7edf\u8ba1\u663e\u8457\u6027\u4e0e\u504f\u5dee\u65b9\u5411\uff0c\u5bf9\u8bca\u65ad\u6a21\u5f0f\u574d\u7f29\u548c\u8bc4\u4f30\u6269\u6563\u6a21\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Transitioning from bespoke time series models towards time series foundation models changes the relationship of model and application from one-to-one to one-to-many. This shift introduces concentration risk as many, potentially high-risk, forecasting applications are exposed to the same biases and failure modes of a single time series foundation model. At the same time, this centralization allows for economies of scale in model development and validation. In this study we investigate how biases and failure modes of time series foundation models can be identified before deployment. We propose a causal analysis framework to investigate the ability of a time series foundation model to preserve time series patterns. To achieve this, we intervene on parameterized synthetic time series generators and measure the corresponding change in model output under ceteris paribus conditions. We apply our causal analysis framework to Chronos-2 and TimesFM-2.5 and test them across six distinct time series patterns. We find safe configurations for trend and harmonic oscillation patterns. The results also indicate a bias in both models towards overestimating persistence, sudden failures for both models against the regime switch pattern and failure for TimesFM-2.5 against the energy-release pattern. Our review of the original works for both models indicates that the findings might be explained by the data used for pretraining. We conclude our study with suggestions for further model development, recommendations for application-specific model selection, and a discussion of limitations and further research directions.", "arxiv_id": "2608.24303", "arxiv_url": "https://arxiv.org/abs/2608.24303", "authors": ["Mathis Jander", "Wouter van Heeswijk", "Martijn Mes"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u7684\u56e0\u679c\u5206\u6790\u6846\u67b6\uff0c\u901a\u8fc7\u5e72\u9884\u53c2\u6570\u5316\u5408\u6210\u65f6\u95f4\u5e8f\u5217\u751f\u6210\u5668\uff0c\u5728\u5176\u4ed6\u6761\u4ef6\u4e0d\u53d8\u4e0b\u89c2\u5bdf\u6a21\u578b\u8f93\u51fa\u53d8\u5316\uff0c\u4ee5\u8bc6\u522b\u90e8\u7f72\u524d\u7684\u504f\u5dee\u4e0e\u5931\u6548\u6a21\u5f0f\u3002\u4f5c\u8005\u5c06\u8be5\u6846\u67b6\u5e94\u7528\u4e8e Chronos-2 \u548c TimesFM-2.5\uff0c\u8bc4\u6d4b\u516d\u7c7b\u65f6\u95f4\u5e8f\u5217\u6a21\u5f0f\u7684\u4fdd\u6301\u80fd\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24303", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5bf9\u5408\u6210\u65f6\u95f4\u5e8f\u5217\u751f\u6210\u673a\u5236\u505a\u53c2\u6570\u5e72\u9884\uff0c\u6784\u9020\u8fd1\u4f3c ceteris paribus \u7684\u56e0\u679c\u8bc4\u6d4b\u73af\u5883\uff0c\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u6b63\u786e\u54cd\u5e94\u8d8b\u52bf\u3001\u8c10\u6ce2\u632f\u8361\u3001\u72b6\u6001\u5207\u6362\u7b49\u6a21\u5f0f\u53d8\u5316\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u4e24\u4e2a\u6a21\u578b\u5728\u8d8b\u52bf\u4e0e\u8c10\u6ce2\u632f\u8361\u4e0a\u5b58\u5728\u76f8\u5bf9\u5b89\u5168\u914d\u7f6e\uff0c\u4f46\u90fd\u503e\u5411\u4e8e\u9ad8\u4f30\u6301\u7eed\u6027\uff0c\u5e76\u5728 regime switch \u6a21\u5f0f\u4e0b\u51fa\u73b0\u7a81\u7136\u5931\u6548\u3002", "TimesFM-2.5 \u5728 energy-release \u6a21\u5f0f\u4e0a\u989d\u5916\u8868\u73b0\u51fa\u5931\u8d25\uff1b\u4f5c\u8005\u63a8\u6d4b\u8fd9\u4e9b\u504f\u5dee\u53ef\u80fd\u4e0e\u9884\u8bad\u7ec3\u6570\u636e\u5206\u5e03\u6709\u5173\u3002"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u57fa\u7840\u6a21\u578b", "\u56e0\u679c\u5206\u6790", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24303v1", "published_at": "2026-08-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Causal Analysis for Time Series Foundation Models", "tldr": "\u7528\u56e0\u679c\u5e72\u9884\u8bc4\u6d4b\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u504f\u5dee", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u7684\u56e0\u679c\u5206\u6790\u6846\u67b6\uff0c\u901a\u8fc7\u5e72\u9884\u53c2\u6570\u5316\u5408\u6210\u65f6\u95f4\u5e8f\u5217\u751f\u6210\u5668\uff0c\u5728\u5176\u4ed6\u6761\u4ef6\u4e0d\u53d8\u4e0b\u89c2\u5bdf\u6a21\u578b\u8f93\u51fa\u53d8\u5316\uff0c\u4ee5\u8bc6\u522b\u90e8\u7f72\u524d\u7684\u504f\u5dee\u4e0e\u5931\u6548\u6a21\u5f0f\u3002\u4f5c\u8005\u5c06\u8be5\u6846\u67b6\u5e94\u7528\u4e8e Chronos-2 \u548c TimesFM-2.5\uff0c\u8bc4\u6d4b\u516d\u7c7b\u65f6\u95f4\u5e8f\u5217\u6a21\u5f0f\u7684\u4fdd\u6301\u80fd\u529b\u3002", "why_notable": "\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\u6b63\u5728\u88ab\u4e00\u5bf9\u591a\u5730\u590d\u7528\u4e8e\u5927\u91cf\u9884\u6d4b\u4efb\u52a1\uff0c\u4e00\u65e6\u5b58\u5728\u7cfb\u7edf\u6027\u504f\u5dee\u4f1a\u5e26\u6765\u96c6\u4e2d\u98ce\u9669\u3002\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u90e8\u7f72\u524d\u8bca\u65ad\u5931\u6548\u6a21\u5f0f\u7684\u53ef\u89e3\u91ca\u8bc4\u6d4b\u65b9\u6cd5\uff0c\u5bf9\u9ad8\u98ce\u9669\u9884\u6d4b\u5e94\u7528\u7684\u6a21\u578b\u9009\u62e9\u3001\u9a8c\u8bc1\u4e0e\u6cbb\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recurrent models, which repeatedly update latent states with shared computation blocks, have emerged as powerful architectures for solving complex reasoning tasks. Existing inference-time methods scale computation by running more steps or sampling more trajectories, but ignore information revealed within each trajectory. Here we show that recurrent models can be improved at inference time by using their own readout probabilities to steer latent dynamics without retraining. We introduce Readout Feedback (RoFB), a test-time intervention that converts intermediate predictions into token-wise pairwise coupling forces injected into the latent dynamics. Across three recurrent models (AKOrN, ItrSA++, TRM) on Sudoku and Maze, RoFB yields clear gains in four of six model-task pairs, achieving performance unattainable by merely running more steps or selecting from multiple trajectories, at comparable or lower computational cost. These results suggest that closed-loop steering of latent dynamics can serve as a complementary inference-time control mechanism for recurrent reasoning models.", "arxiv_id": "2608.24136", "arxiv_url": "https://arxiv.org/abs/2608.24136", "authors": ["Shunsuke Kamiya", "Masanori Koyama", "Seongcheol Jeong", "Fumiya Uchiyama", "Kenji Kubo", "Kohei Hayashi", "Masahiro Suzuki", "Yutaka Matsuo"], "brief": "\u8bba\u6587\u63d0\u51fa Readout Feedback\uff08RoFB\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u91cd\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u5e72\u9884\u65b9\u6cd5\uff0c\u5229\u7528\u5faa\u73af\u6a21\u578b\u4e2d\u95f4\u8bfb\u51fa\u6982\u7387\u53cd\u5411\u5f15\u5bfc\u6f5c\u5728\u72b6\u6001\u52a8\u6001\u3002\u5b83\u5c06\u4e2d\u95f4\u9884\u6d4b\u8f6c\u5316\u4e3a token \u95f4\u6210\u5bf9\u8026\u5408\u529b\uff0c\u6ce8\u5165\u63a8\u7406\u8fc7\u7a0b\u4ee5\u63d0\u5347\u590d\u6742\u63a8\u7406\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24136", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9762\u5411\u5faa\u73af\u63a8\u7406\u6a21\u578b\uff0c\u5728\u63a8\u7406\u65f6\u4e0d\u4ec5\u589e\u52a0\u6b65\u6570\u6216\u91c7\u6837\u8f68\u8ff9\uff0c\u800c\u662f\u5229\u7528\u5355\u6761\u8f68\u8ff9\u5185\u90e8\u66b4\u9732\u7684\u4e2d\u95f4\u9884\u6d4b\u4fe1\u606f\u8fdb\u884c\u95ed\u73af\u63a7\u5236", "RoFB \u5c06 readout probabilities \u8f6c\u6362\u4e3a token-wise pairwise coupling forces\uff0c\u76f4\u63a5\u5f71\u54cd latent dynamics\uff0c\u65e0\u9700\u4fee\u6539\u8bad\u7ec3\u6d41\u7a0b", "\u5728 AKOrN\u3001ItrSA++\u3001TRM \u4e09\u7c7b\u6a21\u578b\u53ca Sudoku\u3001Maze \u4efb\u52a1\u4e0a\u8bc4\u6d4b\uff0c6 \u4e2a\u6a21\u578b-\u4efb\u52a1\u7ec4\u5408\u4e2d\u6709 4 \u4e2a\u53d6\u5f97\u660e\u663e\u63d0\u5347\uff0c\u4e14\u8ba1\u7b97\u6210\u672c\u76f8\u5f53\u6216\u66f4\u4f4e"], "keywords": ["\u63a8\u7406\u4f18\u5316", "\u5faa\u73af\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u5f3a\u5316\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24136v1", "published_at": "2026-08-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Steering Recurrent Reasoners at Inference Time with Readout Feedback", "tldr": "\u7528\u8bfb\u51fa\u53cd\u9988\u5728\u6d4b\u8bd5\u65f6\u5f15\u5bfc\u5faa\u73af\u63a8\u7406\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Readout Feedback\uff08RoFB\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u91cd\u8bad\u7ec3\u7684\u6d4b\u8bd5\u65f6\u5e72\u9884\u65b9\u6cd5\uff0c\u5229\u7528\u5faa\u73af\u6a21\u578b\u4e2d\u95f4\u8bfb\u51fa\u6982\u7387\u53cd\u5411\u5f15\u5bfc\u6f5c\u5728\u72b6\u6001\u52a8\u6001\u3002\u5b83\u5c06\u4e2d\u95f4\u9884\u6d4b\u8f6c\u5316\u4e3a token \u95f4\u6210\u5bf9\u8026\u5408\u529b\uff0c\u6ce8\u5165\u63a8\u7406\u8fc7\u7a0b\u4ee5\u63d0\u5347\u590d\u6742\u63a8\u7406\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5faa\u73af\u63a8\u7406\u6a21\u578b\u53ef\u901a\u8fc7\u6d4b\u8bd5\u65f6\u95ed\u73af\u53cd\u9988\u83b7\u5f97\u8d85\u8d8a\u7b80\u5355\u5ef6\u957f\u63a8\u7406\u6b65\u6570\u6216\u591a\u8f68\u8ff9\u9009\u62e9\u7684\u6027\u80fd\uff0c\u4e3a\u63a8\u7406\u65f6\u63a7\u5236\u548c\u53ef\u8c03\u8282\u8ba1\u7b97\u63d0\u4f9b\u4e86\u65b0\u601d\u8def\u3002"}, {"abstract": "Latent world models plan by predicting how candidate actions transform learned representations. In self-predictive models, however, the encoder and predictor are optimized jointly and can co-adapt to latent transitions that are easy to predict but only weakly constrained by the physical evolution of the scene. We introduce the cross-predictive JEPA (XP-JEPA), which grounds visual latent dynamics in privileged physical trajectories. XP-JEPA separately encodes visual observations and physical states, advances both through a shared action-conditioned predictor, and matches each prediction to both future representations. This objective encourages unified latent dynamics across the two modalities, grounded in the underlying physical transitions. The physical branch is discarded after training, leaving a visual-only model at deployment. On a multi-task suite spanning six evaluation subfamilies, XP-JEPA reduces rollout drift of a newly fitted predictor from $0.361$ to $0.104$ and increases mean control success from $53.6\\%$ to $78.2\\%$. Direct physical-state regression raises position decodability but leaves forecastability and control near the visual-only baseline. Cross-predictive physical grounding can therefore produce more forecastable latent dynamics for rollout-based control without privileged inputs at test time.", "arxiv_id": "2608.24044", "arxiv_url": "https://arxiv.org/abs/2608.24044", "authors": ["Kehan Wen", "Ziming Li", "Siyuan Luo", "Fan Shi"], "brief": "\u8bba\u6587\u63d0\u51fa XP-JEPA\uff0c\u901a\u8fc7\u89c6\u89c9\u89c2\u6d4b\u4e0e\u7279\u6743\u7269\u7406\u72b6\u6001\u7684\u8de8\u9884\u6d4b\u8bad\u7ec3\uff0c\u8ba9\u4e24\u79cd\u6a21\u6001\u5171\u4eab\u52a8\u4f5c\u6761\u4ef6\u52a8\u529b\u5b66\u9884\u6d4b\u5668\uff0c\u4ece\u800c\u5b66\u4e60\u66f4\u7b26\u5408\u7269\u7406\u6f14\u5316\u7684\u89c6\u89c9\u6f5c\u5728\u52a8\u6001\u3002\u8bad\u7ec3\u540e\u4e22\u5f03\u7269\u7406\u5206\u652f\uff0c\u90e8\u7f72\u65f6\u4ec5\u9700\u89c6\u89c9\u8f93\u5165\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24044", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5206\u522b\u7f16\u7801\u89c6\u89c9\u89c2\u6d4b\u548c\u7269\u7406\u72b6\u6001\uff0c\u5e76\u7528\u5171\u4eab\u7684\u52a8\u4f5c\u6761\u4ef6\u9884\u6d4b\u5668\u63a8\u8fdb\u6f5c\u8868\u793a", "\u6bcf\u4e2a\u9884\u6d4b\u540c\u65f6\u5339\u914d\u672a\u6765\u89c6\u89c9\u8868\u793a\u548c\u672a\u6765\u7269\u7406\u8868\u793a\uff0c\u7ea6\u675f\u6f5c\u7a7a\u95f4\u52a8\u529b\u5b66\u4e0e\u771f\u5b9e\u7269\u7406\u8f6c\u79fb\u4e00\u81f4", "\u5728\u591a\u4efb\u52a1\u8bc4\u6d4b\u4e2d\u5c06 rollout \u6f02\u79fb\u4ece 0.361 \u964d\u81f3 0.104\uff0c\u5e73\u5747\u63a7\u5236\u6210\u529f\u7387\u4ece 53.6% \u63d0\u5347\u5230 78.2%"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u7269\u7406\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24044v1", "published_at": "2026-08-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "XP-JEPA: Cross-Predictive Physics Grounding for Forecastable Latent Dynamics", "tldr": "\u7528\u7269\u7406\u8f68\u8ff9\u5bf9\u9f50\u89c6\u89c9\u6f5c\u7a7a\u95f4\uff0c\u63d0\u5347\u53ef\u9884\u6d4b\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa XP-JEPA\uff0c\u901a\u8fc7\u89c6\u89c9\u89c2\u6d4b\u4e0e\u7279\u6743\u7269\u7406\u72b6\u6001\u7684\u8de8\u9884\u6d4b\u8bad\u7ec3\uff0c\u8ba9\u4e24\u79cd\u6a21\u6001\u5171\u4eab\u52a8\u4f5c\u6761\u4ef6\u52a8\u529b\u5b66\u9884\u6d4b\u5668\uff0c\u4ece\u800c\u5b66\u4e60\u66f4\u7b26\u5408\u7269\u7406\u6f14\u5316\u7684\u89c6\u89c9\u6f5c\u5728\u52a8\u6001\u3002\u8bad\u7ec3\u540e\u4e22\u5f03\u7269\u7406\u5206\u652f\uff0c\u90e8\u7f72\u65f6\u4ec5\u9700\u89c6\u89c9\u8f93\u5165\u3002", "why_notable": "\u5b83\u89e3\u51b3\u4e86\u81ea\u9884\u6d4b\u4e16\u754c\u6a21\u578b\u4e2d\u6f5c\u8868\u793a\u53ef\u80fd\u5b66\u5230\u201c\u6613\u9884\u6d4b\u4f46\u4e0d\u7269\u7406\u201d\u7684\u52a8\u6001\u95ee\u9898\uff0c\u5728\u4e0d\u589e\u52a0\u6d4b\u8bd5\u65f6\u7279\u6743\u8f93\u5165\u7684\u524d\u63d0\u4e0b\u663e\u8457\u63d0\u5347\u957f\u671f\u9884\u6d4b\u7a33\u5b9a\u6027\u548c\u57fa\u4e8e rollout \u7684\u63a7\u5236\u6027\u80fd\u3002"}, {"abstract": "Activation steering can change behaviour without establishing that the effect is specific to the intended concept. We introduce SteerCheck, a preregistered attribution audit that matches off-target KL and separates mean, protected-tail, polarity, transfer, and semantic claims. Exact replay of 960 Qwen3-14B interventions reveals complementary limits of common controls: isotropic directions occupy a narrow near-orthogonal region, whereas sign-randomized same-construction directions often retain substantial target alignment. Effect is strongly associated with signed cosine within the sign-randomized family ($\u03c1=.94$); $25.3\\%$ of its draws exceed cosine $.5$, and every draw exceeding the observed mean effect has cosine above $.80$. This alignment leakage does not by itself invalidate a conditional randomization test; it limits what the comparator can distinguish and motivates reporting exchangeability assumptions, a construction diagnostic $A$, and the empirical cosine distribution. The primary Qwen complete gate remains negative because the protected tail fails all families. On independent data, continuous margin transfers only in Qwen and accuracy transfers in no selected cell. Prospectively registered language controls pass the complete gate in Qwen and DeepSeek, while a passing DeepSeek detox comparator rules out categorical separation; all nominal passes are sensitive to $\u0393=1.10$. Frozen three-rater open-generation evaluation supports factual correction in DeepSeek but not Qwen; the automatic judge fails calibration (macro-F1 $.562$), so null-wide semantic results remain descriptive. SteerCheck makes these conditional and mixed conclusions auditable.", "arxiv_id": "2608.24335", "arxiv_url": "https://arxiv.org/abs/2608.24335", "authors": ["Daming Luo", "Christy Liang", "Junyu Xuan"], "brief": "\u8bba\u6587\u63d0\u51fa SteerCheck\uff0c\u4e00\u79cd\u9884\u6ce8\u518c\u7684\u6fc0\u6d3b\u8f6c\u5411\u5f52\u56e0\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u68c0\u9a8c\u884c\u4e3a\u6539\u53d8\u662f\u5426\u771f\u6b63\u6765\u81ea\u76ee\u6807\u6982\u5ff5\u800c\u975e\u6bd4\u8f83\u5668\u6216\u6784\u9020\u8fc7\u7a0b\u7684\u6cc4\u6f0f\u3002\u4f5c\u8005\u5728 Qwen3-14B\u3001DeepSeek \u7b49\u6a21\u578b\u4e0a\u590d\u73b0\u5b9e\u9a8c\uff0c\u5206\u79bb\u5747\u503c\u3001\u5c3e\u90e8\u4fdd\u62a4\u3001\u6781\u6027\u3001\u8fc1\u79fb\u4e0e\u8bed\u4e49\u5c42\u9762\u7684\u4e3b\u5f20\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24335", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5339\u914d off-target KL\uff0c\u5e76\u533a\u5206\u591a\u7c7b\u5f52\u56e0\u58f0\u660e\uff0cSteerCheck \u53ef\u7cfb\u7edf\u5ba1\u8ba1\u6fc0\u6d3b\u8f6c\u5411\u5b9e\u9a8c\u4e2d\u7684\u7279\u5f02\u6027\u8bc1\u636e\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u7b26\u53f7\u968f\u673a\u5316\u65b9\u5411\u5e38\u4fdd\u7559\u663e\u8457\u76ee\u6807\u5bf9\u9f50\uff0c\u6548\u679c\u4e0e signed cosine \u5f3a\u76f8\u5173\uff0c\u63d0\u793a\u5b58\u5728 alignment leakage\u3002", "Qwen \u7684\u4e3b\u68c0\u9a8c\u56e0\u4fdd\u62a4\u5c3e\u90e8\u5931\u8d25\u800c\u4e3a\u8d1f\uff1bDeepSeek \u7684\u90e8\u5206\u5f00\u653e\u751f\u6210\u7ed3\u679c\u652f\u6301\u4e8b\u5b9e\u7ea0\u6b63\uff0c\u4f46\u81ea\u52a8\u8bc4\u6d4b\u6821\u51c6\u4e0d\u8db3\uff0c\u8bed\u4e49\u7ed3\u8bba\u9700\u8c28\u614e\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u6fc0\u6d3b\u8f6c\u5411", "\u6a21\u578b\u5ba1\u8ba1", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24335v1", "published_at": "2026-08-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SteerCheck: Attribution Specificity and Alignment Leakage in Activation-Steering Audits", "tldr": "\u5ba1\u8ba1\u6fc0\u6d3b\u8f6c\u5411\u7684\u5f52\u56e0\u7279\u5f02\u6027\u4e0e\u5bf9\u9f50\u6cc4\u6f0f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SteerCheck\uff0c\u4e00\u79cd\u9884\u6ce8\u518c\u7684\u6fc0\u6d3b\u8f6c\u5411\u5f52\u56e0\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u68c0\u9a8c\u884c\u4e3a\u6539\u53d8\u662f\u5426\u771f\u6b63\u6765\u81ea\u76ee\u6807\u6982\u5ff5\u800c\u975e\u6bd4\u8f83\u5668\u6216\u6784\u9020\u8fc7\u7a0b\u7684\u6cc4\u6f0f\u3002\u4f5c\u8005\u5728 Qwen3-14B\u3001DeepSeek \u7b49\u6a21\u578b\u4e0a\u590d\u73b0\u5b9e\u9a8c\uff0c\u5206\u79bb\u5747\u503c\u3001\u5c3e\u90e8\u4fdd\u62a4\u3001\u6781\u6027\u3001\u8fc1\u79fb\u4e0e\u8bed\u4e49\u5c42\u9762\u7684\u4e3b\u5f20\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5e38\u7528\u6fc0\u6d3b\u8f6c\u5411\u63a7\u5236\u5b9e\u9a8c\u53ef\u80fd\u65e0\u6cd5\u8bc1\u660e\u6982\u5ff5\u7279\u5f02\u6027\uff0c\u4e3a\u673a\u5236\u53ef\u89e3\u91ca\u6027\u548c\u6a21\u578b\u7f16\u8f91\u7814\u7a76\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u3001\u53ef\u5ba1\u8ba1\u7684\u8bc4\u4f30\u6d41\u7a0b\u4e0e\u62a5\u544a\u89c4\u8303\u3002"}, {"abstract": "Memory systems for conversational LLMs are conventionally evaluated by direct, fact-seeking questions about prior dialogue (Direct QA): can the model recall fact X from a prior conversation? We tested whether higher Direct QA accuracy correlates with higher user satisfaction in a 4-month deployment (40 users, 1,872 sessions, 7 memory conditions). Existing-benchmark Direct QA varies from 19.7% to 70.1% across the 7 conditions, but satisfaction does not change. We hypothesize that existing benchmarks and user satisfaction are tracking different capabilities: benchmarks measure elicited retrieval (recall when asked), while conversation requires natural integration (detecting relevance and naturally weaving prior context into a response). To examine this, we introduce MemUse, a set of real user-cued memory moments drawn from the deployment, scored by an integration-aware judgment of the natural conversational response. Holding the model and context fixed, the same system that scores 78.8% on Direct QA references only 7.9% of those facts in conversation -- a 71-point gap. Within these moments, Natural Integration is associated with satisfaction, whereas Direct QA is not. We release the deployment corpus and MemUse together with all judgments and scoring prompts at https://github.com/ryuichi-sumida/memuse.", "arxiv_id": "2608.24189", "arxiv_url": "https://arxiv.org/abs/2608.24189", "authors": ["Ryuichi Sumida", "Koji Inoue", "Tatsuya Kawahara"], "brief": "\u8bba\u6587\u6307\u51fa\u4f20\u7edfDirect QA\u8bb0\u5fc6\u8bc4\u6d4b\u4e0e\u771f\u5b9e\u7528\u6237\u6ee1\u610f\u5ea6\u4e0d\u76f8\u5173\uff0c\u5e76\u63d0\u51faMemUse\uff0c\u7528\u771f\u5b9e\u957f\u671f\u4eba\u673a\u5bf9\u8bdd\u4e2d\u7684\u7528\u6237\u89e6\u53d1\u8bb0\u5fc6\u65f6\u523b\u6765\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u80fd\u81ea\u7136\u4f7f\u7528\u8fc7\u5f80\u4fe1\u606f\u3002", "categories": ["cs.CL", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24189", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["4\u4e2a\u6708\u771f\u5b9e\u90e8\u7f72\u5305\u542b40\u540d\u7528\u6237\u30011872\u4e2a\u4f1a\u8bdd\u30017\u79cd\u8bb0\u5fc6\u6761\u4ef6\uff0cDirect QA\u51c6\u786e\u7387\u4ece19.7%\u523070.1%\u4e0d\u7b49\uff0c\u4f46\u7528\u6237\u6ee1\u610f\u5ea6\u65e0\u663e\u8457\u53d8\u5316", "\u4f5c\u8005\u533a\u5206\u201c\u88ab\u95ee\u53ca\u65f6\u68c0\u7d22\u8bb0\u5fc6\u201d\u548c\u201c\u5728\u5bf9\u8bdd\u4e2d\u81ea\u7136\u6574\u5408\u8bb0\u5fc6\u201d\u4e24\u79cd\u80fd\u529b\uff0c\u53d1\u73b0\u73b0\u6709\u57fa\u51c6\u4e3b\u8981\u6d4b\u524d\u8005", "\u5728\u56fa\u5b9a\u6a21\u578b\u548c\u4e0a\u4e0b\u6587\u4e0b\uff0c\u7cfb\u7edfDirect QA\u5f97\u520678.8%\uff0c\u4f46\u771f\u5b9e\u5bf9\u8bdd\u4e2d\u4ec5\u81ea\u7136\u5f15\u75287.9%\u7684\u76f8\u5173\u4e8b\u5b9e\uff0c\u5b58\u572871\u4e2a\u767e\u5206\u70b9\u5dee\u8ddd"], "keywords": ["\u5bf9\u8bdd\u7cfb\u7edf", "\u957f\u671f\u8bb0\u5fc6", "\u8bc4\u6d4b\u57fa\u51c6", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24189v1", "published_at": "2026-08-25", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MemUse: Moving Memory Evaluation from Direct QA to Natural Integration in Long-Term Human-AI Conversation", "tldr": "MemUse\u8bc4\u4f30\u5bf9\u8bdd\u8bb0\u5fc6\u7684\u81ea\u7136\u878d\u5165\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u4f20\u7edfDirect QA\u8bb0\u5fc6\u8bc4\u6d4b\u4e0e\u771f\u5b9e\u7528\u6237\u6ee1\u610f\u5ea6\u4e0d\u76f8\u5173\uff0c\u5e76\u63d0\u51faMemUse\uff0c\u7528\u771f\u5b9e\u957f\u671f\u4eba\u673a\u5bf9\u8bdd\u4e2d\u7684\u7528\u6237\u89e6\u53d1\u8bb0\u5fc6\u65f6\u523b\u6765\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u80fd\u81ea\u7136\u4f7f\u7528\u8fc7\u5f80\u4fe1\u606f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u957f\u671f\u5bf9\u8bdd\u8bb0\u5fc6\u7cfb\u7edf\u7684\u4e3b\u6d41\u8bc4\u6d4b\u65b9\u5f0f\uff0c\u8868\u660e\u9ad8\u8bb0\u5fc6\u95ee\u7b54\u51c6\u786e\u7387\u4e0d\u7b49\u4e8e\u66f4\u597d\u7528\u6237\u4f53\u9a8c\uff0c\u5e76\u63d0\u4f9b\u771f\u5b9e\u90e8\u7f72\u8bed\u6599\u4e0eMemUse\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u66f4\u8d34\u8fd1\u5b9e\u9645\u4f7f\u7528\u7684\u8bb0\u5fc6\u8bc4\u4f30\u3002"}, {"abstract": "Text-to-CAD aims to generate executable CAD programs from natural-language descriptions. However, real-world descriptions are often underspecified and omit critical spatial constraints required for valid CAD construction, a challenge that has been largely overlooked by existing methods. In this paper, we argue that missing spatial constraints should be inferred with respect to the underlying construction structure and informed by reusable design experience. Based on this insight, we propose ExpConCAD, an experience-enhanced framework for implicit spatial constraint completion. ExpConCAD first recovers the intended construction structure and constraint scopes, then retrieves relevant constraint-completion experience for similar scopes to complete the missing spatial constraints, and finally generates executable CadQuery programs. Extensive experiments demonstrate the effectiveness of ExpConCAD and provide insights into the role of construction structure understanding and experience memory in spatial constraint completion. Our code is available at: https://github.com/Hotjiashell/ExpConCAD.", "arxiv_id": "2608.24760", "arxiv_url": "https://arxiv.org/abs/2608.24760", "authors": ["Jingyao Liu", "Jinkang Tang", "Chen Huang", "Wenqiang Lei", "See-Kiong Ng"], "brief": "\u672c\u6587\u63d0\u51fa ExpConCAD\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u672c\u5230 CAD \u7684\u7ecf\u9a8c\u589e\u5f3a\u6846\u67b6\uff0c\u4e13\u95e8\u89e3\u51b3\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u4e2d\u7a7a\u95f4\u7ea6\u675f\u7f3a\u5931\u7684\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u6062\u590d\u6784\u5efa\u7ed3\u6784\u4e0e\u7ea6\u675f\u4f5c\u7528\u57df\u3001\u68c0\u7d22\u76f8\u4f3c\u8bbe\u8ba1\u7ecf\u9a8c\u6765\u8865\u5168\u9690\u5f0f\u7a7a\u95f4\u7ea6\u675f\uff0c\u5e76\u751f\u6210\u53ef\u6267\u884c CadQuery \u7a0b\u5e8f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24760", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u7f3a\u5931\u7a7a\u95f4\u7ea6\u675f\u89c6\u4e3a\u4f9d\u8d56\u5e95\u5c42\u6784\u5efa\u7ed3\u6784\u7684\u95ee\u9898\uff0c\u800c\u975e\u5355\u7eaf\u6587\u672c\u751f\u6210\u95ee\u9898", "\u5148\u8bc6\u522b\u76ee\u6807 CAD \u7684\u6784\u5efa\u7ed3\u6784\u548c\u7ea6\u675f\u8303\u56f4\uff0c\u518d\u68c0\u7d22\u76f8\u4f3c\u8303\u56f4\u4e0b\u7684\u7ea6\u675f\u8865\u5168\u7ecf\u9a8c", "\u5b9e\u9a8c\u8868\u660e\uff0c\u7ed3\u6784\u7406\u89e3\u4e0e\u7ecf\u9a8c\u8bb0\u5fc6\u80fd\u663e\u8457\u63d0\u5347\u7a7a\u95f4\u7ea6\u675f\u8865\u5168\u548c CAD \u7a0b\u5e8f\u53ef\u6267\u884c\u6027"], "keywords": ["\u6587\u672c\u5230CAD", "\u4ee3\u7801\u751f\u6210", "\u68c0\u7d22\u589e\u5f3a", "\u7a7a\u95f4\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24760v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "ExpConCAD: Experience-Guided Text-to-CAD Generation from Shape Descriptions with Implicit Spatial Constraints", "tldr": "\u7528\u8bbe\u8ba1\u7ecf\u9a8c\u8865\u5168\u7ea6\u675f\u751f\u6210\u53ef\u6267\u884cCAD\u7a0b\u5e8f", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ExpConCAD\uff0c\u4e00\u4e2a\u9762\u5411\u6587\u672c\u5230 CAD \u7684\u7ecf\u9a8c\u589e\u5f3a\u6846\u67b6\uff0c\u4e13\u95e8\u89e3\u51b3\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u4e2d\u7a7a\u95f4\u7ea6\u675f\u7f3a\u5931\u7684\u95ee\u9898\u3002\u5b83\u901a\u8fc7\u6062\u590d\u6784\u5efa\u7ed3\u6784\u4e0e\u7ea6\u675f\u4f5c\u7528\u57df\u3001\u68c0\u7d22\u76f8\u4f3c\u8bbe\u8ba1\u7ecf\u9a8c\u6765\u8865\u5168\u9690\u5f0f\u7a7a\u95f4\u7ea6\u675f\uff0c\u5e76\u751f\u6210\u53ef\u6267\u884c CadQuery \u7a0b\u5e8f\u3002", "why_notable": "\u771f\u5b9e\u6587\u672c\u63cf\u8ff0\u5e38\u5e38\u4e0d\u5b8c\u6574\uff0c\u5bfc\u81f4 Text-to-CAD \u96be\u4ee5\u751f\u6210\u6709\u6548\u6a21\u578b\uff1b\u8be5\u5de5\u4f5c\u5f15\u5165\u53ef\u590d\u7528\u8bbe\u8ba1\u7ecf\u9a8c\u6765\u63a8\u65ad\u9690\u5f0f\u7ea6\u675f\uff0c\u4e3a\u66f4\u53ef\u9760\u7684\u81ea\u7136\u8bed\u8a00\u9a71\u52a8 CAD \u5efa\u6a21\u63d0\u4f9b\u4e86\u5b9e\u7528\u601d\u8def\u3002"}, {"abstract": "Group-relative reinforcement learning waits for sibling rollouts of the same prompt, which is costly for long and variable tool-use trajectories. Single-stream Policy Optimization (SPO) removes this dependency with a persistent prompt-level value estimate, but its recipe whitens one advantage per trajectory before optimizing a token-mean actor loss. We show that trajectory centering generally does not center the token-weighted quantity consumed by the actor, and fix the mismatch by standardizing terminal-outcome advantages under the action-token measure. We additionally organize prompt evidence by the policy event that generated it rather than learner receipt order. Across matched runs on ALFWorld at two model scales and on Math-TIR, SPO++ improves online learning efficiency over SPO. A paired ablation identifies action-token-measure normalization as the strongest tested component.", "arxiv_id": "2608.24870", "arxiv_url": "https://arxiv.org/abs/2608.24870", "authors": ["Kai Ruan", "Jinghao Lin", "Qianshan Wei", "Ziqi Zhou", "Zihe Huang"], "brief": "\u8bba\u6587\u63d0\u51fa SPO++\uff0c\u9762\u5411\u5f02\u6b65\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\uff0c\u4fee\u6b63\u4e86 SPO \u4e2d\u6309\u8f68\u8ff9\u6807\u51c6\u5316\u4f18\u52bf\u4e0e\u5b9e\u9645 token \u52a0\u6743 actor \u635f\u5931\u4e4b\u95f4\u7684\u4e0d\u5339\u914d\u3002\u65b9\u6cd5\u6539\u4e3a\u5728\u52a8\u4f5c token \u5ea6\u91cf\u4e0b\u6807\u51c6\u5316\u7ec8\u5c40\u4f18\u52bf\uff0c\u5e76\u6309\u751f\u6210\u8bc1\u636e\u7684\u7b56\u7565\u4e8b\u4ef6\u7ec4\u7ec7\u6570\u636e\uff0c\u5728 ALFWorld \u548c Math-TIR \u4e0a\u76f8\u6bd4 SPO \u63d0\u5347\u4e86\u5728\u7ebf\u5b66\u4e60\u6548\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24870", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u4f18\u5316", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24870v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SPO++: Stream-Aligned Policy Optimization for Asynchronous Agentic RL", "tldr": "\u8bba\u6587\u63d0\u51fa SPO++\uff0c\u9762\u5411\u5f02\u6b65\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\uff0c\u4fee\u6b63\u4e86 SPO \u4e2d\u6309\u8f68\u8ff9\u6807\u51c6\u5316\u4f18\u52bf\u4e0e\u5b9e\u9645 token \u52a0\u6743 actor \u635f\u5931\u4e4b\u95f4\u7684\u4e0d\u5339\u914d\u3002\u65b9\u6cd5\u6539\u4e3a\u5728\u52a8\u4f5c token \u5ea6\u91cf\u4e0b\u6807\u51c6\u5316\u7ec8\u5c40\u4f18\u52bf\uff0c\u5e76\u6309\u751f\u6210\u8bc1\u636e\u7684\u7b56\u7565\u4e8b\u4ef6\u7ec4\u7ec7\u6570\u636e\uff0c\u5728 ALFWorld \u548c Math-TIR \u4e0a\u76f8\u6bd4 SPO \u63d0\u5347\u4e86\u5728\u7ebf\u5b66\u4e60\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents are moving beyond conventional retrieval-augmented generation toward direct interaction with external corpora. Direct Corpus Interaction (DCI) keeps the full corpus accessible, yet reachable evidence can remain unusable under finite interaction budgets. Required evidence may fail to surface, a surfaced supporting document may remain unopened, or an opened document may fail to expose its decisive fragment. We call this progressive silent loss Evidence Blindness and quantify it through stage-wise evidence realization. Within the DCI paradigm, raw interaction adds little reusable corpus organization, while dynamic-workspace methods reconstruct a query-conditioned interaction space from each query and trajectory. In both cases, useful structure is recovered largely online. We instead formulate large-scale agentic search as finite-budget navigation over reusable corpus structure. We introduce AtlasNav, a persistent multi-view corpus-navigation framework that retains direct corpus interaction but organizes the corpus once into a Corpus Atlas, allowing each query to navigate adaptively rather than reconstruct shared structure. On BrowseComp-Plus, AtlasNav achieves 92.05% strict accuracy while reducing recorded online inference cost by 30.21% relative to the prior dynamic-workspace state of the art. Under matched budgets, it realizes the complete required evidence earlier and approaches the same model\u0027s evidence-supplied empirical reference more rapidly. The same representation principle remains effective under PhantomWiki\u0027s distinct corpus organization and controlled 10K-1M scaling, and transfers competitively to heterogeneous enterprise knowledge. These results show that agentic search depends not only on accessible evidence, but also on how the corpus is represented so that limited interaction becomes effective navigation.", "arxiv_id": "2608.24764", "arxiv_url": "https://arxiv.org/abs/2608.24764", "authors": ["Hongyu Guo", "Zhiyu Zheng", "Zhao Cao"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u8bc1\u636e\u76f2\u89c6\u201d\u6982\u5ff5\uff0c\u6307\u51fa\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5373\u4f7f\u80fd\u76f4\u63a5\u8bbf\u95ee\u5b8c\u6574\u8bed\u6599\uff0c\u4e5f\u53ef\u80fd\u56e0\u6709\u9650\u4ea4\u4e92\u9884\u7b97\u65e0\u6cd5\u53d1\u73b0\u3001\u6253\u5f00\u6216\u5b9a\u4f4d\u5173\u952e\u8bc1\u636e\u3002\u4f5c\u8005\u63d0\u51fa AtlasNav\uff0c\u5c06\u8bed\u6599\u9884\u5148\u7ec4\u7ec7\u6210\u53ef\u590d\u7528\u7684\u591a\u89c6\u56fe Corpus Atlas\uff0c\u4f7f\u67e5\u8be2\u8fc7\u7a0b\u4ece\u5728\u7ebf\u91cd\u5efa\u53d8\u4e3a\u81ea\u9002\u5e94\u5bfc\u822a\uff0c\u5728 BrowseComp-Plus \u4e0a\u8fbe\u5230 92.05% \u4e25\u683c\u51c6\u786e\u7387\uff0c\u5e76\u8f83\u6b64\u524d\u52a8\u6001\u5de5\u4f5c\u533a\u65b9\u6cd5\u964d\u4f4e 30.21% \u5728\u7ebf\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24764", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u8bed\u6599\u5bfc\u822a", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24764v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Evidence Blindness in Direct Corpus Interaction: Persistent Navigation with AtlasNav", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u8bc1\u636e\u76f2\u89c6\u201d\u6982\u5ff5\uff0c\u6307\u51fa\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5373\u4f7f\u80fd\u76f4\u63a5\u8bbf\u95ee\u5b8c\u6574\u8bed\u6599\uff0c\u4e5f\u53ef\u80fd\u56e0\u6709\u9650\u4ea4\u4e92\u9884\u7b97\u65e0\u6cd5\u53d1\u73b0\u3001\u6253\u5f00\u6216\u5b9a\u4f4d\u5173\u952e\u8bc1\u636e\u3002\u4f5c\u8005\u63d0\u51fa AtlasNav\uff0c\u5c06\u8bed\u6599\u9884\u5148\u7ec4\u7ec7\u6210\u53ef\u590d\u7528\u7684\u591a\u89c6\u56fe Corpus Atlas\uff0c\u4f7f\u67e5\u8be2\u8fc7\u7a0b\u4ece\u5728\u7ebf\u91cd\u5efa\u53d8\u4e3a\u81ea\u9002\u5e94\u5bfc\u822a\uff0c\u5728 BrowseComp-Plus \u4e0a\u8fbe\u5230 92.05% \u4e25\u683c\u51c6\u786e\u7387\uff0c\u5e76\u8f83\u6b64\u524d\u52a8\u6001\u5de5\u4f5c\u533a\u65b9\u6cd5\u964d\u4f4e 30.21% \u5728\u7ebf\u63a8\u7406\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic systems increasingly gate actions on a model\u0027s own stated confidence, which assumes confidence tracks correctness at the moment of acting. We test this in a hidden-information chess variant where royal status can be secretly, repeatedly relocated between pieces, and where an agent\u0027s stated probability distribution over the opponent\u0027s hidden royal piece -- elicited every turn, separately from the move it chooses -- is scored against ground truth recoverable after the game. Across two independent batches, captures made at high stated confidence ($\\geq 0.5$) about the hidden piece\u0027s location were correct in 1 of 62 cases. The calibration deficit is concentrated almost entirely in these events: 99.3% of it in the original batch, 98.7% in the replication. The same pattern, in weaker form, orders consistently (point estimates only; most pairwise gaps are not statistically distinguishable at this sample size) across four further model configurations spanning a second provider -- reported as scope for the finding, not as evidence that capability predicts calibration: a same-model comparison at a fixed external leaderboard score shows a deliberation-budget change alone moves the metric by nearly as much as a large cross-model gap. In a separate seat, conventional evaluation axes -- legality, cost, latency, completion rate -- can dissociate entirely from belief quality, with the configuration winning on every conventional axis producing the worst belief quality tested. A model exhibiting this pattern can still win the game its belief was about, which is why outcome-only evaluation would not detect it.", "arxiv_id": "2608.24691", "arxiv_url": "https://arxiv.org/abs/2608.24691", "authors": ["Bhushan Kashinath Joshi"], "brief": "\u672c\u6587\u5728\u9690\u85cf\u4fe1\u606f\u56fd\u9645\u8c61\u68cb\u53d8\u4f53\u4e2d\u6d4b\u8bd5\u5927\u6a21\u578b\u884c\u52a8\u65f6\u7684\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u662f\u5426\u53ef\u9760\uff0c\u53d1\u73b0\u9ad8\u7f6e\u4fe1\u6355\u83b7\u51e0\u4e4e\u603b\u662f\u5224\u65ad\u9519\u8bef\uff1a\u4e24\u6279\u5b9e\u9a8c\u4e2d62\u6b21\u9ad8\u7f6e\u4fe1\u884c\u52a8\u4ec51\u6b21\u6b63\u786e\u3002\u7814\u7a76\u8868\u660e\u5e38\u89c4\u6307\u6807\u5982\u5408\u6cd5\u6027\u3001\u6210\u672c\u3001\u5ef6\u8fdf\u548c\u80dc\u7387\u53ef\u80fd\u4e0e\u4fe1\u5ff5\u8d28\u91cf\u5b8c\u5168\u8131\u94a9\uff0c\u5355\u770b\u6e38\u620f\u7ed3\u679c\u65e0\u6cd5\u53d1\u73b0\u8fd9\u79cd\u7f6e\u4fe1\u5ea6\u5931\u51c6\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24691", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6821\u51c6", "\u9690\u85cf\u4fe1\u606f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24691v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Confident at the moment of action: belief miscalibration in LLM play under hidden information", "tldr": "\u672c\u6587\u5728\u9690\u85cf\u4fe1\u606f\u56fd\u9645\u8c61\u68cb\u53d8\u4f53\u4e2d\u6d4b\u8bd5\u5927\u6a21\u578b\u884c\u52a8\u65f6\u7684\u81ea\u62a5\u7f6e\u4fe1\u5ea6\u662f\u5426\u53ef\u9760\uff0c\u53d1\u73b0\u9ad8\u7f6e\u4fe1\u6355\u83b7\u51e0\u4e4e\u603b\u662f\u5224\u65ad\u9519\u8bef\uff1a\u4e24\u6279\u5b9e\u9a8c\u4e2d62\u6b21\u9ad8\u7f6e\u4fe1\u884c\u52a8\u4ec51\u6b21\u6b63\u786e\u3002\u7814\u7a76\u8868\u660e\u5e38\u89c4\u6307\u6807\u5982\u5408\u6cd5\u6027\u3001\u6210\u672c\u3001\u5ef6\u8fdf\u548c\u80dc\u7387\u53ef\u80fd\u4e0e\u4fe1\u5ff5\u8d28\u91cf\u5b8c\u5168\u8131\u94a9\uff0c\u5355\u770b\u6e38\u620f\u7ed3\u679c\u65e0\u6cd5\u53d1\u73b0\u8fd9\u79cd\u7f6e\u4fe1\u5ea6\u5931\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "System-level simulation is an essential tool for exploring the rapidly expanding design space of LLM serving systems, where real deployments remain costly and often infeasible. However, modern LLM serving now evolves faster than human-driven simulator development can track, and emerging workloads and mechanisms, from agentic workflows to disaggregated serving, no longer fit the monolithic simulation pipeline that existing simulators assume. Each new mechanism therefore demands an invasive rewrite, leaving a widening development gap between deployed serving systems and the simulators that model them. To close this gap, we present Borg, a framework that realizes agent-driven simulator development. Borg introduces a composable simulator infrastructure that uniformly expresses the complete serving workflow, including the control decisions that coordinate it, and realizes it as a unified dynamic graph in Borg simulator. Synthesizer agent, a harnessed coding agent, then lowers natural-language feature requests onto this abstraction under simulator-specific guardrails and fidelity validation, evolving one shared simulator instead of building a new one for every feature. Under the same coding agent and harnesses, extensions built on Borg follow a vLLM-based real system with 2.51% average throughput error, versus 6.03% for extensions built on existing simulators. On identical workloads, Borg also simulates up to 284.96x and 23.19x faster than two state-of-the-art simulators, LLMServingSim2.0 and Vidur, respectively.", "arxiv_id": "2608.24650", "arxiv_url": "https://arxiv.org/abs/2608.24650", "authors": ["Wonung Kim", "Hyunmin Choi", "Minsu Kim", "Jaehong Cho", "Yeongwook Kim", "Jongse Park"], "brief": "\u672c\u6587\u63d0\u51fa Borg/Simthesizer\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u6a21\u578b\u670d\u52a1\u7cfb\u7edf\u7684\u667a\u80fd\u4f53\u9a71\u52a8\u4eff\u771f\u6846\u67b6\uff0c\u7528\u53ef\u7ec4\u5408\u7684\u52a8\u6001\u56fe\u7edf\u4e00\u8868\u8fbe\u670d\u52a1\u6d41\u7a0b\u4e0e\u63a7\u5236\u51b3\u7b56\uff0c\u5e76\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u6839\u636e\u81ea\u7136\u8bed\u8a00\u9700\u6c42\u6269\u5c55\u4eff\u771f\u5668\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u6269\u5c55\u540e\u7684\u4eff\u771f\u4e0e vLLM \u771f\u5b9e\u7cfb\u7edf\u541e\u5410\u8bef\u5dee\u4ec5 2.51%\uff0c\u4e14\u4eff\u771f\u901f\u5ea6\u6700\u9ad8\u6bd4\u73b0\u6709\u5de5\u5177\u5feb 284.96 \u500d\u3002", "categories": ["cs.AR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24650", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u6a21\u578b\u670d\u52a1", "\u7cfb\u7edf\u4eff\u771f", "\u7f16\u7801\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24650v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Simthesizer: An Agent-Driven Simulation Framework for LLM Serving Systems", "tldr": "\u672c\u6587\u63d0\u51fa Borg/Simthesizer\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u6a21\u578b\u670d\u52a1\u7cfb\u7edf\u7684\u667a\u80fd\u4f53\u9a71\u52a8\u4eff\u771f\u6846\u67b6\uff0c\u7528\u53ef\u7ec4\u5408\u7684\u52a8\u6001\u56fe\u7edf\u4e00\u8868\u8fbe\u670d\u52a1\u6d41\u7a0b\u4e0e\u63a7\u5236\u51b3\u7b56\uff0c\u5e76\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u6839\u636e\u81ea\u7136\u8bed\u8a00\u9700\u6c42\u6269\u5c55\u4eff\u771f\u5668\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u6269\u5c55\u540e\u7684\u4eff\u771f\u4e0e vLLM \u771f\u5b9e\u7cfb\u7edf\u541e\u5410\u8bef\u5dee\u4ec5 2.51%\uff0c\u4e14\u4eff\u771f\u901f\u5ea6\u6700\u9ad8\u6bd4\u73b0\u6709\u5de5\u5177\u5feb 284.96 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents coordinate complex tasks through multi-role and multi-stage workflows. Upstream state is repeatedly transformed into intermediate language artifacts, such as summaries, plans, tickets, memories, and handoff notes, from which downstream components act. For action-constraining state, topical retention is insufficient: an artifact may mention an unresolved condition while changing it from a requirement that must be resolved before execution into information that may merely inform the next action. We study this action-binding role as operational state preservation. Safety blockers provide a controlled instance because each source state has an explicit prerequisite, authority, fallback, and execution consequence. We condition on correct upstream identification, vary the handoff transformation, and evaluate an executor restricted to the resulting artifact. Across 1,296 controlled synthetic episodes, direct-handoff controls preserve every blocker, whereas compression, plan assimilation, convergence, ownership deferral, and precedent substitution repeatedly turn binding state into caveats or non-binding considerations. Normal handoff compression produces 100.0% deactivation and 54.2% forbidden action. Restoring all four state fields raises preservation to 100.0% and reduces forbidden action to 0.0%. Fixed-artifact interventions further separate preservation from containment: downstream verification eliminates forbidden action while artifact deactivation remains 95.3%. These results identify a state-transmission failure between information extraction and action. Handoff transformations can retain state content while weakening its constraints on downstream action. Semantic availability does not guarantee operational preservation.", "arxiv_id": "2608.24569", "arxiv_url": "https://arxiv.org/abs/2608.24569", "authors": ["Yiheng Sun", "Huifei Wang", "Yancheng Zhu", "Zhenyu Li", "Zebin Zhao", "Yifan Yuan"], "brief": "\u672c\u6587\u7814\u7a76 LLM \u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4e2d\u7684\u201c\u7ea6\u675f\u5f31\u5316\u201d\u95ee\u9898\uff1a\u4e0a\u6e38\u660e\u786e\u7684\u5b89\u5168\u963b\u65ad\u6761\u4ef6\u5728\u6458\u8981\u3001\u8ba1\u5212\u3001\u4ea4\u63a5\u7b49\u4e2d\u95f4\u6587\u672c\u8f6c\u6362\u540e\uff0c\u53ef\u80fd\u4ece\u5fc5\u987b\u6ee1\u8db3\u7684\u6267\u884c\u524d\u63d0\u53d8\u6210\u4ec5\u4f9b\u53c2\u8003\u7684\u4fe1\u606f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u666e\u901a\u4ea4\u63a5\u538b\u7f29\u4f1a\u5bfc\u81f4 100% \u7684\u7ea6\u675f\u5931\u6d3b\u548c 54.2% \u7684\u8fdd\u89c4\u52a8\u4f5c\uff1b\u6062\u590d\u524d\u63d0\u3001\u6743\u9650\u3001\u56de\u9000\u548c\u540e\u679c\u56db\u7c7b\u72b6\u6001\u5b57\u6bb5\u53ef\u5c06\u4fdd\u7559\u7387\u63d0\u5347\u5230 100%\uff0c\u8fdd\u89c4\u52a8\u4f5c\u964d\u81f3 0%\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24569", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u7ea6\u675f", "\u5de5\u4f5c\u6d41"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24569v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "When \"Must\" Becomes \"Maybe\": Constraint Weakening in LLM Agent Workflows", "tldr": "\u672c\u6587\u7814\u7a76 LLM \u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4e2d\u7684\u201c\u7ea6\u675f\u5f31\u5316\u201d\u95ee\u9898\uff1a\u4e0a\u6e38\u660e\u786e\u7684\u5b89\u5168\u963b\u65ad\u6761\u4ef6\u5728\u6458\u8981\u3001\u8ba1\u5212\u3001\u4ea4\u63a5\u7b49\u4e2d\u95f4\u6587\u672c\u8f6c\u6362\u540e\uff0c\u53ef\u80fd\u4ece\u5fc5\u987b\u6ee1\u8db3\u7684\u6267\u884c\u524d\u63d0\u53d8\u6210\u4ec5\u4f9b\u53c2\u8003\u7684\u4fe1\u606f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u666e\u901a\u4ea4\u63a5\u538b\u7f29\u4f1a\u5bfc\u81f4 100% \u7684\u7ea6\u675f\u5931\u6d3b\u548c 54.2% \u7684\u8fdd\u89c4\u52a8\u4f5c\uff1b\u6062\u590d\u524d\u63d0\u3001\u6743\u9650\u3001\u56de\u9000\u548c\u540e\u679c\u56db\u7c7b\u72b6\u6001\u5b57\u6bb5\u53ef\u5c06\u4fdd\u7559\u7387\u63d0\u5347\u5230 100%\uff0c\u8fdd\u89c4\u52a8\u4f5c\u964d\u81f3 0%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents increasingly solve tasks by invoking multiple tools, where parallel execution is essential for low latency but difficult to manage safely. Existing agent benchmarks primarily evaluate tool selection, argument generation, and end-to-end success under mostly serial execution, largely overlooking valid parallelization and resource-constrained scheduling. This missing scheduling dimension creates a practical failure mode: serial execution is safe but slow, while resource-agnostic parallel execution is fast but prone to avoidable resource overflows. To address this gap, we introduce PeakBench, a benchmark of executable multi-tool workflows with execution-grounded dependency annotations and measured resource profiles. A central challenge in evaluating such workflows is attribution: failures and inefficiencies may arise from incorrect dependency planning, poor resource-constrained scheduling, or both. PeakBench addresses this challenge with a two-part evaluation framework that disentangles logical planning from physical scheduling, with dedicated metrics for each dimension. Using this framework, we show that strong logical planning does not reliably translate into safe or efficient execution under resource constraints. We further show that exposing resource information can reduce avoidable overflows and improve resource utilization, making PeakBench a useful testbed for diagnosing resource-aware agent behavior. Code is available at https://github.com/Czzzk/Staggering-the-Peaks.", "arxiv_id": "2608.24509", "arxiv_url": "https://arxiv.org/abs/2608.24509", "authors": ["Zhi-Kai Chen", "Xu-Xiang Zhong", "Song-Yan Li", "De-Chuan Zhan", "Han-Jia Ye"], "brief": "PeakBench \u63d0\u51fa\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u591a\u5de5\u5177\u5de5\u4f5c\u6d41\u7684\u57fa\u51c6\uff0c\u91cd\u70b9\u8bc4\u6d4b\u5728\u4f9d\u8d56\u5173\u7cfb\u3001\u5e76\u884c\u6267\u884c\u548c\u8d44\u6e90\u7ea6\u675f\u4e0b\u7684\u5de5\u5177\u8c03\u7528\u8c03\u5ea6\u80fd\u529b\u3002\u5b83\u5c06\u903b\u8f91\u89c4\u5212\u4e0e\u7269\u7406\u8c03\u5ea6\u5206\u5f00\u8bc4\u4f30\uff0c\u53d1\u73b0\u5f3a\u89c4\u5212\u80fd\u529b\u5e76\u4e0d\u5fc5\u7136\u5e26\u6765\u5b89\u5168\u9ad8\u6548\u7684\u8d44\u6e90\u53d7\u9650\u6267\u884c\uff0c\u800c\u63d0\u4f9b\u8d44\u6e90\u4fe1\u606f\u53ef\u51cf\u5c11\u6ea2\u51fa\u5e76\u63d0\u5347\u5229\u7528\u7387\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24509", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u8d44\u6e90\u8c03\u5ea6", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24509v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PeakBench: Benchmarking Resource-Aware Tool Invocation in LLM Agents", "tldr": "PeakBench \u63d0\u51fa\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u591a\u5de5\u5177\u5de5\u4f5c\u6d41\u7684\u57fa\u51c6\uff0c\u91cd\u70b9\u8bc4\u6d4b\u5728\u4f9d\u8d56\u5173\u7cfb\u3001\u5e76\u884c\u6267\u884c\u548c\u8d44\u6e90\u7ea6\u675f\u4e0b\u7684\u5de5\u5177\u8c03\u7528\u8c03\u5ea6\u80fd\u529b\u3002\u5b83\u5c06\u903b\u8f91\u89c4\u5212\u4e0e\u7269\u7406\u8c03\u5ea6\u5206\u5f00\u8bc4\u4f30\uff0c\u53d1\u73b0\u5f3a\u89c4\u5212\u80fd\u529b\u5e76\u4e0d\u5fc5\u7136\u5e26\u6765\u5b89\u5168\u9ad8\u6548\u7684\u8d44\u6e90\u53d7\u9650\u6267\u884c\uff0c\u800c\u63d0\u4f9b\u8d44\u6e90\u4fe1\u606f\u53ef\u51cf\u5c11\u6ea2\u51fa\u5e76\u63d0\u5347\u5229\u7528\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reliable multi-turn tool use requires an agent to preserve an evolving task state and ensure that each action remains consistent with it. However, direct function-calling and ReAct-style policies learn state tracking and action generation within the same autoregressive trajectory. This coupling creates state-action competition: the pressure to produce the next call can overwrite or ignore information accumulated earlier in the interaction. Inspired by Boyd\u0027s Observe-Orient-Decide-Act cycle, we introduce OODA-Tool, a typed closed-loop policy designed to mitigate this competition by separating state preservation from action realization. Rather than generating an action directly from the interaction history, OODA-Tool routes each decision through controller-checked intermediate states, ensuring that the final output remains grounded in the current task state. Specifically, Observe reconstructs the task state, Orient determines whether execution is warranted, Decide forms an admissible action structure, and Act realizes the external output. We evaluate OODA-Tool against direct function-calling and ReAct policies using Qwen3 models ranging from 0.6B to 14B across multi-turn, multi-tool, and incomplete-information settings. OODA-Tool consistently improves task success across model sizes, with larger gains on smaller models and on tasks whose actions depend strongly on information accumulated across turns and prior tool results. Controlled variants, stage-level ablations, and transfer evaluations further demonstrate the robustness of these improvements.", "arxiv_id": "2608.24368", "arxiv_url": "https://arxiv.org/abs/2608.24368", "authors": ["Rongfeng Guo", "Yinxuan Huang", "Yusen Wu", "Maoqing Zhong", "Yunlu Chen", "Meng Tang", "Teng Long", "Vincent Tao Hu"], "brief": "\u8bba\u6587\u63d0\u51fa OODA-Tool\uff0c\u5c06\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u62c6\u5206\u4e3a\u89c2\u5bdf\u3001\u5b9a\u5411\u3001\u51b3\u7b56\u3001\u884c\u52a8\u56db\u4e2a\u53d7\u63a7\u9636\u6bb5\uff0c\u4ee5\u7f13\u89e3\u72b6\u6001\u8ffd\u8e2a\u4e0e\u52a8\u4f5c\u751f\u6210\u76f8\u4e92\u5e72\u6270\u7684\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u5728 Qwen3 \u4e0d\u540c\u89c4\u6a21\u6a21\u578b\u3001\u591a\u5de5\u5177\u548c\u4fe1\u606f\u4e0d\u5b8c\u6574\u4efb\u52a1\u4e2d\u7a33\u5b9a\u63d0\u5347\u6210\u529f\u7387\uff0c\u5c24\u5176\u5bf9\u5c0f\u6a21\u578b\u548c\u5f3a\u4f9d\u8d56\u5386\u53f2\u72b6\u6001\u7684\u4efb\u52a1\u6536\u76ca\u66f4\u660e\u663e\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24368", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u591a\u8f6e\u4ea4\u4e92", "\u72b6\u6001\u8ffd\u8e2a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24368v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "From State to Action: OODA-Tool for Reliable Multi-Turn Tool Use", "tldr": "\u8bba\u6587\u63d0\u51fa OODA-Tool\uff0c\u5c06\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u62c6\u5206\u4e3a\u89c2\u5bdf\u3001\u5b9a\u5411\u3001\u51b3\u7b56\u3001\u884c\u52a8\u56db\u4e2a\u53d7\u63a7\u9636\u6bb5\uff0c\u4ee5\u7f13\u89e3\u72b6\u6001\u8ffd\u8e2a\u4e0e\u52a8\u4f5c\u751f\u6210\u76f8\u4e92\u5e72\u6270\u7684\u95ee\u9898\u3002\u8be5\u65b9\u6cd5\u5728 Qwen3 \u4e0d\u540c\u89c4\u6a21\u6a21\u578b\u3001\u591a\u5de5\u5177\u548c\u4fe1\u606f\u4e0d\u5b8c\u6574\u4efb\u52a1\u4e2d\u7a33\u5b9a\u63d0\u5347\u6210\u529f\u7387\uff0c\u5c24\u5176\u5bf9\u5c0f\u6a21\u578b\u548c\u5f3a\u4f9d\u8d56\u5386\u53f2\u72b6\u6001\u7684\u4efb\u52a1\u6536\u76ca\u66f4\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent LLM systems are increasingly deployed in real-world applications, where failures can be costly and difficult to localize. Despite growing efforts to automate failure attribution, diagnosing failed runs still largely relies on human engineers. Yet engineers rarely debug complex systems by reading raw logs end to end. Instead, observability tools organize traces around components, actions, and dependencies to support targeted navigation. We hypothesize that modern LLMs can benefit from the same paradigm. To test this hypothesis, we introduce Adaptive Influence Graphs (AIGs), a two-stage agentic framework that first transforms a failed trace into a structured graph and then navigates it to identify the critical error. Across multiple models, we show that richer trace representations consistently improve failure attribution, with adaptive graph construction and agent-directed traversal yielding the strongest results. AIGs establish a new state of the art on Who\u0026When, the standard benchmark for multi-agent failure attribution. This affirms our hypothesis that attribution depends not only on the diagnosing model, but also on how the trace is represented and explored.", "arxiv_id": "2608.24361", "arxiv_url": "https://arxiv.org/abs/2608.24361", "authors": ["Yarden Bakish", "Amir Dudai", "Roy Ganz", "Oren Nuriel", "Elad Ben Avraham", "Mor Shpigel Nacson", "Ron Litman"], "brief": "\u8bba\u6587\u63d0\u51fa\u81ea\u9002\u5e94\u5f71\u54cd\u56fe\uff08AIG\uff09\uff0c\u5148\u5c06\u591a\u667a\u80fd\u4f53\u5931\u8d25\u8f68\u8ff9\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u56fe\uff0c\u518d\u7531\u667a\u80fd\u4f53\u5bfc\u822a\u56fe\u7ed3\u6784\u6765\u5b9a\u4f4d\u5173\u952e\u9519\u8bef\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u66f4\u4e30\u5bcc\u7684\u8f68\u8ff9\u8868\u793a\u80fd\u7a33\u5b9a\u63d0\u5347\u5931\u8d25\u5f52\u56e0\u6548\u679c\uff0cAIG \u5728 Who\u0026When \u591a\u667a\u80fd\u4f53\u5931\u8d25\u5f52\u56e0\u57fa\u51c6\u4e0a\u8fbe\u5230\u65b0\u6700\u4f73\u7ed3\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24361", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u6545\u969c\u5f52\u56e0", "\u53ef\u89c2\u6d4b\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24361v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Adaptive Influence Graphs for Failure Attribution in Multi-Agent Systems", "tldr": "\u8bba\u6587\u63d0\u51fa\u81ea\u9002\u5e94\u5f71\u54cd\u56fe\uff08AIG\uff09\uff0c\u5148\u5c06\u591a\u667a\u80fd\u4f53\u5931\u8d25\u8f68\u8ff9\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u56fe\uff0c\u518d\u7531\u667a\u80fd\u4f53\u5bfc\u822a\u56fe\u7ed3\u6784\u6765\u5b9a\u4f4d\u5173\u952e\u9519\u8bef\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u66f4\u4e30\u5bcc\u7684\u8f68\u8ff9\u8868\u793a\u80fd\u7a33\u5b9a\u63d0\u5347\u5931\u8d25\u5f52\u56e0\u6548\u679c\uff0cAIG \u5728 Who\u0026When \u591a\u667a\u80fd\u4f53\u5931\u8d25\u5f52\u56e0\u57fa\u51c6\u4e0a\u8fbe\u5230\u65b0\u6700\u4f73\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-video understanding depends critically on how a limited model context is constructed from a much longer video. Existing approaches improve this process through compression, retrieval, memory, and agentic evidence acquisition, but these mechanisms are typically introduced as part of a manually designed inference system or optimized together with other components. This makes it difficult to isolate a simpler question: how much can be gained by improving the executable context-construction program alone? We study this question through VIDEOHARNESS-RSI, a controlled baseline for recursively searching executable context constructors around a frozen vision-language model (VLM). An outer-loop proposer uses prior programs, evaluation outcomes, and execution traces to generate candidate harnesses, which are executed and evaluated end to end before successful variants are retained for further search. This makes long-video understanding a controlled instance of automated harness design: the searchable object is executable program structure, while the answering model and interface remain fixed. Starting from uniform sampling, recursive harness search consistently finds room for improvement and surpasses several weaker hand-crafted baselines. Starting instead from a stronger hand-crafted baseline, the same RSI process yields a further improvement. The selected harness also transfers to additional long-video benchmarks without further search. Together, these results establish executable context construction as a distinct optimization layer and provide a reproducible baseline for studying harness discovery and transfer around frozen VLMs.", "arxiv_id": "2608.24302", "arxiv_url": "https://arxiv.org/abs/2608.24302", "authors": ["Guoyang Xu", "Hao Chen"], "brief": "\u8bba\u6587\u63d0\u51fa VideoHarness-RSI\uff0c\u5728\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0d\u53d8\u7684\u524d\u63d0\u4e0b\uff0c\u9012\u5f52\u641c\u7d22\u7528\u4e8e\u957f\u89c6\u9891\u7406\u89e3\u7684\u53ef\u6267\u884c\u4e0a\u4e0b\u6587\u6784\u5efa\u7a0b\u5e8f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u80fd\u4ece\u5747\u5300\u91c7\u6837\u6216\u4eba\u5de5\u57fa\u7ebf\u51fa\u53d1\u6301\u7eed\u6539\u8fdb\u6027\u80fd\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u5176\u4ed6\u957f\u89c6\u9891\u57fa\u51c6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24302", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u957f\u89c6\u9891\u7406\u89e3", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u7a0b\u5e8f\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24302v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VideoHarness-RSI: Recursive Harness Self-Improvement for Long-Video Understanding with Frozen Vision-Language Models", "tldr": "\u8bba\u6587\u63d0\u51fa VideoHarness-RSI\uff0c\u5728\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0d\u53d8\u7684\u524d\u63d0\u4e0b\uff0c\u9012\u5f52\u641c\u7d22\u7528\u4e8e\u957f\u89c6\u9891\u7406\u89e3\u7684\u53ef\u6267\u884c\u4e0a\u4e0b\u6587\u6784\u5efa\u7a0b\u5e8f\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u80fd\u4ece\u5747\u5300\u91c7\u6837\u6216\u4eba\u5de5\u57fa\u7ebf\u51fa\u53d1\u6301\u7eed\u6539\u8fdb\u6027\u80fd\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u5176\u4ed6\u957f\u89c6\u9891\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents can generate paper reproduction code, yet often produce scientifically unfaithful implementations. We define this failure mode as semantic drift, where generated code silently diverges from the paper\u0027s specifications. We introduce SemanticAlign-Bench(SA-Bench), a diagnostic benchmark covering 30 papers from ICLR, ICML and NeurIPS 2025. For each paper, we decompose its specifications into atomic and verifiable implementation claims, which we call Semantic Alignment Units (SAUs) and evaluate repositories along four diagnostic dimensions spanning numerical, methodological, protocol and ordering drift. In total, we construct 1,491 SAUs across five ML domains and evaluate 12 generator configurations (4 models $\\times$ 3 scaffolds). Even the strongest configuration (Claude+PaperCoder) achieves a mean SAU score of only 0.301 out of 1.0, with an overall mean of 0.221 across 360 evaluations. A failure taxonomy reveals that agents attempt most requirements but implement them incorrectly, with implementation mismatch and stubs accounting for the majority of zero-scored claims. Our analysis further indicates that scaffolds optimized for executability provide limited leverage for scientific reproduction; narrowing the gap requires scaffolds that prioritize semantic specification verification. The benchmark, annotations and evaluation pipeline are publicly available.", "arxiv_id": "2608.24252", "arxiv_url": "https://arxiv.org/abs/2608.24252", "authors": ["Xue Hu", "Zewei Pan", "Zeli Su", "Zhou Liu", "Wentao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa SA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u8bba\u6587\u590d\u73b0\u4ee3\u7801\u662f\u5426\u4e0e\u539f\u8bba\u6587\u8bed\u4e49\u5bf9\u9f50\u3002\u57fa\u51c6\u8986\u76d6 30 \u7bc7\u9876\u4f1a\u8bba\u6587\u30011491 \u4e2a\u8bed\u4e49\u5bf9\u9f50\u5355\u5143\uff0c\u53d1\u73b0\u5f53\u524d\u6700\u5f3a\u914d\u7f6e\u5f97\u5206\u4ec5 0.301\uff0c\u4e3b\u8981\u95ee\u9898\u662f\u5b9e\u73b0\u4e0e\u8bba\u6587\u8981\u6c42\u4e0d\u5339\u914d\u6216\u7528\u5360\u4f4d\u4ee3\u7801\u66ff\u4ee3\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24252", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4ee3\u7801\u751f\u6210", "\u8bba\u6587\u590d\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24252v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SA-Bench: Evaluating Semantic Alignment in LLM-Based Paper Reproduction", "tldr": "\u8bba\u6587\u63d0\u51fa SA-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u8bba\u6587\u590d\u73b0\u4ee3\u7801\u662f\u5426\u4e0e\u539f\u8bba\u6587\u8bed\u4e49\u5bf9\u9f50\u3002\u57fa\u51c6\u8986\u76d6 30 \u7bc7\u9876\u4f1a\u8bba\u6587\u30011491 \u4e2a\u8bed\u4e49\u5bf9\u9f50\u5355\u5143\uff0c\u53d1\u73b0\u5f53\u524d\u6700\u5f3a\u914d\u7f6e\u5f97\u5206\u4ec5 0.301\uff0c\u4e3b\u8981\u95ee\u9898\u662f\u5b9e\u73b0\u4e0e\u8bba\u6587\u8981\u6c42\u4e0d\u5339\u914d\u6216\u7528\u5360\u4f4d\u4ee3\u7801\u66ff\u4ee3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic retrieval-augmented generation (RAG) requires language models to decide when to continue searching and when to answer. Existing RL-based methods rely on external supervision and overlook the agent\u0027s internal belief about whether the current evidence is sufficient. To address this problem, we reformulate the search decision quality as belief-action alignment and propose MetaRAG, a belief-action aligned policy optimization framework for agentic RAG. MetaRAG uses Verify-first Action Generation to elicit an explicit verification process before each actual action, and Internal Belief Probing to estimate the policy model\u0027s own answerability belief from the same question-history context. Based on these, MetaRAG derives a consistency reward that is further gated by answer correctness, avoiding reinforcement of internally consistent but incorrect trajectories. The belief probe is used only during training and introduces no inference-time overhead. Experiments on seven public QA benchmarks show that MetaRAG consistently improves the accuracy-efficiency trade-off over strong RL-based agentic RAG baselines, with gains that transfer to deep research settings, different optimizers, and multiple model backbones.", "arxiv_id": "2608.24214", "arxiv_url": "https://arxiv.org/abs/2608.24214", "authors": ["Qiuyi Qi", "Tian Liang", "Jiamu Wang", "Jinjian Zhang", "Wei Zhou", "Pengcheng Zhu", "Linjian Mo", "Ming Kong", "Jie Liu", "Qiang Zhu"], "brief": "\u672c\u6587\u63d0\u51fa MetaRAG\uff0c\u5c06\u667a\u80fd\u4f53 RAG \u4e2d\u201c\u7ee7\u7eed\u68c0\u7d22\u8fd8\u662f\u56de\u7b54\u201d\u7684\u51b3\u7b56\u5efa\u6a21\u4e3a\u5185\u90e8\u4fe1\u5ff5\u4e0e\u5916\u90e8\u52a8\u4f5c\u7684\u4e00\u81f4\u6027\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u8bad\u7ec3\u65f6\u7684\u9a8c\u8bc1\u5f0f\u52a8\u4f5c\u751f\u6210\u4e0e\u5185\u90e8\u4fe1\u5ff5\u63a2\u6d4b\u6784\u9020\u4e00\u81f4\u6027\u5956\u52b1\uff0c\u5e76\u7528\u7b54\u6848\u6b63\u786e\u6027\u95e8\u63a7\uff0c\u5b9e\u9a8c\u5728\u591a\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u51c6\u786e\u7387\u4e0e\u68c0\u7d22\u6548\u7387\u7684\u6743\u8861\uff0c\u4e14\u65e0\u63a8\u7406\u989d\u5916\u5f00\u9500\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24214", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24214v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "MetaRAG: Belief-Action Aligned Policy Optimization for Agentic RAG", "tldr": "\u672c\u6587\u63d0\u51fa MetaRAG\uff0c\u5c06\u667a\u80fd\u4f53 RAG \u4e2d\u201c\u7ee7\u7eed\u68c0\u7d22\u8fd8\u662f\u56de\u7b54\u201d\u7684\u51b3\u7b56\u5efa\u6a21\u4e3a\u5185\u90e8\u4fe1\u5ff5\u4e0e\u5916\u90e8\u52a8\u4f5c\u7684\u4e00\u81f4\u6027\u95ee\u9898\u3002\u65b9\u6cd5\u901a\u8fc7\u8bad\u7ec3\u65f6\u7684\u9a8c\u8bc1\u5f0f\u52a8\u4f5c\u751f\u6210\u4e0e\u5185\u90e8\u4fe1\u5ff5\u63a2\u6d4b\u6784\u9020\u4e00\u81f4\u6027\u5956\u52b1\uff0c\u5e76\u7528\u7b54\u6848\u6b63\u786e\u6027\u95e8\u63a7\uff0c\u5b9e\u9a8c\u5728\u591a\u4e2a\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u51c6\u786e\u7387\u4e0e\u68c0\u7d22\u6548\u7387\u7684\u6743\u8861\uff0c\u4e14\u65e0\u63a8\u7406\u989d\u5916\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Commercial design platforms increasingly edit documents through large language model (LLM) agents, but two practical problems block reliable deployment: legacy document formats expose only \\emph{flat}, absolutely positioned elements, so agents must recompute coordinates and routinely break layouts; and design has no unique ground truth, so diff-against-reference metrics penalize valid-but-different outputs. We present \\textbf{ACE}, an agentic canvas editor over a \\emph{hierarchical scene-graph} with a presentation-specialized action space (98 tools), paired with \\textbf{CARE}, a content-aware router that feeds the agent only the relevant slice of each deck (avg.\\ $\\sim$89\\% input-token reduction), and a \\emph{self-correction} loop driven by a \\emph{ground-truth-free} instruction-following (IF) judge whose natural-language critique is fed back as the next-turn instruction. With a fixed backbone, a scene-graph editor in a \\emph{single turn} already matches a same-backbone \\emph{agentic} HTML pipeline that iterates internally; adding self-correction lifts ACE significantly above it on instruction following (IF 4.23 vs.\\ 3.81 on the full 94-task benchmark, paired $p{=}.010$, replicated by an out-of-loop judge) at 1.75$\\times$ the speed and $\\sim$44\\% lower cost. VQ means are statistically indistinguishable, but 26 blind raters prefer ACE overall (58.7\\% decisive win-rate) and prefer the self-corrected output 81\\% of the time; the ranking is invariant across three judge families, and out-of-loop judges retain two-thirds of the self-correction gain, bounding circularity. 66\\% of cases halt after one pass, and a strict-peak rollback removes every observed regression.", "arxiv_id": "2608.24103", "arxiv_url": "https://arxiv.org/abs/2608.24103", "authors": ["JooYoung Jang", "Taegyeong Lee", "Jihyeon Park", "Nojun Kwak"], "brief": "ACE\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u591a\u9875\u6f14\u793a\u6587\u7a3f\u81ea\u52a8\u7f16\u8f91\u7684\u667a\u80fd\u4f53\u753b\u5e03\u7f16\u8f91\u5668\uff0c\u7528\u5c42\u6b21\u5316\u573a\u666f\u56fe\u548c98\u4e2a\u4e13\u7528\u5de5\u5177\u66ff\u4ee3\u6241\u5e73\u5750\u6807\u7f16\u8f91\uff0c\u5e76\u901a\u8fc7CARE\u8def\u7531\u51cf\u5c11\u7ea689%\u8f93\u5165token\u3002\u5176\u65e0\u53c2\u8003\u7b54\u6848\u7684\u6307\u4ee4\u9075\u5faa\u8bc4\u5ba1\u9a71\u52a8\u81ea\u6211\u7ea0\u9519\uff0c\u4f7f\u6307\u4ee4\u9075\u5faa\u5f97\u5206\u663e\u8457\u4f18\u4e8e\u540c\u9aa8\u5e72HTML\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u540c\u65f6\u901f\u5ea6\u63d0\u53471.75\u500d\u3001\u6210\u672c\u964d\u4f4e\u7ea644%\uff0c\u76f2\u8bc4\u4e5f\u66f4\u504f\u597dACE\u8f93\u51fa\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24103", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6587\u6863\u7f16\u8f91", "\u81ea\u6211\u7ea0\u9519", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24103v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ACE: A Self-Correcting Agentic Canvas Editor for Multi-Slide Presentation Automation", "tldr": "ACE\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u591a\u9875\u6f14\u793a\u6587\u7a3f\u81ea\u52a8\u7f16\u8f91\u7684\u667a\u80fd\u4f53\u753b\u5e03
