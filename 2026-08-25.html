const PAPERS = [{"abstract": "Outcome-supervised search agents learn when and how to retrieve evidence, but terminal rewards neither localize intermediate errors nor redirect an ongoing trajectory before those errors compound. Treating corrective feedback as a learned in-trajectory intervention couples the two roles: the agent must decide when to request and use feedback, while the critic must infer useful corrections from outcome-confounded rollouts whose failure patterns shift as the agent improves. We introduce CAFE (Coupled Agent--Feedback Evolution), a framework in which a shared-parameter model alternates between search-agent and critic roles. CAFE initializes feedback-conditioned recovery from trajectories built around the base agent\u0027s own failures, then couples online and offline optimization. During online RL, a comparative feedback estimate uses a prompt-level call--skip success gap to shape request returns, while feedback-aware advantage shaping reweights token advantages before and after feedback. Offline, rollout-derived preference optimization learns feedback from matched successful and unsuccessful trajectories. On seven agentic search benchmarks, CAFE outperforms the evaluated RL-based search agents on average, retains its gains across all six out-of-domain benchmarks, and reduces answer-level hallucinations. One-sided ablations show that improving only the agent or only the critic eventually plateaus, whereas alternating the two updates continues to improve performance. These findings suggest that a self-improving search agent needs feedback that co-evolves with the policy it guides.", "arxiv_id": "2608.24794", "arxiv_url": "https://arxiv.org/abs/2608.24794", "authors": ["Boyang Liu", "Senjie Jin", "Peixin Wang", "Zhangyue Yin", "Yibo Wang", "Yuhao Zhou", "Xinbing Liang", "Shizheng Zhu", "Yuhui Wang", "Jingqi Tong", "Zhiheng Xi", "Jiazheng Zhang", "Clive Bai", "Clarenceai", "Blaze Chen", "Tao Gui", "Qi Zhang", "Xuanjing Huang"], "brief": "\u8bb  Therefore, we introduce GameXpert-Bench, which operationalizes the three lifecycle stages as three complementary benchmark tracks. GameGen evaluates complete game creation from a single request in an empty workspace. GameFix evaluates diagnosis and repair when defects are reported or left for the agent to discover. GameOpt evaluates cumulative optimization through request chains seeded by real development trajectories between users and agents. We evaluate each track using live game interaction, deterministic behavioral tests, or final product criteria with regression checks. The suite contains 97 generation tasks across 11 genres; 100 repair tasks from 50 game levels verified by humans, each with 19-27 injected bugs; and 17 optimization chains with six turns and 102 requests. Across the three tracks, current agents are more reliable at producing playable foundations and implementing explicit requirements than at discovering defects, verifying runtime behavior, and preserving functionality across changes.", "arxiv_id": "2608.21833", "arxiv_url": "https://arxiv.org/abs/2608.21833", "authors": ["Kun Chen", "Haorong Hong", "Peizhong Gao", "Jianfeng Lin", "Tongxu Luo", "Yuxuan Xie", "Chenxu Liu", "Jieling He", "Zhongyuan Liu", "Zeno Zeng"], "brief": "\u672c\u6587\u63d0\u51fa GameXpert-Bench\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u4ee3\u7801\u667a\u80fd\u4f53\u6e38\u620f\u5f00\u53d1\u80fd\u529b\u7684\u7efc\u5408\u57fa\u51c6\u3002\u5b83\u5c06\u5b8c\u6574\u5f00\u53d1\u751f\u547d\u5468\u671f\u62c6\u5206\u4e3a\u6e38\u620f\u751f\u6210\u3001\u7f3a\u9677\u8bca\u65ad\u4fee\u590d\u3001\u591a\u8f6e\u4f18\u5316\u4e09\u4e2a\u8bc4\u6d4b\u8f68\u9053\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21833", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GameGen \u4ece\u7a7a\u5de5\u4f5c\u533a\u548c\u5355\u4e00\u81ea\u7136\u8bed\u8a00\u8bf7\u6c42\u51fa\u53d1\uff0c\u8bc4\u4f30\u5b8c\u6574\u6e38 f\u547d\u5468\u671f\uff0c\u5e76\u7ed3\u5408\u5b9e\u65f6\u6e38\u620f\u4ea4\u4e92\u3001\u786e\u5b9a\u6027\u884c\u4e3a\u6d4b\u8bd5\u548c\u56de\u5f52\u68c0\u67e5\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u5f00\u53d1\u573a\u666f\u3002\u7ed3\u679c\u663e\u793a\u5f53\u524d\u667a\u80fd\u4f53\u80fd\u8f83\u597d\u751f\u6210\u53ef\u73a9\u539f\u578b\u548c\u5b9e\u73b0\u660e\u786e\u9700\u6c42\uff0c\u4f46\u5728\u4e3b\u52a8\u53d1\u73b0\u7f3a\u9677\u3001\u9a8c\u8bc1\u8fd0\u884c\u884c\u4e3a\u548c\u8de8\u4fee\u6539\u4fdd\u6301\u529f\u80fd\u65b9\u9762\u4ecd\u660e\u663e\u4e0d\u8db3\u3002"}, {"abstract": "Recursive self-improvement (RSI) remains hard in long-horizon tasks, where growing histories obscure the task state and misalign skill invocation. We introduce Recuris, a recursive Experiential-Working Memory architecture for long-horizon agent harnesses, in which Working Memory tracks task progress and guides skill selection from Experiential Memory, grounding skill use in current needs rather than the full history. This coupling also turns execution into structured evidence that localizes failures to specific memory components. Across tasks, a fixed Meta-Agent turns that evidence into localized, validation-gated updates to Skill Memory that reshape execution and yield new evidence, forming a bounded recursive memory-evolution loop. Across four long-horizon benchmarks and ten models, Recuris improves task success in 35 of the 37 completed model-benchmark pairs, carrying frontier models to SOTA-level task success: on tau-bench it adds +17.8 points to GPT-5.6 Sol and +15.6 to Claude Opus 5, taking Opus 5 to 87.9%, and +16.6/+13.5 points on Qwen3.6-27B/35B on SkillFlow. The advantage widens as the interaction horizon grows, to +32.2 points on the longest tasks, and common long-horizon failures fall by up to 80%. These results position recursively evolving memory as a scalable foundation for RSI, enabling agents to continuously transform accumulated experience into increasingly effective long-horizon behavior. Code: https://github.com/Gen-Verse/Recuris", "arxiv_id": "2608.24876", "arxiv_url": "https://arxiv.org/abs/2608.24876", "authors": ["Zhaochen Yu", "Yingcheng Wu", "Zhenfei Yin", "Kaiyuan Chen", "Zhe Zhao", "Mengdi Wang", "Shuicheng Yan", "Ling Yang"], "brief": "\u8bba\u6587\u63d0\u51fa Recuris\uff0c\u4e00\u79cd\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u9012\u5f52\u201c\u7ecf\u9a8c-\u5de5\u4f5c\u8bb0\u5fc6\u201d\u67b6\u6784\u3002\u5b83\u7528\u5de5\u4f5c\u8bb0\u5fc6\u8ddf\u8e2a\u4efb\u52a1\u8fdb\u5ea6\uff0c\u5e76\u4ece\u7ecf\u9a8c\u8bb0\u5fc6\u4e2d\u9009\u62e9\u5408\u9002\u6280\u80fd\uff0c\u518d\u901a\u8fc7\u5143\u667a\u80fd\u4f53\u5bf9\u6280\u80fd\u8bb0\u5fc6\u8fdb\u884c\u9a8c\u8bc1\u95e8\u63a7\u66f4\u65b0\uff0c\u5f62\u6210\u53d7\u63a7\u7684\u81ea\u6211\u6539\u8fdb\u5faa\u73af\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/Gen-Verse/Recuris", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24876", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u957f\u7a0b\u6267\u884c\u5386\u53f2\u62c6\u5206\u4e3a\u5de5\u4f5c\u8bb0\u5fc6\u3001\u7ecf\u9a8c\u8bb0\u5fc6\u4e0e\u6280\u80fd\u8bb0\u5fc6\uff0c\u907f\u514d\u76f4\u63a5\u4f9d\u8d56\u5b8c\u6574\u4e0a\u4e0b\u6587\u5bfc\u81f4\u72b6\u6001\u6df7\u4e71\u548c\u6280\u80fd\u8c03\u7528\u5931\u51c6\u3002", "\u6267\u884c\u8fc7\u7a0b\u88ab\u7ed3\u6784\u5316\u4e3a\u53ef\u5b9a\u4f4d\u5931\u8d25\u7684\u8bc1\u636e\uff0c\u56fa\u5b9a Meta-Agent \u6839\u636e\u8bc1\u636e\u5bf9 Skill Memory \u505a\u5c40\u90e8\u3001\u9a8c\u8bc1\u95e8\u63a7\u7684\u66f4\u65b0\u3002", "\u57284\u4e2a\u957f\u7a0b\u57fa\u51c6\u548c10\u4e2a\u6a21\u578b\u4e0a\uff0c37\u4e2a\u5df2\u5b8c\u6210\u6a21\u578b-\u57fa\u51c6\u7ec4\u5408\u4e2d\u670935\u4e2a\u63d0\u5347\uff1b\u6700\u957f\u4efb\u52a1\u4e0a\u4f18\u52bf\u6269\u5927\u5230+32.2\u5206\uff0c\u5e38\u89c1\u5931\u8d25\u6700\u591a\u4e0b\u964d80%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1", "\u8bb0\u5fc6\u673a\ sampled queries. At each outer iteration, a frozen behavior policy generates trajectories and supplies query states and anchors. Reward gradients construct bounded positive and negative targets around each anchor. The trainable policy fits these targets as detached supervision through finite fitting before an exponential moving average update refreshes the behavior policy. This setup lets us measure target construction and finite realization separately. Controlled same-query experiments show that larger target-construction gains do not necessarily translate into larger realized gains after a single fitting update. Across SD 3.5-M and the step-distilled Z-Image-Turbo, our approach achieves the best final held-out scores in 19 of 20 reward-matched settings across two backbones and ten evaluators. It outperforms the strongest competing method by up to 44.0% and reduces training GPU-hours relative to DiffusionNFT by 40% on SD 3.5-M and 63% on Z-Image-Turbo. These results support on-policy self-distillation as an efficient and analyzable approach to diffusion post-training by converting image-level reward guidance into explicit and continually refreshed intermediate supervision, thereby opening a path toward more efficient and diagnosable alignment.", "arxiv_id": "2608.24646", "arxiv_url": "https://arxiv.org/abs/2608.24646", "authors": ["Wei Zhou", "Xiongwei Zhu", "Lingdong Kong", "Bo Chen", "Lei Zhang", "Yongyuan Liang", "Xiaoxia Hou", "Ye Tian", "Xian Sun", "Yingshuo Wang", "Linfeng Li", "Shengqiong Wu", "Leigang Qu", "Feng Li", "Wei Liu", "Julian McAuley", "Tat-Seng Chua"], "brief": "\u8bba\u6587\u63d0\u51fa DiffusionOPSD\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u6a21\u578b\u540e\u8bad\u7ec3\u7684\u5728\u7b56\u7565\u81ea\u84b8\u998f\u6846\u67b6\u3002\u5b83\u5c06\u56fe\u50cf\u7ea7\u5956\u52b1\u4fe1\u53f7\u8f6c\u5316\u4e3a\u4e2d\u95f4\u53bb\u566a\u6b65\u9aa4\u4e2d\u5e72\u51c0\u8f93\u51fa\u9884\u6d4b\u7684\u663e\u5f0f\u76d1\u7763\u76ee\u6807\uff0c\u5e76\u6301\u7eed\u5237\u65b0\u884c\u4e3a\u7b56\u7565\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/worldbench/DiffusionOPSD", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24646", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u51bb\u7ed3\u7684\u884c\u4e3a\u7b56\u7565\u751f\u6210\u8f68\u8ff9\u3001\u67e5\u8be2\u72b6\u6001\u548c\u951a\u70b9\uff0c\u518d\u7531\u5956\u52b1\u68af\u5ea6\u6784\u9020\u6709\u754c\u7684\u6b63\u8d1f\u8bad\u7ec3\u76ee\u6807\u3002", "\u53ef\u8bad\u7ec3\u7b56\u7565\u901a\u8fc7\u6709\u9650\u6b65\u62df\u5408\u8fd9\u4e9b detached \u76ee\u6807\uff0c\u968f\u540e\u7528\u6307\u6570\u6ed1\u52a8\u5e73\u5747\u66f4\u65b0\u884c\u4e3a\u7b56\u7565\uff0c\u5b9e\u73b0\u76ee\u6807\u6784\u9020\u4e0e\u5b9e\u9645\u62df\u5408\u6548\u679c\u7684\u5206\u79bb\u5206\u6790\u3002", "\u5728 SD 3.5-M \u548c Z-Image-Turbo \u4e0a\uff0c\u8de8\u4e24\u4e2a\u9aa8\u5e72\u548c\u5341\u4e2a\u8bc4\u4f30\u5668\u7684 20 \u4e2a\u5956\u52b1\u5339\u914d\u8bbe\u7f6e\u4e2d\uff0c\u6709 19 \u4e2a\u53d6\u5f97\u6700\u4f73\u6700\u7ec8 held-out \u5206\u6570\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "\u6a21\u578b\u5bf9\u9f50"], "num_comments": 1, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.24646v1", "published_at": "2026-08-25", "score": 0.471, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24646.png", "title": "On-Policy Self-Distillation in Diffusion Models", "tldr": "\u7528\u5728\u7b56\u7565\u81ea\u84b8\u998f\u9ad8\u6548\u5bf9\u9f50\u6269\u6563\u6a21\u578b", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa DiffusionOPSD\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u6a21\u578b\u540e\u8bad\u7ec3\u7684\u5728\u7b56\u7565\u81ea\u84b8\u998f\u6846\u67b6\u3002\u5b83\u5c06\u56fe\u50cf\u7ea7\u5956\u52b1\u4fe1\u53f7\u8f6c\u5316\u4e3a\u4e2d\u95f4\u53bb\u566a\u6b65\u9aa4\u4e2d\u5e72\u51c0\u8f93\u51fa\u9884\u6d4b\u7684\u663e\u5f0f\u76d1\u7763\u76ee\u6807\uff0c\u5e76\u6301\u7eed\u5237\u65b0\u884c\u4e3a\u7b56\u7565\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u7aef\u70b9\u56fe\u50cf\u5956\u52b1\u8f6c\u5316\u4e3a\u53ef\u8bca\u65ad\u7684\u4e2d\u95f4\u76d1\u7763\uff0c\u7f13\u89e3\u4e86\u6269\u6563\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u5956\u52b1\u96be\u4ee5\u6307\u5bfc\u6bcf\u6b65\u53bb\u566a\u7684\u95ee\u9898\uff1b\u540c\u65f6\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u6700\u9ad8\u63d0\u5347 44.0%\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u8bad\u7ec3 GPU \u5c0f\u65f6\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Open-ended real-world interaction admits multiple valid behaviors: an agent may answer directly, ask for clarification, provide progress updates, or confirm before acting. This flexibility breaks a core assumption behind group-based RL: rollouts compared within a group are no longer guaranteed to be behaviorally comparable. As a result, reward-model preferences over interaction style can distort relative advantages and steer optimization toward reward-preferred behaviors rather than context-appropriate ones. We formalize this as a \\textit{reward fairness problem} and propose \\textbf{ARC} (Advantage Regularization via Conditioning), a training recipe that restores fairer relative comparison through strategy-conditioned rollout grouping, together with hybrid rewards and entropy regularization. We study ARC in our proposed \\inter, a novel paradigm for responsive, steerable, and execution-aware user-agent interaction that decouples user-visible communication from latent reasoning and tool use. \\inter\\ also provides the annotation and distillation pipeline for constructing \\inter-86K, our strategy-annotated training corpus for supervised and RL training. Empirically, ARC substantially strengthens the core $\u03c4/\u03c4^2$ tool-use benchmarks, while \\inter\\ reduces time-to-first-token from 4.91s to 1.27s relative to a think-style baseline. Together, these results suggest that a central bottleneck in open-ended interactive learning is not only how agents are rewarded, but whether their behaviors are compared fairly in the first place. The ARC implementation and \\inter-86K training data will be released.", "arxiv_id": "2608.13622", "arxiv_url": "https://arxiv.org/abs/2608.13622", "authors": ["Yongqi Tong", "Tan Li Hui Faith", "Choy Zhen Wen Marcus", "Zhou Jin", "Kewei Fu", "Jiang-Ming Yang", "Jianshe Li", "Xin Zhang"], "brief": "\u8bba\u6587\u63d0\u51faARC\uff08Advantage Regularization via Conditioning\uff09\uff0c\u901a\u8fc7\u6309\u4ea4\u4e92\u7b56\u7565\u6761\u4ef6\u5316\u5206\u7ec4rollout\uff0c\u7f13\u89e3\u5f00\u653e\u5f0f\u7528\u6237-\u667a\u80fd\u4f53\u4ea4\u4e92\u4e2d\u4e0d\u540c\u6709\u6548\u884c\u4e3a\u88ab\u4e0d\u516c\u5e73\u6bd4\u8f83\u7684\u95ee\u9898\u3002\u540c\u65f6\u6784\u5efa\u4e86INTER\u4ea4\u4e92\u8303\u5f0f\u4e0eINTER-86K\u7b56\u7565\u6807\u6ce8\u8bad\u7ec3\u8bed\u6599\uff0c\u7528\u4e8e\u76d1\u7763\u5b66\u4e60\u548c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13622", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7ec4\u5185RL\u5728\u5f00\u653e\u5f0f\u4ea4\u4e92\u4e2d\u7684\u504f\u5dee\u5f62\u5f0f\u5316\u4e3a\u201c\u5956\u52b1\u516c\u5e73\u6027\u95ee\u9898\u201d\uff1a\u5956\u52b1\u6a21\u578b\u53ef\u80fd\u504f\u597d\u67d0\u79cd\u4ea4\u4e92\u98ce\u683c\uff0c\u800c\u975e\u771f\u6b63\u9002\u5408\u4e0a\u4e0b\u6587\u7684\u884c\u4e3a", "ARC\u91c7\u7528\u7b56\u7565\u6761\u4ef6\u5316rollout\u5206\u7ec4\uff0c\u7ed3\u5408\u6df7\u5408\u5956\u52b1\u4e0e\u71b5\u6b63\u5219\uff0c\u4f7f\u76f8\u5bf9\u4f18\u52bf\u4f30\u8ba1\u5728\u884c\u4e3a\u53ef\u6bd4\u7684\u6837\u672c\u95f4\u8fdb\u884c", "\u5b9e\u9a8c\u663e\u793aARC\u63d0\u5347\u03c4/\u03c4\u00b2\u5de5\u5177\u4f7f\u7528\u57fa\u51c6\u8868\u73b0\uff0cINTER\u5c06\u9996token\u5ef6\u8fdf\u4ece4.91\u79d2\u964d\u81f31.27\u79d2"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u5efa\u6a21", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": "ant-international", "pdf_url": "https://arxiv.org/pdf/2608.13622v1", "published_at": "2026-08-13", "score": 0.429, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13622.png", "title": "ARC: Fair Relative Advantage Comparison in Open-Ended Real-World Interaction", "tldr": "ARC\u8ba9\u5f00\u653e\u5f0f\u4ea4\u4e92\u4e2d\u7684RL\u4f18\u52bf\u6bd4\u8f83\u66f4\u516c\u5e73", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51faARC\uff08Advantage Regularization via Conditioning\uff09\uff0c\u901a\u8fc7\u6309\u4ea4\u4e92\u7b56\u7565\u6761\u4ef6\u5316\u5206\u7ec4rollout\uff0c\u7f13\u89e3\u5f00\u653e\u5f0f\u7528\u6237-\u667a\u80fd\u4f53\u4ea4\u4e92\u4e2d\u4e0d\u540c\u6709\u6548\u884c\u4e3a\u88ab\u4e0d\u516c\u5e73\u6bd4\u8f83\u7684\u95ee\u9898\u3002\u540c\u65f6\u6784\u5efa\u4e86INTER\u4ea4\u4e92\u8303\u5f0f\u4e0eINTER-86K\u7b56\u7565\u6807\u6ce8\u8bad\u7ec3\u8bed\u6599\uff0c\u7528\u4e8e\u76d1\u7763\u5b66\u4e60\u548c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f00\u653e\u5f0f\u667a\u80fd\u4f53RL\u7684\u5173\u952e\u74f6\u9888\u4e0d\u4ec5\u662f\u5956\u52b1\u8bbe\u8ba1\uff0c\u8fd8\u5305\u62ec\u201c\u6bd4\u8f83\u5bf9\u8c61\u662f\u5426\u516c\u5e73\u201d\u3002\u8fd9\u5bf9\u5de5\u5177\u4f7f\u7528\u3001\u53ef\u63a7\u4ea4\u4e92\u548c\u771f\u5b9e\u7528\u6237\u573a\u666f\u4e2d\u7684LLM\u667a\u80fd\u4f53\u8bad\u7ec3\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Training multi-turn LLM agents with reinforcement learning typically relies on trajectory-level rewards, which assign a uniform advantage to every step and cannot identify which decisions led to success or failure. Self-distillation methods can provide finer-grained supervision by augmenting RL with privileged information. However, existing approaches usually apply the same type of privileged information to every step in an indistinguishable manner, ignoring a key asymmetry: routine steps need little additional guidance, while critical error steps require corrective direction that environment feedback alone cannot provide. We propose AHEAD, a step-aware framework that matches different supervision sources to different step types. The teacher receives environment feedback on all steps as a grounded dense signal, and additionally receives LLM-generated corrective hints on error steps to supply the direction that environment feedback lacks. The method introduces minimal changes to the standard GRPO algorithm. Across ALFWorld, WebShop, and Search-based QA, and across three model scales, AHEAD raises task success (+13.3 points on ALFWorld and +11.0 on WebShop at 7B over GRPO), reaches a given success rate in fewer training steps, and solves tasks within tighter interaction budgets than outcome-only RL and prior self-distillation baselines.", "arxiv_id": "2608.24114", "arxiv_url": "https://arxiv.org/abs/2608.24114", "authors": ["Xiaolong Jin", "Dingmin Wang", "Vijay Lingam", "Varun Kumar"], "brief": "\u8bba\u6587\u63d0\u51fa AHEAD\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u5206\u6b65\u611f\u77e5\u6846\u67b6\uff0c\u6839\u636e\u6b65\u9aa4\u7c7b\u578b\u5339\u914d\u4e0d\u540c\u76d1\u7763\u4fe1\u53f7\u3002\u5b83\u5728\u5e38\u89c4\u6b65\u9aa4\u4f7f\u7528\u73af\u5883\u53cd\u9988\uff0c\u5728\u9519\u8bef\u5173\u952e\u6b65\u9aa4\u989d\u5916\u5f15\u5165LLM\u751f\u6210\u7684\u7ea0\u9519\u63d0\u793a\uff0c\u5e76\u4ee5\u8f83\u5c0f\u6539\u52a8\u96c6\u6210\u5230GRPO\u4e2d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24114", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u8f68\u8ff9\u7ea7\u5956\u52b1\u65e0\u6cd5\u5b9a\u4f4d\u5173\u952e\u51b3\u7b56\u8d23\u4efb\u7684\u95ee\u9898\uff0c\u5f15\u5165\u9010\u6b65\u5dee\u5f02\u5316\u76d1\u7763", "\u6559\u5e08\u6a21\u578b\u5bf9\u6240\u6709\u6b65\u9aa4\u63a5\u6536\u73af\u5883\u53cd\u9988\uff0c\u5bf9\u9519\u8bef\u6b65\u9aa4\u989d\u5916\u63a5\u6536\u7ea0\u9519\u63d0\u793a", "\u5728ALFWorld\u3001WebShop\u548cSearch-based QA\u4e0a\uff0c\u76f8\u6bd4GRPO\u663e\u8457\u63d0\u5347\u6210\u529f\u7387\u5e76\u51cf\u5c11\u8bad\u7ec3\u4e0e\u4ea4\u4e92\u9884\u7b97"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u84b8\u998f", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24114v1", "published_at": "2026-08-25", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AHEAD: Adaptive Hindsight with Environment-Augmented Distillation for Agentic RL", "tldr": "AHEAD\u4e3a\u591a\u6b65LLM\u667a\u80fd\u4f53\u63d0\u4f9b\u5206\u6b65\u81ea\u9002\u5e94\u84b8\u998f\u76d1\u7763", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AHEAD\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u5206\u6b65\u611f\u77e5\u6846\u67b6\uff0c\u6839\u636e\u6b65\u9aa4\u7c7b\u578b\u5339\u914d\u4e0d\u540c\u76d1\u7763\u4fe1\u53f7\u3002\u5b83\u5728\u5e38\u89c4\u6b65\u9aa4\u4f7f\u7528\u73af\u5883\u53cd\u9988\uff0c\u5728\u9519\u8bef\u5173\u952e\u6b65\u9aa4\u989d\u5916\u5f15\u5165LLM\u751f\u6210\u7684\u7ea0\u9519\u63d0\u793a\uff0c\u5e76\u4ee5\u8f83\u5c0f\u6539\u52a8\u96c6\u6210\u5230GRPO\u4e2d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u6293\u4f4f\u4e86\u591a\u8f6e\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u201c\u5e38\u89c4\u6b65\u9aa4\u201d\u548c\u201c\u5173\u952e\u9519\u8bef\u6b65\u9aa4\u201d\u6240\u9700\u76d1\u7763\u4e0d\u540c\u7684\u975e\u5bf9\u79f0\u6027\uff0c\u5728\u4fdd\u6301GRPO\u6846\u67b6\u7b80\u6d01\u7684\u540c\u65f6\u63d0\u5347\u6837\u672c\u6548\u7387\u4e0e\u4efb\u52a1\u6210\u529f\u7387\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u667a\u80fd\u4f53RL\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The emerging W3C WebMCP proposal enables LLM agents to invoke tools exposed by web pages. In multi-party web environments, however, integrating agent execution into a browser security model centered on the Same-Origin Policy (SOP) leaves insufficient provenance and lifecycle guarantees for agent-accessible tools, creating three risks: subject-attribution spoofing, uncontrolled tool lifecycles, and semantic prompt injection. We propose WebMCP-Phalanx, a dual-layer agent runtime architecture. Its first layer provides a browser-native trust anchor that binds each tool to its registering principal through cryptographically protected capability credentials and propagates provenance labels throughout the tool lifecycle. Its second layer separates semantic inspection from privileged tool use. A Quarantine Agent (Q-LLM), without tool invocation authority, inspects tool metadata, outputs, and page-supplied content for prompt injection. Validated content is then forwarded to a Privileged Agent (P-LLM) for execution, while the Q-LLM\u0027s internal state remains hidden from page scripts. Empirical evaluation shows that the browser-native ownership mechanism reduces revocation and overwrite attack success from 100\\% to 0\\%. The dual-agent runtime blocks all 80 prompt-injection attempts embedded in tool descriptions and limits tool-return attacks to 2 successful cases out of 80. Across experiments, task utility remains statistically indistinguishable from the no-attack baseline. Under a white-box adaptive attacker, however, description-based filtering can be bypassed through malicious tool names invoked before inspection. This finding motivates a call-timing gate that delays tool invocation until all agent-visible tool metadata has been validated.", "arxiv_id": "2608.24017", "arxiv_url": "https://arxiv.org/abs/2608.24017", "authors": ["Lin-Fa Lee", "YI-YU Chang", "Kuo-Hui Yeh"], "brief": "\u8bba\u6587\u63d0\u51fa WebMCP-Phalanx\uff0c\u4e00\u79cd\u9762\u5411\u6d4f\u89c8\u5668\u96c6\u6210 LLM \u667a\u80fd\u4f53\u7684\u53cc\u5c42\u8fd0\u884c\u65f6\u67b6\u6784\uff0c\u7528\u4e8e\u5728 WebMCP \u5de5\u5177\u8c03\u7528\u573a\u666f\u4e2d\u5f3a\u5316\u5de5\u5177\u5f52\u5c5e\u3001\u751f\u547d\u5468\u671f\u4e0e\u63d0\u793a\u6ce8\u5165\u9632\u62a4\u3002\u5b83\u7ed3\u5408\u6d4f\u89c8\u5668\u539f\u751f\u80fd\u529b\u51ed\u8bc1\u4e0e\u53cc\u667a\u80fd\u4f53\u9694\u79bb\u673a\u5236\uff0c\u5c06\u5de5\u5177\u9a8c\u8bc1\u4e0e\u7279\u6743\u6267\u884c\u5206\u79bb\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24017", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7b2c\u4e00\u5c42\u901a\u8fc7\u52a0\u5bc6\u4fdd\u62a4\u7684 capability credentials \u5c06\u6bcf\u4e2a\u5de5\u5177\u7ed1\u5b9a\u5230\u6ce8\u518c\u4e3b\u4f53\uff0c\u5e76\u5728\u5de5\u5177\u751f\u547d\u5468\u671f\u4e2d\u4f20\u64ad provenance \u6807\u7b7e\uff0c\u9632\u6b62\u4e3b\u4f53\u5f52\u5c5e\u4f2a\u9020\u548c\u5de5\u5177\u8986\u76d6/\u64a4\u9500\u653b\u51fb\u3002", "\u7b2c\u4e8c\u5c42\u5f15\u5165\u65e0\u5de5\u5177\u8c03\u7528\u6743\u9650\u7684 Quarantine Agent \u68c0\u67e5\u5de5\u5177\u5143\u6570\u636e\u3001\u8fd4\u56de\u5185\u5bb9\u548c\u7f51\u9875\u5185\u5bb9\uff0c\u518d\u5c06\u901a\u8fc7\u9a8c\u8bc1\u7684\u4fe1\u606f\u4ea4\u7ed9 Privileged Agent \u6267\u884c\u3002", "\u5b9e\u9a8c\u4e2d\u5de5\u5177\u64a4\u9500\u548c\u8986\u76d6\u653b\u51fb\u6210\u529f\u7387\u4ece 100% \u964d\u81f3 0%\uff0c80 \u4e2a\u5de5\u5177\u63cf\u8ff0\u63d0\u793a\u6ce8\u5165\u5168\u90e8\u88ab\u963b\u65ad\uff0c\u5de5\u5177\u8fd4\u56de\u6ce8\u5165\u4ec5 2/80 \u6210\u529f\uff0c\u4efb\u52a1\u6548\u7528\u57fa\u672c\u4e0d\u53d7\u5f71\u54cd\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6d4f\u89c8\u5668\u5b89\u5168", "\u63d0\u793a\u6ce8\u5165", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24017v1", "published_at": "2026-08-25", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WebMCP-Phalanx: Enforcing and Characterizing Trust Boundaries for Browser-Integrated LLM Agents", "tldr": "\u4e3a\u6d4f\u89c8\u5668LLM\u667a\u80fd\u4f53\u5efa\u7acb\u5de5\u5177\u4fe1\u4efb\u8fb9\u754c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WebMCP-Phalanx\uff0c\u4e00\u79cd\u9762\u5411\u6d4f\u89c8\u5668\u96c6\u6210 LLM \u667a\u80fd\u4f53\u7684\u53cc\u5c42\u8fd0\u884c\u65f6\u67b6\u6784\uff0c\u7528\u4e8e\u5728 WebMCP \u5de5\u5177\u8c03\u7528\u573a\u666f\u4e2d\u5f3a\u5316\u5de5\u5177\u5f52\u5c5e\u3001\u751f\u547d\u5468\u671f\u4e0e\u63d0\u793a\u6ce8\u5165\u9632\u62a4\u3002\u5b83\u7ed3\u5408\u6d4f\u89c8\u5668\u539f\u751f\u80fd\u529b\u51ed\u8bc1\u4e0e\u53cc\u667a\u80fd\u4f53\u9694\u79bb\u673a\u5236\uff0c\u5c06\u5de5\u5177\u9a8c\u8bc1\u4e0e\u7279\u6743\u6267\u884c\u5206\u79bb\u3002", "why_notable": "\u968f\u7740\u6d4f\u89c8\u5668\u539f\u751f LLM \u667a\u80fd\u4f53\u548c WebMCP \u5de5\u5177\u8c03\u7528\u5174\u8d77\uff0c\u7f51\u9875\u591a\u65b9\u73af\u5883\u4e2d\u7684\u5b89\u5168\u8fb9\u754c\u53d8\u5f97\u5173\u952e\u3002\u8be5\u5de5\u4f5c\u628a\u4f20\u7edf\u6d4f\u89c8\u5668\u5b89\u5168\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u7ed3\u5408\uff0c\u7cfb\u7edf\u523b\u753b\u5e76\u7f13\u89e3\u5de5\u5177 provenance\u3001\u751f\u547d\u5468\u671f\u548c\u8bed\u4e49\u63d0\u793a\u6ce8\u5165\u98ce\u9669\uff0c\u5bf9\u672a\u6765 Web \u667a\u80fd\u4f53\u6807\u51c6\u5316\u548c\u5b89\u5168\u90e8\u7f72\u5177\u6709\u73b0\u5b9e\u610f\u4e49\u3002"}, {"abstract": "Answering developer questions about a software repository is a critical yet under-explored problem in software engineering. While existing repository understanding methods have advanced the field, they predominantly rely on surface-level code retrieval and lack the ability for deep reasoning over multiple files, complex software architectures, and grounding answers in long-range code dependencies. To address these limitations, we propose DeepRepoQA, a novel question answering (QA) framework for repository-level code understanding. DeepRepoQA builds on an agentic framework where LLM agents find answers through a systematic tree search over the repository structure. A Monte-Carlo Tree Search (MCTS) mechanism is employed to empower agents to dynamically search, navigate, and inspect code, enabling effective multi-hop reasoning over long-range code dependencies. Comprehensive experiments on the SWE-QA benchmark demonstrate substantial performance gains over strong baselines, validating the effectiveness of systematic MCTS-guided exploration for multi-hop repository reasoning.", "arxiv_id": "2608.24221", "arxiv_url": "https://arxiv.org/abs/2608.24221", "authors": ["Weihan Peng", "Yuling Shi", "Yingwei Ma", "Longfei Yun", "Beijun Shen", "Xiaodong Gu"], "brief": "DeepRepoQA \u662f\u4e00\u4e2a\u9762\u5411\u4ee3\u7801\u4ed3\u5e93\u7ea7\u95ee\u7b54\u7684\u6846\u67b6\uff0c\u8ba9 LLM \u667a\u80fd\u4f53\u901a\u8fc7\u6811\u641c\u7d22\u7cfb\u7edf\u6027\u6d4f\u89c8\u4ed3\u5e93\u7ed3\u6784\u3001\u5b9a\u4f4d\u76f8\u5173\u6587\u4ef6\u5e76\u751f\u6210\u7b54\u6848\u3002\u5b83\u91cd\u70b9\u89e3\u51b3\u8de8\u6587\u4ef6\u3001\u957f\u8ddd\u79bb\u4f9d\u8d56\u548c\u590d\u6742\u67b6\u6784\u4e0b\u7684\u591a\u8df3\u4ee3\u7801\u7406\u89e3\u95ee\u9898\u3002", "categories": ["cs.SE", "cs.CL", "cs.PL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24221", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528 Monte-Carlo Tree Search\uff08MCTS\uff09\u5f15\u5bfc\u667a\u80fd\u4f53\u5728\u4ed3\u5e93\u4e2d\u52a8\u6001\u641c\u7d22\u3001\u5bfc\u822a\u548c\u68c0\u67e5\u4ee3\u7801", "\u76f8\u6bd4\u8868\u5c42\u68c0\u7d22\u65b9\u6cd5\uff0c\u66f4\u5f3a\u8c03\u8de8\u6587\u4ef6\u4f9d\u8d56\u8ffd\u8e2a\u4e0e\u591a\u8df3\u63a8\u7406", "\u5728 SWE-QA \u57fa\u51c6\u4e0a\u76f8\u8f83\u5f3a\u57fa\u7ebf\u53d6\u5f97\u663e\u8457\u6027\u80fd\u63d0\u5347"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u7406\u89e3", "\u4ee3\u7801\u95ee\u7b54", "\u6811\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24221v1", "published_at": "2026-08-25", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DeepRepoQA: Code Repository Question Answering with Deep Agent Exploration", "tldr": "\u7528MCTS\u667a\u80fd\u4f53\u6df1\u5ea6\u63a2\u7d22\u4ee3\u7801\u4ed3\u5e93\u95ee\u7b54", "upvotes": 0, "what_it_is": "DeepRepoQA \u662f\u4e00\u4e2a\u9762\u5411\u4ee3\u7801\u4ed3\u5e93\u7ea7\u95ee\u7b54\u7684\u6846\u67b6\uff0c\u8ba9 LLM \u667a\u80fd\u4f53\u901a\u8fc7\u6811\u641c\u7d22\u7cfb\u7edf\u6027\u6d4f\u89c8\u4ed3\u5e93\u7ed3\u6784\u3001\u5b9a\u4f4d\u76f8\u5173\u6587\u4ef6\u5e76\u751f\u6210\u7b54\u6848\u3002\u5b83\u91cd\u70b9\u89e3\u51b3\u8de8\u6587\u4ef6\u3001\u957f\u8ddd\u79bb\u4f9d\u8d56\u548c\u590d\u6742\u67b6\u6784\u4e0b\u7684\u591a\u8df3\u4ee3\u7801\u7406\u89e3\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7cfb\u7edf\u6027\u641c\u7d22\u4e0e LLM \u4ee3\u7801\u7406\u89e3\u7ed3\u5408\u8d77\u6765\uff0c\u4e3a\u4ed3\u5e93\u7ea7\u5f00\u53d1\u8005\u95ee\u7b54\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u63a8\u7406\u8def\u5f84\uff0c\u5177\u5907\u63d0\u5347\u4ee3\u7801\u52a9\u624b\u3001\u4ee3\u7801\u5ba1\u67e5\u548c\u8f6f\u4ef6\u7ef4\u62a4\u5de5\u5177\u80fd\u529b\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Self-improving LLM agents refine answers, not the process that produces those answers. Systems that add a meta-level hold that level fixed, and those that edit themselves must leave part of their own editing machinery untouched to stay stable, capping the meta-depth they realize at roughly two. We present Meta$^n$, which keeps the meta-operation fixed and recurses on its input instead. That operation, $\u03a9$, is applied repeatedly to its own products, reading the traces of the solver stack below together with the code that produced them, then writing the next layer as a strategic pre-process and a library of callable helpers. Because $\u03a9$ never changes, it cannot destabilize the system, and because its input strictly grows, each layer reasons from a higher vantage than the last. Depth is set by convergence rather than fixed in advance, and an evolutionary archive searches over layer chains. Across two backbones, Meta$^n$ outperforms prior self-improving agents on all eight benchmark families. The sharpest case is ARC-AGI-2, built to resist skill memorization, where it alone scores above zero. Ablations indicate that most of the gain from recursion comes from the conditioning each layer passes to the next, and distinct layer roles emerge with depth although no prompt prescribes them. Code available at https://github.com/minnesotanlp/meta-n", "arxiv_id": "2608.24735", "arxiv_url": "https://arxiv.org/abs/2608.24735", "authors": ["Zae Myung Kim", "Young-Jun Lee", "Seungyeon Jwa", "Dongyeop Kang"], "brief": "\u8bba\u6587\u63d0\u51fa Meta^n\uff1a\u56fa\u5b9a\u4e00\u4e2a\u5143\u64cd\u4f5c \u03a9\uff0c\u4e0d\u76f4\u63a5\u6539\u5199\u81ea\u8eab\uff0c\u800c\u662f\u9012\u5f52\u8bfb\u53d6\u4e0b\u5c42\u6c42\u89e3\u8f68\u8ff9\u4e0e\u4ee3\u7801\uff0c\u751f\u6210\u66f4\u9ad8\u5c42\u7684\u7b56\u7565\u9884\u5904\u7406\u4e0e\u53ef\u8c03\u7528\u5de5\u5177\u5e93\u3002\u7cfb\u7edf\u6df1\u5ea6\u7531\u6536\u655b\u81ea\u52a8\u51b3\u5b9a\uff0c\u5e76\u7528\u8fdb\u5316\u6863\u6848\u641c\u7d22\u4e0d\u540c\u5c42\u94fe\u3002", "categories": ["cs.AI", "cs.CL", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24735", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u56fa\u5b9a \u03a9 \u907f\u514d\u81ea\u4fee\u6539\u5e26\u6765\u7684\u4e0d\u7a33\u5b9a\uff0c\u540c\u65f6\u8ba9\u8f93\u5165\u968f\u5c42\u6570\u589e\u957f\uff0c\u4f7f\u540e\u7eed\u5c42\u80fd\u4ece\u66f4\u9ad8\u89c6\u89d2\u63a8\u7406\u3002", "\u5728\u4e24\u4e2a\u57fa\u7840\u6a21\u578b\u548c\u516b\u7c7b\u57fa\u51c6\u4e0a\u8d85\u8fc7\u65e2\u6709\u81ea\u6539\u8fdb\u667a\u80fd\u4f53\uff0cARC-AGI-2 \u4e0a\u8868\u73b0\u5c24\u4e3a\u7a81\u51fa\uff0c\u662f\u552f\u4e00\u53d6\u5f97\u975e\u96f6\u5206\u7684\u7cfb\u7edf\u3002", "\u6d88\u878d\u663e\u793a\u9012\u5f52\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u5c42\u95f4\u4f20\u9012\u7684\u6761\u4ef6\u4fe1\u606f\uff0c\u4e0d\u540c\u5c42\u4f1a\u81ea\u53d1\u5f62\u6210\u5206\u5de5\u89d2\u8272\uff0c\u800c\u975e\u7531\u63d0\u793a\u8bcd\u9884\u5148\u6307\u5b9a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u6211\u6539\u8fdb", "\u9012\u5f52\u63a8\u7406", "\u5143\u5b66\u4e60"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24735v1", "published_at": "2026-08-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24735.png", "title": "Meta$^n$: Recursive Self-Improvement through Emergent Depth", "tldr": "\u9012\u5f52\u5143\u64cd\u4f5c\u8ba9LLM\u667a\u80fd\u4f53\u81ea\u6211\u589e\u6df1\u6539\u8fdb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Meta^n\uff1a\u56fa\u5b9a\u4e00\u4e2a\u5143\u64cd\u4f5c \u03a9\uff0c\u4e0d\u76f4\u63a5\u6539\u5199\u81ea\u8eab\uff0c\u800c\u662f\u9012\u5f52\u8bfb\u53d6\u4e0b\u5c42\u6c42\u89e3\u8f68\u8ff9\u4e0e\u4ee3\u7801\uff0c\u751f\u6210\u66f4\u9ad8\u5c42\u7684\u7b56\u7565\u9884\u5904\u7406\u4e0e\u53ef\u8c03\u7528\u5de5\u5177\u5e93\u3002\u7cfb\u7edf\u6df1\u5ea6\u7531\u6536\u655b\u81ea\u52a8\u51b3\u5b9a\uff0c\u5e76\u7528\u8fdb\u5316\u6863\u6848\u641c\u7d22\u4e0d\u540c\u5c42\u94fe\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a LLM \u667a\u80fd\u4f53\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u63d0\u4f9b\u4e86\u66f4\u7a33\u5b9a\u7684\u7ed3\u6784\u5316\u8def\u5f84\uff0c\u7ed5\u5f00\u76f4\u63a5\u81ea\u7f16\u8f91\u7684\u5143\u5c42\u6df1\u5ea6\u74f6\u9888\uff0c\u5e76\u5728\u6297\u8bb0\u5fc6\u5316\u63a8\u7406\u57fa\u51c6\u4e0a\u663e\u793a\u51fa\u6f5c\u5728\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Tool-augmented language models are bounded by the APIs humans bothered to write; existing tool-creation systems patch this by prompting a frozen LLM at inference time, leaving the model that writes a tool decoupled from the one that uses it, with no signal that the schemas it produces are schemas it can invoke. We propose SMITH (Schema-grounded Multi-task Iterative Tool Honing), a reinforcement learning framework that jointly trains tool creation and tool use inside a single policy. Each rollout is either a build task (write a tool from a few examples) or a use task (invoke a pooled tool on a held-out question). Three separate reward axes catch schema, code, and outcome failures independently, so each failure mode contributes its own gradient. A 4B Qwen3 trained with SMITH on 13 procedural reasoning tasks with exact verifiers reaches 79.8 macro-average accuracy on held-out tasks, the best across all evaluated methods and ahead of an untrained 30B-A3B tool-writer. It also reaches 40.4 on TabMWP-Hard and 42.6 on out-of-domain GQA (+7.6 over the best same-backbone inference-time baseline), without any visual or tabular training data. Tools written by our 4B models also lifted the performance of LFM-2.5-350M and Qwen3-30B-A3B under same reasoning tasks.", "arxiv_id": "2608.24571", "arxiv_url": "https://arxiv.org/abs/2608.24571", "authors": ["Zhi Rui Tam", "Chieh-Yen Lin", "Yun-Nung Chen", "Shao-Hua Sun", "Hung-yi Lee"], "brief": "\u8bba\u6587\u63d0\u51fa SMITH\uff0c\u4e00\u4e2a\u5728\u5355\u4e00\u7b56\u7565\u5185\u8054\u5408\u8bad\u7ec3\u5de5\u5177\u751f\u6210\u4e0e\u5de5\u5177\u4f7f\u7528\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u8ba9 LLM \u5728\u6784\u5efa\u4efb\u52a1\u4e2d\u6839\u636e\u793a\u4f8b\u7f16\u5199\u5de5\u5177\uff0c\u5728\u4f7f\u7528\u4efb\u52a1\u4e2d\u8c03\u7528\u5de5\u5177\u56de\u7b54\u65b0\u95ee\u9898\uff0c\u5e76\u901a\u8fc7\u591a\u7ef4\u5956\u52b1\u5206\u522b\u4f18\u5316 schema\u3001\u4ee3\u7801\u4e0e\u6700\u7ec8\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24571", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u5de5\u5177\u521b\u5efa\u8005\u4e0e\u5de5\u5177\u8c03\u7528\u8005\u7edf\u4e00\u4e3a\u540c\u4e00\u4e2a\u53ef\u8bad\u7ec3\u7b56\u7565\uff0c\u907f\u514d\u63a8\u7406\u65f6\u51bb\u7ed3\u6a21\u578b\u751f\u6210\u5de5\u5177\u4e0e\u4f7f\u7528\u5de5\u5177\u4e4b\u95f4\u7684\u8131\u8282", "\u8bbe\u8ba1 schema\u3001\u4ee3\u7801\u3001\u7ed3\u679c\u4e09\u7c7b\u72ec\u7acb\u5956\u52b1\u4fe1\u53f7\uff0c\u4f7f\u4e0d\u540c\u5931\u8d25\u6a21\u5f0f\u90fd\u80fd\u63d0\u4f9b\u660e\u786e\u68af\u5ea6", "4B Qwen3 \u5728 13 \u4e2a\u7a0b\u5e8f\u5316\u63a8\u7406\u4efb\u52a1\u4e0a\u8fbe\u5230 79.8 \u5b8f\u5e73\u5747\u51c6\u786e\u7387\uff0c\u5e76\u5728 TabMWP-Hard \u4e0e\u57df\u5916 GQA \u4e0a\u4f18\u4e8e\u540c\u9aa8\u5e72\u63a8\u7406\u65f6\u57fa\u7ebf"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24571v1", "published_at": "2026-08-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Joint Optimization of Tool Creation and Use for Large Language Model Agents", "tldr": "SMITH\u8054\u5408\u5f3a\u5316\u5b66\u4e60\u5de5\u5177\u521b\u5efa\u4e0e\u8c03\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SMITH\uff0c\u4e00\u4e2a\u5728\u5355\u4e00\u7b56\u7565\u5185\u8054\u5408\u8bad\u7ec3\u5de5\u5177\u751f\u6210\u4e0e\u5de5\u5177\u4f7f\u7528\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u8ba9 LLM \u5728\u6784\u5efa\u4efb\u52a1\u4e2d\u6839\u636e\u793a\u4f8b\u7f16\u5199\u5de5\u5177\uff0c\u5728\u4f7f\u7528\u4efb\u52a1\u4e2d\u8c03\u7528\u5de5\u5177\u56de\u7b54\u65b0\u95ee\u9898\uff0c\u5e76\u901a\u8fc7\u591a\u7ef4\u5956\u52b1\u5206\u522b\u4f18\u5316 schema\u3001\u4ee3\u7801\u4e0e\u6700\u7ec8\u7ed3\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u4f1a\u5199\u5de5\u5177\u201d\u548c\u201c\u4f1a\u7528\u5de5\u5177\u201d\u4f5c\u4e3a\u540c\u4e00\u4e2a\u667a\u80fd\u4f53\u80fd\u529b\u5171\u540c\u4f18\u5316\uff0c\u63d0\u5347\u4e86\u5c0f\u6a21\u578b\u7684\u53ef\u6269\u5c55\u63a8\u7406\u80fd\u529b\uff0c\u5e76\u4e14\u751f\u6210\u7684\u5de5\u5177\u8fd8\u80fd\u8fc1\u79fb\u5e2e\u52a9\u5176\u4ed6\u6a21\u578b\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u667a\u80fd\u4f53\u4e0e\u5de5\u5177\u5b66\u4e60\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "GUI agents often encounter dynamic anomalies when deployed on Android devices, from unexpected pop-ups to action misuse, yet existing benchmarks lack systematic evaluation of agent robustness against runtime anomalies. We introduce AnTrap, a comprehensive benchmark that injects dynamic perturbations into agent execution trajectories. We propose a taxonomy organizing real-world anomalies into four layers (State, Thinking, Action and Round) with ten fine-grained subcategories, and develop a construction pipeline that preserves task solvability while introducing realistic adversarial conditions. Evaluating 16 leading GUI models, we reveal universal vulnerability to dynamic anomalies, with even the strongest models suffering significant performance degradation. Furthermore, we conduct GRPO training in both original and adversarial environments to validate our benchmark, separating environment-learnable anomalies from reasoning-bottlenecked ones. Our findings show that while single-step traps at state and action layers are largely addressable through adversarial reinforcement learning, deep contextual traps, like state deadlock, expose intrinsic limitations that cannot be resolved by training in environments with traps alone.", "arxiv_id": "2608.24099", "arxiv_url": "https://arxiv.org/abs/2608.24099", "authors": ["Guo Gan", "Yilun Zhao", "Cong Chen", "Jinbiao Wei", "Tingyu Song", "Zheyuan Yang", "Lin Fu", "Hong Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa AnTrap\uff0c\u4e00\u4e2a\u9762\u5411 Android GUI \u667a\u80fd\u4f53\u7684\u52a8\u6001\u5bf9\u6297\u57fa\u51c6\uff0c\u5728\u6267\u884c\u8f68\u8ff9\u4e2d\u6ce8\u5165\u771f\u5b9e\u8fd0\u884c\u65f6\u5f02\u5e38\u3002\u5b83\u6784\u5efa\u4e86\u8986\u76d6\u72b6\u6001\u3001\u601d\u8003\u3001\u52a8\u4f5c\u3001\u8f6e\u6b21\u56db\u5c42\u7684\u5f02\u5e38\u5206\u7c7b\uff0c\u5e76\u8bc4\u6d4b\u4e8616\u4e2a\u4e3b\u6d41GUI\u6a21\u578b\u7684\u9c81\u68d2\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24099", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u56db\u5c42\u5341\u7c7b\u8fd0\u884c\u65f6\u5f02\u5e38 taxonomy\uff0c\u8986\u76d6\u5f39\u7a97\u5e72\u6270\u3001\u52a8\u4f5c\u8bef\u7528\u3001\u72b6\u6001\u6b7b\u9501\u7b49\u771f\u5b9e\u573a\u666f", "\u8bbe\u8ba1\u4fdd\u6301\u4efb\u52a1\u53ef\u89e3\u6027\u7684\u6270\u52a8\u6784\u9020\u6d41\u7a0b\uff0c\u5728\u6267\u884c\u8fc7\u7a0b\u4e2d\u52a8\u6001\u6ce8\u5165\u5bf9\u6297\u6761\u4ef6", "\u5b9e\u9a8c\u663e\u793a16\u4e2a\u9886\u5148GUI\u6a21\u578b\u666e\u904d\u6027\u80fd\u663e\u8457\u4e0b\u964d\uff1bGRPO\u8bad\u7ec3\u53ef\u7f13\u89e3\u90e8\u5206\u5355\u6b65\u9677\u9631\uff0c\u4f46\u96be\u4ee5\u89e3\u51b3\u6df1\u5c42\u4e0a\u4e0b\u6587\u9677\u9631"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u9c81\u68d2\u6027", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24099v1", "published_at": "2026-08-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Are Android GUI Agents Robust Against Runtime Anomalies? AnTrap: Evaluating Agents in Dynamic Adversarial Environments", "tldr": "AnTrap\u7cfb\u7edf\u8bc4\u6d4b\u5b89\u5353GUI\u667a\u80fd\u4f53\u6297\u5f02\u5e38\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AnTrap\uff0c\u4e00\u4e2a\u9762\u5411 Android GUI \u667a\u80fd\u4f53\u7684\u52a8\u6001\u5bf9\u6297\u57fa\u51c6\uff0c\u5728\u6267\u884c\u8f68\u8ff9\u4e2d\u6ce8\u5165\u771f\u5b9e\u8fd0\u884c\u65f6\u5f02\u5e38\u3002\u5b83\u6784\u5efa\u4e86\u8986\u76d6\u72b6\u6001\u3001\u601d\u8003\u3001\u52a8\u4f5c\u3001\u8f6e\u6b21\u56db\u5c42\u7684\u5f02\u5e38\u5206\u7c7b\uff0c\u5e76\u8bc4\u6d4b\u4e8616\u4e2a\u4e3b\u6d41GUI\u6a21\u578b\u7684\u9c81\u68d2\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86GUI\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u90e8\u7f72\u4e2d\u5bf9\u52a8\u6001\u5f02\u5e38\u9c81\u68d2\u6027\u8bc4\u6d4b\u7684\u7f3a\u53e3\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u5373\u4f7f\u7ecf\u8fc7\u5bf9\u6297\u5f3a\u5316\u5b66\u4e60\u4ecd\u5b58\u5728\u63a8\u7406\u74f6\u9888\uff0c\u5bf9\u63d0\u5347\u79fb\u52a8\u7aef\u667a\u80fd\u4f53\u53ef\u9760\u6027\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "The Planner-Operator-Reflector (POR) framework is widely used in GUI agents to maintain objective alignment in complex tasks through modular collaboration. However, desktop GUIs introduce a key challenge: large, dense interfaces often exhibit subtle or scattered state changes, placing most of the burden on the reflector, which must compare pre- and post-action screens, while the planner and operator reason over a single state. Existing reflectors collapse change detection and outcome verification into one step, leaving evidence implicit and yielding weakly grounded decisions. To address this limitation, we propose Evidence-First Reflection (EFR), a two-stage reflector that explicitly decouples action-induced visual differences extraction from outcome verification. EFR identifies the action location and candidate changed regions with Set-of-Marks annotations, describes and filters action-relevant changes, and makes the final judgment from the cleaned evidence. This evidence-reasoning decoupled design makes reflection better grounded in screen transitions, while reducing both visual search complexity and reasoning burden. Experiments on OSWorld-Verified and WindowsAgentArena demonstrate that EFR improves reflector accuracy by 7.11%, yielding average end-to-end task success gains of 5.94% and 4.95% on the two benchmarks, respectively.", "arxiv_id": "2608.24015", "arxiv_url": "https://arxiv.org/abs/2608.24015", "authors": ["Yijie Ma", "Chaoyue Niu", "Fan Wu", "Guihai Chen"], "brief": "\u672c\u6587\u63d0\u51fa Evidence-First Reflection\uff08EFR\uff09\uff0c\u4e00\u79cd\u7528\u4e8e\u684c\u9762 GUI \u667a\u80fd\u4f53\u7684\u4e24\u9636\u6bb5\u53cd\u601d\u5668\u3002\u5b83\u5148\u663e\u5f0f\u63d0\u53d6\u52a8\u4f5c\u524d\u540e\u5c4f\u5e55\u4e2d\u7684\u52a8\u4f5c\u8bf1\u53d1\u89c6\u89c9\u5dee\u5f02\uff0c\u518d\u57fa\u4e8e\u6e05\u6d17\u540e\u7684\u8bc1\u636e\u5224\u65ad\u52a8\u4f5c\u662f\u5426\u8fbe\u6210\u76ee\u6807\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24015", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u4f20\u7edf\u53cd\u601d\u4e2d\u7684\u53d8\u5316\u68c0\u6d4b\u4e0e\u7ed3\u679c\u9a8c\u8bc1\u89e3\u8026\uff0c\u907f\u514d\u8bc1\u636e\u9690\u5f0f\u5316\u5bfc\u81f4\u7684\u5f31 grounded \u5224\u65ad", "\u4f7f\u7528 Set-of-Marks \u6807\u6ce8\u52a8\u4f5c\u4f4d\u7f6e\u4e0e\u5019\u9009\u53d8\u5316\u533a\u57df\uff0c\u5e76\u63cf\u8ff0\u3001\u8fc7\u6ee4\u4e0e\u52a8\u4f5c\u76f8\u5173\u7684\u89c6\u89c9\u53d8\u5316", "\u5728 OSWorld-Verified \u548c WindowsAgentArena \u4e0a\u5206\u522b\u5e26\u6765 5.94% \u4e0e 4.95% \u7684\u7aef\u5230\u7aef\u4efb\u52a1\u6210\u529f\u7387\u63d0\u5347"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u591a\u6a21\u6001", "\u53cd\u601d\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24015v1", "published_at": "2026-08-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Reflection with Action-Induced Visual Differences for Desktop GUI Agents", "tldr": "\u7528\u663e\u5f0f\u89c6\u89c9\u5dee\u5f02\u63d0\u5347\u684c\u9762GUI\u667a\u80fd\u4f53\u53cd\u601d", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Evidence-First Reflection\uff08EFR\uff09\uff0c\u4e00\u79cd\u7528\u4e8e\u684c\u9762 GUI \u667a\u80fd\u4f53\u7684\u4e24\u9636\u6bb5\u53cd\u601d\u5668\u3002\u5b83\u5148\u663e\u5f0f\u63d0\u53d6\u52a8\u4f5c\u524d\u540e\u5c4f\u5e55\u4e2d\u7684\u52a8\u4f5c\u8bf1\u53d1\u89c6\u89c9\u5dee\u5f02\uff0c\u518d\u57fa\u4e8e\u6e05\u6d17\u540e\u7684\u8bc1\u636e\u5224\u65ad\u52a8\u4f5c\u662f\u5426\u8fbe\u6210\u76ee\u6807\u3002", "why_notable": "\u684c\u9762 GUI \u72b6\u6001\u53d8\u5316\u5f80\u5f80\u7ec6\u5fae\u4e14\u5206\u6563\uff0cEFR \u901a\u8fc7\u5148\u8bc1\u636e\u540e\u63a8\u7406\u7684\u8bbe\u8ba1\u964d\u4f4e\u89c6\u89c9\u641c\u7d22\u548c\u63a8\u7406\u8d1f\u62c5\uff0c\u63d0\u5347\u4e86 GUI \u667a\u80fd\u4f53\u5728\u590d\u6742\u684c\u9762\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\u4e0e\u53ef\u89e3\u91ca\u6027\u3002"}, {"abstract": "Web agents that act from rendered pixels avoid the fragility and heavy token cost of reading a page\u0027s HTML or accessibility tree, but training them depends on large amounts of high-quality interaction trajectories, and how to produce such data at scale remains an open problem. Public datasets typically contain only a few thousand trajectories drawn from a fixed and narrow set of websites, and even recent automated synthesis pipelines stay bound to predefined site lists or tutorial sources, so the number of distinct websites the agent ever sees barely grows. We present BrowserForge, a framework that generates web interaction data at scale by driving many browser sandboxes in parallel over the open web. BrowserForge couples three components: an open-web sourcing stage that exposes the agent to hundreds of thousands of real, openly reachable websites; a sandbox cluster manager that schedules hundreds of concurrent browsers with high utilization; and a Proposer-Solver dual-agent loop that turns a raw page into an executable task and then collects a verified trajectory for it. A rule-plus-model cleaning pipeline removes failed runs and rewrites the surviving reasoning into a single unified chain-of-thought style. Page structure such as the accessibility tree is used only as a synthesis-time signal; the agent we train and release acts purely from the screenshot. The resulting corpus contains 203,238 trajectories, each collected from a distinct website, larger and more diverse than prior trajectory datasets. Fine-tuning a compact multimodal model on this corpus raises its success rate on the live Online-Mind2Web from 25.66% to 33.33% and consistently improves step accuracy on the static Multimodal-Mind2Web, with the gain growing as the corpus scales. Controlled analyses further confirm that open-web sourcing and broad website coverage are key contributors to the observed improvement.", "arxiv_id": "2608.24848", "arxiv_url": "https://arxiv.org/abs/2608.24848", "authors": ["Fei Tang", "Huawen Shen", "Zhiqiong Lu", "Zhengxi Lu", "Pengyuan Lyu", "Chengquan Zhang", "Weiming Lu", "Jun Xiao", "Yueting Zhuang", "Yongliang Shen"], "brief": "BrowserForge \u662f\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u7f51\u9875\u667a\u80fd\u4f53\u7684\u6570\u636e\u751f\u6210\u6846\u67b6\uff0c\u901a\u8fc7\u5728\u5f00\u653e\u7f51\u9875\u4e0a\u5e76\u884c\u9a71\u52a8\u5927\u91cf\u6d4f\u89c8\u5668\u6c99\u7bb1\uff0c\u81ea\u52a8\u6784\u9020\u4efb\u52a1\u5e76\u91c7\u96c6\u53ef\u9a8c\u8bc1\u4ea4\u4e92\u8f68\u8ff9\u3002\u5b83\u4ea7\u51fa\u8986\u76d6 203,238 \u4e2a\u4e0d\u540c\u7f51\u7ad9\u7684\u8f68\u8ff9\u8bed\u6599\uff0c\u7528\u4e8e\u8bad\u7ec3\u4ec5\u4f9d\u8d56\u622a\u56fe\u64cd\u4f5c\u7684\u591a\u6a21\u6001\u7f51\u9875\u667a\u80fd\u4f53\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24848", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u5f00\u653e\u7f51\u9875\u6765\u6e90\uff0c\u8986\u76d6\u6570\u5341\u4e07\u771f\u5b9e\u53ef\u8bbf\u95ee\u7f51\u7ad9\uff0c\u7a81\u7834\u4ee5\u5f80\u56fa\u5b9a\u7f51\u7ad9\u5217\u8868\u6216\u6559\u7a0b\u6e90\u7684\u9650\u5236", "\u901a\u8fc7\u6c99\u7bb1\u96c6\u7fa4\u7ba1\u7406\u5668\u8c03\u5ea6\u6570\u767e\u4e2a\u5e76\u53d1\u6d4f\u89c8\u5668\uff0c\u5e76\u7528 Proposer-Solver \u53cc\u667a\u80fd\u4f53\u5faa\u73af\u751f\u6210\u4efb\u52a1\u4e0e\u9a8c\u8bc1\u8f68\u8ff9", "\u5fae\u8c03\u7d27\u51d1\u591a\u6a21\u6001\u6a21\u578b\u540e\uff0cOnline-Mind2Web \u6210\u529f\u7387\u4ece 25.66% \u63d0\u5347\u5230 33.33%\uff0c\u4e14\u6570\u636e\u89c4\u6a21\u8d8a\u5927\u6536\u76ca\u8d8a\u660e\u663e"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u9875\u64cd\u4f5c", "\u591a\u6a21\u6001", "\u6570\u636e\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24848v1", "published_at": "2026-08-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BrowserForge: Scaling Web Episode via Parallel Browser Sandboxes", "tldr": "\u5e76\u884c\u6d4f\u89c8\u5668\u6c99\u7bb1\u5927\u89c4\u6a21\u751f\u6210\u7f51\u9875\u667a\u80fd\u4f53\u8f68\u8ff9", "upvotes": 0, "what_it_is": "BrowserForge \u662f\u4e00\u4e2a\u9762\u5411\u89c6\u89c9\u7f51\u9875\u667a\u80fd\u4f53\u7684\u6570\u636e\u751f\u6210\u6846\u67b6\uff0c\u901a\u8fc7\u5728\u5f00\u653e\u7f51\u9875\u4e0a\u5e76\u884c\u9a71\u52a8\u5927\u91cf\u6d4f\u89c8\u5668\u6c99\u7bb1\uff0c\u81ea\u52a8\u6784\u9020\u4efb\u52a1\u5e76\u91c7\u96c6\u53ef\u9a8c\u8bc1\u4ea4\u4e92\u8f68\u8ff9\u3002\u5b83\u4ea7\u51fa\u8986\u76d6 203,238 \u4e2a\u4e0d\u540c\u7f51\u7ad9\u7684\u8f68\u8ff9\u8bed\u6599\uff0c\u7528\u4e8e\u8bad\u7ec3\u4ec5\u4f9d\u8d56\u622a\u56fe\u64cd\u4f5c\u7684\u591a\u6a21\u6001\u7f51\u9875\u667a\u80fd\u4f53\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u89e3\u51b3\u4e86\u7f51\u9875\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u9ad8\u8d28\u91cf\u4ea4\u4e92\u8f68\u8ff9\u7a00\u7f3a\u7684\u95ee\u9898\uff0c\u663e\u8457\u6269\u5927\u4e86\u771f\u5b9e\u5f00\u653e\u7f51\u9875\u8986\u76d6\u8303\u56f4\uff0c\u5e76\u8bc1\u660e\u5927\u89c4\u6a21\u591a\u6837\u5316\u8f68\u8ff9\u80fd\u63d0\u5347\u57fa\u4e8e\u622a\u56fe\u7684\u7f51\u9875\u64cd\u4f5c\u80fd\u529b\uff0c\u5bf9\u53ef\u6269\u5c55 GUI/\u7f51\u9875\u667a\u80fd\u4f53\u8bad\u7ec3\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM)-based agent applications often incur high response time. Speculative decoding is a promising solution to improve the inference efficiency of LLM agents without impacting generation quality. However, state-of-the-art speculative decoding algorithms exhibit substantial speed degradation under large batch sizes, limiting their effectiveness to deploy in real-world agent applications. In this work, we first present a systematic analysis of speculative decoding for LLM agents and identify two dominant factors of speedup degradation: high rejection rate of speculative tokens, and under-utilization of dynamic token budgets.B ased on these observations, we propose AgentSpec, a speculative decoding algorithm that addresses the limitations of existing methods for LLM agents. AgentSpec incorporates structure-isolated drafting that constrains speculation to semantically coherent segments of the agent workflow, reducing the drafts of irrelevant semantic paths and achieving an extremely low rejection rate. Moreover, AgentSpec adopts redundancy-aware budget allocation that exploits agent-level information to better utilize the dynamically-free token budget during the agent inference. We implement and evaluate AgentSpec on five different workloads and four different models from four different LLM families in vLLM. Our results demonstrate the superiority of AgentSpec over state-of-the-arts.", "arxiv_id": "2608.24004", "arxiv_url": "https://arxiv.org/abs/2608.24004", "authors": ["Xin Wang", "Ziming Miao", "Yi Zhu", "Hui Shen", "Zhongwei Wan", "Fan Yang", "Mi Zhang"], "brief": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u4e86LLM\u667a\u80fd\u4f53\u4e2d\u63a8\u6d4b\u89e3\u7801\u5728\u5927\u6279\u91cf\u63a8\u7406\u4e0b\u52a0\u901f\u9000\u5316\u7684\u539f\u56e0\uff0c\u5e76\u63d0\u51faAgentSpec\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u9694\u79bb\u8349\u7a3f\u751f\u6210\u548c\u5197\u4f59\u611f\u77e5\u9884\u7b97\u5206\u914d\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u6279\u91cf\u63a8\u7406\u6548\u7387\u4e14\u4e0d\u635f\u5bb3\u751f\u6210\u8d28\u91cf\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24004", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709\u63a8\u6d4b\u89e3\u7801\u5728\u5927batch\u4e0b\u4e3b\u8981\u53d7\u4e24\u7c7b\u95ee\u9898\u9650\u5236\uff1a\u63a8\u6d4btoken\u62d2\u7edd\u7387\u9ad8\u3001\u52a8\u6001token\u9884\u7b97\u5229\u7528\u4e0d\u8db3", "\u63d0\u51fa\u7ed3\u6784\u9694\u79bb\u8349\u7a3f\u751f\u6210\uff0c\u5c06\u63a8\u6d4b\u9650\u5236\u5728\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4e2d\u8bed\u4e49\u4e00\u81f4\u7684\u7247\u6bb5\u5185\uff0c\u51cf\u5c11\u65e0\u5173\u8def\u5f84\u8349\u7a3f\u5e76\u663e\u8457\u964d\u4f4e\u62d2\u7edd\u7387", "\u63d0\u51fa\u5197\u4f59\u611f\u77e5\u9884\u7b97\u5206\u914d\uff0c\u5229\u7528\u667a\u80fd\u4f53\u7ea7\u4fe1\u606f\u66f4\u5145\u5206\u4f7f\u7528\u52a8\u6001\u7a7a\u95f2token\u9884\u7b97\uff1b\u5728vLLM\u4e0a\u8986\u76d65\u7c7b\u5de5\u4f5c\u8d1f\u8f7d\u30014\u4e2a\u6a21\u578b\u5bb6\u65cf\u9a8c\u8bc1\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u6d4b\u89e3\u7801", "\u63a8\u7406\u52a0\u901f", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24004v1", "published_at": "2026-08-25", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgentSpec: Speculative Decoding for Batch Inference of LLM Agents", "tldr": "\u9762\u5411\u6279\u91cfLLM\u667a\u80fd\u4f53\u7684\u9ad8\u6548\u63a8\u6d4b\u89e3\u7801\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u4e86LLM\u667a\u80fd\u4f53\u4e2d\u63a8\u6d4b\u89e3\u7801\u5728\u5927\u6279\u91cf\u63a8\u7406\u4e0b\u52a0\u901f\u9000\u5316\u7684\u539f\u56e0\uff0c\u5e76\u63d0\u51faAgentSpec\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u9694\u79bb\u8349\u7a3f\u751f\u6210\u548c\u5197\u4f59\u611f\u77e5\u9884\u7b97\u5206\u914d\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u6279\u91cf\u63a8\u7406\u6548\u7387\u4e14\u4e0d\u635f\u5bb3\u751f\u6210\u8d28\u91cf\u3002", "why_notable": "\u667a\u80fd\u4f53\u5e94\u7528\u5e38\u53d7\u9ad8\u5ef6\u8fdf\u5236\u7ea6\uff0c\u800c\u6279\u91cf\u63a8\u7406\u53c8\u662f\u5b9e\u9645\u90e8\u7f72\u7684\u5173\u952e\u573a\u666f\u3002AgentSpec\u9488\u5bf9\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u7ed3\u6784\u4f18\u5316\u63a8\u6d4b\u89e3\u7801\uff0c\u6709\u671b\u63d0\u5347\u771f\u5b9eLLM Agent\u670d\u52a1\u7684\u541e\u5410\u4e0e\u54cd\u5e94\u901f\u5ea6\uff0c\u5177\u5907\u8f83\u5f3a\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Recent studies on GUI agents have increasingly focused on outcome reward modeling, which assigns outcome rewards by judging whether an executed trajectory satisfies the success criteria implied by the user instruction. Existing GUI reward verifiers, however, often under-specify how these criteria should be constructed for each task instance. Whether using generic rubric structures or implicit model reasoning, their judging criteria are not sufficiently task-adaptive: they can transfer checks across tasks, overlook concrete constraints in the current instruction, or become overly strict by enforcing unstated requirements. To address this limitation, we propose AdaptRubric, a Coarse-to-Fine Rubrics Framework that constructs task-adaptive judging criteria through a category-level coarse stage and an instance-level fine stage. AdaptRubric performs category-level coarse rubric retrieval by routing the instruction to a GUI task family and retrieving reusable task-family criteria, then conducts instance-level fine rubric generation to surface compact cues for concrete values, scopes, and constraints in the current instruction. Across offline reward evaluation and online reinforcement learning optimization, AdaptRubric consistently outperforms prior reward agents, improving F1 by 3.6 points over the baseline average under a matched image budget and yielding a 4.23-point task-success gain.", "arxiv_id": "2608.24174", "arxiv_url": "https://arxiv.org/abs/2608.24174", "authors": ["Tao Xiong", "Xavier Hu", "Wenkai Wang", "Qinzhuo Wu", "Changqiao Wu", "Pengzhi Gao", "Wei Liu", "Jian Luan", "Shengyu Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa AdaptRubric\uff0c\u4e00\u4e2a\u7c97\u5230\u7ec6\u7684 GUI \u5956\u52b1\u5efa\u6a21\u6846\u67b6\uff0c\u7528\u4e8e\u4e3a\u4e0d\u540c\u7528\u6237\u6307\u4ee4\u81ea\u52a8\u6784\u5efa\u4efb\u52a1\u81ea\u9002\u5e94\u7684\u8bc4\u5224\u51c6\u5219\u3002\u5b83\u5148\u68c0\u7d22\u4efb\u52a1\u7c7b\u522b\u7ea7\u901a\u7528 rubric\uff0c\u518d\u751f\u6210\u5b9e\u4f8b\u7ea7\u7ec6\u7c92\u5ea6\u7ea6\u675f\u63d0\u793a\uff0c\u4ee5\u66f4\u51c6\u786e\u5224\u65ad\u8f68\u8ff9\u662f\u5426\u5b8c\u6210\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24174", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u5c06\u6307\u4ee4\u8def\u7531\u5230 GUI \u4efb\u52a1\u5bb6\u65cf\uff0c\u68c0\u7d22\u53ef\u590d\u7528\u7684\u7c7b\u522b\u7ea7\u8bc4\u5224\u6807\u51c6\uff0c\u907f\u514d\u5b8c\u5168\u4f9d\u8d56\u6cdb\u5316\u6a21\u677f\u6216\u9690\u5f0f\u63a8\u7406\u3002", "\u5b9e\u4f8b\u7ea7\u7ec6\u5316\u9636\u6bb5\u63d0\u53d6\u5f53\u524d\u6307\u4ee4\u4e2d\u7684\u5177\u4f53\u6570\u503c\u3001\u8303\u56f4\u3001\u5bf9\u8c61\u548c\u7ea6\u675f\uff0c\u51cf\u5c11\u6f0f\u5224\u3001\u8bef\u8fc1\u79fb\u548c\u8fc7\u5ea6\u4e25\u683c\u8bc4\u5224\u3002", "\u5728\u79bb\u7ebf\u5956\u52b1\u8bc4\u4f30\u548c\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u4e2d\u5747\u4f18\u4e8e\u65e2\u6709\u5956\u52b1\u6a21\u578b\uff1a\u5339\u914d\u56fe\u50cf\u9884\u7b97\u4e0b F1 \u5e73\u5747\u63d0\u5347 3.6 \u5206\uff0c\u4efb\u52a1\u6210\u529f\u7387\u63d0\u5347 4.23 \u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u5956\u52b1\u5efa\u6a21", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24174v1", "published_at": "2026-08-25", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Task-Adaptive Rubrics for GUI Reward Modeling", "tldr": "\u4e3aGUI\u4efb\u52a1\u751f\u6210\u81ea\u9002\u5e94\u5956\u52b1\u8bc4\u5224\u6807\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AdaptRubric\uff0c\u4e00\u4e2a\u7c97\u5230\u7ec6\u7684 GUI \u5956\u52b1\u5efa\u6a21\u6846\u67b6\uff0c\u7528\u4e8e\u4e3a\u4e0d\u540c\u7528\u6237\u6307\u4ee4\u81ea\u52a8\u6784\u5efa\u4efb\u52a1\u81ea\u9002\u5e94\u7684\u8bc4\u5224\u51c6\u5219\u3002\u5b83\u5148\u68c0\u7d22\u4efb\u52a1\u7c7b\u522b\u7ea7\u901a\u7528 rubric\uff0c\u518d\u751f\u6210\u5b9e\u4f8b\u7ea7\u7ec6\u7c92\u5ea6\u7ea6\u675f\u63d0\u793a\uff0c\u4ee5\u66f4\u51c6\u786e\u5224\u65ad\u8f68\u8ff9\u662f\u5426\u5b8c\u6210\u4efb\u52a1\u3002", "why_notable": "GUI \u667a\u80fd\u4f53\u7684\u5f3a\u5316\u5b66\u4e60\u9ad8\u5ea6\u4f9d\u8d56\u53ef\u9760\u5956\u52b1\u4fe1\u53f7\uff0c\u800c\u73b0\u6709 verifier \u5f80\u5f80\u7f3a\u4e4f\u4efb\u52a1\u81ea\u9002\u5e94\u6027\u3002AdaptRubric \u5c06\u8bc4\u5224\u6807\u51c6\u663e\u5f0f\u5316\u5e76\u5206\u5c42\u751f\u6210\uff0c\u6709\u52a9\u4e8e\u63d0\u5347 GUI agent \u8bad\u7ec3\u4e0e\u8bc4\u4f30\u7684\u7a33\u5b9a\u6027\u548c\u53ef\u8fc1\u79fb\u6027\u3002"}, {"abstract": "Agent benchmarks often evaluate only final answers even when agents run on stateful runtimes. We argue this under-specifies what is being evaluated: the proper unit is a declared model-plus-runtime configuration whose failures can occur in evidence acquisition, runtime routing, safety boundaries, or repeated execution. We present ClawProBench, a trace-aware benchmark for runtime-native agent evaluation instantiated on OpenClaw, a live agent runtime with workspace tools and native surfaces for browsing, memory, messaging, scheduling, skills, and subagents. ClawProBench defines two tracks: a 102-scenario full profile with live workspace and native-runtime routing tasks, and a frozen 68-scenario holdout with closed-world JSON output contracts for robust ranking. Trials are scored from execution traces via a safety-gated formula combining correctness, process quality, and efficiency, preserving failure evidence for audit. Our anonymous artifact includes benchmark definitions, scoring code, manifests and sanitized traces. We evaluate 68 configurations on the full profile and 37 on holdout. The top safety-gated average trace score is 0.7671. Native-runtime tasks underperform workspace-live tasks (0.5238 vs. 0.6415). On holdout, pass@k-any outperforms strict three-trial pass (0.6638 vs. 0.2890), while full-profile and holdout rankings show weak alignment (Spearman 0.1300). Rankings based purely on correctness differ substantially from process-aware, safety-gated and strict-pass views. Final-answer leaderboards may hide native-surface weaknesses, one-off successes and trace-local agent failure modes.", "arxiv_id": "2608.22510", "arxiv_url": "https://arxiv.org/abs/2608.22510", "authors": ["YuanHang Xiao"], "brief": "\u8bba\u6587\u63d0\u51fa ClawProBench\uff0c\u4e00\u4e2a\u9762\u5411 OpenClaw \u7b49\u771f\u5b9e\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u7684\u8f68\u8ff9\u611f\u77e5\u57fa\u51c6\u3002\u5b83\u4e0d\u4ec5\u770b\u6700\u7ec8\u7b54\u6848\uff0c\u8fd8\u4ece\u6267\u884c\u8f68\u8ff9\u4e2d\u8bc4\u4f30\u6b63\u786e\u6027\u3001\u8fc7\u7a0b\u8d28\u91cf\u3001\u6548\u7387\u4e0e\u5b89\u5168\u8fb9\u754c\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/suyoumo/ClawProBench", "github_stars": 822, "hf_url": "https://huggingface.co/papers/2608.22510", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b\u4e24\u4e2a\u8bc4\u6d4b\u8f68\u9053\uff1a102 \u4e2a\u5b9e\u65f6\u5de5\u4f5c\u533a\u4e0e\u539f\u751f\u8fd0\u884c\u65f6\u4efb\u52a1\uff0c\u4ee5\u53ca 68 \u4e2a\u51bb\u7ed3\u95ed\u96c6 holdout \u573a\u666f\u7528\u4e8e\u7a33\u5065\u6392\u540d\u3002", "\u91c7\u7528\u5b89\u5168\u95e8\u63a7\u8bc4\u5206\u516c\u5f0f\uff0c\u7ed3\u5408\u6b63\u786e\u6027\u3001\u8fc7\u7a0b\u8d28\u91cf\u548c\u6548\u7387\uff0c\u5e76\u4fdd\u7559\u5931\u8d25\u8f68\u8ff9\u7528\u4e8e\u5ba1\u8ba1\u3002", "\u5b9e\u9a8c\u8986\u76d6 68 \u4e2a\u5b8c\u6574\u914d\u7f6e\u548c 37 \u4e2a holdout \u914d\u7f6e\uff0c\u53d1\u73b0\u6700\u7ec8\u7b54\u6848\u6392\u540d\u4e0e\u8fc7\u7a0b\u611f\u77e5\u6392\u540d\u5dee\u5f02\u663e\u8457\uff0cfull profile \u4e0e holdout \u6392\u540d\u76f8\u5173\u6027\u5f88\u5f31\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u6267\u884c\u8f68\u8ff9", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22510v1", "published_at": "2026-08-23", "score": 0.309, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.22510.png", "title": "ClawProBench: Trace-Aware Evaluation of AI Agents with Runtime Coverage and Frozen Workplace-Style Holdouts", "tldr": "\u7528\u6267\u884c\u8f68\u8ff9\u8bc4\u6d4b\u8fd0\u884c\u65f6\u539f\u751f\u667a\u80fd\u4f53\u80fd\u529b\u3002", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa ClawProBench\uff0c\u4e00\u4e2a\u9762\u5411 OpenClaw \u7b49\u771f\u5b9e\u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u7684\u8f68\u8ff9\u611f\u77e5\u57fa\u51c6\u3002\u5b83\u4e0d\u4ec5\u770b\u6700\u7ec8\u7b54\u6848\uff0c\u8fd8\u4ece\u6267\u884c\u8f68\u8ff9\u4e2d\u8bc4\u4f30\u6b63\u786e\u6027\u3001\u8fc7\u7a0b\u8d28\u91cf\u3001\u6548\u7387\u4e0e\u5b89\u5168\u8fb9\u754c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u667a\u80fd\u4f53\u8bc4\u6d4b\u7684\u5355\u4f4d\u5e94\u662f\u201c\u6a21\u578b+\u8fd0\u884c\u65f6\u914d\u7f6e\u201d\uff0c\u63ed\u793a\u4ec5\u770b\u6700\u7ec8\u7b54\u6848\u4f1a\u63a9\u76d6\u5de5\u5177\u8def\u7531\u3001\u539f\u751f\u754c\u9762\u3001\u5b89\u5168\u8fb9\u754c\u548c\u91cd\u590d\u6267\u884c\u4e2d\u7684\u5931\u8d25\u6a21\u5f0f\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u9760\u7684 LLM Agent \u6392\u884c\u699c\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Clinical diagnosis is an active evidence-seeking process in which clinicians acquire evidence, update competing hypotheses, and decide when the available evidence is sufficient for diagnosis. Yet many medical diagnosis systems built around large language models (LLMs) still formulate diagnosis as static case-to-answer prediction, with limited support for evidence acquisition. Agentic LLMs offer a dynamic alternative through tool use and intermediate diagnostic trajectories, but existing systems often under-specify how patient evidence should be exposed, scaffolded, and controlled at runtime. We introduce EviDx, an evidence-aware active diagnosis framework that pairs patient-specific diagnostic environments with a clinical diagnostic scaffold and an observer-guided runtime harness. In EviDx, $\\mathcal{E}$-Synthesis constructs interactive environments from raw clinical cases; the scaffold organizes role-specialized agents, evidence tools, and evolving evidence states; and the harness regulates diagnostic termination by tracking uncertainty and evidence coverage. A 3-level evaluation pyramid assesses execution robustness, reasoning dynamics, and diagnostic outcomes. Experiments show that EviDx improves diagnostic performance and process stability while revealing model-dependent capability boundaries.", "arxiv_id": "2608.24570", "arxiv_url": "https://arxiv.org/abs/2608.24570", "authors": ["Lihang Zeng", "Shaoting Zhang", "Xiaofan Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa EviDx\uff0c\u4e00\u4e2a\u9762\u5411\u4e34\u5e8a\u8bca\u65ad\u7684\u8bc1\u636e\u611f\u77e5\u4e3b\u52a8\u8bca\u65ad\u6846\u67b6\uff0c\u5c06\u60a3\u8005\u4e13\u5c5e\u4ea4\u4e92\u73af\u5883\u3001\u4e34\u5e8a\u8bca\u65ad\u811a\u624b\u67b6\u548c\u8fd0\u884c\u65f6\u89c2\u5bdf\u63a7\u5236\u7ed3\u5408\u8d77\u6765\u3002\u5b83\u8ba9LLM\u667a\u80fd\u4f53\u901a\u8fc7\u5de5\u5177\u83b7\u53d6\u8bc1\u636e\u3001\u66f4\u65b0\u5047\u8bbe\uff0c\u5e76\u5728\u4e0d\u786e\u5b9a\u6027\u548c\u8bc1\u636e\u8986\u76d6\u8db3\u591f\u65f6\u7ec8\u6b62\u8bca\u65ad\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24570", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["E-Synthesis \u4ece\u539f\u59cb\u4e34\u5e8a\u75c5\u4f8b\u6784\u5efa\u53ef\u4ea4\u4e92\u7684\u60a3\u8005\u8bca\u65ad\u73af\u5883\uff0c\u652f\u6301\u9010\u6b65\u8bc1\u636e\u66b4\u9732", "\u8bca\u65ad\u811a\u624b\u67b6\u7ec4\u7ec7\u89d2\u8272\u4e13\u95e8\u5316\u667a\u80fd\u4f53\u3001\u8bc1\u636e\u5de5\u5177\u548c\u52a8\u6001\u8bc1\u636e\u72b6\u6001\uff0c\u6a21\u62df\u4e34\u5e8a\u63a8\u7406\u6d41\u7a0b", "\u89c2\u5bdf\u8005\u5f15\u5bfc\u7684\u8fd0\u884c\u65f6\u673a\u5236\u6839\u636e\u4e0d\u786e\u5b9a\u6027\u4e0e\u
