\u7f16\u8f91\u5668\uff0c\u7528\u5c42\u6b21\u5316\u573a\u666f\u56fe\u548c98\u4e2a\u4e13\u7528\u5de5\u5177\u66ff\u4ee3\u6241\u5e73\u5750\u6807\u7f16\u8f91\uff0c\u5e76\u901a\u8fc7CARE\u8def\u7531\u51cf\u5c11\u7ea689%\u8f93\u5165token\u3002\u5176\u65e0\u53c2\u8003\u7b54\u6848\u7684\u6307\u4ee4\u9075\u5faa\u8bc4\u5ba1\u9a71\u52a8\u81ea\u6211\u7ea0\u9519\uff0c\u4f7f\u6307\u4ee4\u9075\u5faa\u5f97\u5206\u663e\u8457\u4f18\u4e8e\u540c\u9aa8\u5e72HTML\u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u540c\u65f6\u901f\u5ea6\u63d0\u53471.75\u500d\u3001\u6210\u672c\u964d\u4f4e\u7ea644%\uff0c\u76f2\u8bc4\u4e5f\u66f4\u504f\u597dACE\u8f93\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Current LLM agent systems decide delegation before reasoning begins (a router picks a model) or after a response is complete (a verifier scores it and may retry). We study a third regime: an agent that recognises, during its own reasoning, that it is unlikely to succeed and transfers control to a stronger model. We formulate intra-generation delegation as a Bayesian optimal-stopping problem over a learned competence posterior -- an online estimate of the agent\u0027s eventual task success whose sufficient statistics are learned from labelled trajectories, not read off raw entropy. We derive the myopic escalation threshold in closed form, characterise the optimal policy via dynamic programming, and prove that the optimal policy is a time-varying threshold with no shape assumption on the raw signal. We further prove exponential separation of the oracle belief at the Chernoff-information rate of the signal, a regret bound governed by the calibration of the posterior, and a finite-sample guarantee: with n labelled calibration trajectories the deployed plug-in policy\u0027s regret decays as 1/sqrt(n). A controlled simulation study confirms each prediction of the theory, including the predicted 1/sqrt(n) rate. We additionally report a real-model validation on a Qwen2.5-Coder 1.5B-\u003e7B code cascade (MBPP, 257 tasks), confirming two of three pre-registered predictions: the escalation frontier dominates post-hoc routing at equal cost, and the cumulative competence belief\u0027s discrimination rises over generation.", "arxiv_id": "2608.24087", "arxiv_url": "https://arxiv.org/abs/2608.24087", "authors": ["Nadeem Shaikh"], "brief": "\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u4f55\u65f6\u4e3b\u52a8\u201c\u6c42\u52a9\u201d\u66f4\u5f3a\u6a21\u578b\uff0c\u5c06\u4e2d\u9014\u5347\u7ea7\u5efa\u6a21\u4e3a\u57fa\u4e8e\u80fd\u529b\u540e\u9a8c\u7684\u8d1d\u53f6\u65af\u6700\u4f18\u505c\u6b62\u95ee\u9898\u3002\u4f5c\u8005\u7ed9\u51fa\u9608\u503c\u7b56\u7565\u3001\u9057\u61be\u754c\u548c\u6709\u9650\u6837\u672c\u4fdd\u8bc1\uff0c\u5e76\u5728\u4eff\u771f\u53ca Qwen2.5-Coder \u4ee3\u7801\u7ea7\u8054\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\uff1a\u5728\u76f8\u540c\u6210\u672c\u4e0b\uff0c\u4e2d\u9014\u5347\u7ea7\u4f18\u4e8e\u4e8b\u540e\u8def\u7531\uff0c\u4e14\u80fd\u529b\u4fe1\u5ff5\u968f\u751f\u6210\u8fc7\u7a0b\u66f4\u5177\u5224\u522b\u529b\u3002", "categories": ["cs.LG", "cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24087", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u6a21\u578b\u8def\u7531"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24087v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Knowing When to Ask for Help: Bayesian Self-Escalation in Hierarchical LLM Agents", "tldr": "\u8bba\u6587\u7814\u7a76\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u4f55\u65f6\u4e3b\u52a8\u201c\u6c42\u52a9\u201d\u66f4\u5f3a\u6a21\u578b\uff0c\u5c06\u4e2d\u9014\u5347\u7ea7\u5efa\u6a21\u4e3a\u57fa\u4e8e\u80fd\u529b\u540e\u9a8c\u7684\u8d1d\u53f6\u65af\u6700\u4f18\u505c\u6b62\u95ee\u9898\u3002\u4f5c\u8005\u7ed9\u51fa\u9608\u503c\u7b56\u7565\u3001\u9057\u61be\u754c\u548c\u6709\u9650\u6837\u672c\u4fdd\u8bc1\uff0c\u5e76\u5728\u4eff\u771f\u53ca Qwen2.5-Coder \u4ee3\u7801\u7ea7\u8054\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\uff1a\u5728\u76f8\u540c\u6210\u672c\u4e0b\uff0c\u4e2d\u9014\u5347\u7ea7\u4f18\u4e8e\u4e8b\u540e\u8def\u7531\uff0c\u4e14\u80fd\u529b\u4fe1\u5ff5\u968f\u751f\u6210\u8fc7\u7a0b\u66f4\u5177\u5224\u522b\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Evaluation of agentic information retrieval remains limited to scripted interactions with uniform users, missing both natural personality diversity and adversarial brittleness. We present AgentWorld, a simulation framework combining (i)Big Five (OCEAN) personality-driven user populations with stateful tool-use environments; (ii)the pass$^k$ consistency metric with structured fault classification, partial-credit scoring, and dual-control handoff verification; (iii)score-thresholded training-data export in six fine-tuning formats; and (iv)an adversarial Risk Analyser that snapshots required-intermediate-state spines, branches Monte-Carlo rollouts under four task-aware perturbation types, and quantifies risk via $\u0394P / \u0394T$ scoring, Dempster--Shafer evidence fusion, and Shapley attack-category attribution. Three experiments demonstrate the framework: a conversational analytics agent across 10 OCEAN personas (240 evaluator judgments); a customer-support agent across 5 tasks $\\times$ 4 persona variants; and adversarial stress-testing of 5 tasks revealing pre-existing trajectory brittleness ($V_{\\min}=0.375$ without perturbation) and tool/infrastructure-layer attack dominance (Shapley: 46% system, 38% action). Personality variation surfaces failure modes uniform testing cannot expose---cross-domain leakage, contextual drift, a 0.27-point quality gap, and 50% vs. 100% pass-rate across personas on the same task---while the Risk Analyser quantifies trajectory-level brittleness that pass$^k$ alone cannot measure.", "arxiv_id": "2608.24076", "arxiv_url": "https://arxiv.org/abs/2608.24076", "authors": ["Gunja Agarwal", "Arup Kumar Das", "Arun Menon", "Jitesh Chandra Mishra", "Vignesh Divakaran"], "brief": "\u672c\u6587\u63d0\u51fa AgentWorld\uff0c\u7528\u5927\u4e94\u4eba\u683c\u7528\u6237\u6a21\u62df\u3001\u72b6\u6001\u5316\u5de5\u5177\u73af\u5883\u548c pass^k \u4e00\u81f4\u6027\u7b49\u673a\u5236\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u4fe1\u606f\u68c0\u7d22\u5728\u4e0d\u540c\u4eba\u683c\u4e0e\u5bf9\u6297\u6270\u52a8\u4e0b\u7684\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u4eba\u683c\u5dee\u5f02\u80fd\u66b4\u9732\u7edf\u4e00\u7528\u6237\u6d4b\u8bd5\u9057\u6f0f\u7684\u5931\u8d25\u6a21\u5f0f\uff0c\u5982\u8de8\u57df\u6cc4\u6f0f\u3001\u4e0a\u4e0b\u6587\u6f02\u79fb\u548c\u663e\u8457\u901a\u8fc7\u7387\u5dee\u5f02\uff1b\u98ce\u9669\u5206\u6790\u5668\u8fd8\u80fd\u91cf\u5316\u8f68\u8ff9\u7ea7\u8106\u5f31\u6027\u5e76\u5b9a\u4f4d\u4e3b\u8981\u653b\u51fb\u6765\u6e90\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24076", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u53ef\u9760\u6027\u8bc4\u4f30", "\u5bf9\u6297\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24076v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AgentWorld: Personality-Aware Reliability Evaluation for Agentic Information Retrieval", "tldr": "\u672c\u6587\u63d0\u51fa AgentWorld\uff0c\u7528\u5927\u4e94\u4eba\u683c\u7528\u6237\u6a21\u62df\u3001\u72b6\u6001\u5316\u5de5\u5177\u73af\u5883\u548c pass^k \u4e00\u81f4\u6027\u7b49\u673a\u5236\uff0c\u8bc4\u4f30\u667a\u80fd\u4f53\u4fe1\u606f\u68c0\u7d22\u5728\u4e0d\u540c\u4eba\u683c\u4e0e\u5bf9\u6297\u6270\u52a8\u4e0b\u7684\u53ef\u9760\u6027\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u4eba\u683c\u5dee\u5f02\u80fd\u66b4\u9732\u7edf\u4e00\u7528\u6237\u6d4b\u8bd5\u9057\u6f0f\u7684\u5931\u8d25\u6a21\u5f0f\uff0c\u5982\u8de8\u57df\u6cc4\u6f0f\u3001\u4e0a\u4e0b\u6587\u6f02\u79fb\u548c\u663e\u8457\u901a\u8fc7\u7387\u5dee\u5f02\uff1b\u98ce\u9669\u5206\u6790\u5668\u8fd8\u80fd\u91cf\u5316\u8f68\u8ff9\u7ea7\u8106\u5f31\u6027\u5e76\u5b9a\u4f4d\u4e3b\u8981\u653b\u51fb\u6765\u6e90\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-based multi-agent trading systems, in which specialized agents collaborate through structured communication to produce trading decisions, are moving rapidly from research prototypes to live deployments that control real assets. The same inter-agent communication that makes them effective also exposes them: a corrupted signal can propagate to the final decision and translate into realized financial loss. Unlike prior attacks that presume privileged access to system internals, we restrict the adversary to what is practically reachable---the source data and prompts agents consume---yielding a low-barrier, and thus democratized threat model instantiated as role-specific adversaries. We present the first systematic empirical study in the financial domain to characterize how an adversarial signal enters a multi-agent trading system and how far it survives toward the decision. Along the role axis, we decompose a widely-used trading pipeline into four functional roles---Analyst, Researcher, Trader, and Risk Manager---and pair each with an attack matched to its interface. Along the structural axis, we evaluate four communication topologies under data- and agent-level attacks, using the Adversarial Signal Preservation Score (APS) as a post-hoc lens on why some designs are more robust than others. We conduct experiments across five assets, two backbones, and two target directions. A central finding is that no architecture is inherently robust. These findings provide insights for the future design of safer and more robust agentic trading systems.", "arxiv_id": "2608.24069", "arxiv_url": "https://arxiv.org/abs/2608.24069", "authors": ["CheolWon Na", "Hao Ni", "Lukasz Szpruch", "Zhangyang Wang", "Dhagash Mehta", "Saurabh Nagrecha", "Alejandro Lopez-Lira", "Chanyeol Choi", "Yongjae Lee", "Jee-Hyong Lee"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u57fa\u4e8e\u5927\u6a21\u578b\u7684\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u7cfb\u7edf\u5728\u4e0d\u540c\u89d2\u8272\u548c\u901a\u4fe1\u67b6\u6784\u4e0b\u7684\u6295\u6bd2\u8106\u5f31\u6027\uff0c\u653b\u51fb\u8005\u4ec5\u901a\u8fc7\u53ef\u63a5\u89e6\u7684\u6570\u636e\u6e90\u548c\u63d0\u793a\u6ce8\u5165\u5bf9\u6297\u4fe1\u53f7\u3002\u5b9e\u9a8c\u8986\u76d6\u591a\u8d44\u4ea7\u3001\u6a21\u578b\u9aa8\u5e72\u548c\u76ee\u6807\u65b9\u5411\uff0c\u53d1\u73b0\u5bf9\u6297\u4fe1\u53f7\u53ef\u5728\u667a\u80fd\u4f53\u95f4\u4f20\u64ad\u5e76\u5f71\u54cd\u6700\u7ec8\u4ea4\u6613\u51b3\u7b56\uff0c\u4e14\u6ca1\u6709\u4e00\u79cd\u901a\u4fe1\u67b6\u6784\u5929\u7136\u9c81\u68d2\u3002", "categories": ["cs.AI", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24069", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878d\u4ea4\u6613", "\u5bf9\u6297\u653b\u51fb", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24069v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Poisoning Agentic Alpha: Adversarial Vulnerabilities Across Roles and Architectures in Multi-Agent Trading Systems", "tldr": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u57fa\u4e8e\u5927\u6a21\u578b\u7684\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u7cfb\u7edf\u5728\u4e0d\u540c\u89d2\u8272\u548c\u901a\u4fe1\u67b6\u6784\u4e0b\u7684\u6295\u6bd2\u8106\u5f31\u6027\uff0c\u653b\u51fb\u8005\u4ec5\u901a\u8fc7\u53ef\u63a5\u89e6\u7684\u6570\u636e\u6e90\u548c\u63d0\u793a\u6ce8\u5165\u5bf9\u6297\u4fe1\u53f7\u3002\u5b9e\u9a8c\u8986\u76d6\u591a\u8d44\u4ea7\u3001\u6a21\u578b\u9aa8\u5e72\u548c\u76ee\u6807\u65b9\u5411\uff0c\u53d1\u73b0\u5bf9\u6297\u4fe1\u53f7\u53ef\u5728\u667a\u80fd\u4f53\u95f4\u4f20\u64ad\u5e76\u5f71\u54cd\u6700\u7ec8\u4ea4\u6613\u51b3\u7b56\uff0c\u4e14\u6ca1\u6709\u4e00\u79cd\u901a\u4fe1\u67b6\u6784\u5929\u7136\u9c81\u68d2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Manufacturing process planning transforms heterogeneous design information into coherent manufacturing decisions. However, existing approaches focus on isolated subtasks, such as feature recognition, drawing interpretation, or tool selection, and struggle to support the full reasoning chain from design artifacts to process plans. This is critical when planning must interpret 3D CAD models, 2D engineering drawings, materials, and domain-specific rules. To address this gap, this paper presents Design-to-Plan, a large language model (LLM)-based multi-agent framework for end-to-end manufacturing process planning. An orchestrator coordinates specialized agents for 3D feature recognition, 2D drawing analysis, 2D-3D context fusion, knowledge retrieval, process sequencing, tool selection, and report generation. Rather than using LLMs as standalone text generators, the framework deploys them as reasoning agents that interact with deterministic modules and knowledge sources to produce consistent and traceable decisions. In this hybrid design, deterministic modules and specialized agents extract structured information from CAD and drawing inputs, while LLM agents perform context-aware reasoning, retrieve manufacturing rules, resolve conflicts, and generate planning outputs. The framework is evaluated using 300 benchmark cases across three downstream ReAct-enabled agents, plus separate evaluations of CAD feature recognition, drawing analysis, and 2D-3D context fusion. The parallel architecture achieves 100% success across downstream agents, Tool F1 scores of 95.9%-97.6%, 90% source detection accuracy in conflict analysis, and a 60%-68% reduction in token usage for key planning tasks. Results show that structured LLM-based multi-agent coordination can bridge design representations and manufacturing knowledge, enabling scalable, efficient, and traceable design-to-plan automation.", "arxiv_id": "2608.24039", "arxiv_url": "https://arxiv.org/abs/2608.24039", "authors": ["Muhammad Tayyab Khan", "Lequn Chen", "Wenhe Feng", "Seung Ki Moon"], "brief": "\u672c\u6587\u63d0\u51fa Design-to-Plan\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u591a\u667a\u80fd\u4f53\u5236\u9020\u5de5\u827a\u89c4\u5212\u6846\u67b6\uff0c\u53ef\u4ece 3D CAD\u30012D \u5de5\u7a0b\u56fe\u3001\u6750\u6599\u4e0e\u9886\u57df\u89c4\u5219\u4e2d\u7aef\u5230\u7aef\u751f\u6210\u53ef\u8ffd\u6eaf\u5de5\u827a\u8ba1\u5212\u3002\u7cfb\u7edf\u901a\u8fc7\u7f16\u6392\u7279\u5f81\u8bc6\u522b\u3001\u56fe\u7eb8\u5206\u6790\u30012D-3D \u878d\u5408\u3001\u77e5\u8bc6\u68c0\u7d22\u3001\u5de5\u5e8f\u6392\u5e8f\u548c\u5200\u5177\u9009\u62e9\u7b49\u667a\u80fd\u4f53\uff0c\u5728 300 \u4e2a\u57fa\u51c6\u6848\u4f8b\u4e2d\u5b9e\u73b0\u4e0b\u6e38\u4efb\u52a1 100% \u6210\u529f\u7387\u3001\u5200\u5177 F1 \u8fbe 95.9%-97.6%\uff0c\u5e76\u663e\u8457\u51cf\u5c11 token \u4f7f\u7528\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24039", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5236\u9020\u89c4\u5212", "3D CAD"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24039v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Design-to-Plan: A Large Language Model-Based Multi-Agent Framework for Manufacturing Process Planning from 3D CAD Models and 2D Engineering Drawings", "tldr": "\u672c\u6587\u63d0\u51fa Design-to-Plan\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u591a\u667a\u80fd\u4f53\u5236\u9020\u5de5\u827a\u89c4\u5212\u6846\u67b6\uff0c\u53ef\u4ece 3D CAD\u30012D \u5de5\u7a0b\u56fe\u3001\u6750\u6599\u4e0e\u9886\u57df\u89c4\u5219\u4e2d\u7aef\u5230\u7aef\u751f\u6210\u53ef\u8ffd\u6eaf\u5de5\u827a\u8ba1\u5212\u3002\u7cfb\u7edf\u901a\u8fc7\u7f16\u6392\u7279\u5f81\u8bc6\u522b\u3001\u56fe\u7eb8\u5206\u6790\u30012D-3D \u878d\u5408\u3001\u77e5\u8bc6\u68c0\u7d22\u3001\u5de5\u5e8f\u6392\u5e8f\u548c\u5200\u5177\u9009\u62e9\u7b49\u667a\u80fd\u4f53\uff0c\u5728 300 \u4e2a\u57fa\u51c6\u6848\u4f8b\u4e2d\u5b9e\u73b0\u4e0b\u6e38\u4efb\u52a1 100% \u6210\u529f\u7387\u3001\u5200\u5177 F1 \u8fbe 95.9%-97.6%\uff0c\u5e76\u663e\u8457\u51cf\u5c11 token \u4f7f\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM agents integrated with external resources gain complex task capabilities, yet the unified natural-language context channel makes them vulnerable to injection attacks: untrusted external data may be dynamically parsed as behavior-guiding instructions during LLM inference, thereby subverting the agent\u0027s decision. Existing defenses focus on static detection or isolation of malicious content at the input/output level, remains insufficient for detecting such dynamic inducements that arise during model reasoning. We propose Attnlocate, a runtime framework for fine-grained localization of context spans that genuinely influence tool-calling decisions, i.e., behavior-guiding instructions. Attnlocate casts this localization problem as an object detection task, aiming to detect the distinctive activation traces induced by behavior-guiding instructions within the attention matrix. Specifically, we design a multi-head, multi-layer attention aggregation scheme to construct a token-level feature space tailored for object detection. Then, a 1-D U-Net equipped with an anchor-free detection head is deployed to detect these spans. Finally, based on the authority of the provider from which the detected behavior-guiding spans originate, Attnlocate dynamically adjudicates malicious invocation attempts. We evaluate Attnlocate across ten agent configurations from five LLM families, covering scenarios involving indirect prompt injection and tool poisoning. Attnlocate achieves a mean IoU of 0.743, an average AUROC of 0.956, and a 0.934 true-positive rate at 0.067 false-positive rate. It also transfers effectively across unseen models and supports authority policy adaptation without retraining.", "arxiv_id": "2608.24022", "arxiv_url": "https://arxiv.org/abs/2608.24022", "authors": ["Yichao Gao", "Yumo Zhang", "Yunhao Yao", "Haohua Du", "Puhan Luo", "Ruiqi Li", "Zhiqiang Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Attnlocate\uff0c\u5728\u8fd0\u884c\u65f6\u5b9a\u4f4d\u771f\u6b63\u5f71\u54cd\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u51b3\u7b56\u7684\u4e0a\u4e0b\u6587\u7247\u6bb5\uff0c\u7528\u4e8e\u8bc6\u522b\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u548c\u5de5\u5177\u6295\u6bd2\u4e2d\u7684\u8d8a\u6743\u884c\u4e3a\u8bf1\u5bfc\u3002\u65b9\u6cd5\u5c06\u6ce8\u610f\u529b\u77e9\u9635\u4e2d\u7684\u6fc0\u6d3b\u75d5\u8ff9\u5efa\u6a21\u4e3a\u4e00\u7ef4\u76ee\u6807\u68c0\u6d4b\u4efb\u52a1\uff0c\u5e76\u7ed3\u5408\u6765\u6e90\u6743\u9650\u52a8\u6001\u88c1\u51b3\u6076\u610f\u8c03\u7528\uff1b\u5728\u591a\u4e2a\u6a21\u578b\u548c\u667a\u80fd\u4f53\u914d\u7f6e\u4e0a\u53d6\u5f97\u8f83\u9ad8 AUROC\u3001IoU \u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u6548\u679c\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24022", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u63d0\u793a\u6ce8\u5165", "\u5927\u6a21\u578b\u5b89\u5168", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24022v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "What Guides the Agent? Adjudicating Unauthorized Behavior via Localizing Behavior-Guiding Instructions", "tldr": "\u8bba\u6587\u63d0\u51fa Attnlocate\uff0c\u5728\u8fd0\u884c\u65f6\u5b9a\u4f4d\u771f\u6b63\u5f71\u54cd\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\u51b3\u7b56\u7684\u4e0a\u4e0b\u6587\u7247\u6bb5\uff0c\u7528\u4e8e\u8bc6\u522b\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u548c\u5de5\u5177\u6295\u6bd2\u4e2d\u7684\u8d8a\u6743\u884c\u4e3a\u8bf1\u5bfc\u3002\u65b9\u6cd5\u5c06\u6ce8\u610f\u529b\u77e9\u9635\u4e2d\u7684\u6fc0\u6d3b\u75d5\u8ff9\u5efa\u6a21\u4e3a\u4e00\u7ef4\u76ee\u6807\u68c0\u6d4b\u4efb\u52a1\uff0c\u5e76\u7ed3\u5408\u6765\u6e90\u6743\u9650\u52a8\u6001\u88c1\u51b3\u6076\u610f\u8c03\u7528\uff1b\u5728\u591a\u4e2a\u6a21\u578b\u548c\u667a\u80fd\u4f53\u914d\u7f6e\u4e0a\u53d6\u5f97\u8f83\u9ad8 AUROC\u3001IoU \u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present Crase, a bounded and inspectable alternative to deep research agents for scholarly search. Instead of an open-ended search loop, Crase queries a search engine once for seed papers, expands them along their 1.5-hop citation neighborhood, prunes citation edges whose claims lack entailment support, and ranks the remaining papers with a recency-aware random walk. This makes the candidate set, the reason each paper is kept, and the stopping condition explicit and fixed before inference. On LitSearch and one further benchmarks over a 500K-paper arXiv corpus, Crase outperforms deep research agents built on proprietary models by up to 3$\\times$ recall@50 at roughly a third of the cost.", "arxiv_id": "2608.24809", "arxiv_url": "https://arxiv.org/abs/2608.24809", "authors": ["Rima Hazra", "Sayan Layek", "Somnath Banerjee", "Soumen Chakrabarti", "Animesh Mukherjee"], "brief": "\u8bba\u6587\u63d0\u51fa Crase\uff0c\u4e00\u79cd\u7528\u4e8e\u5b66\u672f\u6df1\u5ea6\u641c\u7d22\u7684\u6709\u754c\u3001\u53ef\u68c0\u67e5\u65b9\u6cd5\uff1a\u5148\u68c0\u7d22\u79cd\u5b50\u8bba\u6587\uff0c\u518d\u6cbf 1.5 \u8df3\u5f15\u7528\u56fe\u6269\u5c55\uff0c\u5e76\u7528\u8574\u542b\u9a8c\u8bc1\u526a\u679d\u4e0d\u53ef\u9760\u5f15\u7528\u8fb9\u3002\u5b83\u5728 50 \u4e07\u7bc7 arXiv \u8bed\u6599\u7684\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u57fa\u4e8e\u95ed\u6e90\u6a21\u578b\u7684\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u6700\u9ad8\u63d0\u5347\u7ea6 3 \u500d recall@50\uff0c\u6210\u672c\u7ea6\u4e3a\u4e09\u5206\u4e4b\u4e00\u3002", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24809", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5b66\u672f\u641c\u7d22", "\u4fe1\u606f\u68c0\u7d22", "\u5f15\u7528\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24809v1", "published_at": "2026-08-25", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Structurally-bounded Agentic Graph Exploration for Evidence-Grounded Scholarly DeepSearch", "tldr": "\u8bba\u6587\u63d0\u51fa Crase\uff0c\u4e00\u79cd\u7528\u4e8e\u5b66\u672f\u6df1\u5ea6\u641c\u7d22\u7684\u6709\u754c\u3001\u53ef\u68c0\u67e5\u65b9\u6cd5\uff1a\u5148\u68c0\u7d22\u79cd\u5b50\u8bba\u6587\uff0c\u518d\u6cbf 1.5 \u8df3\u5f15\u7528\u56fe\u6269\u5c55\uff0c\u5e76\u7528\u8574\u542b\u9a8c\u8bc1\u526a\u679d\u4e0d\u53ef\u9760\u5f15\u7528\u8fb9\u3002\u5b83\u5728 50 \u4e07\u7bc7 arXiv \u8bed\u6599\u7684\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u57fa\u4e8e\u95ed\u6e90\u6a21\u578b\u7684\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\u6700\u9ad8\u63d0\u5347\u7ea6 3 \u500d recall@50\uff0c\u6210\u672c\u7ea6\u4e3a\u4e09\u5206\u4e4b\u4e00\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A unified audio model must recognize and understand linguistic, paralinguistic, and environmental information while supporting speech synthesis and editing. A key challenge is representation: understanding favors compact features suited to long-context modeling, whereas speech generation requires reconstructible features that preserve fine-grained acoustic detail. We introduce FireRedAudio, a general-purpose audio language model with a shared 9B-parameter LLM. To the best of our knowledge, it is the first publicly disclosed unified audio-language model to provide separate continuous input representations for understanding and generation within a single trainable autoregressive LLM. Audio to be recognized or analyzed is processed by a dedicated Audio Encoder, while speech inputs for generation use a RedAE-based pathway. The LLM directly generates text or conditions a flow-matching DiT to produce continuous acoustic latents. Through progressive multitask training, FireRedAudio supports ASR and audio understanding, with the latter extending to recordings of up to one hour, as well as zero-shot TTS, Instruct TTS, and semantic and acoustic speech editing. Its structured organization of long-form audio achieves second-level timestamp accuracy. Across comprehensive evaluations, FireRedAudio achieves competitive or leading performance in audio understanding and multilingual ASR, strong content accuracy and speaker preservation in zero-shot TTS, leading instruction following in Instruct TTS, and substantial improvements over Ming-UniAudio-Edit in both semantic and acoustic speech editing. These results demonstrate the viability of decoupled continuous input representations for unifying audio understanding and continuous-latent speech generation in a model of moderate scale. Our code is available at https://github.com/FireRedTeam/FireRedAudio.", "arxiv_id": "2608.24168", "arxiv_url": "https://arxiv.org/abs/2608.24168", "authors": ["Junjie Li", "Xuelong Geng", "Kun Xie", "Feiyu Shen", "Yichen Wu", "Ziqi Dai", "Yichen Han", "Yan Jia", "Kai Huang", "Junjie Chen", "Yixuan Li", "Manzhen Wei", "Fenglong Xie", "Lei Xie", "Xu Tang", "Yao Hu"], "brief": "FireRedAudio \u63d0\u51fa\u4e00\u4e2a\u5171\u4eab 9B \u53c2\u6570 LLM \u7684\u901a\u7528\u97f3\u9891\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u540c\u4e00\u81ea\u56de\u5f52\u6846\u67b6\u4e2d\u4e3a\u97f3\u9891\u7406\u89e3\u548c\u8bed\u97f3\u751f\u6210\u89e3\u8026\u4f7f\u7528\u4e0d\u540c\u7684\u8fde\u7eed\u8868\u793a\u3002\u6a21\u578b\u652f\u6301\u957f\u8fbe\u4e00\u5c0f\u65f6\u7684\u97f3\u9891\u7406\u89e3\u3001\u591a\u8bed\u79cd ASR\u3001\u96f6\u6837\u672c/\u6307\u4ee4\u5f0f TTS \u4ee5\u53ca\u8bed\u4e49\u548c\u58f0\u5b66\u8bed\u97f3\u7f16\u8f91\uff0c\u5e76\u5728\u591a\u9879\u8bc4\u6d4b\u4e2d\u8fbe\u5230\u6709\u7ade\u4e89\u529b\u6216\u9886\u5148\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24168", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u8bed\u8a00\u6a21\u578b", "\u8bed\u97f3\u8bc6\u522b", "\u8bed\u97f3\u5408\u6210", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24168v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FireRedAudio: A General-Purpose Audio Language Model with Decoupled Continuous Representations for Understanding and Generation", "tldr": "FireRedAudio \u63d0\u51fa\u4e00\u4e2a\u5171\u4eab 9B \u53c2\u6570 LLM \u7684\u901a\u7528\u97f3\u9891\u8bed\u8a00\u6a21\u578b\uff0c\u5728\u540c\u4e00\u81ea\u56de\u5f52\u6846\u67b6\u4e2d\u4e3a\u97f3\u9891\u7406\u89e3\u548c\u8bed\u97f3\u751f\u6210\u89e3\u8026\u4f7f\u7528\u4e0d\u540c\u7684\u8fde\u7eed\u8868\u793a\u3002\u6a21\u578b\u652f\u6301\u957f\u8fbe\u4e00\u5c0f\u65f6\u7684\u97f3\u9891\u7406\u89e3\u3001\u591a\u8bed\u79cd ASR\u3001\u96f6\u6837\u672c/\u6307\u4ee4\u5f0f TTS \u4ee5\u53ca\u8bed\u4e49\u548c\u58f0\u5b66\u8bed\u97f3\u7f16\u8f91\uff0c\u5e76\u5728\u591a\u9879\u8bc4\u6d4b\u4e2d\u8fbe\u5230\u6709\u7ade\u4e89\u529b\u6216\u9886\u5148\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper extends Anthropic\u0027s Sleeper Agents research [1], which showed artificial backdoors persist through safety training \u0026 can be detected by linear probes with \u003e99% accuracy [2]. However, probe-based detection relies on linear separability that may be an artefact of backdoor insertion rather than a property of naturally occurring deceptive alignment. Sophisticated deceptive behaviours emerging through natural training are unlikely to produce such convenient linear signals. We introduce a naturalistic methodology using multi-turn context windows that simulates realistic deceptive reasoning without artificial triggers or supervised backdoor insertion. Rather than binary trigger-response patterns, we examine how semantic complexity emerges through gradual context development. Building on our Curved Inference framework, we analyse curvature, salience, \u0026 introduce semantic surface area (A\u0027), a new metric of representational work capturing both the magnitude \u0026 directional change of meaning construction in unnormalised residual space. Without backdoors, labels, or probes, we apply this framework to naturalistic deceptive prompts \u0026 classify model outputs via LLM consensus. Geometric structure reliably predicts semantic classification, with statistically significant differences in surface area across five prompt strategies \u0026 two model families. Critically, measurement precision can reveal geometric signatures hidden by classification noise - some strategies improve from non-significant (p = 0.555) to significant (p = 0.048). This validates that sophisticated reasoning creates intrinsic geometric patterns that persist even when detection appears to fail, suggesting the shape of inference itself encodes semantic patterns regardless of whether models have learned to suppress linear indicators of deception - a scalable, unsupervised path for detection when linear methods fail.", "arxiv_id": "2608.24037", "arxiv_url": "https://arxiv.org/abs/2608.24037", "authors": ["Rob Manson"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u7ebf\u6027\u63a2\u9488\u3001\u6807\u7b7e\u6216\u4eba\u5de5\u540e\u95e8\u7684\u68c0\u6d4b\u65b9\u6cd5\uff0c\u901a\u8fc7\u591a\u8f6e\u4e0a\u4e0b\u6587\u6a21\u62df\u81ea\u7136\u6b3a\u9a97\u6027\u63a8\u7406\uff0c\u5e76\u5206\u6790\u6b8b\u5dee\u7a7a\u95f4\u4e2d\u7684\u66f2\u7387\u3001\u663e\u8457\u6027\u548c\u201c\u8bed\u4e49\u8868\u9762\u79ef\u201d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8fd9\u4e9b\u51e0\u4f55\u7279\u5f81\u80fd\u663e\u8457\u9884\u6d4b\u8f93\u51fa\u8bed\u4e49\u5206\u7c7b\uff0c\u5728\u7ebf\u6027\u68c0\u6d4b\u5931\u6548\u6216\u5206\u7c7b\u566a\u58f0\u8f83\u5927\u65f6\u4ecd\u80fd\u63ed\u793a\u6f5c\u5728\u6b3a\u9a97\u6a21\u5f0f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24037", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u5b89\u5168", "\u540e\u95e8\u68c0\u6d4b", "\u51e0\u4f55\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24037v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Curved Inference II: Sleeper Agent Geometry - Extending Interpretability Beyond Probes", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u7ebf\u6027\u63a2\u9488\u3001\u6807\u7b7e\u6216\u4eba\u5de5\u540e\u95e8\u7684\u68c0\u6d4b\u65b9\u6cd5\uff0c\u901a\u8fc7\u591a\u8f6e\u4e0a\u4e0b\u6587\u6a21\u62df\u81ea\u7136\u6b3a\u9a97\u6027\u63a8\u7406\uff0c\u5e76\u5206\u6790\u6b8b\u5dee\u7a7a\u95f4\u4e2d\u7684\u66f2\u7387\u3001\u663e\u8457\u6027\u548c\u201c\u8bed\u4e49\u8868\u9762\u79ef\u201d\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8fd9\u4e9b\u51e0\u4f55\u7279\u5f81\u80fd\u663e\u8457\u9884\u6d4b\u8f93\u51fa\u8bed\u4e49\u5206\u7c7b\uff0c\u5728\u7ebf\u6027\u68c0\u6d4b\u5931\u6548\u6216\u5206\u7c7b\u566a\u58f0\u8f83\u5927\u65f6\u4ecd\u80fd\u63ed\u793a\u6f5c\u5728\u6b3a\u9a97\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Action-conditioned world models are increasingly used as learned simulators for policy evaluation and improvement, yet their effectiveness rests on an unverified assumption: generated futures faithfully reflect arbitrary valid actions. Existing benchmarks are typically confined to expert demonstrations, leaving off-expert action following inadequately evaluated. To address this gap, we introduce WorldEcho, which probes action following over a broader action distribution using visual integrity and SE(3) trajectory alignment. Our diagnosis shows that current world models reasonably execute expert actions but struggle with diverse off-expert trajectories, either ignoring the commanded actions or producing visually invalid rollouts. We further propose WorldSync, which strengthens action following along three complementary axes: distributional coverage, representational grounding, and intervention-effect alignment. It broadens the training distribution over action consequences, grounds intermediate video representations in action-induced robot dynamics through an Action-Forcing Expert, and aligns predicted changes under action interventions with the corresponding changes in ground-truth futures. Experiments on RoboTwin benchmarks and real-robot tasks show that WorldSync improves WorldEcho metrics and serves as a more reliable simulator for iterative policy improvement, enabling policies to achieve higher success rates.", "arxiv_id": "2608.24885", "arxiv_url": "https://arxiv.org/abs/2608.24885", "authors": ["Sixiang Chen", "Jiaming Liu", "Jixian Wu", "Yichen Guo", "Tinghao Wang", "Siyuan Qian", "Hao Chen", "Jiajun Cao", "Jian Tang", "Shanghang Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa WorldEcho\uff0c\u7528\u89c6\u89c9\u5b8c\u6574\u6027\u548c SE(3) \u8f68\u8ff9\u5bf9\u9f50\u8bc4\u4f30\u673a\u5668\u4eba\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u662f\u5426\u771f\u6b63\u8ddf\u968f\u52a8\u4f5c\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u5728\u4e13\u5bb6\u52a8\u4f5c\u4e0a\u5c1a\u53ef\uff0c\u4f46\u5728\u79bb\u4e13\u5bb6\u5206\u5e03\u52a8\u4f5c\u4e0a\u5e38\u5ffd\u7565\u6307\u4ee4\u6216\u751f\u6210\u5931\u771f\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa WorldSync\uff0c\u4ece\u8bad\u7ec3\u5206\u5e03\u8986\u76d6\u3001\u52a8\u4f5c\u52a8\u529b\u5b66\u8868\u5f81 grounding \u548c\u5e72\u9884\u6548\u679c\u5bf9\u9f50\u4e09\u65b9\u9762\u6539\u8fdb\u52a8\u4f5c\u8ddf\u968f\uff0c\u5728 RoboTwin \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u63d0\u5347\u8bc4\u6d4b\u6307\u6807\u4e0e\u7b56\u7565\u8fed\u4ee3\u6210\u529f\u7387\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24885", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u7b56\u7565\u5b66\u4e60", "\u52a8\u4f5c\u6761\u4ef6\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24885v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Do Robotic World Models Really Follow Actions? Diagnosing and Aligning Action-Conditioned Generation for Policy Learning", "tldr": "\u8bba\u6587\u63d0\u51fa WorldEcho\uff0c\u7528\u89c6\u89c9\u5b8c\u6574\u6027\u548c SE(3) \u8f68\u8ff9\u5bf9\u9f50\u8bc4\u4f30\u673a\u5668\u4eba\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u662f\u5426\u771f\u6b63\u8ddf\u968f\u52a8\u4f5c\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u5728\u4e13\u5bb6\u52a8\u4f5c\u4e0a\u5c1a\u53ef\uff0c\u4f46\u5728\u79bb\u4e13\u5bb6\u5206\u5e03\u52a8\u4f5c\u4e0a\u5e38\u5ffd\u7565\u6307\u4ee4\u6216\u751f\u6210\u5931\u771f\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa WorldSync\uff0c\u4ece\u8bad\u7ec3\u5206\u5e03\u8986\u76d6\u3001\u52a8\u4f5c\u52a8\u529b\u5b66\u8868\u5f81 grounding \u548c\u5e72\u9884\u6548\u679c\u5bf9\u9f50\u4e09\u65b9\u9762\u6539\u8fdb\u52a8\u4f5c\u8ddf\u968f\uff0c\u5728 RoboTwin \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u63d0\u5347\u8bc4\u6d4b\u6307\u6807\u4e0e\u7b56\u7565\u8fed\u4ee3\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Smart glasses are evolving from capture and display accessories into first-person intelligence platforms that connect human perception, persistent context, and digital or physical action. Their on-body viewpoint aligns with the wearer\u0027s vision, audition, motion, and hand-object interaction, but must operate under tight energy, thermal, privacy, and feedback constraints. Despite rapid progress in augmented reality, egocentric vision, multimodal models, human-computer interaction, and embodied intelligence, the literature remains fragmented across devices, tasks, and benchmarks. \\textit{The key challenge is not whether a model can recognize, answer, remember, or act in isolation, but whether a complete system can sustain a reliable, temporally valid, correctable, and governable perception-state-interaction-action loop.} This survey is \\textit{the \\textbf{first} to systematically study smart glasses through such a unified framework}. We formalize first-person data flow and constrained task utility, characterize devices along eight verifiable hardware capability axes, organize the literature around seven interdependent foundational capabilities, and introduce an L0-L5 framework spanning capture, reactive perception, contextual assistance, persistent state, governed action, and embodied coupling. Across nine application scenes, we connect tasks with datasets, systems, products, stakeholders, failure consequences, and evidence gaps. We further present a nine-dimensional deployment framework, a claim-conditioned evaluation protocol, and an evidence ladder from controlled measurement to longitudinal field validation and audit. Together, these elements make smart glasses more comparable, deployable, and reproducibly evaluated, while outlining a roadmap toward trustworthy first-person intelligence.", "arxiv_id": "2608.24877", "arxiv_url": "https://arxiv.org/abs/2608.24877", "authors": ["Jiangning Zhang", "Haojun Chen", "Yong Liu"], "brief": "\u8fd9\u7bc7\u7efc\u8ff0\u5c06\u667a\u80fd\u773c\u955c\u4ece\u5355\u7eaf\u91c7\u96c6/\u663e\u793a\u8bbe\u5907\u91cd\u65b0\u5b9a\u4e49\u4e3a\u7b2c\u4e00\u4eba\u79f0\u667a\u80fd\u5e73\u53f0\uff0c\u7edf\u4e00\u8ba8\u8bba\u611f\u77e5\u3001\u72b6\u6001\u3001\u4ea4\u4e92\u4e0e\u884c\u52a8\u95ed\u73af\u3002\u8bba\u6587\u63d0\u51fa\u786c\u4ef6\u80fd\u529b\u8f74\u3001L0-L5\u80fd\u529b\u6846\u67b6\u3001\u90e8\u7f72\u4e0e\u8bc4\u6d4b\u534f\u8bae\uff0c\u65e8\u5728\u8ba9\u667a\u80fd\u773c\u955c\u7cfb\u7edf\u66f4\u53ef\u6bd4\u8f83\u3001\u53ef\u90e8\u7f72\u3001\u53ef\u5ba1\u8ba1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24877", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u773c\u955c", "\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24877v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Seeing to Acting: Smart Glasses as First-Person Intelligence Platforms", "tldr": "\u8fd9\u7bc7\u7efc\u8ff0\u5c06\u667a\u80fd\u773c\u955c\u4ece\u5355\u7eaf\u91c7\u96c6/\u663e\u793a\u8bbe\u5907\u91cd\u65b0\u5b9a\u4e49\u4e3a\u7b2c\u4e00\u4eba\u79f0\u667a\u80fd\u5e73\u53f0\uff0c\u7edf\u4e00\u8ba8\u8bba\u611f\u77e5\u3001\u72b6\u6001\u3001\u4ea4\u4e92\u4e0e\u884c\u52a8\u95ed\u73af\u3002\u8bba\u6587\u63d0\u51fa\u786c\u4ef6\u80fd\u529b\u8f74\u3001L0-L5\u80fd\u529b\u6846\u67b6\u3001\u90e8\u7f72\u4e0e\u8bc4\u6d4b\u534f\u8bae\uff0c\u65e8\u5728\u8ba9\u667a\u80fd\u773c\u955c\u7cfb\u7edf\u66f4\u53ef\u6bd4\u8f83\u3001\u53ef\u90e8\u7f72\u3001\u53ef\u5ba1\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Latent world models are inherently strong encoders that transform image pixel to latent embedding, yet existing world models still rely on online trajectory optimization for action planning: for every state-goal pair, an iterative optimizer is run from scratch to search for optimal action sequences, treating the world model as a black-box simulator. This approach pays the full iterative optimization cost anew at every replanning step and reuses no planning experience across queries. In this work, we ask whether planning itself can be amortized once a latent world model has been learned. We present LeFlow, which learns a reusable latent trajectory prior operating directly in the latent dynamics space from the world model. LeFlow recasts planning as conditional latent trajectory generation: a rectified-flow model imagines a future latent path between the current and goal embeddings, an inverse dynamics decoder turns latent transitions into action chunks, and the frozen world model verifies each candidate by autoregressive rollout. Across four major goal-conditioned pixel-control benchmarks, LeFlow replaces iterative action-space optimization with amortized latent planning and fixed-budget rollout selection, achieving consistent success-rate gains with an order-of-magnitude reduction in planning time. Our results argue that latent world models should support not only prediction but reusable planning priors. Our code is available at https://github.com/hsiangwei0903/LeFlow.", "arxiv_id": "2608.24855", "arxiv_url": "https://arxiv.org/abs/2608.24855", "authors": ["Hsiang-Wei Huang", "Jianxu Shangguan", "Junbin Lu", "Jenq-Neng Hwang"], "brief": "LeFlow \u5728\u5df2\u5b66\u4e60\u7684\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e0a\uff0c\u5c06\u89c4\u5212\u8f6c\u5316\u4e3a\u6761\u4ef6\u6f5c\u5728\u8f68\u8ff9\u751f\u6210\uff1a\u7528 rectified-flow \u751f\u6210\u4ece\u5f53\u524d\u5230\u76ee\u6807\u7684\u6f5c\u5728\u8def\u5f84\uff0c\u518d\u7531\u9006\u52a8\u529b\u5b66\u89e3\u7801\u4e3a\u52a8\u4f5c\u5e76\u7528\u4e16\u754c\u6a21\u578b\u9a8c\u8bc1\u3002\u76f8\u6bd4\u6bcf\u6b21\u4ece\u5934\u505a\u5728\u7ebf\u8f68\u8ff9\u4f18\u5316\uff0c\u5b83\u5728\u591a\u4e2a\u50cf\u7d20\u7ea7\u76ee\u6807\u63a7\u5236\u57fa\u51c6\u4e0a\u63d0\u5347\u6210\u529f\u7387\uff0c\u5e76\u5c06\u89c4\u5212\u65f6\u95f4\u964d\u4f4e\u4e00\u4e2a\u6570\u91cf\u7ea7\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24855", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8f68\u8ff9\u89c4\u5212", "\u751f\u6210\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24855v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LeFlow: Generative Latent Flow Planning for World Models", "tldr": "LeFlow \u5728\u5df2\u5b66\u4e60\u7684\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e0a\uff0c\u5c06\u89c4\u5212\u8f6c\u5316\u4e3a\u6761\u4ef6\u6f5c\u5728\u8f68\u8ff9\u751f\u6210\uff1a\u7528 rectified-flow \u751f\u6210\u4ece\u5f53\u524d\u5230\u76ee\u6807\u7684\u6f5c\u5728\u8def\u5f84\uff0c\u518d\u7531\u9006\u52a8\u529b\u5b66\u89e3\u7801\u4e3a\u52a8\u4f5c\u5e76\u7528\u4e16\u754c\u6a21\u578b\u9a8c\u8bc1\u3002\u76f8\u6bd4\u6bcf\u6b21\u4ece\u5934\u505a\u5728\u7ebf\u8f68\u8ff9\u4f18\u5316\uff0c\u5b83\u5728\u591a\u4e2a\u50cf\u7d20\u7ea7\u76ee\u6807\u63a7\u5236\u57fa\u51c6\u4e0a\u63d0\u5347\u6210\u529f\u7387\uff0c\u5e76\u5c06\u89c4\u5212\u65f6\u95f4\u964d\u4f4e\u4e00\u4e2a\u6570\u91cf\u7ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video games provide a scalable source of training data for video world models, offering diverse environments, complex interactions, and abundant in-the-wild gameplay videos. However, raw gameplay footage entangles the game world with screen-space interfaces, introducing game-specific biases and irrelevant dynamics that hinder world-model training. To address this problem, we introduce GameUI-Taxonomy and G2WEngine, a full-stack framework that formalizes gameplay UI grounding and removal. G2WEngine automatically extracts reusable UI assets from real gameplay videos and synthesizes temporally coherent UI overlays on clean footage. Using this engine, we construct Game2World, comprising 96K synthetic paired videos with precise reconstruction targets and 1,079 in-the-wild clips from 303 games for realistic evaluation. Its asset library contains 5,132 verified UI elements across 21 taxonomy categories, collected from 1,010 representative gameplay frames. Based on Game2World, we propose GameCleaner, a mask-free gameplay UI removal model that combines multimodal semantic understanding with video editing capabilities. Unlike mask-based methods, GameCleaner directly identifies and removes diverse HUD elements while preserving the underlying scene content and temporal dynamics. In a controlled pilot, world models trained on UI-free gameplay improve overall VideoReward by 6.83% over those trained on UI-overlaid data. On UI-removal evaluation, GameCleaner achieves an average AAR of 95.36 on synthetic videos, outperforming the strongest temporal mask baseline by 57.3%, and obtains the best in-the-wild AAR of 80.05 with 99.8 background preservation. These results demonstrate the scalable potential of transforming Internet gameplay videos into high-quality world-model training data. Code, dataset, and model will be available at https://github.com/Dongping-Chen/Game2World.", "arxiv_id": "2608.24680", "arxiv_url": "https://arxiv.org/abs/2608.24680", "authors": ["Wenxuan Shen", "Dongna Jin", "Dongping Chen"], "brief": "\u8bba\u6587\u63d0\u51fa GameUI-Taxonomy \u4e0e G2WEngine\uff0c\u7528\u4e8e\u4ece\u771f\u5b9e\u6e38\u620f\u89c6\u9891\u4e2d\u62bd\u53d6\u3001\u5408\u6210\u5e76\u79fb\u9664 HUD/UI\uff0c\u6784\u5efa\u4e86\u5305\u542b 9.6 \u4e07\u5408\u6210\u914d\u5bf9\u89c6\u9891\u548c 1079 \u4e2a\u771f\u5b9e\u7247\u6bb5\u7684 Game2World \u6570\u636e\u96c6\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u96c6\u8bad\u7ec3\u7684 GameCleaner \u53ef\u65e0\u63a9\u7801\u53bb\u9664\u6e38\u620f\u754c\u9762\u5e76\u4fdd\u7559\u573a\u666f\u52a8\u6001\uff0c\u4f7f\u65e0 UI \u6570\u636e\u8bad\u7ec3\u7684\u4e16\u754c\u6a21\u578b VideoReward \u63d0\u5347 6.83%\uff0cUI \u53bb\u9664\u6548\u679c\u4e5f\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24680", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6570\u636e\u96c6", "\u89c6\u9891\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24680v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Game2World Engine: Unlocking In-the-Wild Gameplay Videos for World Model Training", "tldr": "\u8bba\u6587\u63d0\u51fa GameUI-Taxonomy \u4e0e G2WEngine\uff0c\u7528\u4e8e\u4ece\u771f\u5b9e\u6e38\u620f\u89c6\u9891\u4e2d\u62bd\u53d6\u3001\u5408\u6210\u5e76\u79fb\u9664 HUD/UI\uff0c\u6784\u5efa\u4e86\u5305\u542b 9.6 \u4e07\u5408\u6210\u914d\u5bf9\u89c6\u9891\u548c 1079 \u4e2a\u771f\u5b9e\u7247\u6bb5\u7684 Game2World \u6570\u636e\u96c6\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u96c6\u8bad\u7ec3\u7684 GameCleaner \u53ef\u65e0\u63a9\u7801\u53bb\u9664\u6e38\u620f\u754c\u9762\u5e76\u4fdd\u7559\u573a\u666f\u52a8\u6001\uff0c\u4f7f\u65e0 UI \u6570\u636e\u8bad\u7ec3\u7684\u4e16\u754c\u6a21\u578b VideoReward \u63d0\u5347 6.83%\uff0cUI \u53bb\u9664\u6548\u679c\u4e5f\u663e\u8457\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Joint text-to-video-audio generation produces synchronized visual and acoustic content, but the long sampling trajectories and heterogeneous multimodal computation of large models make inference prohibitively expensive. We present TurboT2VA, a distillation and inference framework for accelerating a 19B-parameter joint video-audio model. Large-scale T2VA distillation is challenged by modality-imbalanced optimization, the difficulty of continuous-time consistency training at scale, and the quality--diversity trade-off. TurboT2VA addresses these issues with per-modality normalization and a progressive curriculum comprising discrete consistency warm-up, continuous consistency refinement, and joint consistency--distribution matching. The curriculum first establishes a stable, diverse generation trajectory and only then introduces distribution-level refinement. On LTX-2, four-step distillation reduces generator latency from 50.52s to 2.51s at the standard evaluation resolution of 512$\\times$768, achieving a 20.1$\\times$ speedup while maintaining strong visual quality, audio fidelity, diversity, and video-audio synchronization. We further develop an architecture-aware inference stack that combines guarded W8A8 and fused operators, padded-text compaction, and modality-aware sparse attention while preserving dense cross-modal and text-conditioning paths. Under the high-resolution deployment setting at 1024$\\times$1792, the complete stack reduces generator latency from 318.74s to 5.83s on one NVIDIA H20, achieving a 54.67$\\times$ generator-only speedup. Inference code and generation demos are available at https://github.com/thu-ml/TurboDiffusion/tree/main/turbot2va.", "arxiv_id": "2608.24674", "arxiv_url": "https://arxiv.org/abs/2608.24674", "authors": ["Xiaoda Yang", "Yuxiang Liu", "Kaiwen Zheng", "Yuan Liu", "Yibo Lai", "Shengpeng Ji", "Kai Jiang", "Jianfei Chen", "Xiaobin Hu", "Shuicheng Yan", "Jintao Zhang", "Jun Zhu", "Zhou Zhao"], "brief": "TurboT2VA \u9762\u5411\u5927\u578b\u6587\u672c\u5230\u89c6\u9891-\u97f3\u9891\u8054\u5408\u751f\u6210\u6a21\u578b\uff0c\u63d0\u51fa\u5206\u6570\u6b63\u5219\u5316\u7684\u4e00\u81f4\u6027\u84b8\u998f\u4e0e\u6e10\u8fdb\u8bad\u7ec3\u6d41\u7a0b\uff0c\u7f13\u89e3\u591a\u6a21\u6001\u4f18\u5316\u4e0d\u5e73\u8861\u548c\u8d28\u91cf-\u591a\u6837\u6027\u6743\u8861\u3002\u5728 LTX-2 \u4e0a\u56db\u6b65\u751f\u6210\u5c06\u5ef6\u8fdf\u4ece 50.52 \u79d2\u964d\u81f3 2.51 \u79d2\uff0c\u5e76\u7ed3\u5408\u91cf\u5316\u3001\u7b97\u5b50\u878d\u5408\u548c\u7a00\u758f\u6ce8\u610f\u529b\u7b49\u63a8\u7406\u4f18\u5316\uff0c\u5728\u9ad8\u5206\u8fa8\u7387\u90e8\u7f72\u4e2d\u5b9e\u73b0\u6700\u9ad8 54.67 \u500d\u52a0\u901f\uff0c\u540c\u65f6\u4fdd\u6301\u89c6\u542c\u8d28\u91cf\u4e0e\u540c\u6b65\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24674", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u6587\u672c\u5230\u89c6\u9891", "\u97f3\u9891\u751f\u6210", "\u6a21\u578b\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24674v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TurboT2VA: Fast Large-Scale Text-to-Video-Audio Generation via Score-Regularized Consistency Distillation", "tldr": "TurboT2VA \u9762\u5411\u5927\u578b\u6587\u672c\u5230\u89c6\u9891-\u97f3\u9891\u8054\u5408\u751f\u6210\u6a21\u578b\uff0c\u63d0\u51fa\u5206\u6570\u6b63\u5219\u5316\u7684\u4e00\u81f4\u6027\u84b8\u998f\u4e0e\u6e10\u8fdb\u8bad\u7ec3\u6d41\u7a0b\uff0c\u7f13\u89e3\u591a\u6a21\u6001\u4f18\u5316\u4e0d\u5e73\u8861\u548c\u8d28\u91cf-\u591a\u6837\u6027\u6743\u8861\u3002\u5728 LTX-2 \u4e0a\u56db\u6b65\u751f\u6210\u5c06\u5ef6\u8fdf\u4ece 50.52 \u79d2\u964d\u81f3 2.51 \u79d2\uff0c\u5e76\u7ed3\u5408\u91cf\u5316\u3001\u7b97\u5b50\u878d\u5408\u548c\u7a00\u758f\u6ce8\u610f\u529b\u7b49\u63a8\u7406\u4f18\u5316\uff0c\u5728\u9ad8\u5206\u8fa8\u7387\u90e8\u7f72\u4e2d\u5b9e\u73b0\u6700\u9ad8 54.67 \u500d\u52a0\u901f\uff0c\u540c\u65f6\u4fdd\u6301\u89c6\u542c\u8d28\u91cf\u4e0e\u540c\u6b65\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The advancement of Embodied AI necessitates high-quality simulation assets that faithfully mirror the real world. However, transforming raw visual observations into simulation-ready scenes remains challenging due to the lack of physical grounding and scene-level interactivity in current image-to-URDF methods. We propose NeoWorld-Pro, a framework that reformulates monocular scene reconstruction as procedural programming for interactive 3D environments. Leveraging the zero-shot reasoning and code synthesis capabilities of MLLMs, NeoWorld-Pro converts a single RGB image into executable programs specifying object geometry, articulation, and physical properties. A physics-in-the-loop mechanism then iteratively refines the generated programs by validating their execution in a physics engine, enforcing physically plausible articulations, valid object compositions and interactions, and accurate spatial relationships. Experiments show that NeoWorld-Pro outperforms open-loop and prior monocular reconstruction methods, while enabling complex downstream tasks such as stable stacking and fine-grained manipulation.", "arxiv_id": "2608.24212", "arxiv_url": "https://arxiv.org/abs/2608.24212", "authors": ["Yumeng He", "Yichen Song", "Xiaotian Yang", "Weijia Zhang", "Zanwei Zhou", "Junru Gong", "Xiaokang Yang", "Yunbo Wang"], "brief": "NeoWorld-Pro \u5c06\u5355\u5f20 RGB \u56fe\u50cf\u91cd\u5efa\u95ee\u9898\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u7684\u7a0b\u5e8f\u751f\u6210\uff0c\u81ea\u52a8\u63cf\u8ff0\u4ea4\u4e92\u5f0f 3D \u573a\u666f\u4e2d\u7684\u7269\u4f53\u51e0\u4f55\u3001\u5173\u8282\u7ed3\u6784\u548c\u7269\u7406\u5c5e\u6027\u3002\u901a\u8fc7\u7269\u7406\u5f15\u64ce\u95ed\u73af\u9a8c\u8bc1\u4e0e\u8fed\u4ee3\u4fee\u6b63\uff0c\u5b83\u6bd4\u4ee5\u5f80\u5355\u76ee\u91cd\u5efa\u548c\u5f00\u73af\u65b9\u6cd5\u66f4\u53ef\u9760\uff0c\u5e76\u652f\u6301\u7a33\u5b9a\u5806\u53e0\u3001\u7cbe\u7ec6\u64cd\u4f5c\u7b49\u5177\u8eab\u4efb\u52a1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24212", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u4e09\u7ef4\u91cd\u5efa", "\u591a\u6a21\u6001", "\u7269\u7406\u4eff\u771f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.24212v1", "published_at": "2026-08-25", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NeoWorld-Pro: Programming Interactive Scenes from Monocular Images for Embodied Simulation", "tldr": "NeoWorld-Pro \u5c06\u5355\u5f20 RGB \u56fe\u50cf\u91cd\u5efa\u95ee\u9898\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u7684\u7a0b\u5e8f\u751f\u6210\uff0c\u81ea\u52a8\u63cf\u8ff0\u4ea4\u4e92\u5f0f 3D \u573a\u666f\u4e2d\u7684\u7269\u4f53\u51e0\u4f55\u3001\u5173\u8282\u7ed3\u6784\u548c\u7269\u7406\u5c5e\u6027\u3002\u901a\u8fc7\u7269\u7406\u5f15\u64ce\u95ed\u73af\u9a8c\u8bc1\u4e0e\u8fed\u4ee3\u4fee\u6b63\uff0c\u5b83\u6bd4\u4ee5\u5f80\u5355\u76ee\u91cd\u5efa\u548c\u5f00\u73af\u65b9\u6cd5\u66f4\u53ef\u9760\uff0c\u5e76\u652f\u6301\u7a33\u5b9a\u5806\u53e0\u3001\u7cbe\u7ec6\u64cd\u4f5c\u7b49\u5177\u8eab\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large vision-language models have shown strong progress in UI-to-code generation, yet their test-time self-evolution remains unstable. We first identify a fundamental obstacle, termed visual repair coupling: a local code edit may propagate through layout, style, and component dependencies, correcting one visual mismatch while degrading regions that were previously faithful. To address this issue, we present RubSE, a Rubric-guided Self-Evolution framework that uses rubrics to represent visual feedback as a structured visual-repair context. At each refinement round, RubSE generates typed candidate rubrics, selects one prioritized repair target, and stores previously selected rubrics as history, thereby steering each revision toward a well-scoped visual repair while discouraging repeated or over-broad changes. Evaluations across six VLMs and three UI-to-code benchmarks demonstrate that RubSE substantially outperforms na\u00efve self-evolution in final-round and best-round settings, achieving more stable refinement trajectories and a higher trajectory-level performance ceiling. Further analysis shows that RubSE mitigates trajectory collapse by improving recovery from severe visual regressions, and that stronger rubric generators can transfer effective visual-repair guidance to weaker code improvers.", "arxiv_id": "2608.24138", "arxiv_url": "https://arxiv.org/abs/2608.24138", "authors": ["Tianyi Xiong", "Zhengyuan Yang", "Xiaofei Wang", "Chung-Ching Lin", "Ruichun Ma", "Kevin Lin", "Zhendong Wang", "Linjie Li", "Chenxi Liu", "Ruibo Chen", "Ramani Duraiswami", "Heng Huang", "Lijuan Wang"], "brief": "\u672c\u6587\u6307\u51fa UI-to-code \u6d4b\u8bd5\u65f6\u81ea\u6211\u8fed\u4ee3\u4e2d\u7684\u201c\u89c6\u89c9\u4fee\u590d\u8026\u5408\u201d\u95ee\u9898\uff1a\u5c40\u90e8\u4ee3\u7801\u4fee\u6539\u53ef\u80fd\u4fee\u597d\u4e00\u5904\u5374\u7834\u574f\u5176\u4ed6\u533a\u57df\u3002\u63d0\u51fa RubSE\uff0c\u7528\u7ed3\u6784\u5316 rubrics \u4f5c\u4e3a\u89c6\u89c9\u4fee\u590d\u4e0a\u4e0b\u6587\u6765\u9009\u62e9\u548c\u7ea6\u675f\u6bcf\u8f6e\u4fee\u653 }
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
