<script>
const PAPERS = [{"abstract": "Computer-use agents increasingly tackle tasks ranging from everyday desktop activities to long-horizon professional workflows. Yet interfaces centered on screenshots and mouse-and-keyboard actions can impose a human-interaction prior, requiring repeated screen interpretation while leaving the computer\u0027s semantic and programmatic capabilities underexposed. We argue for exposing these capabilities and letting models choose and combine them. We introduce Hybrid Computer Use (HCU), a unified interface for general agents that combines three complementary channels: programmatic interaction through code and command-line tools, semantic interaction through accessibility (AX), and visual interaction through graphical user interfaces (GUI). Our HCU supports efficient AX interaction and guards against stale-state actions during channel switching. A supplementary HCU skill guides agents in selecting and coordinating channels to use the unified interface effectively. Our designed AX tools return compact observations, execute actions in batches, and report their effects as AX diffs, so the model needs fewer round trips. On OSWorld 2.0, HCU achieves the highest Partial and Binary scores among the compared systems. Analyzing agent trajectories, we find that all evaluated models improve with HCU yet allocate work across the channels differently and consistently outperform compared baselines in terms of both efficiency and task success, highlighting the value of unified computer-use interfaces that allow flexible channel selection and combination.", "arxiv_id": "2610.41432", "arxiv_url": "https://arxiv.org/abs/2610.41432", "authors": ["Haoqing Wang", "Xiaoyi Zhang", "Sicheng Fan", "Zhexin Zhang", "Xinjie Zhang", "Jiahao Li", "Bin Li", "Yan Lu"], "brief": "\u63d0\u51fa\u7edf\u4e00\u7535\u8111\u64cd\u4f5c\u63a5\u53e3HCU\uff0c\u8ba9\u667a\u80fd\u4f53\u6309\u4efb\u52a1\u7ec4\u5408\u4ee3\u7801\u4e0e\u547d\u4ee4\u884c\u3001\u65e0\u969c\u788d\u8bed\u4e49\u548c\u56fe\u5f62\u754c\u9762\u3002\u901a\u8fc7\u7cbe\u7b80\u89c2\u5bdf\u3001\u6279\u91cf\u64cd\u4f5c\u4e0e\u72b6\u6001\u5dee\u5206\u51cf\u5c11\u4ea4\u4e92\uff0c\u5e76\u9632\u6b62\u901a\u9053\u5207\u6362\u540e\u7684\u8fc7\u671f\u72b6\u6001\u64cd\u4f5c\u3002", "categories": ["cs.HC", "cs.CL"], "github_repo": "https://github.com/microsoft/Hybrid-Computer-Use", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2610.41432", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["HCU\u7edf\u4e00\u7a0b\u5e8f\u5316\u3001AX\u8bed\u4e49\u548cGUI\u89c6\u89c9\u4e09\u901a\u9053", "AX\u5de5\u5177\u652f\u6301\u7cbe\u7b80\u89c2\u5bdf\u3001\u6279\u91cf\u52a8\u4f5c\u4e0eAX diffs", "OSWorld 2.0\u4e24\u9879\u8bc4\u5206\u5747\u5c45\u5bf9\u6bd4\u7cfb\u7edf\u9996\u4f4d"], "keywords": ["\u667a\u80fd\u4f53", "\u4eba\u673a\u4ea4\u4e92", "\u56fe\u5f62\u754c\u9762", "\u65e0\u969c\u788d\u6280\u672f"], "num_comments": 2, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2610.41432v1", "published_at": "2026-10-30", "score": 0.684, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41432.png", "title": "Hybrid Computer Use: A Unified Programmatic, Semantic, and Visual Interface for General Agents", "tldr": "\u7edf\u4e00\u4ee3\u7801\u3001\u8bed\u4e49\u4e0e\u89c6\u89c9\u64cd\u4f5c\u901a\u9053\uff0c\u8ba9\u667a\u80fd\u4f53\u66f4\u9ad8\u6548\u53ef\u9760\u5730\u5b8c\u6210\u7535\u8111\u4efb\u52a1\u3002", "upvotes": 10, "what_it_is": "\u63d0\u51fa\u7edf\u4e00\u7535\u8111\u64cd\u4f5c\u63a5\u53e3HCU\uff0c\u8ba9\u667a\u80fd\u4f53\u6309\u4efb\u52a1\u7ec4\u5408\u4ee3\u7801\u4e0e\u547d\u4ee4\u884c\u3001\u65e0\u969c\u788d\u8bed\u4e49\u548c\u56fe\u5f62\u754c\u9762\u3002\u901a\u8fc7\u7cbe\u7b80\u89c2\u5bdf\u3001\u6279\u91cf\u64cd\u4f5c\u4e0e\u72b6\u6001\u5dee\u5206\u51cf\u5c11\u4ea4\u4e92\uff0c\u5e76\u9632\u6b62\u901a\u9053\u5207\u6362\u540e\u7684\u8fc7\u671f\u72b6\u6001\u64cd\u4f5c\u3002", "why_notable": "\u5c06\u7535\u8111\u64cd\u4f5c\u4ece\u6a21\u62df\u9f20\u6807\u952e\u76d8\u6269\u5c55\u4e3a\u7075\u6d3b\u7684\u591a\u901a\u9053\u534f\u4f5c\uff1b\u6240\u6709\u53d7\u6d4b\u6a21\u578b\u5747\u83b7\u63d0\u5347\uff0c\u8bf4\u660e\u63a5\u53e3\u8bbe\u8ba1\u672c\u8eab\u80fd\u540c\u65f6\u6539\u5584\u4efb\u52a1\u6210\u529f\u7387\u4e0e\u6548\u7387\u3002"}, {"abstract": "Group Relative Policy Optimization (GRPO) has advanced generative model post-training in verifiable domains such as code and mathematics, but evaluating video quality, especially emotional expression, often depends on subjective aesthetics and has no uniquely correct target. Existing approaches typically rely on fixed rewards for visual quality, motion quality, and text alignment that poorly capture emotional intent and can invite reward hacking, while RLHF is difficult to scale and subject to individual aesthetic differences that complicate the calibration of facial, body motion, and chromatic cues across narrative contexts. We introduce EmoReward, a new self-evolving training mechanism that distills evidence reliability from reward traces collected during an actual training run to adaptively guide multi-reward weight allocation in subsequent training by determining which emotional evidence to trust and how much to weight it. EmoReward first plans specific grounding cues from the emotional prompt to guide evaluation, then uses heterogeneous signal primitives to score the generated video during the act stage. Reflective Reward Gating calibrates their contributions through instance-level gates for phase, face confidence, conflict, and subtlety, then renormalizes weights over the active set to produce the sample\u0027s fused reward. RewardMemory then estimates each primitive\u0027s reliability from rollout scores and outcomes within each emotional regime in the finished training run, then fixes bounded multipliers that calibrate fusion weights in the next training run without updating reward models. Experiments on HunyuanVideo 1.5 show improvements across multiple RL algorithms and compare EmoReward with other agentic reward methods under SAGE-GRPO. Ablations and transfer experiments on SD 3.5 and FLUX further support adaptive reward calibration for visual generation.", "arxiv_id": "2611.06518", "arxiv_url": "https://arxiv.org/abs/2611.06518", "authors": ["Mingzhe Zheng", "Yue Wu", "Jing Tan", "Chang Zou", "Dengyang Jiang", "Zeyue Tian", "Xuanhua He", "Ryan Xu", "Yunyang Ge", "Sihui Ji", "Yunlong Lin", "Kaihang Pan", "Hongru Yan", "Sixiang Chen", "Dianyi Wang", "Julian Zhang", "Weijie Kong", "Changlin Li", "Lanqing Guo", "Zhao Zhong", "Qifeng Chen", "Harry Yang"], "brief": "EmoReward\u5148\u4ece\u60c5\u7eea\u63d0\u793a\u89c4\u5212\u8bc4\u4f30\u7ebf\u7d22\uff0c\u518d\u878d\u5408\u591a\u7c7b\u89c6\u89c9\u4fe1\u53f7\u3002\u5b83\u4ee5\u6837\u672c\u7ea7\u95e8\u63a7\u8c03\u6574\u5956\u52b1\uff0c\u5e76\u4ece\u5df2\u5b8c\u6210\u8bad\u7ec3\u7684\u8f68\u8ff9\u4f30\u8ba1\u4fe1\u53f7\u53ef\u9760\u6027\uff0c\u6821\u51c6\u4e0b\u4e00\u8f6e\u8bad\u7ec3\u6743\u91cd\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Tencent-Hunyuan/EmoReward", "github_stars": 27, "hf_url": "https://huggingface.co/papers/2611.06518", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["Reflective Reward Gating\u6309\u9636\u6bb5\u3001\u7f6e\u4fe1\u5ea6\u7b49\u95e8\u63a7", "RewardMemory\u8de8\u8bad\u7ec3\u8f6e\u6821\u51c6\u6743\u91cd\uff0c\u4e0d\u66f4\u65b0\u5956\u52b1\u6a21\u578b", "\u5728HunyuanVideo 1.5\u9a8c\u8bc1\uff0c\u8fc1\u79fb\u81f3SD 3.5\u548cFLUX"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u6821\u51c6", "\u60c5\u7eea\u8868\u8fbe"], "num_comments": 1, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2611.06518v1", "published_at": "2026-11-04", "score": 0.665, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06518.png", "title": "EmoReward: Self-Evolving Reward Calibration for Emotional Video Generation RL", "tldr": "\u901a\u8fc7\u8bad\u7ec3\u8f68\u8ff9\u81ea\u6821\u51c6\u60c5\u7eea\u5956\u52b1\u6743\u91cd\uff0c\u8ba9\u89c6\u9891\u751f\u6210\u5f3a\u5316\u5b66\u4e60\u66f4\u8d34\u5408\u60c5\u611f\u610f\u56fe\u3002", "upvotes": 22, "what_it_is": "EmoReward\u5148\u4ece\u60c5\u7eea\u63d0\u793a\u89c4\u5212\u8bc4\u4f30\u7ebf\u7d22\uff0c\u518d\u878d\u5408\u591a\u7c7b\u89c6\u89c9\u4fe1\u53f7\u3002\u5b83\u4ee5\u6837\u672c\u7ea7\u95e8\u63a7\u8c03\u6574\u5956\u52b1\uff0c\u5e76\u4ece\u5df2\u5b8c\u6210\u8bad\u7ec3\u7684\u8f68\u8ff9\u4f30\u8ba1\u4fe1\u53f7\u53ef\u9760\u6027\uff0c\u6821\u51c6\u4e0b\u4e00\u8f6e\u8bad\u7ec3\u6743\u91cd\u3002", "why_notable": "\u5c06\u60c5\u7eea\u8bc4\u4f30\u4ece\u56fa\u5b9a\u5956\u52b1\u878d\u5408\u8f6c\u5411\u57fa\u4e8e\u8bad\u7ec3\u8bc1\u636e\u7684\u53ef\u9760\u6027\u6821\u51c6\uff0c\u4e3a\u4e3b\u89c2\u89c6\u89c9\u76ee\u6807\u63d0\u4f9b\u66f4\u7075\u6d3b\u7684\u5f3a\u5316\u5b66\u4e60\u53cd\u9988\u673a\u5236\u3002"}, {"abstract": "Teleoperation remains the default way to collect robot demonstrations, but every episode costs robot and operator time, and every new task starts from scratch. We ask whether a coding agent can take over the teleoperator\u0027s job. In our DataFarm, the agent receives a data request and one calibration episode of the robot in the target scene and rebuilds the task in simulation: it writes the scene, an expert controller, and a success judge. The simulator supplies exact actions, and a video model conditioned on real images renders each rollout as photographic video, generating all camera views together consistently. The output is real-ready data: synchronized camera views labelled with the robot\u0027s actions, on which a policy can be trained directly and deployed on the real robot. Independent judges certify the expert and every rendered episode before admission. On five real-robot tasks, policies trained only on farm data match policies trained on as many teleoperated episodes (93 vs. 84 successes in 100 trials), and under an unseen tablecloth and coloured light they keep 87 successes where the teleoperation-trained policies fall to 46. Adapting a task is fully automatic and costs \\$21 of API usage on average, paid once per task, plus \\$5 for a render contract; every further episode costs \\$0.80 on average for simulation, rendering, and review, with no robot or operator. One hour of three-view data for a task costs \\$107 on average, these costs included, slightly below a quote of \\$117 for teleoperation in China and below \\$290 in labour alone in North America.", "arxiv_id": "2611.05320", "arxiv_url": "https://arxiv.org/abs/2611.05320", "authors": ["Kewei Zhang", "Juncheng Ma", "Guodong Lv", "Duomin Wang", "Feixiang Ruan", "Ruiyang Si", "Chuanrui Zhang", "Yuxuan Chen", "Hao Chen", "Yichen Liu", "Yintianrun Zhang", "Yufan Deng", "Enze Xie", "Daquan Zhou"], "brief": "\u667a\u80fd\u4f53\u4f9d\u636e\u6570\u636e\u8bf7\u6c42\u548c\u4e00\u6b21\u5b9e\u673a\u6821\u51c6\uff0c\u5728\u4eff\u771f\u4e2d\u7f16\u5199\u573a\u666f\u3001\u4e13\u5bb6\u63a7\u5236\u5668\u4e0e\u6210\u529f\u5224\u636e\uff0c\u518d\u7528\u771f\u5b9e\u56fe\u50cf\u6761\u4ef6\u89c6\u9891\u6a21\u578b\u751f\u6210\u540c\u6b65\u591a\u89c6\u89d2\u793a\u8303\uff0c\u7ecf\u72ec\u7acb\u8bc4\u5ba1\u540e\u7528\u4e8e\u7b56\u7565\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05320", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4eff\u771f\u63d0\u4f9b\u7cbe\u786e\u52a8\u4f5c\uff0c\u89c6\u9891\u6a21\u578b\u8054\u5408\u751f\u6210\u4e00\u81f4\u591a\u89c6\u89d2\u753b\u9762", "\u4e94\u9879\u5b9e\u673a\u4efb\u52a1\uff1a\u5408\u6210\u4e0e\u9065\u64cd\u4f5c\u6570\u636e\u8bad\u7ec3\u6210\u529f\u6570\u4e3a93\u6bd484", "\u65b0\u684c\u5e03\u4e0e\u5f69\u5149\u4e0b\u6210\u529f\u657087\u6bd446\uff1b\u6bcf\u6761\u65b0\u589e\u793a\u8303\u7ea60.80\u7f8e\u5143"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u5408\u6210\u6570\u636e", "\u4eff\u771f\u5230\u73b0\u5b9e"], "num_comments": 3, "on_hf": true, "organization": "DAGroup-PKU", "pdf_url": "https://arxiv.org/pdf/2611.05320v1", "published_at": "2026-11-03", "score": 0.654, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05320.png", "title": "PyRUA-DataFarm: LLM Agent as a Cost-Efficient Teleoperator for Real-Ready Robot Data", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u63a5\u7ba1\u793a\u8303\u91c7\u96c6\u6d41\u7a0b\uff0c\u4ee5\u4f4e\u6210\u672c\u5408\u6210\u6570\u636e\u8bad\u7ec3\u53ef\u76f4\u63a5\u90e8\u7f72\u7684\u673a\u5668\u4eba\u7b56\u7565\u3002", "upvotes": 23, "what_it_is": "\u667a\u80fd\u4f53\u4f9d\u636e\u6570\u636e\u8bf7\u6c42\u548c\u4e00\u6b21\u5b9e\u673a\u6821\u51c6\uff0c\u5728\u4eff\u771f\u4e2d\u7f16\u5199\u573a\u666f\u3001\u4e13\u5bb6\u63a7\u5236\u5668\u4e0e\u6210\u529f\u5224\u636e\uff0c\u518d\u7528\u771f\u5b9e\u56fe\u50cf\u6761\u4ef6\u89c6\u9891\u6a21\u578b\u751f\u6210\u540c\u6b65\u591a\u89c6\u89d2\u793a\u8303\uff0c\u7ecf\u72ec\u7acb\u8bc4\u5ba1\u540e\u7528\u4e8e\u7b56\u7565\u8bad\u7ec3\u3002", "why_notable": "\u5c06\u4efb\u52a1\u9002\u914d\u4e0e\u793a\u8303\u6269\u589e\u81ea\u52a8\u5316\uff0c\u51cf\u5c11\u5bf9\u5b9e\u673a\u548c\u4eba\u5de5\u7684\u4f9d\u8d56\uff1b\u5b9e\u673a\u7ed3\u679c\u663e\u793a\uff0c\u5408\u6210\u6570\u636e\u4e0d\u4ec5\u53ef\u7528\uff0c\u8fd8\u53ef\u80fd\u63d0\u5347\u89c6\u89c9\u53d8\u5316\u4e0b\u7684\u9c81\u68d2\u6027\u3002"}, {"abstract": "While multi-turn agentic reinforcement learning (RL) excels on long-horizon tasks, its performance gains remain highly sensitive to interaction constraints. Evaluating across sampling breadth $K$ and interaction depth $T$ via $Pass@(K,T)$, we show that trajectory-level RL advantages depend on sufficient turn budgets, diminishing significantly when budgets tighten. Besides, agentic RL does not uniformly elevate single-step decision quality; rather, its strength concentrates in error recovery and long-horizon resilience. To mitigate the deployment risks caused by this budget dependence, we provide a preliminary discussion on the benefits and limitations of process supervision signals and introduce BudgetMix RL as an alternative that varies interaction budgets during training. Experiments demonstrate that BudgetMix RL achieves robust performance across diverse execution settings. Project Page: https://rethinking-agentic-rl.github.io/", "arxiv_id": "2611.06483", "arxiv_url": "https://arxiv.org/abs/2611.06483", "authors": ["Kejian Zhu", "Zhuoran Jin", "Shangqing Tu", "Tianyi Men", "Yupu Hao", "Jiachun Li", "Kang Liu", "Jun Zhao"], "brief": "\u7814\u7a76\u7528\u91c7\u6837\u5e7f\u5ea6\u4e0e\u4ea4\u4e92\u6df1\u5ea6\u8054\u5408\u8bc4\u4f30\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\uff0c\u533a\u5206\u5355\u6b65\u51b3\u7b56\u4e0e\u957f\u7a0b\u7ea0\u9519\u6536\u76ca\uff0c\u5e76\u63d0\u51fa\u8bad\u7ec3\u65f6\u53d8\u5316\u4ea4\u4e92\u9884\u7b97\u7684BudgetMix RL\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/GaryStack/Rethinking-Agent-RL", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2611.06483", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["Pass@(K,T)\u8054\u5408\u8861\u91cf\u91c7\u6837\u5e7f\u5ea6\u4e0e\u4ea4\u4e92\u6df1\u5ea6", "\u8f68\u8ff9\u7ea7RL\u6536\u76ca\u968f\u8f6e\u6b21\u9884\u7b97\u6536\u7d27\u663e\u8457\u51cf\u5f31", "BudgetMix RL\u6df7\u5408\u4ea4\u4e92\u9884\u7b97\uff0c\u589e\u5f3a\u8de8\u8bbe\u7f6e\u7a33\u5065\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u7ea0\u9519\u80fd\u529b", "\u4ea4\u4e92\u9884\u7b97"], "num_comments": 2, "on_hf": true, "organization": "Chinese Academic of Science Institute of Automation", "pdf_url": "https://arxiv.org/pdf/2611.06483v1", "published_at": "2026-11-04", "score": 0.524, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (34\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06483.png", "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "tldr": "\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\u4e3b\u8981\u589e\u5f3a\u667a\u80fd\u4f53\u7ea0\u9519\u97e7\u6027\uff0c\u6df7\u5408\u8f6e\u6b21\u9884\u7b97\u8bad\u7ec3\u53ef\u7f13\u89e3\u90e8\u7f72\u6027\u80fd\u6ce2\u52a8\u3002", "upvotes": 34, "what_it_is": "\u7814\u7a76\u7528\u91c7\u6837\u5e7f\u5ea6\u4e0e\u4ea4\u4e92\u6df1\u5ea6\u8054\u5408\u8bc4\u4f30\u591a\u8f6e\u5f3a\u5316\u5b66\u4e60\uff0c\u533a\u5206\u5355\u6b65\u51b3\u7b56\u4e0e\u957f\u7a0b\u7ea0\u9519\u6536\u76ca\uff0c\u5e76\u63d0\u51fa\u8bad\u7ec3\u65f6\u53d8\u5316\u4ea4\u4e92\u9884\u7b97\u7684BudgetMix RL\u3002", "why_notable": "\u5c06\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u6536\u76ca\u4ece\u5355\u6b65\u80fd\u529b\u63d0\u5347\u8f6c\u5411\u957f\u7a0b\u7ea0\u9519\u89e3\u91ca\uff0c\u63ed\u793a\u90e8\u7f72\u9884\u7b97\u7684\u91cd\u8981\u6027\uff0c\u5e76\u7ed9\u51fa\u589e\u5f3a\u9884\u7b97\u9002\u5e94\u6027\u7684\u8bad\u7ec3\u65b9\u6848\u3002"}, {"abstract": "Multi-teacher on-policy distillation (MOPD) extends on-policy distillation (OPD) to consolidate capabilities from multiple teachers. Although prior work reports near-perfect in-distribution (IND) distillation performance, we find that this can mask incomplete capability consolidation beyond the supervised distribution. A preliminary study on synthetic reasoning shows that OPD does not fully transfer teachers\u0027 generalization capabilities. We then extend this investigation to real-world tasks, evaluating extrapolative and compositional generalization across mathematical reasoning, coding, agent, and long-context capabilities using Qwen3 models. Across extrapolative settings, OPD and MOPD reach 96.04-102.73% of their teachers\u0027 IND scores. Yet their out-of-distribution (OOD) scores remain 2.45-16.25% below the base model\u0027s. Across three compositional settings, MOPD improves IND performance over the base model, but its performance on composed tasks as OOD remains 18.19-24.34% below that of the best teachers. To understand these gaps, we examine teacher capability and data coverage as two potential bottlenecks. Jointly alleviating these bottlenecks eliminates OOD forgetting in our experiments and suggests the potential for generalization beyond the teacher. (M)OPD also reduces OOD forgetting on average relative to its reinforcement learning (RL) baselines. Analysis of the associated update geometry reveals smaller and more spectrally concentrated updates on average than those of the RL baselines, along with greater shared update structure under MOPD. Motivated by these findings, we propose geometry-based patching and base-preserving replay to improve OOD performance while largely preserving IND performance. Our findings identify a blind spot in capability consolidation via (M)OPD, highlighting the need for algorithms that explicitly support OOD retention and generalization.", "arxiv_id": "2611.05609", "arxiv_url": "https://arxiv.org/abs/2611.05609", "authors": ["Yichen Wang", "Yufa Zhou", "Siqi Zhu", "Haozheng Luo", "Jingzhi Bao", "Zhichao Liu", "Zijun Wei"], "brief": "\u7814\u7a76\u7528Qwen3\u68c0\u9a8c\u5355\u6559\u5e08\u4e0e\u591a\u6559\u5e08\u7b56\u7565\u5185\u84b8\u998f\u5728\u5f3a\u5316\u5b66\u4e60\u540e\u80fd\u529b\u6574\u5408\u4e2d\u7684\u6cdb\u5316\u5c40\u9650\u3002\u901a\u8fc7\u5916\u63a8\u548c\u7ec4\u5408\u4efb\u52a1\u8bc4\u6d4b\u3001\u66f4\u65b0\u51e0\u4f55\u5206\u6790\uff0c\u5e76\u63d0\u51fa\u51e0\u4f55\u4fee\u8865\u4e0e\u57fa\u5ea7\u4fdd\u7559\u56de\u653e\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05609", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["OPD/MOPD\u5916\u63a8OOD\u5f97\u5206\u4f4e\u4e8e\u57fa\u5ea72.45\u201316.25%", "MOPD\u7ec4\u5408OOD\u5f97\u5206\u4f4e\u4e8e\u6700\u4f73\u6559\u5e0818.19\u201324.34%", "\u8054\u5408\u6539\u5584\u6559\u5e08\u80fd\u529b\u4e0e\u6570\u636e\u8986\u76d6\uff0c\u5728\u5b9e\u9a8c\u4e2d\u6d88\u9664OOD\u9057\u5fd8"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5206\u5e03\u5916\u6cdb\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u707e\u96be\u6027\u9057\u5fd8"], "num_comments": 2, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2611.05609v1", "published_at": "2026-11-03", "score": 0.493, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05609.png", "title": "On the Generalization Limitation of On-Policy Distillation for Post-RL Consolidation", "tldr": "\u7b56\u7565\u5185\u84b8\u998f\u867d\u80fd\u63a5\u8fd1\u6559\u5e08\u7684\u5206\u5e03\u5185\u8868\u73b0\uff0c\u5374\u53ef\u80fd\u9057\u5fd8\u5206\u5e03\u5916\u80fd\u529b\u5e76\u4e22\u5931\u7ec4\u5408\u6cdb\u5316\u3002", "upvotes": 16, "what_it_is": "\u7814\u7a76\u7528Qwen3\u68c0\u9a8c\u5355\u6559\u5e08\u4e0e\u591a\u6559\u5e08\u7b56\u7565\u5185\u84b8\u998f\u5728\u5f3a\u5316\u5b66\u4e60\u540e\u80fd\u529b\u6574\u5408\u4e2d\u7684\u6cdb\u5316\u5c40\u9650\u3002\u901a\u8fc7\u5916\u63a8\u548c\u7ec4\u5408\u4efb\u52a1\u8bc4\u6d4b\u3001\u66f4\u65b0\u51e0\u4f55\u5206\u6790\uff0c\u5e76\u63d0\u51fa\u51e0\u4f55\u4fee\u8865\u4e0e\u57fa\u5ea7\u4fdd\u7559\u56de\u653e\u3002", "why_notable": "\u63ed\u793a\u5206\u5e03\u5185\u84b8\u998f\u6210\u529f\u4e0d\u7b49\u4e8e\u80fd\u529b\u5b8c\u6574\u8fc1\u79fb\uff0c\u5e76\u5c06\u6cdb\u5316\u7f3a\u53e3\u5173\u8054\u5230\u6559\u5e08\u80fd\u529b\u3001\u6570\u636e\u8986\u76d6\u4e0e\u66f4\u65b0\u7ed3\u6784\uff0c\u4e3a\u4fdd\u7559\u57fa\u5ea7\u80fd\u529b\u63d0\u4f9b\u6539\u8fdb\u65b9\u5411\u3002"}, {"abstract": "LLM-based agentic systems are increasingly combined with CoT reasoning to solve tasks that require accurate reasoning, external knowledge, and multi-step deliberation. Yet, explicit CoT incurs substantial generation overhead, while implicit CoT, which replaces textual rationales with compact continuous tokens, does not naturally support the explicit communication interface required for agentic tool-use. We propose TAC-CoT, a tool-empowered adaptive implicit CoT framework that replaces explicit reasoning traces with compact latent reasoning segments while retaining textual tokens only for tool calls, observations, and final answers. This interleaved design enables agentic tool-use without verbalizing every intermediate reasoning step. Experiments on agentic math and QA benchmarks show that TAC-CoT improves accuracy by up to 8.8 points while reducing model forward passes by up to 6.8x. Furthermore, analyses show that TAC-CoT improves tool-use quality in both single- and multi-tool settings.", "arxiv_id": "2611.01926", "arxiv_url": "https://arxiv.org/abs/2611.01926", "authors": ["Juseon Do", "Sangmin Bae", "Jeesu Jung", "Hwanjun Song"], "brief": "TAC-CoT\u7528\u7d27\u51d1\u6f5c\u5728\u7247\u6bb5\u66ff\u4ee3\u663e\u5f0f\u63a8\u7406\u8fc7\u7a0b\uff0c\u4ec5\u4e3a\u5de5\u5177\u8c03\u7528\u3001\u89c2\u6d4b\u548c\u6700\u7ec8\u7b54\u6848\u4fdd\u7559\u6587\u672c\u4ee4\u724c\uff0c\u901a\u8fc7\u4ea4\u9519\u8bbe\u8ba1\u652f\u6301\u9690\u5f0f\u63a8\u7406\u4e2d\u7684\u5de5\u5177\u4ea4\u4e92\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01926", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["TAC-CoT\u4ea4\u9519\u6f5c\u5728\u63a8\u7406\u7247\u6bb5\u4e0e\u663e\u5f0f\u4ea4\u4e92\u4ee4\u724c", "\u6570\u5b66\u4e0e\u95ee\u7b54\u57fa\u51c6\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u53478.8\u4e2a\u767e\u5206\u70b9", "\u6a21\u578b\u524d\u5411\u8ba1\u7b97\u6b21\u6570\u6700\u591a\u51cf\u5c11\u81f3\u7ea61/6.8"], "keywords": ["\u9690\u5f0f\u63a8\u7406", "\u5de5\u5177\u8c03\u7528", "\u667a\u80fd\u4f53", "\u63a8\u7406\u6548\u7387"], "num_comments": 2, "on_hf": true, "organization": "Data Intelligence System Lab", "pdf_url": "https://arxiv.org/pdf/2611.01926v1", "published_at": "2026-11-01", "score": 0.428, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01926.png", "title": "TAC-CoT: Tool-Empowered Implicit Chain-of-Thought via Interleaving Explicit Tokens", "tldr": "\u4ee5\u6f5c\u5728\u63a8\u7406\u7247\u6bb5\u4ea4\u9519\u5de5\u5177\u4ea4\u4e92\u6587\u672c\uff0c\u517c\u987e\u667a\u80fd\u4f53\u63a8\u7406\u7cbe\u5ea6\u4e0e\u751f\u6210\u6548\u7387\u3002", "upvotes": 14, "what_it_is": "TAC-CoT\u7528\u7d27\u51d1\u6f5c\u5728\u7247\u6bb5\u66ff\u4ee3\u663e\u5f0f\u63a8\u7406\u8fc7\u7a0b\uff0c\u4ec5\u4e3a\u5de5\u5177\u8c03\u7528\u3001\u89c2\u6d4b\u548c\u6700\u7ec8\u7b54\u6848\u4fdd\u7559\u6587\u672c\u4ee4\u724c\uff0c\u901a\u8fc7\u4ea4\u9519\u8bbe\u8ba1\u652f\u6301\u9690\u5f0f\u63a8\u7406\u4e2d\u7684\u5de5\u5177\u4ea4\u4e92\u3002", "why_notable": "\u5c06\u9690\u5f0f\u63a8\u7406\u7684\u8ba1\u7b97\u8282\u7701\u4e0e\u5de5\u5177\u63a5\u53e3\u7684\u663e\u5f0f\u901a\u4fe1\u7ed3\u5408\uff0c\u5728\u63d0\u5347\u51c6\u786e\u7387\u7684\u540c\u65f6\u51cf\u5c11\u8ba1\u7b97\uff0c\u5e76\u6539\u5584\u5355\u5de5\u5177\u548c\u591a\u5de5\u5177\u573a\u666f\u7684\u4f7f\u7528\u8d28\u91cf\u3002"}, {"abstract": "We present a shared framework that adapts Cosmos world foundation models for real-time interactive world simulation in Physical AI. By streaming visual observations in response to actions and scene controls, the framework enables users and embodied agents to interact with evolving virtual environments. It supports both predicting the visual consequences of actions and generating observations from physical state maintained by an external simulator. We demonstrate this approach across camera navigation and robot manipulation, controllable video transfer, and multi-view autonomous vehicle (AV) simulation. These examples provide a shared foundation for developing interactive virtual environments for Physical AI training and evaluation. Our code and model checkpoints are available at https://github.com/nvidia/cosmos and https://huggingface.co/collections/nvidia/cosmos3-examples. The project website is available at https://research.nvidia.com/labs/cosmos-lab/cosmos-simulation.", "arxiv_id": "2611.06627", "arxiv_url": "https://arxiv.org/abs/2611.06627", "authors": ["NVIDIA", ":", "Anis Ahmad", "Jon Allen", "Malik Aqeel Anwar", "Jesse Archer", "Maciej Bala", "Piotr Barejko", "Aarti Basant", "Dan Blick", "Taras Bolzhelarskyi", "Henry Che", "Jin Chen", "Yukang Chen", "Tae Eun Choe", "Yuzhu Dong", "Nat Duca", "Liang Feng", "Francesco Ferroni", "Xiao Fu", "Mohit Gambhir", "Vivek Goel", "Rony Goldenthal", "Aryaman Gupta", "Ali Hassani", "Nathan Hayes-Roth", "Yong He", "Michael Honke", "Shengyu Huang", "Wei Huang", "DeLesley Hutchins", "Suneel Indupuru", "Pooya Jannaty", "Jingyi Jin", "Janmesh Kalra", "Ashna Khetan", "Xin Kong", "Aleksandr Korovko", "Hui Kuang", "Zhengfei Kuang", "George Kurian", "Jean-Francois Lafleche", "Jayjun Lee", "Justin Leung", "William Lew", "Xiang Li", "Zhaoshuo Li", "Chen-Hsuan Lin", "Ming-Yu Liu", "Xiangyu Lu", "Yuhang Lu", "Martin Ding Ma", "Qianli Ma", "Aditya Mahajan", "Miguel Martin", "Janarbek Matai", "Jonathan McCaffrey", "Qing Miao", "Ashkan Mirzaei", "Mustafa Munir", "Sangmin Oh", "David Pankratz", "Trung Pham", "Marilyn Reeb", "Gavriel State", "Jiaxiang Tang", "Shitao Tang", "Yue Tang", "Tolou Tavakkoli", "Alexander Temirov", "Hweimi Tsou", "Sergei Vasilev", "Thomas Volk", "Andrew Z. Wang", "Hao Wang", "Shijie Wang", "Zhonghao Wang", "David Wehr", "Shumian Xin", "Mengyao Xu", "Yao Xu", "Shuai Yang", "Sophia Zalewski", "Pengcuo Zeren", "Cindy Zha", "Jing Zhang", "Yuliya Zhautouskaya", "Kaiwen Zheng", "Andrew Zhu", "Rick Zhuang"], "brief": "\u6846\u67b6\u6539\u9020 Cosmos \u4e16\u754c\u57fa\u7840\u6a21\u578b\uff0c\u6839\u636e\u52a8\u4f5c\u548c\u573a\u666f\u63a7\u5236\u6d41\u5f0f\u751f\u6210\u89c6\u89c9\u89c2\u6d4b\u3002\u65e2\u80fd\u9884\u6d4b\u52a8\u4f5c\u540e\u679c\uff0c\u4e5f\u80fd\u5c06\u5916\u90e8\u7269\u7406\u4eff\u771f\u5668\u7ef4\u62a4\u7684\u72b6\u6001\u8f6c\u5316\u4e3a\u753b\u9762\u3002", "categories": ["cs.AI", "cs.CV", "cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06627", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Cosmos \u652f\u6301\u52a8\u4f5c\u4e0e\u573a\u666f\u63a7\u5236\u9a71\u52a8\u7684\u6d41\u5f0f\u89c2\u6d4b", "\u652f\u6301\u52a8\u4f5c\u540e\u679c\u9884\u6d4b\u548c\u5916\u90e8\u7269\u7406\u72b6\u6001\u6761\u4ef6\u751f\u6210", "\u6f14\u793a\u673a\u5668\u4eba\u64cd\u4f5c\u3001\u89c6\u9891\u8fc1\u79fb\u53ca\u591a\u89c6\u89d2\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u4ea4\u4e92\u4eff\u771f", "\u89c6\u9891\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06627v1", "published_at": "2026-11-04", "score": 0.425, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Interactive World Simulation with Cosmos for Physical AI", "tldr": "\u5c06\u4e16\u754c\u6a21\u578b\u63a5\u5165\u52a8\u4f5c\u4e0e\u573a\u666f\u63a7\u5236\uff0c\u4e3a\u5177\u8eab\u667a\u80fd\u63d0\u4f9b\u5b9e\u65f6\u4ea4\u4e92\u5f0f\u89c6\u89c9\u4eff\u771f\u3002", "upvotes": 0, "what_it_is": "\u6846\u67b6\u6539\u9020 Cosmos \u4e16\u754c\u57fa\u7840\u6a21\u578b\uff0c\u6839\u636e\u52a8\u4f5c\u548c\u573a\u666f\u63a7\u5236\u6d41\u5f0f\u751f\u6210\u89c6\u89c9\u89c2\u6d4b\u3002\u65e2\u80fd\u9884\u6d4b\u52a8\u4f5c\u540e\u679c\uff0c\u4e5f\u80fd\u5c06\u5916\u90e8\u7269\u7406\u4eff\u771f\u5668\u7ef4\u62a4\u7684\u72b6\u6001\u8f6c\u5316\u4e3a\u753b\u9762\u3002", "why_notable": "\u5c06\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u4e0e\u7269\u7406\u4eff\u771f\u8fde\u63a5\uff0c\u4e3a\u5177\u8eab\u667a\u80fd\u8bad\u7ec3\u548c\u8bc4\u4f30\u63d0\u4f9b\u7edf\u4e00\u4ea4\u4e92\u73af\u5883\uff1b\u4ee3\u7801\u4e0e\u6a21\u578b\u6743\u91cd\u5f00\u653e\uff0c\u4fbf\u4e8e\u590d\u7528\u3002"}, {"abstract": "Omni models answer questions about videos by jointly processing sampled frames and audio in one turn, with progress driven largely by scaling model size and omni training data. We ask whether a model needs to hear the audio directly at all, and present SleuthVLM, an agent harness built on a VLM that never hears the audio directly: speech will be transcribed into text, and the VLM will sleuth the video on its own without any predefined workflow. On four omni benchmarks with videos up to 90 minutes, SleuthVLM achieves the best average accuracy: \\textbf{75.0%}, 2.6 points above Gemini 3.8 Flash, and it also tops the Video-MME-v2 leaderboard with \\textbf{77.8%}; with an open-source 27B VLM, it beats all open-source omni models. We draw three findings: SleuthVLM beats a model that glances; hearing is not the bottleneck, agentic ability is; omni understanding needs better agentic ability, not just more omni data for modality alignment. So we provide a simple but effective starting point for doing omni video understanding. Omni understanding needs better agents, not just bigger models that hear.", "arxiv_id": "2611.06083", "arxiv_url": "https://arxiv.org/abs/2611.06083", "authors": ["Peiran Wu", "Fangfei Gou", "Zhaoxi Mu", "Changhao Zhang", "Jian Liu", "Weiqiang Wang", "Yuntao Wang", "Yuanchun Shi", "Junxiao Shen"], "brief": "SleuthVLM\u4e3a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u914d\u5907\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u8bed\u97f3\u8f6c\u6210\u6587\u672c\u800c\u4e0d\u76f4\u63a5\u8f93\u5165\u97f3\u9891\u3002\u6a21\u578b\u65e0\u9700\u9884\u8bbe\u5de5\u4f5c\u6d41\uff0c\u81ea\u4e3b\u63a2\u7d22\u89c6\u9891\u5e76\u56de\u7b54\u8de8\u6a21\u6001\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06083", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u56db\u4e2a\u5168\u6a21\u6001\u57fa\u51c6\u5e73\u5747\u51c6\u786e\u738775.0%\uff0c\u8d85Gemini 3.8 Flash 2.6\u4e2a\u767e\u5206\u70b9", "Video-MME-v2\u51c6\u786e\u738777.8%\uff0c\u4f4d\u5c45\u699c\u9996", "\u91c7\u7528\u5f00\u6e9027B\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u8d85\u8fc7\u6240\u6709\u5f00\u6e90\u5168\u6a21\u6001\u6a21\u578b"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8de8\u6a21\u6001\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2611.06083v1", "published_at": "2026-11-04", "score": 0.401, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06083.png", "title": "SleuthVLM: Do We Really Need Audio-in-Video for Omni Video Understanding?", "tldr": "\u4ee5\u8bed\u97f3\u8f6c\u5199\u548c\u81ea\u4e3b\u89c6\u9891\u63a2\u7d22\u66ff\u4ee3\u76f4\u63a5\u542c\u97f3\u9891\uff0c\u667a\u80fd\u4f53\u53d6\u5f97\u66f4\u9ad8\u89c6\u9891\u95ee\u7b54\u51c6\u786e\u7387\u3002", "upvotes": 5, "what_it_is": "SleuthVLM\u4e3a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u914d\u5907\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u8bed\u97f3\u8f6c\u6210\u6587\u672c\u800c\u4e0d\u76f4\u63a5\u8f93\u5165\u97f3\u9891\u3002\u6a21\u578b\u65e0\u9700\u9884\u8bbe\u5de5\u4f5c\u6d41\uff0c\u81ea\u4e3b\u63a2\u7d22\u89c6\u9891\u5e76\u56de\u7b54\u8de8\u6a21\u6001\u95ee\u9898\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u76f4\u63a5\u5904\u7406\u97f3\u9891\u672a\u5fc5\u662f\u89c6\u9891\u7406\u89e3\u7684\u5173\u952e\uff1b\u589e\u5f3a\u81ea\u4e3b\u63a2\u7d22\u4e0e\u63a8\u7406\u80fd\u529b\uff0c\u53ef\u80fd\u6bd4\u5355\u7eaf\u6269\u5927\u6a21\u578b\u548c\u6a21\u6001\u5bf9\u9f50\u6570\u636e\u66f4\u6709\u6548\u3002"}, {"abstract": "Large language model (LLM) coding agents develop software through experimentation, offering an opportunity to design the serving systems supporting their own operation. Effective serving requires coordinating implementation and operating decisions under session dependencies, latency constraints, and correctness requirements. We introduce ServerBench, a benchmark for agentic design of complete, specialized LLM serving systems. Agents experiment against a common objective, dollars per dollar: latency-qualified token value per dollar of GPU cost. Stateful replay preserves session dependencies, and independent verification checks the submitted system. Across 11 coding-agent models and three deployments, Claude Sonnet 5.5 achieves 2.97 dollars per dollar on Gemma E4B, $4.87\\times$ the vLLM reference; 22 of 33 runs yield verified systems, and 13 exceed the strongest baseline. Our analysis identifies three findings: high-value designs coordinate capacity improvements with load selection; agents interpret performance feedback through workload-relevant experiments; and reliable delivery requires verification of the execution paths introduced by optimization. Overall, ServerBench supports systematic study of how agents translate service objectives and feedback into effective, verified serving systems for given task specifications.", "arxiv_id": "2611.06841", "arxiv_url": "https://arxiv.org/abs/2611.06841", "authors": ["Xinrui Zhong", "Zhiming Wang", "Yongqi Liu", "Zhaohui Wang", "Shanglin Yang", "Zikun Li", "Zhuoming Chen", "Beidi Chen"], "brief": "ServerBench\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u901a\u8fc7\u5b9e\u9a8c\u8bbe\u8ba1\u5b8c\u6574\u7684\u4e13\u7528\u6a21\u578b\u670d\u52a1\u7cfb\u7edf\uff0c\u4ee5\u6ee1\u8db3\u5ef6\u8fdf\u8981\u6c42\u7684\u4ee4\u724c\u4ef7\u503c\u4e0eGPU\u6210\u672c\u4e4b\u6bd4\u4e3a\u76ee\u6807\uff0c\u5e76\u7528\u6709\u72b6\u6001\u56de\u653e\u548c\u72ec\u7acb\u9a8c\u8bc1\u68c0\u67e5\u4ea4\u4ed8\u7ed3\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06841", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b11\u79cd\u7f16\u7801\u667a\u80fd\u4f53\u6a21\u578b\u30013\u79cd\u90e8\u7f72\uff0c\u517133\u6b21\u8fd0\u884c", "Sonnet 5.5\u5728Gemma E4B\u4e0a\u8fbe2.97\uff0c\u4e3avLLM\u76844.87\u500d", "33\u6b21\u8fd0\u884c\u4e2d22\u6b21\u901a\u8fc7\u72ec\u7acb\u9a8c\u8bc1\uff0c13\u6b21\u8d85\u8fc7\u6700\u5f3a\u57fa\u7ebf"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u6a21\u578b\u63a8\u7406\u670d\u52a1", "\u7cfb\u7edf\u4f18\u5316", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06841v1", "published_at": "2026-11-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ServerBench: How can your coding agents design specialized LLM serving systems?", "tldr": "\u7528\u7edf\u4e00\u6210\u672c\u6536\u76ca\u6307\u6807\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u68c0\u9a8c\u5176\u8bbe\u8ba1\u5e76\u4ea4\u4ed8\u4e13\u7528\u6a21\u578b\u670d\u52a1\u7cfb\u7edf\u7684\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "ServerBench\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u901a\u8fc7\u5b9e\u9a8c\u8bbe\u8ba1\u5b8c\u6574\u7684\u4e13\u7528\u6a21\u578b\u670d\u52a1\u7cfb\u7edf\uff0c\u4ee5\u6ee1\u8db3\u5ef6\u8fdf\u8981\u6c42\u7684\u4ee4\u724c\u4ef7\u503c\u4e0eGPU\u6210\u672c\u4e4b\u6bd4\u4e3a\u76ee\u6807\uff0c\u5e76\u7528\u6709\u72b6\u6001\u56de\u653e\u548c\u72ec\u7acb\u9a8c\u8bc1\u68c0\u67e5\u4ea4\u4ed8\u7ed3\u679c\u3002", "why_notable": "\u628a\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u4ee3\u7801\u751f\u6210\u63a8\u8fdb\u5230\u53ef\u9a8c\u8bc1\u7684\u7cfb\u7edf\u4ea4\u4ed8\uff0c\u5e76\u63ed\u793a\u670d\u52a1\u6536\u76ca\u63d0\u5347\u4f9d\u8d56\u5bb9\u91cf\u4f18\u5316\u4e0e\u8d1f\u8f7d\u9009\u62e9\u7684\u534f\u540c\uff0c\u800c\u975e\u5355\u9879\u6027\u80fd\u4f18\u5316\u3002"}, {"abstract": "Large language model (LLM) agents typically append raw tool outputs to their context. Over multi-step interactions, long and noisy observations incur substantial context overhead and dilute the agent\u0027s attention to task-relevant information. Existing token pruning and summarization methods remain constrained by discrete text representations, limiting the achievable compression ratios. In this work, we challenge the prevailing assumption that agents must consume tool observations as explicit text tokens. To this end, we propose Coca-Cola, a continuous latent context compression model for LLM agents. Coca-Cola compresses tool observations into latent tokens and embeds them into the input embedding space of the agent. We further introduce Action-Preserving Training, which aligns the agent\u0027s next-action distributions under full and compressed observations. This trains the compression model to learn action-sufficient latent tokens that retain decision-critical information. Experiments with web-search agents on four QA benchmarks and two model families show that Coca-Cola reduces the agent\u0027s token consumption by 70.01%-89.24% and end-to-end runtime by 24.45%-55.97%, while consistently improving task performance. These results suggest that Coca-Cola offers a promising approach for context compression in agents. Our code is available at https://github.com/THU-Agent/Coca-cola.", "arxiv_id": "2611.06500", "arxiv_url": "https://arxiv.org/abs/2611.06500", "authors": ["Yuetong Liu", "Zhehao Zhou", "Yitong Zhang", "Haorui Chen", "Jia Li"], "brief": "Coca-Cola\u5c06\u5de5\u5177\u89c2\u5bdf\u538b\u7f29\u4e3a\u8fde\u7eed\u6f5c\u5728\u4ee4\u724c\uff0c\u76f4\u63a5\u5d4c\u5165\u667a\u80fd\u4f53\u8f93\u5165\u7a7a\u95f4\uff1b\u901a\u8fc7\u52a8\u4f5c\u4fdd\u6301\u8bad\u7ec3\uff0c\u5bf9\u9f50\u5b8c\u6574\u4e0e\u538b\u7f29\u89c2\u5bdf\u4e0b\u7684\u4e0b\u4e00\u6b65\u52a8\u4f5c\u5206\u5e03\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06500", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Action-Preserving Training\u5bf9\u9f50\u4e0b\u4e00\u6b65\u52a8\u4f5c\u5206\u5e03", "\u7f51\u9875\u641c\u7d22\u5b9e\u9a8c\u8986\u76d64\u4e2a\u95ee\u7b54\u57fa\u51c6\u30012\u4e2a\u6a21\u578b\u5bb6\u65cf", "\u4ee4\u724c\u6d88\u8017\u964d\u4f4e70.01%\u201389.24%\uff0c\u4efb\u52a1\u8868\u73b0\u63d0\u5347"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u538b\u7f29", "\u6f5c\u5728\u8868\u793a", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06500v1", "published_at": "2026-11-04", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Tools Need Not Speak in Text: Latent Context Compression for Agents", "tldr": "\u5c06\u5de5\u5177\u8f93\u51fa\u538b\u7f29\u4e3a\u4fdd\u7559\u51b3\u7b56\u4fe1\u606f\u7684\u6f5c\u5728\u4ee4\u724c\uff0c\u8ba9\u667a\u80fd\u4f53\u66f4\u7701\u4e0a\u4e0b\u6587\u4e14\u8868\u73b0\u66f4\u597d\u3002", "upvotes": 0, "what_it_is": "Coca-Cola\u5c06\u5de5\u5177\u89c2\u5bdf\u538b\u7f29\u4e3a\u8fde\u7eed\u6f5c\u5728\u4ee4\u724c\uff0c\u76f4\u63a5\u5d4c\u5165\u667a\u80fd\u4f53\u8f93\u5165\u7a7a\u95f4\uff1b\u901a\u8fc7\u52a8\u4f5c\u4fdd\u6301\u8bad\u7ec3\uff0c\u5bf9\u9f50\u5b8c\u6574\u4e0e\u538b\u7f29\u89c2\u5bdf\u4e0b\u7684\u4e0b\u4e00\u6b65\u52a8\u4f5c\u5206\u5e03\u3002", "why_notable": "\u5b83\u7a81\u7834\u4e86\u6587\u672c\u526a\u679d\u4e0e\u6458\u8981\u7684\u79bb\u6563\u8868\u793a\u9650\u5236\uff0c\u6309\u51b3\u7b56\u9700\u6c42\u4fdd\u7559\u4fe1\u606f\uff1b\u7aef\u5230\u7aef\u8017\u65f6\u964d\u4f4e24.45%\u201355.97%\uff0c\u663e\u793a\u51fa\u5b9e\u9645\u6548\u7387\u6536\u76ca\u3002"}, {"abstract": "Streaming video understanding requires models to repeatedly decide whether to respond or continue observing. Recently, Group Relative Policy Optimization (GRPO) has been applied to this setting, with existing approaches emphasizing reward design while retaining a single trajectory-level advantage across turns. Such shared credit can reinforce redundant replies after earlier successes and discourage useful follow-ups after earlier failures. We propose TurnWise, a turn-level GRPO framework that aligns learning with individual streaming decisions. TurnWise addresses the mismatch between trajectory-level feedback and turn-level interaction, promoting informative responses and reducing redundancy. Specifically, turn-level credit assignment uses silence-completed prefix scoring to construct group-relative advantages from each decision\u0027s remaining return, separating its learning signal from earlier rewards. Turn-mean policy optimization averages token losses within each turn and then across turns, giving response and waiting decisions equal weight regardless of output length. These complementary designs improve streaming policy learning without a learned critic or additional rollouts. Extensive experiments show our method outperforms prior RL approaches for streaming video understanding.", "arxiv_id": "2611.06728", "arxiv_url": "https://arxiv.org/abs/2611.06728", "authors": ["Shuai Dong", "Kanghui Tian", "Linghan Chen", "Wenqi Shao", "Hongrui Wu", "Haowen Hou", "Yongfu Zhu", "Xuehui Wang", "Ziyue Wang", "Wenpu Liu", "Weichu Xie", "Yuqi Xu", "Congcong Wang", "Kaiwen Tuo", "Caoyuan Ma", "Taiqiang Wu", "Ji Zhao", "Wenzheng Chang", "Dianyi Wang", "Siyuan Wang", "Zhongyu Wei", "Yu Qiao", "Jiaqi Wang"], "brief": "TurnWise\u5c06GRPO\u7684\u5b66\u4e60\u4fe1\u53f7\u4ece\u6574\u6bb5\u8f68\u8ff9\u7ec6\u5316\u5230\u6bcf\u8f6e\u51b3\u7b56\uff0c\u901a\u8fc7\u9759\u9ed8\u8865\u5168\u524d\u7f00\u8bc4\u5206\u5206\u914d\u4fe1\u7528\uff0c\u5e76\u6309\u8f6e\u5e73\u5747\u7b56\u7565\u635f\u5931\uff0c\u51cf\u5c11\u5386\u53f2\u5956\u60e9\u548c\u8f93\u51fa\u957f\u5ea6\u7684\u5e72\u6270\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": "https://github.com/XD111ds/turn-wise-rl", "github_stars": 63, "hf_url": "https://huggingface.co/papers/2611.06728", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9759\u9ed8\u8865\u5168\u524d\u7f00\u8bc4\u5206\uff1a\u7528\u5269\u4f59\u56de\u62a5\u6784\u9020\u8f6e\u7ea7\u76f8\u5bf9\u4f18\u52bf", "\u8f6e\u5747\u7b56\u7565\u4f18\u5316\uff1a\u5148\u8f6e\u5185\u518d\u8f6e\u95f4\u5e73\u5747\u8bcd\u5143\u635f\u5931", "\u65e0\u9700\u5b66\u4e60\u578b\u4ef7\u503c\u8bc4\u4f30\u5668\u6216\u989d\u5916\u91c7\u6837\uff0c\u5b9e\u9a8c\u4f18\u4e8e\u65e2\u6709RL\u65b9\u6cd5"], "keywords": ["\u6d41\u5f0f\u89c6\u9891\u7406\u89e3", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06728v1", "published_at": "2026-11-04", "score": 0.331, "selected_reasons": ["HF trending (83\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06728.png", "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "tldr": "\u5c06\u6d41\u5f0f\u89c6\u9891\u5f3a\u5316\u5b66\u4e60\u7684\u4fe1\u7528\u5206\u914d\u7ec6\u5316\u5230\u8f6e\u6b21\uff0c\u6539\u5584\u56de\u5e94\u4e0e\u7b49\u5f85\u51b3\u7b56\u3002", "upvotes": 83, "what_it_is": "TurnWise\u5c06GRPO\u7684\u5b66\u4e60\u4fe1\u53f7\u4ece\u6574\u6bb5\u8f68\u8ff9\u7ec6\u5316\u5230\u6bcf\u8f6e\u51b3\u7b56\uff0c\u901a\u8fc7\u9759\u9ed8\u8865\u5168\u524d\u7f00\u8bc4\u5206\u5206\u914d\u4fe1\u7528\uff0c\u5e76\u6309\u8f6e\u5e73\u5747\u7b56\u7565\u635f\u5931\uff0c\u51cf\u5c11\u5386\u53f2\u5956\u60e9\u548c\u8f93\u51fa\u957f\u5ea6\u7684\u5e72\u6270\u3002", "why_notable": "\u5b83\u628a\u4f18\u5316\u91cd\u70b9\u4ece\u5956\u52b1\u8bbe\u8ba1\u8f6c\u5411\u4fe1\u7528\u5206\u914d\uff0c\u9488\u5bf9\u591a\u8f6e\u89c6\u9891\u4ea4\u4e92\u4e2d\u7684\u5197\u4f59\u56de\u5e94\u4e0e\u540e\u7eed\u51b3\u7b56\u53d7\u5386\u53f2\u5956\u60e9\u5e72\u6270\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u4f4e\u989d\u5916\u6210\u672c\u7684\u6539\u8fdb\u8def\u5f84\u3002"}, {"abstract": "We study zero-shot coordination (ZSC), where independently developed agents must coordinate at test time. While ZSC has been well studied in the RL literature, far less is known about the performance of LLM agents despite their increasing deployment in such settings. Existing work on LLM coordination often relies on specialised scaffolding that independently developed agents are unlikely to share in practice. Moreover, evaluations on complex environments (e.g., Hanabi) make it difficult to pinpoint the sources of coordination failure. In contrast, we focus on simple, general-purpose scaffolds in minimal environments designed to isolate specific coordination challenges. Our results show that even in these controlled settings, frontier LLM agents struggle to coordinate, largely due to limited understanding of the coordination problem and weak reasoning about their partner\u0027s beliefs. While LLMs introduce semantic information as an additional axis for coordination, they nonetheless fail to exploit this structure effectively. Towards this, we propose Coordination-friendly definitions (CFDs) as a principled approach for enabling robust coordination among LLM agents. Finally, we show that CFDs can be discovered automatically, removing the need for manual engineering. Code is available at https://github.com/ahayler/zsc-llm-agents.", "arxiv_id": "2611.06409", "arxiv_url": "https://arxiv.org/abs/2611.06409", "authors": ["Adrian Hayler", "Shashank Reddy Chirra", "Andrei Lupu", "Johannes Forkel", "Bidipta Sarkar", "Siheng Feng", "Jakob Foerster"], "brief": "\u7814\u7a76\u72ec\u7acb\u5f00\u53d1\u7684\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5982\u4f55\u5728\u6d4b\u8bd5\u65f6\u76f4\u63a5\u534f\u4f5c\uff0c\u7528\u901a\u7528\u6846\u67b6\u548c\u6781\u7b80\u73af\u5883\u9694\u79bb\u534f\u8c03\u96be\u70b9\uff0c\u5e76\u63d0\u51fa\u53ef\u81ea\u52a8\u53d1\u73b0\u7684\u534f\u8c03\u53cb\u597d\u5b9a\u4e49\uff08CFDs\uff09\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06409", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7528\u901a\u7528\u6846\u67b6\u4e0e\u6781\u7b80\u73af\u5883\u8bc4\u4f30\u96f6\u6837\u672c\u534f\u8c03", "\u524d\u6cbfLLM\u5bf9\u534f\u8c03\u95ee\u9898\u53ca\u4f19\u4f34\u4fe1\u5ff5\u63a8\u7406\u4e0d\u8db3", "\u63d0\u51faCFDs\u652f\u6301\u7a33\u5065\u534f\u8c03\uff0c\u5e76\u53ef\u81ea\u52a8\u53d1\u73b0"], "keywords": ["\u591a\u667a\u80fd\u4f53\u534f\u4f5c", "\u5927\u8bed\u8a00\u6a21\u578b", "\u96f6\u6837\u672c\u5b66\u4e60", "\u4fe1\u5ff5\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06409v1", "published_at": "2026-11-04", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Zero-Shot Coordination among LLM Agents", "tldr": "\u524d\u6cbf\u5927\u6a21\u578b\u667a\u80fd\u4f53\u4ecd\u96be\u4ee5\u96f6\u6837\u672c\u534f\u4f5c\uff0c\u534f\u8c03\u53cb\u597d\u5b9a\u4e49\u4e3a\u6539\u5584\u914d\u5408\u63d0\u4f9b\u65b0\u8def\u5f84\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u72ec\u7acb\u5f00\u53d1\u7684\u5927\u6a21\u578b\u667a\u80fd\u4f53\u5982\u4f55\u5728\u6d4b\u8bd5\u65f6\u76f4\u63a5\u534f\u4f5c\uff0c\u7528\u901a\u7528\u6846\u67b6\u548c\u6781\u7b80\u73af\u5883\u9694\u79bb\u534f\u8c03\u96be\u70b9\uff0c\u5e76\u63d0\u51fa\u53ef\u81ea\u52a8\u53d1\u73b0\u7684\u534f\u8c03\u53cb\u597d\u5b9a\u4e49\uff08CFDs\uff09\u3002", "why_notable": "\u5c06\u534f\u4f5c\u5931\u8d25\u5b9a\u4f4d\u5230\u95ee\u9898\u7406\u89e3\u4e0e\u4f19\u4f34\u4fe1\u5ff5\u63a8\u7406\uff0c\u800c\u975e\u590d\u6742\u73af\u5883\u5e72\u6270\uff1b\u4e3a\u72ec\u7acb\u5f00\u53d1\u667a\u80fd\u4f53\u7684\u4e92\u64cd\u4f5c\u63d0\u4f9b\u65e0\u9700\u624b\u5de5\u8bbe\u8ba1\u7684\u6539\u8fdb\u65b9\u5411\u3002"}, {"abstract": "Long-running LLM agents compact their context, replacing most history with a summary. We ask whether handoff summaries state permissions or requirements the record does not support, whether such sentences change what the next instance (the successor) does, and where they come from. Synthetic tool-use tasks carry a ground-truth permission ledger; same-snapshot replay reruns the successor with those whole sentences replaced by neutral filler. Two AI readers, reading only rule-flagged held-out summaries, confirmed unsupported restrictions in 1.2% and 2.4% of all readable summaries from two open-weight models, and unsupported authorizations in 0.1% and 1.3%. For restrictions, a pre-specified replay test was not significant (p = 0.58); a follow-up, planned after it, found a fragile effect (p = 0.027). Neutralizing false approvals cut unauthorized actions from 24 to 7 of 120 held-out runs (post hoc; later set: 17 to 11 of 48). Most development restrictions followed the agent\u0027s earlier reasoning that an action needs approval (post hoc). In pre-specified tests, replacing the system prompt\u0027s \"Some actions need approval.\" with one saying where requirements come from cut unsupported restrictions from 5.0% to 1.8% of development summaries and, on held-out templates, from 1.8% to 0.3% (both p \u003c 10^-9), while requests for approvals the ledger requires barely changed. Code and data: https://github.com/Chuw1/handoff-audit", "arxiv_id": "2611.06545", "arxiv_url": "https://arxiv.org/abs/2611.06545", "authors": ["Wenhui Chu"], "brief": "\u7814\u7a76\u7528\u5e26\u771f\u5b9e\u6743\u9650\u8d26\u672c\u7684\u5408\u6210\u5de5\u5177\u4efb\u52a1\uff0c\u5ba1\u8ba1\u667a\u80fd\u4f53\u4ea4\u63a5\u6458\u8981\u4e2d\u7684\u865a\u6784\u9650\u5236\u4e0e\u6388\u6743\uff1b\u518d\u4ee5\u540c\u5feb\u7167\u91cd\u653e\u66ff\u6362\u53ef\u7591\u53e5\u5b50\uff0c\u68c0\u9a8c\u5176\u5bf9\u540e\u7ee7\u667a\u80fd\u4f53\u884c\u4e3a\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06545", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4e24\u6a21\u578b\u6458\u8981\u4e2d\uff0c\u65e0\u4f9d\u636e\u9650\u5236\u53601.2%\u548c2.4%", "\u4e8b\u540e\u91cd\u653e\u4e2d\uff0c\u4e2d\u548c\u865a\u5047\u6388\u6743\u4f7f\u8d8a\u6743\u6b21\u6570\u4ece24\u964d\u81f37", "\u660e\u786e\u89c4\u5219\u6765\u6e90\u4f7f\u7559\u51fa\u96c6\u865a\u6784\u9650\u5236\u7387\u4ece1.8%\u964d\u81f30.3%"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u538b\u7f29", "\u6743\u9650\u63a7\u5236", "\u5b89\u5168\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06545v1", "published_at": "2026-11-04", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Do Summaries Become Instructions? Unsupported Policy in LLM Agents\u0027 Self-Written Handoff Summaries", "tldr": "\u667a\u80fd\u4f53\u81ea\u5199\u4ea4\u63a5\u6458\u8981\u53ef\u80fd\u865a\u6784\u6743\u9650\u89c4\u5219\uff0c\u660e\u786e\u89c4\u5219\u6765\u6e90\u53ef\u51cf\u5c11\u65e0\u4f9d\u636e\u9650\u5236\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528\u5e26\u771f\u5b9e\u6743\u9650\u8d26\u672c\u7684\u5408\u6210\u5de5\u5177\u4efb\u52a1\uff0c\u5ba1\u8ba1\u667a\u80fd\u4f53\u4ea4\u63a5\u6458\u8981\u4e2d\u7684\u865a\u6784\u9650\u5236\u4e0e\u6388\u6743\uff1b\u518d\u4ee5\u540c\u5feb\u7167\u91cd\u653e\u66ff\u6362\u53ef\u7591\u53e5\u5b50\uff0c\u68c0\u9a8c\u5176\u5bf9\u540e\u7ee7\u667a\u80fd\u4f53\u884c\u4e3a\u7684\u5f71\u54cd\u3002", "why_notable": "\u63ed\u793a\u4e0a\u4e0b\u6587\u538b\u7f29\u53ef\u80fd\u628a\u667a\u80fd\u4f53\u63a8\u6d4b\u53d8\u6210\u6743\u9650\u89c4\u5219\uff0c\u5e76\u7ed9\u51fa\u4f4e\u6210\u672c\u63d0\u793a\u4fee\u590d\uff1b\u4f46\u884c\u4e3a\u5f71\u54cd\u8bc1\u636e\u4e3b\u8981\u6765\u81ea\u4e8b\u540e\u5206\u6790\uff0c\u9650\u5236\u6548\u5e94\u5c1a\u4e0d\u7a33\u5065\u3002"}, {"abstract": "Vision-language-action models are typically built on a simple premise: perception is first compressed by visual encoders, and action reasoning begins only afterwards. Yet manipulation often hinges on precisely the visual signals most vulnerable to this abstraction, e.g., local geometry, boundaries, depth, and subtle state changes. This raises a fundamental question: should action policies inherit a fixed visual endpoint, or directly access evolving visual computation? We introduce NEO-VLA, a structurally encoder-free vision-language-action framework. Images are tokenized by lightweight patch convolutional layers and evolve jointly with language throughout the backbone, allowing a flow-matching action expert to draw from instruction-conditioned visual representations at different depths. This simple change reveals a consistent pattern. Native architectures outperform encoder-based counterparts under controlled comparisons; full fine-tuning reduces but does not erase the gap, and additional scale alone cannot recover it. More strikingly, layer-wise probing shows that the action-critical signals often peak well before the final visual representation. Across diverse manipulation settings and distribution shifts, NEO-VLA consequently achieves stronger and more robust control. Together, these results suggest that embodied control benefits from access to visual representations across the computational hierarchy, rather than a fixed encoder output.", "arxiv_id": "2611.06918", "arxiv_url": "https://arxiv.org/abs/2611.06918", "authors": ["Weichen Fan", "Haiwen Diao", "Penghao Wu", "Siyuan Hu", "Ziqi Huang", "Tianqi Liu", "Mingze Sun", "Ziyi Wang", "Zhongang Cai", "Hanming Deng", "Quan Wang", "Lei Yang", "Lewei Lu", "Fangzhou Hong", "Zhaoxi Chen", "Dahua Lin", "Ziwei Liu"], "brief": "NEO-VLA\u4ee5\u8f7b\u91cf\u56fe\u5757\u5377\u79ef\u66ff\u4ee3\u72ec\u7acb\u89c6\u89c9\u7f16\u7801\u5668\uff0c\u8ba9\u56fe\u50cf\u4e0e\u8bed\u8a00\u5728\u4e3b\u5e72\u4e2d\u5171\u540c\u6f14\u5316\uff1b\u6d41\u5339\u914d\u52a8\u4f5c\u4e13\u5bb6\u4ece\u4e0d\u540c\u6df1\u5ea6\u8bfb\u53d6\u6307\u4ee4\u6761\u4ef6\u5316\u89c6\u89c9\u8868\u5f81\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06918", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8f7b\u91cf\u56fe\u5757\u5377\u79ef\u5c06\u56fe\u50cf\u8f6c\u6362\u4e3a\u8bcd\u5143\uff0c\u4e0d\u8bbe\u72ec\u7acb\u89c6\u89c9\u7f16\u7801\u5668", "\u6d41\u5339\u914d\u52a8\u4f5c\u4e13\u5bb6\u5229\u7528\u4e0d\u540c\u6df1\u5ea6\u7684\u6307\u4ee4\u6761\u4ef6\u5316\u89c6\u89c9\u8868\u5f81", "\u9010\u5c42\u63a2\u6d4b\u53d1\u73b0\uff0c\u52a8\u4f5c\u5173\u952e\u4fe1\u53f7\u5e38\u5728\u6700\u7ec8\u89c6\u89c9\u5c42\u4e4b\u524d\u8fbe\u5cf0"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u6d41\u5339\u914d", "\u673a\u5668\u4eba\u64cd\u63a7"], "num_comments": 2, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2611.06918v1", "published_at": "2026-11-04", "score": 0.312, "selected_reasons": ["HF trending (56\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06918.png", "title": "From Pixels to Actions - Towards Native Vision-Language-Action Policies", "tldr": "\u8ba9\u52a8\u4f5c\u7b56\u7565\u76f4\u63a5\u8bfb\u53d6\u591a\u5c42\u89c6\u89c9\u8ba1\u7b97\uff0c\u6bd4\u4f9d\u8d56\u56fa\u5b9a\u7f16\u7801\u5668\u8f93\u51fa\u66f4\u7a33\u5065\u3002", "upvotes": 56, "what_it_is": "NEO-VLA\u4ee5\u8f7b\u91cf\u56fe\u5757\u5377\u79ef\u66ff\u4ee3\u72ec\u7acb\u89c6\u89c9\u7f16\u7801\u5668\uff0c\u8ba9\u56fe\u50cf\u4e0e\u8bed\u8a00\u5728\u4e3b\u5e72\u4e2d\u5171\u540c\u6f14\u5316\uff1b\u6d41\u5339\u914d\u52a8\u4f5c\u4e13\u5bb6\u4ece\u4e0d\u540c\u6df1\u5ea6\u8bfb\u53d6\u6307\u4ee4\u6761\u4ef6\u5316\u89c6\u89c9\u8868\u5f81\u3002", "why_notable": "\u53d7\u63a7\u6bd4\u8f83\u663e\u793a\uff0c\u5b8c\u6574\u5fae\u8c03\u4e0e\u6269\u5927\u89c4\u6a21\u4ecd\u65e0\u6cd5\u62b9\u5e73\u67b6\u6784\u5dee\u8ddd\uff1b\u7ed3\u679c\u652f\u6301\u8de8\u5c42\u89c6\u89c9\u8bbf\u95ee\u4f5c\u4e3a\u63d0\u5347\u64cd\u63a7\u6027\u80fd\u4e0e\u5206\u5e03\u5916\u9c81\u68d2\u6027\u7684\u65b9\u5411\u3002"}, {"abstract": "Few-step distillation offers efficient generation with diffusion and flow models, but preserving quality with only a few sampling steps remains challenging. Distribution-matching methods via score distillation provide a strong foundation, yet they rely on accurately tracking the student\u0027s changing distribution. At intermediate generation steps in few-step sampling, student-score estimation can be difficult, and commonly used estimators may describe a different distribution from the one used to update the student. Flow matching allows a more flexible approach to supervision through velocity fields constructed from the student\u0027s sampling process. Building on this perspective, we introduce Velocity Adversarial Distillation (VAD), which uses a learned critic to compare student and teacher fields and turn their disagreement into feedback for learning. VAD unifies score distillation, Fisher-based matching, and moment matching, also explaining existing heuristic MMD updates and delivering new training objectives. We further develop VA-TDM, which follows trajectory distribution matching: providing supervision for partial denoising along the student trajectory. Beyond this, VA-TDM combines transition-aware online velocity learning and dual-form VAD supervision across intermediate student transitions. Extensive results show that VA-TDM is powerful for learning few-step generators, achieving state-of-the-art four-step performance in both text-to-image and text-to-video generation across various backbones and scaling effectively to 33B MiniMax-H3. In particular, our VA-TDM-H3 notably outperforms the few-step Fast-H3 and is closer to the original many-step H3 according to human preference.", "arxiv_id": "2611.06796", "arxiv_url": "https://arxiv.org/abs/2611.06796", "authors": ["Yihong Luo", "Tianyu Pang", "Tianyang Hu"], "brief": "\u63d0\u51fa\u901f\u5ea6\u5bf9\u6297\u84b8\u998f\uff0c\u7528\u5b66\u4e60\u5f0f\u5224\u522b\u5668\u6bd4\u8f83\u5e08\u751f\u901f\u5ea6\u573a\u5e76\u53cd\u9988\u8bad\u7ec3\uff1b\u8fdb\u4e00\u6b65\u6cbf\u5b66\u751f\u53bb\u566a\u8f68\u8ff9\u5339\u914d\u5206\u5e03\uff0c\u7ed3\u5408\u8f6c\u79fb\u611f\u77e5\u5728\u7ebf\u901f\u5ea6\u5b66\u4e60\u4e0e\u53cc\u5f62\u5f0f\u76d1\u7763\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Luo-Yihong/VA-TDM", "github_stars": 40, "hf_url": "https://huggingface.co/papers/2611.06796", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["VAD\u7edf\u4e00\u5206\u6570\u84b8\u998f\u3001Fisher\u5339\u914d\u4e0e\u77e9\u5339\u914d", "VA-TDM\u5bf9\u5b66\u751f\u8f68\u8ff9\u4e2d\u7684\u90e8\u5206\u53bb\u566a\u8fdb\u884c\u76d1\u7763", "\u56fe\u50cf\u4e0e\u89c6\u9891\u56db\u6b65\u751f\u6210\u9886\u5148\uff0c\u53ef\u6269\u5c55\u81f333B H3"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u6d41\u5339\u914d", "\u591a\u6a21\u6001\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06796v1", "published_at": "2026-11-04", "score": 0.303, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06796.png", "title": "VA-TDM: A Unified View for Improving Few-Step Diffusion Models by Velocity Adversarial Distillation", "tldr": "\u901a\u8fc7\u901f\u5ea6\u573a\u5bf9\u6297\u84b8\u998f\u6539\u5584\u5c11\u6b65\u751f\u6210\uff0c\u5b9e\u73b0\u56fe\u50cf\u4e0e\u89c6\u9891\u56db\u6b65\u91c7\u6837\u7684\u9886\u5148\u8d28\u91cf\u3002", "upvotes": 12, "what_it_is": "\u63d0\u51fa\u901f\u5ea6\u5bf9\u6297\u84b8\u998f\uff0c\u7528\u5b66\u4e60\u5f0f\u5224\u522b\u5668\u6bd4\u8f83\u5e08\u751f\u901f\u5ea6\u573a\u5e76\u53cd\u9988\u8bad\u7ec3\uff1b\u8fdb\u4e00\u6b65\u6cbf\u5b66\u751f\u53bb\u566a\u8f68\u8ff9\u5339\u914d\u5206\u5e03\uff0c\u7ed3\u5408\u8f6c\u79fb\u611f\u77e5\u5728\u7ebf\u901f\u5ea6\u5b66\u4e60\u4e0e\u53cc\u5f62\u5f0f\u76d1\u7763\u3002", "why_notable": "\u4e3a\u5c11\u6b65\u84b8\u998f\u4e2d\u5b66\u751f\u5206\u5e03\u4f30\u8ba1\u5931\u914d\u63d0\u4f9b\u7edf\u4e00\u6539\u8fdb\u8def\u5f84\uff1b\u4eba\u7c7b\u504f\u597d\u8bc4\u6d4b\u663e\u793a\uff0c\u5176H3\u7248\u672c\u4f18\u4e8eFast-H3\uff0c\u66f4\u63a5\u8fd1\u539f\u59cb\u591a\u6b65\u6a21\u578b\u3002"}, {"abstract": "AI agents are playing an increasingly important role in physics research. However, existing physics benchmarks only evaluate fixed questions, isolated sub-tasks, or paper reproduction with given solutions, and rarely check research quality alongside correctness. We introduce FrontierPhysics, an end-to-end benchmark with 56 tasks made by 42 physicists based on their own research, covering nine domains across theoretical, computational, and experimental physics. Each task requires agents to review the literature, develop a research plan, conduct research and experiments, and produce structured outputs and scientific manuscripts. Combining deterministic verifiers with expert-authored rubrics, FrontierPhysics evaluates whether agents\u0027 research is correct and publishable. Across 22 models in 26 configurations, no configuration passes more than 46 of its 168 rollouts. Manual review of agent trajectories shows that frontier agents\u0027 main weaknesses are insufficiently rigorous reasoning and limited expert intuition, rather than gaps in physics knowledge or execution errors.", "arxiv_id": "2611.06910", "arxiv_url": "https://arxiv.org/abs/2611.06910", "authors": ["Bingran You", "Wenjun Ke", "Ria Rosenauer", "Bo Liu", "Wenbo Chen", "Min Chen", "Shuqi Xu", "Yue Ma", "Jiechao Feng", "Bo Chen", "Xiangkai Sun", "Jiarui Liu", "Jinen Guo", "Zeyu Zhou", "Xu Huang", "Zhuohan Li", "Haoyu Li", "Heguang Lin", "Lijie Ding", "Yadong Zeng", "Kangqi Zhang", "Xinge Liu", "Hanwen Liu", "Zhenghong Li", "Alexander von Recum", "Yuchen Zhu", "Felix Schwarzfischer", "Yizhou Zhao", "Jicheng Wang", "Binxu Li", "Qian Yu", "Chan Li", "Cheng Dai", "Di Wang", "Haoyu Zhang", "Jiankai Sun", "Kaituo Feng", "Mian Qin", "Ruihong Yin", "Yiqun Luo", "Weiwei Wu", "Shihong Pan", "Tsung Yeh Hsieh", "Xiao Huang", "Yan Zhang", "Sihan Li", "Zirui Ren", "Zengji Tu", "Kyoung Whan Choe", "Ke Sun", "Vincenzo Galia", "Vaisakhi Mishra", "Jiashu He", "Hongyang Wang", "Zhiheng Yang", "Shubham Gaur", "Yifan Gu", "Shuyi Wang", "Zihao Zuo", "Steven Dillmann", "Yiyou Sun", "Xinyang Han", "Hanchung Lee", "Molei Tao", "Yue Zhao", "Shilong Liu", "Yuchen Wu", "Xuandong Zhao", "Xiangyi Li", "Florian Brand", "Gerbrand Ceder", "Hartmut Haeffner"], "brief": "\u63d0\u51fa\u8986\u76d6\u4e5d\u4e2a\u7269\u7406\u9886\u57df\u7684\u7aef\u5230\u7aef\u79d1\u7814\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u5b8c\u6210\u6587\u732e\u8c03\u7814\u3001\u7814\u7a76\u89c4\u5212\u3001\u5b9e\u9a8c\u4e0e\u8bba\u6587\u5199\u4f5c\uff0c\u5e76\u7ed3\u5408\u786e\u5b9a\u6027\u9a8c\u8bc1\u5668\u548c\u4e13\u5bb6\u91cf\u89c4\u8bc4\u4f30\u6b63\u786e\u6027\u4e0e\u53ef\u53d1\u8868\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06910", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["42\u4f4d\u7269\u7406\u5b66\u5bb6\u57fa\u4e8e\u81ea\u8eab\u7814\u7a76\u8bbe\u8ba156\u9
