https://arxiv.org/abs/2611.05593", "authors": ["Shahaf Valencia Levy", "Sagie Benaim"], "brief": "\u6a21\u578b\u5c06\u6bcf\u4e2a\u9ad8\u65af\u7f16\u7801\u4e3a\u89c6\u89d2\u65e0\u5173\u7684\u8bcd\u5143\uff0c\u518d\u7531\u89c6\u89d2\u76f8\u5173\u89e3\u7801\u5668\u4ee5\u76f8\u673a\u5c04\u7ebf\u5c0f\u5757\u67e5\u8be2\u8fd9\u4e9b\u8bcd\u5143\uff0c\u76f4\u63a5\u751f\u6210\u50cf\u7d20\uff0c\u63a2\u7d22\u7eaf\u795e\u7ecf\u7f51\u7edc\u6e32\u67d3\u4e09\u7ef4\u9ad8\u65af\u7684\u53ef\u884c\u6027\u3002", "categories": ["cs.CV", "cs.GR", "cs.LG"], "github_repo": "https://github.com/SVLwoof/gaussianformer", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.05593", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8bad\u7ec3\u4f7f\u752826,820\u4e2aObjaverse\u5bf9\u8c61\uff0c\u6bcf\u4e2a\u88c1\u81f32\u4e07\u4e2a\u9ad8\u65af\u3002", "300\u4e2a\u672a\u89c1\u5bf9\u8c61\u4e0aPSNR\u4e3a38.08 dB\uff0c\u5149\u6805\u5316\u4e3a44.02 dB\u3002", "\u5411\u89e3\u7801\u5668\u63d0\u4f9b\u9ad8\u65af\u6295\u5f71\u8986\u76d6\u8303\u56f4\uff0cPSNR\u63d0\u53471.4 dB\u3002"], "keywords": ["\u4e09\u7ef4\u9ad8\u65af", "\u795e\u7ecf\u6e32\u67d3", "Transformer"], "num_comments": 1, "on_hf": true, "organization": "The Hebrew University of Jerusalem", "pdf_url": "https://arxiv.org/pdf/2611.05593v1", "published_at": "2026-11-03", "score": 0.197, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05593.png", "title": "GaussianRenderFormer: Transformer-based Rendering of 3D Gaussian Splats", "tldr": "\u7528Transformer\u76f4\u63a5\u5c06\u4e09\u7ef4\u9ad8\u65af\u4e0e\u76f8\u673a\u53c2\u6570\u6e32\u67d3\u6210\u56fe\u50cf\uff0c\u65e0\u9700\u5149\u6805\u5316\u5668\u3002", "upvotes": 3, "what_it_is": "\u6a21\u578b\u5c06\u6bcf\u4e2a\u9ad8\u65af\u7f16\u7801\u4e3a\u89c6\u89d2\u65e0\u5173\u7684\u8bcd\u5143\uff0c\u518d\u7531\u89c6\u89d2\u76f8\u5173\u89e3\u7801\u5668\u4ee5\u76f8\u673a\u5c04\u7ebf\u5c0f\u5757\u67e5\u8be2\u8fd9\u4e9b\u8bcd\u5143\uff0c\u76f4\u63a5\u751f\u6210\u50cf\u7d20\uff0c\u63a2\u7d22\u7eaf\u795e\u7ecf\u7f51\u7edc\u6e32\u67d3\u4e09\u7ef4\u9ad8\u65af\u7684\u53ef\u884c\u6027\u3002", "why_notable": "\u5c55\u793a\u4e86\u4e0d\u4f9d\u8d56\u5149\u6805\u5316\u5668\u7684\u9ad8\u65af\u6e32\u67d3\u8def\u5f84\uff0c\u5e76\u5c06\u6027\u80fd\u74f6\u9888\u6307\u5411\u89c6\u89d2\u89e3\u7801\u5668\uff1b\u4f46\u5f53\u524d\u753b\u8d28\u4ecd\u660e\u663e\u843d\u540e\u4e8e\u540c\u8f93\u5165\u7684\u4f20\u7edf\u5149\u6805\u5316\u3002"}, {"abstract": "Historical archives are invaluable for multidisciplinary research but remain inaccessible globally due to severe language barriers. While manual translation is prohibitively expensive and time-consuming, simply applying existing machine translation models is inadequate due to unique linguistic nuances and the temporal bias inherent in scarce human-labeled corpora. To address these challenges, we propose HERIT, a systematic domain-adaptation pipeline that leverages retrieval-augmented generation (RAG) to generate high-quality pseudo-labeled data from abundant Hanja-Korean corpora. This approach substantially expands the training dataset, mitigating both data scarcity and temporal overfitting across different historical periods. Extensive automated and human evaluations demonstrate that HERIT consistently outperforms baselines. Finally, we translate previously untranslated portions of the archives using our model, thereby enabling global access to these resources for researchers.", "arxiv_id": "2611.04949", "arxiv_url": "https://arxiv.org/abs/2611.04949", "authors": ["Dayeon Jeong", "Kyeongpil Kang"], "brief": "HERIT\u662f\u4e00\u5957\u5386\u53f2\u6c49\u5b57\u6587\u732e\u82f1\u8bd1\u7684\u9886\u57df\u9002\u914d\u6d41\u7a0b\uff0c\u5229\u7528\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u4ece\u5927\u91cf\u6c49\u5b57\u2014\u97e9\u8bed\u8bed\u6599\u6784\u9020\u4f2a\u6807\u6ce8\u6570\u636e\uff0c\u6269\u5145\u8bad\u7ec3\u96c6\u5e76\u6539\u5584\u8de8\u5386\u53f2\u65f6\u671f\u7684\u7ffb\u8bd1\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/dandamdandam/HERIT", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.04949", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ee5RAG\u4ece\u6c49\u5b57\u2014\u97e9\u8bed\u8bed\u6599\u751f\u6210\u82f1\u8bd1\u4f2a\u6807\u6ce8", "\u901a\u8fc7\u6269\u5145\u8bad\u7ec3\u6570\u636e\u7f13\u89e3\u6570\u636e\u7a00\u7f3a\u4e0e\u65f6\u4ee3\u8fc7\u62df\u5408", "\u81ea\u52a8\u4e0e\u4eba\u5de5\u8bc4\u4f30\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u7ffb\u8bd1\u672a\u8bd1\u6863\u6848"], "keywords": ["\u673a\u5668\u7ffb\u8bd1", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u9886\u57df\u9002\u914d", "\u5386\u53f2\u6587\u732e"], "num_comments": 2, "on_hf": true, "organization": "DAMI Lab", "pdf_url": "https://arxiv.org/pdf/2611.04949v1", "published_at": "2026-11-03", "score": 0.188, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04949.png", "title": "HERIT: Enabling Global Access to Hanja-to-English Historical Translation by Mitigating Temporal Bias", "tldr": "\u7528\u68c0\u7d22\u589e\u5f3a\u4f2a\u6807\u6ce8\u6269\u5145\u8bad\u7ec3\u6570\u636e\uff0c\u7f13\u89e3\u5386\u53f2\u6c49\u5b57\u6587\u732e\u82f1\u8bd1\u7684\u65f6\u4ee3\u504f\u5dee\u3002", "upvotes": 0, "what_it_is": "HERIT\u662f\u4e00\u5957\u5386\u53f2\u6c49\u5b57\u6587\u732e\u82f1\u8bd1\u7684\u9886\u57df\u9002\u914d\u6d41\u7a0b\uff0c\u5229\u7528\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u4ece\u5927\u91cf\u6c49\u5b57\u2014\u97e9\u8bed\u8bed\u6599\u6784\u9020\u4f2a\u6807\u6ce8\u6570\u636e\uff0c\u6269\u5145\u8bad\u7ec3\u96c6\u5e76\u6539\u5584\u8de8\u5386\u53f2\u65f6\u671f\u7684\u7ffb\u8bd1\u8868\u73b0\u3002", "why_notable": "\u5b83\u5c06\u8de8\u65f6\u4ee3\u6cdb\u5316\u4f5c\u4e3a\u5386\u53f2\u7ffb\u8bd1\u7684\u5173\u952e\u95ee\u9898\uff0c\u5e76\u5229\u7528\u73b0\u6709\u53cc\u8bed\u8d44\u6e90\u964d\u4f4e\u6807\u6ce8\u4f9d\u8d56\uff0c\u4e3a\u5168\u7403\u7814\u7a76\u8005\u9605\u8bfb\u672a\u8bd1\u6863\u6848\u63d0\u4f9b\u5b9e\u9645\u8def\u5f84\u3002"}, {"abstract": "Continual learning in physical AI differs from conventional continual learning because small per-step policy errors can accumulate over a trajectory. Each deviation may move the agent outside the training distribution, increase subsequent prediction errors, and ultimately cause closed-loop task failure. This work introduces Dynamics-Risk Adaptive Plasticity (DRAP), a replay-free method that estimates the historical importance of adaptable model tensors from sample-level action gradients weighted by local trajectory-amplification risk. A ridge-regularized local linear model is fitted to expert state-action transitions, and the largest singular value of its state-transition matrix provides a policy-independent, Lyapunov-inspired estimate of one-step perturbation amplification. After each task, risk-weighted squared gradients are accumulated in a tensor-level importance memory. During subsequent tasks, DRAP uses normalized cumulative importance to scale the effective AdamW learning rate of each tensor, immediately reducing the plasticity of components that supported previous behavior at dynamically sensitive trajectory points. We instantiate DRAP on a fixed KappaTune-selected subnetwork of OpenVLA and evaluate replay-free sequential adaptation across the LIBERO Spatial, Object, and Goal suites. Compared with standard AdamW fine-tuning and EWC, the results show substantially improved retention of previously learned behaviors while preserving strong new-suite acquisition.", "arxiv_id": "2611.05029", "arxiv_url": "https://arxiv.org/abs/2611.05029", "authors": ["Oswaldo Ludwig"], "brief": "DRAP\u662f\u4e00\u79cd\u65e0\u56de\u653e\u6301\u7eed\u5b66\u4e60\u65b9\u6cd5\uff0c\u7528\u5c40\u90e8\u52a8\u529b\u5b66\u98ce\u9669\u52a0\u6743\u52a8\u4f5c\u68af\u5ea6\uff0c\u7d2f\u8ba1\u5f20\u91cf\u91cd\u8981\u6027\uff0c\u518d\u636e\u6b64\u8c03\u6574\u5404\u5f20\u91cf\u7684AdamW\u5b66\u4e60\u7387\uff0c\u4fdd\u62a4\u5386\u53f2\u884c\u4e3a\u3002", "categories": ["cs.LG", "cs.RO"], "github_repo": "https://github.com/oswaldoludwig/DRAP-Dynamics-Risk-Adaptive-Plasticity", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05029", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5cad\u56de\u5f52\u62df\u5408\u5c40\u90e8\u52a8\u529b\u5b66\uff0c\u4ee5\u6700\u5927\u5947\u5f02\u503c\u4f30\u8ba1\u6270\u52a8\u653e\u5927\u98ce\u9669", "\u98ce\u9669\u52a0\u6743\u5e73\u65b9\u52a8\u4f5c\u68af\u5ea6\uff0c\u7d2f\u8ba1\u5f20\u91cf\u7ea7\u91cd\u8981\u6027", "\u5728OpenVLA\u4e0a\u8bc4\u6d4bLIBERO\u4e09\u4e2a\u5957\u4ef6\uff0c\u4fdd\u7559\u6548\u679c\u4f18\u4e8eEWC"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u673a\u5668\u4eba\u5b66\u4e60", "\u52a8\u529b\u5b66\u98ce\u9669", "\u707e\u96be\u6027\u9057\u5fd8"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05029v1", "published_at": "2026-11-03", "score": 0.182, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05029.png", "title": "DRAP: Dynamics-Risk Adaptive Plasticity for Continual Learning in Physical AI", "tldr": "\u6309\u8f68\u8ff9\u6270\u52a8\u653e\u5927\u98ce\u9669\u8c03\u8282\u53c2\u6570\u66f4\u65b0\uff0c\u7f13\u89e3\u673a\u5668\u4eba\u6301\u7eed\u5b66\u4e60\u4e2d\u7684\u65e7\u6280\u80fd\u9057\u5fd8\u3002", "upvotes": 0, "what_it_is": "DRAP\u662f\u4e00\u79cd\u65e0\u56de\u653e\u6301\u7eed\u5b66\u4e60\u65b9\u6cd5\uff0c\u7528\u5c40\u90e8\u52a8\u529b\u5b66\u98ce\u9669\u52a0\u6743\u52a8\u4f5c\u68af\u5ea6\uff0c\u7d2f\u8ba1\u5f20\u91cf\u91cd\u8981\u6027\uff0c\u518d\u636e\u6b64\u8c03\u6574\u5404\u5f20\u91cf\u7684AdamW\u5b66\u4e60\u7387\uff0c\u4fdd\u62a4\u5386\u53f2\u884c\u4e3a\u3002", "why_notable": "\u628a\u7269\u7406\u7cfb\u7edf\u7684\u8bef\u5dee\u653e\u5927\u98ce\u9669\u7eb3\u5165\u53c2\u6570\u4fdd\u62a4\uff0c\u800c\u975e\u4ec5\u770b\u9884\u6d4b\u8bef\u5dee\uff1b\u65e0\u9700\u5386\u53f2\u6570\u636e\u56de\u653e\uff0c\u4e5f\u80fd\u517c\u987e\u65e7\u884c\u4e3a\u4fdd\u7559\u4e0e\u65b0\u4efb\u52a1\u5b66\u4e60\u3002"}, {"abstract": "Generative video models are increasingly used as visual world simulators, yet their primary strength lies in rendering plausible pixels rather than reasoning about how a world should evolve. Coherent world evolution requires more than visual fidelity: when an event occurs, a model must infer its consequences for the entities in the world and then render the resulting state. For example, after a wild beast appears, the model should not only depict the wild beast, but also infer whether a nearby person should flee, take cover, or fight back based on the realized scene. Existing diffusion-based video models lack an explicit mechanism for maintaining world state and reasoning over such event-conditioned consequences, often producing visually plausible but behaviorally static or causally inconsistent outputs. To make this reasoning gap concrete and measurable, we propose a new problem, Out-of-Sight Causal Evolution, which requires a model to render an event, reason about its consequences for the evolving world state, and reveal a causally plausible outcome as the world continues to evolve, even out of sight. As a baseline reference solution, we introduce EvoWorld, a brain-renderer collaboration framework in which a vision-language model serves as the world brain: it observes generated segments, maintains an evolving account of the world, and reasons about plausible state transitions, while a segment-autoregressive video renderer realizes them visually. We further introduce EvoWorld-Data and EvoWorld-Bench for training and evaluating event realization, causal reactions, and revisit consistency. Experiments show that EvoWorld substantially improves event-conditioned causal evolution over recent models while preserving visual quality and consistency, establishing a reference point for reasoning-guided, autonomous world evolution beyond the current field of view.", "arxiv_id": "2611.06748", "arxiv_url": "https://arxiv.org/abs/2611.06748", "authors": ["Yequan Bie", "Dengyang Jiang", "Zhixuan Chen", "Xiaozhuan Liang", "Haoxuan Che", "Quande Liu", "Xi Chen", "Hao Chen"], "brief": "\u63d0\u51fa\u89c6\u91ce\u5916\u56e0\u679c\u6f14\u5316\u4efb\u52a1\uff0c\u5e76\u6784\u5efa\u8111\u2014\u6e32\u67d3\u5668\u534f\u4f5c\u6846\u67b6\u3002\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u89c2\u5bdf\u7247\u6bb5\u3001\u7ef4\u62a4\u4e16\u754c\u72b6\u6001\u5e76\u63a8\u7406\u4e8b\u4ef6\u540e\u679c\uff0c\u5206\u6bb5\u81ea\u56de\u5f52\u89c6\u9891\u6a21\u578b\u8d1f\u8d23\u5448\u73b0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06748", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["EvoWorld\u4ee5\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u4e16\u754c\u72b6\u6001\u8f6c\u79fb", "\u5206\u6bb5\u81ea\u56de\u5f52\u6e32\u67d3\u5668\u5c06\u63a8\u7406\u7ed3\u679c\u8f6c\u4e3a\u89c6\u9891", "EvoWorld-Bench\u8bc4\u4f30\u4e8b\u4ef6\u3001\u56e0\u679c\u53cd\u5e94\u4e0e\u91cd\u8bbf\u4e00\u81f4\u6027"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u56e0\u679c\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06748v1", "published_at": "2026-11-04", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EvoWorld: Towards Out-of-Sight World Evolution in Generative Video Models", "tldr": "\u901a\u8fc7\u4e16\u754c\u5927\u8111\u4e0e\u89c6\u9891\u6e32\u67d3\u5668\u534f\u4f5c\uff0c\u8ba9\u753b\u9762\u4e4b\u5916\u7684\u4e8b\u4ef6\u540e\u679c\u4e5f\u80fd\u8fde\u8d2f\u6f14\u5316\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u89c6\u91ce\u5916\u56e0\u679c\u6f14\u5316\u4efb\u52a1\uff0c\u5e76\u6784\u5efa\u8111\u2014\u6e32\u67d3\u5668\u534f\u4f5c\u6846\u67b6\u3002\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u89c2\u5bdf\u7247\u6bb5\u3001\u7ef4\u62a4\u4e16\u754c\u72b6\u6001\u5e76\u63a8\u7406\u4e8b\u4ef6\u540e\u679c\uff0c\u5206\u6bb5\u81ea\u56de\u5f52\u89c6\u9891\u6a21\u578b\u8d1f\u8d23\u5448\u73b0\u3002", "why_notable": "\u5c06\u89c6\u9891\u751f\u6210\u7684\u8bc4\u4f30\u91cd\u70b9\u4ece\u50cf\u7d20\u903c\u771f\u63a8\u8fdb\u5230\u4e8b\u4ef6\u540e\u679c\u4e0e\u4e16\u754c\u72b6\u6001\u4e00\u81f4\u6027\uff0c\u4e3a\u63a8\u7406\u9a71\u52a8\u7684\u81ea\u4e3b\u4e16\u754c\u6a21\u62df\u63d0\u4f9b\u57fa\u7ebf\u3002"}, {"abstract": "Agent trajectories often contain both successful decisions and failed attempts, yet optimization with sparse trajectory-level rewards struggles to identify which critical decisions should be reinforced or suppressed. We observe that meaningful distinctions among on-policy trajectories can be distilled into natural-language process rubrics and used as process supervision signals. Based on this insight, we propose Online Rubric Self-Distillation (ORSD), which leverages self-derived process rubrics for dense token-level supervision, thereby augmenting outcome-centric reinforcement learning. Specifically, the current policy independently generates multiple rubric bundles at each step according to the same group of trajectories, extracting candidate process rubrics from cross-trajectory behavioral differences. A frozen verifier then evaluates all rubric items against each trajectory in the group, and selects one candidate bundle based on bundle-level alignment between rubric satisfaction and task success. ORSD treats the selected rubric bundle as privileged information during training, then compares the log-likelihoods of the original tokens with and without the rubric. The resulting likelihood gap provides token-specific process credit, which is added to the original trajectory-level GRPO advantage through additive advantage shaping. ORSD thus bridges trajectory-level outcome supervision and fine-grained process supervision, enabling token-level credit assignment using process signals. Extensive experiments on ALFWorld and WebShop show that ORSD accelerates policy improvement and boosts final task performance for both Qwen3-1.7B and Qwen3-4B under the same environment-interaction budget. Our code is available at https://github.com/AnnaXChun/ORSD.", "arxiv_id": "2611.06543", "arxiv_url": "https://arxiv.org/abs/2611.06543", "authors": ["Shumao Wu", "Kongcheng Zhang", "Jianqiang Huang", "Baisheng Lai"], "brief": "\u63d0\u51faORSD\uff0c\u4ece\u667a\u80fd\u4f53\u8f68\u8ff9\u5dee\u5f02\u4e2d\u63d0\u70bc\u8fc7\u7a0b\u51c6\u5219\uff0c\u63d0\u4f9b\u8bcd\u5143\u7ea7\u5f3a\u5316\u5b66\u4e60\u53cd\u9988\uff1b\u5728\u76f8\u540c\u4ea4\u4e92\u9884\u7b97\u4e0b\uff0c\u52a0\u5feb\u7b56\u7565\u6539\u8fdb\u5e76\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06543", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u4fe1\u7528\u5206\u914d", "\u8fc7\u7a0b\u76d1\u7763"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06543v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Using Experience Twice: Dynamic Process Rubrics for Privileged Token-Level Credit Assignment", "tldr": "\u63d0\u51faORSD\uff0c\u4ece\u667a\u80fd\u4f53\u8f68\u8ff9\u5dee\u5f02\u4e2d\u63d0\u70bc\u8fc7\u7a0b\u51c6\u5219\uff0c\u63d0\u4f9b\u8bcd\u5143\u7ea7\u5f3a\u5316\u5b66\u4e60\u53cd\u9988\uff1b\u5728\u76f8\u540c\u4ea4\u4e92\u9884\u7b97\u4e0b\uff0c\u52a0\u5feb\u7b56\u7565\u6539\u8fdb\u5e76\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Offline reinforcement learning with verifiable rewards (RLVR) trains on a fixed pool of sampled responses and typically supervises every token of every response, although responses and tokens are not equally informative. We study which ones to supervise through the Gibbs-optimal policy of KL-regularized RLVR, which offline training targets, and measure the mismatch between a policy and this target with a bidirectional KL divergence. At the reference policy, this mismatch factorizes exactly and separates the two outcomes: correct responses contribute mainly through the forward term, concentrated on their low-probability tokens, and incorrect responses through the reverse term, concentrated on the responses the policy generates often and on their high-probability tokens. Based on this analysis, we propose GIST (Gibbs-Targeted Hierarchical Data Selection), a two-level selection method that approximates these principles with signals available before training. GIST uses the sampling temperature to select correct responses on-policy and incorrect responses near the policy\u0027s mode, and it uses the initial policy\u0027s token probabilities to supervise only the tokens where the mismatch lies. Applied to two offline training objectives, GIST raises the average accuracy over GSM8K, MATH-500, and MBPP for all three models under both objectives. In a controlled comparison on Qwen3-0.6B/GSM8K, it outperforms seven selection baselines that choose from the same candidates while supervising 66.6% fewer tokens than training on all candidates of the same prompts.", "arxiv_id": "2611.06395", "arxiv_url": "https://arxiv.org/abs/2611.06395", "authors": ["Xuliang Huang", "Tianxiang Zhao", "Chengwei Qin", "Yao Shu"], "brief": "GIST\u4f9d\u636e\u7b56\u7565\u4e0eGibbs\u76ee\u6807\u7684\u504f\u5dee\uff0c\u5206\u5c42\u7b5b\u9009\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u7684\u56de\u7b54\u4e0e\u8bcd\u5143\uff1b\u5728\u6570\u5b66\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u63d0\u5347\u51c6\u786e\u7387\uff0c\u53d7\u63a7\u5b9e\u9a8c\u4e2d\u76d1\u7763\u8bcd\u5143\u51cf\u5c1166.6%\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06395", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u6570\u636e\u9009\u62e9", "\u6570\u5b66\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06395v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GIST: Gibbs-Targeted Hierarchical Data Selection for Offline RLVR", "tldr": "GIST\u4f9d\u636e\u7b56\u7565\u4e0eGibbs\u76ee\u6807\u7684\u504f\u5dee\uff0c\u5206\u5c42\u7b5b\u9009\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u7684\u56de\u7b54\u4e0e\u8bcd\u5143\uff1b\u5728\u6570\u5b66\u548c\u4ee3\u7801\u4efb\u52a1\u4e0a\u63d0\u5347\u51c6\u786e\u7387\uff0c\u53d7\u63a7\u5b9e\u9a8c\u4e2d\u76d1\u7763\u8bcd\u5143\u51cf\u5c1166.6%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Context compression reduces inference cost by encoding inputs into compact representations while preserving semantic content. An open question is whether semantic preservation alone is sufficient to maintain downstream behaviours such as refusal alignment. We investigate this question and find that encoder-based compression systematically weakens refusal behaviour in instruction-tuned language models, despite high reconstruction fidelity. This effect persists across model families and compression architectures. Mechanistic analysis shows that compression attenuates activation along the decoder\u0027s learned refusal direction. We further explore Memory Steering, a lightweight inference-time intervention that restores refusal rates to near-baseline levels without retraining and operates entirely in compressed representation space. These results demonstrate that semantic preservation does not guarantee behavioural preservation under compression, highlighting the need to explicitly preserve alignment-relevant features in compression-aware systems.", "arxiv_id": "2611.06380", "arxiv_url": "https://arxiv.org/abs/2611.06380", "authors": ["Anthony Nguyen", "Wenjun Lin"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u4e0a\u4e0b\u6587\u538b\u7f29\u867d\u80fd\u9ad8\u4fdd\u771f\u4fdd\u7559\u8bed\u4e49\uff0c\u5374\u4f1a\u8de8\u6a21\u578b\u524a\u5f31\u62d2\u7b54\u884c\u4e3a\uff1b\u63d0\u51fa\u5728\u538b\u7f29\u8868\u793a\u4e0a\u8fdb\u884c\u8f7b\u91cf\u63a8\u7406\u5e72\u9884\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u5c06\u62d2\u7b54\u7387\u6062\u590d\u81f3\u63a5\u8fd1\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06380", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e0a\u4e0b\u6587\u538b\u7f29", "\u5b89\u5168\u5bf9\u9f50", "\u62d2\u7b54\u673a\u5236", "\u63a8\u7406\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06380v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Does Context Compression Preserve Refusal Alignment?", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u4e0a\u4e0b\u6587\u538b\u7f29\u867d\u80fd\u9ad8\u4fdd\u771f\u4fdd\u7559\u8bed\u4e49\uff0c\u5374\u4f1a\u8de8\u6a21\u578b\u524a\u5f31\u62d2\u7b54\u884c\u4e3a\uff1b\u63d0\u51fa\u5728\u538b\u7f29\u8868\u793a\u4e0a\u8fdb\u884c\u8f7b\u91cf\u63a8\u7406\u5e72\u9884\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u5c06\u62d2\u7b54\u7387\u6062\u590d\u81f3\u63a5\u8fd1\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Unified Multimodal Models (UMMs) aim to support visual understanding and generation within a single model. Existing post-training methods either use understanding as a fixed teacher to improve generation, or rely on ground-truth trajectories to supervise both understanding and generation. Prism instead derives bidirectional supervision from self-generated interleaved rollouts, constructing training targets according to the reliability of their text and image chains. We propose Prism, a bidirectional self-teaching post-training method for UMMs. Like a prism decomposing mixed light, Prism decouples a coupled interleaved trajectory into a text chain and an image chain, assesses the reliability of each chain, and constructs a corresponding training target from their reliability states. Experiments on both SenseNova-U1 and BAGEL show that Prism improves both understanding and generation. On the generation side, GenEval improves from 85.8 to 89.2 (+3.4), and DPG improves from 86.1 to 87.3 (+1.2) on SenseNova-U1. On the understanding side, the total MME score improves from 2282.6 to 2311.6, and MMVP improves from 58.0 to 62.0. Consistent improvements are observed on BAGEL. These results highlight that Prism enables coordinated improvements in generation and understanding by constructing reliability-guided self-training targets from self-generated trajectories, without relying on an external verifier or externally annotated corrected trajectories during target construction.", "arxiv_id": "2611.06343", "arxiv_url": "https://arxiv.org/abs/2611.06343", "authors": ["Peng Zhang", "Qian Chen", "Xianyin Zhang", "Yimin Tian", "Ruite Fei", "Dongyi Lv", "Lifan Guo", "Chi Zhang", "Shuai Liu"], "brief": "Prism\u6309\u81ea\u751f\u6210\u8f68\u8ff9\u4e2d\u6587\u672c\u4e0e\u56fe\u50cf\u94fe\u7684\u53ef\u9760\u6027\u6784\u9020\u53cc\u5411\u81ea\u8bad\u7ec3\u76ee\u6807\uff0c\u65e0\u9700\u5916\u90e8\u9a8c\u8bc1\u5668\uff0c\u5728\u4e24\u79cd\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e0a\u540c\u6b65\u63d0\u5347\u89c6\u89c9\u7406\u89e3\u4e0e\u751f\u6210\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06343", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u81ea\u8bad\u7ec3", "\u89c6\u89c9\u7406\u89e3", "\u56fe\u50cf\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06343v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prism: Bidirectional Self-Teaching for Unified Multimodal Models", "tldr": "Prism\u6309\u81ea\u751f\u6210\u8f68\u8ff9\u4e2d\u6587\u672c\u4e0e\u56fe\u50cf\u94fe\u7684\u53ef\u9760\u6027\u6784\u9020\u53cc\u5411\u81ea\u8bad\u7ec3\u76ee\u6807\uff0c\u65e0\u9700\u5916\u90e8\u9a8c\u8bc1\u5668\uff0c\u5728\u4e24\u79cd\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e0a\u540c\u6b65\u63d0\u5347\u89c6\u89c9\u7406\u89e3\u4e0e\u751f\u6210\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Adversarial training enables one- and few-step image and video generation, but conventional adversarial losses supervise critic values without directly specifying the gradients used to update the generator. We present NEXTGAN, which trains a scalar critic by regressing its input gradient onto displacements between independently paired reference and generated features at interpolated locations in frozen representation spaces. For a fixed generator, this regression is equivalent to an adversarial objective with a gradient-energy penalty, while the generator retains the standard potential-based GAN update. The same objective adapts pre-trained image and video generators with up to 14B parameters, without auxiliary losses, online teacher scores, or trajectories. On ImageNet $256 \\times 256$, NEXTGAN achieves one-step FIDs of 2.87 with pixel-space JiT-B and 1.54 with latent-space DiT-XL/1; its adversarial form further reaches 1.36. For text-to-video generation, a single trained Wan2.1-1.3B model supports one-, two-, and four-step sampling, achieving the highest VBench total scores among the compared 1.3B methods at one and two steps. At two steps, NEXTGAN scores 83.13, exceeding rCM and AnyFlow by 1.25 and 0.47 points, respectively. Code is available at https://github.com/LINs-lab/NextGAN.git.", "arxiv_id": "2611.06270", "arxiv_url": "https://arxiv.org/abs/2611.06270", "authors": ["Xinhao Lou", "Dongye Xie", "Peng Sun", "Chenyi Zhuang", "Kaicheng Yu", "Tao Lin"], "brief": "NEXTGAN\u901a\u8fc7\u56de\u5f52\u5224\u522b\u5668\u8f93\u5165\u68af\u5ea6\uff0c\u7b80\u5316\u56fe\u50cf\u4e0e\u89c6\u9891\u751f\u6210\u7684\u5bf9\u6297\u8bad\u7ec3\uff1b\u652f\u6301\u767e\u4ebf\u53c2\u6570\u6a21\u578b\uff0c\u5355\u6b65\u56fe\u50cf\u751f\u6210\u548c\u5c11\u6b65\u89c6\u9891\u751f\u6210\u5747\u53d6\u5f97\u4f18\u5f02\u7ed3\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06270", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5bf9\u6297\u7f51\u7edc", "\u56fe\u50cf\u751f\u6210", "\u89c6\u9891\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06270v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "NextGAN: Towards Simple and Scalable GAN Training for Image and Video Generation", "tldr": "NEXTGAN\u901a\u8fc7\u56de\u5f52\u5224\u522b\u5668\u8f93\u5165\u68af\u5ea6\uff0c\u7b80\u5316\u56fe\u50cf\u4e0e\u89c6\u9891\u751f\u6210\u7684\u5bf9\u6297\u8bad\u7ec3\uff1b\u652f\u6301\u767e\u4ebf\u53c2\u6570\u6a21\u578b\uff0c\u5355\u6b65\u56fe\u50cf\u751f\u6210\u548c\u5c11\u6b65\u89c6\u9891\u751f\u6210\u5747\u53d6\u5f97\u4f18\u5f02\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) has led to significant gains in math and code generation. Extending these gains to open-ended domains remains challenging: ground-truth verification is unavailable, human annotation is expensive, and learned reward models are prone to reward hacking. The generation-verification gap, where judging good outputs is easier than producing them, offers a potential path to improvement. However, rubric-based judges are often imprecise and stationary, so policies can overfit or reward hack them. We introduce Rubric Curriculum RL (RcRL), which exploits this gap without new data, human annotations, or stronger teacher models. We combine pairwise preferences over rollouts with a curriculum over rubric criteria, yielding a more discriminative signal than absolute scoring and a non-stationary objective. Whereas baselines plateau within a few hundred steps, RcRL preserves output entropy and keeps improving past 1000 steps. On creative writing, RcRL achieves a 70.5% human win rate against the base model, with gains across benchmarks and judges. On HealthBench, RcRL improves over the base model by 14.6% (full set) and 25.4% (consensus subset), outperforming all training baselines, including instance-specific rubrics.", "arxiv_id": "2611.06244", "arxiv_url": "https://arxiv.org/abs/2611.06244", "authors": ["Sumeet Ramesh Motwani", "Tejas Krishnan", "Alistair Letcher", "Charles London", "Suhaas Bhat", "Huitian Jiao", "Philip Torr", "Riashat Islam", "Christopher Summerfield", "Jakob Foerster", "Christian Schroeder de Witt", "Qilong Gu", "Shital Shah"], "brief": "\u63d0\u51fa\u8bc4\u5206\u51c6\u5219\u8bfe\u7a0b\u5f3a\u5316\u5b66\u4e60\uff0c\u7ed3\u5408\u6210\u5bf9\u504f\u597d\u4e0e\u52a8\u6001\u51c6\u5219\uff0c\u65e0\u9700\u65b0\u589e\u6570\u636e\u6216\u6807\u6ce8\uff1b\u521b\u610f\u5199\u4f5c\u4eba\u7c7b\u8bc4\u6d4b\u80dc\u7387\u8fbe70.5%\uff0c\u533b\u7597\u95ee\u7b54\u4e5f\u663e\u8457\u63d0\u5347\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06244", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u504f\u597d\u5b66\u4e60", "\u8bfe\u7a0b\u5b66\u4e60", "\u5956\u52b1\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06244v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rubric Curriculum RL: Exploiting the Generation-Verification Gap in Non-Verifiable Domains", "tldr": "\u63d0\u51fa\u8bc4\u5206\u51c6\u5219\u8bfe\u7a0b\u5f3a\u5316\u5b66\u4e60\uff0c\u7ed3\u5408\u6210\u5bf9\u504f\u597d\u4e0e\u52a8\u6001\u51c6\u5219\uff0c\u65e0\u9700\u65b0\u589e\u6570\u636e\u6216\u6807\u6ce8\uff1b\u521b\u610f\u5199\u4f5c\u4eba\u7c7b\u8bc4\u6d4b\u80dc\u7387\u8fbe70.5%\uff0c\u533b\u7597\u95ee\u7b54\u4e5f\u663e\u8457\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Molecular dynamics predicts molecular motion from atomic forces and trajectory integration. Density functional theory (DFT) provides first-principles forces, but its $O(N^3)$ cost limits simulations to thousands of atoms; empirical force fields scale to millions but miss bond breaking and charge transfer. Equivariant message-passing Transformers learn the ab initio potential at linear cost. Stacked layers propagate information beyond a single cutoff, giving four layers a receptive field up to 23\u00c5. At this frontier, scale is limited by communication: layers exchange boundary features across devices, force backpropagation repeats the exchange, and moving atoms change neighbor graphs and tensor shapes. We present Tessera, a distributed runtime that fixes workload shapes between rebuilds. It sorts atoms along a space-filling curve into equal-count shards, ensuring identical atom counts and tensor shapes per rank. Peer sets scale as $K^{0.5}$, not $K$. A conservative neighbor skin preserves topology across updates, enabling each rebuild interval to replay as one CUDA Graph. Fused kernels, three-level neighbor search, and overlapped All-to-All complete it. On 512 GPUs, Tessera sustains 30.7M atoms at 89.7% weak-scaling efficiency (77--90% across three per-GPU loads); per-step time rises 1.11--1.29x as machine and problem grow 16x. Graph reuse cuts full-step time $1.87\\times$. Across an $8\\times$ device increase, neighbor-search cost grows $1.7\\times$, versus $3.0\\times$ for Morton order. In a live $10.24$M-atom salt solution, NVE energy drift is $0.42\\,\u03bc$eV/atom/ps over $10$ ps, and structure matches a serial reference. A 10.06M-atom Norovirus capsid sustains 100 ps of NVT at $\\approx 8$ ps/day on 256 A100 GPUs. Over 200,000 steps, it has no broken bonds or anomalously close pairs and uses three compiled variants, with no graph breaks or eager fallbacks.", "arxiv_id": "2611.06122", "arxiv_url": "https://arxiv.org/abs/2611.06122", "authors": ["Allex Kan", "Ji Zhang", "Hao Yin", "Hao Li", "Owen Fu", "Xunxing Chen", "Lin Huang", "Zion Wang", "Lucas Li", "Jiajun Cheng", "Arthur Jiang", "Junping Zhao", "Jia Zhang"], "brief": "Tessera\u4ee5\u5206\u5e03\u5f0f\u8fd0\u884c\u65f6\u52a0\u901f\u7b49\u53d8\u6d88\u606f\u4f20\u9012\u5206\u5b50\u52a8\u529b\u5b66\uff0c\u5728512\u5f20GPU\u4e0a\u6a21\u62df3070\u4e07\u539f\u5b50\uff0c\u5f31\u6269\u5c55\u6548\u7387\u8fbe89.7%\uff0c\u5e76\u9a8c\u8bc1\u5343\u4e07\u539f\u5b50\u4f53\u7cfb\u7684\u7a33\u5b9a\u6027\u3002", "categories": ["cs.DC", "cs.AI", "physics.bio-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06122", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5b50\u52a8\u529b\u5b66", "\u5206\u5e03\u5f0f\u8ba1\u7b97", "\u7b49\u53d8\u795e\u7ecf\u7f51\u7edc", "\u9ad8\u6027\u80fd\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06122v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ab Initio Accuracy Beyond the Cutoff: Distributed Message-Passing Equivariant Attention at Tens-of-Millions-of-Atom Scale", "tldr": "Tessera\u4ee5\u5206\u5e03\u5f0f\u8fd0\u884c\u65f6\u52a0\u901f\u7b49\u53d8\u6d88\u606f\u4f20\u9012\u5206\u5b50\u52a8\u529b\u5b66\uff0c\u5728512\u5f20GPU\u4e0a\u6a21\u62df3070\u4e07\u539f\u5b50\uff0c\u5f31\u6269\u5c55\u6548\u7387\u8fbe89.7%\uff0c\u5e76\u9a8c\u8bc1\u5343\u4e07\u539f\u5b50\u4f53\u7cfb\u7684\u7a33\u5b9a\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Watermarking has great potential for regulating the use of language models (LMs), but its deployment has been marred by controversy, as many users argue that fine-grained tracking of LM usage violates their privacy. This tension reduces the effectiveness of watermarks, as users engage in evasion strategies such as paraphrasing that can remove much of the watermark signal. We show that provenance and privacy can be reconciled if we shift the goal of watermark design from tracking individuals to estimating aggregate usage. We develop locally differentially private watermarks which provably limit the evidence that any individual text can contribute to detection, while still enabling accurate estimation of population frequencies. We introduce the Red-Green Sequence (RGS) watermark, a private and computationally efficient watermark that achieves accurate frequency estimation at high privacy levels across various models, sample sizes and generation entropies in settings that reflect realistic deployment scenarios. On C4 language modeling tasks, we attain $0.0019$ MSE with $0.0038$ mean absolute bias at a low $\\varepsilon$ of 1, while in more challenging settings such as an essay writing task with only 100 text samples, we still find errors on the order of $0.0113$ MSE with $0.004$ mean absolute bias at $\\varepsilon=2$.", "arxiv_id": "2611.06100", "arxiv_url": "https://arxiv.org/abs/2611.06100", "authors": ["Elise L. Han", "Tatsunori Hashimoto"], "brief": "\u5c06\u8bed\u8a00\u6a21\u578b\u6c34\u5370\u4ece\u4e2a\u4f53\u8ffd\u8e2a\u8f6c\u5411\u7fa4\u4f53\u7528\u91cf\u4f30\u8ba1\uff0c\u63d0\u51fa\u6ee1\u8db3\u5c40\u90e8\u5dee\u5206\u9690\u79c1\u7684RGS\u6c34\u5370\uff1b\u5728\u9ad8\u9690\u79c1\u5f3a\u5ea6\u53ca\u5c0f\u6837\u672c\u573a\u666f\u4e0b\u4ecd\u80fd\u4f4e\u8bef\u5dee\u4f30\u8ba1\u4f7f\u7528\u9891\u7387\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06100", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u6c34\u5370", "\u5dee\u5206\u9690\u79c1", "\u6765\u6e90\u8ffd\u6eaf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06100v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reconciling Privacy with Provenance for Language Model Watermarks", "tldr": "\u5c06\u8bed\u8a00\u6a21\u578b\u6c34\u5370\u4ece\u4e2a\u4f53\u8ffd\u8e2a\u8f6c\u5411\u7fa4\u4f53\u7528\u91cf\u4f30\u8ba1\uff0c\u63d0\u51fa\u6ee1\u8db3\u5c40\u90e8\u5dee\u5206\u9690\u79c1\u7684RGS\u6c34\u5370\uff1b\u5728\u9ad8\u9690\u79c1\u5f3a\u5ea6\u53ca\u5c0f\u6837\u672c\u573a\u666f\u4e0b\u4ecd\u80fd\u4f4e\u8bef\u5dee\u4f30\u8ba1\u4f7f\u7528\u9891\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent video world models allow users to explore generated environments through camera navigation. Continuous hand motion provides a fine-grained action channel for interacting with the people and objects encountered during exploration. We present Touch\u00e9World, a framework that integrates gesture-driven interaction into a camera-controlled video world model. Given an initial image and a scene-description prompt, the model generates video conditioned on temporally aligned camera and hand controls. We construct joint camera--hand training data from heterogeneous egocentric videos through annotation completion, consistency-based filtering, and temporal alignment. Building on a pretrained camera-controlled world model, we combine spatial hand-skeleton conditioning with numerical hand-motion features through parameter-efficient adaptation. Causal adaptation and few-step distillation support chunk-level online generation, allowing users to update their controls based on generated visual feedback. We further introduce Touch\u00e9Bench to evaluate hand-motion following, camera--hand coordination, online interaction, and object response. Together, these components establish a framework for studying continuous exploration and hand-driven interaction within generative worlds.", "arxiv_id": "2611.06061", "arxiv_url": "https://arxiv.org/abs/2611.06061", "authors": ["Jiaao Yu", "Yanjian Zhang", "Haoyang Jiang", "Guillaume Wisniewski", "Nadi Tomeh", "Shijie Jia"], "brief": "Touch\u00e9World\u5c06\u76f8\u673a\u5bfc\u822a\u4e0e\u8fde\u7eed\u624b\u52bf\u63a7\u5236\u7edf\u4e00\u5230\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u901a\u8fc7\u53c2\u6570\u9ad8\u6548\u9002\u914d\u548c\u5c11\u6b65\u84b8\u998f\u5b9e\u73b0\u5206\u5757\u5728\u7ebf\u751f\u6210\uff0c\u5e76\u5efa\u7acb\u57fa\u51c6\u8bc4\u4f30\u52a8\u4f5c\u8ddf\u968f\u3001\u534f\u540c\u63a7\u5236\u4e0e\u7269\u4f53\u54cd\u5e94\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06061", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u624b\u52bf\u4ea4\u4e92", "\u5728\u7ebf\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06061v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Touch\u00e9World tech report : Towards Online Unified Camera--Hand Exploration in Generative Worlds", "tldr": "Touch\u00e9World\u5c06\u76f8\u673a\u5bfc\u822a\u4e0e\u8fde\u7eed\u624b\u52bf\u63a7\u5236\u7edf\u4e00\u5230\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u901a\u8fc7\u53c2\u6570\u9ad8\u6548\u9002\u914d\u548c\u5c11\u6b65\u84b8\u998f\u5b9e\u73b0\u5206\u5757\u5728\u7ebf\u751f\u6210\uff0c\u5e76\u5efa\u7acb\u57fa\u51c6\u8bc4\u4f30\u52a8\u4f5c\u8ddf\u968f\u3001\u534f\u540c\u63a7\u5236\u4e0e\u7269\u4f53\u54cd\u5e94\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion drafters accelerate speculative decoding by denoising multiple draft tokens in parallel. Their training uses anchor sampling to construct compact draft queries and performs cross-attention with a block-sparse mask over a much longer context. We empirically show that acceptance length remains stable as context scales with a fixed query budget, while increasing the query budget yields diminishing quality gains, jointly establishing a practical regime with queries far shorter than the context. No existing context parallelism (CP) method jointly exploits this query--context asymmetry and meets the nonlinear, sample-dependent load-balancing requirement created by anchor sampling. We present Split-KV, an exact CP method that keeps key/value shards local and limits per-layer attention communication to query-sized tensors, making this communication independent of context length. Its global query view further enables a cost-aware longest-processing-time-first (LPT) strategy that balances context key/value chunks by their realized attention cost. At a CP size of 64, Split-KV retains 85--91\\% weak-scaling efficiency and achieves up to $3.67\\times$ speedup over the fastest available CP baseline. LPT achieves $\u003c$1\\% imbalance and plans three orders of magnitude faster than the best load-balancing baseline. Code is available at https://github.com/zxgx/verl.", "arxiv_id": "2611.05926", "arxiv_url": "https://arxiv.org/abs/2611.05926", "authors": ["Geng Zhang", "Fangzhao Zhang", "Cong Xie", "Tiantian Fan", "Yang You"], "brief": "Split-KV\u5229\u7528\u67e5\u8be2\u8fdc\u77ed\u4e8e\u4e0a\u4e0b\u6587\u7684\u7279\u70b9\uff0c\u964d\u4f4e\u6269\u6563\u8349\u7a3f\u6a21\u578b\u8bad\u7ec3\u901a\u4fe1\u5e76\u5747\u8861\u8d1f\u8f7d\uff1b64\u8def\u5e76\u884c\u6548\u7387\u8fbe85%\u81f391%\uff0c\u8f83\u6700\u5feb\u57fa\u7ebf\u6700\u9ad8\u63d0\u901f3.67\u500d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05926", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e0a\u4e0b\u6587\u5e76\u884c", "\u63a8\u6d4b\u89e3\u7801", "\u6269\u6563\u6a21\u578b", "\u8d1f\u8f7d\u5747\u8861"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05926v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Split-KV: Efficient Context Parallelism for Training Diffusion Drafters", "tldr": "Split-KV\u5229\u7528\u67e5\u8be2\u8fdc\u77ed\u4e8e\u4e0a\u4e0b\u6587\u7684\u7279\u70b9\uff0c\u964d\u4f4e\u6269\u6563\u8349\u7a3f\u6a21\u578b\u8bad\u7ec3\u901a\u4fe1\u5e76\u5747\u8861\u8d1f\u8f7d\uff1b64\u8def\u5e76\u884c\u6548\u7387\u8fbe85%\u81f391%\uff0c\u8f83\u6700\u5feb\u57fa\u7ebf\u6700\u9ad8\u63d0\u901f3.67\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Machine unlearning aims to remove a user\u0027s data from a trained model after a deletion request. Existing methods are majorly evaluated on three axes - how well they forget, how much capability they retain, and how robust they are to membership inference attacks, but not on whether the provider can offer the user any evidence that the deletion occurred. To fill this gap, we introduce auditability as a fourth axis, defined as the separation between requested (forget set) and retained (retain set) data under a statistic the provider computes. We show that across eleven unlearning methods on TOFU, MUSE and RWKU no method satisfies all four axes, with different methods falling short on different axes. To address this, we propose a two stage method that can be used on top of any unlearning method, in the the first stage we propose ${GapWiden}$ which uses a hinge loss to increase the difference between audit statistics of forget set and retain set. In the second stage we propose ${GapVeil}$, an inference time rejection-sampler which uses the base model as the drafter and re-samples based on the audit statistics of the drafted response. We observe that using our method, auditability and leakage reach oracle parity for every unlearning method, and forget performance converges to the oracle; retain performance improves for nine of eleven methods but remains short of parity. Our results show that evidence of deletion or auditability can be constructed by design, and that treating it as an explicit requirement changes the viability of existing unlearning methods.", "arxiv_id": "2611.05866", "arxiv_url": "https://arxiv.org/abs/2611.05866", "authors": ["Piyush Tiwary", "Anushka Srivastava", "Prathosh A. P"], "brief": "\u63d0\u51fa\u5927\u6a21\u578b\u9057\u5fd8\u7684\u53ef\u5ba1\u8ba1\u6307\u6807\u53ca\u4e24\u9636\u6bb5\u589e\u5f3a\u65b9\u6cd5\u3002\u5728\u4e09\u4e2a\u57fa\u51c6\u3001\u5341\u4e00\u79cd\u65b9\u6cd5\u4e0a\uff0c\u5ba1\u8ba1\u6027\u4e0e\u6cc4\u6f0f\u8fbe\u5230\u7406\u60f3\u53c2\u7167\u6c34\u5e73\uff0c\u9057\u5fd8\u6548\u679c\u6539\u5584\uff0c\u4f46\u4fdd\u7559\u80fd\u529b\u4ecd\u6709\u5dee\u8ddd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05866", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9690\u79c1\u4fdd\u62a4", "\u53ef\u5ba1\u8ba1\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05866v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Auditable Unlearning for LLMs", "tldr": "\u63d0\u51fa\u5927\u6a21\u578b\u9057\u5fd8\u7684\u53ef\u5ba1\u8ba1\u6307\u6807\u53ca\u4e24\u9636\u6bb5\u589e\u5f3a\u65b9\u6cd5\u3002\u5728\u4e09\u4e2a\u57fa\u51c6\u3001\u5341\u4e00\u79cd\u65b9\u6cd5\u4e0a\uff0c\u5ba1\u8ba1\u6027\u4e0e\u6cc4\u6f0f\u8fbe\u5230\u7406\u60f3\u53c2\u7167\u6c34\u5e73\uff0c\u9057\u5fd8\u6548\u679c\u6539\u5584\uff0c\u4f46\u4fdd\u7559\u80fd\u529b\u4ecd\u6709\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The introduction of generalist robot policies has enabled a single, large model to learn to perform a variety of tasks from a vast pre-training corpus. While these models often exhibit powerful zero-shot generalization capabilities, they typically require an adaptation phase to achieve sufficient performance in deployment. Iterated self-improvement via reinforcement learning (RL) has demonstrated promise in enabling this adaptation, yet such approaches have been largely explored in single-task settings - where the goal is to simply improve on a narrow deployment task - which lies in stark contrast to the multi-task capabilities of the base policy. In this work we ask whether generalist robot policies are capable of multi-task, generalist improvement in deployment - targeting many diverse tasks simultaneously - and what algorithmic recipe enables this. To answer this question, we first develop a set of structured evaluations to test generalist improvement capabilities, and systematically evaluate algorithmic and practical design choices regarding value estimation, policy extraction and resource allocation. We show that not only can generalist policies be improved online across diverse tasks, but that the right recipe can enable generalization and increase performance on tasks not considered during online training. We characterize when this generalization occurs and show that both the training task distribution and the use of value-based RL are critical. To the best of our knowledge, this is among the first evidence for online generalist improvement for robot foundation models.", "arxiv_id": "2611.06905", "arxiv_url": "https://arxiv.org/abs/2611.06905", "authors": ["Michal Korniak", "Marco Bagatella", "Ralf R\u00f6mer", "Michal Nauman", "Yarden As", "Pranav Vignesh", "Manan Agarwal", "Leander Diaz-Bone", "Piotr Zalewski", "Miko\u0142aj Czarnecki", "Lenart Treven", "Shashwat Saxena", "Sreyas Venkataraman", "Sarvesh Patil", "Zhiyuan Zhou", "Daniel Marta", "Oier Mees", "Nur Muhammad Mahi Shafiullah", "Carmelo Sferrazza", "Bhavya Sukhija", "Angela P. Schoellig", "Andreas Krause", "Max Simchowitz", "Andrew Wagenmaker"], "brief": "\u7814\u7a76\u901a\u8fc7\u7ed3\u6784\u5316\u8bc4\u4f30\u63a2\u7d22\u901a\u7528\u673a\u5668\u4eba\u7b56\u7565\u7684\u591a\u4efb\u52a1\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\uff0c\u53d1\u73b0\u4ef7\u503c\u9a71\u52a8\u65b9\u6cd5\u4e0e\u8bad\u7ec3\u4efb\u52a1\u5206\u5e03\u662f\u5173\u952e\uff0c\u65e2\u80fd\u63d0\u5347\u591a\u4efb\u52a1\u8868\u73b0\uff0c\u4e5f\u53ef\u6cdb\u5316\u81f3\u672a\u53c2\u4e0e\u8bad\u7ec3\u7684\u4efb\u52a1\u3002", "categories": ["cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06905", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u57fa\u7840\u6a21\u578b", "\u591a\u4efb\u52a1\u5b66\u4e60", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06905v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement", "tldr": "\u7814\u7a76\u901a\u8fc7\u7ed3\u6784\u5316\u8bc4\u4f30\u63a2\u7d22\u901a\u7528\u673a\u5668\u4eba\u7b56\u7565\u7684\u591a\u4efb\u52a1\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\uff0c\u53d1\u73b0\u4ef7\u503c\u9a71\u52a8\u65b9\u6cd5\u4e0e\u8bad\u7ec3\u4efb\u52a1\u5206\u5e03\u662f\u5173\u952e\uff0c\u65e2\u80fd\u63d0\u5347\u591a\u4efb\u52a1\u8868\u73b0\uff0c\u4e5f\u53ef\u6cdb\u5316\u81f3\u672a\u53c2\u4e0e\u8bad\u7ec3\u7684\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Gated-delta linear attention layers such as Gated DeltaNet (GDN), Kimi Delta Attention (KDA), and GDN-2 are tuned for GPUs, where small tensor-core tiles and fast vector registers make per-channel decay rescaling and sequential in-block solves cheap. On Google TPUs, which concentrate compute in wide $256 \\times 256$ systolic matrix units backed by a slower vector unit, porting these layers directly leaves half of each matrix tile empty and bottlenecks on vector operations. We present \\textbf{Systolic Linear Attention (SLA)}, which reshapes gated delta attention around the matrix unit by widening keys to $256$ with grouped value heads, grouping decay gates into four $64$-channel tiles, and computing the chunk solve entirely with block matrix products in a single fused kernel. On TPU v7x, a full \\texttt{SLA-R4} layer runs $1.6\\times$--$2.5\\times$ faster than the open-source Tokamax KDA kernel ($1.4\\times$--$2.4\\times$ with exact chunk inversion), driven primarily by head sharing and kernel fusion. Across a $2{,}048$-chip TPU v7x pre-training study of sparse Mixture-of-Experts (MoE) models from $6.5\\text{B}$ to $63.1\\text{B}$ parameters, SLA trains $11\\%$--$24\\%$ faster than KDA at similar perplexity, and reaches slightly lower perplexity than KDA in smaller matched-seed runs.", "arxiv_id": "2611.06828", "arxiv_url": "https://arxiv.org/abs/2611.06828", "authors": ["Gagik Amirkhanyan", "Nuojin Cheng"], "brief": "\u63d0\u51fa\u9762\u5411TPU\u7684\u7ebf\u6027\u6ce8\u610f\u529b\uff0c\u901a\u8fc7\u5206\u7ec4\u95e8\u63a7\u4e0e\u77e9\u9635\u8fd0\u7b97\u878d\u5408\u4f18\u5316\u786c\u4ef6\u5229\u7528\u7387\uff1b\u5c42\u8ba1\u7b97\u63d0\u901f1.6\u81f32.5\u500d\uff0c\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u63d0\u901f11%\u81f324%\uff0c\u56f0\u60d1\u5ea6\u76f8\u8fd1\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06828", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ebf\u6027\u6ce8\u610f\u529b", "\u786c\u4ef6\u534f\u540c\u8bbe\u8ba1", "\u8bad\u7ec3\u52a0\u901f", "\u6df7\u5408\u4e13\u5bb6\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06828v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Systolic Linear Attention: Co-Designing Tile-Grouped Gated Delta Attention for TPUs", "tldr": "\u63d0\u51fa\u9762\u5411TPU\u7684\u7ebf\u6027\u6ce8\u610f\u529b\uff0c\u901a\u8fc7\u5206\u7ec4\u95e8\u63a7\u4e0e\u77e9\u9635\u8fd0\u7b97\u878d\u5408\u4f18\u5316\u786c\u4ef6\u5229\u7528\u7387\uff1b\u5c42\u8ba1\u7b97\u63d0\u901f1.6\u81f32.5\u500d\uff0c\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u63d0\u901f11%\u81f324%\uff0c\u56f0\u60d1\u5ea6\u76f8\u8fd1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Proprietary language models exhibit strong reasoning and coding capabilities, but their output distributions are inaccessible, making fine-grained distillation methods that rely on teacher logits difficult to apply directly to black-box models. We observe that rich textual feedback from a black-box teacher can be treated as privileged information (PI) and converted, through a PI-conditioned privileged teacher, into dense supervision signals on the student\u0027s own trajectories. However, what PI should be acquired from the teacher to most effectively support student learning remains unclear. PI strategies that differ in where they focus, what information they request, and how much detail they provide can have substantially different effects on the current student, and their relative effectiveness can further change as training progresses. Based on this observation, we propose Evolving Privileged Information Strategies for Black-Box On-Policy Distillation (EvoOPD), which treats PI acquisition itself as an optimization problem and maintains a PI Strategy Bank that evolves with the student state. EvoOPD uses the measured repair utility of PI on the current student to adapt the focus, information type, and granularity of teacher feedback, allowing the acquired information to continually match the student\u0027s learning needs. We systematically evaluate EvoOPD on mathematical reasoning and code generation with Qwen3-1.7B, 4B, and 8B students. EvoOPD achieves the best overall performance in all six model-task settings, improving over the strongest baseline in each setting by an average of 2.14 percentage points in mathematics and 1.30 points in code. Further analysis shows that the relative effectiveness of PI acquisition strategies changes with student state, making a fixed strategy difficult to sustain as the best choice throughout distillation.", "arxiv_id": "2611.06542", "arxiv_url": "https://arxiv.org/abs/2611.06542", "authors": ["Ximo Zhu", "Ruiqi Liu", "Yi Han", "Zhengan Wu", "Gengsheng Li", "ZiAn Wang", "Zhu Yuantian", "Jin Jiang", "Wenhao Wang"], "brief": "EvoOPD\u968f\u5b66\u751f\u8bad\u7ec3\u72b6\u6001\u52a8\u6001\u4f18\u5316\u9ed1\u76d2\u6559\u5e08\u53cd\u9988\u7b56\u7565\uff0c\u5c06\u6587\u672c\u53cd\u9988\u8f6c\u4e3a\u7a20\u5bc6\u84b8\u998f\u76d1\u7763\uff1b\u516d\u7ec4\u5b9e\u9a8c\u5747\u9886\u5148\uff0c\u6570\u5b66\u4e0e\u4ee3\u7801\u5e73\u5747\u63d0\u53472.14\u548c1.30\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06542", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06542v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EvoOPD: Evolving Privileged Information Strategies for Black-Box On-Policy Distillation", "tldr": "EvoOPD\u968f\u5b66\u751f\u8bad\u7ec3\u72b6\u6001\u52a8\u6001\u4f18\u5316\u9ed1\u76d2\u6559\u5e08\u53cd\u9988\u7b56\u7565\uff0c\u5c06\u6587\u672c\u53cd\u9988\u8f6c\u4e3a\u7a20\u5bc6\u84b8\u998f\u76d1\u7763\uff1b\u516d\u7ec4\u5b9e\u9a8c\u5747\u9886\u5148\uff0c\u6570\u5b66\u4e0e\u4ee3\u7801\u5e73\u5747\u63d0\u53472.14\u548c1.30\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chain-of-Thought (CoT) reasoning substantially improves Large Language Models (LLMs), yet its out-of-distribution (OOD) generalization mechanism remains theoretically underexplored. We study CoT as compositional OOD generalization: the target task lacks complete reasoning trajectories or direct input-output pairs, while training provides only in-distribution (ID) atomic step data. We show that CoT generalizes by repeatedly applying a shared single-step predictor to compose reusable ID transitions. Theoretically, let $T$ denote the number of reasoning steps in the target task, $n$ the number of training samples per sub-task, and $k$ the number of output tokens per step; then the OOD task risk is controlled by the sum of the ID sub-task risks, scaled by a coefficient of order $\\mathcal{O}(k)$ that is independent of $T$, although the summed risk itself may still grow with $T$. A Rademacher-complexity analysis further shows that the estimation term is of order $\\mathcal{O}(\\sqrt{T/n})$, rather than linear in $T$, due to predictor sharing under a uniform capacity control on the shared class. For autoregressive Next-Token Prediction, the final-task risk is bounded by the best-in-class step-level risk scaled by the same coefficient of order $\\mathcal{O}(k)$, plus an estimation term of order $\\widetilde{\\mathcal{O}}\\big(k\\sqrt{T/n}\\big)$. A parity-coupled construction further shows that, for the sub-task empirical risk minimizer, the expected final-task risk is at least the best in-class risk plus $\u03a9(\\sqrt{T/n})$ when $T\\le n$. Experiments on Atom-Task and GSM8K support the theory: CoT enables short-to-long and compositional generalization, while explicit state tracking is crucial. Our code is available at https://github.com/maxliang114514/CoT-OOD.", "arxiv_id": "2611.06438", "arxiv_url": "https://arxiv.org/abs/2611.06438", "authors": ["Nuo-Jing Liang", "Xiao-Tong Yuan", "Pan Zhou"], "brief": "\u5c06\u601d\u7ef4\u94fe\u7684\u5206\u5e03\u5916\u6cdb\u5316\u89e3\u91ca\u4e3a\u5171\u4eab\u5355\u6b65\u9884\u6d4b\u5668\u7684\u7ec4\u5408\uff0c\u8bc1\u660e\u4f30\u8ba1\u8bef\u5dee\u968f\u6b65\u6570\u5448\u5e73\u65b9\u6839\u589e\u957f\uff1b\u5b9e\u9a8c\u652f\u6301\u77ed\u5230\u957f\u53ca\u7ec4\u5408\u6cdb\u5316\uff0c\u5e76\u51f8\u663e\u663e\u5f0f\u72b6\u6001\u8ddf\u8e2a\u7684\u91cd\u8981\u6027\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06438", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u601d\u7ef4\u94fe", "\u5206\u5e03\u5916\u6cdb\u5316", "\u6cdb\u5316\u7406\u8bba", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06438v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Understanding the Out-of-Distribution Generalization of Chain-of-Thought Reasoning in LLMs", "tldr": "\u5c06\u601d\u7ef4\u94fe\u7684\u5206\u5e03\u5916\u6cdb\u5316\u89e3\u91ca\u4e3a\u5171\u4eab\u5355\u6b65\u9884\u6d4b\u5668\u7684\u7ec4\u5408\uff0c\u8bc1\u660e\u4f30\u8ba1\u8bef\u5dee\u968f\u6b65\u6570\u5448\u5e73\u65b9\u6839\u589e\u957f\uff1b\u5b9e\u9a8c\u652f\u6301\u77ed\u5230\u957f\u53ca\u7ec4\u5408\u6cdb\u5316\uff0c\u5e76\u51f8\u663e\u663e\u5f0f\u72b6\u6001\u8ddf\u8e2a\u7684\u91cd\u8981\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When many inputs share a budget of repeated attempts by a large language model (LLM), a common rule gives harder inputs more. On public math, code and formal-proof samples, the best published difficulty-proportional rule captures half or more of the oracle gain on benchmarks the model mostly solves, but at most 13% on hard workloads, even given true pass rates. Because the value of one more attempt peaks at intermediate difficulty, the optimal static allocation is inverted-U and gives little to inputs that are hopeless at the current budget. In a strict survey of 221 LLM allocation papers, at least 13 give the hardest inputs the most attempts; their easier settings sit at budgets where this is near-optimal, so the cost appears on harder workloads. Acting on it requires knowing which inputs are solvable, so information, not the policy, drives the gain. With a verifier and a prior from a related model\u0027s past runs on the same inputs, Thompson Sampling raises the solved share on the hardest workload from 14% to 27%; without such a prior, no policy we tested beats round-robin. For the policies we tested, the gain vanishes between prior rank correlations of about 0.3 and 0.55, which cheap text-based priors barely reach on the weakest models, and it requires a verifier whose false acceptances are rare relative to the pass rate. On new Qwen2.5 samples the pattern holds, and tempering the prior avoids losses on easy workloads. We turn these results into a decision guide.", "arxiv_id": "2611.06372", "arxiv_url": "https://arxiv.org/abs/2611.06372", "authors": ["Jinhyung Bae"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u5e94\u4f18\u5148\u5206\u914d\u7ed9\u4e2d\u7b49\u96be\u5ea6\u8f93\u5165\uff0c\u6536\u76ca\u4e3b\u8981\u53d6\u51b3\u4e8e\u5148\u9a8c\u4fe1\u606f\u3002\u6709\u53ef\u9760\u5148\u9a8c\u4e0e\u9a8c\u8bc1\u5668\u65f6\uff0c\u6700\u96be\u4efb\u52a1\u89e3\u51b3\u7387\u4ece14%\u5347\u81f327%\uff0c\u65e0\u5148\u9a8c\u5219\u4e0d\u80dc\u8f6e\u8be2\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06372", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u8d44\u6e90\u5206\u914d", "\u5148\u9a8c\u4fe1\u606f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06372v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Give Up to Get More: Priors, Not Policies, Govern Test-Time Compute Allocation", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u5e94\u4f18\u5148\u5206\u914d\u7ed9\u4e2d\u7b49\u96be\u5ea6\u8f93\u5165\uff0c\u6536\u76ca\u4e3b\u8981\u53d6\u51b3\u4e8e\u5148\u9a8c\u4fe1\u606f\u3002\u6709\u53ef\u9760\u5148\u9a8c\u4e0e\u9a8c\u8bc1\u5668\u65f6\uff0c\u6700\u96be\u4efb\u52a1\u89e3\u51b3\u7387\u4ece14%\u5347\u81f327%\uff0c\u65e0\u5148\u9a8c\u5219\u4e0d\u80dc\u8f6e\u8be2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Decision models read a document and return a probability for each of a fixed set of options instead of generating text. Several appeared in 2026, but none has published results outside English. We describe Zuse, three decision models (4B, 9B and 27B) that train a low-rank adapter and a pointer head on frozen open-weight bases, targeting 27 European languages, and use them to study how this design behaves across languages and tasks. On a broad European suite of 11 sources excluded from training, covering 9 task groups and 27 languages, a development set that also guided model selection, the 27B model reaches 87.5% accuracy with a pooled expected calibration error of 0.016, and 0.035 when weighted per source. Post-hoc analyses of these single-seed results give three findings. First, miscalibration is structured by task rather than language: on parallel reading and topic items in 26 languages the confidence gap varies about as much as sampling noise, while across sources it spans -0.07 to +0.09, with knowledge tasks overconfident and acceptability judgements underconfident at all three sizes, so one fitted temperature cannot correct both. Second, the share of decisions that can be automated at a 5% error budget follows chance-corrected skill (Spearman 0.97 over 33 source and model pairs) more closely than raw accuracy (0.91). Third, reach beyond the training languages is set by the base model: across 210 languages, changing the training run moved scores by at most about 2 points within a size, while languages outside the base\u0027s documented list trail by 23 to 28 points at every size. On English public suites Zuse is behind Jev and Kev, including Kev models on the same bases. We also report two pitfalls in building multi-source training data: label-word collision between topic schemes, and an injection augmentation that taught a shortcut. Zuse can be tried at https://bineric.com/zuse.", "arxiv_id": "2611.06238", "arxiv_url": "https://arxiv.org/abs/2611.06238", "authors": ["Umair Mehmood Imam"], "brief": "Zuse\u5728\u51bb\u7ed3\u57fa\u5ea7\u4e0a\u8bad\u7ec3\u9002\u914d\u5668\u4e0e\u6307\u9488\u5934\uff0c\u4e3a27\u79cd\u6b27\u6d32\u8bed\u8a00\u8f93\u51fa\u9009\u9879\u6982\u7387\uff1b\u6700\u5927\u6a21\u578b\u5728\u5f00\u53d1\u96c6\u8fbe87.5%\u51c6\u786e\u7387\uff0c\u7f6e\u4fe1\u5ea6\u5931\u51c6\u4e3b\u8981\u968f\u4efb\u52a1\u800c\u975e\u8bed\u8a00\u53d8\u5316\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06238", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u5206\u7c7b", "\u6982\u7387\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06238v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Zuse: A Decision Model for European Languages", "tldr": "Zuse\u5728\u51bb\u7ed3\u57fa\u5ea7\u4e0a\u8bad\u7ec3\u9002\u914d\u5668\u4e0e\u6307\u9488\u5934\uff0c\u4e3a27\u79cd\u6b27\u6d32\u8bed\u8a00\u8f93\u51fa\u9009\u9879\u6982\u7387\uff1b\u6700\u5927\u6a21\u578b\u5728\u5f00\u53d1\u96c6\u8fbe87.5%\u51c6\u786e\u7387\uff0c\u7f6e\u4fe1\u5ea6\u5931\u51c6\u4e3b\u8981\u968f\u4efb\u52a1\u800c\u975e\u8bed\u8a00\u53d8\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal models have often scored below text-only baselines in the BabyLM Challenge (Klerings et al., 2024; Takmaz et al., 2025). We test whether additional recurrent computation helps close this gap. Recurrence increases computation by reusing layers without adding parameters or training data. Using a single implementation, we compare standard and looped Transformers under a 100M-word budget, with three seeds per main condition. Each image is represented by one feature vector from a frozen DINOv2 encoder, used as a prefix token. Caption words count toward the budget, so multimodal training also changes the language data. In a pre-registered text-only comparison, a 12-layer stack repeated four times exceeds a standard 48-layer Transformer by 5.4 BLiMP percentage points at matched inference compute. However, multimodal training lowers BLiMP accuracy by about 3.8 points in both architectures, with no clear mitigation from recurrence. An exploratory loop-side no-image control, trained with the multimodal language data and batching schedule, scores 5.7 points below the text-only baseline. Adding the visual prefix raises accuracy by 1.85 points on average, but this contrast is uncertain with three seeds. These results suggest that changes in language data and its presentation are a major source of the drop. Diagnostic tests show that the models use visual information; its contribution to grammatical generalization remains uncertain under this single-vector interface.", "arxiv_id": "2611.06206", "arxiv_url": "https://arxiv.org/abs/2611.06206", "authors": ["Daichi Hotta", "Yohei Kobashi", "Takeshi Kojima", "Yusuke Iwasawa", "Yutaka Matsuo"], "brief": "\u5728\u4f4e\u6570\u636e\u9884\u8bad\u7ec3\u4e2d\uff0c\u5faa\u73af\u590d\u7528\u5c42\u4f7f\u7eaf\u6587\u672c\u6a21\u578b\u8bed\u6cd5\u51c6\u786e\u7387\u63d0\u53475.4\u4e2a\u767e\u5206\u70b9\uff0c\u5374\u672a\u7f13\u89e3\u591a\u6a21\u6001\u9000\u5316\uff1b\u8bed\u8a00\u6570\u636e\u53ca\u5176\u5448\u73b0\u65b9\u5f0f\u53d8\u5316\u53ef\u80fd\u662f\u4e3b\u56e0\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06206", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5faa\u73af\u8ba1\u7b97", "\u591a\u6a21\u6001\u5b66\u4e60", "\u4f4e\u8d44\u6e90\u9884\u8bad\u7ec3", "\u8bed\u6cd5\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06206v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Loop Before You Leap: What Recurrent Depth Can and Cannot Buy in Data-Limited Pretraining", "tldr": "\u5728\u4f4e\u6570\u636e\u9884\u8bad\u7ec3\u4e2d\uff0c\u5faa\u73af\u590d\u7528\u5c42\u4f7f\u7eaf\u6587\u672c\u6a21\u578b\u8bed\u6cd5\u51c6\u786e\u7387\u63d0\u53475.4\u4e2a\u767e\u5206\u70b9\uff0c\u5374\u672a\u7f13\u89e3\u591a\u6a21\u6001\u9000\u5316\uff1b\u8bed\u8a00\u6570\u636e\u53ca\u5176\u5448\u73b0\u65b9\u5f0f\u53d8\u5316\u53ef\u80fd\u662f\u4e3b\u56e0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Latent Chain-of-Thought (CoT) reasoning improves efficiency by shifting intermediate computation into continuous hidden states. However, fully latent methods often struggle on precision-critical tasks such as mathematical reasoning, while existing hybrid approaches retain substantial token-generation overhead. We introduce VITAL, an importance-guided hybrid reasoning framework that selectively verbalizes informative tokens as reasoning anchors while keeping most computation latent. A lightweight gating head dynamically selects between explicit token generation and direct hidden-state feedback. VITAL constructs hybrid trajectories from explicit CoT using token- importance estimation and trains the model through curriculum-based supervised training, followed by reinforcement learning with a reward that balances correctness and conciseness. Experiments show that VITAL consistently out- performs existing fully latent reasoning methods, achieving relative average accuracy gains of 9.6% on GPT-2 and 5.1% on Llama-3.2-1B at comparable reasoning lengths. Compared with hybrid baselines, VITAL achieves higher reasoning accuracy with substantially shorter reasoning trajectories on Qwen3-1.7B.", "arxiv_id": "2611.06108", "arxiv_url": "https://arxiv.org/abs/2611.06108", "authors": ["Zhehao Zhou", "Tongrui Su", "Shengyu Zhu", "Da Li", "Zeyu Liu", "Jun Zhu", "Xueqi Cheng"], "brief": "VITAL\u7528\u8f7b\u91cf\u95e8\u63a7\u9009\u62e9\u5173\u952e\u63a8\u7406\u8bcd\u663e\u5f0f\u8f93\u51fa\uff0c\u5176\u4f59\u8ba1\u7b97\u7559\u5728\u9690\u72b6\u6001\uff1b\u76f8\u6bd4\u7eaf\u6f5c\u5728\u63a8\u7406\uff0c\u5e73\u5747\u51c6\u786e\u7387\u76f8\u5bf9\u63d0\u53475.1%\u81f39.6%\uff0c\u8f83\u6df7\u5408\u57fa\u7ebf\u63a8\u7406\u66f4\u77ed\u4e14\u66f4\u51c6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06108", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6f5c\u5728\u63a8\u7406", "\u601d\u7ef4\u94fe", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06108v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning When to Think Aloud in Latent Reasoning", "tldr": "VITAL\u7528\u8f7b\u91cf\u95e8\u63a7\u9009\u62e9\u5173\u952e\u63a8\u7406\u8bcd\u663e\u5f0f\u8f93\u51fa\uff0c\u5176\u4f59\u8ba1\u7b97\u7559\u5728\u9690\u72b6\u6001\uff1b\u76f8\u6bd4\u7eaf\u6f5c\u5728\u63a8\u7406\uff0c\u5e73\u5747\u51c6\u786e\u7387\u76f8\u5bf9\u63d0\u53475.1%\u81f39.6%\uff0c\u8f83\u6df7\u5408\u57fa\u7ebf\u63a8\u7406\u66f4\u77ed\u4e14\u66f4\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Attention is central to modern AI models for language, vision, and scientific modeling. However, direct evaluation compares every query with every key, requiring quadratic time in the context length, which limits its scalability to long contexts. Consequently, characterizing the complexity bounds of attention is of fundamental importance. For every fixed dimension $d$, we give an algorithm for $m$ queries, $n$ key-value pairs, and additive error $\\varepsilon$, with expected time $ \\widetilde{\\mathrm{O}}\\bigl((mn)^{k/(k+1)}+m+n\\bigr),\\qquad k=\\lfloor d/2\\rfloor. $ For fixed dimension and a fixed number of value channels, soft-O hides factors of the form $\\operatorname{poly}_d\\bigl(b,\\log(m+n),\\log B,\\log(1/\\varepsilon)\\bigr),$ where $b$ bounds input encoding lengths and $B$ bounds coordinate and value magnitudes. In particular, the dependence on $B$ and $1/\\varepsilon$ is polylogarithmic, which allows arbitrary positive temperature. When $m=n$ and $d\\ge2$, the bound is $\\widetilde{\\mathrm{O}}(n^{2-2/(\\lfloor d/2\\rfloor+1)})$: near-linear in dimensions two and three, with exponent $4/3$ in dimensions four and five and $3/2$ in dimensions six and seven. It improves the previous $\\widetilde{\\mathrm{O}}(n^{2-1/d})$ upper bound and matches the best known batch maximum-inner-product bound in each fixed dimension. Additionally, we reduce integer batch maximum inner product computation to one attention call with the same dimension and input sizes $m,n$.", "arxiv_id": "2611.06055", "arxiv_url": "https://arxiv.org/abs/2611.06055", "authors": ["Zixuan Huang", "Guozhang Chen"], "brief": "\u63d0\u51fa\u56fa\u5b9a\u7ef4\u5ea6\u3001\u4efb\u610f\u6b63\u6e29\u5ea6\u4e0b\u7684\u8fd1\u4f3c\u6ce8\u610f\u529b\u7b97\u6cd5\uff0c\u6539\u8fdb\u65f6\u95f4\u4e0a\u754c\u5e76\u5339\u914d\u5df2\u77e5\u6700\u4f73\u6279\u91cf\u6700\u5927\u5185\u79ef\u754c\uff1b\u4e8c\u7ef4\u548c\u4e09\u7ef4\u53ef\u8fbe\u8fd1\u7ebf\u6027\u65f6\u95f4\u3002", "categories": ["cs.DS", "cs.CC", "cs.CG", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06055", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u7b97\u6cd5\u590d\u6742\u5ea6", "\u8ba1\u7b97\u51e0\u4f55", "\u8fd1\u4f3c\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06055v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Softmax Attention with Any Temperature in Fixed Dimension: Matching the Best Known Maximum-Inner-Product Bounds", "tldr": "\u63d0\u51fa\u56fa\u5b9a\u7ef4\u5ea6\u3001\u4efb\u610f\u6b63\u6e29\u5ea6\u4e0b\u7684\u8fd1\u4f3c\u6ce8\u610f\u529b\u7b97\u6cd5\uff0c\u6539\u8fdb\u65f6\u95f4\u4e0a\u754c\u5e76\u5339\u914d\u5df2\u77e5\u6700\u4f73\u6279\u91cf\u6700\u5927\u5185\u79ef\u754c\uff1b\u4e8c\u7ef4\u548c\u4e09\u7ef4\u53ef\u8fbe\u8fd1\u7ebf\u6027\u65f6\u95f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Activation steering can modify language-model behavior without parameter updates, but behavioral efficacy alone does not determine whether an intervention is usable. Contrastive Activation Addition (CAA) steers targeted behaviors using activation directions derived from contrasting examples, potentially degrading unrelated model capabilities in the process. We therefore study CAA through a behavior-capability frontier, selecting interventions that maximize behavioral gain subject to an explicit bound on capability degradation. We evaluate this framework across four instruction-tuned models, seven behaviors, and capability-loss budgets of 1%, 3%, and 5% (absolute percentage points). Validation-selected behavioral effects generalize strongly to held-out data ($\u03c1= 0.945$), while joint behavior-capability survival among nonzero operating points rises from 37.5% at the 1% budget to 72.7% at 3%, with limited additional improvement at 5%. Control experiments indicate that these effects depend on learned behavior directions rather than generic activation perturbations. Representational geometry is significantly but only modestly predictive of causal cross-behavior transfer. Finally, secondary capability, out-of-distribution, and open-ended evaluations show that interventions satisfying protected benchmarks can still degrade untested capabilities or transfer unevenly to free-form generation. These results characterize activation steering as a constrained intervention whose usable range depends on model, behavior, direction, layer, and evaluation budget, rather than a universal control knob.", "arxiv_id": "2611.06001", "arxiv_url": "https://arxiv.org/abs/2611.06001", "authors": ["Deepanshu Raj"], "brief": "\u7814\u7a76\u4ee5\u80fd\u529b\u635f\u5931\u9884\u7b97\u7ea6\u675fCAA\u6fc0\u6d3b\u5f15\u5bfc\uff0c\u523b\u753b\u884c\u4e3a\u589e\u76ca\u4e0e\u80fd\u529b\u7684\u6743\u8861\uff1b\u6548\u679c\u53ef\u6cdb\u5316\uff0c\u4f46\u53ef\u7528\u8303\u56f4\u4f9d\u6a21\u578b\u548c\u884c\u4e3a\u800c\u53d8\uff0c\u4e14\u4ecd\u53ef\u80fd\u635f\u4f24\u672a\u6d4b\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06001", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6fc0\u6d3b\u5f15\u5bfc", "\u8bed\u8a00\u6a21\u578b", "\u80fd\u529b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06001v1", "published_at": "2026-11-04", "score":
