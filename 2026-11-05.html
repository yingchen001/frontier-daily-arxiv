 0.0, "selected_reasons": [], "thumbnail": null, "title": "How Far Can You Steer? Behavior-Capability Frontiers in Contrastive Activation Addition", "tldr": "\u7814\u7a76\u4ee5\u80fd\u529b\u635f\u5931\u9884\u7b97\u7ea6\u675fCAA\u6fc0\u6d3b\u5f15\u5bfc\uff0c\u523b\u753b\u884c\u4e3a\u589e\u76ca\u4e0e\u80fd\u529b\u7684\u6743\u8861\uff1b\u6548\u679c\u53ef\u6cdb\u5316\uff0c\u4f46\u53ef\u7528\u8303\u56f4\u4f9d\u6a21\u578b\u548c\u884c\u4e3a\u800c\u53d8\uff0c\u4e14\u4ecd\u53ef\u80fd\u635f\u4f24\u672a\u6d4b\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce LongBanana, to our knowledge the first expert-designed and expert-verified benchmark for long-context multi-reference image synthesis in the age of agent-driven image generation. The task requires retrieving dispersed visual evidence, rejecting distractors, binding entities and relations, and composing one coherent final image from multiple references. LongBanana contains 90 carefully designed tasks organized by a 3-by-3 taxonomy; each task includes about 32 reference images, 20 constraints, and 50 evaluation items, yielding 4,670 expert-specified atomic evaluation items in total. Its graph-grounded evaluation design instantiates each task with reference images and an entity-relation graph, then converts node, edge, and whole-graph obligations into checklist items for Content Fidelity, Relational Binding, and Global Constraint Satisfaction. Reviewed expert labels include a 15% double-labeled subset with 89.4% exact agreement and 0.83 quadratic weighted kappa. We further introduce LongBanana-Gen, an agent-harness framework for long-horizon image generation; experiments show that minimal agent harnesses improve over direct generation, while a ReAct-Plan-Exec-Reflect (RPR) workflow yields harness-dependent gains by strengthening evidence grounding and repair. Together, LongBanana provides an auditable testbed for measuring dense visual evidence use and a shared target for developing stronger agent-driven image-generation systems. Code and data are available at the project page: https://long-banana.com/.", "arxiv_id": "2611.06856", "arxiv_url": "https://arxiv.org/abs/2611.06856", "authors": ["Haoxiang Cao", "Yuxuan Zhang", "Penghui Du", "Bo Li", "Jiajiong Cao", "Yingying Fan", "Zimeng Wu", "Yifu Luo", "Mingzhe Zheng", "Junwen Miao", "Huaisong Zhang", "Yang Yao", "Yu Wang", "Dongfu Jiang", "Ping Nie", "Wenhu Chen", "Chaoqun Wang", "Changqian Yu", "Kelsey R. Allen"], "brief": "\u63d0\u51fa\u4e13\u5bb6\u9a8c\u8bc1\u7684\u957f\u4e0a\u4e0b\u6587\u591a\u53c2\u8003\u56fe\u50cf\u5408\u6210\u57fa\u51c6\uff0c\u4ee5\u5b9e\u4f53\u5173\u7cfb\u56fe\u8bc4\u4f30\u8bc1\u636e\u5229\u7528\u4e0e\u7ea6\u675f\u6ee1\u8db3\uff1b\u5b9e\u9a8c\u663e\u793a\u667a\u80fd\u4f53\u6846\u67b6\u4f18\u4e8e\u76f4\u63a5\u751f\u6210\uff0c\u89c4\u5212\u53cd\u601d\u6d41\u7a0b\u7684\u589e\u76ca\u4f9d\u8d56\u6846\u67b6\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06856", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u957f\u4e0a\u4e0b\u6587", "\u8bc4\u6d4b\u57fa\u51c6", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06856v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LongBanana: An Expert-Verified Benchmark for Long-Context Multi-Reference Image Synthesis", "tldr": "\u63d0\u51fa\u4e13\u5bb6\u9a8c\u8bc1\u7684\u957f\u4e0a\u4e0b\u6587\u591a\u53c2\u8003\u56fe\u50cf\u5408\u6210\u57fa\u51c6\uff0c\u4ee5\u5b9e\u4f53\u5173\u7cfb\u56fe\u8bc4\u4f30\u8bc1\u636e\u5229\u7528\u4e0e\u7ea6\u675f\u6ee1\u8db3\uff1b\u5b9e\u9a8c\u663e\u793a\u667a\u80fd\u4f53\u6846\u67b6\u4f18\u4e8e\u76f4\u63a5\u751f\u6210\uff0c\u89c4\u5212\u53cd\u601d\u6d41\u7a0b\u7684\u589e\u76ca\u4f9d\u8d56\u6846\u67b6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Looped Transformers increase effective depth by re-executing shared layers, but three limitations hinder their adoption: memory grows with the loop count, compute can only be adjusted in whole-block steps, and the loop count is hard to change after training. We propose LooM (Loop-invariant Memory), which addresses each in turn. In a causal encoder-decoder (CED), LooM loops only the decoder layers after the first, which read a global memory written once per token, and each of them publishes the key-value (KV) entry for a token only on its first visit, so the cache does not grow with the loop count. These layers loop independently, providing every budget from 3 to 21 layer executions per token, and one model trained on randomly sampled budgets covers all of them without a router. With enough loops, LooM outperforms a single-pass baseline trained on the same data on language modeling, zero-shot accuracy and long-context perplexity, while using the same cache size. Our analysis further shows that the training budget distribution decides what extra depth buys. These results suggest that a CED is a natural place to loop: memory is written once, and depth becomes a budget chosen at deployment.", "arxiv_id": "2611.06835", "arxiv_url": "https://arxiv.org/abs/2611.06835", "authors": ["Lele Yang", "Muxi Diao", "Zhonghao Yan", "Jiankang Chen", "Bin Wen", "Tingting Gao", "Wentao Zhang", "Kongming Liang", "Zhanyu Ma", "Weiran Xu"], "brief": "LooM\u901a\u8fc7\u53ea\u5199\u4e00\u6b21\u7684\u5168\u5c40\u8bb0\u5fc6\u4e0e\u72ec\u7acb\u5c42\u5faa\u73af\uff0c\u4f7f\u63a8\u7406\u6df1\u5ea6\u53ef\u6309\u9884\u7b97\u8c03\u6574\u4e14\u7f13\u5b58\u4e0d\u968f\u5faa\u73af\u589e\u957f\uff1b\u5145\u8db3\u5faa\u73af\u4e0b\uff0c\u8bed\u8a00\u5efa\u6a21\u3001\u96f6\u6837\u672c\u548c\u957f\u4e0a\u4e0b\u6587\u8868\u73b0\u4f18\u4e8e\u5355\u904d\u57fa\u7ebf\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06835", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5faa\u73afTransformer", "\u8bed\u8a00\u6a21\u578b", "\u7f13\u5b58\u4f18\u5316", "\u63a8\u7406\u9884\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06835v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LooM: Loop-Invariant Memory for Causal Encoder-Decoder Language Models", "tldr": "LooM\u901a\u8fc7\u53ea\u5199\u4e00\u6b21\u7684\u5168\u5c40\u8bb0\u5fc6\u4e0e\u72ec\u7acb\u5c42\u5faa\u73af\uff0c\u4f7f\u63a8\u7406\u6df1\u5ea6\u53ef\u6309\u9884\u7b97\u8c03\u6574\u4e14\u7f13\u5b58\u4e0d\u968f\u5faa\u73af\u589e\u957f\uff1b\u5145\u8db3\u5faa\u73af\u4e0b\uff0c\u8bed\u8a00\u5efa\u6a21\u3001\u96f6\u6837\u672c\u548c\u957f\u4e0a\u4e0b\u6587\u8868\u73b0\u4f18\u4e8e\u5355\u904d\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-term problem-solving processes, such as scientific research and software development, proceed along an evolving trial-and-error trajectory toward a central goal. We term these \\textit{exploration tasks}, which require models to remember not only facts but also how solutions are tested against intermediate outcomes and early attempts are continually revised or revived. However, existing long-term memory research focuses on factual recall and updates, overlooking the interconnected nature of exploration. We observe that exploration processes naturally form graphs, with branching approaches linked by revisions and reconsiderations. Motivated by this, we propose \\textsc{LExMem}, a graph-guided benchmark designed to evaluate \\underline{\\textsc{Mem}}ory in \\underline{\\textsc{L}}ong-term \\underline{\\textsc{Ex}}ploration tasks. We model exploration processes as graphs and introduce an evolutionary mechanism to increase their structural complexity, yielding 224 dialogues and 2,018 question-answer instances derived from graph structures. Building on the same insight, we propose \\textsc{LExGraph}, a graph-based memory framework that incrementally organizes dialogues into interconnected memory nodes and retrieves evidence through hybrid retrieval and neighbor expansion. Extensive experiments demonstrate that \\textsc{LExMem} poses a significant challenge to existing retrieval- and memory-based systems, whereas \\textsc{LExGraph} achieves superior performance and generalizes effectively to external benchmarks. Codes and datasets are available at https://github.com/mbzuai-nlp/LExMem.", "arxiv_id": "2611.06414", "arxiv_url": "https://arxiv.org/abs/2611.06414", "authors": ["Chongyuan Dai", "Yaling Shen", "Zirui Song", "Junfeng Liao", "Jinpeng Hu", "Xiuying Chen"], "brief": "\u63d0\u51fa\u56fe\u5f15\u5bfc\u7684\u957f\u671f\u63a2\u7d22\u8bb0\u5fc6\u57fa\u51c6\u4e0e\u6846\u67b6\uff0c\u523b\u753b\u8bd5\u9519\u3001\u4fee\u8ba2\u53ca\u65e7\u65b9\u6848\u91cd\u542f\u7684\u5173\u8054\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u7cfb\u7edf\u8868\u73b0\u53d7\u9650\uff0c\u56fe\u8bb0\u5fc6\u6846\u67b6\u66f4\u4f18\u4e14\u80fd\u6cdb\u5316\u81f3\u5916\u90e8\u57fa\u51c6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06414", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u957f\u671f\u8bb0\u5fc6", "\u56fe\u7ed3\u6784", "\u68c0\u7d22\u589e\u5f3a", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06414v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Twists and Turns: A Graph-Based Benchmark and Framework for Long-Term Memory in Exploration Tasks", "tldr": "\u63d0\u51fa\u56fe\u5f15\u5bfc\u7684\u957f\u671f\u63a2\u7d22\u8bb0\u5fc6\u57fa\u51c6\u4e0e\u6846\u67b6\uff0c\u523b\u753b\u8bd5\u9519\u3001\u4fee\u8ba2\u53ca\u65e7\u65b9\u6848\u91cd\u542f\u7684\u5173\u8054\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u7cfb\u7edf\u8868\u73b0\u53d7\u9650\uff0c\u56fe\u8bb0\u5fc6\u6846\u67b6\u66f4\u4f18\u4e14\u80fd\u6cdb\u5316\u81f3\u5916\u90e8\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The full-attention layers of large language models (LLMs) make every generated token more expensive than the previous one, slowing models down on long-context tasks. Hybrid models reduce this cost by replacing most full-attention layers with linear-attention layers, but the first still dominate decoding at long contexts. We accelerate these remaining layers without any training or weight changes using combined sparse attention: each layer attends to a sliding window of recent tokens, a pinned prefix, and a fixed budget of most relevant tokens in the context. The window size and budget are found on a per-layer basis using a multi-objective search algorithm. Across six hybrid models from three families, from 4B to 397B parameters, the selected configurations preserve their baseline model\u0027s accuracy on 21 long-context datasets. Decoding 64k/256k tokens becomes up to 1.26x/2.22x faster on Qwen3.5-4B, 1.20x/2.23x on Qwen3.5-122B-A10B, and 1.16x/2.06x on Ornith-1.0-397B.", "arxiv_id": "2611.06133", "arxiv_url": "https://arxiv.org/abs/2611.06133", "authors": ["Jo\u00e3o Eduardo Batista", "Emil Vatai", "Mohamed Wahib"], "brief": "\u65e0\u9700\u91cd\u8bad\uff0c\u901a\u8fc7\u9010\u5c42\u4f18\u5316\u6df7\u5408\u7a00\u758f\u6ce8\u610f\u529b\u52a0\u901f\u6df7\u5408\u5927\u6a21\u578b\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\uff1b\u516d\u4e2a\u6a21\u578b\u572821\u4e2a\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u539f\u6709\u7cbe\u5ea6\uff0c\u6700\u9ad8\u52a0\u901f2.23\u500d\u3002", "categories": ["cs.CL", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06133", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7a00\u758f\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06133v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Accelerating Long-Context Decoding in Large-Scale Hybrid LLMs Without Retraining", "tldr": "\u65e0\u9700\u91cd\u8bad\uff0c\u901a\u8fc7\u9010\u5c42\u4f18\u5316\u6df7\u5408\u7a00\u758f\u6ce8\u610f\u529b\u52a0\u901f\u6df7\u5408\u5927\u6a21\u578b\u957f\u4e0a\u4e0b\u6587\u89e3\u7801\uff1b\u516d\u4e2a\u6a21\u578b\u572821\u4e2a\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u539f\u6709\u7cbe\u5ea6\uff0c\u6700\u9ad8\u52a0\u901f2.23\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Professionals have long used software built for them by others. This article reports the growth of a professional computer-assisted interpreting (CAI) tool built by its own user, a conference interpreter without programming training. Drawing on an eight-week version-controlled record with telemetry from 133 logged sessions and over 20,000 recognized utterances, the article traces how real conference work drove the tool through 62 commits and six versions. The record shows capabilities deployed on the day their need appeared and one strategy change that cut median end-to-end delay by over a third within one afternoon. The article then proposes the paradigm of practice-grown tools, defined by the shift from using to growing, the co-evolution of tool and practice through breakdown and repair, bounded local computation, and an assessment corollary, and it formulates three propositions toward tool-inclusive assessment of practitioners, from tool-making literacy to a compute-standardized format for certifying what they and their tools achieve together.", "arxiv_id": "2611.06132", "arxiv_url": "https://arxiv.org/abs/2611.06132", "authors": ["Zeming Zhao"], "brief": "\u8ffd\u8e2a\u65e0\u7f16\u7a0b\u80cc\u666f\u8bd1\u5458\u5728\u516b\u5468\u5185\u8fed\u4ee3\u81ea\u5efaAI\u53e3\u8bd1\u5de5\u5177\u7684\u8fc7\u7a0b\uff0c\u4e00\u6b21\u7b56\u7565\u8c03\u6574\u4f7f\u4e2d\u4f4d\u5ef6\u8fdf\u964d\u4f4e\u903e\u4e09\u5206\u4e4b\u4e00\uff0c\u5e76\u63d0\u51fa\u5de5\u5177\u968f\u5b9e\u8df5\u751f\u957f\u53ca\u4eba\u673a\u8054\u5408\u80fd\u529b\u8bc4\u4f30\u8303\u5f0f\u3002", "categories": ["cs.HC", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06132", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u673a\u4ea4\u4e92", "\u5de5\u5177\u5f00\u53d1", "\u8ba1\u7b97\u673a\u8f85\u52a9\u53e3\u8bd1", "\u80fd\u529b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06132v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Growing One\u0027s AI Tools: A Paradigm of Practice-Grown Tools", "tldr": "\u8ffd\u8e2a\u65e0\u7f16\u7a0b\u80cc\u666f\u8bd1\u5458\u5728\u516b\u5468\u5185\u8fed\u4ee3\u81ea\u5efaAI\u53e3\u8bd1\u5de5\u5177\u7684\u8fc7\u7a0b\uff0c\u4e00\u6b21\u7b56\u7565\u8c03\u6574\u4f7f\u4e2d\u4f4d\u5ef6\u8fdf\u964d\u4f4e\u903e\u4e09\u5206\u4e4b\u4e00\uff0c\u5e76\u63d0\u51fa\u5de5\u5177\u968f\u5b9e\u8df5\u751f\u957f\u53ca\u4eba\u673a\u8054\u5408\u80fd\u529b\u8bc4\u4f30\u8303\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hyper-Connections (HC) architectures are increasingly adopted in frontier language models, yet their components remain insufficiently understood and introduce non-negligible training overhead. In this work, we systematically study the HC architecture to understand its components and identify simpler, more efficient designs. We find that learned read/write gating without mixing and unconstrained mixing with fixed gates form two effective interaction groups: either alone achieves performance comparable to mHC. We also identify repeated access to the expanded residual state as a major source of training overhead, even without mixing. These findings lead to SimpleHC, which simplifies the architecture by removing residual mixing and simplifies execution through shared memory access, using the resulting additive structure and shared gate inputs. Layer-specific gates share a group-entry state, enabling batched reads and deferred writes; scalar corrections exactly preserve preceding sublayer output contributions. Our analyses support both the retained residual structure and the design of shared memory access. SimpleHC incurs only 2.4% extra end-to-end training time over a vanilla residual baseline at the largest tested scale. It maintains performance comparable to mHC when scaling from 15B to 30B MoE models, exhibits smoother gradient dynamics during standard training, and remains stable under stress. We hope SimpleHC will encourage a broader pursuit of simplicity in foundation model design, making performance gains more accessible and practical at scale.", "arxiv_id": "2611.05984", "arxiv_url": "https://arxiv.org/abs/2611.05984", "authors": ["Xiangdong Zhang", "Xiaohan Qin", "Sunan Zou", "Tuo Dai", "Bizhao Shi", "Zhuo Xia", "Yebin Yang", "Yizhou Chen", "Yuliang Liu", "Yu Cheng", "Junchi Yan"], "brief": "\u63d0\u51faSimpleHC\uff0c\u79fb\u9664\u6b8b\u5dee\u6df7\u5408\u5e76\u5171\u4eab\u5185\u5b58\u8bbf\u95ee\uff1b\u5728150\u4ebf\u81f3300\u4ebf\u53c2\u6570MoE\u6a21\u578b\u4e0a\u6027\u80fd\u5ab2\u7f8emHC\uff0c\u8bad\u7ec3\u989d\u5916\u8017\u65f6\u4ec52.4%\uff0c\u68af\u5ea6\u66f4\u5e73\u7a33\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.05984", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u67b6\u6784", "\u8bad\u7ec3\u6548\u7387", "\u8bad\u7ec3\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05984v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On the Design of Hyper-Connections: Simplification, Stability, and Scalability", "tldr": "\u63d0\u51faSimpleHC\uff0c\u79fb\u9664\u6b8b\u5dee\u6df7\u5408\u5e76\u5171\u4eab\u5185\u5b58\u8bbf\u95ee\uff1b\u5728150\u4ebf\u81f3300\u4ebf\u53c2\u6570MoE\u6a21\u578b\u4e0a\u6027\u80fd\u5ab2\u7f8emHC\uff0c\u8bad\u7ec3\u989d\u5916\u8017\u65f6\u4ec52.4%\uff0c\u68af\u5ea6\u66f4\u5e73\u7a33\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autoregressive image generation has recently emerged as a competitive visual generation paradigm, yet its generation order is often predefined or heuristic, such as next-patch prediction, random-order prediction, or one-step generation for specific scales. We observe that these strategies can cause models to overlook important structural dependencies in images, thereby limiting both structural robustness and reasoning capability. In this work, we propose a context-aware autoregressive generation framework, where the model dynamically determines the next token location based on global context and current local information. Rather than following a fixed or random order, our method allows the generation process to adapt to image structure and semantic dependencies. Extensive experiments show that context-aware generation significantly improves structural robustness across different image AR paradigms, including masked autoregressive and scale-wise autoregressive models. Beyond quantitative improvements, we further observe emerging reasoning properties: the model can better understand complex semantic instructions and generate images that more faithfully follow the given guidance. These findings suggest that generation order is a critical yet underexplored factor in image autoregressive modeling, and that context-aware decoding can unlock stronger reasoning-aware visual generation capabilities. Code is available at https://github.com/Hpesojyjx/Saccades-AR.", "arxiv_id": "2611.06838", "arxiv_url": "https://arxiv.org/abs/2611.06838", "authors": ["Jixuan Ying", "Haoyu Liu", "Timing Yang", "Tingyu Zhu", "Predrag Neskovic", "Anand Bhattad", "Cihang Xie", "Zeyu Zheng", "Alan Yuille", "Feng Wang"], "brief": "\u63d0\u51fa\u4e0a\u4e0b\u6587\u611f\u77e5\u7684\u81ea\u56de\u5f52\u56fe\u50cf\u751f\u6210\u6846\u67b6\uff0c\u52a8\u6001\u9009\u62e9\u4e0b\u4e00\u751f\u6210\u4f4d\u7f6e\uff1b\u5b9e\u9a8c\u663e\u793a\u53ef\u63d0\u5347\u591a\u7c7b\u6a21\u578b\u7684\u7ed3\u6784\u9c81\u68d2\u6027\uff0c\u5e76\u66f4\u51c6\u786e\u9075\u5faa\u590d\u6742\u8bed\u4e49\u6307\u4ee4\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06838", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u81ea\u56de\u5f52\u6a21\u578b", "\u4e0a\u4e0b\u6587\u611f\u77e5", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06838v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Context-Aware Autoregressive Image Generation for Emerging Reasoning Properties", "tldr": "\u63d0\u51fa\u4e0a\u4e0b\u6587\u611f\u77e5\u7684\u81ea\u56de\u5f52\u56fe\u50cf\u751f\u6210\u6846\u67b6\uff0c\u52a8\u6001\u9009\u62e9\u4e0b\u4e00\u751f\u6210\u4f4d\u7f6e\uff1b\u5b9e\u9a8c\u663e\u793a\u53ef\u63d0\u5347\u591a\u7c7b\u6a21\u578b\u7684\u7ed3\u6784\u9c81\u68d2\u6027\uff0c\u5e76\u66f4\u51c6\u786e\u9075\u5faa\u590d\u6742\u8bed\u4e49\u6307\u4ee4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Egocentric human video offers a scalable source of manipulation priors for robot learning, yet translating raw data scale into generalizable robot policies demands rigorous data curation and training recipes. We introduce Open-HumanScale, the first fully open recipe for scaling egocentric pretraining to 50,000 hours, anchored by Open-HumanScale-50K---a curated egocentric video corpus densely annotated with hand motion and natural language. Leveraging this corpus, we systematically investigate pure human pretraining via closed-loop simulation evaluations and uncover an empirical log-linear scaling law linking pretraining data hours to downstream robot success rates. Grounded in these findings, we develop HumanWAM-Vanilla, a world--action model pretrained exclusively on 50k hours of egocentric human video. Upon robot post-training, HumanWAM-Vanilla reaches 92.08% success on RoboTwin 2.0 Clean2Clean and 68.88% on Clean2Random, alongside a 14.17% mean success rate and a 19.00 mean progress score on RoboDojo. To push the capability frontier further, we explore joint human--robot pretraining with HumanWAM-Goal, a visual-goal-conditioned world--action model. Hybrid data scaling unlocks broad zero-shot generalization across both simulation and physical benchmarks, propelling post-trained RoboTwin 2.0 performance to new state-of-the-art levels: 92.70% on Clean2Clean and a substantial leap to 84.60% on Clean2Random. On physical robots, HumanWAM-Goal further exhibits emergent embodied in-context learning, dynamically adapting its manipulation behavior to unseen visual goals without parameter updates. To support reproducible scaling research in embodied AI, we open-source the Open-HumanScale-50K corpus, data curation and pretraining pipelines, alongside the pretrained and post-trained HumanWAM checkpoints, inference code, and simulation evaluation suites.", "arxiv_id": "2611.06817", "arxiv_url": "https://arxiv.org/abs/2611.06817", "authors": ["Juncheng Ma", "Jiaxin Li", "Jiankai Tu", "Bo Liang", "Guodong Lv", "Yufan Deng", "Junzhe Tang", "Liangzhu Yang", "Chen Bian", "Zicong Cao", "Baohao Zhu", "Jianxin Bi", "Tengfei Yan", "Yinyuan Zhang", "Kewei Zhang", "Xinglong Chen", "Kaiqi Chen", "Duomin Wang", "Xiaotian Tang", "Liang Tan", "Li Li", "Yuan Xu", "Haosen Yang", "Yuqi Wang", "Jingfei Xia", "Songyan Huang", "Zhiyang Dou", "Zhen Dong", "Enze Xie", "Tat-Seng Chua", "Daquan Zhou"], "brief": "\u5f00\u6e905\u4e07\u5c0f\u65f6\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u89c6\u9891\u53ca\u8bad\u7ec3\u6d41\u7a0b\uff0c\u53d1\u73b0\u6570\u636e\u89c4\u6a21\u4e0e\u673a\u5668\u4eba\u6210\u529f\u7387\u7684\u5bf9\u6570\u7ebf\u6027\u5173\u7cfb\uff1b\u4eba\u673a\u8054\u5408\u9884\u8bad\u7ec3\u5237\u65b0\u4eff\u771f\u6210\u7ee9\uff0c\u5e76\u5b9e\u73b0\u771f\u673a\u514d\u8c03\u53c2\u9002\u5e94\u65b0\u76ee\u6807\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06817", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u5b66\u4e60", "\u9884\u8bad\u7ec3", "\u6570\u636e\u6269\u5c55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06817v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Open-HumanScale: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models", "tldr": "\u5f00\u6e905\u4e07\u5c0f\u65f6\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u89c6\u9891\u53ca\u8bad\u7ec3\u6d41\u7a0b\uff0c\u53d1\u73b0\u6570\u636e\u89c4\u6a21\u4e0e\u673a\u5668\u4eba\u6210\u529f\u7387\u7684\u5bf9\u6570\u7ebf\u6027\u5173\u7cfb\uff1b\u4eba\u673a\u8054\u5408\u9884\u8bad\u7ec3\u5237\u65b0\u4eff\u771f\u6210\u7ee9\uff0c\u5e76\u5b9e\u73b0\u771f\u673a\u514d\u8c03\u53c2\u9002\u5e94\u65b0\u76ee\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Closed-loop driving benchmarks in CARLA rank agents by a driving score that multiplies route completion by an infraction penalty. This score does not distinguish an agent that stops in front of an obstacle from one that pushes past it. In a corridor closed by two parked cars, for example, one agent that drives through with contact averages 52.2 on the blocked widths, while the agents that stop average between 37.8 and 40.6. We propose failure-boundary profiles, an evaluation in which each scenario family varies one measured factor, such as corridor width or the time gap in oncoming traffic, and each variant is certified from measurement as one where the agent should proceed or one where it should stop. Along this axis we estimate two curves per agent, commitment (the probability of attempting the passage) and competence (the probability of passing without contact), and locate where each crosses one half, with intervals that account for the simulator\u0027s run-to-run variance. The certified labels also give a summary metric, decision accuracy, which credits clean passes on passable variants and stops on blocked ones. We evaluate seven driving agents on seven CARLA families. The rule-based expert reaches a decision accuracy of 0.74 and TFv6, the highest-scoring learned agent, 0.60. Agents with similar driving scores fail in different ways, and agents that reliably stop at a blocked corridor still rarely wait for a gap in oncoming traffic. We also apply the method, unchanged, to a warehouse robot in Isaac Sim. The navigation policy we test stops at blocked gaps in only one of three families, and two fine-tuned versions of it pass more gaps cleanly but no longer stop at all.", "arxiv_id": "2611.06453", "arxiv_url": "https://arxiv.org/abs/2611.06453", "authors": ["Milan Bulat", "Gino Ardelean", "Ellington Kirby"], "brief": "\u63d0\u51fa\u5931\u8d25\u8fb9\u754c\u8bc4\u4f30\uff0c\u533a\u5206\u9a7e\u9a76\u4e0e\u5bfc\u822a\u667a\u80fd\u4f53\u8be5\u901a\u884c\u8fd8\u662f\u8be5\u505c\u6b62\u3002\u6d4b\u8bd5\u63ed\u793a\u4f20\u7edf\u5206\u6570\u63a9\u76d6\u7684\u51b3\u7b56\u5dee\u5f02\uff0c\u673a\u5668\u4eba\u5fae\u8c03\u867d\u63d0\u5347\u901a\u884c\u80fd\u529b\uff0c\u5374\u4e27\u5931\u505c\u8f66\u884c\u4e3a\u3002", "categories": ["cs.RO", "cs.CV", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06453", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u673a\u5668\u4eba\u5bfc\u822a", "\u95ed\u73af\u8bc4\u4f30", "\u5b89\u5168\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06453v1", "published_at": "2026-11-04", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Infraction Scores: Failure-Boundary Profiles for Closed-Loop Evaluation of Driving and Robot Navigation Agents", "tldr": "\u63d0\u51fa\u5931\u8d25\u8fb9\u754c\u8bc4\u4f30\uff0c\u533a\u5206\u9a7e\u9a76\u4e0e\u5bfc\u822a\u667a\u80fd\u4f53\u8be5\u901a\u884c\u8fd8\u662f\u8be5\u505c\u6b62\u3002\u6d4b\u8bd5\u63ed\u793a\u4f20\u7edf\u5206\u6570\u63a9\u76d6\u7684\u51b3\u7b56\u5dee\u5f02\uff0c\u673a\u5668\u4eba\u5fae\u8c03\u867d\u63d0\u5347\u901a\u884c\u80fd\u529b\uff0c\u5374\u4e27\u5931\u505c\u8f66\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
