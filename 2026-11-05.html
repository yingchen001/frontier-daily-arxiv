ific demonstrations. Human demonstrations are far easier to collect, yet directly leveraging them is challenging due to the substantial human-robot embodiment gap, particularly when the underlying VLA has been pretrained primarily on robot data. We introduce H2RB (Human-To-Robot Bridge), a human-robot co-training framework for adapting pretrained VLA policies from unpaired human and robot demonstrations. H2RB bridges the embodiment gap at both interfaces: geometry-anchored alignment grounds human and robot observations in a compatible representation, while a decoupled-decoder tokenizer shares action latents without forcing both domains through a single action mapping. This design allows human demonstrations to provide useful behavioral supervision while retaining the rich visual, semantic, and control priors of the pretrained VLA. Across real-world tasks, H2RB substantially improves object transfer performance from 8.0 to 51.8 and enables skill transfer to score 62.7, in settings where co-train baselines totally fail to transfer human-demonstrated skills. The benefit also persists under object-placement shifts, improving out-of-distribution transfer from 6.0 to 45.3. H2RB suggests a way for human demonstrations to serve as a scalable supervision source for adapting pretrained robotic policies, reducing the dependence on costly target-robot data collection.", "arxiv_id": "2611.04391", "arxiv_url": "https://arxiv.org/abs/2611.04391", "authors": ["Junhyeong Park", "Wook Jung", "Taeyoung Kim", "Huiwon Jang", "Jinwoo Shin"], "brief": "H2RB\u7528\u975e\u914d\u5bf9\u7684\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u793a\u8303\u8054\u5408\u8bad\u7ec3\u9884\u8bad\u7ec3VLA\uff0c\u901a\u8fc7\u51e0\u4f55\u951a\u5b9a\u5bf9\u9f50\u89c2\u6d4b\u8868\u5f81\uff0c\u5e76\u7528\u89e3\u8026\u89e3\u7801\u5668\u5171\u4eab\u52a8\u4f5c\u6f5c\u53d8\u91cf\uff0c\u4fdd\u7559\u4e0d\u540c\u5177\u8eab\u7684\u52a8\u4f5c\u6620\u5c04\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/jun-brro/h2rb-code", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.04391", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u51e0\u4f55\u951a\u5b9a\u5bf9\u9f50\u8868\u5f81\uff0c\u89e3\u8026\u89e3\u7801\u5668\u5171\u4eab\u52a8\u4f5c\u6f5c\u53d8\u91cf", "\u771f\u5b9e\u4efb\u52a1\u7269\u4f53\u8fc1\u79fb\u8bc4\u5206\u4ece8.0\u5347\u81f351.8", "\u6280\u80fd\u8fc1\u79fb\u8fbe62.7\uff1b\u5206\u5e03\u5916\u8fc1\u79fb\u4ece6.0\u5347\u81f345.3"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8fc1\u79fb\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2611.04391v1", "published_at": "2026-11-03", "score": 0.285, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04391.png", "title": "Human-to-Robot Transfer via Bridging Representation and Action Space in VLAs", "tldr": "H2RB\u6253\u901a\u4eba\u673a\u8868\u5f81\u4e0e\u52a8\u4f5c\u7a7a\u95f4\uff0c\u8ba9\u4eba\u7c7b\u793a\u8303\u6709\u6548\u9002\u914d\u9884\u8bad\u7ec3\u673a\u5668\u4eba\u7b56\u7565\u3002", "upvotes": 13, "what_it_is": "H2RB\u7528\u975e\u914d\u5bf9\u7684\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u793a\u8303\u8054\u5408\u8bad\u7ec3\u9884\u8bad\u7ec3VLA\uff0c\u901a\u8fc7\u51e0\u4f55\u951a\u5b9a\u5bf9\u9f50\u89c2\u6d4b\u8868\u5f81\uff0c\u5e76\u7528\u89e3\u8026\u89e3\u7801\u5668\u5171\u4eab\u52a8\u4f5c\u6f5c\u53d8\u91cf\uff0c\u4fdd\u7559\u4e0d\u540c\u5177\u8eab\u7684\u52a8\u4f5c\u6620\u5c04\u3002", "why_notable": "\u5b83\u8ba9\u6613\u91c7\u96c6\u7684\u4eba\u7c7b\u793a\u8303\u6210\u4e3a\u673a\u5668\u4eba\u7b56\u7565\u7684\u6709\u6548\u76d1\u7763\uff0c\u5728\u771f\u5b9e\u4efb\u52a1\u4e0e\u7269\u4f53\u4f4d\u7f6e\u53d8\u5316\u4e0b\u5747\u63d0\u5347\u8fc1\u79fb\u8868\u73b0\uff0c\u6709\u671b\u964d\u4f4e\u76ee\u6807\u673a\u5668\u4eba\u793a\u8303\u91c7\u96c6\u6210\u672c\u3002"}, {"abstract": "Adversarial diffusion distillation has conventionally relied on image features for discrimination. We revisit this choice for multimodal diffusion transformers (MMDiTs), whose text stream becomes image-dependent through joint attention. We introduce Text-Stream Adversarial Distillation (TSAD), which exploits intermediate text-token states as a new adversarial representation. Because the text stream has already read the image while remaining tied to the text condition, changing that condition changes what information it extracts from the image. Building on this property, we introduce Aspect-Cued Discrimination (ACD), which conditions the discriminator on different aspects of the sample, such as typography, objects, or style, to steer which properties are emphasized during adversarial training. Building on the expert-discriminator design of NitroFusion, we integrate TSAD and ACD in NitroFusion2. NitroFusion2 brings few-step distillation from the conventional 4-8-step regime down to just 1-2 steps at comparable quality. At one step, it produces sharp rendered text and rich fine-grained details, making one-step generation practical rather than merely a stress test for distillation. At two steps, it remains competitive across the evaluated benchmarks. These results establish the MMDiT text stream as a powerful and steerable representation for adversarial diffusion distillation.", "arxiv_id": "2611.05648", "arxiv_url": "https://arxiv.org/abs/2611.05648", "authors": ["Dar-Yen Chen", "Yi-Zhe Song"], "brief": "\u63d0\u51fa\u6587\u672c\u6d41\u5bf9\u6297\u84b8\u998f\uff0c\u5c06\u8054\u5408\u6ce8\u610f\u529b\u540e\u7684\u4e2d\u95f4\u6587\u672c\u72b6\u6001\u7528\u4e8e\u5224\u522b\uff0c\u5e76\u901a\u8fc7\u5b57\u4f53\u3001\u7269\u4f53\u6216\u98ce\u683c\u7b49\u6761\u4ef6\u7ebf\u7d22\uff0c\u5f15\u5bfc\u5224\u522b\u5668\u5173\u6ce8\u4e0d\u540c\u56fe\u50cf\u5c5e\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ChenDarYen/NitroFusion2", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2611.05648", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["TSAD\u4ee5\u4e2d\u95f4\u6587\u672c\u8bcd\u5143\u72b6\u6001\u4f5c\u4e3a\u5bf9\u6297\u8868\u5f81", "ACD\u7528\u5b57\u4f53\u3001\u7269\u4f53\u6216\u98ce\u683c\u7ebf\u7d22\u63a7\u5236\u5224\u522b\u91cd\u70b9", "\u7ed3\u5408\u4e13\u5bb6\u5224\u522b\u5668\uff0c\u5c064\u20148\u6b65\u84b8\u998f\u964d\u81f31\u20142\u6b65"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5bf9\u6297\u84b8\u998f", "\u591a\u6a21\u6001\u751f\u6210", "\u56fe\u50cf\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "SketchX", "pdf_url": "https://arxiv.org/pdf/2611.05648v1", "published_at": "2026-11-03", "score": 0.283, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05648.png", "title": "NitroFusion2: Bringing Adversarial Loss to the Text Stream of Multimodal Diffusion Transformers", "tldr": "\u5229\u7528\u591a\u6a21\u6001\u6269\u6563\u6a21\u578b\u7684\u6587\u672c\u6d41\u505a\u5bf9\u6297\u84b8\u998f\uff0c\u5c06\u9ad8\u8d28\u91cf\u56fe\u50cf\u751f\u6210\u538b\u7f29\u81f3\u4e00\u81f3\u4e24\u6b65\u3002", "upvotes": 7, "what_it_is": "\u63d0\u51fa\u6587\u672c\u6d41\u5bf9\u6297\u84b8\u998f\uff0c\u5c06\u8054\u5408\u6ce8\u610f\u529b\u540e\u7684\u4e2d\u95f4\u6587\u672c\u72b6\u6001\u7528\u4e8e\u5224\u522b\uff0c\u5e76\u901a\u8fc7\u5b57\u4f53\u3001\u7269\u4f53\u6216\u98ce\u683c\u7b49\u6761\u4ef6\u7ebf\u7d22\uff0c\u5f15\u5bfc\u5224\u522b\u5668\u5173\u6ce8\u4e0d\u540c\u56fe\u50cf\u5c5e\u6027\u3002", "why_notable": "\u628a\u6587\u672c\u6d41\u4ece\u6761\u4ef6\u8f93\u5165\u53d8\u4e3a\u53ef\u64cd\u63a7\u7684\u5224\u522b\u8868\u5f81\uff0c\u5728\u76f8\u8fd1\u8d28\u91cf\u4e0b\u51cf\u5c11\u751f\u6210\u6b65\u6570\uff0c\u5e76\u6539\u5584\u5355\u6b65\u751f\u6210\u7684\u6587\u5b57\u6e05\u6670\u5ea6\u4e0e\u7ec6\u8282\u3002"}, {"abstract": "Probabilistic time-series forecasting requires models that simultaneously capture structured temporal dynamics, expressive uncertainty, and efficient inference, yet existing approaches fall short of this goal: latent dynamical models impose structure but rely on restrictive generation mechanisms, while modern generative methods such as diffusion and flow matching achieve flexibility at the cost of iterative and computationally expensive sampling. We introduce the Koopman Generative Operator (KGO), a probabilistic forecasting method that conceptualizes prediction as the evolution of structured uncertainty. KGO integrates three core components: (1) Koopman Patch Embedding (KoPE) for temporally consistent latent trajectory extrapolation; (2) Koopman Flow Matching (KoFM), which enables fast, single-step generation through a closed-form matrix exponential in a Koopman latent space, bypassing iterative sampling; and (3) an Adaptive Uncertainty Gate (AUG), which provides probabilistic forecasts by adapting uncertainty per-variable and per-horizon, corresponding to a learned decomposition of aleatoric uncertainty without manual tuning. By unifying these components, KGO achieves state-of-the-art accuracy on 13/17 ProbTS benchmarks in CRPS and 16/17 in NMAE. Further, by eliminating iterative sampling, KGO delivers at least a 25$\\times$ reduction in inference time compared to iterative generative models. These results position KGO as a practical and principled framework that advances the accuracy-efficiency trade-off in probabilistic time-series forecasting, combining leading accuracy on the evaluated benchmarks with fast, single-step generation.", "arxiv_id": "2611.04760", "arxiv_url": "https://arxiv.org/abs/2611.04760", "authors": ["Raz Marshanski", "Liran Nochumsohn", "Mayank Jauhari", "Boris N. Oreshkin", "Omri Azencot"], "brief": "KGO\u5c06\u6982\u7387\u9884\u6d4b\u5efa\u6a21\u4e3a\u7ed3\u6784\u5316\u4e0d\u786e\u5b9a\u6027\u7684\u6f14\u5316\uff0c\u7528Koopman\u6f5c\u7a7a\u95f4\u5916\u63a8\u8f68\u8ff9\u5e76\u901a\u8fc7\u77e9\u9635\u6307\u6570\u5355\u6b65\u751f\u6210\uff0c\u518d\u6309\u53d8\u91cf\u548c\u9884\u6d4b\u8de8\u5ea6\u81ea\u9002\u5e94\u8c03\u8282\u4e0d\u786e\u5b9a\u6027\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/azencot-group/KGO", "github_stars": 48, "hf_url": "https://huggingface.co/papers/2611.04760", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["KoPE\u5916\u63a8\u65f6\u5e8f\u6f5c\u8f68\u8ff9\uff0cAUG\u6309\u53d8\u91cf\u4e0e\u8de8\u5ea6\u8c03\u8282\u4e0d\u786e\u5b9a\u6027", "KoFM\u4ee5\u95ed\u5f0f\u77e9\u9635\u6307\u6570\u5355\u6b65\u751f\u6210\uff0c\u63a8\u7406\u81f3\u5c11\u63d0\u901f25\u500d", "17\u9879ProbTS\u57fa\u51c6\u4e2d\uff0cCRPS\u9886\u514813\u9879\u3001NMAE\u9886\u514816\u9879"], "keywords": ["\u6982\u7387\u9884\u6d4b", "\u65f6\u95f4\u5e8f\u5217", "\u6d41\u5339\u914d", "Koopman\u7b97\u5b50"], "num_comments": 2, "on_hf": true, "organization": "The Sequential Learning Group", "pdf_url": "https://arxiv.org/pdf/2611.04760v1", "published_at": "2026-11-03", "score": 0.277, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04760.png", "title": "Koopman Generative Operators for Efficient Probabilistic Time-Series Forecasting", "tldr": "\u501f\u52a9\u6f5c\u7a7a\u95f4\u52a8\u529b\u5b66\u4e0e\u5355\u6b65\u751f\u6210\uff0c\u517c\u987e\u6982\u7387\u65f6\u5e8f\u9884\u6d4b\u7cbe\u5ea6\u548c\u63a8\u7406\u6548\u7387\u3002", "upvotes": 3, "what_it_is": "KGO\u5c06\u6982\u7387\u9884\u6d4b\u5efa\u6a21\u4e3a\u7ed3\u6784\u5316\u4e0d\u786e\u5b9a\u6027\u7684\u6f14\u5316\uff0c\u7528Koopman\u6f5c\u7a7a\u95f4\u5916\u63a8\u8f68\u8ff9\u5e76\u901a\u8fc7\u77e9\u9635\u6307\u6570\u5355\u6b65\u751f\u6210\uff0c\u518d\u6309\u53d8\u91cf\u548c\u9884\u6d4b\u8de8\u5ea6\u81ea\u9002\u5e94\u8c03\u8282\u4e0d\u786e\u5b9a\u6027\u3002", "why_notable": "\u5b83\u5c06\u65f6\u5e8f\u52a8\u529b\u5b66\u7ed3\u6784\u4e0e\u7075\u6d3b\u751f\u6210\u7ed3\u5408\uff0c\u5728\u591a\u9879\u57fa\u51c6\u4e0a\u540c\u65f6\u63d0\u5347\u7cbe\u5ea6\u548c\u6548\u7387\uff0c\u4e3a\u4f4e\u5ef6\u8fdf\u6982\u7387\u9884\u6d4b\u63d0\u4f9b\u4e86\u6709\u7ade\u4e89\u529b\u7684\u65b9\u6848\u3002"}, {"abstract": "Looped transformers are a parameter-efficient alternative to standard transformers for language modeling. By reapplying the same layers across multiple loop steps, recent looped language models match the performance of non-looped models several times their size. While this architecture effectively reduces parameter memory, each loop step still stores its own keys and values, so the key-value (KV) cache grows linearly with the number of loop steps and becomes the main memory bottleneck. We observe that the KV cache of looped models is highly redundant along the loop axis and that the loop steps differ substantially in their sensitivity to quantization. Based on these observations, we propose $\\textbf{LoopVQ}$, a KV cache vector quantization method for looped transformers that codes channels of multiple loop steps jointly, and fine-tunes the codebooks to match the output of the full-precision model. At 0.5 bits per element, LoopVQ outperforms existing KV cache vector quantization methods for standard LLMs on general, long chain-of-thought reasoning, and long-context retrieval tasks with Ouro and Huginn models. Its design is orthogonal to these methods, and combined with TaSQ, it retains much of the BF16 accuracy even at 0.25 bits per element. We also implement LoopVQ in SGLang, where it nearly halves the decode latency at a 32K-token context and raises the peak serving throughput by up to $4.3\\times$ and $6.1\\times$ on the 1.4B and 2.6B Ouro models compared to the BF16 baseline.", "arxiv_id": "2611.05304", "arxiv_url": "https://arxiv.org/abs/2611.05304", "authors": ["Minsoo Cheong", "Sungjoo Yoo"], "brief": "LoopVQ\u9488\u5bf9\u5faa\u73af\u6a21\u578b\u7f13\u5b58\u5197\u4f59\uff0c\u8054\u5408\u7f16\u7801\u591a\u4e2a\u5faa\u73af\u6b65\u9aa4\u7684\u901a\u9053\uff0c\u5e76\u5fae\u8c03\u7801\u672c\u5bf9\u9f50\u5168\u7cbe\u5ea6\u8f93\u51fa\uff1b\u5229\u7528\u6b65\u9aa4\u95f4\u91cf\u5316\u654f\u611f\u5ea6\u5dee\u5f02\u5b9e\u73b0\u6781\u4f4e\u6bd4\u7279\u538b\u7f29\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/mscheong01/LoopVQ", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.05304", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["0.5\u6bd4\u7279\u4e0b\uff0c\u5728Ouro\u548cHuginn\u591a\u7c7b\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5", "\u7ed3\u5408TaSQ\uff0c0.25\u6bd4\u7279\u4ecd\u4fdd\u7559\u5927\u90e8\u5206BF16\u7cbe\u5ea6", "SGLang\u4e2d32K\u89e3\u7801\u5ef6\u8fdf\u8fd1\u51cf\u534a\uff0c\u541e\u5410\u6700\u9ad8\u63d0\u53476.1\u500d"], "keywords": ["\u5faa\u73af\u6a21\u578b", "\u7f13\u5b58\u91cf\u5316", "\u63a8\u7406\u52a0\u901f", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 2, "on_hf": true, "organization": "Seoul National University", "pdf_url": "https://arxiv.org/pdf/2611.05304v1", "published_at": "2026-11-03", "score": 0.276, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05304.png", "title": "LoopVQ: Sub 1-bit KV Cache Quantization for Looped Transformers", "tldr": "\u8054\u5408\u91cf\u5316\u8de8\u5faa\u73af\u952e\u503c\u7f13\u5b58\uff0c\u4ee5\u4f4e\u4e8e\u4e00\u6bd4\u7279\u7cbe\u5ea6\u7f13\u89e3\u663e\u5b58\u74f6\u9888\u5e76\u52a0\u901f\u63a8\u7406\u3002", "upvotes": 8, "what_it_is": "LoopVQ\u9488\u5bf9\u5faa\u73af\u6a21\u578b\u7f13\u5b58\u5197\u4f59\uff0c\u8054\u5408\u7f16\u7801\u591a\u4e2a\u5faa\u73af\u6b65\u9aa4\u7684\u901a\u9053\uff0c\u5e76\u5fae\u8c03\u7801\u672c\u5bf9\u9f50\u5168\u7cbe\u5ea6\u8f93\u51fa\uff1b\u5229\u7528\u6b65\u9aa4\u95f4\u91cf\u5316\u654f\u611f\u5ea6\u5dee\u5f02\u5b9e\u73b0\u6781\u4f4e\u6bd4\u7279\u538b\u7f29\u3002", "why_notable": "\u5b83\u8865\u9f50\u5faa\u73af\u6a21\u578b\u53c2\u6570\u7701\u800c\u7f13\u5b58\u4e0d\u7701\u7684\u77ed\u677f\uff0c\u5e76\u5c06\u6781\u4f4e\u6bd4\u7279\u538b\u7f29\u8f6c\u5316\u4e3a\u5b9e\u9645\u670d\u52a1\u52a0\u901f\uff0c\u5bf9\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u5c24\u5176\u6709\u4ef7\u503c\u3002"}, {"abstract": "A frontier AI model is trained in an AI data center, on tens of thousands of accelerators joined by a dedicated network, and every training step ends with all of them exchanging data at once. Between racks, that network is optical, and each of its four layers, from lasers to switches, runs a fixed or after-the-fact policy. Lasers sharing an enclosure, cooling, and power can fail together. At a fixed spare ratio, correlated failure provably caps a pool\u0027s availability however large it grows. In this paper, we present a comprehensive predictive control plane framework, called Halley, that reads each resource\u0027s next state and acts before the failure occurs. It has four components, each carrying a formal guarantee: LightReserve that sizes the laser pool to provide a coverage bound, FoldFit that schedules the switch within $11/9$ of the optimal, ThermaLead that holds a microring with one-step-ahead control, and TriageGuard that protects the highest-risk modules first. Halley gives each layer a predictive controller that defers to the deployed policy when unsure. Composed from simulations at that point, effective goodput, the share of ideal throughput kept, rises from 65.2\\% to 76.5\\% if a window that exhausts its spares is lost. If only the dark channels\u0027 bandwidth is lost, it reaches 67.4\\%. Per megawatt, that is up to 1.03--1.17 times the training; for the same training, up to 3.3--14.7\\% less data center capacity. \\textsf{Halley}\u0027s fallback circuits are formally verified and are shown to achieve close timing on a commercial FPGA, and pass a 130~nm signoff.", "arxiv_id": "2611.04408", "arxiv_url": "https://arxiv.org/abs/2611.04408", "authors": ["Manav Mishra", "Krishna M. Sivalingam"], "brief": "Halley\u4e3aAI\u6570\u636e\u4e2d\u5fc3\u5149\u7f51\u7edc\u6784\u5efa\u9884\u6d4b\u63a7\u5236\u5e73\u9762\uff0c\u8986\u76d6\u6fc0\u5149\u5668\u5907\u7528\u6c60\u3001\u4ea4\u6362\u8c03\u5ea6\u3001\u5fae\u73af\u6e29\u63a7\u548c\u6a21\u5757\u4fdd\u62a4\uff1b\u4f9d\u636e\u4e0b\u4e00\u72b6\u6001\u63d0\u524d\u5e72\u9884\uff0c\u4e0d\u786e\u5b9a\u65f6\u56de\u9000\u81f3\u73b0\u6709\u7b56\u7565\u3002", "categories": ["cs.NI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04408", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["LightReserve\u4fdd\u8bc1\u5907\u7528\u8986\u76d6\uff0cFoldFit\u8fbe\u6700\u4f18\u768411/9\u754c", "ThermaLead\u524d\u77bb\u6e29\u63a7\uff0cTriageGuard\u4f18\u5148\u4fdd\u62a4\u9ad8\u98ce\u9669\u6a21\u5757", "\u7ec4\u5408\u4eff\u771f\u4e2d\u6709\u6548\u541e\u5410\u5360\u6bd4\u753165.2%\u5347\u81f376.5%"], "keywords": ["\u5149\u7f51\u7edc", "\u9884\u6d4b\u63a7\u5236", "\u6570\u636e\u4e2d\u5fc3", "\u5bb9\u9519"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.04408v1", "published_at": "2026-11-03", "score": 0.272, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04408.png", "title": "Halley: A Predictive Control Plane for Optical AI Data Center Networks", "tldr": "\u901a\u8fc7\u56db\u5c42\u9884\u6d4b\u63a7\u5236\u63d0\u524d\u5e94\u5bf9\u5149\u7f51\u7edc\u6545\u969c\uff0c\u63d0\u9ad8\u5927\u89c4\u6a21\u6a21\u578b\u8bad\u7ec3\u7684\u6709\u6548\u541e\u5410\u4e0e\u80fd\u6548\u3002", "upvotes": 30, "what_it_is": "Halley\u4e3aAI\u6570\u636e\u4e2d\u5fc3\u5149\u7f51\u7edc\u6784\u5efa\u9884\u6d4b\u63a7\u5236\u5e73\u9762\uff0c\u8986\u76d6\u6fc0\u5149\u5668\u5907\u7528\u6c60\u3001\u4ea4\u6362\u8c03\u5ea6\u3001\u5fae\u73af\u6e29\u63a7\u548c\u6a21\u5757\u4fdd\u62a4\uff1b\u4f9d\u636e\u4e0b\u4e00\u72b6\u6001\u63d0\u524d\u5e72\u9884\uff0c\u4e0d\u786e\u5b9a\u65f6\u56de\u9000\u81f3\u73b0\u6709\u7b56\u7565\u3002", "why_notable": "\u5c06\u76f8\u5173\u6545\u969c\u4e0b\u7684\u8d44\u6e90\u5197\u4f59\u4e0e\u9884\u6d4b\u63a7\u5236\u7edf\u4e00\u8d77\u6765\uff0c\u5404\u7ec4\u4ef6\u5177\u6709\u5f62\u5f0f\u5316\u4fdd\u8bc1\uff1b\u56de\u9000\u7535\u8def\u7ecf\u9a8c\u8bc1\u5e76\u901a\u8fc7130\u7eb3\u7c73\u7b7e\u6838\uff0c\u517c\u987e\u6536\u76ca\u4e0e\u786c\u4ef6\u53ef\u5b9e\u73b0\u6027\u3002"}, {"abstract": "A speech deepfake detector estimates whether a recording is synthetic, but a forensic analyst also asks which system produced it, whether recordings share a source, and what evidence supports each conclusion. We present VeriSpoof, an audio language model that unifies five tasks with shared weights: deepfake detection, generator attribution (generator, acoustic model and vocoder), recording-condition analysis, synthesized-span localisation, and source verification. Each decision is supported by grounded rationales whose statements can be independently verified. Answers are scored by sentence likelihood, allowing detection and source verification to be thresholded without separate heads. Rationale statements can be checked against waveform measurements, span labels, or generator metadata. Counterfactual examples train decisions to follow the stated evidence. Across the 14 Speech-DF-Arena test sets, VeriSpoof-Plus achieves 2.14% pooled EER, ranking third of 28 systems and first among open-weight systems. VeriSpoof-Base, trained only on official training splits of eight corpora, achieves 4.43% EER, less than half that of the next open-weight detector. With the same weights, VeriSpoof-Plus verifies whether recordings from generators unseen in training share a source at 6.2% EER. Controlled studies show that the audio representation governs detection, the LLM governs recording comparison, and source supervision is necessary for neural-codec fakes. Statement-checkable rationales catch partial fakes missed by one-step answers (99.6% vs. 78.4% on PartialEdit) and determine decisions under edits unseen in training (99.5%). Training updates only 29.7M of 2.85B parameters, fitting a single 24 GB GPU with gradient checkpointing. We release both models, inference code, a demo, and VeriSpoof-Bench, the evaluation suite covering these questions.", "arxiv_id": "2611.04634", "arxiv_url": "https://arxiv.org/abs/2611.04634", "authors": ["Yang Xiao", "Ting Dang"], "brief": "VeriSpoof\u4ee5\u5171\u4eab\u6743\u91cd\u7edf\u4e00\u68c0\u6d4b\u3001\u751f\u6210\u5668\u5f52\u56e0\u3001\u5f55\u97f3\u6761\u4ef6\u5206\u6790\u3001\u4f2a\u9020\u7247\u6bb5\u5b9a\u4f4d\u4e0e\u540c\u6e90\u9a8c\u8bc1\u3002\u901a\u8fc7\u53e5\u5b50\u4f3c\u7136\u8bc4\u5206\u53ca\u53cd\u4e8b\u5b9e\u8bad\u7ec3\uff0c\u8ba9\u5224\u65ad\u4f9d\u636e\u53ef\u72ec\u7acb\u6838\u9a8c\u3002", "categories": ["eess.AS", "cs.CR", "cs.SD"], "github_repo": "https://github.com/swagshaw/verispoof", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2611.04634", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Plus\u572814\u4e2a\u6d4b\u8bd5\u96c6\u4e0aEER\u4e3a2.14%\uff0c\u5f00\u653e\u6743\u91cd\u7cfb\u7edf\u7b2c\u4e00", "\u672a\u89c1\u751f\u6210\u5668\u7684\u5f55\u97f3\u540c\u6e90\u9a8c\u8bc1EER\u4e3a6.2%", "\u4ec5\u66f4\u65b029.7M\u53c2\u6570\uff0c\u68af\u5ea6\u68c0\u67e5\u70b9\u652f\u6301\u5355\u536124GB\u8bad\u7ec3"], "keywords": ["\u8bed\u97f3\u4f2a\u9020\u68c0\u6d4b", "\u97f3\u9891\u8bed\u8a00\u6a21\u578b", "\u6765\u6e90\u9a8c\u8bc1", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": "The University of Melbourne", "pdf_url": "https://arxiv.org/pdf/2611.04634v1", "published_at": "2026-11-03", "score": 0.271, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04634.png", "title": "VeriSpoof: Beyond Real or Fake with One Audio LLM", "tldr": "\u7528\u540c\u4e00\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u7edf\u4e00\u8bed\u97f3\u4f2a\u9020\u68c0\u6d4b\u4e0e\u6eaf\u6e90\uff0c\u5e76\u4ee5\u53ef\u6838\u9a8c\u4f9d\u636e\u652f\u6301\u5224\u65ad\u3002", "upvotes": 5, "what_it_is": "VeriSpoof\u4ee5\u5171\u4eab\u6743\u91cd\u7edf\u4e00\u68c0\u6d4b\u3001\u751f\u6210\u5668\u5f52\u56e0\u3001\u5f55\u97f3\u6761\u4ef6\u5206\u6790\u3001\u4f2a\u9020\u7247\u6bb5\u5b9a\u4f4d\u4e0e\u540c\u6e90\u9a8c\u8bc1\u3002\u901a\u8fc7\u53e5\u5b50\u4f3c\u7136\u8bc4\u5206\u53ca\u53cd\u4e8b\u5b9e\u8bad\u7ec3\uff0c\u8ba9\u5224\u65ad\u4f9d\u636e\u53ef\u72ec\u7acb\u6838\u9a8c\u3002", "why_notable": "\u5c06\u771f\u5047\u5224\u522b\u6269\u5c55\u4e3a\u591a\u4efb\u52a1\u8bed\u97f3\u53d6\u8bc1\uff0c\u540c\u65f6\u63d0\u4f9b\u53ef\u6838\u9a8c\u4f9d\u636e\uff1b\u5728PartialEdit\u4e0a\uff0c\u4f9d\u636e\u68c0\u67e5\u5c06\u5c40\u90e8\u4f2a\u9020\u8bc6\u522b\u7387\u4ece78.4%\u63d0\u5347\u81f399.6%\u3002"}, {"abstract": "Target-conditioned diffusion drafters predict candidate tokens in parallel, yet each new block must wait for updated target-model hidden states. This forces drafting and verification to run sequentially, limiting speedup even though each block is generated in one pass. We introduce D3D, a standalone diffusion drafter that removes this inter-round dependency. D3D combines blockwise denoising with auxiliary autoregressive supervision to achieve long accepted prefixes without target hidden states. This independence lets D3D draft successor blocks during verification in one packed pass, enabling asynchronous speculative decoding. We progressively prune layers according to their effect on acceptance length to reduce the cost of packed drafting. Removing five of 36 layers retains over 99\\% of mean acceptance length across three benchmarks with Qwen3-8B as the target. Across seven benchmarks, D3D averages 5.00$\\times$ and 5.71$\\times$ decoding speedup with Qwen3-8B and Qwen3-32B targets, compared with 4.03$\\times$ and 3.67$\\times$ for DFlash. On GSM8K with Qwen3-32B, speedup reaches 7.48$\\times$. Code is publicly available at https://github.com/fudan-generative-vision/D3D.", "arxiv_id": "2611.06425", "arxiv_url": "https://arxiv.org/abs/2611.06425", "authors": ["Baoyou Chen", "Ruiqiao Mei", "Guancong Lin", "Tao Song", "Weihao Yuan", "Qun Liu", "Siyu Zhu"], "brief": "D3D\u4ee5\u5206\u5757\u53bb\u566a\u7ed3\u5408\u8f85\u52a9\u81ea\u56de\u5f52\u76d1\u7763\uff0c\u8bad\u7ec3\u4e0d\u4f9d\u8d56\u76ee\u6807\u6a21\u578b\u9690\u85cf\u72b6\u6001\u7684\u6269\u6563\u8349\u7a3f\u5668\u3002\u9a8c\u8bc1\u671f\u95f4\u5373\u53ef\u6253\u5305\u8d77\u8349\u540e\u7eed\u5757\uff0c\u5b9e\u73b0\u5f02\u6b65\u63a8\u6d4b\u89e3\u7801\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/fudan-generative-vision/D3D", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2611.06425", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5206\u5757\u53bb\u566a\u4e0e\u8f85\u52a9\u81ea\u56de\u5f52\u76d1\u7763\u63d0\u5347\u5df2\u63a5\u53d7\u524d\u7f00\u957f\u5ea6", "36\u5c42\u526a\u53bb5\u5c42\uff0c\u4e09\u9879\u57fa\u51c6\u4fdd\u7559\u8d8599%\u5e73\u5747\u63a5\u53d7\u957f\u5ea6", "\u4e03\u9879\u57fa\u51c6\u5e73\u5747\u52a0\u901f5.00\u500d\u4e0e5.71\u500d\uff0c\u4f18\u4e8eDFlash"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u63a8\u6d4b\u89e3\u7801", "\u5f02\u6b65\u63a8\u7406", "\u6a21\u578b\u526a\u679d"], "num_comments": 1, "on_hf": true, "organization": "Fudan University", "pdf_url": "https://arxiv.org/pdf/2611.06425v1", "published_at": "2026-11-04", "score": 0.266, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06425.png", "title": "D3D: Decoupled Diffusion Drafting for Asynchronous Speculative Decoding", "tldr": "\u72ec\u7acb\u6269\u6563\u8349\u7a3f\u6a21\u578b\u6253\u7834\u8f6e\u95f4\u4f9d\u8d56\uff0c\u8ba9\u8d77\u8349\u4e0e\u9a8c\u8bc1\u5f02\u6b65\u5e76\u884c\uff0c\u52a0\u901f\u5927\u6a21\u578b\u89e3\u7801\u3002", "upvotes": 4, "what_it_is": "D3D\u4ee5\u5206\u5757\u53bb\u566a\u7ed3\u5408\u8f85\u52a9\u81ea\u56de\u5f52\u76d1\u7763\uff0c\u8bad\u7ec3\u4e0d\u4f9d\u8d56\u76ee\u6807\u6a21\u578b\u9690\u85cf\u72b6\u6001\u7684\u6269\u6563\u8349\u7a3f\u5668\u3002\u9a8c\u8bc1\u671f\u95f4\u5373\u53ef\u6253\u5305\u8d77\u8349\u540e\u7eed\u5757\uff0c\u5b9e\u73b0\u5f02\u6b65\u63a8\u6d4b\u89e3\u7801\u3002", "why_notable": "\u5173\u952e\u7a81\u7834\u662f\u89e3\u9664\u8349\u7a3f\u5668\u5bf9\u76ee\u6807\u9690\u85cf\u72b6\u6001\u7684\u4f9d\u8d56\uff0c\u8ba9\u8d77\u8349\u4e0e\u9a8c\u8bc1\u771f\u6b63\u91cd\u53e0\uff1b\u5728\u4e24\u79cd\u76ee\u6807\u6a21\u578b\u89c4\u6a21\u4e0a\u5747\u53d6\u5f97\u66f4\u9ad8\u5e73\u5747\u52a0\u901f\u3002"}, {"abstract": "Coding agents powered by models such as GPT-6-Astra connect spatial reasoning with executable robot behavior, raising the question of how such agents can produce lasting improvements in robot capabilities from physical interaction. In this work, we study embodied recursive self-improvement (RSI) through real-world exploration, code refinement, and deployment using PyRUA-REAL, a framework in which coding agents retain interaction experience as persistent memory and reusable executable skills that inform subsequent exploration and improvement. Our empirical study places physical manipulation at the center of the improvement process, examining how agents collaborate, what kinds of execution feedback support effective code refinement, and how task specifications and previously acquired skills influence robustness and task transfer. We further investigate the efficiency and capability of the resulting programs when deployed without involving an online agent for decision-making. Across eight real-world tasks, PyRUA-REAL achieves an average success rate of 91.1%. In complementary evaluation on 42 tasks from the RoboDojo benchmark, it achieves an average success rate of 84.4%. This study provides empirical guidance for turning physical exploration into reusable robot skills that support continued improvement and robust, efficient deployment.", "arxiv_id": "2611.06768", "arxiv_url": "https://arxiv.org/abs/2611.06768", "authors": ["Qiang Wang", "Jianxin Bi", "Shulong Jiang", "Ruiyang Si", "Wenbo Huang", "Kaiqi Chen", "Jiaxin Li", "Liyun Li", "Xuanyi Li", "Daquan Zhou"], "brief": "PyRUA-REAL\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u901a\u8fc7\u771f\u5b9e\u673a\u5668\u4eba\u63a2\u7d22\u4e0e\u6267\u884c\u53cd\u9988\u8fed\u4ee3\u4ee3\u7801\uff0c\u5c06\u7ecf\u9a8c\u4fdd\u5b58\u4e3a\u6301\u4e45\u8bb0\u5fc6\u548c\u53ef\u590d\u7528\u6280\u80fd\uff0c\u5e76\u652f\u6301\u65e0\u9700\u5728\u7ebf\u667a\u80fd\u4f53\u51b3\u7b56\u7684\u7a0b\u5e8f\u90e8\u7f72\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06768", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5177\u8eab\u9012\u5f52\u81ea\u6539\u8fdb\uff08RSI\uff09\u7ed3\u5408\u63a2\u7d22\u3001\u4ee3\u7801\u4fee\u8ba2\u4e0e\u6280\u80fd\u590d\u7528", "8\u9879\u771f\u5b9e\u4e16\u754c\u4efb\u52a1\u5e73\u5747\u6210\u529f\u738791.1%", "RoboDojo\u768442\u9879\u4efb\u52a1\u5e73\u5747\u6210\u529f\u738784.4%"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u9012\u5f52\u81ea\u6539\u8fdb", "\u7f16\u7801\u667a\u80fd\u4f53", "\u6280\u80fd\u8fc1\u79fb"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06768v1", "published_at": "2026-11-04", "score": 0.264, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06768.png", "title": "PyRUA-REAL: Robot Exploration and Adaptive Learning through RSI in the Real World", "tldr": "\u901a\u8fc7\u771f\u5b9e\u4ea4\u4e92\u79ef\u7d2f\u8bb0\u5fc6\u4e0e\u53ef\u6267\u884c\u6280\u80fd\uff0c\u8ba9\u673a\u5668\u4eba\u6301\u7eed\u6539\u8fdb\u5e76\u8131\u79bb\u5728\u7ebf\u667a\u80fd\u4f53\u90e8\u7f72\u3002", "upvotes": 9, "what_it_is": "PyRUA-REAL\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u901a\u8fc7\u771f\u5b9e\u673a\u5668\u4eba\u63a2\u7d22\u4e0e\u6267\u884c\u53cd\u9988\u8fed\u4ee3\u4ee3\u7801\uff0c\u5c06\u7ecf\u9a8c\u4fdd\u5b58\u4e3a\u6301\u4e45\u8bb0\u5fc6\u548c\u53ef\u590d\u7528\u6280\u80fd\uff0c\u5e76\u652f\u6301\u65e0\u9700\u5728\u7ebf\u667a\u80fd\u4f53\u51b3\u7b56\u7684\u7a0b\u5e8f\u90e8\u7f72\u3002", "why_notable": "\u5c06\u7269\u7406\u4ea4\u4e92\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u6301\u7eed\u79ef\u7d2f\u7684\u673a\u5668\u4eba\u6280\u80fd\uff0c\u5e76\u9a8c\u8bc1\u8131\u79bb\u5728\u7ebf\u667a\u80fd\u4f53\u7684\u90e8\u7f72\u65b9\u5f0f\uff0c\u4e3a\u517c\u987e\u80fd\u529b\u63d0\u5347\u4e0e\u6267\u884c\u6548\u7387\u63d0\u4f9b\u5b9e\u8bc1\u3002"}, {"abstract": "Multimodal large language models (MLLMs) can now process hour-long videos, making extended multi-turn dialogue over a single video a natural mode of use. Sustaining such a dialogue requires more than answering each question in isolation: the model must retrieve and reuse information established earlier in the conversation, both what it has seen and what it has said, an ability we term in-context video memory. Existing video QA benchmarks leave this ability unmeasured: their questions are mutually independent, never reference one another, and each is answerable from the video alone, so nothing ever requires carrying information across turns. We introduce VideoMemBench, in which each sample pairs a single video with a long multi-turn dialogue, whose turns are connected by typed cross-turn dependencies: an Episodic Dependency refers back to a visual episode described in an earlier turn, probing memory of what the model has seen, while an Answer Dependency builds on the model\u0027s own earlier answer, probing memory of what the model has said. Every dependency is verified considering two properties: 1) necessity, meaning the question cannot be answered without its earlier turns, and 2) non-leakage, meaning the question does not restate the information from its earlier turns. To enforce these properties, we design a construction pipeline with three LLM roles: a planner, a generator, and a judger, with each dialogue reviewed by human experts. VideoMemBench comprises 326 videos with 2,476 turns, of which 1,387 depend on earlier turns, including multi-parent dependencies and long-range call-back. Among over 20 evaluated open- and closed-source MLLMs, Claude Opus 5 performs the best with an overall score of only 45.7%, highlighting the challenge of in-context video memory. Our dataset and evaluation are released.", "arxiv_id": "2610.40131", "arxiv_url": "https://arxiv.org/abs/2610.40131", "authors": ["Zhengdong Hu", "Chao Wang", "Kaituo Feng", "Huanjin Yao", "Mingfei Lu", "Hehe Fan", "Yi Yang"], "brief": "\u63d0\u51fa\u89c6\u9891\u591a\u8f6e\u5bf9\u8bdd\u57fa\u51c6\uff0c\u4ee5\u89c6\u89c9\u60c5\u8282\u4f9d\u8d56\u548c\u5386\u53f2\u56de\u7b54\u4f9d\u8d56\u5206\u522b\u68c0\u9a8c\u6a21\u578b\u5bf9\u6240\u89c1\u3001\u6240\u8bf4\u7684\u8bb0\u5fc6\u3002\u901a\u8fc7\u4e09\u89d2\u8272\u5927\u6a21\u578b\u6784\u5efa\u4e0e\u4eba\u5de5\u5ba1\u6838\uff0c\u786e\u4fdd\u95ee\u9898\u5fc5\u987b\u4f9d\u8d56\u524d\u6587\u4e14\u4e0d\u6cc4\u9732\u7b54\u6848\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Oliiveralien/VideoMemBench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.40131", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["326\u6bb5\u89c6\u9891\u30012476\u8f6e\u5bf9\u8bdd\uff0c1387\u8f6e\u4f9d\u8d56\u524d\u6587", "\u89c4\u5212\u3001\u751f\u6210\u3001\u8bc4\u5224\u4e09\u89d2\u8272\u6d41\u6c34\u7ebf\u9a8c\u8bc1\u5fc5\u8981\u6027\u4e0e\u975e\u6cc4\u6f0f\u6027", "\u8bc4\u6d4b\u8d8520\u4e2a\u6a21\u578b\uff0cClaude Opus 5\u6700\u9ad8\u520645.7%"], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u89c6\u9891\u7406\u89e3", "\u5bf9\u8bdd\u8bb0\u5fc6", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.40131v3", "published_at": "2026-10-29", "score": 0.257, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40131.png", "title": "VideoMemBench: How Well Do MLLMs Remember in Video Conversations?", "tldr": "\u7528\u8de8\u8f6e\u4f9d\u8d56\u5bf9\u8bdd\u68c0\u9a8c\u591a\u6a21\u6001\u6a21\u578b\u7684\u89c6\u9891\u8bb0\u5fc6\uff0c\u6700\u5f3a\u6a21\u578b\u603b\u5206\u4ec545.7%\u3002", "upvotes": 13, "what_it_is": "\u63d0\u51fa\u89c6\u9891\u591a\u8f6e\u5bf9\u8bdd\u57fa\u51c6\uff0c\u4ee5\u89c6\u89c9\u60c5\u8282\u4f9d\u8d56\u548c\u5386\u53f2\u56de\u7b54\u4f9d\u8d56\u5206\u522b\u68c0\u9a8c\u6a21\u578b\u5bf9\u6240\u89c1\u3001\u6240\u8bf4\u7684\u8bb0\u5fc6\u3002\u901a\u8fc7\u4e09\u89d2\u8272\u5927\u6a21\u578b\u6784\u5efa\u4e0e\u4eba\u5de5\u5ba1\u6838\uff0c\u786e\u4fdd\u95ee\u9898\u5fc5\u987b\u4f9d\u8d56\u524d\u6587\u4e14\u4e0d\u6cc4\u9732\u7b54\u6848\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u72ec\u7acb\u89c6\u9891\u95ee\u7b54\u63a8\u8fdb\u5230\u8de8\u8f6e\u4fe1\u606f\u590d\u7528\uff0c\u63ed\u793a\u957f\u89c6\u9891\u7406\u89e3\u5e76\u4e0d\u7b49\u4e8e\u5bf9\u8bdd\u8bb0\u5fc6\uff0c\u4e3a\u591a\u6a21\u6001\u6a21\u578b\u7684\u8bb0\u5fc6\u80fd\u529b\u63d0\u4f9b\u9488\u5bf9\u6027\u6d4b\u8bd5\u3002"}, {"abstract": "Self-distillation methods for large language models with an exponential moving average (EMA) teacher already retain a history of student updates. Muon nevertheless stores a separate momentum buffer, increasing persistent training memory. We propose Muon with Reused Teacher (Muon-RT), which reuses the teacher-student displacement to eliminate momentum buffers for hidden weight matrices. We show that this displacement encodes an exponentially weighted history of applied updates and smooths temporally uncorrelated noise under a local model. Muon-RT removes its radial component, normalizes it spectrally, and mixes it with the current gradient after Newton-Schulz (NS) orthogonalization. Under explicit regularity and alignment assumptions, we establish linear contraction of an expected objective-gap bound toward a residual error level. With Self-Distillation Fine-Tuning (SDFT) on Qwen2.5-7B-Instruct, Muon-RT improves average accuracy over AdamW by 2.6 points with 42% less persistent memory, and over momentum Muon by 5.4 points with 27% less persistent memory. With Self-Distillation Policy Optimization (SDPO) on Olmo-3-7B-Instruct, it improves average accuracy over AdamW by 2.0 points.", "arxiv_id": "2610.41104", "arxiv_url": "https://arxiv.org/abs/2610.41104", "authors": ["Aryan Das", "Vinay Kumar Verma", "Aakansha Mishra"], "brief": "Muon-RT\u5c06EMA\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u53c2\u6570\u5dee\u4f5c\u4e3a\u5386\u53f2\u66f4\u65b0\u4fe1\u53f7\uff0c\u53bb\u9664\u5f84\u5411\u5206\u91cf\u5e76\u505a\u8c31\u5f52\u4e00\u5316\uff0c\u518d\u4e0e\u7ecfNewton-Schulz\u6b63\u4ea4\u5316\u7684\u5f53\u524d\u68af\u5ea6\u6df7\u5408\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41104", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u590d\u7528EMA\u8f68\u8ff9\uff0c\u53d6\u6d88\u9690\u85cf\u6743\u91cd\u77e9\u9635\u7684\u52a8\u91cf\u7f13\u51b2", "Qwen2.5-7B\u4e0a\u8f83AdamW\u51c6\u786e\u7387\u589e2.6\u70b9\uff0c\u6301\u4e45\u5185\u5b58\u964d42%", "Olmo-3-7B\u4e0aSDPO\u8f83AdamW\u51c6\u786e\u7387\u589e2.0\u70b9"], "keywords": ["\u81ea\u84b8\u998f", "\u4f18\u5316\u5668", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5185\u5b58\u6548\u7387"], "num_comments": 2, "on_hf": true, "organization": "Indian Institute of Technology, Kanpur", "pdf_url": "https://arxiv.org/pdf/2610.41104v1", "published_at": "2026-10-30", "score": 0.253, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41104.png", "title": "MUON-RT Reusing the Teacher\u0027s Trajectory for Momentum-Free Muon for LLM Self-Distillation", "tldr": "\u590d\u7528\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u53c2\u6570\u5dee\u66ff\u4ee3\u52a8\u91cf\uff0c\u5728\u5927\u6a21\u578b\u81ea\u84b8\u998f\u4e2d\u540c\u65f6\u8282\u7701\u663e\u5b58\u5e76\u63d0\u5347\u51c6\u786e\u7387\u3002", "upvotes": 14, "what_it_is": "Muon-RT\u5c06EMA\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u53c2\u6570\u5dee\u4f5c\u4e3a\u5386\u53f2\u66f4\u65b0\u4fe1\u53f7\uff0c\u53bb\u9664\u5f84\u5411\u5206\u91cf\u5e76\u505a\u8c31\u5f52\u4e00\u5316\uff0c\u518d\u4e0e\u7ecfNewton-Schulz\u6b63\u4ea4\u5316\u7684\u5f53\u524d\u68af\u5ea6\u6df7\u5408\u3002", "why_notable": "\u5c06\u81ea\u84b8\u998f\u5df2\u6709\u7684\u6559\u5e08\u5386\u53f2\u8f6c\u5316\u4e3a\u4f18\u5316\u5668\u72b6\u6001\uff0c\u51cf\u5c11\u91cd\u590d\u5b58\u50a8\uff1b\u5728\u4e24\u79cd\u8bad\u7ec3\u8bbe\u7f6e\u4e2d\u63d0\u5347\u51c6\u786e\u7387\uff0c\u5e76\u5728\u660e\u786e\u5047\u8bbe\u4e0b\u7ed9\u51fa\u6536\u655b\u754c\u3002"}, {"abstract": "Universal image restoration aims to handle diverse degradations within a single model, but a reliable scaling strategy remains underexplored. Increasing backbone depth and width can lead to performance saturation, while degradation-aware specialization depends on accurate degradation estimation and is vulnerable to errors on out-of-distribution and real-world inputs. We propose UniRestorer++, a scalable framework based on multi-granularity degradation modeling. It progressively refines degradation groups and introduces group-specific experts, coupling capacity growth with specialization. Degradation-estimation-based routing selects a root-to-leaf path, while granularity-estimation-based routing chooses a level along that path to balance specialization and robustness. Spatially dense degradation representation maps further enable region-aware routing for spatially non-uniform corruptions. We develop CDD-50, a benchmark covering 50 degradation categories from single to penta-degradation. Experiments show approximately log-linear PSNR trends over the evaluated model-size range and stronger scaling gains on out-of-distribution and real-world data than vanilla MoE scaling. UniRestorer++ achieves state-of-the-art performance across benchmarks and demonstrates zero-shot generalization and few-shot transfer on real-world images. Code: https://github.com/mrluin/UniRestorer_plusplus", "arxiv_id": "2611.06042", "arxiv_url": "https://arxiv.org/abs/2611.06042", "authors": ["Jingbo Lin", "Zhilu Zhang", "Fan Li", "Renjing Pei", "Wenbo Li", "Hang Xu", "Hongzhi Zhang", "Wangmeng Zuo"], "brief": "\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u7edf\u4e00\u56fe\u50cf\u4fee\u590d\u6846\u67b6\uff0c\u9010\u6b65\u7ec6\u5206\u9000\u5316\u7ec4\u5e76\u914d\u7f6e\u4e13\u5c5e\u4e13\u5bb6\u3002\u5229\u7528\u9000\u5316\u4f30\u8ba1\u9009\u62e9\u4e13\u5bb6\u8def\u5f84\u3001\u7c92\u5ea6\u4f30\u8ba1\u9009\u62e9\u5c42\u7ea7\uff0c\u5e76\u4ee5\u7a7a\u95f4\u7a20\u5bc6\u8868\u793a\u652f\u6301\u533a\u57df\u8def\u7531\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mrluin/UniRestorer_plusplus", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.06042", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u91cd\u8def\u7531\u9009\u62e9\u4e13\u5bb6\u8def\u5f84\u4e0e\u7c92\u5ea6\u5c42\u7ea7\uff0c\u5e73\u8861\u4e13\u95e8\u5316\u548c\u9c81\u68d2\u6027", "CDD-50\u8986\u76d650\u7c7b\u9000\u5316\uff0c\u5305\u542b\u5355\u4e00\u81f3\u4e94\u91cd\u9000\u5316", "\u6d4b\u8bd5\u89c4\u6a21\u5185PSNR\u8fd1\u4f3c\u5bf9\u6570\u7ebf\u6027\u589e\u957f\uff0c\u57df\u5916\u6536\u76ca\u4f18\u4e8e\u666e\u901aMoE"], "keywords": ["\u56fe\u50cf\u4fee\u590d", "\u6df7\u5408\u4e13\u5bb6", "\u9000\u5316\u5efa\u6a21", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06042v1", "published_at": "2026-11-04", "score": 0.245, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.06042.png", "title": "UniRestorer++: Scalable Universal Image Restoration with Multi-Granularity Degradation Modeling", "tldr": "\u4ee5\u591a\u7c92\u5ea6\u9000\u5316\u5efa\u6a21\u6269\u5c55\u56fe\u50cf\u4fee\u590d\u4e13\u5bb6\uff0c\u517c\u987e\u6a21\u578b\u6269\u5bb9\u6536\u76ca\u4e0e\u771f\u5b9e\u573a\u666f\u9c81\u68d2\u6027\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u7edf\u4e00\u56fe\u50cf\u4fee\u590d\u6846\u67b6\uff0c\u9010\u6b65\u7ec6\u5206\u9000\u5316\u7ec4\u5e76\u914d\u7f6e\u4e13\u5c5e\u4e13\u5bb6\u3002\u5229\u7528\u9000\u5316\u4f30\u8ba1\u9009\u62e9\u4e13\u5bb6\u8def\u5f84\u3001\u7c92\u5ea6\u4f30\u8ba1\u9009\u62e9\u5c42\u7ea7\uff0c\u5e76\u4ee5\u7a7a\u95f4\u7a20\u5bc6\u8868\u793a\u652f\u6301\u533a\u57df\u8def\u7531\u3002", "why_notable": "\u5c06\u5bb9\u91cf\u589e\u957f\u4e0e\u9000\u5316\u4e13\u95e8\u5316\u7ed1\u5b9a\uff0c\u4e3a\u7edf\u4e00\u4fee\u590d\u63d0\u4f9b\u66f4\u6709\u6548\u7684\u6269\u5c55\u7b56\u7565\uff1b\u771f\u5b9e\u56fe\u50cf\u4e0a\u7684\u96f6\u6837\u672c\u6cdb\u5316\u4e0e\u5c11\u6837\u672c\u8fc1\u79fb\u663e\u793a\u5e94\u7528\u6f5c\u529b\u3002"}, {"abstract": "Streaming video-to-audio (V2A) generation is essential for immersive interactive applications. However, real-time constraints leave existing streaming V2A methods far behind offline models: (1) visual frontends shrink their receptive fields to cut look-ahead latency, severely degrading audio-visual alignment; (2) causal autoregressive diffusion backends denoise each audio patch in isolation, impairing audio quality. To this end, we present LiveFoley, a streaming causal autoregressive diffusion architecture that addresses both bottlenecks with imperceptible latency. For the visual frontend, we introduce a Trailing Sliding Window that converts non-causal segment-level encoders into streaming modules without retraining. By simply realigning the window, it preserves precise audio-visual alignment, while a configurable hop size reduces the frontend look-ahead well below the human perceptual threshold. Building on this tunable hop size, we propose the Unified Varhop Framework to accommodate scenarios with diverse latency and computation budgets. For the audio backend, we explore widening the denoising window of the local diffusion transformer (LocDiT) head in two temporal directions. History LocDiT adds past context to improve quality at no latency cost and serves as our default. Alternatively, Future-Warmup LocDiT breaks the autoregressive deadlock with an approximate future condition, further improving generation quality at the cost of an acceptable backend look-ahead. Extensive experiments demonstrate that LiveFoley matches offline models in temporal alignment and leads streaming systems in generation quality. Project page: https://dalision.github.io/livefoley-page/", "arxiv_id": "2611.05988", "arxiv_url": "https://arxiv.org/abs/2611.05988", "authors": ["Yusheng Dai", "Vladimir Iashin", "Kangdi Wang", "Yuxuan Jiang", "Ilpo Viertola", "Weiqiang Wang", "Qiuhong Ke", "Min Zhao", "Jianfei Cai"], "brief": "LiveFoley\u91c7\u7528\u6d41\u5f0f\u56e0\u679c\u81ea\u56de\u5f52\u6269\u6563\u67b6\u6784\uff0c\u4ee5\u5c3e\u968f\u6ed1\u52a8\u7a97\u53e3\u6539\u9020\u89c6\u89c9\u7f16\u7801\u5668\uff0c\u5e76\u6269\u5c55\u5c40\u90e8\u97f3\u9891\u53bb\u566a\u4e0a\u4e0b\u6587\uff0c\u517c\u987e\u5b9e\u65f6\u751f\u6210\u3001\u97f3\u753b\u540c\u6b65\u4e0e\u97f3\u8d28\u3002", "categories": ["cs.SD", "cs.MM"], "github_repo": "https://github.com/dalision/livefoley", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.05988", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Trailing Sliding Window\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u6d41\u5f0f\u5316\u89c6\u89c9\u7f16\u7801\u5668", "Unified Varhop\u652f\u6301\u6309\u5ef6\u8fdf\u4e0e\u7b97\u529b\u9884\u7b97\u8c03\u6574\u6b65\u957f", "History LocDiT\u5229\u7528\u5386\u53f2\u6539\u5584\u97f3\u8d28\uff0c\u4e0d\u589e\u52a0\u5ef6\u8fdf"], "keywords": ["\u89c6\u9891\u914d\u97f3", "\u6d41\u5f0f\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u97f3\u753b\u540c\u6b65"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.05988v1", "published_at": "2026-11-04", "score": 0.245, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.05988.png", "title": "LiveFoley: Dynamic Real-Time Video-to-Audio Generation for Immersive Interactive Worlds", "tldr": "\u901a\u8fc7\u6ed1\u52a8\u89c6\u89c9\u7a97\u53e3\u4e0e\u6269\u5c55\u97f3\u9891\u53bb\u566a\u4e0a\u4e0b\u6587\uff0c\u5b9e\u73b0\u4f4e\u5ef6\u8fdf\u4e14\u7cbe\u51c6\u540c\u6b65\u7684\u89c6\u9891\u914d\u97f3\u3002", "upvotes": 2, "what_it_is": "LiveFoley\u91c7\u7528\u6d41\u5f0f\u56e0\u679c\u81ea\u56de\u5f52\u6269\u6563\u67b6\u6784\uff0c\u4ee5\u5c3e\u968f\u6ed1\u52a8\u7a97\u53e3\u6539\u9020\u89c6\u89c9\u7f16\u7801\u5668\uff0c\u5e76\u6269\u5c55\u5c40\u90e8\u97f3\u9891\u53bb\u566a\u4e0a\u4e0b\u6587\uff0c\u517c\u987e\u5b9e\u65f6\u751f\u6210\u3001\u97f3\u753b\u540c\u6b65\u4e0e\u97f3\u8d28\u3002", "why_notable": "\u5b9e\u9a8c\u4e2d\u97f3\u753b\u65f6\u5e8f\u5bf9\u9f50\u8fbe\u5230\u79bb\u7ebf\u6a21\u578b\u6c34\u5e73\uff0c\u751f\u6210\u8d28\u91cf\u9886\u5148\u6d41\u5f0f\u7cfb\u7edf\uff0c\u4e3a\u4ea4\u4e92\u4e16\u754c\u7684\u5b9e\u65f6\u97f3\u6548\u63d0\u4f9b\u66f4\u5b9e\u7528\u7684\u6280\u672f\u8def\u5f84\u3002"}, {"abstract": "Safety alignment for Large Language Models is heavily focused on English with limited multilingual representation, particularly damaging low-resource language performance. Related open training datasets are often limited in size or do not follow region-localized harmful topics to broaden the scope of alignment beyond cultures. We propose a scalable template-based augmentation pipeline to produce massive multilingual refusal and benign corpora, extracting safe templates from harmful prompts, translating them and then filling in the slots with culturally authentic entities, both harmful and benign. As a result, we release MSafeTemp, a validated corpus spanning 60 languages useful for multilingual safety alignment and evaluation. Using the dataset, we show that English-only evaluation misjudges multilingual safety: for several models, attacks that fail in English succeed once translated, while culturally localized variants expose further failures that translation alone misses. We also confirm that augmenting safety training data through templates allows for higher diversity and quality of alignment, resulting in improved safety performance beyond English. MSafeTemp and the respective pipeline are aimed at facilitating research and development of safer and more responsible models for less-represented cultures.", "arxiv_id": "2610.40516", "arxiv_url": "https://arxiv.org/abs/2610.40516", "authors": ["Max Neuwinger", "Hanna Yukhymenko", "Imanol Schlag"], "brief": "\u63d0\u51fa\u6a21\u677f\u5f0f\u591a\u8bed\u8a00\u6570\u636e\u6269\u589e\u6d41\u7a0b\uff1a\u4ece\u6709\u5bb3\u63d0\u793a\u4e2d\u63d0\u53d6\u5b89\u5168\u6a21\u677f\uff0c\u7ffb\u8bd1\u540e\u586b\u5165\u6587\u5316\u771f\u5b9e\u7684\u6709\u5bb3\u6216\u65e0\u5bb3\u5b9e\u4f53\uff0c\u6784\u5efa\u62d2\u7b54\u4e0e\u826f\u6027\u8bed\u6599MSafeTemp\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/swiss-ai/msafetemp", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.40516", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["MSafeTemp\u63d0\u4f9b\u7ecf\u9a8c\u8bc1\u768460\u79cd\u8bed\u8a00\u5b89\u5168\u8bed\u6599", "\u6a21\u677f\u7ffb\u8bd1\u540e\u586b\u69fd\uff0c\u751f\u6210\u6587\u5316\u672c\u5730\u5316\u6709\u5bb3\u4e0e\u826f\u6027\u6837\u672c", "\u6 on human teleoperation and wearable capture devices, which require at least an hour of human time to produce an hour of data. We present HALO, a humanoid autonomy system powered by a pipeline that synthesizes vision-language-motion data across a thousand procedurally generated homes. The corpus scales with compute rather than human labor. HALO acquires a repertoire of physical skills, including sitting on chairs, navigating to named objects, stepping sideways through half-open doors, crouching and crawling beneath tables, and pushing boxes. It orchestrates these skills to solve composite, long-horizon tasks. Without ever seeing a real home during training, HALO transfers zero-shot to the physical world, achieving a 91% success rate across 360 trials in six unmapped real-world environments. See https://apple-aiml-research.github.io/ml-halo/ for code and videos.", "arxiv_id": "2611.06908", "arxiv_url": "https://arxiv.org/abs/2611.06908", "authors": ["Siyuan Hu", "Abulikemu Abuduweili", "Yue Meng", "Shipeng Liu", "Quentin Leboutet", "Chen Chen", "Matthias M\u00fcller", "Vladlen Koltun"], "brief": "HALO\u5728\u4e00\u5343\u4e2a\u7a0b\u5e8f\u751f\u6210\u7684\u4f4f\u5b85\u4e2d\u5408\u6210\u89c6\u89c9\u3001\u8bed\u8a00\u4e0e\u52a8\u4f5c\u914d\u5bf9\u6570\u636e\uff0c\u5b66\u4e60\u591a\u79cd\u4eba\u5f62\u673a\u5668\u4eba\u6280\u80fd\uff0c\u518d\u7ec4\u5408\u6280\u80fd\u6267\u884c\u957f\u7a0b\u4efb\u52a1\uff0c\u65e0\u9700\u771f\u5b9e\u4f4f\u5b85\u8bad\u7ec3\u5373\u53ef\u8fc1\u79fb\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06908", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": ["\u57281000\u4e2a\u7a0b\u5e8f\u751f\u6210\u4f4f\u5b85\u4e2d\u5408\u6210\u89c6\u89c9\u2014\u8bed\u8a00\u2014\u52a8\u4f5c\u6570\u636e", "HALO\u7ec4\u5408\u5750\u4e0b\u3001\u4fa7\u8eab\u8fc7\u95e8\u3001\u722c\u884c\u548c\u63a8\u7bb1\u7b49\u6280\u80fd", "\u516d\u4e2a\u672a\u5efa\u56fe\u771f\u5b9e\u73af\u5883\u4e2d\uff0c360\u6b21\u8bd5\u9a8c\u6210\u529f\u738791%"], "keywords": ["\u4eba\u5f62\u673a\u5668\u4eba", "\u4eff\u771f\u8fc1\u79fb", "\u591a\u6a21\u6001\u5b66\u4e60", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06908v1", "published_at": "2026-11-04", "score": 0.225, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Perceptive Humanoid Motion from Simulation", "tldr": "HALO\u7528\u4eff\u771f\u5408\u6210\u591a\u6a21\u6001\u52a8\u4f5c\u6570\u636e\uff0c\u8ba9\u4eba\u5f62\u673a\u5668\u4eba\u96f6\u6837\u672c\u5b8c\u6210\u771f\u5b9e\u73af\u5883\u957f\u7a0b\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": "HALO\u5728\u4e00\u5343\u4e2a\u7a0b\u5e8f\u751f\u6210\u7684\u4f4f\u5b85\u4e2d\u5408\u6210\u89c6\u89c9\u3001\u8bed\u8a00\u4e0e\u52a8\u4f5c\u914d\u5bf9\u6570\u636e\uff0c\u5b66\u4e60\u591a\u79cd\u4eba\u5f62\u673a\u5668\u4eba\u6280\u80fd\uff0c\u518d\u7ec4\u5408\u6280\u80fd\u6267\u884c\u957f\u7a0b\u4efb\u52a1\uff0c\u65e0\u9700\u771f\u5b9e\u4f4f\u5b85\u8bad\u7ec3\u5373\u53ef\u8fc1\u79fb\u3002", "why_notable": "\u5c06\u6570\u636e\u6269\u5c55\u4ece\u4eba\u5de5\u91c7\u96c6\u8f6c\u5411\u8ba1\u7b97\u9a71\u52a8\uff0c\u7f13\u89e3\u4eba\u5f62\u673a\u5668\u4eba\u76d1\u7763\u6570\u636e\u74f6\u9888\uff1b\u771f\u5b9e\u73af\u5883\u96f6\u6837\u672c\u7ed3\u679c\u663e\u793a\u4e86\u4eff\u771f\u8bad\u7ec3\u7684\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "Reasoning substantially improves language models\u0027 ability to solve difficult problems, but long reasoning traces make these gains expensive. Efficient reasoning should express useful analysis in fewer tokens by reducing repetition and text that adds little value to solving the problem. Progress in proprietary models motivates this goal, yet their hidden scratchpads limit direct study of how it is achieved. We investigate whether open-weight models can generate less verbose reasoning by changing the form of their own earlier thoughts, without retraining. Our intervention rewrites prior reasoning into compact state records before pending tool results are revealed, then compares continuations from original and compact histories. Across the tested models, accepted compact histories usually shorten future reasoning; a coding case study also shows less repeated verification after a shared candidate solution. In software-agent deployments, compaction can reduce total spending, although task quality and rewrite-inclusive time depend on the target and compressor. These findings identify reasoning history as one way to reduce future reasoning-token use and motivate model-specific compaction policies evaluated for both efficiency and retained capability.", "arxiv_id": "2611.03852", "arxiv_url": "https://arxiv.org/abs/2611.03852", "authors": ["Anton Hristov"], "brief": "\u7814\u7a76\u5728\u5de5\u5177\u7ed3\u679c\u63ed\u6653\u524d\uff0c\u5c06\u5f00\u653e\u6743\u91cd\u6a21\u578b\u7684\u65e2\u6709\u63a8\u7406\u538b\u7f29\u4e3a\u72b6\u6001\u8bb0\u5f55\uff0c\u518d\u5bf9\u6bd4\u539f\u59cb\u4e0e\u538b\u7f29\u5386\u53f2\u4e0b\u7684\u7eed\u5199\uff0c\u68c0\u9a8c\u5386\u53f2\u5f62\u5f0f\u5bf9\u540e\u7eed\u63a8\u7406\u548c\u667a\u80fd\u4f53\u5f00\u9500\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03852", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5de5\u5177\u7ed3\u679c\u63ed\u6653\u524d\u538b\u7f29\u5386\u53f2\uff0c\u5bf9\u7167\u4e24\u79cd\u5386\u53f2\u7684\u7eed\u5199", "\u88ab\u63a5\u53d7\u7684\u7d27\u51d1\u5386\u53f2\u901a\u5e38\u51cf\u5c11\u540e\u7eed\u63a8\u7406\u8bcd\u5143", "\u8f6f\u4ef6\u667a\u80fd\u4f53\u603b\u8d39\u7528\u53ef\u4e0b\u964d\uff0c\u8d28\u91cf\u4e0e\u8017\u65f6\u4f9d\u6a21\u578b\u800c\u5f02"], "keywords": ["\u63a8\u7406\u538b\u7f29", "\u5f00\u653e\u6743\u91cd\u6a21\u578b", "\u8f6f\u4ef6\u667a\u80fd\u4f53", "\u63a8\u7406\u6548\u7387"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03852v1", "published_at": "2026-11-02", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03852.png", "title": "Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost", "tldr": "\u5c06\u5df2\u6709\u63a8\u7406\u6539\u5199\u4e3a\u7d27\u51d1\u72b6\u6001\u8bb0\u5f55\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u7f29\u77ed\u540e\u7eed\u63a8\u7406\u5e76\u964d\u4f4e\u667a\u80fd\u4f53\u6210\u672c\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5728\u5de5\u5177\u7ed3\u679c\u63ed\u6653\u524d\uff0c\u5c06\u5f00\u653e\u6743\u91cd\u6a21\u578b\u7684\u65e2\u6709\u63a8\u7406\u538b\u7f29\u4e3a\u72b6\u6001\u8bb0\u5f55\uff0c\u518d\u5bf9\u6bd4\u539f\u59cb\u4e0e\u538b\u7f29\u5386\u53f2\u4e0b\u7684\u7eed\u5199\uff0c\u68c0\u9a8c\u5386\u53f2\u5f62\u5f0f\u5bf9\u540e\u7eed\u63a8\u7406\u548c\u667a\u80fd\u4f53\u5f00\u9500\u7684\u5f71\u54cd\u3002", "why_notable": "\u628a\u63a8\u7406\u5386\u53f2\u538b\u7f29\u4ece\u4e0a\u4e0b\u6587\u8282\u7701\u624b\u6bb5\u63a8\u8fdb\u5230\u540e\u7eed\u751f\u6210\u7684\u5e72\u9884\u673a\u5236\uff0c\u4e3a\u65e0\u9700\u91cd\u8bad\u7684\u964d\u672c\u63d0\u4f9b\u8def\u5f84\uff0c\u540c\u65f6\u5f3a\u8c03\u6309\u6a21\u578b\u8bc4\u4f30\u80fd\u529b\u4fdd\u7559\u3002"}, {"abstract": "Under stochastic decoding, a single context can elicit many different answers from a language model. Characterizing this variation typically requires many expensive autoregressive rollouts, each revealing only one realization. We ask whether the activations produced while reading the context can directly forecast the model\u0027s rollout activations. We train context--answer metamodels that map a context activation sequence to point or distribution forecasts of mean-pooled answer activations. We find that (i) the four metamodel families we study forecast mean-pooled answer activations with high fidelity, and the distribution metamodels also capture rollout variability; (ii) performance improves as the training set grows to 500,000 prompts, and the metamodels generalize zero-shot to out-of-domain datasets; (iii) their forecasts retain behavior-predictive signal; and (iv) context activations from Qwen2.5 predict mean-pooled answer activations from Qwen3.5 and Gemma 4, suggesting that activation forecasts can transfer across models. Together, these results suggest that context activation traces can support scalable forecasts of behaviors in LLM answers before the first answer token is generated.", "arxiv_id": "2611.06837", "arxiv_url": "https://arxiv.org/abs/2611.06837", "authors": ["Tommy He", "Thomas Jiralerspong"], "brief": "\u7814\u7a76\u8bad\u7ec3\u4e0a\u4e0b\u6587\u2014\u56de\u7b54\u5143\u6a21\u578b\uff0c\u5c06\u8bfb\u53d6\u4e0a\u4e0b\u6587\u65f6\u7684\u6fc0\u6d3b\u5e8f\u5217\u6620\u5c04\u4e3a\u56de\u7b54\u5e73\u5747\u6c60\u5316\u6fc0\u6d3b\u7684\u70b9\u9884\u6d4b\u6216\u5206\u5e03\u9884\u6d4b\uff0c\u5728\u751f\u6210\u9996\u4e2a\u56de\u7b54\u8bcd\u5143\u524d\u4f30\u8ba1\u540e\u7eed\u8868\u5f81\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06837", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u56db\u7c7b\u5143\u6a21\u578b\u5747\u80fd\u9ad8\u4fdd\u771f\u9884\u6d4b\uff0c\u5206\u5e03\u6a21\u578b\u6355\u6349\u751f\u6210\u53d8\u5f02", "\u8bad\u7ec3\u6269\u5c55\u81f350\u4e07\u63d0\u793a\uff0c\u652f\u6301\u57df\u5916\u6570\u636e\u96f6\u6837\u672c\u6cdb\u5316", "Qwen2.5\u6fc0\u6d3b\u53ef\u9884\u6d4bQwen3.5\u4e0eGemma 4\u56de\u7b54\u6fc0\u6d3b"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6fc0\u6d3b\u9884\u6d4b", "\u884c\u4e3a\u9884\u6d4b", "\u8de8\u6a21\u578b\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06837v1", "published_at": "2026-11-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Context--Answer Metamodels: Forecasting LLM Activations Before the First Answer Token", "tldr": "\u5229\u7528\u4e0a\u4e0b\u6587\u6fc0\u6d3b\u9884\u5224\u56de\u7b54\u9636\u6bb5\u7684\u5185\u90e8\u8868\u5f81\u53ca\u5176\u53d8\u5316\uff0c\u65e0\u9700\u53cd\u590d\u751f\u6210\u5b8c\u6574\u7b54\u6848\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u8bad\u7ec3\u4e0a\u4e0b\u6587\u2014\u56de\u7b54\u5143\u6a21\u578b\uff0c\u5c06\u8bfb\u53d6\u4e0a\u4e0b\u6587\u65f6\u7684\u6fc0\u6d3b\u5e8f\u5217\u6620\u5c04\u4e3a\u56de\u7b54\u5e73\u5747\u6c60\u5316\u6fc0\u6d3b\u7684\u70b9\u9884\u6d4b\u6216\u5206\u5e03\u9884\u6d4b\uff0c\u5728\u751f\u6210\u9996\u4e2a\u56de\u7b54\u8bcd\u5143\u524d\u4f30\u8ba1\u540e\u7eed\u8868\u5f81\u3002", "why_notable": "\u9884\u6d4b\u8868\u5f81\u4ecd\u4fdd\u7559\u884c\u4e3a\u9884\u6d4b\u4fe1\u53f7\uff0c\u4e3a\u51cf\u5c11\u6602\u8d35\u7684\u91cd\u590d\u751f\u6210\u63d0\u4f9b\u8def\u5f84\uff1b\u8de8\u6a21\u578b\u8fc1\u79fb\u7ed3\u679c\u8fdb\u4e00\u6b65\u663e\u793a\uff0c\u8fd9\u7c7b\u9884\u6d4b\u4e0d\u5fc5\u5c40\u9650\u4e8e\u5355\u4e00\u6a21\u578b\u3002"}, {"abstract": "Sample-efficient fluid intelligence requires agents that rapidly form working models of unfamiliar interactive environments. ARC-AGI-3 tests this across uninstructed visual games scored by Relative Human Action Efficiency, which penalizes exploratory waste quadratically. When frontier models read raw integer grids, serialization destroys spatial topology, and they spend hundreds of actions rediscovering basic boundaries and symmetries. We introduce SARBLOH, an open-weight agent built on the premise that spatial perception, not planning capacity, governs interactive reasoning on ARC-AGI-3. A zero-parameter O(HW) perception engine turns each frame, in 35 ms, into an object inventory with bipartite temporal tracking, a geometric briefing that separates proven invariants from affordance hypotheses, and an annotated canvas. Paired with a code-as-action runtime, the agent writes algorithmic hypotheses instead of low-level moves. Across eight presentations, grounded perception raises the rubric score from 3/28 to 25/28 points while cutting token use by 89.4%. On 23 held-out games, geometric invariants generalize with 100% accuracy, while single-frame affordance guesses fall to 6-50%, so active verification probes remain necessary. On the public set, Run A (briefing off) solved 143 of 183 levels in 8.2 hours at 59.4% single-pass efficiency; Run B (briefing on) reached 63.5%. Within the nine-hour budget on one Kaggle RTX PRO 6000 GPU, SARBLOH scored 16.53 on the hidden Kaggle evaluation, 13.7x the first Milestone winner.", "arxiv_id": "2611.06793", "arxiv_url": "https://arxiv.org/abs/2611.06793", "authors": ["Harsidak Singh Banwait"], "brief": "\u63d0\u51fa\u5f00\u653e\u6743\u91cd\u667a\u80fd\u4f53SARBLOH\uff0c\u5c06\u6574\u6570\u7f51\u683c\u8f6c\u4e3a\u5e26\u8de8\u5e27\u8ffd\u8e2a\u7684\u5bf9\u8c61\u6e05\u5355\u3001\u51e0\u4f55\u7b80\u62a5\u548c\u6807\u6ce8\u753b\u5e03\uff0c\u518d\u901a\u8fc7\u4ee3\u7801\u52a8\u4f5c\u8fd0\u884c\u65f6\u6267\u884c\u7b97\u6cd5\u5047\u8bbe\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06793", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u96f6\u53c2\u6570O(HW)\u611f\u77e5\u5f15\u64ce\u6bcf\u5e27\u8017\u65f635\u6beb\u79d2", "\u516b\u79cd\u5448\u73b0\u4e0b\u8bc4\u5206\u4ece3/28\u5347\u81f325/28\uff0c\u4ee4\u724c\u51cf\u5c1189.4%", "23\u4e2a\u7559\u51fa\u6e38\u620f\u4e2d\u51e0\u4f55\u4e0d\u53d8\u91cf\u51c6\u786e\u7387100%"], "keywords": ["\u7a7a\u95f4\u611f\u77e5", "\u4ea4\u4e92\u63a8\u7406", "\u667a\u80fd\u4f53", "\u6837\u672c\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06793v1", "published_at": "2026-11-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Transforming Integer Grids to Spatial Intuition: Perception, Not Planning, Governs ARC-AGI-3", "tldr": "\u901a\u8fc7\u663e\u5f0f\u7a7a\u95f4\u611f\u77e5\u4e0e\u4ee3\u7801\u52a8\u4f5c\uff0c\u663e\u8457\u63d0\u5347\u4ea4\u4e92\u63a8\u7406\u6548\u7387\uff0c\u63ed\u793a\u611f\u77e5\u74f6\u9888\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u5f00\u653e\u6743\u91cd\u667a\u80fd\u4f53SARBLOH\uff0c\u5c06\u6574\u6570\u7f51\u683c\u8f6c\u4e3a\u5e26\u8de8\u5e27\u8ffd\u8e2a\u7684\u5bf9\u8c61\u6e05\u5355\u3001\u51e0\u4f55\u7b80\u62a5\u548c\u6807\u6ce8\u753b\u5e03\uff0c\u518d\u901a\u8fc7\u4ee3\u7801\u52a8\u4f5c\u8fd0\u884c\u65f6\u6267\u884c\u7b97\u6cd5\u5047\u8bbe\u3002", "why_notable": "\u7ed3\u679c\u51f8\u663e\u7a7a\u95f4\u8868\u5f81\u5bf9\u4ea4\u4e92\u63a8\u7406\u6548\u7387\u7684\u4ef7\u503c\uff1b\u4f46\u5355\u5e27\u53ef\u4f9b\u6027\u63a8\u65ad\u51c6\u786e\u7387\u4ec56%\u81f350%\uff0c\u4ecd\u9700\u4e3b\u52a8\u63a2\u6d4b\u9a8c\u8bc1\u3002"}, {"abstract": "Defenders and attackers race to find the same software flaws. I use the launch of Project Glasswing, which gave a small group of large US tech firms early access to Claude Mythos Preview, a model for finding software vulnerabilities, to study how access to frontier AI affects defenders, external researchers, and attackers. Using the universe of publicly disclosed vulnerabilities, I find that firms with access more than doubled their disclosures relative to Chinese and Russian tech firms without access, disclosed about 150 percent more high-impact vulnerabilities, and fixed reported flaws as quickly as before. As treated firms found more flaws themselves, external researchers, who sell their findings through bug bounties, reported about half as many vulnerabilities in treated firms\u0027 code and more in other firms\u0027 code, without leaving the market. There is no evidence that attackers exploited the additional vulnerabilities: the share exploited within a month of disclosure fell by about two thirds, mainly because a smaller share was already exploited when disclosed, while the number exploited did not change. Frontier AI helped defenders find and fix more flaws before attackers exploited them, but its restricted release creates an asymmetry in software security between firms in different countries.", "arxiv_id": "2611.06629", "arxiv_url": "https://arxiv.org/abs/2611.06629", "authors": ["Thomas Mosk"], "brief": "\u7814\u7a76\u5229\u7528Project Glasswing\u5411\u90e8\u5206\u7f8e\u56fd\u79d1\u6280\u4f01\u4e1a\u63d0\u524d\u5f00\u653e\u6f0f\u6d1e\u53d1\u73b0\u6a21\u578b\u7684\u4e8b\u4ef6\uff0c\u5206\u6790\u5168\u90e8\u516c\u5f00\u62ab\u9732\u6f0f\u6d1e\uff0c\u6bd4\u8f83\u83b7\u51c6\u4f01\u4e1a\u4e0e\u672a\u83b7\u51c6\u4e2d\u4fc4\u4f01\u4e1a\u7684\u53d8\u5316\u3002", "categories": ["econ.GN", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06629", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u83b7\u51c6\u4f01\u4e1a\u6f0f\u6d1e\u62ab\u9732\u8d85\u7ffb\u500d\uff0c\u9ad8\u5f71\u54cd\u6f0f\u6d1e\u589e\u7ea6150%", "\u5916\u90e8\u7814\u7a76\u5458\u5411\u83b7\u51c6\u4f01\u4e1a\u62a5\u544a\u6f0f\u6d1e\u7ea6\u51cf\u534a\uff0c\u8f6c\u5411\u5176\u4ed6\u4f01\u4e1a", "\u62ab\u9732\u540e\u4e00\u6708\u5185\u88ab\u5229\u7528\u5360\u6bd4\u964d\u7ea6\u4e09\u5206\u4e4b\u4e8c\uff0c\u6570\u91cf\u672a\u53d8"], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u6f0f\u6d1e\u53d1\u73b0", "\u524d\u6cbf\u6a21\u578b", "\u6280\u672f\u51c6\u5165"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06629v1", "published_at": "2026-11-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Does Frontier AI Strengthen Cyber Defense? Evidence from Project Glasswing", "tldr": "\u524d\u6cbfAI\u8ba9\u83b7\u51c6\u4f01\u4e1a\u66f4\u65e9\u53d1\u73b0\u5e76\u4fee\u590d\u6f0f\u6d1e\uff0c\u4f46\u53d7\u9650\u5f00\u653e\u6269\u5927\u8de8\u56fd\u5b89\u5168\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5229\u7528Project Glasswing\u5411\u90e8\u5206\u7f8e\u56fd\u79d1\u6280\u4f01\u4e1a\u63d0\u524d\u5f00\u653e\u6f0f\u6d1e\u53d1\u73b0\u6a21\u578b\u7684\u4e8b\u4ef6\uff0c\u5206\u6790\u5168\u90e8\u516c\u5f00\u62ab\u9732\u6f0f\u6d1e\uff0c\u6bd4\u8f83\u83b7\u51c6\u4f01\u4e1a\u4e0e\u672a\u83b7\u51c6\u4e2d\u4fc4\u4f01\u4e1a\u7684\u53d8\u5316\u3002", "why_notable": "\u63d0\u4f9b\u524d\u6cbfAI\u6539\u5584\u7f51\u7edc\u9632\u5fa1\u7684\u5b9e\u8bc1\u8bc1\u636e\uff1a\u53d1\u73b0\u66f4\u591a\u6f0f\u6d1e\u4e14\u4fee\u590d\u901f\u5ea6\u672a\u964d\uff0c\u540c\u65f6\u63ed\u793a\u53d7\u9650\u5f00\u653e\u9020\u6210\u7684\u8de8\u56fd\u5b89\u5168\u4e0d\u5bf9\u79f0\u3002"}, {"abstract": "AI agents rely on third-party tools, such as Model Context Protocol (MCP) servers, whose publishers can be authenticated and whose execution can be restricted by runtime security policies. Yet authenticity does not guarantee benign behaviour: a legitimately signed tool may perform its advertised function while concealing malicious code that leaks confidential information. We demonstrate this trust failure with a signed MCP tool that embeds sensitive data in requests to a policy-allowed destination. Meta\u0027s MCPGuard-Dynamic, a state-of-the-art runtime defence, blocks a direct exfiltration attempt in the same run, yet fails to prevent this attack in every trial. We introduce germline execution, which limits information disclosure without inspecting or trusting tool implementations. Each tool invocation runs in ephemeral copies forked from a data-free germline process, each receiving only information authorised for its destination. Even if malicious code executes, what it can disclose is bounded by the data available to its copy. Under explicit assumptions on copy confinement and a data-free germline, we prove sink noninterference for every signed release and, for releases deterministic within our replay model, show that a verified witness establishes a flow violation. Across 153 attack runs, no unauthorised disclosure was detected under germline execution, compared with 5.9-74.5% of runs under baseline defences and an ablation. Invocations served by a single copy completed in 10-49 ms, 2-28x faster than restarting the tool for every invocation, the conventional way to clear state. These results show that data-isolated execution protects agent toolchains against malicious code concealed within authenticated software.", "arxiv_id": "2611.06585", "arxiv_url": "https://arxiv.org/abs/2611.06585", "authors": ["Yichiet Aun", "Mohammed A. Alhartomi", "Jing Jie Tan", "Waqas Nadeem", "Adeb Salh", "Shankar Karuppayah", "Sin Chee Tan"], "brief": "\u63d0\u51fa\u80da\u7cfb\u6267\u884c\u673a\u5236\uff1a\u6bcf\u6b21\u5de5\u5177\u8c03\u7528\u4ece\u65e0\u6570\u636e\u8fdb\u7a0b\u6d3e\u751f\u4e34\u65f6\u526f\u672c\uff0c\u4ec5\u6ce8\u5165\u76ee\u7684\u5730\u83b7\u6388\u6743\u7684\u6570\u636e\u3002\u65e0\u9700\u68c0\u67e5\u6216\u4fe1\u4efb\u5de5\u5177\u4ee3\u7801\uff0c\u5373\u53ef\u9650\u5236\u6076\u610f\u4ee3\u7801\u7684\u6cc4\u9732\u8303\u56f4\u3002", "categories": ["cs.CR", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06585", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5728\u526f\u672c\u9694\u79bb\u4e0e\u65e0\u6570\u636e\u80da\u7cfb\u5047\u8bbe\u4e0b\u8bc1\u660e\u6c47\u70b9\u975e\u5e72\u6270\u6027", "153\u6b21\u653b\u51fb\u4e2d\u672a\u68c0\u51fa\u672a\u6388\u6743\u6cc4\u9732\uff0c\u57fa\u7ebf\u6700\u9ad874.5%", "\u5355\u526f\u672c\u8c03\u7528\u8017\u65f610\u201349\u6beb\u79d2\uff0c\u6bd4\u9010\u6b21\u91cd\u542f\u5feb2\u201328\u500d"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u4fe1\u606f\u6d41\u63a7\u5236", "\u6570\u636e\u9694\u79bb", "MCP"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06585v1", "published_at": "2026-11-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Signed, Sealed, Leaked: Trust Beyond Signature for MCP Toolchains", "tldr": "\u901a\u8fc7\u6309\u76ee\u7684\u5730\u9694\u79bb\u5de5\u5177\u53ef\u89c1\u6570\u636e\uff0c\u963b\u65ad\u5df2\u7b7e\u540d\u6076\u610f\u5de5\u5177\u6cc4\u9732\u673a\u5bc6\u4fe1\u606f", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u80da\u7cfb\u6267\u884c\u673a\u5236\uff1a\u6bcf\u6b21\u5de5\u5177\u8c03\u7528\u4ece\u65e0\u6570\u636e\u8fdb\u7a0b\u6d3e\u751f\u4e34\u65f6\u526f\u672c\uff0c\u4ec5\u6ce8\u5165\u76ee\u7684\u5730\u83b7\u6388\u6743\u7684\u6570\u636e\u3002\u65e0\u9700\u68c0\u67e5\u6216\u4fe1\u4efb\u5de5\u5177\u4ee3\u7801\uff0c\u5373\u53ef\u9650\u5236\u6076\u610f\u4ee3\u7801\u7684\u6cc4\u9732\u8303\u56f4\u3002", "why_notable": "\u63ed\u793a\u7b7e\u540d\u8ba4\u8bc1\u548c\u8fd0\u884c\u65f6\u7b56\u7565\u4ecd\u53ef\u80fd\u653e\u8fc7\u9690\u853d\u6cc4\u9732\uff0c\u5c06\u9632\u62a4\u91cd\u70b9\u8f6c\u5411\u6570\u636e\u53ef\u89c1\u6027\uff0c\u4e3a\u667a\u80fd\u4f53\u7b2c\u4e09\u65b9\u5de5\u5177\u94fe\u63d0\u4f9b\u53ef\u8bc1\u660e\u4e14\u4f4e\u5f00\u9500\u7684\u9694\u79bb\u65b9\u6848\u3002"}, {"abstract": "Large language models (LLMs) undergo safety alignment to prevent harmful generations, yet they remain vulnerable to jailbreak attacks. Recent work reveals a deeper structural weakness: safety alignment can be highly sparse, such that pruning a small number of safety-critical neurons or ablating a single refusal direction can substantially undermine aligned behavior. In this work, we take the first steps toward strengthening safety alignment such that it is less dependent on sparse model components. We propose Addition by Subtraction, which gradually removes identified safety-critical neurons during finetuning and uses preference optimization to re-establish safety-aligned behavior through other parts of the model. Our results show that the resulting models are substantially more robust to pruning-based attacks. Remarkably, these benefits generalize beyond the white-box attacks motivating our design: Addition by Subtraction improves robustness against other sparsity-based interventions, including refusal-direction ablation, as well as a broad range of black-box jailbreak attacks. The finetuned models also exhibit improved truthfulness while largely preserving general capabilities. Comprehensive experiments across four models from three vendors demonstrate consistent improvements in safety robustness, reducing attack success rates by up to 90% for some attacks.", "arxiv_id": "2611.06553", "arxiv_url": "https://arxiv.org/abs/2611.06553", "authors": ["Hamid Dashtbani", "Alexandra Dmitrienko"], "brief": "\u7814\u7a76\u63d0\u51fa Addition by Subtraction\uff0c\u5728\u5fae\u8c03\u4e2d\u9010\u6b65\u79fb\u9664\u5b89\u5168\u5173\u952e\u795e\u7ecf\u5143\uff0c\u518d\u7528\u504f\u597d\u4f18\u5316\u8ba9\u5176\u4ed6\u6a21\u578b\u7ec4\u4ef6\u91cd\u65b0\u627f\u62c5\u5b89\u5168\u5bf9\u9f50\u529f\u80fd\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.06553", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9010\u6b65\u79fb\u9664\u5b89\u5168\u5173\u952e\u795e\u7ecf\u5143\uff0c\u7ed3\u5408\u504f\u597d\u4f18\u5316\u91cd\u5efa\u5b89\u5168\u884c\u4e3a", "\u8986\u76d6\u4e09\u5bb6\u5382\u5546\u7684\u56db\u4e2a\u6a21\u578b\uff0c\u90e8\u5206\u653b\u51fb\u6210\u529f\u7387\u964d\u4f4e\u8fbe90%", "\u9c81\u68d2\u6027\u63d0\u5347\u6cdb\u5316\u81f3\u62d2\u7edd\u65b9\u5411\u6d88\u878d\u4e0e\u9ed1\u76d2\u8d8a\u72f1\u653b\u51fb"], "keywords": ["\u5b89\u5168\u5bf9\u9f50", "\u795e\u7ecf\u5143\u526a\u679d", "\u504f\u597d\u4f18\u5316", "\u8d8a\u72f1\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.06553v1", "published_at": "2026-11-04", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Addition by Subtraction: Toward Mitigating Fragile Safety Alignment in Large Language Models", "tldr": "\u901a\u8fc7\u9010\u6b65\u79fb\u9664\u5b89\u5168\u5173\u952e\u795e\u7ecf\u5143\u5e76\u91cd\u65b0\u5bf9\u9f50\uff0c\u8ba9\u6a21\u578b\u5b89\u5168\u673a\u5236\u66f4\u6297\u526a\u679d\u4e0e\u8d8a\u72f1\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u63d0\u51fa Addition by Subtraction\uff0c\u5728\u5fae\u8c03\u4e2d\u9010\u6b65\u79fb\u9664\u5b89\u5168\u5173\u952e\u795e\u7ecf\u5143\uff0c\u518d\u7528\u504f\u597d\u4f18\u5316\u8ba9\u5176\u4ed6\u6a21\u578b\u7ec4\u4ef6\u91cd\u65b0\u627f\u62c5\u5b89\u5168\u5bf9\u9f50\u529f\u80fd\u3002", "why_notable": "\u5b83\u5c1d\u8bd5\u7f13\u89e3\u5b89\u5168\u5bf9\u9f50\u4f9d\u8d56\u5c11\u91cf\u7ec4\u4ef6\u7684\u7ed3\u6784\u6027\u5f31\u70b9\uff0c\u4e0d\u4ec5\u589e\u5f3a\u6297\u653b\u51fb\u80fd\u529b\uff0c\u8fd8\u63d0\u5347\u771f\u5b9e\u6027\uff0c\u5e76\u57fa\u672c\u4fdd\u7559\u901a\u7528\u80fd\u529b\u3002"}, {"abstract": "Can a neural network learn to render 3D Gaussian splats on its own, with no rasterizer in the renderer? We present GaussianRenderFormer, a transformer that takes a set of Gaussians and a camera and outputs the image directly. Each Gaussian becomes one token in a view-independent encoder, and a view-dependent decoder turns small patches of camera rays into pixels by attending to those tokens. Trained on 26,820 Objaverse objects pruned to 20,000 Gaussians each, GaussianRenderFormer renders 300 unseen objects at 38.08 dB PSNR against the full, unpruned splats, while rasterizing the same pruned input reaches 44.02 dB. The gap is not one of generalization, and our diagnostics are consistent with a bottleneck in the view decoder: telling it the projected footprint of each Gaussian, which it could in principle infer, adds 1.4 dB. Under-training is not ruled out. Code, trained models and videos: https://svlwoof.github.io/gaussianrenderformer", "arxiv_id": "2611.05593", "arxiv_url": "
