d": "2609.01120", "arxiv_url": "https://arxiv.org/abs/2609.01120", "authors": ["Woong-Chan Byun", "Seung-Hyun Kong"], "brief": "\u8bba\u6587\u63d0\u51fa DNC-IMM \u65b9\u6cd5\uff0c\u7528\u795e\u7ecf\u7f51\u7edc\u6839\u636e\u9a7e\u9a76\u4e0a\u4e0b\u6587\u6821\u51c6 IMM \u7684\u8f6c\u79fb\u6982\u7387\u548c\u6d4b\u91cf\u4f3c\u7136\uff0c\u7528\u4e8e\u66f4\u65e9\u8bc6\u522b\u8f66\u8f86\u6362\u9053\u610f\u56fe\u3002\u8be5\u65b9\u6cd5\u5728 highD \u6570\u636e\u96c6\u4e0a\u80fd\u5728\u8de8\u7ebf\u524d\u53ef\u9760\u9884\u6d4b\uff0c\u5c24\u5176\u5728\u63d0\u524d 2-3 \u79d2\u7684\u65e9\u671f\u9884\u6d4b\u573a\u666f\u8868\u73b0\u66f4\u5f3a\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01120", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u610f\u56fe\u8bc6\u522b", "\u795e\u7ecf\u7f51\u7edc", "\u8f66\u8f86\u6362\u9053"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01120v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DNC-IMM: Early Lane-Change Intention Recognition via Neural Calibration Based on Driving Context Information", "tldr": "\u8bba\u6587\u63d0\u51fa DNC-IMM \u65b9\u6cd5\uff0c\u7528\u795e\u7ecf\u7f51\u7edc\u6839\u636e\u9a7e\u9a76\u4e0a\u4e0b\u6587\u6821\u51c6 IMM \u7684\u8f6c\u79fb\u6982\u7387\u548c\u6d4b\u91cf\u4f3c\u7136\uff0c\u7528\u4e8e\u66f4\u65e9\u8bc6\u522b\u8f66\u8f86\u6362\u9053\u610f\u56fe\u3002\u8be5\u65b9\u6cd5\u5728 highD \u6570\u636e\u96c6\u4e0a\u80fd\u5728\u8de8\u7ebf\u524d\u53ef\u9760\u9884\u6d4b\uff0c\u5c24\u5176\u5728\u63d0\u524d 2-3 \u79d2\u7684\u65e9\u671f\u9884\u6d4b\u573a\u666f\u8868\u73b0\u66f4\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chain-of-thought reasoning unfolds in discrete token space: each step is committed as text, errors propagate, and eliciting good traces presupposes traces to imitate. Reasoning instead in a model\u0027s continuous representation space - where intermediate states are vectors rather than words - sidesteps these constraints, but leaves open how those latent states should be computed. We approach this along two axes. First, we keep a large language model (LLM) frozen and use it for what it is already good at - modeling and decoding sequences - while a small auxiliary network supplies continuous latent thoughts as input. Second, we produce those latents by recurrence: a tiny recurrent reasoner refines them over many steps, decoupling the depth of computation from the size of the model, so that the latents are a product of iterative processing rather than a single forward pass. We instantiate this as Latent Recurrent Thoughts (LRT): a task-dedicated proposer supplies base latents, a recurrent reasoner refines them through bounded residual corrections, and the frozen LLM decodes the answer. On symbolic reasoning with answer supervision but no reasoning traces (Countdown-4, Sudoku) and on natural-language reasoning (HumanEval, MBPP, StrategyQA), LRT substantially outperforms prior frozen-decoder continuous-space reasoning methods under an identical decoder, prompt, data, and training budget, and outperforms non-thinking-mode chain-of-thought prompting on the same backbone at a small fraction of its inference compute.", "arxiv_id": "2609.01117", "arxiv_url": "https://arxiv.org/abs/2609.01117", "authors": ["Zhaoliang Chen", "Jie Fu"], "brief": "\u8bba\u6587\u63d0\u51fa Latent Recurrent Thoughts\uff08LRT\uff09\uff0c\u5728\u51bb\u7ed3\u5927\u8bed\u8a00\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\uff0c\u7528\u5c0f\u578b\u5faa\u73af\u63a8\u7406\u5668\u5728\u8fde\u7eed\u6f5c\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u7ec6\u5316\u201c\u601d\u8003\u201d\u5411\u91cf\uff0c\u518d\u7531\u51bb\u7ed3 LLM \u89e3\u7801\u7b54\u6848\u3002\u8be5\u65b9\u6cd5\u5728\u7b26\u53f7\u63a8\u7406\u548c\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u4ee5\u5f80\u51bb\u7ed3\u89e3\u7801\u5668\u7684\u8fde\u7eed\u7a7a\u95f4\u63a8\u7406\u65b9\u6cd5\uff0c\u5e76\u4ee5\u66f4\u4f4e\u63a8\u7406\u5f00\u9500\u8d85\u8fc7\u975e thinking \u6a21\u5f0f\u7684 CoT \u63d0\u793a\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01117", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u6f5c\u7a7a\u95f4", "\u5faa\u73af\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01117v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Latent Recurrent Thoughts: Recurrent Refinement of Proposed Latents for Reasoning with Frozen LLMs", "tldr": "\u8bba\u6587\u63d0\u51fa Latent Recurrent Thoughts\uff08LRT\uff09\uff0c\u5728\u51bb\u7ed3\u5927\u8bed\u8a00\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\uff0c\u7528\u5c0f\u578b\u5faa\u73af\u63a8\u7406\u5668\u5728\u8fde\u7eed\u6f5c\u7a7a\u95f4\u4e2d\u8fed\u4ee3\u7ec6\u5316\u201c\u601d\u8003\u201d\u5411\u91cf\uff0c\u518d\u7531\u51bb\u7ed3 LLM \u89e3\u7801\u7b54\u6848\u3002\u8be5\u65b9\u6cd5\u5728\u7b26\u53f7\u63a8\u7406\u548c\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u4efb\u52a1\u4e0a\u663e\u8457\u4f18\u4e8e\u4ee5\u5f80\u51bb\u7ed3\u89e3\u7801\u5668\u7684\u8fde\u7eed\u7a7a\u95f4\u63a8\u7406\u65b9\u6cd5\uff0c\u5e76\u4ee5\u66f4\u4f4e\u63a8\u7406\u5f00\u9500\u8d85\u8fc7\u975e thinking \u6a21\u5f0f\u7684 CoT \u63d0\u793a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Dialectal Arabic (DA) remains under-resourced compared to Modern Standard Arabic (MSA), particularly for machine reading comprehension (MRC) and question answering (QA). Existing Arabic QA benchmarks primarily focus on formal written MSA or multiple-choice QA, with limited coverage of naturally spoken dialects. Here, we aim to bridge this gap. We introduce EDRAC, the first large-scale benchmark for dialectal Arabic machine reading comprehension (MRC) and generative QA, covering five major dialects: Egyptian, Moroccan, Emirati, Syrian, and Saudi Arabic. EDRAC contains 499 passages derived from naturally occurring spoken interactions and 4,977 corresponding QA pairs generated through a human--LLM collaborative pipeline combining iterative generation, LLM-as-a-judge evaluation, and human verification. We benchmark Arabic-centric and multilingual LLMs on EDRAC using lexical and semantic metrics. Our results reveal substantial gaps between semantic answer quality and dialectal fidelity, highlighting the limitations of existing evaluation metrics for dialectal Arabic generation. EDRAC provides a realistic and challenging MRC benchmark for future research on dialectal Arabic NLP.", "arxiv_id": "2609.01113", "arxiv_url": "https://arxiv.org/abs/2609.01113", "authors": ["Noor Abo Mokh", "Kirill Chirkunov", "Teresa Lynn", "Nizar Habash", "Reham Marzouk", "Malik H. Altakrori", "Younes Samih", "Muhammed Abu Odeh", "Nour Rabih", "Rahaf Alshahrani", "Hamad Alshehhi", "Hamdan Al-Ali", "Muhra Almahri", "Besher Hassan", "Mohamed Anwar", "Abed Alhakim Freihat", "Preslav Nakov", "Alham Fikri Aji"], "brief": "\u672c\u6587\u63d0\u51fa EDRAC\uff0c\u9996\u4e2a\u5927\u89c4\u6a21\u963f\u62c9\u4f2f\u65b9\u8a00\u673a\u5668\u9605\u8bfb\u7406\u89e3\u4e0e\u751f\u6210\u5f0f\u95ee\u7b54\u57fa\u51c6\uff0c\u8986\u76d6\u57c3\u53ca\u3001\u6469\u6d1b\u54e5\u3001\u963f\u8054\u914b\u3001\u53d9\u5229\u4e9a\u548c\u6c99\u7279\u4e94\u79cd\u65b9\u8a00\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u963f\u8bed\u548c\u591a\u8bed\u5927\u6a21\u578b\u5728\u8bed\u4e49\u7b54\u6848\u8d28\u91cf\u4e0e\u65b9\u8a00\u5fe0\u5b9e\u5ea6\u4e4b\u95f4\u5b58\u5728\u660e\u663e\u5dee\u8ddd\uff0c\u4e5f\u66b4\u9732\u4e86\u73b0\u6709\u8bc4\u6d4b\u6307\u6807\u5bf9\u65b9\u8a00\u751f\u6210\u7684\u4e0d\u8db3\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01113", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9605\u8bfb\u7406\u89e3", "\u95ee\u7b54\u7cfb\u7edf", "\u963f\u62c9\u4f2f\u8bed\u65b9\u8a00", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01113v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EDRAC: Benchmarking Arabic Dialect Reading Comprehension", "tldr": "\u672c\u6587\u63d0\u51fa EDRAC\uff0c\u9996\u4e2a\u5927\u89c4\u6a21\u963f\u62c9\u4f2f\u65b9\u8a00\u673a\u5668\u9605\u8bfb\u7406\u89e3\u4e0e\u751f\u6210\u5f0f\u95ee\u7b54\u57fa\u51c6\uff0c\u8986\u76d6\u57c3\u53ca\u3001\u6469\u6d1b\u54e5\u3001\u963f\u8054\u914b\u3001\u53d9\u5229\u4e9a\u548c\u6c99\u7279\u4e94\u79cd\u65b9\u8a00\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u963f\u8bed\u548c\u591a\u8bed\u5927\u6a21\u578b\u5728\u8bed\u4e49\u7b54\u6848\u8d28\u91cf\u4e0e\u65b9\u8a00\u5fe0\u5b9e\u5ea6\u4e4b\u95f4\u5b58\u5728\u660e\u663e\u5dee\u8ddd\uff0c\u4e5f\u66b4\u9732\u4e86\u73b0\u6709\u8bc4\u6d4b\u6307\u6807\u5bf9\u65b9\u8a00\u751f\u6210\u7684\u4e0d\u8db3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When a hint turns a failing generated program into a passing one, does it provide missing information or merely steer the model toward a solution it could already produce? We test these hypotheses on HumanEval+ and MBPP+ using executable evaluation. For Qwen2.5-3B-Instruct, adaptive relevant hints rescue 36 of 79 selected failures; an unrelated hint rescues 19, while eight unhinted samples solve 46 and recover 31 of the 36 relevant-hint rescues. Phi-3.5-mini shows the same pattern: relevant hints rescue 42 of 101 failures, an unrelated hint rescues 17, and unhinted sampling solves 57, including 36 of the 42 relevant-hint rescues. Because the hint conditions use different attempt budgets, these comparisons do not isolate a purely semantic effect. Mechanistic tests on Qwen identify a stable activation direction shared by relevant and unrelated hints. Persistently adding this direction yields 14 rescues and 18 regressions, with no detectable net accuracy gain; learned low-rank interventions have a positive but imprecise estimated effect. Full textual specifications solve 22 of 24 context-defined problems, versus 5-11 for tested virtual-KV prefixes. Post-generation hidden-state probes transfer across benchmarks, with pooled AUROC 0.806 and 0.780, but their top-one selection advantage over token confidence is statistically unresolved. Overall, relevant hints can rescue failures, but most rescued solutions are already reachable through ordinary sampling, and the internal interventions tested here do not establish task-general capability transfer.", "arxiv_id": "2609.01106", "arxiv_url": "https://arxiv.org/abs/2609.01106", "authors": ["Will Badr"], "brief": "\u672c\u6587\u8bc4\u4f30\u4ee3\u7801\u751f\u6210\u4e2d\u201c\u63d0\u793a\u201d\u662f\u5426\u771f\u6b63\u5e26\u6765\u6280\u80fd\u8fc1\u79fb\uff0c\u8fd8\u662f\u53ea\u662f\u628a\u6a21\u578b\u5f15\u5411\u5176\u672c\u5df2\u80fd\u91c7\u6837\u51fa\u7684\u89e3\u3002\u5728 HumanEval+ \u548c MBPP+ \u4e0a\uff0c\u76f8\u5173\u63d0\u793a\u786e\u5b9e\u80fd\u4fee\u590d\u90e8\u5206\u5931\u8d25\u6837\u4f8b\uff0c\u4f46\u591a\u6570\u88ab\u4fee\u590d\u89e3\u4e5f\u53ef\u901a\u8fc7\u65e0\u63d0\u793a\u591a\u6b21\u91c7\u6837\u83b7\u5f97\uff1b\u673a\u5236\u5e72\u9884\u548c\u9690\u85cf\u72b6\u6001\u63a2\u9488\u672a\u80fd\u8bc1\u660e\u7a33\u5b9a\u7684\u4efb\u52a1\u901a\u7528\u80fd\u529b\u8fc1\u79fb\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01106", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u80fd\u529b\u8fc1\u79fb", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01106v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hints Help But Do They Teach? Evaluating Skills Transfer in Code Generation", "tldr": "\u672c\u6587\u8bc4\u4f30\u4ee3\u7801\u751f\u6210\u4e2d\u201c\u63d0\u793a\u201d\u662f\u5426\u771f\u6b63\u5e26\u6765\u6280\u80fd\u8fc1\u79fb\uff0c\u8fd8\u662f\u53ea\u662f\u628a\u6a21\u578b\u5f15\u5411\u5176\u672c\u5df2\u80fd\u91c7\u6837\u51fa\u7684\u89e3\u3002\u5728 HumanEval+ \u548c MBPP+ \u4e0a\uff0c\u76f8\u5173\u63d0\u793a\u786e\u5b9e\u80fd\u4fee\u590d\u90e8\u5206\u5931\u8d25\u6837\u4f8b\uff0c\u4f46\u591a\u6570\u88ab\u4fee\u590d\u89e3\u4e5f\u53ef\u901a\u8fc7\u65e0\u63d0\u793a\u591a\u6b21\u91c7\u6837\u83b7\u5f97\uff1b\u673a\u5236\u5e72\u9884\u548c\u9690\u85cf\u72b6\u6001\u63a2\u9488\u672a\u80fd\u8bc1\u660e\u7a33\u5b9a\u7684\u4efb\u52a1\u901a\u7528\u80fd\u529b\u8fc1\u79fb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models often answer the same multiple-choice question inconsistently when it is posed under support-oriented and elimination-oriented framings. We investigate whether these discrepancies arise from different internal representations induced by the two framings. We introduce a dual-framing protocol with minimally varied prompts that use either support- or elimination-oriented framing while keeping the evaluation target fixed. To probe the internal computation, we append an untrained special token, [STATE], and treat its residual-stream activation as an intervention interface. Across both models, the two framings induce separable [STATE] activations concentrated in intermediate layers. Swapping these activations between paired prompts systematically changes predictions and improves cross-framing agreement, providing intervention-based evidence that the activations are behaviorally relevant. Beyond instance-level substitution, mean-difference steering directions derived from the dual-framing contrast exhibit more bounded layer-wise responses than matched contrastive activation addition directions under the evaluated protocol.", "arxiv_id": "2609.01081", "arxiv_url": "https://arxiv.org/abs/2609.01081", "authors": ["Chao Gao", "Haijiang Liu", "Qiyuan Li", "Caicai Guo", "Frank van Harmelen", "Jinguang Gu"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u591a\u9009\u9898\u4e2d\u56e0\u201c\u652f\u6301\u5f0f\u201d\u4e0e\u201c\u6392\u9664\u5f0f\u201d\u63d0\u95ee\u6846\u67b6\u4e0d\u540c\u800c\u4ea7\u751f\u7b54\u6848\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002\u4f5c\u8005\u901a\u8fc7\u52a0\u5165\u672a\u8bad\u7ec3\u7684\u7279\u6b8a\u6807\u8bb0 [STATE] \u63a2\u6d4b\u4e2d\u95f4\u5c42\u6b8b\u5dee\u6d41\u8868\u793a\uff0c\u53d1\u73b0\u4e24\u79cd\u6846\u67b6\u4f1a\u8bf1\u5bfc\u53ef\u5206\u79bb\u7684\u9690\u85cf\u72b6\u6001\uff1b\u4ea4\u6362\u8fd9\u4e9b\u72b6\u6001\u80fd\u7cfb\u7edf\u6027\u6539\u53d8\u9884\u6d4b\u5e76\u63d0\u5347\u8de8\u6846\u67b6\u4e00\u81f4\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01081", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027", "\u8868\u793a\u5e72\u9884", "\u591a\u9009\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01081v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "StateSwap: Probing Support-Elimination Hidden States in Multiple-Choice Questions", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u591a\u9009\u9898\u4e2d\u56e0\u201c\u652f\u6301\u5f0f\u201d\u4e0e\u201c\u6392\u9664\u5f0f\u201d\u63d0\u95ee\u6846\u67b6\u4e0d\u540c\u800c\u4ea7\u751f\u7b54\u6848\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002\u4f5c\u8005\u901a\u8fc7\u52a0\u5165\u672a\u8bad\u7ec3\u7684\u7279\u6b8a\u6807\u8bb0 [STATE] \u63a2\u6d4b\u4e2d\u95f4\u5c42\u6b8b\u5dee\u6d41\u8868\u793a\uff0c\u53d1\u73b0\u4e24\u79cd\u6846\u67b6\u4f1a\u8bf1\u5bfc\u53ef\u5206\u79bb\u7684\u9690\u85cf\u72b6\u6001\uff1b\u4ea4\u6362\u8fd9\u4e9b\u72b6\u6001\u80fd\u7cfb\u7edf\u6027\u6539\u53d8\u9884\u6d4b\u5e76\u63d0\u5347\u8de8\u6846\u67b6\u4e00\u81f4\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Crystal generators can now propose periodic structures, but their control interfaces remain poorly matched to the mixed descriptors used in materials design. Text provides a compact way to combine composition, symmetry, prototype and property cues, yet it has not been clear whether such information can steer flow-based crystal generation. Here we introduce TFMat, a text-conditioned flow-matching framework that uses structured materials language as a semantic prior for a CrystalFlow generator. Across Perov-5, Carbon-24 and MP-20 crystal structure prediction benchmarks, TFMat improves one-candidate match rates over CrystalFlow and reaches a 92.04% MP-20 match rate with 20 candidates; in de novo generation, it improves element-count and density distribution alignment while retaining coarse property consistency in composition-selected outputs. These results position structured text as an inspectable control layer for translating human-readable materials intent into candidate crystals for downstream simulation and validation.", "arxiv_id": "2609.01076", "arxiv_url": "https://arxiv.org/abs/2609.01076", "authors": ["Wentao Li"], "brief": "\u8bba\u6587\u63d0\u51fa TFMat\uff0c\u5c06\u7ed3\u6784\u5316\u6750\u6599\u6587\u672c\u4f5c\u4e3a\u8bed\u4e49\u5148\u9a8c\uff0c\u5f15\u5bfc CrystalFlow \u7684\u6d41\u5339\u914d\u6676\u4f53\u7ed3\u6784\u751f\u6210\u3002\u5b83\u5728 Perov-5\u3001Carbon-24\u3001MP-20 \u7b49\u57fa\u51c6\u4e0a\u63d0\u5347\u7ed3\u6784\u5339\u914d\u7387\uff0cMP-20 \u7528 20 \u4e2a\u5019\u9009\u8fbe\u5230 92.04%\uff0c\u5e76\u6539\u5584\u4ece\u5934\u751f\u6210\u4e2d\u7684\u5143\u7d20\u6570\u91cf\u4e0e\u5bc6\u5ea6\u5206\u5e03\u5bf9\u9f50\u3002", "categories": ["cond-mat.mtrl-sci", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01076", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6750\u6599\u751f\u6210", "\u6676\u4f53\u7ed3\u6784", "\u6d41\u5339\u914d", "\u6587\u672c\u5f15\u5bfc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01076v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Text-guided flow matching enables sample-efficient crystal structure generation", "tldr": "\u8bba\u6587\u63d0\u51fa TFMat\uff0c\u5c06\u7ed3\u6784\u5316\u6750\u6599\u6587\u672c\u4f5c\u4e3a\u8bed\u4e49\u5148\u9a8c\uff0c\u5f15\u5bfc CrystalFlow \u7684\u6d41\u5339\u914d\u6676\u4f53\u7ed3\u6784\u751f\u6210\u3002\u5b83\u5728 Perov-5\u3001Carbon-24\u3001MP-20 \u7b49\u57fa\u51c6\u4e0a\u63d0\u5347\u7ed3\u6784\u5339\u914d\u7387\uff0cMP-20 \u7528 20 \u4e2a\u5019\u9009\u8fbe\u5230 92.04%\uff0c\u5e76\u6539\u5584\u4ece\u5934\u751f\u6210\u4e2d\u7684\u5143\u7d20\u6570\u91cf\u4e0e\u5bc6\u5ea6\u5206\u5e03\u5bf9\u9f50\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Satellites are emerging as promising platforms to extend generative \\emph{artificial intelligence} (AI) services to remote areas lacking terrestrial infrastructure. However, deploying space generative AI is fundamentally constrained by the limited, time-varying onboard energy supplied by solar \\emph{energy harvesting} (EH). This paper presents a framework for solar-powered space generative AI in which a satellite receives a user prompt, executes a diffusion-based image-generation model, and downlinks the compressed result within a strict time window. We identify the fundamental \\emph{computation--communication} (C$^2$) trade-offs governed by the shared harvested-energy budgets. Specifically, increasing the number of generation steps improves intrinsic image quality but depletes energy and time available for downlink transmission, whereas prioritizing communication guarantees reliable delivery but sacrifices semantic quality. To balance these trade-offs and maximize \\emph{end-to-end} (E2E) generative performance, we exploit the predictable solar-EH dynamics induced by deterministic orbital motion and develop a joint C$^2$ resource-optimization framework using a tractable two-step approach. First, we characterize the maximum downlink throughput for a fixed generation depth under continuous solar EH. This establishes a separation principle that decouples waiting-time selection from optimal transmit-power control. Next, we formulate a joint C$^2$ utility-maximization problem and derive a closed-form, low-complexity step-selection policy in the dominant constant-power regime. Extensive experiments under realistic orbital dynamics demonstrate that the proposed policy dynamically balances generation quality and transmission reliability. This yields significant E2E performance gains over static computation- and communication-centric baselines across diverse solar-EH states.", "arxiv_id": "2609.01062", "arxiv_url": "https://arxiv.org/abs/2609.01062", "authors": ["Jierui Zhang", "Jianhao Huang", "Zhanwei Wang", "Kaibin Huang"], "brief": "\u672c\u6587\u7814\u7a76\u592a\u9633\u80fd\u91c7\u96c6\u53d7\u9650\u7684\u536b\u661f\u751f\u6210\u5f0fAI\u670d\u52a1\uff1a\u536b\u661f\u63a5\u6536\u63d0\u793a\u8bcd\uff0c\u8fd0\u884c\u6269\u6563\u56fe\u50cf\u751f\u6210\u6a21\u578b\uff0c\u5e76\u5728\u65f6\u95f4\u7a97\u5185\u538b\u7f29\u4e0b\u4f20\u7ed3\u679c\u3002\u8bba\u6587\u523b\u753b\u4e86\u8ba1\u7b97\u6b65\u6570\u4e0e\u901a\u4fe1\u4e0b\u4f20\u4e4b\u95f4\u7684\u80fd\u91cf/\u65f6\u95f4\u6743\u8861\uff0c\u5e76\u63d0\u51fa\u8054\u5408\u8ba1\u7b97-\u901a\u4fe1\u8d44\u6e90\u4f18\u5316\u7b56\u7565\uff0c\u5728\u771f\u5b9e\u8f68\u9053\u592a\u9633\u80fd\u52a8\u6001\u4e0b\u663e\u8457\u4f18\u4e8e\u9759\u6001\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.NI", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01062", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5f0fAI", "\u6269\u6563\u6a21\u578b", "\u536b\u661f\u901a\u4fe1", "\u8d44\u6e90\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01062v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Space Generative AI with Solar Energy Harvesting", "tldr": "\u672c\u6587\u7814\u7a76\u592a\u9633\u80fd\u91c7\u96c6\u53d7\u9650\u7684\u536b\u661f\u751f\u6210\u5f0fAI\u670d\u52a1\uff1a\u536b\u661f\u63a5\u6536\u63d0\u793a\u8bcd\uff0c\u8fd0\u884c\u6269\u6563\u56fe\u50cf\u751f\u6210\u6a21\u578b\uff0c\u5e76\u5728\u65f6\u95f4\u7a97\u5185\u538b\u7f29\u4e0b\u4f20\u7ed3\u679c\u3002\u8bba\u6587\u523b\u753b\u4e86\u8ba1\u7b97\u6b65\u6570\u4e0e\u901a\u4fe1\u4e0b\u4f20\u4e4b\u95f4\u7684\u80fd\u91cf/\u65f6\u95f4\u6743\u8861\uff0c\u5e76\u63d0\u51fa\u8054\u5408\u8ba1\u7b97-\u901a\u4fe1\u8d44\u6e90\u4f18\u5316\u7b56\u7565\uff0c\u5728\u771f\u5b9e\u8f68\u9053\u592a\u9633\u80fd\u52a8\u6001\u4e0b\u663e\u8457\u4f18\u4e8e\u9759\u6001\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "User representation pre-training has become a fundamental paradigm for alleviating data sparsity in downstream personalization tasks. However, existing studies predominantly focus on single-app or app-level behaviors, overlooking the inherently cross-source and multi-granular nature of user activities on mobile devices. At the device level, user intent emerges from complex interactions among heterogeneous behavior sources and hierarchical action structures, posing challenges that cannot be addressed by conventional app-centric modeling. To tackle this issue, we propose CM-PTM, a novel Cross Multi-source Behavior Pre-Training Model tailored for mobile game user representation learning on device-level behavioral logs. CM-PTM employs hierarchical cascaded mask-then-predict proxy tasks that first infer the source of the next behavior and then progressively refine predictions at the app-action level. This design enables unified modeling of cross-source dependencies and fine-grained behavioral dynamics within a single pre-training paradigm. Extensive experiments on large-scale real-world mobile datasets demonstrate that CM-PTM effectively captures users\u0027 endogenous interests and consistently delivers significant performance gains on downstream mobile game recommendation tasks.", "arxiv_id": "2609.01057", "arxiv_url": "https://arxiv.org/abs/2609.01057", "authors": ["Chengqi Yang", "Yiran Qiao", "Feng Liu", "Xingyu Lou", "Zijun Zhou", "Xiaoyun Mo", "Changwang Zhang", "Jiayuan Xu", "Jun Wang", "Xiang Ao"], "brief": "\u672c\u6587\u63d0\u51fa CM-PTM\uff0c\u7528\u4e8e\u57fa\u4e8e\u8bbe\u5907\u7ea7\u591a\u6765\u6e90\u884c\u4e3a\u65e5\u5fd7\u9884\u8bad\u7ec3\u79fb\u52a8\u6e38\u620f\u7528\u6237\u8868\u793a\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u5c42\u7ea7\u7ea7\u8054\u7684\u201c\u63a9\u7801-\u9884\u6d4b\u201d\u4efb\u52a1\uff0c\u5148\u9884\u6d4b\u4e0b\u4e00\u884c\u4e3a\u6765\u6e90\uff0c\u518d\u7ec6\u5316\u5230\u5e94\u7528\u4e0e\u52a8\u4f5c\u5c42\u7ea7\uff0c\u4ece\u800c\u5efa\u6a21\u8de8\u6765\u6e90\u4f9d\u8d56\u548c\u7ec6\u7c92\u5ea6\u884c\u4e3a\u52a8\u6001\uff1b\u5728\u5927\u89c4\u6a21\u771f\u5b9e\u6570\u636e\u4e0a\u663e\u8457\u63d0\u5347\u79fb\u52a8\u6e38\u620f\u63a8\u8350\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01057", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7528\u6237\u8868\u793a", "\u9884\u8bad\u7ec3", "\u63a8\u8350\u7cfb\u7edf", "\u79fb\u52a8\u6e38\u620f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01057v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "User Representation via Cross Multi-source Behavior Pre-training for Mobile Games", "tldr": "\u672c\u6587\u63d0\u51fa CM-PTM\uff0c\u7528\u4e8e\u57fa\u4e8e\u8bbe\u5907\u7ea7\u591a\u6765\u6e90\u884c\u4e3a\u65e5\u5fd7\u9884\u8bad\u7ec3\u79fb\u52a8\u6e38\u620f\u7528\u6237\u8868\u793a\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u5c42\u7ea7\u7ea7\u8054\u7684\u201c\u63a9\u7801-\u9884\u6d4b\u201d\u4efb\u52a1\uff0c\u5148\u9884\u6d4b\u4e0b\u4e00\u884c\u4e3a\u6765\u6e90\uff0c\u518d\u7ec6\u5316\u5230\u5e94\u7528\u4e0e\u52a8\u4f5c\u5c42\u7ea7\uff0c\u4ece\u800c\u5efa\u6a21\u8de8\u6765\u6e90\u4f9d\u8d56\u548c\u7ec6\u7c92\u5ea6\u884c\u4e3a\u52a8\u6001\uff1b\u5728\u5927\u89c4\u6a21\u771f\u5b9e\u6570\u636e\u4e0a\u663e\u8457\u63d0\u5347\u79fb\u52a8\u6e38\u620f\u63a8\u8350\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Across the full Pythia suite (160M-12B, eight checkpoints, four task families), a linear probe can read a target variable from the residual stream as early as step 1,000 at every scale -- yet steering along that same reading direction remains null-equivalent in 43 of 48 model-checkpoint cells. Internal readability systematically outruns causal efficacy, and the lag does not shrink with scale. We call this structure lagged coupling and decompose it into three dissociable tracks: (i) internal readability, saturated (AUROC \u003e= 0.990) from the first checkpoint everywhere; (ii) behavioral readability, which develops gradually and progressively later at larger scales (12B reaches 0.909 only at the final checkpoint); (iii) causal efficacy, almost always null-equivalent, occasionally counterproductive early, with one isolated positive pulse (12B, step 8,000, z = +2.49) our grid cannot resolve. The ordering is dominantly read-before-write (11/11 units, no inversion). Representation headroom along the probe direction grows up to 57x with training and scale while causal write-in stays below 0.11% of headroom -- the variable is increasingly written into the representation and increasingly ignored by the readout. Under a fully pre-registered protocol, both single-onset hypotheses resolve INDETERMINATE (scale slope +0.24, 95% CI [-0.60, +0.87]; time vote 3:3) -- a disciplined negative explained by the three-track decomposition. A pre-registered OLMo-2 replication preserves the direction at attenuated magnitude. Our results caution against inferring steerability from probe accuracy and establish a developmental bottleneck: representation formation reliably outpaces causal readout consolidation.", "arxiv_id": "2609.01048", "arxiv_url": "https://arxiv.org/abs/2609.01048", "authors": ["Xining Xun"], "brief": "\u8bba\u6587\u5728 Pythia \u5168\u7cfb\u5217\u6a21\u578b\u548c\u591a\u4e2a\u4efb\u52a1\u4e0a\u53d1\u73b0\uff0c\u7ebf\u6027\u63a2\u9488\u5f88\u65e9\u5c31\u80fd\u4ece\u6b8b\u5dee\u6d41\u4e2d\u8bfb\u51fa\u76ee\u6807\u53d8\u91cf\uff0c\u4f46\u6cbf\u540c\u4e00\u65b9\u5411\u8fdb\u884c steering \u901a\u5e38\u6ca1\u6709\u56e0\u679c\u6548\u679c\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6ede\u540e\u8026\u5408\u201d\uff1a\u5185\u90e8\u8868\u5f81\u53ef\u8bfb\u6027\u5148\u4e8e\u884c\u4e3a\u53ef\u8bfb\u6027\u548c\u56e0\u679c\u53ef\u5199\u5165\u6027\uff0c\u63d0\u793a\u4e0d\u80fd\u4ec5\u51ed\u63a2\u9488\u51c6\u786e\u7387\u63a8\u65ad\u6a21\u578b\u53ef\u63a7\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01048", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u7ebf\u6027\u63a2\u9488", "\u56e0\u679c\u5e72\u9884", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01048v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Lagged Coupling: Internal Representations Become Readable Before They Become Causal", "tldr": "\u8bba\u6587\u5728 Pythia \u5168\u7cfb\u5217\u6a21\u578b\u548c\u591a\u4e2a\u4efb\u52a1\u4e0a\u53d1\u73b0\uff0c\u7ebf\u6027\u63a2\u9488\u5f88\u65e9\u5c31\u80fd\u4ece\u6b8b\u5dee\u6d41\u4e2d\u8bfb\u51fa\u76ee\u6807\u53d8\u91cf\uff0c\u4f46\u6cbf\u540c\u4e00\u65b9\u5411\u8fdb\u884c steering \u901a\u5e38\u6ca1\u6709\u56e0\u679c\u6548\u679c\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6ede\u540e\u8026\u5408\u201d\uff1a\u5185\u90e8\u8868\u5f81\u53ef\u8bfb\u6027\u5148\u4e8e\u884c\u4e3a\u53ef\u8bfb\u6027\u548c\u56e0\u679c\u53ef\u5199\u5165\u6027\uff0c\u63d0\u793a\u4e0d\u80fd\u4ec5\u51ed\u63a2\u9488\u51c6\u786e\u7387\u63a8\u65ad\u6a21\u578b\u53ef\u63a7\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper introduces QXymb, a general framework for constructing observational declarative twins of quantum circuits, and develops QILP-0, its first complete order-0 specialization. QILP-0 constructs a finite multi-valued propositional logic program from observed circuit behaviour within a declared observational scope. The pipeline traverses a declared family of quantum observables incrementally according to a reproducible structural grading and a declared observational reference horizon. Progress is quantified through reference-relative coverage against a fixed target-independent reference. Observable responses are organized through target-independent geometry, while retained latent structure is mapped deterministically back to original observable columns before symbolic processing, preserving observational semantics and provenance. Selected observable profiles are converted into a finite relation through admissible target-independent discretization. The target is used only afterwards to audit twin-admissibility and induce the declarative theory. A theory is certified as an exact observational declarative twin when it completely and correctly reconstructs the resulting finite task-conditioned discrete relation. Logical exactness is therefore separated from numerical, backend, provider, and discretization uncertainty, which is retained as audit metadata. Validation uses two complementary QML settings. Exhaustive Bars \u0026 Stripes experiments compare product and grid-CZ embeddings from 16 to 100 qubits and exercise the native-discrete branch. Low-Depth MNIST analyses all 14,708 digit-0/1 instances before and after a trained variational quantum transformation and exercises continuous discretization. In every reported relation, the induced QILP-0 theory achieves complete, conflict-free reconstruction with strict accuracy equal to one.", "arxiv_id": "2609.01049", "arxiv_url": "https://arxiv.org/abs/2609.01049", "authors": ["Marina de la Cruz Echeand\u00eda", "C\u00e9sar Luis Alonso", "Tony Ribeiro", "Alfonso Ortega de la Puente"], "brief": "\u8bba\u6587\u63d0\u51fa QXymb \u6846\u67b6\u53ca\u5176\u9996\u4e2a 0 \u9636\u7279\u5316 QILP-0\uff0c\u7528\u4e8e\u4ece\u91cf\u5b50\u7535\u8def\u7684\u89c2\u6d4b\u884c\u4e3a\u6784\u9020\u6709\u9650\u591a\u503c\u547d\u9898\u903b\u8f91\u7a0b\u5e8f\uff0c\u5f62\u6210\u201c\u89c2\u6d4b\u58f0\u660e\u5f0f\u5b6a\u751f\u201d\u3002\u5728 Bars \u0026 Stripes \u4e0e\u4f4e\u6df1\u5ea6 MNIST \u91cf\u5b50\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u4e2d\uff0c\u8bf1\u5bfc\u51fa\u7684 QILP-0 \u7406\u8bba\u5747\u5b9e\u73b0\u5b8c\u6574\u3001\u65e0\u51b2\u7a81\u91cd\u6784\uff0c\u4e25\u683c\u51c6\u786e\u7387\u4e3a 1\u3002", "categories": ["cs.AI", "quant-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01049", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u8ba1\u7b97", "\u7b26\u53f7\u63a8\u7406", "\u903b\u8f91\u7a0b\u5e8f", "\u91cf\u5b50\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01049v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QILP-0: Constructing Observational Declarative Twins of Quantum Circuits", "tldr": "\u8bba\u6587\u63d0\u51fa QXymb \u6846\u67b6\u53ca\u5176\u9996\u4e2a 0 \u9636\u7279\u5316 QILP-0\uff0c\u7528\u4e8e\u4ece\u91cf\u5b50\u7535\u8def\u7684\u89c2\u6d4b\u884c\u4e3a\u6784\u9020\u6709\u9650\u591a\u503c\u547d\u9898\u903b\u8f91\u7a0b\u5e8f\uff0c\u5f62\u6210\u201c\u89c2\u6d4b\u58f0\u660e\u5f0f\u5b6a\u751f\u201d\u3002\u5728 Bars \u0026 Stripes \u4e0e\u4f4e\u6df1\u5ea6 MNIST \u91cf\u5b50\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u4e2d\uff0c\u8bf1\u5bfc\u51fa\u7684 QILP-0 \u7406\u8bba\u5747\u5b9e\u73b0\u5b8c\u6574\u3001\u65e0\u51b2\u7a81\u91cd\u6784\uff0c\u4e25\u683c\u51c6\u786e\u7387\u4e3a 1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Production LLMs must handle inputs that attempt to override system instructions, bypass safety policies or elicit harmful responses. A common mitigation is a separate guardrail model. Existing reports, however, provide little evidence on Russian prompt injection or Russian surface obfuscation. We present HiveTraceGuard-Pro, a 0.6B generative guardrail LoRA-tuned from Qwen3-0.6B. It is trained on Russian and English and uses one binary scoring rule (safe/unsafe) for the final target turn. Its training corpus pairs harmful examples, where a counterpart exists, with benign examples from the same domain and applies eight obfuscation transforms to both labels. In one harness, we compare HiveTraceGuard-Pro with thirty-four other guards on nineteen benchmark groups, sixteen of which are public. Its aggregate key is 0.7432, behind 0.7641 and 0.7552 for the two higher-scoring guards. Over the sixteen public groups alone, its key is 0.7153 and four of the thirty-four other suite guards score higher. In a fifteen-model comparison, HiveTraceGuard-Pro has the highest clean Russian robustness combined-F1 (0.88) and Russian prompt-injection recall (0.999). Both results use Russian sets assembled by our team, and at least 27.1% of the prompt-injection set overlaps the training corpus. Its 14.3 ms median latency is the lowest among those fifteen models in that run. Across the suite, FPR is 0.268 and FNR is 0.156. All reported response results use a legacy standalone-reply serialization rather than the natural assistant-role path of the shipped chat template. We release the merged weights on Hugging Face under Apache-2.0. The corpus, evaluation sets and evaluation code remain internal.", "arxiv_id": "2609.01046", "arxiv_url": "https://arxiv.org/abs/2609.01046", "authors": ["Nikita Oblakov", "Sabrina Sadiekh", "Evgeniy Kokuykin"], "brief": "\u8bba\u6587\u63d0\u51fa HiveTraceGuard-Pro\uff0c\u4e00\u4e2a\u57fa\u4e8e Qwen3-0.6B LoRA \u5fae\u8c03\u7684\u7d27\u51d1\u751f\u6210\u5f0f\u5b89\u5168\u62a4\u680f\u6a21\u578b\uff0c\u7528\u4e8e\u68c0\u6d4b\u63d0\u793a\u6ce8\u5165\u3001\u8d8a\u72f1\u548c\u5bf9\u6297\u6027\u6df7\u6dc6\uff0c\u652f\u6301\u4fc4\u8bed\u548c\u82f1\u8bed\u4e8c\u5206\u7c7b\u5b89\u5168\u5224\u5b9a\u3002\u5728\u591a\u7ec4\u8bc4\u6d4b\u4e2d\u603b\u4f53\u63a5\u8fd1\u4f46\u672a\u8d85\u8fc7\u6700\u5f3a\u62a4\u680f\uff0c\u4fc4\u8bed\u9c81\u68d2\u6027\u548c\u63d0\u793a\u6ce8\u5165\u53ec\u56de\u8868\u73b0\u7a81\u51fa\u4e14\u5ef6\u8fdf\u4f4e\uff1b\u4f46\u90e8\u5206\u4fc4\u8bed\u6d4b\u8bd5\u4e0e\u8bad\u7ec3\u96c6\u91cd\u53e0\uff0c\u6570\u636e\u548c\u8bc4\u6d4b\u4ee3\u7801\u672a\u516c\u5f00\uff0c\u7ed3\u8bba\u9700\u8c28\u614e\u770b\u5f85\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01046", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u63d0\u793a\u6ce8\u5165", "\u5b89\u5168\u62a4\u680f", "\u5bf9\u6297\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01046v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HiveTraceGuard-Pro: A Compact Generative Guardrail for Prompt Injection, Jailbreaks, and Adversarial Obfuscation", "tldr": "\u8bba\u6587\u63d0\u51fa HiveTraceGuard-Pro\uff0c\u4e00\u4e2a\u57fa\u4e8e Qwen3-0.6B LoRA \u5fae\u8c03\u7684\u7d27\u51d1\u751f\u6210\u5f0f\u5b89\u5168\u62a4\u680f\u6a21\u578b\uff0c\u7528\u4e8e\u68c0\u6d4b\u63d0\u793a\u6ce8\u5165\u3001\u8d8a\u72f1\u548c\u5bf9\u6297\u6027\u6df7\u6dc6\uff0c\u652f\u6301\u4fc4\u8bed\u548c\u82f1\u8bed\u4e8c\u5206\u7c7b\u5b89\u5168\u5224\u5b9a\u3002\u5728\u591a\u7ec4\u8bc4\u6d4b\u4e2d\u603b\u4f53\u63a5\u8fd1\u4f46\u672a\u8d85\u8fc7\u6700\u5f3a\u62a4\u680f\uff0c\u4fc4\u8bed\u9c81\u68d2\u6027\u548c\u63d0\u793a\u6ce8\u5165\u53ec\u56de\u8868\u73b0\u7a81\u51fa\u4e14\u5ef6\u8fdf\u4f4e\uff1b\u4f46\u90e8\u5206\u4fc4\u8bed\u6d4b\u8bd5\u4e0e\u8bad\u7ec3\u96c6\u91cd\u53e0\uff0c\u6570\u636e\u548c\u8bc4\u6d4b\u4ee3\u7801\u672a\u516c\u5f00\uff0c\u7ed3\u8bba\u9700\u8c28\u614e\u770b\u5f85\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Uniform-state discrete diffusion models update all tokens in parallel while keeping every position revisable. Even when the commonly used top-$p$ rule leaves only one candidate at a position, that choice affects only the current reverse step and can be revised at the next sampling step. We ask what changes when selected hypotheses instead become persistent context for later predictions. We therefore propose committed reveal sampling (CRS), a training-free sampler that stores selected argmax tokens and inserts them into subsequent model inputs. Our analysis gives a rationale for selecting later and for keeping selected tokens visible. Under the exact forward process, the Bayes error of selecting a clean token cannot increase as noise decreases, while in a simple latent-mode model, keeping the selected token visible helps later parallel predictions agree on the same sequence-level choice. Empirically, paired experiments on Duo-distilled then separate this persistent effect from single-step top-$p$ restriction and scalar temperature scaling. Under the same finalization rule, CRS without top-$p$ truncation reaches lower generative perplexity (GenPPL) than fixed $p=0.95$ and $p=0.9$ baselines across budgets of 8--64 function evaluations (NFE). At 64 NFE, the comparison at matched unigram entropy also gives lower GenPPL for CRS, yielding a more favorable GenPPL--entropy tradeoff. Base Duo shows the same direction in a descriptive comparison, while other diversity and continuation metrics can rank these operating points differently. These results identify support restriction and persistent context as distinct controls of that tradeoff.", "arxiv_id": "2609.01043", "arxiv_url": "https://arxiv.org/abs/2609.01043", "authors": ["Satoshi Hayakawa"], "brief": "\u8bba\u6587\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u79bb\u6563\u6269\u6563\u91c7\u6837\u5668 CRS\uff1a\u5c06\u5df2\u9009\u7684 argmax token \u6301\u4e45\u5199\u5165\u540e\u7eed\u8f93\u5165\uff0c\u800c\u4e0d\u662f\u50cf top-p \u622a\u65ad\u90a3\u6837\u53ea\u5f71\u54cd\u5f53\u524d\u53cd\u5411\u6b65\u3002\u7406\u8bba\u4e0e\u5b9e\u9a8c\u8868\u660e\uff0c\u6301\u4e45\u4e0a\u4e0b\u6587\u6709\u52a9\u4e8e\u540e\u7eed\u5e76\u884c\u9884\u6d4b\u4fdd\u6301\u4e00\u81f4\uff0c\u5728 8\u201364 NFE \u4e0b\u76f8\u6bd4\u56fa\u5b9a top-p \u57fa\u7ebf\u83b7\u5f97\u66f4\u4f4e\u751f\u6210\u56f0\u60d1\u5ea6\uff0c\u5e76\u6539\u5584 GenPPL-\u71b5\u6743\u8861\u3002", "categories": ["cs.LG", "cs.AI", "math.PR", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01043", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u79bb\u6563\u6269\u6563", "\u91c7\u6837\u65b9\u6cd5", "\u8bed\u8a00\u6a21\u578b", "\u751f\u6210\u8d28\u91cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01043v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Truncation to Commitment: Persistent Context in Uniform Discrete Diffusion", "tldr": "\u8bba\u6587\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u79bb\u6563\u6269\u6563\u91c7\u6837\u5668 CRS\uff1a\u5c06\u5df2\u9009\u7684 argmax token \u6301\u4e45\u5199\u5165\u540e\u7eed\u8f93\u5165\uff0c\u800c\u4e0d\u662f\u50cf top-p \u622a\u65ad\u90a3\u6837\u53ea\u5f71\u54cd\u5f53\u524d\u53cd\u5411\u6b65\u3002\u7406\u8bba\u4e0e\u5b9e\u9a8c\u8868\u660e\uff0c\u6301\u4e45\u4e0a\u4e0b\u6587\u6709\u52a9\u4e8e\u540e\u7eed\u5e76\u884c\u9884\u6d4b\u4fdd\u6301\u4e00\u81f4\uff0c\u5728 8\u201364 NFE \u4e0b\u76f8\u6bd4\u56fa\u5b9a top-p \u57fa\u7ebf\u83b7\u5f97\u66f4\u4f4e\u751f\u6210\u56f0\u60d1\u5ea6\uff0c\u5e76\u6539\u5584 GenPPL-\u71b5\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce ViTAMINS, a method that integrates synthetic hard negatives into unsupervised vision transformer pretraining to improve representation quality. Our approach is thoroughly benchmarked on ImageNet and transfer learning, image retrieval, copy detection, and image, video segmentation tasks. Notably, our proposed negatives give rise to emergent properties, where learned representations contain explicit information about the semantic content of an image and serve as excellent classifiers (up to +11.3% over baselines). ViTAMINS achieves these benefits through simple modifications to existing contrastive frameworks and outperforms competing methods while being more resource efficient, e.g., our ViT-B surpasses V-JEPA with ViT-L. Our findings motivate reconsidering contrastive learning as a simpler yet powerful alternative to dominant generative and self-distillation approaches.", "arxiv_id": "2609.01041", "arxiv_url": "https://arxiv.org/abs/2609.01041", "authors": ["Nikos Giakoumoglou", "Andreas Floros", "Kleanthis-Marios Papadopoulos", "Tania Stathaki"], "brief": "ViTAMINS \u5c06\u5408\u6210\u96be\u8d1f\u6837\u672c\u5f15\u5165\u65e0\u76d1\u7763 ViT \u5bf9\u6bd4\u9884\u8bad\u7ec3\uff0c\u4ee5\u63d0\u5347\u89c6\u89c9\u8868\u5f81\u8d28\u91cf\u3002\u8be5\u65b9\u6cd5\u5728 ImageNet\u3001\u8fc1\u79fb\u5b66\u4e60\u3001\u68c0\u7d22\u3001\u590d\u5236\u68c0\u6d4b\u4ee5\u53ca\u56fe\u50cf/\u89c6\u9891\u5206\u5272\u7b49\u4efb\u52a1\u4e0a\u8868\u73b0\u4f18\u4e8e\u591a\u79cd\u57fa\u7ebf\uff0c\u5e76\u4ee5\u66f4\u4f4e\u8d44\u6e90\u53d6\u5f97\u5f3a\u6548\u679c\uff0c\u4f8b\u5982 ViT-B \u8d85\u8fc7\u4f7f\u7528 ViT-L \u7684 V-JEPA\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01041", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u89c6\u89c9Transformer", "\u5bf9\u6bd4\u5b66\u4e60", "\u89c6\u89c9\u8868\u5f81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01041v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ViTAMINS: An Empirical Study of Training Self-Supervised Vision Transformers with Synthetic Hard Negatives", "tldr": "ViTAMINS \u5c06\u5408\u6210\u96be\u8d1f\u6837\u672c\u5f15\u5165\u65e0\u76d1\u7763 ViT \u5bf9\u6bd4\u9884\u8bad\u7ec3\uff0c\u4ee5\u63d0\u5347\u89c6\u89c9\u8868\u5f81\u8d28\u91cf\u3002\u8be5\u65b9\u6cd5\u5728 ImageNet\u3001\u8fc1\u79fb\u5b66\u4e60\u3001\u68c0\u7d22\u3001\u590d\u5236\u68c0\u6d4b\u4ee5\u53ca\u56fe\u50cf/\u89c6\u9891\u5206\u5272\u7b49\u4efb\u52a1\u4e0a\u8868\u73b0\u4f18\u4e8e\u591a\u79cd\u57fa\u7ebf\uff0c\u5e76\u4ee5\u66f4\u4f4e\u8d44\u6e90\u53d6\u5f97\u5f3a\u6548\u679c\uff0c\u4f8b\u5982 ViT-B \u8d85\u8fc7\u4f7f\u7528 ViT-L \u7684 V-JEPA\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Machine learning systems deployed for credit, hiring, and resource distribution are increasingly subject to regulatory oversight from policies such as the EU AI Act and GDPR. Current fairness governance practices rely on observational fairness metrics, post-hoc explainability, and immutable audit logs, but provide limited support for causal attribution and efficient evidentiary verification. We introduce Causal Evidentiary Governance (CEG), a framework in which regulated institutions commit to a versioned directed acyclic graph (DAG) that partitions causal pathways into allowable and disallowed groups. The Causal Harm Rate measures prediction variation attributable to disallowed causal pathways. Each decision is accompanied by a signed Decision-Evidence Packet (DEP), cryptographically binding the prediction to a digest of the published DAG and path-specific attributions. DEP digests can be appended to a Merkle tree to enable logarithmic-cost inclusion proofs. We validate CEG through a two-layer empirical methodology using demographic summaries from four years of PMA credit supervisory data to construct 10,000 synthetic credit applicants across four strategic DAG counterfactuals. Causal Harm Rate isolates injected causal effects more clearly than demographic parity or equalized odds. Cross-model validation and ablation studies assess robustness. Evaluation on the German Credit dataset shows that harm associated with specific causal pathways can be substantially understated by associational fairness metrics. Finally, a proof-of-concept implementation demonstrates operationally plausible throughput and highlights relevant performance tradeoffs.", "arxiv_id": "2609.01040", "arxiv_url": "https://arxiv.org/abs/2609.01040", "authors": ["Samah Kareem", "Bar\u0131\u015f \u00c7elikta\u015f"], "brief": "\u8bba\u6587\u63d0\u51fa\u56e0\u679c\u8bc1\u636e\u6cbb\u7406\uff08CEG\uff09\u6846\u67b6\uff0c\u8981\u6c42\u9ad8\u98ce\u9669\u673a\u5668\u5b66\u4e60\u7cfb\u7edf\u63d0\u4ea4\u7248\u672c\u5316\u56e0\u679cDAG\uff0c\u5c06\u56e0\u679c\u8def\u5f84\u5212\u5206\u4e3a\u5141\u8bb8\u4e0e\u7981\u6b62\uff0c\u5e76\u7528\u56e0\u679c\u4f24\u5bb3\u7387\u8861\u91cf\u9884\u6d4b\u4e2d\u6765\u81ea\u7981\u6b62\u8def\u5f84\u7684\u5f71\u54cd\u3002\u6bcf\u6b21\u51b3\u7b56\u9644\u5e26\u52a0\u5bc6\u7b7e\u540d\u7684\u8bc1\u636e\u5305\uff0c\u5e76\u53ef\u7528Merkle\u6811\u652f\u6301\u9ad8\u6548\u5ba1\u8ba1\uff1b\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u6bd4\u4eba\u53e3\u7edf\u8ba1\u5747\u8861\u3001\u673a\u4f1a\u5747\u7b49\u7b49\u5173\u8054\u516c\u5e73\u6307\u6807\u66f4\u80fd\u8bc6\u522b\u7279\u5b9a\u56e0\u679c\u4f24\u5bb3\u3002", "categories": ["cs.CY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01040", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u516c\u5e73\u6027", "\u673a\u5668\u5b66\u4e60\u6cbb\u7406", "\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01040v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Causal Evidentiary Governance for High-Risk Machine Learning Systems", "tldr": "\u8bba\u6587\u63d0\u51fa\u56e0\u679c\u8bc1\u636e\u6cbb\u7406\uff08CEG\uff09\u6846\u67b6\uff0c\u8981\u6c42\u9ad8\u98ce\u9669\u673a\u5668\u5b66\u4e60\u7cfb\u7edf\u63d0\u4ea4\u7248\u672c\u5316\u56e0\u679cDAG\uff0c\u5c06\u56e0\u679c\u8def\u5f84\u5212\u5206\u4e3a\u5141\u8bb8\u4e0e\u7981\u6b62\uff0c\u5e76\u7528\u56e0\u679c\u4f24\u5bb3\u7387\u8861\u91cf\u9884\u6d4b\u4e2d\u6765\u81ea\u7981\u6b62\u8def\u5f84\u7684\u5f71\u54cd\u3002\u6bcf\u6b21\u51b3\u7b56\u9644\u5e26\u52a0\u5bc6\u7b7e\u540d\u7684\u8bc1\u636e\u5305\uff0c\u5e76\u53ef\u7528Merkle\u6811\u652f\u6301\u9ad8\u6548\u5ba1\u8ba1\uff1b\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u6bd4\u4eba\u53e3\u7edf\u8ba1\u5747\u8861\u3001\u673a\u4f1a\u5747\u7b49\u7b49\u5173\u8054\u516c\u5e73\u6307\u6807\u66f4\u80fd\u8bc6\u522b\u7279\u5b9a\u56e0\u679c\u4f24\u5bb3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A/B testing is the gold standard for evaluating product changes, but each experiment requires real user traffic, engineering effort, and weeks of measurement. We propose a simulation framework that predicts A/B test outcomes using LLM-powered agents conditioned on data-driven personas grounded in real user behavioral signals. Unlike prior work that relies on synthetic or rule-based personas, our agents are constructed from anonymized behavioral data-activity patterns, engagement signals, and inferred demographics-enabling more faithful population modeling. We frame A/B test simulation as a structured question task and systematically study (i) question design formats, (ii) the impact of persona data source and domain alignment, (iii) the trade-off between per-persona behavioral depth and population diversity, and (iv) efficient population subsampling. On a benchmark of 40 A/B tests spanning two metric types, our best configuration achieves 0.75-0.90 directional accuracy depending on the test metric, demonstrating that data-driven personas are a viable path toward fast, low-cost experiment pre-screening.", "arxiv_id": "2609.01038", "arxiv_url": "https://arxiv.org/abs/2609.01038", "authors": ["Ziyad Benomar", "Weronika \u0141ajewska", "Leonardo Perelli", "Saab Mansour"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u771f\u5b9e\u533f\u540d\u7528\u6237\u884c\u4e3a\u6570\u636e\u6784\u5efa\u6570\u636e\u9a71\u52a8\u753b\u50cf\uff0c\u5e76\u8ba9\u5927\u6a21\u578b\u667a\u80fd\u4f53\u6a21\u62df A/B \u6d4b\u8bd5\u7ed3\u679c\u3002\u901a\u8fc7\u7814\u7a76\u95ee\u9898\u683c\u5f0f\u3001\u753b\u50cf\u6570\u636e\u6765\u6e90\u3001\u884c\u4e3a\u6df1\u5ea6\u4e0e\u4eba\u7fa4\u591a\u6837\u6027\u7b49\u56e0\u7d20\uff0c\u572840\u4e2a A/B \u6d4b\u8bd5\u57fa\u51c6\u4e0a\u8fbe\u52300.75-0.90\u7684\u65b9\u5411\u9884\u6d4b\u51c6\u786e\u7387\uff0c\u53ef\u7528\u4e8e\u4f4e\u6210\u672c\u5b9e\u9a8c\u9884\u7b5b\u9009\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01038", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "A/B\u6d4b\u8bd5", "\u7528\u6237\u753b\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01038v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Data-Driven Persona-Conditioned Agents for A/B Test Simulation", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u771f\u5b9e\u533f\u540d\u7528\u6237\u884c\u4e3a\u6570\u636e\u6784\u5efa\u6570\u636e\u9a71\u52a8\u753b\u50cf\uff0c\u5e76\u8ba9\u5927\u6a21\u578b\u667a\u80fd\u4f53\u6a21\u62df A/B \u6d4b\u8bd5\u7ed3\u679c\u3002\u901a\u8fc7\u7814\u7a76\u95ee\u9898\u683c\u5f0f\u3001\u753b\u50cf\u6570\u636e\u6765\u6e90\u3001\u884c\u4e3a\u6df1\u5ea6\u4e0e\u4eba\u7fa4\u591a\u6837\u6027\u7b49\u56e0\u7d20\uff0c\u572840\u4e2a A/B \u6d4b\u8bd5\u57fa\u51c6\u4e0a\u8fbe\u52300.75-0.90\u7684\u65b9\u5411\u9884\u6d4b\u51c6\u786e\u7387\uff0c\u53ef\u7528\u4e8e\u4f4e\u6210\u672c\u5b9e\u9a8c\u9884\u7b5b\u9009\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automated mining of formal specifications is vital for verifying real-time systems. However, existing passive learning approaches remain restricted to deterministic specifications or limited fragments of Timed Regular Expressions (TRE). To our knowledge, this paper presents the first framework to tackle \\emph{precise} passive learning for an expressive timed logic, \\emph{Metric Interval Temporal Logic} (MITL) without relying on predefined templates or restricted logic fragments. Our approach formally reduces the timed learning problem into a scalable untimed one. By identifying quantitative timing differences between positive and negative traces, we synthesise precise timed constraints and inject them as new Boolean atomic propositions. This embeds timing into the alphabet, delegating the complex formula evaluation to highly optimised, off-the-shelf untimed LTL tools. Crucially, our framework is complete, guaranteeing a separating specification can always be found. We evaluate our implementation across several benchmarks, demonstrating the effectiveness of our approach.", "arxiv_id": "2609.01032", "arxiv_url": "https://arxiv.org/abs/2609.01032", "authors": ["Hsi-Ming Ho", "Shankaranarayanan Krishna", "Khushraj Madnani"], "brief": "\u672c\u6587\u63d0\u51fa\u9996\u4e2a\u9762\u5411\u5b8c\u6574 MITL \u7684\u7cbe\u786e\u88ab\u52a8\u5b66\u4e60\u6846\u67b6\uff0c\u65e0\u9700\u9884\u5b9a\u4e49\u6a21\u677f\u6216\u53d7\u9650\u903b\u8f91\u7247\u6bb5\u3002\u65b9\u6cd5\u5c06\u5e26\u65f6\u95f4\u5b66\u4e60\u89c4\u7ea6\u5f52\u7ea6\u4e3a\u65e0\u65f6\u95f4 LTL \u5b66\u4e60\uff0c\u901a\u8fc7\u6316\u6398\u6b63\u8d1f\u8f68\u8ff9\u7684\u5b9a\u91cf\u65f6\u95f4\u5dee\u5f02\u751f\u6210\u7ea6\u675f\u5e76\u5d4c\u5165\u5b57\u6bcd\u8868\uff0c\u5b9e\u9a8c\u663e\u793a\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u6709\u6548\u4e14\u5177\u5907\u5b8c\u5907\u6027\u4fdd\u8bc1\u3002", "categories": ["cs.LO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01032", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u65f6\u5e8f\u903b\u8f91", "\u81ea\u52a8\u89c4\u7ea6\u6316\u6398"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01032v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On Synthesis of Metric Interval Temporal Logics", "tldr": "\u672c\u6587\u63d0\u51fa\u9996\u4e2a\u9762\u5411\u5b8c\u6574 MITL \u7684\u7cbe\u786e\u88ab\u52a8\u5b66\u4e60\u6846\u67b6\uff0c\u65e0\u9700\u9884\u5b9a\u4e49\u6a21\u677f\u6216\u53d7\u9650\u903b\u8f91\u7247\u6bb5\u3002\u65b9\u6cd5\u5c06\u5e26\u65f6\u95f4\u5b66\u4e60\u89c4\u7ea6\u5f52\u7ea6\u4e3a\u65e0\u65f6\u95f4 LTL \u5b66\u4e60\uff0c\u901a\u8fc7\u6316\u6398\u6b63\u8d1f\u8f68\u8ff9\u7684\u5b9a\u91cf\u65f6\u95f4\u5dee\u5f02\u751f\u6210\u7ea6\u675f\u5e76\u5d4c\u5165\u5b57\u6bcd\u8868\uff0c\u5b9e\u9a8c\u663e\u793a\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u6709\u6548\u4e14\u5177\u5907\u5b8c\u5907\u6027\u4fdd\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
