\u8fdb\u7814\u7a76\u62a5\u544a\u53ca\u5176\u652f\u6491\u5b9e\u9a8c\u3001\u5206\u6790\u4ea7\u7269", "\u5728 ResearchClawBench \u548c AstaBench E2E Discovery \u4e0a\u5747\u663e\u8457\u63d0\u5347\u591a\u79cd LLM \u4e0e\u667a\u80fd\u4f53\u6846\u67b6\u8868\u73b0\uff0c\u6700\u9ad8\u5e73\u5747\u63d0\u5347\u8fbe 16.8 \u5206"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u7814\u81ea\u52a8\u5316", "\u8bc4\u4f30\u65b9\u6cd5", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "ZJUNLP", "pdf_url": "https://arxiv.org/pdf/2608.31076v1", "published_at": "2026-08-31", "score": 0.299, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31076.png", "title": "Learning to Evaluate Before Improving: Automatic Rubric Induction for Automatic Research Agents", "tldr": "\u5148\u81ea\u52a8\u751f\u6210\u8bc4\u4ef7\u91cf\u89c4\uff0c\u518d\u6307\u5bfc\u79d1\u7814\u667a\u80fd\u4f53\u6267\u884c", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoSciRub\uff0c\u4e00\u79cd\u201c\u8bc4\u4f30\u4f18\u5148\u201d\u7684\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u6846\u67b6\uff1a\u5728\u6267\u884c\u5f00\u653e\u5f0f\u7814\u7a76\u4efb\u52a1\u524d\uff0c\u5148\u5f52\u7eb3\u4efb\u52a1\u7279\u5b9a\u7684\u53ef\u6267\u884c\u8bc4\u4ef7\u91cf\u89c4\u3002\u8be5\u91cf\u89c4\u5c06\u9690\u542b\u7684\u5206\u6790\u3001\u5b9e\u9a8c\u4e0e\u8bc1\u636e\u8981\u6c42\u663e\u5f0f\u5316\uff0c\u5e76\u7528\u4e8e\u6307\u5bfc\u6267\u884c\u3001\u9010\u9879\u9a8c\u8bc1\u548c\u8fed\u4ee3\u4fee\u8ba2\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u5982\u4f55\u8bc4\u4ef7\u7814\u7a76\u8d28\u91cf\u201d\u524d\u7f6e\u4e3a\u667a\u80fd\u4f53\u6267\u884c\u7684\u63a7\u5236\u673a\u5236\uff0c\u7f13\u89e3\u5f00\u653e\u5f0f\u79d1\u7814\u4efb\u52a1\u4e2d\u76ee\u6807\u4e0d\u6e05\u3001\u8bc1\u636e\u4e0d\u8db3\u3001\u65b9\u6cd5\u4e0d\u5f53\u7b49\u95ee\u9898\uff0c\u5bf9\u63d0\u5347\u79d1\u7814\u667a\u80fd\u4f53\u7684\u53ef\u9760\u6027\u548c\u53ef\u5ba1\u67e5\u6027\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "While Large language models (LLMs) incorporate user personalization signals to improve usability and helpfulness, they increasingly shift from providing balanced, informative responses toward optimizing for user satisfaction when conditioned on personal context such as conversation history, inferred preferences, and user profiles. Specifically, we identify three emerging risks: (1) irrelevant personalization, where models reference personal information in unnecessary contexts; (2) preference narrowing, where models reinforce informational echo chambers; and (3) sycophantic bias, where models agree excessively with user opinions. As a result, models may reference personal information in contexts where it is unnecessary, inadvertently collapse response diversity, or agree excessively with user opinions. Despite the growing use of personalization in AI assistants, there has been limited systematic evaluation of its potential side effects. To bridge this gap, we propose PRISK, a dynamic evaluation framework with automated data generation and tailored metrics that uncovers systematic limitations in current LLM personalization and how personalized information shapes its responses. Our empirical analysis across 13 LLMs demonstrates the presence of user profiles and retrieved memories consistently exacerbates biases, resulting in an average drop of 45.9% in irrelevant personalization, 41.7% in preference narrowing and 61.7% in sycophantic bias.", "arxiv_id": "2608.28833", "arxiv_url": "https://arxiv.org/abs/2608.28833", "authors": ["Yumeng Wang", "Yuchen Wu", "Cheng Qian", "Zhiyuan Fan", "Hyeonjeong Ha", "Shujin Wu", "Jiayu Liu", "Heng Ji", "Ge Wang"], "brief": "\u8bba\u6587\u63d0\u51fa PRISK\uff0c\u4e00\u4e2a\u52a8\u6001\u8bc4\u6d4b\u6846\u67b6\uff0c\u7528\u81ea\u52a8\u6570\u636e\u751f\u6210\u548c\u5b9a\u5236\u6307\u6807\u7cfb\u7edf\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u4e2a\u6027\u5316\u5e26\u6765\u7684\u526f\u4f5c\u7528\u3002\u7814\u7a76\u805a\u7126\u65e0\u5173\u4e2a\u6027\u5316\u3001\u504f\u597d\u6536\u7a84\u548c\u8fce\u5408\u6027\u504f\u89c1\u4e09\u7c7b\u98ce\u9669\uff0c\u5e76\u572813\u4e2aLLM\u4e0a\u8fdb\u884c\u5b9e\u8bc1\u5206\u6790\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/yumeng-10/personalization_risk", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28833", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bc6\u522b\u4e09\u7c7b\u4e2a\u6027\u5316\u98ce\u9669\uff1a\u4e0d\u5fc5\u8981\u5f15\u7528\u7528\u6237\u4fe1\u606f\u3001\u5f3a\u5316\u4fe1\u606f\u8327\u623f\u3001\u8fc7\u5ea6\u9644\u548c\u7528\u6237\u89c2\u70b9", "\u8bc4\u6d4b\u53d1\u73b0\u7528\u6237\u753b\u50cf\u548c\u68c0\u7d22\u8bb0\u5fc6\u4f1a\u7cfb\u7edf\u6027\u52a0\u5267\u6a21\u578b\u504f\u89c1\u4e0e\u54cd\u5e94\u591a\u6837\u6027\u4e0b\u964d", "\u572813\u4e2aLLM\u4e0a\u7684\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u5173\u6307\u6807\u5e73\u5747\u6076\u5316\u5e45\u5ea6\u5206\u522b\u8fbe\u523045.9%\u300141.7%\u548c61.7%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4e2a\u6027\u5316", "\u6a21\u578b\u8bc4\u6d4b", "\u5b89\u5168\u5bf9\u9f50"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2608.28833v1", "published_at": "2026-08-28", "score": 0.291, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28833.png", "title": "Evaluating the Hidden Costs of Personalization in Large Language Models", "tldr": "PRISK\u8bc4\u6d4b\u63ed\u793aLLM\u4e2a\u6027\u5316\u7684\u9690\u6027\u504f\u89c1\u6210\u672c", "upvotes": 24, "what_it_is": "\u8bba\u6587\u63d0\u51fa PRISK\uff0c\u4e00\u4e2a\u52a8\u6001\u8bc4\u6d4b\u6846\u67b6\uff0c\u7528\u81ea\u52a8\u6570\u636e\u751f\u6210\u548c\u5b9a\u5236\u6307\u6807\u7cfb\u7edf\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u4e2a\u6027\u5316\u5e26\u6765\u7684\u526f\u4f5c\u7528\u3002\u7814\u7a76\u805a\u7126\u65e0\u5173\u4e2a\u6027\u5316\u3001\u504f\u597d\u6536\u7a84\u548c\u8fce\u5408\u6027\u504f\u89c1\u4e09\u7c7b\u98ce\u9669\uff0c\u5e76\u572813\u4e2aLLM\u4e0a\u8fdb\u884c\u5b9e\u8bc1\u5206\u6790\u3002", "why_notable": "\u968f\u7740AI\u52a9\u624b\u8d8a\u6765\u8d8a\u4f9d\u8d56\u7528\u6237\u753b\u50cf\u548c\u957f\u671f\u8bb0\u5fc6\uff0c\u8fd9\u9879\u5de5\u4f5c\u63d0\u4f9b\u4e86\u91cf\u5316\u4e2a\u6027\u5316\u8d1f\u9762\u5f71\u54cd\u7684\u8bc4\u6d4b\u5de5\u5177\uff0c\u63d0\u9192\u4e1a\u754c\u5728\u63d0\u5347\u7528\u6237\u6ee1\u610f\u5ea6\u7684\u540c\u65f6\u5173\u6ce8\u516c\u5e73\u6027\u3001\u4fe1\u606f\u591a\u6837\u6027\u548c\u53ef\u9760\u6027\u3002"}, {"abstract": "Large language models (LLMs) achieve strong performance on mathematical reasoning benchmarks, yet the mathematically meaningful skills underlying their reasoning remain underexplored. We introduce \\texttt{SHAPE}, a framework that analyzes Chain-of-Thought (CoT) trajectories through two lenses developed in mathematics education: (1) semantic spaces: the model\u0027s evolving mathematical interpretations of a problem (e.g., algebraic, geometric), and (2) heuristics: the specific mathematical actions taken within those spaces (e.g., simplifying the problem, working backward). We first use \\texttt{SHAPE} to analyze the reasoning patterns of various models. Our findings reveal that the mathematical heuristics employed by a model better explain final answer correctness than traditional CoT features. Furthermore, models are likely to reach correct solutions by concentrating their reasoning effort within a few semantic spaces rather than exploring many disparate ones -- a pattern consistent with human behavior. Next, we utilize the \\texttt{SHAPE} lens to evaluate whether post-training truly enhances mathematical proficiency. We find that reinforcement learning induces mode-seeking in heuristic usage. Lastly, we post-train LLMs by promoting diverse heuristics and demonstrate its effectiveness in improving accuracy. Overall, \\texttt{SHAPE} provides a theoretically-grounded diagnostic framework for decoding LLM reasoning and offers a new path toward post-training LLMs for math reasoning. The code for our model is available at https://github.com/holi-lab/SHAPE-of-CoT", "arxiv_id": "2608.28600", "arxiv_url": "https://arxiv.org/abs/2608.28600", "authors": ["Jonghyun Song", "Sangjun Song", "Minjae Oh", "Haesung Pyun", "Sungsik Lee", "Yohan Jo"], "brief": "\u8bba\u6587\u63d0\u51fa SHAPE \u6846\u67b6\uff0c\u4ece\u201c\u8bed\u4e49\u7a7a\u95f4\u201d\u548c\u201c\u542f\u53d1\u5f0f\u7b56\u7565\u201d\u4e24\u7c7b\u6570\u5b66\u6559\u80b2\u6982\u5ff5\u5206\u6790\u5927\u6a21\u578b\u7684\u6570\u5b66 CoT \u8f68\u8ff9\uff0c\u5e76\u8fdb\u4e00\u6b65\u7528\u8be5\u89c6\u89d2\u6307\u5bfc\u540e\u8bad\u7ec3\u3002\u7814\u7a76\u53d1\u73b0\u542f\u53d1\u5f0f\u4f7f\u7528\u6bd4\u4f20\u7edf CoT \u7279\u5f81\u66f4\u80fd\u89e3\u91ca\u7b54\u6848\u6b63\u786e\u6027\uff0c\u4fc3\u8fdb\u591a\u6837\u542f\u53d1\u5f0f\u53ef\u63d0\u5347\u6570\u5b66\u63a8\u7406\u51c6\u786e\u7387\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/holi-lab/SHAPE-of-CoT", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.28600", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SHAPE \u5c06 CoT \u5206\u89e3\u4e3a\u6570\u5b66\u8bed\u4e49\u7a7a\u95f4\uff08\u5982\u4ee3\u6570\u3001\u51e0\u4f55\uff09\u548c\u542f\u53d1\u5f0f\u52a8\u4f5c\uff08\u5982\u5316\u7b80\u3001\u9006\u5411\u63a8\u7406\uff09\uff0c\u7528\u4e8e\u8bca\u65ad\u6a21\u578b\u63a8\u7406\u8fc7\u7a0b\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u6a21\u578b\u662f\u5426\u4f7f\u7528\u5408\u9002\u6570\u5b66\u542f\u53d1\u5f0f\uff0c\u6bd4 CoT \u957f\u5ea6\u7b49\u4f20\u7edf\u8868\u5f81\u66f4\u80fd\u9884\u6d4b\u6700\u7ec8\u6b63\u786e\u6027\uff1b\u6b63\u786e\u89e3\u901a\u5e38\u6765\u81ea\u96c6\u4e2d\u5728\u5c11\u6570\u8bed\u4e49\u7a7a\u95f4\u5185\u6df1\u5165\u63a8\u7406\u3002", "\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u542f\u53d1\u5f0f\u4f7f\u7528\u7684 mode-seeking \u73b0\u8c61\uff1b\u901a\u8fc7\u9f13\u52b1\u542f\u53d1\u5f0f\u591a\u6837\u6027\u8fdb\u884c\u540e\u8bad\u7ec3\u53ef\u8fdb\u4e00\u6b65\u63d0\u9ad8\u6570\u5b66\u9898\u51c6\u786e\u7387\u3002"], "keywords": ["\u94fe\u5f0f\u601d\u7ef4", "\u6570\u5b66\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u540e\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "Seoul National University", "pdf_url": "https://arxiv.org/pdf/2608.28600v1", "published_at": "2026-06-28", "score": 0.277, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28600.png", "title": "SHAPE of Chain-of-Thought in Math Reasoning", "tldr": "\u7528\u6570\u5b66\u6559\u80b2\u89c6\u89d2\u89e3\u6790\u5e76\u6539\u8fdbCoT\u63a8\u7406", "upvotes": 26, "what_it_is": "\u8bba\u6587\u63d0\u51fa SHAPE \u6846\u67b6\uff0c\u4ece\u201c\u8bed\u4e49\u7a7a\u95f4\u201d\u548c\u201c\u542f\u53d1\u5f0f\u7b56\u7565\u201d\u4e24\u7c7b\u6570\u5b66\u6559\u80b2\u6982\u5ff5\u5206\u6790\u5927\u6a21\u578b\u7684\u6570\u5b66 CoT \u8f68\u8ff9\uff0c\u5e76\u8fdb\u4e00\u6b65\u7528\u8be5\u89c6\u89d2\u6307\u5bfc\u540e\u8bad\u7ec3\u3002\u7814\u7a76\u53d1\u73b0\u542f\u53d1\u5f0f\u4f7f\u7528\u6bd4\u4f20\u7edf CoT \u7279\u5f81\u66f4\u80fd\u89e3\u91ca\u7b54\u6848\u6b63\u786e\u6027\uff0c\u4fc3\u8fdb\u591a\u6837\u542f\u53d1\u5f0f\u53ef\u63d0\u5347\u6570\u5b66\u63a8\u7406\u51c6\u786e\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6570\u5b66\u6559\u80b2\u7406\u8bba\u5f15\u5165 LLM CoT \u5206\u6790\uff0c\u4e0d\u53ea\u8bc4\u4f30\u7b54\u6848\u5bf9\u9519\uff0c\u800c\u662f\u523b\u753b\u6a21\u578b\u5230\u5e95\u5728\u7528\u54ea\u4e9b\u6570\u5b66\u601d\u8def\uff1b\u540c\u65f6\u63ed\u793a RL \u540e\u8bad\u7ec3\u53ef\u80fd\u6536\u7a84\u63a8\u7406\u7b56\u7565\uff0c\u5e76\u7ed9\u51fa\u63d0\u5347\u6570\u5b66\u63a8\u7406\u7684\u65b0\u8bad\u7ec3\u65b9\u5411\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) are strong perceivers of images and video. We ask how far that reach extends into acting: dropping an MLLM directly into a drone\u0027s control loop, with its entire action space declared solely in the prompt. Recent systems approach this setting but increasingly narrow the model\u0027s decision-making. We widen it back. We introduce DroneCATS-Agent, an architecture where the MLLM is a swappable component, and DroneCATS, a benchmark treating the model as the independent variable. Beyond merely flying toward a pixel, our agent entrusts the model to yaw and search, deliberate when unsure, and self-declare arrival---all without fine-tuning or function-calling schemas. Evaluating frontier and open models across four core capabilities---approaching a visible target, tracking a moving one, searching outside the initial view, and commanding a multi-drone fleet---reveals that even the simplest embodied settings are far from solved. Crucially, to identify what breaks first at the edge, our roster scales down to 2B parameters. The findings expose a stark paradox: it is not the flying that fails. Small open models often navigate into the success radius more reliably than frontier models, yet lose the episode by declaring arrival prematurely or not at all. Multi-drone commanding amplifies this divide, with small models failing by blindly copying a single coordinate across distinct views. Viewed as vision-language-action agents, the models\u0027 spatial perception holds up, but their action protocol does not. What separates a deployable edge model from a frontier model is not navigation, but the discipline to sustain a declared protocol and emit the correct terminating action. The open problem is closing this gap at onboard compute costs---yielding a fast model that plans persistently and knows exactly when it is done---and DroneCATS is built to measure that distance.", "arxiv_id": "2609.01404", "arxiv_url": "https://arxiv.org/abs/2609.01404", "authors": ["Jaewoo Park", "Minyoung Lee", "Sukmin Seo", "Moonbin Yim", "Hyunwook Yoon", "Dohoon Ryu", "Daehee Kim", "Myungseo Song", "Jihyuk Byun", "Seunggyu Chang", "Taeho Kil", "Jiseob Kim", "Bado Lee", "Geewook Kim"], "brief": "\u8bba\u6587\u63d0\u51fa DroneCATS-Agent \u4e0e DroneCATS \u57fa\u51c6\uff0c\u628a\u591a\u6a21\u6001\u5927\u6a21\u578b\u76f4\u63a5\u653e\u5165\u65e0\u4eba\u673a\u63a7\u5236\u95ed\u73af\u4e2d\uff0c\u8bc4\u4f30\u5176\u4f5c\u4e3a\u901a\u7528\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u667a\u80fd\u4f53\u7684\u80fd\u529b\u3002\u4efb\u52a1\u8986\u76d6\u63a5\u8fd1\u76ee\u6807\u3001\u8ddf\u8e2a\u79fb\u52a8\u76ee\u6807\u3001\u89c6\u91ce\u5916\u641c\u7d22\u548c\u591a\u65e0\u4eba\u673a\u6307\u6325\uff0c\u4e14\u4e0d\u4f9d\u8d56\u5fae\u8c03\u6216\u51fd\u6570\u8c03\u7528\u6a21\u5f0f\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/naver-ai/DroneCATS", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01404", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u5b8c\u6574\u52a8\u4f5c\u7a7a\u95f4\u4ec5\u901a\u8fc7\u63d0\u793a\u8bcd\u58f0\u660e\u7ed9 MLLM\uff0c\u8003\u5bdf\u6a21\u578b\u81ea\u4e3b\u504f\u822a\u3001\u641c\u7d22\u3001\u4e0d\u786e\u5b9a\u65f6\u63a8\u7406\u4ee5\u53ca\u81ea\u6211\u5224\u65ad\u5230\u8fbe\u7684\u80fd\u529b\u3002", "\u8bc4\u6d4b\u4ece\u524d\u6cbf\u6a21\u578b\u5230 2B \u53c2\u6570\u5c0f\u6a21\u578b\uff0c\u53d1\u73b0\u5931\u8d25\u5173\u952e\u5f80\u5f80\u4e0d\u662f\u98de\u884c\u5bfc\u822a\uff0c\u800c\u662f\u52a8\u4f5c\u534f\u8bae\u7ef4\u6301\u4e0e\u7ec8\u6b62\u52a8\u4f5c\u8f93\u51fa\u3002", "\u5c0f\u578b\u5f00\u6e90\u6a21\u578b\u6709\u65f6\u6bd4\u524d\u6cbf\u6a21\u578b\u66f4\u53ef\u9760\u5730\u98de\u5165\u6210\u529f\u534a\u5f84\uff0c\u4f46\u5e38\u56e0\u8fc7\u65e9\u6216\u9057\u6f0f\u201c\u5230\u8fbe\u201d\u58f0\u660e\u800c\u5931\u8d25\uff1b\u591a\u673a\u4efb\u52a1\u4e2d\u8fd8\u4f1a\u51fa\u73b0\u8de8\u89c6\u89d2\u76f2\u76ee\u590d\u5236\u5750\u6807\u7684\u95ee\u9898\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5177\u8eab\u63a7\u5236", "\u673a\u5668\u4eba"], "num_comments": 1, "on_hf": true, "organization": "HyperCLOVA X", "pdf_url": "https://arxiv.org/pdf/2609.01404v1", "published_at": "2026-09-01", "score": 0.262, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01404.png", "title": "Evaluating Multimodal LLMs as Generalist Vision-Language-Action Agents for Drone Control: Commanding, Approaching, Tracking and Searching", "tldr": "DroneCATS\u8bc4\u6d4b\u591a\u6a21\u6001\u6a21\u578b\u63a7\u65e0\u4eba\u673a\u77ed\u677f", "upvotes": 8, "what_it_is": "\u8bba\u6587\u63d0\u51fa DroneCATS-Agent \u4e0e DroneCATS \u57fa\u51c6\uff0c\u628a\u591a\u6a21\u6001\u5927\u6a21\u578b\u76f4\u63a5\u653e\u5165\u65e0\u4eba\u673a\u63a7\u5236\u95ed\u73af\u4e2d\uff0c\u8bc4\u4f30\u5176\u4f5c\u4e3a\u901a\u7528\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u667a\u80fd\u4f53\u7684\u80fd\u529b\u3002\u4efb\u52a1\u8986\u76d6\u63a5\u8fd1\u76ee\u6807\u3001\u8ddf\u8e2a\u79fb\u52a8\u76ee\u6807\u3001\u89c6\u91ce\u5916\u641c\u7d22\u548c\u591a\u65e0\u4eba\u673a\u6307\u6325\uff0c\u4e14\u4e0d\u4f9d\u8d56\u5fae\u8c03\u6216\u51fd\u6570\u8c03\u7528\u6a21\u5f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a MLLM \u4ece\u201c\u770b\u61c2\u56fe\u50cf\u201d\u63a8\u8fdb\u5230\u771f\u5b9e\u5177\u8eab\u63a7\u5236\u534f\u8bae\u6267\u884c\u5c42\u9762\uff0c\u63ed\u793a\u4e86\u8fb9\u7f18\u90e8\u7f72\u65e0\u4eba\u673a\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u7a7a\u95f4\u611f\u77e5\u76f8\u5bf9\u53ef\u7528\uff0c\u4f46\u6301\u7eed\u9075\u5b88\u52a8\u4f5c\u534f\u8bae\u548c\u6b63\u786e\u7ec8\u6b62\u4ecd\u672a\u89e3\u51b3\u3002"}, {"abstract": "A central bottleneck in multi-hop Question Answering (QA) is that the granularity at which a question is expressed often differs from the granularity at which corpus evidence is retrievable. Existing methods address this mismatch by imposing fixed graph structures over the corpus, by iteratively reformulating the query, or by executing a generated program over it, but these strategies do not explicitly decide when a query unit is already supported by evidence and when it should be refined. We formulate this bottleneck as retrievable granularity discovery and introduce Hi-Q, an evidence-conditioned framework for hierarchical query refinement. At each query node, a resolution operator tests whether retrieved evidence supports the current query unit; resolved nodes terminate, while unresolved nodes are expanded by a dependency-preserving binary operator and checked by a semantic coverage verifier. Hi-Q therefore grows a query tree whose topology is determined by corpus support signals rather than by a fixed decomposition template or a pre-built graph. We evaluate Hi-Q on three multi-hop QA benchmarks, primarily under full-corpus retrieval, where dependent evidence must be located among open-domain distractors rather than within a small annotated pool. In this setting Hi-Q reaches 52.3 EM and 64.0 F1 averaged over the three benchmarks, ahead of the iterative retrieval baseline IRCoT by 15.1 EM / 18.2 F1 on that same average, and ahead of the graph-based RAG baseline PropRAG by 11.5 EM / 12.0 F1 on MuSiQue-full, without corpus-wide graph construction. In the restricted supporting/distractor setting used by prior work, Hi-Q likewise attains the best accuracy, with 57.9 EM and 69.3 F1 on average, ahead of PropRAG by 5.6 EM / 3.9 F1 and IRCoT by 13.7 EM / 15.8 F1. The project page is available at https://hi-q-project.github.io/.", "arxiv_id": "2608.30468", "arxiv_url": "https://arxiv.org/abs/2608.30468", "authors": ["Jueun Kim", "Sungho Park", "Wook-Shin Han"], "brief": "\u8bba\u6587\u63d0\u51fa Hi-Q\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u8df3\u95ee\u7b54\u7684\u8bc1\u636e\u6761\u4ef6\u5316\u5c42\u7ea7\u67e5\u8be2\u7ec6\u5316\u6846\u67b6\u3002\u5b83\u628a\u95ee\u9898\u5206\u89e3\u7c92\u5ea6\u4e0e\u8bed\u6599\u53ef\u68c0\u7d22\u8bc1\u636e\u7c92\u5ea6\u4e0d\u5339\u914d\u7684\u95ee\u9898\uff0c\u5efa\u6a21\u4e3a\u201c\u53ef\u68c0\u7d22\u7c92\u5ea6\u53d1\u73b0\u201d\uff0c\u5e76\u52a8\u6001\u751f\u957f\u67e5\u8be2\u6811\u3002", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30468", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u6bcf\u4e2a\u67e5\u8be2\u8282\u70b9\u7528 resolution operator \u5224\u65ad\u5f53\u524d\u67e5\u8be2\u5355\u5143\u662f\u5426\u5df2\u88ab\u68c0\u7d22\u8bc1\u636e\u652f\u6301\uff0c\u5df2\u89e3\u51b3\u5219\u505c\u6b62\uff0c\u672a\u89e3\u51b3\u5219\u7ee7\u7eed\u7ec6\u5316\u3002", "\u901a\u8fc7 dependency-preserving binary operator \u4fdd\u6301\u4f9d\u8d56\u5173\u7cfb\u5730\u4e8c\u5206\u5c55\u5f00\u67e5\u8be2\uff0c\u5e76\u7528 semantic coverage verifier \u68c0\u67e5\u5206\u89e3\u662f\u5426\u8986\u76d6\u539f\u8bed\u4e49\u3002", "\u5728\u4e09\u4e2a\u591a\u8df3 QA \u57fa\u51c6\u7684\u5168\u8bed\u6599\u68c0\u7d22\u8bbe\u7f6e\u4e0b\uff0c\u5e73\u5747\u8fbe\u5230 52.3 EM / 64.0 F1\uff0c\u663e\u8457\u8d85\u8fc7 IRCoT \u548c PropRAG\uff0c\u4e14\u65e0\u9700\u6784\u5efa\u5168\u8bed\u6599\u56fe\u3002"], "keywords": ["\u591a\u8df3\u95ee\u7b54", "\u4fe1\u606f\u68c0\u7d22", "RAG", "\u67e5\u8be2\u6539\u5199"], "num_comments": 1, "on_hf": true, "organization": "Pohang University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2608.30468v1", "published_at": "2026-08-31", "score": 0.244, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30468.png", "title": "Hi-Q: Hierarchical Evidence-guided Query Refinement for Multi-Hop Question Answering", "tldr": "\u6309\u8bc1\u636e\u5c42\u7ea7\u7ec6\u5316\u67e5\u8be2\u63d0\u5347\u591a\u8df3\u95ee\u7b54", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa Hi-Q\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u8df3\u95ee\u7b54\u7684\u8bc1\u636e\u6761\u4ef6\u5316\u5c42\u7ea7\u67e5\u8be2\u7ec6\u5316\u6846\u67b6\u3002\u5b83\u628a\u95ee\u9898\u5206\u89e3\u7c92\u5ea6\u4e0e\u8bed\u6599\u53ef\u68c0\u7d22\u8bc1\u636e\u7c92\u5ea6\u4e0d\u5339\u914d\u7684\u95ee\u9898\uff0c\u5efa\u6a21\u4e3a\u201c\u53ef\u68c0\u7d22\u7c92\u5ea6\u53d1\u73b0\u201d\uff0c\u5e76\u52a8\u6001\u751f\u957f\u67e5\u8be2\u6811\u3002", "why_notable": "Hi-Q \u4e0d\u4f9d\u8d56\u56fa\u5b9a\u5206\u89e3\u6a21\u677f\u6216\u9884\u6784\u5efa\u77e5\u8bc6\u56fe\uff0c\u800c\u662f\u6839\u636e\u8bc1\u636e\u652f\u6301\u4fe1\u53f7\u52a8\u6001\u51b3\u5b9a\u67e5\u8be2\u662f\u5426\u7ee7\u7eed\u7ec6\u5316\uff0c\u66f4\u8d34\u8fd1\u5f00\u653e\u57df\u591a\u8df3\u95ee\u7b54\u4e2d\u7684\u771f\u5b9e\u68c0\u7d22\u96be\u70b9\uff0c\u5bf9 RAG \u5f0f\u590d\u6742\u95ee\u7b54\u7cfb\u7edf\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While unified multimodal models (UMMs) jointly perform visual understanding and generation within a single model, functional unification does not guarantee learning synergy: the two objectives may reinforce each other, compete for capacity, or merely coexist. We investigate their relationship at the representation, task, and system levels in a controlled, structurally native setting without pretrained vision priors. At the representation level, we find that each objective provides useful signal to the other: generation enriches the visual features learned for understanding, while understanding strengthens vision--language alignment for generation. However, when both objectives are forced through the same computation path, one tends to dominate. A task-decoupled architecture that specializes conflicting visual computation while preserving semantic interaction avoids this asymmetric degradation. At the task level, through three case studies, we find positive bidirectional transfer when understanding and generation tasks rely on shared knowledge. At the system level, we show that an end-to-end UMM outperforms a matched planner--executor pipeline on complex tasks that explicitly require both image understanding and generation. Together, these results show that the value of UMMs extends beyond a unified interface: appropriate specialization, shared task knowledge, and end-to-end optimization can turn coexistence into synergy.", "arxiv_id": "2609.01607", "arxiv_url": "https://arxiv.org/abs/2609.01607", "authors": ["Penghao Wu", "Haiwen Diao", "Weichen Fan", "Lewei Lu", "Dahua Lin", "Ziwei Liu"], "brief": "\u8bba\u6587\u5728\u65e0\u9884\u8bad\u7ec3\u89c6\u89c9\u5148\u9a8c\u7684\u539f\u751f\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e2d\uff0c\u7cfb\u7edf\u7814\u7a76\u89c6\u89c9\u7406\u89e3\u4e0e\u89c6\u89c9\u751f\u6210\u5728\u8868\u793a\u3001\u4efb\u52a1\u548c\u7cfb\u7edf\u4e09\u4e2a\u5c42\u9762\u7684\u5173\u7cfb\u3002\u7ed3\u679c\u8868\u660e\u4e8c\u8005\u5e76\u975e\u5929\u7136\u534f\u540c\uff0c\u9700\u8981\u4efb\u52a1\u89e3\u8026\u7ed3\u6784\u3001\u5171\u4eab\u77e5\u8bc6\u4e0e\u7aef\u5230\u7aef\u4f18\u5316\u6765\u907f\u514d\u7ade\u4e89\u5e76\u5f62\u6210\u4e92\u8865\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01607", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8868\u793a\u5c42\u9762\uff1a\u751f\u6210\u76ee\u6807\u53ef\u4e30\u5bcc\u7406\u89e3\u6240\u9700\u89c6\u89c9\u7279\u5f81\uff0c\u7406\u89e3\u76ee\u6807\u53ef\u589e\u5f3a\u751f\u6210\u4e2d\u7684\u89c6\u89c9-\u8bed\u8a00\u5bf9\u9f50\u3002", "\u5f53\u7406\u89e3\u4e0e\u751f\u6210\u88ab\u8feb\u5171\u4eab\u540c\u4e00\u8ba1\u7b97\u8def\u5f84\u65f6\uff0c\u5e38\u51fa\u73b0\u4e00\u65b9\u4e3b\u5bfc\u3001\u53e6\u4e00\u65b9\u9000\u5316\uff1b\u4efb\u52a1\u89e3\u8026\u67b6\u6784\u53ef\u7f13\u89e3\u51b2\u7a81\u3002", "\u7cfb\u7edf\u5c42\u9762\uff1a\u7aef\u5230\u7aef\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u5728\u540c\u65f6\u9700\u8981\u56fe\u50cf\u7406\u89e3\u4e0e\u751f\u6210\u7684\u590d\u6742\u4efb\u52a1\u4e0a\u4f18\u4e8e\u5339\u914d\u7684\u89c4\u5212\u5668-\u6267\u884c\u5668\u6d41\u6c34\u7ebf\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u7406\u89e3", "\u56fe\u50cf\u751f\u6210", "\u8868\u793a\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01607v1", "published_at": "2026-09-01", "score": 0.237, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01607.png", "title": "Uncovering Understanding-Generation Synergy in Native Unified Multimodal Models: From Representation, Task to System", "tldr": "\u63ed\u793a\u7edf\u4e00\u591a\u6a21\u6001\u7406\u89e3\u4e0e\u751f\u6210\u7684\u534f\u540c\u6761\u4ef6", "upvotes": 8, "what_it_is": "\u8bba\u6587\u5728\u65e0\u9884\u8bad\u7ec3\u89c6\u89c9\u5148\u9a8c\u7684\u539f\u751f\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u4e2d\uff0c\u7cfb\u7edf\u7814\u7a76\u89c6\u89c9\u7406\u89e3\u4e0e\u89c6\u89c9\u751f\u6210\u5728\u8868\u793a\u3001\u4efb\u52a1\u548c\u7cfb\u7edf\u4e09\u4e2a\u5c42\u9762\u7684\u5173\u7cfb\u3002\u7ed3\u679c\u8868\u660e\u4e8c\u8005\u5e76\u975e\u5929\u7136\u534f\u540c\uff0c\u9700\u8981\u4efb\u52a1\u89e3\u8026\u7ed3\u6784\u3001\u5171\u4eab\u77e5\u8bc6\u4e0e\u7aef\u5230\u7aef\u4f18\u5316\u6765\u907f\u514d\u7ade\u4e89\u5e76\u5f62\u6210\u4e92\u8865\u3002", "why_notable": "\u8be5\u7814\u7a76\u4ece\u673a\u5236\u4e0a\u89e3\u91ca\u4e86\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u7684\u4ef7\u503c\u4e0d\u53ea\u662f\u63a5\u53e3\u7edf\u4e00\uff0c\u800c\u5728\u4e8e\u901a\u8fc7\u5408\u9002\u7ed3\u6784\u4e0e\u8bad\u7ec3\u65b9\u5f0f\u5b9e\u73b0\u7406\u89e3\u548c\u751f\u6210\u7684\u771f\u6b63\u534f\u540c\uff0c\u5bf9\u539f\u751f\u591a\u6a21\u6001\u6a21\u578b\u8bbe\u8ba1\u5177\u6709\u6307\u5bfc\u610f\u4e49\u3002"}, {"abstract": "VLM-driven self-improvement of web code has a structural flaw: the model that proposes the repair is the model that judges it, and visual plausibility under that judge is a poor proxy for whether the page actually works. What the loop is missing is a counterparty the VLM cannot fool, and the browser already is that counterparty: a deterministic, executable simulator of how an HTML artifact behaves under user actions, and in everything but name a world model for web code. We present WebWorld, the interface that lets a VLM prior interact with this browser-as-world-model autonomously and decides which interactions become supervision. Each round, the VLM emits a critique that the planner compiles into a typed interaction contract; the browser re-executes the candidate and issues an acceptance certificate only when both target progress and preservation of every previously verified capability hold; certified transitions accumulate as a quality ratchet that is the only thing the SFT export ever sees. Under matched training, WebWorld-27B improves Raw-27B by 5.3 points on HTMLBench-400 and 14.9 points on MiniAppBench-Val, and reaches the level of strong frontier systems such as Kimi-K2.6 and GPT-5.4 on interactive HTML generation. Equal-size ablations show that browser-backed admission carries the gain: without the certificate, the matched 9B lift nearly disappears.", "arxiv_id": "2608.30530", "arxiv_url": "https://arxiv.org/abs/2608.30530", "authors": ["Jiajun Wu", "Jian Yang", "Yaxin Du", "Wei Zhang", "Haowen Wang", "Junhang Cheng", "Yuxuan Zhang", "Tuney Zheng", "Xianglong Liu", "Ming Zhou"], "brief": "WebWorld \u5c06\u6d4f\u89c8\u5668\u4f5c\u4e3a\u7f51\u9875\u4ee3\u7801\u7684\u786e\u5b9a\u6027\u201c\u4e16\u754c\u6a21\u578b\u201d\uff0c\u8ba9 VLM \u901a\u8fc7\u4ea4\u4e92\u5951\u7ea6\u9a8c\u8bc1\u5019\u9009\u7f51\u9875\uff0c\u5e76\u53ea\u7528\u6d4f\u89c8\u5668\u9881\u53d1\u9a8c\u6536\u8bc1\u4e66\u7684\u6539\u8fdb\u6837\u672c\u8fdb\u884c SFT\u3002\u5b9e\u9a8c\u663e\u793a WebWorld-27B \u5728 HTMLBench-400 \u548c MiniAppBench-Val \u4e0a\u663e\u8457\u4f18\u4e8e\u540c\u89c4\u6a21\u539f\u59cb\u6a21\u578b\uff0c\u63a5\u8fd1\u5f3a\u524d\u6cbf\u7cfb\u7edf\uff1b\u6d88\u878d\u8868\u660e\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u6d4f\u89c8\u5668\u9a8c\u8bc1\u673a\u5236\u3002", "categories": ["cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30530", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7f51\u9875\u4ee3\u7801\u751f\u6210", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 2, "on_hf": true, "organization": "IQuest", "pdf_url": "https://arxiv.org/pdf/2608.30530v1", "published_at": "2026-08-31", "score": 0.054, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30530.png", "title": "WebWorld: The Browser as a World Model for Self-Improving Web Code", "tldr": "WebWorld \u5c06\u6d4f\u89c8\u5668\u4f5c\u4e3a\u7f51\u9875\u4ee3\u7801\u7684\u786e\u5b9a\u6027\u201c\u4e16\u754c\u6a21\u578b\u201d\uff0c\u8ba9 VLM \u901a\u8fc7\u4ea4\u4e92\u5951\u7ea6\u9a8c\u8bc1\u5019\u9009\u7f51\u9875\uff0c\u5e76\u53ea\u7528\u6d4f\u89c8\u5668\u9881\u53d1\u9a8c\u6536\u8bc1\u4e66\u7684\u6539\u8fdb\u6837\u672c\u8fdb\u884c SFT\u3002\u5b9e\u9a8c\u663e\u793a WebWorld-27B \u5728 HTMLBench-400 \u548c MiniAppBench-Val \u4e0a\u663e\u8457\u4f18\u4e8e\u540c\u89c4\u6a21\u539f\u59cb\u6a21\u578b\uff0c\u63a5\u8fd1\u5f3a\u524d\u6cbf\u7cfb\u7edf\uff1b\u6d88\u878d\u8868\u660e\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u6d4f\u89c8\u5668\u9a8c\u8bc1\u673a\u5236\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "We present H3-World, an efficient framework that turns the 33B MiniMax-H3 video generator into an interactive world model. Our key finding is that, as large video generators become more capable, language is emerging as a natural interface for control. MiniMax-H3, for example, already supports zero-shot control of character behavior and camera motion through natural-language instructions. Building on this, H3-World turns this coarse language interface into precise, temporally grounded world control, without introducing dedicated action modules. Specifically, we represent each action as a structured combination of character and camera instructions, and align them with the corresponding temporal video latents. To make the control temporally precise, we further introduce temporal attention routing, which restricts each instruction to its intended time interval and reduces control leakage across actions. Importantly, H3-World directly reuses the semantic representations learned during large-scale video pretraining and requires only lightweight adaptation. With only 8,000 gameplay samples, 10,000 LoRA optimization steps, and 0.199% trainable parameters, H3-World achieves effective character and camera control while preserving strong generation quality. It also generalizes to unseen scenarios. These results show that the control capabilities emerging in large video generators can be efficiently transformed into interactive world control.", "arxiv_id": "2609.01560", "arxiv_url": "https://arxiv.org/abs/2609.01560", "authors": ["Danze Chen", "Zeqing Wang", "Ziyue Lin", "Xingyi Yang", "Yeying Jin"], "brief": "H3-World \u5c06 33B MiniMax-H3 \u89c6\u9891\u751f\u6210\u5668\u6539\u9020\u6210\u53ef\u4ea4\u4e92\u4e16\u754c\u6a21\u578b\uff0c\u628a\u81ea\u7136\u8bed\u8a00\u4e2d\u7684\u89d2\u8272\u4e0e\u76f8\u673a\u6307\u4ee4\u5bf9\u9f50\u5230\u65f6\u95f4\u89c6\u9891\u6f5c\u53d8\u91cf\uff0c\u5b9e\u73b0\u7cbe\u786e\u7684\u65f6\u5e8f\u63a7\u5236\u3002\u65b9\u6cd5\u4ec5\u7528 8000 \u4e2a\u6e38\u620f\u6837\u672c\u3001LoRA \u8bad\u7ec3 1 \u4e07\u6b65\u548c 0.199% \u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u5c31\u80fd\u6709\u6548\u63a7\u5236\u89d2\u8272\u4e0e\u955c\u5934\u5e76\u4fdd\u6301\u751f\u6210\u8d28\u91cf\uff0c\u8fd8\u80fd\u6cdb\u5316\u5230\u672a\u89c1\u573a\u666f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/Danzer1xxxxChan/H3-World", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01560", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u8bed\u8a00\u63a7\u5236", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01560v1", "published_at": "2026-09-01", "score": 0.051, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01560.png", "title": "H3-World: Turning Language Understanding into World Control", "tldr": "H3-World \u5c06 33B MiniMax-H3 \u89c6\u9891\u751f\u6210\u5668\u6539\u9020\u6210\u53ef\u4ea4\u4e92\u4e16\u754c\u6a21\u578b\uff0c\u628a\u81ea\u7136\u8bed\u8a00\u4e2d\u7684\u89d2\u8272\u4e0e\u76f8\u673a\u6307\u4ee4\u5bf9\u9f50\u5230\u65f6\u95f4\u89c6\u9891\u6f5c\u53d8\u91cf\uff0c\u5b9e\u73b0\u7cbe\u786e\u7684\u65f6\u5e8f\u63a7\u5236\u3002\u65b9\u6cd5\u4ec5\u7528 8000 \u4e2a\u6e38\u620f\u6837\u672c\u3001LoRA \u8bad\u7ec3 1 \u4e07\u6b65\u548c 0.199% \u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u5c31\u80fd\u6709\u6548\u63a7\u5236\u89d2\u8272\u4e0e\u955c\u5934\u5e76\u4fdd\u6301\u751f\u6210\u8d28\u91cf\uff0c\u8fd8\u80fd\u6cdb\u5316\u5230\u672a\u89c1\u573a\u666f\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Speculative decoding accelerates large language model inference by using a draft model to generate candidate tokens, which are verified by the target model in a single forward pass. Verification proceeds sequentially and discards every position from the first rejection onward, yet existing draft training relies on token-level imitation of the target with a fixed per-position weighting that reflects neither property. We introduce Verification-Aware Training (VAT), a plug-in framework that simulates verification at every training step and turns the resulting accept and reject patterns into supervision. VAT consists of two components: (i) a verification head, a lightweight jointly trained binary classifier that supervises the draft model on whether each position survives sequential verification; (ii) verification-adaptive weighting, which replaces the fixed weighting schedule by keeping full weight up to each sample\u0027s first rejection point and re-anchoring the decay to start there. VAT modifies only the training objective, so it can be layered on top of existing methods without changing the draft architecture, the target model, or the inference procedure. Applied to EAGLE-3 and DFlash on Qwen3-4B, Qwen3-8B, and LLaMA-3.1-8B, VAT improves average acceptance length by up to 11.4% and wall-clock speedup by up to 8.7%, with consistent gains across math, code, and chat benchmarks. Code will be available at https://github.com/naver-ai/vat", "arxiv_id": "2608.30135", "arxiv_url": "https://arxiv.org/abs/2608.30135", "authors": ["Geonmo Gu", "Byeongho Heo", "HeeJae Jun", "Yoohoon Kang", "Sangmin Lee", "Sangdoo Yun", "Dongyoon Han"], "brief": "\u8bba\u6587\u63d0\u51fa Verification-Aware Training\uff08VAT\uff09\uff0c\u5728\u8bad\u7ec3\u8349\u7a3f\u6a21\u578b\u65f6\u6a21\u62df\u6295\u673a\u89e3\u7801\u7684\u9010\u6b65\u9a8c\u8bc1\u8fc7\u7a0b\uff0c\u5e76\u7528\u63a5\u53d7/\u62d2\u7edd\u6a21\u5f0f\u6765\u6539\u8fdb\u76d1\u7763\u4fe1\u53f7\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u6539\u53d8\u6a21\u578b\u7ed3\u6784\u6216\u63a8\u7406\u6d41\u7a0b\uff0c\u5728\u591a\u4e2a\u5927\u6a21\u578b\u4e0e\u57fa\u51c6\u4e0a\u5c06\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\u63d0\u5347\u6700\u9ad8 11.4%\uff0c\u7aef\u5230\u7aef\u63a8\u7406\u52a0\u901f\u6700\u9ad8 8.7%\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30135", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u6295\u673a\u89e3\u7801", "\u6a21\u578b\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "NAVER AI Lab", "pdf_url": "https://arxiv.org/pdf/2608.30135v1", "published_at": "2026-08-31", "score": 0.049, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30135.png", "title": "Verification-Aware Training for Speculative Decoding", "tldr": "\u8bba\u6587\u63d0\u51fa Verification-Aware Training\uff08VAT\uff09\uff0c\u5728\u8bad\u7ec3\u8349\u7a3f\u6a21\u578b\u65f6\u6a21\u62df\u6295\u673a\u89e3\u7801\u7684\u9010\u6b65\u9a8c\u8bc1\u8fc7\u7a0b\uff0c\u5e76\u7528\u63a5\u53d7/\u62d2\u7edd\u6a21\u5f0f\u6765\u6539\u8fdb\u76d1\u7763\u4fe1\u53f7\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u6539\u53d8\u6a21\u578b\u7ed3\u6784\u6216\u63a8\u7406\u6d41\u7a0b\uff0c\u5728\u591a\u4e2a\u5927\u6a21\u578b\u4e0e\u57fa\u51c6\u4e0a\u5c06\u5e73\u5747\u63a5\u53d7\u957f\u5ea6\u63d0\u5347\u6700\u9ad8 11.4%\uff0c\u7aef\u5230\u7aef\u63a8\u7406\u52a0\u901f\u6700\u9ad8 8.7%\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Prompt optimization can improve multi-agent LLM systems, but the prompts being optimized often serve two entangled roles: generating task-relevant content and specifying execution-critical protocols, such as message routing, output formatting, and termination signals, on which the underlying code relies. As a result, a prompt edit intended to improve content generation can inadvertently corrupt the protocol and cause the entire agent pipeline to fail. Our key observation is that these two roles have different representations: execution protocols are typically structured, while task-relevant content is usually expressed in unstructured language. Based on this, we propose control-data flow separation, where execution-critical control is represented as typed, validated program objects, while task-relevant language remains the optimizable data flow for agent communication. This design allows optimizers to improve multi-agent behavior without exposing the routing or formatting interface to prompt drift. Across synthetic reasoning, collaborative review generation, and insurance rating workflows, our framework empirically achieves 100% eventual protocol validity while consistently improving task performance.", "arxiv_id": "2609.00621", "arxiv_url": "https://arxiv.org/abs/2609.00621", "authors": ["Wentao Zhang", "Syed Shariyar Murtaza", "Junaid Ahmad Bhatti", "Utkarsh Soni", "Yifan Nie", "Eugene Wen", "Yuntian Deng"], "brief": "\u8bba\u6587\u6307\u51fa\u591a\u667a\u80fd\u4f53 LLM \u4e2d\u63d0\u793a\u8bcd\u540c\u65f6\u627f\u62c5\u5185\u5bb9\u751f\u6210\u548c\u6267\u884c\u534f\u8bae\u4e24\u7c7b\u804c\u8d23\uff0c\u4f18\u5316\u63d0\u793a\u8bcd\u65f6\u5bb9\u6613\u7834\u574f\u8def\u7531\u3001\u683c\u5f0f\u3001\u7ec8\u6b62\u4fe1\u53f7\u7b49\u534f\u8bae\u5bfc\u81f4\u6d41\u7a0b\u5931\u8d25\u3002\u4f5c\u8005\u63d0\u51fa\u63a7\u5236\u6d41-\u6570\u636e\u6d41\u5206\u79bb\uff1a\u5c06\u6267\u884c\u5173\u952e\u63a7\u5236\u8868\u793a\u4e3a\u5e26\u7c7b\u578b\u6821\u9a8c\u7684\u7a0b\u5e8f\u5bf9\u8c61\uff0c\u53ea\u8ba9\u81ea\u7136\u8bed\u8a00\u5185\u5bb9\u53c2\u4e0e\u4f18\u5316\uff1b\u5728\u63a8\u7406\u3001\u534f\u4f5c\u8bc4\u5ba1\u548c\u4fdd\u9669\u8bc4\u7ea7\u4efb\u52a1\u4e2d\u5b9e\u73b0\u4e86 100% \u6700\u7ec8\u534f\u8bae\u6709\u6548\u6027\uff0c\u5e76\u6301\u7eed\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL", "cs.MA"], "github_repo": "https://github.com/yuntian-group/cdsep", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.00621", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u63d0\u793a\u4f18\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7a0b\u5e8f\u9a8c\u8bc1"], "num_comments": 1, "on_hf": true, "organization": "University of Waterloo", "pdf_url": "https://arxiv.org/pdf/2609.00621v1", "published_at": "2026-09-01", "score": 0.047, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00621.png", "title": "Control-Data Flow Separation: Stable Prompt Optimization in Multi-Agent LLMs", "tldr": "\u8bba\u6587\u6307\u51fa\u591a\u667a\u80fd\u4f53 LLM \u4e2d\u63d0\u793a\u8bcd\u540c\u65f6\u627f\u62c5\u5185\u5bb9\u751f\u6210\u548c\u6267\u884c\u534f\u8bae\u4e24\u7c7b\u804c\u8d23\uff0c\u4f18\u5316\u63d0\u793a\u8bcd\u65f6\u5bb9\u6613\u7834\u574f\u8def\u7531\u3001\u683c\u5f0f\u3001\u7ec8\u6b62\u4fe1\u53f7\u7b49\u534f\u8bae\u5bfc\u81f4\u6d41\u7a0b\u5931\u8d25\u3002\u4f5c\u8005\u63d0\u51fa\u63a7\u5236\u6d41-\u6570\u636e\u6d41\u5206\u79bb\uff1a\u5c06\u6267\u884c\u5173\u952e\u63a7\u5236\u8868\u793a\u4e3a\u5e26\u7c7b\u578b\u6821\u9a8c\u7684\u7a0b\u5e8f\u5bf9\u8c61\uff0c\u53ea\u8ba9\u81ea\u7136\u8bed\u8a00\u5185\u5bb9\u53c2\u4e0e\u4f18\u5316\uff1b\u5728\u63a8\u7406\u3001\u534f\u4f5c\u8bc4\u5ba1\u548c\u4fdd\u9669\u8bc4\u7ea7\u4efb\u52a1\u4e2d\u5b9e\u73b0\u4e86 100% \u6700\u7ec8\u534f\u8bae\u6709\u6548\u6027\uff0c\u5e76\u6301\u7eed\u63d0\u5347\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Traditional frameworks of political communication operate under linear, event-driven assumptions that treat voter persuasion as a static, transactional function. This paper introduces Dynamic Consent Engineering (DCE), a novel interdisciplinary paradigm that synthesizes Edward Bernays\u0027 foundational principles of public relations with the S-E-E-D (Snowball, Equilibrium, Elasticity, Dominance) framework of system dynamics. By expanding Bernaysian operational constraints into a four-dimensional resource matrix (incorporating algorithmic media infrastructure alongside manpower, mindpower, and capital), we mathematically formalize how democratic institutions construct, optimize, and sustain political dominance. We map Bernays\u0027 classic eight-step engineering workflow directly onto non-linear feedback loops, information time lags, and demographic carrying capacities. Through rigorous modeling of systemic feedback structures, we isolate the dynamic root causes of political elasticity, policy resistance plateaus, and threshold-triggered trust collapses. Finally, we establish a four-step diagnostic pipeline and validate the framework via historical reference mode verification, demonstrating that long-term political stability depends not on ephemeral rhetoric, but on the structural synchronization of policy execution and dynamic feedback calibration.", "arxiv_id": "2608.27509", "arxiv_url": "https://arxiv.org/abs/2608.27509", "authors": ["Muhammad Sukri Bin Ramli"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u52a8\u6001\u540c\u610f\u5de5\u7a0b\u201d\u6846\u67b6\uff0c\u5c06\u4f2f\u5185\u65af\u516c\u5171\u5173\u7cfb\u7406\u8bba\u4e0e\u7cfb\u7edf\u52a8\u529b\u5b66\u7684 S-E-E-D \u6846\u67b6\u7ed3\u5408\uff0c\u7528\u975e\u7ebf\u6027\u53cd\u9988\u3001\u65f6\u95f4\u6ede\u540e\u548c\u4eba\u53e3\u627f\u8f7d\u7b49\u6982\u5ff5\u5efa\u6a21\u6c11\u4e3b\u653f\u6cbb\u4e2d\u7684\u652f\u914d\u4e0e\u7a33\u5b9a\u3002\u4f5c\u8005\u7ed9\u51fa\u56db\u7ef4\u8d44\u6e90\u77e9\u9635\u548c\u8bca\u65ad\u6d41\u7a0b\uff0c\u5e76\u901a\u8fc7\u5386\u53f2\u53c2\u8003\u6a21\u5f0f\u9a8c\u8bc1\uff0c\u5f3a\u8c03\u653f\u6cbb\u7a33\u5b9a\u53d6\u51b3\u4e8e\u653f\u7b56\u6267\u884c\u4e0e\u53cd\u9988\u6821\u51c6\u7684\u7ed3\u6784\u6027\u540c\u6b65\u3002", "categories": ["physics.soc-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27509", "impact_score": 3, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u793e\u4f1a\u7269\u7406", "\u7cfb\u7edf\u52a8\u529b\u5b66", "\u653f\u6cbb\u4f20\u64ad", "\u53cd\u9988\u5efa\u6a21"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.27509v2", "published_at": "2026-08-27", "score": 0.041, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27509.png", "title": "The Mechanics of Democratic Dominance: A System Dynamics Paradigm for Dynamic Consent Engineering", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u52a8\u6001\u540c\u610f\u5de5\u7a0b\u201d\u6846\u67b6\uff0c\u5c06\u4f2f\u5185\u65af\u516c\u5171\u5173\u7cfb\u7406\u8bba\u4e0e\u7cfb\u7edf\u52a8\u529b\u5b66\u7684 S-E-E-D \u6846\u67b6\u7ed3\u5408\uff0c\u7528\u975e\u7ebf\u6027\u53cd\u9988\u3001\u65f6\u95f4\u6ede\u540e\u548c\u4eba\u53e3\u627f\u8f7d\u7b49\u6982\u5ff5\u5efa\u6a21\u6c11\u4e3b\u653f\u6cbb\u4e2d\u7684\u652f\u914d\u4e0e\u7a33\u5b9a\u3002\u4f5c\u8005\u7ed9\u51fa\u56db\u7ef4\u8d44\u6e90\u77e9\u9635\u548c\u8bca\u65ad\u6d41\u7a0b\uff0c\u5e76\u901a\u8fc7\u5386\u53f2\u53c2\u8003\u6a21\u5f0f\u9a8c\u8bc1\uff0c\u5f3a\u8c03\u653f\u6cbb\u7a33\u5b9a\u53d6\u51b3\u4e8e\u653f\u7b56\u6267\u884c\u4e0e\u53cd\u9988\u6821\u51c6\u7684\u7ed3\u6784\u6027\u540c\u6b65\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce BLARM, a feed-forward method for video-driven 3D mesh animation. Given a monocular video and a static object mesh, BLARM predicts a temporally coherent animated mesh whose motion follows the video. Rather than relying on explicit rigs or directly regressing high-dimensional vertex motion, we represent animation using a compact set of learned, time-varying rigid motion components and time-invariant vertex-to-component skinning weights. This yields a low-dimensional deformation space without requiring skeletons, cages, skinning weights, or rig annotations. Our architecture conditions geometry-derived deformation latents on video features through factorized spatial-temporal attention, then decodes rigid transformations blended by predicted skinning weights. Trained with trajectory reconstruction, entropy regularization, and motion-aware contrastive learning, BLARM produces accurate and temporally stable animations while recovering compact, interpretable motion structure from monocular video.", "arxiv_id": "2608.31113", "arxiv_url": "https://arxiv.org/abs/2608.31113", "authors": ["Pradyumn Goyal", "Yizhak Ben-Shabat", "Hsueh-Ti Derek Liu", "Haomiao Jiang", "Snehasish Mukherjee", "Kyle Spence", "Mark Stauber", "Evangelos Kalogerakis", "Yunze Zeng"], "brief": "BLARM \u662f\u4e00\u79cd\u524d\u9988\u5f0f\u89c6\u9891\u9a71\u52a8 3D \u7f51\u683c\u52a8\u753b\u65b9\u6cd5\uff0c\u53ef\u4ece\u5355\u76ee\u89c6\u9891\u548c\u9759\u6001\u7269\u4f53\u7f51\u683c\u751f\u6210\u65f6\u95f4\u4e00\u81f4\u7684\u52a8\u753b\u3002\u5b83\u7528\u5c11\u91cf\u5b66\u4e60\u5230\u7684\u521a\u4f53\u8fd0\u52a8\u7ec4\u4ef6\u4e0e\u9876\u70b9\u8499\u76ae\u6743\u91cd\u8868\u793a\u5f62\u53d8\uff0c\u65e0\u9700\u9aa8\u67b6\u6216\u7ed1\u5b9a\u6807\u6ce8\uff0c\u5e76\u901a\u8fc7\u65f6\u7a7a\u6ce8\u610f\u529b\u548c\u5bf9\u6bd4\u5b66\u4e60\u63d0\u5347\u52a8\u753b\u7cbe\u5ea6\u4e0e\u7a33\u5b9a\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.31113", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u52a8\u753b", "\u89c6\u9891\u9a71\u52a8", "\u7f51\u683c\u5f62\u53d8", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 1, "on_hf": true, "organization": "Roblox Corporation", "pdf_url": "https://arxiv.org/pdf/2608.31113v1", "published_at": "2026-08-31", "score": 0.041, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31113.png", "title": "BLARM: Animating 3D Objects from Video via Blending Latent Rigid Motion Primitives", "tldr": "BLARM \u662f\u4e00\u79cd\u524d\u9988\u5f0f\u89c6\u9891\u9a71\u52a8 3D \u7f51\u683c\u52a8\u753b\u65b9\u6cd5\uff0c\u53ef\u4ece\u5355\u76ee\u89c6\u9891\u548c\u9759\u6001\u7269\u4f53\u7f51\u683c\u751f\u6210\u65f6\u95f4\u4e00\u81f4\u7684\u52a8\u753b\u3002\u5b83\u7528\u5c11\u91cf\u5b66\u4e60\u5230\u7684\u521a\u4f53\u8fd0\u52a8\u7ec4\u4ef6\u4e0e\u9876\u70b9\u8499\u76ae\u6743\u91cd\u8868\u793a\u5f62\u53d8\uff0c\u65e0\u9700\u9aa8\u67b6\u6216\u7ed1\u5b9a\u6807\u6ce8\uff0c\u5e76\u901a\u8fc7\u65f6\u7a7a\u6ce8\u610f\u529b\u548c\u5bf9\u6bd4\u5b66\u4e60\u63d0\u5347\u52a8\u753b\u7cbe\u5ea6\u4e0e\u7a33\u5b9a\u6027\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal memory offers a scalable interface for long-video question answering, but existing methods often retrieve captions, frames, transcripts, summaries, or graph facts as isolated fragments. Although searchable, such fragments are not generation-ready: language models must reconstruct cross-modal and temporal alignments at inference time, when context is limited and attribution is difficult. We propose EM^2Mem, an event-centric multimodal memory framework that binds heterogeneous evidence to event anchors during memory construction. Each event-indexed memory cell aligns multimodal records, temporal context, graph-linked relations, semantic facts, and provenance, enabling compact evidence readout over grounded multimodal events rather than modality-specific fragments. Across three long-video QA benchmarks, EM^2Mem improves average accuracy over the strongest memory baseline by 2.0, 2.4, and 3.7 points, improves strict event-level Top-5 evidence recall by 7.0 points, and reduces per-query latency by 4.67 times and total inference tokens by 63.66% (The code will be integrated into https://github.com/zjunlp/LightMem).", "arxiv_id": "2609.00551", "arxiv_url": "https://arxiv.org/abs/2609.00551", "authors": ["Yijun Chen", "Yaqi Zheng", "Yanya Li", "Boyi Xiao", "Buqiang Xu", "Shuofei Qiao", "Jizhan Fang", "Xinle Deng", "Yunzhi Yao", "Xuehai Wang", "Liuxin Zhang", "Hui Li", "Huajun Chen", "Shumin Deng"], "brief": "\u672c\u6587\u63d0\u51fa EM^2Mem\uff0c\u4e00\u79cd\u9762\u5411\u957f\u89c6\u9891\u95ee\u7b54\u7684\u4e8b\u4ef6\u4e2d\u5fc3\u591a\u6a21\u6001\u8bb0\u5fc6\u6846\u67b6\uff0c\u5728\u6784\u5efa\u8bb0\u5fc6\u65f6\u5c06 e\u53ec\u56de\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u5ef6\u8fdf\u548c\u63a8\u7406 token \u6570\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Safeguards in deployed LLM services are evaluated by refusal, attack success, and policy violation rates. Those rates characterize how a control performed on the requests it was tested on. A deployment has to answer a different question: how much help with harmful tasks the service still gives an attacker who keeps adapting or finds another way in. We determine what each reported result implies for that question, allowing results from different safeguard families to be compared under one deployment criterion. The evidence requirements are strongly asymmetric. One attack that obtains harmful help from the deployed service suffices to establish that such help remains, and such attacks appear repeatedly in the coded record. Establishing that little remains cannot follow from the safeguard\u0027s own numbers alone; it also requires evidence about what the surrounding system still allows after the safeguard performs its local function. Such evidence is supported or derived in only a small minority of the depth-coded claims, and one such claim bounds its scoped residual. A better local score is therefore not, by itself, a stronger claim about the deployment. Safeguard research cannot stop at raising local scores; a gain has to be judged by whether it makes a deployed system any safer.", "arxiv_id": "2609.00519", "arxiv_url": "https://arxiv.org/abs/2609.00519", "authors": ["Pingyu Wu", "Weiming Zhang", "Nenghai Yu"], "brief": "\u672c\u6587\u6307\u51fa\uff0cLLM \u9632\u62a4\u63aa\u65bd\u7684\u62d2\u7b54\u7387\u3001\u653b\u51fb\u6210\u529f\u7387\u7b49\u672c\u5730\u6307\u6807\u5e76\u4e0d\u80fd\u76f4\u63a5\u8bf4\u660e\u90e8\u7f72\u7cfb\u7edf\u662f\u5426\u66f4\u5b89\u5168\u3002\u4f5c\u8005\u63d0\u51fa\u7528\u201c\u653b\u51fb\u8005\u5728\u6301\u7eed\u9002\u5e94\u540e\u8fd8\u80fd\u83b7\u5f97\u591a\u5c11\u6709\u5bb3\u5e2e\u52a9\u201d\u7684\u90e8\u7f72\u89c6\u89d2\u91cd\u65b0\u6bd4\u8f83\u4e0d\u540c\u9632\u62a4\uff0c\u5e76\u53d1\u73b0\u8bc1\u660e\u7cfb\u7edf\u6b8b\u4f59\u98ce\u9669\u5f88\u4f4e\u9700\u8981\u989d\u5916\u7cfb\u7edf\u7ea7\u8bc1\u636e\uff0c\u800c\u8fd9\u5728\u73b0\u6709\u7814\u7a76\u4e2d\u5f88\u5c11\u89c1\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00519", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u5b89\u5168\u8bc4\u4f30", "\u98ce\u9669\u63a7\u5236"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00519v1", "published_at": "2026-09-01", "score": 0.033, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00519.png", "title": "The Safeguard Worked. Is the LLM System Safer?", "tldr": "\u672c\u6587\u6307\u51fa\uff0cLLM \u9632\u62a4\u63aa\u65bd\u7684\u62d2\u7b54\u7387\u3001\u653b\u51fb\u6210\u529f\u7387\u7b49\u672c\u5730\u6307\u6807\u5e76\u4e0d\u80fd\u76f4\u63a5\u8bf4\u660e\u90e8\u7f72\u7cfb\u7edf\u662f\u5426\u66f4\u5b89\u5168\u3002\u4f5c\u8005\u63d0\u51fa\u7528\u201c\u653b\u51fb\u8005\u5728\u6301\u7eed\u9002\u5e94\u540e\u8fd8\u80fd\u83b7\u5f97\u591a\u5c11\u6709\u5bb3\u5e2e\u52a9\u201d\u7684\u90e8\u7f72\u89c6\u89d2\u91cd\u65b0\u6bd4\u8f83\u4e0d\u540c\u9632\u62a4\uff0c\u5e76\u53d1\u73b0\u8bc1\u660e\u7cfb\u7edf\u6b8b\u4f59\u98ce\u9669\u5f88\u4f4e\u9700\u8981\u989d\u5916\u7cfb\u7edf\u7ea7\u8bc1\u636e\uff0c\u800c\u8fd9\u5728\u73b0\u6709\u7814\u7a76\u4e2d\u5f88\u5c11\u89c1\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "SAR-to-EO image translation aims to generate electro-optical (EO) imagery from synthetic aperture radar (SAR) observations. Existing latent diffusion approaches typically inherit a predetermined autoencoder, although reconstruction fidelity can vary substantially across codecs and modalities. Because the latent codec affects the round-trip preservation of both SAR conditions and EO targets, codec selection constitutes a fundamental design choice; nevertheless, existing methods largely rely on codecs pretrained on natural images. To remedy this, we introduce ReFlowSET, a conditional latent flow-matching framework that selects its codec through a joint SAR--EO reconstruction audit. Rather than inheriting a heavyweight pretrained generator, ReFlowSET trains a substantially smaller conditional DiT from scratch in the selected latent space, using dual-stream SAR conditioning followed by joint feature refinement. To provide semantic guidance for this from-scratch training, intermediate noisy-EO features are aligned with clean target-EO representations extracted by a frozen vision foundation model. This alignment is used only during training and introduces no additional inference cost. Experiments on QXS-SAROPT and SAR2Opt demonstrate state-of-the-art performance across diverse perceptual fidelity and distributional metrics. Code and pretrained weights are publicly available at https://github.com/KAIST-VICLab/ReFlowSET.", "arxiv_id": "2609.00968", "arxiv_url": "https://arxiv.org/abs/2609.00968", "authors": ["Jeonghyeok Do", "Seungchul Lee", "Munchurl Kim"], "brief": "ReFlowSET\u9762\u5411SAR\u5230\u5149\u5b66\u56fe\u50cf\u7ffb\u8bd1\uff0c\u5148\u901a\u8fc7\u8054\u5408SAR-EO\u91cd\u5efa\u8bc4\u4f30\u9009\u62e9\u5408\u9002\u6f5c\u7a7a\u95f4\u7f16\u7801\u5668\uff0c\u518d\u5728\u8be5\u6f5c\u7a7a\u95f4\u4ece\u96f6\u8bad\u7ec3\u8f83\u5c0f\u7684\u6761\u4ef6DiT\u6d41\u5339\u914d\u6a21\u578b\u3002\u65b9\u6cd5\u5f15\u5165\u53cc\u6d41SAR\u6761\u4ef6\u3001\u8054\u5408\u7279\u5f81\u7ec6\u5316\uff0c\u5e76\u5728\u8bad\u7ec3\u4e2d\u7528\u51bb\u7ed3\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u5bf9\u9f50\u566a\u58f0EO\u7279\u5f81\u4e0e\u5e72\u51c0EO\u8868\u5f81\uff0c\u5728\u4e24\u4e2a\u6570\u636e\u96c6\u4e0a\u8fbe\u5230\u5f53\u524d\u6700\u4f73\u6548\u679c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u6210\u672c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/KAIST-VICLab/ReFlowSET", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.00968", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u7ffb\u8bd1", "\u6d41\u5339\u914d", "\u9065\u611f", "\u89c6\u89c9\u57fa\u7840\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "KAIST", "pdf_url": "https://arxiv.org/pdf/2609.00968v1", "published_at": "2026-09-01", "score": 0.032, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00968.png", "title": "ReFlowSET: Representation-Aligned Latent Flow Matching for SAR-to-EO Image Translation", "tldr": "ReFlowSET\u9762\u5411SAR\u5230\u5149\u5b66\u56fe\u50cf\u7ffb\u8bd1\uff0c\u5148\u901a\u8fc7\u8054\u5408SAR-EO\u91cd\u5efa\u8bc4\u4f30\u9009\u62e9\u5408\u9002\u6f5c\u7a7a\u95f4\u7f16\u7801\u5668\uff0c\u518d\u5728\u8be5\u6f5c\u7a7a\u95f4\u4ece\u96f6\u8bad\u7ec3\u8f83\u5c0f\u7684\u6761\u4ef6DiT\u6d41\u5339\u914d\u6a21\u578b\u3002\u65b9\u6cd5\u5f15\u5165\u53cc\u6d41SAR\u6761\u4ef6\u3001\u8054\u5408\u7279\u5f81\u7ec6\u5316\uff0c\u5e76\u5728\u8bad\u7ec3\u4e2d\u7528\u51bb\u7ed3\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u5bf9\u9f50\u566a\u58f0EO\u7279\u5f81\u4e0e\u5e72\u51c0EO\u8868\u5f81\uff0c\u5728\u4e24\u4e2a\u6570\u636e\u96c6\u4e0a\u8fbe\u5230\u5f53\u524d\u6700\u4f73\u6548\u679c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u6210\u672c\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "This paper studies autonomous software development, in which LLM-based coding agents transform high-level requirements into complete, functional, and usable software systems without human intervention. We introduce Harness-of-Harness (HoH), a framework that enables coding agents to continually improve software during autonomous development. HoH operates on existing coding-agent harnesses, and organizes their executions into iterative planning-coding-testing loops. To sustain improvement across loops, HoH balances repair with capability growth, scopes development into small and verifiable increments, separates implementation-time testing from independent evaluation, and constrains verifiable outputs rather than prescribing agent workflows. It progressively exposes deliverables, role-specific tools, and skills, encourages reuse rather than recreation, and maintains versioned project histories. On GameCraft-Bench, FrontierSWE, and ProgramBench, three harness-model pairs (Codex with GPT-5.5, OpenCode with DeepSeek-V4-Pro, and Pi with MiniMax-M3), HoH consistently outperforms the corresponding standalone harnesses, achieving an average relative gain of 52.25 percent and a maximum gain of 82.86 percent after three iterations. In a multi-day deployment with more than 70 iterations, HoH autonomously develops a first-person-shooter game, featuring a coherent storyline, fully implemented core mechanics, human-playable experience, polished visuals and integrated audio. Github: https://github.com/Flesymeb/HarnessOfHarness Project Page: https://flesymeb.github.io/HarnessOfHarness/", "arxiv_id": "2609.01481", "arxiv_url": "https://arxiv.org/abs/2609.01481", "authors": ["Haoyang Yan", "Min-le Su", "Hangfan Zhang", "Zhanhao Li", "Chen Zhang", "Shao Zhang", "Yang Chen", "Lei Bai", "Shuyue Hu"], "brief": "\u8bba\u6587\u63d0\u51fa Harness-of-Harness\uff08HoH\uff09\uff0c\u5728\u73b0\u6709\u5927\u8bed\u8a00\u6a21\u578b\u7f16\u7a0b\u667a\u80fd\u4f53\u6846\u67b6\u4e4b\u4e0a\u7ec4\u7ec7\u591a\u8f6e\u89c4\u5212\u3001\u7f16\u7801\u3001\u6d4b\u8bd5\u5faa\u73af\uff0c\u4f7f\u5176\u80fd\u5728\u65e0\u4eba\u5e72\u9884\u4e0b\u6301\u7eed\u6539\u8fdb\u8f6f\u4ef6\u9879\u76ee\u3002HoH \u5728\u591a\u4e2a\u57fa\u51c6\u548c\u4e09\u7ec4\u6846\u67b6-\u6a21\u578b\u7ec4\u5408\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u539f\u59cb\u6846\u67b6\uff0c\u5e73\u5747\u76f8\u5bf9\u63d0\u5347 52.25%\uff0c\u5e76\u5728 70 \u591a\u8f6e\u591a\u65e5\u90e8\u7f72\u4e2d\u81ea\u4e3b\u5f00\u53d1\u51fa\u53ef\u73a9\u7684\u7b2c\u4e00\u4eba\u79f0\u5c04\u51fb\u6e38\u620f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01481", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01481v1", "published_at": "2026-09-01", "score": 0.029, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01481.png", "title": "Harness-of-Harness: Multi-Day Autonomous Software Development with Continual Improvement", "tldr": "\u8bba\u6587\u63d0\u51fa Harness-of-Harness\uff08HoH\uff09\uff0c\u5728\u73b0\u6709\u5927\u8bed\u8a00\u6a21\u578b\u7f16\u7a0b\u667a\u80fd\u4f53\u6846\u67b6\u4e4b\u4e0a\u7ec4\u7ec7\u591a\u8f6e\u89c4\u5212\u3001\u7f16\u7801\u3001\u6d4b\u8bd5\u5faa\u73af\uff0c\u4f7f\u5176\u80fd\u5728\u65e0\u4eba\u5e72\u9884\u4e0b\u6301\u7eed\u6539\u8fdb\u8f6f\u4ef6\u9879\u76ee\u3002HoH \u5728\u591a\u4e2a\u57fa\u51c6\u548c\u4e09\u7ec4\u6846\u67b6-\u6a21\u578b\u7ec4\u5408\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u539f\u59cb\u6846\u67b6\uff0c\u5e73\u5747\u76f8\u5bf9\u63d0\u5347 52.25%\uff0c\u5e76\u5728 70 \u591a\u8f6e\u591a\u65e5\u90e8\u7f72\u4e2d\u81ea\u4e3b\u5f00\u53d1\u51fa\u53ef\u73a9\u7684\u7b2c\u4e00\u4eba\u79f0\u5c04\u51fb\u6e38\u620f\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal misinformation on social media is highly prevalent, potent, and harmful, yet difficult to detect and counter, and still poorly understood compared to its text-only counterpart. Research on the properties and deceptive strategies of multimodal misinformation is hindered by a lack of taxonomies grounded in real-world contexts and by the limitations of current multimodal machine learning models, which prevent the automation of annotation and analysis at scale. We address these shortcomings in three steps. First, we collect a large-scale, high-quality dataset of real-world misinformation instances from Twitter/X in seven languages. Second, we develop a novel, comprehensive taxonomy of multimodal misinformation grounded in an in-depth qualitative analysis of the data and prior theoretical work. Finally, we operationalise the taxonomy through an automated multi-step annotation pipeline using a Vision-Language Model (VLM), and perform human-validation. Our novel approach leads to previously undocumented insights about how social media users combine images with text to spread misinformation in the wild, e.g., that AI-generated content is particularly prevalent in technology and science, while vaccination misinformation disproportionately utilises images from news outlets to assert credibility. Our method and findings provide guidance for targeted approaches for detecting multimodal misinformation, and suggest that mitigation efforts should be developed and applied strategically rather than uniformly.", "arxiv_id": "2608.29681", "arxiv_url": "https://arxiv.org/abs/2608.29681", "authors": ["Nadav Borenstein", "Greta Warren", "Desmond Elliott", "Isabelle Augenstein"], "brief": "\u672c\u6587\u6536\u96c6\u4e86 Twitter/X \u4e0a\u4e03\u79cd\u8bed\u8a00\u7684\u5927\u89c4\u6a21\u771f\u5b9e\u591a\u6a21\u6001\u865a\u5047\u4fe1\u606f\u6570\u636e\uff0c\u5e76\u63d0\u51fa\u4e00\u4e2a\u7edf\u4e00\u5206\u7c7b\u4f53\u7cfb\uff0c\u7528\u4e8e\u5206\u6790\u56fe\u6587\u5982\u4f55\u534f\u540c\u8bef\u5bfc\u3002\u7814\u7a76\u8fd8\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6784\u5efa\u591a\u6b65\u81ea\u52a8\u6807\u6ce8\u6d41\u7a0b\u5e76\u8fdb\u884c\u4eba\u5de5\u9a8c\u8bc1\uff0c\u53d1\u73b0\u4e0d\u540c\u4e3b\u9898\u4e2d\u7684\u8bef\u5bfc\u7b56\u7565\u5b58\u5728\u5dee\u5f02\uff0c\u4f8b\u5982\u79d1\u6280\u4e0e\u79d1\u5b66\u9886\u57df\u66f4\u5e38\u89c1 AI \u751f\u6210\u5185\u5bb9\uff0c\u75ab\u82d7\u8c23\u8a00\u66f4\u5e38\u501f\u7528\u65b0\u95fb\u56fe\u7247\u589e\u5f3a\u53ef\u4fe1\u5ea6\u3002", "categories": ["cs.CY"], "github_repo": "https://github.com/nadavborenstein/MultimodalTaxonomy", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29681", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u865a\u5047\u4fe1\u606f\u68c0\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u793e\u4ea4\u5a92\u4f53"], "num_comments": 2, "on_hf": true, "organization": "CopeNLU", "pdf_url": "https://arxiv.org/pdf/2608.29681v1", "published_at": "2026-08-30", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.29681.png", "title": "MMMMM: A Unified Taxonomy for Investigating the Mechanisms of Multilingual MultiModal Misinformation", "tldr": "\u672c\u6587\u6536\u96c6\u4e86 Twitter/X \u4e0a\u4e03\u79cd\u8bed\u8a00\u7684\u5927\u89c4\u6a21\u771f\u5b9e\u591a\u6a21\u6001\u865a\u5047\u4fe1\u606f\u6570\u636e\uff0c\u5e76\u63d0\u51fa\u4e00\u4e2a\u7edf\u4e00\u5206\u7c7b\u4f53\u7cfb\uff0c\u7528\u4e8e\u5206\u6790\u56fe\u6587\u5982\u4f55\u534f\u540c\u8bef\u5bfc\u3002\u7814\u7a76\u8fd8\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6784\u5efa\u591a\u6b65\u81ea\u52a8\u6807\u6ce8\u6d41\u7a0b\u5e76\u8fdb\u884c\u4eba\u5de5\u9a8c\u8bc1\uff0c\u53d1\u73b0\u4e0d\u540c\u4e3b\u9898\u4e2d\u7684\u8bef\u5bfc\u7b56\u7565\u5b58\u5728\u5dee\u5f02\uff0c\u4f8b\u5982\u79d1\u6280\u4e0e\u79d1\u5b66\u9886\u57df\u66f4\u5e38\u89c1 AI \u751f\u6210\u5185\u5bb9\uff0c\u75ab\u82d7\u8c23\u8a00\u66f4\u5e38\u501f\u7528\u65b0\u95fb\u56fe\u7247\u589e\u5f3a\u53ef\u4fe1\u5ea6\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "End-to-end weather forecasting systems produce skillful global gridded and station forecasts directly from raw Earth observations, replacing the numerical weather prediction pipeline, including data assimilation, at a fraction of its cost. These systems are deterministic and issue no uncertainty. Here we render the Aardvark Weather model probabilistic by attaching one stochastic mechanism to each component: learned, input-dependent noise at the observation encoder, capturing aleatoric uncertainty inherited from the observing system, and Monte Carlo dropout in the processor, capturing epistemic uncertainty in the learned dynamics. The resulting nested ensemble attributes forecast spread to the two sources through a law-of-total-variance decomposition, cross-checked by withholding observation streams. Probabilistic finetuning significantly improves the mean forecast, by 4.2% on average across variables and lead times. The ensemble is calibrated against ERA5 through the medium range (spread-skill ratio 0.98), keeps station RMSE within 2.4% of the deterministic model while beating it in CRPS at every lead time, and trails the operational ECMWF ensemble. The encoder branch behaves as observation-driven uncertainty. Component-attributed uncertainty makes end-to-end forecasts more transparent, a step toward observation-driven digital twins of the atmosphere.", "arxiv_id": "2608.30795", "arxiv_url": "https://arxiv.org/abs/2608.30795", "authors": ["Rodrigo Almeida", "Noelia Otero", "Jost Arndt", "Simon Baur", "Wojciech Samek", "Jackie Ma"], "brief": "\u672c\u6587\u5c06\u7aef\u5230\u7aef\u5929\u6c14\u9884\u62a5\u6a21\u578b Aardvark Weather \u6982\u7387\u5316\uff1a\u5728\u89c2\u6d4b\u7f16\u7801\u5668\u52a0\u5165\u8f93\u5165\u76f8\u5173\u566a\u58f0\u4ee5\u523b\u753b\u89c2\u6d4b\u4e0d\u786e\u5b9a\u6027\uff0c\u5728\u52a8\u529b\u8fc7\u7a0b\u6a21\u5757\u4f7f\u7528 Monte Carlo dropout \u4ee5\u523b\u753b\u6a21\u578b\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\u3002\u8be5\u5d4c\u5957\u96c6\u5408\u65b9\u6cd5\u53ef\u5206\u89e3\u9884\u62a5\u4e0d\u786e\u5b9a\u6027\u6765\u6e90\uff0c\u5e76\u4f7f\u5e73\u5747\u9884\u62a5\u63d0\u5347\u7ea6 4.2%\uff0c\u96c6\u5408\u6821\u51c6\u6027\u8f83\u597d\uff0c\u4f46\u6574\u4f53\u4ecd\u843d\u540e\u4e8e\u4e1a\u52a1 ECMWF \u96c6\u5408\u9884\u62a5\u3002", "categories": ["physics.ao-ph", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30795", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5929\u6c14\u9884\u62a5", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u96c6\u5408\u9884\u62a5", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Fraunhofer-Institut f\u00fcr Nachrichtentechnik, Heinrich-Hertz-Institut, HHI", "pdf_url": "https://arxiv.org/pdf/2608.30795v1", "published_at": "2026-08-31", "score": 0.025, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30795.png", "title": "Uncertainty-Aware End-to-End AI Weather Forecasting: Disentangling Observation and Model Contributions", "tldr": "\u672c\u6587\u5c06\u7aef\u5230\u7aef\u5929\u6c14\u9884\u62a5\u6a21\u578b Aardvark Weather \u6982\u7387\u5316\uff1a\u5728\u89c2\u6d4b\u7f16\u7801\u5668\u52a0\u5165\u8f93\u5165\u76f8\u5173\u566a\u58f0\u4ee5\u523b\u753b\u89c2\u6d4b\u4e0d\u786e\u5b9a\u6027\uff0c\u5728\u52a8\u529b\u8fc7\u7a0b\u6a21\u5757\u4f7f\u7528 Monte Carlo dropout \u4ee5\u523b\u753b\u6a21\u578b\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\u3002\u8be5\u5d4c\u5957\u96c6\u5408\u65b9\u6cd5\u53ef\u5206\u89e3\u9884\u62a5\u4e0d\u786e\u5b9a\u6027\u6765\u6e90\uff0c\u5e76\u4f7f\u5e73\u5747\u9884\u62a5\u63d0\u5347\u7ea6 4.2%\uff0c\u96c6\u5408\u6821\u51c6\u6027\u8f83\u597d\uff0c\u4f46\u6574\u4f53\u4ecd\u843d\u540e\u4e8e\u4e1a\u52a1 ECMWF \u96c6\u5408\u9884\u62a5\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Stain normalization reduces color variations caused by variations in staining protocols and imaging conditions, thereby enhancing computer-aided diagnostic system performance. Traditional methods derive mapping relationships from individual or limited reference images through pixel-wise transformation, offering style flexibility but suffering from inaccurate color mapping extraction. While existing deep-learning-based approaches achieve accurate dataset-wide color mapping through complex neural networks, they face challenges including computational inefficiency, artifact generation, and fixed normalization directions requiring model retraining for directional changes. To address these limitations, we propose StainPresetNet - a novel framework that combines structural preservation with dataset-level color mapping while maintaining computational efficiency. Our method implements pixel-wise normalization guided by preset reference images, enabling multi-directional adaptability without retraining. Evaluations on cytopathology and histopathology datasets demonstrate that StainPresetNet achieves superior color mapping accuracy compared to conventional methods, effectively improves classifier generalization in diagnostic tasks, and reduces computational overhead by 90\\% versus existing deep learning approaches. The proposed preset-guided mechanism facilitates flexible adjustment of normalization directions through simple reference image replacement, overcoming the directional rigidity of current deep-learning-based solutions.", "arxiv_id": "2609.01146", "arxiv_url": "https://arxiv.org/abs/2609.01146", "authors": ["Hongtao Kang", "Die Luo", "Li Chen", "Jing Cai", "Junbo Hu", "Xiuli Liu", "Shenghua Cheng"], "brief": "\u8bba\u6587\u63d0\u51fa StainPresetNet\uff0c\u7528\u9884\u8bbe\u53c2\u8003\u56fe\u50cf\u5f15\u5bfc\u50cf\u7d20\u7ea7\u67d3\u8272\u5f52\u4e00\u5316\uff0c\u5728\u4fdd\u6301\u7ec4\u7ec7\u7ed3\u6784\u7684\u540c\u65f6\u5b66\u4e60\u6570\u636e\u96c6\u7ea7\u989c\u8272\u6620\u5c04\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u5207\u6362\u5f52\u4e00\u5316\u65b9\u5411\uff0c\u5728\u7ec6\u80de\u75c5\u7406\u548c\u7ec4\u7ec7\u75c5\u7406\u6570\u636e\u4e0a\u63d0\u5347\u989c\u8272\u6620\u5c04\u7cbe\u5ea6\u4e0e\u8bca\u65ad\u5206\u7c7b\u6cdb\u5316\uff0c\u5e76\u76f8\u6bd4\u73b0\u6709\u6df1\u5ea6\u5b66\u4e60\u65b9\u6cd5\u964d\u4f4e\u7ea690%\u8ba1\u7b97\u5f00\u9500\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01146", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf", "\u67d3\u8272\u5f52\u4e00\u5316", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u75c5\u7406\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01146v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "StainPresetNet: Stain Preset Network for Fast Multi-to-Multi Stain Normalization", "tldr": "\u8bba\u6587\u63d0\u51fa StainPresetNet\uff0c\u7528\u9884\u8bbe\u53c2\u8003\u56fe\u50cf\u5f15\u5bfc\u50cf\u7d20\u7ea7\u67d3\u8272\u5f52\u4e00\u5316\uff0c\u5728\u4fdd\u6301\u7ec4\u7ec7\u7ed3\u6784\u7684\u540c\u65f6\u5b66\u4e60\u6570\u636e\u96c6\u7ea7\u989c\u8272\u6620\u5c04\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u91cd\u8bad\u7ec3\u5373\u53ef\u5207\u6362\u5f52\u4e00\u5316\u65b9\u5411\uff0c\u5728\u7ec6\u80de\u75c5\u7406\u548c\u7ec4\u7ec7\u75c5\u7406\u6570\u636e\u4e0a\u63d0\u5347\u989c\u8272\u6620\u5c04\u7cbe\u5ea6\u4e0e\u8bca\u65ad\u5206\u7c7b\u6cdb\u5316\uff0c\u5e76\u76f8\u6bd4\u73b0\u6709\u6df1\u5ea6\u5b66\u4e60\u65b9\u6cd5\u964d\u4f4e\u7ea690%\u8ba1\u7b97\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Past literature on face recognition for monozygotic ((\"identical\") twins points to facial marks and mirror asymmetry as possible directions for improved accuracy of twins recognition. The Celeb Twins Test Set (CTTS) contains web-scraped image pairs for 80 sets of celebrity twins. It is the only twins test set with meta-data for twins with distinguishing skin marks and possible mirror asymmetry. CTTS is organized in the manner of face verification test sets such as LFW, CALFW, CPLFW, CFP-FP, and AgeDB-30. Current deep CNN matchers can achieve over 76% accuracy in classifying CTTS same-person / different-person image pairs. We show that current matchers do not make use of skin marks, or asymmetry, and discuss reasons for this. Finally, we discuss the feasibility of using generative AI tools such as Grok, ChatGPT and Gemini to create images of imagined monozygotic twins as a means to increase representation of twins in face recognition training sets.", "arxiv_id": "2609.01141", "arxiv_url": "https://arxiv.org/abs/2609.01141", "authors": ["Michael Zang", "Haiyu Wu", "Mrinal Sharma", "Kevin W. Bowyer"], "brief": "\u672c\u6587\u63d0\u51fa Celeb Twins Test Set\uff08CTTS\uff09\uff0c\u5305\u542b80\u7ec4\u540d\u4eba\u540c\u5375\u53cc\u80de\u80ce\u7684\u7f51\u7edc\u56fe\u50cf\u5bf9\u53ca\u76ae\u80a4\u6807\u8bb0\u3001\u955c\u50cf\u4e0d\u5bf9\u79f0\u7b49\u5143\u6570\u636e\uff0c\u7528\u4e8e\u8bc4\u4f30\u4eba\u8138\u9a8c\u8bc1\u6a21\u578b\u5728\u53cc\u80de\u80ce\u573a\u666f\u4e0b\u7684\u8868\u73b0\u3002\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u6df1\u5ea6CNN\u5339\u914d\u5668\u5728\u8be5\u6d4b\u8bd5\u96c6\u4e0a\u53ef\u8fbe76%\u4ee5\u4e0a\u51c6\u786e\u7387\uff0c\u4f46\u57fa\u672c\u672a\u5229\u7528\u76ae\u80a4\u6807\u8bb0\u6216\u9762\u90e8\u4e0d\u5bf9\u79f0\u4fe1\u606f\uff0c\u5e76\u8ba8\u8bba\u4e86\u7528\u751f\u6210\u5f0fAI\u6269\u5145\u53cc\u80de\u80ce\u8bad\u7ec3\u6570\u636e\u7684\u53ef\u884c\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01141", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u8138\u8bc6\u522b", "\u6570\u636e\u96c6", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u751f\u6210\u5f0fAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01141v1", "published_at": "2026-09-01", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Revisiting Face Recognition for Monozygotic Twins: The Celeb Twins Test Set", "tldr": "\u672c\u6587\u63d0\u51fa Celeb Twins Test Set\uff08CTTS\uff09\uff0c\u5305\u542b80\u7ec4\u540d\u4eba\u540c\u5375\u53cc\u80de\u80ce\u7684\u7f51\u7edc\u56fe\u50cf\u5bf9\u53ca\u76ae\u80a4\u6807\u8bb0\u3001\u955c\u50cf\u4e0d\u5bf9\u79f0\u7b49\u5143\u6570\u636e\uff0c\u7528\u4e8e\u8bc4\u4f30\u4eba\u8138\u9a8c\u8bc1\u6a21\u578b\u5728\u53cc\u80de\u80ce\u573a\u666f\u4e0b\u7684\u8868\u73b0\u3002\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u6df1\u5ea6CNN\u5339\u914d\u5668\u5728\u8be5\u6d4b\u8bd5\u96c6\u4e0a\u53ef\u8fbe76%\u4ee5\u4e0a\u51c6\u786e\u7387\uff0c\u4f46\u57fa\u672c\u672a\u5229\u7528\u76ae\u80a4\u6807\u8bb0\u6216\u9762\u90e8\u4e0d\u5bf9\u79f0\u4fe1\u606f\uff0c\u5e76\u8ba8\u8bba\u4e86\u7528\u751f\u6210\u5f0fAI\u6269\u5145\u53cc\u80de\u80ce\u8bad\u7ec3\u6570\u636e\u7684\u53ef\u884c\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Early recognition of lane-change intention is essential for proactive decision-making in autonomous driving and advanced driver assistance systems. This paper proposes a Dual Neural-Calibrated Interacting Multiple Model (DNC-IMM) that improves adaptability to driving context while preserving the probabilistic structure and interpretability of a conventional IMM. The proposed method encodes driving-context information, including target-vehicle motion, gaps to surrounding vehicles, and relative velocities, with a neural network that calibrates both the transition-probability matrix and measurement likelihoods. The final intention is determined from the calibrated IMM mode posterior rather than from a separate direct classifier. Experiments on the highD dataset demonstrate that the proposed method reliably recognizes lane-change intentions before lane crossing and provides particularly strong performance at the earlier 2-3 s prediction horizons.", "arxiv_i
