\u6784\u3002", "\u5c06\u6027\u80fd\u3001\u6210\u672c\u3001\u6548\u7387\u7eb3\u5165\u591a\u76ee\u6807\u4f18\u5316\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u90e8\u7f72\u7ea6\u675f\u3002", "\u5728\u63a8\u7406\u3001\u4ee3\u7801\u3001\u6570\u5b66\u3001\u533b\u5b66\u3001\u91d1\u878d\u7b49\u4e94\u4e2a\u9886\u57df\u516b\u4e2a\u57fa\u51c6\u4e0a\u5e73\u5747\u63d0\u5347 9.1%\uff0cMedQA \u63d0\u5347 19.6%\uff0cFinEval \u63d0\u5347 18.7%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u5316\u4f18\u5316", "\u5de5\u4f5c\u6d41", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01045v1", "published_at": "2026-09-01", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgentFactory: Towards Automated Agentic System Design and Optimization", "tldr": "\u81ea\u52a8\u8054\u5408\u4f18\u5316\u667a\u80fd\u4f53\u6a21\u578b\u4e0e\u5de5\u4f5c\u6d41", "upvotes": 0, "what_it_is": "AgentFactory \u662f\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u81ea\u52a8\u5316\u8bbe\u8ba1\u4e0e\u4f18\u5316\u6846\u67b6\uff0c\u540c\u65f6\u641c\u7d22\u57fa\u7840\u6a21\u578b\u9009\u62e9/\u5fae\u8c03\u65b9\u6848\u4e0e\u5de5\u4f5c\u6d41\u7ed3\u6784\u3002\u5b83\u7528\u5f3a LLM \u4f5c\u4e3a\u4f18\u5316\u5668\uff0c\u5728\u6027\u80fd\u3001\u6210\u672c\u3001\u6548\u7387\u7b49\u591a\u76ee\u6807\u7ea6\u675f\u4e0b\u81ea\u52a8\u53d1\u73b0\u4efb\u52a1\u9002\u914d\u7684\u667a\u80fd\u4f53\u914d\u7f6e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u7cfb\u7edf\u8bbe\u8ba1\u4ece\u4eba\u5de5\u7ecf\u9a8c\u9a71\u52a8\u63a8\u8fdb\u5230\u81ea\u52a8\u5316\u641c\u7d22\u4e0e\u591a\u76ee\u6807\u4f18\u5316\uff0c\u7f13\u89e3\u4e86\u624b\u5de5\u642d\u5efa agentic workflow \u96be\u6269\u5c55\u3001\u96be\u9002\u914d\u7684\u95ee\u9898\uff0c\u5bf9\u4f01\u4e1a\u7ea7\u667a\u80fd\u4f53\u90e8\u7f72\u548c\u9886\u57df\u4e13\u7528\u667a\u80fd\u4f53\u6784\u5efa\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recursive LLM agents can broaden their search by spawning specialists. Some branches later request tools that send data or deploy code. When should a branch receive authority to act? We distinguish sandbox spawning, in which external controls prevent the specified harm, from capability activation, in which a selected branch crosses an irreversible-action boundary. Progressive Risk Vesting (PRV) holds a trajectory-level risk budget in escrow and debits it as branches are activated. We prove an anytime harm bound for adaptively generated trees. Branch outcomes may be dependent, but each local certificate needs to remain valid conditional on the full pre-activation history, including the information used to select the request. When activation gates, branch charges, and compute constraints are held fixed, delayed vesting preserves every policy available under irrevocable spawn charging. Marginal risk estimates can still fail after branch selection. In a stylized branching model, trajectory harm changes as the authority reproduction number $\\mathcal{R}_A$ crosses one. As local risk $p$ approaches zero, trajectory harm is proportional to $p$ below criticality, proportional to $\\sqrt{p}$ at criticality, and retains a positive floor above it. A finite-type occupancy model yields risk and compute shadow prices. For nested fanout modes with decreasing marginal value per unit risk, these prices produce a threshold rule. Branching calculations and a split-sample experiment illustrate the results. These synthetic studies do not estimate safety in deployed agents. The analysis suggests a design rule: search broadly in the sandbox and grant recursive authority sparingly, with an explicit risk charge.", "arxiv_id": "2609.01035", "arxiv_url": "https://arxiv.org/abs/2609.01035", "authors": ["Molly Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Progressive Risk Vesting\uff08PRV\uff09\u6846\u67b6\uff1a\u5141\u8bb8LLM\u667a\u80fd\u4f53\u5728\u6c99\u7bb1\u4e2d\u81ea\u7531\u751f\u6210\u5206\u652f\uff0c\u4f46\u53ea\u6709\u5728\u5206\u652f\u8bf7\u6c42\u4e0d\u53ef\u9006\u5de5\u5177\u884c\u52a8\u65f6\u624d\u6d88\u8017\u8f68\u8ff9\u7ea7\u98ce\u9669\u9884\u7b97\u5e76\u6388\u4e88\u6743\u9650\u3002\u4f5c\u8005\u7ed9\u51fa\u81ea\u9002\u5e94\u9012\u5f52\u6811\u7684 anytime \u5371\u5bb3\u4e0a\u754c\uff0c\u5e76\u5206\u6790\u6388\u6743\u6269\u6563\u7684\u76f8\u53d8\u884c\u4e3a\u3002", "categories": ["cs.AI", "cs.LG", "math.PR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01035", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u533a\u5206\u201c\u6c99\u7bb1\u751f\u6210\u201d\u548c\u201c\u80fd\u529b\u6fc0\u6d3b\u201d\uff0c\u5c06\u98ce\u9669\u9884\u7b97\u5ef6\u8fdf\u5230\u771f\u5b9e\u5916\u90e8\u884c\u52a8\u524d\u6263\u51cf\uff0c\u800c\u975e\u5728\u751f\u6210\u5206\u652f\u65f6\u4e00\u6b21\u6027\u6536\u8d39", "\u8bc1\u660e\u5728\u6761\u4ef6\u6709\u6548\u7684\u5c40\u90e8\u98ce\u9669\u8bc1\u4e66\u4e0b\uff0c\u5373\u4f7f\u5206\u652f\u7ed3\u679c\u76f8\u5173\uff0c\u4e5f\u80fd\u7ef4\u6301\u8f68\u8ff9\u7ea7\u5371\u5bb3\u4e0a\u754c", "\u63d0\u51fa authority reproduction number \u6982\u5ff5\uff1a\u4f4e\u4e8e\u4e34\u754c\u503c\u65f6\u5371\u5bb3\u968f\u5c40\u90e8\u98ce\u9669\u7ebf\u6027\u4e0b\u964d\uff0c\u4e34\u754c\u65f6\u5448\u5e73\u65b9\u6839\u4e0b\u964d\uff0c\u9ad8\u4e8e\u4e34\u754c\u503c\u5219\u5b58\u5728\u6b63\u98ce\u9669\u4e0b\u9650"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u98ce\u9669\u63a7\u5236", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01035v1", "published_at": "2026-09-01", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Spawn Freely, Act Sparingly: Progressive Risk Vesting for Recursive LLM-Agent Trees", "tldr": "\u4e3a\u9012\u5f52LLM\u667a\u80fd\u4f53\u63d0\u51fa\u6e10\u8fdb\u5f0f\u98ce\u9669\u6388\u6743", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Progressive Risk Vesting\uff08PRV\uff09\u6846\u67b6\uff1a\u5141\u8bb8LLM\u667a\u80fd\u4f53\u5728\u6c99\u7bb1\u4e2d\u81ea\u7531\u751f\u6210\u5206\u652f\uff0c\u4f46\u53ea\u6709\u5728\u5206\u652f\u8bf7\u6c42\u4e0d\u53ef\u9006\u5de5\u5177\u884c\u52a8\u65f6\u624d\u6d88\u8017\u8f68\u8ff9\u7ea7\u98ce\u9669\u9884\u7b97\u5e76\u6388\u4e88\u6743\u9650\u3002\u4f5c\u8005\u7ed9\u51fa\u81ea\u9002\u5e94\u9012\u5f52\u6811\u7684 anytime \u5371\u5bb3\u4e0a\u754c\uff0c\u5e76\u5206\u6790\u6388\u6743\u6269\u6563\u7684\u76f8\u53d8\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u53ef\u9012\u5f52\u6269\u5c55\u7684LLM\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u5f62\u5f0f\u5316\u98ce\u9669\u63a7\u5236\u601d\u8def\uff0c\u5f3a\u8c03\u201c\u5e7f\u6cdb\u641c\u7d22\u3001\u8c28\u614e\u6388\u6743\u201d\uff0c\u5bf9\u5de5\u5177\u8c03\u7528\u3001\u4ee3\u7801\u90e8\u7f72\u3001\u6570\u636e\u5916\u53d1\u7b49\u9ad8\u98ce\u9669\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u6743\u9650\u6cbb\u7406\u5177\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Long-horizon tool-use agents need not only to search and plan, but also to decide when to finalize. We study late-stage pressure states, in which an agent is biased toward submitting a final answer that appears complete and polished while key constraints remain unresolved. We first train a linear probe to show that this pressure state is identifiable from the agent\u0027s hidden states. Then, we use activation interventions along this pressure direction and find that shifting the hidden states changes both the pressure score and whether the agent continues tool use or submits early. Through controlled context manipulations, we further see that the pressure is mitigated by constraint clarity and action mapping. Based on these findings, we propose Probe-Sensed Pressure Relief (PSPR), a plugin that applies lightweight pressure relief direction under moderate pressure and moves to structured organization under high pressure risk. Experiments on multiple long-horizon benchmarks show that our method consistently strengthens existing agent methods.", "arxiv_id": "2609.00823", "arxiv_url": "https://arxiv.org/abs/2609.00823", "authors": ["Haoyang Chen", "Yi Liu", "Jianzhi Shao", "Xiaozhou Xu", "Zhe Sun", "Wei Hu"], "brief": "\u8bba\u6587\u7814\u7a76\u957f\u7a0b\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u5728\u4efb\u52a1\u540e\u671f\u51fa\u73b0\u7684\u201c\u770b\u4f3c\u5b8c\u6210\u4f46\u7ea6\u675f\u672a\u89e3\u201d\u7684\u63d0\u4ea4\u538b\u529b\u72b6\u6001\u3002\u4f5c\u8005\u7528\u7ebf\u6027\u63a2\u9488\u4ece\u9690\u85cf\u72b6\u6001\u4e2d\u8bc6\u522b\u8be5\u72b6\u6001\uff0c\u5e76\u63d0\u51fa PSPR \u63d2\u4ef6\u6765\u52a8\u6001\u7f13\u89e3\u65e9\u63d0\u4ea4\u503e\u5411\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00823", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bad\u7ec3\u7ebf\u6027\u63a2\u9488\u8bc1\u660e\u201c\u540e\u671f\u538b\u529b\u72b6\u6001\u201d\u53ef\u4ece\u667a\u80fd\u4f53\u9690\u85cf\u8868\u5f81\u4e2d\u88ab\u68c0\u6d4b\u51fa\u6765", "\u901a\u8fc7\u6fc0\u6d3b\u5e72\u9884\u53d1\u73b0\u6cbf\u538b\u529b\u65b9\u5411\u79fb\u52a8\u4f1a\u6539\u53d8\u538b\u529b\u5206\u6570\uff0c\u5e76\u5f71\u54cd\u667a\u80fd\u4f53\u7ee7\u7eed\u7528\u5de5\u5177\u8fd8\u662f\u63d0\u524d\u63d0\u4ea4", "\u63d0\u51fa Probe-Sensed Pressure Relief\uff1a\u4e2d\u7b49\u538b\u529b\u65f6\u505a\u8f7b\u91cf\u65b9\u5411\u5e72\u9884\uff0c\u9ad8\u98ce\u9669\u65f6\u8f6c\u5411\u7ed3\u6784\u5316\u6574\u7406\uff0c\u5728\u591a\u4e2a\u957f\u7a0b\u57fa\u51c6\u4e0a\u63d0\u5347\u73b0\u6709\u667a\u80fd\u4f53\u65b9\u6cd5"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u53ef\u89e3\u91ca\u6027", "\u6fc0\u6d3b\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00823v1", "published_at": "2026-09-01", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Polished but Unresolved: Identifying Late-Stage Pressure States in Long-Horizon Tool-Use Agents", "tldr": "\u8bc6\u522b\u5e76\u7f13\u89e3\u5de5\u5177\u667a\u80fd\u4f53\u65e9\u4ea4\u4ed8\u538b\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u957f\u7a0b\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u5728\u4efb\u52a1\u540e\u671f\u51fa\u73b0\u7684\u201c\u770b\u4f3c\u5b8c\u6210\u4f46\u7ea6\u675f\u672a\u89e3\u201d\u7684\u63d0\u4ea4\u538b\u529b\u72b6\u6001\u3002\u4f5c\u8005\u7528\u7ebf\u6027\u63a2\u9488\u4ece\u9690\u85cf\u72b6\u6001\u4e2d\u8bc6\u522b\u8be5\u72b6\u6001\uff0c\u5e76\u63d0\u51fa PSPR \u63d2\u4ef6\u6765\u52a8\u6001\u7f13\u89e3\u65e9\u63d0\u4ea4\u503e\u5411\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u7a0b\u667a\u80fd\u4f53\u5e38\u89c1\u7684\u201c\u7b54\u6848\u5df2\u6da6\u8272\u4f46\u95ee\u9898\u672a\u89e3\u51b3\u201d\u65e9\u4ea4\u4ed8\u73b0\u8c61\u8868\u5f81\u5316\u3001\u53ef\u68c0\u6d4b\u5316\uff0c\u5e76\u7ed9\u51fa\u8f7b\u91cf\u63d2\u4ef6\u5f0f\u7f13\u89e3\u65b9\u6848\uff0c\u5bf9\u63d0\u5347\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u53ef\u9760\u6027\u548c\u4efb\u52a1\u5b8c\u6210\u5ea6\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Commercial short-drama production follows a multi-stage chain: script, storyboard, keyframe imagery, shot-level video, and the finished short drama. Most existing benchmarks evaluate solely the video-generation stage using pre-authored inputs instead of real upstream pipeline outputs. This leaves two critical questions unanswerable: whether each stage adheres to the original script intent (rather than only its immediate input prompt), and whether disparate shots remain coherent after assembly into multi-episode releases. We present DramaChain Bench, the first short-drama benchmark that evaluates every stage of the complete production chain. It is built upon three in-house systems sharing one dimension system, DramaChain Dimensions: five evaluation axes instantiated at every stage, resolving into 63 leaf dimensions. DramaChain Agent is calibrated against commercial short-drama platforms in both workflow and finished short-drama quality, enabling stage-wise fair comparison across models. DramaChain Labeling System has each of the 5,785 items scored independently by three professional annotators, with all defects spatio-temporally localised and selected from a predefined defect list. This process produces 17,488 valid scores and 255,925 traceable attribution records. The human annotations confirm that upstream defects cascade across the pipeline, demonstrating that final episode quality is not governed by video generation alone. DramaChain Agentic Judge then scores every leaf dimension automatically, gathering evidence over multiple agentic rounds before judging against a per-item checklist; it reproduces the model ranking at a mean PLCC of 0.918, enough to admit new models at no annotation cost.", "arxiv_id": "2609.00646", "arxiv_url": "https://arxiv.org/abs/2609.00646", "authors": ["Haoyuan Shi", "Mingtao Chen", "Shuo Jiang", "Ziyan Chen", "Xuyi Sheng", "Yiming Liu", "Ying Zhang", "Miao Wang", "Jianxiang Lu", "Fanyang Lu", "Songyuanyi Lu", "Xiele Wu", "Zhichao Hu", "Yuhong Liu", "Richeng Xuan"], "brief": "\u8bba\u6587\u63d0\u51fa DramaChain Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u4ece\u5267\u672c\u3001\u5206\u955c\u3001\u5173\u952e\u5e27\u3001\u955c\u5934\u7ea7\u89c6\u9891\u5230\u6210\u7247\u77ed\u5267\u7684\u5b8c\u6574\u751f\u4ea7\u94fe\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u7ef4\u5ea6\u4f53\u7cfb\u3001\u4e13\u4e1a\u4eba\u5de5\u6807\u6ce8\u548c\u81ea\u52a8\u5316 Agentic Judge\uff0c\u8861\u91cf\u5404\u9636\u6bb5\u662f\u5426\u5fe0\u5b9e\u539f\u59cb\u5267\u672c\u5e76\u4fdd\u6301\u8de8\u955c\u5934\u8fde\u8d2f\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00646", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6784\u5efa DramaChain Dimensions\uff1a\u8986\u76d65\u4e2a\u8bc4\u4f30\u8f74\uff0c\u5e76\u7ec6\u5316\u4e3a63\u4e2a\u53f6\u5b50\u7ef4\u5ea6\uff0c\u8d2f\u7a7f\u77ed\u5267\u751f\u4ea7\u5168\u6d41\u7a0b\u3002", "DramaChain Labeling System \u5bf95,785\u4e2a\u9879\u76ee\u8fdb\u884c\u4e09\u540d\u4e13\u4e1a\u6807\u6ce8\u5458\u72ec\u7acb\u8bc4\u5206\uff0c\u5f97\u523017,488\u4e2a\u6709\u6548\u5206\u6570\u548c255,925\u6761\u53ef\u8ffd\u6eaf\u7f3a\u9677\u5f52\u56e0\u8bb0\u5f55\u3002", "DramaChain Agentic Judge \u901a\u8fc7\u591a\u8f6e\u8bc1\u636e\u6536\u96c6\u548c\u9010\u9879\u6e05\u5355\u5224\u65ad\u81ea\u52a8\u8bc4\u5206\uff0c\u6a21\u578b\u6392\u5e8f\u4e0e\u4eba\u5de5\u6807\u6ce8\u7684\u5e73\u5747PLCC\u8fbe0.918\u3002"], "keywords": ["\u591a\u6a21\u6001\u751f\u6210", "\u89c6\u9891\u751f\u6210", "\u8bc4\u6d4b\u57fa\u51c6", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00646v1", "published_at": "2026-09-01", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DramaChain Bench: An End-to-End Benchmark for Short-Drama Generation", "tldr": "\u9996\u4e2a\u7aef\u5230\u7aef\u77ed\u5267\u751f\u6210\u5168\u94fe\u8def\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DramaChain Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u4ece\u5267\u672c\u3001\u5206\u955c\u3001\u5173\u952e\u5e27\u3001\u955c\u5934\u7ea7\u89c6\u9891\u5230\u6210\u7247\u77ed\u5267\u7684\u5b8c\u6574\u751f\u4ea7\u94fe\u3002\u5b83\u901a\u8fc7\u7edf\u4e00\u7ef4\u5ea6\u4f53\u7cfb\u3001\u4e13\u4e1a\u4eba\u5de5\u6807\u6ce8\u548c\u81ea\u52a8\u5316 Agentic Judge\uff0c\u8861\u91cf\u5404\u9636\u6bb5\u662f\u5426\u5fe0\u5b9e\u539f\u59cb\u5267\u672c\u5e76\u4fdd\u6301\u8de8\u955c\u5934\u8fde\u8d2f\u6027\u3002", "why_notable": "\u73b0\u6709\u57fa\u51c6\u591a\u53ea\u8bc4\u6d4b\u89c6\u9891\u751f\u6210\u5355\u9636\u6bb5\uff0c\u800c\u8be5\u5de5\u4f5c\u9996\u6b21\u7cfb\u7edf\u8bc4\u4f30\u77ed\u5267\u5de5\u4e1a\u5316\u751f\u6210\u7684\u5168\u94fe\u8def\u8d28\u91cf\uff0c\u5e76\u63ed\u793a\u4e0a\u6e38\u7f3a\u9677\u4f1a\u7ea7\u8054\u5f71\u54cd\u6700\u7ec8\u6210\u7247\uff1b\u5176\u81ea\u52a8\u8bc4\u6d4b\u5668\u4e5f\u964d\u4f4e\u4e86\u65b0\u6a21\u578b\u63a5\u5165\u8bc4\u4f30\u7684\u6807\u6ce8\u6210\u672c\u3002"}, {"abstract": "Embodied navigation requires agents to translate heterogeneous goals and visual observations into actions across tasks, environments, and robot embodiments. Modern vision-language models (VLMs) already encode spatial priors for visual grounding, spatial reasoning, and pointing, but these capabilities are rarely elicited directly for robot control. Existing navigation systems instead rely on task- or embodiment-specific components, fragmenting perception, reasoning, and action while offering limited generalization. Here we present LightNav-0, a compact generalist embodied navigation model that elicits the spatial intelligence of a pretrained VLM and aligns it with navigation, without task-specific prediction heads. LightNav-0 represents diverse navigation tasks through a unified token interface: dual-channel pointing expresses task-, scene-, and embodiment-agnostic spatial intent, while a residual vector-quantized action tokenizer maps this intent to precise, embodiment-specific trajectories. Together with temporally aware visual history compression, ER mid-training, supervised fine-tuning, and reinforcement learning, this formulation supports instruction following, open-vocabulary object navigation, and visual tracking within a single model. The navigation training corpus spans 2K+ scenes and 4K+ hours of embodied navigation data. LightNav-ER, the embodied-reasoning checkpoint used to initialize LightNav-0, attains the highest complete-set average across 8 embodied-reasoning benchmarks, while LightNav-0 achieves state-of-the-art monocular success rates across all 10 public navigation simulation settings. Real-world evaluations further demonstrate zero-shot generalization across robot embodiments, diverse scenes, and static and dynamic targets. These results establish compact VLMs as a unified and transferable backbone for generalist embodied navigation.", "arxiv_id": "2608.30935", "arxiv_url": "https://arxiv.org/abs/2608.30935", "authors": ["Shaoan Wang", "Aocheng Luo", "Fei Huang", "Jingyi Xu", "Xiaoyang Wang", "Yueyu Wang", "Qianli Ma", "Fan Yang", "Ran Mei", "Jia Wei", "Jiangpeng Hu", "Xuhao Liu", "Hongming Chen", "Yuanbin Shao", "Yiyang Lin", "Ziliang Li", "Liang Pan", "Xinhang Liu", "Yuntao Ma", "Tingxiang Fan"], "brief": "\u8bba\u6587\u63d0\u51fa LightNav-0\uff0c\u4e00\u4e2a\u7d27\u51d1\u7684\u901a\u7528\u5177\u8eab\u5bfc\u822a\u6a21\u578b\uff0c\u76f4\u63a5\u6fc0\u53d1\u9884\u8bad\u7ec3 VLM \u7684\u7a7a\u95f4\u667a\u80fd\u5e76\u5bf9\u9f50\u5230\u673a\u5668\u4eba\u5bfc\u822a\u63a7\u5236\u3002\u5b83\u7528\u7edf\u4e00 token \u63a5\u53e3\u8986\u76d6\u6307\u4ee4\u8ddf\u968f\u3001\u5f00\u653e\u8bcd\u6c47\u76ee\u6807\u5bfc\u822a\u548c\u89c6\u89c9\u8ddf\u8e2a\uff0c\u65e0\u9700\u4efb\u52a1\u4e13\u7528\u9884\u6d4b\u5934\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/lightorigins/LightNav-0", "github_stars": 253, "hf_url": "https://huggingface.co/papers/2608.30935", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u53cc\u901a\u9053 pointing \u8868\u8fbe\u4e0e\u4efb\u52a1\u3001\u573a\u666f\u548c\u673a\u5668\u4eba\u5f62\u6001\u65e0\u5173\u7684\u7a7a\u95f4\u610f\u56fe\uff0c\u518d\u7528\u6b8b\u5dee\u5411\u91cf\u91cf\u5316\u52a8\u4f5c tokenizer \u8f6c\u6362\u4e3a\u5177\u4f53\u8f68\u8ff9\u3002", "\u7ed3\u5408\u65f6\u95f4\u611f\u77e5\u89c6\u89c9\u5386\u53f2\u538b\u7f29\u3001\u5177\u8eab\u63a8\u7406\u4e2d\u8bad\u7ec3\u3001\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u8bad\u7ec3\u8bed\u6599\u8986\u76d6 2000+ \u573a\u666f\u548c 4000+ \u5c0f\u65f6\u5bfc\u822a\u6570\u636e\u3002", "LightNav-ER \u5728 8 \u4e2a\u5177\u8eab\u63a8\u7406\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u9ad8\u5b8c\u6574\u96c6\u5e73\u5747\u5206\uff1bLightNav-0 \u5728 10 \u4e2a\u516c\u5f00\u5355\u76ee\u5bfc\u822a\u4eff\u771f\u8bbe\u7f6e\u4e2d\u8fbe\u5230 SOTA\uff0c\u5e76\u5c55\u793a\u771f\u5b9e\u673a\u5668\u4eba\u96f6\u6837\u672c\u6cdb\u5316\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba\u5bfc\u822a", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Light Origins", "pdf_url": "https://arxiv.org/pdf/2608.30935v1", "published_at": "2026-08-31", "score": 0.339, "selected_reasons": ["HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30935.png", "title": "LightNav-0: Eliciting VLM Spatial Intelligence for Generalist Embodied Navigation", "tldr": "\u7528VLM\u7a7a\u95f4\u5148\u9a8c\u7edf\u4e00\u5177\u8eab\u5bfc\u822a\u63a7\u5236", "upvotes": 24, "what_it_is": "\u8bba\u6587\u63d0\u51fa LightNav-0\uff0c\u4e00\u4e2a\u7d27\u51d1\u7684\u901a\u7528\u5177\u8eab\u5bfc\u822a\u6a21\u578b\uff0c\u76f4\u63a5\u6fc0\u53d1\u9884\u8bad\u7ec3 VLM \u7684\u7a7a\u95f4\u667a\u80fd\u5e76\u5bf9\u9f50\u5230\u673a\u5668\u4eba\u5bfc\u822a\u63a7\u5236\u3002\u5b83\u7528\u7edf\u4e00 token \u63a5\u53e3\u8986\u76d6\u6307\u4ee4\u8ddf\u968f\u3001\u5f00\u653e\u8bcd\u6c47\u76ee\u6807\u5bfc\u822a\u548c\u89c6\u89c9\u8ddf\u8e2a\uff0c\u65e0\u9700\u4efb\u52a1\u4e13\u7528\u9884\u6d4b\u5934\u3002", "why_notable": "\u5b83\u5c06 VLM \u7684\u7a7a\u95f4\u5148\u9a8c\u76f4\u63a5\u7528\u4e8e\u7aef\u5230\u7aef\u5bfc\u822a\u51b3\u7b56\uff0c\u51cf\u5c11\u4efb\u52a1\u548c\u673a\u5668\u4eba\u5f62\u6001\u4e13\u7528\u6a21\u5757\uff0c\u5c55\u793a\u4e86\u7d27\u51d1 VLM \u4f5c\u4e3a\u901a\u7528\u5177\u8eab\u5bfc\u822a\u9aa8\u5e72\u7684\u53ef\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "We describe the architecture and ablations of Qwen3.8-Flash-Next, a sparse mixture-of-experts model with 125B parameters, 6B activated per token, and additional 51B parameters of n-gram embedding tables held off the accelerator. On fourteen pre-training benchmarks the model leads the 397B-A17B predecessor on eight and trails it on the rest by at most 2.6 points, at 1/3 the activated parameters, 1/3 the training tokens, and roughly 1/9 the training FLOPs. Token mixing uses a layer-wise hybrid of Gated DeltaNet (GDN) and global attention, with one full-attention layer in every four; at continued-pretraining time those full-attention layers are replaced by Qwen Sparse Attention (QSA), which scores context at micro-block granularity with a compressed lightweight indexer. The residual stream is widened to four branches and read through an elementwise gate, a design we call the Gated Residual (GR). Capacity is added outside the backbone by a single n-gram embedding layer whose tables are prefetched from host memory. We evaluate every candidate change along three axes: loss together with downstream benchmarks; the cost of the change in training, prefill and decode; and its effect on the optimal hyperparameters and training stability. Loss and downstream accuracy do not always move together: enlarging the n-gram vocabulary lowers loss monotonically while downstream accuracy saturates. The architecture and the Muon optimizer together shift the optimal learning rate and batch size upwards, render batch-size warmup unnecessary, and substantially improve stability under stress tests. Loss, benchmarks, efficiency and stability form one design problem. Solved jointly, they yield a recipe that is simultaneously more efficient, more capable and more stable.", "arxiv_id": "2608.30320", "arxiv_url": "https://arxiv.org/abs/2608.30320", "authors": ["Zihan Qiu", "Zekun Wang", "Xiao Li", "Yanpeng Li", "Yang Xu", "Yixuan Wang", "Huaqing Zhang", "Rui Men", "Bochao Mao", "Chengruidong Zhang", "Fan Zhou", "Hao Luo", "Haofeng Huang", "Haoran Lian", "Haoyan Huang", "Hongqing Chen", "Jianwei Zhang", "Jing Xu", "Junjie Wang", "Langshi Chen", "Liangyu Wang", "Linlang Jiang", "Man Yuan", "Minmin Sun", "Peng Jin", "Siqi Zhang", "Siyu Wang", "Xingzhang Ren", "Yakai Wang", "Yi Zhang", "Yiming Dong", "Yizhong Cao", "Yubo Ma", "Yunfei Mao", "Bo Zheng", "Dayiheng Liu"], "brief": "\u672c\u6587\u4ecb\u7ecd Qwen3.8-Flash-Next \u67b6\u6784\uff1a125B \u7a00\u758f MoE\u3001\u6bcf token \u6fc0\u6d3b 6B\uff0c\u5e76\u7ed3\u5408 Gated DeltaNet/\u5168\u5c40\u6ce8\u610f\u529b\u6df7\u5408\u3001Qwen Sparse Attention\u3001\u95e8\u63a7\u6b8b\u5dee\u548c\u5916\u7f6e n-gram \u5d4c\u5165\u3002\u76f8\u6bd4 397B-A17B \u524d\u4ee3\uff0c\u5b83\u5728 14 \u4e2a\u9884\u8bad\u7ec3\u57fa\u51c6\u4e2d 8 \u9879\u9886\u5148\uff0c\u540c\u65f6\u4ec5\u7528\u7ea6 1/3 \u6fc0\u6d3b\u53c2\u6570\u30011/3 \u8bad\u7ec3 token \u548c\u7ea6 1/9 \u8bad\u7ec3 FLOPs\uff0c\u5e76\u901a\u8fc7 Muon \u4f18\u5316\u5668\u63d0\u5347\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30320", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u6ce8\u610f\u529b\u673a\u5236", "\u8bad\u7ec3\u6548\u7387"], "num_comments": 1, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2608.30320v1", "published_at": "2026-08-31", "score": 0.334, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (34\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30320.png", "title": "On the Design of Qwen3.8-Next Architecture: Evaluation, Efficiency, and Training Stability", "tldr": "\u672c\u6587\u4ecb\u7ecd Qwen3.8-Flash-Next \u67b6\u6784\uff1a125B \u7a00\u758f MoE\u3001\u6bcf token \u6fc0\u6d3b 6B\uff0c\u5e76\u7ed3\u5408 Gated DeltaNet/\u5168\u5c40\u6ce8\u610f\u529b\u6df7\u5408\u3001Qwen Sparse Attention\u3001\u95e8\u63a7\u6b8b\u5dee\u548c\u5916\u7f6e n-gram \u5d4c\u5165\u3002\u76f8\u6bd4 397B-A17B \u524d\u4ee3\uff0c\u5b83\u5728 14 \u4e2a\u9884\u8bad\u7ec3\u57fa\u51c6\u4e2d 8 \u9879\u9886\u5148\uff0c\u540c\u65f6\u4ec5\u7528\u7ea6 1/3 \u6fc0\u6d3b\u53c2\u6570\u30011/3 \u8bad\u7ec3 token \u548c\u7ea6 1/9 \u8bad\u7ec3 FLOPs\uff0c\u5e76\u901a\u8fc7 Muon \u4f18\u5316\u5668\u63d0\u5347\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "upvotes": 34, "what_it_is": null, "why_notable": null}, {"abstract": "Research planning is the decisive capability of AI scientists. Yet a research plan admits no verifiable answer, so reinforcement learning lacks the environment it requires: tasks paired with a critic. Rubrics extracted from scientific papers can supply the critic. Existing pipelines, however, draw the question and the criteria from the same content, so the reward can be earned by paraphrase. The rubric is further compressed into a single scalar per rollout. We introduce PaperGym, a unified framework that turns each research paper into a complete training environment. PaperGym exploits the structure of a paper: the question is synthesized from the research goal and background, while the criteria are derived from the method and experiments. The criteria span methodological innovation and experimental design, and criterion leakage falls to 3.7%, versus 11.90% to 34.10% in existing datasets. Training uses the rubric twice: first as privileged context for OPSD\u0027s self-teacher, then as the reward for GRPO. Across Qwen3-1.7B/4B/8B, this schedule outperforms supervised fine-tuning, either stage alone, and the reverse ordering, improving five-benchmark averages by +5.6, +5.0, and +4.8 points. With the recipe held fixed, models trained on PaperGym-20k win 58.1% of three-way comparisons, against 28.2% for RubricHub Science. The trained Qwen3-8B reaches 73.48 on ResearchQA, above the far larger Kimi K2.6. We release the pipeline, the 20,000-instance corpus PaperGym-20k, and the benchmarks PaperGym-Innov and PaperGym-Design.", "arxiv_id": "2608.31119", "arxiv_url": "https://arxiv.org/abs/2608.31119", "authors": ["Yuhan Wang", "Zhengxi Lu", "Yuchen Yan", "Kaitao Song", "Wenqi Zhang", "Weiming Lu", "Jun Xiao", "Yueting Zhuang", "Yongliang Shen"], "brief": "PaperGym \u5c06\u6bcf\u7bc7\u79d1\u7814\u8bba\u6587\u8f6c\u5316\u4e3a\u7814\u7a76\u8ba1\u5212\u751f\u6210\u7684\u8bad\u7ec3\u73af\u5883\uff1a\u4ece\u7814\u7a76\u76ee\u6807\u4e0e\u80cc\u666f\u5408\u6210\u95ee\u9898\uff0c\u4ece\u65b9\u6cd5\u4e0e\u5b9e\u9a8c\u63d0\u53d6\u8bc4\u4ef7\u51c6\u5219\u3002\u5b83\u6784\u5efa\u4e86 PaperGym-20k \u6570\u636e\u96c6\uff0c\u5e76\u7528 rubric \u5148\u4f5c\u4e3a\u81ea\u6559\u5e08\u4e0a\u4e0b\u6587\u3001\u518d\u4f5c\u4e3a GRPO \u5956\u52b1\u6765\u8bad\u7ec3\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/ZJU-REAL/PaperGym", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2608.31119", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5206\u79bb\u95ee\u9898\u6765\u6e90\u4e0e\u8bc4\u4ef7\u51c6\u5219\u6765\u6e90\uff0c\u5c06 criterion leakage \u964d\u81f3 3.7%\uff0c\u4f4e\u4e8e\u73b0\u6709\u6570\u636e\u96c6\u7684 11.90%\u201334.10%", "\u8bad\u7ec3\u6d41\u7a0b\u7ed3\u5408 OPSD \u81ea\u6559\u5e08\u4e0e GRPO\uff0crubric \u5148\u7528\u4e8e\u751f\u6210\u9ad8\u8d28\u91cf\u76d1\u7763\u4fe1\u53f7\uff0c\u518d\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u5956\u52b1", "\u5728 Qwen3-1.7B/4B/8B \u4e0a\u5747\u4f18\u4e8e SFT\u3001\u5355\u9636\u6bb5\u8bad\u7ec3\u548c\u53cd\u5411\u987a\u5e8f\uff0c\u4e94\u9879\u57fa\u51c6\u5e73\u5747\u63d0\u5347\u7ea6 4.8\u20135.6 \u5206"], "keywords": ["\u79d1\u7814\u89c4\u5212", "\u5f3a\u5316\u5b66\u4e60", "\u8bc4\u6d4b\u57fa\u51c6", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.31119v1", "published_at": "2026-08-31", "score": 0.327, "selected_reasons": ["HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31119.png", "title": "PaperGym: Rubric-Centered Evolution for Research-Plan Generation", "tldr": "\u7528\u8bba\u6587rubric\u8bad\u7ec3\u66f4\u5f3a\u79d1\u7814\u8ba1\u5212\u751f\u6210\u6a21\u578b", "upvotes": 35, "what_it_is": "PaperGym \u5c06\u6bcf\u7bc7\u79d1\u7814\u8bba\u6587\u8f6c\u5316\u4e3a\u7814\u7a76\u8ba1\u5212\u751f\u6210\u7684\u8bad\u7ec3\u73af\u5883\uff1a\u4ece\u7814\u7a76\u76ee\u6807\u4e0e\u80cc\u666f\u5408\u6210\u95ee\u9898\uff0c\u4ece\u65b9\u6cd5\u4e0e\u5b9e\u9a8c\u63d0\u53d6\u8bc4\u4ef7\u51c6\u5219\u3002\u5b83\u6784\u5efa\u4e86 PaperGym-20k \u6570\u636e\u96c6\uff0c\u5e76\u7528 rubric \u5148\u4f5c\u4e3a\u81ea\u6559\u5e08\u4e0a\u4e0b\u6587\u3001\u518d\u4f5c\u4e3a GRPO \u5956\u52b1\u6765\u8bad\u7ec3\u6a21\u578b\u3002", "why_notable": "\u5b83\u4e3a\u201c\u65e0\u6807\u51c6\u7b54\u6848\u201d\u7684\u79d1\u7814\u8ba1\u5212\u751f\u6210\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u8bad\u7ec3\u73af\u5883\u548c\u5956\u52b1\u673a\u5236\uff0c\u7f13\u89e3\u4e86\u9760\u590d\u8ff0\u5f97\u5206\u7684\u95ee\u9898\uff0c\u5e76\u53d1\u5e03\u4e86 2 \u4e07\u5b9e\u4f8b\u8bed\u6599\u4e0e\u65b0\u57fa\u51c6\uff0c\u5bf9 AI \u79d1\u5b66\u5bb6\u548c\u79d1\u7814\u8f85\u52a9\u7cfb\u7edf\u8bad\u7ec3\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "AI tutors are most useful when they adapt to each student\u0027s strengths, weaknesses, and preferred guidance, but evidence about which guidance works for which student is sparse, slow, and costly to collect from real learners. Student simulators can provide this signal as a proxy, yet existing approaches are limited: state-tracking models fit student behavior but struggle to process explanations or corrections, while LLM role-play follows guidance fluently but does not reliably match the competence of the student being imitated. We present StudentSim, a training framework that turns sparse per-student data into individualized simulators through pooled training followed by per-student specialization. The resulting simulators both mirror a student\u0027s own responses and update them under tutor guidance. We also introduce StudentSimEval, a standardized protocol covering 60 students across chess, second-language English writing, and mathematics, using public learner datasets with de-identified records shared for research. StudentSimEval measures behavioral fidelity (F), or how well a simulator matches a student\u0027s responses, and guidance responsiveness (R), or how readily it updates under tutor guidance, with all methods fit and evaluated on the same records. Across all three domains, StudentSim outperforms GPT-5.4 on both metrics. In chess, StudentSim reaches F=0.51 and R=0.91, compared with 0.23 and 0.72 for GPT-5.4 and 0.45 and 0.27 for Maia2. As a proof of concept, using StudentSim as a reward model for tutor reinforcement learning produces a chess tutor that expert humans rate as more accurate, better-guided, and more personalized than a no-RL baseline and a tutor trained against a GPT-5.4 simulator reward. Code is available at https://github.com/microsoft/StudentSim.", "arxiv_id": "2609.01591", "arxiv_url": "https://arxiv.org/abs/2609.01591", "authors": ["Ke Yang", "Chenglong Wang", "Michel Galley", "Chandan Singh", "Jeevana Priya Inala", "ChengXiang Zhai", "Jianfeng Gao"], "brief": "\u8bba\u6587\u63d0\u51fa StudentSim\uff0c\u901a\u8fc7\u5148\u8fdb\u884c\u8de8\u5b66\u751f pooled training\u3001\u518d\u505a\u4e2a\u4f53\u5316\u5fae\u8c03\uff0c\u628a\u7a00\u758f\u5b66\u751f\u6570\u636e\u8bad\u7ec3\u6210\u80fd\u6a21\u62df\u7279\u5b9a\u5b66\u751f\u80fd\u529b\u4e0e\u53d7\u8f85\u5bfc\u540e\u53d8\u5316\u7684 LLM \u5b66\u751f\u6a21\u62df\u5668\u3002\u5176\u5728\u68cb\u7c7b\u3001\u82f1\u8bed\u5199\u4f5c\u548c\u6570\u5b66\u7684 StudentSimEval \u4e0a\u540c\u65f6\u63d0\u5347\u884c\u4e3a\u62df\u5408\u5ea6\u548c\u6307\u5bfc\u54cd\u5e94\u6027\uff0c\u5e76\u53ef\u4f5c\u4e3a\u5956\u52b1\u6a21\u578b\u8bad\u7ec3\u51fa\u66f4\u4e2a\u6027\u5316\u7684\u8f85\u5bfc\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/microsoft/StudentSim", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01591", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b66\u751f\u6a21\u62df\u5668", "\u4e2a\u6027\u5316\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2609.01591v1", "published_at": "2026-09-01", "score": 0.327, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (25\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01591.png", "title": "StudentSim: Training LLM-based Student Simulators", "tldr": "\u8bba\u6587\u63d0\u51fa StudentSim\uff0c\u901a\u8fc7\u5148\u8fdb\u884c\u8de8\u5b66\u751f pooled training\u3001\u518d\u505a\u4e2a\u4f53\u5316\u5fae\u8c03\uff0c\u628a\u7a00\u758f\u5b66\u751f\u6570\u636e\u8bad\u7ec3\u6210\u80fd\u6a21\u62df\u7279\u5b9a\u5b66\u751f\u80fd\u529b\u4e0e\u53d7\u8f85\u5bfc\u540e\u53d8\u5316\u7684 LLM \u5b66\u751f\u6a21\u62df\u5668\u3002\u5176\u5728\u68cb\u7c7b\u3001\u82f1\u8bed\u5199\u4f5c\u548c\u6570\u5b66\u7684 StudentSimEval \u4e0a\u540c\u65f6\u63d0\u5347\u884c\u4e3a\u62df\u5408\u5ea6\u548c\u6307\u5bfc\u54cd\u5e94\u6027\uff0c\u5e76\u53ef\u4f5c\u4e3a\u5956\u52b1\u6a21\u578b\u8bad\u7ec3\u51fa\u66f4\u4e2a\u6027\u5316\u7684\u8f85\u5bfc\u6a21\u578b\u3002", "upvotes": 25, "what_it_is": null, "why_notable": null}, {"abstract": "As large language models increasingly act through external tools, deciding when to call a tool has become a central problem alongside deciding how to use it. Unnecessary tool calls introduce latency, cost, retrieval noise, and error propagation, while missed calls hurt knowledge-intensive queries or questions requiring up-to-date evidence. Existing methods typically trigger tools from absolute query or generation signals, such as difficulty, confidence, or final task reward, and therefore lack an explicit estimate of the instance-level marginal benefit of tool use. We propose CoBRA, a counterfactual boundary-learning framework for tool-augmented language models. CoBRA first constructs internal and external experts from the same base model, collects paired trajectories, and estimates the reward margin between answering with and without tools. This margin partitions data into internal-favored, external-favored, and ambiguous cases. CoBRA then uses clear-margin samples for Boundary-Aware Cold-Start SFT, followed by MARS-RL with reference-split rollouts and counterfactual marginal advantages to optimize boundary decisions. Experiments with retrieval as the main tool on Qwen3-4B show that CoBRA improves tool-use efficiency and boundary-sensitive answer accuracy while maintaining strong performance on tool-dependent out-of-distribution questions.", "arxiv_id": "2609.00967", "arxiv_url": "https://arxiv.org/abs/2609.00967", "authors": ["Wenhao Zou", "Xianglong Liu", "Wendong Bi", "Hanjie Wang", "Simin Zhao", "Gong Zhi"], "brief": "CoBRA \u662f\u4e00\u4e2a\u9762\u5411\u5de5\u5177\u589e\u5f3a\u8bed\u8a00\u6a21\u578b\u7684\u8fb9\u754c\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u540c\u4e00\u57fa\u5ea7\u6a21\u578b\u6784\u9020\u5185\u90e8/\u5916\u90e8\u4e13\u5bb6\u5e76\u6536\u96c6\u6210\u5bf9\u8f68\u8ff9\uff0c\u4f30\u8ba1\u201c\u4f7f\u7528\u5de5\u5177 vs \u4e0d\u4f7f\u7528\u5de5\u5177\u201d\u7684\u5b9e\u4f8b\u7ea7\u5956\u52b1\u5dee\u503c\u3002\u5b83\u636e\u6b64\u533a\u5206\u5e94\u5185\u90e8\u56de\u7b54\u3001\u5e94\u8c03\u7528\u5de5\u5177\u4e0e\u6a21\u7cca\u6837\u672c\uff0c\u5e76\u901a\u8fc7\u51b7\u542f\u52a8 SFT \u4e0e MARS-RL \u4f18\u5316\u5de5\u5177\u8c03\u7528\u51b3\u7b56\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00967", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6838\u5fc3\u4fe1\u53f7\u4e0d\u662f\u7edd\u5bf9\u7f6e\u4fe1\u5ea6\u6216\u96be\u5ea6\uff0c\u800c\u662f\u53cd\u4e8b\u5b9e\u5de5\u5177\u4f7f\u7528\u7684\u8fb9\u9645\u6536\u76ca margin", "\u5c06\u6837\u672c\u5212\u5206\u4e3a internal-favored\u3001external-favored\u3001ambiguous\uff0c\u7528\u6e05\u6670\u8fb9\u754c\u6837\u672c\u8fdb\u884c Boundary-Aware Cold-Start SFT", "\u5728 Qwen3-4B \u4e0a\u4ee5\u68c0\u7d22\u5de5\u5177\u5b9e\u9a8c\uff0c\u63d0\u5347\u5de5\u5177\u4f7f\u7528\u6548\u7387\u4e0e\u8fb9\u754c\u654f\u611f\u51c6\u786e\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u5de5\u5177\u4f9d\u8d56\u578b\u5206\u5e03\u5916\u95ee\u9898\u8868\u73b0"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00967v1", "published_at": "2026-09-01", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CoBRA: Learning Tool-Use Boundaries via Counterfactual Margins", "tldr": "\u7528\u53cd\u4e8b\u5b9e\u6536\u76ca\u5b66\u4e60LLM\u4f55\u65f6\u8c03\u7528\u5de5\u5177", "upvotes": 0, "what_it_is": "CoBRA \u662f\u4e00\u4e2a\u9762\u5411\u5de5\u5177\u589e\u5f3a\u8bed\u8a00\u6a21\u578b\u7684\u8fb9\u754c\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u540c\u4e00\u57fa\u5ea7\u6a21\u578b\u6784\u9020\u5185\u90e8/\u5916\u90e8\u4e13\u5bb6\u5e76\u6536\u96c6\u6210\u5bf9\u8f68\u8ff9\uff0c\u4f30\u8ba1\u201c\u4f7f\u7528\u5de5\u5177 vs \u4e0d\u4f7f\u7528\u5de5\u5177\u201d\u7684\u5b9e\u4f8b\u7ea7\u5956\u52b1\u5dee\u503c\u3002\u5b83\u636e\u6b64\u533a\u5206\u5e94\u5185\u90e8\u56de\u7b54\u3001\u5e94\u8c03\u7528\u5de5\u5177\u4e0e\u6a21\u7cca\u6837\u672c\uff0c\u5e76\u901a\u8fc7\u51b7\u542f\u52a8 SFT \u4e0e MARS-RL \u4f18\u5316\u5de5\u5177\u8c03\u7528\u51b3\u7b56\u3002", "why_notable": "\u8bba\u6587\u628a\u201c\u4f55\u65f6\u7528\u5de5\u5177\u201d\u5efa\u6a21\u4e3a\u5b9e\u4f8b\u7ea7\u53cd\u4e8b\u5b9e\u6536\u76ca\u4f30\u8ba1\u95ee\u9898\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u4e0d\u5fc5\u8981\u68c0\u7d22\u5e26\u6765\u7684\u6210\u672c\u3001\u5ef6\u8fdf\u548c\u566a\u58f0\uff0c\u540c\u65f6\u907f\u514d\u6f0f\u8c03\u7528\u5de5\u5177\uff0c\u5bf9\u6784\u5efa\u66f4\u9ad8\u6548\u53ef\u9760\u7684 LLM \u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Vehicle Routing Problems (VRPs) are fundamental combinatorial optimization problems with widespread applications in various scenarios. The advanced optimization solvers can effectively solve such problems. However, modeling complex VRP variants for solvers often requires substantial domain expertise, which limits the accessibility of advanced optimization technologies. In this paper, we propose Reinforcement Learning Enhanced LLMAgents(RLEA), a multi-agent framework designed to automate the modeling of complex VRPs. RLEA introduces a lightweight neural Planner trained with Soft Q-learning to efficiently orchestrate the actions of LLM-based agents. In addition, we equip the system with an evolutionary memory module and retrieval-augmented generation, enabling the agent to leverage both accumulated experience and external solver knowledge during program generation and refinement for solving VRPs. We evaluated 48 distinct VRP variants across various solvers. The experimental results demonstrate that RLEA outperforms the previous state-of-the-ar method, achieving a 16.67% higher success rate while significantly reducing runtime errors. These results validate that integrating reinforcement learning with LLM-based reasoning is highly effective for automated optimization modeling. The appendix is available at: https://doi.org/10.5281/zenodo.19134435.", "arxiv_id": "2609.00859", "arxiv_url": "https://arxiv.org/abs/2609.00859", "authors": ["Yi Chen", "Zikang Yu", "Jiahai Wang", "Jinbiao Chen", "Jianpeng Zhou", "Zizhen Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa RLEA\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742\u8f66\u8f86\u8def\u5f84\u95ee\u9898\uff08VRP\uff09\u81ea\u52a8\u5efa\u6a21\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u7684\u8f7b\u91cf Planner \u6765\u534f\u8c03\u591a\u4e2a LLM \u667a\u80fd\u4f53\uff0c\u5e76\u7ed3\u5408\u8fdb\u5316\u8bb0\u5fc6\u4e0e\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u6765\u751f\u6210\u548c\u4fee\u6b63\u6c42\u89e3\u5668\u7a0b\u5e8f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00859", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4f7f\u7528 Soft Q-learning \u8bad\u7ec3\u795e\u7ecf Planner\uff0c\u52a8\u6001\u7f16\u6392 LLM \u667a\u80fd\u4f53\u7684\u5efa\u6a21\u3001\u751f\u6210\u4e0e\u8c03\u8bd5\u52a8\u4f5c", "\u5f15\u5165\u8fdb\u5316\u8bb0\u5fc6\u6a21\u5757\u548c RAG\uff0c\u4f7f\u7cfb\u7edf\u80fd\u5229\u7528\u5386\u53f2\u7ecf\u9a8c\u4e0e\u5916\u90e8\u6c42\u89e3\u5668\u77e5\u8bc6\u6539\u8fdb\u7a0b\u5e8f\u751f\u6210", "\u5728 48 \u79cd VRP \u53d8\u4f53\u548c\u591a\u7c7b\u6c42\u89e3\u5668\u4e0a\u8bc4\u6d4b\uff0c\u6210\u529f\u7387\u76f8\u6bd4\u6b64\u524d SOTA \u63d0\u5347 16.67%\uff0c\u8fd0\u884c\u65f6\u9519\u8bef\u663e\u8457\u51cf\u5c11"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u7ec4\u5408\u4f18\u5316", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00859v1", "published_at": "2026-09-01", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reinforcement Learning Enhanced LLM Agents for Complex Vehicle Routing Problems", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u8c03\u5ea6LLM\u667a\u80fd\u4f53\u81ea\u52a8\u5efa\u6a21\u590d\u6742VRP", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RLEA\uff0c\u4e00\u4e2a\u9762\u5411\u590d\u6742\u8f66\u8f86\u8def\u5f84\u95ee\u9898\uff08VRP\uff09\u81ea\u52a8\u5efa\u6a21\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u7684\u8f7b\u91cf Planner \u6765\u534f\u8c03\u591a\u4e2a LLM \u667a\u80fd\u4f53\uff0c\u5e76\u7ed3\u5408\u8fdb\u5316\u8bb0\u5fc6\u4e0e\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u6765\u751f\u6210\u548c\u4fee\u6b63\u6c42\u89e3\u5668\u7a0b\u5e8f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u964d\u4f4e\u4e86\u590d\u6742\u4f18\u5316\u95ee\u9898\u5efa\u6a21\u5bf9\u9886\u57df\u4e13\u5bb6\u7684\u4f9d\u8d56\uff0c\u5c55\u793a\u4e86\u5f3a\u5316\u5b66\u4e60\u4e0e LLM \u63a8\u7406\u7ed3\u5408\u5728\u81ea\u52a8\u5316\u8fd0\u7b79\u4f18\u5316\u5efa\u6a21\u4e2d\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Computational materials science has traditionally delegated algorithmic tasks to computers while leaving scientific judgments to humans. We argue that recent LLM-based agent harnesses enable an emerging form of scientific software, agentic programs, that combine deterministic algorithms with bounded LLM-based judgment, task-specific verification, episodic maturation, and complete delegation in production. We illustrate this concept with DeMARS, an agentic program for constructing atomistic models from experimentally measured disordered crystal structures.", "arxiv_id": "2609.00795", "arxiv_url": "https://arxiv.org/abs/2609.00795", "authors": ["Yunsung Lim", "Haekwan Jeon", "Jaesun Kim", "Jisu Kim", "Seungwu Han"], "brief": "\u8bba\u6587\u63d0\u51fa\u201cagentic programs\u201d\u6982\u5ff5\uff1a\u5c06\u786e\u5b9a\u6027\u7b97\u6cd5\u4e0e\u53d7\u7ea6\u675f\u7684 LLM \u5224\u65ad\u3001\u4efb\u52a1\u9a8c\u8bc1\u548c\u8fed\u4ee3\u6210\u719f\u673a\u5236\u7ed3\u5408\uff0c\u5f62\u6210\u53ef\u5728\u751f\u4ea7\u73af\u5883\u4e2d\u5b8c\u5168\u59d4\u6258\u7684\u65b0\u578b\u79d1\u5b66\u8f6f\u4ef6\u3002\u4f5c\u8005\u4ee5 DeMARS \u4e3a\u4f8b\uff0c\u5c55\u793a\u5176\u5982\u4f55\u4ece\u5b9e\u9a8c\u6d4b\u5f97\u7684\u65e0\u5e8f\u6676\u4f53\u7ed3\u6784\u6784\u5efa\u539f\u5b50\u7ea7\u6a21\u578b\u3002", "categories": ["cond-mat.mtrl-sci", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00795", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5f3a\u8c03 LLM \u667a\u80fd\u4f53\u4e0d\u53ea\u662f\u8f85\u52a9\u5de5\u5177\uff0c\u800c\u53ef\u5d4c\u5165\u79d1\u5b66\u8f6f\u4ef6\u6d41\u7a0b\u627f\u62c5\u53d7\u9650\u5224\u65ad\u4efb\u52a1", "\u63d0\u51fa\u5173\u952e\u7279\u5f81\uff1a\u786e\u5b9a\u6027\u7b97\u6cd5\u3001\u4efb\u52a1\u7279\u5b9a\u9a8c\u8bc1\u3001\u60c5\u8282\u5f0f\u7ecf\u9a8c\u79ef\u7d2f\u4e0e\u751f\u4ea7\u7ea7\u59d4\u6258", "DeMARS \u9762\u5411\u8ba1\u7b97\u6750\u6599\u79d1\u5b66\u4e2d\u7684\u65e0\u5e8f\u6676\u4f53\u5efa\u6a21\uff0c\u8fde\u63a5\u5b9e\u9a8c\u7ed3\u6784\u6570\u636e\u4e0e\u539f\u5b50\u6a21\u578b\u6784\u5efa"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u8ba1\u7b97", "\u6750\u6599\u79d1\u5b66", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00795v1", "published_at": "2026-09-01", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Agentic programs: an emerging form of scientific software in computational materials science", "tldr": "\u63d0\u51fa\u6750\u6599\u79d1\u5b66\u4e2d\u7684\u667a\u80fd\u4f53\u7a0b\u5e8f\u8303\u5f0f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201cagentic programs\u201d\u6982\u5ff5\uff1a\u5c06\u786e\u5b9a\u6027\u7b97\u6cd5\u4e0e\u53d7\u7ea6\u675f\u7684 LLM \u5224\u65ad\u3001\u4efb\u52a1\u9a8c\u8bc1\u548c\u8fed\u4ee3\u6210\u719f\u673a\u5236\u7ed3\u5408\uff0c\u5f62\u6210\u53ef\u5728\u751f\u4ea7\u73af\u5883\u4e2d\u5b8c\u5168\u59d4\u6258\u7684\u65b0\u578b\u79d1\u5b66\u8f6f\u4ef6\u3002\u4f5c\u8005\u4ee5 DeMARS \u4e3a\u4f8b\uff0c\u5c55\u793a\u5176\u5982\u4f55\u4ece\u5b9e\u9a8c\u6d4b\u5f97\u7684\u65e0\u5e8f\u6676\u4f53\u7ed3\u6784\u6784\u5efa\u539f\u5b50\u7ea7\u6a21\u578b\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u4e3a LLM agent \u5728\u79d1\u5b66\u8ba1\u7b97\u8f6f\u4ef6\u4e2d\u7684\u5b9a\u4f4d\u63d0\u4f9b\u4e86\u6e05\u6670\u6846\u67b6\uff0c\u5c55\u793a\u5176\u4ece\u4ea4\u4e92\u5f0f\u52a9\u624b\u8d70\u5411\u53ef\u9a8c\u8bc1\u3001\u53ef\u59d4\u6258\u79d1\u7814\u5de5\u4f5c\u6d41\u7684\u6f5c\u529b\uff0c\u5bf9\u6750\u6599\u5efa\u6a21\u548c\u79d1\u5b66\u81ea\u52a8\u5316\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Long-horizon large language model (LLM) agents require context assembly: the runtime must decide what to include in each prompt, in what order, and when to compact history under a hard context-window budget and a byte-sensitive prompt cache. In production agentic systems, this logic is scattered across prompt builders, ad hoc compaction routines, cache-break workarounds, and per-provider shims. We argue that context assembly is structurally isomorphic to query execution in a relational database: both execute under a hard budget, exploit a tiered cache, and leverage statistics. We adopt this discipline in ContextPipe: a five-phase pipeline (Plan Bind Optimize Execute Feedback) backed by a structured data-source catalog, a deterministic cache-aware optimizer, and an EXPLAIN ANALYZE trace. We show that context in ContextPipe is auditable, replayable, and failure-isolated. A preliminary evaluation using the SWE-bench Pro Qutebrowser subset shows that, compared with the append-only context construction policy, ContextPipe reduces total token volume by 31%, LLM calls by 23%, and response time by 9%, at the cost of a lower KV cache-hit ratio.", "arxiv_id": "2609.00749", "arxiv_url": "https://arxiv.org/abs/2609.00749", "authors": ["Peng Xu", "Zuyu Zhang", "Yuze Sun", "Feng Tian", "Long Wang", "Chen Zhang"], "brief": "\u672c\u6587\u63d0\u51fa ContextPipe\uff0c\u5c06\u957f\u7a0b LLM \u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u7ec4\u88c5\u7c7b\u6bd4\u4e3a\u5173\u7cfb\u6570\u636e\u5e93\u67e5\u8be2\u6267\u884c\u3002\u5b83\u901a\u8fc7 Plan-Bind-Optimize-Execute-Feedback \u4e94\u9636\u6bb5\u6d41\u6c34\u7ebf\u3001\u7ed3\u6784\u5316\u6570\u636e\u6e90\u76ee\u5f55\u548c\u7f13\u5b58\u611f\u77e5\u4f18\u5316\u5668\uff0c\u8ba9\u4e0a\u4e0b\u6587\u6784\u5efa\u66f4\u53ef\u5ba1\u8ba1\u3001\u53ef\u590d\u73b0\u4e14\u9694\u79bb\u6545\u969c\u3002", "categories": ["cs.AI", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00749", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u628a\u63d0\u793a\u8bcd\u4e0a\u4e0b\u6587\u9009\u62e9\u3001\u6392\u5e8f\u3001\u5386\u53f2\u538b\u7f29\u4e0e\u7f13\u5b58\u7ba1\u7406\u7edf\u4e00\u5efa\u6a21\u4e3a\u7c7b\u4f3c\u6570\u636e\u5e93\u67e5\u8be2\u4f18\u5316\u7684\u95ee\u9898", "\u63d0\u4f9b\u786e\u5b9a\u6027\u7684\u7f13\u5b58\u611f\u77e5\u4f18\u5316\u5668\u4e0e EXPLAIN ANALYZE \u5f0f\u8ffd\u8e2a\uff0c\u4fbf\u4e8e\u8c03\u8bd5\u548c\u590d\u76d8\u667a\u80fd\u4f53\u8fd0\u884c", "\u5728 SWE-bench Pro Qutebrowser \u5b50\u96c6\u4e0a\uff0c\u76f8\u6bd4\u8ffd\u52a0\u5f0f\u4e0a\u4e0b\u6587\u7b56\u7565\u51cf\u5c11 31% token\u300123% LLM \u8c03\u7528\u548c 9% \u54cd\u5e94\u65f6\u95f4"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u6570\u636e\u5e93", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00749v1", "published_at": "2026-09-01", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ContextPipe: Database-Inspired Context Assembly for Long-Horizon Agents", "tldr": "\u7528\u6570\u636e\u5e93\u67e5\u8be2\u601d\u60f3\u4f18\u5316\u957f\u7a0b\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u7ec4\u88c5", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ContextPipe\uff0c\u5c06\u957f\u7a0b LLM \u667a\u80fd\u4f53\u7684\u4e0a\u4e0b\u6587\u7ec4\u88c5\u7c7b\u6bd4\u4e3a\u5173\u7cfb\u6570\u636e\u5e93\u67e5\u8be2\u6267\u884c\u3002\u5b83\u901a\u8fc7 Plan-Bind-Optimize-Execute-Feedback \u4e94\u9636\u6bb5\u6d41\u6c34\u7ebf\u3001\u7ed3\u6784\u5316\u6570\u636e\u6e90\u76ee\u5f55\u548c\u7f13\u5b58\u611f\u77e5\u4f18\u5316\u5668\uff0c\u8ba9\u4e0a\u4e0b\u6587\u6784\u5efa\u66f4\u53ef\u5ba1\u8ba1\u3001\u53ef\u590d\u73b0\u4e14\u9694\u79bb\u6545\u969c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u751f\u4ea7\u7ea7\u957f\u7a0b\u667a\u80fd\u4f53\u4e2d\u4e0a\u4e0b\u6587\u7ba1\u7406\u5206\u6563\u3001\u4e0d\u53ef\u63a7\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4e86\u7cfb\u7edf\u5316\u5de5\u7a0b\u62bd\u8c61\uff0c\u6709\u671b\u63d0\u5347\u667a\u80fd\u4f53\u8fd0\u884c\u6548\u7387\u3001\u53ef\u89c2\u6d4b\u6027\u548c\u53ef\u7ef4\u62a4\u6027\u3002"}, {"abstract": "We describe the SciTrue team\u0027s participation in both subtasks of the NTCIR-19 SciClaimEval task~\\cite{sciclaimeval}, which asks systems to verify scientific claims against the tables and figures of a paper. Rather than tuning a single model, we benchmark eleven frontier and open multimodal models under one honest, per-sample protocol and combine them with light, transparent post-processing. On the official, blind test leaderboard (Section~\\ref{sec:results}), SciTrue placed first by a clear margin in three of the four evidence-category/subtask combinations, and tied for first on the primary metric in the fourth. Three findings explain the result. First, strong instruction-tuned models are already competitive: Claude Opus~4.8 and Gemma-4-31B each exceed the strongest public baseline (o4-mini), and GPT-5.5 and Claude Fable~5 lead both subtasks (97.7 on Subtask~2). Second, the task\u0027s pairing structure is the largest lever: a \\emph{leak-free pair prior} that recovers the Supported/Refuted pairing from the claim text alone (a visible field) and assigns Supported to the higher-confidence evidence raises Subtask-1 pair-accuracy from 72.2 to 93.5, far more than any model swap or ensemble weighting. Third, a case-by-case audit finds that most residual errors are visually-undetectable label-mapping swaps or dataset label noise, so measured accuracy understates the true ability and the fixable-by-modeling headroom is small. Controlled fine-tuning, distillation, and agentic consistency-checking support the same conclusions, and we document throughout a measurement leak---label information reaching a system through the packaging of the data rather than its content---in which the released file ordering encodes the label, including one instance that briefly misled our own pipeline.", "arxiv_id": "2609.00654", "arxiv_url": "https://arxiv.org/abs/2609.00654", "authors": ["Qiming Bao", "Ne\u015fet \u00d6zkan Tan", "Siyuan Wang", "Mark Gahegan"], "brief": "SciTrue \u53c2\u52a0 NTCIR-19 SciClaimEval\uff0c\u9a8c\u8bc1\u8bba\u6587\u56fe\u8868\u8bc1\u636e\u4e0b\u7684\u79d1\u5b66\u58f0\u660e\u771f\u4f2a\u3002\u56e2\u961f\u8bc4\u6d4b 11 \u4e2a\u524d\u6cbf\u4e0e\u5f00\u6e90\u591a\u6a21\u6001\u6a21\u578b\uff0c\u5e76\u7528\u8f7b\u91cf\u900f\u660e\u7684\u540e\u5904\u7406\uff0c\u5728\u5b98\u65b9\u76f2\u6d4b\u4e2d\u53d6\u5f97\u4e09\u9879\u7b2c\u4e00\u3001\u4e00\u9879\u5e76\u5217\u7b2c\u4e00\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00654", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Claude Opus 4.8\u3001Gemma-4-31B \u7b49\u6307\u4ee4\u8c03\u4f18\u6a21\u578b\u5df2\u8d85\u8fc7\u5f3a\u516c\u5f00\u57fa\u7ebf\uff0cGPT-5.5 \u4e0e Claude Fable 5 \u5728\u4e24\u4e2a\u5b50\u4efb\u52a1\u4e2d\u9886\u5148\uff0cSubtask 2 \u5f97\u5206\u8fbe 97.7\u3002", "\u4efb\u52a1\u914d\u5bf9\u7ed3\u6784\u662f\u6700\u5927\u6027\u80fd\u6760\u6746\uff1a\u65e0\u6cc4\u6f0f\u7684 pair prior \u4ec5\u4ece\u58f0\u660e\u6587\u672c\u6062\u590d Supported/Refuted \u914d\u5bf9\uff0c\u5e76\u6309\u7f6e\u4fe1\u5ea6\u5206\u914d\u6807\u7b7e\uff0c\u5c06 Subtask 1 \u914d\u5bf9\u51c6\u786e\u7387\u4ece 72.2 \u63d0\u5347\u5230 93.5\u3002", "\u9519\u8bef\u5ba1\u8ba1\u663e\u793a\u5269\u4f59\u9519\u8bef\u591a\u6765\u81ea\u89c6\u89c9\u4e0a\u96be\u4ee5\u53d1\u73b0\u7684\u6807\u7b7e\u6620\u5c04\u4e92\u6362\u6216\u6570\u636e\u96c6\u6807\u7b7e\u566a\u58f0\uff0c\u8bf4\u660e\u699c\u9762\u51c6\u786e\u7387\u53ef\u80fd\u4f4e\u4f30\u6a21\u578b\u771f\u5b9e\u80fd\u529b\u3002"], "keywords": ["\u79d1\u5b66\u9a8c\u8bc1", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b", "\u6570\u636e\u6cc4\u6f0f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00654v1", "published_at": "2026-09-01", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SciTrue: Reliable Scientific Claim Validation with Frontier and Open Language Models at the NTCIR SciClaimEval Task", "tldr": "\u591a\u6a21\u6001\u6a21\u578b\u7ed3\u5408\u914d\u5bf9\u5148\u9a8c\u593a\u5f97\u79d1\u5b66\u58f0\u660e\u9a8c\u8bc1\u699c\u9996", "upvotes": 0, "what_it_is": "SciTrue \u53c2\u52a0 NTCIR-19 SciClaimEval\uff0c\u9a8c\u8bc1\u8bba\u6587\u56fe\u8868\u8bc1\u636e\u4e0b\u7684\u79d1\u5b66\u58f0\u660e\u771f\u4f2a\u3002\u56e2\u961f\u8bc4\u6d4b 11 \u4e2a\u524d\u6cbf\u4e0e\u5f00\u6e90\u591a\u6a21\u6001\u6a21\u578b\uff0c\u5e76\u7528\u8f7b\u91cf\u900f\u660e\u7684\u540e\u5904\u7406\uff0c\u5728\u5b98\u65b9\u76f2\u6d4b\u4e2d\u53d6\u5f97\u4e09\u9879\u7b2c\u4e00\u3001\u4e00\u9879\u5e76\u5217\u7b2c\u4e00\u3002", "why_notable": "\u8bba\u6587\u4e0d\u4ec5\u5c55\u793a\u4e86\u524d\u6cbf\u591a\u6a21\u6001\u6a21\u578b\u5728\u79d1\u5b66\u58f0\u660e\u9a8c\u8bc1\u4e2d\u7684\u5f3a\u80fd\u529b\uff0c\u8fd8\u6307\u51fa\u6570\u636e\u6253\u5305\u987a\u5e8f\u53ef\u80fd\u7f16\u7801\u6807\u7b7e\u7684\u201c\u6d4b\u91cf\u6cc4\u6f0f\u201d\u95ee\u9898\uff0c\u63d0\u9192\u8bc4\u6d4b\u57fa\u51c6\u8bbe\u8ba1\u9700\u66f4\u4e25\u683c\uff1b\u540c\u65f6\u8bf4\u660e\u5728\u67d0\u4e9b\u4efb\u52a1\u4e2d\uff0c\u7ed3\u6784\u5316\u5148\u9a8c\u4e0e\u5ba1\u8ba1\u6bd4\u5355\u7eaf\u6362\u6a21\u578b\u66f4\u5173\u952e\u3002"}, {"abstract": "We present CogEvol, a family of models trained specifically for Learning Environment Generation: turning a course brief into a finished learning artifact (structured-JSON slides or self-contained interactive HTML pages) in a single pass. Across 220k production requests, CogEvol completes a slide in a median of 17 seconds and an interactive page in 59, replacing minutes-long multi-turn agent scaffolding. Reliability is enforced rather than hoped for: a production-grounded data pipeline turns real failures into 53,687 verified SFT samples, and a hybrid rule-plus-VLM reward drives GRPO-based RL, hardened after we caught and fixed a reward-hacking episode that produced visually convincing but unplayable games. CogEvol-27B scores 83.7 on slide quality and 63.7 on a 500-case interactive-HTML benchmark with 26.9x fewer parameters than flagship coding models, and, in collaboration with the OpenMAIC team, serves their live production traffic. CogEvol-4B is released openly under the Apache 2.0 license at https://github.com/CogEvol/CogEvol-4B; external flagships are measured on the same suites under the identical harness. Scaffold editing cuts interactive-page generation cost by a further ~76%, and the full stack runs on domestic Ascend accelerators at application-level parity with A800 GPUs, lowering the unit cost of AI-native education at scale.", "arxiv_id": "2608.30968", "arxiv_url": "https://arxiv.org/abs/2608.30968", "authors": ["Shangqing Tu", "Daniel Zhang-Li", "Yucheng Wang", "Shiyu Gan", "Yanpeng Wang", "Huiqiang Rong", "Mofei Chen", "Shen Yang", "Yini Chen", "Yinuo Duan", "Haoxuan Li", "Binglin Liu", "Ye He", "Danqi Zheng", "Zhanxin Hao", "Yuxuan Wu", "Mengting Tao", "Yuqiu Liu", "Jifan Yu", "Juanzi Li", "Bin Xu", "Lei Hou", "Huiqin Liu", "Yu Zhang"], "brief": "CogEvol \u662f\u4e00\u7ec4\u9762\u5411\u5b66\u4e60\u73af\u5883\u751f\u6210\u7684\u6a21\u578b\uff0c\u53ef\u5c06\u8bfe\u7a0b\u7b80\u8ff0\u4e00\u6b21\u6027\u751f\u6210\u7ed3\u6784\u5316 JSON \u5e7b\u706f\u7247\u6216\u81ea\u5305\u542b\u4ea4\u4e92\u5f0f HTML \u9875\u9762\u3002\u5b83\u901a\u8fc7\u751f\u4ea7\u6545\u969c\u6570\u636e\u6784\u9020 SFT \u6837\u672c\uff0c\u5e76\u7ed3\u5408\u89c4\u5219\u4e0e VLM \u5956\u52b1\u8fdb\u884c GRPO \u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u751f\u6210\u53ef\u9760\u6027\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/CogEvol/CogEvol-4B", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2608.30968", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e 22 \u4e07\u6b21\u751f\u4ea7\u8bf7\u6c42\u9a8c\u8bc1\uff0c\u751f\u6210\u5355\u9875\u5e7b\u706f\u7247\u4e2d\u4f4d\u8017\u65f6 17 \u79d2\uff0c\u4ea4\u4e92\u9875\u9762 59 \u79d2\uff0c\u66ff\u4ee3\u5206\u949f\u7ea7\u591a\u8f6e\u667a\u80fd\u4f53\u811a\u624b\u67b6\u6d41\u7a0b", "\u5c06\u771f\u5b9e\u5931\u8d25\u6848\u4f8b\u8f6c\u5316\u4e3a 53,687 \u6761\u9a8c\u8bc1\u8fc7\u7684 SFT \u6837\u672c\uff0c\u5e76\u7528\u89c4\u5219+VLM \u5956\u52b1\u8bad\u7ec3\uff0c\u540c\u65f6\u4fee\u590d\u4e86\u751f\u6210\u201c\u770b\u4f3c\u53ef\u73a9\u4f46\u5b9e\u9645\u4e0d\u53ef\u73a9\u201d\u7684\u5956\u52b1\u9ed1\u5ba2\u95ee\u9898", "CogEvol-27B \u5728\u5e7b\u706f\u7247\u8d28\u91cf\u4e0a\u5f97\u5206 83.7\uff0c\u5728 500 \u6848\u4f8b\u4ea4\u4e92 HTML \u57fa\u51c6\u4e0a\u5f97\u5206 63.7\uff0c\u53c2\u6570\u91cf\u6bd4\u65d7\u8230\u4ee3\u7801\u6a21\u578b\u5c11 26.9 \u500d\uff1bCogEvol-4B \u4ee5 Apache 2.0 \u5f00\u6e90"], "keywords": ["\u6559\u80b2\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u4ee3\u7801\u751f\u6210", "\u591a\u6a21\u6001\u5956\u52b1"], "num_comments": 2, "on_hf": true, "organization": "\u5143\u77e5\u8fdb\u5316\uff08\u5317\u4eac\uff09\u79d1\u6280\u6709\u9650\u516c\u53f8", "pdf_url": "https://arxiv.org/pdf/2608.30968v1", "published_at": "2026-08-31", "score": 0.323, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30968.png", "title": "CogEvol: Towards Efficient and Reliable Learning Environment Generation", "tldr": "\u9ad8\u6548\u751f\u6210\u8bfe\u4ef6\u4e0e\u4e92\u52a8HTML\u7684\u6559\u80b2\u6a21\u578b", "upvotes": 26, "what_it_is": "CogEvol \u662f\u4e00\u7ec4\u9762\u5411\u5b66\u4e60\u73af\u5883\u751f\u6210\u7684\u6a21\u578b\uff0c\u53ef\u5c06\u8bfe\u7a0b\u7b80\u8ff0\u4e00\u6b21\u6027\u751f\u6210\u7ed3\u6784\u5316 JSON \u5e7b\u706f\u7247\u6216\u81ea\u5305\u542b\u4ea4\u4e92\u5f0f HTML \u9875\u9762\u3002\u5b83\u901a\u8fc7\u751f\u4ea7\u6545\u969c\u6570\u636e\u6784\u9020 SFT \u6837\u672c\uff0c\u5e76\u7ed3\u5408\u89c4\u5219\u4e0e VLM \u5956\u52b1\u8fdb\u884c GRPO \u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u751f\u6210\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6559\u80b2\u5185\u5bb9\u751f\u6210\u4ece\u591a\u8f6e\u667a\u80fd\u4f53\u7f16\u6392\u538b\u7f29\u4e3a\u5355\u6b21\u6a21\u578b\u8c03\u7528\uff0c\u5e76\u5f3a\u8c03\u751f\u4ea7\u7ea7\u53ef\u9760\u6027\u3001\u6210\u672c\u4f18\u5316\u4e0e\u56fd\u4ea7 Ascend \u52a0\u901f\u5668\u90e8\u7f72\uff0c\u5bf9\u5927\u89c4\u6a21 AI \u539f\u751f\u6559\u80b2\u5e94\u7528\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "While low-rank adaptation (LoRA) is widely used for parameter-efficient model adaptation, how to regularize its training dynamics for stable and effective optimization remains underexplored. Because LoRA initializes the up-projection to zero, its early optimization dynamics are largely governed by the down-projection. Building on this observation, we introduce Normalized Low-Rank Adaptation (NoRA), a simple yet effective method that normalizes the down-projection matrices during training. We further show that the same normalization can be applied only at initialization, improving standard LoRA without requiring repeated normalization throughout training. Across pretraining, supervised finetuning, and reinforcement learning, NoRA consistently accelerates convergence, improves performance and training stability, and mitigates catastrophic forgetting. These benefits require neither additional trainable parameters nor inference-time computation, making NoRA a simple and broadly applicable enhancement to LoRA.", "arxiv_id": "2608.31036", "arxiv_url": "https://arxiv.org/abs/2608.31036", "authors": ["Jiale Kang", "Ziyin Yue", "Zheng Zhan", "Yangyi Huang", "Weiyang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa Normalized Low-Rank Adaptation\uff08NoRA\uff09\uff0c\u9488\u5bf9 LoRA \u65e9\u671f\u8bad\u7ec3\u4e3b\u8981\u53d7\u4e0b\u6295\u5f71\u77e9\u9635\u4e3b\u5bfc\u7684\u73b0\u8c61\uff0c\u5bf9\u4e0b\u6295\u5f71\u77e9\u9635\u8fdb\u884c\u5f52\u4e00\u5316\u4ee5\u6539\u5584\u4f18\u5316\u52a8\u6001\u3002\u4f5c\u8005\u8fd8\u53d1\u73b0\u4ec5\u5728\u521d\u59cb\u5316\u65f6\u5e94\u7528\u8be5\u5f52\u4e00\u5316\uff0c\u4e5f\u80fd\u589e\u5f3a\u6807\u51c6 LoRA\uff0c\u800c\u65e0\u9700\u8bad\u7ec3\u4e2d\u53cd\u590d\u5f52\u4e00\u5316\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/Joluck/NoRA", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2608.31036", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["NoRA\u4e0d\u589e\u52a0\u53ef\u8bad\u7ec3\u53c2\u6570\uff0c\u4e5f\u4e0d\u5f15\u5165\u63a8\u7406\u65f6\u989d\u5916\u8ba1\u7b97\u5f00\u9500\u3002", "\u5728\u9884\u8bad\u7ec3\u3001\u76d1\u7763\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u573a\u666f\u4e2d\u5747\u80fd\u52a0\u901f\u6536\u655b\u3001\u63d0\u5347\u6027\u80fd\u4e0e\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "\u65b9\u6cd5\u53ef\u7f13\u89e3\u707e\u96be\u6027\u9057\u5fd8\uff0c\u9002\u5408\u4f5c\u4e3aLoRA\u7684\u901a\u7528\u589e\u5f3a\u6a21\u5757\u3002"], "keywords": ["\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "LoRA", "\u8bad\u7ec3\u7a33\u5b9a\u6027", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.31036v1", "published_at": "2026-08-31", "score": 0.303, "selected_reasons": ["HF trending (42\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31036.png", "title": "Normalized Low-Rank Adaptation", "tldr": "NoRA\u901a\u8fc7\u5f52\u4e00\u5316LoRA\u4e0b\u6295\u5f71\u63d0\u5347\u8bad\u7ec3\u7a33\u5b9a\u6027\u3002", "upvotes": 42, "what_it_is": "\u8bba\u6587\u63d0\u51fa Normalized Low-Rank Adaptation\uff08NoRA\uff09\uff0c\u9488\u5bf9 LoRA \u65e9\u671f\u8bad\u7ec3\u4e3b\u8981\u53d7\u4e0b\u6295\u5f71\u77e9\u9635\u4e3b\u5bfc\u7684\u73b0\u8c61\uff0c\u5bf9\u4e0b\u6295\u5f71\u77e9\u9635\u8fdb\u884c\u5f52\u4e00\u5316\u4ee5\u6539\u5584\u4f18\u5316\u52a8\u6001\u3002\u4f5c\u8005\u8fd8\u53d1\u73b0\u4ec5\u5728\u521d\u59cb\u5316\u65f6\u5e94\u7528\u8be5\u5f52\u4e00\u5316\uff0c\u4e5f\u80fd\u589e\u5f3a\u6807\u51c6 LoRA\uff0c\u800c\u65e0\u9700\u8bad\u7ec3\u4e2d\u53cd\u590d\u5f52\u4e00\u5316\u3002", "why_notable": "LoRA\u5df2\u662f\u5927\u6a21\u578b\u53c2\u6570\u9ad8\u6548\u5fae\u8c03\u7684\u4e3b\u6d41\u65b9\u6cd5\uff0cNoRA\u4ee5\u6781\u4f4e\u6210\u672c\u6539\u8fdb\u5176\u8bad\u7ec3\u52a8\u6001\u548c\u7a33\u5b9a\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5b9e\u7528\u4ef7\u503c\u548c\u5e7f\u6cdb\u53ef\u8fc1\u79fb\u6027\u3002"}, {"abstract": "Satellite mega-constellations are emerging as large-scale sensing, communication, and computation fabrics, yet their learning architectures remain largely inherited from terrestrial federated learning and ground-centric mission operations--- ill-suited to satellites that differ by orders of magnitude in Size, Weight, Power, and Cost (SWAP-C), radiation tolerance, link availability, and propagation delay. We propose a heterogeneous federated learning method based on the FractalNet architecture for orbital edge intelligence. We formalize contact-window-constrained, depth-heterogeneous federated optimization and introduce a distributed path scheduler that assigns model depth as a function of SWAP-C constraints, predicted inter-satellite contacts, and training statistics. To reduce message overhead and energy consumption, each tier pools updates periodically rather than at every contact opportunity, and a three-tier agentic control plane governs in-space scheduling, anomaly escalation, and policy-governed autonomy. As a case study, we apply the framework to wildfire detection, where each orbital shell naturally learns a different semantic level of situational awareness: pixel-scale thermal anomalies at low Earth orbit (LEO), regional fire-front dynamics at medium Earth orbit (MEO), and larger-scale risk propagation at geostationary or high Earth orbit (GEO/HEO). Experiments on simulated mega-constellations validate the approach across convergence, communication efficiency, energy adaptation, scheduled-pooling savings, robustness, and latency.", "arxiv_id": "2609.00875", "arxiv_url": "https://arxiv.org/abs/2609.00875", "authors": ["Sai Puppala", "Koushik Sinha"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e FractalNet \u7684\u5f02\u6784\u8054\u90a6\u5b66\u4e60\u65b9\u6cd5\uff0c\u7528\u4e8e\u536b\u661f\u5de8\u578b\u661f\u5ea7\u4e2d\u7684\u8f68\u9053\u8fb9\u7f18\u667a\u80fd\u3002\u5b83\u6839\u636e\u536b\u661f SWAP-C \u7ea6\u675f\u3001\u661f\u95f4\u63a5\u89e6\u7a97\u53e3\u548c\u8bad\u7ec3\u72b6\u6001\u52a8\u6001\u5206\u914d\u6a21\u578b\u6df1\u5ea6\uff0c\u5e76\u4ee5\u91ce\u706b\u68c0\u6d4b\u4f5c\u4e3a\u6848\u4f8b\u9a8c\u8bc1\u3002", "categories": ["cs.AI", "cs.DC", "cs.ET", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00875", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5f62\u5f0f\u5316\u4e86\u53d7\u63a5\u89e6\u7a97\u53e3\u7ea6\u675f\u3001\u6a21\u578b\u6df1\u5ea6\u5f02\u6784\u7684\u8054\u90a6\u4f18\u5316\u95ee\u9898", "\u8bbe\u8ba1\u5206\u5e03\u5f0f\u8def\u5f84\u8c03\u5ea6\u5668\uff0c\u6839\u636e\u8d44\u6e90\u3001\u94fe\u8def\u9884\u6d4b\u548c\u8bad\u7ec3\u7edf\u8ba1\u9009\u62e9\u4e0d\u540c FractalNet \u6df1\u5ea6", "\u901a\u8fc7\u5206\u5c42\u5468\u671f\u6027\u805a\u5408\u51cf\u5c11\u901a\u4fe1\u5f00\u9500\u548c\u80fd\u8017\uff0c\u5e76\u5728\u6a21\u62df\u661f\u5ea7\u4e2d\u9a8c\u8bc1\u6536\u655b\u3001\u9c81\u68d2\u6027\u3001\u5ef6\u8fdf\u548c\u8282\u80fd\u6548\u679c"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u8fb9\u7f18\u667a\u80fd", "\u536b\u661f\u8ba1\u7b97", "\u9065\u611f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00875v1", "published_at": "2026-09-01", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "FractalNet-Based Heterogeneous Federated Learning for Orbital Edge Intelligence in Satellite Mega-Constellations: A Wildfire Case Study", "tldr": "\u9762\u5411\u536b\u661f\u661f\u5ea7\u7684\u5f02\u6784\u8054\u90a6\u5b66\u4e60\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e FractalNet \u7684\u5f02\u6784\u8054\u90a6\u5b66\u4e60\u65b9\u6cd5\uff0c\u7528\u4e8e\u536b\u661f\u5de8\u578b\u661f\u5ea7\u4e2d\u7684\u8f68\u9053\u8fb9\u7f18\u667a\u80fd\u3002\u5b83\u6839\u636e\u536b\u661f SWAP-C \u7ea6\u675f\u3001\u661f\u95f4\u63a5\u89e6\u7a97\u53e3\u548c\u8bad\u7ec3\u72b6\u6001\u52a8\u6001\u5206\u914d\u6a21\u578b\u6df1\u5ea6\uff0c\u5e76\u4ee5\u91ce\u706b\u68c0\u6d4b\u4f5c\u4e3a\u6848\u4f8b\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u8054\u90a6\u5b66\u4e60\u4ece\u5730\u9762\u540c\u6784\u8bbe\u5907\u573a\u666f\u6269\u5c55\u5230\u8d44\u6e90\u5dee\u5f02\u5de8\u5927\u3001\u94fe\u8def\u95f4\u6b47\u7684\u536b\u661f\u661f\u5ea7\uff0c\u4e3a\u5728\u8f68\u81ea\u4e3b\u611f\u77e5\u4e0e\u707e\u5bb3\u76d1\u6d4b\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u9645\u7ea6\u675f\u7684\u5b66\u4e60\u67b6\u6784\u3002"}, {"abstract": "As agentic systems become compound systems, increasingly important decisions move above task execution itself: when should a higher-level controller preserve the strategy guiding another process, and when should it revise it? We study this meta-level control problem in a hierarchical latent reasoner whose manager can retain or replace a commitment governing lower-level computation. Across three precommitted training seeds, learned revision timing produces qualitatively different policies, ranging from an almost deterministic early clock to substantially more state conditioned schedule distributions, yet none outperforms the best forced timing policy evaluated on the same frozen checkpoint. This separates state dependence from decision value: a controller can vary its actions with internal state without turning that variation into a reproducible task-performance benefit. A deeper intervention study on the original checkpoint shows that timing itself is consequential and order-sensitive, while exhaustive enumeration reveals that a strong fixed schedule captures most of the measurable value available from timing at this decision budget. Counterfactual PERSIST/REPLAN diagnostics further show why score-level evidence can be misleading when predictability is dominated by decision position rather than within-position discrimination. Together, these results argue that learned meta-level control should be evaluated along three separate axes: whether its score depends on state, whether that dependence changes realized behavior, and whether those changes capture outcome value beyond a strong non-adaptive policy.", "arxiv_id": "2609.00874", "arxiv_url": "https://arxiv.org/abs/2609.00874", "authors": ["Ayushi Chadha"], "brief": "\u672c\u6587\u7814\u7a76\u5c42\u7ea7\u6f5c\u5728\u63a8\u7406\u5668\u4e2d\u7684\u5143\u63a7\u5236\u95ee\u9898\uff1a\u9ad8\u5c42\u7ba1\u7406\u5668\u5e94\u4f55\u65f6\u4fdd\u7559\u6216\u66ff\u6362\u4f4e\u5c42\u8ba1\u7b97\u7b56\u7565\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5b66\u4e60\u5230\u7684\u4fee\u8ba2\u65f6\u673a\u867d\u4f1a\u5448\u73b0\u4e0d\u540c\u7a0b\u5ea6\u7684\u72b6\u6001\u4f9d\u8d56\uff0c\u4f46\u5e76\u672a\u7a33\u5b9a\u8d85\u8fc7\u6700\u4f73\u5f3a\u5236\u56fa\u5b9a\u65f6\u5e8f\u7b56\u7565\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00874", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u5728\u4e09\u4e2a\u9884\u63d0\u4ea4\u8bad\u7ec3\u79cd\u5b50\u4e0a\uff0c\u5b66\u4e60\u5230\u7684\u4fee\u8ba2\u7b56\u7565\u4ece\u8fd1\u4f3c\u56fa\u5b9a\u65e9\u671f\u65f6\u949f\u5230\u66f4\u5f3a\u72b6\u6001\u6761\u4ef6\u8c03\u5ea6\u4e0d\u7b49", "\u5e72\u9884\u5b9e\u9a8c\u8868\u660e\u4fee\u8ba2\u65f6\u673a\u672c\u8eab\u91cd\u8981\u4e14\u53d7\u987a\u5e8f\u5f71\u54cd\uff0c\u4f46\u7a77\u4e3e\u7ed3\u679c\u663e\u793a\u5f3a\u56fa\u5b9a\u65e5\u7a0b\u5df2\u6355\u83b7\u5927\u90e8\u5206\u53ef\u6d4b\u6536\u76ca", "PERSIST/REPLAN \u53cd\u4e8b\u5b9e\u8bca\u65ad\u663e\u793a\uff0c\u5206\u6570\u5c42\u9762\u7684\u8bc1\u636e\u53ef\u80fd\u88ab\u51b3\u7b56\u4f4d\u7f6e\u4e3b\u5bfc\uff0c\u8bef\u5bfc\u5bf9\u81ea\u9002\u5e94\u4ef7\u503c\u7684\u5224\u65ad"], "keywords": ["\u667a\u80fd\u4f53", "\u5143\u63a7\u5236", "\u5c42\u7ea7\u63a8\u7406", "\u8bc4\u4f30\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00874v1", "published_at": "2026-09-01", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond the Clock: Measuring the Value of Adaptive Revision", "tldr": "\u81ea\u9002\u5e94\u4fee\u8ba2\u672a\u5fc5\u4f18\u4e8e\u5f3a\u56fa\u5b9a\u65f6\u5e8f", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5c42\u7ea7\u6f5c\u5728\u63a8\u7406\u5668\u4e2d\u7684\u5143\u63a7\u5236\u95ee\u9898\uff1a\u9ad8\u5c42\u7ba1\u7406\u5668\u5e94\u4f55\u65f6\u4fdd\u7559\u6216\u66ff\u6362\u4f4e\u5c42\u8ba1\u7b97\u7b56\u7565\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5b66\u4e60\u5230\u7684\u4fee\u8ba2\u65f6\u673a\u867d\u4f1a\u5448\u73b0\u4e0d\u540c\u7a0b\u5ea6\u7684\u72b6\u6001\u4f9d\u8d56\uff0c\u4f46\u5e76\u672a\u7a33\u5b9a\u8d85\u8fc7\u6700\u4f73\u5f3a\u5236\u56fa\u5b9a\u65f6\u5e8f\u7b56\u7565\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192\u7814\u7a76\u8005\u4e0d\u8981\u4ec5\u51ed\u72b6\u6001\u4f9d\u8d56\u6216\u884c\u4e3a\u53d8\u5316\u5224\u65ad\u5143\u63a7\u5236\u6709\u6548\u6027\uff0c\u800c\u5e94\u533a\u5206\u72b6\u6001\u4f9d\u8d56\u3001\u884c\u4e3a\u6539\u53d8\u4e0e\u76f8\u5bf9\u5f3a\u975e\u81ea\u9002\u5e94\u57fa\u7ebf\u7684\u771f\u5b9e\u6536\u76ca\uff0c\u5bf9\u8bc4\u4f30\u667a\u80fd\u4f53\u4e2d\u7684\u7b56\u7565\u4fee\u8ba2\u673a\u5236\u5177\u6709\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Autonomous scientific research agents are increasingly applied to end-to-end scientific workflows, including literature review, data analysis, experimentation, and report generation. However, open-ended research tasks often do not clearly specify the analyses, methods, and success criteria required to complete the task. As a result, agents may miss important analyses, use inappropriate methods, or draw conclusions that are insufficiently supported by evidence. To address the problem, we present AutoSciRub, an evaluation-first framework that induces a task-specific executable rubric before research execution, and uses it to guide execution, criterion-level verification as well as iterative revision. AutoSciRub decomposes an underspecified instruction into atomic scientific goals, grounds them in relevant literature and task-visible data, and synthesizes specific, actionable, and verifiable criteria. The resulting rubric makes implicit experimental and evidential requirements explicit, providing guidance for experiments and analyses. During revision, rubric-guided verification identifies unmet criteria and enables targeted refinement of the research report and its supporting artifacts. On ResearchClawBench, AutoSciRub consistently improves all tested configurations, with an average gain of 2.08 points across three backbone LLMs under the fixed Codex harness and 2.95 points across three agent harnesses using a fixed DeepSeek-V4-Flash backbone. On a randomly sampled 20-task subset of AstaBench E2E Discovery, AutoSciRub further achieves an average improvement of 16.8 points across three agent harnesses, while maintaining or increasing the number of successfully completed tasks. These results demonstrate that evaluation-first guidance provides an effective and generalizable control mechanism for autonomous scientific research (Code: https://github.com/zjunlp/AutoSciRub).", "arxiv_id": "2608.31076", "arxiv_url": "https://arxiv.org/abs/2608.31076", "authors": ["Xuehai Wang", "Haowei Qin", "Tongxin Liu", "Junkai Li", "Buqiang Xu", "Jintian Zhang", "Yijun Chen", "Zirui Xue", "Shumin Deng"], "brief": "\u8bba\u6587\u63d0\u51fa AutoSciRub\uff0c\u4e00\u79cd\u201c\u8bc4\u4f30\u4f18\u5148\u201d\u7684\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u6846\u67b6\uff1a\u5728\u6267\u884c\u5f00\u653e\u5f0f\u7814\u7a76\u4efb\u52a1\u524d\uff0c\u5148\u5f52\u7eb3\u4efb\u52a1\u7279\u5b9a\u7684\u53ef\u6267\u884c\u8bc4\u4ef7\u91cf\u89c4\u3002\u8be5\u91cf\u89c4\u5c06\u9690\u542b\u7684\u5206\u6790\u3001\u5b9e\u9a8c\u4e0e\u8bc1\u636e\u8981\u6c42\u663e\u5f0f\u5316\uff0c\u5e76\u7528\u4e8e\u6307\u5bfc\u6267\u884c\u3001\u9010\u9879\u9a8c\u8bc1\u548c\u8fed\u4ee3\u4fee\u8ba2\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR", "cs.LG", "cs.MA", "cs.SE"], "github_repo": "https://github.com/zjunlp/AutoSciRub", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2608.31076", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u6b20\u660e\u786e\u7684\u7814\u7a76\u6307\u4ee4\u5206\u89e3\u4e3a\u539f\u5b50\u79d1\u5b66\u76ee\u6807\uff0c\u5e76\u7ed3\u5408\u76f8\u5173\u6587\u732e\u4e0e\u4efb\u52a1\u53ef\u89c1\u6570\u636e\u751f\u6210\u5177\u4f53\u3001\u53ef\u64cd\u4f5c\u3001\u53ef\u9a8c\u8bc1\u7684\u8bc4\u4ef7\u6807\u51c6", "\u901a\u8fc7 rubric-guided verification \u5b9a\u4f4d\u672a\u6ee1\u8db3\u7684\u6807\u51c6\uff0c\u9488\u5bf9\u6027\u6539
