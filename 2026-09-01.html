-08-31", "score": 0.496, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30730.png", "title": "E-Commerce Bench: Evaluating LLM Agents on Long-Horizon Autonomous Business Operation", "tldr": "\u8bc4\u6d4bLLM\u667a\u80fd\u4f53\u5168\u5e74\u7535\u5546\u7ecf\u8425\u80fd\u529b", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa E-Commerce Bench\uff0c\u4e00\u4e2a\u5f00\u6e90\u957f\u7a0b\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u8ba9 LLM \u5728365\u5929\u5185\u81ea\u4e3b\u7ecf\u8425\u591a\u4e2a\u7f51\u5e97\u3002\u4efb\u52a1\u6db5\u76d6\u5e02\u573a\u8c03\u7814\u3001\u4f9b\u5e94\u5546\u8c08\u5224\u3001\u8fdb\u8d27\u3001\u9500\u552e\u4f18\u5316\u3001\u5c65\u7ea6\u9000\u8d27\u4e0e\u73b0\u91d1\u6d41\u7ba1\u7406\uff0c\u5e76\u5f15\u5165\u52a8\u6001\u4fc3\u9500\u3001\u707e\u5bb3\u548c\u4f9b\u5e94\u94fe\u51b2\u51fb\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06 LLM \u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u77ed\u4efb\u52a1\u6269\u5c55\u5230\u6570\u5343\u6b65\u3001\u5f3a\u52a8\u6001\u3001\u5f3a\u4f9d\u8d56\u7684\u771f\u5b9e\u4e1a\u52a1\u7ecf\u8425\u573a\u666f\uff0c\u6709\u52a9\u4e8e\u8861\u91cf\u957f\u671f\u89c4\u5212\u3001\u7ecf\u9a8c\u5b66\u4e60\u3001\u8c08\u5224\u548c\u98ce\u9669\u63a7\u5236\u7b49\u5173\u952e\u667a\u80fd\u4f53\u80fd\u529b\u3002"}, {"abstract": "Large language model (LLM) agents are increasingly deployed in long-horizon, interactive, and stateful environments. In these settings, a single wrong action, such as refunding the wrong purchase, can cause irreversible task failure and must be intercepted before execution. Such failures may not appear in every single run, but can emerge across repeated trials, making reliability across steps and trials critical. However, ensuring agentic reliability is challenging: even frontier LLMs struggle to explain why an action may be wrong, especially in long, intertwined trajectories governed by domain-specific policies. Much recent work relies on prompt-based critique agents, while optimization-based methods lack a systematic way to produce rich verification rationales for training. We address this gap with CAST, a critique-aware training framework that converts sparse task outcomes into action-level supervision for critique learning and policy optimization. CAST analyzes agent trajectories to synthesize structured rationales explaining action validity under partial observability. The resulting critique model is used to construct critique-aware training data for optimizing the policy model. Fine-tuning Qwen3-family models on dynamic tool-calling benchmarks, CAST improves reliability across domains, outperforming GPT-OSS-120B by over 10% pass^4 on Retail tasks and yielding an additional 9% improvement on Telehealth in an out-of-domain setting. These results demonstrate that critique-aware training improves the robustness of LLM agents in realistic dynamic environments.", "arxiv_id": "2608.30147", "arxiv_url": "https://arxiv.org/abs/2608.30147", "authors": ["Amir Saeidi", "Zehua Zhang", "Rishitosh Singh", "Naman Ahuja", "Vivek Gupta", "Ali Payani", "Gaowen Liu", "Jayanth Srinivasa", "Chitta Baral"], "brief": "\u672c\u6587\u63d0\u51fa CAST\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u7684 critique-aware \u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u5c06\u7a00\u758f\u4efb\u52a1\u6210\u8d25\u7ed3\u679c\u8f6c\u5316\u4e3a\u52a8\u4f5c\u7ea7\u76d1\u7763\uff0c\u751f\u6210\u7ed3\u6784\u5316\u9a8c\u8bc1\u7406\u7531\uff0c\u5e76\u7528\u6279\u5224\u6a21\u578b\u8f85\u52a9\u4f18\u5316\u7b56\u7565\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30147", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ece\u591a\u6b65\u4ea4\u4e92\u8f68\u8ff9\u4e2d\u5206\u6790\u52a8\u4f5c\u6709\u6548\u6027\uff0c\u5728\u90e8\u5206\u53ef\u89c2\u6d4b\u548c\u9886\u57df\u89c4\u5219\u7ea6\u675f\u4e0b\u5408\u6210\u7ed3\u6784\u5316 critique rationale", "\u8bad\u7ec3 critique model\uff0c\u5e76\u636e\u6b64\u6784\u9020 critique-aware \u6570\u636e\u6765\u5fae\u8c03\u5de5\u5177\u8c03\u7528\u7b56\u7565\u6a21\u578b", "\u5728\u52a8\u6001\u5de5\u5177\u8c03\u7528\u57fa\u51c6\u4e0a\u5fae\u8c03 Qwen3 \u7cfb\u5217\u6a21\u578b\uff0cRetail \u4efb\u52a1 pass^4 \u8d85\u8fc7 GPT-OSS-120B 10% \u4ee5\u4e0a\uff0cTelehealth \u8de8\u57df\u573a\u666f\u989d\u5916\u63d0\u5347 9%"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u76d1\u7763\u5fae\u8c03", "\u53ef\u9760\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30147v1", "published_at": "2026-08-31", "score": 0.483, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30147.png", "title": "CAST: Critique-Aware Supervision for Training Reliable Long-Horizon Tool-Calling Agents", "tldr": "\u7528\u6279\u5224\u76d1\u7763\u63d0\u5347\u957f\u7a0b\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u53ef\u9760\u6027", "upvotes": 6, "what_it_is": "\u672c\u6587\u63d0\u51fa CAST\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u7684 critique-aware \u8bad\u7ec3\u6846\u67b6\u3002\u5b83\u5c06\u7a00\u758f\u4efb\u52a1\u6210\u8d25\u7ed3\u679c\u8f6c\u5316\u4e3a\u52a8\u4f5c\u7ea7\u76d1\u7763\uff0c\u751f\u6210\u7ed3\u6784\u5316\u9a8c\u8bc1\u7406\u7531\uff0c\u5e76\u7528\u6279\u5224\u6a21\u578b\u8f85\u52a9\u4f18\u5316\u7b56\u7565\u6a21\u578b\u3002", "why_notable": "\u957f\u7a0b\u667a\u80fd\u4f53\u4e2d\u5355\u6b65\u9519\u8bef\u53ef\u80fd\u5bfc\u81f4\u4e0d\u53ef\u9006\u5931\u8d25\uff0cCAST \u63d0\u4f9b\u4e86\u6bd4\u63d0\u793a\u5f0f\u6279\u5224\u66f4\u7cfb\u7edf\u7684\u8bad\u7ec3\u4fe1\u53f7\u6784\u9020\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u771f\u5b9e\u52a8\u6001\u73af\u5883\u4e0b LLM agent \u7684\u7a33\u5065\u6027\u548c\u53ef\u9a8c\u8bc1\u6027\u3002"}, {"abstract": "We present Qwen-Drive-1.0, an initial step towards a vision-language foundation model for autonomous driving. Qwen-Drive-1.0 retains the architecture of the pretrained vision-language model (VLM) and integrates 3D perception, visual question answering, and motion planning within a unified framework. An external bird\u0027s-eye-view (BEV) perception head jointly performs 3D object detection, semantic occupancy prediction, and BEV map segmentation. It serves as a probe of the 3D information accessible from the shared representations and provides an explicit, inspectable interface to 3D scene structure. A Planning Expert conditions on shared VLM representations to generate future ego trajectories. A staged training recipe combines driving supervision with general-purpose vision-language data to acquire driving-specific competence while helping preserve broad visual understanding and instruction-following capabilities. Experiments demonstrate strong 3D perception and driving scene understanding while largely preserving general vision-language capability. Comprehensive evaluations across open-loop, pseudo-closed-loop, and closed-loop settings further show highly competitive motion-planning performance.", "arxiv_id": "2609.00111", "arxiv_url": "https://arxiv.org/abs/2609.00111", "authors": ["Xin Zhou", "Zongchuang Zhao", "Zhibo Yang", "Mingsheng Li", "Humen Zhong", "Shuai Bai", "Du Chu", "Ruizhe Chen", "Zhaohai Li", "Jun Tang", "Qiuyue Wang", "Mingkun Yang", "Jiazhao Zhang", "Dayiheng Liu", "Dingkang Liang", "Xiang Bai"], "brief": "\u8bba\u6587\u63d0\u51fa Qwen-Drive-1.0\uff0c\u5728\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u67b6\u6784\u4e0a\u7edf\u4e00\u6574\u5408 3D \u611f\u77e5\u3001\u9a7e\u9a76\u573a\u666f\u95ee\u7b54\u4e0e\u8fd0\u52a8\u89c4\u5212\u3002\u6a21\u578b\u901a\u8fc7 BEV \u611f\u77e5\u5934\u663e\u5f0f\u5efa\u6a21\u4e09\u7ef4\u573a\u666f\uff0c\u5e76\u7528 Planning Expert \u751f\u6210\u672a\u6765\u81ea\u8f66\u8f68\u8ff9\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00111", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5916\u63a5 BEV \u611f\u77e5\u5934\u540c\u65f6\u5b8c\u6210 3D \u76ee\u6807\u68c0\u6d4b\u3001\u8bed\u4e49\u5360\u7528\u9884\u6d4b\u548c BEV \u5730\u56fe\u5206\u5272\uff0c\u63d0\u4f9b\u53ef\u68c0\u67e5\u7684\u4e09\u7ef4\u573a\u666f\u63a5\u53e3", "Planning Expert \u57fa\u4e8e\u5171\u4eab VLM \u8868\u5f81\u751f\u6210\u672a\u6765\u81ea\u8f66\u8f68\u8ff9\uff0c\u5b9e\u73b0\u611f\u77e5\u3001\u7406\u89e3\u4e0e\u89c4\u5212\u7684\u7edf\u4e00", "\u5206\u9636\u6bb5\u8bad\u7ec3\u7ed3\u5408\u9a7e\u9a76\u76d1\u7763\u6570\u636e\u4e0e\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6570\u636e\uff0c\u5728\u83b7\u5f97\u9a7e\u9a76\u80fd\u529b\u7684\u540c\u65f6\u5c3d\u91cf\u4fdd\u7559\u901a\u7528\u89c6\u89c9\u7406\u89e3\u548c\u6307\u4ee4\u8ddf\u968f\u80fd\u529b"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "3D\u611f\u77e5", "\u8fd0\u52a8\u89c4\u5212"], "num_comments": 0, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2609.00111v1", "published_at": "2026-08-31", "score": 0.466, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00111.png", "title": "Qwen-Drive-1.0: An Initial Step towards a Vision-Language Foundation Model for Autonomous Driving", "tldr": "Qwen\u63a8\u51fa\u81ea\u52a8\u9a7e\u9a76\u89c6\u89c9\u8bed\u8a00\u57fa\u7840\u6a21\u578b", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Qwen-Drive-1.0\uff0c\u5728\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u67b6\u6784\u4e0a\u7edf\u4e00\u6574\u5408 3D \u611f\u77e5\u3001\u9a7e\u9a76\u573a\u666f\u95ee\u7b54\u4e0e\u8fd0\u52a8\u89c4\u5212\u3002\u6a21\u578b\u901a\u8fc7 BEV \u611f\u77e5\u5934\u663e\u5f0f\u5efa\u6a21\u4e09\u7ef4\u573a\u666f\uff0c\u5e76\u7528 Planning Expert \u751f\u6210\u672a\u6765\u81ea\u8f66\u8f68\u8ff9\u3002", "why_notable": "\u8fd9\u662f\u5c06\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u57fa\u7840\u6a21\u578b\u6269\u5c55\u5230\u81ea\u52a8\u9a7e\u9a76\u5168\u6808\u4efb\u52a1\u7684\u91cd\u8981\u5c1d\u8bd5\uff0c\u517c\u987e 3D \u611f\u77e5\u3001\u573a\u666f\u7406\u89e3\u4e0e\u8fd0\u52a8\u89c4\u5212\uff0c\u5e76\u5728\u5f00\u653e\u73af\u3001\u4f2a\u95ed\u73af\u548c\u95ed\u73af\u8bc4\u6d4b\u4e2d\u5c55\u73b0\u51fa\u6709\u7ade\u4e89\u529b\u7684\u89c4\u5212\u6027\u80fd\u3002"}, {"abstract": "Recent advances in large reasoning models (LRMs) have shown that reinforcement learning with verifiable rewards (RLVR) can substantially improve reasoning in mathematics and code, where outcomes can be checked automatically. Extending this progress to open-ended and agentic tasks remains difficult because reliable rewards are harder to obtain and direct human supervision cannot keep pace with the scale and complexity of model-generated experience. This paper studies how LRMs can continue to improve as human supervision gradually recedes from the learning loop. We examine two connected dimensions of this problem. The reward axis traces the development from per-instance human judgments to reusable verifiers and rewards that operate even without human feedback. The experience axis examines how learning can progress from human-curated tasks and environments toward self-generated curricula, constructed environments, and autonomous co-evolution. We connect these dimensions through a five-level ladder from L0 to L4 that identifies which parts of the learning process remain under continued human control. Our analysis further highlights the risks introduced by increasingly autonomous rewards and experience generation, including reward hacking, feedback drift, curriculum collapse, and environment errors. Consequently, we also provide the evaluation around three complementary objects: policy capability, feedback fidelity, and experience quality. This analysis provides a structured account of current approaches to scaling LRMs beyond human supervision and the open problems involved in developing self-sustaining learning systems toward superintelligence. Furthermore, we maintain a continuously updated \\href{https://github.com/visitworld123/Awesome-Scaling-LRM-Beyond-Human-Supervision}{GitHub repository} to track the latest advances.", "arxiv_id": "2608.31075", "arxiv_url": "https://arxiv.org/abs/2608.31075", "authors": ["Zhiqin Yang", "Jingwen Fu", "Yuhan Liu", "Hengyu Liu", "Yonggang Zhang", "Kainan Cao", "Zizhuo Zhang", "Chenxin Li", "Ruibin Yuan", "Jiahao Pan", "Jiankai Sun", "Zhenyuan Zhang", "Yibo Li", "Yunlong Lin", "Jing Xiong", "Sida Lin", "Bo Han", "Wei Xue", "Yike Guo"], "brief": "\u672c\u6587\u7cfb\u7edf\u5206\u6790\u5927\u578b\u63a8\u7406\u6a21\u578b\u5982\u4f55\u5728\u4eba\u5de5\u76d1\u7763\u9010\u6b65\u51cf\u5c11\u7684\u60c5\u51b5\u4e0b\u7ee7\u7eed\u63d0\u5347\u80fd\u529b\uff0c\u5c24\u5176\u5173\u6ce8\u4ece\u53ef\u9a8c\u8bc1\u5956\u52b1\u5230\u81ea\u4e3b\u5956\u52b1\u3001\u4ece\u4eba\u5de5\u4efb\u52a1\u5230\u81ea\u751f\u6210\u7ecf\u9a8c\u7684\u6f14\u8fdb\u3002\u8bba\u6587\u63d0\u51faL0\u5230L4\u4e94\u7ea7\u6846\u67b6\uff0c\u523b\u753b\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u4eba\u7c7b\u63a7\u5236\u9010\u6b65\u9000\u573a\u7684\u4e0d\u540c\u9636\u6bb5\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/visitworld123/Awesome-Scaling-LRM-Beyond-Human-Supervision", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2608.31075", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6cbf\u201c\u5956\u52b1\u8f74\u201d\u68b3\u7406\u4ece\u9010\u4f8b\u4eba\u5de5\u5224\u65ad\uff0c\u5230\u53ef\u590d\u7528\u9a8c\u8bc1\u5668\uff0c\u518d\u5230\u65e0\u9700\u4eba\u5de5\u53cd\u9988\u7684\u81ea\u4e3b\u5956\u52b1\u673a\u5236\u30 8fd9\u662f\u4e00\u7bc7\u9762\u5411\u201c\u8d85\u8d8a\u4eba\u7c7b\u76d1\u7763\u201d\u8bad\u7ec3\u5927\u578b\u63a8\u7406\u6a21\u578b\u7684\u6846\u67b6\u6027\u7efc\u8ff0\uff0c\u8bd5\u56fe\u628aRLVR\u3001\u81ea\u751f\u6210\u8bfe\u7a0b\u3001\u9a8c\u8bc1\u5668\u548c\u81ea\u4e3b\u667a\u80fd\u4f53\u5b66\u4e60\u7edf\u4e00\u5230\u4e00\u4e2a\u5206\u7ea7\u8def\u7ebf\u56fe\u4e2d\uff0c\u5bf9\u7406\u89e3\u901a\u5411\u81ea\u6211\u6301\u7eed\u5b66\u4e60\u7cfb\u7edf\u548c\u8d85\u7ea7\u667a\u80fd\u7684\u6280\u672f\u6311\u6218\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Robotic manipulation faces a fundamental scaling challenge: robust generalization demands broad physical experience, yet action-labeled robot trajectories are expensive to collect and inherently limited in diversity. Egocentric videos offer a far more scalable source of embodied experience, capturing object interactions, contact dynamics, tool use, and long-horizon behaviors across diverse environments. The central challenge is how to convert this abundant but action-free experience into effective robot control. We introduce ZimaBlue, a scalable framework for learning generalizable World Action Models (WAMs) from large-scale video. ZimaBlue follows a three-stage training curriculum: it first performs causal embodied video pre-training on large-scale human and robot egocentric videos, then grounds the learned visual dynamics in heterogeneous robot trajectories through video-action mid-training with a unified action representation, and finally specializes the model to a target robot for deployment. To make generative WAMs practical for real-time control, ZimaBluefurther adopts an asynchronous Slow-Fast dual-system architecture, where a high-capacity Slow world model provides generalizable spatiotemporal representations and a lightweight Fast branch enables 30 Hz action prediction on NVIDIA RTX 4090. On real-robot zero-shot evaluations, scaling from target-robot data alone to over 120,000 hours of embodied video improves success from 36.1% to 77.8%. ZimaBlue further delivers strong performance across multiple benchmarks, with particularly pronounced gains on unseen tasks.", "arxiv_id": "2609.00188", "arxiv_url": "https://arxiv.org/abs/2609.00188", "authors": ["Xionghao Wu", "Yijun Yang", "Shiyang Zhou", "Haoze Sun", "Jianhui Liu", "Songsong Yu", "Jiyao Zhang", "Wenbo Li", "Bo Wang", "Guoqing Ma", "Lin Song", "Renjie Liao", "Shenghe Zheng", "Wei Tang", "Xiaojuan Qi", "Yanwei Li", "Yuan Zhang", "Zhuotao Tian", "Haoyang Huang", "Nan Duan"], "brief": "ZimaBlue \u63d0\u51fa\u4e00\u79cd\u4ece\u5927\u89c4\u6a21\u65e0\u52a8\u4f5c\u6807\u6ce8\u7684\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e2d\u5b66\u4e60 World Action Models \u7684\u673a\u5668\u4eba\u63a7\u5236\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u89c6\u9891\u9884\u8bad\u7ec3\u3001\u89c6\u9891-\u52a8\u4f5c\u5bf9\u9f50\u4e2d\u8bad\u7ec3\u548c\u76ee\u6807\u673a\u5668\u4eba\u4e13\u95e8\u5316\uff0c\u4f7f\u6a21\u578b\u80fd\u5728\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u66f4\u597d\u96f6\u6837\u672c\u6cdb\u5316\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ZimaBlue-WAM/ZimaBlue", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00188", "impact_score": 9, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u4e09\u9636\u6bb5\u8bad\u7ec3\uff1a\u56e0\u679c\u5177\u8eab\u89c6\u9891\u9884\u8bad\u7ec3\u3001\u5f02\u6784\u673a\u5668\u4eba\u8f68\u8ff9\u7684\u89c6\u9891-\u52a8\u4f5c\u4e2d\u8bad\u7ec3\u3001\u76ee\u6807\u673a\u5668\u4eba\u90e8\u7f72\u5fae\u8c03/\u4e13\u95e8\u5316\u3002", "\u7528\u7edf\u4e00\u52a8\u4f5c\u8868\u793a\u5bf9\u9f50\u4e0d\u540c\u673a\u5668\u4eba\u6570\u636e\uff0c\u5c06\u65e0\u52a8\u4f5c\u89c6\u9891\u4e2d\u7684\u7269\u7406\u4ea4\u4e92\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u63a7\u5236\u80fd\u529b\u3002", "\u5f15\u5165\u5f02\u6b65 Slow-Fast \u53cc\u7cfb\u7edf\uff1a\u9ad8\u5bb9\u91cf\u6162\u901f\u4e16\u754c\u6a21\u578b\u5b66\u4e60\u65f6\u7a7a\u8868\u5f81\uff0c\u8f7b\u91cf\u5feb\u901f\u5206\u652f\u5728 RTX 4090 \u4e0a\u5b9e\u73b0 30Hz \u52a8\u4f5c\u9884\u6d4b\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u9884\u8bad\u7ec3", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Joy Future Academy", "pdf_url": "https://arxiv.org/pdf/2609.00188v1", "published_at": "2026-08-31", "score": 0.434, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00188.png", "title": "ZimaBlue: Evolving Generalizable World Action Models through Scalable Video Pre-training", "tldr": "\u7528\u6d77\u91cf\u5177\u8eab\u89c6\u9891\u9884\u8bad\u7ec3\u6cdb\u5316\u673a\u5668\u4eba\u52a8\u4f5c\u6a21\u578b", "upvotes": 7, "what_it_is": "ZimaBlue \u63d0\u51fa\u4e00\u79cd\u4ece\u5927\u89c4\u6a21\u65e0\u52a8\u4f5c\u6807\u6ce8\u7684\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u4e2d\u5b66\u4e60 World Action Models \u7684\u673a\u5668\u4eba\u63a7\u5236\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u89c6\u9891\u9884\u8bad\u7ec3\u3001\u89c6\u9891-\u52a8\u4f5c\u5bf9\u9f50\u4e2d\u8bad\u7ec3\u548c\u76ee\u6807\u673a\u5668\u4eba\u4e13\u95e8\u5316\uff0c\u4f7f\u6a21\u578b\u80fd\u5728\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u66f4\u597d\u96f6\u6837\u672c\u6cdb\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5927\u89c4\u6a21\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u7b2c\u4e00\u89c6\u89d2\u89c6\u9891\u53ef\u663e\u8457\u63d0\u5347\u673a\u5668\u4eba\u64cd\u4f5c\u6cdb\u5316\u80fd\u529b\uff1a\u4ece\u4ec5\u7528\u76ee\u6807\u673a\u5668\u4eba\u6570\u636e\u5230\u52a0\u5165 12 \u4e07\u5c0f\u65f6\u5177\u8eab\u89c6\u9891\uff0c\u771f\u5b9e\u673a\u5668\u4eba\u96f6\u6837\u672c\u6210\u529f\u7387\u7531 36.1% \u63d0\u5347\u5230 77.8%\uff0c\u5c24\u5176\u5728\u672a\u89c1\u4efb\u52a1\u4e0a\u6536\u76ca\u660e\u663e\u3002"}, {"abstract": "Training open-ended agents via reinforcement learning (RL) is hindered by the lack of verifiable gold answers and scalable rubrics. Moreover, even near the model\u0027s capability boundary, long-horizon open-ended agentic tasks often yield brittle and unstable rewards, resulting in weak or noisy rollout contrast that obscures fine-grained optimization signals for group-based policy learning. To address these challenges, we propose ARISE-RL, a novel full-cycle self-evolution framework that couples a task/rubric Generator and a reasoning Solver through rubric-mediated co-evolution. The Generator grounds tool-related rubric criteria in real tool observations and is rewarded for producing valid, intermediate-difficulty tasks aligned with the Solver\u0027s evolving capability boundary. The Solver, in turn, learns from fine-grained rubric satisfaction signals through multi-step reasoning and tool use. We further introduce Reward-Gated Self-Evolution Distillation (RG-SED), which selectively distills a memory-augmented variant of the same policy back into itself only when the memory yields empirical reward improvement, thereby reducing distribution mismatch and avoiding blind imitation of noisy guidance. Finally, to support rigorous evaluation, we present ECR-Bench, an expert-calibrated rubric benchmark suite covering single-tool deep research and multi-tool travel planning. Extensive experiments demonstrate that ARISE-RL consistently achieves robust and stable overall state-of-the-art performance across all evaluated benchmarks.", "arxiv_id": "2609.01058", "arxiv_url": "https://arxiv.org/abs/2609.01058", "authors": ["Fanrui Zhang", "Ruixue Ding", "Qiang Zhang", "Xi Chen", "Boli Chen", "Shihang Wang", "Qiuchen Wang", "Hongmin Zhan", "Jinxin Bian", "Li xingchao", "Peijin Zheng", "Hao cheng", "Pengjun Xie", "Kaipeng Zhang", "Jiawei Liu", "Zheng-Jun Zha"], "brief": "\u8bba\u6587\u63d0\u51fa ARISE-RL\uff0c\u4e00\u4e2a\u8ba9\u4efb\u52a1/\u8bc4\u5206\u89c4\u7ea6\u751f\u6210\u5668\u4e0e\u63a8\u7406\u6c42\u89e3\u5668\u5171\u540c\u8fdb\u5316\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u8bad\u7ec3\u7f3a\u4e4f\u6807\u51c6\u7b54\u6848\u7684\u5f00\u653e\u5f0f\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u3002\u5b83\u8fd8\u63d0\u51fa RG-SED \u81ea\u84b8\u998f\u673a\u5236\uff0c\u5e76\u6784\u5efa ECR-Bench \u7528\u4e8e\u4e13\u5bb6\u6821\u51c6\u8bc4\u6d4b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01058", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u751f\u6210\u5668\u57fa\u4e8e\u771f\u5b9e\u5de5\u5177\u89c2\u6d4b\u751f\u6210\u4efb\u52a1\u4e0e\u7ec6\u7c92\u5ea6\u8bc4\u5206\u89c4\u7ea6\uff0c\u5e76\u88ab\u5956\u52b1\u53bb\u8d34\u8fd1\u6c42\u89e3\u5668\u80fd\u529b\u8fb9\u754c\u7684\u4e2d\u7b49\u96be\u5ea6\u4efb\u52a1", "\u6c42\u89e3\u5668\u901a\u8fc7\u591a\u6b65\u63a8\u7406\u548c\u5de5\u5177\u8c03\u7528\uff0c\u4ece\u89c4\u7ea6\u6ee1\u8db3\u5ea6\u4e2d\u83b7\u5f97\u66f4\u7a33\u5b9a\u3001\u7ec6\u7c92\u5ea6\u7684\u5f3a\u5316\u5b66\u4e60\u4fe1\u53f7", "RG-SED \u4ec5\u5728\u8bb0\u5fc6\u589e\u5f3a\u7b56\u7565\u5e26\u6765\u5b9e\u8bc1\u5956\u52b1\u63d0\u5347\u65f6\u8fdb\u884c\u81ea\u84b8\u998f\uff0c\u51cf\u5c11\u5206\u5e03\u9519\u914d\u548c\u566a\u58f0\u6a21\u4eff"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528", "\u81ea\u8fdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01058v1", "published_at": "2026-09-01", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ARISE-RL: Agentic Rubric-Grounded Iterative Self-Evolution with Reinforcement Learning", "tldr": "\u7528\u81ea\u751f\u6210\u8bc4\u5206\u89c4\u7ea6\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5f00\u653e\u5f0f\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ARISE-RL\uff0c\u4e00\u4e2a\u8ba9\u4efb\u52a1/\u8bc4\u5206\u89c4\u7ea6\u751f\u6210\u5668\u4e0e\u63a8\u7406\u6c42\u89e3\u5668\u5171\u540c\u8fdb\u5316\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u8bad\u7ec3\u7f3a\u4e4f\u6807\u51c6\u7b54\u6848\u7684\u5f00\u653e\u5f0f\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u3002\u5b83\u8fd8\u63d0\u51fa RG-SED \u81ea\u84b8\u998f\u673a\u5236\uff0c\u5e76\u6784\u5efa ECR-Bench \u7528\u4e8e\u4e13\u5bb6\u6821\u51c6\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5f00\u653e\u5f0f\u957f\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u201c\u65e0\u91d1\u6807\u51c6\u7b54\u6848\u3001\u5956\u52b1\u7a00\u758f\u4e14\u4e0d\u7a33\u5b9a\u201d\u7684\u6838\u5fc3\u96be\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u7684\u89c4\u7ea6\u751f\u6210\u4e0e\u81ea\u8fdb\u5316\u8bad\u7ec3\u95ed\u73af\uff0c\u5e76\u5728\u6df1\u5ea6\u7814\u7a76\u548c\u65c5\u884c\u89c4\u5212\u7b49\u5de5\u5177\u4efb\u52a1\u4e0a\u62a5\u544a\u4e86\u7a33\u5b9a\u7684\u9886\u5148\u8868\u73b0\u3002"}, {"abstract": "Image retrieval has traditionally been formulated as a point-wise matching problem, where each candidate image is scored in isolation. However, this atomic paradigm fails to capture the complexity of human search intent within personal photo collections, where users often seek compact visual stories bound by structural relations rather than isolated snapshots. To address this limitation, we introduce **Image Bundle Composition (IBC)**, a novel paradigm that shifts the objective from ranking individual images to dynamically composing cohesive image bundles from a massive, unstructured photo pool. Since target bundles are not predefined, IBC presents a severe combinatorial explosion challenge and demands modeling non-decomposable joint relevance. To establish this paradigm, we construct **IBCBench**, the first IBC benchmark dataset containing 109,467 images and 667 verified queries, built via a semi-automated verification pipeline. Furthermore, we propose **BundleWeaver**, an agentic framework that reformulates IBC as query-conditioned incremental hyperedge discovery. By employing a Large Language Model to adaptively search for missing relational roles and utilizing a Vision-Language Model for whole-bundle verification, BundleWeaver effectively navigates the combinatorial space. Extensive experiments demonstrate that while state-of-the-art embedding models and static decompose-and-rerank paradigms suffer from relational blindness, BundleWeaver achieves substantial performance gains, highlighting the necessity of shifting from atomic scoring to dynamic relational composition. Our dataset and code are available.", "arxiv_id": "2608.28695", "arxiv_url": "https://arxiv.org/abs/2608.28695", "authors": ["Rong Shan", "Tianyi Xu", "Congmin Zheng", "Wenteng Chen", "Jiachen Zhu", "Junjie Wu", "Teng Wang", "Weiwen Liu", "Changwang Zhang", "Weinan Zhang", "Jun Wang", "Jianghao Lin"], "brief": "\u8bba\u6587\u63d0\u51fa Image Bundle Composition\uff08IBC\uff09\u65b0\u8303\u5f0f\uff0c\u5c06\u56fe\u50cf\u68c0\u7d22\u76ee\u6807\u4ece\u5355\u5f20\u56fe\u7247\u6392\u5e8f\u8f6c\u4e3a\u4ece\u6d77\u91cf\u4e2a\u4eba\u7167\u7247\u4e2d\u52a8\u6001\u7ec4\u5408\u5177\u6709\u7ed3\u6784\u5173\u7cfb\u7684\u56fe\u50cf\u675f\u3002\u4f5c\u8005\u6784\u5efa\u9996\u4e2a IBCBench \u57fa\u51c6\uff0c\u5e76\u63d0\u51fa agentic \u6846\u67b6 BundleWeaver \u8fdb\u884c\u5173\u7cfb\u89d2\u8272\u641c\u7d22\u4e0e\u6574\u7ec4\u9a8c\u8bc1\u3002", "categories": ["cs.CV", "cs.IR"], "github_repo": "https://github.com/LaVieEnRose365/Image-Bundle-Composition", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.28695", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["IBCBench \u5305\u542b 109,467 \u5f20\u56fe\u50cf\u548c 667 \u4e2a\u7ecf\u9a8c\u8bc1\u67e5\u8be2\uff0c\u7528\u4e8e\u8bc4\u6d4b\u975e\u9884\u5b9a\u4e49\u56fe\u50cf\u675f\u7ec4\u5408\u80fd\u529b", "BundleWeaver \u5c06 IBC \u5efa\u6a21\u4e3a\u67e5\u8be2\u6761\u4ef6\u4e0b\u7684\u589e\u91cf\u8d85\u8fb9\u53d1\u73b0\uff0c\u7528 LLM \u81ea\u9002\u5e94\u5bfb\u627e\u7f3a\u5931\u5173\u7cfb\u89d2\u8272", "\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u6574\u7ec4\u56fe\u50cf\u9a8c\u8bc1\uff0c\u663e\u8457\u4f18\u4e8e\u5d4c\u5165\u6a21\u578b\u548c\u9759\u6001\u5206\u89e3\u91cd\u6392\u65b9\u6cd5"], "keywords": ["\u56fe\u50cf\u68c0\u7d22", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2608.28695v1", "published_at": "2026-08-27", "score": 0.417, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28695.png", "title": "Weaving Visual Narratives: Agentic Image Bundle Composition Beyond Atomic Visual Matching", "tldr": "\u4ece\u5355\u56fe\u68c0\u7d22\u8f6c\u5411\u6545\u4e8b\u5316\u56fe\u50cf\u7ec4\u5408\u68c0\u7d22", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa Image Bundle Composition\uff08IBC\uff09\u65b0\u8303\u5f0f\uff0c\u5c06\u56fe\u50cf\u68c0\u7d22\u76ee\u6807\u4ece\u5355\u5f20\u56fe\u7247\u6392\u5e8f\u8f6c\u4e3a\u4ece\u6d77\u91cf\u4e2a\u4eba\u7167\u7247\u4e2d\u52a8\u6001\u7ec4\u5408\u5177\u6709\u7ed3\u6784\u5173\u7cfb\u7684\u56fe\u50cf\u675f\u3002\u4f5c\u8005\u6784\u5efa\u9996\u4e2a IBCBench \u57fa\u51c6\uff0c\u5e76\u63d0\u51fa agentic \u6846\u67b6 BundleWeaver \u8fdb\u884c\u5173\u7cfb\u89d2\u8272\u641c\u7d22\u4e0e\u6574\u7ec4\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u4f20\u7edf\u70b9\u5f0f\u56fe\u50cf\u68c0\u7d22\u5b58\u5728\u201c\u5173\u7cfb\u76f2\u533a\u201d\uff0c\u628a\u68c0\u7d22\u6269\u5c55\u5230\u7b26\u5408\u4eba\u7c7b\u53d9\u4e8b\u610f\u56fe\u7684\u591a\u56fe\u7ec4\u5408\uff0c\u5177\u6709\u9762\u5411\u4e2a\u4eba\u76f8\u518c\u3001\u89c6\u89c9\u6545\u4e8b\u68c0\u7d22\u548c\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5e94\u7528\u7684\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "GUI world models are increasingly evaluated as one-step next-screen predictors, yet their intended use is often as multi-step environments for GUI agents. This mismatch leaves a key requirement under-tested: generated states must remain contextually consistent when they are repeatedly reused for future interaction. We introduce GUI-CC, a benchmark that evaluates contextual consistency of GUI world models as agent environments rather than isolated next-screen predictors. GUI-CC contains two complementary tracks: an offline reference-action track that rolls models along real mobile GUI trajectories, and an online agent-loop track that lets fixed probing agents interact with model-generated UIs. We construct 500 offline trajectory tasks from GUIOdyssey and 200 emulator-verified online tasks across 30 mobile apps. GUI-CC evaluates transition fidelity, transition plausibility, contextual consistency, and task progress. Experiments show that plausible single-step generation does not guarantee reliable environment simulation: current models often produce usable-looking screens while failing to preserve task-relevant context or support executable multi-step rollouts.", "arxiv_id": "2609.00048", "arxiv_url": "https://arxiv.org/abs/2609.00048", "authors": ["Lin Fu", "Zheyuan Yang", "Tianhui Zhang", "Jinbiao Wei", "Guo Gan", "Boxu Liu", "Yilun Zhao", "Yu Rong"], "brief": "\u8bba\u6587\u63d0\u51fa GUI-CC \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 GUI \u4e16\u754c\u6a21\u578b\u4f5c\u4e3a\u667a\u80fd\u4f53\u73af\u5883\u65f6\u7684\u4e0a\u4e0b\u6587\u4e00\u81f4\u6027\uff0c\u800c\u4e0d\u53ea\u662f\u5355\u6b65\u4e0b\u4e00\u5c4f\u9884\u6d4b\u3002\u57fa\u51c6\u5305\u542b\u79bb\u7ebf\u771f\u5b9e\u8f68\u8ff9\u56de\u653e\u4e0e\u5728\u7ebf\u667a\u80fd\u4f53\u4ea4\u4e92\u4e24\u6761\u8bc4\u6d4b\u8f68\u9053\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/Fu-Fu-Fu-Fu/GUI-CC", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.00048", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u4e86\u6765\u81ea GUIOdyssey \u7684 500 \u4e2a\u79bb\u7ebf\u8f68\u8ff9\u4efb\u52a1\uff0c\u4ee5\u53ca\u8986\u76d6 30 \u4e2a\u79fb\u52a8\u5e94\u7528\u7684 200 \u4e2a\u7ecf\u6a21\u62df\u5668\u9a8c\u8bc1\u7684\u5728\u7ebf\u4efb\u52a1", "\u8bc4\u4f30\u7ef4\u5ea6\u5305\u62ec\u8f6c\u79fb\u4fdd\u771f\u5ea6\u3001\u8f6c\u79fb\u5408\u7406\u6027\u3001\u4e0a\u4e0b\u6587\u4e00\u81f4\u6027\u548c\u4efb\u52a1\u8fdb\u5c55", "\u5b9e\u9a8c\u53d1\u73b0\u5f53\u524d\u6a21\u578b\u5373\u4f7f\u80fd\u751f\u6210\u770b\u4f3c\u53ef\u7528\u7684\u5355\u6b65\u754c\u9762\uff0c\u4e5f\u5e38\u65e0\u6cd5\u4fdd\u6301\u4efb\u52a1\u76f8\u5173\u4e0a\u4e0b\u6587\u5e76\u652f\u6301\u53ef\u9760\u591a\u6b65\u5c55\u5f00"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u4e16\u754c\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00048v1", "published_at": "2026-08-30", "score": 0.415, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00048.png", "title": "GUI-CC: Benchmarking Contextual Consistency of GUI World Models as Agent Environments", "tldr": "\u8bc4\u6d4bGUI\u4e16\u754c\u6a21\u578b\u591a\u6b65\u4ea4\u4e92\u4e00\u81f4\u6027", "upvotes": 7, "what_it_is": "\u8bba\u6587\u63d0\u51fa GUI-CC \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 GUI \u4e16\u754c\u6a21\u578b\u4f5c\u4e3a\u667a\u80fd\u4f53\u73af\u5883\u65f6\u7684\u4e0a\u4e0b\u6587\u4e00\u81f4\u6027\uff0c\u800c\u4e0d\u53ea\u662f\u5355\u6b65\u4e0b\u4e00\u5c4f\u9884\u6d4b\u3002\u57fa\u51c6\u5305\u542b\u79bb\u7ebf\u771f\u5b9e\u8f68\u8ff9\u56de\u653e\u4e0e\u5728\u7ebf\u667a\u80fd\u4f53\u4ea4\u4e92\u4e24\u6761\u8bc4\u6d4b\u8f68\u9053\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa GUI \u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u4e2d\u7684\u5173\u952e\u9519\u4f4d\uff1a\u5355\u6b65\u751f\u6210\u8d28\u91cf\u4e0d\u8db3\u4ee5\u4ee3\u8868\u5176\u4f5c\u4e3a\u667a\u80fd\u4f53\u8bad\u7ec3\u6216\u6d4b\u8bd5\u73af\u5883\u7684\u53ef\u9760\u6027\u3002GUI-CC \u4e3a\u8bc4\u4f30\u53ef\u4ea4\u4e92\u3001\u591a\u6b65\u3001\u4efb\u52a1\u4e00\u81f4\u7684 GUI \u6a21\u62df\u73af\u5883\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u9645\u5e94\u7528\u7684\u6807\u51c6\u3002"}, {"abstract": "Long-horizon physical-world agents must reason over distant goals while grounding decisions in reliable closed-loop behavior. Today\u0027s foundation models split these capabilities: vision-language models (VLMs) infer missing information and adapt high-level plans but remain brittle and inefficient at repeated navigation grounding, while navigation foundation models (NFMs) robustly execute semantic goals but operate as bounded episodes without persistent task-level reasoning. We introduce NavMCP, an agentic scaffolding framework that couples a VLM reasoning agent with an NFM executor for long-horizon exploration. The VLM decides what evidence to seek, where to search, and when to stop, while the NFM grounds each semantic sub-goal into closed-loop navigation. Three channels structure their collaboration: intent translates evidence needs into navigation calls, observation converts rollouts into source-grounded trajectory evidence, and memory accumulates findings, negative evidence, and unresolved goals across calls. This design turns isolated navigation rollouts into persistent embodied interaction without retraining either model. On Embodied Question Answering, NavMCP achieves state-of-the-art results on HM-EQA, MT-HM3D, and EXPRESS-Bench. Under matched agent and executor backbones, it outperforms an episodic interface by 14.9 percentage points on HM-EQA. On a Unitree Go2, NavMCP reaches 78.3% success, with its margin over the strongest baseline growing from 10 to 45 points as the task horizon increases. These results demonstrate the potential of scaffolding complementary foundation models into long-horizon physical-world agents.", "arxiv_id": "2608.30396", "arxiv_url": "https://arxiv.org/abs/2608.30396", "authors": ["Zixing Lei", "Gengze Zhou", "Xiong-Hui Chen", "Jiazhao Zhang", "Yiyang Huang", "Hang Yin", "Haoqi Yuan", "Qi Wu", "Weixin Li", "Siheng Chen"], "brief": "\u8bba\u6587\u63d0\u51fa NavMCP\uff0c\u4e00\u79cd\u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u667a\u80fd\u4f53\u4e0e\u5bfc\u822a\u57fa\u7840\u6a21\u578b\u6267\u884c\u5668\u8026\u5408\u7684\u811a\u624b\u67b6\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u610f\u56fe\u3001\u89c2\u5bdf\u3001\u8bb0\u5fc6\u4e09\u7c7b\u534f\u4f5c\u901a\u9053\uff0c\u628a\u4e00\u6b21\u6027\u5bfc\u822a\u6267\u884c\u6269\u5c55\u4e3a\u53ef\u6301\u7eed\u63a8\u7406\u3001\u63a2\u7d22\u548c\u95ed\u73af\u884c\u52a8\u7684\u957f\u7a0b\u7269\u7406\u4e16\u754c\u667a\u80fd\u4f53\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30396", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["VLM \u8d1f\u8d23\u4efb\u52a1\u7ea7\u63a8\u7406\uff1a\u51b3\u5b9a\u9700\u8981\u5bfb\u627e\u4ec0\u4e48\u8bc1\u636e\u3001\u53bb\u54ea\u91cc\u641c\u7d22\u4ee5\u53ca\u4f55\u65f6\u505c\u6b62\uff1bNFM \u8d1f\u8d23\u5c06\u8bed\u4e49\u5b50\u76ee\u6807\u843d\u5730\u4e3a\u53ef\u9760\u7684\u95ed\u73af\u5bfc\u822a\u3002", "\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u4efb\u4e00\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7 intent\u3001observation\u3001memory \u4e09\u4e2a\u63a5\u53e3\u5b9e\u73b0\u8de8\u6a21\u578b\u534f\u4f5c\u4e0e\u6301\u7eed\u4efb\u52a1\u8bb0\u5fc6\u3002", "\u5728 HM-EQA\u3001MT-HM3D\u3001EXPRESS-Bench \u4e0a\u8fbe\u5230\u5177\u8eab\u95ee\u7b54 SOTA\uff1b\u5728 HM-EQA \u76f8\u6bd4 episodic \u63a5\u53e3\u63d0\u5347 14.9 \u4e2a\u767e\u5206\u70b9\uff0cUnitree Go2 \u5b9e\u673a\u6210\u529f\u7387\u8fbe 78.3%\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba\u5bfc\u822a"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30396v1", "published_at": "2026-08-31", "score": 0.405, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30396.png", "title": "Scaffolding Foundation Models into Physical-World Agents Pushes the Frontier of Long-Horizon Navigation", "tldr": "NavMCP\u5c06VLM\u4e0e\u5bfc\u822a\u6a21\u578b\u7ec4\u5408\u6210\u957f\u7a0b\u5177\u8eab\u667a\u80fd\u4f53", "upvotes": 6, "what_it_is": "\u8bba\u6587\u63d0\u51fa NavMCP\uff0c\u4e00\u79cd\u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u667a\u80fd\u4f53\u4e0e\u5bfc\u822a\u57fa\u7840\u6a21\u578b\u6267\u884c\u5668\u8026\u5408\u7684\u811a\u624b\u67b6\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u610f\u56fe\u3001\u89c2\u5bdf\u3001\u8bb0\u5fc6\u4e09\u7c7b\u534f\u4f5c\u901a\u9053\uff0c\u628a\u4e00\u6b21\u6027\u5bfc\u822a\u6267\u884c\u6269\u5c55\u4e3a\u53ef\u6301\u7eed\u63a8\u7406\u3001\u63a2\u7d22\u548c\u95ed\u73af\u884c\u52a8\u7684\u957f\u7a0b\u7269\u7406\u4e16\u754c\u667a\u80fd\u4f53\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u901a\u8fc7\u811a\u624b\u67b6\u7ec4\u5408\u4e92\u8865\u57fa\u7840\u6a21\u578b\uff0c\u53ef\u4ee5\u663e\u8457\u63d0\u5347\u957f\u7a0b\u5177\u8eab\u5bfc\u822a\u4e0e\u95ee\u7b54\u80fd\u529b\uff0c\u5c24\u5176\u5728\u4efb\u52a1\u8de8\u5ea6\u53d8\u957f\u65f6\u4f18\u52bf\u6269\u5927\uff0c\u4e3a\u73b0\u5b9e\u673a\u5668\u4eba\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u5b9e\u7528\u7684\u7cfb\u7edf\u8303\u5f0f\u3002"}, {"abstract": "Recent advances in LLM agents enable a new paradigm for asset pricing, which we call Agentic Empirical Asset Pricing (AEAP): systems that autonomously conduct the scientific discovery process itself. We define AEAP and identify its core building blocks. Existing evaluation practices backtest only the outputs (factors or trades), not the autonomous discovery system that produced them. We focus on factor discovery, contributing a reference architecture, a rigorous evaluation standard for discovered factors, and a method for out-of-sample backtesting the discovery system. As a concrete instance of that architecture, we evaluate SEADS against five re-implemented baselines on two US equity panels using this standard: no single metric ranks the systems consistently, motivating evaluation on multiple axes at once. A separate rolling re-execution then asks the complementary question of whether the discovery process itself, not one static output, is reliable. We also report negative findings and limitations that surface further evaluation pitfalls for future AEAP systems.", "arxiv_id": "2609.00731", "arxiv_url": "https://arxiv.org/abs/2609.00731", "authors": ["Yingjian Pan", "Xiaowei Ding", "Kay Giesecke"], "brief": "\u8bba\u6587\u5b9a\u4e49\u4e86 Agentic Empirical Asset Pricing\uff08AEAP\uff09\uff1a\u8ba9 LLM \u667a\u80fd\u4f53\u81ea\u4e3b\u5b8c\u6210\u8d44\u4ea7\u5b9a\u4ef7\u4e2d\u7684\u79d1\u5b66\u53d1\u73b0\u6d41\u7a0b\u3002\u4f5c\u8005\u805a\u7126\u56e0\u5b50\u53d1\u73b0\uff0c\u7ed9\u51fa\u53c2\u8003\u67b6\u6784\u3001\u56e0\u5b50\u8bc4\u6d4b\u6807\u51c6\uff0c\u4ee5\u53ca\u5bf9\u201c\u53d1\u73b0\u7cfb\u7edf\u201d\u672c\u8eab\u8fdb\u884c\u6837\u672c\u5916\u56de\u6d4b\u7684\u65b9\u6cd5\u3002", "categories": ["cs.AI", "cs.LG", "q-fin.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00731", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u73b0\u6709\u505a\u6cd5\u591a\u53ea\u56de\u6d4b\u6700\u7ec8\u56e0\u5b50\u6216\u4ea4\u6613\u7ed3\u679c\uff0c\u7f3a\u5c11\u5bf9\u81ea\u4e3b\u53d1\u73b0\u7cfb\u7edf\u53ef\u9760\u6027\u7684\u8bc4\u4f30", "\u4ee5 SEADS \u4e3a\u5177\u4f53\u5b9e\u4f8b\uff0c\u5bf9\u6bd4\u4e94\u4e2a\u590d\u73b0\u57fa\u7ebf\uff0c\u5728\u4e24\u4e2a\u7f8e\u56fd\u80a1\u7968\u9762\u677f\u4e0a\u8fdb\u884c\u591a\u6307\u6807\u8bc4\u6d4b", "\u53d1\u73b0\u5355\u4e00\u6307\u6807\u65e0\u6cd5\u7a33\u5b9a\u6392\u5e8f\u7cfb\u7edf\uff0c\u9700\u540c\u65f6\u4ece\u591a\u4e2a\u7ef4\u5ea6\u8bc4\u4f30\uff0c\u5e76\u62a5\u544a\u8d1f\u9762\u7ed3\u679c\u4e0e\u8bc4\u6d4b\u9677\u9631"], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878dAI", "\u5b9e\u8bc1\u8d44\u4ea7\u5b9a\u4ef7", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00731v1", "published_at": "2026-09-01", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Agentic Empirical Asset Pricing: Methodological Foundations", "tldr": "\u63d0\u51fa\u667a\u80fd\u4f53\u5f0f\u5b9e\u8bc1\u8d44\u4ea7\u5b9a\u4ef7\u8bc4\u6d4b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5b9a\u4e49\u4e86 Agentic Empirical Asset Pricing\uff08AEAP\uff09\uff1a\u8ba9 LLM \u667a\u80fd\u4f53\u81ea\u4e3b\u5b8c\u6210\u8d44\u4ea7\u5b9a\u4ef7\u4e2d\u7684\u79d1\u5b66\u53d1\u73b0\u6d41\u7a0b\u3002\u4f5c\u8005\u805a\u7126\u56e0\u5b50\u53d1\u73b0\uff0c\u7ed9\u51fa\u53c2\u8003\u67b6\u6784\u3001\u56e0\u5b50\u8bc4\u6d4b\u6807\u51c6\uff0c\u4ee5\u53ca\u5bf9\u201c\u53d1\u73b0\u7cfb\u7edf\u201d\u672c\u8eab\u8fdb\u884c\u6837\u672c\u5916\u56de\u6d4b\u7684\u65b9\u6cd5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a LLM \u667a\u80fd\u4f53\u5f15\u5165\u91d1\u878d\u56e0\u5b50\u53d1\u73b0\u7684\u201c\u7814\u7a76\u8fc7\u7a0b\u81ea\u52a8\u5316\u201d\uff0c\u5e76\u5f3a\u8c03\u8bc4\u4f30\u5bf9\u8c61\u5e94\u4ece\u9759\u6001\u4ea7\u7269\u8f6c\u5411\u52a8\u6001\u53d1\u73b0\u7cfb\u7edf\uff0c\u5bf9\u91d1\u878d\u667a\u80fd\u4f53\u7684\u53ef\u4fe1\u8bc4\u6d4b\u5177\u6709\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Generating professional scholarly content, such as peer reviews and rebuttals, requires an intricate synergy between domain reasoning and factual grounding. This work presents a comprehensive framework for the development and evaluation of specialized scholarly agents, InternReviewer and InternAdvocate. We first establish a large-scale, high-quality scholarly dataset and integrate a high-efficiency arXiv retrieval tool to enable active evidence gathering. To optimize these agents, we implement an agentic Reinforcement Learning (RL) paradigm driven by a unified objective metric and reward system. This system avoids the biases of subjective model-based judging by employing multi-dimensional criteria, including reference-anchored semantic alignment, structural compliance, and a strict verification mechanism that cross-checks citations against real-time interaction logs to eliminate hallucinations. Experimental results demonstrate that agents trained within this closed-loop framework exhibit significant improvements in reasoning depth and citation accuracy.", "arxiv_id": "2608.28612", "arxiv_url": "https://arxiv.org/abs/2608.28612", "authors": ["Xuerui Su", "Liya Guo", "Qizhi Pei", "Qipeng Guo", "Zhongbo Tian", "Lijun Wu", "Kai Chen", "Zun Wang"], "brief": "\u8bba\u6587\u63d0\u51fa InternReviewer \u4e0e InternAdvocate \u4e24\u7c7b\u5b66\u672f\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u751f\u6210\u540c\u884c\u8bc4\u5ba1\u548c\u8bba\u6587\u53cd\u9a73\u3002\u6846\u67b6\u7ed3\u5408\u5927\u89c4\u6a21\u5b66\u672f\u6570\u636e\u3001arXiv \u68c0\u7d22\u5de5\u5177\u4e0e\u95ed\u73af agentic RL\uff0c\u901a\u8fc7\u5ba2\u89c2\u5956\u52b1\u4f18\u5316\u63a8\u7406\u6df1\u5ea6\u548c\u5f15\u7528\u51c6\u786e\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28612", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u9ad8\u8d28\u91cf\u5b66\u672f\u6570\u636e\u96c6\uff0c\u5e76\u63a5\u5165\u9ad8\u6548 arXiv \u68c0\u7d22\u5de5\u5177\uff0c\u4f7f\u667a\u80fd\u4f53\u80fd\u4e3b\u52a8\u6536\u96c6\u8bc1\u636e\u3002", "\u8bbe\u8ba1\u7edf\u4e00\u7684\u5ba2\u89c2\u8bc4\u4ef7\u4e0e\u5956\u52b1\u7cfb\u7edf\uff0c\u8986\u76d6\u53c2\u8003\u951a\u5b9a\u8bed\u4e49\u5bf9\u9f50\u3001\u7ed3\u6784\u5408\u89c4\u6027\u548c\u591a\u7ef4\u8d28\u91cf\u6307\u6807\u3002", "\u901a\u8fc7\u5b9e\u65f6\u4ea4\u4e92\u65e5\u5fd7\u6838\u9a8c\u5f15\u7528\u6765\u6e90\uff0c\u4e25\u683c\u68c0\u67e5 citation \u662f\u5426\u771f\u5b9e\u53ef\u8ffd\u6eaf\uff0c\u4ee5\u51cf\u5c11\u5e7b\u89c9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5b66\u672f\u8bc4\u5ba1", "\u4e8b\u5b9e\u9a8c\u8bc1"], "num_comments": 1, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2608.28612v1", "published_at": "2026-07-21", "score": 0.396, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28612.png", "title": "InternReviewer \u0026 InternAdvocate: Objective Reward and Evaluation for Agentic Reinforcement Learning in Peer Review and Rebuttal", "tldr": "\u7528\u5ba2\u89c2\u5956\u52b1\u8bad\u7ec3\u540c\u884c\u8bc4\u5ba1\u4e0e\u53cd\u9a73\u667a\u80fd\u4f53", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa InternReviewer \u4e0e InternAdvocate \u4e24\u7c7b\u5b66\u672f\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u751f\u6210\u540c\u884c\u8bc4\u5ba1\u548c\u8bba\u6587\u53cd\u9a73\u3002\u6846\u67b6\u7ed3\u5408\u5927\u89c4\u6a21\u5b66\u672f\u6570\u636e\u3001arXiv \u68c0\u7d22\u5de5\u5177\u4e0e\u95ed\u73af agentic RL\uff0c\u901a\u8fc7\u5ba2\u89c2\u5956\u52b1\u4f18\u5316\u63a8\u7406\u6df1\u5ea6\u548c\u5f15\u7528\u51c6\u786e\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5f3a\u5316\u5b66\u4e60\u3001\u5de5\u5177\u68c0\u7d22\u548c\u53ef\u9a8c\u8bc1\u5956\u52b1\u7ed3\u5408\u5230\u5b66\u672f\u8bc4\u5ba1/\u53cd\u9a73\u573a\u666f\uff0c\u8bd5\u56fe\u66ff\u4ee3\u4e3b\u89c2\u6a21\u578b\u88c1\u5224\uff0c\u63d0\u5347\u4e13\u4e1a\u6587\u672c\u751f\u6210\u7684\u4e8b\u5b9e\u53ef\u9760\u6027\u4e0e\u53ef\u8bc4\u4f30\u6027\u3002"}, {"abstract": "Multimodal GUI agents have emerged as a promising paradigm for digital task automation, yet transitioning from benchmark-oriented models to dependable real-world applications remains challenging due to limited environment coverage, brittle task construction, and unreliable reward verification. In this work, we present UI-Venus-2, a general-purpose foundation GUI agent designed to operate across mobile, web, and desktop environments through a unified closed-loop reasoning-action framework. To bridge the gap toward practical deployment, we jointly scale three critical dimensions: (1) Environments, expanding coverage to more than 170 multilingual mobile apps and native desktop operating systems; (2) Tasks, employing a deep-research pipeline for function-grounded instruction generation; and (3) Verification, adopting trace-level and sample-level evaluators with visual keypoints and multi-model voting to ensure reliable RL signals for training. Furthermore, we integrate safety-aware mechanisms to ensure controlled execution of consequential actions. By offering a capable, efficient, and open-source foundation, UI-Venus-2 advances the field toward more generalizable, verifiable, and self-reflective agents for real-world applications.", "arxiv_id": "2609.00028", "arxiv_url": "https://arxiv.org/abs/2609.00028", "authors": ["Venus Team", "Zhuohan Cai", "Haoxing Chen", "Jiaxuan Chen", "Weizhi Chen", "Changlong Gao", "Zhangxuan Gu", "Yuan Guo", "Yusong Hu", "Jianrong Jiang", "Jianguo Li", "Runze Li", "Jinzhen Lin", "Zhenyu Ma", "Changhua Meng", "Han Peng", "Xinyu Qiu", "Shuheng Shen", "Zhongyi Shui", "Weiqiang Wang", "Ming Wen", "Zhuoer Xu", "Hang Yan", "Kaiwen Yang", "Ruilin Yao", "Nanjun Yu", "Zhengwen Zeng", "Lianrui Zhang", "Yunzhu Zhang", "Zhe Zhao", "Beitong Zhou"], "brief": "UI-Venus-2 \u662f\u4e00\u4e2a\u901a\u7528\u591a\u6a21\u6001 GUI \u57fa\u7840\u667a\u80fd\u4f53\uff0c\u8986\u76d6\u79fb\u52a8\u7aef\u3001\u7f51\u9875\u548c\u684c\u9762\u73af\u5883\uff0c\u5e76\u901a\u8fc7\u7edf\u4e00\u7684\u95ed\u73af\u63a8\u7406-\u884c\u52a8\u6846\u67b6\u6267\u884c\u6570\u5b57\u4efb\u52a1\u81ea\u52a8\u5316\u3002\u8bba\u6587\u91cd\u70b9\u6269\u5c55\u73af\u5883\u3001\u4efb\u52a1\u751f\u6210\u4e0e\u5956\u52b1\u9a8c\u8bc1\u4e09\u6761\u8bad\u7ec3\u94fe\u8def\uff0c\u4ee5\u63d0\u5347\u771f\u5b9e\u90e8\u7f72\u53ef\u9760\u6027\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00028", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u73af\u5883\u8986\u76d6\u6269\u5c55\u5230 170 \u591a\u4e2a\u591a\u8bed\u8a00\u79fb\u52a8\u5e94\u7528\u53ca\u539f\u751f\u684c\u9762\u64cd\u4f5c\u7cfb\u7edf\uff0c\u589e\u5f3a\u8de8\u5e73\u53f0\u6cdb\u5316\u80fd\u529b\u3002", "\u91c7\u7528 deep-research \u6d41\u6c34\u7ebf\u751f\u6210\u57fa\u4e8e\u771f\u5b9e\u529f\u80fd\u7684\u6307\u4ee4\u4efb\u52a1\uff0c\u51cf\u5c11\u8106\u5f31\u7684\u4eba\u5de5\u6216\u57fa\u51c6\u5f0f\u4efb\u52a1\u6784\u9020\u3002", "\u5f15\u5165\u8f68\u8ff9\u7ea7\u4e0e\u6837\u672c\u7ea7\u8bc4\u4f30\u5668\uff0c\u7ed3\u5408\u89c6\u89c9\u5173\u952e\u70b9\u548c\u591a\u6a21\u578b\u6295\u7968\uff0c\u4e3a\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u5956\u52b1\u4fe1\u53f7\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u81ea\u52a8\u5316", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2609.00028v1", "published_at": "2026-08-27", "score": 0.392, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00028.png", "title": "UI-Venus-2 Technical Report", "tldr": "\u9762\u5411\u771f\u5b9e\u573a\u666f\u7684\u5f00\u6e90\u901a\u7528GUI\u667a\u80fd\u4f53\u3002", "upvotes": 4, "what_it_is": "UI-Venus-2 \u662f\u4e00\u4e2a\u901a\u7528\u591a\u6a21\u6001 GUI \u57fa\u7840\u667a\u80fd\u4f53\uff0c\u8986\u76d6\u79fb\u52a8\u7aef\u3001\u7f51\u9875\u548c\u684c\u9762\u73af\u5883\uff0c\u5e76\u901a\u8fc7\u7edf\u4e00\u7684\u95ed\u73af\u63a8\u7406-\u884c\u52a8\u6846\u67b6\u6267\u884c\u6570\u5b57\u4efb\u52a1\u81ea\u52a8\u5316\u3002\u8bba\u6587\u91cd\u70b9\u6269\u5c55\u73af\u5883\u3001\u4efb\u52a1\u751f\u6210\u4e0e\u5956\u52b1\u9a8c\u8bc1\u4e09\u6761\u8bad\u7ec3\u94fe\u8def\uff0c\u4ee5\u63d0\u5347\u771f\u5b9e\u90e8\u7f72\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u73af\u5883\u89c4\u6a21\u3001\u4efb\u52a1\u771f\u5b9e\u6027\u548c\u9a8c\u8bc1\u53ef\u9760\u6027\u4e09\u65b9\u9762\u7cfb\u7edf\u63a8\u8fdb GUI \u667a\u80fd\u4f53\u4ece\u57fa\u51c6\u6d4b\u8bd5\u8d70\u5411\u771f\u5b9e\u5e94\u7528\uff0c\u5e76\u52a0\u5165\u5b89\u5168\u611f\u77e5\u673a\u5236\u63a7\u5236\u9ad8\u98ce\u9669\u64cd\u4f5c\uff1b\u5176\u5f00\u6e90\u57fa\u7840\u6a21\u578b\u6709\u671b\u6210\u4e3a\u8de8\u8bbe\u5907\u6570\u5b57\u4efb\u52a1\u81ea\u52a8\u5316\u7684\u91cd\u8981\u57fa\u5ea7\u3002"}, {"abstract": "AI agents in partially observable environments need to coordinate active sensing with working memory to maintain an evolving perceptual state. However, existing benchmarks struggle to isolate this perceptual-state construction and interpretation capability because they introduce physical and control complexities. We address this with MNIST-PRO, a benchmark that isolates agentic perception by converting MNIST digit recognition into a sequential, glimpse-based search task with lookback constraints. We evaluate ten multimodal models across four memory representations, including raw visual history, textual states, structured metric grid maps, and a consolidated visual canvas. While models excel under full observability, partial observability exposes a clear performance gap. We identify three distinct bottlenecks. First, perceptual-state construction and interpretation present a challenge, as agents struggle to integrate fragmented glimpses. Second, agents often stop exploring before they see the full sequence. Third, models often fail to revise early, incorrect beliefs even when faced with subsequent contradictory evidence. These results show that simply acquiring visual evidence is not enough. Agents must also be able to build and update a reliable perceptual state.", "arxiv_id": "2608.31022", "arxiv_url": "https://arxiv.org/abs/2608.31022", "authors": ["Vernon Toh", "Navonil Majumder", "Zhengyuan Liu", "Nancy F. Chen", "Soujanya Poria"], "brief": "\u8bba\u6587\u63d0\u51fa MNIST-PRO\uff0c\u5c06 MNIST \u6570\u5b57\u8bc6\u522b\u6539\u9020\u6210\u57fa\u4e8e\u5c40\u90e8 glimpse \u7684\u5e8f\u5217\u641c\u7d22\u4efb\u52a1\uff0c\u7528\u4e8e\u9694\u79bb\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u90e8\u5206\u53ef\u89c2\u6d4b\u73af\u5883\u4e2d\u7684\u4e3b\u52a8\u611f\u77e5\u4e0e\u5de5\u4f5c\u8bb0\u5fc6\u80fd\u529b\u3002\u4f5c\u8005\u6d4b\u8bd5\u4e86\u5341\u4e2a\u591a\u6a21\u6001\u6a21\u578b\u548c\u56db\u7c7b\u8bb0\u5fc6\u8868\u793a\uff0c\u5206\u6790\u6a21\u578b\u6784\u5efa\u3001\u66f4\u65b0\u548c\u89e3\u91ca\u611f\u77e5\u72b6\u6001\u7684\u74f6\u9888\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.31022", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4efb\u52a1\u901a\u8fc7\u5c40\u90e8\u89c2\u5bdf\u548c lookback \u7ea6\u675f\uff0c\u8ba9\u6a21\u578b\u5fc5\u987b\u9010\u6b65\u63a2\u7d22\u5e76\u6574\u5408\u788e\u7247\u89c6\u89c9\u8bc1\u636e\uff0c\u800c\u975e\u4e00\u6b21\u6027\u770b\u5230\u5b8c\u6574\u56fe\u50cf\u3002", "\u6bd4\u8f83\u4e86\u539f\u59cb\u89c6\u89c9\u5386\u53f2\u3001\u6587\u672c\u72b6\u6001\u3001\u7ed3\u6784\u5316\u7f51\u683c\u5730\u56fe\u3001\u6574\u5408\u89c6\u89c9\u753b\u5e03\u7b49\u56db\u79cd\u8bb0\u5fc6\u8868\u793a\u3002", "\u53d1\u73b0\u591a\u6a21\u6001\u6a21\u578b\u5728\u5b8c\u5168\u53ef\u89c2\u6d4b\u65f6\u8868\u73b0\u8f83\u597d\uff0c\u4f46\u5728\u90e8\u5206\u53ef\u89c2\u6d4b\u4e0b\u5bb9\u6613\u6574\u5408\u5931\u8d25\u3001\u8fc7\u65e9\u505c\u6b62\u63a2\u7d22\uff0c\u5e76\u96be\u4ee5\u4fee\u6b63\u65e9\u671f\u9519\u8bef\u5224\u65ad\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u90e8\u5206\u53ef\u89c2\u6d4b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Deep Cognition and Language Research (DeCLaRe) Lab", "pdf_url": "https://arxiv.org/pdf/2608.31022v1", "published_at": "2026-08-31", "score": 0.386, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31022.png", "title": "MNIST-PRO: MNIST is Back as a Partially Observable World for AI Agents", "tldr": "MNIST\u53d8\u8eab\u90e8\u5206\u53ef\u89c2\u6d4b\u667a\u80fd\u4f53\u611f\u77e5\u57fa\u51c6", "upvotes": 7, "what_it_is": "\u8bba\u6587\u63d0\u51fa MNIST-PRO\uff0c\u5c06 MNIST \u6570\u5b57\u8bc6\u522b\u6539\u9020\u6210\u57fa\u4e8e\u5c40\u90e8 glimpse \u7684\u5e8f\u5217\u641c\u7d22\u4efb\u52a1\uff0c\u7528\u4e8e\u9694\u79bb\u8bc4\u4f30\u667a\u80fd\u4f53\u5728\u90e8\u5206\u53ef\u89c2\u6d4b\u73af\u5883\u4e2d\u7684\u4e3b\u52a8\u611f\u77e5\u4e0e\u5de5\u4f5c\u8bb0\u5fc6\u80fd\u529b\u3002\u4f5c\u8005\u6d4b\u8bd5\u4e86\u5341\u4e2a\u591a\u6a21\u6001\u6a21\u578b\u548c\u56db\u7c7b\u8bb0\u5fc6\u8868\u793a\uff0c\u5206\u6790\u6a21\u578b\u6784\u5efa\u3001\u66f4\u65b0\u548c\u89e3\u91ca\u611f\u77e5\u72b6\u6001\u7684\u74f6\u9888\u3002", "why_notable": "\u8be5\u57fa\u51c6\u7528\u7b80\u5355\u53ef\u63a7\u7684 MNIST \u573a\u666f\u5265\u79bb\u4e86\u590d\u6742\u7269\u7406\u63a7\u5236\u56e0\u7d20\uff0c\u4e13\u95e8\u68c0\u9a8c\u667a\u80fd\u4f53\u7684\u611f\u77e5\u72b6\u6001\u6784\u5efa\u4e0e\u66f4\u65b0\u80fd\u529b\uff0c\u5bf9\u7814\u7a76\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5728\u90e8\u5206\u53ef\u89c2\u6d4b\u73af\u5883\u4e2d\u7684\u53ef\u9760\u6027\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Recent video generators often omit audio or synthesize it in a separate stage, limiting reciprocal modeling of visual dynamics and acoustic events. We present DreamX-Creator 1.0, a compact native joint audio-video generation system centered on a 7B generator. Conditioned on a first frame and a text prompt, the generator jointly denoises modality-specialized audio and video streams. The streams are processed independently in the first half of the network and coupled in the latter half through Gated Cross-Modal Attention, whose token- and head-wise output gates modulate each active cross-modal attention-head output. A unified Audio-Video Data System constructs and filters temporally coherent clips, produces structured multimodal annotations, and organizes clips into capability-oriented data pools. Progressive Joint Training comprises two audio-video pre-training stages followed by High-Quality Finetuning. Audio-Video Reinforcement Learning further post-trains the generator with Modality-Aware Multimodal Feedback that routes video-, audio-, and cross-modal feedback to the corresponding streams. For high-resolution output, our Autoregressive 1-Step 2K Refinement pipeline adapts a bidirectional multi-step teacher into an autoregressive multi-step refiner and distills it into a student requiring one denoising evaluation per temporal chunk. Overall, DreamX-Creator 1.0 achieves native, synchronized audio-video generation with performance competitive with state-of-the-art open-source systems. By releasing our compact 7B generator and 2K Refiner, we seek to democratize native audio-video generation and provide an accessible foundation for future research in unified audio-video generative modeling.", "arxiv_id": "2608.31106", "arxiv_url": "https://arxiv.org/abs/2608.31106", "authors": ["Jiashu Zhu", "Yanhao Zheng", "Ruitian Tian", "Rujing Dang", "Shen Zhang", "Bingze Song", "Jiachen Lei", "Ruimin Lin", "Jiahong Wu", "Xiangxiang Chu"], "brief": "DreamX-Creator 1.0 \u662f\u4e00\u4e2a\u7d27\u51d1\u7684\u539f\u751f\u8054\u5408\u97f3\u89c6\u9891\u751f\u6210\u7cfb\u7edf\uff0c\u57fa\u4e8e\u9996\u5e27\u548c\u6587\u672c\u63d0\u793a\u540c\u65f6\u751f\u6210\u89c6\u89c9\u4e0e\u97f3\u9891\u3002\u8bba\u6587\u8fd8\u53d1\u5e03\u4e867B\u751f\u6210\u5668\u548c2K\u7ec6\u5316\u5668\uff0c\u65e8\u5728\u964d\u4f4e\u9ad8\u8d28\u91cf\u97f3\u89c6\u9891\u751f\u6210\u7814\u7a76\u95e8\u69db\u3002", "categories": ["cs.CV", "cs.SD"], "github_repo": "https://github.com/AMAP-ML/DreamX-Creator", "github_stars": 91, "hf_url": "https://huggingface.co/papers/2608.31106", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 Gated Cross-Modal Attention\uff0c\u5728\u7f51\u7edc\u540e\u534a\u6bb5\u901a\u8fc7token\u7ea7\u4e0ehead\u7ea7\u95e8\u63a7\u8026\u5408\u97f3\u9891\u3001\u89c6\u9891\u6d41\uff0c\u5b9e\u73b0\u8de8\u6a21\u6001\u540c\u6b65\u5efa\u6a21\u3002", "\u6784\u5efa\u7edf\u4e00 Audio-Video Data System\uff0c\u7b5b\u9009\u65f6\u5e8f\u4e00\u81f4\u7247\u6bb5\u3001\u751f\u6210\u7ed3\u6784\u5316\u591a\u6a21\u6001\u6807\u6ce8\uff0c\u5e76\u6309\u80fd\u529b\u7ec4\u7ec7\u6570\u636e\u6c60\u3002", "\u63d0\u51fa\u6e10\u8fdb\u5f0f\u8054\u5408\u8bad\u7ec3\u3001\u97f3\u89c6\u9891\u5f3a\u5316\u5b66\u4e60\u548c1\u6b652K\u81ea\u56de\u5f52\u7ec6\u5316\u7ba1\u7ebf\uff0c\u5728\u9ad8\u5206\u8fa8\u7387\u4e0b\u517c\u987e\u8d28\u91cf\u4e0e\u63a8\u7406\u6548\u7387\u3002"], "keywords": ["\u591a\u6a21\u6001\u751f\u6210", "\u89c6\u9891\u751f\u6210", "\u97f3\u9891\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 6, "on_hf": true, "organization": "AMAP-ML", "pdf_url": "https://arxiv.org/pdf/2608.31106v1", "published_at": "2026-08-31", "score": 0.37, "selected_reasons": ["HF trending (92\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31106.png", "title": "DreamX-Creator: Democratizing Native Audio-Video Generation at 2K Resolution", "tldr": "7B\u6a21\u578b\u539f\u751f\u751f\u6210\u540c\u6b652K\u97f3\u89c6\u9891", "upvotes": 92, "what_it_is": "DreamX-Creator 1.0 \u662f\u4e00\u4e2a\u7d27\u51d1\u7684\u539f\u751f\u8054\u5408\u97f3\u89c6\u9891\u751f\u6210\u7cfb\u7edf\uff0c\u57fa\u4e8e\u9996\u5e27\u548c\u6587\u672c\u63d0\u793a\u540c\u65f6\u751f\u6210\u89c6\u89c9\u4e0e\u97f3\u9891\u3002\u8bba\u6587\u8fd8\u53d1\u5e03\u4e867B\u751f\u6210\u5668\u548c2K\u7ec6\u5316\u5668\uff0c\u65e8\u5728\u964d\u4f4e\u9ad8\u8d28\u91cf\u97f3\u89c6\u9891\u751f\u6210\u7814\u7a76\u95e8\u69db\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u97f3\u9891\u4e0e\u89c6\u9891\u4ece\u751f\u6210\u8fc7\u7a0b\u672c\u8eab\u8fdb\u884c\u8054\u5408\u5efa\u6a21\uff0c\u800c\u975e\u540e\u5904\u7406\u62fc\u63a5\uff0c\u6709\u671b\u63d0\u5347\u58f0\u753b\u540c\u6b65\u4e0e\u4e8b\u4ef6\u4e00\u81f4\u6027\uff1b\u540c\u65f6\u5f00\u6e90\u7d27\u51d17B\u6a21\u578b\u548c2K\u7ec6\u5316\u5668\uff0c\u5bf9\u5f00\u653e\u793e\u533a\u590d\u73b0\u548c\u6269\u5c55\u539f\u751f\u97f3\u89c6\u9891\u751f\u6210\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Composable scene modeling aims to recover a real indoor scene as complete, editable object assets arranged as observed, giving robot simulation and embodied AI a simulation-ready replica of the real environment whose objects can be manipulated individually. Existing pipelines decompose the task into three steps---parse the observations into instances, generate an asset for each, and place each asset back---but every step presumes an input that a cluttered capture rarely provides: accurate instance geometry, unoccluded views, and assets that accurately match the observations. We propose Lucida, which keeps this order but redistributes the requirements, so each step consumes only what a real capture reliably provides and precision is reached at the end of the pipeline rather than demanded at its start. Lucida parses the video into a scene graph whose nodes carry per-instance multi-view evidence, generates a complete asset for each instance from its evidence, and places assets with GizmoAct, a VLM policy that casts placement as multi-turn GUI interaction, manipulating the object\u0027s gizmo in a closed loop and deciding itself when alignment is reached. Across scene-level 3D object detection, object pose estimation, and scene reconstruction, Lucida improves mAP over Boxer by 69% on R2S-Scene, raises ADD-SB@0.05 from 57.8% to 83.4% on CA-1M, and increases scene F-Score from 0.794 for SAM3D to 0.924.", "arxiv_id": "2608.30821", "arxiv_url": "https://arxiv.org/abs/2608.30821", "authors": ["Minghan Qin", "Yuang Wang", "Xiuyu Yang", "Yushi Long", "Yujian Zhang", "Ruihuan Wang", "Kai Ye", "Yangang Zhang", "Hang Li"], "brief": "Lucida \u662f\u4e00\u4e2a\u53ef\u7ec4\u5408\u771f\u5b9e\u5230\u4eff\u771f\u7684\u5ba4\u5185\u573a\u666f\u5efa\u6a21\u6d41\u6c34\u7ebf\uff1a\u5148\u5c06\u89c6\u9891\u89e3\u6790\u4e3a\u5e26\u591a\u89c6\u89d2\u8bc1\u636e\u7684\u573a\u666f\u56fe\uff0c\u518d\u4e3a\u6bcf\u4e2a\u5b9e\u4f8b\u751f\u6210\u5b8c\u6574\u8d44\u4ea7\uff0c\u6700\u540e\u7528 VLM \u7b56\u7565 GizmoAct \u901a\u8fc7\u591a\u8f6e GUI \u64cd\u4f5c\u5b8c\u6210\u6446\u653e\u5bf9\u9f50\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30821", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u4f20\u7edf\u201c\u89e3\u6790-\u751f\u6210-\u6446\u653e\u201d\u6d41\u7a0b\u7684\u7cbe\u5ea6\u8981\u6c42\u540e\u79fb\uff0c\u907f\u514d\u4e00\u5f00\u59cb\u5c31\u4f9d\u8d56\u7cbe\u786e\u5b9e\u4f8b\u51e0\u4f55\u3001\u65e0\u906e\u6321\u89c6\u89d2\u6216\u5b8c\u7f8e\u5339\u914d\u8d44\u4ea7\u3002", "\u89e3\u6790\u9636\u6bb5\u4e3a\u6bcf\u4e2a\u7269\u4f53\u8282\u70b9\u805a\u5408\u591a\u89c6\u89d2\u8bc1\u636e\uff0c\u751f\u6210\u9636\u6bb5\u636e\u6b64\u8865\u5168\u53ef\u72ec\u7acb\u7f16\u8f91\u7684 3D \u5bf9\u8c61\u8d44\u4ea7\u3002", "GizmoAct \u5c06\u7269\u4f53\u6446\u653e\u5efa\u6a21\u4e3a\u95ed\u73af\u591a\u8f6e GUI \u4ea4\u4e92\uff0c\u81ea\u4e3b\u64cd\u63a7 gizmo \u5e76\u5224\u65ad\u4f55\u65f6\u5bf9\u9f50\u5b8c\u6210\u3002"], "keywords": ["\u771f\u5b9e\u5230\u4eff\u771f", "\u573a\u666f\u91cd\u5efa", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "ByteDance Seed", "pdf_url": "https://arxiv.org/pdf/2608.30821v1", "published_at": "2026-08-31", "score": 0.359, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "HF trending (80\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30821.png", "title": "Lucida: Parse, Generate, and Place for Composable Real-to-Sim Scene Modeling", "tldr": "\u4ece\u771f\u5b9e\u89c6\u9891\u751f\u6210\u53ef\u7f16\u8f91\u4eff\u771f\u573a\u666f", "upvotes": 80, "what_it_is": "Lucida \u662f\u4e00\u4e2a\u53ef\u7ec4\u5408\u771f\u5b9e\u5230\u4eff\u771f\u7684\u5ba4\u5185\u573a\u666f\u5efa\u6a21\u6d41\u6c34\u7ebf\uff1a\u5148\u5c06\u89c6\u9891\u89e3\u6790\u4e3a\u5e26\u591a\u89c6\u89d2\u8bc1\u636e\u7684\u573a\u666f\u56fe\uff0c\u518d\u4e3a\u6bcf\u4e2a\u5b9e\u4f8b\u751f\u6210\u5b8c\u6574\u8d44\u4ea7\uff0c\u6700\u540e\u7528 VLM \u7b56\u7565 GizmoAct \u901a\u8fc7\u591a\u8f6e GUI \u64cd\u4f5c\u5b8c\u6210\u6446\u653e\u5bf9\u9f50\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9762\u5411\u673a\u5668\u4eba\u4eff\u771f\u548c\u5177\u8eab\u667a\u80fd\u7684\u771f\u5b9e\u573a\u666f\u590d\u523b\uff0c\u663e\u8457\u63d0\u5347\u573a\u666f\u7ea7 3D \u68c0\u6d4b\u3001\u7269\u4f53\u4f4d\u59ff\u4f30\u8ba1\u4e0e\u91cd\u5efa\u8d28\u91cf\uff1b\u5728 R2S-Scene \u4e0a mAP \u76f8\u6bd4 Boxer \u63d0\u5347 69%\uff0cCA-1M \u4e0a ADD-SB@0.05 \u4ece 57.8% \u63d0\u5347\u5230 83.4%\uff0c\u573a\u666f F-Score \u4ece 0.794 \u63d0\u5347\u5230 0.924\u3002"}, {"abstract": "On-policy distillation (OPD) offers dense token-level supervision as an alternative to the sparse outcome-level advantages of reinforcement learning with verifiable rewards (RLVR). However, the teacher scores student-generated trajectories that are inherently off-policy for it, so the reliability of its supervision, and hence the source of the student\u0027s improvement, remains unclear. We quantitatively analyze teacher supervision during OPD training and find substantial noise whose prevalence increases with teacher scale. Surprisingly, the student policy is insensitive to such noise, converging to comparable performance regardless of whether noisy supervision is retained or removed. Does OPD distill at all? By analyzing what drives its gains, we find that learning concentrates on low log-probability tokens, and using a single fixed negative advantage matches the performance of teacher-provided ones. This suggests that OPD works largely by suppressing low log-probability tokens, which requires no teacher. These findings motivate On-Policy Self-Adaptation (OPSA), a supervision-free method using entropy-adaptive negative advantages. It assigns stronger learning signals to high-entropy positions, suppressing tail tokens, and evenly redistributing probability mass among head tokens. Compared with the base \\texttt{Qwen3-1.7B}, OPSA improves Avg@32 by 35.41 points on AIME24, corresponding to a 263\\% relative gain, and more than doubles Pass@32 across all three benchmarks. It also outperforms OPD by 16.77 points in Avg@32 on AIME24. Extensive experiments and analyses across model families and tasks further demonstrate its effectiveness and generalizability.", "arxiv_id": "2608.31046", "arxiv_url": "https://arxiv.org/abs/2608.31046", "authors": ["Yi Ding", "Ruqi Zhang"], "brief": "\u8bba\u6587\u7cfb\u7edf\u5206\u6790\u4e86 on-policy distillation \u4e2d\u6559\u5e08\u5bf9\u5b66\u751f\u751f\u6210\u8f68\u8ff9\u7684\u76d1\u7763\uff0c\u53d1\u73b0\u76d1\u7763\u566a\u58f0\u5f88\u5927\u4e14\u5e76\u975e\u6027\u80fd\u63d0\u5347\u7684\u5173\u952e\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u65e0\u9700\u6559\u5e08\u7684 OPSA\uff0c\u901a\u8fc7\u71b5\u81ea\u9002\u5e94\u8d1f\u4f18\u52bf\u6291\u5236\u5c3e\u90e8 token\uff0c\u5b9e\u73b0\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/DripNowhy/On-Policy-Self-Adaptation", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2608.31046", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0 OPD \u4e2d\u6559\u5e08\u6253\u5206\u5b58\u5728\u663e\u8457\u566a\u58f0\uff0c\u4e14\u6559\u5e08\u89c4\u6a21\u8d8a\u5927\u566a\u58f0\u6bd4\u4f8b\u53cd\u800c\u8d8a\u9ad8\uff0c\u4f46\u5b66\u751f\u5bf9\u4fdd\u7559\u6216\u79fb\u9664\u566a\u58f0\u5e76\u4e0d\u654f\u611f\u3002", "\u5b9e\u9a8c\u8868\u660e OPD \u7684\u4e3b\u8981\u5b66\u4e60\u4fe1\u53f7\u96c6\u4e2d\u5728\u4f4e log-probability token\uff1b\u7528\u56fa\u5b9a\u8d1f\u4f18\u52bf\u5373\u53ef\u5339\u914d\u6559\u5e08\u63d0\u4f9b\u7684\u4f18\u52bf\u4fe1\u53f7\u3002", "\u63d0\u51fa OPSA\uff1a\u5728\u9ad8\u71b5\u4f4d\u7f6e\u65bd\u52a0\u5f3a\u8d1f\u4f18\u52bf\uff0c\u538b\u5236\u5c3e\u90e8 token\uff0c\u5e76\u5728\u5934\u90e8 token \u95f4\u91cd\u65b0\u5206\u914d\u6982\u7387\uff1b\u5728 AIME24 \u4e0a\u76f8\u6bd4 Qwen3-1.7B \u7684 Avg@32 \u63d0\u5347 35.41 \u5206\uff0c\u5e76\u8d85\u8fc7 OPD 16.77 \u5206\u3002"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 3, "on_hf": true, "organization": "Purdue University", "pdf_url": "https://arxiv.org/pdf/2608.31046v1", "published_at": "2026-08-31", "score": 0.354, "selected_reasons": ["HF trending (103\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.31046.png", "title": "Does On-Policy Distillation Really Distill? From Noisy Teacher to Self-Improvement", "tldr": "OPD\u589e\u76ca\u4e3b\u8981\u6765\u81ea\u6291\u5236\u4f4e\u6982\u7387token", "upvotes": 103, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u5206\u6790\u4e86 on-policy distillation \u4e2d\u6559\u5e08\u5bf9\u5b66\u751f\u751f\u6210\u8f68\u8ff9\u7684\u76d1\u7763\uff0c\u53d1\u73b0\u76d1\u7763\u566a\u58f0\u5f88\u5927\u4e14\u5e76\u975e\u6027\u80fd\u63d0\u5347\u7684\u5173\u952e\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u65e0\u9700\u6559\u5e08\u7684 OPSA\uff0c\u901a\u8fc7\u71b5\u81ea\u9002\u5e94\u8d1f\u4f18\u52bf\u6291\u5236\u5c3e\u90e8 token\uff0c\u5b9e\u73b0\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86 OPD\u201c\u84b8\u998f\u6559\u5e08\u77e5\u8bc6\u201d\u7684\u5e38\u89c1\u7406\u89e3\uff0c\u6307\u51fa\u5176\u6709\u6548\u6027\u53ef\u80fd\u6e90\u4e8e\u65e0\u9700\u6559\u5e08\u7684\u6982\u7387\u5206\u5e03\u81ea\u9002\u5e94\u4fee\u6b63\uff0c\u5e76\u7ed9\u51fa\u66f4\u7b80\u5355\u3001\u4f4e\u6210\u672c\u4e14\u6548\u679c\u66f4\u5f3a\u7684\u66ff\u4ee3\u8bad\u7ec3\u65b9\u6cd5\uff0c\u5bf9 RLVR\u3001\u84b8\u998f\u548c\u5927\u6a21\u578b\u81ea\u6211\u6539\u8fdb\u5177\u6709\u91cd\u8981\u542f\u53d1\u3002"}, {"abstract": "Despite the growing use of LLM-powered agents to solve multi-step tasks in complex environments, existing benchmarks rarely test state preservation, performance across languages, and application to realistic, grounded scenarios. To address these concerns, we present WorldBench: a comprehensive, multilingual benchmark of genuine, persona-grounded everyday workflows, where agents can act in a sandbox via structured actions. WorldBench comprises 1,600 tasks across seven languages and eight cultures, filtered and refined through feedback from human annotators with language- and culture-specific expertise. For evaluation, we extend metrics from previous works and introduce Constrained Task Success (CTS), which combines natural language instructions and testbeds to score task completion, minimal modification, and other complementary metrics through deterministic and LLM-as-a-Judge evaluations. Our experiments show that frontier models reach only 49.2% CTS, with all models demonstrating large gaps between correctness and environment preservation. We thereby show that current agents remain brittle in multilingual, agentic scenarios, especially for long-horizon tasks and under state-preservation constraints", "arxiv_id": "2609.01056", "arxiv_url": "https://arxiv.org/abs/2609.01056", "authors": ["Leonardo Ranaldi", "Sherrie Shen", "Jushi Kai", "Alexandra Birch"], "brief": "\u8bba\u6587\u63d0\u51fa WorldBench\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u8bed\u8a00\u3001\u591a\u6587\u5316\u3001\u4eba\u683c\u5316\u65e5\u5e38\u5de5\u4f5c\u6d41\u7684\u667a\u80fd\u4f53\u57fa\u51c6\u3002\u667a\u80fd\u4f53\u9700\u5728\u6c99\u76d2\u73af\u5883\u4e2d\u901a\u8fc7\u7ed3\u6784\u5316\u52a8\u4f5c\u5b8c\u6210\u771f\u5b9e\u4efb\u52a1\uff0c\u5e76\u4fdd\u6301\u73af\u5883\u72b6\u6001\u4e0d\u88ab\u4e0d\u5fc5\u8981\u4fee\u6539\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01056", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b1600\u4e2a\u4efb\u52a1\uff0c\u8986\u76d67\u79cd\u8bed\u8a00\u548c8\u79cd\u6587\u5316\uff0c\u5e76\u7531\u5177\u5907\u5bf9\u5e94\u8bed\u8a00\u4e0e\u6587\u5316\u80cc\u666f\u7684\u4eba\u7c7b\u6807\u6ce8\u8005\u7b5b\u9009\u548c\u4f18\u5316", "\u5f15\u5165 Constrained Task Success\uff08CTS\uff09\u6307\u6807\uff0c\u7efc\u5408\u4efb\u52a1\u5b8c\u6210\u5ea6\u3001\u6700\u5c0f\u4fee\u6539\u3001\u72b6\u6001\u4fdd\u6301\u7b49\u7ef4\u5ea6\uff0c\u7ed3\u5408\u786e\u5b9a\u6027\u8bc4\u6d4b\u4e0eLLM-as-a-Judge", "\u524d\u6cbf\u6a21\u578b\u6700\u9ad8\u4ec5\u8fbe\u523049.2% CTS\uff0c\u4e14\u5728\u6b63\u786e\u5b8c\u6210\u4efb\u52a1\u4e0e\u4fdd\u6301\u73af\u5883\u72b6\u6001\u4e4b\u95f4\u5b58\u5728\u660e\u663e\u5dee\u8ddd"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u8bed\u8a00", "\u57fa\u51c6\u8bc4\u6d4b", "\u6587\u5316\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01056v1", "published_at": "2026-09-01", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WorldBench: Culturally Grounded Benchmark for Multilingual Agents", "tldr": "WorldBench\u63ed\u793a\u591a\u8bed\u6587\u5316\u667a\u80fd\u4f53\u4ecd\u8106\u5f31", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldBench\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u8bed\u8a00\u3001\u591a\u6587\u5316\u3001\u4eba\u683c\u5316\u65e5\u5e38\u5de5\u4f5c\u6d41\u7684\u667a\u80fd\u4f53\u57fa\u51c6\u3002\u667a\u80fd\u4f53\u9700\u5728\u6c99\u76d2\u73af\u5883\u4e2d\u901a\u8fc7\u7ed3\u6784\u5316\u52a8\u4f5c\u5b8c\u6210\u771f\u5b9e\u4efb\u52a1\uff0c\u5e76\u4fdd\u6301\u73af\u5883\u72b6\u6001\u4e0d\u88ab\u4e0d\u5fc5\u8981\u4fee\u6539\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u7b80\u5355\u4efb\u52a1\u63a8\u8fdb\u5230\u591a\u8bed\u3001\u591a\u6587\u5316\u3001\u957f\u7a0b\u4e14\u72b6\u6001\u654f\u611f\u7684\u771f\u5b9e\u5de5\u4f5c\u6d41\uff0c\u7a81\u51fa\u5f53\u524dLLM\u667a\u80fd\u4f53\u5728\u5168\u7403\u5316\u5e94\u7528\u4e2d\u7684\u53ef\u9760\u6027\u77ed\u677f\u3002"}, {"abstract": "Large Language Models (LLMs) have demonstrated remarkable capabilities as powerful components in agentic systems, enabling sophisticated reasoning and complex task execution. However, current approaches to manually designing and optimizing agentic systems heavily rely on manual effort, limiting their adaptability and scalability. Recent work has explored the automated optimization of workflow designs. However, these approaches often overlook the crucial role of model capabilities and focus on single performance metrics, failing to address real-world deployment constraints. In this paper, we present AgentFactory, a framework that jointly optimizes both foundation models and workflow structures in agentic systems while considering multiple objectives including performance, cost, and efficiency. AgentFactory leverages advanced LLMs as optimizers to navigate the vast search space of possible configurations, employing a three-stage optimization pipeline to automatically discover effective combinations of fine-tuned models and optimized workflows. Through an iterative optimization process, our framework systematically explores and evaluates different agentic system designs, adapting to task-specific requirements while maintaining operational efficiency. We evaluate AgentFactory across eight benchmarks spanning five domains, including general reasoning, coding, mathematics, medicine, and finance. Our experiments demonstrate that AgentFactory consistently outperforms both manually designed methods and existing automated approaches, achieving an average improvement of 9.1% across all benchmarks, with particularly significant gains in domain-specific tasks (19.6% on MedQA and 18.7% on FinEval). These results establish AgentFactory as a promising approach for developing more capable and efficient agentic systems through automated optimization.", "arxiv_id": "2609.01045", "arxiv_url": "https://arxiv.org/abs/2609.01045", "authors": ["Enci Zhang", "Haofeng Wang", "Yuesheng Zhu", "Xiaole Cui", "Guibo Luo"], "brief": "AgentFactory \u662f\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u81ea\u52a8\u5316\u8bbe\u8ba1\u4e0e\u4f18\u5316\u6846\u67b6\uff0c\u540c\u65f6\u641c\u7d22\u57fa\u7840\u6a21\u578b\u9009\u62e9/\u5fae\u8c03\u65b9\u6848\u4e0e\u5de5\u4f5c\u6d41\u7ed3\u6784\u3002\u5b83\u7528\u5f3a LLM \u4f5c\u4e3a\u4f18\u5316\u5668\uff0c\u5728\u6027\u80fd\u3001\u6210\u672c\u3001\u6548\u7387\u7b49\u591a\u76ee\u6807\u7ea6\u675f\u4e0b\u81ea\u52a8\u53d1\u73b0\u4efb\u52a1\u9002\u914d\u7684\u667a\u80fd\u4f53\u914d\u7f6e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01045", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u4e09\u9636\u6bb5\u4f18\u5316\u6d41\u6c34\u7ebf\uff0c\u8054\u5408\u4f18\u5316\u7ec6\u8c03\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u800c\u975e\u53ea\u8c03\u5de5\u4f5c\u6d41\u7ed3
