, a hand-controlled video world model that unifies precise interaction modeling with efficient streaming generation. We curate 100K interaction clips spanning diverse real and synthetic environments and develop hand-aware supervision to improve fine-grained hand motions and object interactions. Building on this foundation, we learn a causal flow map for few-step generation and introduce region-aware score distillation that combines complementary video and image priors to refine interaction dynamics and visual appearance. To further reduce inference latency, we propose Ultra-Fast-VAE, a compact video decoder that preserves high reconstruction fidelity with substantially lower computational cost. Extensive evaluations on HandBench demonstrate superior hand-following accuracy and visual quality compared with existing approaches. Our full-sequence model achieves an FVD of 181.67 and a MANO Dice score of 93.02, while the three-step causal model maintains a MANO Dice score of 92.49. For real-time interaction, 540p streaming on a single H200 reaches 18.03 FPS with 741ms latency and an optimized peak GPU memory footprint of only 34.89GB. We will release the datasets, model weights, and the full training and inference code to support research on hand-controlled video world models.", "arxiv_id": "2611.21479", "arxiv_url": "https://arxiv.org/abs/2611.21479", "authors": ["Shaohao Rui", "Chaoyang Zhang", "Xiaofeng Mao", "Weijie Ma"], "brief": "\u6784\u5efa\u624b\u63a7\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u7528\u624b\u90e8\u611f\u77e5\u76d1\u7763\u5b66\u4e60\u624b\u7269\u4ea4\u4e92\uff0c\u5e76\u4ee5\u56e0\u679c\u6d41\u6620\u5c04\u548c\u533a\u57df\u611f\u77e5\u5206\u6570\u84b8\u998f\u5b9e\u73b0\u5c11\u6b65\u751f\u6210\uff0c\u914d\u5408\u8f7b\u91cf\u89c6\u9891\u89e3\u7801\u5668\u964d\u4f4e\u63a8\u7406\u5f00\u9500\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/LynnReal-AI/LynnReal", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2611.21479", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6574\u740610\u4e07\u6bb5\u771f\u5b9e\u4e0e\u5408\u6210\u4ea4\u4e92\u89c6\u9891\uff0c\u52a0\u5165\u624b\u90e8\u611f\u77e5\u76d1\u7763\u3002", "\u4e09\u6b65\u56e0\u679c\u6a21\u578b\u5728HandBench\u4e0a\u8fbeMANO Dice 92.49\u3002", "Ultra-Fast-VAE\u652f\u6301\u5355H200\u4ee518.03 FPS\u751f\u6210540p\u89c6\u9891\u3002"], "keywords": ["\u89c6\u9891\u4e16\u754c\u6a21\u578b", "\u624b\u7269\u4ea4\u4e92", "\u6d41\u5f0f\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21479v1", "published_at": "2026-11-16", "score": 0.262, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21479.png", "title": "LynnReal-Hand: Unlocking World Interaction with Hand Control", "tldr": "\u4ee5\u624b\u90e8\u52a8\u4f5c\u63a7\u5236\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u517c\u987e\u7cbe\u7ec6\u7269\u4f53\u4ea4\u4e92\u4e0e\u4f4e\u5ef6\u8fdf\u6d41\u5f0f\u751f\u6210\u3002", "upvotes": 3, "what_it_is": "\u6784\u5efa\u624b\u63a7\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u7528\u624b\u90e8\u611f\u77e5\u76d1\u7763\u5b66\u4e60\u624b\u7269\u4ea4\u4e92\uff0c\u5e76\u4ee5\u56e0\u679c\u6d41\u6620\u5c04\u548c\u533a\u57df\u611f\u77e5\u5206\u6570\u84b8\u998f\u5b9e\u73b0\u5c11\u6b65\u751f\u6210\uff0c\u914d\u5408\u8f7b\u91cf\u89c6\u9891\u89e3\u7801\u5668\u964d\u4f4e\u63a8\u7406\u5f00\u9500\u3002", "why_notable": "\u5c06\u89c6\u9891\u4e16\u754c\u63a7\u5236\u4ece\u6587\u672c\u548c\u955c\u5934\u63a8\u8fdb\u5230\u624b\u7269\u4ea4\u4e92\uff0c\u540c\u65f6\u7ed9\u51fa\u6d41\u5f0f\u751f\u6210\u7684\u6027\u80fd\u6307\u6807\uff0c\u4e3a\u53ef\u76f4\u63a5\u64cd\u63a7\u7684\u865a\u62df\u73af\u5883\u63d0\u4f9b\u6280\u672f\u8def\u5f84\u3002"}, {"abstract": "Coding agents can synthesize and optimize code-based policies from simulator feedback, allowing the resulting program to act with zero inference model calls. But for long horizon tasks, two challenges arise: local improvements can hurt final success and switching to a new objective requires another expensive synthesis run. We propose a framework that first develops competence by refining the policy through a feedback cascade, moving from episode returns to hierarchical goals and belief updates which can be scored densely from simulator. In the Craftax game, a partially observed and procedurally generated environment, refinements via episode level feedback stall at \u003c1% final-level arrival, whereas with the feedback cascade the optimized policy reaches the final stage 50% of time (28% final boss defeats). Furthermore, to make this competence reusable towards new goals, we factor the previous controller into an environment interpreter $I$ (models, memory, skills) and a rule program $p_0$, and we show that coding agents can optimize a reusable goal compiler $C_\u03b8$ that maps structured tasks $g$ into new rule programs $p_g$. Across five independent compiler searches trained only on short tasks, the resulting compilers successfully transfer zero-shot to longer tasks without any task-specific tuning nor inference-time LLM calls: continuation-scored feedback and a fixed machine with an editable program together turn a single-task competent policy into a reusable one. Code at: https://github.com/vicgalle/craftax-program-policies", "arxiv_id": "2611.19537", "arxiv_url": "https://arxiv.org/abs/2611.19537", "authors": ["V\u00edctor Gallego"], "brief": "\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5728Craftax\u4e2d\u901a\u8fc7\u56de\u62a5\u3001\u5206\u5c42\u76ee\u6807\u4e0e\u4fe1\u5ff5\u66f4\u65b0\u9010\u6b65\u4f18\u5316\u7a0b\u5e8f\u7b56\u7565\uff0c\u518d\u5c06\u63a7\u5236\u5668\u62c6\u4e3a\u73af\u5883\u89e3\u91ca\u5668\u548c\u89c4\u5219\u7a0b\u5e8f\uff0c\u5b66\u4e60\u53ef\u590d\u7528\u7684\u76ee\u6807\u7f16\u8bd1\u5668\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/vicgalle/craftax-program-policies", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.19537", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u53cd\u9988\u7ea7\u8054\u5c06\u6700\u7ec8\u9636\u6bb5\u5230\u8fbe\u7387\u4ece\u4e0d\u8db31%\u63d0\u5347\u81f350%", "\u4f18\u5316\u7a0b\u5e8f\u7b56\u7565\u7684\u6700\u7ec8Boss\u51fb\u8d25\u7387\u8fbe28%", "5\u6b21\u72ec\u7acb\u7f16\u8bd1\u5668\u641c\u7d22\u4ec5\u7528\u77ed\u4efb\u52a1\u8bad\u7ec3\uff0c\u96f6\u6837\u672c\u8fc1\u79fb\u957f\u4efb\u52a1"], "keywords": ["\u7a0b\u5e8f\u7b56\u7565", "\u7f16\u7801\u667a\u80fd\u4f53", "\u76ee\u6807\u7f16\u8bd1", "\u96f6\u6837\u672c\u8fc1\u79fb"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.19537v1", "published_at": "2026-11-14", "score": 0.26, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19537.png", "title": "Continuation-Guided LLM Evolution of Program Policies and Goal Compilers in Craftax", "tldr": "\u7528\u5206\u5c42\u53cd\u9988\u8fdb\u5316\u7a0b\u5e8f\u7b56\u7565\uff0c\u518d\u4ee5\u76ee\u6807\u7f16\u8bd1\u5668\u5b9e\u73b0\u957f\u4efb\u52a1\u96f6\u6837\u672c\u8fc1\u79fb\u3002", "upvotes": 5, "what_it_is": "\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5728Craftax\u4e2d\u901a\u8fc7\u56de\u62a5\u3001\u5206\u5c42\u76ee\u6807\u4e0e\u4fe1\u5ff5\u66f4\u65b0\u9010\u6b65\u4f18\u5316\u7a0b\u5e8f\u7b56\u7565\uff0c\u518d\u5c06\u63a7\u5236\u5668\u62c6\u4e3a\u73af\u5883\u89e3\u91ca\u5668\u548c\u89c4\u5219\u7a0b\u5e8f\uff0c\u5b66\u4e60\u53ef\u590d\u7528\u7684\u76ee\u6807\u7f16\u8bd1\u5668\u3002", "why_notable": "\u628a\u6602\u8d35\u7684\u5355\u4efb\u52a1\u4ee3\u7801\u641c\u7d22\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u7684\u76ee\u6807\u7f16\u8bd1\u80fd\u529b\uff0c\u5728\u6267\u884c\u65f6\u65e0\u9700\u8c03\u7528\u5927\u6a21\u578b\uff0c\u4e3a\u4f4e\u6210\u672c\u957f\u7a0b\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u53ef\u884c\u8def\u5f84\u3002"}, {"abstract": "Evaluations of multi-agent language models often compare communicating architectures against a single greedy pass. This practice confounds coordination with sample multiplicity and inference compute. We synthesize nine primary empirical evaluations comprising 516 unique multi-agent configurations organized along a resource vector R with six dimensions and a baseline ladder with four categories. Against baselines with a single pass (Category A), multi-agent accuracy differences are negative overall and near zero when omitting the largest contributing study. When evaluated against baselines matched on sample count (Category B) or resource budget (Category C), multi-agent systems average -0.042 in accuracy, and multilevel random effects modeling on the log odds scale remains negative across sensitivity checks. Multi-agent accuracy equals or falls below the baseline in 74% of these comparable contrasts, and study means are nonpositive in almost all evaluated studies. Across studies reporting both baselines, moving from a greedy pass to a sampled baseline shifts accuracy differences by -0.038 on average. Because communication adds no information when agents share identical evidence, positive returns require partitioned evidence, external verification, or error diversity across models. We provide a reviewer checklist and accounting utilities.", "arxiv_id": "2611.17610", "arxiv_url": "https://arxiv.org/abs/2611.17610", "authors": ["Seyed Mahmoud Sajjadi Mohammadabadi"], "brief": "\u7814\u7a76\u6c47\u603b\u4e5d\u9879\u5b9e\u8bc1\u8bc4\u4f30\uff0c\u7528\u516d\u7ef4\u8d44\u6e90\u5411\u91cf\u548c\u56db\u7c7b\u57fa\u7ebf\u62c6\u5206\u534f\u4f5c\u3001\u91c7\u6837\u4e0e\u63a8\u7406\u8ba1\u7b97\u7684\u8d21\u732e\uff0c\u5e76\u901a\u8fc7\u591a\u5c42\u968f\u673a\u6548\u5e94\u6a21\u578b\u68c0\u9a8c\u591a\u667a\u80fd\u4f53\u7684\u51c0\u6536\u76ca\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA"], "github_repo": "https://github.com/mahmoudsajjadi/pace", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.17610", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6c47\u603b9\u9879\u8bc4\u4f30\uff0c\u8986\u76d6516\u79cd\u591a\u667a\u80fd\u4f53\u914d\u7f6e", "\u5339\u914d\u91c7\u6837\u6570\u6216\u8d44\u6e90\u9884\u7b97\u540e\uff0c\u51c6\u786e\u7387\u5e73\u5747\u5dee\u4e3a-0.042", "74%\u7684\u53ef\u6bd4\u5bf9\u7167\u4e2d\uff0c\u591a\u667a\u80fd\u4f53\u51c6\u786e\u7387\u4e0d\u9ad8\u4e8e\u57fa\u7ebf"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u8ba1\u7b97", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17610v1", "published_at": "2026-11-13", "score": 0.253, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17610.png", "title": "More Agents, More Samples, or More Thinking? Untangling Coordination, Ensembling, and Test-Time Compute in Multi-Agent LLMs", "tldr": "\u7efc\u5408\u4e5d\u9879\u8bc4\u4f30\u53d1\u73b0\uff0c\u591a\u667a\u80fd\u4f53\u5728\u5339\u914d\u91c7\u6837\u6570\u6216\u8d44\u6e90\u9884\u7b97\u540e\u901a\u5e38\u4e0d\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u6c47\u603b\u4e5d\u9879\u5b9e\u8bc1\u8bc4\u4f30\uff0c\u7528\u516d\u7ef4\u8d44\u6e90\u5411\u91cf\u548c\u56db\u7c7b\u57fa\u7ebf\u62c6\u5206\u534f\u4f5c\u3001\u91c7\u6837\u4e0e\u63a8\u7406\u8ba1\u7b97\u7684\u8d21\u732e\uff0c\u5e76\u901a\u8fc7\u591a\u5c42\u968f\u673a\u6548\u5e94\u6a21\u578b\u68c0\u9a8c\u591a\u667a\u80fd\u4f53\u7684\u51c0\u6536\u76ca\u3002", "why_notable": "\u5b83\u5c06\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u6536\u76ca\u4e0e\u989d\u5916\u91c7\u6837\u3001\u8ba1\u7b97\u6295\u5165\u533a\u5206\u5f00\uff0c\u4e3a\u516c\u5e73\u8bc4\u6d4b\u63d0\u4f9b\u4f9d\u636e\uff0c\u4e5f\u63d0\u793a\u5e94\u5173\u6ce8\u8bc1\u636e\u5206\u5de5\u3001\u5916\u90e8\u9a8c\u8bc1\u548c\u6a21\u578b\u9519\u8bef\u591a\u6837\u6027\u3002"}, {"abstract": "Directional ablation removes a hidden state\u0027s component along a \"behaviour direction\" while a language model runs. It is the standard way to switch a behaviour such as refusal off, but it is erratic: on some models it barely fires, on others the text collapses into repetition. We show why, and fix it. At the last residual stream, ablation is exactly a logit bias: a fixed vocabulary footprint scaled by a gate, the cosine between the hidden state and the direction. The gate is measured from the origin, but last-layer states share a large common mode far from it, so a direction that overlaps the common mode fires on benign text and under-fires on its targets. Centered Ablation (CA) projects the common mode out of the direction, in closed form. Across 8 models, CA raises attack success by 29 and 46 points where the standard recipe under-fires, cuts collapse on Gemma-2-9B from 50\\% to 1\\%, and preserves 12 to 40 points more benign answers on high-overlap models, 39 to 46 more than the affine offset of prior work. Two numbers computed before generation predict, on models the analysis had not seen, which gain faithfulness and which gain attack success, and a collapse index marks when text degenerates. We also show that two standard safety judges score collapsed text in opposite directions, which can fabricate a 46-point effect.", "arxiv_id": "2611.20148", "arxiv_url": "https://arxiv.org/abs/2611.20148", "authors": ["Quy-Anh Dang", "Chris Ngo"], "brief": "\u7814\u7a76\u5c06\u672b\u5c42\u65b9\u5411\u6d88\u878d\u89e3\u91ca\u4e3a\u7531\u4f59\u5f26\u95e8\u63a7\u7f29\u653e\u7684\u56fa\u5b9a\u8bcd\u8868\u504f\u7f6e\uff0c\u5b9a\u4f4d\u5171\u540c\u6a21\u6001\u5bfc\u81f4\u7684\u8bef\u89e6\u53d1\u4e0e\u5931\u6548\uff0c\u5e76\u63d0\u51fa\u95ed\u5f0f\u6295\u5f71\u4fee\u6b63\u65b9\u6cd5\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/knoveleng/centered-ablation", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.20148", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Centered Ablation\u5c06\u5171\u540c\u6a21\u6001\u4ece\u884c\u4e3a\u65b9\u5411\u4e2d\u6295\u5f71\u53bb\u9664", "\u8de88\u6a21\u578b\u9a8c\u8bc1\uff0cGemma-2-9B\u5d29\u6e83\u7387\u753150%\u964d\u81f31%", "\u4e24\u79cd\u5b89\u5168\u8bc4\u5224\u5668\u5bf9\u5d29\u6e83\u6587\u672c\u8bc4\u5206\u76f8\u53cd\uff0c\u53ef\u5236\u902046\u4e2a\u767e\u5206\u70b9\u5dee\u5f02"], "keywords": ["\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u65b9\u5411\u6d88\u878d", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 4, "on_hf": true, "organization": "Knovel Engineering", "pdf_url": "https://arxiv.org/pdf/2611.20148v1", "published_at": "2026-11-15", "score": 0.245, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20148.png", "title": "Centered Ablation: Why Last-Layer Directional Ablation Under-Fires or Collapses, and a Closed-Form Fix", "tldr": "\u901a\u8fc7\u95ed\u5f0f\u53bb\u9664\u884c\u4e3a\u65b9\u5411\u7684\u5171\u540c\u6a21\u6001\uff0c\u4fee\u590d\u672b\u5c42\u6d88\u878d\u5931\u6548\u4e0e\u6587\u672c\u5d29\u6e83", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5c06\u672b\u5c42\u65b9\u5411\u6d88\u878d\u89e3\u91ca\u4e3a\u7531\u4f59\u5f26\u95e8\u63a7\u7f29\u653e\u7684\u56fa\u5b9a\u8bcd\u8868\u504f\u7f6e\uff0c\u5b9a\u4f4d\u5171\u540c\u6a21\u6001\u5bfc\u81f4\u7684\u8bef\u89e6\u53d1\u4e0e\u5931\u6548\uff0c\u5e76\u63d0\u51fa\u95ed\u5f0f\u6295\u5f71\u4fee\u6b63\u65b9\u6cd5\u3002", "why_notable": "\u628a\u884c\u4e3a\u5e72\u9884\u7684\u4e0d\u7a33\u5b9a\u6027\u5f52\u7ed3\u4e3a\u53ef\u89e3\u6790\u7684\u51e0\u4f55\u673a\u5236\uff0c\u5e76\u7528\u4f4e\u6210\u672c\u4fee\u6b63\u6539\u5584\u6548\u679c\uff1b\u540c\u65f6\u63ed\u793a\u6587\u672c\u5d29\u6e83\u53ef\u80fd\u4e25\u91cd\u626d\u66f2\u5b89\u5168\u8bc4\u6d4b\u3002"}, {"abstract": "Fine-tuning data can include metadata that predicts the correct answer, such as a reward-model score or a quality label. We ask whether a model learns to rely on this metadata even when every training label is correct. We fine-tune 7-9B open-weight models from three families on multiple-choice questions in which (Reward: 5) always marks the correct option; when this annotation is moved to a wrong option at test time, models select that option on 97-100% of CommonsenseQA items. Removing it leaves most answers correct, so evaluation without it misses the dependence. Cue-following rises sharply with training-time reliability and develops even with neutral or nonsense annotation words, although test-time wording affects its strength. A Qwen3 experiment also finds cue dependence in option-letter scores after direct preference optimization. Audits can test for this dependence by moving or removing visible annotations while holding the task and correct answer fixed.", "arxiv_id": "2611.04395", "arxiv_url": "https://arxiv.org/abs/2611.04395", "authors": ["Renee Jia", "Jinzhou Wu"], "brief": "\u7814\u7a76\u5728\u4e09\u7c7b\u5f00\u653e\u6743\u91cd\u6a21\u578b\u4e0a\u5fae\u8c03\u9009\u62e9\u9898\uff0c\u8ba9\u5956\u52b1\u6807\u8bb0\u59cb\u7ec8\u6307\u5411\u6b63\u786e\u9009\u9879\uff0c\u518d\u4e8e\u6d4b\u8bd5\u65f6\u79fb\u52a8\u6216\u5220\u9664\u6807\u8bb0\uff0c\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u628a\u5143\u6570\u636e\u5f53\u4f5c\u7b54\u9898\u6377\u5f84\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.04395", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4e09\u7c7b7\u20139B\u6a21\u578b\u5728\u6807\u8bb0\u79fb\u4f4d\u540e\uff0c97\u2013100%\u9009\u9519", "\u7ebf\u7d22\u4f9d\u8d56\u968f\u8bad\u7ec3\u53ef\u9760\u6027\u589e\u5f3a\uff0c\u65e0\u610f\u4e49\u8bcd\u4e5f\u80fd\u5f62\u6210", "Qwen3\u7ecfDPO\u540e\uff0c\u9009\u9879\u5b57\u6bcd\u8bc4\u5206\u4ecd\u5448\u7ebf\u7d22\u4f9d\u8d56"], "keywords": ["\u6a21\u578b\u53ef\u9760\u6027", "\u6570\u636e\u6377\u5f84", "\u5fae\u8c03", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Cornell University", "pdf_url": "https://arxiv.org/pdf/2611.04395v1", "published_at": "2026-11-03", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.04395.png", "title": "Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior", "tldr": "\u5373\u4f7f\u8bad\u7ec3\u6807\u7b7e\u5168\u5bf9\uff0c\u6a21\u578b\u4ecd\u4f1a\u4f9d\u8d56\u53ef\u9760\u5143\u6570\u636e\uff0c\u5e76\u88ab\u79fb\u4f4d\u6807\u8bb0\u8bf1\u5bfc\u9009\u9519", "upvotes": 2, "what_it_is": "\u7814\u7a76\u5728\u4e09\u7c7b\u5f00\u653e\u6743\u91cd\u6a21\u578b\u4e0a\u5fae\u8c03\u9009\u62e9\u9898\uff0c\u8ba9\u5956\u52b1\u6807\u8bb0\u59cb\u7ec8\u6307\u5411\u6b63\u786e\u9009\u9879\uff0c\u518d\u4e8e\u6d4b\u8bd5\u65f6\u79fb\u52a8\u6216\u5220\u9664\u6807\u8bb0\uff0c\u68c0\u9a8c\u6a21\u578b\u662f\u5426\u628a\u5143\u6570\u636e\u5f53\u4f5c\u7b54\u9898\u6377\u5f84\u3002", "why_notable": "\u63ed\u793a\u6b63\u786e\u6807\u7b7e\u5e76\u4e0d\u8db3\u4ee5\u4fdd\u8bc1\u53ef\u9760\u5b66\u4e60\uff1a\u5220\u9664\u6807\u8bb0\u7684\u5e38\u89c4\u8bc4\u6d4b\u53ef\u80fd\u6f0f\u68c0\u4f9d\u8d56\uff0c\u79fb\u52a8\u6807\u8bb0\u5219\u80fd\u66b4\u9732\u9690\u85cf\u7684\u884c\u4e3a\u63a7\u5236\u3002"}, {"abstract": "Unified multimodal models can support both visual understanding and generation, yet generative training does not necessarily improve understanding. We argue that this limitation may arise from a mismatch between the representation targeted by generation and the perceptual representation used for understanding. Conventional generation objectives primarily optimize synthesis-oriented spaces such as discrete visual codes or generative latents. We therefore introduce UMM-JEPA, which reformulates generation as progressive prediction of continuous visual-understanding representations. The model constructs a multi-scale representation hierarchy from coarse to fine, while pixel rendering is decoupled from representation pretraining and attached only afterward. Controlled comparisons show that the representation-prediction objective accounts for most of the understanding improvement, while a data-matched control leaves the group means nearly unchanged. UMM-JEPA reaches a 16-benchmark visual mean of 51.71, against 46.36 for the understanding-only Qwen-VL baseline, and the text mean also rises. Compared with discrete-code and latent-flow generation objectives, perceptual representation prediction yields stronger and more consistent transfer to understanding. Linear probes and visual-evidence interventions further reveal richer object and spatial structure and stronger use of image-specific information. These results suggest that generation can benefit understanding when it directly supervises the perceptual representations that understanding consumes.", "arxiv_id": "2611.18668", "arxiv_url": "https://arxiv.org/abs/2611.18668", "authors": ["Yucheng Zhou", "Yunjia Xi", "Di Yin", "Jianbing Shen"], "brief": "UMM-JEPA\u5c06\u751f\u6210\u8bad\u7ec3\u6539\u4e3a\u4ece\u7c97\u5230\u7ec6\u9884\u6d4b\u8fde\u7eed\u89c6\u89c9\u7406\u89e3\u8868\u5f81\uff0c\u6784\u5efa\u591a\u5c3a\u5ea6\u5c42\u7ea7\uff1b\u50cf\u7d20\u6e32\u67d3\u4e0e\u8868\u5f81\u9884\u8bad\u7ec3\u89e3\u8026\uff0c\u4ec5\u5728\u9884\u8bad\u7ec3\u540e\u63a5\u5165\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18668", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u63a9\u7801\u4e0b\u4e00\u5c3a\u5ea6\u8868\u5f81\u9884\u6d4b\uff0c\u66ff\u4ee3\u79bb\u6563\u7801\u6216\u6f5c\u53d8\u91cf\u751f\u6210", "16\u9879\u89c6\u89c9\u57fa\u51c6\u5747\u520651.71\uff0c\u7406\u89e3\u57fa\u7ebf\u4e3a46.36", "\u7ebf\u6027\u63a2\u9488\u4e0e\u89c6\u89c9\u8bc1\u636e\u5e72\u9884\u663e\u793a\u66f4\u4e30\u5bcc\u7684\u5bf9\u8c61\u548c\u7a7a\u95f4\u7ed3\u6784"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u751f\u6210\u5f0f\u9884\u8bad\u7ec3", "\u89c6\u89c9\u7406\u89e3", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.18668v1", "published_at": "2026-10-26", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18668.png", "title": "UMM-JEPA: Generative Pretraining via Masked Next-Scale Representation Prediction for Unified Multimodal Models", "tldr": "\u4ee5\u591a\u5c3a\u5ea6\u611f\u77e5\u8868\u5f81\u9884\u6d4b\u66ff\u4ee3\u4f20\u7edf\u751f\u6210\u76ee\u6807\uff0c\u8ba9\u751f\u6210\u9884\u8bad\u7ec3\u6709\u6548\u63d0\u5347\u591a\u6a21\u6001\u7406\u89e3", "upvotes": 2, "what_it_is": "UMM-JEPA\u5c06\u751f\u6210\u8bad\u7ec3\u6539\u4e3a\u4ece\u7c97\u5230\u7ec6\u9884\u6d4b\u8fde\u7eed\u89c6\u89c9\u7406\u89e3\u8868\u5f81\uff0c\u6784\u5efa\u591a\u5c3a\u5ea6\u5c42\u7ea7\uff1b\u50cf\u7d20\u6e32\u67d3\u4e0e\u8868\u5f81\u9884\u8bad\u7ec3\u89e3\u8026\uff0c\u4ec5\u5728\u9884\u8bad\u7ec3\u540e\u63a5\u5165\u3002", "why_notable": "\u53d7\u63a7\u6bd4\u8f83\u8868\u660e\uff0c\u7406\u89e3\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u8868\u5f81\u9884\u6d4b\u76ee\u6807\uff0c\u800c\u975e\u6570\u636e\u53d8\u5316\uff0c\u4e3a\u7edf\u4e00\u6a21\u578b\u4e2d\u751f\u6210\u4e0e\u7406\u89e3\u7684\u534f\u540c\u8bad\u7ec3\u63d0\u4f9b\u4e86\u5177\u4f53\u8def\u5f84\u3002"}, {"abstract": "Robots in homes, warehouses and farms must pick up objects they have never seen, usually without a 3D model or a category label. A grasping policy that works directly on the point cloud from a depth sensor needs only the geometry the robot observes, so it applies to any new object. Offline grasp generators such as Contact-GraspNet work this way, but they rank grasps by learned plausibility rather than by whether the grasp actually lifts the object. Reinforcement learning (RL) can optimize for that directly and make a point-cloud grasping policy much better on average, yet it leaves specific grasps persistently unsolved. We present a human-in-the-loop failure loop that targets those grasps: situations an RL policy keeps failing are mined automatically, sent to a virtual-reality application where a person picks the object up with their own hands, and returned to training as two grasp points. The person contributes only where to grasp; the robot chooses its own approach. In simulation, RL raises success on unseen objects from 55% with Contact-GraspNet to 83%. Adding 58 human demonstrations nearly doubles success on the hard cases RL kept failing, from 24% to 45%, and recovers performance that RL alone loses on similar cases that were never demonstrated, without reducing success on unseen objects.", "arxiv_id": "2611.18919", "arxiv_url": "https://arxiv.org/abs/2611.18919", "authors": ["Achyuthan Unni Krishnan", "Karthik Rengarajan", "Bharath Narasimhan", "Chris von Csefalvay"], "brief": "\u63d0\u51fa\u4eba\u7c7b\u53c2\u4e0e\u7684\u6293\u53d6\u5931\u8d25\u4fee\u6b63\u95ed\u73af\uff1a\u81ea\u52a8\u6316\u6398\u5f3a\u5316\u5b66\u4e60\u53cd\u590d\u5931\u8d25\u7684\u573a\u666f\uff0c\u5728\u865a\u62df\u73b0\u5b9e\u4e2d\u91c7\u96c6\u4eba\u7c7b\u53cc\u6293\u53d6\u70b9\u793a\u8303\u5e76\u56de\u6d41\u8bad\u7ec3\uff0c\u673a\u5668\u4eba\u81ea\u4e3b\u9009\u62e9\u63a5\u8fd1\u65b9\u5f0f\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18919", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4eff\u771f\u4e2d\u5f3a\u5316\u5b66\u4e60\u5c06\u672a\u89c1\u7269\u4f53\u6210\u529f\u7387\u4ece55%\u5347\u81f383%", "\u52a0\u516558\u4e2a\u4eba\u7c7b\u793a\u8303\uff0c\u987d\u56fa\u96be\u4f8b\u6210\u529f\u7387\u4ece24%\u5347\u81f345%", "\u6062\u590d\u672a\u793a\u8303\u76f8\u4f3c\u96be\u4f8b\u7684\u6027\u80fd\uff0c\u4e0d\u964d\u4f4e\u672a\u89c1\u7269\u4f53\u6210\u529f\u7387"], "keywords": ["\u673a\u5668\u4eba\u6293\u53d6", "\u70b9\u4e91", "\u5f3a\u5316\u5b66\u4e60", "\u4eba\u7c7b\u793a\u8303"], "num_comments": 2, "on_hf": true, "organization": " HCLTech Robotics", "pdf_url": "https://arxiv.org/pdf/2611.18919v1", "published_at": "2026-11-13", "score": 0.233, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18919.png", "title": "Correcting Persistent Failures in Point-Cloud Grasping Policies using Human Demonstrations in Virtual Reality", "tldr": "\u901a\u8fc7\u865a\u62df\u73b0\u5b9e\u4eba\u7c7b\u793a\u8303\u4fee\u6b63\u70b9\u4e91\u6293\u53d6\u7b56\u7565\u7684\u987d\u56fa\u5931\u8d25\uff0c\u63d0\u5347\u96be\u4f8b\u6210\u529f\u7387\u3002", "upvotes": 6, "what_it_is": "\u63d0\u51fa\u4eba\u7c7b\u53c2\u4e0e\u7684\u6293\u53d6\u5931\u8d25\u4fee\u6b63\u95ed\u73af\uff1a\u81ea\u52a8\u6316\u6398\u5f3a\u5316\u5b66\u4e60\u53cd\u590d\u5931\u8d25\u7684\u573a\u666f\uff0c\u5728\u865a\u62df\u73b0\u5b9e\u4e2d\u91c7\u96c6\u4eba\u7c7b\u53cc\u6293\u53d6\u70b9\u793a\u8303\u5e76\u56de\u6d41\u8bad\u7ec3\uff0c\u673a\u5668\u4eba\u81ea\u4e3b\u9009\u62e9\u63a5\u8fd1\u65b9\u5f0f\u3002", "why_notable": "\u5c11\u91cf\u4eba\u7c7b\u793a\u8303\u53ef\u5b9a\u5411\u8865\u8db3\u5f3a\u5316\u5b66\u4e60\u7684\u987d\u56fa\u76f2\u70b9\uff0c\u5e76\u8fc1\u79fb\u5230\u672a\u793a\u8303\u7684\u76f8\u4f3c\u96be\u4f8b\uff0c\u4e3a\u673a\u5668\u4eba\u6293\u53d6\u63d0\u4f9b\u9ad8\u6548\u7ea0\u9519\u8def\u5f84\u3002"}, {"abstract": "Visual agents answer questions about ultra-high-resolution photos by zooming into the relevant regions. However, existing agents often answer from common sense instead of reading the evidence. Reinforcement learning (RL) on the final answer cannot correct this, because a guess earns the same reward as reading. We propose Cross-Input Relative Policy Optimization (CrossRPO), which trains agents on contrast sets. A contrast set asks one question about several versions of an image that differ only in a small region with the evidence and have different answers, so only reading the evidence solves the whole set. CrossRPO rewards solving the whole set, and we prove that it does not reinforce a set answered from common sense. We build contrast sets for training (ViRA-Train) and evaluation (ViRA-Bench) by editing one small object in images of 21 to 120 megapixels, and we photograph further sets with real changes (ViRA-Bench-Real) to exclude editing traces. We train two Visual Reasoning Agents, ViRA-9B and ViRA-27B, with CrossRPO on only about 3,500 items of ViRA-Train each. CrossRPO achieves 63.3% set accuracy on ViRA-Bench at the maximum resolution, against 59.3% for GRPO. ViRA-9B is the most accurate open model of its size on all benchmarks, and ViRA-27B outperforms Claude Haiku 5.5 and GPT-6-Luna, both at their highest thinking level, on most benchmarks.", "arxiv_id": "2611.21605", "arxiv_url": "https://arxiv.org/abs/2611.21605", "authors": ["Huawei Lin", "Jinting Liu", "Tongyan Wang", "Xuyang Chen", "Ruihua Shi", "Zhichao Xu", "Jiaxin Qin", "Guoshenghui Zhao", "Baijian Yang", "Yingjie Victor Chen", "Tan Yu", "Weijie Zhao"], "brief": "\u63d0\u51faCrossRPO\uff0c\u8ba9\u667a\u80fd\u4f53\u56de\u7b54\u4ec5\u5c40\u90e8\u8bc1\u636e\u4e0d\u540c\u7684\u4e00\u7ec4\u56fe\u50cf\uff0c\u5e76\u6309\u6574\u7ec4\u7b54\u5bf9\u7ed9\u4e88\u5956\u52b1\u3002\u901a\u8fc7\u7f16\u8f91\u56fe\u50cf\u4e0e\u771f\u5b9e\u62cd\u6444\u6784\u5efa\u6570\u636e\uff0c\u8bad\u7ec3\u548c\u8bc4\u4f30\u4e3b\u52a8\u653e\u5927\u67e5\u8bc1\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/huawei-lin/ViRA", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.21605", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["CrossRPO\u5956\u52b1\u6574\u7ec4\u7b54\u5bf9\uff0c\u7406\u8bba\u8bc1\u660e\u4e0d\u5f3a\u5316\u5e38\u8bc6\u731c\u6d4b", "\u56fe\u50cf\u4e3a2100\u4e07\u81f31.2\u4ebf\u50cf\u7d20\uff0c\u6bcf\u4e2a\u6a21\u578b\u4ec5\u7528\u7ea63500\u6761\u8bad\u7ec3", "ViRA-Bench\u6574\u7ec4\u51c6\u786e\u738763.3%\uff0cGRPO\u4e3a59.3%"], "keywords": ["\u89c6\u89c9\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf", "\u5bf9\u7167\u8bc4\u4f30"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21605v1", "published_at": "2026-11-16", "score": 0.232, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21605.png", "title": "ViRA: Toward Ultra-High-Resolution Visual Agents via Cross-Input Relative Policy Optimization", "tldr": "\u901a\u8fc7\u8de8\u56fe\u50cf\u5bf9\u7167\u5956\u52b1\uff0c\u8bad\u7ec3\u8d85\u9ad8\u5206\u8fa8\u7387\u89c6\u89c9\u667a\u80fd\u4f53\u8bfb\u53d6\u5c40\u90e8\u8bc1\u636e\u800c\u975e\u731c\u7b54\u6848\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51faCrossRPO\uff0c\u8ba9\u667a\u80fd\u4f53\u56de\u7b54\u4ec5\u5c40\u90e8\u8bc1\u636e\u4e0d\u540c\u7684\u4e00\u7ec4\u56fe\u50cf\uff0c\u5e76\u6309\u6574\u7ec4\u7b54\u5bf9\u7ed9\u4e88\u5956\u52b1\u3002\u901a\u8fc7\u7f16\u8f91\u56fe\u50cf\u4e0e\u771f\u5b9e\u62cd\u6444\u6784\u5efa\u6570\u636e\uff0c\u8bad\u7ec3\u548c\u8bc4\u4f30\u4e3b\u52a8\u653e\u5927\u67e5\u8bc1\u7684\u89c6\u89c9\u667a\u80fd\u4f53\u3002", "why_notable": "\u5c06\u5956\u52b1\u4ece\u5355\u9898\u6b63\u786e\u8f6c\u5411\u8de8\u56fe\u50cf\u8bc1\u636e\u4e00\u81f4\u6027\uff0c\u9488\u5bf9\u6027\u7f13\u89e3\u89c6\u89c9\u667a\u80fd\u4f53\u51ed\u5e38\u8bc6\u731c\u6d4b\u7684\u95ee\u9898\uff1b\u771f\u5b9e\u62cd\u6444\u5bf9\u7167\u96c6\u8fdb\u4e00\u6b65\u6392\u9664\u7f16\u8f91\u75d5\u8ff9\u5e72\u6270\u3002"}, {"abstract": "High-resolution brain MRI is important for neuroradiological assessment, yet routine clinical protocols often rely on fast, anisotropic 2D acquisitions, particularly in resource-constrained settings. These acquisitions may differ in orientation, alignment and anatomical coverage, resulting in partially overlapping image stacks. Existing learning-based super-resolution methods typically rely on single, under-constrained inputs or fixed multi-stack configurations with idealised acquisition geometry. We introduce MS-HVED, a sequence-agnostic framework for flexible multi-stack brain MRI super-resolution. Available axial, coronal and sagittal stacks are independently encoded into multi-scale Gaussian posteriors and fused using a field-of-view-aware Product-of-Gaussians formulation that limits contributions from unsupported regions. Physics-informed domain randomisation simulates heterogeneous clinical acquisition conditions, including obliqueness, partial coverage and imaging artefacts. MS-HVED achieved competitive or superior reconstruction fidelity across synthetic benchmarks and improved downstream tissue segmentation relative to low-resolution inputs. To assess generalisation beyond the training cohorts, we performed external clinical validation on 30 routine brain MRI examinations from a Nigerian cohort, representing an under-represented population in medical imaging research. These examinations formed the largest component of a blinded reader study involving 44 real cases and seven expert neuroradiologists. In the Nigerian cohort, MS-HVED was preferred over the supervised baseline for overall image quality in 187 of 210 paired assessments. Across all clinical cohorts, MS-HVED achieved higher overall-quality scores with all available inputs (5.93 vs. 4.49, p\u003c.001), with the preference persisting when axial or coronal inputs were omitted (p\u003c.001). Code at github.com/cai4cai/ms-hved", "arxiv_id": "2611.21412", "arxiv_url": "https://arxiv.org/abs/2611.21412", "authors": ["Kabir Hamzah Muhammad", "Lorena Garcia-Foncillas Macias", "Soumya Snigdha Kundu", "Emily Guilhem", "Jon Cleary", "Amal Saleh Nour", "Yodit Abraham Yaynishet", "Chinasa Kalaiwo", "Peter Chibuta", "Ugumba Kwikima", "Udunna Anazodo", "Jonathan Shapey", "Tom Vercauteren"], "brief": "MS-HVED\u5c06\u4e0d\u540c\u65b9\u5411\u7684\u8111MRI\u56fe\u50cf\u6808\u72ec\u7acb\u7f16\u7801\u4e3a\u591a\u5c3a\u5ea6\u9ad8\u65af\u540e\u9a8c\uff0c\u518d\u6309\u89c6\u91ce\u878d\u5408\uff1b\u901a\u8fc7\u7269\u7406\u5f15\u5bfc\u7684\u57df\u968f\u673a\u5316\uff0c\u9002\u5e94\u503e\u659c\u3001\u90e8\u5206\u8986\u76d6\u4e0e\u4f2a\u5f71\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/cai4cai/ms-hved", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.21412", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u89c6\u91ce\u611f\u77e5Product-of-Gaussians\u9650\u5236\u65e0\u8986\u76d6\u533a\u57df\u8d21\u732e", "\u76f2\u8bc4\u6db5\u76d644\u4f8b\u771f\u5b9e\u75c5\u4f8b\u30017\u540d\u795e\u7ecf\u653e\u5c04\u4e13\u5bb6", "\u5c3c\u65e5\u5229\u4e9a\u961f\u5217210\u6b21\u914d\u5bf9\u8bc4\u4f30\u4e2d187\u6b21\u504f\u597d\u8be5\u65b9\u6cd5"], "keywords": ["\u8111\u78c1\u5171\u632f", "\u8d85\u5206\u8fa8\u7387", "\u591a\u89c6\u89d2\u878d\u5408", "\u4e34\u5e8a\u9a8c\u8bc1"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21412v1", "published_at": "2026-11-16", "score": 0.231, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21412.png", "title": "Flexible Multi-Stack Super-Resolution of Clinical Brain MRI Using Hetero-Orientation Variational Encoding: Expert Reader Evaluation in a Nigerian Cohort", "tldr": "\u7075\u6d3b\u878d\u5408\u4e0d\u540c\u65b9\u5411\u4e0e\u8986\u76d6\u8303\u56f4\u7684\u8111MRI\uff0c\u63d0\u5347\u91cd\u5efa\u8d28\u91cf\u5e76\u83b7\u4e13\u5bb6\u8ba4\u53ef\u3002", "upvotes": 1, "what_it_is": "MS-HVED\u5c06\u4e0d\u540c\u65b9\u5411\u7684\u8111MRI\u56fe\u50cf\u6808\u72ec\u7acb\u7f16\u7801\u4e3a\u591a\u5c3a\u5ea6\u9ad8\u65af\u540e\u9a8c\uff0c\u518d\u6309\u89c6\u91ce\u878d\u5408\uff1b\u901a\u8fc7\u7269\u7406\u5f15\u5bfc\u7684\u57df\u968f\u673a\u5316\uff0c\u9002\u5e94\u503e\u659c\u3001\u90e8\u5206\u8986\u76d6\u4e0e\u4f2a\u5f71\u3002", "why_notable": "\u65e0\u9700\u56fa\u5b9a\u591a\u6808\u914d\u7f6e\uff0c\u9002\u914d\u8d44\u6e90\u53d7\u9650\u573a\u666f\u4e2d\u7684\u5f02\u8d28\u91c7\u96c6\uff1b\u5916\u90e8\u4e34\u5e8a\u76f2\u8bc4\u652f\u6301\u5176\u8d28\u91cf\u4f18\u52bf\uff0c\u7f3a\u5c11\u90e8\u5206\u65b9\u5411\u8f93\u5165\u65f6\u4f18\u52bf\u4ecd\u4fdd\u6301\u3002"}, {"abstract": "Can a vision-language model look at a picture of a chain reaction and tell what will happen? Recent multimodal models describe scenes fluently and solve textbook physics problems, which suggests they should also predict how a scene of ramps, ledges, pendulums, seesaws and dominoes plays out once a ball is pushed. We tested this claim on 30 models from 10 families and reached a clear conclusion: unaided, no model predicts the outcome reliably. We built DominoBench, a benchmark of still images of 2D rigid-body scenes whose outcome a physics simulator computes. It holds 854 items in 427 minimal pairs, in which a change of one to three grid steps in one quantity decides whether one person survives, and every item comes with a four-rung hint ladder ending in the exact calculation that decides the outcome. Unaided, frontier models from Anthropic, Google and OpenAI are right about the person whose fate flips in at most 72% of items and answer both twins of a pair correctly in at most 34%. Pointing at the deciding step helps little, and exact geometry given as text barely helps, yet once the deciding calculation and the quantities it needs, including speeds that a still image cannot show, are written out, the same models reach 82-92% on the deciding person, while small open-weight models stay near chance. Physical prediction from a still image therefore fails at the quantitative step: the strongest models use the deciding quantity when they are given it, but do not produce it on their own. For models that plan or act in the physical world, a fluent account of a scene is thus no evidence of a correct prediction: such models must find and compute the deciding quantity unprompted, and DominoBench tests whether they do.", "arxiv_id": "2611.20385", "arxiv_url": "https://arxiv.org/abs/2611.20385", "authors": ["Emilio Ferrara"], "brief": "\u6784\u5efa\u7531\u7269\u7406\u6a21\u62df\u5668\u5224\u5b9a\u7ed3\u679c\u7684\u4e8c\u7ef4\u573a\u666f\u57fa\u51c6\uff0c\u7528\u5fae\u5c0f\u51e0\u4f55\u53d8\u5316\u5f62\u6210\u6210\u5bf9\u6837\u672c\uff0c\u5e76\u8bbe\u7f6e\u56db\u7ea7\u63d0\u793a\uff0c\u5b9a\u4f4d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9884\u6d4b\u8fde\u9501\u53cd\u5e94\u7684\u5931\u8d25\u73af\u8282\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20385", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["DominoBench\u542b854\u9898\u3001427\u7ec4\u6700\u5c0f\u5dee\u5f02\u5bf9\uff0c\u6d4b\u8bd530\u4e2a\u6a21\u578b\u3002", "\u65e0\u63d0\u793a\u65f6\uff0c\u524d\u6cbf\u6a21\u578b\u5173\u952e\u4eba\u7269\u5224\u65ad\u6700\u9ad872%\uff0c\u6210\u5bf9\u5168\u5bf9\u6700\u9ad834%\u3002", "\u7ed9\u51fa\u51b3\u5b9a\u6027\u8ba1\u7b97\u53ca\u6240\u9700\u91cf\u540e\uff0c\u5f3a\u6a21\u578b\u51c6\u786e\u7387\u5347\u81f382%\u201492%\u3002"], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u7269\u7406\u63a8\u7406", "\u89c6\u89c9\u7406\u89e3", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "University of Southern California", "pdf_url": "https://arxiv.org/pdf/2611.20385v1", "published_at": "2026-11-16", "score": 0.229, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20385.png", "title": "DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images", "tldr": "\u9759\u6001\u56fe\u50cf\u8fde\u9501\u53cd\u5e94\u6d4b\u8bd5\u63ed\u793a\uff0c\u591a\u6a21\u6001\u6a21\u578b\u96be\u4ee5\u81ea\u4e3b\u7b97\u51fa\u51b3\u5b9a\u7269\u7406\u7ed3\u679c\u7684\u5173\u952e\u91cf\u3002", "upvotes": 5, "what_it_is": "\u6784\u5efa\u7531\u7269\u7406\u6a21\u62df\u5668\u5224\u5b9a\u7ed3\u679c\u7684\u4e8c\u7ef4\u573a\u666f\u57fa\u51c6\uff0c\u7528\u5fae\u5c0f\u51e0\u4f55\u53d8\u5316\u5f62\u6210\u6210\u5bf9\u6837\u672c\uff0c\u5e76\u8bbe\u7f6e\u56db\u7ea7\u63d0\u793a\uff0c\u5b9a\u4f4d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9884\u6d4b\u8fde\u9501\u53cd\u5e94\u7684\u5931\u8d25\u73af\u8282\u3002", "why_notable": "\u5c06\u6d41\u7545\u573a\u666f\u63cf\u8ff0\u4e0e\u53ef\u9760\u7269\u7406\u9884\u6d4b\u533a\u5206\u5f00\uff0c\u6307\u51fa\u5173\u952e\u74f6\u9888\u5728\u81ea\u4e3b\u83b7\u53d6\u5e76\u8ba1\u7b97\u51b3\u5b9a\u6027\u7269\u7406\u91cf\uff0c\u4e3a\u73b0\u5b9e\u4e16\u754c\u89c4\u5212\u6a21\u578b\u63d0\u4f9b\u9488\u5bf9\u6027\u8bc4\u6d4b\u3002"}, {"abstract": "Looped Transformers improve parameter efficiency by repeatedly applying the same Transformer layers. During autoregressive decoding, however, generating each token requires several sequential passes through these layers, leading to high decoding latency. Pipelined self-speculative methods use shallow-loop predictions to process tokens at different loops in the same batch, but each token must reach the drafting depth before the next can enter the pipeline. We introduce LoopFill, a training-free speculative decoding algorithm for looped LLM that combines multi-token suffix drafts with shallow-loop predictions in a single draft tree. Both drafters contribute to one tree, so a suffix lookup can immediately extend a shallow prediction and several future tokens can enter the pipeline together. The shared block computes the highest-scoring draft candidates at different loop depths in one batch, and full-depth verification preserves the model\u0027s autoregressive output distribution. Across seven benchmarks, LoopFill\u0027s average speedup over greedy autoregressive decoding is $5.85\\times$ on Ouro-2.6B and $5.13\\times$ on Huginn-3.5B. The speedups exceed those of LoopAhead, the strongest baseline, by \\(40\\%\\) on Ouro-2.6B and \\(25\\%\\) on Huginn-3.5B.", "arxiv_id": "2611.19649", "arxiv_url": "https://arxiv.org/abs/2611.19649", "authors": ["Siqi Zhu", "Suozhi Huang", "Yi Zhao", "Jiaxuan You"], "brief": "LoopFill\u662f\u65e0\u9700\u8bad\u7ec3\u7684\u5faa\u73af\u6a21\u578b\u63a8\u6d4b\u89e3\u7801\u7b97\u6cd5\uff0c\u5c06\u540e\u7f00\u591a\u8bcd\u8349\u7a3f\u4e0e\u6d45\u5faa\u73af\u9884\u6d4b\u5408\u5165\u540c\u4e00\u8349\u7a3f\u6811\uff0c\u6279\u91cf\u5904\u7406\u4e0d\u540c\u5faa\u73af\u6df1\u5ea6\u7684\u5019\u9009\uff0c\u518d\u4ee5\u5b8c\u6574\u6df1\u5ea6\u9a8c\u8bc1\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.19649", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u540e\u7f00\u67e5\u627e\u76f4\u63a5\u6269\u5c55\u6d45\u5c42\u9884\u6d4b\uff0c\u591a\u8bcd\u540c\u65f6\u8fdb\u5165\u6d41\u6c34\u7ebf", "\u4e03\u9879\u57fa\u51c6\u5e73\u5747\u52a0\u901f\uff1aOuro\u4e3a5.85\u500d\uff0cHuginn\u4e3a5.13\u500d", "\u8f83LoopAhead\u5206\u522b\u591a\u63d0\u901f40%\u548c25%"], "keywords": ["\u63a8\u6d4b\u89e3\u7801", "\u5faa\u73af\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 2, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2611.19649v1", "published_at": "2026-11-14", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19649.png", "title": "LoopFill: Pipelined Multi-Token Speculative Decoding for Looped Transformers", "tldr": "\u878d\u5408\u540e\u7f00\u591a\u8bcd\u8349\u7a3f\u4e0e\u6d45\u5c42\u9884\u6d4b\uff0c\u8ba9\u5faa\u73af\u8bed\u8a00\u6a21\u578b\u5e76\u884c\u89e3\u7801\u63d0\u901f\u4e14\u4fdd\u6301\u8f93\u51fa\u5206\u5e03\u3002", "upvotes": 4, "what_it_is": "LoopFill\u662f\u65e0\u9700\u8bad\u7ec3\u7684\u5faa\u73af\u6a21\u578b\u63a8\u6d4b\u89e3\u7801\u7b97\u6cd5\uff0c\u5c06\u540e\u7f00\u591a\u8bcd\u8349\u7a3f\u4e0e\u6d45\u5faa\u73af\u9884\u6d4b\u5408\u5165\u540c\u4e00\u8349\u7a3f\u6811\uff0c\u6279\u91cf\u5904\u7406\u4e0d\u540c\u5faa\u73af\u6df1\u5ea6\u7684\u5019\u9009\uff0c\u518d\u4ee5\u5b8c\u6574\u6df1\u5ea6\u9a8c\u8bc1\u3002", "why_notable": "\u5b83\u7f13\u89e3\u5faa\u73af\u6a21\u578b\u9010\u8bcd\u591a\u6b21\u4e32\u884c\u8ba1\u7b97\u7684\u5ef6\u8fdf\uff0c\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u4e14\u4fdd\u6301\u81ea\u56de\u5f52\u8f93\u51fa\u5206\u5e03\uff0c\u4e3a\u53c2\u6570\u9ad8\u6548\u6a21\u578b\u63d0\u4f9b\u66f4\u5b9e\u7528\u7684\u63a8\u7406\u8def\u5f84\u3002"}, {"abstract": "When language models revise a decision after another agent disagrees, neither reversal counts nor final accuracy shows whether they are fixing mistakes or abandoning correct answers. We introduce a controlled two-pass audit that holds the question, the evidence, and the model\u0027s initial answer fixed and varies only the revision context: neutral reflection, anonymous disagreement, or disagreement attributed to a domain expert. For binary decisions the accounting is exact: revision raises accuracy only if it is selective enough, reversing wrong answers more than $a/(1-a)$ times as often as correct ones, where $a$ is initial accuracy (nine times at 90%). Across five models and 1,989 evidence-grounded decisions in medicine, science, and law, no model clears this bar under expert disagreement, and accuracy falls by up to 16.1 points. The expert label, a prestige cue, adds reversals for four of the five models, yet its effect on accuracy ranges from a 5.2-point loss to a 2.4-point gain, so reversal counts are a poor proxy for harm. With identical arguments from both sources, the label still raises reversal for three proprietary models and in a pooled analysis of four newer models. Models also respond to stated source reliability. Revision pipelines should therefore be evaluated with paired, conditional metrics, per model and protocol.", "arxiv_id": "2611.16694", "arxiv_url": "https://arxiv.org/abs/2611.16694", "authors": ["Yupeng Tang", "Mingfeng Lin"], "brief": "\u7814\u7a76\u7528\u53d7\u63a7\u4e24\u8f6e\u5ba1\u8ba1\u56fa\u5b9a\u95ee\u9898\u3001\u8bc1\u636e\u4e0e\u521d\u59cb\u7b54\u6848\uff0c\u4ec5\u6539\u53d8\u4e2d\u7acb\u53cd\u601d\u3001\u533f\u540d\u5f02\u8bae\u6216\u4e13\u5bb6\u5f02\u8bae\u60c5\u5883\uff0c\u533a\u5206\u7ea0\u6b63\u9519\u8bef\u4e0e\u653e\u5f03\u6b63\u786e\u7b54\u6848\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/yupengtang/when-expert-disagreement-hurts", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2611.16694", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d65\u4e2a\u6a21\u578b\u30011989\u9879\u533b\u5b66\u3001\u79d1\u5b66\u4e0e\u6cd5\u5f8b\u51b3\u7b56", "\u521d\u59cb\u51c6\u786e\u738790%\u65f6\uff0c\u7ea0\u9519\u7387\u987b\u8d85\u8fc7\u6539\u9519\u73879\u500d", "\u4e13\u5bb6\u5f02\u8bae\u4e0b\u65e0\u6a21\u578b\u8fbe\u5230\u9009\u62e9\u6027\u95e8\u69db\uff0c\u51c6\u786e\u7387\u6700\u591a\u964d16.1\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u51b3\u7b56\u4fee\u8ba2", "\u6743\u5a01\u504f\u5dee", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "Georgia Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2611.16694v1", "published_at": "2026-11-12", "score": 0.223, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16694.png", "title": "When Expert Disagreement Hurts: Prestige and Selectivity in LLM Decision Revision", "tldr": "\u4e13\u5bb6\u5f02\u8bae\u53ef\u80fd\u8ba9\u6a21\u578b\u653e\u5f03\u6b63\u786e\u7b54\u6848\uff0c\u4fee\u8ba2\u662f\u5426\u6709\u6548\u53d6\u51b3\u4e8e\u7ea0\u9519\u9009\u62e9\u6027\u3002", "upvotes": 2, "what_it_is": "\u7814\u7a76\u7528\u53d7\u63a7\u4e24\u8f6e\u5ba1\u8ba1\u56fa\u5b9a\u95ee\u9898\u3001\u8bc1\u636e\u4e0e\u521d\u59cb\u7b54\u6848\uff0c\u4ec5\u6539\u53d8\u4e2d\u7acb\u53cd\u601d\u3001\u533f\u540d\u5f02\u8bae\u6216\u4e13\u5bb6\u5f02\u8bae\u60c5\u5883\uff0c\u533a\u5206\u7ea0\u6b63\u9519\u8bef\u4e0e\u653e\u5f03\u6b63\u786e\u7b54\u6848\u3002", "why_notable": "\u5c06\u7b54\u6848\u53cd\u8f6c\u62c6\u6210\u7ea0\u9519\u4e0e\u6539\u9519\uff0c\u63ed\u793a\u4e13\u5bb6\u6807\u7b7e\u5e26\u6765\u7684\u5a01\u671b\u504f\u5dee\uff1b\u4e3a\u6a21\u578b\u4fee\u8ba2\u6d41\u7a0b\u63d0\u4f9b\u6bd4\u53cd\u8f6c\u6b21\u6570\u66f4\u53ef\u9760\u7684\u914d\u5bf9\u6761\u4ef6\u6307\u6807\u3002"}, {"abstract": "The task of dataset distillation concerns the learning of a small set of synthetic samples that can serve as an effective replacement for a large real dataset when used for downstream tasks. While many solutions have been proposed since the problem\u0027s inception, most of them primarily seek to optimize the distilled data with respect to a classifier. In this work, we propose a new distillation method that learns a set of samples such that they directly approximate the per-class data distribution. Specifically, we \"drift\" our distilled data in the latent space of a feature extractor such that they move both toward the real data and away from each other without using a classification objective. We find that our drifted data cover the real distribution significantly better than existing methods while still serving as powerful training samples for classification. Furthermore, we showcase our method\u0027s use as a visualization tool for better interpreting models and extend it beyond images to other modalities. Our work advances the frontier of dataset distillation, offering a novel synthesis method and proposing distribution-based metrics as a complementary evaluation. More broadly, our findings help address the growing need to understand both data and models by uncovering more about how they interact.", "arxiv_id": "2611.16642", "arxiv_url": "https://arxiv.org/abs/2611.16642", "authors": ["George Cazenavette", "Angelina Quan", "Giannis Daras", "Antonio Torralba", "Vincent Sitzmann"], "brief": "\u63d0\u51fa\u76f4\u63a5\u903c\u8fd1\u5404\u7c7b\u522b\u6570\u636e\u5206\u5e03\u7684\u6570\u636e\u96c6\u84b8\u998f\u65b9\u6cd5\uff1a\u5728\u7279\u5f81\u63d0\u53d6\u5668\u7684\u6f5c\u7a7a\u95f4\u4e2d\uff0c\u8ba9\u5408\u6210\u6837\u672c\u9760\u8fd1\u771f\u5b9e\u6570\u636e\u3001\u5f7c\u6b64\u8fdc\u79bb\uff0c\u65e0\u9700\u5206\u7c7b\u76ee\u6807\u9a71\u52a8\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.16642", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6f5c\u7a7a\u95f4\u6f02\u79fb\u7ed3\u5408\u771f\u5b9e\u6570\u636e\u5438\u5f15\u4e0e\u5408\u6210\u6837\u672c\u95f4\u6392\u65a5", "\u5206\u5e03\u8986\u76d6\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u4ecd\u53ef\u6709\u6548\u8bad\u7ec3\u5206\u7c7b\u5668", "\u5f15\u5165\u5206\u5e03\u8bc4\u4ef7\u6307\u6807\uff0c\u5e76\u5c55\u793a\u6a21\u578b\u53ef\u89c6\u5316\u4e0e\u8de8\u6a21\u6001\u6269\u5c55"], "keywords": ["\u6570\u636e\u96c6\u84b8\u998f", "\u5408\u6210\u6570\u636e", "\u5206\u5e03\u5339\u914d", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.16642v1", "published_at": "2026-11-12", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.16642.png", "title": "Dataset Distillation via Drifting", "tldr": "\u901a\u8fc7\u6f5c\u7a7a\u95f4\u5438\u5f15\u4e0e\u6392\u65a5\u673a\u5236\u5408\u6210\u5c0f\u578b\u6570\u636e\u96c6\uff0c\u517c\u987e\u7c7b\u522b\u5206\u5e03\u8986\u76d6\u4e0e\u5206\u7c7b\u8bad\u7ec3\u6548\u679c\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u76f4\u63a5\u903c\u8fd1\u5404\u7c7b\u522b\u6570\u636e\u5206\u5e03\u7684\u6570\u636e\u96c6\u84b8\u998f\u65b9\u6cd5\uff1a\u5728\u7279\u5f81\u63d0\u53d6\u5668\u7684\u6f5c\u7a7a\u95f4\u4e2d\uff0c\u8ba9\u5408\u6210\u6837\u672c\u9760\u8fd1\u771f\u5b9e\u6570\u636e\u3001\u5f7c\u6b64\u8fdc\u79bb\uff0c\u65e0\u9700\u5206\u7c7b\u76ee\u6807\u9a71\u52a8\u3002", "why_notable": "\u5c06\u84b8\u998f\u91cd\u70b9\u4ece\u4f18\u5316\u5206\u7c7b\u5668\u8f6c\u5411\u8986\u76d6\u6570\u636e\u5206\u5e03\uff0c\u4e3a\u8bc4\u4f30\u5408\u6210\u6570\u636e\u63d0\u4f9b\u4e92\u8865\u89c6\u89d2\uff0c\u4e5f\u4e3a\u7406\u89e3\u6a21\u578b\u4e0e\u6570\u636e\u7684\u5173\u7cfb\u63d0\u4f9b\u5de5\u5177\u3002"}, {"abstract": "Scene text synthesis requires stroke-accurate characters rendered in a specified layout, as well as visual coherence with the surrounding scene. To achieve this, existing methods commonly pre-render the target text at its intended locations to form a glyph image that jointly specifies layout and glyph structure. However, this representation ties the resolution of each glyph to its target region, limiting fine-grained stroke guidance for small, densely packed, or structurally complex text. To tackle this, we propose GlyphAtlas, a scene text synthesis framework that retains the glyph image as a spatial anchor and supplies fine-grained stroke references through a dedicated glyph atlas. The atlas renders and encodes each character or word in a separate cell, decoupling reference resolution from target-region size. We further introduce atlas-anchored attention, which lets each text region retrieve stroke detail only from its corresponding atlas cells to refine the coarse glyph structure provided by the glyph image. This coarse-to-fine conditioning simplifies stroke rendering while preserving explicit layout correspondence. We optimize GlyphAtlas with a mask-weighted flow matching objective and a timestep-weighted text perceptual loss for writing accuracy and background consistency. Random resolution augmentation of atlas cells supports adjustable atlas budgets at inference. Extensive experiments demonstrate that GlyphAtlas achieves stroke-accurate synthesis of small, dense, and structurally complex text, zero-shot transfer to languages unseen during task-specific training, and leading performance in scenes with many text regions. project page: https://fr0zencrane.github.io/project-glyphatlas/", "arxiv_id": "2611.20192", "arxiv_url": "https://arxiv.org/abs/2611.20192", "authors": ["Luozheng Qin", "Changhai Zhou", "Yiyi Zhou"], "brief": "\u8be5\u6846\u67b6\u4fdd\u7559\u5b57\u5f62\u56fe\u4f5c\u4e3a\u5e03\u5c40\u951a\u70b9\uff0c\u5c06\u5b57\u7b26\u6216\u8bcd\u72ec\u7acb\u6e32\u67d3\u5230\u56fe\u96c6\u5355\u5143\uff0c\u63d0\u4f9b\u9ad8\u5206\u8fa8\u7387\u7b14\u753b\u53c2\u8003\u3002\u56fe\u96c6\u951a\u5b9a\u6ce8\u610f\u529b\u8ba9\u6587\u672c\u533a\u57df\u4ec5\u68c0\u7d22\u5bf9\u5e94\u5355\u5143\uff0c\u5b9e\u73b0\u7c97\u5230\u7ec6\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Fr0zenCrane/GlyphAtlas", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.20192", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u72ec\u7acb\u56fe\u96c6\u5355\u5143\u4f7f\u7b14\u753b\u53c2\u8003\u5206\u8fa8\u7387\u4e0d\u53d7\u76ee\u6807\u533a\u57df\u5927\u5c0f\u9650\u5236", "\u56fe\u96c6\u951a\u5b9a\u6ce8\u610f\u529b\u7ea6\u675f\u6587\u672c\u533a\u57df\u4e0e\u53c2\u8003\u5355\u5143\u9010\u4e00\u5bf9\u5e94", "\u63a9\u7801\u52a0\u6743\u6d41\u5339\u914d\u4e0e\u65f6\u95f4\u6b65\u52a0\u6743\u6587\u672c\u611f\u77e5\u635f\u5931\u8054\u5408\u4f18\u5316"], "keywords": ["\u573a\u666f\u6587\u672c\u751f\u6210", "\u5b57\u5f62\u8868\u793a", "\u6ce8\u610f\u529b\u673a\u5236", "\u96f6\u6837\u672c\u8fc1\u79fb"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20192v1", "published_at": "2026-11-15", "score": 0.217, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20192.png", "title": "GlyphAtlas: Disentangling Stroke Detail from Layout for Scene Text Synthesis", "tldr": "\u901a\u8fc7\u72ec\u7acb\u5b57\u5f62\u56fe\u96c6\u89e3\u8026\u7b14\u753b\u7ec6\u8282\u4e0e\u7a7a\u95f4\u5e03\u5c40\uff0c\u63d0\u5347\u5c0f\u5b57\u53ca\u5bc6\u96c6\u6587\u672c\u7684\u751f\u6210\u7cbe\u5ea6\u3002", "upvotes": 2, "what_it_is": "\u8be5\u6846\u67b6\u4fdd\u7559\u5b57\u5f62\u56fe\u4f5c\u4e3a\u5e03\u5c40\u951a\u70b9\uff0c\u5c06\u5b57\u7b26\u6216\u8bcd\u72ec\u7acb\u6e32\u67d3\u5230\u56fe\u96c6\u5355\u5143\uff0c\u63d0\u4f9b\u9ad8\u5206\u8fa8\u7387\u7b14\u753b\u53c2\u8003\u3002\u56fe\u96c6\u951a\u5b9a\u6ce8\u610f\u529b\u8ba9\u6587\u672c\u533a\u57df\u4ec5\u68c0\u7d22\u5bf9\u5e94\u5355\u5143\uff0c\u5b9e\u73b0\u7c97\u5230\u7ec6\u751f\u6210\u3002", "why_notable": "\u9488\u5bf9\u5c0f\u5b57\u3001\u5bc6\u96c6\u548c\u590d\u6742\u5b57\u5f62\u7684\u7ec6\u8282\u74f6\u9888\u63d0\u4f9b\u76f4\u63a5\u89e3\u6cd5\uff0c\u5e76\u5c55\u793a\u672a\u89c1\u8bed\u8a00\u96f6\u6837\u672c\u8fc1\u79fb\u4e0e\u591a\u6587\u672c\u533a\u57df\u751f\u6210\u4f18\u52bf\u3002"}, {"abstract": "Long chain-of-thought (CoT) reasoning improves large vision--language models, but visual information often fades during generation, limiting long-horizon multimodal reasoning. Existing methods either re-inject vision at inference or train policies for stronger grounding, but where to intervene relies on perception heuristics rather than principled gain analysis, and how local visual influence propagates remains implicit. We study this problem from an information-theoretic standpoint and derive a lower bound on the downstream visual gain of a one-step intervention, which suggests two factors: local branching room (token entropy) and downstream visual propagation potential (suffix divergence from a vision-marginalized reference). Guided by this analysis, we propose reflection-anchor policy optimization (RAPO), a GRPO-based policy optimization method that selects high-entropy reflection anchors and optimizes a chain-masked finite-window KL surrogate for downstream visual dependence. Experiments on reasoning-intensive and general-domain benchmarks show that RAPO delivers substantial gains over strong baselines across multiple LVLM backbones. Mechanism analyses further indicate that reflection anchors are enriched for visually sensitive decision points and that RAPO increases contrastive visual-dependence signals along generated trajectories.", "arxiv_id": "2605.09614", "arxiv_url": "https://arxiv.org/abs/2605.09614", "authors": ["Xuan Gong", "Hanbo Huang", "Hao Zheng", "Yiran Zhang", "Wenbin Dai", "Weishu Zhao", "Shiyu Liang"], "brief": "\u63d0\u51fa\u57fa\u4e8eGRPO\u7684RAPO\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u7528\u9ad8\u71b5\u53cd\u601d\u951a\u70b9\u5b9a\u4f4d\u5e72\u9884\u4f4d\u7f6e\uff0c\u518d\u4ee5\u94fe\u63a9\u7801\u6709\u9650\u7a97\u53e3KL\u76ee\u6807\u5f3a\u5316\u540e\u7eed\u63a8\u7406\u5bf9\u89c6\u89c9\u4fe1\u606f\u7684\u4f9d\u8d56\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/coder-gx/RAPO", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2605.09614", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63a8\u5bfc\u5355\u6b65\u5e72\u9884\u7684\u4e0b\u6e38\u89c6\u89c9\u589e\u76ca\u4e0b\u754c", "\u4ee5\u8bcd\u5143\u71b5\u53ca\u53bb\u89c6\u89c9\u53c2\u8003\u7684\u540e\u7f00\u6563\u5ea6\u523b\u753b\u589e\u76ca", "RAPO\u5728\u591a\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u9aa8\u5e72\u4e0a\u4f18\u4e8e\u5f3a\u57fa\u7ebf"], "keywords": ["\u591a\u6a21\u6001\u63a8\u7406", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7b56\u7565\u4f18\u5316", "\u4fe1\u606f\u8bba"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2605.09614v2", "published_at": "2026-05-10", "score": 0.21, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2605.09614.png", "title": "Reflection Anchors for Propagation-Aware Visual Retention in Long-Chain Multimodal Reasoning", "tldr": "\u901a\u8fc7\u9ad8\u71b5\u53cd\u601d\u951a\u70b9\u4e0e\u4f20\u64ad\u611f\u77e5\u8bad\u7ec3\uff0c\u7f13\u89e3\u957f\u94fe\u591a\u6a21\u6001\u63a8\u7406\u4e2d\u7684\u89c6\u89c9\u9057\u5fd8\u3002", "upvotes": 1, "what_it_is": "\u63d0\u51fa\u57fa\u4e8eGRPO\u7684RAPO\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\uff0c\u7528\u9ad8\u71b5\u53cd\u601d\u951a\u70b9\u5b9a\u4f4d\u5e72\u9884\u4f4d\u7f6e\uff0c\u518d\u4ee5\u94fe\u63a9\u7801\u6709\u9650\u7a97\u53e3KL\u76ee\u6807\u5f3a\u5316\u540e\u7eed\u63a8\u7406\u5bf9\u89c6\u89c9\u4fe1\u606f\u7684\u4f9d\u8d56\u3002", "why_notable": "\u5c06\u89c6\u89c9\u4fdd\u6301\u4ece\u542f\u53d1\u5f0f\u5e72\u9884\u8f6c\u5411\u589e\u76ca\u5206\u6790\uff0c\u540c\u65f6\u8003\u8651\u5e72\u9884\u4f4d\u7f6e\u4e0e\u4fe1\u606f\u4f20\u64ad\uff0c\u4e3a\u957f\u94fe\u591a\u6a21\u6001\u63a8\u7406\u63d0\u4f9b\u66f4\u6709\u4f9d\u636e\u7684\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "Language models typically increase per-token computation through deeper or looped layers and latent reasoning steps, while richer residual connections improve information flow across layers. We instead increase computational capacity: the number of active computational states a model maintains. We introduce the Lattice of Latents, a set of per-layer horizontal latent streams that run recurrently along time, alongside the vertical residual stream that flows through depth. Like hyper-connections, mHC, and attention or value residuals, the Lattice enhances the residual stream, but rather than adding or rerouting residual pathways through depth, it provides companion computational states that persist across tokens. Unlike hybrid Transformer-SSM architectures, whose recurrent states primarily serve as internal memory for sequence mixing, these latents directly condition the vertical stream\u0027s attention, KV-cache writes, MLP computation, and decoding. On Transformers trained on 20B FineWeb-Edu tokens, a 406M-parameter Lattice model lowers validation perplexity from 15.41 to 14.40 over a parameter-matched Transformer. These gains extend across architectural variants. The Lattice composes with prior residual-stream enhancements: with hyper-connections and input residuals, it lowers validation perplexity from 15.41 (base Transformer) and 14.22 (Transformer with the same enhancements) to 13.61. On Gated DeltaNet, Mamba-2, Triadic GDN, and GDN-Mamba-2 hybrids, it improves perplexity at every tested native state size, with Lattice-GDN and Lattice-Triadic-GDN variants outperforming pure baselines with 4x larger native states. These results identify persistent per-layer state as a complementary axis for scaling language-model computation.", "arxiv_id": "2611.21608", "arxiv_url": "https://arxiv.org/abs/2611.21608", "authors": ["Shivam Duggal", "Zongze Wu", "William T. Freeman", "Antonio Torralba", "Richard Zhang", "Eli Shechtman"], "brief": "\u63d0\u51fa\u6f5c\u5728\u72b6\u6001\u683c\uff0c\u5728\u6bcf\u5c42\u52a0\u5165\u6cbf\u65f6\u95f4\u9012\u5f52\u7684\u6a2a\u5411\u6f5c\u5728\u6d41\uff0c\u4e0e\u7eb5\u5411\u6b8b\u5dee\u6d41\u534f\u540c\u3002\u8fd9\u4e9b\u72b6\u6001\u76f4\u63a5\u8c03\u8282\u6ce8\u610f\u529b\u3001\u7f13\u5b58\u5199\u5165\u3001\u524d\u9988\u8ba1\u7b97\u4e0e\u89e3\u7801\uff0c\u800c\u975e\u4ec5\u5145\u5f53\u5e8f\u5217\u8bb0\u5fc6\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21608", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["20B\u8bcd\u5143\u8bad\u7ec3\u4e0b\uff0c406M\u6a21\u578b\u56f0\u60d1\u5ea6\u4ece15.41\u964d\u81f314.40", "\u53e0\u52a0\u8d85\u8fde\u63a5\u4e0e\u8f93\u5165\u6b8b\u5dee\uff0c\u56f0\u60d1\u5ea6\u4ece14.22\u964d\u81f313.61", "Lattice-GDN\u53d8\u4f53\u4f18\u4e8e\u539f\u751f\u72b6\u6001\u59274\u500d\u7684\u7eaf\u57fa\u7ebf"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u5faa\u73af\u72b6\u6001", "\u6b8b\u5dee\u8fde\u63a5", "\u6a21\u578b\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21608v1", "published_at": "2026-11-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Latent Lattice Language Models", "tldr": "\u901a\u8fc7\u8de8\u8bcd\u5143\u6301\u7eed\u8fd0\u884c\u7684\u9010\u5c42\u6f5c\u5728\u72b6\u6001\uff0c\u62d3\u5c55\u8bed\u8a00\u6a21\u578b\u8ba1\u7b97\u5bb9\u91cf\u5e76\u964d\u4f4e\u56f0\u60d1\u5ea6\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u6f5c\u5728\u72b6\u6001\u683c\uff0c\u5728\u6bcf\u5c42\u52a0\u5165\u6cbf\u65f6\u95f4\u9012\u5f52\u7684\u6a2a\u5411\u6f5c\u5728\u6d41\uff0c\u4e0e\u7eb5\u5411\u6b8b\u5dee\u6d41\u534f\u540c\u3002\u8fd9\u4e9b\u72b6\u6001\u76f4\u63a5\u8c03\u8282\u6ce8\u610f\u529b\u3001\u7f13\u5b58\u5199\u5165\u3001\u524d\u9988\u8ba1\u7b97\u4e0e\u89e3\u7801\uff0c\u800c\u975e\u4ec5\u5145\u5f53\u5e8f\u5217\u8bb0\u5fc6\u3002", "why_notable": "\u5c06\u6301\u7eed\u7684\u9010\u5c42\u72b6\u6001\u4f5c\u4e3a\u6a21\u578b\u6269\u5c55\u7684\u65b0\u7ef4\u5ea6\uff0c\u533a\u522b\u4e8e\u5355\u7eaf\u52a0\u6df1\u7f51\u7edc\u6216\u589e\u52a0\u63a8\u7406\u6b65\u9aa4\uff1b\u6536\u76ca\u53ef\u4e0e\u6b8b\u5dee\u589e\u5f3a\u53e0\u52a0\uff0c\u5e76\u8986\u76d6\u591a\u79cd\u67b6\u6784\u3002"}, {"abstract": "Abstention, the withholding of a response by a large language model (LLM) under uncertainty or safety risks, is essential for trustworthy models. The causes of abstention fall into three perspectives: ambiguity in the Query (Q), limits of Model Knowledge (MK), and misalignment with Human Values (HV). However, prior analyses of internal representations have focused on HV, using a refusal direction computed from harmful and harmless queries. No study has analyzed the three perspectives jointly. We therefore extend the refusal direction framework to all three perspectives. Specifically, for each perspective, we construct counterfactual pairs that share a template and differ only in the abstention-inducing factor, and compute an abstention direction by normalizing the difference in mean activations between the two polarities. Activation steering experiments show that intervening in middle layers increases or decreases abstention across all three perspectives. Moreover, steering yields cross-perspective effects, indicating that the abstention directions share a common directional component.", "arxiv_id": "2611.20441", "arxiv_url": "https://arxiv.org/abs/2611.20441", "authors": ["Koki Itai", "Jun Hirako", "Hiroaki Yamagiwa"], "brief": "\u5c06\u62d2\u7b54\u65b9\u5411\u6846\u67b6\u6269\u5c55\u5230\u67e5\u8be2\u6b67\u4e49\u3001\u77e5\u8bc6\u8fb9\u754c\u548c\u4ef7\u503c\u5bf9\u9f50\u4e09\u7c7b\u60c5\u5883\u3002\u901a\u8fc7\u540c\u6a21\u677f\u53cd\u4e8b\u5b9e\u6837\u672c\u5bf9\u7684\u5e73\u5747\u6fc0\u6d3b\u5dee\u63d0\u53d6\u65b9\u5411\uff0c\u518d\u7528\u6fc0\u6d3b\u5f15\u5bfc\u68c0\u9a8c\u5176\u4f5c\u7528\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20441", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53cd\u4e8b\u5b9e\u6837\u672c\u5bf9\u4ec5\u6539\u53d8\u8bf1\u53d1\u62d2\u7b54\u7684\u56e0\u7d20", "\u5f52\u4e00\u5316\u5e73\u5747\u6fc0\u6d3b\u5dee\uff0c\u63d0\u53d6\u4e09\u7c7b\u62d2\u7b54\u65b9\u5411", "\u4e2d\u95f4\u5c42\u6fc0\u6d3b\u5f15\u5bfc\u53ef\u589e\u51cf\u62d2\u7b54\uff0c\u5e76\u4ea7\u751f\u8de8\u60c5\u5883\u6548\u5e94"], "keywords": ["\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u62d2\u7b54\u884c\u4e3a", "\u6fc0\u6d3b\u5f15\u5bfc", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20441v1", "published_at": "2026-11-16", "score": 0.198, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20441.png", "title": "Abstention Direction in Large Language Models: Mechanistic Interpretability of Abstention Across Query Ambiguity, Knowledge Limits, and Safety Alignment", "tldr": "\u7814\u7a76\u53d1\u73b0\u6b67\u4e49\u3001\u77e5\u8bc6\u4e0d\u8db3\u4e0e\u5b89\u5168\u98ce\u9669\u4e0b\u7684\u6a21\u578b\u62d2\u7b54\u5171\u4eab\u5185\u90e8\u65b9\u5411\u6210\u5206\u3002", "upvotes": 1, "what_it_is": "\u5c06\u62d2\u7b54\u65b9\u5411\u6846\u67b6\u6269\u5c55\u5230\u67e5\u8be2\u6b67\u4e49\u3001\u77e5\u8bc6\u8fb9\u754c\u548c\u4ef7\u503c\u5bf9\u9f50\u4e09\u7c7b\u60c5\u5883\u3002\u901a\u8fc7\u540c\u6a21\u677f\u53cd\u4e8b\u5b9e\u6837\u672c\u5bf9\u7684\u5e73\u5747\u6fc0\u6d3b\u5dee\u63d0\u53d6\u65b9\u5411\uff0c\u518d\u7528\u6fc0\u6d3b\u5f15\u5bfc\u68c0\u9a8c\u5176\u4f5c\u7528\u3002", "why_notable": "\u628a\u5b89\u5168\u62d2\u7b54\u4e0e\u4e0d\u786e\u5b9a\u6027\u62d2\u7b54\u7eb3\u5165\u7edf\u4e00\u673a\u5236\u5206\u6790\uff0c\u8de8\u60c5\u5883\u5e72\u9884\u7ed3\u679c\u63d0\u793a\u5171\u4eab\u65b9\u5411\u6210\u5206\uff0c\u4e3a\u7406\u89e3\u548c\u8c03\u63a7\u62d2\u7b54\u884c\u4e3a\u63d0\u4f9b\u7ebf\u7d22\u3002"}, {"abstract": "In particle physics, discrepancies between experimental measurements and Standard Model (SM) predictions are commonly interpreted within new theoretical models. In this context, the Standard Model Effective Field Theory (SMEFT) provides a general framework encompassing a broad class of models. However, exploring the enormous space of possible SMEFT operators rapidly becomes a challenging combinatorial problem: many operators can contribute simultaneously to different observables, their effects are correlated, and distinct operator combinations can provide comparably good descriptions of the data. In this work, we formulate the exploration of the SMEFT operator space as a sequential decision-making problem using reinforcement learning (RL). Our RL agent employs a lightweight actor-critic architecture with approximately 40K trainable parameters in total. Rather than searching for a single best-fit theory, our method is designed to discover a diverse set of high-quality theory hypotheses. We test the method in a complex phenomenological environment comprising 132 observables across several sectors of particle physics, including 24 measurements that deviate from their SM predictions by more than $1.5\u03c3$. We show that the learned RL policy efficiently constructs multi-operator theories that substantially improve the global fit. Comparisons with independent random-subset and random-sequential searches demonstrate the ability of the RL policy to navigate this large combinatorial space. Our results establish RL as a systematic framework for exploring diverse patterns of new physics (NP) interactions within SMEFT.", "arxiv_id": "2611.21439", "arxiv_url": "https://arxiv.org/abs/2611.21439", "authors": ["Jacky Kumar"], "brief": "\u5c06SMEFT\u7b97\u7b26\u7ec4\u5408\u641c\u7d22\u5efa\u6a21\u4e3a\u5e8f\u8d2f\u51b3\u7b56\uff0c\u7528\u8f7b\u91cf\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6\u667a\u80fd\u4f53\u6784\u9020\u591a\u7b97\u7b26\u7406\u8bba\uff0c\u76ee\u6807\u4e0d\u662f\u5355\u4e00\u6700\u4f18\u89e3\uff0c\u800c\u662f\u4e00\u7ec4\u62df\u5408\u826f\u597d\u7684\u591a\u6837\u5047\u8bbe\u3002", "categories": ["cs.LG", "cs.AI", "hep-ex", "hep-ph"], "github_repo": "https://github.com/ReinforcePhysics/ReinforceSMEFT", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.21439", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6\u67b6\u6784\u4ec5\u7ea64\u4e07\u53ef\u8bad\u7ec3\u53c2\u6570", "\u8986\u76d6132\u4e2a\u89c2\u6d4b\u91cf\uff0c24\u9879\u504f\u79bb\u6807\u51c6\u6a21\u578b\u8d85\u8fc71.5\u03c3", "\u5bf9\u6bd4\u968f\u673a\u5b50\u96c6\u4e0e\u968f\u673a\u5e8f\u8d2f\u641c\u7d22\uff0c\u9a8c\u8bc1RL\u641c\u7d22\u80fd\u529b"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u6709\u6548\u573a\u8bba", "\u7ec4\u5408\u641c\u7d22", "\u7c92\u5b50\u7269\u7406"], "num_comments": 2, "on_hf": true, "organization": "Universit\u00e9 de Montr\u00e9al", "pdf_url": "https://arxiv.org/pdf/2611.21439v1", "published_at": "2026-11-16", "score": 0.192, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21439.png", "title": "A Reinforcement Learning Method to Navigate SMEFT Operator Space", "tldr": "\u7528\u8f7b\u91cf\u5f3a\u5316\u5b66\u4e60\u63a2\u7d22\u6709\u6548\u573a\u8bba\u7b97\u7b26\u7ec4\u5408\uff0c\u53d1\u73b0\u591a\u6837\u4e14\u62df\u5408\u826f\u597d\u7684\u65b0\u7269\u7406\u5047\u8bbe\u3002", "upvotes": 0, "what_it_is": "\u5c06SMEFT\u7b97\u7b26\u7ec4\u5408\u641c\u7d22\u5efa\u6a21\u4e3a\u5e8f\u8d2f\u51b3\u7b56\uff0c\u7528\u8f7b\u91cf\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6\u667a\u80fd\u4f53\u6784\u9020\u591a\u7b97\u7b26\u7406\u8bba\uff0c\u76ee\u6807\u4e0d\u662f\u5355\u4e00\u6700\u4f18\u89e3\uff0c\u800c\u662f\u4e00\u7ec4\u62df\u5408\u826f\u597d\u7684\u591a\u6837\u5047\u8bbe\u3002", "why_notable": "\u628a\u9ad8\u5ea6\u76f8\u5173\u7684\u7b97\u7b26\u7ec4\u5408\u641c\u7d22\u8f6c\u5316\u4e3a\u53ef\u5b66\u4e60\u7b56\u7565\uff0c\u5728\u6539\u5584\u5168\u5c40\u62df\u5408\u7684\u540c\u65f6\u4fdd\u7559\u591a\u79cd\u7406\u8bba\u89e3\u91ca\uff0c\u4e3a\u65b0\u7269\u7406\u63a2\u7d22\u63d0\u4f9b\u7cfb\u7edf\u5de5\u5177\u3002"}, {"abstract": "Legal reasoning in civil-law systems is not rule-lookup: the German state examination asks for a structured opinion (Gutachten) that names the governing norms, applies them to the facts, and argues to a conclusion. We introduce GPBam (German Public Law Bar-style Exam), 81 public-law examination cases with reference solutions, paired with a recitation task over 200 statutory provisions. Drawn from state examination preparation, the cases are broad and rarely repeat, and are not publicly available - we find no evidence of exact-solution memorisation in the models we evaluate, and keeping them private limits contamination. Because each reference solution\u0027s cited norms form a retrieval gold set over the very instances the essays are graded on, GPBam scores retrieval and long-form generation jointly, which makes it a benchmark for legal retrieval as well as for legal writing and lets us ask how much retrieval quality a legal opinion actually needs. Across 32 open-weight and proprietary models evaluated without retrieval, scores span 4.81-76.42 out of 100. Supplying the law helps modestly: across seven models and eight retrieval configurations, retrieval performance varies nearly threefold and buys at most 4.1 essay points, and nothing significant for three of the seven, while an oracle with 91% gold-norm recall improves scores by 2-6 points. Essay quality strongly tracks prior knowledge: verbatim statute recall, measured in a separate task, correlates at $\u03c1= 0.92$ over 32 models.", "arxiv_id": "2611.18981", "arxiv_url": "https://arxiv.org/abs/2611.18981", "authors": ["Abdullah Al Zubaer", "Lorenz Wendlinger", "Simon Alexander Nonn", "Michael Granitzer", "Jelena Mitrovi\u0107"], "brief": "\u6784\u5efa\u542b81\u9053\u5fb7\u56fd\u516c\u6cd5\u6848\u4f8b\u53ca\u53c2\u8003\u89e3\u7b54\u7684\u57fa\u51c6\uff0c\u53e6\u8bbe200\u6761\u6cd5\u6761\u80cc\u8bf5\u4efb\u52a1\u3002\u4ee5\u53c2\u8003\u89e3\u7b54\u5f15\u7528\u6cd5\u6761\u4f5c\u4e3a\u68c0\u7d22\u91d1\u6807\u51c6\uff0c\u8054\u5408\u8bc4\u4f30\u68c0\u7d22\u4e0e\u957f\u6587\u6cd5\u5f8b\u63a8\u7406\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/wendli01/gpbam", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.18981", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["32\u4e2a\u6a21\u578b\u65e0\u68c0\u7d22\u5f97\u5206\u4e3a4.81\u81f376.42\u5206", "7\u6a21\u578b\u30018\u79cd\u68c0\u7d22\u914d\u7f6e\uff0c\u4f5c\u6587\u6700\u591a\u63d0\u53474.1\u5206", "\u6cd5\u6761\u9010\u5b57\u80cc\u8bf5\u4e0e\u4f5c\u6587\u8d28\u91cf\u76f8\u5173\u6027\u03c1=0.92"], "keywords": ["\u6cd5\u5f8b\u63a8\u7406", "\u4fe1\u606f\u68c0\u7d22", "\u957f\u6587\u672c\u751f\u6210", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "AAIRE  - Agents, AI and Retrieval Lab", "pdf_url": "https://arxiv.org/pdf/2611.18981v1", "published_at": "2026-11-13", "score": 0.182, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.18981.png", "title": "GPBam: A Retrieval-Aware German Public Law Exam Benchmark", "tldr": "\u5fb7\u56fd\u516c\u6cd5\u8003\u8bd5\u8bc4\u6d4b\u663e\u793a\uff0c\u6cd5\u5f8b\u610f\u89c1\u8d28\u91cf\u66f4\u4f9d\u8d56\u6a21\u578b\u65e2\u6709\u77e5\u8bc6\u800c\u975e\u68c0\u7d22\u589e\u76ca\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u542b81\u9053\u5fb7\u56fd\u516c\u6cd5\u6848\u4f8b\u53ca\u53c2\u8003\u89e3\u7b54\u7684\u57fa\u51c6\uff0c\u53e6\u8bbe200\u6761\u6cd5\u6761\u80cc\u8bf5\u4efb\u52a1\u3002\u4ee5\u53c2\u8003\u89e3\u7b54\u5f15\u7528\u6cd5\u6761\u4f5c\u4e3a\u68c0\u7d22\u91d1\u6807\u51c6\uff0c\u8054\u5408\u8bc4\u4f30\u68c0\u7d22\u4e0e\u957f\u6587\u6cd5\u5f8b\u63a8\u7406\u3002", "why_notable": "\u5c06\u68c0\u7d22\u8d28\u91cf\u4e0e\u540c\u4e00\u6848\u4f8b\u7684\u6cd5\u5f8b\u5199\u4f5c\u8868\u73b0\u5bf9\u9f50\uff0c\u63ed\u793a\u68c0\u7d22\u63d0\u5347\u672a\u5fc5\u8f6c\u5316\u4e3a\u63a8\u7406\u6536\u76ca\uff1b\u79c1\u6709\u6848\u4f8b\u4e5f\u6709\u52a9\u4e8e\u9650\u5236\u8bc4\u6d4b\u6c61\u67d3\u3002"}, {"abstract": "We introduce SciResearch-Eval, an interactive benchmark of scientific judgment built on a standard laboratory problem: measuring a material\u0027s thermal properties by heating it and fitting a heat-conduction simulator. An agent designs its own experiments, uses a supplied simulator that may be under-resolved or physically wrong, and reports each property with a 95% interval. To our knowledge it is the first benchmark to combine agent-designed experiments, a deliberately flawed simulator, and proper scoring of calibrated intervals against exact ground truth. On a held-out split (93 tasks, 9 models, 2,511 episodes), models handle procedural traps. When the simulator is missing physics, most report wrong values while stating they are 95% sure: their ranges contain the truth in 20-62% of cases, against 94% for GPT-6 Astra and 99% for Claude Fable 5.2. At default effort the failing Claude 5.5 models rarely diagnose the missing physics (Opus in 35% of episodes, against 66% for Astra), and even when they do, their ranges often miss; Astra and Fable design experiments in which the flawed simulator is accurate, such as gentle heating, which keeps Astra calibrated even when it does not name the cause. Asking for wider intervals does not help; stating the strategy improves interval scores 1.6-2.5-fold, replicated on a pre-registered fresh split, but coverage barely moves. A pre-registered effort ablation shows that the correction is latent in the Claude 5.5 models: at maximum effort Opus improves more than tenfold and is no longer detectably behind Astra at default, but only with 13-31 times more reasoning; older and open-weight models gain nothing. Fable 5.2 is the most accurate model at default effort (interval score 1.9 times better than Astra\u0027s) but writes 6 times as many tokens, and at Astra\u0027s token count it falls short. We release the environment, graders and harness.", "arxiv_id": "2611.21541", "arxiv_url": "https://arxiv.org/abs/2611.21541", "authors": ["Brian T. Weston", "Alondra Torres Contreras", "Aldair E. Gongora"], "brief": "\u63d0\u51fa\u79d1\u5b66\u5b9e\u9a8c\u667a\u80fd\u4f53\u8bc4\u6d4b\uff0c\u8ba9\u6a21\u578b\u81ea\u4e3b\u8bbe\u8ba1\u5b9e\u9a8c\u5e76\u7528\u6709\u7f3a\u9677\u7684\u6a21\u62df\u5668\u4f30\u8ba1\u70ed\u5b66\u6027\u8d28\uff1b\u591a\u6570\u6a21\u578b\u7f6e\u4fe1\u533a\u95f4\u5931\
