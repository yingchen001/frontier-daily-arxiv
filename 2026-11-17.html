otable": null}, {"abstract": "LLM unlearning aims to erase targeted knowledge from large language models while preserving their utility. However, many existing methods suppress target knowledge without explicitly teaching the model how to respond to queries about it. We propose LEAF-OPD (LEArning to Forget from Privileged Contexts via On-Policy Distillation), in which a frozen teacher provides token-level supervision on student-generated responses. On forget data, the teacher uses privileged contexts (instructions not to reveal knowledge about forget targets) to guide forgetting. On retain data, the teacher provides supervision without privileged context to preserve model utility. The student operates without privileged context in both cases, learning how to respond when encountering knowledge that should be forgotten. A key challenge is that the teacher often provides effective supervision only at the first few tokens of student trajectories. We introduce Supervision Signal (SS) to measure corrective supervision over a specified token interval, evaluating the entire trajectory (SS1) and its second half (SS0.5) to assess overall strength and late-stage persistence. When supervision is weak, lightweight SFT strengthens the teacher\u0027s context-conditioned refusal behavior, substantially increasing both scores. We evaluate LEAF-OPD on three widely used benchmarks: TOFU, RWKU, and MUSE-News. On TOFU, LEAF-OPD achieves the best Forget Quality, Model Utility, and Forget ROUGE-L while maintaining competitive retain performance. On RWKU, it outperforms the second-best method by 34% in Forget Quality while maintaining competitive Retain Quality. These results demonstrate the effectiveness of privileged-context supervision with on-policy token-level distillation for LLM unlearning.", "arxiv_id": "2611.20674", "arxiv_url": "https://arxiv.org/abs/2611.20674", "authors": ["Zirui Pang", "Zhijie Deng", "Yuancheng Wang", "Qihan Yu", "Xin Li", "Jiaheng Wei", "Zixin Zhong"], "brief": "LEAF-OPD\u901a\u8fc7\u5e26\u7279\u6743\u4e0a\u4e0b\u6587\u7684\u6559\u5e08\u8fdb\u884c\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff0c\u6559\u6a21\u578b\u5728\u4fdd\u7559\u80fd\u529b\u7684\u540c\u65f6\u56de\u5e94\u9057\u5fd8\u76ee\u6807\u67e5\u8be2\uff1b\u5728\u591a\u4e2a\u57fa\u51c6\u8868\u73b0\u9886\u5148\uff0cRWKU\u9057\u5fd8\u8d28\u91cf\u63d0\u534734%\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20674", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u9057\u5fd8", "\u77e5\u8bc6\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20674v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LEAF-OPD: Learning to Forget from Privileged Contexts via On-Policy Distillation", "tldr": "LEAF-OPD\u901a\u8fc7\u5e26\u7279\u6743\u4e0a\u4e0b\u6587\u7684\u6559\u5e08\u8fdb\u884c\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff0c\u6559\u6a21\u578b\u5728\u4fdd\u7559\u80fd\u529b\u7684\u540c\u65f6\u56de\u5e94\u9057\u5fd8\u76ee\u6807\u67e5\u8be2\uff1b\u5728\u591a\u4e2a\u57fa\u51c6\u8868\u73b0\u9886\u5148\uff0cRWKU\u9057\u5fd8\u8d28\u91cf\u63d0\u534734%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-evolving language agents have emerged as a promising paradigm for continuously improving agent behavior through experience. However, most existing approaches evolve textual artifacts, which can influence action preferences but cannot reliably enforce action admissibility in embodied environments with discrete and often irreversible actions. We propose MetaAct, which shifts self-evolution from textual guidance to executable action constraints by synthesizing GEAR (Grounded Executable Action Rules) from execution feedback. Each rule is represented as a typed specification, compiled into a deterministic guard, and validated offline through trajectory replay without additional model calls or environment interactions. Across four benchmarks, MetaAct improves task performance; on ScienceWorld and WebShop, violations drop from 70% to 0% and 40% to 1%, with score gains of +10.1 and +8.0. Our code is available at https://github.com/BaiCubed/MetaAct.", "arxiv_id": "2611.20655", "arxiv_url": "https://arxiv.org/abs/2611.20655", "authors": ["Jiaxing Zhao", "Hanwen Wang", "Di Liu", "Shaoteng Liu", "Jing-Ran Su", "Yanheng Li", "Qian Zha", "Jiaxi Li", "Hongbin Xie", "Haoran Zhang", "Xuan Song", "Haoxuan Che"], "brief": "MetaAct\u4ece\u6267\u884c\u53cd\u9988\u751f\u6210\u53ef\u6267\u884c\u52a8\u4f5c\u7ea6\u675f\uff0c\u63a8\u52a8\u5177\u8eab\u667a\u80fd\u4f53\u81ea\u6211\u8fdb\u5316\uff1b\u56db\u9879\u57fa\u51c6\u5747\u83b7\u63d0\u5347\uff0c\u4e24\u9879\u73af\u5883\u8fdd\u89c4\u7387\u964d\u81f30%\u548c1%\uff0c\u5f97\u5206\u63d0\u9ad810.1\u548c8.0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20655", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u8bed\u8a00\u667a\u80fd\u4f53", "\u81ea\u6211\u8fdb\u5316", "\u52a8\u4f5c\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20655v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MetaAct: Self-Evolving Executable Action Constraints for Embodied Language Agents", "tldr": "MetaAct\u4ece\u6267\u884c\u53cd\u9988\u751f\u6210\u53ef\u6267\u884c\u52a8\u4f5c\u7ea6\u675f\uff0c\u63a8\u52a8\u5177\u8eab\u667a\u80fd\u4f53\u81ea\u6211\u8fdb\u5316\uff1b\u56db\u9879\u57fa\u51c6\u5747\u83b7\u63d0\u5347\uff0c\u4e24\u9879\u73af\u5883\u8fdd\u89c4\u7387\u964d\u81f30%\u548c1%\uff0c\u5f97\u5206\u63d0\u9ad810.1\u548c8.0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal large language models (MLLMs) are often evaluated by converting model outputs into discrete answers. The conversion protocol determines which scores become predictions and can strongly influence the reported results. We introduce RAMP (Readout Aware Multimodal Protocol), a systematic framework that compares direct yes/no token logits, surface-form scores, and typed or reversed A/B interfaces under fixed model checkpoints and paired visual questions. On 500 POPE adversarial questions, typed versus bare readout changes accuracy by $-20.2$ percentage points for SmolVLM-256M, $-16.4$ for TinyLLaVA-1.1B, and $+1.8$ for Qwen2.5-VL-3B. Paired transitions reveal extensive prediction changes even when the net accuracy difference is small: 79 of 104 binary ChartQA items change correctness for SmolVLM-500M, despite a $+1.0$-point net difference. We further analyze prompt wording, candidate forms, option position, cross-task effects, and calibration. An independent offline replay reproduces 16,140 first-token decisions from saved raw scores with exact agreement. Our findings establish answer readout as a measurable component of multimodal evaluation and provide a reproducible protocol for analyzing model comparisons.", "arxiv_id": "2611.20653", "arxiv_url": "https://arxiv.org/abs/2611.20653", "authors": ["Jianye Zeng", "Qiao Yikang", "Duan Huang", "Ziying Song"], "brief": "\u63d0\u51faRAMP\u6846\u67b6\uff0c\u5728\u56fa\u5b9a\u6a21\u578b\u4e0b\u6bd4\u8f83\u591a\u79cd\u7b54\u6848\u8bfb\u53d6\u534f\u8bae\uff1b\u5b9e\u9a8c\u663e\u793a\u8bfb\u53d6\u65b9\u5f0f\u53ef\u4f7f\u51c6\u786e\u7387\u53d8\u5316\u8d8520\u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u51c0\u5206\u5dee\u8f83\u5c0f\u65f6\u4ecd\u6709\u5927\u91cf\u9884\u6d4b\u7ffb\u8f6c\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20653", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u6a21\u578b\u8bc4\u4f30", "\u8bc4\u4f30\u534f\u8bae"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20653v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RAMP: Rethinking Multimodal Evaluation through Answer Readout Protocols", "tldr": "\u63d0\u51faRAMP\u6846\u67b6\uff0c\u5728\u56fa\u5b9a\u6a21\u578b\u4e0b\u6bd4\u8f83\u591a\u79cd\u7b54\u6848\u8bfb\u53d6\u534f\u8bae\uff1b\u5b9e\u9a8c\u663e\u793a\u8bfb\u53d6\u65b9\u5f0f\u53ef\u4f7f\u51c6\u786e\u7387\u53d8\u5316\u8d8520\u4e2a\u767e\u5206\u70b9\uff0c\u4e14\u51c0\u5206\u5dee\u8f83\u5c0f\u65f6\u4ecd\u6709\u5927\u91cf\u9884\u6d4b\u7ffb\u8f6c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Latent KV cache compression reduces memory footprint by mapping historical keys and values into compact representations. However, generic compressed key states require reconstruction to native dimension before applying RoPE and computing attention scores, adding sequence-scaling overhead to the decode path. We characterize when a latent KV representation can serve directly as the execution state of pretrained RoPE. For RoPE-based transformers, exact static linear execution of the rotary key path requires the latent-to-native map to preserve the pretrained RoPE action through an intertwining relation, restricting exact mixing to coordinates that share the same RoPE frequency. Guided by this characterization, we build GaugeRoPE, a training-free executable latent KV representation. It combines a RoPE-compatible carrier that preserves the rotary action with an approximate position-independent residual key--value (RKV) correction for complementary key and value information, both evaluated without per-token dense historical K/V reconstruction. On Mistral-7B, GaugeRoPE achieves $5.85\\times$ KV compression while maintaining quality close to the full-cache baseline. Additional MHA results validate the construction beyond GQA. GaugeRoPE achieves up to $2.48\\times$ the decode throughput of the vanilla uncompressed baseline through direct latent execution.", "arxiv_id": "2611.20524", "arxiv_url": "https://arxiv.org/abs/2611.20524", "authors": ["Yuanhang Gao", "Xiangrui Yang", "Lingyuan Meng", "Yuanfeng Chen", "Dongsheng Li"], "brief": "GaugeRoPE\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u5728\u517c\u5bb9RoPE\u7684\u538b\u7f29\u7a7a\u95f4\u76f4\u63a5\u6267\u884c\u6ce8\u610f\u529b\uff0c\u907f\u514d\u5386\u53f2\u7f13\u5b58\u91cd\u5efa\uff1b\u5728Mistral-7B\u4e0a\u5b9e\u73b05.85\u500d\u7f13\u5b58\u538b\u7f29\uff0c\u8d28\u91cf\u63a5\u8fd1\u57fa\u7ebf\uff0c\u89e3\u7801\u541e\u5410\u6700\u9ad8\u63d0\u53472.48\u500d\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20524", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u7f13\u5b58\u538b\u7f29", "\u4f4d\u7f6e\u7f16\u7801", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20524v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GaugeRoPE: RoPE-Compatible Executable Latent Attention", "tldr": "GaugeRoPE\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u5728\u517c\u5bb9RoPE\u7684\u538b\u7f29\u7a7a\u95f4\u76f4\u63a5\u6267\u884c\u6ce8\u610f\u529b\uff0c\u907f\u514d\u5386\u53f2\u7f13\u5b58\u91cd\u5efa\uff1b\u5728Mistral-7B\u4e0a\u5b9e\u73b05.85\u500d\u7f13\u5b58\u538b\u7f29\uff0c\u8d28\u91cf\u63a5\u8fd1\u57fa\u7ebf\uff0c\u89e3\u7801\u541e\u5410\u6700\u9ad8\u63d0\u53472.48\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
