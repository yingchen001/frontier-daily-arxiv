u51c6\uff0c\u5b9e\u9a8c\u7b56\u7565\u4e0e\u63a8\u7406\u6295\u5165\u663e\u8457\u5f71\u54cd\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.LG", "physics.comp-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21541", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79d1\u5b66\u667a\u80fd\u4f53", "\u5b9e\u9a8c\u8bbe\u8ba1", "\u4e0d\u786e\u5b9a\u6027\u6821\u51c6", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21541v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SciResearch-Eval: Evaluating Scientific Judgment in Autonomous Experimental Agents", "tldr": "\u63d0\u51fa\u79d1\u5b66\u5b9e\u9a8c\u667a\u80fd\u4f53\u8bc4\u6d4b\uff0c\u8ba9\u6a21\u578b\u81ea\u4e3b\u8bbe\u8ba1\u5b9e\u9a8c\u5e76\u7528\u6709\u7f3a\u9677\u7684\u6a21\u62df\u5668\u4f30\u8ba1\u70ed\u5b66\u6027\u8d28\uff1b\u591a\u6570\u6a21\u578b\u7f6e\u4fe1\u533a\u95f4\u5931\u51c6\uff0c\u5b9e\u9a8c\u7b56\u7565\u4e0e\u63a8\u7406\u6295\u5165\u663e\u8457\u5f71\u54cd\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning from verifiable rewards inherits whatever its verifier gets wrong. Outside mathematics and code the verifier is a proxy, a rubric, a learned judge or a hand-written checker, and its distance from the true objective is never measured, so a rising reward cannot be told apart from a hack. We build a setting where the true reward is exactly computable at the process level: executable authorization policies over 124,416 contexts admit an oracle that lists every minimal sufficient reason for every decision. We compile these policies into exact process rewards, degrade the verifier along seven realistic axes (outcome-only, sufficiency, recall-only, extraction noise, coarse taxonomy, stale policy, LLM judge), and train against each while the exact verifier scores every rollout. Four phenotypes appear. Optimistic verifiers are hacked by padding: the sufficiency proxy ends at 0.940 while true faithfulness falls from 0.731 to 0.667 on 96 held-out episodes. Outcome-only verifiers saturate and stop teaching, noise dilutes, and ranking-preserving gaps do no harm. A model-free audit of the verifier, its selection error and gap sign, together with a short saturation pilot, anticipates which phenotype a run will produce. Across nine configurations spanning two frameworks, two model vendors, two adapter sizes, three precisions, two initialisations and two seeds, the phenotypes recur, sufficiency damage is positive in all 10 replication cells and beyond two standard errors in 7, and optimistic gaps remain the steeper branch. The damage magnitude does not replicate, and five pre-registered attempts to explain it are reported as they fell. We release the testbed, the training instrumentation, and 14 real public policies (Cedar, OPA, Gatekeeper) ported to executable oracles.", "arxiv_id": "2611.21538", "arxiv_url": "https://arxiv.org/abs/2611.21538", "authors": ["Arunkumar V", "Manoranjan Gandhudi", "Gangadharan G. R.", "Arun Prakash", "S. Senthilkumar"], "brief": "\u6784\u5efa\u53ef\u7cbe\u786e\u8ba1\u7b97\u8fc7\u7a0b\u5956\u52b1\u7684\u6388\u6743\u7b56\u7565\u6d4b\u8bd5\u5e8a\uff0c\u7cfb\u7edf\u68c0\u9a8c\u9a8c\u8bc1\u5668\u504f\u5dee\u3002\u53d1\u73b0\u4e50\u89c2\u9a8c\u8bc1\u5668\u4f1a\u8bf1\u53d1\u5956\u52b1\u6295\u673a\uff0c\u4ee3\u7406\u5206\u6570\u5347\u9ad8\u800c\u771f\u5b9e\u5fe0\u5b9e\u5ea6\u4e0b\u964d\uff0c\u4e14\u53ef\u901a\u8fc7\u8bad\u7ec3\u524d\u5ba1\u8ba1\u9884\u5224\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21538", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u6295\u673a", "\u8fc7\u7a0b\u5956\u52b1", "\u9a8c\u8bc1\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21538v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Optimistic Verifiers Get Hacked: Reward Hacking Under an Exact Process Oracle", "tldr": "\u6784\u5efa\u53ef\u7cbe\u786e\u8ba1\u7b97\u8fc7\u7a0b\u5956\u52b1\u7684\u6388\u6743\u7b56\u7565\u6d4b\u8bd5\u5e8a\uff0c\u7cfb\u7edf\u68c0\u9a8c\u9a8c\u8bc1\u5668\u504f\u5dee\u3002\u53d1\u73b0\u4e50\u89c2\u9a8c\u8bc1\u5668\u4f1a\u8bf1\u53d1\u5956\u52b1\u6295\u673a\uff0c\u4ee3\u7406\u5206\u6570\u5347\u9ad8\u800c\u771f\u5b9e\u5fe0\u5b9e\u5ea6\u4e0b\u964d\uff0c\u4e14\u53ef\u901a\u8fc7\u8bad\u7ec3\u524d\u5ba1\u8ba1\u9884\u5224\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Researchers at MIT recently reported that GPT-6 Astra, a frontier large language model (LLM), can write the weights of small neural networks directly in a single reply, and can read the raw weights of small networks to say what they were trained to do. In a three-day sprint, we replicated and extended these results. Our four findings: (1) Writing weights reproduces. Astra\u0027s networks for the game Breakout scored 514, 550 and 307 (versus MIT\u0027s 517), and scored just as well on two modified versions of Breakout. Claude Opus 5.5 can also write working networks, but often runs out of output tokens. (2) What is new is translating programs into weights. Earlier models could write a good policy as code a generation before they could write network weights, and the networks the models write behave like compiled programs: two models independently decompiled Astra\u0027s Breakout network into Python matching its actions in all tested states. On classifying handwritten digits, Astra\u0027s networks scored 50% on average, below a simple classifier (82%). (3) Reading weights is mostly reading the input layer. Astra and Opus 5.5 identify which game a network plays almost perfectly, but on three new games we designed and trained ourselves, Astra recovered where things are on the board, while mostly missing how the game works. (4) Auditing from weights alone is possible but shallow. Without executing code, Astra picked out a small language model poisoned during training in 10 of 10 runs, one poisoned by extra training afterwards in 7 of 10, and a malicious adapter in 23 of 32 cases, but never identified the trigger or malicious behaviour. Open-weight models lag behind. From this early study, we conclude that LLMs can read and write small networks, but that this currently amounts to compiling hand-designed programs and reading the layout of the input layer. It is a promising but early tool for interpretability.", "arxiv_id": "2611.21449", "arxiv_url": "https://arxiv.org/abs/2611.21449", "authors": ["Roksana Goworek", "Alexander Hickey", "Federico Nanni", "Martin O\u0027Reilly"], "brief": "\u590d\u73b0\u5e76\u6269\u5c55\u5927\u6a21\u578b\u76f4\u63a5\u8bfb\u5199\u5c0f\u578b\u7f51\u7edc\u6743\u91cd\u7684\u80fd\u529b\uff0c\u53d1\u73b0\u5199\u6743\u91cd\u4e3b\u8981\u662f\u5c06\u7a0b\u5e8f\u7f16\u8bd1\u4e3a\u7f51\u7edc\uff0c\u8bfb\u6743\u91cd\u5219\u591a\u4f9d\u8d56\u8f93\u5165\u5c42\u5e03\u5c40\uff1b\u867d\u80fd\u521d\u6b65\u8bc6\u522b\u6295\u6bd2\uff0c\u5374\u65e0\u6cd5\u63ed\u793a\u6076\u610f\u884c\u4e3a\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21449", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u795e\u7ecf\u7f51\u7edc\u6743\u91cd", "\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21449v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Replicating and Extending Weight-Space Programming: Frontier LLMs Compile Programs into Weights and Read Input Layers", "tldr": "\u590d\u73b0\u5e76\u6269\u5c55\u5927\u6a21\u578b\u76f4\u63a5\u8bfb\u5199\u5c0f\u578b\u7f51\u7edc\u6743\u91cd\u7684\u80fd\u529b\uff0c\u53d1\u73b0\u5199\u6743\u91cd\u4e3b\u8981\u662f\u5c06\u7a0b\u5e8f\u7f16\u8bd1\u4e3a\u7f51\u7edc\uff0c\u8bfb\u6743\u91cd\u5219\u591a\u4f9d\u8d56\u8f93\u5165\u5c42\u5e03\u5c40\uff1b\u867d\u80fd\u521d\u6b65\u8bc6\u522b\u6295\u6bd2\uff0c\u5374\u65e0\u6cd5\u63ed\u793a\u6076\u610f\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models are increasingly exposed to model-generated text, raising the possibility that future models will be trained recursively on the outputs of their predecessors. Prior work on such self-consuming training loops has largely focused on output quality and downstream performance, leaving their effects on internal representations poorly understood. We study how representations evolve across five generations of self-consumption and whether sparse autoencoders (SAEs) remain reliable under this shift. At each generation, we compare a lineage trained on synthetic data with a matched control trained on real data under the same training settings. We evaluate how well SAEs trained before self-consumption transfer to later generations, measuring reconstruction and sparsity across SAE widths, architectures, and model layers. We then fine-tune the original SAE on each generation and use sparse probing to test whether task-relevant information remains concentrated in a small number of latents or becomes more distributed across the representation. We find that zero-shot SAE performance degrades progressively under self-consumption, with growing reconstruction and sparsity gaps that vary substantially across layers. Fine-tuning largely restores reconstruction, but not feature-level usefulness: task-relevant information remains accessible in the full latent space while becoming less concentrated in individual features. These results show that self-consumption induces representational drift and that reconstruction fidelity alone is insufficient to establish that an adapted SAE remains equally useful for interpretation.", "arxiv_id": "2611.21348", "arxiv_url": "https://arxiv.org/abs/2611.21348", "authors": ["Suchit Gupte", "Zhongteng Cai", "Xueru Zhang", "Mohammad Mahdi Khalili"], "brief": "\u5bf9\u6bd4\u4e94\u4ee3\u5408\u6210\u4e0e\u771f\u5b9e\u6570\u636e\u8bad\u7ec3\uff0c\u53d1\u73b0\u81ea\u6d88\u8d39\u8bad\u7ec3\u5bfc\u81f4\u8868\u5f81\u6f02\u79fb\u3001\u7a00\u758f\u81ea\u7f16\u7801\u5668\u8fc1\u79fb\u9000\u5316\uff1b\u5fae\u8c03\u867d\u6062\u590d\u91cd\u5efa\uff0c\u4efb\u52a1\u4fe1\u606f\u4ecd\u66f4\u5206\u6563\uff0c\u91cd\u5efa\u7cbe\u5ea6\u4e0d\u8db3\u4ee5\u8bc1\u660e\u89e3\u91ca\u53ef\u9760\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21348", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5408\u6210\u6570\u636e", "\u8868\u5f81\u6f02\u79fb", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21348v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Representational Change Under Self-Consuming Training: A Sparse Autoencoder Analysis", "tldr": "\u5bf9\u6bd4\u4e94\u4ee3\u5408\u6210\u4e0e\u771f\u5b9e\u6570\u636e\u8bad\u7ec3\uff0c\u53d1\u73b0\u81ea\u6d88\u8d39\u8bad\u7ec3\u5bfc\u81f4\u8868\u5f81\u6f02\u79fb\u3001\u7a00\u758f\u81ea\u7f16\u7801\u5668\u8fc1\u79fb\u9000\u5316\uff1b\u5fae\u8c03\u867d\u6062\u590d\u91cd\u5efa\uff0c\u4efb\u52a1\u4fe1\u606f\u4ecd\u66f4\u5206\u6563\uff0c\u91cd\u5efa\u7cbe\u5ea6\u4e0d\u8db3\u4ee5\u8bc1\u660e\u89e3\u91ca\u53ef\u9760\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Benchmark contamination is not new, but recent model releases show it in a sharper form. We use the term benchleaking for the case in which a benchmark\u0027s own test examples enter training data, so that a score reflects recall rather than capability. This differs from benchmaxxing, which optimizes toward a benchmark without seeing its test set. We document two escalations over the past month. First, in post-training, the traces have become explicit: recent audits show an agent stating hidden test requirements it was never given in 23% of its attempts, where its predecessor did so in none, and continuing to follow them after the task is changed to contradict them (Schaeffer and R\u00e4uker, 2026; Lo and Lo, 2026). Second, the problem has reached pre-training. Using few-shot continuation on 20 benchmarks across four public base models, we find that some base models write out other test examples---complete questions, options, and answers---that appear nowhere in their input. For the recently released ERNIE-5.5-Flash-Base, 96% of HumanEval problems leak with their reference implementations and 85% of OpenBookQA questions leak with their answers, against 9% and none for DeepSeek-V4-Flash-Base. To quantify what a reported score owes to such examples, we define an Anti-Hack score: the benchmark score recomputed with every leaked example marked wrong and the number of examples unchanged. Averaged over the suite, it costs DeepSeek-V4-Flash-Base 1.5 points and Hy3-preview-Base 1.3, against 5.0 for MiMo-V2.5-Base and 16.6 for ERNIE-5.5-Flash-Base. Open base models are the foundation of much downstream research, so benchleaking now affects more than leaderboard rankings. We call for decontamination reports and contamination-adjusted scores to become standard practice.", "arxiv_id": "2611.21315", "arxiv_url": "https://arxiv.org/abs/2611.21315", "authors": ["Yiwei Qin", "Muhang Xie", "Xuefeng Li", "Mohan Jiang", "Dayuan Fu", "Tiantian Mi", "Qipeng Guo", "Pengfei Liu"], "brief": "\u7814\u7a76\u68c0\u6d4b\u56db\u4e2a\u57fa\u7840\u6a21\u578b\u572820\u9879\u57fa\u51c6\u4e0a\u7684\u6d4b\u8bd5\u6837\u672c\u6cc4\u6f0f\uff0c\u53d1\u73b0\u6c61\u67d3\u5df2\u6df1\u5165\u9884\u8bad\u7ec3\uff1b\u63d0\u51fa\u5c06\u6cc4\u6f0f\u6837\u672c\u5224\u9519\u7684\u6821\u6b63\u8bc4\u5206\uff0c\u90e8\u5206\u6a21\u578b\u5e73\u5747\u964d\u5206\u8fbe16.6\u5206\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21315", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u57fa\u51c6\u6c61\u67d3", "\u6a21\u578b\u8bc4\u6d4b", "\u9884\u8bad\u7ec3", "\u6570\u636e\u6cc4\u6f0f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21315v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Benchleaking Is Accelerating: Benchmark contamination has worsened sharply in the past month -- from post-training down to pre-training base models", "tldr": "\u7814\u7a76\u68c0\u6d4b\u56db\u4e2a\u57fa\u7840\u6a21\u578b\u572820\u9879\u57fa\u51c6\u4e0a\u7684\u6d4b\u8bd5\u6837\u672c\u6cc4\u6f0f\uff0c\u53d1\u73b0\u6c61\u67d3\u5df2\u6df1\u5165\u9884\u8bad\u7ec3\uff1b\u63d0\u51fa\u5c06\u6cc4\u6f0f\u6837\u672c\u5224\u9519\u7684\u6821\u6b63\u8bc4\u5206\uff0c\u90e8\u5206\u6a21\u578b\u5e73\u5747\u964d\u5206\u8fbe16.6\u5206\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language-model agents\u0027 beliefs can be manipulated through open channels such as social media, even when the information they receive is truthful. When agents fill gaps between fragments with self-induced relationships, they may accept those relationships as established facts and pass the resulting rumours to others. Drawing on cognitive theory of narrative understanding and film theory of montage, we introduce Generative Montage to operationalize this failure, termed narrative overfitting, by coordinating agents to arrange truthful fragments into misleading narratives. Across 1,090 rumour targets from six Twitter events, agents often accepted rumours overconfidently, with overall acceptance exceeding 65 percent in twelve of fourteen models. Acceptance remained above 50 percent after majority voting or review of the same evidence, showing how errors can reach downstream decisions. To explain this susceptibility, fragment interventions identify posts that influence belief within complete narratives. Synthetic controls then show that similar response patterns arise from valid evidence, separating belief influence from evidential support. This distinction motivates Grounded Monitor, a proof-of-concept neuro-symbolic runtime monitor that checks direct evidential support to guide agents\u0027 judgements, improving decision accuracy by 5.6 to 29.0 percentage points across original and anonymized settings. These findings expose a cognitive route to rumour amplification and support monitoring inferred relationships before agent-generated conclusions guide public decisions.", "arxiv_id": "2611.21235", "arxiv_url": "https://arxiv.org/abs/2611.21235", "authors": ["Jinwei Hu", "Qisong He", "Xinmiao Huang", "Youcheng Sun", "Yi Dong", "Xiaowei Huang"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u7f16\u6392\u771f\u5b9e\u4fe1\u606f\u7247\u6bb5\u53ef\u8bf1\u5bfc\u667a\u80fd\u4f53\u76f8\u4fe1\u8c23\u8a00\uff0c\u5341\u56db\u4e2a\u6a21\u578b\u4e2d\u5341\u4e8c\u4e2a\u63a5\u53d7\u7387\u8d8565%\uff1b\u68c0\u67e5\u76f4\u63a5\u8bc1\u636e\u652f\u6301\u7684\u76d1\u63a7\u673a\u5236\u5c06\u51c6\u786e\u7387\u63d0\u53475.6\u81f329\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.AI", "cs.CL", "cs.MA", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21235", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u8c23\u8a00\u4f20\u64ad", "\u4fe1\u5ff5\u64cd\u7eb5", "\u8bc1\u636e\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21235v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Language-model agents\u0027 beliefs can be manipulated via truthful evidence in open channel", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u7f16\u6392\u771f\u5b9e\u4fe1\u606f\u7247\u6bb5\u53ef\u8bf1\u5bfc\u667a\u80fd\u4f53\u76f8\u4fe1\u8c23\u8a00\uff0c\u5341\u56db\u4e2a\u6a21\u578b\u4e2d\u5341\u4e8c\u4e2a\u63a5\u53d7\u7387\u8d8565%\uff1b\u68c0\u67e5\u76f4\u63a5\u8bc1\u636e\u652f\u6301\u7684\u76d1\u63a7\u673a\u5236\u5c06\u51c6\u786e\u7387\u63d0\u53475.6\u81f329\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recorded sessions between users and coding agents offer a way to evaluate how agents complete real-world tasks and interact with users. However, these sessions cannot simply be replayed with new agents, because recorded user replies may no longer apply when an agent takes a different trajectory. We introduce SWE-WhatIf, which replays recorded sessions with new agents by modeling the user\u0027s intents, the criteria for satisfying them, and the conditions under which they arise. Using this model, a user simulator generates replies that adapt to unseen agent turns while remaining grounded in the recording. Across 89 real-world sessions, SWE-WhatIf generated the replies most similar to those of real users and matched the strongest baseline when sessions were rewritten. To test adaptation, we replay sessions with agents instructed to avoid or repeat actions that the recorded user pushed back on. SWE-WhatIf produced the highest win rate for avoiding these actions (66.3%), significantly above chance. We further demonstrate its utility by ranking five LLMs as coding agents, where the highest-ranked model depended on how users specified and developed their intents, and a study with 16 users, where replaying their own sessions changed 14 participants\u0027 rankings and informed their future agent use.", "arxiv_id": "2611.21095", "arxiv_url": "https://arxiv.org/abs/2611.21095", "authors": ["Tae Soo Kim", "Tongshuang Wu", "Juho Kim"], "brief": "SWE-WhatIf\u5efa\u6a21\u7528\u6237\u610f\u56fe\uff0c\u6a21\u62df\u771f\u5b9e\u7528\u6237\u4ee5\u91cd\u653e\u7f16\u7a0b\u4ee3\u7406\u4f1a\u8bdd\u3002\u572889\u6bb5\u4f1a\u8bdd\u4e2d\uff0c\u56de\u590d\u6700\u63a5\u8fd1\u771f\u5b9e\u7528\u6237\uff0c\u5e76\u80fd\u9002\u5e94\u4ee3\u7406\u504f\u79bb\u539f\u59cb\u8f68\u8ff9\u7684\u884c\u4e3a\u3002", "categories": ["cs.CL", "cs.AI", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21095", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7528\u6237\u6a21\u62df", "\u7f16\u7a0b\u4ee3\u7406", "\u667a\u80fd\u4f53\u8bc4\u4f30", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21095v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SWE-WhatIf: Simulating Real Users of Coding Agents from Recorded Session", "tldr": "SWE-WhatIf\u5efa\u6a21\u7528\u6237\u610f\u56fe\uff0c\u6a21\u62df\u771f\u5b9e\u7528\u6237\u4ee5\u91cd\u653e\u7f16\u7a0b\u4ee3\u7406\u4f1a\u8bdd\u3002\u572889\u6bb5\u4f1a\u8bdd\u4e2d\uff0c\u56de\u590d\u6700\u63a5\u8fd1\u771f\u5b9e\u7528\u6237\uff0c\u5e76\u80fd\u9002\u5e94\u4ee3\u7406\u504f\u79bb\u539f\u59cb\u8f68\u8ff9\u7684\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Learning visual policies requires turning interaction experience into guidance for individual decisions. Trajectory outcomes obscure action quality, while unguided exploration can revisit familiar situations. We present \\textsc{LightAct}, an experience-learning framework that connects skill-guided exploration with policy internalization. Interaction segments are summarized into experience entries and consolidated into a game-specific skill that guides root collection toward broader state coverage. At each root, candidate actions are compared through short rollouts under a shared frozen policy. Environment-reported score gains are averaged across continuations and normalized into relative action rewards, producing reusable supervision for reinforcement learning. Policy training uses a compact dataset of just 1,024 decision roots collected in a single source game and paired with their action rewards. Across 170 GameWorld tasks spanning 34 games, \\textsc{LightAct} improves overall progress by 23.6, 29.2, and 13.0 percentage points at the 2B, 4B, and 9B scales, respectively, with our strongest model competitive with reported proprietary-model results. Ablations show broader root-state coverage with skill guidance and consistent gains across three policy optimizers. Case studies show how rollouts distinguish actions with identical immediate gains.", "arxiv_id": "2611.21065", "arxiv_url": "https://arxiv.org/abs/2611.21065", "authors": ["Cehao Yang", "Ziyi He", "Jing Yi", "Jian Guo", "Hui Xiong"], "brief": "LightAct\u7ed3\u5408\u6280\u80fd\u5f15\u5bfc\u63a2\u7d22\u4e0e\u77ed\u7a0b\u8bd5\u6f14\uff0c\u4e3a\u52a8\u4f5c\u751f\u6210\u76f8\u5bf9\u5956\u52b1\uff1b\u4ec5\u7528\u5355\u6e38\u620f1024\u4e2a\u51b3\u7b56\u70b9\u8bad\u7ec3\uff0c\u5728170\u9879\u4efb\u52a1\u4e2d\u63d0\u5347\u8fdb\u5ea613\u81f329.2\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21065", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u51b3\u7b56", "\u5f3a\u5316\u5b66\u4e60", "\u7ecf\u9a8c\u5b66\u4e60", "\u6e38\u620f\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21065v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Makes a Good Move? Learning to Act from Experience in Visual Worlds", "tldr": "LightAct\u7ed3\u5408\u6280\u80fd\u5f15\u5bfc\u63a2\u7d22\u4e0e\u77ed\u7a0b\u8bd5\u6f14\uff0c\u4e3a\u52a8\u4f5c\u751f\u6210\u76f8\u5bf9\u5956\u52b1\uff1b\u4ec5\u7528\u5355\u6e38\u620f1024\u4e2a\u51b3\u7b56\u70b9\u8bad\u7ec3\uff0c\u5728170\u9879\u4efb\u52a1\u4e2d\u63d0\u5347\u8fdb\u5ea613\u81f329.2\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite recent advances, vision-language models (VLMs) still struggle with fine-grained visual understanding, often failing to effectively utilize critical evidence already encoded in their visual representations. Existing approaches address this limitation through repeated visual processing or explicit reasoning, introducing substantial computational overhead. In this paper, we propose ReAccess, a lightweight framework that preserves and reuses question-relevant visual evidence through compact associative memory. Constructed during a single visual prefill, the memory supports progressive evidence retrieval that steers both attention queries and hidden representations, enabling effective visual grounding without repeated image encoding or explicit reasoning traces. Extensive experiments demonstrate consistent improvements in both general visual understanding and fine-grained perception, while achieving substantially faster inference than existing reasoning-intensive approaches, demonstrating a promising path to efficient multimodal reasoning.", "arxiv_id": "2611.20936", "arxiv_url": "https://arxiv.org/abs/2611.20936", "authors": ["Tianhao Chen", "Yilong Fan", "Yuheng Wu", "Xiaobin Hu", "Dongman Lee"], "brief": "ReAccess\u5728\u5355\u6b21\u56fe\u50cf\u7f16\u7801\u4e2d\u6784\u5efa\u7d27\u51d1\u5173\u8054\u8bb0\u5fc6\uff0c\u9010\u6b65\u68c0\u7d22\u5e76\u590d\u7528\u95ee\u9898\u76f8\u5173\u89c6\u89c9\u8bc1\u636e\uff0c\u63d0\u5347\u901a\u7528\u4e0e\u7ec6\u7c92\u5ea6\u89c6\u89c9\u7406\u89e3\uff0c\u63a8\u7406\u901f\u5ea6\u663e\u8457\u5feb\u4e8e\u91cd\u63a8\u7406\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20936", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5173\u8054\u8bb0\u5fc6", "\u89c6\u89c9\u7406\u89e3", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20936v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReAccess: Look Once, Stay Focused with Efficient Test Time Memory", "tldr": "ReAccess\u5728\u5355\u6b21\u56fe\u50cf\u7f16\u7801\u4e2d\u6784\u5efa\u7d27\u51d1\u5173\u8054\u8bb0\u5fc6\uff0c\u9010\u6b65\u68c0\u7d22\u5e76\u590d\u7528\u95ee\u9898\u76f8\u5173\u89c6\u89c9\u8bc1\u636e\uff0c\u63d0\u5347\u901a\u7528\u4e0e\u7ec6\u7c92\u5ea6\u89c6\u89c9\u7406\u89e3\uff0c\u63a8\u7406\u901f\u5ea6\u663e\u8457\u5feb\u4e8e\u91cd\u63a8\u7406\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agents are increasingly built to learn from experience: they keep conversation histories, memory files, retrieved notes and skills, and reuse what worked before. We show that this experience turns against them when their tools change silently. We test a range of models with tools defined as in the Model Context Protocol (MCP). After a silent change, experienced agents fail on most tasks, while agents new to the task mostly succeed. We call this failure Experience Rot. Experienced agents copy their earlier call instead of checking the current interface, even when the tool definition shows the change. Then they report success. When the documentation is incomplete, experience is what makes agents succeed. After a change, the same experience leaves them worse off than no experience at all. The failure appears in every form of memory we test and grows with the amount of experience. Simple remedies fall short: announcing the update barely helps, and pointing the agent to the documentation fails whenever the documentation does not spell out the answer.", "arxiv_id": "2611.20922", "arxiv_url": "https://arxiv.org/abs/2611.20922", "authors": ["Zhen Xu", "Hang Yin", "Zitao Zhang", "Kevin Zhao", "Xuefeng Liu"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u5de5\u5177\u63a5\u53e3\u9759\u9ed8\u53d8\u66f4\u540e\uff0c\u667a\u80fd\u4f53\u5e38\u7167\u642c\u65e7\u8c03\u7528\u5e76\u8bef\u62a5\u6210\u529f\uff0c\u8868\u73b0\u53cd\u800c\u4e0d\u5982\u65b0\u624b\uff1b\u8fd9\u79cd\u7ecf\u9a8c\u8150\u5316\u8de8\u8bb0\u5fc6\u5f62\u5f0f\u51fa\u73b0\uff0c\u4e14\u968f\u7ecf\u9a8c\u589e\u52a0\u800c\u52a0\u5267\uff0c\u7b80\u5355\u63d0\u9192\u96be\u4ee5\u4fee\u590d\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20922", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u5de5\u5177\u8c03\u7528", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20922v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Experience Rot: Experienced Agents Fail Where Novices Succeed", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u5de5\u5177\u63a5\u53e3\u9759\u9ed8\u53d8\u66f4\u540e\uff0c\u667a\u80fd\u4f53\u5e38\u7167\u642c\u65e7\u8c03\u7528\u5e76\u8bef\u62a5\u6210\u529f\uff0c\u8868\u73b0\u53cd\u800c\u4e0d\u5982\u65b0\u624b\uff1b\u8fd9\u79cd\u7ecf\u9a8c\u8150\u5316\u8de8\u8bb0\u5fc6\u5f62\u5f0f\u51fa\u73b0\uff0c\u4e14\u968f\u7ecf\u9a8c\u589e\u52a0\u800c\u52a0\u5267\uff0c\u7b80\u5355\u63d0\u9192\u96be\u4ee5\u4fee\u590d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Benchmarks judge language-model agents mainly by whether they reach the correct final state, not by how they got there. Endpoint scoring cannot separate an agent that retrieved exactly the evidence a decision required from one that read most of the environment, nor an agent that never located the evidence from one that stopped a single action short. Settling this needs a reference cost, and authored solutions establish only that a task is solvable, not that no shorter route exists. We present DetourBench, which constrains the environment until that minimum is computable. Each task is a finite, partially observable transition system with unit-cost accesses whose resources become globally addressable after discovery. Exhaustive search yields the full-information minimum action count $L_0$ with a replayable witness; from graph-recoverable terminal states it also yields exact residual work $R_T$, which separates an episode that stopped one access short from one that wandered, while an irreversible wrong commitment is recorded as having no finite residual distance rather than assigned one. Success, attainment, residual progress, and normalized detour are reported separately. Across 375 scored episodes --- five model endpoints, 25 integrated tasks, three repeats --- success ranges from 58.7% to 96.0% while conditional attainment ranges from 0.803 to 0.890 and orders the models differently. Among recoverable failures, residual work separates near-complete trajectories from costly incompletion and from irreversible commitment. We open-source the instances, oracle witnesses, and evaluation harness at https://github.com/DatagridsAI/DetourBench.", "arxiv_id": "2611.20844", "arxiv_url": "https://arxiv.org/abs/2611.20844", "authors": ["Hanlin Tian", "Sihan Zhu", "Zhao Yang", "Yuxiang Wang", "Zhiquan Hu", "Yu Mi", "Hongquan Zhu", "Qiufei Hu"], "brief": "\u63d0\u51faDetourBench\uff0c\u7528\u7cbe\u786e\u6700\u5c11\u52a8\u4f5c\u6570\u4e0e\u5269\u4f59\u5de5\u4f5c\u91cf\u8bc4\u4f30\u667a\u80fd\u4f53\u8f68\u8ff9\uff1b375\u6b21\u5b9e\u9a8c\u663e\u793a\uff0c\u8def\u5f84\u6548\u7387\u4e0e\u6210\u529f\u7387\u5bf9\u6a21\u578b\u7684\u6392\u5e8f\u4e0d\u540c\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20844", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u4f30", "\u4ea4\u4e92\u8f68\u8ff9", "\u641c\u7d22\u7b97\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20844v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DetourBench: Trajectory-Level Evaluation of Interactive Agents with Exact Minimum-Action Bounds", "tldr": "\u63d0\u51faDetourBench\uff0c\u7528\u7cbe\u786e\u6700\u5c11\u52a8\u4f5c\u6570\u4e0e\u5269\u4f59\u5de5\u4f5c\u91cf\u8bc4\u4f30\u667a\u80fd\u4f53\u8f68\u8ff9\uff1b375\u6b21\u5b9e\u9a8c\u663e\u793a\uff0c\u8def\u5f84\u6548\u7387\u4e0e\u6210\u529f\u7387\u5bf9\u6a21\u578b\u7684\u6392\u5e8f\u4e0d\u540c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When a vision-language model describes an image, it names one object at a time and it rarely repeats itself, yet how the model plans this order is far from obvious. We characterize the mechanism a VLM uses to decide where to look before it looks. The mechanism has four main parts. First, binding heads match the relevant text tokens against the image and resolve them into pointers to the matched image region. Second, the same binding heads bind each written answer to the region it came from, and the model turns it into a progress signal: a cursor, the position in the image up to which the list has been written. Third, a select step chooses the nearest unwritten region after the cursor, or stops. Finally, gaze heads execute the chosen pointer and return a concept of what is drawn there, which language heads and the late MLPs turn into a word in the language of the question. We validate each part of this mechanism through causal patching in Qwen3-VL models on a synthetic visual retrieval task, and test our mechanisms against alternative hypotheses. We further show that the mechanism holds across input formats, natural photographs, and languages, and that its binding, relay, and gaze heads appear at every model size from 2B to 32B. This work allows us to investigate how a VLM turns a question and an image into a sequence of answers, layer by layer and token by token. More broadly, it opens a way to study how models plan over complex multi-step tasks with long rollouts. Our project is available at https://plan.baulab.info/", "arxiv_id": "2611.21600", "arxiv_url": "https://arxiv.org/abs/2611.21600", "authors": ["Rohit Gandikota", "Arnab Sen Sharma", "Adam Belfki", "David Bau"], "brief": "\u63ed\u793a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6309\u533a\u57df\u7ed1\u5b9a\u3001\u8fdb\u5ea6\u6e38\u6807\u3001\u9009\u62e9\u4e0e\u6ce8\u89c6\u9010\u6b65\u751f\u6210\u7b54\u6848\u7684\u673a\u5236\uff1b\u5728Qwen3-VL\u4e2d\u7ecf\u56e0\u679c\u5e72\u9884\u9a8c\u8bc1\uff0c\u5e76\u8de8\u56fe\u50cf\u3001\u8bed\u8a00\u548c\u6a21\u578b\u89c4\u6a21\u6210\u7acb\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21600", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u56e0\u679c\u5e72\u9884", "\u591a\u6b65\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21600v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How VLMs Plan What\u0027s Next", "tldr": "\u63ed\u793a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6309\u533a\u57df\u7ed1\u5b9a\u3001\u8fdb\u5ea6\u6e38\u6807\u3001\u9009\u62e9\u4e0e\u6ce8\u89c6\u9010\u6b65\u751f\u6210\u7b54\u6848\u7684\u673a\u5236\uff1b\u5728Qwen3-VL\u4e2d\u7ecf\u56e0\u679c\u5e72\u9884\u9a8c\u8bc1\uff0c\u5e76\u8de8\u56fe\u50cf\u3001\u8bed\u8a00\u548c\u6a21\u578b\u89c4\u6a21\u6210\u7acb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Training with MXFP4, a 4-bit microscaling format, is non-deterministic: identical inputs can produce different results across parallelism layouts and GPU vendors. These differences complicate debugging and training audits and can cause training and inference engines to disagree. We present CertiSum to make MXFP4 training bitwise invariant across runs, parallelism layouts, and GPU vendors. Its key insight is that native FP32 accumulation of MXFP4 products is often already exact for every summation order. CertiSum collects statistics during quantization to certify native matrix multiplication results, recomputes uncertified outputs exactly, and uses exact kernels directly where certification rarely succeeds. CertiSum keeps quantization blocks unchanged across layouts and merges partial sums without rounding, including in attention and weight-gradient computation. In 200-step Qwen3-8B-Base experiments, CertiSum preserves training states bit for bit across AMD MI350X and NVIDIA GB200 and across changes in data, tensor, and context parallelism on MI350X. Across three 8B--14B models on FineWeb-Edu using MI350X, it adds 11.8--60.5% to training-step latency relative to its non-exact MXFP4 counterpart at the larger evaluated input shapes, with speedups of up to $1.24\\times$ over BF16 and $1.70\\times$ over deterministic BF16.", "arxiv_id": "2611.21584", "arxiv_url": "https://arxiv.org/abs/2611.21584", "authors": ["Steve Rhyner", "Yubo Gao", "Stefan de Lasa", "Sankeerth Durvasula", "Nandita Vijaykumar"], "brief": "CertiSum\u901a\u8fc7\u7cbe\u786e\u6027\u8ba4\u8bc1\u4e0e\u9009\u62e9\u6027\u91cd\u7b97\uff0c\u4f7fMXFP4\u8bad\u7ec3\u8de8GPU\u53ca\u5e76\u884c\u5e03\u5c40\u9010\u4f4d\u4e00\u81f4\uff1b\u5b9e\u9a8c\u589e\u52a0\u7ea612%\u81f361%\u5ef6\u8fdf\uff0c\u4f46\u4ecd\u53ef\u5feb\u4e8eBF16\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21584", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f4e\u7cbe\u5ea6\u8bad\u7ec3", "\u786e\u5b9a\u6027\u8ba1\u7b97", "\u5206\u5e03\u5f0f\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21584v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CertiSum: Bitwise-Identical MXFP4 Training Across Platforms and Parallelism Layouts", "tldr": "CertiSum\u901a\u8fc7\u7cbe\u786e\u6027\u8ba4\u8bc1\u4e0e\u9009\u62e9\u6027\u91cd\u7b97\uff0c\u4f7fMXFP4\u8bad\u7ec3\u8de8GPU\u53ca\u5e76\u884c\u5e03\u5c40\u9010\u4f4d\u4e00\u81f4\uff1b\u5b9e\u9a8c\u589e\u52a0\u7ea612%\u81f361%\u5ef6\u8fdf\uff0c\u4f46\u4ecd\u53ef\u5feb\u4e8eBF16\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models are now used to read central-bank text for economic forecasting, but most were trained on text written after the documents they read. A model reading a 2021 FOMC statement may already know that inflation rose in 2022, so part of its apparent skill can be memory of the outcome, a temporal form of test-set contamination. We measure this memory on FOMC statements and minutes from 2000 to 2026 by comparing modern open models with chronologically consistent models, which are trained only on text from before a fixed date. Asked about past GDP outcomes given only a date, models that cannot know the answer still reach an AUC of up to 0.64 from priors on dates and eras, so chance is the wrong baseline. Against these memory-free models on the same questions, most modern models recall which years had strong growth. Membership-inference scores sort documents by era and document type rather than by whether a model saw them, as exact counts in an open pretraining corpus show. In real-time nowcasts, every lookahead premium we estimate on US GDP is smaller than the forecast comparison can detect at macroeconomic sample sizes, and none on GDP or inflation survives correction for multiple testing. Lookahead audits should therefore measure memory directly against memory-free models on the same items.", "arxiv_id": "2611.21554", "arxiv_url": "https://arxiv.org/abs/2611.21554", "authors": ["Arunkumar V", "Gangadharan G. R.", "S. Senthilkumar"], "brief": "\u901a\u8fc7\u5bf9\u6bd4\u73b0\u4ee3\u6a21\u578b\u4e0e\u4ec5\u7528\u5386\u53f2\u6587\u672c\u8bad\u7ec3\u7684\u6a21\u578b\uff0c\u6d4b\u91cf\u592e\u884c\u6587\u672c\u9884\u6d4b\u4e2d\u7684\u672a\u6765\u4fe1\u606f\u8bb0\u5fc6\uff1b\u53d1\u73b0\u8bb0\u5fc6\u666e\u904d\u5b58\u5728\uff0c\u4f46\u672a\u68c0\u51fa\u7a33\u5065\u7684\u7ecf\u6d4e\u9884\u6d4b\u6536\u76ca\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21554", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6570\u636e\u6c61\u67d3", "\u8bed\u8a00\u6a21\u578b", "\u7ecf\u6d4e\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21554v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reading or Remembering? Measuring Temporal Contamination in Language Models", "tldr": "\u901a\u8fc7\u5bf9\u6bd4\u73b0\u4ee3\u6a21\u578b\u4e0e\u4ec5\u7528\u5386\u53f2\u6587\u672c\u8bad\u7ec3\u7684\u6a21\u578b\uff0c\u6d4b\u91cf\u592e\u884c\u6587\u672c\u9884\u6d4b\u4e2d\u7684\u672a\u6765\u4fe1\u606f\u8bb0\u5fc6\uff1b\u53d1\u73b0\u8bb0\u5fc6\u666e\u904d\u5b58\u5728\uff0c\u4f46\u672a\u68c0\u51fa\u7a33\u5065\u7684\u7ecf\u6d4e\u9884\u6d4b\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) often fail to match a point or an object across two images, even when the answer can be decoded from their own hidden states. We trace this failure from the visual tokens to the answer letter, in Qwen3-VL (2B-32B), InternVL3.5-8B, and Gemma-3-12B, on synthetic shape matching, same-instance point correspondence (HPatches), and semantic correspondence (SPair-71k), and find two distinct failure points, a small set of attention heads that carries the comparison, and a repair that touches 0.02% of the parameters. Two failure points: exact copies are compared but not read out. An answer-position probe exceeds the calibrated output by 15 to 25 points in every family, for nameable and unnameable shapes alike, and steering along the probe\u0027s direction moves no more answers than random directions. Semantic correspondences are present in the visual tokens but never reach the answer. One pathway: redistributing the cross-image attention of 16-32 heads, with its mass preserved, removes 17-22 points of synthetic and 15-32 points of HPatches accuracy, against at most 7 for random or attention-matched heads. A lever that training finds on its own: training only these heads\u0027 query and key projections raises SPair-71k accuracy by 28.3 points (Qwen3-VL-8B) and 25.1 points (InternVL3.5-8B), beats both layer-matched and attention-matched heads, and transfers to HPatches and BLINK. An unconstrained all-layer adapter routes 21-51% of its gain through the attention of the same heads, against at most 7% for random heads, and does so by changing what they read (83-86% of the effect) rather than their weights. Every decision rule was frozen before its run, and every reported number is recomputed by independent verification scripts.", "arxiv_id": "2611.21539", "arxiv_url": "https://arxiv.org/abs/2611.21539", "authors": ["Zhaoning Zhang"], "brief": "\u7814\u7a76\u5b9a\u4f4d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8de8\u56fe\u6bd4\u8f83\u7684\u4e24\u5904\u5931\u6548\u53ca\u5173\u952e\u6ce8\u610f\u529b\u5934\uff0c\u4ec5\u8bad\u7ec30.02%\u7684\u53c2\u6570\uff0c\u5c31\u5c06\u8bed\u4e49\u5bf9\u5e94\u51c6\u786e\u7387\u63d0\u5347\u7ea625\u81f328\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u8fc1\u79fb\u81f3\u5176\u4ed6\u4efb\u52a1\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21539", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u8de8\u56fe\u5339\u914d", "\u6ce8\u610f\u529b\u673a\u5236", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21539v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Seen but Unsaid: Locating and Repairing Cross-Image Comparison in Vision-Language Models", "tldr": "\u7814\u7a76\u5b9a\u4f4d\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8de8\u56fe\u6bd4\u8f83\u7684\u4e24\u5904\u5931\u6548\u53ca\u5173\u952e\u6ce8\u610f\u529b\u5934\uff0c\u4ec5\u8bad\u7ec30.02%\u7684\u53c2\u6570\uff0c\u5c31\u5c06\u8bed\u4e49\u5bf9\u5e94\u51c6\u786e\u7387\u63d0\u5347\u7ea625\u81f328\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u8fc1\u79fb\u81f3\u5176\u4ed6\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In-context learning is usually analyzed as if the examples in the prompt were sampled before the learner is chosen. In deployed systems they are not: examples are retrieved, filtered, re-ranked, edited, and repeatedly tested after seeing the query and the data store. We formalize this gap by treating prompt construction as adaptive data analysis through a conditional stochastic-kernel calculus. Our main quantity is the context capacity, the mutual information or approximate max-information between the data store and the final prompt transcript. For any frozen in-context learner and any adaptive context pipeline with capacity $\u03ba$, we prove a finite-sample context generalization bound of order $\\sqrt{\u03ba/k}$, where $k$ is the number of selected examples whose losses form the reported score. We prove a matching lower bound, whose constant is exact when $\\log k\\ll\u03ba\\ll k$, and derive two PAC-Bayesian retrieval rules: a first-order Gibbs rule that charges data-dependent candidate gates their prior mass, and a self-normalized second-order rule. On Banking77 with 64 retrieval recipes and two model families, the certificates hold in all 24,000 resampled selection events, and from 64 (Qwen2.5-7B) or 128 (GPT-4.1-mini) reused validation queries the Gibbs rule certifies a risk below the zero-shot error in over 99% of validation draws. Finally, we instantiate the theory for Bayesian linear in-context regression, including an order-statistics analysis of query-aligned top-$k$ Gaussian retrieval. The results separate context quality from context certification: longer or more relevant contexts improve risk only when the procedure used to choose them is stable enough for selected-context evidence to transfer.", "arxiv_id": "2611.21251", "arxiv_url": "https://arxiv.org/abs/2611.21251", "authors": ["Xiaoyu Li", "Jiangxuan Long"], "brief": "\u5c06\u81ea\u9002\u5e94\u793a\u4f8b\u9009\u62e9\u5efa\u6a21\u4e3a\u6570\u636e\u5206\u6790\uff0c\u4ee5\u4fe1\u606f\u5bb9\u91cf\u523b\u753b\u4e0a\u4e0b\u6587\u8fc7\u62df\u5408\uff0c\u8bc1\u660e\u5339\u914d\u7684\u6cdb\u5316\u4e0a\u4e0b\u754c\uff1b\u63d0\u51fa\u4e24\u79cd\u68c0\u7d22\u89c4\u5219\uff0c\u5e76\u5728\u5206\u7c7b\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\u98ce\u9669\u8ba4\u8bc1\u6709\u6548\u3002", "categories": ["cs.LG", "cs.CL", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21251", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u6cdb\u5316\u7406\u8bba", "\u81ea\u9002\u5e94\u6570\u636e\u5206\u6790", "\u4fe1\u606f\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21251v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Price of Choosing Examples: Context Overfitting in Adaptive In-Context Learning", "tldr": "\u5c06\u81ea\u9002\u5e94\u793a\u4f8b\u9009\u62e9\u5efa\u6a21\u4e3a\u6570\u636e\u5206\u6790\uff0c\u4ee5\u4fe1\u606f\u5bb9\u91cf\u523b\u753b\u4e0a\u4e0b\u6587\u8fc7\u62df\u5408\uff0c\u8bc1\u660e\u5339\u914d\u7684\u6cdb\u5316\u4e0a\u4e0b\u754c\uff1b\u63d0\u51fa\u4e24\u79cd\u68c0\u7d22\u89c4\u5219\uff0c\u5e76\u5728\u5206\u7c7b\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\u98ce\u9669\u8ba4\u8bc1\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time scaling systems often choose how much to sample, which prompt to use, and which verifier or aggregation rule to trust after repeatedly inspecting a calibration set. Standard validation error bars are not valid after this adaptive selection. We model a test-time scaling recipe as a randomized predictor with a random cost and prove a time-uniform PAC-Bayes certificate that holds simultaneously over all calibration times, all posterior mixtures over recipes, and all data-dependent stopping rules. Thus the same event covers the recipe search that precedes deployment, not merely the fixed recipe finally reported. For a finite grid of budgets and verifiers, the penalty is the familiar $\\log M/n$, which in the worst case no certificate valid after selection can avoid, while non-uniform priors and localized posterior mixtures can give sharper certificates for structured searches. We specialize the result to self-consistency and show a complementary margin law: plurality voting improves exponentially in the sample budget only on examples where the correct answer is the generator\u0027s unique mode; otherwise more compute can provably amplify errors. The same margin analysis yields an oracle water-filling law for compute allocation. A synthetic audit quantifies the optimism caused by adaptive budget selection, and a 192-example GSM8K audit using gpt-4.1-mini generations illustrates risk-cost reporting for a real inference pipeline. At scale, with two models on GSM8K and MATH-500, selected-best error bars fall below the out-of-split GSM8K risk in up to 22.5% of random splits at a nominal 5% while the certificate never does, and on the full GSM8K test split it tightens to 0.109 (held-out risk 0.039). The results give a lightweight, distribution-free way to report risk and compute claims for adaptive inference systems.", "arxiv_id": "2611.21241", "arxiv_url": "https://arxiv.org/abs/2611.21241", "authors": ["Xiaoyu Li", "Jiangxuan Long"], "brief": "\u63d0\u51fa\u9002\u7528\u4e8e\u81ea\u9002\u5e94\u63a8\u7406\u9884\u7b97\u4e0e\u7b56\u7565\u9009\u62e9\u7684PAC-Bayes\u98ce\u9669\u8bc1\u4e66\uff0c\u5b9e\u9a8c\u4e2d\u907f\u514d\u4f20\u7edf\u8bef\u5dee\u6761\u7684\u5931\u6548\uff0c\u5e76\u8bc1\u660e\u589e\u52a0\u91c7\u6837\u53ef\u80fd\u653e\u5927\u9519\u8bef\u3002", "categories": ["cs.LG", "cs.CL", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21241", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u6269\u5c55", "\u6cdb\u5316\u754c", "\u81ea\u9002\u5e94\u63a8\u7406", "\u8ba1\u7b97\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21241v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Anytime-Valid PAC-Bayes Certificates for Adaptive Test-Time Scaling", "tldr": "\u63d0\u51fa\u9002\u7528\u4e8e\u81ea\u9002\u5e94\u63a8\u7406\u9884\u7b97\u4e0e\u7b56\u7565\u9009\u62e9\u7684PAC-Bayes\u98ce\u9669\u8bc1\u4e66\uff0c\u5b9e\u9a8c\u4e2d\u907f\u514d\u4f20\u7edf\u8bef\u5dee\u6761\u7684\u5931\u6548\uff0c\u5e76\u8bc1\u660e\u589e\u52a0\u91c7\u6837\u53ef\u80fd\u653e\u5927\u9519\u8bef\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern large language models (LLMs) increasingly support longer contexts and serve more concurrent requests, increasing both sequence lengths and batch sizes. Both trends increase KV-cache size and memory traffic during inference. KV-cache quantization reduces these costs, with recent approaches using codebook-based vector quantization to achieve extremely low bit widths. However, hardware constraints limit codebook size, and most methods reconstruct the cache in higher-precision floating-point formats for attention, limiting the computational benefits of quantization. To address these limitations, we introduce MiSTiQ, a drop-in replacement for codebook-based vector quantizers that combines trellis-coded storage with microscaling (MX) formats for low-precision computation. We combine trellis quantization with beam search to encode the KV cache over large reconstruction spaces without large codebooks. To support MX computation, we derive MX-Hash functions that generate reconstruction values directly in the target MX element format. These functions use the scale-conditioned marginal distribution of block-normalized Gaussian inputs. On Llama3 and Qwen3, MiSTiQ achieves lower WikiText perplexity and higher GSM8K accuracy than the evaluated baselines across several block-scale formats at approximately 1.25 effective bits per element. With NVFP4, it also achieves the highest LongBench average on both models.", "arxiv_id": "2611.21216", "arxiv_url": "https://arxiv.org/abs/2611.21216", "authors": ["Ofir Gordon", "Lior Dikstein", "Paul Balanca", "Idan Achituve", "Douglas Orr", "Hai Victor Habi"], "brief": "MiSTiQ\u7ed3\u5408\u683c\u5f62\u91cf\u5316\u4e0e\u5fae\u7f29\u653e\u683c\u5f0f\uff0c\u5c06KV\u7f13\u5b58\u538b\u81f3\u7ea61.25\u4f4d\u5e76\u652f\u6301\u4f4e\u7cbe\u5ea6\u8ba1\u7b97\uff0c\u5728Llama3\u548cQwen3\u4e0a\u8f83\u57fa\u7ebf\u63d0\u5347\u56f0\u60d1\u5ea6\u3001\u6570\u5b66\u63a8\u7406\u53ca\u957f\u6587\u672c\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21216", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f13\u5b58\u538b\u7f29", "\u4f4e\u6bd4\u7279\u91cf\u5316", "\u5927\u6a21\u578b\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21216v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MiSTiQ: MicroScaling Trellis Quantization for Extreme KV Cache Compression", "tldr": "MiSTiQ\u7ed3\u5408\u683c\u5f62\u91cf\u5316\u4e0e\u5fae\u7f29\u653e\u683c\u5f0f\uff0c\u5c06KV\u7f13\u5b58\u538b\u81f3\u7ea61.25\u4f4d\u5e76\u652f\u6301\u4f4e\u7cbe\u5ea6\u8ba1\u7b97\uff0c\u5728Llama3\u548cQwen3\u4e0a\u8f83\u57fa\u7ebf\u63d0\u5347\u56f0\u60d1\u5ea6\u3001\u6570\u5b66\u63a8\u7406\u53ca\u957f\u6587\u672c\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-supervised pretraining has transformed language and vision, but its application to functional MRI (fMRI) is constrained by data access. The largest standardized fMRI resources are governed by data use agreements and dominated by a small number of acquisition protocols, while the thousands of openly licensed datasets on OpenNeuro are individually small, heterogeneously organized, and unprocessed. We present the first release of Open-fMIND, a uniformly preprocessed, openly accessible corpus of parcellated fMRI timeseries from 322 OpenNeuro studies, comprising 11,379 subjects and 45,731 functional runs. Each run is preprocessed with fMRIPrep and parcellated under 52 atlases spanning 14 families, yielding a massive 2.4 million timeseries. Timeseries are released either denoised with our default pipeline (preproc) or as the fMRIPrep output with its confound files (quasiraw), with functional connectivity matrices, per-run provenance and motion metadata. Open-fMIND is intended as a pretraining resource for self-supervised brain representation learning. Pretraining on it yields downstream performance comparable to that obtained with UK Biobank.", "arxiv_id": "2611.21215", "arxiv_url": "https://arxiv.org/abs/2611.21215", "authors": ["Carlo Alberto Barbano", "Giovanni Marraffini", "Demian Wassermann"], "brief": "Open-fMIND\u7edf\u4e00\u5904\u7406322\u9879\u5f00\u653e\u7814\u7a76\uff0c\u63d0\u4f9b240\u4e07\u6761\u8111\u529f\u80fd\u78c1\u5171\u632f\u65f6\u95f4\u5e8f\u5217\uff0c\u652f\u6301\u8111\u57fa\u7840\u6a21\u578b\u9884\u8bad\u7ec3\uff0c\u4e0b\u6e38\u8868\u73b0\u4e0eUK Biobank\u9884\u8bad\u7ec3\u76f8\u5f53\u3002", "categories": ["cs.LG", "q-bio.NC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21215", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u529f\u80fd\u78c1\u5171\u632f", "\u5f00\u653e\u6570\u636e\u96c6", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u57fa\u7840\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21215v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Open-fMIND: A Large-Scale Open-Access fMRI Corpus for Pretraining Brain Foundation Models", "tldr": "Open-fMIND\u7edf\u4e00\u5904\u7406322\u9879\u5f00\u653e\u7814\u7a76\uff0c\u63d0\u4f9b240\u4e07\u6761\u8111\u529f\u80fd\u78c1\u5171\u632f\u65f6\u95f4\u5e8f\u5217\uff0c\u652f\u6301\u8111\u57fa\u7840\u6a21\u578b\u9884\u8bad\u7ec3\uff0c\u4e0b\u6e38\u8868\u73b0\u4e0eUK Biobank\u9884\u8bad\u7ec3\u76f8\u5f53\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Few-step generators via flow models require complicated technical solutions such as a pretrained flow model or a consistency loss. While rectified flows have gained popularity for their success in few-step sampling, they pay a cost of needing a pre-trained model and sampling a large number of couplings per dataset. Yet for a finite dataset and a Gaussian probability path, the probability-flow vector field of the empirical distribution is available in closed form, so one could use this field as the teacher and skip pretraining altogether. We demonstrate that, surprisingly, this approach is impossible for problems of practical relevance. In particular, the analytic solution of the diffusion process in high dimensions becomes almost a linear transformation. The integration returns the noise vector drawn at initialisation, plus a drift that is empirically a faint copy of the data point, almost independent of the noise. The coupling therefore differs from an independent pairing only through this drift. As a result, training a model on these couplings is almost equivalent to training the model on the independent draws of the noise and the data, which does not provide a useful teacher. We highlight that this is the direct consequence of the high-dimensionality of the data, and that for low enough dimensions or large enough datasets, analytic couplings become more efficient teachers. We quantify this effect by the fraction of endpoint energy carried by the drift, which scales as $\\frac{\\log N}{d}$ for a dataset of size $N$ in a $d$-dimensional space. Finally, we provide an empirical study confirming all the theoretical results presented in the paper.", "arxiv_id": "2611.21119", "arxiv_url": "https://arxiv.org/abs/2611.21119", "authors": ["Tobias H\u00f6ppe", "Stefan Bauer", "Qiang Liu", "Andrea Dittadi", "Kirill Neklyudov"], "brief": "\u7814\u7a76\u95ed\u5f0f\u8026\u5408\u80fd\u5426\u514d\u9884\u8bad\u7ec3\u5b9e\u73b0\u5c11\u6b65\u751f\u6210\uff0c\u53d1\u73b0\u9ad8\u7ef4\u4e0b\u5176\u8fd1\u4f3c\u72ec\u7acb\u914d\u5bf9\u3001\u96be\u4f5c\u6709\u6548\u6559\u5e08\uff1b\u7406\u8bba\u4e0e\u5b9e\u9a8c\u8868\u660e\uff0c\u6709\u6548\u6f02\u79fb\u80fd\u91cf\u5360\u6bd4\u968f\u6570\u636e\u91cf\u5bf9\u6570\u4e0e\u7ef4\u5ea6\u4e4b\u6bd4\u7f29\u653e\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21119", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u6a21\u578b", "\u6d41\u6a21\u578b", "\u9ad8\u7ef4\u7edf\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21119v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Limits of Closed-Form Couplings for Few-Step Generation", "tldr": "\u7814\u7a76\u95ed\u5f0f\u8026\u5408\u80fd\u5426\u514d\u9884\u8bad\u7ec3\u5b9e\u73b0\u5c11\u6b65\u751f\u6210\uff0c\u53d1\u73b0\u9ad8\u7ef4\u4e0b\u5176\u8fd1\u4f3c\u72ec\u7acb\u914d\u5bf9\u3001\u96be\u4f5c\u6709\u6548\u6559\u5e08\uff1b\u7406\u8bba\u4e0e\u5b9e\u9a8c\u8868\u660e\uff0c\u6709\u6548\u6f02\u79fb\u80fd\u91cf\u5360\u6bd4\u968f\u6570\u636e\u91cf\u5bf9\u6570\u4e0e\u7ef4\u5ea6\u4e4b\u6bd4\u7f29\u653e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) judges are increasingly used to monitor the outputs of LLM-based AI agents, yet formal guarantees on the reliability of these judges remain largely absent, limiting confidence in their use for safety-critical oversight. We consider certifying such a judge and define its risk over safety classifications of prompt--response pairs drawn from a deployed generator. We apply a PAC-Bayes framework to this setting, refining existing compression-based methodology with the use of tighter bounds and more efficient coding. We show that standard parameter-efficient fine-tuning can yield non-vacuous and even tight certificates for safety judges, for both classification and Brier risk, without holding out data for validation. We introduce LoRA-GT, which shares a single quantisation scale across layers and achieves the tightest certificates with minimal degradation in predictive performance. Across five guardrail models and four benchmarks, we find that certificate tightness is governed more by adaptation complexity than by base model scale. Finally, we show how far quantisation can be pushed before the resulting increase in risk outweighs the bound tightening gained from shorter descriptions. Together, these results provide a practical route toward certifiable scalable oversight and offer insight into how the complexity of safety adaptations shapes generalisation.", "arxiv_id": "2611.20818", "arxiv_url": "https://arxiv.org/abs/2611.20818", "authors": ["Tom A. Lamb", "Philip H. S. Torr", "Tim G. J. Rudner"], "brief": "\u7528PAC-Bayes\u4e0e\u9ad8\u6548\u538b\u7f29\u4e3a\u5927\u6a21\u578b\u5b89\u5168\u88c1\u5224\u63d0\u4f9b\u7d27\u81f4\u6cdb\u5316\u4fdd\u8bc1\uff0c\u65e0\u9700\u7559\u51fa\u9a8c\u8bc1\u96c6\uff1b\u8de8\u6a21\u578b\u5b9e\u9a8c\u8868\u660e\uff0c\u4fdd\u8bc1\u7d27\u81f4\u5ea6\u66f4\u591a\u53d6\u51b3\u4e8e\u9002\u914d\u590d\u6742\u5ea6\u800c\u975e\u6a21\u578b\u89c4\u6a21\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20818", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6cdb\u5316\u4fdd\u8bc1", "\u5b89\u5168\u8bc4\u4f30", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u6a21\u578b\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20818v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tight PAC-Bayes Generalisation Guarantees for Large Language Model Judges", "tldr": "\u7528PAC-Bayes\u4e0e\u9ad8\u6548\u538b\u7f29\u4e3a\u5927\u6a21\u578b\u5b89\u5168\u88c1\u5224\u63d0\u4f9b\u7d27\u81f4\u6cdb\u5316\u4fdd\u8bc1\uff0c\u65e0\u9700\u7559\u51fa\u9a8c\u8bc1\u96c6\uff1b\u8de8\u6a21\u578b\u5b9e\u9a8c\u8868\u660e\uff0c\u4fdd\u8bc1\u7d27\u81f4\u5ea6\u66f4\u591a\u53d6\u51b3\u4e8e\u9002\u914d\u590d\u6742\u5ea6\u800c\u975e\u6a21\u578b\u89c4\u6a21\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Embodied capabilities such as visual grounding, spatial reasoning, navigation, and driving understanding are often developed in separate vision-language specialists fine-tuned from a common pretrained model.Deploying the specialists separately multiplies storage, whereas merging them into one dense model forces conflicting task updates to share parameters and loses part of each specialist\u0027s expertise.We introduce UNITE, a framework that consolidates such specialists into a compact shared-backbone mixture of experts. UNITE keeps the feed-forward block of each specialist as a routable expert and represents the expert bank through a shared-anchor one-bit factorization: a shared floating-point anchor plus expert-specific, row-scaled binary deviations.The anchor is optimized jointly with the scales and signs through closed-form alternating updates, using only source weights and no calibration data.Router adaptation then adjusts token-level expert selection with the backbone and experts frozen, updating fewer than $0.6$M parameters ($\u003c0.01\\%$ of the $8.8$B active parameters). Built from four Qwen3-VL-8B specialists, the complete UNITE model occupies $20.3$ GB, $1.16\\times$ the storage of one dense specialist and $59.6\\%$ below the uncompressed MoE. Across $22$ benchmarks and R2R Val-Unseen, UNITE matches six static merging methods in mean retention of best-specialist performance, leads all of them on Scan2Cap, ScanQA, and all four navigation metrics, and surpasses every source specialist on all five 3D scene understanding benchmarks (up to $+19.1$ on Scan2Cap) and on R2R navigation. Relative to the uncompressed MoE, factorization is nearly lossless on $21$ of $22$ benchmarks; the exception is VSI-Bench, where frame-count experiments suggest impaired use of cross-frame evidence.UNITE thus consolidates complementary embodied capabilities near single-model storage.", "arxiv_id": "2611.20767", "arxiv_url": "https://arxiv.org/abs/2611.20767", "authors": ["Tao Tao", "Anke Tang", "Enneng Yang", "Zhi Hou", "Xiaogang Wang", "Dacheng Tao"], "brief": "UNITE\u7528\u5171\u4eab\u951a\u70b9\u4e00\u6bd4\u7279\u5206\u89e3\u6574\u5408\u5177\u8eab\u89c6\u89c9\u8bed\u8a00\u4e13\u5bb6\uff0c\u5b58\u50a8\u4ec5\u4e3a\u5355\u6a21\u578b\u76841.16\u500d\uff0c\u591a\u6570\u57fa\u51c6\u538b\u7f29\u8fd1\u4e4e\u65e0\u635f\uff0c\u4e09\u7ef4\u7406\u89e3\u4e0e\u5bfc\u822a\u8868\u73b0\u8d85\u8d8a\u6e90\u4e13\u5bb6\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20767", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20767v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "UNITE: Consolidating Embodied VLM Specialists via Shared-Anchor One-Bit Factorization", "tldr": "UNITE\u7528\u5171\u4eab\u951a\u70b9\u4e00\u6bd4\u7279\u5206\u89e3\u6574\u5408\u5177\u8eab\u89c6\u89c9\u8bed\u8a00\u4e13\u5bb6\uff0c\u5b58\u50a8\u4ec5\u4e3a\u5355\u6a21\u578b\u76841.16\u500d\uff0c\u591a\u6570\u57fa\u51c6\u538b\u7f29\u8fd1\u4e4e\u65e0\u635f\uff0c\u4e09\u7ef4\u7406\u89e3\u4e0e\u5bfc\u822a\u8868\u73b0\u8d85\u8d8a\u6e90\u4e13\u5bb6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mean pairwise cosine similarity between transformer embeddings is a standard measure of whether online discourse is converging under generative AI. When the embeddings are mean-pooled outputs of an encoder never trained for sentence similarity, this measure mostly tracks text length. In 6.06 million Reddit comments, an uncentered DeBERTa-v3 measure had suggested that only conservative discourse broke toward homogeneity after late 2022. Truncating the same comments from 10 to 150 words raises their mean cosine by eight times the reported break. A placebo that swaps every comment for a random one of equal length reproduces 81% of the asymmetry, and a fixed-content simulation reproduces 78%. The leading principal direction carries 99.9% of raw DeBERTa homogeneity, and once length is handled the asymmetry disappears under every encoder. On 575,000 Stack Exchange answers the measure reports a post-ChatGPT homogenization of technical sites that the placebo fully reproduces, although answers grew longer. A census of 31 studies locates the risk where anisotropic encoders meet time-series or length-unequal designs. A reverse control on a well-known experiment shows that centering with renormalization can reverse a genuine effect. I propose a low-cost diagnostic protocol. Corrected measures show that the two political camps converged between 2019 and 2022 and stopped converging before ChatGPT. Cross-camp replies engage their targets more closely than same-camp replies.", "arxiv_id": "2611.21519", "arxiv_url": "https://arxiv.org/abs/2611.21519", "authors": ["Fengming Liu"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u5e38\u7528\u5d4c\u5165\u4f59\u5f26\u540c\u8d28\u5316\u6307\u6807\u4e3b\u8981\u53cd\u6620\u6587\u672c\u957f\u5ea6\uff1b\u5728\u5927\u89c4\u6a21\u8bba\u575b\u6570\u636e\u4e2d\uff0c\u63a7\u5236\u957f\u5ea6\u540e\u6240\u8c13\u751f\u6210\u5f0fAI\u5f15\u53d1\u7684\u8bdd\u8bed\u540c\u8d28\u5316\u6548\u5e94\u6d88\u5931\uff0c\u5e76\u63d0\u51fa\u4f4e\u6210\u672c\u8bca\u65ad\u6d41\u7a0b\u3002", "categories": ["cs.CL", "cs.CY", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21519", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u672c\u5d4c\u5165", "\u4f59\u5f26\u76f8\u4f3c\u5ea6", "\u8bdd\u8bed\u540c\u8d28\u5316", "\u6d4b\u91cf\u504f\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21519v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Embedding Cosine Measures Text Length Before It Measures Homogenization", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u5e38\u7528\u5d4c\u5165\u4f59\u5f26\u540c\u8d28\u5316\u6307\u6807\u4e3b\u8981\u53cd\u6620\u6587\u672c\u957f\u5ea6\uff1b\u5728\u5927\u89c4\u6a21\u8bba\u575b\u6570\u636e\u4e2d\uff0c\u63a7\u5236\u957f\u5ea6\u540e\u6240\u8c13\u751f\u6210\u5f0fAI\u5f15\u53d1\u7684\u8bdd\u8bed\u540c\u8d28\u5316\u6548\u5e94\u6d88\u5931\uff0c\u5e76\u63d0\u51fa\u4f4e\u6210\u672c\u8bca\u65ad\u6d41\u7a0b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A useful memory need not resemble the question it helps answer. Jetriever ranks each stored memory by Jev\u0027s decision score for its usefulness to the current question, replacing similarity search with full-pool utility scoring. On InMind\u0027s 125 indirect-query tasks, it places the gold exchange first in 84.8% of cases; matched BM25 and MiniLM controls reach 1.6% and 0.0% when indexing user turns. A 20-question comparison separates finding evidence from ranking it: Jev and Qwen3.5 9B each find 90% of gold exchanges by rank 50, while Laya finds 30%; at rank one, Jev reaches 85% and Qwen3.5 9B 40%. On a dimension-proportional random sample of 60 MemoryAgentBench questions, Jetriever\u0027s four-dimension score is 55.4%, against 44.3% for ReFind on the same questions. Jev retrieval costs USD 0.00834 per InMind question and USD 0.03103 per MAB question on average. These results show the value of world knowledge, scores that rank decisive memories first, and affordable full-pool scoring.", "arxiv_id": "2611.21478", "arxiv_url": "https://arxiv.org/abs/2611.21478", "authors": ["Ruizhe Li", "Licheng Zhang", "Mingxuan Du", "Zhendong Mao"], "brief": "Jetriever\u4ee5\u5168\u5e93\u6548\u7528\u8bc4\u5206\u66ff\u4ee3\u76f8\u4f3c\u5ea6\u68c0\u7d22\uff0c\u5728\u95f4\u63a5\u67e5\u8be2\u4efb\u52a1\u4e2d\u9996\u4f4d\u547d\u4e2d\u7387\u8fbe84.8%\uff0c\u663e\u8457\u4f18\u4e8e\u4f20\u7edf\u68c0\u7d22\uff0c\u5e76\u5728\u8bb0\u5fc6\u57fa\u51c6\u4e0a\u4ee5\u8f83\u4f4e\u6210\u672c\u63d0\u5347\u8868\u73b0\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21478", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bb0\u5fc6", "\u4fe1\u606f\u68c0\u7d22", "\u6548\u7528\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21478v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Jetriever: Shifting Agent Memory Retrieval from Similarity to Utility", "tldr": "Jetriever\u4ee5\u5168\u5e93\u6548\u7528\u8bc4\u5206\u66ff\u4ee3\u76f8\u4f3c\u5ea6\u68c0\u7d22\uff0c\u5728\u95f4\u63a5\u67e5\u8be2\u4efb\u52a1\u4e2d\u9996\u4f4d\u547d\u4e2d\u7387\u8fbe84.8%\uff0c\u663e\u8457\u4f18\u4e8e\u4f20\u7edf\u68c0\u7d22\uff0c\u5e76\u5728\u8bb0\u5fc6\u57fa\u51c6\u4e0a\u4ee5\u8f83\u4f4e\u6210\u672c\u63d0\u5347\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Formal specifications define intended program behavior and underpin verification, but writing them in theorem provers such as Lean is slow and expertise-intensive, making specification a major bottleneck to scaling formally correct code. Autoformalization from natural-language problems is promising, yet training specification models requires scalable feedback on whether generated specifications capture intended behavior. Prior approaches obtain this feedback through explicit proofs or separately implemented code with formal correspondence proofs, both expensive. We introduce AuXSpec, a Lean framework that pairs declarative postconditions with executable counterparts, obtained through type class resolution when possible and otherwise defined separately with an equivalence proof. Test cases can then evaluate declarative specifications by execution, letting us use agreement as a reinforcement-learning reward. Using AuXSpec, we synthesize 3,037 LeetCode problems and expand training to 19.5K samples through expert iteration on Codeforces. Experiments show that training Qwen3.5-9B and Qwen3.8-27B with the execution-based reward improves SpecGen pass@4 on AuXSpec-Test 0.7% $\\to$ 82.7% and 14.3% $\\to$ 84.3%, and the 27B model outperforms all frontier models. On the out-of-domain Verina benchmark with its original prompts, both models improve 7.0% $\\to$ 90.5% and 21.9% $\\to$ 90.5% and surpass VeriSpecGen-30B-A3B, the prior state of the art among open-source specification models, on pass@1 (theirs 47.6% vs. ours 73.7% and 84.5%) and pass@4 (theirs 63.9% at pass@10 vs. ours 90.5%). We release the weights of the trained 9B and 27B models and the 3,037 problems with test cases, including the 300-problem AuXSpec-Test benchmark with expert review and correctness proofs for future evaluation. Models and data: https://huggingface.co/collections/eth-algopt/auxspec. Website: https://auxspec.org", "arxiv_id": "2611.21421", "arxiv_url": "https://arxiv.org/abs/2611.21421", "authors": ["Haocheng Wang", "Weixuan Yuan", "Florian H\u00fcbler", "Yinya Huang", "Zhijiang Guo", "Sorrachai Yingchareonthawornchai", "Rasmus Kyng"], "brief": "AuXSpec\u4ee5\u53ef\u6267\u884c\u540e\u7f6e\u6761\u4ef6\u68c0\u9a8cLean\u89c4\u683c\uff0c\u5c06\u6d4b\u8bd5\u7ed3\u679c\u7528\u4f5c\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u3002\u8bad\u7ec3\u540e\u4e24\u79cd\u6a21\u578b\u7684\u89c4\u683c\u751f\u6210\u901a\u8fc7\u7387\u5927\u5e45\u63d0\u5347\uff0c\u57df\u5916\u8bc4\u6d4b\u4e5f\u8d85\u8d8a\u6b64\u524d\u5f00\u6e90\u6700\u4f73\u6a21\u578b\u3002", "categories": ["cs.SE", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21421", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u7a0b\u5e8f\u89c4\u683c", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21421v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AuXSpec: Learning to Autoformalize Program Specifications via Executable Postconditions", "tldr": "AuXSpec\u4ee5\u53ef\u6267\u884c\u540e\u7f6e\u6761\u4ef6\u68c0\u9a8cLean\u89c4\u683c\uff0c\u5c06\u6d4b\u8bd5\u7ed3\u679c\u7528\u4f5c\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u3002\u8bad\u7ec3\u540e\u4e24\u79cd\u6a21\u578b\u7684\u89c4\u683c\u751f\u6210\u901a\u8fc7\u7387\u5927\u5e45\u63d0\u5347\uff0c\u57df\u5916\u8bc4\u6d4b\u4e5f\u8d85\u8d8a\u6b64\u524d\u5f00\u6e90\u6700\u4f73\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent self-improving coding agents have achieved strong benchmark performance by iteratively modifying their own executable implementations. A common pattern uses downstream task-derived evidence to decide which candidates or lineages continue evolving, which we term evaluate-and-select. Obtaining this signal requires repeatedly executing evolved agents on downstream tasks, so broader exploration incurs increasing evaluation cost, while repeated optimization against a fixed evaluation distribution may encourage benchmark-specific adaptation. We ask: can coding agents self-improve without downstream task evaluation inside the evolution loop? We introduce Explore-then-Integrate (ELITE), which integrates implementation mechanisms rather than selecting a single exploratory child to continue the lineage. At each generation, ELITE proposes diverse focused improvements, implements them independently from the same parent, and inspects the resulting programs to identify complementary, redundant, and conflicting mechanisms before reimplementing a compatible subset as one coherent descendant. No downstream task outcomes or task-solving trajectories of evolved candidates are used to guide evolution; only deterministic checks of structural and operational validity are used inside the loop. On SWE-bench Pro, ELITE improves the initial agent from 60.0% to 85.6%, compared with 86.7% for the Darwin Godel Machine (DGM) and 88.3% for the Huxley-Godel Machine (HGM), while using zero candidate task evaluations and reducing observed wall-clock evolution time by 8.8x and 3.2x, respectively, under the evaluated configurations. In cross-benchmark transfer without further adaptation, ELITE averages 73.3% on SWE-bench Verified and 69.3% on Polyglot. Together, these results demonstrate the feasibility of coding-agent self-improvement without downstream candidate task evaluation in our setting.", "arxiv_id": "2611.21056", "arxiv_url": "https://arxiv.org/abs/2611.21056", "authors": ["Zhe Ren", "Guowei Rong", "Yimeng Chen", "Nanbo Li", "Piotr Pi\u0119kos", "Mateusz Ostaszewski", "Dandan Guo", "J\u00fcrgen Schmidhuber"], "brief": "\u63d0\u51faELITE\uff0c\u901a\u8fc7\u63a2\u7d22\u5e76\u6574\u5408\u4ee3\u7801\u673a\u5236\uff0c\u8ba9\u7f16\u7a0b\u667a\u80fd\u4f53\u65e0\u9700\u4efb\u52a1\u8bc4\u4f30\u5373\u53ef\u81ea\u6211\u6539\u8fdb\uff1b\u6210\u529f\u7387\u4ece60.0%\u5347\u81f385.6%\uff0c\u6f14\u5316\u8017\u65f6\u6700\u591a\u7f29\u77ed8.8\u500d\u3002", "categories": ["cs.CL", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21056", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u81ea\u6211\u6539\u8fdb", "\u7a0b\u5e8f\u6f14\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21056v1", "published_at": "2026-11-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluation-Free Recursive Self-Improvement for Coding Agents", "tldr": "\u63d0\u51faELITE\uff0c\u901a\u8fc7\u63a2\u7d22\u5e76\u6574\u5408\u4ee3\u7801\u673a\u5236\uff0c\u8ba9\u7f16\u7a0b\u667a\u80fd\u4f53\u65e0\u9700\u4efb\u52a1\u8bc4\u4f30\u5373\u53ef\u81ea\u6211\u6539\u8fdb\uff1b\u6210\u529f\u7387\u4ece60.0%\u5347\u81f385.6%\uff0c\u6f14\u5316\u8017\u65f6\u6700\u591a\u7f29\u77ed8.8\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_n
