Public testing supports iterative development, and a separate verifier scores the final submission. On benchmark version 1.1, we evaluate 16 coding agents, each pairing a model with a harness. Their Score@1 ranges from 25.5% to 67.4%. Most of their programs are correct, and the size of the speedup separates them: the two leading agents are at least 2x faster on 22 or more of the 32 tasks, while the other fourteen reach 2x on 8 to 17 and leave 125 of their 412 correct outcomes below 1.25x. Controlled replays show why coordination across an application matters: identical source code runs between 0.29x and 2.12x depending only on build and runtime settings, and one code change is worth 1.01x or 6.4x depending on another. Accelerate Bench pairs executable workloads with agents\u0027 programs and trajectories to evaluate both their gains and the process behind them.", "arxiv_id": "2611.20882", "arxiv_url": "https://arxiv.org/abs/2611.20882", "authors": ["Bowen Liu", "Yuhan Li", "Nuo Chen", "Weile Luo", "Miao Peng", "Qintong Zhang", "Qifan Zhang", "Jia Li", "Ziqi Gao", "Lydell Huang"], "brief": "Accelerate Bench\u6784\u5efa32\u9879CPU\u4f18\u5316\u4efb\u52a1\uff0c\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u5728\u4fdd\u6301\u8ba1\u7b97\u6b63\u786e\u7684\u524d\u63d0\u4e0b\u81ea\u4e3b\u9009\u62e9\u4f18\u5316\u4f4d\u7f6e\u4e0e\u65b9\u6cd5\uff0c\u5e76\u901a\u8fc7\u516c\u5f00\u6d4b\u8bd5\u548c\u72ec\u7acb\u9a8c\u8bc1\u5668\u8bc4\u4f30\u6700\u7ec8\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/AdAstraAbyssoque/accelerate-bench", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.20882", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b16\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\uff0cScore@1\u4e3a25.5%\u81f367.4%", "\u4e24\u652f\u9886\u5148\u667a\u80fd\u4f53\u5728\u81f3\u5c1122\u9879\u4efb\u52a1\u4e0a\u5b9e\u73b02\u500d\u52a0\u901f", "\u76f8\u540c\u6e90\u7801\u4ec5\u6539\u53d8\u6784\u5efa\u4e0e\u8fd0\u884c\u8bbe\ one, which processes them alongside text and images. To develop the model\u0027s agent capabilities, we construct verifiable environments for tool use, search, and coding, as well as specialized workflows involving machine learning experiments and scientific software. Task completion is checked against execution results, changes in environment state, or submitted artifacts. We evaluate Sage S1.5 Flash on 33 benchmarks across seven domains. In the primary comparison against five baselines, it ranks first on OfficeQA Pro (72.2), MLE-bench Lite (90.3 HumanRank), Harvey LAB, and SpreadsheetBench~2, and second on OSWorld-Verified (85.2), WebArena-Verified (67.6), and DeepResearch Bench~II (54.2). These results show particular strengths in using documentary evidence, producing verifiable workbooks, and carrying out machine learning tasks, alongside competitive performance in desktop and browser workflows that require the model to act on visual feedback.", "arxiv_id": "2611.21072", "arxiv_url": "https://arxiv.org/abs/2611.21072", "authors": ["Kun Cai", "Haodong Chen", "Guangran Cheng", "Qingxiu Cheng", "Xu Dai", "Guanting Dong", "Qiming Ge", "Lixin Gu", "Tao Gui", "Honglin Guo", "Yuyang Hu", "Zixian Huang", "Jiajie Jin", "Alexander Lam", "Jiaqiang Li", "Yining Li", "Jiahang Lin", "Yanjiang Liu", "Xinyu Lu", "Haijun Lv", "Ningsheng Ma", "Zerun Ma", "Minlong Peng", "Jianmin Qian", "Huayu Sha", "Junlin Shang", "Shuo Shen", "Qisheng Su", "Jiajun Sun", "Yanan Sun", "Zhichao Sun", "Ran Tao", "Zhongbo Tian", "Guoqiang Wang", "Hui Wang", "Rui Wang", "Yiding Wang", "Zhecan Wang", "Hao Xiang", "Xinchen Xie", "Shuhao Xing", "Xiaoyu Xing", "Wanghan Xu", "Xinyu Yang", "Yajie Yang", "Dingbo Yuan", "Yuhang Zang", "Hongjie Zhang", "Chengfeng Zhao", "Haoran Zhao", "Penghao Zhao", "Ruojun Zhou", "Dongsheng Zhu", "Yicheng Zou", "Qiye Cai", "Yifei Cao", "Xinmeng Che", "Hongji Chen", "Jiabei Chen", "Jiadong Chen", "Jiahao Chen", "Jiayi Chen", "Xinjie Chen", "Yujia Chen", "Xin Deng", "Yi Dong", fe1\u606f\uff0c\u5e76\u6784\u5efa\u53ef\u9a8c\u8bc1\u73af\u5883\u57f9\u517b\u5de5\u5177\u8c03\u7528\u3001\u7f16\u7a0b\u4e0e\u79d1\u5b66\u5b9e\u9a8c\u80fd\u529b\u3002", "why_notable": "\u5c06\u79d1\u5b66\u6570\u636e\u7406\u89e3\u4e0e\u5b9e\u9645\u4efb\u52a1\u6267\u884c\u7ed3\u5408\uff0c\u5728\u6587\u6863\u8bc1\u636e\u5229\u7528\u3001\u53ef\u9a8c\u8bc1\u8868\u683c\u4ea7\u51fa\u548c\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u4e0a\u8868\u73b0\u7a81\u51fa\uff0c\u62d3\u5c55\u79d1\u5b66\u667a\u80fd\u4f53\u7684\u5e94\u7528\u8def\u5f84\u3002"}, {"abstract": "We present K2-Horizon, a fleet of six fully open language models, from a 0.9B dense model to a 375B-A23B MoE, built for general-purpose reasoning and agentic work across math and science, software engineering, deep research, office automation, and beyond. The models lead or are competitive with strong open models of their size on agentic and coding benchmarks. On the modeling side, to strengthen reasoning, we introduce Mixture-of-Value Attention (MoVA), applying MoE to attention value projections, and softplus attention gating, a more flexible, theoretically motivated gate. Our 36B-A4B model uses both and nearly matches a 32B dense model trained on the same data, with one-seventh the active parameters. We also introduce Uno, lossless diffusion adapters that speed up decoding by up to 2.2x without a separate draft model. Our release follows the LLM360 definition of open source for transparency and reproducibility: the full development history, including intermediate checkpoints from every training stage, pre-training data, training logs, and all training, evaluation, and infrastructure code, notably our production-scale xLLM framework for dense and MoE training and the RL360 reinforcement-learning stack. Beyond the data itself, we release and document in detail every pipeline that built it, the part of model development that open releases most rarely disclose. These pipelines produced roughly 10T synthetic pre-training tokens, showing that synthetic data can be a major ingredient of pre-training at scale. Four of the models share one 22T-token pre-training corpus and recipe, revealing consistent scaling behavior and enabling controlled studies of scale and sparsity. All artifacts are available at https://ifm.ai/k2/", "arxiv_id": "2611.21003", "arxiv_url": "https://arxiv.org/abs/2611.21003", "authors": ["K2 Team", "Zhengzhong Liu", "Haonan Li", "Xuezhe Ma", "Alexander Moreno", "Subham Sekhar Sahoo", "Rupesh Kumar Srivastava", "Mikhail Yurochkin", "Hadi Abdine", "Yash Akhauri", "Adharsh Babu", "David Bellamy", "Jalaj Bhandari", "Dani Bouch", "Wail Bouhedja", "Weili Cao", "Ahmad Chamma", "Po-Chun Chang", "Junlin Chen", "Lingjie Chen", "Zhoujun Cheng", "Kyle Chickering", "Ryandito Diandaru", "Evan Dufraisse", "Chaitanya Dwivedi", "Bilal El Bouardi", "Desai Fan", "Richard Fan", "Chengqian Gao", "Rifo Ahmad Genadi", "Jonathan Geuter", "Charles Guille-Escuret", "Willis Guo", "Dhawal Gupta", "Seungwook Han", "Tingxu Han", "Shibo Hao", "Besher Hassan", "Guowei He", "Ming Shan Hee", "Joel Hestness", "Yu Huang", "Yuan Huang", "Haolong Jia", "Linghao Jin", "Junu Kim", "Lingjing Kong", "Nurkhan Laiyk", "Andrej Leban", "Liqun Ma", "John Maggs", "Amr Mohamed", "Mukhesh Narra", "Omkar Pangarkar", "Aldo Pareja", "Khiem Pham", "Varad Pimpalkhute", "Nikhil Ranjan", "Elizaveta Rebrova", "Hector Ren", "Shaurya Rohatgi", "Guokan Shang", "Jianshu She", "Chufan Shi", "Aaryamonvikram Singh", "Daria Soboleva", "Kartik Sreenivasan", "Suqi Sun", "Yuekai Sun", "Bowen Tan", "Liping Tang", "Shengkun Tang", "Muzi Tao", "Mallikarjuna Tupakula", "Micah Villmow", "Hongyi Wang", "Huijuan Wang", "Renxi Wang", "Yongxin Wang", "Yuqi Wang", "Zhenting Wang", "Shicheng Wen", "Yingquan Wu", "Anze Xie", "Andrew Xing", "Matthew Yang", "Shuanghai Yu", "Kerem Zaman", "Zenan Zhai", "Hongli Zhan", "Xuezhou Zhang", "Anshun Asher Zheng", "Zhe Zhou", "Richard Zhuang", "Eric P. Xing"], "brief": "\u63a8\u51fa\u8986\u76d60.9B\u7a20\u5bc6\u6a2 \u6d41\u7a0b\u3002", "why_notable": "\u5f00\u653e\u8303\u56f4\u5ef6\u4f38\u5230\u4e2d\u95f4\u68c0\u67e5\u70b9\u4e0e\u6570\u636e\u6784\u5efa\u6d41\u6c34\u7ebf\uff1b\u56db\u6b3e\u6a21\u578b\u5171\u4eab22T\u8bcd\u5143\u8bed\u6599\u548c\u914d\u65b9\uff0c\u4e3a\u89c4\u6a21\u4e0e\u7a00\u758f\u6027\u7684\u53d7\u63a7\u7814\u7a76\u63d0\u4f9b\u57fa\u7840\u3002"}, {"abstract": "Joint-embedding predictive architecture (JEPA) world models predict future embeddings instead of pixels and plan in latent space. Two challenges remain: 2D images leave the metric geometry that manipulation acts on implicit and entangled with appearance, and what these models imagine stays hidden, as they are mostly judged in simulation by short-horizon latent planning. We present JEPA4R, a JEPA world model that observes single-depth-camera point clouds, predicts and plans in their latent space, and acts through a policy head on its frozen latents; we call this 4D point planning. A decoder on the frozen world model shows what it imagines as 4D point clouds, with a mean point error within 1.1 cm over 200 steps. Under the policy-learning protocols of OGBench and CortexBench, JEPA4R leads pixel JEPA models on OGBench Cube-Single, Cube-Double, Cube-Triple and Scene, and ranks first on MetaWorld and Adroit Relocate with 98.4% and 88.0%, above the runner-up, R3M, at 96.0% and 65.3%. Trained only in a digital twin, JEPA4R and its policy heads run zero-shot on the real arm with both a gripper and a dexterous hand.", "arxiv_id": "2611.19771", "arxiv_url": "https://arxiv.org/abs/2611.19771", "authors": ["Jiarui Dong", "Zhiheng Liang", "Yanjun Li", "Zeyu Zhang", "Heejeong Nam", "Haoyu Chen", "Hao Tang"], "brief": "JEPA4R\u7528\u5355\u6df1\u5ea6\u76f8\u673a\u70b9\u4e91\u5b66\u4e60\u4e16\u754c\u6a21\u578b\uff0c\u5728\u6f5c\u7a7a\u95f4\u9884\u6d4b\u548c\u89c4\u5212\uff0c\u5e76\u4ee5\u51bb\u7ed3\u8868\u5f81\u8bad\u7ec3\u7b56\u7565\u5934\u3002\u901a\u8fc7\u89e3\u7801\u672a\u6765\u70b9\u4e91\uff0c\u53ef\u76f4\u89c2\u770b\u5230\u6a21\u578b\u9884\u6d4b\u7684\u51e0\u4f55\u6f14\u5316\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/AIGeeksGroup/JEPA4R", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.19771", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u51bb\u7ed3\u6a21\u578b\u89e3\u7801200\u6b65\u70b9\u4e91\uff0c\u5e73\u5747\u70b9\u8bef\u5dee\u4e0d\u8d85\u8fc71.1\u5398\u7c73", "MetaWorld\u4e0eAdroit Relocate\u5f97\u520698.4%\u548c88.0%", "\u4ec5\u5728\u6570\u5b57\u5b6a\u751f\u8bad\u7ec3\uff0c\u96f6\u6837\u672c\u90e8\u7f72\u81f3\u5939\u722a\u4e0e\u7075\u5de7\u624b"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u70b9\u4e91", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u96f6\u6837\u672c\u8fc1\u79fb"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2611.19771v1", "published_at": "2026-11-15", "score": 0.471, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19771.png", "title": "JEPA4R: Embodied JEPA World Models with 4D Point Planning", "tldr": "\u4ee5\u70b9\u4e91\u6f5c\u7a7a\u95f4\u9884\u6d4b\u4e0e\u89c4\u5212\u9a71\u52a8\u673a\u5668\u4eba\u64cd\u4f5c\uff0c\u5e76\u5b9e\u73b0\u6570\u5b57\u5b6a\u751f\u5230\u771f\u673a\u96f6\u6837\u672c\u8fc1\u79fb\u3002", "upvotes": 4, "what_it_is": "JEPA4R\u7528\u5355\u6df1\u5ea6\u76f8\u673a\u70b9\u4e91\u5b66\u4e60\u4e16\u754c\u6a21\u578b\uff0c\u5728\u6f5c\u7a7a\u95f4\u9884\u6d4b\u548c\u89c4\u5212\uff0c\u5e76\u4ee5\u51bb\u7ed3\u8868\u5f81\u8bad\u7ec3\u7b56\u7565\u5934\u3002\u901a\u8fc7\u89e3\u7801\u672a\u6765\u70b9\u4e91\uff0c\u53ef\u76f4\u89c2\u770b\u5230\u6a21\u578b\u9884\u6d4b\u7684\u51e0\u4f55\u6f14\u5316\u3002", "why_notable": "\u5c06\u64cd\u4f5c\u6240\u9700\u7684\u5ea6\u91cf\u51e0\u4f55\u663e\u5f0f\u7eb3\u5165\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u8ba9\u957f\u671f\u9884\u6d4b\u53ef\u89c6\u5316\uff1b\u591a\u57fa\u51c6\u9886\u5148\u4e0e\u771f\u673a\u8fc1\u79fb\u7ed3\u679c\u589e\u5f3a\u4e86\u5176\u673a\u5668\u4eba\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM agents answer questions by calling APIs and trusting the results. An API can fail silently. It ignores part of a request, such as a misnamed filter, yet returns HTTP 200 and a plausible but wrong result. Current fixes, such as checklists, reviewer models and LLM judges, ask the model to catch it. But models often see the problem and answer anyway. We present SilentGuard, which moves the decision from the model to the harness running tool calls. It tests each result against invariants that any correct API must satisfy and withholds values that break one. We find silent failures in 11 of 15 public research APIs, with counts inflated up to 691 times. Current fixes leave over 70% of answers wrong, and agents report 77.4% of counts a judge flags. Across 7 open models, SilentGuard cuts wrong answers on its target faults from 74.0% to 1.7%, with no loss on fault-free tasks. On three frontier models they fall from 70.2% to 0.5%. A warning from the same check leaves 70.1% wrong, so enforcement is the key. On new fault types, the harness alone cuts wrong answers from 61.1% to 24.5%. It avoids wrong answers by abstaining rather than recovering.", "arxiv_id": "2611.20595", "arxiv_url": "https://arxiv.org/abs/2611.20595", "authors": ["Sajib Acharjee Dip", "Brian Ouyang", "Lala Motlhabi"], "brief": "SilentGuard\u5728\u5de5\u5177\u8c03\u7528\u6267\u884c\u6846\u67b6\u4e2d\uff0c\u7528\u6b63\u786e\u63a5\u53e3\u5e94\u6ee1\u8db3\u7684\u4e0d\u53d8\u91cf\u68c0\u9a8c\u8fd4\u56de\u7ed3\u679c\uff0c\u5e76\u963b\u65ad\u8fdd\u89c4\u6570\u503c\u3002\u5b83\u901a\u8fc7\u62d2\u7b54\u907f\u514d\u9519\u8bef\uff0c\u800c\u975e\u4f9d\u8d56\u6a21\u578b\u8b66\u544a\u6216\u4fee\u590d\u63a5\u53e3\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Sajib-006/silentguard", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.20595", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["15\u4e2a\u516c\u5171\u7814\u7a76API\u4e2d11\u4e2a\u5b58\u5728\u9759\u9ed8\u6545\u969c\uff0c\u8ba1\u6570\u6700\u591a\u865a\u589e691\u500d", "7\u4e2a\u5f00\u653e\u6a21\u578b\u9519\u8bef\u7387\u4ece74.0%\u964d\u81f31.7%", "\u540c\u4e00\u68c0\u67e5\u4ec5\u53d1\u8b66\u544a\u4ecd\u670970.1%\u9519\u8bef\uff0c\u5f3a\u5236\u62e6\u622a\u624d\u6709\u6548"], "keywords": ["\u667a\u80fd\u4f53", "\u63a5\u53e3\u53ef\u9760\u6027", "\u4e0d\u53d8\u91cf\u6821\u9a8c", "\u5de5\u5177\u8c03\u7528"], "num_comments": 2, "on_hf": true, "organization": "Genentech", "pdf_url": "https://arxiv.org/pdf/2611.20595v1", "published_at": "2026-11-16", "score": 0.392, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20595.png", "title": "Invariant-Aware Harness Enforcement to Protect LLM Agents from Silent API Failures", "tldr": "\u5c06\u63a5\u53e3\u7ed3\u679c\u6821\u9a8c\u4e0e\u62e6\u622a\u4ea4\u7ed9\u6267\u884c\u6846\u67b6\uff0c\u663e\u8457\u51cf\u5c11\u667a\u80fd\u4f53\u91c7\u4fe1\u9759\u9ed8\u9519\u8bef", "upvotes": 2, "what_it_is": "SilentGuard\u5728\u5de5\u5177\u8c03\u7528\u6267\u884c\u6846\u67b6\u4e2d\uff0c\u7528\u6b63\u786e\u63a5\u53e3\u5e94\u6ee1\u8db3\u7684\u4e0d\u53d8\u91cf\u68c0\u9a8c\u8fd4\u56de\u7ed3\u679c\uff0c\u5e76\u963b\u65ad\u8fdd\u89c4\u6570\u503c\u3002\u5b83\u901a\u8fc7\u62d2\u7b54\u907f\u514d\u9519\u8bef\uff0c\u800c\u975e\u4f9d\u8d56\u6a21\u578b\u8b66\u544a\u6216\u4fee\u590d\u63a5\u53e3\u3002", "why_notable": "\u628a\u53ef\u9760\u6027\u63a7\u5236\u4ece\u6a21\u578b\u5224\u65ad\u8f6c\u4e3a\u6267\u884c\u5c42\u7ea6\u675f\uff0c\u5728\u65e0\u6545\u969c\u4efb\u52a1\u4e0a\u4e0d\u635f\u5931\u8868\u73b0\uff1b\u5bf9\u65b0\u6545\u969c\u4e5f\u80fd\u964d\u4f4e\u9519\u8bef\uff0c\u4f46\u4e3b\u8981\u9760\u62d2\u7b54\u800c\u975e\u6062\u590d\u3002"}, {"abstract": "Large language models (LLMs) are rapidly advancing mathematical discovery, moving beyond benchmark-level problem solving to tackle frontier research problems. This progress is ushering mathematics into an era of proof abundance, raising a fundamental challenge: how can we ensure the correctness of the ever-growing volume of AI-generated proofs and transform them into trustworthy, machine-verified mathematical knowledge? We introduce Turing Agent, an agent harness designed to orchestrate end-to-end formal verification of research-level mathematics. Its wo-scale architecture integrates theorem formalization and proof formalization agents, empowered by structured proof decomposition, parallel verification, accumulated proof experience, and selective semantic review. Leveraging our collaborations with theoretical computer science (TCS) researchers, we focus our evaluation on TCS, a particularly demanding domain characterized by intricate quantification, complex dependencies, and stringent semantic requirements. Against direct generation and general-purpose coding harnesses, including Codex CLI and Claude Code, Turing Agent achieves approximately 57-62% faithful formalization success on Formal TCS Bench and 83% overall pass@1 on a TCS-focused subset of RLMEval, using GLM-5.3 and DeepSeek-V4-Pro. Notably, Turing Agent, built on DeepSeek, successfully completes the formal verification of three previously unresolved TCS tasks from OpenAI\u0027s October 2026 collection. One particularly challenging TCS problem required about a hundred formally verified auxiliary claims. Moreover, by actively exploring and refining the formalization process, Turing Agent can uncover simpler alternative proofs, expose unnecessary dependencies in original proofs, and generate reusable mathematical knowledge as a byproduct of verification.", "arxiv_id": "2611.21299", "arxiv_url": "https://arxiv.org/abs/2611.21299", "authors": ["Yang Chen", "Qianyi Wang", "Ronghui Yang", "Zhanhao Li", "Yu Cong", "Chen Zhang", "Hangfan Zhang", "Shao Zhang", "Shuai Li", "Toru Takisaka", "Chao Xu", "Yi Zhou", "Zhihao Tang", "Xiao Wang", "Bo Zhang", "Shuyue Hu"], "brief": "Turing Agent\u534f\u8c03\u5b9a\u7406\u4e0e\u8bc1\u660e\u5f62\u5f0f\u5316\u667a\u80fd\u4f53\uff0c\u5b8c\u6210\u7814\u7a76\u7ea7\u6570\u5b66\u7684\u7aef\u5230\u7aef\u9a8c\u8bc1\u3002\u6838\u5fc3\u7ed3\u5408\u7ed3\u6784\u5316\u8bc1\u660e\u5206\u89e3\u3001\u5e76\u884c\u9a8c\u8bc1\u3001\u7ecf\u9a8c\u79ef\u7d2f\u4e0e\u9009\u62e9\u6027\u8bed\u4e49\u5ba1\u67e5\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21299", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Formal TCS Bench\u5fe0\u5b9e\u5f62\u5f0f\u5316\u6210\u529f\u7387\u7ea657\u201362%", "TCS\u7248RLMEval\u5b50\u96c6\u6574\u4f53pass@1\u8fbe83%", "\u5b8c\u62103\u9879\u6b64\u524d\u672a\u89e3\u51b3\u4efb\u52a1\uff0c\u5176\u4e2d\u4e00\u9879\u9700\u7ea6\u767e\u6761\u8f85\u52a9\u65ad\u8a00"], "keywords": ["\u6570\u5b66\u667a\u80fd\u4f53", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u81ea\u52a8\u5b9a\u7406\u8bc1\u660e", "\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21299v1", "published_at": "2026-11-16", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Turing Agent: Agentic Formal Verification for Mathematical Research", "tldr": "\u901a\u8fc7\u5206\u5c42\u667a\u80fd\u4f53\u534f\u4f5c\uff0c\u5c06\u7814\u7a76\u7ea7\u6570\u5b66\u8bc1\u660e\u8f6c\u5316\u4e3a\u673a\u5668\u9a8c\u8bc1\u7684\u53ef\u4fe1\u77e5\u8bc6\u3002", "upvotes": 0, "what_it_is": "Turing Agent\u534f\u8c03\u5b9a\u7406\u4e0e\u8bc1\u660e\u5f62\u5f0f\u5316\u667a\u80fd\u4f53\uff0c\u5b8c\u6210\u7814\u7a76\u7ea7\u6570\u5b66\u7684\u7aef\u5230\u7aef\u9a8c\u8bc1\u3002\u6838\u5fc3\u7ed3\u5408\u7ed3\u6784\u5316\u8bc1\u660e\u5206\u89e3\u3001\u5e76\u884c\u9a8c\u8bc1\u3001\u7ecf\u9a8c\u79ef\u7d2f\u4e0e\u9009\u62e9\u6027\u8bed\u4e49\u5ba1\u67e5\u3002", "why_notable": "\u4ef7\u503c\u4e0d\u6b62\u4e8e\u68c0\u67e5\u8bc1\u660e\u6b63\u786e\u6027\uff0c\u8fd8\u5728\u4e8e\u5fe0\u5b9e\u4fdd\u7559\u539f\u547d\u9898\u8bed\u4e49\uff1b\u9a8c\u8bc1\u8fc7\u7a0b\u53ef\u53d1\u73b0\u66f4\u7b80\u6d01\u7684\u8bc1\u660e\u3001\u79fb\u9664\u591a\u4f59\u4f9d\u8d56\uff0c\u5e76\u79ef\u7d2f\u53ef\u590d\u7528\u77e5\u8bc6\u3002"}, {"abstract": "Training coding agents for long-horizon tasks requires environments with verifiable feedback. Existing pipelines often follow a linear process that ends with validation, establishing usability but providing little guidance on improving training value. Recursive self-improvement (RSI) often requires model rollouts or model training followed by downstream evaluation, with costs and feedback delays amplified on long-horizon tasks. How can we use timely, reliable proxy signals to improve training value and synthesize environments at scale? We present RepoFactory, an automated pipeline that converts real repositories into verifiable environments where agents build complete projects from scratch given a language specification. Its Environment Evolution Loop optimizes a multiplicative objective combining validity, structural coupling, and implementation scope through proxy feedback. RepoFactory produces 10,159 environments across 17 software domains. Training Qwen3.5-35B-A3B on these environments yields RepoHorizen-35B-A3B, which achieves gains of 22.6 percentage points on NL2Repo-Bench and 8.5 points on average across five benchmarks covering long-horizon coding and agentic tasks in real-world production settings, compared with 17.5 and 6.4 points without environment evolution. These results highlight the training value of RepoFactory environments and the additional gains from the Environment Evolution Loop.", "arxiv_id": "2611.21152", "arxiv_url": "https://arxiv.org/abs/2611.21152", "authors": ["Yang Tian", "Tianyu Zheng", "Xiyuan Yang", "Yaxin Du", "Chengran Yang", "Bo Zhao", "Jian Yang", "Bryan Dai"], "brief": "RepoFactory\u5c06\u771f\u5b9e\u4ed3\u5e93\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u7684\u4ece\u96f6\u6784\u5efa\u9879\u76ee\u73af\u5883\uff0c\u518d\u901a\u8fc7\u73af\u5883\u6f14\u5316\u5faa\u73af\uff0c\u4ee5\u6709\u6548\u6027\u3001\u7ed3\u6784\u8026\u5408\u548c\u5b9e\u73b0\u8303\u56f4\u7684\u4e58\u79ef\u76ee\u6807\u4f18\u5316\u8bad\u7ec3\u4ef7\u503c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21152", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["RepoFactory\u751f\u621010,159\u4e2a\u73af\u5883\uff0c\u8986\u76d617\u4e2a\u8f6f\u4ef6\u9886\u57df", "\u73af\u5883\u6f14\u5316\u5faa\u73af\u4ee5\u4ee3\u7406\u53cd\u9988\u4f18\u5316\u4e09\u9879\u6307\u6807\u7684\u4e58\u79ef", "NL2Repo-Bench\u63d0\u534722.6\u4e2a\u767e\u5206\u70b9\uff0c\u65e0\u6f14\u5316\u65f6\u4e3a17.5"], "keywords": ["\u7f16\u7a0b\u667a\u80fd\u4f53", "\u8bad\u7ec3\u73af\u5883", "\u957f\u7a0b\u4efb\u52a1", "\u4ee3\u7406\u53cd\u9988"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21152v1", "published_at": "2026-11-16", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "From Repositories to Training Environments: Scaling Long-Horizon Coding Agents with Environment Evolution Loop", "tldr": "\u7528\u4ee3\u7406\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u4ed3\u5e93\u8bad\u7ec3\u73af\u5883\uff0c\u89c4\u6a21\u5316\u63d0\u5347\u957f\u7a0b\u7f16\u7a0b\u667a\u80fd\u4f53\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "RepoFactory\u5c06\u771f\u5b9e\u4ed3\u5e93\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u7684\u4ece\u96f6\u6784\u5efa\u9879\u76ee\u73af\u5883\uff0c\u518d\u901a\u8fc7\u73af\u5883\u6f14\u5316\u5faa\u73af\uff0c\u4ee5\u6709\u6548\u6027\u3001\u7ed3\u6784\u8026\u5408\u548c\u5b9e\u73b0\u8303\u56f4\u7684\u4e58\u79ef\u76ee\u6807\u4f18\u5316\u8bad\u7ec3\u4ef7\u503c\u3002", "why_notable": "\u628a\u73af\u5883\u9a8c\u8bc1\u63a8\u8fdb\u5230\u8bad\u7ec3\u4ef7\u503c\u4f18\u5316\uff0c\u7528\u53ca\u65f6\u4ee3\u7406\u53cd\u9988\u51cf\u5c11\u5bf9\u6602\u8d35\u6a21\u578b\u8bc4\u4f30\u7684\u4f9d\u8d56\uff1b\u4e94\u9879\u57fa\u51c6\u5e73\u5747\u589e\u76ca\u75316.4\u5347\u81f38.5\u4e2a\u767e\u5206\u70b9\u3002"}, {"abstract": "Agentic memory systems give LLMs persistent memory by extracting experience into text and retrieving it at query time, but the model itself does not evolve: however many interactions it has had, it starts each query the same. Extraction errors compound, implicit cross-session patterns that no single fragment states cannot be surfaced, and the construction cost grows with every conversation. Fine-tuning on past interactions does change the weights, but requires backpropagation at serving time and degrades on long histories. We introduce CLAM (Carried Latent Adapter Memory), which combines the strengths of both: a recurrent hypernetwork performs parametric consolidation, compiling a stream of session activations into a low-rank adapter in a single forward pass with no gradient steps and no language-model generation calls, while a complementary episodic buffer supplies verbatim detail at inference. A gated latent state carries knowledge across sessions in fixed size, so the parametric memory accumulates without growing. On LoCoMo and LongMemEval-S across three open models (2-7B parameters), CLAM leads all agentic baselines by 1-45 points and all gradient-based parametric methods by 10-45 points, while requiring zero generative LLM calls, zero gradient steps, and 3-151x less wall-clock time than extraction systems to build its memory. The two channels are complementary: the consolidated adapter adds 12-15 accuracy points when the episodic buffer misses the gold evidence, and still adds 4-5 points even with an oracle buffer.", "arxiv_id": "2611.20759", "arxiv_url": "https://arxiv.org/abs/2611.20759", "authors": ["Manan Suri", "Dinesh Manocha"], "brief": "CLAM\u7528\u5faa\u73af\u8d85\u7f51\u7edc\u5c06\u4f1a\u8bdd\u6fc0\u6d3b\u6574\u5408\u4e3a\u4f4e\u79e9\u9002\u914d\u5668\uff0c\u65e0\u9700\u68af\u5ea6\u66f4\u65b0\u6216\u8bed\u8a00\u6a21\u578b\u751f\u6210\u3002\u56fa\u5b9a\u5927\u5c0f\u7684\u95e8\u63a7\u6f5c\u72b6\u6001\u8de8\u4f1a\u8bdd\u79ef\u7d2f\u77e5\u8bc6\uff0c\u60c5\u666f\u7f13\u51b2\u533a\u8865\u5145\u539f\u6587\u7ec6\u8282\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.20759", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["LoCoMo\u4e0eLongMemEval-S\u4e0a\u6d4b\u8bd5\u4e09\u4e2a2\u20137B\u6a21\u578b", "\u9886\u5148\u667a\u80fd\u4f53\u8bb0\u5fc6\u57fa\u7ebf1\u201345\u70b9\uff0c\u5efa\u5e93\u63d0\u901f3\u2013151\u500d", "\u7f13\u51b2\u533a\u7f3a\u5931\u8bc1\u636e\u65f6\uff0c\u9002\u914d\u5668\u589e\u76ca12\u201315\u4e2a\u51c6\u786e\u7387\u70b9"], "keywords": ["\u957f\u671f\u8bb0\u5fc6", "\u8d85\u7f51\u7edc", "\u4f4e\u79e9\u9002\u914d\u5668", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.20759v1", "published_at": "2026-11-16", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Instant Weight-Space Consolidation for Long-Term Memory in LLMs", "tldr": "CLAM\u4ee5\u5355\u6b21\u524d\u5411\u4f20\u64ad\u5c06\u8de8\u4f1a\u8bdd\u7ecf\u9a8c\u5199\u5165\u9002\u914d\u5668\uff0c\u5b9e\u73b0\u9ad8\u6548\u957f\u671f\u8bb0\u5fc6\u3002", "upvotes": 0, "what_it_is": "CLAM\u7528\u5faa\u73af\u8d85\u7f51\u7edc\u5c06\u4f1a\u8bdd\u6fc0\u6d3b\u6574\u5408\u4e3a\u4f4e\u79e9\u9002\u914d\u5668\uff0c\u65e0\u9700\u68af\u5ea6\u66f4\u65b0\u6216\u8bed\u8a00\u6a21\u578b\u751f\u6210\u3002\u56fa\u5b9a\u5927\u5c0f\u7684\u95e8\u63a7\u6f5c\u72b6\u6001\u8de8\u4f1a\u8bdd\u79ef\u7d2f\u77e5\u8bc6\uff0c\u60c5\u666f\u7f13\u51b2\u533a\u8865\u5145\u539f\u6587\u7ec6\u8282\u3002", "why_notable": "\u628a\u957f\u671f\u8bb0\u5fc6\u4ece\u5916\u90e8\u6587\u672c\u68c0\u7d22\u63a8\u8fdb\u5230\u6a21\u578b\u53c2\u6570\u6574\u5408\uff0c\u540c\u65f6\u907f\u514d\u5728\u7ebf\u53cd\u5411\u4f20\u64ad\uff1b\u53cc\u901a\u9053\u8bbe\u8ba1\u517c\u987e\u8de8\u4f1a\u8bdd\u77e5\u8bc6\u79ef\u7d2f\u4e0e\u7ec6\u8282\u4fdd\u771f\u3002"}, {"abstract": "We built a hybrid multi-agent trading system that combines large language model (LLM) analysts with momentum-based portfolio construction and rule-based execution. Company-news and macroeconomic agents return structured reports to a coordinator that sets stock weights and cash reserves. We evaluate the portfolio engine using its broker-recorded paper account, which operated with deterministic fallbacks, and compare LLM-enabled configurations through retrospective replays. From March 11 to August 28, 2026, the account returned 34.5%, compared with 14.4% for the S\u0026P 500 fund SPY over the same dates. This raw return advantage came with a larger maximum drawdown. Reconstructed policies also finish above matched SPY and QQQ references when assessments are used in the same session or deferred to the next. Design comparisons examine cash authority, selective invocation, and response contracts. A constant-cash control gives a return estimate close to stance-based sizing, and shorter report contracts improve observed parsing but can change recommendations.", "arxiv_id": "2611.11657", "arxiv_url": "https://arxiv.org/abs/2611.11657", "authors": ["Renee Jia", "Di Mu", "Yao Yu", "Tianrui Liu"], "brief": "\u6784\u5efa\u6df7\u5408\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u7cfb\u7edf\uff0c\u7531\u65b0\u95fb\u4e0e\u5b8f\u89c2\u667a\u80fd\u4f53\u63d0\u4ea4\u7ed3\u6784\u5316\u62a5\u544a\uff0c\u534f\u8c03\u5668\u914d\u7f6e\u80a1\u7968\u6743\u91cd\u548c\u73b0\u91d1\u3002\u7ec4\u5408\u91c7\u7528\u52a8\u91cf\u7b56\u7565\u4e0e\u89c4\u5219\u6267\u884c\uff0c\u5e76\u4ee5\u6a21\u62df\u8d26\u6237\u548c\u5386\u53f2\u56de\u653e\u8bc4\u4f30\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/renee-jia/trading-bot", "github_stars": 93, "hf_url": "https://huggingface.co/papers/2611.11657", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u5238\u5546\u6a21\u62df\u8d26\u6237\u6536\u76ca34.5%\uff0c\u540c\u671fSPY\u4e3a14.4%", "\u542f\u7528\u786e\u5b9a\u6027\u56de\u9000\u7684\u8d26\u6237\u6700\u5927\u56de\u64a4\u9ad8\u4e8eSPY", "\u56fa\u5b9a\u73b0\u91d1\u914d\u7f6e\u6536\u76ca\u63a5\u8fd1\u7acb\u573a\u9a71\u52a8\u914d\u7f6e\uff1b\u77ed\u62a5\u544a\u6539\u5584\u89e3\u6790"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u91cf\u5316\u4ea4\u6613", "\u6295\u8d44\u7ec4\u5408"], "num_comments": 2, "on_hf": true, "organization": "Cornell University", "pdf_url": "https://arxiv.org/pdf/2611.11657v1", "published_at": "2026-11-08", "score": 0.347, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11657.png", "title": "Inside the Trading Loop: Markets, Models, and Moves with LLM Agents", "tldr": "\u878d\u5408\u5927\u6a21\u578b\u5206\u6790\u4e0e\u89c4\u5219\u4ea4\u6613\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u53d6\u5f97\u8f83\u9ad8\u6a21\u62df\u6536\u76ca\uff0c\u4f46\u56de\u64a4\u66f4\u5927\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u6df7\u5408\u591a\u667a\u80fd\u4f53\u4ea4\u6613\u7cfb\u7edf\uff0c\u7531\u65b0\u95fb\u4e0e\u5b8f\u89c2\u667a\u80fd\u4f53\u63d0\u4ea4\u7ed3\u6784\u5316\u62a5\u544a\uff0c\u534f\u8c03\u5668\u914d\u7f6e\u80a1\u7968\u6743\u91cd\u548c\u73b0\u91d1\u3002\u7ec4\u5408\u91c7\u7528\u52a8\u91cf\u7b56\u7565\u4e0e\u89c4\u5219\u6267\u884c\uff0c\u5e76\u4ee5\u6a21\u62df\u8d26\u6237\u548c\u5386\u53f2\u56de\u653e\u8bc4\u4f30\u3002", "why_notable": "\u5c06\u8bed\u8a00\u6a21\u578b\u7814\u5224\u63a5\u5165\u5b8c\u6574\u4ea4\u6613\u95ed\u73af\uff0c\u5e76\u533a\u5206\u6a21\u62df\u8d26\u6237\u4e0e\u6a21\u578b\u914d\u7f6e\u56de\u653e\u7ed3\u679c\uff1b\u6536\u76ca\u4e0e\u56de\u64a4\u7684\u5bf9\u7167\u6709\u52a9\u4e8e\u68c0\u9a8c\u5b9e\u9645\u914d\u7f6e\u4ef7\u503c\u3002"}, {"abstract": "A coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from a brief handoff, agents must recover requirements distributed across colleagues and workplace records, reconcile conflicting evidence, and implement changes evaluated by private executable tests. We evaluate eleven models and find a substantial gap between partial implementation and complete task delivery. The two leading models satisfy approximately 63% of fail-to-pass (F2P) tests but complete fewer than 8% of assignments. Providing complete requirements upfront improves F2P by approximately 16 percentage points for Seed Evolving and GPT-6 Astra, yet leaves complete task success unchanged. Requirement-level trajectory analysis reveals failures throughout the delivery process: Claude-Opus-5.5 directs a mean of 93% of first questions about queried cards to their accountable owners across runs but obtains only 64% of colleague-held requirements. Deferred questions go unfollowed, implementations remain incomplete even after requirements are acquired, and 31% of requirements reported as completed fail their tests. These findings highlight sustained requirement tracking, from clarification through implementation, verification, and handoff, as a key challenge for reliable autonomous software engineering.", "arxiv_id": "2611.20218", "arxiv_url": "https://arxiv.org/abs/2611.20218", "authors": ["Xinping Lei", "Minghao Liu", "Ruijie Zhu", "Xiaohui Hu", "Xingqiao Li", "Ao Zhang", "Wenhao Chai", "Han Li", "Tao Wang", "Jingyuan Zhang", "Enduo Zhao", "Yunfeng Shi", "Yiming Liang", "Zetao Yang", "Xingjian Wang", "Yifan Yao", "Xinkai Ma", "Yingru Li", "Tianhan Yang", "Huan Zhou", "Weiran Shi", "Shen Yan", "Jiaheng Liu", "Stephen Huang", "Eli Cheung", "Weihao Xuan"], "brief": "SWE-CoWork\u5c06\u7f16\u7801\u667a\u80fd\u4f53\u7f6e\u4e8e\u6a21\u62df\u5de5\u7a0b\u7ec4\u7ec7\uff0c\u4ece\u7b80\u77ed\u4ea4\u63a5\u51fa\u53d1\uff0c\u5411\u540c\u4e8b\u548c\u5de5\u4f5c\u8bb0\u5f55\u83b7\u53d6\u9700\u6c42\u3001\u5904\u7406\u51b2\u7a81\u5e76\u5b9e\u73b0\u6539\u52a8\uff0c\u6700\u7ec8\u7528\u79c1\u6709\u53ef\u6267\u884c\u6d4b\u8bd5\u8bc4\u4f30\u4ea4\u4ed8\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/TokenWave-AI/swe-cowork-bench", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.20218", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["101\u9879\u4efb\u52a1\u8986\u76d6101\u4e2a\u771f\u5b9e\u4ed3\u5e93\u300111\u79cd\u8bed\u8a00", "\u6bcf\u9879\u4efb\u52a1\u914d\u7f6e26\u540d\u804c\u8d23\u4e0e\u77e5\u8bc6\u53d7\u9650\u7684\u6a21\u62df\u540c\u4e8b", "\u9886\u5148\u6a21\u578b\u901a\u8fc7\u7ea663%\u7684F2P\u6d4b\u8bd5\uff0c\u5b8c\u6574\u4ea4\u4ed8\u7387\u4e0d\u8db38%"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u9700\u6c42\u8ffd\u8e2a"], "num_comments": 4, "on_hf": true, "organization": "Tokenwave.AI", "pdf_url": "https://arxiv.org/pdf/2611.20218v1", "published_at": "2026-11-15", "score": 0.329, "selected_reasons": ["HF trending (46\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20218.png", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "tldr": "\u7ec4\u7ec7\u534f\u4f5c\u57fa\u51c6\u63ed\u793a\uff0c\u7f16\u7801\u667a\u80fd\u4f53\u80fd\u901a\u8fc7\u90e8\u5206\u6d4b\u8bd5\uff0c\u5374\u96be\u4ee5\u5b8c\u6574\u4ea4\u4ed8\u4efb\u52a1\u3002", "upvotes": 46, "what_it_is": "SWE-CoWork\u5c06\u7f16\u7801\u667a\u80fd\u4f53\u7f6e\u4e8e\u6a21\u62df\u5de5\u7a0b\u7ec4\u7ec7\uff0c\u4ece\u7b80\u77ed\u4ea4\u63a5\u51fa\u53d1\uff0c\u5411\u540c\u4e8b\u548c\u5de5\u4f5c\u8bb0\u5f55\u83b7\u53d6\u9700\u6c42\u3001\u5904\u7406\u51b2\u7a81\u5e76\u5b9e\u73b0\u6539\u52a8\uff0c\u6700\u7ec8\u7528\u79c1\u6709\u53ef\u6267\u884c\u6d4b\u8bd5\u8bc4\u4f30\u4ea4\u4ed8\u3002", "why_notable": "\u5b83\u628a\u8bc4\u6d4b\u4ece\u4ee3\u7801\u5b9e\u73b0\u6269\u5c55\u5230\u7ec4\u7ec7\u5185\u7684\u9700\u6c42\u8ffd\u8e2a\u4e0e\u4ea4\u4ed8\uff1b\u9884\u5148\u63d0\u4f9b\u5b8c\u6574\u9700\u6c42\u4ecd\u672a\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\uff0c\u8bf4\u660e\u74f6\u9888\u4e0d\u6b62\u4fe1\u606f\u83b7\u53d6\u3002"}, {"abstract": "In this work, we study on-policy distillation (OPD) for transferring agentic coding capabilities from a large teacher model to a smaller student model. Prior work has focused primarily on reasoning and short-horizon agentic tasks. We present SWE-OPD, a minimal OPD study for software engineering, where the student interacts with executable repositories and the teacher supervises the prefixes visited by the student. Across three teacher--student pairs, two training sources, and three SWE benchmarks, we find that on-policy supervision transfers coding capability: supervision from Qwen3.6-27B increases the SWE-bench Pro resolve rate of Qwen3.5-9B from 35.9% to 39.4%. Refreshing trajectories is not strictly required either, as an offline variant with cached teacher scores still improves over the student baselines while cutting end-to-end GPU-hours by 59.4%--72.6% and halving peak GPU allocation, at benchmark-dependent accuracy. Furthermore, we extend the offline variant to corss-tokenizer scenarios: distilling GLM-4.5-Air from DeepSeek-V4-Flash-0731 raises its SWE-bench Pro and Multilingual resolve rate from 35.8% to 39.7% and from 41.8% to 46.2%, around 4% and 4.6% improvement, respectively. We also find that a decreasing loss, however, does not necessarily indicate improved agent performance: under top-$K$ reverse-KL loss, one student exhibits severe repetition despite a decreasing loss. We identify a support-mass gradient term as a potential mechanism underlying this failure.", "arxiv_id": "2611.21020", "arxiv_url": "https://arxiv.org/abs/2611.21020", "authors": ["Yuhang He", "Yanyu Chen", "Chuanzhe Guo", "Jie Zhu", "Zichen Tian", "Hongyu Ge", "Zixuan Ren", "Huang He", "Bingjin Chen", "Junyuan Shang", "Shuohuan Wang", "Yongqi Zhang", "Irwin King", "Jing Liu"], "brief": "\u7814\u7a76\u5c06\u5927\u6a21\u578b\u7684\u7f16\u7801\u667a\u80fd\u4f53\u80fd\u529b\u84b8\u998f\u7ed9\u5c0f\u6a21\u578b\uff1a\u5b66\u751f\u5728\u53ef\u6267\u884c\u4ee3\u7801\u4ed3\u5e93\u4e2d\u4ea4\u4e92\uff0c\u6559\u5e08\u76d1\u7763\u5b66\u751f\u8bbf\u95ee\u7684\u8f68\u8ff9\u524d\u7f00\uff0c\u5e76\u63a2\u7d22\u7f13\u5b58\u6559\u5e08\u8bc4\u5206\u7684\u79bb\u7ebf\u4e0e\u8de8\u5206\u8bcd\u5668\u65b9\u6848\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21020", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["OPD\u4f7fQwen3.5-9B\u7684Pro\u89e3\u51b3\u7387\u4ece35.9%\u5347\u81f339.4%", "\u79bb\u7ebf\u7f13\u5b58\u6559\u5e08\u8bc4\u5206\uff0cGPU\u65f6\u6570\u51cf\u5c1159.4%\u201472.6%", "top-K\u53cd\u5411KL\u635f\u5931\u4e0b\u964d\u4ecd\u53ef\u80fd\u4f34\u968f\u4e25\u91cd\u91cd\u590d"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bad\u7ec3\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21020v1", "published_at": "2026-11-16", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SWE-OPD: On-Policy Distillation for Agentic Coding", "tldr": "\u7528\u5b66\u751f\u81ea\u8eab\u8f68\u8ff9\u84b8\u998f\u7f16\u7801\u667a\u80fd\u4f53\uff0c\u63d0\u5347\u4fee\u590d\u80fd\u529b\u5e76\u663e\u8457\u964d\u4f4e\u8bad\u7ec3\u6210\u672c", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5c06\u5927\u6a21\u578b\u7684\u7f16\u7801\u667a\u80fd\u4f53\u80fd\u529b\u84b8\u998f\u7ed9\u5c0f\u6a21\u578b\uff1a\u5b66\u751f\u5728\u53ef\u6267\u884c\u4ee3\u7801\u4ed3\u5e93\u4e2d\u4ea4\u4e92\uff0c\u6559\u5e08\u76d1\u7763\u5b66\u751f\u8bbf\u95ee\u7684\u8f68\u8ff9\u524d\u7f00\uff0c\u5e76\u63a2\u7d22\u7f13\u5b58\u6559\u5e08\u8bc4\u5206\u7684\u79bb\u7ebf\u4e0e\u8de8\u5206\u8bcd\u5668\u65b9\u6848\u3002", "why_notable": "\u8868\u660e\u5b66\u751f\u8f68\u8ff9\u76d1\u7763\u53ef\u8fc1\u79fb\u957f\u7a0b\u7f16\u7801\u80fd\u529b\uff0c\u79bb\u7ebf\u84b8\u998f\u4e5f\u80fd\u517c\u987e\u6210\u672c\u4e0e\u6548\u679c\uff1b\u540c\u65f6\u63ed\u793a\u8bad\u7ec3\u635f\u5931\u4e0b\u964d\u4e0d\u7b49\u4e8e\u667a\u80fd\u4f53\u8868\u73b0\u6539\u5584\u3002"}, {"abstract": "Advancing medical AI for inclusive healthcare requires evaluation across diverse healthcare roles, tasks, and care settings, but benchmark coverage remains uneven. We introduce InclusionMed, an open medical AI evaluation initiative for inclusive healthcare. The InclusionMed Atlas organizes benchmarks across three healthcare roles and three AI capabilities. For the first release, we selected four public benchmarks from 388 candidates through structured audits and independent reproduction. With InclusionMed-DxFiles, our private diagnostic reasoning benchmark, the Atlas contains five benchmarks covering three of its nine role--capability cells. We evaluated frontier large language models on the Atlas and aggregated their results into the InclusionMed Index, with overall scores ranging from 17.5 to 49.1 out of 100. The Index also reports scores by healthcare role and AI capability, showing that a model\u0027s rank varied with the role or capability considered. A within-benchmark analysis using task-level tags showed that the ten highest-ranked models in the Index all scored higher on patient communication than on clinical decision-making. Models with similar Index scores also differed substantially in estimated inference cost. These findings highlight the need for evaluation covering more diverse healthcare needs and for context-specific model selection. Through open collaboration and community contributions, InclusionMed seeks to ensure that diverse healthcare needs worldwide shape how medical AI progress is defined and measured.", "arxiv_id": "2611.21218", "arxiv_url": "https://arxiv.org/abs/2611.21218", "authors": ["The InclusionMed Collaboration"], "brief": "\u63a8\u51fa\u533b\u7597AI\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ee5\u4e09\u7c7b\u533b\u7597\u89d2\u8272\u548c\u4e09\u79cd\u80fd\u529b\u7ec4\u7ec7\u57fa\u51c6\uff0c\u7ecf\u5ba1\u8ba1\u4e0e\u590d\u73b0\u7b5b\u9009\u516c\u5f00\u6d4b\u8bd5\uff0c\u5e76\u52a0\u5165\u79c1\u6709\u8bca\u65ad\u63a8\u7406\u6d4b\u8bd5\uff0c\u6c47\u603b\u603b\u5206\u53ca\u5206\u9879\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/panuvi/inclusionmed", "github_stars": 38, "hf_url": "https://huggingface.co/papers/2611.21218", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["388\u4e2a\u5019\u9009\u7ecf\u5ba1\u8ba1\u4e0e\u72ec\u7acb\u590d\u73b0\uff0c\u9009\u51fa4\u4e2a\u516c\u5f00\u57fa\u51c6", "\u52a0\u5165InclusionMed-DxFiles\uff0c\u5171\u8986\u76d6\u4e5d\u683c\u4e2d\u7684\u4e09\u683c", "\u524d\u5341\u6a21\u578b\u5747\u5728\u60a3\u8005\u6c9f\u901a\u4e0a\u4f18\u4e8e\u4e34\u5e8a\u51b3\u7b56"], "keywords": ["\u533b\u7597\u4eba\u5de5\u667a\u80fd", "\u6a21\u578b\u8bc4\u6d4b", "\u8bca\u65ad\u63a8\u7406", "\u63a8\u7406\u6210\u672c"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21218v1", "published_at": "2026-11-16", "score": 0.322, "selected_reasons": ["HF trending (63\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21218.png", "title": "InclusionMed: Benchmarking AI for Inclusive Healthcare", "tldr": "\u4ee5\u89d2\u8272\u4e0e\u80fd\u529b\u53cc\u7ef4\u5ea6\u8bc4\u6d4b\u533b\u7597\u5927\u6a21\u578b\uff0c\u63ed\u793a\u7efc\u5408\u6392\u540d\u63a9\u76d6\u7684\u573a\u666f\u5dee\u5f02\u3002", "upvotes": 63, "what_it_is": "\u63a8\u51fa\u533b\u7597AI\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ee5\u4e09\u7c7b\u533b\u7597\u89d2\u8272\u548c\u4e09\u79cd\u80fd\u529b\u7ec4\u7ec7\u57fa\u51c6\uff0c\u7ecf\u5ba1\u8ba1\u4e0e\u590d\u73b0\u7b5b\u9009\u516c\u5f00\u6d4b\u8bd5\uff0c\u5e76\u52a0\u5165\u79c1\u6709\u8bca\u65ad\u63a8\u7406\u6d4b\u8bd5\uff0c\u6c47\u603b\u603b\u5206\u53ca\u5206\u9879\u8868\u73b0\u3002", "why_notable": "\u6a21\u578b\u7efc\u5408\u5206\u4ec5\u4e3a17.5\u81f349.1\u5206\uff0c\u6392\u540d\u968f\u89d2\u8272\u4e0e\u80fd\u529b\u53d8\u5316\uff0c\u8fd1\u4f3c\u5206\u6570\u7684\u63a8\u7406\u6210\u672c\u4e5f\u6709\u5dee\u5f02\uff0c\u4e3a\u6309\u533b\u7597\u573a\u666f\u9009\u578b\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Tool-using agents act on email, files, and payments, so an instruction hidden in a web page or a shared document can make an agent send data or money to an attacker. Many runtime defenses put a language model on the decision that lets an action through, so the decision depends on a model that may read the attacker\u0027s text and adds model calls to every step. Provenance defenses keep the model off the final check but need a model to plan or route each task first. Where an action goes can instead be read from the tools\u0027 typed returns: an email\u0027s sender or a payment\u0027s account arrives in a typed field, while injected instructions arrive as free text. SPILLWAY turns this observation into a deterministic floor with no per-task plan. The check admits a call when each target value that appears in tool output but not in the user\u0027s task was returned by a read-only tool in a typed field or is covered by a fixed delegation rule. A deterministic sanitizer removes instruction-like regions its fixed rules match before the model reads them and retains the removed spans as evidence, and a local judge may restore a refused call, never one whose target lies in the removed text. Across three backbones, and seven task suites on one of them, no standard templated injection redirects an action to an attacker\u0027s target under SPILLWAY, at the highest observed mean utility and composite scores (NRP, ERS) of the defenses we run under that attack. A forged chat template also produces a raw zero, and mean in-scope attack success under a released reinforcement-learning attacker is .005. SPILLWAY reaches this floor with no defense-triggered backbone re-run and almost no added model call. As personal AI agents act on users\u0027 email, files, and payments, SPILLWAY gives them an auditable refusal floor on where their actions go that keeps them useful and holds across backbones.", "arxiv_id": "2611.07222", "arxiv_url": "https://arxiv.org/abs/2611.07222", "authors": ["Woosang Lim", "Yeseul Chang", "Jaewoo Lee"], "brief": "SPILLWAY\u5c06\u52a8\u4f5c\u76ee\u6807\u51c6\u5165\u4e0e\u6587\u672c\u6e05\u6d17\u89e3\u8026\uff1a\u4f9d\u636e\u5de5\u5177\u7c7b\u578b\u5b57\u6bb5\u548c\u56fa\u5b9a\u59d4\u6258\u89c4\u5219\u786e\u5b9a\u653e\u884c\u76ee\u6807\uff0c\u518d\u6e05\u9664\u5339\u914d\u89c4\u5219\u7684\u6307\u4ee4\u6587\u672c\uff0c\u65e0\u9700\u9010\u4efb\u52a1\u89c4\u5212\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": "https://github.com/saintmachines/spillway", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.07222", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u76ee\u6807\u987b\u6765\u81ea\u53ea\u8bfb\u5de5\u5177\u7684\u7c7b\u578b\u5b57\u6bb5\u6216\u56fa\u5b9a\u59d4\u6258\u89c4\u5219", "\u6e05\u6d17\u4fdd\u7559\u5220\u9664\u8bc1\u636e\uff0c\u5c40\u90e8\u88c1\u5224\u4e0d\u5f97\u6062\u590d\u6d89\u53ca\u8be5\u6587\u672c\u76ee\u6807\u7684\u8c03\u7528", "\u8986\u76d63\u79cd\u9aa8\u5e72\uff1b\u5f3a\u5316\u5b66\u4e60\u653b\u51fb\u8005\u5e73\u5747\u6210\u529f\u7387\u4e3a0.005"], "keywords": ["\u63d0\u793a\u6ce8\u5165", "\u5de5\u5177\u667a\u80fd\u4f53", "\u5b89\u5168\u9632\u5fa1"], "num_comments": 2, "on_hf": true, "organization": "SAINT Machines", "pdf_url": "https://arxiv.org/pdf/2611.07222v2", "published_at": "2026-11-04", "score": 0.322, "selected_reasons": ["HF trending (56\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.07222.png", "title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "tldr": "\u4ee5\u786e\u5b9a\u6027\u76ee\u6807\u51c6\u5165\u4e0e\u6587\u672c\u6e05\u6d17\u5206\u79bb\uff0c\u4f4e\u5f00\u9500\u963b\u6b62\u5de5\u5177\u667a\u80fd\u4f53\u88ab\u6ce8\u5165\u91cd\u5b9a\u5411\u3002", "upvotes": 56, "what_it_is": "SPILLWAY\u5c06\u52a8\u4f5c\u76ee\u6807\u51c6\u5165\u4e0e\u6587\u672c\u6e05\u6d17\u89e3\u8026\uff1a\u4f9d\u636e\u5de5\u5177\u7c7b\u578b\u5b57\u6bb5\u548c\u56fa\u5b9a\u59d4\u6258\u89c4\u5219\u786e\u5b9a\u653e\u884c\u76ee\u6807\uff0c\u518d\u6e05\u9664\u5339\u914d\u89c4\u5219\u7684\u6307\u4ee4\u6587\u672c\uff0c\u65e0\u9700\u9010\u4efb\u52a1\u89c4\u5212\u3002", "why_notable": "\u628a\u52a8\u4f5c\u53bb\u5411\u7684\u6700\u7ec8\u7ea6\u675f\u79fb\u51fa\u8bed\u8a00\u6a21\u578b\uff0c\u5f62\u6210\u53ef\u5ba1\u8ba1\u7684\u62d2\u7edd\u5e95\u7ebf\uff1b\u6807\u51c6\u6a21\u677f\u653b\u51fb\u672a\u80fd\u91cd\u5b9a\u5411\uff0c\u4e14\u51e0\u4e4e\u4e0d\u589e\u52a0\u6a21\u578b\u8c03\u7528\u3002"}, {"abstract": "Real-world portfolio management requires converting noisy market observations into coordinated, simultaneous allocations across multiple assets under shared capital constraints. Advances in forecasting models and alpha discovery help identify opportunities. However, traditional pipelines often decouple signal forecasting from portfolio construction, potentially misaligning learning with allocation and execution objectives. We present AllocFlow, an end-to-end flow-matching framework that directly generates joint portfolio allocations from raw multi-asset market histories. To capture dependencies among portfolio positions, AllocFlow employs a cross-asset flow Transformer conditioned on temporal market representations to generate continuous, signed position weights across all instruments jointly. To address the sample inefficiency and instability of learning continuous allocation policies from scratch, we establish a two-stage training scheme: strategy-supervised imitation shapes a structured distribution of candidate portfolios, followed by group-relative reinforcement learning (RL) that refines joint decisions using portfolio-level financial rewards and a frozen policy reference. On hourly cryptocurrency perpetual futures, RL refinement raises the annualized net return of the imitation policy from $27.79\\%$ to $51.38\\%$ and its Calmar ratio from $0.955$ to $4.043$, surpassing the teacher strategy on every metric, and AllocFlow reaches a Calmar ratio of $4.90$ on six further months of unseen 2026 data without retraining.", "arxiv_id": "2611.19937", "arxiv_url": "https://arxiv.org/abs/2611.19937", "authors": ["Annan Wang", "Yuchen Xie", "Yu Cen", "Leon Liangyu Chen", "Qianyu Julie Zhu", "Xin Li", "Tianyi Wei", "Weisi Lin"], "brief": "AllocFlow\u4ece\u539f\u59cb\u591a\u8d44\u4ea7\u884c\u60c5\u76f4\u63a5\u751f\u6210\u8054\u5408\u4ed3\u4f4d\uff0c\u7528\u8de8\u8d44\u4ea7\u6d41Transformer\u5efa\u6a21\u6301\u4ed3\u4f9d\u8d56\uff1b\u5148\u6a21\u4eff\u7b56\u7565\u5f62\u6210\u5019\u9009\u7ec4\u5408\uff0c\u518d\u4ee5\u7ec4\u5408\u7ea7\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.LG", "q-fin.TR"], "github_repo": "https://github.com/allocflow/AllocFlow", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2611.19937", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8de8\u8d44\u4ea7\u6d41Transformer\u8054\u5408\u751f\u6210\u8fde\u7eed\u3001\u6709\u6b63\u8d1f\u65b9\u5411\u7684\u4ed3\u4f4d\u6743\u91cd", "\u7b56\u7565\u76d1\u7763\u6a21\u4eff\u540e\uff0c\u4ee5\u51bb\u7ed3\u7b56\u7565\u53c2\u7167\u8fdb\u884c\u7ec4\u76f8\u5bf9\u5f3a\u5316\u5b66\u4e60", "\u5c0f\u65f6\u7ea7\u52a0\u5bc6\u6c38\u7eed\u5408\u7ea6\u4e0a\uff0c\u5e74\u5316\u51c0\u6536\u76ca\u753127.79%\u5347\u81f351.38%"], "keywords": ["\u6d41\u5339\u914d", "\u6295\u8d44\u7ec4\u5408", "\u5f3a\u5316\u5b66\u4e60", "\u91cf\u5316\u4ea4\u6613"], "num_comments": 4, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2611.19937v1", "published_at": "2026-11-15", "score": 0.321, "selected_reasons": ["HF trending (68\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.19937.png", "title": "AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data", "tldr": "\u7528\u6d41\u5339\u914d\u76f4\u63a5\u751f\u6210\u591a\u8d44\u4ea7\u8054\u5408\u4ed3\u4f4d\uff0c\u518d\u4ee5\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u6536\u76ca\u4e0e\u56de\u64a4\u8868\u73b0\u3002", "upvotes": 68, "what_it_is": "AllocFlow\u4ece\u539f\u59cb\u591a\u8d44\u4ea7\u884c\u60c5\u76f4\u63a5\u751f\u6210\u8054\u5408\u4ed3\u4f4d\uff0c\u7528\u8de8\u8d44\u4ea7\u6d41Transformer\u5efa\u6a21\u6301\u4ed3\u4f9d\u8d56\uff1b\u5148\u6a21\u4eff\u7b56\u7565\u5f62\u6210\u5019\u9009\u7ec4\u5408\uff0c\u518d\u4ee5\u7ec4\u5408\u7ea7\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\u3002", "why_notable": "\u5c06\u9884\u6d4b\u3001\u914d\u7f6e\u4e0e\u4ea4\u6613\u76ee\u6807\u7edf\u4e00\u5230\u7aef\u5230\u7aef\u5b66\u4e60\u4e2d\uff1b\u65e0\u9700\u91cd\u8bad\uff0c\u5728\u989d\u5916\u516d\u4e2a\u6708\u76842026\u5e74\u672a\u89c1\u6570\u636e\u4e0a\u53d6\u5f974.90\u7684Calmar\u6bd4\u7387\u3002"}, {"abstract": "Streaming video generation must sustain quality beyond the training horizon while handling self-generated history and growing cache costs. To address these challenges, we present MovieRoll, a base-to-distilled framework that connects streaming fine-tuning, long-rollout distillation, and long-horizon inference. We first establish a robust multi-step base through Window-wise Teacher Forcing (WinTF), which jointly denoises chunks at progressive noise levels with bidirectional attention within each window and causal access to preceding history. To retain historical context efficiently, hierarchical KV-cache compression (HieraKV) exploits layer-wise attention patterns, retaining full history in shallow layers and sink--recent history in deeper layers. This reduces cache memory by up to 78% while improving generation quality. Building on this base, cumulative long tuning with distribution matching distillation (CuLT-DMD) holds parameters fixed throughout each long self-rollout and averages local gradients before updating. Each update therefore combines supervision across temporal positions while retaining only one local computation graph, enabling efficient long-rollout training of a few-step generator. To extend generation beyond the training horizon, KV recomputation bounds context for both models, while guidance annealing (AnnealCFG) reduces guidance toward the clean endpoint to stabilize MovieRoll-Base. Complementing these modeling advances, FBCA attention and PS-VAE decoding support efficient training and streaming output. On HeliosBench, MovieRoll-Base remains competitive at 30s after training on videos of up to 15s, and MovieRoll-Distilled achieves the highest total scores among the compared methods across single- and multi-event evaluations up to 60s, combining sustained naturalness with active motion.", "arxiv_id": "2611.21339", "arxiv_url": "https://arxiv.org/abs/2611.21339", "authors": ["Yunyang Ge", "Weijie Kong", "Ryan Xu", "Yue Wu", "Qi Tian", "Jiangfeng Xiong", "Bin Lin", "Mingzhe Zheng", "Shenghai Yuan", "Zheyuan Liu", "Jianwei Zhang", "Li Yuan"], "brief": "\u63d0\u51fa\u8fde\u63a5\u6d41\u5f0f\u5fae\u8c03\u3001\u957f\u7a0b\u84b8\u998f\u4e0e\u63a8\u7406\u7684\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u4ee5\u5206\u7a97\u53bb\u566a\u5efa\u7acb\u57fa\u7840\u6a21\u578b\uff0c\u518d\u7528\u957f\u7a0b\u81ea\u751f\u6210\u8f68\u8ff9\u8bad\u7ec3\u5c11\u6b65\u751f\u6210\u5668\uff0c\u5e76\u538b\u7f29\u5386\u53f2\u7f13\u5b58\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Tencent-Hunyuan/MovieRoll", "github_stars": 53, "hf_url": "https://huggingface.co/papers/2611.21339", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["WinTF\u7ed3\u5408\u7a97\u5185\u53cc\u5411\u6ce8\u610f\u529b\u4e0e\u5386\u53f2\u56e0\u679c\u8bbf\u95ee", "HieraKV\u5206\u5c42\u4fdd\u7559\u5386\u53f2\uff0c\u7f13\u5b58\u5185\u5b58\u6700\u591a\u51cf\u5c1178%", "CuLT-DMD\u56fa\u5b9a\u53c2\u6570\u5b8c\u6210\u957f\u8f68\u8ff9\u540e\uff0c\u5e73\u5747\u5c40\u90e8\u68af\u5ea6\u66f4\u65b0"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6d41\u5f0f\u751f\u6210", "\u77e5\u8bc6\u84b8\u998f", "\u7f13\u5b58\u538b\u7f29"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.21339v1", "published_at": "2026-11-16", "score": 0.306, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21339.png", "title": "MovieRoll: A Systematic Framework for Rolling Out Long-Form Videos", "tldr": "\u901a\u8fc7\u5206\u7a97\u8bad\u7ec3\u3001\u7f13\u5b58\u538b\u7f29\u4e0e\u957f\u7a0b\u84b8\u998f\uff0c\u5b9e\u73b0\u8d85\u51fa\u8bad\u7ec3\u65f6\u957f\u7684\u7a33\u5b9a\u89c6\u9891\u751f\u6210\u3002", "upvotes": 11, "what_it_is": "\u63d0\u51fa\u8fde\u63a5\u6d41\u5f0f\u5fae\u8c03\u3001\u957f\u7a0b\u84b8\u998f\u4e0e\u63a8\u7406\u7684\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u4ee5\u5206\u7a97\u53bb\u566a\u5efa\u7acb\u57fa\u7840\u6a21\u578b\uff0c\u518d\u7528\u957f\u7a0b\u81ea\u751f\u6210\u8f68\u8ff9\u8bad\u7ec3\u5c11\u6b65\u751f\u6210\u5668\uff0c\u5e76\u538b\u7f29\u5386\u53f2\u7f13\u5b58\u3002", "why_notable": "\u4ec5\u7528\u6700\u957f15\u79d2\u89c6\u9891\u8bad\u7ec3\uff0c\u57fa\u7840\u6a21\u578b\u572830\u79d2\u4ecd\u5177\u7ade\u4e89\u529b\uff1b\u84b8\u998f\u6a21\u578b\u5728HeliosBench\u6700\u957f60\u79d2\u8bc4\u6d4b\u4e2d\u603b\u5206\u9886\u5148\u3002"}, {"abstract": "Continuous autoregressive TTS relies on an acoustic target that enables stable next-latent modeling while preserving fine-grained acoustic details. While existing approaches employ learned compressed representations (e.g., continuous VAE latents) to render prediction tractable, they rely on complex neural encoders that often cap generation fidelity. Conversely, training-free targets like mel-spectrograms eliminate encoder overhead, yet their potential for autoregressive generation remains largely underexplored. In this work, we propose VoxMel, a tokenizer-free framework for autoregressive TTS that makes stable mel modeling tractable through a fixed, exactly invertible two-axis Haar transform. The transform first decomposes each mel spectrogram along frequency into local averages and a frequency residual, then splits the averaged component along time into Coarse-Mel and a temporal residual. A language-model backbone with a flow-matching head autoregressively generates Coarse-Mel. Non-autoregressive residual tiers then predict the temporal residual from Coarse-Mel, followed by the frequency residual conditioned on the reconstructed Frequency-Averaged Mel. Neither residual is fed back into the autoregressive history. Trained on 100K hours of Emilia, the supervised 0.6B model obtains 1.51\\% WER and 0.738 speaker similarity (SIM) on test-en, and 1.29\\% CER and 0.755 SIM on test-zh. GRPO improves these results to 1.15\\% WER / 0.753 SIM and 1.17\\% CER / 0.776 SIM, respectively. We also distill the guided flow head into two- and four-step students, requiring 2 or 4 head evaluations per coarse frame. The four-step student retains competitive SIM and nearly matches the supervised model in WER/CER.", "arxiv_id": "2611.20254", "arxiv_url": "https://arxiv.org/abs/2611.20254", "authors": ["Wenhao Guan", "Jiaxin Ye", "Haitao Li", "Yifan Duan", "Junxi Liu", "Wangjin Zhou", "Lin Li", "Qingyang Hong", "Xie Chen"], "brief": "\u63d0\u51fa\u65e0\u5206\u8bcd\u5668\u8bed\u97f3\u5408\u6210\u6846\u67b6\uff0c\u7528\u56fa\u5b9a\u53ef\u9006\u7684\u53cc\u8f74Haar\u53d8\u6362\u62c6\u5206\u6885\u5c14\u8c31\u3002\u8bed\u8a00\u6a21\u578b\u4e0e\u6d41\u5339\u914d\u5934\u81ea\u56de\u5f52\u751f\u6210\u7c97\u7c92\u5ea6\u8c31\uff0c\u518d\u4ee5\u975e\u81ea\u56de\u5f52\u6a21\u5757\u8865\u9f50\u65f6\u9891\u6b8b\u5dee\u3002", "categories": ["eess.AS"], "github_repo": "https://github.com/VoxDance-Lab/VoxMel", "github_stars": 92, "hf_url": "https://huggingface.co/papers/2611.20254", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53cc\u8f74Haar\u5206\u89e3\u65f6\u9891\u7ec6\u8282\uff0c\u6b8b\u5dee\u4e0d\u56de\u6d41\u81ea\u56de\u5f52\u5386\u53f2", "0.6B\u6a21\u578b\u8bad\u7ec3\u4e8e10\u4e07\u5c0f\u65f6Emilia\u8bed\u97f3", "GRPO\u540e\u82f1\u6587WER\u4e3a1.15%\uff0c\u4e2d\u6587CER\u4e3a1.17%"], "keywords": ["\u8bed\u97f3\u5408\u6210", "\u81ea\u56de\u5f52\u6a21\u578b", "\u6d41\u5339\u914d", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 2, "on_hf": true, "organization": "VoxDance-Lab", "pdf_url": "https://arxiv.org/pdf/2611.20254v1", "published_at": "2026-11-15", "score": 0.303, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20254.png", "title": "VoxMel TTS Technical Report", "tldr": "\u901a\u8fc7\u53ef\u9006\u6885\u5c14\u5206\u89e3\u5b9e\u73b0\u65e0\u5206\u8bcd\u5668\u81ea\u56de\u5f52\u8bed\u97f3\u5408\u6210\uff0c\u517c\u987e\u751f\u6210\u7a33\u5b9a\u6027\u4e0e\u7ec6\u8282\u4fdd\u771f\u3002", "upvotes": 22, "what_it_is": "\u63d0\u51fa\u65e0\u5206\u8bcd\u5668\u8bed\u97f3\u5408\u6210\u6846\u67b6\uff0c\u7528\u56fa\u5b9a\u53ef\u9006\u7684\u53cc\u8f74Haar\u53d8\u6362\u62c6\u5206\u6885\u5c14\u8c31\u3002\u8bed\u8a00\u6a21\u578b\u4e0e\u6d41\u5339\u914d\u5934\u81ea\u56de\u5f52\u751f\u6210\u7c97\u7c92\u5ea6\u8c31\uff0c\u518d\u4ee5\u975e\u81ea\u56de\u5f52\u6a21\u5757\u8865\u9f50\u65f6\u9891\u6b8b\u5dee\u3002", "why_notable": "\u7ed5\u5f00\u5b66\u4e60\u5f0f\u58f0\u5b66\u7f16\u7801\u5668\uff0c\u63d0\u4f9b\u76f4\u63a5\u5efa\u6a21\u6885\u5c14\u8c31\u7684\u53ef\u884c\u8def\u5f84\uff1b\u56db\u6b65\u6d41\u5934\u84b8\u998f\u63a5\u8fd1\u76d1\u7763\u6a21\u578b\u7684\u8bc6\u522b\u9519\u8bef\u7387\uff0c\u4e3a\u964d\u4f4e\u751f\u6210\u5f00\u9500\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Frontier Vision-Language Models (VLMs) such as GPT-6 Astra have demonstrated remarkable capabilities in robot control, suggesting that broad pretraining provides knowledge valuable for physical action. Yet most Vision-Language-Action (VLA) policies still rely on much smaller VLM backbones, leaving this potential largely untapped. We ask whether frontier-scale representations can provide a stronger foundation for robot learning. We introduce ScaleVLA, which connects a 552B DeepSeek-V4.1-Flash backbone to a trainable action DiT, and systematically compare VLMs from 2B to 552B under a shared training setup. We evaluate three fundamental capabilities of robot foundation models. In sample efficiency, just 10 demonstrations outperform a 2B backbone trained with 50 (87.8% vs. 85.6%). In generalization, LIBERO-PRO success reaches 45.1%, compared with at most 31.3% for smaller backbones. In precise manipulation, real-world charger insertion improves from 4/10 to 9/10 successes, with gains concentrated in contact-sensitive alignment. Despite its scale, ScaleVLA achieves 216 ms median latency per action chunk. Our findings suggest that frontier VLMs can serve not only as reasoning agents, but also as powerful representational foundations for efficient and generalizable robot policies.", "arxiv_id": "2611.21607", "arxiv_url": "https://arxiv.org/abs/2611.21607", "authors": ["Ruixi Yu", "Dairu Liu", "Xuchuan Chen", "Zekun Qi", "Zekai Li", "Zhuo Cao", "Luyang Niu", "Yingsheng Zhang", "Sikai Liang", "Ke Fan", "He Wang", "Li Yi"], "brief": "ScaleVLA\u5c065520\u4ebf\u53c2\u6570\u7684DeepSeek-V4.1-Flash\u8fde\u63a5\u53ef\u8bad\u7ec3\u52a8\u4f5cDiT\uff0c\u5e76\u5728\u7edf\u4e00\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u6bd4\u8f83\u4e0d\u540c\u89c4\u6a21\u9aa8\u5e72\u5bf9\u673a\u5668\u4eba\u7b56\u7565\u7684\u5f71\u54cd\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.21607", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["10\u6b21\u793a\u8303\u6210\u529f\u738787.8%\uff0c\u8d85\u8d8a2B\u9aa8\u5e72\u752850\u6b21\u793a\u8303", "LIBERO-PRO\u6210\u529f\u738745.1%\uff0c\u5c0f\u9aa8\u5e72\u6700\u9ad831.3%", "\u771f\u5b9e\u5145\u7535\u5668\u63d2\u63a5\u6210\u529f\u7387\u4ece4/10\u5347\u81f39/10"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u6a21\u578b\u89c4\u6a21\u6269\u5c55", "\u5c11\u6837\u672c\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "galbot", "pdf_url": "https://arxiv.org/pdf/2611.21607v1", "published_at": "2026-11-16", "score": 0.302, "selected_reasons": ["HF trending (41\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.21607.png", "title": "ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters", "tldr": "\u5c06\u8d85\u5927\u89c6\u89c9\u8bed\u8a00\u9aa8\u5e72\u63a5\u5165\u52a8\u4f5c\u6a21\u578b\uff0c\u63d0\u5347\u673a\u5668\u4eba\u5c11\u6837\u672c\u5b66\u4e60\u3001\u6cdb\u5316\u4e0e\u7cbe\u7ec6\u64cd\u4f5c\u3002", "upvotes": 41, "what_it_is": "ScaleVLA\u5c065520\u4ebf\u53c2\u6570\u7684DeepSeek-V4.1-Flash\u8fde\u63a5\u53ef\u8bad\u7ec3\u52a8\u4f5cDiT\uff0c\u5e76\u5728\u7edf\u4e00\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u6bd4\u8f83\u4e0d\u540c\u89c4\u6a21\u9aa8\u5e72\u5bf9\u673a\u5668\u4eba\u7b56\u7565\u7684\u5f71\u54cd\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\u8d85\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u8868\u5f81\u53ef\u76f4\u63a5\u589e\u5f3a\u673a\u5668\u4eba\u7b56\u7565\uff0c\u800c\u4e0d\u53ea\u7528\u4e8e\u63a8\u7406\uff1b\u6bcf\u52a8\u4f5c\u5757\u4e2d\u4f4d\u5ef6\u8fdf216\u6beb\u79d2\uff0c\u4e5f\u5c55\u793a\u4e86\u90e8\u7f72\u6f5c\u529b\u3002"}, {"abstract": "When high-quality data runs out, a common practice is to train on it for several epochs, but each repeat is worth less than the last. Latent feedback, which feeds each token\u0027s top-layer state into the next token\u0027s input, is another way to spend that compute, yet it has not been tested against a vanilla Transformer that spends the same compute on more epochs. We run this test across a ladder of model sizes, unique data and epochs, tuning both models at every size and amount of unique data. Latent feedback makes every FLOP and every token count for more except when unique data is scarce relative to model size, a regime that today\u0027s models are far from. We find that latent feedback serves as an amplifier: with unique data fixed, it reaches a Transformer\u0027s loss with less compute; with epochs fixed, it reaches that loss with less unique data. Furthermore, both savings grow with unique data per parameter and with repetition, and downstream tasks agree. To go beyond our grid, we fit one scaling law to both models, in which latent feedback enters as a Transformer with more parameters; it predicts that both savings keep growing with unique data and repetition. Fitted on models from 60M to 271M parameters, the law predicts the losses at a held-out 778M size to within 0.3% and the gap between the two models to within 0.05%. At most, latent feedback saves 48% of the compute and 47% of the unique data. When data, not compute, is the limit, latent feedback is the better use of a FLOP for a model of a given size.", "arxiv_id": "2611.20404", "arxiv_url": "https://arxiv.org/abs/2611.20404", "authors": ["Benhao Huang", "Chaitanya Dwivedi", "Xuezhe Ma", "Alexander Moreno", "Hector Liu"], "brief": "\u7814\u7a76\u5c06\u6bcf\u4e2a\u8bcd\u5143\u7684\u9876\u5c42\u72b6\u6001\u53cd\u9988\u5230\u4e0b\u4e00\u8bcd\u5143\u8f93\u5165\uff0c\u5e76\u4e0e\u628a\u540c\u7b49\u7b97\u529b\u7528\u4e8e\u66f4\u591a\u8f6e\u8bad\u7ec3\u7684\u6807\u51c6Transformer\u6bd4\u8f83\uff0c\u8de8\u6a21\u578b\u89c4\u6a21\u3001\u72ec\u7acb\u6570\u636e\u91cf\u548c\u8bad\u7ec3\u8f6e\u6570\u68c0\u9a8c\u6536\u76ca\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/ifm-ai/LoRM", "github_stars": 22, "hf_url": "https://huggingface.co/papers/2611.20404", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6f5c\u5728\u53cd\u9988\u6700\u591a\u8282\u770148%\u7b97\u529b\u300147%\u72ec\u7acb\u6570\u636e", "\u7edf\u4e00\u7f29\u653e\u5f8b\u5c06\u6f5c\u5728\u53cd\u9988\u7b49\u6548\u4e3a\u66f4\u591a\u53c2\u6570\u7684Transformer", "60M\u81f3271M\u62df\u5408\uff0c778M\u635f\u5931\u9884\u6d4b\u8bef\u5dee\u4e0d\u8d850.3%"], "keywords": ["\u6f5c\u5728\u53cd\u9988", "\u8bad\u7ec3\u6548\u7387", "\u7f29\u653e\u5b9a\u5f8b", "\u6570\u636e\u6548\u7387"], "num_comments": 2, "on_hf": true, "organization": "Institute of Foundation Models", "pdf_url": "https://arxiv.org/pdf/2611.20404v1", "published_at": "2026-11-16", "score": 0.285, "selected_reasons": ["HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20404.png", "title": "Latent Feedback Is a Compute and Data Amplifier", "tldr": "\u6f5c\u5728\u53cd\u9988\u5728\u7b49\u7b97\u529b\u6bd4\u8f83\u4e2d\u63d0\u5347\u8bad\u7ec3\u6548\u7387\uff0c\u6700\u591a\u8282\u7701\u8fd1\u534a\u7b97\u529b\u4e0e\u72ec\u7acb\u6570\u636e\u3002", "upvotes": 6, "what_it_is": "\u7814\u7a76\u5c06\u6bcf\u4e2a\u8bcd\u5143\u7684\u9876\u5c42\u72b6\u6001\u53cd\u9988\u5230\u4e0b\u4e00\u8bcd\u5143\u8f93\u5165\uff0c\u5e76\u4e0e\u628a\u540c\u7b49\u7b97\u529b\u7528\u4e8e\u66f4\u591a\u8f6e\u8bad\u7ec3\u7684\u6807\u51c6Transformer\u6bd4\u8f83\uff0c\u8de8\u6a21\u578b\u89c4\u6a21\u3001\u72ec\u7acb\u6570\u636e\u91cf\u548c\u8bad\u7ec3\u8f6e\u6570\u68c0\u9a8c\u6536\u76ca\u3002", "why_notable": "\u5b83\u4e3a\u6570\u636e\u53d7\u9650\u65f6\u5982\u4f55\u5206\u914d\u8bad\u7ec3\u7b97\u529b\u63d0\u4f9b\u4e86\u76f4\u63a5\u8bc1\u636e\uff1a\u53cd\u9988\u6bd4\u5355\u7eaf\u91cd\u590d\u8bad\u7ec3\u66f4\u6709\u6548\uff0c\u4e14\u6536\u76ca\u968f\u6bcf\u53c2\u6570\u72ec\u7acb\u6570\u636e\u91cf\u548c\u91cd\u590d\u6b21\u6570\u589e\u52a0\u3002"}, {"abstract": "Embodied foundation models hinge on diverse robot interaction data, which are costly to collect. Egocentric human videos offer a complementary source of experience, and latent action models (LAMs) provide a popular means of leveraging these videos for policy supervision. Compared with world-action models (WAMs), LAMs can offer greater training efficiency and potentially lower inference costs by avoiding explicit pixel prediction during policy learning and execution. However, most existing LAMs learn latent actions solely through video reconstruction, which can cause their representations to cluster by visual appearance rather than by the underlying actions. As a result, they struggle to align human actions with their robot counterparts. To bridge the gap, we introduce SALA, which emphasizes establishing the semantic correspondence for latent actions. Without requiring paired data, we use the language descriptions of unpaired human and robot clips to estimate semantic similarities and supervise cross-embodiment correspondence. Specifically, we translate these similarities into soft neighborhood structures that guide human latent actions toward semantically related robot latents, while robot action reconstruction grounds the latent space in control. The resulting shared latent action space provides a unified supervision signal for training an embodied foundation model on both human and robot videos. Notably, latent action supervision enables scaling along two axes: (1) pre-training on increasing amounts of general human video consistently reduces robot action prediction error on downstream tasks, and (2) post-training on increasing amounts of task-specific human video substantially improves real-world robot task success rates.", "arxiv_id": "2611.17110", "arxiv_url": "https://arxiv.org/abs/2611.17110", "authors": ["Jiachun Jin", "Zetong Zhou", "Haonan Wang", "Zhijie Deng"], "brief": "SALA\u5229\u7528\u672a\u914d\u5bf9\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u89c6\u9891\u7684\u8bed\u8a00\u63cf\u8ff0\u6784\u5efa\u8bed\u4e49\u8f6f\u90bb\u57df\uff0c\u5bf9\u9f50\u6f5c\u5728\u52a8\u4f5c\uff0c\u5e76\u4ee5\u673a\u5668\u4eba\u52a8\u4f5c\u91cd\u5efa\u7ea6\u675f\u63a7\u5236\u8bed\u4e49\uff0c\u5f62\u6210\u7edf\u4e00\u7684\u7b56\u7565\u76d1\u7763\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17110", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u8bed\u8a00\u76f8\u4f3c\u5ea6\u6784\u5efa\u8f6f\u90bb\u57df\uff0c\u65e0\u9700\u4eba\u673a\u914d\u5bf9\u6570\u636e", "\u673a\u5668\u4eba\u52a8\u4f5c\u91cd\u5efa\u5c06\u5171\u4eab\u6f5c\u5728\u7a7a\u95f4\u951a\u5b9a\u5230\u63a7\u5236", "\u4eba\u7c7b\u89c6\u9891\u6269\u91cf\u6539\u5584\u9884\u8bad\u7ec3\u8bef\u5dee\u4e0e\u540e\u8bad\u7ec3\u6210\u529f\u7387"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u6f5c\u5728\u52a8\u4f5c", "\u8de8\u5177\u8eab\u5bf9\u9f50", "\u673a\u5668\u4eba\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17110v2", "published_at": "2026-11-12", "score": 0.276, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.17110.png", "title": "SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models", "tldr": "\u901a\u8fc7\u8bed\u4e49\u5bf9\u9f50\u4eba\u673a\u6f5c\u5728\u52a8\u4f5c\uff0c\u8ba9\u4eba\u7c7b\u89c6\u9891\u540c\u65f6\u52a9\u529b\u673a\u5668\u4eba\u9884\u8bad\u7ec3\u4e0e\u540e\u8bad\u7ec3\u3002", "upvotes": 13, "what_it_is": "SALA\u5229\u7528\u672a\u914d\u5bf9\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u89c6\u9891\u7684\u8bed\u8a00\u63cf\u8ff0\u6784\u5efa\u8bed\u4e49\u8f6f\u90bb\u57df\uff0c\u5bf9\u9f50\u6f5c\u5728\u52a8\u4f5c\uff0c\u5e76\u4ee5\u673a\u5668\u4eba\u52a8\u4f5c\u91cd\u5efa\u7ea6\u675f\u63a7\u5236\u8bed\u4e49\uff0c\u5f62\u6210\u7edf\u4e00\u7684\u7b56\u7565\u76d1\u7763\u3002", "why_notable": "\u5c06\u4eba\u7c7b\u89c6\u9891\u4ece\u89c6\u89c9\u91cd\u5efa\u7d20\u6750\u8f6c\u4e3a\u53ef\u8fc1\u79fb\u7684\u52a8\u4f5c\u76d1\u7763\uff0c\u4e3a\u51cf\u5c11\u6602\u8d35\u673a\u5668\u4eba\u6570\u636e\u4f9d\u8d56\u63d0\u4f9b\u8def\u5f84\uff0c\u5e76\u5c55\u793a\u9884\u8bad\u7ec3\u4e0e\u540e\u8bad\u7ec3\u4e24\u8f74\u6269\u5c55\u6536\u76ca\u3002"}, {"abstract": "Biomolecular foundation models predict the structures of proteins and their complexes accurately, and large language models (LLMs) reason in natural language, but the two remain separate: the abilities of the former are not part of a general-purpose LLM, and the reasoning of the latter does not enter a structure prediction. Calpha aims at one general model that folds proteins and complexes, understands protein sequence and structure, and lets its language reasoning influence the structures it predicts. This report covers the first step, in which an LLM outputs single-chain protein structures. Qwen3.5-9B reads a sequence enriched with ESM2 residue features. It can respond in text or emit a token that invokes a pretrained SimpleFold structure head, which receives information about the protein only through Qwen\u0027s residue states. Under a fixed folding request, the head achieves mean TM-scores of 0.808 on the FoldBench-334 development set, 0.635 on CASP16 domains and 0.900 on a CAMEO-style PDB set. We compare these predictions with a baseline in which ESM2-3B encodes the sequence and a fine-tuned SimpleFold-3B head predicts the coordinates. The two systems also differ in trainable weights, training duration and crop length. For chains of 100--299 residues, all three paired confidence intervals include zero. At 300--600 residues, the mean differences are -0.044, -0.160 and -0.025, respectively. In a separate test, four English request types triggered folding on every evaluated example. Protein training reduced accuracy on a 350-item MMLU-Pro subset from 77.4% to 70.3%. An LLM can therefore output single-chain structures from its own states, with lower long-chain scores in the current comparisons and reduced accuracy on the evaluated MMLU-Pro subset. Complex prediction, structure understanding and the effect of language reasoning on the predicted coordinates remain future work.", "arxiv_id": "2611.20986", "arxiv_url": "https://arxiv.org/abs/2611.20986", "authors": ["Yong Liu", "Zhanpeng Shi", "Peicong Lin", "Zhenyi Zhong", "Yizhou Dang", "Wendi Wu", "Haoling Li", "Shuangjia Zheng"], "brief": "Calpha\u5c06ESM2\u6b8b\u57fa\u7279\u5f81\u8f93\u5165Qwen3.5-9B\uff0c\u7531\u6a21\u578b\u8f93\u51fa\u7279\u6b8a\u4ee4\u724c\u8c03\u7528\u9884\u8bad\u7ec3SimpleFold\u7ed3\u6784\u5934\uff0c\u4ec5\u901a\u8fc7\u8bed\u8a00\u6a21\u578b\u7684\u6b8b\u57fa\u72b6\u6001\u9884\u6d4b\u5355\u94fe\u86cb\u767d\u7ed3\u6784\u3002", "categories": ["q-bio.QM", "cs.AI"], "github_repo": "https://github.com/yliust/Calpha", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2611.20986", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e09\u4e2a\u8bc4\u6d4b\u96c6\u5e73\u5747TM-score\u4e3a0.808\u30010.635\u30010.900", "300\u2014600\u6b8b\u57fa\u94fe\u8f83\u57fa\u7ebf\u4f4e0.025\u81f30.160", "350\u9898MMLU-Pro\u51c6\u786e\u7387\u4ece77.4%\u964d\u81f370.3%"], "keywords": ["\u86cb\u767d\u8d28\u7ed3\u6784\u9884\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u751f\u7269\u5206\u5b50\u57fa\u7840\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.20986v1", "published_at": "2026-11-16", "score": 0.274, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.20986.png", "title": "Calpha: Toward Native Biomolecular Intelligence in a General-Purpose Language Model", "tldr": "\u8ba9\u901a\u7528\u8bed\u8a00\u6a21\u578b\u901a\u8fc7\u81ea\u8eab\u6b8b\u57fa\u72b6\u6001\u9884\u6d4b\u86cb\u767d\u7ed3\u6784\uff0c\u4f46\u957f\u94fe\u8868\u73b0\u4e0e\u901a\u7528\u80fd\u529b\u4ecd\u6709\u635f\u5931\u3002", "upvotes": 11, "what_it_is": "Calpha\u5c06ESM2\u6b8b\u57fa\u7279\u5f81\u8f93\u5165Qwen3.5-9B\uff0c\u7531\u6a21\u578b\u8f93\u51fa\u7279\u6b8a\u4ee4\u724c\u8c03\u7528\u9884\u8bad\u7ec3SimpleFold\u7ed3\u6784\u5934\uff0c\u4ec5\u901a\u8fc7\u8bed\u8a00\u6a21\u578b\u7684\u6b8b\u57fa\u72b6\u6001\u9884\u6d4b\u5355\u94fe\u86cb\u767d\u7ed3\u6784\u3002", "why_notable": "\u9a8c\u8bc1\u4e86\u901a\u7528\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u72b6\u6001\u53ef\u652f\u6491\u86cb\u767d\u6298\u53e0\uff0c\u4e3a\u8bed\u8a00\u4e0e\u7ed3\u6784\u80fd\u529b\u878d\u5408\u63d0\u4f9b\u8def\u5f84\uff1b\u4f46\u5c1a\u672a\u9a8c\u8bc1\u8bed\u8a00\u63a8\u7406\u80fd\u6539\u53d8\u9884\u6d4b\u7ed3\u6784\u3002"}, {"abstract": "Interactive video world models enable exploration through text and camera controls, yet direct object interaction requires finer control. Hands provide a natural interface, but translating continuous hand movements into coherent visual responses remains challenging because of complex hand-object dynamics and demanding real-time computation. To address these challenges, we introduce LynnReal-Hand
