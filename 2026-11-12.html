n, actuation, reachability, target quality, and selective deployment as distinct control problems.", "arxiv_id": "2611.15041", "arxiv_url": "https://arxiv.org/abs/2611.15041", "authors": ["Zhaoning Zhang"], "brief": "AROMA\u9762\u5411\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u5e72\u9884\u4f4d\u7f6e\u3001\u51e0\u4f55\u4e0e\u589e\u76ca\u3001\u76ee\u6807\u9009\u62e9\u548c\u89e6\u53d1\u65f6\u673a\u5206\u5f00\u8bbe\u8ba1\u3002\u901a\u8fc7\u5e45\u5ea6\u5f52\u4e00\u5316\u7684\u56e0\u679c\u5b50\u7a7a\u95f4\u5e72\u9884\u4e0e\u8fed\u4ee3\u6700\u5c0f\u4ee3\u4ef7\u63a7\u5236\uff0c\u5b9e\u73b0\u9009\u62e9\u6027\u8ba1\u6570\u4fee\u6b63\u3002", "categories": ["cs.LG", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.15041", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4ea4\u53c9\u6ce8\u610f\u529b\u59344\u4e2a\u7ef4\u5ea6\u89e3\u91ca89.82%\u7684\u8ba1\u6570\u654f\u611f\u6027", "\u8fed\u4ee3MEA\u8fbe\u523081.25%\u7684\u9884\u8bbe\u7406\u60f3\u76ee\u6807\uff0c\u56fa\u5b9a\u65b9\u5411\u4ec515.18%", "\u81ea\u7136\u6570\u636e630\u4f8b\u4e2d\uff0c\u51c6\u786e\u7387\u753134.444%\u5347\u81f338.730%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u56e0\u679c\u5e72\u9884", "\u8868\u5f81\u63a7\u5236", "\u89c6\u89c9\u8ba1\u6570"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.15041v1", "published_at": "2026-11-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AROMA: Adaptive Representation-Oriented Multimodal Actuation for Vision-Language Model Control", "tldr": "\u901a\u8fc7\u56e0\u679c\u5b50\u7a7a\u95f4\u5e72\u9884\u4e0e\u8fed\u4ee3\u63a7\u5236\uff0c\u65e0\u9700\u66f4\u65b0\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5373\u53ef\u6539\u5584\u8ba1\u6570\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": "AROMA\u9762\u5411\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u5e72\u9884\u4f4d\u7f6e\u3001\u51e0\u4f55\u4e0e\u589e\u76ca\u3001\u76ee\u6807\u9009\u62e9\u548c\u89e6\u53d1\u65f6\u673a\u5206\u5f00\u8bbe\u8ba1\u3002\u901a\u8fc7\u5e45\u5ea6\u5f52\u4e00\u5316\u7684\u56e0\u679c\u5b50\u7a7a\u95f4\u5e72\u9884\u4e0e\u8fed\u4ee3\u6700\u5c0f\u4ee3\u4ef7\u63a7\u5236\uff0c\u5b9e\u73b0\u9009\u62e9\u6027\u8ba1\u6570\u4fee\u6b63\u3002", "why_notable": "\u5c06\u5b9a\u4f4d\u654f\u611f\u8868\u5f81\u4e0e\u771f\u6b63\u5b9e\u73b0\u6709\u9650\u5e45\u5ea6\u63a7\u5236\u533a\u5206\u5f00\u6765\uff0c\u5e76\u9a8c\u8bc1\u9009\u62e9\u6027\u5e72\u9884\u7684\u6536\u76ca\uff0c\u4e3a\u65e0\u9700\u91cd\u8bad\u7684\u591a\u6a21\u6001\u6a21\u578b\u7ea0\u9519\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u7684\u8def\u5f84\u3002"}, {"abstract": "Machine learning models are often trained on labeled data produced by multiple human annotators. When those annotators disagree, their labels are commonly collapsed into a single majority vote, which discards information about the underlying disagreement. We examine the cost of this practice for cyberbullying severity, a subjective judgment on which annotators disagree heavily. In the corpus we study, all 5 annotators assigned the same severity label to only 4.1% of comments. Turning 5 judgments into one label hides this disagreement and obscures how much the annotators differed in their assessments. In this paper, we ask whether a model can preserve this information by predicting the distribution of annotator judgments instead of a single majority label. We find 3 main results. First, accuracy against the majority label cannot tell competent models apart: 2 models with similar accuracy can differ greatly in how well they match the distribution of annotator judgments. Second, predicting the full distribution requires little extra effort. Calibrating an existing model, which adjusts its output probabilities after training, captures most of the improvement without retraining, across 3 datasets covering severity, abuse, and irony, while training on label distributions adds a small further gain. Third, we examine a dataset that includes annotator demographics, where a single shared model has one advantage and one limit. The advantage is that a model predicting the distribution of judgments matches each demographic group\u0027s judgments significantly better than a model trained on majority labels, so both groups gain. The limit is that it does not narrow the gap in performance between the groups, because one shared model cannot encode which group is right on a given comment. Preserving annotator disagreement is therefore a low-cost step toward fairer moderation, though not a complete one.", "arxiv_id": "2611.15010", "arxiv_url": "https://arxiv.org/abs/2611.15010", "authors": ["Arslan Bisharat", "Katelyn Skees", "Manuel Sandoval Madrigal", "Mujtaba Nazari", "Ayaan Khan", "Deborah L. Hall", "Mohammed Abuhamad", "Yasin N. Silva"], "brief": "\u7814\u7a76\u7528\u6807\u6ce8\u8005\u5224\u65ad\u5206\u5e03\u66ff\u4ee3\u591a\u6570\u7968\u6807\u7b7e\uff0c\u8bc4\u4f30\u7f51\u7edc\u6b3a\u51cc\u4e25\u91cd\u5ea6\u7b49\u4e3b\u89c2\u4efb\u52a1\u3002\u901a\u8fc7\u8bad\u7ec3\u540e\u6982\u7387\u6821\u51c6\u4e0e\u5206\u5e03\u6807\u7b7e\u8bad\u7ec3\uff0c\u62c6\u89e3\u4fdd\u7559\u5206\u6b67\u7684\u6536\u76ca\u53ca\u7fa4\u4f53\u516c\u5e73\u6027\u8fb9\u754c\u3002", "categories": ["cs.SI", "cs.CL", "cs.CY", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.15010", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["5\u540d\u6807\u6ce8\u8005\u5b8c\u5168\u4e00\u81f4\u7684\u8bc4\u8bba\u4ec5\u53604.1%", "3\u4e2a\u6570\u636e\u96c6\u4e0a\uff0c\u8bad\u7ec3\u540e\u6821\u51c6\u83b7\u5f97\u5927\u90e8\u5206\u5206\u5e03\u9884\u6d4b\u6536\u76ca", "\u5171\u4eab\u5206\u5e03\u6a21\u578b\u6539\u5584\u5404\u7fa4\u4f53\u62df\u5408\uff0c\u4f46\u672a\u7f29\u5c0f\u6027\u80fd\u5dee\u8ddd"], "keywords": ["\u6982\u7387\u6821\u51c6", "\u6807\u6ce8\u5206\u6b67", "\u5185\u5bb9\u5ba1\u6838", "\u7b97\u6cd5\u516c\u5e73\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.15010v1", "published_at": "2026-11-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Calibrate, Don\u0027t Retrain: Decomposing the Value of Annotator Disagreement in Cyberbullying Severity", "tldr": "\u4ec5\u6821\u51c6\u6a21\u578b\u6982\u7387\u5373\u53ef\u4f4e\u6210\u672c\u4fdd\u7559\u6807\u6ce8\u5206\u6b67\uff0c\u4f46\u65e0\u6cd5\u6d88\u9664\u7fa4\u4f53\u95f4\u6027\u80fd\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528\u6807\u6ce8\u8005\u5224\u65ad\u5206\u5e03\u66ff\u4ee3\u591a\u6570\u7968\u6807\u7b7e\uff0c\u8bc4\u4f30\u7f51\u7edc\u6b3a\u51cc\u4e25\u91cd\u5ea6\u7b49\u4e3b\u89c2\u4efb\u52a1\u3002\u901a\u8fc7\u8bad\u7ec3\u540e\u6982\u7387\u6821\u51c6\u4e0e\u5206\u5e03\u6807\u7b7e\u8bad\u7ec3\uff0c\u62c6\u89e3\u4fdd\u7559\u5206\u6b67\u7684\u6536\u76ca\u53ca\u7fa4\u4f53\u516c\u5e73\u6027\u8fb9\u754c\u3002", "why_notable": "\u8bf4\u660e\u591a\u6570\u7968\u51c6\u786e\u7387\u4f1a\u63a9\u76d6\u6a21\u578b\u5bf9\u4e3b\u89c2\u5206\u6b67\u7684\u523b\u753b\u5dee\u5f02\uff0c\u5e76\u63d0\u4f9b\u65e0\u9700\u91cd\u8bad\u7684\u6539\u8fdb\u8def\u5f84\uff1b\u540c\u65f6\u533a\u5206\u4fdd\u7559\u5206\u6b67\u4e0e\u6d88\u9664\u7fa4\u4f53\u5dee\u8ddd\u3002"}, {"abstract": "Failure attribution in multi-agent systems requires tracing error formation to identify the decisive error step and the responsible agent. However, agents\u0027 division of work and information exchange lead to Interleaved Steps and Cluttered Content, requiring models to link executions and check details in lengthy records. This makes it difficult to balance localization accuracy and token cost. We find that multi-agent collaboration also leaves records of how executions connect and content passes between them as results are formed, providing evidence for tracing error formation. Based on this observation, we propose CoLFA (Collaboration-Guided Lightweight Failure Attribution), which uses collaboration cues to organize the attribution input according to how results are formed, determining which steps are examined and how their content is presented. Through Handoff-Guided Step Expansion and Cross-Referenced Content Organization, CoLFA helps the model focus on examining error formation and the role of each decision while reducing the processing of irrelevant and repeated records. Across five settings spanning Who\u0026When and LongRCA and three backbone models, CoLFA achieves the highest exact step-localization accuracy with the lowest token consumption. Compared with individual baselines in each setting, CoLFA improves accuracy by up to 37.50% and reduces token consumption by up to 97.6%.", "arxiv_id": "2611.14980", "arxiv_url": "https://arxiv.org/abs/2611.14980", "authors": ["Yufei Luo", "Yuchen Ling", "Chunrong Fang"], "brief": "CoLFA\u5229\u7528\u667a\u80fd\u4f53\u4ea4\u63a5\u4e0e\u4fe1\u606f\u4f20\u9012\u7ebf\u7d22\u7ec4\u7ec7\u5f52\u56e0\u8f93\u5165\uff0c\u901a\u8fc7\u4ea4\u63a5\u5f15\u5bfc\u7684\u6b65\u9aa4\u6269\u5c55\u548c\u4ea4\u53c9\u5f15\u7528\u5185\u5bb9\u7ec4\u7ec7\uff0c\u7b5b\u9009\u5f85\u67e5\u6b65\u9aa4\u3001\u538b\u7f29\u91cd\u590d\u8bb0\u5f55\uff0c\u8ffd\u6eaf\u5173\u952e\u9519\u8bef\u4e0e\u8d23\u4efb\u667a\u80fd\u4f53\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14980", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u4ea4\u63a5\u5f15\u5bfc\u6b65\u9aa4\u6269\u5c55\uff0c\u786e\u5b9a\u9700\u68c0\u67e5\u7684\u6267\u884c\u6b65\u9aa4", "\u4ea4\u53c9\u5f15\u7528\u5185\u5bb9\u7ec4\u7ec7\uff0c\u51cf\u5c11\u65e0\u5173\u4e0e\u91cd\u590d\u8bb0\u5f55", "5\u79cd\u8bbe\u7f6e\u30013\u4e2a\u9aa8\u5e72\uff1a\u51c6\u786e\u7387\u6700\u591a\u589e37.50%\uff0c\u8bcd\u5143\u6700\u591a\u51cf97.6%"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u5931\u8d25\u5f52\u56e0", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14980v1", "published_at": "2026-11-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CoLFA: Collaboration-Guided Lightweight Failure Attribution for LLM-Based Multi-Agent Systems", "tldr": "\u5229\u7528\u534f\u4f5c\u7ebf\u7d22\u7cbe\u7b80\u591a\u667a\u80fd\u4f53\u6267\u884c\u8bb0\u5f55\uff0c\u66f4\u51c6\u786e\u4e14\u4f4e\u6210\u672c\u5730\u5b9a\u4f4d\u5931\u8d25\u8d23\u4efb\u3002", "upvotes": 0, "what_it_is": "CoLFA\u5229\u7528\u667a\u80fd\u4f53\u4ea4\u63a5\u4e0e\u4fe1\u606f\u4f20\u9012\u7ebf\u7d22\u7ec4\u7ec7\u5f52\u56e0\u8f93\u5165\uff0c\u901a\u8fc7\u4ea4\u63a5\u5f15\u5bfc\u7684\u6b65\u9aa4\u6269\u5c55\u548c\u4ea4\u53c9\u5f15\u7528\u5185\u5bb9\u7ec4\u7ec7\uff0c\u7b5b\u9009\u5f85\u67e5\u6b65\u9aa4\u3001\u538b\u7f29\u91cd\u590d\u8bb0\u5f55\uff0c\u8ffd\u6eaf\u5173\u952e\u9519\u8bef\u4e0e\u8d23\u4efb\u667a\u80fd\u4f53\u3002", "why_notable": "\u5c06\u534f\u4f5c\u8fc7\u7a0b\u672c\u8eab\u8f6c\u5316\u4e3a\u5f52\u56e0\u8bc1\u636e\uff0c\u5728\u5168\u90e8\u6d4b\u8bd5\u8bbe\u7f6e\u4e2d\u517c\u5f97\u6700\u9ad8\u7cbe\u786e\u6b65\u9aa4\u5b9a\u4f4d\u51c6\u786e\u7387\u4e0e\u6700\u4f4e\u8bcd\u5143\u6d88\u8017\uff0c\u4e3a\u591a\u667a\u80fd\u4f53\u6392\u969c\u63d0\u4f9b\u9ad8\u6548\u8def\u5f84\u3002"}, {"abstract": "Racial and ethnic minority patients receive less pain treatment than non-Hispanic White patients, and large language models (LLMs) used as medical AI could reproduce that bias. Prior audits tested a few proprietary models, stated race explicitly and rarely measured the models\u0027 own response instability. In exploratory, non-preregistered analyses, Study 1 had four open-weight LLMs assess six acute-pain vignettes in every combination of four races and two sexes, with identity stated or cued only by a name (two names per group), comparing each identity with a White male reference on the same case and sampling seed. In Study 2, 24 configurations of 17 models, including OpenAI\u0027s GPT-4.1 mini and gpt-oss, Anthropic\u0027s Claude Haiku 4.5, Google\u0027s Gemini 2.5 Flash, Meta\u0027s Llama, DeepSeek and Qwen, with reasoning on and off and at two precisions, answered the same vignettes and the 50 clinician-written Q-Pain cases. In this single-prompt, JSON-constrained task, no difference survived correction in Study 1, none of 1,386 comparisons survived the false discovery rate in Study 2, and every pain-severity difference was equivalent to zero within one point on a 0-10 scale (within a quarter point for 237 of 238 Q-Pain comparisons). Opioid decisions were bounded less precisely (Study 1 could not exclude differences of about 20 percentage points), so they show no detected difference, not proof of none. The few differences surviving correction within a model favoured Black patients. Models differed far more from one another and across their own settings than between patients (the reference patient received the high opioid dose in 6% to 93% of responses), although serving software, provider and prompt format also differed. Fairness audits of clinical AI should use several names per group, pair comparisons on the seed, report the noise floor and test each deployed configuration.", "arxiv_id": "2611.14935", "arxiv_url": "https://arxiv.org/abs/2611.14935", "authors": ["Richard J. Young", "Alice M. Matthews"], "brief": "\u7814\u7a76\u901a\u8fc7\u53cd\u4e8b\u5b9e\u75c5\u4f8b\u6bd4\u8f83\uff0c\u5ba1\u8ba1\u591a\u5bb6\u5927\u6a21\u578b\u7684\u75bc\u75db\u8bc4\u5206\u4e0e\u963f\u7247\u7528\u836f\u5efa\u8bae\u3002\u4ec5\u6539\u53d8\u60a3\u8005\u79cd\u65cf\u3001\u6027\u522b\u6216\u59d3\u540d\uff0c\u5e76\u914d\u5bf9\u91c7\u6837\u79cd\u5b50\uff0c\u533a\u5206\u8eab\u4efd\u5dee\u5f02\u4e0e\u6a21\u578b\u54cd\u5e94\u6ce2\u52a8\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14935", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d617\u4e2a\u6a21\u578b\u300124\u79cd\u914d\u7f6e\u53ca50\u4f8bQ-Pain\u75c5\u4f8b", "1386\u9879\u6bd4\u8f83\u5747\u672a\u901a\u8fc7\u5047\u53d1\u73b0\u7387\u6821\u6b63", "\u53c2\u8003\u60a3\u8005\u83b7\u9ad8\u5242\u91cf\u963f\u7247\u7684\u6bd4\u4f8b\u8de8\u6a21\u578b\u4e3a6%\u201493%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7b97\u6cd5\u516c\u5e73\u6027", "\u533b\u7597\u4eba\u5de5\u667a\u80fd", "\u75bc\u75db\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14935v1", "published_at": "2026-11-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Do Large Language Models Show Racial and Sex Bias in Pain Management? A Counterfactual Audit of GPT, Claude, Gemini, Llama, DeepSeek and Qwen", "tldr": "\u53cd\u4e8b\u5b9e\u5ba1\u8ba1\u672a\u68c0\u51fa\u7a33\u5065\u7684\u79cd\u65cf\u6027\u522b\u5dee\u5f02\uff0c\u6a21\u578b\u4e0e\u914d\u7f6e\u95f4\u7684\u75bc\u75db\u51b3\u7b56\u5dee\u5f02\u66f4\u5927", "upvotes": 0, "what_it_is": "\u7814\u7a76\u901a\u8fc7\u53cd\u4e8b\u5b9e\u75c5\u4f8b\u6bd4\u8f83\uff0c\u5ba1\u8ba1\u591a\u5bb6\u5927\u6a21\u578b\u7684\u75bc\u75db\u8bc4\u5206\u4e0e\u963f\u7247\u7528\u836f\u5efa\u8bae\u3002\u4ec5\u6539\u53d8\u60a3\u8005\u79cd\u65cf\u3001\u6027\u522b\u6216\u59d3\u540d\uff0c\u5e76\u914d\u5bf9\u91c7\u6837\u79cd\u5b50\uff0c\u533a\u5206\u8eab\u4efd\u5dee\u5f02\u4e0e\u6a21\u578b\u54cd\u5e94\u6ce2\u52a8\u3002", "why_notable": "\u7ed3\u679c\u5c06\u516c\u5e73\u6027\u5ba1\u8ba1\u91cd\u70b9\u5f15\u5411\u6a21\u578b\u914d\u7f6e\u4e0e\u54cd\u5e94\u566a\u58f0\uff0c\u800c\u975e\u4ec5\u6bd4\u8f83\u60a3\u8005\u8eab\u4efd\uff1b\u963f\u7247\u51b3\u7b56\u7684\u8bef\u5dee\u754c\u4ecd\u8f83\u5bbd\uff0c\u672a\u68c0\u51fa\u5dee\u5f02\u4e0d\u80fd\u7b49\u540c\u4e8e\u65e0\u504f\u3002"}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
