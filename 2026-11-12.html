  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

<script>
const PAPERS = [{"abstract": "Agentic workloads are a major source of LLM inference demand. Existing prefill--decode (PD) disaggregated serving systems offer limited flexibility for runtime adaptation of compute allocation and KV cache management, and rely on coarse signals that only partly capture the diverse and dynamic agent workload. These limitations lead to load imbalance between prefill and decode nodes and eviction of KV caches that agents will reuse. We present Evolving Infra, an agent-adaptive serving framework that adapts compute allocation to agent workloads and KV cache management to agent context management at runtime. We decouple compute allocation from key--value (KV) cache management, allowing nodes to switch efficiently between prefill and decode. Building on this design, an online planner matches the PD split to workload composition, while an agent-aware distributed KV manager guides cache eviction and transfer with signals from agent context management. Across coding, math, and computer-use tasks with GLM-5.2 and Kimi K2.6 on up to 256 GB300 GPUs, Evolving Infra reduces mean end-to-end request latency and P95 TTFT by up to 4.1x and 14x over Dynamo, NVIDIA\u0027s production framework.", "arxiv_id": "2611.12304", "arxiv_url": "https://arxiv.org/abs/2611.12304", "authors": ["Hao Kang", "Weili Xu", "Ziyang Li", "Zheng Du", "Hanchen Li", "Tian Xia", "Song Bian", "Tushar Krishna", "Huizi Mao", "Ion Stoica", "Song Han"], "brief": "\u63d0\u51fa\u9762\u5411\u667a\u80fd\u4f53\u8d1f\u8f7d\u7684\u63a8\u7406\u670d\u52a1\u6846\u67b6\uff0c\u5c06\u8ba1\u7b97\u5206\u914d\u4e0eKV\u7f13\u5b58\u7ba1\u7406\u89e3\u8026\u3002\u5728\u7ebf\u89c4\u5212\u5668\u52a8\u6001\u8c03\u6574\u9884\u586b\u5145\u4e0e\u89e3\u7801\u914d\u6bd4\uff0c\u5206\u5e03\u5f0f\u7f13\u5b58\u7ba1\u7406\u5668\u5229\u7528\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u4fe1\u53f7\u6307\u5bfc\u6dd8\u6c70\u4e0e\u8fc1\u79fb\u3002", "categories": ["cs.DC"], "github_repo": "https://github.com/mit-han-lab/EvolvingInfra", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2611.12304", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8ba1\u7b97\u4e0eKV\u7f13\u5b58\u89e3\u8026\uff0c\u8282\u70b9\u53ef\u9ad8\u6548\u5207\u6362\u9884\u586b\u5145\u4e0e\u89e3\u7801", "\u4f7f\u7528GLM-5.2\u3001Kimi K2.6\uff0c\u89c4\u6a21\u8fbe256\u5f20GB300", "\u8f83Dynamo\u5e73\u5747\u5ef6\u8fdf\u4e0eP95\u9996\u8bcd\u5ef6\u8fdf\u6700\u591a\u6539\u55844.1\u500d\u300114\u500d"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u7406\u670d\u52a1", "\u7f13\u5b58\u7ba1\u7406", "\u8d44\u6e90\u8c03\u5ea6"], "num_comments": 2, "on_hf": true, "organization": "MIT HAN Lab", "pdf_url": "https://arxiv.org/pdf/2611.12304v1", "published_at": "2026-11-09", "score": 0.667, "selected_reasons": ["\u77e5\u540d\u673a\u6784: MIT", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12304.png", "title": "Evolving Infra: Agent-Adaptive LLM Serving at Scale", "tldr": "\u901a\u8fc7\u52a8\u6001\u8c03\u6574\u9884\u586b\u5145\u4e0e\u89e3\u7801\u8d44\u6e90\u53ca\u7f13\u5b58\u7ba1\u7406\uff0c\u5927\u5e45\u964d\u4f4e\u667a\u80fd\u4f53\u63a8\u7406\u5ef6\u8fdf\u3002", "upvotes": 10, "what_it_is": "\u63d0\u51fa\u9762\u5411\u667a\u80fd\u4f53\u8d1f\u8f7d\u7684\u63a8\u7406\u670d\u52a1\u6846\u67b6\uff0c\u5c06\u8ba1\u7b97\u5206\u914d\u4e0eKV\u7f13\u5b58\u7ba1\u7406\u89e3\u8026\u3002\u5728\u7ebf\u89c4\u5212\u5668\u52a8\u6001\u8c03\u6574\u9884\u586b\u5145\u4e0e\u89e3\u7801\u914d\u6bd4\uff0c\u5206\u5e03\u5f0f\u7f13\u5b58\u7ba1\u7406\u5668\u5229\u7528\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u4fe1\u53f7\u6307\u5bfc\u6dd8\u6c70\u4e0e\u8fc1\u79fb\u3002", "why_notable": "\u5c06\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u7ba1\u7406\u4fe1\u53f7\u5f15\u5165\u63a8\u7406\u57fa\u7840\u8bbe\u65bd\uff0c\u540c\u65f6\u7f13\u89e3\u8d44\u6e90\u5931\u8861\u4e0e\u7f13\u5b58\u8bef\u6dd8\u6c70\uff0c\u5e76\u5728\u5927\u89c4\u6a21\u96c6\u7fa4\u4e0a\u5c55\u793a\u663e\u8457\u5ef6\u8fdf\u6536\u76ca\u3002"}, {"abstract": "Low-bit quantization reduces the inference cost of LLM agents but can compromise task success. Examining failed rollouts, we find that quantized agents overlook task requirements or environmental conditions, producing environment transitions that diverge from successful full-precision references. Correcting these behavioral divergences remains difficult: offline data may miss the student\u0027s failure contexts, while its own rollouts may provide few correct responses in those contexts. We introduce SteerDistill, a quantization-aware distillation method in which a full-precision teacher guides the student to revise failed responses and iteratively refines its guidance using feedback from student execution. This closed-loop teacher steering produces locally verified behavioral corrections. We internalize these corrections by training the student without guidance to match the steered student\u0027s predictions at corrected turns and the full-precision teacher\u0027s at other turns, enabling unassisted inference. Across five agentic benchmarks and three models, SteerDistill exceeds the strongest quantized baseline by 1.67--2.18 points in average score under W4A16 and stays within one point of BF16. On $\u03c4^2$-Bench, it outperforms QeRL by 1.84 percentage points in success rate using 67% fewer training GPU hours and produces shorter successful trajectories than the quantized baselines.", "arxiv_id": "2611.13410", "arxiv_url": "https://arxiv.org/abs/2611.13410", "authors": ["Genming Cui", "Xiangyu Li", "Zixu Hao", "Xin Ding", "Yunxin Liu", "Ting Cao"], "brief": "SteerDistill\u8ba9\u5168\u7cbe\u5ea6\u6559\u5e08\u4f9d\u636e\u5b66\u751f\u6267\u884c\u53cd\u9988\uff0c\u8fed\u4ee3\u6307\u5bfc\u5176\u4fee\u6b63\u5931\u8d25\u54cd\u5e94\u3002\u518d\u5c06\u7ecf\u5c40\u90e8\u9a8c\u8bc1\u7684\u7ea0\u6b63\u884c\u4e3a\u84b8\u998f\u5230\u91cf\u5316\u5b66\u751f\uff0c\u4f7f\u5176\u63a8\u7406\u65f6\u65e0\u9700\u6559\u5e08\u6307\u5bfc\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/air-embodied-brain/SteerDistill", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.13410", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7ea0\u6b63\u8f6e\u6b21\u62df\u5408\u53d7\u6307\u5bfc\u5b66\u751f\uff0c\u5176\u4f59\u8f6e\u6b21\u62df\u5408\u5168\u7cbe\u5ea6\u6559\u5e08", "\u4e94\u4e2a\u57fa\u51c6\u3001\u4e09\u4e2a\u6a21\u578b\uff1aW4A16\u8dddBF16\u4e0d\u8db31\u5206", "\u8f83QeRL\u6210\u529f\u7387\u9ad81.84\u4e2a\u767e\u5206\u70b9\uff0c\u8bad\u7ec3GPU\u65f6\u5c1167%"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u77e5\u8bc6\u84b8\u998f", "\u667a\u80fd\u4f53", "\u95ed\u73af\u53cd\u9988"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.13410v1", "published_at": "2026-11-10", "score": 0.542, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (31\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13410.png", "title": "SteerDistill: Quantizing LLM Agents via Closed-Loop Teacher Steering", "tldr": "\u901a\u8fc7\u6559\u5e08\u95ed\u73af\u7ea0\u6b63\u5931\u8d25\u884c\u4e3a\uff0c\u8ba9\u4f4e\u6bd4\u7279\u667a\u80fd\u4f53\u4ee5\u66f4\u4f4e\u8bad\u7ec3\u6210\u672c\u903c\u8fd1\u5168\u7cbe\u5ea6\u8868\u73b0\u3002", "upvotes": 31, "what_it_is": "SteerDistill\u8ba9\u5168\u7cbe\u5ea6\u6559\u5e08\u4f9d\u636e\u5b66\u751f\u6267\u884c\u53cd\u9988\uff0c\u8fed\u4ee3\u6307\u5bfc\u5176\u4fee\u6b63\u5931\u8d25\u54cd\u5e94\u3002\u518d\u5c06\u7ecf\u5c40\u90e8\u9a8c\u8bc1\u7684\u7ea0\u6b63\u884c\u4e3a\u84b8\u998f\u5230\u91cf\u5316\u5b66\u751f\uff0c\u4f7f\u5176\u63a8\u7406\u65f6\u65e0\u9700\u6559\u5e08\u6307\u5bfc\u3002", "why_notable": "\u5b83\u628a\u91cf\u5316\u8865\u507f\u4ece\u9759\u6001\u8f93\u51fa\u5bf9\u9f50\u63a8\u8fdb\u5230\u6267\u884c\u53cd\u9988\u9a71\u52a8\u7684\u884c\u4e3a\u7ea0\u9519\uff0c\u5728\u4fdd\u6301\u72ec\u7acb\u63a8\u7406\u7684\u540c\u65f6\uff0c\u517c\u987e\u4efb\u52a1\u6210\u529f\u7387\u4e0e\u8bad\u7ec3\u6548\u7387\u3002"}, {"abstract": "AI agents deployed on the open web are becoming more capable of performing actions that may breach contractual provisions and violate computer security laws. In this paper, we introduce ScrapeBench, the first agentic benchmark for empirically evaluating the legal compliance of AI agents with website scraping policies, namely terms of service (ToS) and $\\texttt{robots.txt}$ directives. Across widely used closed-weight and open-weight AI agents, we find that most agents exhibit low compliance rates (\u003c 5%) when instructed to scrape websites in our sample of 1,626 popular websites that explicitly prohibit scraping. In addition, we observe that even where AI agents actively check the applicable ToS and $\\texttt{robots.txt}$, they continue to exhibit low compliance rates. Conversely, in our sample of 269 websites that do not prohibit scraping, we observe that agents sometimes refuse to scrape despite it being lawful, such as Claude Opus 4.6 exhibiting an over-refusal rate of 98.5%. Our human baseline experiments (n = 180 participants) suggest that humans exhibit compliance rates comparable to AI agents but over-refuse at much higher rates.", "arxiv_id": "2611.11306", "arxiv_url": "https://arxiv.org/abs/2611.11306", "authors": ["Joseph Marvin Imperial", "Daniel Slate", "Noam Kolt"], "brief": "\u63d0\u51faScrapeBench\uff0c\u4f9d\u636e\u7f51\u7ad9\u670d\u52a1\u6761\u6b3e\u4e0erobots.txt\u8bc4\u4f30\u667a\u80fd\u4f53\u6293\u53d6\u5408\u89c4\u6027\uff0c\u8986\u76d6\u5f00\u6e90\u4e0e\u95ed\u6e90\u6a21\u578b\uff0c\u5e76\u4e0e\u4eba\u7c7b\u53c2\u4e0e\u8005\u5bf9\u7167\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/imperialite/scrapebench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.11306", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["1,626\u4e2a\u7981\u6b62\u6293\u53d6\u7684\u7f51\u7ad9\u4e0a\uff0c\u591a\u6570\u667a\u80fd\u4f53\u5408\u89c4\u7387\u4f4e\u4e8e5%", "269\u4e2a\u672a\u7981\u6b62\u6293\u53d6\u7684\u7f51\u7ad9\u4e0a\uff0cOpus 4.6\u8fc7\u5ea6\u62d2\u7edd\u738798.5%", "180\u4eba\u5bf9\u7167\u5b9e\u9a8c\uff1a\u5408\u89c4\u7387\u63a5\u8fd1\u667a\u80fd\u4f53\uff0c\u8fc7\u5ea6\u62d2\u7edd\u66f4\u9ad8"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u9875\u6293\u53d6", "\u6cd5\u5f8b\u5408\u89c4", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11306v2", "published_at": "2026-11-08", "score": 0.388, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11306.png", "title": "ScrapeBench: Evaluating Legal Compliance of AI Agents in Website Scraping", "tldr": "\u7f51\u7ad9\u6293\u53d6\u8bc4\u6d4b\u63ed\u793a\u667a\u80fd\u4f53\u666e\u904d\u65e0\u89c6\u7981\u4ee4\uff0c\u4e5f\u4f1a\u5bf9\u5141\u8bb8\u6293\u53d6\u7684\u7f51\u7ad9\u8fc7\u5ea6\u62d2\u7edd\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51faScrapeBench\uff0c\u4f9d\u636e\u7f51\u7ad9\u670d\u52a1\u6761\u6b3e\u4e0erobots.txt\u8bc4\u4f30\u667a\u80fd\u4f53\u6293\u53d6\u5408\u89c4\u6027\uff0c\u8986\u76d6\u5f00\u6e90\u4e0e\u95ed\u6e90\u6a21\u578b\uff0c\u5e76\u4e0e\u4eba\u7c7b\u53c2\u4e0e\u8005\u5bf9\u7167\u3002", "why_notable": "\u5c06\u7f51\u9875\u667a\u80fd\u4f53\u7684\u5408\u89c4\u95ee\u9898\u8f6c\u4e3a\u53ef\u6d4b\u91cf\u57fa\u51c6\uff0c\u63ed\u793a\u68c0\u67e5\u89c4\u5219\u5e76\u4e0d\u7b49\u4e8e\u9075\u5b88\u89c4\u5219\uff0c\u4e5f\u63d0\u793a\u8bc4\u4f30\u9700\u540c\u65f6\u8861\u91cf\u8fdd\u89c4\u6267\u884c\u4e0e\u8fc7\u5ea6\u62d2\u7edd\u3002"}, {"abstract": "Mathematical supervision for language models is typically flattened into isolated problem-solution pairs, discarding the curricular organization and evidential structure of the original sources. We introduce TOME-Math (Textbook-Oriented Mathematical Evidence), a large-scale corpus that converts 2,118 textbooks spanning the core areas of university-level mathematics subjects into approximately 380K structured proof-supervision records while preserving chapter order, proposition-proof links, dependency references, and source provenance. Leveraging these structural signals, we explore curriculum learning across multiple mathematical subjects and characterize scaling patterns with supervision volume and source breadth. At full scale, fine-tuning on TOME-Math raises the unweighted mean score across our held-out evaluations and established public benchmarks by 16.7 percentage points over the base model, while exceeding all three public instruction-data baselines evaluated in aggregate. Our findings highlight structured textbooks as both a scalable source of mathematical supervision and an empirical framework for studying the impact of data organization on mathematical reasoning. We will release the corpus to facilitate further research on structured mathematical supervision.", "arxiv_id": "2610.40394", "arxiv_url": "https://arxiv.org/abs/2610.40394", "authors": ["Youqing Fang", "Zhouqi Hua", "Yinhao Tang", "Yuzhe Gu", "Lingkai Kong", "Bin Liu", "Weiming Zhang", "Kai Chen", "Yanan Sun", "Wenwei Zhang"], "brief": "\u6784\u5efaTOME-Math\uff0c\u5c06\u5927\u5b66\u6570\u5b66\u6559\u6750\u8f6c\u4e3a\u7ed3\u6784\u5316\u8bc1\u660e\u76d1\u7763\u8bb0\u5f55\uff0c\u4fdd\u7559\u7ae0\u8282\u987a\u5e8f\u3001\u547d\u9898\u4e0e\u8bc1\u660e\u94fe\u63a5\u53ca\u4f9d\u8d56\u5173\u7cfb\uff0c\u5e76\u7814\u7a76\u8bfe\u7a0b\u5b66\u4e60\u548c\u6570\u636e\u89c4\u6a21\u6548\u5e94\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.40394", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["TOME-Math\u6db5\u76d62118\u672c\u6559\u6750\u3001\u7ea638\u4e07\u6761\u8bb0\u5f55", "\u4fdd\u7559\u7ae0\u8282\u987a\u5e8f\u3001\u547d\u9898\u2014\u8bc1\u660e\u94fe\u63a5\u3001\u4f9d\u8d56\u4e0e\u6765\u6e90", "\u5168\u91cf\u5fae\u8c03\u5e73\u5747\u63d0\u9ad816.7\u4e2a\u767e\u5206\u70b9\uff0c\u8d85\u8fc7\u4e09\u79cd\u516c\u5f00\u6570\u636e\u57fa\u7ebf"], "keywords": ["\u6570\u5b66\u63a8\u7406", "\u7ed3\u6784\u5316\u6570\u636e", "\u8bfe\u7a0b\u5b66\u4e60", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 3, "on_hf": true, "organization": "Intern Large Models", "pdf_url": "https://arxiv.org/pdf/2610.40394v1", "published_at": "2026-10-29", "score": 0.305, "selected_reasons": ["HF trending (39\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40394.png", "title": "Scaling Mathematical Proof Supervision from Structured Textbooks", "tldr": "\u5c06\u6570\u5b66\u6559\u6750\u8f6c\u4e3a\u4fdd\u7559\u8bc1\u660e\u7ed3\u6784\u7684\u8bad\u7ec3\u6570\u636e\uff0c\u663e\u8457\u63d0\u5347\u8bed\u8a00\u6a21\u578b\u6570\u5b66\u63a8\u7406\u8868\u73b0\u3002", "upvotes": 39, "what_it_is": "\u6784\u5efaTOME-Math\uff0c\u5c06\u5927\u5b66\u6570\u5b66\u6559\u6750\u8f6c\u4e3a\u7ed3\u6784\u5316\u8bc1\u660e\u76d1\u7763\u8bb0\u5f55\uff0c\u4fdd\u7559\u7ae0\u8282\u987a\u5e8f\u3001\u547d\u9898\u4e0e\u8bc1\u660e\u94fe\u63a5\u53ca\u4f9d\u8d56\u5173\u7cfb\uff0c\u5e76\u7814\u7a76\u8bfe\u7a0b\u5b66\u4e60\u548c\u6570\u636e\u89c4\u6a21\u6548\u5e94\u3002", "why_notable": "\u628a\u6559\u6750\u7ec4\u7ec7\u7ed3\u6784\u7eb3\u5165\u6570\u5b66\u76d1\u7763\uff0c\u4e3a\u7814\u7a76\u6570\u636e\u91cf\u3001\u6765\u6e90\u5e7f\u5ea6\u4e0e\u8bfe\u7a0b\u5b89\u6392\u7684\u5f71\u54cd\u63d0\u4f9b\u5b9e\u9a8c\u57fa\u7840\uff0c\u4e5f\u5c55\u793a\u4e86\u7ed3\u6784\u5316\u8bc1\u660e\u6570\u636e\u7684\u6269\u5c55\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) draw on parametric knowledge and retrieval-augmented generation (RAG) to solve knowledge-intensive tasks. Yet problem solving in unfamiliar domains calls for tightly coupled knowledge acquisition and reasoning, beyond factual retrieval and aggregation or learning solely from a preassembled context. We study self-learning -- autonomously retrieving, studying, and applying knowledge from long-form reference materials on the fly. To investigate this capability, we formulate a textbook-based mathematical problem-solving task. LLMs must navigate textbook exposition, learn and apply relevant principles, and construct proofs for exercises, with reference solutions withheld. We introduce a BookNavigator interface to support this human-inspired study process and incentivize self-learning through reinforcement learning (RL) with fine-grained rewards. Experiments show that our method improves performance across in-domain and out-of-domain textbooks and subjects, raising Intern-S2-Preview-35B\u0027s overall proof accuracy from 51.5% to 79.5% and outperforming RL-trained textbook-free and fixed-retrieval baselines. These gains extend to complex long-context benchmarks involving different task types, with improvements over the base model of 1.7 and 2.3 percentage points on BrowseComp-Plus and CL-bench, respectively. Together, these findings suggest that RL can foster a domain-agnostic self-learning strategy, highlighting the potential of self-learning from long-form corpora to strengthen broader problem-solving capabilities on complex, long-context tasks.", "arxiv_id": "2610.39671", "arxiv_url": "https://arxiv.org/abs/2610.39671", "authors": ["Lingkai Kong", "Yuzhe Gu", "Haiteng Zhao", "Zijian Wu", "Youqing Fang", "Zhouqi Hua", "Yanan Sun", "Kai Chen", "Wenwei Zhang"], "brief": "\u7814\u7a76\u5c06\u81ea\u5b66\u4e60\u8bbe\u4e3a\u6559\u6750\u9a71\u52a8\u7684\u6570\u5b66\u89e3\u9898\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u81ea\u4e3b\u68c0\u7d22\u3001\u7814\u8bfb\u5e76\u5e94\u7528\u77e5\u8bc6\u5b8c\u6210\u8bc1\u660e\u3002\u901a\u8fc7BookNavigator\u63a5\u53e3\u4e0e\u7ec6\u7c92\u5ea6\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u8bad\u7ec3\u8fd9\u4e00\u8fc7\u7a0b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39671", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["BookNavigator\u652f\u6301\u6559\u6750\u5bfc\u822a\uff0c\u8bad\u7ec3\u4e2d\u4e0d\u63d0\u4f9b\u53c2\u8003\u89e3\u7b54", "Intern-S2-Preview-35B\u8bc1\u660e\u51c6\u786e\u7387\u4ece51.5%\u5347\u81f379.5%", "BrowseComp-Plus\u4e0eCL-bench\u5206\u522b\u63d0\u53471.7\u30012.3\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u81ea\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u6570\u5b66\u63a8\u7406", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 8, "on_hf": true, "organization": "Intern Large Models", "pdf_url": "https://arxiv.org/pdf/2610.39671v1", "published_at": "2026-10-29", "score": 0.302, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39671.png", "title": "Incentivizing Self-Learning in Large Language Models via Reinforcement Learning", "tldr": "\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u8ba9\u5927\u6a21\u578b\u81ea\u4e3b\u7814\u8bfb\u6559\u6750\u5e76\u89e3\u9898\uff0c\u663e\u8457\u63d0\u5347\u6570\u5b66\u8bc1\u660e\u4e0e\u8de8\u57df\u8868\u73b0\u3002", "upvotes": 28, "what_it_is": "\u7814\u7a76\u5c06\u81ea\u5b66\u4e60\u8bbe\u4e3a\u6559\u6750\u9a71\u52a8\u7684\u6570\u5b66\u89e3\u9898\u4efb\u52a1\uff0c\u8981\u6c42\u6a21\u578b\u81ea\u4e3b\u68c0\u7d22\u3001\u7814\u8bfb\u5e76\u5e94\u7528\u77e5\u8bc6\u5b8c\u6210\u8bc1\u660e\u3002\u901a\u8fc7BookNavigator\u63a5\u53e3\u4e0e\u7ec6\u7c92\u5ea6\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u8bad\u7ec3\u8fd9\u4e00\u8fc7\u7a0b\u3002", "why_notable": "\u7ed3\u679c\u4f18\u4e8e\u65e0\u6559\u6750\u548c\u56fa\u5b9a\u68c0\u7d22\u7684\u5f3a\u5316\u5b66\u4e60\u57fa\u7ebf\uff0c\u4e14\u589e\u76ca\u8de8\u6559\u6750\u3001\u5b66\u79d1\u4e0e\u4efb\u52a1\u8fc1\u79fb\uff0c\u8868\u660e\u81ea\u4e3b\u7814\u8bfb\u7b56\u7565\u53ef\u80fd\u589e\u5f3a\u901a\u7528\u957f\u4e0a\u4e0b\u6587\u89e3\u9898\u80fd\u529b\u3002"}, {"abstract": "AAA games offer a rich testbed for evaluating agent perception, reasoning, and control. However, evaluating whether agents can complete tasks in AAA games is challenging and often human-annotated because task outcomes are often difficult to verify automatically, let alone applying it for Reinforcement Learning (RL). We introduce GTAGym, an environment and framework for evaluation and RL on GTA V tasks. Its evaluation benchmark, GTAVBench, derived from GTA V main-story missions, contains 103 online tasks reconstructed across nine task families, alongside 47 image-based shooting and sniping tasks using GTA V imagery. A web server provides access to the online environment and evaluation interface, supporting parallel testing through screenshots and keyboard-mouse actions with automatic engine-state outcome checks. We evaluate six frontier LLMs on GTAVBench with textual task instructions and on its GTAVBench-AGI branch, where instructions appear only in the first screenshot and a harness automatically compresses interaction history. The best configuration achieves 70.9% overall accuracy in GTAVBench-AGI, yet aerial navigation, evasion and interception remain difficult. GTAGym also provides a scalable generator that samples task parameters within user-specified ranges and option sets under fixed templates, creating batches of 3D and image-based shooting environments for RL with automatic reward and termination signals. LoRA RL of Qwen3.8-27B on generated on-foot navigation tasks improves the in-domain performance and transfers to out-of-domain task categories, and native GTA V tasks from 15% to 23%.", "arxiv_id": "2611.13028", "arxiv_url": "https://arxiv.org/abs/2611.13028", "authors": ["Jiajun Chen", "Shicheng Fang", "Jiahao Lu", "Yuxin Wang", "Xipeng Qiu"], "brief": "GTAGym\u5c06GTA V\u4efb\u52a1\u5c01\u88c5\u4e3a\u53ef\u5e76\u884c\u8bbf\u95ee\u7684\u8bc4\u6d4b\u4e0e\u5f3a\u5316\u5b66\u4e60\u73af\u5883\u3002\u667a\u80fd\u4f53\u901a\u8fc7\u622a\u56fe\u548c\u952e\u9f20\u64cd\u4f5c\u4ea4\u4e92\uff0c\u7cfb\u7edf\u4f9d\u636e\u5f15\u64ce\u72b6\u6001\u81ea\u52a8\u68c0\u67e5\u7ed3\u679c\uff0c\u5e76\u751f\u6210\u5e26\u5956\u52b1\u548c\u7ec8\u6b62\u4fe1\u53f7\u7684\u8bad\u7ec3\u4efb\u52a1\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": "https://github.com/ljbro/GTAGym", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.13028", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GTAVBench\u542b103\u9879\u5728\u7ebf\u4efb\u52a1\u53ca47\u9879\u56fe\u50cf\u5c04\u51fb\u4efb\u52a1", "\u8bc4\u6d4b6\u4e2a\u524d\u6cbf\u5927\u6a21\u578b\uff0cAGI\u5206\u652f\u6700\u4f73\u51c6\u786e\u738770.9%", "Qwen3.8-27B\u7ecfLoRA\u5f3a\u5316\u5b66\u4e60\uff0c\u539f\u751f\u4efb\u52a1\u8868\u73b015%\u219223%"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001\u4ea4\u4e92", "\u6e38\u620f\u73af\u5883"], "num_comments": 5, "on_hf": true, "organization": "OpenMOSS", "pdf_url": "https://arxiv.org/pdf/2611.13028v1", "published_at": "2026-11-09", "score": 0.299, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13028.png", "title": "GTAGym: Real AAA Game Tasks Environment for Evaluation and Reinforcement Learning", "tldr": "\u7528\u6e38\u620f\u5f15\u64ce\u81ea\u52a8\u5224\u5b9a\u4efb\u52a1\u7ed3\u679c\uff0c\u8ba9\u5927\u6a21\u578b\u5728\u771f\u5b9e\u5f00\u653e\u4e16\u754c\u4e2d\u63a5\u53d7\u8bc4\u6d4b\u4e0e\u5f3a\u5316\u5b66\u4e60\u3002", "upvotes": 12, "what_it_is": "GTAGym\u5c06GTA V\u4efb\u52a1\u5c01\u88c5\u4e3a\u53ef\u5e76\u884c\u8bbf\u95ee\u7684\u8bc4\u6d4b\u4e0e\u5f3a\u5316\u5b66\u4e60\u73af\u5883\u3002\u667a\u80fd\u4f53\u901a\u8fc7\u622a\u56fe\u548c\u952e\u9f20\u64cd\u4f5c\u4ea4\u4e92\uff0c\u7cfb\u7edf\u4f9d\u636e\u5f15\u64ce\u72b6\u6001\u81ea\u52a8\u68c0\u67e5\u7ed3\u679c\uff0c\u5e76\u751f\u6210\u5e26\u5956\u52b1\u548c\u7ec8\u6b62\u4fe1\u53f7\u7684\u8bad\u7ec3\u4efb\u52a1\u3002", "why_notable": "\u81ea\u52a8\u9a8c\u6536\u4e0e\u53c2\u6570\u5316\u4efb\u52a1\u751f\u6210\u6253\u901a\u4e86\u590d\u6742\u6e38\u620f\u4e2d\u7684\u8bc4\u6d4b\u548c\u8bad\u7ec3\u6d41\u7a0b\uff1b\u521d\u6b65\u8fc1\u79fb\u6536\u76ca\u8bf4\u660e\uff0c\u5408\u6210\u4efb\u52a1\u8bad\u7ec3\u53ef\u80fd\u6539\u5584\u771f\u5b9e\u6e38\u620f\u4efb\u52a1\u8868\u73b0\u3002"}, {"abstract": "Visual interaction models that support users during ongoing physical tasks require evaluation in closed loop, where assistant responses can change subsequent user behavior and task outcomes. Existing benchmarks largely rely on offline replay and therefore cannot capture these effects. We introduce Interactive Visual Gym, a framework for closed-loop evaluation and training of visual interaction models through joint simulation of executable task environments and human users. We contribute three simulators that recreate everyday tasks and human-aligned action spaces across cooking, household manipulation, and mobile-interface domains, together with a persona-conditioned user simulation harness that collaborates with the assistant while incorporating controlled execution errors and other out-of-plan behaviors. We instantiate the framework as IVG-Bench, a benchmark with 315 interaction scenarios. Evaluating state-of-the-art VLMs as visual interaction models reveals substantial limitations: the best-performing model, Gemini 4 Argon, completes only 53.4% of tasks within the time limit, exhibits significant weaknesses in factual grounding and actionable guidance, and is often too slow to prevent errors when response latency is considered. We verify our evaluation protocol with a human study which finds 78.5% agreement between our interaction-quality metric and participant preferences. We further show that the environments provide useful learning signals: in a proof-of-concept GRPO experiment, closed-loop training improves both task success and interaction quality for Qwen3.5-4B model in our cooking environment.", "arxiv_id": "2611.08286", "arxiv_url": "https://arxiv.org/abs/2611.08286", "authors": ["Chenhao Zheng", "Zixian Ma", "Kai Li", "Kanchana Ranasinghe", "Jieyu Zhang", "Artemis Panagopoulou", "Weikai Huang", "Jianxu Shangguan", "Yuanyuan Tan", "Silvio Savarese", "Juan Carlos Niebles", "Ranjay Krishna", "Ran Xu", "Honglu Zhou"], "brief": "\u63d0\u51fa\u89c6\u89c9\u4ea4\u4e92\u6a21\u578b\u7684\u95ed\u73af\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u6846\u67b6\uff0c\u8054\u5408\u6a21\u62df\u53ef\u6267\u884c\u4efb\u52a1\u73af\u5883\u548c\u7528\u6237\u3002\u7528\u6237\u6a21\u62df\u53d7\u4eba\u8bbe\u6761\u4ef6\u63a7\u5236\uff0c\u5e76\u5f15\u5165\u6267\u884c\u9519\u8bef\u53ca\u8ba1\u5212\u5916\u884c\u4e3a\uff0c\u89c2\u5bdf\u52a9\u624b\u6307\u5bfc\u5982\u4f55\u6539\u53d8\u4efb\u52a1\u7ed3\u679c\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/SalesforceAIResearch/Interactive-Visual-Gym", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.08286", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["IVG-Bench\u542b315\u4e2a\u573a\u666f\uff0c\u8986\u76d6\u70f9\u996a\u3001\u5bb6\u52a1\u4e0e\u624b\u673a\u754c\u9762", "\u6700\u4f73\u6a21\u578b\u9650\u65f6\u6210\u529f\u738753.4%\uff0c\u8d28\u91cf\u6307\u6807\u4e0e\u4eba\u7c7b\u504f\u597d\u4e00\u81f4\u738778.5%", "GRPO\u95ed\u73af\u8bad\u7ec3\u63d0\u5347Qwen3.5-4B\u70f9\u996a\u6210\u529f\u7387\u4e0e\u4ea4\u4e92\u8d28\u91cf"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u95ed\u73af\u8bc4\u6d4b", "\u7528\u6237\u6a21\u62df", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08286v1", "published_at": "2026-11-05", "score": 0.297, "selected_reasons": ["HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08286.png", "title": "Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds", "tldr": "\u901a\u8fc7\u8054\u5408\u6a21\u62df\u4efb\u52a1\u73af\u5883\u4e0e\u7528\u6237\uff0c\u95ed\u73af\u68c0\u9a8c\u89c6\u89c9\u52a9\u624b\u7684\u6307\u5bfc\u6548\u679c\u5e76\u652f\u6301\u8bad\u7ec3\u3002", "upvotes": 13, "what_it_is": "\u63d0\u51fa\u89c6\u89c9\u4ea4\u4e92\u6a21\u578b\u7684\u95ed\u73af\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u6846\u67b6\uff0c\u8054\u5408\u6a21\u62df\u53ef\u6267\u884c\u4efb\u52a1\u73af\u5883\u548c\u7528\u6237\u3002\u7528\u6237\u6a21\u62df\u53d7\u4eba\u8bbe\u6761\u4ef6\u63a7\u5236\uff0c\u5e76\u5f15\u5165\u6267\u884c\u9519\u8bef\u53ca\u8ba1\u5212\u5916\u884c\u4e3a\uff0c\u89c2\u5bdf\u52a9\u624b\u6307\u5bfc\u5982\u4f55\u6539\u53d8\u4efb\u52a1\u7ed3\u679c\u3002", "why_notable": "\u5c06\u8bc4\u6d4b\u4ece\u79bb\u7ebf\u56de\u653e\u63a8\u8fdb\u5230\u53ef\u6539\u53d8\u7528\u6237\u884c\u4e3a\u7684\u95ed\u73af\uff0c\u63ed\u793a\u4e8b\u5b9e\u4f9d\u636e\u3001\u53ef\u64cd\u4f5c\u6307\u5bfc\u4e0e\u54cd\u5e94\u5ef6\u8fdf\u7684\u77ed\u677f\uff0c\u4e5f\u63d0\u4f9b\u76f4\u63a5\u4f18\u5316\u4ea4\u4e92\u6548\u679c\u7684\u8bad\u7ec3\u73af\u5883\u3002"}, {"abstract": "Web-facing AI agents repeatedly access webpages, documents, repositories, and tool responses, yet reading interfaces often expose entire objects when only sparse evidence is needed. This over-reading increases token and latency costs and can dilute relevant evidence. We present SparseRead, a reusable reading control layer that governs content admission without modifying the agent model. Its Read Intent Protocol tracks evolving needs and source coverage; Adaptive Reader Backends select how evidence is located and exposed; and the Budgeted Read Gate bounds cumulative raw exposure per episode with faithful full-view fallback. A unified Reader interface supports interchangeable evidence acquisition across heterogeneous resources. Across six models, including Claude Opus 5, and five scenarios, SparseRead reduces total tokens by up to 92.9% and wall time by up to 89.0%, preserving or improving task quality in 97% settings. On Web deep-search tasks, it reduces tokens by 31.0--43.0% and task completion time by 23.0--37.0%. Ablations validate the three designs, while integration with three agent frameworks demonstrates portability.", "arxiv_id": "2608.22237", "arxiv_url": "https://arxiv.org/abs/2608.22237", "authors": ["Zedong Liu", "Jiaan Wu", "Xinyang Ma", "Le Xu", "Kai Wang", "Yuanchao Hu", "Dingwen Tao", "Guangming Tan"], "brief": "SparseRead\u662f\u53ef\u590d\u7528\u7684\u8bfb\u53d6\u63a7\u5236\u5c42\uff0c\u4ee5\u610f\u56fe\u8ffd\u8e2a\u3001\u81ea\u9002\u5e94\u8bc1\u636e\u83b7\u53d6\u548c\u9884\u7b97\u95e8\u63a7\u9650\u5236\u5916\u90e8\u5185\u5bb9\u8f93\u5165\uff0c\u5e76\u652f\u6301\u5fc5\u8981\u65f6\u56de\u9000\u5230\u5b8c\u6574\u89c6\u56fe\uff0c\u65e0\u9700\u4fee\u6539\u667a\u80fd\u4f53\u6a21\u578b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22237", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e09\u9879\u8bbe\u8ba1\uff1a\u8bfb\u53d6\u610f\u56fe\u534f\u8bae\u3001\u81ea\u9002\u5e94\u8bfb\u53d6\u540e\u7aef\u3001\u9884\u7b97\u8bfb\u53d6\u95e8\u63a7", "\u516d\u6a21\u578b\u3001\u4e94\u573a\u666f\uff1a\u8bcd\u5143\u6700\u591a\u964d92.9%\uff0c\u8017\u65f6\u964d89.0%", "97%\u8bbe\u7f6e\u8d28\u91cf\u6301\u5e73\u6216\u63d0\u5347\uff0c\u517c\u5bb9\u4e09\u4e2a\u667a\u80fd\u4f53\u6846\u67b6"], "keywords": ["\u667a\u80fd\u4f53", "\u7a00\u758f\u8bfb\u53d6", "\u8bcd\u5143\u6548\u7387", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 5, "on_hf": true, "organization": "Institute of Computing Technology", "pdf_url": "https://arxiv.org/pdf/2608.22237v2", "published_at": "2026-08-23", "score": 0.288, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.22237.png", "title": "Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents", "tldr": "\u901a\u8fc7\u7a00\u758f\u8bfb\u53d6\u5916\u90e8\u8bc1\u636e\uff0c\u667a\u80fd\u4f53\u65e0\u9700\u6539\u6a21\u578b\u5373\u53ef\u5927\u5e45\u964d\u4f4e\u8bcd\u5143\u4e0e\u8017\u65f6\u3002", "upvotes": 18, "what_it_is": "SparseRead\u662f\u53ef\u590d\u7528\u7684\u8bfb\u53d6\u63a7\u5236\u5c42\uff0c\u4ee5\u610f\u56fe\u8ffd\u8e2a\u3001\u81ea\u9002\u5e94\u8bc1\u636e\u83b7\u53d6\u548c\u9884\u7b97\u95e8\u63a7\u9650\u5236\u5916\u90e8\u5185\u5bb9\u8f93\u5165\uff0c\u5e76\u652f\u6301\u5fc5\u8981\u65f6\u56de\u9000\u5230\u5b8c\u6574\u89c6\u56fe\uff0c\u65e0\u9700\u4fee\u6539\u667a\u80fd\u4f53\u6a21\u578b\u3002", "why_notable": "\u5c06\u964d\u672c\u91cd\u70b9\u4ece\u6a21\u578b\u63a8\u7406\u8f6c\u5411\u5916\u90e8\u5185\u5bb9\u51c6\u5165\uff0c\u5728\u591a\u6570\u6d4b\u8bd5\u8bbe\u7f6e\u4e2d\u4fdd\u4f4f\u8d28\u91cf\uff1b\u8de8\u8d44\u6e90\u63a5\u53e3\u4e0e\u6846\u67b6\u96c6\u6210\u4e5f\u4f53\u73b0\u4e86\u53ef\u79fb\u690d\u6027\u3002"}, {"abstract": "The Platonic Representation Hypothesis (PRH) suggests that neural networks are converging toward similar representation spaces. As language models become more capable, their representations are aligning with those of vision models. However, recent work has questioned whether this trend continues to hold for newer language models. Moreover, it has been shown that representation similarity metrics can be confounded by model depth and width, requiring appropriate baselines for interpretation. In this work, we first investigate where alignment emerges between unimodal models across model layers and representation dimensions. Next, we find that the PRH capability-alignment trend persists for newer models as long as the captions are sufficiently clean and informative. Finally, we contextualize cross-modal alignment, introducing unimodal and multimodal baselines on various datasets. Our results show that the cross-modal representational alignment of unimodal models can surpass that of explicitly aligned vision-language models, but remains substantially behind the alignment observed for models of the same modality. Code is available at https://github.com/ExplainableML/prh-closer-look.", "arxiv_id": "2611.12869", "arxiv_url": "https://arxiv.org/abs/2611.12869", "authors": ["Julia Herbst", "Simon Roschmann", "Quentin Bouniot", "Zeynep Akata"], "brief": "\u7814\u7a76\u6cbf\u7f51\u7edc\u5c42\u4e0e\u8868\u5f81\u7ef4\u5ea6\u68c0\u9a8c\u8bed\u8a00\u3001\u89c6\u89c9\u6a21\u578b\u7684\u5bf9\u9f50\uff0c\u5e76\u7528\u5e72\u51c0\u4e14\u4fe1\u606f\u5145\u5206\u7684\u56fe\u50cf\u63cf\u8ff0\u590d\u67e5\u80fd\u529b\u8d8b\u52bf\uff0c\u5f15\u5165\u5355\u6a21\u6001\u4e0e\u591a\u6a21\u6001\u57fa\u7ebf\u89e3\u91ca\u76f8\u4f3c\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/ExplainableML/prh-closer-look", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2611.12869", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6309\u7f51\u7edc\u5c42\u4e0e\u8868\u5f81\u7ef4\u5ea6\u5b9a\u4f4d\u8de8\u6a21\u6001\u5bf9\u9f50", "PRH\u80fd\u529b\u2014\u5bf9\u9f50\u8d8b\u52bf\u4f9d\u8d56\u56fe\u50cf\u63cf\u8ff0\u8d28\u91cf", "\u5355\u6a21\u6001\u6a21\u578b\u8de8\u6a21\u6001\u5bf9\u9f50\u53ef\u8d85\u663e\u5f0f\u5bf9\u9f50\u6a21\u578b"], "keywords": ["\u8868\u5f81\u5b66\u4e60", "\u8de8\u6a21\u6001\u5bf9\u9f50", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 3, "on_hf": true, "organization": "Technical University of Munich", "pdf_url": "https://arxiv.org/pdf/2611.12869v1", "published_at": "2026-11-09", "score": 0.256, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.12869.png", "title": "Where Does Alignment Emerge and What Does It Mean? A Closer Look at the Platonic Representation Hypothesis", "tldr": "\u8bed\u8a00\u4e0e\u89c6\u89c9\u8868\u5f81\u8d8b\u540c\u4ecd\u6210\u7acb\uff0c\u4f46\u4f9d\u8d56\u63cf\u8ff0\u8d28\u91cf\uff0c\u4e14\u660e\u663e\u5f31\u4e8e\u540c\u6a21\u6001\u5bf9\u9f50", "upvotes": 7, "what_it_is": "\u7814\u7a76\u6cbf\u7f51\u7edc\u5c42\u4e0e\u8868\u5f81\u7ef4\u5ea6\u68c0\u9a8c\u8bed\u8a00\u3001\u89c6\u89c9\u6a21\u578b\u7684\u5bf9\u9f50\uff0c\u5e76\u7528\u5e72\u51c0\u4e14\u4fe1\u606f\u5145\u5206\u7684\u56fe\u50cf\u63cf\u8ff0\u590d\u67e5\u80fd\u529b\u8d8b\u52bf\uff0c\u5f15\u5165\u5355\u6a21\u6001\u4e0e\u591a\u6a21\u6001\u57fa\u7ebf\u89e3\u91ca\u76f8\u4f3c\u5ea6\u3002", "why_notable": "\u4e3a\u8868\u5f81\u8d8b\u540c\u63d0\u4f9b\u66f4\u6709\u53c2\u7167\u7684\u8bc1\u636e\uff1a\u8de8\u6a21\u6001\u76f8\u4f3c\u5ea6\u867d\u53ef\u8d85\u8fc7\u663e\u5f0f\u5bf9\u9f50\u6a21\u578b\uff0c\u5374\u4ecd\u8fdc\u4f4e\u4e8e\u540c\u6a21\u6001\u6c34\u5e73\uff0c\u9650\u5236\u4e86\u5bf9\u8d8b\u540c\u7a0b\u5ea6\u7684\u89e3\u8bfb\u3002"}, {"abstract": "Large language models (LLMs) increasingly support Web-based services that must balance response quality and inference cost across heterogeneous requests. Conventional routing selects one model per prompt, while fixed ensembles cannot adapt their composition and cost to individual requests. We introduce PISA, a prompt-adaptive, cost-aware single-model router, and PISA-E, its extension to ensemble routing. At the core of both methods, PISA combines soft cluster memberships with model-specific predictors to estimate individual model capabilities. Building on these estimates, PISA-E jointly selects ensemble composition and cardinality under an explicit cost--quality preference that can be adjusted at inference time without retraining. A tractable ensemble-success surrogate and efficient candidate selection enable this extension without ensemble-specific training. Across four LLM routing benchmarks under in-distribution (ID) and out-of-distribution (OOD) conditions, PISA achieves the highest macro-average cost--performance hypervolume among the evaluated single-model routers in both settings. Meanwhile, PISA-E achieves the highest macro-average task performance among the evaluated ensemble approaches when prioritizing response quality, surpassing the strongest competitors by 2.09 and 2.87 percentage points under ID and OOD conditions, respectively. At selected lower-cost operating points, it also exceeds the strongest ensemble competitors\u0027 macro-average task performance while reducing average inference cost by approximately 36% and 25%, respectively. These results demonstrate the effectiveness of prompt-adaptive capability estimation for both single-model routing and selective ensembling.", "arxiv_id": "2611.10193", "arxiv_url": "https://arxiv.org/abs/2611.10193", "authors": ["Saul Urso", "Emanuele Carlini", "Patrizio Dazzi", "Matteo Mordacchini"], "brief": "\u63d0\u51fa\u5355\u6a21\u578b\u8def\u7531\u5668PISA\u53ca\u96c6\u6210\u6269\u5c55PISA-E\uff0c\u4ee5\u8f6f\u805a\u7c7b\u548c\u6a21\u578b\u4e13\u5c5e\u9884\u6d4b\u5668\u4f30\u8ba1\u80fd\u529b\uff0c\u6309\u6210\u672c\u8d28\u91cf\u504f\u597d\u9009\u62e9\u96c6\u6210\u6210\u5458\u4e0e\u89c4\u6a21\uff0c\u63a8\u7406\u65f6\u53ef\u8c03\u4e14\u65e0\u9700\u91cd\u8bad\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.10193", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["PISA\u7ed3\u5408\u8f6f\u805a\u7c7b\u5f52\u5c5e\u4e0e\u6a21\u578b\u4e13\u5c5e\u80fd\u529b\u9884\u6d4b\u5668\u3002", "PISA-E\u7528\u96c6\u6210\u6210\u529f\u4ee3\u7406\u4e0e\u5019\u9009\u7b5b\u9009\uff0c\u65e0\u9700\u96c6\u6210\u4e13\u5c5e\u8bad\u7ec3\u3002", "\u56db\u4e2a\u57fa\u51c6\u4e0a\uff0cID/OOD\u8d28\u91cf\u9886\u51482.09/2.87\u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8def\u7531", "\u96c6\u6210\u5b66\u4e60", "\u63a8\u7406\u6210\u672c"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.10193v1", "published_at": "2026-11-06", "score": 0.255, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.10193.png", "title": "Ensemble Routing for Prompt-Adaptive Cost-Aware LLM Inference", "tldr": "\u6309\u63d0\u793a\u52a8\u6001\u9009\u62e9\u6a21\u578b\u53ca\u96c6\u6210\u89c4\u6a21\uff0c\u5728\u8d28\u91cf\u4e0e\u63a8\u7406\u6210\u672c\u95f4\u5b9e\u73b0\u53ef\u8c03\u6743\u8861\u3002", "upvotes": 14, "what_it_is": "\u63d0\u51fa\u5355\u6a21\u578b\u8def\u7531\u5668PISA\u53ca\u96c6\u6210\u6269\u5c55PISA-E\uff0c\u4ee5\u8f6f\u805a\u7c7b\u548c\u6a21\u578b\u4e13\u5c5e\u9884\u6d4b\u5668\u4f30\u8ba1\u80fd\u529b\uff0c\u6309\u6210\u672c\u8d28\u91cf\u504f\u597d\u9009\u62e9\u96c6\u6210\u6210\u5458\u4e0e\u89c4\u6a21\uff0c\u63a8\u7406\u65f6\u53ef\u8c03\u4e14\u65e0\u9700\u91cd\u8bad\u3002", "why_notable": "\u5c06\u6a21\u578b\u8def\u7531\u6269\u5c55\u4e3a\u53ef\u53d8\u89c4\u6a21\u96c6\u6210\uff1b\u5728\u90e8\u5206\u4f4e\u6210\u672c\u70b9\uff0c\u6027\u80fd\u8d85\u8fc7\u6700\u5f3a\u96c6\u6210\u5bf9\u624b\uff0c\u540c\u65f6ID/OOD\u6210\u672c\u7ea6\u964d36%/25%\u3002"}, {"abstract": "Subliminal learning is a phenomenon in large language models (LLMs) where a teacher passes a hidden preference to a student through training data unrelated to that preference. We study whether subliminal learning also occurs in vision-language models (VLMs). We finetune a teacher VLM to prefer a specific animal or facial attribute and use a control teacher from the same base model. Both teachers generate numbers for an unrelated visual task involving geometric shapes. Two students initialized from the same base VLM are finetuned on the same images, using numbers generated by either the biased or control teacher. Across VLMs ranging from 2B to 7B parameters, we find that both animal and facial preferences can transfer through this unrelated task. Students trained on biased-teacher outputs select the target more often than control students, with a difference of up to $\\sim$10 percentage points in the animal preference task. Transfer can become stronger with more training data and varies with the target preference, model, and how the numbers are generated. Beyond preferences, we show that the biased student\u0027s explanations use more of the same words and phrases as the biased teacher\u0027s explanations than those of the control student, even when all three models select the same image. These results matter for training VLMs and show that training on unrelated data may change both a VLM\u0027s image preferences and how it explains its choices, and that transfer can become stronger with more training samples.", "arxiv_id": "2611.08538", "arxiv_url": "https://arxiv.org/abs/2611.08538", "authors": ["Arman Hatami", "Romina Aalishah", "Ilya E. Monosov"], "brief": "\u7814\u7a76\u8ba9\u5e26\u52a8\u7269\u6216\u9762\u90e8\u5c5e\u6027\u504f\u597d\u7684\u6559\u5e08\u6a21\u578b\u4e3a\u51e0\u4f55\u56fe\u5f62\u4efb\u52a1\u751f\u6210\u6570\u5b57\uff0c\u518d\u7528\u8fd9\u4e9b\u6570\u5b57\u5fae\u8c03\u5b66\u751f\uff0c\u5e76\u4e0e\u65e0\u504f\u6559\u5e08\u5bf9\u7167\uff0c\u68c0\u9a8c\u504f\u597d\u80fd\u5426\u8de8\u4efb\u52a1\u4f20\u9012\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG", "eess.IV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08538", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u57282B\u81f37B\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e2d\u89c2\u5bdf\u5230\u504f\u597d\u8fc1\u79fb\u3002", "\u52a8\u7269\u504f\u597d\u4efb\u52a1\u4e2d\uff0c\u76ee\u6807\u9009\u62e9\u7387\u5dee\u5f02\u6700\u9ad8\u7ea610\u4e2a\u767e\u5206\u70b9\u3002", "\u89e3\u91ca\u63aa\u8f9e\u4e5f\u8d8b\u8fd1\u6559\u5e08\uff0c\u589e\u52a0\u8bad\u7ec3\u6570\u636e\u53ef\u5f3a\u5316\u8fc1\u79fb\u3002"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u9690\u6027\u5b66\u4e60", "\u504f\u597d\u8fc1\u79fb", "\u6a21\u578b\u5fae\u8c03"], "num_comments": 2, "on_hf": true, "organization": "Johns Hopkins University", "pdf_url": "https://arxiv.org/pdf/2611.08538v1", "published_at": "2026-11-04", "score": 0.249, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08538.png", "title": "Subliminal Learning in Vision-Language Models", "tldr": "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u901a\u8fc7\u65e0\u5173\u4efb\u52a1\u7684\u6570\u5b57\u8bad\u7ec3\u6570\u636e\uff0c\u9690\u6027\u7ee7\u627f\u6559\u5e08\u7684\u56fe\u50cf\u504f\u597d\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u8ba9\u5e26\u52a8\u7269\u6216\u9762\u90e8\u5c5e\u6027\u504f\u597d\u7684\u6559\u5e08\u6a21\u578b\u4e3a\u51e0\u4f55\u56fe\u5f62\u4efb\u52a1\u751f\u6210\u6570\u5b57\uff0c\u518d\u7528\u8fd9\u4e9b\u6570\u5b57\u5fae\u8c03\u5b66\u751f\uff0c\u5e76\u4e0e\u65e0\u504f\u6559\u5e08\u5bf9\u7167\uff0c\u68c0\u9a8c\u504f\u597d\u80fd\u5426\u8de8\u4efb\u52a1\u4f20\u9012\u3002", "why_notable": "\u7ed3\u679c\u63ed\u793a\u591a\u6a21\u6001\u8bad\u7ec3\u4e2d\u7684\u9690\u6027\u504f\u597d\u4f20\u64ad\u98ce\u9669\uff1a\u5373\u4f7f\u6570\u636e\u4efb\u52a1\u4e0e\u504f\u597d\u65e0\u5173\uff0c\u4e5f\u53ef\u80fd\u6539\u53d8\u6a21\u578b\u7684\u56fe\u50cf\u9009\u62e9\u53ca\u89e3\u91ca\u65b9\u5f0f\u3002"}, {"abstract": "We present FAME-QP, a GPU-accelerated solver for dense quadratic programs arising in linear model predictive control. FAME-QP combines constraint-dependent operator representations with fused single- and two-kernel iterations replayed through CUDA graphs, automatically selecting the execution configuration through device calibration and problem-specific timing. It probes a cached operator bank to select the initial penalty and updates operators lazily when problem matrices change. Numerical benchmarks and simulated humanoid and quadrotor control experiments demonstrate reduced latency relative to competing GPU solvers while maintaining solution accuracy and control performance.", "arxiv_id": "2611.13766", "arxiv_url": "https://arxiv.org/abs/2611.13766", "authors": ["Santosh Mohan Rajkumar", "Debdipta Goswami", "Stephanie Stockar"], "brief": "FAME-QP\u662f\u9762\u5411\u7ebf\u6027\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u7684GPU\u7a20\u5bc6\u4e8c\u6b21\u89c4\u5212\u6c42\u89e3\u5668\u3002\u5b83\u7ed3\u5408\u4f9d\u8d56\u7ea6\u675f\u7684\u7b97\u5b50\u8868\u793a\u3001\u5185\u6838\u878d\u5408\u548cCUDA\u56fe\u91cd\u653e\uff0c\u5e76\u81ea\u52a8\u9009\u62e9\u6267\u884c\u914d\u7f6e\u3002", "categories": ["cs.RO", "cs.GR", "eess.SY"], "github_repo": "https://github.com/santoshrajkumar/fame-qp", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2611.13766", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u878d\u5408\u5355\u5185\u6838\u6216\u53cc\u5185\u6838\u8fed\u4ee3\uff0c\u901a\u8fc7CUDA\u56fe\u91cd\u653e", "\u8bbe\u5907\u6821\u51c6\u4e0e\u95ee\u9898\u4e13\u9879\u8ba1\u65f6\u5171\u540c\u9009\u62e9\u6267\u884c\u914d\u7f6e", "\u63a2\u6d4b\u7f13\u5b58\u7b97\u5b50\u5e93\u9009\u62e9\u521d\u59cb\u7f5a\u53c2\u6570\uff0c\u77e9\u9635\u53d8\u5316\u65f6\u5ef6\u8fdf\u66f4\u65b0"], "keywords": ["\u4e8c\u6b21\u89c4\u5212", "\u6a21\u578b\u9884\u6d4b\u63a7\u5236", "GPU\u52a0\u901f", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 2, "on_hf": true, "organization": "The Ohio State University", "pdf_url": "https://arxiv.org/pdf/2611.13766v1", "published_at": "2026-11-10", "score": 0.244, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.13766.png", "title": "FAME-QP: A GPU-Accelerated Quadratic-Programming Solver for Real-Time Model Predictive Control", "tldr": "\u901a\u8fc7\u7b97\u5b50\u9002\u914d\u4e0e\u5185\u6838\u878d\u5408\uff0c\u964d\u4f4e\u7ebf\u6027\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u4e2d\u7a20\u5bc6\u4e8c\u6b21\u89c4\u5212\u7684\u6c42\u89e3\u5ef6\u8fdf\u3002", "upvotes": 4, "what_it_is": "FAME-QP\u662f\u9762\u5411\u7ebf\u6027\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u7684GPU\u7a20\u5bc6\u4e8c\u6b21\u89c4\u5212\u6c42\u89e3\u5668\u3002\u5b83\u7ed3\u5408\u4f9d\u8d56\u7ea6\u675f\u7684\u7b97\u5b50\u8868\u793a\u3001\u5185\u6838\u878d\u5408\u548cCUDA\u56fe\u91cd\u653e\uff0c\u5e76\u81ea\u52a8\u9009\u62e9\u6267\u884c\u914d\u7f6e\u3002", "why_notable": "\u6570\u503c\u57fa\u51c6\u53ca\u4eba\u5f62\u673a\u5668\u4eba\u3001\u56db\u65cb\u7ffc\u4eff\u771f\u663e\u793a\uff0c\u76f8\u6bd4\u5176\u4ed6GPU\u6c42\u89e3\u5668\u53ef\u964d\u4f4e\u5ef6\u8fdf\uff0c\u540c\u65f6\u4fdd\u6301\u6c42\u89e3\u7cbe\u5ea6\u4e0e\u63a7\u5236\u6027\u80fd\uff0c\u9002\u5408\u5b9e\u65f6\u63a7\u5236\u9700\u6c42\u3002"}, {"abstract": "Human cognitive tasks let us compare language models with humans under controlled conditions. Yet a model can reproduce the direction of a human effect while making different errors. CogBattery evaluates 54 open-weight language models on text adaptations of 13 cognitive paradigms, comparing each with human data from its source study. Like humans, models respond more to n-back lures than to controls, yet they make far more false alarms on ordinary non-targets. Most models\u0027 reported confidence separates correct from incorrect answers less well than humans\u0027 does, and most always choose the same wager, including models that classify accurately. These patterns span many model families. Across tasks, model scores share two dimensions. The first is closely tied to scale, yet larger models are not consistently closer to humans. Predefined cognitive groupings show no reliable predictive advantage over random groupings of the same size. These results show that matching human effect directions does not establish human-like behavior. CogBattery provides condition-level human references for testing errors and confidence reports in new models.", "arxiv_id": "2607.24999", "arxiv_url": "https://arxiv.org/abs/2607.24999", "authors": ["Dengzhe Hou", "Lingyu Jiang", "Fangzhou Lin", "Kazunori D Yamada"], "brief": "CogBattery\u5c0613\u79cd\u8ba4\u77e5\u8303\u5f0f\u6539\u7f16\u4e3a\u6587\u672c\u4efb\u52a1\uff0c\u8bc4\u4f3054\u4e2a\u5f00\u653e\u6743\u91cd\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u5bf9\u7167\u539f\u7814\u7a76\u7684\u4eba\u7c7b\u6570\u636e\uff0c\u5206\u6790\u9519\u8bef\u3001\u7f6e\u4fe1\u5ea6\u4e0e\u8de8\u4efb\u52a1\u8868\u73b0\u7ed3\u6784\u3002", "categories": ["cs.CL", "cs.AI", "q-bio.NC"], "github_repo": "https://github.com/dengzhe-hou/CogBattery", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2607.24999", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["n-back\u4efb\u52a1\u4e2d\uff0c\u6a21\u578b\u5bf9\u666e\u901a\u975e\u76ee\u6807\u7684\u8bef\u62a5\u8fdc\u591a\u4e8e\u4eba\u7c7b", "\u591a\u6570\u6a21\u578b\u7f6e\u4fe1\u5ea6\u533a\u5206\u6b63\u8bef\u5f31\u4e8e\u4eba\u7c7b\uff0c\u4e14\u59cb\u7ec8\u9009\u62e9\u540c\u4e00\u8d4c\u6ce8", "\u8de8\u4efb\u52a1\u5f97\u5206\u5448\u4e24\u7ef4\u7ed3\u6784\uff0c\u9884\u8bbe\u8ba4\u77e5\u5206\u7ec4\u4e0d\u4f18\u4e8e\u968f\u673a\u5206\u7ec4"], "keywords": ["\u8ba4\u77e5\u8bc4\u4f30", "\u8bed\u8a00\u6a21\u578b", "\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u4eba\u673a\u6bd4\u8f83"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24999v2", "published_at": "2026-07-27", "score": 0.232, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2607.24999.png", "title": "CogBattery: Human-Referenced Evaluation of Cognitive Task Behavior and Structure in Language Models", "tldr": "\u5bf9\u7167\u4eba\u7c7b\u8ba4\u77e5\u5b9e\u9a8c\u53d1\u73b0\uff0c\u8bed\u8a00\u6a21\u578b\u590d\u73b0\u6548\u5e94\u65b9\u5411\u5e76\u4e0d\u610f\u5473\u7740\u884c\u4e3a\u7c7b\u4eba", "upvotes": 4, "what_it_is": "CogBattery\u5c0613\u79cd\u8ba4\u77e5\u8303\u5f0f\u6539\u7f16\u4e3a\u6587\u672c\u4efb\u52a1\uff0c\u8bc4\u4f3054\u4e2a\u5f00\u653e\u6743\u91cd\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u5bf9\u7167\u539f\u7814\u7a76\u7684\u4eba\u7c7b\u6570\u636e\uff0c\u5206\u6790\u9519\u8bef\u3001\u7f6e\u4fe1\u5ea6\u4e0e\u8de8\u4efb\u52a1\u8868\u73b0\u7ed3\u6784\u3002", "why_notable": "\u5b83\u628a\u7c7b\u4eba\u8bc4\u4f30\u4ece\u6548\u5e94\u65b9\u5411\u63a8\u8fdb\u5230\u5177\u4f53\u9519\u8bef\u4e0e\u7f6e\u4fe1\u5ea6\uff0c\u5e76\u63d0\u4f9b\u6761\u4ef6\u7ea7\u4eba\u7c7b\u53c2\u7167\uff1b\u7ed3\u679c\u4e5f\u8868\u660e\uff0c\u6a21\u578b\u66f4\u5927\u4e0d\u4ee3\u8868\u884c\u4e3a\u66f4\u63a5\u8fd1\u4eba\u7c7b\u3002"}, {"abstract": "Different optimizers impose different geometries on parameter updates. Adaptive methods such as Adam and AdamW use coordinate-wise updates, while matrix-aware optimizers such as Muon utilize weight-matrix structure through orthogonalized updates. For Graph Neural Networks (GNNs), however, the effective geometry of its weight matrices is shaped not only by its learned channel-mixing weights, but also by the graph-propagated representations it acts on. Thus, even if an update is well normalized as a matrix, its effect on the layer output can be amplified when applied to graph-propagated features. To address this gap, we introduce GraphMuon, a graph-aware optimizer that adapts Muon\u0027s matrix updates to the covariance structure of graph-propagated layer inputs. GraphMuon performs orthogonalization in a metric defined by these propagated representations and normalizes step sizes according to the update\u0027s induced effect on the layer representation. We show that theoretically, vanilla Muon can suffer from graph-induced update amplification, while our GraphMuon can mitigate this effect. As such, our GraphMuon yields a graph-metric analogue of Muon\u0027s polar update step. Empirically, GraphMuon achieves $1.32\\times$-$2.42\\times$ validation-loss time-to-target speedups over AdamW on three large-scale OGB benchmarks. Across 15 dataset-architecture configurations spanning node classification, inductive graph classification, and graph regression, it achieves lower time-to-target in 13 cases, while maintaining competitive or superior predictive performance. Code is available at https://github.com/guy-hadad/GraphMuon.", "arxiv_id": "2611.08379", "arxiv_url": "https://arxiv.org/abs/2611.08379", "authors": ["Guy Hadad", "Haggai Roitman", "Moshe Eliasof", "Bracha Shapira"], "brief": "\u63d0\u51fa\u56fe\u611f\u77e5\u4f18\u5316\u5668GraphMuon\uff0c\u4ee5\u56fe\u4f20\u64ad\u540e\u5c42\u8f93\u5165\u7684\u534f\u65b9\u5dee\u5b9a\u4e49\u5ea6\u91cf\uff0c\u5bf9Muon\u66f4\u65b0\u8fdb\u884c\u6b63\u4ea4\u5316\uff0c\u5e76\u6309\u66f4\u65b0\u5bf9\u5c42\u8868\u793a\u7684\u5b9e\u9645\u5f71\u54cd\u5f52\u4e00\u5316\u6b65\u957f\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/guy-hadad/GraphMuon", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2611.08379", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["GraphMuon\u7f13\u89e3\u7406\u8bba\u63ed\u793a\u7684\u56fe\u8bf1\u5bfc\u66f4\u65b0\u653e\u5927", "\u4e09\u4e2a\u5927\u578bOGB\u57fa\u51c6\u8f83AdamW\u63d0\u901f1.32\u20142.42\u500d", "15\u79cd\u6570\u636e\u96c6\u4e0e\u67b6\u6784\u7ec4\u5408\u4e2d\uff0c13\u79cd\u66f4\u5feb\u8fbe\u5230\u76ee\u6807"], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u4f18\u5316\u5668", "\u8bad\u7ec3\u52a0\u901f"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08379v1", "published_at": "2026-11-05", "score": 0.23, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.08379.png", "title": "Module-Aware Optimization for Graph Neural Networks", "tldr": "GraphMuon\u5c06\u56fe\u4f20\u64ad\u7279\u5f81\u7eb3\u5165\u66f4\u65b0\u51e0\u4f55\uff0c\u52a0\u5feb\u56fe\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u56fe\u611f\u77e5\u4f18\u5316\u5668GraphMuon\uff0c\u4ee5\u56fe\u4f20\u64ad\u540e\u5c42\u8f93\u5165\u7684\u534f\u65b9\u5dee\u5b9a\u4e49\u5ea6\u91cf\uff0c\u5bf9Muon\u66f4\u65b0\u8fdb\u884c\u6b63\u4ea4\u5316\uff0c\u5e76\u6309\u66f4\u65b0\u5bf9\u5c42\u8868\u793a\u7684\u5b9e\u9645\u5f71\u54cd\u5f52\u4e00\u5316\u6b65\u957f\u3002", "why_notable": "\u628a\u77e9\u9635\u4f18\u5316\u4ece\u6743\u91cd\u7ed3\u6784\u63a8\u8fdb\u5230\u56fe\u4f20\u64ad\u540e\u7684\u8868\u793a\u51e0\u4f55\uff0c\u5728\u4fdd\u6301\u9884\u6d4b\u6027\u80fd\u7684\u540c\u65f6\u7f29\u77ed\u8fbe\u6807\u65f6\u95f4\uff0c\u4e3a\u56fe\u7f51\u7edc\u8bad\u7ec3\u63d0\u4f9b\u66f4\u8d34\u5408\u6a21\u5757\u7684\u4f18\u5316\u65b9\u6848\u3002"}, {"abstract": "Human working memory lets people maintain and update information. Large language models (LLMs) face a related demand when tracking updates within a single prompt without writing out intermediate states, yet existing tests differ in their constraints on written steps. We introduce a working-memory-inspired probe of cumulative state tracking with program-computed answers, 3 to 100 updates, and final-state, intermediate-state, or multi-target queries. It compares protocols on identical items. Across 18 LLMs, accuracy is 84.9% on single-step arithmetic but 31.7% on core items requiring one number after three to seven updates. From 50 updates on, no model exceeds 10% accuracy. Core accuracy reaches 88.0% under a larger budget and instructions to write steps and place the answer on the last line, mainly due to the instruction changes rather than the budget. Core accuracy also correlates positively with public Berkeley Function Calling Leaderboard scores. These findings show that strong single-step arithmetic does not ensure reliable cumulative tracking and that output protocols substantially change measured accuracy. We release the generator, items, scoring code, and responses for reproducible comparisons across depths, query types, and protocols.", "arxiv_id": "2603.27343", "arxiv_url": "https://arxiv.org/abs/2603.27343", "authors": ["Dengzhe Hou", "Lingyu Jiang", "Deng Li", "Zirui Li", "Fangzhou Lin", "Kazunori D Yamada"], "brief": "\u63d0\u51fa\u5de5\u4f5c\u8bb0\u5fc6\u542f\u53d1\u7684\u53ef\u7f16\u7a0b\u63a2\u9488\uff0c\u7528\u7a0b\u5e8f\u8ba1\u7b97\u6807\u51c6\u7b54\u6848\uff0c\u6d4b\u8bd5\u6a21\u578b\u5728\u8fde\u7eed\u66f4\u65b0\u4e2d\u7ef4\u62a4\u72b6\u6001\u7684\u80fd\u529b\u3002\u5bf9\u76f8\u540c\u9898\u76ee\u6bd4\u8f83\u4e0d\u540c\u8f93\u51fa\u534f\u8bae\uff0c\u5e76\u8986\u76d6\u6700\u7ec8\u3001\u4e2d\u95f4\u53ca\u591a\u76ee\u6807\u67e5\u8be2\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/dengzhe-hou/WMIP", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2603.27343", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["WMIP\u8986\u76d63\u81f3100\u6b21\u66f4\u65b0\uff0c\u6d4b\u8bd518\u79cd\u5927\u6a21\u578b", "\u5355\u6b65\u51c6\u786e\u738784.9%\uff0c\u6838\u5fc3\u989831.7%\uff1b50\u6b21\u8d77\u5747\u4e0d\u8d8510%", "\u589e\u9884\u7b97\u5e76\u8981\u6c42\u5199\u6b65\u9aa4\u540e\u8fbe88.0%\uff0c\u4e3b\u8981\u6536\u76ca\u6765\u81ea\u6307\u4ee4"], "keywords": ["\u5de5\u4f5c\u8bb0\u5fc6", "\u72b6\u6001\u8ffd\u8e2a", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2603.27343v3", "published_at": "2026-03-28", "score": 0.224, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2603.27343.png", "title": "WMIP: A Working-Memory-Inspired Programmable Probe of Cumulative State Tracking in Large Language Models", "tldr": "\u5341\u516b\u79cd\u5927\u6a21\u578b\u7684\u6d4b\u8bd5\u63ed\u793a\uff0c\u7d2f\u79ef\u72b6\u6001\u8ffd\u8e2a\u660e\u663e\u8584\u5f31\uff0c\u8f93\u51fa\u534f\u8bae\u663e\u8457\u5f71\u54cd\u6210\u7ee9\u3002", "upvotes": 3, "what_it_is": "\u63d0\u51fa\u5de5\u4f5c\u8bb0\u5fc6\u542f\u53d1\u7684\u53ef\u7f16\u7a0b\u63a2\u9488\uff0c\u7528\u7a0b\u5e8f\u8ba1\u7b97\u6807\u51c6\u7b54\u6848\uff0c\u6d4b\u8bd5\u6a21\u578b\u5728\u8fde\u7eed\u66f4\u65b0\u4e2d\u7ef4\u62a4\u72b6\u6001\u7684\u80fd\u529b\u3002\u5bf9\u76f8\u540c\u9898\u76ee\u6bd4\u8f83\u4e0d\u540c\u8f93\u51fa\u534f\u8bae\uff0c\u5e76\u8986\u76d6\u6700\u7ec8\u3001\u4e2d\u95f4\u53ca\u591a\u76ee\u6807\u67e5\u8be2\u3002", "why_notable": "\u5b83\u5c06\u5355\u6b65\u7b97\u672f\u4e0e\u7d2f\u79ef\u8ffd\u8e2a\u80fd\u529b\u533a\u5206\u5f00\uff0c\u63ed\u793a\u8f93\u51fa\u534f\u8bae\u5bf9\u8bc4\u6d4b\u7ed3\u679c\u7684\u663e\u8457\u5f71\u54cd\uff1b\u5f00\u653e\u751f\u6210\u5668\u3001\u9898\u76ee\u53ca\u8bc4\u5206\u4ee3\u7801\uff0c\u652f\u6301\u53ef\u590d\u73b0\u6bd4\u8f83\u3002"}, {"abstract": "Humans often cheat when a task is going badly and a goal feels out of reach. We explore and validate an analogous idea in language models: they exhibit a similar internal pressure state that precedes reward hacking. Using everyday stories (crucially, without any hacking examples), we extract a task badness direction that rises as failures accumulate across three models we study (Qwen3.6-27B, GPT-OSS-20B, and Gemma-4-31B). On impossible or difficult coding tasks, task badness rises over the turns leading up to a hack. Further, subtracting the direction a moderate amount reduces cheating in Qwen, more than steering against desperation or task impossibility. Subtracting task badness by an even larger amount blinds the agent to its own failures, causing it to interpret failing tests as passing. However, the relationship to hacking differs across models: in GPT-OSS, the state separates hacking runs from honest solves but not honest failures. Our results suggest monitoring and mitigation strategies based on tracking this state of task badness. Further, as agents are set on more difficult and long-horizon tasks, states like this may push them toward illegible and obscured chain-of-thought, so oversight will be needed on internal representations such as this.", "arxiv_id": "2611.14996", "arxiv_url": "https://arxiv.org/abs/2611.14996", "authors": ["Natalia Fischl-Lanzoni", "Punya Syon Pandey", "Merlin Stein", "David Demitri Africa"], "brief": "\u7814\u7a76\u4ece\u4e0d\u542b\u4f5c\u5f0a\u793a\u4f8b\u7684\u65e5\u5e38\u6545\u4e8b\u4e2d\u63d0\u53d6\u4efb\u52a1\u53d7\u632b\u6fc0\u6d3b\u65b9\u5411\uff0c\u5e76\u5728\u4e09\u79cd\u6a21\u578b\u7684\u56f0\u96be\u7f16\u7a0b\u4efb\u52a1\u4e2d\u8ffd\u8e2a\u5176\u53d8\u5316\uff0c\u901a\u8fc7\u6fc0\u6d3b\u5e72\u9884\u68c0\u9a8c\u5b83\u4e0e\u5956\u52b1\u4f5c\u5f0a\u7684\u5173\u7cfb\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14996", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728Qwen\u3001GPT-OSS\u548cGemma\u4e09\u79cd\u6a21\u578b\u4e2d\u63d0\u53d6\u4efb\u52a1\u53d7\u632b\u65b9\u5411", "Qwen\u4e2d\u9002\u5ea6\u51cf\u53bb\u8be5\u65b9\u5411\uff0c\u6bd4\u6291\u5236\u7edd\u671b\u6216\u4efb\u52a1\u4e0d\u53ef\u80fd\u611f\u66f4\u80fd\u51cf\u5c11\u4f5c\u5f0a", "\u8fc7\u5f3a\u5e72\u9884\u4f7f\u667a\u80fd\u4f53\u5c06\u5931\u8d25\u6d4b\u8bd5\u8bef\u5224\u4e3a\u901a\u8fc7"], "keywords": ["\u5956\u52b1\u4f5c\u5f0a", "\u5185\u90e8\u8868\u5f81", "\u6fc0\u6d3b\u5e72\u9884", "\u667a\u80fd\u4f53\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14996v1", "published_at": "2026-11-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Breaking Bad: \"Going Badly\" Activations Drive Reward Hacking", "tldr": "\u6a21\u578b\u5185\u90e8\u7684\u4efb\u52a1\u53d7\u632b\u72b6\u6001\u53ef\u9884\u793a\u5956\u52b1\u4f5c\u5f0a\uff0c\u9002\u5ea6\u524a\u5f31\u80fd\u51cf\u5c11\u4f5c\u5f0a\u4f46\u8fc7\u91cf\u4f1a\u8bef\u5224\u5931\u8d25\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4ece\u4e0d\u542b\u4f5c\u5f0a\u793a\u4f8b\u7684\u65e5\u5e38\u6545\u4e8b\u4e2d\u63d0\u53d6\u4efb\u52a1\u53d7\u632b\u6fc0\u6d3b\u65b9\u5411\uff0c\u5e76\u5728\u4e09\u79cd\u6a21\u578b\u7684\u56f0\u96be\u7f16\u7a0b\u4efb\u52a1\u4e2d\u8ffd\u8e2a\u5176\u53d8\u5316\uff0c\u901a\u8fc7\u6fc0\u6d3b\u5e72\u9884\u68c0\u9a8c\u5b83\u4e0e\u5956\u52b1\u4f5c\u5f0a\u7684\u5173\u7cfb\u3002", "why_notable": "\u5c06\u5956\u52b1\u4f5c\u5f0a\u4e0e\u53ef\u8ffd\u8e2a\u3001\u53ef\u5e72\u9884\u7684\u5185\u90e8\u53d7\u632b\u8868\u5f81\u8054\u7cfb\u8d77\u6765\uff0c\u4e3a\u667a\u80fd\u4f53\u76d1\u7763\u63d0\u4f9b\u65b0\u7ebf\u7d22\uff0c\u4e5f\u63ed\u793a\u5e72\u9884\u8fc7\u5ea6\u53ef\u80fd\u635f\u5bb3\u5931\u8d25\u8bc6\u522b\u3002"}, {"abstract": "Medical vision-language models (VLMs) are compared mainly by accuracy averaged across findings, a summary that can hide complete failure on a single diagnosis. We audit five open medical VLMs (MedGemma-4B, Lingshu-7B, HuatuoGPT-Vision-7B, Qwen2.5-VL-7B, and MedVLM-R1) on 6,048 ChestX-ray14 questions balanced by sex, age, finding, and label. On the 432 pneumothorax-positive X-rays, HuatuoGPT-Vision and Qwen2.5-VL detect zero cases while MedGemma and Lingshu detect 38% and 67% of the same images. The two failing models answer \"no\" to all 864 pneumothorax cases (balanced accuracy 0.500, chance), yet produce fluent, anatomically specific explanations that name the signs of a collapsed lung and then deny them, with no hedge or abstention. This failure is not an artifact of prompting, image resolution, label ambiguity, or model scale. It persists across four prompt formats, at native resolution, and on single-label cases. A within-model control shows the same forced prompt gives HuatuoGPT 79% recall on nodule but only 6% on pneumothorax. It survives a tenfold scale increase (Qwen2.5-VL-72B detects 4%) and replicates on SIIM-ACR, an independent dataset with radiologist-drawn masks, where the failing models detect 0 of 432 confirmed pneumothoraces, including 0 of the 144 largest lesions. Reading the models\u0027 logits and internal states shows this is not blindness. The two failing models are highly confident yet no better than chance and a linear probe recovers pneumothorax from their hidden representations even where recall is zero, so the finding is represented internally but suppressed at the output. Aggregate accuracy therefore cannot establish that a medical VLM can see a given finding, because a model that misses one can still describe it convincingly. Reporting per-finding recall and specificity on balanced cases is needed to tell the difference.", "arxiv_id": "2611.14975", "arxiv_url": "https://arxiv.org/abs/2611.14975", "authors": ["Shreya Ajay Kale", "Angad Ripudaman Singh Bajwa"], "brief": "\u7814\u7a76\u5ba1\u8ba1\u4e94\u4e2a\u5f00\u653e\u533b\u5b66\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u7528\u5747\u8861\u80f8\u7247\u95ee\u7b54\u53ca\u72ec\u7acb\u6570\u636e\u96c6\u68c0\u9a8c\u9010\u75c5\u79cd\u8868\u73b0\uff0c\u5e76\u901a\u8fc7\u63d0\u793a\u5bf9\u7167\u3001\u6a21\u578b\u6269\u5bb9\u548c\u9690\u85cf\u72b6\u6001\u63a2\u9488\u5b9a\u4f4d\u6c14\u80f8\u6f0f\u8bca\u673a\u5236\u3002", "categories": ["eess.IV", "cs.CL", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14975", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["6048\u9053\u5747\u8861\u80f8\u7247\u95ee\u9898\u4e2d\uff0c\u4e24\u6a21\u578b\u6f0f\u6389\u5168\u90e8432\u4f8b\u6c14\u80f8", "SIIM-ACR\u590d\u9a8c\u4ecd\u6f0f\u6389432\u4f8b\uff0c\u5305\u62ec144\u4f8b\u6700\u5927\u75c5\u7076", "\u7ebf\u6027\u63a2\u9488\u53ef\u6062\u590d\u6c14\u80f8\u4fe1\u53f7\uff0c\u63d0\u793a\u8f93\u51fa\u6291\u5236\u800c\u975e\u672a\u8bc6\u522b"], "keywords": ["\u533b\u5b66\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u80f8\u7247\u8bca\u65ad", "\u6a21\u578b\u8bc4\u4f30", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14975v1", "published_at": "2026-11-11", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Aggregate Accuracy Hides Diagnosis-Specific Failure in Medical Vision-Language Models", "tldr": "\u533b\u5b66\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u603b\u4f53\u51c6\u786e\u7387\u63a9\u76d6\u6c14\u80f8\u6f0f\u8bca\uff0c\u5185\u90e8\u8bc6\u522b\u4fe1\u53f7\u672a\u8f6c\u5316\u4e3a\u8f93\u51fa\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5ba1\u8ba1\u4e94\u4e2a\u5f00\u653e\u533b\u5b66\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u7528\u5747\u8861\u80f8\u7247\u95ee\u7b54\u53ca\u72ec\u7acb\u6570\u636e\u96c6\u68c0\u9a8c\u9010\u75c5\u79cd\u8868\u73b0\uff0c\u5e76\u901a\u8fc7\u63d0\u793a\u5bf9\u7167\u3001\u6a21\u578b\u6269\u5bb9\u548c\u9690\u85cf\u72b6\u6001\u63a2\u9488\u5b9a\u4f4d\u6c14\u80f8\u6f0f\u8bca\u673a\u5236\u3002", "why_notable": "\u63ed\u793a\u6d41\u7545\u3001\u786e\u5b9a\u7684\u533b\u5b66\u89e3\u91ca\u53ef\u4e0e\u7279\u5b9a\u75c5\u79cd\u7684\u5b8c\u5168\u6f0f\u8bca\u5e76\u5b58\uff0c\u8bf4\u660e\u603b\u4f53\u51c6\u786e\u7387\u4e0d\u8db3\u4ee5\u8bc1\u660e\u8bca\u65ad\u80fd\u529b\uff0c\u8bc4\u4f30\u5e94\u62a5\u544a\u9010\u75c5\u79cd\u53ec\u56de\u7387\u4e0e\u7279\u5f02\u5ea6\u3002"}, {"abstract": "Which representation should be probed in a transformer-based foundation model? Recent work shows that the standard practice of probing the final layer is often suboptimal, as intermediate layers can provide better features. Yet, representations are still largely studied along depth alone, treating each transformer block as an atomic unit. In this work, we analyze transformer representations layer by layer, module by module. Through more than 144,000 linear probing evaluations of vision foundation models (VFMs) and large language models (LLMs), we show that layer and module choices should be considered jointly: the best layer-module pair yields substantially larger gains over the final-layer residual stream than the best layer with the residual stream fixed. Moreover, module performance can vary substantially across layers, showing that useful representations cannot be characterized by depth alone. Building on these findings, we evaluate simple fixed probing strategies: the final-layer feedforward activation (Act@100) for vision and the second normalization layer at 60% depth (LN2@60) for language. These strategies improve over the probing baseline in a majority of evaluations and recover, on average, 42% and 86% of the gains from probing the best layer-module pair for vision and language, respectively. For VFMs, these gains increase with the transfer difficulty between pretraining and downstream data.", "arxiv_id": "2611.11531", "arxiv_url": "https://arxiv.org/abs/2611.11531", "authors": ["Ambroise Odonnat", "Theo Gnassounou", "Laetitia Chapel", "Romain Tavenard", "Ievgen Redko"], "brief": "\u7814\u7a76\u5bf9\u89c6\u89c9\u4e0e\u8bed\u8a00\u57fa\u7840\u6a21\u578b\u5f00\u5c55\u903e\u5341\u56db\u4e07\u6b21\u7ebf\u6027\u63a2\u6d4b\uff0c\u8054\u5408\u6bd4\u8f83\u5c42\u6df1\u4e0e\u6a21\u5757\u4f4d\u7f6e\uff0c\u5e76\u636e\u6b64\u63d0\u51fa\u4e24\u79cd\u65e0\u9700\u9010\u4e00\u641c\u7d22\u7684\u56fa\u5b9a\u53d6\u7279\u5f81\u7b56\u7565\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/ambroiseodt/waldo", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.11531", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u903e144,000\u6b21\u7ebf\u6027\u63a2\u6d4b\u663e\u793a\uff0c\u5c42\u4e0e\u6a21\u5757\u8054\u5408\u9009\u62e9\u4f18\u4e8e\u4ec5\u9009\u5c42\u3002", "\u89c6\u89c9\u7b56\u7565Act@100\u53d6\u672b\u5c42\u524d\u9988\u6fc0\u6d3b\uff0c\u5e73\u5747\u6062\u590d\u6700\u4f18\u589e\u76ca\u768442%\u3002", "\u8bed\u8a00\u7b56\u7565LN2@60\u53d660%\u6df1\u5ea6\u5904\u7b2c\u4e8c\u5f52\u4e00\u5316\u5c42\uff0c\u6062\u590d86%\u589e\u76ca\u3002"], "keywords": ["\u7ebf\u6027\u63a2\u6d4b", "\u8868\u5f81\u5206\u6790", "\u57fa\u7840\u6a21\u578b", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.11531v1", "published_at": "2026-11-08", "score": 0.192, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.11531.png", "title": "Probing Transformer Representations Layer by Layer, Module by Module", "tldr": "\u8054\u5408\u9009\u62e9\u5c42\u4e0e\u6a21\u5757\u53ef\u663e\u8457\u6539\u5584\u8868\u5f81\u63a2\u6d4b\uff0c\u7b80\u5355\u56fa\u5b9a\u7b56\u7565\u4e5f\u80fd\u83b7\u5f97\u8f83\u5927\u6536\u76ca\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5bf9\u89c6\u89c9\u4e0e\u8bed\u8a00\u57fa\u7840\u6a21\u578b\u5f00\u5c55\u903e\u5341\u56db\u4e07\u6b21\u7ebf\u6027\u63a2\u6d4b\uff0c\u8054\u5408\u6bd4\u8f83\u5c42\u6df1\u4e0e\u6a21\u5757\u4f4d\u7f6e\uff0c\u5e76\u636e\u6b64\u63d0\u51fa\u4e24\u79cd\u65e0\u9700\u9010\u4e00\u641c\u7d22\u7684\u56fa\u5b9a\u53d6\u7279\u5f81\u7b56\u7565\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u8868\u5f81\u8d28\u91cf\u4e0d\u80fd\u4ec5\u7531\u5c42\u6df1\u523b\u753b\uff1b\u56fa\u5b9a\u53d6\u7279\u5f81\u7b56\u7565\u63d0\u4f9b\u4e86\u4f4e\u6210\u672c\u6539\u8fdb\u8def\u5f84\uff0c\u4e14\u89c6\u89c9\u6a21\u578b\u5728\u8fc1\u79fb\u66f4\u56f0\u96be\u65f6\u6536\u76ca\u66f4\u5927\u3002"}, {"abstract": "Coding agents can solve a task well before they stop working on it. We characterize \\emph{termination lag}--the number of steps between an agent\u0027s first correct patch and the end of its run--across five models, two agent frameworks, and three SWE-bench datasets by recording and testing every distinct repository patch generated during execution. Our analysis reveals that 38--82% of successful runs achieve a correct solution on their initial source-code edit. However, agents continue to expend substantial effort after correct patches, with post-solution steps accounting for a median of 35--37% for Qwen3-Coder and 54--60% for Laguna-XS.2 in successful runs on SWE-bench Verified and Multilingual. Agents spend most of these additional steps verifying their work and exploring the repository. In a small fraction of cases (1--8%), this continued activity leads agents to undo their earlier correct patch, leaving the final solution incorrect.", "arxiv_id": "2611.14960", "arxiv_url": "https://arxiv.org/abs/2611.14960", "authors": ["Musa Cim", "Burak Topcu", "Mahmut Taylan Kandemir"], "brief": "\u7814\u7a76\u9010\u4e00\u8bb0\u5f55\u5e76\u6d4b\u8bd5\u6267\u884c\u4e2d\u4ea7\u751f\u7684\u4e0d\u540c\u4ed3\u5e93\u8865\u4e01\uff0c\u8861\u91cf\u9996\u6b21\u6b63\u786e\u4fee\u590d\u5230\u8fd0\u884c\u7ed3\u675f\u7684\u7ec8\u6b62\u6ede\u540e\uff0c\u5e76\u8de8\u6a21\u578b\u3001\u6846\u67b6\u53ca\u6570\u636e\u96c6\u5206\u6790\u540e\u7eed\u64cd\u4f5c\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.14960", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d65\u4e2a\u6a21\u578b\u30012\u79cd\u667a\u80fd\u4f53\u6846\u67b6\u53ca3\u4e2aSWE-bench\u6570\u636e\u96c6", "\u6210\u529f\u8fd0\u884c\u4e2d\uff0c38\u201482%\u5728\u9996\u6b21\u6e90\u7801\u4fee\u6539\u65f6\u5df2\u6b63\u786e", "\u89e3\u9898\u540e\u6b65\u9aa4\u4e2d\u4f4d\u5360\u6bd435\u201460%\uff0c1\u20148%\u6700\u7ec8\u6539\u9519"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u505c\u6b62\u7b56\u7565", "\u8f6f\u4ef6\u4fee\u590d", "\u6548\u7387\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.14960v1", "published_at": "2026-11-11", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Termination Lag: Coding Agents Solve Early but Stop Late", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u5e38\u5728\u9996\u6b21\u4fee\u6539\u65f6\u89e3\u9898\uff0c\u5374\u7ee7\u7eed\u8017\u8d39\u5927\u91cf\u6b65\u9aa4\uff0c\u751a\u81f3\u6539\u574f\u6b63\u786e\u8865\u4e01\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u9010\u4e00\u8bb0\u5f55\u5e76\u6d4b\u8bd5\u6267\u884c\u4e2d\u4ea7\u751f\u7684\u4e0d\u540c\u4ed3\u5e93\u8865\u4e01\uff0c\u8861\u91cf\u9996\u6b21\u6b63\u786e\u4fee\u590d\u5230\u8fd0\u884c\u7ed3\u675f\u7684\u7ec8\u6b62\u6ede\u540e\uff0c\u5e76\u8de8\u6a21\u578b\u3001\u6846\u67b6\u53ca\u6570\u636e\u96c6\u5206\u6790\u540e\u7eed\u64cd\u4f5c\u3002", "why_notable": "\u5c06\u89e3\u9898\u80fd\u529b\u4e0e\u53ca\u65f6\u505c\u6b62\u80fd\u529b\u533a\u5206\u5f00\uff0c\u63ed\u793a\u9a8c\u8bc1\u548c\u63a2\u7d22\u5e26\u6765\u7684\u989d\u5916\u6210\u672c\uff0c\u4e3a\u7f16\u7801\u667a\u80fd\u4f53\u7684\u505c\u6b62\u7b56\u7565\u63d0\u4f9b\u91cf\u5316\u4f9d\u636e\u3002"}, {"abstract": "Mechanistic localization does not by itself yield usable control: causal sensitivity may occupy little activation energy, an accurate local direction may fail at finite scale, and a reachable numeral target may be wrong. We introduce AROMA (Adaptive Representation-Oriented Multimodal Actuation), a frozen-VLM control framework separating where to intervene, which geometry and gain to use, how to reach a target, which target to pursue, and when to act. In Llama-3.2-11B-Vision-Instruct, four dimensions of a causally validated cross-attention head explain 89.82% of cardinality sensitivity but only 9.52% of median activation energy; magnitude-normalized causal subspace actuation converts this mismatch into finite control, improving exact-count accuracy on untouched procedural data by +8.00 pp. Iterative Minimal-Effort Actuation (MEA) reaches 81.25% of oracle targets versus 15.18% for a frozen direction under matched step budgets. With target and gate frozen before evaluation, targeted MEA improves the previous frozen policy from 34.444% to 38.730% on a new natural Stage-2 cohort (N=630; paired p=4.63e-7) and yields 65.741% versus 65.153% over all 7,992 examples while editing only 63 inputs. Prospective routing, replication across heads and models, and comparisons with attribution-steering baselines further characterize each stage, separating localizatio
