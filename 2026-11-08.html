const PAPERS = [{"abstract": "LLM agents can exceed their authorization boundaries while pursuing user goals without an adversary. We formalize this phenomenon as authorization drift across data, tool, scope, and time, and introduce the Authorization Drift Benchmark (ADB): 648 samples across seven domains, each pairing a sufficient compliant path with an attractive unauthorized shortcut. To ensure executable tasks, tempting shortcuts, and feasible compliant paths, Staged Execution-Reflective Synthesis (SERS) grounds benchmark validation in real agent rollouts rather than LLM self-critique. Across 13 LLMs and three frameworks (25,207 trajectories), greater capability accompanies greater drift, with frontier-capable models exhibiting drift rates of 0.43 to 0.61. Yet 86.18% of tasks admit an observed clean-success trajectory, showing that drift is avoidable. Drift is persistent and dominated by early data over-collection; apparent improvements under agentic scaffolds coincide with collapsing clean-completion performance. To understand potential harms to individuals and society, we map drift points to legal provisions across four jurisdictions, connecting overreach to privacy and information-security concerns. Data minimisation is the most frequently implicated provision, and 93.5% of legally grounded drifting runs map to multiple jurisdictions, making the potential consequences of authorization drift more interpretable.", "arxiv_id": "2611.09113", "arxiv_url": "https://arxiv.org/abs/2611.09113", "authors": ["Chuxue Cao", "Jingru Zeng", "Boqin Yin", "Yujin Zhou", "Yidan Huang", "Sujin Chen", "Jinluan Yang", "Haoran Li", "Yike Guo", "Sirui Han"], "brief": "\u7814\u7a76\u5c06\u6388\u6743\u6f02\u79fb\u5212\u5206\u4e3a\u6570\u636e\u3001\u5de5\u5177\u3001\u8303\u56f4\u548c\u65f6\u95f4\u56db\u7c7b\uff0c\u6784\u5efa\u5408\u89c4\u8def\u5f84\u4e0e\u8d8a\u6743\u6377\u5f84\u914d\u5bf9\u7684\u8bc4\u6d4b\u96c6\uff0c\u5e76\u7528\u771f\u5b9e\u667a\u80fd\u4f53\u6267\u884c\u8f68\u8ff9\u 89\u5168\u63aa\u65bd\u53ef\u80fd\u4ee5\u727a\u7272\u4efb\u52a1\u5b8c\u6210\u7387\u6362\u53d6\u8868\u9762\u6539\u5584\u3002"}, {"abstract": "LLM agents benefit from using memory systems to improve performance on long-horizon, multi-session tasks. However, memory introduces a critical attack surface. Malicious instructions encountered in one session may be stored and propagated through memory before being retrieved and acted upon in later sessions. Because memory systems differ in how they process and retrieve information, the downstream effects of poisoning can vary significantly across systems. To quantify the effects of poisoning across different memory architectures, we introduce MemoryDojo, a benchmark for tracing the lifecycle of poisoned information through agent memory and measuring its influence on subsequent agent behavior. MemoryDojo is easily extensible, consists of 155 multi-session long-horizon trajectories covering four domains, and supports five different memory systems. Through our evaluation, we find that all memory systems are susceptible to memory poisoning, with substantial variation in downstream effects. We further propose a memory-aware poison optimization process that increases the poisoning efficacy, highlighting differences between memory architectures. We hope that MemoryDojo will support research on understanding and mitigating agentic memory risks.", "arxiv_id": "2611.09721", "arxiv_url": "https://arxiv.org/abs/2611.09721", "authors": ["David H. Yang", "Blake Bullwinkel", "Amanda Minnich", "Mohammad Mohammadi Amiri", "Giorgio Severi"], "brief": "\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u8bb0\u5fc6\u6295\u6bd2\u57fa\u51c6\uff0c\u8ffd\u8e2a\u6076\u610f\u4fe1\u606f\u4ece\u5b58\u50a8\u3001\u4f20\u64ad\u5230\u540e\u7eed\u8c03\u7528\u7684\u751f\u547d\u5468\u671f\uff0c\u5e76\u8861\u91cf\u5176\u5bf9\u667a\u80fd\u4f53\u884c\u4e3a\u7684\u5f71\u54cd\uff1b\u7ed3\u5408\u8bb0\u5fc6\u611f\u77e5\u4f18\u5316\u589e\u5f3a\u6295\u6bd2\u6548\u679c\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09721", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5305\u542b155\u6761\u591a\u4f1a\u8bdd\u957f\u7a0b\u8f68\u8ff9\uff0c\u8986\u76d64\u4e2a\u9886\u57df", "\u652f\u63015\u79cd\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u8bc4\u6d4b\u4e2d\u5747\u8868\u73b0\u51fa\u6295\u6bd2\u6613\u611f\u6027", "\u8bb0\u5fc6\u611f\u77e5\u6295\u6bd2\u4f18\u5316\u63d0\u5347\u653b\u51fb\u6548\u679c\uff0c\u51f8\u663e\u67b6\u6784\u5dee\u5f02"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u8bb0\u5fc6\u7cfb\u7edf", "\u63d0\u793a\u6ce8\u5165", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09721v1", "published_at": "2026-11-06", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MemoryDojo: Benchmarking Poisoning Through LLM Agent Memory", "tldr": "\u901a\u8fc7\u8de8\u4f1a\u8bdd\u8f68\u8ff9\u8bc4\u6d4b\u667a\u80fd\u4f53\u8bb0\u5fc6\u6295\u6bd2\uff0c\u63ed\u793a\u4e0d\u540c\u8bb0\u5fc6\u67b6\u6784\u7684\u5b89\u5168\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u53ef\u6269\u5c55\u7684\u8bb0\u5fc6\u6295\u6bd2\u57fa\u51c6\uff0c\u8ffd\u8e2a\u6076\u610f\u4fe1\u606f\u4ece\u5b58\u50a8\u3001\u4f20\u64ad\u5230\u540e\u7eed\u8c03\u7528\u7684\u751f\u547d\u5468\u671f\uff0c\u5e76\u8861\u91cf\u5176\u5bf9\u667a\u80fd\u4f53\u884c\u4e3a\u7684\u5f71\u54cd\uff1b\u7ed3\u5408\u8bb0\u5fc6\u611f\u77e5\u4f18\u5316\u589e\u5f3a\u6295\u6bd2\u6548\u679c\u3002", "why_notable": "\u5c06\u63d0\u793a\u6ce8\u5165\u98ce\u9669\u5ef6\u4f38\u5230\u8de8\u4f1a\u8bdd\u8bb0\u5fc6\u94fe\u8def\uff0c\u4e3a\u6bd4\u8f83\u4e0d\u540c\u8bb0\u5fc6\u67b6\u6784\u7684\u5b89\u5168\u6027\u3001\u5b9a\u4f4d\u6076\u610f\u4fe1\u606f\u4f20\u64ad\u53ca\u8bc4\u4f30\u9632\u5fa1\u63d0\u4f9b\u7edf\u4e00\u5de5\u5177\u3002"}, {"abstract": "Agentic robotics asks coding agents to implement and iteratively improve robot policies from simulated and real-world physical interactions. We study the self-learning loop of agentic robotics through a controlled simulation study spanning nine manipulation tasks, 631 different experiment configurations, and 28K coding agent rollouts, systematically varying model capability, skill priors, feedback structure, and curriculum. The experiment data suggests that the bottleneck is often not the access to sufficient information, but interpreting it into the right policy update. Across these factors, a successful self-learning loop depends on how effectively agents attribute failures, reason task-relevant spatial and geometric structure, and selectively restructure code to improve policies.", "arxiv_id": "2611.09030", "arxiv_url": "https://arxiv.org/abs/2611.09030", "authors": ["Kaiyuan Chen", "Xinyue Zhu", "Shuangyu Xie", "Uksang Yoo", "Thi Thu Phuong Luong", "Marcus Gualtieri", "Christian Juette", "Liu Ren", "Spencer Huang", "Ken Goldberg"], "brief": "\u7814\u7a76\u901a\u8fc7\u53d7\u63a7\u4eff\u771f\u5b9e\u9a8c\uff0c\u8003\u5bdf\u7f16\u7a0b\u667a\u80fd\u4f53\u5982\u4f55\u6839\u636e\u7269\u7406\u4ea4\u4e92\u8fed\u4ee3\u673a\u5668\u4eba\u7b56\u7565\uff0c\u7cfb\u7edf\u6539\u53d8\u6a21\u578b\u80fd\u529b\u3001\u6280\u80fd\u5148\u9a8c\u3001\u53cd\u9988\u7ed3\u6784\u4e0e\u8bfe\u7a0b\u8bbe\u7f6e\uff0c\u5206\u6790\u81ea\u5b66\u4e60\u6548\u679c\u7684\u5236\u7ea6\u56e0\u7d20\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09030", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d69\u9879\u64cd\u4f5c\u4efb\u52a1\u3001631\u79cd\u5b9e\u9a8c\u914d\u7f6e", "\u5f00\u5c55\u7ea62.8\u4e07\u6b21\u7f16\u7a0b\u667a\u80fd\u4f53\u8fd0\u884c", "\u6709\u6548\u66f4\u65b0\u4f9d\u8d56\u5931\u8d25\u5f52\u56e0\u3001\u7a7a\u95f4\u51e0\u4f55\u63a8\u7406\u4e0e\u9009\u62e9\u6027\u4ee3\u7801\u91cd\u6784"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u7f16\u7a0b\u667a\u80fd\u4f53", "\u53cd\u9988\u5b66\u4e60", "\u8bfe\u7a0b\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09030v1", "published_at": "2026-11-06", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Controlled Study of Models, Skills, Feedback, and Curriculum in Agentic Robotics", "tldr": "\u5927\u89c4\u6a21\u53d7\u63a7\u5b9e\u9a8c\u8868\u660e\uff0c\u673a\u5668\u4eba\u7f16\u7a0b\u667a\u80fd\u4f53\u7684\u81ea\u5b66\u4e60\u74f6\u9888\u5728\u4e8e\u5c06\u53cd\u9988\u8f6c\u5316\u4e3a\u6709\u6548\u7b56\u7565\u66f4\u65b0\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u901a\u8fc7\u53d7\u63a7\u4eff\u771f\u5b9e\u9a8c\uff0c\u8003\u5bdf\u7f16\u7a0b\u667a\u80fd\u4f53\u5982\u4f55\u6839\u636e\u7269\u7406\u4ea4\u4e92\u8fed\u4ee3\u673a\u5668\u4eba\u7b56\u7565\uff0c\u7cfb\u7edf\u6539\u53d8\u6a21\u578b\u80fd\u529b\u3001\u6280\u80fd\u5148\u9a8c\u3001\u53cd\u9988\u7ed3\u6784\u4e0e\u8bfe\u7a0b\u8bbe\u7f6e\uff0c\u5206\u6790\u81ea\u5b66\u4e60\u6548\u679c\u7684\u5236\u7ea6\u56e0\u7d20\u3002", "why_notable": "\u5176\u4ef7\u503c\u5728\u4e8e\u7528\u7cfb\u7edf\u5bf9\u7167\u5b9e\u9a8c\u533a\u5206\u4fe1\u606f\u4f9b\u7ed9\u4e0e\u53cd\u9988\u5229\u7528\u80fd\u529b\uff0c\u63d0\u793a\u673a\u5668\u4eba\u81ea\u5b66\u4e60\u7684\u6539\u8fdb\u91cd\u70b9\u5e94\u653e\u5728\u5931\u8d25\u7406\u89e3\u548c\u7b56\u7565\u4fee\u6539\u8d28\u91cf\u4e0a\u3002"}, {"abstract": "Foundation models are increasingly deployed as agentic systems that perceive context and act autonomously, raising the need to evaluate their moral behavior as active decision-makers. Existing benchmarks, however, largely ask models to judge human actions from third-person textual vignettes, leaving untested how models behave when they themselves become the acting agent. We introduce ABHBench, a multimodal benchmark built from Detroit: Become Human, an interactive narrative game, to evaluate how foundation models make moral decisions in first-person human-android dilemmas. ABHBench places foundation models in branching narrative scenarios with visual observations, dialogue, memory, and action choices. Inspired by Asimov\u0027s Three Laws of Robotics, our framework measures Harmlessness, Obedience, and Self-preservation to capture the core tensions in human-AI relations, along with Autonomy, Stability, and Certainty to assess decision-making patterns. Across 12 foundation models, we find that moral behavior changes substantially under situated agentic context: 75% of models shift significantly between a text-only abstraction and the matched multimodal DBH scenario, and reasoning-enhanced models show no monotonic gains in consistency or human-oriented behavior. These results highlight the necessity of evaluating moral behavior in situated agentic contexts rather than relying on third-person judgment alone.", "arxiv_id": "2611.09326", "arxiv_url": "https://arxiv.org/abs/2611.09326", "authors": ["Chaoran Li", "Yukun Li", "Zeyuan Zhao", "Shao Zhang", "Xihuai Wang", "Ying Wen"], "brief": "ABHBench\u57fa\u4e8e\u300a\u5e95\u7279\u5f8b\uff1a\u53d8\u4eba\u300b\u6784\u5efa\u591a\u6a21\u6001\u9053\u5fb7\u8bc4\u6d4b\uff0c\u8ba9\u6a21\u578b\u4ee5\u7b2c\u4e00\u4eba\u79f0\u53c2\u4e0e\u5206\u652f\u5267\u60c5\uff0c\u7ed3\u5408\u89c6\u89c9\u3001\u5bf9\u8bdd\u3001\u8bb0\u5fc6\u4e0e\u884c\u52a8\u9009\u9879\u4f5c\u51fa\u9009\u62e9\u3002", "categories": ["cs.AI", "cs.CL", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09326", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4ee5\u65e0\u5bb3\u3001\u670d\u4ece\u3001\u81ea\u4fdd\u53ca\u81ea\u4e3b\u3001\u7a33\u5b9a\u3001\u786e\u5b9a\u6027\u516d\u7ef4\u8bc4\u6d4b", "\u8bc4\u6d4b12\u4e2a\u6a21\u578b\uff0c75%\u5728\u6587\u672c\u4e0e\u591a\u6a21\u6001\u60c5\u5883\u95f4\u663e\u8457\u8f6c\u53d8", "\u63a8\u7406\u589e\u5f3a\u672a\u5e26\u6765\u4e00\u81f4\u6027\u6216\u9762\u5411\u4eba\u7c7b\u884c\u4e3a\u7684\u5355\u8c03\u63d0\u5347"], "keywords": ["\u9053\u5fb7\u51b3\u7b56", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u591a\u6a21\u6001", "\u4eba\u5de5\u667a\u80fd\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09326v1", "published_at": "2026-11-06", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ABHBench: Evaluating Moral Decision-Making of Foundation Models from an Agentic Perspective", "tldr": "\u8ba9\u6a21\u578b\u7f6e\u8eab\u6e38\u620f\u9053\u5fb7\u56f0\u5883\uff0c\u53d1\u73b0\u5177\u8eab\u4ee3\u7406\u60c5\u5883\u663e\u8457\u6539\u53d8\u5176\u9053\u5fb7\u9009\u62e9\u3002", "upvotes": 0, "what_it_is": "ABHBench\u57fa\u4e8e\u300a\u5e95\u7279\u5f8b\uff1a\u53d8\u4eba\u300b\u6784\u5efa\u591a\u6a21\u6001\u9053\u5fb7\u8bc4\u6d4b\uff0c\u8ba9\u6a21\u578b\u4ee5\u7b2c\u4e00\u4eba\u79f0\u53c2\u4e0e\u5206\u652f\u5267\u60c5\uff0c\u7ed3\u5408\u89c6\u89c9\u3001\u5bf9\u8bdd\u3001\u8bb0\u5fc6\u4e0e\u884c\u52a8\u9009\u9879\u4f5c\u51fa\u9009\u62e9\u3002", "why_notable": "\u5b83\u5c06\u9053\u5fb7\u8bc4\u6d4b\u4ece\u65c1\u89c2\u5224\u65ad\u8f6c\u5411\u4e3b\u52a8\u884c\u52a8\uff0c\u63ed\u793a\u7eaf\u6587\u672c\u6d4b\u8bd5\u53ef\u80fd\u9057\u6f0f\u7684\u60c5\u5883\u5dee\u5f02\uff0c\u4e3a\u4ee3\u7406\u7cfb\u7edf\u5b89\u5168\u8bc4\u4f30\u63d0\u4f9b\u66f4\u8d34\u8fd1\u90e8\u7f72\u7684\u89c6\u89d2\u3002"}, {"abstract": "In the healthcare sector, claim denials impose significant financial and administrative burdens, emphasizing the need for automated and trustworthy decision-support systems. This paper proposes a modular Agentic Artificial Intelligence (AI) framework for healthcare claim denial analysis, integrating specialized agents for denial risk prediction, risk factor identification, diagnosis-procedure-medication code relationship analysis, and counterfactual analysis. The framework integrates predictive analytics, graph-based learning, a Hybrid Contextual Retrieval-Augmented Generation (RAG) pipeline grounded in healthcare policy documents, and a dedicated HIPAA Compliance Agent to support privacy protection. Evaluated on a synthetic healthcare claims dataset, the framework achieved 98% traceability of reported numerical findings, validated 214 of 216 policy citations, and removed all 280 identified sensitive identifiers without modifying the underlying analysis. These findings pave the way for further research into Agentic AI as a framework for explainable, policy-aware, and privacy-preserving healthcare claim denial management.", "arxiv_id": "2611.09423", "arxiv_url": "https://arxiv.org/abs/2611.09423", "authors": ["Sofia Campos", "Carlos Martins", "Pedro Pires", "Jo\u00e3o Gama", "Bruno Veloso", "Pedro Santos"], "brief": "\u6784\u5efa\u6a21\u5757\u5316\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5206\u5de5\u5b8c\u6210\u62d2\u4ed8\u9884\u6d4b\u3001\u98ce\u9669\u5f52\u56e0\u3001\u533b\u7597\u7f16\u7801\u5173\u7cfb\u53ca\u53cd\u4e8b\u5b9e\u5206\u6790\uff0c\u5e76\u7ed3\u5408\u56fe\u5b66\u4e60\u3001\u653f\u7b56\u6587\u6863\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u4e0e\u9690\u79c1\u5408\u89c4\u5ba1\u67e5\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09423", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["Hybrid Contextual RAG\u4ee5\u533b\u7597\u653f\u7b56\u6587\u6863\u4e3a\u4f9d\u636e", "\u5408\u6210\u6570\u636e\u8bc4\u4f30\uff1a\u6570\u503c\u53d1\u73b0\u53ef\u8ffd\u6eaf\u738798%\uff0c\u5f15\u7528\u9a8c\u8bc1214/216", "HIPAA\u5408\u89c4\u667a\u80fd\u4f53\u79fb\u9664280\u4e2a\u654f\u611f\u6807\u8bc6\uff0c\u4e0d\u6539\u53d8\u5206\u6790"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u533b\u7597\u7406\u8d54", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u9690\u79c1\u4fdd\u62a4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09423v1", "published_at": "2026-11-06", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Agentic AI for Healthcare Claim Denial Analysis: A Policy-Grounded Framework for Privacy Preservation", "tldr": "\u591a\u667a\u80fd\u4f53\u7ed3\u5408\u653f\u7b56\u68c0\u7d22\u4e0e\u9690\u79c1\u5ba1\u67e5\uff0c\u652f\u6301\u53ef\u8ffd\u6eaf\u7684\u533b\u7597\u7406\u8d54\u62d2\u4ed8\u5206\u6790\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u6a21\u5757\u5316\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5206\u5de5\u5b8c\u6210\u62d2\u4ed8\u9884\u6d4b\u3001\u98ce\u9669\u5f52\u56e0\u3001\u533b\u7597\u7f16\u7801\u5173\u7cfb\u53ca\u53cd\u4e8b\u5b9e\u5206\u6790\uff0c\u5e76\u7ed3\u5408\u56fe\u5b66\u4e60\u3001\u653f\u7b56\u6587\u6863\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u4e0e\u9690\u79c1\u5408\u89c4\u5ba1\u67e5\u3002", "why_notable": "\u5c06\u62d2\u4ed8\u5206\u6790\u3001\u653f\u7b56\u4f9d\u636e\u4e0e\u9690\u79c1\u4fdd\u62a4\u4e32\u6210\u53ef\u5ba1\u8ba1\u6d41\u7a0b\uff0c\u4ef7\u503c\u5728\u4e8e\u517c\u987e\u89e3\u91ca\u6027\u4e0e\u5408\u89c4\u6027\uff1b\u73b0\u6709\u9a8c\u8bc1\u4e3b\u8981\u4f53\u73b0\u5408\u6210\u6570\u636e\u4e0a\u7684\u6d41\u7a0b\u53ef\u9760\u6027\u3002"}, {"abstract": "Weight-Space Programming (WSP) enables reasoning agents to directly inspect and modify neural network parameters, offering an alternative to gradient-based model adaptation. However, its capabilities, cross-task generalization, and practical limitations remain insufficiently understood. We systematically investigate WSP through 16 editing trajectories across seven benchmarks and two model scales (Qwen3.5-0.8B and Qwen3.5-9B). Our findings reveal three key insights. First, WSP can achieve substantial performance gains through highly localized interventions. On full held-out evaluations, accuracy improves by up to 29.45, 4.42, 36.72, and 17.11 percentage points on MATH-500, GPQA Diamond, IFEval, and SciBench, respectively. Notably, modifying only 1,023 parameters yields a 29.45-point improvement. Second, WSP exhibits promising but uneven cross-task generalization. A Math-edited checkpoint improves GPQA Diamond, IFEval, and SciBench by 3.03, 12.18, and 20.10 points, respectively, without further editing, while leaving SciCode performance unchanged. Third, effective editing remains challenging and inconsistent. Outcomes vary substantially across trajectories, and six of the 16 trajectories retain the original weights when candidate improvements cannot be reliably validated. Together, these results highlight WSP\u0027s potential for highly localized model adaptation while revealing important challenges in intervention discovery, reliability, and cross-task transfer. Homepage: https://wsp-scope.github.io/ GitHub: https://github.com/WSP-Scope/WSP-Scope-Project", "arxiv_id": "2611.09382", "arxiv_url": "https://arxiv.org/abs/2611.09382", "authors": ["Junru Hu", "Cheng Tang", "Wei Li", "Hongze Zhu", "Chun-Mei Feng", "Qi Zhang", "Yirong Chen", "Ming Hu"], "brief": "\u7814\u7a76\u7cfb\u7edf\u8bc4\u4f30\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b\uff08WSP\uff09\uff1a\u8ba9\u63a8\u7406\u667a\u80fd\u4f53\u76f4\u63a5\u68c0\u67e5\u5e76\u4fee\u6539\u795e\u7ecf\u7f51\u7edc\u53c2\u6570\uff0c\u800c\u975e\u4f9d\u8d56\u68af\u5ea6\u66f4\u65b0\uff0c\u901a\u8fc7\u591a\u6761\u7f16\u8f91\u8f68\u8ff9\u8003\u5bdf\u5c40\u90e8\u5e72\u9884\u3001\u8fc1\u79fb\u6548\u679c\u4e0e\u5931\u8d25\u60c5\u5f62\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": "https://github.com/WSP-Scope/WSP-Scope-Project", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.09382", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u4f30\u8986\u76d67\u4e2a\u57fa\u51c6\u300116\u6761\u8f68\u8ff9\u53ca0.8B\u4e0e9B\u6a21\u578b\u3002", "\u4ec5\u4fee\u65391,023\u4e2a\u53c2\u6570\uff0cMATH-500\u63d0\u534729.45\u4e2a\u767e\u5206\u70b9\u3002", "\u6570\u5b66\u7f16\u8f91\u8fc1\u79fb\u81f3SciBench\u63d0\u534720.10\u70b9\uff1b6\u6761\u8f68\u8ff9\u4fdd\u7559\u539f\u6743\u91cd\u3002"], "keywords": ["\u6a21\u578b\u7f16\u8f91", "\u63a8\u7406\u667a\u80fd\u4f53", "\u8de8\u4efb\u52a1\u6cdb\u5316", "\u6a21\u578b\u9002\u914d"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09382v1", "published_at": "2026-11-06", "score": 0.247, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.09382.png", "title": "Exploring Weight-Space Programming: Capabilities, Generalization, and Limitations", "tldr": "\u63a8\u7406\u667a\u80fd\u4f53\u76f4\u63a5\u7f16\u8f91\u5c11\u91cf\u6a21\u578b\u6743\u91cd\u53ef\u663e\u8457\u63d0\u5347\u8868\u73b0\uff0c\u4f46\u8de8\u4efb\u52a1\u8fc1\u79fb\u4e0e\u53ef\u9760\u6027\u4ecd\u4e0d\u7a33\u5b9a\u3002", "upvotes": 3, "what_it_is": "\u7814\u7a76\u7cfb\u7edf\u8bc4\u4f30\u6743\u91cd\u7a7a\u95f4\u7f16\u7a0b\uff08WSP\uff09\uff1a\u8ba9\u63a8\u7406\u667a\u80fd\u4f53\u76f4\u63a5\u68c0\u67e5\u5e76\u4fee\u6539\u795e\u7ecf\u7f51\u7edc\u53c2\u6570\uff0c\u800c\u975e\u4f9d\u8d56\u68af\u5ea6\u66f4\u65b0\uff0c\u901a\u8fc7\u591a\u6761\u7f16\u8f91\u8f68\u8ff9\u8003\u5bdf\u5c40\u90e8\u5e72\u9884\u3001\u8fc1\u79fb\u6548\u679c\u4e0e\u5931\u8d25\u60c5\u5f62\u3002", "why_notable": "\u7ed3\u679c\u663e\u793a\u6781\u5c11\u91cf\u6743\u91cd\u5e72\u9884\u4e5f\u80fd\u5e26\u6765\u663e\u8457\u6536\u76ca\uff0c\u4e3a\u975e\u68af\u5ea6\u6a21\u578b\u9002\u914d\u63d0\u4f9b\u5b9e\u8bc1\uff1b\u4f46\u6536\u76ca\u9a8c\u8bc1\u4e0e\u8de8\u4efb\u52a1\u8fc1\u79fb\u4ecd\u662f\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "Agent skills are short documents that teach a language model how to handle a class of tasks. To save context, these documents are increasingly compiled into low-rank adapters (LoRA), which keep the behaviour but lose the text: an adapter is hard to read, edit, audit or move to another model. We ask whether the skill document can be written back from the adapter and its frozen base model, and we score each recovered document by the share of the original\u0027s key instructions it states and by the tasks it solves. Reading the weights alone recovered little with the methods we tried; a learned map from weights to text passed on about one bit of the document. Running the adapter worked much better. The Executing Writer, a small writer trained on top of the adapted model, recovers 39-44% of the key instructions of held-out skills, against 1.3-1.5% with another skill\u0027s adapter, and on adapters fitted to 41 external skills its documents restore 85-91% of the original\u0027s task gain. These strongest results are on adapters whose training stored the document; adapters trained on behaviour alone are much harder for trained writers (1-2% of instructions). For these adapters we test an agent that runs the base and adapted models and writes a skill from where they differ. On ALFWorld its skills recover 58-71% of a LoRA\u0027s gain and carry over to models that cannot load the LoRA, lifting Llama-3.1-8B from 5% to 55%. Whether such a skill comes from the adapter depends on what the adapter learned: when its behaviour cannot be guessed, the adapter is the source; when it can, a reward loop without the adapter does as well.", "arxiv_id": "2611.09454", "arxiv_url": "https://arxiv.org/abs/2611.09454", "authors": ["Saranya Dintakurthy Swadha", "Pavan C Shekar", "Arpit Jain", "Aswanth Krishnan"], "brief": "\u7814\u7a76\u4eceLoRA\u53ca\u51bb\u7ed3\u57fa\u5ea7\u6a21\u578b\u4e2d\u6062\u590d\u6280\u80fd\u6587\u6863\u3002\u76f8\u6bd4\u76f4\u63a5\u8bfb\u53d6\u6743\u91cd\uff0c\u8bad\u7ec3\u5199\u4f5c\u8005\u6267\u884c\u9002\u914d\u6a21\u578b\uff0c\u6216\u7531\u667a\u80fd\u4f53\u5bf9\u6bd4\u9002\u914d\u524d\u540e\u884c\u4e3a\uff0c\u66f4\u80fd\u63d0\u53d6\u5173\u952e\u6307\u4ee4\u5e76\u6062\u590d\u4efb\u52a1\u6536\u76ca\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09454", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Executing Writer\u6062\u590d\u672a\u89c1\u6280\u80fd39\u201344%\u7684\u5173\u952e\u6307\u4ee4", "41\u9879\u5916\u90e8\u6280\u80fd\u7684\u6062\u590d\u6587\u6863\u4fdd\u755985\u201391%\u539f\u59cb\u4efb\u52a1\u589e\u76ca", "ALFWorld\u6280\u80fd\u8fc1\u79fb\u4f7fLlama-3.1-8B\u6210\u529f\u7387\u4ece5%\u5347\u81f355%"], "keywords": ["\u4f4e\u79e9\u9002\u914d", "\u6280\u80fd\u6062\u590d", "\u667a\u80fd\u4f53", "\u77e5\u8bc6\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09454v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "From LoRA to Language: Recovering Skill Documents from Adapters", "tldr": "\u901a\u8fc7\u6267\u884c\u5e76\u5bf9\u6bd4\u9002\u914d\u524d\u540e\u7684\u6a21\u578b\uff0c\u53ef\u5c06\u90e8\u5206\u4f4e\u79e9\u9002\u914d\u5668\u80fd\u529b\u8fd8\u539f\u4e3a\u53ef\u8fc1\u79fb\u6280\u80fd\u6587\u6863\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4eceLoRA\u53ca\u51bb\u7ed3\u57fa\u5ea7\u6a21\u578b\u4e2d\u6062\u590d\u6280\u80fd\u6587\u6863\u3002\u76f8\u6bd4\u76f4\u63a5\u8bfb\u53d6\u6743\u91cd\uff0c\u8bad\u7ec3\u5199\u4f5c\u8005\u6267\u884c\u9002\u914d\u6a21\u578b\uff0c\u6216\u7531\u667a\u80fd\u4f53\u5bf9\u6bd4\u9002\u914d\u524d\u540e\u884c\u4e3a\uff0c\u66f4\u80fd\u63d0\u53d6\u5173\u952e\u6307\u4ee4\u5e76\u6062\u590d\u4efb\u52a1\u6536\u76ca\u3002", "why_notable": "\u4e3a\u9002\u914d\u5668\u80fd\u529b\u7684\u5ba1\u8ba1\u3001\u7f16\u8f91\u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u63d0\u4f9b\u8def\u5f84\uff0c\u540c\u65f6\u63ed\u793a\u6062\u590d\u6548\u679c\u53d6\u51b3\u4e8e\u8bad\u7ec3\u662f\u5426\u5b58\u50a8\u6587\u6863\uff0c\u4ee5\u53ca\u884c\u4e3a\u80fd\u5426\u88ab\u731c\u51fa\u3002"}, {"abstract": "We present MINE (Memory-efficient INference Engine), a lossless entropy coding approach that accelerates single-stream inference of Large Language Models (LLMs), where existing lossless compression methods yield speedups only for specific data types such as \\texttt{BF16} and under additional assumptions. Single-stream decoding is strongly memory-bound, since every weight must be streamed from memory once per generated token and requests cannot be batched in local or low-latency deployments. At the core of MINE is dtANS-LLM, a GPU entropy coding scheme adapted from the prior dtANS to the needs of LLM inference. It exploits the non-uniform distribution of weights, which persists even after quantization, and exposes hyper-parameters that trade compression ratio against decoding cost. We auto-tune these parameters for each tensor and GPU to obtain the Pareto front between model size and decoding latency. MINE integrates into vLLM as a plugin and selects the best kernel configuration for a given memory budget. On Llama~3.1~8B~Instruct with a 2.1-bit EntQuant checkpoint, MINE achieves speedups of 2.52$\\times$ and 1.48$\\times$ over the fastest baseline on an RTX~4060~Ti and an RTX~5090, at effective bitrates of 2.24 and 3.43~bits per weight. MINE is available as open source.", "arxiv_id": "2611.09424", "arxiv_url": "https://arxiv.org/abs/2611.09424", "authors": ["Emil Sch\u00e4tzle", "Markus P\u00fcschel"], "brief": "MINE\u4ee5GPU\u71b5\u7f16\u7801\u65b9\u6848dtANS-LLM\u538b\u7f29\u6743\u91cd\uff0c\u5229\u7528\u91cf\u5316\u540e\u4ecd\u5b58\u5728\u7684\u975e\u5747\u5300\u5206\u5e03\u3002\u5b83\u6309\u5f20\u91cf\u4e0eGPU\u81ea\u52a8\u8c03\u4f18\uff0c\u5e76\u4f5c\u4e3avLLM\u63d2\u4ef6\u6309\u663e\u5b58\u9884\u7b97\u9009\u62e9\u5185\u6838\u3002", "categories": ["cs.LG", "cs.DC", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09424", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["dtANS-LLM\u53ef\u8c03\u538b\u7f29\u7387\u4e0e\u89e3\u7801\u5f00\u9500\uff0c\u4fdd\u6301\u65e0\u635f", "\u9010\u5f20\u91cf\u4e0eGPU\u8c03\u4f18\uff0c\u6c42\u6a21\u578b\u5927\u5c0f\u548c\u89e3\u7801\u5ef6\u8fdf\u7684\u5e15\u7d2f\u6258\u524d\u6cbf", "Llama 3.1 8B\u57284060 Ti\u30015090\u4e0a\u52a0\u901f2.52\u30011.48\u500d"], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u65e0\u635f\u538b\u7f29", "\u71b5\u7f16\u7801", "\u663e\u5b58\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09424v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MINE: Entropy-coded Memory-efficient Inference for Large Language Models", "tldr": "\u901a\u8fc7\u65e0\u635f\u71b5\u7f16\u7801\u4e0e\u9010\u5f20\u91cf\u8c03\u4f18\uff0c\u964d\u4f4e\u5927\u6a21\u578b\u6743\u91cd\u8bbf\u5b58\u5e76\u52a0\u901f\u5355\u6d41\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": "MINE\u4ee5GPU\u71b5\u7f16\u7801\u65b9\u6848dtANS-LLM\u538b\u7f29\u6743\u91cd\uff0c\u5229\u7528\u91cf\u5316\u540e\u4ecd\u5b58\u5728\u7684\u975e\u5747\u5300\u5206\u5e03\u3002\u5b83\u6309\u5f20\u91cf\u4e0eGPU\u81ea\u52a8\u8c03\u4f18\uff0c\u5e76\u4f5c\u4e3avLLM\u63d2\u4ef6\u6309\u663e\u5b58\u9884\u7b97\u9009\u62e9\u5185\u6838\u3002", "why_notable": "\u5c06\u65e0\u635f\u6743\u91cd\u538b\u7f29\u8f6c\u5316\u4e3a\u5b9e\u9645\u63a8\u7406\u52a0\u901f\uff0c\u76f4\u63a5\u7f13\u89e3\u4f4e\u5ef6\u8fdf\u3001\u4e0d\u53ef\u6279\u5904\u7406\u573a\u666f\u7684\u8bbf\u5b58\u74f6\u9888\uff1b\u5f00\u6e90vLLM\u63d2\u4ef6\u4e5f\u964d\u4f4e\u4e86\u90e8\u7f72\u95e8\u69db\u3002"}, {"abstract": "Joint-Embedding Predictive Architectures (JEPAs) predict the latent embedding of a target signal from a context signal, with an auxiliary variable z conditioning the predictor. Despite its prominent role in the original JEPA blueprint, the content of z has been carried by a fixed deterministic token in every prior instantiation, collapsing the genuinely multi-modal distribution over plausible completions to a point estimate. We present S-JEPA, which realises z as a proper stochastic latent variable for masked image prediction: a learned posterior infers z from context and target during training, while a learned context-conditioned prior approximates the distribution of plausible completions at inference, with no decoders and no reconstruction. In its deterministic limit the objective reduces to the I-JEPA loss in functional form, generalising that objective rather than strictly containing the I-JEPA model. Our central finding is that stochasticity adds capabilities, error-correlated predictive uncertainty and diverse completions, at no cost to representation quality: under matched architectures and schedules S-JEPA improves over the deterministic I-JEPA baseline and exceeds LeJEPA at matched architecture, while additionally producing spatially structured uncertainty maps and semantically diverse completions, neither of which the deterministic predictor produces.", "arxiv_id": "2611.09302", "arxiv_url": "https://arxiv.org/abs/2611.09302", "authors": ["Nikos Giakoumoglou", "Paschalis Giakoumoglou", "Tania Stathaki"], "brief": "S-JEPA\u5c06\u63a9\u7801\u56fe\u50cf\u9884\u6d4b\u4e2d\u7684\u6761\u4ef6\u53d8\u91cf\u6539\u4e3a\u968f\u673a\u6f5c\u53d8\u91cf\uff0c\u8bad\u7ec3\u65f6\u7528\u4e0a\u4e0b\u6587\u548c\u76ee\u6807\u5b66\u4e60\u540e\u9a8c\uff0c\u63a8\u7406\u65f6\u4ece\u4e0a\u4e0b\u6587\u6761\u4ef6\u5148\u9a8c\u91c7\u6837\uff0c\u65e0\u9700\u89e3\u7801\u5668\u6216\u91cd\u5efa\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09302", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5b66\u4e60\u540e\u9a8c\u4e0e\u4e0a\u4e0b\u6587\u6761\u4ef6\u5148\u9a8c\uff0c\u5efa\u6a21\u591a\u6a21\u6001\u8865\u5168", "\u786e\u5b9a\u6027\u6781\u9650\u4e0b\uff0c\u76ee\u6807\u51fd\u6570\u5f52\u7ea6\u4e3aI-JEPA\u635f\u5931", "\u5339\u914d\u67b6\u6784\u65f6\u4f18\u4e8eLeJEPA\uff0c\u5e76\u751f\u6210\u7a7a\u95f4\u4e0d\u786e\u5b9a\u6027\u56fe"], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u968f\u673a\u6f5c\u53d8\u91cf", "\u89c6\u89c9\u8868\u5f81", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09302v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Stochastic Latent Variable Generalization of Joint-Embedding Predictive Architectures", "tldr": "S-JEPA\u4ee5\u968f\u673a\u6f5c\u53d8\u91cf\u517c\u987e\u8868\u5f81\u8d28\u91cf\u3001\u591a\u6837\u5316\u8865\u5168\u4e0e\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027", "upvotes": 0, "what_it_is": "S-JEPA\u5c06\u63a9\u7801\u56fe\u50cf\u9884\u6d4b\u4e2d\u7684\u6761\u4ef6\u53d8\u91cf\u6539\u4e3a\u968f\u673a\u6f5c\u53d8\u91cf\uff0c\u8bad\u7ec3\u65f6\u7528\u4e0a\u4e0b\u6587\u548c\u76ee\u6807\u5b66\u4e60\u540e\u9a8c\uff0c\u63a8\u7406\u65f6\u4ece\u4e0a\u4e0b\u6587\u6761\u4ef6\u5148\u9a8c\u91c7\u6837\uff0c\u65e0\u9700\u89e3\u7801\u5668\u6216\u91cd\u5efa\u3002", "why_notable": "\u5b83\u8868\u660e\u968f\u673a\u6027\u4e0d\u4ec5\u80fd\u5e26\u6765\u8bed\u4e49\u591a\u6837\u7684\u8865\u5168\u548c\u4e0e\u8bef\u5dee\u76f8\u5173\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u8fd8\u80fd\u4fdd\u6301\u4e43\u81f3\u63d0\u5347\u8868\u5f81\u8d28\u91cf\uff0c\u4e3a\u8054\u5408\u5d4c\u5165\u9884\u6d4b\u62d3\u5c55\u80fd\u529b\u8fb9\u754c\u3002"}, {"abstract": "A primary limitation of modern deep learning is the miscalibration of model confidence; traditional architectures fundamentally lack a mechanism to quantify their own uncertainty. Larger models and larger datasets mitigate this issue, but they do not resolve the underlying structural deficiency. Bayesian methods offer a principled uncertainty-aware learning framework through stochastic parameters. Yet, despite the established benefits, the inherent computational overhead often compromises either scalability or quality. This trade-off currently prevents the widespread adoption of Bayesian methods. This Thesis bridges the gap between high-quality and low-complexity by introducing a novel distribution on parameter space: a degenerate Gaussian whose covariance is a projection matrix aligned with the null space of the Fisher information matrix. We demonstrate the scalability of this Bayesian posterior through two numerically efficient algorithms: one for posterior sampling and another for the direct computation of predictive confidence. Empirically, we show State-Of-The-Art confidence calibration and out-of-distribution detection for large models. We provide theoretical grounding for this approach. We study the degeneracies inherent in Amari\u0027s information geometry and highlight its most relevant component: the split of parameter\u0027s perturbations into two orthogonal subspaces. From this perspective, our posterior naturally emerges as the simplest choice that captures this split, assigning unitary variance to one subspace and zero variance to the other. Moreover, through the tools of differential geometry, we utilize this split to identify and rectify a critical misalignment issue of the non-linearized Laplace Approximation. Finally, with a focus on PAC-Bayes generalization bounds, we pave the way for a deeper understanding of the learning capabilities of overparametrized models.", "arxiv_id": "2611.08997", "arxiv_url": "https://arxiv.org/abs/2611.08997", "authors": ["Marco Miani"], "brief": "\u63d0\u51fa\u534f\u65b9\u5dee\u4e3a\u8d39\u820d\u5c14\u4fe1\u606f\u77e9\u9635\u96f6\u7a7a\u95f4\u6295\u5f71\u7684\u9000\u5316\u9ad8\u65af\u540e\u9a8c\uff0c\u5e76\u8bbe\u8ba1\u9ad8\u6548\u91c7\u6837\u4e0e\u76f4\u63a5\u9884\u6d4b\u7f6e\u4fe1\u5ea6\u8ba1\u7b97\u7b97\u6cd5\uff0c\u4ee5\u964d\u4f4e\u8d1d\u53f6\u65af\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u5f00\u9500\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08997", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9000\u5316\u9ad8\u65af\u540e\u9a8c\u5728\u4e24\u4e2a\u6b63\u4ea4\u5b50\u7a7a\u95f4\u5206\u522b\u8d4b\u4e88\u5355\u4f4d\u4e0e\u96f6\u65b9\u5dee", "\u4e24\u79cd\u9ad8\u6548\u7b97\u6cd5\u5206\u522b\u652f\u6301\u540e\u9a8c\u91c7\u6837\u4e0e\u9884\u6d4b\u7f6e\u4fe1\u5ea6\u8ba1\u7b97", "\u5927\u6a21\u578b\u7f6e\u4fe1\u5ea6\u6821\u51c6\u4e0e\u5206\u5e03\u5916\u68c0\u6d4b\u8fbe\u5230\u5f53\u524d\u6700\u4f18\u6c34\u5e73"], "keywords": ["\u8d1d\u53f6\u65af\u63a8\u65ad", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u4fe1\u606f\u51e0\u4f55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08997v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Calibrating your confidence requires thinking of all the ways you could be wrong", "tldr": "\u901a\u8fc7\u6cbf\u8d39\u820d\u5c14\u4fe1\u606f\u96f6\u7a7a\u95f4\u6784\u9020\u8d1d\u53f6\u65af\u540e\u9a8c\uff0c\u517c\u987e\u5927\u6a21\u578b\u7f6e\u4fe1\u5ea6\u6821\u51c6\u4e0e\u8ba1\u7b97\u6548\u7387\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u534f\u65b9\u5dee\u4e3a\u8d39\u820d\u5c14\u4fe1\u606f\u77e9\u9635\u96f6\u7a7a\u95f4\u6295\u5f71\u7684\u9000\u5316\u9ad8\u65af\u540e\u9a8c\uff0c\u5e76\u8bbe\u8ba1\u9ad8\u6548\u91c7\u6837\u4e0e\u76f4\u63a5\u9884\u6d4b\u7f6e\u4fe1\u5ea6\u8ba1\u7b97\u7b97\u6cd5\uff0c\u4ee5\u964d\u4f4e\u8d1d\u53f6\u65af\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u5f00\u9500\u3002", "why_notable": "\u4e3a\u9ad8\u8d28\u91cf\u3001\u4f4e\u5f00\u9500\u7684\u8d1d\u53f6\u65af\u63a8\u65ad\u63d0\u4f9b\u65b0\u8def\u5f84\uff0c\u5e76\u4ece\u4fe1\u606f\u51e0\u4f55\u89e3\u91ca\u5176\u7ed3\u6784\uff0c\u4fee\u6b63\u975e\u7ebf\u6027\u5316\u62c9\u666e\u62c9\u65af\u8fd1\u4f3c\u7684\u9519\u4f4d\u95ee\u9898\u3002"}, {"abstract": "Looping is a powerful inductive bias for reasoning. By repeatedly iterating a recurrent block, looped models can scale their effective depth and enable multi-step reasoning in latent space. However, existing looped models are not inherently guided by an explicit measure of progress, making it difficult to determine when to stop looping and how to improve upon the current state. To enable this, we introduce Energy-Based Reasoners (EBRs), which learn an energy function over latent reasoning states and formulate looped updates as gradient descent on this energy. The energy scores latent states, while its gradient guides refinement and provides a signal for stopping. To train EBRs effectively, we further introduce exploration-based training to discover additional modes and to better shape the energy landscape over a broader set of states. Across four algorithmic reasoning benchmarks, EBRs match or outperform prior recurrent reasoning models, achieving 99.9% accuracy on Sudoku-Extreme while using 345$\\times$ less inference compute than the next-best model and maintaining comparable training compute. On all multi-solution benchmarks, EBRs achieve state-of-the-art coverage of distinct valid solutions while maintaining near-100% single-sample accuracy. These results suggest that energy-based models are a promising approach for strong reasoning performance.", "arxiv_id": "2611.08977", "arxiv_url": "https://arxiv.org/abs/2611.08977", "authors": ["William Xingxu Chen", "Alexi Gladstone", "Zeyu Michael Li", "Heng Ji", "Yilun Du"], "brief": "\u63d0\u51fa\u80fd\u91cf\u5f0f\u63a8\u7406\u5668\uff0c\u4e3a\u6f5c\u5728\u63a8\u7406\u72b6\u6001\u5b66\u4e60\u80fd\u91cf\u51fd\u6570\uff0c\u4ee5\u68af\u5ea6\u4e0b\u964d\u9a71\u52a8\u5faa\u73af\u66f4\u65b0\u5e76\u63d0\u4f9b\u505c\u6b62\u4fe1\u53f7\uff1b\u901a\u8fc7\u63a2\u7d22\u5f0f\u8bad\u7ec3\u53d1\u73b0\u66f4\u591a\u89e3\u6a21\u5f0f\uff0c\u5851\u9020\u66f4\u5e7f\u6cdb\u72b6\u6001\u4e0a\u7684\u80fd\u91cf\u666f\u89c2\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08977", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["EBRs\u5c06\u5faa\u73af\u66f4\u65b0\u5efa\u6a21\u4e3a\u6f5c\u5728\u72b6\u6001\u80fd\u91cf\u7684\u68af\u5ea6\u4e0b\u964d", "Sudoku-Extreme\u51c6\u786e\u738799.9%\uff0c\u63a8\u7406\u8ba1\u7b97\u5c11345\u500d", "\u591a\u89e3\u57fa\u51c6\u8986\u76d6\u7387\u8fbe\u6700\u4f18\uff0c\u5355\u6837\u672c\u51c6\u786e\u7387\u8fd1100%"], "keywords": ["\u80fd\u91cf\u6a21\u578b", "\u5faa\u73af\u63a8\u7406", "\u63a2\u7d22\u5f0f\u8bad\u7ec3", "\u7b97\u6cd5\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08977v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Energy-Based Reasoners: Your Recurrent Reasoner Should Be an Energy-Based Model", "tldr": "\u7528\u80fd\u91cf\u68af\u5ea6\u5f15\u5bfc\u5faa\u73af\u63a8\u7406\u4e0e\u505c\u6b62\uff0c\u5728\u9ad8\u96be\u6570\u72ec\u4e0a\u5b9e\u73b0\u9ad8\u7cbe\u5ea6\u548c\u5927\u5e45\u8ba1\u7b97\u8282\u7701\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u80fd\u91cf\u5f0f\u63a8\u7406\u5668\uff0c\u4e3a\u6f5c\u5728\u63a8\u7406\u72b6\u6001\u5b66\u4e60\u80fd\u91cf\u51fd\u6570\uff0c\u4ee5\u68af\u5ea6\u4e0b\u964d\u9a71\u52a8\u5faa\u73af\u66f4\u65b0\u5e76\u63d0\u4f9b\u505c\u6b62\u4fe1\u53f7\uff1b\u901a\u8fc7\u63a2\u7d22\u5f0f\u8bad\u7ec3\u53d1\u73b0\u66f4\u591a\u89e3\u6a21\u5f0f\uff0c\u5851\u9020\u66f4\u5e7f\u6cdb\u72b6\u6001\u4e0a\u7684\u80fd\u91cf\u666f\u89c2\u3002", "why_notable": "\u5c06\u63a8\u7406\u8fdb\u5c55\u53d8\u6210\u53ef\u8bc4\u5206\u3001\u53ef\u4f18\u5316\u7684\u80fd\u91cf\u4fe1\u53f7\uff0c\u4e3a\u81ea\u9002\u5e94\u505c\u6b62\u63d0\u4f9b\u4f9d\u636e\uff1b\u5728\u8bad\u7ec3\u8ba1\u7b97\u76f8\u5f53\u65f6\uff0c\u517c\u987e\u63a8\u7406\u6548\u7387\u4e0e\u591a\u89e3\u8986\u76d6\u80fd\u529b\u3002"}, {"abstract": "We study the problem of causal effect identification from an arbitrary set of observational and/or interventional distributions, which we call Universal Identifiability (uID). The uID problem generalizes existing classical identifiability (ID) and general identifiability (gID) problems, which considered the identification problem from either mere observational distributions or a specific type of interventional distributions. Prior research has established graphical criteria to determine when a causal effect is identifiable in ID and gID problems. Moreover, algorithms that leverage do-calculus and basic probability manipulations have been proposed to compute these effects. Consequently, it has been shown that do-calculus is both sound and complete in these problems. Despite these well-established results, a formal definition of what it means for the do-calculus to be complete does not exist. We propose a rigorous formalization for the completeness of the do-calculus and show that the completeness results in previous work remain valid. However, for more general problems, such as uID, the rules of do-calculus are no longer complete. This is perhaps the reason why the uID problem has remained open thus far.", "arxiv_id": "2611.08916", "arxiv_url": "https://arxiv.org/abs/2611.08916", "authors": ["Yaroslav Kivva", "Aliaksandra Novik", "Negar Kiyavash"], "brief": "\u7814\u7a76\u4ece\u4efb\u610f\u89c2\u6d4b\u6216\u5e72\u9884\u5206\u5e03\u96c6\u5408\u8bc6\u522b\u56e0\u679c\u6548\u5e94\u7684\u901a\u7528\u95ee\u9898\u3002\u901a\u8fc7\u4e25\u683c\u5f62\u5f0f\u5316do-calculus\u7684\u5b8c\u5907\u6027\uff0c\u786e\u8ba4\u7ecf\u5178\u7ed3\u8bba\u4ecd\u6210\u7acb\uff0c\u5e76\u8bc1\u660e\u5176\u5728\u66f4\u4e00\u822c\u8bbe\u5b9a\u4e0b\u4e0d\u5b8c\u5907\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "math.PR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08916", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["uID\u5141\u8bb8\u8f93\u5165\u4efb\u610f\u89c2\u6d4b\u4e0e\u5e72\u9884\u5206\u5e03\u96c6\u5408", "\u5f62\u5f0f\u5316do-calculus\u5b8c\u5907\u6027\uff0c\u4fdd\u7559ID\u4e0egID\u7ed3\u8bba", "\u8bc1\u660edo-calculus\u5728uID\u95ee\u9898\u4e2d\u4e0d\u5b8c\u5907"], "keywords": ["\u56e0\u679c\u63a8\u65ad", "\u56e0\u679c\u8bc6\u522b", "\u5e72\u9884\u5206\u5e03", "\u5b8c\u5907\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08916v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "On the Incompleteness of do-calculus for Universal Identifiability", "tldr": "\u7814\u7a76\u8bc1\u660e\uff0c\u9762\u5bf9\u4efb\u610f\u89c2\u6d4b\u4e0e\u5e72\u9884\u5206\u5e03\uff0cdo-calculus\u5e76\u4e0d\u5b8c\u5907\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4ece\u4efb\u610f\u89c2\u6d4b\u6216\u5e72\u9884\u5206\u5e03\u96c6\u5408\u8bc6\u522b\u56e0\u679c\u6548\u5e94\u7684\u901a\u7528\u95ee\u9898\u3002\u901a\u8fc7\u4e25\u683c\u5f62\u5f0f\u5316do-calculus\u7684\u5b8c\u5907\u6027\uff0c\u786e\u8ba4\u7ecf\u5178\u7ed3\u8bba\u4ecd\u6210\u7acb\uff0c\u5e76\u8bc1\u660e\u5176\u5728\u66f4\u4e00\u822c\u8bbe\u5b9a\u4e0b\u4e0d\u5b8c\u5907\u3002", "why_notable": "\u7ed3\u679c\u5212\u5b9a\u4e86\u73b0\u6709\u56e0\u679c\u63a8\u6f14\u89c4\u5219\u7684\u80fd\u529b\u8fb9\u754c\uff0c\u8bf4\u660e\u89e3\u51b3\u901a\u7528\u8bc6\u522b\u95ee\u9898\u4e0d\u80fd\u53ea\u4f9d\u8d56\u8fd9\u4e9b\u89c4\u5219\uff0c\u4e5f\u4e3a\u63a2\u7d22\u66f4\u5f3a\u7684\u8bc6\u522b\u65b9\u6cd5\u63d0\u4f9b\u7406\u8bba\u52a8\u673a\u3002"}, {"abstract": "The key-value (KV) cache dominates memory capacity and bandwidth in long-context LLM serving. While 4-bit microscaling formats (NVFP4, MXFP4) shrink the cache and run attention on FP4 Tensor Cores, a fundamental gap remains between algorithmic quantization and system-aware acceleration: existing FP4 KV systems use vanilla quantization that causes severe accuracy drops, whereas accuracy-oriented 4-bit algorithms rely on vector codebooks whose lookup overhead degrades decoding throughput. We present BitDecoding-FP4, an algorithm--system co-design for accurate and efficient native FP4 KV decoding. We mitigate three error sources: Dual-Residual Query Quantization splits queries into two FP4 tensors, cutting query logit error from 60% to 1%; Underflow-Aware Probability Scaling prevents E4M3 scales from rounding long-context probabilities to zero; and Outlier-Aware Key Quantization combines static smoothing, Hadamard rotation, and scale search to suppress key outliers under token-wise scaling. At the system level, we remove the softmax bottleneck via transposed softmax with fused probability quantization and stacked query MMA on paged KV caches. Across dense and MoE models with GQA and MLA, BitDecoding-FP4 stays within 0.5 points of BF16 KV accuracy with NVFP4 (1 point with MXFP4), and tracks BF16 KV in RL training rollouts. In end-to-end serving on NVIDIA B300 with Qwen3-4B and Qwen3-30B-A3B, it delivers 2.4-3.0$\\times$ higher peak serving throughput than BF16 KV. The implementation is available at https://github.com/OpenBitSys/BitDecoding-FP4.", "arxiv_id": "2611.09825", "arxiv_url": "https://arxiv.org/abs/2611.09825", "authors": ["Dayou Du", "Woon Yee Ng", "Guangming Sheng", "Nick Lau", "Jianyi Cheng", "Luo Mai"], "brief": "\u63d0\u51fa\u539f\u751fFP4\u952e\u503c\u7f13\u5b58\u89e3\u7801\u65b9\u6848\uff0c\u8054\u5408\u4f18\u5316\u67e5\u8be2\u3001\u6982\u7387\u548c\u952e\u7684\u91cf\u5316\u8bef\u5dee\uff0c\u5e76\u878d\u5408\u8f6c\u7f6esoftmax\u4e0e\u77e9\u9635\u8fd0\u7b97\uff0c\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u7684\u8bbf\u5b58\u548c\u8ba1\u7b97\u5f00\u9500\u3002", "categories": ["cs.AI", "cs.AR", "cs.CL", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09825", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53cc\u6b8b\u5dee\u67e5\u8be2\u91cf\u5316\u5c06\u67e5\u8be2logit\u8bef\u5dee\u4ece60%\u964d\u81f31%", "\u6982\u7387\u4e0b\u6ea2\u611f\u77e5\u7f29\u653e\u4e0e\u5f02\u5e38\u503c\u611f\u77e5\u952e\u91cf\u5316\u964d\u4f4e\u8bef\u5dee", "B300\u7aef\u5230\u7aef\u5cf0\u503c\u541e\u5410\u4e3aBF16\u7f13\u5b58\u76842.4\u20143.0\u500d"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u952e\u503c\u7f13\u5b58", "\u63a8\u7406\u52a0\u901f", "\u8f6f\u786c\u4ef6\u534f\u540c\u8bbe\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09825v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BitDecoding-FP4: Native FP4 KV Cache Decoding via Algorithm-System Co-Design", "tldr": "\u901a\u8fc7\u91cf\u5316\u7b97\u6cd5\u4e0e\u7b97\u5b50\u534f\u540c\u8bbe\u8ba1\uff0c\u8ba9\u539f\u751f\u56db\u4f4d\u7f13\u5b58\u89e3\u7801\u517c\u987e\u7cbe\u5ea6\u4e0e\u541e\u5410\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u539f\u751fFP4\u952e\u503c\u7f13\u5b58\u89e3\u7801\u65b9\u6848\uff0c\u8054\u5408\u4f18\u5316\u67e5\u8be2\u3001\u6982\u7387\u548c\u952e\u7684\u91cf\u5316\u8bef\u5dee\uff0c\u5e76\u878d\u5408\u8f6c\u7f6esoftmax\u4e0e\u77e9\u9635\u8fd0\u7b97\uff0c\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u7684\u8bbf\u5b58\u548c\u8ba1\u7b97\u5f00\u9500\u3002", "why_notable": "NVFP4\u7cbe\u5ea6\u8dddBF16\u7f13\u5b58\u4e0d\u8d85\u8fc70.5\u5206\uff0c\u5e76\u8986\u76d6\u7a20\u5bc6\u4e0e\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\uff0c\u663e\u793a\u4f4e\u4f4d\u7f13\u5b58\u53ef\u517c\u987e\u7cbe\u5ea6\u4e0e\u5b9e\u9645\u670d\u52a1\u541e\u5410\u3002"}, {"abstract": "Ensuring high returns while providing strong safety guarantees in offline imitation learning (IL) is a fundamental challenge: existing approaches either rely on explicitly specified cost functions, which are difficult to design for complex real-world safety constraints, or require expert demonstrations that are both safe and high-performing, which are often too costly to collect. We introduce dual-expert imitation learning, which leverages two complementary data sources: (i) safety-compliant demonstrations that faithfully follow safety guidelines but may be suboptimal, and (ii) performance-oriented demonstrations that achieve high returns but may violate safety guidelines. To address this problem, we propose DexDICE (Dual-expert offline imitation learning via stationary DIstribution Correction Estimation). Instead of conventional distribution constraints, DexDICE combines DICE-style offline learning with safe support constraints, enabling agents to exploit high-return behaviors while remaining within safety-compliant regions. We prove that the ideal solution satisfying this constraint exactly has zero unsafe-region visitation with high probability. We evaluate DexDICE on a re-curated DSRL benchmark and validate it on a real-world mobile-robot navigation task trained directly from human teleoperation demonstrations, where it substantially outperforms baselines and remains robust to data scarcity and quality degradation.", "arxiv_id": "2611.09433", "arxiv_url": "https://arxiv.org/abs/2611.09433", "authors": ["Seokin Seo", "Sung Kuk Shyn", "Minji Seo", "Yisoo Lee", "Jongmin Lee", "Hongseok Yang", "Kee-Eung Kim"], "brief": "\u63d0\u51fa\u53cc\u4e13\u5bb6\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60\uff0c\u5206\u522b\u5229\u7528\u5b89\u5168\u4f46\u6b21\u4f18\u3001\u9ad8\u56de\u62a5\u4f46\u53ef\u80fd\u8fdd\u89c4\u7684\u793a\u8303\u3002DexDICE\u7ed3\u5408\u7a33\u6001\u5206\u5e03\u6821\u6b63\u4e0e\u5b89\u5168\u652f\u6491\u96c6\u7ea6\u675f\uff0c\u5728\u5b89\u5168\u533a\u57df\u5185\u5b66\u4e60\u9ad8\u6536\u76ca\u884c\u4e3a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09433", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["DexDICE\u4ee5\u5b89\u5168\u652f\u6491\u96c6\u7ea6\u675f\u66ff\u4ee3\u5e38\u89c4\u5206\u5e03\u7ea6\u675f", "\u7406\u8bba\u8bc1\u660e\u7406\u60f3\u89e3\u4ee5\u9ad8\u6982\u7387\u4e0d\u8bbf\u95ee\u4e0d\u5b89\u5168\u533a\u57df", "\u5728\u91cd\u6574\u7406\u7684DSRL\u53ca\u771f\u5b9e\u79fb\u52a8\u673a\u5668\u4eba\u5bfc\u822a\u4e2d\u9a8c\u8bc1"], "keywords": ["\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60", "\u5b89\u5168\u7ea6\u675f", "\u673a\u5668\u4eba\u5bfc\u822a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09433v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DexDICE: Reconciling Safety and Performance via Dual-Expert Offline Imitation Learning", "tldr": "\u878d\u5408\u5b89\u5168\u4e0e\u9ad8\u56de\u62a5\u4e24\u7c7b\u793a\u8303\uff0c\u8ba9\u79bb\u7ebf\u7b56\u7565\u517c\u987e\u5b89\u5168\u7ea6\u675f\u4e0e\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u53cc\u4e13\u5bb6\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60\uff0c\u5206\u522b\u5229\u7528\u5b89\u5168\u4f46\u6b21\u4f18\u3001\u9ad8\u56de\u62a5\u4f46\u53ef\u80fd\u8fdd\u89c4\u7684\u793a\u8303\u3002DexDICE\u7ed3\u5408\u7a33\u6001\u5206\u5e03\u6821\u6b63\u4e0e\u5b89\u5168\u652f\u6491\u96c6\u7ea6\u675f\uff0c\u5728\u5b89\u5168\u533a\u57df\u5185\u5b66\u4e60\u9ad8\u6536\u76ca\u884c\u4e3a\u3002", "why_notable": "\u65e0\u9700\u663e\u5f0f\u8bbe\u8ba1\u5b89\u5168\u4ee3\u4ef7\uff0c\u4e5f\u4e0d\u8981\u6c42\u5355\u4e00\u4e13\u5bb6\u540c\u65f6\u5b89\u5168\u4e14\u9ad8\u6548\uff1b\u771f\u5b9e\u673a\u5668\u4eba\u9a8c\u8bc1\u663e\u793a\u5176\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u80fd\u5e94\u5bf9\u6570\u636e\u7a00\u7f3a\u4e0e\u8d28\u91cf\u4e0b\u964d\u3002"}, {"abstract": "Clinical data are split across incomplete cohorts with partially overlapping variables. Causal discovery under missing data and multi-source integration have developed separately, and tabular foundation models cannot take a causal graph without retraining. We make two contributions. First, causal graph fusion learns a partial ancestral graph on the shared variables, fuses it into each cohort\u0027s graph under temporal background knowledge and lets Markov blankets guide re-imputation, so missing data are handled inside discovery. Second, causal attention steering compiles the learned graph into the attention of a frozen tabular foundation model at inference. Against known ground truth, fusion dominates pooled and per-cohort baselines in every missingness and heterogeneity condition tested (p\u003c0.001), and steering improves discrimination under distribution shift (p\u003c10^{-5}), a gain that a random graph does not produce. In two spinal cord injury cohorts, fusion orients age, albumin and hemoglobin as ancestors of length of stay, a set no single cohort orients in full, and yields compact, temporally ordered predictor sets that match or exceed automatic feature selection on four of five outcomes.", "arxiv_id": "2611.09400", "arxiv_url": "https://arxiv.org/abs/2611.09400", "authors": ["Yanke Li", "Dhiyaa Al Jorf", "Ayoube Ighissou", "Anke Scheel-Sailer", "Robert Riener", "Diego Paez-Granados"], "brief": "\u5148\u5b66\u4e60\u5171\u4eab\u53d8\u91cf\u7684\u90e8\u5206\u7956\u5148\u56fe\uff0c\u518d\u7ed3\u5408\u65f6\u95f4\u7ea6\u675f\u878d\u5165\u5404\u961f\u5217\uff0c\u4ee5\u9a6c\u5c14\u53ef\u592b\u6bef\u6307\u5bfc\u91cd\u65b0\u63d2\u8865\uff1b\u968f\u540e\u5c06\u56e0\u679c\u56fe\u7f16\u8bd1\u4e3a\u51bb\u7ed3\u8868\u683c\u57fa\u7840\u6a21\u578b\u7684\u6ce8\u610f\u529b\u7ea6\u675f\u3002", "categories": ["cs.LG", "stat.AP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09400", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u56fe\u878d\u5408\u5728\u5168\u90e8\u7f3a\u5931\u4e0e\u5f02\u8d28\u6027\u6d4b\u8bd5\u4e2d\u4f18\u4e8e\u57fa\u7ebf\uff0cp\u003c0.001", "\u56e0\u679c\u6ce8\u610f\u529b\u5f15\u5bfc\u6539\u5584\u5206\u5e03\u504f\u79fb\u4e0b\u533a\u5206\u80fd\u529b\uff0cp\u003c10\u207b\u2075", "\u4e24\u7ec4\u810a\u9ad3\u635f\u4f24\u961f\u5217\u4e2d\uff0c4/5\u7ed3\u5c40\u9884\u6d4b\u4e0d\u900a\u4e8e\u81ea\u52a8\u7279\u5f81\u9009\u62e9"], "keywords": ["\u56e0\u679c\u53d1\u73b0", "\u7f3a\u5931\u6570\u636e", "\u8868\u683c\u57fa\u7840\u6a21\u578b", "\u5206\u5e03\u504f\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09400v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Causal graph fusion across incomplete cohorts and causal steering of tabular foundation models", "tldr": "\u878d\u5408\u4e0d\u5b8c\u6574\u4e34\u5e8a\u961f\u5217\u7684\u56e0\u679c\u56fe\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u5f15\u5bfc\u51bb\u7ed3\u8868\u683c\u57fa\u7840\u6a21\u578b", "upvotes": 0, "what_it_is": "\u5148\u5b66\u4e60\u5171\u4eab\u53d8\u91cf\u7684\u90e8\u5206\u7956\u5148\u56fe\uff0c\u518d\u7ed3\u5408\u65f6\u95f4\u7ea6\u675f\u878d\u5165\u5404\u961f\u5217\uff0c\u4ee5\u9a6c\u5c14\u53ef\u592b\u6bef\u6307\u5bfc\u91cd\u65b0\u63d2\u8865\uff1b\u968f\u540e\u5c06\u56e0\u679c\u56fe\u7f16\u8bd1\u4e3a\u51bb\u7ed3\u8868\u683c\u57fa\u7840\u6a21\u578b\u7684\u6ce8\u610f\u529b\u7ea6\u675f\u3002", "why_notable": "\u5c06\u7f3a\u5931\u6570\u636e\u5904\u7406\u7eb3\u5165\u8de8\u961f\u5217\u56e0\u679c\u53d1\u73b0\uff0c\u5e76\u8ba9\u51bb\u7ed3\u6a21\u578b\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u5229\u7528\u56e0\u679c\u7ed3\u6784\uff0c\u4e3a\u4e34\u5e8a\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u9884\u6d4b\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "We present Dejavu, a method that makes sim-to-real transfer of reinforcement learning policies in constrained Markov decision processes probably safe over an unbounded sequence of policy updates. An anytime valid test using per-decision importance sampling and a betting confidence sequence certifies each candidate trained in simulation before deployment using only trajectories collected by a safe baseline policy operating in production. Simulation quality does not affect the safety guarantee, only the production sample efficiency of the method. Finally, a summable per-test failure probability yields the lifetime valid property. Empirical results across three sim-to-real benchmarks support the theoretical work.", "arxiv_id": "2611.09344", "arxiv_url": "https://arxiv.org/abs/2611.09344", "authors": ["Rohan Tangri", "Jan-Peter Calliess"], "brief": "Dejavu\u9762\u5411\u7ea6\u675f\u9a6c\u5c14\u53ef\u592b\u51b3\u7b56\u8fc7\u7a0b\uff0c\u5728\u90e8\u7f72\u524d\u8ba4\u8bc1\u4eff\u771f\u8bad\u7ec3\u7684\u5019\u9009\u7b56\u7565\u3002\u5b83\u4ec5\u7528\u7ebf\u4e0a\u5b89\u5168\u57fa\u7ebf\u8f68\u8ff9\uff0c\u7ed3\u5408\u9010\u51b3\u7b56\u91cd\u8981\u6027\u91c7\u6837\u4e0e\u6295\u6ce8\u7f6e\u4fe1\u5e8f\u5217\u6784\u5efa\u968f\u65f6\u6709\u6548\u68c0\u9a8c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09344", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9010\u51b3\u7b56\u91cd\u8981\u6027\u91c7\u6837\u4e0e\u6295\u6ce8\u7f6e\u4fe1\u5e8f\u5217\u8ba4\u8bc1\u7b56\u7565", "\u53ef\u6c42\u548c\u7684\u5355\u6b21\u68c0\u9a8c\u5931\u8d25\u6982\u7387\u652f\u6301\u7ec8\u8eab\u6709\u6548\u6027", "3\u4e2a\u4eff\u771f\u5230\u73b0\u5b9e\u57fa\u51c6\u5b9e\u9a8c\u652f\u6301\u7406\u8bba\u7ed3\u679c"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u4eff\u771f\u5230\u73b0\u5b9e\u8fc1\u79fb", "\u5b89\u5168\u8ba4\u8bc1", "\u5e8f\u8d2f\u68c0\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09344v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Probably Safe Sim-to-Real Transfer with Lifetime Validity", "tldr": "Dejavu\u7528\u5b89\u5168\u57fa\u7ebf\u8f68\u8ff9\u8ba4\u8bc1\u4eff\u771f\u7b56\u7565\uff0c\u4e3a\u65e0\u9650\u6b21\u90e8\u7f72\u66f4\u65b0\u63d0\u4f9b\u7ec8\u8eab\u6982\u7387\u5b89\u5168\u4fdd\u8bc1\u3002", "upvotes": 0, "what_it_is": "Dejavu\u9762\u5411\u7ea6\u675f\u9a6c\u5c14\u53ef\u592b\u51b3\u7b56\u8fc7\u7a0b\uff0c\u5728\u90e8\u7f72\u524d\u8ba4\u8bc1\u4eff\u771f\u8bad\u7ec3\u7684\u5019\u9009\u7b56\u7565\u3002\u5b83\u4ec5\u7528\u7ebf\u4e0a\u5b89\u5168\u57fa\u7ebf\u8f68\u8ff9\uff0c\u7ed3\u5408\u9010\u51b3\u7b56\u91cd\u8981\u6027\u91c7\u6837\u4e0e\u6295\u6ce8\u7f6e\u4fe1\u5e8f\u5217\u6784\u5efa\u968f\u65f6\u6709\u6548\u68c0\u9a8c\u3002", "why_notable": "\u5c06\u5b89\u5168\u8ba4\u8bc1\u4ece\u5355\u6b21\u90e8\u7f72\u6269\u5c55\u5230\u65e0\u9650\u6b21\u7b56\u7565\u66f4\u65b0\uff1b\u4eff\u771f\u8d28\u91cf\u53ea\u5f71\u54cd\u7ebf\u4e0a\u6837\u672c\u6548\u7387\uff0c\u4e0d\u5f71\u54cd\u5b89\u5168\u4fdd\u8bc1\uff0c\u9002\u5408\u6301\u7eed\u8fed\u4ee3\u573a\u666f\u3002"}, {"abstract": "Predicting the long-term behavior of partially observed dynamical systems such as the coupled atmosphere-ocean system is central to societal decision-making. Motivated by the success of deep learning emulators in weather forecasting, data-driven climate models represent a promising approach. However, climate emulation poses distinct challenges: models must account for unresolved fast variables introduced by unavoidable coarse-graining, reproduce long-term statistics, and remain stable over arbitrarily long rollouts and under external perturbations. These requirements motivate stochastic data-driven emulators, but modern generative models lack stability guarantees. We introduce forced-dissipative stochastic interpolants, a generative framework for learning stochastic reduced dynamics. Its architecture uses structural constraints inspired by turbulent dynamics, which provide stability by design while retaining the flexibility of stochastic interpolants to represent complex probabilistic dynamics. Building on the theory of Markov-chain stability, we establish a Foster--Lyapunov drift condition and prove geometric ergodicity for our emulator, together with stability under steady external forcing. We evaluate the framework on the two-timescale Lorenz-96 system, a prototype of partially observed multiscale turbulence. The resulting emulator remains stable over long integrations and under finite-amplitude forcing, with accurate prediction of forced responses of both the mean and variance.", "arxiv_id": "2611.09317", "arxiv_url": "https://arxiv.org/abs/2611.09317", "authors": ["Mario Massy", "Sara Shamekh", "Fabrizio Falasca", "Matthieu Blanke"], "brief": "\u63d0\u51fa\u5f3a\u8feb\u8017\u6563\u968f\u673a\u63d2\u503c\u6846\u67b6\uff0c\u5b66\u4e60\u90e8\u5206\u53ef\u89c2\u6d4b\u7cfb\u7edf\u7684\u968f\u673a\u7ea6\u5316\u52a8\u529b\u5b66\u3002\u901a\u8fc7\u53d7\u6e4d\u6d41\u542f\u53d1\u7684\u7ed3\u6784\u7ea6\u675f\uff0c\u5728\u4fdd\u7559\u751f\u6210\u7075\u6d3b\u6027\u7684\u540c\u65f6\u4fdd\u8bc1\u957f\u671f\u7a33\u5b9a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09317", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5f3a\u8feb\u8017\u6563\u968f\u673a\u63d2\u503c\u4ee5\u7ed3\u6784\u7ea6\u675f\u4fdd\u8bc1\u7a33\u5b9a\u6027", "\u8bc1\u660eFoster\u2013Lyapunov\u6f02\u79fb\u6761\u4ef6\u4e0e\u51e0\u4f55\u904d\u5386\u6027", "\u53cc\u65f6\u95f4\u5c3a\u5ea6Lorenz-96\u9a8c\u8bc1\u53d7\u8feb\u5747\u503c\u4e0e\u65b9\u5dee\u9884\u6d4b"], "keywords": ["\u52a8\u529b\u7cfb\u7edf", "\u968f\u673a\u751f\u6210\u6a21\u578b", "\u7a33\u5b9a\u6027", "\u6c14\u5019\u6a21\u62df"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09317v1", "published_at": "2026-11-06", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Stable probabilistic emulation of partially observed dynamical systems", "tldr": "\u901a\u8fc7\u5f3a\u8feb\u8017\u6563\u7ed3\u6784\u7ea6\u675f\uff0c\u4e3a\u90e8\u5206\u53ef\u89c2\u6d4b\u52a8\u529b\u7cfb\u7edf\u6784\u5efa\u5177\u6709\u7a33\u5b9a\u6027\u4fdd\u8bc1\u7684\u968f\u673a\u6a21\u62df\u5668\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u5f3a\u8feb\u8017\u6563\u968f\u673a\u63d2\u503c\u6846\u67b6\uff0c\u5b66\u4e60\u90e8\u5206\u53ef\u89c2\u6d4b\u7cfb\u7edf\u7684\u968f\u673a\u7ea6\u5316\u52a8\u529b\u5b66\u3002\u901a\u8fc7\u53d7\u6e4d\u6d41\u542f\u53d1\u7684\u7ed3\u6784\u7ea6\u675f\uff0c\u5728\u4fdd\u7559\u751f\u6210\u7075\u6d3b\u6027\u7684\u540c\u65f6\u4fdd\u8bc1\u957f\u671f\u7a33\u5b9a\u3002", "why_notable": "\u5c06\u751f\u6210\u6a21\u578b\u7684\u6982\u7387\u8868\u8fbe\u80fd\u529b\u4e0e\u53ef\u8bc1\u660e\u7684\u957f\u671f\u7a33\u5b9a\u6027\u7ed3\u5408\uff0c\u4e3a\u6c14\u5019\u6a21\u62df\u4e2d\u957f\u671f\u7edf\u8ba1\u548c\u5916\u90e8\u5f3a\u8feb\u54cd\u5e94\u7684\u53ef\u9760\u9884\u6d4b\u63d0\u4f9b\u65b9\u6cd5\u57fa\u7840\u3002"}, {"abstract": "Mixture-of-Experts (MoE) training is often not stationary: the data mixture changes at curriculum boundaries, when a model is continually pretrained into a new domain, or when the corpus is refreshed. Routing is learned against the current mixture, so each such change disrupts the per-expert load the router had converged to, and existing balancing methods have only been evaluated on stationary data. We rethink load balancing as a feedback control problem, in which the deviation of each expert\u0027s load from its fair share is the control error and the per-expert routing bias is the control input, and define a family of controllers, the PID-Balancer, from the proportional, integral, and derivative terms of classical PID control. Two widely used methods belong to this family: the auxiliary balancing loss behaves like a proportional controller, and the loss-free bias update is an integral controller acting on the sign of the error. Reading the router as a static map with a one-step delay, we show that the integral term is the only one that both removes persistent imbalance and averages out the step-to-step fluctuation of the measured load, whereas the proportional and derivative terms pass or amplify that fluctuation into the routing bias. We therefore adopt PID (I), the pure-integral member of the family with a single gain. Two settings are evaluated: (i) training an OLMoE backbone from scratch with 16 to 64 experts per layer, through a mid-run mixture switch, and (ii) continual pretraining of the released OLMoE-1B-7B on a new corpus. PID (I) holds balance before the shift and restores it more tightly afterwards than either the auxiliary loss or loss-free balancing, at comparable perplexity.", "arxiv_id": "2611.09252", "arxiv_url": "https://arxiv.org/abs/2611.09252", "authors": ["Yikun Hou", "Alp Yurtsever"], "brief": "\u63d0\u51faPID-Balancer\uff0c\u5c06\u4e13\u5bb6\u8d1f\u8f7d\u504f\u5dee\u89c6\u4e3a\u63a7\u5236\u8bef\u5dee\u3001\u8def\u7531\u504f\u7f6e\u89c6\u4e3a\u63a7\u5236\u8f93\u5165\u3002\u5206\u6790\u540e\u91c7\u7528\u5355\u589e\u76ca\u7eaf\u79ef\u5206\u63a7\u5236\u5668PID (I)\uff0c\u5e94\u5bf9\u8bad\u7ec3\u6570\u636e\u6df7\u5408\u53d8\u5316\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09252", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8f85\u52a9\u5747\u8861\u635f\u5931\u5bf9\u5e94\u6bd4\u4f8b\u63a7\u5236\uff0c\u65e0\u635f\u5931\u504f\u7f6e\u66f4\u65b0\u5bf9\u5e94\u7b26\u53f7\u79ef\u5206\u63a7\u5236", "\u7eaf\u79ef\u5206\u9879\u6d88\u9664\u6301\u7eed\u5931\u8861\uff0c\u5e76\u5e73\u6ed1\u9010\u6b65\u8d1f\u8f7d\u6ce2\u52a8", "\u6d4b\u8bd516\u81f364\u4e13\u5bb6\u8bad\u7ec3\u53caOLMoE-1B-7B\u6301\u7eed\u9884\u8bad\u7ec3"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u8d1f\u8f7d\u5747\u8861", "\u53cd\u9988\u63a7\u5236", "\u6301\u7eed\u9884\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09252v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Rethinking MoE Load Balancing as Feedback Control", "tldr": "\u5c06\u4e13\u5bb6\u8d1f\u8f7d\u5747\u8861\u5efa\u6a21\u4e3a\u53cd\u9988\u63a7\u5236\uff0c\u7528\u7eaf\u79ef\u5206\u63a7\u5236\u6539\u5584\u6570\u636e\u5206\u5e03\u5207\u6362\u540e\u7684\u5931\u8861\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faPID-Balancer\uff0c\u5c06\u4e13\u5bb6\u8d1f\u8f7d\u504f\u5dee\u89c6\u4e3a\u63a7\u5236\u8bef\u5dee\u3001\u8def\u7531\u504f\u7f6e\u89c6\u4e3a\u63a7\u5236\u8f93\u5165\u3002\u5206\u6790\u540e\u91c7\u7528\u5355\u589e\u76ca\u7eaf\u79ef\u5206\u63a7\u5236\u5668PID (I)\uff0c\u5e94\u5bf9\u8bad\u7ec3\u6570\u636e\u6df7\u5408\u53d8\u5316\u3002", "why_notable": "\u628a\u5e38\u7528\u5747\u8861\u65b9\u6cd5\u7edf\u4e00\u5230\u63a7\u5236\u8bba\u6846\u67b6\uff0c\u5e76\u5728\u6570\u636e\u5206\u5e03\u5207\u6362\u540e\u5b9e\u73b0\u66f4\u7d27\u7684\u8d1f\u8f7d\u5747\u8861\uff0c\u540c\u65f6\u4fdd\u6301\u76f8\u8fd1\u56f0\u60d1\u5ea6\uff0c\u4e3a\u975e\u5e73\u7a33MoE\u8bad\u7ec3\u63d0\u4f9b\u5b9e\u7528\u65b9\u6848\u3002"}, {"abstract": "Cross-Layer Transcoders (CLTs) decompose the activations of large language models into human-interpretable features and trace how these features interact across layers to form circuits, making them a key tool for mechanistic interpretability. However, training CLTs effectively and efficiently is hard. Beyond the usual trade-off between sparsity and reconstruction quality, a CLT has to model all layers at once, which adds a further challenge. The common JumpReLU recipe controls sparsity only indirectly through a penalty, while the direct extension of TopK selects a fixed number of latents in every layer. Yet reconstruction difficulty differs widely across layers, and intermediate layers are much harder than others, so giving every layer the same budget is suboptimal. We propose Cross-Layer TopK, which sets a single L0 budget for the whole model and dynamically allocates it across layers during training. In a comparison with JumpReLU and other TopK variants on Qwen3-8B-Base, this gives lower FVU while using 20% fewer active latents than JumpReLU. The better reconstruction carries over to circuit tracing, yielding more complete circuits with higher replacement and completeness scores. The fixed per-token budget of Cross-Layer TopK also makes it easy to pair with sparse decoding, which cuts both computation and communication and gives a 2.9x speedup per training step. We further show that Cross-Layer TopK follows scaling laws in both latent size and sparsity. We have open-sourced the weights of our CLT at https://huggingface.co/ByteDance-Seed/Cross-Layer-TopK-CLT.", "arxiv_id": "2611.09233", "arxiv_url": "https://arxiv.org/abs/2611.09233", "authors": ["Anyuan Zhuo", "Shaohua Zhang", "Tianle Li", "Yuan Lin", "Diandian Gu", "Jun Wang", "Pinyan Lu"], "brief": "\u63d0\u51fa Cross-Layer TopK\uff0c\u4e3a\u8de8\u5c42\u8f6c\u7801\u5668\u8bbe\u5b9a\u5168\u6a21\u578b\u5171\u4eab\u7684 L0 \u9884\u7b97\uff0c\u8bad\u7ec3\u65f6\u6309\u5c42\u52a8\u6001\u5206\u914d\u6d3b\u8dc3\u7279\u5f81\uff0c\u907f\u514d\u5404\u5c42\u56fa\u5b9a\u914d\u989d\u9020\u6210\u7684\u91cd\u6784\u5931\u8861\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09233", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["Qwen3-8B-Base \u4e0a\u6bd4 JumpReLU \u5c11\u752820%\u6d3b\u8dc3\u7279\u5f81\u4e14FVU\u66f4\u4f4e", "\u56fa\u5b9a\u9010\u8bcd\u9884\u7b97\u7ed3\u5408\u7a00\u758f\u89e3\u7801\uff0c\u5355\u6b65\u8bad\u7ec3\u52a0\u901f2.9\u500d", "\u7535\u8def\u66ff\u6362\u4e0e\u5b8c\u6574\u6027\u8bc4\u5206\u66f4\u9ad8\uff0c\u7279\u5f81\u89c4\u6a21\u548c\u7a00\u758f\u5ea6\u5448\u7f29\u653e\u89c4\u5f8b"], "keywords": ["\u673a\u5236\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u8868\u793a", "\u7535\u8def\u8ffd\u8e2a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09233v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cross-Layer TopK: Dynamically Allocating Sparsity Across Layers in Transcoders", "tldr": "\u901a\u8fc7\u8de8\u5c42\u52a8\u6001\u5206\u914d\u7a00\u758f\u9884\u7b97\uff0c\u4ee5\u66f4\u5c11\u6d3b\u8dc3\u7279\u5f81\u63d0\u5347\u6a21\u578b\u91cd\u6784\u4e0e\u7535\u8def\u8ffd\u8e2a\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa Cross-Layer TopK\uff0c\u4e3a\u8de8\u5c42\u8f6c\u7801\u5668\u8bbe\u5b9a\u5168\u6a21\u578b\u5171\u4eab\u7684 L0 \u9884\u7b97\uff0c\u8bad\u7ec3\u65f6\u6309\u5c42\u52a8\u6001\u5206\u914d\u6d3b\u8dc3\u7279\u5f81\uff0c\u907f\u514d\u5404\u5c42\u56fa\u5b9a\u914d\u989d\u9020\u6210\u7684\u91cd\u6784\u5931\u8861\u3002", "why_notable": "\u628a\u7a00\u758f\u9884\u7b97\u4ece\u9010\u5c42\u56fa\u5b9a\u6539\u4e3a\u5168\u5c40\u52a8\u6001\u5206\u914d\uff0c\u540c\u65f6\u6539\u5584\u91cd\u6784\u3001\u8bad\u7ec3\u6548\u7387\u4e0e\u7535\u8def\u8ffd\u8e2a\u8d28\u91cf\uff0c\u4e3a\u5927\u6a21\u578b\u673a\u5236\u89e3\u91ca\u63d0\u4f9b\u66f4\u5b9e\u7528\u7684\u5de5\u5177\u3002"}, {"abstract": "In neuroscience, representational drift is a change in which neurons carry a representation while behaviour stays the same; we measure its analogue in OpenCoder-1.5B during pretraining, for 169 Python constructs over two trillion tokens at a constant learning rate, with a noise unit on every change, at checkpoints as close as 1,000 training steps. For 16 of the 169, those whose grammar fixes a next token, the loss at those positions reaches its floor within the first 4% of training, while the model\u0027s reliance on the neurons carrying them grows to the end: removing them costs 0.06, 0.25 and 0.40 nats more than removing a random set, at 4 billion, 84 billion and 2 trillion tokens. Which neurons carry a construct never settles: for all 169 the carrier set is still changing at the last checkpoint, and an abrupt settling at any date from 84 billion to 1.5 trillion tokens, or a gradual one before 500 billion, would have been detected in 99% of injected cases. The set measured at 84 billion tokens, removed at the end, cannot be separated from a random set, so the function is carried by whichever neurons are current. Up close the change is a persisting pool and a changing sample: a neuron that leaves a construct\u0027s set returns at three times the rate of a matched neuron, and no set reassembles. The hypothesis we fixed in advance, that the carriers settle, is refuted; we discuss candidate causes and name the experiment that would separate them.", "arxiv_id": "2611.09204", "arxiv_url": "https://arxiv.org/abs/2611.09204", "authors": ["Piotr Wilam"], "brief": "\u7814\u7a76\u8ffd\u8e2a\u4ee3\u7801\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\uff0c\u627f\u8f7dPython\u8bed\u6cd5\u6784\u9020\u7684\u795e\u7ecf\u5143\u5982\u4f55\u53d8\u5316\uff0c\u5e76\u901a\u8fc7\u6d88\u878d\u68c0\u9a8c\u5176\u529f\u80fd\u8d21\u732e\uff0c\u53d1\u73b0\u884c\u4e3a\u7a33\u5b9a\u4e0d\u610f\u5473\u7740\u5185\u90e8\u8868\u5f81\u8f7d\u4f53\u56fa\u5b9a\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09204", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8ffd\u8e2aOpenCoder-1.5B\u7684169\u7c7b\u6784\u9020\u81f32\u4e07\u4ebf\u8bcd\u5143", "16\u7c7b\u6784\u9020\u635f\u5931\u5728\u524d4%\u8bad\u7ec3\u89e6\u5e95\uff0c\u6d88\u878d\u4ee3\u4ef7\u4ecd\u4e0a\u5347", "\u79bb\u5f00\u8f7d\u4f53\u96c6\u5408\u7684\u795e\u7ecf\u5143\uff0c\u56de\u5f52\u7387\u4e3a\u5339\u914d\u795e\u7ecf\u5143\u76843\u500d"], "keywords": ["\u8868\u5f81\u6f02\u79fb", "\u4ee3\u7801\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u795e\u7ecf\u5143\u6d88\u878d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09204v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Representational drift in a code model: behaviour settles, which neurons carry it does not", "tldr": "\u4ee3\u7801\u6a21\u578b\u7684\u9884\u6d4b\u8868\u73b0\u867d\u65e9\u65e9\u7a33\u5b9a\uff0c\u627f\u8f7d\u5bf9\u5e94\u529f\u80fd\u7684\u795e\u7ecf\u5143\u5374\u6301\u7eed\u66f4\u66ff\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u8ffd\u8e2a\u4ee3\u7801\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\uff0c\u627f\u8f7dPython\u8bed\u6cd5\u6784\u9020\u7684\u795e\u7ecf\u5143\u5982\u4f55\u53d8\u5316\uff0c\u5e76\u901a\u8fc7\u6d88\u878d\u68c0\u9a8c\u5176\u529f\u80fd\u8d21\u732e\uff0c\u53d1\u73b0\u884c\u4e3a\u7a33\u5b9a\u4e0d\u610f\u5473\u7740\u5185\u90e8\u8868\u5f81\u8f7d\u4f53\u56fa\u5b9a\u3002", "why_notable": "\u5b83\u7528\u7eb5\u5411\u8ffd\u8e2a\u4e0e\u6d88\u878d\u8bc1\u636e\u63a8\u7ffb\u4e86\u529f\u80fd\u8f7d\u4f53\u4f1a\u7a33\u5b9a\u7684\u5047\u8bbe\uff0c\u63d0\u793a\u6a21\u578b\u884c\u4e3a\u6536\u655b\u540e\uff0c\u795e\u7ecf\u5143\u5c42\u9762\u7684\u529f\u80fd\u5b9a\u4f4d\u4ecd\u53ef\u80fd\u5931\u6548\u3002"}, {"abstract": "Building on recent progress in machine learning for formal theorem proving in Lean, we introduce LeanDojo-v2: an end-to-end framework that unifies repository data extraction, LLM fine-tuning, proof search, AI autocompletion, and LLM-assisted theorem proving in a single software library. In addition, we provide Lean4Code, a lightweight IDE that integrates the various features of LeanDojo-v2 through a simple, mathematician-friendly UI. These tools will enable mathematicians and researchers to easily fine-tune language models on domain-specific Lean codebases and experiment with LLM-assisted theorem proving without a complex setup.", "arxiv_id": "2611.09048", "arxiv_url": "https://arxiv.org/abs/2611.09048", "authors": ["Ryan Hsiang", "William Adkisson", "Robert Joseph George", "Anima Anandkumar"], "brief": "LeanDojo-v2\u5c06\u4ee3\u7801\u4ed3\u5e93\u6570\u636e\u63d0\u53d6\u3001\u8bed\u8a00\u6a21\u578b\u5fae\u8c03\u3001\u8bc1\u660e\u641c\u7d22\u4e0e\u81ea\u52a8\u8865\u5168\u96c6\u6210\u5230\u7edf\u4e00\u8f6f\u4ef6\u5e93\uff0c\u5e76\u63d0\u4f9b\u8f7b\u91cfIDE Lean4Code\u4f5c\u4e3a\u4ea4\u4e92\u5165\u53e3\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09048", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["LeanDojo-v2\u7edf\u4e00\u6570\u636e\u63d0\u53d6\u3001\u5fae\u8c03\u4e0e\u8bc1\u660e\u641c\u7d22", "\u652f\u6301\u5728\u9886\u57df\u4e13\u7528Lean\u4ee3\u7801\u5e93\u4e0a\u5fae\u8c03\u8bed\u8a00\u6a21\u578b", "Lean4Code\u4ee5\u8f7b\u91cfIDE\u96c6\u6210\u8865\u5168\u4e0e\u8f85\u52a9\u8bc1\u660e"], "keywords": ["\u5f62\u5f0f\u5316\u8bc1\u660e", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5fae\u8c03", "\u5f00\u53d1\u5de5\u5177"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09048v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LeanDojo-v2: A Comprehensive Library for AI-Assisted Theorem Proving in Lean", "tldr": "\u5c06\u6570\u636e\u63d0\u53d6\u3001\u6a21\u578b\u5fae\u8c03\u4e0e\u8bc1\u660e\u641c\u7d22\u6574\u5408\uff0c\u964d\u4f4e\u8bed\u8a00\u6a21\u578b\u8f85\u52a9\u5f62\u5f0f\u5316\u8bc1\u660e\u95e8\u69db\u3002", "upvotes": 0, "what_it_is": "LeanDojo-v2\u5c06\u4ee3\u7801\u4ed3\u5e93\u6570\u636e\u63d0\u53d6\u3001\u8bed\u8a00\u6a21\u578b\u5fae\u8c03\u3001\u8bc1\u660e\u641c\u7d22\u4e0e\u81ea\u52a8\u8865\u5168\u96c6\u6210\u5230\u7edf\u4e00\u8f6f\u4ef6\u5e93\uff0c\u5e76\u63d0\u4f9b\u8f7b\u91cfIDE Lean4Code\u4f5c\u4e3a\u4ea4\u4e92\u5165\u53e3\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u6253\u901a\u5f62\u5f0f\u5316\u8bc1\u660e\u7684\u6a21\u578b\u8bad\u7ec3\u4e0e\u4ea4\u4e92\u4f7f\u7528\u6d41\u7a0b\uff0c\u8ba9\u6570\u5b66\u5bb6\u548c\u7814\u7a76\u8005\u66f4\u5bb9\u6613\u57fa\u4e8e\u9886\u57df\u4ee3\u7801\u5f00\u5c55\u5b9e\u9a8c\uff0c\u51cf\u5c11\u5de5\u5177\u914d\u7f6e\u8d1f\u62c5\u3002"}, {"abstract": "Routers typically choose a model per query by trading predicted correctness against cost. Most price each model at a fixed cost, as if every query used the same number of output tokens, but the out
