put length of reasoning models varies by an order of magnitude across queries. When is per-query cost worth predicting? What factors drive cost? How cheaply can predictions be made? We predict both the success probability and the output length of candidate models from the prefill activations of a single small frozen LLM, the scout. With reasoning candidates, perfect per-query cost knowledge would save 29-61% of spending on eight of nine datasets, and much less with non-reasoning candidates on the same problems. On those eight datasets, our predicted costs save 9-33% at matched accuracy relative to median-length pricing, up to 69% of what perfect knowledge would save. They are significantly cheaper than each estimator we reimplemented or adapted from published work, including ZeroRouter and a MixLLM-style predictor, on a majority of datasets. Output length depends mostly on the problem. On most math and code datasets, harder problems are longer, so predicted success alone prices cost nearly as well. On knowledge and mixed-format datasets they are not, and predicted success falls well behind a probe trained on length. The probe keeps most of its saving with 20 labelled problems and transfers without labels to four of seven new benchmarks. On a mixture of all nine benchmarks, it saves 22% beyond pricing each benchmark at its own median length. Savings stop growing at about a 2B scout, so above 4B a larger scout costs more than it adds.", "arxiv_id": "2611.09028", "arxiv_url": "https://arxiv.org/abs/2611.09028", "authors": ["Aristides Milios", "Christopher Pal"], "brief": "\u7814\u7a76\u7528\u5355\u4e2a\u51bb\u7ed3\u5c0f\u6a21\u578b\u7684\u9884\u586b\u5145\u6fc0\u6d3b\uff0c\u9884\u6d4b\u5019\u9009\u6a21\u578b\u7684\u6210\u529f\u7387\u4e0e\u8f93\u51fa\u957f\u5ea6\uff0c\u518d\u636e\u6b64\u8def\u7531\u67e5\u8be2\u3002\u76f8\u6bd4\u56fa\u5b9a\u957f\u5ea6\u8ba1\u4ef7\uff0c\u5b83\u80fd\u5728\u4fdd\u6301\u51c6\u786e\u7387\u65f6\u964d\u4f4e\u63a8\u7406\u652f\u51fa\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09028", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u516b\u4e2a\u6570\u636e\u96c6\u4e0a\uff0c\u540c\u7b49\u51c6\u786e\u7387\u4e0b\u8282\u77019\u201333%\u652f\u51fa", "\u957f\u5ea6\u63a2\u9488\u4ec5\u752820\u4e2a\u6807\u6ce8\u95ee\u9898\u4ecd\u4fdd\u7559\u591a\u6570\u8282\u7701", "\u7ea62B\u4fa6\u5bdf\u6a21\u578b\u540e\u6536\u76ca\u8d8b\u5e73\uff0c\u8d85\u8fc74B\u6210\u672c\u5f97\u4e0d\u507f\u5931"], "keywords": ["\u6a21\u578b\u8def\u7531", "\u63a8\u7406\u6210\u672c", "\u957f\u5ea6\u9884\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09028v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Scout Before You Route: Predicting Task Success and Token Count from a Small LLM Prefill", "tldr": "\u7528\u5c0f\u6a21\u578b\u9884\u586b\u5145\u7279\u5f81\u9884\u6d4b\u4efb\u52a1\u6210\u8d25\u4e0e\u8f93\u51fa\u957f\u5ea6\uff0c\u5b9e\u73b0\u66f4\u7701\u94b1\u7684\u6a21\u578b\u8def\u7531\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528\u5355\u4e2a\u51bb\u7ed3\u5c0f\u6a21\u578b\u7684\u9884\u586b\u5145\u6fc0\u6d3b\uff0c\u9884\u6d4b\u5019\u9009\u6a21\u578b\u7684\u6210\u529f\u7387\u4e0e\u8f93\u51fa\u957f\u5ea6\uff0c\u518d\u636e\u6b64\u8def\u7531\u67e5\u8be2\u3002\u76f8\u6bd4\u56fa\u5b9a\u957f\u5ea6\u8ba1\u4ef7\uff0c\u5b83\u80fd\u5728\u4fdd\u6301\u51c6\u786e\u7387\u65f6\u964d\u4f4e\u63a8\u7406\u652f\u51fa\u3002", "why_notable": "\u628a\u9010\u67e5\u8be2\u8f93\u51fa\u957f\u5ea6\u7eb3\u5165\u8def\u7531\u6210\u672c\u4f30\u8ba1\uff0c\u4e5d\u4e2a\u57fa\u51c6\u6df7\u5408\u6d4b\u8bd5\u4e2d\u989d\u5916\u7701\u8d3922%\uff1b\u4e5f\u63ed\u793a\u6210\u529f\u7387\u4e0d\u80fd\u5728\u6240\u6709\u4efb\u52a1\u4e0a\u66ff\u4ee3\u957f\u5ea6\u9884\u6d4b\u3002"}, {"abstract": "Weak supervisors are usually judged by their own errors, but what matters is what a student learns from them. For squared loss and any linear learner shared by all supervisors, we show that a supervisor\u0027s value is determined by its errors after they pass through the student\u0027s learning operator. Consequently, the inner products of the supervisors\u0027 raw errors can be compatible with every feasible value of the student\u0027s risk, and weighting supervisors by them can be arbitrarily worse than the best weighting in relative excess risk. This student-relative value is not identifiable from unlabeled data, but what is missing is small: one finite-dimensional projection of the target decides whether training on a weak aggregate helps, another decides how to weight the supervisors. Known teacher training rules, or a label-model condition stated in student-relative form, shrink it further. Clean labels close the remaining gap at a cost set by the geometry of the unresolved directions rather than by the dimension of the student\u0027s representation, with matching worst-case lower bounds. In Gaussian designs we also quantify when exact teacher structure beats ordinary stacking and when weak supervisors, combined with clean labels, beat every procedure that uses the clean labels alone. The guarantees extend to fitted ridge students and finite unlabeled data.", "arxiv_id": "2611.08959", "arxiv_url": "https://arxiv.org/abs/2611.08959", "authors": ["Romano Li", "Xunfan Cai"], "brief": "\u7814\u7a76\u5982\u4f55\u6309\u5b66\u751f\u6700\u7ec8\u98ce\u9669\u9009\u62e9\u548c\u52a0\u6743\u5f31\u76d1\u7763\u8005\u3002\u5728\u5e73\u65b9\u635f\u5931\u4e0e\u5171\u4eab\u7ebf\u6027\u5b66\u4e60\u5668\u4e0b\uff0c\u5c06\u6559\u5e08\u8bef\u5dee\u901a\u8fc7\u5b66\u751f\u5b66\u4e60\u7b97\u5b50\u540e\u7684\u7ed3\u679c\u4f5c\u4e3a\u4ef7\u503c\u4f9d\u636e\uff0c\u5e76\u523b\u753b\u6240\u9700\u5e72\u51c0\u6807\u7b7e\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08959", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6309\u539f\u59cb\u8bef\u5dee\u5185\u79ef\u52a0\u6743\uff0c\u76f8\u5bf9\u8d85\u989d\u98ce\u9669\u53ef\u4efb\u610f\u52a3\u4e8e\u6700\u4f18", "\u4e24\u4e2a\u6709\u9650\u7ef4\u76ee\u6807\u6295\u5f71\u5206\u522b\u51b3\u5b9a\u805a\u5408\u6536\u76ca\u4e0e\u6700\u4f18\u6743\u91cd", "\u6807\u7b7e\u6210\u672c\u7531\u672a\u89e3\u65b9\u5411\u7684\u51e0\u4f55\u51b3\u5b9a\uff0c\u5e76\u7ed9\u51fa\u5339\u914d\u4e0b\u754c"], "keywords": ["\u5f31\u76d1\u7763", "\u77e5\u8bc6\u84b8\u998f", "\u6cdb\u5316\u7406\u8bba", "\u6807\u7b7e\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08959v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Accuracy Is Not Value: Choosing Weak Supervisors by What the Student Inherits", "tldr": "\u5f31\u76d1\u7763\u8005\u7684\u4ef7\u503c\u53d6\u51b3\u4e8e\u5b66\u751f\u7ee7\u627f\u7684\u8bef\u5dee\uff0c\u800c\u975e\u76d1\u7763\u8005\u81ea\u8eab\u7684\u9884\u6d4b\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5982\u4f55\u6309\u5b66\u751f\u6700\u7ec8\u98ce\u9669\u9009\u62e9\u548c\u52a0\u6743\u5f31\u76d1\u7763\u8005\u3002\u5728\u5e73\u65b9\u635f\u5931\u4e0e\u5171\u4eab\u7ebf\u6027\u5b66\u4e60\u5668\u4e0b\uff0c\u5c06\u6559\u5e08\u8bef\u5dee\u901a\u8fc7\u5b66\u751f\u5b66\u4e60\u7b97\u5b50\u540e\u7684\u7ed3\u679c\u4f5c\u4e3a\u4ef7\u503c\u4f9d\u636e\uff0c\u5e76\u523b\u753b\u6240\u9700\u5e72\u51c0\u6807\u7b7e\u3002", "why_notable": "\u628a\u5f31\u76d1\u7763\u8bc4\u4ef7\u4ece\u6559\u5e08\u51c6\u786e\u7387\u8f6c\u5411\u5b66\u751f\u5b9e\u9645\u6536\u76ca\uff0c\u4e3a\u6559\u5e08\u52a0\u6743\u4e0e\u6807\u7b7e\u9884\u7b97\u63d0\u4f9b\u7406\u8bba\u4f9d\u636e\uff1b\u9ad8\u65af\u8bbe\u8ba1\u4e0b\u8fd8\u523b\u753b\u4e86\u5f31\u76d1\u7763\u4f18\u4e8e\u4ec5\u7528\u5e72\u51c0\u6807\u7b7e\u7684\u6761\u4ef6\u3002"}, {"abstract": "Diffusion language models (DLMs) enable parallel token generation through iterative denoising, yet their inference remains costly due to repeated attention over a growing historical prefix and repeated processing of the entire current generation block. Historical attention becomes increasingly expensive as generation progresses, while all current-block positions are propagated through the Transformer at every denoising step even though only a small fraction are typically resolved at that step. In this paper, we introduce Duet, a training-free dual-sparse inference framework that addresses these challenges through prefix Key-Value (KV) sparsity and early query sparsity, respectively. Specifically, Duet exploits the concentration and cross-step stability of historical attention within each generation block to construct a compact historical KV subset that is reused across denoising steps. For query sparsity, Duet predicts update positions from shallow representations and propagates only the corresponding queries through the suffix Transformer layers, avoiding deep computation at positions unlikely to be updated in the current step. Experiments show that Duet maintains competitive accuracy while achieving 1.34$\\times$/2.83$\\times$ end-to-end/per-step speedups on LLaDA2.1-mini and 2.41$\\times$/4.72$\\times$ on SDAR-8B-Chat-b32 at a 32K context length.", "arxiv_id": "2611.09239", "arxiv_url": "https://arxiv.org/abs/2611.09239", "authors": ["Siyuan Yan", "Shen Gu", "Xiaoxing Ma", "Chun Cao", "Jingwei Xu"], "brief": "DUET\u662f\u4e00\u79cd\u514d\u8bad\u7ec3\u63a8\u7406\u6846\u67b6\uff0c\u4e3a\u6bcf\u4e2a\u751f\u6210\u5757\u7b5b\u9009\u5e76\u590d\u7528\u5386\u53f2KV\u5b50\u96c6\uff0c\u518d\u7528\u6d45\u5c42\u8868\u793a\u9884\u6d4b\u5f85\u66f4\u65b0\u4f4d\u7f6e\uff0c\u4ec5\u8ba9\u5bf9\u5e94\u67e5\u8be2\u8fdb\u5165\u540e\u7eed\u6df1\u5c42\u8ba1\u7b97\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09239", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u524d\u7f00KV\u7a00\u758f\u5316\u5229\u7528\u5386\u53f2\u6ce8\u610f\u529b\u96c6\u4e2d\u6027\u4e0e\u8de8\u6b65\u7a33\u5b9a\u6027", "\u65e9\u671f\u67e5\u8be2\u7a00\u758f\u5316\u4ee5\u6d45\u5c42\u8868\u793a\u9884\u6d4b\u5f53\u524d\u6b65\u66f4\u65b0\u4f4d\u7f6e", "32K\u4e0a\u4e0b\u6587\u4e0b\uff0c\u4e24\u6a21\u578b\u7aef\u5230\u7aef\u52a0\u901f1.34\u500d\u548c2.41\u500d"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u7a00\u758f\u63a8\u7406", "\u63a8\u7406\u52a0\u901f", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09239v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DUET: Dual-Sparse Inference for Block Diffusion Language Models", "tldr": "\u901a\u8fc7\u5386\u53f2\u7f13\u5b58\u4e0e\u5f53\u524d\u67e5\u8be2\u53cc\u91cd\u7a00\u758f\u5316\uff0c\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u52a0\u901f\u5757\u6269\u6563\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": "DUET\u662f\u4e00\u79cd\u514d\u8bad\u7ec3\u63a8\u7406\u6846\u67b6\uff0c\u4e3a\u6bcf\u4e2a\u751f\u6210\u5757\u7b5b\u9009\u5e76\u590d\u7528\u5386\u53f2KV\u5b50\u96c6\uff0c\u518d\u7528\u6d45\u5c42\u8868\u793a\u9884\u6d4b\u5f85\u66f4\u65b0\u4f4d\u7f6e\uff0c\u4ec5\u8ba9\u5bf9\u5e94\u67e5\u8be2\u8fdb\u5165\u540e\u7eed\u6df1\u5c42\u8ba1\u7b97\u3002", "why_notable": "\u540c\u65f6\u524a\u51cf\u5386\u53f2\u6ce8\u610f\u529b\u5f00\u9500\u548c\u5f53\u524d\u5757\u7684\u5197\u4f59\u6df1\u5c42\u8ba1\u7b97\uff0c\u5728\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7cbe\u5ea6\u7684\u540c\u65f6\u63d0\u5347\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u6548\u7387\uff0c\u4e14\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u3002"}, {"abstract": "Large language models (LLMs) are increasingly used for creative tasks such as writing, design, and idea generation. For these uses, it matters whether a model\u0027s ideas depart from familiar examples or stay close to them. Novelty is one standard measure of creativity, and current creativity evaluations ask human experts or LLM judges to rate how novel an output is. However, these ratings have no fixed reference for what counts as novel (or, in other terms, departure from the familiar). Measuring this departure requires a task with known familiar defaults. The structured imagination task from cognitive psychology is such a task. In this creativity test, people imagine a creature from another planet. The departure from features of Earth animals, such as bilateral symmetry and legs as mode of locomotion, is used as measure of creativity. We introduce AlienBench, a benchmark that adapts the structured imagination task to language models. Models describe alien creatures, and a panel of three LLM judges extracts ten biological features from the description and labels them as either Earth-typical or a departure. The sum of feature departures is the score of a description, from 0 to 10. Each model describes alien creatures under six prompt conditions that vary the framing of the task and the planetary environment. Each model generates 30 descriptions per condition (180 in total), and its overall score is the mean across these descriptions. We evaluate 10 language models, from frontier to open-weight models. Overall scores range from 3.28 (GPT-6 Luna) to 6.55 (Ministral 3 14B). Interestingly, open-weight models score higher than proprietary models in this task (5.40 vs. 4.58). Under the baseline prompt, the models depart from Earth defaults more often on average than 100 human participants on every feature. We release all prompts, generations, judge outputs, and scores.", "arxiv_id": "2611.09094", "arxiv_url": "https://arxiv.org/abs/2611.09094", "authors": ["Jonas Oppenlaender", "Johanna M. Silvennoinen"], "brief": "AlienBench\u5c06\u8ba4\u77e5\u5fc3\u7406\u5b66\u7684\u7ed3\u6784\u5316\u60f3\u8c61\u4efb\u52a1\u6539\u9020\u6210\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b\uff1a\u8ba9\u6a21\u578b\u63cf\u8ff0\u5916\u661f\u751f\u7269\uff0c\u518d\u7531\u4e09\u540d\u6a21\u578b\u88c1\u5224\u63d0\u53d6\u751f\u7269\u7279\u5f81\uff0c\u6309\u504f\u79bb\u5730\u7403\u52a8\u7269\u5e38\u6001\u7684\u7a0b\u5ea6\u8bc4\u5206\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09094", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e09\u540d\u6a21\u578b\u88c1\u5224\u6807\u6ce810\u9879\u751f\u7269\u7279\u5f81\uff0c\u8ba1\u52060\u81f310", "\u8bc4\u6d4b10\u4e2a\u6a21\u578b\uff0c\u6bcf\u4e2a\u57286\u79cd\u63d0\u793a\u4e0b\u751f\u6210180\u4efd\u63cf\u8ff0", "\u5f00\u653e\u6743\u91cd\u6a21\u578b\u5747\u52065.40\uff0c\u4e13\u6709\u6a21\u578b\u5747\u52064.58"], "keywords": ["\u521b\u9020\u529b\u8bc4\u6d4b", "\u7ed3\u6784\u65b0\u9896\u6027", "\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u88c1\u5224"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09094v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AlienBench: A Benchmark of Structural Novelty in Language Model Outputs", "tldr": "\u4ee5\u5916\u661f\u751f\u7269\u8bbe\u5b9a\u91cf\u5316\u6a21\u578b\u7684\u7ed3\u6784\u65b0\u9896\u6027\uff0c\u5f00\u653e\u6743\u91cd\u6a21\u578b\u5728\u8be5\u4efb\u52a1\u4e2d\u5f97\u5206\u66f4\u9ad8\u3002", "upvotes": 0, "what_it_is": "AlienBench\u5c06\u8ba4\u77e5\u5fc3\u7406\u5b66\u7684\u7ed3\u6784\u5316\u60f3\u8c61\u4efb\u52a1\u6539\u9020\u6210\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b\uff1a\u8ba9\u6a21\u578b\u63cf\u8ff0\u5916\u661f\u751f\u7269\uff0c\u518d\u7531\u4e09\u540d\u6a21\u578b\u88c1\u5224\u63d0\u53d6\u751f\u7269\u7279\u5f81\uff0c\u6309\u504f\u79bb\u5730\u7403\u52a8\u7269\u5e38\u6001\u7684\u7a0b\u5ea6\u8bc4\u5206\u3002", "why_notable": "\u4ee5\u5730\u7403\u52a8\u7269\u7279\u5f81\u63d0\u4f9b\u660e\u786e\u7684\u65b0\u9896\u6027\u53c2\u7167\uff0c\u51cf\u5c11\u4e3b\u89c2\u8bc4\u5206\u7684\u5c3a\u5ea6\u6a21\u7cca\uff1b\u516c\u5f00\u63d0\u793a\u3001\u751f\u6210\u4e0e\u88c1\u5224\u7ed3\u679c\uff0c\u4fbf\u4e8e\u590d\u73b0\u548c\u6bd4\u8f83\u3002"}, {"abstract": "Existing multilingual retrieval-augmented generation relies heavily on learned retrievers and similarity-based ranking from multilingual collections, which are vulnerable to cross-lingual retrieval errors and indexing overhead. In this paper, we explore retriever-free multilingual search, where the model directly interacts with raw corpora through executable shell commands. This paradigm shifts the bottleneck to multilingual search action generation, where exact search is sensitive to entity surface forms and outcome-only supervision provides limited guidance for multi-turn search. To address these challenges, we propose MARS, a multilingual search agent in direct corpus interaction (DCI) with reinforcement learning (RL). MARS introduces corpus-native entity grounding to recover reliable lexical anchors from corpus evidence, mitigating failure to retrieve evidence. Meanwhile, we present a redundancy-aware search reward to encourage concise and effective search trajectories, addressing training collapse in RL of multilingual scenarios. Experiments show that \\ours~consistently outperforms strong retrieval-based and DCI baselines, while demonstrating robust cross-lingual generalization and substantially reducing redundant corpus interactions.", "arxiv_id": "2611.09090", "arxiv_url": "https://arxiv.org/abs/2611.09090", "authors": ["Rui Qi", "Yunlong Liang", "Yufeng Chen", "Jinan Xu", "Fandong Meng", "Kaiyu Huang"], "brief": "MARS\u8ba9\u6a21\u578b\u901a\u8fc7\u53ef\u6267\u884c\u7684\u547d\u4ee4\u884c\u6307\u4ee4\u76f4\u63a5\u641c\u7d22\u539f\u59cb\u8bed\u6599\uff0c\u5e76\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u641c\u7d22\u7b56\u7565\u3002\u6838\u5fc3\u662f\u4ece\u8bed\u6599\u8bc1\u636e\u6062\u590d\u5b9e\u4f53\u8bcd\u9762\u951a\u70b9\uff0c\u540c\u65f6\u4ee5\u5197\u4f59\u611f\u77e5\u5956\u52b1\u4f18\u5316\u591a\u8f6e\u641c\u7d22\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09090", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["DCI\u4ee5\u53ef\u6267\u884c\u547d\u4ee4\u76f4\u63a5\u8bbf\u95ee\u8bed\u6599\uff0c\u65e0\u9700\u5b66\u4e60\u5f0f\u68c0\u7d22\u5668", "\u8bed\u6599\u539f\u751f\u5b9e\u4f53\u951a\u5b9a\u6062\u590d\u8bcd\u9762\u7ebf\u7d22\uff0c\u51cf\u5c11\u8bc1\u636e\u641c\u7d22\u5931\u8d25", "\u5197\u4f59\u611f\u77e5\u641c\u7d22\u5956\u52b1\u538b\u7f29\u4ea4\u4e92\uff0c\u5e76\u7f13\u89e3\u591a\u8bed\u8a00\u5f3a\u5316\u5b66\u4e60\u5d29\u6e83"], "keywords": ["\u591a\u8bed\u8a00\u641c\u7d22", "\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u8bc1\u636e\u83b7\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09090v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MARS: Training Multilingual Search Agents for Retriever-Free Evidence Acquisition", "tldr": "\u901a\u8fc7\u5b9e\u4f53\u951a\u5b9a\u4e0e\u5197\u4f59\u611f\u77e5\u5956\u52b1\uff0c\u8bad\u7ec3\u65e0\u9700\u68c0\u7d22\u5668\u7684\u591a\u8bed\u8a00\u641c\u7d22\u667a\u80fd\u4f53\u3002", "upvotes": 0, "what_it_is": "MARS\u8ba9\u6a21\u578b\u901a\u8fc7\u53ef\u6267\u884c\u7684\u547d\u4ee4\u884c\u6307\u4ee4\u76f4\u63a5\u641c\u7d22\u539f\u59cb\u8bed\u6599\uff0c\u5e76\u7528\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u641c\u7d22\u7b56\u7565\u3002\u6838\u5fc3\u662f\u4ece\u8bed\u6599\u8bc1\u636e\u6062\u590d\u5b9e\u4f53\u8bcd\u9762\u951a\u70b9\uff0c\u540c\u65f6\u4ee5\u5197\u4f59\u611f\u77e5\u5956\u52b1\u4f18\u5316\u591a\u8f6e\u641c\u7d22\u3002", "why_notable": "\u7ed3\u679c\u4f18\u4e8e\u5f3a\u68c0\u7d22\u5f0f\u4e0e\u76f4\u63a5\u8bed\u6599\u4ea4\u4e92\u57fa\u7ebf\uff0c\u5e76\u5c55\u73b0\u8de8\u8bed\u8a00\u6cdb\u5316\u80fd\u529b\uff0c\u4e3a\u964d\u4f4e\u591a\u8bed\u8a00\u8bc1\u636e\u83b7\u53d6\u7684\u7d22\u5f15\u8d1f\u62c5\u548c\u5197\u4f59\u4ea4\u4e92\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "As language agents tackle increasingly complex tasks, they increasingly rely on multiple agents to coordinate specialized work, requiring decisions not only about what each subagent should do but also which tools and workspace resources it should access. Existing agent systems provide mechanisms for controlling tools and execution environments, but do not directly specify the resources required by each delegated subtask. Moreover, task outcomes and execution trajectories alone provide limited supervision for determining whether a subagent has received appropriate permissions. We observe that Agent Skills encode procedural knowledge describing the operations, tools, and files required at each step, providing a natural source of supervision for authorization. Building on this observation, we synthesize tasks and step-by-step procedures from Skills, execute them through subagent delegation in interactive environments, and use verified trajectories to construct training data for task execution and authorization. On ClawArena-Team, our method improves tool permission precision by 13.4 percentage points and workspace permission precision by 24.1 percentage points, while increasing overall task success by 11.6 percentage points for Qwen3.5-35B-A3B. On Terminal-Bench 2.1 and SkillsBench, our method remains competitive with existing agent data synthesis approaches. These results show that the procedural knowledge embedded in Agent Skills provides a source of supervision for precise subagent orchestration that task outcomes alone cannot provide.", "arxiv_id": "2611.08905", "arxiv_url": "https://arxiv.org/abs/2611.08905", "authors": ["Wenkai Yu", "Ning Ding", "Wentao Zhang", "Yehui Tang"], "brief": "\u4ece Agent Skills \u5408\u6210\u4efb\u52a1\u4e0e\u5206\u6b65\u6d41\u7a0b\uff0c\u5728\u4ea4\u4e92\u73af\u5883\u4e2d\u901a\u8fc7\u5b50\u667a\u80fd\u4f53\u59d4\u6d3e\u6267\u884c\uff0c\u518d\u7528\u9a8c\u8bc1\u540e\u7684\u8f68\u8ff9\u6784\u5efa\u8bad\u7ec3\u6570\u636e\uff0c\u8054\u5408\u5b66\u4e60\u4efb\u52a1\u6267\u884c\u53ca\u5de5\u5177\u3001\u5de5\u4f5c\u533a\u6388\u6743\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.08905", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["Agent Skills \u6d41\u7a0b\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u6743\u9650\u76d1\u7763", "ClawArena-Team \u5de5\u5177\u3001\u5de5\u4f5c\u533a\u7cbe\u5ea6\u589e13.4\u300124.1\u4e2a\u767e\u5206\u70b9", "Qwen3.5-35B-A3B\u4efb\u52a1\u6210\u529f\u7387\u589e11.6\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u6743\u9650\u63a7\u5236", "\u8bad\u7ec3\u6570\u636e\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.08905v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Procedures to Permissions: Learning Precise Subagent Authorization from Agent Skills", "tldr": "\u5229\u7528\u6280\u80fd\u4e2d\u7684\u64cd\u4f5c\u6d41\u7a0b\u5b66\u4e60\u5b50\u667a\u80fd\u4f53\u7cbe\u786e\u6388\u6743\uff0c\u540c\u65f6\u63d0\u5347\u6743\u9650\u7cbe\u5ea6\u4e0e\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": "\u4ece Agent Skills \u5408\u6210\u4efb\u52a1\u4e0e\u5206\u6b65\u6d41\u7a0b\uff0c\u5728\u4ea4\u4e92\u73af\u5883\u4e2d\u901a\u8fc7\u5b50\u667a\u80fd\u4f53\u59d4\u6d3e\u6267\u884c\uff0c\u518d\u7528\u9a8c\u8bc1\u540e\u7684\u8f68\u8ff9\u6784\u5efa\u8bad\u7ec3\u6570\u636e\uff0c\u8054\u5408\u5b66\u4e60\u4efb\u52a1\u6267\u884c\u53ca\u5de5\u5177\u3001\u5de5\u4f5c\u533a\u6388\u6743\u3002", "why_notable": "\u5c06\u6280\u80fd\u6d41\u7a0b\u8f6c\u5316\u4e3a\u6388\u6743\u76d1\u7763\uff0c\u8865\u8db3\u4ec5\u9760\u4efb\u52a1\u7ed3\u679c\u96be\u4ee5\u5224\u65ad\u6743\u9650\u662f\u5426\u5408\u7406\u7684\u7f3a\u53e3\uff0c\u8ba9\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u517c\u987e\u8bbf\u95ee\u6743\u9650\u7cbe\u5ea6\u4e0e\u6267\u884c\u6548\u679c\u3002"}, {"abstract": "Policy entropy is widely used to diagnose exploration and collapse in reinforcement learning with verifiable rewards (RLVR), yet its magnitude does not consistently track reasoning performance across optimization objectives. We argue that this ambiguity arises because global token entropy conflates uncertainty in successful and failed trajectories, diversity across correct solution strategies, and variation among realizations of the same strategy. We introduce \\textbf{Reward-Conditioned Entropy Allocation (RCEA)}, a hierarchical diagnostic framework that separates complete-trajectory entropy from average token entropy, conditions uncertainty on verifier outcome and process validity, measures correct-solution-mode retention, and connects these population-level quantities to local covariance-driven updates. In controlled sweeps over six RLVR objectives at two model scales, entropy trajectories do not induce a stable ordering of reasoning accuracy. Token entropy is higher for verifier-failed than successful trajectories under both broad separately aggregated estimates and a common-question paired analysis, whose confidence intervals exclude equality at 10 of 12 displayed endpoints. A local covariance approximation predicts the direction of adjacent-checkpoint entropy change in 95.5\\% of nonfailed transitions; a reward-stratified endpoint proxy further shows that positive chosen-token covariance is more tail-concentrated within failed prefixes. Every reportable trained endpoint exhibits some contraction in independently audited correct-solution-mode breadth, whose positive association with large-\\(k\\) coverage remains exploratory. These results show that entropy collapse should be diagnosed by which uncertainty is removed, rather than by global entropy alone.", "arxiv_id": "2611.09448", "arxiv_url": "https://arxiv.org/abs/2611.09448", "authors": ["Song Yu", "Li Li", "Zhenming Wu"], "brief": "\u63d0\u51fa\u5956\u52b1\u6761\u4ef6\u71b5\u5206\u914d\u6846\u67b6RCEA\uff0c\u533a\u5206\u8f68\u8ff9\u71b5\u4e0e\u8bcd\u5143\u71b5\uff0c\u5e76\u6309\u9a8c\u8bc1\u7ed3\u679c\u548c\u8fc7\u7a0b\u6709\u6548\u6027\u5206\u5c42\uff0c\u7ed3\u5408\u6b63\u786e\u89e3\u6cd5\u6a21\u5f0f\u4fdd\u7559\u5ea6\u4e0e\u5c40\u90e8\u534f\u65b9\u5dee\u5206\u6790\u8bad\u7ec3\u53d8\u5316\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09448", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d66\u79cdRLVR\u4f18\u5316\u76ee\u6807\u30012\u4e2a\u6a21\u578b\u89c4\u6a21", "\u914d\u5bf9\u5206\u6790\u4e2d\uff0c10/12\u4e2a\u7aef\u70b9\u7684\u5931\u8d25\u8f68\u8ff9\u8bcd\u5143\u71b5\u663e\u8457\u66f4\u9ad8", "\u5c40\u90e8\u534f\u65b9\u5dee\u8fd1\u4f3c\u9884\u6d4b\u71b5\u53d8\u5316\u65b9\u5411\uff0c\u51c6\u786e\u738795.5%"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u53ef\u9a8c\u8bc1\u5956\u52b1", "\u7b56\u7565\u71b5", "\u63a8\u7406\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09448v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Not All Entropy Is Equal: Reward-Conditioned Entropy Allocation in Reinforcement Learning with Verifiable Rewards", "tldr": "\u5c06\u7b56\u7565\u71b5\u6309\u5956\u52b1\u4e0e\u89e3\u9898\u6a21\u5f0f\u5206\u89e3\uff0c\u63ed\u793a\u5168\u5c40\u71b5\u65e0\u6cd5\u53ef\u9760\u8861\u91cf\u63a8\u7406\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u5956\u52b1\u6761\u4ef6\u71b5\u5206\u914d\u6846\u67b6RCEA\uff0c\u533a\u5206\u8f68\u8ff9\u71b5\u4e0e\u8bcd\u5143\u71b5\uff0c\u5e76\u6309\u9a8c\u8bc1\u7ed3\u679c\u548c\u8fc7\u7a0b\u6709\u6548\u6027\u5206\u5c42\uff0c\u7ed3\u5408\u6b63\u786e\u89e3\u6cd5\u6a21\u5f0f\u4fdd\u7559\u5ea6\u4e0e\u5c40\u90e8\u534f\u65b9\u5dee\u5206\u6790\u8bad\u7ec3\u53d8\u5316\u3002", "why_notable": "\u628a\u71b5\u574d\u7f29\u8bca\u65ad\u4ece\u603b\u91cf\u4e0b\u964d\u8f6c\u5411\u4e0d\u786e\u5b9a\u6027\u7684\u53bb\u5411\uff0c\u6709\u52a9\u4e8e\u533a\u5206\u65e0\u6548\u63a2\u7d22\u51cf\u5c11\u4e0e\u6b63\u786e\u89e3\u6cd5\u591a\u6837\u6027\u53d7\u635f\u3002"}, {"abstract": "Actor-critic methods optimize a parametrized policy using a critic to estimate their policy gradient. Recent work has shown that conditioning the critic on features of future states, actions, or rewards can improve sample efficiency and even final return. However, existing methods are restricted to exogenous features (independent of actions), overlooking endogenous features (dependent on actions) that may be crucial for credit assignment. We introduce the future-informed value function, which can be conditioned on both exogenous and endogenous features of future states, actions, and rewards. Then, we express the policy gradient using this value function, yielding the future-informed policy gradient. Building on that, we propose the future-informed actor-critic algorithm. Empirical results show that this algorithm leveraging endogenous features of the future outperforms standard actor-critic algorithms in environments with noisy and sparse rewards.", "arxiv_id": "2611.09417", "arxiv_url": "https://arxiv.org/abs/2611.09417", "authors": ["Samy Mokeddem", "Gaspard Lambrechts", "Adrien Bolland", "Damien Ernst"], "brief": "\u63d0\u51fa\u672a\u6765\u4fe1\u606f\u4ef7\u503c\u51fd\u6570\uff0c\u540c\u65f6\u5229\u7528\u4e0e\u52a8\u4f5c\u72ec\u7acb\u53ca\u53d7\u52a8\u4f5c\u5f71\u54cd\u7684\u672a\u6765\u72b6\u6001\u3001\u52a8\u4f5c\u548c\u5956\u52b1\u7279\u5f81\u3002\u57fa\u4e8e\u8be5\u51fd\u6570\u63a8\u5bfc\u7b56\u7565\u68af\u5ea6\uff0c\u6784\u5efa\u65b0\u7684\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6\u7b97\u6cd5\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09417", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u672a\u6765\u4fe1\u606f\u4ef7\u503c\u51fd\u6570\u517c\u5bb9\u5916\u751f\u4e0e\u5185\u751f\u7279\u5f81", "\u63a8\u5bfc\u672a\u6765\u4fe1\u606f\u7b56\u7565\u68af\u5ea6\u5e76\u6784\u5efa\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6\u7b97\u6cd5", "\u5728\u566a\u58f0\u4e0e\u7a00\u758f\u5956\u52b1\u73af\u5883\u4e2d\u4f18\u4e8e\u6807\u51c6\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u68af\u5ea6", "\u4ef7\u503c\u4f30\u8ba1", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09417v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Future-Informed Actor-Critic", "tldr": "\u5c06\u53d7\u52a8\u4f5c\u5f71\u54cd\u7684\u672a\u6765\u4fe1\u606f\u7eb3\u5165\u4ef7\u503c\u4f30\u8ba1\uff0c\u6539\u5584\u566a\u58f0\u4e0e\u7a00\u758f\u5956\u52b1\u4e0b\u7684\u7b56\u7565\u5b66\u4e60\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u672a\u6765\u4fe1\u606f\u4ef7\u503c\u51fd\u6570\uff0c\u540c\u65f6\u5229\u7528\u4e0e\u52a8\u4f5c\u72ec\u7acb\u53ca\u53d7\u52a8\u4f5c\u5f71\u54cd\u7684\u672a\u6765\u72b6\u6001\u3001\u52a8\u4f5c\u548c\u5956\u52b1\u7279\u5f81\u3002\u57fa\u4e8e\u8be5\u51fd\u6570\u63a8\u5bfc\u7b56\u7565\u68af\u5ea6\uff0c\u6784\u5efa\u65b0\u7684\u6f14\u5458\u2014\u8bc4\u8bba\u5bb6\u7b97\u6cd5\u3002", "why_notable": "\u7a81\u7834\u6b64\u524d\u672a\u6765\u6761\u4ef6\u8bc4\u8bba\u5bb6\u4ec5\u4f7f\u7528\u5916\u751f\u7279\u5f81\u7684\u9650\u5236\uff0c\u8ba9\u53d7\u52a8\u4f5c\u5f71\u54cd\u7684\u672a\u6765\u4fe1\u606f\u53c2\u4e0e\u4fe1\u7528\u5206\u914d\uff0c\u4e3a\u56f0\u96be\u5956\u52b1\u6761\u4ef6\u4e0b\u7684\u5b66\u4e60\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "In the classification context where revealing the label of a sample is costly, we propose a new Active Learning (AL) strategy named k-Volume (kVol). It randomly selects a sample to be labeled according to the volume of the smallest ball containing its k nearest neighbors. kVol is highly versatile: it can be applied either in the input space or in the output space, and it enjoys the desirable properties of the three main families of AL strategies: density, diversity, and (when performed in the output space) uncertainty. From a theoretical perspective, we establish that kVol is asymptotically equivalent to uniform sampling over the support of the (input or output) data distribution. Based on experiments on various synthetic and real-life tabular datasets and images, we observe that kVol is surprisingly stable: whatever the classifier or the experimental setup, it still lies among the best AL strategies unlike other competitors that fail dramatically. In particular, kVol outperforms state-of-the-art competitors such as CoreSet, TypiClust or Uncertainty on several real-life datasets, at a low computational cost.", "arxiv_id": "2611.09388", "arxiv_url": "https://arxiv.org/abs/2611.09388", "authors": ["Eliot Tron", "Alain Celisse", "Christophe Denis", "Alice Le Brigant"], "brief": "\u63d0\u51fa\u4e3b\u52a8\u5b66\u4e60\u7b56\u7565 kVol\uff0c\u4ee5\u5305\u542b\u6837\u672c k \u4e2a\u8fd1\u90bb\u7684\u6700\u5c0f\u7403\u4f53\u79ef\u51b3\u5b9a\u968f\u673a\u9009\u6837\u6982\u7387\u3002\u53ef\u5728\u8f93\u5165\u6216\u8f93\u51fa\u7a7a\u95f4\u8fd0\u884c\uff0c\u7edf\u4e00\u5bc6\u5ea6\u3001\u591a\u6837\u6027\u53ca\u8f93\u51fa\u7a7a\u95f4\u4e2d\u7684\u4e0d\u786e\u5b9a\u6027\u8003\u91cf\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09388", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["kVol \u6309\u5305\u542b k \u4e2a\u8fd1\u90bb\u7684\u6700\u5c0f\u7403\u4f53\u79ef\u968f\u673a\u9009\u6837", "\u7406\u8bba\u8bc1\u660e\u6e10\u8fd1\u7b49\u4ef7\u4e8e\u5728\u6570\u636e\u5206\u5e03\u652f\u6491\u96c6\u4e0a\u5747\u5300\u91c7\u6837", "\u591a\u4e2a\u771f\u5b9e\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e CoreSet\u3001TypiClust \u7b49"], "keywords": ["\u4e3b\u52a8\u5b66\u4e60", "\u8fd1\u90bb\u65b9\u6cd5", "\u6837\u672c\u9009\u62e9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09388v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "k-Volume: a Unified Active Learning Strategy", "tldr": "\u7528\u8fd1\u90bb\u7403\u4f53\u79ef\u968f\u673a\u9009\u62e9\u5f85\u6807\u6ce8\u6837\u672c\uff0c\u517c\u987e\u591a\u7c7b\u4e3b\u52a8\u5b66\u4e60\u76ee\u6807\u4e0e\u7a33\u5b9a\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e3b\u52a8\u5b66\u4e60\u7b56\u7565 kVol\uff0c\u4ee5\u5305\u542b\u6837\u672c k \u4e2a\u8fd1\u90bb\u7684\u6700\u5c0f\u7403\u4f53\u79ef\u51b3\u5b9a\u968f\u673a\u9009\u6837\u6982\u7387\u3002\u53ef\u5728\u8f93\u5165\u6216\u8f93\u51fa\u7a7a\u95f4\u8fd0\u884c\uff0c\u7edf\u4e00\u5bc6\u5ea6\u3001\u591a\u6837\u6027\u53ca\u8f93\u51fa\u7a7a\u95f4\u4e2d\u7684\u4e0d\u786e\u5b9a\u6027\u8003\u91cf\u3002", "why_notable": "\u4ee5\u4f4e\u8ba1\u7b97\u6210\u672c\u8fde\u63a5\u4e09\u7c7b\u4e3b\u52a8\u5b66\u4e60\u601d\u8def\uff0c\u5e76\u5728\u4e0d\u540c\u5206\u7c7b\u5668\u4e0e\u5b9e\u9a8c\u8bbe\u7f6e\u4e0b\u4fdd\u6301\u9760\u524d\u8868\u73b0\uff0c\u4e3a\u51cf\u5c11\u6602\u8d35\u6807\u6ce8\u63d0\u4f9b\u4e86\u7a33\u5b9a\u7684\u5019\u9009\u65b9\u6848\u3002"}, {"abstract": "Explanation APIs are often treated as increasing model-extraction risk, but an end-to-end attack comparison cannot show whether an explanation reveals model-specific information or merely supplies a convenient next-query coordinate. We study this distinction for explanation-guided extraction of tabular classifiers. We separate an explanation into an attribution channel, which ranks influential features, and a coordinate channel, which supplies candidate feature values for perturbing those features. We then test whether the useful bin edges are privileged to the service or reproducible from the adversary\u0027s own data. Across six datasets and five target families, using attribution rankings to choose which features to perturb provides no systematic extraction advantage. Lime\u0027s discretization bin edges can improve fidelity by up to 41 percentage points on continuous features, but those edges are quantiles of the explainer\u0027s background data rather than properties of the target model. In controlled comparisons, an attacker-side grid reproduces the useful bin-edge gains without querying an explanation API. We use these findings to derive Cutpurse, which combines a self-computed grid with diverse query generation and boundary search. Against a service that withholds bin edges, Cutpurse improves fidelity by 16.3 percentage points on continuous-feature targets. It also exceeds the undefended published attack by 7.0 percentage points. Thus, withholding default Lime bin edges alone does not prevent effective extraction under the in-domain auxiliary-input, probability-output, and same-family surrogate assumptions studied here. Our results concern default Lime and Shap configurations for tabular classifiers. They do not establish the same conclusion for other explainers, target classes, or data-free attackers.", "arxiv_id": "2611.09375", "arxiv_url": "https://arxiv.org/abs/2611.09375", "authors": ["Seyma Selcan Magara", "Hanru Zhang", "Fatme El Zahraa Hamad", "Nico Pfeifer", "Mete Akg\u00fcn"], "brief": "\u7814\u7a76\u5c06\u8868\u683c\u5206\u7c7b\u5668\u7684\u89e3\u91ca\u62c6\u4e3a\u7279\u5f81\u5f52\u56e0\u4e0e\u6270\u52a8\u5750\u6807\u4e24\u4e2a\u901a\u9053\uff0c\u533a\u5206\u5404\u81ea\u8d21\u732e\uff1b\u636e\u6b64\u63d0\u51fa\u7ed3\u5408\u81ea\u5efa\u7f51\u683c\u3001\u591a\u6837\u67e5\u8be2\u548c\u8fb9\u754c\u641c\u7d22\u7684\u6a21\u578b\u7a83\u53d6\u65b9\u6cd5\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09375", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d66\u4e2a\u6570\u636e\u96c6\u30015\u7c7b\u76ee\u6807\uff0c\u5f52\u56e0\u6392\u5e8f\u65e0\u7cfb\u7edf\u6027\u6536\u76ca", "Lime\u5206\u7bb1\u8fb9\u754c\u6700\u591a\u63d0\u534741\u4e2a\u767e\u5206\u70b9\uff0c\u53ef\u7531\u653b\u51fb\u8005\u91cd\u5efa", "Cutpurse\u8f83\u9690\u85cf\u8fb9\u754c\u670d\u52a1\u63d0\u534716.3\u4e2a\u767e\u5206\u70b9"], "keywords": ["\u6a21\u578b\u7a83\u53d6", "\u53ef\u89e3\u91ca\u6027", "\u8868\u683c\u5b66\u4e60", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09375v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cutpurse: Decomposing Explanation-Guided Model Extraction on Tabular Data", "tldr": "\u89e3\u91ca\u5f15\u5bfc\u7684\u6a21\u578b\u7a83\u53d6\u6536\u76ca\u4e3b\u8981\u6765\u81ea\u67e5\u8be2\u5750\u6807\uff0c\u653b\u51fb\u8005\u53ef\u81ea\u884c\u91cd\u5efa", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5c06\u8868\u683c\u5206\u7c7b\u5668\u7684\u89e3\u91ca\u62c6\u4e3a\u7279\u5f81\u5f52\u56e0\u4e0e\u6270\u52a8\u5750\u6807\u4e24\u4e2a\u901a\u9053\uff0c\u533a\u5206\u5404\u81ea\u8d21\u732e\uff1b\u636e\u6b64\u63d0\u51fa\u7ed3\u5408\u81ea\u5efa\u7f51\u683c\u3001\u591a\u6837\u67e5\u8be2\u548c\u8fb9\u754c\u641c\u7d22\u7684\u6a21\u578b\u7a83\u53d6\u65b9\u6cd5\u3002", "why_notable": "\u5c06\u89e3\u91ca\u6cc4\u9732\u4e0e\u67e5\u8be2\u4fbf\u5229\u533a\u5206\u5f00\uff0c\u63ed\u793a\u9690\u85cf\u5206\u7bb1\u8fb9\u754c\u4e0d\u8db3\u4ee5\u963b\u6b62\u7a83\u53d6\uff1b\u7ed3\u8bba\u9650\u5b9a\u4e8e\u540c\u57df\u8f85\u52a9\u6570\u636e\u3001\u6982\u7387\u8f93\u51fa\u4e0e\u540c\u65cf\u66ff\u4ee3\u6a21\u578b\u6761\u4ef6\u3002"}, {"abstract": "Absorption, distribution, metabolism, excretion, and toxicity (ADMET) models often rely on small, heterogeneous datasets, yet their predictions may determine which compounds proceed to experimental testing. Useful evaluations must therefore assess both predictive performance and the quality of reported probabilities or intervals. We ask which common uncertainty-quantification methods perform best on the 22 Therapeutics Data Commons (TDC) ADMET datasets and what this benchmark can resolve. We compare eleven calibrated pipelines using nested five-fold cross-validation across ten chemical partitions and five model seeds. Ensemble Monte Carlo (MC) dropout has the best average rank for TDC performance, Brier score, and 90% interval score. For TDC performance, however, it is not separated from the other ensemble pipelines; for Brier and interval score, LightGBM is also not ruled out as best. LightGBM wins more individual datasets than any other method for TDC performance and Brier score, but performs poorly on several endpoints. Smaller evaluations can identify a different leader and often fail to recover the broader comparison. These results make LightGBM and an ensemble neural model complementary baselines. Comparative claims should be checked across multiple chemical partitions using statistical analyses matched to the question being asked.", "arxiv_id": "2611.09373", "arxiv_url": "https://arxiv.org/abs/2611.09373", "authors": ["Laurits Fredsgaard", "Michael Riis Andersen", "Mikkel N. Schmidt"], "brief": "\u7814\u7a76\u572822\u4e2aTDC\u836f\u7269\u6027\u8d28\u6570\u636e\u96c6\u4e0a\u6bd4\u8f8311\u79cd\u6821\u51c6\u9884\u6d4b\u6d41\u7a0b\uff0c\u540c\u65f6\u8bc4\u4f30\u9884\u6d4b\u4e0e\u4e0d\u786e\u5b9a\u6027\u8d28\u91cf\u3002\u91c7\u7528\u5d4c\u5957\u4ea4\u53c9\u9a8c\u8bc1\u3001\u591a\u5316\u5b66\u5212\u5206\u53ca\u968f\u673a\u79cd\u5b50\u68c0\u9a8c\u6392\u540d\u7a33\u5b9a\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09373", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["11\u79cd\u6d41\u7a0b\u91c7\u7528\u5d4c\u5957\u4e94\u6298\u9a8c\u8bc1\u300110\u79cd\u5316\u5b66\u5212\u5206\u548c5\u4e2a\u79cd\u5b50", "\u96c6\u6210MC dropout\u5728\u9884\u6d4b\u3001Brier\u53ca90%\u533a\u95f4\u8bc4\u5206\u4e0a\u5e73\u5747\u6392\u540d\u6700\u4f73", "LightGBM\u8d62\u5f97\u6700\u591a\u5355\u6570\u636e\u96c6\u9884\u6d4b\u4e0eBrier\u6bd4\u8f83\uff0c\u4f46\u90e8\u5206\u7ec8\u70b9\u8f83\u5dee"], "keywords": ["\u4e0d\u786e\u5b9a\u6027\u91cf\u5316", "\u836f\u7269\u6027\u8d28\u9884\u6d4b", "\u6982\u7387\u6821\u51c6", "\u57fa\u51c6\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09373v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Calibrated Uncertainty Quantification on TDC ADMET: What Can Be Resolved Across 22 Datasets?", "tldr": "\u8de8\u4e8c\u5341\u4e8c\u4e2a\u836f\u7269\u6027\u8d28\u6570\u636e\u96c6\u8bc4\u4f30\u8868\u660e\uff0c\u4e0d\u786e\u5b9a\u6027\u65b9\u6cd5\u6392\u540d\u4f9d\u8d56\u5212\u5206\u4e0e\u6307\u6807\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u572822\u4e2aTDC\u836f\u7269\u6027\u8d28\u6570\u636e\u96c6\u4e0a\u6bd4\u8f8311\u79cd\u6821\u51c6\u9884\u6d4b\u6d41\u7a0b\uff0c\u540c\u65f6\u8bc4\u4f30\u9884\u6d4b\u4e0e\u4e0d\u786e\u5b9a\u6027\u8d28\u91cf\u3002\u91c7\u7528\u5d4c\u5957\u4ea4\u53c9\u9a8c\u8bc1\u3001\u591a\u5316\u5b66\u5212\u5206\u53ca\u968f\u673a\u79cd\u5b50\u68c0\u9a8c\u6392\u540d\u7a33\u5b9a\u6027\u3002", "why_notable": "\u7ed3\u679c\u652f\u6301\u5c06LightGBM\u4e0e\u96c6\u6210\u795e\u7ecf\u6a21\u578b\u4f5c\u4e3a\u4e92\u8865\u57fa\u7ebf\uff0c\u4e5f\u63ed\u793a\u5c0f\u89c4\u6a21\u8bc4\u4f30\u53ef\u80fd\u6539\u53d8\u9886\u5148\u8005\uff0c\u65b9\u6cd5\u4f18\u52a3\u9700\u8de8\u5316\u5b66\u5212\u5206\u7edf\u8ba1\u68c0\u9a8c\u3002"}, {"abstract": "We consider offline imitation learning (IL), which aims to train an agent to imitate from the dataset of expert demonstrations without online interaction with the environment. Behavioral Cloning (BC) has been a simple yet effective approach to offline IL, but it is also well-known to be vulnerable to the covariate shift resulting from the mismatch between the state distributions induced by the learned policy and the expert policy. Moreover, as often occurs in practice, when expert datasets are collected from an arbitrary state distribution instead of a stationary one, these shifts become more pronounced, potentially leading to substantial failures in existing IL methods. Specifically, we focus on covariate shift resulting from arbitrary state data distributions, such as biased data collection or incomplete trajectories, rather than shifts induced by changes in dynamics or noisy expert actions. In this paper, to mitigate the effect of the covariate shifts in BC, we propose DrilDICE, which utilizes a distributionally robust BC objective by employing a stationary distribution correction ratio estimation (DICE) to derive a feasible solution. We evaluate the effectiveness of our method through an extensive set of experiments covering diverse covariate shift scenarios. The results demonstrate the efficacy of the proposed approach in improving the robustness against the shifts, outperforming existing offline IL methods in such scenarios.", "arxiv_id": "2611.09371", "arxiv_url": "https://arxiv.org/abs/2611.09371", "authors": ["Seokin Seo", "Byung-Jun Lee", "Jongmin Lee", "HyeongJoo Hwang", "Hongseok Yang", "Kee-Eung Kim"], "brief": "\u63d0\u51fa\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60\u65b9\u6cd5DrilDICE\uff0c\u4ee5\u5206\u5e03\u9c81\u68d2\u884c\u4e3a\u514b\u9686\u4e3a\u76ee\u6807\uff0c\u501f\u52a9DICE\u4f30\u8ba1\u7a33\u6001\u5206\u5e03\u6821\u6b63\u6bd4\u7387\uff0c\u7f13\u89e3\u975e\u7a33\u6001\u4e13\u5bb6\u6570\u636e\u9020\u6210\u7684\u7b56\u7565\u504f\u79fb\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09371", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["DrilDICE\u91c7\u7528\u5206\u5e03\u9c81\u68d2\u884c\u4e3a\u514b\u9686\u76ee\u6807", "\u5229\u7528DICE\u4f30\u8ba1\u7a33\u6001\u5206\u5e03\u6821\u6b63\u6bd4\u7387", "\u591a\u79cd\u534f\u53d8\u91cf\u504f\u79fb\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u73b0\u6709\u79bb\u7ebf\u6a21\u4eff\u65b9\u6cd5"], "keywords": ["\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60", "\u884c\u4e3a\u514b\u9686", "\u534f\u53d8\u91cf\u504f\u79fb", "\u5206\u5e03\u9c81\u68d2\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09371v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Mitigating Covariate Shift in Behavioral Cloning via Robust Stationary Distribution Correction", "tldr": "\u901a\u8fc7\u7a33\u6001\u5206\u5e03\u6821\u6b63\u6784\u5efa\u9c81\u68d2\u884c\u4e3a\u514b\u9686\uff0c\u7f13\u89e3\u504f\u7f6e\u793a\u8303\u6570\u636e\u5e26\u6765\u7684\u534f\u53d8\u91cf\u504f\u79fb\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u79bb\u7ebf\u6a21\u4eff\u5b66\u4e60\u65b9\u6cd5DrilDICE\uff0c\u4ee5\u5206\u5e03\u9c81\u68d2\u884c\u4e3a\u514b\u9686\u4e3a\u76ee\u6807\uff0c\u501f\u52a9DICE\u4f30\u8ba1\u7a33\u6001\u5206\u5e03\u6821\u6b63\u6bd4\u7387\uff0c\u7f13\u89e3\u975e\u7a33\u6001\u4e13\u5bb6\u6570\u636e\u9020\u6210\u7684\u7b56\u7565\u504f\u79fb\u3002", "why_notable": "\u9488\u5bf9\u504f\u7f6e\u91c7\u96c6\u3001\u4e0d\u5b8c\u6574\u8f68\u8ff9\u7b49\u5b9e\u9645\u6570\u636e\u95ee\u9898\uff0c\u65e0\u9700\u5728\u7ebf\u4ea4\u4e92\u5373\u53ef\u63d0\u5347\u6a21\u4eff\u7b56\u7565\u7684\u9c81\u68d2\u6027\uff0c\u8ba9\u884c\u4e3a\u514b\u9686\u66f4\u9002\u7528\u4e8e\u975e\u7406\u60f3\u793a\u8303\u6570\u636e\u3002"}, {"abstract": "Robustness and interpretability are interrelated and desirable properties of machine learning models. A model that changes its prediction under imperceptible perturbations behaves inconsistently with human-recognizable features and, hence, is not interpretable. Prototype-based classifiers such as Generalized Learning Vector Quantization address both at once. They are interpretable by construction because they make the decision by comparing the input to the prototypical example; and their hypothesis margin yields a closed form robustness certificate. However, on high-dimensional data, these shallow models need deep embedding networks to achieve high accuracy, and this voids the robustness certificate. The margin is a statement about distances in the embedding space, and an unconstrained network can map an arbitrarily small input perturbation to arbitrarily large attacks in the embedding space. We close this gap with a theorem: if the embedding network is locally L-Lipschitz around a point, and the classifier is \u03b5-robust around its embedding, then the full model is \u03b5/L-robust in the input space. Based on this, we propose a Lipschitz training scheme to achieve L-Lipschitz properties for embedding networks. We evaluate three classification heads (linear, linear Support Vector Machine, and GLVQ) crossed with two embedding networks (standard and Lipschitz-constrained) on MNIST, CIFAR-10, and Imagenette-160, under FGS, PGD and C\\\u0026W attacks. The evaluation results show that combining a prototype-based head with a Lipschitz-constrained embedding provides the strongest robustness. This suggests that the Lipschitz constraint provides an additional robustness benefit in addition to the advantage provided by the prototype-based head. Since the Lipschitz constraint is enforced by sampling rather than by construction, the reported robustness is empirical rather than certified.", "arxiv_id": "2611.09327", "arxiv_url": "https://arxiv.org/abs/2611.09327", "authors": ["Adia Khalid Khan", "Lukas Gehring", "Benjamin Paa\u00dfen"], "brief": "\u7814\u7a76\u7528Lipschitz\u8bad\u7ec3\u7ea6\u675f\u6df1\u5ea6\u5d4c\u5165\u7f51\u7edc\uff0c\u518d\u63a5\u539f\u578b\u5206\u7c7b\u5934\u3002\u7406\u8bba\u4e0a\u5c06\u5d4c\u5165\u7a7a\u95f4\u7684\u9c81\u68d2\u534a\u5f84\u8f6c\u5316\u4e3a\u8f93\u5165\u7a7a\u95f4\u534a\u5f84\uff0c\u5e76\u901a\u8fc7\u5bf9\u6297\u653b\u51fb\u68c0\u9a8c\u7ec4\u5408\u6548\u679c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09327", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c40\u90e8L-Lipschitz\u5d4c\u5165\u5c06\u03b5\u9c81\u68d2\u534a\u5f84\u8f6c\u4e3a\u03b5/L", "3\u79cd\u5206\u7c7b\u5934\u4e0e2\u79cd\u5d4c\u5165\u7f51\u7edc\u57283\u4e2a\u6570\u636e\u96c6\u4e0a\u4ea4\u53c9\u8bc4\u4f30", "GLVQ\u52a0\u7ea6\u675f\u5d4c\u5165\u6700\u9c81\u68d2\uff1b\u91c7\u6837\u7ea6\u675f\u4ec5\u652f\u6301\u5b9e\u8bc1\u7ed3\u8bba"], "keywords": ["\u539f\u578b\u5b66\u4e60", "\u5bf9\u6297\u9c81\u68d2\u6027", "\u53ef\u89e3\u91ca\u6027", "Lipschitz\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09327v1", "published_at": "2026-11-06", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Robust Deep Prototype Classifiers via Lipschitz Training", "tldr": "\u901a\u8fc7\u7ea6\u675f\u6df1\u5ea6\u5d4c\u5165\u7684\u5c40\u90e8\u53d8\u5316\uff0c\u5c06\u539f\u578b\u5206\u7c7b\u7684\u53ef\u89e3\u91ca\u6027\u4e0e\u5bf9\u6297\u9c81\u68d2\u6027\u7ed3\u5408\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528Lipschitz\u8bad\u7ec3\u7ea6\u675f\u6df1\u5ea6\u5d4c\u5165\u7f51\u7edc\uff0c\u518d\u63a5\u539f\u578b\u5206\u7c7b\u5934\u3002\u7406\u8bba\u4e0a\u5c06\u5d4c\u5165\u7a7a\u95f4\u7684\u9c81\u68d2\u534a\u5f84\u8f6c\u5316\u4e3a\u8f93\u5165\u7a7a\u95f4\u534a\u5f84\uff0c\u5e76\u901a\u8fc7\u5bf9\u6297\u653b\u51fb\u68c0\u9a8c\u7ec4\u5408\u6548\u679c\u3002", "why_notable": "\u8865\u4e0a\u6df1\u5ea6\u5d4c\u5165\u53ef\u80fd\u7834\u574f\u539f\u578b\u5206\u7c7b\u9c81\u68d2\u4fdd\u8bc1\u7684\u5173\u952e\u73af\u8282\uff0c\u4e3a\u517c\u987e\u53ef\u89e3\u91ca\u6027\u4e0e\u6297\u653b\u51fb\u80fd\u529b\u63d0\u4f9b\u7406\u8bba\u4f9d\u636e\u548c\u8bad\u7ec3\u8def\u5f84\u3002"}, {"abstract": "How does using less conversational history change reader-token use and benchmark scores? We examine this question on 1,100 BEAM questions. We held the retrieval ranking and reader constant across five fixed passage budgets, and mean assigned scores rose as the passage budget grew. The score gain per additional token became smaller at the upper tested budgets. Answerable questions generally received higher scores with more context. Pooled abstention scores sometimes rose as the passage budget shrank. We also tested message retention in a controlled task with explicit conversational-state targets and compared retained user messages with token-matched recency. Qwen matched the full state more often for direct requirements when user messages were retained. Its full-state matching declined when answers depended on references to earlier offers. Mistral produced near-floor results across the retention conditions. A scoring audit leaves the correctness of BEAM answers unresolved. These experiments characterize the token and score consequences of the tested memory budgets. Reliable budget selection depends on retaining the evidence each question requires and validating the measure used to assess answer quality.", "arxiv_id": "2611.09662", "arxiv_url": "https://arxiv.org/abs/2611.09662", "authors": ["Danny Kim", "Fernando Koch"], "brief": "\u7814\u7a76\u901a\u8fc7\u56fa\u5b9a\u68c0\u7d22\u6392\u5e8f\u4e0e\u9605\u8bfb\u6a21\u578b\uff0c\u6bd4\u8f83\u4e94\u6863\u4e0a\u4e0b\u6587\u9884\u7b97\u7684\u8bcd\u5143\u5f00\u9500\u548c\u8bc4\u5206\uff1b\u53e6\u7528\u663e\u5f0f\u5bf9\u8bdd\u72b6\u6001\u4efb\u52a1\uff0c\u6d4b\u8bd5\u4fdd\u7559\u7528\u6237\u6d88\u606f\u4e0e\u7b49\u8bcd\u5143\u8fd1\u671f\u5386\u53f2\u7684\u5dee\u5f02\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09662", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["1,100\u9053BEAM\u9898\uff1a\u9884\u7b97\u589e\u52a0\u5e26\u6765\u8bc4\u5206\u4e0a\u6da8\uff0c\u4f46\u8fb9\u9645\u6536\u76ca\u9012\u51cf", "Qwen\u4fdd\u7559\u7528\u6237\u6d88\u606f\u5229\u4e8e\u76f4\u63a5\u8981\u6c42\uff0c\u4f9d\u8d56\u65e9\u5148\u63d0\u8bae\u65f6\u72b6\u6001\u5339\u914d\u4e0b\u964d", "Mistral\u5404\u4fdd\u7559\u6761\u4ef6\u8868\u73b0\u63a5\u8fd1\u4e0b\u9650\uff1b\u8bc4\u5206\u5ba1\u8ba1\u672a\u786e\u8ba4BEAM\u7b54\u6848\u6b63\u786e\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u5bf9\u8bdd\u8bb0\u5fc6", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09662v1", "published_at": "2026-11-06", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "How Much Conversation History Does an AI Agent Need?", "tldr": "\u5bf9\u8bdd\u8bb0\u5fc6\u5e76\u975e\u8d8a\u591a\u8d8a\u5212\u7b97\uff0c\u4fdd\u7559\u5173\u952e\u8bc1\u636e\u4e0e\u9a8c\u8bc1\u8bc4\u5206\u6bd4\u5355\u7eaf\u6269\u5bb9\u66f4\u91cd\u8981\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u901a\u8fc7\u56fa\u5b9a\u68c0\u7d22\u6392\u5e8f\u4e0e\u9605\u8bfb\u6a21\u578b\uff0c\u6bd4\u8f83\u4e94\u6863\u4e0a\u4e0b\u6587\u9884\u7b97\u7684\u8bcd\u5143\u5f00\u9500\u548c\u8bc4\u5206\uff1b\u53e6\u7528\u663e\u5f0f\u5bf9\u8bdd\u72b6\u6001\u4efb\u52a1\uff0c\u6d4b\u8bd5\u4fdd\u7559\u7528\u6237\u6d88\u606f\u4e0e\u7b49\u8bcd\u5143\u8fd1\u671f\u5386\u53f2\u7684\u5dee\u5f02\u3002", "why_notable": "\u5c06\u8bb0\u5fc6\u9884\u7b97\u95ee\u9898\u62c6\u6210\u6210\u672c\u3001\u8bc1\u636e\u4fdd\u7559\u4e0e\u8bc4\u4f30\u53ef\u9760\u6027\uff0c\u63d0\u793a\u667a\u80fd\u4f53\u4e0d\u80fd\u53ea\u51ed\u57fa\u51c6\u8bc4\u5206\u9009\u62e9\u4e0a\u4e0b\u6587\u957f\u5ea6\u3002"}, {"abstract": "Data stream processing has become central to modern machine learning applications, with concept drifts and novel class appearances posing the primary challenges faced by recognition methods. Adapting to concept drifts while also being able to detect novel classes and distinguish groups of unknown observations can be seen as a step towards effective method employment in an open-world setting. This work proposes a classification method that can detect and learn the distributions of new, unknown classes, as well as adapt to concept drifts once the distribution of known classes shifts. The proposed method uses the autoencoders\u0027 reconstruction errors and the KDE that models their distribution. The autoencoders incrementally adapt to the changing distributions of known classes via weight fine-tuning, resulting in continuous adjustment to evolving concepts. Conducted experiments used a diverse set of synthetic data streams, embeddings of a real-world static CIFAR dataset arranged into a stream to simulate concept drifts and the emergence of unknowns, as well as real-world datasets where novelty is observed. The methodology was compared with state-of-the-art approaches with three-criterion recognition quality assessment and resource consumption evaluation. The results indicate that the proposed method is competitive with reference approaches in stationary environments and performs best when concept drifts occur.", "arxiv_id": "2611.09350", "arxiv_url": "https://arxiv.org/abs/2611.09350", "authors": ["Joanna Komorniczak"], "brief": "\u63d0\u51fa\u9762\u5411\u5f00\u653e\u4e16\u754c\u6570\u636e\u6d41\u7684\u5206\u7c7b\u5668\uff0c\u4ee5\u81ea\u7f16\u7801\u5668\u91cd\u6784\u8bef\u5dee\u53ca\u5176\u6838\u5bc6\u5ea6\u4f30\u8ba1\u5206\u5e03\u8bc6\u522b\u672a\u77e5\u7c7b\u522b\uff0c\u5e76\u901a\u8fc7\u6743\u91cd\u589e\u91cf\u5fae\u8c03\u9002\u5e94\u5df2\u77e5\u7c7b\u522b\u5206\u5e03\u7684\u53d8\u5316\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09350", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u81ea\u7f16\u7801\u5668\u91cd\u6784\u8bef\u5dee\u7ed3\u5408KDE\u5efa\u6a21\uff0c\u68c0\u6d4b\u5e76\u5b66\u4e60\u65b0\u7c7b\u522b", "\u901a\u8fc7\u81ea\u7f16\u7801\u5668\u6743\u91cd\u589e\u91cf\u5fae\u8c03\u9002\u5e94\u6982\u5ff5\u6f02\u79fb", "\u5728\u5408\u6210\u6d41\u3001CIFAR\u5d4c\u5165\u6d41\u53ca\u771f\u5b9e\u65b0\u9896\u6027\u6570\u636e\u4e0a\u8bc4\u4f30"], "keywords": ["\u5f00\u653e\u4e16\u754c\u8bc6\u522b", "\u6982\u5ff5\u6f02\u79fb", "\u81ea\u7f16\u7801\u5668", "\u6570\u636e\u6d41\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09350v1", "published_at": "2026-11-06", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Open-world Reconstruction-based Classifier with Concept Drift Adaptation", "tldr": "\u5229\u7528\u81ea\u7f16\u7801\u5668\u91cd\u6784\u8bef\u5dee\u8bc6\u522b\u5e76\u5b66\u4e60\u65b0\u7c7b\u522b\uff0c\u540c\u65f6\u589e\u91cf\u9002\u5e94\u6570\u636e\u6d41\u4e2d\u7684\u6982\u5ff5\u6f02\u79fb\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9762\u5411\u5f00\u653e\u4e16\u754c\u6570\u636e\u6d41\u7684\u5206\u7c7b\u5668\uff0c\u4ee5\u81ea\u7f16\u7801\u5668\u91cd\u6784\u8bef\u5dee\u53ca\u5176\u6838\u5bc6\u5ea6\u4f30\u8ba1\u5206\u5e03\u8bc6\u522b\u672a\u77e5\u7c7b\u522b\uff0c\u5e76\u901a\u8fc7\u6743\u91cd\u589e\u91cf\u5fae\u8c03\u9002\u5e94\u5df2\u77e5\u7c7b\u522b\u5206\u5e03\u7684\u53d8\u5316\u3002", "why_notable": "\u5c06\u672a\u77e5\u7c7b\u522b\u5b66\u4e60\u4e0e\u6982\u5ff5\u6f02\u79fb\u9002\u5e94\u7edf\u4e00\u5230\u4e00\u4e2a\u5206\u7c7b\u6846\u67b6\u4e2d\uff1b\u5b9e\u9a8c\u663e\u793a\u9759\u6001\u73af\u5883\u4e0b\u8868\u73b0\u6709\u7ade\u4e89\u529b\uff0c\u53d1\u751f\u6f02\u79fb\u65f6\u4f18\u4e8e\u5bf9\u6bd4\u65b9\u6cd5\u3002"}, {"abstract": "Learning-path recommendation often depends on knowledge and prerequisite structures whose reliability is uncertain, while high accuracy in predicting the next resource does not necessarily establish reliable long-horizon path behaviour. This study develops a reliability-oriented prerequisite-aware framework that jointly examines immediate next-resource ranking, uncertain prerequisite structures, hard, soft and hybrid constraint semantics, graph robustness, and autoregressive path generation under course-level confirmatory evaluation and independent cross-dataset validation. Development used 3,187 MOOCCubeX courses, followed by a frozen confirmatory evaluation on 541 held-out courses and 37,747 transitions. The primary MOOCCubeX task is structural and course-prefix-conditioned rather than learner-personalised. Junyi provides independent structure-/hierarchy-aware external validation, uses hierarchy metadata rather than an explicit prerequisite graph and is not a zero-shot transfer setting. On the frozen MOOCCubeX evaluation, XGBoost pairwise was the strongest observed immediate ranker, with mean reciprocal rank (MRR) of 0.9048, whereas the proposed prerequisite-aware graph model achieved 0.7707. In the controlled graph-variant development ablation, the no-graph condition produced the strongest immediate ranking result, and immediate prediction showed strong dependence on permitted title/path-similarity information. Autoregressive evaluation exposed path properties not captured by one-step ranking. On Junyi, Markov achieved the strongest observed MRR of 0.4453, compared with 0.3954 for the proposed graph model, with metric-specific differences across ranking measures. Overall, immediate predictive accuracy, prerequisite-structure reliability, and long-horizon path quality should be treated as complementary rather than interchangeable evaluation dimensions in educational recommendation.", "arxiv_id": "2611.09345", "arxiv_url": "https://arxiv.org/abs/2611.09345", "authors": ["M. M. Golam Hafiz", "A. K. M. Shahriar Emtiaz", "Safia Akter Simi", "Md. Rakibul Islam", "M. F. Mridha"], "brief": "\u63d0\u51fa\u9762\u5411\u53ef\u9760\u6027\u7684\u5148\u4fee\u611f\u77e5\u8bc4\u4f30\u6846\u67b6\uff0c\u8054\u5408\u68c0\u9a8c\u6392\u5e8f\u3001\u56fe\u7ed3\u6784\u4e0d\u786e\u5b9a\u6027\u4e0e\u81ea\u56de\u5f52\u8def\u5f84\u751f\u6210\uff0c\u5e76\u901a\u8fc7\u51bb\u7ed3\u8bfe\u7a0b\u6d4b\u8bd5\u548c\u72ec\u7acb\u6570\u636e\u96c6\u9a8c\u8bc1\u533a\u5206\u5355\u6b65\u8868\u73b0\u4e0e\u957f\u671f\u8d28\u91cf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09345", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u6bd4\u8f83\u786c\u3001\u8f6f\u3001\u6df7\u5408\u5148\u4fee\u7ea6\u675f\u53ca\u56fe\u9c81\u68d2\u6027", "\u51bb\u7ed3\u6d4b\u8bd5\u542b541\u95e8\u8bfe\u7a0b\u300137,747\u6b21\u8f6c\u79fb", "XGBoost\u5355\u6b65MRR\u4e3a0.9048\uff0c\u56fe\u6a21\u578b\u4e3a0.7707"], "keywords": ["\u6559\u80b2\u63a8\u8350", "\u5b66\u4e60\u8def\u5f84", "\u5148\u4fee\u5173\u7cfb", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09345v1", "published_at": "2026-11-06", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Reliable Prerequisite-Aware Learning Path Recommendation under Uncertain Knowledge Structures: Long-Horizon Evaluation and Cross-Dataset Validation", "tldr": "\u5b66\u4e60\u8def\u5f84\u63a8\u8350\u4e2d\uff0c\u5355\u6b65\u9884\u6d4b\u51c6\u786e\u4e0d\u7b49\u4e8e\u5148\u4fee\u7ea6\u675f\u53ef\u9760\u6216\u957f\u671f\u8def\u5f84\u4f18\u8d28\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9762\u5411\u53ef\u9760\u6027\u7684\u5148\u4fee\u611f\u77e5\u8bc4\u4f30\u6846\u67b6\uff0c\u8054\u5408\u68c0\u9a8c\u6392\u5e8f\u3001\u56fe\u7ed3\u6784\u4e0d\u786e\u5b9a\u6027\u4e0e\u81ea\u56de\u5f52\u8def\u5f84\u751f\u6210\uff0c\u5e76\u901a\u8fc7\u51bb\u7ed3\u8bfe\u7a0b\u6d4b\u8bd5\u548c\u72ec\u7acb\u6570\u636e\u96c6\u9a8c\u8bc1\u533a\u5206\u5355\u6b65\u8868\u73b0\u4e0e\u957f\u671f\u8d28\u91cf\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u63ed\u793a\u5355\u6b65\u6392\u5e8f\u6307\u6807\u65e0\u6cd5\u4ee3\u8868\u957f\u671f\u8def\u5f84\u53ef\u9760\u6027\uff0c\u4e14\u56fe\u7ed3\u6784\u672a\u5fc5\u63d0\u5347\u9884\u6d4b\uff0c\u4e3a\u6559\u80b2\u63a8\u8350\u63d0\u4f9b\u66f4\u5b8c\u6574\u7684\u8bc4\u4f30\u4f9d\u636e\u3002"}, {"abstract": "Cross-location variation in wearable inertial measurement unit (IMU) signals complicates learning when measurements from a desired target body location are unavailable. This study proposes DiffusionRef-IMU, a two-stage cross-location translation framework in which a deterministic Direct network first estimates the target signal and a guide-anchored residual diffusion model refines only the remaining target discrepancy. The evaluation comprises five subject-disjoint activity-location composition-held-out folds, capacity-matched deterministic and flow-based residual baselines, source-only activity conditioning, computational ablation, and true zero-shot evaluation on two independent datasets. DiffusionRef-IMU with 16-step deterministic DDIM achieved a mean nRMSE of 0.087538 +/- 0.004922, compared with 0.090262 for Direct, 0.088847 for deterministic residual refinement, and 0.088417 for eight-step CompFlow, and outperformed each baseline in all five folds. Four-step DDIM retained a mean nRMSE of 0.087820 at 47.62 ms per window, providing a favourable quality-computation trade-off. Replacing ground-truth activity conditioning with a source-only activity predictor (macro-F1 0.8473) increased 16-step DiffusionRef nRMSE only to 0.088190. True zero-shot evaluation produced mixed results: DiffusionRef was marginally favourable on Grouvel2025 but remained worse than Direct on Salda\u00f1a2025. Overall, guide-anchored residual diffusion improves controlled cross-location reconstruction while revealing clear limits in zero-shot external transfer.", "arxiv_id": "2611.09323", "arxiv_url": "https://arxiv.org/abs/2611.09323", "authors": ["M. M. Golam Hafiz", "Safia Akter Simi", "Md. Rakibul Islam", "M. F. Mridha"], "brief": "\u63d0\u51fa\u4e24\u9636\u6bb5\u8de8\u4f4d\u7f6e\u60ef\u6027\u4fe1\u53f7\u8f6c\u6362\u6846\u67b6\uff1a\u5148\u7531\u786e\u5b9a\u6027\u7f51\u7edc\u9884\u6d4b\u76ee\u6807\u4fe1\u53f7\uff0c\u518d\u7528\u9884\u6d4b\u7ed3\u679c\u951a\u5b9a\u6b8b\u5dee\u6269\u6563\uff0c\u4ec5\u4fee\u6b63\u5269\u4f59\u8bef\u5dee\uff0c\u5e76\u68c0\u9a8c\u8ba1\u7b97\u5f00\u9500\u4e0e\u5916\u90e8\u6cdb\u5316\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09323", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["16\u6b65DDIM\u5e73\u5747nRMSE\u4e3a0.087538\uff0c\u4e94\u6298\u5747\u4f18\u4e8e\u57fa\u7ebf", "4\u6b65DDIM\u6bcf\u7a97\u53e3\u8017\u65f647.62\u6beb\u79d2\uff0c\u7cbe\u5ea6\u63a5\u8fd116\u6b65", "\u4e24\u4e2a\u72ec\u7acb\u6570\u636e\u96c6\u96f6\u6837\u672c\u6d4b\u8bd5\u7ed3\u679c\u4e0d\u4e00\u81f4\uff0cSalda\u00f1a2025\u4e0d\u53caDirect"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u60ef\u6027\u4f20\u611f\u5668", "\u4fe1\u53f7\u91cd\u5efa", "\u8de8\u57df\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09323v1", "published_at": "2026-11-06", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "DiffusionRef-IMU: Guide-Anchored Residual Diffusion for Cross-Location Inertial Measurement Unit Translation", "tldr": "\u4ee5\u521d\u6b65\u9884\u6d4b\u951a\u5b9a\u6b8b\u5dee\u6269\u6563\uff0c\u63d0\u5347\u8de8\u8eab\u4f53\u4f4d\u7f6e\u60ef\u6027\u4fe1\u53f7\u91cd\u5efa\uff0c\u4f46\u5916\u90e8\u8fc1\u79fb\u4ecd\u6709\u9650\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e24\u9636\u6bb5\u8de8\u4f4d\u7f6e\u60ef\u6027\u4fe1\u53f7\u8f6c\u6362\u6846\u67b6\uff1a\u5148\u7531\u786e\u5b9a\u6027\u7f51\u7edc\u9884\u6d4b\u76ee\u6807\u4fe1\u53f7\uff0c\u518d\u7528\u9884\u6d4b\u7ed3\u679c\u951a\u5b9a\u6b8b\u5dee\u6269\u6563\uff0c\u4ec5\u4fee\u6b63\u5269\u4f59\u8bef\u5dee\uff0c\u5e76\u68c0\u9a8c\u8ba1\u7b97\u5f00\u9500\u4e0e\u5916\u90e8\u6cdb\u5316\u3002", "why_notable": "\u5c06\u6269\u6563\u7528\u4e8e\u4fee\u6b63\u800c\u975e\u5b8c\u6574\u751f\u6210\uff0c\u5728\u53d7\u63a7\u6d4b\u8bd5\u4e2d\u517c\u987e\u91cd\u5efa\u7cbe\u5ea6\u4e0e\u8ba1\u7b97\u6548\u7387\uff1b\u5916\u90e8\u96f6\u6837\u672c\u7ed3\u679c\u4e5f\u660e\u786e\u4e86\u8de8\u6570\u636e\u96c6\u8fc1\u79fb\u7684\u8fb9\u754c\u3002"}, {"abstract": "Multi-label retinal screening requires capturing co-occurring pathologies and clinical context, yet standard multimodal fusion remains opaque. We propose a dual-hub heterogeneous graph neural network (GNN) that couples spatial fundus features and structured clinical covariates through cross-modal message passing while providing inherent interpretability. Rather than relying on post-hoc saliency approximations, our architecture exposes multi-level decision pathways during forward aggregation: spatially biased self-attention captures lesion-level patch interactions, while modality-specific graph attention coefficients explicitly quantify the contribution of visual regions and clinical risk factors to each disease node. Evaluated on the BRSET dataset (16,266 photographs from 8,524 patients), the proposed model achieves 76.1% Macro-AUPRC across seven conditions, matching or exceeding image-only (75.9%) and ResNet-50+MLP fusion (75.9%) baselines, with largest contextual gains in macular edema (+3.5%) and diabetic retinopathy (+2.1%). Codebase is available at: https://github.com/proshanto-c/ca-mlc-refactor.", "arxiv_id": "2611.09309", "arxiv_url": "https://arxiv.org/abs/2611.09309", "authors": ["Proshanto Chanda", "Munib Mesinovic", "Tingting Zhu", "Abhirup Banerjee"], "brief": "\u63d0\u51fa\u53cc\u67a2\u7ebd\u5f02\u6784\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u901a\u8fc7\u8de8\u6a21\u6001\u6d88\u606f\u4f20\u9012\u878d\u5408\u773c\u5e95\u5c40\u90e8\u7279\u5f81\u4e0e\u7ed3\u6784\u5316\u4e34\u5e8a\u53d8\u91cf\u3002\u7ed3\u5408\u7a7a\u95f4\u504f\u7f6e\u81ea\u6ce8\u610f\u529b\u548c\u56fe\u6ce8\u610f\u529b\uff0c\u5c55\u793a\u75c5\u7076\u533a\u57df\u53ca\u98ce\u9669\u56e0\u7d20\u5bf9\u75be\u75c5\u9884\u6d4b\u7684\u8d21\u732e\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09309", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u67a2\u7ebd\u5f02\u6784GNN\u4ee5\u8de8\u6a21\u6001\u6d88\u606f\u4f20\u9012\u878d\u5408\u89c6\u89c9\u4e0e\u4e34\u5e8a\u53d8\u91cf", "BRSET\u542b16,266\u5f20\u7167\u7247\u30018,524\u540d\u60a3\u8005", "\u4e03\u75c5\u79cdMacro-AUPRC\u4e3a76.1%\uff0c\u57fa\u7ebf\u4e3a75.9%"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u591a\u6a21\u6001\u878d\u5408", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09309v1", "published_at": "2026-11-06", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Interpretable Context-Aware Multi-Label Retinal Classification with Dual-Hub Heterogeneous Graph Neural Network", "tldr": "\u7528\u53cc\u67a2\u7ebd\u5f02\u6784\u56fe\u878d\u5408\u773c\u5e95\u56fe\u50cf\u4e0e\u4e34\u5e8a\u4fe1\u606f\uff0c\u5728\u591a\u75c5\u7b5b\u67e5\u4e2d\u663e\u5f0f\u5448\u73b0\u51b3\u7b56\u8def\u5f84\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u53cc\u67a2\u7ebd\u5f02\u6784\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u901a\u8fc7\u8de8\u6a21\u6001\u6d88\u606f\u4f20\u9012\u878d\u5408\u773c\u5e95\u5c40\u90e8\u7279\u5f81\u4e0e\u7ed3\u6784\u5316\u4e34\u5e8a\u53d8\u91cf\u3002\u7ed3\u5408\u7a7a\u95f4\u504f\u7f6e\u81ea\u6ce8\u610f\u529b\u548c\u56fe\u6ce8\u610f\u529b\uff0c\u5c55\u793a\u75c5\u7076\u533a\u57df\u53ca\u98ce\u9669\u56e0\u7d20\u5bf9\u75be\u75c5\u9884\u6d4b\u7684\u8d21\u732e\u3002", "why_notable": "\u4ef7\u503c\u4e3b\u8981\u5728\u4e8e\u5c06\u89e3\u91ca\u8def\u5f84\u5d4c\u5165\u9884\u6d4b\u8fc7\u7a0b\uff0c\u800c\u975e\u4f9d\u8d56\u4e8b\u540e\u663e\u8457\u6027\u5206\u6790\u3002\u6574\u4f53\u6027\u80fd\u63d0\u5347\u6709\u9650\uff0c\u4f46\u9ec4\u6591\u6c34\u80bf\u548c\u7cd6\u5c3f\u75c5\u89c6\u7f51\u819c\u75c5\u53d8\u7684\u4e34\u5e8a\u4fe1\u606f\u589e\u76ca\u66f4\u7a81\u51fa\u3002"}, {"abstract": "Smartphones, smart-home hubs, and wearables are increasingly exposed to sophisticated Android malware, while centralized threat-detection pipelines raise privacy and scalability concerns. Federated learning (FL) enables collaborative model training without collecting raw client data, but partial participation and variation in local model quality can destabilize global optimization. In this article, we propose DW-FedADMM, a federated optimization framework that combines primal-dual coordination with performance-dependent client-side weighting. The dynamic coefficient modulates each participating client\u0027s local state before the augmented-Lagrangian update, while the dual variables regulate disagreement between local and global model states. We evaluate DW-FedADMM on three Android malware benchmarks, namely Drebin, Malgenome, and TUANDROMD, with 5, 10, and 15 clients holding IID data shards, partial client participation, and communication budgets of 5 and 10 rounds. Each configuration is repeated with ten random seeds. DW-FedADMM obtains the highest seed-averaged accuracy on Drebin (97.64% +/- 0.20%) and the best mean accuracy in 9 of the 18 dataset-client-round configurations, including 7 of the 9 configurations with a 10-round budget. Pooled over all configurations, it reaches 95.42% accuracy, 94.62% F1-score, 96.06% precision, and 99.45% AUC, compared with 95.32%, 94.51%, 95.56%, and 99.41% for FedADMM, while also giving the lowest mean false-positive rate and the smallest client update norm among the six compared methods. Both primal-dual methods are well ahead of the averaging- and proximal-based baselines on Malgenome and TUANDROMD, where the latter often remain at the majority-class solution when clients are fragmented. The gain of dynamic weighting over FedADMM is most pronounced on Drebin and with the longer communication budget, where it also reduces the variation across seeds.", "arxiv_id": "2611.09470", "arxiv_url": "https://arxiv.org/abs/2611.09470", "authors": ["Mohammad Mashreghi", "Mohammad Hossein Badiei", "Md. Jalil Piran"], "brief": "\u63d0\u51faDW-FedADMM\uff0c\u6309\u5ba2\u6237\u7aef\u6a21\u578b\u8868\u73b0\u52a8\u6001\u8c03\u6574\u672c\u5730\u72b6\u6001\uff0c\u518d\u6267\u884c\u589e\u5e7f\u62c9\u683c\u6717\u65e5\u66f4\u65b0\uff1b\u901a\u8fc7\u5bf9\u5076\u53d8\u91cf\u7ea6\u675f\u672c\u5730\u4e0e\u5168\u5c40\u6a21\u578b\u5206\u6b67\uff0c\u652f\u6301\u90e8\u5206\u5ba2\u6237\u7aef\u53c2\u4e0e\u3002", "categories": ["cs.LG", "cs.CR", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09470", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["DW-FedADMM\u7ed3\u5408\u52a8\u6001\u52a0\u6743\u4e0e\u539f\u59cb\u5bf9\u5076\u534f\u8c03", "\u4e09\u5957IID\u6570\u636e\u96c6\uff0c5/10/15\u5ba2\u6237\u7aef\uff0c\u91cd\u590d10\u79cd\u5b50", "18\u7ec4\u914d\u7f6e\u4e2d9\u7ec4\u6700\u4f18\uff0c\u6574\u4f53\u51c6\u786e\u738795.42%"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u6076\u610f\u8f6f\u4ef6\u68c0\u6d4b", "\u5206\u5e03\u5f0f\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09470v1", "published_at": "2026-11-06", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Consensus-Constrained Dual-Federated Optimization with Client-Side Dynamic Weighting for Distributed Android Device Threat Defense", "tldr": "\u5c06\u52a8\u6001\u5ba2\u6237\u7aef\u52a0\u6743\u878d\u5165\u539f\u59cb\u5bf9\u5076\u8054\u90a6\u4f18\u5316\uff0c\u6539\u5584\u5b89\u5353\u6076\u610f\u8f6f\u4ef6\u68c0\u6d4b\u7a33\u5b9a\u6027", "upvotes": 0, "what_it_is": "\u63d0\u51faDW-FedADMM\uff0c\u6309\u5ba2\u6237\u7aef\u6a21\u578b\u8868\u73b0\u52a8\u6001\u8c03\u6574\u672c\u5730\u72b6\u6001\uff0c\u518d\u6267\u884c\u589e\u5e7f\u62c9\u683c\u6717\u65e5\u66f4\u65b0\uff1b\u901a\u8fc7\u5bf9\u5076\u53d8\u91cf\u7ea6\u675f\u672c\u5730\u4e0e\u5168\u5c40\u6a21\u578b\u5206\u6b67\uff0c\u652f\u6301\u90e8\u5206\u5ba2\u6237\u7aef\u53c2\u4e0e\u3002", "why_notable": "\u5728\u6709\u9650\u901a\u4fe1\u4e0e\u90e8\u5206\u53c2\u4e0e\u4e0b\u6539\u5584\u68c0\u6d4b\u8868\u73b0\uff0c\u76f8\u6bd4FedADMM\u603b\u4f53\u589e\u76ca\u8f83\u5c0f\uff0c\u4f46\u8bef\u62a5\u7387\u548c\u5ba2\u6237\u7aef\u66f4\u65b0\u8303\u6570\u6700\u4f4e\uff0c\u5c55\u793a\u4e86\u52a8\u6001\u52a0\u6743\u7684\u7a33\u5b9a\u6027\u4ef7\u503c\u3002"}, {"abstract": "Transforming the spike trains produced by spiking neural networks (SNNs) into continuous signals through biologically inspired mechanisms remains an open challenge in generative and regression tasks. In biological systems, a similar transformation occurs when muscles integrate neural spikes to produce smooth, coordinated movements. Inspired by this mechanism, we introduce a muscle-response model, a biologically motivated dynamical layer that converts spike trains into continuous representations. Our approach uses second-order dynamics to model the temporal integration of spiking activity. We investigate how the number of spiking neurons and temporal resolution affect the quality of the generated signals in a text-to-speech task, showing that increasing representational capacity has a greater impact than increasing temporal resolution under the evaluated configurations. Furthermore, an analysis of the learned dynamics reveals that, without explicit constraints on the response type, most neurons converge toward non-oscillatory behavior. These results demonstrate the potential of biologically inspired dynamical decoders for bridging spiking neural computation and continuous signal generation.", "arxiv_id": "2611.09295", "arxiv_url": "https://arxiv.org/abs/2611.09295", "authors": ["Maryam Soltani", "Philip N. Garner"], "brief": "\u63d0\u51fa\u808c\u8089\u542f\u53d1\u7684\u4e8c\u9636\u52a8\u529b\u5b66\u5c42\uff0c\u5c06\u8109\u51b2\u5e8f\u5217\u8f6c\u4e3a\u8fde\u7eed\u4fe1\u53f7\u3002\u8bed\u97f3\u5408\u6210\u5b9e\u9a8c\u4e2d\uff0c\u589e\u52a0\u795e\u7ecf\u5143\u6bd4\u63d0\u9ad8\u65f6\u95f4\u5206\u8fa8\u7387\u66f4\u6709\u6548\uff0c\u591a\u6570\u795e\u7ecf\u5143\u5b66\u5f97\u975e\u632f\u8361\u54cd\u5e94\u3002", "categories": ["cs.NE", "cs.LG", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09295", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8109\u51b2\u795e\u7ecf\u7f51\u7edc", "\u52a8\u529b\u5b66\u6a21\u578b", "\u8bed\u97f3\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09295v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bridging Spiking and Continuous Dynamics in Spiking Neural Networks: A Muscle-Inspired Model", "tldr": "\u63d0\u51fa\u808c\u8089\u542f\u53d1\u7684\u4e8c\u9636\u52a8\u529b\u5b66\u5c42\uff0c\u5c06\u8109\u51b2\u5e8f\u5217\u8f6c\u4e3a\u8fde\u7eed\u4fe1\u53f7\u3002\u8bed\u97f3\u5408\u6210\u5b9e\u9a8c\u4e2d\uff0c\u589e\u52a0\u795e\u7ecf\u5143\u6bd4\u63d0\u9ad8\u65f6\u95f4\u5206\u8fa8\u7387\u66f4\u6709\u6548\uff0c\u591a\u6570\u795e\u7ecf\u5143\u5b66\u5f97\u975e\u632f\u8361\u54cd\u5e94\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper investigates the coupled control problem within safety-focused reinforcement learning, addressing the essential challenge of achieving optimal performance while ensuring safety in systems operating within complex environments. We define safety as the requirement to prevent the system from reaching undesirable or hazardous states. We propose a coupled control approach that prioritizes safety by employing effective methods to prevent the system from entering unsafe states while optimizing the performance metric, defined as the average cost. We propose a novel probl
