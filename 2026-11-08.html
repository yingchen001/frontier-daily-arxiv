em transformation that reformulates it into a risk-sensitive problem combined with an average reward criterion. We present a two-timescale Q-learning algorithm where in the faster timescale, the algorithm solves a risk-sensitive control problem to ensure safety, while on a slower timescale, the algorithm focuses on average cost control. We provide theoretical guarantees for the convergence of our algorithms, establishing their significance in ensuring safe, optimal control in dynamic environments. We validated the performance of our approach using GridWorld and CarGoal task in Safety Gymnasium.", "arxiv_id": "2611.09290", "arxiv_url": "https://arxiv.org/abs/2611.09290", "authors": ["Jiabin Lin", "Shana Moothedath", "Vivek S. Borkar"], "brief": "\u5c06\u5b89\u5168\u4e0e\u6027\u80fd\u4f18\u5316\u8f6c\u5316\u4e3a\u98ce\u9669\u654f\u611f\u8026\u5408\u63a7\u5236\uff0c\u7528\u53cc\u65f6\u95f4\u5c3a\u5ea6Q\u5b66\u4e60\u5206\u522b\u907f\u514d\u5371\u9669\u72b6\u6001\u5e76\u4f18\u5316\u5e73\u5747\u6210\u672c\uff0c\u7ed9\u51fa\u6536\u655b\u4fdd\u8bc1\uff0c\u5e76\u5728\u4e24\u7c7b\u4efb\u52a1\u4e2d\u9a8c\u8bc1\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09290", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5b89\u5168\u5f3a\u5316\u5b66\u4e60", "\u98ce\u9669\u654f\u611f\u63a7\u5236", "Q\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09290v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Safety-Focused Reinforcement Learning Using Risk-Sensitive Coupled Control", "tldr": "\u5c06\u5b89\u5168\u4e0e\u6027\u80fd\u4f18\u5316\u8f6c\u5316\u4e3a\u98ce\u9669\u654f\u611f\u8026\u5408\u63a7\u5236\uff0c\u7528\u53cc\u65f6\u95f4\u5c3a\u5ea6Q\u5b66\u4e60\u5206\u522b\u907f\u514d\u5371\u9669\u72b6\u6001\u5e76\u4f18\u5316\u5e73\u5747\u6210\u672c\uff0c\u7ed9\u51fa\u6536\u655b\u4fdd\u8bc1\uff0c\u5e76\u5728\u4e24\u7c7b\u4efb\u52a1\u4e2d\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We propose AnomSep, which combines optimiza-tion-based separation with deep neural refinement to achieve accurate anomaly detection with listenable explanations. Anomaly detection requires no predefined anomalous categories, and understanding the basis for each detection helps security personnel assess the validity of each detection. End-to-end anomaly detectors can achieve high detection accuracy but output only scalar scores, and existing anomalous sound separation methods provide listenable explanations with limited detection accuracy. AnomSep first obtains preliminary normal-sound and anomalous-sound estimates through optimization-based separation using a dictionary learned from normal sounds in the target environment. Deep neural refinement then improves the preliminary estimates in a pretrained audio latent space. The separated anomalous sound serves as the listenable explanation, and its energy determines the anomaly score. Experiments on synthetic mixtures and real mixtures show improved separation quality over baseline separators. AnomSep achieves detection performance competitive with the end-to-end baseline and provides listenable explanations directly linked to each detection decision.", "arxiv_id": "2611.09279", "arxiv_url": "https://arxiv.org/abs/2611.09279", "authors": ["Koki Shoda", "Jun Younes Louhi Kasahara", "Qi An", "Atsushi Yamashita"], "brief": "AnomSep\u7ed3\u5408\u4f18\u5316\u5f0f\u58f0\u97f3\u5206\u79bb\u4e0e\u6df1\u5ea6\u795e\u7ecf\u7ec6\u5316\uff0c\u4ee5\u5206\u79bb\u51fa\u7684\u5f02\u5e38\u58f0\u97f3\u89e3\u91ca\u68c0\u6d4b\u51b3\u7b56\u3002\u5b9e\u9a8c\u663e\u793a\u5206\u79bb\u8d28\u91cf\u4f18\u4e8e\u57fa\u7ebf\uff0c\u68c0\u6d4b\u6027\u80fd\u53ef\u5ab2\u7f8e\u7aef\u5230\u7aef\u65b9\u6cd5\u3002", "categories": ["cs.SD", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09279", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u58f0\u97f3\u5f02\u5e38\u68c0\u6d4b", "\u58f0\u97f3\u5206\u79bb", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09279v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AnomSep: Bridging Optimization-Based Separation and Deep Neural Refinement for Anomaly Detection with Listenable Explanations", "tldr": "AnomSep\u7ed3\u5408\u4f18\u5316\u5f0f\u58f0\u97f3\u5206\u79bb\u4e0e\u6df1\u5ea6\u795e\u7ecf\u7ec6\u5316\uff0c\u4ee5\u5206\u79bb\u51fa\u7684\u5f02\u5e38\u58f0\u97f3\u89e3\u91ca\u68c0\u6d4b\u51b3\u7b56\u3002\u5b9e\u9a8c\u663e\u793a\u5206\u79bb\u8d28\u91cf\u4f18\u4e8e\u57fa\u7ebf\uff0c\u68c0\u6d4b\u6027\u80fd\u53ef\u5ab2\u7f8e\u7aef\u5230\u7aef\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Federated learning (FL) enables collaborative model training across distributed clients without sharing raw data, making it attractive for privacy-sensitive and bandwidth-constrained applications. A practical challenge in deploying FL is reducing communication overhead while maintaining model performance under heterogeneous, non-IID data distributions. Selecting which subset of clients participates in each training round offers a principled way to address both challenges simultaneously, yet its impact on data diversity and representativeness remains underexplored. In this paper, we investigate three client selection strategies, Power-of-Choice, Fisher information, and Centered Kernel Alignment, evaluating them not only by accuracy and convergence, but through the lens of participation diversity using the Gini coefficient and KL divergence. Under non-IID conditions, restricting participation to 15% of clients per round achieves significant communication savings, and when selection promotes diverse and balanced contributions, it also improves generalization over biased alternatives. This work provides a systematic and reproducible analysis demonstrating that diversity-focused client selection renders communication efficiency and model quality complementary rather than competing objectives.", "arxiv_id": "2611.09278", "arxiv_url": "https://arxiv.org/abs/2611.09278", "authors": ["Max Halleryd", "Sima Sinaei", "Viktor Valadi", "Mina Alibeigi", "Henrik Abrahamsson", "Salman Toor"], "brief": "\u6bd4\u8f83\u4e09\u79cd\u8054\u90a6\u5b66\u4e60\u5ba2\u6237\u7aef\u9009\u62e9\u7b56\u7565\uff0c\u5e76\u7528\u57fa\u5c3c\u7cfb\u6570\u548cKL\u6563\u5ea6\u8861\u91cf\u53c2\u4e0e\u591a\u6837\u6027\u3002\u975e\u72ec\u7acb\u540c\u5206\u5e03\u4e0b\uff0c\u6bcf\u8f6e\u4ec5\u900915%\u5ba2\u6237\u7aef\u53ef\u8282\u7701\u901a\u4fe1\uff0c\u5747\u8861\u53c2\u4e0e\u8fd8\u6539\u5584\u6cdb\u5316\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09278", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u5ba2\u6237\u7aef\u9009\u62e9", "\u901a\u4fe1\u6548\u7387", "\u6570\u636e\u5f02\u8d28\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09278v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Diversity-Aware Client Selection for Communication-Efficient Federated Learning", "tldr": "\u6bd4\u8f83\u4e09\u79cd\u8054\u90a6\u5b66\u4e60\u5ba2\u6237\u7aef\u9009\u62e9\u7b56\u7565\uff0c\u5e76\u7528\u57fa\u5c3c\u7cfb\u6570\u548cKL\u6563\u5ea6\u8861\u91cf\u53c2\u4e0e\u591a\u6837\u6027\u3002\u975e\u72ec\u7acb\u540c\u5206\u5e03\u4e0b\uff0c\u6bcf\u8f6e\u4ec5\u900915%\u5ba2\u6237\u7aef\u53ef\u8282\u7701\u901a\u4fe1\uff0c\u5747\u8861\u53c2\u4e0e\u8fd8\u6539\u5584\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) show remarkable performance based on parametric knowledge, i.e., their ability to recall facts and associations internalized in a model\u0027s weights. However, studying this capability on established multi-hop benchmarks may be complicated by benchmark contamination, as many of these benchmarks have been publicly available long enough to plausibly appear in modern pretraining corpora. As a result, correct answers under missing evidence may reflect either general parametric knowledge or memorization of benchmark-specific instances. To study how models use internal knowledge when retrieval evidence is incomplete, we introduce FondueQA, in which every required multi-hop fact is uniquely localized to a designated evidence document. This enables controlled document-level evidence ablations to study parametric compensation under incomplete retrieval. Our empirical evaluation reveals that parametric compensation strongly depends on both entity popularity and the structural role of missing evidence. Generally, models compensate more successfully for facts involving popular entities. On FondueQA, we show that bridging evidence can be more useful than the answer-bearing document itself. Moreover, models may recall a missing fact in isolation but fail to use it under partial evidence, particularly when the context contains plausible competing entities, which can reduce Exact Match by up to 15 percentage points.", "arxiv_id": "2611.09274", "arxiv_url": "https://arxiv.org/abs/2611.09274", "authors": ["Laurin Schmid", "Suman Navaratnarajah", "Koel Dutta Chowdhury", "Steffen Eger", "Josif Grabocka", "Christian Frey"], "brief": "\u63d0\u51faFondueQA\uff0c\u901a\u8fc7\u9010\u6587\u6863\u79fb\u9664\u8bc1\u636e\u8bc4\u4f30\u591a\u8df3\u95ee\u7b54\u4e2d\u7684\u5185\u90e8\u77e5\u8bc6\u8865\u507f\uff1b\u53d1\u73b0\u8865\u507f\u53d7\u5b9e\u4f53\u70ed\u5ea6\u4e0e\u8bc1\u636e\u89d2\u8272\u5f71\u54cd\uff0c\u7ade\u4e89\u5b9e\u4f53\u53ef\u4f7f\u51c6\u786e\u7387\u4e0b\u964d15\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.LG", "cs.AI", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09274", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u8df3\u95ee\u7b54", "\u53c2\u6570\u77e5\u8bc6", "\u68c0\u7d22\u589e\u5f3a", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09274v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FondueQA: A Benchmark for Evaluating Parametric Compensation in Multi-Hop QA", "tldr": "\u63d0\u51faFondueQA\uff0c\u901a\u8fc7\u9010\u6587\u6863\u79fb\u9664\u8bc1\u636e\u8bc4\u4f30\u591a\u8df3\u95ee\u7b54\u4e2d\u7684\u5185\u90e8\u77e5\u8bc6\u8865\u507f\uff1b\u53d1\u73b0\u8865\u507f\u53d7\u5b9e\u4f53\u70ed\u5ea6\u4e0e\u8bc1\u636e\u89d2\u8272\u5f71\u54cd\uff0c\u7ade\u4e89\u5b9e\u4f53\u53ef\u4f7f\u51c6\u786e\u7387\u4e0b\u964d15\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Phishing website detection remains a critical cybersecurity challenge. Although machine learning classifiers achieve high accuracy on benchmark datasets, they suffer from a fundamental limitation: once trained, their decision boundaries are fixed and cannot incorporate new contextual evidence without retraining the model. This work presents \\textbf{PHISHREV+}, a hybrid framework that instantiates the notion of \\textit{post-hoc defeasible machine learning}. This framework does not replace the classifier. It treats the initial classifier predictions as defeasible beliefs and revises them through an Answer Set Programming based non-monotonic reasoning(NMR) layer. The framework operates in two phases. In the machine learning phase, four classifiers (SVM, KNN, DT and RF) are trained on the 87 feature benchmark dataset. In the post-hoc NMR phase, four defeasible rules derived from exploratory data analysis of the training set, and validated through Chi-square and Mann-Whitney U tests, formally revise initial predictions. The proposed framework achieves consistent false positive reduction across all our classifiers SVM (41$\\rightarrow$39), KNN (47$\\rightarrow$46), DT (62$\\rightarrow$61), and RF (52$\\rightarrow$51) while maintaining complete false negative parity with zero increase overhead. A comprehensive ablation studies across seven rule configurations confirms that the hierarchical combination of all four defeasible rules is necessary to achieve this optimal balance. Instance level explainability is provided through eXplainable ASP (XASP), which generates formal derivation graphs showing which defeasible rules fired and why the initial belief was retracted, a capability absent from all existing phishing detection approaches.", "arxiv_id": "2611.09273", "arxiv_url": "https://arxiv.org/abs/2611.09273", "authors": ["Mainak Sen", "Kumar Sanka Ray", "Amlan Chakrabarti"], "brief": "\u63d0\u51fa\u57fa\u4e8eASP\u7684\u4e8b\u540e\u53ef\u64a4\u9500\u63a8\u7406\u6846\u67b6\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u4fee\u6b63\u9493\u9c7c\u7f51\u7ad9\u5206\u7c7b\u7ed3\u679c\uff1b\u56db\u7c7b\u5206\u7c7b\u5668\u8bef\u62a5\u5747\u5c0f\u5e45\u51cf\u5c11\uff0c\u6f0f\u62a5\u4e0d\u589e\uff0c\u5e76\u63d0\u4f9b\u89c4\u5219\u89e6\u53d1\u4e0e\u9884\u6d4b\u64a4\u56de\u7684\u89e3\u91ca\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09273", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9493\u9c7c\u68c0\u6d4b", "\u975e\u5355\u8c03\u63a8\u7406", "\u673a\u5668\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09273v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PHISHREV+: An ASP-Based Post-Hoc Defeasible Machine Learning Framework for Phishing Detection", "tldr": "\u63d0\u51fa\u57fa\u4e8eASP\u7684\u4e8b\u540e\u53ef\u64a4\u9500\u63a8\u7406\u6846\u67b6\uff0c\u65e0\u9700\u91cd\u8bad\u5373\u53ef\u4fee\u6b63\u9493\u9c7c\u7f51\u7ad9\u5206\u7c7b\u7ed3\u679c\uff1b\u56db\u7c7b\u5206\u7c7b\u5668\u8bef\u62a5\u5747\u5c0f\u5e45\u51cf\u5c11\uff0c\u6f0f\u62a5\u4e0d\u589e\uff0c\u5e76\u63d0\u4f9b\u89c4\u5219\u89e6\u53d1\u4e0e\u9884\u6d4b\u64a4\u56de\u7684\u89e3\u91ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The ENTSO-E Transparency Platform publishes generation, load, and cross-border power flows for European bidding zones. The values carry undocumented errors and violate energy conservation, and data reconciliation consists in correcting them to satisfy that balance. In this work, we formulate data reconciliation as Bayesian inference. Classical methods implicitly take a uniform prior, which we replace with a diffusion model estimated from the observations alone by empirical-Bayes expectation-maximization. The resulting posterior is sampled with a guided process whose projection step makes every sample satisfy the balance exactly. On synthetic systems of six to thirty-five bidding zones, built from ENTSO-E resource-adequacy data, the diffusion prior gives the most accurate reconciliation, increasingly so as the system grows. Its credible intervals are calibrated or conservative, and it remains the most accurate under a misspecified noise covariance. Finally, when the generation of entire zones goes unreported, the classical methods fail while the learned prior recovers it from cross-zone structure.", "arxiv_id": "2611.09265", "arxiv_url": "https://arxiv.org/abs/2611.09265", "authors": ["Matthias Pirlet", "Adrien Bolland", "Gilles Louppe", "Damien Ernst"], "brief": "\u5c06\u7535\u529b\u6570\u636e\u6821\u6b63\u5efa\u6a21\u4e3a\u8d1d\u53f6\u65af\u63a8\u65ad\uff0c\u4ec5\u4ece\u89c2\u6d4b\u5b66\u4e60\u6269\u6563\u5148\u9a8c\u5e76\u4e25\u683c\u6ee1\u8db3\u80fd\u91cf\u5b88\u6052\uff1b\u5728\u5408\u6210\u6b27\u6d32\u7535\u7f51\u4e2d\u7cbe\u5ea6\u9886\u5148\uff0c\u4e14\u53ef\u6062\u590d\u6574\u533a\u7f3a\u5931\u7684\u53d1\u7535\u6570\u636e\u3002", "categories": ["eess.SY", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09265", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7535\u529b\u7cfb\u7edf", "\u6570\u636e\u6821\u6b63", "\u6269\u6563\u6a21\u578b", "\u8d1d\u53f6\u65af\u63a8\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09265v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reconciling European Electricity Data with Diffusion Priors Learned from Observations Alone", "tldr": "\u5c06\u7535\u529b\u6570\u636e\u6821\u6b63\u5efa\u6a21\u4e3a\u8d1d\u53f6\u65af\u63a8\u65ad\uff0c\u4ec5\u4ece\u89c2\u6d4b\u5b66\u4e60\u6269\u6563\u5148\u9a8c\u5e76\u4e25\u683c\u6ee1\u8db3\u80fd\u91cf\u5b88\u6052\uff1b\u5728\u5408\u6210\u6b27\u6d32\u7535\u7f51\u4e2d\u7cbe\u5ea6\u9886\u5148\uff0c\u4e14\u53ef\u6062\u590d\u6574\u533a\u7f3a\u5931\u7684\u53d1\u7535\u6570\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Direction of arrival (DoA) estimation, a classical signal processing problem, has experienced renewed interest with the advent of integrated sensing and communication (ISAC). While decades of research have yielded highly accurate DoA estimators, hardware impairments have frequently been neglected, despite degrading both DoA estimation accuracy and downstream communication performance in ISAC systems. This work introduces a joint array calibration and DoA estimation method based on the simultaneous orthogonal matching pursuit (SOMP) algorithm, following the model-based machine learning paradigm. The proposed method enables the calibration of antenna arrays subject to severe gain-phase and antenna location impairments through projected gradient descent (PGD), with either supervised or unsupervised objectives. Additionally, DoA estimation is enhanced by extending SOMP to continuous dictionaries via PGD refinement steps. Simulation results demonstrate that the proposed method enables efficient hardware impairment compensation, even without labeled samples, while outperforming conventional sparse recovery and subspace-based DoA estimation baselines.", "arxiv_id": "2611.09263", "arxiv_url": "https://arxiv.org/abs/2611.09263", "authors": ["Baptiste Chatelier", "Jos\u00e9 Miguel Mateos-Ramos", "Vincent Corlay", "Matthieu Crussi\u00e8re", "Christian H\u00e4ger", "Henk Wymeersch", "Nir Shlezinger", "Luc Le Magoarou"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u6a21\u578b\u5b66\u4e60\u7684\u8054\u5408\u9635\u5217\u6821\u51c6\u4e0e\u5230\u8fbe\u89d2\u4f30\u8ba1\u65b9\u6cd5\uff0c\u7528\u8fde\u7eed\u7a00\u758f\u6062\u590d\u8865\u507f\u786c\u4ef6\u8bef\u5dee\u3002\u4eff\u771f\u663e\u793a\u65e0\u9700\u6807\u6ce8\u4e5f\u80fd\u6709\u6548\u6821\u51c6\uff0c\u4f30\u8ba1\u7cbe\u5ea6\u4f18\u4e8e\u4f20\u7edf\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09263", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5230\u8fbe\u89d2\u4f30\u8ba1", "\u9635\u5217\u6821\u51c6", "\u7a00\u758f\u6062\u590d", "\u65e0\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09263v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Model-based learning for DoA estimation and array calibration via continuous sparse recovery", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u6a21\u578b\u5b66\u4e60\u7684\u8054\u5408\u9635\u5217\u6821\u51c6\u4e0e\u5230\u8fbe\u89d2\u4f30\u8ba1\u65b9\u6cd5\uff0c\u7528\u8fde\u7eed\u7a00\u758f\u6062\u590d\u8865\u507f\u786c\u4ef6\u8bef\u5dee\u3002\u4eff\u771f\u663e\u793a\u65e0\u9700\u6807\u6ce8\u4e5f\u80fd\u6709\u6548\u6821\u51c6\uff0c\u4f30\u8ba1\u7cbe\u5ea6\u4f18\u4e8e\u4f20\u7edf\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "SRAM\u0027s power-performance-area-stability trade-off depends on bitcell topology, a discrete architectural choice that interacts non-separably with continuous transistor sizing. However, no open-source SRAM tool treats topology as an optimizable variable. OpenRAM generates SRAM layouts but performs no optimization, while OpenYield supports high-fidelity evaluation but restricts optimization to scalar sizing of a fixed 6T cell. OpenYieldV2 closes this gap through three integrated contributions. First, a fully parameterized compiler generates complete 6T and 10T SRAM macros with peripheral circuits and replica-bitline self-timing, enabling topology comparison under identical simulation conditions. Second, a few-shot TabPFN surrogate learns topology-dependent PPA responses with limited full-macro SPICE samples. Third, a coarse-to-refined multi-objective optimizer combines global exploration of discrete architectural choices with local refinement of continuous transistor sizes. Experiments across varying design conditions reveal a topology decision boundary that shifts with operating constraints rather than following a fixed design rule. Jointly optimizing across this boundary improves hypervolume by up to 17.3\\% over the strongest single-topology baseline. OpenYieldV2 is open-source to support reproducible SRAM design research.", "arxiv_id": "2611.09248", "arxiv_url": "https://arxiv.org/abs/2611.09248", "authors": ["Can Wang", "Junhao Ma", "Yikai Wang", "Shan Shen", "Wei W. Xing"], "brief": "OpenYieldV2\u8054\u5408\u4f18\u5316SRAM\u62d3\u6251\u4e0e\u6676\u4f53\u7ba1\u5c3a\u5bf8\uff0c\u7528\u5c11\u6837\u672c\u4ee3\u7406\u6a21\u578b\u964d\u4f4e\u4eff\u771f\u9700\u6c42\uff1b\u5b9e\u9a8c\u53d1\u73b0\u6700\u4f18\u62d3\u6251\u968f\u7ea6\u675f\u53d8\u5316\uff0c\u8d85\u4f53\u79ef\u8f83\u6700\u4f73\u5355\u62d3\u6251\u57fa\u7ebf\u63d0\u5347\u6700\u9ad817.3%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09248", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u82af\u7247\u8bbe\u8ba1", "\u591a\u76ee\u6807\u4f18\u5316", "\u4ee3\u7406\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09248v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Topology as a Design Variable: Joint Architecture-Sizing Optimization for SRAM", "tldr": "OpenYieldV2\u8054\u5408\u4f18\u5316SRAM\u62d3\u6251\u4e0e\u6676\u4f53\u7ba1\u5c3a\u5bf8\uff0c\u7528\u5c11\u6837\u672c\u4ee3\u7406\u6a21\u578b\u964d\u4f4e\u4eff\u771f\u9700\u6c42\uff1b\u5b9e\u9a8c\u53d1\u73b0\u6700\u4f18\u62d3\u6251\u968f\u7ea6\u675f\u53d8\u5316\uff0c\u8d85\u4f53\u79ef\u8f83\u6700\u4f73\u5355\u62d3\u6251\u57fa\u7ebf\u63d0\u5347\u6700\u9ad817.3%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Gaussian processes on graphs provide a principled framework for prediction and uncertainty estimation, but modelling heterogeneous networks often requires balancing flexibility against parameter complexity. Variability at a node may reflect useful signal that should propagate through the network, unreliable measurements whose influence should be suppressed, or a mixture of both. We introduce Variance-Coupled Gaussian Processes (VCGPs), which use a positive auxiliary signal to modulate graph interactions through a single learned coupling exponent. The exponent controls how strongly high-variability nodes propagate or attenuate information, while a cluster-wise extension accommodates different regimes within the same graph. Under stated structural assumptions, we characterize the unique stationary-rescaling point of the basic family, where correlations match those of a stationary graph kernel while node-dependent variances remain. Experiments on traffic, air-quality and weather datasets show competitive prediction and uncertainty estimation relative to stationary and per-node non-stationary baselines, with the largest gains on networks requiring multiple coupling regimes. Stationary correlations after variance rescaling remain sufficient on some data, and performance depends on the auxiliary signal and model selection.", "arxiv_id": "2611.09247", "arxiv_url": "https://arxiv.org/abs/2611.09247", "authors": ["K. S. Sesh Kumar", "Viacheslav Borovitskiy"], "brief": "\u63d0\u51faVCGP\uff0c\u7528\u5355\u4e00\u8026\u5408\u6307\u6570\u8c03\u8282\u56fe\u4e2d\u9ad8\u53d8\u5f02\u8282\u70b9\u7684\u4fe1\u606f\u4f20\u64ad\uff0c\u5e76\u652f\u6301\u5206\u7c07\u5efa\u6a21\u3002\u4ea4\u901a\u3001\u7a7a\u6c14\u8d28\u91cf\u548c\u5929\u6c14\u5b9e\u9a8c\u8868\u73b0\u5177\u7ade\u4e89\u529b\uff0c\u591a\u8026\u5408\u673a\u5236\u7f51\u7edc\u6536\u76ca\u6700\u5927\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09247", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u65af\u8fc7\u7a0b", "\u56fe\u5b66\u4e60", "\u975e\u5e73\u7a33\u5efa\u6a21", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09247v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Practical Non-Stationary Graph Gaussian Processes", "tldr": "\u63d0\u51faVCGP\uff0c\u7528\u5355\u4e00\u8026\u5408\u6307\u6570\u8c03\u8282\u56fe\u4e2d\u9ad8\u53d8\u5f02\u8282\u70b9\u7684\u4fe1\u606f\u4f20\u64ad\uff0c\u5e76\u652f\u6301\u5206\u7c07\u5efa\u6a21\u3002\u4ea4\u901a\u3001\u7a7a\u6c14\u8d28\u91cf\u548c\u5929\u6c14\u5b9e\u9a8c\u8868\u73b0\u5177\u7ade\u4e89\u529b\uff0c\u591a\u8026\u5408\u673a\u5236\u7f51\u7edc\u6536\u76ca\u6700\u5927\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal dynamic graphs are pervasive in real-world applications, where nodes and edges are accompanied by multimodal signals, including text and images. Despite their practical importance, benchmarks and methods that explicitly study multimodal learning in dynamic graphs remain scarce, hindering the full understanding and effective utilization of multimodal information for downstream tasks. To address this gap, we introduce MM-DyGraph, to the best of our knowledge, the first benchmark for multimodal dynamic graph learning, consisting of diverse real-world datasets with fine-grained temporal graph evolution and rich multimodal attributes. MM-DyGraph provides three evaluation tasks to comprehensively assess model performance in dynamic settings. We benchmark representative state-of-the-art dynamic graph methods and reveal that naive feature concatenation yields target-level inconsistencies: multimodal inputs benefit certain prediction targets while harming others. This observation indicates that the modality informativeness depends on the specific prediction target over time. Building on these observations, we propose a Target-aware Spatial-Temporal Multimodal Fusion (TST-MF) framework, which jointly conditions multimodal fusion on the prediction target and spatial-temporal relations, enabling context-adaptive cross-modal interplay for target-specific representations. Extensive experiments over diverse datasets and tasks show that TST-MF delivers robust and competitive performance, achieving clear gains in multimodal settings.", "arxiv_id": "2611.09240", "arxiv_url": "https://arxiv.org/abs/2611.09240", "authors": ["Zongyuan Wu", "Pengjie Wang", "Lingshan Chen", "Tianhang Wan", "Yuan Meng", "Xin Wang", "Ling Feng", "Wenwu Zhu"], "brief": "\u63d0\u51fa\u591a\u6a21\u6001\u52a8\u6001\u56fe\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u53d1\u73b0\u7b80\u5355\u62fc\u63a5\u7279\u5f81\u5bf9\u4e0d\u540c\u9884\u6d4b\u76ee\u6807\u6709\u5229\u6709\u5f0a\uff1b\u8bbe\u8ba1\u76ee\u6807\u611f\u77e5\u7684\u65f6\u7a7a\u878d\u5408\u6a21\u578b\uff0c\u5728\u591a\u6570\u636e\u96c6\u548c\u4efb\u52a1\u4e0a\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09240", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u52a8\u6001\u56fe", "\u591a\u6a21\u6001\u5b66\u4e60", "\u57fa\u51c6\u8bc4\u6d4b", "\u7279\u5f81\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09240v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MM-DyGraph: A Dataset, Benchmark, and Model for Multimodal Dynamic Graphs", "tldr": "\u63d0\u51fa\u591a\u6a21\u6001\u52a8\u6001\u56fe\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u53d1\u73b0\u7b80\u5355\u62fc\u63a5\u7279\u5f81\u5bf9\u4e0d\u540c\u9884\u6d4b\u76ee\u6807\u6709\u5229\u6709\u5f0a\uff1b\u8bbe\u8ba1\u76ee\u6807\u611f\u77e5\u7684\u65f6\u7a7a\u878d\u5408\u6a21\u578b\uff0c\u5728\u591a\u6570\u636e\u96c6\u548c\u4efb\u52a1\u4e0a\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Controllable molecule generation is crucial for diverse scientific applications, such as drug discovery and materials design. While large language models (LLMs) show great promise, their dense and entangled representations impede precise control over the generation of molecules with bespoke substructures or properties. To address this, we propose Sparse Representation Editing (SpaRE), an interpretability-driven framework for fine-grained and precise control in LLM-based molecule generation. The crux of SpaRE is to learn an overcomplete sparse feature space that disentangles LLM representations into a compact set of latent features corresponding to chemically meaningful concepts. Within this space, we can directly manipulate these concept-aligned latent features to achieve (1) local control, by generating target atoms and functional groups at specified positions; and (2) global control, by customizing the overall structural and physicochemical properties within defined ranges. In this way, our framework advances interpretability from post-hoc analysis to actionable generative control. Experiments show that SpaRE can generate chemically desirable molecules under complex constraints in real-world scenarios, while offering mechanistic insights for quantitative structure-property analysis. The code and demo are available at https://github.com/WanyuGroup/ICML2026_SpaRE.", "arxiv_id": "2611.09235", "arxiv_url": "https://arxiv.org/abs/2611.09235", "authors": ["Zhuoran Li", "Xu Sun", "Chang Wen Chen", "Wanyu Lin"], "brief": "SpaRE\u5c06\u5927\u6a21\u578b\u5206\u5b50\u8868\u5f81\u89e3\u8026\u4e3a\u5316\u5b66\u6982\u5ff5\u5bf9\u5e94\u7684\u7a00\u758f\u7279\u5f81\uff0c\u901a\u8fc7\u7f16\u8f91\u5b9e\u73b0\u5c40\u90e8\u57fa\u56e2\u4e0e\u6574\u4f53\u6027\u8d28\u63a7\u5236\uff1b\u5b9e\u9a8c\u8868\u660e\u53ef\u751f\u6210\u6ee1\u8db3\u590d\u6742\u7ea6\u675f\u7684\u5206\u5b50\uff0c\u5e76\u63d0\u4f9b\u673a\u7406\u89e3\u91ca\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09235", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5b50\u751f\u6210", "\u7a00\u758f\u8868\u793a", "\u53ef\u89e3\u91ca\u6027", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09235v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Controllable Molecule Generation via Sparse Representation Editing: An Interpretability-Driven Perspective", "tldr": "SpaRE\u5c06\u5927\u6a21\u578b\u5206\u5b50\u8868\u5f81\u89e3\u8026\u4e3a\u5316\u5b66\u6982\u5ff5\u5bf9\u5e94\u7684\u7a00\u758f\u7279\u5f81\uff0c\u901a\u8fc7\u7f16\u8f91\u5b9e\u73b0\u5c40\u90e8\u57fa\u56e2\u4e0e\u6574\u4f53\u6027\u8d28\u63a7\u5236\uff1b\u5b9e\u9a8c\u8868\u660e\u53ef\u751f\u6210\u6ee1\u8db3\u590d\u6742\u7ea6\u675f\u7684\u5206\u5b50\uff0c\u5e76\u63d0\u4f9b\u673a\u7406\u89e3\u91ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial Intelligence (AI) is increasingly embedded in high-risks decision-making systems across domains such as healthcare, finance, and the judicial system. As reliance on predictive models grows, so does the demand for Explainable AI (XAI) to ensure transparency, trust, and interpretability. However, existing XAI approaches often fail to present explanations in a format accessible to domain experts, limiting their practical utility. Large Language Models (LLMs) have recently emerged as a bridge between complex models and end-users, offering natural language explanations. Yet, their use introduces new risks, including hallucinated outputs and lack of source traceability. To address these challenges, we propose a Clinical Decision Support System (CDSS) that not only combines standard predictive models with XAI techniques but also incorporates a Retrieval-Augmented Generation module as an interactive enhancer. This module grounds explanations in verified medical knowledge, reformulates technical outputs into a human-like format, and enables users-such as clinicians-to actively query the system. By fostering an interactive, human-in-the-loop environment, our approach empowers domain experts to explore model decisions, contextualize explanations, and build trust in AI-assisted diagnostics. The study concludes with preliminary experiments validating the proposed methodology.", "arxiv_id": "2611.09232", "arxiv_url": "https://arxiv.org/abs/2611.09232", "authors": ["Lorenzo Mannocci", "Francesca Naretto", "Lucia Passaro", "Anna Monreale"], "brief": "\u63d0\u51fa\u7ed3\u5408\u9884\u6d4b\u6a21\u578b\u3001\u53ef\u89e3\u91ca\u6280\u672f\u4e0eRAG\u7684\u4e34\u5e8a\u51b3\u7b56\u652f\u6301\u7cfb\u7edf\uff0c\u7528\u533b\u5b66\u77e5\u8bc6\u652f\u6491\u53ef\u4ea4\u4e92\u7684\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\uff0c\u63d0\u5347\u53ef\u8ffd\u6eaf\u6027\uff1b\u521d\u6b65\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u65b9\u6cd5\u53ef\u884c\u6027\u3002", "categories": ["cs.AI", "cs.HC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09232", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e34\u5e8a\u51b3\u7b56\u652f\u6301", "\u53ef\u89e3\u91ca\u4eba\u5de5\u667a\u80fd", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09232v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RAG-Enhanced LLMs for Interactive Explainability in Clinical Decision Support Systems", "tldr": "\u63d0\u51fa\u7ed3\u5408\u9884\u6d4b\u6a21\u578b\u3001\u53ef\u89e3\u91ca\u6280\u672f\u4e0eRAG\u7684\u4e34\u5e8a\u51b3\u7b56\u652f\u6301\u7cfb\u7edf\uff0c\u7528\u533b\u5b66\u77e5\u8bc6\u652f\u6491\u53ef\u4ea4\u4e92\u7684\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\uff0c\u63d0\u5347\u53ef\u8ffd\u6eaf\u6027\uff1b\u521d\u6b65\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u65b9\u6cd5\u53ef\u884c\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Low-precision matrix throughput on modern GPUs is growing far faster than vector-arithmetic throughput. Attention therefore cannot realize the available GEMM performance because softmax has become the pipeline bottleneck. We introduce Fused-Softmax Attention, a training-free algorithm that reformulates and approximates softmax to fold its dominant operations into the attention GEMMs, moving work from vector units to matrix cores. Implemented for the AMD CDNA 4 architecture, our MXFP8, MXFP6 and MXFP4 kernels reach approximately 3.0, 4.0 and 4.6 PFLOP/s on an AMD Instinct MI355X GPU, yielding speedups of $2.1\\times$, $2.8\\times$ and $3.2\\times$ over the BF16 attention. Importantly, the additional error introduced by Fused-Softmax remains below the error floor set by quantizing the GEMM operands. On Wan2.2-T2V-A14B, a hybrid MXFP6/4 schedule delivers up to $2.05\\times$ end-to-end speedup while preserving the visual quality of the outputs. The kernels ship in AMD\u0027s open-source AITER library, and they powered AMD\u0027s MLPerf Inference v6.1 Wan2.2 submission, which ran $1.7\\times$ faster than AMD\u0027s previous-round result on the same hardware. Our results show that redesigning softmax to utilize the matrix pipeline enables attention to capitalize on continued growth in low-precision matrix throughput.", "arxiv_id": "2611.09225", "arxiv_url": "https://arxiv.org/abs/2611.09225", "authors": ["Tianxing Wu", "Juuso Korhonen", "Jesus Carabano Bravo"], "brief": "\u63d0\u51fa\u514d\u8bad\u7ec3\u7684Fused-Softmax\uff0c\u5c06\u4e3b\u8981\u8fd0\u7b97\u878d\u5165\u91cf\u5316\u77e9\u9635\u4e58\u6cd5\uff0c\u6ce8\u610f\u529b\u6700\u9ad8\u52a0\u901f3.2\u500d\uff1b\u89c6\u9891\u751f\u6210\u7aef\u5230\u7aef\u52a0\u901f2.05\u500d\uff0c\u4fdd\u6301\u753b\u8d28\u3002", "categories": ["cs.AI", "cs.LG", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09225", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5316\u6ce8\u610f\u529b", "\u4f4e\u7cbe\u5ea6\u8ba1\u7b97", "\u7b97\u5b50\u878d\u5408", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09225v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Fused-Softmax for efficient quantized attention", "tldr": "\u63d0\u51fa\u514d\u8bad\u7ec3\u7684Fused-Softmax\uff0c\u5c06\u4e3b\u8981\u8fd0\u7b97\u878d\u5165\u91cf\u5316\u77e9\u9635\u4e58\u6cd5\uff0c\u6ce8\u610f\u529b\u6700\u9ad8\u52a0\u901f3.2\u500d\uff1b\u89c6\u9891\u751f\u6210\u7aef\u5230\u7aef\u52a0\u901f2.05\u500d\uff0c\u4fdd\u6301\u753b\u8d28\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Estimating the state of a dynamical system from observations is a crucial task in robotics and control. Despite their empirical success, recurrent models often lack formal guarantees on convergence and robustness. We bridge this gap by analyzing these architectures from the perspective of nonlinear observer theory. By framing RNNs as a time-discretization of continuous latent dynamical systems (Neural ODEs), we demonstrate that enforcing a contraction condition on the latent flow guarantees the existence of a smooth, injective map of the true physical state into the latent space. We prove that this architecture acts as a tunable observer: by increasing a single scalar gain that scales the latent vector field, the estimation error can be driven to an arbitrarily small neighborhood of zero at an exponentially fast rate. We further establish quantitative bounds on the MLP complexity required to decode this latent state, and extend our formal guarantees to the discrete-time residual RNN implementation. We validate the theory on a real mobile robotic task, where a provably contracting model outperforms a vanilla GRU with substantially more stable training. We also report that unconstrained GRUs converge to contracting dynamics on this task, suggesting that contraction is an emergent property of well-trained sequence models.", "arxiv_id": "2611.09217", "arxiv_url": "https://arxiv.org/abs/2611.09217", "authors": ["Vincent Andrieu", "Pauline Bernard", "Lucas Brivadis", "Laurent Praly", "Christian Wolf"], "brief": "\u4ece\u975e\u7ebf\u6027\u89c2\u6d4b\u5668\u7406\u8bba\u51fa\u53d1\uff0c\u4e3a\u6536\u7f29\u5faa\u73af\u6a21\u578b\u5efa\u7acb\u72b6\u6001\u4f30\u8ba1\u7684\u6536\u655b\u4fdd\u8bc1\uff0c\u53ef\u8c03\u589e\u76ca\u4f7f\u8bef\u5dee\u6307\u6570\u8d8b\u8fd1\u96f6\uff1b\u771f\u5b9e\u79fb\u52a8\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u4f18\u4e8eGRU\uff0c\u8bad\u7ec3\u66f4\u7a33\u5b9a\u3002", "categories": ["cs.LG", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09217", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u72b6\u6001\u4f30\u8ba1", "\u5faa\u73af\u795e\u7ecf\u7f51\u7edc", "\u6536\u7f29\u7406\u8bba", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09217v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Provable State Estimation with Recurrent Models", "tldr": "\u4ece\u975e\u7ebf\u6027\u89c2\u6d4b\u5668\u7406\u8bba\u51fa\u53d1\uff0c\u4e3a\u6536\u7f29\u5faa\u73af\u6a21\u578b\u5efa\u7acb\u72b6\u6001\u4f30\u8ba1\u7684\u6536\u655b\u4fdd\u8bc1\uff0c\u53ef\u8c03\u589e\u76ca\u4f7f\u8bef\u5dee\u6307\u6570\u8d8b\u8fd1\u96f6\uff1b\u771f\u5b9e\u79fb\u52a8\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u4f18\u4e8eGRU\uff0c\u8bad\u7ec3\u66f4\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) is now central to training Reasoning Language Models (RLMs), but RLM pipelines are difficult to scale and costly to run because each RL step couples multiple large models, heterogeneous stages, cross-step state, and complex asynchronous dependencies. Existing systems typically optimize only parts of this design space. We address this complexity by jointly optimizing the pipeline structure as well as its execution using a novel data-centric graph intermediate representation called RLM Pipeline Execution Graph (RPEG). RPEG exposes structural choices such as bounded asynchrony and actor-critic sharing together with execution optimizations such as stage fusion, fine-grained scheduling, and multi-dimensional model parallelism. It is coupled with a comprehensive analytical performance model for RLM training, jointly capturing compute, communication, memory, and hierarchical rack-, node-, and GPU-level effects. Across systems with up to 256 GH200 GPUs, our distributed runtime engine implementing RPEG improves performance by up to 2x over ReaL and reduces step latency by up to 2.48x over verl, while increasing hardware utilization by up to 30%. Overall, RPEG provides a graph-driven foundation for next-generation training pipelines for frontier reasoning LLMs.", "arxiv_id": "2611.09207", "arxiv_url": "https://arxiv.org/abs/2611.09207", "authors": ["Maciej Besta", "Leonard Schmidt", "Pierre Pang", "Patrik Okanovic", "Robert Gerstenberger", "Torsten Hoefler"], "brief": "RPEG\u7528\u56fe\u8868\u793a\u4e0e\u6027\u80fd\u6a21\u578b\u8054\u5408\u4f18\u5316\u63a8\u7406\u8bed\u8a00\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5728256\u5361\u7cfb\u7edf\u4e0a\u8f83ReaL\u6700\u9ad8\u63d0\u901f2\u500d\uff0c\u8f83verl\u6700\u9ad8\u5c06\u6b65\u5ef6\u8fdf\u964d\u4f4e\u81f3\u7ea6\u56db\u6210\u3002", "categories": ["cs.DC", "cs.AI", "cs.CL", "cs.LG", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09207", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u8bed\u8a00\u6a21\u578b", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u6027\u80fd\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09207v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RPEG: Training Reasoning Language Models Scalably and Cost-Effectively", "tldr": "RPEG\u7528\u56fe\u8868\u793a\u4e0e\u6027\u80fd\u6a21\u578b\u8054\u5408\u4f18\u5316\u63a8\u7406\u8bed\u8a00\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5728256\u5361\u7cfb\u7edf\u4e0a\u8f83ReaL\u6700\u9ad8\u63d0\u901f2\u500d\uff0c\u8f83verl\u6700\u9ad8\u5c06\u6b65\u5ef6\u8fdf\u964d\u4f4e\u81f3\u7ea6\u56db\u6210\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many news reports of a claim are copies of one source: wire stories, content shared within a media group, syndicated features and press releases. We ask whether LLM judges and continual learners treat such copies as independent confirmations. In 200,000 English CC-News articles, a MinHash detector links 18.9% to a near-copy from another outlet (precision 0.97 once boilerplate is removed); it links 92% of edited reprints to their originals but none of the LLM rewrites by phi4, Llama 3.2 or Gemini 2.5 Flash. Shown three identical reprints of a claim about an unknown person instead of one report, Llama 3.2 3B and phi4 14B raised the share of lies they accepted from 0.06 to 0.71 and from 0.21 to 0.90 and ignored a note that the reports came from one source; Gemini 2.5 Flash already believed a single report, and Gemini 2.5 Pro followed provenance notes and tables. In a simulated continual-learning stream, showing the judge one report per detected chain cut the copied lies it accepted by 0.10-0.24 across four judges, at a mean cost of no more than 4.2 percentage points of accepted truths. Against reworded copies, a test of how many of a report\u0027s named entities are absent from an earlier look-alike separates LLM rewrites from 100 labelled independent reports of the same event with AUC 0.98-0.99 and wrongly flags one; entity overlap alone does as well, TF-IDF and a current embedding model come close, and the test catches few natural same-source derivatives. With the miss patterns of generated rewrite networks, it cut the reworded-copy lies accepted from 0.67 to 0.20 (0.40 when the rewriter invents details). Counting reports or chains alone is not a reliable defence, the effect of provenance information depends on the judge, and colluding sources remain the open problem. Code and labels: https://github.com/Metalesaek/copies-experiment", "arxiv_id": "2611.09203", "arxiv_url": "https://arxiv.org/abs/2611.09203", "authors": ["Abdelkader Metales", "Miriam Grabenheinrich", "Aicha Metales"], "brief": "\u7814\u7a76\u53d1\u73b0\u5927\u6a21\u578b\u4f1a\u628a\u65b0\u95fb\u8f6c\u8f7d\u8bef\u5f53\u72ec\u7acb\u4f50\u8bc1\uff0c\u91cd\u590d\u62a5\u9053\u663e\u8457\u63d0\u9ad8\u8c0e\u8a00\u63a5\u53d7\u7387\uff1b\u6309\u6765\u6e90\u94fe\u53bb\u91cd\u53ca\u8bc6\u522b\u6539\u5199\u53ef\u7f13\u89e3\u8bef\u4fe1\uff0c\u4f46\u6765\u6e90\u63d0\u793a\u6548\u679c\u56e0\u6a21\u578b\u800c\u5f02\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09203", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6301\u7eed\u5b66\u4e60", "\u65b0\u95fb\u53bb\u91cd", "\u4fe1\u606f\u53ef\u4fe1\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09203v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Copies Are Not Confirmations: How News Duplication Fools LLM Judges and Continual Learners", "tldr": "\u7814\u7a76\u53d1\u73b0\u5927\u6a21\u578b\u4f1a\u628a\u65b0\u95fb\u8f6c\u8f7d\u8bef\u5f53\u72ec\u7acb\u4f50\u8bc1\uff0c\u91cd\u590d\u62a5\u9053\u663e\u8457\u63d0\u9ad8\u8c0e\u8a00\u63a5\u53d7\u7387\uff1b\u6309\u6765\u6e90\u94fe\u53bb\u91cd\u53ca\u8bc6\u522b\u6539\u5199\u53ef\u7f13\u89e3\u8bef\u4fe1\uff0c\u4f46\u6765\u6e90\u63d0\u793a\u6548\u679c\u56e0\u6a21\u578b\u800c\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Shielding is a safe reinforcement learning technique that provides safety guarantees while learning, by blocking unsafe actions. Traditional shielding relies on a complete model of the environment to provide long-term guarantees. Probabilistic logic shielding (PLS) lifts the requirement of having such model, but only considers safety in the short term, typically looking only one or few steps ahead. We propose Probabilistic Option Shielding (POS), which extends PLS to the option level, recovering long-horizon safety without reintroducing the need for a complete environment model. POS learns a model-free critic directly from one-step PLS signals, to estimate the probability that an entire option will complete safely under uncertainty. We evaluate POS on safe navigation tasks in the LogiCity environment, and show that it achieves considerably safer training while matching the task performance of standard step-level PLS and other safety related reinforcement learning baselines.", "arxiv_id": "2611.09197", "arxiv_url": "https://arxiv.org/abs/2611.09197", "authors": ["Gian Luca Ascari", "Isidoro Tamassia", "Ying Jiao", "Luc De Raedt", "Giuseppe Marra"], "brief": "\u63d0\u51fa\u6982\u7387\u9009\u9879\u5c4f\u853d\uff0c\u5c06\u77ed\u671f\u5b89\u5168\u4fe1\u53f7\u6269\u5c55\u4e3a\u957f\u671f\u52a8\u4f5c\u9009\u9879\u7684\u5b89\u5168\u4f30\u8ba1\uff0c\u65e0\u9700\u5b8c\u6574\u73af\u5883\u6a21\u578b\uff1b\u5728\u5bfc\u822a\u4efb\u52a1\u4e2d\u663e\u8457\u63d0\u5347\u8bad\u7ec3\u5b89\u5168\u6027\uff0c\u540c\u65f6\u4fdd\u6301\u4efb\u52a1\u6027\u80fd\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09197", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5b89\u5168\u5f3a\u5316\u5b66\u4e60", "\u5c42\u6b21\u5f3a\u5316\u5b66\u4e60", "\u6982\u7387\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09197v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Safe Reinforcement Learning via Probabilistic Option Shielding", "tldr": "\u63d0\u51fa\u6982\u7387\u9009\u9879\u5c4f\u853d\uff0c\u5c06\u77ed\u671f\u5b89\u5168\u4fe1\u53f7\u6269\u5c55\u4e3a\u957f\u671f\u52a8\u4f5c\u9009\u9879\u7684\u5b89\u5168\u4f30\u8ba1\uff0c\u65e0\u9700\u5b8c\u6574\u73af\u5883\u6a21\u578b\uff1b\u5728\u5bfc\u822a\u4efb\u52a1\u4e2d\u663e\u8457\u63d0\u5347\u8bad\u7ec3\u5b89\u5168\u6027\uff0c\u540c\u65f6\u4fdd\u6301\u4efb\u52a1\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Interpretability has largely moved from reading a model\u0027s neurons directly to reading a second model trained on the first: a probe, a sparse autoencoder, a crosscoder. The move answered real faults -- mixed meanings, thresholds without a unit, readings that did not transfer from one study to the next -- but gave up what a direct reading alone provides: nothing trained in between, the neurons themselves named, and a reading that can be repeated and compared. Here the direct reading is made a measurement. A neuron\u0027s activation varies with the prompt, so its reading is a distribution over a population of stimuli. We declare that population: every factor around a target construct is drawn at its rate in a reference corpus and logged. From the declared distribution we generate a battery of prompts, and draw it twice. From the battery we compute the calibrated concept profile, one number per neuron, stated in units of the neuron\u0027s own spread on ordinary input; the two draws give every number a noise unit. Before the profile is read, a fixed set of checks licenses the battery on the model, and the smallest change the profile can resolve across training checkpoints is measured. Realised for Python on OpenCoder-1.5B and followed across checkpoints spanning two trillion training tokens, the profile gives what the alternatives do not report: a unit on every number, a chance level for every comparison, and which neurons carry a construct at every checkpoint. The battery, the code and the data behind every result are released.", "arxiv_id": "2611.09196", "arxiv_url": "https://arxiv.org/abs/2611.09196", "authors": ["Piotr Wilam"], "brief": "\u63d0\u51fa\u6821\u51c6\u6982\u5ff5\u5256\u9762\uff0c\u4ee5\u53c2\u8003\u8bed\u6599\u751f\u6210\u63d0\u793a\u5e76\u91cd\u590d\u91c7\u6837\uff0c\u4e3a\u795e\u7ecf\u5143\u8bfb\u6570\u8d4b\u4e88\u5c3a\u5ea6\u4e0e\u566a\u58f0\u5355\u4f4d\u3002\u5728OpenCoder\u4e0a\u8ffd\u8e2a\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u5b9e\u73b0\u8de8\u68c0\u67e5\u70b9\u7684\u53ef\u6bd4\u6982\u5ff5\u6d4b\u91cf\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09196", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u795e\u7ecf\u5143\u5206\u6790", "\u6982\u5ff5\u6d4b\u91cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09196v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Calibrated concept profiles: making the reading of a model\u0027s neurons a measurement", "tldr": "\u63d0\u51fa\u6821\u51c6\u6982\u5ff5\u5256\u9762\uff0c\u4ee5\u53c2\u8003\u8bed\u6599\u751f\u6210\u63d0\u793a\u5e76\u91cd\u590d\u91c7\u6837\uff0c\u4e3a\u795e\u7ecf\u5143\u8bfb\u6570\u8d4b\u4e88\u5c3a\u5ea6\u4e0e\u566a\u58f0\u5355\u4f4d\u3002\u5728OpenCoder\u4e0a\u8ffd\u8e2a\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u5b9e\u73b0\u8de8\u68c0\u67e5\u70b9\u7684\u53ef\u6bd4\u6982\u5ff5\u6d4b\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Structural role embeddings describe a node by its position in a graph - hub, bridge, periphery, member of a dense core - rather than by who its neighbours are. Existing methods either learn coordinates specific to one graph (struc2vec, Role2Vec, RESD) or read scales and normalisations from the whole graph (GraphWave, Digraphwave), so the same neighbourhood can receive different coordinates in two graphs; few read edge directions. We present RoleWalk, a training-free embedding that follows a short lazy random walk from each node and records, at each step, two distributions: that of the transition probabilities, through its characteristic function at a fixed grid of frequencies, and that of the walker\u0027s distance to its starting node. On directed graphs, walks that go forward then backward add who shares a node\u0027s targets or sources. The embedding depends only on a node\u0027s neighbourhood within a fixed radius, so its coordinates mean the same thing in every graph. We show that, without curvature, it is the kernel mean embedding of the walk\u0027s footprint, that it separates graphs that the Weisfeiler-Leman test cannot, and that pruning small probabilities comes with a per-node error certificate. Empirically, RoleWalk is competitive with the best role embeddings on five classification benchmarks at a fraction of their cost, has the highest scores on real directed roles in Wikipedia adminship, exceeds the published accuracy of Digraphwave at every noise level of its own Enron network-alignment benchmark, transfers centrality predictors to graphs four times larger better than existing inductive embeddings, hand-made features and a trained GIN, and embeds a million nodes in 20 s to 3 min on one CPU core. The code is open source (BSD license): https://github.com/kerighan/rolewalk", "arxiv_id": "2611.09189", "arxiv_url": "https://arxiv.org/abs/2611.09189", "authors": ["Maixent Chenebaux"], "brief": "RoleWalk\u4ee5\u5c40\u90e8\u968f\u673a\u6e38\u8d70\u6784\u5efa\u514d\u8bad\u7ec3\u3001\u53ef\u8de8\u56fe\u8fc1\u79fb\u7684\u6709\u5411\u56fe\u7ed3\u6784\u89d2\u8272\u5d4c\u5165\uff0c\u5728\u5206\u7c7b\u3001\u7f51\u7edc\u5bf9\u9f50\u4e0e\u4e2d\u5fc3\u6027\u8fc1\u79fb\u4efb\u52a1\u4e2d\u8868\u73b0\u7a81\u51fa\uff0c\u5355\u6838\u5904\u7406\u767e\u4e07\u8282\u70b9\u4ec5\u9700\u79d2\u81f3\u5206\u949f\u3002", "categories": ["cs.LG", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09189", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u5d4c\u5165", "\u968f\u673a\u6e38\u8d70", "\u8fc1\u79fb\u5b66\u4e60", "\u6709\u5411\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09189v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RoleWalk: training-free structural embeddings for directed graphs that transfer across graphs", "tldr": "RoleWalk\u4ee5\u5c40\u90e8\u968f\u673a\u6e38\u8d70\u6784\u5efa\u514d\u8bad\u7ec3\u3001\u53ef\u8de8\u56fe\u8fc1\u79fb\u7684\u6709\u5411\u56fe\u7ed3\u6784\u89d2\u8272\u5d4c\u5165\uff0c\u5728\u5206\u7c7b\u3001\u7f51\u7edc\u5bf9\u9f50\u4e0e\u4e2d\u5fc3\u6027\u8fc1\u79fb\u4efb\u52a1\u4e2d\u8868\u73b0\u7a81\u51fa\uff0c\u5355\u6838\u5904\u7406\u767e\u4e07\u8282\u70b9\u4ec5\u9700\u79d2\u81f3\u5206\u949f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While machine learning hiring tools are ubiquitous, the need for privacy regulations and commercial sensitivity makes public benchmarking legally complex. We address this challenge by introducing a taxonomy-driven, fully synthetic HR dataset and benchmark to simultaneously evaluate retrieval effectiveness and algorithmic fairness. Grounded in 660K real freelancer profiles, our multilingual corpus features candidate profiles, project briefs, and counterfactual demographic twins. Auditing state-of-the-art embedding models reveals performance divergence from general MTEB scores, alongside fairness disparities in grammatically gendered languages. This demonstrates that general benchmarks are insufficient for HR, requiring tailored evaluations to identify Pareto-optimal models that balance semantic accuracy and fairness.", "arxiv_id": "2611.09178", "arxiv_url": "https://arxiv.org/abs/2611.09178", "authors": ["Warren Jouanneau", "Morgane Hoffmann", "Emma Jouffroy", "Marc Palyart"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u5206\u7c7b\u4f53\u7cfb\u7684\u5168\u5408\u6210\u62db\u8058\u68c0\u7d22\u6570\u636e\u96c6\uff0c\u517c\u987e\u6548\u679c\u4e0e\u516c\u5e73\u6027\u8bc4\u4f30\uff1b\u53d1\u73b0\u6a21\u578b\u8868\u73b0\u504f\u79bb\u901a\u7528\u699c\u5355\uff0c\u4e14\u5728\u6709\u8bed\u6cd5\u6027\u522b\u7684\u8bed\u8a00\u4e2d\u5b58\u5728\u516c\u5e73\u6027\u5dee\u5f02\u3002", "categories": ["cs.LG", "cs.CL", "cs.CY", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09178", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5408\u6210\u6570\u636e", "\u4fe1\u606f\u68c0\u7d22", "\u7b97\u6cd5\u516c\u5e73\u6027", "\u62db\u8058"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09178v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Taxonomy-Driven Synthetic Dataset for Retrieval Effectiveness and Fairness Evaluation in Hiring", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u5206\u7c7b\u4f53\u7cfb\u7684\u5168\u5408\u6210\u62db\u8058\u68c0\u7d22\u6570\u636e\u96c6\uff0c\u517c\u987e\u6548\u679c\u4e0e\u516c\u5e73\u6027\u8bc4\u4f30\uff1b\u53d1\u73b0\u6a21\u578b\u8868\u73b0\u504f\u79bb\u901a\u7528\u699c\u5355\uff0c\u4e14\u5728\u6709\u8bed\u6cd5\u6027\u522b\u7684\u8bed\u8a00\u4e2d\u5b58\u5728\u516c\u5e73\u6027\u5dee\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reward-based fine-tuning of flow models requires effectively promoting high-reward and suppressing low-reward samples, while maintaining training stability over many rounds of iterative updates. Iterative reward fine-tuning provides a simple starting point, but the positive reward weights give no explicit unfitting signal, and repeated reweighting concentrates the distribution and causes collapse. We propose Stable Signed Flow Reinforcement (SIFR), which replaces the reward weights by signed advantages to supply the missing unfitting signal, and constrains the velocity drift from a reference model to stabilize the updates, with a Lagrange multiplier that adapts the regularization strength to a prescribed drift budget. We further show that existing flow RL methods fall within this framework: they implicitly minimize the signed loss, differing in their regularization choices. We validate SIFR on SD3.5 Medium (2.5B) and FLUX.2 Klein (9B) and scale it to Cosmos 3 Super Text2Image (64B): across all 12 backbone--reward pairs with preference and rule-based rewards, it matches or exceeds existing methods, reaches their peak rewards much faster, and keeps improving over long training where they plateau or collapse.", "arxiv_id": "2611.09175", "arxiv_url": "https://arxiv.org/abs/2611.09175", "authors": ["Runlong Liao", "Xingqian Xu", "Lizhang Chen", "Baiyu Su", "Yufan Huang", "Zhonghao Wang", "Akash Gokul", "Ming-Yu Liu", "Qiang Liu", "Yogesh Balaji"], "brief": "SIFR\u7528\u6709\u7b26\u53f7\u4f18\u52bf\u548c\u81ea\u9002\u5e94\u6f02\u79fb\u7ea6\u675f\u7a33\u5b9a\u5fae\u8c03\u6d41\u6a21\u578b\uff0c\u572812\u7ec4\u6a21\u578b\u4e0e\u5956\u52b1\u7ec4\u5408\u4e0a\u8ffd\u5e73\u6216\u8d85\u8d8a\u73b0\u6709\u65b9\u6cd5\uff0c\u66f4\u5feb\u8fbe\u5230\u5cf0\u503c\u5956\u52b1\u5e76\u6301\u7eed\u6539\u5584\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09175", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d41\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u5fae\u8c03", "\u8bad\u7ec3\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09175v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SIFR: Stable Signed Flow Reinforcement", "tldr": "SIFR\u7528\u6709\u7b26\u53f7\u4f18\u52bf\u548c\u81ea\u9002\u5e94\u6f02\u79fb\u7ea6\u675f\u7a33\u5b9a\u5fae\u8c03\u6d41\u6a21\u578b\uff0c\u572812\u7ec4\u6a21\u578b\u4e0e\u5956\u52b1\u7ec4\u5408\u4e0a\u8ffd\u5e73\u6216\u8d85\u8d8a\u73b0\u6709\u65b9\u6cd5\uff0c\u66f4\u5feb\u8fbe\u5230\u5cf0\u503c\u5956\u52b1\u5e76\u6301\u7eed\u6539\u5584\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Task-oriented semantic communication transmits task-relevant features to support receiver inference under limited communication resources and adverse channel conditions. For image classification, the usefulness of a feature depends on the other transmitted features and the distortion introduced by the wireless channel. Effective feature prioritization should therefore account for classification performance after transmission of the selected features. This paper proposes a Task-Oriented Feature Selection (\\textit{TOFS}) framework and method, which evaluates feature replacements using receiver classification loss. Loss differences confirmed under independent transmission samples provide pairwise ranking supervision for a selector network. The trained selector predicts priorities in a single forward pass. CIFAR-10 simulations demonstrate improved classification accuracy over an importance-based feature selection baseline at the same transmitted feature count and average transmit power. The proposed \\textit{TOFS} framework shows 84\\% accuracy performance under Rayleigh fading and Gaussian noise, compared with the 68\\% performance of a SOTA method.", "arxiv_id": "2611.09173", "arxiv_url": "https://arxiv.org/abs/2611.09173", "authors": ["Zhiyi Zhu", "Eiji Takimoto", "Patrick Finnerty", "Chikara Ohta"], "brief": "TOFS\u7528\u63a5\u6536\u7aef\u5206\u7c7b\u635f\u5931\u8bc4\u4f30\u7279\u5f81\u66ff\u6362\uff0c\u76d1\u7763\u7f51\u7edc\u5b66\u4e60\u4f20\u8f93\u4f18\u5148\u7ea7\uff1bCIFAR-10\u8870\u843d\u4fe1\u9053\u5b9e\u9a8c\u4e2d\uff0c\u540c\u7b49\u8d44\u6e90\u4e0b\u51c6\u786e\u7387\u4ece68%\u63d0\u5347\u81f384%\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09173", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u4e49\u901a\u4fe1", "\u7279\u5f81\u9009\u62e9", "\u65e0\u7ebf\u901a\u4fe1", "\u56fe\u50cf\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09173v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TOFS: Feature Selection with Swap Supervision for Semantic Communication over Fading Channels", "tldr": "TOFS\u7528\u63a5\u6536\u7aef\u5206\u7c7b\u635f\u5931\u8bc4\u4f30\u7279\u5f81\u66ff\u6362\uff0c\u76d1\u7763\u7f51\u7edc\u5b66\u4e60\u4f20\u8f93\u4f18\u5148\u7ea7\uff1bCIFAR-10\u8870\u843d\u4fe1\u9053\u5b9e\u9a8c\u4e2d\uff0c\u540c\u7b49\u8d44\u6e90\u4e0b\u51c6\u786e\u7387\u4ece68%\u63d0\u5347\u81f384%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep learning models achieve high accuracy in signal processing but remain difficult to interpret. Classical matching pursuit and sparse coding offer better transparency but suffer from spectral leakage and grid mismatch when signal frequencies do not align with discrete dictionary atoms. We introduce Continuous Dictionary Pursuit (CDP), a framework for interpretable signal decomposition that learns the parameters of closed-form functions directly from data. CDP optimizes over a continuous manifold of differentiable atoms and, unlike prior continuous pursuit methods that operate on a single analytic family, searches a heterogeneous library spanning periodic, trend, transient, and discontinuous structures. The algorithm employs a greedy iterative strategy using data-driven priors and gradient-based optimization to isolate individual signal components, with discontinuous waveforms made differentiable through spectral sharpness annealing. To ensure a sparse atom set for reconstruction, the framework utilizes a stopping criterion based on a predefined atom budget and residual error convergence. Evaluations on synthetic and real-world datasets show that CDP removes the grid discretization error for atom families contained in its library, recovers generative parameters to within $1\\%$ on stationary synthetic signals expressible in that library, and achieves the best sparsity-accuracy trade-off among classical, continuous-pursuit, and neural baselines in the sparse regime. Beyond decomposition, we demonstrate that the extracted atoms can serve as structured curriculum targets for training sequence models, improving forecasting accuracy over standard end-to-end training on most evaluated datasets. The method offers a glass-box alternative for signal decomposition by providing high reconstruction fidelity alongside direct physical interpretability.", "arxiv_id": "2611.09163", "arxiv_url": "https://arxiv.org/abs/2611.09163", "authors": ["Nick Janssen", "Melanie Schaller", "Bodo Rosenhahn"], "brief": "\u63d0\u51fa\u8fde\u7eed\u5b57\u5178\u8ffd\u8e2a\uff0c\u76f4\u63a5\u5b66\u4e60\u591a\u7c7b\u89e3\u6790\u51fd\u6570\u53c2\u6570\uff0c\u5b9e\u73b0\u53ef\u89e3\u91ca\u4fe1\u53f7\u5206\u89e3\u3002\u5728\u5b57\u5178\u8986\u76d6\u7684\u4fe1\u53f7\u4e0a\u6d88\u9664\u7f51\u683c\u8bef\u5dee\uff0c\u7a00\u758f\u91cd\u6784\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u8f85\u52a9\u63d0\u5347\u9884\u6d4b\u7cbe\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09163", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4fe1\u53f7\u5206\u89e3", "\u7a00\u758f\u8868\u793a", "\u53ef\u89e3\u91ca\u6027", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09163v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond the Grid: Continuous Dictionary Pursuit for Interpretable Signal Decomposition", "tldr": "\u63d0\u51fa\u8fde\u7eed\u5b57\u5178\u8ffd\u8e2a\uff0c\u76f4\u63a5\u5b66\u4e60\u591a\u7c7b\u89e3\u6790\u51fd\u6570\u53c2\u6570\uff0c\u5b9e\u73b0\u53ef\u89e3\u91ca\u4fe1\u53f7\u5206\u89e3\u3002\u5728\u5b57\u5178\u8986\u76d6\u7684\u4fe1\u53f7\u4e0a\u6d88\u9664\u7f51\u683c\u8bef\u5dee\uff0c\u7a00\u758f\u91cd\u6784\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u8f85\u52a9\u63d0\u5347\u9884\u6d4b\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The impacts of climate change have increased the need for reliable real-time rainfall monitoring systems. This study investigates rainfall detection using a network of opportunistic sensors based on satellite microwave links (SMLs) combined with machine learning (ML) classifiers. Two models, a random forest (RF) and a convolutional neural network (CNN), were trained on aggregated SML data, including information from neighboring links. The results demonstrate that leveraging information from multiple links substantially enhances the detection of both wet and dry periods compared to single-link approaches. Moreover, the RF model consistently provides a more stable and reliable trade-off than CNN, improving rainfall detection and reducing misclassifications overall, with particularly strong performance during harsh weather conditions. The study spanned up to 32 rainy days between 2021 and 2024.", "arxiv_id": "2611.09156", "arxiv_url": "https://arxiv.org/abs/2611.09156", "authors": ["Mostafa Ftouni", "Margherita Spalla", "Matteo Colli", "Andrea Randazzo", "Christian Gianoglio"], "brief": "\u7814\u7a76\u878d\u5408\u591a\u6761\u536b\u661f\u5fae\u6ce2\u94fe\u8def\u53ca\u90bb\u8fd1\u94fe\u8def\u6570\u636e\uff0c\u7528\u968f\u673a\u68ee\u6797\u548c\u5377\u79ef\u795e\u7ecf\u7f51\u7edc\u68c0\u6d4b\u964d\u96e8\uff1b\u591a\u94fe\u8def\u4f18\u4e8e\u5355\u94fe\u8def\uff0c\u968f\u673a\u68ee\u6797\u66f4\u7a33\u5b9a\u3001\u8bef\u5224\u66f4\u5c11\uff0c\u6076\u52a3\u5929\u6c14\u4e0b\u8868\u73b0\u5c24\u4f73\u3002", "categories": ["cs.AI", "cs.LG", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09156", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u964d\u96e8\u76d1\u6d4b", "\u536b\u661f\u5fae\u6ce2\u94fe\u8def", "\u673a\u5668\u5b66\u4e60", "\u591a\u4f20\u611f\u5668\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09156v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Evaluation of a Multi-Link Machine Learning Approach for Rainfall Detection Using Satellite Microwave Links", "tldr": "\u7814\u7a76\u878d\u5408\u591a\u6761\u536b\u661f\u5fae\u6ce2\u94fe\u8def\u53ca\u90bb\u8fd1\u94fe\u8def\u6570\u636e\uff0c\u7528\u968f\u673a\u68ee\u6797\u548c\u5377\u79ef\u795e\u7ecf\u7f51\u7edc\u68c0\u6d4b\u964d\u96e8\uff1b\u591a\u94fe\u8def\u4f18\u4e8e\u5355\u94fe\u8def\uff0c\u968f\u673a\u68ee\u6797\u66f4\u7a33\u5b9a\u3001\u8bef\u5224\u66f4\u5c11\uff0c\u6076\u52a3\u5929\u6c14\u4e0b\u8868\u73b0\u5c24\u4f73\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robot policies trained on visually narrow demonstrations can become sensitive to environmental features that are unrelated to the task. Existing generative augmentation methods can introduce visual diversity, but processing every frame and camera view independently is computationally expensive and may produce inconsistent observations across cameras and timestamps. We introduce Augmentron, a geometry-aware pipeline that generates reusable scene representations and renders them through recorded camera poses. This produces temporally and multi-view consistent environ- ment and workspace variations while preserving the robot, task objects, actions, and annotations. Across three physical manipulation tasks, replacing half of the real world training dataset with Augmentron data improves model success across three tasks for both in out-of-distribution distractor objects, and out-of-distribution workspace variation evaluations. In a separate comparison against alternate augmentation techniques, Augmentron achieves the highest pooled success in all three conditions. The results show that introducing augmented data to a data training recipe can help policies generalize to dynamic real-world settings.", "arxiv_id": "2611.09145", "arxiv_url": "https://arxiv.org/abs/2611.09145", "authors": ["Tanay Tandon", "Aseem Doriwala", "Jade Choghari", "Catherine Weaver", "Pragna Mannam"], "brief": "Augmentron\u901a\u8fc7\u51e0\u4f55\u611f\u77e5\u573a\u666f\u8868\u793a\u751f\u6210\u65f6\u5e8f\u4e0e\u591a\u89c6\u89d2\u4e00\u81f4\u7684\u673a\u5668\u4eba\u8bad\u7ec3\u6570\u636e\uff1b\u66ff\u6362\u4e00\u534a\u771f\u5b9e\u6570\u636e\u540e\uff0c\u4e09\u9879\u5b9e\u4f53\u64cd\u4f5c\u4efb\u52a1\u7684\u6210\u529f\u7387\u63d0\u9ad8\uff0c\u6cdb\u5316\u8868\u73b0\u4f18\u4e8e\u5176\u4ed6\u589e\u5f3a\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09145", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6570\u636e\u589e\u5f3a", "\u591a\u89c6\u89d2\u4e00\u81f4\u6027", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09145v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Augmentron: Scalable Multi-View Visual Augmentation for Robot Learning", "tldr": "Augmentron\u901a\u8fc7\u51e0\u4f55\u611f\u77e5\u573a\u666f\u8868\u793a\u751f\u6210\u65f6\u5e8f\u4e0e\u591a\u89c6\u89d2\u4e00\u81f4\u7684\u673a\u5668\u4eba\u8bad\u7ec3\u6570\u636e\uff1b\u66ff\u6362\u4e00\u534a\u771f\u5b9e\u6570\u636e\u540e\uff0c\u4e09\u9879\u5b9e\u4f53\u64cd\u4f5c\u4efb\u52a1\u7684\u6210\u529f\u7387\u63d0\u9ad8\uff0c\u6cdb\u5316\u8868\u73b0\u4f18\u4e8e\u5176\u4ed6\u589e\u5f3a\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Diffusion models have recently emerged as a powerful paradigm for generating 3D molecules. Despite showing remarkable promise, they learn atomic distributions implicitly from data, without explicitly encoding physicochemical rules into their generative dynamics. Consequently, generated samples can be statistically plausible yet chemically invalid. To address this problem, we propose Sequential Neuro-Symbolic Constrained Diffusion (SensDiff), a framework that integrates symbolic rules into generative modeling, enabling the model to internalize scientific priors during training. Central to SensDiff is the observation that the diffusion trajectory of 3D molecule generation exhibits a coarse-to-fine evolution: valid molecules arise by first mitigating macroscopic geometric conflicts and then refining structures toward microscopic chemical consistency through iterative denoising. Accordingly, SensDiff mirrors this dynamic by sequentially enforcing constraints with adaptive weighting during training, progressively steering generation toward valid molecular geometries. Moreover, SensDiff translates domain knowledge into interpretable generative controls, grounding opaque neural denoising in scientific principles. Experiments on molecular benchmarks and real-world constrained generation tasks confirm that SensDiff consistently improves chemical validity while adhering to physicochemical rules and user-specified targets. The code is publicly available at https://github.com/WanyuGroup/NeurIPS2026_SensDiff.", "arxiv_id": "2611.09142", "arxiv_url": "https://arxiv.org/abs/2611.09142", "authors": ["Zhuoran Li", "Xu Sun", "Chang Wen Chen", "Wanyu Lin"], "brief": "SensDiff\u5c06\u7269\u7406\u5316\u5b66\u89c4\u5219\u6309\u7531\u7c97\u5230\u7ec6\u7684\u987a\u5e8f\u878d\u5165\u4e09\u7ef4\u5206\u5b50\u6269\u6563\u8bad\u7ec3\uff0c\u4ee5\u81ea\u9002\u5e94\u6743\u91cd\u65bd\u52a0\u7ea6\u675f\uff0c\u63d0\u5347\u751f\u6210\u5206\u5b50\u7684\u5316\u5b66\u6709\u6548\u6027\uff0c\u5e76\u6ee1\u8db3\u7528\u6237\u6307\u5b9a\u76ee\u6807\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09142", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5b50\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u795e\u7ecf\u7b26\u53f7\u5b66\u4e60", "\u7ea6\u675f\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09142v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Generative Dynamics for 3D Molecule Generation via Sequential Neuro-Symbolic Constraints", "tldr": "SensDiff\u5c06\u7269\u7406\u5316\u5b66\u89c4\u5219\u6309\u7531\u7c97\u5230\u7ec6\u7684\u987a\u5e8f\u878d\u5165\u4e09\u7ef4\u5206\u5b50\u6269\u6563\u8bad\u7ec3\uff0c\u4ee5\u81ea\u9002\u5e94\u6743\u91cd\u65bd\u52a0\u7ea6\u675f\uff0c\u63d0\u5347\u751f\u6210\u5206\u5b50\u7684\u5316\u5b66\u6709\u6548\u6027\uff0c\u5e76\u6ee1\u8db3\u7528\u6237\u6307\u5b9a\u76ee\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial intelligence for power electronics is evolving toward a deeper comprehension of system intrinsic behaviors and dynamics. As a novel integration of neural computation and electric circuits, spike-based neuromorphic computing offers promising potential in high energy efficiency and adaptability for data-driven applications. Building on the latency-coding principles, this article proposes a framework for data-light condition monitoring that relies solely on three-phase AC current measurements. The AC current signals are encoded as membrane potentials of RC-based spiking neurons, which are inherently compatible with spiking neural networks that can effectively facilitate the estimation of device parameters. Case studies are presented to validate the performances, while constraints and further optimizations are also evaluated and discussed, and future extensions of the methodology are provided.", "arxiv_id": "2611.09141", "arxiv_url": "https://arxiv.org/abs/2611.09141", "authors": ["Yubo Song", "Pascal A. Schirmer", "Subham Sahoo"], "brief": "\u63d0\u51fa\u7535\u8def\u7406\u8bba\u9a71\u52a8\u7684\u4f4e\u6570\u636e\u91cf\u72b6\u6001\u76d1\u6d4b\u6846\u67b6\uff0c\u5c06\u4e09\u76f8\u4ea4\u6d41\u7535\u6d41\u7f16\u7801\u4e3aRC\u8109\u51b2\u795e\u7ecf\u5143\u819c\u7535\u4f4d\uff0c\u7528\u4e8e\u5668\u4ef6\u53c2\u6570\u4f30\u8ba1\uff0c\u5e76\u901a\u8fc7\u6848\u4f8b\u9a8c\u8bc1\u6027\u80fd\u3002", "categories": ["cs.ET", "cs.AI", "cs.LG", "cs.NE", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.09141", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u529f\u7387\u7535\u5b50", "\u72b6\u6001\u76d1\u6d4b", "\u8109\u51b2\u795e\u7ecf\u7f51\u7edc", "\u795e\u7ecf\u5f62\u6001\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.09141v1", "published_at": "2026-11-06", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Circuit Theory-Informed AI for Condition Monitoring in Power Electronics", "tldr": "\u63d0\u51fa\u7535\u8def\u7406\u8bba\u9a71\u52a8\u7684\u4f4e\u6570\u636e\u91cf\u72b6\u6001\u76d1\u6d4b\u6846\u67b6\uff0c\u5c06\u4e09\u76f8\u4ea4\u6d41\u7535\u6d41\u7f16\u7801\u4e3aRC\u8109\u51b2\u795e\u7ecf\u5143\u819c\u7535\u4f4d\uff0c\u7528\u4e8e\u5668\u4ef6\u53c2\u6570\u4f30\u8ba1\uff0c\u5e76\u901a\u8fc7\u6848\u4f8b\u9a8c\u8bc1\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large public datasets have driven recent progress in machine learning, from text and vision to speech and general audio. Music remains an outlier, as copyright blocks redistribution of training audio, while many modern tasks need individual stems rather than mixtures. Existing multitrack resources trade off realism, scale, and licensing, while synthetic alternatives rely on propriet
