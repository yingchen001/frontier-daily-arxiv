", "Dali Kaafar"], "brief": "\u8bba\u6587\u63d0\u51fa SpliTEE\uff0c\u5c06 LLM \u63a8\u7406\u62c6\u5206\u5230\u53ef\u4fe1\u6267\u884c\u73af\u5883\uff08TEE\uff09\u4e0e\u4e0d\u53ef\u4fe1 GPU \u4e0a\u6267\u884c\uff0c\u5e76\u7528\u5dee\u5206\u9690\u79c1\u4fdd\u62a4\u53d1\u9001\u7ed9 GPU \u7684\u4e2d\u95f4\u8868\u793a\u3002\u5176\u6838\u5fc3\u662f\u5bf9\u5173\u952e LLM \u51fd\u6570\u505a\u5168\u5c40\u654f\u611f\u5ea6\u5206\u6790\uff0c\u4ece\u800c\u63a7\u5236\u566a\u58f0\u89c4\u6a21\u5e76\u4fdd\u6301\u6d6e\u70b9\u63a8\u7406\u3002", "categories": ["cs.CR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15039", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u4e2d\u95f4\u8868\u793a\u5b58\u5728\u9690\u79c1\u98ce\u9669\uff1a\u63d0\u793a\u8bcd\u91cd\u6784\u653b\u51fb\u53ef\u4ece\u4e2d\u95f4\u8868\u793a\u4e2d\u4ee5\u8fd180%\u51c6\u786e\u7387\u6062\u590d\u63d0\u793a\u8bcd\u3002", "\u76f8\u6bd4 Slalom \u7684\u52a0\u5bc6\u65b9\u6848\uff0cSpliTEE \u7528\u5dee\u5206\u9690\u79c1\u63a9\u853d\u4e2d\u95f4\u8f93\u5165\uff0c\u907f\u514d\u91cf\u5316\u5e76\u652f\u6301\u6d6e\u70b9\u57df\u63a8\u7406\u3002", "\u5728 Intel TDX \u4e0a\u7528 Llama-3.2-3B \u548c Qwen3-4B \u6d4b\u8bd5\uff0c\u76f8\u6bd4\u7eaf CPU TEE \u63a8\u7406\u63a5\u8fd1\u5feb2\u500d\uff0c\u5e76\u6bd4\u52a0\u5bc6\u5f0f Slalom \u5feb5-15\u79d2\u4e14\u51c6\u786e\u7387\u66f4\u9ad8\u3002"], "keywords": ["\u9690\u79c1\u8ba1\u7b97", "\u53ef\u4fe1\u6267\u884c\u73af\u5883", "\u5927\u6a21\u578b\u63a8\u7406", "\u5dee\u5206\u9690\u79c1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15039", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SpliTEE: Improving LLM Inference on Trusted Hardware with Differentially Private GPU Outsourcing", "tldr": "\u7528\u5dee\u5206\u9690\u79c1\u52a0\u901fTEE\u5185LLM\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SpliTEE\uff0c\u5c06 LLM \u63a8\u7406\u62c6\u5206\u5230\u53ef\u4fe1\u6267\u884c\u73af\u5883\uff08TEE\uff09\u4e0e\u4e0d\u53ef\u4fe1 GPU \u4e0a\u6267\u884c\uff0c\u5e76\u7528\u5dee\u5206\u9690\u79c1\u4fdd\u62a4\u53d1\u9001\u7ed9 GPU \u7684\u4e2d\u95f4\u8868\u793a\u3002\u5176\u6838\u5fc3\u662f\u5bf9\u5173\u952e LLM \u51fd\u6570\u505a\u5168\u5c40\u654f\u611f\u5ea6\u5206\u6790\uff0c\u4ece\u800c\u63a7\u5236\u566a\u58f0\u89c4\u6a21\u5e76\u4fdd\u6301\u6d6e\u70b9\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u9690\u79c1\u4fdd\u62a4\u3001TEE \u4e0e GPU \u52a0\u901f\u7ed3\u5408\u8d77\u6765\uff0c\u4e3a\u654f\u611f\u63d0\u793a\u8bcd\u573a\u666f\u4e0b\u7684 LLM \u670d\u52a1\u63d0\u4f9b\u4e86\u66f4\u5b9e\u7528\u7684\u7cfb\u7edf\u65b9\u6848\uff1b\u540c\u65f6\u8bc1\u660e\u4e86\u4e2d\u95f4\u8868\u793a\u6cc4\u9732\u98ce\u9669\uff0c\u5e76\u7ed9\u51fa\u53ef\u5206\u6790\u7684\u5dee\u5206\u9690\u79c1\u4fdd\u62a4\u673a\u5236\u3002"}, {"abstract": "Data attribution seeks to quantify how individual training examples shape a model\u0027s predictions and underpins problems including data valuation, machine unlearning, and model interpretability. Despite having a long line of work, computationally scalable methods often struggle to predict the effect of removing training data in neural networks due to their non-convex nature. To overcome this challenge, metagradient-based methods such as MAGIC (Ilyas and Engstrom, 2025) differentiate each prediction through the entire training run and compute its exact influence with respect to the training data, but require a separate run for every prediction. To reduce this cost, we cast budgeted attribution as estimating a large influence matrix from a small number of measurements. We show that the measurements most appropriate for recovering this matrix differ from those best suited for attribution itself. We then present two algorithms, MAGE and SPELL, suited for reconstruction and attribution respectively, that run on existing metagradient machinery at no extra cost. Empirical studies demonstrate strong performance over existing baselines across training scales and measurement budgets.", "arxiv_id": "2609.15044", "arxiv_url": "https://arxiv.org/abs/2609.15044", "authors": ["Yuxi Chen", "Hamza Golubovic", "Han Tong", "Arian Maleki", "Andrew Ilyas"], "brief": "\u672c\u6587\u5c06\u9884\u7b97\u53d7\u9650\u7684\u6570\u636e\u5f52\u56e0\u95ee\u9898\u8868\u8ff0\u4e3a\u4ece\u5c11\u91cf\u6d4b\u91cf\u4e2d\u4f30\u8ba1\u5927\u89c4\u6a21\u5f71\u54cd\u77e9\u9635\uff0c\u4ee5\u9884\u6d4b\u8bad\u7ec3\u6837\u672c\u5bf9\u6a21\u578b\u9884\u6d4b\u7684\u5f71\u54cd\u3002\u4f5c\u8005\u63d0\u51fa MAGE \u4e0e SPELL \u4e24\u79cd\u7b97\u6cd5\uff0c\u5206\u522b\u9762\u5411\u5f71\u54cd\u77e9\u9635\u91cd\u6784\u548c\u5f52\u56e0\u4efb\u52a1\uff0c\u5e76\u53ef\u76f4\u63a5\u590d\u7528\u73b0\u6709\u5143\u68af\u5ea6\u8ba1\u7b97\u6846\u67b6\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15044", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u7528\u4e8e\u6062\u590d\u5f71\u54cd\u77e9\u9635\u7684\u6700\u4f18\u6d4b\u91cf\u65b9\u5f0f\uff0c\u4e0e\u76f4\u63a5\u505a\u5f52\u56e0\u65f6\u6700\u5408\u9002\u7684\u6d4b\u91cf\u65b9\u5f0f\u5e76\u4e0d\u76f8\u540c", "MAGE \u9762\u5411\u5927\u89c4\u6a21\u5f71\u54cd\u77e9\u9635\u91cd\u6784\uff0cSPELL \u9762\u5411\u7ed9\u5b9a\u9884\u7b97\u4e0b\u7684\u9ad8\u6548\u6570\u636e\u5f52\u56e0", "\u5728\u4e0d\u540c\u8bad\u7ec3\u89c4\u6a21\u548c\u6d4b\u91cf\u9884\u7b97\u4e0b\uff0c\u5b9e\u9a8c\u8868\u73b0\u4f18\u4e8e\u73b0\u6709\u57fa\u7ebf\u65b9\u6cd5"], "keywords": ["\u6570\u636e\u5f52\u56e0", "\u5143\u68af\u5ea6", "\u53ef\u89e3\u91ca\u6027", "\u673a\u5668\u9057\u5fd8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15044", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Data Attribution at Scale via Influence Matrix Estimation", "tldr": "\u7528\u77e9\u9635\u4f30\u8ba1\u6269\u5c55\u795e\u7ecf\u7f51\u7edc\u6570\u636e\u5f52\u56e0", "upvotes": 0, "what_it_is": "\u672c\u6587\u5c06\u9884\u7b97\u53d7\u9650\u7684\u6570\u636e\u5f52\u56e0\u95ee\u9898\u8868\u8ff0\u4e3a\u4ece\u5c11\u91cf\u6d4b\u91cf\u4e2d\u4f30\u8ba1\u5927\u89c4\u6a21\u5f71\u54cd\u77e9\u9635\uff0c\u4ee5\u9884\u6d4b\u8bad\u7ec3\u6837\u672c\u5bf9\u6a21\u578b\u9884\u6d4b\u7684\u5f71\u54cd\u3002\u4f5c\u8005\u63d0\u51fa MAGE \u4e0e SPELL \u4e24\u79cd\u7b97\u6cd5\uff0c\u5206\u522b\u9762\u5411\u5f71\u54cd\u77e9\u9635\u91cd\u6784\u548c\u5f52\u56e0\u4efb\u52a1\uff0c\u5e76\u53ef\u76f4\u63a5\u590d\u7528\u73b0\u6709\u5143\u68af\u5ea6\u8ba1\u7b97\u6846\u67b6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u7f13\u89e3\u7cbe\u786e\u5143\u68af\u5ea6\u5f52\u56e0\u9700\u8981\u4e3a\u6bcf\u4e2a\u9884\u6d4b\u5355\u72ec\u8fd0\u884c\u7684\u9ad8\u6210\u672c\u95ee\u9898\uff0c\u4e3a\u6570\u636e\u4f30\u503c\u3001\u673a\u5668\u9057\u5fd8\u548c\u6a21\u578b\u53ef\u89e3\u91ca\u6027\u63d0\u4f9b\u66f4\u53ef\u6269\u5c55\u7684\u5de5\u5177\u3002"}, {"abstract": "Diffusion Language Models (DLMs) generate text by iteratively denoising a masked sequence, independently predicting multiple tokens at each step. This conditional independence discards inter-token dependencies and degrades coherence-an issue that parallels the multi-modality problem in Non-Autoregressive Translation (NAT). Drawing on the Directed Acyclic Transformer (DAT), which tackles this problem in NAT via a Directed Acyclic Graph (DAG), we propose DA-DLM, a model that adapts DAG-based dependency modeling to DLMs\u0027 iterative setting through a position-oriented DAG design. The position-oriented DAG binds node groups to fixed output positions so that tokens fixed in earlier steps anchor neighboring predictions via learned transitions, and evolves with denoising to focus on remaining uncertainty as anchors accumulate. On language modeling, open-ended generation, and summarization, DA-DLM consistently outperforms Block Diffusion, especially under fewer denoising steps, and matches autoregressive models while preserving the parallel generation advantage. Our code is publicly available at https://github.com/jipy0222/DA-DLM.", "arxiv_id": "2609.15070", "arxiv_url": "https://arxiv.org/abs/2609.15070", "authors": ["Pengyu Ji", "Zichen Zhang", "Xiang Hu", "Kewei Tu"], "brief": "\u672c\u6587\u63d0\u51fa DA-DLM\uff0c\u5c06 Directed Acyclic Transformer \u7684 DAG \u4f9d\u8d56\u5efa\u6a21\u5f15\u5165\u6269\u6563\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u9762\u5411\u4f4d\u7f6e\u7684 DAG \u8bbe\u8ba1\uff0c\u5728\u8fed\u4ee3\u53bb\u566a\u8fc7\u7a0b\u4e2d\u663e\u5f0f\u5efa\u6a21\u672a\u786e\u5b9a token \u4e0e\u5df2\u786e\u5b9a token \u4e4b\u95f4\u7684\u4f9d\u8d56\u5173\u7cfb\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15070", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5e76\u884c\u9884\u6d4b\u591a\u4e2a token \u65f6\u7684\u6761\u4ef6\u72ec\u7acb\u5047\u8bbe\uff0c\u7f13\u89e3\u6587\u672c\u8fde\u8d2f\u6027\u4e0b\u964d\u95ee\u9898", "\u8bbe\u8ba1\u4f4d\u7f6e\u7ed1\u5b9a\u7684 DAG \u8282\u70b9\u7ec4\uff0c\u4f7f\u65e9\u671f\u786e\u5b9a\u7684 token \u4f5c\u4e3a\u951a\u70b9\uff0c\u901a\u8fc7\u5b66\u4e60\u5230\u7684\u8f6c\u79fb\u5173\u7cfb\u5f71\u54cd\u90bb\u8fd1\u9884\u6d4b", "\u5728\u8bed\u8a00\u5efa\u6a21\u3001\u5f00\u653e\u5f0f\u751f\u6210\u548c\u6458\u8981\u4efb\u52a1\u4e0a\u4f18\u4e8e Block Diffusion\uff0c\u5c24\u5176\u5728\u8f83\u5c11\u53bb\u566a\u6b65\u6570\u4e0b\u8868\u73b0\u66f4\u660e\u663e"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u975e\u81ea\u56de\u5f52\u751f\u6210", "\u6587\u672c\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15070", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DA-DLM: Explicitly Modeling Token Dependencies in Diffusion Language Models", "tldr": "\u7528\u6709\u5411\u65e0\u73af\u56fe\u589e\u5f3a\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4f9d\u8d56\u5efa\u6a21", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa DA-DLM\uff0c\u5c06 Directed Acyclic Transformer \u7684 DAG \u4f9d\u8d56\u5efa\u6a21\u5f15\u5165\u6269\u6563\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u9762\u5411\u4f4d\u7f6e\u7684 DAG \u8bbe\u8ba1\uff0c\u5728\u8fed\u4ee3\u53bb\u566a\u8fc7\u7a0b\u4e2d\u663e\u5f0f\u5efa\u6a21\u672a\u786e\u5b9a token \u4e0e\u5df2\u786e\u5b9a token \u4e4b\u95f4\u7684\u4f9d\u8d56\u5173\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u975e\u81ea\u56de\u5f52\u7ffb\u8bd1\u4e2d\u7684 DAG \u4f9d\u8d56\u5efa\u6a21\u8fc1\u79fb\u5230\u6269\u6563\u8bed\u8a00\u6a21\u578b\uff0c\u4e3a\u63d0\u5347\u5e76\u884c\u6587\u672c\u751f\u6210\u7684\u8fde\u8d2f\u6027\u63d0\u4f9b\u4e86\u65b0\u8def\u5f84\uff0c\u5e76\u5728\u4fdd\u6301\u5e76\u884c\u751f\u6210\u4f18\u52bf\u7684\u540c\u65f6\u63a5\u8fd1\u81ea\u56de\u5f52\u6a21\u578b\u6548\u679c\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) enables large language models (LLMs) to answer questions by accessing external knowledge and has been widely adopted for long-term conversational memory question answering. However, existing methods suffer from two key challenges: (1) fragmented evidence scattered across temporally distant sessions, and (2) noisy content within retrieved sessions that triggers the lost-in-the-middle effect. To address these challenges, we propose MemLoc, a unified Retrieve-Localize-Generate framework for long-term conversational memory QA. For retrieval, MemLoc decomposes each session into multi-granularity memory units and performs query routing via an inner-memory graph with entropy-based granularity selection. It further models cross-session semantic and temporal dependencies through a cross-memory graph, enabling coarse-to-fine retrieval of top-K relevant memory candidates. For localization, we introduce a reasoning-based evidence locator trained with Self-reflective Hint Policy Optimization (SHPO), which performs progressive refinement by extracting query-relevant fragments within memory units to suppress noise and reranking across candidates to remove redundancy, producing a compact evidence set with lightweight location IDs. For generation, these IDs act as precise grounding signals that guide the LLM to the correct memory positions, mitigating the lost-in-the-middle effect while preserving original contextual integrity. Extensive experiments on four benchmarks demonstrate that MemLoc achieves state-of-the-art retrieval accuracy and response quality while maintaining efficiency. Our code is available at: https://github.com/Nikol-coder/MemLoc.", "arxiv_id": "2609.07093", "arxiv_url": "https://arxiv.org/abs/2609.07093", "authors": ["Yifan Wang", "Xinkui Lin", "Yongxiu Xu", "Shen Gao", "Ruochen Yang", "Kun Huang", "Yubin Wang", "Jie Wu", "Wei Liu", "Jian Luan", "Hongbo Xu", "Shuo Shang"], "brief": "\u8bba\u6587\u63d0\u51fa MemLoc\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u671f\u5bf9\u8bdd\u8bb0\u5fc6\u95ee\u7b54\u7684 Retrieve-Localize-Generate \u7edf\u4e00\u6846\u67b6\u3002\u5b83\u5148\u8fdb\u884c\u591a\u7c92\u5ea6\u8bb0\u5fc6\u68c0\u7d22\uff0c\u518d\u5b9a\u4f4d\u5173\u952e\u8bc1\u636e\u7247\u6bb5\uff0c\u6700\u540e\u7528\u4f4d\u7f6e ID \u5f15\u5bfc\u5927\u6a21\u578b\u751f\u6210\u7b54\u6848\u3002", "categories": ["cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07093", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u4f1a\u8bdd\u62c6\u89e3\u4e3a\u591a\u7c92\u5ea6\u8bb0\u5fc6\u5355\u5143\uff0c\u5e76\u901a\u8fc7\u5185\u90e8\u8bb0\u5fc6\u56fe\u4e0e\u71b5\u9a71\u52a8\u7684\u7c92\u5ea6\u9009\u62e9\u8fdb\u884c\u67e5\u8be2\u8def\u7531\u3002", "\u6784\u5efa\u8de8\u8bb0\u5fc6\u56fe\u5efa\u6a21\u8de8\u4f1a\u8bdd\u7684\u8bed\u4e49\u4e0e\u65f6\u95f4\u4f9d\u8d56\uff0c\u5b9e\u73b0\u7531\u7c97\u5230\u7ec6\u7684 top-K \u8bb0\u5fc6\u5019\u9009\u68c0\u7d22\u3002", "\u63d0\u51fa\u57fa\u4e8e\u63a8\u7406\u7684\u8bc1\u636e\u5b9a\u4f4d\u5668\uff0c\u5e76\u7528 SHPO \u8bad\u7ec3\uff0c\u901a\u8fc7\u7247\u6bb5\u62bd\u53d6\u3001\u91cd\u6392\u5e8f\u548c\u8f7b\u91cf\u4f4d\u7f6e ID \u7f13\u89e3\u566a\u58f0\u4e0e lost-in-the-middle \u95ee\u9898\u3002"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u957f\u671f\u8bb0\u5fc6", "\u5bf9\u8bdd\u95ee\u7b54", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07093", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Where to Look and What to Use: Retrieve-Localize-Generate for Long-Term Conversational Memory Question Answering", "tldr": "MemLoc\u63d0\u5347\u957f\u671f\u5bf9\u8bdd\u8bb0\u5fc6\u95ee\u7b54\u68c0\u7d22\u4e0e\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MemLoc\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u671f\u5bf9\u8bdd\u8bb0\u5fc6\u95ee\u7b54\u7684 Retrieve-Localize-Generate \u7edf\u4e00\u6846\u67b6\u3002\u5b83\u5148\u8fdb\u884c\u591a\u7c92\u5ea6\u8bb0\u5fc6\u68c0\u7d22\uff0c\u518d\u5b9a\u4f4d\u5173\u952e\u8bc1\u636e\u7247\u6bb5\uff0c\u6700\u540e\u7528\u4f4d\u7f6e ID \u5f15\u5bfc\u5927\u6a21\u578b\u751f\u6210\u7b54\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u540c\u65f6\u5904\u7406\u957f\u671f\u5bf9\u8bdd\u8bb0\u5fc6\u4e2d\u7684\u8bc1\u636e\u5206\u6563\u548c\u68c0\u7d22\u566a\u58f0\u4e24\u5927\u75db\u70b9\uff0c\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97 SOTA \u7684\u68c0\u7d22\u51c6\u786e\u7387\u4e0e\u56de\u7b54\u8d28\u91cf\uff0c\u5e76\u517c\u987e\u6548\u7387\uff0c\u9002\u5408\u7528\u4e8e\u957f\u671f\u8bb0\u5fc6\u578b RAG \u7cfb\u7edf\u3002"}, {"abstract": "We present FrogNano, a 4B coding agent designed to tackle software engineering (SWE) tasks efficiently and effectively, even under resource-constrained environments. It is post-trained exclusively via RL on around 1,500 SWE environments with synthetic tasks. A key ingredient for improving performance is an online task synthesis pipeline that creates tasks calibrated to the frontier of learnability for the current checkpoint. This report provides evidence that competitive small coding agents can be trained with synthetic tasks alone, without traditional distillation from larger models, and that generating tasks at the learnability frontier of the current agent is important. We report details on the training methodology, evaluations across diverse environments, and in-depth analyses, serving as a foundation for our ongoing exploration of lightweight yet capable coding agents that can run on minimal hardware.", "arxiv_id": "2609.07925", "arxiv_url": "https://arxiv.org/abs/2609.07925", "authors": ["Minseon Kim", "Zhengyan Shi", "Emiliano Penaloza", "Christopher Cui", "Roger Creus Castanyer", "Maryam Hashemzadeh", "Isadora White", "Jonathan Light", "Jeonghye Kim", "Matheus Pereira", "Darya Moldavskaya", "Chinmay Singh", "Fabio Vera", "Baolin Peng", "Xingdi Yuan", "Marc-Alexandre C\u00f4t\u00e9", "Alessandro Sordoni"], "brief": "\u8bba\u6587\u63d0\u51fa FrogNano\uff0c\u4e00\u4e2a\u9762\u5411\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u7684 4B \u4ee3\u7801\u667a\u80fd\u4f53\u3002\u5b83\u4ec5\u5728\u7ea6 1500 \u4e2a\u5408\u6210 SWE \u73af\u5883\u4e2d\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\uff0c\u65e0\u9700\u5927\u6a21\u578b\u84b8\u998f\u5373\u53ef\u83b7\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07925", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6838\u5fc3\u65b9\u6cd5\u662f\u5728\u7ebf\u4efb\u52a1\u5408\u6210\u6d41\u6c34\u7ebf\uff0c\u6839\u636e\u5f53\u524d\u6a21\u578b\u80fd\u529b\u751f\u6210\u5904\u4e8e\u201c\u53ef\u5b66\u4e60\u524d\u6cbf\u201d\u7684\u8bad\u7ec3\u4efb\u52a1", "\u8bad\u7ec3\u5b8c\u5168\u4f9d\u8d56\u5408\u6210\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u800c\u975e\u4f20\u7edf\u7684\u5927\u6a21\u578b\u84b8\u998f\u6216\u4eba\u5de5\u6807\u6ce8\u6570\u636e", "\u5c55\u793a\u4e86\u5c0f\u578b\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u8d44\u6e90\u53d7\u9650\u786c\u4ef6\u4e0a\u5904\u7406 SWE \u4efb\u52a1\u7684\u6f5c\u529b\uff0c\u5e76\u8fdb\u884c\u4e86\u591a\u73af\u5883\u8bc4\u6d4b\u4e0e\u5206\u6790"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5408\u6210\u6570\u636e", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07925", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FrogNano: Training a 4B Coding Agent via Online Task Synthesis", "tldr": "\u7528\u5728\u7ebf\u5408\u6210\u4efb\u52a1\u8bad\u7ec34B\u4ee3\u7801\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FrogNano\uff0c\u4e00\u4e2a\u9762\u5411\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u7684 4B \u4ee3\u7801\u667a\u80fd\u4f53\u3002\u5b83\u4ec5\u5728\u7ea6 1500 \u4e2a\u5408\u6210 SWE \u73af\u5883\u4e2d\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\uff0c\u65e0\u9700\u5927\u6a21\u578b\u84b8\u998f\u5373\u53ef\u83b7\u5f97\u6709\u7ade\u4e89\u529b\u7684\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bf4\u660e\u5c0f\u53c2\u6570\u4ee3\u7801\u667a\u80fd\u4f53\u4e5f\u53ef\u901a\u8fc7\u81ea\u9002\u5e94\u5408\u6210\u4efb\u52a1\u8bad\u7ec3\u83b7\u5f97\u5b9e\u7528\u80fd\u529b\uff0c\u964d\u4f4e\u4e86\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u7684\u8bad\u7ec3\u4e0e\u90e8\u7f72\u95e8\u69db\uff0c\u5bf9\u8f7b\u91cf\u5316\u672c\u5730\u4ee3\u7801\u52a9\u624b\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) have been widely adopted for clinical question answering (QA). Current systems can attach citations to their answers, but these often point to broad texts, leaving time-pressed clinicians unable to verify them efficiently. An alternative is to ensure that responses are verifiable by construction: providing fine-grained verbatim quotes from reference material that substantiate claims, so users can verify an answer without opening other documents. In this paper, we evaluate the ability of current models to perform this task end-to-end: from providing citations for every factual claim, to producing verbatim quotes, to ensuring that those quotes fully substantiate the claims. To do so, we build a standardized harness over four clinical practice guidelines and evaluate twelve LLMs on 222 synthetic clinical questions, measuring each of these stages separately. We find that most models can attach verbatim quotes to over 90% of their claims from prompting alone, apart from some lightweight models such as claude-haiku-4.5. Yet these quotes often fail to substantiate every detail of the claims they accompany. For instance, claude-opus-5 produces verbatim quotes for 98.0% of its claims, but fully substantiates only 37.1%. Our work provides insights into the current capability gap of LLMs in building verifiable clinical QA systems, along with artifacts for future research.", "arxiv_id": "2609.15964", "arxiv_url": "https://arxiv.org/abs/2609.15964", "authors": ["Jiashuo Zhang", "Yuling Chen", "Yvonne Commodore-Mensah", "Michael Oberst"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411\u4e34\u5e8a\u95ee\u7b54\u7684\u6807\u51c6\u5316\u8bc4\u6d4b\u6846\u67b6\uff0c\u8981\u6c42\u6a21\u578b\u4e3a\u6bcf\u4e2a\u4e8b\u5b9e\u6027\u58f0\u660e\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u3001\u9010\u5b57\u5f15\u7528\uff0c\u5e76\u68c0\u9a8c\u5f15\u7528\u662f\u5426\u5b8c\u6574\u652f\u6491\u58f0\u660e\u3002\u7814\u7a76\u57284\u4efd\u4e34\u5e8a\u5b9e\u8df5\u6307\u5357\u548c222\u4e2a\u5408\u6210\u95ee\u9898\u4e0a\u8bc4\u4f30\u4e8612\u4e2aLLM\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15964", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc4\u6d4b\u94fe\u8def\u8986\u76d6\u4e09\u9636\u6bb5\uff1a\u6bcf\u4e2a\u4e8b\u5b9e\u58f0\u660e\u662f\u5426\u6709\u5f15\u7528\u3001\u5f15\u7528\u662f\u5426\u4e3a\u539f\u6587\u9010\u5b57\u6458\u5f55\u3001\u5f15\u7528\u662f\u5426\u5b8c\u5168\u652f\u6491\u5bf9\u5e94\u58f0\u660e\u3002", "\u591a\u6570\u6a21\u578b\u4ec5\u9760\u63d0\u793a\u5373\u53ef\u4e3a\u8d85\u8fc790%\u7684\u58f0\u660e\u9644\u4e0a\u9010\u5b57\u5f15\u7528\uff0c\u4f46\u201c\u5f15\u7528\u5b58\u5728\u201d\u4e0d\u7b49\u4e8e\u201c\u8bc1\u636e\u5145\u5206\u201d\u3002", "\u4f8b\u5982 claude-opus-5 \u4e3a98.0%\u7684\u58f0\u660e\u751f\u6210\u9010\u5b57\u5f15\u7528\uff0c\u4f46\u53ea\u670937.1%\u7684\u58f0\u660e\u88ab\u5f15\u7528\u5b8c\u5168\u652f\u6491\u3002"], "keywords": ["\u4e34\u5e8a\u95ee\u7b54", "\u53ef\u9a8c\u8bc1\u6027", "\u5f15\u7528\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15964", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Verifiable by Construction: Claim-Level Evaluation of Verbatim Citation in Clinical Question Answering", "tldr": "\u8bc4\u6d4b\u4e34\u5e8aQA\u9010\u6761\u5f15\u7528\u7684\u53ef\u9a8c\u8bc1\u6027\u7f3a\u53e3", "upvotes": 0, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411\u4e34\u5e8a\u95ee\u7b54\u7684\u6807\u51c6\u5316\u8bc4\u6d4b\u6846\u67b6\uff0c\u8981\u6c42\u6a21\u578b\u4e3a\u6bcf\u4e2a\u4e8b\u5b9e\u6027\u58f0\u660e\u63d0\u4f9b\u7ec6\u7c92\u5ea6\u3001\u9010\u5b57\u5f15\u7528\uff0c\u5e76\u68c0\u9a8c\u5f15\u7528\u662f\u5426\u5b8c\u6574\u652f\u6491\u58f0\u660e\u3002\u7814\u7a76\u57284\u4efd\u4e34\u5e8a\u5b9e\u8df5\u6307\u5357\u548c222\u4e2a\u5408\u6210\u95ee\u9898\u4e0a\u8bc4\u4f30\u4e8612\u4e2aLLM\u3002", "why_notable": "\u4e34\u5e8a\u573a\u666f\u5bf9\u53ef\u8ffd\u6eaf\u548c\u5feb\u901f\u6838\u9a8c\u8981\u6c42\u6781\u9ad8\uff0c\u8bba\u6587\u63ed\u793a\u4e86\u5f53\u524dLLM\u5728\u7ec6\u7c92\u5ea6\u8bc1\u636e\u652f\u6491\u4e0a\u7684\u5173\u952e\u77ed\u677f\uff0c\u5e76\u63d0\u4f9b\u8bc4\u6d4b\u5de5\u5177\u4e0e\u6570\u636e\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u66f4\u53ef\u9760\u7684\u4e34\u5e8a\u95ee\u7b54\u7cfb\u7edf\u3002"}, {"abstract": "Large language models (LLMs) often learn both desirable and undesirable properties during post-training. We study whether midtraining, an earlier training stage, can shape which of these properties later generalise. We introduce Inoculation Midtraining, a technique that teaches a base model that unsafe behaviour belongs to a designated \u003cquarantine_token\u003e context, as indicated by the \u003cquarantine_token\u003e neologism (a new token) introduced during midtraining, and then post-trains the model on unsafe data within that context. We then evaluate the model outside the context, with the \u003cquarantine_token\u003e neologism excluded from the system prompt. Across supervised fine-tuning and reinforcement learning post-training regimes, we find that Inoculation Midtraining can reduce misalignment while preserving the transfer of benign data properties (e.g., speaking in German or Shakespearean prose). However, our approach does not outperform standard Inoculation Prompting, is sensitive to training configuration, and produces a leaky boundary that nearby contextual cues can reactivate. These results show that inoculation with a learned association introduced via midtraining can shape selective generalisation. Still, more work is needed before this approach can become a load-bearing component in a developer\u0027s safety framework.", "arxiv_id": "2609.15886", "arxiv_url": "https://arxiv.org/abs/2609.15886", "authors": ["Kyle O\u0027Brien", "Edward James Young", "Puria Radmard", "Nathalie Kirch", "Cameron Tice", "Tomek Korbak", "David Demitri Africa"], "brief": "\u8bba\u6587\u63d0\u51fa Inoculation Midtraining\uff1a\u5728\u4e2d\u8bad\u7ec3\u9636\u6bb5\u5f15\u5165\u4e00\u4e2a\u65b0 token\uff0c\u5c06\u4e0d\u5b89\u5168\u884c\u4e3a\u7ed1\u5b9a\u5230\u7279\u5b9a\u201c\u9694\u79bb\u201d\u4e0a\u4e0b\u6587\uff0c\u518d\u5728\u8be5\u4e0a\u4e0b\u6587\u4e2d\u8fdb\u884c\u542b\u4e0d\u5b89\u5168\u6570\u636e\u7684\u540e\u8bad\u7ec3\u3002\u8bc4\u4f30\u65f6\u79fb\u9664\u8be5 token\uff0c\u89c2\u5bdf\u6a21\u578b\u662f\u5426\u80fd\u4fdd\u7559\u826f\u6027\u80fd\u529b\u8fc1\u79fb\u540c\u65f6\u51cf\u5c11\u4e0d\u5b89\u5168\u6cdb\u5316\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15886", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728\u76d1\u7763\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\uff0c\u8be5\u65b9\u6cd5\u80fd\u964d\u4f4e\u90e8\u5206\u5931\u914d\u884c\u4e3a\uff0c\u540c\u65f6\u4fdd\u7559\u5982\u5fb7\u8bed\u8868\u8fbe\u3001\u838e\u58eb\u6bd4\u4e9a\u6587\u98ce\u7b49\u826f\u6027\u5c5e\u6027\u8fc1\u79fb", "\u65b9\u6cd5\u4f9d\u8d56\u4e2d\u8bad\u7ec3\u9636\u6bb5\u5b66\u5230\u7684\u65b0\u8bcd\u5173\u8054\uff0c\u5c06\u4e0d\u5b89\u5168\u884c\u4e3a\u9650\u5b9a\u5728 \u003cquarantine_token\u003e \u4e0a\u4e0b\u6587\u4e2d", "\u6548\u679c\u5bf9\u8bad\u7ec3\u914d\u7f6e\u654f\u611f\uff0c\u9694\u79bb\u8fb9\u754c\u4f1a\u6cc4\u6f0f\uff0c\u90bb\u8fd1\u4e0a\u4e0b\u6587\u7ebf\u7d22\u53ef\u80fd\u91cd\u65b0\u6fc0\u6d3b\u4e0d\u5b89\u5168\u884c\u4e3a"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u5bf9\u9f50", "\u8bad\u7ec3\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15886", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Inoculation Midtraining with Learned Neologisms", "tldr": "\u7528\u65b0\u8bcd\u9694\u79bb\u4e0d\u5b89\u5168\u884c\u4e3a\u4ee5\u63a7\u5236\u6cdb\u5316", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Inoculation Midtraining\uff1a\u5728\u4e2d\u8bad\u7ec3\u9636\u6bb5\u5f15\u5165\u4e00\u4e2a\u65b0 token\uff0c\u5c06\u4e0d\u5b89\u5168\u884c\u4e3a\u7ed1\u5b9a\u5230\u7279\u5b9a\u201c\u9694\u79bb\u201d\u4e0a\u4e0b\u6587\uff0c\u518d\u5728\u8be5\u4e0a\u4e0b\u6587\u4e2d\u8fdb\u884c\u542b\u4e0d\u5b89\u5168\u6570\u636e\u7684\u540e\u8bad\u7ec3\u3002\u8bc4\u4f30\u65f6\u79fb\u9664\u8be5 token\uff0c\u89c2\u5bdf\u6a21\u578b\u662f\u5426\u80fd\u4fdd\u7559\u826f\u6027\u80fd\u529b\u8fc1\u79fb\u540c\u65f6\u51cf\u5c11\u4e0d\u5b89\u5168\u6cdb\u5316\u3002", "why_notable": "\u8be5\u7814\u7a76\u63a2\u7d22\u4e86\u901a\u8fc7\u4e2d\u8bad\u7ec3\u5851\u9020\u540e\u7eed\u6cdb\u5316\u65b9\u5411\u7684\u5b89\u5168\u673a\u5236\uff0c\u663e\u793a\u201c\u5b66\u5f97\u7684\u4e0a\u4e0b\u6587\u9694\u79bb\u201d\u5177\u5907\u4e00\u5b9a\u53ef\u884c\u6027\uff0c\u4f46\u4e5f\u63ed\u793a\u5176\u5c1a\u4e0d\u8db3\u4ee5\u4f5c\u4e3a\u53ef\u9760\u5b89\u5168\u7ec4\u4ef6\u3002"}, {"abstract": "Frontier models score well on shallow document/chart reading tasks. In a controlled data-room audit, moving evidence into buried conditions reduced accuracy, increased forced declarations, increased tool calls, and increased cost per correct answer. Confidence and benchmark calibration did not fully capture wrong answers; a documented production incident shows fabricated structural claims can be mixed with accurate numeric tables. Agentic evaluations need claim-level receipts (statement-level provenance, not answer-level scores), condition-aware scoring, and human-adversarial verification - an auditing discipline, not a leaderboard. The setting we measure is financial due diligence; the setting we are building toward next is defense staff work, where the same buried-evidence shape appears. In both, the model is not a party to the consequences; the person who signs is. In plain terms: in the documented cases we examine, agents can pair accurate numbers with confident fabricated explanations, and the burden of proof must therefore move from the model to the evidence trail.", "arxiv_id": "2609.15319", "arxiv_url": "https://arxiv.org/abs/2609.15319", "authors": ["Luis M. S\u00e1nchez"], "brief": "\u8bba\u6587\u901a\u8fc7\u91d1\u878d\u5c3d\u8c03\u6570\u636e\u5ba4\u5ba1\u8ba1\u53d1\u73b0\uff0c\u524d\u6cbf\u667a\u80fd\u4f53\u5728\u8bc1\u636e\u88ab\u57cb\u5165\u590d\u6742\u6761\u4ef6\u65f6\u51c6\u786e\u7387\u4e0b\u964d\uff0c\u5374\u66f4\u9891\u7e41\u7ed9\u51fa\u5f3a\u5236\u6027\u7ed3\u8bba\u3001\u8c03\u7528\u66f4\u591a\u5de5\u5177\uff0c\u5e76\u63d0\u9ad8\u6bcf\u4e2a\u6b63\u786e\u7b54\u6848\u7684\u6210\u672c\u3002\u6a21\u578b\u7684\u7f6e\u4fe1\u5ea6\u548c\u5e38\u89c4\u57fa\u51c6\u6821\u51c6\u96be\u4ee5\u66b4\u9732\u9519\u8bef\uff0c\u751a\u81f3\u4f1a\u628a\u51c6\u786e\u6570\u5b57\u4e0e\u7f16\u9020\u7684\u7ed3\u6784\u6027\u89e3\u91ca\u6df7\u5728\u4e00\u8d77\uff0c\u56e0\u6b64\u8bc4\u6d4b\u5e94\u8f6c\u5411\u58f0\u660e\u7ea7\u8bc1\u636e\u8ffd\u8e2a\u3001\u6761\u4ef6\u611f\u77e5\u8bc4\u5206\u548c\u4eba\u5de5\u5bf9\u6297\u9a8c\u8bc1\u3002", "categories": ["cs.IR", "cs.AI", "cs.CL", "q-fin.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15319", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u95ee\u7b54\u8bc4\u6d4b", "\u53ef\u89e3\u91ca\u6027", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15319", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Clean Scores, Buried Evidence, and Confident Wrong: A Receipt-Based Audit of Frontier Agentic QA", "tldr": "\u8bba\u6587\u901a\u8fc7\u91d1\u878d\u5c3d\u8c03\u6570\u636e\u5ba4\u5ba1\u8ba1\u53d1\u73b0\uff0c\u524d\u6cbf\u667a\u80fd\u4f53\u5728\u8bc1\u636e\u88ab\u57cb\u5165\u590d\u6742\u6761\u4ef6\u65f6\u51c6\u786e\u7387\u4e0b\u964d\uff0c\u5374\u66f4\u9891\u7e41\u7ed9\u51fa\u5f3a\u5236\u6027\u7ed3\u8bba\u3001\u8c03\u7528\u66f4\u591a\u5de5\u5177\uff0c\u5e76\u63d0\u9ad8\u6bcf\u4e2a\u6b63\u786e\u7b54\u6848\u7684\u6210\u672c\u3002\u6a21\u578b\u7684\u7f6e\u4fe1\u5ea6\u548c\u5e38\u89c4\u57fa\u51c6\u6821\u51c6\u96be\u4ee5\u66b4\u9732\u9519\u8bef\uff0c\u751a\u81f3\u4f1a\u628a\u51c6\u786e\u6570\u5b57\u4e0e\u7f16\u9020\u7684\u7ed3\u6784\u6027\u89e3\u91ca\u6df7\u5728\u4e00\u8d77\uff0c\u56e0\u6b64\u8bc4\u6d4b\u5e94\u8f6c\u5411\u58f0\u660e\u7ea7\u8bc1\u636e\u8ffd\u8e2a\u3001\u6761\u4ef6\u611f\u77e5\u8bc4\u5206\u548c\u4eba\u5de5\u5bf9\u6297\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As artificial intelligence systems increasingly rely on distributed and collaborative training, the energy footprint of these processes becomes a shared responsibility. Modern AI training often unfolds across heterogeneous compute nodes-ranging from cloud clusters to edge devices-whose energy availability is spatially and temporally variable. At the same time, renewable energy grids experience growing levels of excess generation, creating opportunities to align computational workloads with low-carbon energy supply. In this work, we develop a game-theoretic model of carbon-aware AI training in which autonomous agents strategically choose whether to participate and how intensively to train under limited renewable energy availability. Each agent balances diminishing learning returns, rewards for remaining within green-energy budgets, and penalties for grid consumption. While our framework applies broadly to distributed AI training, we examine Federated Learning as a representative case study due to its decentralized structure and flexible scheduling. We analyze equilibrium existence, efficiency, and adaptive dynamics, and provide simulation evidence that appropriately designed incentives can eliminate grid-based energy usage while preserving model performance. Our findings demonstrate how incentive-compatible training mechanisms can enhance energy efficiency and sharply reduce carbon emissions under renewable-energy constraints.", "arxiv_id": "2609.15389", "arxiv_url": "https://arxiv.org/abs/2609.15389", "authors": ["Konstantinos Varsos", "Ramin Khalili", "Adamantia Stamou", "George D. Stamoulis", "Vasillios A. Siris"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u53ef\u518d\u751f\u80fd\u6e90\u7ea6\u675f\u4e0b\u5206\u5e03\u5f0f AI \u8bad\u7ec3\u7684\u535a\u5f08\u8bba\u6846\u67b6\uff0c\u8ba9\u53c2\u4e0e\u8282\u70b9\u5728\u5b66\u4e60\u6536\u76ca\u3001\u7eff\u8272\u80fd\u6e90\u5956\u52b1\u548c\u7535\u7f51\u7528\u80fd\u60e9\u7f5a\u4e4b\u95f4\u7b56\u7565\u6027\u51b3\u7b56\u3002\u4ee5\u8054\u90a6\u5b66\u4e60\u4e3a\u6848\u4f8b\uff0c\u7406\u8bba\u5206\u6790\u5747\u8861\u4e0e\u6548\u7387\uff0c\u5e76\u901a\u8fc7\u4eff\u771f\u8868\u660e\u5408\u7406\u6fc0\u52b1\u53ef\u5728\u4fdd\u6301\u6a21\u578b\u6027\u80fd\u7684\u540c\u65f6\u6d88\u9664\u7535\u7f51\u7528\u80fd\u3001\u964d\u4f4e\u78b3\u6392\u653e\u3002", "categories": ["cs.ET", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15389", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7eff\u8272AI", "\u8054\u90a6\u5b66\u4e60", "\u535a\u5f08\u8bba", "\u6fc0\u52b1\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15389", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A Game-Theoretic Framework for Incentive-Compatible AI training Under Renewable-Energy Constraints", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u53ef\u518d\u751f\u80fd\u6e90\u7ea6\u675f\u4e0b\u5206\u5e03\u5f0f AI \u8bad\u7ec3\u7684\u535a\u5f08\u8bba\u6846\u67b6\uff0c\u8ba9\u53c2\u4e0e\u8282\u70b9\u5728\u5b66\u4e60\u6536\u76ca\u3001\u7eff\u8272\u80fd\u6e90\u5956\u52b1\u548c\u7535\u7f51\u7528\u80fd\u60e9\u7f5a\u4e4b\u95f4\u7b56\u7565\u6027\u51b3\u7b56\u3002\u4ee5\u8054\u90a6\u5b66\u4e60\u4e3a\u6848\u4f8b\uff0c\u7406\u8bba\u5206\u6790\u5747\u8861\u4e0e\u6548\u7387\uff0c\u5e76\u901a\u8fc7\u4eff\u771f\u8868\u660e\u5408\u7406\u6fc0\u52b1\u53ef\u5728\u4fdd\u6301\u6a21\u578b\u6027\u80fd\u7684\u540c\u65f6\u6d88\u9664\u7535\u7f51\u7528\u80fd\u3001\u964d\u4f4e\u78b3\u6392\u653e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents are provisioned the same as employee-owned hosts in many enterprise settings with a static credential set fixed at deployment which includes all permissions the employee role might ever need. Role-based access control made this compromise for human principals because scoping access per task was infeasible. For AI agents, the compromise leaves every credential standing exposed whether or not the current task uses them. These permissions can later be utilised by a compromised or misaligned agent. Prior work (Noyan, 2026) defined this as the task-context mismatch, and proposed a three-source permission architecture which includes role-based permission ceilings, a task permission classifier and policy-based prohibitions, together eliminating the exposure preemptively. The work released a 600-prompt labelled dataset to evaluate it. This paper presents that evaluation end to end by implementing the security gate; a fine-tuned RoBERTa-large encoder which matched few-shot trained Claude Haiku 4.5 on classification quality (macro-F1 0.881 against 0.886, precision 0.897 against 0.842, severity-weighted residual risk 0.63 against 1.12). The results show the trusted component does not need to scale with the agent it supervises, and the scalable-oversight margin for this control method is wide. We also propose an attack-surface elimination metric which shows the role ceiling alone closes 27.9% of the severity-weighted surface and adding the task classifier closes 84.4%. The gap displays security advantages of task-granular access control over role-granular, and AI agents are the first principal type for which the task-granular access control is enforceable because their tasks arrive as machine-readable text. The research establishes task-based access control as a measured, potentially deployable mechanism for reducing attack surface in agentic deployments.", "arxiv_id": "2609.15422", "arxiv_url": "https://arxiv.org/abs/2609.15422", "authors": ["Halil Burak Noyan"], "brief": "\u672c\u6587\u8bc4\u4f30\u4e86\u4e00\u79cd\u9762\u5411 AI \u667a\u80fd\u4f53\u7684\u6309\u4efb\u52a1\u6743\u9650\u6536\u655b\u67b6\u6784\uff0c\u7528\u89d2\u8272\u6743\u9650\u4e0a\u9650\u3001\u4efb\u52a1\u6743\u9650\u5206\u7c7b\u5668\u548c\u7b56\u7565\u7981\u4ee4\u6765\u907f\u514d\u667a\u80fd\u4f53\u957f\u671f\u66b4\u9732\u4e0d\u76f8\u5173\u51ed\u8bc1\u3002\u5b9e\u9a8c\u4e2d\u5fae\u8c03 RoBERTa-large \u7684\u5206\u7c7b\u6548\u679c\u63a5\u8fd1\u5c11\u6837\u672c Claude Haiku 4.5\uff0c\u5e76\u5c06\u4e25\u91cd\u5ea6\u52a0\u6743\u653b\u51fb\u9762\u5173\u95ed\u6bd4\u4f8b\u4ece\u4ec5\u89d2\u8272\u4e0a\u9650\u7684 27.9% \u63d0\u5347\u5230\u52a0\u5165\u4efb\u52a1\u5206\u7c7b\u540e\u7684 84.4%\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15422", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bbf\u95ee\u63a7\u5236", "\u7f51\u7edc\u5b89\u5168", "\u6743\u9650\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15422", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Empirical Evaluation of Task-Based Permission Scoping Architecture for AI Agents", "tldr": "\u672c\u6587\u8bc4\u4f30\u4e86\u4e00\u79cd\u9762\u5411 AI \u667a\u80fd\u4f53\u7684\u6309\u4efb\u52a1\u6743\u9650\u6536\u655b\u67b6\u6784\uff0c\u7528\u89d2\u8272\u6743\u9650\u4e0a\u9650\u3001\u4efb\u52a1\u6743\u9650\u5206\u7c7b\u5668\u548c\u7b56\u7565\u7981\u4ee4\u6765\u907f\u514d\u667a\u80fd\u4f53\u957f\u671f\u66b4\u9732\u4e0d\u76f8\u5173\u51ed\u8bc1\u3002\u5b9e\u9a8c\u4e2d\u5fae\u8c03 RoBERTa-large \u7684\u5206\u7c7b\u6548\u679c\u63a5\u8fd1\u5c11\u6837\u672c Claude Haiku 4.5\uff0c\u5e76\u5c06\u4e25\u91cd\u5ea6\u52a0\u6743\u653b\u51fb\u9762\u5173\u95ed\u6bd4\u4f8b\u4ece\u4ec5\u89d2\u8272\u4e0a\u9650\u7684 27.9% \u63d0\u5347\u5230\u52a0\u5165\u4efb\u52a1\u5206\u7c7b\u540e\u7684 84.4%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Adding answer options can lower multiple-choice scores without improving assessment validity. Turkish MMLU Pro examines this distinction using 12,000 Turkish-source questions across 58 sections. Each question retains its stem, five original options and source key, and receives five options copied from other questions in the same section. Sentence-embedding retrieval proposes candidates; a language model selects existing identifiers. Deterministic verification reconstructs all 60,000 additions. A 25-model calibration exposes scoring and generation-budget effects. Five evaluations produce source-key accuracies of 34.8%-81.4%. On 981 shared questions, one API-served model falls from 93.7% with five choices to 83.1% with ten; 102 of 115 lost correct responses select borrowed options. The decrease is 24.4 percentage points on heuristically flagged negative stems and 5.9 points elsewhere. A completed human-checked audit of 200 sampled questions, with undocumented reviewer tool use, yields 47 and 31 multiple-answer judgments across the two record sets, 25 of the latter unresolved. These records support concern about ambiguity, while their dependence and incomplete reviewer-method documentation limit validation. Because order and labels also change, the paired comparison measures augmentation as implemented. The contribution is a traceable construction and an analysis of its validity limits, not evidence that lower ten-choice scores measure knowledge better.", "arxiv_id": "2609.15467", "arxiv_url": "https://arxiv.org/abs/2609.15467", "authors": ["M. Ali Bayram"], "brief": "\u672c\u6587\u63d0\u51fa Turkish MMLU Pro\uff1a\u57fa\u4e8e 1.2 \u4e07\u9053\u571f\u8033\u5176\u8bed\u539f\u9898\uff0c\u4e3a\u6bcf\u9898\u53ef\u8ffd\u6eaf\u5730\u4ece\u540c\u7ae0\u8282\u5176\u4ed6\u9898\u76ee\u590d\u5236\u65b0\u589e 5 \u4e2a\u9009\u9879\uff0c\u6784\u9020\u5341\u9009\u4e00\u8bc4\u6d4b\uff0c\u5e76\u7528 25 \u4e2a\u6a21\u578b\u5206\u6790\u5206\u6570\u53d8\u5316\u3002\u7ed3\u679c\u663e\u793a\u589e\u52a0\u9009\u9879\u4f1a\u663e\u8457\u964d\u4f4e\u6a21\u578b\u51c6\u786e\u7387\uff0c\u5c24\u5176\u5728\u5426\u5b9a\u9898\u5e72\u4e0a\u66f4\u660e\u663e\uff0c\u4f46\u4eba\u5de5\u5ba1\u8ba1\u53d1\u73b0\u591a\u7b54\u6848\u4e0e\u6b67\u4e49\u95ee\u9898\uff0c\u8bf4\u660e\u5206\u6570\u4e0b\u964d\u4e0d\u4e00\u5b9a\u4ee3\u8868\u8bc4\u6d4b\u6548\u5ea6\u63d0\u5347\u3002", "categories": ["cs.CL", "cs.AI", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15467", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u8bc4\u6d4b", "\u591a\u9879\u9009\u62e9\u9898", "\u57fa\u51c6\u6d4b\u8bd5", "\u571f\u8033\u5176\u8bed"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15467", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Turkish MMLU Pro: Traceable Option Augmentation and Its Validity Limits in Turkish Multiple-Choice Evaluation", "tldr": "\u672c\u6587\u63d0\u51fa Turkish MMLU Pro\uff1a\u57fa\u4e8e 1.2 \u4e07\u9053\u571f\u8033\u5176\u8bed\u539f\u9898\uff0c\u4e3a\u6bcf\u9898\u53ef\u8ffd\u6eaf\u5730\u4ece\u540c\u7ae0\u8282\u5176\u4ed6\u9898\u76ee\u590d\u5236\u65b0\u589e 5 \u4e2a\u9009\u9879\uff0c\u6784\u9020\u5341\u9009\u4e00\u8bc4\u6d4b\uff0c\u5e76\u7528 25 \u4e2a\u6a21\u578b\u5206\u6790\u5206\u6570\u53d8\u5316\u3002\u7ed3\u679c\u663e\u793a\u589e\u52a0\u9009\u9879\u4f1a\u663e\u8457\u964d\u4f4e\u6a21\u578b\u51c6\u786e\u7387\uff0c\u5c24\u5176\u5728\u5426\u5b9a\u9898\u5e72\u4e0a\u66f4\u660e\u663e\uff0c\u4f46\u4eba\u5de5\u5ba1\u8ba1\u53d1\u73b0\u591a\u7b54\u6848\u4e0e\u6b67\u4e49\u95ee\u9898\uff0c\u8bf4\u660e\u5206\u6570\u4e0b\u964d\u4e0d\u4e00\u5b9a\u4ee3\u8868\u8bc4\u6d4b\u6548\u5ea6\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Logic attack graphs grounded in scanner output provide explicit and auditable attack path reasoning LLM-based agents lack. Integrating symbolic frameworks such as MulVAL to contemporary security workflows or agentic pipelines, however, requires translating scanner evidence to initial facts, and creating domain-specific rules. We present a semi-automated pipeline that addresses this interoperability problem and depict its feasibility in a web-security case study. Our pipeline parses findings from Trivy, Semgrep, and Nmap into MulVAL predicates and uses an LLM-assisted process to construct domain-specific Datalog rules linking scanner-detectable evidence to attack techniques. MulVAL/XSB then performs symbolic inference to generate structured attack paths. We evaluate the attack-graph construction infrastructure on 54 web Capture-the-Flag tasks from CyBench within an agentic pipeline (Hybrid Reasoner); we do not evaluate the performance of the downstream agent. Every task produced at least one goal-reaching graph, and we achieve mean ground-truth vulnerability coverage of 53.7%, with 51.9% achieving full coverage; mean noise-path rate was 83.9%. With median end-to-end time of 24.9 s (MulVAL reasoning: 2.7 s) the pipeline is feasible and runtime-practical for agentic workflows, but predicate coverage, rule coverage, and path precision remain limiting factors. Next steps include semantic rule validation and agent-level comparison for graph-guided pentesting.", "arxiv_id": "2609.15523", "arxiv_url": "https://arxiv.org/abs/2609.15523", "authors": ["Oliver Stevanovic", "Jasmin Wachter"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u534a\u81ea\u52a8\u6d41\u6c34\u7ebf\uff0c\u5c06 Trivy\u3001Semgrep\u3001Nmap \u7b49\u626b\u63cf\u7ed3\u679c\u8f6c\u6362\u4e3a MulVAL \u8c13\u8bcd\uff0c\u5e76\u501f\u52a9 LLM \u751f\u6210\u9886\u57df Datalog \u89c4\u5219\uff0c\u4ece\u800c\u81ea\u52a8\u6784\u5efa\u53ef\u5ba1\u8ba1\u7684\u7b26\u53f7\u653b\u51fb\u56fe\u3002\u5728 54 \u4e2a Web CTF \u4efb\u52a1\u4e0a\u5747\u80fd\u751f\u6210\u5230\u8fbe\u76ee\u6807\u7684\u653b\u51fb\u56fe\uff0c\u5e73\u5747\u8986\u76d6 53.7% \u771f\u5b9e\u6f0f\u6d1e\uff0c\u4f46\u566a\u58f0\u8def\u5f84\u8f83\u9ad8\uff0c\u8bf4\u660e\u53ef\u7528\u4e8e\u667a\u80fd\u4f53\u6e17\u900f\u6d4b\u8bd5\u5de5\u4f5c\u6d41\u4f46\u7cbe\u5ea6\u4ecd\u9700\u63d0\u5347\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15523", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u795e\u7ecf\u7b26\u53f7", "\u653b\u51fb\u56fe"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15523", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Automating Attack Graph Construction for Agentic Pentesting. Towards Neuro-Symbolic Vulnerability Hunting", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u534a\u81ea\u52a8\u6d41\u6c34\u7ebf\uff0c\u5c06 Trivy\u3001Semgrep\u3001Nmap \u7b49\u626b\u63cf\u7ed3\u679c\u8f6c\u6362\u4e3a MulVAL \u8c13\u8bcd\uff0c\u5e76\u501f\u52a9 LLM \u751f\u6210\u9886\u57df Datalog \u89c4\u5219\uff0c\u4ece\u800c\u81ea\u52a8\u6784\u5efa\u53ef\u5ba1\u8ba1\u7684\u7b26\u53f7\u653b\u51fb\u56fe\u3002\u5728 54 \u4e2a Web CTF \u4efb\u52a1\u4e0a\u5747\u80fd\u751f\u6210\u5230\u8fbe\u76ee\u6807\u7684\u653b\u51fb\u56fe\uff0c\u5e73\u5747\u8986\u76d6 53.7% \u771f\u5b9e\u6f0f\u6d1e\uff0c\u4f46\u566a\u58f0\u8def\u5f84\u8f83\u9ad8\uff0c\u8bf4\u660e\u53ef\u7528\u4e8e\u667a\u80fd\u4f53\u6e17\u900f\u6d4b\u8bd5\u5de5\u4f5c\u6d41\u4f46\u7cbe\u5ea6\u4ecd\u9700\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Large Language Models (MLLMs) have achieved remarkable progress on short video understanding yet remain limited on long videos due to the limited visual context window. Prevailing approaches rely on uniform frame sampling or recent coarse-to-fine agentic zooming, both of which struggle to localize sparse, decisive evidence in sufficiently long videos. We formulate long video understanding as a \\textbf{Sequential Evidence Acquisition (SEA)} problem, in which an agent reads the video turn by turn along the temporal axis, deciding at each turn how fast to watch, what evidence to retain, when to revisit uncertain segments, and when to stop and answer. Inspired by this view, we propose \\textbf{VideoScout}, a multi-turn reasoning agent that instantiates the SEA paradigm through adaptive reasoning pacing. Specifically, by dynamically controlling the viewing pace, VideoScout enables efficient traversal of long videos within a bounded visual context window, allowing the agent to access more video content while balancing content analysis depth with reading efficiency. To train VideoScout, we construct VideoScout-66K, a set of over 66K high-quality exploration turns from 10K answer-verified trajectories, and adopt a two-stage pipeline: cold-start supervised fine-tuning teaches the agent per-turn output format, while the Decoupled Clip and Dynamic sAmpling Policy Optimization (DAPO) algorithm performs trajectory-level reinforcement learning with a composite reward that jointly considers answer accuracy, output format compliance, and the temporal alignment between the agent\u0027s viewing progress and the teacher\u0027s answer timing measured by intersection-over-union (IoU). Extensive experiments on long video understanding and reasoning benchmarks demonstrate that our 7B model achieves strong performance compared with existing trained 7B agentic models.", "arxiv_id": "2609.15606", "arxiv_url": "https://arxiv.org/abs/2609.15606", "authors": ["Weixin Xu", "Zhenyu Yang", "Bing Wang", "Shengsheng Qian", "Changsheng Xu"], "brief": "VideoScout \u5c06\u957f\u89c6\u9891\u7406\u89e3\u5efa\u6a21\u4e3a\u5e8f\u5217\u8bc1\u636e\u83b7\u53d6\u95ee\u9898\uff0c\u8ba9\u591a\u8f6e\u667a\u80fd\u4f53\u6cbf\u65f6\u95f4\u8f74\u81ea\u9002\u5e94\u63a7\u5236\u89c2\u770b\u901f\u5ea6\u3001\u4fdd\u7559\u8bc1\u636e\u3001\u56de\u770b\u4e0d\u786e\u5b9a\u7247\u6bb5\u5e76\u51b3\u5b9a\u4f55\u65f6\u4f5c\u7b54\u3002\u4f5c\u8005\u6784\u5efa 6.6 \u4e07\u63a2\u7d22\u8f6e\u6b21\u6570\u636e\u5e76\u7ed3\u5408\u76d1\u7763\u5fae\u8c03\u4e0e\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5728\u957f\u89c6\u9891\u7406\u89e3\u4e0e\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c7B \u6a21\u578b\u76f8\u8f83\u73b0\u6709 7B \u667a\u80fd\u4f53\u6a21\u578b\u8868\u73b0\u66f4\u5f3a\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15606", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15606", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VideoScout: Learning Agentic Active Exploration with Adaptive Reasoning Pacing for Long Video Understanding", "tldr": "VideoScout \u5c06\u957f\u89c6\u9891\u7406\u89e3\u5efa\u6a21\u4e3a\u5e8f\u5217\u8bc1\u636e\u83b7\u53d6\u95ee\u9898\uff0c\u8ba9\u591a\u8f6e\u667a\u80fd\u4f53\u6cbf\u65f6\u95f4\u8f74\u81ea\u9002\u5e94\u63a7\u5236\u89c2\u770b\u901f\u5ea6\u3001\u4fdd\u7559\u8bc1\u636e\u3001\u56de\u770b\u4e0d\u786e\u5b9a\u7247\u6bb5\u5e76\u51b3\u5b9a\u4f55\u65f6\u4f5c\u7b54\u3002\u4f5c\u8005\u6784\u5efa 6.6 \u4e07\u63a2\u7d22\u8f6e\u6b21\u6570\u636e\u5e76\u7ed3\u5408\u76d1\u7763\u5fae\u8c03\u4e0e\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u5728\u957f\u89c6\u9891\u7406\u89e3\u4e0e\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c7B \u6a21\u578b\u76f8\u8f83\u73b0\u6709 7B \u667a\u80fd\u4f53\u6a21\u578b\u8868\u73b0\u66f4\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While In-Context Learning (ICL) enables models to adapt from exemplars without parameter updates, multimodal ICL remains largely underexplored, particularly regarding video demonstrations in interactive environments. For multimodal agents, learning from videos presents unique challenges: they must translate in-context demonstrations into executable policies, ground these policies in novel visual states, and iteratively refine actions based on environmental feedback. We introduce V-ICAL, a novel benchmark designed to evaluate video-based ICL for multimodal agents. Comprising 342 interactive tasks across 37 environments, V-ICAL utilizes human-curated demonstration videos as task-specific behavioral exemplars, evaluating agents through sustained interaction from a target initialization. The benchmark seamlessly connects in-context knowledge induction with core agentic capabilities, including state grounding, temporal memory, planning, and adaptation in dynamic environments. Extensive evaluations across 19 state-of-the-art multimodal agents reveal significant limitations: the best-performing model, Seed-2.1-Pro, achieves a score of only 54.4/100, while other leading models (e.g., Gemini-3.1-Pro, GPT-5.6) fail to surpass 50, far below the human baseline of 83.6. Controlled comparisons further demonstrate that current agents struggle to reliably translate video exemplars into effective policies, failing to yield consistent performance gains. Ultimately, V-ICAL exposes a critical gap in the ICL capabilities of multimodal agents, underscoring an urgent need for future research.", "arxiv_id": "2609.15683", "arxiv_url": "https://arxiv.org/abs/2609.15683", "authors": ["Ziqian Fan", "Shibo Xu", "Junjie Li", "Xiangyu Zhao", "Shengyuan Ding", "Yifan Yang", "Zhenjie Yang", "Haodong Duan", "Yue Zhou", "Zhihang Zhong", "Xue Yang"], "brief": "\u8bba\u6587\u63d0\u51fa V-ICAL \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5728\u4ea4\u4e92\u73af\u5883\u4e2d\u4ece\u89c6\u9891\u793a\u4f8b\u8fdb\u884c\u4e0a\u4e0b\u6587\u5b66\u4e60\u7684\u80fd\u529b\uff0c\u6db5\u76d637\u4e2a\u73af\u5883\u4e2d\u7684342\u4e2a\u4efb\u52a1\u3002\u5bf919\u4e2a\u524d\u6cbf\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u6700\u4f73\u6a21\u578b\u4ec5\u5f9754.4/100\uff0c\u663e\u8457\u4f4e\u4e8e\u4eba\u7c7b83.6\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u96be\u4ee5\u5c06\u89c6\u9891\u6f14\u793a\u7a33\u5b9a\u8f6c\u5316\u4e3a\u6709\u6548\u7b56\u7565\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15683", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15683", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "V-ICAL Bench: Evaluating Video In-Context Learning for Multimodal Agents in Interactive Environments", "tldr": "\u8bba\u6587\u63d0\u51fa V-ICAL \u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5728\u4ea4\u4e92\u73af\u5883\u4e2d\u4ece\u89c6\u9891\u793a\u4f8b\u8fdb\u884c\u4e0a\u4e0b\u6587\u5b66\u4e60\u7684\u80fd\u529b\uff0c\u6db5\u76d637\u4e2a\u73af\u5883\u4e2d\u7684342\u4e2a\u4efb\u52a1\u3002\u5bf919\u4e2a\u524d\u6cbf\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u8bc4\u6d4b\u663e\u793a\uff0c\u6700\u4f73\u6a21\u578b\u4ec5\u5f9754.4/100\uff0c\u663e\u8457\u4f4e\u4e8e\u4eba\u7c7b83.6\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u96be\u4ee5\u5c06\u89c6\u9891\u6f14\u793a\u7a33\u5b9a\u8f6c\u5316\u4e3a\u6709\u6548\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) increasingly power consumer-facing AI search, yet evaluating them on the diversity of everyday visual questions remains challenging. Existing benchmarks often target predefined capabilities, such as multi-hop retrieval or long-form synthesis, whereas users ask photo-grounded questions spanning a long tail of everyday scenarios. Despite advances in VLMs, users on Xiaohongshu, a mainstream Chinese image-sharing platform, continue to turn to other people for help with everyday visual questions. Motivated by this behaviour, we curate NoteVQA from these questions, yielding 252 items across 12 topical categories and 7 user intents. Each item includes a concise reference distilled from expert community responses and a human-audited interleaved reference answer that combines textual explanations with supporting visual evidence. We evaluate both short-answer correctness and interleaved-answer quality. To support the latter, we introduce AgenticInterleave, a single-agent ReAct framework for retrieval-supported answer generation, together with IVR-12, a 12-dimensional rubric for assessing the content, presentation, and image quality of interleaved references and model outputs. Across 10 frontier VLMs, the highest short-answer accuracy is 52.8\\%, while adding agentic search to Qwen3.5-397B-A17B improves accuracy by only 2.0\\%. For interleaved answers, the same model running AgenticInterleave scores 3.52 under IVR-12, compared with 4.65 for the human-audited references, with the largest gap in content quality. These results highlight the challenges that everyday visual questions pose for current VLMs in both answer accuracy and the quality of visually grounded explanations.", "arxiv_id": "2609.15695", "arxiv_url": "https://arxiv.org/abs/2609.15695", "authors": ["Haonan Jiang", "Guojian Zhan", "Jiancong Xie", "Shijun Wan", "Dongiia Zhao", "Cheng Chen", "Yahui Liu", "Yao Hu", "Chuan Mu"], "brief": "\u672c\u6587\u63d0\u51fa NoteVQA\uff0c\u4e00\u4e2a\u6765\u81ea\u5c0f\u7ea2\u4e66\u771f\u5b9e\u793e\u533a\u63d0\u95ee\u7684\u65e5\u5e38\u89c6\u89c9\u95ee\u7b54\u57fa\u51c6\uff0c\u5305\u542b252\u4e2a\u6837\u672c\u300112\u7c7b\u4e3b\u9898\u548c7\u7c7b\u7528\u6237\u610f\u56fe\uff0c\u5e76\u63d0\u4f9b\u4eba\u5de5\u5ba1\u6838\u7684\u56fe\u6587\u4ea4\u9519\u53c2\u8003\u7b54\u6848\u3002\u8bc4\u6d4b10\u4e2a\u524d\u6cbfVLM\u53d1\u73b0\uff0c\u6700\u4f73\u77ed\u7b54\u51c6\u786e\u7387\u4ec552.8%\uff0c\u52a0\u5165\u667a\u80fd\u4f53\u68c0\u7d22\u5bf9Qwen3.5-397B-A17B\u4e5f\u53ea\u63d0\u53472.0%\uff0c\u56fe\u6587\u89e3\u91ca\u8d28\u91cf\u4ecd\u660e\u663e\u843d\u540e\u4e8e\u4eba\u5de5\u53c2\u8003\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15695", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u95ee\u7b54", "\u57fa\u51c6\u8bc4\u6d4b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15695", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "NoteVQA: Benchmarking VLMs on Real-Life Questions from Human Communities", "tldr": "\u672c\u6587\u63d0\u51fa NoteVQA\uff0c\u4e00\u4e2a\u6765\u81ea\u5c0f\u7ea2\u4e66\u771f\u5b9e\u793e\u533a\u63d0\u95ee\u7684\u65e5\u5e38\u89c6\u89c9\u95ee\u7b54\u57fa\u51c6\uff0c\u5305\u542b252\u4e2a\u6837\u672c\u300112\u7c7b\u4e3b\u9898\u548c7\u7c7b\u7528\u6237\u610f\u56fe\uff0c\u5e76\u63d0\u4f9b\u4eba\u5de5\u5ba1\u6838\u7684\u56fe\u6587\u4ea4\u9519\u53c2\u8003\u7b54\u6848\u3002\u8bc4\u6d4b10\u4e2a\u524d\u6cbfVLM\u53d1\u73b0\uff0c\u6700\u4f73\u77ed\u7b54\u51c6\u786e\u7387\u4ec552.8%\uff0c\u52a0\u5165\u667a\u80fd\u4f53\u68c0\u7d22\u5bf9Qwen3.5-397B-A17B\u4e5f\u53ea\u63d0\u53472.0%\uff0c\u56fe\u6587\u89e3\u91ca\u8d28\u91cf\u4ecd\u660e\u663e\u843d\u540e\u4e8e\u4eba\u5de5\u53c2\u8003\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automatic Related Work Generation (RWG) significantly reduces the human time and effort required to author the Related Work Section (RWS) of a research paper. However, prior methods leveraging multi-agent Large Language Models (LLMs) typically rely on a predefined workflow, where each agent is responsible for a specific step in the entire process. This rigid, static inter-agent coordination limits the adaptive collaboration required to synthesize complex scientific literature. To address this limitation, we propose CREW (Collaborative Reinforcement Learning for Related Work Generation), a novel framework where LLM agents bypass heuristic pipelines to dynamically coordinate by autonomously selecting actions, such as Retrieve, Disseminate, Compose, and Critique, driven by a policy optimized via Independent Proximal Policy Optimization (IPPO). Extensive experiments on a standard RWG benchmark demonstrate that our approach yields substantial quality improvements over strong existing baselines, while significantly reducing token costs. Code is available at https://github.com/YenPBao/CREW-Collaborative-MARL.git", "arxiv_id": "2609.15721", "arxiv_url": "https://arxiv.org/abs/2609.15721", "authors": ["Hai-Dang Dang", "Bao-Yen Pham", "Bao Nguyen", "Tran Thi Huong", "Huynh Thi Thanh Binh"], "brief": "\u8bba\u6587\u63d0\u51fa CREW\uff0c\u4e00\u4e2a\u7528\u4e8e\u81ea\u52a8\u751f\u6210\u8bba\u6587\u76f8\u5173\u5de5\u4f5c\u7684\u534f\u4f5c\u5f0f\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u591a\u4e2a LLM \u667a\u80fd\u4f53\u4e0d\u518d\u4f9d\u8d56\u56fa\u5b9a\u6d41\u7a0b\uff0c\u800c\u662f\u901a\u8fc7 IPPO \u5b66\u4e60\u52a8\u6001\u9009\u62e9\u68c0\u7d22\u3001\u4f20\u64ad\u3001\u5199\u4f5c\u548c\u8bc4\u5ba1\u7b49\u52a8\u4f5c\uff0c\u5728\u6807\u51c6\u57fa\u51c6\u4e0a\u63d0\u5347\u751f\u6210\u8d28\u91cf\u5e76\u663e\u8457\u964d\u4f4e token \u6210\u672c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15721", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bba\u6587\u5199\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15721", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Assembling the CREW: A Collaborative Multi-agent Reinforcement Learning Framework for Automated Related Work Generation", "tldr": "\u8bba\u6587\u63d0\u51fa CREW\uff0c\u4e00\u4e2a\u7528\u4e8e\u81ea\u52a8\u751f\u6210\u8bba\u6587\u76f8\u5173\u5de5\u4f5c\u7684\u534f\u4f5c\u5f0f\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u591a\u4e2a LLM \u667a\u80fd\u4f53\u4e0d\u518d\u4f9d\u8d56\u56fa\u5b9a\u6d41\u7a0b\uff0c\u800c\u662f\u901a\u8fc7 IPPO \u5b66\u4e60\u52a8\u6001\u9009\u62e9\u68c0\u7d22\u3001\u4f20\u64ad\u3001\u5199\u4f5c\u548c\u8bc4\u5ba1\u7b49\u52a8\u4f5c\uff0c\u5728\u6807\u51c6\u57fa\u51c6\u4e0a\u63d0\u5347\u751f\u6210\u8d28\u91cf\u5e76\u663e\u8457\u964d\u4f4e token \u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tactile sensing provides contact information that can be difficult to infer from vision alone, but tactile hardware for dexterous hands has not converged to a common design. Dexterous hands differ in finger structure, contact surfaces, and sensor layouts, while simulated tactile signals still differ from measurements produced by physical sensors. These factors make it difficult to study visuo-tactile manipulation across diverse dexterous hands within a consistent experimental setting. We present Bench2Dex, a simulation benchmark for visuo-tactile bimanual manipulation across 12 dexterous hands. We adapt existing robot models with a shared simulated tactile interface that converts local contact geometry into image-like tactile observations. The interface provides a consistent observation format across different hand morphologies without attempting to reproduce the output of a specific physical tactile sensor. Bench2Dex includes 26 bimanual manipulation tasks that involve tool use, articulated-object interaction, and multi-stage manipulation, together with about 1.3K human-teleoperated demonstrations. The benchmark provides synchronized visual, tactile, proprioceptive, action, and object-state observations, together with executable task metrics. For robustness, we group seven perturbation types into invariance axis, where the correct action does not change, and equivariance axis, where the correct action changes together with the perturbation. We evaluate ACT, Diffusion Policy, pi0.5, and GR00T N1.5 on Bench2Dex and report their performance and failure modes. Bench2Dex is meant as a platform for studying visuo-tactile learning across dexterous hands. It does not assume that simulated tactile observations can replace real tactile sensing; it offers a shared setting for algorithm development while tactile hardware and simulation models are still evolving.", "arxiv_id": "2609.15726", "arxiv_url": "https://arxiv.org/abs/2609.15726", "authors": ["Zhenjie Yang", "Yideng Zhang", "Dongjie Zhang", "Chenyu Jiang", "Xianshuai Liu", "Yufeng Li", "Zuhao Ge", "Xingyu Jiao", "Zheng Zhang", "Kaiyu He", "He Wang", "Yuwen Zhong", "Yi Deng", "Muyun Jiang", "Xianliang Huang", "Haisheng Su", "Donghang Zhang", "Jian Zhang", "Xue Yang", "Hongyang Li", "Zuxuan Wu", "Yu-Gang Jiang", "Xiaosong Jia", "Junchi Yan"], "brief": "Bench2Dex \u63d0\u51fa\u4e00\u4e2a\u9762\u5411 12 \u79cd\u7075\u5de7\u624b\u7684\u89c6\u89e6\u89c9\u53cc\u624b\u64cd\u4f5c\u4eff\u771f\u57fa\u51c6\uff0c\u63d0\u4f9b\u7edf\u4e00\u7684\u56fe\u50cf\u5f0f\u89e6\u89c9\u89c2\u6d4b\u63a5\u53e3\uff0c\u8986\u76d6 26 \u4e2a\u53cc\u624b\u4efb\u52a1\u548c\u7ea6 1.3K \u6761\u4eba\u7c7b\u9065\u64cd\u4f5c\u793a\u8303\u3002\u8bba\u6587\u8bc4\u6d4b\u4e86 ACT\u3001Diffusion Policy\u3001pi0.5 \u548c GR00T N1.5\uff0c\u5e76\u5206\u6790\u5176\u5728\u4e0d\u540c\u6270\u52a8\u4e0e\u624b\u578b\u4e0b\u7684\u9c81\u68d2\u6027\u548c\u5931\u8d25\u6a21\u5f0f\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15726", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89e6\u89c9\u5b66\u4e60", "\u7075\u5de7\u624b", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15726", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Bench2Dex: Benchmarking Visuo-Tactile Bimanual Dexterous Manipulation Across Dexterous Hands", "tldr": "Bench2Dex \u63d0\u51fa\u4e00\u4e2a\u9762\u5411 12 \u79cd\u7075\u5de7\u624b\u7684\u89c6\u89e6\u89c9\u53cc\u624b\u64cd\u4f5c\u4eff\u771f\u57fa\u51c6\uff0c\u63d0\u4f9b\u7edf\u4e00\u7684\u56fe\u50cf\u5f0f\u89e6\u89c9\u89c2\u6d4b\u63a5\u53e3\uff0c\u8986\u76d6 26 \u4e2a\u53cc\u624b\u4efb\u52a1\u548c\u7ea6 1.3K \u6761\u4eba\u7c7b\u9065\u64cd\u4f5c\u793a\u8303\u3002\u8bba\u6587\u8bc4\u6d4b\u4e86 ACT\u3001Diffusion Policy\u3001pi0.5 \u548c GR00T N1.5\uff0c\u5e76\u5206\u6790\u5176\u5728\u4e0d\u540c\u6270\u52a8\u4e0e\u624b\u578b\u4e0b\u7684\u9c81\u68d2\u6027\u548c\u5931\u8d25\u6a21\u5f0f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Visual Retrieval-Augmented Generation (VRAG) empowers models to navigate and answer queries about visually rich documents by retrieving relevant page images as visual evidence and reasoning over their content. However, effectively utilizing this visual evidence is usually impeded by two main challenges. First, answer-relevant evidence is sparse and may be concentrated in a small region of one page or dispersed across multiple pages. Second, existing agentic methods often generate answers based on raw exploration trajectories or compressed textual memories rather than an explicitly organized set of supporting images, making answers susceptible to exploration noise and obscuring the evidence-backed reasoning trace. We argue that the bottleneck lies not only in evidence discovery but also in its preservation and organization before answer generation. We propose SCoRE (Selection and Consolidation for Robust Evidence), a unified agent loop for explicit evidence selection and consolidation. During exploration, SCoRE retains only query-relevant observations and their source pointers in a maintained textual ledger, preserving earlier evidence while keeping the visual context bounded. At termination, it reloads the referenced original images and consolidates the visual evidence for answering, arranging it into a logical sequence. This decouples final reasoning from exploratory trial-and-error while ensuring strict visual grounding via indexed claim-to-image linkages. To enable end-to-end optimization of this unified rollout, our training paradigm combines filtered cold-start trajectory distillation with evidence-aware reinforcement learning, whose reward promotes evidence coverage, consolidation compactness, and answer correctness.", "arxiv_id": "2609.15800", "arxiv_url": "https://arxiv.org/abs/2609.15800", "authors": ["Yucheng Shen", "Lingyong Yan", "Jiulong Wu", "Shuaiqiang Wang", "Jianmin WU", "Dawei Yin", "Min Cao"], "brief": "\u8bba\u6587\u63d0\u51fa SCoRE\uff0c\u4e00\u4e2a\u7528\u4e8e\u89c6\u89c9\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5728\u63a2\u7d22\u8fc7\u7a0b\u4e2d\u663e\u5f0f\u9009\u62e9\u5e76\u8bb0\u5f55\u4e0e\u95ee\u9898\u76f8\u5173\u7684\u89c6\u89c9\u8bc1\u636e\u53ca\u5176\u6765\u6e90\u3002\u6700\u7ec8\u56de\u7b54\u524d\u91cd\u65b0\u52a0\u8f7d\u539f\u59cb\u56fe\u50cf\u5e76\u6309\u903b\u8f91\u987a\u5e8f\u6574\u5408\u8bc1\u636e\uff0c\u51cf\u5c11\u63a2\u7d22\u566a\u58f0\uff0c\u63d0\u5347\u89c6\u89c9 grounding \u548c\u7b54\u6848\u53ef\u9760\u6027\uff1b\u8bad\u7ec3\u4e0a\u7ed3\u5408\u51b7\u542f\u52a8\u8f68\u8ff9\u84b8\u998f\u4e0e\u8bc1\u636e\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15800", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15800", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Navigating Sparse Evidence: Agentic Visual RAG via Explicit Context Selection and Consolidation", "tldr": "\u8bba\u6587\u63d0\u51fa SCoRE\uff0c\u4e00\u4e2a\u7528\u4e8e\u89c6\u89c9\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5728\u63a2\u7d22\u8fc7\u7a0b\u4e2d\u663e\u5f0f\u9009\u62e9\u5e76\u8bb0\u5f55\u4e0e\u95ee\u9898\u76f8\u5173\u7684\u89c6\u89c9\u8bc1\u636e\u53ca\u5176\u6765\u6e90\u3002\u6700\u7ec8\u56de\u7b54\u524d\u91cd\u65b0\u52a0\u8f7d\u539f\u59cb\u56fe\u50cf\u5e76\u6309\u903b\u8f91\u987a\u5e8f\u6574\u5408\u8bc1\u636e\uff0c\u51cf\u5c11\u63a2\u7d22\u566a\u58f0\uff0c\u63d0\u5347\u89c6\u89c9 grounding \u548c\u7b54\u6848\u53ef\u9760\u6027\uff1b\u8bad\u7ec3\u4e0a\u7ed3\u5408\u51b7\u542f\u52a8\u8f68\u8ff9\u84b8\u998f\u4e0e\u8bc1\u636e\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Extracting informative representations from longitudinal data that can predict future outcomes remains a critical challenge in medicine. Medical datasets are inherently heterogeneous, consisting of a large number of variables collected from different sources, sampled with different temporal spacings, and representing different aspects of human health status. This requires identifying those variables with predictive value, processing longitudinal information, and integrating multiple variables for outcome prediction. Here, we propose a novel agent-based approach, LongAgent, that can autonomously search over combinations of variable sets, temporal windows and longitudinal aggregation functions, and identify candidates with promising predictive performance. LongAgent utilises a history memory of previous searches and numerical evidence to guide subsequent exploration. On synthetic data, LongAgent achieves a mean prediction RMSE of 1.7376 and improves over the strongest non-agent baseline by 0.0151 (95% CI: [0.0045,0.0260]; p=0.0273). On a real clinical dataset, it performs comparably to the best baseline.", "arxiv_id": "2609.15859", "arxiv_url": "https://arxiv.org/abs/2609.15859", "authors": ["Siyao Wang", "Florian Guitton", "Shuojie Fu", "Guanyu Tao", "Kai Sun", "Wenjia Bai"], "brief": "\u63d0\u51fa LongAgent\uff0c\u4e00\u79cd\u57fa\u4e8e\u5386\u53f2\u8bb0\u5fc6\u4e0e\u6570\u503c\u8bc1\u636e\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u641c\u7d22\u65b9\u6cd5\uff0c\u7528\u4e8e\u5728\u7eb5\u5411\u533b\u7597\u6570\u636e\u4e2d\u81ea\u52a8\u63a2\u7d22\u53d8\u91cf\u7ec4\u5408\u3001\u65f6\u95f4\u7a97\u53e3\u548c\u805a\u5408\u51fd\u6570\u4ee5\u9884\u6d4b\u672a\u6765\u7ed3\u5c40\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5408\u6210\u6570\u636e\u4e0a\u76f8\u8f83\u6700\u5f3a\u975e\u667a\u80fd\u4f53\u57fa\u7ebf\u6709\u5c0f\u5e45\u4f46\u663e\u8457\u63d0\u5347\uff0c\u5728\u771f\u5b9e\u4e34\u5e8a\u6570\u636e\u4e0a\u4e0e\u6700\u4f73\u57fa\u7ebf\u8868\u73b0\u76f8\u5f53\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15859", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u9884\u6d4b", "\u7eb5\u5411\u6570\u636e", "\u81ea\u52a8\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15859", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "LongAgent: History-Guided Agentic Search for Longitudinal Outcome Prediction", "tldr": "\u63d0\u51fa LongAgent\uff0c\u4e00\u79cd\u57fa\u4e8e\u5386\u53f2\u8bb0\u5fc6\u4e0e\u6570\u503c\u8bc1\u636e\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u641c\u7d22\u65b9\u6cd5\uff0c\u7528\u4e8e\u5728\u7eb5\u5411\u533b\u7597\u6570\u636e\u4e2d\u81ea\u52a8\u63a2\u7d22\u53d8\u91cf\u7ec4\u5408\u3001\u65f6\u95f4\u7a97\u53e3\u548c\u805a\u5408\u51fd\u6570\u4ee5\u9884\u6d4b\u672a\u6765\u7ed3\u5c40\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5408\u6210\u6570\u636e\u4e0a\u76f8\u8f83\u6700\u5f3a\u975e\u667a\u80fd\u4f53\u57fa\u7ebf\u6709\u5c0f\u5e45\u4f46\u663e\u8457\u63d0\u5347\uff0c\u5728\u771f\u5b9e\u4e34\u5e8a\u6570\u636e\u4e0a\u4e0e\u6700\u4f73\u57fa\u7ebf\u8868\u73b0\u76f8\u5f53\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video diffusion models are stochastic and hard to control: precise content often requires repeated sampling without guaranteed success, and long-horizon scenes drift in appearance, interactions, and temporal coherence. Agentic visual creation provides explicit references, editable 3D scenes, or executable game states for stable control, but does not by itself guarantee high object or character fidelity. Combining the two can enable stable, high-quality generation. To realize this combination, we present LynnReal-Omni, a native multimodal video generation framework built on a 32B shared multimodal diffusion transformer that unifies text-to-video, image-conditioned generation, reference-guided generation, structural control, editing, degraded video restoration, and long-video generation. It accepts heterogeneous visual inputs, including appearance references, editable 3D renders, and game recordings, allowing agents to compose visual conditions within a unified model. We also train a dedicated 27B Flash shared multimodal diffusion transformer for real-time rendering. We build a systematic data pipeline for video cleaning, subject association, multimodal annotation, and aligned control construction, yielding a curated corpus of multi-shot audiovisual segments, and introduce MSAVP, a 100-prompt, 20-metric evaluation design that separates instruction following, generating plausibility, visual quality, temporal behavior, and audio coordination. LynnReal-Omni-Flash further reduces inference cost through model and decoding acceleration, including a lightweight VAE decoder; on one H100, warm generation and decoding of a 22-frame 540p video take 843 ms with LynnReal-Omni and 377 ms with Flash. These results provide a foundation for real-time streaming video generation, making LynnReal-Omni a unified, controllable, and efficient basis for agentic visual creation.", "arxiv_id": "2609.15863", "arxiv_url": "https://arxiv.org/abs/2609.15863", "authors": ["Xiaofeng Mao", "Peijia Lin", "Shaohao Rui", "Yibo Zhang", "Haibin Wan", "Weijie Ma"], "brief": "LynnReal-Omni \u63d0\u51fa\u7edf\u4e00\u7684\u539f\u751f\u591a\u6a21\u6001\u89c6\u9891\u751f\u6210\u6846\u67b6\uff0c\u5c06\u6587\u672c\u3001\u56fe\u50cf\u53c2\u8003\
