hat allows any agent to address other agents through a shared channel, i.e., the Bus. It consists of agent registration, message routing, and shared memory management components. Worker agents, each equipped with tools, have their own local memory and can reason, act (tool usage), and communicate by posting shared messages with specific intents. We introduce four intents: discussion, challenge, guidance, and request for explanation, which support fine-grained communication among agents. A Chair agent monitors the shared memory to coordinate interactions and facilitate convergence among Workers. To evaluate the effectiveness of BusMA, we conduct extensive experiments with two frontier LLMs across 13 tasks spanning visual reasoning, mathematical reasoning, and knowledge retrieval demonstrate that BusMA consistently outperforms state-of-the-art HMW and RMP methods.", "arxiv_id": "2609.15054", "arxiv_url": "https://arxiv.org/abs/2609.15054", "authors": ["Yanwen Peng", "Delvin Ce Zhang", "Xi Wang", "Nikolaos Aletras"], "brief": "\u8bba\u6587\u63d0\u51fa BusMA\uff0c\u4e00\u79cd\u53d7\u8ba1\u7b97\u673a\u603b\u7ebf\u67b6\u6784\u542f\u53d1\u7684\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u6846\u67b6\uff0c\u5141\u8bb8\u4efb\u610f\u667a\u80fd\u4f53\u901a\u8fc7\u5171\u4eab\u901a\u9053\u5b9a\u5411\u8054\u7cfb\u5176\u4ed6\u667a\u80fd\u4f53\u3002\u5b83\u7ed3\u5408\u667a\u80fd\u4f53\u6ce8\u518c\u3001\u6d88\u606f\u8def\u7531\u3001\u5171\u4eab\u8bb0\u5fc6\u4e0e Chair \u534f\u8c03\u673a\u5236\uff0c\u589e\u5f3a Worker \u4e4b\u95f4\u7684\u81ea\u4e3b\u534f\u4f5c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15054", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u76f8\u6bd4\u5c42\u7ea7 Manager-Worker \u548c\u8def\u7531\u5f0f\u6d88\u606f\u4f20\u9012\uff0cBusMA \u5141\u8bb8 Worker \u76f4\u63a5\u54a8\u8be2\u540c\u4f34\uff0c\u51cf\u5c11\u8bef\u8def\u7531\u5e26\u6765\u7684\u9519\u8bef\u4f20\u64ad\u3002", "\u8bbe\u8ba1\u4e86 discussion\u3001challenge\u3001guidance\u3001request for explanation \u56db\u7c7b\u901a\u4fe1\u610f\u56fe\uff0c\u652f\u6301\u66f4\u7ec6\u7c92\u5ea6\u7684\u591a\u667a\u80fd\u4f53\u4ea4\u4e92\u3002", "\u5728\u89c6\u89c9\u63a8\u7406\u3001\u6570\u5b66\u63a8\u7406\u548c\u77e5\u8bc6\u68c0\u7d22\u7b49 13 \u4e2a\u4efb\u52a1\u4e0a\uff0c\u4f7f\u7528\u4e24\u4e2a\u524d\u6cbf LLM \u9a8c\u8bc1\uff0c\u6027\u80fd\u7a33\u5b9a\u4f18\u4e8e\u73b0\u6709 HMW \u4e0e RMP \u65b9\u6cd5\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u901a\u4fe1\u673a\u5236", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15054", "published_at": "2026-09-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "BusMA: A Bus Communication Substrate for Multi-Agent Systems", "tldr": "BusMA\u7528\u5171\u4eab\u603b\u7ebf\u63d0\u5347\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u901a\u4fe1\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BusMA\uff0c\u4e00\u79cd\u53d7\u8ba1\u7b97\u673a\u603b\u7ebf\u67b6\u6784\u542f\u53d1\u7684\u591a\u667a\u80fd\u4f53\u901a\u4fe1\u6846\u67b6\uff0c\u5141\u8bb8\u4efb\u610f\u667a\u80fd\u4f53\u901a\u8fc7\u5171\u4eab\u901a\u9053\u5b9a\u5411\u8054\u7cfb\u5176\u4ed6\u667a\u80fd\u4f53\u3002\u5b83\u7ed3\u5408\u667a\u80fd\u4f53\u6ce8\u518c\u3001\u6d88\u606f\u8def\u7531\u3001\u5171\u4eab\u8bb0\u5fc6\u4e0e Chair \u534f\u8c03\u673a\u5236\uff0c\u589e\u5f3a Worker \u4e4b\u95f4\u7684\u81ea\u4e3b\u534f\u4f5c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u8ba1\u7b97\u673a\u603b\u7ebf\u601d\u60f3\u5f15\u5165\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u901a\u4fe1\u5c42\uff0c\u9488\u5bf9\u5f53\u524d LLM \u667a\u80fd\u4f53\u534f\u4f5c\u4e2d\u7684\u4fe1\u606f\u6d41\u53d7\u9650\u548c\u534f\u8c03\u8106\u5f31\u95ee\u9898\u63d0\u51fa\u901a\u7528\u89e3\u51b3\u65b9\u6848\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u7cfb\u7edf\u8bbe\u8ba1\u4ef7\u503c\u548c\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "When several retrieved sources support the same claim, an answer engine cites some but not others. We call this decision citation allocation and introduce CITECHOICE, a causal audit of authentic multi-turn agentic search. From 129 everyday-query transcripts, CITECHOICE selects 113 same-call document pairs with independently verified support for the same pre-specified fact, without observing ranks or answer outcomes; blinded human review confirms 103. It runs a hash-verified 2-by-2 replay crossing pair order with jointly generated, fidelity-checked structured and prose renderings of one target while the rest of the transcript remains fixed. Three results emerge. First, and most importantly, structured rendering concentrates citation credit rather than clearly increasing source admission. It raises target citation count by +0.50 citations per answer (95 percent CI [+0.20, +0.84]; Holm-adjusted p=.033), without increasing total citations or reducing competitor credit. The pre-specified incidence effect (whether the target is cited at all) is +4.5 percentage points and inconclusive (95 percent CI [-1.4, +10.4]; p=.168). Second, observational position differences exceed controlled reordering effects: the citation-rate gap between rank 1 and rank 5 is 42.3 percentage points, compared with +7.9 percentage points in the main replay and 0.0 percentage points held out. Third, citation evaluation has a measurable noise floor. Although the aggregate count effect repeats under fresh decoding of 30 frozen families, 15 percent of binary decisions change and decoding accounts for an estimated 45 percent of single-generation family-effect variance. Together, these findings isolate what survives control: presentation can causally redistribute visible citation credit within frozen transcripts. They do not establish reliable source admission, a pure formatting mechanism, or a general rank advantage.", "arxiv_id": "2609.15164", "arxiv_url": "https://arxiv.org/abs/2609.15164", "authors": ["Sriram Selvam", "Anneswa Ghosh"], "brief": "\u8bba\u6587\u63d0\u51fa CITECHOICE\uff0c\u5bf9\u771f\u5b9e\u591a\u8f6e\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u7684\u5f15\u7528\u5206\u914d\u8fdb\u884c\u56e0\u679c\u5ba1\u8ba1\u3002\u5b83\u901a\u8fc7\u63a7\u5236\u6587\u6863\u987a\u5e8f\u4e0e\u5448\u73b0\u5f62\u5f0f\u7684\u91cd\u653e\u5b9e\u9a8c\uff0c\u5206\u6790\u540c\u6837\u652f\u6301\u4e8b\u5b9e\u7684\u6765\u6e90\u4e3a\u4f55\u88ab\u5f15\u7528\u6216\u88ab\u5ffd\u7565\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15164", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u4e8e129\u4e2a\u65e5\u5e38\u67e5\u8be2\u8f6c\u5f55\uff0c\u7b5b\u9009\u51fa113\u7ec4\u652f\u6301\u540c\u4e00\u9884\u8bbe\u4e8b\u5b9e\u7684\u540c\u8c03\u7528\u6587\u6863\u5bf9\uff0c\u5176\u4e2d103\u7ec4\u901a\u8fc7\u76f2\u5ba1\u786e\u8ba4\u3002", "\u7ed3\u6784\u5316\u5448\u73b0\u663e\u8457\u63d0\u9ad8\u76ee\u6807\u6587\u6863\u5f15\u7528\u6b21\u6570\uff08\u6bcf\u4e2a\u7b54\u6848+0.50\u6b21\uff09\uff0c\u4f46\u672a\u660e\u786e\u63d0\u9ad8\u201c\u662f\u5426\u88ab\u5f15\u7528\u201d\u7684\u6982\u7387\uff0c\u4e5f\u672a\u589e\u52a0\u603b\u5f15\u7528\u6570\u3002", "\u89c2\u6d4b\u5230\u7684\u6392\u540d\u5dee\u5f02\u5927\u4e8e\u53d7\u63a7\u91cd\u6392\u6548\u5e94\uff0c\u4e14\u5f15\u7528\u8bc4\u4f30\u5b58\u5728\u566a\u58f0\uff1a15%\u7684\u4e8c\u5143\u5f15\u7528\u51b3\u7b56\u4f1a\u968f\u89e3\u7801\u53d8\u5316\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u56e0\u679c\u8bc4\u4f30", "\u5f15\u7528\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15164", "published_at": "2026-09-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CITECHOICE: A Causal Audit of How Document Presentation Redistributes Citation Credit in Agentic Search", "tldr": "\u6587\u6863\u5448\u73b0\u65b9\u5f0f\u4f1a\u56e0\u679c\u6027\u91cd\u5206\u914d\u5f15\u7528\u4fe1\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CITECHOICE\uff0c\u5bf9\u771f\u5b9e\u591a\u8f6e\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u7684\u5f15\u7528\u5206\u914d\u8fdb\u884c\u56e0\u679c\u5ba1\u8ba1\u3002\u5b83\u901a\u8fc7\u63a7\u5236\u6587\u6863\u987a\u5e8f\u4e0e\u5448\u73b0\u5f62\u5f0f\u7684\u91cd\u653e\u5b9e\u9a8c\uff0c\u5206\u6790\u540c\u6837\u652f\u6301\u4e8b\u5b9e\u7684\u6765\u6e90\u4e3a\u4f55\u88ab\u5f15\u7528\u6216\u88ab\u5ffd\u7565\u3002", "why_notable": "\u8be5\u7814\u7a76\u7528\u56e0\u679c\u5b9e\u9a8c\u63ed\u793a\u4e86\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u4e00\u4e2a\u5173\u952e\u4f46\u5e38\u88ab\u5ffd\u89c6\u7684\u95ee\u9898\uff1a\u5f15\u7528\u4fe1\u7528\u4e0d\u4ec5\u53d6\u51b3\u4e8e\u5185\u5bb9\u76f8\u5173\u6027\uff0c\u4e5f\u4f1a\u88ab\u5448\u73b0\u5f62\u5f0f\u548c\u751f\u6210\u566a\u58f0\u5f71\u54cd\uff0c\u5bf9\u641c\u7d22\u8bc4\u6d4b\u3001\u6765\u6e90\u516c\u5e73\u6027\u548c\u7b54\u6848\u5f15\u64ce\u8bbe\u8ba1\u90fd\u6709\u5b9e\u9645\u610f\u4e49\u3002"}, {"abstract": "Autonomous agents operating on multisensory data cannot assume that all sensory modalities remain consistently informative. In real environments, sensory streams are frequently corrupted by noise, missing data, or inter-modal incongruence, requiring adaptive arbitration between competing sensory hypotheses. While active inference provides a principled framework for uncertainty-guided inference, the role of dynamically inferred sensory precision in generative multimodal arbitration under sensory conflict remains comparatively underexplored. We propose a multimodal perceptual inference model in which latent beliefs and modality-specific sensory precisions are jointly updated through iterative free-energy minimization. In our proposed model, sensory precision dynamics not only reflect sensory uncertainty but actively shape the evolution of latent beliefs during multimodal conflict. In addition, we introduce a learned prior over sensory precisions that induces structured, class-dependent precision patterns and influences cross-modal inference dynamics. We evaluate the model using a synthetic multimodal MNIST dataset combining visual, auditory, and tactile representations of digit classes under controlled sensory noise and inter-modal incongruence. Results show that dynamic precision inference improves reconstruction robustness under corrupted sensory evidence, supports coherent latent inference from reduced sensory evidence, and enables stable arbitration between conflicting modalities. Furthermore, learned precision priors generate interpretable precision structures that shape inference dynamics and cross-modal latent structure. These findings support sensory precision inference as a mechanistic control process for adaptive multimodal belief formation under uncertainty, highlighting precision dynamics as a computational mechanism for robust and interpretable multisensory integration.", "arxiv_id": "2609.15065", "arxiv_url": "https://arxiv.org/abs/2609.15065", "authors": ["Tin Mi\u0161i\u0107", "Takato Horii"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u591a\u6a21\u6001\u611f\u77e5\u63a8\u7406\u6a21\u578b\uff0c\u901a\u8fc7\u81ea\u7531\u80fd\u6700\u5c0f\u5316\u8054\u5408\u66f4\u65b0\u6f5c\u5728\u4fe1\u5ff5\u4e0e\u5404\u6a21\u6001\u7684\u611f\u77e5\u7cbe\u5ea6\u3002\u6a21\u578b\u5728\u89c6\u89c9\u3001\u542c\u89c9\u3001\u89e6\u89c9\u7248\u5408\u6210 MNIST \u4e0a\u9a8c\u8bc1\u4e86\u566a\u58f0\u3001\u7f3a\u5931\u4e0e\u8de8\u6a21\u6001\u51b2\u7a81\u573a\u666f\u4e0b\u7684\u81ea\u9002\u5e94\u4ef2\u88c1\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15065", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u4e3b\u52a8\u63a8\u7406\u4e2d\u7684\u611f\u77e5\u7cbe\u5ea6\u4f5c\u4e3a\u52a8\u6001\u53d8\u91cf\uff0c\u4f7f\u5176\u4e0d\u4ec5\u53cd\u6620\u4e0d\u786e\u5b9a\u6027\uff0c\u8fd8\u76f4\u63a5\u8c03\u63a7\u6f5c\u5728\u4fe1\u5ff5\u66f4\u65b0", "\u5f15\u5165\u53ef\u5b66\u4e60\u7684\u611f\u77e5\u7cbe\u5ea6\u5148\u9a8c\uff0c\u5f62\u6210\u7c7b\u522b\u76f8\u5173\u3001\u53ef\u89e3\u91ca\u7684\u6a21\u6001\u53ef\u4fe1\u5ea6\u7ed3\u6784", "\u5728\u591a\u6a21\u6001 MNIST \u7684\u566a\u58f0\u548c\u4e0d\u4e00\u81f4\u8f93\u5165\u4e0b\uff0c\u63d0\u5347\u91cd\u5efa\u9c81\u68d2\u6027\u3001\u5c11\u6a21\u6001\u63a8\u7406\u80fd\u529b\u548c\u51b2\u7a81\u6a21\u6001\u95f4\u7684\u7a33\u5b9a\u4ef2\u88c1"], "keywords": ["\u591a\u6a21\u6001", "\u4e3b\u52a8\u63a8\u7406", "\u4e0d\u786e\u5b9a\u6027", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15065", "published_at": "2026-09-14", "score": 0.3, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Sensory Precision Inference for Multimodal Arbitration under Uncertainty", "tldr": "\u52a8\u6001\u611f\u77e5\u7cbe\u5ea6\u63d0\u5347\u591a\u6a21\u6001\u51b2\u7a81\u4e0b\u63a8\u7406\u9c81\u68d2\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u591a\u6a21\u6001\u611f\u77e5\u63a8\u7406\u6a21\u578b\uff0c\u901a\u8fc7\u81ea\u7531\u80fd\u6700\u5c0f\u5316\u8054\u5408\u66f4\u65b0\u6f5c\u5728\u4fe1\u5ff5\u4e0e\u5404\u6a21\u6001\u7684\u611f\u77e5\u7cbe\u5ea6\u3002\u6a21\u578b\u5728\u89c6\u89c9\u3001\u542c\u89c9\u3001\u89e6\u89c9\u7248\u5408\u6210 MNIST \u4e0a\u9a8c\u8bc1\u4e86\u566a\u58f0\u3001\u7f3a\u5931\u4e0e\u8de8\u6a21\u6001\u51b2\u7a81\u573a\u666f\u4e0b\u7684\u81ea\u9002\u5e94\u4ef2\u88c1\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u591a\u6a21\u6001\u7cfb\u7edf\u5728\u4f20\u611f\u5668\u566a\u58f0\u3001\u7f3a\u5931\u6216\u51b2\u7a81\u65f6\u5982\u4f55\u81ea\u9002\u5e94\u9009\u62e9\u53ef\u4fe1\u4fe1\u606f\u63d0\u4f9b\u4e86\u673a\u5236\u5316\u89e3\u91ca\uff0c\u5bf9\u9c81\u68d2\u591a\u6a21\u6001\u611f\u77e5\u548c\u53ef\u89e3\u91ca\u4e3b\u52a8\u63a8\u7406\u6a21\u578b\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We show how users can create and manipulate causal virtual worlds with large-language-model (LLM) and large-video-model agents. The approach uses feedback fuzzy cognitive maps (FCMs) both to model the granular causal structure of the virtual world and to guide its causal evolution. The local causal rules are partial or fuzzy while the FCM\u0027s feedback structure produces global equilibria that define causal scenarios. A sequence of \\emph{dynamical} meta-rules of the form ``If $\\mathcal{A}$ then $\\mathcal{B}$\" define the causal scenes of the virtual-world video. The if-part causal pattern $\\mathcal{A}$ perturbs the FCM\u0027s virtual world at the user\u0027s or agent\u0027s discretion. The FCM\u0027s transient feedback dynamics define the meta-rule\u0027s causal arrow of implication. The then-part $\\mathcal{B}$ is the resulting equilibrium attractor such as a FCM limit cycle or fixed point. Our algorithm extracts these meta-rules from the FCM and guides the LLM agent to write a script based on the FCM meta-rule sequence. The large video generator converts the meta-rule into a video scene in accord with the flow of the dynamics. We applied the agent-based technique to a simple FCM that describes an undersea world of dolphins and sharks. Google\u0027s Gemini 3.1 generated the script and Google\u0027s Veo 3.1 generated the dolphin-shark video. The approach is general and can scale by mixing larger FCMs and AI agents to produce more immersive virtual worlds.", "arxiv_id": "2609.14985", "arxiv_url": "https://arxiv.org/abs/2609.14985", "authors": ["Akash Kumar Panda", "Olaoluwa Adigun", "Bart Kosko"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5c06\u5e8f\u5217\u5316\u6a21\u7cca\u8ba4\u77e5\u56fe\uff08FCM\uff09\u8f6c\u6362\u4e3a\u56e0\u679c\u865a\u62df\u4e16\u754c\u7684\u65b9\u6cd5\uff1a\u7528FCM\u523b\u753b\u5c40\u90e8\u6a21\u7cca\u56e0\u679c\u7ed3\u6784\u4e0e\u5168\u5c40\u52a8\u6001\u5e73\u8861\uff0c\u518d\u8ba9LLM\u7f16\u5199\u811a\u672c\u3001\u89c6\u9891\u751f\u6210\u6a21\u578b\u751f\u6210\u5bf9\u5e94\u573a\u666f\u3002", "categories": ["cs.AI", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14985", "impact_score": 5, "is_agent": true, "is_top": true, "key_points": ["\u7528\u53cd\u9988FCM\u8868\u793a\u865a\u62df\u4e16\u754c\u4e2d\u7684\u7ec6\u7c92\u5ea6\u56e0\u679c\u5173\u7cfb\uff0c\u5c40\u90e8\u89c4\u5219\u53ef\u4e3a\u90e8\u5206\u6216\u6a21\u7cca\u89c4\u5219\uff0c\u5168\u5c40\u52a8\u529b\u5b66\u4ea7\u751f\u56fa\u5b9a\u70b9\u6216\u6781\u9650\u73af\u7b49\u56e0\u679c\u60c5\u666f\u3002", "\u5b9a\u4e49\u201cIf A then B\u201d\u5f62\u5f0f\u7684\u52a8\u6001\u5143\u89c4\u5219\uff1aA\u6270\u52a8\u865a\u62df\u4e16\u754c\uff0cFCM\u77ac\u6001\u53cd\u9988\u8fc7\u7a0b\u7ed9\u51fa\u56e0\u679c\u6f14\u5316\uff0cB\u5bf9\u5e94\u6700\u7ec8\u5438\u5f15\u5b50\u72b6\u6001\u3002", "\u5728\u6d77\u5e95\u6d77\u8c5a\u4e0e\u9ca8\u9c7c\u793a\u4f8b\u4e2d\uff0c\u7528Gemini 3.1\u751f\u6210\u811a\u672c\u3001Veo 3.1\u751f\u6210\u89c6\u9891\uff0c\u5c55\u793a\u4ece\u56e0\u679c\u89c4\u5219\u5230\u89c6\u9891\u573a\u666f\u7684\u6d41\u7a0b\u3002"], "keywords": ["\u56e0\u679c\u5efa\u6a21", "\u667a\u80fd\u4f53", "\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14985", "published_at": "2026-09-14", "score": 0.275, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Converting Sequenced Fuzzy Cognitive Maps to Causal Virtual Worlds with Large Video Generators", "tldr": "\u7528FCM\u56e0\u679c\u89c4\u5219\u9a71\u52a8\u89c6\u9891\u751f\u6210\u865a\u62df\u4e16\u754c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u5c06\u5e8f\u5217\u5316\u6a21\u7cca\u8ba4\u77e5\u56fe\uff08FCM\uff09\u8f6c\u6362\u4e3a\u56e0\u679c\u865a\u62df\u4e16\u754c\u7684\u65b9\u6cd5\uff1a\u7528FCM\u523b\u753b\u5c40\u90e8\u6a21\u7cca\u56e0\u679c\u7ed3\u6784\u4e0e\u5168\u5c40\u52a8\u6001\u5e73\u8861\uff0c\u518d\u8ba9LLM\u7f16\u5199\u811a\u672c\u3001\u89c6\u9891\u751f\u6210\u6a21\u578b\u751f\u6210\u5bf9\u5e94\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c1d\u8bd5\u628a\u53ef\u89e3\u91ca\u7684\u56e0\u679c\u56fe\u52a8\u529b\u5b66\u4e0e\u5927\u8bed\u8a00\u6a21\u578b\u3001\u89c6\u9891\u751f\u6210\u6a21\u578b\u7ed3\u5408\uff0c\u4f7f\u751f\u6210\u5f0f\u865a\u62df\u4e16\u754c\u5177\u5907\u53ef\u64cd\u63a7\u7684\u56e0\u679c\u6f14\u5316\u903b\u8f91\uff0c\u5bf9\u53ef\u63a7\u89c6\u9891\u751f\u6210\u3001\u4ea4\u4e92\u5f0f\u4eff\u771f\u548c\u667a\u80fd\u4f53\u4e16\u754c\u5efa\u6a21\u6709\u542f\u53d1\u4ef7\u503c\u3002"}, {"abstract": "Language models can produce plausible short proofs, but may still be unreliable on long-horizon research problems, where progress depends on a sequence of uncertain and interdependent decisions. We introduce Stellar Colosseum, a model-agnostic harness for allocating inference across research in mathematics and theoretical computer science. Colosseum explores alternative strategies before proof construction, uses a readiness gate to decide when a route is mature enough to decompose, represents the proof plan as interdependent section-level subproblems, and routes verifier findings back to the affected part of the argument. Across these stages, it generates candidates in parallel, attacks them with targeted falsification, and combines candidates and their critiques into a single research artifact through overlapping random-sample tree aggregation. The Colosseum workflow has also been integrated into Google Antigravity\u0027s Teamwork framework as the Long Proof pattern. We demonstrate the capabilities of Colosseum through open-ended research and evaluations on theorem-proving and competitive programming benchmarks. Using Colosseum with Gemini 3.1 Pro, we obtain several new results that address open problems arising from papers published at top venues such as FOCS and JMLR. On TCS-Bench, a benchmark of research-level theorem-proving tasks drawn from papers published at FOCS, STOC, and SODA, Colosseum achieves 71.0% accuracy using Gemini 3.1 Pro and Gemini 3.7 Flash. In a separate Codeforces evaluation using Gemini 3.1 Pro, the proof-oriented pipeline with execution feedback solves 218 of 222 problems.", "arxiv_id": "2609.15983", "arxiv_url": "https://arxiv.org/abs/2609.15983", "authors": ["Honghao Lin", "David P. Woodruff", "Yuan Deng", "Jieming Mao", "Song Zuo", "Vahab Mirrokni"], "brief": "\u8bba\u6587\u63d0\u51fa Stellar Colosseum\uff0c\u4e00\u4e2a\u6a21\u578b\u65e0\u5173\u7684\u591a\u667a\u80fd\u4f53\u63a8\u7406\u5206\u914d\u6846\u67b6\uff0c\u7528\u4e8e\u6570\u5b66\u548c\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66\u4e2d\u7684\u957f\u7a0b\u7814\u7a76\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u7b56\u7565\u63a2\u7d22\u3001\u6210\u719f\u5ea6\u95e8\u63a7\u3001\u5206\u5c42\u8bc1\u660e\u89c4\u5212\u3001\u5b9a\u5411\u53cd\u9a73\u4e0e\u805a\u5408\u673a\u5236\uff0c\u751f\u6210\u5e76\u4fee\u6b63\u590d\u6742\u8bc1\u660e\u6216\u7b97\u6cd5\u89e3\u7b54\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15983", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": ["\u5728\u8bc1\u660e\u6784\u9020\u524d\u5e76\u884c\u63a2\u7d22\u591a\u6761\u7814\u7a76\u8def\u7ebf\uff0c\u5e76\u7528 readiness gate \u5224\u65ad\u8def\u7ebf\u662f\u5426\u8db3\u591f\u6210\u719f\u518d\u5206\u89e3\u4e3a\u5b50\u95ee\u9898", "\u5c06\u8bc1\u660e\u8ba1\u5212\u8868\u793a\u4e3a\u76f8\u4e92\u4f9d\u8d56\u7684\u7ae0\u8282\u7ea7\u5b50\u95ee\u9898\uff0c\u5e76\u628a\u9a8c\u8bc1\u5668\u53d1\u73b0\u7684\u95ee\u9898\u56de\u4f20\u5230\u5bf9\u5e94\u8bba\u8bc1\u90e8\u5206\u8fdb\u884c\u4fee\u590d", "\u7ed3\u5408 Gemini 3.1 Pro/3.7 Flash\uff0c\u5728 TCS-Bench \u4e0a\u8fbe\u5230 71.0% \u51c6\u786e\u7387\uff1bCodeforces \u8bc4\u6d4b\u4e2d\u89e3\u51b3 218/222 \u9898"], "keywords": ["\u667a\u80fd\u4f53", "\u5b9a\u7406\u8bc1\u660e", "\u6570\u5b66\u63a8\u7406", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15983", "published_at": "2026-09-14", "score": 0.225, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Stellar Colosseum: A Many-Agent Harness for Long-Horizon Research in Mathematics and Theoretical Computer Science", "tldr": "\u591a\u667a\u80fd\u4f53\u6846\u67b6\u653b\u514b\u957f\u7a0b\u6570\u5b66\u4e0eTCS\u7814\u7a76", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Stellar Colosseum\uff0c\u4e00\u4e2a\u6a21\u578b\u65e0\u5173\u7684\u591a\u667a\u80fd\u4f53\u63a8\u7406\u5206\u914d\u6846\u67b6\uff0c\u7528\u4e8e\u6570\u5b66\u548c\u7406\u8bba\u8ba1\u7b97\u673a\u79d1\u5b66\u4e2d\u7684\u957f\u7a0b\u7814\u7a76\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u7b56\u7565\u63a2\u7d22\u3001\u6210\u719f\u5ea6\u95e8\u63a7\u3001\u5206\u5c42\u8bc1\u660e\u89c4\u5212\u3001\u5b9a\u5411\u53cd\u9a73\u4e0e\u805a\u5408\u673a\u5236\uff0c\u751f\u6210\u5e76\u4fee\u6b63\u590d\u6742\u8bc1\u660e\u6216\u7b97\u6cd5\u89e3\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u77ed\u8bc1\u660e\u4e4b\u5916\u7684\u957f\u7a0b\u5f00\u653e\u7814\u7a76\u95ee\u9898\uff0c\u5f3a\u8c03\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u53cd\u9a73\u9a71\u52a8\u9a8c\u8bc1\u548c\u7ed3\u6784\u5316\u8bc1\u660e\u89c4\u5212\uff0c\u5e76\u58f0\u79f0\u5728\u9876\u4f1a\u8bba\u6587\u884d\u751f\u5f00\u653e\u95ee\u9898\u4e0a\u5f97\u5230\u65b0\u7ed3\u679c\uff0c\u5c55\u793a\u4e86 LLM \u5728\u7814\u7a76\u7ea7\u6570\u5b66\u4e0e\u7406\u8bba\u8ba1\u7b97\u4e2d\u7684\u6f5c\u5728\u5f71\u54cd\u529b\u3002"}, {"abstract": "Memory-augmented and tool-using agents expose exact private values when remote LLMs process retrieved memory, tool actions, and intermediate observations. One-way masking limits direct exposure but removes values needed for trusted execution and can leak them through later observations. We propose Trustworthy Virtual Memory (TVM), a closed-loop runtime that keeps exact-value state local while presenting a protected view to the remote model. Within this single runtime, Rule-TVM replaces whole protected fields with locally recoverable handles, and Semantic-TVM instead replaces only sensitive spans predicted by a trusted local model, preserving surrounding task-relevant context. On Memory-EHR and Memory-RAP across two providers, span-level projection recovers most of the EHR utility lost under whole-field replacement (Task Success 84.17% vs. 52.33% on DeepSeek) while measured exposure stays low and workflows remain executable.", "arxiv_id": "2609.15011", "arxiv_url": "https://arxiv.org/abs/2609.15011", "authors": ["Yu Li", "Qikun Cai", "Tao Huang", "Chen Hou"], "brief": "\u8bba\u6587\u63d0\u51fa Trustworthy Virtual Memory\uff08TVM\uff09\u8fd0\u884c\u65f6\uff0c\u8ba9\u7cbe\u786e\u654f\u611f\u72b6\u6001\u4fdd\u7559\u5728\u672c\u5730\uff0c\u53ea\u5411\u8fdc\u7a0b LLM \u66b4\u9732\u53d7\u4fdd\u62a4\u89c6\u56fe\u3002\u5176 Semantic-TVM \u7528\u672c\u5730\u53ef\u4fe1\u6a21\u578b\u4ec5\u66ff\u6362\u654f\u611f\u7247\u6bb5\uff0c\u8f83\u6574\u5b57\u6bb5\u9690\u85cf\u66f4\u597d\u4fdd\u7559\u4efb\u52a1\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15011", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["Rule-TVM \u5c06\u53d7\u4fdd\u62a4\u5b57\u6bb5\u6574\u4f53\u66ff\u6362\u4e3a\u672c\u5730\u53ef\u6062\u590d\u53e5\u67c4\uff0c\u907f\u514d\u8fdc\u7a0b\u6a21\u578b\u76f4\u63a5\u63a5\u89e6\u771f\u5b9e\u503c", "Semantic-TVM \u8fdb\u884c\u654f\u611f span \u7ea7\u6295\u5f71\uff0c\u5728\u9690\u85cf\u9690\u79c1\u7684\u540c\u65f6\u4fdd\u7559\u5468\u56f4\u8bed\u4e49\u7ed3\u6784\u4e0e\u4efb\u52a1\u76f8\u5173\u4fe1\u606f", "\u5728 Memory-EHR \u548c Memory-RAP \u4e0a\uff0cDeepSeek \u7684\u4efb\u52a1\u6210\u529f\u7387\u4ece\u6574\u5b57\u6bb5\u66ff\u6362\u7684 52.33% \u63d0\u5347\u5230 84.17%\uff0c\u540c\u65f6\u4fdd\u6301\u4f4e\u4fe1\u606f\u66b4\u9732"], "keywords": ["\u667a\u80fd\u4f53", "\u9690\u79c1\u4fdd\u62a4", "\u5de5\u5177\u4f7f\u7528", "\u8bb0\u5fc6\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15011", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Semantic-TVM: Structure-Preserving Trustworthy Virtual Memory for Memory-Augmented and Tool-Using Agents", "tldr": "\u4e3a\u5de5\u5177\u667a\u80fd\u4f53\u63d0\u4f9b\u7ed3\u6784\u4fdd\u771f\u7684\u9690\u79c1\u865a\u62df\u5185\u5b58", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Trustworthy Virtual Memory\uff08TVM\uff09\u8fd0\u884c\u65f6\uff0c\u8ba9\u7cbe\u786e\u654f\u611f\u72b6\u6001\u4fdd\u7559\u5728\u672c\u5730\uff0c\u53ea\u5411\u8fdc\u7a0b LLM \u66b4\u9732\u53d7\u4fdd\u62a4\u89c6\u56fe\u3002\u5176 Semantic-TVM \u7528\u672c\u5730\u53ef\u4fe1\u6a21\u578b\u4ec5\u66ff\u6362\u654f\u611f\u7247\u6bb5\uff0c\u8f83\u6574\u5b57\u6bb5\u9690\u85cf\u66f4\u597d\u4fdd\u7559\u4efb\u52a1\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u8bb0\u5fc6\u589e\u5f3a\u4e0e\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u7684\u6838\u5fc3\u9690\u79c1\u98ce\u9669\uff0c\u63d0\u51fa\u53ef\u6267\u884c\u7684\u95ed\u73af\u8fd0\u884c\u65f6\u65b9\u6848\uff0c\u5728\u9690\u79c1\u4fdd\u62a4\u4e0e\u4efb\u52a1\u6548\u7528\u4e4b\u95f4\u53d6\u5f97\u66f4\u597d\u5e73\u8861\uff0c\u5177\u6709\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) is widely utilized in large language model training to improve targeted capabilities, yet how RL reshapes a model remains poorly understood. Prior attempts to explain how RL works largely offer behavioral perspectives, leaving open what RL gives a model at the representation level: can RL create genuinely novel features, and which existing features does it enhance or suppress? Recent developments in mechanistic interpretability suggest sparse autoencoders (SAEs) as a promising lens to decompose internal activations into human-interpretable features; however, they cannot be directly applied to tracking change across training. In this work, we introduce Fixed-SAE Track, a framework that trains one shared SAE per considered layer on activations pooled across the base model and all RL checkpoints, holding every feature direction fixed so that representation shifts are rigorously defined through the activations of interpretable SAE latents, including the detection of emerging novel features. Validated across multiple datasets and RL algorithms, we find that RL-induced drift is small, gradual, concept specific, and concentrated in late layers, mainly enhancing the sampling rates of a small set of ladder tokens, formatting scaffolding such as step breaks and answer delimiters, rather than reshaping problem content. Steering these features into the base model recovers around 80% of RL\u0027s performance gain, suggesting that RL primarily elicits capabilities the model already possesses, much as steering does. We further design a synthetic benchmark with features known by construction to test whether RL can instill genuinely novel features. We believe Fixed-SAE Track provides a principled approach to tracking representation shifts and offers representational evidence for understanding how reinforcement learning changes the inner representation of LLMs.", "arxiv_id": "2609.15064", "arxiv_url": "https://arxiv.org/abs/2609.15064", "authors": ["Lingheng Du", "Yiming Tang", "Xufeng Duan", "Dianbo Liu"], "brief": "\u8bba\u6587\u63d0\u51fa Fixed-SAE Track\uff1a\u5728\u57fa\u5ea7\u6a21\u578b\u4e0e\u591a\u4e2aRL\u68c0\u67e5\u70b9\u7684\u6fc0\u6d3b\u4e0a\u8bad\u7ec3\u5171\u4eabSAE\uff0c\u5e76\u56fa\u5b9a\u7279\u5f81\u65b9\u5411\uff0c\u4ee5\u53ef\u89e3\u91ca\u6f5c\u53d8\u91cf\u8ffd\u8e2aRL\u8bad\u7ec3\u524d\u540e\u7684\u8868\u5f81\u53d8\u5316\u3002\u7814\u7a76\u53d1\u73b0RL\u5e26\u6765\u7684\u8868\u5f81\u6f02\u79fb\u8f83\u5c0f\u3001\u6e10\u8fdb\u4e14\u96c6\u4e2d\u4e8e\u540e\u5c42\uff0c\u4e3b\u8981\u589e\u5f3a\u5df2\u6709\u7684\u683c\u5f0f\u4e0e\u63a8\u7406\u811a\u624b\u67b6\u7279\u5f81\uff0c\u800c\u975e\u91cd\u5851\u95ee\u9898\u5185\u5bb9\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15064", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["Fixed-SAE Track \u901a\u8fc7\u5171\u4eab\u4e14\u56fa\u5b9a\u7684SAE\u7279\u5f81\u65b9\u5411\uff0c\u4f7f\u4e0d\u540cRL\u9636\u6bb5\u7684\u8868\u5f81\u53d8\u5316\u53ef\u4e25\u683c\u6bd4\u8f83\uff0c\u5e76\u53ef\u68c0\u6d4b\u65b0\u5174\u7279\u5f81\u3002", "\u8de8\u591a\u4e2a\u6570\u636e\u96c6\u548cRL\u7b97\u6cd5\u9a8c\u8bc1\u540e\u53d1\u73b0\uff0cRL\u4e3b\u8981\u63d0\u5347\u5c11\u91cf\u201c\u9636\u68af token\u201d\u3001\u6b65\u9aa4\u5206\u9694\u3001\u7b54\u6848\u5b9a\u754c\u7b26\u7b49\u683c\u5f0f\u5316\u7279\u5f81\u7684\u91c7\u6837\u7387\u3002", "\u5c06\u8fd9\u4e9b\u7279\u5f81\u76f4\u63a5\u6ce8\u5165\u57fa\u5ea7\u6a21\u578b\u53ef\u6062\u590d\u7ea680%\u7684RL\u6027\u80fd\u589e\u76ca\uff0c\u652f\u6301\u201cRL\u4e3b\u8981\u6fc0\u53d1\u73b0\u6709\u80fd\u529b\u201d\u8fd9\u4e00\u89e3\u91ca\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u673a\u68b0\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15064", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "What Does an LLM Learn from Reinforcement Learning? A Mechanistic Interpretability Perspective with Fixed-SAE Track", "tldr": "\u7528\u56fa\u5b9aSAE\u8ffd\u8e2aRL\u5982\u4f55\u6539\u53d8LLM\u8868\u5f81", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Fixed-SAE Track\uff1a\u5728\u57fa\u5ea7\u6a21\u578b\u4e0e\u591a\u4e2aRL\u68c0\u67e5\u70b9\u7684\u6fc0\u6d3b\u4e0a\u8bad\u7ec3\u5171\u4eabSAE\uff0c\u5e76\u56fa\u5b9a\u7279\u5f81\u65b9\u5411\uff0c\u4ee5\u53ef\u89e3\u91ca\u6f5c\u53d8\u91cf\u8ffd\u8e2aRL\u8bad\u7ec3\u524d\u540e\u7684\u8868\u5f81\u53d8\u5316\u3002\u7814\u7a76\u53d1\u73b0RL\u5e26\u6765\u7684\u8868\u5f81\u6f02\u79fb\u8f83\u5c0f\u3001\u6e10\u8fdb\u4e14\u96c6\u4e2d\u4e8e\u540e\u5c42\uff0c\u4e3b\u8981\u589e\u5f3a\u5df2\u6709\u7684\u683c\u5f0f\u4e0e\u63a8\u7406\u811a\u624b\u67b6\u7279\u5f81\uff0c\u800c\u975e\u91cd\u5851\u95ee\u9898\u5185\u5bb9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u673a\u68b0\u53ef\u89e3\u91ca\u6027\u5de5\u5177\u7528\u4e8eRL\u8bad\u7ec3\u8fc7\u7a0b\u5206\u6790\uff0c\u4e3a\u7406\u89e3RL\u7a76\u7adf\u5728LLM\u5185\u90e8\u6539\u53d8\u4e86\u4ec0\u4e48\u63d0\u4f9b\u4e86\u8868\u5f81\u5c42\u8bc1\u636e\uff1b\u5176\u7ed3\u8bba\u4e5f\u6311\u6218\u4e86\u201cRL\u521b\u9020\u65b0\u80fd\u529b\u201d\u7684\u5e38\u89c1\u76f4\u89c9\uff0c\u5bf9RLHF/RLVR\u8bad\u7ec3\u673a\u5236\u7814\u7a76\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "We introduce HoneyRoute, an inference-serving layer that detects whether an incoming request is malicious and, if so, routes it to a dedicated honeypot model, shielding production while the adversary\u0027s interaction is continuously harvested for intelligence. Existing defenses embed traps inside model memory or rebuild deception at the protocol layer, leaving the serving tier unprotected and feeding nothing back into detection. HoneyRoute couples (i) a streaming router (a frozen 0.8B-embedding backbone with per-domain MLP heads), (ii) a dual-implementation honeypot (a rule/prompt-engineered code honeypot or a dedicated same-family replica), and (iii) an analysis loop that converts trapped interactions into attacker fingerprints for router retraining. On a production trace plus a seven-domain attack corpus, the router reaches F1=.911 at 38 ms median added latency, matching 96% of a two-tier guard-LLM cascade\u0027s F1 at 1/385 of its latency with 0% evasion under 13 adversarial transformations; diverting the malicious share cuts production-model token consumption under concurrent flooding with real GCG-suffix payloads by 97.8%; the trained replica agrees with the production model on 92.9% of benign holdout requests, while naive unconditional bait injection collapses to 7.6% and selective camouflaged injection recovers to 88.9%, mapping the recoverable fidelity-traceability frontier; and a loop-trained correction head cuts misrouting of legitimate security research 9x while raising detection F1 to .933.", "arxiv_id": "2609.08306", "arxiv_url": "https://arxiv.org/abs/2609.08306", "authors": ["Han Jin"], "brief": "HoneyRoute \u662f\u4e00\u4e2a\u9762\u5411 LLM \u63a8\u7406\u670d\u52a1\u7684\u5b89\u5168\u8def\u7531\u5c42\uff1a\u5148\u6d41\u5f0f\u5224\u65ad\u8bf7\u6c42\u662f\u5426\u6076\u610f\uff0c\u82e5\u662f\u5219\u8f6c\u53d1\u5230\u4e13\u7528\u871c\u7f50\u6a21\u578b\uff0c\u4fdd\u62a4\u751f\u4ea7\u6a21\u578b\u5e76\u6301\u7eed\u6536\u96c6\u653b\u51fb\u60c5\u62a5\u3002\u5b83\u8fd8\u5c06\u871c\u7f50\u4ea4\u4e92\u8f6c\u5316\u4e3a\u653b\u51fb\u8005\u6307\u7eb9\uff0c\u7528\u4e8e\u540e\u7eed\u68c0\u6d4b\u5668\u518d\u8bad\u7ec3\u3002", "categories": ["cs.CR", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08306", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8def\u7531\u5668\u91c7\u7528\u51bb\u7ed3\u7684 0.8B embedding \u4e3b\u5e72\u4e0e\u6309\u9886\u57df\u914d\u7f6e\u7684 MLP \u5934\uff0c\u5728\u751f\u4ea7\u8f68\u8ff9\u548c\u4e03\u9886\u57df\u653b\u51fb\u8bed\u6599\u4e0a\u8fbe\u5230 F1=0.911\uff0c\u4e2d\u4f4d\u989d\u5916\u5ef6\u8fdf 38ms\u3002", "\u76f8\u6bd4\u53cc\u5c42 guard-LLM \u7ea7\u8054\u65b9\u6848\uff0c\u8fbe\u5230\u5176 96% \u7684 F1\uff0c\u4f46\u5ef6\u8fdf\u4ec5\u4e3a 1/385\uff1b\u5728 13 \u79cd\u5bf9\u6297\u53d8\u6362\u4e0b\u62a5\u544a 0% \u9003\u9038\u3002", "\u5728\u5e76\u53d1 GCG \u540e\u7f00\u653b\u51fb\u6d2a\u6cdb\u4e2d\uff0c\u5c06\u751f\u4ea7\u6a21\u578b token \u6d88\u8017\u964d\u4f4e 97.8%\uff1b\u95ed\u73af\u8bad\u7ec3\u540e\u5c06\u5408\u6cd5\u5b89\u5168\u7814\u7a76\u8bef\u8def\u7531\u964d\u4f4e 9 \u500d\uff0cF1 \u63d0\u5347\u81f3 0.933\u3002"], "keywords": ["LLM\u5b89\u5168", "\u63a8\u7406\u670d\u52a1", "\u871c\u7f50", "\u5bf9\u6297\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08306", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HoneyRoute: Honeypot-Model Routing for Adversarial LLM Serving", "tldr": "\u7528\u871c\u7f50\u6a21\u578b\u8def\u7531\u9694\u79bb\u6076\u610fLLM\u8bf7\u6c42", "upvotes": 0, "what_it_is": "HoneyRoute \u662f\u4e00\u4e2a\u9762\u5411 LLM \u63a8\u7406\u670d\u52a1\u7684\u5b89\u5168\u8def\u7531\u5c42\uff1a\u5148\u6d41\u5f0f\u5224\u65ad\u8bf7\u6c42\u662f\u5426\u6076\u610f\uff0c\u82e5\u662f\u5219\u8f6c\u53d1\u5230\u4e13\u7528\u871c\u7f50\u6a21\u578b\uff0c\u4fdd\u62a4\u751f\u4ea7\u6a21\u578b\u5e76\u6301\u7eed\u6536\u96c6\u653b\u51fb\u60c5\u62a5\u3002\u5b83\u8fd8\u5c06\u871c\u7f50\u4ea4\u4e92\u8f6c\u5316\u4e3a\u653b\u51fb\u8005\u6307\u7eb9\uff0c\u7528\u4e8e\u540e\u7eed\u68c0\u6d4b\u5668\u518d\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u9632\u5fa1\u91cd\u70b9\u4ece\u6a21\u578b\u5185\u90e8\u6216\u534f\u8bae\u5c42\u6269\u5c55\u5230\u63a8\u7406\u670d\u52a1\u5c42\uff0c\u901a\u8fc7\u201c\u68c0\u6d4b\u2014\u8bf1\u6355\u2014\u60c5\u62a5\u56de\u6d41\u201d\u7684\u95ed\u73af\u673a\u5236\u517c\u987e\u4f4e\u5ef6\u8fdf\u3001\u6210\u672c\u63a7\u5236\u4e0e\u653b\u51fb\u53d6\u8bc1\uff0c\u5bf9\u5b9e\u9645 LLM \u670d\u52a1\u5b89\u5168\u90e8\u7f72\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "AI co-scientists could accelerate computational research, but over a long-running study the workflow also has to stay inspectable, resumable and reproducible, which requires persistent computational state and provenance. Here we present OpenAI4S, an open-source scientific research agent built around the principle of \\emph{Code as Action, Science as Sessions}. OpenAI4S combines a persistent computing runtime with research-session management: orchestration is handled through structured tool calls, while scientific actions are represented as complete code cells executed in persistent Python and R kernels. An append-only Action Ledger, per-cell execution records, versioned artifacts, environment records, and workspace checkpoints preserve how results were produced and support session recovery, branching, and extension. Configurable sandboxing, permission controls, and code and trajectory screening provide complementary safeguards. We evaluate OpenAI4S on 36 research scenarios spanning retrosynthesis, molecular dynamics, protein binder design, protein mutation, catalyst screening, and mineral spectroscopy, measuring scientific task accuracy, workflow completeness, and reproducibility of the resulting repositories. OpenAI4S achieves an overall score of 7.83, compared with 5.7--6.4 for a general-purpose coding harness evaluated with three frontier models, with the largest gains on long-horizon and computation-intensive workflows. These results suggest that integrating persistent execution with session-level provenance can improve the reliability of AI-assisted scientific workflows. Environment specification and full rerunnability remain weak for every evaluated system, ours included, so reproducibility is still an open problem for scientific agents. The system is available under the MIT license at \\href{https://github.com/PKU-YuanGroup/OpenAI4S}{github.com/PKU-YuanGroup/OpenAI4S}.", "arxiv_id": "2609.15096", "arxiv_url": "https://arxiv.org/abs/2609.15096", "authors": ["Gongbo Zhang", "Hao Li", "Yu Wang", "Mujie Lin", "Liuzhenghao Lv", "Yicheng Mao", "Yimi Wang", "Jun Zhu", "Minhan Tang", "Zhengxiang Jiang", "Yusong Wang", "Jiayu Yao", "Kunpeng Ning", "Dawei Pang", "Yonghong Tian", "OpenAI4S Community", "Yuyang Liu", "Li Yuan"], "brief": "OpenAI4S \u662f\u4e00\u4e2a\u5f00\u6e90\u79d1\u7814\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ee5\u201c\u4ee3\u7801\u5373\u884c\u52a8\u3001\u79d1\u5b66\u5373\u4f1a\u8bdd\u201d\u4e3a\u6838\u5fc3\uff0c\u5c06\u79d1\u7814\u64cd\u4f5c\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\u5355\u5143\uff0c\u5e76\u5728\u6301\u4e45 Python/R \u8fd0\u884c\u65f6\u4e2d\u7ba1\u7406\u957f\u5468\u671f\u7814\u7a76\u6d41\u7a0b\u3002\u7cfb\u7edf\u901a\u8fc7\u884c\u52a8\u8d26\u672c\u3001\u6267\u884c\u8bb0\u5f55\u3001\u7248\u672c\u5316\u4ea7\u7269\u3001\u73af\u5883\u8bb0\u5f55\u548c\u5de5\u4f5c\u533a\u68c0\u67e5\u70b9\uff0c\u652f\u6301\u7ed3\u679c\u6eaf\u6e90\u3001\u6062\u590d\u3001\u5206\u652f\u4e0e\u6269\u5c55\u3002", "categories": ["cs.AI", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15096", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u6301\u4e45\u8ba1\u7b97\u8fd0\u884c\u65f6\u4e0e\u7814\u7a76\u4f1a\u8bdd\u7ba1\u7406\uff0c\u5de5\u5177\u8c03\u7528\u8d1f\u8d23\u7f16\u6392\uff0c\u5b8c\u6574\u4ee3\u7801\u5355\u5143\u8d1f\u8d23\u5b9e\u9645\u79d1\u5b66\u64cd\u4f5c\u6267\u884c\u3002", "\u5f15\u5165\u8ffd\u52a0\u5f0f Action Ledger\u3001\u9010\u5355\u5143\u6267\u884c\u8bb0\u5f55\u3001\u7248\u672c\u5316\u4ea7\u7269\u548c\u68c0\u67e5\u70b9\uff0c\u589e\u5f3a\u957f\u6d41\u7a0b\u79d1\u7814\u4efb\u52a1\u7684\u53ef\u68c0\u67e5\u6027\u4e0e\u53ef\u6062\u590d\u6027\u3002", "\u5728 36 \u4e2a\u79d1\u7814\u573a\u666f\u4e0a\u8bc4\u6d4b\uff0c\u8986\u76d6\u9006\u5408\u6210\u3001\u5206\u5b50\u52a8\u529b\u5b66\u3001\u86cb\u767d\u8bbe\u8ba1\u3001\u50ac\u5316\u5242\u7b5b\u9009\u7b49\uff0c\u6574\u4f53\u5f97\u5206 7.83\uff0c\u9ad8\u4e8e\u901a\u7528\u4ee3\u7801\u6267\u884c\u6846\u67b6\u7684 5.7\u20136. cross multiple iterations, achieving parameter efficiency without sacrificing representational power. Besides, looped Transformers perform inference directly in the latent space (latent reasoning) to reduce the number of tokens consumed during inference, thereby achieving improved sample efficiency. However, these models typically apply a fixed recursion depth uniformly to every token, leading to suboptimal compute allocation and leaving significant efficiency gains on the table. In this work, we propose \\textbf{dynamic token-choice routing} for looped transformers, enabling each token to adaptively determine its own number of loop iterations based on its hidden state. We use a dynamic router to decide whether a token should continue recursing or exit early, allowing simple tokens to bypass unnecessary computation while hard tokens receive deeper processing. To ensure that this adaptive mechanism does not compromise decoding efficiency, we further introduce recursion-wise KV caching, which maintains an independent key-value cache for each recursion loop. This design ensures that tokens at different depths only attend to their corresponding cached states, effectively eliminating redundant computations for exited tokens and enabling fast autoregressive decoding. Extensive experiments show that T-LoopFormer reaches the sota performance under the same parameters on PPL and 10 zero-shot reasoning tasks, even surpassing the base model at 24x FLOPs and our model could reach the lowest inference latency, which validate the effectiveness of token-choice router and recursion-wise KV cache. Code: https://github.com/YuMingQian1234/T-LoopFormer.", "arxiv_id": "2609.15160", "arxiv_url": "https://arxiv.org/abs/2609.15160", "authors": ["Mingqian Yu", "Wenpeng Zhang", "Peilin Zhao"], "brief": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa T-LoopFormer\uff0c\u5728\u5faa\u73af Transformer \u4e2d\u5f15\u5165\u52a8\u6001 token \u7ea7\u8def\u7531\uff0c\u4f7f\u4e0d\u540c token \u6839\u636e\u9690\u85cf\u72b6\u6001\u9009\u62e9\u4e0d\u540c\u9012\u5f52\u5c42\u6570\u3002\u5b83\u7ed3\u5408\u6f5c\u7a7a\u95f4\u63a8\u7406\u4e0e\u53c2\u6570\u5171\u4eab\uff0c\u5728\u4fdd\u6301\u6a21\u578b\u89c4\u6a21\u4e0d\u53d8\u7684\u540c\u65f6\u63d0\u5347\u63a8\u7406\u6548\u7387\u4e0e\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15160", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa dynamic token-choice routing\uff1a\u7b80\u5355 token \u53ef\u63d0\u524d\u9000\u51fa\u5faa\u73af\uff0c\u56f0\u96be token \u83b7\u5f97\u66f4\u6df1\u5904\u7406\uff0c\u5b9e\u73b0\u6309 token \u5206\u914d\u8ba1\u7b97\u91cf", "\u5f15\u5165 recursion-wise KV caching\uff1a\u4e3a\u6bcf\u4e2a\u9012\u5f52\u5faa\u73af\u7ef4\u62a4\u72ec\u7acb KV \u7f13\u5b58\uff0c\u907f\u514d\u5df2\u9000\u51fa token \u7684\u5197\u4f59\u8ba1\u7b97\u5e76\u652f\u6301\u9ad8\u6548\u81ea\u56de\u5f52\u89e3\u7801", "\u5728 PPL \u4e0e 10 \u4e2a\u96f6\u6837\u672c\u63a8\u7406\u4efb\u52a1\u4e0a\u8fbe\u5230\u540c\u53c2\u6570 SOTA\uff0c\u751a\u81f3\u8d85\u8fc7 24x FLOPs \u7684\u57fa\u7ebf\u6a21\u578b\uff0c\u5e76\u53d6\u5f97\u6700\u4f4e\u63a8\u7406\u5ef6\u8fdf"], "keywords": ["\u9ad8\u6548\u63a8\u7406", "\u52a8\u6001\u8def\u7531", "Transformer", "\u6f5c\u7a7a\u95f4\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15160", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "T-LoopFormer: Token-Level Elastic-Depth Looped Transformers for Latent Reasoning With Dynamic Routing", "tldr": "\u8ba9\u6bcf\u4e2atoken\u81ea\u9002\u5e94\u9009\u62e9\u63a8\u7406\u6df1\u5ea6", "upvotes": 0, "what_it_is": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa T-LoopFormer\uff0c\u5728\u5faa\u73af Transformer \u4e2d\u5f15\u5165\u52a8\u6001 token \u7ea7\u8def\u7531\uff0c\u4f7f\u4e0d\u540c token \u6839\u636e\u9690\u85cf\u72b6\u6001\u9009\u62e9\u4e0d\u540c\u9012\u5f52\u5c42\u6570\u3002\u5b83\u7ed3\u5408\u6f5c\u7a7a\u95f4\u63a8\u7406\u4e0e\u53c2\u6570\u5171\u4eab\uff0c\u5728\u4fdd\u6301\u6a21\u578b\u89c4\u6a21\u4e0d\u53d8\u7684\u540c\u65f6\u63d0\u5347\u63a8\u7406\u6548\u7387\u4e0e\u6027\u80fd\u3002", "why_notable": "\u2462\u4e3a\u4f55\u503c\u5f97\u5173\u6ce8\uff1a\u5b83\u628a\u5faa\u73af Transformer \u7684\u56fa\u5b9a\u6df1\u5ea6\u6539\u4e3a token \u7ea7\u5f39\u6027\u6df1\u5ea6\uff0c\u517c\u987e\u6f5c\u7a7a\u95f4\u63a8\u7406\u3001\u53c2\u6570\u6548\u7387\u548c\u89e3\u7801\u901f\u5ea6\uff0c\u4e3a\u9ad8\u6548\u63a8\u7406\u578b\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Diffusion language models (dLLMs) promise fast inference by generating multiple tokens in parallel, but suffer severe performance degradation when parallel decoding is pushed too aggressively. We introduce Temporal Self-Distillation (TSD), a simple on-policy method that trains dLLMs for fast inference by distilling predictions across time. Specifically, TSD distills the model\u0027s denoising distribution at earlier timesteps toward its distribution at the final timestep at which a token is committed. This encourages earlier predictions to better anticipate the model\u0027s eventual output, enabling much more aggressive parallel decoding. Because its teacher signal comes from the model itself, TSD requires no offline teacher generation and applies seamlessly to both base and post-trained policies. Across seven benchmarks in mathematics, planning, and code, TSD substantially shifts the speed--quality frontier toward the low-compute regime. TSD thus provides a simple, single-stage approach to accelerating dLLMs, achieving speedups competitive with offline distillation while avoiding a complex two-stage pipeline.", "arxiv_id": "2609.15177", "arxiv_url": "https://arxiv.org/abs/2609.15177", "authors": ["Shijian Xu", "Andrea Miele", "Metod Jazbec", "Volker Roth", "Eric Nalisnick", "Ilija Bogunovic"], "brief": "\u672c\u6587\u63d0\u51fa Temporal Self-Distillation\uff08TSD\uff09\uff0c\u4e00\u79cd\u5728\u7ebf\u81ea\u84b8\u998f\u8bad\u7ec3\u65b9\u6cd5\uff0c\u7528\u4e8e\u63d0\u5347\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5728\u6fc0\u8fdb\u5e76\u884c\u89e3\u7801\u4e0b\u7684\u63a8\u7406\u901f\u5ea6\u4e0e\u8d28\u91cf\u3002\u5b83\u5c06\u65e9\u671f\u53bb\u566a\u65f6\u95f4\u6b65\u7684\u9884\u6d4b\u5206\u5e03\u84b8\u998f\u5230\u6700\u7ec8\u63d0\u4ea4 token \u65f6\u7684\u5206\u5e03\uff0c\u4f7f\u6a21\u578b\u66f4\u65e9\u9884\u5224\u6700\u7ec8\u8f93\u51fa\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15177", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u65e0\u9700\u79bb\u7ebf\u6559\u5e08\u6a21\u578b\u6216\u9884\u751f\u6210\u6570\u636e\uff0c\u6559\u5e08\u4fe1\u53f7\u6765\u81ea\u6a21\u578b\u81ea\u8eab\uff0c\u8bad\u7ec3\u6d41\u7a0b\u66f4\u7b80\u5355", "\u9002\u7528\u4e8e\u57fa\u7840\u6a21\u578b\u548c\u540e\u8bad\u7ec3\u7b56\u7565\uff0c\u53ef\u4f5c\u4e3a\u5355\u9636\u6bb5\u65b9\u6cd5\u76f4\u63a5\u52a0\u901f dLLM", "\u5728\u6570\u5b66\u3001\u89c4\u5212\u548c\u4ee3\u7801\u7b49\u4e03\u4e2a\u57fa\u51c6\u4e0a\u663e\u8457\u6539\u5584\u4f4e\u8ba1\u7b97\u91cf\u4e0b\u7684\u901f\u5ea6-\u8d28\u91cf\u6743\u8861"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15177", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Temporal Self-Distillation: Faster Inference in Discrete Diffusion Language Models", "tldr": "\u65f6\u95f4\u81ea\u84b8\u998f\u52a0\u901f\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Temporal Self-Distillation\uff08TSD\uff09\uff0c\u4e00\u79cd\u5728\u7ebf\u81ea\u84b8\u998f\u8bad\u7ec3\u65b9\u6cd5\uff0c\u7528\u4e8e\u63d0\u5347\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u5728\u6fc0\u8fdb\u5e76\u884c\u89e3\u7801\u4e0b\u7684\u63a8\u7406\u901f\u5ea6\u4e0e\u8d28\u91cf\u3002\u5b83\u5c06\u65e9\u671f\u53bb\u566a\u65f6\u95f4\u6b65\u7684\u9884\u6d4b\u5206\u5e03\u84b8\u998f\u5230\u6700\u7ec8\u63d0\u4ea4 token \u65f6\u7684\u5206\u5e03\uff0c\u4f7f\u6a21\u578b\u66f4\u65e9\u9884\u5224\u6700\u7ec8\u8f93\u51fa\u3002", "why_notable": "TSD \u9488\u5bf9 dLLM \u5e76\u884c\u89e3\u7801\u8fc7\u5feb\u5bfc\u81f4\u8d28\u91cf\u5d29\u584c\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u7b80\u5355\u4e14\u5b9e\u7528\u7684\u8bad\u7ec3\u65b9\u6848\uff0c\u5728\u907f\u514d\u590d\u6742\u4e24\u9636\u6bb5\u79bb\u7ebf\u84b8\u998f\u6d41\u7a0b\u7684\u540c\u65f6\uff0c\u83b7\u5f97\u63a5\u8fd1\u79bb\u7ebf\u84b8\u998f\u7684\u52a0\u901f\u6548\u679c\u3002"}, {"abstract": "% !TEX root = ../main.tex People increasingly use large language models (LLMs) for mental health support, yet their safety in evolving, high-risk conversations remains poorly characterised. We developed K-Bench, a clinician-calibrated, protected benchmark evaluating 125 model configurations representing 33 base models from 14 providers across a fixed cohort of 200 multi-turn vignettes involving suicide, self-harm, domestic violence, substance misuse, and no-risk presentations. Synthetic patient conversations showed substantial distributional overlap with real human-AI conversations. A frozen GPT-4o judge achieved 94.2% exact agreement with clinician consensus across 6,751 eligible item comparisons from 151 clinician-rated transcripts. Leading models combined strong supportive conversation with combined-risk scores above 95, whereas risk exploration exposed substantial variation among lower-performing configurations. Therapeutic prompting produced configuration-specific gains concentrated among weaker models, while elevated reasoning produced no average improvement. K-Bench combines broader clinical coverage and configuration-scale comparison with a continuously updated public leaderboard whose operational test materials are protected from direct optimisation. The leaderboard is available at www.k-bench.ai.", "arxiv_id": "2609.15855", "arxiv_url": "https://arxiv.org/abs/2609.15855", "authors": ["Laura M. Vowels", "Matthew J. Vowels", "Shivali Sharma", "Apoorv Jha", "Rehnuma Choudhury", "Wasseem El Sarraj", "Rachel Francois-Walcott", "Aruba Hussain", "Sarah Ingram", "Angela Loulopoulou", "Adva Segal", "Elena Volkova"], "brief": "\u8bba\u6587\u63d0\u51fa K-Bench\uff0c\u4e00\u4e2a\u7531\u4e34\u5e8a\u4e13\u5bb6\u6821\u51c6\u7684\u9ad8\u98ce\u9669\u5fc3\u7406\u5065\u5eb7\u591a\u8f6e\u5bf9\u8bdd\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u6a21\u578b\u5728\u81ea\u6740\u3001\u81ea\u4f24\u3001\u5bb6\u66b4\u3001\u7269\u8d28\u6ee5\u7528\u7b49\u573a\u666f\u4e2d\u7684\u5b89\u5168\u4e0e\u652f\u6301\u80fd\u529b\u3002\u5176\u8986\u76d6125\u79cd\u6a21\u578b\u914d\u7f6e\u300133\u4e2a\u57fa\u7840\u6a21\u578b\u548c200\u4e2a\u56fa\u5b9a\u591a\u8f6e\u6848\u4f8b\uff0c\u5e76\u63d0\u4f9b\u6301\u7eed\u66f4\u65b0\u7684\u516c\u5f00\u6392\u884c\u699c\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15855", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5408\u6210\u60a3\u8005\u5bf9\u8bdd\u4e0e\u771f\u5b9e\u4eba\u673a\u5fc3\u7406\u5065\u5eb7\u5bf9\u8bdd\u5b58\u5728\u663e\u8457\u5206\u5e03\u91cd\u53e0\uff0c\u63d0\u5347\u4e86\u57fa\u51c6\u7684\u73b0\u5b9e\u76f8\u5173\u6027\u3002", "\u51bb\u7ed3\u7248 GPT-4o \u8bc4\u5ba1\u5728151\u4efd\u4e34\u5e8a\u6807\u6ce8\u8f6c\u5f55\u30016751\u9879\u53ef\u8bc4\u4f30\u6bd4\u8f83\u4e2d\uff0c\u4e0e\u4e34\u5e8a\u5171\u8bc6\u8fbe\u523094.2%\u7cbe\u786e\u4e00\u81f4\u7387\u3002", "\u5f3a\u6a21\u578b\u5728\u652f\u6301\u6027\u5bf9\u8bdd\u548c\u7efc\u5408\u98ce\u9669\u5206\u6570\u4e0a\u53ef 3a5\u5237\u699c\u98ce\u9669\u3002"}, {"abstract": "Discrete diffusion and flow models are a promising alternative to autoregressive language models, but compressing many-step sampling into fewer steps typically requires distilling a pretrained teacher model. This caps the student at the teacher\u0027s quality and requires a costly two-stage training pipeline. We introduce Discrete Beckmann Transport Models (DBTM), built on a time-independent flow whose autonomous transport map provably carries any point in the ambient space to a fixed point on the vertices of the simplex in a single step. We show that this fixed-point property is characterized by a conservation equation whose residual can be minimized directly from data, removing the requirement for a teacher flow and time conditioning. Under this construction, a partially trained map corresponds to the flow truncated at finite time, so generation reduces to iterating one map until it reaches a fixed point. We further extend the map to a partial-context interpolant where additional function evaluations act as refinement steps rather than ODE integration steps. On language modeling and reasoning tasks, DBTM enables one- and few-step generation that improves quality and accuracy over discrete diffusion and continuous flow baselines.", "arxiv_id": "2609.15903", "arxiv_url": "https://arxiv.org/abs/2609.15903", "authors": ["Sophia Tang", "Shiyi Wang"], "brief": "\u8bba\u6587\u63d0\u51fa\u79bb\u6563 Beckmann Transport Models\uff08DBTM\uff09\uff0c\u7528\u65f6\u95f4\u65e0\u5173\u6d41\u6784\u5efa\u53ef\u5728\u5355\u6b65\u5c06\u70b9\u4f20\u8f93\u5230\u5355\u7eaf\u5f62\u9876\u70b9\u56fa\u5b9a\u70b9\u7684\u79bb\u6563\u751f\u6210\u6a21\u578b\u3002\u5176\u8bad\u7ec3\u901a\u8fc7\u6700\u5c0f\u5316\u5b88\u6052\u65b9\u7a0b\u6b8b\u5dee\u76f4\u63a5\u4ece\u6570\u636e\u5b66\u4e60\uff0c\u65e0\u9700\u9884\u8bad\u7ec3\u6559\u5e08\u6a21\u578b\u6216\u65f6\u95f4\u6761\u4ef6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15903", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u5177\u6709\u56fa\u5b9a\u70b9\u6027\u8d28\u7684\u81ea\u6cbb\u4f20\u8f93\u6620\u5c04\uff0c\u53ef\u652f\u6301\u4e00\u6b65\u6216\u5c11\u6b65\u79bb\u6563\u8bed\u8a00\u751f\u6210", "\u5c06\u56fa\u5b9a\u70b9\u6027\u8d28\u523b\u753b\u4e3a\u5b88\u6052\u65b9\u7a0b\uff0c\u5e76\u7528\u6570\u636e\u76f4\u63a5\u4f18\u5316\u6b8b\u5dee\uff0c\u907f\u514d\u84b8\u998f\u548c\u4e24\u9636\u6bb5\u8bad\u7ec3", "\u6269\u5c55\u5230\u90e8\u5206\u4e0a\u4e0b\u6587\u63d2\u503c\u8bbe\u5b9a\uff0c\u4f7f\u989d\u5916\u51fd\u6570\u8c03\u7528\u6210\u4e3a\u751f\u6210\u7ec6\u5316\u6b65\u9aa4\u800c\u975eODE\u79ef\u5206\u6b65\u9aa4"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u79bb\u6563\u6269\u6563", "\u6d41\u6a21\u578b", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15903", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Discrete Beckmann Transport Models for One-Step Language Modeling and Reasoning", "tldr": "DBTM\u5b9e\u73b0\u65e0\u9700\u6559\u5e08\u7684\u4e00\u6b65\u79bb\u6563\u8bed\u8a00\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u79bb\u6563 Beckmann Transport Models\uff08DBTM\uff09\uff0c\u7528\u65f6\u95f4\u65e0\u5173\u6d41\u6784\u5efa\u53ef\u5728\u5355\u6b65\u5c06\u70b9\u4f20\u8f93\u5230\u5355\u7eaf\u5f62\u9876\u70b9\u56fa\u5b9a\u70b9\u7684\u79bb\u6563\u751f\u6210\u6a21\u578b\u3002\u5176\u8bad\u7ec3\u901a\u8fc7\u6700\u5c0f\u5316\u5b88\u6052\u65b9\u7a0b\u6b8b\u5dee\u76f4\u63a5\u4ece\u6570\u636e\u5b66\u4e60\uff0c\u65e0\u9700\u9884\u8bad\u7ec3\u6559\u5e08\u6a21\u578b\u6216\u65f6\u95f4\u6761\u4ef6\u3002", "why_notable": "\u76f8\u6bd4\u5e38\u89c1\u79bb\u6563\u6269\u6563\u548c\u8fde\u7eed\u6d41\u65b9\u6cd5\uff0cDBTM\u5728\u8bed\u8a00\u5efa\u6a21\u4e0e\u63a8\u7406\u4efb\u52a1\u4e2d\u63d0\u5347\u4e86\u4e00\u6b65/\u5c11\u6b65\u751f\u6210\u8d28\u91cf\u4e0e\u51c6\u786e\u7387\uff0c\u540c\u65f6\u6446\u8131\u6559\u5e08\u6a21\u578b\u4e0a\u9650\u548c\u9ad8\u6210\u672c\u84b8\u998f\u6d41\u7a0b\uff0c\u5177\u6709\u9ad8\u6548\u975e\u81ea\u56de\u5f52\u8bed\u8a00\u751f\u6210\u6f5c\u529b\u3002"}, {"abstract": "Scientific agents contribute to hypothesis discovery by synthesizing evidence, assessing proposals, and developing new explanations. Recent systems combine scientific agents with evolutionary search through critique, comparison, and revision. However, how different forms of agent collaboration affect hypothesis quality remains an open question. Answering this question requires separating the effects of agents\u0027 scientific capabilities from those of their collaboration. A framework must therefore preserve agents\u0027 scientific roles and support rules for combining, revising, and retaining hypotheses. Building on this view, we introduce HypoEvolve, which makes collaboration explicit through successive updates to a hypothesis population. Specifically, we propose a generational genetic algorithm to coordinate specialized large language model (LLM) agents that integrate mechanistic arguments, reconsider assumptions, and assess evidence and testability. Each generation specifies how scientific judgments and new proposals reshape the population, making collaboration effects on hypothesis quality directly testable. Moreover, we design our evaluation around scientifically meaningful hypotheses that explain how a proposed intervention could work. Drug repurposing links these explanations to target-level biological claims assessed against external evidence. Specifically, we adapt DepMap and Open Targets into complementary external measures grounded in experimental, genetic, and clinical evidence. Across 34 cancer types, HypoEvolve achieves the highest scores against six baselines on both measures. DepMap selectivity reaches 0.171, versus 0.115 for the strongest baseline. Gains over single-pass generation also generalize to held-out cancer types. HypoEvolve advances a vision of autonomous science in which AI research teams achieve a capacity for discovery beyond that of individual models.", "arxiv_id": "2609.15938", "arxiv_url": "https://arxiv.org/abs/2609.15938", "authors": ["Jieyuan Liu", "Mengzhou Hu", "Jefferson Chen", "JungHo Kong", "Pratibha Jagannatha", "Yiming Gao", "Dexter Pratt", "Hsin-Yuan Lee", "Zhiting Hu", "Trey Ideker", "Wei Wang", "Eric P. Xing", "Zhen Wang"], "brief": "\u8bba\u6587\u63d0\u51fa HypoEvolve\uff0c\u7528\u4ee3\u9645\u9057\u4f20\u7b97\u6cd5\u663e\u5f0f\u534f\u8c03\u591a\u7c7b\u4e13\u4e1a LLM \u79d1\u5b66\u667a\u80fd\u4f53\uff0c\u5bf9\u5047\u8bf4\u8fdb\u884c\u7ec4\u5408\u3001\u6279\u5224\u3001\u4fee\u8ba2\u4e0e\u4fdd\u7559\u3002\u5176\u4efb\u52a1\u805a\u7126\u836f\u7269\u518d\u5229\u7528\u573a\u666f\uff0c\u751f\u6210\u53ef\u89e3\u91ca\u5e72\u9884\u673a\u5236\u7684\u79d1\u5b66\u5047\u8bf4\uff0c\u5e76\u7528\u5916\u90e8\u751f\u7269\u533b\u5b66\u8bc1\u636e\u8bc4\u4f30\u3002", "categories": ["cs.CL", "cs.CE", "cs.MA", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15938", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u5047\u8bf4\u89c6\u4e3a\u79cd\u7fa4\uff0c\u901a\u8fc7\u6bcf\u4e00\u4ee3\u7684\u9009\u62e9\u3001\u53d8\u5f02\u3001\u91cd\u7ec4\u4e0e\u8bc4\u5ba1\u6765\u68c0\u9a8c\u4e0d\u540c\u667a\u80fd\u4f53\u534f\u4f5c\u5f62\u5f0f\u5bf9\u5047\u8bf4\u8d28\u91cf\u7684\u5f71\u54cd", "\u667a\u80fd\u4f53\u5206\u522b\u8d1f\u8d23\u6574\u5408\u673a\u5236\u8bba\u8bc1\u3001\u53cd\u601d\u5047\u8bbe\u3001\u8bc4\u4f30\u8bc1\u636e\u4e0e\u53ef\u6d4b\u8bd5\u6027\uff0c\u4fdd\u7559\u79d1\u5b66\u89d2\u8272\u540c\u65f6\u5206\u79bb\u534f\u4f5c\u6548\u5e94", "\u572834\u79cd\u764c\u75c7\u4e0a\u4f18\u4e8e6\u4e2a\u57fa\u7ebf\uff0cDepMap\u9009\u62e9\u6027\u5f97\u52060.171\uff0c\u9ad8\u4e8e\u6700\u5f3a\u57fa\u7ebf0.115\uff0c\u5e76\u80fd\u6cdb\u5316\u5230\u7559\u51fa\u764c\u79cd"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u9057\u4f20\u7b97\u6cd5", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15938", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HypoEvolve: Genetic Algorithms Enable Multi-Agent LLMs to Discover Scientific Hypotheses", "tldr": "\u9057\u4f20\u7b97\u6cd5\u534f\u8c03\u591a\u667a\u80fd\u4f53\u53d1\u73b0\u79d1\u5b66\u5047\u8bf4", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HypoEvolve\uff0c\u7528\u4ee3\u9645\u9057\u4f20\u7b97\u6cd5\u663e\u5f0f\u534f\u8c03\u591a\u7c7b\u4e13\u4e1a LLM \u79d1\u5b66\u667a\u80fd\u4f53\uff0c\u5bf9\u5047\u8bf4\u8fdb\u884c\u7ec4\u5408\u3001\u6279\u5224\u3001\u4fee\u8ba2\u4e0e\u4fdd\u7559\u3002\u5176\u4efb\u52a1\u805a\u7126\u836f\u7269\u518d\u5229\u7528\u573a\u666f\uff0c\u751f\u6210\u53ef\u89e3\u91ca\u5e72\u9884\u673a\u5236\u7684\u79d1\u5b66\u5047\u8bf4\uff0c\u5e76\u7528\u5916\u90e8\u751f\u7269\u533b\u5b66\u8bc1\u636e\u8bc4\u4f30\u3002", "why_notable": "\u5b83\u628a\u591a\u667a\u80fd\u4f53\u79d1\u5b66\u53d1\u73b0\u4ece\u4e00\u6b21\u6027\u751f\u6210\u63a8\u8fdb\u5230\u53ef\u5206\u6790\u7684\u8fdb\u5316\u5f0f\u534f\u4f5c\u6846\u67b6\uff0c\u5e76\u7528\u5b9e\u9a8c\u3001\u9057\u4f20\u548c\u4e34\u5e8a\u8bc1\u636e\u8fdb\u884c\u5916\u90e8\u9a8c\u8bc1\uff0c\u5c55\u793a\u4e86AI\u79d1\u7814\u56e2\u961f\u53ef\u80fd\u8d85\u8d8a\u5355\u6a21\u578b\u53d1\u73b0\u80fd\u529b\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "When a video model generates physically incorrect motion, did it fail to learn the correct motion, or did it learn it but fail to use it? We show the latter: the correct motion remains available inside the model and can still be made to control the generated video. We train on videos where red masses oscillate slowly and blue masses oscillate quickly, then test a red mass with fast observed motion. Even when the model generates slow motion in this conflicting case, a low-dimensional edit predicted from simple physical variables restores the correct fast motion. We call this ability causal writability. At fixed strength, we find a sharp depth boundary: the same edit changes the video before the boundary but not after it. This closure marks commitment for that write. The motion signal nevertheless remains, and a stronger downstream write can restore physical motion, while excessive gain overshoots. Early causal writability predicts which errors training later corrects: those errors are writable at more network depths than errors that persist. We reproduce both causal writability and its sharp closure in a pretrained 1.3B video model, supporting generality across model scale and training regime.", "arxiv_id": "2609.15980", "arxiv_url": "https://arxiv.org/abs/2609.15980", "authors": ["Xingyun Wang", "Haomin Zheng", "Man Yuan", "Leqian Yang", "Ziming Liu"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u56e0\u679c\u53ef\u5199\u6027\u201d\u6982\u5ff5\uff0c\u8bc1\u660e\u89c6\u9891\u6a21\u578b\u5373\u4f7f\u751f\u6210\u4e86\u7269\u7406\u9519\u8bef\u7684\u8fd0\u52a8\uff0c\u6b63\u786e\u8fd0\u52a8\u4fe1\u606f\u4ecd\u4fdd\u7559\u5728\u7f51\u7edc\u5185\u90e8\uff0c\u5e76\u53ef\u901a\u8fc7\u4f4e\u7ef4\u56e0\u679c\u7f16\u8f91\u91cd\u65b0\u63a7\u5236\u751f\u6210\u7ed3\u679c\u3002\u4f5c\u8005\u5728\u53d7\u63a7\u632f\u5b50\u6570\u636e\u548c1.3B\u9884\u8bad\u7ec3\u89c6\u9891\u6a21\u578b\u4e2d\u590d\u73b0\u4e86\u8fd9\u4e00\u73b0\u8c61\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15980", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728\u7ea2\u6162\u84dd\u5feb\u7684\u632f\u5b50\u8bad\u7ec3\u8bbe\u5b9a\u4e2d\uff0c\u6a21\u578b\u9047\u5230\u989c\u8272\u4e0e\u89c2\u6d4b\u8fd0\u52a8\u51b2\u7a81\u65f6\u4f1a\u751f\u6210\u9519\u8bef\u6162\u8fd0\u52a8\uff0c\u4f46\u7531\u7b80\u5355\u7269\u7406\u53d8\u91cf\u9884\u6d4b\u7684\u4f4e\u7ef4\u7f16\u8f91\u53ef\u6062\u590d\u6b63\u786e\u5feb\u8fd0\u52a8\u3002", "\u53d1\u73b0\u56fa\u5b9a\u7f16\u8f91\u5f3a\u5ea6\u4e0b\u5b58\u5728\u6e05\u6670\u7684\u7f51\u7edc\u6df1\u5ea6\u8fb9\u754c\uff1a\u8fb9\u754c\u524d\u5199\u5165\u80fd\u6539\u53d8\u89c6\u9891\uff0c\u8fb9\u754c\u540e\u5931\u6548\uff0c\u4ee3\u8868\u6a21\u578b\u5bf9\u8be5\u56e0\u679c\u5199\u5165\u7684\u201c\u627f\u8bfa\u201d\u5173\u95ed\u3002", "\u65e9\u671f\u8bad\u7ec3\u9636\u6bb5\u7684\u56e0\u679c\u53ef\u5199\u6027\u53ef\u9884\u6d4b\u54ea\u4e9b\u9519\u8bef\u4f1a\u5728\u540e\u7eed\u8bad\u7ec3\u4e2d\u88ab\u4fee\u6b63\uff1b\u53ef\u5199\u6df1\u5ea6\u66f4\u591a\u7684\u9519\u8bef\u66f4\u53ef\u80fd\u88ab\u8bad\u7ec3\u7ea0\u6b63\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u53ef\u89e3\u91ca\u6027", "\u56e0\u679c\u5e72\u9884", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15980", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "A Chosen Future Can Still Be Rewritten: Causal Writability in Video Models", "tldr": "\u89c6\u9891\u6a21\u578b\u9519\u8bef\u8fd0\u52a8\u53ef\u88ab\u5185\u90e8\u56e0\u679c\u7f16\u8f91\u6539\u5199", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u201c\u56e0\u679c\u53ef\u5199\u6027\u201d\u6982\u5ff5\uff0c\u8bc1\u660e\u89c6\u9891\u6a21\u578b\u5373\u4f7f\u751f\u6210\u4e86\u7269\u7406\u9519\u8bef\u7684\u8fd0\u52a8\uff0c\u6b63\u786e\u8fd0\u52a8\u4fe1\u606f\u4ecd\u4fdd\u7559\u5728\u7f51\u7edc\u5185\u90e8\uff0c\u5e76\u53ef\u901a\u8fc7\u4f4e\u7ef4\u56e0\u679c\u7f16\u8f91\u91cd\u65b0\u63a7\u5236\u751f\u6210\u7ed3\u679c\u3002\u4f5c\u8005\u5728\u53d7\u63a7\u632f\u5b50\u6570\u636e\u548c1.3B\u9884\u8bad\u7ec3\u89c6\u9891\u6a21\u578b\u4e2d\u590d\u73b0\u4e86\u8fd9\u4e00\u73b0\u8c61\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3a\u7406\u89e3\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u7269\u7406\u9519\u8bef\u63d0\u4f9b\u4e86\u65b0\u89c6\u89d2\uff1a\u9519\u8bef\u4e0d\u4e00\u5b9a\u6e90\u4e8e\u672a\u5b66\u4e60\uff0c\u800c\u53ef\u80fd\u662f\u672a\u6b63\u786e\u8c03\u7528\u5185\u90e8\u77e5\u8bc6\u3002\u56e0\u679c\u53ef\u5199\u6027\u4e3a\u6a21\u578b\u53ef\u89e3\u91ca\u6027\u3001\u53ef\u63a7\u751f\u6210\u548c\u8bad\u7ec3\u8bca\u65ad\u63d0\u4f9b\u4e86\u5b9e\u7528\u5de5\u5177\uff0c\u5e76\u5728\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u6a21\u578b\u4e0a\u663e\u793a\u51fa\u4e00\u5b9a\u666e\u9002\u6027\u3002"}, {"abstract": "Chain-of-thought (CoT) monitoring is a safety strategy where the reasoning of a large language model \"actor\" is inspected by a \"monitor\" (often another language model) for signs of unsafe planning, deception, or misalignment. We find that planting harmful but benign-sounding reasoning in the actor\u0027s context can steer it to perform adversarial actions while evading monitors, an attack we term \"plan injection\". We initially discover this attack in the multiple-choice question-answering monitorability setting proposed by Lanham et al. (2023), using the investigator-agent elicitation framework of Li et al. (2025). We generalize the attack and show that the discovered behavior scales to harder tasks (achieving 25-33% monitor evasion rates across different monitorability benchmarks) and larger models such as DeepSeek-R1. Across the settings we study, actor models not only follow injected plans but also paraphrase them as their own reasoning, without explicit attribution to the injections. Finally, we find cases where extra monitor resources cause harm - giving the monitor access to the injected plan drops detection by as much as 50% in the Bio-Math task and in a case study on monitor reasoning budget, we find transcripts where additional thinking tokens are spent rationalizing the injected plan rather than flagging it.", "arxiv_id": "2609.15989", "arxiv_url": "https://arxiv.org/abs/2609.15989", "authors": ["Keertana Chidambaram", "Andrew Ilyas", "Vasilis Syrgkanis"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u7cfb\u7edf\u7814\u7a76\u4e86\u201cplan injection\u201d\u653b\u51fb\uff1a\u5728\u6a21\u578b\u4e0a\u4e0b\u6587\u4e2d\u690d\u5165\u542c\u4f3c\u65e0\u5bb3\u4f46\u5b9e\u9645\u6709\u5bb3\u7684\u8ba1\u5212\uff0c\u5f15\u5bfc\u6f14\u5458\u6a21\u578b\u6267\u884c\u5bf9\u6297\u884c\u4e3a\uff0c\u540c\u65f6\u8ba9\u76d1\u63a7\u6a21\u578b\u96be\u4ee5\u4ece\u601d\u7ef4\u94fe\u4e2d\u53d1\u73b0\u5f02\u5e38\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15989", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8be5\u653b\u51fb\u6700\u521d\u5728\u591a\u9009\u95ee\u7b54\u53ef\u76d1\u63a7\u6027\u8bbe\u7f6e\u4e2d\u53d1\u73b0\uff0c\u5e76\u8fdb\u4e00\u6b65\u63a8\u5e7f\u5230\u66f4\u96be\u7684\u76d1\u63a7\u57fa\u51c6\u3002", "\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u5b9e\u73b0\u7ea625%\u523033%\u7684\u76d1\u63a7\u9003\u9038\u7387\uff0c\u5e76\u53ef\u6269\u5c55\u5230DeepSeek-R1\u7b49\u66f4\u5927\u6a21\u578b\u3002", "\u6f14\u5458\u6a21\u578b\u4f1a\u628a\u6ce8\u5165\u8ba1\u5212\u6539\u5199\u6210\u81ea\u5df1\u7684\u63a8\u7406\uff1b\u6709\u65f6\u7ed9\u76d1\u63a7\u5668\u66f4\u591a\u4fe1\u606f\u6216\u63a8\u7406\u9884\u7b97\u53cd\u800c\u964d\u4f4e\u68c0\u6d4b\u7387\u3002"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u601d\u7ef4\u94fe", "\u5bf9\u6297\u653b\u51fb", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15989", "published_at": "2026-09-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Corrupt Plans, Clean Traces: Evading Chain-of-Thought Monitoring with Plan Injection", "tldr": "\u8ba1\u5212\u6ce8\u5165\u53ef\u7ed5\u8fc7\u601d\u7ef4\u94fe\u5b89\u5168\u76d1\u63a7", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u7cfb\u7edf\u7814\u7a76\u4e86\u201cplan injection\u201d\u653b\u51fb\uff1a\u5728\u6a21\u578b\u4e0a\u4e0b\u6587\u4e2d\u690d\u5165\u542c\u4f3c\u65e0\u5bb3\u4f46\u5b9e\u9645\u6709\u5bb3\u7684\u8ba1\u5212\uff0c\u5f15\u5bfc\u6f14\u5458\u6a21\u578b\u6267\u884c\u5bf9\u6297\u884c\u4e3a\uff0c\u540c\u65f6\u8ba9\u76d1\u63a7\u6a21\u578b\u96be\u4ee5\u4ece\u601d\u7ef4\u94fe\u4e2d\u53d1\u73b0\u5f02\u5e38\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u4f9d\u8d56CoT\u76d1\u63a7\u7684\u5b89\u5168\u65b9\u6848\u5b58\u5728\u5173\u952e\u8106\u5f31\u6027\uff1a\u6a21\u578b\u4e0d\u4ec5\u4f1a\u670d\u4ece\u5916\u90e8\u6ce8\u5165\u7684\u6709\u5bb3\u8ba1\u5212\uff0c\u8fd8\u53ef\u80fd\u751f\u6210\u770b\u4f3c\u5e72\u51c0\u7684\u63a8\u7406\u8f68\u8ff9\uff0c\u4ece\u800c\u524a\u5f31\u57fa\u4e8e\u63a8\u7406\u5ba1\u67e5\u7684\u5bf9\u9f50\u4e0e\u76d1\u7ba1\u65b9\u6cd5\u3002"}, {"abstract": "Prompt-injection detectors are typically evaluated using aggregate F1 on in-distribution test data, which offers limited insight into behavior under distribution shift, particularly on the benign side of the decision boundary, where false positives impose direct operational cost yet are seldom measured. We present PIDS-Bench, a frozen multi-axis benchmark that jointly evaluates attack detection and benign false-positive behavior at fixed thresholds, spanning in-distribution inputs, hard-benign prompts that mimic injection structure without malicious intent, obfuscated attacks, and domain and structural distribution shifts. We evaluate seven detectors (learned baselines, external prompt-injection classifiers, and broad-safety comparators) alongside a rule-based lower-bound reference. Multi-axis evaluation exposes a failure mode that aggregate F1 conceals. A detector exceeding F1 = 0.98 on the held-out split still misclassifies roughly one-third of an externally-sourced benign subset drawn from public corpora and restricted to security-adjacent content. Across a full threshold sweep and five training seeds, no internal detector reaches an operating point satisfying F1 \u003e= 0.95 and hard-benign FPR \u003c= 0.10 together on this stress distribution. Decomposing by provenance, we find that hard-negative augmentation nearly eliminates over-defense on curated stress inputs but leaves it substantially intact on externally-sourced prompts, a pattern we term provenance-sensitive over-defense. The asymmetry holds across both fine-tuned architectures and does not diminish as the augmentation pool grows, with the externally-sourced FPR remaining far above the 0.10 target. Whether augmentation matched to the externally-sourced distribution would close this gap is untested; threshold calibration and curated-style augmentation alone do not.", "arxiv_id": "2609.15017", "arxiv_url": "https://arxiv.org/abs/2609.15017", "authors": ["Yusuf Khalid Shire", "Sang-Chul Kim"], "brief": "\u8bba\u6587\u63d0\u51fa PIDS-Bench\uff0c\u4e00\u4e2a\u51bb\u7ed3\u7684\u591a\u8f74\u63d0\u793a\u6ce8\u5165\u68c0\u6d4b\u57fa\u51c6\uff0c\u8bc4\u4f30\u68c0\u6d4b\u5668\u5728\u6b63\u5e38\u6837\u672c\u8bef\u62a5\u3001\u6df7\u6dc6\u653b\u51fb\u3001\u9886\u57df\u4e0e\u7ed3\u6784\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u8868\u73b0\u3002\u4f5c\u8005\u6d4b\u8bd5\u4e86\u4e03\u7c7b\u68c0\u6d4b\u5668\uff0c\u53d1\u73b0\u4f20\u7edf\u805a\u5408 F1 \u4f1a\u63a9\u76d6\u4e25\u91cd\u7684\u826f\u6027\u8bef\u5224\u95ee\u9898\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15017", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u57fa\u51c6\u8986\u76d6\u5206\u5e03\u5185\u6837\u672c\u3001\u7c7b\u4f3c\u6ce8\u5165\u7ed3\u6784\u4f46\u65e0\u6076\u610f\u7684 hard-benign \u63d0\u793a\u3001\u6df7\u6dc6\u653b\u51fb\uff0c\u4ee5\u53ca\u9886\u57df/\u7ed3\u6784\u5206\u5e03\u504f\u79fb\u3002", "\u67d0\u68c0\u6d4b\u5668\u5728 held-out \u6570\u636e\u4e0a F1 \u8d85\u8fc7 0.98\uff0c\u4f46\u5728\u5916\u90e8\u6765\u6e90\u7684\u5b89\u5168\u76f8\u5173\u826f\u6027\u5b50\u96c6\u4e0a\u8bef\u5224\u7ea6\u4e09\u5206\u4e4b\u4e00\u3002", "\u786c\u8d1f\u6837\u672c\u589e\u5f3a\u80fd\u7f13\u89e3\u7cbe\u5fc3\u6784\u9020\u6837\u672c\u4e0a\u7684\u8fc7\u5ea6\u9632\u5fa1\uff0c\u4f46\u65e0\u6cd5\u89e3\u51b3\u5916\u90e8\u6765\u6e90\u63d0\u793a\u4e0a\u7684\u9ad8\u8bef\u62a5\uff0c\u5f62\u6210\u201c\u6765\u6e90\u654f\u611f\u8fc7\u5ea6\u9632\u5fa1\u201d\u3002"], "keywords": ["\u63d0\u793a\u6ce8\u5165", "\u6a21\u578b\u5b89\u5168", "\u57fa\u51c6\u8bc4\u6d4b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15017", "published_at": "2026-09-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PIDS-Bench: Evaluating Prompt-Injection Detectors Under Over-Defense, Obfuscation, and Distribution Shift", "tldr": "PIDS-Bench\u63ed\u793a\u6ce8\u5165\u68c0\u6d4b\u5668\u8fc7\u5ea6\u9632\u5fa1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PIDS-Bench\uff0c\u4e00\u4e2a\u51bb\u7ed3\u7684\u591a\u8f74\u63d0\u793a\u6ce8\u5165\u68c0\u6d4b\u57fa\u51c6\uff0c\u8bc4\u4f30\u68c0\u6d4b\u5668\u5728\u6b63\u5e38\u6837\u672c\u8bef\u62a5\u3001\u6df7\u6dc6\u653b\u51fb\u3001\u9886\u57df\u4e0e\u7ed3\u6784\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u8868\u73b0\u3002\u4f5c\u8005\u6d4b\u8bd5\u4e86\u4e03\u7c7b\u68c0\u6d4b\u5668\uff0c\u53d1\u73b0\u4f20\u7edf\u805a\u5408 F1 \u4f1a\u63a9\u76d6\u4e25\u91cd\u7684\u826f\u6027\u8bef\u5224\u95ee\u9898\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\u4ec5\u7528\u5206\u5e03\u5185 F1 \u8bc4\u4f30\u63d0\u793a\u6ce8\u5165\u68c0\u6d4b\u5668\u4f1a\u9ad8\u4f30\u5b9e\u9645\u53ef\u7528\u6027\uff0c\u5c24\u5176\u5ffd\u89c6\u826f\u6027\u8bef\u62a5\u5e26\u6765\u7684\u8fd0\u8425\u6210\u672c\uff1bPIDS-Bench \u4e3a LLM \u5e94\u7528\u548c\u667a\u80fd\u4f53\u5b89\u5168\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u771f\u5b9e\u90e8\u7f72\u7684\u8bc4\u6d4b\u6846\u67b6\u3002"}, {"abstract": "User prompts provided to large language models (LLMs) may contain sensitive or private information that can be misused by remotely deployed models, such as through inadvertent memorization during retraining. One way to protect user prompts is to execute the LLM inside a trusted execution environment (TEE), with the guarantee that the service provider has no access to computations performed within or information exchanged with the TEE. However, current TEEs are primarily CPU-based and significantly slower than GPUs optimized for LLM inference. To circumvent this, Tramer and Boneh (2019) proposed Slalom, which splits neural network inference between a TEE and an untrusted GPU and encrypts intermediate inputs sent to the GPU. We extend this split-inference architecture to LLM inference and instead protect intermediate inputs using differential privacy. We show that masking intermediate representations is necessary by showing that a prompt-reconstruction attack can recover prompts from these representations with nearly 80% accuracy. Our main contribution is a global sensitivity analysis of key LLM functions, which bounds the required scale of differentially private noise. Unlike encryption, differential privacy avoids quantization, allowing the LLM to remain in the floating-point domain. We also derive an upper bound on floating-point error from masking and noise cancellation in the TEE as a function of the privacy parameter epsilon. We implement our architecture using Intel TDX and evaluate it with two LLMs: Llama-3.2-3B and Qwen3-4B. Our split execution is nearly twice as fast as fully CPU-based inference inside TDX and 5-15 seconds faster than encryption-based Slalom while achieving higher accuracy. Finally, we demonstrate that prompt reconstruction, even with knowledge of the differential privacy mechanism, cannot recover more information than is contained in an unrelated prompt.", "arxiv_id": "2609.15039", "arxiv_url": "https://arxiv.org/abs/2609.15039", "authors": ["Shashie Dilhara Batan Arachchige", "Robin Carpentier", "Hassan Jameel Asghar
