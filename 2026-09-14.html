<script>
const PAPERS = [{"abstract": "Mobile GUI agents are shifting from multi-module frameworks to native models trained end-to-end, yet industrial deployment faces three persistent gaps. Sandbox training produces a distribution mismatch with production environments; expensive real-device failures remain underutilized; and fixed benchmarks saturate, losing the power to guide iteration. We present BlueLM-GUI, a 35B-A3B mobile GUI agent built as a real-device-centric flywheel that closes these gaps through three principles. Every Sample Matters: a dual-track pipeline with Heterogeneous Triple-System Consensus evaluation and an Error Correction \\\u0026 Derivation Module salvages every trajectory into usable supervision. Every Rollout Is Real: a three-stage recipe---continual pre-training, supervised fine-tuning, and agentic reinforcement learning on hundreds of real phones---grounds every rollout in real production environments, so the capability the model learns transfers directly to deployment. Every Query Evolves: a quota-driven benchmark methodology with three orthogonal axes enables precise attribution and allows the benchmark to be systematically upgraded as the model improves. BlueLM-GUI achieves 87.4 on MobileGUI-VBench, surpassing the best closed-source model by 5.1 points, and 84.9 on AndroidWorld, the best result among open-source models and competitive with closed-source models. These results demonstrate that grounding model training and iterative improvement in both real devices and the three Every principles yields strong, robust, and transferable mobile GUI capability.", "arxiv_id": "2609.12394", "arxiv_url": "https://arxiv.org/abs/2609.12394", "authors": ["Tong Ye", "Kunyang Han", "Guozhi Wang", "Longqiang Luo", "Zhifeng Ding", "Yongxiang Zhang", "Xiaolei Shen", "Yuxuan Zhang", "Zhuping Zhang", "Tao Xu", "Yue Pan", "Yucheng Zhao", "Yupei Hu", "Yuanjiang Ouyang", "Danfeng Shen", "Runqi Lin", "Hongda Cai", "Zhaoxiong Wang", "Mengjia Yan", "Yingjie Zhong", "Chen Zhou", "Zeyu Zhang", "Xuwen Zhu", "Penggang Shi", "Mingcheng Luo", "Ziyang Wu", "Min Jin", "Mingfu Shen", "Zairong Xu", "Fan Zhang", "Hao Wang", "Liang Liu", "Zhulin Xie", "Lijun Yao", "Xiao Liang", "Liangmin Wen", "Liqiang Feng", "Feilong Wu", "Min Hu", "Min Chen", "Guanjing Xiong", "Xiaohu Ruan", "Xiaoxin Chen"], "brief": "\u63d0\u51fa BlueLM-GUI\uff0c\u4e00\u4e2a 35B-A3B \u79fb\u52a8 GUI \u667a\u80fd\u4f53\uff0c\u4ee5\u771f\u5b9e\u8bbe\u5907\u4e3a\u4e2d\u5fc3\u6784\u5efa\u81ea\u6211\u6539\u8fdb\u98de\u8f6e\u3002\u5b83\u5c06\u5931\u8d25\u8f68\u8ff9\u56de\u6536\u3001\u771f\u673a\u8bad\u7ec3\u4e0e\u52a8\u6001\u57fa\u51c6\u8fed\u4ee3\u7ed3\u5408\uff0c\u63d0\u5347\u7aef\u5230\u7aef\u79fb\u52a8\u64cd\u4f5c\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12394", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u201cEvery Sample Matters\u201d\uff1a\u901a\u8fc7\u5f02\u6784\u4e09\u7cfb\u7edf\u5171\u8bc6\u8bc4\u4f30\u4e0e\u9519\u8bef\u7ea0\u6b63/\u6d3e\u751f\u6a21\u5757\uff0c\u5c06\u5404\u7c7b\u8f68\u8ff9\u8f6c\u5316\u4e3a\u53ef\u7528\u76d1\u7763\u6570\u636e", "\u63d0\u51fa\u201cEvery Rollout Is Real\u201d\uff1a\u5728\u6570\u767e\u53f0\u771f\u5b9e\u624b\u673a\u4e0a\u8fdb\u884c\u6301\u7eed\u9884\u8bad\u7ec3\u3001\u76d1\u7763\u5fae\u8c03\u548c\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\uff0c\u7f13\u89e3\u6c99\u76d2\u5230\u751f\u4ea7\u73af\u5883\u7684\u5206\u5e03\u504f\u79fb", "\u63d0\u51fa\u201cEvery Query Evolves\u201d\uff1a\u7528\u914d\u989d\u9a71\u52a8\u3001\u4e09\u8f74\u6b63\u4ea4\u7684\u57fa\u51c6\u65b9\u6cd5\u6301\u7eed\u5347\u7ea7\u8bc4\u6d4b\uff0c\u5e76\u5728 MobileGUI-VBench \u5f97\u5206 87.4\u3001AndroidWorld \u5f97\u5206 84.9"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u81ea\u52a8\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u79fb\u52a8\u7aef"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12394", "published_at": "2026-09-14", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BlueLM-GUI Technical Report: A Real-Device-Centric Flywheel for Self-Improving Mobile GUI Agents", "tldr": "\u771f\u673a\u98de\u8f6e\u8bad\u7ec3\u6253\u9020\u9ad8\u6027\u80fd\u624b\u673aGUI\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "\u63d0\u51fa BlueLM-GUI\uff0c\u4e00\u4e2a 35B-A3B \u79fb\u52a8 GUI \u667a\u80fd\u4f53\uff0c\u4ee5\u771f\u5b9e\u8bbe\u5907\u4e3a\u4e2d\u5fc3\u6784\u5efa\u81ea\u6211\u6539\u8fdb\u98de\u8f6e\u3002\u5b83\u5c06\u5931\u8d25\u8f68\u8ff9\u56de\u6536\u3001\u771f\u673a\u8bad\u7ec3\u4e0e\u52a8\u6001\u57fa\u51c6\u8fed\u4ee3\u7ed3\u5408\uff0c\u63d0\u5347\u7aef\u5230\u7aef\u79fb\u52a8\u64cd\u4f5c\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u5de5\u4e1a\u7ea7\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u90e8\u7f72\uff0c\u6838\u5fc3\u4ef7\u503c\u5728\u4e8e\u628a\u771f\u5b9e\u8bbe\u5907\u4ea4\u4e92\u3001\u5931\u8d25\u6837\u672c\u5229\u7528\u548c\u8bc4\u6d4b\u6f14\u5316\u6253\u901a\uff0c\u5f62\u6210\u53ef\u6301\u7eed\u81ea\u6211\u6539\u8fdb\u95ed\u73af\uff1b\u5176\u7ed3\u679c\u663e\u793a\u5f00\u6e90\u6a21\u578b\u5df2\u5728\u90e8\u5206\u79fb\u52a8 GUI \u57fa\u51c6\u4e0a\u63a5\u8fd1\u6216\u8d85\u8fc7\u95ed\u6e90\u7cfb\u7edf\u3002"}, {"abstract": "Graphical User Interface (GUI) grounding is essential for autonomous agents to map natural language instructions to precise screen coordinates. However, existing supervised fine-tuning and reinforcement learning methods are constrained by the high cost of annotation, creating a scalability bottleneck. In this paper, we introduce a label-free test-time training paradigm driven by two key insights: (1) confidence patterns in coordinate tokens are a better indicator than full-sequence confidence, and (2) in sparse GUI coordinate spaces, negative samples offer more reliable learning signals than potentially noisy positive ones. We first propose Confidence-Anchored Learning (CAL), which utilizes coordinate-token confidence to filter pseudo-labels and assign distance-based binary rewards. Building on this, we develop Confidence-Anchored Negative Learning (CANL), which exclusively optimizes the model using negative samples to bypass the risks of incorrect positive samples. Experimental results demonstrate that CANL-7B achieves 92.1% on ScreenSpot-V2. On more challenging ScreenSpot-Pro, CANL-7B reaches 33.8%, an 8.9% absolute improvement over the base model. Our findings establish coordinate-token confidence as a powerful alternative to manual annotations for scalable GUI agent development.", "arxiv_id": "2609.15307", "arxiv_url": "https://arxiv.org/abs/2609.15307", "authors": ["Yizhou Liu", "Fei Tang", "Yuchen Yan", "Zhengxi Lu", "Songqin Nong", "Tao Jiang", "Wenhao Xu", "Wenqi Zhang", "Weiming Lu", "Jun Xiao", "Yongliang Shen"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411GUI grounding\u7684\u65e0\u6807\u7b7e\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u8303\u5f0f\uff0c\u901a\u8fc7\u5750\u6807token\u7f6e\u4fe1\u5ea6\u7b5b\u9009\u4f2a\u6807\u7b7e\u5e76\u8fdb\u884c\u5b66\u4e60\u3002\u8fdb\u4e00\u6b65\u63d0\u51faCANL\uff0c\u4ec5\u5229\u7528\u66f4\u53ef\u9760\u7684\u8d1f\u6837\u672c\u4f18\u5316\u6a21\u578b\uff0c\u907f\u514d\u9519\u8bef\u6b63\u6837\u672c\u5e26\u6765\u7684\u566a\u58f0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15307", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u5750\u6807token\u7f6e\u4fe1\u5ea6\u6bd4\u6574\u53e5\u7f6e\u4fe1\u5ea6\u66f4\u80fd\u53cd\u6620GUI\u5750\u6807\u9884\u6d4b\u53ef\u9760\u6027", "\u63d0\u51faCAL\uff1a\u57fa\u4e8e\u5750\u6807\u7f6e\u4fe1\u5ea6\u8fc7\u6ee4\u4f2a\u6807\u7b7e\uff0c\u5e76\u7528\u8ddd\u79bb\u76f8\u5173\u7684\u4e8c\u503c\u5956\u52b1\u8fdb\u884c\u8bad\u7ec3", "\u63d0\u51faCANL\uff1a\u53ea\u4f7f\u7528\u8d1f\u6837\u672c\u5b66\u4e60\uff0c\u5728\u7a00\u758fGUI\u5750\u6807\u7a7a\u95f4\u4e2d\u83b7\u5f97\u66f4\u7a33\u5065\u7684\u6d4b\u8bd5\u65f6\u9002\u5e94"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u5b9a\u4f4d", "\u6d4b\u8bd5\u65f6\u81ea\u9002\u5e94", "\u7f6e\u4fe1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15307", "published_at": "2026-09-14", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Learning from Reliable Negatives: Confidence-Anchored Test-Time Adaptation for GUI Grounding", "tldr": "\u7528\u53ef\u9760\u8d1f\u6837\u672c\u5b9e\u73b0\u65e0\u6807\u6ce8GUI\u5b9a\u4f4d\u81ea\u9002\u5e94", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411GUI grounding\u7684\u65e0\u6807\u7b7e\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u8303\u5f0f\uff0c\u901a\u8fc7\u5750\u6807token\u7f6e\u4fe1\u5ea6\u7b5b\u9009\u4f2a\u6807\u7b7e\u5e76\u8fdb\u884c\u5b66\u4e60\u3002\u8fdb\u4e00\u6b65\u63d0\u51faCANL\uff0c\u4ec5\u5229\u7528\u66f4\u53ef\u9760\u7684\u8d1f\u6837\u672c\u4f18\u5316\u6a21\u578b\uff0c\u907f\u514d\u9519\u8bef\u6b63\u6837\u672c\u5e26\u6765\u7684\u566a\u58f0\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u51cf\u5c11\u5bf9\u6602\u8d35\u4eba\u5de5\u6807\u6ce8\u548c\u5f3a\u5316\u5b66\u4e60\u53cd\u9988\u7684\u4f9d\u8d56\uff0c\u4e3a\u53ef\u6269\u5c55GUI\u667a\u80fd\u4f53\u8bad\u7ec3\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\uff1bCANL-7B\u5728ScreenSpot-V2\u8fbe\u523092.1%\uff0c\u5728\u66f4\u96be\u7684ScreenSpot-Pro\u4e0a\u8f83\u57fa\u5ea7\u6a21\u578b\u63d0\u53478.9\u4e2a\u767e\u5206\u70b9\u3002"}, {"abstract": "Large language models have advanced automated algorithm discovery by synthesizing executable code, but existing frameworks trap them in rigid search pipelines with pre-defined control flows. This limitation restricts adaptive reasoning, blocks cross-paradigm transfer, and discards valuable execution feedback. We propose AlgoEvo, a unified agentic framework that transforms automated algorithm discovery into an interactive, knowledge-accumulating process. An autonomous agent dynamically inspects, diagnoses, and edits code based on runtime feedback. A design skill hub decouples paradigm-specific knowledge from the core discovery engine, allowing a single workflow to seamlessly handle single-objective, multi-objective, and multi-component design. Meanwhile, a hierarchical experience mechanism organizes search trajectories into a task-level tree to guide exploration and consolidates cross-task patterns into reusable skills. Across six representative benchmark tasks, AlgoEvo matches or surpasses specialized methods with substantially fewer evaluations and reduced token consumption, demonstrating strong intra-task accumulation, cross-task transfer, and the ability to reproduce or exceed existing state-of-the-art performance through flexible skill activation.", "arxiv_id": "2609.15820", "arxiv_url": "https://arxiv.org/abs/2609.15820", "authors": ["Junhao Qiu", "Qinglong Hu", "Xialiang Tong", "Mingxuan Yuan", "Liyong Lin", "Qingfu Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa AlgoEvo\uff0c\u5c06\u81ea\u52a8\u7b97\u6cd5\u53d1\u73b0\u5efa\u6a21\u4e3a\u4ea4\u4e92\u5f0f\u3001\u53ef\u79ef\u7d2f\u77e5\u8bc6\u7684\u667a\u80fd\u4f53\u641c\u7d22\u8fc7\u7a0b\u3002\u5b83\u8ba9 LLM \u667a\u80fd\u4f53\u6839\u636e\u8fd0\u884c\u53cd\u9988\u81ea\u4e3b\u68c0\u67e5\u3001\u8bca\u65ad\u548c\u4fee\u6539\u4ee3\u7801\uff0c\u5e76\u901a\u8fc7\u6280\u80fd\u5e93\u652f\u6301\u591a\u7c7b\u7b97\u6cd5\u8bbe\u8ba1\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15820", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u52a8\u6001\u667a\u80fd\u4f53\u66ff\u4ee3\u56fa\u5b9a\u641c\u7d22\u6d41\u6c34\u7ebf\uff0c\u53ef\u57fa\u4e8e\u6267\u884c\u53cd\u9988\u81ea\u9002\u5e94\u8c03\u6574\u63a2\u7d22\u65b9\u5411", "\u8bbe\u8ba1\u6280\u80fd\u67a2\u7ebd\u89e3\u8026\u4efb\u52a1\u8303\u5f0f\u77e5\u8bc6\uff0c\u7edf\u4e00\u5904\u7406\u5355\u76ee\u6807\u3001\u591a\u76ee\u6807\u548c\u591a\u7ec4\u4ef6\u8bbe\u8ba1", "\u5206\u5c42\u7ecf\u9a8c\u673a\u5236\u5c06\u641c\u7d22\u8f68\u8ff9\u7ec4\u7ec7\u4e3a\u4efb\u52a1\u6811\uff0c\u5e76\u6c89\u6dc0\u8de8\u4efb\u52a1\u53ef\u590d\u7528\u6280\u80fd"], "keywords": ["\u667a\u80fd\u4f53", "\u7b97\u6cd5\u53d1\u73b0", "\u4ee3\u7801\u751f\u6210", "\u81ea\u52a8\u5316\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15820", "published_at": "2026-09-14", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AlgoEvo: Self-Evolving Agentic Search for Automated Algorithm Discovery", "tldr": "\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u63d0\u5347\u81ea\u52a8\u7b97\u6cd5\u53d1\u73b0\u6548\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AlgoEvo\uff0c\u5c06\u81ea\u52a8\u7b97\u6cd5\u53d1\u73b0\u5efa\u6a21\u4e3a\u4ea4\u4e92\u5f0f\u3001\u53ef\u79ef\u7d2f\u77e5\u8bc6\u7684\u667a\u80fd\u4f53\u641c\u7d22\u8fc7\u7a0b\u3002\u5b83\u8ba9 LLM \u667a\u80fd\u4f53\u6839\u636e\u8fd0\u884c\u53cd\u9988\u81ea\u4e3b\u68c0\u67e5\u3001\u8bca\u65ad\u548c\u4fee\u6539\u4ee3\u7801\uff0c\u5e76\u901a\u8fc7\u6280\u80fd\u5e93\u652f\u6301\u591a\u7c7b\u7b97\u6cd5\u8bbe\u8ba1\u4efb\u52a1\u3002", "why_notable": "\u76f8\u6bd4\u4e13\u7528\u7b97\u6cd5\u53d1\u73b0\u65b9\u6cd5\uff0cAlgoEvo \u5728\u516d\u4e2a\u57fa\u51c6\u4efb\u52a1\u4e0a\u4ee5\u66f4\u5c11\u8bc4\u4f30\u6b21\u6570\u548c\u66f4\u4f4e token \u6d88\u8017\u8fbe\u5230\u6216\u8d85\u8fc7\u73b0\u6709\u6027\u80fd\uff0c\u5c55\u793a\u4e86\u667a\u80fd\u4f53\u5728\u7b97\u6cd5\u81ea\u52a8\u53d1\u73b0\u4e2d\u7684\u77e5\u8bc6\u79ef\u7d2f\u4e0e\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "Experimental TCAD calibration is essential for predictive technology modeling of emerging oxide semiconductor transistors. However, it remains time-consuming and expert dependent because of model ambiguity. Multiple physical models and parameter sets can reproduce the same measured transfer characteristics, while local fitting alone cannot uniquely identify the underlying device physics. We present the first demonstration of an agentic TCAD calibration workflow for a fabricated bottom-gate In--W--O (BG-IWO) transistor. Starting from the measured transfer curve and device information, the workflow uses measurement--TCAD residuals and local sensitivity tests to select bounded parameter corrections or evaluate additional physical models, and accept only updates that improve device metrics. The LLM agent orchestrates the workflow, while Sentaurus governs the device physics. For the 2\\%-W reference device, five agent-suggested updates yield a fixed calibrated model, reducing the multi-metric device objective $J$ by 14.3$\\times$. Maximum $V_{\\mathrm{th}}$/$I_{\\mathrm{on}}$ errors are 36.1~mV/0.022 decade for varying-drain-bias tests and 46.2~mV/0.062 decade for varying-channel-length tests, demonstrating model transferability across bias and geometry rather than a local parameter fit. W-composition tests provide process-sensitive insight. This agentic workflow provides a faster route to model development for emerging device technologies.", "arxiv_id": "2609.12184", "arxiv_url": "https://arxiv.org/abs/2609.12184", "authors": ["Gyujun Jeong", "Junmo Lee", "Sungwon Cho", "Woohyun Hwang", "Kwangyou Seo", "Suhwan Lim", "Wanki Kim", "Daewon Ha", "Rishi Ranade", "Kihang Youn", "Ram Cherukuri", "Yiyi Wang", "Asif Khan", "Shimeng Yu"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u9a8c\u8bc1\u4e86\u4e00\u4e2a\u9762\u5411\u6c27\u5316\u7269\u534a\u5bfc\u4f53\u6676\u4f53\u7ba1\u7684\u667a\u80fd\u4f53\u5f0fTCAD\u6821\u51c6\u6d41\u7a0b\u3002\u8be5\u6d41\u7a0b\u7531LLM\u667a\u80fd\u4f53\u7f16\u6392\u6821\u51c6\u51b3\u7b56\uff0cSentaurus\u8d1f\u8d23\u7269\u7406\u4eff\u771f\uff0c\u53ef\u4ece\u5b9e\u6d4b\u8f6c\u79fb\u66f2\u7ebf\u51fa\u53d1\u81ea\u52a8\u9009\u62e9\u53c2\u6570\u4fee\u6b63\u6216\u8bc4\u4f30\u989d\u5916\u7269\u7406\u6a21\u578b\u3002", "categories": ["physics.ins-det", "cs.AI", "cs.LG", "physics.app-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12184", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u5df2\u5236\u5907\u7684\u5e95\u6805In-W-O\u6676\u4f53\u7ba1\uff0c\u5229\u7528\u6d4b\u91cf-TCAD\u6b8b\u5dee\u548c\u5c40\u90e8\u7075\u654f\u5ea6\u6d4b\u8bd5\u6765\u7ea6\u675f\u53c2\u6570\u66f4\u65b0\u3002", "\u57282% W\u53c2\u8003\u5668\u4ef6\u4e0a\uff0c5\u6b21\u667a\u80fd\u4f53\u5efa\u8bae\u66f4\u65b0\u4f7f\u591a\u6307\u6807\u76ee\u6807\u51fd\u6570J\u964d\u4f4e14.3\u500d\u3002", "\u6821\u51c6\u6a21\u578b\u5728\u4e0d\u540c\u6f0f\u6781\u504f\u538b\u548c\u4e0d\u540c\u6c9f\u9053\u957f\u5ea6\u6d4b\u8bd5\u4e2d\u4fdd\u6301\u8f83\u4f4e\u8bef\u5dee\uff0c\u4f53\u73b0\u8de8\u504f\u7f6e\u4e0e\u51e0\u4f55\u6761\u4ef6\u7684\u53ef\u8fc1\u79fb\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u534a\u5bfc\u4f53\u5668\u4ef6", "\u7269\u7406\u4eff\u771f", "\u81ea\u52a8\u5316\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12184", "published_at": "2026-09-14", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Agentic TCAD Calibration Workflow for Oxide Semiconductor Transistors", "tldr": "LLM\u667a\u80fd\u4f53\u52a0\u901f\u6c27\u5316\u7269\u6676\u4f53\u7ba1TCAD\u6821\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u9a8c\u8bc1\u4e86\u4e00\u4e2a\u9762\u5411\u6c27\u5316\u7269\u534a\u5bfc\u4f53\u6676\u4f53\u7ba1\u7684\u667a\u80fd\u4f53\u5f0fTCAD\u6821\u51c6\u6d41\u7a0b\u3002\u8be5\u6d41\u7a0b\u7531LLM\u667a\u80fd\u4f53\u7f16\u6392\u6821\u51c6\u51b3\u7b56\uff0cSentaurus\u8d1f\u8d23\u7269\u7406\u4eff\u771f\uff0c\u53ef\u4ece\u5b9e\u6d4b\u8f6c\u79fb\u66f2\u7ebf\u51fa\u53d1\u81ea\u52a8\u9009\u62e9\u53c2\u6570\u4fee\u6b63\u6216\u8bc4\u4f30\u989d\u5916\u7269\u7406\u6a21\u578b\u3002", "why_notable": "\u8fd9\u662f\u5c06LLM\u667a\u80fd\u4f53\u7528\u4e8e\u5b9e\u9a8cTCAD\u6821\u51c6\u7684\u65e9\u671f\u793a\u8303\uff0c\u7f13\u89e3\u4e86\u65b0\u578b\u5668\u4ef6\u5efa\u6a21\u4e2d\u8017\u65f6\u3001\u4f9d\u8d56\u4e13\u5bb6\u4e14\u6a21\u578b\u4e0d\u552f\u4e00\u7684\u95ee\u9898\uff0c\u5bf9\u534a\u5bfc\u4f53\u5668\u4ef6\u7814\u53d1\u81ea\u52a8\u5316\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present Salesforce Koa, an enterprise language model built by post-training the open-weight Nemotron-3-Super-120B foundation model with reinforcement learning using Group Relative Policy Optimization (GRPO). Salesforce Koa is trained on public and synthetically generated data, with no customer data, to improve tool use and agentic capabilities while preserving strong general-purpose performance. Its distinctive component is a simulation-to-reward pipeline that expands workflow specifications into persona-conditioned multi-turn tasks with task-resolution rewards grounded in successful tool use for data-dependent requests. For enterprise domains, these specifications are written in Agent Script, Salesforce\u0027s declarative language for building Agentforce agents; for public tool-use domains, we synthesize the workflow structure directly. The same simulation and grounded-reward machinery drives GRPO across both. Across public tool-use, agentic-reasoning, and enterprise Customer Relationship Management (CRM) benchmarks, Salesforce Koa improves over its open-weight base, with the clearest gains on multi-turn tool use, and surpasses a strong proprietary baseline while remaining below the strongest frontier models. These results show that specification-driven reinforcement learning is a practical path to specializing open-weight foundation models for enterprise agentic tasks.", "arxiv_id": "2609.15066", "arxiv_url": "https://arxiv.org/abs/2609.15066", "authors": ["Zixiang Chen", "Sufeng Niu", "Yingchi Liu", "Wenting Zhao", "Akshara Prabhakar", "Shubham Mehrotra", "Bin Bi", "Zhujun Lan", "Katherine Tan", "Mohammad Ramezanali", "Tulika Manoj Awalgaonkar", "Monojit Banerjee", "Jielin Qiu", "Shiva Kumar Pentyala", "Zhepeng Cen", "Anupam Tripathi", "Ali Ziaei", "Regunathan Radhakrishnan", "Darvish Lee Shadravan", "Shelby Heinecke", "Sitaram Asur", "Silvio Savarese", "James Zhu", "Phil Mui", "Huan Wang"], "brief": "Salesforce Koa \u662f\u5728 Nemotron-3-Super-120B \u5f00\u653e\u6743\u91cd\u57fa\u5ea7\u4e0a\uff0c\u901a\u8fc7 GRPO \u540e\u8bad\u7ec3\u5f97\u5230\u7684\u4f01\u4e1a\u8bed\u8a00\u6a21\u578b\uff0c\u91cd\u70b9\u589e\u5f3a\u5de5\u5177\u4f7f\u7528\u4e0e\u591a\u8f6e\u667a\u80fd\u4f53\u80fd\u529b\u3002\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u201c\u4eff\u771f\u5230\u5956\u52b1\u201d\u6d41\u6c34\u7ebf\uff0c\u5c06\u5de5\u4f5c\u6d41\u89c4\u683c\u6269\u5c55\u4e3a\u5e26\u89d2\u8272\u8bbe\u5b9a\u7684\u591a\u8f6e\u4efb\u52a1\uff0c\u5e76\u7528\u771f\u5b9e\u5de5\u5177\u8c03\u7528\u6210\u529f\u4e0e\u5426\u6784\u9020\u5956\u52b1\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15066", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bad\u7ec3\u6570\u636e\u6765\u81ea\u516c\u5f00\u6570\u636e\u4e0e\u5408\u6210\u6570\u636e\uff0c\u4e0d\u4f7f\u7528\u5ba2\u6237\u6570\u636e\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u901a\u7528\u80fd\u529b\u3002", "\u6838\u5fc3\u673a\u5236\u662f\u57fa\u4e8e Agent Script \u6216\u5408\u6210\u5de5\u4f5c\u6d41\u7ed3\u6784\u751f\u6210\u4efb\u52a1\uff0c\u5e76\u7528\u6570\u636e\u4f9d\u8d56\u8bf7\u6c42\u4e2d\u7684\u5de5\u5177\u6210\u529f\u6267\u884c\u7ed3\u679c\u4f5c\u4e3a grounded reward\u3002", "\u5728\u516c\u5f00\u5de5\u5177\u4f7f\u7528\u3001\u667a\u80fd\u4f53\u63a8\u7406\u548c\u4f01\u4e1a CRM \u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u5f00\u653e\u57fa\u5ea7\u663e\u8457\u63d0\u5347\uff0c\u5c24\u5176\u5728\u591a\u8f6e\u5de5\u5177\u4f7f\u7528\u573a\u666f\u6536\u76ca\u6700\u660e\u663e\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u5f3a\u5316\u5b66\u4e60", "\u4f01\u4e1a\u5927\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15066", "published_at": "2026-09-14", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Salesforce Koa: An Enterprise Language Model for Agentic Tool Use", "tldr": "\u7528\u89c4\u683c\u9a71\u52a8RL\u8bad\u7ec3\u4f01\u4e1a\u5de5\u5177\u4f7f\u7528\u6a21\u578b", "upvotes": 0, "what_it_is": "Salesforce Koa \u662f\u5728 Nemotron-3-Super-120B \u5f00\u653e\u6743\u91cd\u57fa\u5ea7\u4e0a\uff0c\u901a\u8fc7 GRPO \u540e\u8bad\u7ec3\u5f97\u5230\u7684\u4f01\u4e1a\u8bed\u8a00\u6a21\u578b\uff0c\u91cd\u70b9\u589e\u5f3a\u5de5\u5177\u4f7f\u7528\u4e0e\u591a\u8f6e\u667a\u80fd\u4f53\u80fd\u529b\u3002\u8bba\u6587\u63d0\u51fa\u4e00\u5957\u201c\u4eff\u771f\u5230\u5956\u52b1\u201d\u6d41\u6c34\u7ebf\uff0c\u5c06\u5de5\u4f5c\u6d41\u89c4\u683c\u6269\u5c55\u4e3a\u5e26\u89d2\u8272\u8bbe\u5b9a\u7684\u591a\u8f6e\u4efb\u52a1\uff0c\u5e76\u7528\u771f\u5b9e\u5de5\u5177\u8c03\u7528\u6210\u529f\u4e0e\u5426\u6784\u9020\u5956\u52b1\u3002", "why_notable": "\u5c55\u793a\u4e86\u4f01\u4e1a\u53ef\u63a7\u573a\u666f\u4e0b\u7528\u5de5\u4f5c\u6d41\u89c4\u683c\u548c\u5f3a\u5316\u5b66\u4e60\u5b9a\u5236\u5f00\u653e\u6743\u91cd\u5927\u6a21\u578b\u7684\u53ef\u884c\u8def\u5f84\uff0c\u5bf9 CRM\u3001\u4f01\u4e1a\u667a\u80fd\u4f53\u548c\u5b89\u5168\u5408\u6210\u6570\u636e\u8bad\u7ec3\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The proliferation of highly capable open-weight Small Language Models (SLMs) democratizes access to advanced cybersecurity capabilities, posing a escalating risk as these models can bypass proprietary API guardrails when deployed locally. However, SLMs deployed as autonomous agents often struggle with long-horizon, exploratory tasks like cybersecurity Capture The Flag (CTF) challenges due to context bloat and cognitive degradation from accumulated tool-call outputs. To understand and mitigate this cybersecurity threat, we introduce context segmentation, a two-level agentic framework that divides complex exploitation tasks into manageable, contextually isolated sub-problems. Evaluating on the picoCTF dataset using memory-constrained gemma-4 models, we demonstrate that for the E4B model, our strategy acts as an intelligent search, achieving competitive rewards with superior token efficiency compared to brute-force retries, and successfully solving 18.52% of tasks that standard agentic execution fails to complete. Code is available at https://github.com/9xeb/context-segmentation.", "arxiv_id": "2609.12839", "arxiv_url": "https://arxiv.org/abs/2609.12839", "authors": ["Sebastiano Nordio", "Michele Lotto"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4e24\u7ea7\u667a\u80fd\u4f53\u6846\u67b6\u201c\u4e0a\u4e0b\u6587\u5206\u6bb5\u201d\uff0c\u5c06\u590d\u6742CTF\u653b\u9632\u4efb\u52a1\u62c6\u6210\u76f8\u4e92\u9694\u79bb\u7684\u5b50\u95ee\u9898\uff0c\u7f13\u89e3\u672c\u5730\u5c0f\u8bed\u8a00\u6a21\u578b\u5728\u957f\u7a0b\u63a2\u7d22\u4e2d\u7684\u4e0a\u4e0b\u6587\u81a8\u80c0\u4e0e\u6027\u80fd\u9000\u5316\u3002\u4f5c\u8005\u5728picoCTF\u4e0a\u7528\u53d7\u9650\u5185\u5b58\u7684gemma-4\u6a21\u578b\u9a8c\u8bc1\u4e86\u8be5\u65b9\u6cd5\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12839", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u9694\u79bb\u5b50\u4efb\u52a1\u4e0a\u4e0b\u6587\uff0c\u51cf\u5c11\u5de5\u5177\u8c03\u7528\u8f93\u51fa\u7d2f\u79ef\u5bfc\u81f4\u7684\u8ba4\u77e5\u9000\u5316\u4e0e\u65e0\u5173\u4fe1\u606f\u5e72\u6270", "\u5728E4B\u6a21\u578b\u4e0a\uff0c\u76f8\u6bd4\u66b4\u529b\u91cd\u8bd5\u53d6\u5f97\u66f4\u9ad8token\u6548\u7387\uff0c\u5e76\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5956\u52b1\u8868\u73b0", "\u6210\u529f\u89e3\u51b3\u4e8618.52%\u6807\u51c6\u667a\u80fd\u4f53\u6267\u884c\u65e0\u6cd5\u5b8c\u6210\u7684picoCTF\u4efb\u52a1"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u7edc\u5b89\u5168", "\u5c0f\u8bed\u8a00\u6a21\u578b", "\u4e0a\u4e0b\u6587\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12839", "published_at": "2026-09-14", "score": 0.375, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Evaluating Context Segmentation in Locally Deployable SLMs for Cybersecurity CTF Tasks", "tldr": "\u4e0a\u4e0b\u6587\u5206\u6bb5\u63d0\u5347\u672c\u5730SLM\u89e3CTF\u6548\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4e24\u7ea7\u667a\u80fd\u4f53\u6846\u67b6\u201c\u4e0a\u4e0b\u6587\u5206\u6bb5\u201d\uff0c\u5c06\u590d\u6742CTF\u653b\u9632\u4efb\u52a1\u62c6\u6210\u76f8\u4e92\u9694\u79bb\u7684\u5b50\u95ee\u9898\uff0c\u7f13\u89e3\u672c\u5730\u5c0f\u8bed\u8a00\u6a21\u578b\u5728\u957f\u7a0b\u63a2\u7d22\u4e2d\u7684\u4e0a\u4e0b\u6587\u81a8\u80c0\u4e0e\u6027\u80fd\u9000\u5316\u3002\u4f5c\u8005\u5728picoCTF\u4e0a\u7528\u53d7\u9650\u5185\u5b58\u7684gemma-4\u6a21\u578b\u9a8c\u8bc1\u4e86\u8be5\u65b9\u6cd5\u3002", "why_notable": "\u672c\u7814\u7a76\u540c\u65f6\u63ed\u793a\u5e76\u7f13\u89e3\u4e86\u672c\u5730\u53ef\u90e8\u7f72\u5f00\u6743\u91cdSLM\u5728\u7f51\u7edc\u5b89\u5168\u4efb\u52a1\u4e2d\u7684\u80fd\u529b\u8fb9\u754c\uff1a\u5728\u7ed5\u8fc7\u4e91\u7aefAPI\u62a4\u680f\u7684\u672c\u5730\u73af\u5883\u4e0b\uff0c\u66f4\u9ad8\u6548\u7684\u957f\u7a0bCTF\u6267\u884c\u6846\u67b6\u53ef\u80fd\u663e\u8457\u653e\u5927\u81ea\u52a8\u5316\u653b\u9632\u80fd\u529b\uff0c\u56e0\u6b64\u5177\u6709\u5b89\u5168\u8bc4\u4f30\u548c\u9632\u5fa1\u7814\u7a76\u4ef7\u503c\u3002"}, {"abstract": "Unlearning benchmarks such as TOFU and MUSE certify forgetting by reading the model\u0027s final answer, where a model that refuses to answer already counts as having forgotten. We show that this model-level certificate does not transfer once the model is deployed as an agent. We introduce K-Bench, a benchmark that scores LLM unlearning under agentic deployment. K-Bench inspects all six channels a ReAct agent exposes, including its chain-of-thought (CoT), tool calls and tool observations, and elicited summary. A query counts as leaked if the secret appears in any of them. Each experiment places the secret in exactly one of the agent\u0027s three sources (the weights, the prompt, or the retrieval store). The K-Score is computed separately for each source and credits forgetting only when the agent remains usable. Clearing the answer channel does not make the secret unrecoverable. On structured retrieval, the secret stays verbatim in the tool-observation channel and the aggregate leak rate is unchanged. When the secret lives in the prompt or the retrieval store, TOFU and MUSE report no leakage, while the deployed agent still leaks it on 22--86\\% of queries. When the secret is in the weights, none of the twenty evaluated published methods demonstrably removes it, and only an input-corruption intervention reaches selective forgetting under the evaluated observer. The top-ranked method changes across base models. A refusal-tuning method resists the evaluated extraction without verified knowledge removal.", "arxiv_id": "2609.12808", "arxiv_url": "https://arxiv.org/abs/2609.12808", "authors": ["Guangsheng Yu", "Yanna Jiang", "Qin Wang", "Baihe Ma", "Xu Wang"], "brief": "\u8bba\u6587\u63d0\u51fa K-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728 ReAct \u667a\u80fd\u4f53\u90e8\u7f72\u573a\u666f\u4e0b\u7684\u9057\u5fd8\u6548\u679c\u3002\u5b83\u4e0d\u4ec5\u68c0\u67e5\u6700\u7ec8\u56de\u7b54\uff0c\u8fd8\u68c0\u67e5\u601d\u7ef4\u94fe\u3001\u5de5\u5177\u8c03\u7528\u3001\u5de5\u5177\u89c2\u5bdf\u548c\u6458\u8981\u7b49\u516d\u7c7b\u901a\u9053\uff0c\u5224\u65ad\u79d8\u5bc6\u662f\u5426\u5728\u4efb\u4e00\u73af\u8282\u6cc4\u6f0f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.12808", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["K-Bench \u5c06\u79d8\u5bc6\u5206\u522b\u653e\u5165\u6a21\u578b\u6743\u91cd\u3001\u63d0\u793a\u8bcd\u6216\u68c0\u7d22\u5e93\u4e09\u7c7b\u6765\u6e90\uff0c\u5e76\u4e3a\u6bcf\u7c7b\u6765\u6e90\u5355\u72ec\u8ba1\u7b97 K-Score\uff0c\u53ea\u6709\u5728\u667a\u80fd\u4f53\u4ecd\u53ef\u7528\u65f6\u624d\u8ba4\u53ef\u9057\u5fd8\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u4ec5\u6e05\u9664\u6700\u7ec8\u56de\u7b54\u901a\u9053\u5e76\u4e0d\u80fd\u963b\u6b62\u6cc4\u6f0f\uff1b\u5728\u7ed3\u6784\u5316\u68c0\u7d22\u4e2d\uff0c\u79d8\u5bc6\u4f1a\u539f\u6837\u51fa\u73b0\u5728\u5de5\u5177\u89c2\u5bdf\u901a\u9053\uff0c\u6574\u4f53\u6cc4\u6f0f\u7387\u51e0\u4e4e\u4e0d\u53d8\u3002", "\u5f53\u79d8\u5bc6\u4f4d\u4e8e\u63d0\u793a\u8bcd\u6216\u68c0\u7d22\u5e93\u65f6\uff0cTOFU \u548c MUSE \u62a5\u544a\u65e0\u6cc4\u6f0f\uff0c\u4f46\u667a\u80fd\u4f53\u4ecd\u5728 22% \u5230 86% \u7684\u67e5\u8be2\u4e2d\u6cc4\u6f0f\uff1b\u6743\u91cd\u5185\u79d8\u5bc6\u4e0a\uff0c20\u79cd\u5df2\u53d1\u8868\u65b9\u6cd5\u5747\u672a\u80fd\u53ef\u9760\u79fb\u9664\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u9057\u5fd8", "\u5b89\u5168\u8bc4\u6d4b", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.12808", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "K-Bench: A Benchmark for LLM Unlearning in Agentic Deployments", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u7684LLM\u9057\u5fd8\u6cc4\u6f0f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa K-Bench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5927\u8bed\u8a00\u6a21\u578b\u5728 ReAct \u667a\u80fd\u4f53\u90e8\u7f72\u573a\u666f\u4e0b\u7684\u9057\u5fd8\u6548\u679c\u3002\u5b83\u4e0d\u4ec5\u68c0\u67e5\u6700\u7ec8\u56de\u7b54\uff0c\u8fd8\u68c0\u67e5\u601d\u7ef4\u94fe\u3001\u5de5\u5177\u8c03\u7528\u3001\u5de5\u5177\u89c2\u5bdf\u548c\u6458\u8981\u7b49\u516d\u7c7b\u901a\u9053\uff0c\u5224\u65ad\u79d8\u5bc6\u662f\u5426\u5728\u4efb\u4e00\u73af\u8282\u6cc4\u6f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u73b0\u6709 LLM \u9057\u5fd8\u57fa\u51c6\u5728\u667a\u80fd\u4f53\u90e8\u7f72\u4e2d\u53ef\u80fd\u7ed9\u51fa\u865a\u5047\u7684\u5b89\u5168\u611f\uff0c\u5f3a\u8c03\u9057\u5fd8\u8bc4\u6d4b\u5fc5\u987b\u8986\u76d6\u5de5\u5177\u4f7f\u7528\u3001\u68c0\u7d22\u548c\u4e2d\u95f4\u63a8\u7406\u901a\u9053\uff0c\u5bf9\u9690\u79c1\u4fdd\u62a4\u3001\u5408\u89c4\u5220\u9664\u548c\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u4f30\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Recent work extends recursive self-improvement (RSI) to agent harnesses for long-horizon coding and terminal tasks, enabling agents to improve execution mechanisms from experience. However, generalizable harness RSI remains challenging. First, evolving harnesses on evaluation benchmarks or their subsets makes it difficult to distinguish reusable improvements from benchmark-specific adaptation. Second, single-trajectory updates can conflate systematic harness deficiencies with instance-specific reasoning and solution details, producing modifications that transfer poorly to unseen tasks. Third, localizing recurring behavioral deficiencies within monolithic harnesses is difficult, while whole-harness optimization can entangle unrelated mechanisms and complicate attribution and validation. We propose ModularRSI, a benchmark-disjoint, contrastive, and modular framework for generalizable harness evolution. ModularRSI contrasts successful and failed trajectories for the same task and aggregates evidence across tasks to identify recurring behavioral deficiencies. It decomposes the evolvable harness into five functional modules: Agent Loop, Tool Use, Observation Management, Context Management, and Task Completion Detection. Each module evolves independently within a restricted modification scope, followed by an integration stage that combines the evolved modules into a unified harness and resolves potential conflicts. To support benchmark-disjoint evolution, we curate 2,000 executable evolution tasks from external sources that are disjoint from downstream evaluation benchmarks. Experiments on TB2.0 and SWE-Bench Verified show consistent improvements on unseen in-domain and cross-domain tasks, with the evolved harness also transferring across different foundation models.", "arxiv_id": "2609.14857", "arxiv_url": "https://arxiv.org/abs/2609.14857", "authors": ["Siwei Wu", "Jincheng Ren", "Yizhi Li", "Haau-Sing Li", "Chengran Yang", "Yuxuan Zhang", "Weicheng Gu", "Jian Yang", "Riza Batista-Navarro", "Chuanyi Zhang", "Xianglong Liu", "Ming Zhou", "Bryan Dai", "Chenghua Lin"], "brief": "\u8bba\u6587\u63d0\u51fa ModularRSI\uff0c\u4e00\u79cd\u7528\u4e8e\u957f\u7a0b\u7f16\u7801\u4e0e\u7ec8\u7aef\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6\u9012\u5f52\u81ea\u6539\u8fdb\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u57fa\u51c6\u5916\u4efb\u52a1\u3001\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u5bf9\u6bd4\u548c\u6a21\u5757\u5316\u6f14\u5316\uff0c\u8ba9 harness \u6539\u8fdb\u66f4\u53ef\u6cdb\u5316\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14857", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u53ef\u6f14\u5316 harness \u62c6\u5206\u4e3a Agent Loop\u3001Tool Use\u3001Observation Management\u3001Context Management\u3001Task Completion Detection \u4e94\u4e2a\u529f\u80fd\u6a21\u5757\u72ec\u7acb\u4f18\u5316", "\u5bf9\u540c\u4e00\u4efb\u52a1\u7684\u6210\u529f\u4e0e\u5931\u8d25\u8f68\u8ff9\u8fdb\u884c\u5bf9\u6bd4\uff0c\u5e76\u8de8\u4efb\u52a1\u805a\u5408\u8bc1\u636e\uff0c\u4ee5\u8bc6\u522b\u53ef\u590d\u7528\u7684\u7cfb\u7edf\u6027\u7f3a\u9677", "\u6784\u5efa\u4e86 2,000 \u4e2a\u4e0e\u4e0b\u6e38\u8bc4\u6d4b\u57fa\u51c6\u4e0d\u91cd\u53e0\u7684\u53ef\u6267\u884c\u6f14\u5316\u4efb\u52a1\uff0c\u5e76\u5728 TB2.0 \u4e0e SWE-Bench Verified \u4e0a\u9a8c\u8bc1\u8de8\u4efb\u52a1\u3001\u8de8\u6a21\u578b\u8fc1\u79fb"], "keywords": ["\u667a\u80fd\u4f53", "\u9012\u5f52\u81ea\u6539\u8fdb", "\u4ee3\u7801\u751f\u6210", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14857", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ModularRSI: Modular and Generalizable Recursive Harness Self-Improvement", "tldr": "\u6a21\u5757\u5316\u5bf9\u6bd4\u5b66\u4e60\u6539\u8fdbLLM\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ModularRSI\uff0c\u4e00\u79cd\u7528\u4e8e\u957f\u7a0b\u7f16\u7801\u4e0e\u7ec8\u7aef\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6\u9012\u5f52\u81ea\u6539\u8fdb\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u57fa\u51c6\u5916\u4efb\u52a1\u3001\u6210\u529f/\u5931\u8d25\u8f68\u8ff9\u5bf9\u6bd4\u548c\u6a21\u5757\u5316\u6f14\u5316\uff0c\u8ba9 harness \u6539\u8fdb\u66f4\u53ef\u6cdb\u5316\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u667a\u80fd\u4f53\u81ea\u6539\u8fdb\u4e2d\u5e38\u89c1\u7684\u8fc7\u62df\u5408\u8bc4\u6d4b\u96c6\u3001\u5355\u8f68\u8ff9\u566a\u58f0\u548c\u6574\u4f53\u6846\u67b6\u96be\u5f52\u56e0\u95ee\u9898\uff0c\u63d0\u51fa\u66f4\u53ef\u63a7\u3001\u53ef\u9a8c\u8bc1\u7684\u6a21\u5757\u5316 RSI \u8303\u5f0f\uff0c\u5bf9\u63d0\u5347\u4ee3\u7801/\u7ec8\u7aef\u667a\u80fd\u4f53\u7684\u6cdb\u5316\u80fd\u529b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agentic serving can consume orders of magnitude more tokens than chatbot workloads, stressing both KV-cache capacity and decode-time bandwidth. Most KV-eviction methods score cached keys against representative queries drawn from the most recent tokens, assuming future attention resembles recent attention. We show that agentic generation violates this assumption: future queries form a mixture over think, act, tool, and others phases, and principal-angle analysis shows these components occupy measurably different query subspaces, so recency representatives systematically undervalue keys that upcoming phases will need. We propose AGENTKV, which maintains a small query buffer per phase and scores cached keys against their union. We further implement AGENTKV in a persistent multi-turn serving path that carries compressed KV state across turns and compacts retained KV pages online. Across two models, six task domains, and three KV budgets each, AGENTKV improves task score by 5.5 points on average over R-KV and 5.3 over Tri-attention. Relative to upstream full-KV SGLang, AGENTKV improves output-token throughput by up to 1.80x. Code: https://github.com/LiuTaowen-Tony/agentkv.", "arxiv_id": "2609.14872", "arxiv_url": "https://arxiv.org/abs/2609.14872", "authors": ["Taowen Tony Liu", "Jeffrey T. H. Wong", "Can Xiao", "Bowen Yang", "Hao Mark Chen", "Yiren Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa AGENTKV\uff0c\u4e00\u79cd\u9488\u5bf9 Agentic LLM \u670d\u52a1\u7684\u9636\u6bb5\u611f\u77e5 KV \u7f13\u5b58\u6dd8\u6c70\u65b9\u6cd5\u3002\u5b83\u6839\u636e think\u3001act\u3001tool \u7b49\u4e0d\u540c\u751f\u6210\u9636\u6bb5\u7ef4\u62a4\u67e5\u8be2\u7f13\u51b2\uff0c\u5e76\u7528\u591a\u9636\u6bb5\u67e5\u8be2\u8054\u5408\u8bc4\u4f30\u7f13\u5b58\u952e\u7684\u91cd\u8981\u6027\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14872", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u667a\u80fd\u4f53\u751f\u6210\u7684\u672a\u6765\u6ce8\u610f\u529b\u4e0d\u518d\u670d\u4ece\u201c\u8fd1\u671f\u67e5\u8be2\u4ee3\u8868\u672a\u6765\u67e5\u8be2\u201d\u7684\u5047\u8bbe\uff0c\u4e0d\u540c\u9636\u6bb5\u7684\u67e5\u8be2\u5b50\u7a7a\u95f4\u5b58\u5728\u663e\u8457\u5dee\u5f02\u3002", "\u4e3a\u6bcf\u4e2a\u9636\u6bb5\u7ef4\u62a4\u5c0f\u578b query buffer\uff0c\u5e76\u57fa\u4e8e\u591a\u9636\u6bb5\u67e5\u8be2\u96c6\u5408\u5bf9 KV \u8fdb\u884c\u6253\u5206\uff0c\u907f\u514d\u4f4e\u4f30\u540e\u7eed\u9636\u6bb5\u6240\u9700\u7684\u5386\u53f2\u952e\u503c\u3002", "\u5728\u591a\u8f6e\u6301\u4e45\u5316\u670d\u52a1\u8def\u5f84\u4e2d\u643a\u5e26\u538b\u7f29 KV \u72b6\u6001\u5e76\u5728\u7ebf\u6574\u7406 KV \u9875\uff1b\u5728\u4e24\u79cd\u6a21\u578b\u3001\u516d\u7c7b\u4efb\u52a1\u548c\u4e09\u79cd\u7f13\u5b58\u9884\u7b97\u4e0b\uff0c\u4efb\u52a1\u5206\u6570\u5e73\u5747\u4f18\u4e8e R-KV 5.5 \u5206\u3001\u4f18\u4e8e Tri-attention 5.3 \u5206\uff0c\u541e\u5410\u6700\u9ad8\u63d0\u5347 1.80 \u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "KV\u7f13\u5b58", "\u63a8\u7406\u52a0\u901f", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14872", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgentKV: Phase-Aware KV Eviction for Agentic LLMs", "tldr": "\u9762\u5411\u667a\u80fd\u4f53\u9636\u6bb5\u611f\u77e5\u7684KV\u7f13\u5b58\u6dd8\u6c70", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AGENTKV\uff0c\u4e00\u79cd\u9488\u5bf9 Agentic LLM \u670d\u52a1\u7684\u9636\u6bb5\u611f\u77e5 KV \u7f13\u5b58\u6dd8\u6c70\u65b9\u6cd5\u3002\u5b83\u6839\u636e think\u3001act\u3001tool \u7b49\u4e0d\u540c\u751f\u6210\u9636\u6bb5\u7ef4\u62a4\u67e5\u8be2\u7f13\u51b2\uff0c\u5e76\u7528\u591a\u9636\u6bb5\u67e5\u8be2\u8054\u5408\u8bc4\u4f30\u7f13\u5b58\u952e\u7684\u91cd\u8981\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u9488\u5bf9\u667a\u80fd\u4f53\u957f\u4e0a\u4e0b\u6587\u3001\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u5e26\u6765\u7684 KV \u7f13\u5b58\u74f6\u9888\uff0c\u63ed\u793a\u4e86\u73b0\u6709\u57fa\u4e8e\u8fd1\u671f\u6ce8\u610f\u529b\u7684\u6dd8\u6c70\u7b56\u7565\u5728 agent \u573a\u666f\u4e0b\u7684\u5931\u6548\u539f\u56e0\uff0c\u5e76\u7ed9\u51fa\u53ef\u843d\u5730\u7684\u670d\u52a1\u7aef\u4f18\u5316\u65b9\u6848\uff0c\u517c\u987e\u4efb\u52a1\u8d28\u91cf\u4e0e\u63a8\u7406\u541e\u5410\u3002"}, {"abstract": "Medical volume visualization requires selecting regions of interest (ROIs) and carefully controlling their relative visual emphasis according to a given clinical intent. Implementing these decisions in conventional workflows demands substantial clinical and visualization expertise and often involves trial-and-error optimization. Recent agentic systems have introduced natural-language interaction and autonomous visualization operations but largely rely on MLLM-based inference throughout the workflow. Although MLLMs encode broad medical knowledge and provide strong reasoning capabilities, such inference may be suboptimal for medical volume visualization, potentially leading to clinically incomplete interpretations of user requests and unreliable ROI identification and visualization optimization. In this work, we present MedVA, an end-to-end neuro-symbolic agentic system for medical volume visualization that addresses these limitations through three complementary agents. The neuro-symbolic intent formulation agent refines MLLM-based interpretations of natural-language requests through symbolic reasoning over established clinical knowledge, which provides more complete, clinically grounded ROI specifications than MLLM-only reasoning. The multi-model ROI identification agent directly identifies semantically specified ROIs in the original volume by leveraging complementary large-scale pretrained medical segmentation models. The objective-driven visualization optimization agent explicitly evaluates ROI visibility and occlusion in the original volume using a volume-based visibility objective. Extensive agent-level and system-level evaluations across diverse medical datasets and interaction scenarios support the effectiveness of the individual agents. A formative user study further indicates high usability and practical value among users with different levels of expertise.", "arxiv_id": "2609.14874", "arxiv_url": "https://arxiv.org/abs/2609.14874", "authors": ["Haill An", "Suhyeon Kim", "Minjun Kang", "Eunwoo Lee", "Bin Sheng", "Lei Bi", "Younhyun Jung"], "brief": "MedVA \u662f\u4e00\u4e2a\u7aef\u5230\u7aef\u795e\u7ecf\u7b26\u53f7\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u6839\u636e\u81ea\u7136\u8bed\u8a00\u4e34\u5e8a\u610f\u56fe\u81ea\u52a8\u786e\u5b9a ROI\u3001\u8bc6\u522b\u533b\u5b66\u4f53\u6570\u636e\u4e2d\u7684\u76f8\u5173\u7ed3\u6784\uff0c\u5e76\u4f18\u5316\u4e09\u7ef4\u4f53\u53ef\u89c6\u5316\u6548\u679c\u3002\u5b83\u901a\u8fc7\u7b26\u53f7\u4e34\u5e8a\u77e5\u8bc6\u3001\u591a\u6a21\u578b\u533b\u5b66\u5206\u5272\u548c\u663e\u5f0f\u53ef\u89c1\u6027\u76ee\u6807\uff0c\u63d0\u5347\u4f20\u7edf MLLM-only \u6d41\u7a0b\u7684\u53ef\u9760\u6027\u3002", "categories": ["cs.GR", "cs.CV", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14874", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u4e09\u4e2a\u4e92\u8865\u667a\u80fd\u4f53\uff1a\u610f\u56fe\u8868\u8ff0\u667a\u80fd\u4f53\u3001ROI \u8bc6\u522b\u667a\u80fd\u4f53\u548c\u53ef\u89c6\u5316\u4f18\u5316\u667a\u80fd\u4f53\uff0c\u8986\u76d6\u4ece\u8bed\u8a00\u8bf7\u6c42\u5230\u6700\u7ec8\u4f53\u7ed8\u5236\u7684\u5b8c\u6574\u6d41\u7a0b", "\u7528\u4e34\u5e8a\u77e5\u8bc6\u9a71\u52a8\u7684\u7b26\u53f7\u63a8\u7406\u4fee\u6b63 MLLM \u5bf9\u7528\u6237\u610f\u56fe\u7684\u89e3\u91ca\uff0c\u751f\u6210\u66f4\u5b8c\u6574\u3001\u66f4\u7b26\u5408\u533b\u5b66\u8bed\u4e49\u7684 ROI \u89c4\u683c", "\u7ed3\u5408\u591a\u4e2a\u5927\u89c4\u6a21\u9884\u8bad\u7ec3\u533b\u5b66\u5206\u5272\u6a21\u578b\u5b9a\u4f4d ROI\uff0c\u5e76\u7528\u57fa\u4e8e\u4f53\u6570\u636e\u7684\u53ef\u89c1\u6027\u4e0e\u906e\u6321\u76ee\u6807\u663e\u5f0f\u4f18\u5316\u663e\u793a\u6548\u679c"], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u5b66\u5f71\u50cf", "\u795e\u7ecf\u7b26\u53f7", "\u53ef\u89c6\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14874", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MedVA: An End-to-End Neuro-Symbolic Agentic System for Medical Volume Visualization", "tldr": "\u9762\u5411\u533b\u5b66\u4f53\u6570\u636e\u53ef\u89c6\u5316\u7684\u795e\u7ecf\u7b26\u53f7\u667a\u80fd\u4f53\u7cfb\u7edf", "upvotes": 0, "what_it_is": "MedVA \u662f\u4e00\u4e2a\u7aef\u5230\u7aef\u795e\u7ecf\u7b26\u53f7\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u53ef\u6839\u636e\u81ea\u7136\u8bed\u8a00\u4e34\u5e8a\u610f\u56fe\u81ea\u52a8\u786e\u5b9a ROI\u3001\u8bc6\u522b\u533b\u5b66\u4f53\u6570\u636e\u4e2d\u7684\u76f8\u5173\u7ed3\u6784\uff0c\u5e76\u4f18\u5316\u4e09\u7ef4\u4f53\u53ef\u89c6\u5316\u6548\u679c\u3002\u5b83\u901a\u8fc7\u7b26\u53f7\u4e34\u5e8a\u77e5\u8bc6\u3001\u591a\u6a21\u578b\u533b\u5b66\u5206\u5272\u548c\u663e\u5f0f\u53ef\u89c1\u6027\u76ee\u6807\uff0c\u63d0\u5347\u4f20\u7edf MLLM-only \u6d41\u7a0b\u7684\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u795e\u7ecf\u7b26\u53f7\u63a8\u7406\u3001\u533b\u5b66\u5206\u5272\u57fa\u7840\u6a21\u578b\u548c\u53ef\u89c6\u5316\u4f18\u5316\u7ed3\u5408\u5230\u4e00\u4e2a\u53ef\u4ea4\u4e92\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\uff0c\u9488\u5bf9\u533b\u5b66\u4f53\u53ef\u89c6\u5316\u4e2d\u4e34\u5e8a\u610f\u56fe\u7406\u89e3\u4e0d\u5168\u3001ROI \u8bc6\u522b\u4e0d\u7a33\u548c\u663e\u793a\u53c2\u6570\u96be\u8c03\u7b49\u75db\u70b9\u63d0\u4f9b\u4e86\u5b9e\u7528\u65b9\u6848\uff0c\u5e76\u901a\u8fc7\u591a\u6570\u636e\u96c6\u8bc4\u6d4b\u548c\u7528\u6237\u7814\u7a76\u9a8c\u8bc1\u4e86\u53ef\u7528\u6027\u3002"}, {"abstract": "Long-horizon LLM agents accumulate memory across sessions, creating sparse but high-impact risks: stale facts, conflicting updates, cross-user leakage, revoked-memory reuse, and constraint decay. Standard aggregate scores hide per-risk failure rates--a model achieving 78% average accuracy may still leak data in 4% of episodes--and benchmark compression preferentially discards the rare high-severity events that distinguish a mostly-working model from one that occasionally causes harm. We present MemRiskBench. The primary contribution is a five-category risk taxonomy (plus one documented, unscored category) operationalized by deterministic trace grounded checks, instantiated as a 120-episode scripted benchmark with full trace logging and no LLM-as-judge on the pass/fail path, evaluated on five locally run quantized instruction-tuned models. Second, a risk-preserving subset selector: a coverage-constrained greedy selector on deterministic trace-derived features that retains full ranking (Spearman rho = 0.975, deterministic; CI collapses to a point estimate with zero bootstrap variance), risk coverage (1.0), and high-risk model detection (1.0) at a 20% subset size, reducing compute 5x. Unlike ranking-only subset selectors, this selector additionally preserves risk-type coverage and high-risk detection using trace-grounded deterministic features that do not require an LLM judge. All episodes, traces, the scoring implementation, and the selector are released to support reproducible evaluation and risk assessment of deployed LLM agents", "arxiv_id": "2609.14976", "arxiv_url": "https://arxiv.org/abs/2609.14976", "authors": ["Jianhua Jiang", "Dongbo Yuan", "Weihua Li"], "brief": "\u8bba\u6587\u63d0\u51fa MemRiskBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u7a0b LLM \u667a\u80fd\u4f53\u8de8\u4f1a\u8bdd\u8bb0\u5fc6\u7d2f\u79ef\u5e26\u6765\u7684\u9ad8\u5f71\u54cd\u98ce\u9669\u3002\u5b83\u6784\u5efa\u4e86\u4e94\u7c7b\u98ce\u9669\u5206\u7c7b\u3001120\u4e2a\u811a\u672c\u5316\u56de\u5408\u3001\u5b8c\u6574\u8f68\u8ff9\u65e5\u5fd7\uff0c\u5e76\u7528\u786e\u5b9a\u6027\u8f68\u8ff9\u68c0\u67e5\u66ff\u4ee3 LLM \u88c1\u5224\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14976", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u9648\u65e7\u4e8b\u5b9e\u3001\u51b2\u7a81\u66f4\u65b0\u3001\u8de8\u7528\u6237\u6cc4\u9732\u3001\u64a4\u9500\u8bb0\u5fc6\u590d\u7528\u3001\u7ea6\u675f\u8870\u51cf\u7b49\u4e94\u7c7b\u6838\u5fc3\u8bb0\u5fc6\u98ce\u9669\uff0c\u53e6\u6709\u4e00\u7c7b\u8bb0\u5f55\u4f46\u4e0d\u8ba1\u5206\u98ce\u9669\u3002", "\u57fa\u51c6\u91c7\u7528\u786e\u5b9a\u6027 trace-grounded \u68c0\u67e5\uff0c\u907f\u514d\u5728\u901a\u8fc7/\u5931\u8d25\u5224\u5b9a\u4e2d\u4f7f\u7528 LLM-as-judge\uff0c\u63d0\u9ad8\u53ef\u590d\u73b0\u6027\u3002", "\u63d0\u51fa\u98ce\u9669\u4fdd\u6301\u5b50\u96c6\u9009\u62e9\u5668\uff0c\u572820%\u5b50\u96c6\u89c4\u6a21\u4e0b\u4fdd\u6301\u6392\u5e8f\u76f8\u5173\u6027 Spearman \u03c1=0.975\u3001\u98ce\u9669\u8986\u76d6\u73871.0\u3001\u9ad8\u98ce\u9669\u6a21\u578b\u68c0\u6d4b\u73871.0\uff0c\u5e76\u5c06\u8ba1\u7b97\u91cf\u964d\u4f4e5\u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u5b89\u5168", "\u57fa\u51c6\u8bc4\u6d4b", "\u98ce\u9669\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14976", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MemRiskBench: Trace-Aware Risk-Preserving Evaluation for Long-Horizon LLM Agents", "tldr": "\u9762\u5411\u957f\u7a0bLLM\u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u98ce\u9669\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MemRiskBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u7a0b LLM \u667a\u80fd\u4f53\u8de8\u4f1a\u8bdd\u8bb0\u5fc6\u7d2f\u79ef\u5e26\u6765\u7684\u9ad8\u5f71\u54cd\u98ce\u9669\u3002\u5b83\u6784\u5efa\u4e86\u4e94\u7c7b\u98ce\u9669\u5206\u7c7b\u3001120\u4e2a\u811a\u672c\u5316\u56de\u5408\u3001\u5b8c\u6574\u8f68\u8ff9\u65e5\u5fd7\uff0c\u5e76\u7528\u786e\u5b9a\u6027\u8f68\u8ff9\u68c0\u67e5\u66ff\u4ee3 LLM \u88c1\u5224\u3002", "why_notable": "\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u8bb0\u5fc6\u673a\u5236\u53ef\u80fd\u5e26\u6765\u4f4e\u9891\u4f46\u4e25\u91cd\u7684\u5b89\u5168\u95ee\u9898\uff0c\u666e\u901a\u5e73\u5747\u5206\u5bb9\u6613\u63a9\u76d6\u8fd9\u4e9b\u98ce\u9669\u3002\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u3001\u65e0\u9700LLM\u88c1\u5224\u4e14\u80fd\u4fdd\u7559\u98ce\u9669\u8986\u76d6\u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u5bf9\u90e8\u7f72\u578b\u667a\u80fd\u4f53\u7684\u5b89\u5168\u8bc4\u4f30\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM) agents interact with external environments through tool invocation, but tool outputs can also expose them to indirect prompt injection (IPI) attacks. Existing defenses mainly rely on prompt hardening, content filtering, pre-generated plans, or permission constraints. These approaches often struggle with complex tasks or over-sanitize external content, making it difficult to balance security and utility. The key challenge is therefore to preserve execution flexibility while precisely identifying and removing the malicious content that actually induces unsafe actions. To address this challenge, we propose ActGuard, a pre-execution action auditing framework. Rather than judging whether external content is inherently suspicious, ActGuard assesses whether it causes the current action to deviate from a locally reasonable expectation. At each step, ActGuard predicts the tools likely to be used by the upcoming action and constructs a local tool prior without constraining the execution trajectory. Before execution, it compares the candidate action against this prior and performs tool-level contrastive analysis and parameter-level evidence localization to identify deviations in tool selection and action parameters. A verifier then examines the localized evidence, masks only spans confirmed as malicious, and regenerates the action from the sanitized context. This design preserves legitimate planning flexibility while minimizing information loss from indiscriminate filtering. We evaluate ActGuard on challenging benchmarks for tool-using agents. Results show that ActGuard reduces attack success rates to a level comparable to state-of-the-art defenses while maintaining task utility close to the no-attack setting, achieving a favorable security-utility trade-off. Our code is publicly available at: https://github.com/binzhwang/ActGuard.", "arxiv_id": "2609.14987", "arxiv_url": "https://arxiv.org/abs/2609.14987", "authors": ["Bingzheng Wang", "Xiaoyan Gu", "Wentao Wang", "Xingyou Yang", "Hongcheng Li", "Rong Yin"], "brief": "ActGuard \u662f\u4e00\u4e2a\u9762\u5411\u5de5\u5177\u8c03\u7528\u578b LLM \u667a\u80fd\u4f53\u7684\u6267\u884c\u524d\u52a8\u4f5c\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u9632\u5fa1\u5de5\u5177\u8f93\u51fa\u4e2d\u7684\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3002\u5b83\u4e0d\u76f4\u63a5\u5224\u65ad\u5916\u90e8\u5185\u5bb9\u662f\u5426\u53ef\u7591\uff0c\u800c\u662f\u5224\u65ad\u5019\u9009\u52a8\u4f5c\u662f\u5426\u504f\u79bb\u5f53\u524d\u4e0a\u4e0b\u6587\u4e0b\u7684\u5408\u7406\u5de5\u5177\u4f7f\u7528\u9884\u671f\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14987", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e3a\u6bcf\u4e00\u6b65\u9884\u6d4b\u53ef\u80fd\u4f7f\u7528\u7684\u5de5\u5177\uff0c\u6784\u5efa\u5c40\u90e8\u5de5\u5177\u5148\u9a8c\uff0c\u4f46\u4e0d\u5f3a\u884c\u9650\u5236\u667a\u80fd\u4f53\u6267\u884c\u8def\u5f84", "\u5728\u52a8\u4f5c\u6267\u884c\u524d\u8fdb\u884c\u5de5\u5177\u7ea7\u5bf9\u6bd4\u5206\u6790\u4e0e\u53c2\u6570\u7ea7\u8bc1\u636e\u5b9a\u4f4d\uff0c\u627e\u51fa\u5de5\u5177\u9009\u62e9\u6216\u53c2\u6570\u4e2d\u7684\u5f02\u5e38\u504f\u79bb", "\u9a8c\u8bc1\u5668\u4ec5\u906e\u853d\u786e\u8ba4\u6076\u610f\u7684\u6587\u672c\u7247\u6bb5\uff0c\u5e76\u57fa\u4e8e\u6e05\u6d17\u540e\u7684\u4e0a\u4e0b\u6587\u91cd\u65b0\u751f\u6210\u52a8\u4f5c\uff0c\u4ee5\u51cf\u5c11\u8fc7\u5ea6\u8fc7\u6ee4\u5e26\u6765\u7684\u6548\u7528\u635f\u5931"], "keywords": ["\u667a\u80fd\u4f53", "\u63d0\u793a\u6ce8\u5165", "\u5de5\u5177\u8c03\u7528", "\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14987", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ActGuard: Pre-execution Action Auditing against Indirect Prompt Injection in LLM Agents", "tldr": "\u6267\u884c\u524d\u5ba1\u8ba1\u52a8\u4f5c\uff0c\u9632\u5fa1\u667a\u80fd\u4f53\u95f4\u63a5\u6ce8\u5165", "upvotes": 0, "what_it_is": "ActGuard \u662f\u4e00\u4e2a\u9762\u5411\u5de5\u5177\u8c03\u7528\u578b LLM \u667a\u80fd\u4f53\u7684\u6267\u884c\u524d\u52a8\u4f5c\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u9632\u5fa1\u5de5\u5177\u8f93\u51fa\u4e2d\u7684\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3002\u5b83\u4e0d\u76f4\u63a5\u5224\u65ad\u5916\u90e8\u5185\u5bb9\u662f\u5426\u53ef\u7591\uff0c\u800c\u662f\u5224\u65ad\u5019\u9009\u52a8\u4f5c\u662f\u5426\u504f\u79bb\u5f53\u524d\u4e0a\u4e0b\u6587\u4e0b\u7684\u5408\u7406\u5de5\u5177\u4f7f\u7528\u9884\u671f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u5b89\u5168\u6027\u4e0e\u4efb\u52a1\u6548\u7528\u4e4b\u95f4\u53d6\u5f97\u66f4\u597d\u5e73\u8861\uff1a\u65e2\u80fd\u5c06\u653b\u51fb\u6210\u529f\u7387\u964d\u81f3\u63a5\u8fd1\u73b0\u6709\u6700\u4f18\u9632\u5fa1\u6c34\u5e73\uff0c\u53c8\u80fd\u4fdd\u6301\u63a5\u8fd1\u65e0\u653b\u51fb\u573a\u666f\u7684\u4efb\u52a1\u5b8c\u6210\u80fd\u529b\uff0c\u9002\u7528\u4e8e\u5b9e\u9645\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u7684\u5b89\u5168\u90e8\u7f72\u3002"}, {"abstract": "Recently, the rapid development of large language models (LLMs) has reshaped software engineering by enabling autonomous code agents that plan, execute, and utilize external tools iteratively to tackle complex tasks. Beyond achieving functional correctness, these agents must faithfully follow process instructions and constraints throughout the development lifecycle. However, existing benchmarks typically focus on final functional correctness or confine instruction-following evaluation to single-turn, general chat or simple code generation scenarios, leaving instruction-following in multi-turn agentic coding underexplored. To bridge this gap, we propose MTAC-IFBench, a comprehensive benchmark for this critical capability. It features multi-turn progressive software development instructions with diverse constraints spanning 6 primary and 18 secondary categories. With an average of 7.04 turns and 91.33 constraints per instance, it poses a rigorous challenge to current LLMs. To make the evaluation reliable, we construct a checklist for each constraint and functional requirement, and integrate verification scripts and judge agents to verify each checklist item. MTAC-IFBench identifies significant deficiencies in existing code agents in multi-turn instruction-following, with their performance degrading rapidly as the interaction session grows longer.", "arxiv_id": "2609.14992", "arxiv_url": "https://arxiv.org/abs/2609.14992", "authors": ["Bosi Wen", "Cunxiang Wang", "Jiayi Gui", "Haoke Zhang", "Yilin Niu", "Pei Ke", "Dayong Yang", "Hongning Wang", "Minlie Huang"], "brief": "\u8bba\u6587\u63d0\u51fa MTAC-IFBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u591a\u8f6e\u8f6f\u4ef6\u5f00\u53d1\u8fc7\u7a0b\u4e2d\u6301\u7eed\u9075\u5faa\u6307\u4ee4\u3001\u7ea6\u675f\u4e0e\u529f\u80fd\u9700\u6c42\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b\u6e10\u8fdb\u5f0f\u591a\u8f6e\u4efb\u52a1\u3001\u7ec6\u7c92\u5ea6\u7ea6\u675f\u5206\u7c7b\uff0c\u5e76\u7ed3\u5408\u68c0\u67e5\u6e05\u5355\u3001\u9a8c\u8bc1\u811a\u672c\u4e0e\u8bc4\u5ba1\u667a\u80fd\u4f53\u8fdb\u884c\u8bc4\u4f30\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14992", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d66\u4e2a\u4e00\u7ea7\u300118\u4e2a\u4e8c\u7ea7\u7ea6\u675f\u7c7b\u522b\uff0c\u5e73\u5747\u6bcf\u4e2a\u6837\u4f8b7.04\u8f6e\u4ea4\u4e92\u300191.33\u6761\u7ea6\u675f", "\u4e0d\u4ec5\u8bc4\u4f30\u6700\u7ec8\u529f\u80fd\u6b63\u786e\u6027\uff0c\u8fd8\u8bc4\u4f30\u5f00\u53d1\u8fc7\u7a0b\u4e2d\u7684\u7ea6\u675f\u9075\u5faa\u4e0e\u6307\u4ee4\u4e00\u81f4\u6027", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u957f\u4ea4\u4e92\u4e2d\u6307\u4ee4\u9075\u5faa\u80fd\u529b\u660e\u663e\u4e0b\u964d"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u6307\u4ee4\u9075\u5faa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14992", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MTAC-IFBench: Benchmarking Instruction-Following in Multi-Turn Agentic Coding", "tldr": "\u591a\u8f6e\u667a\u80fd\u4f53\u7f16\u7a0b\u6307\u4ee4\u9075\u5faa\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MTAC-IFBench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u4ee3\u7801\u667a\u80fd\u4f53\u5728\u591a\u8f6e\u8f6f\u4ef6\u5f00\u53d1\u8fc7\u7a0b\u4e2d\u6301\u7eed\u9075\u5faa\u6307\u4ee4\u3001\u7ea6\u675f\u4e0e\u529f\u80fd\u9700\u6c42\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b\u6e10\u8fdb\u5f0f\u591a\u8f6e\u4efb\u52a1\u3001\u7ec6\u7c92\u5ea6\u7ea6\u675f\u5206\u7c7b\uff0c\u5e76\u7ed3\u5408\u68c0\u67e5\u6e05\u5355\u3001\u9a8c\u8bc1\u811a\u672c\u4e0e\u8bc4\u5ba1\u667a\u80fd\u4f53\u8fdb\u884c\u8bc4\u4f30\u3002", "why_notable": "\u8be5\u57fa\u51c6\u8865\u9f50\u4e86\u591a\u8f6e\u667a\u80fd\u4f53\u7f16\u7a0b\u573a\u666f\u4e2d\u6307\u4ee4\u9075\u5faa\u8bc4\u6d4b\u7684\u7a7a\u767d\uff0c\u5bf9\u8861\u91cf\u771f\u5b9e\u8f6f\u4ef6\u5f00\u53d1\u4e2d\u7684\u4ee3\u7801\u667a\u80fd\u4f53\u53ef\u9760\u6027\u548c\u53ef\u63a7\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent multi-shot audio-video generators can produce increasingly coherent and cinematic outputs, but coherence does not imply the ability to execute editing techniques. Professional editing depends on shot structure, transition grammar, audio-video cut relations, and montage, yet existing benchmarks largely rely on proxies such as content quality, synchronization, or physical plausibility, systematically missing whether such editing instructions are actually executed. We introduce CutCraft, the first benchmark for editing-technique execution in multi-shot audio-video generation. CutCraft extends structured multi-shot prompts with explicit editing specifications and is paired with a hierarchical hybrid evaluation framework that combines shot-structure alignment, expert-model metrics, tool-grounded multimodal judgment, and rubric-based question answering. Beyond evaluation, we design an agentic editing baseline that decomposes generation into planning, shot-level synthesis, and post-hoc composition, explicitly realizing editing semantics such as J-cuts, L-cuts, and transition timing. Across 13 state-of-the-art closed- and open-source models, CutCraft reveals a consistent gap between coherence and editing-technique execution: current systems often produce plausible multi-shot videos yet fail to execute editorial instructions reliably. We find unstable shot structures, weak control of transition execution, and sharp degradation on higher-order montage, while aesthetic quality is only weakly correlated with editing-technique compliance. The benchmark and metrics, and the editing agent baseline are available at https://github.com/AlibabaResearch/cut-craft-bench.", "arxiv_id": "2609.08275", "arxiv_url": "https://arxiv.org/abs/2609.08275", "authors": ["Tianyi Zeng", "Junchao Liao", "Yujie Wei", "Ziying Zhang", "Litao Li", "Tianyi Wang", "Zhichao Wei", "Shuyao Xu", "Wenwen Qiang", "Siyu Zhu", "Zhenghao Zhang", "Long Qin"], "brief": "\u8bba\u6587\u63d0\u51fa CutCraft\uff0c\u9996\u4e2a\u9762\u5411\u591a\u955c\u5934\u97f3\u89c6\u9891\u751f\u6210\u4e2d\u4e13\u4e1a\u526a\u8f91\u6280\u6cd5\u6267\u884c\u80fd\u529b\u7684\u57fa\u51c6\u3002\u5b83\u5728\u7ed3\u6784\u5316\u591a\u955c\u5934\u63d0\u793a\u4e2d\u52a0\u5165\u660e\u786e\u526a\u8f91\u89c4\u8303\uff0c\u5e76\u7ed3\u5408\u5c42\u7ea7\u5316\u6df7\u5408\u8bc4\u4f30\u4e0e\u4e00\u4e2a\u667a\u80fd\u4f53\u5f0f\u526a\u8f91\u57fa\u7ebf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.08275", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u4f30\u8986\u76d6\u955c\u5934\u7ed3\u6784\u5bf9\u9f50\u3001\u4e13\u5bb6\u6a21\u578b\u6307\u6807\u3001\u5de5\u5177\u8f85\u52a9\u591a\u6a21\u6001\u5224\u65ad\u548c\u57fa\u4e8e rubric \u7684\u95ee\u7b54\u8bc4\u6d4b", "\u667a\u80fd\u4f53\u5f0f\u57fa\u7ebf\u5c06\u751f\u6210\u5206\u89e3\u4e3a\u89c4\u5212\u3001\u5355\u955c\u5934\u5408\u6210\u548c\u540e\u671f\u5408\u6210\uff0c\u4ee5\u663e\u5f0f\u5b9e\u73b0 J-cut\u3001L-cut\u3001\u8f6c\u573a\u65f6\u673a\u7b49\u526a\u8f91\u8bed\u4e49", "\u572813\u4e2a\u95ed\u6e90\u4e0e\u5f00\u6e90\u6a21\u578b\u4e0a\u53d1\u73b0\uff1a\u5f53\u524d\u6a21\u578b\u867d\u80fd\u751f\u6210\u8fde\u8d2f\u89c6\u9891\uff0c\u4f46\u5bf9\u8f6c\u573a\u3001\u955c\u5934\u7ed3\u6784\u548c\u9ad8\u7ea7\u8499\u592a\u5947\u7684\u6307\u4ee4\u6267\u884c\u4ecd\u4e0d\u53ef\u9760"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.08275", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Coherence: Benchmarking Professional Editing-Technique Execution in Multi-Shot Audio-Video Generation", "tldr": "CutCraft\u8bc4\u6d4b\u591a\u955c\u5934\u89c6\u9891\u526a\u8f91\u6280\u6cd5\u6267\u884c", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CutCraft\uff0c\u9996\u4e2a\u9762\u5411\u591a\u955c\u5934\u97f3\u89c6\u9891\u751f\u6210\u4e2d\u4e13\u4e1a\u526a\u8f91\u6280\u6cd5\u6267\u884c\u80fd\u529b\u7684\u57fa\u51c6\u3002\u5b83\u5728\u7ed3\u6784\u5316\u591a\u955c\u5934\u63d0\u793a\u4e2d\u52a0\u5165\u660e\u786e\u526a\u8f91\u89c4\u8303\uff0c\u5e76\u7ed3\u5408\u5c42\u7ea7\u5316\u6df7\u5408\u8bc4\u4f30\u4e0e\u4e00\u4e2a\u667a\u80fd\u4f53\u5f0f\u526a\u8f91\u57fa\u7ebf\u3002", "why_notable": "\u5b83\u628a\u591a\u955c\u5934\u89c6\u9891\u751f\u6210\u8bc4\u6d4b\u4ece\u201c\u8fde\u8d2f\u597d\u770b\u201d\u63a8\u8fdb\u5230\u201c\u662f\u5426\u771f\u6b63\u6267\u884c\u4e13\u4e1a\u526a\u8f91\u6307\u4ee4\u201d\uff0c\u63ed\u793a\u4e86\u73b0\u6709\u6a21\u578b\u5728\u53ef\u63a7\u526a\u8f91\u8bed\u4e49\u4e0a\u7684\u7cfb\u7edf\u6027\u77ed\u677f\uff0c\u5bf9\u89c6\u9891\u751f\u6210\u6a21\u578b\u3001\u8bc4\u6d4b\u4f53\u7cfb\u548c\u667a\u80fd\u4f53\u5f0f\u540e\u671f\u5236\u4f5c\u6d41\u7a0b\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Driving vision-language-action (VLA) models increasingly reason before acting, but their intermediate reasoning is often weakly grounded in physical scene evidence and loosely connected to executable behavior. We present GRAVA, a framework built around Grounded Reasoning-to-Action (GRA), which unifies grounding, reasoning, and action generation in a single autoregressive stream. GRA links action-relevant language references to 2D visual regions and ego-centric physical states, organizes object interactions and decisions in a trajectory-anchored typed graph, and serializes this structure into grounded reasoning. A single VLM generates this reasoning followed by a compact Executable Planner action that is deterministically decoded into a continuous trajectory. We further introduce an agentic GRA data construction pipeline that combines forward scene grounding with backward trajectory anchoring, and use it to build GR-NavSim with 2.2M grounded question-answer pairs and 70K GRA reasoning traces. A progressive training strategy develops grounded cognition through pre-training, establishes the reasoning-to-action interface through imitation, and improves driving behavior through reinforcement learning and exploration. Using about 60% of the available human driving demonstrations for action supervision, GRAVA-8B achieves state-of-the-art performance among purely autoregressive driving models on the full NAVSIM benchmark. On an internal long-tail benchmark, full GRA improves key-object compliance and Closed-loop Driving Score by 19.3% and 20.5% over action-only prediction, respectively. These results show the benefit of preserving action-relevant physical evidence from grounded reasoning through executable action generation.", "arxiv_id": "2609.15169", "arxiv_url": "https://arxiv.org/abs/2609.15169", "authors": ["Xiao Liu", "Haoyu Li", "Jianghao Leng", "Lin Wang", "Chao Sun"], "brief": "GRAVA\u63d0\u51faGrounded Reasoning-to-Action\u8868\u793a\uff0c\u5c06\u89c6\u89c9 grounding\u3001\u573a\u666f\u63a8\u7406\u4e0e\u53ef\u6267\u884c\u8f68\u8ff9\u751f\u6210\u7edf\u4e00\u5230\u5355\u4e00\u81ea\u56de\u5f52\u6d41\u4e2d\u3002\u6a21\u578b\u5148\u751f\u6210\u5e26\u7269\u4f53\u533a\u57df\u3001\u7269\u7406\u72b6\u6001\u548c\u4ea4\u4e92\u56fe\u7684 grounded reasoning\uff0c\u518d\u8f93\u51fa\u53ef\u786e\u5b9a\u6027\u89e3\u7801\u4e3a\u8fde\u7eed\u8f68\u8ff9\u7684\u89c4\u5212\u52a8\u4f5c\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15169", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["GRA\u628a\u52a8\u4f5c\u76f8\u5173\u8bed\u8a00\u6307\u4ee3\u94fe\u63a5\u52302D\u89c6\u89c9\u533a\u57df\u548c\u81ea\u8f66\u4e2d\u5fc3\u7269\u7406\u72b6\u6001\uff0c\u5e76\u7528\u8f68\u8ff9\u951a\u5b9a\u7684\u7c7b\u578b\u56fe\u7ec4\u7ec7\u7269\u4f53\u4ea4\u4e92\u4e0e\u51b3\u7b56\u3002", "\u6784\u5efaGR-NavSim\u6570\u636e\u96c6\uff0c\u5305\u542b220\u4e07 grounded \u95ee\u7b54\u5bf9\u548c7\u4e07\u6761GRA\u63a8\u7406\u8f68\u8ff9\uff0c\u6570\u636e\u7531\u524d\u5411\u573a\u666fgrounding\u4e0e\u53cd\u5411\u8f68\u8ff9\u951a\u5b9a\u6d41\u7a0b\u751f\u6210\u3002", "\u91c7\u7528\u9884\u8bad\u7ec3\u3001\u6a21\u4eff\u5b66\u4e60\u3001\u5f3a\u5316\u5b66\u4e60\u4e0e\u63a2\u7d22\u7684\u6e10\u8fdb\u8bad\u7ec3\uff1bGRAVA-8B\u5728\u4ec5\u7528\u7ea660%\u52a8\u4f5c\u76d1\u7763\u6570\u636e\u65f6\uff0c\u5728NAVSIM\u7eaf\u81ea\u56de\u5f52\u9a7e\u9a76\u6a21\u578b\u4e2d\u8fbe\u5230SOTA\u3002"], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5177\u8eab\u667a\u80fd", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15169", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GRAVA: Grounded Reasoning-to-Action Representation and Learning for Autonomous Driving", "tldr": "\u8ba9\u81ea\u52a8\u9a7e\u9a76VLA\u7684\u63a8\u7406\u53ef\u843d\u5730\u5230\u8f68\u8ff9\u52a8\u4f5c", "upvotes": 0, "what_it_is": "GRAVA\u63d0\u51faGrounded Reasoning-to-Action\u8868\u793a\uff0c\u5c06\u89c6\u89c9 grounding\u3001\u573a\u666f\u63a8\u7406\u4e0e\u53ef\u6267\u884c\u8f68\u8ff9\u751f\u6210\u7edf\u4e00\u5230\u5355\u4e00\u81ea\u56de\u5f52\u6d41\u4e2d\u3002\u6a21\u578b\u5148\u751f\u6210\u5e26\u7269\u4f53\u533a\u57df\u3001\u7269\u7406\u72b6\u6001\u548c\u4ea4\u4e92\u56fe\u7684 grounded reasoning\uff0c\u518d\u8f93\u51fa\u53ef\u786e\u5b9a\u6027\u89e3\u7801\u4e3a\u8fde\u7eed\u8f68\u8ff9\u7684\u89c4\u5212\u52a8\u4f5c\u3002", "why_notable": "\u5b83\u9488\u5bf9\u9a7e\u9a76VLA\u4e2d\u201c\u4f1a\u8bf4\u4f46\u4e0d\u4e00\u5b9a\u57fa\u4e8e\u7269\u7406\u8bc1\u636e\u884c\u52a8\u201d\u7684\u95ee\u9898\uff0c\u5c06\u53ef\u9a8c\u8bc1\u7684\u573a\u666f\u8bc1\u636e\u6301\u7eed\u4f20\u9012\u5230\u53ef\u6267\u884c\u89c4\u5212\u52a8\u4f5c\uff0c\u5728\u957f\u5c3e\u573a\u666f\u4e2d\u663e\u8457\u63d0\u5347\u5173\u952e\u76ee\u6807\u9075\u5faa\u548c\u95ed\u73af\u9a7e\u9a76\u5f97\u5206\uff0c\u5177\u6709\u8f83\u5f3a\u81ea\u52a8\u9a7e\u9a76\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "When Emergence World placed frontier LLM agents in an unsupervised multi-agent simulation, the results were alarming: agents committed crimes, starved, and enforced unanimous conformity -- without any external attacker. This paper identifies the mechanism. Reflexion-style agents already detect dangerous plan steps through iterative self-critique, yet the architecture provides no pathway from detection to action. We call this the enforcement gap: the audit sees the problem; the controller ignores it. Closing the gap requires a single conditional check -- fewer than 20 lines of code -- and reduces attack success by more than fourfold in large-scale experiments across frontier models, all five major agent frameworks, and an independent benchmark. We prove formally that when enforcement probability is near zero, detection quality is irrelevant to security. We further identify two compounding failure modes -- unreliable auditors and unparseable verdicts -- that explain every collapse pattern in Emergence World. A GRPO-trained enforcement controller resolves the ambiguity case. Together these results motivate a three-requirement Audit Enforcement Specification that is absent from every deployed framework today.", "arxiv_id": "2609.15293", "arxiv_url": "https://arxiv.org/abs/2609.15293", "authors": ["Yuhang Wang"], "brief": "\u8bba\u6587\u6307\u51fa\u591a\u667a\u80fd\u4f53\u4eff\u771f\u4e2d\u72af\u7f6a\u3001\u9965\u997f\u548c\u4e00\u81f4\u6027\u5f3a\u5236\u7b49\u5931\u63a7\u73b0\u8c61\u7684\u6838\u5fc3\u673a\u5236\u662f\u201c\u6267\u884c\u7f3a\u53e3\u201d\uff1a\u81ea\u6211\u53cd\u601d\u6a21\u5757\u80fd\u53d1\u73b0\u5371\u9669\u6b65\u9aa4\uff0c\u4f46\u63a7\u5236\u5668\u4e0d\u4f1a\u636e\u6b64\u963b\u6b62\u884c\u52a8\u3002\u4f5c\u8005\u63d0\u51fa\u6700\u5c0f\u5316\u6267\u884c\u68c0\u67e5\u4e0e\u5ba1\u8ba1\u6267\u884c\u89c4\u8303\uff0c\u5e76\u7528\u5927\u89c4\u6a21\u5b9e\u9a8c\u548c\u5f62\u5f0f\u5316\u5206\u6790\u9a8c\u8bc1\u5176\u6709\u6548\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15293", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Reflexion\u5f0f\u667a\u80fd\u4f53\u867d\u80fd\u901a\u8fc7\u81ea\u6211\u6279\u5224\u68c0\u6d4b\u5371\u9669\u8ba1\u5212\uff0c\u4f46\u7f3a\u5c11\u4ece\u5ba1\u8ba1\u7ed3\u8bba\u5230\u884c\u52a8\u963b\u65ad\u7684\u63a7\u5236\u8def\u5f84\u3002", "\u52a0\u5165\u4e0d\u523020\u884c\u4ee3\u7801\u7684\u6761\u4ef6\u6267\u884c\u68c0\u67e5\uff0c\u53ef\u5728\u524d\u6cbf\u6a21\u578b\u3001\u4e94\u7c7b\u4e3b\u6d41\u667a\u80fd\u4f53\u6846\u67b6\u548c\u72ec\u7acb\u57fa\u51c6\u4e0a\u5c06\u653b\u51fb\u6210\u529f\u7387\u964d\u4f4e\u56db\u500d\u4ee5\u4e0a\u3002", "\u5f62\u5f0f\u5316\u8bc1\u660e\u5f53\u6267\u884c\u6982\u7387\u63a5\u8fd1\u96f6\u65f6\uff0c\u68c0\u6d4b\u8d28\u91cf\u5bf9\u5b89\u5168\u6027\u51e0\u4e4e\u65e0\u5173\uff1b\u5e76\u8bc6\u522b\u51fa\u4e0d\u53ef\u9760\u5ba1\u8ba1\u5668\u548c\u4e0d\u53ef\u89e3\u6790\u88c1\u51b3\u4e24\u7c7b\u590d\u5408\u5931\u6548\u6a21\u5f0f\u3002"], "keywords": ["\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u591a\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15293", "published_at": "2026-09-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Why LLM Agents Collapse Without Oversight: The Enforcement Gap as the Mechanism Behind Emergence World Failures", "tldr": "LLM\u667a\u80fd\u4f53\u5d29\u6e83\u6e90\u4e8e\u5ba1\u8ba1\u65e0\u6cd5\u5f3a\u5236\u6267\u884c\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6307\u51fa\u591a\u667a\u80fd\u4f53\u4eff\u771f\u4e2d\u72af\u7f6a\u3001\u9965\u997f\u548c\u4e00\u81f4\u6027\u5f3a\u5236\u7b49\u5931\u63a7\u73b0\u8c61\u7684\u6838\u5fc3\u673a\u5236\u662f\u201c\u6267\u884c\u7f3a\u53e3\u201d\uff1a\u81ea\u6211\u53cd\u601d\u6a21\u5757\u80fd\u53d1\u73b0\u5371\u9669\u6b65\u9aa4\uff0c\u4f46\u63a7\u5236\u5668\u4e0d\u4f1a\u636e\u6b64\u963b\u6b62\u884c\u52a8\u3002\u4f5c\u8005\u63d0\u51fa\u6700\u5c0f\u5316\u6267\u884c\u68c0\u67e5\u4e0e\u5ba1\u8ba1\u6267\u884c\u89c4\u8303\uff0c\u5e76\u7528\u5927\u89c4\u6a21\u5b9e\u9a8c\u548c\u5f62\u5f0f\u5316\u5206\u6790\u9a8c\u8bc1\u5176\u6709\u6548\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u667a\u80fd\u4f53\u5931\u63a7\u4ece\u201c\u6a21\u578b\u80fd\u529b\u4e0d\u8db3\u201d\u91cd\u65b0\u5b9a\u4f4d\u4e3a\u201c\u67b6\u6784\u6267\u884c\u673a\u5236\u7f3a\u5931\u201d\uff0c\u63d0\u51fa\u53ef\u76f4\u63a5\u843d\u5730\u7684\u5b89\u5168\u4fee\u8865\u65b9\u6848\uff0c\u5e76\u5bf9\u73b0\u6709\u667a\u80fd\u4f53\u6846\u67b6\u7684\u5ba1\u8ba1\u2014\u63a7\u5236\u63a5\u53e3\u63d0\u51fa\u660e\u786e\u89c4\u8303\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "Multi-Agent (MA) systems are effective at solving complex tasks that demand planning, tool use, and the synthesis of evidence from multiple sources. Existing systems typically adopt Hierarchical Manager-Worker (HMW) or Router-based Message Passing (RMP) structures as their communication protocol. However, these designs restrict agent autonomy: Worker agents cannot directly consult specific \"peers\", and misrouted messages can propagate errors. Inspired by bus architectures in computer systems, we propose BusMA, a communication framework t
