software repositories, yet cybersecurity evaluations primarily measure whether they can detect, reproduce, or repair vulnerabilities rather than whether they can locate the relevant code. We study vulnerability localization: given a weakness class and an unfamiliar repository, identify the implementation files associated with that weakness. We introduce the Vulnerability Localization Benchmark (VLoc Bench), comprising 500 real world vulnerabilities from 290 repositories across six package ecosystems and 147 CWE categories. Each task pairs repository snapshots immediately before and after a security fix. On the vulnerable snapshot, an agent receives only the CWE description and read-only terminal access and must return the affected files; on the patched snapshot, it must determine that the recorded vulnerability is no longer present. We evaluate 27 language models and four static-analysis tools under a common agent interface. Repository-scale vulnerability localization remains difficult: the strongest system achieves 0.229 File F1, and 38.4% of tasks receive no correct localization from any evaluated model. We further find that stronger localization does not imply reliable behavior after remediation: systems that identify vulnerable files effectively can still report unsupported locations on patched repositories. These results establish vulnerability localization as a distinct repository-scale capability and provide a setting for studying both how security agents search for vulnerable code and when they should refrain from reporting it.", "arxiv_id": "2609.15939", "arxiv_url": "https://arxiv.org/abs/2609.15939", "authors": ["Aman Priyanshu", "Supriti Vijay", "Kimia Majd", "Xuhong He", "Fraser Burch", "Takahiro Matsumoto", "Jianliang He", "Baturay Saglam", "Arthur Goldblatt", "Zhuoran Yang", "Amin Karbasi"], "brief": "\u672c\u6587\u63d0\u51fa VLoc Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u5b8c\u6574\u4ee3\u7801\u4ed3\u5e93\u4e2d\u6839\u636e CWE \u63cf\u8ff0\u5b9a\u4f4d\u6f0f\u6d1e\u76f8\u5173\u6587\u4ef6\u7684\u80fd\u529b\uff0c\u8986\u76d6 290 \u4e2a\u4ed3\u5e93\u3001500 \u4e2a\u771f\u5b9e\u6f0f\u6d1e\u548c 147 \u7c7b CWE\u3002\u5b9e\u9a8c\u8bc4\u6d4b 27 \u4e2a\u8bed\u8a00\u6a21\u578b\u548c 4 \u4e2a\u9759\u6001\u5206\u6790\u5de5\u5177\uff0c\u6700\u5f3a\u7cfb\u7edf File F1 \u4ec5 0.229\uff0c\u4e14\u4fee\u590d\u540e\u4ecd\u53ef\u80fd\u8bef\u62a5\uff0c\u8bf4\u660e\u4ed3\u5e93\u7ea7\u6f0f\u6d1e\u5b9a\u4f4d\u4ecd\u662f\u72ec\u7acb\u4e14\u56f0\u96be\u7684\u5b89\u5168\u5206\u6790\u80fd\u529b\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15939", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5b89\u5168", "\u6f0f\u6d1e\u5b9a\u4f4d", "\u4ee3\u7801\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15939", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Vulnerability Localization Benchmark: Measuring Agentic Security Analysis at Repository Scale", "tldr": "\u672c\u6587\u63d0\u51fa VLoc Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u5b8c\u6574\u4ee3\u7801\u4ed3\u5e93\u4e2d\u6839\u636e CWE \u63cf\u8ff0\u5b9a\u4f4d\u6f0f\u6d1e\u76f8\u5173\u6587\u4ef6\u7684\u80fd\u529b\uff0c\u8986\u76d6 290 \u4e2a\u4ed3\u5e93\u3001500 \u4e2a\u771f\u5b9e\u6f0f\u6d1e\u548c 147 \u7c7b CWE\u3002\u5b9e\u9a8c\u8bc4\u6d4b 27 \u4e2a\u8bed\u8a00\u6a21\u578b\u548c 4 \u4e2a\u9759\u6001\u5206\u6790\u5de5\u5177\uff0c\u6700\u5f3a\u7cfb\u7edf File F1 \u4ec5 0.229\uff0c\u4e14\u4fee\u590d\u540e\u4ecd\u53ef\u80fd\u8bef\u62a5\uff0c\u8bf4\u660e\u4ed3\u5e93\u7ea7\u6f0f\u6d1e\u5b9a\u4f4d\u4ecd\u662f\u72ec\u7acb\u4e14\u56f0\u96be\u7684\u5b89\u5168\u5206\u6790\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Skills extend an LLM agent beyond its parametric knowledge, and the gain they promise rests on picking the right one. Deployed harnesses route by preloading every skill\u0027s metadata into the context, which disperses the agent\u0027s attention and caps the library size. Retrieval pipelines move the selection out of the context, but also out of the agent\u0027s capability. We show that the frozen agent LLM already carries the routing signal in its own forward passes, and that two linear maps suffice to read it out with no skill text in the context. Gavel (Glance And Verdict from a frozen LLM) reads it in two steps. A glance projects the task\u0027s and each skill\u0027s mid-layer states through the two maps, the only parameters trained, and scores the full library against compact per-skill banks that one forward pass builds at installation. A verdict then resumes the shortlisted skills\u0027 forward passes and reads the model\u0027s own likelihood and yes/no judgment, fused with the glance as a product of experts. Trained once, Gavel transfers zero-shot to three public benchmarks and SkillTraj, our new benchmark of 372 simulated agent trajectories. On Qwen3-32B it outperforms progressive disclosure and retrieve-and-rerank pipelines that add 1.2B to 16B external parameters, by up to 13.4 points on written tasks and up to 21.9 when the need for a skill arises mid-rollout. Routing accuracy improves as the backbone does, and in a bash-agent harness the same 32B triggers the correct skill on Skill-Use more often than far larger frontier models running in Codex.", "arxiv_id": "2609.15982", "arxiv_url": "https://arxiv.org/abs/2609.15982", "authors": ["Ruishuo Chen", "Xun Wang", "Yu Chen", "Zhuoran Li", "Longbo Huang"], "brief": "\u8bba\u6587\u63d0\u51fa Gavel\uff0c\u4ece\u51bb\u7ed3 LLM \u7684\u524d\u5411\u4e2d\u5c42\u72b6\u6001\u4e2d\u8bfb\u51fa\u201c\u6280\u80fd\u8def\u7531\u201d\u4fe1\u53f7\uff0c\u53ea\u8bad\u7ec3\u4e24\u4e2a\u7ebf\u6027\u6620\u5c04\uff0c\u65e0\u9700\u628a\u6240\u6709\u6280\u80fd\u6587\u672c\u585e\u8fdb\u4e0a\u4e0b\u6587\u3002\u8be5\u65b9\u6cd5\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u591a\u4e2a\u57fa\u51c6\uff0c\u5728 Qwen3-32B \u4e0a\u4f18\u4e8e\u5e26\u5927\u91cf\u5916\u90e8\u53c2\u6570\u7684\u68c0\u7d22\u4e0e\u91cd\u6392\u65b9\u6848\uff0c\u5c24\u5176\u5728 rollout \u4e2d\u9014\u9700\u8981\u8c03\u7528\u6280\u80fd\u65f6\u63d0\u5347\u660e\u663e\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15982", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6280\u80fd\u8def\u7531", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15982", "published_at": "2026-09-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "The Router Within: Eliciting Native Skill Routing from a Frozen LLM", "tldr": "\u8bba\u6587\u63d0\u51fa Gavel\uff0c\u4ece\u51bb\u7ed3 LLM \u7684\u524d\u5411\u4e2d\u5c42\u72b6\u6001\u4e2d\u8bfb\u51fa\u201c\u6280\u80fd\u8def\u7531\u201d\u4fe1\u53f7\uff0c\u53ea\u8bad\u7ec3\u4e24\u4e2a\u7ebf\u6027\u6620\u5c04\uff0c\u65e0\u9700\u628a\u6240\u6709\u6280\u80fd\u6587\u672c\u585e\u8fdb\u4e0a\u4e0b\u6587\u3002\u8be5\u65b9\u6cd5\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\u5230\u591a\u4e2a\u57fa\u51c6\uff0c\u5728 Qwen3-32B \u4e0a\u4f18\u4e8e\u5e26\u5927\u91cf\u5916\u90e8\u53c2\u6570\u7684\u68c0\u7d22\u4e0e\u91cd\u6392\u65b9\u6848\uff0c\u5c24\u5176\u5728 rollout \u4e2d\u9014\u9700\u8981\u8c03\u7528\u6280\u80fd\u65f6\u63d0\u5347\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The total scaled-gradient variation (TSGV) regularizer, derived from sparse modeling of piecewise-linear structures, has been shown to preserve edges and corners in image restoration. However, its highly nonconvex and nonlinear nature poses severe computational challenges, as existing methods often suffer from parameter sensitivity or lack convergence guarantees. To overcome this, we propose a tailored bilinear decomposition that decouples the nonlinear weighted gradient in the TSGV regularizer. This approach yields an equivalent optimization problem governed by cone or sphere constraints, depending on the chosen scaling function. In particular, the cone constraint plays a central role in characterizing edge- and corner-preserving behavior. We solve this reformulation using the alternating minimization method (AMM) equipped with a majorization--minimization strategy, ensuring a monotonic decrease in energy without step-size tuning. Furthermore, we provide a geometric interpretation of the edge-preserving properties of these constraints by analyzing their asymptotic behavior near image singularities. We establish the global convergence of the proposed method to a critical point within the Kurdyka--\u0141ojasiewicz framework. Extensive numerical experiments on Gaussian denoising and non-line-of-sight (NLOS) imaging show that the proposed method achieves PSNR and SSIM competitive with or superior to representative variational methods, especially at high noise levels, and improves the structural reconstruction under dense and sparse scanning.", "arxiv_id": "2609.00036", "arxiv_url": "https://arxiv.org/abs/2609.00036", "authors": ["Haibin Su", "Chunlin Wu", "Huibin Chang", "Zhifang Liu"], "brief": "\u8bba\u6587\u9488\u5bf9\u603b\u7f29\u653e\u68af\u5ea6\u53d8\u5206\uff08TSGV\uff09\u6b63\u5219\u5316\u7684\u5f3a\u975e\u51f8\u3001\u975e\u7ebf\u6027\u4f18\u5316\u96be\u9898\uff0c\u63d0\u51fa\u9525/\u7403\u7ea6\u675f\u7684\u53cc\u7ebf\u6027\u5206\u89e3\uff0c\u5e76\u7528\u5e26\u4e3b\u5316-\u6700\u5c0f\u5316\u7b56\u7565\u7684\u4ea4\u66ff\u6700\u5c0f\u5316\u7b97\u6cd5\u6c42\u89e3\u3002\u65b9\u6cd5\u65e0\u9700\u6b65\u957f\u8c03\u53c2\uff0c\u8bc1\u660e\u4e86\u5728Kurdyka-\u0141ojasiewicz\u6846\u67b6\u4e0b\u5168\u5c40\u6536\u655b\u5230\u4e34\u754c\u70b9\uff1b\u5728\u9ad8\u566a\u58f0\u53bb\u566a\u548c\u975e\u89c6\u8ddd\u6210\u50cf\u4e2d\u53d6\u5f97\u4e86\u6709\u7ade\u4e89\u529b\u6216\u66f4\u4f18\u7684PSNR/SSIM\u4e0e\u7ed3\u6784\u91cd\u5efa\u6548\u679c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00036", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u6062\u590d", "\u53d8\u5206\u65b9\u6cd5", "\u975e\u51f8\u4f18\u5316", "\u975e\u89c6\u8ddd\u6210\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00036", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Globally Convergent Algorithm for Total Scaled-Gradient Variation via Cone-Constrained Bilinear Decomposition", "tldr": "\u8bba\u6587\u9488\u5bf9\u603b\u7f29\u653e\u68af\u5ea6\u53d8\u5206\uff08TSGV\uff09\u6b63\u5219\u5316\u7684\u5f3a\u975e\u51f8\u3001\u975e\u7ebf\u6027\u4f18\u5316\u96be\u9898\uff0c\u63d0\u51fa\u9525/\u7403\u7ea6\u675f\u7684\u53cc\u7ebf\u6027\u5206\u89e3\uff0c\u5e76\u7528\u5e26\u4e3b\u5316-\u6700\u5c0f\u5316\u7b56\u7565\u7684\u4ea4\u66ff\u6700\u5c0f\u5316\u7b97\u6cd5\u6c42\u89e3\u3002\u65b9\u6cd5\u65e0\u9700\u6b65\u957f\u8c03\u53c2\uff0c\u8bc1\u660e\u4e86\u5728Kurdyka-\u0141ojasiewicz\u6846\u67b6\u4e0b\u5168\u5c40\u6536\u655b\u5230\u4e34\u754c\u70b9\uff1b\u5728\u9ad8\u566a\u58f0\u53bb\u566a\u548c\u975e\u89c6\u8ddd\u6210\u50cf\u4e2d\u53d6\u5f97\u4e86\u6709\u7ade\u4e89\u529b\u6216\u66f4\u4f18\u7684PSNR/SSIM\u4e0e\u7ed3\u6784\u91cd\u5efa\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Contact-rich assembly remains challenging because it requires submillimeter spatial accuracy and reliable interpretation of forces during sustained contact. Although simulation-based reinforcement learning offers a scalable training paradigm, discrepancies in visual observations, contact dynamics, and force/torque (F/T) measurements often limit policy transfer. We observe that proprioception is comparatively consistent across domains because joint positions are expressed in a shared calibrated coordinate system and joint velocities are computed consistently in simulation and on hardware. Based on this observation, we present PACE (Proprioception-Anchored Cross-Modal Encoder), which supervises temporal visual and F/T representations by predicting proprioceptive state transitions. Static domain-specific factors, including lighting, texture, and sensor bias, contain little information about joint motion; the proposed objective therefore encourages the encoder to suppress these factors while retaining task-relevant motion cues. Policies trained on frozen PACE features are deployed on hardware without real-world fine-tuning or object-pose tracking. Across four contact-rich assembly tasks, PACE attains an average real-world success rate of 93.3\\% and only a 2.7-percentage-point sim-to-real drop, while remaining robust to perturbations that substantially degrade pose-based and learned-fusion baselines.", "arxiv_id": "2609.07534", "arxiv_url": "https://arxiv.org/abs/2609.07534", "authors": ["Yuhan Wang", "Yurou Chen", "Hongye Jiang", "Wenzhao Lian"], "brief": "\u8bba\u6587\u63d0\u51fa PACE\uff0c\u7528\u672c\u4f53\u611f\u77e5\u72b6\u6001\u8f6c\u79fb\u6765\u76d1\u7763\u89c6\u89c9\u4e0e\u529b/\u626d\u77e9\u65f6\u5e8f\u8868\u793a\u5b66\u4e60\uff0c\u4ece\u800c\u6291\u5236\u5149\u7167\u3001\u7eb9\u7406\u3001\u4f20\u611f\u5668\u504f\u7f6e\u7b49\u57df\u76f8\u5173\u5e72\u6270\u3002\u57fa\u4e8e\u51bb\u7ed3 PACE \u7279\u5f81\u8bad\u7ec3\u7684\u7b56\u7565\u53ef\u96f6\u6837\u672c\u90e8\u7f72\u5230\u771f\u5b9e\u786c\u4ef6\uff0c\u5728\u56db\u4e2a\u63a5\u89e6\u4e30\u5bcc\u88c5\u914d\u4efb\u52a1\u4e0a\u8fbe\u5230 93.3% \u5e73\u5747\u6210\u529f\u7387\uff0c\u4eff\u771f\u5230\u73b0\u5b9e\u4ec5\u4e0b\u964d 2.7 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.07534", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u4eff\u771f\u5230\u73b0\u5b9e", "\u591a\u6a21\u6001", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.07534", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Proprioception-Anchored Cross-Modal Pretraining for Zero-Shot Sim-to-Real Contact-Rich Assembly", "tldr": "\u8bba\u6587\u63d0\u51fa PACE\uff0c\u7528\u672c\u4f53\u611f\u77e5\u72b6\u6001\u8f6c\u79fb\u6765\u76d1\u7763\u89c6\u89c9\u4e0e\u529b/\u626d\u77e9\u65f6\u5e8f\u8868\u793a\u5b66\u4e60\uff0c\u4ece\u800c\u6291\u5236\u5149\u7167\u3001\u7eb9\u7406\u3001\u4f20\u611f\u5668\u504f\u7f6e\u7b49\u57df\u76f8\u5173\u5e72\u6270\u3002\u57fa\u4e8e\u51bb\u7ed3 PACE \u7279\u5f81\u8bad\u7ec3\u7684\u7b56\u7565\u53ef\u96f6\u6837\u672c\u90e8\u7f72\u5230\u771f\u5b9e\u786c\u4ef6\uff0c\u5728\u56db\u4e2a\u63a5\u89e6\u4e30\u5bcc\u88c5\u914d\u4efb\u52a1\u4e0a\u8fbe\u5230 93.3% \u5e73\u5747\u6210\u529f\u7387\uff0c\u4eff\u771f\u5230\u73b0\u5b9e\u4ec5\u4e0b\u964d 2.7 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Action Models (WAMs) couple predictive world modeling with action generation, allowing anticipated future states to guide agent behavior. Although WAMs are rapidly advancing embodied AI, general-purpose counterparts remain largely unexplored in games. Existing game-oriented approaches often combine action-conditioned world models with external policies and reward functions to realize WAM-like decision-making, yet they operate mainly in 2D visual observation space and do not instantiate persistent 3D geometry. Extending this paradigm to 3D games introduces a distinct challenge. In autonomous driving and robotics, the physical environment exists independently of the model, providing a persistent 3D world in which selected actions can be executed. Games have no such external substrate; the virtual world itself must be instantiated. Most playable games require a persistent and navigable space, while 3D games additionally require explicit geometry that supports movement and interaction. Action-conditioned video rollouts provide visual observations but not this spatial representation. We present \\textsc{Valerant}, a training-free framework that transforms a pretrained action-conditioned world model into a WAM for exploring and constructing 3D game maps. By coupling predictive visual rollouts with SLAM-based spatial reconstruction and exploration-driven action selection, \\textsc{Valerant} progressively transforms a single image into a persistent 3D game map. This framework extends WAM-based interaction beyond 2D visual simulation and offers a new approach to reducing manual effort in 3D game-map creation.", "arxiv_id": "2609.09418", "arxiv_url": "https://arxiv.org/abs/2609.09418", "authors": ["Yiran Qiao", "Feng Wang", "Jing Ma"], "brief": "\u672c\u6587\u63d0\u51fa Valerant\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6846\u67b6\uff0c\u5c06\u9884\u8bad\u7ec3\u7684\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u7528\u4e8e\u63a2\u7d22\u5e76\u6784\u5efa 3D \u6e38\u620f\u5730\u56fe\u3002\u5b83\u7ed3\u5408\u89c6\u89c9\u9884\u6d4b\u3001SLAM \u7a7a\u95f4\u91cd\u5efa\u548c\u63a2\u7d22\u5f0f\u52a8\u4f5c\u9009\u62e9\uff0c\u53ef\u4ece\u5355\u5f20\u56fe\u50cf\u9010\u6b65\u751f\u6210\u6301\u4e45\u3001\u53ef\u5bfc\u822a\u7684 3D \u6e38\u620f\u7a7a\u95f4\uff0c\u964d\u4f4e\u624b\u5de5\u5236\u56fe\u6210\u672c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.09418", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u6e38\u620f\u751f\u6210", "\u4e09\u7ef4\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.09418", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Valerant: An Automatic Navigable Game Map Generator via Action-Conditioned World Model Exploration", "tldr": "\u672c\u6587\u63d0\u51fa Valerant\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u6846\u67b6\uff0c\u5c06\u9884\u8bad\u7ec3\u7684\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u7528\u4e8e\u63a2\u7d22\u5e76\u6784\u5efa 3D \u6e38\u620f\u5730\u56fe\u3002\u5b83\u7ed3\u5408\u89c6\u89c9\u9884\u6d4b\u3001SLAM \u7a7a\u95f4\u91cd\u5efa\u548c\u63a2\u7d22\u5f0f\u52a8\u4f5c\u9009\u62e9\uff0c\u53ef\u4ece\u5355\u5f20\u56fe\u50cf\u9010\u6b65\u751f\u6210\u6301\u4e45\u3001\u53ef\u5bfc\u822a\u7684 3D \u6e38\u620f\u7a7a\u95f4\uff0c\u964d\u4f4e\u624b\u5de5\u5236\u56fe\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) and World-Action Models (WAMs) have demonstrated strong capabilities in general-purpose robotic manipulation, yet their generated actions may violate hard physical constraints and therefore be unsafe or infeasible for deployment. Existing safety approaches either optimize statistical safety objectives without deterministic per-step guarantees or correct unsafe actions only during inference, creating a mismatch between policy training and execution. We introduce ActSafeGuard, a differentiable and training-aligned safeguard layer for flow-matching based policies. ActSafeGuard integrates hard action feasibility into policy learning, not merely treating safety as an inference-time external component. Through an analytical ray-scaling operator design, ActSafeGuard enables boundary-aware gradients to guide the model to naturally learn constrained manifolds. Extensive experiments on multiple standard foundation backbones ($\u03c0_{0.5}$ and Fast-WAM) across various tasks demonstrate that ActSafeGuard consistently achieves a $100\\%$ step safety rate while fully preserving or even boosting task success rates, providing a scalable and minimally invasive solution for safe embodied AI deployment.", "arxiv_id": "2609.11697", "arxiv_url": "https://arxiv.org/abs/2609.11697", "authors": ["Jianming Ma", "Rongjun Jin", "Xiaxi Si", "Yang Zhang", "Yiheng Li", "Yue Gao"], "brief": "\u672c\u6587\u63d0\u51fa ActSafeGuard\uff0c\u4e00\u4e2a\u9762\u5411 flow-matching \u673a\u5668\u4eba\u7b56\u7565\u7684\u53ef\u5fae\u5b89\u5168\u7ea6\u675f\u5c42\uff0c\u5c06\u786c\u52a8\u4f5c\u53ef\u884c\u6027\u76f4\u63a5\u7eb3\u5165\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u800c\u4e0d\u662f\u53ea\u5728\u63a8\u7406\u65f6\u4fee\u6b63\u52a8\u4f5c\u3002\u901a\u8fc7\u89e3\u6790\u7684 ray-scaling \u7b97\u5b50\u63d0\u4f9b\u8fb9\u754c\u611f\u77e5\u68af\u5ea6\uff0c\u5728\u591a\u4e2a VLA/WAM \u9aa8\u5e72\u548c\u4efb\u52a1\u4e0a\u5b9e\u73b0 100% \u5355\u6b65\u5b89\u5168\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.11697", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u5b89\u5168\u7ea6\u675f", "\u5177\u8eab\u667a\u80fd", "\u6d41\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.11697", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ActSafeGuard: Differentiable and Training-Aligned Constraint Enforcement for Flow-Matching Policies", "tldr": "\u672c\u6587\u63d0\u51fa ActSafeGuard\uff0c\u4e00\u4e2a\u9762\u5411 flow-matching \u673a\u5668\u4eba\u7b56\u7565\u7684\u53ef\u5fae\u5b89\u5168\u7ea6\u675f\u5c42\uff0c\u5c06\u786c\u52a8\u4f5c\u53ef\u884c\u6027\u76f4\u63a5\u7eb3\u5165\u8bad\u7ec3\u8fc7\u7a0b\uff0c\u800c\u4e0d\u662f\u53ea\u5728\u63a8\u7406\u65f6\u4fee\u6b63\u52a8\u4f5c\u3002\u901a\u8fc7\u89e3\u6790\u7684 ray-scaling \u7b97\u5b50\u63d0\u4f9b\u8fb9\u754c\u611f\u77e5\u68af\u5ea6\uff0c\u5728\u591a\u4e2a VLA/WAM \u9aa8\u5e72\u548c\u4efb\u52a1\u4e0a\u5b9e\u73b0 100% \u5355\u6b65\u5b89\u5168\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Semantic watermarks for diffusion models embed ownership information into the generative process while preserving perceptual quality, but Gaussian-Shading extraction conventionally requires multi-step diffusion inversion to recover the initial noise. Recent one-step methods show that this cost can be reduced substantially. We study this problem through extended flow matching and conditional regression. The key observation is that, near the high-SNR image endpoint, recovering a useful noise statistic given by the first-step output of the extended flow matching in the high-SNR regime is much simpler than reconstructing the full inverse trajectory, and Gaussian Shading only requires the recovered latent to remain in the correct watermark decision region. Based on this observation, we propose a lightweight, prompt-free extractor that decomposes endpoint recovery into an image-like anchor and a noise-oriented residual, which increases the capability of the model to utilize GPU parallel computation. The resulting method avoids iterative inversion and repeated evaluation of a diffusion-scale U-Net, providing an efficient one-step extraction pipeline with a concise theoretical interpretation. The computational cost of extracting noise is lower than that of both OSI and FARI. The github repo is there: https://github.com/TheLovesOfLadyPurple/RAIN-lightweight-NN-for-one-step-semantic-watermark-extraction", "arxiv_id": "2609.14856", "arxiv_url": "https://arxiv.org/abs/2609.14856", "authors": ["Zilai Li"], "brief": "\u672c\u6587\u63d0\u51fa RAIN\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u6a21\u578b\u8bed\u4e49\u6c34\u5370\u7684\u8f7b\u91cf\u7ea7\u3001\u65e0\u9700\u63d0\u793a\u8bcd\u7684\u4e00\u6b65\u63d0\u53d6\u7f51\u7edc\u3002\u5b83\u5c06\u7aef\u70b9\u6062\u590d\u5206\u89e3\u4e3a\u56fe\u50cf\u951a\u70b9\u548c\u566a\u58f0\u6b8b\u5dee\uff0c\u907f\u514d\u591a\u6b65\u53cd\u6f14\u548c\u53cd\u590d\u8c03\u7528\u6269\u6563 U-Net\uff0c\u5728\u4fdd\u6301\u6c34\u5370\u5224\u5b9a\u6709\u6548\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63d0\u53d6\u8ba1\u7b97\u6210\u672c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14856", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6570\u5b57\u6c34\u5370", "\u6a21\u578b\u53cd\u6f14", "\u8ba1\u7b97\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14856", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RAIN: Region-Aware Inversion Network for Semantic Watermark Extraction", "tldr": "\u672c\u6587\u63d0\u51fa RAIN\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u6a21\u578b\u8bed\u4e49\u6c34\u5370\u7684\u8f7b\u91cf\u7ea7\u3001\u65e0\u9700\u63d0\u793a\u8bcd\u7684\u4e00\u6b65\u63d0\u53d6\u7f51\u7edc\u3002\u5b83\u5c06\u7aef\u70b9\u6062\u590d\u5206\u89e3\u4e3a\u56fe\u50cf\u951a\u70b9\u548c\u566a\u58f0\u6b8b\u5dee\uff0c\u907f\u514d\u591a\u6b65\u53cd\u6f14\u548c\u53cd\u590d\u8c03\u7528\u6269\u6563 U-Net\uff0c\u5728\u4fdd\u6301\u6c34\u5370\u5224\u5b9a\u6709\u6548\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63d0\u53d6\u8ba1\u7b97\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Warning: This submission studies stereotypes and biases, and contains toxic and offensive examples, used for illustration purposes only. Fairness benchmarks such as BBQ have become the de facto standard for fairness evaluation across major model families. We argue that these benchmarks are too easy to support their role: training Qwen 2.5 7B Base with Group Relative Policy Optimization (GRPO) on a single BBQ example, or placing that example in context as a one-shot demonstration for in-context learning (ICL), lifts mean BBQ accuracy from 79.9% to 92.9% and 99.0%, respectively, closing 80% of the gap to its large-scale RLHF counterpart (96.1%) with GRPO, and surpassing it with ICL. These effects generalize across model families. A cross-conditioning analysis shows the improvement is carried by the reasoning traces generated by the model, and one example suffices to elicit a category-agnostic ``missing evidence\u0027\u0027 reasoning pattern. We argue that BBQ-style multiple-choice abstention benchmarks measure a single structural cue, and a model that solves them does not thereby become fair. We call for evaluation suites that cover a broader spectrum of fairness alignment.", "arxiv_id": "2609.14860", "arxiv_url": "https://arxiv.org/abs/2609.14860", "authors": ["Naihao Deng", "Samee Arif", "Shuaichen Chang", "Yulong Chen", "Rada Mihalcea"], "brief": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u516c\u5e73\u6027\u57fa\u51c6\uff08\u5982 BBQ\uff09\u8fc7\u4e8e\u5bb9\u6613\u88ab\u201c\u7ed3\u6784\u6027\u7ebf\u7d22\u201d\u653b\u7834\uff1a\u4ec5\u7528\u4e00\u4e2a BBQ \u6837\u4f8b\u505a GRPO \u8bad\u7ec3\u6216\u4f5c\u4e3a one-shot ICL\uff0c\u5c31\u80fd\u8ba9 Qwen 2.5 7B Base \u7684 BBQ \u51c6\u786e\u7387\u4ece 79.9% \u63d0\u5347\u5230 92.9%/99.0%\u3002\u4f5c\u8005\u901a\u8fc7\u8de8\u6761\u4ef6\u5206\u6790\u53d1\u73b0\uff0c\u63d0\u5347\u4e3b\u8981\u6765\u81ea\u6a21\u578b\u5b66\u4f1a\u4e86\u901a\u7528\u7684\u201c\u8bc1\u636e\u4e0d\u8db3\u5219\u56de\u907f\u5224\u65ad\u201d\u63a8\u7406\u6a21\u5f0f\uff0c\u56e0\u6b64\u901a\u8fc7\u8fd9\u7c7b\u57fa\u51c6\u5e76\u4e0d\u7b49\u4e8e\u6a21\u578b\u771f\u6b63\u66f4\u516c\u5e73\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14860", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u516c\u5e73\u6027\u8bc4\u6d4b", "\u5bf9\u9f50", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14860", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Example Is Enough to Pass Fairness Benchmarks: Rethinking Fairness Evaluation for Aligned LLMs", "tldr": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u516c\u5e73\u6027\u57fa\u51c6\uff08\u5982 BBQ\uff09\u8fc7\u4e8e\u5bb9\u6613\u88ab\u201c\u7ed3\u6784\u6027\u7ebf\u7d22\u201d\u653b\u7834\uff1a\u4ec5\u7528\u4e00\u4e2a BBQ \u6837\u4f8b\u505a GRPO \u8bad\u7ec3\u6216\u4f5c\u4e3a one-shot ICL\uff0c\u5c31\u80fd\u8ba9 Qwen 2.5 7B Base \u7684 BBQ \u51c6\u786e\u7387\u4ece 79.9% \u63d0\u5347\u5230 92.9%/99.0%\u3002\u4f5c\u8005\u901a\u8fc7\u8de8\u6761\u4ef6\u5206\u6790\u53d1\u73b0\uff0c\u63d0\u5347\u4e3b\u8981\u6765\u81ea\u6a21\u578b\u5b66\u4f1a\u4e86\u901a\u7528\u7684\u201c\u8bc1\u636e\u4e0d\u8db3\u5219\u56de\u907f\u5224\u65ad\u201d\u63a8\u7406\u6a21\u5f0f\uff0c\u56e0\u6b64\u901a\u8fc7\u8fd9\u7c7b\u57fa\u51c6\u5e76\u4e0d\u7b49\u4e8e\u6a21\u578b\u771f\u6b63\u66f4\u516c\u5e73\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A deployed language model may refuse a harmful request in English yet comply with its faithful translation, revealing a cross-lingual safety failure that cannot be characterized reliably by output behavior alone. We formalize this phenomenon through an audited equivalence relation and show that, for a declared quotient, representation, metric, feature dictionary, scoring head, threshold, and contrast model, the resulting safety drift admits an exact linear-algebraic characterization. Specifically, the drift is a cross-Gram functional of the within-fiber contrast; its worst admissible value is a support function, while margin invariance is characterized by an annihilator condition. We introduce an intrinsic calibrated exposure measure, governed by the leverage duality $\u03c7^2=1/\\ell-1$, which separates observed drift into three diagnostically distinct regimes: a reader fault removable by recalibration, an exact correction that is too ill-conditioned to be reliable, and a representation-level collision that no readout-only intervention can remove. Thus, identical observed exposure can lead to fundamentally different remediation verdicts. The framework also extends to cone-valued safety heads. An untied order-swap identity provides a diagnostic for the linear control interface; its calibration-state residual predicts a distinct three-control composition error on unseen states and targets, achieving median Spearman correlation $0.964$, compared with $0.269$ for a static cross-Gram baseline. etc.....", "arxiv_id": "2609.14861", "arxiv_url": "https://arxiv.org/abs/2609.14861", "authors": ["Mohammed Ahnouch", "Lotfi Elaachack"], "brief": "\u8bba\u6587\u5f62\u5f0f\u5316\u4e86\u8bed\u8a00\u6a21\u578b\u5728\u7b49\u4ef7\u8f93\u5165\uff08\u5982\u8de8\u8bed\u8a00\u7ffb\u8bd1\uff09\u4e2d\u51fa\u73b0\u5b89\u5168\u62d2\u7b54\u4e0d\u4e00\u81f4\u7684\u201c\u5b89\u5168\u6f02\u79fb\u201d\u95ee\u9898\uff0c\u5e76\u7528\u7ebf\u6027\u4ee3\u6570\u523b\u753b\u5176\u5728\u8fc7\u5b8c\u5907\u8868\u793a\u4e2d\u7684\u6765\u6e90\u3002\u4f5c\u8005\u63d0\u51fa\u6821\u51c6\u66b4\u9732\u5ea6\u91cf\uff0c\u5c06\u6f02\u79fb\u533a\u5206\u4e3a\u53ef\u91cd\u6821\u51c6\u7684\u8bfb\u51fa\u9519\u8bef\u3001\u75c5\u6001\u6821\u6b63\u95ee\u9898\u548c\u8868\u793a\u5c42\u78b0\u649e\uff0c\u5e76\u7ed9\u51fa\u8bca\u65ad\u7ebf\u6027\u63a7\u5236\u63a5\u53e3\u7684\u5b9e\u9a8c\u6307\u6807\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14861", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u8868\u793a\u5b66\u4e60", "\u8de8\u8bed\u8a00", "\u7ebf\u6027\u4ee3\u6570"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14861", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Semantic Fibers and Cross-Gram Interference: A Calculus of Safety Drift in Overcomplete Representations", "tldr": "\u8bba\u6587\u5f62\u5f0f\u5316\u4e86\u8bed\u8a00\u6a21\u578b\u5728\u7b49\u4ef7\u8f93\u5165\uff08\u5982\u8de8\u8bed\u8a00\u7ffb\u8bd1\uff09\u4e2d\u51fa\u73b0\u5b89\u5168\u62d2\u7b54\u4e0d\u4e00\u81f4\u7684\u201c\u5b89\u5168\u6f02\u79fb\u201d\u95ee\u9898\uff0c\u5e76\u7528\u7ebf\u6027\u4ee3\u6570\u523b\u753b\u5176\u5728\u8fc7\u5b8c\u5907\u8868\u793a\u4e2d\u7684\u6765\u6e90\u3002\u4f5c\u8005\u63d0\u51fa\u6821\u51c6\u66b4\u9732\u5ea6\u91cf\uff0c\u5c06\u6f02\u79fb\u533a\u5206\u4e3a\u53ef\u91cd\u6821\u51c6\u7684\u8bfb\u51fa\u9519\u8bef\u3001\u75c5\u6001\u6821\u6b63\u95ee\u9898\u548c\u8868\u793a\u5c42\u78b0\u649e\uff0c\u5e76\u7ed9\u51fa\u8bca\u65ad\u7ebf\u6027\u63a7\u5236\u63a5\u53e3\u7684\u5b9e\u9a8c\u6307\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Smartphone-based Human Activity Recognition (HAR) models often degrade under distribution shifts caused by changes in users, devices, sensor placements, environments, and acquisition protocols. Domain Generalization (DG) addresses this problem by learning from source domains without access to target data. Existing DG methods span training objectives, representation initialization, and architectural modifications, but these components are typically evaluated in isolation despite operating at different stages of the learning pipeline. We present a large-scale controlled benchmark of DG for smartphone-based HAR, comprising more than 410,000 experiments across four model architectures, thirteen training objectives including Empirical Risk Minimization (ERM), five initialization strategies, four architectural configurations, and two shift scenarios: cross-dataset and cross-position. Results show that individual DG components provide limited and highly conditional gains. Alternative objectives rarely outperform ERM consistently, self-supervised initialization helps in specific settings, and architectural modifications, particularly Dynamic Domain Generalization, provide the clearest standalone improvements. Joint configurations, however, frequently outperform their individual components and exhibit complementary and sometimes super-additive interactions, although gains remain model- and shift-dependent. Class-level analysis shows that the strongest configurations mainly improve difficult, shift-sensitive decision boundaries. Finally, oracle checkpoint analysis reveals substantial unrealized performance: source-validation selection recovers only 53% and 26% of the available oracle gain in cross-dataset and cross-position settings, respectively. Overall, effective HAR domain generalization requires jointly designing DG components and robust model-selection strategies.", "arxiv_id": "2609.14863", "arxiv_url": "https://arxiv.org/abs/2609.14863", "authors": ["Ot\u00e1vio Oliveira Napoli", "Edson Borin"], "brief": "\u8be5\u8bba\u6587\u5bf9\u667a\u80fd\u624b\u673a\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b\u4e2d\u7684\u9886\u57df\u6cdb\u5316\u8fdb\u884c\u4e86\u5927\u89c4\u6a21\u53d7\u63a7\u8bc4\u6d4b\uff0c\u8986\u76d6\u8d85\u8fc741\u4e07\u6b21\u5b9e\u9a8c\uff0c\u7cfb\u7edf\u5206\u6790\u8bad\u7ec3\u76ee\u6807\u3001\u521d\u59cb\u5316\u7b56\u7565\u548c\u67b6\u6784\u4fee\u6539\u5728\u8de8\u6570\u636e\u96c6\u4e0e\u8de8\u4f4d\u7f6e\u504f\u79fb\u4e0b\u7684\u4f5c\u7528\u3002\u7ed3\u679c\u8868\u660e\u5355\u4e2a\u7ec4\u4ef6\u6536\u76ca\u6709\u9650\u4e14\u4f9d\u8d56\u573a\u666f\uff0c\u8054\u5408\u914d\u7f6e\u5e38\u6709\u4e92\u8865\u751a\u81f3\u8d85\u52a0\u6027\u63d0\u5347\uff1b\u52a8\u6001\u9886\u57df\u6cdb\u5316\u7b49\u67b6\u6784\u6539\u52a8\u6700\u7a33\u5b9a\uff0c\u4f46\u6a21\u578b\u9009\u62e9\u4ecd\u662f\u4e3b\u8981\u74f6\u9888\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14863", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9886\u57df\u6cdb\u5316", "\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b", "\u6a21\u578b\u9009\u62e9", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14863", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Domain Generalization for Smartphone-Based Human Activity Recognition: A Systematic Analysis of Components and Interactions", "tldr": "\u8be5\u8bba\u6587\u5bf9\u667a\u80fd\u624b\u673a\u4eba\u4f53\u6d3b\u52a8\u8bc6\u522b\u4e2d\u7684\u9886\u57df\u6cdb\u5316\u8fdb\u884c\u4e86\u5927\u89c4\u6a21\u53d7\u63a7\u8bc4\u6d4b\uff0c\u8986\u76d6\u8d85\u8fc741\u4e07\u6b21\u5b9e\u9a8c\uff0c\u7cfb\u7edf\u5206\u6790\u8bad\u7ec3\u76ee\u6807\u3001\u521d\u59cb\u5316\u7b56\u7565\u548c\u67b6\u6784\u4fee\u6539\u5728\u8de8\u6570\u636e\u96c6\u4e0e\u8de8\u4f4d\u7f6e\u504f\u79fb\u4e0b\u7684\u4f5c\u7528\u3002\u7ed3\u679c\u8868\u660e\u5355\u4e2a\u7ec4\u4ef6\u6536\u76ca\u6709\u9650\u4e14\u4f9d\u8d56\u573a\u666f\uff0c\u8054\u5408\u914d\u7f6e\u5e38\u6709\u4e92\u8865\u751a\u81f3\u8d85\u52a0\u6027\u63d0\u5347\uff1b\u52a8\u6001\u9886\u57df\u6cdb\u5316\u7b49\u67b6\u6784\u6539\u52a8\u6700\u7a33\u5b9a\uff0c\u4f46\u6a21\u578b\u9009\u62e9\u4ecd\u662f\u4e3b\u8981\u74f6\u9888\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We predict single-sequence model throughput from GGUF metadata using roofline-shaped predictors with quantization-specific scale factors fitted on reference models. The scored cohort comprises 318 phase-depth measurements from 53 host-file configurations on two Apple M4 Max systems and an NVIDIA RTX 5080. On host-specific held-out sets of four, five, and two configurations, an active-parameter decode model obtains 13.1%, 14.4%, and 36.1% mean absolute percentage error (MAPE), versus 49.4%, 55.3%, and 51.9% when charging total parameters. Leave-one-host-out coefficients fitted on the other two systems yield 11.6%, 16.8%, and 36.0% test MAPE. A low-bit model ladder changes ordering across runtime stacks. The P2 prefill baseline gives 18.7%, 22.2%, and 108.2% test MAPE. GGUF structure helps on all three systems, but fitted efficiencies are not universal.", "arxiv_id": "2609.14864", "arxiv_url": "https://arxiv.org/abs/2609.14864", "authors": ["Xinyu Qiu", "Chuhong Xu", "Bo Su", "Ziyao Chen", "Ruiyang Xu", "Shimeng Dai"], "brief": "\u672c\u6587\u5229\u7528 GGUF \u5143\u6570\u636e\u9884\u6d4b llama.cpp \u5355\u5e8f\u5217\u541e\u5410\u91cf\uff0c\u63d0\u51fa\u5e26\u91cf\u5316\u7279\u5b9a\u7f29\u653e\u56e0\u5b50\u7684 roofline \u5f62\u72b6\u9884\u6d4b\u5668\uff0c\u5e76\u5728\u4e24\u53f0 Apple M4 Max \u4e0e\u4e00\u5757 NVIDIA RTX 5080 \u4e0a\u8bc4\u6d4b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6309\u6d3b\u8dc3\u53c2\u6570\u5efa\u6a21\u76f8\u6bd4\u6309\u603b\u53c2\u6570\u8ba1\u8d39\u663e\u8457\u964d\u4f4e MAPE\uff0c\u4f46\u8de8\u4e3b\u673a\u6548\u7387\u7cfb\u6570\u5e76\u4e0d\u5b8c\u5168\u901a\u7528\uff0c\u4f4e\u6bd4\u7279\u6a21\u578b\u5728\u4e0d\u540c\u8fd0\u884c\u6808\u4e0a\u7684\u6392\u5e8f\u4e5f\u4f1a\u53d8\u5316\u3002", "categories": ["cs.AI", "cs.LG", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14864", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6027\u80fd\u9884\u6d4b", "\u91cf\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u786c\u4ef6\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14864", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GGUF-Metadata Prediction of Single-Sequence llama.cpp Throughput Across Three Systems", "tldr": "\u672c\u6587\u5229\u7528 GGUF \u5143\u6570\u636e\u9884\u6d4b llama.cpp \u5355\u5e8f\u5217\u541e\u5410\u91cf\uff0c\u63d0\u51fa\u5e26\u91cf\u5316\u7279\u5b9a\u7f29\u653e\u56e0\u5b50\u7684 roofline \u5f62\u72b6\u9884\u6d4b\u5668\uff0c\u5e76\u5728\u4e24\u53f0 Apple M4 Max \u4e0e\u4e00\u5757 NVIDIA RTX 5080 \u4e0a\u8bc4\u6d4b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6309\u6d3b\u8dc3\u53c2\u6570\u5efa\u6a21\u76f8\u6bd4\u6309\u603b\u53c2\u6570\u8ba1\u8d39\u663e\u8457\u964d\u4f4e MAPE\uff0c\u4f46\u8de8\u4e3b\u673a\u6548\u7387\u7cfb\u6570\u5e76\u4e0d\u5b8c\u5168\u901a\u7528\uff0c\u4f4e\u6bd4\u7279\u6a21\u578b\u5728\u4e0d\u540c\u8fd0\u884c\u6808\u4e0a\u7684\u6392\u5e8f\u4e5f\u4f1a\u53d8\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The multimode fiber is among the thinnest imaging conduits available, carrying hundreds to thousands of spatial modes through a cross-section comparable to a human hair, but its endoscopic capabilities are currently limited by the sensitivity of the transmission matrix to the fiber\u0027s deformed state. Proximal-only recovery of the fiber\u0027s transmission matrix is an appealing approach for enabling general use multimode fiber endoscopy, and within the last decade, machine learning techniques have been applied to both single-ended and double-ended transmission matrix recovery tasks. We present a new approach to this interdisciplinary problem and show that neural networks can generalize to recover transmission matrices of an arbitrarily deformed graded-index multimode fiber from proximal measurements alone.", "arxiv_id": "2609.14869", "arxiv_url": "https://arxiv.org/abs/2609.14869", "authors": ["Cole Reynolds"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4ec5\u4f9d\u8d56\u8fd1\u7aef\u6d4b\u91cf\u6765\u6062\u590d\u4efb\u610f\u5f62\u53d8\u6e10\u53d8\u6298\u5c04\u7387\u591a\u6a21\u5149\u7ea4\u4f20\u8f93\u77e9\u9635\u7684\u65b9\u6cd5\u3002\u7ed3\u679c\u8868\u660e\uff0c\u795e\u7ecf\u7f51\u7edc\u80fd\u591f\u6cdb\u5316\u5230\u4e0d\u540c\u5f62\u53d8\u72b6\u6001\uff0c\u6709\u671b\u63d0\u5347\u591a\u6a21\u5149\u7ea4\u5185\u7aa5\u6210\u50cf\u5728\u5b9e\u9645\u573a\u666f\u4e2d\u7684\u53ef\u7528\u6027\u3002", "categories": ["physics.optics", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14869", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5149\u7ea4\u6210\u50cf", "\u795e\u7ecf\u7f51\u7edc", "\u8ba1\u7b97\u6210\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14869", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Proximal-Only Transmission Matrix Recovery of an Arbitrarily Deformed Graded-Index Multimode Fiber", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4ec5\u4f9d\u8d56\u8fd1\u7aef\u6d4b\u91cf\u6765\u6062\u590d\u4efb\u610f\u5f62\u53d8\u6e10\u53d8\u6298\u5c04\u7387\u591a\u6a21\u5149\u7ea4\u4f20\u8f93\u77e9\u9635\u7684\u65b9\u6cd5\u3002\u7ed3\u679c\u8868\u660e\uff0c\u795e\u7ecf\u7f51\u7edc\u80fd\u591f\u6cdb\u5316\u5230\u4e0d\u540c\u5f62\u53d8\u72b6\u6001\uff0c\u6709\u671b\u63d0\u5347\u591a\u6a21\u5149\u7ea4\u5185\u7aa5\u6210\u50cf\u5728\u5b9e\u9645\u573a\u666f\u4e2d\u7684\u53ef\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Counting equivalent pairs is a common way to report transformation-audit coverage, but it can substantially overstate the constraints imposed by an audit: pairs generated from the same semantic object are correlated, and complete orbit graphs contain algebraically redundant edges. We therefore distinguish four complementary quantities---edge count $m$, effective contrast rank $s$, population support rank $r$, and graph spectral gap $\u03b7$---and characterize their roles in audit coverage and deployment reliability. Under a rank-$r$ Gaussian contrast model, a population-invariant calibrated reader exists exactly when the anchor has a component in $\\ker T$. When an audit has rank $s \u003c r$, its unobserved risk is $R^\\star/U$, with $U \\sim \\operatorname{Beta}((r-s)/2,s/2)$; when $s \\ge r$, exact calibrated interpolation is infeasible. The same distinction appears in orbit topology: a spanning tree imposes the same exact-null constraints as a complete graph, while a sharp graph Poincare inequality propagates edge-level drift to an entire orbit at a cost proportional to $1/\u03b7$. Cyclic audits can additionally yield zero pair-level leave-one-out error without holding out any semantic object. To address these failures, we derive exact block-Woodbury leave-one-orbit-out updates and introduce a source-disjoint deployment gate over finitely many candidate readers. The gate retains the original reader unless uncertainty bounds certify lower drift within a prescribed clean-utility budget. etc..", "arxiv_id": "2609.14870", "arxiv_url": "https://arxiv.org/abs/2609.14870", "authors": ["Mohammed Ahnouch", "Lotfi Elaachak"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u53d8\u6362\u5ba1\u8ba1\u4e2d\u53ea\u7edf\u8ba1\u7b49\u4ef7\u6837\u672c\u5bf9\u6570\u91cf\u4f1a\u9ad8\u4f30\u8986\u76d6\u5ea6\uff0c\u56e0\u4e3a\u540c\u4e00\u8bed\u4e49\u5bf9\u8c61\u4ea7\u751f\u7684\u6837\u672c\u5bf9\u76f8\u5173\u4e14\u5b8c\u6574\u8f68\u9053\u56fe\u542b\u6709\u4ee3\u6570\u5197\u4f59\u3002\u4f5c\u8005\u63d0\u51fa\u8fb9\u6570\u3001\u6709\u6548\u5bf9\u6bd4\u79e9\u3001\u603b\u4f53\u652f\u6301\u79e9\u548c\u56fe\u8c31\u95f4\u9699\u7b49\u6307\u6807\uff0c\u5e76\u7ed9\u51fa\u98ce\u9669\u3001\u63d2\u503c\u4e0d\u53ef\u884c\u6027\u3001\u7559\u4e00\u8f68\u9053\u66f4\u65b0\u548c\u90e8\u7f72\u95e8\u63a7\u65b9\u6cd5\uff0c\u4ee5\u66f4\u53ef\u9760\u8bc4\u4f30\u4e0d\u53d8\u6027\u5ba1\u8ba1\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14870", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6a21\u578b\u5ba1\u8ba1", "\u4e0d\u53d8\u6027", "\u6cdb\u5316\u98ce\u9669", "\u56fe\u8c31\u65b9\u6cd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14870", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Interpolation Is Not Invariance: Pair Count Is Not Coverage in Transformation Audits", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u53d8\u6362\u5ba1\u8ba1\u4e2d\u53ea\u7edf\u8ba1\u7b49\u4ef7\u6837\u672c\u5bf9\u6570\u91cf\u4f1a\u9ad8\u4f30\u8986\u76d6\u5ea6\uff0c\u56e0\u4e3a\u540c\u4e00\u8bed\u4e49\u5bf9\u8c61\u4ea7\u751f\u7684\u6837\u672c\u5bf9\u76f8\u5173\u4e14\u5b8c\u6574\u8f68\u9053\u56fe\u542b\u6709\u4ee3\u6570\u5197\u4f59\u3002\u4f5c\u8005\u63d0\u51fa\u8fb9\u6570\u3001\u6709\u6548\u5bf9\u6bd4\u79e9\u3001\u603b\u4f53\u652f\u6301\u79e9\u548c\u56fe\u8c31\u95f4\u9699\u7b49\u6307\u6807\uff0c\u5e76\u7ed9\u51fa\u98ce\u9669\u3001\u63d2\u503c\u4e0d\u53ef\u884c\u6027\u3001\u7559\u4e00\u8f68\u9053\u66f4\u65b0\u548c\u90e8\u7f72\u95e8\u63a7\u65b9\u6cd5\uff0c\u4ee5\u66f4\u53ef\u9760\u8bc4\u4f30\u4e0d\u53d8\u6027\u5ba1\u8ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Nucleotide sequence analysis is central to problems spanning regulatory genomics, evolutionary biology, and phenotype prediction. Classical bioinformatics methods extract interpretable sequence properties such as motifs and k-mer composition, but their flexibility is limited. In contrast, modern deep learning models can learn powerful predictive representations directly from raw sequences, yet their internal representations and decision mechanisms are difficult to inspect. Interpretable machine learning methods (e.g., sparse linear models and decision trees) provide human-understandable representations of predictive relationships but are not designed to operate directly on nucleotide sequences. Here, we introduce SeqMaestro, a machine learning framework that proposes biological hypotheses from nucleotide sequences using interpretable models. Our solution is centered around a two-layer interface that connects nucleotide sequences with the broader ecosystem of interpretable machine learning. SeqMaestro uses this interface to fit diverse combinations of interpretable models, feature representations, and extraction strategies, leveraging variability across transparent models to identify robust biological signals and richer predictive relationships than feature importance alone can provide. The system also supports data transformation and cleaning, model fitting, hyperparameter tuning, reliability analysis, and synthesis of results into a contextualized written report. By providing these capabilities through a no-code workflow, SeqMaestro is designed to make interpretable sequence analysis accessible to researchers without requiring extensive programming or machine learning expertise. SeqMaestro thereby provides an accessible route from nucleotide sequences to biological hypotheses.", "arxiv_id": "2609.14882", "arxiv_url": "https://arxiv.org/abs/2609.14882", "authors": ["Evgeny S. Saveliev", "Krzysztof Kacprzyk", "Charlotte Capitanchik", "Neelanjan Mukherjee", "Kate Matlin", "Ryan Sheridan", "Srinivas Ramachandran", "Jernej Ule", "David L. Bentley", "Mihaela van der Schaar"], "brief": "SeqMaestro \u662f\u4e00\u4e2a\u9762\u5411\u6838\u82f7\u9178\u5e8f\u5217\u7684\u53ef\u89e3\u91ca\u673a\u5668\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u4e24\u5c42\u63a5\u53e3\u5c06\u5e8f\u5217\u7279\u5f81\u4e0e\u7a00\u758f\u7ebf\u6027\u6a21\u578b\u3001\u51b3\u7b56\u6811\u7b49\u900f\u660e\u6a21\u578b\u8fde\u63a5\u8d77\u6765\uff0c\u7528\u4e8e\u4ece\u5e8f\u5217\u4e2d\u63d0\u51fa\u751f\u7269\u5b66\u5047\u8bbe\u3002\u5b83\u652f\u6301\u6570\u636e\u6e05\u6d17\u3001\u7279\u5f81\u63d0\u53d6\u3001\u6a21\u578b\u8c03\u53c2\u3001\u53ef\u9760\u6027\u5206\u6790\u548c\u81ea\u52a8\u62a5\u544a\u751f\u6210\uff0c\u4f7f\u975e\u673a\u5668\u5b66\u4e60\u4e13\u5bb6\u4e5f\u80fd\u8fdb\u884c\u53ef\u89e3\u91ca\u7684\u5e8f\u5217\u5206\u6790\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14882", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u7269\u4fe1\u606f\u5b66", "\u53ef\u89e3\u91ca\u673a\u5668\u5b66\u4e60", "\u5e8f\u5217\u5206\u6790", "\u65e0\u4ee3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14882", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SeqMaestro: From nucleotide sequences to biological hypotheses through interpretable machine learning", "tldr": "SeqMaestro \u662f\u4e00\u4e2a\u9762\u5411\u6838\u82f7\u9178\u5e8f\u5217\u7684\u53ef\u89e3\u91ca\u673a\u5668\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u4e24\u5c42\u63a5\u53e3\u5c06\u5e8f\u5217\u7279\u5f81\u4e0e\u7a00\u758f\u7ebf\u6027\u6a21\u578b\u3001\u51b3\u7b56\u6811\u7b49\u900f\u660e\u6a21\u578b\u8fde\u63a5\u8d77\u6765\uff0c\u7528\u4e8e\u4ece\u5e8f\u5217\u4e2d\u63d0\u51fa\u751f\u7269\u5b66\u5047\u8bbe\u3002\u5b83\u652f\u6301\u6570\u636e\u6e05\u6d17\u3001\u7279\u5f81\u63d0\u53d6\u3001\u6a21\u578b\u8c03\u53c2\u3001\u53ef\u9760\u6027\u5206\u6790\u548c\u81ea\u52a8\u62a5\u544a\u751f\u6210\uff0c\u4f7f\u975e\u673a\u5668\u5b66\u4e60\u4e13\u5bb6\u4e5f\u80fd\u8fdb\u884c\u53ef\u89e3\u91ca\u7684\u5e8f\u5217\u5206\u6790\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Online mental health communities thrive on peer support, yet those who volunteer to help often lack formal training and may struggle to articulate supportive responses. AI co-writing could lower this barrier; however, peer support derives much of its value from being perceived as personal, raising questions around authorship, ownership, and trust. We built PeerPen, a writing assistance tool embedded within a Reddit-like interface, supporting two main features: draft generation and revision of user-written responses. Through semi-structured interviews with 15 participants, we find that PeerPen reduced the burden of composing responses and increased confidence in offering support. Participants wanted AI to assist their writing without taking over authorship and anticipated tensions around authenticity and trust. Such assistance could make authorship uncertain even for responses written without it, weakening trust across the community. We contribute design implications for AI writing assistance that scaffolds supportive communication, preserves authorship, and accounts for community-level trust.", "arxiv_id": "2609.14886", "arxiv_url": "https://arxiv.org/abs/2609.14886", "authors": ["Jiwon Kim", "Sherry Gong", "Maya Ajit", "Soorya Ram Shimgekar", "Yunhao Yuan", "Dong Whi Yoo", "Eshwar Chandrasekharan", "Koustuv Saha"], "brief": "\u8bba\u6587\u63d0\u51fa PeerPen\uff0c\u4e00\u4e2a\u5d4c\u5165\u7c7b Reddit \u754c\u9762\u7684\u5fc3\u7406\u5065\u5eb7\u540c\u4f34\u652f\u6301\u5199\u4f5c\u8f85\u52a9\u5de5\u5177\uff0c\u63d0\u4f9b\u56de\u590d\u8349\u7a3f\u751f\u6210\u4e0e\u7528\u6237\u6587\u672c\u6da6\u8272\u529f\u80fd\u300215\u540d\u53c2\u4e0e\u8005\u8bbf\u8c08\u663e\u793a\uff0c\u5b83\u80fd\u964d\u4f4e\u64b0\u5199\u652f\u6301\u6027\u56de\u590d\u7684\u8d1f\u62c5\u3001\u63d0\u5347\u8868\u8fbe\u4fe1\u5fc3\uff0c\u4f46\u4e5f\u5e26\u6765\u4f5c\u8005\u8eab\u4efd\u3001\u771f\u5b9e\u6027\u4e0e\u793e\u533a\u4fe1\u4efb\u65b9\u9762\u7684\u62c5\u5fe7\u3002", "categories": ["cs.HC", "cs.AI", "cs.CL", "cs.CY", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14886", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5fc3\u7406\u5065\u5eb7", "\u5199\u4f5c\u8f85\u52a9", "\u4eba\u673a\u4ea4\u4e92", "\u4fe1\u4efb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14886", "published_at": "2026-09-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PeerPen: AI-Assisted Writing for Online Mental Health Peer Support", "tldr": "\u8bba\u6587\u63d0\u51fa PeerPen\uff0c\u4e00\u4e2a\u5d4c\u5165\u7c7b Reddit \u754c\u9762\u7684\u5fc3\u7406\u5065\u5eb7\u540c\u4f34\u652f\u6301\u5199\u4f5c\u8f85\u52a9\u5de5\u5177\uff0c\u63d0\u4f9b\u56de\u590d\u8349\u7a3f\u751f\u6210\u4e0e\u7528\u6237\u6587\u672c\u6da6\u8272\u529f\u80fd\u300215\u540d\u53c2\u4e0e\u8005\u8bbf\u8c08\u663e\u793a\uff0c\u5b83\u80fd\u964d\u4f4e\u64b0\u5199\u652f\u6301\u6027\u56de\u590d\u7684\u8d1f\u62c5\u3001\u63d0\u5347\u8868\u8fbe\u4fe1\u5fc3\uff0c\u4f46\u4e5f\u5e26\u6765\u4f5c\u8005\u8eab\u4efd\u3001\u771f\u5b9e\u6027\u4e0e\u793e\u533a\u4fe1\u4efb\u65b9\u9762\u7684\u62c5\u5fe7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this paper, we derive an explicit solution of the stationary prediction with expert advice PDE for five experts. The formula is given in three regions. In the first two regions, it is the four-expert solution plus a single integral with an elementary positive density. In the third region, it is a finite sum of hyperbolic products whose coefficients are determined by one scalar quadrature. Our formula establishes that the direction $(1,0,1,0,0)$ is optimal throughout the ordered sector, and that the COMB strategy $(1,0,1,0,1)$ is optimal only on a lower dimensional subset of the sector (where $x_1=x_2$ and $x_3=x_4$). This disproves the COMB optimality conjecture of Gravin, Peres and Sivan (2016). The verification of the Hamiltonian inequalities is a tedious task, part of which is completed with a computer assisted proof. The verification reduces to 21 scalar inequalities, which we prove using 147 exact rational Bernstein polynomial certificates. The exact certificates and their independent arithmetic checks are included in a supplement to this paper.", "arxiv_id": "2609.14892", "arxiv_url": "https://arxiv.org/abs/2609.14892", "authors": ["Jeff Calder", "Nadejda Drenska" cientific ideation and creative writing. We present MoDA (Mode-conditioned Diversity Alignment), an online post-training RL algorithm that jointly optimizes generation quality and diversity, inspired by the coordination perspective in multi-agent reinforcement learning (MARL). MoDA trains a single shared LLM policy conditioned on abstract numbered roles, where each role acts as an agent competing to produce outputs distinct from the others. This formulation encourages mode-conditioned agents to explore complementary regions of the high-quality output space without requiring hand-crafted personas or architectural modifications. MoDA employs a prompt-adaptive quality gating mechanism that calibrates a reference quality threshold and grants diversity rewards only to responses that meet the threshold, preventing reward-hacking behaviors that compromise response quality. To study quality-diversity tradeoffs, we evaluate MoDA on a comprehensive suite of benchmarks spanning seven general capability tasks and four domain-specific diversity tasks in scientific ideation and creative writing. MoDA improves SBERT diversity by 265% on the Infinite-Chat held-out prompts, while increasing average general capability pass@1 by 10.3% over the Qwen3-8B baseline. Compared with the strongest DivPO baseline, MoDA improves SBERT diversity from 0.274 to 0.482 (+75.9%) and E-Vendi from 2.86 to 4.4 (+53.8%), while improving average general capability pass@1 by 7.0%. Overall, MoDA provides a drop-in alternative to standard post-training methods that preserves and expands the model\u0027s expressive output space while improving quality.", "arxiv_id": "2609.14896", "arxiv_url": "https://arxiv.org/abs/2609.14896", "authors": ["Jiayi Yuan", "Hangoo Kang", "James Jihao Liu", "Yejin Choi", "Vikram Iyer", "Liwei Jiang", "Natasha Jaques"], "brief": "\u8bba\u6587\u63d0\u51fa MoDA\uff0c\u4e00\u79cd\u5728\u7ebf\u540e\u8bad\u7ec3\u5f3a\u5316\u5b66\u4e60\u65b9\u6cd5\uff0c\u901a\u8fc7\u7ed9\u540c\u4e00\u4e let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
