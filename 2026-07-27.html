s": 0, "hf_url": "https://huggingface.co/papers/2607.24653", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528 Kimi Delta Attention \u4e0e Attention Residuals\uff0c\u6539\u5584\u8d85\u957f\u5e8f\u5217\u548c\u6df1\u5c42\u7f51\u7edc\u4e2d\u7684\u4fe1\u606f\u6d41\u52a8\uff0c\u4f7f\u6574\u4f53\u6269\u5c55\u6548\u7387\u8f83 Kimi K2 \u63d0\u5347\u7ea6 2.5 \u500d", "Stable LatentMoE \u5728 896 \u4e2a\u8def\u7531\u4e13\u5bb6\u4e2d\u6bcf\u4e2a token \u6fc0\u6d3b 16 \u4e2a\u4e13\u5bb6\uff0c\u652f\u6491 2.8T \u89c4\u6a21\u4e0b\u7684\u9ad8\u6548\u8bad\u7ec3\u4e0e\u63a8\u7406", "\u540e\u8bad\u7ec3\u8986\u76d6\u901a\u7528\u3001\u667a\u80fd\u4f53\u548c\u4ee3\u7801\u9886\u57df\u7684\u5f3a\u5316\u5b66\u4e60\uff0c\u5e76\u652f\u6301\u591a\u79cd\u63a8\u7406\u52aa\u529b\u7ea7\u522b\uff0c\u63d0\u5347\u7ec4\u5408\u6cdb\u5316\u548c\u957f\u7a0b\u6267\u884c\u80fd\u529b"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24653v1", "published_at": "2026-07-27", "score": 0.588, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Moonshot/Kimi", "\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Kimi K3: Open Frontier Intelligence", "tldr": "Kimi K3\u5f00\u6e90\u524d\u6cbf\u7ea7\u4e07\u4ebf\u53c2\u6570\u591a\u6a21\u6001\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd Kimi K3\uff1a\u4e00\u4e2a 2.8T \u53c2\u6570\u3001104B \u6fc0\u6d3b\u53c2\u6570\u7684 MoE \u5927\u6a21\u578b\uff0c\u5177\u5907\u539f\u751f\u89c6\u89c9\u80fd\u529b\u548c 100 \u4e07 token \u4e0a\u4e0b\u6587\u7a97\u53e3\u3002\u5b83\u7ed3\u5408 Kimi Delta Attention\u3001Attention Residuals\u3001Stable LatentMoE \u53ca\u5927\u89c4\u6a21\u540e\u8bad\u7ec3\uff0c\u5728\u4ee3\u7801\u3001\u667a\u80fd\u4f53\u3001\u63a8\u7406\u3001\u77e5\u8bc6\u548c\u89c6\u89c9\u4efb\u52a1\u4e0a\u8fbe\u5230\u524d\u6cbf\u6c34\u5e73\u3002", "why_notable": "Kimi K3 \u5c06\u4e07\u4ebf\u53c2\u6570 MoE\u3001\u767e\u4e07\u4e0a\u4e0b\u6587\u3001\u591a\u6a21\u6001\u548c\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\uff0c\u5e76\u5f00\u653e\u5b8c\u6574\u6743\u91cd\uff0c\u5bf9\u5f00\u6e90\u524d\u6cbf\u6a21\u578b\u751f\u6001\u548c\u957f\u4e0a\u4e0b\u6587\u667a\u80fd\u4f53\u5e94\u7528\u5177\u6709\u91cd\u8981\u63a8\u52a8\u4f5c\u7528\u3002"}, {"abstract": "Multi-turn long-horizon planning is critical for foundation model agents, yet how to fundamentally improve it remains unclear. Existing models are trained on uncontrollable and opaque Internet data, making it difficult to identify how planning ability is acquired, shaped, and integrated. To address this challenge, we introduce a unified and controlled multi-turn environment that enables precise control. It allows systematically study long-horizon planning across three stages. (1) Planning ability acquisition during pre-training. We study data format, distribution, and quality. Explicit world model construction through CoT state transition modeling yields stronger long-horizon generalization. Atomic skills alone are insufficient for compositional generalization, whereas a litte long-horizon data works. Moreover, suboptimal trajectories severely impair performance because errors amplify over long horizons. (2) Planning ability shaping via GRPO and OPD post-training. Through mutual information, we distinguish general planning patterns from task-specific planning knowledge. For planning patterns, we identify three application regions of post-training: unnecessary, effective, and unsupported. OPD has a broader effective region than GRPO under low-quality and long-horizon settings, as it provides more consistent update directions. For planning knowledge, distilling unseen procedures from a teacher with different knowledge may impair student\u0027s prior world modeling without fully establishing new knowledge. (3) Planning ability integration through MOPD post-training. We show that multi-teacher on-policy distillation (MOPD) integrates capabilities by converging to shared planning-pattern across environments. Compatible patterns enable cross-environment generalization, partially shared patterns support continual learning, while completely conflicting patterns cause severe interference.", "arxiv_id": "2607.24720", "arxiv_url": "https://arxiv.org/abs/2607.24720", "authors": ["Tianyi Men", "Zhuoran Jin", "Kang Liu", "Jun Zhao"], "brief": "\u8bba\u6587\u6784\u5efa\u7edf\u4e00\u53ef\u63a7\u7684\u591a\u8f6e\u957f\u7a0b\u89c4\u5212\u73af\u5883\uff0c\u7cfb\u7edf\u7814\u7a76\u57fa\u7840\u6a21\u578b\u667a\u80fd\u4f53\u4ece\u9884\u8bad\u7ec3\u5230\u540e\u8bad\u7ec3\u5982\u4f55\u83b7\u5f97\u3001\u5851\u9020\u4e0e\u6574\u5408\u89c4\u5212\u80fd\u529b\u3002\u91cd\u70b9\u6bd4\u8f83\u6570\u636e\u8bbe\u8ba1\u3001GRPO\u3001\u5355\u6559\u5e08OPD\u4e0e\u591a\u6559\u5e08MOPD\u5bf9\u957f\u7a0b\u6cdb\u5316\u548c\u80fd\u529b\u8fc1\u79fb\u7684\u5f71\u54cd\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24720", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9884\u8bad\u7ec3\u4e2d\uff0c\u663e\u5f0f\u4e16\u754c\u6a21\u578b\u6784\u5efa\u4e0eCoT\u72b6\u6001\u8f6c\u79fb\u5efa\u6a21\u66f4\u5229\u4e8e\u957f\u7a0b\u6cdb\u5316\uff1b\u4ec5\u6709\u539f\u5b50\u6280\u80fd\u4e0d\u8db3\u4ee5\u5e26\u6765\u7ec4\u5408\u6cdb\u5316\uff0c\u5c11\u91cf\u957f\u7a0b\u6570\u636e\u5373\u53ef\u663e\u8457\u5e2e\u52a9\u3002", "\u4f4e\u8d28\u91cf\u6216\u6b21\u4f18\u8f68\u8ff9\u4f1a\u5728\u957f\u89c6\u91ce\u4efb\u52a1\u4e2d\u653e\u5927\u9519\u8bef\uff1bOPD\u5728\u4f4e\u8d28\u91cf\u3001\u957f\u7a0b\u8bbe\u7f6e\u4e0b\u6bd4GRPO\u6709\u6548\u8303\u56f4\u66f4\u5e7f\uff0c\u66f4\u65b0\u65b9\u5411\u66f4\u7a33\u5b9a\u3002", "MOPD\u53ef\u901a\u8fc7\u591a\u6559\u5e08\u84b8\u998f\u6574\u5408\u5171\u4eab\u89c4\u5212\u6a21\u5f0f\uff1b\u6a21\u5f0f\u517c\u5bb9\u65f6\u4fc3\u8fdb\u8de8\u73af\u5883\u6cdb\u5316\uff0c\u90e8\u5206\u5171\u4eab\u65f6\u652f\u6301\u6301\u7eed\u5b66\u4e60\uff0c\u51b2\u7a81\u4e25\u91cd\u65f6\u4f1a\u4ea7\u751f\u5e72\u6270\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u89c4\u5212", "\u540e\u8bad\u7ec3", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24720v1", "published_at": "2026-07-27", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Physics of Multi-Turn Long-Horizon Planning: From Pre-training to Post-training via Single- and Multi-Teacher On-Policy Agentic Distillation", "tldr": "\u53d7\u63a7\u73af\u5883\u7cfb\u7edf\u63ed\u793a\u957f\u7a0b\u89c4\u5212\u8bad\u7ec3\u89c4\u5f8b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u7edf\u4e00\u53ef\u63a7\u7684\u591a\u8f6e\u957f\u7a0b\u89c4\u5212\u73af\u5883\uff0c\u7cfb\u7edf\u7814\u7a76\u57fa\u7840\u6a21\u578b\u667a\u80fd\u4f53\u4ece\u9884\u8bad\u7ec3\u5230\u540e\u8bad\u7ec3\u5982\u4f55\u83b7\u5f97\u3001\u5851\u9020\u4e0e\u6574\u5408\u89c4\u5212\u80fd\u529b\u3002\u91cd\u70b9\u6bd4\u8f83\u6570\u636e\u8bbe\u8ba1\u3001GRPO\u3001\u5355\u6559\u5e08OPD\u4e0e\u591a\u6559\u5e08MOPD\u5bf9\u957f\u7a0b\u6cdb\u5316\u548c\u80fd\u529b\u8fc1\u79fb\u7684\u5f71\u54cd\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u957f\u7a0b\u89c4\u5212\u80fd\u529b\u7684\u6765\u6e90\u3001\u540e\u8bad\u7ec3\u5851\u5f62\u548c\u591a\u80fd\u529b\u6574\u5408\u653e\u5230\u53ef\u63a7\u73af\u5883\u4e2d\u7cfb\u7edf\u62c6\u89e3\uff0c\u4e3a\u8bad\u7ec3\u66f4\u53ef\u9760\u7684LLM\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u53ef\u9a8c\u8bc1\u7684\u673a\u5236\u89e3\u91ca\u548c\u5b9e\u8df5\u51c6\u5219\u3002"}, {"abstract": "Optimizing agentic workflows, such as retrieval-augmented generation (RAG) pipelines, requires navigating a combinatorial space of discrete component choices under tight evaluation budgets. Existing approaches - heuristic search, black-box optimization, and standard tree search methods - do not explicitly exploit the compositional structure of these workflows, leading to redundant computation and inefficient budget allocation. We introduce Agent-UCT (Agent-based Cost-Aware Upper Confidence Bounds Applied to Trees), a tree search algorithm that extends UCT with a reuse-aware regularization term derived from a bipartite prefix reuse graph. Agent-UCT biases selection toward branches that leverage previously materialized configuration prefixes, reducing redundant execution while maintaining effective exploration. Our framework, RAGSpace, unifies heterogeneous RAG components from LongRAG, LightRAG, and Self-RAG into a five-dimensional configuration space, enabling systematic cross-framework recombination. WTB (Workflow Test Bench) provides deterministic replay, content-addressable caching, and transactional consistency, ensuring that intermediate states are materialized once and reused across the search. Experiments on HotpotQA and UltraDomain demonstrate that Agent-UCT identifies configurations with the highest out-of-sample performance among the evaluated fixed framework presets. Under full-pool evaluation, bipartite prefix reuse reduces logical search cost by 73.6% relative to the no-prefix-sharing cost upper bound. Compared with full-pool evaluation, sampling-based evaluation further achieves a 4.2x wall-clock speedup. Agent-UCT, RAGSpace, and WTB together provide a unified framework for cost-aware, reproducible, and compositionally efficient agentic workflow optimization.", "arxiv_id": "2607.24162", "arxiv_url": "https://arxiv.org/abs/2607.24162", "authors": ["Yang Li", "Hai Liu", "Dian Shao", "Yu Wang", "Xiyu Chen", "Sergey Volkov", "Bozhi Wang", "Ziyu Sun", "Sihang Liu", "Ye Luo", "Xiaowei Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Agent-UCT\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4f18\u5316\u7684\u6210\u672c\u611f\u77e5\u6811\u641c\u7d22\u7b97\u6cd5\uff0c\u901a\u8fc7\u5229\u7528\u914d\u7f6e\u524d\u7f00\u590d\u7528\u6765\u51cf\u5c11\u91cd\u590d\u8ba1\u7b97\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 RAGSpace \u548c WTB\uff0c\u7528\u4e8e\u7edf\u4e00\u7ec4\u5408\u591a\u7c7b RAG \u7ec4\u4ef6\u5e76\u652f\u6301\u53ef\u590d\u73b0\u3001\u9ad8\u6548\u8bc4\u6d4b\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24162", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Agent-UCT \u5728 UCT \u4e2d\u52a0\u5165\u57fa\u4e8e\u4e8c\u5206\u524d\u7f00\u590d\u7528\u56fe\u7684\u6b63\u5219\u9879\uff0c\u4f18\u5148\u63a2\u7d22\u53ef\u590d\u7528\u5df2\u7269\u5316\u524d\u7f00\u7684\u5206\u652f", "RAGSpace \u5c06 LongRAG\u3001LightRAG\u3001Self-RAG \u7684\u5f02\u6784\u7ec4\u4ef6\u7edf\u4e00\u5230\u4e94\u7ef4\u914d\u7f6e\u7a7a\u95f4\uff0c\u652f\u6301\u8de8\u6846\u67b6\u91cd\u7ec4", "\u5728 HotpotQA \u548c UltraDomain \u4e0a\uff0c\u524d\u7f00\u590d\u7528\u76f8\u5bf9\u65e0\u5171\u4eab\u4e0a\u754c\u964d\u4f4e 73.6% \u903b\u8f91\u641c\u7d22\u6210\u672c\uff0c\u91c7\u6837\u8bc4\u6d4b\u5e26\u6765 4.2 \u500d\u5899\u949f\u52a0\u901f"], "keywords": ["\u667a\u80fd\u4f53", "RAG", "\u6811\u641c\u7d22", "\u5de5\u4f5c\u6d41\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24162v1", "published_at": "2026-07-27", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agent-UCT: Upper Confidence Bounds Applied to Trees for Agentic Workflow Optimization with Cost-Awareness", "tldr": "\u7528\u53ef\u590d\u7528\u6811\u641c\u7d22\u4f4e\u6210\u672c\u4f18\u5316RAG\u5de5\u4f5c\u6d41", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agent-UCT\uff0c\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4f18\u5316\u7684\u6210\u672c\u611f\u77e5\u6811\u641c\u7d22\u7b97\u6cd5\uff0c\u901a\u8fc7\u5229\u7528\u914d\u7f6e\u524d\u7f00\u590d\u7528\u6765\u51cf\u5c11\u91cd\u590d\u8ba1\u7b97\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 RAGSpace \u548c WTB\uff0c\u7528\u4e8e\u7edf\u4e00\u7ec4\u5408\u591a\u7c7b RAG \u7ec4\u4ef6\u5e76\u652f\u6301\u53ef\u590d\u73b0\u3001\u9ad8\u6548\u8bc4\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 RAG \u7b49\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u7684\u7ec4\u5408\u7206\u70b8\u548c\u8bc4\u6d4b\u6210\u672c\u95ee\u9898\uff0c\u63d0\u51fa\u4e86\u663e\u5f0f\u5229\u7528\u5de5\u4f5c\u6d41\u7ec4\u5408\u7ed3\u6784\u7684\u641c\u7d22\u65b9\u6cd5\uff0c\u517c\u5177\u5b9e\u7528\u52a0\u901f\u3001\u53ef\u590d\u73b0\u8bc4\u6d4b\u548c\u8de8\u6846\u67b6\u7ec4\u4ef6\u7ec4\u5408\u4ef7\u503c\u3002"}, {"abstract": "Active RAG systems decide when to retrieve external knowledge during generation, making them a budget-sensitive case of agentic RAG and self-adaptive retrieval. Yet evaluations often leave the operating point underspecified: two systems may both claim a 50% evidence-usage budget while realizing different held-out usage rates, so higher accuracy can reflect a looser budget rather than a better retrieval policy. We study budget-aware evaluation for Active RAG by recasting active retrieval as utility estimation, where retrieval is valuable only through its marginal correctness change over a no-retrieval answer. This view separates three questions that single-point evaluations conflate: whether trigger scores rank useful retrieval decisions, whether thresholds calibrated on past data meet future budgets, and how trigger-side computation changes deployment cost. We operationalize these questions with exact top-k utility frontiers, deployable threshold frontiers, conservative budget frontiers, harm audits, and cost decompositions. Across knowledge-intensive multi-hop QA datasets and open instruction models, retrieval harm is non-negligible, router rankings change across datasets and budgets, nominal thresholds can miss target usage, and simple uncertainty or retrieval-score baselines often rival learned utility routers. Budget-aware Active RAG evaluations should therefore report frontiers, realized usage, threshold-transfer error, harm rates, and cost decompositions alongside accuracy.", "arxiv_id": "2607.24010", "arxiv_url": "https://arxiv.org/abs/2607.24010", "authors": ["Pin Qian", "Su Wang", "Chong Peng", "Junxian You", "Lifei Liu", "Haoran Yu", "Yihang Chen", "Xiaochong Jiang"], "brief": "\u8bba\u6587\u5c06Active RAG\u7684\u68c0\u7d22\u89e6\u53d1\u95ee\u9898\u91cd\u6784\u4e3a\u201c\u68c0\u7d22\u8fb9\u9645\u6548\u7528\u4f30\u8ba1\u201d\uff0c\u5f3a\u8c03\u68c0\u7d22\u53ea\u6709\u5728\u76f8\u5bf9\u4e0d\u68c0\u7d22\u80fd\u63d0\u5347\u6b63\u786e\u6027\u65f6\u624d\u6709\u4ef7\u503c\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u5957\u9884\u7b97\u611f\u77e5\u8bc4\u6d4b\u65b9\u6cd5\uff0c\u7528\u4e8e\u533a\u5206\u6548\u7528\u6392\u5e8f\u3001\u9608\u503c\u6821\u51c6\u3001\u5b9e\u9645\u6210\u672c\u4e0e\u68c0\u7d22\u4f24\u5bb3\u7b49\u56e0\u7d20\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24010", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u7cbe\u786etop-k\u6548\u7528\u524d\u6cbf\u3001\u53ef\u90e8\u7f72\u9608\u503c\u524d\u6cbf\u3001\u4fdd\u5b88\u9884\u7b97\u524d\u6cbf\u3001\u4f24\u5bb3\u5ba1\u8ba1\u548c\u6210\u672c\u5206\u89e3\u7b49\u8bc4\u6d4b\u6307\u6807", "\u53d1\u73b0\u76f8\u540c\u540d\u4e49\u8bc1\u636e\u4f7f\u7528\u9884\u7b97\u4e0b\uff0c\u4e0d\u540c\u7cfb\u7edf\u7684\u5b9e\u9645\u68c0\u7d22\u7387\u53ef\u80fd\u4e0d\u540c\uff0c\u5bfc\u81f4\u51c6\u786e\u7387\u6bd4\u8f83\u4e0d\u516c\u5e73", "\u5b9e\u9a8c\u663e\u793a\u68c0\u7d22\u4f24\u5bb3\u4e0d\u53ef\u5ffd\u89c6\uff0c\u8def\u7531\u5668\u6392\u5e8f\u968f\u6570\u636e\u96c6\u548c\u9884\u7b97\u53d8\u5316\uff0c\u7b80\u5355\u4e0d\u786e\u5b9a\u6027\u6216\u68c0\u7d22\u5206\u6570\u57fa\u7ebf\u5e38\u53ef\u5ab2\u7f8e\u5b66\u4e60\u578b\u6548\u7528\u8def\u7531\u5668"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u667a\u80fd\u4f53", "\u8bc4\u6d4b", "\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24010v1", "published_at": "2026-07-27", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Should Active RAG Retrieve? A Budget-Aware Evaluation of Utility, Calibration, and Cost", "tldr": "\u63d0\u51fa\u9884\u7b97\u611f\u77e5\u7684Active RAG\u8bc4\u6d4b\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06Active RAG\u7684\u68c0\u7d22\u89e6\u53d1\u95ee\u9898\u91cd\u6784\u4e3a\u201c\u68c0\u7d22\u8fb9\u9645\u6548\u7528\u4f30\u8ba1\u201d\uff0c\u5f3a\u8c03\u68c0\u7d22\u53ea\u6709\u5728\u76f8\u5bf9\u4e0d\u68c0\u7d22\u80fd\u63d0\u5347\u6b63\u786e\u6027\u65f6\u624d\u6709\u4ef7\u503c\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u5957\u9884\u7b97\u611f\u77e5\u8bc4\u6d4b\u65b9\u6cd5\uff0c\u7528\u4e8e\u533a\u5206\u6548\u7528\u6392\u5e8f\u3001\u9608\u503c\u6821\u51c6\u3001\u5b9e\u9645\u6210\u672c\u4e0e\u68c0\u7d22\u4f24\u5bb3\u7b49\u56e0\u7d20\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51faActive RAG\u8bc4\u6d4b\u4e2d\u5e38\u89c1\u7684\u9884\u7b97\u6df7\u6dc6\u95ee\u9898\uff0c\u5e76\u7ed9\u51fa\u66f4\u53ef\u90e8\u7f72\u3001\u66f4\u516c\u5e73\u7684\u8bc4\u6d4b\u534f\u8bae\uff0c\u5bf9\u6784\u5efa\u6210\u672c\u654f\u611f\u7684RAG\u7cfb\u7edf\u548c\u68c0\u7d22\u8def\u7531\u5668\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Serving large language models at long context is bottlenecked by the key-value (KV) cache, which is read in full at every decode step. Attention keys are locally low-rank though globally high-rank: shared low-rank bases discard page-specific directions that a page\u0027s own compact basis retains. LOCKS gives every page its own spectral summary (resident, about a tenth the cache\u0027s size), reconstructs within-page logits, estimates each page\u0027s attention mass by log-sum-exp, and attends only the top pages; selection itself reads no candidate keys or values. Selecting on this summary alone stays within about a point of the full cache on long-document QA (LongBench-v1), tracks the read-every-key oracle on retrieval-dense RULER down to the smallest budgets, and shows its largest margins on long-form reasoning (AIME26, MATH-500), where baseline selectors collapse. At its shipped $2048$-token budget LOCKS matches FullKV aggregate quality at $100$K$+$ context while attending about $2\\%$ of the tokens, and halves per-token decode latency ($2.0\\times$ at $1$M tokens) against dense attention. LOCKS ships as a drop-in plugin for unmodified vLLM, with batched decode running in full CUDA graphs.", "arxiv_id": "2607.24555", "arxiv_url": "https://arxiv.org/abs/2607.24555", "authors": ["Junsung Hwang"], "brief": "LOCKS \u4e3a KV cache \u7684\u6bcf\u4e2a\u9875\u9762\u6784\u5efa\u5e38\u9a7b\u8c31\u6458\u8981\uff0c\u7528\u8be5\u6458\u8981\u4f30\u8ba1\u9875\u9762\u6ce8\u610f\u529b\u8d28\u91cf\u5e76\u53ea\u8bfb\u53d6 Top \u9875\u9762\u3002\u5b83\u4f5c\u4e3a\u65e0\u9700\u6539\u6a21\u578b\u7684 vLLM \u63d2\u4ef6\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u5927\u5e45\u51cf\u5c11 KV \u8bfb\u53d6\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24555", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u6ce8\u610f\u529b\u952e\u5c40\u90e8\u4f4e\u79e9\u4f46\u5168\u5c40\u9ad8\u79e9\uff0c\u56e0\u6b64\u91c7\u7528\u6bcf\u9875\u72ec\u7acb\u7d27\u51d1\u57fa\u800c\u975e\u5171\u4eab\u5168\u5c40\u4f4e\u79e9\u57fa", "\u901a\u8fc7\u9875\u5185 logit \u91cd\u6784\u4e0e log-sum-exp \u4f30\u8ba1\u9875\u9762\u6ce8\u610f\u529b\u8d28\u91cf\uff0c\u9009\u62e9\u9636\u6bb5\u65e0\u9700\u8bfb\u53d6\u5019\u9009 key/value", "\u5728 100K+ \u5230 1M token \u4e0a\u4ec5\u5173\u6ce8\u7ea6 2% token\uff0c\u8d28\u91cf\u63a5\u8fd1 FullKV\uff0c\u5e76\u6700\u9ad8\u5b9e\u73b0\u7ea6 2.0\u00d7 \u6bcf token \u89e3\u7801\u52a0\u901f"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58", "\u9ad8\u6548\u63a8\u7406", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24555v1", "published_at": "2026-07-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "LOCKS: Page-Local Compact Key Summaries for Efficient Long-Context Decoding", "tldr": "\u7528\u9875\u7ea7\u4f4e\u79e9\u6458\u8981\u52a0\u901f\u957f\u4e0a\u4e0b\u6587\u89e3\u7801", "upvotes": 0, "what_it_is": "LOCKS \u4e3a KV cache \u7684\u6bcf\u4e2a\u9875\u9762\u6784\u5efa\u5e38\u9a7b\u8c31\u6458\u8981\uff0c\u7528\u8be5\u6458\u8981\u4f30\u8ba1\u9875\u9762\u6ce8\u610f\u529b\u8d28\u91cf\u5e76\u53ea\u8bfb\u53d6 Top \u9875\u9762\u3002\u5b83\u4f5c\u4e3a\u65e0\u9700\u6539\u6a21\u578b\u7684 vLLM \u63d2\u4ef6\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u5927\u5e45\u51cf\u5c11 KV \u8bfb\u53d6\u3002", "why_notable": "KV cache \u8bfb\u53d6\u662f\u957f\u4e0a\u4e0b\u6587 LLM \u670d\u52a1\u7684\u6838\u5fc3\u74f6\u9888\uff0cLOCKS \u5728\u4fdd\u6301\u7cbe\u5ea6\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u89e3\u7801\u5ef6\u8fdf\uff0c\u5e76\u53ef\u76f4\u63a5\u96c6\u6210\u73b0\u6709 vLLM\uff0c\u5177\u5907\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The quadratic cost of attention is a major bottleneck in diffusion-based video generation models. MXFP4 attention provides a promising path toward efficient inference, but direct MXFP4 quantization often degrades generation quality due to two numerical issues: the clipping-underflow trade-off from power-of-two scaling and the row-wise normalization error introduced in the softmax loop. We propose MXAttention, a data-free post-training quantization framework for MXFP4 attention. MXAttention introduces two components: Universal Optimal Scaling (UOS), which exploits the periodic structure of power-of-two microscaling to derive a distribution-independent optimal scaling boundary Qmax=7.25 without calibration or search, and Pre-Normalization Quantization (PNQ), which quantizes unnormalized softmax exponentials before row-wise summation to preserve normalization by construction. Experiments on Wan2.2 and HunyuanVideo show that MXAttention closes at least 95% of the VBench Imaging Quality gap between OCP MXFP4 and FP16, substantially improves frame-level similarity, and preserves FP16-level generation quality with less than 0.01 absolute degradation on all reported VBench metrics. MXAttention also achieves performance competitive with strong NVFP4-based baselines with negligible overhead when fused into the attention pipeline. The implementation is publicly available in MindIE-SD.", "arxiv_id": "2607.24377", "arxiv_url": "https://arxiv.org/abs/2607.24377", "authors": ["Jianlin Yu", "Jing Lin", "Linghui Kong", "Aiyue Chen", "Weiyi Sun", "Chenyu Zeng", "Wangli Lan", "Jinxi Li", "Zhuo Zheng", "Ziyang Yue", "Danning Ke", "Fei Yi", "Tianchi Hu", "Yuan Ding", "Yiwu Yao", "Junsong Wang"], "brief": "\u672c\u6587\u63d0\u51fa MXAttention\uff0c\u4e00\u4e2a\u9762\u5411\u6269\u6563\u89c6\u9891\u751f\u6210\u6a21\u578b\u6ce8\u610f\u529b\u7684\u65e0\u6570\u636e\u540e\u8bad\u7ec3\u91cf\u5316\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u6700\u4f18\u7f29\u653e\u8fb9\u754c\u548c\u9884\u5f52\u4e00\u5316\u91cf\u5316\uff0c\u7f13\u89e3 MXFP4 \u76f4\u63a5\u91cf\u5316\u5bfc\u81f4\u7684\u6570\u503c\u8bef\u5dee\u4e0e\u751f\u6210\u8d28\u91cf\u4e0b\u964d\u3002", "categories": ["cs.LG", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24377", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Universal Optimal Scaling\uff0c\u5229\u7528 2 \u7684\u5e42 microscaling \u7684\u5468\u671f\u7ed3\u6784\uff0c\u63a8\u5bfc\u51fa\u65e0\u9700\u6821\u51c6\u6216\u641c\u7d22\u7684\u5206\u5e03\u65e0\u5173\u6700\u4f18\u8fb9\u754c Qmax=7.25\u3002", "\u63d0\u51fa Pre-Normalization Quantization\uff0c\u5728 softmax \u884c\u6c42\u548c\u524d\u91cf\u5316\u672a\u5f52\u4e00\u5316\u6307\u6570\u9879\uff0c\u4ece\u6784\u9020\u4e0a\u4fdd\u7559\u5f52\u4e00\u5316\u4e00\u81f4\u6027\u3002", "\u5728 Wan2.2 \u548c HunyuanVideo \u4e0a\uff0c\u5f25\u5408 OCP MXFP4 \u4e0e FP16 \u81f3\u5c11 95% \u7684 VBench \u56fe\u50cf\u8d28\u91cf\u5dee\u8ddd\uff0c\u5404\u9879 VBench \u6307\u6807\u76f8\u5bf9 FP16 \u7edd\u5bf9\u4e0b\u964d\u5c0f\u4e8e 0.01\u3002"], "keywords": ["\u91cf\u5316", "\u6ce8\u610f\u529b\u673a\u5236", "\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24377v1", "published_at": "2026-07-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MXAttention: Data-Free Optimal Scaling and Pre-Normalization Quantization for MXFP4 Attention", "tldr": "\u6570\u636e\u65e0\u5173MXFP4\u6ce8\u610f\u529b\u91cf\u5316\u4fdd\u753b\u8d28", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa MXAttention\uff0c\u4e00\u4e2a\u9762\u5411\u6269\u6563\u89c6\u9891\u751f\u6210\u6a21\u578b\u6ce8\u610f\u529b\u7684\u65e0\u6570\u636e\u540e\u8bad\u7ec3\u91cf\u5316\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u6700\u4f18\u7f29\u653e\u8fb9\u754c\u548c\u9884\u5f52\u4e00\u5316\u91cf\u5316\uff0c\u7f13\u89e3 MXFP4 \u76f4\u63a5\u91cf\u5316\u5bfc\u81f4\u7684\u6570\u503c\u8bef\u5dee\u4e0e\u751f\u6210\u8d28\u91cf\u4e0b\u964d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u89c6\u9891\u6269\u6563\u6a21\u578b\u4e2d\u6ce8\u610f\u529b\u8ba1\u7b97\u6602\u8d35\u7684\u95ee\u9898\uff0c\u7ed9\u51fa\u4e86\u65e0\u9700\u6570\u636e\u6821\u51c6\u3001\u51e0\u4e4e\u65e0\u989d\u5916\u5f00\u9500\u4e14\u53ef\u878d\u5408\u90e8\u7f72\u7684 MXFP4 \u91cf\u5316\u65b9\u6848\uff0c\u5728\u663e\u8457\u63d0\u5347\u63a8\u7406\u6548\u7387\u6f5c\u529b\u7684\u540c\u65f6\u63a5\u8fd1\u4fdd\u6301 FP16 \u751f\u6210\u8d28\u91cf\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Language-model agents act through structured tool calls whose arguments carry different risks. Untrusted content may safely influence an email body but should not determine a recipient, account, command, or credential. Existing statistical methods typically control risk over the entire action, allowing failures in rare, high-risk fields to be obscured by benign arguments. We introduce role-stratified per-field conformal risk control, a calibration layer that wraps any per-field detector and sets separate thresholds and risk budgets for semantic argument roles. For a role with prevalence $p_r$, aggregate-only certification must use an effective budget of $\u03b1p_r$ to guarantee role-specific risk $\u03b1$, whereas role-stratified calibration certifies each sufficiently sampled role directly with a finite-sample guarantee; rarer roles are handled by pooled certification. Across AgentDojo and InjecAgent with six language models, the empirical utility gap tracks this predicted price of coarseness, and our method achieves the most consistent role-specific budget compliance under model and attack transfer, detector noise, gradual drift, unseen tool suites, and adaptive attacks. It provides formal per-role guarantees under exchangeability or after recalibration, and empirical compliance under frozen distribution shift. These results suggest that structured tool calls should be certified at the semantic-role level, not the whole action.", "arxiv_id": "2607.24343", "arxiv_url": "https://arxiv.org/abs/2607.24343", "authors": ["Md Ashikur Rahman", "Md Arifur Rahman", "Niamul Hassan Samin", "Khandaker Rifah Tasnia", "Sifat Rahman Ahona", "Juena Ahmed Noshin"], "brief": "\u8bba\u6587\u63d0\u51fa\u9762\u5411LLM\u667a\u80fd\u4f53\u7ed3\u6784\u5316\u5de5\u5177\u8c03\u7528\u7684\u6309\u5b57\u6bb5\u8bed\u4e49\u89d2\u8272\u5206\u5c42\u4fdd\u5f62\u98ce\u9669\u63a7\u5236\u65b9\u6cd5\u3002\u5b83\u4e3a\u4e0d\u540c\u98ce\u9669\u89d2\u8272\u7684\u53c2\u6570\u5206\u522b\u8bbe\u7f6e\u9608\u503c\u4e0e\u98ce\u9669\u9884\u7b97\uff0c\u800c\u975e\u53ea\u5bf9\u6574\u4e2a\u52a8\u4f5c\u505a\u805a\u5408\u98ce\u9669\u8ba4\u8bc1\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24343", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u805a\u5408\u98ce\u9669\u63a7\u5236\u4f1a\u63a9\u76d6\u4f4e\u9891\u4f46\u9ad8\u98ce\u9669\u5b57\u6bb5\u5931\u6548\uff0c\u5982\u6536\u4ef6\u4eba\u3001\u8d26\u6237\u3001\u547d\u4ee4\u3001\u51ed\u8bc1\u7b49\u53c2\u6570\u3002", "\u63d0\u51farole-stratified per-field conformal risk control\uff0c\u53ef\u5305\u88c5\u4efb\u610f\u9010\u5b57\u6bb5\u68c0\u6d4b\u5668\uff0c\u5e76\u5bf9\u6837\u672c\u5145\u8db3\u7684\u89d2\u8272\u7ed9\u51fa\u6709\u9650\u6837\u672c\u4fdd\u8bc1\u3002", "\u5728AgentDojo\u548cInjecAgent\u3001\u516d\u4e2a\u8bed\u8a00\u6a21\u578b\u4e0a\u9a8c\u8bc1\uff0c\u5728\u8fc1\u79fb\u3001\u68c0\u6d4b\u566a\u58f0\u3001\u5206\u5e03\u6f02\u79fb\u3001\u672a\u89c1\u5de5\u5177\u96c6\u548c\u81ea\u9002\u5e94\u653b\u51fb\u4e0b\u66f4\u7a33\u5b9a\u6ee1\u8db3\u89d2\u8272\u7ea7\u98ce\u9669\u9884\u7b97\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u5b89\u5168\u5bf9\u9f50", "\u4fdd\u5f62\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24343v1", "published_at": "2026-07-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Beyond Aggregate Risk: Role-Stratified Conformal Risk Control for LLM Tool Calls", "tldr": "\u6309\u53c2\u6570\u89d2\u8272\u6821\u51c6LLM\u5de5\u5177\u8c03\u7528\u98ce\u9669", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u9762\u5411LLM\u667a\u80fd\u4f53\u7ed3\u6784\u5316\u5de5\u5177\u8c03\u7528\u7684\u6309\u5b57\u6bb5\u8bed\u4e49\u89d2\u8272\u5206\u5c42\u4fdd\u5f62\u98ce\u9669\u63a7\u5236\u65b9\u6cd5\u3002\u5b83\u4e3a\u4e0d\u540c\u98ce\u9669\u89d2\u8272\u7684\u53c2\u6570\u5206\u522b\u8bbe\u7f6e\u9608\u503c\u4e0e\u98ce\u9669\u9884\u7b97\uff0c\u800c\u975e\u53ea\u5bf9\u6574\u4e2a\u52a8\u4f5c\u505a\u805a\u5408\u98ce\u9669\u8ba4\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aLLM\u5de5\u5177\u8c03\u7528\u5b89\u5168\u8ba4\u8bc1\u4ece\u201c\u6574\u4f53\u52a8\u4f5c\u201d\u63a8\u8fdb\u5230\u201c\u8bed\u4e49\u89d2\u8272\u201d\u7c92\u5ea6\uff0c\u5f62\u5f0f\u5316\u523b\u753b\u4e86\u805a\u5408\u8ba4\u8bc1\u7684\u4ee3\u4ef7\uff0c\u5e76\u63d0\u4f9b\u53ef\u63d2\u62d4\u7684\u6821\u51c6\u5c42\uff0c\u5bf9\u667a\u80fd\u4f53\u5b89\u5168\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Modern LLM systems increasingly rely on knowledge-selection processes that produce high-value structured priors, such as ranked evidence, graph topology, multimodal alignment, and confidence signals. Yet LLM serving remains fundamentally oblivious to this rich structure: once such signals are serialized into a prompt, the backend observes only a flat token sequence, forcing dense and uniform consumption of the full key-value (KV) state during decoding. We term this architectural mismatch the Knowledge Selection-Runtime Consumption (KSRC) gap: richer contexts enlarge the full-prompt KV footprint and decode-time memory traffic, increasing latency and degrading throughput even when reasoning depends on only a small fraction of the context. To bridge the gap, we propose Knowledge Access Planning (KAP), a paradigm-shifting execution abstraction that elevates structured knowledge priors from passive prompt-construction hints into first-class physical execution artifacts. KAP establishes a universal intermediate representation (IR)-the runtime access plan-which compiles structured knowledge signals to govern physical KV access without altering logical prompt semantics, model weights, or training procedures. Through this IR, KAP shifts LLM serving from token-aware context consumption to plan-driven, knowledge-aware runtime consumption. We instantiate KAP with GraphSpec, a compiler-executor realization connecting structured knowledge selection to an LLM serving backend. We derive a phase-boundary model for the positive-speedup regime of plan-guided execution. Across 4K-128K long-context QA workloads, GraphSpec maintains answer quality comparable to full-context decoding while decoupling physical KV consumption from prompt length, reducing proposal-time KV access to 5.5% of source KV state at 128K, and fundamentally shifting the scaling trajectory of long-context generation.", "arxiv_id": "2607.24260", "arxiv_url": "https://arxiv.org/abs/2607.24260", "authors": ["Shuo Wang", "Fang Xi", "Wenyuan Huang", "Qing Wang", "Junming Su"], "brief": "\u8bba\u6587\u63d0\u51fa Knowledge Access Planning\uff08KAP\uff09\uff0c\u628a\u68c0\u7d22\u6392\u5e8f\u3001\u56fe\u7ed3\u6784\u3001\u7f6e\u4fe1\u5ea6\u7b49\u7ed3\u6784\u5316\u77e5\u8bc6\u5148\u9a8c\u7f16\u8bd1\u6210\u8fd0\u884c\u65f6\u8bbf\u95ee\u8ba1\u5212\uff0c\u7528\u4e8e\u63a7\u5236\u89e3\u7801\u9636\u6bb5\u7684KV\u7f13\u5b58\u8bbf\u95ee\u3002\u5176\u5b9e\u73b0 GraphSpec \u5728\u4e0d\u6539\u6a21\u578b\u6743\u91cd\u3001\u8bad\u7ec3\u6d41\u7a0b\u548c\u63d0\u793a\u8bed\u4e49\u7684\u524d\u63d0\u4e0b\uff0c\u8ba9LLM\u670d\u52a1\u4ece\u201c\u6309token\u5168\u91cf\u6d88\u8d39\u4e0a\u4e0b\u6587\u201d\u8f6c\u5411\u201c\u6309\u77e5\u8bc6\u8ba1\u5212\u9009\u62e9\u6027\u8bbf\u95ee\u201d\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24260", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa KSRC gap\uff1a\u77e5\u8bc6\u9009\u62e9\u9636\u6bb5\u4ea7\u751f\u4e86\u4e30\u5bcc\u7ed3\u6784\u5316\u4fe1\u53f7\uff0c\u4f46\u63a8\u7406\u540e\u7aef\u53ea\u770b\u5230\u6241\u5e73prompt\uff0c\u5bfc\u81f4\u957f\u4e0a\u4e0b\u6587KV\u7f13\u5b58\u88ab\u5bc6\u96c6\u3001\u5747\u5300\u8bbf\u95ee", "\u8bbe\u8ba1\u7edf\u4e00\u4e2d\u95f4\u8868\u793a runtime access plan\uff0c\u5c06\u7ed3\u6784\u5316\u77e5\u8bc6\u5148\u9a8c\u8f6c\u5316\u4e3a\u7269\u7406\u6267\u884c\u5c42\u7684KV\u8bbf\u95ee\u63a7\u5236\u4fe1\u53f7", "\u57284K\u5230128K\u957f\u4e0a\u4e0b\u6587\u95ee\u7b54\u4efb\u52a1\u4e2d\uff0cGraphSpec\u4fdd\u6301\u63a5\u8fd1\u5168\u4e0a\u4e0b\u6587\u89e3\u7801\u7684\u7b54\u6848\u8d28\u91cf\uff0c\u5e76\u5728128K\u65f6\u5c06proposal\u9636\u6bb5KV\u8bbf\u95ee\u964d\u81f3\u6e90KV\u72b6\u6001\u76845.5%"], "keywords": ["\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u52a0\u901f", "KV\u7f13\u5b58", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24260v1", "published_at": "2026-07-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "KAP: Bridging the Knowledge Selection-Runtime Consumption Gap in LLM Systems", "tldr": "KAP\u7528\u77e5\u8bc6\u8bbf\u95ee\u8ba1\u5212\u52a0\u901f\u957f\u4e0a\u4e0b\u6587LLM\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Knowledge Access Planning\uff08KAP\uff09\uff0c\u628a\u68c0\u7d22\u6392\u5e8f\u3001\u56fe\u7ed3\u6784\u3001\u7f6e\u4fe1\u5ea6\u7b49\u7ed3\u6784\u5316\u77e5\u8bc6\u5148\u9a8c\u7f16\u8bd1\u6210\u8fd0\u884c\u65f6\u8bbf\u95ee\u8ba1\u5212\uff0c\u7528\u4e8e\u63a7\u5236\u89e3\u7801\u9636\u6bb5\u7684KV\u7f13\u5b58\u8bbf\u95ee\u3002\u5176\u5b9e\u73b0 GraphSpec \u5728\u4e0d\u6539\u6a21\u578b\u6743\u91cd\u3001\u8bad\u7ec3\u6d41\u7a0b\u548c\u63d0\u793a\u8bed\u4e49\u7684\u524d\u63d0\u4e0b\uff0c\u8ba9LLM\u670d\u52a1\u4ece\u201c\u6309token\u5168\u91cf\u6d88\u8d39\u4e0a\u4e0b\u6587\u201d\u8f6c\u5411\u201c\u6309\u77e5\u8bc6\u8ba1\u5212\u9009\u62e9\u6027\u8bbf\u95ee\u201d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4ece\u7cfb\u7edf\u6267\u884c\u5c42\u9762\u89e3\u51b3\u957f\u4e0a\u4e0b\u6587LLM\u7684\u5185\u5b58\u5e26\u5bbd\u4e0e\u5ef6\u8fdf\u74f6\u9888\uff0c\u4e0d\u4f9d\u8d56\u5fae\u8c03\u6216\u6a21\u578b\u7ed3\u6784\u4fee\u6539\uff0c\u9002\u5408\u4e0e\u68c0\u7d22\u589e\u5f3a\u3001\u56fe\u77e5\u8bc6\u3001\u591a\u6a21\u6001\u5bf9\u9f50\u7b49\u73b0\u6709\u77e5\u8bc6\u9009\u62e9\u6a21\u5757\u7ed3\u5408\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "AI-driven autonomous research (AR) systems are becoming increasingly effective across a broad range of tasks. Their performance, however, is still evaluated primarily by the quality of the final outcome. In this paper, we argue that the efficiency of the solution-search process is an equally important but often overlooked dimension of performance. A strong AR system should not only produce high-quality results, but also reach them with as small a budget as possible. Search efficiency will become increasingly important as AR expands from domains with inexpensive verification, such as mathematics and coding, to real-world scientific settings in which solution evaluation may require costly physical experiments. To capture this dimension, we propose evaluating AR systems using the area under the curve (AUC) of the Pareto frontier, alongside final outcome quality. We compare several families of search algorithms, including hill climbing, beam search, tree search, and evolutionary search, across twelve systems-optimization tasks. We find that no single search structure is consistently the most efficient. We also show that search efficiency and final outcome quality are distinct performance dimensions: a method that eventually achieves the best result may nevertheless improve slowly and consume substantially more evaluation budget before reaching that result. Because the most effective search policy is generally unknown in advance, we introduce an adaptive procedure called fluid search, which uses a portfolio bandit to dynamically allocate a fixed evaluation budget across a forest of search processes. Across the evaluated tasks, fluid search achieves the highest overall search efficiency, closely matching the performance of a per-task oracle that is given the best search structure for each task in advance.", "arxiv_id": "2607.24647", "arxiv_url": "https://arxiv.org/abs/2607.24647", "authors": ["Haiqian Yang", "Yuan Cao"], "brief": "\u8bba\u6587\u4e3b\u5f20\u81ea\u4e3b\u7814\u7a76\u7cfb\u7edf\u4e0d\u5e94\u53ea\u770b\u6700\u7ec8\u7ed3\u679c\u8d28\u91cf\uff0c\u8fd8\u5e94\u8861\u91cf\u5728\u6709\u9650\u8bc4\u4f30\u9884\u7b97\u4e0b\u627e\u5230\u597d\u89e3\u7684\u6548\u7387\u3002\u4f5c\u8005\u63d0\u51fa\u7528\u5e15\u7d2f\u6258\u524d\u6cbf\u66f2\u7ebf\u4e0b\u9762\u79ef\uff08AUC\uff09\u8bc4\u4f30\u641c\u7d22\u6548\u7387\uff0c\u5e76\u8bbe\u8ba1\u4e86\u57fa\u4e8e\u7ec4\u5408 bandit \u7684 fluid search \u52a8\u6001\u5206\u914d\u641c\u7d22\u9884\u7b97\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24647", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u572812\u4e2a\u7cfb\u7edf\u4f18\u5316\u4efb\u52a1\u4e0a\u6bd4\u8f83\u722c\u5c71\u3001\u675f\u641c\u7d22\u3001\u6811\u641c\u7d22\u3001\u8fdb\u5316\u641c\u7d22\u7b49\u591a\u7c7b\u641c\u7d22\u7b56\u7565\u3002", "\u53d1\u73b0\u6700\u7ec8\u7ed3\u679c\u8d28\u91cf\u4e0e\u641c\u7d22\u6548\u7387\u662f\u4e0d\u540c\u7ef4\u5ea6\uff1a\u6700\u4f18\u6700\u7ec8\u89e3\u7684\u65b9\u6cd5\u53ef\u80fd\u524d\u671f\u6539\u8fdb\u6162\u3001\u6d88\u8017\u66f4\u591a\u9884\u7b97\u3002", "fluid search \u5c06\u9884\u7b97\u52a8\u6001\u5206\u914d\u7ed9\u4e00\u7ec4\u641c\u7d22\u8fc7\u7a0b\uff0c\u6574\u4f53\u6548\u7387\u6700\u9ad8\uff0c\u63a5\u8fd1\u9884\u5148\u77e5\u9053\u6bcf\u4e2a\u4efb\u52a1\u6700\u4f73\u7b56\u7565\u7684 oracle\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u5316\u79d1\u7814", "\u641c\u7d22\u7b97\u6cd5", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24647v1", "published_at": "2026-07-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Efficiency Matters in Autonomous Research", "tldr": "\u7528\u641c\u7d22\u6548\u7387\u8bc4\u4f30\u81ea\u4e3b\u7814\u7a76\u7cfb\u7edf\u5e76\u63d0\u51fafluid search", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4e3b\u5f20\u81ea\u4e3b\u7814\u7a76\u7cfb\u7edf\u4e0d\u5e94\u53ea\u770b\u6700\u7ec8\u7ed3\u679c\u8d28\u91cf\uff0c\u8fd8\u5e94\u8861\u91cf\u5728\u6709\u9650\u8bc4\u4f30\u9884\u7b97\u4e0b\u627e\u5230\u597d\u89e3\u7684\u6548\u7387\u3002\u4f5c\u8005\u63d0\u51fa\u7528\u5e15\u7d2f\u6258\u524d\u6cbf\u66f2\u7ebf\u4e0b\u9762\u79ef\uff08AUC\uff09\u8bc4\u4f30\u641c\u7d22\u6548\u7387\uff0c\u5e76\u8bbe\u8ba1\u4e86\u57fa\u4e8e\u7ec4\u5408 bandit \u7684 fluid search \u52a8\u6001\u5206\u914d\u641c\u7d22\u9884\u7b97\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u6210\u672c/\u9884\u7b97\u6548\u7387\u201d\u660e\u786e\u5f15\u5165\u81ea\u4e3b\u7814\u7a76\u7cfb\u7edf\u8bc4\u4f30\uff0c\u5951\u5408\u771f\u5b9e\u79d1\u5b66\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\u6210\u672c\u9ad8\u7684\u573a\u666f\uff1b\u540c\u65f6\u7ed9\u51fa\u53ef\u64cd\u4f5c\u7684\u81ea\u9002\u5e94\u641c\u7d22\u6846\u67b6\uff0c\u5bf9\u79d1\u7814\u667a\u80fd\u4f53\u548c\u81ea\u52a8\u5316\u4f18\u5316\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Transformer architectures have attracted increasing attention for solving partial differential equations (PDEs), owing to their flexibility in handling irregular discretizations and their ability to capture long-range physical dependencies. However, unlike discrete language tokens or fixed-resolution image patches, observed physical fields are finite samples of underlying infinite-dimensional functions. Consequently, effectively applying Transformers to PDEs requires a tokenizer that respects the functional nature of physical fields and constructs physically expressive tokens from arbitrary discretizations.To this end, we propose \\methodname{Physics Transformer}, a function-projection-based Transformer architecture for physical field prediction. Physics Transformer treats a physical field as a continuous function and partitions its discretization into locality-preserving spatial patches. Within each patch, it dynamically learns a set of adaptive local basis functions and projects the sampled field onto these bases to obtain compact physics tokens. The resulting tokens capture diverse latent physical states while preserving fine-scale spatial structures, enabling efficient global interaction through factorized attention across space and physical states. The projected representation further supports efficient decoding at arbitrary query locations. Extensive experiments on diverse benchmarks, ranging from two-dimensional PDE dynamics to industrial-scale three-dimensional CFD simulations, demonstrate that Physics Transformer accurately captures fine-grained physical structures and achieves state-of-the-art predictive performance. These results establish function projection as a practical and effective foundation for designing Transformer architectures for PDE solving.", "arxiv_id": "2607.24513", "arxiv_url": "https://arxiv.org/abs/2607.24513", "authors": ["Guoze Sun", "Rui Zhang", "Jiankai Tang", "Mengtao Yan", "Runze Mao", "Zhi X. Chen", "Hao Sun"], "brief": "\u672c\u6587\u63d0\u51fa Physics Transformer\uff0c\u5c06\u7269\u7406\u573a\u89c6\u4e3a\u8fde\u7eed\u51fd\u6570\u800c\u975e\u79bb\u6563\u7f51\u683c token\uff0c\u901a\u8fc7\u5c40\u90e8\u51fd\u6570\u6295\u5f71\u751f\u6210\u7d27\u51d1\u4e14\u5177\u7269\u7406\u8868\u8fbe\u529b\u7684 token\uff0c\u7528\u4e8e\u901a\u7528 PDE \u573a\u9884\u6d4b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24513", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u4efb\u610f\u79bb\u6563\u91c7\u6837\u5212\u5206\u4e3a\u4fdd\u6301\u5c40\u90e8\u6027\u7684\u7a7a\u95f4 patch\uff0c\u5e76\u5728\u6bcf\u4e2a patch \u5185\u52a8\u6001\u5b66\u4e60\u81ea\u9002\u5e94\u5c40\u90e8\u57fa\u51fd\u6570", "\u628a\u91c7\u6837\u7269\u7406\u573a\u6295\u5f71\u5230\u5c40\u90e8\u57fa\u4e0a\u5f62\u6210 physics tokens\uff0c\u517c\u987e\u7ec6\u5c3a\u5ea6\u7a7a\u95f4\u7ed3\u6784\u4e0e\u6f5c\u5728\u7269\u7406\u72b6\u6001\u8868\u8fbe", "\u91c7\u7528\u7a7a\u95f4\u4e0e\u7269\u7406\u72b6\u6001\u5206\u89e3\u6ce8\u610f\u529b\u8fdb\u884c\u9ad8\u6548\u5168\u5c40\u4ea4\u4e92\uff0c\u5e76\u652f\u6301\u5728\u4efb\u610f\u67e5\u8be2\u4f4d\u7f6e\u9ad8\u6548\u89e3\u7801"], "keywords": ["PDE\u6c42\u89e3", "Transformer", "\u7269\u7406\u4eff\u771f", "\u51fd\u6570\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24513v1", "published_at": "2026-07-27", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Physics Transformer: Tailoring Transformer for General PDE Prediction", "tldr": "\u7528\u51fd\u6570\u6295\u5f71\u4e3aPDE\u9884\u6d4b\u5b9a\u5236Transformer", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Physics Transformer\uff0c\u5c06\u7269\u7406\u573a\u89c6\u4e3a\u8fde\u7eed\u51fd\u6570\u800c\u975e\u79bb\u6563\u7f51\u683c token\uff0c\u901a\u8fc7\u5c40\u90e8\u51fd\u6570\u6295\u5f71\u751f\u6210\u7d27\u51d1\u4e14\u5177\u7269\u7406\u8868\u8fbe\u529b\u7684 token\uff0c\u7528\u4e8e\u901a\u7528 PDE \u573a\u9884\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 PDE \u4e2d\u7269\u7406\u573a\u7684\u65e0\u9650\u7ef4\u51fd\u6570\u672c\u8d28\u91cd\u65b0\u8bbe\u8ba1 Transformer tokenizer\uff0c\u5728\u4e8c\u7ef4 PDE \u52a8\u529b\u5b66\u548c\u5de5\u4e1a\u7ea7\u4e09\u7ef4 CFD \u4e0a\u53d6\u5f97\u9886\u5148\u6548\u679c\uff0c\u4e3a\u7269\u7406\u4eff\u771f\u4e2d\u7684\u901a\u7528 Transformer \u67b6\u6784\u63d0\u4f9b\u4e86\u5b9e\u7528\u601d\u8def\u3002"}, {"abstract": "The wide-scale use of sparse autoencoders (SAEs) as interpretability tools is limited by inconsistent links between SAE features and model behavior. Features with clear activation descriptions may have weak or unexpected causal effects; steering can vary across prompts or oppose the intended direction; and activation-based feature selection can miss features that produce the desired output change. Prior work has studied feature geometry inside the model, where features are computed. We instead study the geometry of changes in model logits caused by feature interventions. We introduce Feature-Effect Geometry Analysis (FEGA), an unsupervised framework that removes the same active SAE feature across contexts and analyzes the resulting cloud of logit changes. Across SAE variants, consistent one-dimensional effects are rare: few features behave like reusable directions. To interpret this variation, we distinguish value-like features, tied to static information such as factual attributes, from pointer-like features, associated with context-dependent operations. Value-like features more often exhibit structured, low-dimensional effects, although these effects typically span several directions. Pointer-like features, by contrast, predominantly exhibit diffuse effects. Our results show that a feature can be interpretable and causally relevant without providing a stable direction for steering.", "arxiv_id": "2607.24645", "arxiv_url": "https://arxiv.org/abs/2607.24645", "authors": ["Phu Gia Hoang", "Anwoy Chatterjee", "Tanmoy Chakraborty", "Iryna Gurevych", "Subhabrata Dutta"], "brief": "\u8bba\u6587\u63d0\u51fa Feature-Effect Geometry Analysis\uff08FEGA\uff09\uff0c\u4ece\u5e72\u9884 SAE \u7279\u5f81\u540e\u5f15\u8d77\u7684 logits \u53d8\u5316\u6765\u5206\u6790\u7279\u5f81\u7684\u4e0b\u6e38\u56e0\u679c\u6548\u5e94\u3002\u7814\u7a76\u53d1\u73b0 SAE \u7279\u5f81\u65e2\u7f16\u7801\u9759\u6001\u6982\u5ff5\uff0c\u4e5f\u7f16\u7801\u4e0a\u4e0b\u6587\u76f8\u5173\u7684\u64cd\u4f5c\u529f\u80fd\uff0c\u4f46\u591a\u6570\u7279\u5f81\u5e76\u4e0d\u5bf9\u5e94\u53ef\u590d\u7528\u7684\u7a33\u5b9a steering \u65b9\u5411\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24645", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["FEGA \u901a\u8fc7\u5728\u4e0d\u540c\u4e0a\u4e0b\u6587\u4e2d\u79fb\u9664\u540c\u4e00\u6d3b\u8dc3 SAE \u7279\u5f81\uff0c\u5e76\u5206\u6790\u7531\u6b64\u5f62\u6210\u7684 logits \u53d8\u5316\u5206\u5e03\uff0c\u523b\u753b\u7279\u5f81\u7684\u4e0b\u6e38\u6548\u5e94\u51e0\u4f55\u3002", "\u8de8\u591a\u79cd SAE \u53d8\u4f53\u5b9e\u9a8c\u663e\u793a\uff0c\u5177\u6709\u4e00\u81f4\u4e00\u7ef4\u56e0\u679c\u6548\u5e94\u7684\u7279\u5f81\u5f88\u5c11\uff0c\u8bf4\u660e\u8bb8\u591a\u53ef\u89e3\u91ca\u7279\u5f81\u5e76\u4e0d\u80fd\u4f5c\u4e3a\u7a33\u5b9a\u63a7\u5236\u65b9\u5411\u3002", "\u8bba\u6587\u533a\u5206 value-like \u7279\u5f81\u4e0e pointer-like \u7279\u5f81\uff1a\u524d\u8005\u66f4\u5e38\u4ea7\u751f\u4f4e\u7ef4\u7ed3\u6784\u5316\u6548\u5e94\uff0c\u540e\u8005\u591a\u8868\u73b0\u4e3a\u5206\u6563\u3001\u5f3a\u4e0a\u4e0b\u6587\u4f9d\u8d56\u7684\u6548\u5e94\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u6a21\u578b\u64cd\u63a7", "\u8868\u793a\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24645v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Sparse Autoencoders Encode Both Concepts and Functions: The Downstream Geometry of Feature Effects", "tldr": "SAE\u7279\u5f81\u53ef\u89e3\u91ca\u4f46\u672a\u5fc5\u80fd\u7a33\u5b9a\u64cd\u63a7\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Feature-Effect Geometry Analysis\uff08FEGA\uff09\uff0c\u4ece\u5e72\u9884 SAE \u7279\u5f81\u540e\u5f15\u8d77\u7684 logits \u53d8\u5316\u6765\u5206\u6790\u7279\u5f81\u7684\u4e0b\u6e38\u56e0\u679c\u6548\u5e94\u3002\u7814\u7a76\u53d1\u73b0 SAE \u7279\u5f81\u65e2\u7f16\u7801\u9759\u6001\u6982\u5ff5\uff0c\u4e5f\u7f16\u7801\u4e0a\u4e0b\u6587\u76f8\u5173\u7684\u64cd\u4f5c\u529f\u80fd\uff0c\u4f46\u591a\u6570\u7279\u5f81\u5e76\u4e0d\u5bf9\u5e94\u53ef\u590d\u7528\u7684\u7a33\u5b9a steering \u65b9\u5411\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u53ef\u89e3\u91ca SAE \u7279\u5f81\u53ef\u76f4\u63a5\u7528\u4e8e\u7a33\u5b9a\u6a21\u578b\u64cd\u63a7\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u5f3a\u8c03\u5e94\u4ece\u4e0b\u6e38\u884c\u4e3a\u6548\u5e94\u800c\u975e\u4ec5\u4ece\u6fc0\u6d3b\u8bed\u4e49\u6765\u8bc4\u4f30\u7279\u5f81\uff0c\u5bf9\u673a\u68b0\u53ef\u89e3\u91ca\u6027\u548c\u6a21\u578b steering \u65b9\u6cd5\u5177\u6709\u91cd\u8981\u542f\u53d1\u3002"}, {"abstract": "Existing methods mainly adapt pretrained autoregressive (AR) language models to masked diffusion, whereas we directly adapt them to uniform-noise diffusion, where every token remains editable during sampling. However, adapting AR checkpoints across corruption kernels remains challenging because existing DLMs use different objectives and prediction parameterizations. We establish connections among SEDD, MDLM/GIDD, M2S, and Neural CTMC by expressing their conditional losses as a single generalized Kullback--Leibler objective over model reverse rates. We further derive conversions from clean-token predictions to concrete-score, posterior-mean, and exit-rate/jump parameterizations, yielding a shared \\(x_0\\) interface that supports switching between mask and uniform kernels. Building on these connections, we propose \\ours{}, a simple continual pre-training approach for directly adapting pretrained GPT2 checkpoints to uniform-noise diffusion. Through systematic evaluation of 124M- and 355M-parameter models, we show that \\ours{} steadily improves the trade-off between generative perplexity (GenPPL) and unigram entropy as the sampling budget increases from 16 to 256 steps. At 256 steps, \\ours{}-S and \\ours{}-M achieve GenPPL/entropy pairs of \\(97.783/5.2626\\) and \\(71.516/5.6669\\), respectively; no evaluated model at the same scale simultaneously outperforms \\ours{} on both metrics. At both scales, \\ours{} also achieves the highest WinoGrande, SIQA, and BBH accuracy among the compared diffusion models.", "arxiv_id": "2607.24507", "arxiv_url": "https://arxiv.org/abs/2607.24507", "authors": ["Xiaoyi Jiang", "Jingyuan Li", "Yixuan Jiang", "Wei Liu", "Yi Zhu", "Zuoqiang Shi", "Pipi Hu"], "brief": "\u8bba\u6587\u7edf\u4e00\u4e86\u591a\u7c7b\u79bb\u6563\u8bed\u8a00\u6269\u6563\u6a21\u578b\u7684\u8bad\u7ec3\u76ee\u6807\uff0c\u5c06\u5176\u8868\u8ff0\u4e3a\u53cd\u5411\u901f\u7387\u4e0a\u7684\u5e7f\u4e49KL\u76ee\u6807\uff0c\u5e76\u63a8\u5bfc\u4e0d\u540c\u53c2\u6570\u5316\u4e4b\u95f4\u7684\u8f6c\u6362\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u63d0\u51faUNIFUSION\uff0c\u901a\u8fc7\u6301\u7eed\u9884\u8bad\u7ec3\u628a\u9884\u8bad\u7ec3GPT2\u76f4\u63a5\u9002\u914d\u5230\u6240\u6709token\u53ef\u7f16\u8f91\u7684\u5747\u5300\u566a\u58f0\u6269\u6563\u751f\u6210\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24507", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u628aSEDD\u3001MDLM/GIDD\u3001M2S\u3001Neural CTMC\u7b49\u65b9\u6cd5\u7684\u6761\u4ef6\u635f\u5931\u7edf\u4e00\u5230\u53cd\u5411\u901f\u7387\u76ee\u6807\u4e0b\uff0c\u63d0\u4f9b\u5171\u540c\u7406\u8bba\u89c6\u89d2", "\u63d0\u51fa\u4ee5\u5e72\u51c0token\u9884\u6d4b\u4e3a\u5171\u4eabx0\u63a5\u53e3\uff0c\u53ef\u5728mask\u6838\u4e0euniform\u6838\u4e4b\u95f4\u5207\u6362\uff0c\u5e76\u8f6c\u6362\u5230\u5177\u4f53\u5206\u6570\u3001\u540e\u9a8c\u5747\u503c\u3001\u8df3\u8f6c/\u9000\u51fa\u7387\u7b49\u53c2\u6570\u5316", "\u5728124M\u548c355M\u6a21\u578b\u4e0a\uff0cUNIFUSION\u968f\u91c7\u6837\u6b65\u657016\u5230256\u63d0\u5347GenPPL\u4e0eunigram entropy\u6743\u8861\uff0c\u4e14\u5728WinoGrande\u3001SIQA\u3001BBH\u4e0a\u4f18\u4e8e\u540c\u89c4\u6a21\u6269\u6563\u6a21\u578b"], "keywords": ["\u79bb\u6563\u6269\u6563", "\u8bed\u8a00\u6a21\u578b", "\u6301\u7eed\u9884\u8bad\u7ec3", "\u751f\u6210\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24507v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "UNIFUSION: Adapting Autoregressive Language Models into Discrete Diffusion under a Unified Reverse-Rate Objective", "tldr": "\u5c06GPT2\u76f4\u63a5\u9002\u914d\u4e3a\u5747\u5300\u566a\u58f0\u79bb\u6563\u6269\u6563", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7edf\u4e00\u4e86\u591a\u7c7b\u79bb\u6563\u8bed\u8a00\u6269\u6563\u6a21\u578b\u7684\u8bad\u7ec3\u76ee\u6807\uff0c\u5c06\u5176\u8868\u8ff0\u4e3a\u53cd\u5411\u901f\u7387\u4e0a\u7684\u5e7f\u4e49KL\u76ee\u6807\uff0c\u5e76\u63a8\u5bfc\u4e0d\u540c\u53c2\u6570\u5316\u4e4b\u95f4\u7684\u8f6c\u6362\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u63d0\u51faUNIFUSION\uff0c\u901a\u8fc7\u6301\u7eed\u9884\u8bad\u7ec3\u628a\u9884\u8bad\u7ec3GPT2\u76f4\u63a5\u9002\u914d\u5230\u6240\u6709token\u53ef\u7f16\u8f91\u7684\u5747\u5300\u566a\u58f0\u6269\u6563\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u964d\u4f4e\u4e86\u5c06\u81ea\u56de\u5f52\u8bed\u8a00\u6a21\u578b\u8fc1\u79fb\u5230\u79bb\u6563\u6269\u6563\u751f\u6210\u7684\u95e8\u69db\uff0c\u5e76\u5c06\u591a\u79cd\u79bb\u6563\u6269\u6563\u76ee\u6807\u653e\u5165\u7edf\u4e00\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u590d\u7528\u73b0\u6709LLM\u68c0\u67e5\u70b9\u53d1\u5c55\u975e\u81ea\u56de\u5f52\u6587\u672c\u751f\u6210\u6a21\u578b\u3002"}, {"abstract": "This paper studies what discriminatively trained reward models (RMs) memorize by measuring counterfactual memorization on two human preference datasets. We show that RMs 1) misallocate memorization to easy, high margin preference pairs, 2) memorize dataset-specific shortcuts (e.g., model identity, user sampling strategy), and 3) overgeneralize simple heuristic correlates of human preference (e.g., length, compliance) when confronted with unseen preference pairs. Overall, our findings indicate that discriminative training of RMs from human preference data results in biased RMs not yet capable of judging response quality in context-dependent scenarios.", "arxiv_id": "2607.24484", "arxiv_url": "https://arxiv.org/abs/2607.24484", "authors": ["Ivo Verhoeven", "Pushkar Mishra", "Ekaterina Shutova"], "brief": "\u672c\u6587\u901a\u8fc7\u53cd\u4e8b\u5b9e\u8bb0\u5fc6\u6d4b\u91cf\uff0c\u5206\u6790\u5224\u522b\u5f0f\u8bad\u7ec3\u7684\u5956\u52b1\u6a21\u578b\u5728\u4eba\u7c7b\u504f\u597d\u6570\u636e\u4e0a\u5230\u5e95\u8bb0\u4f4f\u4e86\u4ec0\u4e48\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5956\u52b1\u6a21\u578b\u5bb9\u6613\u8bb0\u4f4f\u7b80\u5355\u6837\u672c\u3001\u6570\u636e\u96c6\u6377\u5f84\u548c\u957f\u5ea6/\u670d\u4ece\u6027\u7b49\u542f\u53d1\u5f0f\u504f\u597d\u4fe1\u53f7\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24484", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5956\u52b1\u6a21\u578b\u4f1a\u5c06\u8bb0\u5fc6\u80fd\u529b\u9519\u8bef\u5206\u914d\u5230\u9ad8\u95f4\u9694\u3001\u8f83\u5bb9\u6613\u7684\u504f\u597d\u6837\u672c\u4e0a\uff0c\u800c\u975e\u771f\u6b63\u56f0\u96be\u7684\u8d28\u91cf\u5224\u65ad\u573a\u666f\u3002", "\u6a21\u578b\u4f1a\u8bb0\u4f4f\u6570\u636e\u96c6\u7279\u6709\u6377\u5f84\uff0c\u4f8b\u5982\u751f\u6210\u6a21\u578b\u8eab\u4efd\u3001\u7528\u6237\u91c7\u6837\u7b56\u7565\u7b49\u975e\u8bed\u4e49\u56e0\u7d20\u3002", "\u9762\u5bf9\u672a\u89c1\u8fc7\u7684\u504f\u597d\u5bf9\u65f6\uff0c\u5956\u52b1\u6a21\u578b\u4f1a\u8fc7\u5ea6\u6cdb\u5316\u957f\u5ea6\u3001\u987a\u4ece\u6027\u7b49\u7b80\u5355\u542f\u53d1\u5f0f\u7279\u5f81\uff0c\u5bfc\u81f4\u4e0a\u4e0b\u6587\u76f8\u5173\u5224\u65ad\u80fd\u529b\u4e0d\u8db3\u3002"], "keywords": ["\u5956\u52b1\u6a21\u578b", "\u4eba\u7c7b\u504f\u597d", "\u6a21\u578b\u5bf9\u9f50", "\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24484v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What do Reward Models Memorize?", "tldr": "\u5956\u52b1\u6a21\u578b\u4f1a\u8bb0\u4f4f\u504f\u5dee\u800c\u975e\u771f\u5b9e\u504f\u597d\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u901a\u8fc7\u53cd\u4e8b\u5b9e\u8bb0\u5fc6\u6d4b\u91cf\uff0c\u5206\u6790\u5224\u522b\u5f0f\u8bad\u7ec3\u7684\u5956\u52b1\u6a21\u578b\u5728\u4eba\u7c7b\u504f\u597d\u6570\u636e\u4e0a\u5230\u5e95\u8bb0\u4f4f\u4e86\u4ec0\u4e48\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u5956\u52b1\u6a21\u578b\u5bb9\u6613\u8bb0\u4f4f\u7b80\u5355\u6837\u672c\u3001\u6570\u636e\u96c6\u6377\u5f84\u548c\u957f\u5ea6/\u670d\u4ece\u6027\u7b49\u542f\u53d1\u5f0f\u504f\u597d\u4fe1\u53f7\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u5f53\u524d\u57fa\u4e8e\u4eba\u7c7b\u504f\u597d\u5224\u522b\u8bad\u7ec3\u7684\u5956\u52b1\u6a21\u578b\u5b58\u5728\u7cfb\u7edf\u6027\u504f\u5dee\uff0c\u5bf9RLHF\u3001\u504f\u597d\u4f18\u5316\u548c\u5927\u6a21\u578b\u5bf9\u9f50\u7684\u53ef\u9760\u6027\u63d0\u51fa\u91cd\u8981\u8b66\u793a\u3002"}, {"abstract": "Jailbreak defenses are essential for protecting large language models (LLMs), but they can also introduce secondary costs that weaken model utility. We present a systematic study of these defense trade-offs along three dimensions: performance impact, over-refusal on benign inputs, and inference cost. Rather than treating defenses as a single class, we organize them by operational strategy and examine how different strategies correlate with different side-effect profiles. Across state-of-the-art defense methods, widely used benchmark datasets, and representative open-source LLMs, we find that defenses rarely improve downstream capability, but instead vary in how they trade safety gains against usability and efficiency. In particular, rule-based defenses best preserve task performance, highly conservative self-reflective defenses often increase over-refusal, and multi-round defenses incur the largest runtime overhead. These results provide both a benchmark for evaluating defense side effects and practical guidance for selecting defenses under deployment constraints.", "arxiv_id": "2607.24392", "arxiv_url": "https://arxiv.org/abs/2607.24392", "authors": ["Tong Zhang", "Zexin Li", "Simin Chen", "Yun Peng"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u8d8a\u72f1\u9632\u5fa1\u5728\u4efb\u52a1\u6027\u80fd\u3001\u826f\u6027\u8f93\u5165\u8bef\u62d2\u548c\u63a8\u7406\u6210\u672c\u4e09\u65b9\u9762\u7684\u4ee3\u4ef7\u3002\u4f5c\u8005\u6309\u9632\u5fa1\u7684\u64cd\u4f5c\u7b56\u7565\u5206\u7c7b\uff0c\u5bf9\u591a\u79cd\u524d\u6cbf\u9632\u5fa1\u65b9\u6cd5\u3001\u57fa\u51c6\u6570\u636e\u96c6\u548c\u5f00\u6e90\u6a21\u578b\u8fdb\u884c\u5bf9\u6bd4\u8bc4\u4f30\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24392", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8d8a\u72f1\u9632\u5fa1\u5f88\u5c11\u63d0\u5347\u4e0b\u6e38\u4efb\u52a1\u80fd\u529b\uff0c\u66f4\u591a\u662f\u5728\u5b89\u5168\u6027\u3001\u53ef\u7528\u6027\u548c\u6548\u7387\u4e4b\u95f4\u505a\u53d6\u820d", "\u89c4\u5219\u5f0f\u9632\u5fa1\u6700\u80fd\u4fdd\u6301\u4efb\u52a1\u6027\u80fd\uff0c\u800c\u4fdd\u5b88\u7684\u81ea\u53cd\u601d\u7c7b\u9632\u5fa1\u66f4\u5bb9\u6613\u5bfc\u81f4\u826f\u6027\u8bf7\u6c42\u88ab\u8fc7\u5ea6\u62d2\u7edd", "\u591a\u8f6e\u4ea4\u4e92\u5f0f\u9632\u5fa1\u5e26\u6765\u6700\u5927\u7684\u8fd0\u884c\u65f6\u5f00\u9500\uff0c\u53ef\u80fd\u663e\u8457\u589e\u52a0\u90e8\u7f72\u6210\u672c"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u9632\u5fa1", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24392v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When LLM Defenses Backfire: Characterizing Safety, Performance, and Cost Trade-offs", "tldr": "\u7cfb\u7edf\u8bc4\u4f30LLM\u8d8a\u72f1\u9632\u5fa1\u7684\u526f\u4f5c\u7528\u6743\u8861", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5927\u8bed\u8a00\u6a21\u578b\u8d8a\u72f1\u9632\u5fa1\u5728\u4efb\u52a1\u6027\u80fd\u3001\u826f\u6027\u8f93\u5165\u8bef\u62d2\u548c\u63a8\u7406\u6210\u672c\u4e09\u65b9\u9762\u7684\u4ee3\u4ef7\u3002\u4f5c\u8005\u6309\u9632\u5fa1\u7684\u64cd\u4f5c\u7b56\u7565\u5206\u7c7b\uff0c\u5bf9\u591a\u79cd\u524d\u6cbf\u9632\u5fa1\u65b9\u6cd5\u3001\u57fa\u51c6\u6570\u636e\u96c6\u548c\u5f00\u6e90\u6a21\u578b\u8fdb\u884c\u5bf9\u6bd4\u8bc4\u4f30\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192\u4e1a\u754c\u4e0d\u80fd\u53ea\u770b\u9632\u5fa1\u6210\u529f\u7387\uff0c\u8fd8\u9700\u540c\u65f6\u8bc4\u4f30\u8bef\u62d2\u3001\u6027\u80fd\u9000\u5316\u548c\u63a8\u7406\u6210\u672c\uff0c\u4e3a\u5b9e\u9645\u90e8\u7f72LLM\u5b89\u5168\u9632\u62a4\u63d0\u4f9b\u4e86\u66f4\u5168\u9762\u7684\u57fa\u51c6\u548c\u9009\u578b\u4f9d\u636e\u3002"}, {"abstract": "Dynamic applications, including optimal-transport Flow Matching, repeatedly solve related entropic optimal transport problems, yet conventional distributed Sinkhorn processes frames sequentially and synchronizes after every iteration. We present TemporalSinkhorn, a parallel-in-time executor that batches future candidates and their repairs without making output accuracy speculative. A centered, row-sharded certificate accepts only a deterministic safe prefix. The remaining candidates share packed Sinkhorn updates; an online projective forgetting rate places audit milestones, while a posteriori residual checks recover from every depth underestimate. Prediction can therefore change work placement but cannot authorize an inaccurate output. On 4 A100 GPUs, a 60-run, five-seed grid at n = 2048 shows that forgetting-guided milestones reduce wall time by 1.15x-1.47x relative to auditing every packed iteration in five statistically resolved regime cells. Against a sequential soft c-transform warm start, temporal execution is 1.42x-3.55x faster across six synthetic streams, with zero marginal-tolerance violations. On Flow Matching minibatch streams, temporal execution is 3.054x-3.632x faster than sequential carry at n = 2048, with no tolerance violations. A separate fixed-kernel test on an RTX 4060 Laptop GPU gives a 4.315x geometric-mean speedup. These are complementary deployment studies rather than a controlled hardware comparison. End-to-end Flow Matching integration, optimized-solver comparisons, and multi-node validation remain open.", "arxiv_id": "2607.24741", "arxiv_url": "https://arxiv.org/abs/2607.24741", "authors": ["Xinyang Wen"], "brief": "\u8bba\u6587\u63d0\u51fa TemporalSinkhorn\uff0c\u4e00\u79cd\u9762\u5411\u52a8\u6001\u71b5\u6b63\u5219\u6700\u4f18\u4f20\u8f93\u7684\u65f6\u95f4\u5e76\u884c Sinkhorn \u6267\u884c\u5668\u3002\u5b83\u6279\u91cf\u9884\u6d4b\u672a\u6765\u5019\u9009\u89e3\u5e76\u5171\u4eab\u66f4\u65b0\uff0c\u4f46\u53ea\u901a\u8fc7\u786e\u5b9a\u6027\u7684\u5b89\u5168\u524d\u7f00\u8bc1\u4e66\u8f93\u51fa\u6ee1\u8db3\u7cbe\u5ea6\u7684\u7ed3\u679c\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24741", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4f7f\u7528\u5c45\u4e2d\u3001\u6309\u884c\u5206\u7247\u7684\u8bc1\u4e66\u673a\u5236\uff0c\u786e\u4fdd\u9884\u6d4b\u53ea\u80fd\u5f71\u54cd\u8ba1\u7b97\u8c03\u5ea6\uff0c\u4e0d\u80fd\u653e\u884c\u4e0d\u51c6\u786e\u8f93\u51fa", "\u5f15\u5165\u5728\u7ebf\u6295\u5f71\u9057\u5fd8\u7387\u6765\u5e03\u7f6e\u5ba1\u8ba1\u91cc\u7a0b\u7891\uff0c\u5e76\u7528\u540e\u9a8c\u6b8b\u5dee\u68c0\u67e5\u4ece\u6df1\u5ea6\u4f4e\u4f30\u4e2d\u6062\u590d", "\u5728 4 \u5f20 A100 \u4e0a\u76f8\u8f83\u987a\u5e8f warm start \u52a0\u901f 1.42x-3.55x\uff0c\u5728 Flow Matching minibatch \u6d41\u4e2d\u52a0\u901f 3.054x-3.632x \u4e14\u65e0\u5bb9\u5dee\u8fdd\u89c4"], "keywords": ["\u6700\u4f18\u4f20\u8f93", "\u5e76\u884c\u8ba1\u7b97", "Flow Matching", "Sinkhorn"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24741v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Certified Parallel-in-Time Sinkhorn for Dynamic Entropic Optimal Transport", "tldr": "\u53ef\u8ba4\u8bc1\u5e76\u884c\u5316\u52a8\u6001\u71b5\u6700\u4f18\u4f20\u8f93\u6c42\u89e3", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TemporalSinkhorn\uff0c\u4e00\u79cd\u9762\u5411\u52a8\u6001\u71b5\u6b63\u5219\u6700\u4f18\u4f20\u8f93\u7684\u65f6\u95f4\u5e76\u884c Sinkhorn \u6267\u884c\u5668\u3002\u5b83\u6279\u91cf\u9884\u6d4b\u672a\u6765\u5019\u9009\u89e3\u5e76\u5171\u4eab\u66f4\u65b0\uff0c\u4f46\u53ea\u901a\u8fc7\u786e\u5b9a\u6027\u7684\u5b89\u5168\u524d\u7f00\u8bc1\u4e66\u8f93\u51fa\u6ee1\u8db3\u7cbe\u5ea6\u7684\u7ed3\u679c\u3002", "why_notable": "\u5b83\u9488\u5bf9 Flow Matching \u7b49\u52a8\u6001\u573a\u666f\u4e2d\u53cd\u590d\u6c42\u89e3\u76f8\u8fd1 OT \u95ee\u9898\u7684\u74f6\u9888\uff0c\u63d0\u4f9b\u4e86\u5e26\u7cbe\u5ea6\u8ba4\u8bc1\u7684\u65f6\u95f4\u5e76\u884c\u65b9\u6848\uff0c\u5728\u4e0d\u727a\u7272\u53ef\u9760\u6027\u7684\u524d\u63d0\u4e0b\u83b7\u5f97\u663e\u8457\u52a0\u901f\uff0c\u5177\u6709\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "On-policy distillation (OPD) adapts diffusion models by querying a teacher along trajectories generated by the current student, but how it should behave under classifier-free guidance (CFG), a default component of modern diffusion systems, remains poorly understood. Existing OPD methods naturally extend velocity matching to the CFG-composed prediction, directly matching teacher and student guided velocities. We show that this objective is under-identified at the branch level: positive- and negative-branch errors can compensate in the guided prediction. Through two contrasting cases, we find that naive matching remains effective under shared negative conditioning, where both branch errors decrease jointly. When the model\u0027s native CFG schema retains privileged information in the teacher\u0027s negative branch that is unavailable to the student, however, this joint reduction breaks down and the composed objective induces antagonistic branch-error dynamics, reducing the positive-branch error while increasing the negative-branch error. We term this failure mode Negative Branch Asymmetry (NBA). To address NBA, we introduce Positive--Direction Matching (PDM), a branch-aware OPD objective that separately constrains the positive prediction and the CFG conditional direction. We apply PDM to dense-to-sparse video control, where naive guided matching is highly sensitive to inference guidance scales, while branch-aware supervision enables more robust and effective knowledge transfer.", "arxiv_id": "2607.24731", "arxiv_url": "https://arxiv.org/abs/2607.24731", "authors": ["Bingnan Li", "Haozhe Wang", "Haozhong Xiong", "Fangtai Wu", "Jinpeng Yu", "Yang Shi", "Jiaming Liu", "Ruihua Huang"], "brief": "\u672c\u6587\u5206\u6790\u4e86\u5206\u7c7b\u5668\u81ea\u7531\u5f15\u5bfc\uff08CFG\uff09\u4e0b\u7684\u5728\u7ebf\u6269\u6563\u84b8\u998f\uff0c\u6307\u51fa\u76f4\u63a5\u5339\u914d\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u5f15\u5bfc\u901f\u5ea6\u4f1a\u5728\u6b63/\u8d1f\u5206\u652f\u5c42\u9762\u6b20\u7ea6\u675f\u3002\u4f5c\u8005\u63d0\u51fa Positive-Direction Matching\uff08PDM\uff09\uff0c\u5206\u522b\u7ea6\u675f\u6b63\u5206\u652f\u9884\u6d4b\u4e0eCFG\u6761\u4ef6\u65b9\u5411\uff0c\u4ee5\u7f13\u89e3\u8d1f\u5206\u652f\u4e0d\u5bf9\u79f0\u95ee\u9898\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24731", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u73b0\u6709CFG\u7ec4\u5408\u9884\u6d4b\u5339\u914d\u76ee\u6807\u5b58\u5728\u5206\u652f\u7ea7\u6b20\u8bc6\u522b\uff1a\u6b63\u5206\u652f\u4e0e\u8d1f\u5206\u652f\u8bef\u5dee\u53ef\u5728\u5f15\u5bfc\u9884\u6d4b\u4e2d\u76f8\u4e92\u62b5\u6d88", "\u63d0\u51fa Negative Branch Asymmetry\uff08NBA\uff09\u5931\u6548\u6a21\u5f0f\uff1a\u5f53\u6559\u5e08\u8d1f\u5206\u652f\u542b\u6709\u5b66\u751f\u4e0d\u53ef\u5f97\u7684\u7279\u6743\u4fe1\u606f\u65f6\uff0c\u8d1f\u5206\u652f\u8bef\u5dee\u4f1a\u88ab\u653e\u5927", "\u5728\u7a20\u5bc6\u5230\u7a00\u758f\u89c6\u9891\u63a7\u5236\u4efb\u52a1\u4e2d\uff0cPDM\u76f8\u6bd4\u6734\u7d20\u5f15\u5bfc\u5339\u914d\u5bf9\u63a8\u7406CFG\u5c3a\u5ea6\u66f4\u9c81\u68d2"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u89c6\u9891\u751f\u6210", "\u6761\u4ef6\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24731v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Rethinking Classifier-Free Guidance in On-Policy Diffusion Distillation", "tldr": "\u91cd\u6784\u5e26CFG\u7684\u6269\u6563\u5728\u7ebf\u84b8\u998f\u76ee\u6807", "upvotes": 0, "what_it_is": "\u672c\u6587\u5206\u6790\u4e86\u5206\u7c7b\u5668\u81ea\u7531\u5f15\u5bfc\uff08CFG\uff09\u4e0b\u7684\u5728\u7ebf\u6269\u6563\u84b8\u998f\uff0c\u6307\u51fa\u76f4\u63a5\u5339\u914d\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u5f15\u5bfc\u901f\u5ea6\u4f1a\u5728\u6b63/\u8d1f\u5206\u652f\u5c42\u9762\u6b20\u7ea6\u675f\u3002\u4f5c\u8005\u63d0\u51fa Positive-Direction Matching\uff08PDM\uff09\uff0c\u5206\u522b\u7ea6\u675f\u6b63\u5206\u652f\u9884\u6d4b\u4e0eCFG\u6761\u4ef6\u65b9\u5411\uff0c\u4ee5\u7f13\u89e3\u8d1f\u5206\u652f\u4e0d\u5bf9\u79f0\u95ee\u9898\u3002", "why_notable": "\u8bba\u6587\u63ed\u793a\u4e86\u73b0\u4ee3\u6269\u6563\u6a21\u578b\u9ed8\u8ba4CFG\u673a\u5236\u5728\u5728\u7ebf\u84b8\u998f\u4e2d\u7684\u9690\u85cf\u5931\u6548\u539f\u56e0\uff0c\u5e76\u7ed9\u51fa\u5206\u652f\u611f\u77e5\u7684\u8bad\u7ec3\u76ee\u6807\uff0c\u5bf9\u89c6\u9891\u63a7\u5236\u548c\u6269\u6563\u6a21\u578b\u538b\u7f29/\u8fc1\u79fb\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The Deep Galerkin Method (DGM) and Physics Informed Neural Networks (PINNs) have become widely-used methods for solving partial differential equations (PDEs) in the rapidly growing field of scientific machine learning. In these methods, a neural network is trained to approximate the PDE solution by using (stochastic) gradient descent to minimize the PDE residual of the neural network. Due to the non-convexity of the PDE residual objective function, the trained neural network may, in principle, only converge to a local minimizer of the objective function (which would not be a solution of the PDE). Therefore, there is a longstanding question regarding the mathematical foundations of these algorithms, and it is highly valuable to establish that the trained neural network will converge to the PDE solution. For a class of semi-linear PDEs (nonlinear in the solution and its first derivative), we prove that neural networks trained with gradient descent to minimize the PDE residual objective function will converge to the PDE solution.", "arxiv_id": "2607.24726", "arxiv_url": "https://arxiv.org/abs/2607.24726", "authors": ["Justin Sirignano", "Konstantinos Spiliopoulos", "Samuel Cohen"], "brief": "\u672c\u6587\u4e3aDGM\u548cPINN\u6c42\u89e3\u975e\u7ebf\u6027\u504f\u5fae\u5206\u65b9\u7a0b\u63d0\u4f9b\u6570\u5b66\u6536\u655b\u6027\u4fdd\u8bc1\u3002\u4f5c\u8005\u8bc1\u660e\uff1a\u5bf9\u4e00\u7c7b\u5173\u4e8e\u89e3\u53ca\u5176\u4e00\u9636\u5bfc\u6570\u975e\u7ebf\u6027\u7684\u534a\u7ebf\u6027PDE\uff0c\u7528\u68af\u5ea6\u4e0b\u964d\u6700\u5c0f\u5316PDE\u6b8b\u5dee\u8bad\u7ec3\u795e\u7ecf\u7f51\u7edc\u65f6\uff0c\u7f51\u7edc\u4f1a\u6536\u655b\u5230\u771f\u5b9ePDE\u89e3\u3002", "categories": ["cs.LG", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24726", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9DGM/PINN\u4e2d\u975e\u51f8\u6b8b\u5dee\u76ee\u6807\u53ef\u80fd\u9677\u5165\u5c40\u90e8\u6781\u5c0f\u7684\u95ee\u9898\uff0c\u7ed9\u51fa\u5168\u5c40\u6536\u655b\u7406\u8bba\u7ed3\u679c", "\u9002\u7528\u5bf9\u8c61\u662f\u4e00\u7c7b\u534a\u7ebf\u6027PDE\uff0c\u975e\u7ebf\u6027\u53ef\u51fa\u73b0\u5728\u89e3\u672c\u8eab\u53ca\u5176\u4e00\u9636\u5bfc\u6570\u4e2d", "\u8bc1\u660e\u68af\u5ea6\u4e0b\u964d\u8bad\u7ec3\u795e\u7ecf\u7f51\u7edc\u6700\u5c0f\u5316PDE\u6b8b\u5dee\u65f6\uff0c\u6781\u9650\u5bf9\u5e94PDE\u771f\u5b9e\u89e3\u800c\u975e\u4f2a\u89e3"], "keywords": ["\u79d1\u5b66\u673a\u5668\u5b66\u4e60", "PINN", "\u504f\u5fae\u5206\u65b9\u7a0b", "\u4f18\u5316\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24726v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Global Convergence of DGM and PINN Algorithms for Solving Nonlinear PDEs", "tldr": "\u8bc1\u660eDGM/PINN\u6c42\u89e3\u534a\u7ebf\u6027PDE\u5168\u5c40\u6536\u655b", "upvotes": 0, "what_it_is": "\u672c\u6587\u4e3aDGM\u548cPINN\u6c42\u89e3\u975e\u7ebf\u6027\u504f\u5fae\u5206\u65b9\u7a0b\u63d0\u4f9b\u6570\u5b66\u6536\u655b\u6027\u4fdd\u8bc1\u3002\u4f5c\u8005\u8bc1\u660e\uff1a\u5bf9\u4e00\u7c7b\u5173\u4e8e\u89e3\u53ca\u5176\u4e00\u9636\u5bfc\u6570\u975e\u7ebf\u6027\u7684\u534a\u7ebf\u6027PDE\uff0c\u7528\u68af\u5ea6\u4e0b\u964d\u6700\u5c0f\u5316PDE\u6b8b\u5dee\u8bad\u7ec3\u795e\u7ecf\u7f51\u7edc\u65f6\uff0c\u7f51\u7edc\u4f1a\u6536\u655b\u5230\u771f\u5b9ePDE\u89e3\u3002", "why_notable": "PINN\u548cDGM\u5728\u79d1\u5b66\u673a\u5668\u5b66\u4e60\u4e2d\u5e94\u7528\u5e7f\u6cdb\uff0c\u4f46\u957f\u671f\u7f3a\u4e4f\u53ef\u9760\u7684\u975e\u51f8\u4f18\u5316\u6536\u655b\u7406\u8bba\u3002\u8be5\u5de5\u4f5c\u4e3a\u5176\u6c42\u89e3\u975e\u7ebf\u6027PDE\u63d0\u4f9b\u4e86\u66f4\u575a\u5b9e\u7684\u6570\u5b66\u57fa\u7840\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u65b9\u6cd5\u53ef\u4fe1\u5ea6\u3002"}, {"abstract": "Entity matching identifies records that refer to the same real-world entity. Language models can be adapted to this task through bi-encoder, cross-encoder, and generative matcher architectures. However, prior studies often conflate matcher architecture with differences in model backbone, model variant(reflecting different pretraining objectives), and model size, making it difficult to isolate the sources of performance gains. We address this issue through a controlled factorial study spanning three matcher architectures, three model variants and three model sizes from the Qwen3 family, and nine datasets, totaling 1,215 fine-tuning runs. We also evaluate cross-dataset transferability and computational cost. Our results show that model variant is critical for bi-encoders: embedding-oriented variants provide stronger initialization and more favorable representation geometry predictive of downstream matching performance. Cross-encoders retain a consistent advantage over bi-encoders because they jointly encode record pairs rather than representing each record independently, although larger models partially narrow this gap. Generative matchers do not universally outperform cross-encoders. Instead, their advantages concentrate under distribution shift, including subtle unseen differences in record schemas and cross-dataset transfer. We further find that larger models rely more heavily on shortcut learning and therefore do not necessarily perform better. These findings clarify the factors underlying performance differences across matcher architectures and motivate future research and benchmark designs that better disentangle architectural choices from model-level factors while explicitly evaluating distribution shift and cross-dataset transferability. We release our experimental results, code, training scripts, and evaluation data at https://github.com/Jantory/llm-trained-matcher.", "arxiv_id": "2607.24688", "arxiv_url": "https://arxiv.org/abs/2607.24688", "authors": ["Zeyu Zhang", "Xue Li", "Iacer Calixto", "Paul Groth", "Sebastian Schelter"], "brief": "\u8fd9\u7bc7\u8bba\u6587\u5bf9\u57fa\u4e8e\u8bed\u8a00\u6a21\u578b\u7684\u5b9e\u4f53\u5339\u914d\u8fdb\u884c\u53d7\u63a7\u56e0\u5b50\u5b9e\u9a8c\uff0c\u6bd4\u8f83 bi-encoder\u3001cross-encoder \u548c\u751f\u6210\u5f0f\u5339\u914d\u5668\u4e09\u7c7b\u67b6\u6784\u3002\u7814\u7a76\u8986\u76d6 Qwen3 \u7cfb\u5217\u7684\u4e0d\u540c\u6a21\u578b\u53d8\u4f53\u3001\u89c4\u6a21\u4e0e\u4e5d\u4e2a\u6570\u636e\u96c6\uff0c\u5171 1215 \u6b21\u5fae\u8c03\uff0c\u5e76\u8bc4\u4f30\u8de8\u6570\u636e\u96c6\u8fc1\u79fb\u548c\u8ba1\u7b97\u6210\u672c\u3002", "categories": ["cs.DB", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24688", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["bi-encoder \u7684\u8868\u73b0\u9ad8\u5ea6\u4f9d\u8d56\u6a21\u578b\u53d8\u4f53\uff0c\u9762\u5411\u5d4c\u5165\u7684\u9884\u8bad\u7ec3\u53d8\u4f53\u80fd\u63d0\u4f9b\u66f4\u597d\u7684\u521d\u59cb\u5316\u548c\u8868\u793a\u51e0\u4f55\u7ed3\u6784\u3002", "cross-encoder \u56e0\u8054\u5408\u7f16\u7801\u8bb0\u5f55\u5bf9\u800c\u6301\u7eed\u4f18\u4e8e bi-encoder\uff0c\u4f46\u66f4\u5927\u6a21\u578b\u53ef\u90e8\u5206\u7f29\u5c0f\u5dee\u8ddd\u3002", "\u751f\u6210\u5f0f\u5339\u914d\u5668\u5e76\u975e\u666e\u904d\u4f18\u4e8e cross-encoder\uff0c\u5176\u4f18\u52bf\u4e3b\u8981\u51fa\u73b0\u5728\u5206\u5e03\u504f\u79fb\u3001\u672a\u89c1\u8bb0\u5f55\u6a21\u5f0f\u5dee\u5f02\u548c\u8de8\u6570\u636e\u96c6\u8fc1\u79fb\u573a\u666f\u3002"], "keywords": ["\u5b9e\u4f53\u5339\u914d", "\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u68c0\u7d22", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24688v1",
