"published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Scale and Generation: Understanding Language Model-based Entity Matching", "tldr": "\u7cfb\u7edf\u62c6\u89e3\u8bed\u8a00\u6a21\u578b\u5b9e\u4f53\u5339\u914d\u7684\u6027\u80fd\u6765\u6e90", "upvotes": 0, "what_it_is": "\u8fd9\u7bc7\u8bba\u6587\u5bf9\u57fa\u4e8e\u8bed\u8a00\u6a21\u578b\u7684\u5b9e\u4f53\u5339\u914d\u8fdb\u884c\u53d7\u63a7\u56e0\u5b50\u5b9e\u9a8c\uff0c\u6bd4\u8f83 bi-encoder\u3001cross-encoder \u548c\u751f\u6210\u5f0f\u5339\u914d\u5668\u4e09\u7c7b\u67b6\u6784\u3002\u7814\u7a76\u8986\u76d6 Qwen3 \u7cfb\u5217\u7684\u4e0d\u540c\u6a21\u578b\u53d8\u4f53\u3001\u89c4\u6a21\u4e0e\u4e5d\u4e2a\u6570\u636e\u96c6\uff0c\u5171 1215 \u6b21\u5fae\u8c03\uff0c\u5e76\u8bc4\u4f30\u8de8\u6570\u636e\u96c6\u8fc1\u79fb\u548c\u8ba1\u7b97\u6210\u672c\u3002", "why_notable": "\u8be5\u7814\u7a76\u901a\u8fc7\u5927\u89c4\u6a21\u53d7\u63a7\u5b9e\u9a8c\u533a\u5206\u4e86\u67b6\u6784\u3001\u9884\u8bad\u7ec3\u76ee\u6807\u548c\u6a21\u578b\u89c4\u6a21\u5bf9\u5b9e\u4f53\u5339\u914d\u6027\u80fd\u7684\u5f71\u54cd\uff0c\u6311\u6218\u4e86\u201c\u6a21\u578b\u8d8a\u5927\u8d8a\u597d\u201d\u548c\u201c\u751f\u6210\u5f0f\u5fc5\u7136\u66f4\u5f3a\u201d\u7684\u7b80\u5355\u7ed3\u8bba\uff0c\u5bf9\u6570\u636e\u5e93\u5b9e\u4f53\u89e3\u6790\u4efb\u52a1\u7684\u6a21\u578b\u9009\u62e9\u548c\u57fa\u51c6\u8bbe\u8ba1\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Variational quantum circuits have been central to many proposed near-term applications of quantum computing, but a growing body of evidence suggests that trainability and quantum advantage are fundamentally at odds: ans\u00e4tze expressive enough to resist efficient classical simulation tend to exhibit barren plateaus, while structures that provably rule out barren plateaus typically render them classically simulable. We propose a stacked linear combination of unitaries (S-LCU) as a variational ansatz which provides a tunable trade-off between barren plateaus and classical simulability. Using a diagrammatic analysis, we bound the loss-landscape variance of the Free Fermion S-LCU, whose elements are fermionic Gaussian unitaries. We prove a variance lower bound of $\u03a9(1/(n k^{3l}))$, with a simulation cost of $O(k^{2l} n^3)$ using the best known classical algorithm, compared to a quantum gate complexity of only $O(lkn^2)$. The number of layers $l$ serves as a single dial that trades computational complexity against the rate of cost concentration. This offers practitioners a systematic method for constructing ans\u00e4tze with a complexity-trainability trade-off that best suits their application and hardware.", "arxiv_id": "2607.24686", "arxiv_url": "https://arxiv.org/abs/2607.24686", "authors": ["Nikhil Khatri", "Stefan Zohren", "Gabriel Matos"], "brief": "\u8bba\u6587\u63d0\u51fa\u5806\u53e0\u7ebf\u6027\u9149\u7ec4\u5408\uff08S-LCU\uff09\u4f5c\u4e3a\u53d8\u5206\u91cf\u5b50\u7ebf\u8def ansatz\uff0c\u5728\u8d2b\u7620\u9ad8\u539f\u98ce\u9669\u4e0e\u7ecf\u5178\u53ef\u6a21\u62df\u6027\u4e4b\u95f4\u63d0\u4f9b\u53ef\u8c03\u6298\u4e2d\u3002\u4f5c\u8005\u91cd\u70b9\u5206\u6790\u7531\u8d39\u7c73\u9ad8\u65af\u9149\u6784\u6210\u7684 Free Fermion S-LCU\uff0c\u5e76\u7ed9\u51fa\u635f\u5931\u666f\u89c2\u65b9\u5dee\u4e0e\u6a21\u62df\u590d\u6742\u5ea6\u754c\u3002", "categories": ["quant-ph", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24686", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8bc1\u660e Free Fermion S-LCU \u7684\u65b9\u5dee\u4e0b\u754c\u4e3a \u03a9(1/(n k^{3l}))\uff0c\u8868\u660e\u5c42\u6570\u3001\u7ec4\u5408\u89c4\u6a21\u4f1a\u5f71\u54cd\u6210\u672c\u51fd\u6570\u96c6\u4e2d\u901f\u5ea6\u3002", "\u6700\u4f73\u5df2\u77e5\u7ecf\u5178\u6a21\u62df\u6210\u672c\u4e3a O(k^{2l} n^3)\uff0c\u800c\u91cf\u5b50\u95e8\u590d\u6742\u5ea6\u4ec5\u4e3a O(lkn^2)\uff0c\u4f53\u73b0\u6f5c\u5728\u590d\u6742\u5ea6\u4f18\u52bf\u3002", "\u5c42\u6570 l \u4f5c\u4e3a\u5355\u4e00\u8c03\u8282\u65cb\u94ae\uff0c\u53ef\u7cfb\u7edf\u63a7\u5236\u8868\u8fbe\u80fd\u529b\u3001\u7ecf\u5178\u96be\u6a21\u62df\u6027\u4e0e\u53ef\u8bad\u7ec3\u6027\u4e4b\u95f4\u7684\u6743\u8861\u3002"], "keywords": ["\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u53d8\u5206\u91cf\u5b50\u7ebf\u8def", "\u53ef\u8bad\u7ec3\u6027", "\u7ecf\u5178\u6a21\u62df"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24686v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Stacking the Deck: Tunable Trainability in Stacked LCUs", "tldr": "\u7528\u5806\u53e0LCU\u8c03\u63a7\u91cf\u5b50\u7ebf\u8def\u53ef\u8bad\u7ec3\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5806\u53e0\u7ebf\u6027\u9149\u7ec4\u5408\uff08S-LCU\uff09\u4f5c\u4e3a\u53d8\u5206\u91cf\u5b50\u7ebf\u8def ansatz\uff0c\u5728\u8d2b\u7620\u9ad8\u539f\u98ce\u9669\u4e0e\u7ecf\u5178\u53ef\u6a21\u62df\u6027\u4e4b\u95f4\u63d0\u4f9b\u53ef\u8c03\u6298\u4e2d\u3002\u4f5c\u8005\u91cd\u70b9\u5206\u6790\u7531\u8d39\u7c73\u9ad8\u65af\u9149\u6784\u6210\u7684 Free Fermion S-LCU\uff0c\u5e76\u7ed9\u51fa\u635f\u5931\u666f\u89c2\u65b9\u5dee\u4e0e\u6a21\u62df\u590d\u6742\u5ea6\u754c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6b63\u9762\u56de\u5e94\u53d8\u5206\u91cf\u5b50\u7b97\u6cd5\u4e2d\u201c\u53ef\u8bad\u7ec3\u6027 vs \u91cf\u5b50\u4f18\u52bf\u201d\u7684\u6838\u5fc3\u77db\u76fe\uff0c\u63d0\u4f9b\u4e86\u4e00\u4e2a\u53ef\u8bc1\u660e\u3001\u53ef\u8c03\u53c2\u7684 ansatz \u8bbe\u8ba1\u6846\u67b6\uff0c\u5bf9\u8fd1\u4e2d\u671f\u91cf\u5b50\u7b97\u6cd5\u548c\u786c\u4ef6\u9002\u914d\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Modern large language models scale successfully by pairing capacity growth with efficiency, keeping per-token and deployment costs under control as capacity grows. AIGC Foundation Models (AFMs), especially diffusion-transformer backbones, have begun to adopt sparse experts, but recent efforts mostly enlarge total parameter counts and sparsity ratios without importing the efficiency mechanisms that made LLM scaling practical, so generation quality is seldom balanced against training and deployment cost. This raises a natural question: can the architectural principles behind efficient LLM scaling be adapted to AFMs in a more balanced way? We introduce ModernMOE (MMOE), a modernization of SiT-style diffusion transformers that systematically adapts routed experts, shared and lightweight experts, gate-residual routing, and attention-residual information reuse to AIGC generation. Rather than treating MoE as a single plug-in replacement, MMOE studies how different modern expert components affect convergence, efficiency, and generation quality when composed inside a diffusion transformer. Every experiment in this paper is trained on a single eight-GPU H100 node with batch size 256 for 400k steps, an accessible single-machine budget. Under matched training and sampling protocols and at this budget, MMOE reaches lower FID at every recorded checkpoint, that is, it converges faster per training step, than dense and intermediate sparse-expert baselines, and among the sparse variants it attains the best quality-cost balance. Routing analysis further shows stable expert specialization across depth, substantial use of lightweight routes, and modest step-to-step routing changes during denoising. These results suggest that AFMs can follow the balanced scaling path of LLMs by importing proven efficiency designs, rather than by simply increasing total parameters and sparsity ratios.", "arxiv_id": "2607.24665", "arxiv_url": "https://arxiv.org/abs/2607.24665", "authors": ["Yanhao Jia", "Jiepeng Wang", "Haibin Huang", "Chi Zhang", "Erik Cambria", "Xuelong Li"], "brief": "\u8bba\u6587\u63d0\u51fa ModernMOE\uff08MMOE\uff09\uff0c\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u6210\u719f\u7684\u9ad8\u6548\u4e13\u5bb6\u8bbe\u8ba1\u7cfb\u7edf\u8fc1\u79fb\u5230 SiT \u98ce\u683c\u6269\u6563 Transformer\u3002\u5b83\u4e0d\u662f\u7b80\u5355\u6269\u5927\u7a00\u758f\u4e13\u5bb6\u89c4\u6a21\uff0c\u800c\u662f\u7ec4\u5408\u8def\u7531\u4e13\u5bb6\u3001\u5171\u4eab/\u8f7b\u91cf\u4e13\u5bb6\u3001\u95e8\u63a7\u6b8b\u5dee\u8def\u7531\u548c\u6ce8\u610f\u529b\u6b8b\u5dee\u4fe1\u606f\u590d\u7528\uff0c\u4ee5\u63d0\u5347\u751f\u6210\u8d28\u91cf\u4e0e\u8bad\u7ec3\u90e8\u7f72\u6548\u7387\u7684\u5e73\u8861\u3002", "categories": ["cs.CV", "cs.GR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24665", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5f15\u5165\u8def\u7531\u4e13\u5bb6\u3001\u5171\u4eab\u4e13\u5bb6\u3001\u8f7b\u91cf\u4e13\u5bb6\u7b49\u73b0\u4ee3 MoE \u7ec4\u4ef6\uff0c\u5e76\u5206\u6790\u5b83\u4eec\u5728\u6269\u6563 Transformer \u4e2d\u5bf9\u6536\u655b\u3001\u6548\u7387\u548c\u751f\u6210\u8d28\u91cf\u7684\u5f71\u54cd", "\u5728\u5355\u53f0 8\u00d7H100\u3001batch size 256\u3001\u8bad\u7ec3 400k steps \u7684\u53ef\u8bbf\u95ee\u9884\u7b97\u4e0b\uff0cMMOE \u5728\u6240\u6709\u8bb0\u5f55\u68c0\u67e5\u70b9\u5747\u53d6\u5f97\u66f4\u4f4e FID\uff0c\u6536\u655b\u901f\u5ea6\u4f18\u4e8e\u7a20\u5bc6\u548c\u4e2d\u95f4\u7a00\u758f\u4e13\u5bb6\u57fa\u7ebf", "\u8def\u7531\u5206\u6790\u663e\u793a\u4e13\u5bb6\u5728\u4e0d\u540c\u6df1\u5ea6\u5f62\u6210\u7a33\u5b9a\u4e13\u5316\uff0c\u8f7b\u91cf\u8def\u7531\u88ab\u5145\u5206\u5229\u7528\uff0c\u53bb\u566a\u8fc7\u7a0b\u4e2d\u9010\u6b65\u8def\u7531\u53d8\u5316\u8f83\u6e29\u548c"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u7a00\u758f\u4e13\u5bb6", "\u751f\u6210\u6a21\u578b", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24665v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MMOE: Modernizing Diffusion Transformers with Efficient Expert Design", "tldr": "\u7528\u9ad8\u6548MoE\u6539\u9020\u6269\u6563Transformer", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ModernMOE\uff08MMOE\uff09\uff0c\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\u6210\u719f\u7684\u9ad8\u6548\u4e13\u5bb6\u8bbe\u8ba1\u7cfb\u7edf\u8fc1\u79fb\u5230 SiT \u98ce\u683c\u6269\u6563 Transformer\u3002\u5b83\u4e0d\u662f\u7b80\u5355\u6269\u5927\u7a00\u758f\u4e13\u5bb6\u89c4\u6a21\uff0c\u800c\u662f\u7ec4\u5408\u8def\u7531\u4e13\u5bb6\u3001\u5171\u4eab/\u8f7b\u91cf\u4e13\u5bb6\u3001\u95e8\u63a7\u6b8b\u5dee\u8def\u7531\u548c\u6ce8\u610f\u529b\u6b8b\u5dee\u4fe1\u606f\u590d\u7528\uff0c\u4ee5\u63d0\u5347\u751f\u6210\u8d28\u91cf\u4e0e\u8bad\u7ec3\u90e8\u7f72\u6548\u7387\u7684\u5e73\u8861\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 LLM \u4e2d\u9a8c\u8bc1\u8fc7\u7684\u9ad8\u6548\u6269\u5c55\u601d\u60f3\u7cfb\u7edf\u5f15\u5165 AIGC \u6269\u6563\u57fa\u7840\u6a21\u578b\uff0c\u5f3a\u8c03\u8d28\u91cf\u3001\u8bad\u7ec3\u6210\u672c\u548c\u90e8\u7f72\u6210\u672c\u7684\u5e73\u8861\uff0c\u800c\u975e\u5355\u7eaf\u5806\u53c2\u6570\u6216\u63d0\u9ad8\u7a00\u758f\u7387\uff0c\u5bf9\u9ad8\u6548\u751f\u6210\u6a21\u578b\u67b6\u6784\u8bbe\u8ba1\u5177\u6709\u5b9e\u7528\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Generative models of temporal graphs are trained on one stretch of an evolving network and deployed on the next, and they degrade badly in the gap. We show this degradation is derivable, general, and not fixable from observations. The masked flow-matching loss decomposes exactly, with no independence assumption, into an irreducible entropy plus a divergence whose derivative along the training path is positive precisely for structures rare during training and common at deployment, diverging as their training probability goes to zero. Empirically the trade-off is a power law with exponent $-0.605$ ($R^2=0.9977$), and drift raises the sampler\u0027s error floor without changing how many steps reach it: across seven well-powered conditions the drift-period marginal error varies by at most $6\\%$ over a $50\\times$ range of sampling budgets, while the floor sits $2.2\\times$ to $34.3\\times$ above the in-period floor. Because the deployment period is observed, correction looks like a matter of measurement. It is not. We prove that any corrector measurable with respect to past observations leaves at least the conditional variance of the statistic it tracks, and that trend extrapolation beats trusting the last observation only when $\u03bc^2\u003ev(1-2\u03c1)$. Both premises are measurable and both go the wrong way: the drift is trendless and mean-reverting, with a one-step innovation as large as the drift itself. An oracle removes $60\\%$ of the error, the best observation-based corrector recovers $5.7\\%$ of that, and extrapolation is strictly worse than doing nothing clever.", "arxiv_id": "2607.24662", "arxiv_url": "https://arxiv.org/abs/2607.24662", "authors": ["Tianpeng Li", "Xuan Guo", "Wenjun Wang", "Wang Zhang", "Pengfei Jiao"], "brief": "\u672c\u6587\u7814\u7a76\u65f6\u5e8f\u56fe\u751f\u6210\u6a21\u578b\u4ece\u8bad\u7ec3\u65f6\u6bb5\u90e8\u7f72\u5230\u4e0b\u4e00\u65f6\u6bb5\u65f6\u7684\u5206\u5e03\u6f02\u79fb\u9000\u5316\u95ee\u9898\u3002\u8bba\u6587\u4ece\u635f\u5931\u5206\u89e3\u3001\u7ecf\u9a8c\u89c4\u5f8b\u548c\u53ef\u89c2\u6d4b\u6821\u6b63\u4e0b\u754c\u4e09\u65b9\u9762\u8bc1\u660e\uff1a\u8fd9\u79cd\u9000\u5316\u5177\u6709\u666e\u904d\u6027\uff0c\u4e14\u4ec5\u4f9d\u8d56\u5386\u53f2\u89c2\u6d4b\u5f88\u96be\u4fee\u6b63\u3002", "categories": ["cs.LG", "cs.SI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24662", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06 masked flow-matching \u635f\u5931\u7cbe\u786e\u5206\u89e3\u4e3a\u4e0d\u53ef\u7ea6\u71b5\u9879\u4e0e\u6563\u5ea6\u9879\uff0c\u65e0\u9700\u72ec\u7acb\u6027\u5047\u8bbe\uff0c\u5e76\u6307\u51fa\u8bad\u7ec3\u671f\u7a00\u6709\u3001\u90e8\u7f72\u671f\u5e38\u89c1\u7684\u7ed3\u6784\u4f1a\u5bfc\u81f4\u8bef\u5dee\u663e\u8457\u653e\u5927\u3002", "\u7ecf\u9a8c\u4e0a\u53d1\u73b0\u201c\u9510\u5316\u2014\u6f02\u79fb\u201d\u6743\u8861\u5448\u5e42\u5f8b\u5173\u7cfb\uff0c\u6307\u6570\u4e3a -0.605\uff0c\u4e14\u6f02\u79fb\u4e3b\u8981\u62ac\u9ad8\u91c7\u6837\u8bef\u5dee\u4e0b\u9650\uff0c\u800c\u975e\u6539\u53d8\u8fbe\u5230\u4e0b\u9650\u6240\u9700\u7684\u91c7\u6837\u6b65\u6570\u3002", "\u8bc1\u660e\u4efb\u4f55\u57fa\u4e8e\u8fc7\u53bb\u89c2\u6d4b\u7684\u6821\u6b63\u5668\u81f3\u5c11\u4fdd\u7559\u76ee\u6807\u7edf\u8ba1\u91cf\u7684\u6761\u4ef6\u65b9\u5dee\uff1b\u5b9e\u9a8c\u4e2d oracle \u53ef\u6d88\u9664 60% \u8bef\u5dee\uff0c\u800c\u6700\u4f73\u89c2\u6d4b\u6821\u6b63\u4ec5\u8ffd\u56de\u5176\u4e2d 5.7%\u3002"], "keywords": ["\u65f6\u5e8f\u56fe", "\u751f\u6210\u6a21\u578b", "\u5206\u5e03\u6f02\u79fb", "\u6d41\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24662v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Can You Correct Distribution Drift in Temporal Graph Generation? A Sharpening--Drift Tension and an Impossibility for Observation-Based Correction", "tldr": "\u8bc1\u660e\u65f6\u5e8f\u56fe\u751f\u6210\u6f02\u79fb\u96be\u4ee5\u89c2\u6d4b\u6821\u6b63", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u65f6\u5e8f\u56fe\u751f\u6210\u6a21\u578b\u4ece\u8bad\u7ec3\u65f6\u6bb5\u90e8\u7f72\u5230\u4e0b\u4e00\u65f6\u6bb5\u65f6\u7684\u5206\u5e03\u6f02\u79fb\u9000\u5316\u95ee\u9898\u3002\u8bba\u6587\u4ece\u635f\u5931\u5206\u89e3\u3001\u7ecf\u9a8c\u89c4\u5f8b\u548c\u53ef\u89c2\u6d4b\u6821\u6b63\u4e0b\u754c\u4e09\u65b9\u9762\u8bc1\u660e\uff1a\u8fd9\u79cd\u9000\u5316\u5177\u6709\u666e\u904d\u6027\uff0c\u4e14\u4ec5\u4f9d\u8d56\u5386\u53f2\u89c2\u6d4b\u5f88\u96be\u4fee\u6b63\u3002", "why_notable": "\u8bba\u6587\u7ed9\u51fa\u4e86\u65f6\u5e8f\u56fe\u751f\u6210\u5728\u5206\u5e03\u6f02\u79fb\u4e0b\u5931\u6548\u7684\u7406\u8bba\u89e3\u91ca\u548c\u4e0d\u53ef\u6821\u6b63\u6027\u7ed3\u679c\uff0c\u6311\u6218\u4e86\u201c\u90e8\u7f72\u671f\u53ef\u89c2\u6d4b\u5373\u53ef\u6821\u6b63\u201d\u7684\u76f4\u89c9\uff0c\u5bf9\u52a8\u6001\u7f51\u7edc\u5efa\u6a21\u3001\u56fe\u751f\u6210\u6a21\u578b\u8bc4\u4f30\u548c\u5b9e\u9645\u90e8\u7f72\u5177\u6709\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "We study imbalanced crowdsourcing with a focus on class-dependent annotator accuracy, a setting that, to the best of our knowledge, remains relatively underexplored despite its importance in real-world inspection systems where the labels of greatest operational importance are also the rarest ones. In this setting, annotators may be reliable on both classes, unreliable on both classes, majority-class specialists, or minority-class specialists. Existing models only partially address this problem: they either capture class-dependent errors but ignore item difficulty, or they model item difficulty without capturing class-dependent errors. To fill this gap for imbalanced datasets in crowdsourcing, we introduce a generative aggregation model combining item difficulty with class-dependent annotator competence. The model allows both annotator abilities and item difficulties to vary across classes. We then revisit Condorcet\u0027s Jury Theorem in the class-imbalanced setting. We also show that majority voting asymptotically preserves the underlying class proportion. We evaluate our model on $33$ real-world crowdsourcing datasets, covering multiclass tasks such as images and text, as well as two large-scale regimes: large-scale annotation datasets, with many annotations per item, and large-scale item datasets, with a large number of annotated instances. Across these diverse settings, our model consistently achieves the highest minority recall while remaining competitive in balanced accuracy, making it particularly relevant when rare-label recovery is the primary objective.", "arxiv_id": "2607.24622", "arxiv_url": "https://arxiv.org/abs/2607.24622", "authors": ["Gabriel Singer", "Samuel Gruffaz", "Olivier Vo Van", "Nicolas Vayatis", "Argyris Kalogeratos"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u751f\u6210\u5f0f\u4f17\u5305\u6807\u7b7e\u805a\u5408\u6a21\u578b\uff0c\u540c\u65f6\u5efa\u6a21\u6837\u672c\u96be\u5ea6\u4e0e\u6807\u6ce8\u8005\u5728\u4e0d\u540c\u7c7b\u522b\u4e0a\u7684\u80fd\u529b\u5dee\u5f02\u3002\u8be5\u65b9\u6cd5\u4e13\u6ce8\u4e8e\u7c7b\u522b\u4e0d\u5e73\u8861\u573a\u666f\uff0c\u5c24\u5176\u63d0\u5347\u5c11\u6570\u7c7b\u6807\u7b7e\u7684\u8bc6\u522b\u4e0e\u53ec\u56de\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24622", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6a21\u578b\u5141\u8bb8\u6807\u6ce8\u8005\u80fd\u529b\u548c\u6837\u672c\u96be\u5ea6\u90fd\u968f\u7c7b\u522b\u53d8\u5316\uff0c\u53ef\u523b\u753b\u591a\u6570\u7c7b\u4e13\u5bb6\u3001\u5c11\u6570\u7c7b\u4e13\u5bb6\u53ca\u4e0d\u540c\u53ef\u9760\u6027\u6807\u6ce8\u8005", "\u91cd\u65b0\u5206\u6790\u4e86\u7c7b\u522b\u4e0d\u5e73\u8861\u4e0b\u7684 Condorcet \u966a\u5ba1\u56e2\u5b9a\u7406\uff0c\u5e76\u8bc1\u660e\u591a\u6570\u6295\u7968\u4f1a\u6e10\u8fd1\u4fdd\u6301\u539f\u59cb\u7c7b\u522b\u6bd4\u4f8b", "\u572833\u4e2a\u771f\u5b9e\u4f17\u5305\u6570\u636e\u96c6\u4e0a\u8bc4\u4f30\uff0c\u5c11\u6570\u7c7b\u53ec\u56de\u7387 consistently \u6700\u4f18\uff0c\u540c\u65f6\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5e73\u8861\u51c6\u786e\u7387"], "keywords": ["\u4f17\u5305\u5b66\u4e60", "\u6807\u7b7e\u805a\u5408", "\u7c7b\u522b\u4e0d\u5e73\u8861", "\u7edf\u8ba1\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24622v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Model for Imbalanced Label Aggregation: A Focus on Minority-Class Detection", "tldr": "\u9762\u5411\u7a00\u6709\u7c7b\u68c0\u6d4b\u7684\u4f17\u5305\u6807\u7b7e\u805a\u5408\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u751f\u6210\u5f0f\u4f17\u5305\u6807\u7b7e\u805a\u5408\u6a21\u578b\uff0c\u540c\u65f6\u5efa\u6a21\u6837\u672c\u96be\u5ea6\u4e0e\u6807\u6ce8\u8005\u5728\u4e0d\u540c\u7c7b\u522b\u4e0a\u7684\u80fd\u529b\u5dee\u5f02\u3002\u8be5\u65b9\u6cd5\u4e13\u6ce8\u4e8e\u7c7b\u522b\u4e0d\u5e73\u8861\u573a\u666f\uff0c\u5c24\u5176\u63d0\u5347\u5c11\u6570\u7c7b\u6807\u7b7e\u7684\u8bc6\u522b\u4e0e\u53ec\u56de\u3002", "why_notable": "\u771f\u5b9e\u68c0\u6d4b\u7cfb\u7edf\u4e2d\u6700\u91cd\u8981\u7684\u6807\u7b7e\u5f80\u5f80\u6700\u7a00\u6709\uff0c\u4f20\u7edf\u591a\u6570\u6295\u7968\u6216\u73b0\u6709\u805a\u5408\u6a21\u578b\u5bb9\u6613\u5ffd\u7565\u5c11\u6570\u7c7b\u3002\u8be5\u5de5\u4f5c\u4e3a\u4e0d\u5e73\u8861\u4f17\u5305\u6807\u6ce8\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u9645\u7684\u7edf\u8ba1\u5efa\u6a21\u65b9\u6848\uff0c\u5b9e\u7528\u4ef7\u503c\u8f83\u9ad8\u3002"}, {"abstract": "Reinforcement Learning (RL) agents are increasingly deployed in safety-critical domains such as robotics, autonomous driving, and drone control, where unexpected behaviors may lead to severe real-world consequences. Fuzz testing has recently emerged as a promising method for exploring the vast state spaces of RL agents and exposing crashes. Although numerous RL fuzzing methods have been proposed, existing studies often differ in evaluation settings, baselines, and metrics, making it difficult to draw reliable conclusions about their relative effectiveness and practical usefulness. To address this gap, we present the first comprehensive empirical study that systematically evaluates RL fuzzing methods from four complementary perspectives: effectiveness, diversity, efficiency, and practical utility. We benchmark five state-of-the-art methods alongside random testing under unified configurations across three environments of increasing complexity (MountainCar, BipedalWalker, and CARLA), and further assess the downstream usefulness of detected crashes for agent robustness improvement and safety monitoring. Our results reveal several key insights. For instance,throughput-oriented methods like MDPFuzz demonstrate superior effectiveness and efficiency in crash discovery, while methods explicitly designed to encourage exploration like SeqDivFuzz excel at uncovering diverse crash behaviors. We also show that fuzzing-generated crashes can meaningfully improve agent robustness and enable accurate safety monitoring with strong cross-method generalization. Beyond these empirical findings, we distill actionable guidance for both researchers and practitioners, highlighting the benefits of combining complementary fuzzing strategies and adopting multi-level diversity analysis to achieve more comprehensive and practical RL testing.", "arxiv_id": "2607.24577", "arxiv_url": "https://arxiv.org/abs/2607.24577", "authors": ["Zhibin Kang", "Hanmo You", "Dong Wang", "Haiming Zheng", "Junjie Chen"], "brief": "\u8bba\u6587\u9996\u6b21\u5bf9\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u7684\u6a21\u7cca\u6d4b\u8bd5\u65b9\u6cd5\u505a\u7edf\u4e00\u3001\u7cfb\u7edf\u7684\u5b9e\u8bc1\u8bc4\u4f30\u3002\u5b83\u5728\u591a\u4e2a\u590d\u6742\u5ea6\u9012\u589e\u73af\u5883\u4e2d\u6bd4\u8f835\u79cd\u5148\u8fdb\u65b9\u6cd5\u4e0e\u968f\u673a\u6d4b\u8bd5\uff0c\u5e76\u8003\u5bdf\u53d1\u73b0\u7684\u5d29\u6e83\u6837\u672c\u5bf9\u9c81\u68d2\u6027\u63d0\u5347\u548c\u5b89\u5168\u76d1\u63a7\u7684\u5b9e\u9645\u4ef7\u503c\u3002", "categories": ["cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24577", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u6709\u6548\u6027\u3001\u591a\u6837\u6027\u3001\u6548\u7387\u548c\u5b9e\u7528\u4ef7\u503c\u56db\u4e2a\u7ef4\u5ea6\u7edf\u4e00\u8bc4\u6d4bRL\u6a21\u7cca\u6d4b\u8bd5\u65b9\u6cd5", "\u5728MountainCar\u3001BipedalWalker\u548cCARLA\u73af\u5883\u4e2d\u5bf9\u6bd45\u79cdSOTA\u65b9\u6cd5\u53ca\u968f\u673a\u6d4b\u8bd5", "\u53d1\u73b0MDPFuzz\u7b49\u9ad8\u541e\u5410\u65b9\u6cd5\u66f4\u64c5\u957f\u53d1\u73b0\u5d29\u6e83\uff0cSeqDivFuzz\u7b49\u63a2\u7d22\u5bfc\u5411\u65b9\u6cd5\u66f4\u64c5\u957f\u53d1\u73b0\u591a\u6837\u5316\u5d29\u6e83\u884c\u4e3a"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u8f6f\u4ef6\u6d4b\u8bd5", "\u5b89\u5168\u6027", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24577v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Evaluating Fuzz Testing for Reinforcement Learning Agents", "tldr": "\u7cfb\u7edf\u8bc4\u4f30\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u6a21\u7cca\u6d4b\u8bd5\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u9996\u6b21\u5bf9\u5f3a\u5316\u5b66\u4e60\u667a\u80fd\u4f53\u7684\u6a21\u7cca\u6d4b\u8bd5\u65b9\u6cd5\u505a\u7edf\u4e00\u3001\u7cfb\u7edf\u7684\u5b9e\u8bc1\u8bc4\u4f30\u3002\u5b83\u5728\u591a\u4e2a\u590d\u6742\u5ea6\u9012\u589e\u73af\u5883\u4e2d\u6bd4\u8f835\u79cd\u5148\u8fdb\u65b9\u6cd5\u4e0e\u968f\u673a\u6d4b\u8bd5\uff0c\u5e76\u8003\u5bdf\u53d1\u73b0\u7684\u5d29\u6e83\u6837\u672c\u5bf9\u9c81\u68d2\u6027\u63d0\u5347\u548c\u5b89\u5168\u76d1\u63a7\u7684\u5b9e\u9645\u4ef7\u503c\u3002", "why_notable": "\u8be5\u7814\u7a76\u586b\u8865\u4e86RL\u6a21\u7cca\u6d4b\u8bd5\u65b9\u6cd5\u7f3a\u4e4f\u7edf\u4e00\u8bc4\u4f30\u7684\u7a7a\u767d\uff0c\u5e76\u8868\u660e\u6a21\u7cca\u6d4b\u8bd5\u751f\u6210\u7684\u5d29\u6e83\u6837\u672c\u53ef\u7528\u4e8e\u63d0\u5347\u667a\u80fd\u4f53\u9c81\u68d2\u6027\u548c\u6784\u5efa\u5b89\u5168\u76d1\u63a7\u5668\uff0c\u5bf9\u5b89\u5168\u5173\u952e\u573a\u666f\u4e2d\u7684RL\u90e8\u7f72\u5177\u6709\u5b9e\u9645\u6307\u5bfc\u610f\u4e49\u3002"}, {"abstract": "Split learning enables collaborative model training by partitioning neural networks across clients and servers. However, improper split placement can lead to severe privacy leakage through intermediate representations. In this work, we propose a topology-guided framework for privacy-aware split learning based on the persistent Betti complexity of smashed activations. Through comprehensive layer-wise analysis, we show that privacy risk in split learning is highly non-uniform across layers and exhibits sharp transition regions that are not captured by architectural depth alone. In particular, feature inversion fidelity increases from negligible reconstruction to as high as 0.98 SSIM at deeper, privacy-critical split points. We further demonstrate that Betti complexity consistently identifies representation regimes associated with elevated feature-space privacy leakage across architectures and datasets. Leveraging this observation, we introduce BettiSafe, a topology-guided split selection strategy that identifies privacy-sensitive layers without requiring explicit attack execution. BettiSafe improves resistance to feature inversion by 2 to 5 times compared to depth-based heuristics while preserving classification accuracy. In addition, Betti-based regularisation increases inversion difficulty by nearly 5 x without degrading model utility, enabling a favourable privacy utility tradeoff. Overall, our results highlight topological complexity as a promising structural descriptor for secure, adaptive, and representation-aware split learning in real-world collaborative systems", "arxiv_id": "2607.24556", "arxiv_url": "https://arxiv.org/abs/2607.24556", "authors": ["Akarsh K. Nair", "Muhammad Arifur Rahman", "David Brown", "Mufti Mahmud"], "brief": "\u8bba\u6587\u63d0\u51fa BettiSplit/BettiSafe\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6301\u4e45 Betti \u590d\u6742\u5ea6\u7684\u9690\u79c1\u611f\u77e5\u62c6\u5206\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u8bc6\u522b\u4e2d\u95f4\u6fc0\u6d3b\u4e2d\u5bb9\u6613\u53d1\u751f\u7279\u5f81\u53cd\u6f14\u548c\u68af\u5ea6\u6cc4\u9732\u7684\u654f\u611f\u5c42\u3002\u4f5c\u8005\u901a\u8fc7\u9010\u5c42\u5206\u6790\u53d1\u73b0\uff0c\u62c6\u5206\u70b9\u9690\u79c1\u98ce\u9669\u5e76\u4e0d\u968f\u7f51\u7edc\u6df1\u5ea6\u5e73\u6ed1\u53d8\u5316\uff0c\u800c\u5b58\u5728\u660e\u663e\u7684\u9ad8\u98ce\u9669\u8dc3\u8fc1\u533a\u57df\u3002", "categories": ["cs.LG", "cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24556", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7279\u5f81\u53cd\u6f14\u98ce\u9669\u5728\u4e0d\u540c\u5c42\u95f4\u9ad8\u5ea6\u4e0d\u5747\u5300\uff0c\u6df1\u5c42\u9690\u79c1\u5173\u952e\u62c6\u5206\u70b9\u7684\u91cd\u5efa\u8d28\u91cf\u6700\u9ad8\u53ef\u8fbe 0.98 SSIM\u3002", "\u6301\u4e45 Betti \u590d\u6742\u5ea6\u80fd\u7a33\u5b9a\u523b\u753b\u9ad8\u9690\u79c1\u6cc4\u9732\u98ce\u9669\u7684\u8868\u793a\u533a\u57df\uff0c\u8de8\u67b6\u6784\u548c\u6570\u636e\u96c6\u5747\u6709\u6548\u3002", "BettiSafe \u65e0\u9700\u5b9e\u9645\u6267\u884c\u653b\u51fb\u5373\u53ef\u9009\u62e9\u66f4\u5b89\u5168\u7684\u62c6\u5206\u70b9\uff0c\u76f8\u6bd4\u57fa\u4e8e\u6df1\u5ea6\u7684\u542f\u53d1\u5f0f\u65b9\u6cd5\uff0c\u7279\u5f81\u53cd\u6f14\u62b5\u6297\u80fd\u529b\u63d0\u5347 2 \u5230 5 \u500d\uff0c\u5e76\u4fdd\u6301\u5206\u7c7b\u7cbe\u5ea6\u3002"], "keywords": ["\u9690\u79c1\u4fdd\u62a4", "\u62c6\u5206\u5b66\u4e60", "\u62d3\u6251\u5b66\u4e60", "\u5b89\u5168\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24556v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "BettiSplit: Topology-Guided Privacy-Aware Split Learning Against Feature Inversion and Gradient Leakage", "tldr": "\u7528\u62d3\u6251\u590d\u6742\u5ea6\u6307\u5bfc\u9690\u79c1\u5b89\u5168\u7684\u62c6\u5206\u5b66\u4e60\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa BettiSplit/BettiSafe\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6301\u4e45 Betti \u590d\u6742\u5ea6\u7684\u9690\u79c1\u611f\u77e5\u62c6\u5206\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u8bc6\u522b\u4e2d\u95f4\u6fc0\u6d3b\u4e2d\u5bb9\u6613\u53d1\u751f\u7279\u5f81\u53cd\u6f14\u548c\u68af\u5ea6\u6cc4\u9732\u7684\u654f\u611f\u5c42\u3002\u4f5c\u8005\u901a\u8fc7\u9010\u5c42\u5206\u6790\u53d1\u73b0\uff0c\u62c6\u5206\u70b9\u9690\u79c1\u98ce\u9669\u5e76\u4e0d\u968f\u7f51\u7edc\u6df1\u5ea6\u5e73\u6ed1\u53d8\u5316\uff0c\u800c\u5b58\u5728\u660e\u663e\u7684\u9ad8\u98ce\u9669\u8dc3\u8fc1\u533a\u57df\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u62d3\u6251\u6570\u636e\u5206\u6790\u5f15\u5165\u62c6\u5206\u5b66\u4e60\u9690\u79c1\u9632\u62a4\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u65e0\u9700\u653b\u51fb\u6a21\u62df\u5373\u53ef\u8bc4\u4f30\u548c\u9009\u62e9\u5b89\u5168\u62c6\u5206\u70b9\u7684\u65b9\u6cd5\uff0c\u5bf9\u534f\u540c\u8bad\u7ec3\u3001\u533b\u7597/\u8fb9\u7f18 AI \u7b49\u9690\u79c1\u654f\u611f\u573a\u666f\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Standardized echocardiography conclusions provide meaningful supervision for learning ECG representations of echocardiography-derived cardiac findings. Global ECG--text alignment may entangle modality-specific factors, while long-tailed finding distributions provide sparse positive supervision for low-prevalence conditions. We propose EchoBridge with Complementary Shared--Private Projection (CSPP) and Adaptive Prototype Boundary Calibration (APBC). CSPP maps each modality into shared and auxiliary private projections, reduces directional redundancy via within-modality orthogonality, and bidirectionally aligns normalized shared projections. APBC organizes the shared hypersphere with class-specific prototypes, training-frequency-adaptive angular margins, and spherical Riesz repulsion. We evaluate EchoBridge on EchoNext-Mini and independent PKUPH and SHTMU cohorts under four protocols: prompt-based inference without downstream classifier training, in-domain frozen linear probing, target-domain cross-center frozen linear probing, and source-only cross-center transfer, supplemented by finding-specific analyses. EchoBridge improves classifier-free AUROC, AUPRC, and F1 over the strongest baselines by 7.88, 5.61, and 4.54 points, respectively, and achieves the highest point estimates across all in-domain and target-domain probing budgets and both source-only transfer cohorts. Finding-specific analyses show gains for most conditions, including several low-prevalence valvular findings.", "arxiv_id": "2607.24553", "arxiv_url": "https://arxiv.org/abs/2607.24553", "authors": ["Xiaocheng Fang", "Jieyi Cai", "Guangkun Nie", "Haoyu Wang", "Jiarui Jin", "Yujie Xiao", "Bo Liu", "Chenyang He", "Qinghao Zhao", "Gaofeng Cheng", "Hongyan Li", "Shenda Hong"], "brief": "\u8bba\u6587\u63d0\u51fa EchoBridge\uff0c\u7528\u6807\u51c6\u5316\u8d85\u58f0\u5fc3\u52a8\u56fe\u7ed3\u8bba\u4f5c\u4e3a\u6587\u672c\u76d1\u7763\uff0c\u5b66\u4e60\u80fd\u53cd\u6620\u8d85\u58f0\u6d3e\u751f\u5fc3\u810f\u53d1\u73b0\u7684 ECG \u8868\u5f81\u3002\u65b9\u6cd5\u901a\u8fc7\u5171\u4eab-\u79c1\u6709\u6295\u5f71\u89e3\u8026\u6a21\u6001\u56e0\u7d20\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u539f\u578b\u8fb9\u754c\u6821\u51c6\u7f13\u89e3\u957f\u5c3e\u4f4e\u60a3\u75c5\u7387\u7c7b\u522b\u76d1\u7763\u7a00\u758f\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24553", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["CSPP \u5c06 ECG \u4e0e\u6587\u672c\u5206\u522b\u6620\u5c04\u5230\u5171\u4eab\u6295\u5f71\u548c\u79c1\u6709\u8f85\u52a9\u6295\u5f71\uff0c\u901a\u8fc7\u6a21\u6001\u5185\u6b63\u4ea4\u7ea6\u675f\u51cf\u5c11\u65b9\u5411\u5197\u4f59\uff0c\u5e76\u5728\u5171\u4eab\u7a7a\u95f4\u8fdb\u884c\u53cc\u5411\u5f52\u4e00\u5316\u5bf9\u9f50", "APBC \u5728\u5171\u4eab\u8d85\u7403\u9762\u4e0a\u5f15\u5165\u7c7b\u522b\u539f\u578b\u3001\u968f\u8bad\u7ec3\u9891\u7387\u81ea\u9002\u5e94\u7684\u89d2\u5ea6\u95f4\u9694\uff0c\u4ee5\u53ca\u7403\u9762 Riesz \u6392\u65a5\uff0c\u63d0\u5347\u957f\u5c3e\u7c7b\u522b\u53ef\u5206\u6027", "\u5728 EchoNext-Mini\u3001PKUPH\u3001SHTMU \u591a\u4e2d\u5fc3\u961f\u5217\u548c\u56db\u7c7b\u8bc4\u4f30\u534f\u8bae\u4e0b\uff0c\u5206\u7c7b\u5668\u65e0\u5173\u63a8\u7406\u7684 AUROC\u3001AUPRC\u3001F1 \u5206\u522b\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 7.88\u30015.61\u30014.54 \u4e2a\u70b9"], "keywords": ["\u533b\u7597AI", "\u591a\u6a21\u6001", "\u8868\u5f81\u5b66\u4e60", "\u957f\u5c3e\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24553v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EchoBridge: Long-Tail-Aware ECG-Echocardiography Text Alignment for Echocardiography-Derived Cardiac Findings", "tldr": "\u9762\u5411\u957f\u5c3e\u5fc3\u810f\u53d1\u73b0\u7684ECG-\u8d85\u58f0\u6587\u672c\u5bf9\u9f50", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EchoBridge\uff0c\u7528\u6807\u51c6\u5316\u8d85\u58f0\u5fc3\u52a8\u56fe\u7ed3\u8bba\u4f5c\u4e3a\u6587\u672c\u76d1\u7763\uff0c\u5b66\u4e60\u80fd\u53cd\u6620\u8d85\u58f0\u6d3e\u751f\u5fc3\u810f\u53d1\u73b0\u7684 ECG \u8868\u5f81\u3002\u65b9\u6cd5\u901a\u8fc7\u5171\u4eab-\u79c1\u6709\u6295\u5f71\u89e3\u8026\u6a21\u6001\u56e0\u7d20\uff0c\u5e76\u7528\u81ea\u9002\u5e94\u539f\u578b\u8fb9\u754c\u6821\u51c6\u7f13\u89e3\u957f\u5c3e\u4f4e\u60a3\u75c5\u7387\u7c7b\u522b\u76d1\u7763\u7a00\u758f\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a ECG \u8868\u5f81\u5b66\u4e60\u4e0e\u8d85\u58f0\u5fc3\u52a8\u56fe\u6587\u672c\u7ed3\u8bba\u5bf9\u9f50\uff0c\u5e76\u4e13\u95e8\u5904\u7406\u4e34\u5e8a\u8bca\u65ad\u4e2d\u5e38\u89c1\u7684\u957f\u5c3e\u5fc3\u810f\u53d1\u73b0\u95ee\u9898\uff1b\u5728\u65e0\u4e0b\u6e38\u5206\u7c7b\u5668\u3001\u57df\u5185\u7ebf\u6027\u63a2\u6d4b\u548c\u8de8\u4e2d\u5fc3\u8fc1\u79fb\u4e2d\u5747\u8868\u73b0\u66f4\u5f3a\uff0c\u5177\u5907\u63d0\u5347\u4f4e\u60a3\u75c5\u7387\u74e3\u819c\u7b49\u5fc3\u810f\u5f02\u5e38\u7b5b\u67e5\u80fd\u529b\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "While on-policy distillation (OPD) effectively addresses sparse rewards and exposure bias in large language model post-training, its extension to flow models remains underexplored. To this end, we propose Flow Continuous Trajectory Supervision (FlowCTS), which matches subsequent student and reference trajectories initialized from the same student-visited state. Using the integral relation between trajectories and velocity fields, we derive a temporally weighted velocity-matching upper bound and discretize it into practical objectives parameterized by the number of supervision steps. Under a multi-reference setup, single-state FlowCTS-OPD outperforms vanilla KL-based OPD with faster convergence. FlowCTS-OPD improves GenEval from 0.90 to 0.93, OCR from 0.90 to 0.92, and PickScore from 22.75 to 23.06, while outperforming a mixed-reward RL baseline across all target metrics. Further analysis reveals a clear temporal supervision mismatch in vanilla KL-based OPD arising from its auxiliary SDE transition kernels. Beyond on-policy setting,FlowCTS also consistently outperforms vanilla SFT , particularly on OCR, while increasing supervision steps exhibit a trade-off between richer trajectory information and greater optimization difficulty.", "arxiv_id": "2607.24522", "arxiv_url": "https://arxiv.org/abs/2607.24522", "authors": ["Kaiyang Ye", "Yuan Ge", "Junxiang Zhang", "Bei Li", "Ziming Zhu", "Haishu Zhao", "Xiaoqian Liu", "Chenglong Wang", "Jingbo Zhu", "Zhengtao Yu", "Tong Xiao"], "brief": "\u8bba\u6587\u63d0\u51fa FlowCTS\uff0c\u5c06 on-policy \u84b8\u998f\u6269\u5c55\u5230 flow models\uff1a\u4ece\u5b66\u751f\u6a21\u578b\u8bbf\u95ee\u5230\u7684\u540c\u4e00\u72b6\u6001\u51fa\u53d1\uff0c\u5bf9\u9f50\u5b66\u751f\u4e0e\u53c2\u8003\u6a21\u578b\u540e\u7eed\u8fde\u7eed\u8f68\u8ff9\u3002\u4f5c\u8005\u57fa\u4e8e\u8f68\u8ff9\u4e0e\u901f\u5ea6\u573a\u7684\u79ef\u5206\u5173\u7cfb\uff0c\u63a8\u5bfc\u51fa\u65f6\u95f4\u52a0\u6743\u7684\u901f\u5ea6\u5339\u914d\u4e0a\u754c\uff0c\u5e76\u79bb\u6563\u5316\u4e3a\u53ef\u8bad\u7ec3\u76ee\u6807\u3002", "categories": ["cs.LG", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24522", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["FlowCTS-OPD \u5728\u591a\u53c2\u8003\u8bbe\u7f6e\u4e0b\u4f18\u4e8e\u4f20\u7edf\u57fa\u4e8e KL \u7684 on-policy \u84b8\u998f\uff0c\u6536\u655b\u66f4\u5feb\u3002", "\u5728\u751f\u6210\u8bc4\u6d4b\u4e2d\u5c06 GenEval \u4ece 0.90 \u63d0\u5347\u5230 0.93\uff0cOCR \u4ece 0.90 \u63d0\u5347\u5230 0.92\uff0cPickScore \u4ece 22.75 \u63d0\u5347\u5230 23.06\u3002", "\u5206\u6790\u6307\u51fa vanilla KL-OPD \u4e2d\u8f85\u52a9 SDE \u8f6c\u79fb\u6838\u4f1a\u5bfc\u81f4\u65f6\u95f4\u76d1\u7763\u4e0d\u5339\u914d\uff1b\u589e\u52a0\u76d1\u7763\u6b65\u6570\u5e26\u6765\u66f4\u591a\u8f68\u8ff9\u4fe1\u606f\u4f46\u4e5f\u589e\u52a0\u4f18\u5316\u96be\u5ea6\u3002"], "keywords": ["\u6d41\u6a21\u578b", "\u84b8\u998f", "\u751f\u6210\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24522v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FlowCTS: On-policy Continuous Trajectory Supervision of Flow Models", "tldr": "\u7528\u8fde\u7eed\u8f68\u8ff9\u76d1\u7763\u6539\u8fdb\u6d41\u6a21\u578b\u540e\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FlowCTS\uff0c\u5c06 on-policy \u84b8\u998f\u6269\u5c55\u5230 flow models\uff1a\u4ece\u5b66\u751f\u6a21\u578b\u8bbf\u95ee\u5230\u7684\u540c\u4e00\u72b6\u6001\u51fa\u53d1\uff0c\u5bf9\u9f50\u5b66\u751f\u4e0e\u53c2\u8003\u6a21\u578b\u540e\u7eed\u8fde\u7eed\u8f68\u8ff9\u3002\u4f5c\u8005\u57fa\u4e8e\u8f68\u8ff9\u4e0e\u901f\u5ea6\u573a\u7684\u79ef\u5206\u5173\u7cfb\uff0c\u63a8\u5bfc\u51fa\u65f6\u95f4\u52a0\u6743\u7684\u901f\u5ea6\u5339\u914d\u4e0a\u754c\uff0c\u5e76\u79bb\u6563\u5316\u4e3a\u53ef\u8bad\u7ec3\u76ee\u6807\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u5927\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u6709\u6548\u7684 on-policy \u84b8\u998f\u601d\u60f3\u7cfb\u7edf\u8fc1\u79fb\u5230\u6d41\u6a21\u578b\uff0c\u5e76\u63d0\u51fa\u66f4\u8d34\u5408\u8fde\u7eed\u751f\u6210\u8f68\u8ff9\u7684\u76d1\u7763\u65b9\u5f0f\uff0c\u5bf9\u63d0\u5347\u6587\u751f\u56fe/\u89c6\u89c9\u751f\u6210\u6a21\u578b\u7684\u5bf9\u9f50\u4e0e\u53ef\u63a7\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Pretrained EEG foundation models are increasingly proposed for clinical decoding, but their transfer across populations and robustness to negative controls remain unclear. We benchmark six models (LaBraM, EEGMamba, CBraMod, REVE, BENDR, and BIOT) on five clinical tasks across four datasets using frozen linear probes with leave-one-subject-out, subject-grouped, or explicitly identified recording-level splits. Selected REVE findings are tested against random initialisation, random features, label permutation, scrambled-label fine-tuning, and projection sensitivity. On Korean dementia (CAUEEG, three-way), frozen REVE reaches 0.568 AUROC versus 0.769 for classical features; the ordering persists on a patient-disjoint held-out split (0.565 versus 0.768). Dataset identity is readily decoded from frozen embeddings (AUROC 1.000 at PCA-50; 0.9998 after band restriction and per-epoch z-scoring), whereas the same PCA-50 pipeline decodes Korean diagnosis at 0.528. A randomly initialised encoder also outperforms pretrained REVE on this task (0.659 versus 0.570). On Alzheimer\u0027s disease, Gaussian random projection and PCA of the same pretrained embeddings perform similarly, and classical features nominally exceed REVE at the subject level. The clearest controlled positive is cross-subject ictal detection on CHB-MIT (n=23), where REVE achieves 0.793 AUROC, 9.2 percentage points above a randomly initialised encoder. These results show that EEG foundation-model conclusions depend strongly on evaluation unit, dataset shift, comparator strength, and targeted controls.", "arxiv_id": "2607.24519", "arxiv_url": "https://arxiv.org/abs/2607.24519", "authors": ["Marzieh Zare"], "brief": "\u672c\u6587\u7cfb\u7edf\u538b\u529b\u6d4b\u8bd5\u516d\u4e2a\u9884\u8bad\u7ec3EEG\u57fa\u7840\u6a21\u578b\u5728\u4e94\u4e2a\u4e34\u5e8a\u4efb\u52a1\u3001\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u7684\u51bb\u7ed3\u8868\u5f81\u7ebf\u6027\u63a2\u9488\u8868\u73b0\uff0c\u5e76\u52a0\u5165\u591a\u79cd\u8d1f\u5bf9\u7167\u4e0e\u6295\u5f71\u654f\u611f\u6027\u5206\u6790\u3002\u7ed3\u679c\u663e\u793a\u6a21\u578b\u5e38\u66f4\u5bb9\u6613\u7f16\u7801\u6570\u636e\u96c6\u8eab\u4efd\u800c\u975e\u4e34\u5e8a\u8bca\u65ad\uff0c\u4e14\u5728\u591a\u4e2a\u4efb\u52a1\u4e0a\u4e0d\u5982\u7ecf\u5178\u7279\u5f81\u6216\u968f\u673a\u521d\u59cb\u5316\u57fa\u7ebf\u3002", "categories": ["cs.LG", "cs.AI", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24519", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u6a21\u578b\u5305\u62ecLaBraM\u3001EEGMamba\u3001CBraMod\u3001REVE\u3001BENDR\u548cBIOT\uff0c\u91c7\u7528\u7559\u4e00\u53d7\u8bd5\u8005\u3001\u53d7\u8bd5\u8005\u5206\u7ec4\u6216\u8bb0\u5f55\u7ea7\u663e\u5f0f\u5212\u5206\u8bc4\u4f30\u3002", "\u5728\u97e9\u56fd\u75f4\u5446CAUEEG\u4e09\u5206\u7c7b\u4efb\u52a1\u4e2d\uff0c\u51bb\u7ed3REVE AUROC\u4e3a0.568\uff0c\u660e\u663e\u4f4e\u4e8e\u7ecf\u5178\u7279\u5f810.769\uff1b\u60a3\u8005\u4e0d\u91cd\u53e0\u5212\u5206\u4e0b\u5dee\u8ddd\u4ecd\u4fdd\u6301\u3002", "\u51bb\u7ed3\u5d4c\u5165\u51e0\u4e4e\u53ef\u5b8c\u7f8e\u89e3\u7801\u6570\u636e\u96c6\u8eab\u4efd\uff0cPCA-50\u4e0bAUROC\u8fbe1.000\uff0c\u4f46\u540c\u6d41\u7a0b\u8bca\u65ad\u89e3\u7801\u4ec50.528\uff1b\u968f\u673a\u521d\u59cb\u5316\u7f16\u7801\u5668\u5728\u90e8\u5206\u4efb\u52a1\u4e0a\u751a\u81f3\u8d85\u8fc7\u9884\u8bad\u7ec3REVE\u3002"], "keywords": ["\u8111\u7535\u4fe1\u53f7", "\u57fa\u7840\u6a21\u578b", "\u4e34\u5e8a\u89e3\u7801", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24519v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Stress-Testing EEG Foundation Models for Clinical Decoding: Dataset Identity and Targeted Negative Controls", "tldr": "EEG\u57fa\u7840\u6a21\u578b\u4e34\u5e8a\u8fc1\u79fb\u8868\u73b0\u53d7\u8bc4\u4f30\u8bbe\u7f6e\u5f3a\u70c8\u5f71\u54cd", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u538b\u529b\u6d4b\u8bd5\u516d\u4e2a\u9884\u8bad\u7ec3EEG\u57fa\u7840\u6a21\u578b\u5728\u4e94\u4e2a\u4e34\u5e8a\u4efb\u52a1\u3001\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\u7684\u51bb\u7ed3\u8868\u5f81\u7ebf\u6027\u63a2\u9488\u8868\u73b0\uff0c\u5e76\u52a0\u5165\u591a\u79cd\u8d1f\u5bf9\u7167\u4e0e\u6295\u5f71\u654f\u611f\u6027\u5206\u6790\u3002\u7ed3\u679c\u663e\u793a\u6a21\u578b\u5e38\u66f4\u5bb9\u6613\u7f16\u7801\u6570\u636e\u96c6\u8eab\u4efd\u800c\u975e\u4e34\u5e8a\u8bca\u65ad\uff0c\u4e14\u5728\u591a\u4e2a\u4efb\u52a1\u4e0a\u4e0d\u5982\u7ecf\u5178\u7279\u5f81\u6216\u968f\u673a\u521d\u59cb\u5316\u57fa\u7ebf\u3002", "why_notable": "\u8bba\u6587\u63d0\u9192EEG\u57fa\u7840\u6a21\u578b\u5728\u4e34\u5e8a\u89e3\u7801\u4e2d\u7684\u9ad8\u5206\u7ed3\u8bba\u53ef\u80fd\u53d7\u5230\u6570\u636e\u96c6\u504f\u79fb\u3001\u8bc4\u4f30\u5355\u5143\u3001\u5f31\u6bd4\u8f83\u57fa\u7ebf\u548c\u7f3a\u5931\u8d1f\u5bf9\u7167\u7684\u5f71\u54cd\uff0c\u4e3a\u8be5\u9886\u57df\u5efa\u7acb\u66f4\u4e25\u683c\u3001\u53ef\u4fe1\u7684\u8bc4\u6d4b\u8303\u5f0f\u63d0\u4f9b\u4e86\u8bc1\u636e\u3002"}, {"abstract": "Symmetric non-negative matrix factorization (SymNMF) recovers latent group structure from a dependence matrix, but its dense, quadratic-memory objective has confined prior work to moderate sizes. We present a large-scale GPU study of seven algorithm families (over 30 configurations) on absolute Pearson correlation and tail pairwise dependence matrices from Extreme Value Theory, two proxies for empirical risk-factor estimation on large portfolios. A trace-identity reformulation eliminates all $n \\times n$ intermediates, so a single GPU reaches $n \\approx 10^5$ and multi-node distribution scales to $n = 10^6$ and beyond. Under a two-phase protocol, eleven methods converge at moderate scale; six remain efficient enough at $n = 10^5$ (five AdaGrad-family plus ADMM), and five AdaGrad-family methods still converge at $n = 10^6$: AdaGrad, RMSprop, and three we introduce (Piecewise AdaGrad, Row-Stochastic SVRG, Block-SVRG AdaptGrow). At $n = 10^6$ the fastest solver tracks the matrix spectrum: Block-SVRG AdaptGrow wins on the flat, ill-conditioned tail-dependence spectrum, where its lower per-iteration cost decides a long factorization, and full-batch AdaGrad wins on the dominant-low-rank correlation spectrum, where the run is short. We also benchmark spherical K-means as a hard-label baseline: cheaper when angular cluster structure is present, yet provably degenerate once the matrix collapses toward a single common factor, where the soft factorization remains necessary.", "arxiv_id": "2607.24518", "arxiv_url": "https://arxiv.org/abs/2607.24518", "authors": ["Lavinia Ghita", "Dhruv Desai", "Jake Goldberg", "Roman Yokunda Enzmann"], "brief": "\u672c\u6587\u9488\u5bf9\u5927\u89c4\u6a21\u4f9d\u8d56\u77e9\u9635\u4e0a\u7684\u5bf9\u79f0\u975e\u8d1f\u77e9\u9635\u5206\u89e3\uff08SymNMF\uff09\u8fdb\u884c\u7cfb\u7edfGPU\u52a0\u901f\u7814\u7a76\uff0c\u8986\u76d67\u7c7b\u7b97\u6cd5\u300130\u4f59\u79cd\u914d\u7f6e\u3002\u4f5c\u8005\u901a\u8fc7\u8ff9\u6052\u7b49\u5f0f\u91cd\u5199\u76ee\u6807\u51fd\u6570\uff0c\u907f\u514d\u663e\u5f0f\u6784\u9020$n \\times n$\u4e2d\u95f4\u77e9\u9635\uff0c\u4f7f\u5355GPU\u53ef\u5904\u7406\u7ea6$10^5$\u89c4\u6a21\uff0c\u591a\u8282\u70b9\u53ef\u6269\u5c55\u5230$10^6$\u4ee5\u4e0a\u3002", "categories": ["cs.LG", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24518", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u65e0$n \\times n$\u4e2d\u95f4\u91cf\u7684\u8ff9\u6052\u7b49\u5f0f\u91cd\u6784\uff0c\u663e\u8457\u964d\u4f4eSymNMF\u5728\u5927\u89c4\u6a21\u4f9d\u8d56\u77e9\u9635\u4e0a\u7684\u5185\u5b58\u74f6\u9888\u3002", "\u5728\u7edd\u5bf9Pearson\u76f8\u5173\u77e9\u9635\u548c\u6781\u503c\u7406\u8bba\u5c3e\u90e8\u4f9d\u8d56\u77e9\u9635\u4e0a\u8bc4\u6d4b\uff0c\u9762\u5411\u5927\u89c4\u6a21\u6295\u8d44\u7ec4\u5408\u98ce\u9669\u56e0\u5b50\u4f30\u8ba1\u573a\u666f\u3002", "\u767e\u4e07\u89c4\u6a21\u4e0bAdaGrad\u3001RMSprop\u53ca\u4e09\u79cd\u65b0AdaGrad/SVRG\u53d8\u4f53\u4ecd\u53ef\u6536\u655b\uff1b\u4e0d\u540c\u8c31\u7ed3\u6784\u4e0b\u6700\u4f18\u6c42\u89e3\u5668\u4e0d\u540c\u3002"], "keywords": ["\u77e9\u9635\u5206\u89e3", "\u5927\u89c4\u6a21\u4f18\u5316", "GPU\u8ba1\u7b97", "\u98ce\u9669\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24518v1", "published_at": "2026-07-27", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Low-Rank Dependence Decomposition via Accelerated Symmetric Non-negative Matrix Factorization", "tldr": "\u767e\u4e07\u89c4\u6a21\u4f9d\u8d56\u77e9\u9635\u7684GPU\u7ea7SymNMF\u5206\u89e3", "upvotes": 0, "what_it_is": "\u672c\u6587\u9488\u5bf9\u5927\u89c4\u6a21\u4f9d\u8d56\u77e9\u9635\u4e0a\u7684\u5bf9\u79f0\u975e\u8d1f\u77e9\u9635\u5206\u89e3\uff08SymNMF\uff09\u8fdb\u884c\u7cfb\u7edfGPU\u52a0\u901f\u7814\u7a76\uff0c\u8986\u76d67\u7c7b\u7b97\u6cd5\u300130\u4f59\u79cd\u914d\u7f6e\u3002\u4f5c\u8005\u901a\u8fc7\u8ff9\u6052\u7b49\u5f0f\u91cd\u5199\u76ee\u6807\u51fd\u6570\uff0c\u907f\u514d\u663e\u5f0f\u6784\u9020$n \\times n$\u4e2d\u95f4\u77e9\u9635\uff0c\u4f7f\u5355GPU\u53ef\u5904\u7406\u7ea6$10^5$\u89c4\u6a21\uff0c\u591a\u8282\u70b9\u53ef\u6269\u5c55\u5230$10^6$\u4ee5\u4e0a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u539f\u672c\u53d7\u4e8c\u6b21\u5185\u5b58\u9650\u5236\u7684SymNMF\u63a8\u8fdb\u5230\u767e\u4e07\u8282\u70b9\u7ea7\u522b\uff0c\u5e76\u7ed9\u51fa\u4e0d\u540c\u4f9d\u8d56\u8c31\u7ed3\u6784\u4e0b\u7684\u6c42\u89e3\u5668\u9009\u62e9\u89c4\u5f8b\uff0c\u5bf9\u5927\u89c4\u6a21\u98ce\u9669\u5efa\u6a21\u3001\u805a\u7c7b\u548c\u6f5c\u5728\u56e0\u5b50\u53d1\u73b0\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As the inference phase of Large Language Models (LLMs) requires handling long context windows, the Key-Value (KV) cache initially appears to address this challenge but eventually becomes a significant bottleneck as the context window continues to grow. Low-rank compression has recently been studied as an effective approach to reduce KV cache memory while maintaining model performance. However, only a few existing methods treat the Key and Value caches differently, despite their distinct roles. Moreover, these methods typically employ fixed attention-head grouping, which may not fully exploit the structural similarity among attention heads. In this paper, we propose an improved low-rank KV cache compression framework. For the Key cache, we dynamically group attention heads based on Centered Kernel Alignment (CKA) similarity and allocate the rank budget adaptively under a parameter budget. For the Value cache, we adopt the same approach as ReCalKV, refining the low-rank decomposition through offline calibration to improve reconstruction quality. Experimental results on three instruction-tuned LLMs show that our method reduces the number of Key cache parameters while maintaining competitive accuracy. We further observe that the proposed strategy is particularly effective for Multi-Head Attention (MHA) models, whereas it should be applied more conservatively to Grouped-Query Attention (GQA) models, especially in long-context settings.", "arxiv_id": "2607.24331", "arxiv_url": "https://arxiv.org/abs/2607.24331", "authors": ["Tan T. Nguyen", "Quan V. Dang"], "brief": "\u672c\u6587\u63d0\u51fa DynaCalKV\uff0c\u4e00\u4e2a\u6539\u8fdb\u7684\u4f4e\u79e9 KV \u7f13\u5b58\u538b\u7f29\u6846\u67b6\u3002\u5b83\u9488\u5bf9 Key \u7f13\u5b58\u6309\u6ce8\u610f\u529b\u5934\u76f8\u4f3c\u6027\u52a8\u6001\u5206\u7ec4\u5e76\u81ea\u9002\u5e94\u5206\u914d\u79e9\u9884\u7b97\uff0c\u540c\u65f6\u5bf9 Value \u7f13\u5b58\u6cbf\u7528\u79bb\u7ebf\u6821\u51c6\u5f0f\u4f4e\u79e9\u91cd\u6784\u4ee5\u63d0\u5347\u8d28\u91cf\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24331", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["Key \u7f13\u5b58\u4f7f\u7528 CKA \u76f8\u4f3c\u6027\u8861\u91cf\u6ce8\u610f\u529b\u5934\u7ed3\u6784\u76f8\u4f3c\u5ea6\uff0c\u52a8\u6001\u51b3\u5b9a\u5934\u5206\u7ec4\uff0c\u800c\u975e\u56fa\u5b9a\u5206\u7ec4\u3002", "\u5728\u7ed9\u5b9a\u53c2\u6570\u9884\u7b97\u4e0b\u81ea\u9002\u5e94\u5206\u914d\u4f4e\u79e9\u79e9\u6570\uff0c\u51cf\u5c11 Key cache \u53c2\u6570\u91cf\u5e76\u5c3d\u91cf\u4fdd\u6301\u7cbe\u5ea6\u3002", "\u5b9e\u9a8c\u8986\u76d6\u4e09\u79cd\u6307\u4ee4\u5fae\u8c03 LLM\uff0c\u53d1\u73b0\u8be5\u65b9\u6cd5\u5bf9 MHA \u6a21\u578b\u66f4\u6709\u6548\uff0c\u5bf9 GQA \u6a21\u578b\u5c24\u5176\u957f\u4e0a\u4e0b\u6587\u573a\u666f\u9700\u66f4\u4fdd\u5b88\u4f7f\u7528\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "KV\u7f13\u5b58", "\u6a21\u578b\u538b\u7f29", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24331v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "DynaCalKV: Key-Value Cache Compression via Head Grouping and Adaptive Rank Allocation", "tldr": "\u52a8\u6001\u5206\u7ec4\u4f4e\u79e9\u538b\u7f29LLM\u7684KV\u7f13\u5b58", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa DynaCalKV\uff0c\u4e00\u4e2a\u6539\u8fdb\u7684\u4f4e\u79e9 KV \u7f13\u5b58\u538b\u7f29\u6846\u67b6\u3002\u5b83\u9488\u5bf9 Key \u7f13\u5b58\u6309\u6ce8\u610f\u529b\u5934\u76f8\u4f3c\u6027\u52a8\u6001\u5206\u7ec4\u5e76\u81ea\u9002\u5e94\u5206\u914d\u79e9\u9884\u7b97\uff0c\u540c\u65f6\u5bf9 Value \u7f13\u5b58\u6cbf\u7528\u79bb\u7ebf\u6821\u51c6\u5f0f\u4f4e\u79e9\u91cd\u6784\u4ee5\u63d0\u5347\u8d28\u91cf\u3002", "why_notable": "\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d KV \u7f13\u5b58\u5df2\u6210\u4e3a\u663e\u5b58\u74f6\u9888\uff0c\u8be5\u5de5\u4f5c\u8fdb\u4e00\u6b65\u7ec6\u5316 Key \u4e0e Value \u7684\u5dee\u5f02\u5316\u538b\u7f29\u7b56\u7565\uff0c\u5e76\u901a\u8fc7\u52a8\u6001\u5934\u5206\u7ec4\u63d0\u5347\u4f4e\u79e9\u538b\u7f29\u6548\u7387\uff0c\u5bf9\u964d\u4f4e LLM \u63a8\u7406\u6210\u672c\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Motivated by learning from heterogeneous and overlapping data providers, we study a stylized model of distribution learning from restricted conditional samples. The goal is to learn an unknown distribution $p$ on a finite domain $[n]$. The learner is given a fixed family of queryable sets $\\mathscr{S} \\subseteq 2^{[n]}$, and each query to $S \\in \\mathscr{S}$ returns an independent sample from the conditional distribution $p(\\cdot \\mid S)$. Learnability is governed by the co-occurrence graph associated with $\\mathscr{S}$: two domain elements are adjacent if they appear together in some queryable set. Pointwise consistency is achievable when this graph is connected on the target support. PAC learning requires more: it is possible when the co-occurrence graph is complete. The optimal sample complexity of PAC learning ranges from nearly linear to quadratic. Every query family with complete co-occurrence graph admits sample complexity $\\widetilde O(n^2/\u03b5^2)$, and this bound is tight in the worst case. On the other hand, if $[n]$ is queryable then ordinary sampling improves the bound to $\u0398(n/\u03b5^2)$, and this cannot be improved further even if every set is queryable. More generally, we identify hierarchical comparabilityas a sufficient structural condition on $\\mathscr S$ under which the optimal complexity is nearly linear, $\\widetilde \u0398(n/\u03b5^2)$, with pairwise query families as a canonical example. Finally, the full range of polynomial rates between linear and quadratic is attainable: for every $\u03b1\\in (1,2)$, there exists a query family with optimal PAC rate $\\widetilde \u0398(n^\u03b1/\u03b5^2)$.", "arxiv_id": "2607.24732", "arxiv_url": "https://arxiv.org/abs/2607.24732", "authors": ["Jon Kleinberg", "Amin Saberi", "Xizhi Tan", "Grigoris Velegkas"], "brief": "\u672c\u6587\u7814\u7a76\u4ece\u591a\u4e2a\u5f02\u8d28\u4e14\u91cd\u53e0\u7684\u6570\u636e\u63d0\u4f9b\u65b9\u5b66\u4e60\u672a\u77e5\u6709\u9650\u57df\u5206\u5e03\u7684\u95ee\u9898\uff0c\u5c06\u5176\u62bd\u8c61\u4e3a\u53ea\u80fd\u67e5\u8be2\u82e5\u5e72\u96c6\u5408\u4e0a\u7684\u6761\u4ef6\u91c7\u6837\u3002\u8bba\u6587\u7528\u67e5\u8be2\u96c6\u5408\u8bf1\u5bfc\u7684\u5171\u73b0\u56fe\u523b\u753b\u53ef\u5b66\u6027\uff0c\u5e76\u7ed9\u51fa\u4ece\u8fd1\u7ebf\u6027\u5230\u4e8c\u6b21\u7684\u6700\u4f18 PAC \u6837\u672c\u590d\u6742\u5ea6\u8c31\u7cfb\u3002", "categories": ["cs.DS", "cs.GT", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24732", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u70b9\u6001\u4e00\u81f4\u5b66\u4e60\u8981\u6c42\u76ee\u6807\u652f\u6301\u4e0a\u7684\u5171\u73b0\u56fe\u8fde\u901a\uff0c\u800c PAC \u5b66\u4e60\u8fdb\u4e00\u6b65\u8981\u6c42\u5171\u73b0\u56fe\u5b8c\u5907\u3002", "\u4efb\u610f\u5b8c\u5907\u5171\u73b0\u56fe\u67e5\u8be2\u65cf\u90fd\u53ef\u7528\u7ea6 O(n^2/\u03b5^2) \u6837\u672c\u5b66\u4e60\uff0c\u4e14\u6700\u574f\u60c5\u51b5\u4e0b\u8be5\u754c\u7d27\u3002", "\u82e5\u5168\u96c6\u53ef\u67e5\u8be2\u6216\u6ee1\u8db3\u5c42\u7ea7\u53ef\u6bd4\u6027\u7b49\u7ed3\u6784\u6761\u4ef6\uff0c\u590d\u6742\u5ea6\u53ef\u964d\u81f3\u8fd1\u7ebf\u6027 \u0398(n/\u03b5^2)\uff1b\u5e76\u6784\u9020\u51fa\u4efb\u610f n^\u03b1\u3001\u03b1\u2208(1,2) \u7684\u4e2d\u95f4\u6700\u4f18\u901f\u7387\u3002"], "keywords": ["\u5206\u5e03\u5b66\u4e60", "\u7edf\u8ba1\u5b66\u4e60", "\u6837\u672c\u590d\u6742\u5ea6", "\u56fe\u7ed3\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24732v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Learning Distributions from Multiple Data Providers", "tldr": "\u523b\u753b\u53d7\u9650\u6761\u4ef6\u91c7\u6837\u4e0b\u5206\u5e03\u5b66\u4e60\u7684\u53ef\u5b66\u6027\u4e0e\u590d\u6742\u5ea6", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u4ece\u591a\u4e2a\u5f02\u8d28\u4e14\u91cd\u53e0\u7684\u6570\u636e\u63d0\u4f9b\u65b9\u5b66\u4e60\u672a\u77e5\u6709\u9650\u57df\u5206\u5e03\u7684\u95ee\u9898\uff0c\u5c06\u5176\u62bd\u8c61\u4e3a\u53ea\u80fd\u67e5\u8be2\u82e5\u5e72\u96c6\u5408\u4e0a\u7684\u6761\u4ef6\u91c7\u6837\u3002\u8bba\u6587\u7528\u67e5\u8be2\u96c6\u5408\u8bf1\u5bfc\u7684\u5171\u73b0\u56fe\u523b\u753b\u53ef\u5b66\u6027\uff0c\u5e76\u7ed9\u51fa\u4ece\u8fd1\u7ebf\u6027\u5230\u4e8c\u6b21\u7684\u6700\u4f18 PAC \u6837\u672c\u590d\u6742\u5ea6\u8c31\u7cfb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u591a\u6570\u636e\u63d0\u4f9b\u65b9\u3001\u53d7\u9650\u8bbf\u95ee\u6570\u636e\u573a\u666f\u4e0b\u7684\u5206\u5e03\u5b66\u4e60\u7ed9\u51fa\u6e05\u6670\u7684\u56fe\u7ed3\u6784\u5224\u636e\u548c\u7cbe\u786e\u590d\u6742\u5ea6\u5206\u5c42\uff0c\u63ed\u793a\u4e86\u6570\u636e\u91cd\u53e0\u7ed3\u6784\u5982\u4f55\u51b3\u5b9a\u7edf\u8ba1\u53ef\u5b66\u6027\u4e0e\u6837\u672c\u4ee3\u4ef7\u3002"}, {"abstract": "Multi-modal classification leverages complementary information across diverse data sources to enhance predictive performance. However, real-world scenarios subject to operational constraints, such as sensor failures or privacy restrictions, lead to inconsistent modality availability between training and inference times. To handle missing modalities, prior studies have mainly covered bimodal data setups and focused on designing robust fusion processes. Instead, we adopt a multi-modal co-learning framework that prioritizes inter-modal collaboration rather than multi-modal fusion. Specifically, we consider that any subset of modalities may be absent, without assuming predefined missing-modality patterns, an inference scenario we refer to as missing arbitrary modalities. To address this challenge, we introduce two alternative approaches that leverage information at both feature- and decision-level. Experiments on two multi-modal classification benchmarks demonstrate significant robustness gains in various missing modality conditions. The first method shows more robust behavior under minimal missing conditions, where a single modality is absent, whereas the second performs better under extreme missing conditions, where all-but-one modalities are missing. Our code is available at https://github.com/fmenat/Co4Miss.", "arxiv_id": "2607.24683", "arxiv_url": "https://arxiv.org/abs/2607.24683", "authors": ["Francisco Mena", "Dino Ienco", "Roberto Interdonato", "Cassio F. Dantas", "Simon Besnard"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5206\u7c7b\u7684\u534f\u540c\u5b66\u4e60\u6846\u67b6\uff0c\u5904\u7406\u8bad\u7ec3\u4e0e\u63a8\u7406\u9636\u6bb5\u6a21\u6001\u53ef\u7528\u6027\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002\u5b83\u4e0d\u9884\u8bbe\u7f3a\u5931\u6a21\u5f0f\uff0c\u5141\u8bb8\u63a8\u7406\u65f6\u4efb\u610f\u5b50\u96c6\u6a21\u6001\u7f3a\u5931\uff0c\u5e76\u8bbe\u8ba1\u4e86\u4e24\u79cd\u5229\u7528\u7279\u5f81\u7ea7\u4e0e\u51b3\u7b56\u7ea7\u4fe1\u606f\u7684\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24683", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u201cmissing arbitrary modalities\u201d\u8bbe\u5b9a\uff1a\u63a8\u7406\u65f6\u4efb\u610f\u6a21\u6001\u7ec4\u5408\u90fd\u53ef\u80fd\u7f3a\u5931\uff0c\u800c\u975e\u4ec5\u9650\u53cc\u6a21\u6001\u6216\u56fa\u5b9a\u7f3a\u5931\u6a21\u5f0f", "\u4ece\u6a21\u6001\u95f4\u534f\u4f5c\u800c\u975e\u4f20\u7edf\u591a\u6a21\u6001\u878d\u5408\u51fa\u53d1\uff0c\u5206\u522b\u5728\u7279\u5f81\u7ea7\u548c\u51b3\u7b56\u7ea7\u5229\u7528\u8de8\u6a21\u6001\u4fe1\u606f", "\u5728\u4e24\u4e2a\u591a\u6a21\u6001\u5206\u7c7b\u57fa\u51c6\u4e0a\u9a8c\u8bc1\uff1a\u4e00\u79cd\u65b9\u6cd5\u5728\u5355\u6a21\u6001\u7f3a\u5931\u65f6\u66f4\u7a33\u5065\uff0c\u53e6\u4e00\u79cd\u5728\u53ea\u5269\u4e00\u4e2a\u6a21\u6001\u7684\u6781\u7aef\u7f3a\u5931\u4e0b\u8868\u73b0\u66f4\u597d"], "keywords": ["\u591a\u6a21\u6001", "\u9c81\u68d2\u5b66\u4e60", "\u5206\u7c7b", "\u534f\u540c\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24683v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Co-Learning for Missing Arbitrary Modalities in Multi-modal Classification", "tldr": "\u534f\u540c\u5b66\u4e60\u63d0\u5347\u4efb\u610f\u6a21\u6001\u7f3a\u5931\u4e0b\u5206\u7c7b\u9c81\u68d2\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5206\u7c7b\u7684\u534f\u540c\u5b66\u4e60\u6846\u67b6\uff0c\u5904\u7406\u8bad\u7ec3\u4e0e\u63a8\u7406\u9636\u6bb5\u6a21\u6001\u53ef\u7528\u6027\u4e0d\u4e00\u81f4\u7684\u95ee\u9898\u3002\u5b83\u4e0d\u9884\u8bbe\u7f3a\u5931\u6a21\u5f0f\uff0c\u5141\u8bb8\u63a8\u7406\u65f6\u4efb\u610f\u5b50\u96c6\u6a21\u6001\u7f3a\u5931\uff0c\u5e76\u8bbe\u8ba1\u4e86\u4e24\u79cd\u5229\u7528\u7279\u5f81\u7ea7\u4e0e\u51b3\u7b56\u7ea7\u4fe1\u606f\u7684\u65b9\u6cd5\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u4f20\u611f\u5668\u6545\u969c\u3001\u9690\u79c1\u9650\u5236\u7b49\u771f\u5b9e\u90e8\u7f72\u573a\u666f\uff0c\u63d0\u5347\u591a\u6a21\u6001\u6a21\u578b\u5728\u4e0d\u53ef\u9884\u6d4b\u6a21\u6001\u7f3a\u5931\u4e0b\u7684\u9c81\u68d2\u6027\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We describe Causal-TS, an open-source Python library for causal discovery in high-dimensional and nonstationary multivariate time series. Causal-TS provides four specialized algorithms-CDNOTS, CDNOTS+, CEDAR, and GRACE-along with wrappers for GES, Granger, LASSO-VAR, and LGES, all sharing a unified conditional independence (CI) test layer with GPU acceleration via PyTorch. A regime discovery pipeline detects structural breaks via pluggable changepoint detectors and runs discovery per regime with regime-specific parameters. A command-line interface, synthetic data generators, and optional DoWhy integration provide an end-to-end pipeline from raw time series to causal effect estimates. The library is pip-installable, tested on Python 3.10--3.12, and available at https://github.com/bloomberg/causal-ts.", "arxiv_id": "2607.24673", "arxiv_url": "https://arxiv.org/abs/2607.24673", "authors": ["Mohammad Fesanghary"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u4e86\u5f00\u6e90 Python \u5e93 Causal-TS\uff0c\u7528\u4e8e\u9ad8\u7ef4\u3001\u975e\u5e73\u7a33\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u4e2d\u7684\u56e0\u679c\u53d1\u73b0\u3002\u5b83\u96c6\u6210\u591a\u79cd\u4e13\u7528\u7b97\u6cd5\u3001\u7edf\u4e00\u6761\u4ef6\u72ec\u7acb\u6027\u68c0\u9a8c\u5c42\u3001\u5206\u6bb5\u673a\u5236\uff0c\u5e76\u652f\u6301\u4ece\u539f\u59cb\u65f6\u5e8f\u5230\u56e0\u679c\u6548\u5e94\u4f30\u8ba1\u7684\u7aef\u5230\u7aef\u6d41\u7a0b\u3002", "categories": ["cs.LG", "stat.ME"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24673", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5185\u7f6e CDNOTS\u3001CDNOTS+\u3001CEDAR\u3001GRACE \u56db\u79cd\u7b97\u6cd5\uff0c\u5e76\u5c01\u88c5 GES\u3001Granger\u3001LASSO-VAR\u3001LGES \u7b49\u65b9\u6cd5", "\u63d0\u4f9b\u57fa\u4e8e PyTorch \u7684\u7edf\u4e00\u6761\u4ef6\u72ec\u7acb\u6027\u68c0\u9a8c\u5c42\uff0c\u652f\u6301 GPU \u52a0\u901f", "\u5305\u542b\u7ed3\u6784\u7a81\u53d8\u68c0\u6d4b\u4e0e\u6309 regime \u5206\u522b\u5efa\u6a21\u7684\u6d41\u7a0b\uff0c\u5e76\u63d0\u4f9b\u547d\u4ee4\u884c\u3001\u5408\u6210\u6570\u636e\u751f\u6210\u548c\u53ef\u9009 DoWhy \u96c6\u6210"], "keywords": ["\u56e0\u679c\u53d1\u73b0", "\u65f6\u95f4\u5e8f\u5217", "\u975e\u5e73\u7a33\u5efa\u6a21", "\u5f00\u6e90\u5de5\u5177"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24673v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Causal-TS: A Python Library for Causal Discovery in High-Dimensional and Nonstationary Time Series", "tldr": "\u9762\u5411\u975e\u5e73\u7a33\u9ad8\u7ef4\u65f6\u5e8f\u7684\u56e0\u679c\u53d1\u73b0\u5e93", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd\u4e86\u5f00\u6e90 Python \u5e93 Causal-TS\uff0c\u7528\u4e8e\u9ad8\u7ef4\u3001\u975e\u5e73\u7a33\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u4e2d\u7684\u56e0\u679c\u53d1\u73b0\u3002\u5b83\u96c6\u6210\u591a\u79cd\u4e13\u7528\u7b97\u6cd5\u3001\u7edf\u4e00\u6761\u4ef6\u72ec\u7acb\u6027\u68c0\u9a8c\u5c42\u3001\u5206\u6bb5\u673a\u5236\uff0c\u5e76\u652f\u6301\u4ece\u539f\u59cb\u65f6\u5e8f\u5230\u56e0\u679c\u6548\u5e94\u4f30\u8ba1\u7684\u7aef\u5230\u7aef\u6d41\u7a0b\u3002", "why_notable": "\u8be5\u5e93\u5c06\u975e\u5e73\u7a33\u65f6\u5e8f\u56e0\u679c\u53d1\u73b0\u4e2d\u7684\u591a\u79cd\u7b97\u6cd5\u548c\u5de5\u7a0b\u5de5\u5177\u6574\u5408\u4e3a\u53ef\u5b89\u88c5\u3001\u53ef\u590d\u73b0\u7684\u5f00\u6e90\u6846\u67b6\uff0c\u964d\u4f4e\u4e86\u9ad8\u7ef4\u65f6\u95f4\u5e8f\u5217\u56e0\u679c\u5206\u6790\u5728\u91d1\u878d\u3001\u533b\u7597\u3001\u8fd0\u7ef4\u7b49\u573a\u666f\u4e2d\u7684\u4f7f\u7528\u95e8\u69db\u3002"}, {"abstract": "In safety-critical sectors such as robotics and automotive engineering, the deployment of Deep Reinforcement Learning (DRL) is often hindered by the black-box nature of deep neural networks. This lack of transparency poses significant challenges for regulatory compliance and human-agent trust. This paper presents an experimental study aimed at making high-performance continuous control DRL systems interpretable. A policy distillation framework is implemented using the classic Inverted Pendulum benchmark. A high-performance Twin Delayed DDPG (TD3) agent serves as an opaque, continuous teacher model, whose policy is distilled into an interpretable student surrogate based on a shallow Decision Tree. By leveraging a custom physics-aware feature and \"Noisy Oracle Rollouts\" for dataset generation, the distillation process achieves performance equivalent to the expert teacher. Furthermore, comparative control theory analysis reveals a fundamental trade-off: transitioning from continuous to discrete rule-based control induces high-frequency Bang-Bang actuation and a stable bimodal limit cycle. Simulation results indicate that Bounded-Input Bounded-Output (BIBO) stability is maintained while providing both global and local interpretability for safe autonomous systems.", "arxiv_id": "2607.24672", "arxiv_url": "https://arxiv.org/abs/2607.24672", "authors": ["Shaker Al-Tamari", "Waled Kadour"], "brief": "\u672c\u6587\u7814\u7a76\u5c06\u9ad8\u6027\u80fd\u8fde\u7eed\u63a7\u5236 DRL \u7b56\u7565\u84b8\u998f\u4e3a\u6d45\u5c42\u51b3\u7b56\u6811\uff0c\u4ee5\u63d0\u5347\u5b89\u5168\u5173\u952e\u63a7\u5236\u7cfb\u7edf\u7684\u53ef\u89e3\u91ca\u6027\u3002\u4f5c\u8005\u5728\u5012\u7acb\u6446\u57fa\u51c6\u4e0a\u7528 TD3 \u4f5c\u4e3a\u6559\u5e08\uff0c\u901a\u8fc7\u7269\u7406\u611f\u77e5\u7279\u5f81\u548c Noisy Oracle Rollouts \u751f\u6210\u6570\u636e\uff0c\u4f7f\u5b66\u751f\u7b56\u7565\u8fbe\u5230\u8fd1\u4f3c\u4e13\u5bb6\u6027\u80fd\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24672", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 TD3 \u8fde\u7eed\u63a7\u5236\u7b56\u7565\u4f5c\u4e3a\u9ed1\u76d2\u6559\u5e08\uff0c\u84b8\u998f\u5230\u6d45\u5c42\u51b3\u7b56\u6811\u5b66\u751f\u6a21\u578b\uff0c\u5b9e\u73b0\u5168\u5c40\u4e0e\u5c40\u90e8\u53ef\u89e3\u91ca\u6027", "\u5f15\u5165\u7269\u7406\u611f\u77e5\u7279\u5f81\u548c Noisy Oracle Rollouts\uff0c\u63d0\u9ad8\u84b8\u998f\u6570\u636e\u8d28\u91cf\u5e76\u4fdd\u6301\u4e13\u5bb6\u7ea7\u63a7\u5236\u6027\u80fd", "\u63a7\u5236\u7406\u8bba\u5206\u6790\u663e\u793a\u79bb\u6563\u89c4\u5219\u63a7\u5236\u4f1a\u4ea7\u751f\u9ad8\u9891 Bang-Bang \u52a8\u4f5c\u548c\u7a33\u5b9a\u53cc\u5cf0\u6781\u9650\u73af\uff0c\u4f46\u4ecd\u4fdd\u6301 BIBO \u7a33\u5b9a"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027", "\u7b56\u7565\u84b8\u998f", "\u63a7\u5236\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24672v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Explainable Reinforcement Learning via Physics-Aware Policy Distillation", "tldr": "\u7528\u7269\u7406\u7279\u5f81\u84b8\u998f\u53ef\u89e3\u91ca\u5f3a\u5316\u5b66\u4e60\u63a7\u5236\u7b56\u7565", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5c06\u9ad8\u6027\u80fd\u8fde\u7eed\u63a7\u5236 DRL \u7b56\u7565\u84b8\u998f\u4e3a\u6d45\u5c42\u51b3\u7b56\u6811\uff0c\u4ee5\u63d0\u5347\u5b89\u5168\u5173\u952e\u63a7\u5236\u7cfb\u7edf\u7684\u53ef\u89e3\u91ca\u6027\u3002\u4f5c\u8005\u5728\u5012\u7acb\u6446\u57fa\u51c6\u4e0a\u7528 TD3 \u4f5c\u4e3a\u6559\u5e08\uff0c\u901a\u8fc7\u7269\u7406\u611f\u77e5\u7279\u5f81\u548c Noisy Oracle Rollouts \u751f\u6210\u6570\u636e\uff0c\u4f7f\u5b66\u751f\u7b56\u7565\u8fbe\u5230\u8fd1\u4f3c\u4e13\u5bb6\u6027\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u673a\u5668\u4eba\u3001\u6c7d\u8f66\u7b49\u5b89\u5168\u5173\u952e\u573a\u666f\uff0c\u5c55\u793a\u4e86\u5982\u4f55\u5728\u4fdd\u6301\u5f3a\u5316\u5b66\u4e60\u63a7\u5236\u6027\u80fd\u7684\u540c\u65f6\u83b7\u5f97\u53ef\u5ba1\u8ba1\u3001\u53ef\u89e3\u91ca\u7684\u89c4\u5219\u7b56\u7565\uff0c\u5e76\u63ed\u793a\u4e86\u8fde\u7eed\u5230\u79bb\u6563\u63a7\u5236\u8f6c\u6362\u4e2d\u7684\u7a33\u5b9a\u6027\u6743\u8861\u3002"}, {"abstract": "This work investigates uncertainty decomposition and explainability in a deep learning-based framework for gyroscope bias correction. A 1-D Convolutional Neural Network is trained to predict residual angular rate corrections from multi-sensor inputs, including gyroscope and star tracker measurements. The bias corrections are sent to a flight-representative Gyro-Stellar Estimator. The network produces both mean corrections and input-dependent (heteroscedastic) aleatoric uncertainty, while epistemic uncertainty is estimated via an ensemble of independently trained models. The proposed approach is trained under nominal conditions and evaluated in both nominal and structured perturbations that include additive and temporally correlated noise. Gradient-based attribution methods are applied to both the correction and uncertainty outputs, enabling a decomposition of the evidence that drives state updates and uncertainty estimates. By aggregating attribution patterns across rotational axes and regimes, we reveal axis-specific behaviors and characterize how structured perturbations influence the collaboration between aleatoric and epistemic uncertainty. Uncertainty analysis shows that aleatoric uncertainty increases with perturbation intensity, but the distributions overlap and the calibration is not consistent across regimes. On the other hand, epistemic uncertainty gives a clear signal that gets clearer as the distributional shift happens, showing that the models disagree more. These results show that aleatoric and epistemic uncertainty work well together and that epistemic uncertainty is better at distinguishing between nominal and perturbed operating conditions. The results provide insight into the behavior of hybrid learning-based state estimation components and motivate the use of uncertainty for downstream monitoring and fault detection.", "arxiv_id": "2607.24608", "arxiv_url": "https://arxiv.org/abs/2607.24608", "authors": ["Mariela De Lucas \u00c1lvarez", "Melvin Laux", "Arthur de Freitas Precht", "Maurice Martin", "Edoardo Caroselli", "Frank Kirchner", "Alexander Fabisch"], "brief": "\u672c\u6587\u7814\u7a76\u7528\u4e8e\u9640\u87ba\u4eea\u504f\u7f6e\u6821\u6b63\u7684\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u4f7f\u75281D CNN\u4ece\u9640\u87ba\u4eea\u4e0e\u661f\u654f\u611f\u5668\u7b49\u591a\u4f20\u611f\u5668\u8f93\u5165\u9884\u6d4b\u6b8b\u5dee\u89d2\u901f\u5ea6\u6821\u6b63\uff0c\u5e76\u63a5\u5165\u7c7b\u98de\u884c\u73af\u5883\u7684\u9640\u87ba-\u661f\u654f\u4f30\u8ba1\u5668\u3002\u6a21\u578b\u540c\u65f6\u8f93\u51fa\u6821\u6b63\u5747\u503c\u4e0e\u5f02\u65b9\u5dee\u5076\u7136\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u7528\u6a21\u578b\u96c6\u6210\u4f30\u8ba1\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24608", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u68af\u5ea6\u5f52\u56e0\u65b9\u6cd5\u5e94\u7528\u4e8e\u6821\u6b63\u8f93\u51fa\u548c\u4e0d\u786e\u5b9a\u6027\u8f93\u51fa\uff0c\u5206\u6790\u54ea\u4e9b\u8f93\u5165\u8bc1\u636e\u9a71\u52a8\u72b6\u6001\u66f4\u65b0\u4e0e\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1\u3002", "\u5728\u6807\u79f0\u6761\u4ef6\u4e0b\u8bad\u7ec3\uff0c\u5e76\u5728\u52a0\u6027\u566a\u58f0\u3001\u65f6\u95f4\u76f8\u5173\u566a\u58f0\u7b49\u7ed3\u6784\u5316\u6270\u52a8\u4e0b\u8bc4\u4f30\uff0c\u63ed\u793a\u4e0d\u540c\u65cb\u8f6c\u8f74\u4e0e\u5de5\u51b5\u4e0b\u7684\u884c\u4e3a\u5dee\u5f02\u3002", "\u5076\u7136\u4e0d\u786e\u5b9a\u6027\u968f\u6270\u52a8\u5f3a\u5ea6\u589e\u52a0\u4f46\u5206\u5e03\u91cd\u53e0\u3001\u6821\u51c6\u4e0d\u7a33\u5b9a\uff1b\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\u5bf9\u5206\u5e03\u504f\u79fb\u66f4\u654f\u611f\uff0c\u80fd\u66f4\u6e05\u6670\u5730\u533a\u5206\u6807\u79f0\u4e0e\u6270\u52a8\u72b6\u6001\u3002"], "keywords": ["\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u53ef\u89e3\u91ca\u6027", "\u72b6\u6001\u4f30\u8ba1", "\u4f20\u611f\u5668\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24608v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Attribution and Uncertainty Behavior of Learned Residual Gyro Correction for Gyro-Stellar Estimation", "tldr": "\u89e3\u6790\u9640\u87ba\u6b8b\u5dee\u6821\u6b63\u4e2d\u7684\u5f52\u56e0\u4e0e\u4e0d\u786e\u5b9a\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u7528\u4e8e\u9640\u87ba\u4eea\u504f\u7f6e\u6821\u6b63\u7684\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u4f7f\u75281D CNN\u4ece\u9640\u87ba\u4eea\u4e0e\u661f\u654f\u611f\u5668\u7b49\u591a\u4f20\u611f\u5668\u8f93\u5165\u9884\u6d4b\u6b8b\u5dee\u89d2\u901f\u5ea6\u6821\u6b63\uff0c\u5e76\u63a5\u5165\u7c7b\u98de\u884c\u73af\u5883\u7684\u9640\u87ba-\u661f\u654f\u4f30\u8ba1\u5668\u3002\u6a21\u578b\u540c\u65f6\u8f93\u51fa\u6821\u6b63\u5747\u503c\u4e0e\u5f02\u65b9\u5dee\u5076\u7136\u4e0d\u786e\u5b9a\u6027\uff0c\u5e76\u7528\u6a21\u578b\u96c6\u6210\u4f30\u8ba1\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u822a\u5929\u59ff\u6001\u4f30\u8ba1\u4e2d\u7684\u5b66\u4e60\u589e\u5f3a\u72b6\u6001\u4f30\u8ba1\u7ec4\u4ef6\uff0c\u7cfb\u7edf\u5206\u6790\u4e86\u53ef\u89e3\u91ca\u6027\u4e0e\u4e0d\u786e\u5b9a\u6027\u5206\u89e3\u7684\u5b9e\u9645\u884c\u4e3a\uff0c\u8868\u660e\u8ba4\u77e5\u4e0d\u786e\u5b9a\u6027\u53ef\u4f5c\u4e3a\u8fd0\u884c\u76d1\u6d4b\u548c\u6545\u969c\u68c0\u6d4b\u7684\u91cd\u8981\u4fe1\u53f7\u3002"}, {"abstract": "Large scale Bayesian nonparametrics (BNP) learner such as Stochastic Variational Inference (SVI) can handle datasets with large class number and large training size at fractional cost. Like its predecessor, SVI rely on the assumption of conjugate variational posterior to approximate the true posterior. A more challenging problem is to consider large scale learning on non-conjugate posterior. Recent works in this direction are mostly associated with using Monte Carlo methods for approximating the learner. However, these works are usually demonstrated on non-BNP related task and less complex models such as logistic regression, due to higher computational complexity. In order to overcome the issue faced by SVI, we develop a novel approach based on the recently proposed constant stepsize stochastic gradient ascent to allow large scale learning on non-conjugate posterior. Unlike SVI, our new learner does not require closed- form expression for the variational posterior expectatations. Our only requirement is that the variational posterior is differentiable. In order to ensure convergence in stochastic settings, SVI rely on decaying step-sizes to slow its learning. Inspired by SVI and Adam, we propose the novel use of adaptive stepsizes in our method to significantly improve its learning. We show that our proposed methods is compatible with ResNet features when applied to large class number datasets such as MIT67 and SUN397. Finally, we compare our proposed learner with several recent works such as deep clustering algorithms and showed we were able to produce on-par or outperform the state-of-the-art methods in terms of clustering measures.", "arxiv_id": "2607.24583", "arxiv_url": "https://arxiv.org/abs/2607.24583", "authors": ["Kart-Leong Lim"], "brief": "\u8bba\u6587\u63d0\u51fa PYPM-GGD\uff0c\u4e00\u79cd\u7ed3\u5408 Pitman-Yor \u8fc7\u7a0b\u6df7\u5408\u6a21\u578b\u4e0e\u5e7f\u4e49\u9ad8\u65af\u5bc6\u5ea6\u7684\u5927\u89c4\u6a21\u8d1d\u53f6\u65af\u975e\u53c2\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u7528\u5e38\u6b65\u957f\u968f\u673a\u68af\u5ea6\u4e0a\u5347\u4e0e Adam \u5f0f\u81ea\u9002\u5e94\u6b65\u957f\u5904\u7406\u975e\u5171\u8f6d\u53d8\u5206\u540e\u9a8c\uff0c\u65e0\u9700\u95ed\u5f0f\u671f\u671b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggi
