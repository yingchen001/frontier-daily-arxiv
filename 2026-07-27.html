erage Indic tokenizer tax by 73%, demonstrating that the disparity is largely remediable. Beyond token statistics, we quantify a practical consequence by showing that, under fixed context budgets, Indian-language documents preserve substantially less original content than equivalent English documents. Finally, we examine the relationship between tokenizer fertility and reading comprehension performance on the Belebele benchmark, finding that the apparent correlation is largely explained by language resource availability rather than tokenizer behavior alone.", "arxiv_id": "2607.24276", "arxiv_url": "https://arxiv.org/abs/2607.24276", "authors": ["Priyansh Srivastava"], "brief": "\u672c\u6587\u91cf\u5316\u4e86\u5370\u5ea6\u8bed\u8a00\u5728\u4e3b\u6d41\u5927\u6a21\u578b\u5b50\u8bcd\u5206\u8bcd\u5668\u4e2d\u7684\u201c\u5206\u8bcd\u7a0e\u201d\uff1a\u5728 GPT-3.5/4 \u4f7f\u7528\u7684 cl100k_base \u4e0b\uff0c\u5370\u5ea6\u8bed\u8a00\u76f8\u5bf9\u82f1\u8bed\u5e73\u5747\u9700\u8981 8 \u500d token\uff0c\u9a6c\u62c9\u96c5\u62c9\u59c6\u8bed\u6700\u9ad8\u8fbe 13 \u500d\uff0c\u663e\u8457\u538b\u7f29\u7b49\u6548\u4e0a\u4e0b\u6587\u7a97\u53e3\u3002\u7814\u7a76\u53d1\u73b0\u4e3b\u8981\u539f\u56e0\u662f BPE \u5408\u5e76\u5931\u8d25\u5bfc\u81f4\u6587\u672c\u788e\u7247\u5316\u4e3a\u5355\u5b57\u8282 token\uff0c\u800c\u591a\u8bed\u8a00\u5206\u8bcd\u5668\u53ef\u5927\u5e45\u7f13\u89e3\u8be5\u95ee\u9898\uff0c\u8bf4\u660e\u5dee\u8ddd\u4e3b\u8981\u6765\u81ea\u5206\u8bcd\u5668\u8bbe\u8ba1\u800c\u975e\u6587\u5b57\u672c\u8eab\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24276", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5206\u8bcd\u5668", "\u591a\u8bed\u8a00", "\u81ea\u7136\u8bed\u8a00\u5904\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24276v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Tokenizer Tax: Quantifying and Explaining the Cross-Lingual Cost of Subword Tokenization for Indian Languages", "tldr": "\u672c\u6587\u91cf\u5316\u4e86\u5370\u5ea6\u8bed\u8a00\u5728\u4e3b\u6d41\u5927\u6a21\u578b\u5b50\u8bcd\u5206\u8bcd\u5668\u4e2d\u7684\u201c\u5206\u8bcd\u7a0e\u201d\uff1a\u5728 GPT-3.5/4 \u4f7f\u7528\u7684 cl100k_base \u4e0b\uff0c\u5370\u5ea6\u8bed\u8a00\u76f8\u5bf9\u82f1\u8bed\u5e73\u5747\u9700\u8981 8 \u500d token\uff0c\u9a6c\u62c9\u96c5\u62c9\u59c6\u8bed\u6700\u9ad8\u8fbe 13 \u500d\uff0c\u663e\u8457\u538b\u7f29\u7b49\u6548\u4e0a\u4e0b\u6587\u7a97\u53e3\u3002\u7814\u7a76\u53d1\u73b0\u4e3b\u8981\u539f\u56e0\u662f BPE \u5408\u5e76\u5931\u8d25\u5bfc\u81f4\u6587\u672c\u788e\u7247\u5316\u4e3a\u5355\u5b57\u8282 token\uff0c\u800c\u591a\u8bed\u8a00\u5206\u8bcd\u5668\u53ef\u5927\u5e45\u7f13\u89e3\u8be5\u95ee\u9898\uff0c\u8bf4\u660e\u5dee\u8ddd\u4e3b\u8981\u6765\u81ea\u5206\u8bcd\u5668\u8bbe\u8ba1\u800c\u975e\u6587\u5b57\u672c\u8eab\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Inverse design of three-dimensional porous media is central to applications in filtration, catalysis, energy storage, fuel cells, thermal management, and biomedical scaffolds, but remains challenging because many distinct pore geometries can share similar porosity or permeability while small structural changes can strongly affect transport behaviour. This paper proposes a physics-guided generative AI framework for property-targeted porous media design, combining a property-aware variational autoencoder, a conditional latent diffusion model, and an independently trained differentiable structure-to-property surrogate. The framework learns a compact, physically informative latent design space, generates porous structures conditioned on target porosity and directional permeability, and refines generated samples using property-level feedback during denoising and decoding. Experiments on procedurally generated structures and real micro-CT porous-media datasets show improved target-property matching, directional permeability control, and property correlation compared with representative property-aware variational-autoencoder and latent-diffusion baselines. The results demonstrate a scalable route towards controllable inverse design of complex porous geometries and establish a foundation for simulation-informed generative AI tools in engineering and advanced materials discovery.", "arxiv_id": "2607.24274", "arxiv_url": "https://arxiv.org/abs/2607.24274", "authors": ["Peng Wang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7269\u7406\u5f15\u5bfc\u7684\u751f\u6210\u5f0fAI\u6846\u67b6\uff0c\u7528\u4e8e\u6309\u76ee\u6807\u5b54\u9699\u7387\u548c\u65b9\u5411\u6e17\u900f\u7387\u53cd\u5411\u8bbe\u8ba1\u4e09\u7ef4\u591a\u5b54\u4ecb\u8d28\u3002\u65b9\u6cd5\u7ed3\u5408\u5c5e\u6027\u611f\u77e5VAE\u3001\u6761\u4ef6\u6f5c\u7a7a\u95f4\u6269\u6563\u6a21\u578b\u548c\u53ef\u5fae\u7ed3\u6784-\u5c5e\u6027\u4ee3\u7406\u6a21\u578b\uff0c\u5728\u751f\u6210\u4e0e\u53bb\u566a\u8fc7\u7a0b\u4e2d\u5f15\u5165\u5c5e\u6027\u53cd\u9988\uff1b\u5728\u5408\u6210\u4e0e\u771f\u5b9emicro-CT\u6570\u636e\u4e0a\u8f83\u57fa\u7ebf\u5b9e\u73b0\u66f4\u597d\u7684\u76ee\u6807\u5c5e\u6027\u5339\u914d\u548c\u65b9\u5411\u6e17\u900f\u7387\u63a7\u5236\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24274", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u751f\u6210\u6a21\u578b", "\u6750\u6599\u8bbe\u8ba1", "\u7269\u7406\u5f15\u5bfc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24274v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Physics-Guided Generative AI for Property-Targeted 3D Porous Media Design", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7269\u7406\u5f15\u5bfc\u7684\u751f\u6210\u5f0fAI\u6846\u67b6\uff0c\u7528\u4e8e\u6309\u76ee\u6807\u5b54\u9699\u7387\u548c\u65b9\u5411\u6e17\u900f\u7387\u53cd\u5411\u8bbe\u8ba1\u4e09\u7ef4\u591a\u5b54\u4ecb\u8d28\u3002\u65b9\u6cd5\u7ed3\u5408\u5c5e\u6027\u611f\u77e5VAE\u3001\u6761\u4ef6\u6f5c\u7a7a\u95f4\u6269\u6563\u6a21\u578b\u548c\u53ef\u5fae\u7ed3\u6784-\u5c5e\u6027\u4ee3\u7406\u6a21\u578b\uff0c\u5728\u751f\u6210\u4e0e\u53bb\u566a\u8fc7\u7a0b\u4e2d\u5f15\u5165\u5c5e\u6027\u53cd\u9988\uff1b\u5728\u5408\u6210\u4e0e\u771f\u5b9emicro-CT\u6570\u636e\u4e0a\u8f83\u57fa\u7ebf\u5b9e\u73b0\u66f4\u597d\u7684\u76ee\u6807\u5c5e\u6027\u5339\u914d\u548c\u65b9\u5411\u6e17\u900f\u7387\u63a7\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The vast chemical design space and complex, interdependent design variables make catalyst discovery for targeted properties highly labor- and resource-intensive. Although generative models have emerged as a promising solution, existing approaches are generally limited to single-property conditioning or narrow chemical spaces. Here, we present Catalyst Diffusion Transformer (CatDiT), a unified framework for inverse catalyst design that generates valid and novel structures ranging from intermetallic alloys to oxide surfaces. By learning compressed latent representations, CatDiT enables efficient training and rapid sampling while supporting simultaneous conditioning on adsorbate type, binding energy, and catalyst class. The model provides reliable control of discrete properties and directional control of continuous properties, enriching candidate pools for reaction-specific catalyst discovery. As a representative application, multi-conditional generation for the nitrogen reduction reaction (NRR) yields 28 density functional theory (DFT)-relaxed alloy candidates that satisfy the target activity window and lie above the pure-metal *N-*H scaling line, corresponding to a ~1.5-fold enrichment over the source distribution. These results establish CatDiT as a practical and scalable approach for property-directed catalyst inverse design and targeted catalyst generation.", "arxiv_id": "2607.24272", "arxiv_url": "https://arxiv.org/abs/2607.24272", "authors": ["Hayoung Doo", "Dong Hyeon Mok", "Seoin Back", "Jonggeol Na"], "brief": "\u672c\u6587\u63d0\u51fa Catalyst Diffusion Transformer\uff08CatDiT\uff09\uff0c\u7528\u4e8e\u5f02\u76f8\u50ac\u5316\u5242\u7684\u751f\u6210\u5f0f\u9006\u5411\u8bbe\u8ba1\uff0c\u53ef\u5728\u5408\u91d1\u4e0e\u6c27\u5316\u7269\u8868\u9762\u7b49\u8f83\u5bbd\u5316\u5b66\u7a7a\u95f4\u4e2d\u751f\u6210\u6709\u6548\u4e14\u65b0\u9896\u7684\u7ed3\u6784\u3002\u6a21\u578b\u901a\u8fc7\u6f5c\u8868\u793a\u63d0\u5347\u8bad\u7ec3\u4e0e\u91c7\u6837\u6548\u7387\uff0c\u5e76\u652f\u6301\u5438\u9644\u7269\u7c7b\u578b\u3001\u7ed3\u5408\u80fd\u548c\u50ac\u5316\u5242\u7c7b\u522b\u7684\u591a\u6761\u4ef6\u63a7\u5236\uff1b\u5728\u6c2e\u8fd8\u539f\u53cd\u5e94\u4efb\u52a1\u4e2d\u7b5b\u9009\u51fa 28 \u4e2a\u6ee1\u8db3\u76ee\u6807\u6d3b\u6027\u7a97\u53e3\u7684 DFT \u5f1b\u8c6b\u5408\u91d1\u5019\u9009\uff0c\u5019\u9009\u5bcc\u96c6\u7ea6\u63d0\u5347 1.5 \u500d\u3002", "categories": ["cond-mat.mtrl-sci", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24272", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u9006\u5411\u8bbe\u8ba1", "\u50ac\u5316\u5242", "\u6750\u6599\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24272v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Catalyst Diffusion Transformer: Generative Inverse Design of Heterogeneous Catalysts", "tldr": "\u672c\u6587\u63d0\u51fa Catalyst Diffusion Transformer\uff08CatDiT\uff09\uff0c\u7528\u4e8e\u5f02\u76f8\u50ac\u5316\u5242\u7684\u751f\u6210\u5f0f\u9006\u5411\u8bbe\u8ba1\uff0c\u53ef\u5728\u5408\u91d1\u4e0e\u6c27\u5316\u7269\u8868\u9762\u7b49\u8f83\u5bbd\u5316\u5b66\u7a7a\u95f4\u4e2d\u751f\u6210\u6709\u6548\u4e14\u65b0\u9896\u7684\u7ed3\u6784\u3002\u6a21\u578b\u901a\u8fc7\u6f5c\u8868\u793a\u63d0\u5347\u8bad\u7ec3\u4e0e\u91c7\u6837\u6548\u7387\uff0c\u5e76\u652f\u6301\u5438\u9644\u7269\u7c7b\u578b\u3001\u7ed3\u5408\u80fd\u548c\u50ac\u5316\u5242\u7c7b\u522b\u7684\u591a\u6761\u4ef6\u63a7\u5236\uff1b\u5728\u6c2e\u8fd8\u539f\u53cd\u5e94\u4efb\u52a1\u4e2d\u7b5b\u9009\u51fa 28 \u4e2a\u6ee1\u8db3\u76ee\u6807\u6d3b\u6027\u7a97\u53e3\u7684 DFT \u5f1b\u8c6b\u5408\u91d1\u5019\u9009\uff0c\u5019\u9009\u5bcc\u96c6\u7ea6\u63d0\u5347 1.5 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As communication networks adopt virtualized and disaggregated architectures, achieving energy efficiency has become increasingly important for both economic and environmental reasons. Traditional methods for power modeling are inadequate in these dynamic software-defined environments due to their inability to model complex and nonlinear factors affecting energy use. We investigate the use of feature extraction and regressor-based machine learning methods for predicting power consumption in virtualized open radio access networks (O-RANs), utilizing datasets from a hardware-instrumented testbed. We test three variants of deep neural networks (DNNs), namely, a standard DNN, a regularized DNN, and a hybrid model combining DNN-based feature extraction with an XGBoost regressor. We evaluate the performance of these models for various system parameters such as transmission gain, modulation/coding schemes, and airtime. We show that the hybrid model consistently outperformed others, achieving a mean relative error below 0.5%. Results suggest hybrid models like DNN-XGBoost offer superior accuracy and could be integrated into O-RAN management tools to enable more energy-efficient network orchestration in future networks.", "arxiv_id": "2607.24256", "arxiv_url": "https://arxiv.org/abs/2607.24256", "authors": ["Rishu Raj", "Genevieve Akude", "Urooj Tariq", "Daniel Kilper"], "brief": "\u672c\u6587\u7814\u7a76\u7528\u673a\u5668\u5b66\u4e60\u9884\u6d4b\u865a\u62df\u5316 O-RAN \u7684\u529f\u8017\uff0c\u57fa\u4e8e\u786c\u4ef6\u6d4b\u8bd5\u5e8a\u6570\u636e\u6bd4\u8f83\u6807\u51c6 DNN\u3001\u6b63\u5219\u5316 DNN \u548c DNN \u7279\u5f81\u63d0\u53d6\u7ed3\u5408 XGBoost \u7684\u6df7\u5408\u6a21\u578b\u3002\u7ed3\u679c\u663e\u793a\u6df7\u5408\u6a21\u578b\u8868\u73b0\u6700\u597d\uff0c\u5e73\u5747\u76f8\u5bf9\u8bef\u5dee\u4f4e\u4e8e 0.5%\uff0c\u6709\u671b\u7528\u4e8e O-RAN \u7ba1\u7406\u4e0e\u8282\u80fd\u7f16\u6392\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24256", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65e0\u7ebf\u7f51\u7edc", "\u80fd\u8017\u9884\u6d4b", "\u673a\u5668\u5b66\u4e60", "O-RAN"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24256v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ML-based Predictive Models for Power Consumption in Virtualised O-RANs", "tldr": "\u672c\u6587\u7814\u7a76\u7528\u673a\u5668\u5b66\u4e60\u9884\u6d4b\u865a\u62df\u5316 O-RAN \u7684\u529f\u8017\uff0c\u57fa\u4e8e\u786c\u4ef6\u6d4b\u8bd5\u5e8a\u6570\u636e\u6bd4\u8f83\u6807\u51c6 DNN\u3001\u6b63\u5219\u5316 DNN \u548c DNN \u7279\u5f81\u63d0\u53d6\u7ed3\u5408 XGBoost \u7684\u6df7\u5408\u6a21\u578b\u3002\u7ed3\u679c\u663e\u793a\u6df7\u5408\u6a21\u578b\u8868\u73b0\u6700\u597d\uff0c\u5e73\u5747\u76f8\u5bf9\u8bef\u5dee\u4f4e\u4e8e 0.5%\uff0c\u6709\u671b\u7528\u4e8e O-RAN \u7ba1\u7406\u4e0e\u8282\u80fd\u7f16\u6392\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We investigate the extent to which the reduced minimal Weierstrass coefficients of an elliptic curve over $\\mathbb{Q}$ may be computed from it\u0027s Frobenius traces. Decision tree models reveal that the first two reduced minimal Weierstrass coefficients can be recovered with perfect accuracy from the Frobenius traces at the primes $2$ and $3$, and the third by supplementing these two traces with the conductor parity. We subsequently prove explicit formulae for these coefficients using the Frobenius traces and conductor parity. These formulae appear to be new. In particular, we deduce that the first three reduced minimal Weierstrass coefficients of an elliptic curve are determined by its isogeny class.", "arxiv_id": "2607.24251", "arxiv_url": "https://arxiv.org/abs/2607.24251", "authors": ["Barinder S. Banwait", "Xiaoyu Huang", "Kyu-Hwan Lee", "Seewoo Lee", "Thomas Oliver", "Alexey Pozdnyakov"], "brief": "\u672c\u6587\u7814\u7a76\u692d\u5706\u66f2\u7ebf\u7684\u7ea6\u5316\u6781\u5c0f Weierstrass \u7cfb\u6570\u80fd\u5426\u7531 Frobenius \u8ff9\u786e\u5b9a\u3002\u4f5c\u8005\u7528\u51b3\u7b56\u6811\u53d1\u73b0\u524d\u4e24\u4e2a\u7cfb\u6570\u53ef\u7531\u7d20\u6570 2\u30013 \u5904\u7684 Frobenius \u8ff9\u5b8c\u5168\u6062\u590d\uff0c\u7b2c\u4e09\u4e2a\u7cfb\u6570\u518d\u52a0\u4e0a\u5bfc\u5b50\u5947\u5076\u6027\u5373\u53ef\u6062\u590d\uff0c\u5e76\u8fdb\u4e00\u6b65\u8bc1\u660e\u4e86\u663e\u5f0f\u516c\u5f0f\uff0c\u8bf4\u660e\u524d\u4e09\u4e2a\u7cfb\u6570\u7531\u540c\u6e90\u7c7b\u51b3\u5b9a\u3002", "categories": ["math.NT", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24251", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6570\u8bba", "\u692d\u5706\u66f2\u7ebf", "\u51b3\u7b56\u6811", "\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24251v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Decision trees, Frobenius traces, and Weierstrass coefficients of elliptic curves", "tldr": "\u672c\u6587\u7814\u7a76\u692d\u5706\u66f2\u7ebf\u7684\u7ea6\u5316\u6781\u5c0f Weierstrass \u7cfb\u6570\u80fd\u5426\u7531 Frobenius \u8ff9\u786e\u5b9a\u3002\u4f5c\u8005\u7528\u51b3\u7b56\u6811\u53d1\u73b0\u524d\u4e24\u4e2a\u7cfb\u6570\u53ef\u7531\u7d20\u6570 2\u30013 \u5904\u7684 Frobenius \u8ff9\u5b8c\u5168\u6062\u590d\uff0c\u7b2c\u4e09\u4e2a\u7cfb\u6570\u518d\u52a0\u4e0a\u5bfc\u5b50\u5947\u5076\u6027\u5373\u53ef\u6062\u590d\uff0c\u5e76\u8fdb\u4e00\u6b65\u8bc1\u660e\u4e86\u663e\u5f0f\u516c\u5f0f\uff0c\u8bf4\u660e\u524d\u4e09\u4e2a\u7cfb\u6570\u7531\u540c\u6e90\u7c7b\u51b3\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many existing clustering methods are designed based on a set-oriented definition---a cluster is a set of similar points---relying a point-to-point similarity function to find similar points. This works well for compact clusters, but clustering performance can deteriorate badly when cluster shapes are irregular, and densities or sizes vary between clusters. Recent `Cluster-as-Distribution\u0027 (CaD) clustering has been shown to discover these generic types of clusters in practice by treating each cluster as a set of independent and identically distributed points generated from some unknown distribution via a greedy search, achieving a clustering objective equivalent to that of Spectral Clustering, but with better clustering outcomes without eigen-decomposition. However, a theoretical analysis of this phenomenon is still lacking. Our analyses are from two angles. First, we analyze the approximation error between the true and empirical distribution embeddings. Second, we show that the greedy search employed to achieve the CaD clustering objective can be mapped to a partition matroid---yielding greedy optimality. These yield a near-optimality guarantee for the CaD clustering objective, with regret controlled by the approximation error. This is the first analysis that explains why CaD clustering via greedy search can discover clusters of arbitrary shapes, densities and sizes (where all set-oriented clustering methods have failed to discover) when the estimated cluster embeddings faithfully approximate the underlying cluster distributions.", "arxiv_id": "2607.24237", "arxiv_url": "https://arxiv.org/abs/2607.24237", "authors": ["Kai Ming Ting", "Kaifeng Zhang", "Sanjay Chawla"], "brief": "\u8bba\u6587\u4ece\u7406\u8bba\u4e0a\u89e3\u91ca\u4e86 Cluster-as-Distribution \u805a\u7c7b\u4e2d\u8d2a\u5fc3\u641c\u7d22\u4e3a\u4f55\u80fd\u5f97\u5230\u8fd1\u6700\u4f18\u805a\u7c7b\u7ed3\u679c\u3002\u4f5c\u8005\u5206\u6790\u771f\u5b9e\u5206\u5e03\u5d4c\u5165\u4e0e\u7ecf\u9a8c\u5d4c\u5165\u7684\u8fd1\u4f3c\u8bef\u5dee\uff0c\u5e76\u5c06\u8d2a\u5fc3\u641c\u7d22\u6620\u5c04\u5230\u5206\u533a\u62df\u9635\uff0c\u4ece\u800c\u7ed9\u51fa\u7531\u8fd1\u4f3c\u8bef\u5dee\u63a7\u5236\u7684\u9057\u61be\u754c\uff0c\u8bf4\u660e\u5176\u53ef\u5904\u7406\u4efb\u610f\u5f62\u72b6\u3001\u5bc6\u5ea6\u548c\u89c4\u6a21\u7684\u7c07\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24237", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u805a\u7c7b", "\u8d2a\u5fc3\u7b97\u6cd5", "\u8c31\u805a\u7c7b", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24237v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Why does Greedy Search produce Optimal Clustering Outcomes? A Fixed-Core Assignment Theory", "tldr": "\u8bba\u6587\u4ece\u7406\u8bba\u4e0a\u89e3\u91ca\u4e86 Cluster-as-Distribution \u805a\u7c7b\u4e2d\u8d2a\u5fc3\u641c\u7d22\u4e3a\u4f55\u80fd\u5f97\u5230\u8fd1\u6700\u4f18\u805a\u7c7b\u7ed3\u679c\u3002\u4f5c\u8005\u5206\u6790\u771f\u5b9e\u5206\u5e03\u5d4c\u5165\u4e0e\u7ecf\u9a8c\u5d4c\u5165\u7684\u8fd1\u4f3c\u8bef\u5dee\uff0c\u5e76\u5c06\u8d2a\u5fc3\u641c\u7d22\u6620\u5c04\u5230\u5206\u533a\u62df\u9635\uff0c\u4ece\u800c\u7ed9\u51fa\u7531\u8fd1\u4f3c\u8bef\u5dee\u63a7\u5236\u7684\u9057\u61be\u754c\uff0c\u8bf4\u660e\u5176\u53ef\u5904\u7406\u4efb\u610f\u5f62\u72b6\u3001\u5bc6\u5ea6\u548c\u89c4\u6a21\u7684\u7c07\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Over the past 20 years, kernel discrepancies have been leveraged as a highly powerful tool for quantifying the disagreement of distributions, with numerous successful applications in two-sample, goodness-of-fit, and independence testing, among others. Their fastest estimators are known to converge at a parametric rate---$n^{-1/2}$---under mild conditions. While this rate is known to be minimax optimal on $\\mathbb R^d$ under strict assumptions with bounded kernels, little is known about its optimality beyond the finite-dimensional Euclidean setting with unbounded kernels. In this work, we prove that the minimax lower bound of estimation of the most popular kernel discrepancies (maximum mean discrepancy, Hilbert-Schmidt independence criterion and kernel Stein discrepancy; MMD, HSIC, KSD) is $n^{-1/2}$ on general topological spaces, and under mild assumptions on the kernel; the same rates are shown (as corollaries) to hold for the estimation of the mean embedding and the centered cross-covariance operator. Our results settle the question of optimal estimation of these kernel discrepancies.", "arxiv_id": "2607.24235", "arxiv_url": "https://arxiv.org/abs/2607.24235", "authors": ["Jose Cribeiro-Ramallo", "Florian Kalinke", "Zolt\u00e1n Szab\u00f3"], "brief": "\u672c\u6587\u7814\u7a76\u6838\u5dee\u5f02\u5ea6\u91cf\uff08MMD\u3001HSIC\u3001KSD\uff09\u7684\u4f30\u8ba1\u6781\u5c0f\u6781\u5927\u4e0b\u754c\uff0c\u8bc1\u660e\u5728\u4e00\u822c\u62d3\u6251\u7a7a\u95f4\u548c\u8f83\u6e29\u548c\u6838\u5047\u8bbe\u4e0b\uff0c\u5176\u6700\u4f18\u4f30\u8ba1\u901f\u7387\u4e3a\u53c2\u6570\u901f\u7387 n^{-1/2}\u3002\u7ed3\u679c\u540c\u65f6\u63a8\u51fa\u5747\u503c\u5d4c\u5165\u548c\u4e2d\u5fc3\u5316\u4ea4\u53c9\u534f\u65b9\u5dee\u7b97\u5b50\u4f30\u8ba1\u7684\u540c\u9636\u4e0b\u754c\uff0c\u57fa\u672c\u89e3\u51b3\u4e86\u8fd9\u4e9b\u6838\u5dee\u5f02\u4f30\u8ba1\u7684\u6700\u4f18\u6027\u95ee\u9898\u3002", "categories": ["stat.ML", "cs.LG", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24235", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6838\u65b9\u6cd5", "\u7edf\u8ba1\u5b66\u4e60", "\u6781\u5c0f\u6781\u5927\u4e0b\u754c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24235v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Minimax Lower Bounds of Kernel Discrepancy Estimation: MMD, HSIC, KSD", "tldr": "\u672c\u6587\u7814\u7a76\u6838\u5dee\u5f02\u5ea6\u91cf\uff08MMD\u3001HSIC\u3001KSD\uff09\u7684\u4f30\u8ba1\u6781\u5c0f\u6781\u5927\u4e0b\u754c\uff0c\u8bc1\u660e\u5728\u4e00\u822c\u62d3\u6251\u7a7a\u95f4\u548c\u8f83\u6e29\u548c\u6838\u5047\u8bbe\u4e0b\uff0c\u5176\u6700\u4f18\u4f30\u8ba1\u901f\u7387\u4e3a\u53c2\u6570\u901f\u7387 n^{-1/2}\u3002\u7ed3\u679c\u540c\u65f6\u63a8\u51fa\u5747\u503c\u5d4c\u5165\u548c\u4e2d\u5fc3\u5316\u4ea4\u53c9\u534f\u65b9\u5dee\u7b97\u5b50\u4f30\u8ba1\u7684\u540c\u9636\u4e0b\u754c\uff0c\u57fa\u672c\u89e3\u51b3\u4e86\u8fd9\u4e9b\u6838\u5dee\u5f02\u4f30\u8ba1\u7684\u6700\u4f18\u6027\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Federated learning has emerged as a promising paradigm for spatio-temporal forecasting (STF), enabling collaborative model training without sharing raw observations. Existing federated STF methods primarily regard cross-client heterogeneity as an optimization challenge and mitigate it through personalized approaches. However, such heterogeneity fundamentally stems from diverse \\emph{environmental conditions}, and these methods capture environment-specific forecasting patterns, hardly generalizing under environmental shifts. Our key insight is that the environmental diversity across federated clients should be exploited, as they provide \\emph{complementary observations of the same underlying spatio-temporal system}. Based on this insight, we propose \\method, a novel federated de-confounding framework that \\textbf{treats clients as distinct causal environments}. \\method leverages the client heterogeneity as distributed environmental evidence and learns a global prototype codebook to capture shared environmental regimes. We further derive a theoretical federated de-confounding bound that is linearly controlled by the averaged confounding strength. Extensive experiments demonstrate that \\method consistently outperforms federated baselines, while providing transferable, interpretable, and communication-efficient environmental representations.", "arxiv_id": "2607.24218", "arxiv_url": "https://arxiv.org/abs/2607.24218", "authors": ["Qingxiang Liu", "Anqi Liang", "Heng Wang", "Yuxuan Liang"], "brief": "\u672c\u6587\u5c06\u8054\u90a6\u65f6\u7a7a\u9884\u6d4b\u4e2d\u7684\u6bcf\u4e2a\u5ba2\u6237\u7aef\u89c6\u4e3a\u4e0d\u540c\u56e0\u679c\u73af\u5883\uff0c\u4e0d\u518d\u53ea\u628a\u5ba2\u6237\u7aef\u5f02\u8d28\u6027\u5f53\u4f5c\u4f18\u5316\u95ee\u9898\uff0c\u800c\u662f\u5229\u7528\u5176\u4f5c\u4e3a\u53bb\u6df7\u6742\u7684\u73af\u5883\u8bc1\u636e\u3002\u65b9\u6cd5\u5b66\u4e60\u5168\u5c40\u539f\u578b\u7801\u672c\u6765\u523b\u753b\u5171\u4eab\u73af\u5883\u72b6\u6001\uff0c\u5e76\u7ed9\u51fa\u8054\u90a6\u53bb\u6df7\u6742\u7406\u8bba\u754c\uff0c\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u9884\u6d4b\u6027\u80fd\u3001\u53ef\u8fc1\u79fb\u6027\u3001\u53ef\u89e3\u91ca\u6027\u548c\u901a\u4fe1\u6548\u7387\u4e0a\u4f18\u4e8e\u57fa\u7ebf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24218", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u65f6\u7a7a\u9884\u6d4b", "\u56e0\u679c\u53bb\u6df7\u6742", "\u5f02\u8d28\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24218v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Every Client Is an Environment: Federated De-confounding for Spatio-Temporal Forecasting", "tldr": "\u672c\u6587\u5c06\u8054\u90a6\u65f6\u7a7a\u9884\u6d4b\u4e2d\u7684\u6bcf\u4e2a\u5ba2\u6237\u7aef\u89c6\u4e3a\u4e0d\u540c\u56e0\u679c\u73af\u5883\uff0c\u4e0d\u518d\u53ea\u628a\u5ba2\u6237\u7aef\u5f02\u8d28\u6027\u5f53\u4f5c\u4f18\u5316\u95ee\u9898\uff0c\u800c\u662f\u5229\u7528\u5176\u4f5c\u4e3a\u53bb\u6df7\u6742\u7684\u73af\u5883\u8bc1\u636e\u3002\u65b9\u6cd5\u5b66\u4e60\u5168\u5c40\u539f\u578b\u7801\u672c\u6765\u523b\u753b\u5171\u4eab\u73af\u5883\u72b6\u6001\uff0c\u5e76\u7ed9\u51fa\u8054\u90a6\u53bb\u6df7\u6742\u7406\u8bba\u754c\uff0c\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u9884\u6d4b\u6027\u80fd\u3001\u53ef\u8fc1\u79fb\u6027\u3001\u53ef\u89e3\u91ca\u6027\u548c\u901a\u4fe1\u6548\u7387\u4e0a\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study the problem of lossless compression of source code, motivated by the storage demands of large-scale software archives, such as Software Heritage (https://www.softwareheritage.org/). General-purpose compressors (e.g., zstd, bzip2) offer a good trade-off between compression ratio and speed, but fail to exploit all special regularities inherent in source code. Recent approaches leverage Large Language Models (LLMs) within Shannon\u0027s symbol-ranking framework, relying on a scheme in which the predicted rank can grow arbitrarily. While effective at reducing space, this setting incurs significant throughput degradation, and leaves open the question whether it is necessary to explicitly encode all ranks. In this work, we introduce LLM-based compressors deploying two novel symbol-ranking variants that bound predictions to the top-$T$ ranks ($T=1$ or $63$), with out-of-threshold symbols stored as exceptions and compressed jointly with the rank stream via general-purpose compressors. We conduct the first large-scale evaluation of LLM-based source code compression across 30 LLMs, including general-domain, code-specialized, and quantized models. Our $T$-bounded approach outperforms prior LLM-based compressors both in compression ratio (up to 37% relative improvement) and compression throughput (40% faster). Compared to general-purpose compressors (e.g., zstd, bzip2), we obtain up to 82% relative compression gain but at a lower speed, thus offering a new trade-off point in the compression-speed spectrum. We also show that these gains are stronger on source code than on natural language, suggesting an interesting indication, namely that source code exposes regularities captured by LLMs but missed by general-purpose exact-match-based compressors. We conclude by commenting on open problems that offer theoretical and practical avenues of research.", "arxiv_id": "2607.24192", "arxiv_url": "https://arxiv.org/abs/2607.24192", "authors": ["Angelo Nardone", "Paolo Ferragina"], "brief": "\u672c\u6587\u7814\u7a76\u7528\u5927\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u6e90\u4ee3\u7801\u65e0\u635f\u538b\u7f29\uff0c\u63d0\u51fa\u5c06\u7b26\u53f7\u6392\u5e8f\u9884\u6d4b\u9650\u5236\u5728\u524d T \u540d\uff08T=1 \u6216 63\uff09\uff0c\u8d85\u51fa\u90e8\u5206\u4f5c\u4e3a\u4f8b\u5916\u5e76\u4e0e\u6392\u540d\u6d41\u4e00\u8d77\u7528\u901a\u7528\u538b\u7f29\u5668\u5904\u7406\u3002\u8be5\u65b9\u6cd5\u572830\u4e2aLLM\u4e0a\u7684\u5927\u89c4\u6a21\u8bc4\u6d4b\u4e2d\uff0c\u76f8\u6bd4\u65e2\u6709LLM\u538b\u7f29\u5668\u6700\u9ad8\u63d0\u534737%\u538b\u7f29\u7387\u4e14\u5feb40%\uff0c\u76f8\u6bd4zstd\u3001bzip2\u7b49\u901a\u7528\u538b\u7f29\u5668\u6700\u9ad8\u83b7\u5f9782%\u76f8\u5bf9\u538b\u7f29\u589e\u76ca\u4f46\u901f\u5ea6\u8f83\u4f4e\u3002", "categories": ["cs.IT", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24192", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4ee3\u7801\u538b\u7f29", "\u65e0\u635f\u538b\u7f29", "\u6e90\u4ee3\u7801"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24192v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LLM-based Source Code Compression via Thresholded Symbol Ranking", "tldr": "\u672c\u6587\u7814\u7a76\u7528\u5927\u8bed\u8a00\u6a21\u578b\u8fdb\u884c\u6e90\u4ee3\u7801\u65e0\u635f\u538b\u7f29\uff0c\u63d0\u51fa\u5c06\u7b26\u53f7\u6392\u5e8f\u9884\u6d4b\u9650\u5236\u5728\u524d T \u540d\uff08T=1 \u6216 63\uff09\uff0c\u8d85\u51fa\u90e8\u5206\u4f5c\u4e3a\u4f8b\u5916\u5e76\u4e0e\u6392\u540d\u6d41\u4e00\u8d77\u7528\u901a\u7528\u538b\u7f29\u5668\u5904\u7406\u3002\u8be5\u65b9\u6cd5\u572830\u4e2aLLM\u4e0a\u7684\u5927\u89c4\u6a21\u8bc4\u6d4b\u4e2d\uff0c\u76f8\u6bd4\u65e2\u6709LLM\u538b\u7f29\u5668\u6700\u9ad8\u63d0\u534737%\u538b\u7f29\u7387\u4e14\u5feb40%\uff0c\u76f8\u6bd4zstd\u3001bzip2\u7b49\u901a\u7528\u538b\u7f29\u5668\u6700\u9ad8\u83b7\u5f9782%\u76f8\u5bf9\u538b\u7f29\u589e\u76ca\u4f46\u901f\u5ea6\u8f83\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Monitoring post-disaster recovery is essential for understanding how urban systems rebuild and progressively return to functionality. However, tracking reconstruction remains difficult because reliable ground-truth information is often scarce and recovery processes evolve over time. This paper proposes an unsupervised framework for recovery monitoring based on multi-temporal synthetic aperture radar (SAR) observations and deep-learning anomaly detection. COSMO-SkyMed time series are used to identify persistent temporal anomalies associated with reconstruction activities and to generate spatially explicit recovery maps. The framework is applied to four cities severely affected by the 2023 Turkiye-Syria earthquakes, revealing heterogeneous reconstruction dynamics across different urban contexts. The results show spatially structured patterns of persistent anomalies related to reconstruction over damaged and cleared areas, temporary container settlements, and new residential districts. Comparison with nighttime-light recovery indicators derived from SDGSAT-1 data highlights the complementary nature of the two modalities: nighttime lights reflect the restoration of electricity supply and nighttime socioeconomic activity, whereas SAR anomalies capture structural changes in the built environment and may reveal reconstruction at earlier stages. The results demonstrate that multi-temporal SAR data combined with unsupervised learning provide an effective and scalable approach for monitoring post-disaster reconstruction when labeled recovery datasets are unavailable.", "arxiv_id": "2607.24180", "arxiv_url": "https://arxiv.org/abs/2607.24180", "authors": ["Luigi Russo", "Deodato Tapete", "Silvia Liberata Ullo", "Paolo Gamba"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u591a\u65f6\u76f8\u9ad8\u5206\u8fa8\u7387SAR\u5f71\u50cf\u548c\u6df1\u5ea6\u5b66\u4e60\u65e0\u76d1\u7763\u5f02\u5e38\u68c0\u6d4b\u7684\u707e\u540e\u57ce\u5e02\u6062\u590d\u76d1\u6d4b\u6846\u67b6\uff0c\u65e0\u9700\u6807\u6ce8\u6570\u636e\u5373\u53ef\u751f\u6210\u91cd\u5efa\u6d3b\u52a8\u7684\u7a7a\u95f4\u6062\u590d\u56fe\u3002\u5e94\u7528\u4e8e2023\u5e74\u571f\u8033\u5176-\u53d9\u5229\u4e9a\u5730\u9707\u53d7\u707e\u57ce\u5e02\u540e\uff0c\u65b9\u6cd5\u63ed\u793a\u4e86\u53d7\u635f\u6e05\u7406\u533a\u3001\u4e34\u65f6\u5b89\u7f6e\u70b9\u548c\u65b0\u4f4f\u5b85\u533a\u7b49\u4e0d\u540c\u533a\u57df\u7684\u5f02\u8d28\u91cd\u5efa\u52a8\u6001\uff0c\u5e76\u4e0e\u591c\u95f4\u706f\u5149\u6307\u6807\u5f62\u6210\u4e92\u8865\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24180", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9065\u611f", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u5f02\u5e38\u68c0\u6d4b", "\u707e\u540e\u6062\u590d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24180v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Monitoring Post-Disaster Urban Recovery Using High-Resolution SAR Time Series and Unsupervised Learning: Evidence from the 2023 T\u00fcrkiye-Syria Earthquake", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u591a\u65f6\u76f8\u9ad8\u5206\u8fa8\u7387SAR\u5f71\u50cf\u548c\u6df1\u5ea6\u5b66\u4e60\u65e0\u76d1\u7763\u5f02\u5e38\u68c0\u6d4b\u7684\u707e\u540e\u57ce\u5e02\u6062\u590d\u76d1\u6d4b\u6846\u67b6\uff0c\u65e0\u9700\u6807\u6ce8\u6570\u636e\u5373\u53ef\u751f\u6210\u91cd\u5efa\u6d3b\u52a8\u7684\u7a7a\u95f4\u6062\u590d\u56fe\u3002\u5e94\u7528\u4e8e2023\u5e74\u571f\u8033\u5176-\u53d9\u5229\u4e9a\u5730\u9707\u53d7\u707e\u57ce\u5e02\u540e\uff0c\u65b9\u6cd5\u63ed\u793a\u4e86\u53d7\u635f\u6e05\u7406\u533a\u3001\u4e34\u65f6\u5b89\u7f6e\u70b9\u548c\u65b0\u4f4f\u5b85\u533a\u7b49\u4e0d\u540c\u533a\u57df\u7684\u5f02\u8d28\u91cd\u5efa\u52a8\u6001\uff0c\u5e76\u4e0e\u591c\u95f4\u706f\u5149\u6307\u6807\u5f62\u6210\u4e92\u8865\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Due to the lack of systematic evaluations, we are not yet able to determine which AI-based Windows malware detector to deploy in production, since existing evaluations (i) differ in terms of data used for both training and testing; (ii) do not consider temporal analysis to showcase whether models withstand the passage of time; (iii) avoid security evaluations with adversarial attacks that could highlight their brittleness against content-injection attacks; and (iv) neglect the computational requirements for deployment, risking slow inference on endpoints. For these reasons, we develop EXE-Bench, a comprehensive benchmark of AI-based Windows malware detectors. EXE-Bench assesses performance, temporal and adversarial robustness, and computational overhead, aggregating them into a single score for direct and fair model comparison. Through EXE-Bench, we highlight how evaluations conducted only after deployment are suboptimal and unable to provide a complete picture of their performance. In particular, through our analysis, we remark how much domain knowledge instilled through feature engineering is still extremely useful in this domain, resisting both time and adversarial attacks, in stark contrast with most of the deep networks that only excel right after deployment.", "arxiv_id": "2607.24177", "arxiv_url": "https://arxiv.org/abs/2607.24177", "authors": ["Andrea Ponte", "Daniel Gibert", "Matous Kozak", "Dmitrijs Trizna", "Maura Pintor", "Battista Biggio", "Fabio Roli", "Luca Demetrio"], "brief": "\u8bba\u6587\u63d0\u51fa EXE-Bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30 AI Windows \u6076\u610f\u8f6f\u4ef6\u68c0\u6d4b\u5668\uff0c\u7efc\u5408\u6bd4\u8f83\u68c0\u6d4b\u6027\u80fd\u3001\u65f6\u95f4\u9c81\u68d2\u6027\u3001\u5bf9\u6297\u653b\u51fb\u9c81\u68d2\u6027\u548c\u8ba1\u7b97\u5f00\u9500\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4ec5\u770b\u90e8\u7f72\u521d\u671f\u6548\u679c\u4f1a\u8bef\u5bfc\u9009\u62e9\uff1b\u5e26\u6709\u9886\u57df\u77e5\u8bc6\u7684\u7279\u5f81\u5de5\u7a0b\u65b9\u6cd5\u5728\u957f\u671f\u548c\u5bf9\u6297\u573a\u666f\u4e0b\u4ecd\u5f88\u6709\u4ef7\u503c\uff0c\u800c\u8bb8\u591a\u6df1\u5ea6\u7f51\u7edc\u4e3b\u8981\u53ea\u5728\u90e8\u7f72\u521d\u671f\u8868\u73b0\u7a81\u51fa\u3002", "categories": ["cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24177", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6076\u610f\u8f6f\u4ef6\u68c0\u6d4b", "\u5b89\u5168\u8bc4\u6d4b", "\u9c81\u68d2\u6027", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24177v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EXE-Bench: Ranking the Tradeoffs of AI-based Windows Malware Detectors for Real-World Usability", "tldr": "\u8bba\u6587\u63d0\u51fa EXE-Bench\uff0c\u7528\u4e8e\u7cfb\u7edf\u8bc4\u4f30 AI Windows \u6076\u610f\u8f6f\u4ef6\u68c0\u6d4b\u5668\uff0c\u7efc\u5408\u6bd4\u8f83\u68c0\u6d4b\u6027\u80fd\u3001\u65f6\u95f4\u9c81\u68d2\u6027\u3001\u5bf9\u6297\u653b\u51fb\u9c81\u68d2\u6027\u548c\u8ba1\u7b97\u5f00\u9500\u3002\u7ed3\u679c\u663e\u793a\uff0c\u4ec5\u770b\u90e8\u7f72\u521d\u671f\u6548\u679c\u4f1a\u8bef\u5bfc\u9009\u62e9\uff1b\u5e26\u6709\u9886\u57df\u77e5\u8bc6\u7684\u7279\u5f81\u5de5\u7a0b\u65b9\u6cd5\u5728\u957f\u671f\u548c\u5bf9\u6297\u573a\u666f\u4e0b\u4ecd\u5f88\u6709\u4ef7\u503c\uff0c\u800c\u8bb8\u591a\u6df1\u5ea6\u7f51\u7edc\u4e3b\u8981\u53ea\u5728\u90e8\u7f72\u521d\u671f\u8868\u73b0\u7a81\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Compressed short-text generators can fail in two different places: the codec may discard information before generation starts, or the latent generator may produce weak codes. Without separating these failure modes, researchers can spend compute improving the wrong component. We study this problem in a controlled 64-to-16 TinyStories case study built from a hierarchical VQ-VAE-2 codec and a masked discrete diffusion generator (MDLM). We use a staged validation protocol that separates codec reconstruction fidelity, latent generation quality, and auxiliary latent diagnostics under one shared external GPT-2 scorer, while reporting complementary semantic metrics for the geometry study. In the tested configuration, codec reconstruction alone raises median external perplexity from 15.17 to 27.36 (+80.4%) and p95 from 25.10 to 98.91 (+294.1%), showing that the dominant quality loss appears before latent generation begins. Under the same scorer, code-space MDLM remains materially stronger than token-space diffusion, reducing mean, median, and p95 by 32.9%, 30.9%, and 36.6%, respectively. Geometry-aware regularization improves local latent proxies but does not improve decoded-text metrics in the available runs. The contribution is methodological rather than algorithmic: the paper presents a reusable staged diagnosis for one concrete pipeline and shows that, in this setting, codec fidelity rather than latent denoising sets the practical quality ceiling.", "arxiv_id": "2607.24176", "arxiv_url": "https://arxiv.org/abs/2607.24176", "authors": ["Alexey Gavrilov", "Alan-Barsag Gazzaev", "Sergey Muravyov"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5206\u9636\u6bb5\u9a8c\u8bc1\u65b9\u6cd5\uff0c\u7528\u4e8e\u5b9a\u4f4d\u538b\u7f29\u77ed\u6587\u672c\u751f\u6210\u4e2d\u7684\u8d28\u91cf\u74f6\u9888\uff1a\u533a\u5206\u662f\u7f16\u7801\u5668\u5148\u4e22\u5931\u4fe1\u606f\uff0c\u8fd8\u662f\u6f5c\u5728\u7a7a\u95f4\u751f\u6210\u5668\u4ea7\u751f\u4e86\u4f4e\u8d28\u91cf\u4ee3\u7801\u3002\u5728 TinyStories \u7684 64-to-16 \u538b\u7f29\u5b9e\u9a8c\u4e2d\uff0c\u4e3b\u8981\u8d28\u91cf\u635f\u5931\u6765\u81ea VQ-VAE-2 \u7f16\u89e3\u7801\u91cd\u6784\u9636\u6bb5\uff0c\u800c\u975e\u540e\u7eed\u7684\u79bb\u6563\u6269\u6563\u751f\u6210\uff1b\u7801\u7a7a\u95f4\u6269\u6563\u4ecd\u660e\u663e\u4f18\u4e8e token \u7a7a\u95f4\u6269\u6563\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24176", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6587\u672c\u751f\u6210", "\u79bb\u6563\u6269\u6563", "\u8868\u793a\u5b66\u4e60", "\u6a21\u578b\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24176v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Where Quality Breaks in Compressed Short-Text Generation: Staged Bottleneck Localization", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u5206\u9636\u6bb5\u9a8c\u8bc1\u65b9\u6cd5\uff0c\u7528\u4e8e\u5b9a\u4f4d\u538b\u7f29\u77ed\u6587\u672c\u751f\u6210\u4e2d\u7684\u8d28\u91cf\u74f6\u9888\uff1a\u533a\u5206\u662f\u7f16\u7801\u5668\u5148\u4e22\u5931\u4fe1\u606f\uff0c\u8fd8\u662f\u6f5c\u5728\u7a7a\u95f4\u751f\u6210\u5668\u4ea7\u751f\u4e86\u4f4e\u8d28\u91cf\u4ee3\u7801\u3002\u5728 TinyStories \u7684 64-to-16 \u538b\u7f29\u5b9e\u9a8c\u4e2d\uff0c\u4e3b\u8981\u8d28\u91cf\u635f\u5931\u6765\u81ea VQ-VAE-2 \u7f16\u89e3\u7801\u91cd\u6784\u9636\u6bb5\uff0c\u800c\u975e\u540e\u7eed\u7684\u79bb\u6563\u6269\u6563\u751f\u6210\uff1b\u7801\u7a7a\u95f4\u6269\u6563\u4ecd\u660e\u663e\u4f18\u4e8e token \u7a7a\u95f4\u6269\u6563\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Road crashes remain among the gravest threats to public safety, and preventing them is a defining task of transportation systems worldwide. Much of that harm concentrates at hotspots, yet a hotspot is less a place than an episode; it emerges quietly at an intersection or along an arterial, intensifies for weeks, then subsides, only to reappear elsewhere. Enforcement guided by maps of past crashes inevitably trails this cycle, patrolling yesterday\u0027s hotspots while tomorrow\u0027s form unwatched. Breaking that lag requires three capabilities at once: detecting hotspots as they are born, forecasting where they will sit next week, and following each one through its life. We introduce HERALD (Hotspot Emergence, Risk Anticipation, and Life-cycle Dynamics), a unified deep learning framework that provides all three from a single statewide model. HERALD distills each county\u0027s recent crash history into weekly risk maps and forecasts the next with a CNN--Transformer, whose mixture-of-experts lets one model serve dense urban cores and sparse rural corridors alike. Each forecast is anchored in the county\u0027s long-run crash geography, sharpened by the self-exciting effect of recent crashes, and paired with explicit warnings of where new hotspots are about to appear. Followed over time, every hotspot acquires a legible life story, from birth through growth and stability to decline and death. Across six heterogeneous Wisconsin counties, HERALD forecasts more accurately than five identically trained baselines, locates hotspots most precisely, and flags emerging risks before they take hold. A single adjustable setting trades accuracy for extra sensitivity where deployment demands it. The result shifts hotspot management from mapping the past to anticipating the future.", "arxiv_id": "2607.24168", "arxiv_url": "https://arxiv.org/abs/2607.24168", "authors": ["Jingwen Zhu", "Keshu Wu", "Pei Li", "Steven T. Parker", "Bin Ran", "David A. Noyce"], "brief": "\u672c\u6587\u63d0\u51fa HERALD\uff0c\u4e00\u4e2a\u7edf\u4e00\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u7528 CNN-Transformer \u548c\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u57fa\u4e8e\u8fd1\u671f\u4e8b\u6545\u5386\u53f2\u751f\u6210\u5468\u98ce\u9669\u5730\u56fe\uff0c\u9884\u6d4b\u4e0b\u4e00\u5468\u4ea4\u901a\u4e8b\u6545\u70ed\u70b9\uff0c\u5e76\u8ffd\u8e2a\u70ed\u70b9\u4ece\u51fa\u73b0\u5230\u6d88\u9000\u7684\u751f\u547d\u5468\u671f\u3002\u5728\u5a01\u65af\u5eb7\u661f\u5dde\u516d\u4e2a\u5dee\u5f02\u53bf\u7684\u5b9e\u9a8c\u4e2d\uff0cHERALD \u76f8\u6bd4\u4e94\u4e2a\u57fa\u7ebf\u9884\u6d4b\u66f4\u51c6\u3001\u70ed\u70b9\u5b9a\u4f4d\u66f4\u7cbe\u786e\uff0c\u5e76\u80fd\u63d0\u524d\u9884\u8b66\u65b0\u5174\u98ce\u9669\u3002", "categories": ["cs.LG", "cs.ET"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24168", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ea4\u901a\u5b89\u5168", "\u65f6\u7a7a\u9884\u6d4b", "\u6df1\u5ea6\u5b66\u4e60", "\u70ed\u70b9\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24168v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Forecasting the Emergence and Evolution of Crash Hotspots: A Unified Deep Learning Framework for Proactive Traffic Safety", "tldr": "\u672c\u6587\u63d0\u51fa HERALD\uff0c\u4e00\u4e2a\u7edf\u4e00\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u7528 CNN-Transformer \u548c\u6df7\u5408\u4e13\u5bb6\u6a21\u578b\u57fa\u4e8e\u8fd1\u671f\u4e8b\u6545\u5386\u53f2\u751f\u6210\u5468\u98ce\u9669\u5730\u56fe\uff0c\u9884\u6d4b\u4e0b\u4e00\u5468\u4ea4\u901a\u4e8b\u6545\u70ed\u70b9\uff0c\u5e76\u8ffd\u8e2a\u70ed\u70b9\u4ece\u51fa\u73b0\u5230\u6d88\u9000\u7684\u751f\u547d\u5468\u671f\u3002\u5728\u5a01\u65af\u5eb7\u661f\u5dde\u516d\u4e2a\u5dee\u5f02\u53bf\u7684\u5b9e\u9a8c\u4e2d\uff0cHERALD \u76f8\u6bd4\u4e94\u4e2a\u57fa\u7ebf\u9884\u6d4b\u66f4\u51c6\u3001\u70ed\u70b9\u5b9a\u4f4d\u66f4\u7cbe\u786e\uff0c\u5e76\u80fd\u63d0\u524d\u9884\u8b66\u65b0\u5174\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate vegetation-community classification is essential for ecological monitoring, habitat assessment, and evidence-based environmental management in heterogeneous landscapes. Existing studies often rely on standalone tree ensembles or generic neural networks, although fine-grained ecological classes frequently exhibit overlapping spectral, topographic, and structural characteristics. Many frameworks also provide limited protection against stacking leakage, insufficient probability calibration, weak minority-class evaluation, and little evidence of stability across repeated data splits. To address these limitations, this study proposes Calibrated EcoTreeFuseNet-Plus, a tree-neural probability-fusion framework that combines out-of-fold tree probabilities, EcoFuseNet-V2 outputs, validation-selected meta-learning, and post-hoc temperature scaling. Raster values from six LiDAR-derived terrain and canopy variables and two hyperspectral vegetation indices were extracted at coordinate-based reference locations. Quality control removed 26 samples with missing elevation and one sample with non-finite NDWI, producing 1,833 complete records across 29 vegetation and non-vegetation classes. On the held-out test set, the proposed model achieved an accuracy of 0.8000, a macro F1-score of 0.7768, a balanced accuracy of 0.7903, and an MCC of 0.7903. Calibration reduced the expected calibration error from 0.3866 to 0.0651 without changing class predictions. Five-seed evaluation yielded a macro F1-score of 0.7717 +/- 0.0112, indicating stable performance across repeated splits. The results demonstrate a reliable discrimination-calibration trade-off for small-sample, fine-grained ecological classification.", "arxiv_id": "2607.24160", "arxiv_url": "https://arxiv.org/abs/2607.24160", "authors": ["Dristi Datta", "Md Khalid Hasan Sakib", "Manoranjan Paul"], "brief": "\u8bba\u6587\u63d0\u51fa Calibrated EcoTreeFuseNet-Plus\uff0c\u5c06\u6811\u6a21\u578b\u7684\u6298\u5916\u6982\u7387\u3001\u795e\u7ecf\u7f51\u7edc\u8f93\u51fa\u3001\u9a8c\u8bc1\u96c6\u9009\u62e9\u7684\u5143\u5b66\u4e60\u548c\u6e29\u5ea6\u7f29\u653e\u7ed3\u5408\uff0c\u7528\u4e8e\u7ec6\u7c92\u5ea6\u690d\u88ab\u7fa4\u843d\u5206\u7c7b\u3002\u8be5\u65b9\u6cd5\u572829\u7c7b\u30011833\u6761\u6837\u672c\u4e0a\u53d6\u5f970.8000\u51c6\u786e\u7387\u548c0.7768\u5b8fF1\uff0c\u5e76\u5c06\u6821\u51c6\u8bef\u5dee\u4ece0.3866\u964d\u81f30.0651\uff0c\u4e14\u591a\u968f\u673a\u79cd\u5b50\u7ed3\u679c\u8f83\u7a33\u5b9a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24160", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6001\u9065\u611f", "\u6a21\u578b\u878d\u5408", "\u6982\u7387\u6821\u51c6", "\u5c0f\u6837\u672c\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24160v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Calibrated Tree-Neural Fusion for Fine-Grained Vegetation Community Classification", "tldr": "\u8bba\u6587\u63d0\u51fa Calibrated EcoTreeFuseNet-Plus\uff0c\u5c06\u6811\u6a21\u578b\u7684\u6298\u5916\u6982\u7387\u3001\u795e\u7ecf\u7f51\u7edc\u8f93\u51fa\u3001\u9a8c\u8bc1\u96c6\u9009\u62e9\u7684\u5143\u5b66\u4e60\u548c\u6e29\u5ea6\u7f29\u653e\u7ed3\u5408\uff0c\u7528\u4e8e\u7ec6\u7c92\u5ea6\u690d\u88ab\u7fa4\u843d\u5206\u7c7b\u3002\u8be5\u65b9\u6cd5\u572829\u7c7b\u30011833\u6761\u6837\u672c\u4e0a\u53d6\u5f970.8000\u51c6\u786e\u7387\u548c0.7768\u5b8fF1\uff0c\u5e76\u5c06\u6821\u51c6\u8bef\u5dee\u4ece0.3866\u964d\u81f30.0651\uff0c\u4e14\u591a\u968f\u673a\u79cd\u5b50\u7ed3\u679c\u8f83\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Feature selection aims to identify the most informative and relevant features for a given dataset, either in terms of capturing the underlying data structure and distribution better, or with respect to the performance on a downstream task. Existing research in this area has largely focused on developing novel algorithms (in both supervised and unsupervised settings), proposing new evaluation metrics and frameworks, or benchmarking the performance of existing methods. In this work, we examine feature selection through an algorithmic design perspective. Conventional feature selection algorithms typically compute feature importance scores globally across the entire feature set and then select the top-ranked features in a single step. However, this approach raises a critical question: Can the presence of less informative (or noisy) features mask or obscure the true importance of other, more relevant features? In other words, would a recursive strategy, where features are removed one by one while re-evaluating importance at each step, yield different and potentially better results than the standard global ranking approach? To answer this question, we conduct an extensive empirical study using five diverse feature selection algorithms. We implement each algorithm under both the conventional global selection design and the greedy recursive elimination design. We then analyze the impact of this algorithmic choice, both individually for each method and collectively across all methods, on a range of standard feature selection evaluation metrics. The empirical evaluation results show that the greedy approach improves the overall feature selection quality almost consistently, albeit on the expense of higher computational cost, supporting our initial expectation that the curse of dimensionality also obscures the ways of mitigating it.", "arxiv_id": "2607.24145", "arxiv_url": "https://arxiv.org/abs/2607.24145", "authors": ["Muhammad Rajabinasab", "Arthur Zimek"], "brief": "\u672c\u6587\u4ece\u7b97\u6cd5\u8bbe\u8ba1\u89d2\u5ea6\u5b9e\u8bc1\u7814\u7a76\u7279\u5f81\u9009\u62e9\u7c92\u5ea6\uff0c\u5bf9\u6bd4\u4f20\u7edf\u4e00\u6b21\u6027\u5168\u5c40\u6392\u5e8f\u9009\u62e9\u4e0e\u9010\u6b65\u5220\u9664\u5e76\u91cd\u65b0\u8bc4\u4f30\u91cd\u8981\u6027\u7684\u8d2a\u5fc3\u9012\u5f52\u7b56\u7565\u3002\u57fa\u4e8e\u4e94\u7c7b\u7279\u5f81\u9009\u62e9\u7b97\u6cd5\u7684\u5b9e\u9a8c\u8868\u660e\uff0c\u9012\u5f52\u8d2a\u5fc3\u65b9\u6cd5\u51e0\u4e4e consistently \u63d0\u5347\u7279\u5f81\u9009\u62e9\u8d28\u91cf\uff0c\u4f46\u8ba1\u7b97\u6210\u672c\u66f4\u9ad8\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24145", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7279\u5f81\u9009\u62e9", "\u673a\u5668\u5b66\u4e60", "\u8d2a\u5fc3\u7b97\u6cd5", "\u5b9e\u8bc1\u7814\u7a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24145v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "An Empirical Study of Feature Selection Granularity", "tldr": "\u672c\u6587\u4ece\u7b97\u6cd5\u8bbe\u8ba1\u89d2\u5ea6\u5b9e\u8bc1\u7814\u7a76\u7279\u5f81\u9009\u62e9\u7c92\u5ea6\uff0c\u5bf9\u6bd4\u4f20\u7edf\u4e00\u6b21\u6027\u5168\u5c40\u6392\u5e8f\u9009\u62e9\u4e0e\u9010\u6b65\u5220\u9664\u5e76\u91cd\u65b0\u8bc4\u4f30\u91cd\u8981\u6027\u7684\u8d2a\u5fc3\u9012\u5f52\u7b56\u7565\u3002\u57fa\u4e8e\u4e94\u7c7b\u7279\u5f81\u9009\u62e9\u7b97\u6cd5\u7684\u5b9e\u9a8c\u8868\u660e\uff0c\u9012\u5f52\u8d2a\u5fc3\u65b9\u6cd5\u51e0\u4e4e consistently \u63d0\u5347\u7279\u5f81\u9009\u62e9\u8d28\u91cf\uff0c\u4f46\u8ba1\u7b97\u6210\u672c\u66f4\u9ad8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Classical alpha mining achieves strong risk-adjusted returns by combining many low-correlated predictive signals, yet deep learning stock-ranking methods typically produce a single alpha per stock, rely on increasingly complex architectures with diminishing gains, and obtain diversity only through separate models or implicit routing, without explicitly controlling inter-alpha correlation. We introduce MAPLE (Multi-Alpha Position-aware Listwise Ensembling), a backbone-agnostic framework that recovers this diversity principle within a single training pass. MAPLE combines a unified, capacity-scaled prediction head with an extreme-rank weighted listwise ranking loss and a diversity regularizer that explicitly penalizes pairwise correlation across alphas. Across four equity markets spanning the US, China, and Japan, MAPLE achieves the best average Sharpe and Calmar ratios among nine baselines, using up to 55x fewer parameters and 2.5x less training time, and generalizes across five backbone architectures with Sharpe and Calmar Ratio gains of 10-23% and 17-43%, respectively. Behavioral analysis further shows why each component works: the unified head already reduces inter-alpha correlation before any diversity loss is applied, and the extreme-rank loss lets diversity regularization improve rather than erode per-alpha ranking quality as capacity scaling sustains this balance at scale. These results show that principled loss design and capacity allocation, rather than architectural complexity, drive diverse and effective multi-alpha generation.", "arxiv_id": "2607.24131", "arxiv_url": "https://arxiv.org/abs/2607.24131", "authors": ["Yu-Chen Den", "Kuan-Yu Chen", "Kendro Vincent", "Tien-Hao Chang"], "brief": "MAPLE \u63d0\u51fa\u4e00\u79cd\u4e0e\u9aa8\u5e72\u6a21\u578b\u65e0\u5173\u7684\u591a Alpha \u751f\u6210\u6846\u67b6\uff0c\u5728\u5355\u6b21\u8bad\u7ec3\u4e2d\u901a\u8fc7\u7edf\u4e00\u9884\u6d4b\u5934\u3001\u6781\u7aef\u6392\u540d\u52a0\u6743\u7684 listwise \u6392\u5e8f\u635f\u5931\u548c\u663e\u5f0f\u76f8\u5173\u6027\u60e9\u7f5a\u6765\u751f\u6210\u4f4e\u76f8\u5173\u9884\u6d4b\u4fe1\u53f7\u3002\u5b83\u5728\u7f8e\u3001\u4e2d\u3001\u65e5\u56db\u4e2a\u80a1\u7968\u5e02\u573a\u4e0a\u4f18\u4e8e\u4e5d\u4e2a\u57fa\u7ebf\uff0c\u5e73\u5747 Sharpe \u548c Calmar \u66f4\u9ad8\uff0c\u540c\u65f6\u53c2\u6570\u6700\u591a\u51cf\u5c11 55 \u500d\u3001\u8bad\u7ec3\u65f6\u95f4\u51cf\u5c11 2.5 \u500d\u3002", "categories": ["cs.LG", "cs.CE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24131", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5316\u6295\u8d44", "\u6392\u5e8f\u5b66\u4e60", "\u96c6\u6210\u5b66\u4e60", "\u91d1\u878d\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24131v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MAPLE: Efficient and Diverse Multi-Alpha Generation for Portfolio Construction", "tldr": "MAPLE \u63d0\u51fa\u4e00\u79cd\u4e0e\u9aa8\u5e72\u6a21\u578b\u65e0\u5173\u7684\u591a Alpha \u751f\u6210\u6846\u67b6\uff0c\u5728\u5355\u6b21\u8bad\u7ec3\u4e2d\u901a\u8fc7\u7edf\u4e00\u9884\u6d4b\u5934\u3001\u6781\u7aef\u6392\u540d\u52a0\u6743\u7684 listwise \u6392\u5e8f\u635f\u5931\u548c\u663e\u5f0f\u76f8\u5173\u6027\u60e9\u7f5a\u6765\u751f\u6210\u4f4e\u76f8\u5173\u9884\u6d4b\u4fe1\u53f7\u3002\u5b83\u5728\u7f8e\u3001\u4e2d\u3001\u65e5\u56db\u4e2a\u80a1\u7968\u5e02\u573a\u4e0a\u4f18\u4e8e\u4e5d\u4e2a\u57fa\u7ebf\uff0c\u5e73\u5747 Sharpe \u548c Calmar \u66f4\u9ad8\uff0c\u540c\u65f6\u53c2\u6570\u6700\u591a\u51cf\u5c11 55 \u500d\u3001\u8bad\u7ec3\u65f6\u95f4\u51cf\u5c11 2.5 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
