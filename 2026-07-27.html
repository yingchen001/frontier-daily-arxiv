ngface.co/papers/2607.24583", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9762\u5411\u975e\u5171\u8f6d\u540e\u9a8c\u7684\u5927\u89c4\u6a21\u8d1d\u53f6\u65af\u975e\u53c2\u5b66\u4e60\uff0c\u53ea\u8981\u6c42\u53d8\u5206\u540e\u9a8c\u53ef\u5fae\uff0c\u800c\u4e0d\u4f9d\u8d56\u5171\u8f6d\u6027\u6216\u95ed\u5f0f\u53d8\u5206\u671f\u671b", "\u5f15\u5165\u81ea\u9002\u5e94\u6b65\u957f\u673a\u5236\u66ff\u4ee3\u4f20\u7edf SVI \u7684\u8870\u51cf\u6b65\u957f\uff0c\u4ee5\u63d0\u5347\u968f\u673a\u4f18\u5316\u4e2d\u7684\u5b66\u4e60\u6548\u7387\u4e0e\u7a33\u5b9a\u6027", "\u5728 MIT67\u3001SUN397 \u7b49\u5927\u7c7b\u522b\u6570\u636e\u96c6\u4e0a\u7ed3\u5408 ResNet \u7279\u5f81\u8fdb\u884c\u805a\u7c7b\uff0c\u6027\u80fd\u8fbe\u5230\u6216\u8d85\u8fc7\u591a\u79cd\u6df1\u5ea6\u805a\u7c7b\u65b9\u6cd5"], "keywords": ["\u8d1d\u53f6\u65af\u975e\u53c2", "\u53d8\u5206\u63a8\u65ad", "\u805a\u7c7b", "\u968f\u673a\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24583v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "PYPM-GGD: Pitman-Yor Process Mixture with Generalized Gaussian Density using ADAM", "tldr": "\u7528Adam\u6269\u5c55\u975e\u5171\u8f6d\u8d1d\u53f6\u65af\u975e\u53c2\u6df7\u5408\u5b66\u4e60", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PYPM-GGD\uff0c\u4e00\u79cd\u7ed3\u5408 Pitman-Yor \u8fc7\u7a0b\u6df7\u5408\u6a21\u578b\u4e0e\u5e7f\u4e49\u9ad8\u65af\u5bc6\u5ea6\u7684\u5927\u89c4\u6a21\u8d1d\u53f6\u65af\u975e\u53c2\u5b66\u4e60\u65b9\u6cd5\u3002\u5b83\u7528\u5e38\u6b65\u957f\u968f\u673a\u68af\u5ea6\u4e0a\u5347\u4e0e Adam \u5f0f\u81ea\u9002\u5e94\u6b65\u957f\u5904\u7406\u975e\u5171\u8f6d\u53d8\u5206\u540e\u9a8c\uff0c\u65e0\u9700\u95ed\u5f0f\u671f\u671b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u975e\u5171\u8f6d\u8d1d\u53f6\u65af\u975e\u53c2\u6a21\u578b\u63a8\u8fdb\u5230\u66f4\u5927\u89c4\u6a21\u3001\u66f4\u590d\u6742\u7684\u89c6\u89c9\u805a\u7c7b\u573a\u666f\uff0c\u7f13\u89e3\u4e86\u4f20\u7edf SVI \u5bf9\u5171\u8f6d\u7ed3\u6784\u7684\u4f9d\u8d56\uff0c\u5177\u6709\u65b9\u6cd5\u8bba\u548c\u5e94\u7528\u4e0a\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "In the Big Data era, the scalability of clustering algorithms constitutes a key challenge. Traditional density-based methods (e.g., DBSCAN) offer robustness to noise and the ability to detect non-linear clusters, yet their quadratic time complexity $O(N^2)$ drastically limits their applicability. Conversely, partitional algorithms (e.g., K-Means), with their linear complexity $O(N)$, impose sphericity on the resulting groups and fail in the presence of outliers. This paper presents K-SCAN -- a novel hybrid algorithm that optimizes this trade-off. The method integrates preliminary vector quantization (stochastic Mini-Batch K-Means) to extract a reduced set of weighted micro-clusters, followed by a subsequent density-based structural analysis. Empirical evaluation on datasets of up to $10^6$ samples confirms the linear computational complexity of the proposed solution. K-SCAN achieves more than a 3-fold speed-up over the hierarchical BIRCH algorithm, avoiding the costly management of tree-based structures. The method precisely identifies non-linear manifolds while maintaining structural stability (Adjusted Rand Index \u003e 0.99), even with noise levels reaching 55\\% of the data volume. The main limitation of the proposed algorithm, which could not be fully eliminated in the present study, remains its susceptibility to over-smoothing and its difficulty in separating clusters with highly heterogeneous local density. In complex visual spaces, this can lead to the loss of the finest topological details.", "arxiv_id": "2607.24537", "arxiv_url": "https://arxiv.org/abs/2607.24537", "authors": ["Filip Kosiorowski", "Grzegorz Sroka"], "brief": "\u8bba\u6587\u63d0\u51fa K-SCAN\uff0c\u4e00\u79cd\u6df7\u5408\u805a\u7c7b\u7b97\u6cd5\uff1a\u5148\u7528\u968f\u673a Mini-Batch K-Means \u505a\u5411\u91cf\u91cf\u5316\u5f97\u5230\u52a0\u6743\u5fae\u7c07\uff0c\u518d\u5728\u5fae\u7c07\u5c42\u9762\u8fdb\u884c\u5bc6\u5ea6\u7ed3\u6784\u5206\u6790\u3002\u5b83\u65e8\u5728\u4fdd\u7559 DBSCAN \u8bc6\u522b\u975e\u7ebf\u6027\u7c07\u548c\u6297\u566a\u58f0\u7684\u80fd\u529b\uff0c\u540c\u65f6\u63a5\u8fd1 K-Means \u7684\u7ebf\u6027\u590d\u6742\u5ea6\u3002", "categories": ["cs.LG", "cs.NE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24537", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5fae\u7c07\u538b\u7f29\u663e\u8457\u964d\u4f4e\u5bc6\u5ea6\u5206\u6790\u6210\u672c\uff0c\u5b9e\u9a8c\u5728\u6700\u9ad8 100 \u4e07\u6837\u672c\u4e0a\u9a8c\u8bc1\u8fd1\u4f3c\u7ebf\u6027\u8ba1\u7b97\u590d\u6742\u5ea6", "\u76f8\u6bd4\u5c42\u6b21\u5316 BIRCH \u7b97\u6cd5\u901f\u5ea6\u63d0\u5347\u8d85\u8fc7 3 \u500d\uff0c\u4e14\u907f\u514d\u7ef4\u62a4\u6811\u7ed3\u6784\u7684\u989d\u5916\u5f00\u9500", "\u5728\u566a\u58f0\u5360\u6bd4\u6700\u9ad8 55% \u65f6\u4ecd\u4fdd\u6301\u8f83\u9ad8\u7ed3\u6784\u7a33\u5b9a\u6027\uff0cAdjusted Rand Index \u8d85\u8fc7 0.99"], "keywords": ["\u805a\u7c7b\u7b97\u6cd5", "\u5bc6\u5ea6\u805a\u7c7b", "\u5927\u89c4\u6a21\u5b66\u4e60", "\u65e0\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24537v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "The K-SCAN Clustering Algorithm", "tldr": "K-SCAN\u517c\u987e\u5bc6\u5ea6\u805a\u7c7b\u5f62\u72b6\u4e0e\u7ebf\u6027\u6269\u5c55\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa K-SCAN\uff0c\u4e00\u79cd\u6df7\u5408\u805a\u7c7b\u7b97\u6cd5\uff1a\u5148\u7528\u968f\u673a Mini-Batch K-Means \u505a\u5411\u91cf\u91cf\u5316\u5f97\u5230\u52a0\u6743\u5fae\u7c07\uff0c\u518d\u5728\u5fae\u7c07\u5c42\u9762\u8fdb\u884c\u5bc6\u5ea6\u7ed3\u6784\u5206\u6790\u3002\u5b83\u65e8\u5728\u4fdd\u7559 DBSCAN \u8bc6\u522b\u975e\u7ebf\u6027\u7c07\u548c\u6297\u566a\u58f0\u7684\u80fd\u529b\uff0c\u540c\u65f6\u63a5\u8fd1 K-Means \u7684\u7ebf\u6027\u590d\u6742\u5ea6\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9762\u5411\u5927\u89c4\u6a21\u805a\u7c7b\u4e2d\u201c\u53ef\u6269\u5c55\u6027\u3001\u975e\u7403\u5f62\u7c07\u8bc6\u522b\u3001\u6297\u566a\u58f0\u201d\u4e4b\u95f4\u7684\u7ecf\u5178\u6743\u8861\uff0c\u63d0\u4f9b\u4e86\u4e00\u4e2a\u5de5\u7a0b\u4e0a\u66f4\u8f7b\u91cf\u7684\u6298\u4e2d\u65b9\u6848\uff1b\u4f46\u5bf9\u5c40\u90e8\u5bc6\u5ea6\u5dee\u5f02\u5f88\u5927\u7684\u7c07\u548c\u7ec6\u7c92\u5ea6\u62d3\u6251\u7ed3\u6784\u4ecd\u53ef\u80fd\u8fc7\u5ea6\u5e73\u6ed1\u3002"}, {"abstract": "Recent years have seen a rapid expansion in the production of large-scale geospatial maps derived from Earth observation (EO) data, driven largely by advances in machine learning (ML) and large computing infrastructure. Although the barrier to generating such maps has dropped substantially, established best practices have yet to emerge, and design decisions made early in the pipeline can quietly propagate errors into the final product. Producing a technically sound and scientifically credible product remains challenging. Choices made at every stage are tightly coupled: preprocessing decisions shape the training signal, dataset design governs what the model can learn and how reliably its performance can be assessed, and global-scale inference introduces engineering challenges in compute and data access at scale, as well as artifact mitigation. Furthermore, uncertainty quantification and independent map validation each require dedicated methodological attention that is often underestimated. This paper presents a concise, end-to-end account of the recommended practices spanning the pipeline from satellite data to an operational map product. We organize the discussion around six interconnected themes: the EO data infrastructure landscape, data selection and preprocessing, ML dataset construction and model training, uncertainty quantification, map production and distribution, and validation. This paper is a condensed version of a longer guide that provides greater depth across all stages, accessible online at ghjuliasialelli.github.io/MLEO-Maps/.", "arxiv_id": "2607.24532", "arxiv_url": "https://arxiv.org/abs/2607.24532", "authors": ["Ghjulia Sialelli", "Robin Young", "Yuchang Jiang", "Cesar Aybar", "Linus Scheibenreif", "Damien Robert", "Clemens Mosig", "Adam J. Stewart", "Jan D. Wegner", "Aleksis Pirinen", "Olof Mogren", "Konrad Schindler"], "brief": "\u672c\u6587\u603b\u7ed3\u4ece\u536b\u661f\u6570\u636e\u5230\u53ef\u8fd0\u8425\u5730\u7406\u7a7a\u95f4\u5730\u56fe\u4ea7\u54c1\u7684\u7aef\u5230\u7aef\u6d41\u7a0b\u6700\u4f73\u5b9e\u8df5\uff0c\u8986\u76d6\u6570\u636e\u57fa\u7840\u8bbe\u65bd\u3001\u9884\u5904\u7406\u3001\u6570\u636e\u96c6\u6784\u5efa\u3001\u6a21\u578b\u8bad\u7ec3\u3001\u4e0d\u786e\u5b9a\u6027\u3001\u751f\u4ea7\u5206\u53d1\u4e0e\u9a8c\u8bc1\u3002\u5b83\u5f3a\u8c03\u65e9\u671f\u8bbe\u8ba1\u9009\u62e9\u4f1a\u5728\u7ba1\u7ebf\u4e2d\u4f20\u64ad\u8bef\u5dee\uff0c\u9700\u8981\u7cfb\u7edf\u5316\u65b9\u6cd5\u4fdd\u969c\u5730\u56fe\u4ea7\u54c1\u7684\u6280\u672f\u53ef\u9760\u6027\u4e0e\u79d1\u5b66\u53ef\u4fe1\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24532", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u68b3\u7406\u5927\u89c4\u6a21\u5730\u7403\u89c2\u6d4b\u5236\u56fe\u7684\u516d\u5927\u5173\u952e\u73af\u8282\uff1a\u6570\u636e\u57fa\u7840\u8bbe\u65bd\u3001\u6570\u636e\u9009\u62e9\u4e0e\u9884\u5904\u7406\u3001ML\u6570\u636e\u96c6\u4e0e\u8bad\u7ec3\u3001\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\u3001\u5730\u56fe\u751f\u4ea7\u5206\u53d1\u3001\u72ec\u7acb\u9a8c\u8bc1", "\u5f3a\u8c03\u9884\u5904\u7406\u3001\u91c7\u6837\u8bbe\u8ba1\u3001\u8bad\u7ec3\u6807\u7b7e\u4e0e\u8bc4\u4f30\u65b9\u5f0f\u4e4b\u95f4\u7684\u5f3a\u8026\u5408\u5173\u7cfb\uff0c\u907f\u514d\u8bef 709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Rotary position embeddings (RoPE) modify attention scores through position-dependent rotations, but their effect on normalized token dynamics is not captured by the vanilla spherical self-attention model. We study the continuous-time dynamics obtained when queries and keys are rotated while values remain on the unit sphere. The resulting attention kernel is reversible and admits a sharp uniform softmax floor, yet the natural RoPE interaction energy has derivatives of both signs within one fixed nontrivial system. Every consensus state remains an equilibrium, and its transverse linearization is a reversible Markov operator whose kernel depends on the consensus point through its energy across RoPE planes. On a resonant single-frequency ring we derive an exact Bessel-aliasing spectrum, including non-coprime frequencies and the correct fixed-ring large-$\u03b2$ asymptotics. Globally, closed hemispheres are invariant, while pairwise non-obtuse configurations and strict open semicircles contract with explicit half-angle and single-point tail bounds. These regional estimates instantiate a kernel-generic positivity principle with the sharp RoPE softmax floor. RoPE also selects an explicit score-flattening twisted branch; the generic resonant family is non-hyperbolic and linearly unstable, whereas an odd antipodal family becomes a hyperbolic saddle after quotienting global rotation. In multiple dimensions, the local consensus gap can depend non-monotonically on the allocation of energy across frequency planes, so no universal ordering by frequency is valid. Independent matrix, finite-difference, and nonlinear-flow computations cross-check the theorem boundaries and the reported constants.", "arxiv_id": "2607.24502", "arxiv_url": "https://arxiv.org/abs/2607.24502", "authors": ["Hao Ye"], "brief": "\u672c\u6587\u7814\u7a76\u5e26\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801\uff08RoPE\uff09\u7684\u8fde\u7eed\u65f6\u95f4\u81ea\u6ce8\u610f\u529b\u52a8\u529b\u5b66\uff0c\u5176\u4e2dquery/key\u88ab\u4f4d\u7f6e\u76f8\u5173\u65cb\u8f6c\u800cvalue\u7ea6\u675f\u5728\u5355\u4f4d\u7403\u9762\u4e0a\u3002\u8bba\u6587\u523b\u753b\u4e86\u5171\u8bc6\u6001\u3001\u626d\u66f2\u6001\u3001\u7a33\u5b9a\u6027\u8c31\u4ee5\u53ca\u533a\u57df\u6536\u655b\u901f\u7387\u7b49\u6570\u5b66\u6027\u8d28\u3002", "categories": ["math.DS", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24502", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660eRoPE\u6ce8\u610f\u529b\u6838\u5177\u6709\u53ef\u9006\u6027\u548c\u5c16\u9510\u7684softmax\u4e0b\u754c\uff0c\u4f46\u5bf9\u5e94\u76f8\u4e92\u4f5c\u7528\u80fd\u91cf\u7684\u5bfc\u6570\u53ef\u5728\u540c\u4e00\u7cfb\u7edf\u4e2d\u5448\u73b0\u6b63\u8d1f\u53d8\u5316", "\u5728\u5355\u9891\u5171\u632f\u73af\u4e0a\u63a8\u5bfc\u7cbe\u786e\u7684Bessel\u6df7\u53e0\u8c31\uff0c\u5e76\u7ed9\u51fa\u56fa\u5b9a\u73af\u5927\u03b2\u6781\u9650\u4e0b\u7684\u6b63\u786e\u6e10\u8fd1\u5f62\u5f0f", "\u8bc1\u660e\u95ed\u534a\u7403\u4e0d\u53d8\u6027\uff0c\u5e76\u4e3a\u975e\u949d\u89d2\u914d\u7f6e\u548c\u4e25\u683c\u5f00\u534a\u5706\u914d\u7f6e\u7ed9\u51fa\u663e\u5f0f\u6536\u7f29\u4e0e\u5c3e\u754c"], "keywords": ["\u81ea\u6ce8\u610f\u529b", "\u4f4d\u7f6e\u7f16\u7801", "\u52a8\u529b\u7cfb\u7edf", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24502v1", "published_at": "2026-07-27", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Self-Attention Dynamics with Rotary Position Embeddings: Twisted States and Explicit Consensus Rates on the Sphere", "tldr": "\u89e3\u6790RoPE\u81ea\u6ce8\u610f\u529b\u7403\u9762\u52a8\u529b\u5b66", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u5e26\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801\uff08RoPE\uff09\u7684\u8fde\u7eed\u65f6\u95f4\u81ea\u6ce8\u610f\u529b\u52a8\u529b\u5b66\uff0c\u5176\u4e2dquery/key\u88ab\u4f4d\u7f6e\u76f8\u5173\u65cb\u8f6c\u800cvalue\u7ea6\u675f\u5728\u5355\u4f4d\u7403\u9762\u4e0a\u3002\u8bba\u6587\u523b\u753b\u4e86\u5171\u8bc6\u6001\u3001\u626d\u66f2\u6001\u3001\u7a33\u5b9a\u6027\u8c31\u4ee5\u53ca\u533a\u57df\u6536\u655b\u901f\u7387\u7b49\u6570\u5b66\u6027\u8d28\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aRoPE\u5728\u5f52\u4e00\u5316\u81ea\u6ce8\u610f\u529b\u52a8\u529b\u5b66\u4e2d\u7684\u4f5c\u7528\u63d0\u4f9b\u4e86\u4e25\u683c\u6570\u5b66\u523b\u753b\uff0c\u63ed\u793a\u4e86\u5171\u8bc6\u3001\u626d\u66f2\u6001\u3001\u4e0d\u7a33\u5b9a\u6027\u548c\u9891\u7387\u80fd\u91cf\u5206\u914d\u7684\u975e\u5355\u8c03\u5f71\u54cd\uff0c\u6709\u52a9\u4e8e\u7406\u89e3Transformer\u4f4d\u7f6e\u7f16\u7801\u7684\u52a8\u529b\u5b66\u673a\u5236\u3002"}, {"abstract": "Model-based active flow control requires predictive models that are accurate, stable, and fast enough for real-time optimisation. In controlled wake flows, this is often achieved through Reduced-Order Models (ROMs) that first compress high-dimensional velocity snapshots into a latent space and then learn a time- stepping predictor for the dynamics in the latent space. Here, we study how the choice of the spatial encoder affects the predictability of the resulting latent coordinates for wake flows under control inputs. Using two actuated 2D wake configurations, a simplified truck wake and the fluidic pinball, we compare Proper Orthogonal Decomposition (POD) against nonlinear Convolutional Autoencoders (CAEs) and two types of variational autoencoders for compression, and evaluate several temporal predictors based on Long Short-Term Memory networks. CAEs achieve higher compression efficiency and sharper short-term reconstructions, but they produce latent dynamics that are more irregular and with broadband spectral content. As a consequence, long-horizon forecasts degrade faster and show a higher probability of catastrophic divergence than POD-based models. POD yields smoother latent trajectories that are easier to learn and extrapolate, leading to more reliable predictions beyond the short- term regime. These results reveal a clear trade-off between compactness and forecast accuracy, and suggest that the stability of the latent dynamics prediction can outweigh maximal compression. This is particularly relevant for control strategies rooted in forecasts of the dynamics, such as model predictive control and reinforcement learning. The findings provide practical guidance for designing actuation-aware, hardware-feasible predictive ROMs for real-time flow control.", "arxiv_id": "2607.24569", "arxiv_url": "https://arxiv.org/abs/2607.24569", "authors": ["Alberto Solera-Rico", "Patricia Garc\u00eda-Caspue\u00f1as", "Carlos Sanmiguel Vila", "Stefano Discetti"], "brief": "\u672c\u6587\u7814\u7a76\u53d7\u63a7\u5c3e\u6d41\u4e2d\u6570\u636e\u9a71\u52a8\u6f5c\u7a7a\u95f4\u964d\u9636\u6a21\u578b\u7684\u7a7a\u95f4\u7f16\u7801\u5668\u9009\u62e9\u5982\u4f55\u5f71\u54cd\u957f\u671f\u9884\u6d4b\u80fd\u529b\u3002\u4f5c\u8005\u5728\u7b80\u5316\u5361\u8f66\u5c3e\u6d41\u548cfluidic pinball\u4e24\u7c7b\u4e8c\u7ef4\u53d7\u63a7\u6d41\u52a8\u4e0a\uff0c\u5bf9\u6bd4POD\u3001\u5377\u79ef\u81ea\u7f16\u7801\u5668\u548c\u53d8\u5206\u81ea\u7f16\u7801\u5668\uff0c\u5e76\u7528LSTM\u7c7b\u6a21\u578b\u5b66\u4e60\u6f5c\u7a7a\u95f4\u52a8\u529b\u5b66\u3002", "categories": ["physics.flu-dyn", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24569", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["CAE\u5177\u5907\u66f4\u9ad8\u538b\u7f29\u6548\u7387\u548c\u66f4\u6e05\u6670\u7684\u77ed\u671f\u91cd\u6784\u6548\u679c\uff0c\u4f46\u5176\u6f5c\u53d8\u91cf\u52a8\u529b\u5b66\u66f4\u4e0d\u89c4\u5219\u3001\u9891\u8c31\u66f4\u5bbd\u3002", "POD\u4ea7\u751f\u7684\u6f5c\u7a7a\u95f4\u8f68\u8ff9\u66f4\u5e73\u6ed1\uff0c\u66f4\u6613\u88ab\u65f6\u95f4\u9884\u6d4b\u6a21\u578b\u5b66\u4e60\u548c\u5916\u63a8\uff0c\u957f\u671f\u9884\u6d4b\u66f4\u53ef\u9760\u3002", "\u5b9e\u9a8c\u663e\u793a\u6700\u5927\u538b\u7f29\u7387\u4e0e\u9884\u6d4b\u7a33\u5b9a\u6027\u4e4b\u95f4\u5b58\u5728\u660e\u786e\u6743\u8861\uff0c\u957f\u671f\u9884\u6d4b\u4e2dCAE\u6a21\u578b\u66f4\u5bb9\u6613\u51fa\u73b0\u707e\u96be\u6027\u53d1\u6563\u3002"], "keywords": ["\u6d41\u4f53\u529b\u5b66", "\u964d\u9636\u6a21\u578b", "\u81ea\u7f16\u7801\u5668", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24569v1", "published_at": "2026-07-27", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "The balance between compactness and forecast accuracy of data-driven latent-space reduced-order models in controlled wake flows", "tldr": "\u6d41\u52a8ROM\u4e2dPOD\u9884\u6d4b\u66f4\u7a33\uff0cCAE\u538b\u7f29\u66f4\u5f3a\u4f46\u6613\u53d1\u6563", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u53d7\u63a7\u5c3e\u6d41\u4e2d\u6570\u636e\u9a71\u52a8\u6f5c\u7a7a\u95f4\u964d\u9636\u6a21\u578b\u7684\u7a7a\u95f4\u7f16\u7801\u5668\u9009\u62e9\u5982\u4f55\u5f71\u54cd\u957f\u671f\u9884\u6d4b\u80fd\u529b\u3002\u4f5c\u8005\u5728\u7b80\u5316\u5361\u8f66\u5c3e\u6d41\u548cfluidic pinball\u4e24\u7c7b\u4e8c\u7ef4\u53d7\u63a7\u6d41\u52a8\u4e0a\uff0c\u5bf9\u6bd4POD\u3001\u5377\u79ef\u81ea\u7f16\u7801\u5668\u548c\u53d8\u5206\u81ea\u7f16\u7801\u5668\uff0c\u5e76\u7528LSTM\u7c7b\u6a21\u578b\u5b66\u4e60\u6f5c\u7a7a\u95f4\u52a8\u529b\u5b66\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192\u6d41\u52a8\u63a7\u5236\u4e2d\u7684ROM\u8bbe\u8ba1\u4e0d\u80fd\u53ea\u8ffd\u6c42\u4f4e\u7ef4\u548c\u91cd\u6784\u7cbe\u5ea6\uff0c\u6f5c\u7a7a\u95f4\u52a8\u529b\u5b66\u7684\u53ef\u9884\u6d4b\u6027\u53ef\u80fd\u66f4\u5173\u952e\uff1b\u5bf9\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u548c\u5f3a\u5316\u5b66\u4e60\u9a71\u52a8\u7684\u5b9e\u65f6\u4e3b\u52a8\u6d41\u52a8\u63a7\u5236\u5177\u6709\u5b9e\u7528\u6307\u5bfc\u4ef7\u503c\u3002"}, {"abstract": "Learned feature reweighting can improve automatic modulation classification (AMC) in software, but the same operation introduces additional arithmetic and latency when implemented on an FPGA. This work measures that trade-off in a compact fixed-point classifier using 24 sparse DFT-energy features, 8 phase/statistical features, and a 32-to-128-to-11 multilayer perceptron. A second architecture inserts a learned 32-element, 8-bit, input-dependent gate before the classifier. Gated and ungated models are trained using post-training quantization (PTQ) and quantization-aware training (QAT) with two matched training seeds. The resulting eight checkpoints are compiled independently for an Intel Cyclone V FPGA and evaluated over 352,000 physical-board classifications. Ungated models achieve higher test accuracy in all four matched gate comparisons, with mean gated-minus-ungated differences of -0.784 percentage points under PTQ and -0.616 percentage points under QAT. The effect of QAT changes direction between the two training seeds. In hardware, the gate adds an average of 1,318 adaptive logic modules (ALMs), 1,557 registers, 4 DSP blocks, and 3,140 processing cycles. All 352,000 board predictions agree exactly with an independent integer reference, and 3,760 captured intermediate values from one training seed also match. For this feature representation and implementation, learned gating increases FPGA cost without improving classification accuracy.", "arxiv_id": "2607.24568", "arxiv_url": "https://arxiv.org/abs/2607.24568", "authors": ["Gawthaman Senthilvelan", "Luthira Abeykoon"], "brief": "\u672c\u6587\u5bf9\u4e00\u4e2a\u5b9a\u70b9\u5085\u91cc\u53f6\u7279\u5f81\u81ea\u52a8\u8c03\u5236\u5206\u7c7b\u5668\u8fdb\u884c\u4f4d\u7cbe\u786eFPGA\u8bc4\u4f30\uff0c\u6bd4\u8f83\u52a0\u516532\u7ef4\u8f93\u5165\u76f8\u5173\u5b66\u4e60\u95e8\u63a7\u524d\u540e\u7684\u7cbe\u5ea6\u3001\u8d44\u6e90\u4e0e\u5ef6\u8fdf\u3002\u5b9e\u9a8c\u8986\u76d6PTQ\u4e0eQAT\u91cf\u5316\u3001\u4e24\u7ec4\u8bad\u7ec3\u79cd\u5b50\uff0c\u5e76\u5728Intel Cyclone V\u5b9e\u677f\u4e0a\u5b8c\u621035.2\u4e07\u6b21\u5206\u7c7b\u9a8c\u8bc1\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24568", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u6a21\u578b\u4f7f\u752824\u4e2a\u7a00\u758fDFT\u80fd\u91cf\u7279\u5f81\u30018\u4e2a\u76f8\u4f4d/\u7edf\u8ba1\u7279\u5f81\uff0c\u4ee5\u53ca32-128-11\u7684\u591a\u5c42\u611f\u77e5\u673a\u5206\u7c7b\u5668\u3002", "\u52a0\u51658\u4f4d\u5b66\u4e60\u5f0f\u7279\u5f81\u95e8\u63a7\u540e\uff0c\u5728\u56db\u7ec4\u5339\u914d\u6bd4\u8f83\u4e2d\u7cbe\u5ea6\u5747\u4f4e\u4e8e\u65e0\u95e8\u63a7\u6a21\u578b\uff1aPTQ\u5e73\u5747\u4e0b\u964d0.784\u4e2a\u767e\u5206\u70b9\uff0cQAT\u5e73\u5747\u4e0b\u964d0.616\u4e2a\u767e\u5206\u70b9\u3002", "\u95e8\u63a7\u5e73\u5747\u989d\u5916\u6d88\u80171,318\u4e2aALM\u30011,557\u4e2a\u5bc4\u5b58\u5668\u30014\u4e2aDSP\u548c3,140\u4e2a\u5904\u7406\u5468\u671f\uff1b\u6240\u670935.2\u4e07\u6b21\u677f\u4e0a\u9884\u6d4b\u4e0e\u6574\u6570\u53c2\u8003\u5b8c\u5168\u4e00\u81f4\u3002"], "keywords": ["FPGA", "\u91cf\u5316", "\u8c03\u5236\u5206\u7c7b", "\u8fb9\u7f18\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24568v1", "published_at": "2026-07-27", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Bit-Accurate FPGA Evaluation of Learned Feature Gating in a Fixed-Point Fourier-Feature Automatic Modulation Classifier", "tldr": "\u5b66\u4e60\u5f0f\u7279\u5f81\u95e8\u63a7\u5728FPGA\u4e0a\u589e\u8017\u4e0d\u589e\u51c6", "upvotes": 0, "what_it_is": "\u672c\u6587\u5bf9\u4e00\u4e2a\u5b9a\u70b9\u5085\u91cc\u53f6\u7279\u5f81\u81ea\u52a8\u8c03\u5236\u5206\u7c7b\u5668\u8fdb\u884c\u4f4d\u7cbe\u786eFPGA\u8bc4\u4f30\uff0c\u6bd4\u8f83\u52a0\u516532\u7ef4\u8f93\u5165\u76f8\u5173\u5b66\u4e60\u95e8\u63a7\u524d\u540e\u7684\u7cbe\u5ea6\u3001\u8d44\u6e90\u4e0e\u5ef6\u8fdf\u3002\u5b9e\u9a8c\u8986\u76d6PTQ\u4e0eQAT\u91cf\u5316\u3001\u4e24\u7ec4\u8bad\u7ec3\u79cd\u5b50\uff0c\u5e76\u5728Intel Cyclone V\u5b9e\u677f\u4e0a\u5b8c\u621035.2\u4e07\u6b21\u5206\u7c7b\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u5c11\u89c1\u7684\u4f4d\u7cbe\u786e\u7269\u7406FPGA\u5b9e\u6d4b\u8bc1\u636e\uff0c\u8bf4\u660e\u8f6f\u4ef6\u4e2d\u770b\u4f3c\u6709\u6548\u7684\u5b66\u4e60\u5f0f\u7279\u5f81\u91cd\u52a0\u6743\u5728\u8d44\u6e90\u53d7\u9650\u786c\u4ef6\u4e0a\u53ef\u80fd\u4e0d\u5212\u7b97\uff0c\u5bf9\u8fb9\u7f18\u65e0\u7ebf\u7535\u5206\u7c7b\u6a21\u578b\u90e8\u7f72\u6709\u76f4\u63a5\u5de5\u7a0b\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Learning from minimal human supervision is a long-standing goal in medical image analysis, where dense expert annotations are costly. We study retinal vessel segmentation in an extreme semi-supervised setting with one annotated image and a pool of unlabeled images. We propose ESRVS, which selects a representative reference image for manual annotation and transfers vessel cues using target-domain-adapted DINOv3 features. ESRVS constructs a multi granular vessel prototype, combines prototype-similarity maps with a physics-inspired prior to generate initial pseudo-labels, and refines the transferred supervision through weighted pseudo-label training and adversarial refinement. Across eight public datasets, ESRVS achieves the best Dice and clDice on six datasets, and the best HD95 on all eight datasets among the compared semi-supervised methods, although those methods use 10 to 20% labeled data. With Mask2Former, ESRVS retains on average 93.7% of fully supervised Dice and 95.1% of fully supervised clDice. These results demonstrate the potential of foundation-model label propagation for highly label-efficient retinal vessel segmentation. Code is available at https://github.com/IAANNH/ESRVS.", "arxiv_id": "2607.24453", "arxiv_url": "https://arxiv.org/abs/2607.24453", "authors": ["Mingzhi Xu", "Yizhe Zhang"], "brief": "ESRVS\u9762\u5411\u4ec5\u6709\u4e00\u5f20\u6807\u6ce8\u56fe\u50cf\u7684\u6781\u7aef\u534a\u76d1\u7763\u89c6\u7f51\u819c\u8840\u7ba1\u5206\u5272\uff0c\u5229\u7528\u76ee\u6807\u57df\u9002\u914d\u7684DINOv3\u7279\u5f81\u8fdb\u884c\u6807\u7b7e\u4f20\u64ad\uff0c\u5e76\u7ed3\u5408\u591a\u7c92\u5ea6\u8840\u7ba1\u539f\u578b\u3001\u7269\u7406\u5148\u9a8c\u3001\u52a0\u6743\u4f2a\u6807\u7b7e\u8bad\u7ec3\u548c\u5bf9\u6297\u5f0f\u7ec6\u5316\u3002\u5b83\u57288\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u4e0a\u8868\u73b0\u5f3a\u52b2\uff0c\u591a\u9879\u6307\u6807\u8d85\u8fc7\u4f7f\u752810%\u523020%\u6807\u6ce8\u6570\u636e\u7684\u534a\u76d1\u7763\u65b9\u6cd5\uff0c\u5e76\u63a5\u8fd1\u5168\u76d1\u7763\u6027\u80fd\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24453", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u534a\u76d1\u7763\u5b66\u4e60", "\u57fa\u7840\u6a21\u578b", "\u4f2a\u6807\u7b7e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24453v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ESRVS: Extreme Semi-Supervised Retinal Vessel Segmentation with a Single Annotated Image", "tldr": "ESRVS\u9762\u5411\u4ec5\u6709\u4e00\u5f20\u6807\u6ce8\u56fe\u50cf\u7684\u6781\u7aef\u534a\u76d1\u7763\u89c6\u7f51\u819c\u8840\u7ba1\u5206\u5272\uff0c\u5229\u7528\u76ee\u6807\u57df\u9002\u914d\u7684DINOv3\u7279\u5f81\u8fdb\u884c\u6807\u7b7e\u4f20\u64ad\uff0c\u5e76\u7ed3\u5408\u591a\u7c92\u5ea6\u8840\u7ba1\u539f\u578b\u3001\u7269\u7406\u5148\u9a8c\u3001\u52a0\u6743\u4f2a\u6807\u7b7e\u8bad\u7ec3\u548c\u5bf9\u6297\u5f0f\u7ec6\u5316\u3002\u5b83\u57288\u4e2a\u516c\u5f00\u6570\u636e\u96c6\u4e0a\u8868\u73b0\u5f3a\u52b2\uff0c\u591a\u9879\u6307\u6807\u8d85\u8fc7\u4f7f\u752810%\u523020%\u6807\u6ce8\u6570\u636e\u7684\u534a\u76d1\u7763\u65b9\u6cd5\uff0c\u5e76\u63a5\u8fd1\u5168\u76d1\u7763\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language models (VLMs) deployed on consumer hardware must decide when to answer and when to defer, and that decision depends on having a confidence signal that tracks correctness. A practitioner with a fixed memory budget faces a choice between a small model at full precision, the same small model quantized, and a larger model quantized into the same footprint -- three configurations that push the confidence signal in opposing directions. We measure, on identical inputs, how model scale and 4-bit quantization affect two confidence signals in the Qwen2-VL family: the confidence a model states in natural language, and its own mean token probability over the answer it generates. Across 5,700 predictions spanning six realistic photographic degradations at three severities, we find that scale sharply improves the model\u0027s internal uncertainty signal (mean error-detection AUROC 0.80 to 0.98 from 2B to 7B) while its verbalized confidence stays weak and often at chance (mean 0.61 to 0.69): the gap between what the model knows and what it says widens rather than closes with size. We find that 4-bit quantization is nearly free for accuracy (-1.6 points) but expensive for the confidence signal (internal AUROC 0.95 to 0.80, and the verbalized-confidence parse rate collapses from 99% to 64%). For a fixed memory budget the recommendation is therefore to prefer a larger quantized model over a smaller full-precision one: 7B-4bit gives both the best accuracy and the best uncertainty signal (internal AUROC 0.98) of the three configurations that fit. We frame the results as selective-prediction operating points so they translate directly into a deployment recommendation, and we argue that error-detection AUROC, not calibration error, is the metric that exposes the difference between the two signals.", "arxiv_id": "2607.24440", "arxiv_url": "https://arxiv.org/abs/2607.24440", "authors": ["M M Asif Ferdous"], "brief": "\u8bba\u6587\u7814\u7a76\u56fe\u50cf\u9000\u5316\u573a\u666f\u4e0b\uff0cQwen2-VL \u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u89c4\u6a21\u4e0e 4-bit \u91cf\u5316\u5982\u4f55\u5f71\u54cd\u4e0d\u786e\u5b9a\u6027\u4fe1\u53f7\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6a21\u578b\u53d8\u5927\u663e\u8457\u63d0\u5347\u57fa\u4e8e token \u6982\u7387\u7684\u5185\u90e8\u9519\u8bef\u68c0\u6d4b\u80fd\u529b\uff0c\u4f46\u81ea\u7136\u8bed\u8a00\u81ea\u8ff0\u7f6e\u4fe1\u5ea6\u4ecd\u8f83\u5f31\uff1b4-bit \u91cf\u5316\u5bf9\u51c6\u786e\u7387\u5f71\u54cd\u5c0f\uff0c\u5374\u4f1a\u660e\u663e\u635f\u5bb3\u7f6e\u4fe1\u5ea6\u4fe1\u53f7\u3002\u56fa\u5b9a\u663e\u5b58\u9884\u7b97\u4e0b\uff0c\u4f5c\u8005\u5efa\u8bae\u4f18\u5148\u9009\u62e9\u66f4\u5927\u7684\u91cf\u5316\u6a21\u578b\u800c\u975e\u66f4\u5c0f\u7684\u5168\u7cbe\u5ea6\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24440", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u91cf\u5316", "\u6a21\u578b\u7f29\u653e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24440v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Bigger or Cheaper? Scale and Quantization Effects on Uncertainty Signals in Vision-Language Models Under Image Degradation", "tldr": "\u8bba\u6587\u7814\u7a76\u56fe\u50cf\u9000\u5316\u573a\u666f\u4e0b\uff0cQwen2-VL \u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u89c4\u6a21\u4e0e 4-bit \u91cf\u5316\u5982\u4f55\u5f71\u54cd\u4e0d\u786e\u5b9a\u6027\u4fe1\u53f7\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6a21\u578b\u53d8\u5927\u663e\u8457\u63d0\u5347\u57fa\u4e8e token \u6982\u7387\u7684\u5185\u90e8\u9519\u8bef\u68c0\u6d4b\u80fd\u529b\uff0c\u4f46\u81ea\u7136\u8bed\u8a00\u81ea\u8ff0\u7f6e\u4fe1\u5ea6\u4ecd\u8f83\u5f31\uff1b4-bit \u91cf\u5316\u5bf9\u51c6\u786e\u7387\u5f71\u54cd\u5c0f\uff0c\u5374\u4f1a\u660e\u663e\u635f\u5bb3\u7f6e\u4fe1\u5ea6\u4fe1\u53f7\u3002\u56fa\u5b9a\u663e\u5b58\u9884\u7b97\u4e0b\uff0c\u4f5c\u8005\u5efa\u8bae\u4f18\u5148\u9009\u62e9\u66f4\u5927\u7684\u91cf\u5316\u6a21\u578b\u800c\u975e\u66f4\u5c0f\u7684\u5168\u7cbe\u5ea6\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Mixture-of-Experts (MoE) language models are attractive for end-device deployment because only a small subset of experts is active per token, but their routed expert weights often exceed accelerator memory. We target latency-critical single-user settings where routed experts are staged on demand from CPU memory to a GPU or from Flash to a mobile NPU. In this setting, self-speculative decoding faces a new bottleneck: increasing the draft expert set improves accuracy but triggers extra expert loading, while cheap small-footprint drafts have low acceptance; moreover, verifying a multi-token block activates the union of target experts and is no longer close to one target step. We propose DraftExpert, an expansion-aware self-speculative decoding framework for expert-offloaded MoE inference. DraftExpert trains one lightweight accelerator-resident draft expert per layer by self-distilling residual, logit/token, and router-agreement signals from the frozen target MoE. At inference time, it uses a fixed-footprint shared+top-1+draft-expert drafter together with confidence--expansion truncation and target-expert prefetching, while final tokens are still exactly verified by the target model. On DeepSeek-V2-Lite and Moonlight-16B-A3B across CPU-GPU and Flash-NPU offload, DraftExpert improves decode throughput by 1.45x on average, raises draft acceptance to 84~87%, and achieves 86~88% prefetch hit rates.", "arxiv_id": "2607.24434", "arxiv_url": "https://arxiv.org/abs/2607.24434", "authors": ["Dengke Han"], "brief": "DraftExpert \u9762\u5411\u7aef\u4fa7 MoE \u5927\u6a21\u578b\u7684\u4e13\u5bb6\u5378\u8f7d\u63a8\u7406\uff0c\u63d0\u51fa\u4e00\u79cd\u611f\u77e5\u4e13\u5bb6\u6269\u5c55\u5f00\u9500\u7684\u81ea\u6295\u673a\u89e3\u7801\u6846\u67b6\uff0c\u901a\u8fc7\u4e3a\u6bcf\u5c42\u8bad\u7ec3\u8f7b\u91cf\u5e38\u9a7b\u8349\u7a3f\u4e13\u5bb6\u6765\u63d0\u5347\u8349\u7a3f\u8d28\u91cf\u5e76\u51cf\u5c11\u989d\u5916\u52a0\u8f7d\u3002\u5b9e\u9a8c\u5728 DeepSeek-V2-Lite \u548c Moonlight-16B-A3B \u4e0a\u5b9e\u73b0\u5e73\u5747 1.45 \u500d\u89e3\u7801\u541e\u5410\u63d0\u5347\uff0c\u8349\u7a3f\u63a5\u53d7\u7387\u8fbe 84%~87%\uff0c\u9884\u53d6\u547d\u4e2d\u7387\u8fbe 86%~88%\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24434", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u6295\u673a\u89e3\u7801", "\u7aef\u4fa7\u63a8\u7406", "\u6a21\u578b\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24434v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DraftExpert: Expansion-Aware Self-Speculative Decoding for End-Device MoE Inference", "tldr": "DraftExpert \u9762\u5411\u7aef\u4fa7 MoE \u5927\u6a21\u578b\u7684\u4e13\u5bb6\u5378\u8f7d\u63a8\u7406\uff0c\u63d0\u51fa\u4e00\u79cd\u611f\u77e5\u4e13\u5bb6\u6269\u5c55\u5f00\u9500\u7684\u81ea\u6295\u673a\u89e3\u7801\u6846\u67b6\uff0c\u901a\u8fc7\u4e3a\u6bcf\u5c42\u8bad\u7ec3\u8f7b\u91cf\u5e38\u9a7b\u8349\u7a3f\u4e13\u5bb6\u6765\u63d0\u5347\u8349\u7a3f\u8d28\u91cf\u5e76\u51cf\u5c11\u989d\u5916\u52a0\u8f7d\u3002\u5b9e\u9a8c\u5728 DeepSeek-V2-Lite \u548c Moonlight-16B-A3B \u4e0a\u5b9e\u73b0\u5e73\u5747 1.45 \u500d\u89e3\u7801\u541e\u5410\u63d0\u5347\uff0c\u8349\u7a3f\u63a5\u53d7\u7387\u8fbe 84%~87%\uff0c\u9884\u53d6\u547d\u4e2d\u7387\u8fbe 86%~88%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models place structured concepts on geometrically faithful manifolds: weekdays lie on a circle, months on another, usually taken to be a fixed world-model the network stores and looks up. We show that context is king: the structure a model actually uses is set by the in-context specification. A declarative rule fixes not only which relations the geometry encodes but its topology type: the same tokens form a cycle or a branching tree on command, built even on arbitrary, meaning-free tokens with no prior to inherit, which a relabeled stored shape cannot do. When the specification conflicts with a strong pretrained prior, the context-set geometry dominates it in capable models, read from the same activations (representational similarity 0.6--0.9 to the imposed structure versus near-zero to the prior), across the priors we test and both families we study (Gemma, Qwen). Activation patching shows the map is causally used, not a probe correlate: swapping one entity\u0027s activation for another\u0027s makes the model answer with the other entity\u0027s successor under the imposed order. A rough map forms readily, present even in small and base models; what scale gates is using it cleanly: clean dominance and the causal crossover emerge only in the larger models (up to Gemma-31B and Qwen-27B) and weaken or reverse below, so a mechanism present in a large model can be absent in a smaller one of the same family. Whether the model builds this geometry anew or reconfigures a stored one we leave open; operationally, the geometry it uses is the one the context specifies.", "arxiv_id": "2607.24425", "arxiv_url": "https://arxiv.org/abs/2607.24425", "authors": ["Elad David", "Max Fomin"], "brief": "\u8bba\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u6982\u5ff5\u51e0\u4f55\u5982\u4f55\u53d7\u4e0a\u4e0b\u6587\u89c4\u5219\u5851\u9020\uff0c\u53d1\u73b0\u540c\u4e00\u7ec4\u8bcd\u5143\u53ef\u6309\u63d0\u793a\u88ab\u7ec4\u7ec7\u6210\u73af\u3001\u6811\u7b49\u4e0d\u540c\u62d3\u6251\u7ed3\u6784\uff0c\u751a\u81f3\u9002\u7528\u4e8e\u65e0\u610f\u4e49\u7b26\u53f7\u3002\u5b9e\u9a8c\u8868\u660e\u5728\u8f83\u5927 Gemma\u3001Qwen \u6a21\u578b\u4e2d\uff0c\u4e0a\u4e0b\u6587\u6307\u5b9a\u7684\u7ed3\u6784\u4f1a\u538b\u8fc7\u9884\u8bad\u7ec3\u5148\u9a8c\uff0c\u5e76\u901a\u8fc7\u6fc0\u6d3b\u66ff\u6362\u9a8c\u8bc1\u8be5\u51e0\u4f55\u8868\u793a\u88ab\u56e0\u679c\u4f7f\u7528\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24425", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24425v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Context Is King: How In-Context Specification Shapes the Geometry of Concepts", "tldr": "\u8bba\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u6982\u5ff5\u51e0\u4f55\u5982\u4f55\u53d7\u4e0a\u4e0b\u6587\u89c4\u5219\u5851\u9020\uff0c\u53d1\u73b0\u540c\u4e00\u7ec4\u8bcd\u5143\u53ef\u6309\u63d0\u793a\u88ab\u7ec4\u7ec7\u6210\u73af\u3001\u6811\u7b49\u4e0d\u540c\u62d3\u6251\u7ed3\u6784\uff0c\u751a\u81f3\u9002\u7528\u4e8e\u65e0\u610f\u4e49\u7b26\u53f7\u3002\u5b9e\u9a8c\u8868\u660e\u5728\u8f83\u5927 Gemma\u3001Qwen \u6a21\u578b\u4e2d\uff0c\u4e0a\u4e0b\u6587\u6307\u5b9a\u7684\u7ed3\u6784\u4f1a\u538b\u8fc7\u9884\u8bad\u7ec3\u5148\u9a8c\uff0c\u5e76\u901a\u8fc7\u6fc0\u6d3b\u66ff\u6362\u9a8c\u8bc1\u8be5\u51e0\u4f55\u8868\u793a\u88ab\u56e0\u679c\u4f7f\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reservoir computing has emerged as an efficient machine learning framework for predicting time series generated by dynamical systems. In contrast to other machine and deep learning approaches, a reservoir computing trains only the output layer via linear regression, leaving the reservoir (recurrent layer) untrained. This simplification makes reservoir computers easier to train and more amenable to experimentation. However, because current reservoirs consist of networks of randomly connected nodes and require the optimization of numerous hyperparameters, a framework that precisely explains how reservoir computing operates and how it can be optimized remains missing. Here, we propose a frequency-based reservoir inspired by the brain\u0027s oscillatory dynamics and its hierarchy of timescales. The frequency-based reservoir can be interpreted as an ensemble of independent oscillatory units, each processing a portion of the input\u0027s frequency content. This allows us to understand the reservoir\u0027s internal behavior by modeling it as a single unit driven by an external input. Borrowing from the theory of a nonlinear oscillator forced by complex periodic inputs, we found that units of the frequency-based reservoir selectively amplify and store specific input frequencies, which are then used for prediction. The frequency-based reservoir performs as well as or better than equivalent random reservoirs. Furthermore, the frequency-based approach can be optimized to improve short-term prediction, a property that random reservoirs lack. Finally, we show that the frequency-based reservoir can also predict complex spatiotemporal dynamics. Our results show that reservoir computing can be designed using brain properties and theoretical insights borrowed from the physics of forced nonlinear oscillators.", "arxiv_id": "2607.24420", "arxiv_url": "https://arxiv.org/abs/2607.24420", "authors": ["Arthur S Powanwe"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53d7\u5927\u8111\u632f\u8361\u52a8\u529b\u5b66\u548c\u65f6\u95f4\u5c3a\u5ea6\u5c42\u7ea7\u542f\u53d1\u7684\u9891\u7387\u578b\u50a8\u5907\u8ba1\u7b97\u6846\u67b6\uff0c\u5c06\u50a8\u5907\u6c60\u89c6\u4e3a\u591a\u4e2a\u72ec\u7acb\u632f\u8361\u5355\u5143\u7684\u96c6\u5408\uff0c\u5206\u522b\u5904\u7406\u8f93\u5165\u7684\u4e0d\u540c\u9891\u7387\u6210\u5206\u3002\u8be5\u65b9\u6cd5\u53ef\u7528\u53d7\u8feb\u975e\u7ebf\u6027\u632f\u8361\u5668\u7406\u8bba\u89e3\u91ca\u5176\u5185\u90e8\u673a\u5236\uff0c\u5e76\u80fd\u9009\u62e9\u6027\u653e\u5927\u548c\u5b58\u50a8\u7279\u5b9a\u9891\u7387\u7528\u4e8e\u9884\u6d4b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u6027\u80fd\u8fbe\u5230\u6216\u4f18\u4e8e\u968f\u673a\u50a8\u5907\u6c60\uff0c\u4e14\u53ef\u9488\u5bf9\u77ed\u671f\u9884\u6d4b\u8fdb\u884c\u4f18\u5316\uff0c\u5e76\u9002\u7528\u4e8e\u590d\u6742\u65f6\u7a7a\u52a8\u529b\u5b66\u9884\u6d4b\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24420", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u50a8\u5907\u8ba1\u7b97", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u52a8\u529b\u7cfb\u7edf", "\u632f\u8361\u5668"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24420v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Frequency-Based Reservoir computing", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53d7\u5927\u8111\u632f\u8361\u52a8\u529b\u5b66\u548c\u65f6\u95f4\u5c3a\u5ea6\u5c42\u7ea7\u542f\u53d1\u7684\u9891\u7387\u578b\u50a8\u5907\u8ba1\u7b97\u6846\u67b6\uff0c\u5c06\u50a8\u5907\u6c60\u89c6\u4e3a\u591a\u4e2a\u72ec\u7acb\u632f\u8361\u5355\u5143\u7684\u96c6\u5408\uff0c\u5206\u522b\u5904\u7406\u8f93\u5165\u7684\u4e0d\u540c\u9891\u7387\u6210\u5206\u3002\u8be5\u65b9\u6cd5\u53ef\u7528\u53d7\u8feb\u975e\u7ebf\u6027\u632f\u8361\u5668\u7406\u8bba\u89e3\u91ca\u5176\u5185\u90e8\u673a\u5236\uff0c\u5e76\u80fd\u9009\u62e9\u6027\u653e\u5927\u548c\u5b58\u50a8\u7279\u5b9a\u9891\u7387\u7528\u4e8e\u9884\u6d4b\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u6027\u80fd\u8fbe\u5230\u6216\u4f18\u4e8e\u968f\u673a\u50a8\u5907\u6c60\uff0c\u4e14\u53ef\u9488\u5bf9\u77ed\u671f\u9884\u6d4b\u8fdb\u884c\u4f18\u5316\uff0c\u5e76\u9002\u7528\u4e8e\u590d\u6742\u65f6\u7a7a\u52a8\u529b\u5b66\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In this work, we propose K-SurvMeans, a novel extension of K-Means for clustering survival data. The method explicitly uses the survival outcome in the clustering process to optimize cluster centers, thereby maximizing pairwise survival differences between clusters. The objective function encourages the clusters to be well-separated from the survival perspective. Since the resulting optimization problem is non-differentiable, we employ the Particle Swarm algorithm for the Optimization process. To further improve flexibility and mitigate the curse of dimensionality, we extend the framework to operate in a learned low-dimensional latent space obtained via a dimensionality reduction. This allows the method to capture better-separated clusters and enhance optimization efficiency by reducing the search space. Experiments on multiple publicly available benchmark survival datasets demonstrate that K-SurvMeans consistently yields clusters with improved separation in survival distributions compared to existing deep learning-based survival clustering methods.", "arxiv_id": "2607.24405", "arxiv_url": "https://arxiv.org/abs/2607.24405", "authors": ["Abdallah Alabdallah"], "brief": "\u63d0\u51fa K-SurvMeans\uff0c\u5c06 K-Means \u6269\u5c55\u5230\u751f\u5b58\u6570\u636e\u805a\u7c7b\uff0c\u5728\u805a\u7c7b\u8fc7\u7a0b\u4e2d\u663e\u5f0f\u5229\u7528\u751f\u5b58\u7ed3\u5c40\u6765\u4f18\u5316\u7c07\u4e2d\u5fc3\u5e76\u6700\u5927\u5316\u7c07\u95f4\u751f\u5b58\u5dee\u5f02\u3002\u65b9\u6cd5\u7ed3\u5408\u7c92\u5b50\u7fa4\u4f18\u5316\u548c\u4f4e\u7ef4\u6f5c\u5728\u7a7a\u95f4\u964d\u7ef4\uff0c\u5728\u591a\u4e2a\u516c\u5f00\u751f\u5b58\u6570\u636e\u96c6\u4e0a\u76f8\u6bd4\u73b0\u6709\u6df1\u5ea6\u751f\u5b58\u805a\u7c7b\u65b9\u6cd5\u83b7\u5f97\u66f4\u597d\u7684\u751f\u5b58\u5206\u5e03\u5206\u79bb\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24405", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u5b58\u5206\u6790", "\u805a\u7c7b", "\u964d\u7ef4", "\u7c92\u5b50\u7fa4\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24405v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "K-Survival Means", "tldr": "\u63d0\u51fa K-SurvMeans\uff0c\u5c06 K-Means \u6269\u5c55\u5230\u751f\u5b58\u6570\u636e\u805a\u7c7b\uff0c\u5728\u805a\u7c7b\u8fc7\u7a0b\u4e2d\u663e\u5f0f\u5229\u7528\u751f\u5b58\u7ed3\u5c40\u6765\u4f18\u5316\u7c07\u4e2d\u5fc3\u5e76\u6700\u5927\u5316\u7c07\u95f4\u751f\u5b58\u5dee\u5f02\u3002\u65b9\u6cd5\u7ed3\u5408\u7c92\u5b50\u7fa4\u4f18\u5316\u548c\u4f4e\u7ef4\u6f5c\u5728\u7a7a\u95f4\u964d\u7ef4\uff0c\u5728\u591a\u4e2a\u516c\u5f00\u751f\u5b58\u6570\u636e\u96c6\u4e0a\u76f8\u6bd4\u73b0\u6709\u6df1\u5ea6\u751f\u5b58\u805a\u7c7b\u65b9\u6cd5\u83b7\u5f97\u66f4\u597d\u7684\u751f\u5b58\u5206\u5e03\u5206\u79bb\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Proxy outcomes (such as short-term behavioral signals, model predictions, or surrogate endpoints) are frequently used in place of primary outcomes that are too slow to mature, rare, or challenging to measure directly. But valid inference on a proxy does not guarantee valid inference on the primary estimate as proxy-based estimates can be systematically biased in ways that are difficult to predict, leading to improperly calibrated confidence intervals. We present proxymate, a framework and open-source Python package for proxy validation and adjustment. proxymate organizes into four levels: The Representativity Level (population validity), the Unit Level (measurement quality), the Estimate Level (decision validity), and the Domain Level (cross-domain transportability). Within each level, proxymate provides diagnostic checks, and targeted adjustment strategies that map specific failures to appropriate corrections. At Meta, proxymate has been adopted by many different use cases, spanning experimentation, prevalence estimation, and monitoring use cases, all facing different proxy challenges (limited human review time, long maturation window of outcomes, low detectability) and showcasing the modularity of the framework. Across all products, proxymate assessed and corrected millions of proxy, primary unit comparisons. It has facilitated launches across multiple work streams including enabling quick decision making on thousands of experiments.", "arxiv_id": "2607.24401", "arxiv_url": "https://arxiv.org/abs/2607.24401", "authors": ["Alexandra N. M. Darmon", "Deeksha Sinha", "Steve Wilkins-Reeves", "Caner Gocmen"], "brief": "\u672c\u6587\u63d0\u51fa proxymate\uff0c\u4e00\u4e2a\u7528\u4e8e\u4ee3\u7406\u6307\u6807\u9a8c\u8bc1\u4e0e\u6821\u6b63\u7684\u6846\u67b6\u548c\u5f00\u6e90 Python \u5305\uff0c\u9762\u5411\u77ed\u671f\u884c\u4e3a\u4fe1\u53f7\u3001\u6a21\u578b\u9884\u6d4b\u3001\u66ff\u4ee3\u7ec8\u70b9\u7b49\u4ee3\u7406\u7ed3\u679c\u53ef\u80fd\u5e26\u6765\u7684\u7cfb\u7edf\u6027\u504f\u5dee\u4e0e\u7f6e\u4fe1\u533a\u95f4\u5931\u51c6\u95ee\u9898\u3002\u5b83\u4ece\u4eba\u7fa4\u4ee3\u8868\u6027\u3001\u5355\u5143\u6d4b\u91cf\u8d28\u91cf\u3001\u4f30\u8ba1\u51b3\u7b56\u6709\u6548\u6027\u548c\u8de8\u57df\u53ef\u8fc1\u79fb\u6027\u56db\u4e2a\u5c42\u7ea7\u63d0\u4f9b\u8bca\u65ad\u4e0e\u9488\u5bf9\u6027\u8c03\u6574\uff0c\u5e76\u5df2\u5728 Meta \u591a\u7c7b\u5b9e\u9a8c\u3001\u76d1\u63a7\u548c\u6d41\u884c\u7387\u4f30\u8ba1\u573a\u666f\u4e2d\u5927\u89c4\u6a21\u5e94\u7528\uff0c\u652f\u6301\u66f4\u53ef\u9760\u7684\u5feb\u901f\u51b3\u7b56\u3002", "categories": ["stat.ML", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24401", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7edf\u8ba1\u63a8\u65ad", "\u4ee3\u7406\u6307\u6807", "\u56e0\u679c\u8bc4\u4f30", "\u6a21\u578b\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24401v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "proxymate: Diagnosis and Adjustment of Proxy Estimates for Reliable Inference", "tldr": "\u672c\u6587\u63d0\u51fa proxymate\uff0c\u4e00\u4e2a\u7528\u4e8e\u4ee3\u7406\u6307\u6807\u9a8c\u8bc1\u4e0e\u6821\u6b63\u7684\u6846\u67b6\u548c\u5f00\u6e90 Python \u5305\uff0c\u9762\u5411\u77ed\u671f\u884c\u4e3a\u4fe1\u53f7\u3001\u6a21\u578b\u9884\u6d4b\u3001\u66ff\u4ee3\u7ec8\u70b9\u7b49\u4ee3\u7406\u7ed3\u679c\u53ef\u80fd\u5e26\u6765\u7684\u7cfb\u7edf\u6027\u504f\u5dee\u4e0e\u7f6e\u4fe1\u533a\u95f4\u5931\u51c6\u95ee\u9898\u3002\u5b83\u4ece\u4eba\u7fa4\u4ee3\u8868\u6027\u3001\u5355\u5143\u6d4b\u91cf\u8d28\u91cf\u3001\u4f30\u8ba1\u51b3\u7b56\u6709\u6548\u6027\u548c\u8de8\u57df\u53ef\u8fc1\u79fb\u6027\u56db\u4e2a\u5c42\u7ea7\u63d0\u4f9b\u8bca\u65ad\u4e0e\u9488\u5bf9\u6027\u8c03\u6574\uff0c\u5e76\u5df2\u5728 Meta \u591a\u7c7b\u5b9e\u9a8c\u3001\u76d1\u63a7\u548c\u6d41\u884c\u7387\u4f30\u8ba1\u573a\u666f\u4e2d\u5927\u89c4\u6a21\u5e94\u7528\uff0c\u652f\u6301\u66f4\u53ef\u9760\u7684\u5feb\u901f\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multivariate time series forecasting (MTSF) predicts future values of multiple variables from historical data. While quantum neural networks have been increasingly applied to this task, they typically rely on fixed local measurements, which restrict their expressivity. We propose MTSF-ANO, a simple hybrid model for MTSF that integrates variational quantum circuits with adaptive non-local observables (ANO). On the four ETT datasets, MTSF-ANO ranks first or second in MSE in 17 of 20 settings, improving over the strongest baseline by up to 20% on ETTh1, and outperforms or matches its fixed local observable counterpart across all settings. Our ablations show how the quantum circuit design and ANO non-locality affect performance. These results suggest that ANO is a promising direction for quantum time series forecasting.", "arxiv_id": "2607.24399", "arxiv_url": "https://arxiv.org/abs/2607.24399", "authors": ["Yu-Ting Lee", "Huan-Hsin Tseng", "Samuel Yen-Chi Chen"], "brief": "\u8bba\u6587\u63d0\u51fa MTSF-ANO\uff0c\u5c06\u53d8\u5206\u91cf\u5b50\u7535\u8def\u4e0e\u81ea\u9002\u5e94\u975e\u5c40\u57df\u89c2\u6d4b\u91cf\u7ed3\u5408\uff0c\u7528\u4e8e\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\uff0c\u7f13\u89e3\u56fa\u5b9a\u5c40\u57df\u6d4b\u91cf\u8868\u8fbe\u80fd\u529b\u53d7\u9650\u7684\u95ee\u9898\u3002\u5728\u56db\u4e2a ETT \u6570\u636e\u96c6\u4e0a\uff0c\u6a21\u578b\u5728\u591a\u6570\u8bbe\u7f6e\u4e2d\u53d6\u5f97\u7b2c\u4e00\u6216\u7b2c\u4e8c\u7684 MSE\uff0c\u6700\u9ad8\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 20%\uff0c\u6d88\u878d\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u91cf\u5b50\u7535\u8def\u8bbe\u8ba1\u4e0e\u975e\u5c40\u57df\u6027\u7684\u4f5c\u7528\u3002", "categories": ["quant-ph", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24399", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u91cf\u5b50\u673a\u5668\u5b66\u4e60", "\u591a\u53d8\u91cf\u5efa\u6a21", "\u795e\u7ecf\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24399v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multivariate Time Series Forecasting with Adaptive Non-Local Observables", "tldr": "\u8bba\u6587\u63d0\u51fa MTSF-ANO\uff0c\u5c06\u53d8\u5206\u91cf\u5b50\u7535\u8def\u4e0e\u81ea\u9002\u5e94\u975e\u5c40\u57df\u89c2\u6d4b\u91cf\u7ed3\u5408\uff0c\u7528\u4e8e\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\uff0c\u7f13\u89e3\u56fa\u5b9a\u5c40\u57df\u6d4b\u91cf\u8868\u8fbe\u80fd\u529b\u53d7\u9650\u7684\u95ee\u9898\u3002\u5728\u56db\u4e2a ETT \u6570\u636e\u96c6\u4e0a\uff0c\u6a21\u578b\u5728\u591a\u6570\u8bbe\u7f6e\u4e2d\u53d6\u5f97\u7b2c\u4e00\u6216\u7b2c\u4e8c\u7684 MSE\uff0c\u6700\u9ad8\u8f83\u6700\u5f3a\u57fa\u7ebf\u63d0\u5347 20%\uff0c\u6d88\u878d\u5b9e\u9a8c\u9a8c\u8bc1\u4e86\u91cf\u5b50\u7535\u8def\u8bbe\u8ba1\u4e0e\u975e\u5c40\u57df\u6027\u7684\u4f5c\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Finite-time driving of stochastic systems generates excess dissipation, causing the evolving probability distribution to lag behind the instantaneous equilibrium, and consequently degrading the convergence of nonequilibrium free energy estimators based on the Jarzynski equality. Escorted free energy simulations address the non-adiabatic lag by engineering control fields $\\mathbf{u}$ that eliminate the lag, enforcing the trajectory-wise equality $\\mathcal{W}_\\mathbf{u} = \u0394\\mathcal{F}$, and yielding zero-variance estimators. However, constructing the escorting field in closed form remains a challenge, approached variously through flow-field methods, targeted free energy perturbation, or learned diffeomorphisms. In this work, we construct a complementary numerical framework based on gauge-type transforms instead of generalized coordinate transforms for perfect escorting based on the exact spectral decomposition of the time-dependent Fokker-Planck generator. The biorthogonal decomposition of the Liouville operator directly yields a counterdiabatic correction whose action on the instantaneous equilibrium distribution exactly cancels the non-adiabatic lag at arbitrary driving speed in formal analogy with shortcuts-to-adiabaticity techniques such as Berry\u0027s transitionless driving for quantum systems. Numerical verification for simulations of an overdamped particle in a time-varying double-well potential and harmonic traps confirms that the counterdiabatic condition is satisfied to machine precision, with the non-adiabatic lag suppressed by roughly twelve orders of magnitude in total variation distance and sixteen orders in KL divergence relative to the unescorted dynamics. As a diagnostic, we demonstrate vanishing dissipated work $\\mathcal{W}_{\\text{diss}}(t) \\approx 0$ for the deterministically propagated Fokker-Planck density across all protocol speeds.", "arxiv_id": "2607.24393", "arxiv_url": "https://arxiv.org/abs/2607.24393", "authors": ["Sandeep Suresh Cranganore", "Sebastian Lehner", "Johannes Brandstetter", "Max Welling"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u65f6\u53d8 Fokker-Planck/Liouville \u7b97\u7b26\u53cc\u6b63\u4ea4\u8c31\u5206\u89e3\u7684\u968f\u673a\u53cd\u7edd\u70ed\u9a71\u52a8\u6846\u67b6\uff0c\u7528\u89c4\u8303\u578b\u53d8\u6362\u6784\u9020\u7cbe\u786e\u7684 escorting \u63a7\u5236\u573a\uff0c\u4ee5\u6d88\u9664\u6709\u9650\u65f6\u95f4\u9a71\u52a8\u4e2d\u7684\u975e\u7edd\u70ed\u6ede\u540e\u3002\u6570\u503c\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u53cc\u9631\u4e0e\u8c10\u632f\u52bf\u4e2d\u8fc7\u5269\u8017\u6563\u8fd1\u4e4e\u4e3a\u96f6\uff0c\u5206\u5e03\u6ede\u540e\u76f8\u8f83\u672a\u63a7\u5236\u52a8\u529b\u5b66\u964d\u4f4e\u7ea6 12 \u5230 16 \u4e2a\u6570\u91cf\u7ea7\u3002", "categories": ["physics.comp-ph", "cond-mat.stat-mech", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24393", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u968f\u673a\u52a8\u529b\u5b66", "\u53cd\u7edd\u70ed\u9a71\u52a8", "\u81ea\u7531\u80fd\u4f30\u8ba1", "\u8c31\u5206\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24393v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Stochastic Counterdiabatic Driving via Biorthogonal Liouvillian Eigenmodes", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u65f6\u53d8 Fokker-Planck/Liouville \u7b97\u7b26\u53cc\u6b63\u4ea4\u8c31\u5206\u89e3\u7684\u968f\u673a\u53cd\u7edd\u70ed\u9a71\u52a8\u6846\u67b6\uff0c\u7528\u89c4\u8303\u578b\u53d8\u6362\u6784\u9020\u7cbe\u786e\u7684 escorting \u63a7\u5236\u573a\uff0c\u4ee5\u6d88\u9664\u6709\u9650\u65f6\u95f4\u9a71\u52a8\u4e2d\u7684\u975e\u7edd\u70ed\u6ede\u540e\u3002\u6570\u503c\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u53cc\u9631\u4e0e\u8c10\u632f\u52bf\u4e2d\u8fc7\u5269\u8017\u6563\u8fd1\u4e4e\u4e3a\u96f6\uff0c\u5206\u5e03\u6ede\u540e\u76f8\u8f83\u672a\u63a7\u5236\u52a8\u529b\u5b66\u964d\u4f4e\u7ea6 12 \u5230 16 \u4e2a\u6570\u91cf\u7ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous fleets enable mobility platforms to coordinate idle vehicles directly, making fleet-wide rebalancing possible. However, two obstacles limit reliable deployment: overlapping regional and local traffic patterns can hide roads that remain useful for dispatch, and mobility drift can make a trained policy unreliable. Existing spatial aggregation mixes these patterns, while updating all parameters from limited recent data is costly and can damage stable knowledge. We propose \\name, a framework that connects a dispatch-oriented multi-scale graph wavelet module with Drift-Guided Layer-Selective Optimization (DGLS). The first module addresses the representation challenge by separating graph-frequency patterns and weighting each scale according to its value for demand prediction and feasible rebalancing. DGLS addresses the adaptation challenge by measuring Dispatch-weighted Spectral Drift, selecting affected layers within a resource budget, and separating short shocks from persistent changes through a drift-aware fast--slow update. Candidate validation further rejects updates that fail to improve held-out dispatch reward without worsening monitored service or safety constraints. Experiments on both real-world datasets and simluated environments demonstrate the effectiveness of \\name\\ in comparing with state-of-the-art methods. The source code and datasets are available at https://anonymous.4open.science/r/MobiWave-40F8/.", "arxiv_id": "2607.24365", "arxiv_url": "https://arxiv.org/abs/2607.24365", "authors": ["Xiao Han", "Pinbo Wang", "Yuanshao Zhu", "Guojiang Shen", "Xiangjie Kong"], "brief": "\u8bba\u6587\u63d0\u51fa MobiWave\uff0c\u7528\u9762\u5411\u8c03\u5ea6\u7684\u591a\u5c3a\u5ea6\u56fe\u5c0f\u6ce2\u6765\u5206\u79bb\u533a\u57df\u4e0e\u5c40\u90e8\u4ea4\u901a\u6a21\u5f0f\uff0c\u5e76\u6309\u5176\u5bf9\u9700\u6c42\u9884\u6d4b\u548c\u8f66\u8f86\u518d\u5e73\u8861\u7684\u4ef7\u503c\u52a0\u6743\u3002\u8fd8\u5f15\u5165\u6f02\u79fb\u5f15\u5bfc\u7684\u5c42\u9009\u62e9\u4f18\u5316\uff0c\u5728\u6709\u9650\u8d44\u6e90\u4e0b\u53ea\u66f4\u65b0\u53d7\u5f71\u54cd\u5c42\uff0c\u5e76\u901a\u8fc7\u9a8c\u8bc1\u673a\u5236\u907f\u514d\u635f\u5bb3\u670d\u52a1\u4e0e\u5b89\u5168\u7ea6\u675f\uff1b\u5728\u771f\u5b9e\u6570\u636e\u548c\u4eff\u771f\u73af\u5883\u4e2d\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24365", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u4ea4\u901a\u8c03\u5ea6", "\u81ea\u9002\u5e94\u4f18\u5316", "\u81ea\u52a8\u9a7e\u9a76\u8f66\u961f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24365v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MobiWave: Dispatch-Oriented Graph Wavelets and Drift-Guided Selective Optimization for Autonomous Fleet Rebalancing", "tldr": "\u8bba\u6587\u63d0\u51fa MobiWave\uff0c\u7528\u9762\u5411\u8c03\u5ea6\u7684\u591a\u5c3a\u5ea6\u56fe\u5c0f\u6ce2\u6765\u5206\u79bb\u533a\u57df\u4e0e\u5c40\u90e8\u4ea4\u901a\u6a21\u5f0f\uff0c\u5e76\u6309\u5176\u5bf9\u9700\u6c42\u9884\u6d4b\u548c\u8f66\u8f86\u518d\u5e73\u8861\u7684\u4ef7\u503c\u52a0\u6743\u3002\u8fd8\u5f15\u5165\u6f02\u79fb\u5f15\u5bfc\u7684\u5c42\u9009\u62e9\u4f18\u5316\uff0c\u5728\u6709\u9650\u8d44\u6e90\u4e0b\u53ea\u66f4\u65b0\u53d7\u5f71\u54cd\u5c42\uff0c\u5e76\u901a\u8fc7\u9a8c\u8bc1\u673a\u5236\u907f\u514d\u635f\u5bb3\u670d\u52a1\u4e0e\u5b89\u5168\u7ea6\u675f\uff1b\u5728\u771f\u5b9e\u6570\u636e\u548c\u4eff\u771f\u73af\u5883\u4e2d\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neural spectral PDE solvers often learn an entire unresolved vector field even when an inexpensive approximate model can already capture most of the trajectory. Here we introduce Perturbative-NeuSA, a residual formulation that decomposes the target solution into a low-fidelity background and a high-resolution perturbation, so that only the unresolved dynamics is learned. Starting from the exact perturbation equation, the method combines a fixed spectral operator, a background-dependent correction, the background defect in the target PDE, and an optional neural closure. This construction makes the roles of physical structure and neural closure separately measurable. Across 2D Burgers, Klein-Gordon, and heterogeneous 2D wave equations, the deterministic structured solver outperforms the trained NeuSA baseline while requiring no neural-network training. The largest gains occur on Burgers, where the deterministic correction reduces training and extrapolation errors by factors of 24 and 44, respectively. In addition, a Klein-Gordon sweep over seven background resolutions shows that the effect of the closure is conditional: it improves a poor background by 3.6 times, becomes neutral at intermediate resolutions, and degrades a well-resolved background. For the wave equation, however, the closure provides an additional 18% reduction when the remaining residual is interface-localized. Multi-initial-condition diagnostics further show that the useful closure regime depends on the initial-condition spectrum and can disappear in extrapolation when structured correction already captures the dominant Burgers dynamics. Perturbative-NeuSA therefore reframes neural closure as a conditional, diagnosable correction governed by background fidelity, residual organization, and compatibility with the closure model.", "arxiv_id": "2607.24345", "arxiv_url": "https://arxiv.org/abs/2607.24345", "authors": ["Xianli Zhu", "Jia Yin"], "brief": "\u63d0\u51fa Perturbative-NeuSA\uff0c\u5c06\u65f6\u53d8 PDE \u89e3\u5206\u89e3\u4e3a\u4f4e\u4fdd\u771f\u80cc\u666f\u548c\u9ad8\u5206\u8fa8\u7387\u6270\u52a8\uff0c\u53ea\u5b66\u4e60\u672a\u89e3\u6790\u6b8b\u5dee\u52a8\u529b\u5b66\uff0c\u5e76\u628a\u7269\u7406\u7ed3\u6784\u4fee\u6b63\u4e0e\u795e\u7ecf\u95ed\u5305\u7684\u4f5c\u7528\u5206\u5f00\u8bc4\u4f30\u3002\u5728 Burgers\u3001Klein-Gordon \u548c\u5f02\u8d28\u6ce2\u65b9\u7a0b\u4e0a\uff0c\u786e\u5b9a\u6027\u7ed3\u6784\u5316\u6c42\u89e3\u5668\u65e0\u9700\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u5373\u53ef\u4f18\u4e8e NeuSA \u57fa\u7ebf\uff1b\u795e\u7ecf\u95ed\u5305\u662f\u5426\u6709\u76ca\u53d6\u51b3\u4e8e\u80cc\u666f\u7cbe\u5ea6\u3001\u6b8b\u5dee\u7ed3\u6784\u548c\u5916\u63a8\u573a\u666f\u3002", "categories": ["cs.LG", "math.NA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24345", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u504f\u5fae\u5206\u65b9\u7a0b", "\u8c31\u65b9\u6cd5", "\u795e\u7ecf\u7b97\u5b50", "\u79d1\u5b66\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24345v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Perturbative-NeuSA: A Structured Spectral Framework for Time-Dependent PDEs", "tldr": "\u63d0\u51fa Perturbative-NeuSA\uff0c\u5c06\u65f6\u53d8 PDE \u89e3\u5206\u89e3\u4e3a\u4f4e\u4fdd\u771f\u80cc\u666f\u548c\u9ad8\u5206\u8fa8\u7387\u6270\u52a8\uff0c\u53ea\u5b66\u4e60\u672a\u89e3\u6790\u6b8b\u5dee\u52a8\u529b\u5b66\uff0c\u5e76\u628a\u7269\u7406\u7ed3\u6784\u4fee\u6b63\u4e0e\u795e\u7ecf\u95ed\u5305\u7684\u4f5c\u7528\u5206\u5f00\u8bc4\u4f30\u3002\u5728 Burgers\u3001Klein-Gordon \u548c\u5f02\u8d28\u6ce2\u65b9\u7a0b\u4e0a\uff0c\u786e\u5b9a\u6027\u7ed3\u6784\u5316\u6c42\u89e3\u5668\u65e0\u9700\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u5373\u53ef\u4f18\u4e8e NeuSA \u57fa\u7ebf\uff1b\u795e\u7ecf\u95ed\u5305\u662f\u5426\u6709\u76ca\u53d6\u51b3\u4e8e\u80cc\u666f\u7cbe\u5ea6\u3001\u6b8b\u5dee\u7ed3\u6784\u548c\u5916\u63a8\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Unsupervised graph representation learning aims to derive meaningful node embeddings by capturing both structural and attribute information without relying on labeled data. Existing methods, such as GAEs, have demonstrated effectiveness but typically rely on message-passing mechanisms that assume homophily, leading to performance degradation on heterophilous graphs, where connected nodes exhibit dissimilar features. This homophily bias results in the loss of critical high-frequency components that are essential for identifying heterophilous patterns. To address these challenges, we propose \\textsc{AlignGAE}, a novel extension of \\textit{MaskGAE} that preserves the full frequency spectrum through complementary view alignment. Our framework introduces a dual-encoder architecture that separately processes structural and attribute information, incorporates node positional encoding to approximate Neighborhood Identity Distribution (NID), and employs dual reconstruction tasks for both edges and node attributes. We further propose theoretically grounded NID alignment strategies that ensure semantic consistency across views while preserving their distinct characteristics. Through comprehensive spectral analysis, we demonstrate that \\textsc{AlignGAE} achieves optimal representation properties when the alignment loss converges. Extensive experiments across 12 benchmark datasets validate our approach, showing that \\textsc{AlignGAE} outperforms state-of-the-art methods by up to 18.7\\% on heterophilous graphs in node classification, while maintaining competitive performance on homophilous graphs. Our results establish a new paradigm for frequency-aware graph representation learning.", "arxiv_id": "2607.24338", "arxiv_url": "https://arxiv.org/abs/2607.24338", "authors": ["Zengyi Wo", "Shiyu Zhang", "Qiyao Peng", "Tianpeng Li", "Xuan Guo"], "brief": "\u672c\u6587\u63d0\u51fa AlignGAE\uff0c\u901a\u8fc7\u7ed3\u6784\u4e0e\u5c5e\u6027\u53cc\u7f16\u7801\u5668\u3001\u4f4d\u7f6e\u7f16\u7801\u548c\u4e92\u8865\u89c6\u56fe\u5bf9\u9f50\uff0c\u5728\u65e0\u76d1\u7763\u56fe\u8868\u793a\u5b66\u4e60\u4e2d\u4fdd\u7559\u5b8c\u6574\u9891\u8c31\u4fe1\u606f\uff0c\u7f13\u89e3\u4f20\u7edf\u6d88\u606f\u4f20\u9012\u65b9\u6cd5\u7684\u540c\u8d28\u6027\u504f\u7f6e\u3002\u5b9e\u9a8c\u572812\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\uff0c\u5176\u5728\u5f02\u8d28\u56fe\u8282\u70b9\u5206\u7c7b\u4e2d\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u6700\u9ad8\u63d0\u534718.7%\uff0c\u540c\u65f6\u5728\u540c\u8d28\u56fe\u4e0a\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24338", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u8868\u793a\u5b66\u4e60", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u5f02\u8d28\u56fe", "\u9891\u8c31\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24338v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unsupervised Graph Representation Learning with Complementary View Alignment", "tldr": "\u672c\u6587\u63d0\u51fa AlignGAE\uff0c\u901a\u8fc7\u7ed3\u6784\u4e0e\u5c5e\u6027\u53cc\u7f16\u7801\u5668\u3001\u4f4d\u7f6e\u7f16\u7801\u548c\u4e92\u8865\u89c6\u56fe\u5bf9\u9f50\uff0c\u5728\u65e0\u76d1\u7763\u56fe\u8868\u793a\u5b66\u4e60\u4e2d\u4fdd\u7559\u5b8c\u6574\u9891\u8c31\u4fe1\u606f\uff0c\u7f13\u89e3\u4f20\u7edf\u6d88\u606f\u4f20\u9012\u65b9\u6cd5\u7684\u540c\u8d28\u6027\u504f\u7f6e\u3002\u5b9e\u9a8c\u572812\u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\uff0c\u5176\u5728\u5f02\u8d28\u56fe\u8282\u70b9\u5206\u7c7b\u4e2d\u76f8\u6bd4\u73b0\u6709\u65b9\u6cd5\u6700\u9ad8\u63d0\u534718.7%\uff0c\u540c\u65f6\u5728\u540c\u8d28\u56fe\u4e0a\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Common chunking strategies in Retrieval-Augmented Generation (RAG) systems often create redundant chunks. These redundant chunks make the vector database bigger and slow down retrieval. A common fix is cosine-similarity thresholding. This method reduces each chunk to a single vector, then compares vectors using a similarity score. But a single vector can lose the fine-grained, token-level detail needed to tell a true duplicate apart from a chunk that just shares the same topic. We propose Cross-Attention Calibrated Deduplication (CACD). CACD checks each new chunk against an in-memory pool of chunks already kept, using a cross-encoder instead of a single pooled vector. This keeps token-level detail all the way to the final comparison. CACD combines three parts: the cross-encoder comparison itself, a New Information Score (NIS) that measures how much of a chunk is not explained by a candidate already kept, and a majority vote across several candidates rather than a single best match. NIS is calculated from the attention entropy of the cross-encoder. We tested CACD against five existing filtering methods, nine chunking strategies, and 18 configurations, all on the full SQuAD 1.1 validation set. In our experiments, CACD removes 9.75% of chunks on average. This drop rate is close to other semantic-level methods, and much higher than exact-match filters, which barely remove anything. In these experiments, CACD also processes each configuration in 51.0 seconds on average, about 27% faster than the strongest baseline, NERExact (69.6s), and about 7x faster than cosine-similarity filtering (356.7s). These results come from a single dataset, so we present them as an early comparison, not a general claim. Code for the baseline evaluation and for CACD is available at https://github.com/lehuyphuong/rag_bench and https://github.com/lehuyphuong/cacd_dedup.", "arxiv_id": "2607.24332", "arxiv_url": "https://arxiv.org/abs/2607.24332", "authors": ["Phuong Le Huy", "Nam H. Nguyen", "Quan V. Dang"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e RAG \u7cfb\u7edf\u7684\u8de8\u6ce8\u610f\u529b\u6821\u51c6\u53bb\u91cd\u65b9\u6cd5 CACD\uff0c\u7528 cross-encoder \u4fdd\u7559 token \u7ea7\u5339\u914d\u4fe1\u606f\uff0c\u5e76\u7ed3\u5408\u57fa\u4e8e\u6ce8\u610f\u529b\u71b5\u7684\u65b0\u4fe1\u606f\u5206\u6570\u548c\u591a\u5019\u9009\u591a\u6570\u6295\u7968\u6765\u5224\u65ad\u5197\u4f59 chunk\u3002\u5728 SQuAD 1.1 \u9a8c\u8bc1\u96c6\u4e0a\uff0cCACD \u5e73\u5747\u5220\u9664 9.75% \u7684 chunk\uff0c\u901f\u5ea6\u5feb\u4e8e\u4e3b\u8981\u57fa\u7ebf\uff0c\u4f46\u5b9e\u9a8c\u4ecd\u8f83\u521d\u6b65\u3001\u6570\u636e\u96c6\u5355\u4e00\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24332", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u53bb\u91cd", "\u8de8\u6ce8\u610f\u529b", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24332v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cross-Attention Calibrated Deduplication for Retrieval-Augmented Generation System", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u4e8e RAG \u7cfb\u7edf\u7684\u8de8\u6ce8\u610f\u529b\u6821\u51c6\u53bb\u91cd\u65b9\u6cd5 CACD\uff0c\u7528 cross-encoder \u4fdd\u7559 token \u7ea7\u5339\u914d\u4fe1\u606f\uff0c\u5e76\u7ed3\u5408\u57fa\u4e8e\u6ce8\u610f\u529b\u71b5\u7684\u65b0\u4fe1\u606f\u5206\u6570\u548c\u591a\u5019\u9009\u591a\u6570\u6295\u7968\u6765\u5224\u65ad\u5197\u4f59 chunk\u3002\u5728 SQuAD 1.1 \u9a8c\u8bc1\u96c6\u4e0a\uff0cCACD \u5e73\u5747\u5220\u9664 9.75% \u7684 chunk\uff0c\u901f\u5ea6\u5feb\u4e8e\u4e3b\u8981\u57fa\u7ebf\uff0c\u4f46\u5b9e\u9a8c\u4ecd\u8f83\u521d\u6b65\u3001\u6570\u636e\u96c6\u5355\u4e00\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Predicting the absorption, distribution, metabolism, excretion and toxicity (ADMET) properties of small molecules remains a major challenge in drug discovery. Here, we present MEGA-CL, a foundation graph neural network framework for universal molecular ADMET prediction. MEGA-CL integrates self-supervised contrastive learning with a multi-head external attention mechanism and an enhanced message-passing architecture, enabling simultaneous modeling of local chemical substructures and global inter-graph relationships while mitigating over-smoothing effects commonly observed in deep graph networks. Across 13 benchmark datasets and 21 downstream ADMET tasks, MEGA-CL consistently outperforms state-of-the-art baseline models. In particular, the framework demonstrates robust performance on challenging regression tasks, including clearance (CL) and steady-state volume of distribution (VDss), while maintaining strong generalization ability in independent external validation. Clinically relevant predictive accuracy was achieved, with more than 75% of predictions falling within a 3-fold error range. In an external evaluation on 18 novel compounds derived from recently approved FDA drugs, over 50% of human liver microsome clearance (HLMC) predictions were within a 2-fold error range. To further assess its practical applicability, MEGA-CL was prospectively evaluated on three preclinical drug candidates using in vitro hepatic microsomal metabolism assays and CYP450 inhibition assays guided by model predictions. The predicted HLMC values for all candidates were within 2.5-fold of the experimentally measured values, and 73.3% of CYP450 inhibition endpoints (11/15) were correctly classified. These results demonstrate the potential of MEGA-CL as a generalizable framework for accelerating in silico ADMET evaluation and early-stage drug candidate optimization.", "arxiv_id": "2607.24314", "arxiv_url": "https://arxiv.org/abs/2607.24314", "authors": ["Tinghui Jin", "Kedu Jin", "Ying Li", "Guanghui Ren", "Jingzhi Xue", "Shiyu Zhou", "Xiaoli Dai", "Li-bin Wei", "Xijing Chen", "Di Zhao", "Jinfeng Liu"], "brief": "MEGA-CL \u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u5c0f\u5206\u5b50 ADMET \u9884\u6d4b\u7684\u5206\u5b50\u57fa\u7840\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u7ed3\u5408\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u3001\u56fe\u5916\u90e8\u6ce8\u610f\u529b\u548c\u589e\u5f3a\u6d88\u606f\u4f20\u9012\uff0c\u4ee5\u540c\u65f6\u5efa\u6a21\u5c40\u90e8\u5316\u5b66\u7ed3\u6784\u4e0e\u5168\u5c40\u5206\u5b50\u5173\u7cfb\u3002\u5b83\u5728 13 \u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u300121 \u4e2a ADMET \u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u5728\u5916\u90e8\u9a8c\u8bc1\u548c\u524d\u77bb\u6027\u5b9e\u9a8c\u4e2d\u8868\u73b0\u51fa\u8f83\u597d\u7684\u6cdb\u5316\u4e0e\u5b9e\u7528\u9884\u6d4b\u7cbe\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2607.24314", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u795e\u7ecf\u7f51\u7edc", "\u5206\u5b50\u5efa\u6a21", "\u5bf9\u6bd4\u5b66\u4e60", "\u836f\u7269\u53d1\u73b0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2607.24314v1", "published_at": "2026-07-27", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MEGA-CL: A Molecular Foundation Model for Generalizable ADMET Prediction through Graph External Attention and Contrastive Learning", "tldr": "MEGA-CL \u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u5c0f\u5206\u5b50 ADMET \u9884\u6d4b\u7684\u5206\u5b50\u57fa\u7840\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u7ed3\u5408\u81ea\u76d1\u7763\u5bf9\u6bd4\u5b66\u4e60\u3001\u56fe\u5916\u90e8\u6ce8\u610f\u529b\u548c\u589e\u5f3a\u6d88\u606f\u4f20\u9012\uff0c\u4ee5\u540c\u65f6\u5efa\u6a21\u5c40\u90e8\u5316\u5b66\u7ed3\u6784\u4e0e\u5168\u5c40\u5206\u5b50\u5173\u7cfb\u3002\u5b83\u5728 13 \u4e2a\u57fa\u51c6\u6570\u636e\u96c6\u300121 \u4e2a ADMET \u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5e76\u5728\u5916\u90e8\u9a8c\u8bc1\u548c\u524d\u77bb\u6027\u5b9e\u9a8c\u4e2d\u8868\u73b0\u51fa\u8f83\u597d\u7684\u6cdb\u5316\u4e0e\u5b9e\u7528\u9884\u6d4b\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) process text through subword tokenizers rather than directly reading characters or words. Because these tokenizers are trained predominantly on English-centric corpora, they introduce a systematic and often overlooked disadvantage for many non-English languages. In this work, we quantify this tokenizer tax for Indian languages using the FLORES-200 parallel corpus, measuring tokenization fertility across six widely used tokenizers and fourteen languages. Under cl100k_base (used by GPT-3.5 and GPT-4), Indian languages experience an average 8.0x tokenization tax relative to English, reaching 13.0x for Malayalam, reducing the effective context window to as little as 12% of that available to English users for equivalent semantic content. We identify the primary mechanism behind this disparity: failed byte-pair merges that leave text fragmented into single-byte tokens, with merge failure strongly correlating with tokenizer tax (Pearson r = 0.89). We further show that this phenomenon is not an inherent property of Indic scripts but a consequence of tokenizer design. Multilingual tokenizers such as XLM-R and OpenAI\u0027s o200k_base reduce the av
