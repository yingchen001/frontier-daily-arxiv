<script>
const PAPERS = [{"abstract": "Traditional speaker-attributed ASR systems treated ASR and speaker diarization as two separate tasks. Recently, end-to-end models such as VibeVoice-ASR have unified the two tasks within a single model. However, existing unified models still mainly support offline recognition, making it difficult to meet the low-latency requirements of real-time voice assistants and agents. To tackle this issue, we present VibeVoice-ASR-Streaming, one of the first LLM-based end-to-end approaches to streaming speaker-attributed ASR. It interleaves fixed-size audio chunks, a small amount of lookahead audio and previous text. This allows the model to produce \u0027\u0027who said what\u0027\u0027 as speech arrives, without a separate diarization stage. For transcription accuracy, our 7B model achieves the lowest average WER/CER across five evaluation sets. For speaker attribution, it achieves the best or tied-best on 12 of 13 evaluation settings. We release the 1.5B and 7B model weights together with inference code.", "arxiv_id": "2609.02812", "arxiv_url": "https://arxiv.org/abs/2609.02812", "authors": ["Yujie Tu", "Zhiliang Peng", "Jianwei Yu", "Li Dong", "Songchen Xu", "Yaoyao Chang", "Wenhui Wang", "Zilong Wang", "Zehua Wang", "Yan Xia", "Jiajun Zhang", "Xie Chen", "Furu Wei"], "brief": "\u8bba\u6587\u63d0\u51fa VibeVoice-ASR-Streaming\uff0c\u4e00\u4e2a\u57fa\u4e8e LLM \u7684\u6d41\u5f0f\u8bf4\u8bdd\u4eba\u5f52\u5c5e ASR \u6a21\u578b\uff0c\u5c06\u8bed\u97f3\u8bc6\u522b\u4e0e\u8bf4\u8bdd\u4eba\u533a\u5206\u7edf\u4e00\u5728\u5355\u4e00\u7aef\u5230\u7aef\u6846\u67b6\u4e2d\u3002\u5b83\u901a\u8fc7\u4ea4\u9519\u56fa\u5b9a\u97f3\u9891\u5757\u3001\u5c11\u91cf\u524d\u77bb\u97f3\u9891\u548c\u5386\u53f2\u6587\u672c\uff0c\u5b9e\u73b0\u4f4e\u5ef6\u8fdf\u8f93\u51fa\u201c\u8c01\u8bf4\u4e86\u4ec0\u4e48\u201d\u3002", "categories": ["eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.02812", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u65e0\u9700\u72ec\u7acb\u8bf4\u8bdd\u4eba\u5206\u79bb/\u805a\u7c7b\u9636\u6bb5\uff0c\u76f4\u63a5\u5728\u6d41\u5f0f\u8f93\u5165\u4e2d\u751f\u6210\u5e26\u8bf4\u8bdd\u4eba\u5f52\u5c5e\u7684\u8f6c\u5199\u7ed3\u679c", "\u91c7\u7528\u56fa\u5b9a\u5927\u5c0f\u97f3\u9891\u5757\u3001lookahead audio \u4e0e\u5386\u53f2\u6587\u672c\u4e0a\u4e0b\u6587\u7684\u4ea4\u9519\u5efa\u6a21\uff0c\u517c\u987e\u5b9e\u65f6\u6027\u4e0e\u51c6\u786e\u7387", "7B \u6a21\u578b\u5728\u4e94\u4e2a\u8bc4\u6d4b\u96c6\u4e0a\u53d6\u5f97\u6700\u4f4e\u5e73\u5747 WER/CER\uff0c\u5e76\u5728 13 \u4e2a\u8bf4\u8bdd\u4eba\u5f52\u5c5e\u8bbe\u7f6e\u4e2d\u7684 12 \u4e2a\u8fbe\u5230\u6700\u4f73\u6216\u5e76\u5217\u6700\u4f73\uff1b\u540c\u65f6\u5f00\u6e90 1.5B/7B \u6743\u91cd\u548c\u63a8\u7406\u4ee3\u7801"], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u8bf4\u8bdd\u4eba\u5206\u79bb", "\u6d41\u5f0f\u5efa\u6a21", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2609.02812v1", "published_at": "2026-09-02", "score": 0.507, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.02812.png", "title": "VibeVoice-ASR-Streaming Technical Report", "tldr": "\u6d41\u5f0f\u7aef\u5230\u7aef\u201c\u8c01\u8bf4\u4e86\u4ec0\u4e48\u201d\u8bed\u97f3\u8bc6\u522b", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa VibeVoice-ASR-Streaming\uff0c\u4e00\u4e2a\u57fa\u4e8e LLM \u7684\u6d41\u5f0f\u8bf4\u8bdd\u4eba\u5f52\u5c5e ASR \u6a21\u578b\uff0c\u5c06\u8bed\u97f3\u8bc6\u522b\u4e0e\u8bf4\u8bdd\u4eba\u533a\u5206\u7edf\u4e00\u5728\u5355\u4e00\u7aef\u5230\u7aef\u6846\u67b6\u4e2d\u3002\u5b83\u901a\u8fc7\u4ea4\u9519\u56fa\u5b9a\u97f3\u9891\u5757\u3001\u5c11\u91cf\u524d\u77bb\u97f3\u9891\u548c\u5386\u53f2\u6587\u672c\uff0c\u5b9e\u73b0\u4f4e\u5ef6\u8fdf\u8f93\u51fa\u201c\u8c01\u8bf4\u4e86\u4ec0\u4e48\u201d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u7aef\u5230\u7aef\u8bf4\u8bdd\u4eba\u5f52\u5c5e ASR \u4ece\u79bb\u7ebf\u63a8\u5411\u6d41\u5f0f\u573a\u666f\uff0c\u5bf9\u5b9e\u65f6\u4f1a\u8bae\u8f6c\u5199\u3001\u8bed\u97f3\u52a9\u624b\u548c\u591a\u8bf4\u8bdd\u4eba\u4ea4\u4e92\u7cfb\u7edf\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\uff1b\u6a21\u578b\u548c\u4ee3\u7801\u5f00\u6e90\u4e5f\u6709\u52a9\u4e8e\u63a8\u52a8\u53ef\u590d\u73b0\u7814\u7a76\u3002"}, {"abstract": "As terminal-based code agents become prevalent, agent trajectories have accumulated at scale, while realistic, executable environments remain scarce. However, environments are what agent post-training actually requires: each can be re-queried into many verifiable tasks and provides execution feedback, whereas a trajectory is a single frozen demonstration. Rather than generating environments from scratch, we observe that the tool-execution history in existing trajectories exposes the structure and contents of the environments in which they ran, making it possible to reconstruct those environments from the trajectories themselves. Thus, we introduce Terminal-Universe, a framework which turns each trajectory into a reusable environment and explores it for synthesizing new tasks and continued interactions. Specifically, Terminal-Universe replays the file operations recorded in a trajectory to restore each file before the agent modified it, yielding a partial workspace; a completion agent then supplies the missing files and dependencies. On this recovered workspace, we both reconstruct the original intent task and synthesize entirely new ones. Besides, we also scale the tasks along two complementary axes: breadth and depth. For breadth, we mine directional dependency relations between related environments and synthesize cross-workspace queries spanning multiple codebases, as developers routinely do in real-world development. For depth, we extend the initial single-turn query into a multi-round session that captures iterative user feedback and requirement refinement via a user agent. Applied to public terminal agent trajectories, Terminal-Universe produces 37.3k task-sufficient environments. Supervised fine-tuning of Qwen3.5-27B on this corpus improves single-round performance on Terminal-Bench 2.1 by 11.9 points and multi-round performance on EvoCode-Bench v2 MT@4 by 13.8 points.", "arxiv_id": "2609.04148", "arxiv_url": "https://arxiv.org/abs/2609.04148", "authors": ["Jie Wu", "Zhenru Zhang", "Beichen Zhang", "Xuwu Wang", "Yuhui Su", "Mouxiang Chen", "Peng Wang", "Zhihai Wang", "Que Shen", "Hao Zhou", "An Yang", "Fei Huang", "Yujiu Yang", "Dayiheng Liu"], "brief": "Terminal-Universe \u662f\u4e00\u4e2a\u5c06\u5df2\u6709\u7ec8\u7aef\u4ee3\u7801\u667a\u80fd\u4f53\u8f68\u8ff9\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u590d\u7528\u7ec8\u7aef\u73af\u5883\u7684\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u56de\u653e\u8f68\u8ff9\u4e2d\u7684\u6587\u4ef6\u64cd\u4f5c\u6062\u590d\u5de5\u4f5c\u533a\uff0c\u5e76\u8865\u5168\u7f3a\u5931\u6587\u4ef6\u4e0e\u4f9d\u8d56\uff0c\u518d\u751f\u6210\u539f\u59cb\u4efb\u52a1\u3001\u65b0\u4efb\u52a1\u3001\u8de8\u5de5\u4f5c\u533a\u4efb\u52a1\u548c\u591a\u8f6e\u4ea4\u4e92\u4efb\u52a1\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04148", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5229\u7528\u8f68\u8ff9\u4e2d\u7684\u5de5\u5177\u6267\u884c\u4e0e\u6587\u4ef6\u64cd\u4f5c\u5386\u53f2\uff0c\u6062\u590d\u667a\u80fd\u4f53\u4fee\u6539\u524d\u7684\u90e8\u5206\u5de5\u4f5c\u533a\uff0c\u518d\u7531\u8865\u5168\u667a\u80fd\u4f53\u8865\u9f50\u7f3a\u5931\u6587\u4ef6\u548c\u4f9d\u8d56\u3002", "\u5728\u6062\u590d\u73af\u5883\u4e0a\u540c\u65f6\u91cd\u5efa\u539f\u59cb\u610f\u56fe\u4efb\u52a1\uff0c\u5e76\u5408\u6210\u65b0\u7684\u53ef\u9a8c\u8bc1\u4efb\u52a1\uff1b\u8fd8\u652f\u6301\u8de8\u4ee3\u7801\u5e93\u67e5\u8be2\u4ee5\u6269\u5c55\u4efb\u52a1\u5e7f\u5ea6\u3002", "\u901a\u8fc7\u7528\u6237\u667a\u80fd\u4f53\u5c06\u5355\u8f6e\u67e5\u8be2\u6269\u5c55\u4e3a\u591a\u8f6e\u4f1a\u8bdd\uff0c\u6a21\u62df\u771f\u5b9e\u5f00\u53d1\u4e2d\u7684\u53cd\u9988\u8fed\u4ee3\u548c\u9700\u6c42\u7ec6\u5316\uff1b\u6700\u7ec8\u751f\u6210 37.3k \u4e2a\u4efb\u52a1\u5145\u5206\u7684\u73af\u5883\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u73af\u5883\u6784\u5efa", "\u76d1\u7763\u5fae\u8c03"], "num_comments": 0, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2609.04148v1", "published_at": "2026-09-03", "score": 0.488, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (6\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04148.png", "title": "Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments", "tldr": "\u628a\u7ec8\u7aef\u667a\u80fd\u4f53\u8f68\u8ff9\u91cd\u5efa\u4e3a\u53ef\u590d\u7528\u73af\u5883", "upvotes": 6, "what_it_is": "Terminal-Universe \u662f\u4e00\u4e2a\u5c06\u5df2\u6709\u7ec8\u7aef\u4ee3\u7801\u667a\u80fd\u4f53\u8f68\u8ff9\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u590d\u7528\u7ec8\u7aef\u73af\u5883\u7684\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u56de\u653e\u8f68\u8ff9\u4e2d\u7684\u6587\u4ef6\u64cd\u4f5c\u6062\u590d\u5de5\u4f5c\u533a\uff0c\u5e76\u8865\u5168\u7f3a\u5931\u6587\u4ef6\u4e0e\u4f9d\u8d56\uff0c\u518d\u751f\u6210\u539f\u59cb\u4efb\u52a1\u3001\u65b0\u4efb\u52a1\u3001\u8de8\u5de5\u4f5c\u533a\u4efb\u52a1\u548c\u591a\u8f6e\u4ea4\u4e92\u4efb\u52a1\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u4e00\u6b21\u6027\u7684\u9759\u6001\u8f68\u8ff9\u8f6c\u5316\u4e3a\u53ef\u53cd\u590d\u67e5\u8be2\u3001\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u7684\u8bad\u7ec3\u73af\u5883\uff0c\u7f13\u89e3\u4ee3\u7801\u667a\u80fd\u4f53\u540e\u8bad\u7ec3\u4e2d\u771f\u5b9e\u73af\u5883\u7a00\u7f3a\u7684\u95ee\u9898\u3002\u57fa\u4e8e\u8be5\u8bed\u6599\u5bf9 Qwen3.5-27B \u8fdb\u884c\u76d1\u7763\u5fae\u8c03\uff0c\u5728 Terminal-Bench 2.1 \u5355\u8f6e\u6027\u80fd\u63d0\u5347 11.9 \u5206\uff0c\u5728 EvoCode-Bench v2 \u591a\u8f6e MT@4 \u63d0\u5347 13.8 \u5206\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Knowledge-Based Visual Question Answering (KB-VQA) relies on retrieving external information to answer queries involving long-tail entities. However, existing retrieval pipelines predominantly employ CLIP-style dual encoders, which prioritize surface-level visual similarity over entity-level semantic alignment. This paradigm often fails when semantically identical concepts exhibit large visual variations or when distinct entities appear visually similar. To address this, we propose KBMR, the first MLLM-based embedding retriever tailored for KB-VQA. Leveraging the robust autoregressive capabilities of MLLMs, KBMR maps images into a semantic space that better preserves concept identity. To tackle the challenge of noisy supervision in Wikipedia-scale retrieval, we introduce an MLLM-based semantic discriminator that generates continuous entity-consistency weights. These weights guide a novel continuous semantic distillation objective, enabling effective hard negative sampling and soft supervision beyond rigid binary labels. Extensive experiments demonstrate that KBMR significantly outperforms CLIP baselines, yielding up to a 14.7% improvement in retrieval Recall@1 and a 9.4% gain in end-to-end VQA accuracy. Code is available at https://github.com/realHarryX/KBMR.", "arxiv_id": "2608.21450", "arxiv_url": "https://arxiv.org/abs/2608.21450", "authors": ["Hangrui Xu", "Zhengxian Wu", "Yunyao Yu", "Zhuohong Chen", "Rui Cong", "Xiangwen Deng", "Zhifang Liu", "Peng Jiao", "Haoqian Wang"], "brief": "\u8bba\u6587\u63d0\u51faKBMR\uff0c\u4e00\u4e2a\u9762\u5411\u77e5\u8bc6\u578b\u89c6\u89c9\u95ee\u7b54\u7684MLLM\u5d4c\u5165\u68c0\u7d22\u5668\uff0c\u7528\u8bed\u4e49\u5b9e\u4f53\u4e00\u81f4\u6027\u66ff\u4ee3\u5355\u7eaf\u89c6\u89c9\u76f8\u4f3c\u6027\u68c0\u7d22\u3002\u5b83\u8fd8\u5f15\u5165MLLM\u8bed\u4e49\u5224\u522b\u5668\u751f\u6210\u8fde\u7eed\u5b9e\u4f53\u4e00\u81f4\u6027\u6743\u91cd\uff0c\u7528\u4e8e\u5728\u7ef4\u57fa\u767e\u79d1\u89c4\u6a21\u6570\u636e\u4e0a\u8fdb\u884c\u8f6f\u76d1\u7763\u84b8\u998f\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21450", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9CLIP\u5f0f\u53cc\u7f16\u7801\u5668\u504f\u91cd\u8868\u9762\u89c6\u89c9\u76f8\u4f3c\u3001\u96be\u4ee5\u5904\u7406\u957f\u5c3e\u5b9e\u4f53\u548c\u89c6\u89c9\u6df7\u6dc6\u5b9e\u4f53\u7684\u95ee\u9898\uff0cKBMR\u5c06\u56fe\u50cf\u6620\u5c04\u5230\u66f4\u4fdd\u7559\u6982\u5ff5\u8eab\u4efd\u7684\u8bed\u4e49\u7a7a\u95f4\u3002", "\u63d0\u51fa\u8fde\u7eed\u8bed\u4e49\u84b8\u998f\u76ee\u6807\uff0c\u5229\u7528\u5b9e\u4f53\u4e00\u81f4\u6027\u6743\u91cd\u8fdb\u884c\u8f6f\u76d1\u7763\uff0c\u5e76\u652f\u6301\u66f4\u6709\u6548\u7684\u56f0\u96be\u8d1f\u6837\u672c\u6316\u6398\u3002", "\u5b9e\u9a8c\u663e\u793a\u76f8\u8f83CLIP\u57fa\u7ebf\uff0c\u68c0\u7d22Recall@1\u6700\u9ad8\u63d0\u534714.7%\uff0c\u7aef\u5230\u7aefVQA\u51c6\u786e\u7387\u63d0\u53479.4%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u95ee\u7b54", "\u4fe1\u606f\u68c0\u7d22", "\u77e5\u8bc6\u589e\u5f3a"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2608.21450v1", "published_at": "2026-08-19", "score": 0.48, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21450.png", "title": "Beyond Visual Similarity: Entity-Aligned Retrieval for Knowledge-Based Visual Question Answering", "tldr": "\u7528MLLM\u5b9e\u73b0\u5b9e\u4f53\u5bf9\u9f50\u7684KB-VQA\u68c0\u7d22", "upvotes": 26, "what_it_is": "\u8bba\u6587\u63d0\u51faKBMR\uff0c\u4e00\u4e2a\u9762\u5411\u77e5\u8bc6\u578b\u89c6\u89c9\u95ee\u7b54\u7684MLLM\u5d4c\u5165\u68c0\u7d22\u5668\uff0c\u7528\u8bed\u4e49\u5b9e\u4f53\u4e00\u81f4\u6027\u66ff\u4ee3\u5355\u7eaf\u89c6\u89c9\u76f8\u4f3c\u6027\u68c0\u7d22\u3002\u5b83\u8fd8\u5f15\u5165MLLM\u8bed\u4e49\u5224\u522b\u5668\u751f\u6210\u8fde\u7eed\u5b9e\u4f53\u4e00\u81f4\u6027\u6743\u91cd\uff0c\u7528\u4e8e\u5728\u7ef4\u57fa\u767e\u79d1\u89c4\u6a21\u6570\u636e\u4e0a\u8fdb\u884c\u8f6f\u76d1\u7763\u84b8\u998f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aMLLM\u7684\u8bed\u4e49\u7406\u89e3\u80fd\u529b\u7528\u4e8eKB-VQA\u68c0\u7d22\u73af\u8282\uff0c\u7a81\u7834\u4e86\u89c6\u89c9\u76f8\u4f3c\u6027\u68c0\u7d22\u5bf9\u5b9e\u4f53\u5bf9\u9f50\u4e0d\u8db3\u7684\u74f6\u9888\uff0c\u5bf9\u957f\u5c3e\u77e5\u8bc6\u95ee\u7b54\u548c\u5927\u89c4\u6a21\u77e5\u8bc6\u68c0\u7d22\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "MLLM-based embedding models remain limited in compositional retrieval, often failing to distinguish scenes containing the same concepts but different attribute-object bindings. Yet the same backbone can resolve such distinctions when used as a cross-attentive reranker, motivating us to distill its compositional judgments into the embedding model. We propose CORE, which synthesizes candidate lists spanning five compositional matching levels and introduces a Rank-KL objective that trains the embedding model to reproduce the reranker\u0027s fine-grained ranking. We further introduce a graded evaluation protocol and compare contrastive learning, pairwise CoSENT, and listwise Rank-KL under the same data and tuning budget. Our comparison shows that both CoSENT and Rank-KL use the multi-level supervision more effectively than contrastive learning, with Rank-KL achieving the strongest overall performance. Across three compositional reasoning benchmarks (COLA, SUGARCREPE++, NEGBENCH), CORE-RERANKER-8B achieves an 82.7% total average, outperforming Jina-Reranker by 10.7 points, while CORE-EMBED-8B achieves the best total average (0.666) among all evaluated embedding models. The improvements transfer to the MCMR benchmark without sacrificing retrieval performance on COCO and Flickr30K.", "arxiv_id": "2609.04083", "arxiv_url": "https://arxiv.org/abs/2609.04083", "authors": ["Tingyu Song", "Mingxin Li", "Yanzhao Zhang", "Dingkun Long", "Chu Liu", "Pengjun Xie", "Yilun Zhao", "Shu Wu"], "brief": "\u8bba\u6587\u63d0\u51fa CORE\uff0c\u5c06\u540c\u4e00\u591a\u6a21\u6001\u5927\u6a21\u578b\u4f5c\u4e3a\u4ea4\u53c9\u6ce8\u610f\u529b\u91cd\u6392\u5668\u5f97\u5230\u7684\u7ec6\u7c92\u5ea6\u7ec4\u5408\u5224\u65ad\uff0c\u84b8\u998f\u5230\u5d4c\u5165\u6a21\u578b\u4e2d\u3002\u5b83\u6784\u9020\u8986\u76d6\u4e94\u7ea7\u7ec4\u5408\u5339\u914d\u7684\u5019\u9009\u5217\u8868\uff0c\u5e76\u7528 Rank-KL \u5217\u8868\u5f0f\u76ee\u6807\u8bad\u7ec3\u5d4c\u5165\u6a21\u578b\u590d\u73b0\u91cd\u6392\u5668\u6392\u5e8f\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04083", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u5c5e\u6027-\u5bf9\u8c61\u7ed1\u5b9a\u7b49\u7ec4\u5408\u68c0\u7d22\u96be\u9898\uff0c\u5229\u7528\u91cd\u6392\u5668\u6bd4\u53cc\u5854\u5d4c\u5165\u66f4\u5f3a\u7684\u7ec6\u7c92\u5ea6\u533a\u5206\u80fd\u529b\u8fdb\u884c\u84b8\u998f\u3002", "\u63d0\u51fa\u4e94\u7ea7\u7ec4\u5408\u5339\u914d\u5019\u9009\u5408\u6210\u4e0e\u5206\u7ea7\u8bc4\u6d4b\u534f\u8bae\uff0c\u7cfb\u7edf\u6bd4\u8f83\u5bf9\u6bd4\u5b66\u4e60\u3001pairwise CoSENT \u548c listwise Rank-KL\u3002", "CORE-RERANKER-8B \u5728 COLA\u3001SUGARCREPE++\u3001NEGBENCH \u4e0a\u5e73\u5747\u8fbe 82.7%\uff0c\u8f83 Jina-Reranker \u9ad8 10.7 \u70b9\uff1bCORE-EMBED-8B \u5728\u5d4c\u5165\u6a21\u578b\u4e2d\u53d6\u5f97\u6700\u4f73\u603b\u5e73\u5747 0.666\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u68c0\u7d22", "\u77e5\u8bc6\u84b8\u998f", "\u7ec4\u5408\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "Alibaba-NLP", "pdf_url": "https://arxiv.org/pdf/2609.04083v1", "published_at": "2026-09-03", "score": 0.477, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04083.png", "title": "CORE: Improving Compositional Reasoning in MLLM Embedding via Reranker Distillation", "tldr": "\u7528\u91cd\u6392\u5668\u84b8\u998f\u63d0\u5347\u591a\u6a21\u6001\u7ec4\u5408\u68c0\u7d22", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa CORE\uff0c\u5c06\u540c\u4e00\u591a\u6a21\u6001\u5927\u6a21\u578b\u4f5c\u4e3a\u4ea4\u53c9\u6ce8\u610f\u529b\u91cd\u6392\u5668\u5f97\u5230\u7684\u7ec6\u7c92\u5ea6\u7ec4\u5408\u5224\u65ad\uff0c\u84b8\u998f\u5230\u5d4c\u5165\u6a21\u578b\u4e2d\u3002\u5b83\u6784\u9020\u8986\u76d6\u4e94\u7ea7\u7ec4\u5408\u5339\u914d\u7684\u5019\u9009\u5217\u8868\uff0c\u5e76\u7528 Rank-KL \u5217\u8868\u5f0f\u76ee\u6807\u8bad\u7ec3\u5d4c\u5165\u6a21\u578b\u590d\u73b0\u91cd\u6392\u5668\u6392\u5e8f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u6a21\u6001\u91cd\u6392\u5668\u7684\u7ec4\u5408\u63a8\u7406\u80fd\u529b\u6709\u6548\u8fc1\u79fb\u5230\u9ad8\u6548\u5d4c\u5165\u68c0\u7d22\u6a21\u578b\u4e2d\uff0c\u5728\u63d0\u5347\u7ec4\u5408\u7406\u89e3\u7684\u540c\u65f6\u4e0d\u727a\u7272 COCO\u3001Flickr30K \u7b49\u5e38\u89c4\u68c0\u7d22\u6027\u80fd\uff0c\u5bf9\u591a\u6a21\u6001\u641c\u7d22\u548c\u7ec6\u7c92\u5ea6\u56fe\u6587\u5339\u914d\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Scaling interactive and verifiable environments is critical for training terminal agents. As frontier models become more capable, environments synthesized from scratch become less challenging and thus provide limited learning signals. Recent co-evolution methods iteratively synthesize environments near the model\u0027s learnable frontier based on weaknesses exposed during rollouts. However, their dependence on on-policy rollouts limits generalization and the continuous provision of learning signals as the model becomes stronger. In this paper, we propose environment evolution, which incrementally increases environment difficulty off-policy and schedules the evolved environments generation by generation during training to provide continuous learning signals. We derive three evolution directions that influence environment difficulty from the multi-turn learning objective and then implement evolution along these directions through a loop-engineered multi-agent harness. Quantitative rollout experiments with Hy4 preview, Claude Opus 5, and GPT-5.6 Sol show that environment evolution consistently produces more difficult environments. We validate its effectiveness on Qwen3.6-27B and Qwen3.6-35B-A3B through simple long-horizon RL training, improving their performance by 14.4 and 18.0 percentage points on Terminal-Bench 2.1, respectively.", "arxiv_id": "2609.04128", "arxiv_url": "https://arxiv.org/abs/2609.04128", "authors": ["Zhiyuan Fan", "Tinghao Yu", "Yuanjun Cai", "Jiang Zhou", "Jiangtao Guan", "Jincheng Liu", "Yun Yang", "Dingxin Hu", "Zhuo Han", "Xing Wu", "Feng Zhang", "Lilin Wang"], "brief": "\u672c\u6587\u63d0\u51fa environment evolution\uff1a\u4e00\u79cd\u79bb\u7b56\u7565\u5730\u9010\u4ee3\u63d0\u5347\u7ec8\u7aef\u4efb\u52a1\u73af\u5883\u96be\u5ea6\u7684\u65b9\u6cd5\uff0c\u7528\u4e8e\u4e3a\u7ec8\u7aef\u667a\u80fd\u4f53\u6301\u7eed\u63d0\u4f9b\u53ef\u5b66\u4e60\u4fe1\u53f7\u3002\u4f5c\u8005\u4ece\u591a\u8f6e\u5b66\u4e60\u76ee\u6807\u4e2d\u63a8\u5bfc\u51fa\u4e09\u7c7b\u5f71\u54cd\u96be\u5ea6\u7684\u6f14\u5316\u65b9\u5411\uff0c\u5e76\u7528\u591a\u667a\u80fd\u4f53\u5faa\u73af\u5de5\u7a0b\u6846\u67b6\u81ea\u52a8\u751f\u6210\u6f14\u5316\u73af\u5883\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04128", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u76f8\u6bd4\u4f9d\u8d56\u5728\u7ebf rollout \u7684\u5171\u6f14\u5316\u65b9\u6cd5\uff0c\u8be5\u65b9\u6cd5\u79bb\u7b56\u7565\u6f14\u5316\u73af\u5883\uff0c\u51cf\u5c11\u5bf9\u5f53\u524d\u6a21\u578b\u5931\u8d25\u8f68\u8ff9\u7684\u4f9d\u8d56\uff0c\u63d0\u5347\u6cdb\u5316\u4e0e\u6301\u7eed\u8bad\u7ec3\u80fd\u529b\u3002", "\u5728 Hy4 preview\u3001Claude Opus 5\u3001GPT-5.6 Sol \u4e0a\u7684\u5b9a\u91cf rollout \u5b9e\u9a8c\u663e\u793a\uff0c\u6f14\u5316\u540e\u7684\u73af\u5883\u7a33\u5b9a\u66f4\u96be\u3002", "\u5728 Qwen3.6-27B \u548c Qwen3.6-35B-A3B \u4e0a\u8fdb\u884c\u957f\u7a0b\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0cTerminal-Bench 2.1 \u5206\u522b\u63d0\u5347 14.4 \u548c 18.0 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u73af\u5883\u751f\u6210", "\u7ec8\u7aef\u4efb\u52a1"], "num_comments": 0, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2609.04128v1", "published_at": "2026-09-03", "score": 0.454, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04128.png", "title": "Environment Evolution for Terminal Agents", "tldr": "\u7528\u73af\u5883\u6f14\u5316\u6301\u7eed\u63d0\u5347\u7ec8\u7aef\u667a\u80fd\u4f53\u8bad\u7ec3\u96be\u5ea6", "upvotes": 2, "what_it_is": "\u672c\u6587\u63d0\u51fa environment evolution\uff1a\u4e00\u79cd\u79bb\u7b56\u7565\u5730\u9010\u4ee3\u63d0\u5347\u7ec8\u7aef\u4efb\u52a1\u73af\u5883\u96be\u5ea6\u7684\u65b9\u6cd5\uff0c\u7528\u4e8e\u4e3a\u7ec8\u7aef\u667a\u80fd\u4f53\u6301\u7eed\u63d0\u4f9b\u53ef\u5b66\u4e60\u4fe1\u53f7\u3002\u4f5c\u8005\u4ece\u591a\u8f6e\u5b66\u4e60\u76ee\u6807\u4e2d\u63a8\u5bfc\u51fa\u4e09\u7c7b\u5f71\u54cd\u96be\u5ea6\u7684\u6f14\u5316\u65b9\u5411\uff0c\u5e76\u7528\u591a\u667a\u80fd\u4f53\u5faa\u73af\u5de5\u7a0b\u6846\u67b6\u81ea\u52a8\u751f\u6210\u6f14\u5316\u73af\u5883\u3002", "why_notable": "\u7ec8\u7aef\u667a\u80fd\u4f53\u8bad\u7ec3\u7684\u74f6\u9888\u4e4b\u4e00\u662f\u7f3a\u5c11\u96be\u5ea6\u53ef\u63a7\u3001\u53ef\u9a8c\u8bc1\u4e14\u80fd\u968f\u6a21\u578b\u80fd\u529b\u589e\u957f\u800c\u6301\u7eed\u63d0\u4f9b\u4fe1\u53f7\u7684\u73af\u5883\uff1b\u8be5\u5de5\u4f5c\u5c06\u73af\u5883\u751f\u6210\u4ece\u4e00\u6b21\u6027\u5408\u6210\u63a8\u8fdb\u5230\u53ef\u8c03\u5ea6\u7684\u9010\u4ee3\u6f14\u5316\uff0c\u5bf9\u63d0\u5347\u957f\u7a0b computer use/terminal agent \u7684\u8bad\u7ec3\u6548\u7387\u548c\u4e0a\u9650\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present FoldingAgent, an agentic framework for inferring explicit parametric folding programs directly from origami demonstration videos. Our framework leverages the reasoning power of a pre-trained Vision-Language Model (VLM) equipped with a suite of specialized tools that enable the agent to simulate geometric transitions, verify physical plausibility, retrieve and compare visual content, and evaluate its own predictions. To translate visual content into folding programs, we define a parametric space that consists of the paper\u0027s geometry and a set of parametric folding actions. Unlike models that predict static crease patterns, our agent operates sequentially and possesses the ability to re-plan its actions, effectively mitigating the compounding errors inherent in multi-step folding. Our approach takes a step toward closing the gap between human origami knowledge, which is primarily shared through unstructured visual demonstrations, and computational methods, which typically rely on structured, parametric representations such as a crease pattern or an executable parametric plan. We evaluate our approach on PurelandFold, a newly curated benchmark of diverse Pureland origami videos with ground-truth geometry and action labels. Our results demonstrate that by combining VLM reasoning with a set of specialized tools and physical simulation, we can successfully transform unstructured visual demonstrations into executable, physically plausible folding procedures.", "arxiv_id": "2609.00377", "arxiv_url": "https://arxiv.org/abs/2609.00377", "authors": ["Maya Moriya", "Sigal Raab", "Yael Vinker", "Tali Dekel"], "brief": "\u8bba\u6587\u63d0\u51fa FoldingAgent\uff0c\u4e00\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3 VLM \u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u4ece\u6298\u7eb8\u6f14\u793a\u89c6\u9891\u4e2d\u987a\u5e8f\u63a8\u65ad\u663e\u5f0f\u7684\u53c2\u6570\u5316\u6298\u53e0\u7a0b\u5e8f\u3002\u5b83\u5c06\u7eb8\u5f20\u51e0\u4f55\u4e0e\u53c2\u6570\u5316\u6298\u53e0\u52a8\u4f5c\u7ed3\u5408\uff0c\u5e76\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u3001\u7269\u7406\u4eff\u771f\u4e0e\u81ea\u6211\u8bc4\u4f30\u751f\u6210\u53ef\u6267\u884c\u4e14\u7269\u7406\u5408\u7406\u7684\u6298\u7eb8\u6b65\u9aa4\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00377", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5b9a\u4e49\u4e86\u5305\u542b\u7eb8\u5f20\u51e0\u4f55\u4e0e\u53c2\u6570\u5316\u6298\u53e0\u52a8\u4f5c\u7684\u8868\u793a\u7a7a\u95f4\uff0c\u4e0d\u53ea\u9884\u6d4b\u9759\u6001\u6298\u75d5\u56fe\uff0c\u800c\u662f\u751f\u6210\u987a\u5e8f\u6298\u53e0\u8ba1\u5212", "\u4e3a VLM \u914d\u5907\u51e0\u4f55\u8f6c\u79fb\u4eff\u771f\u3001\u7269\u7406\u53ef\u884c\u6027\u9a8c\u8bc1\u3001\u89c6\u89c9\u68c0\u7d22\u6bd4\u8f83\u548c\u9884\u6d4b\u8bc4\u4f30\u7b49\u4e13\u7528\u5de5\u5177\uff0c\u652f\u6301\u591a\u6b65\u63a8\u7406\u4e0e\u91cd\u89c4\u5212", "\u6784\u5efa PurelandFold \u57fa\u51c6\uff0c\u5305\u542b\u591a\u6837\u5316 Pureland \u6298\u7eb8\u89c6\u9891\u53ca\u5bf9\u5e94\u51e0\u4f55\u548c\u52a8\u4f5c\u6807\u7b7e\uff0c\u7528\u4e8e\u8bc4\u4f30\u89c6\u9891\u5230\u6298\u53e0\u7a0b\u5e8f\u7684\u8f6c\u6362\u80fd\u529b"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u673a\u5668\u4eba\u64cd\u4f5c"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.00377v1", "published_at": "2026-08-31", "score": 0.368, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00377.png", "title": "FoldingAgent: Inferring Parametric Origami Procedures from Demonstration Videos", "tldr": "\u4ece\u6298\u7eb8\u89c6\u9891\u63a8\u65ad\u53ef\u6267\u884c\u53c2\u6570\u5316\u6298\u53e0\u7a0b\u5e8f", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa FoldingAgent\uff0c\u4e00\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3 VLM \u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u4ece\u6298\u7eb8\u6f14\u793a\u89c6\u9891\u4e2d\u987a\u5e8f\u63a8\u65ad\u663e\u5f0f\u7684\u53c2\u6570\u5316\u6298\u53e0\u7a0b\u5e8f\u3002\u5b83\u5c06\u7eb8\u5f20\u51e0\u4f55\u4e0e\u53c2\u6570\u5316\u6298\u53e0\u52a8\u4f5c\u7ed3\u5408\uff0c\u5e76\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u3001\u7269\u7406\u4eff\u771f\u4e0e\u81ea\u6211\u8bc4\u4f30\u751f\u6210\u53ef\u6267\u884c\u4e14\u7269\u7406\u5408\u7406\u7684\u6298\u7eb8\u6b65\u9aa4\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u975e\u7ed3\u6784\u5316\u7684\u4eba\u7c7b\u6298\u7eb8\u6f14\u793a\u89c6\u9891\u8f6c\u5316\u4e3a\u7ed3\u6784\u5316\u3001\u53ef\u6267\u884c\u7684\u53c2\u6570\u5316\u7a0b\u5e8f\uff0c\u5c55\u793a\u4e86 VLM \u667a\u80fd\u4f53\u7ed3\u5408\u4e13\u7528\u5de5\u5177\u548c\u7269\u7406\u4eff\u771f\u7684\u6f5c\u529b\uff0c\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u3001\u7a0b\u5e8f\u5f52\u7eb3\u548c\u89c6\u9891\u7406\u89e3\u90fd\u6709\u542f\u53d1\u4ef7\u503c\u3002"}, {"abstract": "Professional agent tasks often depend on conventions that are absent from public corpora, yet benchmarks rarely control whether an agent has access to those conventions. We introduce a knowledge-gated task-construction protocol that separates a task instruction from a compact artefact containing private conventions, reference tables, and utility operators. Construction-time provenance, byte-identical task instructions across the provided- and withheld-artefact conditions, leak audits, and executable witnesses make dependence on the artefact explicit and testable. Across fifteen calibration tasks, one frontier agent configuration achieves a 68.0% pass rate with the artefact and 0% without it; on one task, a plausible but incorrect artefact also yields 0% across five trials. Deterministic solvers and rule corpora provide exact ground truth for structured tasks, while named criterion-level rubrics support outputs that cannot be checked by a single executable oracle. A configuration-relative calibration screen retains seven tasks satisfying our five-trial empirical knowledge-gating screen. These experiments validate the behavior of the construction protocol; they do not establish that the retained tasks improve post-training. We publicly release part of the task suite and supporting tooling at https://github.com/DatagridsAI/Knowledge-Gated-Task-Construction.", "arxiv_id": "2608.30322", "arxiv_url": "https://arxiv.org/abs/2608.30322", "authors": ["Hanlin Tian", "Minhao Li", "Yu Mi", "Sihan Zhu", "Zhao Yang", "Yuxiang Wang", "Hongquan Zhu", "Qiufei Hu"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u77e5\u8bc6\u95e8\u63a7\u4efb\u52a1\u6784\u5efa\u534f\u8bae\uff0c\u5c06\u4efb\u52a1\u6307\u4ee4\u4e0e\u5305\u542b\u79c1\u6709\u7ea6\u5b9a\u3001\u53c2\u8003\u8868\u548c\u5de5\u5177\u7b97\u5b50\u7684\u7d27\u51d1 artefact \u5206\u79bb\u3002\u901a\u8fc7\u6765\u6e90\u8bb0\u5f55\u3001\u6cc4\u6f0f\u5ba1\u8ba1\u3001\u53ef\u6267\u884c\u89c1\u8bc1\u548c\u76f8\u540c\u4efb\u52a1\u6307\u4ee4\u5bf9\u7167\uff0c\u663e\u5f0f\u68c0\u9a8c\u667a\u80fd\u4f53\u5931\u8d25\u7a76\u7adf\u6e90\u4e8e\u7f3a\u77e5\u8bc6\u8fd8\u662f\u80fd\u529b\u4e0d\u8db3\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30322", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u572815\u4e2a\u6821\u51c6\u4efb\u52a1\u4e0a\uff0c\u67d0\u524d\u6cbf\u667a\u80fd\u4f53\u914d\u7f6e\u5728\u63d0\u4f9b artefact \u65f6\u901a\u8fc7\u7387\u8fbe68.0%\uff0c\u672a\u63d0\u4f9b\u65f6\u4e3a0%\u3002", "\u534f\u8bae\u8981\u6c42\u63d0\u4f9b/\u9690\u85cf artefact \u4e24\u79cd\u6761\u4ef6\u4e0b\u4efb\u52a1\u6307\u4ee4\u5b57\u8282\u7ea7\u4e00\u81f4\uff0c\u5e76\u914d\u5408\u6cc4\u6f0f\u5ba1\u8ba1\u4e0e\u53ef\u6267\u884c\u89c1\u8bc1\u6765\u9a8c\u8bc1\u77e5\u8bc6\u4f9d\u8d56\u3002", "\u7ed3\u6784\u5316\u4efb\u52a1\u4f7f\u7528\u786e\u5b9a\u6027\u6c42\u89e3\u5668\u548c\u89c4\u5219\u8bed\u6599\u7ed9\u51fa\u7cbe\u786e\u771f\u503c\uff1b\u96be\u4ee5\u5355\u4e00\u7a0b\u5e8f\u5224\u5b9a\u7684\u8f93\u51fa\u5219\u91c7\u7528\u547d\u540d\u51c6\u5219\u7ea7\u8bc4\u5206\u89c4\u7ea6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u53ef\u9a8c\u8bc1\u4efb\u52a1", "\u77e5\u8bc6\u95e8\u63a7"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30322v1", "published_at": "2026-08-31", "score": 0.363, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30322.png", "title": "Ignorance or Incompetence? Constructing Knowledge-Gated, Verifiable Tasks for LLM Agents", "tldr": "\u6784\u5efa\u53ef\u9a8c\u8bc1\u7684\u77e5\u8bc6\u95e8\u63a7LLM\u667a\u80fd\u4f53\u4efb\u52a1", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u77e5\u8bc6\u95e8\u63a7\u4efb\u52a1\u6784\u5efa\u534f\u8bae\uff0c\u5c06\u4efb\u52a1\u6307\u4ee4\u4e0e\u5305\u542b\u79c1\u6709\u7ea6\u5b9a\u3001\u53c2\u8003\u8868\u548c\u5de5\u5177\u7b97\u5b50\u7684\u7d27\u51d1 artefact \u5206\u79bb\u3002\u901a\u8fc7\u6765\u6e90\u8bb0\u5f55\u3001\u6cc4\u6f0f\u5ba1\u8ba1\u3001\u53ef\u6267\u884c\u89c1\u8bc1\u548c\u76f8\u540c\u4efb\u52a1\u6307\u4ee4\u5bf9\u7167\uff0c\u663e\u5f0f\u68c0\u9a8c\u667a\u80fd\u4f53\u5931\u8d25\u7a76\u7adf\u6e90\u4e8e\u7f3a\u77e5\u8bc6\u8fd8\u662f\u80fd\u529b\u4e0d\u8db3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aLLM\u667a\u80fd\u4f53\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u4e25\u683c\u7684\u56e0\u679c\u63a7\u5236\uff1a\u53ef\u4ee5\u533a\u5206\u6a21\u578b\u662f\u5426\u7f3a\u5c11\u79c1\u6709\u9886\u57df\u77e5\u8bc6\uff0c\u8fd8\u662f\u5177\u5907\u77e5\u8bc6\u4ecd\u65e0\u6cd5\u5b8c\u6210\u4efb\u52a1\u3002\u5b83\u6709\u52a9\u4e8e\u6784\u5efa\u66f4\u8d34\u8fd1\u4e13\u4e1a\u573a\u666f\u3001\u53ef\u590d\u73b0\u4e14\u53ef\u5ba1\u8ba1\u7684\u667a\u80fd\u4f53\u57fa\u51c6\u3002"}, {"abstract": "Agent performance depends jointly on the model parameters and the executable harness code that manages context and control flow. Optimizing either component in isolation can leave the system bottlenecked by its frozen counterpart: weight updates can change which harness is effective, while harness updates can change which model capabilities are exposed. Existing joint-adaptation methods optimize weights and textual prompts but leave the broader harness fixed. We propose Weight-Harness Alternating LEarning (WHALE), a simple recipe that alternates two phases: updating the model under the current harness, then searching for a better harness under the updated model. We instantiate these two phases with online rejection-sampling fine-tuning and Meta-Harness, respectively. When to switch is a key design choice: to separate real improvements from noise without over-optimizing against a changing counterpart, WHALE uses either fixed phase durations or an adaptive patience rule over training signals. Using Qwen3.5-2B/4B agents across three domains (search question answering, mathematical reasoning, and chess puzzles), WHALE outperforms weight-only, harness-only, and Fast-Slow Training by 4.15-24.38 percentage points in best mean@8 accuracy. Either component can be the bottleneck: harness search matches peak weight-only accuracy with far fewer rollouts in SearchQA, but improves math accuracy only after a weight update. Small interleaved updates also outperform stagewise weight-then-harness optimization in accuracy and rollout cost. The code is available at https://github.com/krafton-ai/WHALE.", "arxiv_id": "2609.00196", "arxiv_url": "https://arxiv.org/abs/2609.00196", "authors": ["Haechan Kim", "Yoonho Lee", "Gisang Lee", "Chelsea Finn", "Kangwook Lee"], "brief": "\u8bba\u6587\u63d0\u51fa WHALE\uff08Weight-Harness Alternating LEarning\uff09\uff0c\u5728\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u4ea4\u66ff\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u4e0e\u53ef\u6267\u884c harness \u4ee3\u7801\uff0c\u4ee5\u8054\u5408\u63d0\u5347\u4e0a\u4e0b\u6587\u7ba1\u7406\u548c\u63a7\u5236\u6d41\u80fd\u529b\u3002\u65b9\u6cd5\u7ed3\u5408\u5728\u7ebf\u62d2\u7edd\u91c7\u6837\u5fae\u8c03\u4e0e Meta-Harness \u641c\u7d22\uff0c\u5e76\u7528\u56fa\u5b9a\u9636\u6bb5\u6216\u81ea\u9002\u5e94 patience \u89c4\u5219\u51b3\u5b9a\u5207\u6362\u65f6\u673a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/krafton-ai/WHALE", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2609.00196", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9\u6a21\u578b\u6743\u91cd\u4e0e harness \u76f8\u4e92\u5236\u7ea6\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u4ea4\u66ff\u5f0f\u8054\u5408\u4f18\u5316\u6d41\u7a0b\uff0c\u800c\u975e\u53ea\u4f18\u5316\u6743\u91cd\u6216\u63d0\u793a\u8bcd\u3002", "\u5728 SearchQA\u3001\u6570\u5b66\u63a8\u7406\u3001\u56fd\u9645\u8c61\u68cb\u8c1c\u9898\u4e09\u4e2a\u4efb\u52a1\u4e0a\uff0c\u4f7f\u7528 Qwen3.5-2B/4B \u667a\u80fd\u4f53\u9a8c\u8bc1\uff0cbest mean@8 \u51c6\u786e\u7387\u8f83\u57fa\u7ebf\u63d0\u5347 4.15\u201324.38 \u4e2a\u767e\u5206\u70b9\u3002", "\u5b9e\u9a8c\u663e\u793a\u4e0d\u540c\u4efb\u52a1\u74f6\u9888\u4e0d\u540c\uff1aSearchQA \u4e2d harness \u641c\u7d22\u53ef\u7528\u66f4\u5c11 rollout \u63a5\u8fd1\u6743\u91cd\u4f18\u5316\u5cf0\u503c\uff0c\u800c\u6570\u5b66\u4efb\u52a1\u9700\u5148\u66f4\u65b0\u6743\u91cd\u540e harness \u624d\u663e\u8457\u53d7\u76ca\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u5fae\u8c03", "\u81ea\u52a8\u5316\u4f18\u5316", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "KRAFTON", "pdf_url": "https://arxiv.org/pdf/2609.00196v1", "published_at": "2026-08-31", "score": 0.319, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00196.png", "title": "WHALE: A Simple Recipe for Joint Harness-Weight Optimization", "tldr": "\u4ea4\u66ff\u4f18\u5316\u6a21\u578b\u6743\u91cd\u4e0e\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6", "upvotes": 28, "what_it_is": "\u8bba\u6587\u63d0\u51fa WHALE\uff08Weight-Harness Alternating LEarning\uff09\uff0c\u5728\u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u4ea4\u66ff\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u4e0e\u53ef\u6267\u884c harness \u4ee3\u7801\uff0c\u4ee5\u8054\u5408\u63d0\u5347\u4e0a\u4e0b\u6587\u7ba1\u7406\u548c\u63a7\u5236\u6d41\u80fd\u529b\u3002\u65b9\u6cd5\u7ed3\u5408\u5728\u7ebf\u62d2\u7edd\u91c7\u6837\u5fae\u8c03\u4e0e Meta-Harness \u641c\u7d22\uff0c\u5e76\u7528\u56fa\u5b9a\u9636\u6bb5\u6216\u81ea\u9002\u5e94 patience \u89c4\u5219\u51b3\u5b9a\u5207\u6362\u65f6\u673a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u7684\u201c\u6a21\u578b\u80fd\u529b\u201d\u548c\u201c\u6267\u884c\u6846\u67b6\u4ee3\u7801\u201d\u89c6\u4e3a\u5171\u540c\u53ef\u8bad\u7ec3\u5bf9\u8c61\uff0c\u6269\u5c55\u4e86\u73b0\u6709\u53ea\u8c03\u6743\u91cd\u6216\u63d0\u793a\u8bcd\u7684\u65b9\u6cd5\uff1b\u5bf9\u6784\u5efa\u66f4\u9ad8\u6548\u3001\u53ef\u81ea\u52a8\u6539\u8fdb\u7684 LLM agent \u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce LLaDA-Image, a unified framework that pairs a 6B Diffusion Transformer (DiT) trained from scratch with a frozen vision-language understanding module built on the LLaDA2.0-Mini diffusion language model backbone. Instead of relying heavily on paired image-text data from the beginning, we first build a strong visual generative prior through image-only pre-training and mid-training. The generation pipeline comprises 220M samples, 98 of which are real images. For efficient and scalable optimization, we use parameter-free RMSNorm throughout the DiT together with the Muon optimizer. The resulting unified model produces highly photorealistic images while accurately following fine-grained editing instructions. We further distill LLaDA-Image into LLaDA-Image-Turbo, enabling fast inference in 2-4 sampling steps. On Qwen-Image-Bench, LLaDA-Image achieves overall scores of 53.53 and 53.38 on the English and Chinese tracks, respectively, setting a new state-of-the-art among open-source models on both tracks. To support further research on capable and efficient generative models, we release our model weights, training code, and detailed recipes.", "arxiv_id": "2609.03796", "arxiv_url": "https://arxiv.org/abs/2609.03796", "authors": ["Chuyan Chen", "Haoxing Chen", "Kun Chen", "Zhenglin Cheng", "Long Cui", "Ruishan Fang", "Zhangxuan Gu", "Zhicheng Huang", "Zhenzhong Lan", "Yuanting Lei", "Haoquan Li", "Jianguo Li", "Rongchuan Li", "Sidu Li", "Tao Lin", "Deyuan Liu", "Jiacheng Liu", "Lin Liu", "Yuxuan Lou", "Zhisheng Lu", "Yuxin Ma", "Shuheng Shen", "Peng Sun", "Chaoyang Wang", "Hongjun Wang", "Xiaomei Wang", "Yongxin Wang", "Chengzhang Wu", "Hongru Wu", "Jun Xie"], "brief": "\u8bba\u6587\u63d0\u51fa LLaDA-Image\uff1a\u4e00\u4e2a\u5c06\u4ece\u96f6\u8bad\u7ec3\u7684 6B Diffusion Transformer \u4e0e\u51bb\u7ed3\u7684 LLaDA2.0-Mini \u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u6a21\u5757\u7ed3\u5408\u7684\u7edf\u4e00\u56fe\u50cf\u751f\u6210\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u56fe\u50cf-only \u9884\u8bad\u7ec3/\u4e2d\u671f\u8bad\u7ec3\u5148\u5efa\u7acb\u5f3a\u89c6\u89c9\u751f\u6210\u5148\u9a8c\uff0c\u518d\u652f\u6301\u9ad8\u4fdd\u771f\u6587\u751f\u56fe\u4e0e\u7ec6\u7c92\u5ea6\u56fe\u50cf\u7f16\u8f91\uff0c\u5e76\u84b8\u998f\u51fa\u5feb\u901f\u7248 LLaDA-Image-Turbo\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03796", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 6B DiT \u4ece\u96f6\u8bad\u7ec3\uff0c\u5e76\u7ed3\u5408\u57fa\u4e8e\u6269\u6563\u8bed\u8a00\u6a21\u578b LLaDA2.0-Mini \u7684\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u6a21\u5757\u3002", "\u8bad\u7ec3\u7b56\u7565\u5148\u4f9d\u8d56\u5927\u89c4\u6a21\u56fe\u50cf-only \u6570\u636e\u5efa\u7acb\u751f\u6210\u5148\u9a8c\uff0c\u518d\u8fdb\u884c\u540e\u7eed\u5bf9\u9f50\uff1b\u6574\u4f53\u751f\u6210\u7ba1\u7ebf\u6d89\u53ca 2.2 \u4ebf\u6837\u672c\u3002", "\u4f7f\u7528\u65e0\u53c2\u6570 RMSNorm \u4e0e Muon \u4f18\u5316\u5668\u63d0\u5347\u53ef\u6269\u5c55\u8bad\u7ec3\u6548\u7387\uff0c\u5e76\u84b8\u998f\u51fa 2-4 \u6b65\u91c7\u6837\u7684 Turbo \u7248\u672c\u3002"], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001", "\u5f00\u6e90\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "inclusionAI", "pdf_url": "https://arxiv.org/pdf/2609.03796v1", "published_at": "2026-09-03", "score": 0.312, "selected_reasons": ["HF trending (61\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03796.png", "title": "LLaDA-Image: Building Strong Image Generators with Fully Open Training Recipes", "tldr": "\u5168\u5f00\u6e90\u8bad\u7ec3\u914d\u65b9\u6253\u9020\u5f3a\u56fe\u50cf\u751f\u6210\u6a21\u578b", "upvotes": 61, "what_it_is": "\u8bba\u6587\u63d0\u51fa LLaDA-Image\uff1a\u4e00\u4e2a\u5c06\u4ece\u96f6\u8bad\u7ec3\u7684 6B Diffusion Transformer \u4e0e\u51bb\u7ed3\u7684 LLaDA2.0-Mini \u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u6a21\u5757\u7ed3\u5408\u7684\u7edf\u4e00\u56fe\u50cf\u751f\u6210\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u56fe\u50cf-only \u9884\u8bad\u7ec3/\u4e2d\u671f\u8bad\u7ec3\u5148\u5efa\u7acb\u5f3a\u89c6\u89c9\u751f\u6210\u5148\u9a8c\uff0c\u518d\u652f\u6301\u9ad8\u4fdd\u771f\u6587\u751f\u56fe\u4e0e\u7ec6\u7c92\u5ea6\u56fe\u50cf\u7f16\u8f91\uff0c\u5e76\u84b8\u998f\u51fa\u5feb\u901f\u7248 LLaDA-Image-Turbo\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u4ec5\u5728 Qwen-Image-Bench \u82f1\u6587\u4e0e\u4e2d\u6587\u8d5b\u9053\u5747\u8fbe\u5230\u5f00\u6e90\u6a21\u578b\u65b0 SOTA\uff0c\u8fd8\u516c\u5f00\u6a21\u578b\u6743\u91cd\u3001\u8bad\u7ec3\u4ee3\u7801\u4e0e\u8be6\u7ec6\u914d\u65b9\uff0c\u5bf9\u590d\u73b0\u548c\u63a8\u8fdb\u5f00\u653e\u56fe\u50cf\u751f\u6210\u6a21\u578b\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Compressed context is usually carried as human-readable text or as rendered images that must be decoded, even when its consumer is a language model. We introduce LatentPress, which writes conversational histories and long documents into a third representation: continuous memory tokens that a frozen decoder reads directly through its input-embedding interface, with no text reconstruction at inference. A small reader-matched writer compresses $4$-$16\\times$ while training only an adapter (4.2M-26.2M parameters, $\\sim\\!0.1\\%$ of the decoder). On LongMemEval, LatentPress reaches $0.504$ accuracy at $7.70\\times$ compression versus $0.490$ for uncompressed evidence, outperforming text summaries (0.184) and OCR-based compression (0.426 to 0.312). On LongBench-QA, in-domain writers match or exceed raw-context reading at $4$-$8\\times$ compression, while $16\\times$ trails raw. Writing takes 43ms per conversation, roughly an order of magnitude faster than text summarization or OCR reconstruction, and reading is $5$-$9\\times$ faster than raw context or cached OCR. We validate the interface under two transfer settings, zero-shot from UltraChat to LongMemEval memory QA and from LongMemEval-derived QA to unseen LongBench document domains, establishing direct soft tokens as a practical machine-facing context interface beyond text and vision. The implementation of the experiments could be found at: https://github.com/HJSang/LatentPress .", "arxiv_id": "2609.01507", "arxiv_url": "https://arxiv.org/abs/2609.01507", "authors": ["Zhengze Zhou", "Hejian Sang"], "brief": "LatentPress \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u673a\u5668\u8bfb\u53d6\u7684\u4e0a\u4e0b\u6587\u538b\u7f29\u65b9\u5f0f\uff1a\u5c06\u5bf9\u8bdd\u5386\u53f2\u548c\u957f\u6587\u6863\u5199\u6210\u8fde\u7eed memory tokens\uff0c\u7531\u51bb\u7ed3\u89e3\u7801\u5668\u901a\u8fc7\u8f93\u5165\u5d4c\u5165\u63a5\u53e3\u76f4\u63a5\u8bfb\u53d6\uff0c\u65e0\u9700\u5728\u63a8\u7406\u65f6\u8fd8\u539f\u4e3a\u6587\u672c\u6216\u56fe\u50cf\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01507", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ec5\u8bad\u7ec3\u4e00\u4e2a\u4e0e\u8bfb\u53d6\u6a21\u578b\u5339\u914d\u7684\u5c0f\u578b writer adapter\uff0c\u53c2\u6570\u91cf\u7ea6 4.2M-26.2M\uff0c\u7ea6\u5360\u89e3\u7801\u5668\u7684 0.1%\uff0c\u5b9e\u73b0 4-16 \u500d\u538b\u7f29\u3002", "\u5728 LongMemEval \u4e0a\u4ee5 7.70 \u500d\u538b\u7f29\u8fbe\u5230 0.504 \u51c6\u786e\u7387\uff0c\u8d85\u8fc7\u672a\u538b\u7f29\u8bc1\u636e\u7684 0.490\uff0c\u5e76\u663e\u8457\u4f18\u4e8e\u6587\u672c\u6458\u8981\u548c OCR \u538b\u7f29\u3002", "\u5199\u5165\u6bcf\u6bb5\u5bf9\u8bdd\u7ea6 43ms\uff0c\u8bfb\u53d6\u901f\u5ea6\u6bd4\u539f\u59cb\u4e0a\u4e0b\u6587\u6216\u7f13\u5b58 OCR \u5feb 5-9 \u500d\uff0c\u5e76\u9a8c\u8bc1\u4e86\u8de8\u6570\u636e\u57df\u96f6\u6837\u672c\u8fc1\u79fb\u80fd\u529b\u3002"], "keywords": ["\u4e0a\u4e0b\u6587\u538b\u7f29", "\u957f\u4e0a\u4e0b\u6587", "\u8f6f\u4ee4\u724c", "\u6a21\u578b\u8bb0\u5fc6"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01507v2", "published_at": "2026-09-01", "score": 0.306, "selected_reasons": ["HF trending (49\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01507.png", "title": "LatentPress: Context Compression Beyond Text and Vision", "tldr": "\u7528\u8fde\u7eed\u8f6f\u4ee4\u724c\u9ad8\u6548\u538b\u7f29\u957f\u4e0a\u4e0b\u6587", "upvotes": 49, "what_it_is": "LatentPress \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u673a\u5668\u8bfb\u53d6\u7684\u4e0a\u4e0b\u6587\u538b\u7f29\u65b9\u5f0f\uff1a\u5c06\u5bf9\u8bdd\u5386\u53f2\u548c\u957f\u6587\u6863\u5199\u6210\u8fde\u7eed memory tokens\uff0c\u7531\u51bb\u7ed3\u89e3\u7801\u5668\u901a\u8fc7\u8f93\u5165\u5d4c\u5165\u63a5\u53e3\u76f4\u63a5\u8bfb\u53d6\uff0c\u65e0\u9700\u5728\u63a8\u7406\u65f6\u8fd8\u539f\u4e3a\u6587\u672c\u6216\u56fe\u50cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e0a\u4e0b\u6587\u538b\u7f29\u4ece\u201c\u4eba\u7c7b\u53ef\u8bfb\u201d\u7684\u6587\u672c/\u56fe\u50cf\u8f6c\u5411\u201c\u6a21\u578b\u53ef\u76f4\u63a5\u6d88\u8d39\u201d\u7684\u8f6f\u4ee4\u724c\u63a5\u53e3\uff0c\u6709\u671b\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u6210\u672c\uff0c\u5e76\u4e3a\u8bb0\u5fc6\u3001\u68c0\u7d22\u589e\u5f3a\u548c\u957f\u6587\u6863\u95ee\u7b54\u63d0\u4f9b\u66f4\u9ad8\u6548\u7684\u8868\u793a\u5c42\u3002"}, {"abstract": "Hybrid LLMs pair softmax attention with linear-attention layers such as Gated DeltaNet (GDN), whose recurrent state summarizes the context in fixed size. Early community 4-bit quantizations of Qwen3.8-27B (48 GDN layers, 16 attention layers) left the GDN block in 8- or 16-bit precision -- especially its decay and write-strength gates -- on the intuition that errors in a recurrence accumulate over long contexts. We test that intuition by building Minima: NVFP4 W4A4 on all 496 linear layers, GDN included. Across perplexity at 4K/32K, MMLU-Pro, GSM8K, AIME\u002725, GPQA-Diamond, LiveCodeBench, and RULER retrieval to 64K, Minima matches BF16 within seed noise (5-task average -0.52) while being the smallest (17.5 GiB) and fastest-prefill (+14-19%) recipe we compare, and its 32K perplexity gap shrinks with position. A four-part mechanism study explains why: (i) NVFP4\u0027s 16-element block scaling localizes the residual stream\u0027s extreme outliers, equalizing activation error across layer roles; (ii) the supposedly fragile gate projections are the least sensitive -- softplus/exponential and sigmoid parameterizations compress ~11% GEMM error to ~2% output error; (iii) the delta-rule recurrence holds injected noise at a flat plateau over 32K tokens and forgets a state impulse within hundreds of steps, because each write overwrites the state along the current key direction; (iv) the per-token quantization cost washes out with context instead of compounding. We also repair a global-scale mismatch that arises when per-module-calibrated NVFP4 checkpoints are served by kernels that fuse those modules into one GEMM, and show calibrated FP8 KV-cache scales are performance-free. The result: a practical recipe -- quantize everything, ship KV scales -- and a mechanistic account of why the recurrent half of a hybrid LLM is the easy half to quantize. Checkpoint: https://huggingface.co/minima-ai/mnma_qwen3.8_27b_nvfp4", "arxiv_id": "2609.04098", "arxiv_url": "https://arxiv.org/abs/2609.04098", "authors": ["Sergii Kozyrev", "Davyd Maiboroda"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 Minima\uff0c\u5c06 Qwen3.8-27B \u6df7\u5408\u67b6\u6784\u4e2d\u7684\u5168\u90e8 496 \u4e2a\u7ebf\u6027\u5c42\uff08\u5305\u62ec Gated DeltaNet \u9012\u5f52\u5c42\uff09\u7528 NVFP4 W4A4 \u91cf\u5316\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u56f0\u60d1\u5ea6\u3001\u6570\u5b66\u3001\u4ee3\u7801\u3001\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u7b49\u4efb\u52a1\u4e0a\u63a5\u8fd1 BF16\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u663e\u5b58\u5e76\u63d0\u5347 prefill \u901f\u5ea6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04098", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728 4K/32K \u56f0\u60d1\u5ea6\u3001MMLU-Pro\u3001GSM8K\u3001AIME\u002725\u3001GPQA-Diamond\u3001LiveCodeBench\u3001RULER 64K \u68c0\u7d22\u7b49\u8bc4\u6d4b\u4e2d\uff0cMinima \u4e0e BF16 \u5dee\u8ddd\u57fa\u672c\u5728\u968f\u673a\u79cd\u5b50\u566a\u58f0\u5185\uff0c5\u4efb\u52a1\u5e73\u5747\u4ec5\u4e0b\u964d 0.52\u3002", "\u6a21\u578b\u5927\u5c0f\u964d\u81f3 17.5 GiB\uff0cprefill \u901f\u5ea6\u63d0\u5347\u7ea6 14%-19%\uff0c\u4e14 32K \u56f0\u60d1\u5ea6\u5dee\u8ddd\u968f\u4f4d\u7f6e\u589e\u52a0\u53cd\u800c\u7f29\u5c0f\u3002", "\u673a\u5236\u5206\u6790\u8868\u660e\uff1aNVFP4 \u7684 16\u5143\u7d20\u5757\u7f29\u653e\u80fd\u5c40\u90e8\u5316\u6fc0\u6d3b\u5f02\u5e38\u503c\uff0c\u95e8\u63a7\u6295\u5f71\u7ecf softplus/exponential \u4e0e sigmoid \u540e\u8bef\u5dee\u88ab\u538b\u7f29\uff0cdelta-rule \u9012\u5f52\u4e0d\u4f1a\u968f\u957f\u4e0a\u4e0b\u6587\u7d2f\u79ef\u91cf\u5316\u566a\u58f0\u3002", "\u8bba\u6587\u8fd8\u4fee\u590d\u4e86\u6a21\u5757\u7ea7\u6821\u51c6 NVFP4 \u6743\u91cd\u5728\u878d\u5408 GEMM \u63a8\u7406\u65f6\u7684\u5168\u5c40\u5c3a\u5ea6\u4e0d\u5339\u914d\u95ee\u9898\uff0c\u5e76\u8868\u660e\u6821\u51c6\u540e\u7684 FP8 KV-cache scale \u51e0\u4e4e\u65e0\u6027\u80fd\u635f\u5931\u3002"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u7ebf\u6027\u6ce8\u610f\u529b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f"], "num_comments": 1, "on_hf": true, "organization": "Minima AI", "pdf_url": "https://arxiv.org/pdf/2609.04098v1", "published_at": "2026-09-03", "score": 0.305, "selected_reasons": ["HF trending (47\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04098.png", "title": "Why Gated DeltaNet Survives 4-Bit Quantization: NVFP4 W4A4 for the Recurrent Half of a Hybrid 27B LLM", "tldr": "\u6df7\u5408LLM\u7684GDN\u5c42\u53ef\u5168\u91cf4\u6bd4\u7279\u91cf\u5316", "upvotes": 47, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 Minima\uff0c\u5c06 Qwen3.8-27B \u6df7\u5408\u67b6\u6784\u4e2d\u7684\u5168\u90e8 496 \u4e2a\u7ebf\u6027\u5c42\uff08\u5305\u62ec Gated DeltaNet \u9012\u5f52\u5c42\uff09\u7528 NVFP4 W4A4 \u91cf\u5316\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u56f0\u60d1\u5ea6\u3001\u6570\u5b66\u3001\u4ee3\u7801\u3001\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u7b49\u4efb\u52a1\u4e0a\u63a5\u8fd1 BF16\uff0c\u540c\u65f6\u663e\u8457\u964d\u4f4e\u663e\u5b58\u5e76\u63d0\u5347 prefill \u901f\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u9012\u5f52\u72b6\u6001\u5728\u4f4e\u6bd4\u7279\u91cf\u5316\u4e0b\u8bef\u5dee\u4f1a\u957f\u671f\u7d2f\u79ef\u201d\u7684\u5e38\u89c1\u76f4\u89c9\uff0c\u8bc1\u660e\u6df7\u5408 LLM \u4e2d\u7684 Gated DeltaNet \u9012\u5f52\u534a\u90e8\u5206\u53cd\u800c\u76f8\u5bf9\u6613\u91cf\u5316\u3002\u5b83\u7ed9\u51fa\u4e86\u53ef\u590d\u73b0\u7684\u5b9e\u7528\u90e8\u7f72\u65b9\u6848\uff1a\u5168\u90e8\u91cf\u5316\u5e76\u53d1\u5e03 KV scales\uff0c\u5bf9\u5927\u6a21\u578b\u4f4e\u663e\u5b58\u3001\u9ad8\u541e\u5410\u63a8\u7406\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Large language models achieve superior performance on tasks that require extended reasoning, but long chains of thought make the KV cache a severe memory bottleneck. Existing KV cache compression methods share one paradigm: score each cached token by some estimate of how much it will matter later, and keep the top-scoring ones. We show that the selection signal contributes almost nothing. Random Attention keeps the prompt and evicts uniformly at random within each attention head, computing no score at all; across four models and six reasoning tasks it matches the strongest prior evictor while serving 32-43% higher throughput than it in vLLM deployment. Controlled experiments explain this by showing that 1) the prompt is the fragile part of the cache, and most of the gap between selectors is just whether their selection signal happened to keep it; 2) the reasoning trace protects itself against eviction with redundancy at two levels, in the text (the model restates what it still needs as it works) and across attention heads (each keeps its own copy of the trace), so once the prompt is safe, a random draw retains enough copies of what the model still needs, and no score is required to pick them. Our code is publicly available at https://github.com/SalesforceAIResearch/Random-Attention.", "arxiv_id": "2609.03430", "arxiv_url": "https://arxiv.org/abs/2609.03430", "authors": ["Heng Wang", "Jielin Qiu", "Wenting Zhao", "Cheng Qian", "Liangwei Yang", "Jiawei Han", "Heng Ji", "Silvio Savarese", "Shelby Heinecke", "Huan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Random Attention\uff1a\u5728\u4fdd\u7559\u63d0\u793a\u8bcd\u7f13\u5b58\u7684\u524d\u63d0\u4e0b\uff0c\u5bf9\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u5185\u7684\u63a8\u7406\u8f68\u8ff9KV\u7f13\u5b58\u5747\u5300\u968f\u673a\u6dd8\u6c70\uff0c\u4e0d\u518d\u8ba1\u7b97\u91cd\u8981\u6027\u5206\u6570\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u6a21\u578b\u3001\u591a\u63a8\u7406\u4efb\u52a1\u4e0a\u6027\u80fd\u5ab2\u7f8e\u6700\u5f3a\u65e2\u6709\u6dd8\u6c70\u65b9\u6cd5\uff0c\u5e76\u5728 vLLM \u4e2d\u63d0\u534732%-43%\u541e\u5410\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03430", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0KV\u7f13\u5b58\u9009\u62e9\u4fe1\u53f7\u8d21\u732e\u5f88\u5c0f\uff0c\u5173\u952e\u5728\u4e8e\u662f\u5426\u4fdd\u7559\u8106\u5f31\u7684prompt\u90e8\u5206", "\u63a8\u7406\u8f68\u8ff9\u5177\u6709\u6587\u672c\u5c42\u9762\u7684\u81ea\u6211\u91cd\u590d\u548c\u6ce8\u610f\u529b\u5934\u4e4b\u95f4\u7684\u5197\u4f59\uff0c\u56e0\u6b64\u968f\u673a\u4fdd\u7559\u901a\u5e38\u5df2\u8db3\u591f", "\u57284\u4e2a\u6a21\u578b\u30016\u4e2a\u63a8\u7406\u4efb\u52a1\u4e0a\u9a8c\u8bc1\uff0c\u90e8\u7f72\u541e\u5410\u663e\u8457\u4f18\u4e8e\u9700\u6253\u5206\u7684\u7f13\u5b58\u538b\u7f29\u65b9\u6cd5"], "keywords": ["KV\u7f13\u5b58", "\u9ad8\u6548\u63a8\u7406", "\u6ce8\u610f\u529b\u673a\u5236", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Salesforce AI Research", "pdf_url": "https://arxiv.org/pdf/2609.03430v1", "published_at": "2026-09-03", "score": 0.301, "selected_reasons": ["HF trending (40\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03430.png", "title": "Random Attention: Rethinking KV Cache Eviction for Efficient Reasoning", "tldr": "\u968f\u673a\u6dd8\u6c70KV\u7f13\u5b58\u4e5f\u80fd\u9ad8\u6548\u63a8\u7406", "upvotes": 40, "what_it_is": "\u8bba\u6587\u63d0\u51fa Random Attention\uff1a\u5728\u4fdd\u7559\u63d0\u793a\u8bcd\u7f13\u5b58\u7684\u524d\u63d0\u4e0b\uff0c\u5bf9\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u5185\u7684\u63a8\u7406\u8f68\u8ff9KV\u7f13\u5b58\u5747\u5300\u968f\u673a\u6dd8\u6c70\uff0c\u4e0d\u518d\u8ba1\u7b97\u91cd\u8981\u6027\u5206\u6570\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u6a21\u578b\u3001\u591a\u63a8\u7406\u4efb\u52a1\u4e0a\u6027\u80fd\u5ab2\u7f8e\u6700\u5f3a\u65e2\u6709\u6dd8\u6c70\u65b9\u6cd5\uff0c\u5e76\u5728 vLLM \u4e2d\u63d0\u534732%-43%\u541e\u5410\u3002", "why_notable": "\u6311\u6218\u4e86KV\u7f13\u5b58\u538b\u7f29\u4e2d\u201c\u7cbe\u786e\u4f30\u8ba1token\u91cd\u8981\u6027\u201d\u7684\u4e3b\u6d41\u8303\u5f0f\uff0c\u7528\u6781\u7b80\u5355\u7684\u968f\u673a\u7b56\u7565\u83b7\u5f97\u76f8\u8fd1\u6548\u679c\u548c\u66f4\u9ad8\u7cfb\u7edf\u6548\u7387\uff0c\u5bf9\u957f\u94fe\u63a8\u7406LLM\u90e8\u7f72\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal models often build on architectures designed for generative vision-language modeling, typically combining separately pretrained vision encoders with causal language models. Visual document retrievers such as ColPali repurpose these models as encoders, carrying over the parameter and compute overhead of a VLM for a non-generative task. We introduce NeoMME, a family of 260M and 800M-parameter Multimodal and Multilingual bidirectional Encoders that process multilingual text and raw image patches in a single bidirectional Transformer encoder. Both models are pretrained from scratch with a masked discrete-diffusion text objective, conditioned on visible image patches for multimodal examples. Both support a 16,384-token context, enough to encode up to two standard 4K UHD images. To demonstrate its downstream capabilities, we fine-tune NeoMME with jointly trained dense and late-interaction heads. On the ViDoRe v3 benchmark, the resulting NeoMME-Retriever 260M outperforms all evaluated models strictly below 800M parameters with 0.523 nDCG@10, while NeoMME-Retriever 800M reaches 0.556. At a matched 2048x2048 image input size on an NVIDIA L40S, NeoMME-260M encodes pages with about 2x the throughput of ColModernVBERT. Hierarchical token pooling and asymmetric quantization compress late-interaction multimodal document embeddings by 255x while preserving over 95% of baseline nDCG@10. We contribute NeoMME to Hugging Face Transformers and release the pretrained backbone and retrieval-compatible checkpoints under Apache 2.0 at https://hf.co/collections/Hcompany/neomme.", "arxiv_id": "2609.01657", "arxiv_url": "https://arxiv.org/abs/2609.01657", "authors": ["Aur\u00e9lien Lac", "Tony Wu"], "brief": "\u8bba\u6587\u63d0\u51fa NeoMME\uff0c\u4e00\u7ec4 260M/800M \u53c2\u6570\u7684\u591a\u6a21\u6001\u591a\u8bed\u79cd\u53cc\u5411\u7f16\u7801\u5668\uff0c\u7528\u5355\u4e2a Transformer \u540c\u65f6\u5904\u7406\u6587\u672c\u4e0e\u539f\u59cb\u56fe\u50cf patch\u3002\u6a21\u578b\u4ece\u96f6\u9884\u8bad\u7ec3\uff0c\u5e76\u9762\u5411\u89c6\u89c9\u6587\u6863\u68c0\u7d22\u5fae\u8c03\u51fa dense \u4e0e late-interaction \u68c0\u7d22\u5934\u3002", "categories": ["cs.IR", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01657", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 masked discrete-diffusion \u6587\u672c\u76ee\u6807\u9884\u8bad\u7ec3\uff0c\u5e76\u5728\u591a\u6a21\u6001\u6837\u672c\u4e2d\u4ee5\u53ef\u89c1\u56fe\u50cf patch \u4f5c\u4e3a\u6761\u4ef6\u3002", "\u652f\u6301 16,384 token \u957f\u4e0a\u4e0b\u6587\uff0c\u53ef\u7f16\u7801\u6700\u591a\u4e24\u5f20\u6807\u51c6 4K UHD \u56fe\u50cf\u3002", "\u5728 ViDoRe v3 \u4e0a\uff0cNeoMME-Retriever 260M \u8fbe\u5230 0.523 nDCG@10\uff0c800M \u8fbe\u5230 0.556\uff1b260M \u5728 2048\u00d72048 \u8f93\u5165\u4e0b\u541e\u5410\u7ea6\u4e3a ColModernVBERT \u7684 2 \u500d\u3002", "\u901a\u8fc7\u5c42\u6b21\u5316 token pooling \u4e0e\u975e\u5bf9\u79f0\u91cf\u5316\uff0c\u5c06 late-interaction \u591a\u6a21\u6001\u6587\u6863\u5d4c\u5165\u538b\u7f29 255 \u500d\uff0c\u540c\u65f6\u4fdd\u7559\u8d85\u8fc7 95% \u7684 nDCG@10\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u4fe1\u606f\u68c0\u7d22", "\u591a\u8bed\u79cd", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "H company", "pdf_url": "https://arxiv.org/pdf/2609.01657v1", "published_at": "2026-08-31", "score": 0.289, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01657.png", "title": "NeoMME: A Single-Tower Multimodal-Native Multilingual Foundation Encoder for Efficient Fine-Tuning and Inference", "tldr": "\u5355\u5854\u591a\u6a21\u6001\u591a\u8bed\u79cd\u7f16\u7801\u5668\u63d0\u5347\u6587\u6863\u68c0\u7d22\u6548\u7387", "upvotes": 22, "what_it_is": "\u8bba\u6587\u63d0\u51fa NeoMME\uff0c\u4e00\u7ec4 260M/800M \u53c2\u6570\u7684\u591a\u6a21\u6001\u591a\u8bed\u79cd\u53cc\u5411\u7f16\u7801\u5668\uff0c\u7528\u5355\u4e2a Transformer \u540c\u65f6\u5904\u7406\u6587\u672c\u4e0e\u539f\u59cb\u56fe\u50cf patch\u3002\u6a21\u578b\u4ece\u96f6\u9884\u8bad\u7ec3\uff0c\u5e76\u9762\u5411\u89c6\u89c9\u6587\u6863\u68c0\u7d22\u5fae\u8c03\u51fa dense \u4e0e late-interaction \u68c0\u7d22\u5934\u3002", "why_notable": "NeoMME \u5c06\u4f20\u7edf\u89c6\u89c9\u8bed\u8a00\u751f\u6210\u6a21\u578b\u6539\u9020\u6210\u68c0\u7d22\u7f16\u7801\u5668\u7684\u9ad8\u5f00\u9500\u95ee\u9898\uff0c\u66ff\u6362\u4e3a\u539f\u751f\u5355\u5854\u53cc\u5411\u591a\u6a21\u6001\u7f16\u7801\u67b6\u6784\uff0c\u5728\u53c2\u6570\u3001\u541e\u5410\u548c\u5d4c\u5165\u5b58\u50a8\u4e0a\u66f4\u9ad8\u6548\uff0c\u5e76\u5df2\u5f00\u6e90\u5230 Hugging Face Transformers\uff0c\u5177\u5907\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "On-policy distillation (OPD) combines student-generated rollouts with dense token-level supervision from a teacher. Existing work has mainly studied its algorithmic behavior, leaving the role of training data unclear. We examine this role at the data-minimal limit by training on a single query. One-shot OPD keeps improving for hundreds of steps and recovers most of full-data OPD\u0027s gain across task domains and model families. We explain this result through the states visited during training and the rate at which the student aligns with the teacher. We measure \\emph{state coverage}, the fraction of the states full-data OPD visits that a query set\u0027s rollouts reach. A single query already reaches \\(71.5\\%\\), most of it within the first 100 steps. Adding semantically distinct queries raises coverage and validation accuracy together, until 16 queries reach \\(98.9\\%\\) and match full-data training. Yet alignment slows at a similar pace whether OPD trains on one query or the whole dataset, and even a fixed set of states takes hundreds of steps to absorb. OPD is therefore data-overfed but algorithm-starved. Its rollouts quickly expose broad supervision, while the student absorbs that supervision increasingly slowly. The state-coverage result extends to multi-teacher OPD, where 16 semantically diverse queries per domain match full-data MOPD. As a further stress test, content-light templates and off-domain WildChat queries also approach the real-query baseline. Task content and induced state coverage can therefore come apart. We hope these findings direct future work toward the step efficiency of OPD, and prompt a re-examination of the data and the mechanisms behind its recent successes in frontier post-training.", "arxiv_id": "2609.04172", "arxiv_url": "https://arxiv.org/abs/2609.04172", "authors": ["Zixuan Fu", "Bingxiang He", "Yuxin Zuo", "Haohuan Huang", "Jinqian Zhang", "Ruhang Xiao", "Cheng Qian", "Qinyu Luo", "Huan-ang Gao", "Yudong Wang", "Zhiyuan Liu", "Ning Ding", "Chaojun Xiao"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u4e2d\u8bad\u7ec3\u6570\u636e\u7684\u4f5c\u7528\uff0c\u53d1\u73b0\u5373\u4f7f\u7528\u4e00\u4e2a\u67e5\u8be2\u8bad\u7ec3\uff0c\u5b66\u751f\u6a21\u578b\u4ecd\u80fd\u6301\u7eed\u63d0\u5347\u6570\u767e\u6b65\uff0c\u5e76\u6062\u590d\u5168\u6570\u636eOPD\u7684\u5927\u90e8\u5206\u6536\u76ca\u3002\u8bba\u6587\u7528\u201c\u72b6\u6001\u8986\u76d6\u7387\u201d\u548c\u5e08\u751f\u5bf9\u9f50\u901f\u7387\u89e3\u91ca\u8fd9\u4e00\u73b0\u8c61\uff0c\u6307\u51faOPD\u66f4\u53d7\u7b97\u6cd5\u6b65\u6548\u9650\u5236\u800c\u975e\u6570\u636e\u91cf\u9650\u5236\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04172", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5355\u4e2a\u67e5\u8be2\u7684rollout\u53ef\u8986\u76d6\u5168\u6570\u636eOPD\u8bbf\u95ee\u72b6\u6001\u768471.5%\uff0c\u4e14\u5927\u90e8\u5206\u8986\u76d6\u53d1\u751f\u5728\u524d100\u6b65\u5185", "\u589e\u52a0\u8bed\u4e49\u591a\u6837\u7684\u67e5\u8be2\u4f1a\u540c\u6b65\u63d0\u5347\u72b6\u6001\u8986\u76d6\u7387\u548c\u9a8c\u8bc1\u51c6\u786e\u7387\uff0c16\u4e2a\u67e5\u8be2\u53ef\u8fbe98.9%\u72b6\u6001\u8986\u76d6\u5e76\u5339\u914d\u5168\u6570\u636e\u8bad\u7ec3", "\u65e0\u8bba\u4f7f\u7528\u4e00\u4e2a\u67e5\u8be2\u8fd8\u662f\u5b8c\u6574\u6570\u636e\u96c6\uff0c\u5b66\u751f\u5438\u6536\u6559\u5e08\u76d1\u7763\u7684\u5bf9\u9f50\u901f\u5ea6\u90fd\u4f1a\u9010\u6e10\u53d8\u6162\uff0c\u591a\u6559\u5e08OPD\u4e2d\u4e5f\u89c2\u5bdf\u5230\u7c7b\u4f3c\u7ed3\u8bba"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u540e\u8bad\u7ec3", "\u5bf9\u9f50"], "num_comments": 1, "on_hf": true, "organization": "Thinking Space", "pdf_url": "https://arxiv.org/pdf/2609.04172v1", "published_at": "2026-09-03", "score": 0.27, "selected_reasons": ["HF trending (32\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04172.png", "title": "Rethinking On-Policy Distillation of Large Language Models II: One Training Example", "tldr": "\u5355\u6837\u672cOPD\u4e5f\u80fd\u903c\u8fd1\u5168\u6570\u636e\u84b8\u998f\u6548\u679c", "upvotes": 32, "what_it_is": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u4e2d\u8bad\u7ec3\u6570\u636e\u7684\u4f5c\u7528\uff0c\u53d1\u73b0\u5373\u4f7f\u7528\u4e00\u4e2a\u67e5\u8be2\u8bad\u7ec3\uff0c\u5b66\u751f\u6a21\u578b\u4ecd\u80fd\u6301\u7eed\u63d0\u5347\u6570\u767e\u6b65\uff0c\u5e76\u6062\u590d\u5168\u6570\u636eOPD\u7684\u5927\u90e8\u5206\u6536\u76ca\u3002\u8bba\u6587\u7528\u201c\u72b6\u6001\u8986\u76d6\u7387\u201d\u548c\u5e08\u751f\u5bf9\u9f50\u901f\u7387\u89e3\u91ca\u8fd9\u4e00\u73b0\u8c61\uff0c\u6307\u51faOPD\u66f4\u53d7\u7b97\u6cd5\u6b65\u6548\u9650\u5236\u800c\u975e\u6570\u636e\u91cf\u9650\u5236\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86OPD\u9700\u8981\u5927\u91cf\u8bad\u7ec3\u6570\u636e\u7684\u76f4\u89c9\uff0c\u8868\u660e\u5176\u6210\u529f\u53ef\u80fd\u6e90\u4e8erollout\u5feb\u901f\u66b4\u9732\u5e7f\u6cdb\u72b6\u6001\uff0c\u800c\u74f6\u9888\u5728\u4e8e\u5b66\u751f\u6a21\u578b\u5438\u6536\u76d1\u7763\u7684\u6b65\u6548\u7387\u3002\u8fd9\u4e3a\u6539\u8fdb\u524d\u6cbf\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u7684\u84b8\u998f\u7b97\u6cd5\u3001\u964d\u4f4e\u6570\u636e\u9700\u6c42\u548c\u63d0\u5347\u8bad\u7ec3\u6548\u7387\u63d0\u4f9b\u4e86\u91cd\u8981\u65b9\u5411\u3002"}, {"abstract": "The attention prefilling phase of long-context LLM inference scales quadratically, making self-attention a severe computational bottleneck. Traditional sparse attention methods mitigate this through fixed patterns or offline profiling, but lack the flexibility to adapt to input-dependent attention structure. Recent dynamic methods address this by routing heads to sparse patterns in real-time, but rely on indirect routing proxies with overhead and budget allocation mechanisms that overlook the post-softmax mass hierarchy. We present CRISP (Cliff-awaRe Input-adaptive Sparse Prefilling), which identifies and addresses two structural challenges in this dynamic routing paradigm. First, we show that the routing decision can be read directly off the structure of the proxy attention map. We replace the Jensen-Shannon Divergence (JSD) routing with C_struct, a structural proxy that measures mass at Vertical-Slash compatible positions and reproduces JSD\u0027s routing decisions while eliminating both the pooled matmul and subsequent KL divergence overhead. Second, we formalize the post-softmax mass cliff and demonstrate theoretically that strictly cumulative coverage thresholds accumulate O(n) background noise at long contexts. CRISP navigates this via a sink-aware threshold grounded in the noise floor. Empirically, across InfiniteBench, RULER and LongBench on two model families, CRISP is the strongest sparse method overall and matches or exceeds exact dense attention on retrieval-heavy benchmarks, recovering up to +28.0 pp on retrieval tasks over baselines and achieving up to a 5.30x attention speedup at 512k tokens, driven primarily by our O(n) noise elimination during selection while preserving structural integrity.", "arxiv_id": "2609.01925", "arxiv_url": "https://arxiv.org/abs/2609.01925", "authors": ["Huu Huy Nguyen", "Chien Van Nguyen", "Franck Dernoncourt", "Ryan A. Rossi", "Linh Ngo Van", "Jieyang Chen", "Thien Huu Nguyen"], "brief": "CRISP \u662f\u4e00\u79cd\u9762\u5411\u957f\u4e0a\u4e0b\u6587 LLM \u63a8\u7406\u9884\u586b\u5145\u9636\u6bb5\u7684\u8f93\u5165\u81ea\u9002\u5e94\u7a00\u758f\u6ce8\u610f\u529b\u65b9\u6cd5\u3002\u5b83\u7528\u7ed3\u6784\u4ee3\u7406\u76f4\u63a5\u4ece\u6ce8\u610f\u529b\u56fe\u4e2d\u505a\u8def\u7531\uff0c\u5e76\u7528\u611f\u77e5 sink \u7684\u9608\u503c\u5904\u7406 softmax \u540e\u8d28\u91cf\u65ad\u5d16\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01925", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa C_struct \u7ed3\u6784\u4ee3\u7406\uff0c\u5ea6\u91cf Vertical-Slash \u517c\u5bb9\u4f4d\u7f6e\u7684\u6ce8\u610f\u529b\u8d28\u91cf\uff0c\u66ff\u4ee3\u57fa\u4e8e Jensen-Shannon Divergence \u7684\u8def\u7531\uff0c\u51cf\u5c11\u989d\u5916\u77e9\u9635\u4e58\u4e0e KL \u6563\u5ea6\u5f00\u9500\u3002", "\u5f62\u5f0f\u5316 post-softmax mass cliff \u73b0\u8c61\uff0c\u6307\u51fa\u4e25\u683c\u7d2f\u79ef\u8986\u76d6\u9608\u503c\u5728\u957f\u4e0a\u4e0b\u6587\u4e2d\u4f1a\u7d2f\u79ef O(n) \u80cc\u666f\u566a\u58f0\u3002", "\u5728 InfiniteBench\u3001RULER\u3001LongBench \u548c\u4e24\u4e2a\u6a21\u578b\u5bb6\u65cf\u4e0a\u9a8c\u8bc1\uff0c\u6700\u9ad8\u5728 512k tokens \u4e0b\u5b9e\u73b0 5.30x \u6ce8\u610f\u529b\u52a0\u901f\uff0c\u5e76\u5728\u68c0\u7d22\u4efb\u52a1\u4e0a\u8f83\u57fa\u7ebf\u6700\u591a\u63d0\u5347 28.0 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u7a00\u758f\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "LLM\u63a8\u7406", "\u52a8\u6001\u8def\u7531"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01925v1", "published_at": "2026-09-01", "score": 0.264, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01925.png", "title": "CRISP: Cliff-awaRe Input-adaptive Sparse Prefilling with Structural-Mass-Motivated Routing", "tldr": "\u52a8\u6001\u7a00\u758f\u9884\u586b\u5145\u52a0\u901f\u957f\u4e0a\u4e0b\u6587\u6ce8\u610f\u529b", "upvotes": 8, "what_it_is": "CRISP \u662f\u4e00\u79cd\u9762\u5411\u957f\u4e0a\u4e0b\u6587 LLM \u63a8\u7406\u9884\u586b\u5145\u9636\u6bb5\u7684\u8f93\u5165\u81ea\u9002\u5e94\u7a00\u758f\u6ce8\u610f\u529b\u65b9\u6cd5\u3002\u5b83\u7528\u7ed3\u6784\u4ee3\u7406\u76f4\u63a5\u4ece\u6ce8\u610f\u529b\u56fe\u4e2d\u505a\u8def\u7531\uff0c\u5e76\u7528\u611f\u77e5 sink \u7684\u9608\u503c\u5904\u7406 softmax \u540e\u8d28\u91cf\u65ad\u5d16\u95ee\u9898\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u540c\u65f6\u6539\u8fdb\u52a8\u6001\u7a00\u758f\u6ce8\u610f\u529b\u7684\u8def\u7531\u5f00\u9500\u4e0e\u9884\u7b97\u9009\u62e9\u673a\u5236\uff0c\u5728\u8d85\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u517c\u987e\u901f\u5ea6\u548c\u7cbe\u5ea6\uff0c\u5c24\u5176\u5bf9\u68c0\u7d22\u5bc6\u96c6\u578b\u4efb\u52a1\u6709\u663e\u8457\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Compact token sequences are essential for efficient 3D generation. However, existing 3D tokenizers typically organize latent representations either over spatial regions or as fixed-size sets of global tokens, both suffering sharp reconstruction degradation when compressed to extremely low token budgets. In this paper, we present ZipTok3D, a 3D tokenizer designed for high-fidelity reconstruction from extremely short token sequences. Its key idea is to organize object geometry into progressively informative global-token prefixes and unfold these compact representations through iterative decoding. Specifically, nested dropout randomly truncates the latent sequence after encoding during training and requires each retained prefix to reconstruct the complete object, thereby prioritizing essential geometric information in the leading tokens. The decoder then repeatedly applies a parameter-shared Transformer block to recover fine-grained geometry from each prefix without a separate generative sampling stage. With the same token dimension, ZipTok3D achieves reconstruction quality comparable to the 32-token COD-VAE baseline using only one token on ShapeNet and four on TRELLIS, yielding $32\\times$ and $8\\times$ shorter token sequences, respectively.", "arxiv_id": "2609.01740", "arxiv_url": "https://arxiv.org/abs/2609.01740", "authors": ["Mingda Lin", "Weijie Wang", "Zeyu Zhang", "Bowen Cui", "Yefei He", "Haoyu Zhao", "Yuanyu He", "Donny Y. Chen", "Feng Chen", "Bohan Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa ZipTok3D\uff0c\u4e00\u79cd\u9762\u5411\u9ad8\u65483D\u751f\u6210\u7684\u9ad8\u4fdd\u771f3D tokenizer\u3002\u5b83\u5c06\u7269\u4f53\u51e0\u4f55\u538b\u7f29\u4e3a\u9010\u6b65\u589e\u5f3a\u4fe1\u606f\u91cf\u7684\u5168\u5c40 token \u524d\u7f00\uff0c\u5e76\u901a\u8fc7\u8fed\u4ee3\u89e3\u7801\u4ece\u6781\u77ed\u5e8f\u5217\u6062\u590d\u5b8c\u6574\u7ec6\u8282\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01740", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 nested dropout \u8bad\u7ec3\uff1a\u968f\u673a\u622a\u65ad\u7f16\u7801\u540e\u7684 latent \u5e8f\u5217\uff0c\u8981\u6c42\u4efb\u610f\u4fdd\u7559\u524d\u7f00\u90fd\u80fd\u91cd\u5efa\u5b8c\u6574\u7269\u4f53\uff0c\u4ece\u800c\u628a\u5173\u952e\u51e0\u4f55\u4fe1\u606f\u538b\u5230\u524d\u90e8 token\u3002", "\u89e3\u7801\u5668\u53cd\u590d\u5e94\u7528\u53c2\u6570\u5171\u4eab\u7684 Transformer block\uff0c\u5c06\u7d27\u51d1\u524d\u7f00\u9010\u6b65\u5c55\u5f00\u4e3a\u7ec6\u7c92\u5ea6\u51e0\u4f55\u8868\u793a\uff0c\u65e0\u9700\u989d\u5916\u751f\u6210\u5f0f\u91c7\u6837\u9636\u6bb5\u3002", "\u5728\u76f8\u540c token \u7ef4\u5ea6\u4e0b\uff0cShapeNet \u4ec5\u7528 1 \u4e2a token\u3001TRELLIS \u4ec5\u7528 4 \u4e2a token \u5373\u8fbe\u5230 32-token COD-VAE \u76f8\u8fd1\u91cd\u5efa\u8d28\u91cf\uff0c\u5e8f\u5217\u957f\u5ea6\u5206\u522b\u7f29\u77ed 32 \u500d\u548c 8 \u500d\u3002"], "keywords": ["3D\u751f\u6210", "\
