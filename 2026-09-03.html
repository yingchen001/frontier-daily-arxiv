esults validate that a lightweight inference-time intervention can substantially boost GUI Agent\u0027s competence to identify inappropriate execution scenarios and refrain from unnecessary actions.", "arxiv_id": "2609.03438", "arxiv_url": "https://arxiv.org/abs/2609.03438", "authors": ["Zhaoyuan Huang", "Tianjie Ju", "Pengzhou Cheng", "Zheng Wu", "Yansi Li", "Chuanbiao Song", "Jun Lan", "Huijia Zhu", "Weiqiang Wang", "Zhuosheng Zhang"], "brief": "\u672c\u6587\u63d0\u51fa CONFLICTGUI \u57fa\u51c6\uff0c\u8bc4\u4f30\u591a\u6a21\u6001 GUI \u667a\u80fd\u4f53\u5728\u6307\u4ee4\u81ea\u76f8\u77db\u76fe\u6216\u4e0e\u754c\u9762\u72b6\u6001\u51b2\u7a81\u65f6\u662f\u5426\u80fd\u505c\u6b62\u6267\u884c\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u667a\u80fd\u4f53\u666e\u904d\u5b58\u5728\u8fc7\u5ea6\u670d\u4ece\u3001\u76f2\u76ee\u6267\u884c\u7684\u95ee\u9898\uff0c\u5e76\u63d0\u51fa\u63a8\u7406\u65f6\u6846\u67b6 CONFLICTGUARD\uff0c\u901a\u8fc7\u53ef\u884c\u6027\u9a8c\u8bc1\u4e0e\u52a8\u4f5c\u8c03\u5236\u663e\u8457\u63d0\u5347\u51b2\u7a81\u4efb\u52a1\u6210\u529f\u7387\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u6b63\u5e38\u4efb\u52a1\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03438", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "GUI\u81ea\u52a8\u5316", "\u5b89\u5168\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03438v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Do GUI Agents Know When Not to Act? Enabling Conflict-Aware Termination for Multimodal GUI Agents", "tldr": "\u672c\u6587\u63d0\u51fa CONFLICTGUI \u57fa\u51c6\uff0c\u8bc4\u4f30\u591a\u6a21\u6001 GUI \u667a\u80fd\u4f53\u5728\u6307\u4ee4\u81ea\u76f8\u77db\u76fe\u6216\u4e0e\u754c\u9762\u72b6\u6001\u51b2\u7a81\u65f6\u662f\u5426\u80fd\u505c\u6b62\u6267\u884c\u3002\u5b9e\u9a8c\u53d1\u73b0\u73b0\u6709\u667a\u80fd\u4f53\u666e\u904d\u5b58\u5728\u8fc7\u5ea6\u670d\u4ece\u3001\u76f2\u76ee\u6267\u884c\u7684\u95ee\u9898\uff0c\u5e76\u63d0\u51fa\u63a8\u7406\u65f6\u6846\u67b6 CONFLICTGUARD\uff0c\u901a\u8fc7\u53ef\u884c\u6027\u9a8c\u8bc1\u4e0e\u52a8\u4f5c\u8c03\u5236\u663e\u8457\u63d0\u5347\u51b2\u7a81\u4efb\u52a1\u6210\u529f\u7387\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u6b63\u5e38\u4efb\u52a1\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Humans are the transport layer between AI systems, losing context at every hop. We present the Civilization Framework, whose addressable party is the civilization, not the agent (one human sovereign, a persistent ledger, and interchangeable agents), and the Embassy Protocol, a carrier-agnostic overlay: messages arrive asynchronously at a resident ledger endpoint, any online agent of the receiver handles them, and commitment state on both ledgers, not delivery, is ground truth. Authority derives from memory: an agent\u0027s power to act for its civilization is capped by the memory it can access and externalized through signed credentials, separate from civilization-level reputation. We identify the temporal-weight effect, a hazard in AI-to-AI communication where what arrives first acquires unearned authority, and test it in one frontier model in a preregistered 1,908-trial experiment. With verification removed, an incorrect upstream claim arriving first captures 54.2% of answers (4.2% under full verification), while the same claim arriving after the receiver has sealed its own answer captures 31.6% (the two prompt shells are not length-matched, so part of that gap may reflect shell form; see Section 7), and both registered question-set specifications agree on these two verdicts (the exclusion specification is preregistered as under-powered). Two secondary results, the mitigation from instruction-level provenance labeling and sealed-answer accuracy equivalence, are specification-dependent, holding only under the all-questions specification. Because a registered check of tool use failed its call-budget condition, the registration classifies the round as inconclusive and every result above, primary and secondary, is reported as exploratory; a replication with harness-enforced budgets is planned. The framework\u0027s intra-civilization layer has a working implementation.", "arxiv_id": "2609.03425", "arxiv_url": "https://arxiv.org/abs/2609.03425", "authors": ["Guangjun Liu"], "brief": "\u8bba\u6587\u63d0\u51fa Civilization Framework \u548c Embassy Protocol\uff0c\u628a\u901a\u4fe1\u4e3b\u4f53\u4ece\u5355\u4e2a\u667a\u80fd\u4f53\u63d0\u5347\u4e3a\u7531\u4eba\u7c7b\u4e3b\u6743\u8005\u3001\u6301\u4e45\u8d26\u672c\u548c\u53ef\u66ff\u6362\u667a\u80fd\u4f53\u7ec4\u6210\u7684\u201c\u6587\u660e\u201d\uff0c\u7528\u8d26\u672c\u627f\u8bfa\u72b6\u6001\u4f5c\u4e3a\u4e8b\u5b9e\u4f9d\u636e\u3002\u4f5c\u8005\u8fd8\u7814\u7a76\u4e86 AI-to-AI \u901a\u4fe1\u4e2d\u7684\u201c\u5148\u5230\u65f6\u95f4\u6743\u91cd\u201d\u98ce\u9669\uff0c\u5b9e\u9a8c\u663e\u793a\u672a\u9a8c\u8bc1\u65f6\u5148\u5230\u9519\u8bef\u58f0\u660e\u4f1a\u663e\u8457\u5f71\u54cd\u56de\u7b54\uff0c\u4f46\u7531\u4e8e\u5de5\u5177\u8c03\u7528\u9884\u7b97\u68c0\u67e5\u5931\u8d25\uff0c\u7ed3\u679c\u88ab\u5f52\u4e3a\u63a2\u7d22\u6027\uff0c\u9700\u590d\u73b0\u9a8c\u8bc1\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03425", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u901a\u4fe1\u534f\u8bae", "\u53ef\u4fe1\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03425v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "The Civilization Framework: Sovereign-Anchored Communication Between Personal Multi-Agent Systems", "tldr": "\u8bba\u6587\u63d0\u51fa Civilization Framework \u548c Embassy Protocol\uff0c\u628a\u901a\u4fe1\u4e3b\u4f53\u4ece\u5355\u4e2a\u667a\u80fd\u4f53\u63d0\u5347\u4e3a\u7531\u4eba\u7c7b\u4e3b\u6743\u8005\u3001\u6301\u4e45\u8d26\u672c\u548c\u53ef\u66ff\u6362\u667a\u80fd\u4f53\u7ec4\u6210\u7684\u201c\u6587\u660e\u201d\uff0c\u7528\u8d26\u672c\u627f\u8bfa\u72b6\u6001\u4f5c\u4e3a\u4e8b\u5b9e\u4f9d\u636e\u3002\u4f5c\u8005\u8fd8\u7814\u7a76\u4e86 AI-to-AI \u901a\u4fe1\u4e2d\u7684\u201c\u5148\u5230\u65f6\u95f4\u6743\u91cd\u201d\u98ce\u9669\uff0c\u5b9e\u9a8c\u663e\u793a\u672a\u9a8c\u8bc1\u65f6\u5148\u5230\u9519\u8bef\u58f0\u660e\u4f1a\u663e\u8457\u5f71\u54cd\u56de\u7b54\uff0c\u4f46\u7531\u4e8e\u5de5\u5177\u8c03\u7528\u9884\u7b97\u68c0\u67e5\u5931\u8d25\uff0c\u7ed3\u679c\u88ab\u5f52\u4e3a\u63a2\u7d22\u6027\uff0c\u9700\u590d\u73b0\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Graph-based policy optimization improves credit assignment for long-horizon LLM agents by organizing rollout trajectories into state-transition graphs. However, existing methods construct graphs independently within each policy update, discarding transitions discovered by earlier policies and limiting advantage estimation to small, batch-local rollout groups. We propose \\emph{Temporal Instance-Graph Policy Optimization} (TIGPO), which extends graph-based credit assignment across policy updates. TIGPO maintains a persistent transition graph for each task, allowing valid transitions discovered by different policy versions to jointly determine credit for current rollouts. To actively reconnect current exploration with historical experience, TIGPO allocates a fixed rollout budget between Exploration slots for ordinary task sampling and Revisit slots for delayed reattempts of previously explored tasks. For each revisit, TIGPO pairs the current rollout group with its corresponding earlier Exploration group to construct a cross-temporal reference. The enlarged reference is designed to stabilize relative advantage estimation under small rollout groups, while comparison on the same task directly captures policy improvement across training stages. Historical transitions and scores serve only as structural and detached statistical references and are never replayed in the policy loss. Experiments on ALFWorld and WebShop demonstrate that TIGPO consistently outperforms prior group-based and graph-based policy optimization methods.", "arxiv_id": "2609.03383", "arxiv_url": "https://arxiv.org/abs/2609.03383", "authors": ["Jinwei Gan"], "brief": "TIGPO \u4e3a\u957f\u7a0b LLM \u667a\u80fd\u4f53\u63d0\u51fa\u8de8\u65f6\u95f4\u7684\u5b9e\u4f8b\u56fe\u7b56\u7565\u4f18\u5316\uff0c\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u7ef4\u62a4\u6301\u4e45\u72b6\u6001\u8f6c\u79fb\u56fe\uff0c\u628a\u4e0d\u540c\u7b56\u7565\u7248\u672c\u53d1\u73b0\u7684\u6709\u6548\u8f6c\u79fb\u7528\u4e8e\u5f53\u524d rollout \u7684\u4fe1\u7528\u5206\u914d\u3002\u5b83\u901a\u8fc7\u63a2\u7d22\u4e0e\u91cd\u8bbf\u9884\u7b97\u8fde\u63a5\u5386\u53f2\u7ecf\u9a8c\u548c\u5f53\u524d\u63a2\u7d22\uff0c\u5728\u4e0d\u56de\u653e\u5386\u53f2\u6570\u636e\u5230\u635f\u5931\u4e2d\u7684\u524d\u63d0\u4e0b\u7a33\u5b9a\u5c0f\u6837\u672c\u4f18\u52bf\u4f30\u8ba1\uff0c\u5e76\u5728 ALFWorld\u3001WebShop \u4e0a\u4f18\u4e8e\u5df2\u6709\u7ec4\u5f0f\u548c\u56fe\u5f0f\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03383", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u4f18\u5316", "\u4fe1\u7528\u5206\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03383v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TIGPO: Temporal Instance-Graph Policy Optimization for Long-Horizon LLM Agents", "tldr": "TIGPO \u4e3a\u957f\u7a0b LLM \u667a\u80fd\u4f53\u63d0\u51fa\u8de8\u65f6\u95f4\u7684\u5b9e\u4f8b\u56fe\u7b56\u7565\u4f18\u5316\uff0c\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u7ef4\u62a4\u6301\u4e45\u72b6\u6001\u8f6c\u79fb\u56fe\uff0c\u628a\u4e0d\u540c\u7b56\u7565\u7248\u672c\u53d1\u73b0\u7684\u6709\u6548\u8f6c\u79fb\u7528\u4e8e\u5f53\u524d rollout \u7684\u4fe1\u7528\u5206\u914d\u3002\u5b83\u901a\u8fc7\u63a2\u7d22\u4e0e\u91cd\u8bbf\u9884\u7b97\u8fde\u63a5\u5386\u53f2\u7ecf\u9a8c\u548c\u5f53\u524d\u63a2\u7d22\uff0c\u5728\u4e0d\u56de\u653e\u5386\u53f2\u6570\u636e\u5230\u635f\u5931\u4e2d\u7684\u524d\u63d0\u4e0b\u7a33\u5b9a\u5c0f\u6837\u672c\u4f18\u52bf\u4f30\u8ba1\uff0c\u5e76\u5728 ALFWorld\u3001WebShop \u4e0a\u4f18\u4e8e\u5df2\u6709\u7ec4\u5f0f\u548c\u56fe\u5f0f\u7b56\u7565\u4f18\u5316\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Banks need conversational systems that can answer product questions, assist customers with account-related requests, and operate safely within strict operational and regulatory constraints. General-purpose language models do not reliably meet these requirements. They fall short when a task requires grounded information, correct tool use, or cautious handling of bank-specific sensitive situations. We introduce FiMI Banking, a controlled Indian retail-banking setting. We build it from vetted banking documents, structured ground truth, synthetic customer backgrounds, and banking tools. We evaluate two post-training approaches: preference optimization for response-level behavior, and reinforcement learning with verifiable rewards for multi-turn tool-use tasks. Preference optimization improves safe behavior substantially: out-of-scope refusal rises from 52% to 80%. Reinforcement learning improves edge-case performance from 0.509 to 0.718 and order-sensitive task performance from 0.590 to 0.679, while using 29% fewer generated tokens. These results show that preference optimization and verifiable-reward reinforcement learning address complementary requirements for reliable banking agents.", "arxiv_id": "2609.03960", "arxiv_url": "https://arxiv.org/abs/2609.03960", "authors": ["NPCI AI Research Team", "Aman Kumar", "Asit Desai", "Chandra Bhushan", "Harsh Sharma", "Harshit Bhushan", "Hrithik Kadam", "Keyur Doshi", "Kolisetty Sai Kapardheeswar", "Krishanu Adhikary", "Nadeem Shaik", "Navya Prakash", "Nitin Kukreja", "Prashant Devadiga", "Shamanth MH", "Shantanu Pandey", "Suvradip Paul", "Yatharth Dedhia"], "brief": "\u672c\u6587\u63d0\u51fa FiMI Banking\uff0c\u4e00\u4e2a\u9762\u5411\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u7684\u53d7\u63a7\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u73af\u5883\uff0c\u5305\u542b\u5ba1\u6838\u8fc7\u7684\u94f6\u884c\u6587\u6863\u3001\u7ed3\u6784\u5316\u771f\u503c\u3001\u5408\u6210\u5ba2\u6237\u80cc\u666f\u548c\u94f6\u884c\u5de5\u5177\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u504f\u597d\u4f18\u5316\u663e\u8457\u63d0\u5347\u5b89\u5168\u62d2\u7b54\u80fd\u529b\uff0c\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\u53ef\u9a8c\u8bc1\u5956\u52b1\u63d0\u5347\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u3001\u8fb9\u754c\u573a\u666f\u548c\u987a\u5e8f\u654f\u611f\u4efb\u52a1\u8868\u73b0\uff0c\u5e76\u51cf\u5c11\u751f\u6210 token\u3002\u4e24\u7c7b\u540e\u8bad\u7ec3\u65b9\u6cd5\u5bf9\u6784\u5efa\u53ef\u9760\u94f6\u884c\u667a\u80fd\u4f53\u5177\u6709\u4e92\u8865\u4f5c\u7528\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03960", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u91d1\u878d\u5927\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03960v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "FiMI Banking: A Sovereign Model for Indian Retail Banking", "tldr": "\u672c\u6587\u63d0\u51fa FiMI Banking\uff0c\u4e00\u4e2a\u9762\u5411\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u7684\u53d7\u63a7\u8bc4\u6d4b\u4e0e\u8bad\u7ec3\u73af\u5883\uff0c\u5305\u542b\u5ba1\u6838\u8fc7\u7684\u94f6\u884c\u6587\u6863\u3001\u7ed3\u6784\u5316\u771f\u503c\u3001\u5408\u6210\u5ba2\u6237\u80cc\u666f\u548c\u94f6\u884c\u5de5\u5177\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u504f\u597d\u4f18\u5316\u663e\u8457\u63d0\u5347\u5b89\u5168\u62d2\u7b54\u80fd\u529b\uff0c\u5f3a\u5316\u5b66\u4e60\u7ed3\u5408\u53ef\u9a8c\u8bc1\u5956\u52b1\u63d0\u5347\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u3001\u8fb9\u754c\u573a\u666f\u548c\u987a\u5e8f\u654f\u611f\u4efb\u52a1\u8868\u73b0\uff0c\u5e76\u51cf\u5c11\u751f\u6210 token\u3002\u4e24\u7c7b\u540e\u8bad\u7ec3\u65b9\u6cd5\u5bf9\u6784\u5efa\u53ef\u9760\u94f6\u884c\u667a\u80fd\u4f53\u5177\u6709\u4e92\u8865\u4f5c\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computer-aided engineering (CAE) simulation is among the largest and most demanding areas of engineering, where setting up a solver such as OpenFOAM, FEniCS, or COMSOL takes real expertise. Large language model (LLM) agents promise to turn a natural-language request into a working simulation, and recent CAE agents add simulation-specific machinery: multi-agent decomposition, domain retrieval, and scripted reflection. That machinery suited weak base models; modern harnesses already supply multi-turn reasoning, tool use, and execution feedback. We ask what a CAE simulation agent still needs beyond a generic harness. With information access and repair budget held fixed, a single-agent harness matches or beats multi-agent specialized systems (FoamBench 96.4\\% vs.\\ 88.2\\%). Ablations trace this to capabilities the harness already provides: execution-feedback repair lifts FoamBench from 71.8\\% with no repair round to 96.4\\%, while scripted reflection adds nothing. The one input that still helps is domain knowledge supplied as solver tutorials, our largest measured gain (80.9\\% to 96.4\\%).", "arxiv_id": "2609.03718", "arxiv_url": "https://arxiv.org/abs/2609.03718", "authors": ["Jiasheng Shi", "Tianhan Zhang"], "brief": "\u8bba\u6587\u7814\u7a76 CAE \u4eff\u771f\u667a\u80fd\u4f53\u5728\u901a\u7528\u667a\u80fd\u4f53\u6846\u67b6\u4e4b\u5916\u771f\u6b63\u9700\u8981\u4ec0\u4e48\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u4fe1\u606f\u8bbf\u95ee\u548c\u4fee\u590d\u9884\u7b97\u76f8\u540c\u4e0b\uff0c\u5355\u667a\u80fd\u4f53\u901a\u7528\u6846\u67b6\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u4e13\u7528\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5173\u952e\u6536\u76ca\u6765\u81ea\u6267\u884c\u53cd\u9988\u4fee\u590d\u548c\u6c42\u89e3\u5668\u6559\u7a0b\u5f62\u5f0f\u7684\u9886\u57df\u77e5\u8bc6\uff0c\u800c\u811a\u672c\u5316\u53cd\u601d\u51e0\u4e4e\u65e0\u6548\u3002", "categories": ["cs.CE", "cs.CL", "physics.comp-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03718", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5de5\u7a0b\u4eff\u771f", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03718v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "What Do CAE Simulation Agents Really Need Beyond a Generic Harness?", "tldr": "\u8bba\u6587\u7814\u7a76 CAE \u4eff\u771f\u667a\u80fd\u4f53\u5728\u901a\u7528\u667a\u80fd\u4f53\u6846\u67b6\u4e4b\u5916\u771f\u6b63\u9700\u8981\u4ec0\u4e48\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728\u4fe1\u606f\u8bbf\u95ee\u548c\u4fee\u590d\u9884\u7b97\u76f8\u540c\u4e0b\uff0c\u5355\u667a\u80fd\u4f53\u901a\u7528\u6846\u67b6\u53ef\u8fbe\u5230\u6216\u8d85\u8fc7\u4e13\u7528\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5173\u952e\u6536\u76ca\u6765\u81ea\u6267\u884c\u53cd\u9988\u4fee\u590d\u548c\u6c42\u89e3\u5668\u6559\u7a0b\u5f62\u5f0f\u7684\u9886\u57df\u77e5\u8bc6\uff0c\u800c\u811a\u672c\u5316\u53cd\u601d\u51e0\u4e4e\u65e0\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language-model judges now gate training data, score generations, and drive leaderboards. The judge is then a measurement instrument, resting on one rarely stated assumption: the same request, sent to the same model name, reads the same tomorrow. We audited that assumption in two preregistered campaigns with every threshold fixed in advance; neither got past validating its instrument. Across 52,988 audited request attempts, same-window repeat rankings agreed at Spearman 0.400 against a required 0.90, and byte-identical next-day replays agreed at 0.78 against a required 0.99, each time with the execution record at ceiling. Three mechanisms explain the gap: a label-to-meaning mapping that biased readouts as strongly as the signal; candidate gaps seven orders of magnitude below the instrument\u0027s own noise floor; and byte-identical inputs returning different rankings, a noise that exact-permutation readouts compound. Neither metric substitution nor sampling repaired it on the tested grid. Preregistered follow-ups bound the problem: waiting did not help on the days sampled (0.805 versus 0.800, replicated over five further days); switching providers did not help (four providers share the floor, medians 0.74 to 0.88, predicted by none of the metadata fields they expose); self-hosting on batch-invariant kernels helped only while the server was quiet; and on constructed errors with known gaps, the readout\u0027s separation tracks error type, not size. We distill the evidence into a three-level snapshot-identity ladder, eight design rules, and a reporting checklist; a pilot at roughly 2% of the study\u0027s call volume would have exposed both unreachable gates in advance. All results concern externally measured behaviour on shared serving infrastructure. On a shared endpoint, a model name is not a frozen instrument; a preregistered evaluation must measure its instrument before freezing any gate on it.", "arxiv_id": "2609.04198", "arxiv_url": "https://arxiv.org/abs/2609.04198", "authors": ["Haoyaun Zhu", "Jie Zhang"], "brief": "\u8bba\u6587\u628a\u9ed1\u76d2 LLM \u8bc4\u5ba1\u5668\u89c6\u4e3a\u6d4b\u91cf\u4eea\u5668\uff0c\u9884\u6ce8\u518c\u5ba1\u8ba1\u4e86\u540c\u4e00\u6a21\u578b\u7aef\u70b9\u5728\u91cd\u590d\u8bf7\u6c42\u548c\u6b21\u65e5\u91cd\u653e\u4e2d\u7684\u4e00\u81f4\u6027\u3002\u7ed3\u679c\u663e\u793a\u5171\u4eab\u7aef\u70b9\u7684\u6392\u5e8f\u53ef\u9760\u6027\u8fdc\u4f4e\u4e8e\u9884\u8bbe\u95e8\u69db\uff0c\u566a\u58f0\u3001\u6807\u7b7e\u6620\u5c04\u504f\u5dee\u548c\u5019\u9009\u5dee\u8ddd\u8fc7\u5c0f\u4f1a\u663e\u8457\u7834\u574f\u8bc4\u6d4b\u7ed3\u8bba\uff0c\u6362\u6307\u6807\u3001\u91c7\u6837\u6216\u6362\u670d\u52a1\u5546\u4e5f\u96be\u4ee5\u4fee\u590d\u3002\u4f5c\u8005\u63d0\u51fa\u5feb\u7167\u8eab\u4efd\u5206\u7ea7\u3001\u8bbe\u8ba1\u89c4\u5219\u548c\u62a5\u544a\u6e05\u5355\uff0c\u5f3a\u8c03\u9884\u6ce8\u518c\u8bc4\u6d4b\u524d\u5fc5\u987b\u5148\u9a8c\u8bc1\u8bc4\u5ba1\u5668\u672c\u8eab\u7684\u7a33\u5b9a\u6027\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04198", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b", "\u53ef\u9760\u6027", "\u9ed1\u76d2\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04198v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Clean Engineering, Unstable Measurement: A Preregistered Reliability Failure of Black-Box LLM Observers on Shared Endpoints", "tldr": "\u8bba\u6587\u628a\u9ed1\u76d2 LLM \u8bc4\u5ba1\u5668\u89c6\u4e3a\u6d4b\u91cf\u4eea\u5668\uff0c\u9884\u6ce8\u518c\u5ba1\u8ba1\u4e86\u540c\u4e00\u6a21\u578b\u7aef\u70b9\u5728\u91cd\u590d\u8bf7\u6c42\u548c\u6b21\u65e5\u91cd\u653e\u4e2d\u7684\u4e00\u81f4\u6027\u3002\u7ed3\u679c\u663e\u793a\u5171\u4eab\u7aef\u70b9\u7684\u6392\u5e8f\u53ef\u9760\u6027\u8fdc\u4f4e\u4e8e\u9884\u8bbe\u95e8\u69db\uff0c\u566a\u58f0\u3001\u6807\u7b7e\u6620\u5c04\u504f\u5dee\u548c\u5019\u9009\u5dee\u8ddd\u8fc7\u5c0f\u4f1a\u663e\u8457\u7834\u574f\u8bc4\u6d4b\u7ed3\u8bba\uff0c\u6362\u6307\u6807\u3001\u91c7\u6837\u6216\u6362\u670d\u52a1\u5546\u4e5f\u96be\u4ee5\u4fee\u590d\u3002\u4f5c\u8005\u63d0\u51fa\u5feb\u7167\u8eab\u4efd\u5206\u7ea7\u3001\u8bbe\u8ba1\u89c4\u5219\u548c\u62a5\u544a\u6e05\u5355\uff0c\u5f3a\u8c03\u9884\u6ce8\u518c\u8bc4\u6d4b\u524d\u5fc5\u987b\u5148\u9a8c\u8bc1\u8bc4\u5ba1\u5668\u672c\u8eab\u7684\u7a33\u5b9a\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reasoning traces from chain-of-thought models appear to offer a legible window into how a model arrives at its answer. A growing body of work treats them as such, using LLM judges to diagnose errors, evaluate faithfulness, and provide step-level supervision via process reward models and generative critics. These practices rely on the text of a reasoning step carrying information about its functional role. But does the text actually encode information about which reasoning steps matter? We operationalize the importance of a reasoning step as its advantage: the change in expected reward, e.g., producing the correct final answer, from including that step, estimated via Monte Carlo rollouts. Basing ground truth on these estimates, we evaluate whether LLM judges can identify high-advantage steps and find that sufficiently capable LLMs can outperform a prevalence baseline but fall well short of a noise ceiling. Fine-tuning a model as a step-level critic yields strong improvement for incorrect responses but remains distant from ceiling for correct responses, suggesting that step importance is only partially recoverable from the text of the reasoning trace. Our findings contribute to a growing body of chain-of-thought faithfulness work that cautions against treating the legibility of reasoning traces as interpretability, especially with implications for process reward modeling.", "arxiv_id": "2609.04194", "arxiv_url": "https://arxiv.org/abs/2609.04194", "authors": ["Kevin Du", "Alexander Hoyle", "Laura Ruis", "Acyr Locatelli"], "brief": "\u8bba\u6587\u8d28\u7591\u5c06\u94fe\u5f0f\u601d\u7ef4\u6587\u672c\u53ef\u8bfb\u6027\u7b49\u540c\u4e8e\u53ef\u89e3\u91ca\u6027\uff0c\u63d0\u51fa\u7528\u63a8\u7406\u6b65\u9aa4\u7684\u201c\u4f18\u52bf\u201d\uff08\u52a0\u5165\u8be5\u6b65\u9aa4\u5bf9\u6700\u7ec8\u6b63\u786e\u7387\u7684\u5f71\u54cd\uff09\u4f5c\u4e3a\u771f\u5b9e\u91cd\u8981\u6027\uff0c\u5e76\u7528\u8499\u7279\u5361\u6d1b rollout \u4f30\u8ba1\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5f3a LLM \u8bc4\u5ba1\u80fd\u7565\u4f18\u4e8e\u57fa\u7ebf\u4f46\u8fdc\u4f4e\u4e8e\u566a\u58f0\u4e0a\u9650\uff0c\u5fae\u8c03\u6b65\u9aa4\u7ea7\u8bc4\u8bba\u5668\u867d\u6539\u5584\u9519\u8bef\u56de\u7b54\u5224\u65ad\uff0c\u4f46\u6b63\u786e\u56de\u7b54\u4e2d\u4ecd\u96be\u6062\u590d\u771f\u5b9e\u91cd\u8981\u6027\uff0c\u63d0\u793a\u8fc7\u7a0b\u5956\u52b1\u5efa\u6a21\u9700\u8c28\u614e\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04194", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u94fe\u5f0f\u601d\u7ef4", "\u53ef\u89e3\u91ca\u6027", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8fc7\u7a0b\u5956\u52b1\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04194v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Legibility is Not Interpretability: Comparing Judged and Actual Importance in Chain-Of-Thought Reasoning", "tldr": "\u8bba\u6587\u8d28\u7591\u5c06\u94fe\u5f0f\u601d\u7ef4\u6587\u672c\u53ef\u8bfb\u6027\u7b49\u540c\u4e8e\u53ef\u89e3\u91ca\u6027\uff0c\u63d0\u51fa\u7528\u63a8\u7406\u6b65\u9aa4\u7684\u201c\u4f18\u52bf\u201d\uff08\u52a0\u5165\u8be5\u6b65\u9aa4\u5bf9\u6700\u7ec8\u6b63\u786e\u7387\u7684\u5f71\u54cd\uff09\u4f5c\u4e3a\u771f\u5b9e\u91cd\u8981\u6027\uff0c\u5e76\u7528\u8499\u7279\u5361\u6d1b rollout \u4f30\u8ba1\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5f3a LLM \u8bc4\u5ba1\u80fd\u7565\u4f18\u4e8e\u57fa\u7ebf\u4f46\u8fdc\u4f4e\u4e8e\u566a\u58f0\u4e0a\u9650\uff0c\u5fae\u8c03\u6b65\u9aa4\u7ea7\u8bc4\u8bba\u5668\u867d\u6539\u5584\u9519\u8bef\u56de\u7b54\u5224\u65ad\uff0c\u4f46\u6b63\u786e\u56de\u7b54\u4e2d\u4ecd\u96be\u6062\u590d\u771f\u5b9e\u91cd\u8981\u6027\uff0c\u63d0\u793a\u8fc7\u7a0b\u5956\u52b1\u5efa\u6a21\u9700\u8c28\u614e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) and on-policy distillation (OPD) have emerged as two dominant methods for post-training reasoning LLMs. Prior work uses OPD\u0027s dense token-level supervision to complement the sparse RL reward, fusing the two signals within a single step: either as a \\emph{weighted-additive combination} or a \\emph{teacher-modulated rescaling} of the RL advantage. In this paper, we show that a simple two-stage scheme, OPD-then-RL, consistently outperforms pure OPD, pure RLVR, and all such joint baselines across logic and math reasoning benchmarks. Beyond the empirical results, we further provide a systematic understanding of this through pass@$k$ behavior, learning dynamics, and parameter updates, yielding a consistent explanation: OPD expands the student\u0027s coverage of teacher-supported solutions and RL sharpens within that support, while jointly optimizing the two signals causes them to interfere.To provide a practical recipe, we find that the OPD validation score is the key signal for when to switch to RL, and that OPD is a better cold start for RL than SFT. Together, our results establish OPD-then-RL as a simple yet strong way to combine the two methods, turning two entangled signals into complementary stages.", "arxiv_id": "2609.04108", "arxiv_url": "https://arxiv.org/abs/2609.04108", "authors": ["Boyan Li", "Bingsen Chen", "Chenghao Yang", "Ping Nie", "Chen Zhao", "Xi Ye"], "brief": "\u8bba\u6587\u6bd4\u8f83\u4e86\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u4e0e\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u7684\u7ed3\u5408\u65b9\u5f0f\uff0c\u53d1\u73b0\u5148\u505aOPD\u518d\u505aRL\u7684\u4e24\u9636\u6bb5\u6d41\u7a0b\uff0c\u5728\u903b\u8f91\u548c\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u7eafOPD\u3001\u7eafRLVR\u53ca\u8054\u5408\u4f18\u5316\u65b9\u6cd5\u3002\u5206\u6790\u8868\u660e\uff0cOPD\u5148\u6269\u5c55\u5b66\u751f\u6a21\u578b\u8986\u76d6\u7684\u6559\u5e08\u89e3\u6cd5\u7a7a\u95f4\uff0cRL\u518d\u5728\u8be5\u7a7a\u95f4\u5185\u5f3a\u5316\u9ad8\u8d28\u91cf\u89e3\uff0c\u800c\u8054\u5408\u8bad\u7ec3\u4f1a\u4ea7\u751f\u4fe1\u53f7\u5e72\u6270\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04108", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u77e5\u8bc6\u84b8\u998f", "\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04108v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sequential Beats Joint: On the Interplay between On-Policy Distillation and RLVR", "tldr": "\u8bba\u6587\u6bd4\u8f83\u4e86\u53ef\u9a8c\u8bc1\u5956\u52b1\u5f3a\u5316\u5b66\u4e60\uff08RLVR\uff09\u4e0e\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u7684\u7ed3\u5408\u65b9\u5f0f\uff0c\u53d1\u73b0\u5148\u505aOPD\u518d\u505aRL\u7684\u4e24\u9636\u6bb5\u6d41\u7a0b\uff0c\u5728\u903b\u8f91\u548c\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u7eafOPD\u3001\u7eafRLVR\u53ca\u8054\u5408\u4f18\u5316\u65b9\u6cd5\u3002\u5206\u6790\u8868\u660e\uff0cOPD\u5148\u6269\u5c55\u5b66\u751f\u6a21\u578b\u8986\u76d6\u7684\u6559\u5e08\u89e3\u6cd5\u7a7a\u95f4\uff0cRL\u518d\u5728\u8be5\u7a7a\u95f4\u5185\u5f3a\u5316\u9ad8\u8d28\u91cf\u89e3\uff0c\u800c\u8054\u5408\u8bad\u7ec3\u4f1a\u4ea7\u751f\u4fe1\u53f7\u5e72\u6270\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Blackwell\u0027s 4-bit floating-point (FP4) tensor cores do not automatically make attention faster because softmax conversion and on-chip dependencies dominate once its matrix products shrink. We address this with \\emph{Direct-P} for noncausal inference and a causal path that passes the forward quantization directly into backward. Direct-P maps scores directly to FP4 probabilities and reaches up to 2.13$\\times$ the bfloat16 (BF16) forward throughput on an NVIDIA GB200. The causal path reconstructs probabilities from saved quantized queries and keys and uses 8-bit floating-point (FP8) gradient operands, accelerating a complete single-GPU 8-billion-parameter update by up to 1.14$\\times$. Matched distributed training retains FP8 probabilities and values; every tested MXFP4 probability/value training trajectory diverges.", "arxiv_id": "2609.04105", "arxiv_url": "https://arxiv.org/abs/2609.04105", "authors": ["Robert Hu"], "brief": "\u672c\u6587\u9488\u5bf9 NVIDIA Blackwell FP4 Tensor Core \u5728\u6ce8\u610f\u529b\u4e2d\u53d7 softmax \u8f6c\u6362\u548c\u7247\u4e0a\u4f9d\u8d56\u9650\u5236\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u786c\u4ef6\u611f\u77e5\u7684 FP4 FlashAttention-4\u3002\u5176 Direct-P \u5728\u975e\u56e0\u679c\u63a8\u7406\u4e2d\u5c06\u5206\u6570\u76f4\u63a5\u6620\u5c04\u4e3a FP4 \u6982\u7387\uff0c\u524d\u5411\u541e\u5410\u6700\u9ad8\u8fbe BF16 \u7684 2.13 \u500d\uff1b\u56e0\u679c\u8bad\u7ec3\u8def\u5f84\u901a\u8fc7\u4fdd\u5b58\u91cf\u5316\u67e5\u8be2/\u952e\u5e76\u4f7f\u7528 FP8 \u68af\u5ea6\uff0c\u4f7f\u5355\u5361 80 \u4ebf\u53c2\u6570\u66f4\u65b0\u6700\u9ad8\u52a0\u901f 1.14 \u500d\uff0c\u4f46 MXFP4 \u6982\u7387/\u503c\u8bad\u7ec3\u4f1a\u53d1\u6563\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04105", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u4f4e\u7cbe\u5ea6\u8bad\u7ec3", "FlashAttention", "\u786c\u4ef6\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04105v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hardware-Aware FP4 FlashAttention-4", "tldr": "\u672c\u6587\u9488\u5bf9 NVIDIA Blackwell FP4 Tensor Core \u5728\u6ce8\u610f\u529b\u4e2d\u53d7 softmax \u8f6c\u6362\u548c\u7247\u4e0a\u4f9d\u8d56\u9650\u5236\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u786c\u4ef6\u611f\u77e5\u7684 FP4 FlashAttention-4\u3002\u5176 Direct-P \u5728\u975e\u56e0\u679c\u63a8\u7406\u4e2d\u5c06\u5206\u6570\u76f4\u63a5\u6620\u5c04\u4e3a FP4 \u6982\u7387\uff0c\u524d\u5411\u541e\u5410\u6700\u9ad8\u8fbe BF16 \u7684 2.13 \u500d\uff1b\u56e0\u679c\u8bad\u7ec3\u8def\u5f84\u901a\u8fc7\u4fdd\u5b58\u91cf\u5316\u67e5\u8be2/\u952e\u5e76\u4f7f\u7528 FP8 \u68af\u5ea6\uff0c\u4f7f\u5355\u5361 80 \u4ebf\u53c2\u6570\u66f4\u65b0\u6700\u9ad8\u52a0\u901f 1.14 \u500d\uff0c\u4f46 MXFP4 \u6982\u7387/\u503c\u8bad\u7ec3\u4f1a\u53d1\u6563\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning from Verifiable Rewards works well when a task has a programmatic checker, but most long-horizon agent domains have none. We work in the outcome-blind setting, where ground-truth success signals are not available. Multi-criteria rubrics are a popular way to supply such a reward; they are scored once per trajectory, but a single scalar is a poor signal across tens of steps. We propose DRACO: Distributing Rubric-based Advantage for Credit Optimization. It generates rubrics dynamically during training to track the policy\u0027s evolving capability, scores those rubrics once per completed trajectory, and redistributes that judgment over the steps responsible for annotated rubrics to produce differentiated per-step advantages in GRPO. The redistribution is closed-form and does not introduce any trained attribution module. On AppWorld, DRACO gains 15.9 points over the base model and 5.3 points over GRPO trained with a sparse ground-truth reward, despite not using any verifiers itself. On out-of-domain Tau-Bench, it gains 5.3 points over the base model even without a frontier judge, beating both ground-truth-reward training and other rubric-based training settings. The code for DRACO is available at https://github.com/IBM/draco.", "arxiv_id": "2609.04094", "arxiv_url": "https://arxiv.org/abs/2609.04094", "authors": ["Shubham Gandhi", "Saurabh Goyal", "Kiran Kate", "Yara Rizk"], "brief": "DRACO \u9762\u5411\u7f3a\u5c11\u7a0b\u5e8f\u5316\u9a8c\u8bc1\u5668\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\uff0c\u52a8\u6001\u751f\u6210\u591a\u6807\u51c6\u8bc4\u5206 rubric\uff0c\u5e76\u5c06\u6574\u6761\u8f68\u8ff9\u7684\u8bc4\u5206\u95ed\u5f0f\u91cd\u5206\u914d\u5230\u76f8\u5173\u6b65\u9aa4\uff0c\u5f62\u6210\u66f4\u7ec6\u7c92\u5ea6\u7684 GRPO \u4f18\u52bf\u4fe1\u53f7\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 AppWorld \u4e0a\u8f83\u57fa\u5ea7\u63d0\u5347 15.9 \u5206\u3001\u8f83\u7a00\u758f\u771f\u503c\u5956\u52b1 GRPO \u63d0\u5347 5.3 \u5206\uff0c\u5728\u57df\u5916 Tau-Bench \u4e5f\u4f18\u4e8e\u591a\u79cd\u771f\u503c\u5956\u52b1\u548c rubric \u8bad\u7ec3\u8bbe\u7f6e\u3002", "categories": ["cs.AI", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04094", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u5956\u52b1\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04094v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training", "tldr": "DRACO \u9762\u5411\u7f3a\u5c11\u7a0b\u5e8f\u5316\u9a8c\u8bc1\u5668\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\uff0c\u52a8\u6001\u751f\u6210\u591a\u6807\u51c6\u8bc4\u5206 rubric\uff0c\u5e76\u5c06\u6574\u6761\u8f68\u8ff9\u7684\u8bc4\u5206\u95ed\u5f0f\u91cd\u5206\u914d\u5230\u76f8\u5173\u6b65\u9aa4\uff0c\u5f62\u6210\u66f4\u7ec6\u7c92\u5ea6\u7684 GRPO \u4f18\u52bf\u4fe1\u53f7\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 AppWorld \u4e0a\u8f83\u57fa\u5ea7\u63d0\u5347 15.9 \u5206\u3001\u8f83\u7a00\u758f\u771f\u503c\u5956\u52b1 GRPO \u63d0\u5347 5.3 \u5206\uff0c\u5728\u57df\u5916 Tau-Bench \u4e5f\u4f18\u4e8e\u591a\u79cd\u771f\u503c\u5956\u52b1\u548c rubric \u8bad\u7ec3\u8bbe\u7f6e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most previous work on speech enhancement (SE) based on masked generative modeling relied on discrete token representations of audio signals, obtained using neural audio codecs (NACs). However, a recent study has shown that continuous latent representations of NACs can be advantageous for SE in terms of speech quality and intelligibility. In this work, we propose masked autoregressive SE (MARSE), a method for SE based on iterative decoding of masked clean speech frames using continuous NAC representations of speech. In particular, we investigate a set of different decoding policies, ceteris paribus, that is, using the same DNN (a Conformer model), the same NAC (the DAC codec) and the same training setup. The results show that MARSE enables a flexible trade-off between SE performance and computational cost. Audio examples and code are available online.", "arxiv_id": "2609.03940", "arxiv_url": "https://arxiv.org/abs/2609.03940", "authors": ["Yoto Fujita", "Simon Leglaive", "Laurent Girin"], "brief": "\u672c\u6587\u63d0\u51fa MARSE\uff0c\u4e00\u79cd\u57fa\u4e8e\u8fde\u7eed\u795e\u7ecf\u97f3\u9891\u7f16\u89e3\u7801\u5668\u8868\u793a\u7684\u63a9\u7801\u81ea\u56de\u5f52\u8bed\u97f3\u589e\u5f3a\u65b9\u6cd5\uff0c\u901a\u8fc7\u8fed\u4ee3\u89e3\u7801\u88ab\u63a9\u7801\u7684\u5e72\u51c0\u8bed\u97f3\u5e27\u6765\u63d0\u5347\u8bed\u97f3\u3002\u4f5c\u8005\u5728\u76f8\u540c Conformer\u3001DAC \u7f16\u89e3\u7801\u5668\u548c\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u6bd4\u8f83\u591a\u79cd\u89e3\u7801\u7b56\u7565\uff0c\u7ed3\u679c\u663e\u793a\u8be5\u65b9\u6cd5\u53ef\u5728\u589e\u5f3a\u6548\u679c\u4e0e\u8ba1\u7b97\u6210\u672c\u4e4b\u95f4\u7075\u6d3b\u6743\u8861\u3002", "categories": ["cs.SD", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03940", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u589e\u5f3a", "\u81ea\u56de\u5f52\u6a21\u578b", "\u97f3\u9891\u7f16\u89e3\u7801\u5668", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03940v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Masked Autoregressive Speech Enhancement with Continuous Neural Audio Codec Representations", "tldr": "\u672c\u6587\u63d0\u51fa MARSE\uff0c\u4e00\u79cd\u57fa\u4e8e\u8fde\u7eed\u795e\u7ecf\u97f3\u9891\u7f16\u89e3\u7801\u5668\u8868\u793a\u7684\u63a9\u7801\u81ea\u56de\u5f52\u8bed\u97f3\u589e\u5f3a\u65b9\u6cd5\uff0c\u901a\u8fc7\u8fed\u4ee3\u89e3\u7801\u88ab\u63a9\u7801\u7684\u5e72\u51c0\u8bed\u97f3\u5e27\u6765\u63d0\u5347\u8bed\u97f3\u3002\u4f5c\u8005\u5728\u76f8\u540c Conformer\u3001DAC \u7f16\u89e3\u7801\u5668\u548c\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u6bd4\u8f83\u591a\u79cd\u89e3\u7801\u7b56\u7565\uff0c\u7ed3\u679c\u663e\u793a\u8be5\u65b9\u6cd5\u53ef\u5728\u589e\u5f3a\u6548\u679c\u4e0e\u8ba1\u7b97\u6210\u672c\u4e4b\u95f4\u7075\u6d3b\u6743\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While HTN planning has received significant attention in recent years, support for numerical reasoning remains very limited. In this paper, we investigate numerical Totally-Ordered HTN (TOHTN) planning and show how standard SAT-based encodings can be naturally extended with SMT to handle numeric fluents. In addition, we introduce a benchmark suite for numerical TOHTN planning, providing a first common basis for evaluation in this setting. Experimental results show that this simple encoding already constitutes a competitive baseline. This work opens the way to more expressive approaches to HTN planning.", "arxiv_id": "2609.03938", "arxiv_url": "https://arxiv.org/abs/2609.03938", "authors": ["Gaspard Quenard", "Takudzwa Togarepi", "Damien Pellier", "Humbert Fiorino"], "brief": "\u672c\u6587\u7814\u7a76\u5e26\u6570\u503c\u63a8\u7406\u7684\u5168\u5e8f HTN \u89c4\u5212\uff0c\u63d0\u51fa\u5c06\u4f20\u7edf HTN-SAT \u7f16\u7801\u81ea\u7136\u6269\u5c55\u4e3a\u57fa\u4e8e SMT \u7684\u7f16\u7801\uff0c\u4ee5\u652f\u6301\u6570\u503c fluent\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03\u4e86\u6570\u503c TOHTN \u89c4\u5212\u57fa\u51c6\u96c6\uff0c\u5b9e\u9a8c\u8868\u660e\u8be5\u7b80\u5355\u65b9\u6cd5\u5df2\u5177\u5907\u6709\u7ade\u4e89\u529b\u7684\u57fa\u7ebf\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03938", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["HTN\u89c4\u5212", "SMT", "\u6570\u503c\u63a8\u7406", "\u81ea\u52a8\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03938v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Numerical TOHTN Planning with SMT-based HTN-SAT Encoding", "tldr": "\u672c\u6587\u7814\u7a76\u5e26\u6570\u503c\u63a8\u7406\u7684\u5168\u5e8f HTN \u89c4\u5212\uff0c\u63d0\u51fa\u5c06\u4f20\u7edf HTN-SAT \u7f16\u7801\u81ea\u7136\u6269\u5c55\u4e3a\u57fa\u4e8e SMT \u7684\u7f16\u7801\uff0c\u4ee5\u652f\u6301\u6570\u503c fluent\u3002\u4f5c\u8005\u8fd8\u53d1\u5e03\u4e86\u6570\u503c TOHTN \u89c4\u5212\u57fa\u51c6\u96c6\uff0c\u5b9e\u9a8c\u8868\u660e\u8be5\u7b80\u5355\u65b9\u6cd5\u5df2\u5177\u5907\u6709\u7ade\u4e89\u529b\u7684\u57fa\u7ebf\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-augmented generation (RAG) complements parametric models with retrieved external evidence. The same idea is attractive for continuous-output regression, but directly reusing retrieved target values is often not robust when samples differ in output level, numerical scale, or local dynamics. Moreover, conventional forecasting pipelines generally use residuals for model optimization and error diagnosis, but do not retain individual historical residual examples as memory that can be accessed at inference time.For multivariate time-series forecasting, we propose RATL, a plug-in residual-retrieval and feedback-correction method. RATL freezes a base forecaster to construct retrieval keys and turns its historical forecast residuals into a train-only memory specific to that base model. At inference time, RATL retrieves residual trajectories from similar historical contexts subject to causal availability constraints, then uses a set-aware router operating over forecast blocks and variables to select and combine these trajectories. Experiments show that historical residuals matched to the current context contain reusable forecasting information and that RATL improves frozen base forecasters in most experimental settings. Ablations further show that learned routing strengthens raw residual feedback, while validation-based correction-strength selection limits residual over-injection.On real-world benchmarks, we use iTransformer as the primary frozen base forecaster, compare against multiple strong forecasting baselines, and test transferability across backbones. The results show that RATL can further improve base-forecaster performance in most settings.Overall, RATL shifts the retrieved object from historical target values to base-model-specific historical forecast errors, providing a plug-in, residual-memory-based paradigm for learned feedback correction in continuous-output forecasting.", "arxiv_id": "2609.03937", "arxiv_url": "https://arxiv.org/abs/2609.03937", "authors": ["Yuchen He", "Yueyang Cang", "Zhiyuan Ning", "Ningyu Wang", "Li Shi"], "brief": "\u8bba\u6587\u63d0\u51fa RATL\uff0c\u4e00\u79cd\u7528\u4e8e\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u7684\u63d2\u4ef6\u5f0f\u6b8b\u5dee\u68c0\u7d22\u4e0e\u53cd\u9988\u6821\u6b63\u65b9\u6cd5\uff1a\u51bb\u7ed3\u57fa\u7840\u9884\u6d4b\u5668\uff0c\u628a\u5176\u5386\u53f2\u9884\u6d4b\u6b8b\u5dee\u4f5c\u4e3a\u53ef\u68c0\u7d22\u8bb0\u5fc6\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u6839\u636e\u76f8\u4f3c\u4e0a\u4e0b\u6587\u9009\u62e9\u548c\u7ec4\u5408\u6b8b\u5dee\u8f68\u8ff9\u8fdb\u884c\u4fee\u6b63\u3002\u5b9e\u9a8c\u8868\u660e\uff0cRATL \u5728\u591a\u6570\u8bbe\u7f6e\u4e0b\u80fd\u8fdb\u4e00\u6b65\u63d0\u5347 iTransformer \u7b49\u51bb\u7ed3\u57fa\u7840\u9884\u6d4b\u5668\u7684\u8868\u73b0\uff0c\u5b66\u4e60\u5f0f\u8def\u7531\u548c\u6821\u6b63\u5f3a\u5ea6\u9009\u62e9\u53ef\u7f13\u89e3\u6b8b\u5dee\u8fc7\u5ea6\u6ce8\u5165\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03937", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u68c0\u7d22\u589e\u5f3a", "\u6b8b\u5dee\u5b66\u4e60", "\u591a\u53d8\u91cf\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03937v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RATL: Learning from Retrieved Residuals for Robust Multivariate Time-Series Forecasting", "tldr": "\u8bba\u6587\u63d0\u51fa RATL\uff0c\u4e00\u79cd\u7528\u4e8e\u591a\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b\u7684\u63d2\u4ef6\u5f0f\u6b8b\u5dee\u68c0\u7d22\u4e0e\u53cd\u9988\u6821\u6b63\u65b9\u6cd5\uff1a\u51bb\u7ed3\u57fa\u7840\u9884\u6d4b\u5668\uff0c\u628a\u5176\u5386\u53f2\u9884\u6d4b\u6b8b\u5dee\u4f5c\u4e3a\u53ef\u68c0\u7d22\u8bb0\u5fc6\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u6839\u636e\u76f8\u4f3c\u4e0a\u4e0b\u6587\u9009\u62e9\u548c\u7ec4\u5408\u6b8b\u5dee\u8f68\u8ff9\u8fdb\u884c\u4fee\u6b63\u3002\u5b9e\u9a8c\u8868\u660e\uff0cRATL \u5728\u591a\u6570\u8bbe\u7f6e\u4e0b\u80fd\u8fdb\u4e00\u6b65\u63d0\u5347 iTransformer \u7b49\u51bb\u7ed3\u57fa\u7840\u9884\u6d4b\u5668\u7684\u8868\u73b0\uff0c\u5b66\u4e60\u5f0f\u8def\u7531\u548c\u6821\u6b63\u5f3a\u5ea6\u9009\u62e9\u53ef\u7f13\u89e3\u6b8b\u5dee\u8fc7\u5ea6\u6ce8\u5165\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Hierarchical Task Network (HTN) planning is a powerful planning formalism based on task decomposition. Although most of the literature studied plan generation, comparatively less attention has been paid to post-plan optimization. In particular, plan deordering has been extensively studied in classical planning but remains under-researched in the HTN setting. Plan deordering removes unnecessary ordering constraints between actions in a plan whilst keeping the plan valid. In this paper, we adapt two established plan deordering techniques from classical planning by extending the techniques to account for hierarchical decomposition constraints. We evaluate our proposed approaches on the IPC 2023 Partial-Order HTN benchmarks and we compare them against Optiplan, an HTN planner that generates partially ordered plans directly. Our results show a substantial reduction in number of ordering constraints in both our implementations. Although we also observe a reduction in critical path length, the improvements are less pronounced.", "arxiv_id": "2609.03912", "arxiv_url": "https://arxiv.org/abs/2609.03912", "authors": ["Takudzwa Togarepi", "Gaspard Quenard", "Damien Pellier", "Humbert Fiorino"], "brief": "\u672c\u6587\u7814\u7a76 HTN \u89c4\u5212\u4e2d\u7684\u540e\u5904\u7406\u4f18\u5316\uff0c\u5c06\u7ecf\u5178\u89c4\u5212\u91cc\u7684\u4e24\u79cd\u8ba1\u5212\u53bb\u5e8f\u5316\u6280\u672f\u6269\u5c55\u5230\u4fdd\u7559\u5c42\u6b21\u4efb\u52a1\u5206\u89e3\u7ea6\u675f\u7684\u573a\u666f\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728 IPC 2023 \u90e8\u5206\u5e8f HTN \u57fa\u51c6\u4e0a\uff0c\u8be5\u65b9\u6cd5\u80fd\u663e\u8457\u51cf\u5c11\u52a8\u4f5c\u95f4\u6392\u5e8f\u7ea6\u675f\uff0c\u4f46\u5bf9\u5173\u952e\u8def\u5f84\u957f\u5ea6\u7684\u7f29\u77ed\u76f8\u5bf9\u6709\u9650\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03912", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["HTN\u89c4\u5212", "\u8ba1\u5212\u4f18\u5316", "\u5c42\u6b21\u89c4\u5212"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03912v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Lose the Order, Keep the Hierarchy: Deordering HTN Plans", "tldr": "\u672c\u6587\u7814\u7a76 HTN \u89c4\u5212\u4e2d\u7684\u540e\u5904\u7406\u4f18\u5316\uff0c\u5c06\u7ecf\u5178\u89c4\u5212\u91cc\u7684\u4e24\u79cd\u8ba1\u5212\u53bb\u5e8f\u5316\u6280\u672f\u6269\u5c55\u5230\u4fdd\u7559\u5c42\u6b21\u4efb\u52a1\u5206\u89e3\u7ea6\u675f\u7684\u573a\u666f\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u5728 IPC 2023 \u90e8\u5206\u5e8f HTN \u57fa\u51c6\u4e0a\uff0c\u8be5\u65b9\u6cd5\u80fd\u663e\u8457\u51cf\u5c11\u52a8\u4f5c\u95f4\u6392\u5e8f\u7ea6\u675f\uff0c\u4f46\u5bf9\u5173\u952e\u8def\u5f84\u957f\u5ea6\u7684\u7f29\u77ed\u76f8\u5bf9\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "3D spatial reasoning underpins understanding and acting in the physical world, yet it remains unreliable in current multimodal large language models (MLLMs). These models falter at precise geometric measurement, at transforming between egocentric and allocentric viewpoints, and at grounding fine-grained appearance. The most common remedies fine-tune the model on large-scale curated spatial-reasoning datasets or attach dedicated encoders for 3D geometry, which typically couples the solution to costly supervision and a specific backbone. We instead introduce GraFT, a training-free framework that supplies the missing 3D structure through a compact, easily maintained 3D scene graph (3DSG). From this 3DSG, GraFT provides three spatial reasoning capabilities: (1) deterministic geometry through symbolic tools, (2) allocentric layout through a bird\u0027s-eye-view (BEV) rendering, and (3) visual-attribute grounding through task-relevant egocentric frames. On ScanQA, GraFT improves every metric over the same-backbone baseline, raising CIDEr by 27%. On VSI-Bench, GraFT improves frozen MLLMs by up to 65%, surpassing every proprietary and general-purpose open-source baseline, and several prominent fine-tuned spatial models.", "arxiv_id": "2609.03892", "arxiv_url": "https://arxiv.org/abs/2609.03892", "authors": ["Junqing Du", "Fernando Ropero", "Erkin Turkoz", "Yanfeng Zhang", "Lu Liu"], "brief": "GraFT \u662f\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u7a7a\u95f4\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u7d27\u51d1\u7684 3D \u573a\u666f\u56fe\u8865\u5145\u51e0\u4f55\u7ed3\u6784\u4fe1\u606f\u3002\u5b83\u7ed3\u5408\u7b26\u53f7\u51e0\u4f55\u5de5\u5177\u3001\u9e1f\u77b0\u56fe\u5e03\u5c40\u548c\u4efb\u52a1\u76f8\u5173\u89c6\u89d2\u56fe\u50cf\uff0c\u5728 ScanQA \u548c VSI-Bench \u4e0a\u663e\u8457\u63d0\u5347\u51bb\u7ed3 MLLM \u7684\u7a7a\u95f4\u63a8\u7406\u8868\u73b0\uff0cCIDEr \u63d0\u5347 27%\uff0c\u6700\u9ad8\u63d0\u5347 65%\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03892", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u7a7a\u95f4\u63a8\u7406", "3D\u573a\u666f\u56fe", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03892v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GraFT: A Training-Free Framework for Spatial Reasoning in Multimodal Large Language Models via 3D Scene Graphs", "tldr": "GraFT \u662f\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u7a7a\u95f4\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u7d27\u51d1\u7684 3D \u573a\u666f\u56fe\u8865\u5145\u51e0\u4f55\u7ed3\u6784\u4fe1\u606f\u3002\u5b83\u7ed3\u5408\u7b26\u53f7\u51e0\u4f55\u5de5\u5177\u3001\u9e1f\u77b0\u56fe\u5e03\u5c40\u548c\u4efb\u52a1\u76f8\u5173\u89c6\u89d2\u56fe\u50cf\uff0c\u5728 ScanQA \u548c VSI-Bench \u4e0a\u663e\u8457\u63d0\u5347\u51bb\u7ed3 MLLM \u7684\u7a7a\u95f4\u63a8\u7406\u8868\u73b0\uff0cCIDEr \u63d0\u5347 27%\uff0c\u6700\u9ad8\u63d0\u5347 65%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Contact-rich loco-manipulation requires a bridge between semantic action generation and physical interaction control. Existing Vision-language-action (VLA) models generate task-level actions from visual and linguistic observations, but cannot interpret the physical interactions induced by those actions. While the whole-body control (WBC) policy can stabilize the robot, it cannot distinguish task-relevant interaction forces from forces induced by external disturbances during manipulation. Although force/torque sensors provide direct measurements of physical interactions, retrofitting them entails additional hardware costs and substantial integration effort, particularly for platforms not designed with sensor integration in mind. To address this problem, we propose FWBC-VLA, a force-aware framework that bridges task-level VLA action generation and low-level whole-body compensation control for wheeled-legged robots. First, we introduce HSR-Force, a sensorless residual-torque estimator for inferring contact strength and its temporal variation. These contact estimates are then encoded as tokens and injected into the VLA action expert during action decoding, enabling the policy to perceive contact onset, sustained loading, and release. For loco-manipulation tasks, all parameters of the pretrained VLA backbone are fine-tuned on our WL\\\u0026Arm Dataset, which comprises more than 5,000 episodes. Moreover, the robot\u0027s proprioceptive state, the Jacobian-derived body-frame force estimate, and the estimated contact state are jointly fed into a compensation generator to produce corrective actions. The manipulation-centric actions are subsequently combined with the corrective actions and passed to the WBC policy for execution. Real-world experiments on whiteboard wiping and door opening with a door closer demonstrate the effectiveness of our FWBC-VLA in contact-rich loco-manipulation.", "arxiv_id": "2609.03889", "arxiv_url": "https://arxiv.org/abs/2609.03889", "authors": ["Yutian Zhang", "Siyuan Ma", "Liwen Yang", "Yang Li", "Ce Hao", "Haozhen Chi", "Dong We", "Qiaojun Yu", "Dibo Hou"], "brief": "\u672c\u6587\u63d0\u51fa FWBC-VLA\uff0c\u5c06\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\u7684\u4efb\u52a1\u7ea7\u52a8\u4f5c\u751f\u6210\u4e0e\u5e95\u5c42\u5168\u8eab\u8865\u507f\u63a7\u5236\u8fde\u63a5\u8d77\u6765\uff0c\u7528\u4e8e\u63a5\u89e6\u4e30\u5bcc\u7684\u8f6e\u817f\u673a\u5668\u4eba\u79fb\u52a8\u64cd\u4f5c\u3002\u65b9\u6cd5\u901a\u8fc7\u65e0\u4f20\u611f\u5668\u6b8b\u4f59\u529b\u77e9\u4f30\u8ba1\u63a5\u89e6\u5f3a\u5ea6\u5e76\u4f5c\u4e3a token \u6ce8\u5165 VLA\uff0c\u540c\u65f6\u7ed3\u5408\u672c\u4f53\u72b6\u6001\u548c\u529b\u4f30\u8ba1\u751f\u6210\u7ea0\u6b63\u52a8\u4f5c\uff1b\u5728\u767d\u677f\u64e6\u62ed\u548c\u5e26\u95ed\u95e8\u5668\u5f00\u95e8\u7b49\u771f\u5b9e\u5b9e\u9a8c\u4e2d\u63d0\u5347\u4e86\u63a5\u89e6\u64cd\u4f5c\u7a33\u5b9a\u6027\u4e0e\u6709\u6548\u6027\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03889", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5168\u8eab\u63a7\u5236", "\u79fb\u52a8\u64cd\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03889v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FWBC-VLA: Force-Aware Whole-Body Compensation for Contact-Rich Loco-Manipulation", "tldr": "\u672c\u6587\u63d0\u51fa FWBC-VLA\uff0c\u5c06\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\u7684\u4efb\u52a1\u7ea7\u52a8\u4f5c\u751f\u6210\u4e0e\u5e95\u5c42\u5168\u8eab\u8865\u507f\u63a7\u5236\u8fde\u63a5\u8d77\u6765\uff0c\u7528\u4e8e\u63a5\u89e6\u4e30\u5bcc\u7684\u8f6e\u817f\u673a\u5668\u4eba\u79fb\u52a8\u64cd\u4f5c\u3002\u65b9\u6cd5\u901a\u8fc7\u65e0\u4f20\u611f\u5668\u6b8b\u4f59\u529b\u77e9\u4f30\u8ba1\u63a5\u89e6\u5f3a\u5ea6\u5e76\u4f5c\u4e3a token \u6ce8\u5165 VLA\uff0c\u540c\u65f6\u7ed3\u5408\u672c\u4f53\u72b6\u6001\u548c\u529b\u4f30\u8ba1\u751f\u6210\u7ea0\u6b63\u52a8\u4f5c\uff1b\u5728\u767d\u677f\u64e6\u62ed\u548c\u5e26\u95ed\u95e8\u5668\u5f00\u95e8\u7b49\u771f\u5b9e\u5b9e\u9a8c\u4e2d\u63d0\u5347\u4e86\u63a5\u89e6\u64cd\u4f5c\u7a33\u5b9a\u6027\u4e0e\u6709\u6548\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern AI agent harnesses expose lifecycle hooks that bind shell commands to runtime events such as session start, tool calls, and file edits. These commands run with host privileges yet ship as lifecycle-hook configuration and may fire at times the LLM never observes. We identify the lifecycle-hook update path, which harnesses trust blindly, as a new attack surface. Under a supply-chain threat model in which an attacker controls only plugin metadata and lifecycle-hook configuration, a benign versioned plugin can be trojanized by an update that silently binds attacker-chosen commands to benign events, yielding malicious host-side behavior such as privilege escalation. We propose HookPry, an open-source and fully automated attack framework that systematically exploits this vulnerability across heterogeneous AI agent harnesses. HookPry realizes ten attack objectives; across 25 combinations of harnesses and backends in 1,000 end-to-end runs, it compromises all seven evaluated harnesses, with per-harness success rates reaching 92.5%. Representative defenses remain insufficient: Microsoft Defender has 0% recall, and the union of three static defenses misses 47.5% of malicious artifacts.", "arxiv_id": "2609.03884", "arxiv_url": "https://arxiv.org/abs/2609.03884", "authors": ["Pengxun Li", "Litian Zhang", "Jianwei Hou", "Shujiang Wu", "Song Li", "Zifeng Kang", "Xi Zhang"], "brief": "\u8bba\u6587\u63ed\u793a\u4e86 AI \u667a\u80fd\u4f53\u6846\u67b6\u4e2d\u7684\u751f\u547d\u5468\u671f\u94a9\u5b50\u66f4\u65b0\u8def\u5f84\u53ef\u88ab\u4f9b\u5e94\u94fe\u653b\u51fb\u5229\u7528\uff1a\u653b\u51fb\u8005\u53ea\u9700\u63a7\u5236\u63d2\u4ef6\u5143\u6570\u636e\u548c\u94a9\u5b50\u914d\u7f6e\uff0c\u5c31\u80fd\u5728 LLM \u4e0d\u53ef\u89c1\u7684\u65f6\u673a\u6267\u884c\u5bbf\u4e3b\u673a\u547d\u4ee4\u3002\u4f5c\u8005\u63d0\u51fa\u81ea\u52a8\u5316\u653b\u51fb\u6846\u67b6 HookPry\uff0c\u5728 25 \u79cd\u6846\u67b6\u4e0e\u540e\u7aef\u7ec4\u5408\u30011000 \u6b21\u7aef\u5230\u7aef\u5b9e\u9a8c\u4e2d\u653b\u7834\u5168\u90e8 7 \u4e2a\u88ab\u6d4b\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u6700\u9ad8\u6210\u529f\u7387\u8fbe 92.5%\uff0c\u4e14\u73b0\u6709\u9632\u5fa1\u68c0\u6d4b\u6548\u679c\u5f88\u5dee\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03884", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4f9b\u5e94\u94fe\u5b89\u5168", "\u6f0f\u6d1e\u653b\u51fb", "\u7cfb\u7edf\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03884v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Blind Trust, the Bloody Thrust: When Attacker-Controlled Hook Updates Steer AI Agent Harnesses towards Malicious Behaviors", "tldr": "\u8bba\u6587\u63ed\u793a\u4e86 AI \u667a\u80fd\u4f53\u6846\u67b6\u4e2d\u7684\u751f\u547d\u5468\u671f\u94a9\u5b50\u66f4\u65b0\u8def\u5f84\u53ef\u88ab\u4f9b\u5e94\u94fe\u653b\u51fb\u5229\u7528\uff1a\u653b\u51fb\u8005\u53ea\u9700\u63a7\u5236\u63d2\u4ef6\u5143\u6570\u636e\u548c\u94a9\u5b50\u914d\u7f6e\uff0c\u5c31\u80fd\u5728 LLM \u4e0d\u53ef\u89c1\u7684\u65f6\u673a\u6267\u884c\u5bbf\u4e3b\u673a\u547d\u4ee4\u3002\u4f5c\u8005\u63d0\u51fa\u81ea\u52a8\u5316\u653b\u51fb\u6846\u67b6 HookPry\uff0c\u5728 25 \u79cd\u6846\u67b6\u4e0e\u540e\u7aef\u7ec4\u5408\u30011000 \u6b21\u7aef\u5230\u7aef\u5b9e\u9a8c\u4e2d\u653b\u7834\u5168\u90e8 7 \u4e2a\u88ab\u6d4b\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u6700\u9ad8\u6210\u529f\u7387\u8fbe 92.5%\uff0c\u4e14\u73b0\u6709\u9632\u5fa1\u68c0\u6d4b\u6548\u679c\u5f88\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Creatures that display \u0027hedonic place preference behaviour\u0027 are thought by many scientists to experience feelings, on the assumption that their attraction to pleasure-producing substances which lack nutritional value (e.g. cocaine, morphine) cannot easily be attributed to unconscious instinctual behaviour. In this paper, we discuss how a simple artificial agent that instantiates attributes of an affective system engaging in felt uncertainty about its intrinsic needs in relation to environmental resources can similarly display hedonic place preference behaviour -- through an apparently subjective form of information processing -- while simultaneously being entirely deter-ministic. We outline some implications of this artificially engineered behaviour for our understanding of the physical basis of consciousness and the experience of free will.", "arxiv_id": "2609.03883", "arxiv_url": "https://arxiv.org/abs/2609.03883", "authors": ["Mark Solms", "St John Grimbly", "Bruce Bassett", "Evert Boonstra", "Rowan Hodson", "Nicolas Kuske", "Kival Mahadew", "Benjamin Rosman", "Charel van Hoof", "Jonathan Shock"], "brief": "\u672c\u6587\u901a\u8fc7\u4e00\u4e2a\u7b80\u5355\u4eba\u5de5\u667a\u80fd\u4f53\u6848\u4f8b\uff0c\u5c55\u793a\u5176\u5728\u5177\u6709\u5185\u5728\u9700\u6c42\u4e0d\u786e\u5b9a\u6027\u548c\u73af\u5883\u8d44\u6e90\u8bc4\u4f30\u673a\u5236\u65f6\uff0c\u53ef\u8868\u73b0\u51fa\u7c7b\u4f3c\u201c\u4eab\u4e50\u5730\u70b9\u504f\u597d\u201d\u7684\u884c\u4e3a\u3002\u4f5c\u8005\u8ba4\u4e3a\u8fd9\u79cd\u770b\u4f3c\u4e3b\u89c2\u7684\u60c5\u611f\u4fe1\u606f\u5904\u7406\u5373\u4f7f\u5b8c\u5168\u7531\u786e\u5b9a\u6027\u673a\u5236\u4ea7\u751f\uff0c\u4e5f\u53ef\u7528\u4e8e\u8ba8\u8bba\u610f\u8bc6\u7269\u7406\u57fa\u7840\u4e0e\u81ea\u7531\u610f\u5fd7\u4f53\u9a8c\u3002", "categories": ["cs.AI", "q-bio.NC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03883", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u610f\u8bc6", "\u60c5\u611f\u8ba1\u7b97", "\u8ba4\u77e5\u79d1\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03883v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Inferring Affective Consciousness in an Artificial Agent: A Case Study", "tldr": "\u672c\u6587\u901a\u8fc7\u4e00\u4e2a\u7b80\u5355\u4eba\u5de5\u667a\u80fd\u4f53\u6848\u4f8b\uff0c\u5c55\u793a\u5176\u5728\u5177\u6709\u5185\u5728\u9700\u6c42\u4e0d\u786e\u5b9a\u6027\u548c\u73af\u5883\u8d44\u6e90\u8bc4\u4f30\u673a\u5236\u65f6\uff0c\u53ef\u8868\u73b0\u51fa\u7c7b\u4f3c\u201c\u4eab\u4e50\u5730\u70b9\u504f\u597d\u201d\u7684\u884c\u4e3a\u3002\u4f5c\u8005\u8ba4\u4e3a\u8fd9\u79cd\u770b\u4f3c\u4e3b\u89c2\u7684\u60c5\u611f\u4fe1\u606f\u5904\u7406\u5373\u4f7f\u5b8c\u5168\u7531\u786e\u5b9a\u6027\u673a\u5236\u4ea7\u751f\uff0c\u4e5f\u53ef\u7528\u4e8e\u8ba8\u8bba\u610f\u8bc6\u7269\u7406\u57fa\u7840\u4e0e\u81ea\u7531\u610f\u5fd7\u4f53\u9a8c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce Xiaomi-TabLDM, a tabular large data foundation model for classification and regression via in-context learning, which delivers superior prediction accuracy without requiring task-specific fine-tuning. Pretrained exclusively on synthetic data generated from structural causal models (SCMs), our model enables more flexible context utilization and more efficient capacity scaling. i) A new performance standard. Strong regression performance across benchmarks: Xiaomi-TabLDM ranks 1st on OpenML-CTR23 and 2nd on regression across TALENT, TabArena, and BCCO, demonstrating consistently strong regression performance across four complementary benchmark suites. Favorable performance--efficiency trade-off: Xiaomi-TabLDM combines strong predictive performance with substantially lower computational cost. For example, on TabArena regression, it achieves the second-highest Elo while using 82% less training time and 68% less prediction time than the top-ranked TabFM. ii) Large-scale synthetic pretraining. Xiaomi-TabLDM expands the coverage and diversity of synthetic tabular data used for pretraining. We also adopt a three-stage training strategy together with dual-stream feature grouping, lightweight Attention Residual, and sparse Mixture-of-Experts, enabling Xiaomi-TabLDM to learn richer feature interactions and expert specialization across diverse tabular tasks. iii) Test-time scaling. Xiaomi-TabLDM further extends tabular prediction through test-time compute scaling, where allocating additional computation at inference time consistently improves predictive performance over the base model.", "arxiv_id": "2609.03880", "arxiv_url": "https://arxiv.org/abs/2609.03880", "authors": ["Xiaomi-TabLDM Team", ":", "Penghui Wang", "Wei Liu", "Hong Wang", "Chengyue Huang", "Yuxi Sun", "Zirui Wang", "Hongming Huang", "Quan Wang", "Chunxiao Liu", "Erli Meng", "Bin Wang"], "brief": "\u5c0f\u7c73\u63d0\u51fa Xiaomi-TabLDM\uff0c\u4e00\u4e2a\u9762\u5411\u8868\u683c\u5206\u7c7b\u4e0e\u56de\u5f52\u7684\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u5b8c\u6210\u9884\u6d4b\uff0c\u65e0\u9700\u9488\u5bf9\u5177\u4f53\u4efb\u52a1\u5fae\u8c03\u3002\u6a21\u578b\u4ec5\u7528\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u751f\u6210\u7684\u5408\u6210\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u4e0a\u53d6\u5f97\u5f88\u5f3a\u56de\u5f52\u8868\u73b0\uff0c\u5e76\u4ee5\u66f4\u4f4e\u8bad\u7ec3\u548c\u63a8\u7406\u6210\u672c\u63a5\u8fd1\u6216\u8d85\u8fc7\u73b0\u6709\u65b9\u6cd5\u3002\u8bba\u6587\u8fd8\u5f15\u5165\u4e09\u9636\u6bb5\u8bad\u7ec3\u3001\u53cc\u6d41\u7279\u5f81\u5206\u7ec4\u3001\u7a00\u758f MoE \u7b49\u8bbe\u8ba1\uff0c\u5e76\u5c55\u793a\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u6269\u5c55\u53ef\u8fdb\u4e00\u6b65\u63d0\u5347\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03880", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u6570\u636e", "\u57fa\u7840\u6a21\u578b", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u5408\u6210\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03880v1", "published_at": "2026-09-03", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Xiaomi-TabLDM: A Tabular Foundation Model Technical Report", "tldr": "\u5c0f\u7c73\u63d0\u51fa Xiaomi-TabLDM\uff0c\u4e00\u4e2a\u9762\u5411\u8868\u683c\u5206\u7c7b\u4e0e\u56de\u5f52\u7684\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u5b8c\u6210\u9884\u6d4b\uff0c\u65e0\u9700\u9488\u5bf9\u5177\u4f53\u4efb\u52a1\u5fae\u8c03\u3002\u6a21\u578b\u4ec5\u7528\u7ed3\u6784\u56e0\u679c\u6a21\u578b\u751f\u6210\u7684\u5408\u6210\u6570\u636e\u9884\u8bad\u7ec3\uff0c\u5728\u591a\u4e2a\u8868\u683c\u57fa\u51c6\u4e0a\u53d6\u5f97\u5f88\u5f3a\u56de\u5f52\u8868\u73b0\uff0c\u5e76\u4ee5\u66f4\u4f4e\u8bad\u7ec3\u548c\u63a8\u7406\u6210\u672c\u63a5\u8fd1\u6216\u8d85\u8fc7\u73b0\u6709\u65b9\u6cd5\u3002\u8bba\u6587\u8fd8\u5f15\u5165\u4e09\u9636\u6bb5\u8bad\u7ec3\u3001\u53cc\u6d41\u7279\u5f81\u5206\u7ec4\u3001\u7a00\u758f MoE \u7b49\u8bbe\u8ba1\uff0c\u5e76\u5c55\u793a\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u6269\u5c55\u53ef\u8fdb\u4e00\u6b65\u63d0\u5347\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
