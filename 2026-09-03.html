u8868\u793a\u5b66\u4e60", "Transformer", "\u538b\u7f29"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2609.01740v1", "published_at": "2026-09-01", "score": 0.264, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01740.png", "title": "ZipTok3D: High-Fidelity 3D Tokenization with Compact Token Prefixes", "tldr": "\u7528\u6781\u77ed\u5168\u5c40\u524d\u7f00\u5b9e\u73b0\u9ad8\u4fdd\u771f3D\u91cd\u5efa", "upvotes": 22, "what_it_is": "\u8bba\u6587\u63d0\u51fa ZipTok3D\uff0c\u4e00\u79cd\u9762\u5411\u9ad8\u65483D\u751f\u6210\u7684\u9ad8\u4fdd\u771f3D tokenizer\u3002\u5b83\u5c06\u7269\u4f53\u51e0\u4f55\u538b\u7f29\u4e3a\u9010\u6b65\u589e\u5f3a\u4fe1\u606f\u91cf\u7684\u5168\u5c40 token \u524d\u7f00\uff0c\u5e76\u901a\u8fc7\u8fed\u4ee3\u89e3\u7801\u4ece\u6781\u77ed\u5e8f\u5217\u6062\u590d\u5b8c\u6574\u7ec6\u8282\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u663e\u8457\u964d\u4f4e3D\u8868\u793a\u7684 token \u9884\u7b97\uff0c\u6709\u671b\u63d0\u53473D\u751f\u6210\u6a21\u578b\u7684\u8bad\u7ec3\u4e0e\u63a8\u7406\u6548\u7387\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u91cd\u5efa\u8d28\u91cf\uff0c\u5bf9\u5927\u89c4\u6a213D\u751f\u6210\u548c\u591a\u6a21\u6001\u751f\u6210\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "An image may be worth a thousand words, but most captioning models describe it in only a few. Modern vision-language models produce fluent high-level captions, yet routinely miss the attributes, counts, textures, materials, and spatial relations that make an image visually specific. Recent multi-stage systems recover some of these details through generation, decomposition, verification, and rewriting, but they do so at the expense of substantially higher inference latency. We propose SimLoss, a reference-free embedding-space objective for single-pass fine-grained image captioning. SimLoss trains a vision-language model to align its projected hidden-state representation with a frozen image embedding through an InfoNCE contrastive loss, supplying a dense visual supervision signal before any text is decoded, and requiring neither human-written fine-grained captions nor pseudo-captions from a multi-stage pipeline. We instantiate it as SimLoss FFT, which backpropagates through a locally available embedding model, and SimLoss GRPO, which treats that model as a black-box reward. Compared with single-pass, multi-stage verification, reward-optimized, and perception-aware baselines, the fully differentiable fine-tuning variant, SimLoss FFT, achieves the highest precision while nearly matching the F1 score of the multi-stage method, all while retaining single-pass inference and running roughly 20 times faster than the multi-stage pipeline. The reward-based variant SimLoss GRPO attains the strongest recall. Together, these results show that embedding-space supervision can recover the quality of multi-stage verification at the latency of a single-pass captioner.", "arxiv_id": "2609.00591", "arxiv_url": "https://arxiv.org/abs/2609.00591", "authors": ["Suryaansh Jain", "Rahasya Barkur", "Vishal G", "Ryan Rossi", "Franck Dernoncourt", "Jack Wang", "Koustava Goswami", "Nedim Lipka", "Puneet Mathur", "Samyadeep Basu", "Seunghyun Yoon"], "brief": "\u8bba\u6587\u63d0\u51fa SimLoss\uff0c\u4e00\u79cd\u65e0\u9700\u53c2\u8003\u6587\u672c\u7684\u5d4c\u5165\u7a7a\u95f4\u8bad\u7ec3\u76ee\u6807\uff0c\u7528\u4e8e\u63d0\u5347\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u7ec6\u7c92\u5ea6\u56fe\u50cf\u63cf\u8ff0\u80fd\u529b\u3002\u5b83\u5728\u89e3\u7801\u6587\u672c\u524d\u901a\u8fc7 InfoNCE \u5bf9\u6bd4\u635f\u5931\u5bf9\u9f50\u6a21\u578b\u9690\u85cf\u8868\u793a\u4e0e\u51bb\u7ed3\u56fe\u50cf\u5d4c\u5165\uff0c\u4ece\u800c\u5728\u5355\u6b21\u63a8\u7406\u4e2d\u6355\u6349\u5c5e\u6027\u3001\u6570\u91cf\u3001\u6750\u8d28\u548c\u7a7a\u95f4\u5173\u7cfb\u7b49\u7ec6\u8282\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00591", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["SimLoss \u4e0d\u4f9d\u8d56\u4eba\u5de5\u7ec6\u7c92\u5ea6\u6807\u6ce8\u6216\u591a\u9636\u6bb5\u4f2a\u5b57\u5e55\uff0c\u800c\u662f\u76f4\u63a5\u4f7f\u7528\u51bb\u7ed3\u56fe\u50cf\u5d4c\u5165\u63d0\u4f9b\u7a20\u5bc6\u89c6\u89c9\u76d1\u7763\u3002", "\u63d0\u51fa\u4e24\u79cd\u5b9e\u73b0\uff1aSimLoss FFT \u53ef\u5bf9\u672c\u5730\u56fe\u50cf\u5d4c\u5165\u6a21\u578b\u53cd\u5411\u4f20\u64ad\uff1bSimLoss GRPO \u5c06\u5d4c\u5165\u6a21\u578b\u4f5c\u4e3a\u9ed1\u76d2\u5956\u52b1\u8fdb\u884c\u4f18\u5316\u3002", "SimLoss FFT \u5728\u4fdd\u6301\u5355\u6b21\u63a8\u7406\u7684\u540c\u65f6\u53d6\u5f97\u6700\u9ad8 precision\uff0cF1 \u63a5\u8fd1\u591a\u9636\u6bb5\u9a8c\u8bc1\u65b9\u6cd5\uff0c\u5e76\u7ea6\u5feb 20 \u500d\uff1bSimLoss GRPO \u5219\u83b7\u5f97\u6700\u5f3a recall\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u63cf\u8ff0", "\u5bf9\u6bd4\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Adobe Research", "pdf_url": "https://arxiv.org/pdf/2609.00591v1", "published_at": "2026-09-01", "score": 0.256, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00591.png", "title": "A Glance Is All You Need: Single-Pass Fine-Grained Image Captioning with SimLoss", "tldr": "\u7528\u5d4c\u5165\u76d1\u7763\u5b9e\u73b0\u5355\u6b21\u7ec6\u7c92\u5ea6\u56fe\u50cf\u63cf\u8ff0", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa SimLoss\uff0c\u4e00\u79cd\u65e0\u9700\u53c2\u8003\u6587\u672c\u7684\u5d4c\u5165\u7a7a\u95f4\u8bad\u7ec3\u76ee\u6807\uff0c\u7528\u4e8e\u63d0\u5347\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u7ec6\u7c92\u5ea6\u56fe\u50cf\u63cf\u8ff0\u80fd\u529b\u3002\u5b83\u5728\u89e3\u7801\u6587\u672c\u524d\u901a\u8fc7 InfoNCE \u5bf9\u6bd4\u635f\u5931\u5bf9\u9f50\u6a21\u578b\u9690\u85cf\u8868\u793a\u4e0e\u51bb\u7ed3\u56fe\u50cf\u5d4c\u5165\uff0c\u4ece\u800c\u5728\u5355\u6b21\u63a8\u7406\u4e2d\u6355\u6349\u5c5e\u6027\u3001\u6570\u91cf\u3001\u6750\u8d28\u548c\u7a7a\u95f4\u5173\u7cfb\u7b49\u7ec6\u8282\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u591a\u9636\u6bb5\u7ec6\u8282\u6821\u9a8c\u5e26\u6765\u7684\u8d28\u91cf\u63d0\u5347\u538b\u7f29\u5230\u5355\u6b21\u751f\u6210\u6d41\u7a0b\u4e2d\uff0c\u663e\u8457\u964d\u4f4e\u63a8\u7406\u5ef6\u8fdf\uff0c\u5bf9\u9700\u8981\u9ad8\u8d28\u91cf\u3001\u4f4e\u5ef6\u8fdf\u56fe\u50cf\u63cf\u8ff0\u7684\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLMs are increasingly deployed as orchestrators that coordinate specialized subagents to solve complex tasks through natural language. However, in many important domains like game playing and robotics, the strongest available agents are not language models. Integrating non-language agents with LLMs would require \\emph{verbalization}: compressing their rich continuous representations into sparse textual summaries at each interaction step. To study whether verbalization constitutes a bottleneck, we introduce \\textsc{LLAMIA-Bench}, a suite of six diverse collaborative chess tasks spanning three facets: behavioral imitation, state assessment, and natural-language explanation. Each task instantiates a well-established chess problem that neither the LLM nor the chess engine can solve alone. To solve LLM collaboration with non-language agents, we introduce \\emph{latent state internalization}, which projects the subagent\u0027s continuous representations directly into the LLM\u0027s token stream as learned state tokens, with dynamic re-encoding as actions advance the environment state. Comparing internalization to verbalized integration, our experiments reveal a consistent \\emph{verbalization debt}: the performance gap widens throughout training and persists as the LLM scales from 4B to 14B parameters. A single 14B model, \\textsc{LLAMIA}, trained with latent state internalization, matches or exceeds task specialists and frontier models including GPT-5.1 with tool access across all benchmark tasks, and generalizes out-of-distribution where task-specific finetunes collapse", "arxiv_id": "2609.00474", "arxiv_url": "https://arxiv.org/abs/2609.00474", "authors": ["Harini S", "Somesh Singh", "Yaman K Singla", "Rajiv Ratn Shah", "David Doermann", "Balaji Krishnamurthy"], "brief": "\u8bba\u6587\u63d0\u51fa LLAMIA-Bench\uff0c\u7528\u516d\u4e2a\u534f\u4f5c\u68cb\u7c7b\u4efb\u52a1\u8bc4\u4f30 LLM \u4e0e\u975e\u8bed\u8a00\u667a\u80fd\u4f53\u7684\u534f\u4f5c\u80fd\u529b\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6f5c\u5728\u72b6\u6001\u5185\u5316\u201d\uff0c\u5c06\u68cb\u7c7b\u5f15\u64ce\u7b49\u5b50\u667a\u80fd\u4f53\u7684\u8fde\u7eed\u8868\u5f81\u6295\u5c04\u4e3a\u53ef\u5b66\u4e60\u72b6\u6001\u4ee4\u724c\u5e76\u6ce8\u5165 LLM token \u6d41\uff0c\u66ff\u4ee3\u6587\u672c\u5316\u6458\u8981\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.00474", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["LLAMIA-Bench \u8986\u76d6\u884c\u4e3a\u6a21\u4eff\u3001\u72b6\u6001\u8bc4\u4f30\u3001\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u4e09\u7c7b\u4efb\u52a1\uff0c\u8bbe\u8ba1\u4e3a LLM \u6216\u68cb\u7c7b\u5f15\u64ce\u5355\u72ec\u90fd\u96be\u4ee5\u89e3\u51b3\u7684\u534f\u4f5c\u95ee\u9898\u3002", "\u6f5c\u5728\u72b6\u6001\u5185\u5316\u901a\u8fc7 learned state tokens \u548c\u968f\u73af\u5883\u52a8\u4f5c\u63a8\u8fdb\u7684\u52a8\u6001\u91cd\u7f16\u7801\uff0c\u76f4\u63a5\u4f20\u9012\u975e\u8bed\u8a00\u667a\u80fd\u4f53\u7684\u8fde\u7eed\u72b6\u6001\u4fe1\u606f\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u7a33\u5b9a\u7684\u201c\u6587\u672c\u5316\u503a\u52a1\u201d\uff1a\u5c06\u8fde\u7eed\u8868\u5f81\u538b\u7f29\u6210\u6587\u5b57\u4f1a\u5f62\u6210\u6027\u80fd\u74f6\u9888\uff0c\u4e14\u6a21\u578b\u4ece 4B \u6269\u5c55\u5230 14B \u540e\u5dee\u8ddd\u4ecd\u6301\u7eed\u5b58\u5728\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53\u534f\u4f5c", "\u8868\u793a\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": "Adobe", "pdf_url": "https://arxiv.org/pdf/2609.00474v2", "published_at": "2026-08-31", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.00474.png", "title": "Exploring Collaboration between a language and a non-language agent", "tldr": "\u7528\u72b6\u6001\u4ee4\u724c\u6253\u901aLLM\u4e0e\u975e\u8bed\u8a00\u667a\u80fd\u4f53", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa LLAMIA-Bench\uff0c\u7528\u516d\u4e2a\u534f\u4f5c\u68cb\u7c7b\u4efb\u52a1\u8bc4\u4f30 LLM \u4e0e\u975e\u8bed\u8a00\u667a\u80fd\u4f53\u7684\u534f\u4f5c\u80fd\u529b\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6f5c\u5728\u72b6\u6001\u5185\u5316\u201d\uff0c\u5c06\u68cb\u7c7b\u5f15\u64ce\u7b49\u5b50\u667a\u80fd\u4f53\u7684\u8fde\u7eed\u8868\u5f81\u6295\u5c04\u4e3a\u53ef\u5b66\u4e60\u72b6\u6001\u4ee4\u724c\u5e76\u6ce8\u5165 LLM token \u6d41\uff0c\u66ff\u4ee3\u6587\u672c\u5316\u6458\u8981\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa LLM \u7f16\u6392\u975e\u8bed\u8a00\u4e13\u5bb6\u65f6\uff0c\u5355\u7eaf\u4f9d\u8d56\u81ea\u7136\u8bed\u8a00\u63a5\u53e3\u53ef\u80fd\u9650\u5236\u6027\u80fd\uff0c\u5e76\u63d0\u4f9b\u4e86\u76f4\u63a5\u878d\u5408\u8fde\u7eed\u8868\u5f81\u7684\u66ff\u4ee3\u8def\u5f84\uff1b\u5176 14B LLAMIA \u5728\u57fa\u51c6\u4e0a\u5339\u654c\u6216\u8d85\u8fc7\u4efb\u52a1\u4e13\u5bb6\u53ca\u5e26\u5de5\u5177\u7684\u524d\u6cbf\u6a21\u578b\uff0c\u663e\u793a\u51fa\u5bf9\u6e38\u620f\u3001\u673a\u5668\u4eba\u7b49\u975e\u8bed\u8a00\u667a\u80fd\u4f53\u534f\u4f5c\u573a\u666f\u7684\u6f5c\u5728\u5f71\u54cd\u3002"}, {"abstract": "Streaming video understanding requires multimodal large language models (MLLMs) to process continuous visual inputs and respond to user queries under strict causality and bounded memory. Existing approaches typically compress historical observations into an external memory bank and retrieve query-relevant evidence as additional visual context. Though effective, this store-and-retrieve paradigm keeps historical evidence as external visual context, preventing it from being internalized into a compact, evolving latent memory that can continuously guide streaming reasoning. To bridge this gap, we introduce LatentStream, a progressive latent working memory framework that shifts streaming memory from store-and-retrieve to retrieve-and-internalize. Specifically, LatentStream comprises three coordinated components. First, Query-agnostic Hierarchical Streaming Memory organizes visual history into short-, mid-, and long-term levels under a fixed memory budget through Jenks-guided adaptive consolidation. Once a query arrives, Hierarchical Latent Memory Evolution equips groups of latent memory tokens with progressively expanding memory receptive fields, enabling them to iteratively retrieve historical evidence from their corresponding scopes and internalize it into a compact, fixed-length latent memory. Finally, Progressive Confidence-guided Latent Memory Optimization constructs a hierarchical progression reward from group-wise predictive entropy and jointly refines the latent memory tokens and retrieved evidence, encouraging increasingly confident streaming reasoning. Extensive experiments demonstrate that LatentStream achieves new state-of-the-art results on existing online and offline video benchmarks.", "arxiv_id": "2609.04131", "arxiv_url": "https://arxiv.org/abs/2609.04131", "authors": ["Hongyu Qu", "Guangming Yao", "Ling Xing", "Xiaobin Hu", "Rongxing Ding", "Guibin Zhang", "Fan Zhang", "Yi Yuan", "Xiangbo Shu", "Shuicheng Yan"], "brief": "\u8bba\u6587\u63d0\u51fa LatentStream\uff0c\u4e00\u79cd\u9762\u5411\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u7684\u6e10\u8fdb\u5f0f\u6f5c\u5728\u5de5\u4f5c\u8bb0\u5fc6\u6846\u67b6\u3002\u5b83\u5c06\u5386\u53f2\u89c6\u89c9\u4fe1\u606f\u4ece\u201c\u5b58\u50a8\u540e\u68c0\u7d22\u201d\u8f6c\u4e3a\u201c\u68c0\u7d22\u540e\u5185\u5316\u201d\uff0c\u628a\u8bc1\u636e\u538b\u7f29\u8fdb\u56fa\u5b9a\u957f\u5ea6\u3001\u6301\u7eed\u6f14\u5316\u7684\u6f5c\u5728\u8bb0\u5fc6\u4e2d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04131", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u67e5\u8be2\u65e0\u5173\u7684\u5206\u5c42\u6d41\u5f0f\u8bb0\u5fc6\uff0c\u5728\u56fa\u5b9a\u9884\u7b97\u4e0b\u7ef4\u62a4\u77ed\u671f\u3001\u4e2d\u671f\u3001\u957f\u671f\u89c6\u89c9\u5386\u53f2\uff0c\u5e76\u7528 Jenks \u5f15\u5bfc\u7684\u81ea\u9002\u5e94\u5408\u5e76\u63a7\u5236\u8bb0\u5fc6\u89c4\u6a21\u3002", "\u8bbe\u8ba1\u5206\u5c42\u6f5c\u5728\u8bb0\u5fc6\u6f14\u5316\u673a\u5236\uff0c\u8ba9\u4e0d\u540c\u7ec4\u7684\u6f5c\u5728\u8bb0\u5fc6 token \u9010\u6b65\u6269\u5927\u611f\u53d7\u91ce\uff0c\u68c0\u7d22\u5bf9\u5e94\u8303\u56f4\u5185\u7684\u5386\u53f2\u8bc1\u636e\u5e76\u5185\u5316\u4e3a\u7d27\u51d1\u8868\u793a\u3002", "\u63d0\u51fa\u57fa\u4e8e\u9884\u6d4b\u71b5\u7684\u7f6e\u4fe1\u5ea6\u5f15\u5bfc\u4f18\u5316\uff0c\u901a\u8fc7\u5c42\u7ea7\u8fdb\u5c55\u5956\u52b1\u8054\u5408\u4f18\u5316\u6f5c\u5728\u8bb0\u5fc6\u4e0e\u68c0\u7d22\u8bc1\u636e\uff0c\u5728\u591a\u4e2a\u5728\u7ebf\u548c\u79bb\u7ebf\u89c6\u9891\u57fa\u51c6\u4e0a\u8fbe\u5230\u65b0 SOTA\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u8bb0\u5fc6\u673a\u5236", "\u6d41\u5f0f\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04131v1", "published_at": "2026-09-03", "score": 0.246, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04131.png", "title": "Beyond Retrieval: Progressive Latent Memory Evolution for Streaming Video Understanding", "tldr": "\u7528\u6e10\u8fdb\u6f5c\u5728\u8bb0\u5fc6\u63d0\u5347\u6d41\u5f0f\u89c6\u9891\u7406\u89e3", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa LatentStream\uff0c\u4e00\u79cd\u9762\u5411\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u7684\u6e10\u8fdb\u5f0f\u6f5c\u5728\u5de5\u4f5c\u8bb0\u5fc6\u6846\u67b6\u3002\u5b83\u5c06\u5386\u53f2\u89c6\u89c9\u4fe1\u606f\u4ece\u201c\u5b58\u50a8\u540e\u68c0\u7d22\u201d\u8f6c\u4e3a\u201c\u68c0\u7d22\u540e\u5185\u5316\u201d\uff0c\u628a\u8bc1\u636e\u538b\u7f29\u8fdb\u56fa\u5b9a\u957f\u5ea6\u3001\u6301\u7eed\u6f14\u5316\u7684\u6f5c\u5728\u8bb0\u5fc6\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7a81\u7834\u4e86\u6d41\u5f0f\u89c6\u9891\u7406\u89e3\u4e2d\u5e38\u89c1\u7684\u5916\u90e8\u8bb0\u5fc6\u68c0\u7d22\u8303\u5f0f\uff0c\u4f7f MLLM \u80fd\u5728\u56e0\u679c\u7ea6\u675f\u548c\u56fa\u5b9a\u5185\u5b58\u4e0b\u5f62\u6210\u53ef\u6f14\u5316\u7684\u5185\u90e8\u8bb0\u5fc6\uff0c\u5bf9\u957f\u89c6\u9891\u5b9e\u65f6\u7406\u89e3\u4e0e\u591a\u6a21\u6001\u63a8\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Camera-conditioned world models generate interactive videos in which commanded actions should induce the expected scene changes while appearance, geometry, and temporal dynamics remain coherent. Existing rewards assess these requirements separately: geometry-based rewards estimate trajectory execution but cannot judge the visual quality of the executed motion, whereas image-based rewards measure frame quality without capturing action execution or temporal dynamics. We posit that a vision-language model (VLM) offers a shared reasoning space for relating actions to their visual outcomes. However, judging a complete long video against its full action sequence creates a lengthy, noisy context in which short-lived local action evidence can be missed or diluted. We present WorldReward, a VLM-based pairwise preference reward model that unifies action-consistency and visual-quality evaluation for camera-conditioned world models. WorldReward decomposes paired videos into action-aligned chunks, organizes each chunk into structured visual evidence, and aggregates chunk-level decisions by voting into separate video-level action and visual-quality preferences. To train it, we construct a large-scale reasoning-augmented preference dataset using structured judgments generated by a frontier VLM and refined through tool-based agent auditing and targeted human review. We further introduce WorldReward-Bench, a human-annotated benchmark measuring reward-model agreement with human preferences across action consistency, appearance quality, and motion quality. WorldReward achieves the highest agreement on all three dimensions, exceeding GPT-5.5 by 3.42, 1.45, and 3.56 percentage points, respectively. When used for RL post-training of HY-WorldPlay 1.5, it consistently improves both action execution and visual quality across short- to long-term horizons.", "arxiv_id": "2609.03952", "arxiv_url": "https://arxiv.org/abs/2609.03952", "authors": ["Yibin Wang", "Zehan Wang", "Junshu Tang", "Zhimin Li", "Yujie Zhou", "Jiazi Bu", "Pengyang Ling", "Feng Han", "Zhixiong Zhang", "Long Xing", "Shengyuan Ding", "Ziang Li", "Cheng Jin", "Yuhang Zang", "Jiaqi Wang", "Tianyu Pang"], "brief": "\u8bba\u6587\u63d0\u51fa WorldReward\uff0c\u4e00\u4e2a\u57fa\u4e8e VLM \u7684\u6210\u5bf9\u504f\u597d\u5956\u52b1\u6a21\u578b\uff0c\u7528\u4e8e\u8bc4\u4f30\u76f8\u673a\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u751f\u6210\u89c6\u9891\u4e2d\u7684\u52a8\u4f5c\u4e00\u81f4\u6027\u4e0e\u89c6\u89c9\u8d28\u91cf\u3002\u5b83\u5c06\u957f\u89c6\u9891\u6309\u52a8\u4f5c\u5bf9\u9f50\u5207\u5757\uff0c\u63d0\u53d6\u7ed3\u6784\u5316\u89c6\u89c9\u8bc1\u636e\uff0c\u5e76\u901a\u8fc7\u6295\u7968\u805a\u5408\u5f97\u5230\u89c6\u9891\u7ea7\u504f\u597d\u5224\u65ad\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03952", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u52a8\u4f5c\u4e00\u81f4\u6027\u3001\u5916\u89c2\u8d28\u91cf\u548c\u8fd0\u52a8\u8d28\u91cf\u7eb3\u5165\u540c\u4e00 VLM \u63a8\u7406\u6846\u67b6\uff0c\u5f25\u8865\u51e0\u4f55\u5956\u52b1\u4e0e\u56fe\u50cf\u5956\u52b1\u5404\u81ea\u7684\u5c40\u9650\u3002", "\u91c7\u7528\u52a8\u4f5c\u5bf9\u9f50\u7684\u89c6\u9891\u5207\u5757\u673a\u5236\uff0c\u907f\u514d\u957f\u89c6\u9891\u4e0a\u4e0b\u6587\u8fc7\u957f\u5bfc\u81f4\u5c40\u90e8\u52a8\u4f5c\u8bc1\u636e\u88ab\u7a00\u91ca\u3002", "\u6784\u5efa\u5e26\u63a8\u7406\u589e\u5f3a\u7684\u5927\u89c4\u6a21\u504f\u597d\u6570\u636e\u96c6\uff0c\u5e76\u5f15\u5165 WorldReward-Bench \u4eba\u7c7b\u6807\u6ce8\u57fa\u51c6\uff1b\u5728\u4e09\u9879\u6307\u6807\u4e0a\u5747\u8d85\u8fc7 GPT-5.5\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u5956\u52b1\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03952v1", "published_at": "2026-09-03", "score": 0.241, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03952.png", "title": "WorldReward: Reward Modeling for Camera-Conditioned World Models", "tldr": "WorldReward\u7edf\u4e00\u8bc4\u4f30\u4e16\u754c\u6a21\u578b\u52a8\u4f5c\u4e0e\u753b\u8d28", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldReward\uff0c\u4e00\u4e2a\u57fa\u4e8e VLM \u7684\u6210\u5bf9\u504f\u597d\u5956\u52b1\u6a21\u578b\uff0c\u7528\u4e8e\u8bc4\u4f30\u76f8\u673a\u6761\u4ef6\u4e16\u754c\u6a21\u578b\u751f\u6210\u89c6\u9891\u4e2d\u7684\u52a8\u4f5c\u4e00\u81f4\u6027\u4e0e\u89c6\u89c9\u8d28\u91cf\u3002\u5b83\u5c06\u957f\u89c6\u9891\u6309\u52a8\u4f5c\u5bf9\u9f50\u5207\u5757\uff0c\u63d0\u53d6\u7ed3\u6784\u5316\u89c6\u89c9\u8bc1\u636e\uff0c\u5e76\u901a\u8fc7\u6295\u7968\u805a\u5408\u5f97\u5230\u89c6\u9891\u7ea7\u504f\u597d\u5224\u65ad\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u63d0\u4f9b\u4e86\u66f4\u5168\u9762\u3001\u53ef\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684\u5956\u52b1\u4fe1\u53f7\uff0c\u80fd\u540c\u65f6\u63d0\u5347\u52a8\u4f5c\u6267\u884c\u51c6\u786e\u6027\u548c\u89c6\u89c9\u751f\u6210\u8d28\u91cf\uff0c\u5bf9\u89c6\u9891\u4e16\u754c\u6a21\u578b\u8bad\u7ec3\u4e0e\u8bc4\u6d4b\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "We propose Puffin-World, a unified multimodal architecture that integrates physical understanding, spatial simulation, and 3D world generation and reconstruction without relying on external offline modules. To reliably construct and interact with 3D worlds, our framework jointly models three native world states: physics (gravity field and latitude), geometry (depth), and appearance (image), together with a unified Omni-Camera representation that supports diverse tasks and flexible motions. Beyond modeling these states, we introduce a strategy for propagating physical dynamics across future frames. By grounding absolute camera properties in the real world, Puffin-World enables physically consistent and visually stable world generation. We further couple appearance and geometry within a single generative process, jointly synthesizing each future view and reconstructing its underlying geometry. This unified paradigm enables interleaved closed-loop applications requiring synergy across multiple tasks, including mimic and self-calibrated world exploration. To scale Puffin-World to complex scenarios, we construct Puffin-16M, comprising 15 million vision-language-camera triplets and 1 million trajectories featuring various and challenging motions. To foster further research in this area, we released the code, models, and datasets.", "arxiv_id": "2609.04196", "arxiv_url": "https://arxiv.org/abs/2609.04196", "authors": ["Kang Liao", "Yihang Luo", "Xiao-Ming Wu", "Linyi Jin", "Size Wu", "Chunyu Lin", "Yao Zhao", "Fei Wang", "Wei Li", "Chen Change Loy"], "brief": "Puffin-World \u63d0\u51fa\u4e00\u79cd\u7edf\u4e00\u591a\u6a21\u6001\u67b6\u6784\uff0c\u5c06\u7269\u7406\u7406\u89e3\u3001\u7a7a\u95f4\u6a21\u62df\u30013D\u4e16\u754c\u751f\u6210\u4e0e\u91cd\u5efa\u6574\u5408\u5230\u540c\u4e00\u6a21\u578b\u4e2d\uff0c\u65e0\u9700\u5916\u90e8\u79bb\u7ebf\u6a21\u5757\u3002\u5b83\u8054\u5408\u5efa\u6a21\u7269\u7406\u3001\u51e0\u4f55\u548c\u5916\u89c2\u4e09\u7c7b\u539f\u751f\u4e16\u754c\u72b6\u6001\uff0c\u5e76\u652f\u6301\u672a\u6765\u89c6\u89d2\u751f\u6210\u4e0e\u51e0\u4f55\u91cd\u5efa\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04196", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8054\u5408\u5efa\u6a21\u91cd\u529b\u573a\u4e0e\u7eac\u5ea6\u3001\u6df1\u5ea6\u3001\u56fe\u50cf\u4e09\u7c7b\u4e16\u754c\u72b6\u6001\uff0c\u589e\u5f3a\u7269\u7406\u4e00\u81f4\u6027\u4e0e\u7a7a\u95f4\u7406\u89e3\u80fd\u529b", "\u63d0\u51fa\u7edf\u4e00 Omni-Camera \u8868\u793a\uff0c\u652f\u6301\u591a\u4efb\u52a1\u3001\u591a\u76f8\u673a\u5c5e\u6027\u548c\u7075\u6d3b\u76f8\u673a\u8fd0\u52a8", "\u6784\u5efa Puffin-16M \u6570\u636e\u96c6\uff0c\u5305\u542b1500\u4e07\u89c6\u89c9-\u8bed\u8a00-\u76f8\u673a\u4e09\u5143\u7ec4\u548c100\u4e07\u590d\u6742\u8fd0\u52a8\u8f68\u8ff9"], "keywords": ["\u591a\u6a21\u6001", "\u4e16\u754c\u6a21\u578b", "3D\u751f\u6210", "\u7a7a\u95f4\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04196v1", "published_at": "2026-09-03", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04196.png", "title": "Puffin-World: Scaling a Unified Multimodal Model with Native 3D World States", "tldr": "\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u539f\u751f\u5efa\u6a213D\u4e16\u754c\u72b6\u6001", "upvotes": 2, "what_it_is": "Puffin-World \u63d0\u51fa\u4e00\u79cd\u7edf\u4e00\u591a\u6a21\u6001\u67b6\u6784\uff0c\u5c06\u7269\u7406\u7406\u89e3\u3001\u7a7a\u95f4\u6a21\u62df\u30013D\u4e16\u754c\u751f\u6210\u4e0e\u91cd\u5efa\u6574\u5408\u5230\u540c\u4e00\u6a21\u578b\u4e2d\uff0c\u65e0\u9700\u5916\u90e8\u79bb\u7ebf\u6a21\u5757\u3002\u5b83\u8054\u5408\u5efa\u6a21\u7269\u7406\u3001\u51e0\u4f55\u548c\u5916\u89c2\u4e09\u7c7b\u539f\u751f\u4e16\u754c\u72b6\u6001\uff0c\u5e76\u652f\u6301\u672a\u6765\u89c6\u89d2\u751f\u6210\u4e0e\u51e0\u4f55\u91cd\u5efa\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8bd5\u56fe\u5c063D\u751f\u6210\u3001\u91cd\u5efa\u3001\u7269\u7406\u52a8\u6001\u4f20\u64ad\u548c\u76f8\u673a\u81ea\u6821\u51c6\u7edf\u4e00\u5230\u4e00\u4e2a\u53ef\u6269\u5c55\u6a21\u578b\u4e2d\uff0c\u6709\u671b\u63a8\u52a8\u5177\u5907\u7269\u7406\u4e00\u81f4\u6027\u7684\u4e16\u754c\u6a21\u578b\u3001\u7a7a\u95f4\u667a\u80fd\u548c\u95ed\u73af\u63a2\u7d22\u5e94\u7528\u3002"}, {"abstract": "We present FlashRender, a few-step generative rendering framework that retakes a source video along a target camera trajectory in seconds. We identify sampling-step-dependent camera control as a prominent manifestation of discretization error in existing multi-step generative rendering models and show that resolving this inconsistency substantially lowers denoising trajectory curvature, facilitating subsequent step distillation. To this end, we introduce Representation Transformation and Alignment (RETA), which aligns hidden source-video representations with target-video features from a frozen visual geometry model. This directly encodes the geometric transformation within the source-video stream, enabling sampling-step-consistent camera control. We then fine-tune the model with the MeanFlow objective on the lower-curvature denoising trajectory induced by RETA, allowing the model to more effectively address discretization error. Finally, we apply on-policy flow map distillation to correct self-rollout errors under fixed few-step sampling. Extensive experiments show that RETA, MeanFlow, and on-policy flow map distillation play complementary roles in few-step generative rendering. Together, they enable our approach to match multi-step baselines in video quality and geometric consistency at 25x lower sampling cost while achieving superior camera controllability, even under out-of-distribution target camera trajectories.", "arxiv_id": "2609.03563", "arxiv_url": "https://arxiv.org/abs/2609.03563", "authors": ["Byeongjun Park", "Byung-Hoon Kim", "Hyungjin Chung"], "brief": "FlashRender \u662f\u4e00\u4e2a\u5c11\u6b65\u751f\u6210\u5f0f\u6e32\u67d3\u6846\u67b6\uff0c\u53ef\u5c06\u6e90\u89c6\u9891\u6309\u76ee\u6807\u76f8\u673a\u8f68\u8ff9\u5feb\u901f\u91cd\u62cd\u3002\u8bba\u6587\u901a\u8fc7\u51e0\u4f55\u8868\u793a\u5bf9\u9f50\u3001MeanFlow \u5fae\u8c03\u4e0e\u5728\u7ebf\u6d41\u56fe\u84b8\u998f\uff0c\u663e\u8457\u964d\u4f4e\u91c7\u6837\u6210\u672c\u5e76\u4fdd\u6301\u89c6\u9891\u8d28\u91cf\u548c\u51e0\u4f55\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03563", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa RETA\uff08Representation Transformation and Alignment\uff09\uff0c\u5c06\u6e90\u89c6\u9891\u9690\u85cf\u8868\u793a\u4e0e\u51bb\u7ed3\u89c6\u89c9\u51e0\u4f55\u6a21\u578b\u7684\u76ee\u6807\u89c6\u9891\u7279\u5f81\u5bf9\u9f50\uff0c\u76f4\u63a5\u7f16\u7801\u76f8\u673a\u51e0\u4f55\u53d8\u6362\u3002", "\u6307\u51fa\u591a\u6b65\u751f\u6210\u5f0f\u6e32\u67d3\u4e2d\u7684\u76f8\u673a\u63a7\u5236\u4f1a\u968f\u91c7\u6837\u6b65\u6570\u53d8\u5316\uff0c\u662f\u79bb\u6563\u5316\u8bef\u5dee\u7684\u91cd\u8981\u8868\u73b0\uff1bRETA \u53ef\u964d\u4f4e\u53bb\u566a\u8f68\u8ff9\u66f2\u7387\uff0c\u5229\u4e8e\u5c11\u6b65\u84b8\u998f\u3002", "\u7ed3\u5408 MeanFlow \u76ee\u6807\u548c on-policy flow map distillation\uff0c\u5728\u56fa\u5b9a\u5c11\u6b65\u91c7\u6837\u4e0b\u4fee\u6b63\u81ea\u56de\u6eda\u8bef\u5dee\uff0c\u5b9e\u73b0\u76f8\u6bd4\u591a\u6b65\u57fa\u7ebf\u7ea6 25 \u500d\u66f4\u4f4e\u91c7\u6837\u6210\u672c\u3002"], "keywords": ["\u751f\u6210\u5f0f\u6e32\u67d3", "\u89c6\u9891\u751f\u6210", "\u76f8\u673a\u63a7\u5236", "\u84b8\u998f"], "num_comments": 1, "on_hf": true, "organization": "EverEx", "pdf_url": "https://arxiv.org/pdf/2609.03563v1", "published_at": "2026-09-03", "score": 0.233, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.03563.png", "title": "FlashRender: Few-Step Generative Rendering via Camera-Controlled Video MeanFlow", "tldr": "\u7528\u5c11\u6b65\u91c7\u6837\u5feb\u901f\u91cd\u6e32\u67d3\u89c6\u9891\u89c6\u89d2", "upvotes": 2, "what_it_is": "FlashRender \u662f\u4e00\u4e2a\u5c11\u6b65\u751f\u6210\u5f0f\u6e32\u67d3\u6846\u67b6\uff0c\u53ef\u5c06\u6e90\u89c6\u9891\u6309\u76ee\u6807\u76f8\u673a\u8f68\u8ff9\u5feb\u901f\u91cd\u62cd\u3002\u8bba\u6587\u901a\u8fc7\u51e0\u4f55\u8868\u793a\u5bf9\u9f50\u3001MeanFlow \u5fae\u8c03\u4e0e\u5728\u7ebf\u6d41\u56fe\u84b8\u998f\uff0c\u663e\u8457\u964d\u4f4e\u91c7\u6837\u6210\u672c\u5e76\u4fdd\u6301\u89c6\u9891\u8d28\u91cf\u548c\u51e0\u4f55\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u751f\u6210\u5f0f\u89c6\u9891\u91cd\u6e32\u67d3\u7684\u6548\u7387\u74f6\u9888\u548c\u76f8\u673a\u53ef\u63a7\u6027\u95ee\u9898\u63d0\u51fa\u7cfb\u7edf\u89e3\u6cd5\uff0c\u5728\u5927\u5e45\u51cf\u5c11\u91c7\u6837\u6b65\u6570\u7684\u540c\u65f6\u5339\u914d\u591a\u6b65\u65b9\u6cd5\u7684\u89c6\u9891\u8d28\u91cf\u4e0e\u51e0\u4f55\u4e00\u81f4\u6027\uff0c\u5e76\u5728\u5206\u5e03\u5916\u76f8\u673a\u8f68\u8ff9\u4e0a\u8868\u73b0\u51fa\u66f4\u5f3a\u63a7\u5236\u80fd\u529b\uff0c\u5177\u6709\u5b9e\u9645\u6e32\u67d3\u4e0e\u89c6\u9891\u7f16\u8f91\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Language Models (LLMs) owe much of their success to next-token prediction (NTP), but their autoregressive (AR) structure requires slow, sequential token generation. To overcome this bottleneck, we introduce diffusion-augmented LLMs, a new class of models that defines an AR model distribution while using diffusion to draw multiple tokens in parallel from that distribution. We decouple the parameters of these models into two sets: AR weights, trained using the standard NTP objective, and lightweight diffusion weights, trained to generate multiple tokens simultaneously. The diffusion weights are learned through a simple Diffusion Distillation phase that adds negligible overhead to existing LLM training pipelines. We also introduce $\u03a8$-Spec, a family of samplers that enables lossless acceleration and inference-time scaling at a fixed context length. Unlike speculative decoding, our method requires no separate draft model. Unlike diffusion LLMs (d-LLMs), it accelerates generation without sacrificing the quality of the underlying AR model. The resulting models, called Uno, can be trained from scratch or built by augmenting existing open-weight AR LLMs. Uno achieves higher throughput than leading speculative-decoding methods at every evaluated batch size and delivers up to $3\\times$ speedups over the base AR model, including at the largest batch size supported by the device. Notably, our 8B Uno model outperforms the leading open d-LLM, the 26B DiffusionGemma, and the proprietary Mercury 2 across all evaluated benchmarks in agentic tool use, coding, and long-context reasoning. We release code and checkpoints at: https://s-sahoo.github.io/uno/", "arxiv_id": "2609.04010", "arxiv_url": "https://arxiv.org/abs/2609.04010", "authors": ["Subham Sekhar Sahoo", "Lingjie Chen", "Khiem Pham", "Jonathan Geuter", "Chaitanya Dwivedi", "Varad Pimpalkhute", "Yash Akhauri", "Alexander Moreno", "Mikhail Yurochkin", "Zhenting Wang", "Mostafa Elhoushi", "Nolan Dey", "Shane Bergsma", "Joel Hestness", "John Thickstun", "Eric Xing", "Zhengzhong Liu"], "brief": "\u8bba\u6587\u63d0\u51fa diffusion-augmented LLM\uff0c\u901a\u8fc7\u5728\u4fdd\u6301\u81ea\u56de\u5f52\u6a21\u578b\u5206\u5e03\u7684\u540c\u65f6\uff0c\u7528\u8f7b\u91cf\u79bb\u6563\u6269\u6563\u6a21\u5757\u5e76\u884c\u751f\u6210\u591a\u4e2a token\uff0c\u5b9e\u73b0\u65e0\u635f\u52a0\u901f\u3002\u5176 Uno \u6a21\u578b\u65e0\u9700\u72ec\u7acb\u8349\u7a3f\u6a21\u578b\uff0c\u5728\u4e0d\u540c batch \u4e0b\u5747\u8d85\u8fc7\u4e3b\u6d41 speculative decoding\uff0c\u6700\u9ad8\u76f8\u5bf9\u57fa\u7840\u81ea\u56de\u5f52\u6a21\u578b\u63d0\u901f 3 \u500d\uff0c\u5e76\u5728\u5de5\u5177\u4f7f\u7528\u3001\u4ee3\u7801\u548c\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u57fa\u51c6\u4e0a\u8868\u73b0\u5f3a\u52b2\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04010", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6269\u6563\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u81ea\u56de\u5f52\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04010v1", "published_at": "2026-09-03", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Unlocking Lossless Speedups in LLMs via Discrete Diffusion", "tldr": "\u8bba\u6587\u63d0\u51fa diffusion-augmented LLM\uff0c\u901a\u8fc7\u5728\u4fdd\u6301\u81ea\u56de\u5f52\u6a21\u578b\u5206\u5e03\u7684\u540c\u65f6\uff0c\u7528\u8f7b\u91cf\u79bb\u6563\u6269\u6563\u6a21\u5757\u5e76\u884c\u751f\u6210\u591a\u4e2a token\uff0c\u5b9e\u73b0\u65e0\u635f\u52a0\u901f\u3002\u5176 Uno \u6a21\u578b\u65e0\u9700\u72ec\u7acb\u8349\u7a3f\u6a21\u578b\uff0c\u5728\u4e0d\u540c batch \u4e0b\u5747\u8d85\u8fc7\u4e3b\u6d41 speculative decoding\uff0c\u6700\u9ad8\u76f8\u5bf9\u57fa\u7840\u81ea\u56de\u5f52\u6a21\u578b\u63d0\u901f 3 \u500d\uff0c\u5e76\u5728\u5de5\u5177\u4f7f\u7528\u3001\u4ee3\u7801\u548c\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u57fa\u51c6\u4e0a\u8868\u73b0\u5f3a\u52b2\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) trained only on text and code can sometimes generate programs that draw recognizable images. However, it is unclear whether this reflects an internal representation of 2D spatial layout or simply the ability to translate spatial descriptions into code. We introduce Autoregressive Mosaics (AM-Bench), a benchmark that separates these factors: First, a translation task gives a model a fully specified geometry of a picture in words as a prompt and asks for the code that produces it. Second, a layout task requires the model to compose an image from an underspecified prompt. Across eight open-weight text-and-code-only models, all models reliably translate specified geometry into code, but their open-ended layout performance differs substantially, indicating that these differences are not explained by code-generation ability alone. An output-medium ablation further shows that the interface or medium of expression that the model uses matters: replacing procedural code with raw SVG improves layout scores across all models. Finally, probing model activations shows that a coarse layout plan is present before generation, but reflects only the layout implied by the prompt. During generation, models track the evolving geometric state instead of executing an initially fixed plan. Overall, these results show that 2D spatial performance in text-only LLMs depends on both the model and the output medium, and is not explained by code-generation ability alone.", "arxiv_id": "2608.30751", "arxiv_url": "https://arxiv.org/abs/2608.30751", "authors": ["Ashwin Nedungadi", "Stefan Oehmcke", "Stefan L\u00fcdtke"], "brief": "\u8bba\u6587\u63d0\u51fa Autoregressive Mosaics\uff08AM-Bench\uff09\uff0c\u5c06\u201c\u6309\u660e\u786e\u51e0\u4f55\u63cf\u8ff0\u751f\u6210\u4ee3\u7801\u201d\u548c\u201c\u6839\u636e\u6b20\u6307\u5b9a\u63d0\u793a\u81ea\u4e3b\u5e03\u5c40\u201d\u5206\u79bb\u8bc4\u6d4b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u7eaf\u6587\u672c\u4e0e\u4ee3\u7801\u8bad\u7ec3\u7684\u5f00\u6e90\u6a21\u578b\u867d\u80fd\u628a\u51e0\u4f55\u63cf\u8ff0\u7ffb\u8bd1\u6210\u4ee3\u7801\uff0c\u4f46\u5f00\u653e\u5f0f\u4e8c\u7ef4\u5e03\u5c40\u80fd\u529b\u5dee\u5f02\u663e\u8457\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30751", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["AM-Bench \u5305\u542b translation task \u4e0e layout task\uff0c\u7528\u4e8e\u533a\u5206\u4ee3\u7801\u751f\u6210\u80fd\u529b\u548c\u771f\u5b9e\u4e8c\u7ef4\u7a7a\u95f4\u5e03\u5c40\u80fd\u529b", "8\u4e2a\u5f00\u6e90\u6587\u672c/\u4ee3\u7801\u6a21\u578b\u90fd\u80fd\u8f83\u7a33\u5b9a\u5730\u7ffb\u8bd1\u660e\u786e\u51e0\u4f55\uff0c\u4f46\u5e03\u5c40\u4efb\u52a1\u8868\u73b0\u5dee\u5f02\u5927", "\u8f93\u51fa\u5a92\u4ecb\u5f71\u54cd\u663e\u8457\uff1a\u7528 raw SVG \u66ff\u4ee3\u8fc7\u7a0b\u5f0f\u4ee3\u7801\u53ef\u63d0\u5347\u6240\u6709\u6a21\u578b\u7684\u5e03\u5c40\u5f97\u5206", "\u6fc0\u6d3b\u63a2\u6d4b\u663e\u793a\u6a21\u578b\u751f\u6210\u524d\u4ec5\u6709\u7531\u63d0\u793a\u8bf1\u5bfc\u7684\u7c97\u7565\u5e03\u5c40\uff0c\u751f\u6210\u8fc7\u7a0b\u4e2d\u4f1a\u6301\u7eed\u8ddf\u8e2a\u51e0\u4f55\u72b6\u6001"], "keywords": ["\u7a7a\u95f4\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30751v2", "published_at": "2026-08-31", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30751.png", "title": "Autoregressive Mosaics: Probing 2D Spatial Reasoning in Text-Only Language Models", "tldr": "\u8bc4\u6d4b\u7eaf\u6587\u672cLLM\u7684\u4e8c\u7ef4\u7a7a\u95f4\u5e03\u5c40\u80fd\u529b", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Autoregressive Mosaics\uff08AM-Bench\uff09\uff0c\u5c06\u201c\u6309\u660e\u786e\u51e0\u4f55\u63cf\u8ff0\u751f\u6210\u4ee3\u7801\u201d\u548c\u201c\u6839\u636e\u6b20\u6307\u5b9a\u63d0\u793a\u81ea\u4e3b\u5e03\u5c40\u201d\u5206\u79bb\u8bc4\u6d4b\u3002\u7ed3\u679c\u663e\u793a\uff0c\u7eaf\u6587\u672c\u4e0e\u4ee3\u7801\u8bad\u7ec3\u7684\u5f00\u6e90\u6a21\u578b\u867d\u80fd\u628a\u51e0\u4f55\u63cf\u8ff0\u7ffb\u8bd1\u6210\u4ee3\u7801\uff0c\u4f46\u5f00\u653e\u5f0f\u4e8c\u7ef4\u5e03\u5c40\u80fd\u529b\u5dee\u5f02\u663e\u8457\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u6587\u672c-only LLM \u7684\u89c6\u89c9/\u7a7a\u95f4\u80fd\u529b\u5e76\u4e0d\u53ea\u662f\u4ee3\u7801\u751f\u6210\u526f\u4ea7\u7269\uff0c\u800c\u53d7\u6a21\u578b\u5185\u90e8\u8868\u5f81\u4e0e\u8f93\u51fa\u5f62\u5f0f\u5171\u540c\u5f71\u54cd\uff0c\u4e3a\u8bc4\u4f30\u548c\u6539\u8fdb LLM \u7684\u7a7a\u95f4\u63a8\u7406\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u57fa\u51c6\u3002"}, {"abstract": "Evaluating physical reasoning in video models is difficult because absolute motion measurements depend on frame rate, object scale, and camera calibration, all of which are often ambiguous or unavailable in generated video. We propose a different approach. When two objects in the same scene obey the same physical law, their motions must satisfy predictable relationships, and these relationships hold independent of calibration. We introduce Principia, a benchmark that evaluates Newtonian physics through relational consistency between paired objects. Principia spans eight phenomena - gravity, restitution, friction, rotational inertia, projectile motion, momentum, pendulum, and mass-spring oscillation - across translational, rotational, collisional, and oscillatory dynamics, using real-world scenes recorded under controlled protocols. We also introduce a calibration-independent consistency score that quantifies physical violation directly in image space. Across thousands of generations from six state-of-the-art video generators, no model exceeds 0.42 on Principia despite all scoring around 0.8 on VBench. Vision-language models are evaluated on their ability to detect relational physics violations, with the best model achieving only 67% accuracy and most performing near chance level.", "arxiv_id": "2609.04200", "arxiv_url": "https://arxiv.org/abs/2609.04200", "authors": ["Varun Varma Thozhiyoor", "Shivam Tripathi", "Venkatesh Babu Radhakrishnan", "Anand Bhattad"], "brief": "\u8bba\u6587\u63d0\u51fa Principia \u57fa\u51c6\uff0c\u901a\u8fc7\u540c\u4e00\u573a\u666f\u4e2d\u6210\u5bf9\u7269\u4f53\u7684\u5173\u7cfb\u4e00\u81f4\u6027\u6765\u8bc4\u4f30\u89c6\u9891\u6a21\u578b\u7684\u725b\u987f\u7269\u7406\u63a8\u7406\u80fd\u529b\u3002\u5b83\u8986\u76d6\u91cd\u529b\u3001\u6469\u64e6\u3001\u78b0\u649e\u3001\u6446\u52a8\u7b49\u516b\u7c7b\u73b0\u8c61\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u76f8\u673a\u6807\u5b9a\u7684\u56fe\u50cf\u7a7a\u95f4\u4e00\u81f4\u6027\u8bc4\u5206\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04200", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7528\u201c\u4e24\u4e2a\u7269\u4f53\u9075\u5faa\u540c\u4e00\u7269\u7406\u89c4\u5f8b\u65f6\u5e94\u6ee1\u8db3\u53ef\u9884\u6d4b\u5173\u7cfb\u201d\u66ff\u4ee3\u7edd\u5bf9\u901f\u5ea6\u3001\u5c3a\u5ea6\u3001\u5e27\u7387\u7b49\u96be\u4ee5\u786e\u5b9a\u7684\u6d4b\u91cf\u3002", "\u57fa\u51c6\u6db5\u76d6\u5e73\u79fb\u3001\u65cb\u8f6c\u3001\u78b0\u649e\u3001\u632f\u8361\u7b49\u52a8\u529b\u5b66\u7c7b\u522b\uff0c\u6570\u636e\u6765\u81ea\u53d7\u63a7\u534f\u8bae\u5f55\u5236\u7684\u771f\u5b9e\u573a\u666f\u3002", "\u516d\u4e2a\u5148\u8fdb\u89c6\u9891\u751f\u6210\u6a21\u578b\u5728 Principia \u4e0a\u6700\u9ad8\u4ec5 0.42\uff0c\u800c\u5728 VBench \u4e0a\u7ea6 0.8\uff0c\u663e\u793a\u73b0\u6709\u8bc4\u6d4b\u53ef\u80fd\u9ad8\u4f30\u7269\u7406\u80fd\u529b\uff1b\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u68c0\u6d4b\u7269\u7406\u8fdd\u89c4\u6700\u9ad8\u4e5f\u4ec5 67%\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7269\u7406\u63a8\u7406", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04200v1", "published_at": "2026-09-03", "score": 0.218, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04200.png", "title": "Principia: Relational Physics Tests for Video Models", "tldr": "\u7528\u76f8\u5bf9\u5173\u7cfb\u8bc4\u6d4b\u89c6\u9891\u6a21\u578b\u725b\u987f\u7269\u7406\u4e00\u81f4\u6027", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Principia \u57fa\u51c6\uff0c\u901a\u8fc7\u540c\u4e00\u573a\u666f\u4e2d\u6210\u5bf9\u7269\u4f53\u7684\u5173\u7cfb\u4e00\u81f4\u6027\u6765\u8bc4\u4f30\u89c6\u9891\u6a21\u578b\u7684\u725b\u987f\u7269\u7406\u63a8\u7406\u80fd\u529b\u3002\u5b83\u8986\u76d6\u91cd\u529b\u3001\u6469\u64e6\u3001\u78b0\u649e\u3001\u6446\u52a8\u7b49\u516b\u7c7b\u73b0\u8c61\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u76f8\u673a\u6807\u5b9a\u7684\u56fe\u50cf\u7a7a\u95f4\u4e00\u81f4\u6027\u8bc4\u5206\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u4e00\u79cd\u6821\u51c6\u65e0\u5173\u3001\u8d34\u8fd1\u771f\u5b9e\u7269\u7406\u89c4\u5f8b\u7684\u8bc4\u6d4b\u65b9\u5f0f\uff0c\u63ed\u793a\u5f53\u524d\u89c6\u9891\u751f\u6210\u6a21\u578b\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u5173\u7cfb\u7269\u7406\u63a8\u7406\u4e0a\u7684\u660e\u663e\u77ed\u677f\uff0c\u5bf9\u6539\u8fdb\u4e16\u754c\u6a21\u578b\u4e0e\u89c6\u9891\u751f\u6210\u8bc4\u6d4b\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "A language model\u0027s prediction of its next token develops across layers, and lens methods track this process by decoding intermediate hidden states into tokens. But a lens reading reflects both the hidden state and the readout (the unembedding matrix) used to decode it. Many lenses are fit on a corpus, and we show that two lenses differing only in their fitting corpus can report different tokens for the same hidden states. We call this dependence corpus conditionality. To examine readout structure independently of the fitting corpus, we introduce Sparse Readout Prism (SRP), which decomposes the readout using only its weights and expresses any token logit or logit difference as a sum of contributions from sparse readout features. This reveals readout features as a new unit of analysis for lens readings, exposing structure that token identities can obscure and enabling comparisons across tokens, contexts, layers, and lenses. Replacing the original readout with SRP\u0027s sparse approximation reconstructs 8.9-17.3 percentage points more of the tested logit differences than the strongest of six baselines built on geometric relations among readout rows. Ablating features shifts logit differences in proportion to their SRP contributions. Although token readings vary with the fitting corpus, the dominant readout feature remains stable. Because SRP uses no corpus in its construction, it provides a control independent of the fitting corpus for lens analyses.", "arxiv_id": "2609.01936", "arxiv_url": "https://arxiv.org/abs/2609.01936", "authors": ["Matteo He", "William F. Shen", "Xinchi Qiu", "Nicholas D. Lane"], "brief": "\u672c\u6587\u6307\u51fa\u5e38\u89c1 lens \u65b9\u6cd5\u7684\u4e2d\u95f4\u5c42 token \u89e3\u8bfb\u4f1a\u53d7\u62df\u5408\u8bed\u6599\u5f71\u54cd\uff0c\u79f0\u4e3a\u201c\u8bed\u6599\u6761\u4ef6\u6027\u201d\u3002\u4f5c\u8005\u63d0\u51fa Sparse Readout Prism\uff08SRP\uff09\uff0c\u4ec5\u57fa\u4e8e unembedding/readout \u6743\u91cd\u5206\u89e3\u51fa\u7a00\u758f\u8bfb\u51fa\u7279\u5f81\uff0c\u7528\u7279\u5f81\u8d21\u732e\u800c\u975e token \u8eab\u4efd\u89e3\u91ca\u4efb\u610f token logit \u6216 logit \u5dee\u5f02\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/hematteo/sparse-readout-prism", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.01936", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660e\u4e24\u4e2a\u4ec5\u62df\u5408\u8bed\u6599\u4e0d\u540c\u7684 lens \u53ef\u80fd\u5bf9\u540c\u4e00\u9690\u85cf\u72b6\u6001\u7ed9\u51fa\u4e0d\u540c token \u8bfb\u6570\uff0c\u63ed\u793a lens \u5206\u6790\u4e2d\u7684\u8bed\u6599\u4f9d\u8d56\u95ee\u9898\u3002", "SRP \u4e0d\u4f7f\u7528\u8bed\u6599\uff0c\u53ea\u5206\u89e3\u8bfb\u51fa\u77e9\u9635\u6743\u91cd\uff0c\u5c06 logit \u6216 logit difference \u8868\u793a\u4e3a\u7a00\u758f\u8bfb\u51fa\u7279\u5f81\u8d21\u732e\u4e4b\u548c\u3002", "\u7528 SRP \u7a00\u758f\u8fd1\u4f3c\u66ff\u6362\u539f\u8bfb\u51fa\u540e\uff0c\u6bd4\u516d\u4e2a\u57fa\u4e8e\u8bfb\u51fa\u884c\u51e0\u4f55\u5173\u7cfb\u7684\u6700\u5f3a\u57fa\u7ebf\u591a\u91cd\u6784 8.9-17.3 \u4e2a\u767e\u5206\u70b9\u7684 logit \u5dee\u5f02\uff1b\u7279\u5f81\u6d88\u878d\u5e26\u6765\u7684 logit \u53d8\u5316\u4e0e SRP \u8d21\u732e\u6210\u6bd4\u4f8b\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u8bed\u8a00\u6a21\u578b", "\u7a00\u758f\u8868\u793a", "\u673a\u5236\u89e3\u91ca"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01936v1", "published_at": "2026-09-01", "score": 0.217, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01936.png", "title": "Sparse Readout Prism: Explaining Logit-Lens Scores in Features Instead of Tokens", "tldr": "\u7528\u7a00\u758f\u8bfb\u51fa\u7279\u5f81\u89e3\u91calogit-lens\u7ed3\u679c", "upvotes": 2, "what_it_is": "\u672c\u6587\u6307\u51fa\u5e38\u89c1 lens \u65b9\u6cd5\u7684\u4e2d\u95f4\u5c42 token \u89e3\u8bfb\u4f1a\u53d7\u62df\u5408\u8bed\u6599\u5f71\u54cd\uff0c\u79f0\u4e3a\u201c\u8bed\u6599\u6761\u4ef6\u6027\u201d\u3002\u4f5c\u8005\u63d0\u51fa Sparse Readout Prism\uff08SRP\uff09\uff0c\u4ec5\u57fa\u4e8e unembedding/readout \u6743\u91cd\u5206\u89e3\u51fa\u7a00\u758f\u8bfb\u51fa\u7279\u5f81\uff0c\u7528\u7279\u5f81\u8d21\u732e\u800c\u975e token \u8eab\u4efd\u89e3\u91ca\u4efb\u610f token logit \u6216 logit \u5dee\u5f02\u3002", "why_notable": "\u8fd9\u4e3a mechanistic interpretability \u4e2d\u7684 logit-lens \u5206\u6790\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u63a7\u5236\u53d8\u91cf\u548c\u65b0\u7684\u5206\u6790\u5355\u5143\uff0c\u80fd\u533a\u5206\u9690\u85cf\u72b6\u6001\u53d8\u5316\u4e0e\u8bfb\u51fa\u77e9\u9635\u7ed3\u6784\u5f71\u54cd\uff0c\u5e76\u7f13\u89e3 token \u5c42\u9762\u89e3\u91ca\u88ab\u8bed\u6599\u62df\u5408\u5dee\u5f02\u6df7\u6dc6\u7684\u95ee\u9898\u3002"}, {"abstract": "While diffusion base models such as GPT-Image-2 and Nano-Banana exhibit remarkable visual expressiveness, their end-to-end generation inherently yields flattened bitmaps with error-prone text, precluding layer-wise post-editing. Conversely, code-based visual generation via Coding Agents provides precise layout control and decoupled layers, yet remains constrained by a lack of global aesthetic intuition and the difficulty of coding complex visual assets. To address this, we propose Editable Visual Design, a new paradigm driven by a Coding Agent. We designate the VLM as the ``creative brain\u0027\u0027 for requirement comprehension, task planning, and aesthetic judgment, while utilizing the image generation model as an on-demand ``visual world simulator\u0027\u0027 to synthesize standalone visual assets. Operating under an ``imagine first, then act\u0027\u0027 closed-loop workflow, the agent generates isolated assets, writes native HTML/CSS, and iteratively refines the design against visual rendering feedback. Furthermore, Agent Design Replay faithfully reproduces the creative and reasoning trajectory akin to that of professional human designers. Ultimately, the system delivers editable artifacts with decoupled layers and real text, enabling users to perform intuitive mouse dragging and layout adjustments on a graphical user interface. Validations on posters, infographics, and other scenarios show that this paradigm successfully achieves both refined aesthetics and production-grade editability.", "arxiv_id": "2609.04034", "arxiv_url": "https://arxiv.org/abs/2609.04034", "authors": ["Junyan Ye", "Wei Liu", "Dongzhi Jiang", "Zichen Wen", "HaoDong Li", "Zhutao Lv", "Jiaxin Lin", "Jinhua Yu", "Jun He", "Zilong Huang", "Rui Chen", "Weijia Li"], "brief": "\u8bba\u6587\u63d0\u51faEditable Visual Design\u65b0\u8303\u5f0f\uff1a\u7531Coding Agent\u9a71\u52a8\uff0c\u5c06VLM\u4f5c\u4e3a\u521b\u610f\u4e0e\u5ba1\u7f8e\u201c\u5927\u8111\u201d\uff0c\u8c03\u7528\u56fe\u50cf\u751f\u6210\u6a21\u578b\u5408\u6210\u72ec\u7acb\u89c6\u89c9\u7d20\u6750\uff0c\u5e76\u7528HTML/CSS\u4ea7\u51fa\u53ef\u7f16\u8f91\u8bbe\u8ba1\u7a3f\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.04034", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u91c7\u7528\u201c\u5148\u60f3\u8c61\u3001\u518d\u884c\u52a8\u201d\u7684\u95ed\u73af\u6d41\u7a0b\uff1a\u751f\u6210\u5b64\u7acb\u89c6\u89c9\u8d44\u4ea7\u3001\u7f16\u5199\u539f\u751fHTML/CSS\u3001\u6839\u636e\u6e32\u67d3\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u3002", "\u517c\u987e\u6269\u6563\u6a21\u578b\u7684\u89c6\u89c9\u8868\u73b0\u529b\u4e0e\u4ee3\u7801\u751f\u6210\u7684\u5c42\u7ea7\u53ef\u63a7\u6027\uff0c\u8f93\u51fa\u5305\u542b\u89e3\u8026\u56fe\u5c42\u548c\u771f\u5b9e\u6587\u672c\u7684\u53ef\u7f16\u8f91\u5236\u54c1\u3002", "\u63d0\u51faAgent Design Replay\uff0c\u590d\u73b0\u7c7b\u4f3c\u4e13\u4e1a\u8bbe\u8ba1\u5e08\u7684\u521b\u4f5c\u4e0e\u63a8\u7406\u8f68\u8ff9\uff1b\u5728\u6d77\u62a5\u3001\u4fe1\u606f\u56fe\u7b49\u573a\u666f\u9a8c\u8bc1\u4e86\u7f8e\u89c2\u6027\u4e0e\u751f\u4ea7\u7ea7\u53ef\u7f16\u8f91\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8bbe\u8ba1", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.04034v1", "published_at": "2026-09-03", "score": 0.205, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.04034.png", "title": "Editable Visual Design", "tldr": "\u7528Coding Agent\u751f\u6210\u53ef\u7f16\u8f91\u89c6\u89c9\u8bbe\u8ba1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faEditable Visual Design\u65b0\u8303\u5f0f\uff1a\u7531Coding Agent\u9a71\u52a8\uff0c\u5c06VLM\u4f5c\u4e3a\u521b\u610f\u4e0e\u5ba1\u7f8e\u201c\u5927\u8111\u201d\uff0c\u8c03\u7528\u56fe\u50cf\u751f\u6210\u6a21\u578b\u5408\u6210\u72ec\u7acb\u89c6\u89c9\u7d20\u6750\uff0c\u5e76\u7528HTML/CSS\u4ea7\u51fa\u53ef\u7f16\u8f91\u8bbe\u8ba1\u7a3f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u73b0\u6709\u56fe\u50cf\u751f\u6210\u201c\u6241\u5e73\u4f4d\u56fe\u4e0d\u53ef\u7f16\u8f91\u201d\u548c\u4ee3\u7801\u89c6\u89c9\u751f\u6210\u201c\u5ba1\u7f8e\u4e0e\u590d\u6742\u8d44\u4ea7\u4e0d\u8db3\u201d\u7684\u75db\u70b9\uff0c\u63a2\u7d22\u4e86\u9762\u5411\u8bbe\u8ba1\u751f\u4ea7\u7684\u591a\u6a21\u578b\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Rubric-based reinforcement learning extends RL beyond tasks with exact answers or rule-based verifiers by scoring responses against instance-specific criteria. However, this makes reward computation expensive: training requires repeated rubric judging, often with proprietary APIs or local generative LLM judges with 7B parameters or more. We study whether smaller language models can serve as efficient and reliable rubric-based judges. To make this question measurable, we construct PointRubric and RaR-Science-Static, two pointwise rubric-based evaluation datasets with instance-specific criteria and itemwise satisfaction labels. We compare three ways of extracting criterion-level judgments from small models: Generative verdicts, Yes/No Logprob margins, and Probe judges. Across both datasets, the Qwen3-1.7B Probe judge achieves the strongest criterion-level agreement among these methods, outperforming Generative and Logprob judges. Used as a GRPO reward model, it trains a policy from 0.232 to 0.643 on RaR-Science rubric score, compared with 0.594 for an 8B Generative judge baseline, while the baseline requires 10.7$\\times$ more reward-judge time. Task and domain transfer experiments further suggest that Probe judges preserve criterion-level reward structure across settings.", "arxiv_id": "2608.30005", "arxiv_url": "https://arxiv.org/abs/2608.30005", "authors": ["Fengyu Xie", "Yilun Zhao", "Bingsen Chen", "Arman Cohan", "Chen Zhao"], "brief": "\u8bba\u6587\u7814\u7a76\u5c0f\u8bed\u8a00\u6a21\u578b\u662f\u5426\u80fd\u4f5c\u4e3a\u57fa\u4e8e\u8bc4\u5206\u7ec6\u5219\u7684\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u88c1\u5224\u3002\u4f5c\u8005\u6784\u5efa PointRubric \u4e0e RaR-Science-Static \u4e24\u4e2a\u9010\u9879\u7ec6\u5219\u8bc4\u6d4b\u96c6\uff0c\u5e76\u6bd4\u8f83\u751f\u6210\u5f0f\u5224\u65ad\u3001Yes/No logprob \u8fb9\u9645\u548c Probe judge \u4e09\u79cd\u5c0f\u6a21\u578b\u88c1\u5224\u65b9\u6848\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30005", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["Qwen3-1.7B Probe judge \u5728\u4e24\u4e2a\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6700\u5f3a\u7684\u9010\u6807\u51c6\u4e00\u81f4\u6027\uff0c\u4f18\u4e8e\u751f\u6210\u5f0f\u88c1\u5224\u548c logprob \u88c1\u5224\u3002", "\u4f5c\u4e3a GRPO \u5956\u52b1\u6a21\u578b\u65f6\uff0c\u5c06 RaR-Science \u7ec6\u5219\u5206\u6570\u4ece 0.232 \u63d0\u5347\u5230 0.643\uff0c\u9ad8\u4e8e 8B \u751f\u6210\u5f0f\u88c1\u5224\u57fa\u7ebf\u7684 0.594\u3002", "\u76f8\u6bd4 8B \u751f\u6210\u5f0f\u88c1\u5224\uff0c1.7B Probe judge \u7684\u5956\u52b1\u8bc4\u4f30\u8017\u65f6\u964d\u4f4e\u7ea6 10.7 \u500d\uff0c\u5e76\u5728\u4efb\u52a1\u4e0e\u9886\u57df\u8fc1\u79fb\u4e2d\u4fdd\u7559\u8f83\u597d\u7684\u5956\u52b1\u7ed3\u6784\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u6a21\u578b", "\u5c0f\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30005v1", "published_at": "2026-08-30", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.30005.png", "title": "Small Language Models as Judges for Rubric-Based Reinforcement Learning", "tldr": "\u5c0f\u6a21\u578b\u53ef\u9ad8\u6548\u5145\u5f53\u7ec6\u5219\u8bc4\u5206RL\u88c1\u5224", "upvotes": 1, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5c0f\u8bed\u8a00\u6a21\u578b\u662f\u5426\u80fd\u4f5c\u4e3a\u57fa\u4e8e\u8bc4\u5206\u7ec6\u5219\u7684\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u88c1\u5224\u3002\u4f5c\u8005\u6784\u5efa PointRubric \u4e0e RaR-Science-Static \u4e24\u4e2a\u9010\u9879\u7ec6\u5219\u8bc4\u6d4b\u96c6\uff0c\u5e76\u6bd4\u8f83\u751f\u6210\u5f0f\u5224\u65ad\u3001Yes/No logprob \u8fb9\u9645\u548c Probe judge \u4e09\u79cd\u5c0f\u6a21\u578b\u88c1\u5224\u65b9\u6848\u3002", "why_notable": "\u5b83\u8868\u660e\u57fa\u4e8e\u7ec6\u5219\u7684 RL \u4e0d\u4e00\u5b9a\u4f9d\u8d56\u6602\u8d35\u7684\u5927\u6a21\u578b\u6216\u95ed\u6e90 API \u88c1\u5224\uff0c\u5c0f\u6a21\u578b\u63a2\u9488\u5373\u53ef\u63d0\u4f9b\u9ad8\u6548\u4e14\u53ef\u9760\u7684\u7ec6\u7c92\u5ea6\u5956\u52b1\u4fe1\u53f7\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u590d\u6742\u5f00\u653e\u5f0f\u4efb\u52a1 RL \u8bad\u7ec3\u6210\u672c\u3002"}, {"abstract": "Developing humanoid robots capable of leveraging human behavioral data is essential for general-purpose embodiment, yet conventional development remains bottlenecked by a decoupled paradigm that isolates hardware design from whole-body control. This approach leads to suboptimal systems that compromise human-like fluidity and agility. To bridge this gap, we introduce a data-driven morphology-control co-design framework that optimizes humanoid morphology for human-like movement. To quantify morphological fidelity, we also introduce a novel metric that jointly considers kinematic retargeting fidelity to human motion and dynamic tracking performance. Our framework achieves state-of-the-art (SOTA) performance across all metrics compared to baseline humanoids (Bumi, K1, and Toddlerbot). Finally, we realize this design in Bridge, an open-source, 88cm-tall humanoid platform released alongside its control policy. We demonstrate that Bridge captures human motion data with superior fidelity, exhibiting exceptional performance across foundational locomotion, robust balance, and highly dynamic maneuvers. Videos and open-source materials: https://sites.google.com/view/bridgerobot.", "arxiv_id": "2609.03497", "arxiv_url": "https://arxiv.org/abs/2609.03497", "authors": ["Jianren Wang", "Letian Qian", "Zikai Wang", "Weiwei Wu", "Junjie Zong", "Abhinav Gupta", "Deepak Pathak"], "brief": "\u8bba\u6587\u63d0\u51fa\u6570\u636e\u9a71\u52a8\u7684\u5f62\u6001-\u63a7\u5236\u534f\u540c\u8bbe\u8ba1\u6846\u67b6\uff0c\u7528\u4eba\u7c7b\u8fd0\u52a8\u6570\u636e\u4f18\u5316\u4eba\u5f62\u673a\u5668\u4eba\u5f62\u6001\u4e0e\u5168\u8eab\u63a7\u5236\u3002\u4f5c\u8005\u5c06\u8be5\u8bbe\u8ba1\u843d\u5730\u4e3a88\u5398\u7c73\u9ad8\u7684\u5f00\u6e90\u4eba\u5f62\u5e73\u53f0Bridge\uff0c\u5e76\u53d1\u5e03\u63a7\u5236\u7b56\u7565\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03497", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u5f62\u6001\u4fdd\u771f\u5ea6\u6307\u6807\uff0c\u540c\u65f6\u8861\u91cf\u5bf9\u4eba\u7c7b\u52a8\u4f5c\u7684\u8fd0\u52a8\u5b66\u91cd\u5b9a\u5411\u7cbe\u5ea6\u548c\u52a8\u6001\u8ddf\u8e2a\u6027\u80fd\u3002", "\u5728\u4e0eBumi\u3001K1\u3001Toddlerbot\u7b49\u57fa\u7ebf\u4eba\u5f62\u673a\u5668\u4eba\u5bf9\u6bd4\u4e2d\uff0c\u5404\u9879\u6307\u6807\u8fbe\u5230SOTA\u8868\u73b0\u3002", "Bridge\u5728\u57fa\u7840\u884c\u8d70\u3001\u9c81\u68d2\u5e73\u8861\u548c\u9ad8\u52a8\u6001\u52a8\u4f5c\u4e2d\u5c55\u73b0\u66f4\u9ad8\u7684\u4eba\u7c7b\u8fd0\u52a8\u6355\u6349\u4e0e\u6267\u884c\u4fdd\u771f\u5ea6\u3002"], "keywords": ["\u4eba\u5f62\u673a\u5668\u4eba", "\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba\u63a7\u5236", "\u5f00\u6e90\u5e73\u53f0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03497v1", "published_at": "2026-09-03", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "BRIDGE: An Open-Source Humanoid Platform via Morphology-Control Co-Design for Physical AI", "tldr": "\u5f00\u6e90\u4eba\u5f62\u673a\u5668\u4ebaBridge\u5b9e\u73b0\u5f62\u63a7\u534f\u540c\u8bbe\u8ba1\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u6570\u636e\u9a71\u52a8\u7684\u5f62\u6001-\u63a7\u5236\u534f\u540c\u8bbe\u8ba1\u6846\u67b6\uff0c\u7528\u4eba\u7c7b\u8fd0\u52a8\u6570\u636e\u4f18\u5316\u4eba\u5f62\u673a\u5668\u4eba\u5f62\u6001\u4e0e\u5168\u8eab\u63a7\u5236\u3002\u4f5c\u8005\u5c06\u8be5\u8bbe\u8ba1\u843d\u5730\u4e3a88\u5398\u7c73\u9ad8\u7684\u5f00\u6e90\u4eba\u5f62\u5e73\u53f0Bridge\uff0c\u5e76\u53d1\u5e03\u63a7\u5236\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u786c\u4ef6\u5f62\u6001\u8bbe\u8ba1\u4e0e\u5168\u8eab\u63a7\u5236\u8054\u5408\u4f18\u5316\uff0c\u7f13\u89e3\u4f20\u7edf\u4eba\u5f62\u673a\u5668\u4eba\u8f6f\u786c\u4ef6\u5272\u88c2\u5bfc\u81f4\u7684\u52a8\u4f5c\u4e0d\u81ea\u7136\u95ee\u9898\uff1b\u540c\u65f6\u5f00\u6e90\u786c\u4ef6\u5e73\u53f0\u548c\u63a7\u5236\u7b56\u7565\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u7269\u7406AI\u4e0e\u901a\u7528\u5177\u8eab\u667a\u80fd\u7814\u7a76\u590d\u73b0\u548c\u8fed\u4ee3\u3002"}, {"abstract": "Long-output reasoning has made the key--value (KV) cache a critical memory bottleneck for efficient LLM serving. Existing KV compression methods usually rely on a predefined per-request budget and adjust only which KV states are retained, leaving the total capacity fixed throughout decoding. However, reasoning workloads exhibit substantial demand variation: different requests require different KV capacities, and the attention demand of an individual request evolves during generation. We introduce \\textbf{GrowPage}, an on-demand KV budgeting framework that treats KV capacity as a runtime resource. GrowPage maintains lightweight dual-timescale query summaries to capture recent and long-term attention behaviors, and uses their relative attention working sets to estimate demand evolution. At each capacity boundary, GrowPage either compresses KV states within the current allocation or acquires an additional physical page when broader demand emerges. By integrating with PagedAttention\u0027s page-level memory abstraction, GrowPage preserves continuous batching and prefix caching. Experiments on reasoning benchmarks across multiple models show that GrowPage achieves a superior performance--throughput trade-off over existing approaches.", "arxiv_id": "2609.03494", "arxiv_url": "https://arxiv.org/abs/2609.03494", "authors": ["Qiankun Ma", "Yanjiang Zhou", "Zinan Xiong", "Haofei Wang", "Zhen Song", "Yang Xiang", "Ziyao Zhang", "Hairong Zheng"], "brief": "\u8bba\u6587\u63d0\u51fa GrowPage\uff0c\u5c06 KV cache \u5bb9\u91cf\u89c6\u4e3a\u8fd0\u884c\u65f6\u53ef\u52a8\u6001\u5206\u914d\u7684\u8d44\u6e90\uff0c\u800c\u975e\u9884\u8bbe\u56fa\u5b9a\u9884\u7b97\u3002\u5b83\u6839\u636e\u8bf7\u6c42\u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u6ce8\u610f\u529b\u9700\u6c42\u53d8\u5316\uff0c\u51b3\u5b9a\u7ee7\u7eed\u538b\u7f29\u73b0\u6709 KV \u8fd8\u662f\u7533\u8bf7\u989d\u5916\u7269\u7406\u9875\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03494", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528\u8f7b\u91cf\u7ea7\u53cc\u65f6\u95f4\u5c3a\u5ea6\u67e5\u8be2\u6458\u8981\uff0c\u540c\u65f6\u6355\u6349\u8fd1\u671f\u4e0e\u957f\u671f\u6ce8\u610f\u529b\u884c\u4e3a", "\u901a\u8fc7\u76f8\u5bf9\u6ce8\u610f\u529b\u5de5\u4f5c\u96c6\u4f30\u8ba1\u6bcf\u4e2a\u8bf7\u6c42\u7684 KV \u9700\u6c42\u6f14\u5316", "\u4e0e PagedAttention \u7684\u9875\u7ea7\u5185\u5b58\u62bd\u8c61\u96c6\u6210\uff0c\u4fdd\u7559\u8fde\u7eed\u6279\u5904\u7406\u548c\u524d\u7f00\u7f13\u5b58\u80fd\u529b"], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "KV\u7f13\u5b58", "\u6a21\u578b\u670d\u52a1", "\u5185\u5b58\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03494v1", "published_at": "2026-09-03", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GrowPage: On-Demand KV Budgeting for Efficient LLM Reasoning Serving", "tldr": "\u6309\u9700\u6269\u5c55KV\u9884\u7b97\u63d0\u5347\u957f\u63a8\u7406\u670d\u52a1\u6548\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GrowPage\uff0c\u5c06 KV cache \u5bb9\u91cf\u89c6\u4e3a\u8fd0\u884c\u65f6\u53ef\u52a8\u6001\u5206\u914d\u7684\u8d44\u6e90\uff0c\u800c\u975e\u9884\u8bbe\u56fa\u5b9a\u9884\u7b97\u3002\u5b83\u6839\u636e\u8bf7\u6c42\u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u7684\u6ce8\u610f\u529b\u9700\u6c42\u53d8\u5316\uff0c\u51b3\u5b9a\u7ee7\u7eed\u538b\u7f29\u73b0\u6709 KV \u8fd8\u662f\u7533\u8bf7\u989d\u5916\u7269\u7406\u9875\u3002", "why_notable": "\u957f\u8f93\u51fa\u63a8\u7406\u4f7f KV cache \u6210\u4e3a LLM \u670d\u52a1\u7684\u6838\u5fc3\u74f6\u9888\uff0cGrowPage \u4ece\u201c\u56fa\u5b9a\u9884\u7b97\u538b\u7f29\u201d\u8f6c\u5411\u201c\u6309\u9700\u5bb9\u91cf\u7ba1\u7406\u201d\uff0c\u5728\u591a\u4e2a\u6a21\u578b\u548c\u63a8\u7406\u57fa\u51c6\u4e0a\u5b9e\u73b0\u66f4\u4f18\u7684\u6027\u80fd\u4e0e\u541e\u5410\u6298\u4e2d\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Portfolio risk assessment ordinarily relies on reliable estimates of cross-asset return covariances, which are difficult to obtain in short, high-dimensional panels. We show that firm-level distribution-valued characteristics can instead provide one-sided certificates of portfolio risk. Under maintained links from characteristics to systematic exposures and from exposures to returns, multi-firm Wasserstein-2 dispersion yields a sharp upper bound on systematic portfolio variance and a corresponding bound for standardized returns. A weighted pairwise relaxation produces an objective that is convex under a checkable condition and requires marginal volatility scales but no cross-asset return covariances. With zero firm-specific slack, the common-map scale changes the certified variance reduction but not the normalized allocation, which depends only on observed information geometry. In a 52-firm panel from 2018-2022, an allocation constructed from Qwen3-Embedding-8B news representations lies between the 0.69th and 1.33rd in-sample variance percentiles across four prespecified capped portfolio populations; equal risk weighting lies between the 21.1st and 28.6th percentiles. The lower in-sample variance ranking relative to equal risk also appears across the reported frozen language-model representations. The framework therefore distribution-valued firm information into a coherent risk bound and an implementable allocation rule constructed without cross-asset return covariances.", "arxiv_id": "2608.29692", "arxiv_url": "https://arxiv.org/abs/2608.29692", "authors": ["Marcus Gawronsky", "Chun-Sung Huang"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u8de8\u8d44\u4ea7\u6536\u76ca\u534f\u65b9\u5dee\u7684\u6295\u8d44\u7ec4\u5408\u98ce\u9669\u8bc4\u4f30\u4e0e\u914d\u7f6e\u6846\u67b6\u3002\u5b83\u5c06\u516c\u53f8\u5c42\u9762\u7684\u8bed\u8a00\u6a21\u578b\u65b0\u95fb\u8868\u5f81\u89c6\u4e3a\u5206\u5e03\u503c\u7279\u5f81\uff0c\u901a\u8fc7 Wasserstein-2 \u79bb\u6563\u5ea6\u4e3a\u7cfb\u7edf\u6027\u7ec4\u5408\u65b9\u5dee\u63d0\u4f9b\u5355\u4fa7\u4e0a\u754c\uff0c\u5e76\u636e\u6b64\u751f\u6210\u53ef\u5b9e\u65bd\u7684\u8d44\u4ea7\u914d\u7f6e\u3002", "categories": ["q-fin.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29692", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728\u7279\u5f81\u5230\u7cfb\u7edf\u6027\u66b4\u9732\u3001\u66b4\u9732\u5230\u6536\u76ca\u7684\u5047\u8bbe\u8054\u7cfb\u4e0b\uff0c\u591a\u516c\u53f8 Wasserstein-2 \u79bb\u6563\u5ea6\u53ef\u7ed9\u51fa\u7cfb\u7edf\u6027\u7ec4\u5408\u65b9\u5dee\u7684\u5c16\u9510\u4e0a\u754c\u3002", "\u63d0\u51fa\u52a0\u6743\u6210\u5bf9\u677e\u5f1b\u76ee\u6807\uff0c\u5728\u53ef\u68c0\u9a8c\u6761\u4ef6\u4e0b\u5177\u6709\u51f8\u6027\uff0c\u53ea\u9700\u8fb9\u9645\u6ce2\u52a8\u7387\u5c3a\u5ea6\uff0c\u4e0d\u9700\u8981\u8de8\u8d44\u4ea7\u6536\u76ca\u534f\u65b9\u5dee\u77e9\u9635\u3002", "\u57282018-2022\u5e7452\u5bb6\u516c\u53f8\u6837\u672c\u4e2d\uff0c\u57fa\u4e8e Qwen3-Embedding-8B \u65b0\u95fb\u8868\u5f81\u7684\u914d\u7f6e\u5728\u591a\u4e2a\u9884\u8bbe\u53d7\u9650\u7ec4\u5408\u7fa4\u4f53\u4e2d\u5904\u4e8e0.69\u81f31.33\u5206\u4f4d\u7684\u4f4e\u65b9\u5dee\u6c34\u5e73\uff0c\u4f18\u4e8e\u7b49\u98ce\u9669\u6743\u91cd\u768421.1\u81f328.6\u5206\u4f4d\u3002"], "keywords": ["\u91cf\u5316\u91d1\u878d", "\u8bed\u8a00\u6a21\u578b", "\u6295\u8d44\u7ec4\u5408\u4f18\u5316", "\u98ce\u9669\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "University of Cape Town", "pdf_url": "https://arxiv.org/pdf/2608.29692v1", "published_at": "2026-08-30", "score": 0.175, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.29692.png", "title": "Portfolio Risk Bounds without Cross-Asset Return Covariances: Distributional Fields from Language-Model Representations", "tldr": "\u7528\u8bed\u8a00\u6a21\u578b\u8868\u5f81\u6784\u9020\u65e0\u534f\u65b9\u5dee\u6295\u8d44\u7ec4\u5408\u98ce\u9669\u754c\u3002", "upvotes": 1, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u4e0d\u4f9d\u8d56\u8de8\u8d44\u4ea7\u6536\u76ca\u534f\u65b9\u5dee\u7684\u6295\u8d44\u7ec4\u5408\u98ce\u9669\u8bc4\u4f30\u4e0e\u914d\u7f6e\u6846\u67b6\u3002\u5b83\u5c06\u516c\u53f8\u5c42\u9762\u7684\u8bed\u8a00\u6a21\u578b\u65b0\u95fb\u8868\u5f81\u89c6\u4e3a\u5206\u5e03\u503c\u7279\u5f81\uff0c\u901a\u8fc7 Wasserstein-2 \u79bb\u6563\u5ea6\u4e3a\u7cfb\u7edf\u6027\u7ec4\u5408\u65b9\u5dee\u63d0\u4f9b\u5355\u4fa7\u4e0a\u754c\uff0c\u5e76\u636e\u6b64\u751f\u6210\u53ef\u5b9e\u65bd\u7684\u8d44\u4ea7\u914d\u7f6e\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e3a\u9ad8\u7ef4\u3001\u77ed\u6837\u672c\u4e0b\u534f\u65b9\u5dee\u4f30\u8ba1\u4e0d\u53ef\u9760\u7684\u95ee\u9898\u63d0\u4f9b\u66ff\u4ee3\u8def\u5f84\uff0c\u628a\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4ea7\u751f\u7684\u516c\u53f8\u4fe1\u606f\u51e0\u4f55\u8f6c\u5316\u4e3a\u53ef\u8bc1\u660e\u7684\u98ce\u9669\u4e0a\u754c\u548c\u6295\u8d44\u7ec4\u5408\u89c4\u5219\uff0c\u5c55\u793a\u4e86\u6587\u672c\u8868\u5f81\u5728\u91cf\u5316\u98ce\u9669\u7ba1\u7406\u4e2d\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Chain-of-thought (CoT) reasoning improves large reasoning models (LRMs) on complex tasks but often produces long, redundant traces. Recent training-free early-exit methods shorten these traces by choosing an intermediate point to stop reasoning. We study one such strategy that injects an end-of-think token (EoT, \u003c/think\u003e) at this point to trigger the reasoning-to-answering transition, and find that the injected EoT does not always induce a clean answering phase. Answering-phase generation can continue before the model regenerates another EoT, with the span preceding this regenerated EoT scaling with the reasoning tokens saved by early exit and exhibiting continued reasoning behavior. We call this spurious CoT termination, where reasoning-like generation continues into the answering phase. We hypothesize that insufficient attention to the injected EoT contributes to spurious CoT termination and probe this hypothesis with Exit-token Attention Biasing (EAB). Across four LRMs, five benchmarks, and two early-exit methods, increasing attention to the injected EoT reduces spurious CoT termination and answering-phase length. These results reveal a limitation of controlling LRMs by externally matching their explicit think-block format. Inserting the EoT token conforms to this format but does not by itself guarantee the intended reasoning-to-answering transition. Our code is available at https://github.com/Seunghee-Koh/Spurious-CoT-Termination.", "arxiv_id": "2609.03633", "arxiv_url": "https://arxiv.org/abs/2609.03633", "authors": ["Seunghee Koh", "Sungjae Choi", "Minchan Kwon", "Sunghyun Baek", "Junmo Kim"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u5927\u63a8\u7406\u6a21\u578b\u4e2d\u901a\u8fc7\u5916\u90e8\u63d2\u5165 end-of-think token\uff08\u003c/think\u003e\uff09\u8fdb\u884c\u65e9\u505c\u7684\u7b56\u7565\uff0c\u53d1\u73b0\u6a21\u578b\u5e38\u4f1a\u5728\u56de\u7b54\u9636\u6bb5\u7ee7\u7eed\u751f\u6210\u7c7b\u4f3c CoT \u7684\u63a8\u7406\u5185\u5bb9\uff0c\u5f62\u6210\u201c\u4f2a CoT \u7ec8\u6b62\u201d\u3002\u4f5c\u8005\u63d0\u51fa\u7528 Exit-token Attention Biasing \u589e\u5f3a\u6a21\u578b\u5bf9\u63d2\u5165 EoT \u7684\u6ce8\u610f\u529b\uff0c\u4ee5\u7f13\u89e3\u8be5\u73b0\u8c61\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03633", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57284\u4e2a\u5927\u63a8\u7406\u6a21\u578b\u30015\u4e2a\u57fa\u51c6\u548c2\u79cd\u65e9\u505c\u65b9\u6cd5\u4e0a\uff0c\u89c2\u5bdf\u5230\u63d2\u5165\u003c/think\u003e\u540e\u56de\u7b54\u9636\u6bb5\u4ecd\u4f1a\u7ee7\u7eed\u63a8\u7406\uff0c\u5e76\u53ef\u80fd\u518d\u6b21\u751f\u6210EoT", "\u4f2a\u7ec8\u6b62\u7247\u6bb5\u957f\u5ea6\u4e0e\u65e9\u505c\u8282\u7701\u7684\u63a8\u7406 token \u6570\u76f8\u5173\uff0c\u8bf4\u660e\u88ab\u622a\u65ad\u7684\u63a8\u7406\u53ef\u80fd\u8fc1\u79fb\u5230\u4e86\u56de\u7b54\u9636\u6bb5", "\u63d0\u9ad8\u6a21\u578b\u5bf9\u63d2\u5165EoT\u7684\u6ce8\u610f\u529b\u53ef\u51cf\u5c11\u4f2aCoT\u7ec8\u6b62\u5e76\u7f29\u77ed\u56de\u7b54\u9636\u6bb5\u957f\u5ea6"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u94fe\u5f0f\u601d\u7ef4", "\u63a8\u7406\u63a7\u5236", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03633v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "\u003c/think\u003e Doesn\u0027t Stop Reasoning: Analysis of Spurious CoT Termination", "tldr": "\u63d2\u5165\u003c/think\u003e\u672a\u5fc5\u771f\u6b63\u7ec8\u6b62\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5206\u6790\u4e86\u5927\u63a8\u7406\u6a21\u578b\u4e2d\u901a\u8fc7\u5916\u90e8\u63d2\u5165 end-of-think token\uff08\u003c/think\u003e\uff09\u8fdb\u884c\u65e9\u505c\u7684\u7b56\u7565\uff0c\u53d1\u73b0\u6a21\u578b\u5e38\u4f1a\u5728\u56de\u7b54\u9636\u6bb5\u7ee7\u7eed\u751f\u6210\u7c7b\u4f3c CoT \u7684\u63a8\u7406\u5185\u5bb9\uff0c\u5f62\u6210\u201c\u4f2a CoT \u7ec8\u6b62\u201d\u3002\u4f5c\u8005\u63d0\u51fa\u7528 Exit-token Attention Biasing \u589e\u5f3a\u6a21\u578b\u5bf9\u63d2\u5165 EoT \u7684\u6ce8\u610f\u529b\uff0c\u4ee5\u7f13\u89e3\u8be5\u73b0\u8c61\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u4ec5\u9760\u5339\u914d\u663e\u5f0f\u003cthink\u003e\u683c\u5f0f\u6765\u63a7\u5236\u5927\u63a8\u7406\u6a21\u578b\u5e76\u4e0d\u53ef\u9760\uff0c\u5bf9CoT\u538b\u7f29\u3001\u63a8\u7406\u65e9\u505c\u548c\u53ef\u63a7\u751f\u6210\u5177\u6709\u76f4\u63a5\u8b66\u793a\u4ef7\u503c\u3002"}, {"abstract": "Vision-Language Models (VLMs) are increasingly used to evaluate robot manipulation outcomes, but existing benchmarks offer limited evidence of cross-domain generalization. We introduce FailBench, a benchmark for robot failure detection comprising 2,197 manipulation attempts across 14 public sources (12 real-world, 2 simulated). In FailBench, 75% of failures occur naturally, and six real-world sources come from non-failure-detection datasets. Evaluating 13 VLM-based detectors, we find the best model achieves only 0.77 mean balanced accuracy. Notably, models fine-tuned for failure detection consistently underperform general-purpose VLMs and their own pretrained baselines. Performance depends heavily on required visual evidence: models approach saturation when outcomes depend on observable object motion, but degrade to near-chance (\u003c0.60 balanced accuracy) on contact-intensive assembly tasks. Error analysis reveals a systematic bias toward predicting success under ambiguous evidence, which persists even with increased reasoning effort. Finally, we show that input-level intervention--spatially localizing and cropping outcome-relevant regions--improves the top detector by 2.4 percentage points without extra training.", "arxiv_id": "2609.03611", "arxiv_url": "https://arxiv.org/abs/2609.03611", "authors": ["Zaruhi Navasardyan", "Tatul Danielyan", "Hrant Davtyan"], "brief": "\u8bba\u6587\u63d0\u51fa FailBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u673a\u5668\u4eba\u64cd\u4f5c\u5931\u8d25\u68c0\u6d4b\u7684\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea14\u4e2a\u516c\u5f00\u6765\u6e90\u76842197\u6b21\u64cd\u4f5c\u5c1d\u8bd5\u3002\u4f5c\u8005\u8bc4\u6d4b13\u79cd\u57fa\u4e8eVLM\u7684\u68c0\u6d4b\u5668\uff0c\u7cfb\u7edf\u5206\u6790\u5176\u8de8\u57df\u6cdb\u5316\u3001\u5931\u8d25\u7c7b\u578b\u654f\u611f\u6027\u4e0e\u9519\u8bef\u504f\u5dee\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03611", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["FailBench\u8986\u76d612\u4e2a\u771f\u5b9e\u4e16\u754c\u548c2\u4e2a\u4eff\u771f\u6765\u6e90\uff0c75%\u7684\u5931\u8d25\u4e3a\u81ea\u7136\u53d1\u751f\uff0c\u4e14\u5305\u542b\u975e\u5931\u8d25\u68c0\u6d4b\u6570\u636e\u96c6\u4
