e2d\u7684\u771f\u5b9e\u64cd\u4f5c\u7ed3\u679c", "\u6700\u4f73\u6a21\u578b\u5e73\u5747\u5e73\u8861\u51c6\u786e\u7387\u4ec50.77\uff0c\u4e13\u95e8\u5fae\u8c03\u8fc7\u7684\u5931\u8d25\u68c0\u6d4b\u6a21\u578b\u53cd\u800c\u6301\u7eed\u5f31\u4e8e\u901a\u7528VLM\u53ca\u5176\u9884\u8bad\u7ec3\u57fa\u7ebf", "\u6a21\u578b\u5728\u4f9d\u8d56\u53ef\u89c1\u7269\u4f53\u8fd0\u52a8\u7684\u4efb\u52a1\u4e0a\u8868\u73b0\u63a5\u8fd1\u9971\u548c\uff0c\u4f46\u5728\u63a5\u89e6\u5bc6\u96c6\u578b\u88c5\u914d\u4efb\u52a1\u4e0a\u964d\u81f3\u63a5\u8fd1\u968f\u673a\uff0c\u5e76\u503e\u5411\u4e8e\u5728\u8bc1\u636e\u6a21\u7cca\u65f6\u9884\u6d4b\u6210\u529f"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b", "\u5931\u8d25\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03611v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FailBench: How Reliable are VLMs at Judging Robot Task Success?", "tldr": "VLM\u5224\u65ad\u673a\u5668\u4eba\u4efb\u52a1\u6210\u8d25\u4ecd\u4e0d\u53ef\u9760", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FailBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u673a\u5668\u4eba\u64cd\u4f5c\u5931\u8d25\u68c0\u6d4b\u7684\u57fa\u51c6\uff0c\u5305\u542b\u6765\u81ea14\u4e2a\u516c\u5f00\u6765\u6e90\u76842197\u6b21\u64cd\u4f5c\u5c1d\u8bd5\u3002\u4f5c\u8005\u8bc4\u6d4b13\u79cd\u57fa\u4e8eVLM\u7684\u68c0\u6d4b\u5668\uff0c\u7cfb\u7edf\u5206\u6790\u5176\u8de8\u57df\u6cdb\u5316\u3001\u5931\u8d25\u7c7b\u578b\u654f\u611f\u6027\u4e0e\u9519\u8bef\u504f\u5dee\u3002", "why_notable": "\u8be5\u7814\u7a76\u63ed\u793a\u4e86\u7528VLM\u81ea\u52a8\u8bc4\u4f30\u673a\u5668\u4eba\u4efb\u52a1\u6210\u529f\u7387\u7684\u53ef\u9760\u6027\u74f6\u9888\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u5728\u8de8\u57df\u3001\u63a5\u89e6\u5bc6\u96c6\u548c\u89c6\u89c9\u8bc1\u636e\u4e0d\u8db3\u573a\u666f\u4e0b\u4ecd\u96be\u4ee5\u80dc\u4efb\uff0c\u5bf9\u673a\u5668\u4eba\u8bc4\u6d4b\u81ea\u52a8\u5316\u548c\u95ed\u73af\u5b66\u4e60\u5177\u6709\u76f4\u63a5\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "The growing scale of academic peer review has motivated the use of Large Language Models (LLMs) as review assistants, yet LLMs can generate fluent but unsupported claims that undermine review reliability. Existing hallucination benchmarks are not designed for peer review, where verification requires grounding claims in long, technical papers. We introduce HalluPeer, a benchmark for detecting hallucinations in scientific peer reviews, providing aligned triples of paper content, human-written reviews, and hallucination-injected reviews, annotated for detection, classification, and localization. Our pipeline induces a peer-review-specific hallucination taxonomy, identifies review contexts, and injects hallucinations with automated filtering. Experiments on 12K papers and 38K reviews show that existing detectors struggle to separate hallucinations from legitimate critique, while evaluation on authentic reviews demonstrates that HalluPeer-defined hallucination patterns occur in real peer reviews, highlighting the critical need for source-aware verification. Our project page can be found in https://github.com/Lin-TzuLing/HalluPeer.git", "arxiv_id": "2609.03580", "arxiv_url": "https://arxiv.org/abs/2609.03580", "authors": ["Tzu-Ling Lin", "Dong-Ting Yao", "Teng-Fang Hsiao", "Wei-Chih Chen", "Hong-Han Shuai"], "brief": "\u8bba\u6587\u63d0\u51fa HalluPeer\uff0c\u4e00\u4e2a\u4e13\u4e3a\u79d1\u5b66\u540c\u884c\u8bc4\u5ba1\u573a\u666f\u8bbe\u8ba1\u7684\u5e7b\u89c9\u68c0\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u8bba\u6587\u5185\u5bb9\u3001\u4eba\u7c7b\u5ba1\u7a3f\u4e0e\u6ce8\u5165\u5e7b\u89c9\u5ba1\u7a3f\u7684\u5bf9\u9f50\u4e09\u5143\u7ec4\u3002\u5b83\u652f\u6301\u5e7b\u89c9\u68c0\u6d4b\u3001\u5206\u7c7b\u4e0e\u5b9a\u4f4d\uff0c\u5e76\u6784\u5efa\u4e86\u9762\u5411\u5ba1\u7a3f\u8bed\u5883\u7684\u5e7b\u89c9\u5206\u7c7b\u4f53\u7cfb\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03580", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e\u540c\u884c\u8bc4\u5ba1\u7279\u6709\u573a\u666f\u5f52\u7eb3\u5e7b\u89c9 taxonomy\uff0c\u5e76\u81ea\u52a8\u8bc6\u522b\u5ba1\u7a3f\u4e0a\u4e0b\u6587\u3001\u6ce8\u5165\u5e7b\u89c9\u3001\u8fc7\u6ee4\u751f\u6210\u6837\u672c", "\u8986\u76d6\u7ea6 1.2 \u4e07\u7bc7\u8bba\u6587\u4e0e 3.8 \u4e07\u6761\u5ba1\u7a3f\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u6280\u672f\u8bba\u6587 grounding \u4e0b\u7684\u5ba1\u7a3f\u5e7b\u89c9", "\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u68c0\u6d4b\u5668\u96be\u4ee5\u533a\u5206\u5408\u7406\u6279\u8bc4\u4e0e\u65e0\u4f9d\u636e\u5e7b\u89c9\uff0c\u771f\u5b9e\u5ba1\u7a3f\u4e2d\u4e5f\u5b58\u5728 HalluPeer \u5b9a\u4e49\u7684\u5e7b\u89c9\u6a21\u5f0f"], "keywords": ["\u5e7b\u89c9\u68c0\u6d4b", "\u540c\u884c\u8bc4\u5ba1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03580v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "HalluPeer: A Taxonomy-driven Benchmark for Detecting Hallucinations in Scientific Peer Reviews", "tldr": "\u9762\u5411\u79d1\u7814\u5ba1\u7a3f\u5e7b\u89c9\u68c0\u6d4b\u7684\u65b0\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa HalluPeer\uff0c\u4e00\u4e2a\u4e13\u4e3a\u79d1\u5b66\u540c\u884c\u8bc4\u5ba1\u573a\u666f\u8bbe\u8ba1\u7684\u5e7b\u89c9\u68c0\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u8bba\u6587\u5185\u5bb9\u3001\u4eba\u7c7b\u5ba1\u7a3f\u4e0e\u6ce8\u5165\u5e7b\u89c9\u5ba1\u7a3f\u7684\u5bf9\u9f50\u4e09\u5143\u7ec4\u3002\u5b83\u652f\u6301\u5e7b\u89c9\u68c0\u6d4b\u3001\u5206\u7c7b\u4e0e\u5b9a\u4f4d\uff0c\u5e76\u6784\u5efa\u4e86\u9762\u5411\u5ba1\u7a3f\u8bed\u5883\u7684\u5e7b\u89c9\u5206\u7c7b\u4f53\u7cfb\u3002", "why_notable": "\u540c\u884c\u8bc4\u5ba1\u662f LLM \u8f85\u52a9\u5199\u4f5c\u4e0e\u8bc4\u4f30\u7684\u91cd\u8981\u5e94\u7528\u573a\u666f\uff0c\u4f46\u5176\u5e7b\u89c9\u9a8c\u8bc1\u9700\u8981\u57fa\u4e8e\u957f\u7bc7\u6280\u672f\u8bba\u6587\u8fdb\u884c\u6eaf\u6e90\u3002HalluPeer \u586b\u8865\u4e86\u901a\u7528\u5e7b\u89c9\u57fa\u51c6\u65e0\u6cd5\u8986\u76d6\u5ba1\u7a3f\u8bed\u5883\u7684\u7a7a\u767d\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u66f4\u53ef\u9760\u7684\u79d1\u7814\u8bc4\u5ba1\u8f85\u52a9\u7cfb\u7edf\u3002"}, {"abstract": "Action-conditioned JEPA world models enable planning toward visually specified goals without reconstructing future pixels, yet latent prediction alone does not explicitly encourage the learned representations to retain information relevant to robotic control. We introduce an end-to-end JEPA world model that augments latent prediction with inverse dynamics (IDM) and state alignment (SA). While inverse dynamics discourages latent collapse and makes latent transitions informative of the actions that produced them, state alignment grounds consecutive representations in their associated physical configuration and motion. Across four benchmark tasks, our model attains the highest success rates on TwoRoom (100%), PushT (98%), and OGBench-Cube (87%), while performing comparably to LeWorldModel on Reacher. Our ablation further shows that adding state alignment consistently improves planning success over IDM alone across all four tasks. Although LeWorldModel, our primary baseline, attains higher average straightening on OGBench-Cube, transition-subspace analysis shows that its transition energy is concentrated in a substantially lower-dimensional subspace. Our state-aligned model exhibits a higher effective transition dimension than LeWorldModel and improves planning over IDM alone, supporting state alignment as an effective complement to inverse dynamics for robotic planning.", "arxiv_id": "2609.03565", "arxiv_url": "https://arxiv.org/abs/2609.03565", "authors": ["Muyuan Liu", "Yue Huang", "Zheng Liang", "Xiang Gao"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7aef\u5230\u7aef\u7684\u52a8\u4f5c\u6761\u4ef6JEPA\u4e16\u754c\u6a21\u578b\uff0c\u5728\u6f5c\u53d8\u91cf\u9884\u6d4b\u4e4b\u5916\u52a0\u5165\u9006\u52a8\u529b\u5b66\u548c\u72b6\u6001\u5bf9\u9f50\uff0c\u4f7f\u8868\u793a\u66f4\u8d34\u8fd1\u673a\u5668\u4eba\u63a7\u5236\u6240\u9700\u7684\u7269\u7406\u914d\u7f6e\u4e0e\u8fd0\u52a8\u4fe1\u606f\u3002\u8be5\u6a21\u578b\u7528\u4e8e\u89c6\u89c9\u76ee\u6807\u6761\u4ef6\u4e0b\u7684\u673a\u5668\u4eba\u89c4\u5212\uff0c\u65e0\u9700\u91cd\u5efa\u672a\u6765\u50cf\u7d20\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03565", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9006\u52a8\u529b\u5b66\u6a21\u5757\u7528\u4e8e\u907f\u514d\u6f5c\u8868\u793a\u574d\u7f29\uff0c\u5e76\u8ba9\u6f5c\u5728\u72b6\u6001\u8f6c\u79fb\u5305\u542b\u4ea7\u751f\u8be5\u8f6c\u79fb\u7684\u52a8\u4f5c\u4fe1\u606f", "\u72b6\u6001\u5bf9\u9f50\u5c06\u8fde\u7eed\u6f5c\u8868\u793a\u4e0e\u7269\u7406\u72b6\u6001\u548c\u8fd0\u52a8\u5bf9\u9f50\uff0c\u5728\u56db\u4e2a\u4efb\u52a1\u4e2d\u76f8\u8f83\u4ec5\u7528\u9006\u52a8\u529b\u5b66\u7a33\u5b9a\u63d0\u5347\u89c4\u5212\u6210\u529f\u7387", "\u5728TwoRoom\u3001PushT\u3001OGBench-Cube\u4e0a\u5206\u522b\u8fbe\u5230100%\u300198%\u300187%\u6210\u529f\u7387\uff0c\u5e76\u5728Reacher\u4e0a\u63a5\u8fd1\u5f3a\u57fa\u7ebfLeWorldModel"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u89c4\u5212", "\u8868\u5f81\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03565v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Toward Physically Grounded JEPA World Models for Goal-Conditioned Robotic Planning", "tldr": "\u7528\u7269\u7406\u72b6\u6001\u5bf9\u9f50\u589e\u5f3aJEPA\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7aef\u5230\u7aef\u7684\u52a8\u4f5c\u6761\u4ef6JEPA\u4e16\u754c\u6a21\u578b\uff0c\u5728\u6f5c\u53d8\u91cf\u9884\u6d4b\u4e4b\u5916\u52a0\u5165\u9006\u52a8\u529b\u5b66\u548c\u72b6\u6001\u5bf9\u9f50\uff0c\u4f7f\u8868\u793a\u66f4\u8d34\u8fd1\u673a\u5668\u4eba\u63a7\u5236\u6240\u9700\u7684\u7269\u7406\u914d\u7f6e\u4e0e\u8fd0\u52a8\u4fe1\u606f\u3002\u8be5\u6a21\u578b\u7528\u4e8e\u89c6\u89c9\u76ee\u6807\u6761\u4ef6\u4e0b\u7684\u673a\u5668\u4eba\u89c4\u5212\uff0c\u65e0\u9700\u91cd\u5efa\u672a\u6765\u50cf\u7d20\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03JEPA\u5f0f\u4e16\u754c\u6a21\u578b\u4e0d\u4ec5\u8981\u9884\u6d4b\u6f5c\u7a7a\u95f4\uff0c\u8fd8\u9700\u663e\u5f0f\u4fdd\u7559\u4e0e\u63a7\u5236\u76f8\u5173\u7684\u7269\u7406\u4fe1\u606f\uff0c\u4e3a\u76ee\u6807\u6761\u4ef6\u673a\u5668\u4eba\u89c4\u5212\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u8868\u5f81\u5b66\u4e60\u601d\u8def\u3002"}, {"abstract": "Decoding-time KV cache compression research focuses heavily on designing better token scoring functions, while the temporal rule that aggregates scores across decode steps is often treated as an implementation detail. Under aggressive KV compression, we find that exponential-moving-average (EMA) aggregation makes approximately order-preserving scorer modifications largely indistinguishable at the eviction-set level. Value-norm and entropy variants remain highly correlated with attention and produce nearly unchanged retention sets, whereas KeyDiff, key norm, recency, and a learned scorer alter the ranking and degrade substantially. We associate this stability with the evaluated aggregation, which couples layer weighting and temporal retention. Building on this observation, we introduce InertiaKV, an EMA-based decoding-time eviction method, and InertiaKV-Lazy, its periodic-refresh variant, which yields 1.34-1.46x decode throughput relative to full refresh InertiaKV. We also study Score-Free decoding as a separate empirical operating point: it scores the full context once at the first decode step, freezes that ranking, and incurs an average quality change of +0.03 while removing all subsequent scoring. Across six open-weight backbones and the LongBench, LongBench-v2, and RULER benchmarks, the results identify temporal aggregation and ranking preservation as distinct, consequential design factors; they do not imply that scoring quality is irrelevant in general.", "arxiv_id": "2609.03515", "arxiv_url": "https://arxiv.org/abs/2609.03515", "authors": ["Bo Zeng", "Yu Zhao", "Yefeng Liu", "Zhihong Lu", "Xuanfan Ni", "Xintong Wang"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u6fc0\u8fdbKV\u7f13\u5b58\u538b\u7f29\u4e2d\u7684\u89e3\u7801\u671f\u6dd8\u6c70\u7b56\u7565\uff0c\u6307\u51fa\u76f8\u6bd4\u8bbe\u8ba1\u66f4\u590d\u6742\u7684token\u8bc4\u5206\u51fd\u6570\uff0c\u8de8\u89e3\u7801\u6b65\u7684\u65f6\u95f4\u805a\u5408\u89c4\u5219\u540c\u6837\u5173\u952e\u3002\u4f5c\u8005\u63d0\u51fa\u57fa\u4e8eEMA\u805a\u5408\u7684InertiaKV\u53ca\u5468\u671f\u5237\u65b0\u7248InertiaKV-Lazy\uff0c\u5e76\u9a8c\u8bc1\u6392\u540d\u4fdd\u6301\u5bf9\u8d28\u91cf\u7a33\u5b9a\u6027\u7684\u91cd\u8981\u4f5c\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03515", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u6fc0\u8fdbKV\u538b\u7f29\u4e0b\uff0cEMA\u805a\u5408\u4f1a\u4f7f\u8fd1\u4f3c\u4fdd\u6301\u6392\u5e8f\u7684\u8bc4\u5206\u5668\u6539\u52a8\u5728\u5b9e\u9645\u6dd8\u6c70\u96c6\u5408\u4e0a\u51e0\u4e4e\u4e0d\u53ef\u533a\u5206\u3002", "Value-norm\u548centropy\u53d8\u4f53\u4e0eattention\u8bc4\u5206\u9ad8\u5ea6\u76f8\u5173\uff0c\u4fdd\u7559\u96c6\u5408\u53d8\u5316\u5f88\u5c0f\uff1bKeyDiff\u3001key norm\u3001recency\u548c\u5b66\u4e60\u5f0f\u8bc4\u5206\u5668\u4f1a\u6539\u53d8\u6392\u540d\u5e76\u5bfc\u81f4\u660e\u663e\u9000\u5316\u3002", "InertiaKV-Lazy\u901a\u8fc7\u5468\u671f\u5237\u65b0\u5b9e\u73b0\u76f8\u5bf9\u5b8c\u6574\u5237\u65b0InertiaKV\u76841.34-1.46\u500d\u89e3\u7801\u541e\u5410\u63d0\u5347\uff1bScore-Free\u4ec5\u9996\u6b65\u8bc4\u5206\u5e76\u51bb\u7ed3\u6392\u540d\uff0c\u5e73\u5747\u8d28\u91cf\u53d8\u5316\u7ea6+0.03\u3002"], "keywords": ["KV\u7f13\u5b58", "\u63a8\u7406\u52a0\u901f", "\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03515v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What Matters for Aggressive Decoding-Time KV Eviction? Temporal Aggregation and Ranking Preservation", "tldr": "\u89e3\u7801\u671fKV\u6dd8\u6c70\u5173\u952e\u5728\u65f6\u5e8f\u805a\u5408\u4e0e\u6392\u540d\u4fdd\u6301", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u6fc0\u8fdbKV\u7f13\u5b58\u538b\u7f29\u4e2d\u7684\u89e3\u7801\u671f\u6dd8\u6c70\u7b56\u7565\uff0c\u6307\u51fa\u76f8\u6bd4\u8bbe\u8ba1\u66f4\u590d\u6742\u7684token\u8bc4\u5206\u51fd\u6570\uff0c\u8de8\u89e3\u7801\u6b65\u7684\u65f6\u95f4\u805a\u5408\u89c4\u5219\u540c\u6837\u5173\u952e\u3002\u4f5c\u8005\u63d0\u51fa\u57fa\u4e8eEMA\u805a\u5408\u7684InertiaKV\u53ca\u5468\u671f\u5237\u65b0\u7248InertiaKV-Lazy\uff0c\u5e76\u9a8c\u8bc1\u6392\u540d\u4fdd\u6301\u5bf9\u8d28\u91cf\u7a33\u5b9a\u6027\u7684\u91cd\u8981\u4f5c\u7528\u3002", "why_notable": "\u8bba\u6587\u628aKV\u7f13\u5b58\u538b\u7f29\u7684\u5173\u6ce8\u70b9\u4ece\u5355\u7eaf\u8bc4\u5206\u51fd\u6570\u6269\u5c55\u5230\u65f6\u95f4\u805a\u5408\u4e0e\u6392\u540d\u4fdd\u6301\uff0c\u4e3a\u957f\u4e0a\u4e0b\u6587LLM\u63a8\u7406\u52a0\u901f\u63d0\u4f9b\u4e86\u66f4\u53ef\u89e3\u91ca\u3001\u4f4e\u5f00\u9500\u7684\u8bbe\u8ba1\u539f\u5219\uff0c\u5e76\u5728\u591a\u4e2a\u5f00\u6e90\u6a21\u578b\u548cLongBench\u3001LongBench-v2\u3001RULER\u4e0a\u9a8c\u8bc1\u3002"}, {"abstract": "Large language models (LLMs) are increas- ingly deployed as long-horizon conversational agents, motivating growing interest in mem- ory systems. However, existing benchmarks primarily evaluate memory through QA-style probing rather than in-situ conversational usage. We introduce LOCOMO-CONV, a conversa- tional memory benchmark derived from Lo- CoMo with four query styles: dialog, implicit, counterfactual, and composed. Across five rep- resentative memory systems, we evaluate both retrieval recall and end-to-end response qual- ity. Our experiments show that conversational framing exposes substantial retrieval gaps over- looked by QA benchmarks, especially on im- plicit and composed queries, which multi-facet query rewriting narrows for raw-turn mem- ory but not abstractive memory. We further find that strong retrieval does not fully trans- late into response quality, and that implicit queries exhibit silent grounding, where mem- ory improves contextual grounding without ex- plicitly surfacing the gold fact. These results point to reasoning-based memory elaboration as a promising direction, and we release aux- iliary supportive_memory annotations captur- ing conversationally useful context beyond the original gold evidence.", "arxiv_id": "2609.03467", "arxiv_url": "https://arxiv.org/abs/2609.03467", "authors": ["Wen-Yu Chang", "Yun-Nung Chen"], "brief": "\u8bba\u6587\u63d0\u51fa LOCOMO-CONV\uff0c\u4e00\u4e2a\u4ece LoCoMo \u6d3e\u751f\u7684\u5bf9\u8bdd\u5f0f\u8bb0\u5fc6\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u7a0b\u5bf9\u8bdd\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u5bf9\u8bdd\u8bed\u5883\u4e2d\u7684\u8bb0\u5fc6\u68c0\u7d22\u80fd\u529b\u3002\u5b83\u8986\u76d6 dialog\u3001implicit\u3001counterfactual\u3001composed \u56db\u7c7b\u67e5\u8be2\uff0c\u5e76\u540c\u65f6\u8bc4\u4f30\u68c0\u7d22\u53ec\u56de\u4e0e\u7aef\u5230\u7aef\u56de\u590d\u8d28\u91cf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03467", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u73b0\u6709 QA \u5f0f\u8bb0\u5fc6\u8bc4\u6d4b\u4f1a\u9ad8\u4f30\u7cfb\u7edf\u80fd\u529b\uff1b\u5bf9\u8bdd\u5f0f\u67e5\u8be2\u66b4\u9732\u51fa\u660e\u663e\u68c0\u7d22\u7f3a\u53e3\uff0c\u5c24\u5176\u5728\u9690\u5f0f\u67e5\u8be2\u548c\u7ec4\u5408\u67e5\u8be2\u4e0a\u3002", "\u591a\u89c6\u89d2\u67e5\u8be2\u91cd\u5199\u53ef\u6539\u5584\u539f\u59cb\u8f6e\u6b21\u8bb0\u5fc6\u7684\u68c0\u7d22\uff0c\u4f46\u5bf9\u62bd\u8c61\u5316\u8bb0\u5fc6\u7cfb\u7edf\u5e2e\u52a9\u6709\u9650\u3002", "\u68c0\u7d22\u5f3a\u5e76\u4e0d\u5fc5\u7136\u5e26\u6765\u9ad8\u8d28\u91cf\u56de\u590d\uff1b\u9690\u5f0f\u67e5\u8be2\u4e2d\u5b58\u5728\u201c\u9759\u9ed8 grounding\u201d\uff0c\u5373\u8bb0\u5fc6\u63d0\u5347\u4e86\u4e0a\u4e0b\u6587\u8d34\u5408\u5ea6\u4f46\u672a\u663e\u5f0f\u63d0\u53ca\u6807\u51c6\u4e8b\u5b9e\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7cfb\u7edf", "\u5bf9\u8bdd\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03467v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Users Don\u0027t Ask: Benchmarking Context-Driven Memory Retrieval in Conversational Agents", "tldr": "\u8bc4\u6d4b\u5bf9\u8bdd\u573a\u666f\u4e0b\u7684\u4e0a\u4e0b\u6587\u9a71\u52a8\u8bb0\u5fc6\u68c0\u7d22", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LOCOMO-CONV\uff0c\u4e00\u4e2a\u4ece LoCoMo \u6d3e\u751f\u7684\u5bf9\u8bdd\u5f0f\u8bb0\u5fc6\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u7a0b\u5bf9\u8bdd\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u5bf9\u8bdd\u8bed\u5883\u4e2d\u7684\u8bb0\u5fc6\u68c0\u7d22\u80fd\u529b\u3002\u5b83\u8986\u76d6 dialog\u3001implicit\u3001counterfactual\u3001composed \u56db\u7c7b\u67e5\u8be2\uff0c\u5e76\u540c\u65f6\u8bc4\u4f30\u68c0\u7d22\u53ec\u56de\u4e0e\u7aef\u5230\u7aef\u56de\u590d\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u8bb0\u5fc6\u8bc4\u6d4b\u4ece\u9759\u6001 QA \u63a8\u5411\u66f4\u8d34\u8fd1\u771f\u5b9e\u4f7f\u7528\u7684\u5bf9\u8bdd\u573a\u666f\uff0c\u63ed\u793a\u4e86\u957f\u671f\u5bf9\u8bdd\u667a\u80fd\u4f53\u5728\u9690\u5f0f\u7406\u89e3\u3001\u7ec4\u5408\u63a8\u7406\u548c\u8bb0\u5fc6\u5229\u7528\u4e0a\u7684\u5173\u952e\u77ed\u677f\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u9760\u7684\u667a\u80fd\u4f53\u8bb0\u5fc6\u7cfb\u7edf\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reasoning traces of large language models are widely read as containing \"breakthrough\" moments and early-legible fates. Both readings rest on measurements missing a counterfactual control at the level of the claim; we supply both controls. First, a restart-controlled truncation probe separates when a solution fits the continuation budget from when a prefix carries value that fresh computation cannot buy, comparing per-anchor continuation solve rates against from-scratch restart curves at matched total generated-token budget. Applied to 178 problem-model cells (89 MATH problems x two small open models, an outcome-blind but difficulty-targeted cohort), exactly 1 of 178 cells survives as prefix-limited; restart dose-response separates a compute-starved model from a capability-limited one; and wherever the matched budget lies inside the restart grid, continuing the model\u0027s own prefix beats restarting (9 of 9) -- predominantly compute compression rather than expanded reachability. Second, a pre-registered, difficulty-controlled test finds no detectable outcome information in early-window internal signals beyond a problem-difficulty baseline, and two generation-free analyses of public corpora show why this control is needed: a trace-blind difficulty proxy reaches AUROC 0.873 on 192K DeepSeek-R1 generations -- inside the published probe range -- and a closely matched reconstruction of the closest published early-window positive recovers a comparable pooled result (0.849) while within problem it is statistically indistinguishable from chance at all ten anchors (0.496 at t=4); a post-hoc within-targeted probe finds only a small average residual, concentrated in three low-failure problems. High pooled probe AUROCs cannot by themselves establish within-attempt information; a question-only baseline or within-problem evaluation is required.", "arxiv_id": "2609.03436", "arxiv_url": "https://arxiv.org/abs/2609.03436", "authors": ["Yigit Utku Bulut"], "brief": "\u8bba\u6587\u91cd\u65b0\u68c0\u9a8cLLM\u63a8\u7406\u8f68\u8ff9\u4e2d\u6240\u8c13\u201c\u7a81\u7834\u65f6\u523b\u201d\u548c\u201c\u65e9\u671f\u53ef\u9884\u6d4b\u6210\u8d25\u201d\u7684\u8bc1\u636e\uff0c\u63d0\u51fa\u5e26\u91cd\u542f\u5bf9\u7167\u548c\u96be\u5ea6\u63a7\u5236\u7684\u8bc4\u4f30\u65b9\u6cd5\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8bb8\u591a\u770b\u4f3c\u6765\u81ea\u63a8\u7406\u8fc7\u7a0b\u7684\u4fe1\u53f7\uff0c\u5176\u5b9e\u4e3b\u8981\u7531\u751f\u6210\u9884\u7b97\u548c\u9898\u76ee\u96be\u5ea6\u89e3\u91ca\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03436", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51farestart-controlled truncation probe\uff0c\u5728\u76f8\u540c\u603b\u751f\u6210token\u9884\u7b97\u4e0b\u6bd4\u8f83\u7ee7\u7eed\u5f53\u524d\u524d\u7f00\u4e0e\u4ece\u96f6\u91cd\u542f\uff0c\u533a\u5206\u201c\u524d\u7f00\u672c\u8eab\u6709\u4ef7\u503c\u201d\u548c\u201c\u53ea\u662f\u9884\u7b97\u8db3\u591f\u201d\u3002", "\u572889\u9053MATH\u9898\u3001\u4e24\u4e2a\u5c0f\u578b\u5f00\u6e90\u6a21\u578b\u7ec4\u6210\u7684178\u4e2a\u95ee\u9898-\u6a21\u578b\u5355\u5143\u4e2d\uff0c\u4ec51\u4e2a\u5355\u5143\u8868\u73b0\u4e3a\u771f\u6b63\u7684prefix-limited\uff1b\u7ee7\u7eed\u81ea\u8eab\u524d\u7f00\u66f4\u591a\u4f53\u73b0\u8ba1\u7b97\u538b\u7f29\u800c\u975e\u6269\u5c55\u53ef\u89e3\u8303\u56f4\u3002", "\u96be\u5ea6\u63a7\u5236\u5b9e\u9a8c\u53d1\u73b0\uff0c\u65e9\u671f\u7a97\u53e3\u5185\u90e8\u4fe1\u53f7\u76f8\u8f83\u9898\u76ee\u96be\u5ea6\u57fa\u7ebf\u6ca1\u6709\u53ef\u68c0\u6d4b\u7684\u989d\u5916\u6210\u8d25\u4fe1\u606f\uff1b\u4ec5\u9898\u76ee\u96be\u5ea6\u4ee3\u7406\u5728DeepSeek-R1\u516c\u5f00\u751f\u6210\u4e0a\u5373\u53ef\u8fbe\u5230AUROC 0.873\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u8bc4\u4f30\u65b9\u6cd5", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03436v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "It\u0027s the Problem, Not the Path: Budget and Difficulty Confounds in LLM Reasoning Trajectories", "tldr": "LLM\u63a8\u7406\u8f68\u8ff9\u4fe1\u53f7\u591a\u88ab\u9898\u76ee\u96be\u5ea6\u6df7\u6dc6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u91cd\u65b0\u68c0\u9a8cLLM\u63a8\u7406\u8f68\u8ff9\u4e2d\u6240\u8c13\u201c\u7a81\u7834\u65f6\u523b\u201d\u548c\u201c\u65e9\u671f\u53ef\u9884\u6d4b\u6210\u8d25\u201d\u7684\u8bc1\u636e\uff0c\u63d0\u51fa\u5e26\u91cd\u542f\u5bf9\u7167\u548c\u96be\u5ea6\u63a7\u5236\u7684\u8bc4\u4f30\u65b9\u6cd5\u3002\u7ed3\u679c\u663e\u793a\uff0c\u8bb8\u591a\u770b\u4f3c\u6765\u81ea\u63a8\u7406\u8fc7\u7a0b\u7684\u4fe1\u53f7\uff0c\u5176\u5b9e\u4e3b\u8981\u7531\u751f\u6210\u9884\u7b97\u548c\u9898\u76ee\u96be\u5ea6\u89e3\u91ca\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u6311\u6218\u4e86\u5bf9LLM\u63a8\u7406\u94fe\u7684\u5e38\u89c1\u89e3\u91ca\uff1a\u9ad8AUROC\u6216\u65e9\u671f\u8f68\u8ff9\u4fe1\u53f7\u5e76\u4e0d\u5fc5\u7136\u8bf4\u660e\u6a21\u578b\u5728\u63a8\u7406\u4e2d\u51fa\u73b0\u4e86\u53ef\u8bfb\u7684\u5173\u952e\u8f6c\u6298\u3002\u5b83\u5f3a\u8c03\u5fc5\u987b\u4f7f\u7528\u9898\u76ee\u7ea7\u53cd\u4e8b\u5b9e\u3001question-only\u57fa\u7ebf\u6216within-problem\u8bc4\u4f30\uff0c\u4e3a\u5206\u6790\u63a8\u7406\u8fc7\u7a0b\u3001\u8bad\u7ec3\u5956\u52b1\u6a21\u578b\u548c\u89e3\u91caLLM\u884c\u4e3a\u63d0\u4f9b\u4e86\u66f4\u4e25\u8c28\u7684\u65b9\u6cd5\u8bba\u3002"}, {"abstract": "Full-duplex voice agents must continuously decide when to listen, backchannel, interrupt, handle speech overlaps, take the floor, and yield. Existing benchmarks largely test these behaviors through explicit turn-management instructions, while deployed agents are often configured through roles or personas from which the appropriate conversational behavior must be inferred. We introduce DuplexSpeechBench-IFEval (DSB-IFEval) for evaluating implicit instruction-following in real-time spoken interaction. (DSB-IFEval) comprises 1,038 test cases spanning eight diverse assistant roles and evaluates five conditioning protocols for instruction-following: default behavior, explicit behavioral instructions, persona-implied behavior, combined persona--rule conditioning, and instruction conflict. We measure real-time floor management using a deterministic Instruction Adherence Score (IAS) and persona-consistent content using LLM-judged Persona Adherence Score (PAS). Across six real-time speech systems, we find architecture-dependent trade-offs. Full duplex models like F-Actor and PersonaPlex are more sensitive to whether conversational behavior is stated explicitly or must be inferred from a persona, with adherence dropping by 9.7% and 4.5%, respectively, under persona-only conditioning. In contrast, GPT-Realtime, MiniCPM-o, and Fun-Audio-Chat strongly adhere to persona-consistent content, but their floor behavior does not adapt across explicit and persona-only instructions and remains constrained on several proactive actions. We further find that even if systems reliably follow conflicting directives to their prescribed persona, they still struggle to override them under safety conflict. These results show that inferring the behavior implied by a role, executing it at the appropriate conversational moment, and resolving competing instructions remain distinct challenges for full-duplex voice agents.", "arxiv_id": "2609.03423", "arxiv_url": "https://arxiv.org/abs/2609.03423", "authors": ["Puneet Mathur", "Dinesh Manocha"], "brief": "\u8bba\u6587\u63d0\u51fa DuplexSpeechBench-IFEval\uff0c\u4e00\u4e2a\u9762\u5411\u5b9e\u65f6\u5168\u53cc\u5de5\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u80fd\u5426\u4ece\u89d2\u8272\u6216\u4eba\u8bbe\u4e2d\u9690\u5f0f\u63a8\u65ad\u4f55\u65f6\u503e\u542c\u3001\u63d2\u8bdd\u3001\u8ba9\u6e21\u8bdd\u8f6e\u7b49\u5bf9\u8bdd\u884c\u4e3a\u3002\u57fa\u51c6\u5305\u542b1038\u4e2a\u6d4b\u8bd5\u7528\u4f8b\u30018\u7c7b\u52a9\u624b\u89d2\u8272\uff0c\u5e76\u4ece\u8bdd\u8f6e\u7ba1\u7406\u548c\u4eba\u8bbe\u4e00\u81f4\u6027\u4e24\u65b9\u9762\u6253\u5206\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03423", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u8bbe\u8ba1\u4e94\u79cd\u6307\u4ee4\u6761\u4ef6\uff1a\u9ed8\u8ba4\u884c\u4e3a\u3001\u663e\u5f0f\u884c\u4e3a\u89c4\u5219\u3001\u4eba\u8bbe\u9690\u542b\u884c\u4e3a\u3001\u4eba\u8bbe+\u89c4\u5219\u7ec4\u5408\u3001\u6307\u4ee4\u51b2\u7a81\uff0c\u4ee5\u533a\u5206\u663e\u5f0f\u9075\u5faa\u4e0e\u9690\u5f0f\u63a8\u65ad\u80fd\u529b\u3002", "\u63d0\u51fa\u786e\u5b9a\u6027\u7684 Instruction Adherence Score\uff08IAS\uff09\u8861\u91cf\u5b9e\u65f6\u8bdd\u8f6e\u7ba1\u7406\uff0c\u5e76\u7528 LLM \u8bc4\u5ba1\u7684 Persona Adherence Score\uff08PAS\uff09\u8861\u91cf\u5185\u5bb9\u662f\u5426\u7b26\u5408\u4eba\u8bbe\u3002", "\u5728\u516d\u4e2a\u5b9e\u65f6\u8bed\u97f3\u7cfb\u7edf\u4e0a\u53d1\u73b0\u660e\u663e\u67b6\u6784\u5dee\u5f02\uff1a\u5168\u53cc\u5de5\u6a21\u578b\u5728\u4ec5\u7ed9\u4eba\u8bbe\u65f6\u884c\u4e3a\u9075\u5faa\u4e0b\u964d\uff0c\u800c\u90e8\u5206\u7cfb\u7edf\u5185\u5bb9\u4eba\u8bbe\u4e00\u81f4\u6027\u5f3a\u4f46\u8bdd\u8f6e\u884c\u4e3a\u96be\u4ee5\u968f\u6307\u4ee4\u81ea\u9002\u5e94\u3002"], "keywords": ["\u8bed\u97f3\u667a\u80fd\u4f53", "\u6307\u4ee4\u8ddf\u968f", "\u8bc4\u6d4b\u57fa\u51c6", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03423v1", "published_at": "2026-09-03", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "DuplexSpeechBench-IFEval: Evaluating Implicit Instruction Following in Full-Duplex Voice Agents", "tldr": "\u8bc4\u6d4b\u5168\u53cc\u5de5\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u9690\u5f0f\u6307\u4ee4\u8ddf\u968f\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa DuplexSpeechBench-IFEval\uff0c\u4e00\u4e2a\u9762\u5411\u5b9e\u65f6\u5168\u53cc\u5de5\u8bed\u97f3\u667a\u80fd\u4f53\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u80fd\u5426\u4ece\u89d2\u8272\u6216\u4eba\u8bbe\u4e2d\u9690\u5f0f\u63a8\u65ad\u4f55\u65f6\u503e\u542c\u3001\u63d2\u8bdd\u3001\u8ba9\u6e21\u8bdd\u8f6e\u7b49\u5bf9\u8bdd\u884c\u4e3a\u3002\u57fa\u51c6\u5305\u542b1038\u4e2a\u6d4b\u8bd5\u7528\u4f8b\u30018\u7c7b\u52a9\u624b\u89d2\u8272\uff0c\u5e76\u4ece\u8bdd\u8f6e\u7ba1\u7406\u548c\u4eba\u8bbe\u4e00\u81f4\u6027\u4e24\u65b9\u9762\u6253\u5206\u3002", "why_notable": "\u8be5\u57fa\u51c6\u805a\u7126\u771f\u5b9e\u90e8\u7f72\u4e2d\u5e38\u89c1\u7684\u201c\u901a\u8fc7\u89d2\u8272\u914d\u7f6e\u63a8\u65ad\u884c\u4e3a\u201d\u95ee\u9898\uff0c\u800c\u975e\u53ea\u6d4b\u8bd5\u663e\u5f0f\u8bdd\u8f6e\u6307\u4ee4\uff0c\u63ed\u793a\u4e86\u5168\u53cc\u5de5\u8bed\u97f3\u667a\u80fd\u4f53\u5728\u9690\u5f0f\u884c\u4e3a\u63a8\u65ad\u3001\u5b9e\u65f6\u6267\u884c\u548c\u51b2\u7a81\u6307\u4ee4\u5904\u7406\u4e0a\u7684\u5206\u79bb\u6311\u6218\uff0c\u5bf9\u8bed\u97f3\u667a\u80fd\u4f53\u8bc4\u6d4b\u548c\u4ea7\u54c1\u5b89\u5168\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Conversational Recommender Systems (CRS) typically require domain-specific dialogue data, which is costly, scarce, and often unavailable in new domains. We conduct a systematic empirical study of zero-data CRS bootstrapping: generating synthetic conversational supervision from non-conversational signals---item reviews, metadata, and user-item interactions---without any in-domain dialogue corpus. We compare two information-theoretic selection strategies, Jensen-Shannon diversity and Fisher information, across domain signals, model architectures, datasets, and fine-tuning paradigms. Our results show that domain-grounded synthetic data consistently outperforms zero-shot prompting and naive synthetic baselines; active selection improves data efficiency over random sampling; metadata and collaborative filtering signals each improve selection quality; and, in low-resource settings, synthetic data can outperform scarce real dialogues while further complementing them. These findings establish non-conversational domain signals as a viable path toward building CRS without conversational training data. The code is available at https://anonymous.4open.science/r/zero_data_crs/ .", "arxiv_id": "2504.15476", "arxiv_url": "https://arxiv.org/abs/2504.15476", "authors": ["Rohan Surana", "Junda Wu", "Zhouhang Xie", "Yu Xia", "Nathan Kallus", "Julian McAuley"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5bf9\u8bdd\u63a8\u8350\u7cfb\u7edf\u7684\u96f6\u6570\u636e\u51b7\u542f\u52a8\uff1a\u4e0d\u4f9d\u8d56\u9886\u57df\u5185\u5bf9\u8bdd\u8bed\u6599\uff0c\u800c\u662f\u4ece\u5546\u54c1\u8bc4\u8bba\u3001\u5143\u6570\u636e\u548c\u7528\u6237-\u7269\u54c1\u4ea4\u4e92\u4e2d\u751f\u6210\u5408\u6210\u5bf9\u8bdd\u76d1\u7763\u6570\u636e\u3002\u8bba\u6587\u6bd4\u8f83\u4e86Jensen-Shannon\u591a\u6837\u6027\u548cFisher\u4fe1\u606f\u4e24\u7c7b\u4e3b\u52a8\u9009\u62e9\u7b56\u7565\u5728\u4e0d\u540c\u4fe1\u53f7\u3001\u6a21\u578b\u3001\u6570\u636e\u96c6\u548c\u5fae\u8c03\u8303\u5f0f\u4e0b\u7684\u6548\u679c\u3002", "categories": ["cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2504.15476", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e\u9886\u57df\u4fe1\u53f7\u751f\u6210\u7684\u5408\u6210\u5bf9\u8bdd\u6570\u636e\uff0c\u7a33\u5b9a\u4f18\u4e8e\u96f6\u6837\u672c\u63d0\u793a\u548c\u6734\u7d20\u5408\u6210\u6570\u636e\u57fa\u7ebf", "\u4e3b\u52a8\u6837\u672c\u9009\u62e9\u76f8\u6bd4\u968f\u673a\u91c7\u6837\u66f4\u5177\u6570\u636e\u6548\u7387\uff0cJensen-Shannon\u591a\u6837\u6027\u4e0eFisher\u4fe1\u606f\u5747\u88ab\u7cfb\u7edf\u8bc4\u4f30", "\u5143\u6570\u636e\u548c\u534f\u540c\u8fc7\u6ee4\u4fe1\u53f7\u90fd\u80fd\u63d0\u5347\u6837\u672c\u9009\u62e9\u8d28\u91cf\uff1b\u4f4e\u8d44\u6e90\u573a\u666f\u4e0b\uff0c\u5408\u6210\u6570\u636e\u751a\u81f3\u53ef\u4f18\u4e8e\u5c11\u91cf\u771f\u5b9e\u5bf9\u8bdd\u5e76\u4e0e\u5176\u4e92\u8865"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u5408\u6210\u6570\u636e", "\u4e3b\u52a8\u5b66\u4e60", "\u4f4e\u8d44\u6e90\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "University of California at San Diego", "pdf_url": "https://arxiv.org/pdf/2504.15476v2", "published_at": "2025-04-21", "score": 0.173, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2504.15476.png", "title": "An Empirical Study on Zero-Data Bootstrapping for Conversational Recommender Systems", "tldr": "\u7528\u975e\u5bf9\u8bdd\u4fe1\u53f7\u96f6\u6570\u636e\u6784\u5efa\u5bf9\u8bdd\u63a8\u8350\u7cfb\u7edf", "upvotes": 1, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u5bf9\u8bdd\u63a8\u8350\u7cfb\u7edf\u7684\u96f6\u6570\u636e\u51b7\u542f\u52a8\uff1a\u4e0d\u4f9d\u8d56\u9886\u57df\u5185\u5bf9\u8bdd\u8bed\u6599\uff0c\u800c\u662f\u4ece\u5546\u54c1\u8bc4\u8bba\u3001\u5143\u6570\u636e\u548c\u7528\u6237-\u7269\u54c1\u4ea4\u4e92\u4e2d\u751f\u6210\u5408\u6210\u5bf9\u8bdd\u76d1\u7763\u6570\u636e\u3002\u8bba\u6587\u6bd4\u8f83\u4e86Jensen-Shannon\u591a\u6837\u6027\u548cFisher\u4fe1\u606f\u4e24\u7c7b\u4e3b\u52a8\u9009\u62e9\u7b56\u7565\u5728\u4e0d\u540c\u4fe1\u53f7\u3001\u6a21\u578b\u3001\u6570\u636e\u96c6\u548c\u5fae\u8c03\u8303\u5f0f\u4e0b\u7684\u6548\u679c\u3002", "why_notable": "\u5bf9\u8bdd\u63a8\u8350\u7cfb\u7edf\u957f\u671f\u53d7\u9650\u4e8e\u6602\u8d35\u4e14\u7a00\u7f3a\u7684\u9886\u57df\u5bf9\u8bdd\u6570\u636e\u3002\u8be5\u7814\u7a76\u8868\u660e\uff0c\u4ec5\u5229\u7528\u8bc4\u8bba\u3001\u5143\u6570\u636e\u548c\u4ea4\u4e92\u65e5\u5fd7\u7b49\u5e38\u89c1\u975e\u5bf9\u8bdd\u4fe1\u53f7\uff0c\u4e5f\u80fd\u6709\u6548\u51b7\u542f\u52a8CRS\uff0c\u4e3a\u65b0\u9886\u57df\u5feb\u901f\u90e8\u7f72\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Spatial return models take the interaction matrix as given and leave feedback uninterpreted. We construct a bandwidth-free field from firms\u0027 language-model article embedding distributions using target-anchored Wasserstein barycentric reconstruction. A quadratic exposure-adjustment problem maps feedback into a peer-misalignment penalty ratio. For 52 firms, the field, frozen from 2018-2022 news, yields a 2023-2026 penalty ratio of 3.46 (95% interval [2.89, 4.17]) and higher conditional quasi-likelihood than equal-weighted peer support or RBF weighting of the same distances. Joint penalty ratios for the barycentric and news co-mention fields are 2.33 and 0.86 with boundary calibrated tests which reject both exclusions.", "arxiv_id": "2608.29669", "arxiv_url": "https://arxiv.org/abs/2608.29669", "authors": ["Marcus Gawronsky", "Chun-Sung Huang"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u8bed\u8a00\u6a21\u578b\u65b0\u95fb\u5d4c\u5165\u5206\u5e03\u7684\u65e0\u5e26\u5bbd\u4ea4\u4e92\u573a\uff0c\u7528\u76ee\u6807\u951a\u5b9a\u7684 Wasserstein \u91cd\u5fc3\u91cd\u6784\u523b\u753b\u4f01\u4e1a\u95f4\u53cd\u9988\u5173\u7cfb\u3002\u8be5\u4ea4\u4e92\u573a\u88ab\u7eb3\u5165\u7a7a\u95f4\u6536\u76ca\u56e0\u5b50\u6a21\u578b\uff0c\u5e76\u901a\u8fc7\u4e8c\u6b21\u66b4\u9732\u8c03\u6574\u95ee\u9898\u8f6c\u5316\u4e3a\u540c\u4e1a\u9519\u914d\u60e9\u7f5a\u6bd4\u7387\u3002", "categories": ["q-fin.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.29669", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u75282018-2022\u5e74\u65b0\u95fb\u6587\u7ae0\u7684\u8bed\u8a00\u6a21\u578b\u5d4c\u5165\u5206\u5e03\uff0c\u4e3a52\u5bb6\u516c\u53f8\u6784\u5efa\u51bb\u7ed3\u7684\u4f01\u4e1a\u95f4\u8bed\u4e49\u4ea4\u4e92\u573a", "\u76ee\u6807\u951a\u5b9a Wasserstein \u91cd\u5fc3\u91cd\u6784\u907f\u514d\u624b\u5de5\u8bbe\u5b9a\u5e26\u5bbd\uff0c\u76f8\u6bd4\u7b49\u6743\u540c\u4e1a\u652f\u6301\u548c\u57fa\u4e8e\u8ddd\u79bb\u7684 RBF \u6743\u91cd\u5177\u6709\u66f4\u9ad8\u6761\u4ef6\u51c6\u4f3c\u7136", "\u57282023-2026\u5e74\u6837\u672c\u4e2d\u5f97\u5230\u60e9\u7f5a\u6bd4\u73873.46\uff0c95%\u533a\u95f4\u4e3a[2.89, 4.17]\uff1b\u4e0e\u65b0\u95fb\u5171\u540c\u63d0\u53ca\u573a\u8054\u5408\u68c0\u9a8c\u65f6\u4e8c\u8005\u5747\u4e0d\u53ef\u88ab\u6392\u9664"], "keywords": ["\u91d1\u878d\u5efa\u6a21", "\u8bed\u8a00\u6a21\u578b", "\u6700\u4f18\u4f20\u8f93", "\u56e0\u5b50\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "University of Cape Town", "pdf_url": "https://arxiv.org/pdf/2608.29669v1", "published_at": "2026-08-30", "score": 0.157, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.29669.png", "title": "Wasserstein-Barycentric Interaction Fields for Spatial Factor Models: Evidence from Language-Model Representations", "tldr": "\u7528\u65b0\u95fb\u8bed\u4e49\u5206\u5e03\u6539\u8fdb\u4f01\u4e1a\u7a7a\u95f4\u6536\u76ca\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u8bed\u8a00\u6a21\u578b\u65b0\u95fb\u5d4c\u5165\u5206\u5e03\u7684\u65e0\u5e26\u5bbd\u4ea4\u4e92\u573a\uff0c\u7528\u76ee\u6807\u951a\u5b9a\u7684 Wasserstein \u91cd\u5fc3\u91cd\u6784\u523b\u753b\u4f01\u4e1a\u95f4\u53cd\u9988\u5173\u7cfb\u3002\u8be5\u4ea4\u4e92\u573a\u88ab\u7eb3\u5165\u7a7a\u95f4\u6536\u76ca\u56e0\u5b50\u6a21\u578b\uff0c\u5e76\u901a\u8fc7\u4e8c\u6b21\u66b4\u9732\u8c03\u6574\u95ee\u9898\u8f6c\u5316\u4e3a\u540c\u4e1a\u9519\u914d\u60e9\u7f5a\u6bd4\u7387\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u8bed\u8a00\u6a21\u578b\u5d4c\u5165\u4e0e\u6700\u4f18\u4f20\u8f93\u65b9\u6cd5\u5f15\u5165\u91d1\u878d\u7a7a\u95f4\u56e0\u5b50\u6a21\u578b\uff0c\u4e3a\u4f01\u4e1a\u95f4\u9690\u542b\u8bed\u4e49\u5173\u8054\u548c\u53cd\u9988\u98ce\u9669\u63d0\u4f9b\u4e86\u53ef\u89e3\u91ca\u3001\u53ef\u68c0\u9a8c\u7684\u5efa\u6a21\u65b9\u5f0f\uff0c\u5177\u6709\u91cf\u5316\u6295\u8d44\u548c\u98ce\u9669\u7ba1\u7406\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "RL-based post-training for reasoning models is increasingly bottlenecked by repeated fresh rollout generation, particularly in agentic settings where environment interaction dominates wall-clock cost. Replay can reduce this burden by reusing past trajectories, but existing methods typically embed it within larger training pipelines involving exploration, experience restructuring, or mixed-policy optimization. This makes replay\u0027s own contribution difficult to isolate. We ask a focused question: how far can principled replay selection alone go? We introduce Headroom-Drift Replay, a group-level replay control primitive for GRPO that separates reuse into two decisions. Headroom ranks stored groups by remaining learning value, while Drift gates them by compatibility with the current policy. The fresh on-policy stream remains unchanged, and the method adds no auxiliary generation or training machinery. Across mathematical reasoning, multimodal reasoning, and Agentic Search benchmarks, this single intervention outperforms naive replay and matches or exceeds broader replay methods on Avg Mean@32. In Agentic Search, where environment interaction dominates cost, it delivers comparable quality at materially lower wall-clock time.", "arxiv_id": "2609.03941", "arxiv_url": "https://arxiv.org/abs/2609.03941", "authors": ["Hyun Bin Park", "Du-Seong Chang"], "brief": "\u8bba\u6587\u63d0\u51fa Headroom-Drift Replay\uff0c\u7528\u4e8e GRPO \u4e2d\u66f4\u6709\u539f\u5219\u5730\u9009\u62e9\u53ef\u590d\u7528\u8f68\u8ff9\uff1aHeadroom \u8861\u91cf\u6837\u672c\u5269\u4f59\u5b66\u4e60\u4ef7\u503c\uff0cDrift \u5224\u65ad\u5176\u4e0e\u5f53\u524d\u7b56\u7565\u7684\u517c\u5bb9\u6027\u3002\u8be5\u65b9\u6cd5\u4e0d\u6539\u53d8\u65b0\u9c9c on-policy \u6570\u636e\u6d41\uff0c\u4e5f\u4e0d\u5f15\u5165\u989d\u5916\u751f\u6210\u6216\u8bad\u7ec3\u673a\u5236\uff0c\u5728\u6570\u5b66\u63a8\u7406\u3001\u591a\u6a21\u6001\u63a8\u7406\u548c\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u4f18\u4e8e\u6734\u7d20 replay\uff0c\u5e76\u5728\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u4ee5\u66f4\u4f4e\u8017\u65f6\u8fbe\u5230\u76f8\u8fd1\u8d28\u91cf\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03941", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53", "\u7ecf\u9a8c\u56de\u653e", "\u63a8\u7406\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03941v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Headroom-Drift Replay: A Primitive for Principled Replay Control in GRPO", "tldr": "\u8bba\u6587\u63d0\u51fa Headroom-Drift Replay\uff0c\u7528\u4e8e GRPO \u4e2d\u66f4\u6709\u539f\u5219\u5730\u9009\u62e9\u53ef\u590d\u7528\u8f68\u8ff9\uff1aHeadroom \u8861\u91cf\u6837\u672c\u5269\u4f59\u5b66\u4e60\u4ef7\u503c\uff0cDrift \u5224\u65ad\u5176\u4e0e\u5f53\u524d\u7b56\u7565\u7684\u517c\u5bb9\u6027\u3002\u8be5\u65b9\u6cd5\u4e0d\u6539\u53d8\u65b0\u9c9c on-policy \u6570\u636e\u6d41\uff0c\u4e5f\u4e0d\u5f15\u5165\u989d\u5916\u751f\u6210\u6216\u8bad\u7ec3\u673a\u5236\uff0c\u5728\u6570\u5b66\u63a8\u7406\u3001\u591a\u6a21\u6001\u63a8\u7406\u548c\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u4f18\u4e8e\u6734\u7d20 replay\uff0c\u5e76\u5728\u667a\u80fd\u4f53\u641c\u7d22\u4e2d\u4ee5\u66f4\u4f4e\u8017\u65f6\u8fbe\u5230\u76f8\u8fd1\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In online meeting delegation, LLM agents fail to recognize when to speak. With no structured way to track stances, coverage, and floor, they miss the moments where they should contribute. Prompt-only delegates stay silent on 51.4% of the absent participant\u0027s talking opportunities on the AMI corpus. We present CAPA (Collaborative Agent Predictive Architecture), an architecture for online meeting delegation. A Perceiver updates the meeting state from each observed turn. A Predictor forecasts how the conversation will continue. A Controller decides whether to speak and which proposition to surface. A Generator phrases the chosen contribution in the participant\u0027s style. Two judges score the forecast and the action against the next observed turn. A Recalibrator updates the meeting state from those verdicts for future decisions. To evaluate online delegation, we introduce an episode-level protocol that scores whether, when, and what a delegate contributes around the participant\u0027s actual idea units. The protocol\u0027s schema-constrained LLM judges align with human annotations at Cohen\u0027s kappa = 0.71. On 137 AMI meetings, CAPA reduces the silence rate from 51.4% to 2.5%, doubles credited recovery (26.1 --\u003e 52.2), and keeps hallucination at 0.6%. The failure mode shifts from omission to selection, with each residual near-miss attributable to a specific module of the architecture. Mechanism ablations identify the meeting state as the lever that closes the recognition gap, where raw-context scaling alone does not.", "arxiv_id": "2609.03923", "arxiv_url": "https://arxiv.org/abs/2609.03923", "authors": ["Muneeb Khan", "Frederic Kirstein", "Terry Ruas", "Bela Gipp"], "brief": "\u8bba\u6587\u63d0\u51fa CAPA \u5728\u7ebf\u4f1a\u8bae\u4ee3\u7406\u67b6\u6784\uff0c\u901a\u8fc7\u611f\u77e5\u4f1a\u8bae\u72b6\u6001\u3001\u9884\u6d4b\u5bf9\u8bdd\u8d70\u5411\u3001\u63a7\u5236\u53d1\u8a00\u65f6\u673a\u4e0e\u5185\u5bb9\uff0c\u5e76\u7528\u8bc4\u5ba1\u53cd\u9988\u6821\u51c6\u72b6\u6001\uff0c\u8ba9 LLM \u80fd\u4ee3\u8868\u7f3a\u5e2d\u8005\u5728\u5408\u9002\u65f6\u673a\u53d1\u8a00\u3002\u5728 AMI \u4f1a\u8bae\u6570\u636e\u4e0a\uff0cCAPA \u5c06\u6f0f\u53d1\u8a00\u7387\u4ece 51.4% \u964d\u81f3 2.5%\uff0c\u6062\u590d\u6709\u6548\u8d21\u732e\u7ffb\u500d\uff0c\u540c\u65f6\u5e7b\u89c9\u7387\u4ec5 0.6%\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03923", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4f1a\u8bae\u4ee3\u7406", "\u5bf9\u8bdd\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03923v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Speak for Me: Giving LLMs the Situational Awareness to Participate in a Meeting", "tldr": "\u8bba\u6587\u63d0\u51fa CAPA \u5728\u7ebf\u4f1a\u8bae\u4ee3\u7406\u67b6\u6784\uff0c\u901a\u8fc7\u611f\u77e5\u4f1a\u8bae\u72b6\u6001\u3001\u9884\u6d4b\u5bf9\u8bdd\u8d70\u5411\u3001\u63a7\u5236\u53d1\u8a00\u65f6\u673a\u4e0e\u5185\u5bb9\uff0c\u5e76\u7528\u8bc4\u5ba1\u53cd\u9988\u6821\u51c6\u72b6\u6001\uff0c\u8ba9 LLM \u80fd\u4ee3\u8868\u7f3a\u5e2d\u8005\u5728\u5408\u9002\u65f6\u673a\u53d1\u8a00\u3002\u5728 AMI \u4f1a\u8bae\u6570\u636e\u4e0a\uff0cCAPA \u5c06\u6f0f\u53d1\u8a00\u7387\u4ece 51.4% \u964d\u81f3 2.5%\uff0c\u6062\u590d\u6709\u6548\u8d21\u732e\u7ffb\u500d\uff0c\u540c\u65f6\u5e7b\u89c9\u7387\u4ec5 0.6%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The emergence of agentic AI and LLM-based multi-agent systems (MAS) presents unprecedented opportunities for automating complex tasks, while simultaneously raising critical concerns about the preservation of fundamental human-centered values, such as privacy, fairness, and safety. Although software engineering has traditionally focused on functional correctness, the adoption of LLMs and AI agents into complex socio-technical systems has intensified the need for responsible software engineering and robust value alignment. In MAS, architectural design decisions, such as coordination mechanisms, communication protocols, and system topologies, play a central role in shaping system behavior and the outcomes they produce. This paper argues that architectural choices influence not only the functionality and performance of MAS but can also promote value-oriented system behavior. Therefore, we investigate how different architectural designs support different human-centered values, discussing the following value-preserving architectural patterns: (i) a privacy-aware architecture with a federated topology, (ii) a distributed architecture to promote pluralism and diversity, and (iii) a guard-agent architecture to detect and mitigate unfairness. Finally, we introduce representative use cases to illustrate the proposed architectures in real-world scenarios. By linking architectural design with human-centered values, this work lays the foundation for a unified set of architectural patterns and guidelines towards the design of trustworthy MAS.", "arxiv_id": "2609.03920", "arxiv_url": "https://arxiv.org/abs/2609.03920", "authors": ["Alessandro Pesare", "Tommaso Dolci", "Katja Hose", "Emanuel Sallinger"], "brief": "\u672c\u6587\u8ba8\u8bba\u9762\u5411\u667a\u80fd\u4f53 AI \u548c\u5927\u8bed\u8a00\u6a21\u578b\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u201c\u4ef7\u503c\u4fdd\u6301\u201d\u67b6\u6784\u8bbe\u8ba1\uff0c\u5f3a\u8c03\u67b6\u6784\u9009\u62e9\u4e0d\u4ec5\u5f71\u54cd\u529f\u80fd\u4e0e\u6027\u80fd\uff0c\u4e5f\u4f1a\u5f71\u54cd\u9690\u79c1\u3001\u516c\u5e73\u3001\u5b89\u5168\u7b49\u4eba\u672c\u4ef7\u503c\u3002\u8bba\u6587\u63d0\u51fa\u8054\u90a6\u9690\u79c1\u67b6\u6784\u3001\u4fc3\u8fdb\u591a\u5143\u6027\u7684\u5206\u5e03\u5f0f\u67b6\u6784\u3001\u4ee5\u53ca\u7528\u4e8e\u68c0\u6d4b\u548c\u7f13\u89e3\u4e0d\u516c\u5e73\u7684\u5b88\u62a4\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u5e76\u7528\u6848\u4f8b\u8bf4\u660e\u5176\u5e94\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03920", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u53ef\u4fe1AI", "\u8f6f\u4ef6\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03920v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Value-Preserving Architectures for Agentic AI Systems", "tldr": "\u672c\u6587\u8ba8\u8bba\u9762\u5411\u667a\u80fd\u4f53 AI \u548c\u5927\u8bed\u8a00\u6a21\u578b\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u201c\u4ef7\u503c\u4fdd\u6301\u201d\u67b6\u6784\u8bbe\u8ba1\uff0c\u5f3a\u8c03\u67b6\u6784\u9009\u62e9\u4e0d\u4ec5\u5f71\u54cd\u529f\u80fd\u4e0e\u6027\u80fd\uff0c\u4e5f\u4f1a\u5f71\u54cd\u9690\u79c1\u3001\u516c\u5e73\u3001\u5b89\u5168\u7b49\u4eba\u672c\u4ef7\u503c\u3002\u8bba\u6587\u63d0\u51fa\u8054\u90a6\u9690\u79c1\u67b6\u6784\u3001\u4fc3\u8fdb\u591a\u5143\u6027\u7684\u5206\u5e03\u5f0f\u67b6\u6784\u3001\u4ee5\u53ca\u7528\u4e8e\u68c0\u6d4b\u548c\u7f13\u89e3\u4e0d\u516c\u5e73\u7684\u5b88\u62a4\u667a\u80fd\u4f53\u67b6\u6784\uff0c\u5e76\u7528\u6848\u4f8b\u8bf4\u660e\u5176\u5e94\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model agents have shown promise in bioinformatics, but most existing systems focus primarily on producing final answers, treating planning, tool use, and code execution as transient interactions. This design is poorly suited to long-horizon bioinformatics tasks, where conclusions must remain connected to the data, computations, and intermediate evidence that support them. We introduce \\textbf{Bioinfoysis}, a multi-agent harness that represents each request as a persistent, artifact-grounded analysis run. Bioinfoysis combines global planning with step-wise, evidence-driven replanning: the planner maintains an executable checklist and revises pending steps using structured handoffs returned after each worker execution. These handoffs bind intermediate results to their responsible agent, checklist step, and plan generation, preventing stale evidence from being silently reused after replanning. A controlled runtime validates generated scripts, tables, and figures before they are used in downstream analysis or reporting, while role-specific context, persistent memory, and governed bioinformatics skills support reliable execution over long analysis trajectories. We evaluate Bioinfoysis on BixBench and two question-answering tracks of LAB-Bench 2. On BixBench, Bioinfoysis achieves state-of-the-art accuracy of 82.4\\%. Across four underlying language models, Bioinfoysis increases average accuracy from 27.81\\% to 64.13\\% on SeqQA2 and from 3.13\\% to 31.25\\% on DbQA2. These results demonstrate that reliable bioinformatics automation depends not only on model capability, but also on the harness that governs planning, execution, memory, and evidence flow. We hope that the emergence of Bioinfoysis will play a driving and leading role in the development of the bioinformatics community. Our demo website can be seen in https://report.bioinfoysis.com/.", "arxiv_id": "2609.03871", "arxiv_url": "https://arxiv.org/abs/2609.03871", "authors": ["Qingyang Shao", "Xin Zhang", "Zhouyang Yuan", "Xianying Chen", "Yujia Xiang", "Zihao Yang", "Tong Ye", "Yangqi Zhang", "Jiakang Xu", "Xiaoqing Yan", "Xuan Luo", "Keyi Li", "Enci Fan", "Kai Kang", "Zhuohan Liu", "Xingyu Jin", "Chunran Teng", "Tao Li", "Xinyu Lv", "Minghui Wang", "Wenfeng Li", "Yidan Gao", "Siyu Liu", "Mingrui Luo", "Zhu Liang", "Guanren Qiao", "Zhiping Xu"], "brief": "Bioinfoysis \u662f\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u751f\u7269\u4fe1\u606f\u5b66\u4efb\u52a1\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u89c4\u5212\u3001\u5de5\u5177/\u4ee3\u7801\u6267\u884c\u3001\u8bc1\u636e\u6d41\u548c\u6301\u4e45\u5316\u5206\u6790\u4ea7\u7269\u7ed1\u5b9a\u5728\u4e00\u8d77\uff0c\u907f\u514d\u91cd\u89c4\u5212\u540e\u9519\u8bef\u590d\u7528\u8fc7\u671f\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 BixBench \u8fbe\u5230 82.4% \u7684\u5f53\u524d\u6700\u4f73\u51c6\u786e\u7387\uff0c\u5e76\u663e\u8457\u63d0\u5347\u591a\u4e2a\u5e95\u5c42\u5927\u6a21\u578b\u5728 LAB-Bench 2 \u95ee\u7b54\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03871", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u751f\u7269\u4fe1\u606f\u5b66", "\u5de5\u5177\u4f7f\u7528", "\u4ee3\u7801\u6267\u884c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03871v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Bioinfoysis Technical Report", "tldr": "Bioinfoysis \u662f\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u751f\u7269\u4fe1\u606f\u5b66\u4efb\u52a1\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u89c4\u5212\u3001\u5de5\u5177/\u4ee3\u7801\u6267\u884c\u3001\u8bc1\u636e\u6d41\u548c\u6301\u4e45\u5316\u5206\u6790\u4ea7\u7269\u7ed1\u5b9a\u5728\u4e00\u8d77\uff0c\u907f\u514d\u91cd\u89c4\u5212\u540e\u9519\u8bef\u590d\u7528\u8fc7\u671f\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728 BixBench \u8fbe\u5230 82.4% \u7684\u5f53\u524d\u6700\u4f73\u51c6\u786e\u7387\uff0c\u5e76\u663e\u8457\u63d0\u5347\u591a\u4e2a\u5e95\u5c42\u5927\u6a21\u578b\u5728 LAB-Bench 2 \u95ee\u7b54\u4efb\u52a1\u4e0a\u7684\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retail supply chain operations rely on coupled decision modules that must adapt as requirements evolve. LLMs offer a natural-language interface for this task, but existing methods primarily focus on individual optimization models. Extending them to heterogeneous decision pipelines is challenging because a requirement may admit multiple intervention paths with different downstream effects. We formulate requirement-driven adaptation as the joint selection of an intervention route and an admissible module-level change, and propose a graph-constrained agentic framework in which domain agents expose admissible reformulation interfaces and a central processor searches over bounded intervention paths. Candidates are validated and compared using downstream KPIs. In collaboration with a large retail partner, we evaluate 100 warehouse requirements elicited from practitioner interviews, with GPT, Qwen, and DeepSeek as base LLMs. Relative to direct LLM reformulation, our framework improves correctness and end-to-end success across all three models, raising end-to-end success from 72--76% to 79--83%.", "arxiv_id": "2609.03860", "arxiv_url": "https://arxiv.org/abs/2609.03860", "authors": ["Lei Zheng", "Liping Yang", "Zihao Li", "Guodong Lyu", "Chaik Ming Koh", "Chung-Piaw Teo"], "brief": "\u8bba\u6587\u5c06\u96f6\u552e\u4f9b\u5e94\u94fe\u4e2d\u4e0d\u65ad\u53d8\u5316\u7684\u4e1a\u52a1\u9700\u6c42\u9002\u914d\uff0c\u5efa\u6a21\u4e3a\u201c\u5e72\u9884\u8def\u5f84\u9009\u62e9 + \u6a21\u5757\u7ea7\u6539\u5199\u201d\u7684\u8054\u5408\u95ee\u9898\u3002\u63d0\u51fa\u56fe\u7ea6\u675f\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7531\u9886\u57df\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u6539\u5199\u63a5\u53e3\u3001\u4e2d\u592e\u5904\u7406\u5668\u641c\u7d22\u5e72\u9884\u8def\u5f84\uff0c\u5e76\u7528\u4e0b\u6e38 KPI \u9a8c\u8bc1\uff1b\u5728100\u4e2a\u771f\u5b9e\u4ed3\u50a8\u9700\u6c42\u4e0a\uff0c\u76f8\u6bd4\u76f4\u63a5\u7528 LLM \u6539\u5199\uff0c\u5c06\u7aef\u5230\u7aef\u6210\u529f\u7387\u4ece72\u201376%\u63d0\u5347\u523079\u201383%\u3002", "categories": ["cs.AI", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03860", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4f9b\u5e94\u94fe\u4f18\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u51b3\u7b56\u6d41\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03860v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Adapting to Evolving Requirements: Agentic AI for Retail Supply Chain Operations", "tldr": "\u8bba\u6587\u5c06\u96f6\u552e\u4f9b\u5e94\u94fe\u4e2d\u4e0d\u65ad\u53d8\u5316\u7684\u4e1a\u52a1\u9700\u6c42\u9002\u914d\uff0c\u5efa\u6a21\u4e3a\u201c\u5e72\u9884\u8def\u5f84\u9009\u62e9 + \u6a21\u5757\u7ea7\u6539\u5199\u201d\u7684\u8054\u5408\u95ee\u9898\u3002\u63d0\u51fa\u56fe\u7ea6\u675f\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7531\u9886\u57df\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u6539\u5199\u63a5\u53e3\u3001\u4e2d\u592e\u5904\u7406\u5668\u641c\u7d22\u5e72\u9884\u8def\u5f84\uff0c\u5e76\u7528\u4e0b\u6e38 KPI \u9a8c\u8bc1\uff1b\u5728100\u4e2a\u771f\u5b9e\u4ed3\u50a8\u9700\u6c42\u4e0a\uff0c\u76f8\u6bd4\u76f4\u63a5\u7528 LLM \u6539\u5199\uff0c\u5c06\u7aef\u5230\u7aef\u6210\u529f\u7387\u4ece72\u201376%\u63d0\u5347\u523079\u201383%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Knowledge graphs describe reality in crisp assertions, while the systems now consuming them, foundation models and autonomous agents, reason natively in probabilities. We argue that this mismatch is why the integration of language models and knowledge graphs remains a data-feeding pipeline rather than a unified reasoning architecture. We envision Semantic Bayesian World Models (SBWMs): a Web that describes the world not as a database of facts but as a shared, evolving fabric of beliefs over knowledge graphs, where ontological axioms constrain priors, observations update beliefs by Bayesian conditioning, and actions intervene upon the world. We work through what an agent gains from such a model: a home-security agent deciding whether the figure at the gate is a courier or a burglar, an actuarial estimate aggregated by entailment rather than by string frequency, a planning task that language models reliably fail, and the estimation of quantities that no document has ever stated. We then set out what the community must build to make them possible: belief annotation over RDF~1.2, probabilistic entailment regimes, semantic calibration layers, and protocols by which agents that have never met can exchange, and disagree over, calibrated beliefs.", "arxiv_id": "2609.03834", "arxiv_url": "https://arxiv.org/abs/2609.03834", "authors": ["Tommaso Soru"], "brief": "\u8bba\u6587\u63d0\u51fa\u8bed\u4e49\u8d1d\u53f6\u65af\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u77e5\u8bc6\u56fe\u8c31\u4ece\u786e\u5b9a\u6027\u4e8b\u5b9e\u5e93\u6269\u5c55\u4e3a\u53ef\u5171\u4eab\u3001\u53ef\u6f14\u5316\u7684\u6982\u7387\u4fe1\u5ff5\u7f51\u7edc\u3002\u8be5\u6846\u67b6\u7528\u672c\u4f53\u7ea6\u675f\u5148\u9a8c\u3001\u7528\u89c2\u6d4b\u8fdb\u884c\u8d1d\u53f6\u65af\u66f4\u65b0\u3001\u7528\u884c\u52a8\u8868\u793a\u5e72\u9884\uff0c\u65e8\u5728\u8ba9\u8bed\u8a00\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u83b7\u5f97\u66f4\u7edf\u4e00\u7684\u63a8\u7406\u548c\u89c4\u5212\u80fd\u529b\u3002\u6587\u7ae0\u4e3b\u8981\u662f\u613f\u666f\u4e0e\u8def\u7ebf\u56fe\uff0c\u5217\u51fa\u4e86 RDF \u4fe1\u5ff5\u6807\u6ce8\u3001\u6982\u7387\u8574\u542b\u3001\u8bed\u4e49\u6821\u51c6\u548c\u667a\u80fd\u4f53\u95f4\u4fe1\u5ff5\u4ea4\u6362\u534f\u8bae\u7b49\u5173\u952e\u57fa\u7840\u8bbe\u65bd\u3002", "categories": ["cs.AI", "cs.DB", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03834", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u8d1d\u53f6\u65af\u63a8\u7406", "\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03834v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Semantic Bayesian World Models", "tldr": "\u8bba\u6587\u63d0\u51fa\u8bed\u4e49\u8d1d\u53f6\u65af\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u77e5\u8bc6\u56fe\u8c31\u4ece\u786e\u5b9a\u6027\u4e8b\u5b9e\u5e93\u6269\u5c55\u4e3a\u53ef\u5171\u4eab\u3001\u53ef\u6f14\u5316\u7684\u6982\u7387\u4fe1\u5ff5\u7f51\u7edc\u3002\u8be5\u6846\u67b6\u7528\u672c\u4f53\u7ea6\u675f\u5148\u9a8c\u3001\u7528\u89c2\u6d4b\u8fdb\u884c\u8d1d\u53f6\u65af\u66f4\u65b0\u3001\u7528\u884c\u52a8\u8868\u793a\u5e72\u9884\uff0c\u65e8\u5728\u8ba9\u8bed\u8a00\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u83b7\u5f97\u66f4\u7edf\u4e00\u7684\u63a8\u7406\u548c\u89c4\u5212\u80fd\u529b\u3002\u6587\u7ae0\u4e3b\u8981\u662f\u613f\u666f\u4e0e\u8def\u7ebf\u56fe\uff0c\u5217\u51fa\u4e86 RDF \u4fe1\u5ff5\u6807\u6ce8\u3001\u6982\u7387\u8574\u542b\u3001\u8bed\u4e49\u6821\u51c6\u548c\u667a\u80fd\u4f53\u95f4\u4fe1\u5ff5\u4ea4\u6362\u534f\u8bae\u7b49\u5173\u952e\u57fa\u7840\u8bbe\u65bd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents increasingly gather evidence, invoke tools, apply constraints, and produce decisions that people or software may commit to action. A final output alone cannot show which evidence, tool state, rule, authorization, or action path produced it. We present DNative-Twin, a graph-native digital twin that records a committed agentic decision as a typed trajectory and re-executes its decision mechanism under declared conditions. The graph links the state observed by the agent, the path it followed, and the authority behind the resulting action. The twin synchronizes this information, replays the mechanism in isolation, and compares it under controlled changes. We instantiate the framework in enterprise decision processes using three public process logs and controlled replay suites. The experiments identify a specific failure: graph structure localizes represented changes but cannot determine the consequence of an unobserved tool state. In a three-condition controlled experiment with 300 injected instances, unresolved-divergence recall increased from 0 to 0.667 when replay-contract state was added and to 1.0 when verification results were also available; the held-out set contained no critical-class instance. Across 500--5,000 BPI 2020 cases, median end-to-end time increased from 0.794 to 8.889 seconds on the reported platform. These results separate the roles of graph structure, replay context, and verification evidence in reviewing a decision mechanism.", "arxiv_id": "2609.03787", "arxiv_url": "https://arxiv.org/abs/2609.03787", "authors": ["Junjie Pang", "Zhenzhen Xie", "Haoke Han", "Ying He", "Jing Wang", "Gang Liu"], "brief": "\u8bba\u6587\u63d0\u51fa DNative-Twin\uff0c\u4e00\u79cd\u56fe\u539f\u751f\u6570\u5b57\u5b6a\u751f\u6846\u67b6\uff0c\u7528\u7c7b\u578b\u5316\u8f68\u8ff9\u8bb0\u5f55\u667a\u80fd\u4f53\u51b3\u7b56\u4e2d\u7684\u8bc1\u636e\u3001\u5de5\u5177\u72b6\u6001\u3001\u89c4\u5219\u6388\u6743\u4e0e\u884c\u52a8\u8def\u5f84\uff0c\u5e76\u5728\u58f0\u660e\u6761\u4ef6\u4e0b\u9694\u79bb\u91cd\u653e\u51b3\u7b56\u673a\u5236\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u4ec5\u6709\u56fe\u7ed3\u6784\u53ef\u5b9a\u4f4d\u53d8\u66f4\u4f46\u65e0\u6cd5\u5224\u65ad\u672a\u89c2\u6d4b\u5de5\u5177\u72b6\u6001\u7684\u5f71\u54cd\uff1b\u52a0\u5165\u91cd\u653e\u5951\u7ea6\u72b6\u6001\u4e0e\u9a8c\u8bc1\u7ed3\u679c\u540e\uff0c\u672a\u89e3\u51b3\u5206\u6b67\u53ec\u56de\u7387\u4ece 0 \u63d0\u5347\u5230 0.667 \u548c 1.0\uff0c\u4f46\u5e26\u6765\u4e00\u5b9a\u8fd0\u884c\u5f00\u9500\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03787", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b57\u5b6a\u751f", "\u51b3\u7b56\u53ef\u8ffd\u6eaf", "\u56fe\u7ed3\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03787v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DNative-Twin: Decision Graphs and Digital Twins for Reconstructable Agentic Decisions", "tldr": "\u8bba\u6587\u63d0\u51fa DNative-Twin\uff0c\u4e00\u79cd\u56fe\u539f\u751f\u6570\u5b57\u5b6a\u751f\u6846\u67b6\uff0c\u7528\u7c7b\u578b\u5316\u8f68\u8ff9\u8bb0\u5f55\u667a\u80fd\u4f53\u51b3\u7b56\u4e2d\u7684\u8bc1\u636e\u3001\u5de5\u5177\u72b6\u6001\u3001\u89c4\u5219\u6388\u6743\u4e0e\u884c\u52a8\u8def\u5f84\uff0c\u5e76\u5728\u58f0\u660e\u6761\u4ef6\u4e0b\u9694\u79bb\u91cd\u653e\u51b3\u7b56\u673a\u5236\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u4ec5\u6709\u56fe\u7ed3\u6784\u53ef\u5b9a\u4f4d\u53d8\u66f4\u4f46\u65e0\u6cd5\u5224\u65ad\u672a\u89c2\u6d4b\u5de5\u5177\u72b6\u6001\u7684\u5f71\u54cd\uff1b\u52a0\u5165\u91cd\u653e\u5951\u7ea6\u72b6\u6001\u4e0e\u9a8c\u8bc1\u7ed3\u679c\u540e\uff0c\u672a\u89e3\u51b3\u5206\u6b67\u53ec\u56de\u7387\u4ece 0 \u63d0\u5347\u5230 0.667 \u548c 1.0\uff0c\u4f46\u5e26\u6765\u4e00\u5b9a\u8fd0\u884c\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Making science computable requires representations of both scientific knowledge and the physical world in which scientific claims are tested. A computable representation of the physical laboratory is established through typed research objects, capability-bound operations and a compositional workflow algebra. It provides the physical-world counterpart to machine-readable knowledge, expressing workflows as programs over evolving laboratory states with explicit dependencies, decisions, iteration and concurrency. The representation was implemented in a modular agentic robotic laboratory by binding formal operations to executable Function Skills. For diverse scientific intents, capability-relative workflows were generated, while stateful simulation propagated object transformations and verified operation preconditions and laboratory constraints before dispatch. The proposed representation and its engineering framework jointly establish a general computational interface between agent reasoning and capability-bound physical transformations, providing a foundation for end-to-end autonomous scientific discovery.", "arxiv_id": "2609.03621", "arxiv_url": "https://arxiv.org/abs/2609.03621", "authors": ["Xiaobo Li", "Luyao Ge", "Xiaohui Li", "Lulu Guo", "Ming Mao", "Jiwang Zheng", "Wenting Guan", "Xin Yang", "Yi Luo", "Jun Jiang", "Linjiang Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u8ba1\u7b97\u7684\u7269\u7406\u5b9e\u9a8c\u5ba4\u8868\u793a\uff0c\u7528\u7c7b\u578b\u5316\u7814\u7a76\u5bf9\u8c61\u3001\u80fd\u529b\u7ed1\u5b9a\u64cd\u4f5c\u548c\u7ec4\u5408\u5f0f\u5de5\u4f5c\u6d41\u4ee3\u6570\u6765\u63cf\u8ff0\u5b9e\u9a8c\u6d41\u7a0b\u3002\u8be5\u6846\u67b6\u5728\u6a21\u5757\u5316\u667a\u80fd\u4f53\u673a\u5668\u4eba\u5b9e\u9a8c\u5ba4\u4e2d\u5b9e\u73b0\uff0c\u53ef\u751f\u6210\u9762\u5411\u4e0d\u540c\u79d1\u7814\u610f\u56fe\u7684\u5de5\u4f5c\u6d41\uff0c\u5e76\u5728\u6267\u884c\u524d\u901a\u8fc7\u6709\u72b6\u6001\u4eff\u771f\u9a8c\u8bc1\u524d\u63d0\u6761\u4ef6\u4e0e\u5b9e\u9a8c\u5ba4\u7ea6\u675f\uff0c\u4e3a\u7aef\u5230\u7aef\u81ea\u4e3b\u79d1\u5b66\u53d1\u73b0\u63d0\u4f9b\u63a5\u53e3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03621", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u5b9e\u9a8c\u5ba4", "\u79d1\u5b66\u53d1\u73b0", "\u5de5\u4f5c\u6d41"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03621v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A computable representation of the physical laboratory enables verifiable workflows", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u53ef\u8ba1\u7b97\u7684\u7269\u7406\u5b9e\u9a8c\u5ba4\u8868\u793a\uff0c\u7528\u7c7b\u578b\u5316\u7814\u7a76\u5bf9\u8c61\u3001\u80fd\u529b\u7ed1\u5b9a\u64cd\u4f5c\u548c\u7ec4\u5408\u5f0f\u5de5\u4f5c\u6d41\u4ee3\u6570\u6765\u63cf\u8ff0\u5b9e\u9a8c\u6d41\u7a0b\u3002\u8be5\u6846\u67b6\u5728\u6a21\u5757\u5316\u667a\u80fd\u4f53\u673a\u5668\u4eba\u5b9e\u9a8c\u5ba4\u4e2d\u5b9e\u73b0\uff0c\u53ef\u751f\u6210\u9762\u5411\u4e0d\u540c\u79d1\u7814\u610f\u56fe\u7684\u5de5\u4f5c\u6d41\uff0c\u5e76\u5728\u6267\u884c\u524d\u901a\u8fc7\u6709\u72b6\u6001\u4eff\u771f\u9a8c\u8bc1\u524d\u63d0\u6761\u4ef6\u4e0e\u5b9e\u9a8c\u5ba4\u7ea6\u675f\uff0c\u4e3a\u7aef\u5230\u7aef\u81ea\u4e3b\u79d1\u5b66\u53d1\u73b0\u63d0\u4f9b\u63a5\u53e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As LLMs increasingly act through tools, they must reconcile user instructions, parametric knowledge, and dynamic environmental observations before taking actions. We introduce KC-Bench, a controlled multi-turn benchmark for measuring this capability across world-knowledge conflicts, input inconsistencies, and multi-source temporal conflicts. Its 238 tasks are manually screened from more than 1,000 generated candidates and combine a user simulator, stateful tools, deterministic environment assertions, an open-source natural-language evaluator, and human trajectory verification. Evaluation of nine models, including DeepSeek-V4-Flash, GLM-5.2, and MiniMax-M3, shows substantial cross-domain variation: no model handles factual correction, identity consistency checking, and temporal conflict resolution reliably across all settings. In the simulated environments, missed conflicts can propagate to tool calls or synthetic protected-data flows. KC-Bench isolates this model-level behavior rather than ranking complete agent frameworks, and provides a reproducible diagnostic for developing conflict-aware reasoning and execution safeguards.", "arxiv_id": "2609.03588", "arxiv_url": "https://arxiv.org/abs/2609.03588", "authors": ["Yaxing Lyu", "Shengjie Zhou", "Binbin Toh", "Pengyu Zhu", "Lijun Li"], "brief": "\u672c\u6587\u63d0\u51fa KC-Bench\uff0c\u4e00\u4e2a\u52a8\u6001\u591a\u8f6e\u4ea4\u4e92\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u5728\u7528\u6237\u6307\u4ee4\u3001\u53c2\u6570\u77e5\u8bc6\u4e0e\u73af\u5883\u89c2\u6d4b\u51b2\u7a81\u65f6\u7684\u8bc6\u522b\u4e0e\u5904\u7406\u80fd\u529b\u3002\u5bf9 9 \u4e2a\u6a21\u578b\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u5404\u6a21\u578b\u5728\u4e8b\u5b9e\u7ea0\u9519\u3001\u8eab\u4efd\u4e00\u81f4\u6027\u68c0\u67e5\u548c\u65f6\u95f4\u51b2\u7a81\u89e3\u51b3\u4e0a\u8868\u73b0\u4e0d\u7a33\u5b9a\uff0c\u6f0f\u68c0\u51b2\u7a81\u8fd8\u53ef\u80fd\u5f71\u54cd\u5de5\u5177\u8c03\u7528\u548c\u53d7\u4fdd\u62a4\u6570\u636e\u6d41\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03588", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6", "\u77e5\u8bc6\u51b2\u7a81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03588v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "KC-Bench: A Dynamic Interactive Benchmark for Evaluating Knowledge Conflicts in LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa KC-Bench\uff0c\u4e00\u4e2a\u52a8\u6001\u591a\u8f6e\u4ea4\u4e92\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u667a\u80fd\u4f53\u5728\u7528\u6237\u6307\u4ee4\u3001\u53c2\u6570\u77e5\u8bc6\u4e0e\u73af\u5883\u89c2\u6d4b\u51b2\u7a81\u65f6\u7684\u8bc6\u522b\u4e0e\u5904\u7406\u80fd\u529b\u3002\u5bf9 9 \u4e2a\u6a21\u578b\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u5404\u6a21\u578b\u5728\u4e8b\u5b9e\u7ea0\u9519\u3001\u8eab\u4efd\u4e00\u81f4\u6027\u68c0\u67e5\u548c\u65f6\u95f4\u51b2\u7a81\u89e3\u51b3\u4e0a\u8868\u73b0\u4e0d\u7a33\u5b9a\uff0c\u6f0f\u68c0\u51b2\u7a81\u8fd8\u53ef\u80fd\u5f71\u54cd\u5de5\u5177\u8c03\u7528\u548c\u53d7\u4fdd\u62a4\u6570\u636e\u6d41\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern vision-language models (VLMs) can directly answer many image-grounded questions, yet they often struggle with complex queries requiring fine-grained visual details or external knowledge. To acquire this missing evidence, agentic VLMs invoke tools such as image cropping, image search, and text search. However, existing training paradigms primarily evaluate tool-use based on final answer correctness, leaving evidence acquisition and utilization insufficiently supervised. This leads to two critical shortcomings: (i) models frequently issue redundant or off-target tool calls that fail to gather necessary evidence, and (ii) even when appropriate tools are called, models often fail to extract the necessary information from the resulting observations. To address these limitations, we introduce the NTEP (Necessary Tool-Evidence Path), a novel annotation scheme that explicitly specifies the essential external evidence and corresponding tool calls for each query. Building upon this, we propose NTEP-R (NTEP Reward), a supervision mechanism ensuring that each tool invocation strictly advances the reasoning process toward the final solution. Specifically, our approach rewards the agent for aligning its pre-call intent with a necessary evidence-seeking goal, and for ensuring the information summarized from the post-call observation aligns with the necessary evidence. Furthermore, we introduce a non-repeated-goal regularizer to penalize redundant calls that revisit satisfied NTEP goals. Extensive evaluations on seven image-grounded benchmarks demonstrate that our 8B-parameter instantiation, NTEP-8B, significantly improves both search-oriented accuracy and tool-use efficiency within a unified three-tool framework. These results highlight the critical value of fine-grained tool-evidence path supervision for training robust agentic VLMs.", "arxiv_id": "2609.03493", "arxiv_url": "https://arxiv.org/abs/2609.03493", "authors": ["Xingming Long", "Yu Liu", "Zhiwei Yang", "Hanqi Feng", "Shaojie Zhang", "Barnabas Poczos", "Chao Jiang", "Zhenbo Luo", "Lei Jiang", "Pei Fu"], "brief": "\u672c\u6587\u63d0\u51fa NTEP \u6807\u6ce8\u4e0e NTEP-R \u5956\u52b1\u673a\u5236\uff0c\u4e3a\u667a\u80fd\u4f53\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u660e\u786e\u76d1\u7763\u6bcf\u6b21\u5de5\u5177\u8c03\u7528\u6240\u9700\u83b7\u53d6\u7684\u5173\u952e\u8bc1\u636e\u53ca\u5176\u4f7f\u7528\u65b9\u5f0f\u3002\u65b9\u6cd5\u901a\u8fc7\u5956\u52b1\u6b63\u786e\u7684\u8c03\u7528\u610f\u56fe\u3001\u8bc1\u636e\u63d0\u53d6\uff0c\u5e76\u60e9\u7f5a\u91cd\u590d\u76ee\u6807\uff0c\u5728\u4e03\u4e2a\u56fe\u50cf\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u641c\u7d22\u7c7b\u51c6\u786e\u7387\u548c\u5de5\u5177\u4f7f\u7528\u6548\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.03493", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5de5\u5177\u4f7f\u7528", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.03493v1", "published_at": "2026-09-03", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Making Every Tool Call Count: Necessary Tool-Evidence Path Rewards for Agentic Vision-Language Models", "tldr": "\u672c\u6587\u63d0\u51fa NTEP \u6807\u6ce8\u4e0e NTEP-R \u5956\u52b1\u673a\u5236\uff0c\u4e3a\u667a\u80fd\u4f53\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u660e\u786e\u76d1\u7763\u6bcf\u6b21\u5de5\u5177\u8c03\u7528\u6240\u9700\u83b7\u53d6\u7684\u5173\u952e\u8bc1\u636e\u53ca\u5176\u4f7f\u7528\u65b9\u5f0f\u3002\u65b9\u6cd5\u901a\u8fc7\u5956\u52b1\u6b63\u786e\u7684\u8c03\u7528\u610f\u56fe\u3001\u8bc1\u636e\u63d0\u53d6\uff0c\u5e76\u60e9\u7f5a\u91cd\u590d\u76ee\u6807\uff0c\u5728\u4e03\u4e2a\u56fe\u50cf\u95ee\u7b54\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86\u641c\u7d22\u7c7b\u51c6\u786e\u7387\u548c\u5de5\u5177\u4f7f\u7528\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Graphical user interface (GUI) agents are increasingly used to execute natural-language instructions on user interfaces, yet real users may issue infeasible instructions due to benign mistakes. A reliable agent should not only know how to act, but also when not to act. In this work, we introduce CONFLICTGUI, a benchmark covering instruction-internal conflicts and instruction-GUI context conflicts to study conflict-aware termination. Our evaluation reveals severe execution-biased overcompliance: agents that perform well on feasible tasks often continue to execute blindly under conflicting instructions. To mitigate this behavior, we propose CONFLICTGUARD, an inference-time framework that aligns an agent\u0027s feasibility awareness with its action generation. CONFLICTGUARD contains two coupled components: a feasibility verification protocol that guides the agent to assess instruction logic and GUI-side evidence before acting, and a conditional action modulation mechanism that steers agents from over-compliant execution into termination-oriented behavior. Experiments across five widely-used agents demonstrate that CONFLICTGUARD improves average conflict task success rate significantly, while preserving normal GUI-task performance. These r
