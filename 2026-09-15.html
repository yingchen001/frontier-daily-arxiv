528.3\uff0c\u5177\u8eab\u7ea6\u675f\u4e0b\u8def\u5f84\u6210\u529f\u7387\u663e\u8457\u4e0b\u964d", "\u7528\u8bad\u7ec3\u96c6\u5fae\u8c03Qwen 3.5 4B\u540e\uff0cEgoPath Score\u4ece3.9\u63d0\u5347\u523038.9\uff0c\u5e76\u5728\u5916\u90e8\u7a7a\u95f4\u57fa\u51c6\u4e0a\u63d0\u53471.4\u52309.6\u5206"], "keywords": ["\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd", "\u7a7a\u95f4\u667a\u80fd", "\u5bfc\u822a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16610v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EgoPathBench: Evaluating Zero-Shot Egocentric Waypoint Decision-Making in Vision-Language Models", "tldr": "\u8bc4\u6d4bVLM\u96f6\u6837\u672c\u7b2c\u4e00\u89c6\u89d2\u8def\u5f84\u51b3\u7b56\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EgoPathBench\uff0c\u4e00\u4e2a\u9762\u5411\u7b2c\u4e00\u89c6\u89d2\u822a\u70b9\u51b3\u7b56\u7684\u4e94\u4efb\u52a1\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30VLM\u4ece\u56fe\u50cf\u3001\u76ee\u6807\u63cf\u8ff0\u548c\u53ef\u89c1\u822a\u70b9\u4e2d\u9009\u62e9\u53ef\u901a\u884c\u5019\u9009\u6216\u89c4\u5212\u6709\u5e8f\u8def\u7ebf\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6\u53ef\u884c\u6027\u3001\u76f8\u90bb\u8fb9\u5408\u6cd5\u6027\u548c\u76ee\u6807\u5230\u8fbe\u7b49\u6307\u6807\uff0c\u5e76\u63d0\u4f9b\u8bad\u7ec3\u8d44\u6e90\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u7a7a\u95f4\u5173\u7cfb\u5224\u65ad\u63a8\u8fdb\u5230\u5b8c\u6574\u7684\u7b2c\u4e00\u89c6\u89d2\u5bfc\u822a\u51b3\u7b56\u8bc4\u4f30\uff0c\u63ed\u793a\u5f53\u524dVLM\u5728\u76ee\u6807\u4e00\u81f4\u8def\u5f84\u89c4\u5212\u548c\u5177\u8eab\u51e0\u4f55\u7ea6\u675f\u7406\u89e3\u4e0a\u7684\u660e\u663e\u77ed\u677f\uff0c\u540c\u65f6\u63d0\u4f9b\u53ef\u7528\u4e8e\u63d0\u5347\u7a7a\u95f4\u667a\u80fd\u7684\u8bad\u7ec3\u6570\u636e\u3002"}, {"abstract": "Multimodal large language models (MLLMs) have made strong progress on visual question answering and image captioning, yet they still produce fluent claims about objects, attributes, or relations that are not grounded in the image. Many remedies either modify decoding at test time, which adds latency, or fine tune with preferences such as DPO variants, which teach which answer is preferred but not when the model\u0027s own answer is unreliable. We argue that calibrated self assessment is the missing signal. We introduce Savor, a training framework that (i) augments the output schema with token and answer confidence, (ii) optimises the policy with a Group Relative Policy Optimisation (GRPO) objective that penalises calibration error and poor abstention decisions, and (iii) uses the learned confidence at inference time to revisit visual evidence only when the model is uncertain. Experiments on POPE, HallusionBench, AMBER and MMHal-Bench across two recent backbones (InternVL3-8B and Qwen3-VL-8B) show that Savor reduces hallucination while preserving general capability on MME and MMBench, with lower Expected Calibration Error than DPO and decoding baselines.", "arxiv_id": "2609.16601", "arxiv_url": "https://arxiv.org/abs/2609.16601", "authors": ["Zixiu Ding", "Zilin Zhao", "Yingjie He", "Xinlang Kang", "Guansu Wang", "Wei Zhang"], "brief": "SAVOR \u662f\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u8bad\u7ec3\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5728\u56de\u7b54\u89c6\u89c9\u95ee\u9898\u65f6\u540c\u65f6\u8f93\u51fa token \u4e0e\u7b54\u6848\u7ea7\u7f6e\u4fe1\u5ea6\uff0c\u5e76\u5b66\u4e60\u4f55\u65f6\u5e94\u81ea\u6211\u6000\u7591\u6216\u56de\u770b\u56fe\u50cf\u8bc1\u636e\u3002\u5b83\u901a\u8fc7 GRPO \u5f3a\u5316\u5b66\u4e60\u76ee\u6807\u60e9\u7f5a\u6821\u51c6\u8bef\u5dee\u548c\u9519\u8bef\u62d2\u7b54\uff0c\u4ece\u800c\u7f13\u89e3\u89c6\u89c9 grounding \u4e0d\u8db3\u5bfc\u81f4\u7684\u5e7b\u89c9\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16601", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u8f93\u51fa\u683c\u5f0f\u4e2d\u52a0\u5165 token \u7ea7\u4e0e\u7b54\u6848\u7ea7\u7f6e\u4fe1\u5ea6\uff0c\u4f7f\u6a21\u578b\u5177\u5907\u663e\u5f0f\u81ea\u6211\u8bc4\u4f30\u80fd\u529b\u3002", "\u91c7\u7528 Group Relative Policy Optimisation\uff0c\u8054\u5408\u4f18\u5316\u56de\u7b54\u8d28\u91cf\u3001\u7f6e\u4fe1\u5ea6\u6821\u51c6\u548c\u62d2\u7b54\u51b3\u7b56\u3002", "\u5728 POPE\u3001HallusionBench\u3001AMBER\u3001MMHal-Bench \u4e0a\u51cf\u5c11\u5e7b\u89c9\uff0c\u540c\u65f6\u5728 MME\u3001MMBench \u4e0a\u4fdd\u6301\u901a\u7528\u80fd\u529b\uff0c\u5e76\u4f18\u4e8e DPO \u4e0e\u89e3\u7801\u57fa\u7ebf\u7684\u6821\u51c6\u8bef\u5dee\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u7f13\u89e3", "\u5f3a\u5316\u5b66\u4e60", "\u7f6e\u4fe1\u5ea6\u6821\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16601v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SAVOR: Self-Aware Visual Grounding via Confidence-Calibrated Reinforcement Learning for Multimodal Hallucination Mitigation", "tldr": "\u7528\u7f6e\u4fe1\u5ea6\u6821\u51c6\u5f3a\u5316\u5b66\u4e60\u51cf\u5c11\u591a\u6a21\u6001\u5e7b\u89c9", "upvotes": 0, "what_it_is": "SAVOR \u662f\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u8bad\u7ec3\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5728\u56de\u7b54\u89c6\u89c9\u95ee\u9898\u65f6\u540c\u65f6\u8f93\u51fa token \u4e0e\u7b54\u6848\u7ea7\u7f6e\u4fe1\u5ea6\uff0c\u5e76\u5b66\u4e60\u4f55\u65f6\u5e94\u81ea\u6211\u6000\u7591\u6216\u56de\u770b\u56fe\u50cf\u8bc1\u636e\u3002\u5b83\u901a\u8fc7 GRPO \u5f3a\u5316\u5b66\u4e60\u76ee\u6807\u60e9\u7f5a\u6821\u51c6\u8bef\u5dee\u548c\u9519\u8bef\u62d2\u7b54\uff0c\u4ece\u800c\u7f13\u89e3\u89c6\u89c9 grounding \u4e0d\u8db3\u5bfc\u81f4\u7684\u5e7b\u89c9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u201c\u77e5\u9053\u81ea\u5df1\u4f55\u65f6\u4e0d\u53ef\u9760\u201d\u4f5c\u4e3a\u51cf\u5c11\u591a\u6a21\u6001\u5e7b\u89c9\u7684\u6838\u5fc3\u4fe1\u53f7\uff0c\u76f8\u6bd4\u4ec5\u9760\u6d4b\u8bd5\u65f6\u89e3\u7801\u6216\u504f\u597d\u5fae\u8c03\uff0c\u66f4\u76f4\u63a5\u63d0\u5347\u6a21\u578b\u7f6e\u4fe1\u5ea6\u6821\u51c6\u4e0e\u89c6\u89c9\u8bc1\u636e\u5bf9\u9f50\uff0c\u5177\u6709\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "Interactive control for video generation is moving from coarse prompts toward fine-grained, physically meaningful manipulation of dynamic scenes. Yet existing controllable methods either require the full control schedule before generation starts, or use pixel-space signals that dictate object positions rather than physical dynamics. To address these limitations, we propose PhysStream, an autoregressive model for physics-grounded image-to-video synthesis that incorporates structured scene memory---positional maps and object tracking maps derived online from previously generated frames---and supports fine-grained motion control via sparse velocity-increment signals that encode physical quantities, letting the model learn the underlying dynamics. We train our model in two stages: a bidirectional model is first finetuned with motion-control conditioning, then a causal autoregressive model is trained with additional structured scene memory, further improving physical consistency. PhysStream enables interactive, mid-generation control over multi-object tabletop rigid-body scenes---a capability not supported by prior methods---reducing motion distribution distance (FVMD) by 33% and trajectory error by 12% over the strongest baselines on synthetic benchmarks, and is preferred by human evaluators in over 85% of in-the-wild comparisons. Please check our website for more details: https://czzzzh.github.io/PhysStream", "arxiv_id": "2609.17521", "arxiv_url": "https://arxiv.org/abs/2609.17521", "authors": ["Chuhao Chen", "Peter Wonka", "Chaoyang Wang", "Chen Wang", "Qiao Feng", "Sergey Tulyakov", "Lingjie Liu"], "brief": "PhysStream \u662f\u4e00\u4e2a\u9762\u5411\u7269\u7406\u7ea6\u675f\u56fe\u50cf\u5230\u89c6\u9891\u751f\u6210\u7684\u81ea\u56de\u5f52\u6a21\u578b\uff0c\u80fd\u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u8fdb\u884c\u4ea4\u4e92\u5f0f\u3001\u591a\u7269\u4f53\u8fd0\u52a8\u63a7\u5236\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u5316\u573a\u666f\u8bb0\u5fc6\u548c\u7a00\u758f\u901f\u5ea6\u589e\u91cf\u4fe1\u53f7\uff0c\u8ba9\u6a21\u578b\u5b66\u4e60\u5e76\u9075\u5faa\u66f4\u771f\u5b9e\u7684\u521a\u4f53\u52a8\u529b\u5b66\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17521", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u5728\u7ebf\u751f\u6210\u7684\u7ed3\u6784\u5316\u573a\u666f\u8bb0\u5fc6\uff0c\u5305\u62ec\u4f4d\u7f6e\u56fe\u548c\u7269\u4f53\u8ddf\u8e2a\u56fe\uff0c\u7528\u4e8e\u63d0\u5347\u957f\u7a0b\u4e00\u81f4\u6027\u4e0e\u7269\u7406\u8fde\u8d2f\u6027\u3002", "\u4f7f\u7528\u7a00\u758f\u901f\u5ea6\u589e\u91cf\u4f5c\u4e3a\u7ec6\u7c92\u5ea6\u63a7\u5236\u4fe1\u53f7\uff0c\u63a7\u5236\u7684\u662f\u7269\u7406\u91cf\u800c\u975e\u50cf\u7d20\u4f4d\u7f6e\uff0c\u652f\u6301\u751f\u6210\u4e2d\u9014\u4fee\u6539\u8fd0\u52a8\u3002", "\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u5148\u5fae\u8c03\u53cc\u5411\u8fd0\u52a8\u63a7\u5236\u6a21\u578b\uff0c\u518d\u8bad\u7ec3\u5e26\u7ed3\u6784\u5316\u8bb0\u5fc6\u7684\u56e0\u679c\u81ea\u56de\u5f52\u6a21\u578b\uff1b\u5728\u5408\u6210\u57fa\u51c6\u4e0a FVMD \u964d\u4f4e 33%\u3001\u8f68\u8ff9\u8bef\u5dee\u964d\u4f4e 12%\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u7269\u7406\u5efa\u6a21", "\u591a\u6a21\u6001", "\u8fd0\u52a8\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17521v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "PhysStream: Streaming Physics-Grounded Video Generation with Structured Scene Memory and Fine-Grained Motion Control", "tldr": "\u53ef\u4ea4\u4e92\u63a7\u5236\u7269\u7406\u8fd0\u52a8\u7684\u89c6\u9891\u751f\u6210\u6a21\u578b", "upvotes": 0, "what_it_is": "PhysStream \u662f\u4e00\u4e2a\u9762\u5411\u7269\u7406\u7ea6\u675f\u56fe\u50cf\u5230\u89c6\u9891\u751f\u6210\u7684\u81ea\u56de\u5f52\u6a21\u578b\uff0c\u80fd\u5728\u751f\u6210\u8fc7\u7a0b\u4e2d\u8fdb\u884c\u4ea4\u4e92\u5f0f\u3001\u591a\u7269\u4f53\u8fd0\u52a8\u63a7\u5236\u3002\u5b83\u901a\u8fc7\u7ed3\u6784\u5316\u573a\u666f\u8bb0\u5fc6\u548c\u7a00\u758f\u901f\u5ea6\u589e\u91cf\u4fe1\u53f7\uff0c\u8ba9\u6a21\u578b\u5b66\u4e60\u5e76\u9075\u5faa\u66f4\u771f\u5b9e\u7684\u521a\u4f53\u52a8\u529b\u5b66\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u53ef\u63a7\u89c6\u9891\u751f\u6210\u4ece\u9884\u8bbe\u5b8c\u6574\u8f68\u8ff9\u63a8\u8fdb\u5230\u53ef\u5b9e\u65f6\u4ea4\u4e92\u7684\u7269\u7406\u8fd0\u52a8\u63a7\u5236\uff0c\u5c24\u5176\u9002\u7528\u4e8e\u591a\u7269\u4f53\u684c\u9762\u521a\u4f53\u573a\u666f\uff0c\u4e3a\u6e38\u620f\u3001\u4eff\u771f\u3001\u673a\u5668\u4eba\u6570\u636e\u751f\u6210\u548c\u4ea4\u4e92\u5f0f\u5185\u5bb9\u521b\u4f5c\u63d0\u4f9b\u4e86\u66f4\u5b9e\u7528\u7684\u751f\u6210\u8303\u5f0f\u3002"}, {"abstract": "Large language models can produce fluent answers when their factual support is weak. This paper introduces Chain-of-Self-Questioning (CoSQ), a prompt-only framework that makes answer commitment conditional on an explicit assessment of the information required to answer a question. We evaluate three CoSQ variants under seventeen conditions on the 817-item TruthfulQA multiple-choice validation set using eleven open-weight and hosted model families. In the final balanced-option protocol, Grounded-CoSQ at \u03c4=0.90 reduces the mean unconditional wrong-commitment rate from 13.1% under chain-of-thought prompting to 8.9%, a 32.1% relative reduction, while increasing answered accuracy from 86.9% to 89.7% and answering 87.6% of questions. Both improvements hold for all eleven models and at every evaluated threshold. Critical-CoSQ and Adaptive-CoSQ provide neighboring operating points with 88.6% and 86.5% coverage, respectively, while remaining more reliable than the baseline. A secondary Natural Questions Short-Answer evaluation provides convergent open-form evidence. These findings show that self-assessment can support explicit, tunable answer-or-abstain decisions when an unsupported commitment is more costly than referral or review.", "arxiv_id": "2609.17516", "arxiv_url": "https://arxiv.org/abs/2609.17516", "authors": ["Ali \u015eenol"], "brief": "\u8bba\u6587\u63d0\u51fa Chain-of-Self-Questioning\uff08CoSQ\uff09\uff0c\u4e00\u79cd\u7eaf\u63d0\u793a\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5148\u663e\u5f0f\u8bc4\u4f30\u56de\u7b54\u95ee\u9898\u6240\u9700\u4fe1\u606f\u4e0e\u81ea\u8eab\u4f9d\u636e\uff0c\u518d\u51b3\u5b9a\u56de\u7b54\u6216 abstain\u3002\u4f5c\u8005\u5728 TruthfulQA \u548c Natural Questions \u4e0a\u9a8c\u8bc1\u5176\u80fd\u964d\u4f4e\u65e0\u4f9d\u636e\u9519\u8bef\u4f5c\u7b54\u98ce\u9669\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17516", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["CoSQ \u5305\u542b Grounded\u3001Critical\u3001Adaptive \u4e09\u79cd\u53d8\u4f53\uff0c\u53ef\u901a\u8fc7\u9608\u503c \u03c4 \u8c03\u8282\u8986\u76d6\u7387\u4e0e\u53ef\u9760\u6027\u6743\u8861\u3002", "\u5728 TruthfulQA 817\u9898\u300111\u4e2a\u6a21\u578b\u5bb6\u65cf\u300117\u79cd\u6761\u4ef6\u4e0b\uff0cGrounded-CoSQ \u5728 \u03c4=0.90 \u5c06\u9519\u8bef\u627f\u8bfa\u7387\u4ece CoT \u768413.1%\u964d\u81f38.9%\u3002", "\u540c\u65f6\u56de\u7b54\u51c6\u786e\u7387\u4ece86.9%\u5347\u81f389.7%\uff0c\u4ecd\u8986\u76d687.6%\u7684\u95ee\u9898\uff1b\u6240\u670911\u4e2a\u6a21\u578b\u548c\u5404\u9608\u503c\u4e0b\u5747\u4f18\u4e8e\u57fa\u7ebf\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u53ef\u4fe1AI", "\u63d0\u793a\u5de5\u7a0b", "\u9009\u62e9\u6027\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17516v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "When Should LLMs Abstain? Chain-of-Self-Questioning for Selective Risk Control", "tldr": "\u7528\u81ea\u6211\u63d0\u95ee\u8ba9LLM\u53ef\u63a7\u5730\u9009\u62e9\u62d2\u7b54\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Chain-of-Self-Questioning\uff08CoSQ\uff09\uff0c\u4e00\u79cd\u7eaf\u63d0\u793a\u6846\u67b6\uff0c\u8ba9\u6a21\u578b\u5148\u663e\u5f0f\u8bc4\u4f30\u56de\u7b54\u95ee\u9898\u6240\u9700\u4fe1\u606f\u4e0e\u81ea\u8eab\u4f9d\u636e\uff0c\u518d\u51b3\u5b9a\u56de\u7b54\u6216 abstain\u3002\u4f5c\u8005\u5728 TruthfulQA \u548c Natural Questions \u4e0a\u9a8c\u8bc1\u5176\u80fd\u964d\u4f4e\u65e0\u4f9d\u636e\u9519\u8bef\u4f5c\u7b54\u98ce\u9669\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u8bad\u7ec3\u6216\u5916\u90e8\u5de5\u5177\uff0c\u4ec5\u9760\u63d0\u793a\u5373\u53ef\u5b9e\u73b0\u53ef\u8c03\u7684\u9009\u62e9\u6027\u98ce\u9669\u63a7\u5236\uff0c\u9002\u7528\u4e8e\u4e8b\u5b9e\u6027\u95ee\u7b54\u3001\u5ba1\u6838\u8f6c\u4ea4\u7b49\u9519\u8bef\u56de\u7b54\u4ee3\u4ef7\u9ad8\u7684\u573a\u666f\u3002"}, {"abstract": "Action Chunking Transformers (ACT) are widely used to learn robot manipulation from demonstrations. Their conditional variational autoencoder includes an encoder meant to capture differences between demonstrations during training. The original ACT paper reported that encoder removal dropped the mean success rate from 35% to 2% on two simulated tasks with human demonstrations. We re-ran this ablation in the original code and checked whether the findings depend on the implementation or training data. The published drop does not reappear in our tests, although smaller gains or losses in success rate remain uncertain. To investigate the discrepancy, we varied training length and how checkpoints are selected for evaluation. Both can reverse which policy scores higher, but the published drop\u0027s cause remains unknown. Success rates alone leave open whether the encoder provides information that helps the policy reconstruct demonstrated actions. On the tested ACT benchmark, the sampled latent provides little reconstruction benefit at every tested nonzero weight of the penalty on latent information. At inference, ACT leaves this latent unused and sets it to zero. Skipping the encoder increases training throughput in both implementations we timed. We release code, evaluation tools and results so others can repeat the comparisons and test the encoder on other tasks.", "arxiv_id": "2609.16745", "arxiv_url": "https://arxiv.org/abs/2609.16745", "authors": ["Bo Kang"], "brief": "\u8fd9\u7bc7\u8bba\u6587\u91cd\u65b0\u8fd0\u884c\u5e76\u5ba1\u67e5\u4e86 Action Chunking Transformer\uff08ACT\uff09\u4e2d CVAE \u7f16\u7801\u5668\u79fb\u9664\u5b9e\u9a8c\u3002\u4f5c\u8005\u53d1\u73b0\u539f\u8bba\u6587\u62a5\u544a\u7684\u6210\u529f\u7387\u4ece35%\u8dcc\u81f32%\u7684\u663e\u8457\u4e0b\u964d\u672a\u80fd\u590d\u73b0\uff0c\u4e14\u8be5\u7f16\u7801\u5668\u5728\u6d4b\u8bd5\u57fa\u51c6\u4e0a\u51e0\u4e4e\u4e0d\u63d0\u4f9b\u52a8\u4f5c\u91cd\u6784\u6536\u76ca\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16745", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u5728\u539f\u59cb\u4ee3\u7801\u4e0e\u4e0d\u540c\u5b9e\u73b0/\u8bad\u7ec3\u6570\u636e\u8bbe\u7f6e\u4e0b\uff0c\u79fb\u9664CVAE\u7f16\u7801\u5668\u5e76\u672a\u91cd\u73b0\u539f\u8bba\u6587\u4e2d\u7684\u5de8\u5927\u6027\u80fd\u4e0b\u964d", "\u8bad\u7ec3\u65f6\u957f\u4e0e\u8bc4\u4f30\u68c0\u67e5\u70b9\u9009\u62e9\u4f1a\u6539\u53d8\u54ea\u79cd\u7b56\u7565\u8868\u73b0\u66f4\u597d\uff0c\u8bf4\u660e\u7ed3\u679c\u5bf9\u5b9e\u9a8c\u6d41\u7a0b\u8f83\u654f\u611f", "\u63a8\u7406\u9636\u6bb5ACT\u672c\u8eab\u4e0d\u4f7f\u7528\u8be5\u6f5c\u53d8\u91cf\u5e76\u5c06\u5176\u7f6e\u96f6\uff0c\u8df3\u8fc7\u7f16\u7801\u5668\u8fd8\u80fd\u63d0\u5347\u8bad\u7ec3\u541e\u5410"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60", "\u53ef\u590d\u73b0\u6027", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16745v1", "published_at": "2026-09-15", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "The Latent That Never Was: A Forensic Re-run of the CVAE Ablation in Action Chunking Transformer", "tldr": "\u590d\u73b0\u5b9e\u9a8c\u8d28\u7591ACT\u4e2dCVAE\u7f16\u7801\u5668\u5fc5\u8981\u6027", "upvotes": 0, "what_it_is": "\u8fd9\u7bc7\u8bba\u6587\u91cd\u65b0\u8fd0\u884c\u5e76\u5ba1\u67e5\u4e86 Action Chunking Transformer\uff08ACT\uff09\u4e2d CVAE \u7f16\u7801\u5668\u79fb\u9664\u5b9e\u9a8c\u3002\u4f5c\u8005\u53d1\u73b0\u539f\u8bba\u6587\u62a5\u544a\u7684\u6210\u529f\u7387\u4ece35%\u8dcc\u81f32%\u7684\u663e\u8457\u4e0b\u964d\u672a\u80fd\u590d\u73b0\uff0c\u4e14\u8be5\u7f16\u7801\u5668\u5728\u6d4b\u8bd5\u57fa\u51c6\u4e0a\u51e0\u4e4e\u4e0d\u63d0\u4f9b\u52a8\u4f5c\u91cd\u6784\u6536\u76ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5bf9\u673a\u5668\u4eba\u6a21\u4eff\u5b66\u4e60\u4e2d\u5e7f\u6cdb\u4f7f\u7528\u7684ACT\u67b6\u6784\u8fdb\u884c\u4e86\u53ef\u590d\u73b0\u6027\u5ba1\u8ba1\uff0c\u63d0\u793a\u67d0\u4e9b\u5173\u952e\u7ec4\u4ef6\u7684\u5b9e\u9645\u8d21\u732e\u53ef\u80fd\u88ab\u9ad8\u4f30\uff0c\u5e76\u4e3a\u540e\u7eed\u66f4\u53ef\u9760\u7684\u673a\u5668\u4eba\u5b66\u4e60\u57fa\u51c6\u8bc4\u4f30\u63d0\u4f9b\u4e86\u4ee3\u7801\u548c\u5de5\u5177\u3002"}, {"abstract": "Neural audio codecs are a key component in speech language modeling. However, their high frame rates lead to long sequence lengths, increasing computational costs. Dynamic frame rate codecs mitigate this by reducing the effective frame rate using a compression step to merge multiple frames together. However, most prior methods either operate on single-codebook codecs or apply a single compression step before multi-layer quantization. This forces all quantization layers to share the same segmentation boundaries, despite the residual embeddings at different quantization layers exhibiting different rates of change over time. We propose LACE (Layer-Adaptive Codec Encoding), a dynamic frame rate codec that applies an independent compression step at each quantization layer, enabling layer-specific segmentation boundaries. To use LACE tokens in downstream text-to-speech (TTS), we further introduce union alignment and boundary anchor mechanisms to make durations consistent across layers while preserving compression benefits. Experiments on LibriTTS show that LACE offers a better rate-quality tradeoff than prior dynamic frame rate methods on the reconstruction task and improves TTS inference efficiency while maintaining competitive synthesis quality. Our code is released as part of the ESPnet3 codec recipe.", "arxiv_id": "2609.17509", "arxiv_url": "https://arxiv.org/abs/2609.17509", "authors": ["Thanapat Trachu", "Samuele Cornell", "William Chen", "Shinji Watanabe"], "brief": "\u8bba\u6587\u63d0\u51fa LACE\uff0c\u4e00\u79cd\u52a8\u6001\u5e27\u7387\u795e\u7ecf\u97f3\u9891\u7f16\u89e3\u7801\u5668\uff0c\u5728\u6bcf\u4e2a\u91cf\u5316\u5c42\u72ec\u7acb\u6267\u884c\u5e27\u538b\u7f29\uff0c\u4f7f\u4e0d\u540c\u6b8b\u5dee\u5c42\u62e5\u6709\u5404\u81ea\u7684\u65f6\u95f4\u5206\u6bb5\u8fb9\u754c\u3002\u4e3a\u9002\u914d\u4e0b\u6e38 TTS\uff0c\u8fd8\u8bbe\u8ba1\u4e86 union alignment \u548c boundary anchor \u673a\u5236\uff0c\u5728\u4fdd\u6301\u538b\u7f29\u6536\u76ca\u7684\u540c\u65f6\u7edf\u4e00\u8de8\u5c42\u65f6\u957f\u3002", "categories": ["cs.SD", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17509", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u76f8\u6bd4\u4ee5\u5f80\u5355\u7801\u672c\u538b\u7f29\u6216\u591a\u5c42\u91cf\u5316\u524d\u7edf\u4e00\u538b\u7f29\u7684\u65b9\u6cd5\uff0cLACE \u5141\u8bb8\u5404\u91cf\u5316\u5c42\u6839\u636e\u81ea\u8eab\u6b8b\u5dee\u53d8\u5316\u901f\u7387\u9009\u62e9\u4e0d\u540c\u5206\u6bb5\u8fb9\u754c\u3002", "\u63d0\u51fa union alignment \u4e0e boundary anchor\uff0c\u4f7f\u591a\u5c42 LACE token \u5728 TTS \u4e2d\u5177\u5907\u4e00\u81f4\u65f6\u957f\uff0c\u907f\u514d\u5c42\u95f4\u5bf9\u9f50\u95ee\u9898\u3002", "\u5728 LibriTTS \u4e0a\uff0cLACE \u5728\u91cd\u5efa\u4efb\u52a1\u4e2d\u53d6\u5f97\u66f4\u4f18\u7801\u7387-\u8d28\u91cf\u6743\u8861\uff0c\u5e76\u63d0\u5347 TTS \u63a8\u7406\u6548\u7387\u4e14\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u5408\u6210\u8d28\u91cf\u3002"], "keywords": ["\u97f3\u9891\u7f16\u7801", "\u8bed\u97f3\u751f\u6210", "TTS", "\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17509v1", "published_at": "2026-09-15", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "LACE: Layer-Wise Compression for Dynamic Frame Rate Codecs", "tldr": "\u9010\u91cf\u5316\u5c42\u81ea\u9002\u5e94\u538b\u7f29\u97f3\u9891\u7f16\u7801\u5e27\u7387", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LACE\uff0c\u4e00\u79cd\u52a8\u6001\u5e27\u7387\u795e\u7ecf\u97f3\u9891\u7f16\u89e3\u7801\u5668\uff0c\u5728\u6bcf\u4e2a\u91cf\u5316\u5c42\u72ec\u7acb\u6267\u884c\u5e27\u538b\u7f29\uff0c\u4f7f\u4e0d\u540c\u6b8b\u5dee\u5c42\u62e5\u6709\u5404\u81ea\u7684\u65f6\u95f4\u5206\u6bb5\u8fb9\u754c\u3002\u4e3a\u9002\u914d\u4e0b\u6e38 TTS\uff0c\u8fd8\u8bbe\u8ba1\u4e86 union alignment \u548c boundary anchor \u673a\u5236\uff0c\u5728\u4fdd\u6301\u538b\u7f29\u6536\u76ca\u7684\u540c\u65f6\u7edf\u4e00\u8de8\u5c42\u65f6\u957f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u8bed\u97f3\u8bed\u8a00\u6a21\u578b\u4e2d\u795e\u7ecf\u97f3\u9891 codec \u9ad8\u5e27\u7387\u5bfc\u81f4\u5e8f\u5217\u8fc7\u957f\u3001\u8ba1\u7b97\u6210\u672c\u9ad8\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u66f4\u7ec6\u7c92\u5ea6\u7684\u5c42\u7ea7\u52a8\u6001\u538b\u7f29\u65b9\u6848\uff1b\u5bf9\u9ad8\u6548\u8bed\u97f3\u751f\u6210\u548c TTS \u63a8\u7406\u52a0\u901f\u5177\u6709\u5b9e\u9645\u4ef7\u503c\uff0c\u5e76\u5df2\u96c6\u6210\u5230 ESPnet3 codec recipe\u3002"}, {"abstract": "Uncertainty estimation for Vision-Language-Navigation (VLN) models is a critical task since it can help identify ambiguous and unreliable predictions, enabling agents to make safer navigation decisions. As one of the most advanced uncertainty estimation frameworks, conformal prediction (CP) offers a promising approach for uncertainty estimation in VLN. However, given that VLN agent requires a sequence of steps, standard calibration in conformal prediction fails to provide coverage guarantee it promises over a dependent, variable-length VLN episode. To this end, we propose Episode-Normalized Conformal Prediction (ENCP), which rescales a nonconformity score by the policy\u0027s residual confidence and calibrates one maximum score per episode. Under exchangeable calibration and test episodes, this construction covers the ground truth at every step with probability at least $1 - \u03b1$, while allowing dependence among steps within an episode. Across four VLN policies and three nonconformity scores on R2R and REVERIE dataset, ENCP meets all reported empirical step-coverage targets on the seen-to-unseen evaluation. These results demonstrate that ENCP can provide model-agnostic uncertainty estimates, which might be useful for determining when a VLN agent should defer to a more capable predictor, including human assistance.", "arxiv_id": "2609.17499", "arxiv_url": "https://arxiv.org/abs/2609.17499", "authors": ["Vicky Feliren", "A. Taufiq Asyhari", "Muhamad Risqi U. Saputra"], "brief": "\u672c\u6587\u63d0\u51fa ENCP\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u7684 episode \u5f52\u4e00\u5316\u4fdd\u5f62\u9884\u6d4b\u65b9\u6cd5\uff0c\u901a\u8fc7\u6309\u7b56\u7565\u5269\u4f59\u7f6e\u4fe1\u5ea6\u7f29\u653e\u975e\u4e00\u81f4\u6027\u5206\u6570\uff0c\u5e76\u4ee5\u6bcf\u4e2a episode \u7684\u6700\u5927\u5206\u6570\u8fdb\u884c\u6821\u51c6\u3002\u8be5\u65b9\u6cd5\u5728\u5141\u8bb8 episode \u5185\u6b65\u9aa4\u4f9d\u8d56\u548c\u53d8\u957f\u7684\u60c5\u51b5\u4e0b\uff0c\u4ecd\u80fd\u7ed9\u51fa\u9010\u6b65\u8986\u76d6\u4fdd\u8bc1\uff0c\u5e76\u5728 R2R\u3001REVERIE \u4e0a\u591a\u79cd\u7b56\u7565\u4e0e\u5206\u6570\u8bbe\u7f6e\u4e2d\u8fbe\u5230\u7ecf\u9a8c\u8986\u76d6\u76ee\u6807\u3002", "categories": ["cs.LG", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17499", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u4fdd\u5f62\u9884\u6d4b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17499v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ENCP: Episode-Normalized Conformal Prediction for Vision-and-Language Navigation", "tldr": "\u672c\u6587\u63d0\u51fa ENCP\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a\u7684 episode \u5f52\u4e00\u5316\u4fdd\u5f62\u9884\u6d4b\u65b9\u6cd5\uff0c\u901a\u8fc7\u6309\u7b56\u7565\u5269\u4f59\u7f6e\u4fe1\u5ea6\u7f29\u653e\u975e\u4e00\u81f4\u6027\u5206\u6570\uff0c\u5e76\u4ee5\u6bcf\u4e2a episode \u7684\u6700\u5927\u5206\u6570\u8fdb\u884c\u6821\u51c6\u3002\u8be5\u65b9\u6cd5\u5728\u5141\u8bb8 episode \u5185\u6b65\u9aa4\u4f9d\u8d56\u548c\u53d8\u957f\u7684\u60c5\u51b5\u4e0b\uff0c\u4ecd\u80fd\u7ed9\u51fa\u9010\u6b65\u8986\u76d6\u4fdd\u8bc1\uff0c\u5e76\u5728 R2R\u3001REVERIE \u4e0a\u591a\u79cd\u7b56\u7565\u4e0e\u5206\u6570\u8bbe\u7f6e\u4e2d\u8fbe\u5230\u7ecf\u9a8c\u8986\u76d6\u76ee\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM assistants are widely used for daily social advice, yet evaluating their social reasoning in such consultation settings remains challenging since (i) it requires setups where the assistant learns about social situations from subjective user narratives, and (ii) social properties, such as others\u0027 intentions, typically lack verifiable ground truth. To address these challenges, we introduce Fuse, a multi-agent simulation framework for studying user-mediated social reasoning. In Fuse, a target agent with a hidden motive interacts with other agents including one representing the user, who then consults the evaluated assistant to infer the target\u0027s motive, providing verifiable ground truth by construction. Simulation faithfulness is validated through a human study with 24k annotations. We apply Fuse to 12 LLMs and demonstrate its analytical utility by systematically isolating key factors, showing that (i) user mediation compounds the inherent difficulty of social reasoning; (ii) LLMs exhibit systematic sensitivity to biased user framing; (iii) models can require more details than humans need to reach a correct prediction; and (iv) longer conversations do not always improve performance despite providing opportunities for clarifying questions. We open-source Fuse and a dataset with 21k examples.", "arxiv_id": "2609.17496", "arxiv_url": "https://arxiv.org/abs/2609.17496", "authors": ["Amir Taubenfeld", "Zorik Gekhman", "Avigail Grinstein-Dabush", "Itay Laish", "Ariel Goldstein", "Marian Croak", "Avinatan Hassidim", "Yossi Matias", "Amir Feder"], "brief": "\u8bba\u6587\u63d0\u51fa Fuse\uff0c\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u4eff\u771f\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u52a9\u624b\u5728\u7528\u6237\u8f6c\u8ff0\u793e\u4f1a\u60c5\u5883\u540e\u63a8\u65ad\u4ed6\u4eba\u9690\u85cf\u52a8\u673a\u7684\u80fd\u529b\uff0c\u5e76\u901a\u8fc7\u6784\u9020\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u771f\u503c\u3002\u4f5c\u8005\u5728\u4eba\u7c7b\u6807\u6ce8\u4e2d\u9a8c\u8bc1\u4eff\u771f\u53ef\u4fe1\u5ea6\uff0c\u5e76\u5728 12 \u4e2a LLM \u4e0a\u53d1\u73b0\u7528\u6237\u8f6c\u8ff0\u4f1a\u589e\u52a0\u96be\u5ea6\u3001\u6a21\u578b\u6613\u53d7\u504f\u89c1\u53d9\u8ff0\u5f71\u54cd\uff0c\u4e14\u66f4\u957f\u5bf9\u8bdd\u4e0d\u4e00\u5b9a\u63d0\u5347\u8868\u73b0\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17496", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u793e\u4f1a\u63a8\u7406", "\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17496v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Verifiable Social Reasoning for LLM Assistants", "tldr": "\u8bba\u6587\u63d0\u51fa Fuse\uff0c\u4e00\u4e2a\u591a\u667a\u80fd\u4f53\u4eff\u771f\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u52a9\u624b\u5728\u7528\u6237\u8f6c\u8ff0\u793e\u4f1a\u60c5\u5883\u540e\u63a8\u65ad\u4ed6\u4eba\u9690\u85cf\u52a8\u673a\u7684\u80fd\u529b\uff0c\u5e76\u901a\u8fc7\u6784\u9020\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u771f\u503c\u3002\u4f5c\u8005\u5728\u4eba\u7c7b\u6807\u6ce8\u4e2d\u9a8c\u8bc1\u4eff\u771f\u53ef\u4fe1\u5ea6\uff0c\u5e76\u5728 12 \u4e2a LLM \u4e0a\u53d1\u73b0\u7528\u6237\u8f6c\u8ff0\u4f1a\u589e\u52a0\u96be\u5ea6\u3001\u6a21\u578b\u6613\u53d7\u504f\u89c1\u53d9\u8ff0\u5f71\u54cd\uff0c\u4e14\u66f4\u957f\u5bf9\u8bdd\u4e0d\u4e00\u5b9a\u63d0\u5347\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We introduce LimiX-2, a new model in the LimiX family, developed through model and data scaling guided by our previously established scaling laws. LimiX-2 adopts the Contextual Mechanism Networks (CMNs) paradigm and is pretrained with Context-Conditional Masked Modeling (CCMM). CMNs shifts the organizing principle of in-context learning from target-centric prediction to mechanism-oriented joint modeling. Rather than centering the network on the $p(y \\mid x, D_{\\mathrm{context}})$ objective of conventional tabular PFNs, it is designed around learning $p(x, y \\mid D_{\\mathrm{context}})$, a context-dependent representation of the joint structure underlying data generation. Pretraining uses synthetic datasets generated by structural causal models (SCMs) spanning diverse graph structures, functional mechanisms, and observation processes. Evaluations on TabArena, TALENT, and BCCO show that LimiX-2 outperforms current dataset-specific models and tabular foundation models. Beyond predictive performance, the CMN paradigm also promotes causal awareness in LimiX-2: its feature attention encodes direct causal relationships, enabling accurate causal skeleton recovery.", "arxiv_id": "2609.17488", "arxiv_url": "https://arxiv.org/abs/2609.17488", "authors": ["Xingxuan Zhang", "Gang Ren", "Hao Yuan", "Hao Zou", "Hongze Tan", "Hui Wang", "Jianhao Song", "Jiansheng Li", "Jiayao Zhang", "Jinghan Zhang", "Kaifang Li", "Lang Mo", "Li Mao", "Mingchao Hao", "Nuo Xu", "Rui Ding", "Ruiji Zhang", "Shuyang Li", "Siyu Mei", "Tianyang Zhang", "Weiyang Mu", "Yancheng Dong", "Yongxian Wei", "Yuan Xue", "Yuanrui Wang", "Yue He", "Zijia Yang", "Ziyun Li", "Dongzhe Li", "Fuqiang Wang", "Jiandong Liu", "Jiawei Chen", "Jiaxin Du", "Kaijie Cheng", "Kehan Li", "Lei Sun", "Linjun Zhou", "Ningbo Dai", "Qi Wang", "Renzhe Xu", "Shaoxing Du", "Shumeng Yang", "Wang Lu", "Wenjing Chu", "Xiannan Huang", "Xiaoyu Lin", "Xing Ai", "Xinyan Han", "Xuanyue Li", "Xuanyue Su", "Xukun Zhang", "Yan Lu", "Yaxin Zhang", "Yi Qin", "Yifei Huang", "Yihan Xu", "Yongle Lv", "Yuanyuan Jiang", "Yushan Han", "Peng Cui"], "brief": "LimiX-2 \u662f\u9762\u5411\u7ed3\u6784\u5316/\u8868\u683c\u6570\u636e\u7684\u57fa\u7840\u6a21\u578b\uff0c\u91c7\u7528\u4e0a\u4e0b\u6587\u673a\u5236\u7f51\u7edc\u4e0e\u4e0a\u4e0b\u6587\u6761\u4ef6\u63a9\u7801\u5efa\u6a21\uff0c\u5b66\u4e60\u6570\u636e\u751f\u6210\u7684\u8054\u5408\u7ed3\u6784\u800c\u975e\u4ec5\u505a\u76ee\u6807\u9884\u6d4b\u3002\u5b83\u5728 TabArena\u3001TALENT\u3001BCCO \u4e0a\u8d85\u8fc7\u73b0\u6709\u4e13\u7528\u6a21\u578b\u548c\u8868\u683c\u57fa\u7840\u6a21\u578b\uff0c\u5e76\u8868\u73b0\u51fa\u4e00\u5b9a\u56e0\u679c\u611f\u77e5\u80fd\u529b\uff0c\u53ef\u7528\u4e8e\u56e0\u679c\u9aa8\u67b6\u6062\u590d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17488", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u6570\u636e", "\u57fa\u7840\u6a21\u578b", "\u56e0\u679c\u5b66\u4e60", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17488v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LimiX-2: A Contextual Mechanism Network Towards General Structured-Data Intelligence", "tldr": "LimiX-2 \u662f\u9762\u5411\u7ed3\u6784\u5316/\u8868\u683c\u6570\u636e\u7684\u57fa\u7840\u6a21\u578b\uff0c\u91c7\u7528\u4e0a\u4e0b\u6587\u673a\u5236\u7f51\u7edc\u4e0e\u4e0a\u4e0b\u6587\u6761\u4ef6\u63a9\u7801\u5efa\u6a21\uff0c\u5b66\u4e60\u6570\u636e\u751f\u6210\u7684\u8054\u5408\u7ed3\u6784\u800c\u975e\u4ec5\u505a\u76ee\u6807\u9884\u6d4b\u3002\u5b83\u5728 TabArena\u3001TALENT\u3001BCCO \u4e0a\u8d85\u8fc7\u73b0\u6709\u4e13\u7528\u6a21\u578b\u548c\u8868\u683c\u57fa\u7840\u6a21\u578b\uff0c\u5e76\u8868\u73b0\u51fa\u4e00\u5b9a\u56e0\u679c\u611f\u77e5\u80fd\u529b\uff0c\u53ef\u7528\u4e8e\u56e0\u679c\u9aa8\u67b6\u6062\u590d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite the rapid uptake of black-box object detectors in marine mammal research and monitoring, explainability techniques are rarely integrated into conservation workflows. Furthermore, most classification-oriented explainability tools are ill-suited to detection tasks involving imagery of social organisms or those with colonial life histories, as they ignore multiple detections within a scene and produce single-instance outputs that blur evidence across individuals. These methods also generate low-resolution, often biologically irrelevant visuals, limiting their utility for debugging, targeted data augmentation, and refined data collection. We proposed Det-LIME, a detector-aware, multi-instance adaptation of Local Interpretable Model-Agnostic Explanations (LIME) that produced instance-specific, box-aligned explanations by combining per-detection weighting, a proximity kernel that emphasizes regions near each box, and Intersection-over-Union-based matching to track the same instance across perturbations. We evaluated Det-LIME on aerial drone imagery for harbor seal detection, with an additional seabird case study to assess generality, and compared it with vanilla LIME, Stabilized LIME, Deterministic LIME, and gradient-based attribution methods. Using the Attribution Ratio and Max Saliency Hit Rate metrics, we showed that Det-LIME consistently improved multi-instance attribution. In practice, these higher-resolution, instance-aware explanations provide insight into model outputs and support post-processing, debugging, and actionable improvements in modeling and data collection or augmentation.", "arxiv_id": "2609.17479", "arxiv_url": "https://arxiv.org/abs/2609.17479", "authors": ["Jiayi Zhou", "David W. Johnston", "Brinnae Bent"], "brief": "\u8bba\u6587\u63d0\u51fa Det-LIME\uff0c\u5c06 LIME \u6539\u9020\u6210\u9762\u5411\u76ee\u6807\u68c0\u6d4b\u7684\u591a\u5b9e\u4f8b\u53ef\u89e3\u91ca\u65b9\u6cd5\uff0c\u901a\u8fc7\u68c0\u6d4b\u6846\u5bf9\u9f50\u3001\u90bb\u8fd1\u533a\u57df\u52a0\u6743\u548c IoU \u5339\u914d\uff0c\u4e3a\u6bcf\u4e2a\u6d77\u6d0b\u54fa\u4e73\u52a8\u7269\u68c0\u6d4b\u7ed3\u679c\u751f\u6210\u5b9e\u4f8b\u7ea7\u89e3\u91ca\u3002\u5728\u6d77\u8c79\u65e0\u4eba\u673a\u56fe\u50cf\u548c\u6d77\u9e1f\u6848\u4f8b\u4e0a\uff0c\u76f8\u6bd4\u4f20\u7edf LIME \u53ca\u68af\u5ea6\u5f52\u56e0\u65b9\u6cd5\uff0cDet-LIME \u5728\u591a\u5b9e\u4f8b\u5f52\u56e0\u6307\u6807\u4e0a\u66f4\u7a33\u5b9a\u3001\u66f4\u51c6\u786e\uff0c\u6709\u52a9\u4e8e\u6a21\u578b\u8c03\u8bd5\u3001\u6570\u636e\u589e\u5f3a\u548c\u91c7\u96c6\u6539\u8fdb\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17479", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u76ee\u6807\u68c0\u6d4b", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u751f\u6001\u76d1\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17479v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Det-LIME: Detector-Aware, Multi-Instance Local Interpretable Model-Agnostic Explanations for Automated Marine Mammal Detection", "tldr": "\u8bba\u6587\u63d0\u51fa Det-LIME\uff0c\u5c06 LIME \u6539\u9020\u6210\u9762\u5411\u76ee\u6807\u68c0\u6d4b\u7684\u591a\u5b9e\u4f8b\u53ef\u89e3\u91ca\u65b9\u6cd5\uff0c\u901a\u8fc7\u68c0\u6d4b\u6846\u5bf9\u9f50\u3001\u90bb\u8fd1\u533a\u57df\u52a0\u6743\u548c IoU \u5339\u914d\uff0c\u4e3a\u6bcf\u4e2a\u6d77\u6d0b\u54fa\u4e73\u52a8\u7269\u68c0\u6d4b\u7ed3\u679c\u751f\u6210\u5b9e\u4f8b\u7ea7\u89e3\u91ca\u3002\u5728\u6d77\u8c79\u65e0\u4eba\u673a\u56fe\u50cf\u548c\u6d77\u9e1f\u6848\u4f8b\u4e0a\uff0c\u76f8\u6bd4\u4f20\u7edf LIME \u53ca\u68af\u5ea6\u5f52\u56e0\u65b9\u6cd5\uff0cDet-LIME \u5728\u591a\u5b9e\u4f8b\u5f52\u56e0\u6307\u6807\u4e0a\u66f4\u7a33\u5b9a\u3001\u66f4\u51c6\u786e\uff0c\u6709\u52a9\u4e8e\u6a21\u578b\u8c03\u8bd5\u3001\u6570\u636e\u589e\u5f3a\u548c\u91c7\u96c6\u6539\u8fdb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Capable open-weight models make local coding and reasoning attractive, but their context and execution state strain laptop memory. We present JustFit, an MLX-based inference runtime that combines KVExec for compressed KV execution, PhaseSwap for component residency, and StateTrans for state-preserving serving transitions. These mechanisms fuse reconstruction and coordinate just-in-time materialization and release, independently of model-weight quantization. In full-execution capacity tests on a 24 GiB M4 Pro MacBook running Qwen3.8-27B MXFP4, three independent runs complete 196,608 input and 16,384 output tokens, increasing completed single-request context from the mlx-vlm baseline\u0027s 30,720 positions to 212,992 (6.93x); a separate two-request run retains 229,376 positions in aggregate. In separate performance tests, a 32K-input, 64-output probe reaches 19.11 tokens/s, and a repeated 32K+6K workload has a median peak process footprint of 16,374 MiB. The integrated runtime answers 29 of 30 AIME 2026 problems correctly, showing how compact state and lifetime-aware execution expand local serving capacity while supporting extended generated reasoning.", "arxiv_id": "2609.17475", "arxiv_url": "https://arxiv.org/abs/2609.17475", "authors": ["Yuhua Chen"], "brief": "JustFit \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e MLX \u7684\u672c\u5730\u5927\u6a21\u578b\u63a8\u7406\u8fd0\u884c\u65f6\uff0c\u901a\u8fc7\u538b\u7f29 KV \u6267\u884c\u3001\u7ec4\u4ef6\u6309\u9636\u6bb5\u6362\u5165\u6362\u51fa\u548c\u72b6\u6001\u4fdd\u6301\u8fc1\u79fb\uff0c\u5b9e\u73b0\u8fd0\u884c\u72b6\u6001\u7684\u5373\u65f6\u7269\u5316\u4e0e\u91ca\u653e\u3002\u5728 24GiB M4 Pro \u7b14\u8bb0\u672c\u4e0a\u8fd0\u884c Qwen3.8-27B\uff0c\u53ef\u5b8c\u6210\u7ea6 20 \u4e07\u8f93\u5165 token \u548c 1.6 \u4e07\u8f93\u51fa token\uff0c\u5355\u8bf7\u6c42\u4e0a\u4e0b\u6587\u5bb9\u91cf\u8f83\u57fa\u7ebf\u63d0\u5347 6.93 \u500d\uff0c\u5e76\u5728 AIME 2026 \u4e0a\u7b54\u5bf9 29/30 \u9898\u3002", "categories": ["cs.AI", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17475", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u957f\u4e0a\u4e0b\u6587", "KV\u7f13\u5b58", "\u672c\u5730\u90e8\u7f72"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17475v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "JustFit: 200K-Token LLM Serving on a 24 GiB Laptop with Just-in-Time State Management", "tldr": "JustFit \u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e MLX \u7684\u672c\u5730\u5927\u6a21\u578b\u63a8\u7406\u8fd0\u884c\u65f6\uff0c\u901a\u8fc7\u538b\u7f29 KV \u6267\u884c\u3001\u7ec4\u4ef6\u6309\u9636\u6bb5\u6362\u5165\u6362\u51fa\u548c\u72b6\u6001\u4fdd\u6301\u8fc1\u79fb\uff0c\u5b9e\u73b0\u8fd0\u884c\u72b6\u6001\u7684\u5373\u65f6\u7269\u5316\u4e0e\u91ca\u653e\u3002\u5728 24GiB M4 Pro \u7b14\u8bb0\u672c\u4e0a\u8fd0\u884c Qwen3.8-27B\uff0c\u53ef\u5b8c\u6210\u7ea6 20 \u4e07\u8f93\u5165 token \u548c 1.6 \u4e07\u8f93\u51fa token\uff0c\u5355\u8bf7\u6c42\u4e0a\u4e0b\u6587\u5bb9\u91cf\u8f83\u57fa\u7ebf\u63d0\u5347 6.93 \u500d\uff0c\u5e76\u5728 AIME 2026 \u4e0a\u7b54\u5bf9 29/30 \u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) distillation aims to transfer the capabilities of a powerful teacher to a smaller student. Direct imitation, however, can also transfer the teacher\u0027s systematic bias and errors. This challenge is particularly pronounced under covariate shift, when the teacher\u0027s reliability on target questions is uncertain and target-domain reward feedback is unavailable. We propose Coupled Calibration and Learning (CCL), an LLM distillation algorithm that couples teacher calibration with student updates through token-level branching, using reward feedback only on source questions. Each iteration calibrates the teacher using source feedback and then uses the calibrated teacher to train the student on target questions. The updated student, in turn, informs subsequent calibration. In an autoregressive policy framework, we prove that the output student\u0027s expected average Kullback-Leibler divergence to the oracle student converges to zero at a polynomial rate in the number of iterations. The oracle maximizes the true reference-regularized target reward within the student class, which need not represent the unrestricted optimal policy. Our analysis quantifies the progress of projected student gradient updates while controlling the error in teacher calibration. We further establish a separation from regularized direct matching: its error relative to the oracle student can remain bounded away from zero even when the teacher achieves higher regularized target reward than every student policy. These results demonstrate that LLM distillation can overcome persistent teacher bias and recover the optimal student through coupled calibration and learning, without target-domain reward feedback.", "arxiv_id": "2609.17474", "arxiv_url": "https://arxiv.org/abs/2609.17474", "authors": ["Haichen Hu", "Yuheng Zhang", "David Simchi-Levi"], "brief": "\u8bba\u6587\u63d0\u51fa\u8026\u5408\u6821\u51c6\u4e0e\u5b66\u4e60\uff08CCL\uff09\u7528\u4e8e\u5927\u6a21\u578b\u84b8\u998f\uff0c\u5728\u6ca1\u6709\u76ee\u6807\u57df\u5956\u52b1\u53cd\u9988\u7684\u60c5\u51b5\u4e0b\uff0c\u5229\u7528\u6e90\u57df\u53cd\u9988\u6821\u51c6\u6559\u5e08\u5e76\u8bad\u7ec3\u76ee\u6807\u57df\u5b66\u751f\uff0c\u4ece\u800c\u7f13\u89e3\u6559\u5e08\u504f\u5dee\u3002\u7406\u8bba\u8bc1\u660e\u5b66\u751f\u5230\u201coracle\u5b66\u751f\u201d\u7684KL\u6563\u5ea6\u53ef\u591a\u9879\u5f0f\u901f\u7387\u6536\u655b\uff0c\u5e76\u8bf4\u660e\u5176\u76f8\u6bd4\u76f4\u63a5\u5339\u914d\u80fd\u907f\u514d\u6301\u7eed\u7684\u6559\u5e08\u504f\u5dee\u3002", "categories": ["cs.LG", "cs.AI", "math.ST", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17474", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u84b8\u998f", "\u6821\u51c6", "\u9886\u57df\u504f\u79fb", "\u7406\u8bba\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17474v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Coupled Calibration and Learning: Mitigating Teacher Bias in LLM Distillation without Target-Domain Reward Feedback", "tldr": "\u8bba\u6587\u63d0\u51fa\u8026\u5408\u6821\u51c6\u4e0e\u5b66\u4e60\uff08CCL\uff09\u7528\u4e8e\u5927\u6a21\u578b\u84b8\u998f\uff0c\u5728\u6ca1\u6709\u76ee\u6807\u57df\u5956\u52b1\u53cd\u9988\u7684\u60c5\u51b5\u4e0b\uff0c\u5229\u7528\u6e90\u57df\u53cd\u9988\u6821\u51c6\u6559\u5e08\u5e76\u8bad\u7ec3\u76ee\u6807\u57df\u5b66\u751f\uff0c\u4ece\u800c\u7f13\u89e3\u6559\u5e08\u504f\u5dee\u3002\u7406\u8bba\u8bc1\u660e\u5b66\u751f\u5230\u201coracle\u5b66\u751f\u201d\u7684KL\u6563\u5ea6\u53ef\u591a\u9879\u5f0f\u901f\u7387\u6536\u655b\uff0c\u5e76\u8bf4\u660e\u5176\u76f8\u6bd4\u76f4\u63a5\u5339\u914d\u80fd\u907f\u514d\u6301\u7eed\u7684\u6559\u5e08\u504f\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent systems split a task across a tree of agents and justify the split with folklore: smaller contexts, cleaner separation, parallelism. We ask what the split does to how much of what the leaves discover reaches the root. Model a decomposition as a tree in which an agent handed $b$ items keeps any one with probability $r(b)$. If $r(b)=1/b$, every tree delivers exactly one finding, for every task size and every shape; we verify this to $2.4 \\times 10^{-15}$ on 20,000 random irregular trees. If $r(b)=Cb^{-\u03b4}$, a depth-$k$ tree over $N$ findings yields $C^k N^{1-\u03b4}$: task size and architecture separate, and architecture contributes only $C \\le 1$ per level, so flat is optimal for yield and no arrangement of agents escapes the exponent $\u03b4$. On 600 production deep-research traces $\u03b4= 0.34$ [0.30, 0.38], by three identifications that do not share a failure mode. At a hop where item boundaries come from the tool rather than a text heuristic, and where $b=1$ occurs 550 times, $C = 0.571$ [0.527, 0.615] is observed rather than extrapolated, over 16,082 hops. A tier also costs alignment: on 1,012 annotated multi-agent traces one brief in sixteen goes off-target, giving $\u03bc= 0.939$ and a per-tier penalty $C\u03bc= 0.536$. Depth is bought on two other axes. The root context is the only state that persists and the only one that cannot cheaply forget, and depth cuts its exposure from $N$ items to $N^{1/k}$. Depth is also cheaper: production flat agents bill as $N^{1.39}$, not the $N^2$ an append-only context predicts, and at equal spend two tiers overtake flat at 403 findings. Across every parameter we measured the model says 0.7% to 11.3% of production sessions are worth delegating, against 7.8% that do. A hazard model on 743,819 production tool calls finds that delegation does not respond to a filling context and is instead an opening move.", "arxiv_id": "2609.17464", "arxiv_url": "https://arxiv.org/abs/2609.17464", "authors": ["Rong He"], "brief": "\u8bba\u6587\u7528\u6811\u6a21\u578b\u5206\u6790\u591a\u667a\u80fd\u4f53\u4efb\u52a1\u5206\u89e3\u4e2d\u201c\u53f6\u5b50\u53d1\u73b0\u201d\u4f20\u5230\u6839\u8282\u70b9\u7684\u4ea7\u51fa\u7387\uff0c\u8bc1\u660e\u5728\u5e38\u89c1\u4fdd\u7559\u6982\u7387\u5047\u8bbe\u4e0b\uff0c\u52a0\u6df1\u5206\u89e3\u5c42\u7ea7\u4e0d\u4f1a\u63d0\u9ad8\u4ea7\u51fa\uff0c\u5e73\u94fa\u7ed3\u6784\u5728\u4ea7\u51fa\u4e0a\u6700\u4f18\u3002\u57fa\u4e8e\u751f\u4ea7\u6df1\u5ea6\u7814\u7a76\u8f68\u8ff9\u9a8c\u8bc1\u540e\u53d1\u73b0\uff0c\u5206\u89e3\u4e3b\u8981\u6362\u6765\u66f4\u4f4e\u6839\u4e0a\u4e0b\u6587\u66b4\u9732\u3001\u66f4\u4f4e\u6210\u672c\u548c\u4e00\u5b9a\u5b8c\u6574\u6027\u6536\u76ca\uff0c\u4f46\u6bcf\u5c42\u4f1a\u5e26\u6765\u4ea7\u51fa\u4e0e\u5bf9\u9f50\u60e9\u7f5a\uff0c\u5b9e\u9645\u53ea\u6709\u5c11\u91cf\u4f1a\u8bdd\u503c\u5f97\u59d4\u6d3e\u3002", "categories": ["cs.MA", "cs.AI", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/pa
