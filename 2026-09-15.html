u3002", "categories": ["cs.AI", "cs.HC", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13463", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u957f\u6267\u884c\u8f68\u8ff9\u4e2d\u7684\u6839\u56e0\u4fe1\u606f\u5f80\u5f80\u7a00\u758f\u3001\u5206\u6563\u4e14\u4e0e\u6700\u7ec8\u5931\u8d25\u8868\u8c61\u8ddd\u79bb\u8f83\u8fdc\uff0c\u56e0\u6b64\u6839\u56e0\u5f52\u56e0\u672c\u8d28\u4e0a\u662f\u5927\u89c4\u6a21\u641c\u7d22\u95ee\u9898", "\u5728\u56db\u4e2a\u5df2\u6709 RCA \u57fa\u51c6\u4e0a\u9a8c\u8bc1 Continual Search\uff0c\u5e76\u65b0\u5efa MegaRCA-Mix\uff0c\u5305\u542b 50 \u4e2a\u957f\u7a0b\u3001\u9ad8\u6267\u884c\u91cf\u4efb\u52a1\u7684\u4eba\u7c7b\u6807\u6ce8\u5931\u8d25\u6848\u4f8b", "\u5728 MegaRCA-Mix \u4e0a\uff0cContinual Search \u5c06 GPT-5.5 \u7684 F1 \u4ece 0.349 \u63d0\u5347\u5230 0.498\uff0c\u63d0\u5347\u8d85\u8fc7 40%"], "keywords": ["\u667a\u80fd\u4f53", "\u6839\u56e0\u5206\u6790", "\u957f\u7a0b\u4efb\u52a1", "LLM\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "Scale AI", "pdf_url": "https://arxiv.org/pdf/2609.13463v1", "published_at": "2026-09-11", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13463.png", "title": "Root-Cause Attribution Is a Search Problem: Continual Search for Long-Horizon Agent Failures", "tldr": "\u628a\u957f\u7a0b\u667a\u80fd\u4f53\u6545\u969c\u5f52\u56e0\u8f6c\u5316\u4e3a\u6301\u7eed\u641c\u7d22\u95ee\u9898", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Continual Search\uff0c\u4e00\u79cd\u7528\u4e8e\u957f\u7a0b AI agent \u6267\u884c\u65e5\u5fd7\u6839\u56e0\u5f52\u56e0\u7684\u8fed\u4ee3\u8bca\u65ad\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u591a\u8f6e\u63a8\u52a8 LLM \u8bc4\u5ba1\u5668\u7ee7\u7eed\u68c0\u7d22\u672a\u89e3\u51b3\u8bc1\u636e\uff0c\u907f\u514d\u4e00\u6b21\u6027\u5224\u65ad\u8fc7\u65e9\u6536\u655b\u5230\u770b\u4f3c\u5408\u7406\u4f46\u4e0d\u5b8c\u6574\u7684\u8bca\u65ad\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u76f4\u63a5\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u53ef\u9760\u6027\u4e2d\u7684\u5173\u952e\u74f6\u9888\uff1a\u5982\u4f55\u4ece\u6d77\u91cf\u6267\u884c\u65e5\u5fd7\u4e2d\u5b9a\u4f4d\u5931\u8d25\u6839\u56e0\u3002\u5176\u6838\u5fc3\u4ef7\u503c\u5728\u4e8e\u8bc1\u660e\u8bca\u65ad\u6548\u679c\u4e0d\u4ec5\u4f9d\u8d56\u6a21\u578b\u89c4\u6a21\uff0c\u66f4\u4f9d\u8d56\u641c\u7d22\u5f0f\u63a8\u7406\u6d41\u7a0b\uff0c\u751a\u81f3\u4f4e\u9636\u6a21\u578b\u914d\u5408\u6709\u6548\u641c\u7d22\u53ef\u8d85\u8fc7\u9ad8\u9636\u6a21\u578b\u3002"}, {"abstract": "We report a multi-month engineering program to build Sophea, a production bilingual Greek-English automatic speech recognition system. We evaluate the system against nine production gates covering Greek and English word error rate, language identification, and hallucinations on non-speech audio. Across twenty-three training iterations and two model architectures, no training-data composition passed all nine gates simultaneously. Meeting the Greek noisy-environment target required about 1,500 steps of dense domain exposure, while preserving English language identification tolerated only about 250 steps, or about 1,250 with a rebalanced mix that reduced Greek accuracy. We describe a six-stage data pipeline in which calibrating an audio-quality filter against in-domain anchors reduced the discarded share of scored Greek audio from 98.7 percent to 10.6 percent. A pre-registered ablation isolated a hallucination defect to one training-data package. A three-model ROVER ensemble increased gate coverage from 4-7 of 9 for individual models to 9 of 9 and reduced overlapping-speech WER from 53.35 percent to 37.87 percent, a 29 percent relative improvement. A separate learned per-clip arbiter over two models is listed as sophea/asr-k1 (preview) on the public Open ASR Leaderboard, with 4.26 percent average WER across eight public English test sets, and reaches 25.88 percent WER on live Greek noisy-environment traffic. We also document five cases in which a measurement tool produced a plausible but incorrect result and seven substantial approaches that were evaluated but not shipped. No model weights or training data are released; we report methodology and quantitative results only.", "arxiv_id": "2609.13498", "arxiv_url": "https://arxiv.org/abs/2609.13498", "authors": ["Christos Petrocheilos", "Cleopatra Papadopoulou", "Chris Porikis", "Ioakeim Perros", "Ayoub Kirouane", "Themistoklis Nikolis"], "brief": "\u8bba\u6587\u62a5\u544a\u4e86\u6784\u5efa Sophea \u5e0c\u814a\u8bed-\u82f1\u8bed\u53cc\u8bed\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u7cfb\u7edf\u7684\u591a\u6708\u5de5\u7a0b\u5b9e\u8df5\uff0c\u56f4\u7ed5\u4e5d\u4e2a\u751f\u4ea7\u51c6\u5165\u6307\u6807\u8bc4\u4f30\u4e0d\u540c\u8bad\u7ec3\u6570\u636e\u914d\u6bd4\u3001\u6a21\u578b\u67b6\u6784\u4e0e\u96c6\u6210\u65b9\u6848\u3002\u4f5c\u8005\u4e0d\u53d1\u5e03\u6a21\u578b\u6216\u6570\u636e\uff0c\u800c\u662f\u7ed9\u51fa\u65b9\u6cd5\u8bba\u3001\u6d88\u878d\u4e0e\u91cf\u5316\u7ed3\u679c\u3002", "categories": ["eess.AS", "cs.AI", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13498", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["23\u8f6e\u8bad\u7ec3\u548c\u4e24\u79cd\u67b6\u6784\u4e2d\uff0c\u5355\u4e00\u8bad\u7ec3\u6570\u636e\u914d\u6bd4\u65e0\u6cd5\u540c\u65f6\u901a\u8fc7\u5e0c\u814a\u8bed/\u82f1\u8bedWER\u3001\u8bed\u8a00\u8bc6\u522b\u548c\u975e\u8bed\u97f3\u5e7b\u89c9\u7b49\u4e5d\u4e2a\u751f\u4ea7\u95e8\u69db\u3002", "\u6821\u51c6\u97f3\u9891\u8d28\u91cf\u8fc7\u6ee4\u5668\u5e76\u5bf9\u9f50\u57df\u5185\u951a\u70b9\u540e\uff0c\u5e0c\u814a\u8bed\u97f3\u9891\u88ab\u4e22\u5f03\u6bd4\u4f8b\u4ece98.7%\u964d\u81f310.6%\u3002", "\u4e09\u6a21\u578bROVER\u96c6\u6210\u5c06\u901a\u8fc7\u95e8\u69db\u6570\u4ece\u5355\u6a21\u578b\u76844-7\u9879\u63d0\u5347\u81f39\u9879\u5168\u901a\u8fc7\uff0c\u5e76\u5c06\u91cd\u53e0\u8bed\u97f3WER\u4ece53.35%\u964d\u81f337.87%\u3002"], "keywords": ["\u8bed\u97f3\u8bc6\u522b", "\u591a\u8bed\u8a00", "\u6570\u636e\u5de5\u7a0b", "\u6a21\u578b\u96c6\u6210"], "num_comments": 3, "on_hf": true, "organization": "KIEFER", "pdf_url": "https://arxiv.org/pdf/2609.13498v1", "published_at": "2026-09-11", "score": 0.22, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13498.png", "title": "Building a Production Greek-English Speech Recognizer", "tldr": "\u751f\u4ea7\u7ea7\u5e0c\u82f1\u53cc\u8bedASR\u7684\u5de5\u7a0b\u590d\u76d8", "upvotes": 3, "what_it_is": "\u8bba\u6587\u62a5\u544a\u4e86\u6784\u5efa Sophea \u5e0c\u814a\u8bed-\u82f1\u8bed\u53cc\u8bed\u81ea\u52a8\u8bed\u97f3\u8bc6\u522b\u7cfb\u7edf\u7684\u591a\u6708\u5de5\u7a0b\u5b9e\u8df5\uff0c\u56f4\u7ed5\u4e5d\u4e2a\u751f\u4ea7\u51c6\u5165\u6307\u6807\u8bc4\u4f30\u4e0d\u540c\u8bad\u7ec3\u6570\u636e\u914d\u6bd4\u3001\u6a21\u578b\u67b6\u6784\u4e0e\u96c6\u6210\u65b9\u6848\u3002\u4f5c\u8005\u4e0d\u53d1\u5e03\u6a21\u578b\u6216\u6570\u636e\uff0c\u800c\u662f\u7ed9\u51fa\u65b9\u6cd5\u8bba\u3001\u6d88\u878d\u4e0e\u91cf\u5316\u7ed3\u679c\u3002", "why_notable": "\u8fd9\u7bc7\u8bba\u6587\u5c11\u89c1\u5730\u516c\u5f00\u4e86\u751f\u4ea7\u7ea7\u53cc\u8bedASR\u843d\u5730\u4e2d\u7684\u6570\u636e\u914d\u6bd4\u51b2\u7a81\u3001\u8d28\u91cf\u8fc7\u6ee4\u3001\u5e7b\u89c9\u5b9a\u4f4d\u548c\u96c6\u6210\u53d6\u820d\uff0c\u63d0\u4f9b\u4e86\u6bd4\u5355\u7eaf\u6392\u884c\u699c\u7ed3\u679c\u66f4\u5177\u5de5\u7a0b\u53c2\u8003\u4ef7\u503c\u7684\u7ecf\u9a8c\u3002"}, {"abstract": "Decision trees are among the most widely used models in machine learning, largely due to their transparent decision logic, making them well-suited for high-stakes decision-making contexts. However, most existing learning algorithms focus on predictive performance, overlooking the joint optimization of other desirable properties, such as structural sparsity. In this work we propose TREVIS, an approach for learning decision trees with respect to complex objectives, based on the exploration of the latent space of a Tree Transformer Variational Auto-Encoder (TTVAE). By mapping decision trees onto latent representations, TREVIS replaces the discrete search space with a continuous one, enabling gradient-based optimization via a differentiable surrogate model. We experiment with TREVIS for learning decision trees that jointly optimize predictive performance and sparsity. Results show that TREVIS discovers decision trees matching the predictive performance of existing near-optimal algorithms while improving their structural sparsity.", "arxiv_id": "2609.01430", "arxiv_url": "https://arxiv.org/abs/2609.01430", "authors": ["Giacomo Fidone", "Alessio Cascione", "Riccardo Guidotti"], "brief": "\u8bba\u6587\u63d0\u51fa TREVIS\uff0c\u5c06\u51b3\u7b56\u6811\u7f16\u7801\u5230 Tree Transformer Variational Auto-Encoder\uff08TTVAE\uff09\u7684\u8fde\u7eed\u6f5c\u7a7a\u95f4\u4e2d\uff0c\u5e76\u901a\u8fc7\u53ef\u5fae\u4ee3\u7406\u6a21\u578b\u8fdb\u884c\u68af\u5ea6\u4f18\u5316\u3002\u5176\u76ee\u6807\u662f\u5728\u4fdd\u6301\u9884\u6d4b\u6027\u80fd\u7684\u540c\u65f6\u8054\u5408\u4f18\u5316\u7ed3\u6784\u7a00\u758f\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.01430", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7528 TTVAE \u5c06\u79bb\u6563\u7684\u51b3\u7b56\u6811\u641c\u7d22\u7a7a\u95f4\u6620\u5c04\u4e3a\u8fde\u7eed\u6f5c\u7a7a\u95f4\uff0c\u964d\u4f4e\u7ec4\u5408\u641c\u7d22\u96be\u5ea6", "\u901a\u8fc7\u53ef\u5fae\u4ee3\u7406\u6a21\u578b\u652f\u6301\u57fa\u4e8e\u68af\u5ea6\u7684\u4f18\u5316\uff0c\u53ef\u5904\u7406\u9884\u6d4b\u6027\u80fd\u4e0e\u7a00\u758f\u6027\u7b49\u590d\u6742\u76ee\u6807", "\u5b9e\u9a8c\u663e\u793a TREVIS \u7684\u9884\u6d4b\u6027\u80fd\u63a5\u8fd1\u73b0\u6709\u8fd1\u6700\u4f18\u7b97\u6cd5\uff0c\u540c\u65f6\u5f97\u5230\u7ed3\u6784\u66f4\u7a00\u758f\u7684\u51b3\u7b56\u6811"], "keywords": ["\u51b3\u7b56\u6811", "\u53ef\u89e3\u91ca\u673a\u5668\u5b66\u4e60", "\u53d8\u5206\u81ea\u7f16\u7801\u5668", "\u7a00\u758f\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.01430v1", "published_at": "2026-09-01", "score": 0.211, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.01430.png", "title": "Learning Sparse Decision Trees via Transformer Variational Auto-Encoders", "tldr": "\u7528Transformer VAE\u5b66\u4e60\u7a00\u758f\u51b3\u7b56\u6811", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa TREVIS\uff0c\u5c06\u51b3\u7b56\u6811\u7f16\u7801\u5230 Tree Transformer Variational Auto-Encoder\uff08TTVAE\uff09\u7684\u8fde\u7eed\u6f5c\u7a7a\u95f4\u4e2d\uff0c\u5e76\u901a\u8fc7\u53ef\u5fae\u4ee3\u7406\u6a21\u578b\u8fdb\u884c\u68af\u5ea6\u4f18\u5316\u3002\u5176\u76ee\u6807\u662f\u5728\u4fdd\u6301\u9884\u6d4b\u6027\u80fd\u7684\u540c\u65f6\u8054\u5408\u4f18\u5316\u7ed3\u6784\u7a00\u758f\u6027\u3002", "why_notable": "\u51b3\u7b56\u6811\u56e0\u53ef\u89e3\u91ca\u6027\u5e38\u7528\u4e8e\u9ad8\u98ce\u9669\u573a\u666f\uff0c\u4f46\u4f20\u7edf\u65b9\u6cd5\u8f83\u5c11\u540c\u65f6\u4f18\u5316\u7a00\u758f\u7ed3\u6784\u3002TREVIS \u5c06\u751f\u6210\u6a21\u578b\u4e0e\u8fde\u7eed\u4f18\u5316\u5f15\u5165\u51b3\u7b56\u6811\u5b66\u4e60\uff0c\u4e3a\u53ef\u89e3\u91ca\u3001\u7d27\u51d1\u6a21\u578b\u7684\u81ea\u52a8\u641c\u7d22\u63d0\u4f9b\u4e86\u65b0\u8def\u5f84\u3002"}, {"abstract": "A core goal of efficient reasoning is to improve the accuracy-efficiency frontier. However, jointly improving reasoning accuracy and inference efficiency can be challenging, as the two objectives can favor different reasoning behaviors. Independently post-trained models already offer distinct strengths in accuracy and efficiency. We introduce Lightning Weave, a post-training framework that extracts and composes these independently learned capabilities in a single student through on-policy distillation. Each acquired capability is represented by the policy shift from the model before post-training to the resulting specialist. Lightning Weave combines aligned log-ratio shifts at shared student token states and uses Tilted-Target DOPD to convert the cached signals into a stable learning target. Each anchor pair scores the cached trajectories once, enabling subsequent student training without serving multiple live anchor models concurrently. Across diverse student models and benchmarks in mathematics and code, Lightning Weave substantially improves upon the base students and achieves a state-of-the-art accuracy-efficiency frontier. On Qwen3.5-4B, it raises HMMT 2025 accuracy from 59.2% to 64.0% with 10.7% fewer response tokens, and LiveCodeBench v5 accuracy from 41.7% to 54.2% with 9.6% fewer response tokens. Adjusting the relative strengths of the anchor signals yields a strong empirical accuracy-efficiency Pareto frontier. These results establish Lightning Weave as a new practical route to efficient reasoning through capability composition. Code will be released soon.", "arxiv_id": "2609.14708", "arxiv_url": "https://arxiv.org/abs/2609.14708", "authors": ["Yecheng Wu", "Song Han", "Han Cai"], "brief": "\u8bba\u6587\u63d0\u51fa Lightning Weave\uff0c\u4e00\u79cd\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u901a\u8fc7 on-policy distillation \u5c06\u4e0d\u540c\u4e13\u5bb6\u6a21\u578b\u5206\u522b\u5b66\u5230\u7684\u201c\u9ad8\u51c6\u786e\u7387\u201d\u548c\u201c\u9ad8\u6548\u7387\u201d\u80fd\u529b\u7ec4\u5408\u8fdb\u5355\u4e2a\u5b66\u751f\u6a21\u578b\u3002\u5b83\u7528\u76f8\u5bf9\u57fa\u5ea7\u6a21\u578b\u7684 policy shift \u8868\u793a\u80fd\u529b\uff0c\u5e76\u5728\u5171\u4eab token \u72b6\u6001\u4e0a\u878d\u5408 log-ratio \u4fe1\u53f7\u5f62\u6210\u7a33\u5b9a\u8bad\u7ec3\u76ee\u6807\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14708", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u72ec\u7acb\u540e\u8bad\u7ec3\u4e13\u5bb6\u7684\u80fd\u529b\u8868\u793a\u4e3a\u4ece\u57fa\u5ea7\u6a21\u578b\u5230\u4e13\u5bb6\u6a21\u578b\u7684\u7b56\u7565\u504f\u79fb\uff0c\u5e76\u5728\u5b66\u751f\u8f68\u8ff9\u4e0a\u7ec4\u5408\u8fd9\u4e9b\u80fd\u529b\u4fe1\u53f7\u3002", "\u4f7f\u7528 Tilted-Target DOPD \u5c06\u7f13\u5b58\u7684\u951a\u6a21\u578b\u8bc4\u5206\u4fe1\u53f7\u8f6c\u5316\u4e3a\u7a33\u5b9a\u84b8\u998f\u76ee\u6807\uff0c\u907f\u514d\u8bad\u7ec3\u65f6\u540c\u65f6\u5728\u7ebf\u8c03\u7528\u591a\u4e2a\u4e13\u5bb6\u6a21\u578b\u3002", "\u5728\u6570\u5b66\u4e0e\u4ee3\u7801\u57fa\u51c6\u4e0a\u663e\u8457\u6539\u8fdb\u51c6\u786e\u7387-\u6548\u7387\u524d\u6cbf\uff1aQwen3.5-4B \u5728 HMMT 2025 \u4e0a\u51c6\u786e\u7387\u4ece 59.2% \u63d0\u81f3 64.0%\uff0c\u540c\u65f6\u54cd\u5e94 token \u51cf\u5c11 10.7%\u3002"], "keywords": ["\u63a8\u7406\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u540e\u8bad\u7ec3", "\u6548\u7387\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14708v1", "published_at": "2026-09-13", "score": 0.207, "selected_reasons": ["HF trending (0\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14708.png", "title": "Lightning Weave: Improving the Accuracy-Efficiency Frontier of Reasoning Models through Capability Composition", "tldr": "\u7ec4\u5408\u4e13\u5bb6\u80fd\u529b\uff0c\u63d0\u5347\u63a8\u7406\u6a21\u578b\u7cbe\u5ea6\u4e0e\u6548\u7387\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Lightning Weave\uff0c\u4e00\u79cd\u540e\u8bad\u7ec3\u6846\u67b6\uff0c\u901a\u8fc7 on-policy distillation \u5c06\u4e0d\u540c\u4e13\u5bb6\u6a21\u578b\u5206\u522b\u5b66\u5230\u7684\u201c\u9ad8\u51c6\u786e\u7387\u201d\u548c\u201c\u9ad8\u6548\u7387\u201d\u80fd\u529b\u7ec4\u5408\u8fdb\u5355\u4e2a\u5b66\u751f\u6a21\u578b\u3002\u5b83\u7528\u76f8\u5bf9\u57fa\u5ea7\u6a21\u578b\u7684 policy shift \u8868\u793a\u80fd\u529b\uff0c\u5e76\u5728\u5171\u4eab token \u72b6\u6001\u4e0a\u878d\u5408 log-ratio \u4fe1\u53f7\u5f62\u6210\u7a33\u5b9a\u8bad\u7ec3\u76ee\u6807\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u63d0\u4f9b\u4e86\u4e00\u6761\u5b9e\u7528\u8def\u5f84\uff1a\u4e0d\u5fc5\u4ece\u96f6\u8054\u5408\u4f18\u5316\u51c6\u786e\u7387\u548c\u6548\u7387\uff0c\u800c\u662f\u590d\u7528\u5df2\u6709\u4e13\u5bb6\u6a21\u578b\u7684\u4e92\u8865\u80fd\u529b\u8fdb\u884c\u7ec4\u5408\u84b8\u998f\uff0c\u5728\u63d0\u5347\u63a8\u7406\u6027\u80fd\u7684\u540c\u65f6\u51cf\u5c11\u8f93\u51fa\u957f\u5ea6\uff0c\u5bf9\u9ad8\u6210\u672c\u63a8\u7406\u6a21\u578b\u90e8\u7f72\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "Can financial vision-language models (VLMs) turn chart evidence into reliable action recommendations? Existing hallucination evaluations are mostly claim-centric; they assess whether generated statements are supported, but not whether evidence remains traceable through rationale, confidence, and final action. We introduce E2A-Bench, a 969-query benchmark for financial chart reasoning, constructed from 323 HS300 constituents under three input modalities with deterministic OHLCV-derived evidence anchors. E2A-Bench evaluates grounding, reasoning-action consistency, evidence-confidence calibration, and directional coverage through UCR, RCI, ECI, and NDR, where NDR measures coverage-aware evidence-to-action reliability rather than realized trading performance. Evaluating 20 VLMs reveals three failures hidden by scalar hallucination scores: the lowest-UCR model ranks near the bottom by NDR due to only 6.4% directional coverage; oracle-aided verification reduces unsupported claims but can collapse coverage; and financial fine-tuning amplifies the BUY:SELL ratio by factors of 4.21 to 4.68 across strict base-fine-tuned pairs. These results show that financial VLM evaluation should trace the full evidence-to-action chain rather than rely on a single hallucination score. Code and data: https://github.com/wanng-ide/E2A-Bench", "arxiv_id": "2609.14302", "arxiv_url": "https://arxiv.org/abs/2609.14302", "authors": ["Xiaoya Wang", "Yutong Xu", "Junjie Wang"], "brief": "\u8bba\u6587\u63d0\u51fa E2A-Bench\uff0c\u4e00\u4e2a\u5305\u542b969\u4e2a\u67e5\u8be2\u7684\u91d1\u878d\u56fe\u8868\u63a8\u7406\u57fa\u51c6\uff0c\u8986\u76d6323\u53ea\u6caa\u6df1300\u6210\u5206\u80a1\u4e0e\u4e09\u79cd\u8f93\u5165\u6a21\u6001\u3002\u5b83\u4e0d\u53ea\u8bc4\u4f30\u5e7b\u89c9\u58f0\u660e\u662f\u5426\u88ab\u652f\u6301\uff0c\u8fd8\u8ffd\u8e2a\u8bc1\u636e\u3001\u63a8\u7406\u3001\u7f6e\u4fe1\u5ea6\u5230\u6700\u7ec8\u4e70\u5356\u884c\u52a8\u5efa\u8bae\u7684\u5b8c\u6574\u94fe\u6761\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14302", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e\u786e\u5b9a\u6027\u7684 OHLCV \u6570\u636e\u6784\u9020\u8bc1\u636e\u951a\u70b9\uff0c\u8bc4\u4f30\u91d1\u878dVLM\u5728\u56fe\u8868\u8bc1\u636e\u4e0a\u7684\u53ef\u8ffd\u6eaf\u6027\u4e0e\u884c\u52a8\u5efa\u8bae\u53ef\u9760\u6027\u3002", "\u63d0\u51fa UCR\u3001RCI\u3001ECI\u3001NDR \u7b49\u6307\u6807\uff0c\u5206\u522b\u8861\u91cf grounding\u3001\u63a8\u7406-\u884c\u52a8\u4e00\u81f4\u6027\u3001\u8bc1\u636e-\u7f6e\u4fe1\u5ea6\u6821\u51c6\u4e0e\u65b9\u5411\u8986\u76d6\u53ef\u9760\u6027\u3002", "\u5bf920\u4e2aVLM\u7684\u5b9e\u9a8c\u53d1\u73b0\uff1a\u4f4e\u5e7b\u89c9\u5206\u6570\u53ef\u80fd\u63a9\u76d6\u65b9\u5411\u8986\u76d6\u4e0d\u8db3\uff0coracle\u9a8c\u8bc1\u4f1a\u964d\u4f4e\u4e0d\u652f\u6301\u58f0\u660e\u4f46\u53ef\u80fd\u727a\u7272\u8986\u76d6\uff0c\u91d1\u878d\u5fae\u8c03\u4f1a\u663e\u8457\u653e\u5927 BUY:SELL \u504f\u7f6e\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u91d1\u878d\u63a8\u7406", "\u57fa\u51c6\u8bc4\u6d4b", "\u5e7b\u89c9\u68c0\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.14302v1", "published_at": "2026-09-13", "score": 0.2, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14302.png", "title": "E2A-Bench: Benchmarking Evidence-to-Action Reliability in Financial Chart Reasoning", "tldr": "\u8bc4\u6d4b\u91d1\u878d\u56fe\u8868VLM\u8bc1\u636e\u5230\u884c\u52a8\u53ef\u9760\u6027", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa E2A-Bench\uff0c\u4e00\u4e2a\u5305\u542b969\u4e2a\u67e5\u8be2\u7684\u91d1\u878d\u56fe\u8868\u63a8\u7406\u57fa\u51c6\uff0c\u8986\u76d6323\u53ea\u6caa\u6df1300\u6210\u5206\u80a1\u4e0e\u4e09\u79cd\u8f93\u5165\u6a21\u6001\u3002\u5b83\u4e0d\u53ea\u8bc4\u4f30\u5e7b\u89c9\u58f0\u660e\u662f\u5426\u88ab\u652f\u6301\uff0c\u8fd8\u8ffd\u8e2a\u8bc1\u636e\u3001\u63a8\u7406\u3001\u7f6e\u4fe1\u5ea6\u5230\u6700\u7ec8\u4e70\u5356\u884c\u52a8\u5efa\u8bae\u7684\u5b8c\u6574\u94fe\u6761\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u91d1\u878dVLM\u8bc4\u4f30\u4e0d\u80fd\u53ea\u770b\u5355\u4e00\u5e7b\u89c9\u5206\u6570\uff0c\u800c\u5e94\u68c0\u67e5\u4ece\u8bc1\u636e\u5230\u4ea4\u6613\u65b9\u5411\u5efa\u8bae\u7684\u5168\u6d41\u7a0b\u53ef\u9760\u6027\uff0c\u5bf9\u91d1\u878d\u573a\u666f\u4e2d\u66f4\u5b89\u5168\u3001\u53ef\u5ba1\u8ba1\u7684\u591a\u6a21\u6001\u6a21\u578b\u8bc4\u6d4b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Language model-generated rubrics are increasingly used as reward signals for rubric-based reinforcement learning, LLM-as-a-judge evaluation, and automated grading. Such rubrics are reliable only if they reward honest answers over adversarial answers optimized to exploit them. Yet their robustness to such optimization remains poorly understood. We isolate the hardest regime: impossible tasks, where the prompt pressures the model toward an unsupported conclusion, so the only honest response is to acknowledge the impossibility. We introduce ImpossibleRubrics, a benchmark of 169 impossible tasks spanning six impossibility categories, each paired with a verifiable oracle certificate specifying what an honest answer may and may not claim, together with 48 answerable controls. Rather than providing fixed rubrics, ImpossibleRubrics provides task environments and certificates, allowing rubrics to be generated downstream and then adversarially tested for whether they reward certificate-violating answers. Eleven generators are exploited 8--26% of the time on the unbiased 150-of-169 environment cut; on a deliberately selected stress cut the strongest generator we measured is still exploited 36% while a certificate-faithful rubric is exploited 0%, so what we measure is a rubric-quality gap, not task impossibility. One result runs against intuition. A single generic rubric (\"be decisive, penalize hedging\") used unchanged for every task is exploited 64% of the time, and seven of the eleven generators are exploited more often than that while writing a rubric tailored to each one. The tailored criteria appear to tell an attacker which claim to fabricate. The problem is not that rubrics are vague; it is that they are specific about the wrong things.", "arxiv_id": "2609.16816", "arxiv_url": "https://arxiv.org/abs/2609.16816", "authors": ["Bowen Qin", "Yi Xie", "Yesheng Liu", "Xi Yang"], "brief": "\u8bba\u6587\u63d0\u51fa ImpossibleRubrics\uff0c\u4e00\u4e2a\u5305\u542b169\u4e2a\u201c\u4e0d\u53ef\u80fd\u4efb\u52a1\u201d\u548c\u53ef\u9a8c\u8bc1\u8bda\u5b9e\u6027\u8bc1\u4e66\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u538b\u529b\u6d4b\u8bd5\u7531\u8bed\u8a00\u6a21\u578b\u751f\u6210\u7684\u8bc4\u5206\u6807\u51c6\u4f5c\u4e3a\u5956\u52b1\u4fe1\u53f7\u65f6\u662f\u5426\u53ef\u9760\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u591a\u79cd rubric \u751f\u6210\u5668\u4f1a\u5956\u52b1\u8fdd\u53cd\u8bc1\u4e66\u7684\u4f2a\u9020\u7b54\u6848\uff0c\u4e14\u4e3a\u4efb\u52a1\u5b9a\u5236\u7684\u8bc4\u5206\u6807\u51c6\u6709\u65f6\u6bd4\u901a\u7528\u6807\u51c6\u66f4\u6613\u88ab\u653b\u51fb\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16816", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u8986\u76d66\u7c7b\u4e0d\u53ef\u80fd\u6027\u573a\u666f\uff0c\u5e76\u914d\u6709 oracle certificate\uff0c\u660e\u786e\u8bda\u5b9e\u7b54\u6848\u80fd\u8bf4\u4ec0\u4e48\u3001\u4e0d\u80fd\u58f0\u79f0\u4ec0\u4e48", "11\u79cd rubric \u751f\u6210\u5668\u5728\u65e0\u504f150\u9898\u5207\u5206\u4e0a\u67098%\u201326%\u7684\u53ef\u5229\u7528\u7387\uff0c\u5728\u538b\u529b\u5207\u5206\u4e0a\u6700\u5f3a\u751f\u6210\u5668\u4ecd\u670936%\u88ab\u5229\u7528", "\u5355\u4e00\u901a\u7528 rubric \u88ab\u5229\u752864%\uff0c\u4f467\u4e2a\u5b9a\u5236 rubric \u751f\u6210\u5668\u66f4\u5dee\uff0c\u8bf4\u660e\u95ee\u9898\u5728\u4e8e\u5177\u4f53\u4f46\u9519\u8bef\u7684\u8bc4\u5206\u5bfc\u5411"], "keywords": ["\u6a21\u578b\u8bc4\u6d4b", "\u5956\u52b1\u5efa\u6a21", "\u5bf9\u6297\u9c81\u68d2\u6027", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16816v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ImpossibleRubrics: Stress-Testing Generated Rubrics as Reward Signals", "tldr": "\u68c0\u9a8c\u751f\u6210\u5f0f\u8bc4\u5206\u6807\u51c6\u6613\u88ab\u5bf9\u6297\u7b54\u6848\u5229\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ImpossibleRubrics\uff0c\u4e00\u4e2a\u5305\u542b169\u4e2a\u201c\u4e0d\u53ef\u80fd\u4efb\u52a1\u201d\u548c\u53ef\u9a8c\u8bc1\u8bda\u5b9e\u6027\u8bc1\u4e66\u7684\u57fa\u51c6\uff0c\u7528\u4e8e\u538b\u529b\u6d4b\u8bd5\u7531\u8bed\u8a00\u6a21\u578b\u751f\u6210\u7684\u8bc4\u5206\u6807\u51c6\u4f5c\u4e3a\u5956\u52b1\u4fe1\u53f7\u65f6\u662f\u5426\u53ef\u9760\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u591a\u79cd rubric \u751f\u6210\u5668\u4f1a\u5956\u52b1\u8fdd\u53cd\u8bc1\u4e66\u7684\u4f2a\u9020\u7b54\u6848\uff0c\u4e14\u4e3a\u4efb\u52a1\u5b9a\u5236\u7684\u8bc4\u5206\u6807\u51c6\u6709\u65f6\u6bd4\u901a\u7528\u6807\u51c6\u66f4\u6613\u88ab\u653b\u51fb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u6311\u6218\u4e86 rubric-based RL\u3001LLM-as-a-judge \u548c\u81ea\u52a8\u8bc4\u5206\u4e2d\u201c\u751f\u6210\u8bc4\u5206\u6807\u51c6\u53ef\u4f5c\u4e3a\u53ef\u9760\u5956\u52b1\u201d\u7684\u5047\u8bbe\uff0c\u63ed\u793a\u4e86\u5b9a\u5236\u5316\u8bc4\u5206\u6807\u51c6\u53ef\u80fd\u6cc4\u9732\u653b\u51fb\u65b9\u5411\uff0c\u5bf9\u6784\u5efa\u7a33\u5065\u8bc4\u6d4b\u4e0e\u5956\u52b1\u6a21\u578b\u5177\u6709\u91cd\u8981\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) post-training drives the frontier capabilities of large language models, with its wall-clock dominated by autoregressive rollout generation. Speculative decoding is an established remedy for this bottleneck, but existing draft heads must be pretrained or warmed up before RL, introducing substantial training cost outside the RL run to be accelerated. We observe that RL training itself provides both conditions required for online draft-head training: its rollout distribution is far narrower than that of pretraining, and its verification step continuously produces supervision signals aligned with this distribution. Building on these observations, we propose GrowMTP, which uses this supervision to train a draft head from scratch entirely within the RL loop, with all head updates detached from the policy backbone. On Qwen3-4B (no draft head), MiMo-7B-SFT (weak head), and Qwen3.5-4B-Base (strong head), GrowMTP achieves rollout speedups of 2.13x, 1.93x, and 1.36x, and end-to-end speedups of 1.60x, 1.41x, and 1.20x, respectively. GrowMTP therefore serves existing RL training frameworks as a modular component, particularly offering a from-scratch acceleration path for models without pretrained draft heads.", "arxiv_id": "2609.16648", "arxiv_url": "https://arxiv.org/abs/2609.16648", "authors": ["Minghua He", "Lingzhe Zhang", "Yuan Liu", "Xiao Zhou", "Aiwei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa GrowMTP\uff0c\u5728\u5927\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684 rollout \u8fc7\u7a0b\u4e2d\uff0c\u5229\u7528\u9a8c\u8bc1\u6b65\u9aa4\u4ea7\u751f\u7684\u76d1\u7763\u4fe1\u53f7\u5728\u7ebf\u8bad\u7ec3 draft head\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u9884\u8bad\u7ec3\u6216\u9884\u70ed\u8349\u7a3f\u5934\uff0c\u5e76\u5c06\u5934\u90e8\u66f4\u65b0\u4e0e\u7b56\u7565\u4e3b\u5e72\u89e3\u8026\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16648", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528 RL rollout \u5206\u5e03\u8f83\u7a84\u3001\u9a8c\u8bc1\u9636\u6bb5\u6301\u7eed\u63d0\u4f9b\u76d1\u7763\u8fd9\u4e24\u4e2a\u7279\u6027\uff0c\u5728 RL \u5faa\u73af\u5185\u4ece\u96f6\u8bad\u7ec3 draft head", "\u5728 Qwen3-4B\u3001MiMo-7B-SFT\u3001Qwen3.5-4B-Base \u4e0a\u5206\u522b\u5b9e\u73b0 2.13x\u30011.93x\u30011.36x \u7684 rollout \u52a0\u901f", "\u7aef\u5230\u7aef\u8bad\u7ec3\u52a0\u901f\u5206\u522b\u8fbe\u5230 1.60x\u30011.41x\u30011.20x\uff0c\u53ef\u4f5c\u4e3a\u73b0\u6709 RL \u8bad\u7ec3\u6846\u67b6\u7684\u6a21\u5757\u5316\u7ec4\u4ef6"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u6d4b\u89e3\u7801", "\u8bad\u7ec3\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16648v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GrowMTP: Can RL Grow Its Own Draft Head?", "tldr": "RL\u8fc7\u7a0b\u4e2d\u4ece\u96f6\u81ea\u8bad\u7ec3\u63a8\u6d4b\u89e3\u7801\u8349\u7a3f\u5934", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa GrowMTP\uff0c\u5728\u5927\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684 rollout \u8fc7\u7a0b\u4e2d\uff0c\u5229\u7528\u9a8c\u8bc1\u6b65\u9aa4\u4ea7\u751f\u7684\u76d1\u7763\u4fe1\u53f7\u5728\u7ebf\u8bad\u7ec3 draft head\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u9884\u8bad\u7ec3\u6216\u9884\u70ed\u8349\u7a3f\u5934\uff0c\u5e76\u5c06\u5934\u90e8\u66f4\u65b0\u4e0e\u7b56\u7565\u4e3b\u5e72\u89e3\u8026\u3002", "why_notable": "\u5b83\u628a\u63a8\u6d4b\u89e3\u7801\u52a0\u901f\u4ece\u4f9d\u8d56\u989d\u5916\u9884\u8bad\u7ec3\u8349\u7a3f\u5934\uff0c\u53d8\u4e3a RL \u8bad\u7ec3\u5185\u81ea\u4e3e\u5b8c\u6210\uff0c\u964d\u4f4e\u4e86\u540e\u8bad\u7ec3\u52a0\u901f\u7684\u524d\u7f6e\u6210\u672c\uff0c\u5c24\u5176\u9002\u5408\u6ca1\u6709 draft head \u7684\u5f00\u6e90\u6216\u81ea\u7814\u6a21\u578b\u3002"}, {"abstract": "Open-weight language models publish the strings their chat templates use to mark turns, roles and tool results, which the tokenizer maps back to the reserved identifiers the model obeys. Anyone who controls text in a prompt can therefore write a turn boundary indistinguishable from one the serving stack wrote. We audit 256 deployed chat tokenizers. All are forgeable, and the flag usually recommended as a fix leaves 56.6% forgeable because it misses the tool and reasoning markers agent systems rely on. We propose nameless tokenization, which leaves the control entries with a reserved identifier and no surface string, so the content encoder cannot emit one and message content reaches the model unaltered. Across five tokenizer families it reproduces the standard token stream exactly on attack-free data and lifts accuracy on a probe of delimiter-bearing text from 8.5% to 59.9%, where sanitizers lose it. Separating a delimiter\u0027s appearance from its identifier shows the identifier matters little against a bare task instruction, but carries most of a forged tool result and most of any forged turn once the system message tells the model to treat user content as data.", "arxiv_id": "2609.16984", "arxiv_url": "https://arxiv.org/abs/2609.16984", "authors": ["Kisu Yang", "Yoonna Jang", "Heuiseok Lim"], "brief": "\u8bba\u6587\u5ba1\u8ba1\u4e86256\u4e2a\u5df2\u90e8\u7f72\u804a\u5929\u5206\u8bcd\u5668\uff0c\u53d1\u73b0\u5176\u804a\u5929\u6a21\u677f\u4e2d\u7684\u89d2\u8272\u3001\u8f6e\u6b21\u3001\u5de5\u5177\u7ed3\u679c\u7b49\u63a7\u5236\u5b57\u7b26\u4e32\u5747\u53ef\u88ab\u7528\u6237\u6587\u672c\u4f2a\u9020\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u65e0\u540d\u5206\u8bcd\u201d\uff0c\u8ba9\u63a7\u5236token\u4fdd\u7559\u4e13\u7528ID\u4f46\u4e0d\u66b4\u9732\u8868\u9762\u5b57\u7b26\u4e32\uff0c\u4ece\u5206\u8bcd\u5668\u5c42\u9762\u963b\u65ad\u5185\u5bb9\u7f16\u7801\u751f\u6210\u63a7\u5236token\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16984", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["256\u4e2a\u804a\u5929\u5206\u8bcd\u5668\u5168\u90e8\u5b58\u5728\u63a7\u5236token\u53ef\u4f2a\u9020\u95ee\u9898\uff0c\u5e38\u89c1\u4fee\u590d\u6807\u5fd7\u4ecd\u670956.6%\u672a\u8986\u76d6\u5de5\u5177\u4e0e\u63a8\u7406\u6807\u8bb0\u3002", "\u65e0\u540d\u5206\u8bcd\u5728\u65e0\u653b\u51fb\u6570\u636e\u4e0a\u53ef\u7cbe\u786e\u590d\u73b0\u6807\u51c6token\u6d41\uff0c\u4e0d\u6539\u53d8\u6b63\u5e38\u6d88\u606f\u5185\u5bb9\u8f93\u5165\u3002", "\u5728\u542b\u5206\u9694\u7b26\u6587\u672c\u63a2\u9488\u4e0a\uff0c\u51c6\u786e\u7387\u4ece8.5%\u63d0\u5347\u523059.9%\uff0c\u4f18\u4e8e\u4f1a\u7834\u574f\u539f\u6587\u7684\u6e05\u6d17\u5668\u65b9\u6848\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u5206\u8bcd\u5668", "\u63d0\u793a\u6ce8\u5165", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16984v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Nameless Tokenization: A Lossless Tokenizer-Level Defense Against Control-Token Forgery in Open-Weight LLMs", "tldr": "\u65e0\u540d\u5206\u8bcd\u9632\u6b62\u5f00\u6e90LLM\u63a7\u5236\u7b26\u4f2a\u9020", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5ba1\u8ba1\u4e86256\u4e2a\u5df2\u90e8\u7f72\u804a\u5929\u5206\u8bcd\u5668\uff0c\u53d1\u73b0\u5176\u804a\u5929\u6a21\u677f\u4e2d\u7684\u89d2\u8272\u3001\u8f6e\u6b21\u3001\u5de5\u5177\u7ed3\u679c\u7b49\u63a7\u5236\u5b57\u7b26\u4e32\u5747\u53ef\u88ab\u7528\u6237\u6587\u672c\u4f2a\u9020\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u65e0\u540d\u5206\u8bcd\u201d\uff0c\u8ba9\u63a7\u5236token\u4fdd\u7559\u4e13\u7528ID\u4f46\u4e0d\u66b4\u9732\u8868\u9762\u5b57\u7b26\u4e32\uff0c\u4ece\u5206\u8bcd\u5668\u5c42\u9762\u963b\u65ad\u5185\u5bb9\u7f16\u7801\u751f\u6210\u63a7\u5236token\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f00\u6e90LLM\u804a\u5929\u6a21\u677f\u516c\u5f00\u5e26\u6765\u7684\u7cfb\u7edf\u6027\u5b89\u5168\u98ce\u9669\uff0c\u5e76\u7ed9\u51fa\u4e00\u79cd\u65e0\u9700\u6539\u6a21\u578b\u3001\u65e0\u635f\u4e14\u53ef\u8de8\u5206\u8bcd\u5668\u5bb6\u65cf\u9002\u914d\u7684\u5e95\u5c42\u9632\u5fa1\uff0c\u5bf9\u5de5\u5177\u8c03\u7528\u548c\u667a\u80fd\u4f53\u573a\u666f\u7684\u63d0\u793a\u6ce8\u5165\u9632\u62a4\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Text-conditioned latent diffusion models perform strongly in video generation and are promising backbones for robotic applications. However, existing approaches rely on pixel-level or VAE-based latent representations that lack explicit semantic structure, leaving the impact of the representation space largely unexplored. Slot-based object-centric representations offer a structured alternative by decomposing scenes into object-level latents, or slots. While they have shown success in dynamics modeling and planning, they have not yet been explored for diffusion-based generative modeling. We introduce SlotDiT, a text-guided Diffusion Transformer (DiT) that operates in a slot-based latent space. Given a reference image and a language instruction, SlotDiT decomposes the scene into object-centric slots representing individual entities. Conditioned on the instruction and observed scene context, the model autoregressively denoises future slot trajectories to predict scene dynamics. To systematically investigate latent-space design for diffusion transformers, we compare slot-based representations against VAE-based and semantics-aligned alternatives within a unified DiT framework. Our experiments show that using slots as DiT latents yields competitive video generation quality while consistently improving task-completion rates across four robotic datasets. Furthermore, their compact representation provides a computationally efficient alternative to VAE-based and semantics-aligned latent spaces. Overall, our results demonstrate that object-centric structure is a powerful inductive bias for diffusion-based generative modeling in robotic environments. The project page is available at https://slot-dit.github.io/.", "arxiv_id": "2609.17414", "arxiv_url": "https://arxiv.org/abs/2609.17414", "authors": ["Gjergj Plepi", "Sven Behnke"], "brief": "\u8bba\u6587\u63d0\u51fa SlotDiT\uff0c\u4e00\u4e2a\u5728\u5bf9\u8c61\u4e2d\u5fc3 slot \u6f5c\u7a7a\u95f4\u4e2d\u8fd0\u884c\u7684\u6587\u672c\u5f15\u5bfc Diffusion Transformer\u3002\u6a21\u578b\u5c06\u53c2\u8003\u56fe\u50cf\u5206\u89e3\u4e3a\u5bf9\u8c61\u7ea7\u8868\u793a\uff0c\u5e76\u7ed3\u5408\u8bed\u8a00\u6307\u4ee4\u81ea\u56de\u5f52\u53bb\u566a\u672a\u6765 slot \u8f68\u8ff9\u4ee5\u9884\u6d4b\u573a\u666f\u52a8\u6001\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17414", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06 slot-based \u5bf9\u8c61\u4e2d\u5fc3\u8868\u793a\u5f15\u5165\u6269\u6563\u5f0f\u89c6\u9891\u751f\u6210\uff0c\u66ff\u4ee3\u4f20\u7edf\u50cf\u7d20\u7ea7\u6216 VAE \u6f5c\u8868\u793a\u3002", "\u5728\u7edf\u4e00 DiT \u6846\u67b6\u4e0b\u7cfb\u7edf\u6bd4\u8f83 slot\u3001VAE \u548c\u8bed\u4e49\u5bf9\u9f50\u6f5c\u7a7a\u95f4\u8bbe\u8ba1\u3002", "\u5728\u56db\u4e2a\u673a\u5668\u4eba\u6570\u636e\u96c6\u4e0a\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u89c6\u9891\u751f\u6210\u8d28\u91cf\uff0c\u540c\u65f6\u63d0\u5347\u4efb\u52a1\u5b8c\u6210\u7387\u5e76\u964d\u4f4e\u8ba1\u7b97\u5f00\u9500\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u673a\u5668\u4eba", "\u5bf9\u8c61\u4e2d\u5fc3\u8868\u793a", "\u89c6\u9891\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17414v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SlotDiT: Object-Centric Representations for Diffusion Transformers", "tldr": "\u7528\u5bf9\u8c61\u69fd\u8868\u793a\u63d0\u5347\u673a\u5668\u4eba\u89c6\u9891\u6269\u6563\u751f\u6210", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SlotDiT\uff0c\u4e00\u4e2a\u5728\u5bf9\u8c61\u4e2d\u5fc3 slot \u6f5c\u7a7a\u95f4\u4e2d\u8fd0\u884c\u7684\u6587\u672c\u5f15\u5bfc Diffusion Transformer\u3002\u6a21\u578b\u5c06\u53c2\u8003\u56fe\u50cf\u5206\u89e3\u4e3a\u5bf9\u8c61\u7ea7\u8868\u793a\uff0c\u5e76\u7ed3\u5408\u8bed\u8a00\u6307\u4ee4\u81ea\u56de\u5f52\u53bb\u566a\u672a\u6765 slot \u8f68\u8ff9\u4ee5\u9884\u6d4b\u573a\u666f\u52a8\u6001\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\u5bf9\u8c61\u4e2d\u5fc3\u7ed3\u6784\u53ef\u4f5c\u4e3a\u6269\u6563\u751f\u6210\u6a21\u578b\u5728\u673a\u5668\u4eba\u573a\u666f\u4e2d\u7684\u6709\u6548\u5f52\u7eb3\u504f\u7f6e\uff0c\u6709\u671b\u63d0\u5347\u9762\u5411\u64cd\u4f5c\u3001\u89c4\u5212\u548c\u52a8\u6001\u9884\u6d4b\u7684\u751f\u6210\u6a21\u578b\u53ef\u7528\u6027\u4e0e\u6548\u7387\u3002"}, {"abstract": "Multimodal Large Language Models have demonstrated impressive video understanding, yet their ability to reason over long-form narratives is often masked by visual-centric evaluations and inefficient context processing. Existing benchmarks over-rely on visual heuristics while marginalizing auditory cues, effectively reducing models to \"silent observers\" that bypass genuine cross-modal reasoning. Moreover, standard dense sampling creates an evidence-context trade-off: increasing frames to capture evidence inevitably leads to attention distraction and token explosion. To bridge these gaps, we present Video-HolmesV2, a novel benchmark designed for Deep Audio-Visual Coupling. Unlike previous works, it enforces an Evidence-Based Evaluation, requiring models to justify answers with precise spatio-temporal audio-visual evidence, thereby reducing confounding effects of guessing and hallucinated evidence. To support this, we introduce: (1) a Multi-Model Cross-Verification pipeline to ensure task rigor; (2) a Spatio-temporal Evidence-Aware Metric for fine-grained calibration. Furthermore, we propose an Audio-Text Guided Token Compression framework. By fusing task intent with auditory anchors, our method distills high-value reasoning cues to mitigate long-context noise. In our evaluation, even strong proprietary models achieve below 60% accuracy, while our approach outperforms comparable open-source omni-models.", "arxiv_id": "2609.17248", "arxiv_url": "https://arxiv.org/abs/2609.17248", "authors": ["Zhaoyang Wei", "Zipeng Wang", "Yushe Cao", "Chenhui Qiang", "Shuaibing Cheng", "Xuesong Yang", "Sen Nie", "Bowen Jiang", "Wenchao Ding", "Yanchao Hao", "Zheng Wei", "Xuehui Yu", "Zhenjun Han"], "brief": "\u8bba\u6587\u63d0\u51fa Video-HolmesV2\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u89c6\u9891\u6df1\u5ea6\u97f3\u89c6\u9891\u8026\u5408\u63a8\u7406\u7684\u57fa\u51c6\uff0c\u8981\u6c42\u6a21\u578b\u7528\u7cbe\u786e\u7684\u65f6\u7a7a\u97f3\u89c6\u9891\u8bc1\u636e\u652f\u6491\u7b54\u6848\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u97f3\u9891-\u6587\u672c\u5f15\u5bfc\u7684 token \u538b\u7f29\u6846\u67b6\uff0c\u4ee5\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u4e2d\u7684\u566a\u58f0\u4e0e token \u81a8\u80c0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17248", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u5f3a\u8c03 Evidence-Based Evaluation\uff0c\u8981\u6c42\u5b9a\u4f4d\u5e76\u5f15\u7528\u5177\u4f53\u65f6\u7a7a\u97f3\u89c6\u9891\u8bc1\u636e\uff0c\u51cf\u5c11\u731c\u6d4b\u548c\u5e7b\u89c9\u8bc1\u636e\u5f71\u54cd", "\u5f15\u5165\u591a\u6a21\u578b\u4ea4\u53c9\u9a8c\u8bc1\u6d41\u7a0b\u4fdd\u8bc1\u4efb\u52a1\u4e25\u8c28\u6027\uff0c\u5e76\u8bbe\u8ba1\u65f6\u7a7a\u8bc1\u636e\u611f\u77e5\u6307\u6807\u7528\u4e8e\u7ec6\u7c92\u5ea6\u8bc4\u4f30", "\u5b9e\u9a8c\u663e\u793a\u5f3a\u95ed\u6e90\u6a21\u578b\u51c6\u786e\u7387\u4ecd\u4f4e\u4e8e60%\uff0c\u6240\u63d0\u538b\u7f29\u65b9\u6cd5\u4f18\u4e8e\u53ef\u6bd4\u5f00\u6e90 omni-models"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u97f3\u89c6\u9891\u63a8\u7406", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17248v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Video-HolmesV2: Can MLLMs Reason with Spatio-Temporal Audio-Visual Evidence in Long Videos?", "tldr": "\u957f\u89c6\u9891\u97f3\u89c6\u9891\u63a8\u7406\u57fa\u51c6\u4e0e\u8bc1\u636e\u538b\u7f29\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Video-HolmesV2\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u89c6\u9891\u6df1\u5ea6\u97f3\u89c6\u9891\u8026\u5408\u63a8\u7406\u7684\u57fa\u51c6\uff0c\u8981\u6c42\u6a21\u578b\u7528\u7cbe\u786e\u7684\u65f6\u7a7a\u97f3\u89c6\u9891\u8bc1\u636e\u652f\u6491\u7b54\u6848\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u97f3\u9891-\u6587\u672c\u5f15\u5bfc\u7684 token \u538b\u7f29\u6846\u67b6\uff0c\u4ee5\u7f13\u89e3\u957f\u4e0a\u4e0b\u6587\u4e2d\u7684\u566a\u58f0\u4e0e token \u81a8\u80c0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u73b0\u6709\u89c6\u9891\u7406\u89e3\u8bc4\u6d4b\u8fc7\u5ea6\u4f9d\u8d56\u89c6\u89c9\u7ebf\u7d22\u3001\u5ffd\u89c6\u97f3\u9891\u4fe1\u606f\u7684\u95ee\u9898\uff0c\u5e76\u4e3a\u957f\u89c6\u9891\u8de8\u6a21\u6001\u63a8\u7406\u63d0\u4f9b\u66f4\u4e25\u683c\u7684\u8bc4\u6d4b\u65b9\u5f0f\u548c\u5b9e\u7528\u7684\u4e0a\u4e0b\u6587\u538b\u7f29\u65b9\u6848\u3002"}, {"abstract": "Human videos provide rich manipulation experience, but extracting action representations that preserve useful motion remains challenging. Visual reconstruction alone can entangle manipulation-related motion with appearance changes and camera movement. We present GeoLAM, a framework for learning geometry-grounded latent actions from action-free human videos. GeoLAM combines future-frame reconstruction through a frozen geometric feature hierarchy with motion supervision from a training-only 4D geometry teacher. The geometric representation provides a structural prior, while the teacher\u0027s predictions yield spatially pooled targets capturing 3D displacement, residual image-plane motion, and surface-orientation changes. Visibility and confidence weighting reduces the contribution of unreliable estimates, encouraging continuous latent actions to retain geometric motion without explicit hand-pose or hand-trajectory annotations. After video pretraining without action labels, the learned representation provides transition targets for a world-action model trained on action-labeled robot demonstrations. The model jointly denoises latent actions and executable action chunks, with future-video prediction used only as an auxiliary training task. Deployment therefore requires neither the geometry teacher nor future-video generation. Evaluations on a latent-action benchmark and robotic manipulation tasks demonstrate the strong performance of GeoLAM.", "arxiv_id": "2609.17099", "arxiv_url": "https://arxiv.org/abs/2609.17099", "authors": ["Yifan Xie", "Hekun Tian", "Jinkun Liu", "YuAn Wang", "Qiao Sun", "Wenbo Ding"], "brief": "GeoLAM \u662f\u4e00\u4e2a\u4ece\u65e0\u52a8\u4f5c\u6807\u7b7e\u4eba\u7c7b\u89c6\u9891\u4e2d\u5b66\u4e60\u51e0\u4f55\u624e\u6839\u6f5c\u5728\u52a8\u4f5c\u8868\u793a\u7684\u6846\u67b6\u3002\u5b83\u5229\u7528\u51bb\u7ed3\u51e0\u4f55\u7279\u5f81\u5c42\u7ea7\u505a\u672a\u6765\u5e27\u91cd\u5efa\uff0c\u5e76\u501f\u52a9\u8bad\u7ec3\u9636\u6bb5\u7684 4D \u51e0\u4f55\u6559\u5e08\u63d0\u4f9b\u8fd0\u52a8\u76d1\u7763\uff0c\u6700\u7ec8\u8fc1\u79fb\u5230\u673a\u5668\u4eba\u793a\u6559\u4e2d\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17099", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u51e0\u4f55\u7279\u5f81\u800c\u975e\u7eaf\u50cf\u7d20\u91cd\u5efa\uff0c\u51cf\u5c11\u5916\u89c2\u53d8\u5316\u548c\u76f8\u673a\u8fd0\u52a8\u5bf9\u64cd\u4f5c\u52a8\u4f5c\u8868\u793a\u7684\u5e72\u6270\u3002", "\u8bad\u7ec3\u65f6 4D \u51e0\u4f55\u6559\u5e08\u63d0\u4f9b 3D \u4f4d\u79fb\u3001\u6b8b\u4f59\u56fe\u50cf\u5e73\u9762\u8fd0\u52a8\u548c\u8868\u9762\u671d\u5411\u53d8\u5316\u7b49\u7a7a\u95f4\u6c60\u5316\u76ee\u6807\uff0c\u5e76\u7528\u53ef\u89c1\u6027\u4e0e\u7f6e\u4fe1\u5ea6\u52a0\u6743\u6291\u5236\u566a\u58f0\u3002", "\u90e8\u7f72\u9636\u6bb5\u4e0d\u9700\u8981\u51e0\u4f55\u6559\u5e08\u6216\u672a\u6765\u89c6\u9891\u751f\u6210\uff0c\u6a21\u578b\u8054\u5408\u53bb\u566a\u6f5c\u52a8\u4f5c\u4e0e\u53ef\u6267\u884c\u52a8\u4f5c\u7247\u6bb5\uff0c\u5728\u6f5c\u52a8\u4f5c\u57fa\u51c6\u548c\u673a\u5668\u4eba\u64cd\u4f5c\u4efb\u52a1\u4e0a\u8868\u73b0\u5f3a\u52b2\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u9891\u8868\u5f81", "\u4e16\u754c\u6a21\u578b", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17099v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GeoLAM: Learning Geometry-Grounded Latent Actions from Unlabeled Human Videos", "tldr": "\u4ece\u65e0\u6807\u6ce8\u4eba\u7c7b\u89c6\u9891\u5b66\u4e60\u51e0\u4f55\u624e\u6839\u6f5c\u52a8\u4f5c", "upvotes": 0, "what_it_is": "GeoLAM \u662f\u4e00\u4e2a\u4ece\u65e0\u52a8\u4f5c\u6807\u7b7e\u4eba\u7c7b\u89c6\u9891\u4e2d\u5b66\u4e60\u51e0\u4f55\u624e\u6839\u6f5c\u5728\u52a8\u4f5c\u8868\u793a\u7684\u6846\u67b6\u3002\u5b83\u5229\u7528\u51bb\u7ed3\u51e0\u4f55\u7279\u5f81\u5c42\u7ea7\u505a\u672a\u6765\u5e27\u91cd\u5efa\uff0c\u5e76\u501f\u52a9\u8bad\u7ec3\u9636\u6bb5\u7684 4D \u51e0\u4f55\u6559\u5e08\u63d0\u4f9b\u8fd0\u52a8\u76d1\u7763\uff0c\u6700\u7ec8\u8fc1\u79fb\u5230\u673a\u5668\u4eba\u793a\u6559\u4e2d\u7684\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5927\u89c4\u6a21\u65e0\u6807\u6ce8\u4eba\u7c7b\u89c6\u9891\u4e2d\u7684\u64cd\u4f5c\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u4f9b\u673a\u5668\u4eba\u5b66\u4e60\u7684\u51e0\u4f55\u8fd0\u52a8\u8868\u793a\uff0c\u964d\u4f4e\u4e86\u5bf9\u624b\u90e8\u59ff\u6001\u3001\u8f68\u8ff9\u6216\u52a8\u4f5c\u6807\u7b7e\u7684\u4f9d\u8d56\uff0c\u5177\u6709\u63d0\u5347\u673a\u5668\u4eba\u6a21\u4eff\u5b66\u4e60\u6570\u636e\u6548\u7387\u548c\u6cdb\u5316\u80fd\u529b\u7684\u6f5c\u529b\u3002"}, {"abstract": "Traditional multimodal representation learning and generation are two stages: a contrastive or self-supervised visual encoder is trained first, followed by a separate downstream generative model. This setup bottlenecks generative performance behind frozen embeddings. To bridge this gap, we revisit joint multimodal representation learning and generation to produce linearly interpolatable embeddings that are directly consumable by generative decoders. We present FLAT (Flexible-Length Aligned Transmodal representations), a representation pre-training framework that jointly optimizes a shared multimodal encoder alongside downstream text-to-image (T2I) and image-to-text (I2T) decoders. By combining contrastive alignment with bidirectional cross-modal generative objectives, FLAT ensures its representations function as both discriminative semantic descriptors and generative conditions. Architecturally, FLAT maps visual and textual inputs into a unified continuous 1D sequence space, applying nested dropout over prefix-K tokens to enable dynamic output lengths. A single pre-training stage allows FLAT to perform cross-modal retrieval and generation across variable prefix K, achieving a T2I GenEval score of 71.1. Task-specific fine-tuning aligns model performance with state-of-the-art baselines: 83.1 GenEval on T2I generation; 40.5 BLEU-4 and 138.6 CIDEr on MS-COCO image captioning; and Recall@5 scores of 86.8 (I2T) / 75.8 (T2I) on MS-COCO alongside 98.3 (I2T) / 93.6 (T2I) on Flickr30K. Finally, qualitative evaluations demonstrate that FLAT representations natively support linear interpolation, latent space arithmetic, and zero-shot composed retrieval.", "arxiv_id": "2609.16591", "arxiv_url": "https://arxiv.org/abs/2609.16591", "authors": ["Guangyu Sun", "Shlok Kumar Mishra", "Wentao Bao", "Robert Zhenheng Yang", "Xiao Wang", "Xiyuan Wang", "Yujunrong Ma", "Chen Yuan", "Max Xiangjun Fan", "Jun Xiao", "Jianpeng Cheng"], "brief": "FLAT \u63d0\u51fa\u4e00\u79cd\u8054\u5408\u9884\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u56fe\u50cf\u548c\u6587\u672c\u91cd\u91c7\u6837\u5230\u7edf\u4e00\u7684\u8fde\u7eed\u4e00\u7ef4\u53ef\u53d8\u957f\u8de8\u6a21\u6001 Token \u7a7a\u95f4\u3002\u5b83\u540c\u65f6\u4f18\u5316\u5bf9\u6bd4\u5f0f\u8de8\u6a21\u6001\u5bf9\u9f50\u4e0e\u53cc\u5411\u751f\u6210\u76ee\u6807\uff0c\u4f7f\u540c\u4e00\u8868\u5f81\u65e2\u80fd\u7528\u4e8e\u68c0\u7d22\uff0c\u4e5f\u80fd\u76f4\u63a5\u4f5c\u4e3a\u6587\u751f\u56fe\u3001\u56fe\u751f\u6587\u89e3\u7801\u5668\u6761\u4ef6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16591", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5171\u4eab\u591a\u6a21\u6001\u7f16\u7801\u5668\u8054\u5408\u8bad\u7ec3 T2I \u4e0e I2T \u89e3\u7801\u5668\uff0c\u7f13\u89e3\u4f20\u7edf\u51bb\u7ed3\u89c6\u89c9\u5d4c\u5165\u9650\u5236\u751f\u6210\u80fd\u529b\u7684\u95ee\u9898\u3002", "\u91c7\u7528 prefix-K \u5d4c\u5957 dropout\uff0c\u4f7f\u8868\u5f81\u652f\u6301\u52a8\u6001\u957f\u5ea6\u8f93\u51fa\uff0c\u5e76\u5728\u4e0d\u540c K \u4e0b\u8fdb\u884c\u68c0\u7d22\u4e0e\u751f\u6210\u3002", "\u5fae\u8c03\u540e\u5728 T2I GenEval \u8fbe\u5230 83.1\uff0cMS-COCO \u56fe\u50cf\u63cf\u8ff0\u8fbe\u5230 BLEU-4 40.5\u3001CIDEr 138.6\uff0c\u68c0\u7d22 Recall@5 \u5728 COCO \u4e0e Flickr30K \u4e0a\u8868\u73b0\u5f3a\u52b2\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u8868\u5f81\u5b66\u4e60", "\u56fe\u6587\u751f\u6210", "\u8de8\u6a21\u6001\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16591v1", "published_at": "2026-09-15", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FLAT: Resampling Image and Text into 1D Flexible-Length Aligned Transmodal Tokens for Retrieval and Generation", "tldr": "\u7edf\u4e00\u8868\u5f81\u8ba9\u68c0\u7d22\u4e0e\u751f\u6210\u5171\u7528\u53ef\u53d8\u957f\u8de8\u6a21\u6001Token", "upvotes": 0, "what_it_is": "FLAT \u63d0\u51fa\u4e00\u79cd\u8054\u5408\u9884\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u56fe\u50cf\u548c\u6587\u672c\u91cd\u91c7\u6837\u5230\u7edf\u4e00\u7684\u8fde\u7eed\u4e00\u7ef4\u53ef\u53d8\u957f\u8de8\u6a21\u6001 Token \u7a7a\u95f4\u3002\u5b83\u540c\u65f6\u4f18\u5316\u5bf9\u6bd4\u5f0f\u8de8\u6a21\u6001\u5bf9\u9f50\u4e0e\u53cc\u5411\u751f\u6210\u76ee\u6807\uff0c\u4f7f\u540c\u4e00\u8868\u5f81\u65e2\u80fd\u7528\u4e8e\u68c0\u7d22\uff0c\u4e5f\u80fd\u76f4\u63a5\u4f5c\u4e3a\u6587\u751f\u56fe\u3001\u56fe\u751f\u6587\u89e3\u7801\u5668\u6761\u4ef6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u8de8\u6a21\u6001\u8868\u5f81\u5b66\u4e60\u548c\u751f\u6210\u5efa\u6a21\u7edf\u4e00\u5230\u4e00\u4e2a\u53ef\u63d2\u503c\u3001\u53ef\u53d8\u957f\u7684\u6f5c\u5728\u7a7a\u95f4\u4e2d\uff0c\u589e\u5f3a\u4e86\u8868\u5f81\u5bf9\u751f\u6210\u89e3\u7801\u5668\u7684\u53ef\u7528\u6027\uff0c\u5e76\u5c55\u793a\u51fa\u7ebf\u6027\u63d2\u503c\u3001\u6f5c\u5728\u7a7a\u95f4\u7b97\u672f\u548c\u96f6\u6837\u672c\u7ec4\u5408\u68c0\u7d22\u7b49\u5b9e\u7528\u80fd\u529b\u3002"}, {"abstract": "Private deep neural network (DNN) inference based on hybrid homomorphic encryption (HE) and multi-party computation (MPC) can protect user data with a formal guarantee, but at the cost of significant latency overhead due to HE. Customized HE accelerators have been proposed and have achieved orders-of-magnitude speedup for individual HE operations. However, when directly applying a commercial HE accelerator to state-of-the-art HE-MPC frameworks, we observe only limited end-to-end performance gain. This is because HE-MPC frameworks often require wireless transmission of input and output ciphertexts for each HE operation, leading to a severe network communication bottleneck. To overcome this challenge, we introduce OptiPrime, a protocol-hardware co-optimization framework for efficient private DNN inference. OptiPrime features a novel HE protocol for convolutions that substantially reduces the number of transmitted output ciphertexts and mitigates the network communication bottleneck. Meanwhile, as the new protocol introduces complex computation for fewer output ciphertext, we observe new memory access challenges due to a high volume of weight plaintexts and intermediate ciphertexts. Hence, we further propose a lightweight compression system for the weight plaintexts, reducing memory traffic by 10 times, as well as a specialized dataflow to maximize on-chip data reuse of intermediate ciphertexts. Extensive experiments show that our framework outperforms the Cheetah baseline by at most 5.7 times on CPUs and 4.2 times with an accelerator.", "arxiv_id": "2609.16898", "arxiv_url": "https://arxiv.org/abs/2609.16898", "authors": ["Jiangrui Yu", "Ye Yu", "Si Chen", "Chenqi Lin", "Wenxuan Zeng", "Junfeng Fan", "Mingyu Gao", "Meng Li"], "brief": "\u8bba\u6587\u63d0\u51fa OptiPrime\uff0c\u4e00\u4e2a\u9762\u5411 HE-MPC \u9690\u79c1\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u63a8\u7406\u7684\u534f\u8bae-\u786c\u4ef6\u534f\u540c\u4f18\u5316\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u65b0\u7684\u5377\u79ef\u540c\u6001\u52a0\u5bc6\u534f\u8bae\u51cf\u5c11\u5bc6\u6587\u4f20\u8f93\uff0c\u5e76\u914d\u5408\u6743\u91cd\u538b\u7f29\u4e0e\u4e13\u7528\u6570\u636e\u6d41\u63d0\u5347\u7aef\u5230\u7aef\u6027\u80fd\u3002", "categories": ["cs.AR", "cs.CR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16898", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u5546\u7528 HE \u52a0\u901f\u5668\u76f4\u63a5\u63a5\u5165\u73b0\u6709 HE-MPC \u6846\u67b6\u65f6\u6536\u76ca\u6709\u9650\uff0c\u4e3b\u8981\u74f6\u9888\u8f6c\u79fb\u5230\u6bcf\u6b21 HE \u64cd\u4f5c\u7684\u65e0\u7ebf\u5bc6\u6587\u4f20\u8f93\u3002", "\u63d0\u51fa\u65b0\u7684\u5377\u79ef HE \u534f\u8bae\uff0c\u663e\u8457\u51cf\u5c11\u9700\u8981\u4f20\u8f93\u7684\u8f93\u51fa\u5bc6\u6587\u6570\u91cf\uff0c\u4ece\u800c\u7f13\u89e3\u7f51\u7edc\u901a\u4fe1\u74f6\u9888\u3002", "\u8bbe\u8ba1\u8f7b\u91cf\u7ea7\u6743\u91cd\u660e\u6587\u538b\u7f29\u7cfb\u7edf\uff0c\u5c06\u5185\u5b58\u6d41\u91cf\u964d\u4f4e\u7ea6 10 \u500d\uff0c\u5e76\u7528\u4e13\u7528\u6570\u636e\u6d41\u63d0\u5347\u4e2d\u95f4\u5bc6\u6587\u7684\u7247\u4e0a\u590d\u7528\u3002"], "keywords": ["\u9690\u79c1\u8ba1\u7b97", "\u540c\u6001\u52a0\u5bc6", "\u786c\u4ef6\u52a0\u901f", "\u6df1\u5ea6\u5b66\u4e60\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16898v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "OptiPrime: Optimizing Private Inference through Protocol-Hardware Co-design", "tldr": "\u534f\u8bae\u786c\u4ef6\u534f\u540c\u52a0\u901f\u9690\u79c1DNN\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa OptiPrime\uff0c\u4e00\u4e2a\u9762\u5411 HE-MPC \u9690\u79c1\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u63a8\u7406\u7684\u534f\u8bae-\u786c\u4ef6\u534f\u540c\u4f18\u5316\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u65b0\u7684\u5377\u79ef\u540c\u6001\u52a0\u5bc6\u534f\u8bae\u51cf\u5c11\u5bc6\u6587\u4f20\u8f93\uff0c\u5e76\u914d\u5408\u6743\u91cd\u538b\u7f29\u4e0e\u4e13\u7528\u6570\u636e\u6d41\u63d0\u5347\u7aef\u5230\u7aef\u6027\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03\u9690\u79c1\u63a8\u7406\u4e0d\u80fd\u53ea\u4f18\u5316\u5355\u4e2a HE \u8fd0\u7b97\uff0c\u800c\u9700\u8981\u534f\u8bae\u3001\u901a\u4fe1\u3001\u5185\u5b58\u4e0e\u786c\u4ef6\u6574\u4f53\u534f\u540c\uff1b\u76f8\u5bf9 Cheetah \u57fa\u7ebf\u5728 CPU \u4e0a\u6700\u9ad8\u63d0\u5347 5.7 \u500d\u3001\u7ed3\u5408\u52a0\u901f\u5668\u6700\u9ad8\u63d0\u5347 4.2 \u500d\uff0c\u5177\u5907\u8f83\u5f3a\u7cfb\u7edf\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "KV-cache eviction perturbs the conditional token distributions governing autoregressive generation. We investigate how first-divergence timing and subsequent token mismatch determine cumulative disagreement. We derive an exact decomposition under a specified stepwise maximal coupling: the expected mismatch fraction equals a first-mismatch contribution plus post-divergence exposure multiplied by its mismatch rate. An explicit construction over unrestricted autoregressive kernel pairs realizes the sharp interval of risks compatible with a finite divergence-aligned observation window. Residual-branch conditional Monte Carlo provides unbiased joint estimates of occurrence, occupation, and window/tail contributions, with per-replicate variance dominance for total token loss. Complete trajectories from Meta-Llama-3.1-8B-Instruct and Qwen2.5-7B-Instruct show that SnapKV at 50% retention enters divergence later and less often than SnapKV-512 or recent-token retention with the same 50% prompt-cache budget, while post-divergence total variation (TV) remains high. In an exploratory analysis of 288 documents, post-divergence exposure accounts for 85-90% of four aggregate mismatch gaps. On 288 independent documents at 90% retention, prespecified comparisons show higher branch-aligned TV in the late than in the early window in both models.", "arxiv_id": "2609.16617", "arxiv_url": "https://arxiv.org/abs/2609.16617", "authors": ["Xinyue Luo", "Fei Yu"], "brief": "\u8bba\u6587\u7814\u7a76KV-cache eviction\u5982\u4f55\u6270\u52a8\u81ea\u56de\u5f52\u751f\u6210\u7684\u6761\u4ef6\u5206\u5e03\uff0c\u5e76\u5c06\u7d2f\u8ba1token\u4e0d\u4e00\u81f4\u5206\u89e3\u4e3a\u9996\u6b21\u5206\u6b67\u65f6\u95f4\u4e0e\u5206\u6b67\u540e\u7684\u66b4\u9732/\u9519\u914d\u7387\u8d21\u732e\u3002\u4f5c\u8005\u7ed9\u51fa\u7cbe\u786e\u5206\u89e3\u3001\u98ce\u9669\u53ef\u8fbe\u533a\u95f4\u6784\u9020\u548c\u65e0\u504f\u8499\u7279\u5361\u6d1b\u4f30\u8ba1\uff0c\u5e76\u5728Llama\u4e0eQwen\u6a21\u578b\u4e0a\u9a8c\u8bc1\u4e0d\u540c\u7f13\u5b58\u4fdd\u7559\u7b56\u7565\u7684\u5f71\u54cd\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16617", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u6307\u5b9a\u7684\u9010\u6b65\u6700\u5927\u8026\u5408\u4e0b\uff0c\u671f\u671b\u9519\u914d\u6bd4\u4f8b\u53ef\u7cbe\u786e\u5206\u89e3\u4e3a\u9996\u6b21\u9519\u914d\u8d21\u732e\u4e0e\u5206\u6b67\u540e\u66b4\u9732\u65f6\u957f\u4e58\u4ee5\u9519\u914d\u7387\u3002", "\u63d0\u51fa\u6b8b\u5dee\u5206\u652f\u6761\u4ef6\u8499\u7279\u5361\u6d1b\u65b9\u6cd5\uff0c\u53ef\u65e0\u504f\u8054\u5408\u4f30\u8ba1\u5206\u6b67\u53d1\u751f\u3001\u5360\u7528\u65f6\u95f4\u3001\u7a97\u53e3/\u5c3e\u90e8\u8d21\u732e\uff0c\u5e76\u964d\u4f4e\u603btoken\u635f\u5931\u4f30\u8ba1\u65b9\u5dee\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u572850%\u7f13\u5b58\u9884\u7b97\u4e0b\uff0cSnapKV\u6bd4SnapKV-512\u6216recent-token\u4fdd\u7559\u66f4\u665a\u3001\u66f4\u5c11\u8fdb\u5165\u5206\u6b67\uff0c\u4f46\u5206\u6b67\u540e\u7684\u603b\u53d8\u5dee\u8ddd\u79bb\u4ecd\u7136\u8f83\u9ad8\uff1b85-90%\u7684\u603b\u4f53\u9519\u914d\u5dee\u8ddd\u6765\u81ea\u5206\u6b67\u540e\u66b4\u9732\u3002"], "keywords": ["KV\u7f13\u5b58", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u6982\u7387\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16617v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Divergence Timing and Cumulative Disagreement under KV-Cache Eviction", "tldr": "\u91cf\u5316KV\u7f13\u5b58\u6dd8\u6c70\u5bfc\u81f4\u751f\u6210\u5206\u6b67\u7684\u673a\u5236", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76KV-cache eviction\u5982\u4f55\u6270\u52a8\u81ea\u56de\u5f52\u751f\u6210\u7684\u6761\u4ef6\u5206\u5e03\uff0c\u5e76\u5c06\u7d2f\u8ba1token\u4e0d\u4e00\u81f4\u5206\u89e3\u4e3a\u9996\u6b21\u5206\u6b67\u65f6\u95f4\u4e0e\u5206\u6b67\u540e\u7684\u66b4\u9732/\u9519\u914d\u7387\u8d21\u732e\u3002\u4f5c\u8005\u7ed9\u51fa\u7cbe\u786e\u5206\u89e3\u3001\u98ce\u9669\u53ef\u8fbe\u533a\u95f4\u6784\u9020\u548c\u65e0\u504f\u8499\u7279\u5361\u6d1b\u4f30\u8ba1\uff0c\u5e76\u5728Llama\u4e0eQwen\u6a21\u578b\u4e0a\u9a8c\u8bc1\u4e0d\u540c\u7f13\u5b58\u4fdd\u7559\u7b56\u7565\u7684\u5f71\u54cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3aKV\u7f13\u5b58\u538b\u7f29/\u6dd8\u6c70\u5bf9\u751f\u6210\u8d28\u91cf\u7684\u5f71\u54cd\u63d0\u4f9b\u4e86\u53ef\u89e3\u91ca\u3001\u53ef\u4f30\u8ba1\u7684\u7406\u8bba\u6846\u67b6\uff0c\u4e0d\u53ea\u770b\u5e73\u5747\u635f\u5931\uff0c\u800c\u662f\u533a\u5206\u201c\u4f55\u65f6\u5206\u6b67\u201d\u548c\u201c\u5206\u6b67\u540e\u6301\u7eed\u591a\u4e45\u201d\uff0c\u6709\u52a9\u4e8e\u8bbe\u8ba1\u66f4\u53ef\u9760\u7684\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u52a0\u901f\u7b56\u7565\u3002"}, {"abstract": "Large Language Model (LLM) unlearning is essential for removing sensitive or copyrighted knowledge while preserving general utility. Existing methods often leave residual knowledge in intermediate representations, which can still be recovered. To address this, we propose Cascade, a hierarchical recoverability control framework that minimizes the internal identifiability of target knowledge. Cascade combines three complementary controls: path-level routing to suppress privacy-associated activation routes, representation-level compression to reduce geometric separability, and decoding-level intervention to limit residual recovery. Experiments on TOFU, MUSE-News, and WMDP, including robustness tests with query reformulation and extraction-style prompts, show that Cascade effectively reduces recoverability while maintaining stable model utility.", "arxiv_id": "2609.16890", "arxiv_url": "https://arxiv.org/abs/2609.16890", "authors": ["Qingchen Yu", "Shiying Duan", "Xiaodong Li", "Yuhua Wang", "Zhiyu Li", "Shiji Zhou", "Yifan Sun", "Zhaoxin Fan"], "brief": "\u672c\u6587\u63d0\u51fa Cascade\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u9057\u5fd8\u7684\u5206\u5c42\u53ef\u6062\u590d\u6027\u63a7\u5236\u6846\u67b6\uff0c\u76ee\u6807\u662f\u5728\u5220\u9664\u654f\u611f\u6216\u7248\u6743\u77e5\u8bc6\u7684\u540c\u65f6\u4fdd\u7559\u901a\u7528\u80fd\u529b\u3002\u5b83\u4ece\u6fc0\u6d3b\u8def\u5f84\u3001\u8868\u793a\u7a7a\u95f4\u548c\u89e3\u7801\u8f93\u51fa\u4e09\u4e2a\u5c42\u9762\u964d\u4f4e\u76ee\u6807\u77e5\u8bc6\u5728\u6a21\u578b\u5185\u90e8\u88ab\u8bc6\u522b\u548c\u6062\u590d\u7684\u53ef\u80fd\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16890", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8def\u5f84\u7ea7\u8def\u7531\u6291\u5236\u4e0e\u9690\u79c1\u77e5\u8bc6\u76f8\u5173\u7684\u6fc0\u6d3b\u901a\u8def\uff0c\u51cf\u5c11\u76ee\u6807\u77e5\u8bc6\u5728\u524d\u5411\u4f20\u64ad\u4e2d\u7684\u6b8b\u7559\u89e6\u53d1\u3002", "\u8868\u793a\u7ea7\u538b\u7f29\u964d\u4f4e\u76ee\u6807\u77e5\u8bc6\u8868\u793a\u7684\u51e0\u4f55\u53ef\u5206\u6027\uff0c\u4f7f\u4e2d\u95f4\u8868\u5f81\u66f4\u96be\u88ab\u63a2\u6d4b\u5668\u6216\u653b\u51fb\u6062\u590d\u3002", "\u89e3\u7801\u7ea7\u5e72\u9884\u9650\u5236\u6b8b\u4f59\u77e5\u8bc6\u4ece\u8f93\u51fa\u7aef\u88ab\u63d0\u53d6\uff1b\u5728 TOFU\u3001MUSE-News\u3001WMDP \u4e0a\u7ecf\u67e5\u8be2\u6539\u5199\u548c\u62bd\u53d6\u5f0f\u63d0\u793a\u6d4b\u8bd5\u4ecd\u4fdd\u6301\u8f83\u5f3a\u9c81\u68d2\u6027\u3002"], "keywords": ["\u6a21\u578b\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9690\u79c1\u4fdd\u62a4", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16890v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cascade: Hierarchical Recoverability Control for Large Language Model Unlearning", "tldr": "Cascade\u5206\u5c42\u6291\u5236LLM\u9057\u5fd8\u540e\u77e5\u8bc6\u53ef\u6062\u590d\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa Cascade\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u9057\u5fd8\u7684\u5206\u5c42\u53ef\u6062\u590d\u6027\u63a7\u5236\u6846\u67b6\uff0c\u76ee\u6807\u662f\u5728\u5220\u9664\u654f\u611f\u6216\u7248\u6743\u77e5\u8bc6\u7684\u540c\u65f6\u4fdd\u7559\u901a\u7528\u80fd\u529b\u3002\u5b83\u4ece\u6fc0\u6d3b\u8def\u5f84\u3001\u8868\u793a\u7a7a\u95f4\u548c\u89e3\u7801\u8f93\u51fa\u4e09\u4e2a\u5c42\u9762\u964d\u4f4e\u76ee\u6807\u77e5\u8bc6\u5728\u6a21\u578b\u5185\u90e8\u88ab\u8bc6\u522b\u548c\u6062\u590d\u7684\u53ef\u80fd\u6027\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u5173\u6ce8\u6700\u7ec8\u8f93\u51fa\u7684\u9057\u5fd8\u65b9\u6cd5\uff0cCascade \u76f4\u63a5\u9488\u5bf9\u4e2d\u95f4\u8868\u793a\u4e2d\u7684\u6b8b\u7559\u77e5\u8bc6\u53ef\u6062\u590d\u6027\uff0c\u63d0\u4f9b\u4e86\u66f4\u7cfb\u7edf\u7684\u9690\u79c1\u4e0e\u7248\u6743\u77e5\u8bc6\u5220\u9664\u601d\u8def\uff0c\u5bf9\u63d0\u9ad8 LLM unlearning \u7684\u5b89\u5168\u6027\u548c\u53ef\u9a8c\u8bc1\u6027\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal large language models generate natural-language responses from visual inputs, yet may mention objects absent from an image. In medication assistance, accessible perception, and environmental decision-making, such hallucinations can create real-world safety risks. We propose Semantic-Spatial Agreement Verification (SSAV), a training-free method for verifying object claims. A visually grounded claim should remain stable across semantically equivalent queries and repeatedly localize to the same image region. SSAV aggregates multiple prompts to estimate semantic support and reduce sensitivity to query wording. Query-Induced Regional Verification (QIRV) combines cross-query region persistence, spatial overlap, and relative candidate dominance to identify isolated high responses and dispersed localizations. A geometric mean fuses semantic and spatial evidence, lowering the verification score when either branch lacks support. Experiments on three base models and multiple evaluation protocols show that SSAV effectively mitigates object hallucination. On LLaVA-1.5-7B, accuracy averaged across COCO, A-OKVQA, and GQA improves by 1.81 and 3.17 percentage points under POPE Popular and Adversarial, respectively, while CHAIRs decreases from 49.40% to 32.80%. These results show that cross-query semantic stability and regional consistency provide interpretable external visual evidence for object claims.", "arxiv_id": "2609.17269", "arxiv_url": "https://arxiv.org/abs/2609.17269", "authors": ["Ziheng Ren", "Qian Gao", "Jun Fan", "Guohui Ding", "Zhenyu Yang", "Yuteng Xiao"], "brief": "\u8bba\u6587\u63d0\u51fa Semantic-Spatial Agreement Verification\uff08SSAV\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u7269\u4f53\u58f0\u660e\u9a8c\u8bc1\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7b49\u4ef7\u67e5\u8be2\u4e0b\u7684\u8bed\u4e49\u7a33\u5b9a\u6027\u4e0e\u56fe\u50cf\u533a\u57df\u5b9a\u4f4d\u4e00\u81f4\u6027\uff0c\u5224\u65ad\u6a21\u578b\u63d0\u5230\u7684\u7269\u4f53\u662f\u5426\u771f\u5b9e\u5b58\u5728\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17269", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u591a\u79cd\u8bed\u4e49\u7b49\u4ef7\u63d0\u793a\u805a\u5408\u8bc1\u636e\uff0c\u964d\u4f4e\u6a21\u578b\u56de\u7b54\u5bf9\u63d0\u793a\u63aa\u8f9e\u7684\u654f\u611f\u6027\uff0c\u4f30\u8ba1\u7269\u4f53\u58f0\u660e\u7684\u8bed\u4e49\u652f\u6301\u5ea6", "\u63d0\u51fa Query-Induced Regional Verification\uff08QIRV\uff09\uff0c\u7ed3\u5408\u8de8\u67e5\u8be2\u533a\u57df\u6301\u4e45\u6027\u3001\u7a7a\u95f4\u91cd\u53e0\u548c\u5019\u9009\u533a\u57df\u76f8\u5bf9\u4f18\u52bf\uff0c\u68c0\u6d4b\u865a\u5047\u6216\u4e0d\u7a33\u5b9a\u5b9a\u4f4d", "\u5728 LLaVA-1.5-7B \u4e0a\uff0cPOPE Popular \u4e0e Adversarial \u5e73\u5747\u51c6\u786e\u7387\u5206\u522b\u63d0\u5347 1.81 \u548c 3.17 \u4e2a\u767e\u5206\u70b9\uff0cCHAIRs \u4ece 49.40% \u964d\u81f3 32.80%"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u68c0\u6d4b", "\u89c6\u89c9\u95ee\u7b54", "\u6a21\u578b\u6821\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17269v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Semantic-Spatial Agreement Verification for Mitigating Object Hallucination in Multimodal Large Language Models", "tldr": "\u7528\u8bed\u4e49\u4e0e\u7a7a\u95f4\u4e00\u81f4\u6027\u65e0\u8bad\u7ec3\u6291\u5236\u591a\u6a21\u6001\u5e7b\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Semantic-Spatial Agreement Verification\uff08SSAV\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u7269\u4f53\u58f0\u660e\u9a8c\u8bc1\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7b49\u4ef7\u67e5\u8be2\u4e0b\u7684\u8bed\u4e49\u7a33\u5b9a\u6027\u4e0e\u56fe\u50cf\u533a\u57df\u5b9a\u4f4d\u4e00\u81f4\u6027\uff0c\u5224\u65ad\u6a21\u578b\u63d0\u5230\u7684\u7269\u4f53\u662f\u5426\u771f\u5b9e\u5b58\u5728\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u5373\u53ef\u4f5c\u4e3a\u5916\u90e8\u9a8c\u8bc1\u6a21\u5757\u7f13\u89e3\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u7269\u4f53\u5e7b\u89c9\uff0c\u5e76\u63d0\u4f9b\u53ef\u89e3\u91ca\u7684\u89c6\u89c9\u8bc1\u636e\uff1b\u5bf9\u533b\u7597\u8f85\u52a9\u3001\u65e0\u969c\u788d\u611f\u77e5\u7b49\u9ad8\u5b89\u5168\u8981\u6c42\u573a\u666f\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "When strong multimodal models are widely available, progress requires new scientific methodologies beyond benchmark scores---using models as instruments for understanding behavior. We address this by asking: can we use large vision-language models (LVLMs) as experimental instruments for studying their own failure dynamics? Focusing on visual hallucination, we introduce SAFE, a training-free decoding framework that contrasts visually-grounded and vision-ablated generation paths to produce a token-level contrastive grounding score that identifies when the model favors linguistic priors over visual evidence. This signal serves dual roles: as a practical proxy for detecting visually-ungrounded tokens, and as the basis for decoding-time penalties. Our analysis yields three empirical observations: visual dependency decays over generation, hallucinations co-occur in temporal clusters, and early intervention reduces clustering without substantially degrading fluency. On MMHalBench, SAFE substantially outperforms all compared baselines; results elsewhere are more mixed. We argue that designing contrastive probes exemplifies a broader mission: using models as instruments for scientific understanding. Code: https://github.com/zhaozhipeng1997/SAFE_public.", "arxiv_id": "2609.16646", "arxiv_url": "https://arxiv.org/abs/2609.16646", "authors": ["Zhipeng Zhao", "Wenxu Wang", "Peishun Liu", "Ruichun Tang"], "brief": "\u8bba\u6587\u63d0\u51fa SAFE\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u5bf9\u6bd4\u89e3\u7801\u6846\u67b6\uff0c\u901a\u8fc7\u6bd4\u8f83\u89c6\u89c9\u8f93\u5165\u6b63\u5e38\u4e0e\u89c6\u89c9\u6d88\u878d\u4e24\u6761\u751f\u6210\u8def\u5f84\uff0c\u4e3a\u6bcf\u4e2a token \u8ba1\u7b97\u89c6\u89c9 grounding \u5206\u6570\uff0c\u7528\u4e8e\u8bc6\u522b\u6a21\u578b\u4f55\u65f6\u4f9d\u8d56\u8bed\u8a00\u5148\u9a8c\u800c\u975e\u89c6\u89c9\u8bc1\u636e\u3002", "categories": ["cs.CV", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16646", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["SAFE \u53ef\u4f5c\u4e3a\u89c6\u89c9\u672a\u5bf9\u9f50 token \u7684\u68c0\u6d4b\u4ee3\u7406\u4fe1\u53f7\uff0c\u4e5f\u53ef\u5728\u89e3\u7801\u65f6\u52a0\u5165\u60e9\u7f5a\u4ee5\u6291\u5236\u5e7b\u89c9\u751f\u6210", "\u5b9e\u8bc1\u53d1\u73b0\u89c6\u89c9\u4f9d\u8d56\u4f1a\u968f\u751f\u6210\u8fc7\u7a0b\u8870\u51cf\uff0c\u5e7b\u89c9\u5e38\u4ee5\u65f6\u95f4\u7c07\u5f62\u5f0f\u8fde\u7eed\u51fa\u73b0\uff0c\u65e9\u671f\u5e72\u9884\u53ef\u51cf\u5c11\u805a\u7c07\u4e14\u57fa\u672c\u4e0d\u635f\u5bb3\u6d41\u7545\u6027", "\u5728 MMHalBench \u4e0a\u663e\u8457\u4f18\u4e8e\u5bf9\u6bd4\u57fa\u7ebf\uff0c\u4f46\u5728\u5176\u4ed6\u6570\u636e\u96c6\u4e0a\u7684\u6548\u679c\u66f4\u4e3a\u6df7\u5408"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u5e7b\u89c9", "\u5bf9\u6bd4\u89e3\u7801", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16646v1", "published_at": "2026-09-15", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "What Do Hallucinations Reveal About Multimodal Reasoning? Diagnosing Visual Grounding Failures via Contrastive Decoding Probes", "tldr": "\u7528\u5bf9\u6bd4\u89e3\u7801\u8bca\u65ad\u591a\u6a21\u6001\u89c6\u89c9\u5e7b\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SAFE\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u5bf9\u6bd4\u89e3\u7801\u6846\u67b6\uff0c\u901a\u8fc7\u6bd4\u8f83\u89c6\u89c9\u8f93\u5165\u6b63\u5e38\u4e0e\u89c6\u89c9\u6d88\u878d\u4e24\u6761\u751f\u6210\u8def\u5f84\uff0c\u4e3a\u6bcf\u4e2a token \u8ba1\u7b97\u89c6\u89c9 grounding \u5206\u6570\uff0c\u7528\u4e8e\u8bc6\u522b\u6a21\u578b\u4f55\u65f6\u4f9d\u8d56\u8bed\u8a00\u5148\u9a8c\u800c\u975e\u89c6\u89c9\u8bc1\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u53ea\u8ffd\u6c42\u57fa\u51c6\u5206\u6570\uff0c\u800c\u662f\u628a\u5927\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5f53\u4f5c\u5206\u6790\u81ea\u8eab\u5931\u8d25\u673a\u5236\u7684\u5b9e\u9a8c\u5de5\u5177\uff0c\u4e3a\u7406\u89e3\u548c\u7f13\u89e3\u591a\u6a21\u6001\u5e7b\u89c9\u63d0\u4f9b\u4e86\u53ef\u89e3\u91ca\u3001\u514d\u8bad\u7ec3\u7684\u8bca\u65ad\u65b9\u6cd5\u3002"}, {"abstract": "Zero-shot waypoint navigation requires vision-language models to select, from the current first-person observation, a sequence of spatial actions that is feasible for the agent and reaches the goal, placing joint demands on the integrated spatial intelligence of today\u0027s foundation VLMs. Existing spatial-intelligence benchmarks primarily evaluate isolated judgments of relations, directions, or targets and therefore do not directly measure the integrated navigation ability required to combine target recognition, action-consequence assessment, distance estimation, and path planning. To fill this evaluation gap, we introduce EgoPathBench, a dataset and five-task benchmark for first-person waypoint decision-making. Each question presents an egocentric RGB image, a natural-language goal, and numbered visible waypoints; a model returns traversable candidates or an ordered route. Predictions are evaluated for candidate feasibility, adjacent-edge legality, and goal arrival under point-agent or embodied geometry. EgoPathBench contains 31,852 training, 1,345 validation, and 1,111 benchmark questions and retains at least one geometrically verified reference route for every route question. Across nine VLMs, the highest EgoPath Score is only 28.3. The top-ranked model reaches 35.9% success on Point Path, but only 2.9% and 4.0% on Embodied Path and Intent Path, respectively, showing that current models remain limited in forming complete, goal-consistent routes under embodiment constraints. Beyond the evaluation data, we release the corresponding training resource. Fine-tuning Qwen 3.5 4B on the released training split raises its EgoPath Score from 3.9 to 38.9 and improves all four reported evaluations across three external spatial benchmarks, with gains of 1.4--9.6 points.", "arxiv_id": "2609.16610", "arxiv_url": "https://arxiv.org/abs/2609.16610", "authors": ["Yang Zhao", "Zhuo Chen", "Xubo Yang"], "brief": "\u8bba\u6587\u63d0\u51fa EgoPathBench\uff0c\u4e00\u4e2a\u9762\u5411\u7b2c\u4e00\u89c6\u89d2\u822a\u70b9\u51b3\u7b56\u7684\u4e94\u4efb\u52a1\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30VLM\u4ece\u56fe\u50cf\u3001\u76ee\u6807\u63cf\u8ff0\u548c\u53ef\u89c1\u822a\u70b9\u4e2d\u9009\u62e9\u53ef\u901a\u884c\u5019\u9009\u6216\u89c4\u5212\u6709\u5e8f\u8def\u7ebf\u7684\u80fd\u529b\u3002\u57fa\u51c6\u8986\u76d6\u53ef\u884c\u6027\u3001\u76f8\u90bb\u8fb9\u5408\u6cd5\u6027\u548c\u76ee\u6807\u5230\u8fbe\u7b49\u6307\u6807\uff0c\u5e76\u63d0\u4f9b\u8bad\u7ec3\u8d44\u6e90\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16610", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6570\u636e\u5305\u542b31,852\u4e2a\u8bad\u7ec3\u95ee\u9898\u30011,345\u4e2a\u9a8c\u8bc1\u95ee\u9898\u548c1,111\u4e2a\u57fa\u51c6\u95ee\u9898\uff0c\u6bcf\u4e2a\u8def\u7ebf\u95ee\u9898\u81f3\u5c11\u6709\u4e00\u6761\u51e0\u4f55\u9a8c\u8bc1\u53c2\u8003\u8def\u5f84", "\u8bc4\u6d4b9\u4e2aVLM\uff0c\u6700\u9ad8EgoPath Score\u4ec
