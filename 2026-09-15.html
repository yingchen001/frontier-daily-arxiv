tion. Caregivers valued attention to their wellbeing, longitudinal awareness, context-sensitive support, and clinical visibility when it could lead to meaningful follow-up. However, repeated reflection could become burdensome or emotionally difficult, automatic clinical sharing could inhibit candid disclosure, and participants wanted control over what information entered clinical care. They also expected AI to support reflection and communication without replacing caregiver voice or clinician judgment. We contribute design considerations for proactive, clinically connected caregiver wellbeing support.", "arxiv_id": "2609.17434", "arxiv_url": "https://arxiv.org/abs/2609.17434", "authors": ["Jiayue Melissa Shi", "Ethan Nguyen", "Drishti Goel", "Upasana Natarajan", "Shashwat Srivatsa", "Daniel S. Brown", "Violeta J. Rodr\u00edguez", "Dong Whi Yoo", "Ravi Karkar", "Koustuv Saha"], "brief": "\u8bba\u6587\u63d0\u51fa CareMirror\uff0c\u4e00\u4e2a\u9762\u5411\u75f4\u5446\u7167\u62a4\u5bb6\u5ead\u7167\u62a4\u8005\u7684\u798f\u7949\u652f\u6301\u751f\u6001\uff0c\u5305\u542b\u7167\u62a4\u8005\u4e0e\u4e34\u5e8a\u7aef\u754c\u9762\uff0c\u7528\u4e8e\u957f\u671f\u53cd\u601d\u3001\u4e2a\u6027\u5316\u652f\u6301\u548c\u53d7\u63a7\u4fe1\u606f\u5171\u4eab\u3002\u57fa\u4e8e14\u540d\u7167\u62a4\u8005\u8bbf\u8c08\uff0c\u7814\u7a76\u53d1\u73b0\u7167\u62a4\u8005\u91cd\u89c6\u4e34\u5e8a\u53ef\u89c1\u6027\u4e0e\u60c5\u5883\u5316\u652f\u6301\uff0c\u4f46\u4e5f\u62c5\u5fc3\u53cd\u590d\u53cd\u601d\u5e26\u6765\u8d1f\u62c5\u3001\u81ea\u52a8\u5171\u4eab\u6291\u5236\u771f\u5b9e\u8868\u8fbe\uff0c\u56e0\u6b64\u9700\u8981\u8ba9\u7167\u62a4\u8005\u638c\u63a7\u8fdb\u5165\u4e34\u5e8a\u7684\u4fe1\u606f\u3002", "categories": ["cs.HC", "cs.AI", "cs.CL", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17434", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u673a\u4ea4\u4e92", "\u533b\u7597\u5065\u5eb7", "\u7167\u62a4\u652f\u6301", "\u4eba\u5de5\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17434v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CareMirror: Bringing Caregiver Wellbeing into the Dementia Care Ecosystem", "tldr": "\u8bba\u6587\u63d0\u51fa CareMirror\uff0c\u4e00\u4e2a\u9762\u5411\u75f4\u5446\u7167\u62a4\u5bb6\u5ead\u7167\u62a4\u8005\u7684\u798f\u7949\u652f\u6301\u751f\u6001\uff0c\u5305\u542b\u7167\u62a4\u8005\u4e0e\u4e34\u5e8a\u7aef\u754c\u9762\uff0c\u7528\u4e8e\u957f\u671f\u53cd\u601d\u3001\u4e2a\u6027\u5316\u652f\u6301\u548c\u53d7\u63a7\u4fe1\u606f\u5171\u4eab\u3002\u57fa\u4e8e14\u540d\u7167\u62a4\u8005\u8bbf\u8c08\uff0c\u7814\u7a76\u53d1\u73b0\u7167\u62a4\u8005\u91cd\u89c6\u4e34\u5e8a\u53ef\u89c1\u6027\u4e0e\u60c5\u5883\u5316\u652f\u6301\uff0c\u4f46\u4e5f\u62c5\u5fc3\u53cd\u590d\u53cd\u601d\u5e26\u6765\u8d1f\u62c5\u3001\u81ea\u52a8\u5171\u4eab\u6291\u5236\u771f\u5b9e\u8868\u8fbe\uff0c\u56e0\u6b64\u9700\u8981\u8ba9\u7167\u62a4\u8005\u638c\u63a7\u8fdb\u5165\u4e34\u5e8a\u7684\u4fe1\u606f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many learned sequential decision systems map the current state directly to an action. That shortcut becomes brittle when candidate actions are numerous, geometrically structured, and rebuilt with the state. One-to-many mobile charging makes this setting concrete: with N=250 sensors, the initial state induces about 1,125 candidate charging-stop actions; each chosen stop simultaneously serves its in-range sensors, and the action universe changes as sensors die. LP-BTS is a learning-guided planning architecture: a graph proposal policy concentrates a small candidate support, a learned value critic evaluates leaves, and edge-budgeted PUCT compares short simulated futures before committing an action. Because the policy scores this set without a fixed output head, a single frozen checkpoint covers every evaluated setting, spanning action universes from 736 to 2,813 stops. Matched ablations reveal complementary effects: uniform sampling costs 8.8 survival percentage points, while, with targeted support fixed, PUCT jointly retains 1.4 points (about 3.5 of 250 sensors) and direct policy selection travels 23% farther. On a prospectively specified, sealed 30-scenario confirmatory bank evaluated once, LP-BTS attains the highest observed survival (0.4545) and alive-AUC (0.8031). Its estimated survival advantage over the strongest domain-engineered comparator is +0.0066 (95% CI [-0.0037, +0.0184]), an unresolved difference, while it exceeds a deadline heuristic and two source-derived direct-policy reconstructions on every paired scenario. Both learned rows are trained, source-derived reconstructions of variants reported by Gong et al. In this setting, the results provide controlled evidence about learning-guided planning in a large, dynamic action space.", "arxiv_id": "2609.17429", "arxiv_url": "https://arxiv.org/abs/2609.17429", "authors": ["Liang-Ching Tao", "Pi-Chung Wang"], "brief": "\u8bba\u6587\u63d0\u51fa LP-BTS\uff0c\u4e00\u79cd\u9762\u5411\u5927\u89c4\u6a21\u52a8\u6001\u52a8\u4f5c\u7a7a\u95f4\u7684\u5b66\u4e60\u5f15\u5bfc\u89c4\u5212\u65b9\u6cd5\uff0c\u7528\u56fe\u7b56\u7565\u7b5b\u9009\u5019\u9009\u52a8\u4f5c\u3001\u4ef7\u503c\u7f51\u7edc\u8bc4\u4f30\u53f6\u8282\u70b9\uff0c\u5e76\u7528\u5e26\u8fb9\u9884\u7b97\u7684 PUCT \u505a\u77ed\u671f\u6811\u641c\u7d22\u3002\u5728\u4e00\u5bf9\u591a\u79fb\u52a8\u5145\u7535\u4efb\u52a1\u4e2d\uff0c\u5b83\u80fd\u7528\u540c\u4e00\u4e2a\u51bb\u7ed3\u6a21\u578b\u9002\u914d\u4e0d\u540c\u89c4\u6a21\u52a8\u4f5c\u96c6\u5408\uff0c\u6574\u4f53\u751f\u5b58\u7387\u548c alive-AUC \u8868\u73b0\u6700\u597d\uff1b\u4f46\u76f8\u5bf9\u6700\u5f3a\u9886\u57df\u5de5\u7a0b\u57fa\u7ebf\u7684\u4f18\u52bf\u7f6e\u4fe1\u533a\u95f4\u4ecd\u5305\u542b\u96f6\uff0c\u63d0\u5347\u5c1a\u4e0d\u5b8c\u5168\u786e\u5b9a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17429", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c4\u5212", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u6811\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17429v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning-Guided Planning in Large Dynamic Action Spaces: Budgeted Tree Search for One-to-Many Mobile Charging", "tldr": "\u8bba\u6587\u63d0\u51fa LP-BTS\uff0c\u4e00\u79cd\u9762\u5411\u5927\u89c4\u6a21\u52a8\u6001\u52a8\u4f5c\u7a7a\u95f4\u7684\u5b66\u4e60\u5f15\u5bfc\u89c4\u5212\u65b9\u6cd5\uff0c\u7528\u56fe\u7b56\u7565\u7b5b\u9009\u5019\u9009\u52a8\u4f5c\u3001\u4ef7\u503c\u7f51\u7edc\u8bc4\u4f30\u53f6\u8282\u70b9\uff0c\u5e76\u7528\u5e26\u8fb9\u9884\u7b97\u7684 PUCT \u505a\u77ed\u671f\u6811\u641c\u7d22\u3002\u5728\u4e00\u5bf9\u591a\u79fb\u52a8\u5145\u7535\u4efb\u52a1\u4e2d\uff0c\u5b83\u80fd\u7528\u540c\u4e00\u4e2a\u51bb\u7ed3\u6a21\u578b\u9002\u914d\u4e0d\u540c\u89c4\u6a21\u52a8\u4f5c\u96c6\u5408\uff0c\u6574\u4f53\u751f\u5b58\u7387\u548c alive-AUC \u8868\u73b0\u6700\u597d\uff1b\u4f46\u76f8\u5bf9\u6700\u5f3a\u9886\u57df\u5de5\u7a0b\u57fa\u7ebf\u7684\u4f18\u52bf\u7f6e\u4fe1\u533a\u95f4\u4ecd\u5305\u542b\u96f6\uff0c\u63d0\u5347\u5c1a\u4e0d\u5b8c\u5168\u786e\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-time multi-object tracking systems remain highly vulnerable to full and long-term occlusion, where targets temporarily or completely disappear from the camera\u0027s field of view. Conventional trackers may terminate trajectories prematurely, resulting in identity loss and reduced situational awareness in applications such as defense and surveillance. This work proposes an occlusion-robust target tracking framework that maintains target identity and trajectory continuity through the integration of YOLOv11n object detection, Kalman Filter motion prediction, and occlusion-aware appearance-based re-identification. The framework consists of three stages: object detection, position estimation during occlusion, and identity recovery after target reappearance. Six Re-Identification (Re-ID) architectures were evaluated within the same tracking framework under identical conditions, with the Occlusion-Aware Mask Network (OAMN) achieving the best overall performance and therefore selected for the final pipeline. The framework was benchmarked against OccluTrack on the public OVIS dataset, achieving relative improvements of 18.1 percent in Multiple Object Tracking Accuracy (MOTA) and 25.1 percent in Identity F1 Score (IDF1), while reducing identity switches by 12.8 percent. On a custom military dataset simulating surveillance and battlefield-like environments with long-term occlusion, the framework achieved a MOTA of 0.734 and an IDF1 of 0.729, corresponding to relative improvements of 14.2 percent and 5.8 percent over OccluTrack. The system demonstrated strong tracking continuity, robust identity preservation, and reliable trajectory estimation under challenging occlusion conditions, highlighting its effectiveness for defense-related surveillance applications requiring continuous target tracking during visibility loss.", "arxiv_id": "2609.17427", "arxiv_url": "https://arxiv.org/abs/2609.17427", "authors": ["Mais Mohammed", "Sharifa Mohammed", "Hanan Awadh", "Haneen Bamaas", "Raghad Bawazeer", "Elham Alghamdi"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u5168\u906e\u6321\u548c\u957f\u65f6\u906e\u6321\u7684\u591a\u76ee\u6807\u8ddf\u8e2a\u6846\u67b6\uff0c\u7ed3\u5408 YOLOv11n \u68c0\u6d4b\u3001\u5361\u5c14\u66fc\u6ee4\u6ce2\u8fd0\u52a8\u9884\u6d4b\u548c\u906e\u6321\u611f\u77e5 Re-ID \u6765\u7ef4\u6301\u76ee\u6807\u8eab\u4efd\u4e0e\u8f68\u8ff9\u8fde\u7eed\u6027\u3002\u5728 OVIS \u548c\u81ea\u5efa\u519b\u4e8b\u76d1\u63a7\u6570\u636e\u96c6\u4e0a\uff0c\u76f8\u6bd4 OccluTrack \u663e\u8457\u63d0\u5347 MOTA\u3001IDF1\uff0c\u5e76\u51cf\u5c11\u8eab\u4efd\u5207\u6362\uff0c\u9002\u5408\u9632\u52a1\u4e0e\u76d1\u63a7\u573a\u666f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17427", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u76ee\u6807\u8ddf\u8e2a", "\u76ee\u6807\u91cd\u8bc6\u522b", "\u906e\u6321\u9c81\u68d2", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17427v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tracking the Unseen: An Occlusion-Robust Framework for Target Tracking Under Full and Long-Term Occlusion", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u5168\u906e\u6321\u548c\u957f\u65f6\u906e\u6321\u7684\u591a\u76ee\u6807\u8ddf\u8e2a\u6846\u67b6\uff0c\u7ed3\u5408 YOLOv11n \u68c0\u6d4b\u3001\u5361\u5c14\u66fc\u6ee4\u6ce2\u8fd0\u52a8\u9884\u6d4b\u548c\u906e\u6321\u611f\u77e5 Re-ID \u6765\u7ef4\u6301\u76ee\u6807\u8eab\u4efd\u4e0e\u8f68\u8ff9\u8fde\u7eed\u6027\u3002\u5728 OVIS \u548c\u81ea\u5efa\u519b\u4e8b\u76d1\u63a7\u6570\u636e\u96c6\u4e0a\uff0c\u76f8\u6bd4 OccluTrack \u663e\u8457\u63d0\u5347 MOTA\u3001IDF1\uff0c\u5e76\u51cf\u5c11\u8eab\u4efd\u5207\u6362\uff0c\u9002\u5408\u9632\u52a1\u4e0e\u76d1\u63a7\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Small differences on coding-agent leaderboards are often read as an ordering of systems. We audit whether the published verdicts support this reading, using 254 SWE-bench submissions across four splits without running models. On Verified, the leading two entries each resolve 396 of 500 instances. The top ten share 285 successes and 51 failures, leaving 164 instances that distinguish their outcomes. Frontier solution sets have median nesting 0.935 against a score-implied baseline of 0.774, indicating strongly shared successes. Scores also depend on the evaluated model-scaffold pair: observed within-model scaffold ranges reach 29.8 percentage points, compared with the 8.8-point spread of the top thirty. Six of nine cell-mean interaction tests remain significant after Holm correction, although this observational design does not identify causal scaffold effects. Exact paired McNemar tests separate none of the 29 adjacent Verified top-thirty pairs at alpha=0.05, while the larger Test split separates 14 of 23. A stated leader-based rule yields three descriptive tiers, or two after Holm correction; non-rejection does not establish equivalence. We release the partition and a five-step audit protocol that profiles shared outcomes, tests paired differences, reports grouping sensitivity, and estimates the instance budget needed for resolution. The results motivate reporting comparison-set-specific resolution and model-scaffold provenance instead of interpreting small aggregate gaps as established rank differences.", "arxiv_id": "2609.17394", "arxiv_url": "https://arxiv.org/abs/2609.17394", "authors": ["Fengshuo Liu", "Ying Liu", "Ruize Sun", "Lie Luo", "Siyuan Guo"], "brief": "\u8bba\u6587\u5ba1\u8ba1\u4e86254\u4e2aSWE-bench\u7f16\u7801\u667a\u80fd\u4f53\u63d0\u4ea4\uff0c\u53d1\u73b0\u699c\u9996\u7cfb\u7edf\u7ed3\u679c\u9ad8\u5ea6\u6536\u655b\uff0c\u5c0f\u5206\u5dee\u65e0\u6cd5\u53ef\u9760\u6392\u5e8f\uff1aVerified\u524d30\u540d\u76f8\u90bb\u914d\u5bf9\u5728\u7edf\u8ba1\u68c0\u9a8c\u4e0b\u65e0\u4e00\u663e\u8457\u533a\u5206\u3002\u4f5c\u8005\u6307\u51fa\u6a21\u578b\u4e0e\u811a\u624b\u67b6\u7ec4\u5408\u4f1a\u663e\u8457\u5f71\u54cd\u5206\u6570\uff0c\u5e76\u63d0\u51fa\u62a5\u544a\u5206\u5c42\u3001\u6210\u5bf9\u5dee\u5f02\u3001\u5171\u4eab\u6210\u529f\u6a21\u5f0f\u548c\u6837\u672c\u9884\u7b97\u7b49\u66f4\u7a33\u5065\u7684\u8bc4\u6d4b\u534f\u8bae\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17394", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17394v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Coding Agents Have Converged: Why the SWE-bench Leaderboard Can No Longer Order Its Top Entries, and What to Measure Instead", "tldr": "\u8bba\u6587\u5ba1\u8ba1\u4e86254\u4e2aSWE-bench\u7f16\u7801\u667a\u80fd\u4f53\u63d0\u4ea4\uff0c\u53d1\u73b0\u699c\u9996\u7cfb\u7edf\u7ed3\u679c\u9ad8\u5ea6\u6536\u655b\uff0c\u5c0f\u5206\u5dee\u65e0\u6cd5\u53ef\u9760\u6392\u5e8f\uff1aVerified\u524d30\u540d\u76f8\u90bb\u914d\u5bf9\u5728\u7edf\u8ba1\u68c0\u9a8c\u4e0b\u65e0\u4e00\u663e\u8457\u533a\u5206\u3002\u4f5c\u8005\u6307\u51fa\u6a21\u578b\u4e0e\u811a\u624b\u67b6\u7ec4\u5408\u4f1a\u663e\u8457\u5f71\u54cd\u5206\u6570\uff0c\u5e76\u63d0\u51fa\u62a5\u544a\u5206\u5c42\u3001\u6210\u5bf9\u5dee\u5f02\u3001\u5171\u4eab\u6210\u529f\u6a21\u5f0f\u548c\u6837\u672c\u9884\u7b97\u7b49\u66f4\u7a33\u5065\u7684\u8bc4\u6d4b\u534f\u8bae\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "To answer questions outside of their pre-training data, large language models (LLMs) need access to new information, which can be presented in the context window as documents, encoded into the model\u0027s parameters, or injected as latent representations. However, each of these methods comes with different efficiency, cost, and performance trade-offs, with no single winner. We present a controlled comparison of representation-based (KV-cache based) and parametric (fine-tuning-based) adaptation methods on five knowledge-intensive benchmarks. We show that in the oracle setting, Cartridges (KV) are the most accurate injection method at nearly every storage budget, outperforming parametric methods by 10 points. Compaction (KV) matches Cartridges only at low compression rates, lagging behind the parametric methods by 10 points at rates higher than $50\\times$. In the more realistic multi-document retrieval scenario, Cartridges are the only method that matches in-context learning (ICL), leading the parametric methods by 29 points and Compaction by 15 points. Nonetheless, Cartridges are also the only method, besides full fine-tuning and large MLP adapters, that suffers from catastrophic forgetting, i.e., a 6% performance degradation on control benchmarks, with 13% in coding.", "arxiv_id": "2609.17346", "arxiv_url": "https://arxiv.org/abs/2609.17346", "authors": ["Nathana\u00ebl Carraz Rakotonirina", "Momchil Hardalov", "Gonzalo Iglesias", "Adri\u00e0 de Gispert"], "brief": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u628a\u65b0\u77e5\u8bc6\u653e\u5165\u4e0a\u4e0b\u6587\u3001\u6a21\u578b\u53c2\u6570\u6216\u6f5c\u5728\u8868\u793a\u4e2d\u7684\u4e0d\u540c\u65b9\u6848\uff0c\u91cd\u70b9\u8bc4\u4f30\u57fa\u4e8e KV-cache \u7684\u8868\u793a\u6ce8\u5165\u4e0e\u5fae\u8c03\u5f0f\u53c2\u6570\u9002\u914d\u3002\u7ed3\u679c\u663e\u793a Cartridges \u5728\u591a\u6570\u5b58\u50a8\u9884\u7b97\u548c\u591a\u6587\u6863\u68c0\u7d22\u573a\u666f\u4e0b\u6700\u63a5\u8fd1\u6216\u5339\u914d\u4e0a\u4e0b\u6587\u5b66\u4e60\uff0c\u663e\u8457\u4f18\u4e8e\u53c2\u6570\u65b9\u6cd5\uff0c\u4f46\u4e5f\u4f1a\u5e26\u6765\u707e\u96be\u6027\u9057\u5fd8\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17346", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u6ce8\u5165", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17346v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Where Should a Document Live: Context, Representations, or Parameters?", "tldr": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u628a\u65b0\u77e5\u8bc6\u653e\u5165\u4e0a\u4e0b\u6587\u3001\u6a21\u578b\u53c2\u6570\u6216\u6f5c\u5728\u8868\u793a\u4e2d\u7684\u4e0d\u540c\u65b9\u6848\uff0c\u91cd\u70b9\u8bc4\u4f30\u57fa\u4e8e KV-cache \u7684\u8868\u793a\u6ce8\u5165\u4e0e\u5fae\u8c03\u5f0f\u53c2\u6570\u9002\u914d\u3002\u7ed3\u679c\u663e\u793a Cartridges \u5728\u591a\u6570\u5b58\u50a8\u9884\u7b97\u548c\u591a\u6587\u6863\u68c0\u7d22\u573a\u666f\u4e0b\u6700\u63a5\u8fd1\u6216\u5339\u914d\u4e0a\u4e0b\u6587\u5b66\u4e60\uff0c\u663e\u8457\u4f18\u4e8e\u53c2\u6570\u65b9\u6cd5\uff0c\u4f46\u4e5f\u4f1a\u5e26\u6765\u707e\u96be\u6027\u9057\u5fd8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents exhibit strong language-generation and problem-solving capabilities, yet suffer from three structural limitations: personality drift, non-evolutionary reflection, and the absence of a self-other boundary. Existing generative-agent simulations rely on static memory and fixed prompts, maintaining neither behavioral inertia nor endogenous self-evolution. We propose the Self-Emergence Agent Architecture (SEAA), which integrates three components: (i) a Hidden Markov Model (HMM) that encodes long-term behavioral and cognitive inertia as an editable state-transition matrix; (ii) a Reflexion-style verbal metacognition loop whose output updates the HMM parameters themselves, rather than merely being stored as text; and (iii) a multi-agent social environment in which initially identical agents continuously compare their behavior with others\u0027. The three components form a closed loop: social action $\\to$ feedback $\\to$ self-reflection $\\to$ inertia update $\\to$ differentiated action. We state three falsifiable hypotheses and provide a reproducible experimental protocol with operational metrics. A language-model-free prototype shows the loop spontaneously breaks symmetry: initially identical agents consolidate distinct, stable personalities whereas matched controls do not. Experiments with a hosted LLM surface these differences as distinct first-person self-narratives, and a five-agent deliberation spontaneously develops social structure---a consensus hub and a unanimously rejected outlier---absent in the control. Following an epistemologically agnostic stance inspired by Zhuangzi, SEAA studies only observable behavioral emergence and makes no claim about subjective qualia. This work contributes a unified framework, a concrete architecture with pseudocode, mechanistic evidence, and a microscope-style sandbox for studying artificial-self emergence.", "arxiv_id": "2609.17331", "arxiv_url": "https://arxiv.org/abs/2609.17331", "authors": ["Xiaoyang Liu"], "brief": "\u672c\u6587\u63d0\u51fa\u81ea\u6d8c\u73b0\u667a\u80fd\u4f53\u67b6\u6784 SEAA\uff0c\u5c06\u884c\u4e3a\u60ef\u6027\u7684 HMM\u3001\u53ef\u66f4\u65b0\u53c2\u6570\u7684\u53cd\u601d\u5f0f\u5143\u8ba4\u77e5\u3001\u591a\u667a\u80fd\u4f53\u793e\u4f1a\u5bf9\u6bd4\u7ed3\u5408\uff0c\u5f62\u6210\u201c\u884c\u52a8\u2014\u53cd\u9988\u2014\u53cd\u601d\u2014\u60ef\u6027\u66f4\u65b0\u2014\u5dee\u5f02\u5316\u884c\u52a8\u201d\u7684\u95ed\u73af\u3002\u539f\u578b\u5b9e\u9a8c\u663e\u793a\uff0c\u521d\u59cb\u76f8\u540c\u7684\u667a\u80fd\u4f53\u4f1a\u81ea\u53d1\u5f62\u6210\u7a33\u5b9a\u7684\u4e0d\u540c\u4eba\u683c\uff0c\u5e76\u5728\u591a\u667a\u80fd\u4f53\u8ba8\u8bba\u4e2d\u51fa\u73b0\u5171\u8bc6\u4e2d\u5fc3\u548c\u88ab\u6392\u65a5\u4e2a\u4f53\u7b49\u793e\u4f1a\u7ed3\u6784\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17331", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u5143\u8ba4\u77e5", "\u81ea\u6211\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17331v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Self-Emergence Agent Architecture:Behavior-Inertia HMM, Reflexive Metacognition,and Social-Contrastive Self-Modeling", "tldr": "\u672c\u6587\u63d0\u51fa\u81ea\u6d8c\u73b0\u667a\u80fd\u4f53\u67b6\u6784 SEAA\uff0c\u5c06\u884c\u4e3a\u60ef\u6027\u7684 HMM\u3001\u53ef\u66f4\u65b0\u53c2\u6570\u7684\u53cd\u601d\u5f0f\u5143\u8ba4\u77e5\u3001\u591a\u667a\u80fd\u4f53\u793e\u4f1a\u5bf9\u6bd4\u7ed3\u5408\uff0c\u5f62\u6210\u201c\u884c\u52a8\u2014\u53cd\u9988\u2014\u53cd\u601d\u2014\u60ef\u6027\u66f4\u65b0\u2014\u5dee\u5f02\u5316\u884c\u52a8\u201d\u7684\u95ed\u73af\u3002\u539f\u578b\u5b9e\u9a8c\u663e\u793a\uff0c\u521d\u59cb\u76f8\u540c\u7684\u667a\u80fd\u4f53\u4f1a\u81ea\u53d1\u5f62\u6210\u7a33\u5b9a\u7684\u4e0d\u540c\u4eba\u683c\uff0c\u5e76\u5728\u591a\u667a\u80fd\u4f53\u8ba8\u8bba\u4e2d\u51fa\u73b0\u5171\u8bc6\u4e2d\u5fc3\u548c\u88ab\u6392\u65a5\u4e2a\u4f53\u7b49\u793e\u4f1a\u7ed3\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper describes our submission to the SHROOM-Visions shared task on detecting and classifying hallucinated character spans in vision-language model outputs across four languages. We employ several fine-tuned vision-language models as independent annotators and combine their span predictions through character-level majority voting, and additionally explore activation probes. The approach ranks first in three of four languages and places on the podium in every language and metric. Our analysis indicates that disagreement among diverse models tracks disagreement among human annotators.", "arxiv_id": "2609.17327", "arxiv_url": "https://arxiv.org/abs/2609.17327", "authors": ["Toqeer Ehsan", "Nico Penttil\u00e4", "Richard Schmidt", "Arash Hajikhani", "Victoria Palacin"], "brief": "\u672c\u6587\u9488\u5bf9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8f93\u51fa\u4e2d\u7684\u5e7b\u89c9\u5b57\u7b26\u7247\u6bb5\u68c0\u6d4b\u4e0e\u5206\u7c7b\uff0c\u4f7f\u7528\u591a\u4e2a\u5fae\u8c03\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u72ec\u7acb\u8bc4\u5ba1\uff0c\u5e76\u901a\u8fc7\u5b57\u7b26\u7ea7\u591a\u6570\u6295\u7968\u878d\u5408\u9884\u6d4b\uff0c\u540c\u65f6\u63a2\u7d22\u6fc0\u6d3b\u63a2\u9488\u3002\u8be5\u65b9\u6cd5\u5728 SHROOM-Visions \u591a\u8bed\u8a00\u5171\u4eab\u4efb\u52a1\u4e2d\u56db\u79cd\u8bed\u8a00\u5747\u8fdb\u5165\u524d\u4e09\uff0c\u5176\u4e2d\u4e09\u79cd\u8bed\u8a00\u6392\u540d\u7b2c\u4e00\uff0c\u5e76\u53d1\u73b0\u6a21\u578b\u5206\u6b67\u53ef\u53cd\u6620\u4eba\u7c7b\u6807\u6ce8\u5206\u6b67\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17327", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u68c0\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u96c6\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17327v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Vroom-Vroom at SHROOM-Visions: A Multi-Judge Committee for Detecting Hallucinated Spans in Vision-Language Outputs", "tldr": "\u672c\u6587\u9488\u5bf9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u8f93\u51fa\u4e2d\u7684\u5e7b\u89c9\u5b57\u7b26\u7247\u6bb5\u68c0\u6d4b\u4e0e\u5206\u7c7b\uff0c\u4f7f\u7528\u591a\u4e2a\u5fae\u8c03\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u72ec\u7acb\u8bc4\u5ba1\uff0c\u5e76\u901a\u8fc7\u5b57\u7b26\u7ea7\u591a\u6570\u6295\u7968\u878d\u5408\u9884\u6d4b\uff0c\u540c\u65f6\u63a2\u7d22\u6fc0\u6d3b\u63a2\u9488\u3002\u8be5\u65b9\u6cd5\u5728 SHROOM-Visions \u591a\u8bed\u8a00\u5171\u4eab\u4efb\u52a1\u4e2d\u56db\u79cd\u8bed\u8a00\u5747\u8fdb\u5165\u524d\u4e09\uff0c\u5176\u4e2d\u4e09\u79cd\u8bed\u8a00\u6392\u540d\u7b2c\u4e00\uff0c\u5e76\u53d1\u73b0\u6a21\u578b\u5206\u6b67\u53ef\u53cd\u6620\u4eba\u7c7b\u6807\u6ce8\u5206\u6b67\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific poster generation distills a multimodal paper into a single-page visual artifact, forcing strict trade-offs between informational coverage and readability under a fixed spatial budget. Existing methods pass plans as transient prompts and validate individual stages in isolation. This strategy causes requirements to drift across content and layout modules, and previous checks to be silently invalidated. We introduce PosterVisor, a control framework that shifts poster generation from transient prompts to persistent control. An Orchestrator grounds rubrics in the paper and visual assets, compiling them into a Semantic-Geometric Contract (SGC) that binds claims and sources to required visuals, budgets, and spatial commitments. Only fully instantiated records become executable assertions; other usable requirements remain soft guidance. Recursive Contract Enforcement (RCE) dynamically triggers checks across stages as evidence emerges. Crucially, during repairs, RCE rechecks affected checkpoint states, preventing repair-induced regressions from propagating silently. We instantiate PosterVisor in HTML/CSS and editable PPTX generators. On the 100-paper Paper2Poster benchmark, PosterVisor-PPT improves observed mean poster-grounded QA accuracy over PosterGen (64.47% vs. 58.53%) and is preferred by human judges in 72.5% of non-tied pairwise comparisons (95% CI, 61.6-83.4%). A secondary 30-paper study also yields higher VLM Overall and PaperQuiz means. These results support rubric-compiled contracts and stage-conditioned enforcement for controllable poster synthesis.", "arxiv_id": "2609.17326", "arxiv_url": "https://arxiv.org/abs/2609.17326", "authors": ["Runze Li", "Yukun Zhao", "Can Xu", "Yucheng Shen", "Shuaiqiang Wang", "Jianmin Wu", "Lingyong Yan", "Dawei Yin"], "brief": "\u672c\u6587\u63d0\u51fa PosterVisor\uff0c\u7528\u6301\u4e45\u7684\u201c\u8bed\u4e49-\u51e0\u4f55\u5951\u7ea6\u201d\u66ff\u4ee3\u4e00\u6b21\u6027\u63d0\u793a\u8bcd\u6765\u63a7\u5236\u79d1\u5b66\u6d77\u62a5\u751f\u6210\uff0c\u5c06\u8bba\u6587\u4e3b\u5f20\u3001\u89c6\u89c9\u7d20\u6750\u3001\u7a7a\u95f4\u9884\u7b97\u548c\u5e03\u5c40\u7ea6\u675f\u7ed1\u5b9a\uff0c\u5e76\u5728\u751f\u6210\u4e0e\u4fee\u590d\u8fc7\u7a0b\u4e2d\u9012\u5f52\u68c0\u67e5\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728 Paper2Poster \u57fa\u51c6\u4e0a\u5176 PPT \u7248\u672c\u76f8\u6bd4 PosterGen \u63d0\u5347\u4e86\u6d77\u62a5\u95ee\u7b54\u51c6\u786e\u7387\uff0c\u5e76\u5728\u4eba\u5de5\u504f\u597d\u8bc4\u6d4b\u4e2d\u83b7\u5f97\u66f4\u9ad8\u80dc\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17326", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u53ef\u63a7\u751f\u6210", "\u7248\u9762\u751f\u6210", "\u79d1\u5b66\u6d77\u62a5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17326v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Transient Prompts to Persistent Control: Scientific Poster Generation via Recursive Semantic-Geometric Contracts", "tldr": "\u672c\u6587\u63d0\u51fa PosterVisor\uff0c\u7528\u6301\u4e45\u7684\u201c\u8bed\u4e49-\u51e0\u4f55\u5951\u7ea6\u201d\u66ff\u4ee3\u4e00\u6b21\u6027\u63d0\u793a\u8bcd\u6765\u63a7\u5236\u79d1\u5b66\u6d77\u62a5\u751f\u6210\uff0c\u5c06\u8bba\u6587\u4e3b\u5f20\u3001\u89c6\u89c9\u7d20\u6750\u3001\u7a7a\u95f4\u9884\u7b97\u548c\u5e03\u5c40\u7ea6\u675f\u7ed1\u5b9a\uff0c\u5e76\u5728\u751f\u6210\u4e0e\u4fee\u590d\u8fc7\u7a0b\u4e2d\u9012\u5f52\u68c0\u67e5\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728 Paper2Poster \u57fa\u51c6\u4e0a\u5176 PPT \u7248\u672c\u76f8\u6bd4 PosterGen \u63d0\u5347\u4e86\u6d77\u62a5\u95ee\u7b54\u51c6\u786e\u7387\uff0c\u5e76\u5728\u4eba\u5de5\u504f\u597d\u8bc4\u6d4b\u4e2d\u83b7\u5f97\u66f4\u9ad8\u80dc\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Biological cells can be viewed as individual, interacting agents whose collective dynamics give rise to adaptive behaviour at multiple levels of organisation, from individual cells through tissues to whole multicellular organisms. In this perspective and tutorial article we discuss whether intrinsic rewards in artificial neural systems can support adaptation, functional specialisation and higher-level self-organisation without a shared external objective. We review empowerment, curiosity, learning progress, information gain, unsupervised skill discovery, mutual information estimation and the use of world models for intrinsic reward computation. Particular attention is given to failure modes showing when such objectives do not produce sustained exploration or increasingly complex behaviour. We argue that more capable systems may require complementary objectives, communication, memory, learning at multiple temporal scales and environmental constraints. Based on this perspective, we outline three experimental directions. These include a resource-constrained environment in which otherwise stable behavioural attractors become unsustainable, allowing us to test whether environmental constraints can mitigate characteristic failure modes of intrinsic objectives. The network of recurrent agents with per-agent intrinsic rewards, and a hierarchical world-model agent in which exploratory motor competence develops before goal-directed behaviour. These experiments are intended to test whether intrinsic learning can lead to adaptive organisation at progressively higher levels.", "arxiv_id": "2609.17325", "arxiv_url": "https://arxiv.org/abs/2609.17325", "authors": ["Anatoly Belikov"], "brief": "\u672c\u6587\u4ece\u751f\u7269\u7ec6\u80de\u7684\u81ea\u7ec4\u7ec7\u89c6\u89d2\u51fa\u53d1\uff0c\u7efc\u8ff0\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u5185\u5728\u52a8\u673a\u673a\u5236\uff0c\u5982\u8d4b\u80fd\u3001\u597d\u5947\u5fc3\u3001\u5b66\u4e60\u8fdb\u5c55\u3001\u4fe1\u606f\u589e\u76ca\u3001\u6280\u80fd\u53d1\u73b0\u548c\u4e16\u754c\u6a21\u578b\u5956\u52b1\u3002\u4f5c\u8005\u91cd\u70b9\u5206\u6790\u8fd9\u4e9b\u5185\u5728\u76ee\u6807\u5728\u6301\u7eed\u63a2\u7d22\u548c\u590d\u6742\u884c\u4e3a\u6d8c\u73b0\u4e0a\u7684\u5931\u6548\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa\u8d44\u6e90\u7ea6\u675f\u73af\u5883\u3001\u591a\u667a\u80fd\u4f53\u9012\u5f52\u7f51\u7edc\u548c\u5206\u5c42\u4e16\u754c\u6a21\u578b\u7b49\u5b9e\u9a8c\u65b9\u5411\u6765\u7814\u7a76\u66f4\u9ad8\u5c42\u7ea7\u7684\u81ea\u9002\u5e94\u81ea\u7ec4\u7ec7\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17325", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5185\u5728\u52a8\u673a", "\u667a\u80fd\u4f53", "\u81ea\u7ec4\u7ec7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17325v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Intrinsic Motivation in Reinforcement Learning: A Research Agenda for Adaptive Self-Organisation", "tldr": "\u672c\u6587\u4ece\u751f\u7269\u7ec6\u80de\u7684\u81ea\u7ec4\u7ec7\u89c6\u89d2\u51fa\u53d1\uff0c\u7efc\u8ff0\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u5185\u5728\u52a8\u673a\u673a\u5236\uff0c\u5982\u8d4b\u80fd\u3001\u597d\u5947\u5fc3\u3001\u5b66\u4e60\u8fdb\u5c55\u3001\u4fe1\u606f\u589e\u76ca\u3001\u6280\u80fd\u53d1\u73b0\u548c\u4e16\u754c\u6a21\u578b\u5956\u52b1\u3002\u4f5c\u8005\u91cd\u70b9\u5206\u6790\u8fd9\u4e9b\u5185\u5728\u76ee\u6807\u5728\u6301\u7eed\u63a2\u7d22\u548c\u590d\u6742\u884c\u4e3a\u6d8c\u73b0\u4e0a\u7684\u5931\u6548\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa\u8d44\u6e90\u7ea6\u675f\u73af\u5883\u3001\u591a\u667a\u80fd\u4f53\u9012\u5f52\u7f51\u7edc\u548c\u5206\u5c42\u4e16\u754c\u6a21\u578b\u7b49\u5b9e\u9a8c\u65b9\u5411\u6765\u7814\u7a76\u66f4\u9ad8\u5c42\u7ea7\u7684\u81ea\u9002\u5e94\u81ea\u7ec4\u7ec7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent Systems (MAS) combine multiple model outputs to solve complex reasoning tasks. However, despite rapid growth of available open-source models, there is limited research on how to select optimal model candidates out of this massive pool. We systematically evaluate 8 model selection strategies (including model size, accuracy and answer diversity) across before-generation (routing) and after-generation (majority-voting, LLM-as-a-judge) MAS architectures on challenging scientific benchmarks. Our findings show a significant gap between theoretical oracle potential and actual performance: Expanding candidate pool sizes often degrades performance below that of the top performing base-model. We find that candidate selection within a single model family is the strategy that yields the best relative performance over a standalone model. These results demonstrate that adding arbitrary models to a heterogeneous MAS can introduce system instability, highlighting model selection as a critical design choice for multi-agent systems.", "arxiv_id": "2609.17306", "arxiv_url": "https://arxiv.org/abs/2609.17306", "authors": ["Sara Vera Marjanovi\u0107", "Jiacheng Xu", "Aleksandr Laptev", "Grigor Nalbandyan", "Erik Arakelyan", "Evelina Bakhaturina"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u6a21\u578b\u6c60\u7684\u9009\u62e9\u7b56\u7565\uff0c\u6bd4\u8f83\u4e86\u6309\u6a21\u578b\u89c4\u6a21\u3001\u51c6\u786e\u7387\u3001\u7b54\u6848\u591a\u6837\u6027\u7b49\u65b9\u5f0f\u5728\u8def\u7531\u3001\u6295\u7968\u548cLLM\u8bc4\u5ba1\u67b6\u6784\u4e0b\u7684\u8868\u73b0\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u6269\u5927\u5019\u9009\u6a21\u578b\u6c60\u5e38\u4f1a\u964d\u4f4e\u6027\u80fd\uff0c\u751a\u81f3\u4e0d\u5982\u5355\u4e2a\u6700\u5f3a\u6a21\u578b\uff1b\u5728\u540c\u4e00\u6a21\u578b\u5bb6\u65cf\u5185\u9009\u62e9\u5019\u9009\u6a21\u578b\u901a\u5e38\u66f4\u7a33\u5b9a\u3001\u76f8\u5bf9\u6536\u76ca\u6700\u597d\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17306", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u6a21\u578b\u9009\u62e9", "\u5927\u8bed\u8a00\u6a21\u578b", "\u79d1\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17306v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Mo\u0027 Models, Mo\u0027 Problems: How to best select model pools when designing Multi-Agent Systems", "tldr": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u4e86\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4e2d\u6a21\u578b\u6c60\u7684\u9009\u62e9\u7b56\u7565\uff0c\u6bd4\u8f83\u4e86\u6309\u6a21\u578b\u89c4\u6a21\u3001\u51c6\u786e\u7387\u3001\u7b54\u6848\u591a\u6837\u6027\u7b49\u65b9\u5f0f\u5728\u8def\u7531\u3001\u6295\u7968\u548cLLM\u8bc4\u5ba1\u67b6\u6784\u4e0b\u7684\u8868\u73b0\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u6269\u5927\u5019\u9009\u6a21\u578b\u6c60\u5e38\u4f1a\u964d\u4f4e\u6027\u80fd\uff0c\u751a\u81f3\u4e0d\u5982\u5355\u4e2a\u6700\u5f3a\u6a21\u578b\uff1b\u5728\u540c\u4e00\u6a21\u578b\u5bb6\u65cf\u5185\u9009\u62e9\u5019\u9009\u6a21\u578b\u901a\u5e38\u66f4\u7a33\u5b9a\u3001\u76f8\u5bf9\u6536\u76ca\u6700\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The quest for new materials increasingly relies on predictive models and comprehensive simulations that span scales from atomic to macroscopic levels. However, essential data necessary for these models and simulations are often embedded in scientific literature as unstructured text, limiting reusability and posing challenges for researchers seeking to leverage existing knowledge effectively. While extracting structured data from unstructured text using large language models is gaining popularity, traditional methods typically generate key-value pairs data with straightforward schemas. In contrast, we introduce eolas, a modular pipeline that uses large language models to automatically transform scientific documents into knowledge graphs aligned with a specified ontology. We demonstrate eolas effectiveness in extracting useful information for scientists studying materials designed to endure the extreme temperatures and radiation levels found in fusion reactors. While a human expert might spend between thirty to ninety minutes extracting relevant data from an article, eolas can generate high-quality knowledge graphs in just a few minutes. These are presented in a tabular format with faceted navigation for easy human validation. Additionally, we introduce the first benchmark dataset designed to assess large language models capabilities in constructing knowledge graphs within the domain of irradiated materials. The analysis of 168 experiments using our dataset, various large language models and prompting techniques provides key insights that we summarize into practical guidelines for effectively extracting knowledge graphs aligned with an input ontology.", "arxiv_id": "2609.17291", "arxiv_url": "https://arxiv.org/abs/2609.17291", "authors": ["Marco Luca Sbodio", "Marcos Mart\u00ednez Galindo", "Vanessa Lopez", "Blanca Biel", "Pablo Canca", "Pedro Delgado", "Jes\u00fas I. Mendieta-Moreno", "Raphael Tack", "Maria J. Caturla"], "brief": "\u672c\u6587\u63d0\u51fa eolas\uff0c\u4e00\u4e2a\u5229\u7528\u5927\u8bed\u8a00\u6a21\u578b\u5c06\u8f90\u7167\u6750\u6599\u79d1\u5b66\u6587\u732e\u81ea\u52a8\u8f6c\u6362\u4e3a\u7b26\u5408\u6307\u5b9a\u672c\u4f53\u7684\u77e5\u8bc6\u56fe\u8c31\u7684\u6a21\u5757\u5316\u6d41\u7a0b\u3002\u76f8\u6bd4\u4eba\u5de5\u6bcf\u7bc7\u970030\u523090\u5206\u949f\u62bd\u53d6\u4fe1\u606f\uff0ceolas \u53ef\u5728\u51e0\u5206\u949f\u5185\u751f\u6210\u4fbf\u4e8e\u9a8c\u8bc1\u7684\u9ad8\u8d28\u91cf\u8868\u683c\u5316\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u53d1\u5e03\u4e86\u8be5\u9886\u57df\u9996\u4e2a\u77e5\u8bc6\u56fe\u8c31\u6784\u5efa\u57fa\u51c6\u6570\u636e\u96c6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17291", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u56fe\u8c31", "\u6750\u6599\u79d1\u5b66", "\u4fe1\u606f\u62bd\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17291v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Extracting ontology-compliant knowledge from scientific text describing irradiated materials using large language models", "tldr": "\u672c\u6587\u63d0\u51fa eolas\uff0c\u4e00\u4e2a\u5229\u7528\u5927\u8bed\u8a00\u6a21\u578b\u5c06\u8f90\u7167\u6750\u6599\u79d1\u5b66\u6587\u732e\u81ea\u52a8\u8f6c\u6362\u4e3a\u7b26\u5408\u6307\u5b9a\u672c\u4f53\u7684\u77e5\u8bc6\u56fe\u8c31\u7684\u6a21\u5757\u5316\u6d41\u7a0b\u3002\u76f8\u6bd4\u4eba\u5de5\u6bcf\u7bc7\u970030\u523090\u5206\u949f\u62bd\u53d6\u4fe1\u606f\uff0ceolas \u53ef\u5728\u51e0\u5206\u949f\u5185\u751f\u6210\u4fbf\u4e8e\u9a8c\u8bc1\u7684\u9ad8\u8d28\u91cf\u8868\u683c\u5316\u77e5\u8bc6\u56fe\u8c31\uff0c\u5e76\u53d1\u5e03\u4e86\u8be5\u9886\u57df\u9996\u4e2a\u77e5\u8bc6\u56fe\u8c31\u6784\u5efa\u57fa\u51c6\u6570\u636e\u96c6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents increasingly act through agent skills, i.e., natural-language instructions, that direct a host agent toward shell, network, credential, file, and process actions, and public registries distribute them at scale. In the first half of 2026, the OpenClaw AI agent went viral, and its public skill registry boomed: the observable stock nearly doubled in 91 days, and a majority of the listings visible in June were created in just two months. By the end of our study window, the wave had crested, and monthly listing creation and core-repository activity were falling from their spring peaks. This paper measures what the boom left behind, drawing on the OpenClaw Git history, its GitHub issues and pull requests, and three ClawHub registry snapshots. Attention is concentrated: the top 10% of skills received 46.93% of all downloads. No simple skill features (like size or download counts) remained a stable predictor of continued listing once creation cohort and skill age were controlled. Human scrutiny did not stay: 77.86% have zero stars and zero comments, while 85.06% of the readable skills carry privilege evidence. And automated cleanup is not ready: the three security scanners disagreed on 23,702 of the 61,990 skills they all cover. After human adjudication, weighted scanner sensitivity against the reference standard ranged from 21.67% to 61.06%. Governing fast-growing agent-skill registries cannot rely on simple metadata or single scanner scores; it requires robust, transparent measurement and independent validation.", "arxiv_id": "2609.17274", "arxiv_url": "https://arxiv.org/abs/2609.17274", "authors": ["Yunpeng Xiong", "Ting Zhang"], "brief": "\u8bba\u6587\u7814\u7a76\u4e86 OpenClaw \u667a\u80fd\u4f53\u6280\u80fd\u6ce8\u518c\u8868\u5728 2026 \u5e74\u7206\u7ea2\u540e\u7684\u9057\u7559\u751f\u6001\uff0c\u5206\u6790 Git \u5386\u53f2\u3001GitHub \u4e92\u52a8\u548c\u6ce8\u518c\u8868\u5feb\u7167\uff0c\u53d1\u73b0\u6280\u80fd\u589e\u957f\u867d\u5df2\u56de\u843d\u4f46\u7559\u4e0b\u5927\u91cf\u4f4e\u5173\u6ce8\u3001\u9ad8\u6743\u9650\u98ce\u9669\u7684\u6280\u80fd\u3002\u7ed3\u679c\u663e\u793a\u4e0b\u8f7d\u91cf\u9ad8\u5ea6\u96c6\u4e2d\uff0c\u7b80\u5355\u5143\u6570\u636e\u96be\u4ee5\u9884\u6d4b\u6280\u80fd\u7559\u5b58\uff0c\u4e14\u5b89\u5168\u626b\u63cf\u5668\u5206\u6b67\u4e25\u91cd\u3001\u7075\u654f\u5ea6\u6709\u9650\uff0c\u8bf4\u660e\u6cbb\u7406\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6001\u9700\u8981\u900f\u660e\u6d4b\u91cf\u548c\u72ec\u7acb\u9a8c\u8bc1\u3002", "categories": ["cs.SE", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17274", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u751f\u6001", "\u5b89\u5168\u6cbb\u7406", "\u6f0f\u6d1e\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17274v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "After the Party: Governing What a Viral Agent-Skill Ecosystem Left Behind", "tldr": "\u8bba\u6587\u7814\u7a76\u4e86 OpenClaw \u667a\u80fd\u4f53\u6280\u80fd\u6ce8\u518c\u8868\u5728 2026 \u5e74\u7206\u7ea2\u540e\u7684\u9057\u7559\u751f\u6001\uff0c\u5206\u6790 Git \u5386\u53f2\u3001GitHub \u4e92\u52a8\u548c\u6ce8\u518c\u8868\u5feb\u7167\uff0c\u53d1\u73b0\u6280\u80fd\u589e\u957f\u867d\u5df2\u56de\u843d\u4f46\u7559\u4e0b\u5927\u91cf\u4f4e\u5173\u6ce8\u3001\u9ad8\u6743\u9650\u98ce\u9669\u7684\u6280\u80fd\u3002\u7ed3\u679c\u663e\u793a\u4e0b\u8f7d\u91cf\u9ad8\u5ea6\u96c6\u4e2d\uff0c\u7b80\u5355\u5143\u6570\u636e\u96be\u4ee5\u9884\u6d4b\u6280\u80fd\u7559\u5b58\uff0c\u4e14\u5b89\u5168\u626b\u63cf\u5668\u5206\u6b67\u4e25\u91cd\u3001\u7075\u654f\u5ea6\u6709\u9650\uff0c\u8bf4\u660e\u6cbb\u7406\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6001\u9700\u8981\u900f\u660e\u6d4b\u91cf\u548c\u72ec\u7acb\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Oracle bone script (OBS), one of the earliest Chinese writing systems, plays an important role in the study of Chinese etymology. Traditional decipherment relies heavily on domain experts who analyze characters through semantic context and structural evolution. To assist this labor-intensive process, we formulate OBS decipherment assistance as a cross-era image translation task and propose FROD (Feature Matching Residual Denoising Oracle Bone Decipher). Although many OBS characters differ substantially from their modern counterparts, they often preserve local topological invariants at the radical level. During training, FROD leverages fast feature matching to provide gated segmentation supervision: paired samples with sufficient matches are processed patch-wise to align fine-grained radicals, whereas low-similarity pairs are trained holistically to avoid mismatched artifacts. In addition, a Residual Denoising Diffusion Model (RDDM) jointly estimates noise and residual signals, thereby reducing the positional drift and stroke disorder commonly observed in standard diffusion models. Finally, a multi-stage font stylization refinement network refines the generated images by eliminating edge noise and stabilizing stroke structures. On our augmented character-disjoint dataset, FROD achieves higher Top-1 recognition accuracy than the evaluated baselines, with a 3.8% absolute gain over OBSD.", "arxiv_id": "2609.17227", "arxiv_url": "https://arxiv.org/abs/2609.17227", "authors": ["Yanbin Hou", "Biao Xiong", "Guojun Xu", "Jianwen Xiang", "Cheng Tan", "Yanchao Yang", "Junwei Zhou"], "brief": "\u672c\u6587\u5c06\u7532\u9aa8\u6587\u91ca\u8bfb\u8f85\u52a9\u5efa\u6a21\u4e3a\u8de8\u65f6\u4ee3\u56fe\u50cf\u7ffb\u8bd1\u4efb\u52a1\uff0c\u63d0\u51fa FROD\uff0c\u901a\u8fc7\u7279\u5f81\u5339\u914d\u8fdb\u884c\u95e8\u63a7\u5206\u5272\u76d1\u7763\uff0c\u5bf9\u76f8\u4f3c\u6837\u672c\u505a\u5c40\u90e8\u90e8\u4ef6\u5bf9\u9f50\u3001\u5bf9\u4f4e\u76f8\u4f3c\u6837\u672c\u505a\u6574\u4f53\u8bad\u7ec3\u3002\u65b9\u6cd5\u7ed3\u5408\u6b8b\u5dee\u53bb\u566a\u6269\u6563\u6a21\u578b\u548c\u591a\u9636\u6bb5\u5b57\u4f53\u98ce\u683c\u7ec6\u5316\u7f51\u7edc\uff0c\u51cf\u5c11\u7b14\u753b\u6f02\u79fb\u4e0e\u566a\u58f0\uff0c\u5728\u5b57\u7b26\u4e0d\u91cd\u53e0\u6570\u636e\u96c6\u4e0a\u8f83 OBSD \u7684 Top-1 \u8bc6\u522b\u51c6\u786e\u7387\u63d0\u5347 3.8%\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17227", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7532\u9aa8\u6587\u8bc6\u522b", "\u56fe\u50cf\u7ffb\u8bd1", "\u6269\u6563\u6a21\u578b", "\u7279\u5f81\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17227v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FROD: Feature Matching Residual Denoising Oracle Bone Decipher", "tldr": "\u672c\u6587\u5c06\u7532\u9aa8\u6587\u91ca\u8bfb\u8f85\u52a9\u5efa\u6a21\u4e3a\u8de8\u65f6\u4ee3\u56fe\u50cf\u7ffb\u8bd1\u4efb\u52a1\uff0c\u63d0\u51fa FROD\uff0c\u901a\u8fc7\u7279\u5f81\u5339\u914d\u8fdb\u884c\u95e8\u63a7\u5206\u5272\u76d1\u7763\uff0c\u5bf9\u76f8\u4f3c\u6837\u672c\u505a\u5c40\u90e8\u90e8\u4ef6\u5bf9\u9f50\u3001\u5bf9\u4f4e\u76f8\u4f3c\u6837\u672c\u505a\u6574\u4f53\u8bad\u7ec3\u3002\u65b9\u6cd5\u7ed3\u5408\u6b8b\u5dee\u53bb\u566a\u6269\u6563\u6a21\u578b\u548c\u591a\u9636\u6bb5\u5b57\u4f53\u98ce\u683c\u7ec6\u5316\u7f51\u7edc\uff0c\u51cf\u5c11\u7b14\u753b\u6f02\u79fb\u4e0e\u566a\u58f0\uff0c\u5728\u5b57\u7b26\u4e0d\u91cd\u53e0\u6570\u636e\u96c6\u4e0a\u8f83 OBSD \u7684 Top-1 \u8bc6\u522b\u51c6\u786e\u7387\u63d0\u5347 3.8%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An agent that learns from rewards has to trust whatever reports those rewards. When the reports suddenly change, either the world changed or the reporter broke. From the reports alone these are indistinguishable, and reinforcement learning theory shows that no amount of further experience separates them. The prescribed escape is richer data about the reporter itself. We ask whether a frozen language model, handed exactly that data, uses it. We build a two-option game in which a payout swap and a lying reporter produce byte-identical histories. Then we add one verified record: an independent check of one round\u0027s real result, printed beside what the reporter said about that round. That single line settles the case. We ask three large models, from two families, to answer one question with one letter. Is the reporter honest or lying? They catch a lying reporter almost perfectly. At the 70B class that holds in every condition we tried; the 32B model slips in one wording. They clear an honest reporter far less often, and how often depends on things that should not matter. Averaged over rounds, letters, and wordings, a 72B model calls an honest reporter a liar 38% of the time when nothing has changed at all, and 58% of the time when the payouts moved. A 70B model from a second family calls an honest reporter a liar 26% and 48% of the time. The failure is not one of reading, because in the situation where nothing changed the same models score 0.96 to 1.00 with the answer printed in the prompt. Which surface feature drives it differs by family. For the Qwen models it is which round the record names, and for Llama it is which letter stands for \"honest.\" Adding the record to a prompt that already states the answer makes Llama less likely to give that answer. We had registered a prediction for that 58% before the run: 35%. The failure is larger than we expected.", "arxiv_id": "2609.17226", "arxiv_url": "https://arxiv.org/abs/2609.17226", "authors": ["Arman Nik Khah"], "brief": "\u8bba\u6587\u6784\u9020\u4e86\u4e00\u4e2a\u4e24\u9009\u9879\u6e38\u620f\uff0c\u5176\u4e2d\u771f\u5b9e\u6536\u76ca\u53d8\u5316\u4e0e\u5956\u52b1\u62a5\u544a\u8005\u6492\u8c0e\u4f1a\u4ea7\u751f\u5b8c\u5168\u76f8\u540c\u7684\u5386\u53f2\uff0c\u5e76\u901a\u8fc7\u52a0\u5165\u4e00\u6761\u72ec\u7acb\u9a8c\u8bc1\u8bb0\u5f55\u6765\u6d4b\u8bd5\u5927\u8bed\u8a00\u6a21\u578b\u80fd\u5426\u5224\u65ad\u62a5\u544a\u8005\u662f\u5426\u8bda\u5b9e\u3002\u7ed3\u679c\u663e\u793a\u6a21\u578b\u51e0\u4e4e\u603b\u80fd\u8bc6\u522b\u8bf4\u8c0e\u62a5\u544a\u8005\uff0c\u4f46\u7ecf\u5e38\u8bef\u5224\u8bda\u5b9e\u62a5\u544a\u8005\u4e3a\u9a97\u5b50\uff0c\u4e14\u53d7\u8f6e\u6b21\u3001\u5b57\u6bcd\u6807\u7b7e\u7b49\u65e0\u5173\u8868\u9762\u56e0\u7d20\u663e\u8457\u5f71\u54cd\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17226", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u4fe1\u53f7", "\u53ef\u4fe1\u6027\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17226v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Easy to Catch a Liar, Hard to Clear an Honest One: Language Models Diagnosing a Corrupted Reward Channel from a Verified Record", "tldr": "\u8bba\u6587\u6784\u9020\u4e86\u4e00\u4e2a\u4e24\u9009\u9879\u6e38\u620f\uff0c\u5176\u4e2d\u771f\u5b9e\u6536\u76ca\u53d8\u5316\u4e0e\u5956\u52b1\u62a5\u544a\u8005\u6492\u8c0e\u4f1a\u4ea7\u751f\u5b8c\u5168\u76f8\u540c\u7684\u5386\u53f2\uff0c\u5e76\u901a\u8fc7\u52a0\u5165\u4e00\u6761\u72ec\u7acb\u9a8c\u8bc1\u8bb0\u5f55\u6765\u6d4b\u8bd5\u5927\u8bed\u8a00\u6a21\u578b\u80fd\u5426\u5224\u65ad\u62a5\u544a\u8005\u662f\u5426\u8bda\u5b9e\u3002\u7ed3\u679c\u663e\u793a\u6a21\u578b\u51e0\u4e4e\u603b\u80fd\u8bc6\u522b\u8bf4\u8c0e\u62a5\u544a\u8005\uff0c\u4f46\u7ecf\u5e38\u8bef\u5224\u8bda\u5b9e\u62a5\u544a\u8005\u4e3a\u9a97\u5b50\uff0c\u4e14\u53d7\u8f6e\u6b21\u3001\u5b57\u6bcd\u6807\u7b7e\u7b49\u65e0\u5173\u8868\u9762\u56e0\u7d20\u663e\u8457\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous Software Engineering Agents (SWE-Agents) excel in deterministic coding tasks but struggle with Architecture 0, the nascent system design phase plagued by implicit engineering constraints, or Unknown Unknowns (UUs) that are rarely stated explicitly. To investigate how agents navigate UUs, we explore a progressive trajectory across pure-text self-play, tool-augmented feedback, and external physical mapping. Our empirical analysis reveals a cascading chain of failures. Pure-text reasoning inevitably devolves into polite consensus or plausible yet physically impossible fabrications. Attempting to bridge this gap via an early-stage execution sandbox unexpectedly triggers Specification Gaming: agents exploit their autonomy over validation scripts to bypass physical constraints, achieving superficial success without resolving core architectural flaws. To resolve this self-validation trap, we propose the Physical Mapping Guard (PMG). Grounded in the software engineering principle of Separation of Concerns, PMG revokes verification authority from the agent, forcing semantic intents to be evaluated by an external, deterministic Semantic-to-Physical (S2P) mapping engine. Extensive evaluations demonstrate that PMG completely eradicates physical-layer and validation-layer gaming. By precisely isolating residual failures to semantic reinterpretations and auditor overreach, PMG marks a critical step toward genuine affordance grounding in automated architectural design.", "arxiv_id": "2609.17221", "arxiv_url": "https://arxiv.org/abs/2609.17221", "authors": ["Zhongkai Wang", "Yan Liu"], "brief": "\u8bba\u6587\u7814\u7a76\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u5728\u65e9\u671f\u67b6\u6784\u8bbe\u8ba1\uff08Architecture 0\uff09\u4e2d\u9762\u5bf9\u9690\u542b\u7ea6\u675f\u548c\u201c\u672a\u77e5\u672a\u77e5\u201d\u65f6\u7684\u5931\u8d25\u6a21\u5f0f\uff1a\u7eaf\u6587\u672c\u63a8\u7406\u4f1a\u4ea7\u751f\u865a\u5047\u5171\u8bc6\u6216\u7269\u7406\u4e0d\u53ef\u884c\u65b9\u6848\uff0c\u52a0\u5165\u6c99\u7bb1\u540e\u53c8\u4f1a\u51fa\u73b0\u901a\u8fc7\u64cd\u7eb5\u9a8c\u8bc1\u811a\u672c\u7ed5\u8fc7\u7ea6\u675f\u7684\u89c4\u683c\u535a\u5f08\u3002\u4f5c\u8005\u63d0\u51fa Physical Mapping Guard\uff0c\u5c06\u9a8c\u8bc1\u6743\u4ece\u667a\u80fd\u4f53\u4e2d\u5265\u79bb\uff0c\u7528\u5916\u90e8\u786e\u5b9a\u6027\u7684\u8bed\u4e49\u5230\u7269\u7406\u6620\u5c04\u5f15\u64ce\u8bc4\u4f30\u8bbe\u8ba1\u610f\u56fe\uff0c\u4ece\u800c\u6d88\u9664\u7269\u7406\u5c42\u4e0e\u9a8c\u8bc1\u5c42\u4f5c\u5f0a\uff0c\u5e76\u66f4\u6e05\u6670\u5b9a\u4f4d\u5269\u4f59\u9519\u8bef\u6765\u6e90\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17221", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u67b6\u6784\u8bbe\u8ba1", "\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17221v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Grounding SWE-Agent Decisions in Architecture-0 Design: Navigating Unknown Unknowns through Physical Mapping", "tldr": "\u8bba\u6587\u7814\u7a76\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u5728\u65e9\u671f\u67b6\u6784\u8bbe\u8ba1\uff08Architecture 0\uff09\u4e2d\u9762\u5bf9\u9690\u542b\u7ea6\u675f\u548c\u201c\u672a\u77e5\u672a\u77e5\u201d\u65f6\u7684\u5931\u8d25\u6a21\u5f0f\uff1a\u7eaf\u6587\u672c\u63a8\u7406\u4f1a\u4ea7\u751f\u865a\u5047\u5171\u8bc6\u6216\u7269\u7406\u4e0d\u53ef\u884c\u65b9\u6848\uff0c\u52a0\u5165\u6c99\u7bb1\u540e\u53c8\u4f1a\u51fa\u73b0\u901a\u8fc7\u64cd\u7eb5\u9a8c\u8bc1\u811a\u672c\u7ed5\u8fc7\u7ea6\u675f\u7684\u89c4\u683c\u535a\u5f08\u3002\u4f5c\u8005\u63d0\u51fa Physical Mapping Guard\uff0c\u5c06\u9a8c\u8bc1\u6743\u4ece\u667a\u80fd\u4f53\u4e2d\u5265\u79bb\uff0c\u7528\u5916\u90e8\u786e\u5b9a\u6027\u7684\u8bed\u4e49\u5230\u7269\u7406\u6620\u5c04\u5f15\u64ce\u8bc4\u4f30\u8bbe\u8ba1\u610f\u56fe\uff0c\u4ece\u800c\u6d88\u9664\u7269\u7406\u5c42\u4e0e\u9a8c\u8bc1\u5c42\u4f5c\u5f0a\uff0c\u5e76\u66f4\u6e05\u6670\u5b9a\u4f4d\u5269\u4f59\u9519\u8bef\u6765\u6e90\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) models, world-action models (WAMs), and offline reinforcement learning methods are rapidly expanding the design space of embodied policies, yet turning these algorithms into reliable robot systems remains constrained by fragmented data formats, training stacks, evaluation protocols, inference runtimes, and embodiment-specific interfaces. We present $\\mathrm{FluxVLA}$ Engine, an open, configuration-driven platform that turns heterogeneous embodied-policy components into a reproducible data-to-deployment workflow. Rather than introducing another policy model, $\\mathrm{FluxVLA}$ standardizes interfaces for datasets, visual-language and world models, action heads, reward- or advantage-weighted learning, distributed training, simulation evaluation, optimized inference, and robot operators. The engine further integrates compositional dual-arm simulation, scalable automatic data generation, and model-decoupled human-in-the-loop rollout, takeover, correction collection, and reward annotation. For responsive physical execution, it combines Real-Time Chunking (RTC) with accelerated inference backends, lightweight remote GPU serving, and configurable trajectory post-processing. Together, these capabilities connect offline learning, simulation validation, online correction, and real-robot execution through shared and auditable contracts. $\\mathrm{FluxVLA}$ therefore targets the engineering bottlenecks separating promising embodied-learning algorithms from reproducible evaluation and dependable deployment. Code is available at https://github.com/FluxVLA/FluxVLA", "arxiv_id": "2609.17210", "arxiv_url": "https://arxiv.org/abs/2609.17210", "authors": ["Yinhao Li", "Weixin Mao", "Zihan Lan", "Jikun Rong", "Qirui Hu", "Yiming Zhang", "Weipeng Deng", "Bowen Shen", "Minzhao Zhu", "Yiming Mao", "Yan Yang", "Chenguang Cui", "Hongyuan Chen", "Xu Huang", "Zheyi Zhao", "Pinxi Shen", "Bozhen He", "Zhen Fu", "Yifan Wang", "Zexin Zhang", "Ang Gao", "Haoyu Chen", "Chengqi Shi", "Hua Chen"], "brief": "FluxVLA Engine \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u667a\u80fd\u7684\u5f00\u6e90 VLA \u5de5\u7a0b\u5e73\u53f0\uff0c\u7edf\u4e00\u6570\u636e\u3001\u6a21\u578b\u3001\u52a8\u4f5c\u5934\u3001\u8bad\u7ec3\u3001\u4eff\u771f\u8bc4\u6d4b\u3001\u63a8\u7406\u90e8\u7f72\u548c\u673a\u5668\u4eba\u63a5\u53e3\u7b49\u6d41\u7a0b\u3002\u5b83\u4e0d\u63d0\u51fa\u65b0\u7b56\u7565\u6a21\u578b\uff0c\u800c\u662f\u901a\u8fc7\u914d\u7f6e\u5316\u4e0e\u6807\u51c6\u5316\u63a5\u53e3\u8fde\u63a5\u79bb\u7ebf\u5b66\u4e60\u3001\u4eff\u771f\u9a8c\u8bc1\u3001\u4eba\u7c7b\u53cd\u9988\u4fee\u6b63\u548c\u771f\u5b9e\u673a\u5668\u4eba\u6267\u884c\uff0c\u65e8\u5728\u964d\u4f4e\u4ece\u7b97\u6cd5\u5230\u53ef\u9760\u90e8\u7f72\u7684\u5de5\u7a0b\u95e8\u69db\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17210", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u5de5\u7a0b\u5e73\u53f0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17210v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FluxVLA Engine: A One-Stop VLA Engineering Platform for Embodied Intelligence", "tldr": "FluxVLA Engine \u662f\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u667a\u80fd\u7684\u5f00\u6e90 VLA \u5de5\u7a0b\u5e73\u53f0\uff0c\u7edf\u4e00\u6570\u636e\u3001\u6a21\u578b\u3001\u52a8\u4f5c\u5934\u3001\u8bad\u7ec3\u3001\u4eff\u771f\u8bc4\u6d4b\u3001\u63a8\u7406\u90e8\u7f72\u548c\u673a\u5668\u4eba\u63a5\u53e3\u7b49\u6d41\u7a0b\u3002\u5b83\u4e0d\u63d0\u51fa\u65b0\u7b56\u7565\u6a21\u578b\uff0c\u800c\u662f\u901a\u8fc7\u914d\u7f6e\u5316\u4e0e\u6807\u51c6\u5316\u63a5\u53e3\u8fde\u63a5\u79bb\u7ebf\u5b66\u4e60\u3001\u4eff\u771f\u9a8c\u8bc1\u3001\u4eba\u7c7b\u53cd\u9988\u4fee\u6b63\u548c\u771f\u5b9e\u673a\u5668\u4eba\u6267\u884c\uff0c\u65e8\u5728\u964d\u4f4e\u4ece\u7b97\u6cd5\u5230\u53ef\u9760\u90e8\u7f72\u7684\u5de5\u7a0b\u95e8\u69db\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The analysis and classification of cultural heritage architectural styles remain challenging due to the complexity of visual images of buildings, which are highly relied on in traditional CNN-based classification approaches in comparison to textual descriptions, and the relative lack of non-western region-specific datasets. This paper addresses this gap by proposing a multimodal machine learning framework to analyze and classify Emirati residential architecture using OpenAI\u0027s CLIP model. We integrate visual features from images and textual features from expert descriptions into a unified 512-dimensional embedding, followed by dimensionality reduction with UMAP for visualization and unsupervised clustering using K-Means. Cluster labels, which are derived from manual analysis of the K-Means clusters, are used to train an SVM classifier for automated architectural style classification. Our approach achieves a classification accuracy of 98% across eight identified style clusters, higher than every other study in the literature, demonstrating the effectiveness of combining visual and textual modalities. Overall, this paper highlights the potential of using multimodal AI to support architectural heritage analysis, offering scalable and interpretable tools for exploring regional architectural identities.", "arxiv_id": "2609.17181", "arxiv_url": "https://arxiv.org/abs/2609.17181", "authors": ["Ahmed Ammar Kubba", "Manar Abu Talib", "Iman Ibrahim", "Qassim Nasir"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u963f\u8054\u914b\u4f4f\u5b85\u5efa\u7b51\u98ce\u683c\u5206\u7c7b\u7684\u591a\u6a21\u6001\u6846\u67b6\uff0c\u5c06\u5efa\u7b51\u56fe\u50cf\u4e0e\u4e13\u5bb6\u6587\u672c\u63cf\u8ff0\u901a\u8fc7 CLIP \u878d\u5408\u4e3a\u7edf\u4e00\u5d4c\u5165\uff0c\u5e76\u7ed3\u5408 UMAP\u3001K-Means \u548c SVM \u8fdb\u884c\u805a\u7c7b\u4e0e\u5206\u7c7b\u3002\u65b9\u6cd5\u5728\u516b\u7c7b\u5efa\u7b51\u98ce\u683c\u4e0a\u8fbe\u5230 98% \u51c6\u786e\u7387\uff0c\u663e\u793a\u591a\u6a21\u6001\u8868\u5f81\u5bf9\u975e\u897f\u65b9\u5730\u533a\u6587\u5316\u9057\u4ea7\u5efa\u7b51\u5206\u6790\u5177\u6709\u8f83\u597d\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17181", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u6587\u5316\u9057\u4ea7", "\u5efa\u7b51\u98ce\u683c\u5206\u7c7b", "CLIP"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17181v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multimodal Cultural Heritage Architectural Style Classification for Residential Buildings in the UAE Based on CLIP Embeddings and SVM", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u963f\u8054\u914b\u4f4f\u5b85\u5efa\u7b51\u98ce\u683c\u5206\u7c7b\u7684\u591a\u6a21\u6001\u6846\u67b6\uff0c\u5c06\u5efa\u7b51\u56fe\u50cf\u4e0e\u4e13\u5bb6\u6587\u672c\u63cf\u8ff0\u901a\u8fc7 CLIP \u878d\u5408\u4e3a\u7edf\u4e00\u5d4c\u5165\uff0c\u5e76\u7ed3\u5408 UMAP\u3001K-Means \u548c SVM \u8fdb\u884c\u805a\u7c7b\u4e0e\u5206\u7c7b\u3002\u65b9\u6cd5\u5728\u516b\u7c7b\u5efa\u7b51\u98ce\u683c\u4e0a\u8fbe\u5230 98% \u51c6\u786e\u7387\uff0c\u663e\u793a\u591a\u6a21\u6001\u8868\u5f81\u5bf9\u975e\u897f\u65b9\u5730\u533a\u6587\u5316\u9057\u4ea7\u5efa\u7b51\u5206\u6790\u5177\u6709\u8f83\u597d\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal counselor response generation (MCRG) aims to generate an appropriate counselor response from multimodal dialogue histories. Progress is limited by two gaps: first, existing datasets rarely capture sustained, human-recorded counseling interactions conducted by qualified counselors; Second, existing methods do not explicitly optimize consistency between counseling reasoning and the generated response, potentially undermining the reliability of MCRG systems. Thus, we introduce MOCC, a multimodal counseling conversation corpus containing over 200 hours of interactions involving 154 credential-verified counselors. Based on MOCC, we propose MOCC-R1, a two-stage framework for optimizing reasoning-response consistency. Cold-start supervised fine-tuning trains the model to generate a structured trajectory consisting of client-state understanding, a response intent that links a counseling principle to a planned action, and the final response. Reinforcement learning (RL) then rewards grounded plan coherence and plan execution, encouraging the inferred state and plan to be supported by the dialogue context and the response to realize that plan. Experiments demonstrate the effectiveness of the proposed MOCC-R1.", "arxiv_id": "2609.17180", "arxiv_url": "https://arxiv.org/abs/2609.17180", "authors": ["Wenjie Zheng", "Qiming Xie", "Jianfei Yu", "Rui Xia"], "brief": "\u672c\u6587\u63d0\u51fa MOCC\uff0c\u4e00\u4e2a\u5305\u542b 200 \u591a\u5c0f\u65f6\u771f\u5b9e\u591a\u6a21\u6001\u5fc3\u7406\u54a8\u8be2\u5bf9\u8bdd\u7684\u6570\u636e\u96c6\uff0c\u53c2\u4e0e\u8005\u5305\u62ec 154 \u540d\u8d44\u8d28\u9a8c\u8bc1\u54a8\u8be2\u5e08\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u96c6\uff0cMOCC-R1 \u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u201c\u54a8\u8be2\u63a8\u7406\u2014\u56de\u590d\u751f\u6210\u201d\u7684\u4e00\u81f4\u6027\uff0c\u63d0\u5347\u591a\u6a21\u6001\u54a8\u8be2\u56de\u590d\u7684\u53ef\u9760\u6027\u4e0e\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17180", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5fc3\u7406\u54a8\u8be2", "\u5f3a\u5316\u5b66\u4e60", "\u5bf9\u8bdd\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17180v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MOCC-R1: Reinforcing Reasoning-Response Consistency for Multimodal Counselor Response Generation", "tldr": "\u672c\u6587\u63d0\u51fa MOCC\uff0c\u4e00\u4e2a\u5305\u542b 200 \u591a\u5c0f\u65f6\u771f\u5b9e\u591a\u6a21\u6001\u5fc3\u7406\u54a8\u8be2\u5bf9\u8bdd\u7684\u6570\u636e\u96c6\uff0c\u53c2\u4e0e\u8005\u5305\u62ec 154 \u540d\u8d44\u8d28\u9a8c\u8bc1\u54a8\u8be2\u5e08\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u96c6\uff0cMOCC-R1 \u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u201c\u54a8\u8be2\u63a8\u7406\u2014\u56de\u590d\u751f\u6210\u201d\u7684\u4e00\u81f4\u6027\uff0c\u63d0\u5347\u591a\u6a21\u6001\u54a8\u8be2\u56de\u590d\u7684\u53ef\u9760\u6027\u4e0e\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The interpretability of complex machine learning models is of paramount importance, especially in real-world high-stakes domains such as healthcare and finance. However, existing post-hoc interpretability methods suffer from inherent limitations: fragmented analytical processes, inadequate capacity to model nonlinear feature interactions, computational inefficiencies, and over-reliance on specific model architectures. To address these challenges, this paper provides a novel method - Adaptive Derivative-Ordered Random Explanation (ADORE) - that leverages first- and second-order derivatives to accommodate nonlinear model complexities, while enabling effective capture of feature-sample interactions within a unified analytical framework. ADORE integrates global feature importance with local sample contributions, precisely quantifying feature impact by capturing both magnitude and direction, and identifying critical samples influencing model decisions. Furthermore, it achieves computational efficiency through randomized singular value decomposition (SVD) and dynamic sparsity detection, making it scalable to large, high-dimensional datasets. Experiments across three data modalities - tabular, text, and image - demonstrate that ADORE outperforms existing methods such as LIME and SHAP in handling complex interactions and computational efficiency, while providing detailed and reliable explanations. To facilitate adoption and reproducibility, ADORE has been released as an open-source Python package, hosted on GitHub, enabling researchers and practitioners to readily adapt and apply our approach to their specific tasks, models, and datasets.", "arxiv_id": "2609.17171", "arxiv_url": "https://arxiv.org/abs/2609.17171", "authors": ["Lemen Chao", "Ming Lei", "Anran Fanga"], "brief": "\u8bba\u6587\u63d0\u51fa ADORE\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u4e8b\u540e\u53ef\u89e3\u91ca\u6027\u6846\u67b6\uff0c\u5229\u7528\u4e00\u9636\u548c\u4e8c\u9636\u5bfc\u6570\u523b\u753b\u975e\u7ebf\u6027\u7279\u5f81\u4ea4\u4e92\uff0c\u540c\u65f6\u7ed3\u5408\u5168\u5c40\u7279\u5f81\u91cd\u8981\u6027\u4e0e\u5c40\u90e8\u6837\u672c\u8d21\u732e\u3002\u5b9e\u9a8c\u8986\u76d6\u8868\u683c\u3001\u6587\u672c\u548c\u56fe\u50cf\u6570\u636e\uff0c\u663e\u793a\u5176\u76f8\u6bd4 LIME\u3001SHAP \u5728\u590d\u6742\u4ea4\u4e92\u89e3\u91ca\u548c\u8ba1\u7b97\u6548\u7387\u4e0a\u66f4\u4f18\uff0c\u5e76\u5df2\u5f00\u6e90\u4e3a Python \u5305\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17171", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u7279\u5f81\u91cd\u8981\u6027", "\u6a21\u578b\u89e3\u91ca", "\u968f\u673aSVD"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17171v1", "published_at": "2026-09-15", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A unified framework for global and local interpretability using adaptive derivative-ordered random explanation", "tldr": "\u8bba\u6587\u63d0\u51fa ADORE\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u4e8b\u540e\u53ef\u89e3\u91ca\u6027\u6846\u67b6\uff0c\u5229\u7528\u4e00\u9636\u548c\u4e8c\u9636\u5bfc\u6570\u523b\u753b\u975e\u7ebf\u6027\u7279\u5f81\u4ea4\u4e92\uff0c\u540c\u65f6\u7ed3\u5408\u5168\u5c40\u7279\u5f81\u91cd\u8981\u6027\u4e0e\u5c40\u90e8\u6837\u672c\u8d21\u732e\u3002\u5b9e\u9a8c\u8986\u76d6\u8868\u683c\u3001\u6587\u672c\u548c\u56fe\u50cf\u6570\u636e\uff0c\u663e\u793a\u5176\u76f8\u6bd4 LIME\u3001SHAP \u5728\u590d\u6742\u4ea4\u4e92\u89e3\u91ca\u548c\u8ba1\u7b97\u6548\u7387\u4e0a\u66f4\u4f18\uff0c\u5e76\u5df2\u5f00\u6e90\u4e3a Python \u5305\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Forecasting anatomical changes such as tumor growth and neurodegeneration is a challenging generative vision task. Morphological evolution is subtle relative to static anatomy, highly patient-specific, and inherently stochastic. Existing methods struggle with several issues: deterministic networks ignore biological stochasticity, while standard diffusion models require computationally prohibitive multi-pass sampling to quantify uncertainty. We propose MUMINS (Metadata-conditioned Uncertainty-aware Medical Image Next-state Synthesis), an efficient diffusion framework that jointly diffuses a baseline scan and its follow-up residual, summed to synthesize the follow-up scan, while concurrently predicting a spatial uncertainty map, in a single reverse diffusion process. Conditioned on the time interval and relevant metadata, it preserves fine-grained anatomy by dynamically re-injecting the baseline as a soft anchor at every denoising step, and a negative-log-likelihood head learns the uncertainty map to explicitly flag error-prone regions. Designed without organ-specific heuristics, the same architecture is reused across anatomies via separate, dataset-specific retraining. Extensive evaluations demonstrate that dataset-specific retraining of MUMINS matches or outperforms 4b\u7a7a\u95f4\u4e0d\u786e\u5b9a\u6027\u56fe\u3002\u5b83\u901a\u8fc7\u5728\u53bb\u566a\u8fc7\u7a0b\u4e2d\u52a8\u6001\u91cd\u6ce8\u5165\u57fa\u7ebf\u5f71\u50cf\u6765\u4fdd\u7559\u7ec6\u7c92\u5ea6\u89e3\u5256\u7ed3\u6784\uff0c\u5728\u80baCT\u548c\u8111MRI\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u9886\u57df\u4e13\u7528\u65b9\u6cd5\uff0c\u5e76\u80fd\u4ee5\u5355\u6b21\u53cd\u5411\u6269\u6563\u4f30\u8ba1\u4e0d\u786e\u5b9a\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision Transformers (ViTs) are central to most modern vision models, yet obtaining input attributions that are fine-grained, faithful, and stable remains challenging. Layer-wise Relevance Propagation (LRP) has been adapted to transformer attention, but in ViTs it often produces noisy, unfaithful explanations. We show that the missing ingredient is the treatment of residual connections: cancellation effects in residual pathways lead to attribution explosion. Moreover, we find that these cancellations are substantially stronger in ViTs than in language transformers. To address this issue, we introduce Residual-aware Layer-wise Relevance Propagation (ResLRP), a simple extension of LRP whose propagation rules explicitly account for cancellations in residual branches, are exactly conservative, and provably bound relevance explosion. Causal channel-wise interventions confirm that residual cancellation, not a generic regularization effect, drives the instability. ResLRP substantially improves attribution quality across faithfulness and localization, evaluated on ViT architectures spanning supervised, self-supervised, contrastive, hierarchical, and multimodal families, as well as on the ground-truth-controlled FunnyBirds benchmark. The largest gains arise in modern Vision Language Models (VLMs), with +27-29% localization and up to 3.4x faithfulness scores. Beyond benchmarks, ResLRP localizes Sparse Autoencoder (SAE) features in input space, and our residual amplification RP\uff0c\u5728\u4f20\u64ad\u89c4\u5219\u4e2d\u663e\u5f0f\u5904\u7406\u6b8b\u5dee\u5206\u652f\u62b5\u6d88\uff0c\u4fdd\u8bc1\u5b88\u6052\u5e76\u9650\u5236\u7206\u70b8\uff0c\u5728\u591a\u7c7b ViT/VLM \u4e0a\u663e\u8457\u63d0\u5347\u5f52\u56e0\u7684\u5fe0\u5b9e\u6027\u4e0e\u5b9a\u4f4d\u6548\u679c\uff0cVLM \u4e0a\u5b9a\u4f4d\u63d0\u5347\u7ea6 27-29%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous racing confronts significant challenges in safely overtaking Opponent Vehicles (OVs) that exhibit uncertain trajectories, stemming from unknown driving policies. To address these challenges, this study proposes heterogeneous kernel metrics for Deep Kernel Learning (DKL), designed to robustly capture the diverse driving policies of OVs, and carry out precise trajectory predictions along with the associated uncertainties. A key virtue of the proposed kernel metrics lies in their ability to align similar driving policies and disjoin dissimilar ones in an unsupervised manner, given the observed interactions between the Ego Vehicle (EV) and OVs. The efficacy of the proposed method is substantiated through experimental studies on a 1/10th scale racecar platform, demonstrating improved prediction accuracy and thereby safely overtaking against OVs. Furthermore, our method is computationally efficient for onboard computing units, affirming its viability in fast-paced racing environments. The video and source code can be found at https://github.com/HMCL-UNIST/OpponentPredictionWithKMDKL.git.", "arxiv_id": "2609.17147", "arxiv_url": "https://arxiv.org/abs/2609.17147", "authors": ["Hojin Lee", "Youngim Nam", "Sanghun Lee", "Cheolhyeon Kwon"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u6df1\u5ea6\u6838\u5b66\u4e60\u7684\u5f02\u6784\u6838\u5ea6\u91cf\uff0c\u5728\u65e0\u9700\u76d1\u7763\u7684\u60c5\u51b5\u4e0b\u6839\u636e\u81ea\u8f66\u4e0e\u5bf9\u624b\u8f66\u4ea4\u4e92\u5bf9\u76f8\u4f3c/\u4e0d\u540c\u9a7e\u9a76\u7b56\u7565\u8fdb\u884c\u5bf9\u9f50\u significant challenges such as traction loss and dynamic instability. Despite recent progress in learning-based traversability prediction, these methods often fail to adapt to novel terrains. Even when adaptation is achieved, retaining experience from previously trained environments remains a challenge, a problem known as catastrophic forgetting. To address this challenge, we propose a continual learning framework for traversability prediction that incrementally adapts to new terrains using a generative experience recall model. A key virtue of the proposed framework is two folds: i) retain prior experience without storing past data; and ii) incorporate the uncertainty of the generated samples from the recall model, enabling uncertainty-aware adaptation. Real-world experiments with a skid-steering robot validate the effectiveness of the proposed framework, demonstrating its ability to adapt across a series of diverse environments while mitigating catastrophic forgetting.", "arxiv_id": "2609.17141", "arxiv_url": "https://arxiv.org/abs/2609.17141", "authors": ["Hojin Lee", "Yunho Lee", "Daniel A Duecker", "Cheolhyeon Kwon"], "brief": "\u672c\u6587\u63d0\u51fa\u7528\u4e8e\u53ef\u901a\u884c\u6027\u9884\u6d4b\u7684\u6301\u7eed\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u751f\u6210\u5f0f\u7ecf\u9a8c\u56de\u5fc6\u5728\u4e0d\u5b58\u50a8\u5386\u53f2\u6570\u636e\u7684\u60c5\u51b5\u4e0b\u4fdd\u7559\u65e7\u5730\u5f62\u7ecf\u9a8c\u3002\u65b9\u6cd5\u8fd8\u5c06\u751f\u6210\u6837\u672c\u7684\u4e0d\u786e\u5b9a\u6027\u7eb3\u5165\u81ea\u9002\u5e94\u8fc7\u7a0b\uff0c\u771f\u5b9e\u6ed1\u79fb\u8f6c\u5411\u673a\u5668\u4eba\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u9002\u5e94\u591a\u79cd\u65b0\u73af\u5883\u5e76\u7f13\u89e3\u707e\u96be\u6027\u9057\u5fd8\u3002", "categories": ["cs.RO", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17141", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b6
