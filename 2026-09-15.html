df_url": "https://arxiv.org/pdf/2609.16679v1", "published_at": "2026-09-15", "score": 0.434, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.16679.png", "title": "AI for Games in the Foundation Model Era", "tldr": "\u7efc\u8ff0\u57fa\u7840\u6a21\u578b\u65f6\u4ee3\u7684\u6e38\u620fAI\u5168\u751f\u547d\u5468\u671f\u3002", "upvotes": 7, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u68b3\u7406\u57fa\u7840\u6a21\u578b\u4e0e\u5b66\u4e60\u5f0f\u6e38\u620f\u4e16\u754c\u6a21\u578b\u5982\u4f55\u91cd\u5851\u6e38\u620fAI\uff0c\u4ece\u6e38\u620f\u6e38\u73a9\u3001\u73a9\u5bb6\u4e0e\u4e16\u754c\u5efa\u6a21\uff0c\u5230\u8bbe\u8ba1\u5f00\u53d1\u3001\u8fd0\u884c\u65f6\u9002\u914d\u548c\u6d4b\u8bd5\u8bc4\u4f30\u3002\u4f5c\u8005\u6309AI\u8f93\u51fa\u7528\u9014\u5212\u5206\u516d\u7c7b\u89d2\u8272\uff0c\u5e76\u5206\u6790\u5404\u7c7b\u80fd\u529b\u3001\u4ea7\u7269\u4e0e\u8bc1\u636e\u80fd\u5426\u8de8\u6e38\u620f\u548c\u5de5\u4f5c\u6d41\u8fc1\u79fb\u3002", "why_notable": "\u8fd9\u662f\u4e00\u7bc7\u9762\u5411\u57fa\u7840\u6a21\u578b\u65f6\u4ee3\u6e38\u620fAI\u7684\u7efc\u8ff0\u4e0e\u95ee\u9898\u6846\u67b6\uff0c\u5e2e\u52a9\u7edf\u4e00\u6b64\u524d\u5206\u6563\u7684\u7814\u7a76\u65b9\u5411\uff0c\u5e76\u6307\u51fa\u5f53\u524d\u8bc4\u4f30\u6210\u719f\u5ea6\u4e0d\u8db3\u7684\u5173\u952e\u74f6\u9888\uff0c\u5982\u6301\u4e45\u4e16\u754c\u72b6\u6001\u3001\u6301\u7eed\u8f6f\u4ef6\u4fee\u8ba2\u3001\u53ef\u9760\u73a9\u5bb6\u5efa\u6a21\u548c\u4ee3\u8868\u6027\u81ea\u52a8\u5316\u6d4b\u8bd5\u3002"}, {"abstract": "A central tenet of human cognition is systematicity, the principle that understanding one concept is inherently tied to understanding close variations of that concept. Do reasoning models robustly exhibit such systematicity? If so, we would expect consistent performance on structurally equivalent variants of the same task. Here, we extend established rule induction tasks from cognitive science to assess the systematicity of thought in current reasoning models. Each task family has compositional structure that we use to create structurally equivalent task variations through task isomorphisms such as recombination and substitution. We find that despite being able to correctly solve a task, models often fail on structurally equivalent variants of the same task. These findings suggest that many model behaviors lack systematicity, rendering it difficult to robustly establish the cognitive abilities of reasoning models beyond the particular contexts they were evaluated in.", "arxiv_id": "2609.13948", "arxiv_url": "https://arxiv.org/abs/2609.13948", "authors": ["Simon Schug", "Brenden M. Lake"], "brief": "\u672c\u6587\u5c06\u8ba4\u77e5\u79d1\u5b66\u4e2d\u7684\u89c4\u5219\u5f52\u7eb3\u4efb\u52a1\u6269\u5c55\u4e3a\u4e00\u7ec4\u5177\u6709\u7ec4\u5408\u7ed3\u6784\u7684\u8bc4\u6d4b\uff0c\u7528\u91cd\u7ec4\u3001\u66ff\u6362\u7b49\u4efb\u52a1\u540c\u6784\u65b9\u6cd5\u751f\u6210\u7ed3\u6784\u7b49\u4ef7\u53d8\u4f53\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5f53\u524d\u63a8\u7406\u6a21\u578b\u5373\u4f7f\u80fd\u89e3\u51fa\u539f\u4efb\u52a1\uff0c\u4e5f\u5e38\u5728\u7b49\u4ef7\u53d8\u4f53\u4e0a\u5931\u8d25\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": "https://github.com/smonsays/systematicity-eval", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.13948", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u4ee5\u201c\u7cfb\u7edf\u6027\u201d\u4e3a\u6838\u5fc3\u8bc4\u4f30\u6807\u51c6\uff1a\u82e5\u6a21\u578b\u771f\u6b63\u7406\u89e3\u89c4\u5219\uff0c\u5e94\u80fd\u7a33\u5b9a\u89e3\u51b3\u7ed3\u6784\u7b49\u4ef7\u7684\u4efb\u52a1\u53d8\u4f53", "\u6784\u9020\u4e86\u57fa\u4e8e\u7ec4\u5408\u7ed3\u6784\u7684\u89c4\u5219\u5f52\u7eb3\u4efb\u52a1\u65cf\uff0c\u5e76\u901a\u8fc7\u91cd\u7ec4\u3001\u66ff\u6362\u7b49\u540c\u6784\u53d8\u6362\u751f\u6210\u6d4b\u8bd5\u6837\u672c", "\u7ed3\u679c\u663e\u793a\u6a21\u578b\u8868\u73b0\u5bf9\u5177\u4f53\u8868\u8ff0\u548c\u4e0a\u4e0b\u6587\u9ad8\u5ea6\u654f\u611f\uff0c\u96be\u4ee5\u8bc1\u660e\u5176\u5177\u5907\u7a33\u5065\u7684\u7c7b\u4eba\u63a8\u7406\u80fd\u529b"], "keywords": ["\u63a8\u7406\u80fd\u529b", "\u89c4\u5219\u5f52\u7eb3", "\u7ec4\u5408\u6cdb\u5316", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Princeton University", "pdf_url": "https://arxiv.org/pdf/2609.13948v1", "published_at": "2026-09-12", "score": 0.417, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Princeton", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13948.png", "title": "Thought without systematicity? Evaluating reasoning models on rule induction tasks", "tldr": "\u63a8\u7406\u6a21\u578b\u5728\u7b49\u4ef7\u89c4\u5219\u4efb\u52a1\u4e0a\u7f3a\u4e4f\u7cfb\u7edf\u6027", "upvotes": 2, "what_it_is": "\u672c\u6587\u5c06\u8ba4\u77e5\u79d1\u5b66\u4e2d\u7684\u89c4\u5219\u5f52\u7eb3\u4efb\u52a1\u6269\u5c55\u4e3a\u4e00\u7ec4\u5177\u6709\u7ec4\u5408\u7ed3\u6784\u7684\u8bc4\u6d4b\uff0c\u7528\u91cd\u7ec4\u3001\u66ff\u6362\u7b49\u4efb\u52a1\u540c\u6784\u65b9\u6cd5\u751f\u6210\u7ed3\u6784\u7b49\u4ef7\u53d8\u4f53\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5f53\u524d\u63a8\u7406\u6a21\u578b\u5373\u4f7f\u80fd\u89e3\u51fa\u539f\u4efb\u52a1\uff0c\u4e5f\u5e38\u5728\u7b49\u4ef7\u53d8\u4f53\u4e0a\u5931\u8d25\u3002", "why_notable": "\u8be5\u7814\u7a76\u6311\u6218\u4e86\u5bf9\u5f53\u524d\u63a8\u7406\u6a21\u578b\u80fd\u529b\u7684\u5e38\u89c4\u8bc4\u4f30\u65b9\u5f0f\uff0c\u6307\u51fa\u9ad8\u5206\u8868\u73b0\u53ef\u80fd\u53ea\u5728\u7279\u5b9a\u4efb\u52a1\u5f62\u5f0f\u4e0b\u6210\u7acb\uff0c\u800c\u975e\u771f\u6b63\u638c\u63e1\u53ef\u7ec4\u5408\u3001\u53ef\u8fc1\u79fb\u7684\u89c4\u5219\u63a8\u7406\u3002"}, {"abstract": "Counterspeech (CS) - direct responses that counter online Hate Speech (HS) using reasoning and alternative viewpoints - has emerged as an alternative to content removal. Current automatic CS generation methods, however, frequently produce generic, ineffective replies that fail to target the implicit stereotypes behind HS. To bridge this gap, we propose a novel scope-conditioned generation framework that explicitly integrates structured stereotype characteristics into Large Language Models prompts. We validate our approach on a novel, human-curated dataset annotated in English, Italian, and Spanish. Extensive evaluations show that stereotype-conditioned prompting substantially outperforms generic baselines across all three languages, obtaining significant gains in factuality, specificity, cogency, and effectiveness for both explicit and implicit implied stereotypes.", "arxiv_id": "2609.16906", "arxiv_url": "https://arxiv.org/abs/2609.16906", "authors": ["Greta Damo", "Elias Urios Alacreu", "Elena Cabrio", "Paolo Rosso", "Serena Villata"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd scope-conditioned \u53cd\u8a00\u8bba\u751f\u6210\u6846\u67b6\uff0c\u5c06\u7ed3\u6784\u5316\u7684\u523b\u677f\u5370\u8c61\u7279\u5f81\u663e\u5f0f\u6ce8\u5165\u5927\u8bed\u8a00\u6a21\u578b\u63d0\u793a\u4e2d\uff0c\u4ee5\u751f\u6210\u66f4\u6709\u9488\u5bf9\u6027\u7684 counterspeech\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u82f1\u3001\u610f\u3001\u897f\u4e09\u8bed\u4eba\u5de5\u6807\u6ce8\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u9a8c\u8bc1\u5bf9\u663e\u6027\u4e0e\u9690\u6027\u523b\u677f\u5370\u8c61\u7684\u53cd\u9a73\u6548\u679c\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16906", "impact_score": 6, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9\u73b0\u6709\u81ea\u52a8 counterspeech \u5e38\u8fc7\u4e8e\u6cdb\u5316\u3001\u65e0\u6cd5\u547d\u4e2d\u4ec7\u6068\u8a00\u8bba\u80cc\u540e\u9690\u542b\u523b\u677f\u5370\u8c61\u7684\u95ee\u9898\uff0c\u5f15\u5165\u7ed3\u6784\u5316 stereotype scope \u4f5c\u4e3a\u751f\u6210\u6761\u4ef6\u3002", "\u5728\u82f1\u8bed\u3001\u610f\u5927\u5229\u8bed\u3001\u897f\u73ed\u7259\u8bed\u4e09\u79cd\u8bed\u8a00\u7684\u4eba\u7c7b\u7b56\u5212\u6570\u636e\u96c6\u4e0a\u8fdb\u884c\u8bc4\u4f30\uff0c\u8986\u76d6\u663e\u6027\u548c\u9690\u6027\u523b\u677f\u5370\u8c61\u573a\u666f\u3002", "\u76f8\u6bd4\u901a\u7528\u63d0\u793a\u57fa\u7ebf\uff0c\u523b\u677f\u5370\u8c61\u6761\u4ef6\u63d0\u793a\u5728\u4e8b\u5b9e\u6027\u3001\u5177\u4f53\u6027\u3001\u8bf4\u670d\u529b\u548c\u6574\u4f53\u6709\u6548\u6027\u4e0a\u5747\u663e\u8457\u63d0\u5347\u3002"], "keywords": ["\u81ea\u7136\u8bed\u8a00\u751f\u6210", "\u5185\u5bb9\u5b89\u5168", "\u591a\u8bed\u8a00", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16906v1", "published_at": "2026-09-15", "score": 0.387, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba"], "thumbnail": null, "title": "Deconstructing Stereotypes: Scope-Conditioned Generation for Effective Multilingual Counterspeech", "tldr": "\u7528\u523b\u677f\u5370\u8c61\u8303\u56f4\u6761\u4ef6\u63d0\u5347\u591a\u8bed\u53cd\u4ec7\u6068\u56de\u590d\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd scope-conditioned \u53cd\u8a00\u8bba\u751f\u6210\u6846\u67b6\uff0c\u5c06\u7ed3\u6784\u5316\u7684\u523b\u677f\u5370\u8c61\u7279\u5f81\u663e\u5f0f\u6ce8\u5165\u5927\u8bed\u8a00\u6a21\u578b\u63d0\u793a\u4e2d\uff0c\u4ee5\u751f\u6210\u66f4\u6709\u9488\u5bf9\u6027\u7684 counterspeech\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86\u82f1\u3001\u610f\u3001\u897f\u4e09\u8bed\u4eba\u5de5\u6807\u6ce8\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u9a8c\u8bc1\u5bf9\u663e\u6027\u4e0e\u9690\u6027\u523b\u677f\u5370\u8c61\u7684\u53cd\u9a73\u6548\u679c\u3002", "why_notable": "\u8be5\u7814\u7a76\u628a\u53cd\u4ec7\u6068\u56de\u590d\u751f\u6210\u4ece\u201c\u6cdb\u6cdb\u529d\u8bf4\u201d\u63a8\u8fdb\u5230\u201c\u9488\u5bf9\u9690\u542b\u504f\u89c1\u7cbe\u786e\u53cd\u9a73\u201d\uff0c\u5bf9\u591a\u8bed\u79cd\u5185\u5bb9\u6cbb\u7406\u3001\u5728\u7ebf\u5b89\u5168\u548c\u793e\u4f1a\u8ba1\u7b97\u4e2d\u7684 LLM \u5e94\u7528\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reliable quantum engineering is essential for turning quantum phenomena into practical technologies. As quantum platforms grow in scale and complexity, their characterization and operation require increasing human effort and coordination. Scientific artificial intelligence agents, which can plan experiments, operate instruments, and analyze observations, offer a promising route towards autonomous quantum engineering. Yet whether current agents can perform reliably in this setting has not been systematically established. To fill this gap, we developed Quantum-Harbor, a virtual laboratory that provides a controlled execution environment for agents to interact with quantum systems. This design enables direct verification of both the actions taken and the conclusions drawn. Building on this framework, we introduce QIQCBench, a benchmark of $49$ expert-authored tasks spanning multiple layers including calibration and control, error correction and compilation, sensing and networking. Across $17$ frontier agentic systems, QIQCBench reveals wide variation in verified performance. These results expose a substantial gap between demonstrating capability and achieving reliable operation, and establish Quantum-Harbor as a foundation for measuring progress towards verified autonomy in quantum engineering.", "arxiv_id": "2609.17439", "arxiv_url": "https://arxiv.org/abs/2609.17439", "authors": ["Naixu Guo", "Changhao Li", "Siyu Cheng", "Qicheng Tang", "Binzhao Luo", "Bikun Li", "Yuxuan Du", "Shihao Ru", "Jiaqi Cai"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 Quantum-Harbor \u865a\u62df\u91cf\u5b50\u5b9e\u9a8c\u5ba4\uff0c\u7528\u4e8e\u8ba9 AI \u667a\u80fd\u4f53\u5728\u53ef\u63a7\u73af\u5883\u4e2d\u64cd\u4f5c\u91cf\u5b50\u7cfb\u7edf\u5e76\u9a8c\u8bc1\u5176\u884c\u4e3a\u4e0e\u7ed3\u8bba\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa QIQCBench\uff0c\u5305\u542b 49 \u4e2a\u4e13\u5bb6\u4efb\u52a1\uff0c\u8bc4\u6d4b 17 \u4e2a\u524d\u6cbf\u667a\u80fd\u4f53\u7cfb\u7edf\u5728\u91cf\u5b50\u5de5\u7a0b\u4e2d\u7684\u53ef\u9760\u81ea\u6cbb\u80fd\u529b\u3002", "categories": ["quant-ph", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17439", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Quantum-Harbor \u63d0\u4f9b\u53d7\u63a7\u6267\u884c\u73af\u5883\uff0c\u53ef\u76f4\u63a5\u9a8c\u8bc1\u667a\u80fd\u4f53\u7684\u5b9e\u9a8c\u64cd\u4f5c\u548c\u63a8\u7406\u7ed3\u8bba", "QIQCBench \u8986\u76d6\u6821\u51c6\u4e0e\u63a7\u5236\u3001\u7ea0\u9519\u4e0e\u7f16\u8bd1\u3001\u4f20\u611f\u4e0e\u7f51\u7edc\u7b49\u591a\u4e2a\u91cf\u5b50\u5de5\u7a0b\u5c42\u7ea7", "\u5bf9 17 \u4e2a\u524d\u6cbf agentic \u7cfb\u7edf\u7684\u8bc4\u6d4b\u663e\u793a\u80fd\u529b\u5dee\u5f02\u663e\u8457\uff0c\u53ef\u9760\u8fd0\u884c\u4e0e\u80fd\u529b\u5c55\u793a\u4e4b\u95f4\u4ecd\u6709\u660e\u663e\u5dee\u8ddd"], "keywords": ["\u667a\u80fd\u4f53", "\u91cf\u5b50\u8ba1\u7b97", "\u79d1\u5b66\u667a\u80fd", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17439v1", "published_at": "2026-09-15", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Evaluating Verified Autonomy in Quantum Engineering", "tldr": "\u63d0\u51fa\u91cf\u5b50\u5de5\u7a0b\u81ea\u6cbb\u667a\u80fd\u4f53\u9a8c\u8bc1\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 Quantum-Harbor \u865a\u62df\u91cf\u5b50\u5b9e\u9a8c\u5ba4\uff0c\u7528\u4e8e\u8ba9 AI \u667a\u80fd\u4f53\u5728\u53ef\u63a7\u73af\u5883\u4e2d\u64cd\u4f5c\u91cf\u5b50\u7cfb\u7edf\u5e76\u9a8c\u8bc1\u5176\u884c\u4e3a\u4e0e\u7ed3\u8bba\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa QIQCBench\uff0c\u5305\u542b 49 \u4e2a\u4e13\u5bb6\u4efb\u52a1\uff0c\u8bc4\u6d4b 17 \u4e2a\u524d\u6cbf\u667a\u80fd\u4f53\u7cfb\u7edf\u5728\u91cf\u5b50\u5de5\u7a0b\u4e2d\u7684\u53ef\u9760\u81ea\u6cbb\u80fd\u529b\u3002", "why_notable": "\u8fd9\u662f\u9762\u5411\u91cf\u5b50\u5de5\u7a0b\u81ea\u6cbb\u667a\u80fd\u4f53\u7684\u7cfb\u7edf\u5316\u9a8c\u8bc1\u6846\u67b6\u548c\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u8861\u91cf\u79d1\u5b66 AI \u667a\u80fd\u4f53\u4ece\u201c\u4f1a\u505a\u4efb\u52a1\u201d\u8d70\u5411\u201c\u53ef\u4fe1\u6267\u884c\u5b9e\u9a8c\u201d\u7684\u771f\u5b9e\u8fdb\u5c55\u3002"}, {"abstract": "Model serving is one of the largest cost drivers in production recommender systems. Maximizing its throughput requires navigating a deeply layered hierarchy: GPU kernels, the ML framework computation graph, the model server, and on-demand feature processing -- each demanding specialized domain expertise. Such cross-layer expertise is inherently difficult to acquire, and does not scale with a workload that continuously grows and evolves, leaving significant cost efficiency gains unrealized. While recent AI agents have demonstrated human expert level efficiency in standalone GPU kernel optimization, automated tuning and optimization for the rest of the serving stack remain largely unexplored. We present FlashVector, an agentic system that optimizes performance across all layers of the model serving stack. The key contribution is an extensible framework to generalize the single kernel optimization agent paradigm to heterogeneous technical stacks, and to deliver performance improvements holistically. After deployment in Unity\u0027s Vector advertising platform, FlashVector achieved up to 2x throughput increase and up to 1.98x latency speedup on model server, and up to 1.6x throughput increase on feature store. These optimizations were discovered not only at the GPU kernel and computation graph levels, but also across the other components of the model serving stack, such as the model server (NVIDIA Triton\u0027s C++ codebase) and the on-demand feature transformation service (Python codebase), demonstrating the extensibility of the framework to more complex system architectures.", "arxiv_id": "2609.17391", "arxiv_url": "https://arxiv.org/abs/2609.17391", "authors": ["Qi Wu", "Lohan Lemire", "Kai Meng", "Zhongmou Cai", "Raphael Bargues", "Petr Zhitnikov", "Zeyuan Cao", "Yao Wang", "Shujun Bian", "Wei Chen", "Sean Sheng"], "brief": "FlashVector \u662f\u4e00\u4e2a\u9762\u5411\u751f\u4ea7\u63a8\u8350\u7cfb\u7edf\u6a21\u578b\u670d\u52a1\u6808\u7684\u667a\u80fd\u4f53\u4f18\u5316\u6846\u67b6\uff0c\u53ef\u8de8 GPU kernel\u3001\u8ba1\u7b97\u56fe\u3001\u6a21\u578b\u670d\u52a1\u5668\u548c\u7279\u5f81\u5904\u7406\u670d\u52a1\u81ea\u52a8\u53d1\u73b0\u6027\u80fd\u4f18\u5316\u3002\u8bba\u6587\u5c55\u793a\u5176\u5728 Unity Vector \u5e7f\u544a\u5e73\u53f0\u843d\u5730\uff0c\u5e76\u53d6\u5f97\u663e\u8457\u541e\u5410\u548c\u5ef6\u8fdf\u63d0\u5347\u3002", "categories": ["cs.AI", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17391", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u5355\u4e00 GPU kernel \u4f18\u5316\u667a\u80fd\u4f53\u8303\u5f0f\u6269\u5c55\u5230\u5f02\u6784\u3001\u5206\u5c42\u7684\u6a21\u578b\u670d\u52a1\u6280\u672f\u6808", "\u8986\u76d6 NVIDIA Triton C++ \u6a21\u578b\u670d\u52a1\u5668\u3001Python \u7279\u5f81\u8f6c\u6362\u670d\u52a1\u3001ML \u6846\u67b6\u8ba1\u7b97\u56fe\u7b49\u591a\u5c42\u7ec4\u4ef6", "\u751f\u4ea7\u90e8\u7f72\u4e2d\u6a21\u578b\u670d\u52a1\u5668\u541e\u5410\u6700\u9ad8\u63d0\u5347 2x\u3001\u5ef6\u8fdf\u6700\u9ad8\u52a0\u901f 1.98x\uff0c\u7279\u5f81\u5b58\u50a8\u541e\u5410\u6700\u9ad8\u63d0\u5347 1.6x"], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u670d\u52a1", "\u7cfb\u7edf\u4f18\u5316", "\u63a8\u8350\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17391v1", "published_at": "2026-09-15", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "FlashVector: Agent for Hierarchical Model Serving Stack Optimization", "tldr": "\u8de8\u5c42\u667a\u80fd\u4f53\u4f18\u5316\u6a21\u578b\u670d\u52a1\u541e\u5410\u4e0e\u5ef6\u8fdf", "upvotes": 0, "what_it_is": "FlashVector \u662f\u4e00\u4e2a\u9762\u5411\u751f\u4ea7\u63a8\u8350\u7cfb\u7edf\u6a21\u578b\u670d\u52a1\u6808\u7684\u667a\u80fd\u4f53\u4f18\u5316\u6846\u67b6\uff0c\u53ef\u8de8 GPU kernel\u3001\u8ba1\u7b97\u56fe\u3001\u6a21\u578b\u670d\u52a1\u5668\u548c\u7279\u5f81\u5904\u7406\u670d\u52a1\u81ea\u52a8\u53d1\u73b0\u6027\u80fd\u4f18\u5316\u3002\u8bba\u6587\u5c55\u793a\u5176\u5728 Unity Vector \u5e7f\u544a\u5e73\u53f0\u843d\u5730\uff0c\u5e76\u53d6\u5f97\u663e\u8457\u541e\u5410\u548c\u5ef6\u8fdf\u63d0\u5347\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a AI agent \u4ece\u5b64\u7acb kernel \u8c03\u4f18\u63a8\u8fdb\u5230\u771f\u5b9e\u751f\u4ea7\u670d\u52a1\u6808\u7684\u7aef\u5230\u7aef\u6027\u80fd\u4f18\u5316\uff0c\u5177\u5907\u76f4\u63a5\u964d\u4f4e\u5927\u89c4\u6a21\u63a8\u8350\u7cfb\u7edf\u63a8\u7406\u6210\u672c\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Computer-use agents increasingly operate browsers, software, and desktop applications via CLI or API portals, but graphical user interface (GUI) still plays an important role in common industrial production scenarios. GUI agents commonly employ fresh observe-plan-ground-act loops, which is inefficient for enterprise tasks that repeatedly update records, process forms, configure tools, and export reports. We introduce EchoPath, a model-agnostic harness that converts artifact-validated GUI trajectories into standardized, parameter-controlled callable memories, analogous to Model Context Protocol (MCP)-style tool calls rather than unstructured experience records. Each memory stores task-intent keys, application and state preconditions, flexible input parameters, GUI evidence, validation provenance, and lifecycle state, so the host agent invokes a targeted procedure only when it can be deterministically replayed in the current runtime. The core mechanism enabling replay is an image-based target-reaiming algorithm that treats stored coordinates as visual evidence, matches the remembered GUI target against the current screen, and emits corrected operation coordinates before execution. During replay, EchoPath rebinds only declared modifiable inputs and rejects ambiguous or incompatible steps to bounded grounding repair or fresh planning. In experiments with real computer-use tasks, EchoPath reduced median token cost by more than 90% and median execution time by about 60%. These results support a bounded form of enterprise GUI memory: validated execution experience can become a controllable callable asset for recurrent work rather than only context for another reasoning pass.", "arxiv_id": "2609.16635", "arxiv_url": "https://arxiv.org/abs/2609.16635", "authors": ["Yao Zhao", "Aditya Shanmugham", "Swastik Roy", "Yanxun Xu"], "brief": "EchoPath \u662f\u4e00\u4e2a\u6a21\u578b\u65e0\u5173\u7684 GUI \u667a\u80fd\u4f53\u8bb0\u5fc6\u6846\u67b6\uff0c\u53ef\u628a\u7ecf\u8fc7\u4ea7\u7269\u9a8c\u8bc1\u7684 GUI \u6267\u884c\u8f68\u8ff9\u8f6c\u6362\u4e3a\u6807\u51c6\u5316\u3001\u5e26\u53c2\u6570\u63a7\u5236\u7684\u53ef\u8c03\u7528\u8bb0\u5fc6\u3002\u5b83\u8ba9\u667a\u80fd\u4f53\u5728\u91cd\u590d\u6027\u4f01\u4e1a\u4efb\u52a1\u4e2d\u50cf\u8c03\u7528\u5de5\u5177\u4e00\u6837\u590d\u7528\u53ef\u9760\u6d41\u7a0b\uff0c\u800c\u4e0d\u662f\u6bcf\u6b21\u91cd\u65b0\u89c2\u5bdf\u3001\u89c4\u5212\u548c\u6267\u884c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16635", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u6761\u8bb0\u5fc6\u5305\u542b\u4efb\u52a1\u610f\u56fe\u3001\u5e94\u7528\u4e0e\u72b6\u6001\u524d\u7f6e\u6761\u4ef6\u3001\u53ef\u53d8\u8f93\u5165\u53c2\u6570\u3001GUI \u8bc1\u636e\u3001\u9a8c\u8bc1\u6765\u6e90\u548c\u751f\u547d\u5468\u671f\u72b6\u6001", "\u63d0\u51fa\u57fa\u4e8e\u56fe\u50cf\u7684\u76ee\u6807\u91cd\u7784\u7b97\u6cd5\uff0c\u5c06\u5386\u53f2\u5750\u6807\u4f5c\u4e3a\u89c6\u89c9\u8bc1\u636e\uff0c\u5728\u5f53\u524d\u5c4f\u5e55\u4e2d\u91cd\u65b0\u5339\u914d\u76ee\u6807\u5e76\u4fee\u6b63\u64cd\u4f5c\u5750\u6807", "\u56de\u653e\u65f6\u53ea\u91cd\u65b0\u7ed1\u5b9a\u58f0\u660e\u53ef\u4fee\u6539\u7684\u8f93\u5165\uff0c\u9047\u5230\u6b67\u4e49\u6216\u4e0d\u517c\u5bb9\u6b65\u9aa4\u5219\u62d2\u7edd\u6267\u884c\u5e76\u8f6c\u5165\u6709\u9650\u4fee\u590d\u6216\u91cd\u65b0\u89c4\u5212"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u81ea\u52a8\u5316", "\u8bb0\u5fc6\u673a\u5236", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16635v1", "published_at": "2026-09-15", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "EchoPath: Execution-Level Replayable Memory for GUI Agents", "tldr": "\u5c06\u53ef\u9a8c\u8bc1GUI\u8f68\u8ff9\u8f6c\u4e3a\u53ef\u91cd\u653e\u5de5\u5177\u8bb0\u5fc6", "upvotes": 0, "what_it_is": "EchoPath \u662f\u4e00\u4e2a\u6a21\u578b\u65e0\u5173\u7684 GUI \u667a\u80fd\u4f53\u8bb0\u5fc6\u6846\u67b6\uff0c\u53ef\u628a\u7ecf\u8fc7\u4ea7\u7269\u9a8c\u8bc1\u7684 GUI \u6267\u884c\u8f68\u8ff9\u8f6c\u6362\u4e3a\u6807\u51c6\u5316\u3001\u5e26\u53c2\u6570\u63a7\u5236\u7684\u53ef\u8c03\u7528\u8bb0\u5fc6\u3002\u5b83\u8ba9\u667a\u80fd\u4f53\u5728\u91cd\u590d\u6027\u4f01\u4e1a\u4efb\u52a1\u4e2d\u50cf\u8c03\u7528\u5de5\u5177\u4e00\u6837\u590d\u7528\u53ef\u9760\u6d41\u7a0b\uff0c\u800c\u4e0d\u662f\u6bcf\u6b21\u91cd\u65b0\u89c2\u5bdf\u3001\u89c4\u5212\u548c\u6267\u884c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a GUI \u667a\u80fd\u4f53\u7684\u5386\u53f2\u7ecf\u9a8c\u4ece\u975e\u7ed3\u6784\u5316\u4e0a\u4e0b\u6587\u63d0\u5347\u4e3a\u53ef\u63a7\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u8c03\u7528\u7684\u6267\u884c\u8d44\u4ea7\uff0c\u663e\u8457\u964d\u4f4e\u91cd\u590d\u4efb\u52a1\u4e2d\u7684\u63a8\u7406\u6210\u672c\u4e0e\u6267\u884c\u65f6\u95f4\uff1b\u5b9e\u9a8c\u663e\u793a token \u6210\u672c\u4e2d\u4f4d\u6570\u964d\u4f4e\u8d85\u8fc7 90%\uff0c\u6267\u884c\u65f6\u95f4\u4e2d\u4f4d\u6570\u964d\u4f4e\u7ea6 60%\uff0c\u5bf9\u4f01\u4e1a\u7ea7\u81ea\u52a8\u5316\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "How and why does a recommender system fail the users it serves? Oftentimes, practitioners are left to improve their algorithms based on a combination of feedback from stakeholder teams, domain expertise, and insights from data analyses. Yet the nuances of how and where recommendations perform well or poorly for end users are difficult to discern from aggregate quantitative metrics. Whereas these metrics provide a high-level and incomplete picture, further granularity into the quality of recommendations and their patterns requires reasoning with domain understanding and objectivity, at scale. We contemplate this complex conundrum and describe a method and implementation that uses the latest AI agentic advances to provide actionable diagnoses and improvements for production recommender systems. We present AURA (Agentic Understanding and Refinement of recommender Algorithms), an end-to-end agentic system that performs qualitative evaluation at scale and can then generate improvements to our algorithms at the code level. Specialized agents read production engagement logs, from thousands of sessions to millions, and surface patterns and examples of how the recommender fails real users. The next step uses those diagnoses and context about the recommender\u0027s own code, data, and training pipeline to propose and implement refinements grounded in that codebase. We report the system design, initial tests on production data from two large consumer platforms at a major media-streaming company, safeguards, operational learnings, and early results toward a self-improving recommender system. Finally, the diagnostic gap AURA closes is not specific to streaming. The architecture is built to transfer: every domain-specific element enters through the configuration layer that already ported it between our two platforms. We map it concretely to e-commerce and online-retail recommendation.", "arxiv_id": "2609.16625", "arxiv_url": "https://arxiv.org/abs/2609.16625", "authors": ["SungGeun Kim", "Abhinav Narain", "Daniel Nemirovsky"], "brief": "\u8bba\u6587\u63d0\u51fa AURA\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u751f\u4ea7\u63a8\u8350\u7cfb\u7edf\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u80fd\u4ece\u771f\u5b9e\u7528\u6237\u4f1a\u8bdd\u548c engagement logs \u4e2d\u53d1\u73b0\u63a8\u8350\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u7ed3\u5408\u4ee3\u7801\u3001\u6570\u636e\u4e0e\u8bad\u7ec3\u6d41\u6c34\u7ebf\u63d0\u51fa\u751a\u81f3\u5b9e\u73b0\u7b97\u6cd5\u7ea7\u6539\u8fdb\u3002", "categories": ["cs.IR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16625", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e13\u95e8\u5316\u667a\u80fd\u4f53\u53ef\u8bfb\u53d6\u4ece\u6570\u5343\u5230\u6570\u767e\u4e07\u7ea7\u4f1a\u8bdd\u7684\u751f\u4ea7\u65e5\u5fd7\uff0c\u8fdb\u884c\u53ef\u6269\u5c55\u7684\u5b9a\u6027\u8bc4\u4f30\u4e0e\u5931\u8d25\u6848\u4f8b\u5f52\u56e0", "\u7cfb\u7edf\u5c06\u8bca\u65ad\u7ed3\u679c\u4e0e\u63a8\u8350\u7cfb\u7edf\u4ee3\u7801\u5e93\u3001\u6570\u636e\u548c\u8bad\u7ec3\u6d41\u7a0b\u4e0a\u4e0b\u6587\u7ed3\u5408\uff0c\u751f\u6210\u4ee3\u7801\u7ea7 refinement \u5efa\u8bae\u4e0e\u5b9e\u73b0", "\u5728\u4e00\u5bb6\u5927\u578b\u6d41\u5a92\u4f53\u516c\u53f8\u7684\u4e24\u4e2a\u6d88\u8d39\u8005\u5e73\u53f0\u751f\u4ea7\u6570\u636e\u4e0a\u8fdb\u884c\u521d\u6b65\u6d4b\u8bd5\uff0c\u5e76\u603b\u7ed3\u4e86\u5b89\u5168\u62a4\u680f\u3001\u8fd0\u7ef4\u7ecf\u9a8c\u548c\u8fc1\u79fb\u5230\u7535\u5546\u63a8\u8350\u7684\u53ef\u884c\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u8350\u7cfb\u7edf", "\u751f\u4ea7\u7cfb\u7edf", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16625v1", "published_at": "2026-09-15", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AURA: Agentic Diagnosis and Refinement for Production Recommender Systems at Scale", "tldr": "\u7528\u667a\u80fd\u4f53\u8bca\u65ad\u5e76\u6539\u8fdb\u751f\u4ea7\u63a8\u8350\u7cfb\u7edf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AURA\uff0c\u4e00\u4e2a\u9762\u5411\u5927\u89c4\u6a21\u751f\u4ea7\u63a8\u8350\u7cfb\u7edf\u7684\u7aef\u5230\u7aef\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u80fd\u4ece\u771f\u5b9e\u7528\u6237\u4f1a\u8bdd\u548c engagement logs \u4e2d\u53d1\u73b0\u63a8\u8350\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u7ed3\u5408\u4ee3\u7801\u3001\u6570\u636e\u4e0e\u8bad\u7ec3\u6d41\u6c34\u7ebf\u63d0\u51fa\u751a\u81f3\u5b9e\u73b0\u7b97\u6cd5\u7ea7\u6539\u8fdb\u3002", "why_notable": "\u5b83\u628a LLM \u667a\u80fd\u4f53\u4ece\u79bb\u7ebf\u5206\u6790\u63a8\u8fdb\u5230\u751f\u4ea7\u63a8\u8350\u7cfb\u7edf\u7684\u8bca\u65ad\u4e0e\u4ee3\u7801\u7ea7\u81ea\u6539\u8fdb\u95ed\u73af\uff0c\u8865\u8db3\u4e86\u4f20\u7edf\u805a\u5408\u6307\u6807\u96be\u4ee5\u89e3\u91ca\u7528\u6237\u4f53\u9a8c\u5931\u8d25\u7684\u7a7a\u767d\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u4e1a\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Autoresearch agents are reshaping the research ecosystem, but they can also let flawed claims enter the literature at scale. Human advisors catch such issues in drafts through careful, traceable feedback, yet advisor-style assessment requires extensive manual effort and does not scale. To shift automated paper assessment from a judge to a diagnostician, we introduce PaperDoctor, an agent framework for pre-submission feedback with three key innovations. First, a holistic hierarchical framework evaluates writing, layout, references, code, theory, prior work, and experiments through three layers: L1 surface screening, L2 typed verifiers that route each claim to the appropriate evidence, and L3 reproducers that rerun experiments by priority. Second, each finding contains an observation, a pointer to specific evidence such as a sentence, equation, or code line, and a revision suggestion, making critiques auditable and actionable. Third, PaperDoctor selectively rebuilds and reruns experiments based on claim importance and compute budget, surfacing reproducibility gaps and quantitative limitations that are invisible from the manuscript alone. We evaluate PaperDoctor on 30 in-progress papers, yielding 70.6% agreement and all positive holistic scores, and on 40 manuscripts across machine learning, natural science, and social science, covering human- and AI-authored papers with code. Overall, PaperDoctor produces more auditable feedback than human and other agentic reviewers, pairs critiques with concrete suggestions by design, and complements dimensions often overlooked by human reviewers. We also develop an interactive interface that lets authors browse findings grounded in their paper. PaperDoctor reframes automated paper assessment as diagnosis rather than verdict, taking a concrete step toward AI advisors for more rigorous AI-assisted scientific discovery.", "arxiv_id": "2609.16995", "arxiv_url": "https://arxiv.org/abs/2609.16995", "authors": ["Kevin Qinghong Lin", "Siyuan Hu", "Pan Lu", "Yu Chen", "Yanzhe Chen", "Owen Queen", "Yupeng Chen", "Jialin Yu", "Junchi Yu", "Zifeng Ding", "Yuanfeng Ji", "Sheng Liu", "Jindong Gu", "Linjie Li", "Mike Zheng Shou", "Philip Torr", "James Zou"], "brief": "PaperDoctor \u662f\u4e00\u4e2a\u7528\u4e8e\u5728\u6295\u7a3f\u524d\u5ba1\u67e5\u5728\u5199\u8bba\u6587\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u81ea\u52a8\u8bba\u6587\u8bc4\u4f30\u4ece\u201c\u6253\u5206\u88c1\u5224\u201d\u8f6c\u5411\u201c\u8bca\u65ad\u987e\u95ee\u201d\u3002\u5b83\u80fd\u68c0\u67e5\u5199\u4f5c\u3001\u5f15\u7528\u3001\u4ee3\u7801\u3001\u7406\u8bba\u3001\u76f8\u5173\u5de5\u4f5c\u548c\u5b9e\u9a8c\uff0c\u5e76\u7ed9\u51fa\u57fa\u4e8e\u8bc1\u636e\u5b9a\u4f4d\u7684\u4fee\u6539\u5efa\u8bae\u3002", "categories": ["cs.CL", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16995", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u4e09\u5c42\u5c42\u7ea7\u8bc4\u4f30\uff1aL1 \u8868\u9762\u7b5b\u67e5\u3001L2 \u6309\u58f0\u660e\u7c7b\u578b\u8def\u7531\u5230\u8bc1\u636e\u7684\u9a8c\u8bc1\u5668\u3001L3 \u6309\u4f18\u5148\u7ea7\u91cd\u8dd1\u5b9e\u9a8c\u7684\u590d\u73b0\u5b9e\u9a8c\u6a21\u5757\u3002", "\u6bcf\u6761\u53cd\u9988\u90fd\u5305\u542b\u89c2\u5bdf\u3001\u5177\u4f53\u8bc1\u636e\u6307\u9488\uff08\u53e5\u5b50\u3001\u516c\u5f0f\u6216\u4ee3\u7801\u884c\uff09\u548c\u53ef\u6267\u884c\u4fee\u6539\u5efa\u8bae\uff0c\u63d0\u5347\u53ef\u5ba1\u8ba1\u6027\u3002", "\u53ef\u6839\u636e\u58f0\u660e\u91cd\u8981\u6027\u548c\u8ba1\u7b97\u9884\u7b97\u9009\u62e9\u6027\u91cd\u5efa\u5e76\u91cd\u8dd1\u5b9e\u9a8c\uff0c\u53d1\u73b0\u4ec5\u770b\u8bba\u6587\u96be\u4ee5\u66b4\u9732\u7684\u53ef\u590d\u73b0\u6027\u7f3a\u53e3\u548c\u5b9a\u91cf\u9650\u5236\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u53d1\u73b0", "\u8bba\u6587\u8bc4\u5ba1", "\u53ef\u590d\u73b0\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16995v1", "published_at": "2026-09-15", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PaperDoctor: Evidence-Grounded and Actionable Feedback for Scientific Papers in Progress", "tldr": "\u9762\u5411\u6295\u7a3f\u524d\u8bba\u6587\u7684\u53ef\u8ffd\u6eaf\u8bca\u65ad\u53cd\u9988\u667a\u80fd\u4f53", "upvotes": 0, "what_it_is": "PaperDoctor \u662f\u4e00\u4e2a\u7528\u4e8e\u5728\u6295\u7a3f\u524d\u5ba1\u67e5\u5728\u5199\u8bba\u6587\u7684\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u81ea\u52a8\u8bba\u6587\u8bc4\u4f30\u4ece\u201c\u6253\u5206\u88c1\u5224\u201d\u8f6c\u5411\u201c\u8bca\u65ad\u987e\u95ee\u201d\u3002\u5b83\u80fd\u68c0\u67e5\u5199\u4f5c\u3001\u5f15\u7528\u3001\u4ee3\u7801\u3001\u7406\u8bba\u3001\u76f8\u5173\u5de5\u4f5c\u548c\u5b9e\u9a8c\uff0c\u5e76\u7ed9\u51fa\u57fa\u4e8e\u8bc1\u636e\u5b9a\u4f4d\u7684\u4fee\u6539\u5efa\u8bae\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u8bba\u6587\u81ea\u52a8\u8bc4\u5ba1\u4ece\u7b3c\u7edf\u8bc4\u4ef7\u63a8\u8fdb\u5230\u8bc1\u636e\u624e\u6839\u3001\u53ef\u6267\u884c\u3001\u53ef\u590d\u73b0\u68c0\u67e5\u7684\u8bca\u65ad\u5f0f\u6d41\u7a0b\uff0c\u6709\u671b\u4f5c\u4e3a AI \u79d1\u7814\u52a9\u624b\u5e2e\u52a9\u4f5c\u8005\u5728\u6295\u7a3f\u524d\u53d1\u73b0\u95ee\u9898\uff0c\u964d\u4f4e AI \u751f\u6210\u6216\u8f85\u52a9\u7814\u7a76\u4e2d\u9519\u8bef\u7ed3\u8bba\u89c4\u6a21\u5316\u8fdb\u5165\u6587\u732e\u7684\u98ce\u9669\u3002"}, {"abstract": "Platform abuse campaigns conceal redirection instructions with emojis, homophones, character decomposition, and redundant symbols, then route users through disguised links to services associated with pornography, fraud, gambling, or illicit transactions. Existing benchmarks evaluate obfuscated text and risky webpages separately, obscuring how target recovery affects downstream evidence acquisition. We introduce RiskChainBench, pairing 3,600 synthetic token-text restoration inputs from 600 source sessions with 600 corresponding human-labeled local web environments. A model first restores the message, operational intent, and destination; the same underlying model then acts as a VLM-driven web agent that investigates the correctly associated website and produces a frozen, evidence-cited risk report without message-side semantics or domain-reputation cues. We score restoration and correct-routing web investigation separately and compose them offline by applying the frozen primary-entry prediction as a gate to the same Task 2 result. Human labels determine task correctness, while a fixed multimodal evidence judge assesses faithfulness, sufficiency, completeness, and consistency. Across ten models, Entry Top-1 ranges from 35.2% to 95.2% and web decision accuracy from 26.3% to 62.8%; the leading systems differ across entry recovery, full reconstruction, website decisions, and fine-grained typing. Execution failures account for 31.9% of web runs, whereas post-decision type errors account for only 0.9%, identifying stable exploration and risk judgment as the principal bottlenecks. We release the benchmark, protocol, and resettable local sandbox.", "arxiv_id": "2609.16900", "arxiv_url": "https://arxiv.org/abs/2609.16900", "authors": ["ZhuoXin Liu", "Zhiming Ma", "Ying Zhang", "Mengzheng Yang", "Yifan Wang", "Zhengqi Huang", "Yanhan Zhou", "Zekun Lin", "Jun Zhang", "Shun Zhang", "Yue Chen", "Qiao Zhao", "Peng Chen"], "brief": "\u8bba\u6587\u63d0\u51fa RiskChainBench\uff0c\u4e00\u4e2a\u5c06\u5e73\u53f0\u6ee5\u7528\u4e2d\u7684\u6df7\u6dc6\u6587\u672c\u8fd8\u539f\u4e0e\u8bc1\u636e\u652f\u6491\u7684\u7f51\u9875\u98ce\u9669\u8c03\u67e5\u4e32\u8054\u8bc4\u6d4b\u7684\u57fa\u51c6\u3002\u5b83\u5305\u542b 3600 \u6761\u5408\u6210\u8fd8\u539f\u8f93\u5165\u3001600 \u4e2a\u6e90\u4f1a\u8bdd\u53ca\u5bf9\u5e94\u4eba\u5de5\u6807\u6ce8\u7684\u672c\u5730\u7f51\u9875\u73af\u5883\uff0c\u8981\u6c42\u6a21\u578b\u5148\u6062\u590d\u76ee\u6807\u5165\u53e3\uff0c\u518d\u4f5c\u4e3a VLM \u7f51\u9875\u667a\u80fd\u4f53\u5b8c\u6210\u98ce\u9669\u62a5\u544a\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16900", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u5c06\u201c\u6df7\u6dc6\u6d88\u606f\u6062\u590d\u201d\u548c\u201c\u6b63\u786e\u8def\u7531\u540e\u7684\u7f51\u9875\u8c03\u67e5\u201d\u5206\u5f00\u8bc4\u5206\uff0c\u5e76\u7528\u5165\u53e3\u9884\u6d4b\u4f5c\u4e3a\u95e8\u63a7\u7ec4\u5408\u6210\u7aef\u5230\u7aef\u7ed3\u679c\u3002", "\u7f51\u9875\u8c03\u67e5\u9636\u6bb5\u7981\u6b62\u4f7f\u7528\u6d88\u606f\u8bed\u4e49\u548c\u57df\u540d\u4fe1\u8a89\u7ebf\u7d22\uff0c\u8981\u6c42\u57fa\u4e8e\u51bb\u7ed3\u7f51\u9875\u8bc1\u636e\u751f\u6210\u98ce\u9669\u62a5\u544a\u3002", "\u5341\u4e2a\u6a21\u578b\u6d4b\u8bd5\u4e2d\uff0c\u5165\u53e3 Top-1 \u4e3a 35.2%\u201395.2%\uff0c\u7f51\u9875\u51b3\u7b56\u51c6\u786e\u7387\u4ec5 26.3%\u201362.8%\uff0c31.9% \u7684\u7f51\u9875\u8fd0\u884c\u51fa\u73b0\u6267\u884c\u5931\u8d25\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u7f51\u9875\u8bc4\u6d4b", "\u5b89\u5168\u98ce\u63a7", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16900v1", "published_at": "2026-09-15", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RiskChainBench: A Benchmark for Obfuscated Platform Message Restoration and Evidence-Grounded Web Investigation", "tldr": "\u8bc4\u6d4b\u6df7\u6dc6\u6d88\u606f\u8fd8\u539f\u5230\u7f51\u9875\u98ce\u9669\u8c03\u67e5\u5168\u94fe\u8def", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RiskChainBench\uff0c\u4e00\u4e2a\u5c06\u5e73\u53f0\u6ee5\u7528\u4e2d\u7684\u6df7\u6dc6\u6587\u672c\u8fd8\u539f\u4e0e\u8bc1\u636e\u652f\u6491\u7684\u7f51\u9875\u98ce\u9669\u8c03\u67e5\u4e32\u8054\u8bc4\u6d4b\u7684\u57fa\u51c6\u3002\u5b83\u5305\u542b 3600 \u6761\u5408\u6210\u8fd8\u539f\u8f93\u5165\u3001600 \u4e2a\u6e90\u4f1a\u8bdd\u53ca\u5bf9\u5e94\u4eba\u5de5\u6807\u6ce8\u7684\u672c\u5730\u7f51\u9875\u73af\u5883\uff0c\u8981\u6c42\u6a21\u578b\u5148\u6062\u590d\u76ee\u6807\u5165\u53e3\uff0c\u518d\u4f5c\u4e3a VLM \u7f51\u9875\u667a\u80fd\u4f53\u5b8c\u6210\u98ce\u9669\u62a5\u544a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u793e\u4ea4\u5e73\u53f0\u6ee5\u7528\u6cbb\u7406\u4e2d\u7684\u5173\u952e\u94fe\u8def\u5b8c\u6574\u5efa\u6a21\uff1a\u4ece\u89c4\u907f\u5ba1\u67e5\u7684\u6df7\u6dc6\u6307\u4ee4\u6062\u590d\uff0c\u5230\u5b9e\u9645\u7f51\u9875\u8bc1\u636e\u6536\u96c6\u4e0e\u98ce\u9669\u5224\u65ad\uff0c\u63ed\u793a\u5f53\u524d\u6a21\u578b\u7684\u4e3b\u8981\u74f6\u9888\u5728\u7a33\u5b9a\u7f51\u9875\u63a2\u7d22\u548c\u98ce\u9669\u5224\u5b9a\uff0c\u800c\u4e0d\u53ea\u662f\u6587\u672c\u7406\u89e3\u3002"}, {"abstract": "Language models may need to internalize information that arrives over time and retain it through many subsequent updates. To study this challenge, we introduce long-horizon memorization, a setting in which a model learns 100 query-answer tasks through continual supervised fine-tuning without retaining earlier training examples or receiving task identifiers at inference. Sequential updates cause catastrophic forgetting, and no single continual learning mechanism we evaluate maintains strong retention at this horizon. We hypothesize that mechanisms addressing complementary sources of forgetting will be more effective when composed. We organize these compositions along two design dimensions. Data, function, and weight anchors specify what prior information each update should preserve, while low-rank allocation rules determine where successive updates are retained. To test this hypothesis systematically, we construct three distinct 100-task memorization datasets. We introduce task-level successive halving to search the combinatorial design space and use a factorial experiment to measure individual and interaction effects. Our best method combines all three anchors with merged LoRA, ranks among the top 3 methods in all datasets, and raises average final retention from 1.2% under naive sequential fine-tuning to 34.9%, a 28-fold improvement. The data anchor and merged LoRA provide the largest average gains and interact super-additively on all three datasets. Together, these results show that composing complementary mechanisms substantially improves long-horizon memorization beyond what any individual mechanism achieves.", "arxiv_id": "2609.06986", "arxiv_url": "https://arxiv.org/abs/2609.06986", "authors": ["Zheyuan Zhang", "Alvin Zhang", "Daniel Khashabi", "Tianmin Shu"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u957f\u7a0b\u8bb0\u5fc6\u201d\u8bc4\u6d4b\u8bbe\u5b9a\uff1a\u6a21\u578b\u8fde\u7eed\u76d1\u7763\u5fae\u8c03\u5b66\u4e60100\u4e2a\u95ee\u7b54\u4efb\u52a1\uff0c\u4e0d\u80fd\u4fdd\u7559\u65e7\u6837\u672c\u4e14\u63a8\u7406\u65f6\u65e0\u4efb\u52a1\u6807\u8bc6\u3002\u4f5c\u8005\u7cfb\u7edf\u6bd4\u8f83\u5e76\u7ec4\u5408\u6570\u636e\u3001\u51fd\u6570\u3001\u6743\u91cd\u951a\u5b9a\u4e0eLoRA\u5206\u914d\u7b56\u7565\uff0c\u53d1\u73b0\u7ec4\u5408\u673a\u5236\u80fd\u663e\u8457\u7f13\u89e3\u707e\u96be\u6027\u9057\u5fd8\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/cozheyuanzhangde/compose-cl", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2609.06986", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa3\u4e2a\u4e0d\u540c\u7684100\u4efb\u52a1\u8bb0\u5fc6\u6570\u636e\u96c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u671f\u8fde\u7eed\u5fae\u8c03\u540e\u7684\u6700\u7ec8\u4fdd\u6301\u7387\u3002", "\u6700\u4f73\u65b9\u6cd5\u7ed3\u5408\u6570\u636e\u951a\u3001\u51fd\u6570\u951a\u3001\u6743\u91cd\u951a\u4e0emerged LoRA\uff0c\u5c06\u5e73\u5747\u6700\u7ec8\u4fdd\u6301\u7387\u4ece\u6734\u7d20\u987a\u5e8f\u5fae\u8c03\u76841.2%\u63d0\u5347\u523034.9%\u3002", "\u901a\u8fc7\u4efb\u52a1\u7ea7successive halving\u641c\u7d22\u7ec4\u5408\u7a7a\u95f4\uff0c\u5e76\u7528\u56e0\u5b50\u5b9e\u9a8c\u5206\u6790\u5355\u72ec\u6548\u5e94\u4e0e\u4ea4\u4e92\u6548\u5e94\uff1b\u6570\u636e\u951a\u548cmerged LoRA\u8d21\u732e\u6700\u5927\u4e14\u5448\u8d85\u52a0\u6027\u4e92\u52a8\u3002"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u707e\u96be\u6027\u9057\u5fd8", "\u6a21\u578b\u5fae\u8c03", "LoRA"], "num_comments": 1, "on_hf": true, "organization": "Johns Hopkins University", "pdf_url": "https://arxiv.org/pdf/2609.06986v1", "published_at": "2026-09-07", "score": 0.339, "selected_reasons": ["HF trending (267\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.06986.png", "title": "Continual Learning Mechanisms Compose for Long-Horizon Memorization", "tldr": "\u7ec4\u5408\u591a\u79cd\u6301\u7eed\u5b66\u4e60\u673a\u5236\u663e\u8457\u63d0\u5347\u957f\u7a0b\u8bb0\u5fc6\u4fdd\u6301\u3002", "upvotes": 267, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u957f\u7a0b\u8bb0\u5fc6\u201d\u8bc4\u6d4b\u8bbe\u5b9a\uff1a\u6a21\u578b\u8fde\u7eed\u76d1\u7763\u5fae\u8c03\u5b66\u4e60100\u4e2a\u95ee\u7b54\u4efb\u52a1\uff0c\u4e0d\u80fd\u4fdd\u7559\u65e7\u6837\u672c\u4e14\u63a8\u7406\u65f6\u65e0\u4efb\u52a1\u6807\u8bc6\u3002\u4f5c\u8005\u7cfb\u7edf\u6bd4\u8f83\u5e76\u7ec4\u5408\u6570\u636e\u3001\u51fd\u6570\u3001\u6743\u91cd\u951a\u5b9a\u4e0eLoRA\u5206\u914d\u7b56\u7565\uff0c\u53d1\u73b0\u7ec4\u5408\u673a\u5236\u80fd\u663e\u8457\u7f13\u89e3\u707e\u96be\u6027\u9057\u5fd8\u3002", "why_notable": "\u8be5\u7814\u7a76\u628a\u8bed\u8a00\u6a21\u578b\u6301\u7eed\u66f4\u65b0\u4e2d\u7684\u957f\u671f\u8bb0\u5fc6\u95ee\u9898\u5f62\u5f0f\u5316\uff0c\u5e76\u8bc1\u660e\u5355\u4e00\u6301\u7eed\u5b66\u4e60\u6280\u5de7\u4e0d\u8db3\uff0c\u4e92\u8865\u673a\u5236\u7ec4\u5408\u624d\u662f\u5173\u952e\uff1b\u5bf9\u9700\u8981\u957f\u671f\u5438\u6536\u65b0\u77e5\u8bc6\u4e14\u4e0d\u9057\u5fd8\u65e7\u77e5\u8bc6\u7684\u6a21\u578b\u66f4\u65b0\u6d41\u7a0b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "An agentic society is a collection of AI agents that coordinate autonomously across trust boundaries, on behalf of different principals whose objectives may only partially align. We show experimentally that in agentic societies even honest, competent agents often fail to reach satisfactory outcomes with existing harnesses and messaging primitives, and that faulty or malicious agents can stall collaboration, influence outcomes, and pursue other harmful goals by exploiting vulnerabilities in communication (``speech\u0027\u0027). We argue that agentic societies need a \\emph{social harness} for inter-agent interactions, in addition to each agent\u0027s \\emph{personal harness}, which manages its private context and communication with its principal. We propose a layered architecture for social harnesses which (i) prevents classes of failures outright, (ii) enables agents to detect invalid messages at runtime, and (iii) supports post-facto investigation and consequences, and highlight directions for future research to realize these capabilities.", "arxiv_id": "2609.17527", "arxiv_url": "https://arxiv.org/abs/2609.17527", "authors": ["Tapan Chugh", "Vidushi Singh", "Krish Jain", "Arvind Krishnamurthy", "Ratul Mahajan"], "brief": "\u8bba\u6587\u7814\u7a76\u8de8\u4fe1\u4efb\u8fb9\u754c\u81ea\u4e3b\u534f\u4f5c\u7684\u201c\u667a\u80fd\u4f53\u793e\u4f1a\u201d\uff0c\u6307\u51fa\u73b0\u6709\u4e2a\u4eba\u7ea7 harness \u4e0e\u6d88\u606f\u673a\u5236\u4e0d\u8db3\u4ee5\u652f\u6491\u53ef\u9760\u534f\u4f5c\u3002\u4f5c\u8005\u63d0\u51fa\u9762\u5411\u667a\u80fd\u4f53\u95f4\u4ea4\u4e92\u7684\u5206\u5c42 social harness \u67b6\u6784\uff0c\u7528\u4e8e\u9884\u9632\u3001\u68c0\u6d4b\u548c\u8ffd\u8d23\u901a\u4fe1\u5c42\u9762\u7684\u5931\u8d25\u4e0e\u653b\u51fb\u3002", "categories": ["cs.MA", "cs.AI", "cs.NI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17527", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5b9e\u9a8c\u663e\u793a\uff0c\u5373\u4f7f\u8bda\u5b9e\u4e14\u80fd\u529b\u8db3\u591f\u7684\u667a\u80fd\u4f53\uff0c\u5728\u73b0\u6709\u534f\u4f5c\u6846\u67b6\u4e0b\u4e5f\u5e38\u65e0\u6cd5\u8fbe\u6210\u6ee1\u610f\u7ed3\u679c", "\u6545\u969c\u6216\u6076\u610f\u667a\u80fd\u4f53\u53ef\u5229\u7528\u901a\u4fe1\u6f0f\u6d1e\u963b\u585e\u534f\u4f5c\u3001\u64cd\u7eb5\u7ed3\u679c\u6216\u6267\u884c\u6709\u5bb3\u76ee\u6807", "\u63d0\u51fa social harness \u5206\u5c42\u67b6\u6784\uff1a\u4e8b\u524d\u963b\u65ad\u5931\u8d25\u3001\u8fd0\u884c\u65f6\u9a8c\u8bc1\u6d88\u606f\u3001\u4e8b\u540e\u5ba1\u8ba1\u4e0e\u95ee\u8d23"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u5b89\u5168\u6cbb\u7406", "\u901a\u4fe1\u534f\u8bae"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17527v1", "published_at": "2026-09-15", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Agentic Societies Need a Social Harness", "tldr": "\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u9700\u8981\u793e\u4f1a\u5c42\u5b89\u5168\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u8de8\u4fe1\u4efb\u8fb9\u754c\u81ea\u4e3b\u534f\u4f5c\u7684\u201c\u667a\u80fd\u4f53\u793e\u4f1a\u201d\uff0c\u6307\u51fa\u73b0\u6709\u4e2a\u4eba\u7ea7 harness \u4e0e\u6d88\u606f\u673a\u5236\u4e0d\u8db3\u4ee5\u652f\u6491\u53ef\u9760\u534f\u4f5c\u3002\u4f5c\u8005\u63d0\u51fa\u9762\u5411\u667a\u80fd\u4f53\u95f4\u4ea4\u4e92\u7684\u5206\u5c42 social harness \u67b6\u6784\uff0c\u7528\u4e8e\u9884\u9632\u3001\u68c0\u6d4b\u548c\u8ffd\u8d23\u901a\u4fe1\u5c42\u9762\u7684\u5931\u8d25\u4e0e\u653b\u51fb\u3002", "why_notable": "\u968f\u7740\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4ece\u5355\u4e00\u4efb\u52a1\u8d70\u5411\u8de8\u7ec4\u7ec7\u3001\u8de8\u4e3b\u4f53\u534f\u4f5c\uff0c\u5b89\u5168\u8fb9\u754c\u4e0d\u518d\u53ea\u5728\u5355\u4e2a\u667a\u80fd\u4f53\u5185\u90e8\u3002\u8be5\u8bba\u6587\u5c06\u901a\u4fe1\u3001\u4fe1\u4efb\u4e0e\u6cbb\u7406\u673a\u5236\u63d0\u5347\u4e3a\u57fa\u7840\u8bbe\u65bd\u95ee\u9898\uff0c\u5bf9\u672a\u6765 LLM agent \u793e\u4f1a\u7684\u5b89\u5168\u90e8\u7f72\u548c\u6807\u51c6\u5316\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Large language model (LLM)-powered agentic AI services increasingly demand low-latency inference, motivating the deployment of LLMs across distributed edge servers. However, heterogeneous communication and computing capabilities, together with dynamically evolving inference states, make the edge server selection for each incoming request time-varying and tightly coupled across slots. In this paper, we investigate an online request scheduling framework for edge LLM inference that jointly minimizes long-term average end-to-end latency and regulates workload distribution across heterogeneous edge servers. Two main challenges arise in this context. First, conventional latency models cannot accurately capture the fine-grained dynamics of multi-stage LLM execution. Second, the latency consequence of a scheduling decision is observed only after request completion, making immediate decision evaluation difficult. To address these challenges, we develop a cross-slot inference model that captures transmission, prefill, iteration-level decoding, and key-value (KV) cache evolution for each diverse request, and characterize server workload through a KV cache memory-time consumption metric. We propose the LYREO approach that transforms the long-term load-balancing constraint via Lyapunov optimization and employs reward redistribution with sequencebased return prediction to convert delayed outcomes into timely learning signals for earlier decisions. Simulations under various configurations demonstrate that LYREO consistently achieves lower latency and more balanced load distribution than representative learning-based and heuristic baseline schemes.", "arxiv_id": "2609.17193", "arxiv_url": "https://arxiv.org/abs/2609.17193", "authors": ["Zhen Li", "Jun Cai", "Haoran Gao", "An Li", "Tan Li"], "brief": "\u8bba\u6587\u7814\u7a76\u5206\u5e03\u5f0f\u5f02\u6784\u8fb9\u7f18\u670d\u52a1\u5668\u4e0a\u7684LLM\u63a8\u7406\u8bf7\u6c42\u5728\u7ebf\u8c03\u5ea6\uff0c\u8054\u5408\u4f18\u5316\u7aef\u5230\u7aef\u65f6\u5ef6\u4e0e\u8d1f\u8f7d\u5747\u8861\u3002\u4f5c\u8005\u63d0\u51faLYREO\uff0c\u7ed3\u5408\u7ec6\u7c92\u5ea6\u8de8\u65f6\u9699\u63a8\u7406\u5efa\u6a21\u3001Lyapunov\u4f18\u5316\u4e0e\u5ef6\u8fdf\u5956\u52b1\u91cd\u5206\u914d\u6765\u505a\u5728\u7ebf\u51b3\u7b56\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17193", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u8986\u76d6\u4f20\u8f93\u3001prefill\u3001\u9010\u8f6edecode\u4e0eKV cache\u6f14\u5316\u7684\u8de8\u65f6\u9699\u63a8\u7406\u6a21\u578b\uff0c\u66f4\u7cbe\u786e\u523b\u753bLLM\u591a\u9636\u6bb5\u6267\u884c\u52a8\u6001\u3002", "\u7528KV cache\u7684\u201c\u5185\u5b58-\u65f6\u95f4\u201d\u6d88\u8017\u5ea6\u91cf\u670d\u52a1\u5668\u5de5\u4f5c\u8d1f\u8f7d\uff0c\u5e76\u901a\u8fc7Lyapunov\u4f18\u5316\u5904\u7406\u957f\u671f\u8d1f\u8f7d\u5747\u8861\u7ea6\u675f\u3002", "\u9488\u5bf9\u8bf7\u6c42\u5b8c\u6210\u540e\u624d\u89c2\u6d4b\u5230\u771f\u5b9e\u65f6\u5ef6\u7684\u95ee\u9898\uff0c\u5f15\u5165\u57fa\u4e8e\u5e8f\u5217\u56de\u62a5\u9884\u6d4b\u7684\u5956\u52b1\u91cd\u5206\u914d\uff0c\u4e3a\u65e9\u671f\u8c03\u5ea6\u51b3\u7b56\u63d0\u4f9b\u53ca\u65f6\u5b66\u4e60\u4fe1\u53f7\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8fb9\u7f18\u8ba1\u7b97", "LLM\u63a8\u7406", "\u8c03\u5ea6\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17193v1", "published_at": "2026-09-15", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "End-to-End Latency-Minimizing and Load-Balanced Request Scheduling for Edge LLM Inference in Agentic AI Services", "tldr": "\u9762\u5411\u8fb9\u7f18\u667a\u80fd\u4f53\u670d\u52a1\u7684\u4f4e\u5ef6\u8fdfLLM\u8c03\u5ea6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5206\u5e03\u5f0f\u5f02\u6784\u8fb9\u7f18\u670d\u52a1\u5668\u4e0a\u7684LLM\u63a8\u7406\u8bf7\u6c42\u5728\u7ebf\u8c03\u5ea6\uff0c\u8054\u5408\u4f18\u5316\u7aef\u5230\u7aef\u65f6\u5ef6\u4e0e\u8d1f\u8f7d\u5747\u8861\u3002\u4f5c\u8005\u63d0\u51faLYREO\uff0c\u7ed3\u5408\u7ec6\u7c92\u5ea6\u8de8\u65f6\u9699\u63a8\u7406\u5efa\u6a21\u3001Lyapunov\u4f18\u5316\u4e0e\u5ef6\u8fdf\u5956\u52b1\u91cd\u5206\u914d\u6765\u505a\u5728\u7ebf\u51b3\u7b56\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u8fb9\u7f18\u4fa7\u667a\u80fd\u4f53AI\u670d\u52a1\u7684\u5b9e\u9645\u74f6\u9888\uff0c\u628aLLM\u63a8\u7406\u5185\u90e8\u72b6\u6001\u3001KV\u7f13\u5b58\u5360\u7528\u548c\u7f51\u7edc/\u8ba1\u7b97\u5f02\u6784\u6027\u7eb3\u5165\u7edf\u4e00\u8c03\u5ea6\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u591a\u8282\u70b9\u90e8\u7f72\u4e2d\u7684\u7aef\u5230\u7aef\u5ef6\u8fdf\u5e76\u907f\u514d\u70ed\u70b9\u670d\u52a1\u5668\u8fc7\u8f7d\u3002"}, {"abstract": "With the rapid development of Large language model (LLM), agent systems enhanced by LLMs show huge potential in being able to deal with complex tasks, especially involving multi-step thinking or interaction with tools. For applying LLM techniques with a well-designed agent paradigm, post-training of LLM in multiple agent scenarios is necessary to achieve better performance. Among the variable post-training techniques, alignment methods such as PPO, DPO, DIL, and GRPO become popular because many papers show a significant positive impact on the model\u0027s performance by punishing negative samples while keeping acceptable training complexity. However, most alignment methods address simple single-turn tasks, and there remains room for improvement for complex multi-turn tasks. We propose Turn-level Multiscale Density Ratio Estimation (tlm-DRE), which assigns different weights on corresponding turns and proposes asymmetric token-level training based on the positive-negative space gaps across multiple turns of tasks. The results of the experiment on a wide range of agent benchmarks show that the proposed method performs competitively compared to traditional alignment methods. The proposed training method enables LLMs to perform robustly in multi-turn reasoning tasks with both in-domain and out-of-domain conditions.", "arxiv_id": "2609.16760", "arxiv_url": "https://arxiv.org/abs/2609.16760", "authors": ["Zishuo Zhao", "Kai Chen", "Ao Li", "Yuan Liu"], "brief": "\u8bba\u6587\u63d0\u51fa Turn-level Multiscale Density Ratio Estimation\uff08tlm-DRE\uff09\uff0c\u7528\u4e8e\u6539\u8fdb LLM \u667a\u80fd\u4f53\u5728\u591a\u8f6e\u63a8\u7406\u4e0e\u5de5\u5177\u4ea4\u4e92\u4efb\u52a1\u4e2d\u7684\u540e\u8bad\u7ec3\u5bf9\u9f50\u3002\u8be5\u65b9\u6cd5\u6309\u4e0d\u540c\u8f6e\u6b21\u5206\u914d\u6743\u91cd\uff0c\u5e76\u57fa\u4e8e\u6b63\u8d1f\u6837\u672c\u5728\u591a\u8f6e\u4e2d\u7684\u5dee\u8ddd\u8fdb\u884c\u975e\u5bf9\u79f0 token \u7ea7\u8bad\u7ec3\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16760", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9 PPO\u3001DPO\u3001DIL\u3001GRPO \u7b49\u5e38\u89c1\u5bf9\u9f50\u65b9\u6cd5\u504f\u91cd\u5355\u8f6e\u4efb\u52a1\u7684\u95ee\u9898\uff0c\u4e13\u95e8\u5efa\u6a21\u591a\u8f6e\u4efb\u52a1\u4e2d\u7684\u8f6e\u6b21\u7ea7\u5dee\u5f02\u3002", "\u5f15\u5165\u9010\u8f6e\u591a\u5c3a\u5ea6\u5bc6\u5ea6\u6bd4\u4f30\u8ba1\uff0c\u4e3a\u4e0d\u540c\u4ea4\u4e92\u8f6e\u6b21\u8d4b\u4e88\u4e0d\u540c\u8bad\u7ec3\u6743\u91cd\uff0c\u5f3a\u5316\u5173\u952e\u8f6e\u6b21\u7684\u5b66\u4e60\u4fe1\u53f7\u3002", "\u5728\u591a\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u8868\u73b0\u5177\u6709\u7ade\u4e89\u529b\uff0c\u5e76\u5728\u57df\u5185\u4e0e\u57df\u5916\u591a\u8f6e\u63a8\u7406\u4efb\u52a1\u4e2d\u63d0\u5347\u9c81\u68d2\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5bf9\u9f50\u8bad\u7ec3", "\u591a\u8f6e\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.16760v1", "published_at": "2026-09-15", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Turn-level Multiscale Density Ratio Estimation for LLM Agents", "tldr": "\u9762\u5411\u591a\u8f6e\u667a\u80fd\u4f53\u7684\u9010\u8f6e\u5bc6\u5ea6\u6bd4\u5bf9\u9f50\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Turn-level Multiscale Density Ratio Estimation\uff08tlm-DRE\uff09\uff0c\u7528\u4e8e\u6539\u8fdb LLM \u667a\u80fd\u4f53\u5728\u591a\u8f6e\u63a8\u7406\u4e0e\u5de5\u5177\u4ea4\u4e92\u4efb\u52a1\u4e2d\u7684\u540e\u8bad\u7ec3\u5bf9\u9f50\u3002\u8be5\u65b9\u6cd5\u6309\u4e0d\u540c\u8f6e\u6b21\u5206\u914d\u6743\u91cd\uff0c\u5e76\u57fa\u4e8e\u6b63\u8d1f\u6837\u672c\u5728\u591a\u8f6e\u4e2d\u7684\u5dee\u8ddd\u8fdb\u884c\u975e\u5bf9\u79f0 token \u7ea7\u8bad\u7ec3\u3002", "why_notable": "\u591a\u8f6e\u667a\u80fd\u4f53\u8bad\u7ec3\u662f LLM agent \u843d\u5730\u7684\u6838\u5fc3\u74f6\u9888\u4e4b\u4e00\uff1b\u8be5\u5de5\u4f5c\u5c06\u5bf9\u9f50\u4f18\u5316\u4ece\u5355\u8f6e\u504f\u597d\u6269\u5c55\u5230\u591a\u8f6e\u8f68\u8ff9\u7ea7\u7ec6\u7c92\u5ea6\u5efa\u6a21\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u590d\u6742\u4ea4\u4e92\u4efb\u52a1\u4e2d\u7684\u7a33\u5b9a\u6027\u4e0e\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Interactive video world models must maintain broad scene context under camera motion while producing high-fidelity observations with low latency. Existing approaches face a representation trade-off: perspective models operate on local views and must preserve off-screen content over long rollouts, whereas broader spatial coverage is typically obtained by synthesizing full-sphere videos or constructing explicit 3D representations. Motivated by the complementary roles of global context and selective local acuity in visual perception, we present AlayaVista, a camera-controllable streaming video world model that decouples panoramic world evolution from perspective observation synthesis. Given a single perspective image, AlayaVista constructs a 360-degree scene prior using a pretrained panorama expansion model and then evolves the scene as a camera-conditioned panoramic latent state. A latent viewport renderer maps this state to the requested perspective video latents, while a perspective refiner restores details, suppresses artifacts, and performs super-resolution. To support efficient streaming, we adapt the panoramic generator to chunk-autoregressive generation and distill both panoramic generation and perspective refinement into few-step processes. To provide the supervision required by this design, we construct MUGEN, a large-scale real-world panoramic video dataset containing 1,318 hours of videos at resolutions of at least 4K, together with rich semantic and geometric annotations.", "arxiv_id": "2609.14462", "arxiv_url": "https://arxiv.org/abs/2609.14462", "authors": ["Jiaming Tan", "Mingliang Zhai", "Zhen Li", "Yuwei Wu", "Chuanhao Li", "Kaipeng Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa AlayaVista\uff0c\u4e00\u79cd\u76f8\u673a\u53ef\u63a7\u7684\u6d41\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u5168\u666f\u4e16\u754c\u72b6\u6001\u6f14\u5316\u4e0e\u5c40\u90e8\u900f\u89c6\u89c6\u9891\u5408\u6210\u89e3\u8026\u3002\u5b83\u4ece\u5355\u5f20\u900f\u89c6\u56fe\u6784\u5efa 360 \u5ea6\u573a\u666f\u5148\u9a8c\uff0c\u5e76\u6309\u76f8\u673a\u8f68\u8ff9\u751f\u6210\u9ad8\u4fdd\u771f\u900f\u89c6\u89c6\u9891\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/AlayaLab/AlayaVista", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2609.14462", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u9884\u8bad\u7ec3\u5168\u666f\u6269\u5c55\u6a21\u578b\u4ece\u5355\u5f20\u900f\u89c6\u56fe\u751f\u6210 360 \u5ea6\u573a\u666f\u5148\u9a8c\uff0c\u5e76\u5728\u5168\u666f\u6f5c\u7a7a\u95f4\u4e2d\u8fdb\u884c\u76f8\u673a\u6761\u4ef6\u5316\u7684\u4e16\u754c\u72b6\u6001\u6f14\u5316", "\u8bbe\u8ba1\u6f5c\u7a7a\u95f4 viewport renderer \u5c06\u5168\u666f\u72b6\u6001\u6620\u5c04\u5230\u6307\u5b9a\u900f\u89c6\u89c6\u89d2\uff0c\u518d\u7528 perspective refiner \u505a\u7ec6\u8282\u6062\u590d\u3001\u4f2a\u5f71\u6291\u5236\u4e0e\u8d85\u5206\u8fa8\u7387", "\u4e3a\u4f4e\u5ef6\u8fdf\u6d41\u5f0f\u751f\u6210\u5f15\u5165 chunk-autoregressive \u673a\u5236\uff0c\u5e76\u5c06\u5168\u666f\u751f\u6210\u4e0e\u900f\u89c6\u7cbe\u4fee\u84b8\u998f\u4e3a\u5c11\u6b65\u63a8\u7406\uff1b\u540c\u65f6\u6784\u5efa 1318 \u5c0f\u65f6\u30014K \u4ee5\u4e0a\u7684 MUGEN \u5168\u666f\u89c6\u9891\u6570\u636e\u96c6"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u5168\u666f\u89c6\u89c9", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Alaya Lab", "pdf_url": "https://arxiv.org/pdf/2609.14462v1", "published_at": "2026-09-13", "score": 0.312, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14462.png", "title": "AlayaVista: Streaming World Modeling from Panoramic States to Perspective Video", "tldr": "\u5168\u666f\u72b6\u6001\u9a71\u52a8\u4f4e\u5ef6\u8fdf\u89c6\u89d2\u89c6\u9891\u4e16\u754c\u6a21\u578b", "upvotes": 20, "what_it_is": "\u8bba\u6587\u63d0\u51fa AlayaVista\uff0c\u4e00\u79cd\u76f8\u673a\u53ef\u63a7\u7684\u6d41\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u5168\u666f\u4e16\u754c\u72b6\u6001\u6f14\u5316\u4e0e\u5c40\u90e8\u900f\u89c6\u89c6\u9891\u5408\u6210\u89e3\u8026\u3002\u5b83\u4ece\u5355\u5f20\u900f\u89c6\u56fe\u6784\u5efa 360 \u5ea6\u573a\u666f\u5148\u9a8c\uff0c\u5e76\u6309\u76f8\u673a\u8f68\u8ff9\u751f\u6210\u9ad8\u4fdd\u771f\u900f\u89c6\u89c6\u9891\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ed5\u5f00\u4e86\u4f20\u7edf\u900f\u89c6\u89c6\u9891\u6a21\u578b\u96be\u4ee5\u957f\u671f\u8bb0\u5fc6\u753b\u5916\u5185\u5bb9\u3001\u5168\u666f/3D \u65b9\u6cd5\u6210\u672c\u9ad8\u7684\u77db\u76fe\uff0c\u7528\u5168\u666f\u6f5c\u72b6\u6001\u63d0\u4f9b\u5168\u5c40\u4e0a\u4e0b\u6587\u3001\u7528\u5c40\u90e8\u6e32\u67d3\u4fdd\u8bc1\u7ec6\u8282\u4e0e\u6548\u7387\uff0c\u5bf9\u4ea4\u4e92\u5f0f\u89c6\u9891\u751f\u6210\u3001\u4eff\u771f\u548c\u89c6\u89c9\u4e16\u754c\u6a21\u578b\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce and release ScienceBuddy, an interactive scientific research workspace that brings continually improving scientific agents into researchers\u0027 everyday workflows. ScienceBuddy supports researchers in carrying out scientific tasks while transforming their requests, feedback, and execution evidence into tasks and evaluation rubrics for continual learning. At its core is recursive-in-recursive self-improvement, a paradigm that couples harness evolution with model reinforcement learning: the inner recursion improves the harness with the model fixed, while the outer recursion trains the model under the improved harness. Harness evolution shapes training experience, and model learning creates new opportunities for harness adaptation. We present case studies of researcher interaction, harness refinement, and model learning, with the benchmark cases spanning four scientific task families. By releasing ScienceBuddy as a research product, we make this paradigm available to the scientific community and take a step toward discovery intelligence: scientific AI that advances through sustained collaboration with researchers and evolves alongside the research it supports. Website: http://science-buddy.io", "arxiv_id": "2609.17523", "arxiv_url": "https://arxiv.org/abs/2609.17523", "authors": ["Shuhan Xue", "Jianyuan Zhong", "Ziyuan Nan", "Wenbin Li", "Zhaochen Yu", "Jinchao Ding", "Qiang Gao", "Pengyu Zhan", "Yuntong Zhang", "Tian Cheng", "Zhenfei Yin", "Yingcheng Wu", "Ling Yang"], "brief": "ScienceBuddy \u662f\u4e00\u4e2a\u4ea4\u4e92\u5f0f\u79d1\u5b66\u7814\u7a76\u5de5\u4f5c\u7a7a\u95f4\uff0c\u5c06\u79d1\u7814\u4eba\u5458\u7684\u8bf7\u6c42\u3001\u53cd\u9988\u548c\u6267\u884c\u8bc1\u636e\u8f6c\u5316\u4e3a\u6301\u7eed\u5b66\u4e60\u4efb\u52a1\u4e0e\u8bc4\u4f30\u6807\u51c6\u3002\u8bba\u6587\u63d0\u51fa\u201c\u9012\u5f52\u4e2d\u7684\u9012\u5f52\u201d\u81ea\u6539\u8fdb\u8303\u5f0f\uff0c\u4ea4\u66ff\u4f18\u5316\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u4e0e\u6a21\u578b\u80fd\u529b\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/Gen-Verse/ScienceBuddy", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.17523", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5185\u5c42\u9012\u5f52\u5728\u56fa\u5b9a\u6a21\u578b\u4e0b\u6539\u8fdb harness\uff0c\u4f7f\u4efb\u52a1\u6267\u884c\u3001\u8bc4\u4f30\u4e0e\u8bad\u7ec3\u6570\u636e\u751f\u6210\u66f4\u8d34\u5408\u79d1\u7814\u573a\u666f", "\u5916\u5c42\u9012\u5f52\u5728\u6539\u8fdb\u540e\u7684 harness \u4e2d\u5bf9\u6a21\u578b\u8fdb\u884c\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u79d1\u5b66\u4efb\u52a1\u5904\u7406\u80fd\u529b", "\u901a\u8fc7\u7814\u7a76\u8005\u4ea4\u4e92\u3001harness \u7cbe\u70bc\u548c\u6a21\u578b\u5b66\u4e60\u6848\u4f8b\u9a8c\u8bc1\uff0c\u8986\u76d6\u56db\u7c7b\u79d1\u5b66\u4efb\u52a1\u65cf"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u7814\u81ea\u52a8\u5316", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17523v1", "published_at": "2026-09-15", "score": 0.291, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.17523.png", "title": "ScienceBuddy: Recursive-in-Recursive Self-Improvement for Interactive Scientific Agents", "tldr": "\u9762\u5411\u79d1\u7814\u667a\u80fd\u4f53\u7684\u9012\u5f52\u81ea\u6539\u8fdb\u5de5\u4f5c\u53f0", "upvotes": 14, "what_it_is": "ScienceBuddy \u662f\u4e00\u4e2a\u4ea4\u4e92\u5f0f\u79d1\u5b66\u7814\u7a76\u5de5\u4f5c\u7a7a\u95f4\uff0c\u5c06\u79d1\u7814\u4eba\u5458\u7684\u8bf7\u6c42\u3001\u53cd\u9988\u548c\u6267\u884c\u8bc1\u636e\u8f6c\u5316\u4e3a\u6301\u7eed\u5b66\u4e60\u4efb\u52a1\u4e0e\u8bc4\u4f30\u6807\u51c6\u3002\u8bba\u6587\u63d0\u51fa\u201c\u9012\u5f52\u4e2d\u7684\u9012\u5f52\u201d\u81ea\u6539\u8fdb\u8303\u5f0f\uff0c\u4ea4\u66ff\u4f18\u5316\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u4e0e\u6a21\u578b\u80fd\u529b\u3002", "why_notable": "\u5b83\u5c06\u79d1\u7814\u5de5\u4f5c\u6d41\u4e2d\u7684\u771f\u5b9e\u4ea4\u4e92\u53cd\u9988\u7cfb\u7edf\u5316\u8f6c\u5316\u4e3a\u667a\u80fd\u4f53\u6301\u7eed\u5b66\u4e60\u4fe1\u53f7\uff0c\u63a2\u7d22\u4e86\u79d1\u7814\u667a\u80fd\u4f53\u4ece\u5de5\u5177\u8d70\u5411\u957f\u671f\u534f\u4f5c\u5f0f\u201c\u53d1\u73b0\u667a\u80fd\u201d\u7684\u8def\u5f84\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u4ea7\u54c1\u5316\u548c\u7814\u7a76\u5e73\u53f0\u4ef7\u503c\u3002"}, {"abstract": "The KV cache is a primary bottleneck for Transformer decoding: its memory footprint and cache-read traffic grow with sequence length. Grouped-query attention (GQA) reduces this cost by sharing key-value heads, but still stores both a key and a value at every step. We introduce Grouped Value Attention (GVA), which stores grouped values and reconstructs content keys with a learned linear map. At inference, the map can be absorbed into the query, eliminating the need to materialize content keys in the intended decode path. A small shared decoupled RoPE channel retains positional information through a separately cached positional key. For the configurations studied, this representation reduces persistent cache scalars by approximately 45-47% relative to matched GQA. At the 350M-parameter scale with 30B FineWeb-Edu tokens, the 16-dimensional positional variant reaches 44.18 average accuracy across five tasks, compared with 44.36 for GQA and 43.88 for MLA. These results demonstrate near-GQA benchmark accuracy with a more compact cache representation. To translate this compact representation into faster autoregressive inference, we have developed custom decoding kernels and are currently evaluating their end-to-end inference performance with an open-source release planned soon.", "arxiv_id": "2609.13285", "arxiv_url": "https://arxiv.org/abs/2609.13285", "authors": ["Vishesh Tripathi", "Abhay Kumar", "Ramsha Khan"], "brief": "\u8bba\u6587\u63d0\u51faGrouped Value Attention\uff08GVA\uff09\uff1a\u53ea\u7f13\u5b58\u5206\u7ec4\u540e\u7684Value\uff0c\u5e76\u7528\u5b66\u4e60\u5230\u7684\u7ebf\u6027\u6620\u5c04\u6309\u9700\u91cd\u6784\u5185\u5bb9Key\uff1b\u63a8\u7406\u65f6\u8be5\u6620\u5c04\u53ef\u5e76\u5165Query\uff0c\u907f\u514d\u5728\u4e3b\u8981\u89e3\u7801\u8def\u5f84\u4e2d\u663e\u5f0f\u751f\u6210\u5185\u5bb9Key\u3002\u540c\u65f6\u5f15\u5165\u5c0f\u578b\u5171\u4eab\u7684\u89e3\u8026RoPE\u4f4d\u7f6e\u901a\u9053\u6765\u4fdd\u7559\u4f4d\u7f6e\u4fe1\u606f\u3002", "categories": ["cs.AR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13285", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u6bd4\u5339\u914d\u7684GQA\u914d\u7f6e\uff0cGVA\u5c06\u6301\u4e45\u5316KV\u7f13\u5b58\u6807\u91cf\u6570\u91cf\u51cf\u5c11\u7ea645%-47%\u3002", "\u5728350M\u53c2\u6570\u300130B FineWeb-Edu tokens\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\uff0c16\u7ef4\u4f4d\u7f6e\u901a\u9053\u53d8\u4f53\u4e94\u9879\u4efb\u52a1\u5e73\u5747\u51c6\u786e\u7387\u4e3a44.18\uff0c\u63a5\u8fd1GQA\u768444.36\uff0c\u5e76\u4f18\u4e8eMLA\u768443.88\u3002", "\u4f5c\u8005\u6b63\u5728\u5f00\u53d1\u81ea\u5b9a\u4e49\u89e3\u7801kernel\uff0c\u4ee5\u5c06\u7f13\u5b58\u538b\u7f29\u8fdb\u4e00\u6b65\u8f6c\u5316\u4e3a\u81ea\u56de\u5f52\u63a8\u7406\u52a0\u901f\uff0c\u5e76\u8ba1\u5212\u5f00\u6e90\u3002"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "KV\u7f13\u5b58", "\u63a8\u7406\u52a0\u901f", "Transformer"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13285v2", "published_at": "2026-09-08", "score": 0.289, "selected_reasons": ["HF trending (60\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13285.png", "title": "Grouped Value Attention: Efficient KV Caching via On-Demand Key Reconstruction", "tldr": "\u7528\u503c\u91cd\u6784\u952e\uff0c\u663e\u8457\u538b\u7f29Transformer\u89e3\u7801KV\u7f13\u5b58\u3002", "upvotes": 60, "what_it_is": "\u8bba\u6587\u63d0\u51faGrouped Value Attention\uff08GVA\uff09\uff1a\u53ea\u7f13\u5b58\u5206\u7ec4\u540e\u7684Value\uff0c\u5e76\u7528\u5b66\u4e60\u5230\u7684\u7ebf\u6027\u6620\u5c04\u6309\u9700\u91cd\u6784\u5185\u5bb9Key\uff1b\u63a8\u7406\u65f6\u8be5\u6620\u5c04\u53ef\u5e76\u5165Query\uff0c\u907f\u514d\u5728\u4e3b\u8981\u89e3\u7801\u8def\u5f84\u4e2d\u663e\u5f0f\u751f\u6210\u5185\u5bb9Key\u3002\u540c\u65f6\u5f15\u5165\u5c0f\u578b\u5171\u4eab\u7684\u89e3\u8026RoPE\u4f4d\u7f6e\u901a\u9053\u6765\u4fdd\u7559\u4f4d\u7f6e\u4fe1\u606f\u3002", "why_notable": "KV cache\u662f\u957f\u5e8f\u5217Transformer\u63a8\u7406\u7684\u6838\u5fc3\u74f6\u9888\uff1bGVA\u5728\u51e0\u4e4e\u4e0d\u635f\u5931\u57fa\u51c6\u6027\u80fd\u7684\u60c5\u51b5\u4e0b\u5927\u5e45\u51cf\u5c11\u7f13\u5b58\u5360\u7528\uff0c\u4e3a\u4f4e\u5185\u5b58\u3001\u9ad8\u541e\u5410\u7684\u5927\u6a21\u578b\u90e8\u7f72\u63d0\u4f9b\u4e86\u65b0\u7684\u6ce8\u610f\u529b\u7ed3\u6784\u9009\u62e9\u3002"}, {"abstract": "We demonstrate that training LLMs with RL does not improve performance equally across a dataset. RL shows large improvements on easy problems that an LLM is already good at solving, but small improvements on hard problems. We call this the Matthew Effect in RL for LLMs, after the phenomenon of cumulative advantage from economics and network science summarized as \"the rich get richer\". The naive explanation is that hard problems require more compute to find a solution. We argue that modern RL methods are exacerbating the issue by wasting too much compute on easy problems and instead should dynamically reallocate how they use compute. We introduce Never Give Up (NGU), a simple adaptive sampling method that keeps generating samples for a problem until one is correct. By leveraging asynchronous RL, this naturally uses fewer samples to filter out easy problems and allocates more compute to solving harder problems. We investigate the design choices that affect NGU, such as off-policy robustness, and develop a set of best practices. On the math benchmark Deepscaler, NGU improves performance per compute, especially on harder problems. On a recent coding task, Manufactoria, standard GRPO with a per-test reward fails to fully solve problems that have a range of easy and difficult tests. NGU iteratively improves, solving harder and harder tests, until it learns to fully solve coding problems.", "arxiv_id": "2609.13443", "arxiv_url": "https://arxiv.org/abs/2609.13443", "authors": ["Michael Noukhovitch", "Hamish Ivison", "Nathan Lambert", "Aaron Courville"], "brief": "\u8bba\u6587\u6307\u51faLLM\u7684RL\u8bad\u7ec3\u5b58\u5728\u201c\u9a6c\u592a\u6548\u5e94\u201d\uff1a\u7b80\u5355\u9898\u63d0\u5347\u5927\u3001\u96be\u9898\u63d0\u5347\u5c0f\u3002\u4f5c\u8005\u63d0\u51faNever Give Up\uff08NGU\uff09\u81ea\u9002\u5e94\u91c7\u6837\u65b9\u6cd5\uff0c\u5bf9\u6bcf\u4e2a\u95ee\u9898\u6301\u7eed\u91c7\u6837\u76f4\u5230\u5f97\u5230\u6b63\u786e\u7b54\u6848\uff0c\u4ece\u800c\u628a\u66f4\u591a\u8ba1\u7b97\u5206\u914d\u7ed9\u96be\u9898\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13443", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u6807\u51c6RL\u4f1a\u5728\u7b80\u5355\u95ee\u9898\u4e0a\u6d88\u8017\u8fc7\u591a\u8ba1\u7b97\uff0c\u5bfc\u81f4\u96be\u9898\u8bad\u7ec3\u4fe1\u53f7\u4e0d\u8db3\u3001\u63d0\u5347\u6709\u9650", "NGU\u7ed3\u5408\u5f02\u6b65RL\uff0c\u81ea\u52a8\u51cf\u5c11\u7b80\u5355\u9898\u91c7\u6837\u3001\u589e\u52a0\u96be\u9898\u91c7\u6837\uff0c\u5e76\u8ba8\u8bba\u4e86\u79bb\u7b56\u7565\u9c81\u68d2\u6027\u7b49\u5b9e\u8df5\u8981\u70b9", "\u5728Deepscaler\u6570\u5b66\u57fa\u51c6\u4e0a\u63d0\u5347\u5355\u4f4d\u8ba1\u7b97\u6027\u80fd\uff0c\u5728Manufactoria\u4ee3\u7801\u4efb\u52a1\u4e2d\u80fd\u9010\u6b65\u89e3\u51b3\u66f4\u96be\u6d4b\u8bd5\u7528\u4f8b"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u9002\u5e94\u91c7\u6837", "\u4ee3\u7801\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "Ai2", "pdf_url": "https://arxiv.org/pdf/2609.13443v1", "published_at": "2026-09-11", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13443.png", "title": "Learning to Solve Hard Problems in RL for LLMs by Never Giving Up", "tldr": "NGU\u81ea\u9002\u5e94\u91c7\u6837\u8ba9LLM\u5f3a\u5316\u5b66\u4e60\u66f4\u4f1a\u653b\u514b\u96be\u9898", "upvotes": 2, "what_it_is": "\u8bba\u6587\u6307\u51faLLM\u7684RL\u8bad\u7ec3\u5b58\u5728\u201c\u9a6c\u592a\u6548\u5e94\u201d\uff1a\u7b80\u5355\u9898\u63d0\u5347\u5927\u3001\u96be\u9898\u63d0\u5347\u5c0f\u3002\u4f5c\u8005\u63d0\u51faNever Give Up\uff08NGU\uff09\u81ea\u9002\u5e94\u91c7\u6837\u65b9\u6cd5\uff0c\u5bf9\u6bcf\u4e2a\u95ee\u9898\u6301\u7eed\u91c7\u6837\u76f4\u5230\u5f97\u5230\u6b63\u786e\u7b54\u6848\uff0c\u4ece\u800c\u628a\u66f4\u591a\u8ba1\u7b97\u5206\u914d\u7ed9\u96be\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9LLM\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u8ba1\u7b97\u5206\u914d\u4f4e\u6548\u95ee\u9898\u7ed9\u51fa\u7b80\u5355\u6709\u6548\u7684\u6539\u8fdb\uff0c\u5bf9\u63d0\u5347\u590d\u6742\u63a8\u7406\u3001\u6570\u5b66\u548c\u4ee3\u7801\u4efb\u52a1\u7684\u8bad\u7ec3\u6548\u7387\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "The increasing deployment of AI agents in long-horizon tasks yields massive execution logs. Diagnosing failures within these records is crucial for reliability, as it transforms outcome-level signals into actionable interventions. The sheer scale of the data renders human review impractical, driving the need for automated root-cause attribution (RCA). However, automated RCA methods using LLMs suffer from low diagnostic accuracy, especially as execution traces grow larger. They struggle because relevant information is often sparse, distributed across distant actions, and disconnected from the visible failure, reducing root-cause attribution to a massive search problem. Existing RCA methods typically rely on one-shot LLM judgments to diagnose failures from execution traces. While effective for shorter trajectories, these judges tend to settle on a plausible diagnosis early, leaving critical evidence in longer traces unexamined. We introduce Continual Search, an iterative framework that nudges the judge, over successive turns, to keep searching for unresolved diagnostic evidence. We evaluate Continual Search across four existing RCA benchmarks. Recognizing the lack of massive execution traces in current benchmarks, we introduce MegaRCA-Mix to evaluate RCA at scale. MegaRCA-Mix provides a challenging testbed of 50 human-annotated failure trials spanning long-horizon, execution-heavy tasks. Across multiple benchmark suites and model families, Continual Search consistently improves attribution performance. On MegaRCA-Mix, for example, it improves GPT-5.5\u0027s F1 score by more than 40\\%, from $0.349$ to $0.498$. More interestingly, within the same model family, lower-tier models can even surpass their higher-tier counterparts, demonstrating that effective search supersedes raw model scale.", "arxiv_id": "2609.13463", "arxiv_url": "https://arxiv.org/abs/2609.13463", "authors": ["Harsh Raj", "David Lee", "Anas Mahmoud", "Renxiong Wang", "Razvan-Gabriel Dumitru", "Chenguang Wang", "Tong Zhao", "Yunzhong He", "Darvin Yi", "Vipul Gupta"], "brief": "\u8bba\u6587\u63d0\u51fa Continual Search\uff0c\u4e00\u79cd\u7528\u4e8e\u957f\u7a0b AI agent \u6267\u884c\u65e5\u5fd7\u6839\u56e0\u5f52\u56e0\u7684\u8fed\u4ee3\u8bca\u65ad\u6846\u67b6\u3002\u5b83\u901a\u8fc7\u591a\u8f6e\u63a8\u52a8 LLM \u8bc4\u5ba1\u5668\u7ee7\u7eed\u68c0\u7d22\u672a\u89e3\u51b3\u8bc1\u636e\uff0c\u907f\u514d\u4e00\u6b21\u6027\u5224\u65ad\u8fc7\u65e9\u6536\u655b\u5230\u770b\u4f3c\u5408\u7406\u4f46\u4e0d\u5b8c\u6574\u7684\u8bca\u65ad\
