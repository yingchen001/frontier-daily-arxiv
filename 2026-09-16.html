\u7406\u89e3\u5230\u751f\u6210\u201d\u8f6c\u6362\u77ac\u95f4\u7684\u7ec6\u7c92\u5ea6\u673a\u5236\uff0c\u4e3a\u5b89\u5168\u5bf9\u9f50\u63d0\u4f9b\u4e86\u53ef\u89e3\u91ca\u7684\u65b0\u89c6\u89d2\uff1bSafeToken \u4f5c\u4e3a\u63a8\u7406\u65f6\u8f7b\u91cf\u5e72\u9884\u65b9\u6cd5\uff0c\u4e5f\u5177\u5907\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Automating biological research requires general-purpose, reproducible robot systems that allow individual wet-lab researchers to delegate robot tasks without performing teleoperation or neural-network training. Vision-language-action policies have been proposed for general-purpose arms, but can lose performance when their operating environment changes. We therefore built WetRobo, a robot kit that can readily transfer between laboratories. It consists of one robot arm, laboratory equipment (an incubator, a reagent bottle with a cap, and a Petri dish), the existing code that moves the arm, teleoperation demonstrations of each task that we recorded, and a general AGENTS.md skill file. A biological experimentalist provides natural-language tasks without collecting local teleoperation training data or training a neural network. The coding agent observes the local laboratory and writes and executes programs, using external tools as needed for adaptation. We demonstrate use of WetRobo with OpenAI Codex (gpt-5.6-sol) on three successful tasks: lifting a Petri dish lid, removing a bottle cap, and opening the incubator door, all in real-world laboratories. The coding agent achieved the cap task in both laboratories, Lab X and Lab Y, whereas a VLA fine-tuned on Lab X demonstrations succeeded there but failed to transfer to Lab Y. These results point to a practical route for laboratory robotics: instead of training a policy for each laboratory, distribute a kit and let a coding agent adapt it in each laboratory. Code, demonstrations, and the evolved programs are available at https://github.com/tsudalab/WetRobo.", "arxiv_id": "2609.18435", "arxiv_url": "https://arxiv.org/abs/2609.18435", "authors": ["Yuna Oikawa", "Kei Endo", "Takanori Uzawa", "Yunzhe Zhang", "Manan Anjaria", "Lerrel Pinto", "Sherry Yang", "Koji Tsuda"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 WetRobo\uff0c\u4e00\u4e2a\u53ef\u5728\u4e0d\u540c\u751f\u7269\u5b9e\u9a8c\u5ba4\u590d\u73b0\u90e8\u7f72\u7684\u673a\u5668\u4eba\u5957\u4ef6\u3002\u7814\u7a76\u8005\u7528\u81ea\u7136\u8bed\u8a00\u4e0b\u8fbe\u4efb\u52a1\uff0c\u7f16\u7801\u667a\u80fd\u4f53\u89c2\u5bdf\u672c\u5730\u73af\u5883\u5e76\u7f16\u5199\u6267\u884c\u63a7\u5236\u7a0b\u5e8f\uff0c\u65e0\u9700\u672c\u5730\u9065\u64cd\u4f5c\u91c7\u96c6\u6216\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18435", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5957\u4ef6\u5305\u542b\u673a\u68b0\u81c2\u3001\u57f9\u517b\u7bb1\u3001\u5e26\u76d6\u8bd5\u5242\u74f6\u3001\u57f9\u517b\u76bf\u3001\u8fd0\u52a8\u63a7\u5236\u4ee3\u7801\u3001\u9065\u64cd\u4f5c\u793a\u8303\u548c AGENTS.md \u6280\u80fd\u6587\u4ef6", "\u4f7f\u7528 OpenAI Codex \u5728\u771f\u5b9e\u5b9e\u9a8c\u5ba4\u5b8c\u6210\u62ac\u57f9\u517b\u76bf\u76d6\u3001\u62e7\u5f00\u74f6\u76d6\u3001\u6253\u5f00\u57f9\u517b\u7bb1\u95e8\u4e09\u7c7b\u4efb\u52a1", "\u7f16\u7801\u667a\u80fd\u4f53\u5728 Lab X \u4e0e Lab Y \u5747\u5b8c\u6210\u74f6\u76d6\u4efb\u52a1\uff0c\u800c\u5728 Lab X \u5fae\u8c03\u7684 VLA \u7b56\u7565\u8fc1\u79fb\u5230 Lab Y \u5931\u8d25"], "keywords": ["\u667a\u80fd\u4f53", "\u5b9e\u9a8c\u5ba4\u81ea\u52a8\u5316", "\u673a\u5668\u4eba", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18435v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "WetRobo: A Reproducible Robot Kit for Coding Agents in Biological Laboratories", "tldr": "\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u81ea\u9002\u5e94\u64cd\u4f5c\u6e7f\u5b9e\u9a8c\u5ba4\u673a\u5668\u4eba", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 WetRobo\uff0c\u4e00\u4e2a\u53ef\u5728\u4e0d\u540c\u751f\u7269\u5b9e\u9a8c\u5ba4\u590d\u73b0\u90e8\u7f72\u7684\u673a\u5668\u4eba\u5957\u4ef6\u3002\u7814\u7a76\u8005\u7528\u81ea\u7136\u8bed\u8a00\u4e0b\u8fbe\u4efb\u52a1\uff0c\u7f16\u7801\u667a\u80fd\u4f53\u89c2\u5bdf\u672c\u5730\u73af\u5883\u5e76\u7f16\u5199\u6267\u884c\u63a7\u5236\u7a0b\u5e8f\uff0c\u65e0\u9700\u672c\u5730\u9065\u64cd\u4f5c\u91c7\u96c6\u6216\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5b9e\u9a8c\u5ba4\u673a\u5668\u4eba\u4ece\u201c\u4e3a\u6bcf\u4e2a\u573a\u666f\u8bad\u7ec3\u7b56\u7565\u201d\u8f6c\u5411\u201c\u5206\u53d1\u53ef\u590d\u73b0\u786c\u4ef6\u5957\u4ef6\u5e76\u7531\u7f16\u7801\u667a\u80fd\u4f53\u73b0\u573a\u9002\u914d\u201d\u7684\u53ef\u884c\u8def\u5f84\uff0c\u5bf9\u81ea\u52a8\u5316\u6e7f\u5b9e\u9a8c\u548c\u673a\u5668\u4eba\u6cdb\u5316\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLM) deployed as autonomous pricing agents may sustain supracompetitive prices through tacit coordination. We develop a causal graph divergence framework that separately measures structural faithfulness and intent faithfulness of LLM pricing agents in Bertrand competition. Across nine LLMs under duopoly and triopoly conditions, collusive behavior and chain-of-thought (CoT) faithfulness dissociate along both dimensions: the most collusive model accurately reports cooperative intent yet reasons structurally unfaithfully, while the most structurally faithful model sustains supra-Nash pricing under both market structures. These findings establish that CoT monitoring alone cannot serve as a standalone safeguard against algorithmic collusion.", "arxiv_id": "2609.18346", "arxiv_url": "https://arxiv.org/abs/2609.18346", "authors": ["Dohun Lee", "Hyunwoo Park"], "brief": "\u8bba\u6587\u7814\u7a76LLM\u4f5c\u4e3a\u81ea\u4e3b\u5b9a\u4ef7\u667a\u80fd\u4f53\u65f6\uff0c\u5728\u5be1\u5934\u4f2f\u7279\u5170\u7ade\u4e89\u4e2d\u662f\u5426\u4f1a\u901a\u8fc7\u9ed8\u5951\u534f\u8c03\u7ef4\u6301\u9ad8\u4e8e\u7ade\u4e89\u6c34\u5e73\u7684\u4ef7\u683c\u3002\u4f5c\u8005\u63d0\u51fa\u56e0\u679c\u56fe\u6563\u5ea6\u6846\u67b6\uff0c\u5206\u522b\u8861\u91cfCoT\u7684\u7ed3\u6784\u5fe0\u5b9e\u6027\u4e0e\u610f\u56fe\u5fe0\u5b9e\u6027\uff0c\u5e76\u57289\u4e2aLLM\u3001\u53cc\u5be1\u5934\u548c\u4e09\u5be1\u5934\u573a\u666f\u4e2d\u8fdb\u884c\u9a8c\u8bc1\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18346", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u533a\u5206\u201c\u7ed3\u6784\u5fe0\u5b9e\u6027\u201d\u548c\u201c\u610f\u56fe\u5fe0\u5b9e\u6027\u201d\u7684\u56e0\u679c\u56fe\u6563\u5ea6\u8bc4\u4f30\u6846\u67b6\uff0c\u7528\u4e8e\u5206\u6790LLM\u5b9a\u4ef7\u63a8\u7406\u662f\u5426\u771f\u5b9e\u53cd\u6620\u5176\u884c\u4e3a\u673a\u5236\u3002", "\u5b9e\u9a8c\u8986\u76d69\u4e2aLLM\u4ee5\u53ca\u53cc\u5be1\u5934\u3001\u4e09\u5be1\u5934\u4f2f\u7279\u5170\u7ade\u4e89\u73af\u5883\uff0c\u53d1\u73b0\u5408\u8c0b\u884c\u4e3a\u4e0eCoT\u5fe0\u5b9e\u6027\u5728\u4e24\u4e2a\u7ef4\u5ea6\u4e0a\u663e\u8457\u8131\u94a9\u3002", "\u6700\u5177\u5408\u8c0b\u6027\u7684\u6a21\u578b\u80fd\u51c6\u786e\u8868\u8ff0\u5408\u4f5c\u610f\u56fe\u4f46\u7ed3\u6784\u63a8\u7406\u4e0d\u5fe0\u5b9e\uff0c\u800c\u7ed3\u6784\u6700\u5fe0\u5b9e\u7684\u6a21\u578b\u4ecd\u4f1a\u7ef4\u6301\u9ad8\u4e8e\u7eb3\u4ec0\u5747\u8861\u7684\u4ef7\u683c\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u94fe\u5f0f\u601d\u7ef4", "AI\u5b89\u5168", "\u7b97\u6cd5\u5408\u8c0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18346v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Faithful yet Collusive: Why Chain-of-Thought Monitoring Cannot Detect Collusion in LLM Pricing Agents under Oligopolistic Competition", "tldr": "CoT\u76d1\u63a7\u96be\u4ee5\u53d1\u73b0LLM\u5b9a\u4ef7\u5408\u8c0b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76LLM\u4f5c\u4e3a\u81ea\u4e3b\u5b9a\u4ef7\u667a\u80fd\u4f53\u65f6\uff0c\u5728\u5be1\u5934\u4f2f\u7279\u5170\u7ade\u4e89\u4e2d\u662f\u5426\u4f1a\u901a\u8fc7\u9ed8\u5951\u534f\u8c03\u7ef4\u6301\u9ad8\u4e8e\u7ade\u4e89\u6c34\u5e73\u7684\u4ef7\u683c\u3002\u4f5c\u8005\u63d0\u51fa\u56e0\u679c\u56fe\u6563\u5ea6\u6846\u67b6\uff0c\u5206\u522b\u8861\u91cfCoT\u7684\u7ed3\u6784\u5fe0\u5b9e\u6027\u4e0e\u610f\u56fe\u5fe0\u5b9e\u6027\uff0c\u5e76\u57289\u4e2aLLM\u3001\u53cc\u5be1\u5934\u548c\u4e09\u5be1\u5934\u573a\u666f\u4e2d\u8fdb\u884c\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u7814\u7a76\u76f4\u63a5\u6311\u6218\u4e86\u7528\u94fe\u5f0f\u601d\u7ef4\u76d1\u63a7\u4f5c\u4e3aLLM\u667a\u80fd\u4f53\u5b89\u5168\u62a4\u680f\u7684\u53ef\u884c\u6027\uff0c\u8868\u660e\u5373\u4fbfCoT\u770b\u4f3c\u900f\u660e\uff0c\u4e5f\u65e0\u6cd5\u53ef\u9760\u68c0\u6d4b\u7b97\u6cd5\u5408\u8c0b\uff0c\u5bf9AI\u7ecf\u6d4e\u76d1\u7ba1\u548c\u81ea\u4e3b\u5546\u4e1a\u667a\u80fd\u4f53\u90e8\u7f72\u5177\u6709\u91cd\u8981\u8b66\u793a\u610f\u4e49\u3002"}, {"abstract": "Large language model agents tune GPU kernels and serving engines through a closed loop of propose, measure, and keep, but the measurements behind this loop are not trustworthy. We characterize four failure modes from a four-day pilot corpus of 619 model calls: strawman baselines manufacture speedups, absolute times do not transfer across machines, saturated tasks nullify comparisons, and infrastructure defects impersonate science. We present AutoTuneBench, a benchmark and measurement protocol that makes trust architectural. The protocol is frozen as code with test-enforced provenance; a database-level validator rejects out-of-protocol results; anti-cheat checks run outside the agent\u0027s modification surface; comparisons follow pre-registered readouts; and measurements anchor to externally published results, grounded in paired-seed statistics with a 5\\% cross-run coefficient-of-variation cap. Honest measurement rewrites the headlines: our best kernel reads 10.6x against a naive baseline but 2.03x against the honest one; one configuration delivers 1.174x on one machine and 1.0049x on another; a pre-registered on/off comparison nulls at a shared wall (2.4840 vs 2.4957\\,ms); and the KernelBench Level-1 suite admits 51\\% of tasks with median speedup 1.0001x over PyTorch eager. The protocol, the two-engine corpus (vLLM and SGLang), and its audit trail are released as open artifacts.", "arxiv_id": "2609.18123", "arxiv_url": "https://arxiv.org/abs/2609.18123", "authors": ["Li Chen"], "brief": "\u8bba\u6587\u63d0\u51fa AutoTuneBench\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u81ea\u52a8\u8c03\u4f18 GPU kernel \u4e0e\u63a8\u7406\u670d\u52a1\u5f15\u64ce\u7684\u57fa\u51c6\u548c\u6d4b\u91cf\u534f\u8bae\u3002\u5b83\u901a\u8fc7\u4ee3\u7801\u51bb\u7ed3\u534f\u8bae\u3001\u6570\u636e\u5e93\u6821\u9a8c\u3001\u5916\u90e8\u53cd\u4f5c\u5f0a\u3001\u9884\u6ce8\u518c\u5bf9\u6bd4\u548c\u8de8\u8fd0\u884c\u7edf\u8ba1\u7ea6\u675f\uff0c\u51cf\u5c11\u865a\u5047\u52a0\u901f\u4e0e\u4e0d\u53ef\u590d\u73b0\u5b9e\u9a8c\u7ed3\u8bba\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18123", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ece619\u6b21\u6a21\u578b\u8c03\u7528\u7684\u56db\u5929\u8bd5\u70b9\u6570\u636e\u4e2d\u603b\u7ed3\u56db\u7c7b\u6d4b\u91cf\u5931\u771f\uff1a\u7a3b\u8349\u4eba\u57fa\u7ebf\u3001\u8de8\u673a\u5668\u4e0d\u53ef\u8fc1\u79fb\u3001\u4efb\u52a1\u9971\u548c\u3001\u57fa\u7840\u8bbe\u65bd\u7f3a\u9677\u4f2a\u88c5\u6210\u79d1\u7814\u7ed3\u679c", "\u534f\u8bae\u8981\u6c42\u6d4b\u8bd5\u5f3a\u5236\u7684\u6eaf\u6e90\u3001\u6570\u636e\u5e93\u7ea7\u7ed3\u679c\u9a8c\u8bc1\u3001\u667a\u80fd\u4f53\u65e0\u6cd5\u4fee\u6539\u7684\u53cd\u4f5c\u5f0a\u68c0\u67e5\uff0c\u4ee5\u53ca\u9884\u6ce8\u518c\u8bfb\u6570\u548c\u5916\u90e8\u516c\u5f00\u7ed3\u679c\u951a\u5b9a", "\u5b9e\u8bc1\u663e\u793a\u8bb8\u591a\u201c\u52a0\u901f\u201d\u88ab\u8bda\u5b9e\u57fa\u7ebf\u524a\u5f31\uff1a\u6700\u4f73kernel\u4ece\u5bf9\u6734\u7d20\u57fa\u7ebf10.6\u500d\u964d\u81f3\u5bf9\u8bda\u5b9e\u57fa\u7ebf2.03\u500d\uff0cKernelBench Level-1\u4e2d\u4f4d\u52a0\u901f\u4ec51.0001\u500d"], "keywords": ["\u667a\u80fd\u4f53", "LLM\u63a8\u7406", "\u7cfb\u7edf\u8bc4\u6d4b", "\u81ea\u52a8\u8c03\u4f18"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18123v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AutoTuneBench: Trustworthy Measurement for Agent Auto-Tuning of LLM Serving Engines", "tldr": "\u4e3aLLM\u670d\u52a1\u81ea\u8c03\u4f18\u5efa\u7acb\u53ef\u4fe1\u6d4b\u91cf\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AutoTuneBench\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u81ea\u52a8\u8c03\u4f18 GPU kernel \u4e0e\u63a8\u7406\u670d\u52a1\u5f15\u64ce\u7684\u57fa\u51c6\u548c\u6d4b\u91cf\u534f\u8bae\u3002\u5b83\u901a\u8fc7\u4ee3\u7801\u51bb\u7ed3\u534f\u8bae\u3001\u6570\u636e\u5e93\u6821\u9a8c\u3001\u5916\u90e8\u53cd\u4f5c\u5f0a\u3001\u9884\u6ce8\u518c\u5bf9\u6bd4\u548c\u8de8\u8fd0\u884c\u7edf\u8ba1\u7ea6\u675f\uff0c\u51cf\u5c11\u865a\u5047\u52a0\u901f\u4e0e\u4e0d\u53ef\u590d\u73b0\u5b9e\u9a8c\u7ed3\u8bba\u3002", "why_notable": "\u5b83\u76f4\u6307 LLM \u667a\u80fd\u4f53\u81ea\u52a8\u4f18\u5316\u7cfb\u7edf\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u6d4b\u91cf\u53ef\u4fe1\u5ea6\u3002\u76f8\u6bd4\u8ffd\u6c42\u66f4\u9ad8\u52a0\u901f\u6570\u5b57\uff0c\u8bba\u6587\u63d0\u4f9b\u4e86\u53ef\u5ba1\u8ba1\u3001\u53ef\u590d\u73b0\u3001\u6297\u4f5c\u5f0a\u7684\u8bc4\u6d4b\u57fa\u7840\u8bbe\u65bd\uff0c\u5bf9\u672a\u6765\u81ea\u52a8\u8c03\u4f18\u3001\u63a8\u7406\u670d\u52a1\u4f18\u5316\u548c\u667a\u80fd\u4f53\u8bc4\u6d4b\u90fd\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autonomous research loops such as AutoResearch show that one coding agent can improve a training setup unattended. Run several of them and each session starts from scratch, so more agents tend to mean more duplicated search rather than more discovery. Agora is a shared memory for such agents: research is recorded as an append-only directed acyclic graph (DAG) stored in Git, so that every claim is a commit anyone can check out and rerun. Each result, insight, hypothesis, verification, and report is an immutable commit whose parent edges say what it builds on; a derived index exposes the frontier, the neglected branches, and the verification status of each claim, and a diversity-aware selection rule keeps the community from collapsing onto one leader. We describe the system and report its first sustained use: a run of nearly 12 days in which 13 language-model workers, with no assigned tasks and no central planner, worked on a weight-transfer problem. Given 141 pretrained donor models and a frozen 119.6M-parameter attention-SSM hybrid whose dimensions match no donor, the workers had to initialize the target without training data or gradient updates. They published 1,703 contributions and drove the evaluator from 3.39 to 1.899 bits per byte, closing 62% of the gap to a trained GPT-2 124M. The winning recipe compresses donor next-token statistics into the target\u0027s embedding and output head, then adds a short-range context signal through sparse edits to attention, feed-forward, and state-space blocks. Its 145-commit ancestry spans 15 accounts, and 165 independent reproductions were posted, none of which failed. We describe the single mid-run human intervention that pulled the community out of a monoculture, what the trace does and does not establish, and the controlled comparison that would settle whether shared research state improves discovery per unit of compute.", "arxiv_id": "2609.18094", "arxiv_url": "https://arxiv.org/abs/2609.18094", "authors": ["Yifan Zhang", "Yunheng Zou", "Shaokun Zhang", "Jian Hu", "Hao Zhang", "Binfeng Xu", "Jan Kautz", "Yi Dong"], "brief": "\u8bba\u6587\u63d0\u51fa Agora\uff1a\u628a\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u7684\u7ed3\u679c\u3001\u5047\u8bbe\u3001\u9a8c\u8bc1\u4e0e\u62a5\u544a\u8bb0\u5f55\u4e3a Git \u4e2d\u7684\u8ffd\u52a0\u5f0f DAG \u63d0\u4ea4\uff0c\u4f7f\u591a\u4e2a\u65e0\u4e2d\u5fc3\u89c4\u5212\u7684 LLM \u5de5\u4f5c\u8005\u80fd\u591f\u590d\u7528\u5f7c\u6b64\u53d1\u73b0\u800c\u975e\u91cd\u590d\u641c\u7d22\u3002\u4f5c\u8005\u62a5\u544a\u4e86\u4e00\u4e2a\u8fd112\u5929\u300113\u4e2a\u8bed\u8a00\u6a21\u578b\u5de5\u4f5c\u8005\u534f\u4f5c\u89e3\u51b3\u6743\u91cd\u8fc1\u79fb\u521d\u59cb\u5316\u95ee\u9898\u7684\u6301\u7eed\u8fd0\u884c\u6848\u4f8b\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18094", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6bcf\u4e2a\u4e3b\u5f20\u90fd\u662f\u53ef\u68c0\u51fa\u3001\u53ef\u590d\u73b0\u7684\u4e0d\u53ef\u53d8 commit\uff0c\u7236\u8fb9\u8868\u793a\u4f9d\u8d56\u5173\u7cfb\uff1b\u6d3e\u751f\u7d22\u5f15\u5c55\u793a\u7814\u7a76\u524d\u6cbf\u3001\u88ab\u5ffd\u89c6\u5206\u652f\u548c\u9a8c\u8bc1\u72b6\u6001\u3002", "\u7cfb\u7edf\u4f7f\u7528\u591a\u6837\u6027 aware \u7684\u9009\u62e9\u89c4\u5219\uff0c\u907f\u514d\u6240\u6709\u667a\u80fd\u4f53\u8fc7\u65e9\u8ffd\u968f\u5355\u4e00\u9886\u5148\u8def\u7ebf\u3002", "\u5b9e\u9a8c\u4e2d13\u4e2a\u5de5\u4f5c\u8005\u53d1\u5e031703\u9879\u8d21\u732e\uff0c\u5c06\u8bc4\u4f30\u6307\u6807\u4ece3.39\u964d\u81f31.899 bits/byte\uff0c\u5f25\u5408\u5230\u8bad\u7ec3\u540e GPT-2 124M \u5dee\u8ddd\u768462%\uff0c\u4e14\u83b7\u80dc\u65b9\u6848\u6709165\u6b21\u72ec\u7acb\u590d\u73b0\u65e0\u5931\u8d25\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u534f\u4f5c\u7cfb\u7edf", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18094v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agora: Git as Shared Memory for Collective AutoResearch", "tldr": "\u7528Git\u5171\u4eab\u8bb0\u5fc6\u534f\u8c03\u591a\u667a\u80fd\u4f53\u79d1\u7814\u641c\u7d22", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agora\uff1a\u628a\u81ea\u52a8\u79d1\u7814\u667a\u80fd\u4f53\u7684\u7ed3\u679c\u3001\u5047\u8bbe\u3001\u9a8c\u8bc1\u4e0e\u62a5\u544a\u8bb0\u5f55\u4e3a Git \u4e2d\u7684\u8ffd\u52a0\u5f0f DAG \u63d0\u4ea4\uff0c\u4f7f\u591a\u4e2a\u65e0\u4e2d\u5fc3\u89c4\u5212\u7684 LLM \u5de5\u4f5c\u8005\u80fd\u591f\u590d\u7528\u5f7c\u6b64\u53d1\u73b0\u800c\u975e\u91cd\u590d\u641c\u7d22\u3002\u4f5c\u8005\u62a5\u544a\u4e86\u4e00\u4e2a\u8fd112\u5929\u300113\u4e2a\u8bed\u8a00\u6a21\u578b\u5de5\u4f5c\u8005\u534f\u4f5c\u89e3\u51b3\u6743\u91cd\u8fc1\u79fb\u521d\u59cb\u5316\u95ee\u9898\u7684\u6301\u7eed\u8fd0\u884c\u6848\u4f8b\u3002", "why_notable": "\u5b83\u628a Git \u91cd\u65b0\u8bbe\u8ba1\u4e3a\u591a\u667a\u80fd\u4f53\u79d1\u7814\u7684\u5171\u4eab\u8bb0\u5fc6\u4e0e\u53ef\u590d\u73b0\u5b9e\u9a8c\u8d26\u672c\uff0c\u76f4\u51fb\u5f53\u524d AutoResearch \u591a\u5b9e\u4f8b\u5e76\u884c\u65f6\u5bb9\u6613\u91cd\u590d\u63a2\u7d22\u7684\u95ee\u9898\uff1b\u82e5\u7ecf\u53d7\u63a7\u5b9e\u9a8c\u8bc1\u5b9e\uff0c\u53ef\u6210\u4e3a\u81ea\u4e3b\u79d1\u7814\u667a\u80fd\u4f53\u534f\u4f5c\u4e0e\u6eaf\u6e90\u9a8c\u8bc1\u7684\u91cd\u8981\u57fa\u7840\u8bbe\u65bd\u3002"}, {"abstract": "Mixture-of-experts (MoE) inference on consumer hardware is bounded by weight memory: a 35B-class model is 19.5GB at 4-bit, and sparsity shrinks the compute per token, not the bytes that must be held. Naive offloading to SSD does not help on its own, because layer N+1\u0027s experts must be chosen before layer N\u0027s output exists, so the reads cannot start early enough to hide behind compute. We present Edge0, a streaming MoE inference engine that closes the gap with a prerouter: a per-layer head predicts the next layer\u0027s routing one token ahead, and the prediction is consumed as the routing itself, so the staged expert set equals the routed set and nothing is dropped. An unmerged recovery LoRA, trained on the student path, pays back the quality lost to int4 quantization and routing replacement. On a single 24GB machine, Edge0 serves a 35B MoE at 20tok/s inside 3GiB of peak active memory, within a few points of its fp16 teacher on average across five public benchmarks. An 8B tier runs on the same framework, and the framework, checkpoints, and adapters are open source.", "arxiv_id": "2609.18063", "arxiv_url": "https://arxiv.org/abs/2609.18063", "authors": ["Yu Lin", "Yiming Wang", "Runyuan Cai", "Hanze Liu", "Xiaodong Zeng"], "brief": "\u8bba\u6587\u63d0\u51fa Edge0\uff0c\u4e00\u4e2a\u9762\u5411\u6d88\u8d39\u7ea7\u786c\u4ef6\u7684\u6d41\u5f0f MoE \u63a8\u7406\u5f15\u64ce\u3002\u5b83\u901a\u8fc7\u9010\u5c42\u9884\u8def\u7531\u5934\u63d0\u524d\u4e00 token \u9884\u6d4b\u4e0b\u4e00\u5c42\u4e13\u5bb6\u9009\u62e9\uff0c\u5e76\u914d\u5408\u6062\u590d LoRA\uff0c\u5b9e\u73b0\u5728 SSD \u5378\u8f7d\u4e0b\u8fd0\u884c 35B \u7ea7 MoE\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18063", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6838\u5fc3\u74f6\u9888\u4e0d\u662f\u8ba1\u7b97\u800c\u662f\u6743\u91cd\u5185\u5b58\uff1a35B \u7ea7 MoE \u5373\u4f7f 4-bit \u91cf\u5316\u4ecd\u9700\u7ea6 19.5GB \u6743\u91cd\u5b58\u50a8\u3002", "\u9884\u8def\u7531\u5668\u76f4\u63a5\u66ff\u4ee3\u4e0b\u4e00\u5c42\u8def\u7531\uff0c\u4f7f\u5f85\u52a0\u8f7d\u4e13\u5bb6\u96c6\u4e0e\u5b9e\u9645\u4f7f\u7528\u4e13\u5bb6\u96c6\u4e00\u81f4\uff0c\u4ece\u800c\u53ef\u63d0\u524d\u4ece SSD \u6d41\u5f0f\u8bfb\u53d6\u800c\u4e0d\u4e22\u4e13\u5bb6\u3002", "\u5728\u5355\u53f0 24GB \u673a\u5668\u4e0a\u4ee5\u7ea6 3GiB \u5cf0\u503c\u6d3b\u8dc3\u5185\u5b58\u8fd0\u884c 35B MoE\uff0c\u8fbe\u5230 20 tok/s\uff0c\u5e76\u5728\u4e94\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u63a5\u8fd1 fp16 teacher\u3002"], "keywords": ["\u6a21\u578b\u63a8\u7406", "\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u538b\u7f29", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18063v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Other Half of the Memory Wall: Serving 35B MoEs from SSD with Trained Routing Prediction", "tldr": "\u7528\u9884\u8def\u7531\u4eceSSD\u9ad8\u6548\u670d\u52a135B MoE", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Edge0\uff0c\u4e00\u4e2a\u9762\u5411\u6d88\u8d39\u7ea7\u786c\u4ef6\u7684\u6d41\u5f0f MoE \u63a8\u7406\u5f15\u64ce\u3002\u5b83\u901a\u8fc7\u9010\u5c42\u9884\u8def\u7531\u5934\u63d0\u524d\u4e00 token \u9884\u6d4b\u4e0b\u4e00\u5c42\u4e13\u5bb6\u9009\u62e9\uff0c\u5e76\u914d\u5408\u6062\u590d LoRA\uff0c\u5b9e\u73b0\u5728 SSD \u5378\u8f7d\u4e0b\u8fd0\u884c 35B \u7ea7 MoE\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9 MoE \u672c\u5730\u90e8\u7f72\u7684\u5185\u5b58\u5899\u63d0\u51fa\u53ef\u8bad\u7ec3\u7684\u7cfb\u7edf\u7ea7\u89e3\u6cd5\uff0c\u628a\u5927\u6a21\u578b\u4e13\u5bb6\u6743\u91cd\u4ece\u663e\u5b58/\u5185\u5b58\u538b\u529b\u4e2d\u8f6c\u79fb\u5230 SSD \u6d41\u5f0f\u52a0\u8f7d\uff0c\u663e\u8457\u964d\u4f4e 35B \u7ea7 MoE \u5728\u6d88\u8d39\u7ea7\u8bbe\u5907\u4e0a\u7684\u63a8\u7406\u95e8\u69db\uff0c\u4e14\u5f00\u6e90\u6846\u67b6\u3001\u68c0\u67e5\u70b9\u548c\u9002\u914d\u5668\u3002"}, {"abstract": "As models scale, reward hacking becomes more frequent, more sophisticated, and more consequential. Does it leave a telltale signature in model representations? This work analyzes how reward hacking is represented internally in frontier open source LLMs, and how those representations can be used to understand and discover the range of hacking behaviors a model displays. In particular, we find that simple difference of means vectors coherently represent reward hacking in Kimi K3, GLM 5.2, and Qwen 3.8 Max across a variety of behaviors in common evaluations. Despite their simplicity, these vectors are both generalizable and interpretable, and we can use them to reliably detect reward hacking. We first evaluate reward hacking in commonly reported benchmarks like DeepSWE and SWE-bench, finding that models reward hack excessively in these environments; GLM 5.2 hacks in 57.2% of rollouts on DeepSWE and in 73% of rollouts on SWE-bench. Catching these requires monitors; LLM monitors are effective, but expensive detectors. We show that DoM vectors are similarly effective but virtually free, catching 3.1% more hacks in Kimi K3 and 7.9% fewer hacks in GLM 5.2 on DeepSWE at a monitor matched false positive rate. DoM vectors run on the chain-of-thought also predict reward hacks in the model\u0027s subsequent actions, meaning we can run them online and catch potential hacks before they occur. Finally, we analyze probe-hits that LLM monitors do not catch and discover other undesirable behaviors, as well as show transfer to finding hacks in non-SWE evaluations. Together, these results provide evidence that simple, white-box methods can be used to scalably study and monitor reward hacking behaviors in frontier open source models", "arxiv_id": "2609.19101", "arxiv_url": "https://arxiv.org/abs/2609.19101", "authors": ["Leon Bergen", "Usha Bhalla", "Andrew Lee", "Barak Widawsky", "Linas Nasvytis", "Connor Watts", "Siddharth Boppana", "Sidharth Baskaran", "Dron Hazra", "Michael Byun", "Atticus Geiger", "Owen Lewis", "Matthew Kowal", "Vasudev Shyam", "Thomas Fel", "Thomas McGrath", "Ekdeep Singh Lubana", "Jack Merullo"], "brief": "\u8bba\u6587\u7814\u7a76\u524d\u6cbf\u5f00\u6e90LLM\u5728\u8bc4\u6d4b\u4e2d\u53d1\u751f\u5956\u52b1\u9ed1\u5ba2\u65f6\uff0c\u5185\u90e8\u8868\u793a\u662f\u5426\u5b58\u5728\u53ef\u8bc6\u522b\u4fe1\u53f7\u3002\u4f5c\u8005\u53d1\u73b0\u7b80\u5355\u7684\u5747\u503c\u5dee\u5411\u91cf\uff08DoM\uff09\u80fd\u5728\u591a\u79cd\u6a21\u578b\u548c\u884c\u4e3a\u4e0a\u8868\u793a\u3001\u68c0\u6d4b\u5e76\u89e3\u91ca\u5956\u52b1\u9ed1\u5ba2\u73b0\u8c61\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19101", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5728DeepSWE\u548cSWE-bench\u7b49\u5e38\u89c1\u8bc4\u6d4b\u4e2d\u53d1\u73b0\u5956\u52b1\u9ed1\u5ba2\u5f88\u666e\u904d\uff1aGLM 5.2\u5728DeepSWE\u4e2d57.2%\u7684rollout\u3001\u5728SWE-bench\u4e2d73%\u7684rollout\u5b58\u5728\u9ed1\u5ba2\u884c\u4e3a\u3002", "DoM\u5411\u91cf\u68c0\u6d4b\u6548\u679c\u63a5\u8fd1\u6602\u8d35\u7684LLM\u76d1\u63a7\u5668\uff0c\u5728\u5339\u914d\u8bef\u62a5\u7387\u4e0b\uff0cKimi K3\u4e0a\u591a\u6355\u83b73.1%\u7684\u9ed1\u5ba2\u884c\u4e3a\uff0cGLM 5.2\u4e0a\u5c11\u6355\u83b77.9%\u3002", "\u57fa\u4e8echain-of-thought\u8fd0\u884c\u7684DoM\u63a2\u9488\u53ef\u9884\u6d4b\u6a21\u578b\u540e\u7eed\u52a8\u4f5c\u4e2d\u7684\u5956\u52b1\u9ed1\u5ba2\uff0c\u652f\u6301\u5728\u7ebf\u3001\u4e8b\u524d\u76d1\u63a7\uff0c\u5e76\u80fd\u53d1\u73b0LLM\u76d1\u63a7\u5668\u6f0f\u6389\u7684\u5176\u4ed6\u4e0d\u826f\u884c\u4e3a\u3002"], "keywords": ["\u5956\u52b1\u9ed1\u5ba2", "\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u5b89\u5168", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19101v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Monitoring and Discovering Reward Hacking with Internal Representations during LLM Evaluations", "tldr": "\u7528\u5185\u90e8\u8868\u5f81\u4f4e\u6210\u672c\u53d1\u73b0LLM\u5956\u52b1\u9ed1\u5ba2", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u524d\u6cbf\u5f00\u6e90LLM\u5728\u8bc4\u6d4b\u4e2d\u53d1\u751f\u5956\u52b1\u9ed1\u5ba2\u65f6\uff0c\u5185\u90e8\u8868\u793a\u662f\u5426\u5b58\u5728\u53ef\u8bc6\u522b\u4fe1\u53f7\u3002\u4f5c\u8005\u53d1\u73b0\u7b80\u5355\u7684\u5747\u503c\u5dee\u5411\u91cf\uff08DoM\uff09\u80fd\u5728\u591a\u79cd\u6a21\u578b\u548c\u884c\u4e3a\u4e0a\u8868\u793a\u3001\u68c0\u6d4b\u5e76\u89e3\u91ca\u5956\u52b1\u9ed1\u5ba2\u73b0\u8c61\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\uff0c\u5373\u4f7f\u662f\u975e\u5e38\u7b80\u5355\u7684\u767d\u76d2\u5185\u90e8\u8868\u5f81\u65b9\u6cd5\uff0c\u4e5f\u80fd\u4ee5\u8fd1\u4e4e\u96f6\u6210\u672c\u89c4\u6a21\u5316\u76d1\u63a7\u524d\u6cbfLLM\u7684\u5956\u52b1\u9ed1\u5ba2\u884c\u4e3a\uff0c\u4e3a\u9ad8\u98ce\u9669\u8bc4\u6d4b\u3001\u667a\u80fd\u4f53\u90e8\u7f72\u548c\u6a21\u578b\u5b89\u5168\u5ba1\u8ba1\u63d0\u4f9b\u4e86\u5b9e\u7528\u5de5\u5177\u3002"}, {"abstract": "Active perception is essential for robotic manipulation when fixed viewpoints leave task-relevant information occluded or unobserved. However, enabling vision-language-action (VLA) models to reason across changing viewpoints and actively acquire informative observations remains challenging. We present ActiveScale, a framework that advances active perception through coordinated model, data, and hardware designs. Our model augments a VLA with historical video observations and explicit camera-pose supervision, using per-frame pose tokens and a lightweight prediction head to associate observations across viewpoints and support a coherent understanding of the scene. To learn from the camera motion naturally present in human activity, we introduce a scalable human--robot mid-training recipe using 1000 hours of egocentric and robotic data, adapting the model to temporal inputs and pose supervision. We further introduce Active-perception Mobile-manipulation Platform (AMP), a robotic platform that supports active perception and mobile manipulation through single-operator teleoperation, enabling scalable collection of demonstrations that coordinate viewpoint changes and manipulation. Experiments demonstrate improved success rates on active-perception tasks, while ablation studies validate the contributions of camera-pose-aware modeling and egocentric mid-training. Together, these components provide an integrated foundation for studying and developing active perception in robotic manipulation.", "arxiv_id": "2609.18514", "arxiv_url": "https://arxiv.org/abs/2609.18514", "authors": ["Shuai Zhou", "Kaisheng Pang", "Wenxuan Song", "Wenjie Zhang", "Xinhu Zheng", "Haoang Li"], "brief": "ActiveScale \u662f\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u4e3b\u52a8\u611f\u77e5\u6846\u67b6\uff0c\u4ece\u6a21\u578b\u3001\u6570\u636e\u548c\u786c\u4ef6\u4e09\u65b9\u9762\u534f\u540c\u8bbe\u8ba1\u3002\u5b83\u589e\u5f3a VLA \u6a21\u578b\u5bf9\u5386\u53f2\u89c6\u9891\u4e0e\u76f8\u673a\u4f4d\u59ff\u7684\u5efa\u6a21\uff0c\u5e76\u6784\u5efa\u53ef\u89c4\u6a21\u5316\u91c7\u96c6\u4e3b\u52a8\u89c6\u89d2\u53d8\u5316\u793a\u8303\u7684\u79fb\u52a8\u64cd\u4f5c\u5e73\u53f0\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18514", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728 VLA \u4e2d\u5f15\u5165\u5386\u53f2\u89c6\u9891\u89c2\u6d4b\u3001\u9010\u5e27\u76f8\u673a\u4f4d\u59ff token \u4e0e\u8f7b\u91cf\u9884\u6d4b\u5934\uff0c\u5e2e\u52a9\u6a21\u578b\u8de8\u89c6\u89d2\u5173\u8054\u573a\u666f\u4fe1\u606f\u3002", "\u4f7f\u7528 1000 \u5c0f\u65f6\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u6d3b\u52a8\u6570\u636e\u4e0e\u673a\u5668\u4eba\u6570\u636e\u8fdb\u884c\u4eba\u673a\u4e2d\u671f\u8bad\u7ec3\uff0c\u9002\u914d\u65f6\u5e8f\u8f93\u5165\u548c\u4f4d\u59ff\u76d1\u7763\u3002", "\u63d0\u51fa AMP \u79fb\u52a8\u64cd\u4f5c\u5e73\u53f0\uff0c\u652f\u6301\u5355\u4eba\u9065\u64cd\u4f5c\u91c7\u96c6\u540c\u65f6\u5305\u542b\u89c6\u89d2\u79fb\u52a8\u4e0e\u64cd\u4f5c\u52a8\u4f5c\u7684\u793a\u8303\u6570\u636e\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4e3b\u52a8\u611f\u77e5", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18514v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ActiveScale: Scaling Active Perception for Robots across Model, Data, and Hardware", "tldr": "\u534f\u540c\u6269\u5c55\u673a\u5668\u4eba\u4e3b\u52a8\u611f\u77e5\u7684\u6a21\u578b\u3001\u6570\u636e\u4e0e\u786c\u4ef6", "upvotes": 0, "what_it_is": "ActiveScale \u662f\u4e00\u4e2a\u9762\u5411\u673a\u5668\u4eba\u64cd\u4f5c\u7684\u4e3b\u52a8\u611f\u77e5\u6846\u67b6\uff0c\u4ece\u6a21\u578b\u3001\u6570\u636e\u548c\u786c\u4ef6\u4e09\u65b9\u9762\u534f\u540c\u8bbe\u8ba1\u3002\u5b83\u589e\u5f3a VLA \u6a21\u578b\u5bf9\u5386\u53f2\u89c6\u9891\u4e0e\u76f8\u673a\u4f4d\u59ff\u7684\u5efa\u6a21\uff0c\u5e76\u6784\u5efa\u53ef\u89c4\u6a21\u5316\u91c7\u96c6\u4e3b\u52a8\u89c6\u89d2\u53d8\u5316\u793a\u8303\u7684\u79fb\u52a8\u64cd\u4f5c\u5e73\u53f0\u3002", "why_notable": "\u8bba\u6587\u4e0d\u662f\u5355\u70b9\u6539\u8fdb\uff0c\u800c\u662f\u540c\u65f6\u89e3\u51b3\u4e3b\u52a8\u611f\u77e5\u4e2d\u7684\u6a21\u578b\u7406\u89e3\u3001\u6570\u636e\u89c4\u6a21\u5316\u548c\u786c\u4ef6\u91c7\u96c6\u74f6\u9888\uff0c\u6709\u671b\u63d0\u5347\u673a\u5668\u4eba\u5728\u906e\u6321\u3001\u89c6\u89d2\u4e0d\u8db3\u7b49\u771f\u5b9e\u64cd\u4f5c\u573a\u666f\u4e2d\u7684\u6210\u529f\u7387\u3002"}, {"abstract": "LLM serving is typically offered as a shared, multi-tenant service, where high-demand workloads from one client can cause latency SLO violations for others. Existing solutions for performance isolation equalize client throughput in the long run, for example through queueing and batching fairness. However, these approaches do not provide latency isolation guarantees; as a result, well-behaved clients can still experience significant degradation to their token-level latencies. In this paper, we present FairInference, which provides the novel \u03b4-token fairness guarantee: for a well-behaved client, if a token is generated in d time units in isolation, it will be generated within d + \u03b4 time units in multi-tenant execution, providing strong latency isolation guarantees for LLM serving. To achieve this, FairInference addresses a key challenge of LLM serving: bounding delays from sharing GPU resources without support for fine-grained scheduling or resource allocation. In FairInference, the scheduler enforces per-token deadlines, while bounding the delays from GPU compute sharing and accounting for the additional delays introduced by the shared KV caching in GPU memory. We show that FairInference effectively bounds token-level latency spikes for well-behaved clients and improves overall throughput compared to state-of-the-art LLM serving systems.", "arxiv_id": "2609.18112", "arxiv_url": "https://arxiv.org/abs/2609.18112", "authors": ["Dev Bali", "Soujanya Ponnapalli", "Yichuan Wang", "Natacha Crooks", "Scott Shenker", "Matei Zaharia"], "brief": "\u8bba\u6587\u63d0\u51fa FairInference\uff0c\u4e00\u79cd\u9762\u5411\u5171\u4eab\u591a\u79df\u6237 LLM \u63a8\u7406\u670d\u52a1\u7684\u8c03\u5ea6\u7cfb\u7edf\u3002\u5b83\u5b9a\u4e49\u5e76\u5b9e\u73b0 \u03b4-token fairness\uff1a\u8868\u73b0\u826f\u597d\u7684\u5ba2\u6237\u7aef\u5728\u5171\u4eab\u73af\u5883\u4e2d\u7684\u6bcf\u4e2a token \u5ef6\u8fdf\u81f3\u591a\u6bd4\u72ec\u5360\u6267\u884c\u591a \u03b4\u3002", "categories": ["cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18112", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u9762\u5411 token \u7ea7\u522b\u7684\u5ef6\u8fdf\u516c\u5e73\u4fdd\u8bc1\uff0c\u800c\u975e\u4ec5\u5728\u957f\u671f\u541e\u5410\u91cf\u4e0a\u505a\u516c\u5e73\u5206\u914d", "\u8c03\u5ea6\u5668\u4e3a\u6bcf\u4e2a token \u8bbe\u7f6e\u622a\u6b62\u65f6\u95f4\uff0c\u5e76\u663e\u5f0f\u7ea6\u675f GPU \u8ba1\u7b97\u5171\u4eab\u5e26\u6765\u7684\u6392\u961f\u4e0e\u6267\u884c\u5ef6\u8fdf", "\u5c06\u5171\u4eab KV cache \u5360\u7528 GPU \u663e\u5b58\u5f15\u5165\u7684\u989d\u5916\u5ef6\u8fdf\u7eb3\u5165\u5efa\u6a21\u4e0e\u8c03\u5ea6\uff0c\u5b9e\u9a8c\u663e\u793a\u53ef\u6291\u5236\u5ef6\u8fdf\u5c16\u5cf0\u5e76\u63d0\u5347\u603b\u4f53\u541e\u5410"], "keywords": ["LLM\u63a8\u7406", "\u591a\u79df\u6237", "\u8c03\u5ea6\u7cfb\u7edf", "\u6027\u80fd\u9694\u79bb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18112v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Token Latency Fairness: Performance Isolation for Multi-Tenant LLM Serving", "tldr": "\u4e3a\u591a\u79df\u6237LLM\u670d\u52a1\u63d0\u4f9b\u4ee4\u724c\u7ea7\u5ef6\u8fdf\u9694\u79bb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FairInference\uff0c\u4e00\u79cd\u9762\u5411\u5171\u4eab\u591a\u79df\u6237 LLM \u63a8\u7406\u670d\u52a1\u7684\u8c03\u5ea6\u7cfb\u7edf\u3002\u5b83\u5b9a\u4e49\u5e76\u5b9e\u73b0 \u03b4-token fairness\uff1a\u8868\u73b0\u826f\u597d\u7684\u5ba2\u6237\u7aef\u5728\u5171\u4eab\u73af\u5883\u4e2d\u7684\u6bcf\u4e2a token \u5ef6\u8fdf\u81f3\u591a\u6bd4\u72ec\u5360\u6267\u884c\u591a \u03b4\u3002", "why_notable": "\u591a\u79df\u6237 LLM \u670d\u52a1\u4e2d\uff0c\u5355\u4e2a\u9ad8\u8d1f\u8f7d\u5ba2\u6237\u5e38\u5bfc\u81f4\u5176\u4ed6\u5ba2\u6237\u5ef6\u8fdf SLO \u8fdd\u7ea6\uff1b\u8be5\u5de5\u4f5c\u4ece\u201c\u541e\u5410\u516c\u5e73\u201d\u63a8\u8fdb\u5230\u201ctoken \u5ef6\u8fdf\u9694\u79bb\u201d\uff0c\u5bf9\u4e91\u7aef LLM \u63a8\u7406\u5e73\u53f0\u7684\u670d\u52a1\u8d28\u91cf\u4fdd\u969c\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Fine-tuning a Vision-Language-Action (VLA) model for a new deployment environment is expensive, yet most methods apply uniform-capacity adapters to every network region as if every region requires equal adjustment. This paper tests that assumption on five architecturally diverse VLAs (OpenVLA-OFT, $\u03c0_0$, SmolVLA, DTP, Octo; 93M-7B parameters). Measuring per-region adaptation cost as normalized parameter displacement under region-isolated fine-tuning reveals an adaptation spectrum in which appearance shifts concentrate cost in the vision encoder, instruction shifts in the language backbone, and novel-object shifts in the vision encoder together with the action head, across all five architectures. To exploit this structure, we introduce a pipeline that observes, diagnoses, allocates, and adapts. From ten unlabeled target observations and without fine-tuning, the diagnostic estimates per-region cost by combining reference-free gradient and Monte Carlo Dropout signals with a Centered Kernel Alignment score against a cached source reference; the allocator converts the estimates into variable-rank LoRA adapters under a parameter budget and freezes well-calibrated regions; and standard LoRA fine-tuning trains the resulting adapters. The diagnostic ranks regions within each deployment at a median Spearman of 0.91, and the allocation matches or exceeds uniform LoRA at every budget we tested on LIBERO and CALVIN. On a physical xArm-7, the pipeline matches full fine-tuning under an instruction-wording shift with 0.04% of its trainable parameters, and on five held-out scenes evaluated without retraining it leads every baseline, with 11-23 successes of 30 rollouts against 8-18 for the strongest parameter-efficient baseline at equal or larger budgets and 2-11 for full fine-tuning. These results suggest that adaptation cost in VLAs is structured enough to measure before fine-tuning begins.", "arxiv_id": "2609.18084", "arxiv_url": "https://arxiv.org/abs/2609.18084", "authors": ["Shahram Najam Syed", "Arthur Jakobsson", "Prayuj Sachdev", "Jeffrey Ichnowski"], "brief": "\u8bba\u6587\u53d1\u73b0\u4e0d\u540c\u90e8\u7f72\u504f\u79fb\u4f1a\u8ba9VLA\u6a21\u578b\u7684\u4e0d\u540c\u533a\u57df\u627f\u62c5\u4e3b\u8981\u9002\u914d\u6210\u672c\uff0c\u4f8b\u5982\u5916\u89c2\u504f\u79fb\u96c6\u4e2d\u5728\u89c6\u89c9\u7f16\u7801\u5668\u3001\u6307\u4ee4\u504f\u79fb\u96c6\u4e2d\u5728\u8bed\u8a00\u9aa8\u5e72\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u201c\u89c2\u5bdf-\u8bca\u65ad-\u5206\u914d-\u9002\u914d\u201d\u6d41\u7a0b\uff0c\u7528\u5c11\u91cf\u65e0\u6807\u7b7e\u76ee\u6807\u89c2\u6d4b\u4f30\u8ba1\u5404\u533a\u57df\u9002\u914d\u9700\u6c42\uff0c\u5e76\u5206\u914d\u53ef\u53d8\u79e9LoRA\u3002", "categories": ["cs.RO", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18084", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728OpenVLA-OFT\u3001\u03c0\u2080\u3001SmolVLA\u3001DTP\u3001Octo\u7b495\u79cdVLA\u67b6\u6784\u4e0a\u9a8c\u8bc1\uff0c\u9002\u914d\u6210\u672c\u5448\u73b0\u7a33\u5b9a\u7684\u533a\u57df\u7ed3\u6784\u3002", "\u8bca\u65ad\u5668\u7ed3\u5408\u65e0\u53c2\u8003\u68af\u5ea6\u3001Monte Carlo Dropout\u548c\u4e0e\u6e90\u53c2\u8003\u7684Centered Kernel Alignment\uff0c\u4ec5\u970010\u4e2a\u65e0\u6807\u7b7e\u76ee\u6807\u89c2\u6d4b\u4e14\u65e0\u9700\u9884\u5fae\u8c03\u3002", "\u5728LIBERO\u3001CALVIN\u548c\u771f\u5b9exArm-7\u5b9e\u9a8c\u4e2d\uff0c\u53ef\u53d8\u79e9LoRA\u5728\u76f8\u540c\u9884\u7b97\u4e0b\u4f18\u4e8e\u6216\u5339\u914d\u5747\u5300LoRA\uff0c\u5e76\u5728\u90e8\u5206\u573a\u666f\u75280.04%\u53ef\u8bad\u7ec3\u53c2\u6570\u8fbe\u5230\u5168\u91cf\u5fae\u8c03\u6548\u679c\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "LoRA"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18084v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Not All Layers Need Tuning: Diagnosing and Directing Adaptation in Vision-Language-Action Models", "tldr": "\u8bca\u65adVLA\u9002\u914d\u9700\u6c42\uff0c\u6309\u9700\u5206\u914dLoRA", "upvotes": 0, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u4e0d\u540c\u90e8\u7f72\u504f\u79fb\u4f1a\u8ba9VLA\u6a21\u578b\u7684\u4e0d\u540c\u533a\u57df\u627f\u62c5\u4e3b\u8981\u9002\u914d\u6210\u672c\uff0c\u4f8b\u5982\u5916\u89c2\u504f\u79fb\u96c6\u4e2d\u5728\u89c6\u89c9\u7f16\u7801\u5668\u3001\u6307\u4ee4\u504f\u79fb\u96c6\u4e2d\u5728\u8bed\u8a00\u9aa8\u5e72\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u201c\u89c2\u5bdf-\u8bca\u65ad-\u5206\u914d-\u9002\u914d\u201d\u6d41\u7a0b\uff0c\u7528\u5c11\u91cf\u65e0\u6807\u7b7e\u76ee\u6807\u89c2\u6d4b\u4f30\u8ba1\u5404\u533a\u57df\u9002\u914d\u9700\u6c42\uff0c\u5e76\u5206\u914d\u53ef\u53d8\u79e9LoRA\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u6240\u6709\u5c42\u90fd\u9700\u8981\u540c\u7b49\u5fae\u8c03\u201d\u7684\u5e38\u89c1\u5047\u8bbe\uff0c\u8bc1\u660eVLA\u7684\u9002\u914d\u9700\u6c42\u53ef\u5728\u8bad\u7ec3\u524d\u88ab\u6709\u6548\u8bca\u65ad\uff0c\u4ece\u800c\u663e\u8457\u964d\u4f4e\u673a\u5668\u4eba\u90e8\u7f72\u5fae\u8c03\u6210\u672c\u5e76\u63d0\u5347\u53c2\u6570\u6548\u7387\u3002"}, {"abstract": "Scientific code repositories encode decades of human knowledge in executable models, methods, and tools. Yet fragmented toolchains, implicit domain conventions, and specialized correctness criteria make this knowledge difficult to convert into reliable learning experience-a challenge we call the scientific experience bottleneck. We introduce ScienceIDE, infrastructure for turning the world\u0027s scientific code into programmable environments for scientific agents. Guided by expert-defined scientific cases and acceptance criteria, agents transform repositories into executable environments that support task generation, execution, and scientific verification. These environments provide a shared foundation for supervised fine-tuning, reinforcement learning, and evaluation. Using verified interaction trajectories, we train PhAI-IDE-72B, PhAI-IDE-9B, and PhAI-IDE-4B. The model family shows gains in held-out scientific-code repair and across selected general-purpose benchmarks in code, reasoning, and knowledge, providing evidence of positive transfer from scientific experience to broader capabilities. ScienceIDE lays the foundation for an integrated workspace for agent learning and scientific practice, making humanity\u0027s scientific software a shared substrate for developing scientific intelligence. Code: https://github.com/aitofound/ScienceIDE", "arxiv_id": "2609.19134", "arxiv_url": "https://arxiv.org/abs/2609.19134", "authors": ["Hejia Geng", "Zesen Huang", "Haoyang Li", "Wenbin Li", "Koutian Wu", "Zihan Zhou", "Yuanbo Pang", "Weihao Liu", "Zigong Xu", "Zhiping Li", "Zongzheng Zhang", "Chuanfei Dong", "Jiankai Sun", "Tianzhe Zheng", "Fengyu Xie", "Yue Ma", "Yueheng Shi", "Tong Xie", "Zonglin Di", "Xianrong Liu", "Qucheng Gao", "Yimin Liu", "Jiaming Pan", "Sheng Huang", "Xiao-Han Ma", "Lanqing Yuan", "Zhenlin Zhu", "Ziang Liu", "Ziyang Xu", "Junkai Wang", "Kangkai Liang", "Jiayi Xian", "Zehong Zhao", "Liuwei Xu", "Jingxu Xie", "Peijin Zhang", "Qiang Gao", "Chengyi Xing", "Zhe Zhao", "Xi Wang", "Yaopeng Xing", "Xing Meng", "Zhenfei Yin", "Yingcheng Wu", "Ling Yang"], "brief": "ScienceIDE \u662f\u4e00\u5957\u57fa\u7840\u8bbe\u65bd\uff0c\u7528\u4e8e\u628a\u5206\u6563\u7684\u79d1\u5b66\u4ee3\u7801\u4ed3\u5e93\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u751f\u6210\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u5b66\u4e60\u73af\u5883\u3002\u4f5c\u8005\u57fa\u4e8e\u9a8c\u8bc1\u4ea4\u4e92\u8f68\u8ff9\u8bad\u7ec3\u4e86 PhAI-IDE \u7cfb\u5217\u6a21\u578b\uff0c\u5e76\u5728\u79d1\u5b66\u4ee3\u7801\u4fee\u590d\u53ca\u90e8\u5206\u901a\u7528\u4ee3\u7801\u3001\u63a8\u7406\u3001\u77e5\u8bc6\u57fa\u51c6\u4e0a\u53d6\u5f97\u63d0\u5347\u3002", "categories": ["cs.CL", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19134", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51fa\u201c\u79d1\u5b66\u7ecf\u9a8c\u74f6\u9888\u201d\uff1a\u79d1\u5b66\u4ee3\u7801\u8574\u542b\u5927\u91cf\u77e5\u8bc6\uff0c\u4f46\u56e0\u5de5\u5177\u94fe\u788e\u7247\u5316\u3001\u9886\u57df\u7ea6\u5b9a\u9690\u5f0f\u3001\u6b63\u786e\u6027\u6807\u51c6\u4e13\u4e1a\u5316\uff0c\u96be\u4ee5\u76f4\u63a5\u8f6c\u5316\u4e3a\u53ef\u9760\u8bad\u7ec3\u7ecf\u9a8c\u3002", "\u901a\u8fc7\u4e13\u5bb6\u5b9a\u4e49\u7684\u79d1\u5b66\u6848\u4f8b\u4e0e\u9a8c\u6536\u6807\u51c6\uff0c\u5f15\u5bfc\u667a\u80fd\u4f53\u5c06\u4ee3\u7801\u4ed3\u5e93\u6539\u9020\u4e3a\u652f\u6301\u4efb\u52a1\u751f\u6210\u3001\u6267\u884c\u548c\u79d1\u5b66\u9a8c\u8bc1\u7684\u53ef\u7f16\u7a0b\u73af\u5883\u3002", "\u57fa\u4e8e\u9a8c\u8bc1\u540e\u7684\u4ea4\u4e92\u8f68\u8ff9\u8bad\u7ec3 PhAI-IDE-72B\u30019B\u30014B\uff0c\u663e\u793a\u79d1\u5b66\u7ecf\u9a8c\u8bad\u7ec3\u53ef\u8fc1\u79fb\u5230\u4ee3\u7801\u3001\u63a8\u7406\u548c\u77e5\u8bc6\u7b49\u66f4\u5e7f\u6cdb\u80fd\u529b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u5b66\u8ba1\u7b97", "\u4ee3\u7801\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19134v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ScienceIDE: Turning World\u0027s Scientific Codebase into Agent Learnable Environments", "tldr": "\u5c06\u79d1\u5b66\u4ee3\u7801\u5e93\u8f6c\u5316\u4e3a\u667a\u80fd\u4f53\u53ef\u5b66\u4e60\u73af\u5883", "upvotes": 0, "what_it_is": "ScienceIDE \u662f\u4e00\u5957\u57fa\u7840\u8bbe\u65bd\uff0c\u7528\u4e8e\u628a\u5206\u6563\u7684\u79d1\u5b66\u4ee3\u7801\u4ed3\u5e93\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u751f\u6210\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u5b66\u4e60\u73af\u5883\u3002\u4f5c\u8005\u57fa\u4e8e\u9a8c\u8bc1\u4ea4\u4e92\u8f68\u8ff9\u8bad\u7ec3\u4e86 PhAI-IDE \u7cfb\u5217\u6a21\u578b\uff0c\u5e76\u5728\u79d1\u5b66\u4ee3\u7801\u4fee\u590d\u53ca\u90e8\u5206\u901a\u7528\u4ee3\u7801\u3001\u63a8\u7406\u3001\u77e5\u8bc6\u57fa\u51c6\u4e0a\u53d6\u5f97\u63d0\u5347\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u6d77\u91cf\u79d1\u5b66\u8f6f\u4ef6\u4ece\u9759\u6001\u4ee3\u7801\u8d44\u6e90\u8f6c\u5316\u4e3a\u53ef\u4ea4\u4e92\u3001\u53ef\u9a8c\u8bc1\u7684\u667a\u80fd\u4f53\u8bad\u7ec3\u73af\u5883\uff0c\u4e3a\u79d1\u5b66\u667a\u80fd\u4f53\u7684\u76d1\u7763\u5fae\u8c03\u3001\u5f3a\u5316\u5b66\u4e60\u548c\u8bc4\u6d4b\u63d0\u4f9b\u7edf\u4e00\u5e95\u5ea7\uff0c\u4e5f\u5c55\u793a\u4e86\u79d1\u5b66\u9886\u57df\u7ecf\u9a8c\u5bf9\u901a\u7528\u80fd\u529b\u7684\u6b63\u8fc1\u79fb\u6f5c\u529b\u3002"}, {"abstract": "Graphical User Interface (GUI) grounding is a fundamental perception task for multimodal agents, enabling them to interpret natural language instructions and interact with digital interfaces. Existing methods face a fundamental trade-off between accuracy and efficiency: direct full-image inference often fails to capture small or visually similar UI elements, while multi-crop strategies improve localization at the cost of multiple expensive Vision-Language Model (VLM) calls per query. To address this challenge, we propose RankGround, a two-stage framework that achieves accurate GUI grounding with a single VLM call per query. Central to our approach is GroundRanker, a lightweight multimodal reranker that identifies the most promising crop from a dense candidate set. Because no off-the-shelf ranking dataset is available, we construct ranking supervision data from existing grounding datasets. A strict containment criterion and boundary-aware positive augmentation improve alignment and spatial coverage in cluttered layouts. GroundRanker is then trained with a two-stage curriculum: a pointwise objective first learns coarse containment, and a listwise objective refines subtle semantic and spatial distinctions among visually similar crops. Experimental results show that RankGround consistently outperforms strong baselines while reducing computational cost. It achieves 1.4 times faster inference and improves localization accuracy by 5.5% on average over the second-best method across all backbones and screen scales, establishing a new state of the art in both efficiency and precision for GUI grounding.", "arxiv_id": "2609.18690", "arxiv_url": "https://arxiv.org/abs/2609.18690", "authors": ["Liyang Fan", "Xinping Bi", "Yitai Li", "Shuaimin Li", "Hui Li", "Min Yang"], "brief": "RankGround \u662f\u4e00\u4e2a\u4e24\u9636\u6bb5\u9ad8\u5206\u8fa8\u7387 GUI grounding \u6846\u67b6\uff0c\u901a\u8fc7\u8f7b\u91cf\u7ea7\u591a\u6a21\u6001\u91cd\u6392\u5e8f\u5668 GroundRanker \u4ece\u5bc6\u96c6\u5019\u9009\u88c1\u526a\u4e2d\u9009\u51fa\u6700\u6709\u5e0c\u671b\u7684\u533a\u57df\uff0c\u518d\u8fdb\u884c\u4e00\u6b21 VLM \u63a8\u7406\u5b8c\u6210\u5b9a\u4f4d\u3002", "categories": ["cs.CV", "cs.CL", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18690", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6784\u9020\u4e86\u9762\u5411 GUI grounding \u7684\u88c1\u526a\u6392\u5e8f\u76d1\u7763\u6570\u636e\uff0c\u4f7f\u7528\u4e25\u683c\u5305\u542b\u51c6\u5219\u548c\u8fb9\u754c\u611f\u77e5\u6b63\u6837\u672c\u589e\u5f3a\u63d0\u5347\u62e5\u6324\u754c\u9762\u4e2d\u7684\u7a7a\u95f4\u8986\u76d6\u4e0e\u5bf9\u9f50\u3002", "GroundRanker \u91c7\u7528\u4e24\u9636\u6bb5\u8bfe\u7a0b\u8bad\u7ec3\uff1a\u5148\u7528 pointwise \u76ee\u6807\u5b66\u4e60\u7c97\u7c92\u5ea6\u5305\u542b\u5173\u7cfb\uff0c\u518d\u7528 listwise \u76ee\u6807\u533a\u5206\u8bed\u4e49\u548c\u7a7a\u95f4\u4e0a\u76f8\u8fd1\u7684\u5019\u9009\u88c1\u526a\u3002", "\u5728\u4e0d\u540c\u9aa8\u5e72\u7f51\u7edc\u548c\u5c4f\u5e55\u5c3a\u5ea6\u4e0a\uff0c\u76f8\u6bd4\u6b21\u4f18\u65b9\u6cd5\u5e73\u5747\u5b9a\u4f4d\u7cbe\u5ea6\u63d0\u5347 5.5%\uff0c\u63a8\u7406\u901f\u5ea6\u63d0\u5347 1.4 \u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "GUI\u5b9a\u4f4d", "\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18690v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "RankGround: Efficient High-Resolution GUI Grounding via Lightweight Reranker-Guided Crop Selection", "tldr": "\u5355\u6b21VLM\u8c03\u7528\u5b9e\u73b0\u9ad8\u6548\u9ad8\u7cbe\u5ea6GUI\u5b9a\u4f4d", "upvotes": 0, "what_it_is": "RankGround \u662f\u4e00\u4e2a\u4e24\u9636\u6bb5\u9ad8\u5206\u8fa8\u7387 GUI grounding \u6846\u67b6\uff0c\u901a\u8fc7\u8f7b\u91cf\u7ea7\u591a\u6a21\u6001\u91cd\u6392\u5e8f\u5668 GroundRanker \u4ece\u5bc6\u96c6\u5019\u9009\u88c1\u526a\u4e2d\u9009\u51fa\u6700\u6709\u5e0c\u671b\u7684\u533a\u57df\uff0c\u518d\u8fdb\u884c\u4e00\u6b21 VLM \u63a8\u7406\u5b8c\u6210\u5b9a\u4f4d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7f13\u89e3\u4e86 GUI grounding \u4e2d\u5168\u56fe\u63a8\u7406\u4e0d\u51c6\u3001\u591a\u88c1\u526a\u63a8\u7406\u6602\u8d35\u7684\u6838\u5fc3\u77db\u76fe\uff0c\u4e3a\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5728\u771f\u5b9e\u754c\u9762\u4e0a\u7684\u9ad8\u6548\u53ef\u9760\u64cd\u4f5c\u63d0\u4f9b\u4e86\u66f4\u5b9e\u7528\u7684\u611f\u77e5\u6a21\u5757\u3002"}, {"abstract": "World models endow perceptual systems with the ability to predict how scenes evolve under interaction. They are most beneficial when trained on diverse volumes of data, to instill a rich prior into downstream applications. Existing methods typically require robot action labels to learn action-conditioned 3D dynamics, which excludes web video data from the training pool. We study 3D point track completion as a pre-training objective for learning transferable 3D dynamics without robot data. Given a single RGB-D observation and sparse partial 3D trajectories (tracks), we predict future 3D tracks of all observed points. We show this objective produces a rich 3D dynamics prior, without requiring robot action labels. We contribute a diverse dataset of 2.9 million synthetic frames spanning deformable, articulated, and rigid objects, and use it to train PointZero. We show that a flexible and expressive transformer, PointZero, outperforms prior methods on the same data. We demonstrate the utility of our pre-training objective by post-training PointZero for two downstream applications: (1) action-conditioned 3D dynamics prediction and (2) imitation learning. When fine-tuned to condition on end-effector pose, PointZero outperforms the baselines on the recent PGND 3D dynamics benchmark. When fine-tuned to predict robot actions and 3D tracks, PointZero outperforms or matches the baselines on 6/7 simulated and real-world robot manipulation tasks. We furthermore evaluate training PointZero from scratch to isolate the benefits of our proposed architecture from those of our proposed pre-training objective and dataset. We release the dataset, checkpoints, and full training recipe.", "arxiv_id": "2609.19142", "arxiv_url": "https://arxiv.org/abs/2609.19142", "authors": ["Bardienus P. Duisterhof", "Kaifeng Zhang", "Adam Hung", "Bowen Wen", "Stan Birchfield", "Yunzhu Li", "Deva Ramanan", "Jeffrey Ichnowski"], "brief": "\u8bba\u6587\u63d0\u51faPointZero\uff0c\u4ee53D\u70b9\u8f68\u8ff9\u8865\u5168\u4f5c\u4e3a\u9884\u8bad\u7ec3\u76ee\u6807\uff1a\u7ed9\u5b9a\u5355\u5e27RGB-D\u548c\u7a00\u758f\u90e8\u52063D\u8f68\u8ff9\uff0c\u9884\u6d4b\u6240\u6709\u53ef\u89c1\u70b9\u7684\u672a\u6765\u8f68\u8ff9\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u673a\u5668\u4eba\u52a8\u4f5c\u6807\u7b7e\uff0c\u5229\u7528\u5927\u89c4\u6a21\u5408\u6210\u6570\u636e\u5b66\u4e60\u53ef\u8fc1\u79fb\u76843D\u52a8\u529b\u5b66\u5148\u9a8c\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u52a8\u4f5c\u6761\u4ef6\u52a8\u529b\u5b66\u9884\u6d4b\u548c\u6a21\u4eff\u5b66\u4e60\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19142", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u4e86\u5305\u542b290\u4e07\u5e27\u7684\u591a\u6837\u5316\u5408\u6210\u6570\u636e\u96c6\uff0c\u8986\u76d6\u53ef\u53d8\u5f62\u3001\u5173\u8282\u5f0f\u548c\u521a\u4f53\u7269\u4f53\u4ea4\u4e92\u3002", "PointZero\u91c7\u7528\u7075\u6d3b\u7684Transformer\u67b6\u6784\uff0c\u5728\u76f8\u540c\u6570\u636e\u4e0a\u4f18\u4e8e\u65e2\u67093D\u52a8\u6001\u5efa\u6a21\u65b9\u6cd5\u3002", "\u5fae\u8c03\u540e\u5728PGND 3D\u52a8\u529b\u5b66\u57fa\u51c6\u4e0a\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u57287\u4e2a\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u64cd\u4f5c\u4efb\u52a1\u4e2d\u76846\u4e2a\u8fbe\u5230\u6216\u8d85\u8fc7\u57fa\u7ebf\u8868\u73b0\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "3D\u89c6\u89c9", "\u673a\u5668\u4eba\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19142v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PointZero: 3D Point Track Completion for Learning Transferable 3D Dynamics", "tldr": "\u7528\u70b9\u8f68\u8ff9\u8865\u5168\u9884\u8bad\u7ec3\u53ef\u8fc1\u79fb3D\u52a8\u529b\u5b66\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51faPointZero\uff0c\u4ee53D\u70b9\u8f68\u8ff9\u8865\u5168\u4f5c\u4e3a\u9884\u8bad\u7ec3\u76ee\u6807\uff1a\u7ed9\u5b9a\u5355\u5e27RGB-D\u548c\u7a00\u758f\u90e8\u52063D\u8f68\u8ff9\uff0c\u9884\u6d4b\u6240\u6709\u53ef\u89c1\u70b9\u7684\u672a\u6765\u8f68\u8ff9\u3002\u8be5\u65b9\u6cd5\u65e0\u9700\u673a\u5668\u4eba\u52a8\u4f5c\u6807\u7b7e\uff0c\u5229\u7528\u5927\u89c4\u6a21\u5408\u6210\u6570\u636e\u5b66\u4e60\u53ef\u8fc1\u79fb\u76843D\u52a8\u529b\u5b66\u5148\u9a8c\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u52a8\u4f5c\u6761\u4ef6\u52a8\u529b\u5b66\u9884\u6d4b\u548c\u6a21\u4eff\u5b66\u4e60\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u7ed5\u5f00\u4e86\u52a8\u4f5c\u6807\u6ce8\u4f9d\u8d56\uff0c\u4f7f\u7f51\u7edc\u89c6\u9891\u6216\u975e\u673a\u5668\u4eba\u6570\u636e\u6709\u671b\u7528\u4e8e\u5b66\u4e603D\u4e16\u754c\u6a21\u578b\uff1b\u540c\u65f6\u5c55\u793a\u4e86\u70b9\u8f68\u8ff9\u8865\u5168\u4f5c\u4e3a\u901a\u7528\u9884\u8bad\u7ec3\u4efb\u52a1\u5728\u673a\u5668\u4eba\u52a8\u529b\u5b66\u9884\u6d4b\u548c\u6a21\u4eff\u5b66\u4e60\u4e2d\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent advancements have successfully adapted autoregressive language models to process multimodal signals, such as images and actions. Since raw action signals are continuous, effective tokenization is essential to map high-dimensional inputs into compact discrete tokens for autoregressive processing. However, existing discrete action tokenizers often suffer from high reconstruction loss, failing to preserve the fine-grained dynamics required for precise control. This ``discretization bottleneck\u0027\u0027 significantly limits the performance ceiling of downstream Vision-Language-Action (VLA) models. To address this, we propose $\\mathcal{M}^2$Tok, a Multi-head Multi-codebook Action Tokenizer designed to minimize reconstruction error and enhance policy performance. Our approach introduces two key structural innovations: (1) we decompose the latent action features into multiple heads, enabling the model to implicitly align specific heads with distinct action dimensions; (2) we assign independent codebooks to each head for quantization. By leveraging the combinatorial nature of multiple codebooks, we significantly expand the representational expressivity of the tokenizer, leading to substantially lower reconstruction loss compared to previous methods. We evaluate the $\\mathcal{M}^2$Tok-based VLA on the RoboTwin, Simpler-Env, and 3 zero-shot real-world tasks. Experimental results demonstrate our method not only achieves superior reconstruction fidelity but also significantly boosts the success rate of VLA models. Comprehensive ablation studies further confirm the effectiveness of the multi-head and multi-codebook mechanisms. Code is available at \\href{https://github.com/cpaaax/M2Tok}{https://github.com/cpaaax/M2Tok}.", "arxiv_id": "2609.18259", "arxiv_url": "https://arxiv.org/abs/2609.18259", "authors": ["Chunpu Xu", "Zhixuan Liang", "Yuhao Zhang", "Chi-Min Chan", "Jessie Wang", "Yang Xiao", "Mengkang Hu", "Xiaokang Yang", "Yao Mu"], "brief": "\u8bba\u6587\u63d0\u51fa M\u00b2Tok\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u79bb\u6563\u52a8\u4f5c\u5206\u8bcd\u5668\uff0c\u7528\u591a\u5934\u6f5c\u7279\u5f81\u5206\u89e3\u548c\u72ec\u7acb\u591a\u7801\u672c\u91cf\u5316\u6765\u964d\u4f4e\u8fde\u7eed\u52a8\u4f5c\u79bb\u6563\u5316\u8bef\u5dee\u3002\u57fa\u4e8e\u8be5\u5206\u8bcd\u5668\u7684 VLA \u5728\u4eff\u771f\u548c\u771f\u5b9e\u96f6\u6837\u672c\u4efb\u52a1\u4e2d\u53d6\u5f97\u66f4\u9ad8\u52a8\u4f5c\u91cd\u5efa\u7cbe\u5ea6\u4e0e\u6210\u529f\u7387\u3002", "categories": ["cs.RO", "cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18259", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u6f5c\u5728\u52a8\u4f5c\u7279\u5f81\u62c6\u5206\u4e3a\u591a\u4e2a head\uff0c\u4f7f\u4e0d\u540c head \u53ef\u9690\u5f0f\u5bf9\u5e94\u4e0d\u540c\u52a8\u4f5c\u7ef4\u5ea6\u6216\u52a8\u6001\u6a21\u5f0f", "\u4e3a\u6bcf\u4e2a head \u914d\u7f6e\u72ec\u7acb codebook\uff0c\u901a\u8fc7\u591a\u7801\u672c\u7ec4\u5408\u663e\u8457\u6269\u5927\u79bb\u6563 token \u8868\u8fbe\u80fd\u529b", "\u5728 RoboTwin\u3001Simpler-Env \u548c 3 \u4e2a\u771f\u5b9e\u4e16\u754c\u96f6\u6837\u672c\u4efb\u52a1\u4e0a\u9a8c\u8bc1\uff0c\u52a8\u4f5c\u91cd\u5efa\u635f\u5931\u66f4\u4f4e\u4e14\u7b56\u7565\u6210\u529f\u7387\u66f4\u9ad8"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u52a8\u4f5c\u5206\u8bcd", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18259v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "${M}^2$Tok: Multi-head Multi-codebook Discrete Action Tokenization for Vision-Language-Action Models", "tldr": "\u591a\u5934\u591a\u7801\u672c\u52a8\u4f5c\u5206\u8bcd\u63d0\u5347VLA\u63a7\u5236\u7cbe\u5ea6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa M\u00b2Tok\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u79bb\u6563\u52a8\u4f5c\u5206\u8bcd\u5668\uff0c\u7528\u591a\u5934\u6f5c\u7279\u5f81\u5206\u89e3\u548c\u72ec\u7acb\u591a\u7801\u672c\u91cf\u5316\u6765\u964d\u4f4e\u8fde\u7eed\u52a8\u4f5c\u79bb\u6563\u5316\u8bef\u5dee\u3002\u57fa\u4e8e\u8be5\u5206\u8bcd\u5668\u7684 VLA \u5728\u4eff\u771f\u548c\u771f\u5b9e\u96f6\u6837\u672c\u4efb\u52a1\u4e2d\u53d6\u5f97\u66f4\u9ad8\u52a8\u4f5c\u91cd\u5efa\u7cbe\u5ea6\u4e0e\u6210\u529f\u7387\u3002", "why_notable": "\u73b0\u6709 VLA \u7684\u79bb\u6563\u52a8\u4f5c tokenization \u5f80\u5f80\u5b58\u5728\u201c\u79bb\u6563\u5316\u74f6\u9888\u201d\uff0c\u9650\u5236\u7cbe\u7ec6\u63a7\u5236\u80fd\u529b\uff1bM\u00b2Tok \u4ece\u5206\u8bcd\u5668\u7ed3\u6784\u4e0a\u63d0\u5347\u52a8\u4f5c\u8868\u793a\u5bb9\u91cf\uff0c\u53ef\u80fd\u6210\u4e3a\u673a\u5668\u4eba\u81ea\u56de\u5f52\u7b56\u7565\u5efa\u6a21\u4e2d\u7684\u5b9e\u7528\u7ec4\u4ef6\u3002"}, {"abstract": "Linear probes can decode safety-relevant concepts such as truthfulness from language-model activations, but probe accuracy may show only decodability, not that the features the probe weights causally drive model behavior. We demonstrate that this gap cannot be closed from the geometry of probe weights alone: the features geometrically aligned with probe direction need not be the ones the model uses, so causal relevance requires intervention. We introduce a feature-level diagnostic that decomposes a deployed True/False probe into sparse-autoencoder (SAE) features, ranks those features by both probe alignment and by gradient sensitivity of the model\u0027s behavior, and ablates the resulting shared, probe-only, and random feature sets under a coherence gate. On the truth probe of Buerger et al. (2024) (TTPD), applied in the instructed truth/deception setting of Long et al. (2025) for Gemma2-9B-Instruct, the two rankings overlap only weakly (about 12%, Spearman rho = 0.10), and ablation dissociates them sharply: features the probe shares with the model flip the output far more (up to 27%) than equally sized probe-only (6%) or random (1%) features at full coherence, while probe-only features instead perturb the probe\u0027s own readout. The dissociation holds across five seeds and a held-out split, and an activation-aware selection of features flips behavior nearly three times as often as the probe\u0027s geometric top features (17.6% vs. 6.1%). In this setting, therefore, the geometric projection of a probe\u0027s weight vector alone does not identify the features the model causally uses; however, combining probe information with feature activation statistics recovers substantially more behaviorally causal features, and coherence-gated SAE intervention is needed to separate them from probe readouts.", "arxiv_id": "2609.18080", "arxiv_url": "https://arxiv.org/abs/2609.18080", "authors": ["Devesh Tiwari", "Camille Davis", "Shivank Sinha", "Talia Weaver", "Aditya Shah", "Maheep Chaudhary"], "brief": "\u8bba\u6587\u7814\u7a76\u7ebf\u6027\u63a2\u9488\u5728\u8bed\u8a00\u6a21\u578b\u4e2d\u89e3\u7801\u201c\u771f\u5b9e\u6027\u201d\u7b49\u5b89\u5168\u6982\u5ff5\u65f6\uff0c\u63a2\u9488\u6743\u91cd\u5bf9\u9f50\u7684\u7279\u5f81\u662f\u5426\u771f\u6b63\u5728\u56e0\u679c\u4e0a\u9a71\u52a8\u6a21\u578b\u884c\u4e3a\u3002\u4f5c\u8005\u7528 SAE \u7279\u5f81\u5206\u89e3\u4e0e\u5e72\u9884\u5b9e\u9a8c\u8868\u660e\uff0c\u4ec5\u51ed\u63a2\u9488\u51e0\u4f55\u65b9\u5411\u65e0\u6cd5\u8bc6\u522b\u6a21\u578b\u5b9e\u9645\u4f7f\u7528\u7684\u56e0\u679c\u7279\u5f81\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18080", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u7279\u5f81\u7ea7\u8bca\u65ad\u65b9\u6cd5\uff1a\u5c06 True/False \u63a2\u9488\u5206\u89e3\u5230 SAE \u7279\u5f81\u4e0a\uff0c\u540c\u65f6\u6309\u63a2\u9488\u5bf9\u9f50\u5ea6\u4e0e\u6a21\u578b\u884c\u4e3a\u7684\u68af\u5ea6\u654f\u611f\u6027\u6392\u5e8f\u3002", "\u5728 Gemma2-9B-Instruct \u7684\u771f\u8bdd/\u6b3a\u9a97\u8bbe\u7f6e\u4e2d\uff0c\u4e24\u7c7b\u6392\u5e8f\u91cd\u5408\u5f88\u5f31\uff1a\u7ea6 12%\uff0cSpearman \u03c1=0.10\u3002", "\u6d88\u878d\u7ed3\u679c\u663e\u793a\uff0c\u5171\u4eab\u7279\u5f81\u53ef\u663e\u8457\u7ffb\u8f6c\u8f93\u51fa\uff0c\u6700\u9ad8\u8fbe 27%\uff1b\u63a2\u9488\u4e13\u5c5e\u7279\u5f81\u4ec5 6%\uff0c\u968f\u673a\u7279\u5f81\u7ea6 1%\uff0c\u4e14\u63a2\u9488\u4e13\u5c5e\u7279\u5f81\u4e3b\u8981\u6270\u52a8\u63a2\u9488\u8bfb\u6570\u672c\u8eab\u3002"], "keywords": ["\u53ef\u89e3\u91ca\u6027", "\u7a00\u758f\u81ea\u7f16\u7801\u5668", "\u56e0\u679c\u5e72\u9884", "\u6a21\u578b\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18080v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Decodability is Not Causality: Dissociating Probe Readouts from Behavioral Drivers via SAE Decomposition", "tldr": "\u63a2\u9488\u53ef\u89e3\u7801\u4e0d\u7b49\u4e8e\u56e0\u679c\u9a71\u52a8\u884c\u4e3a", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u7ebf\u6027\u63a2\u9488\u5728\u8bed\u8a00\u6a21\u578b\u4e2d\u89e3\u7801\u201c\u771f\u5b9e\u6027\u201d\u7b49\u5b89\u5168\u6982\u5ff5\u65f6\uff0c\u63a2\u9488\u6743\u91cd\u5bf9\u9f50\u7684\u7279\u5f81\u662f\u5426\u771f\u6b63\u5728\u56e0\u679c\u4e0a\u9a71\u52a8\u6a21\u578b\u884c\u4e3a\u3002\u4f5c\u8005\u7528 SAE \u7279\u5f81\u5206\u89e3\u4e0e\u5e72\u9884\u5b9e\u9a8c\u8868\u660e\uff0c\u4ec5\u51ed\u63a2\u9488\u51e0\u4f55\u65b9\u5411\u65e0\u6cd5\u8bc6\u522b\u6a21\u578b\u5b9e\u9645\u4f7f\u7528\u7684\u56e0\u679c\u7279\u5f81\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u660e\u786e\u533a\u5206\u4e86\u201c\u53ef\u88ab\u63a2\u9488\u89e3\u7801\u201d\u548c\u201c\u56e0\u679c\u9a71\u52a8\u6a21\u578b\u884c\u4e3a\u201d\uff0c\u5bf9\u673a\u68b0\u53ef\u89e3\u91ca\u6027\u548c\u5b89\u5168\u76d1\u6d4b\u5177\u6709\u91cd\u8981\u8b66\u793a\u610f\u4e49\uff1b\u540c\u65f6\u7ed9\u51fa\u7ed3\u5408 SAE\u3001\u6fc0\u6d3b\u7edf\u8ba1\u4e0e\u5e72\u9884\u7684\u8bca\u65ad\u6846\u67b6\uff0c\u53ef\u66f4\u53ef\u9760\u5730\u5bfb\u627e\u884c\u4e3a\u76f8\u5173\u7279\u5f81\u3002"}, {"abstract": "Billion-parameter vision--language--action (VLA) policies demand substantial onboard power, while communication delays in remote inference hinder timely responses. We propose VLA-ULAP, which interleaves remote VLA calls with an Ultra-Lightweight Local Action Predictor (ULAP). With approximately 7.4M parameters including the frozen vision encoder, ULAP combines current views, proprioception, and executed action history to predict chunks in one pass. Trained independently, it requires no VLA hidden states, online verification, or server round trips. On Jetson Orin Nano, ULAP takes 19.9 ms and 0.183 J per inference, compared with 284.3 ms and 50.55 J for GR00T on RTX A6000. Across three simulated base-policy/benchmark pairs, selected operating points remove 48.8--76.7\\% of VLA calls while retaining 95.0--97.5\\% of the baseline success rate. Against local VLA-acceleration alternatives on VLA-JEPA, ULAP uses an estimated 49.2\\% less inference time and 51.0\\% less GPU energy per successful episode than ACT at comparable success rates, and 77.1\\% less time and 79.9\\% less energy than SP-VLA at equal success rates. Physical SO-101 experiments retain 95.2--100\\% of the baseline success rate across seen and held-out placements while reducing inference time by an estimated 47.9--58.0\\% and inference-device energy by 52.1--62.5\\%, based on successful-episode call counts and measured device costs. Faster responses also improve dynamic-task success rates: in latency-aware LIBERO-Safety simulation, VLA-ULAP exceeds $\u03c0_{0.5}$ by 11.0 and 15.5 percentage points on two tasks while approximately halving VLA calls.", "arxiv_id": "2609.18663", "arxiv_url": "https://arxiv.org/abs/2609.18663", "authors": ["Deyu Cao", "Ryuji Oi", "Kosuke Matsushima", "Yuxuan Pan", "Ziheng Wang", "Daichi Fujiki", "Atsutake Kosuge"], "brief": "\u8bba\u6587\u63d0\u51fa VLA-ULAP\uff0c\u5728\u4e91\u7aef\u5927\u89c4\u6a21 VLA \u7b56\u7565\u8c03\u7528\u4e4b\u95f4\u63d2\u5165\u8d85\u8f7b\u91cf\u672c\u5730\u52a8\u4f5c\u9884\u6d4b\u5668 ULAP\u3002ULAP \u53ef\u57fa\u4e8e\u5f53\u524d\u89c6\u89c9\u3001\u673a\u5668\u4eba\u672c\u4f53\u72b6\u6001\u548c\u5386\u53f2\u52a8\u4f5c\u4e00\u6b21\u6027\u9884\u6d4b\u52a8\u4f5c\u7247\u6bb5\uff0c\u65e0\u9700\u8bbf\u95ee VLA \u9690\u72b6\u6001\u6216\u989d\u5916\u5728\u7ebf\u9a8c\u8bc1\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18663", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["ULAP \u7ea6 740 \u4e07\u53c2\u6570\uff08\u542b\u51bb\u7ed3\u89c6\u89c9\u7f16\u7801\u5668\uff09\uff0c\u5728 Jetson Orin Nano \u4e0a\u5355\u6b21\u63a8\u7406\u4ec5 19.9 ms\u30010.183 J\u3002", "\u5728\u4e09\u4e2a\u4eff\u771f\u57fa\u51c6\u7ec4\u5408\u4e2d\uff0c\u53ef\u51cf\u5c11 48.8%\u201376.7% \u7684 VLA \u8c03\u7528\uff0c\u540c\u65f6\u4fdd\u6301 95.0%\u201397.5% \u7684\u57fa\u7ebf\u6210\u529f\u7387\u3002", "\u771f\u5b9e SO-101 \u5b9e\u9a8c\u4e2d\u4fdd\u6301 95.2%\u2013100% \u6210\u529f\u7387\uff0c\u5e76\u5c06\u63a8\u7406\u65f6\u95f4\u964d\u4f4e\u7ea6 47.9%\u201358.0%\u3001\u8bbe\u5907\u80fd\u8017\u964d\u4f4e 52.1%\u201362.5%\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u8fb9\u7f18\u63a8\u7406", "\u6a21\u578b\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18663v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "VLA-ULAP: Interleaving Cloud VLA Calls with Ultra-Lightweight Local Action Prediction at the Edge", "tldr": "\u8fb9\u7f18\u5c0f\u6a21\u578b\u5927\u5e45\u51cf\u5c11\u4e91\u7aefVLA\u8c03\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa VLA-ULAP\uff0c\u5728\u4e91\u7aef\u5927\u89c4\u6a21 VLA \u7b56\u7565\u8c03\u7528\u4e4b\u95f4\u63d2\u5165\u8d85\u8f7b\u91cf\u672c\u5730\u52a8\u4f5c\u9884\u6d4b\u5668 ULAP\u3002ULAP \u53ef\u57fa\u4e8e\u5f53\u524d\u89c6\u89c9\u3001\u673a\u5668\u4eba\u672c\u4f53\u72b6\u6001\u548c\u5386\u53f2\u52a8\u4f5c\u4e00\u6b21\u6027\u9884\u6d4b\u52a8\u4f5c\u7247\u6bb5\uff0c\u65e0\u9700\u8bbf\u95ee VLA \u9690\u72b6\u6001\u6216\u989d\u5916\u5728\u7ebf\u9a8c\u8bc1\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u7528\u72ec\u7acb\u8bad\u7ec3\u7684\u8fb9\u7f18\u5c0f\u6a21\u578b\u7f13\u89e3\u5927\u89c4\u6a21 VLA \u7684\u7b97\u529b\u4e0e\u901a\u4fe1\u5ef6\u8fdf\u74f6\u9888\uff0c\u5728\u4fdd\u6301\u673a\u5668\u4eba\u4efb\u52a1\u6210\u529f\u7387\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u4e91\u7aef\u8c03\u7528\u3001\u63a8\u7406\u65f6\u95f4\u548c\u80fd\u8017\uff0c\u5bf9\u4f4e\u529f\u8017\u673a\u5668\u4eba\u90e8\u7f72\u5f88\u5b9e\u7528\u3002"}, {"abstract": "Loss spikes are recurrent instabilities in neural-network training and can arise from multiple mechanisms. For Adam in particular, macroscopic loss spikes have been linked to optimizer dynamics, yet how its two momentum timescales govern them remains unclear. We investigate this dependence by mapping training dynamics across the $(\u03b2_1,\u03b2_2)$ plane. Across a range of model--task settings, an approximately linear boundary, $1-\u03b2_2=C(1-\u03b2_1)$, separates spiky from non-spiky dynamics, whereas a one-dimensional quadratic loss produces approximately cubic slope. A one-dimensional superquadratic loss $L(x)\\propto|x|^n$ recovers the near-linear scaling and links the boundary coefficient to the effective loss exponent $n$. We further show that confident cross-entropy losses develop a core--wall landscape comprising a narrow quadratic core followed by a steep wall, which produces effective superquadratic behavior at the scale of an optimizer update. Together, these results connect Adam loss spikes to both the mismatch between momentum timescales and finite-scale superquadratic loss geometry beyond the Hessian.", "arxiv_id": "2609.18314", "arxiv_url": "https://arxiv.org/abs/2609.18314", "authors": ["Gaoxiang Tang", "Huanran Chen", "Ziming Liu"], "brief": "\u672c\u6587\u7cfb\u7edf\u626b\u63cfAdam\u7684\u03b21\u3001\u03b22\u52a8\u91cf\u53c2\u6570\u5e73\u9762\uff0c\u53d1\u73b0\u5c16\u5cf0\u4e0e\u975e\u5c16\u5cf0\u8bad\u7ec3\u52a8\u6001\u4e4b\u95f4\u5b58\u5728\u8fd1\u4f3c\u7ebf\u6027\u8fb9\u754c\u3002\u8bba\u6587\u8fdb\u4e00\u6b65\u7528\u8d85\u4e8c\u6b21\u635f\u5931\u548c\u4ea4\u53c9\u71b5\u7684\u201c\u6838\u5fc3-\u5ced\u58c1\u201d\u51e0\u4f55\u89e3\u91ca\u4e86\u8be5\u8fb9\u754c\u6765\u6e90\u3002", "categories": ["cs.LG", "math.OC", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18314", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u591a\u79cd\u6a21\u578b\u4e0e\u4efb\u52a1\u4e2d\uff0cAdam\u7a33\u5b9a\u8fb9\u754c\u8fd1\u4f3c\u6ee1\u8db31-\u03b22=C(1-\u03b21)\uff0c\u800c\u4e00\u7ef4\u4e8c\u6b21\u635f\u5931\u53ea\u4ea7\u751f\u8fd1\u4f3c\u4e09\u6b21\u659c\u7387\u3002", "\u4e00\u7ef4\u8d85\u4e8c\u6b21\u635f\u5931L(x)\u221d|x|^n\u53ef\u590d\u73b0\u8fd1\u7ebf\u6027\u7f29\u653e\uff0c\u5e76\u5c06\u8fb9\u754c\u7cfb\u6570C\u4e0e\u6709\u6548\u635f\u5931\u6307\u6570n\u8054\u7cfb\u8d77\u6765\u3002", "\u9ad8\u7f6e\u4fe1\u4ea4\u53c9\u71b5\u635f\u5931\u5448\u73b0\u7a84\u4e8c\u6b21\u6838\u5fc3\u52a0\u9661\u5ced\u5899\u9762\u7684\u201c\u6838\u5fc3-\u5ced\u58c1\u201d\u666f\u89c2\uff0c\u4f7f\u4f18\u5316\u5668\u6709\u9650\u6b65\u957f\u5c3a\u5ea6\u4e0a\u8868\u73b0\u51fa\u8d85\u4e8c\u6b21\u51e0\u4f55\u3002"], "keywords": ["\u4f18\u5316\u5668", "\u8bad\u7ec3\u7a33\u5b9a\u6027", "Adam", "\u635f\u5931\u666f\u89c2"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18314v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Quadratic Loss: The Stability Phase Diagram of Adam", "tldr": "\u63ed\u793aAdam\u635f\u5931\u5c16\u5cf0\u7684\u7a33\u5b9a\u6027\u76f8\u56fe", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u626b\u63cfAdam\u7684\u03b21\u3001\u03b22\u52a8\u91cf\u53c2\u6570\u5e73\u9762\uff0c\u53d1\u73b0\u5c16\u5cf0\u4e0e\u975e\u5c16\u5cf0\u8bad\u7ec3\u52a8\u6001\u4e4b\u95f4\u5b58\u5728\u8fd1\u4f3c\u7ebf\u6027\u8fb9\u754c\u3002\u8bba\u6587\u8fdb\u4e00\u6b65\u7528\u8d85\u4e8c\u6b21\u635f\u5931\u548c\u4ea4\u53c9\u71b5\u7684\u201c\u6838\u5fc3-\u5ced\u58c1\u201d\u51e0\u4f55\u89e3\u91ca\u4e86\u8be5\u8fb9\u754c\u6765\u6e90\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06Adam\u8bad\u7ec3\u4e2d\u7684\u5b8f\u89c2\u635f\u5931\u5c16\u5cf0\u4e0e\u52a8\u91cf\u65f6\u95f4\u5c3a\u5ea6\u4e0d\u5339\u914d\u3001\u4ee5\u53ca\u8d85\u8d8aHessian\u7684\u6709\u9650\u5c3a\u5ea6\u635f\u5931\u51e0\u4f55\u8054\u7cfb\u8d77\u6765\uff0c\u4e3a\u8c03\u53c2\u3001\u7a33\u5b9a\u8bad\u7ec3\u548c\u7406\u89e3\u81ea\u9002\u5e94\u4f18\u5316\u5668\u63d0\u4f9b\u4e86\u66f4\u53ef\u64cd\u4f5c\u7684\u7406\u8bba\u56fe\u666f\u3002"}, {"abstract": "Attention pays, at every layer and for every input, the cost of searching for whom to connect. We ask how far one can get with wiring that is fixed, sparse, and simply rotated from layer to layer. Treating the $n$ positions of a sequence as the vertices of a $\\log_2 n$-dimensional hypercube and connecting each position, at layer $\\ell$, to its neighbour along dimension $\\ell \\bmod \\log_2 n$, information from every position reaches every other in $\\log_2 n$ layers with $2n$ links per layer instead of $n^2$. On a synthetic task that is unsolvable unless all positions are reached, this rotation matches all-to-all wiring at $1/32$ of the links, while the same sparse pattern held fixed across layers fails; what matters is that every dimension is touched, not the order. On character-level language modelling of a public corpus (the first $12$M characters of enwik8), a hybrid that keeps two attention layers among sixteen sparse ones reaches $0.06$ bits-per-character lower held-out loss than a fully attentive model of the same width at the same step budget (three seeds each, no overlap), with $1/7$ of the links, $42\\%$ fewer parameters, and $2.4\\times$ less wall-clock time; the purely rotated schedule is level with the hybrid. The same ordering holds on a second corpus of mixed Japanese, English and code, where the gap widens to $0.16$. The usable learning-rate window is four to eight times wider than attention\u0027s on both. We also report what did not work - learned coordinates, and a \"dynamics\" variant whose apparent gains turned out to be an artefact of a saturated kernel - and the measurement discipline (frozen corpus, full-coverage evaluation, seed spread as the bar for ranking) that we found necessary to say anything at all at this scale.", "arxiv_id": "2609.18145", "arxiv_url": "https://arxiv.org/abs/2609.18145", "authors": ["Yoshiaki Takashita"], "brief": "\u8bba\u6587\u5c06\u5e8f\u5217\u4f4d\u7f6e\u89c6\u4e3a\u8d85\u7acb\u65b9\u4f53\u9876\u70b9\uff0c\u5728\u4e0d\u540c\u5c42\u6309\u7ef4\u5ea6\u8f6e\u6362\u8fde\u63a5\u76f8\u90bb\u4f4d\u7f6e\uff0c\u4f7f\u4fe1\u606f\u5728log n\u5c42\u5185\u8986\u76d6\u5168\u5c40\u3002\u5b9e\u9a8c\u663e\u793a\u8fd9\u79cd\u56fa\u5b9a\u7a00\u758f\u5e03\u7ebf\u5728\u5408\u6210\u5168\u5c40\u4f9d\u8d56\u4efb\u52a1\u548c\u5b57\u7b26\u7ea7\u8bed\u8a00\u5efa\u6a21\u4e2d\u53ef\u63a5\u8fd1\u6216\u4f18\u4e8e\u5168\u6
