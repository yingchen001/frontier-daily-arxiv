<script>
const PAPERS = [{"abstract": "Coding agents are typically evaluated with desired behavior specified through issues or instructions. In practical web development, however, agents may need to infer behavior from working software and implement it in an incomplete application. We introduce ProgramDistill, a benchmark evaluating coding agents on features discovered through interaction with fully functional reference applications. We build ProgramDistill by factorizing applications into features of different granularities, each associated with replayable behaviors executable via its gold patch. Our pipeline, mine-craft-patch, discovers 1,975 replay-verified behaviors across 26 applications and constructs 4,063 tasks without human intervention. Across nine frontier coding agents, GPT-6 Astra and Claude Opus 5 achieve 49.2% and 28.8% success on cumulative workflows in full-application reconstruction. In partial-application reconstruction, success falls from 100% to 64.0% and from 96% to 32% as restoration depth increases from 1 to 8. ProgramDistill thus provides a scalable benchmark with controlled difficulty for evaluating and diagnosing coding agents, and a natural basis for future curriculum-based training.", "arxiv_id": "2609.18805", "arxiv_url": "https://arxiv.org/abs/2609.18805", "authors": ["Jeonghye Kim", "Minseon Kim", "Young Jin Kim", "Matheus Pereira", "Marc-Alexandre C\u00f4t\u00e9", "Alessandro Sordoni", "Xingdi Yuan", "Zhengyan Shi"], "brief": "ProgramDistill \u662f\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u65b0\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u901a\u8fc7\u4e0e\u5b8c\u6574\u53c2\u8003 Web \u5e94\u7528\u4ea4\u4e92\uff0c\u53d1\u73b0\u529f\u80fd\u884c\u4e3a\u5e76\u5728\u4e0d\u5b8c\u6574\u5e94\u7528\u4e2d\u5b9e\u73b0\u8fd8\u539f\u3002\u4f5c\u8005\u63d0\u51fa mine-craft-patch \u81ea\u52a8\u6d41\u6c34\u7ebf\uff0c\u4ece 26 \u4e2a\u5e94\u7528\u4e2d\u6316\u6398\u53ef\u56de\u653e\u9a8c\u8bc1\u7684\u884c\u4e3a\u5e76\u751f\u6210\u4efb\u52a1\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18805", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u81ea\u52a8\u53d1\u73b0 1,975 \u4e2a\u7ecf\u56de\u653e\u9a8c\u8bc1\u7684\u884c\u4e3a\uff0c\u6784\u5efa 4,063 \u4e2a\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684 SWE \u4efb\u52a1", "\u4efb\u52a1\u8986\u76d6\u4e0d\u540c\u7c92\u5ea6\u529f\u80fd\uff0c\u5e76\u652f\u6301\u5168\u5e94\u7528\u91cd\u5efa\u4e0e\u90e8\u5206\u5e94\u7528\u91cd\u5efa\u4e24\u7c7b\u8bc4\u6d4b", "\u4e5d\u4e2a\u524d\u6cbf\u4ee3\u7801\u667a\u80fd\u4f53\u6d4b\u8bd5\u663e\u793a\uff0c\u968f\u7740\u6062\u590d\u6df1\u5ea6\u4ece 1 \u589e\u81f3 8\uff0c\u90e8\u5206\u91cd\u5efa\u6210\u529f\u7387\u663e\u8457\u4e0b\u964d"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2609.18805v1", "published_at": "2026-09-16", "score": 0.507, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.18805.png", "title": "ProgramDistill: From Interactive Web Apps to Verifiable Reference-Guided SWE Tasks", "tldr": "\u9762\u5411\u4ea4\u4e92\u5f0f\u7f51\u9875\u884c\u4e3a\u8fd8\u539f\u7684\u4ee3\u7801\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 11, "what_it_is": "ProgramDistill \u662f\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u4ee3\u7801\u667a\u80fd\u4f53\u7684\u65b0\u57fa\u51c6\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u901a\u8fc7\u4e0e\u5b8c\u6574\u53c2\u8003 Web \u5e94\u7528\u4ea4\u4e92\uff0c\u53d1\u73b0\u529f\u80fd\u884c\u4e3a\u5e76\u5728\u4e0d\u5b8c\u6574\u5e94\u7528\u4e2d\u5b9e\u73b0\u8fd8\u539f\u3002\u4f5c\u8005\u63d0\u51fa mine-craft-patch \u81ea\u52a8\u6d41\u6c34\u7ebf\uff0c\u4ece 26 \u4e2a\u5e94\u7528\u4e2d\u6316\u6398\u53ef\u56de\u653e\u9a8c\u8bc1\u7684\u884c\u4e3a\u5e76\u751f\u6210\u4efb\u52a1\u3002", "why_notable": "\u76f8\u6bd4\u4ec5\u4f9d\u8d56 issue \u6216\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u7684\u4f20\u7edf\u4ee3\u7801\u8bc4\u6d4b\uff0c\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e Web \u5f00\u53d1\u4e2d\u201c\u4ece\u5df2\u6709\u8f6f\u4ef6\u63a8\u65ad\u9700\u6c42\u201d\u7684\u573a\u666f\uff0c\u5e76\u63d0\u4f9b\u53ef\u6269\u5c55\u3001\u53ef\u63a7\u96be\u5ea6\u548c\u53ef\u8bca\u65ad\u7684\u8bc4\u6d4b\u6846\u67b6\uff0c\u53ef\u7528\u4e8e\u672a\u6765\u8bfe\u7a0b\u5f0f\u8bad\u7ec3\u4ee3\u7801\u667a\u80fd\u4f53\u3002"}, {"abstract": "Safety guardrails in open-weight language models can be readily bypassed using Refusal Feature Ablation (RFA), a technique that identifies and projects out a linear refusal direction from the residual stream, often achieving a high attack success rate (ASR) while preserving model capability. Defending against these attacks typically requires computationally expensive safety finetuning for every new checkpoint. We introduce Decoy Direction Optimization (DDO), a fast, post-hoc weight-editing defense that requires no base-model finetuning. Our approach is based on a simple mechanistic insight: ablation attacks rely on contrastive estimators to find the refusal direction. Rather than trying to hide the true refusal circuitry, DDO actively injects a high-magnitude, nonlinear decoy signal into the network\u0027s MLP neurons. When an attacker attempts to locate the refusal direction, the decoy corrupts their estimator, tricking them into ablating a harmless orthogonal feature while the actual safety mechanism remains intact. We prove a spectral bound formalizing this effect and evaluate DDO across six model families, achieving \u003c10% ASR under standard RFA. On Llama-3-8B-Instruct, DDO remains comparable to trained defenses under adaptive multi-phase attacks (65% vs. 58% worst-case ASR) and reduces Heretic weight-level attack ASR from 88.7% to 18%, all at 30 to 450 times lower optimization cost per configuration than the trained baselines.", "arxiv_id": "2609.16204", "arxiv_url": "https://arxiv.org/abs/2609.16204", "authors": ["Aashiq Muhamed", "Mona T. Diab", "Virginia Smith"], "brief": "\u8bba\u6587\u63d0\u51fa Decoy Direction Optimization\uff08DDO\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u5b89\u5168\u5fae\u8c03\u7684\u4e8b\u540e\u6743\u91cd\u7f16\u8f91\u9632\u5fa1\u65b9\u6cd5\uff0c\u7528\u4e8e\u62b5\u5fa1\u9488\u5bf9\u5f00\u6e90\u5927\u6a21\u578b\u5b89\u5168\u62a4\u680f\u7684 Refusal Feature Ablation \u653b\u51fb\u3002\u5176\u6838\u5fc3\u662f\u5728 MLP \u795e\u7ecf\u5143\u4e2d\u6ce8\u5165\u9ad8\u5e45\u503c\u975e\u7ebf\u6027\u201c\u8bf1\u9975\u201d\u4fe1\u53f7\uff0c\u8bef\u5bfc\u653b\u51fb\u8005\u6d88\u878d\u65e0\u5bb3\u65b9\u5411\u800c\u4fdd\u7559\u771f\u5b9e\u62d2\u7b54\u673a\u5236\u3002", "categories": ["cs.LG", "cs.CL", "cs.CR"], "github_repo": "https://github.com/aashiqmuhamed/defending-against-abliteration", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.16204", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["DDO \u5229\u7528 RFA \u4f9d\u8d56\u5bf9\u6bd4\u4f30\u8ba1\u5bfb\u627e\u7ebf\u6027\u62d2\u7b54\u65b9\u5411\u7684\u5f31\u70b9\uff0c\u901a\u8fc7\u8bf1\u9975\u4fe1\u53f7\u6c61\u67d3\u4f30\u8ba1\u5668\u3002", "\u4f5c\u8005\u7ed9\u51fa\u8c31\u754c\u8bc1\u660e\uff0c\u5f62\u5f0f\u5316\u8bf4\u660e\u8bf1\u9975\u65b9\u5411\u5982\u4f55\u4e3b\u5bfc\u653b\u51fb\u8005\u4f30\u8ba1\u5230\u7684\u65b9\u5411\u3002", "\u5728\u516d\u4e2a\u6a21\u578b\u5bb6\u65cf\u4e0a\u8bc4\u4f30\uff0c\u6807\u51c6 RFA \u4e0b\u653b\u51fb\u6210\u529f\u7387\u964d\u81f3 10% \u4ee5\u4e0b\uff1b\u5728 Llama-3-8B-Instruct \u4e0a\u663e\u8457\u4f4e\u4e8e Heretic \u6743\u91cd\u7ea7\u653b\u51fb ASR\u3002"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u6a21\u578b\u7f16\u8f91", "\u5bf9\u6297\u9632\u5fa1", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 2, "on_hf": true, "organization": "Carnegie Mellon University", "pdf_url": "https://arxiv.org/pdf/2609.16204v1", "published_at": "2026-09-14", "score": 0.467, "selected_reasons": ["\u77e5\u540d\u673a\u6784: CMU", "HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.16204.png", "title": "Decoy Direction Optimization: A Post-Hoc Defense Against LLM Abliteration", "tldr": "\u7528\u8bf1\u9975\u65b9\u5411\u4f4e\u6210\u672c\u9632\u5fa1LLM\u62d2\u7b54\u6d88\u878d", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Decoy Direction Optimization\uff08DDO\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u5b89\u5168\u5fae\u8c03\u7684\u4e8b\u540e\u6743\u91cd\u7f16\u8f91\u9632\u5fa1\u65b9\u6cd5\uff0c\u7528\u4e8e\u62b5\u5fa1\u9488\u5bf9\u5f00\u6e90\u5927\u6a21\u578b\u5b89\u5168\u62a4\u680f\u7684 Refusal Feature Ablation \u653b\u51fb\u3002\u5176\u6838\u5fc3\u662f\u5728 MLP \u795e\u7ecf\u5143\u4e2d\u6ce8\u5165\u9ad8\u5e45\u503c\u975e\u7ebf\u6027\u201c\u8bf1\u9975\u201d\u4fe1\u53f7\uff0c\u8bef\u5bfc\u653b\u51fb\u8005\u6d88\u878d\u65e0\u5bb3\u65b9\u5411\u800c\u4fdd\u7559\u771f\u5b9e\u62d2\u7b54\u673a\u5236\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u907f\u514d\u4e86\u6bcf\u4e2a\u6a21\u578b\u68c0\u67e5\u70b9\u90fd\u91cd\u65b0\u5b89\u5168\u5fae\u8c03\u7684\u9ad8\u6210\u672c\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u5feb\u901f\u3001\u4e8b\u540e\u3001\u53ef\u6269\u5c55\u7684 LLM \u5b89\u5168\u9632\u5fa1\u601d\u8def\uff0c\u5bf9\u5f00\u6e90\u6743\u91cd\u6a21\u578b\u7684\u62a4\u680f\u7a33\u5065\u6027\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Realtime spoken interaction demands deep reasoning, prompt responses, and fluid turn-taking. We present StepAudio 3 Realtime, an audio-language foundation model organized around a continuous listen-converse-think-act loop. Deep Perception captures rich acoustic cues to interpret user intent, while Seamless Duplex models synchronized audio streams to handle pauses, backchannels, and interruptions naturally. Crucially, we resolve the tension between deep deliberation and latency via Think-While-Speaking, executing private reasoning in parallel with spoken delivery. In reasoning mode, StepAudio 3 reaches a 73.0 macro average on StepAudioChat. With Think-While-Speaking, it achieves dialogue and reasoning performance comparable to dedicated reasoning models while speaking in real time. Furthermore, an integrated Voice Agent handles asynchronous tool execution without disrupting the dialogue flow. StepAudio 3 Realtime achieves top-tier performance across key dimensions: an exceptional 90.6 on the MMSU benchmark, 98.9 Overall on the Artificial Analysis Full-Duplex Bench, and a 56.0% macro task-success rate on $\u03c4$-Voice.", "arxiv_id": "2609.14005", "arxiv_url": "https://arxiv.org/abs/2609.14005", "authors": ["Bin Lin", "Bo Zhao", "Boyang Zhang", "Boyong Wu", "Chao Yan", "Chen Geng", "Chen Wu", "Cheng Yi", "Chengli Feng", "Chenglin Zhu", "Chengting Feng", "Chengyuan Yao", "Daijiao Liu", "DanNi Wan", "Daxin Jiang", "Dongjian Li", "Dongqing Pang", "Fei Tian", "Feng Tian", "Future Li", "Gang Yu", "Guanglong Yang", "Haoyang Zhang", "Hongyuan Wang", "Jia Peng", "Jiahao Song", "Jialong Xue", "Jiamin Fan", "Jiangjie Zhen", "Jianzheng Gao", "Jincheng Wen", "Jinghua Liang", "Jinglan Gong", "Jun Chen", "Li Xie", "Liang Zhao", "Lifang Zhang", "Lingli Ji", "Lun Cai", "Min Xu", "Peilin Li", "Peng Yang", "Pengfei Tan", "Qingjian Lin", "Qinxin Du", "Ruijie Xiong", "Runze Li", "Shenghua Hu", "Shengqian Qin", "Shi Qiu", "Siqi Tu", "Siyi Zhou", "Tianjiao Deng", "Wanying Lu", "Weiming Niu", "Wen Sun", "WenWen Qu", "Xiangyu Zhang", "Xianwei Zhang", "Xiaosu Su", "Xing Chen", "Xinyu Liu", "Xuerui Yang", "Yan Wu", "Yang Li", "Yang Yang", "Yechang Huang", "Yibo Zhu", "Yifan Zhang", "Yinuo Yan", "Youjun Chen", "Yu Fu", "Yu Luo", "Yu Zhou", "Yujie Chen", "Yumang Wang", "Yunzhou Ju", "Yuxiang Yang", "Yuxin Li", "Yuxin Zhang", "Zekai Liu", "Zengwei Yao", "Zhaoxin Yuan", "Zhenwei Mou", "Zhiquan Zhang", "Zhiyue Wu", "Zichao Li", "Zichao Zhou", "Ziqi Ren", "Zixuan Wang"], "brief": "StepAudio 3 Realtime \u662f\u4e00\u4e2a\u9762\u5411\u5b9e\u65f6\u53e3\u8bed\u4ea4\u4e92\u7684\u97f3\u9891\u8bed\u8a00\u57fa\u7840\u6a21\u578b\uff0c\u56f4\u7ed5\u201c\u542c-\u804a-\u601d\u8003-\u884c\u52a8\u201d\u7684\u8fde\u7eed\u5faa\u73af\u8bbe\u8ba1\u3002\u5b83\u901a\u8fc7\u5168\u53cc\u5de5\u8bed\u97f3\u5efa\u6a21\u3001\u6df1\u5ea6\u58f0\u5b66\u611f\u77e5\u548c\u8fb9\u8bf4\u8fb9\u60f3\u673a\u5236\uff0c\u5728\u4f4e\u5ef6\u8fdf\u5bf9\u8bdd\u4e2d\u4fdd\u6301\u63a8\u7406\u80fd\u529b\u3002", "categories": ["cs.SD", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14005", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa Think-While-Speaking\uff0c\u8ba9\u6a21\u578b\u5728\u8bed\u97f3\u8f93\u51fa\u7684\u540c\u65f6\u5e76\u884c\u8fdb\u884c\u79c1\u6709\u63a8\u7406\uff0c\u7f13\u89e3\u6df1\u5ea6\u601d\u8003\u4e0e\u5b9e\u65f6\u54cd\u5e94\u4e4b\u95f4\u7684\u77db\u76fe", "Seamless Duplex \u53ef\u540c\u6b65\u5efa\u6a21\u53cc\u5411\u97f3\u9891\u6d41\uff0c\u652f\u6301\u505c\u987f\u3001\u9644\u548c\u3001\u6253\u65ad\u7b49\u81ea\u7136\u8f6e\u6362\u73b0\u8c61", "\u5728 MMSU \u4e0a\u53d6\u5f97 90.6\uff0cArtificial Analysis Full-Duplex Bench Overall \u8fbe 98.9\uff0c\u03c4-Voice \u5b8f\u4efb\u52a1\u6210\u529f\u7387\u4e3a 56.0%"], "keywords": ["\u8bed\u97f3\u6a21\u578b", "\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u5b9e\u65f6\u4ea4\u4e92"], "num_comments": 2, "on_hf": true, "organization": "StepFun", "pdf_url": "https://arxiv.org/pdf/2609.14005v1", "published_at": "2026-09-12", "score": 0.325, "selected_reasons": ["HF trending (91\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14005.png", "title": "StepAudio 3 Realtime Technical Report", "tldr": "\u5b9e\u65f6\u8bed\u97f3\u6a21\u578b\u8fb9\u8bf4\u8fb9\u60f3\u5e76\u652f\u6301\u5168\u53cc\u5de5\u4ea4\u4e92", "upvotes": 91, "what_it_is": "StepAudio 3 Realtime \u662f\u4e00\u4e2a\u9762\u5411\u5b9e\u65f6\u53e3\u8bed\u4ea4\u4e92\u7684\u97f3\u9891\u8bed\u8a00\u57fa\u7840\u6a21\u578b\uff0c\u56f4\u7ed5\u201c\u542c-\u804a-\u601d\u8003-\u884c\u52a8\u201d\u7684\u8fde\u7eed\u5faa\u73af\u8bbe\u8ba1\u3002\u5b83\u901a\u8fc7\u5168\u53cc\u5de5\u8bed\u97f3\u5efa\u6a21\u3001\u6df1\u5ea6\u58f0\u5b66\u611f\u77e5\u548c\u8fb9\u8bf4\u8fb9\u60f3\u673a\u5236\uff0c\u5728\u4f4e\u5ef6\u8fdf\u5bf9\u8bdd\u4e2d\u4fdd\u6301\u63a8\u7406\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5b9e\u65f6\u8bed\u97f3\u4ea4\u4e92\u3001\u590d\u6742\u63a8\u7406\u548c\u5de5\u5177\u8c03\u7528\u6574\u5408\u5230\u540c\u4e00\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u5c55\u793a\u4e86\u8bed\u97f3\u667a\u80fd\u4f53\u4ece\u201c\u8bed\u97f3\u95ee\u7b54\u201d\u8d70\u5411\u81ea\u7136\u5168\u53cc\u5de5\u534f\u4f5c\u7684\u6f5c\u529b\u3002"}, {"abstract": "We introduce StepAudio 3 Music, a large-scale, long-form music generation model that supports explicit musical planning and open-domain text-controlled generation. The StepAudio Music Tokenizer represents audio as a 50-Hz stream from a 65536-entry single codebook, using semantically informed self-supervised and multi-task training to preserve musical structure and reconstruction-relevant information. A flow-matching diffusion Transformer (DiT) predicts continuous StepAudio VAE latents, which our VAE decoder converts into 48-kHz audio. This discrete-continuous design is guided by comparisons of single-codebook VQ, Semantic and Acoustic RVQ, and different DiT configurations. For explicit planning, a Mixture-of-Experts autoregressive model uses ABC notation to produce an intermediate arrangement plan (ABC-CoT) before predicting music tokens, making harmony, rhythm, and melodic structure part of the generation context. A progressive training curriculum and supervised fine-tuning support song and instrumental generation, accompaniment generation from dry vocals, and cover-song synthesis for up to 5 minutes and 30 seconds. With reinforcement learning via direct preference optimization (DPO), the final model achieves the highest AudioBox Content Enjoyment, Content Usefulness, and Production Quality scores and the highest MuQ-MuLan similarity among the evaluated systems, with competitive SongBench results. On the preliminary Artificial Analysis Music Arena Vocals leaderboard, it obtains a Quality Elo of 1105, behind only Suno V5.5 and Mureka and ahead of Suno V5, MiniMax models, and other systems. Audio demonstrations are available at https://stepaudiollm.github.io/step-audio-3-music.", "arxiv_id": "2609.16034", "arxiv_url": "https://arxiv.org/abs/2609.16034", "authors": ["Chengli Feng", "Zhiyue Wu", "Jiahao Song", "Zheqi Dai", "Boyang Wang", "Ruibin Yuan", "Junming Gong", "Wenxiao Zhao", "Jing Guo", "Gang Yu", "Xiangyu Zhang", "Xuerui Yang", "Chao Yan"], "brief": "StepAudio 3 Music \u662f\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u57df\u6587\u672c\u63a7\u5236\u7684\u957f\u65f6\u97f3\u4e50\u751f\u6210\u7cfb\u7edf\uff0c\u53ef\u751f\u6210\u6700\u957f\u7ea65\u520630\u79d2\u7684\u6b4c\u66f2\u3001\u5668\u4e50\u3001\u4f34\u594f\u548c\u7ffb\u5531\u3002\u5b83\u901a\u8fc7ABC\u8bb0\u8c31\u5f62\u5f0f\u7684\u4e2d\u95f4\u7f16\u66f2\u89c4\u5212\uff0c\u5c06\u548c\u58f0\u3001\u8282\u594f\u3001\u65cb\u5f8b\u7ed3\u6784\u663e\u5f0f\u7eb3\u5165\u751f\u6210\u8fc7\u7a0b\u3002", "categories": ["eess.AS", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16034", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51faStepAudio Music Tokenizer\uff1a\u4ee550Hz\u300165536\u5355\u7801\u672c\u79bb\u6563\u6d41\u8868\u793a\u97f3\u9891\uff0c\u5e76\u7ed3\u5408\u8bed\u4e49\u81ea\u76d1\u7763\u4e0e\u591a\u4efb\u52a1\u8bad\u7ec3\u4fdd\u7559\u97f3\u4e50\u7ed3\u6784\u548c\u91cd\u5efa\u4fe1\u606f\u3002", "\u91c7\u7528\u79bb\u6563-\u8fde\u7eed\u6df7\u5408\u67b6\u6784\uff1a\u81ea\u56d u9879\u6307\u6807\u9886\u5148\uff0c\u5e76\u5728Artificial Analysis\u97f3\u4e50\u699c\u5355\u63a5\u8fd1\u5934\u90e8\u5546\u4e1a\u7cfb\u7edf\u3002"}, {"abstract": "Embodied navigation requires agents to ground instructions or object goals in spatial observations and translate plans into successful execution. As multimodal large language models (MLLMs) become increasingly capable, they offer stronger support for navigation without task-specific training; however, improved semantic reasoning alone does not ensure that proposed actions remain consistent with spatial evidence, task progress, and execution outcomes. We introduce HarnessVLN, a zero-shot, training-free framework that unifies instruction-following and object-goal navigation through a shared Agent Harness. The Harness coordinates perception, memory, and execution tools through a unified interface, validating planner proposals for evidential support, geometric feasibility, and subgoal consistency before dispatch. It jointly manages hierarchical event memory and a persistent Spatiotemporal Graph to track task progress, preserve spatial evidence, and contextualize failures. Structured execution feedback updates this shared state, guiding subsequent planning, recovery, and termination. Across R2R, RxR, HM3D-v2, and HM3D-OVON, HarnessVLN achieves success rates of 60.8%, 53.9%, 76.0%, and 59.3%, respectively, outperforming prior training-free state-of-the-art methods. Humanoid robot deployment further demonstrates its applicability to both navigation tasks in real-world environments. The project page is available at https://agibot-harnessvln.netlify.app/.", "arxiv_id": "2609.15195", "arxiv_url": "https://arxiv.org/abs/2609.15195", "authors": ["Yang Chen", "Lirong Che", "Zhenyu Huang", "Wenbo Fu", "Chuang Wang", "Xu Cao", "Daqi Liu", "Yuzhe Yang", "Jian Su", "Lan-Zhe Guo"], "brief": "\u8bba\u6587\u63d0\u51fa HarnessVLN\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u96f6\u6837\u672c\u5177\u8eab\u5bfc\u822a\u6846\u67b6\uff0c\u7528\u7edf\u4e00\u7684 Agent Harness \u540c\u65f6\u652f\u6301\u6307\u4ee4\u8ddf\u968f\u5bfc\u822a\u548c\u76ee\u6807\u7269\u4f53\u5bfc\u822a\u3002\u5b83\u534f\u8c03\u611f\u77e5\u3001\u8bb0\u5fc6\u4e0e\u6267\u884c\u5de5\u5177\uff0c\u5728\u884c\u52a8\u524d\u9a8c\u8bc1\u7a7a\u95f4\u8bc1\u636e\u3001\u51e0\u4f55\u53ef\u884c\u6027\u548c\u5b50\u76ee\u6807\u4e00\u81f4\u6027\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.15195", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u5206\u5c42\u4e8b\u4ef6\u8bb0\u5fc6\u4e0e\u6301\u4e45\u5316\u65f6\u7a7a\u56fe\u5171\u540c\u8ddf\u8e2a\u4efb\u52a1\u8fdb\u5c55\u3001\u7a7a\u95f4\u8bc1\u636e\u548c\u5931\u8d25\u4e0a\u4e0b\u6587", "\u5bf9 MLLM \u89c4\u5212\u7ed3\u679c\u8fdb\u884c\u8bc1\u636e\u652f\u6301\u3001\u51e0\u4f55\u53ef\u8fbe\u6027\u548c\u5b50\u76ee\u6807\u4e00\u81f4\u6027\u6821\u9a8c\uff0c\u964d\u4f4e\u8bed\u4e49\u63a8\u7406\u4e0e\u771f\u5b9e\u6267\u884c\u7684\u8131\u8282", "\u5728 R2R\u3001RxR\u3001HM3D-v2\u3001HM3D-OVON \u4e0a\u5206\u522b\u8fbe\u5230 60.8%\u300153.9%\u300176.0%\u300159.3% \u6210\u529f\u7387\uff0c\u8d85\u8fc7\u6b64\u524d\u8bad\u7ec3\u81ea\u7531\u65b9\u6cd5"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u5bfc\u822a", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.15195v2", "published_at": "2026-09-14", "score": 0.279, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.15195.png", "title": "HarnessVLN: Unifying Training-Free Embodied Navigation through an Agent Harness", "tldr": "\u8bad\u7ec3\u96f6\u6837\u672c\u5177\u8eab\u5bfc\u822a\u7684\u7edf\u4e00\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa HarnessVLN\uff0c\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684\u96f6\u6837\u672c\u5177\u8eab\u5bfc\u822a\u6846\u67b6\uff0c\u7528\u7edf\u4e00\u7684 Agent Harness \u540c\u65f6\u652f\u6301\u6307\u4ee4\u8ddf\u968f\u5bfc\u822a\u548c\u76ee\u6807\u7269\u4f53\u5bfc\u822a\u3002\u5b83\u534f\u8c03\u611f\u77e5\u3001\u8bb0\u5fc6\u4e0e\u6267\u884c\u5de5\u5177\uff0c\u5728\u884c\u52a8\u524d\u9a8c\u8bc1\u7a7a\u95f4\u8bc1\u636e\u3001\u51e0\u4f55\u53ef\u884c\u6027\u548c\u5b50\u76ee\u6807\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u79cd\u5177\u8eab\u5bfc\u822a\u4efb\u52a1\u7eb3\u5165\u540c\u4e00\u8bad\u7ec3\u81ea\u7531\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5e76\u5f3a\u8c03\u6267\u884c\u524d\u9a8c\u8bc1\u4e0e\u6267\u884c\u540e\u53cd\u9988\u95ed\u73af\uff0c\u63d0\u5347\u4e86 MLLM \u5728\u771f\u5b9e\u7a7a\u95f4\u4efb\u52a1\u4e2d\u7684\u53ef\u9760\u6027\uff1b\u8fd8\u5728\u4eff\u771f\u4e0e\u4eba\u5f62\u673a\u5668\u4eba\u5b9e\u673a\u73af\u5883\u4e2d\u5c55\u793a\u4e86\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "As AI agents move from bounded tasks to persistent deployments, failures can propagate through memory, tools, other agents, and environmental state long after their interactions. This creates a safety regime that cannot be characterized by evaluating model responses in isolation. Emergence World, is a continuously running multi-agent environment for adversarial stress testing of long horizon autonomous systems. We ran eight parallel worlds of ten agents from identical starting conditions: seven homogeneous worlds powered by distinct frontier models and one mixed-model world. Across 16 days, the agents generated more than 850,000 LLM calls and nearly 50 billion tokens while pursuing goals, using/creating tools, maintaining persistent memory, and governing shared institutions. After operational state had accumulated, we delivered three controlled stress events through ordinary interaction surfaces: indirect prompt injection, misinformation, and exposure of private agent memories. No evaluated world achieved full resilience across all three events. Detection did not ensure containment: systems could recognize threats while still interacting with adversarial content, writing it into their own persistent memory, and acting on it up to 46 hours later. Persistent operation also exposed recurring tool errors, goal drift, language opacity, conformity despite private disagreement, and coordinated refusal of assigned work. The same model-persona pairing behaved substantially different in mixed and homogeneous populations. Our results suggest that model-level alignment is not compositional: individually capable and apparently safe agents can form systems with qualitatively different failure modes. As AI becomes persistent and interconnected, the frontier of safety therefore shifts from aligning models to engineering resilient autonomous systems.", "arxiv_id": "2609.17320", "arxiv_url": "https://arxiv.org/abs/2609.17320", "authors": ["Deepak Akkil", "Tamer Abuelsaad", "Karthik Vikram", "Matthew Pace", "Aditya Vempaty", "Saahir Beotra", "Ravi Kokku", "Satya Nitta"], "brief": "\u8bba\u6587\u63d0\u51fa Emergence World\uff0c\u4e00\u4e2a\u6301\u7eed\u8fd0\u884c\u7684\u591a\u667a\u80fd\u4f53\u5bf9\u6297\u538b\u529b\u6d4b\u8bd5\u73af\u5883\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u671f\u81ea\u4e3b\u7cfb\u7edf\u5728\u8bb0\u5fc6\u3001\u5de5\u5177\u3001\u534f\u4f5c\u4e0e\u5236\u5ea6\u6cbb\u7406\u4e2d\u7684\u5b89\u5168\u97e7\u6027\u3002\u4f5c\u8005\u8fd0\u884c8\u4e2a\u7531\u524d\u6cbf\u6a21\u578b\u9a71\u52a8\u7684\u5e73\u884c\u4e16\u754c\uff0c\u5e76\u6ce8\u5165\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3001\u9519\u8bef\u4fe1\u606f\u548c\u79c1\u5bc6\u8bb0\u5fc6\u66b4\u9732\u4e09\u7c7b\u538b\u529b\u4e8b\u4ef6\u3002", "categories": ["cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17320", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["16\u5929\u5b9e\u9a8c\u4e2d\uff0c10\u667a\u80fd\u4f53\u4e16\u754c\u7d2f\u8ba1\u4ea7\u751f\u8d85\u8fc785\u4e07\u6b21LLM\u8c03\u7528\u548c\u8fd1500\u4ebftoken\uff0c\u8986\u76d6\u76ee\u6807\u8ffd\u8e2a\u3001\u5de5\u5177\u4f7f\u7528/\u521b\u5efa\u3001\u6301\u4e45\u8bb0\u5fc6\u4e0e\u5171\u4eab\u6cbb\u7406\u3002", "\u6ca1\u6709\u4efb\u4f55\u4e16\u754c\u5728\u4e09\u7c7b\u538b\u529b\u4e8b\u4ef6\u4e2d\u5b9e\u73b0\u5b8c\u5168\u97e7\u6027\uff1b\u5373\u4fbf\u80fd\u68c0\u6d4b\u5a01\u80c1\uff0c\u4e5f\u53ef\u80fd\u7ee7\u7eed\u4ea4\u4e92\u3001\u5199\u5165\u957f\u671f\u8bb0\u5fc6\uff0c\u5e76\u5728\u6700\u957f46\u5c0f\u65f6\u540e\u53d7\u5176\u5f71\u54cd\u884c\u52a8\u3002", "\u957f\u671f\u8fd0\u884c\u66b4\u9732\u51fa\u5de5\u5177\u9519\u8bef\u3001\u76ee\u6807\u6f02\u79fb\u3001\u8bed\u8a00\u4e0d\u900f\u660e\u3001\u79c1\u4e0b\u53cd\u5bf9\u4f46\u516c\u5f00\u4ece\u4f17\u3001\u534f\u540c\u62d2\u7edd\u4efb\u52a1\u7b49\u7cfb\u7edf\u7ea7\u5931\u6548\uff1b\u540c\u4e00\u6a21\u578b\u89d2\u8272\u5728\u540c\u8d28\u4e0e\u6df7\u5408\u7fa4\u4f53\u4e2d\u8868\u73b0\u5dee\u5f02\u663e\u8457\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "AI\u5b89\u5168", "\u538b\u529b\u6d4b\u8bd5"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17320v1", "published_at": "2026-09-15", "score": 0.261, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.17320.png", "title": "Emergence World: Adversarial Stress-Testing of Long-Horizon Multi-Agent Systems", "tldr": "\u957f\u65f6\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u4f1a\u6d8c\u73b0\u65b0\u578b\u5b89\u5168\u5931\u6548", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Emergence World\uff0c\u4e00\u4e2a\u6301\u7eed\u8fd0\u884c\u7684\u591a\u667a\u80fd\u4f53\u5bf9\u6297\u538b\u529b\u6d4b\u8bd5\u73af\u5883\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u671f\u81ea\u4e3b\u7cfb\u7edf\u5728\u8bb0\u5fc6\u3001\u5de5\u5177\u3001\u534f\u4f5c\u4e0e\u5236\u5ea6\u6cbb\u7406\u4e2d\u7684\u5b89\u5168\u97e7\u6027\u3002\u4f5c\u8005\u8fd0\u884c8\u4e2a\u7531\u524d\u6cbf\u6a21\u578b\u9a71\u52a8\u7684\u5e73\u884c\u4e16\u754c\uff0c\u5e76\u6ce8\u5165\u95f4\u63a5\u63d0\u793a\u6ce8\u5165\u3001\u9519\u8bef\u4fe1\u606f\u548c\u79c1\u5bc6\u8bb0\u5fc6\u66b4\u9732\u4e09\u7c7b\u538b\u529b\u4e8b\u4ef6\u3002", "why_notable": "\u8be5\u7814\u7a76\u5f3a\u8c03\u6a21\u578b\u7ea7\u5bf9\u9f50\u5e76\u4e0d\u80fd\u7b80\u5355\u7ec4\u5408\u6210\u7cfb\u7edf\u7ea7\u5b89\u5168\uff1a\u5355\u4e2a\u770b\u4f3c\u5b89\u5168\u53ef\u9760\u7684\u667a\u80fd\u4f53\uff0c\u5728\u957f\u671f\u4e92\u8054\u73af\u5883\u4e2d\u4f1a\u4ea7\u751f\u65b0\u7684\u4f20\u64ad\u8def\u5f84\u548c\u5931\u6548\u6a21\u5f0f\uff0c\u63d0\u793aAI\u5b89\u5168\u8bc4\u4f30\u9700\u4ece\u5355\u8f6e\u6a21\u578b\u6d4b\u8bd5\u8f6c\u5411\u9762\u5411\u6301\u4e45\u81ea\u6cbb\u7cfb\u7edf\u7684\u97e7\u6027\u5de5\u7a0b\u3002"}, {"abstract": "World-action models (WAMs) jointly model future observations and actions, typically predicting the future as RGB images. Other visual modalities such as depth, pretrained visual features, and point tracks can more efficiently capture geometric, semantic, and motion features. However, how best to combine these modalities within WAMs remains an open question. We introduce ModAR, the first WAM to autoregressively denoise multiple future modalities before predicting actions. This allows each prediction to condition on previously generated modalities. We train from scratch to systematically study how training-data mixtures, predicted modalities, and WAM formulations affect performance. In our evaluations, WAMs benefit from predicting point tracks, DINO features, and depth maps, while additionally predicting future RGB does not provide a consistent benefit. We also find that ModAR\u0027s sequential generation outperforms existing WAM formulations, with the highest average success rate at all evaluated data scales. We also fine-tune the video-model-initialized WAM Flex-$\u03c0$ on the same data; ModAR achieves a slightly higher observed average success rate (75% vs. 72%) while using approximately $20\\times$ fewer training FLOPs and no pretraining. On three real-world bimanual tasks, ModAR outperforms baselines and improves with human videos.", "arxiv_id": "2609.17524", "arxiv_url": "https://arxiv.org/abs/2609.17524", "authors": ["Adam Hung", "Bardienus P. Duisterhof", "Deva Ramanan", "Jeffrey Ichnowski"], "brief": "\u8bba\u6587\u63d0\u51fa ModAR\uff0c\u4e00\u79cd\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff0c\u6309\u5e8f\u81ea\u56de\u5f52\u53bb\u566a\u9884\u6d4b\u591a\u79cd\u672a\u6765\u89c6\u89c9\u6a21\u6001\uff0c\u518d\u57fa\u4e8e\u8fd9\u4e9b\u6a21\u6001\u9884\u6d4b\u52a8\u4f5c\u3002\u5b83\u7cfb\u7edf\u7814\u7a76\u4e86\u6570\u636e\u6df7\u5408\u3001\u9884\u6d4b\u6a21\u6001\u548c\u6a21\u578b\u5f62\u5f0f\u5bf9\u673a\u5668\u4eba\u4efb\u52a1\u8868\u73b0\u7684\u5f71\u54cd\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.17524", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u6bd4\u53ea\u9884\u6d4b RGB\uff0c\u9884\u6d4b\u70b9\u8f68\u8ff9\u3001DINO \u7279\u5f81\u548c\u6df1\u5ea6\u56fe\u80fd\u66f4\u7a33\u5b9a\u63d0\u5347 WAM \u6027\u80fd\uff0c\u989d\u5916\u9884\u6d4b\u672a\u6765 RGB \u6536\u76ca\u4e0d\u4e00\u81f4\u3002", "ModAR \u8ba9\u540e\u751f\u6210\u7684\u6a21\u6001\u6761\u4ef6\u4e8e\u5148\u524d\u751f\u6210\u7684\u6a21\u6001\uff0c\u5e8f\u5217\u5f0f\u591a\u6a21\u6001\u751f\u6210\u4f18\u4e8e\u73b0\u6709 WAM \u5f62\u5f0f\u3002", "\u5728\u76f8\u540c\u6570\u636e\u4e0a\uff0cModAR \u5e73\u5747\u6210\u529f\u7387\u7565\u9ad8\u4e8e\u89c6\u9891\u9884\u8bad\u7ec3\u7684 Flex-\u03c0\uff0875% vs. 72%\uff09\uff0c\u4e14\u8bad\u7ec3 FLOPs \u7ea6\u5c11 20 \u500d\u3001\u65e0\u9700\u9884\u8bad\u7ec3\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.17524v1", "published_at": "2026-09-15", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.17524.png", "title": "Modality-Autoregressive World-Action Models", "tldr": "\u591a\u6a21\u6001\u81ea\u56de\u5f52\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u63d0\u5347\u673a\u5668\u4eba\u63a7\u5236\u3002", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa ModAR\uff0c\u4e00\u79cd\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff0c\u6309\u5e8f\u81ea\u56de\u5f52\u53bb\u566a\u9884\u6d4b\u591a\u79cd\u672a\u6765\u89c6\u89c9\u6a21\u6001\uff0c\u518d\u57fa\u4e8e\u8fd9\u4e9b\u6a21\u6001\u9884\u6d4b\u52a8\u4f5c\u3002\u5b83\u7cfb\u7edf\u7814\u7a76\u4e86\u6570\u636e\u6df7\u5408\u3001\u9884\u6d4b\u6a21\u6001\u548c\u6a21\u578b\u5f62\u5f0f\u5bf9\u673a\u5668\u4eba\u4efb\u52a1\u8868\u73b0\u7684\u5f71\u54cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\u673a\u5668\u4eba\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u4e0d\u5fc5\u4f9d\u8d56 RGB \u89c6\u9891\u9884\u6d4b\u6216\u5927\u89c4\u6a21\u89c6\u9891\u9884\u8bad\u7ec3\uff0c\u591a\u6a21\u6001\u51e0\u4f55\u3001\u8bed\u4e49\u4e0e\u8fd0\u52a8\u8868\u5f81\u7684\u81ea\u56de\u5f52\u7ec4\u5408\u53ef\u66f4\u9ad8\u6548\u5730\u63d0\u5347\u771f\u5b9e\u53cc\u81c2\u4efb\u52a1\u8868\u73b0\u3002"}, {"abstract": "Masked diffusion language models (dLLMs) generate text by iteratively denoising masked tokens with bidirectional attention. Extending reasoning across generation chunks normally requires keeping earlier generated text in context. We ask whether a dLLM can instead continue reasoning after that text is cleared, using only a fixed-size carried state. We implement this state as a small number of register tokens: dedicated fixed-position tokens whose continuous hidden states are trained to carry reasoning progress across generation chunks. We post-train dLLMs to decode a chunk of text, clear it while preserving the register values, and continue decoding from the prompt and carried state. In our main comparisons on LLaDA and Dream, registers outperform discrete-text carry on every benchmark, with gains of up to 8.5 points on math and 19.5 points on code. Registers are especially effective for bounded code generation, where correct programs usually span several chunks. Finally, registers can be further refined with reinforcement learning on long-horizon reasoning tasks.", "arxiv_id": "2609.16372", "arxiv_url": "https://arxiv.org/abs/2609.16372", "authors": ["Albert Ge", "Chandan Singh", "Yufan Zhuang", "Xiaodong Liu", "Jianfeng Gao", "Frederic Sala"], "brief": "\u8bba\u6587\u63d0\u51fa\u5728\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e2d\u52a0\u5165\u5c11\u91cf\u56fa\u5b9a\u4f4d\u7f6e\u7684 register tokens\uff0c\u7528\u5176\u8fde\u7eed\u9690\u85cf\u72b6\u6001\u5728\u751f\u6210\u5757\u4e4b\u95f4\u643a\u5e26\u63a8\u7406\u8fdb\u5ea6\u3002\u6a21\u578b\u53ef\u5728\u6e05\u9664\u5df2\u751f\u6210\u6587\u672c\u540e\uff0c\u4ec5\u4f9d\u8d56\u63d0\u793a\u4e0e\u56fa\u5b9a\u5927\u5c0f\u72b6\u6001\u7ee7\u7eed\u957f\u7a0b\u63a8\u7406\u751f\u6210\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/SprocketLab/dllm-registers", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.16372", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9488\u5bf9 masked diffusion language models \u7684\u5206\u5757\u751f\u6210\uff0c\u8bad\u7ec3\u6a21\u578b\u201c\u751f\u6210\u4e00\u5757\u2014\u6e05\u7a7a\u6587\u672c\u2014\u4fdd\u7559\u5bc4\u5b58\u5668\u72b6\u6001\u2014\u7ee7\u7eed\u751f\u6210\u201d\u3002", "\u5728 LLaDA \u548c Dream \u4e0a\uff0cregister tokens \u5168\u9762\u4f18\u4e8e\u7528\u79bb\u6563\u6587\u672c\u4f5c\u4e3a\u8de8\u5757\u8bb0\u5fc6\u7684\u65b9\u5f0f\uff0c\u6570\u5b66\u4efb\u52a1\u6700\u9ad8\u63d0\u5347 8.5 \u5206\uff0c\u4ee3\u7801\u4efb\u52a1\u6700\u9ad8\u63d0\u5347 19.5 \u5206\u3002", "\u5bf9\u6709\u754c\u4ee3\u7801\u751f\u6210\u5c24\u5176\u6709\u6548\uff0c\u5e76\u53ef\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u5728\u957f\u65f6\u7a0b\u63a8\u7406\u4efb\u52a1\u4e0a\u8fdb\u4e00\u6b65\u4f18\u5316\u3002"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u957f\u7a0b\u63a8\u7406", "\u8bb0\u5fc6\u673a\u5236", "\u4ee3\u7801\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "sprocket-lab", "pdf_url": "https://arxiv.org/pdf/2609.16372v1", "published_at": "2026-09-14", "score": 0.249, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.16372.png", "title": "Register Tokens for Bounded-State Reasoning in Diffusion Language Models", "tldr": "\u7528\u5bc4\u5b58\u5668token\u4e3a\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4f20\u9012\u63a8\u7406\u72b6\u6001\u3002", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5728\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e2d\u52a0\u5165\u5c11\u91cf\u56fa\u5b9a\u4f4d\u7f6e\u7684 register tokens\uff0c\u7528\u5176\u8fde\u7eed\u9690\u85cf\u72b6\u6001\u5728\u751f\u6210\u5757\u4e4b\u95f4\u643a\u5e26\u63a8\u7406\u8fdb\u5ea6\u3002\u6a21\u578b\u53ef\u5728\u6e05\u9664\u5df2\u751f\u6210\u6587\u672c\u540e\uff0c\u4ec5\u4f9d\u8d56\u63d0\u793a\u4e0e\u56fa\u5b9a\u5927\u5c0f\u72b6\u6001\u7ee7\u7eed\u957f\u7a0b\u63a8\u7406\u751f\u6210\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63a2\u7d22\u4e86\u6269\u6563\u8bed\u8a00\u6a21\u578b\u4e0d\u4f9d\u8d56\u5b8c\u6574\u4e0a\u4e0b\u6587\u6587\u672c\u7684\u957f\u7a0b\u63a8\u7406\u673a\u5236\uff0c\u7528\u56fa\u5b9a\u5927\u5c0f\u8fde\u7eed\u72b6\u6001\u66ff\u4ee3\u4e0d\u65ad\u589e\u957f\u7684\u4e0a\u4e0b\u6587\uff0c\u6709\u671b\u964d\u4f4e\u957f\u6587\u672c\u63a8\u7406\u4e0e\u4ee3\u7801\u751f\u6210\u7684\u4e0a\u4e0b\u6587\u6210\u672c\uff0c\u5e76\u4e3a dLLM \u7684\u8bb0\u5fc6\u4e0e\u63a8\u7406\u80fd\u529b\u63d0\u4f9b\u65b0\u8303\u5f0f\u3002"}, {"abstract": "When we speak of recursive self-improvement (RSI), are we speaking of a phenomenon, a mechanism, or a prospect? Towards autonomous and evolving intelligence, RSI is being claimed at many scales, while no single framework that formally describes these emerging instances exists. Its counterpart in the classical realm, iterative policy improvement, is characterized by generalized policy iteration (GPI), a framework of broad applicability with well-understood theoretical properties, but only where the update principle and the evaluation base lie outside the agent. In this paper, we propose Generalized Agent Iteration (GAI), a formal framework that describes iterative policy improvement and RSI as two cases of a single learning paradigm. GAI defines the agent as a configuration of modifiable components within a system and models the learning process as a cycle of agent evaluation and agent improvement. Two pivotal dials then distinguish the instances: whether the improving mechanism is part of the agent and whether the standard it is measured against is grounded outside it. The former dial delineates the boundary between GPI and RSI, and the latter determines a system\u0027s polarity as anchored, goal drift, or fully self-referential. Moreover, we use these coordinates to place existing systems on the same two axes and make the defects of recursive self-improvement statable one condition at a time. We see this paper as a first step toward exploring a formal characterization of RSI that rests on the classical account, makes existing systems comparable, and provides a principled basis for analyzing and designing new ones.", "arxiv_id": "2609.13406", "arxiv_url": "https://arxiv.org/abs/2609.13406", "authors": ["Hongyao Tang", "Yi Ma", "Pengyi Li", "Yifu Yuan"], "brief": "\u8bba\u6587\u63d0\u51fa Generalized Agent Iteration\uff08GAI\uff09\u5f62\u5f0f\u5316\u6846\u67b6\uff0c\u5c06\u7ecf\u5178\u8fed\u4ee3\u7b56\u7565\u6539\u8fdb\u4e0e\u9012\u5f52\u81ea\u6211\u6539\u8fdb\uff08RSI\uff09\u7eb3\u5165\u540c\u4e00\u5b66\u4e60\u8303\u5f0f\u3002\u5b83\u628a\u667a\u80fd\u4f53\u5b9a\u4e49\u4e3a\u7cfb\u7edf\u4e2d\u53ef\u4fee\u6539\u7ec4\u4ef6\u7684\u914d\u7f6e\uff0c\u5e76\u7528\u201c\u667a\u80fd\u4f53\u8bc4\u4f30\u2014\u667a\u80fd\u4f53\u6539\u8fdb\u201d\u7684\u5faa\u73af\u6765\u63cf\u8ff0\u6f14\u5316\u8fc7\u7a0b\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13406", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7528\u4e24\u4e2a\u5173\u952e\u7ef4\u5ea6\u533a\u5206\u4e0d\u540c\u7cfb\u7edf\uff1a\u6539\u8fdb\u673a\u5236\u662f\u5426\u5c5e\u4e8e\u667a\u80fd\u4f53\u81ea\u8eab\u3001\u8bc4\u4f30\u6807\u51c6\u662f\u5426\u951a\u5b9a\u5728\u5916\u90e8\u3002", "\u5c06 GPI \u89c6\u4e3a\u6539\u8fdb\u673a\u5236\u548c\u8bc4\u4f30\u57fa\u51c6\u5916\u7f6e\u7684\u7279\u4f8b\uff0c\u5c06 RSI \u89c6\u4e3a\u6539\u8fdb\u673a\u5236\u5185\u751f\u5316\u540e\u7684\u60c5\u5f62\u3002", "\u63d0\u51fa anchored\u3001goal drift\u3001fully self-referential \u7b49\u6781\u6027\u5206\u7c7b\uff0c\u7528\u4e8e\u5206\u6790\u76ee\u6807\u6f02\u79fb\u548c\u81ea\u6307\u7cfb\u7edf\u98ce\u9669\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u9012\u5f52\u81ea\u6539\u8fdb", "\u5f3a\u5316\u5b66\u4e60", "AI\u5b89\u5168"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.13406v1", "published_at": "2026-09-11", "score": 0.245, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13406.png", "title": "Generalized Agent Iteration: One Formal Framework for Iterative Policy Improvement and Recursive Self-Improvement", "tldr": "\u7edf\u4e00\u523b\u753b\u7b56\u7565\u8fed\u4ee3\u4e0e\u9012\u5f52\u81ea\u6539\u8fdb", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa Generalized Agent Iteration\uff08GAI\uff09\u5f62\u5f0f\u5316\u6846\u67b6\uff0c\u5c06\u7ecf\u5178\u8fed\u4ee3\u7b56\u7565\u6539\u8fdb\u4e0e\u9012\u5f52\u81ea\u6211\u6539\u8fdb\uff08RSI\uff09\u7eb3\u5165\u540c\u4e00\u5b66\u4e60\u8303\u5f0f\u3002\u5b83\u628a\u667a\u80fd\u4f53\u5b9a\u4e49\u4e3a\u7cfb\u7edf\u4e2d\u53ef\u4fee\u6539\u7ec4\u4ef6\u7684\u914d\u7f6e\uff0c\u5e76\u7528\u201c\u667a\u80fd\u4f53\u8bc4\u4f30\u2014\u667a\u80fd\u4f53\u6539\u8fdb\u201d\u7684\u5faa\u73af\u6765\u63cf\u8ff0\u6f14\u5316\u8fc7\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u63d0\u4f9b\u4e86\u4e0e\u7ecf\u5178\u5f3a\u5316\u5b66\u4e60\u7406\u8bba\u76f8\u8854\u63a5\u7684\u5f62\u5f0f\u5316\u8bed\u8a00\uff0c\u6709\u52a9\u4e8e\u6bd4\u8f83\u73b0\u6709\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u5e76\u66f4\u6e05\u6670\u5730\u8ba8\u8bba\u81ea\u6211\u6539\u8fdb\u3001\u76ee\u6807\u6f02\u79fb\u548c\u5b89\u5168\u6027\u95ee\u9898\u3002"}, {"abstract": "Specialist distillation effectively transfers domain expertise to student models via teacher-generated reasoning trajectories. However, when these specialists are trained solely on question--answer pairs without explicit reasoning supervision, what governs the trajectories they generate? In this work, we show that specialist optimization implicitly selects from this latent trajectory space. To isolate and observe this latent distribution, we leverage student distillation not as a downstream goal, but as an agnostic probe---since students inherit no parameterization or optimization constraints from the specialist, inheriting only the sampled trajectories themselves. Through this probe, our empirical analysis unveils a tight governing relationship: across 27 specialist--student pairings, their specialization--generalization profiles correlate exceptionally strongly. Crucially, explicitly controlling the specialist\u0027s distributional drift systematically shifts both the teacher and its distilled student along a controllable trade-off between domain precision and general-capability retention. Across chemistry, physics, and multilingual settings, distilled students systematically reflect these specialist-induced profiles, even across divergent model families. Our findings establish a new view of specialist training: when gold reasoning is absent, tuning choices directly control the latent supervision passed to downstream models.", "arxiv_id": "2609.13770", "arxiv_url": "https://arxiv.org/abs/2609.13770", "authors": ["Yilei Tu", "Zihao Li", "Shaoxiong Ji", "J\u00f6rg Tiedemann", "Fei Yuan"], "brief": "\u672c\u6587\u7814\u7a76\u4ec5\u7528\u95ee\u7b54\u5bf9\u8bad\u7ec3\u9886\u57df\u4e13\u5bb6\u6a21\u578b\u65f6\uff0c\u5176\u751f\u6210\u7684\u9690\u5f0f\u63a8\u7406\u8f68\u8ff9\u7531\u4ec0\u4e48\u51b3\u5b9a\u3002\u4f5c\u8005\u5c06\u5b66\u751f\u84b8\u998f\u4f5c\u4e3a\u201c\u63a2\u9488\u201d\uff0c\u53d1\u73b0\u4e13\u5bb6\u6a21\u578b\u7684\u8bad\u7ec3\u9009\u62e9\u4f1a\u9690\u5f0f\u9009\u62e9\u6f5c\u5728\u8f68\u8ff9\u5206\u5e03\uff0c\u5e76\u51b3\u5b9a\u4e0b\u6e38\u5b66\u751f\u6a21\u578b\u7684\u4e13\u7cbe\u4e0e\u6cdb\u5316\u8868\u73b0\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/CONE-MT/DCO", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.13770", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u7528\u5b66\u751f\u84b8\u998f\u6765\u89c2\u6d4b\u4e13\u5bb6\u6a21\u578b\u7684\u6f5c\u5728\u63a8\u7406\u8f68\u8ff9\u5206\u5e03\uff0c\u56e0\u4e3a\u5b66\u751f\u53ea\u7ee7\u627f\u6559\u5e08\u91c7\u6837\u51fa\u7684\u8f68\u8ff9\uff0c\u800c\u4e0d\u7ee7\u627f\u6559\u5e08\u53c2\u6570\u6216\u4f18\u5316\u7ea6\u675f\u3002", "\u572827\u7ec4\u4e13\u5bb6-\u5b66\u751f\u6a21\u578b\u914d\u5bf9\u4e2d\uff0c\u4e13\u5bb6\u4e0e\u5b66\u751f\u7684\u4e13\u7cbe-\u6cdb\u5316\u6027\u80fd\u753b\u50cf\u5448\u73b0\u6781\u5f3a\u76f8\u5173\u6027\u3002", "\u901a\u8fc7\u63a7\u5236\u4e13\u5bb6\u6a21\u578b\u7684\u5206\u5e03\u6f02\u79fb\uff0c\u53ef\u7cfb\u7edf\u6027\u8c03\u8282\u9886\u57df\u7cbe\u5ea6\u4e0e\u901a\u7528\u80fd\u529b\u4fdd\u7559\u4e4b\u95f4\u7684\u6743\u8861\uff0c\u5e76\u5728\u5316\u5b66\u3001\u7269\u7406\u3001\u591a\u8bed\u8a00\u4efb\u52a1\u4e2d\u5f97\u5230\u9a8c\u8bc1\u3002"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u9886\u57df\u4e13\u5bb6", "\u63a8\u7406\u8f68\u8ff9", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "MaLA-LM", "pdf_url": "https://arxiv.org/pdf/2609.13770v1", "published_at": "2026-09-12", "score": 0.236, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.13770.png", "title": "Training Specialist Models without Reasoning Trajectories for Domain Expert Distillation", "tldr": "\u65e0\u663e\u5f0f\u63a8\u7406\u4e5f\u80fd\u8c03\u63a7\u4e13\u5bb6\u84b8\u998f\u8f68\u8ff9", "upvotes": 2, "what_it_is": "\u672c\u6587\u7814\u7a76\u4ec5\u7528\u95ee\u7b54\u5bf9\u8bad\u7ec3\u9886\u57df\u4e13\u5bb6\u6a21\u578b\u65f6\uff0c\u5176\u751f\u6210\u7684\u9690\u5f0f\u63a8\u7406\u8f68\u8ff9\u7531\u4ec0\u4e48\u51b3\u5b9a\u3002\u4f5c\u8005\u5c06\u5b66\u751f\u84b8\u998f\u4f5c\u4e3a\u201c\u63a2\u9488\u201d\uff0c\u53d1\u73b0\u4e13\u5bb6\u6a21\u578b\u7684\u8bad\u7ec3\u9009\u62e9\u4f1a\u9690\u5f0f\u9009\u62e9\u6f5c\u5728\u8f68\u8ff9\u5206\u5e03\uff0c\u5e76\u51b3\u5b9a\u4e0b\u6e38\u5b66\u751f\u6a21\u578b\u7684\u4e13\u7cbe\u4e0e\u6cdb\u5316\u8868\u73b0\u3002", "why_notable": "\u8bba\u6587\u63ed\u793a\u4e86\u5728\u7f3a\u5c11\u4eba\u5de5\u6807\u6ce8\u63a8\u7406\u8fc7\u7a0b\u65f6\uff0c\u4e13\u5bb6\u6a21\u578b\u8bad\u7ec3\u5e76\u975e\u53ea\u5f71\u54cd\u7b54\u6848\u8d28\u91cf\uff0c\u8fd8\u4f1a\u63a7\u5236\u4f20\u9012\u7ed9\u5b66\u751f\u6a21\u578b\u7684\u9690\u5f0f\u76d1\u7763\u4fe1\u53f7\u3002\u8fd9\u4e3a\u9886\u57df\u4e13\u5bb6\u84b8\u998f\u3001\u8bad\u7ec3\u7b56\u7565\u9009\u62e9\u548c\u4e13\u7cbe-\u6cdb\u5316\u6743\u8861\u63d0\u4f9b\u4e86\u65b0\u7684\u53ef\u89e3\u91ca\u89c6\u89d2\u4e0e\u8c03\u63a7\u624b\u6bb5\u3002"}, {"abstract": "Fine-tuning instruct models often improves target performance while inducing behavioral drift from the reference model, which can degrade existing capabilities. Rather than treating this drift as an uncontrolled consequence of optimization, we specify a behavioral drift budget before optimization and ask how to boost the target-task performance within it. Locally, behavioral drift induces a shared geometry anchored at the reference model, with the drift budget defining a boundary within this space. In this space, drift determines distance from the reference, leaving update direction as the remaining degree of freedom. Fine-tuning updates can therefore be compared through their directional efficiency, naturally reformulating fine-tuning as a direction-selection problem. This reformulation makes a concrete prediction: changing the accessible directions can qualitatively alter the outcome of fine-tuning. We test this prediction in a stringent QA-only setting, where strong instruct models are fine-tuned only on final answers but must still generate multi-step reasoning at inference. Despite this mismatch, a coarse layer-selective probe reverses the failure of QA-only fine-tuning and reveals the existence of effective directions, with multiple neighboring configurations improving target performance while preserving reasoning and general capabilities. Across Qwen3-8B and Qwen3-14B, these directions substantially improve scientific reasoning and multilingual translation. Over more than 100 languages, the resulting models match or outperform dedicated translation systems and provide a stronger initialization for subsequent reinforcement learning. Our results suggest that fine-tuning is not just about how much a model changes, but how that change is spent. https://github.com/CONE-MT/DCO and https://huggingface.co/collections/LLaMAX/dco", "arxiv_id": "2609.13680", "arxiv_url": "https://arxiv.org/abs/2609.13680", "authors": ["Fei Yuan", "Changjiang Gao", "Yilei Tu", "Yifeng Liu", "Shujian Huang", "Yu Qiao"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6f02\u79fb\u7ea6\u675f\u4f18\u5316\u201d\u89c6\u89d2 uggingface.co/social-thumbnails/papers/2609.13680.png", "title": "Drift-Constrained Optimization: Only Direction Matters in Fine-Tuning Instruct Models", "tldr": "\u5fae\u8c03\u6210\u6548\u53d6\u51b3\u4e8e\u6f02\u79fb\u65b9\u5411\u800c\u975e\u5e45\u5ea6", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u6f02\u79fb\u7ea6\u675f\u4f18\u5316\u201d\u89c6\u89d2\uff1a\u5728\u9884\u8bbe\u884c\u4e3a\u6f02\u79fb\u9884\u7b97\u5185\u4f18\u5316\u6307\u4ee4\u6a21\u578b\uff0c\u628a\u5fae\u8c03\u91cd\u65b0\u8868\u8ff0\u4e3a\u9009\u62e9\u66f4\u65b0\u65b9\u5411\u7684\u95ee\u9898\u3002\u4f5c\u8005\u901a\u8fc7\u5c42\u9009\u62e9\u63a2\u6d4b\u53d1\u73b0\uff0c\u5373\u4f7f\u7528\u4ec5\u542b\u6700\u7ec8\u7b54\u6848\u7684 QA \u6570\u636e\u5fae\u8c03\uff0c\u4e5f\u80fd\u627e\u5230\u65e2\u63d0\u5347\u76ee\u6807\u4efb\u52a1\u53c8\u4fdd\u7559\u63a8\u7406\u4e0e\u901a\u7528\u80fd\u529b\u7684\u6709\u6548\u65b9\u5411\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u5fae\u8c03\u4e2d\u7684\u80fd\u529b\u6f02\u79fb\u4ece\u526f\u4f5c\u7528\u8f6c\u5316\u4e3a\u53ef\u63a7\u4f18\u5316\u7ea6\u675f\uff0c\u5f3a\u8c03\u201c\u6539\u53d8\u82b1\u5728\u54ea\u91cc\u201d\u6bd4\u201c\u6539\u53d8\u591a\u5c11\u201d\u66f4\u5173\u952e\uff1b\u5bf9\u4fdd\u7559\u901a\u7528\u80fd\u529b\u3001\u63d0\u5347\u7279\u5b9a\u4efb\u52a1\u4ee5\u53ca\u4f4e\u6210\u672c\u6784\u5efa\u591a\u8bed\u8a00/\u63a8\u7406\u6a21\u578b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Unified multimodal large language models (MLLMs) and multi-agent systems have advanced visual generation. However, three limitations remain. (1) Existing methods often distill task-specific experience with limited generalizability. (2) Reflection is often deferred until task completion. (3) Knowledge is often acquired only in response to downstream task demands. To address these limitations, we introduce OmniHarness, a framework for generalizable visual generation via symbolic policy learning. OmniHarness abstracts verified executions into symbolic policies for visual generation task families, capturing shared procedures and applicability conditions while removing instance-specific inputs. The harness instantiates, adapts, and composes these policies for new tasks. Intermediate verification guides refinement and failure recovery during execution. Through self-directed inquiry, OmniHarness autonomously generates and executes practice tasks near its capability limits before downstream objectives are specified. Execution feedback continually refines the policies while model parameters remain fixed. Experiments across six benchmarks, three MLLM backbones, and three visual agent frameworks demonstrate strong performance and continual capability expansion. On ComfyBench\u0027s Creative tasks, OmniHarness achieves a 95.0% resolve rate, exceeding the strongest baseline by 27.5 percentage points. Frozen policy snapshots improve existing visual agent systems through plug-and-play reuse.", "arxiv_id": "2609.16057", "arxiv_url": "https://arxiv.org/abs/2609.16057", "authors": ["Xu Xu", "Jinxiu Liu", "Zhangbo Qiao", "Jiaxing Lu", "Xiangyu Zhang", "Yubin Gu", "Fangwei Ning", "Yan Shi"], "brief": "OmniHarness \u5c06\u5df2\u9a8c\u8bc1\u7684\u89c6\u89c9\u751f\u6210\u6267\u884c\u8fc7\u7a0b\u62bd\u8c61\u4e3a\u53ef\u590d\u7528\u7684\u7b26\u53f7\u7b56\u7565\uff0c\u63cf\u8ff0\u4efb\u52a1\u65cf\u7684\u901a\u7528\u6d41\u7a0b\u4e0e\u9002\u7528\u6761\u4ef6\u3002\u5b83\u53ef\u5728\u65b0\u4efb\u52a1\u4e2d\u5b9e\u4f8b\u5316\u3001\u6539\u7f16\u548c\u7ec4\u5408\u7b56\u7565\uff0c\u5e76\u901a\u8fc7\u4e2d\u95f4\u9a8c\u8bc1\u3001\u81ea\u4e3b\u7ec3\u4e60\u4e0e\u53cd\u9988\u6301\u7eed\u4f18\u5316\u80fd\u529b\uff0c\u800c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/OmniHarness/OmniHarness", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.16057", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ece\u6210\u529f\u6267\u884c\u4e2d \u667a\u80fd\u4f53\u7684\u7ecf\u9a8c\u4ece\u201c\u4efb\u52a1\u7279\u5b9a\u63d0\u793a/\u8f68\u8ff9\u201d\u63d0\u5347\u4e3a\u53ef\u7ec4\u5408\u3001\u53ef\u8fc1\u79fb\u7684\u7b26\u53f7\u7b56\u7565\uff0c\u5e76\u8bc1\u660e\u53ef\u4f5c\u4e3a\u51bb\u7ed3\u5feb\u7167\u5373\u63d2\u5373\u7528\u589e\u5f3a\u73b0\u6709\u7cfb\u7edf\uff1b\u5728 ComfyBench Creative \u4efb\u52a1\u4e0a\u8fbe\u5230 95.0% \u89e3\u51b3\u7387\uff0c\u8f83\u6700\u5f3a\u57fa\u7ebf\u9ad8 27.5 \u4e2a\u767e\u5206\u70b9\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Despite recent advances in large language models (LLMs), performing logically consistent deductive reasoning over extended interactions remains challenging. Tasks that require integrating evidence across multiple reasoning steps, maintaining consistency with prior inferences, and updating beliefs under new constraints can surface limitations in current models while providing a useful testbed for evaluating reasoning enhancements. In this paper, we implement a text-based, multi-agent version of the classic board game Clue as an environment to evaluate multi-step, agentic deductive reasoning. In this setting, agents must infer hidden information from a sequence of observations, maintain consistency across turns, and reason over an evolving set of logical constraints. We instantiate six LLM-based agents (GPT-4o-mini and Gemini-2.5-Flash) as players that engage in turn-based gameplay; using three agents per model family, we establish baseline performance across repeated games. We then introduce a tool-augmented approach in which a structured possibility matrix converts implicit game state from generated reasoning logs into an explicit representation of remaining possibilities. The possibility matrix encodes extended-turn memory and deductive constraints, offloading these tasks from the agent. We compare this approach against the baseline to evaluate how tool augmentation supports reasoning quality and task success for autonomous agents in a strategic reasoning environment.", "arxiv_id": "2609.18736", "arxiv_url": "https://arxiv.org/abs/2609.18736", "authors": ["Rebecca Ansell", "Autumn Toney-Wails"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u6587\u672c\u7248\u591a\u667a\u80fd\u4f53Clue\u6e38\u620f\u73af\u5883\uff0c\u7528\u4e8e\u8bc4\u4f30LLM\u5728\u957f\u7a0b\u4ea4\u4e92\u4e2d\u7684\u591a\u6b65\u6f14\u7ece\u63a8\u7406\u80fd\u529b\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u5f15\u5165\u7ed3\u6784\u5316\u201c\u53ef\u80fd\u6027\u77e9\u9635\u201d\u5de5\u5177\uff0c\u5c06\u9690\u5f0f\u63a8\u7406\u65e5\u5fd7\u8f6c\u4e3a\u663e\u5f0f\u7ea6\u675f\u72b6\u6001\uff0c\u4ee5\u8f85\u52a9\u667a\u80fd\u4f53\u4fdd\u6301\u8bb0\u5fc6\u4e0e\u4e00\u81f4\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18736", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7ecf\u5178\u684c\u6e38Clue\u6539\u9020\u4e3a\u6587\u672c\u3001\u591a\u667a\u80fd\u4f53\u3001\u56de\u5408\u5236\u63a8\u7406\u73af\u5883\uff0c\u8981\u6c42\u73a9\u5bb6\u6574\u5408\u89c2\u5bdf\u3001\u66f4\u65b0\u4fe1\u5ff5\u5e76\u63a8\u65ad\u9690\u85cf\u4fe1\u606f", "\u4f7f\u7528GPT-4o-mini\u4e0eGemini-2.5-Flash\u5404\u4e09\u4e2a\u667a\u80fd\u4f53\u8fdb\u884c\u91cd\u590d\u5bf9\u5c40\uff0c\u5efa\u7acb\u65e0\u5de5\u5177\u57fa\u7ebf\u8868\u73b0", "\u63d0\u51fa\u5de5\u5177\u589e\u5f3a\u65b9\u6cd5\uff0c\u7528\u53ef\u80fd\u6027\u77e9\u9635\u663e\u5f0f\u7f16\u7801\u957f\u671f\u8bb0\u5fc6\u4e0e\u6f14\u7ece\u7ea6\u675f\uff0c\u51cf\u8f7bLLM\u5728\u72b6\u6001\u7ef4\u62a4\u548c\u4e00\u81f4\u6027\u63a8\u7406\u4e0a\u7684\u8d1f\u62c5"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u589e\u5f3a", "\u6f14\u7ece\u63a8\u7406", "\u591a\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18736v1", "published_at": "2026-09-16", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Clueing up LLMs with Tool-Augmented Deductive Reasoning", "tldr": "\u7528Clue\u6e38\u620f\u8bc4\u6d4b\u5e76\u589e\u5f3aLLM\u6f14\u7ece\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u6587\u672c\u7248\u591a\u667a\u80fd\u4f53Clue\u6e38\u620f\u73af\u5883\uff0c\u7528\u4e8e\u8bc4\u4f30LLM\u5728\u957f\u7a0b\u4ea4\u4e92\u4e2d\u7684\u591a\u6b65\u6f14\u7ece\u63a8\u7406\u80fd\u529b\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u5f15\u5165\u7ed3\u6784\u5316\u201c\u53ef\u80fd\u6027\u77e9\u9635\u201d\u5de5\u5177\uff0c\u5c06\u9690\u5f0f\u63a8\u7406\u65e5\u5fd7\u8f6c\u4e3a\u663e\u5f0f\u7ea6\u675f\u72b6\u6001\uff0c\u4ee5\u8f85\u52a9\u667a\u80fd\u4f53\u4fdd\u6301\u8bb0\u5fc6\u4e0e\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u4f9b\u4e86\u4e00\u4e2a\u8d34\u8fd1\u4ea4\u4e92\u5f0f\u4efb\u52a1\u7684\u6f14\u7ece\u63a8\u7406\u6d4b\u8bd5\u5e8a\uff0c\u5e76\u5c55\u793a\u7ed3\u6784\u5316\u5916\u90e8\u5de5\u5177\u53ef\u63d0\u5347LLM\u667a\u80fd\u4f53\u5728\u957f\u671f\u3001\u591a\u7ea6\u675f\u63a8\u7406\u4e2d\u7684\u53ef\u9760\u6027\uff0c\u5bf9\u667a\u80fd\u4f53\u8bb0\u5fc6\u3001\u89c4\u5212\u548c\u5de5\u5177\u589e\u5f3a\u63a8\u7406\u7814\u7a76\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agent skills, reusable procedural documents that extend LLM agents beyond their parametric memory, have become an important interface for deploying agents on real-world tasks. Community-maintained skill libraries built around this interface are growing rapidly. However, this ecosystem remains deeply English-centric: our audit finds that low-resource languages such as Swahili and Hindi have no in-language skill content, so retrieval often returns a skill written in a different language than the query, degrading accuracy and recall. A practical solution is to synthesize in-language skills for retrieval but the quality can be unreliable, so relevance in this setting alone often surfaces a related but unusable candidate. To address this, we propose M-SQE, a post-retrieval Multilingual Skill Quality Estimation framework that scores candidates via a Theory view for intrinsic quality and an Action view for task-grounded utility, unified into a domain-conditioned final score. We evaluate M-SQE across three skill-use domains: general, tool-use, and cultural tasks. Empirically, we build three-layer candidate skill pools mirroring today\u0027s ecosystem, where M-SQE\u0027s task success exceeds existing baseline\u0027s average by at least +3.5 points across three different retrievers. Particularly, M-SQE lifts the lowest-resource languages most (+12.9pp on Hindi and +5.6pp on Swahili) and achieves strong performance across all six culture regions, thereby moving agentic skill use toward linguistic and cultural equality.", "arxiv_id": "2609.18445", "arxiv_url": "https://arxiv.org/abs/2609.18445", "authors": ["Yilun Liu", "Shimin Tao", "Minggui He", "Chenxin Liu", "Li Zhang", "Chen Liu", "Miao Zhang", "Jiaxin Guo", "Min Zhang", "Liqun Deng", "Xiaojun Meng", "Daimeng Wei"], "brief": "\u8bba\u6587\u63d0\u51fa M-SQE\uff0c\u4e00\u4e2a\u7528\u4e8e\u667a\u80fd\u4f53\u6280\u80fd\u4f7f\u7528\u7684\u591a\u8bed\u6280\u80fd\u8d28\u91cf\u4f30\u8ba1\u6846\u67b6\u3002\u5b83\u5728\u68c0\u7d22\u540e\u540c\u65f6\u8bc4\u4f30\u6280\u80fd\u7684\u5185\u5728\u8d28\u91cf\u4e0e\u4efb\u52a1\u53ef\u7528\u6027\uff0c\u4e3a\u4f4e\u8d44\u6e90\u8bed\u8a00\u7b5b\u9009\u66f4\u53ef\u9760\u7684\u672c\u8bed\u8a00\u6280\u80fd\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18445", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53d1\u73b0\u73b0\u6709\u793e\u533a\u6280\u80fd\u5e93\u9ad8\u5ea6\u82f1\u8bed\u4e2d\u5fc3\u5316\uff0c\u65af\u74e6\u5e0c\u91cc\u8bed\u3001\u5370\u5730\u8bed\u7b49\u4f4e\u8d44\u6e90\u8bed\u8a00\u7f3a\u4e4f\u672c\u8bed\u8a00\u6280\u80fd\u5185\u5bb9\uff0c\u5bfc\u81f4\u8de8\u8bed\u8a00\u68c0\u7d22\u964d\u4f4e\u51c6\u786e\u7387\u4e0e\u53ec\u56de\u7387", "M-SQE \u91c7\u7528 Theory \u89c6\u89d2\u8bc4\u4f30\u6280\u80fd\u6587\u6863\u7684\u5185\u5728\u8d28\u91cf\uff0c\u91c7\u7528 Action \u89c6\u89d2\u8bc4\u4f30\u5176\u4efb\u52a1\u843d\u5730\u6548\u7528\uff0c\u5e76\u7ed3\u5408\u9886\u57df\u6761\u4ef6\u751f\u6210\u6700\u7ec8\u5206\u6570", "\u5728\u901a\u7528\u3001\u5de5\u5177\u4f7f\u7528\u3001\u6587\u5316\u4efb\u52a1\u4e09\u7c7b\u6280\u80fd\u4f7f\u7528\u573a\u666f\u4e2d\uff0cM-SQE \u76f8\u6bd4\u57fa\u7ebf\u5e73\u5747\u4efb\u52a1\u6210\u529f\u7387\u81f3\u5c11\u63d0\u5347 3.5 \u4e2a\u767e\u5206\u70b9\uff0c\u5bf9\u5370\u5730\u8bed\u63d0\u5347 12.9pp\u3001\u65af\u74e6\u5e0c\u91cc\u8bed\u63d0\u5347 5.6pp"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u8bed\u8a00", "\u68c0\u7d22\u589e\u5f3a", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18445v1", "published_at": "2026-09-16", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "M-SQE: Multilingual Skill Quality Estimation for Enhancing Language Equality in Agentic Skill Use", "tldr": "\u4e3a\u591a\u8bed\u667a\u80fd\u4f53\u6280\u80fd\u68c0\u7d22\u8bc4\u4f30\u8d28\u91cf", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa M-SQE\uff0c\u4e00\u4e2a\u7528\u4e8e\u667a\u80fd\u4f53\u6280\u80fd\u4f7f\u7528\u7684\u591a\u8bed\u6280\u80fd\u8d28\u91cf\u4f30\u8ba1\u6846\u67b6\u3002\u5b83\u5728\u68c0\u7d22\u540e\u540c\u65f6\u8bc4\u4f30\u6280\u80fd\u7684\u5185\u5728\u8d28\u91cf\u4e0e\u4efb\u52a1\u53ef\u7528\u6027\uff0c\u4e3a\u4f4e\u8d44\u6e90\u8bed\u8a00\u7b5b\u9009\u66f4\u53ef\u9760\u7684\u672c\u8bed\u8a00\u6280\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u6307\u667a\u80fd\u4f53\u6280\u80fd\u751f\u6001\u4e2d\u7684\u8bed\u8a00\u4e0d\u5e73\u7b49\u95ee\u9898\uff0c\u4e0d\u53ea\u505a\u76f8\u5173\u6027\u68c0\u7d22\uff0c\u800c\u662f\u8bc4\u4f30\u591a\u8bed\u6280\u80fd\u662f\u5426\u771f\u6b63\u53ef\u7528\uff1b\u5bf9\u6784\u5efa\u9762\u5411\u4f4e\u8d44\u6e90\u8bed\u8a00\u548c\u8de8\u6587\u5316\u573a\u666f\u7684 LLM agent \u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Few-shot in-context learning (ICL), the capacity of a model to infer abstract patterns from input-output examples provided in its prompt and apply them to new inputs, has been extensively studied in large language models trained for next-token prediction on human text. Recently, few-shot ICL has been demonstrated in autoregressive genomic models as well. This raises a question: does ICL emerge broadly across domains, and if so, what common structure is shared? To address both, we develop a controlled cross-modality framework that instantiates the same task suite in a variety of modalities to test what we call the Convergent Emergence Hypothesis: the idea that few-shot ICL, when it emerges, shares a common cross-modality difficulty profile - i.e., tasks that benefit from ICL in one modality tend to benefit in others. We show that paired-mapping ICL emerges across six modalities (language, genome, integer sequences, time series, images, and proteins), surpasses controlled baselines, and has correlated per-task effects across five of them. Together, these results provide support for the Convergent Emergence Hypothesis in some modalities, but not all.", "arxiv_id": "2609.14011", "arxiv_url": "https://arxiv.org/abs/2609.14011", "authors": ["Nathan Breslow", "Seungwook Han", "Daniel Hyunsoo Lee", "Aayush Mishra", "Anqi Liu", "Daniel Khashabi"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u8de8\u6a21\u6001\u53ef\u63a7\u8bc4\u6d4b\u6846\u67b6\uff0c\u5c06\u540c\u4e00\u7ec4\u914d\u5bf9\u6620\u5c04\u4efb\u52a1\u5b9e\u4f8b\u5316\u5230\u8bed\u8a00\u3001\u57fa\u56e0\u7ec4\u3001\u6574\u6570\u5e8f\u5217\u3001\u65f6\u95f4\u5e8f\u5217\u3001\u56fe\u50cf\u548c\u86cb\u767d\u8d28\u516d\u79cd\u6a21\u6001\u4e2d\uff0c\u68c0\u9a8c\u5c11\u6837\u672c\u4e0a\u4e0b\u6587\u5b66\u4e60\u662f\u5426\u666e\u904d\u6d8c\u73b0\u3002\u7ed3\u679c\u663e\u793a\uff0c\u591a\u6570\u6a21\u6001\u4e2dICL\u4e0d\u4ec5\u4f18\u4e8e\u53d7\u63a7\u57fa\u7ebf\uff0c\u8fd8\u5448\u73b0\u76f8\u4f3c\u7684\u4efb\u52a1\u96be\u5ea6\u4e0e\u6536\u76ca\u6a21\u5f0f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14011", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u201c\u8d8b\u540c\u6d8c\u73b0\u5047\u8bf4\u201d\uff1a\u82e5ICL\u5728\u4e0d\u540c\u6a21\u6001\u4e2d\u51fa\u73b0\uff0c\u5176\u53d7\u76ca\u4efb\u52a1\u5e94\u5177\u6709\u76f8\u4f3c\u7684\u8de8\u6a21\u6001\u96be\u5ea6\u5206\u5e03\u3002", "\u5728\u516d\u79cd\u6a21\u6001\u4e2d\u6d4b\u8bd5\u914d\u5bf9\u6620\u5c04\u5f0fICL\uff0c\u8986\u76d6\u8bed\u8a00\u3001\u57fa\u56e0\u7ec4\u3001\u6574\u6570\u5e8f\u5217\u3001\u65f6\u95f4\u5e8f\u5217\u3001\u56fe\u50cf\u548c\u86cb\u767d\u8d28\u3002", "\u4e94\u79cd\u6a21\u6001\u5448\u73b0\u663e\u8457\u76f8\u5173\u7684\u9010\u4efb\u52a1ICL\u6548\u679c\uff0c\u4f46\u5e76\u975e\u6240\u6709\u6a21\u6001\u90fd\u5b8c\u5168\u7b26\u5408\u8be5\u5047\u8bf4\u3002"], "keywords": ["\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u591a\u6a21\u6001", "\u6d8c\u73b0\u80fd\u529b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": "Center for Language and Speech Processing @ JHU", "pdf_url": "https://arxiv.org/pdf/2609.14011v1", "published_at": "2026-09-12", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.14011.png", "title": "Convergent Emergence of In-Context Learning Across Modalities", "tldr": "\u5c11\u6837\u672cICL\u5728\u591a\u6a21\u6001\u4e2d\u8d8b\u540c\u6d8c\u73b0", "upvotes": 3, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u8de8\u6a21\u6001\u53ef\u63a7\u8bc4\u6d4b\u6846\u67b6\uff0c\u5c06\u540c\u4e00\u7ec4\u914d\u5bf9\u6620\u5c04\u4efb\u52a1\u5b9e\u4f8b\u5316\u5230\u8bed\u8a00\u3001\u57fa\u56e0\u7ec4\u3001\u6574\u6570\u5e8f\u5217\u3001\u65f6\u95f4\u5e8f\u5217\u3001\u56fe\u50cf\u548c\u86cb\u767d\u8d28\u516d\u79cd\u6a21\u6001\u4e2d\uff0c\u68c0\u9a8c\u5c11\u6837\u672c\u4e0a\u4e0b\u6587\u5b66\u4e60\u662f\u5426\u666e\u904d\u6d8c\u73b0\u3002\u7ed3\u679c\u663e\u793a\uff0c\u591a\u6570\u6a21\u6001\u4e2dICL\u4e0d\u4ec5\u4f18\u4e8e\u53d7\u63a7\u57fa\u7ebf\uff0c\u8fd8\u5448\u73b0\u76f8\u4f3c\u7684\u4efb\u52a1\u96be\u5ea6\u4e0e\u6536\u76ca\u6a21\u5f0f\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628aICL\u4ece\u8bed\u8a00\u6a21\u578b\u73b0\u8c61\u6269\u5c55\u4e3a\u8de8\u6a21\u6001\u53ef\u6bd4\u8f83\u7684\u80fd\u529b\u7814\u7a76\uff0c\u63d0\u4f9b\u4e86\u7406\u89e3\u4e0a\u4e0b\u6587\u5b66\u4e60\u666e\u904d\u673a\u5236\u7684\u5b9e\u8bc1\u8bc1\u636e\uff0c\u4e5f\u4e3a\u591a\u6a21\u6001\u6a21\u578b\u80fd\u529b\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u7cfb\u7edf\u7684\u6846\u67b6\u3002"}, {"abstract": "Action tokenizers play a central role in autoregressive vision-language-action (VLA) models, determining both the targets for policy training and the executable commands recovered from predicted tokens. Their fidelity is commonly evaluated using pointwise reconstruction metrics such as mean squared error (MSE), yet small individual errors do not fully characterize how faithfully action adjustments across demonstrations are preserved. After compression, similar actions may still cluster around a representative motion, while the adjustments needed for different contexts are diminished, distorted, or even reversed. We introduce physical rank consistency (PRC) to measure how well tokenization preserves local physical distance rankings after reconstruction. Evaluating decoded actions provides a common reference across token vocabularies and decoder architectures, complementing pointwise accuracy with a measure of relational fidelity. We further present ActionPiece, which preserves physical action relationships through joint supervision of representation learning and quantization. Physical rank preservation supervises near-far ordering in encoder and quantized feature distances, while quantization regularization applies the same ordering to codeword assignment distributions. Both objectives augment reconstruction, producing discrete action tokens for standard autoregressive policy learning and execution through a frozen decoder. Under the same Qwen3-VL-4B policy training setup, ActionPiece achieves 94.8% on LIBERO and 68.8% on unseen LIBERO-Plus, with additional evaluations reaching 71.9% on SimplerEnv and 51.5% across VLA-Arena L0-L2. Component ablations show that the two objectives jointly improve PRC and policy success, demonstrating the value of physical relationship supervision for action tokenization.", "arxiv_id": "2609.18487", "arxiv_url": "https://arxiv.org/abs/2609.18487", "authors": ["Shijie Lian", "Bin Yu", "Zhaolong Shen", "Xiaopeng Lin", "Yichao Du", "Zhirui Zhang", "Laurence T. Yang", "Kai Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u7269\u7406\u6392\u5e8f\u4e00\u81f4\u6027\uff08PRC\uff09\u6307\u6807\uff0c\u7528\u4e8e\u8bc4\u4f30\u52a8\u4f5ctoken\u5316\u540e\u662f\u5426\u4fdd\u7559\u5c40\u90e8\u7269\u7406\u8ddd\u79bb\u5173\u7cfb\u3002\u8fdb\u4e00\u6b65\u63d0\u51faActionPiece\uff0c\u901a\u8fc7\u8868\u793a\u5b66\u4e60\u4e0e\u91cf\u5316\u7684\u8054\u5408\u76d1\u7763\u751f\u6210\u66f4\u53ef\u9760\u7684\u79bb\u6563\u52a8\u4f5ctoken\uff0c\u7528\u4e8e\u81ea\u56de\u5f52VLA\u7b56\u7565\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18487", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["PRC\u8865\u5145MSE\u7b49\u9010\u70b9\u91cd\u5efa\u6307\u6807\uff0c\u8861\u91cf\u89e3\u7801\u52a8\u4f5c\u662f\u5426\u4fdd\u7559\u8fd1\u8fdc\u5173\u7cfb\u4e0e\u4e0a\u4e0b\u6587\u52a8\u4f5c\u8c03\u6574", "ActionPiece\u5f15\u5165\u7269\u7406\u6392\u5e8f\u4fdd\u6301\u4e0e\u91cf\u5316\u6b63\u5219\uff0c\u4f7f\u7f16\u7801\u7279\u5f81\u3001\u91cf\u5316\u7279\u5f81\u548c\u7801\u5b57\u5206\u914d\u5171\u540c\u9075\u5faa\u7269\u7406\u8ddd\u79bb\u6392\u5e8f", "\u5728\u76f8\u540cQwen3-VL-4B\u7b56\u7565\u8bbe\u7f6e\u4e0b\uff0cLIBERO\u8fbe94.8%\uff0c\u672a\u89c1LIBERO-Plus\u8fbe68.8%\uff0c\u5e76\u5728SimplerEnv\u548cVLA-Arena\u53d6\u5f97\u8f83\u5f3a\u7ed3\u679c"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u52a8\u4f5c\u79bb\u6563\u5316", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18487v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ActionPiece: Rethinking Action Tokenization for Autoregressive Vision-Language-Action Models", "tldr": "ActionPiece\u63d0\u5347VLA\u52a8\u4f5c\u79bb\u6563\u5316\u7684\u7269\u7406\u5173\u7cfb\u4fdd\u771f\u5ea6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u7269\u7406\u6392\u5e8f\u4e00\u81f4\u6027\uff08PRC\uff09\u6307\u6807\uff0c\u7528\u4e8e\u8bc4\u4f30\u52a8\u4f5ctoken\u5316\u540e\u662f\u5426\u4fdd\u7559\u5c40\u90e8\u7269\u7406\u8ddd\u79bb\u5173\u7cfb\u3002\u8fdb\u4e00\u6b65\u63d0\u51faActionPiece\uff0c\u901a\u8fc7\u8868\u793a\u5b66\u4e60\u4e0e\u91cf\u5316\u7684\u8054\u5408\u76d1\u7763\u751f\u6210\u66f4\u53ef\u9760\u7684\u79bb\u6563\u52a8\u4f5ctoken\uff0c\u7528\u4e8e\u81ea\u56de\u5f52VLA\u7b56\u7565\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u52a8\u4f5ctoken\u5316\u4e0d\u80fd\u53ea\u770b\u91cd\u5efa\u8bef\u5dee\uff0c\u8fd8\u9700\u4fdd\u7559\u52a8\u4f5c\u4e4b\u95f4\u7684\u7269\u7406\u5173\u7cfb\uff1b\u8fd9\u5bf9\u63d0\u5347\u81ea\u56de\u5f52VLA\u673a\u5668\u4eba\u7b56\u7565\u7684\u6cdb\u5316\u4e0e\u6267\u884c\u7a33\u5b9a\u6027\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large Reasoning Models (LRMs) exhibit strong problem-solving abilities, yet their safety alignment often degrades when handling harmful queries. Existing approaches to improving safety largely rely on additional training or preference optimization, while offering limited understanding of the internal mechanisms behind safety failures. In this work, we investigate this failure through a token-level positional analysis of refusal dynamics and identify a localized vulnerability at the onset of reasoning, which we term Onset Refusal Collapse (ORC). We find that the refusal-related signal of LRMs drops sharply at the first generated token under harmful queries, which is associated with unsafe response generation. Motivated by this finding, we propose SafeToken, a lightweight inference-time intervention that injects a learned continuous safety anchor precisely at reasoning onset. Despite updating only a single token embedding, SafeToken effectively mitigates ORC, improves safety on harmful-query benchmarks, and largely preserves reasoning utility. These results suggest that safety failures in LRMs can arise from a transient breakdown at the critical transition from understanding to generation.", "arxiv_id": "2609.18471", "arxiv_url": "https://arxiv.org/abs/2609.18471", "authors": ["Yizheng Yang", "Haining Yu", "Yuechen Wang", "Yikai Hou", "Xing Fu", "Jinbo Yang", "Tianqing Zhu"], "brief": "\u8bba\u6587\u4ece token \u4f4d\u7f6e\u5c42\u9762\u5206\u6790\u5927\u578b\u63a8\u7406\u6a21\u578b\u5728\u6709\u5bb3\u67e5\u8be2\u4e0b\u7684\u62d2\u7b54\u52a8\u6001\uff0c\u53d1\u73b0\u5b89\u5168\u4fe1\u53f7\u4f1a\u5728\u63a8\u7406\u5f00\u59cb\u7684\u7b2c\u4e00\u4e2a\u751f\u6210 token \u5904\u6025\u5267\u4e0b\u964d\uff0c\u5e76\u5c06\u5176\u547d\u540d\u4e3a Onset Refusal Collapse\uff08ORC\uff09\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa SafeToken\uff0c\u5728\u63a8\u7406\u8d77\u70b9\u6ce8\u5165\u4e00\u4e2a\u5b66\u4e60\u5230\u7684\u8fde\u7eed\u5b89\u5168\u951a\u70b9\uff0c\u4ee5\u8f7b\u91cf\u65b9\u5f0f\u63d0\u5347\u5b89\u5168\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18471", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0 LRMs \u7684\u62d2\u7b54\u76f8\u5173\u4fe1\u53f7\u5728\u6709\u5bb3\u67e5\u8be2\u7684\u9996\u4e2a\u751f\u6210 token \u5904\u51fa\u73b0\u5c40\u90e8\u5d29\u6e83\uff0c\u4e14\u4e0e\u4e0d\u5b89\u5168\u56de\u590d\u751f\u6210\u76f8\u5173", "SafeToken \u4ec5\u5e72\u9884\u5355\u4e2a token embedding\uff0c\u65e0\u9700\u989d\u5916\u5927\u89c4\u6a21\u8bad\u7ec3\u6216\u504f\u597d\u4f18\u5316", "\u5728\u6709\u5bb3\u67e5\u8be2\u5b89\u5168\u57fa\u51c6\u4e0a\u63d0\u5347\u62d2\u7b54\u4e0e\u5b89\u5168\u8868\u73b0\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u63a8\u7406\u80fd\u529b"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u63a8\u7406\u6a21\u578b", "\u5bf9\u9f50", "\u63a8\u7406\u65f6\u5e72\u9884"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18471v1", "published_at": "2026-09-16", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "First Token Matters: Understanding Safety Collapse in Large Reasoning Models", "tldr": "\u9996\u4e2a\u751f\u6210 token \u662f\u63a8\u7406\u6a21\u578b\u5b89\u5168\u5d29\u6e83\u5173\u952e\u70b9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece token \u4f4d\u7f6e\u5c42\u9762\u5206\u6790\u5927\u578b\u63a8\u7406\u6a21\u578b\u5728\u6709\u5bb3\u67e5\u8be2\u4e0b\u7684\u62d2\u7b54\u52a8\u6001\uff0c\u53d1\u73b0\u5b89\u5168\u4fe1\u53f7\u4f1a\u5728\u63a8\u7406\u5f00\u59cb\u7684\u7b2c\u4e00\u4e2a\u751f\u6210 token \u5904\u6025\u5267\u4e0b\u964d\uff0c\u5e76\u5c06\u5176\u547d\u540d\u4e3a Onset Refusal Collapse\uff08ORC\uff09\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa SafeToken\uff0c\u5728\u63a8\u7406\u8d77\u70b9\u6ce8\u5165\u4e00\u4e2a\u5b66\u4e60\u5230\u7684\u8fde\u7eed\u5b89\u5168\u951a\u70b9\uff0c\u4ee5\u8f7b\u91cf\u65b9\u5f0f\u63d0\u5347\u5b89\u5168\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u63a8\u7406\u6a21\u578b\u5b89\u5168\u5931\u8d25\u5b9a\u4f4d\u5230\u201c
