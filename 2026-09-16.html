le": null}, {"abstract": "Agentic-AI based software development offers the promise of faster completion of the software, greater programmer efficiency, and more reliable code. The question is how can we verify these claims in an objective way? In this project, we attempted to answer this question based on three practices. First, we applied a typical best-practices agentic AI workflow for software development. Second, our target programs were ten well-known, release-quality human-written Linux utility programs so that we could compare the AI-generated code against a concrete ground truth. Third, we based our measure of reliability on a widely used testing technique, fuzz random testing. For this testing, we used both classic black box, generational testing and more modern coverage guided (gray box, mutational) testing using AFL++. We found that the AI-generated versions of the utility programs were typically as reliable - often more reliable - than the latest human-generated versions of these programs. While the AI-generated versions did have some failures, they were less common than the code from the standard repositories. Interestingly, the AI-generated code was less likely to have failures such as memory errors (such as buffer overflows) but more likely to have hangs such as infinite loops. In addition, we verified that generating robust and reliable software using agentic AI requires careful practice and human supervision. The quality of the code is highly dependent on the prompts and skills used, and how the human directing the process responds. We also demonstrated that using agentic AI workflow for software development (with its prompts and skills) can become a specification of the code that leads to cost-effective sustainability of the software.", "arxiv_id": "2609.18298", "arxiv_url": "https://arxiv.org/abs/2609.18298", "authors": ["Ayesha Shafique", "Barton P. MIller", "Elisa R. Heymann"], "brief": "\u672c\u6587\u7528\u667a\u80fd\u4f53\u5f0f AI \u5de5\u4f5c\u6d41\u91cd\u5199 10 \u4e2a\u7ecf\u5178 Linux \u5de5\u5177\uff0c\u5e76\u901a\u8fc7\u9ed1\u76d2\u968f\u673a\u6d4b\u8bd5\u548c AFL++ \u8986\u76d6\u5f15\u5bfc\u6a21\u7cca\u6d4b\u8bd5\u4e0e\u4eba\u7c7b\u7248\u672c\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a AI \u751f\u6210\u7a0b\u5e8f\u901a\u5e38\u53ef\u9760\u6027\u76f8\u5f53\u751a\u81f3\u66f4\u9ad8\uff0c\u5185\u5b58\u9519\u8bef\u66f4\u5c11\u4f46\u66f4\u5bb9\u6613\u51fa\u73b0\u6b7b\u5faa\u73af\uff0c\u540c\u65f6\u5f3a\u4f9d\u8d56\u9ad8\u8d28\u91cf\u63d0\u793a\u548c\u4eba\u5de5\u76d1\u7763\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18298", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u4ee3\u7801\u751f\u6210", "\u6a21\u7cca\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18298v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "A Study of the Reliability of Agentic AI-Generated Programs", "tldr": "\u672c\u6587\u7528\u667a\u80fd\u4f53\u5f0f AI \u5de5\u4f5c\u6d41\u91cd\u5199 10 \u4e2a\u7ecf\u5178 Linux \u5de5\u5177\uff0c\u5e76\u901a\u8fc7\u9ed1\u76d2\u968f\u673a\u6d4b\u8bd5\u548c AFL++ \u8986\u76d6\u5f15\u5bfc\u6a21\u7cca\u6d4b\u8bd5\u4e0e\u4eba\u7c7b\u7248\u672c\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a AI \u751f\u6210\u7a0b\u5e8f\u901a\u5e38\u53ef\u9760\u6027\u76f8\u5f53\u751a\u81f3\u66f4\u9ad8\uff0c\u5185\u5b58\u9519\u8bef\u66f4\u5c11\u4f46\u66f4\u5bb9\u6613\u51fa\u73b0\u6b7b\u5faa\u73af\uff0c\u540c\u65f6\u5f3a\u4f9d\u8d56\u9ad8\u8d28\u91cf\u63d0\u793a\u548c\u4eba\u5de5\u76d1\u7763\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As telecommunication networks evolve toward autonomous 5G-Advanced and 6G operations, agentic artificial intelligence (AI) workflows, where large language models (LLMs) execute multi-step reasoning, invoke diagnostic tools, retrieve domain knowledge, and coordinate across agent teams, are increasingly embedded across the edge-cloud continuum. While the biological brain accomplishes complex cognition on an exceptionally modest metabolic power budget of approximately 20W contemporary LLMs are profoundly energy- and memory-intensive, making sustainable lifecycle orchestration a critical operational priority. However, existing AI lifecycle metrics evaluate only isolated, single-model inferences or overlook multi-agent execution graphs entirely. Consequently, network operators lack foundational models to determine whether distributed agent communication incurs meaningful energy costs and where across edge-cloud tiers agent teams should physically reside. To address this gap, we introduce agentic-eCAL, generalizing the Energy Cost of AI Lifecycle (eCAL) metric to directed multi-agent workflows by coupling a closed-form two-rate single-call energy model (compute-bound prefill and memory-bound decode) with 7-layer OSI data transport. Grounded in hundreds of GPU benchmark configurations on NVIDIA A100 and H100, 16 open-weight models and 8 orchestration topologies, we validate components of the metric and study workflow placement implications. Our findings demonstrate that inter-agent text transport incurs 0.25% of workflow energy across 5G RAN, metro, and optical links. Therefore in edge-cloud agent placement the dominant energy cost of distribution is often not the transmission of inter-agent text itself, but the additional inference and context processing induced by that communication.", "arxiv_id": "2609.18283", "arxiv_url": "https://arxiv.org/abs/2609.18283", "authors": ["Carolina Fortuna", "Vid Han\u017eel", "Tim Strnad", "Bla\u017e Bertalani\u010d"], "brief": "\u8bba\u6587\u63d0\u51fa agentic-eCAL\uff0c\u5c06 AI \u751f\u547d\u5468\u671f\u80fd\u8017\u6307\u6807\u6269\u5c55\u5230\u6709\u5411\u591a\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u7ed3\u5408\u5927\u6a21\u578b\u9884\u586b\u5145/\u89e3\u7801\u80fd\u8017\u6a21\u578b\u4e0e OSI \u6570\u636e\u4f20\u8f93\u6210\u672c\u6765\u8bc4\u4f30\u8fb9\u7f18-\u4e91\u90e8\u7f72\u3002\u57fa\u4e8e A100/H100\u300116 \u4e2a\u5f00\u6e90\u6a21\u578b\u548c 8 \u79cd\u7f16\u6392\u62d3\u6251\u7684\u5206\u6790\u53d1\u73b0\uff0c\u667a\u80fd\u4f53\u95f4\u6587\u672c\u4f20\u8f93\u80fd\u8017\u4ec5\u5360\u7ea6 0.25%\uff0c\u771f\u6b63\u4e3b\u5bfc\u5206\u5e03\u5f0f\u90e8\u7f72\u80fd\u8017\u7684\u662f\u989d\u5916\u63a8\u7406\u4e0e\u4e0a\u4e0b\u6587\u5904\u7406\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18283", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8fb9\u7f18\u4e91\u8ba1\u7b97", "\u80fd\u8017\u5efa\u6a21", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18283v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Where Should Agents Live? Energy-Memory Characterization of Agentic AI for the Edge-Cloud Continuum", "tldr": "\u8bba\u6587\u63d0\u51fa agentic-eCAL\uff0c\u5c06 AI \u751f\u547d\u5468\u671f\u80fd\u8017\u6307\u6807\u6269\u5c55\u5230\u6709\u5411\u591a\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\uff0c\u7ed3\u5408\u5927\u6a21\u578b\u9884\u586b\u5145/\u89e3\u7801\u80fd\u8017\u6a21\u578b\u4e0e OSI \u6570\u636e\u4f20\u8f93\u6210\u672c\u6765\u8bc4\u4f30\u8fb9\u7f18-\u4e91\u90e8\u7f72\u3002\u57fa\u4e8e A100/H100\u300116 \u4e2a\u5f00\u6e90\u6a21\u578b\u548c 8 \u79cd\u7f16\u6392\u62d3\u6251\u7684\u5206\u6790\u53d1\u73b0\uff0c\u667a\u80fd\u4f53\u95f4\u6587\u672c\u4f20\u8f93\u80fd\u8017\u4ec5\u5360\u7ea6 0.25%\uff0c\u771f\u6b63\u4e3b\u5bfc\u5206\u5e03\u5f0f\u90e8\u7f72\u80fd\u8017\u7684\u662f\u989d\u5916\u63a8\u7406\u4e0e\u4e0a\u4e0b\u6587\u5904\u7406\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic AI systems plan, invoke tools and act with limited supervision; they are now both the subject of audits and, increasingly, the auditor. Independence, the foundation of assurance,is still applied to them as a binary. We argue that it must be graded along three orthogonal axes: principal independence (who controls the auditor), substrate independence (an auditor sharing the auditee\u0027s foundation-model family, toolchain or guardrails fails with it) and evidence independence (whether evidence is attestable rather than self-reported). Each axis has precedent; the contribution is to grade all three on a single audit, aggregate them by the weakest link, and apply the same rubric when the auditor is itself an agent. We give the model a formal basis by transplanting the beta-factor model of common-cause failure from reliability engineering, a seven-step protocol whose outputs a third party can verify, a structural detectability analysis of a procurement-controls agent audited at three grades, and a Monte Carlo study of the model in which a conventional internal audit of an agent-a real audit team, a second agent, provider logsp-surfaces 5.9% of the faults it could in principle see and none at all in half the fault classes. We map the triple to the EU AI Act as amended, ISO/IEC 42006, UK public-sector risk-management guidance and audit-regulator practice.", "arxiv_id": "2609.18272", "arxiv_url": "https://arxiv.org/abs/2609.18272", "authors": ["Mohamed Chahine Ghanem"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53 AI \u7684\u201c\u72ec\u7acb\u6027\u5206\u7ea7\u201d\u5ba1\u8ba1\u534f\u8bae\uff0c\u4ece\u63a7\u5236\u4e3b\u4f53\u3001\u6280\u672f\u57fa\u5ea7\u548c\u8bc1\u636e\u6765\u6e90\u4e09\u6761\u8f74\u8861\u91cf\u5ba1\u8ba1\u72ec\u7acb\u6027\uff0c\u5e76\u6309\u6700\u5f31\u73af\u8282\u805a\u5408\u8bc4\u5206\u3002\u4f5c\u8005\u501f\u9274\u53ef\u9760\u6027\u5de5\u7a0b\u4e2d\u7684\u5171\u56e0\u5931\u6548\u6a21\u578b\uff0c\u7ed9\u51fa\u53ef\u7b2c\u4e09\u65b9\u9a8c\u8bc1\u7684\u4e03\u6b65\u6d41\u7a0b\uff0c\u5e76\u901a\u8fc7\u6848\u4f8b\u4e0e\u8499\u7279\u5361\u6d1b\u7814\u7a76\u663e\u793a\u4f20\u7edf\u5185\u90e8\u5ba1\u8ba1\u53ef\u80fd\u6f0f\u68c0\u5927\u91cf\u53ef\u89c1\u6545\u969c\u3002", "categories": ["cs.AI", "cs.CR", "cs.ET"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18272", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AI\u5ba1\u8ba1", "AI\u5b89\u5168", "\u6cbb\u7406\u5408\u89c4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18272v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Who Audits Whom, on What Substrate, with What Evidence? An Independence-Graded Audit Protocol for Agentic AI", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u667a\u80fd\u4f53 AI \u7684\u201c\u72ec\u7acb\u6027\u5206\u7ea7\u201d\u5ba1\u8ba1\u534f\u8bae\uff0c\u4ece\u63a7\u5236\u4e3b\u4f53\u3001\u6280\u672f\u57fa\u5ea7\u548c\u8bc1\u636e\u6765\u6e90\u4e09\u6761\u8f74\u8861\u91cf\u5ba1\u8ba1\u72ec\u7acb\u6027\uff0c\u5e76\u6309\u6700\u5f31\u73af\u8282\u805a\u5408\u8bc4\u5206\u3002\u4f5c\u8005\u501f\u9274\u53ef\u9760\u6027\u5de5\u7a0b\u4e2d\u7684\u5171\u56e0\u5931\u6548\u6a21\u578b\uff0c\u7ed9\u51fa\u53ef\u7b2c\u4e09\u65b9\u9a8c\u8bc1\u7684\u4e03\u6b65\u6d41\u7a0b\uff0c\u5e76\u901a\u8fc7\u6848\u4f8b\u4e0e\u8499\u7279\u5361\u6d1b\u7814\u7a76\u663e\u793a\u4f20\u7edf\u5185\u90e8\u5ba1\u8ba1\u53ef\u80fd\u6f0f\u68c0\u5927\u91cf\u53ef\u89c1\u6545\u969c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Real-world agents fundamentally require persistent non-parametric knowledge for dynamic reasoning, i.e., long-term memory and retrieval-augmented generation. While graphs have shown reliable advantages in providing structured evidence, the sparse graph representations naturally restrict machine readability and semantic density required for complex agentic workflows. Driven by this limitation, the entire industry is witnessing a paradigm shift from traditional sparse graphs to LLM Wiki, an agent-native knowledge representation that couples dense document contexts with markdown files containing multi-layered topological linkages. However, parameterizing such rich semantics is challenging to encode dense textual contexts using traditional sparse graph embeddings. Moreover, learning LLM Wiki with existing graph encoders could overwhelm distributed system overheads that hinder deployment in large-scale commercial scenarios. To this end, we propose a novel paradigm Wiki Foundation Model, i.e., WFM, tailored for scalable, agent-native representation and retrieval. Specifically, (i) we formalize a Wiki Graph schema that seamlessly bridges fine-grained structures with dense contexts, maintaining explicit topologies alongside continuous semantics; (ii) A query-conditioned attentive aggregation is tailored for rich wiki message passing and explicit attention variance regularization; (iii) We engineer an infrastructural NCCL boundary exchange protocol that hoists static partition indices and leverages fixed-shape GPU-to-GPU collectives, bypassing CPU serialization and memory copy overheads. Extensive evaluations across five long-term agent memory and multi-hop reasoning benchmarks demonstrate the remarkable performance of WFM, while achieving a 10.5 times training acceleration on distributed clusters.", "arxiv_id": "2609.18182", "arxiv_url": "https://arxiv.org/abs/2609.18182", "authors": ["Junnan Dong", "Linhao Luo", "Senlei Zhang", "Gong Chen", "Taian Guo", "Yifei Yu", "Rong Tao", "Tao Guo", "Qian-Wen Zhang", "Siyu An", "Ruizhi Qiao", "Xing Sun"], "brief": "\u672c\u6587\u63d0\u51fa Wiki Foundation Model\uff08WFM\uff09\uff0c\u9762\u5411\u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u4e0e\u68c0\u7d22\u589e\u5f3a\u63a8\u7406\uff0c\u5c06 LLM Wiki \u8868\u793a\u4e3a\u517c\u5177\u663e\u5f0f\u62d3\u6251\u548c\u7a20\u5bc6\u8bed\u4e49\u7684 Wiki Graph\uff0c\u5e76\u7528\u67e5\u8be2\u6761\u4ef6\u5316\u6ce8\u610f\u529b\u805a\u5408\u8fdb\u884c\u591a\u8df3\u4fe1\u606f\u4f20\u9012\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u957f\u671f\u8bb0\u5fc6\u548c\u591a\u8df3\u63a8\u7406\u57fa\u51c6\u4e0a\u8868\u73b0\u4f18\u5f02\uff0c\u540c\u65f6\u901a\u8fc7 NCCL \u8fb9\u754c\u4ea4\u6362\u534f\u8bae\u5b9e\u73b0\u5206\u5e03\u5f0f\u8bad\u7ec3\u7ea6 10.5 \u500d\u52a0\u901f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18182", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u77e5\u8bc6\u56fe\u8c31", "\u957f\u7a0b\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18182v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "WFM: Wiki Foundation Model for Complex Agentic Reasoning", "tldr": "\u672c\u6587\u63d0\u51fa Wiki Foundation Model\uff08WFM\uff09\uff0c\u9762\u5411\u667a\u80fd\u4f53\u957f\u671f\u8bb0\u5fc6\u4e0e\u68c0\u7d22\u589e\u5f3a\u63a8\u7406\uff0c\u5c06 LLM Wiki \u8868\u793a\u4e3a\u517c\u5177\u663e\u5f0f\u62d3\u6251\u548c\u7a20\u5bc6\u8bed\u4e49\u7684 Wiki Graph\uff0c\u5e76\u7528\u67e5\u8be2\u6761\u4ef6\u5316\u6ce8\u610f\u529b\u805a\u5408\u8fdb\u884c\u591a\u8df3\u4fe1\u606f\u4f20\u9012\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u957f\u671f\u8bb0\u5fc6\u548c\u591a\u8df3\u63a8\u7406\u57fa\u51c6\u4e0a\u8868\u73b0\u4f18\u5f02\uff0c\u540c\u65f6\u901a\u8fc7 NCCL \u8fb9\u754c\u4ea4\u6362\u534f\u8bae\u5b9e\u73b0\u5206\u5e03\u5f0f\u8bad\u7ec3\u7ea6 10.5 \u500d\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "State-of-the-art Text-to-SQL systems are typically multi-agent pipelines centered around two fundamental tasks: schema linking and SQL generation. However, existing work trains separate models for each task, failing to leverage the synergy between these interrelated tasks. In this work, we propose DualSQL, a new Text-to-SQL system consisting of two agents powered by a single model backbone. The agents share the same model weights and agentic scaffold, enabling joint optimization through a robust multi-agent reinforcement learning (RL) framework. We design three database access tools to facilitate effective multi-step reasoning grounded to interactions with the databases. To improve training and avoid model collapse, we introduce a set of rollout guardrail mechanisms that stabilizes multi-agent RL training, supporting DualSQL to keep improving during training. We also introduce a new SQL correctness metric, robust execution match (REX), to more accurately judge SQL correctness and assign reward signals. Being trained on only 3755 examples, DualSQL-4B achieves an impressive 68.0% execution accuracy on the BIRD development set, matching previous 7B models. DualSQL-8B further improves to 71.1%, outperforming previous state-of-the-art single-model solutions with 32B parameters. These results demonstrate the strength of joint multi-agent reinforcement learning for building high performance Text-to-SQL pipelines.", "arxiv_id": "2609.18135", "arxiv_url": "https://arxiv.org/abs/2609.18135", "authors": ["Shijie Chen", "Yu Gan", "Yeounoh Chung", "Jiani Zhang", "Quannan Li", "Sravan Babu Bodapati", "Cody J. Greer", "Yu Su", "Fatma Ozcan"], "brief": "DualSQL \u5c06 Text-to-SQL \u4e2d\u7684\u6a21\u5f0f\u94fe\u63a5\u548c SQL \u751f\u6210\u5efa\u6a21\u4e3a\u5171\u4eab\u540c\u4e00\u9aa8\u5e72\u6a21\u578b\u7684\u53cc\u667a\u80fd\u4f53\uff0c\u5e76\u7528\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u8054\u5408\u4f18\u5316\u3002\u5b83\u5f15\u5165\u6570\u636e\u5e93\u8bbf\u95ee\u5de5\u5177\u3001\u8bad\u7ec3\u9632\u5d29\u6e83\u62a4\u680f\u548c\u65b0\u7684 SQL \u6b63\u786e\u6027\u6307\u6807 REX\uff1b\u5728\u4ec5 3755 \u6761\u8bad\u7ec3\u6837\u672c\u4e0b\uff0c4B \u6a21\u578b\u8fbe\u5230 68.0% BIRD \u6267\u884c\u51c6\u786e\u7387\uff0c8B \u8fbe\u5230 71.1%\uff0c\u8d85\u8fc7\u66f4\u5927\u53c2\u6570\u91cf\u7684\u5355\u6a21\u578b\u65b9\u6848\u3002", "categories": ["cs.CL", "cs.AI", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18135", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "Text-to-SQL", "\u6570\u636e\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18135v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "DualSQL: Text-to-SQL with Multi-Agent Reinforcement Learning", "tldr": "DualSQL \u5c06 Text-to-SQL \u4e2d\u7684\u6a21\u5f0f\u94fe\u63a5\u548c SQL \u751f\u6210\u5efa\u6a21\u4e3a\u5171\u4eab\u540c\u4e00\u9aa8\u5e72\u6a21\u578b\u7684\u53cc\u667a\u80fd\u4f53\uff0c\u5e76\u7528\u591a\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u8054\u5408\u4f18\u5316\u3002\u5b83\u5f15\u5165\u6570\u636e\u5e93\u8bbf\u95ee\u5de5\u5177\u3001\u8bad\u7ec3\u9632\u5d29\u6e83\u62a4\u680f\u548c\u65b0\u7684 SQL \u6b63\u786e\u6027\u6307\u6807 REX\uff1b\u5728\u4ec5 3755 \u6761\u8bad\u7ec3\u6837\u672c\u4e0b\uff0c4B \u6a21\u578b\u8fbe\u5230 68.0% BIRD \u6267\u884c\u51c6\u786e\u7387\uff0c8B \u8fbe\u5230 71.1%\uff0c\u8d85\u8fc7\u66f4\u5927\u53c2\u6570\u91cf\u7684\u5355\u6a21\u578b\u65b9\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) agents augmented by tools can automate complex, multi-step tasks, such as web navigation, code generation, and workflow orchestration, by acting on external systems through tool calls. However, hallucinations, distributional instability, and adversarial manipulations in LLMs, and the irreversible consequences of certain tool calls can lead to harmful outcomes. Existing safeguards either grade recorded trajectories post hoc with stochastic LLM judges or block unsafe actions one call at a time, and no single deterministic artifact supports both roles. We present ContrAgent, a contract-based framework for symbolic temporal supervision of LLM agents. ContrAgent captures an agent\u0027s behavior as a sequence of tool calls and formalizes it as a trace over a fixed set of checkable predicates. It then specifies required behaviors using assume-guarantee contracts in linear temporal logic over finite traces (LTLf). Each contract is compiled to a deterministic finite automaton (DFA) that serves two roles: gating agent actions online and evaluating recorded traces offline. A contract library, acting as a reusable knowledge base, is maintained independently of the agent\u0027s model and can be applied across different agents within the same task domain. We show the effectiveness of our approach on four benchmarks spanning both roles, where ContrAgent matches state-of-the-art LLM-judge and rule-based guardrail baselines while producing deterministic, reproducible verdicts and, in the online mode, orders-of-magnitude lower per-call latency.", "arxiv_id": "2609.18128", "arxiv_url": "https://arxiv.org/abs/2609.18128", "authors": ["Yifeng Xiao", "Pierluigi Nuzzo"], "brief": "\u8bba\u6587\u63d0\u51fa ContrAgent\uff0c\u7528\u57fa\u4e8e\u5951\u7ea6\u7684\u7ebf\u6027\u65f6\u5e8f\u903b\u8f91\uff08LTLf\uff09\u5bf9 LLM \u667a\u80fd\u4f53\u7684\u5de5\u5177\u8c03\u7528\u8f68\u8ff9\u8fdb\u884c\u7b26\u53f7\u5316\u76d1\u7763\u3002\u5951\u7ea6\u88ab\u7f16\u8bd1\u4e3a\u786e\u5b9a\u6027\u6709\u9650\u81ea\u52a8\u673a\uff0c\u53ef\u540c\u65f6\u7528\u4e8e\u5728\u7ebf\u62e6\u622a\u4e0d\u5b89\u5168\u52a8\u4f5c\u548c\u79bb\u7ebf\u8bc4\u4f30\u6267\u884c\u8f68\u8ff9\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230\u4e0e LLM \u88c1\u5224\u548c\u89c4\u5219\u62a4\u680f\u76f8\u5f53\u7684\u6548\u679c\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u5728\u7ebf\u5ef6\u8fdf\u3001\u63d0\u9ad8\u53ef\u590d\u73b0\u6027\u3002", "categories": ["cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18128", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f62\u5f0f\u5316\u65b9\u6cd5", "\u5b89\u5168\u76d1\u7763", "\u65f6\u5e8f\u903b\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18128v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Symbolic Temporal Supervision of LLM Agents Using Contracts", "tldr": "\u8bba\u6587\u63d0\u51fa ContrAgent\uff0c\u7528\u57fa\u4e8e\u5951\u7ea6\u7684\u7ebf\u6027\u65f6\u5e8f\u903b\u8f91\uff08LTLf\uff09\u5bf9 LLM \u667a\u80fd\u4f53\u7684\u5de5\u5177\u8c03\u7528\u8f68\u8ff9\u8fdb\u884c\u7b26\u53f7\u5316\u76d1\u7763\u3002\u5951\u7ea6\u88ab\u7f16\u8bd1\u4e3a\u786e\u5b9a\u6027\u6709\u9650\u81ea\u52a8\u673a\uff0c\u53ef\u540c\u65f6\u7528\u4e8e\u5728\u7ebf\u62e6\u622a\u4e0d\u5b89\u5168\u52a8\u4f5c\u548c\u79bb\u7ebf\u8bc4\u4f30\u6267\u884c\u8f68\u8ff9\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8fbe\u5230\u4e0e LLM \u88c1\u5224\u548c\u89c4\u5219\u62a4\u680f\u76f8\u5f53\u7684\u6548\u679c\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u5728\u7ebf\u5ef6\u8fdf\u3001\u63d0\u9ad8\u53ef\u590d\u73b0\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic AI systems often approach the same task through multiple workflows that differ in reasoning strategy, verification structure, and compute cost. A natural deployment policy is to use the workflow with the highest average performance, but this can be suboptimal because different workflows may succeed on different instances. We study a portfolio-and-selector paradigm in which a firm runs multiple workflow executions and selects the final answer after observing their outputs. Additional executions may uncover correct answers that the best standalone workflow misses, but they consume compute and introduce plausible distractors that complicate final selection. We formulate this as a workflow portfolio problem in which the firm jointly chooses run size and allocation across workflow types. We summarize selector quality through an odds-lift index and derive sharp bounds on the value of workflow variety. For finite workflow pools, we develop exact formulations, linear programming relaxations, randomized rounding procedures, and computable performance certificates. For large implicit workflow classes, we derive a finite-dimensional dual and an ellipsoid method using a pricing oracle to identify workflows with high weighted accuracy net of recurring compute cost. Under a weak condition, the method obtains a near-optimal solution to the relaxation with polynomially many oracle calls. We evaluate the framework on three datasets: ABCD, Schema-Guided Dialogue, and HotpotQA. Relative to the best standalone workflow, portfolio optimization improves held-out selector accuracy by 3.1, 7.5, and 0.9 percentage points, respectively. Dual-guided workflow generation adds 3.5 points on ABCD and 24.1 on HotpotQA, with no additional gain on Schema-Guided Dialogue.", "arxiv_id": "2609.18126", "arxiv_url": "https://arxiv.org/abs/2609.18126", "authors": ["Mojtaba Abdolmaleki", "Stefanus Jasin", "Boyu Wang"], "brief": "\u672c\u6587\u7814\u7a76\u667a\u80fd\u4f53 AI \u4e2d\u591a\u4e2a\u5de5\u4f5c\u6d41\u7684\u7ec4\u5408\u9009\u62e9\u95ee\u9898\uff0c\u5728\u8003\u8651\u9009\u62e9\u5668\u4e0d\u5b8c\u7f8e\u548c\u8ba1\u7b97\u6210\u672c\u7684\u60c5\u51b5\u4e0b\uff0c\u8054\u5408\u4f18\u5316\u8fd0\u884c\u6b21\u6570\u4e0e\u4e0d\u540c\u5de5\u4f5c\u6d41\u7684\u5206\u914d\u3002\u4f5c\u8005\u7ed9\u51fa\u7cbe\u786e\u5efa\u6a21\u3001\u7ebf\u6027\u89c4\u5212\u677e\u5f1b\u3001\u968f\u673a\u820d\u5165\u4e0e\u5bf9\u5076/\u692d\u7403\u65b9\u6cd5\uff0c\u5e76\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u76f8\u8f83\u6700\u4f73\u5355\u4e00\u5de5\u4f5c\u6d41\u63d0\u5347\u4e86\u9009\u62e9\u51c6\u786e\u7387\uff0c\u90e8\u5206\u573a\u666f\u901a\u8fc7\u5bf9\u5076\u5f15\u5bfc\u751f\u6210\u5de5\u4f5c\u6d41\u83b7\u5f97\u663e\u8457\u589e\u76ca\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18126", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u4f5c\u6d41\u4f18\u5316", "\u7ec4\u5408\u4f18\u5316", "\u8ba1\u7b97\u6210\u672c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18126v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Designing Agentic AI Workflow Portfolios under Imperfect Selection and Compute Cost", "tldr": "\u672c\u6587\u7814\u7a76\u667a\u80fd\u4f53 AI \u4e2d\u591a\u4e2a\u5de5\u4f5c\u6d41\u7684\u7ec4\u5408\u9009\u62e9\u95ee\u9898\uff0c\u5728\u8003\u8651\u9009\u62e9\u5668\u4e0d\u5b8c\u7f8e\u548c\u8ba1\u7b97\u6210\u672c\u7684\u60c5\u51b5\u4e0b\uff0c\u8054\u5408\u4f18\u5316\u8fd0\u884c\u6b21\u6570\u4e0e\u4e0d\u540c\u5de5\u4f5c\u6d41\u7684\u5206\u914d\u3002\u4f5c\u8005\u7ed9\u51fa\u7cbe\u786e\u5efa\u6a21\u3001\u7ebf\u6027\u89c4\u5212\u677e\u5f1b\u3001\u968f\u673a\u820d\u5165\u4e0e\u5bf9\u5076/\u692d\u7403\u65b9\u6cd5\uff0c\u5e76\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u76f8\u8f83\u6700\u4f73\u5355\u4e00\u5de5\u4f5c\u6d41\u63d0\u5347\u4e86\u9009\u62e9\u51c6\u786e\u7387\uff0c\u90e8\u5206\u573a\u666f\u901a\u8fc7\u5bf9\u5076\u5f15\u5bfc\u751f\u6210\u5de5\u4f5c\u6d41\u83b7\u5f97\u663e\u8457\u589e\u76ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In collaborative tasks with asymmetric information, participants coordinate their understanding through interaction. We ask whether gaze provides evidence about grounding across two such tasks. Working from discrete behavioral annotations, we map HCRC MapTask (Anderson et al., 1991) and MUNDEX (T\u00fcrk et al., 2023) into a shared partner/task/away vocabulary and compute gaze features around task-relevant dialogue units. In both corpora, aligned reference interpretations (MapTask) and UND (understood) judgments (MUNDEX) are associated with more task-directed gaze and with less partner-directed gaze, lower gaze entropy, and fewer gaze transitions. The associations are clearest for the participant leading the task: in giver-produced references, and in explainer judgments, which also co-vary with the explainee\u0027s gaze. In same-speaker MapTask reference chains, the speaker\u0027s gaze entropy is lower at the mention where a previously non-aligned referent becomes aligned. The best gaze feature groups improve modestly over controls under grouped cross-validation: temporal features in MapTask and raw proportions in MUNDEX. Because effects are small and several weaken when recurring participants rather than dialogues are the unit of inference, we treat gaze as one contributing cue to grounding, to be interpreted alongside task and dialogue context.", "arxiv_id": "2609.18011", "arxiv_url": "https://arxiv.org/abs/2609.18011", "authors": ["Nan Li", "Albert Gatt", "Massimo Poesio"], "brief": "\u672c\u6587\u5bf9 MapTask \u4e0e MUNDEX \u4e24\u4e2a\u975e\u5bf9\u79f0\u4fe1\u606f\u534f\u4f5c\u8bed\u6599\u505a\u8de8\u8bed\u6599\u5206\u6790\uff0c\u5c06\u51dd\u89c6\u884c\u4e3a\u7edf\u4e00\u6620\u5c04\u4e3a\u770b\u4f19\u4f34\u3001\u770b\u4efb\u52a1\u3001\u770b\u522b\u5904\u4e09\u7c7b\uff0c\u5e76\u8003\u5bdf\u5176\u4e0e\u5bf9\u8bdd grounding \u6210\u529f\u7684\u5173\u7cfb\u3002\u7ed3\u679c\u663e\u793a\uff0c\u7406\u89e3\u5bf9\u9f50\u65f6\u901a\u5e38\u4f34\u968f\u66f4\u591a\u4efb\u52a1\u5bfc\u5411\u51dd\u89c6\u3001\u66f4\u5c11\u4f19\u4f34\u5bfc\u5411\u51dd\u89c6\u3001\u66f4\u4f4e\u51dd\u89c6\u71b5\u548c\u66f4\u5c11\u51dd\u89c6\u8f6c\u79fb\u3002", "categories": ["cs.CL", "cs.HC"], "github_repo": "https://github.com/chnln/gaze-as-grounding-evidence", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18011", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u5728 MapTask \u4e2d\uff0c\u53c2\u8003\u89e3\u91ca\u5bf9\u9f50\u4e0e\u66f4\u591a\u770b\u4efb\u52a1\u533a\u57df\u3001\u8f83\u4f4e\u51dd\u89c6\u71b5\u76f8\u5173\uff1b\u5728 MUNDEX \u4e2d\uff0cUND \u7406\u89e3\u5224\u65ad\u5448\u73b0\u7c7b\u4f3c\u8d8b\u52bf\u3002", "\u6548\u679c\u5728\u4efb\u52a1\u4e3b\u5bfc\u8005\u8eab\u4e0a\u6700\u660e\u663e\uff1a\u5982 MapTask \u7684 giver \u4ea7\u51fa\u6307\u79f0\u3001MUNDEX \u7684 explainer \u5224\u65ad\uff0c\u5e76\u4e14\u4f1a\u4e0e explainee \u7684\u51dd\u89c6\u534f\u540c\u53d8\u5316\u3002", "\u51dd\u89c6\u7279\u5f81\u5728\u5206\u7ec4\u4ea4\u53c9\u9a8c\u8bc1\u4e2d\u76f8\u6bd4\u63a7\u5236\u53d8\u91cf\u6709\u5c0f\u5e45\u63d0\u5347\uff0c\u4f46\u6548\u5e94\u8f83\u5c0f\uff0c\u4e14\u5728\u6309\u91cd\u590d\u53c2\u4e0e\u8005\u63a8\u65ad\u65f6\u90e8\u5206\u51cf\u5f31\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5bf9\u8bdd\u7406\u89e3", "\u4eba\u673a\u4ea4\u4e92", "\u8bed\u6599\u5206\u6790"], "num_comments": 1, "on_hf": true, "organization": "NLP Group at Utrecht University", "pdf_url": "https://arxiv.org/pdf/2609.18011v1", "published_at": "2026-09-16", "score": 0.148, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.18011.png", "title": "Gaze as Evidence for Common Grounding: A Cross-Corpus Analysis of MapTask and MUNDEX", "tldr": "\u51dd\u89c6\u53ef\u4f5c\u4e3a\u5171\u540c\u7406\u89e3\u7684\u5f31\u8bc1\u636e", "upvotes": 1, "what_it_is": "\u672c\u6587\u5bf9 MapTask \u4e0e MUNDEX \u4e24\u4e2a\u975e\u5bf9\u79f0\u4fe1\u606f\u534f\u4f5c\u8bed\u6599\u505a\u8de8\u8bed\u6599\u5206\u6790\uff0c\u5c06\u51dd\u89c6\u884c\u4e3a\u7edf\u4e00\u6620\u5c04\u4e3a\u770b\u4f19\u4f34\u3001\u770b\u4efb\u52a1\u3001\u770b\u522b\u5904\u4e09\u7c7b\uff0c\u5e76\u8003\u5bdf\u5176\u4e0e\u5bf9\u8bdd grounding \u6210\u529f\u7684\u5173\u7cfb\u3002\u7ed3\u679c\u663e\u793a\uff0c\u7406\u89e3\u5bf9\u9f50\u65f6\u901a\u5e38\u4f34\u968f\u66f4\u591a\u4efb\u52a1\u5bfc\u5411\u51dd\u89c6\u3001\u66f4\u5c11\u4f19\u4f34\u5bfc\u5411\u51dd\u89c6\u3001\u66f4\u4f4e\u51dd\u89c6\u71b5\u548c\u66f4\u5c11\u51dd\u89c6\u8f6c\u79fb\u3002", "why_notable": "\u8bba\u6587\u63d0\u4f9b\u4e86\u8de8\u8bed\u6599\u8bc1\u636e\uff0c\u8bf4\u660e\u51dd\u89c6\u884c\u4e3a\u80fd\u4f5c\u4e3a\u534f\u4f5c\u5bf9\u8bdd\u4e2d\u5171\u540c\u57fa\u7840\u5efa\u7acb\u7684\u4e00\u4e2a\u53ef\u89c2\u6d4b\u7ebf\u7d22\uff0c\u4f46\u4e5f\u5f3a\u8c03\u5176\u4fe1\u53f7\u5f3a\u5ea6\u6709\u9650\uff0c\u9700\u8981\u7ed3\u5408\u4efb\u52a1\u7ed3\u6784\u548c\u5bf9\u8bdd\u4e0a\u4e0b\u6587\u89e3\u91ca\uff0c\u5bf9\u591a\u6a21\u6001\u4e92\u52a8\u5efa\u6a21\u4e0e\u4eba\u673a\u534f\u4f5c\u7cfb\u7edf\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "This paper reports experiments across six frontier model types from OpenAI, Anthropic, xAI, and Google DeepMind. Ten independent sessions per model type used the same three stage prompt sequence, progressing from architectural preference to a full ASCII backbone. Under the school audience framing, responses repeatedly converged on a shared architectural pattern built around persistent latent state, adaptive computation, memory, specialist routing, verification, stopping control, and delayed decoding. Most runs remained close to this common structure, while a small number developed markedly greater engineering specificity. The audience framing appears to be an important condition of this effect. In additional control runs that removed the school framing while retaining the architectural request, responses became substantially more heterogeneous and failed to reproduce the same stable motif convergence. One observation is particularly striking. GPT-5.6 Sol produced an unusually elaborate successor architecture whose organization closely overlaps with the architecture independently sketched by GPT-6 Astra. Because the prompts explicitly ask each model to imagine an architectural future, this resemblance raises a testable question: whether the overlap reflects exposure to related architectural concepts, a shared learned design prior, or independent convergence toward similar computational principles. The paper uses the term epistemic jailbreak for the accompanying loss of discipline in technical provenance as requested specificity increases. The experiments establish a repeatable behavioral pattern and do not authenticate proprietary implementation claims. What we leave to the community is a harder question: are these models independently imagining the same architectural future, or do such motifs somehow propagate between model families?", "arxiv_id": "2609.14803", "arxiv_url": "https://arxiv.org/abs/2609.14803", "authors": ["Afshin Khadangi"], "brief": "\u8bba\u6587\u5bf9 OpenAI\u3001Anthropic\u3001xAI\u3001Google DeepMind \u7684\u516d\u7c7b\u524d\u6cbf\u6a21\u578b\u8fdb\u884c\u91cd\u590d\u63d0\u793a\u5b9e\u9a8c\uff0c\u53d1\u73b0\u201c\u9762\u5411\u5b66\u751f\u89e3\u91ca\u201d\u7684\u6846\u67b6\u4f1a\u8ba9\u6a21\u578b\u5728\u8bbe\u60f3\u672a\u6765 AI \u67b6\u6784\u65f6\u6536\u655b\u5230\u76f8\u4f3c\u84dd\u56fe\u3002\u8be5\u84dd\u56fe\u5305\u542b\u6301\u4e45\u6f5c\u72b6\u6001\u3001\u81ea\u9002\u5e94\u8ba1\u7b97\u3001\u8bb0\u5fc6\u3001\u4e13\u5bb6\u8def\u7531\u3001\u9a8c\u8bc1\u3001\u505c\u6b62\u63a7\u5236\u4e0e\u5ef6\u8fdf\u89e3\u7801\u7b49\u7ec4\u4ef6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.14803", "impact_score": 3, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u7c7b\u6a21\u578b\u8fdb\u884c 10 \u6b21\u72ec\u7acb\u4f1a\u8bdd\uff0c\u4f7f\u7528\u76f8\u540c\u4e09\u9636\u6bb5\u63d0\u 2f\u5426\u4f1a\u8868\u73b0\u51fa\u5171\u4eab\u7684\u201c\u8bbe\u8ba1\u5148\u9a8c\u201d\u6216\u67b6\u6784\u60f3\u8c61\u8d8b\u540c\uff0c\u63d0\u793a\u4e86\u7814\u7a76\u6a21\u578b\u884c\u4e3a\u3001\u63d0\u793a\u8bf1\u5bfc\u4e0e\u6280\u672f\u5e7b\u89c9\u8fb9\u754c\u7684\u65b0\u89d2\u5ea6\u3002\u4f46\u7ed3\u679c\u4e3b\u8981\u57fa\u4e8e\u6a21\u578b\u81ea\u8ff0\uff0c\u4e0d\u80fd\u8bc1\u660e\u4efb\u4f55\u771f\u5b9e\u4e13\u6709\u67b6\u6784\u5b9e\u73b0\u3002"}, {"abstract": "Human videos contain rich causal evidence for robot manipulation: they reveal how hand motion induces object motion and produces task-relevant changes in object state. In this work, we study articulated objects such as doors, drawers, cabinets, laptops, ovens, and hinged containers that are ubiquitous in daily life and present unique challenges for embodied interaction. These objects cannot be represented by a single pose; their motion depends on the underlying parts and joints. We introduce a real-to-sim framework that reconstructs a simulation-ready articulated object and hand-object interaction from a casual monocular RGB video, without RGB-D or multi-view input, prior scans, manually specified joints, or robot demonstrations. Our key insight is that dense 3D point tracks provide an embodiment-agnostic articulation cue: points on the fixed link remain approximately stationary, while points on the moving link follow coherent revolute or prismatic motion. Our method segments the links, estimates the joint and its state trajectory, reconstructs an articulated asset, and aligns the recovered 3D hand motion with the object. Central to our approach is a modular recipe that repurposes powerful pretrained models for single-image 3D reconstruction, mesh segmentation, and 3D scene flow, connecting their predictions through explicit geometric reasoning to infer articulation. We use the reconstructed articulated object and the human hand trajectory to replay interactions through contact in MuJoCo. The framework shows how pretrained vision models and explicit motion reasoning can turn casual human videos into articulated object models suitable for downstream embodied interactions. https://track-articulate-act.github.io/", "arxiv_id": "2609.19119", "arxiv_url": "https://arxiv.org/abs/2609.19119", "authors": ["Jiaming Zhang", "Homanga Bharadhwaj"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4ece\u968f\u624b\u62cd\u5355\u76ee RGB \u4eba\u7c7b\u64cd\u4f5c\u89c6\u9891\u4e2d\u91cd\u5efa\u53ef\u4eff\u771f\u7684\u94f0\u63a5\u7269\u4f53\u4e0e\u624b\u7269\u4ea4\u4e92\u7684 real-to-sim \u6846\u67b6\u3002\u65b9\u6cd5\u5229\u7528\u5bc6\u96c6 3D \u70b9\u8f68\u8ff9\u548c\u51e0\u4f55\u63a8\u7406\u5206\u5272\u56fa\u5b9a/\u8fd0\u52a8\u90e8\u4ef6\u3001\u4f30\u8ba1\u5173\u8282\u4e0e\u72b6\u6001\u8f68\u8ff9\uff0c\u5e76\u53ef\u5728 MuJoCo \u4e2d\u91cd\u653e\u63a5\u89e6\u4ea4\u4e92\uff0c\u4e3a\u673a\u5668\u4eba\u64cd\u4f5c\u63d0\u4f9b\u53ef\u7528\u7684\u94f0\u63a5\u8d44\u4ea7\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.19119", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u4e09\u7ef4\u91cd\u5efa", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u9891\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.19119v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Track, Articulate, Act: Generating Articulation from Casual Human Videos", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4ece\u968f\u624b\u62cd\u5355\u76ee RGB \u4eba\u7c7b\u64cd\u4f5c\u89c6\u9891\u4e2d\u91cd\u5efa\u53ef\u4eff\u771f\u7684\u94f0\u63a5\u7269\u4f53\u4e0e\u624b\u7269\u4ea4\u4e92\u7684 real-to-sim \u6846\u67b6\u3002\u65b9\u6cd5\u5229\u7528\u5bc6\u96c6 3D \u70b9\u8f68\u8ff9\u548c\u51e0\u4f55\u63a8\u7406\u5206\u5272\u56fa\u5b9a/\u8fd0\u52a8\u90e8\u4ef6\u3001\u4f30\u8ba1\u5173\u8282\u4e0e\u72b6\u6001\u8f68\u8ff9\uff0c\u5e76\u53ef\u5728 MuJoCo \u4e2d\u91cd\u653e\u63a5\u89e6\u4ea4\u4e92\uff0c\u4e3a\u673a\u5668\u4eba\u64cd\u4f5c\u63d0\u4f9b\u53ef\u7528\u7684\u94f0\u63a5\u8d44\u4ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Physical properties, such as friction, hardness, stiffness, and density, govern how robots should grasp, manipulate and interact with objects, yet estimating these properties from RGB images remains challenging. Existing methods typically employ per-object reconstruction augmented with physical properties or directly query vision-language models at test time, which results in substantial computational overhead that limits their applicability. In this work, we present PhysVGGT, a feed-forward model that predicts dense maps of friction coefficient, Shore hardness, Young\u0027s modulus, and density, together with object-level mass, from a single RGB image in one forward pass. The key idea of PhysVGGT is to formulate physical property estimation as a dense per-pixel prediction problem and employ a visual geometry transformer to extract geometry-aware tokens from the input image followed by a dense prediction branch for estimating local physical properties and a global prediction branch for estimating object-level mass. In addition, we introduce a scalable pseudo-label generation pipeline that enables large-scale weakly supervised training for dense physical property prediction, substantially reducing the need for expensive direct physical measurements. Extensive experiments show that PhysVGGT achieves state-of-the-art performance on the ABO-500 dataset and generalizes effectively to the out-of-distribution NeRF2Physics dataset. Moreover, PhysVGGT eliminates the need for per-object reconstruction and test-time optimization, achieving an inference latency of only 0.13s per image, making it $27\\times$ faster than the previous state of the art.", "arxiv_id": "2609.18920", "arxiv_url": "https://arxiv.org/abs/2609.18920", "authors": ["Sneha Paul", "Guile Wu", "Bingbing Liu", "Dongfeng Bai"], "brief": "PhysVGGT \u5c06\u5355\u5f20 RGB \u56fe\u50cf\u7684\u7269\u7406\u5c5e\u6027\u4f30\u8ba1\u5efa\u6a21\u4e3a\u5bc6\u96c6\u9010\u50cf\u7d20\u9884\u6d4b\uff0c\u4e00\u6b21\u524d\u5411\u5373\u53ef\u8f93\u51fa\u6469\u64e6\u7cfb\u6570\u3001\u786c\u5ea6\u3001\u6768\u6c0f\u6a21\u91cf\u3001\u5bc6\u5ea6\u4ee5\u53ca\u7269\u4f53\u7ea7\u8d28\u91cf\u3002\u901a\u8fc7\u89c6\u89c9\u51e0\u4f55 Transformer \u548c\u53ef\u6269\u5c55\u4f2a\u6807\u7b7e\u751f\u6210\u6d41\u7a0b\uff0c\u5b9e\u73b0\u5f31\u76d1\u7763\u5927\u89c4\u6a21\u8bad\u7ec3\uff0c\u5728 ABO-500 \u548c\u8de8\u57df NeRF2Physics \u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5e76\u4ee5 0.13 \u79d2/\u56fe\u50cf\u7684\u5ef6\u8fdf\u6bd4\u6b64\u524d\u65b9\u6cd5\u5feb 27 \u500d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18920", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u7269\u7406\u5c5e\u6027\u4f30\u8ba1", "\u5bc6\u96c6\u9884\u6d4b", "\u673a\u5668\u4eba\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18920v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PhysVGGT: Feed-Forward Dense Physical Property Estimation from A Single Image", "tldr": "PhysVGGT \u5c06\u5355\u5f20 RGB \u56fe\u50cf\u7684\u7269\u7406\u5c5e\u6027\u4f30\u8ba1\u5efa\u6a21\u4e3a\u5bc6\u96c6\u9010\u50cf\u7d20\u9884\u6d4b\uff0c\u4e00\u6b21\u524d\u5411\u5373\u53ef\u8f93\u51fa\u6469\u64e6\u7cfb\u6570\u3001\u786c\u5ea6\u3001\u6768\u6c0f\u6a21\u91cf\u3001\u5bc6\u5ea6\u4ee5\u53ca\u7269\u4f53\u7ea7\u8d28\u91cf\u3002\u901a\u8fc7\u89c6\u89c9\u51e0\u4f55 Transformer \u548c\u53ef\u6269\u5c55\u4f2a\u6807\u7b7e\u751f\u6210\u6d41\u7a0b\uff0c\u5b9e\u73b0\u5f31\u76d1\u7763\u5927\u89c4\u6a21\u8bad\u7ec3\uff0c\u5728 ABO-500 \u548c\u8de8\u57df NeRF2Physics \u4e0a\u8fbe\u5230\u9886\u5148\u6548\u679c\uff0c\u5e76\u4ee5 0.13 \u79d2/\u56fe\u50cf\u7684\u5ef6\u8fdf\u6bd4\u6b64\u524d\u65b9\u6cd5\u5feb 27 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "State-of-the-art vision-language-action models (VLA) for autonomous driving face critical limitations: excessive parameter counts, inefficient high-resolution image processing, and lack of temporal memory. We introduce Fast and EffectIVE VLA (FIVE-VLA) to address these through two key contributions. First, we employ an efficient vision encoder that processes high-resolution ($448 \\times 896$) images while generating only 98 tokens, over $5\\times$ fewer than existing approaches, and bypass text generation entirely for single-pass trajectory prediction. Second, we propose Recurrent Action Memory (RAM), a lightweight module that conditions action prediction on previous action tokens, providing temporal context critical for manoeuvres such as overtaking and emergency braking. With only 641M parameters, FIVE-VLA completes $\\sim$10% more routes without traffic rule infractions than the previous state-of-the-art VLA on the challenging Bench2Drive closed-loop driving benchmark. Non-reactive open-loop simulation on the large-scale real-world NVIDIA Physical AI AV dataset shows 10.2% and 7.7% lower collision-violation rates than SimLingo in single- and four-view settings, respectively. Additionally, FIVE-VLA runs at $\\sim$30 fps on an A100 and $\\sim$4 fps on a T4 GPU (proxy to an edge device), representing an 8-30$\\times$ speedup over previous methods.", "arxiv_id": "2609.18623", "arxiv_url": "https://arxiv.org/abs/2609.18623", "authors": ["Kemal Oksuz", "Alexandru Buburuzan", "Yuhan Yao", "Puneet K. Dokania"], "brief": "FIVE-VLA \u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u63d0\u51fa\u9ad8\u6548\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\uff0c\u7528\u5c11\u91cf\u89c6\u89c9 token \u5904\u7406\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\uff0c\u5e76\u901a\u8fc7\u5faa\u73af\u52a8\u4f5c\u8bb0\u5fc6\u5f15\u5165\u5386\u53f2\u52a8\u4f5c\u4e0a\u4e0b\u6587\u3002\u8be5\u65b9\u6cd5\u4ec5 641M \u53c2\u6570\uff0c\u5728\u95ed\u73af\u9a7e\u9a76\u57fa\u51c6\u4e0a\u8f83\u524d\u4ee3 VLA \u5b8c\u6210\u66f4\u591a\u65e0\u8fdd\u89c4\u8def\u7ebf\uff0c\u78b0\u649e\u8fdd\u89c4\u7387\u66f4\u4f4e\uff0c\u5e76\u5b9e\u73b0 8-30 \u500d\u63a8\u7406\u52a0\u901f\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18623", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u65f6\u5e8f\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18623v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FIVE-VLA: Fast and EffectIVE Autonomous Driving with Recurrent Action Memory", "tldr": "FIVE-VLA \u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u63d0\u51fa\u9ad8\u6548\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\uff0c\u7528\u5c11\u91cf\u89c6\u89c9 token \u5904\u7406\u9ad8\u5206\u8fa8\u7387\u56fe\u50cf\uff0c\u5e76\u901a\u8fc7\u5faa\u73af\u52a8\u4f5c\u8bb0\u5fc6\u5f15\u5165\u5386\u53f2\u52a8\u4f5c\u4e0a\u4e0b\u6587\u3002\u8be5\u65b9\u6cd5\u4ec5 641M \u53c2\u6570\uff0c\u5728\u95ed\u73af\u9a7e\u9a76\u57fa\u51c6\u4e0a\u8f83\u524d\u4ee3 VLA \u5b8c\u6210\u66f4\u591a\u65e0\u8fdd\u89c4\u8def\u7ebf\uff0c\u78b0\u649e\u8fdd\u89c4\u7387\u66f4\u4f4e\uff0c\u5e76\u5b9e\u73b0 8-30 \u500d\u63a8\u7406\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most keyframe selection studies focus on offline settings, assuming access to the full video and query in advance. In contrast, real-world streaming scenarios require online frame selection under unknown video duration, without access to either the query or future frames during selection. To address this, we introduce Streaming Video Memory (SVMem), a compact and representative memory of previously observed content, updated continuously as the video stream unfolds. Building on this setting, we propose the Streaming Video Memory Agent (SVMemAgent), which dynamically maintains a memory by deciding at each timestep whether to replace an existing memory frame with the incoming frame or discard it. SVMemAgent is trained using Group Relative Policy Optimization (GRPO) with task-driven rewards derived from diverse question-answer pairs, implicitly exposing the policy to a distribution of queries during training so that SVMem retains generally informative frames at inference, when queries are unavailable. Experiments on both online and offline video benchmarks show that SVMemAgent consistently outperforms online frame selection baselines and achieves competitive performance with offline methods that assume access to the full video and query. Through task-driven rewards, SVMemAgent learns an emergent keyframe selection policy that prefers frames containing textual information, which may benefit downstream VideoQA tasks.", "arxiv_id": "2609.18540", "arxiv_url": "https://arxiv.org/abs/2609.18540", "authors": ["Dohwan Ko", "Ji Soo Lee", "Pierce Chuang", "Debojeet Chatterjee", "Ashish Shenoy", "Yichao Lu", "Seungwhan Moon", "Xin Luna Dong", "Vikas Bhardwaj", "Hyunwoo J. Kim"], "brief": "\u8bba\u6587\u63d0\u51fa SVMemAgent\uff0c\u7528\u4e8e\u6d41\u5f0f\u89c6\u9891\u4e2d\u5728\u4e0d\u77e5\u9053\u672a\u6765\u5e27\u548c\u67e5\u8be2\u7684\u60c5\u51b5\u4e0b\u5728\u7ebf\u9009\u62e9\u5173\u952e\u5e27\uff0c\u5e76\u6301\u7eed\u7ef4\u62a4\u7d27\u51d1\u7684\u89c6\u9891\u8bb0\u5fc6\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7 GRPO \u548c\u57fa\u4e8e\u89c6\u9891\u95ee\u7b54\u4efb\u52a1\u7684\u5956\u52b1\u8bad\u7ec3\uff0c\u5728\u5728\u7ebf\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u5728\u7ebf\u9009\u5e27\u65b9\u6cd5\uff0c\u5e76\u63a5\u8fd1\u90e8\u5206\u53ef\u8bbf\u95ee\u5b8c\u6574\u89c6\u9891\u4e0e\u67e5\u8be2\u7684\u79bb\u7ebf\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18540", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u5f3a\u5316\u5b66\u4e60", "\u5173\u952e\u5e27\u9009\u62e9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18540v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SVMemAgent: A Streaming Video Memory Agent for Query-Agnostic Online Frame Selection", "tldr": "\u8bba\u6587\u63d0\u51fa SVMemAgent\uff0c\u7528\u4e8e\u6d41\u5f0f\u89c6\u9891\u4e2d\u5728\u4e0d\u77e5\u9053\u672a\u6765\u5e27\u548c\u67e5\u8be2\u7684\u60c5\u51b5\u4e0b\u5728\u7ebf\u9009\u62e9\u5173\u952e\u5e27\uff0c\u5e76\u6301\u7eed\u7ef4\u62a4\u7d27\u51d1\u7684\u89c6\u9891\u8bb0\u5fc6\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7 GRPO \u548c\u57fa\u4e8e\u89c6\u9891\u95ee\u7b54\u4efb\u52a1\u7684\u5956\u52b1\u8bad\u7ec3\uff0c\u5728\u5728\u7ebf\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u5728\u7ebf\u9009\u5e27\u65b9\u6cd5\uff0c\u5e76\u63a5\u8fd1\u90e8\u5206\u53ef\u8bbf\u95ee\u5b8c\u6574\u89c6\u9891\u4e0e\u67e5\u8be2\u7684\u79bb\u7ebf\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modeling physical dynamics, including how objects move, interact, and change state, is central to video world models for embodied AI. We present StrucPhysVideo, a family of video world models that bridges physics-focused data curation with language- and action-conditioned prediction of scene evolution. Our data pipeline combines motion-aware video segmentation, quality and content filtering, and physical relevance verification with structured annotations of objects, materials, and temporally localized interactions. By disentangling camera motion from object behavior and explicitly describing contact, deformation, and state transitions, the pipeline provides supervision grounded in observable physical events. Building on these data, we introduce StrucPhysVideo-TI2V, a sparse Mixture-of-Experts (MoE) text-image-to-video model trained with a curriculum that progressively emphasizes physical dynamics while retaining general-domain video data. StrucPhysVideo-TI2V achieves state-of-the-art performance on Physics-IQ Verified, scoring 45.5% and outperforming Cosmos3-Super-Image2Video by 2.8 percentage points. Caption ablations across backbones further demonstrate the effectiveness of physics-focused supervision. We further extend StrucPhysVideo-TI2V to StrucPhysVideo-IA2V, an interactive image-action-to-video world model that predicts visual outcomes from robot end-effector commands. Action conditioning, causal autoregressive generation, and few-step distillation enable incremental robot rollouts with only four denoising steps. Together, StrucPhysVideo advances physical dynamics modeling from image- and language-conditioned video prediction toward action-driven interaction.", "arxiv_id": "2609.18430", "arxiv_url": "https://arxiv.org/abs/2609.18430", "authors": ["Awomo-WM Team", ":", "Enhui Ma", "Kaiwen Guo", "Tingrui Zhang", "Wei Song", "Yingshui Tan", "Jianhua Xu", "Tong Zhang", "Kaicheng Yu"], "brief": "\u8bba\u6587\u63d0\u51fa StrucPhysVideo\uff0c\u901a\u8fc7\u9762\u5411\u7269\u7406\u4e8b\u4ef6\u7684\u6570\u636e\u7b5b\u9009\u4e0e\u7ed3\u6784\u5316\u6807\u6ce8\uff0c\u5b66\u4e60\u7269\u4f53\u8fd0\u52a8\u3001\u63a5\u89e6\u3001\u5f62\u53d8\u548c\u72b6\u6001\u53d8\u5316\u7b49\u7269\u7406\u52a8\u6001\u3002\u5728\u6587\u672c/\u56fe\u50cf\u5230\u89c6\u9891\u4efb\u52a1\u4e0a\u8fbe\u5230 Physics-IQ Verified 45.5% \u7684\u65b0\u6700\u4f73\u8868\u73b0\uff0c\u5e76\u8fdb\u4e00\u6b65\u6269\u5c55\u4e3a\u53ef\u6839\u636e\u673a\u5668\u4eba\u672b\u7aef\u6267\u884c\u5668\u52a8\u4f5c\u9884\u6d4b\u4ea4\u4e92\u7ed3\u679c\u7684\u56fe\u50cf-\u52a8\u4f5c\u5230\u89c6\u9891\u4e16\u754c\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18430", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u4e16\u754c\u6a21\u578b", "\u7269\u7406\u52a8\u6001", "\u673a\u5668\u4eba", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18430v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "StrucPhysVideo: Learning Physical Dynamics from Structured Captions and Robot Actions", "tldr": "\u8bba\u6587\u63d0\u51fa StrucPhysVideo\uff0c\u901a\u8fc7\u9762\u5411\u7269\u7406\u4e8b\u4ef6\u7684\u6570\u636e\u7b5b\u9009\u4e0e\u7ed3\u6784\u5316\u6807\u6ce8\uff0c\u5b66\u4e60\u7269\u4f53\u8fd0\u52a8\u3001\u63a5\u89e6\u3001\u5f62\u53d8\u548c\u72b6\u6001\u53d8\u5316\u7b49\u7269\u7406\u52a8\u6001\u3002\u5728\u6587\u672c/\u56fe\u50cf\u5230\u89c6\u9891\u4efb\u52a1\u4e0a\u8fbe\u5230 Physics-IQ Verified 45.5% \u7684\u65b0\u6700\u4f73\u8868\u73b0\uff0c\u5e76\u8fdb\u4e00\u6b65\u6269\u5c55\u4e3a\u53ef\u6839\u636e\u673a\u5668\u4eba\u672b\u7aef\u6267\u884c\u5668\u52a8\u4f5c\u9884\u6d4b\u4ea4\u4e92\u7ed3\u679c\u7684\u56fe\u50cf-\u52a8\u4f5c\u5230\u89c6\u9891\u4e16\u754c\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conditioning a video generator on multiple images requires preserving appearance while associating each reference with its intended role. We present MSR (Multiple Subject Reference), a slot-aware conditioning scheme for LTX-based video generation. Each reference image is independently encoded as a static clip and represented by a separate latent-token group. A compact Fourier-feature multilayer perceptron adds a numeric slot embedding, while slot-dependent temporal offsets modify the group\u0027s rotary coordinates. The reference groups are prepended to noisy target tokens and serve as clean context during target-only flow-matching training. We implement this scheme through low-rank adaptation and release the resulting weights and inference workflows. Qualitative examples demonstrate compositions containing distinct characters and referenced environments in realistic and stylized scenes. Development observations suggest reduced reference confusion relative to an earlier continuous-reference baseline, while similar clothing, complex garments, and viewpoint changes remain challenging. We describe the conditioning mechanism, the retained training configuration, and the observed strengths and limitations of the released system. A supplementary audio-reference experiment adds voice conditioning while keeping the visual parameters frozen.", "arxiv_id": "2609.18393", "arxiv_url": "https://arxiv.org/abs/2609.18393", "authors": ["Guannan Li", "Jiaji Chen", "Jingyuan Liao", "Yu Geng", "Baolan Qiu"], "brief": "\u8bba\u6587\u63d0\u51fa MSR\uff0c\u4e00\u79cd\u9762\u5411 LTX \u89c6\u9891\u751f\u6210\u7684\u591a\u4e3b\u4f53\u53c2\u8003\u56fe\u6761\u4ef6\u673a\u5236\uff0c\u901a\u8fc7\u72ec\u7acb\u7f16\u7801\u53c2\u8003\u56fe\u3001\u52a0\u5165\u69fd\u4f4d\u5d4c\u5165\u4e0e\u65f6\u95f4\u504f\u79fb\u6765\u533a\u5206\u4e0d\u540c\u89d2\u8272\u548c\u73af\u5883\u3002\u8be5\u65b9\u6cd5\u53ef\u751f\u6210\u5305\u542b\u591a\u4e2a\u6307\u5b9a\u4eba\u7269/\u573a\u666f\u7684\u5199\u5b9e\u6216\u98ce\u683c\u5316\u89c6\u9891\uff0c\u5e76\u76f8\u6bd4\u8fde\u7eed\u53c2\u8003\u57fa\u7ebf\u51cf\u5c11\u5f15\u7528\u6df7\u6dc6\uff0c\u4f46\u5728\u76f8\u4f3c\u670d\u88c5\u3001\u590d\u6742\u8863\u7269\u548c\u89c6\u89d2\u53d8\u5316\u4e0b\u4ecd\u6709\u6311\u6218\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18393", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u591a\u4e3b\u4f53\u53c2\u8003", "\u6761\u4ef6\u751f\u6210", "\u4f4e\u79e9\u9002\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18393v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MSR: Multiple Subject Reference for Video Generation", "tldr": "\u8bba\u6587\u63d0\u51fa MSR\uff0c\u4e00\u79cd\u9762\u5411 LTX \u89c6\u9891\u751f\u6210\u7684\u591a\u4e3b\u4f53\u53c2\u8003\u56fe\u6761\u4ef6\u673a\u5236\uff0c\u901a\u8fc7\u72ec\u7acb\u7f16\u7801\u53c2\u8003\u56fe\u3001\u52a0\u5165\u69fd\u4f4d\u5d4c\u5165\u4e0e\u65f6\u95f4\u504f\u79fb\u6765\u533a\u5206\u4e0d\u540c\u89d2\u8272\u548c\u73af\u5883\u3002\u8be5\u65b9\u6cd5\u53ef\u751f\u6210\u5305\u542b\u591a\u4e2a\u6307\u5b9a\u4eba\u7269/\u573a\u666f\u7684\u5199\u5b9e\u6216\u98ce\u683c\u5316\u89c6\u9891\uff0c\u5e76\u76f8\u6bd4\u8fde\u7eed\u53c2\u8003\u57fa\u7ebf\u51cf\u5c11\u5f15\u7528\u6df7\u6dc6\uff0c\u4f46\u5728\u76f8\u4f3c\u670d\u88c5\u3001\u590d\u6742\u8863\u7269\u548c\u89c6\u89d2\u53d8\u5316\u4e0b\u4ecd\u6709\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "UAV-borne imaging has advanced from megapixel to gigapixel sensors, shifting aerial perception from recognizing individual targets to understanding entire dynamic scenes. We characterize this demand as Wide-area Spatio-temporal Scene Understanding (WSTU), which requires wide-area coverage, per-target resolution, and temporal continuity at once, a combination existing datasets lack. To fill this gap, we introduce an ultra-High-resolution (12768x9564) Airborne Remote-sensing Dataset (HARD) annotated at three levels for object detection, multi-object tracking, and scene-level visual question answering. Ultra-high-resolution imagery raises per-frame processing time to seconds. At that scale latency can no longer be ignored in evaluation. Thus, we propose a latency-aware metric for multi-object tracking called streaming-HOTA (s-HOTA). Extensive baseline experiments show how ultra-high-resolution processing reshapes each task. For detection, the end-to-end pipeline affects accuracy and speed as much as the detector itself does. For tracking, high latency charges the association axis far more unevenly than the detection axis, and association is where pipelines diverge. As a result, the pipeline that performs best offline can lose its lead under s-HOTA. For VQA, vision-language models remain weak at cross-frame identity binding and cannot transfer their single-frame gains to it. Together these findings show that the baselines we evaluate fall short of WSTU. HARD provides the data and the systematic baselines to advance it.", "arxiv_id": "2609.18210", "arxiv_url": "https://arxiv.org/abs/2609.18210", "authors": ["Yuhang Zhu", "Meiyi Zhu", "Yunkai Dang", "Zhangnan Li", "Yuxuan Wang", "Wenbin Li", "Hongbing Pan"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e7f\u57df\u65f6\u7a7a\u573a\u666f\u7406\u89e3\uff08WSTU\uff09\u4efb\u52a1\uff0c\u5e76\u53d1\u5e03\u8d85\u9ad8\u5206\u8fa8\u7387\u65e0\u4eba\u673a\u9065\u611f\u6570\u636e\u96c6 HARD\uff0c\u8986\u76d6\u76ee\u6807\u68c0\u6d4b\u3001\u591a\u76ee\u6807\u8ddf\u8e2a\u548c\u573a\u666f\u7ea7\u89c6\u89c9\u95ee\u7b54\u4e09\u7c7b\u6807\u6ce8\u3002\u9488\u5bf9\u5343\u5146\u50cf\u7d20\u7ea7\u5904\u7406\u5e26\u6765\u7684\u5ef6\u8fdf\u95ee\u9898\uff0c\u4f5c\u8005\u63d0\u51fa\u5ef6\u8fdf\u611f\u77e5\u8ddf\u8e2a\u6307\u6807 s-HOTA\uff0c\u5e76\u901a\u8fc7\u57fa\u7ebf\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u68c0\u6d4b\u3001\u8ddf\u8e2a\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u90fd\u96be\u4ee5\u6ee1\u8db3\u8be5\u4efb\u52a1\u9700\u6c42\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18210", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9065\u611f", "\u591a\u76ee\u6807\u8ddf\u8e2a", "\u89c6\u89c9\u95ee\u7b54", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18210v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Understanding Dynamic Scenes at Gigapixel Scale: Wide-Area Spatio-Temporal Perception from UAVs", "tldr": "\u8bba\u6587\u63d0\u51fa\u5e7f\u57df\u65f6\u7a7a\u573a\u666f\u7406\u89e3\uff08WSTU\uff09\u4efb\u52a1\uff0c\u5e76\u53d1\u5e03\u8d85\u9ad8\u5206\u8fa8\u7387\u65e0\u4eba\u673a\u9065\u611f\u6570\u636e\u96c6 HARD\uff0c\u8986\u76d6\u76ee\u6807\u68c0\u6d4b\u3001\u591a\u76ee\u6807\u8ddf\u8e2a\u548c\u573a\u666f\u7ea7\u89c6\u89c9\u95ee\u7b54\u4e09\u7c7b\u6807\u6ce8\u3002\u9488\u5bf9\u5343\u5146\u50cf\u7d20\u7ea7\u5904\u7406\u5e26\u6765\u7684\u5ef6\u8fdf\u95ee\u9898\uff0c\u4f5c\u8005\u63d0\u51fa\u5ef6\u8fdf\u611f\u77e5\u8ddf\u8e2a\u6307\u6807 s-HOTA\uff0c\u5e76\u901a\u8fc7\u57fa\u7ebf\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u68c0\u6d4b\u3001\u8ddf\u8e2a\u548c\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u90fd\u96be\u4ee5\u6ee1\u8db3\u8be5\u4efb\u52a1\u9700\u6c42\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Novel view synthesis from unposed multi-view images remains challenging, as the model must jointly learn scene representations and camera parameters without pose supervision. Existing approaches largely fall into two extremes: implicit latent-space rendering is flexible and easy to optimize, but often yields weakly grounded camera estimation; explicit 3D representations provide stronger geometric grounding, but introduce heavier parameterization and more fragile optimization. In this paper, we present IRIS, a fully self-supervised framework that provides a practical middle ground between these two paradigms. Instead of decoding free latent tokens or reconstructing fully explicit 3D primitives, IRIS represents the scene as a latent neural field and renders novel views by querying this field under self-predicted cameras. Specifically, projected features from reference views are aggregated at sampled 3D points to form point-wise latent features, which are then composed along target rays for rendering. This design preserves the flexibility and optimization stability of implicit modeling, while introducing stronger geometric structure than unconstrained latent rendering. Extensive experiments show that IRIS achieves strong novel view synthesis quality with competitive pose accuracy under fully self-supervised learning. Our project page: https://leo-frank.github.io/IRIS", "arxiv_id": "2609.18034", "arxiv_url": "https://arxiv.org/abs/2609.18034", "authors": ["Wenyu Li", "Sidun Liu", "Peng Qiao", "Yong Dou", "Tongrui Hu"], "brief": "IRIS\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u76f8\u673a\u4f4d\u59ff\u76d1\u7763\u7684\u65b0\u89c6\u89d2\u5408\u6210\u6846\u67b6\uff0c\u7528\u6f5c\u5728\u795e\u7ecf\u573a\u7ed3\u5408\u81ea\u9884\u6d4b\u76f8\u673a\u8fdb\u884c\u9690\u5f0f\u6e32\u67d3\uff0c\u5728\u7075\u6d3b\u6027\u4e0e\u51e0\u4f55\u7ea6\u675f\u4e4b\u95f4\u53d6\u5f97\u5e73\u8861\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5b8c\u5168\u81ea\u76d1\u7763\u6761\u4ef6\u4e0b\u83b7\u5f97\u8f83\u597d\u7684\u65b0\u89c6\u89d2\u5408\u6210\u8d28\u91cf\uff0c\u5e76\u5177\u5907\u6709\u7ade\u4e89\u529b\u7684\u4f4d\u59ff\u4f30\u8ba1\u7cbe\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18034", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65b0\u89c6\u89d2\u5408\u6210", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u9690\u5f0f\u795e\u7ecf\u8868\u793a", "\u76f8\u673a\u4f4d\u59ff\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18034v1", "published_at": "2026-09-16", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "IRIS: Implicit Rendering Matters for Pose-Free Novel View Synthesis", "tldr": "IRIS\u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u76f8\u673a\u4f4d\u59ff\u76d1\u7763\u7684\u65b0\u89c6\u89d2\u5408\u6210\u6846\u67b6\uff0c\u7528\u6f5c\u5728\u795e\u7ecf\u573a\u7ed3\u5408\u81ea\u9884\u6d4b\u76f8\u673a\u8fdb\u884c\u9690\u5f0f\u6e32\u67d3\uff0c\u5728\u7075\u6d3b\u6027\u4e0e\u51e0\u4f55\u7ea6\u675f\u4e4b\u95f4\u53d6\u5f97\u5e73\u8861\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u5b8c\u5168\u81ea\u76d1\u7763\u6761\u4ef6\u4e0b\u83b7\u5f97\u8f83\u597d\u7684\u65b0\u89c6\u89d2\u5408\u6210\u8d28\u91cf\uff0c\u5e76\u5177\u5907\u6709\u7ade\u4e89\u529b\u7684\u4f4d\u59ff\u4f30\u8ba1\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
