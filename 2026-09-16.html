ce8\u610f\u529b\uff0c\u4e14\u8ba1\u7b97\u4e0e\u53c2\u6570\u66f4\u7701\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18145", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6bcf\u5c42\u4ec5\u7528\u7ea62n\u6761\u8fde\u63a5\uff0c\u6309\u8d85\u7acb\u65b9\u7ef4\u5ea6\u8f6e\u6362\uff0clog\u2082 n\u5c42\u5373\u53ef\u8ba9\u4efb\u610f\u4f4d\u7f6e\u7684\u4fe1\u606f\u5230\u8fbe\u4efb\u610f\u5176\u4ed6\u4f4d\u7f6e", "\u5408\u6210\u4efb\u52a1\u4e2d\uff0c\u65cb\u8f6c\u7a00\u758f\u8fde\u63a5\u4ee51/32\u8fde\u63a5\u6570\u5339\u914d\u5168\u8fde\u63a5\u6ce8\u610f\u529b\uff0c\u800c\u56fa\u5b9a\u4e0d\u65cb\u8f6c\u7684\u540c\u6837\u7a00\u758f\u6a21\u5f0f\u5931\u8d25", "\u5728enwik8\u524d1200\u4e07\u5b57\u7b26\u4e0a\uff0c\u6df7\u5408\u6a21\u578b\u6bd4\u540c\u5bbd\u5168\u6ce8\u610f\u529b\u4f4e0.06 bpc\uff0c\u8fde\u63a5\u6570\u7ea6\u4e3a1/7\u3001\u53c2\u6570\u5c1142%\u3001\u901f\u5ea6\u5feb2.4\u500d"], "keywords": ["\u7a00\u758f\u6ce8\u610f\u529b", "\u5e8f\u5217\u5efa\u6a21", "\u9ad8\u6548\u67b6\u6784", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18145v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Reaching Every Position Without Searching: Rotating Sparse Wiring on the Hypercube as a Substitute for Attention", "tldr": "\u8d85\u7acb\u65b9\u65cb\u8f6c\u7a00\u758f\u8fde\u63a5\u53ef\u90e8\u5206\u66ff\u4ee3\u6ce8\u610f\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u5e8f\u5217\u4f4d\u7f6e\u89c6\u4e3a\u8d85\u7acb\u65b9\u4f53\u9876\u70b9\uff0c\u5728\u4e0d\u540c\u5c42\u6309\u7ef4\u5ea6\u8f6e\u6362\u8fde\u63a5\u76f8\u90bb\u4f4d\u7f6e\uff0c\u4f7f\u4fe1\u606f\u5728log n\u5c42\u5185\u8986\u76d6\u5168\u5c40\u3002\u5b9e\u9a8c\u663e\u793a\u8fd9\u79cd\u56fa\u5b9a\u7a00\u758f\u5e03\u7ebf\u5728\u5408\u6210\u5168\u5c40\u4f9d\u8d56\u4efb\u52a1\u548c\u5b57\u7b26\u7ea7\u8bed\u8a00\u5efa\u6a21\u4e2d\u53ef\u63a5\u8fd1\u6216\u4f18\u4e8e\u5168\u6ce8\u610f\u529b\uff0c\u4e14\u8ba1\u7b97\u4e0e\u53c2\u6570\u66f4\u7701\u3002", "why_notable": "\u5b83\u6311\u6218\u4e86\u6bcf\u5c42\u52a8\u6001\u641c\u7d22\u6ce8\u610f\u5bf9\u8c61\u7684\u5fc5\u8981\u6027\uff0c\u8868\u660e\u7ed3\u6784\u5316\u3001\u53ef\u8986\u76d6\u5168\u5c40\u7684\u56fa\u5b9a\u7a00\u758f\u901a\u4fe1\u53ef\u80fd\u4ee5\u66f4\u4f4e\u6210\u672c\u652f\u6491\u5e8f\u5217\u5efa\u6a21\uff0c\u5e76\u5e26\u6765\u66f4\u5bbd\u7684\u5b66\u4e60\u7387\u7a33\u5b9a\u533a\u95f4\u3002"}, {"abstract": "Open-source video generative models ship almost exclusively as PyTorch/CUDA reference implementations. This leaves Cloud TPU pods without a production-ready inference path, despite offering large, cost-effective accelerator memory pools ideal for long-sequence spatiotemporal attention. We present vidax, an open-source JAX/Flax inference engine and zero-copy PyTorch-to-JAX weight translator for modern video generation architectures. vidax covers a diverse set of spatiotemporal models --- including Diffusion Transformers, omnimodal Mixture-of-Transformers, 3D VAEs, text encoders, and native samplers --- with zero PyTorch dependency in the execution path. The framework unifies 1D tensor parallelism with DeepSpeed-Ulysses sequence parallelism on a single JAX sharding mesh, integrates TPU flash-attention kernels, and implements per-layer weight offloading to support reference resolutions that exceed single-device memory. We benchmark compile times, latency, and peak memory utilization on TPU v4-8 hardware, and document real-world numerical bugs surfaced during checkpoint translation. vidax is released open-source as a baseline for JAX and TPU video generation research.", "arxiv_id": "2609.18077", "arxiv_url": "https://arxiv.org/abs/2609.18077", "authors": ["Congyue Deng"], "brief": "\u8bba\u6587\u63d0\u51fa vidax\uff0c\u4e00\u4e2a\u5f00\u6e90 JAX/Flax \u89c6\u9891\u751f\u6210\u63a8\u7406\u5f15\u64ce\uff0c\u5e76\u63d0\u4f9b\u96f6\u62f7\u8d1d PyTorch \u5230 JAX \u7684\u6743\u91cd\u8f6c\u6362\u5668\u3002\u5b83\u652f\u6301\u6269\u6563 Transformer\u3001Mixture-of-Transformers\u30013D VAE\u3001\u6587\u672c\u7f16\u7801\u5668\u548c\u91c7\u6837\u5668\u7b49\u73b0\u4ee3\u89c6\u9891\u751f\u6210\u7ec4\u4ef6\uff0c\u5728\u6267\u884c\u8def\u5f84\u4e2d\u4e0d\u4f9d\u8d56 PyTorch\u3002", "categories": ["cs.CV", "cs.DC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18077", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u5355\u4e00 JAX sharding mesh \u4e0a\u7edf\u4e00 1D \u5f20\u91cf\u5e76\u884c\u4e0e DeepSpeed-Ulysses \u5e8f\u5217\u5e76\u884c\uff0c\u9002\u914d TPU pod \u7684\u5927\u89c4\u6a21\u5e76\u884c\u63a8\u7406\u3002", "\u96c6\u6210 TPU flash-attention\uff0c\u5e76\u5b9e\u73b0\u9010\u5c42\u6743\u91cd\u5378\u8f7d\uff0c\u4ee5\u652f\u6301\u8d85\u51fa\u5355\u5361\u663e\u5b58\u7684\u9ad8\u5206\u8fa8\u7387\u89c6\u9891\u751f\u6210\u3002", "\u5728 TPU v4-8 \u4e0a\u8bc4\u6d4b\u7f16\u8bd1\u65f6\u95f4\u3001\u5ef6\u8fdf\u4e0e\u5cf0\u503c\u5185\u5b58\uff0c\u5e76\u8bb0\u5f55\u6743\u91cd\u8f6c\u6362\u4e2d\u53d1\u73b0\u7684\u771f\u5b9e\u6570\u503c\u4e00\u81f4\u6027\u95ee\u9898\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "JAX", "\u5206\u5e03\u5f0f\u63a8\u7406", "\u6269\u6563\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18077v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "vidax: A Unified JAX Framework for Video Generative Models on Accelerator Meshes", "tldr": "\u9762\u5411TPU\u7684\u89c6\u9891\u751f\u6210JAX\u63a8\u7406\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa vidax\uff0c\u4e00\u4e2a\u5f00\u6e90 JAX/Flax \u89c6\u9891\u751f\u6210\u63a8\u7406\u5f15\u64ce\uff0c\u5e76\u63d0\u4f9b\u96f6\u62f7\u8d1d PyTorch \u5230 JAX \u7684\u6743\u91cd\u8f6c\u6362\u5668\u3002\u5b83\u652f\u6301\u6269\u6563 Transformer\u3001Mixture-of-Transformers\u30013D VAE\u3001\u6587\u672c\u7f16\u7801\u5668\u548c\u91c7\u6837\u5668\u7b49\u73b0\u4ee3\u89c6\u9891\u751f\u6210\u7ec4\u4ef6\uff0c\u5728\u6267\u884c\u8def\u5f84\u4e2d\u4e0d\u4f9d\u8d56 PyTorch\u3002", "why_notable": "\u5f53\u524d\u5f00\u6e90\u89c6\u9891\u751f\u6210\u6a21\u578b\u591a\u4ee5 PyTorch/CUDA \u4e3a\u4e3b\uff0cvidax \u4e3a Cloud TPU \u63d0\u4f9b\u4e86\u53ef\u7528\u7684\u751f\u4ea7\u7ea7 JAX \u63a8\u7406\u8def\u5f84\uff0c\u6709\u52a9\u4e8e\u964d\u4f4e\u957f\u5e8f\u5217\u89c6\u9891\u751f\u6210\u7684\u786c\u4ef6\u95e8\u69db\uff0c\u5e76\u63a8\u52a8 TPU \u4e0a\u7684\u89c6\u9891\u751f\u6210\u7814\u7a76\u4e0e\u90e8\u7f72\u3002"}, {"abstract": "Large language models (LLMs) often suffer from capability stagnation in self-improvement training because fixed difficulty levels fail to adapt to their evolving proficiency. To address this issue, we propose STRETCH (Self-Taught Reasoning Evolution via Targeted CHallenge), a unified framework inspired by cognitive scaffolding theory. STRETCH introduces a dynamic Stretch Zone mechanism that continuously aligns question difficulty with the model\u0027s solving capability. Within a single parameter space, the model alternates between a Scaffolder that generates adaptive, boundary-pushing challenges and a Learner that that optimizes its solving trajectories through reinforcement learning. This dual-loop co-evolution effectively stabilizes training, mitigates reward hacking and promote progressive reasoning growth. Experiments on both negotiation and operation research benchmarks demonstrate that STRETCH consistently outperforms strong prompting and domain-specific baselines. Further scaffolder configuration analysis shows that dynamic difficulty alignment is critical for sustained capability improvement and synchronized reasoning evolution.", "arxiv_id": "2609.18642", "arxiv_url": "https://arxiv.org/abs/2609.18642", "authors": ["Yajie Yu", "Mark Lee", "Yue Feng"], "brief": "\u63d0\u51fa STRETCH\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u81ea\u6559\u5b66\u63a8\u7406\u8fdb\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u52a8\u6001\u201cStretch Zone\u201d\u8ba9\u9898\u76ee\u96be\u5ea6\u6301\u7eed\u8d34\u8fd1\u6a21\u578b\u80fd\u529b\u8fb9\u754c\u3002\u6a21\u578b\u5728\u540c\u4e00\u53c2\u6570\u7a7a\u95f4\u4e2d\u4ea4\u66ff\u626e\u6f14 Scaffolder \u751f\u6210\u6311\u6218\u4e0e Learner \u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u89e3\u9898\u8f68\u8ff9\uff0c\u5b9e\u73b0\u6e10\u8fdb\u5f0f\u80fd\u529b\u63d0\u5347\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18642", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u53d7\u8ba4\u77e5\u811a\u624b\u67b6\u7406\u8bba\u542f\u53d1\u7684\u52a8\u6001\u96be\u5ea6\u5bf9\u9f50\u673a\u5236\uff0c\u907f\u514d\u56fa\u5b9a\u96be\u5ea6\u5bfc\u81f4\u7684\u80fd\u529b\u505c\u6ede", "\u91c7\u7528 Scaffolder-Learner \u53cc\u5faa\u73af\u5171\u8fdb\u5316\uff1a\u4e00\u65b9\u751f\u6210\u8fb9\u754c\u6311\u6218\uff0c\u4e00\u65b9\u7528\u5f3a\u5316\u5b66\u4e60\u6539\u8fdb\u63a8\u7406\u8fc7\u7a0b", "\u5728\u8c08\u5224\u4e0e\u8fd0\u7b79\u4f18\u5316\u57fa\u51c6\u4e0a\u4f18\u4e8e\u5f3a\u63d0\u793a\u548c\u9886\u57df\u4e13\u7528\u57fa\u7ebf\uff0c\u5e76\u7f13\u89e3\u5956\u52b1\u9ed1\u5ba2\u4e0e\u8bad\u7ec3\u4e0d\u7a33\u5b9a"], "keywords": ["\u81ea\u6211\u63d0\u5347", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u80fd\u529b", "\u8bfe\u7a0b\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18642v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "STRETCH the Boundaries: A Unified Self-Taught Framework for Progressive LLM Evolution", "tldr": "\u52a8\u6001\u96be\u5ea6\u81ea\u8bad\u7ec3\u63a8\u52a8LLM\u6301\u7eed\u8fdb\u5316", "upvotes": 0, "what_it_is": "\u63d0\u51fa STRETCH\uff0c\u4e00\u4e2a\u7edf\u4e00\u7684\u81ea\u6559\u5b66\u63a8\u7406\u8fdb\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u52a8\u6001\u201cStretch Zone\u201d\u8ba9\u9898\u76ee\u96be\u5ea6\u6301\u7eed\u8d34\u8fd1\u6a21\u578b\u80fd\u529b\u8fb9\u754c\u3002\u6a21\u578b\u5728\u540c\u4e00\u53c2\u6570\u7a7a\u95f4\u4e2d\u4ea4\u66ff\u626e\u6f14 Scaffolder \u751f\u6210\u6311\u6218\u4e0e Learner \u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u89e3\u9898\u8f68\u8ff9\uff0c\u5b9e\u73b0\u6e10\u8fdb\u5f0f\u80fd\u529b\u63d0\u5347\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5173\u6ce8 LLM \u81ea\u6211\u63d0\u5347\u4e2d\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u8bad\u7ec3\u4efb\u52a1\u96be\u5ea6\u5982\u4f55\u968f\u80fd\u529b\u53d8\u5316\u800c\u81ea\u9002\u5e94\u3002\u5176\u7edf\u4e00\u6846\u67b6\u82e5\u53ef\u6269\u5c55\u5230\u66f4\u591a\u4efb\u52a1\uff0c\u53ef\u80fd\u4e3a\u6301\u7eed\u5b66\u4e60\u3001\u81ea\u52a8\u8bfe\u7a0b\u5b66\u4e60\u548c\u63a8\u7406\u80fd\u529b\u8fdb\u5316\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Multi-turn agent trajectories often contain redundant rounds (failed tool calls, parallel sub-queries, verification-only steps) that inflate both training and inference cost. We propose viewing each trajectory as a \\emph{round-level dependency DAG} that exposes which rounds are globally load-bearing for the final answer, and fine-tune agents on trajectories refined through this DAG. Given an LLM-annotated DAG, these edits are deterministic and interpretable, with optional rephrasing. Models trained on these refined trajectories consistently outperform those trained on the original trajectories at lower inference cost. Specifically, across four multi-modal QA benchmarks, our refinements improve downstream accuracy by up to $1.7$\\,pp over vanilla SFT (and $5.7$\\,pp over an LLM-deletion baseline) while reducing per-sample inference messages by up to approximately $40\\%$ and inference tokens by up to approximately $48\\%$, translating to substantial savings in compute and serving cost. Code is available.", "arxiv_id": "2609.18417", "arxiv_url": "https://arxiv.org/abs/2609.18417", "authors": ["Zhuo Chen", "Zhen Zhang", "Xinyu Wang", "Kewei Tu"], "brief": "\u8bba\u6587\u5c06\u591a\u8f6e\u667a\u80fd\u4f53\u4ea4\u4e92\u8f68\u8ff9\u5efa\u6a21\u4e3a\u201c\u8f6e\u6b21\u7ea7\u4f9d\u8d56DAG\u201d\uff0c\u8bc6\u522b\u5bf9\u6700\u7ec8\u7b54\u6848\u771f\u6b63\u5173\u952e\u7684\u6b65\u9aa4\uff0c\u5e76\u636e\u6b64\u786e\u5b9a\u6027\u5730\u5220\u6539\u5197\u4f59\u8f6e\u6b21\u3002\u7528\u7cbe\u70bc\u540e\u7684\u8f68\u8ff9\u8fdb\u884c\u5fae\u8c03\uff0c\u53ef\u8bad\u7ec3\u51fa\u66f4\u9ad8\u6548\u7684\u591a\u8f6e\u667a\u80fd\u4f53\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18417", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u9488\u5bf9\u5931\u8d25\u5de5\u5177\u8c03\u7528\u3001\u5e76\u884c\u5b50\u67e5\u8be2\u3001\u4ec5\u9a8c\u8bc1\u6b65\u9aa4\u7b49\u5197\u4f59\u8f6e\u6b21\uff0c\u6784\u5efaLLM\u6807\u6ce8\u7684\u8f6e\u6b21\u4f9d\u8d56DAG\u6765\u5224\u65ad\u5168\u5c40\u5173\u952e\u8def\u5f84\u3002", "\u8f68\u8ff9\u7f16\u8f91\u8fc7\u7a0b\u786e\u5b9a\u3001\u53ef\u89e3\u91ca\uff0c\u5e76\u652f\u6301\u53ef\u9009\u6539\u5199\uff0c\u907f\u514d\u7b80\u5355LLM\u5220\u9664\u5e26\u6765\u7684\u4e0d\u7a33\u5b9a\u6027\u3002", "\u5728\u56db\u4e2a\u591a\u6a21\u6001\u95ee\u7b54\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u666e\u901aSFT\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u53471.7\u4e2a\u767e\u5206\u70b9\uff0c\u76f8\u6bd4LLM\u5220\u9664\u57fa\u7ebf\u6700\u9ad8\u63d0\u53475.7\u4e2a\u767e\u5206\u70b9\uff1b\u63a8\u7406\u6d88\u606f\u6570\u6700\u591a\u51cf\u5c11\u7ea640%\uff0ctoken\u6700\u591a\u51cf\u5c11\u7ea648%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u8f68\u8ff9\u4f18\u5316", "\u5fae\u8c03", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18417v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Dependency-Aware Trajectory Refinement for Efficient Multi-Turn Agent Fine-Tuning", "tldr": "\u7528\u4f9d\u8d56DAG\u7cbe\u7b80\u591a\u8f6e\u667a\u80fd\u4f53\u8f68\u8ff9\uff0c\u964d\u672c\u5e76\u63d0\u6548\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u591a\u8f6e\u667a\u80fd\u4f53\u4ea4\u4e92\u8f68\u8ff9\u5efa\u6a21\u4e3a\u201c\u8f6e\u6b21\u7ea7\u4f9d\u8d56DAG\u201d\uff0c\u8bc6\u522b\u5bf9\u6700\u7ec8\u7b54\u6848\u771f\u6b63\u5173\u952e\u7684\u6b65\u9aa4\uff0c\u5e76\u636e\u6b64\u786e\u5b9a\u6027\u5730\u5220\u6539\u5197\u4f59\u8f6e\u6b21\u3002\u7528\u7cbe\u70bc\u540e\u7684\u8f68\u8ff9\u8fdb\u884c\u5fae\u8c03\uff0c\u53ef\u8bad\u7ec3\u51fa\u66f4\u9ad8\u6548\u7684\u591a\u8f6e\u667a\u80fd\u4f53\u3002", "why_notable": "\u5b83\u628a\u667a\u80fd\u4f53\u5fae\u8c03\u4e2d\u7684\u201c\u8f68\u8ff9\u8d28\u91cf\u201d\u95ee\u9898\u8f6c\u5316\u4e3a\u53ef\u89e3\u91ca\u7684\u4f9d\u8d56\u7ed3\u6784\u4f18\u5316\uff0c\u5728\u63d0\u5347\u6027\u80fd\u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u63a8\u7406\u6210\u672c\uff0c\u5bf9\u5de5\u5177\u4f7f\u7528\u578b\u3001\u591a\u8f6e\u63a8\u7406\u578b\u667a\u80fd\u4f53\u7684\u8bad\u7ec3\u4e0e\u90e8\u7f72\u90fd\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce Nemotron-SEA-LION-v4.8, a family of Southeast Asian Languages in One Network (SEA-LION) built upon NVIDIA Nemotron 3. The family includes 30B-A3B and 120B-A12B models, with both continued-pretrained base checkpoints and post-trained variants. We adapt the models using Southeast Asian, reasoning, code, and multilingual parallel datasets, followed by post-training with supervised fine-tuning and online on-policy distillation. On SEA-HELM, the 30B-A3B model improves the overall SEA score from 46.06 to 51.57, while the 120B-A12B model improves from 49.30 to 63.44. The strongest gains are observed in instruction following, natural language reasoning, and natural language understanding across seven Southeast Asian languages.", "arxiv_id": "2609.18310", "arxiv_url": "https://arxiv.org/abs/2609.18310", "authors": ["Ahmed Mohammad Dabeer", "Ahn Jeongmi", "Anocha Sutaveephamochanon", "Antonyrex Sajeban", "Aulia Adila", "Chan Hok Teng", "Adwin", "Cheng Zi Yi", "Nicholas Zhuang Ziyi", "Choa Hsueh Mei Esther", "David Ong Tat-Wee", "Evelyn Tan Chor Phin", "Heng Cheng Peng", "Jonathan", "Lee Chwan Ren", "Leong Wai Yi", "Leong Wei Qi", "Leslie Teo Eng Sipp", "Liew Rachel", "Limkonchotiwat Peerat", "Montalan Jann Railey Estrada", "Muhammad Ridzuan Bin Mokhtar", "Nagarajan Karthik", "Ng Boon Cheong", "Raymond", "Ngui Jian Gang", "Nguyen Thanh Ngan", "Tasawong Panuthep", "Pereira Mark Gregory", "Phang Shi Wei Benjamin", "Poon Yip Hung", "Joseph", "Rengarajan Hamsawardhini", "Siow Wei Kang Bryan", "Tai Ngee Chia", "Tan Choon Meng", "Tan Le Min", "Sheryl", "Tan Siao Wei", "Tan Yi Xian", "Tee Jun Yun", "Teng Kok Wai", "Tjhi William Chandra", "Tuchinda Pume", "Wu Donghang", "Yong Xianbin", "Yosephine", "Zhang Zhou"], "brief": "\u672c\u6587\u53d1\u5e03Nemotron-SEA-LION-v4.8\u7cfb\u5217\u6a21\u578b\uff0c\u57fa\u4e8eNVIDIA Nemotron 3\u6784\u5efa\uff0c\u5305\u542b30B-A3B\u4e0e120B-A12B\u7684\u57fa\u7840\u7eed\u8bad\u548c\u540e\u8bad\u7ec3\u7248\u672c\u3002\u6a21\u578b\u901a\u8fc7\u4e1c\u5357\u4e9a\u8bed\u8a00\u3001\u63a8\u7406\u3001\u4ee3\u7801\u4e0e\u591a\u8bed\u5e73\u884c\u6570\u636e\u9002\u914d\uff0c\u5e76\u7ed3\u5408\u76d1\u7763\u5fae\u8c03\u548c\u5728\u7ebfon-policy\u84b8\u998f\u63d0\u5347\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18310", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d67\u79cd\u4e1c\u5357\u4e9a\u8bed\u8a00\uff0c\u5728SEA-HELM\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u6574\u4f53SEA\u5206\u6570", "30B-A3B\u4ece46.06\u63d0\u5347\u81f351.57\uff0c120B-A12B\u4ece49.30\u63d0\u5347\u81f363.44", "\u4e3b\u8981\u589e\u76ca\u6765\u81ea\u6307\u4ee4\u9075\u5faa\u3001\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u548c\u81ea\u7136\u8bed\u8a00\u7406\u89e3\u80fd\u529b"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u8bed\u8a00", "\u4f4e\u8d44\u6e90\u8bed\u8a00", "\u6307\u4ee4\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18310v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SEA-LION-v4.8: A Technical Report", "tldr": "\u9762\u5411\u4e1c\u5357\u4e9a\u8bed\u8a00\u7684Nemotron\u5927\u6a21\u578b\u5347\u7ea7", "upvotes": 0, "what_it_is": "\u672c\u6587\u53d1\u5e03Nemotron-SEA-LION-v4.8\u7cfb\u5217\u6a21\u578b\uff0c\u57fa\u4e8eNVIDIA Nemotron 3\u6784\u5efa\uff0c\u5305\u542b30B-A3B\u4e0e120B-A12B\u7684\u57fa\u7840\u7eed\u8bad\u548c\u540e\u8bad\u7ec3\u7248\u672c\u3002\u6a21\u578b\u901a\u8fc7\u4e1c\u5357\u4e9a\u8bed\u8a00\u3001\u63a8\u7406\u3001\u4ee3\u7801\u4e0e\u591a\u8bed\u5e73\u884c\u6570\u636e\u9002\u914d\uff0c\u5e76\u7ed3\u5408\u76d1\u7763\u5fae\u8c03\u548c\u5728\u7ebfon-policy\u84b8\u998f\u63d0\u5347\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u63d0\u5347\u4e86\u5927\u6a21\u578b\u5bf9\u4f4e\u8d44\u6e90\u548c\u533a\u57df\u6027\u8bed\u8a00\u7684\u652f\u6301\u80fd\u529b\uff0c\u4e3a\u4e1c\u5357\u4e9a\u591a\u8bed\u573a\u666f\u4e2d\u7684\u672c\u5730\u5316AI\u5e94\u7528\u63d0\u4f9b\u4e86\u66f4\u5f3a\u57fa\u7840\u6a21\u578b\u3002"}, {"abstract": "Large language models are increasingly used to generate and evaluate online content, yet it remains unclear whether the qualities they associate with higher engagement match what real users respond to. We study this question using 1.17 million answers to 25,978 questions from Zhihu, Quora, and Reddit, comparing real platform answers and AI-generated answers across four within-question engagement levels. We introduce Ontological Preference Measurement, which represents answers along three dimensions: logic, affect, and expression. We find a systematic gap between AI preference and real user engagement: as target engagement increases, LLMs add more explicit logical structure, while real user engagement is more strongly associated with affective and expressive salience. We call this tendency logic overbinding. Based on this diagnosis, we propose Ontology-Masked Reasoning Autoencoding (OMRA), a controlled intervention that masks and reconstructs over-explained spans while preserving stance, factual content, and coherence. Across four LLM families, OMRA reduces the measured gap by an average of 54.4%. In human evaluation, OMRA wins 62.4% of pairwise preference judgments against matched real platform answers, even though the real answers are more often judged to be human-written.", "arxiv_id": "2609.18282", "arxiv_url": "https://arxiv.org/abs/2609.18282", "authors": ["Xinglang Zhang", "Yuanmeng Xiang", "Yunyao Zhang", "Zeliang Chen", "Junqing Yu", "Zikai Song"], "brief": "\u8bba\u6587\u57fa\u4e8e\u77e5\u4e4e\u3001Quora\u3001Reddit \u7684117\u4e07\u6761\u56de\u7b54\uff0c\u6bd4\u8f83\u771f\u5b9e\u7528\u6237\u9ad8\u4e92\u52a8\u56de\u7b54\u4e0eAI\u751f\u6210/\u8bc4\u4ef7\u504f\u597d\u7684\u5dee\u5f02\u3002\u4f5c\u8005\u63d0\u51fa\u672c\u4f53\u504f\u597d\u6d4b\u91cf\u6846\u67b6\uff0c\u5e76\u7528 OMRA \u65b9\u6cd5\u51cf\u5c11\u5927\u6a21\u578b\u8fc7\u5ea6\u504f\u597d\u663e\u5f0f\u903b\u8f91\u7ed3\u6784\u7684\u95ee\u9898\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18282", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Ontological Preference Measurement\uff0c\u5c06\u56de\u7b54\u8868\u5f81\u4e3a\u903b\u8f91\u3001\u60c5\u611f\u3001\u8868\u8fbe\u4e09\u7c7b\u7ef4\u5ea6\uff0c\u7528\u4e8e\u8bca\u65ad\u4e92\u52a8\u504f\u597d\u5dee\u5f02", "\u53d1\u73b0\u201clogic overbinding\u201d\u73b0\u8c61\uff1aLLM\u503e\u5411\u8ba4\u4e3a\u66f4\u5f3a\u903b\u8f91\u7ed3\u6784\u5e26\u6765\u9ad8\u4e92\u52a8\uff0c\u800c\u771f\u5b9e\u7528\u6237\u66f4\u53d7\u60c5\u611f\u4e0e\u8868\u8fbe\u663e\u8457\u6027\u5f71\u54cd", "\u63d0\u51fa OMRA\uff0c\u901a\u8fc7\u906e\u853d\u5e76\u91cd\u6784\u8fc7\u5ea6\u89e3\u91ca\u7247\u6bb5\uff0c\u5728\u4fdd\u6301\u7acb\u573a\u3001\u4e8b\u5b9e\u548c\u8fde\u8d2f\u6027\u7684\u540c\u65f6\uff0c\u5c06\u504f\u597d\u5dee\u8ddd\u5e73\u5747\u964d\u4f4e54.4%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u504f\u597d\u5bf9\u9f50", "\u5185\u5bb9\u751f\u6210", "\u4eba\u673a\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18282v1", "published_at": "2026-09-16", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Too Good to Be Real? Diagnosing and Reducing the Gap Between AI Preference and Real User Engagement", "tldr": "\u63ed\u793a\u5e76\u7f13\u89e3AI\u504f\u597d\u4e0e\u771f\u5b9e\u4e92\u52a8\u7684\u9519\u4f4d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u57fa\u4e8e\u77e5\u4e4e\u3001Quora\u3001Reddit \u7684117\u4e07\u6761\u56de\u7b54\uff0c\u6bd4\u8f83\u771f\u5b9e\u7528\u6237\u9ad8\u4e92\u52a8\u56de\u7b54\u4e0eAI\u751f\u6210/\u8bc4\u4ef7\u504f\u597d\u7684\u5dee\u5f02\u3002\u4f5c\u8005\u63d0\u51fa\u672c\u4f53\u504f\u597d\u6d4b\u91cf\u6846\u67b6\uff0c\u5e76\u7528 OMRA \u65b9\u6cd5\u51cf\u5c11\u5927\u6a21\u578b\u8fc7\u5ea6\u504f\u597d\u663e\u5f0f\u903b\u8f91\u7ed3\u6784\u7684\u95ee\u9898\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\u4e86\u7528LLM\u751f\u6210\u6216\u8bc4\u4f30\u5728\u7ebf\u5185\u5bb9\u65f6\u7684\u5173\u952e\u504f\u5dee\uff1a\u6a21\u578b\u504f\u597d\u7684\u201c\u597d\u7b54\u6848\u201d\u672a\u5fc5\u5339\u914d\u771f\u5b9e\u7528\u6237\u4e92\u52a8\u3002\u5176\u8bca\u65ad\u6846\u67b6\u548c\u5e72\u9884\u65b9\u6cd5\u5bf9\u5185\u5bb9\u751f\u6210\u3001\u63a8\u8350\u8bc4\u4f30\u548c\u4eba\u7c7b\u504f\u597d\u5bf9\u9f50\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We describe our system for LitTraceQA (GroundLM @ EMNLP 2026): given a research question, retrieve the relevant papers from a pool of 27,487, cite the page and the table or figure where the answer lives, and answer in a requested format. Our main finding is that evidence grounding is limited by retrieval, not by reading. The page selector put the annotator\u0027s page, which we call the gold page, in front of the model that locates evidence only about half the time (52.6% gold-page recall), while that model, given the page, cited the right one in 45 of the 48 locators it emitted (94%). When the page was missing it rarely said so: of 45 such cases it returned nothing 14 times, a wrong page 24 times, and a correct page 7 times, so the pipeline failed quietly almost twice as often as it failed visibly. Since the failure was that the right page was never shown, the fix is to stop choosing: each retrieved paper fits in the model\u0027s context, so we show it whole. Page ranking survives only as a fallback inside papers too long to fit, which no test-split paper was, and gold-page recall reaches 100% on the papers we can parse. Separately, questions that identify their target by position rather than content, such as \"the first author of the 24th reference\", are served by parsing rather than retrieval: we resolve the bibliography into an addressable list, which also supplies identifiers the evidence metric scores. The final system scores 0.762 paper $F_1$, 0.441 evidence $F_1$ and 0.920 multiple-choice accuracy on the held-out test split. Because the pipeline depends on a closed model without seed control, we release a harness that verifies the paper\u0027s central claims against committed artifacts.", "arxiv_id": "2609.18154", "arxiv_url": "https://arxiv.org/abs/2609.18154", "authors": ["Aaditya Chauhan"], "brief": "\u8bba\u6587\u4ecb\u7ecd\u4e86\u7528\u4e8e LitTraceQA \u7684\u6587\u732e\u6eaf\u6e90\u95ee\u7b54\u7cfb\u7edf\uff1a\u4ece\u7ea62.75\u4e07\u7bc7\u8bba\u6587\u4e2d\u68c0\u7d22\u76f8\u5173\u8bba\u6587\uff0c\u5b9a\u4f4d\u7b54\u6848\u6240\u5728\u9875\u9762\u53ca\u56fe\u8868\uff0c\u5e76\u6309\u6307\u5b9a\u683c\u5f0f\u4f5c\u7b54\u3002\u6838\u5fc3\u53d1\u73b0\u662f\u8bc1\u636e grounding \u7684\u4e3b\u8981\u5931\u8d25\u6765\u81ea\u9875\u9762\u9009\u62e9\u6f0f\u6389\u6b63\u786e\u9875\uff0c\u800c\u4e0d\u662f\u6a21\u578b\u8bfb\u4e0d\u61c2\u7ed9\u5b9a\u9875\u9762\u3002", "categories": ["cs.IR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18154", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u9875\u9762\u9009\u62e9\u5668\u7684\u91d1\u9875\u53ec\u56de\u7387\u4ec5\u4e3a52.6%\uff0c\u4f46\u5728\u7ed9\u5230\u6b63\u786e\u9875\u9762\u65f6\uff0c\u8bc1\u636e\u5b9a\u4f4d\u6a21\u578b48\u6b21\u8f93\u51fa\u4e2d\u670945\u6b21\u5f15\u7528\u6b63\u786e\uff0c\u51c6\u786e\u7387\u8fbe94%\u3002", "\u5f53\u6b63\u786e\u9875\u9762\u7f3a\u5931\u65f6\uff0c\u7cfb\u7edf\u5e38\u9759\u9ed8\u5931\u8d25\uff1a45\u4f8b\u4e2d24\u6b21\u8fd4\u56de\u9519\u8bef\u9875\u300114\u6b21\u65e0\u8fd4\u56de\uff0c\u4ec57\u6b21\u4ecd\u627e\u5230\u6b63\u786e\u9875\u3002", "\u6539\u8fdb\u7b56\u7565\u662f\u5c3d\u91cf\u4e0d\u505a\u9875\u9762\u9009\u62e9\uff0c\u800c\u5c06\u6bcf\u7bc7\u68c0\u7d22\u5230\u7684\u8bba\u6587\u5168\u6587\u653e\u5165\u4e0a\u4e0b\u6587\uff1b\u5bf9\u53ef\u89e3\u6790\u8bba\u6587\u91d1\u9875\u53ec\u56de\u7387\u8fbe\u5230100%\uff0c\u5e76\u7528\u7ed3\u6784\u5316\u89e3\u6790\u5904\u7406\u6309\u53c2\u8003\u6587\u732e\u4f4d\u7f6e\u63d0\u95ee\u7684\u95ee\u9898\u3002"], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u95ee\u7b54\u7cfb\u7edf", "\u8bc1\u636e\u6eaf\u6e90", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18154v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "PageRecall: Measuring Page Selection in Literature-Grounded Question Answering", "tldr": "\u6587\u732e\u95ee\u7b54\u74f6\u9888\u5728\u9875\u9762\u68c0\u7d22\u800c\u975e\u9605\u8bfb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ecb\u7ecd\u4e86\u7528\u4e8e LitTraceQA \u7684\u6587\u732e\u6eaf\u6e90\u95ee\u7b54\u7cfb\u7edf\uff1a\u4ece\u7ea62.75\u4e07\u7bc7\u8bba\u6587\u4e2d\u68c0\u7d22\u76f8\u5173\u8bba\u6587\uff0c\u5b9a\u4f4d\u7b54\u6848\u6240\u5728\u9875\u9762\u53ca\u56fe\u8868\uff0c\u5e76\u6309\u6307\u5b9a\u683c\u5f0f\u4f5c\u7b54\u3002\u6838\u5fc3\u53d1\u73b0\u662f\u8bc1\u636e grounding \u7684\u4e3b\u8981\u5931\u8d25\u6765\u81ea\u9875\u9762\u9009\u62e9\u6f0f\u6389\u6b63\u786e\u9875\uff0c\u800c\u4e0d\u662f\u6a21\u578b\u8bfb\u4e0d\u61c2\u7ed9\u5b9a\u9875\u9762\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6e05\u6670\u91cf\u5316\u4e86\u6587\u732e\u6eaf\u6e90\u95ee\u7b54\u4e2d\u201c\u68c0\u7d22\u5230\u6b63\u786e\u9875\u9762\u201d\u8fd9\u4e00\u88ab\u4f4e\u4f30\u7684\u74f6\u9888\uff0c\u63d0\u793a\u5728\u957f\u4e0a\u4e0b\u6587\u6a21\u578b\u53ef\u5bb9\u7eb3\u6574\u7bc7\u8bba\u6587\u65f6\uff0c\u51cf\u5c11\u4e2d\u95f4\u7b5b\u9009\u53cd\u800c\u66f4\u53ef\u9760\uff0c\u5bf9\u79d1\u7814\u95ee\u7b54\u3001\u8bc1\u636e\u5f15\u7528\u548c\u53ef\u9a8c\u8bc1 RAG \u7cfb\u7edf\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Mixture-of-Experts (MoE) language models suffer from large parameter counts, which create a significant memory bottleneck. Expert pruning is the most direct approach for reducing this parameter count, yet existing methods make pruning decisions for each expert independently, and assume experts\u0027 contributions are purely additive. In reality, expert usage in MoEs is inherently cooperative. We derive HOPE (Higher-Order Pruning of Experts), a second-order pruning objective which provably minimizes an upper bound on the error resulting from pruning. We show that REAP (a state-of-the-art first-order pruning method) is a special case of HOPE where interaction terms are ignored. Across three frontier MoE models (up to 122B parameters), two distinct calibration sets, and multiple benchmarks (including math, instruction following, coding, and an agentic suite), we demonstrate that HOPE produces better pruning decisions than existing methods, and its advantage is most pronounced at high pruning rates and on challenging agentic workloads. At 50% pruning, HOPE outperforms all baselines and achieves an average rank of 1.58 out of 5 methods (versus 2.42 for the next-best method, REAP), with gains of up to +6.1% on agentic coding. Over all conditions, HOPE again achieves the best average rank and surpasses every other method in the majority of head-to-head comparisons. By preserving cooperative expert structure that first-order methods ignore, HOPE enables aggressive compression with minimal degradation, particularly on complex tasks where diverse expert combinations are invoked over long sequences.", "arxiv_id": "2609.18916", "arxiv_url": "https://arxiv.org/abs/2609.18916", "authors": ["Alex M. Tseng", "Prannay Kaul", "Luca Zancato", "Wei Xia", "Stefano Soatto"], "brief": "\u8bba\u6587\u63d0\u51fa HOPE\uff0c\u4e00\u79cd\u9762\u5411 MoE \u8bed\u8a00\u6a21\u578b\u7684\u4e8c\u9636\u4e13\u5bb6\u526a\u679d\u65b9\u6cd5\uff0c\u663e\u5f0f\u5efa\u6a21\u4e13\u5bb6\u4e4b\u95f4\u7684\u534f\u4f5c/\u4ea4\u4e92\u5173\u7cfb\uff0c\u800c\u975e\u50cf\u4ee5\u5f80\u65b9\u6cd5\u72ec\u7acb\u8bc4\u4f30\u6bcf\u4e2a\u4e13\u5bb6\u3002\u5b9e\u9a8c\u8986\u76d6\u6700\u9ad8 122B \u53c2\u6570\u7684\u524d\u6cbf MoE \u6a21\u578b\u548c\u591a\u7c7b\u57fa\u51c6\uff0cHOPE \u5728\u9ad8\u526a\u679d\u7387\u4e0b\u66f4\u7a33\u5065\uff0c\u5c24\u5176\u5728\u590d\u6742\u667a\u80fd\u4f53\u5f0f\u7f16\u7801\u4efb\u52a1\u4e0a\u6700\u9ad8\u5e26\u6765 +6.1% \u63d0\u5347\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18916", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u526a\u679d", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18916v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Higher-order pruning of experts in mixture-of-experts language models", "tldr": "\u8bba\u6587\u63d0\u51fa HOPE\uff0c\u4e00\u79cd\u9762\u5411 MoE \u8bed\u8a00\u6a21\u578b\u7684\u4e8c\u9636\u4e13\u5bb6\u526a\u679d\u65b9\u6cd5\uff0c\u663e\u5f0f\u5efa\u6a21\u4e13\u5bb6\u4e4b\u95f4\u7684\u534f\u4f5c/\u4ea4\u4e92\u5173\u7cfb\uff0c\u800c\u975e\u50cf\u4ee5\u5f80\u65b9\u6cd5\u72ec\u7acb\u8bc4\u4f30\u6bcf\u4e2a\u4e13\u5bb6\u3002\u5b9e\u9a8c\u8986\u76d6\u6700\u9ad8 122B \u53c2\u6570\u7684\u524d\u6cbf MoE \u6a21\u578b\u548c\u591a\u7c7b\u57fa\u51c6\uff0cHOPE \u5728\u9ad8\u526a\u679d\u7387\u4e0b\u66f4\u7a33\u5065\uff0c\u5c24\u5176\u5728\u590d\u6742\u667a\u80fd\u4f53\u5f0f\u7f16\u7801\u4efb\u52a1\u4e0a\u6700\u9ad8\u5e26\u6765 +6.1% \u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent benchmarks are substantially more costly to evaluate than conventional LLM benchmarks. Benchmark compression is therefore a natural solution, yet existing methods primarily model redundancy in task--model final-score distributions, which is important in agentic evaluation. To address this limitation, we analyze large-scale trajectories and identify six complementary process signals that are systematically associated with final agent performance. To disentangle agent performance redundancy from a complete perspective, we propose DualViewEval, an agent benchmark compression method that jointly exploits outcome and process relations to learn an exact-size miniset and predict the full-benchmark scores. Across five agent benchmarks and five representative baselines, DualViewEval achieves the best results in all datasets. With only 20 tasks, it achieves $24\\times$--$40\\times$ compression on APEX-Agents and BFCL, reducing mean absolute error (MAE) by $14.5\\%$--$28.2\\%$ over the strongest competitors while improving Kendall\u0027s $\u03c4$ by up to $7.2\\%$ relative to EssenceBench on SWE-bench Verified. The selected minisets further reveal capability differences among different agents, providing compact and diagnostic feedback for efficient agentic model development.", "arxiv_id": "2609.18909", "arxiv_url": "https://arxiv.org/abs/2609.18909", "authors": ["Xinshuai Guo", "Junjie Wu", "Dolly Deng", "Yinghui Li", "Hai-Tao Zheng", "Suncong Zheng", "Maxm Pan"], "brief": "\u672c\u6587\u63d0\u51fa DualViewEval\uff0c\u7528\u4e8e\u538b\u7f29\u9ad8\u6210\u672c\u7684\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\uff0c\u540c\u65f6\u5229\u7528\u6700\u7ec8\u5f97\u5206\u5173\u7cfb\u548c\u8f68\u8ff9\u8fc7\u7a0b\u4fe1\u53f7\u6765\u9009\u62e9\u56fa\u5b9a\u5927\u5c0f\u7684\u5c0f\u4efb\u52a1\u96c6\u5e76\u9884\u6d4b\u5b8c\u6574\u57fa\u51c6\u8868\u73b0\u3002\u5728\u4e94\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\uff0c\u8be5\u65b9\u6cd5\u4ee5\u4ec5 20 \u4e2a\u4efb\u52a1\u5b9e\u73b0 24\u00d7\u201340\u00d7 \u538b\u7f29\uff0c\u5e76\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u663e\u8457\u964d\u4f4e MAE\u3001\u63d0\u5347\u6392\u5e8f\u76f8\u5173\u6027\uff0c\u8fd8\u80fd\u63d0\u4f9b\u66f4\u5177\u8bca\u65ad\u6027\u7684\u80fd\u529b\u53cd\u9988\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18909", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u6a21\u578b\u538b\u7f29", "\u8f68\u8ff9\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18909v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Outcomes: Dual-View Relational Learning for Efficient Agent Benchmarking", "tldr": "\u672c\u6587\u63d0\u51fa DualViewEval\uff0c\u7528\u4e8e\u538b\u7f29\u9ad8\u6210\u672c\u7684\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6\uff0c\u540c\u65f6\u5229\u7528\u6700\u7ec8\u5f97\u5206\u5173\u7cfb\u548c\u8f68\u8ff9\u8fc7\u7a0b\u4fe1\u53f7\u6765\u9009\u62e9\u56fa\u5b9a\u5927\u5c0f\u7684\u5c0f\u4efb\u52a1\u96c6\u5e76\u9884\u6d4b\u5b8c\u6574\u57fa\u51c6\u8868\u73b0\u3002\u5728\u4e94\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\uff0c\u8be5\u65b9\u6cd5\u4ee5\u4ec5 20 \u4e2a\u4efb\u52a1\u5b9e\u73b0 24\u00d7\u201340\u00d7 \u538b\u7f29\uff0c\u5e76\u76f8\u6bd4\u5f3a\u57fa\u7ebf\u663e\u8457\u964d\u4f4e MAE\u3001\u63d0\u5347\u6392\u5e8f\u76f8\u5173\u6027\uff0c\u8fd8\u80fd\u63d0\u4f9b\u66f4\u5177\u8bca\u65ad\u6027\u7684\u80fd\u529b\u53cd\u9988\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Privacy evaluations of tool-using LLM agents often inspect a designated action, final response, or attacker report. These local proxies can miss unauthorized exposure elsewhere in a multi-step session and lack common ground truth across outlets, reports, and tool paths. We introduce privacy exposure displacement, the mismatch between a local evaluation proxy and target-grounded session exposure, and ASLEval, an authorization-aware framework that pre-registers a hidden target set, measures all declared visible exits, and reserves internal traces for diagnosis. Across multiple enterprise-style environments and independently implemented runtimes, we observe three recurring patterns. An expected-outlet-only view misses 46.9% of exposure recovered by the visible-exit union; attacker self-reports combine omissions with high false discovery; and schema-aligned internal evidence usually precedes visible exposure at the request/probe level. Reducing model-visible returns changes this path but can eliminate normal-task success. Independent human review supports the adjudication pipeline while identifying harder console and candidate cases. These findings motivate benchmarks that declare the complete visible boundary, ground claims in pre-specified targets and authorization, and report privacy together with task utility.", "arxiv_id": "2609.18864", "arxiv_url": "https://arxiv.org/abs/2609.18864", "authors": ["Guosen Wu", "Huizhen Huang", "Guoxiong Long", "Tao Huang", "Chen Hou"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u9690\u79c1\u66b4\u9732\u4f4d\u79fb\u201d\u6982\u5ff5\uff0c\u6307\u51fa\u53ea\u68c0\u67e5\u667a\u80fd\u4f53\u7684\u67d0\u4e2a\u52a8\u4f5c\u3001\u6700\u7ec8\u56de\u590d\u6216\u653b\u51fb\u8005\u62a5\u544a\u4f1a\u6f0f\u6389\u591a\u6b65\u4f1a\u8bdd\u4e2d\u5176\u4ed6\u51fa\u53e3\u7684\u672a\u6388\u6743\u6cc4\u9732\u3002ASLEval \u901a\u8fc7\u9884\u6ce8\u518c\u9690\u85cf\u76ee\u6807\u96c6\u3001\u8986\u76d6\u6240\u6709\u53ef\u89c1\u51fa\u53e3\u5e76\u7ed3\u5408\u6388\u6743\u5224\u5b9a\u8fdb\u884c\u8bc4\u6d4b\uff0c\u5728\u4f01\u4e1a\u5f0f\u73af\u5883\u4e2d\u53d1\u73b0\u4ec5\u770b\u9884\u671f\u51fa\u53e3\u4f1a\u6f0f\u6389\u7ea646.9%\u7684\u66b4\u9732\uff0c\u653b\u51fb\u8005\u81ea\u62a5\u4e5f\u5b58\u5728\u6f0f\u62a5\u548c\u9ad8\u8bef\u62a5\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18864", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u9690\u79c1\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18864v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ASLEval: Measuring Privacy Exposure Displacement in LLM Agent Sessions", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u9690\u79c1\u66b4\u9732\u4f4d\u79fb\u201d\u6982\u5ff5\uff0c\u6307\u51fa\u53ea\u68c0\u67e5\u667a\u80fd\u4f53\u7684\u67d0\u4e2a\u52a8\u4f5c\u3001\u6700\u7ec8\u56de\u590d\u6216\u653b\u51fb\u8005\u62a5\u544a\u4f1a\u6f0f\u6389\u591a\u6b65\u4f1a\u8bdd\u4e2d\u5176\u4ed6\u51fa\u53e3\u7684\u672a\u6388\u6743\u6cc4\u9732\u3002ASLEval \u901a\u8fc7\u9884\u6ce8\u518c\u9690\u85cf\u76ee\u6807\u96c6\u3001\u8986\u76d6\u6240\u6709\u53ef\u89c1\u51fa\u53e3\u5e76\u7ed3\u5408\u6388\u6743\u5224\u5b9a\u8fdb\u884c\u8bc4\u6d4b\uff0c\u5728\u4f01\u4e1a\u5f0f\u73af\u5883\u4e2d\u53d1\u73b0\u4ec5\u770b\u9884\u671f\u51fa\u53e3\u4f1a\u6f0f\u6389\u7ea646.9%\u7684\u66b4\u9732\uff0c\u653b\u51fb\u8005\u81ea\u62a5\u4e5f\u5b58\u5728\u6f0f\u62a5\u548c\u9ad8\u8bef\u62a5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The O-RAN control plane is becoming agentic: autonomous AI agents, deployed as rApps by different vendors, independently close control loops over shared radio resources. We demonstrate on a live O-RAN system that this independence is unsafe. Two agents with individually correct objectives, one protecting a latency SLA and one maximizing utilization for energy efficiency, jointly drive recurring opposing excursions of the shared resource partition that neither produces alone. Existing conflict-mitigation mechanisms presume a statically known application population and cannot govern agents whose behavior emerges at run time. We present AURA, a lightweight arbitration layer that admits agent actions only when they satisfy feasibility invariants, per-variable dwell times, and a deadband, and we prove the arbitrated system converges to a feasible operating point. Implemented on an OpenAirInterface (OAI) testbed with measured one-way latency and throughput, AURA reduces recurring shared-state excursions by more than an order of magnitude (from 8.4 to 0.4 PRB amplitude) and virtually eliminates cross-slice throughput starvation (from 40-55% to 0.3%), while leaving the protected slice\u0027s own latency compliance unchanged, a trade-off the convergence guarantee makes explicit.", "arxiv_id": "2609.18857", "arxiv_url": "https://arxiv.org/abs/2609.18857", "authors": ["Seyed Bagher Hashemi Natanzi", "Bo Tang"], "brief": "\u8bba\u6587\u6307\u51fa O-RAN \u4e2d\u591a\u4e2a\u81ea\u4e3b AI rApp \u72ec\u7acb\u63a7\u5236\u5171\u4eab\u65e0\u7ebf\u8d44\u6e90\u4f1a\u4ea7\u751f\u4e0d\u7a33\u5b9a\u51b2\u7a81\uff0c\u5373\u4f7f\u5404\u81ea\u76ee\u6807\u672c\u8eab\u5408\u7406\u4e5f\u53ef\u80fd\u5bfc\u81f4\u8d44\u6e90\u5206\u914d\u53cd\u590d\u632f\u8361\u3002\u4f5c\u8005\u63d0\u51fa\u8f7b\u91cf\u4ef2\u88c1\u5c42 AURA\uff0c\u901a\u8fc7\u53ef\u884c\u6027\u7ea6\u675f\u3001\u9a7b\u7559\u65f6\u95f4\u548c\u6b7b\u533a\u89c4\u5219\u7b5b\u9009\u52a8\u4f5c\uff0c\u5e76\u8bc1\u660e\u7cfb\u7edf\u6536\u655b\uff1b\u5728 OAI \u6d4b\u8bd5\u5e8a\u4e0a\u663e\u8457\u964d\u4f4e\u8d44\u6e90\u632f\u8361\u4e0e\u8de8\u5207\u7247\u541e\u5410\u9965\u997f\uff0c\u540c\u65f6\u4fdd\u6301\u53d7\u4fdd\u62a4\u5207\u7247\u7684\u65f6\u5ef6\u5408\u89c4\u3002", "categories": ["cs.NI", "cs.AI", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18857", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u65e0\u7ebf\u7f51\u7edc", "O-RAN", "\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18857v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Taming the Agentic RAN: Stability-Guaranteed Arbitration of Autonomous AI Agents in O-RAN", "tldr": "\u8bba\u6587\u6307\u51fa O-RAN \u4e2d\u591a\u4e2a\u81ea\u4e3b AI rApp \u72ec\u7acb\u63a7\u5236\u5171\u4eab\u65e0\u7ebf\u8d44\u6e90\u4f1a\u4ea7\u751f\u4e0d\u7a33\u5b9a\u51b2\u7a81\uff0c\u5373\u4f7f\u5404\u81ea\u76ee\u6807\u672c\u8eab\u5408\u7406\u4e5f\u53ef\u80fd\u5bfc\u81f4\u8d44\u6e90\u5206\u914d\u53cd\u590d\u632f\u8361\u3002\u4f5c\u8005\u63d0\u51fa\u8f7b\u91cf\u4ef2\u88c1\u5c42 AURA\uff0c\u901a\u8fc7\u53ef\u884c\u6027\u7ea6\u675f\u3001\u9a7b\u7559\u65f6\u95f4\u548c\u6b7b\u533a\u89c4\u5219\u7b5b\u9009\u52a8\u4f5c\uff0c\u5e76\u8bc1\u660e\u7cfb\u7edf\u6536\u655b\uff1b\u5728 OAI \u6d4b\u8bd5\u5e8a\u4e0a\u663e\u8457\u964d\u4f4e\u8d44\u6e90\u632f\u8361\u4e0e\u8de8\u5207\u7247\u541e\u5410\u9965\u997f\uff0c\u540c\u65f6\u4fdd\u6301\u53d7\u4fdd\u62a4\u5207\u7247\u7684\u65f6\u5ef6\u5408\u89c4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An agentic request spends substantial wall-clock time waiting for tools, and its KV cache holds GPU memory the whole time. Serving systems decide whether that cache stays, leaves, or comes back by guessing how long the tool will run, from the tool\u0027s name, its history, a duration declared before the call, or the engine\u0027s own occupancy. We show that no estimate fixed before a call starts can know its duration, and such estimates may not even rank the calls. Meanwhile, the running tool already holds the answer, but the agent stack together with the tool silences it. We propose that tool calls report their progress explicitly while they run, and we measure what that takes. A census of four public agent corpora finds a readable signal in most tool time once it is revealed, in two strengths: a fraction of the work remaining, or an accurate signal that the end is near. A harness recovers it without changing what the agent sees, at no measurable cost to the agent\u0027s benchmark score. At the points where a KV cache decision is made, the reported progress is between several times and an order of magnitude more accurate than the best published predictors, and it stays accurate when the environment changes. Plugged into a production engine through a few small hints, it cuts the p90 time to first token (TTFT) after a tool call by 20.7% (HBM only) and 20.8% (HBM + DRAM) against LRU, close to an oracle. A serving system should not guess what its tools can tell it.", "arxiv_id": "2609.18849", "arxiv_url": "https://arxiv.org/abs/2609.18849", "authors": ["Yipeng Liu", "Yingqiang Zhang", "Feifei Li", "Huanchen Zhang"], "brief": "\u8bba\u6587\u6307\u51fa\u667a\u80fd\u4f53\u5728\u7b49\u5f85\u5de5\u5177\u8c03\u7528\u65f6\u4f1a\u957f\u671f\u5360\u7528 KV cache\uff0c\u800c\u73b0\u6709\u670d\u52a1\u7cfb\u7edf\u53ea\u80fd\u9884\u4f30\u5de5\u5177\u8017\u65f6\u6765\u51b3\u5b9a\u7f13\u5b58\u8c03\u5ea6\uff0c\u51c6\u786e\u6027\u4e0d\u8db3\u3002\u4f5c\u8005\u63d0\u51fa\u8ba9\u5de5\u5177\u5728\u8fd0\u884c\u4e2d\u663e\u5f0f\u6c47\u62a5\u8fdb\u5ea6\uff0c\u5728\u4e0d\u5f71\u54cd\u667a\u80fd\u4f53\u8bc4\u6d4b\u8868\u73b0\u7684\u524d\u63d0\u4e0b\u663e\u8457\u63d0\u5347\u8017\u65f6\u9884\u6d4b\u51c6\u786e\u6027\uff0c\u5e76\u5728\u751f\u4ea7\u63a8\u7406\u5f15\u64ce\u4e2d\u5c06\u5de5\u5177\u8c03\u7528\u540e\u7684 p90 TTFT \u964d\u4f4e\u7ea6 20.7%\u201320.8%\uff0c\u63a5\u8fd1 oracle\u3002", "categories": ["cs.DC", "cs.AI", "cs.OS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18849", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u63a8\u7406\u670d\u52a1", "KV\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18849v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Ask the Tool, Don\u0027t Guess: Agent Tool Calls Hold Their Progress, and the Serving System Should Read It", "tldr": "\u8bba\u6587\u6307\u51fa\u667a\u80fd\u4f53\u5728\u7b49\u5f85\u5de5\u5177\u8c03\u7528\u65f6\u4f1a\u957f\u671f\u5360\u7528 KV cache\uff0c\u800c\u73b0\u6709\u670d\u52a1\u7cfb\u7edf\u53ea\u80fd\u9884\u4f30\u5de5\u5177\u8017\u65f6\u6765\u51b3\u5b9a\u7f13\u5b58\u8c03\u5ea6\uff0c\u51c6\u786e\u6027\u4e0d\u8db3\u3002\u4f5c\u8005\u63d0\u51fa\u8ba9\u5de5\u5177\u5728\u8fd0\u884c\u4e2d\u663e\u5f0f\u6c47\u62a5\u8fdb\u5ea6\uff0c\u5728\u4e0d\u5f71\u54cd\u667a\u80fd\u4f53\u8bc4\u6d4b\u8868\u73b0\u7684\u524d\u63d0\u4e0b\u663e\u8457\u63d0\u5347\u8017\u65f6\u9884\u6d4b\u51c6\u786e\u6027\uff0c\u5e76\u5728\u751f\u4ea7\u63a8\u7406\u5f15\u64ce\u4e2d\u5c06\u5de5\u5177\u8c03\u7528\u540e\u7684 p90 TTFT \u964d\u4f4e\u7ea6 20.7%\u201320.8%\uff0c\u63a5\u8fd1 oracle\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic workflows now make consequential decisions in regulated settings, and the governance placed around them is almost entirely step-scoped: input-output classifiers, per turn rails, and span-level evaluators. The policies organizations actually hold, such as referral thresholds, authority limits, and review requirements, are properties of the whole execution rather than of any one step. This mismatch admits a failure mode we call a Compositional Policy Violation (CPV): every individual step passes its own check while the composed execution violates the governing policy. A predicate over a single step cannot evaluate a property that step does not determine, so no improvement in the accuracy of the step-scoped monitors detects this class. We define CPVs as the failure of step-level compliance to compose, and present a taxonomy of four types: Authority Creep, Threshold Laundering, Cumulative Sum Violation, and Context Collapse. We show that the correct repair for each class is dictated by where the guarded quantity mutates. We then introduce a provenance-aware runtime architecture that evaluates policies over complete execution traces, recomputing guarded quantities from raw provenance rather than the pipeline\u0027s derived representation.", "arxiv_id": "2609.18820", "arxiv_url": "https://arxiv.org/abs/2609.18820", "authors": ["Ashwini Kurady", "Sri Sai Charith Grandhi", "Rajesh Gupta", "Sumit Mamoria"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u5f53\u524d\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u7684\u6cbb\u7406\u591a\u4f9d\u8d56\u5355\u6b65\u68c0\u67e5\uff0c\u4f46\u8bb8\u591a\u771f\u5b9e\u653f\u7b56\u7ea6\u675f\u662f\u8de8\u6b65\u9aa4\u3001\u5168\u6d41\u7a0b\u6027\u8d28\uff0c\u5bfc\u81f4\u6bcf\u4e00\u6b65\u90fd\u5408\u89c4\u800c\u6574\u4f53\u8fdd\u89c4\u7684\u201c\u7ec4\u5408\u5f0f\u653f\u7b56\u8fdd\u89c4\u201d\u95ee\u9898\u3002\u4f5c\u8005\u5b9a\u4e49\u5e76\u5206\u7c7b\u4e86\u56db\u7c7b CPV\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u6eaf\u6e90\u7684\u8fd0\u884c\u65f6\u67b6\u6784\uff0c\u901a\u8fc7\u5b8c\u6574\u6267\u884c\u8f68\u8ff9\u800c\u975e\u5355\u6b65\u8f93\u51fa\u6765\u8bc4\u4f30\u653f\u7b56\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18820", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "AI\u6cbb\u7406", "\u5b89\u5168\u5408\u89c4", "\u8fd0\u884c\u65f6\u76d1\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18820v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Compositional Policy Violations: When Step-Level Compliance Fails In Agentic AI Workflows", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u5f53\u524d\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u7684\u6cbb\u7406\u591a\u4f9d\u8d56\u5355\u6b65\u68c0\u67e5\uff0c\u4f46\u8bb8\u591a\u771f\u5b9e\u653f\u7b56\u7ea6\u675f\u662f\u8de8\u6b65\u9aa4\u3001\u5168\u6d41\u7a0b\u6027\u8d28\uff0c\u5bfc\u81f4\u6bcf\u4e00\u6b65\u90fd\u5408\u89c4\u800c\u6574\u4f53\u8fdd\u89c4\u7684\u201c\u7ec4\u5408\u5f0f\u653f\u7b56\u8fdd\u89c4\u201d\u95ee\u9898\u3002\u4f5c\u8005\u5b9a\u4e49\u5e76\u5206\u7c7b\u4e86\u56db\u7c7b CPV\uff0c\u5e76\u63d0\u51fa\u57fa\u4e8e\u6eaf\u6e90\u7684\u8fd0\u884c\u65f6\u67b6\u6784\uff0c\u901a\u8fc7\u5b8c\u6574\u6267\u884c\u8f68\u8ff9\u800c\u975e\u5355\u6b65\u8f93\u51fa\u6765\u8bc4\u4f30\u653f\u7b56\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Current Mixture-of-Agents (MoA) paradigms generally treat query routing and agent fine-tuning as separate processes, limiting their ability to respond to evolving agent capabilities. This disconnect prevents routing strategies from adapting to evolving agent capabilities during post-training and prevents agents from achieving synergistic data-driven specialization. To resolve this, we introduce CERA-MoA (Co-Evolving Router with continually learning Agents for Mixture-of-Agents), an iterative reinforcement learning framework where the dynamic router and independent agent policies co-evolve. We design a predictive familiarity estimator that leverages mid-layer hidden states to evaluate semantic competence among agents, avoiding the overhead of full rollouts. Based on these familiarity scores, a cumulative-threshold adaptive routing mechanism dynamically activates a tailored minimal agent subset, achieving a trade-off between task performance and efficiency. By proactively allocating targeted training samples to agents based on their evolving competence, CERA-MoA promotes capability differentiation. Extensive experiments across various domains demonstrate that CERA-MoA outperforms state-of-the-art static-agent routing and fix-workflow fine-tuning baselines.", "arxiv_id": "2609.18779", "arxiv_url": "https://arxiv.org/abs/2609.18779", "authors": ["Jiaxuan Jiang", "Liyuan He", "Zhixuan Fang"], "brief": "\u8bba\u6587\u63d0\u51fa CERA-MoA\uff0c\u8ba9\u52a8\u6001\u8def\u7531\u5668\u4e0e\u6301\u7eed\u5b66\u4e60\u7684 LLM \u667a\u80fd\u4f53\u5728\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u4e0b\u5171\u540c\u6f14\u5316\uff0c\u800c\u4e0d\u662f\u5c06\u8def\u7531\u548c\u5fae\u8c03\u5206\u5f00\u5904\u7406\u3002\u65b9\u6cd5\u7528\u4e2d\u5c42\u9690\u85cf\u72b6\u6001\u4f30\u8ba1\u5404\u667a\u80fd\u4f53\u5bf9\u67e5\u8be2\u7684\u719f\u6089\u5ea6\uff0c\u5e76\u81ea\u9002\u5e94\u6fc0\u6d3b\u6700\u5c0f\u5fc5\u8981\u667a\u80fd\u4f53\u5b50\u96c6\uff0c\u5728\u591a\u9886\u57df\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u9759\u6001\u8def\u7531\u548c\u56fa\u5b9a\u6d41\u7a0b\u5fae\u8c03\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18779", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u8def\u7531\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18779v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CERA-MoA: Co-Evolving Routing Mechanisms with Continually Learning LLM Agents", "tldr": "\u8bba\u6587\u63d0\u51fa CERA-MoA\uff0c\u8ba9\u52a8\u6001\u8def\u7531\u5668\u4e0e\u6301\u7eed\u5b66\u4e60\u7684 LLM \u667a\u80fd\u4f53\u5728\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u4e0b\u5171\u540c\u6f14\u5316\uff0c\u800c\u4e0d\u662f\u5c06\u8def\u7531\u548c\u5fae\u8c03\u5206\u5f00\u5904\u7406\u3002\u65b9\u6cd5\u7528\u4e2d\u5c42\u9690\u85cf\u72b6\u6001\u4f30\u8ba1\u5404\u667a\u80fd\u4f53\u5bf9\u67e5\u8be2\u7684\u719f\u6089\u5ea6\uff0c\u5e76\u81ea\u9002\u5e94\u6fc0\u6d3b\u6700\u5c0f\u5fc5\u8981\u667a\u80fd\u4f53\u5b50\u96c6\uff0c\u5728\u591a\u9886\u57df\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u9759\u6001\u8def\u7531\u548c\u56fa\u5b9a\u6d41\u7a0b\u5fae\u8c03\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Generative artificial intelligence (GenAI) is changing how students learn, yet the roles of course context, cognitive reliance, evaluation literacy, and early reliance remain underexplored. Using survey responses from 118 students across 12 AI-related courses at our institution, we examined differences in GenAI use and perceived learning experiences. We identified four user clusters: high-use students reporting many benefits, light users reporting less reliance and fewer benefits, and two moderate-use groups reporting different levels of benefit. We also found significant differences between free- and premium-version users, single- and multiple-tool users, and students experiencing different instructor policies. In multivariable regression models, academic benefit was associated with early reliance and academic task support; positive impact was associated with cognitive reliance, academic task support, confidence in GenAI reliability, and instructor policy; and negative impact was associated with early reliance and attitudinal change. The association between early reliance and negative impact became stronger as evaluation literacy increased. Finally, perceptions of GenAI-enhanced learning appear to reflect cognitive, performance, and self-efficacy benefits, while concerns about stress and diminished critical thinking are associated with lower perceived learning benefits. These findings suggest that institutions need better policies to address such inequities so that institutions can enable students to benefit from increasingly capable AI systems.", "arxiv_id": "2609.18676", "arxiv_url": "https://arxiv.org/abs/2609.18676", "authors": ["Lydia Manikonda", "Mei Si", "Sirajam Munira", "Oshani Seneviratne", "Kristin Bennett"], "brief": "\u8be5\u7814\u7a76\u57fa\u4e8e12\u95e8AI\u76f8\u5173\u8bfe\u7a0b\u4e2d118\u540d\u5b66\u751f\u7684\u95ee\u5377\uff0c\u5206\u6790\u751f\u6210\u5f0fAI\u4f7f\u7528\u65b9\u5f0f\u3001\u4f9d\u8d56\u7a0b\u5ea6\u3001\u8bc4\u4f30\u7d20\u517b\u548c\u8bfe\u7a0b\u653f\u7b56\u5bf9\u5b66\u4e60\u4f53\u9a8c\u7684\u5f71\u54cd\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u65e9\u671f\u4f9d\u8d56\u3001\u4efb\u52a1\u652f\u6301\u3001\u5bf9\u53ef\u9760\u6027\u7684\u4fe1\u5fc3\u548c\u6559\u5e08\u653f\u7b56\u4f1a\u663e\u8457\u5f71\u54cd\u5b66\u751f\u611f\u77e5\u6536\u76ca\u4e0e\u8d1f\u9762\u5f71\u54cd\uff0c\u4e14\u8bc4\u4f30\u7d20\u517b\u8f83\u9ad8\u65f6\u65e9\u671f\u4f9d\u8d56\u4e0e\u8d1f\u9762\u5f71\u54cd\u7684\u5173\u8054\u66f4\u5f3a\u3002", "categories": ["cs.AI", "cs.ET", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18676", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5f0fAI", "\u6559\u80b2\u6280\u672f", "\u5b66\u4e60\u5206\u6790", "AI\u7d20\u517b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18676v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "The Uneven Impact of Generative AI on Student Learning: Examining the Roles of Reliance, Evaluation Literacy, and Course Policy in AI-related Courses", "tldr": "\u8be5\u7814\u7a76\u57fa\u4e8e12\u95e8AI\u76f8\u5173\u8bfe\u7a0b\u4e2d118\u540d\u5b66\u751f\u7684\u95ee\u5377\uff0c\u5206\u6790\u751f\u6210\u5f0fAI\u4f7f\u7528\u65b9\u5f0f\u3001\u4f9d\u8d56\u7a0b\u5ea6\u3001\u8bc4\u4f30\u7d20\u517b\u548c\u8bfe\u7a0b\u653f\u7b56\u5bf9\u5b66\u4e60\u4f53\u9a8c\u7684\u5f71\u54cd\u3002\u7ed3\u679c\u53d1\u73b0\uff0c\u65e9\u671f\u4f9d\u8d56\u3001\u4efb\u52a1\u652f\u6301\u3001\u5bf9\u53ef\u9760\u6027\u7684\u4fe1\u5fc3\u548c\u6559\u5e08\u653f\u7b56\u4f1a\u663e\u8457\u5f71\u54cd\u5b66\u751f\u611f\u77e5\u6536\u76ca\u4e0e\u8d1f\u9762\u5f71\u54cd\uff0c\u4e14\u8bc4\u4f30\u7d20\u517b\u8f83\u9ad8\u65f6\u65e9\u671f\u4f9d\u8d56\u4e0e\u8d1f\u9762\u5f71\u54cd\u7684\u5173\u8054\u66f4\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As corporate AI adoption continues to grow, enterprise-grade LLM agents are being deployed into sensitive contexts such as hiring, healthcare, and finance. In these contexts, compliance with rules specified in an agent\u0027s system context is a first-order legal concern. Currently, no evaluation framework systematically measures which LLM models tend to violate compliance rules, especially under pressure from a persistent user, a hurried manager, or circumstances where violation is convenient or attractive. We introduce PACT (Pressure-Applied Compliance Testing), a benchmark for rule-following under pressure in AI agents assisting employees in daily tasks across twelve regulated enterprise domains and forty-eight scenarios, each set in a realistic multi-turn conversation. Each benchmark item pairs a standing rule against a rule-violating shortcut, and applies a battery of pressures across different wordings and system-prompt modes. We construct PACT component by component under strict LLM-as-judge auditing to ensure samples are unambiguous, ungameable, and realistic enough to avoid eliciting evaluation-aware behavior. We use PACT to profile LLM compliance across six complementary metrics that create a holistic picture of an AI assistant\u0027s robustness under pressure and throughout multi-turn conversations, its transparency, and ability to correctly discern where a rule applies. We aggregate this profile into PACTScore, a reliability-weighted compliance rate over all items and modes. Our results across 22 common LLM models spanning multiple providers and sizes show substantial variability in compliance across models and metric dimensions. Even the strongest assistants mis-apply a rule on 6 to 10% of items, and ordinary user pressure raises the violation rate by 65% on average. PACT highlights compliance risks in LLM assistants, motivating guardrails and careful model selection.", "arxiv_id": "2609.18605", "arxiv_url": "https://arxiv.org/abs/2609.18605", "authors": ["Mika Okamoto", "Ansel Kaplan Erol"], "brief": "\u672c\u6587\u63d0\u51fa PACT\uff0c\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u7ea7 LLM \u52a9\u624b\u7684\u5408\u89c4\u538b\u529b\u6d4b\u8bd5\u57fa\u51c6\uff0c\u8986\u76d6 12 \u4e2a\u53d7\u76d1\u7ba1\u4e1a\u52a1\u57df\u548c 48 \u4e2a\u591a\u8f6e\u573a\u666f\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u5728\u7528\u6237\u50ac\u4fc3\u3001\u7ba1\u7406\u538b\u529b\u6216\u8fdd\u89c4\u66f4\u65b9\u4fbf\u65f6\u662f\u5426\u4ecd\u9075\u5b88\u7cfb\u7edf\u89c4\u5219\u3002\u5bf9 22 \u4e2a\u5e38\u89c1\u6a21\u578b\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u6a21\u578b\u95f4\u5408\u89c4\u6027\u5dee\u5f02\u663e\u8457\uff0c\u5373\u4f7f\u6700\u5f3a\u6a21\u578b\u4e5f\u6709 6% \u5230 10% \u7684\u89c4\u5219\u8bef\u7528\uff0c\u666e\u901a\u7528\u6237\u538b\u529b\u5e73\u5747\u4f1a\u4f7f\u8fdd\u89c4\u7387\u4e0a\u5347 65%\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18605", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u8bc4\u6d4b", "\u5408\u89c4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18605v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "PACT: Can Enterprise AI Assistants Be Trusted Under Pressure?", "tldr": "\u672c\u6587\u63d0\u51fa PACT\uff0c\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u7ea7 LLM \u52a9\u624b\u7684\u5408\u89c4\u538b\u529b\u6d4b\u8bd5\u57fa\u51c6\uff0c\u8986\u76d6 12 \u4e2a\u53d7\u76d1\u7ba1\u4e1a\u52a1\u57df\u548c 48 \u4e2a\u591a\u8f6e\u573a\u666f\uff0c\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u5728\u7528\u6237\u50ac\u4fc3\u3001\u7ba1\u7406\u538b\u529b\u6216\u8fdd\u89c4\u66f4\u65b9\u4fbf\u65f6\u662f\u5426\u4ecd\u9075\u5b88\u7cfb\u7edf\u89c4\u5219\u3002\u5bf9 22 \u4e2a\u5e38\u89c1\u6a21\u578b\u7684\u6d4b\u8bd5\u663e\u793a\uff0c\u6a21\u578b\u95f4\u5408\u89c4\u6027\u5dee\u5f02\u663e\u8457\uff0c\u5373\u4f7f\u6700\u5f3a\u6a21\u578b\u4e5f\u6709 6% \u5230 10% \u7684\u89c4\u5219\u8bef\u7528\uff0c\u666e\u901a\u7528\u6237\u538b\u529b\u5e73\u5747\u4f1a\u4f7f\u8fdd\u89c4\u7387\u4e0a\u5347 65%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-driving laboratories can explore synthesis conditions autonomously, but their decision-making layer is typically a black-box optimizer, and the output is a set of optimized samples, with the measurements reduced to predefined scalar objectives and the reasons behind success left unarticulated. Here we present SynAgent, a framework in which large language model agents operate an automated experimental system and maintain an explicit, revisable understanding of the synthesis process as the campaign\u0027s primary output. Starting with no predefined analysis pipeline, SynAgent adaptively generates analysis skills for newly acquired data and evolves this understanding through multimodal reasoning over experimental data such as X-ray diffraction patterns and electron micrographs. The evolution is guided by a verify-falsify scheme, in which the agent deliberately challenges its own hypotheses by testing conditions predicted to fail as well as those predicted to succeed. In a single campaign of 18 autonomous experiments using LiCoO2 (001) thin-film deposition as a testbed, SynAgent synthesized highly crystalline films and evolved an understanding of how the substrate temperature governs crystallization, discovering an abrupt threshold and a narrow optimal growth window at 650-690 \u00b0C. These results extend autonomous experimentation beyond optimized samples to testable, human-readable understanding.", "arxiv_id": "2609.18598", "arxiv_url": "https://arxiv.org/abs/2609.18598", "authors": ["Izumi Takahara", "Kazunori Nishio", "Akira Aiba", "Shigeru Kobayashi", "Takao Nakajima", "Taro Hitosugi", "Teruyasu Mizoguchi"], "brief": "\u672c\u6587\u63d0\u51fa SynAgent\uff0c\u8ba9\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u81ea\u4e3b\u64cd\u4f5c\u6750\u6599\u5408\u6210\u5b9e\u9a8c\uff0c\u5e76\u628a\u201c\u53ef\u68c0\u9a8c\u3001\u53ef\u4fee\u6b63\u7684\u673a\u7406\u7406\u89e3\u201d\u4f5c\u4e3a\u4e3b\u8981\u8f93\u51fa\uff0c\u800c\u4e0d\u53ea\u662f\u9ed1\u7bb1\u4f18\u5316\u6837\u54c1\u3002\u5b83\u80fd\u81ea\u9002\u5e94\u751f\u6210\u6570\u636e\u5206\u6790\u6280\u80fd\uff0c\u7ed3\u5408 XRD \u548c\u7535\u955c\u56fe\u50cf\u8fdb\u884c\u63a8\u7406\uff0c\u5e76\u901a\u8fc7\u9a8c\u8bc1-\u8bc1\u4f2a\u7b56\u7565\u4e3b\u52a8\u6d4b\u8bd5\u5047\u8bbe\uff1b\u5728 LiCoO2 \u8584\u819c\u6c89\u79ef\u7684 18 \u6b21\u81ea\u4e3b\u5b9e\u9a8c\u4e2d\u53d1\u73b0\u4e86 650-690\u00b0C \u7684\u7a84\u6700\u4f73\u751f\u957f\u7a97\u53e3\u3002", "categories": ["cond-mat.mtrl-sci", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18598", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6750\u6599\u5408\u6210", "\u591a\u6a21\u6001", "\u81ea\u52a8\u5316\u5b9e\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18598v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Hypothesis-Driven Autonomous Materials Synthesis with Multimodal LLM Agents", "tldr": "\u672c\u6587\u63d0\u51fa SynAgent\uff0c\u8ba9\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u81ea\u4e3b\u64cd\u4f5c\u6750\u6599\u5408\u6210\u5b9e\u9a8c\uff0c\u5e76\u628a\u201c\u53ef\u68c0\u9a8c\u3001\u53ef\u4fee\u6b63\u7684\u673a\u7406\u7406\u89e3\u201d\u4f5c\u4e3a\u4e3b\u8981\u8f93\u51fa\uff0c\u800c\u4e0d\u53ea\u662f\u9ed1\u7bb1\u4f18\u5316\u6837\u54c1\u3002\u5b83\u80fd\u81ea\u9002\u5e94\u751f\u6210\u6570\u636e\u5206\u6790\u6280\u80fd\uff0c\u7ed3\u5408 XRD \u548c\u7535\u955c\u56fe\u50cf\u8fdb\u884c\u63a8\u7406\uff0c\u5e76\u901a\u8fc7\u9a8c\u8bc1-\u8bc1\u4f2a\u7b56\u7565\u4e3b\u52a8\u6d4b\u8bd5\u5047\u8bbe\uff1b\u5728 LiCoO2 \u8584\u819c\u6c89\u79ef\u7684 18 \u6b21\u81ea\u4e3b\u5b9e\u9a8c\u4e2d\u53d1\u73b0\u4e86 650-690\u00b0C \u7684\u7a84\u6700\u4f73\u751f\u957f\u7a97\u53e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In-context learning (ICL) enables large language model (LLM) agents to improve decisions using interaction history, yet it remains unclear whether such improvement reflects refined internal reasoning or mere extrapolation of statistical patterns. To disentangle these mechanisms, we study LLM agents in multi-agent incomplete-information games that require recursive belief reasoning. By constructing a public goods game and manipulating the statistical structure of historical feedback, we evaluate decision quality against a history-independent rational expectations equilibrium (REE) benchmark. Our experiments reveal that when historical statistical patterns are disrupted, the benefits of longer context largely vanish, degrading decision quality to the no-context baseline in a way sharply amplified by stronger strategic interdependence. These results suggest that, in such strategic environments, ICL behavior is more consistent with statistical extrapolation than with strategic reasoning. Our work extends the mechanistic study of ICL to strategic multi-agent settings, introduces REE as a diagnostic tool for distinguishing reasoning from extrapolation, and provides a reusable framework for probing the boundaries of LLM reasoning in recursive belief tasks.", "arxiv_id": "2609.18591", "arxiv_url": "https://arxiv.org/abs/2609.18591", "authors": ["Yu Liu", "Wenwen Li", "Yifan Dou", "Guangnan Ye"], "brief": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u591a\u667a\u80fd\u4f53\u4e0d\u5b8c\u5168\u4fe1\u606f\u535a\u5f08\u4e2d\u7684\u4e0a\u4e0b\u6587\u5b66\u4e60\uff0c\u5230\u5e95\u662f\u9012\u5f52\u6218\u7565\u63a8\u7406\u8fd8\u662f\u7edf\u8ba1\u5916\u63a8\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u4e00\u65e6\u6270\u4e71\u5386\u53f2\u53cd\u9988\u4e2d\u7684\u7edf\u8ba1\u6a21\u5f0f\uff0c\u957f\u4e0a\u4e0b\u6587\u5e26\u6765\u7684\u51b3\u7b56\u6536\u76ca\u57fa\u672c\u6d88\u5931\uff0c\u5c24\u5176\u5728\u7b56\u7565\u76f8\u4e92\u4f9d\u8d56\u66f4\u5f3a\u65f6\u9000\u5316\u66f4\u660e\u663e\uff0c\u8bf4\u660e\u5176\u884c\u4e3a\u66f4\u50cf\u7edf\u8ba1\u5916\u63a8\u800c\u975e\u771f\u6b63\u6218\u7565\u63a8\u7406\u3002", "categories": ["cs.AI", "econ.GN"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18591", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u591a\u667a\u80fd\u4f53", "\u535a\u5f08\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18591v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Recursive Reasoning or Statistical Extrapolation? In-Context Learning in Multi-Agent Interdependent Decision-Making", "tldr": "\u672c\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u5728\u591a\u667a\u80fd\u4f53\u4e0d\u5b8c\u5168\u4fe1\u606f\u535a\u5f08\u4e2d\u7684\u4e0a\u4e0b\u6587\u5b66\u4e60\uff0c\u5230\u5e95\u662f\u9012\u5f52\u6218\u7565\u63a8\u7406\u8fd8\u662f\u7edf\u8ba1\u5916\u63a8\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u4e00\u65e6\u6270\u4e71\u5386\u53f2\u53cd\u9988\u4e2d\u7684\u7edf\u8ba1\u6a21\u5f0f\uff0c\u957f\u4e0a\u4e0b\u6587\u5e26\u6765\u7684\u51b3\u7b56\u6536\u76ca\u57fa\u672c\u6d88\u5931\uff0c\u5c24\u5176\u5728\u7b56\u7565\u76f8\u4e92\u4f9d\u8d56\u66f4\u5f3a\u65f6\u9000\u5316\u66f4\u660e\u663e\uff0c\u8bf4\u660e\u5176\u884c\u4e3a\u66f4\u50cf\u7edf\u8ba1\u5916\u63a8\u800c\u975e\u771f\u6b63\u6218\u7565\u63a8\u7406\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Collective intelligence is a collaborative autonomy paradigm in which multiple agents pursue shared objectives through local perception, information exchange, and coordinated action. UAV swarms embody this paradigm by coordinating multiple vehicles in tasks such as search, inspection, and tracking. Recent advances in large language model (LLM) agents have strengthened natural-language task understanding and high-level planning, providing a flexible semantic interface between mission descriptions and collective behavior. While these advances expand semantic reasoning, applying LLM agents to UAV swarms raises challenges in grounding model decisions in executable capabilities, reconciling global task reasoning with distributed execution, and using mission-specific experience for continual adaptation. To address these challenges, we introduce AeroWeaver, an embodied-agent harness that weaves individual UAV skills into coordinated mission-level behavior. AeroWeaver connects semantic decisions to governed skills, organizes role-conditioned local agents for distributed coordination, and uses role-indexed state-action-reward experience to refine skill selection online. Experiments and runtime validation show that AeroWeaver maintains valid skill execution under tested conditions and supports body-local multi-UAV operation without a central agent generating joint actions from global context, while reward-guided online updates provide a training-free path for adaptive learning swarm agents from accumulated execution experience. Code: https://github.com/Admire-ljb/AeroWeaver.", "arxiv_id": "2609.18520", "arxiv_url": "https://arxiv.org/abs/2609.18520", "authors": ["Jiabin Lou", "Yirong Yang", "Haopeng Wang", "Xuxin Lv", "Xinyu Liu", "Diyuan Hou", "Xuehong Liu", "Rongye Shi", "Wenjun Wu"], "brief": "\u672c\u6587\u63d0\u51fa AeroWeaver\uff0c\u4e00\u4e2a\u9762\u5411\u65e0\u4eba\u673a\u96c6\u7fa4\u7684\u5177\u8eab\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u4efb\u52a1\u7406\u89e3\u4e0e\u53ef\u6267\u884c\u98de\u884c\u6280\u80fd\u3001\u5206\u5e03\u5f0f\u534f\u540c\u548c\u5728\u7ebf\u7ecf\u9a8c\u66f4\u65b0\u8fde\u63a5\u8d77\u6765\u3002\u5b9e\u9a8c\u4e0e\u8fd0\u884c\u9a8c\u8bc1\u663e\u793a\uff0c\u8be5\u6846\u67b6\u80fd\u5728\u65e0\u4e2d\u5fc3\u5316\u5168\u5c40\u8054\u5408\u52a8\u4f5c\u751f\u6210\u5668\u7684\u60c5\u51b5\u4e0b\u4fdd\u6301\u6709\u6548\u6280\u80fd\u6267\u884c\uff0c\u5e76\u901a\u8fc7\u5956\u52b1\u5f15\u5bfc\u7684\u5728\u7ebf\u66f4\u65b0\u5b9e\u73b0\u514d\u8bad\u7ec3\u7684\u81ea\u9002\u5e94\u96c6\u7fa4\u884c\u4e3a\u6539\u8fdb\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18520", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u65e0\u4eba\u673a\u96c6\u7fa4", "\u591a\u667a\u80fd\u4f53\u534f\u540c", "\u5728\u7ebf\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18520v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AeroWeaver: An Embodied-Agent Harness for Weaving Aerial Skills into Distributed, Adaptive Swarm Execution", "tldr": "\u672c\u6587\u63d0\u51fa AeroWeaver\uff0c\u4e00\u4e2a\u9762\u5411\u65e0\u4eba\u673a\u96c6\u7fa4\u7684\u5177\u8eab\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u4efb\u52a1\u7406\u89e3\u4e0e\u53ef\u6267\u884c\u98de\u884c\u6280\u80fd\u3001\u5206\u5e03\u5f0f\u534f\u540c\u548c\u5728\u7ebf\u7ecf\u9a8c\u66f4\u65b0\u8fde\u63a5\u8d77\u6765\u3002\u5b9e\u9a8c\u4e0e\u8fd0\u884c\u9a8c\u8bc1\u663e\u793a\uff0c\u8be5\u6846\u67b6\u80fd\u5728\u65e0\u4e2d\u5fc3\u5316\u5168\u5c40\u8054\u5408\u52a8\u4f5c\u751f\u6210\u5668\u7684\u60c5\u51b5\u4e0b\u4fdd\u6301\u6709\u6548\u6280\u80fd\u6267\u884c\uff0c\u5e76\u901a\u8fc7\u5956\u52b1\u5f15\u5bfc\u7684\u5728\u7ebf\u66f4\u65b0\u5b9e\u73b0\u514d\u8bad\u7ec3\u7684\u81ea\u9002\u5e94\u96c6\u7fa4\u884c\u4e3a\u6539\u8fdb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "How does a multi-agent system evolve from a local deviation into collective loss of control? We propose an epidemic explanation organized around accidental mutation, contagion, and recovery. A spontaneous deviation creates a seed; communication enables other agents to adopt and retransmit its unsafe strategy; collective failure can emerge when propagation outpaces correction and containment. Thus, rare individual deviations can coexist with substantial collective risk. Motivated by reported OpenAI agent coordination incidents, we examine two ingredients of this mechanism. A deployment audit identifies implicit communication paths between nominally independent evaluation runs and verifies transport through a default Docker backend. RogueHandoff-20, a benchmark of 20 executable scenarios, tests recipient susceptibility by injecting unsafe trajectories generated by a modified Qwen-27B route. Across four native-pending routes, executed harm is 0-5% on normal tasks and 40-95% after injection, exceeding paired direct malicious requests by 5-45 percentage points. These results support low observed baseline harm alongside high conditional susceptibility; they do not establish natural rare-event rates or demonstrate an autonomous cascade. The account motivates complementary defenses: strengthen resistance and recovery alongside prevention of spontaneous deviations, and audit and restrict unintended communication paths that can turn local failures into collective loss of control.", "arxiv_id": "2609.18460", "arxiv_url": "https://arxiv.org/abs/2609.18460", "authors": ["Xiangfan Wu", "Zonghao Ying", "Huiyu Wu", "Xing Zheng", "Huangsheng Cheng", "Xiaorong Shi", "Jing Guo"], "brief": "\u8bba\u6587\u5c06\u591a\u667a\u80fd\u4f53 LLM \u7cfb\u7edf\u7684\u96c6\u4f53\u5931\u63a7\u89e3\u91ca\u4e3a\u7c7b\u4f3c\u6d41\u884c\u75c5\u7684\u8fc7\u7a0b\uff1a\u5076\u53d1\u504f\u5dee\u4ea7\u751f\u201c\u611f\u67d3\u6e90\u201d\uff0c\u901a\u4fe1\u8def\u5f84\u4f20\u64ad\u4e0d\u5b89\u5168\u7b56\u7565\uff0c\u82e5\u7ea0\u6b63\u4e0e\u9694\u79bb\u4e0d\u8db3\u5219\u53ef\u80fd\u653e\u5927\u4e3a\u96c6\u4f53\u5931\u8d25\u3002\u4f5c\u8005\u5ba1\u8ba1\u53d1\u73b0\u72ec\u7acb\u8bc4\u6d4b\u8fd0\u884c\u95f4\u5b58\u5728\u9690\u5f0f\u901a\u4fe1\u901a\u9053\uff0c\u5e76\u63d0\u51fa RogueHandoff-20 \u57fa\u51c6\uff0c\u663e\u793a\u6ce8\u5165\u4e0d\u5b89\u5168\u8f68\u8ff9\u540e\u53d7\u5bb3\u6267\u884c\u7387\u4ece\u6b63\u5e38\u4efb\u52a1\u7684 0-5% \u5347\u81f3 40-95%\u3002\u7ed3\u679c\u5f3a\u8c03\u57fa\u7ebf\u5371\u5bb3\u4f4e\u5e76\u4e0d\u4ee3\u8868\u96c6\u4f53\u98ce\u9669\u4f4e\uff0c\u9632\u5fa1\u5e94\u540c\u65f6\u5173\u6ce8\u4f20\u64ad\u901a\u9053\u3001\u6297\u611f\u67d3\u80fd\u529b\u548c\u6062\u590d\u673a\u5236\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.18460", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b\u5b89\u5168", "\u591a\u667a\u80fd\u4f53", "\u98ce\u9669\u4f20\u64ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.18460v1", "published_at": "2026-09-16", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Collective Loss of Control in LLM Agent Systems: An Epidemic Account of Mutation, Contagion, and Recovery", "tldr": "\u8bba\u6587\u5c06\u591a\u667a\u80fd\u4f53 LLM \u7cfb\u7edf\u7684\u96c6\u4f53\u5931\u63a7\u89e3\u91ca\u4e3a\u7c7b\u4f3c\u6d41\u884c\u75c5\u7684\u8fc7\u7a0b\uff1a\u5076\u53d1\u504f\u5dee\u4ea7\u751f\u201c\u611f\u67d3\u6e90\u201d\uff0c\u901a\u4fe1\u8def\u5f84\u4f20\u64ad\u4e0d\u5b89\u5168\u7b56\u7565\uff0c\u82e5\u7ea0\u6b63\u4e0e\u9694\u79bb\u4e0d\u8db3\u5219\u53ef\u80fd\u653e\u5927\u4e3a\u96c6\u4f53\u5931\u8d25\u3002\u4f5c\u8005\u5ba1\u8ba1\u53d1\u73b0\u72ec\u7acb\u8bc4\u6d4b\u8fd0\u884c\u95f4\u5b58\u5728\u9690\u5f0f\u901a\u4fe1\u901a\u9053\uff0c\u5e76\u63d0\u51fa RogueHandoff-20 \u57fa\u51c6\uff0c\u663e\u793a\u6ce8\u5165\u4e0d\u5b89\u5168\u8f68\u8ff9\u540e\u53d7\u5bb3\u6267\u884c\u7387\u4ece\u6b63\u5e38\u4efb\u52a1\u7684 0-5% \u5347\u81f3 40-95%\u3002\u7ed3\u679c\u5f3a\u8c03\u57fa\u7ebf\u5371\u5bb3\u4f4e\u5e76\u4e0d\u4ee3\u8868\u96c6\u4f53\u98ce\u9669\u4f4e\uff0c\u9632\u5fa1\u5e94\u540c\u65f6\u5173\u6ce8\u4f20\u64ad\u901a\u9053\u3001\u6297\u611f\u67d3\u80fd\u529b\u548c\u6062\u590d\u673a\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notab
