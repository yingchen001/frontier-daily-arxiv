 all defenses. Code is available at https://anonymous.4open.science/r/Tripwire-65C4.", "arxiv_id": "2608.14392", "arxiv_url": "https://arxiv.org/abs/2608.14392", "authors": ["Wei Zhao", "Zhe Li", "Peixin Zhang", "Jun Sun"], "brief": "\u8bba\u6587\u63d0\u51fa Tripwire\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LLM \u8d8a\u72f1\u9632\u5fa1\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7edf\u8ba1\u68c0\u9a8c\u8bc6\u522b\u201c\u5b89\u5168\u7279\u5f02\u201d\u795e\u7ecf\u5143\uff0c\u5e76\u5728\u68c0\u6d4b\u5230\u98ce\u9669\u65f6\u94b3\u5236\u5176\u6fc0\u6d3b\uff0c\u89e6\u53d1\u5bf9\u9f50\u9636\u6bb5\u5b66\u5230\u7684\u62d2\u7b54\u884c\u4e3a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14392", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u9010\u795e\u7ecf\u5143\u5047\u8bbe\u68c0\u9a8c\u548c\u9519\u8bef\u53d1\u73b0\u7387\u63a7\u5236\u7b5b\u9009\u5b89\u5168\u76f8\u5173\u795e\u7ecf\u5143\uff0c\u5e76\u52a0\u5165\u6548\u7528\u7279\u5f02\u6027\u8fc7\u6ee4\uff0c\u51cf\u5c11\u5bf9\u6b63\u5e38\u80fd\u529b\u7684\u5e72\u6270", "\u901a\u8fc7\u5c06\u9009\u4e2d\u795e\u7ecf\u5143\u56fa\u5b9a\u5230\u6709\u5bb3\u8f93\u5165\u6761\u4ef6\u4e0b\u7684\u5e73\u5747\u6fc0\u6d3b\uff0c\u5411\u6a21\u578b\u5185\u90e8\u6ce8\u5165\u201c\u6709\u5bb3\u8f93\u5165\u201d\u4fe1\u53f7\u4ee5\u89e6\u53d1\u62d2\u7b54", "\u652f\u6301\u4e24\u79cd\u7b49\u4ef7\u90e8\u7f72\u65b9\u5f0f\uff1a\u68c0\u6d4b\u5668\u95e8\u63a7\u7684\u63a8\u7406\u65f6\u5e72\u9884\uff0c\u4ee5\u53ca\u79bb\u7ebf bias-patch \u6743\u91cd\u7f16\u8f91"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50", "\u8d8a\u72f1\u9632\u5fa1", "\u6a21\u578b\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14392v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Tripwire: Triggering Aligned Refusal via Statistically Certified Safety Neurons", "tldr": "\u7528\u5b89\u5168\u795e\u7ecf\u5143\u89e6\u53d1\u62d2\u7b54\uff0c\u4f4e\u635f\u9632\u8d8a\u72f1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Tripwire\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LLM \u8d8a\u72f1\u9632\u5fa1\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u7edf\u8ba1\u68c0\u9a8c\u8bc6\u522b\u201c\u5b89\u5168\u7279\u5f02\u201d\u795e\u7ecf\u5143\uff0c\u5e76\u5728\u68c0\u6d4b\u5230\u98ce\u9669\u65f6\u94b3\u5236\u5176\u6fc0\u6d3b\uff0c\u89e6\u53d1\u5bf9\u9f50\u9636\u6bb5\u5b66\u5230\u7684\u62d2\u7b54\u884c\u4e3a\u3002", "why_notable": "\u76f8\u6bd4\u6301\u7eed\u6291\u5236\u6709\u5bb3\u795e\u7ecf\u5143\u6216\u4f9d\u8d56\u5916\u90e8\u5206\u7c7b\u5668\u7684\u65b9\u6cd5\uff0cTripwire \u66f4\u7ec6\u7c92\u5ea6\u4e14\u53ea\u5728\u9700\u8981\u65f6\u89e6\u53d1\uff0c\u5728\u56db\u4e2a\u5bf9\u9f50 LLM \u548c\u56db\u7c7b\u653b\u51fb\u4e0a\u5c06\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u964d\u81f3\u6700\u9ad8 2.0%\uff0c\u540c\u65f6 MT-Bench \u6548\u7528\u4e0b\u964d\u4ec5 0.5% \u5230 5.3%\u3002"}, {"abstract": "Vision-Language-Action (VLA) models have recently achieved promising performance in robotic manipulation. However, existing benchmarks mainly evaluate generalization on static manipulation tasks and largely overlook dynamic interaction scenarios. To address this gap, we present ReflexBench, a benchmark for reaction-critical manipulation. ReflexBench contains six dynamic tasks and introduces an evaluation framework that decouples simulator stepping from robot control while supporting configurable latency under synchronous and asynchronous inference. Building upon ReflexBench, we propose ReflexVLA, an efficient VLA model designed for reaction-critical manipulation without large-scale robot-data pretraining. ReflexVLA enhances temporal reasoning through latent future prediction and multi-frame temporal fusion within the vision backbone, while reducing deployment latency through batched visual encoding and CUDA Graph replay. Experiments show that ReflexVLA consistently improves dynamic manipulation performance while maintaining competitive accuracy on standard static manipulation benchmarks, and real-world experiments further demonstrate its effectiveness under practical deployment conditions. Project website: https://reflexvla.github.io", "arxiv_id": "2608.14379", "arxiv_url": "https://arxiv.org/abs/2608.14379", "authors": ["Yuxuan Chen", "Wanruo Zhang", "Xiao Li"], "brief": "\u8bba\u6587\u63d0\u51fa ReflexBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u673a\u5668\u4eba\u5728\u53cd\u5e94\u5173\u952e\u578b\u52a8\u6001\u64cd\u4f5c\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\uff1b\u5e76\u63d0\u51fa ReflexVLA\uff0c\u901a\u8fc7\u672a\u6765\u9884\u6d4b\u548c\u65f6\u5e8f\u878d\u5408\u63d0\u5347\u52a8\u6001\u64cd\u4f5c\u80fd\u529b\uff0c\u540c\u65f6\u4f18\u5316\u63a8\u7406\u5ef6\u8fdf\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14379", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["ReflexBench \u5305\u542b6\u4e2a\u52a8\u6001\u64cd\u4f5c\u4efb\u52a1\uff0c\u5e76\u652f\u6301\u540c\u6b65/\u5f02\u6b65\u63a8\u7406\u4e0e\u53ef\u914d\u7f6e\u5ef6\u8fdf\u8bc4\u4f30", "ReflexVLA \u5728\u89c6\u89c9\u9aa8\u5e72\u4e2d\u5f15\u5165\u6f5c\u5728\u672a\u6765\u9884\u6d4b\u548c\u591a\u5e27\u65f6\u5e8f\u878d\u5408\uff0c\u589e\u5f3a\u65f6\u95f4\u63a8\u7406\u80fd\u529b", "\u901a\u8fc7\u6279\u91cf\u89c6\u89c9\u7f16\u7801\u4e0e CUDA Graph replay \u964d\u4f4e\u90e8\u7f72\u5ef6\u8fdf\uff0c\u5e76\u5728\u771f\u5b9e\u673a\u5668\u4eba\u5b9e\u9a8c\u4e2d\u9a8c\u8bc1\u6709\u6548\u6027"], "keywords": ["\u673a\u5668\u4eba", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u52a8\u6001\u64cd\u4f5c", "\u65f6\u5e8f\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14379v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Reflex: Enabling Fast and Predictive Vision-Language-Action Models for Reaction-Critical Manipulation", "tldr": "\u9762\u5411\u52a8\u6001\u64cd\u4f5c\u7684\u4f4e\u5ef6\u8fdf\u9884\u6d4b\u5f0fVLA\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ReflexBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u673a\u5668\u4eba\u5728\u53cd\u5e94\u5173\u952e\u578b\u52a8\u6001\u64cd\u4f5c\u4efb\u52a1\u4e2d\u7684\u8868\u73b0\uff1b\u5e76\u63d0\u51fa ReflexVLA\uff0c\u901a\u8fc7\u672a\u6765\u9884\u6d4b\u548c\u65f6\u5e8f\u878d\u5408\u63d0\u5347\u52a8\u6001\u64cd\u4f5c\u80fd\u529b\uff0c\u540c\u65f6\u4f18\u5316\u63a8\u7406\u5ef6\u8fdf\u3002", "why_notable": "\u73b0\u6709VLA\u8bc4\u6d4b\u591a\u805a\u7126\u9759\u6001\u4efb\u52a1\uff0c\u8be5\u5de5\u4f5c\u7cfb\u7edf\u8865\u8db3\u4e86\u52a8\u6001\u4ea4\u4e92\u4e0e\u4f4e\u5ef6\u8fdf\u63a7\u5236\u573a\u666f\uff0c\u5e76\u5c55\u793a\u4e86\u65e0\u9700\u5927\u89c4\u6a21\u673a\u5668\u4eba\u9884\u8bad\u7ec3\u4e5f\u80fd\u63d0\u5347\u53cd\u5e94\u5173\u952e\u64cd\u4f5c\u6027\u80fd\u7684\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "We introduce Mobius-v0, an architecture that comprises a globally shared Memory (FFN) that stores knowledge vectors and multiple Reasoners (Self-Attn) that iteratively achieve compositional reasoning. Using hidden states as cache and carrier, reasoners repeatedly query memory for required knowledge-vectors, while the knowledge is transmitted back to reasoning operators. Through this knowledge-reasoning-separation architecture, Mobius achieves better knowledge compression and reasoning efficiency. Built upon Mobius-v0 architecture: 1) Our 7B model trained-from-scratch achieves similar downstream score as a 7B Transformer baseline with 62.6% of baseline\u0027s training data. 2) Our Intern-S2-Mobius, continually-pretrained from Qwen3.5-35B, achieves similar downstream score while delivering nearly 4x end-to-end inference speedup.", "arxiv_id": "2608.14290", "arxiv_url": "https://arxiv.org/abs/2608.14290", "authors": ["Kai Chen", "Jifeng Ding", "Ning Ding", "Jiaye Ge", "Lixin Gu", "Yicheng Gu", "Qipeng Guo", "Ermo Hua", "Haian Huang", "Haozheng Hou", "Jie Hou", "Xiangyu Hong", "Che Jiang", "Minxi Jin", "Cheng Liang", "Dahua Lin", "Dawei Liu", "Kuikun Liu", "Chengqi Lv", "Haijun Lv", "Han Lv", "Ningsheng Ma", "Biqing Qi", "Jianmin Qian", "Shiya Su", "Youbang Sun", "Huanze Tang", "Zhongbo Tian", "Hanjing Wang", "Rui Wang", "Ting Wang", "Yi Wang", "Baiting Wu", "Jun Xu", "Bowen Yang", "Hui Wang", "Weida Wang", "Haochen Ye", "Jiashuo Yu", "Shan Yu", "Xiaoyi Yu", "Qirui Zeng", "Qi Zhang", "Ming Zhang", "Wenwei Zhang", "Bowen Zhou", "Xinyu Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Mobius-v0 \u67b6\u6784\uff0c\u5c06\u5b58\u50a8\u77e5\u8bc6\u7684\u5168\u5c40\u5171\u4eab Memory\uff08FFN\uff09\u4e0e\u6267\u884c\u7ec4\u5408\u63a8\u7406\u7684\u591a\u4e2a Reasoner\uff08Self-Attn\uff09\u89e3\u8026\u3002\u57fa\u4e8e\u8be5\u67b6\u6784\u7684 Intern-S2-Mobius \u5728\u4fdd\u6301\u76f8\u8fd1\u4e0b\u6e38\u6027\u80fd\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u8bad\u7ec3\u6570\u636e\u6548\u7387\u4e0e\u63a8\u7406\u901f\u5ea6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14290", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7528\u9690\u85cf\u72b6\u6001\u4f5c\u4e3a\u7f13\u5b58\u4e0e\u8f7d\u4f53\uff0c\u8ba9 Reasoner \u53cd\u590d\u67e5\u8be2\u5171\u4eab Memory \u83b7\u53d6\u6240\u9700\u77e5\u8bc6\u5411\u91cf\uff0c\u5e76\u5c06\u77e5\u8bc6\u4f20\u56de\u63a8\u7406\u7b97\u5b50", "7B \u4ece\u96f6\u8bad\u7ec3\u6a21\u578b\u4ec5\u4f7f\u7528 Transformer \u57fa\u7ebf 62.6% \u7684\u8bad\u7ec3\u6570\u636e\uff0c\u5373\u8fbe\u5230\u76f8\u8fd1\u4e0b\u6e38\u5f97\u5206", "\u4ece Qwen3.5-35B \u6301\u7eed\u9884\u8bad\u7ec3\u5f97\u5230\u7684 Intern-S2-Mobius\uff0c\u5728\u76f8\u8fd1\u6027\u80fd\u4e0b\u5b9e\u73b0\u8fd1 4 \u500d\u7aef\u5230\u7aef\u63a8\u7406\u52a0\u901f"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u67b6\u6784", "\u63a8\u7406\u6548\u7387", "\u77e5\u8bc6\u538b\u7f29"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14290v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14290.png", "title": "Intern-S2-Mobius: Foundation Model with Decoupled Knowledge and Reasoning", "tldr": "\u89e3\u8026\u77e5\u8bc6\u4e0e\u63a8\u7406\u4ee5\u52a0\u901f\u5927\u6a21\u578b\u63a8\u7406", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Mobius-v0 \u67b6\u6784\uff0c\u5c06\u5b58\u50a8\u77e5\u8bc6\u7684\u5168\u5c40\u5171\u4eab Memory\uff08FFN\uff09\u4e0e\u6267\u884c\u7ec4\u5408\u63a8\u7406\u7684\u591a\u4e2a Reasoner\uff08Self-Attn\uff09\u89e3\u8026\u3002\u57fa\u4e8e\u8be5\u67b6\u6784\u7684 Intern-S2-Mobius \u5728\u4fdd\u6301\u76f8\u8fd1\u4e0b\u6e38\u6027\u80fd\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u8bad\u7ec3\u6570\u636e\u6548\u7387\u4e0e\u63a8\u7406\u901f\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c1d\u8bd5\u4ece\u67b6\u6784\u5c42\u9762\u91cd\u65b0\u5212\u5206\u201c\u77e5\u8bc6\u5b58\u50a8\u201d\u548c\u201c\u63a8\u7406\u8ba1\u7b97\u201d\uff0c\u4e3a\u63d0\u5347\u5927\u6a21\u578b\u77e5\u8bc6\u538b\u7f29\u6548\u7387\u3001\u8bad\u7ec3\u6548\u7387\u548c\u63a8\u7406\u541e\u5410\u63d0\u4f9b\u4e86\u65b0\u8def\u5f84\uff0c\u5bf9\u9ad8\u6548\u57fa\u7840\u6a21\u578b\u8bbe\u8ba1\u5177\u6709\u8f83\u5f3a\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Autoformalization is commonly framed as translating natural-language mathematical statements into machine-verifiable formal languages such as Lean 4. However, faithful formalization requires more than translation. Models must map mathematical concepts to the complex hierarchy of types and definitions in formal libraries such as Mathlib, while ensuring that generated statements preserve the meaning of the source propositions. Existing approaches struggle because they rely heavily on the model\u0027s parametric memory for library-specific knowledge, while common data construction pipelines often resort to filtering single-pass outputs and lack mechanisms for feedback-driven revision. To address these challenges, we introduce MathForm, an autoformalization framework for constructing verified training data through Mathlib knowledge retrieval and verification-guided iterative refinement. Before generation, a retrieval planner gathers relevant definitions and existing formalizations from Mathlib to guide the formalization generator. Generated statements are then revised using compiler diagnostics and semantic-consistency feedback. Using this framework, we construct FormalVerse, a Lean 4 dataset containing approximately 367K verified examples across diverse mathematical domains and sources. We then train MathForm-8B through supervised fine-tuning followed by reinforcement learning. Across six benchmarks, MathForm-8B achieves average Pass@8 rates of 88.06% under Syntax Check (SC) and 72.37% under Consistency Check (CC), outperforming multiple specialized 32B autoformalizers. On the challenging FATE-H and FATE-X subsets, it attains CC pass rates of 63% and 37%, exceeding the strongest specialized baselines in both cases.", "arxiv_id": "2608.14221", "arxiv_url": "https://arxiv.org/abs/2608.14221", "authors": ["Lushi Pu", "Weiming Zhang", "Xinheng Xie", "Zixuan Fu", "Bingxiang He", "Hengyu Zhao", "Hongya Lyu", "Xin Li", "Jie Zhou", "Yudong Wang"], "brief": "\u8bba\u6587\u63d0\u51fa MathForm\uff0c\u4e00\u4e2a\u9762\u5411 Lean 4/Mathlib \u7684\u6570\u5b66\u81ea\u52a8\u5f62\u5f0f\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u68c0\u7d22\u5e93\u77e5\u8bc6\u3001\u7f16\u8bd1\u5668\u8bca\u65ad\u548c\u8bed\u4e49\u4e00\u81f4\u6027\u53cd\u9988\u6765\u6784\u9020\u9ad8\u8d28\u91cf\u9a8c\u8bc1\u6570\u636e\u5e76\u8bad\u7ec3\u6a21\u578b\u3002\u57fa\u4e8e\u8be5\u6846\u67b6\u6784\u5efa\u4e86\u7ea6 36.7 \u4e07\u6761\u5df2\u9a8c\u8bc1\u6837\u672c\u7684 FormalVerse \u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3\u51fa MathForm-8B\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14221", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u68c0\u7d22\u89c4\u5212\u5668\uff0c\u4ece Mathlib \u4e2d\u83b7\u53d6\u76f8\u5173\u5b9a\u4e49\u548c\u65e2\u6709\u5f62\u5f0f\u5316\u7ed3\u679c\uff0c\u51cf\u5c11\u5bf9\u6a21\u578b\u53c2\u6570\u8bb0\u5fc6\u7684\u4f9d\u8d56\u3002", "\u5229\u7528 Lean \u7f16\u8bd1\u5668\u8bca\u65ad\u4e0e\u8bed\u4e49\u4e00\u81f4\u6027\u53cd\u9988\u8fdb\u884c\u9a8c\u8bc1\u5f15\u5bfc\u7684\u591a\u8f6e\u4fee\u6b63\uff0c\u800c\u975e\u53ea\u7b5b\u9009\u5355\u6b21\u751f\u6210\u7ed3\u679c\u3002", "MathForm-8B \u5728\u516d\u4e2a\u57fa\u51c6\u4e0a\u5e73\u5747 Pass@8 \u8fbe\u5230 SC 88.06%\u3001CC 72.37%\uff0c\u8d85\u8fc7\u591a\u4e2a\u4e13\u7528 32B \u81ea\u52a8\u5f62\u5f0f\u5316\u6a21\u578b\u3002"], "keywords": ["\u81ea\u52a8\u5f62\u5f0f\u5316", "\u5b9a\u7406\u8bc1\u660e", "\u68c0\u7d22\u589e\u5f3a", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14221v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MathForm: Scaling Mathematical Autoformalization with Knowledge Retrieval and Verification-Guided Refinement", "tldr": "\u7528\u68c0\u7d22\u4e0e\u9a8c\u8bc1\u8fed\u4ee3\u63d0\u5347\u6570\u5b66\u81ea\u52a8\u5f62\u5f0f\u5316\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MathForm\uff0c\u4e00\u4e2a\u9762\u5411 Lean 4/Mathlib \u7684\u6570\u5b66\u81ea\u52a8\u5f62\u5f0f\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u68c0\u7d22\u5e93\u77e5\u8bc6\u3001\u7f16\u8bd1\u5668\u8bca\u65ad\u548c\u8bed\u4e49\u4e00\u81f4\u6027\u53cd\u9988\u6765\u6784\u9020\u9ad8\u8d28\u91cf\u9a8c\u8bc1\u6570\u636e\u5e76\u8bad\u7ec3\u6a21\u578b\u3002\u57fa\u4e8e\u8be5\u6846\u67b6\u6784\u5efa\u4e86\u7ea6 36.7 \u4e07\u6761\u5df2\u9a8c\u8bc1\u6837\u672c\u7684 FormalVerse \u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3\u51fa MathForm-8B\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u81ea\u52a8\u5f62\u5f0f\u5316\u4ece\u7b80\u5355\u7ffb\u8bd1\u63a8\u8fdb\u5230\u201c\u68c0\u7d22\u5e93\u77e5\u8bc6 + \u53ef\u9a8c\u8bc1\u53cd\u9988\u4fee\u6b63\u201d\u7684\u6570\u636e\u4e0e\u6a21\u578b\u8bad\u7ec3\u6d41\u7a0b\uff0c\u663e\u8457\u63d0\u5347\u5c0f\u89c4\u6a21\u6a21\u578b\u5728 Lean \u6570\u5b66\u5f62\u5f0f\u5316\u4e0a\u7684\u53ef\u9760\u6027\uff0c\u5bf9\u5f62\u5f0f\u5316\u6570\u5b66\u3001\u5b9a\u7406\u8bc1\u660e\u548c\u6570\u5b66\u6570\u636e\u6784\u5efa\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Scaling agent capability has largely focused on improving the model, yet an interactive agent acts through a runtime harness that mediates context, tools, control flow, and stopping. The harness shapes both what a model can accomplish and the trajectories from which it learns. This coupling motivates model-harness co-evolution for recursive self-improvement: build harnesses for a fixed model, update the model from verified sibling trajectories, and rebuild the harnesses as model capabilities change. Realizing this loop requires a controlled way to evolve harnesses while preserving intervention identity and effect. We present HELIX, a source-traceable substrate for harness evolution. HELIX decomposes agent systems into typed ports, reusable atoms, recipes, product shells, and runtime policies. It makes interventions explicit and auditable while retaining trajectories, test outcomes, and provenance. Harness evolution thus serves two linked roles: improving fixed-model execution and producing matched successes, regressions, near misses, and alternative solutions as data for subsequent model improvement. We evaluate HELIX in one evolution round on code repair. A 65-candidate portfolio discovers a fixed harness that improves task coverage by 4.0% over Pi, while the full portfolio exposes up to 58.0% more verified coverage through complementary sibling behavior. Selected candidates are assessed with repeated runs and the SWE-bench evaluator. A 200-slot sibling slice yields 438 verified SFT, critic, filter, and preference records. These results show how harness, model, and data form a feedback system: harness evolution expands current capability and creates learning signal for the next model; model updates motivate the next round of harness evolution. HELIX provides an auditable interface for studying this recursive process. Code is available at https://github.com/HKUDS/HELIX.", "arxiv_id": "2608.13951", "arxiv_url": "https://arxiv.org/abs/2608.13951", "authors": ["Tianyu Fan", "Chao Huang"], "brief": "\u672c\u6587\u63d0\u51fa HELIX\uff0c\u4e00\u79cd\u53ef\u6eaf\u6e90\u7684\u667a\u80fd\u4f53 harness \u6f14\u5316\u6846\u67b6\uff0c\u5c06\u667a\u80fd\u4f53\u7cfb\u7edf\u62c6\u89e3\u4e3a\u7aef\u53e3\u3001\u539f\u5b50\u7ec4\u4ef6\u3001\u914d\u65b9\u3001\u4ea7\u54c1\u58f3\u548c\u8fd0\u884c\u7b56\u7565\u3002\u5b83\u652f\u6301\u5728\u56fa\u5b9a\u6a21\u578b\u4e0b\u6f14\u5316\u6267\u884c\u6846\u67b6\uff0c\u5e76\u7528\u9a8c\u8bc1\u8fc7\u7684\u5144\u5f1f\u8f68\u8ff9\u751f\u6210\u540e\u7eed\u6a21\u578b\u8bad\u7ec3\u6570\u636e\uff0c\u5f62\u6210\u6a21\u578b-harness \u9012\u5f52\u81ea\u6211\u6539\u8fdb\u95ed\u73af\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13951", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u5c06 harness \u5e72\u9884\u663e\u5f0f\u5316\u3001\u7c7b\u578b\u5316\u548c\u53ef\u5ba1\u8ba1\u5316\uff0c\u4fdd\u7559\u8f68\u8ff9\u3001\u6d4b\u8bd5\u7ed3\u679c\u4e0e\u6765\u6e90\u4fe1\u606f\uff0c\u4fbf\u4e8e\u6bd4\u8f83\u4e0d\u540c\u6267\u884c\u7b56\u7565\u7684\u771f\u5b9e\u6548\u679c", "\u5728\u4ee3\u7801\u4fee\u590d\u4efb\u52a1\u4e0a\u4e00\u8f6e\u6f14\u5316\u4e2d\uff0c65 \u4e2a\u5019\u9009 harness \u7ec4\u5408\u4f7f\u56fa\u5b9a harness \u76f8\u6bd4 Pi \u63d0\u5347 4.0% \u4efb\u52a1\u8986\u76d6\u7387", "\u5b8c\u6574\u5019\u9009\u7ec4\u5408\u901a\u8fc7\u4e92\u8865\u5144\u5f1f\u884c\u4e3a\u6700\u591a\u5e26\u6765 58.0% \u989d\u5916\u9a8c\u8bc1\u8986\u76d6\uff0c\u5e76\u751f\u6210 438 \u6761 SFT\u3001critic\u3001filter \u4e0e\u504f\u597d\u8bad\u7ec3\u8bb0\u5f55"], "keywords": ["\u667a\u80fd\u4f53", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb", "\u4ee3\u7801\u4fee\u590d", "\u6570\u636e\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13951v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "HELIX: Model-Harness Co-evolution for Recursive Self-Improvement", "tldr": "\u8ba9\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u534f\u540c\u81ea\u6211\u6539\u8fdb", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa HELIX\uff0c\u4e00\u79cd\u53ef\u6eaf\u6e90\u7684\u667a\u80fd\u4f53 harness \u6f14\u5316\u6846\u67b6\uff0c\u5c06\u667a\u80fd\u4f53\u7cfb\u7edf\u62c6\u89e3\u4e3a\u7aef\u53e3\u3001\u539f\u5b50\u7ec4\u4ef6\u3001\u914d\u65b9\u3001\u4ea7\u54c1\u58f3\u548c\u8fd0\u884c\u7b56\u7565\u3002\u5b83\u652f\u6301\u5728\u56fa\u5b9a\u6a21\u578b\u4e0b\u6f14\u5316\u6267\u884c\u6846\u67b6\uff0c\u5e76\u7528\u9a8c\u8bc1\u8fc7\u7684\u5144\u5f1f\u8f68\u8ff9\u751f\u6210\u540e\u7eed\u6a21\u578b\u8bad\u7ec3\u6570\u636e\uff0c\u5f62\u6210\u6a21\u578b-harness \u9012\u5f52\u81ea\u6211\u6539\u8fdb\u95ed\u73af\u3002", "why_notable": "\u8bba\u6587\u628a\u667a\u80fd\u4f53\u80fd\u529b\u63d0\u5347\u4ece\u5355\u7eaf\u6269\u6a21\u578b\u8f6c\u5411\u201c\u6a21\u578b + \u8fd0\u884c\u6846\u67b6 + \u6570\u636e\u201d\u7684\u534f\u540c\u6f14\u5316\uff0c\u63d0\u4f9b\u4e86\u53ef\u5ba1\u8ba1\u5b9e\u9a8c\u57fa\u5ea7\u6765\u7814\u7a76\u9012\u5f52\u81ea\u6211\u6539\u8fdb\uff0c\u5bf9\u4ee3\u7801\u667a\u80fd\u4f53\u3001\u5de5\u5177\u4f7f\u7528\u667a\u80fd\u4f53\u548c\u81ea\u52a8\u6570\u636e\u751f\u6210\u90fd\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A frozen language model on reasoning tasks has two coupled weaknesses: it under-uses evidence its own residual stream already encodes, and it fails to detect when the input is insufficient to answer, so it confabulates. This paper consolidates two research lines that address these on the same residual stream: a conditional steering probe writes the stream at mid-stack layers and recovers reasoning accuracy from a frozen backbone, and a zero-shot sufficiency direction reads the stream and abstains when information is insufficient. Deployed in one forward pass they interfere: the steering write shifts the state the direction reads, costing up to 8 AUROC points of cross-domain transfer on small models; a separate clean pass doubles inference cost. We keep the direction fixed and train a small network to reconstruct the pre-steering residual from the steered one -- mean-squared error on (steered, clean) pairs, no sufficiency labels -- and read the direction on the reconstruction. The resulting system, YOPO (You Only Pass Once), answers, steers, and abstains in one forward pass of a frozen Qwen2.5 backbone (1.5B/3B/7B). End to end, three-way accuracy more than doubles the frozen baseline (0.375-\u003e0.798 on 1.5B alphaNLI) and one pass beats the two-pass reference at every scale (0.798/0.830/0.893 vs 0.753/0.790/0.863) and on ten backbones across six model families. We chart the capacity-transfer frontier quantifying the principle that abstention should not be trained in; a source-side audit catches our own alphaNLI construction leaking a surface artifact, so architectural claims are anchored on native-label replications (SQuAD2, RepLiQA, MuSiQue); and on the standard four-domain suite we contribute, to our knowledge, the first answer-or-abstain benchmark, where our gate tops every in-domain dataset and the label-free direction is the only gate family to survive domain transfer.", "arxiv_id": "2608.14465", "arxiv_url": "https://arxiv.org/abs/2608.14465", "authors": ["Ziyang Luo", "Zhongyao Chu", "Xinjie He", "Youting Wang", "Xukui Qin", "Runxiong Wu", "Yan-Syuan Chen"], "brief": "\u8bba\u6587\u63d0\u51fa YOPO\uff1a\u5728\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u5c06\u4e2d\u5c42\u6b8b\u5dee\u6d41\u7684\u201c\u5199\u5165\u5f0f\u63a8\u7406\u589e\u5f3a\u201d\u548c\u201c\u8bfb\u53d6\u5f0f\u4fe1\u606f\u5145\u5206\u6027\u5224\u65ad\u201d\u6574\u5408\u5230\u4e00\u6b21\u524d\u5411\u4f20\u64ad\u91cc\u3002\u5b83\u901a\u8fc7\u4e00\u4e2a\u5c0f\u578b\u91cd\u6784\u7f51\u7edc\u4ece\u88ab steering \u6539\u5199\u540e\u7684\u6b8b\u5dee\u4e2d\u6062\u590d\u6539\u5199\u524d\u72b6\u6001\uff0c\u4ece\u800c\u5728\u4e0d\u589e\u52a0\u7b2c\u4e8c\u6b21\u5e72\u51c0\u524d\u5411\u7684\u60c5\u51b5\u4e0b\u5b8c\u6210\u7b54\u9898\u4e0e\u62d2\u7b54\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14465", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0 steering \u5199\u5165\u4f1a\u5e72\u6270 sufficiency direction \u8bfb\u53d6\uff0c\u5bfc\u81f4\u5c0f\u6a21\u578b\u8de8\u57df\u62d2\u7b54 AUROC \u6700\u591a\u4e0b\u964d 8 \u70b9\u3002", "\u8bad\u7ec3\u4e00\u4e2a\u4ec5\u7528\u5747\u65b9\u8bef\u5dee\u7684\u6b8b\u5dee\u91cd\u6784\u7f51\u7edc\uff0c\u65e0\u9700\u5145\u5206\u6027\u6807\u7b7e\uff0c\u5728 steered residual \u4e0a\u6062\u590d pre-steering residual\u3002", "\u5728 Qwen2.5 1.5B/3B/7B \u53ca\u5341\u4e2a\u9aa8\u5e72\u6a21\u578b\u4e0a\uff0c\u5355\u6b21\u524d\u5411\u6027\u80fd\u8d85\u8fc7\u4e24\u6b21\u524d\u5411\u53c2\u8003\uff1b1.5B alphaNLI \u4e09\u5206\u7c7b\u51c6\u786e\u7387\u4ece 0.375 \u63d0\u5347\u5230 0.798\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u62d2\u7b54\u673a\u5236", "\u6a21\u578b\u7f16\u8f91", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14465v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "You Only Pass Once: Answering and Abstaining Together in a Single Forward Pass of a Frozen Language Model", "tldr": "\u51bb\u7ed3\u6a21\u578b\u5355\u6b21\u524d\u5411\u540c\u65f6\u7b54\u9898\u4e0e\u62d2\u7b54", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa YOPO\uff1a\u5728\u51bb\u7ed3\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u5c06\u4e2d\u5c42\u6b8b\u5dee\u6d41\u7684\u201c\u5199\u5165\u5f0f\u63a8\u7406\u589e\u5f3a\u201d\u548c\u201c\u8bfb\u53d6\u5f0f\u4fe1\u606f\u5145\u5206\u6027\u5224\u65ad\u201d\u6574\u5408\u5230\u4e00\u6b21\u524d\u5411\u4f20\u64ad\u91cc\u3002\u5b83\u901a\u8fc7\u4e00\u4e2a\u5c0f\u578b\u91cd\u6784\u7f51\u7edc\u4ece\u88ab steering \u6539\u5199\u540e\u7684\u6b8b\u5dee\u4e2d\u6062\u590d\u6539\u5199\u524d\u72b6\u6001\uff0c\u4ece\u800c\u5728\u4e0d\u589e\u52a0\u7b2c\u4e8c\u6b21\u5e72\u51c0\u524d\u5411\u7684\u60c5\u51b5\u4e0b\u5b8c\u6210\u7b54\u9898\u4e0e\u62d2\u7b54\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u63a8\u7406\u589e\u5f3a\u4e0e\u4e0d\u786e\u5b9a\u65f6\u62d2\u7b54\u7edf\u4e00\u5230\u51bb\u7ed3\u6a21\u578b\u7684\u4e00\u6b21\u63a8\u7406\u4e2d\uff0c\u663e\u8457\u964d\u4f4e\u63a8\u7406\u6210\u672c\uff0c\u5e76\u5f3a\u8c03\u62d2\u7b54\u80fd\u529b\u4e0d\u5e94\u4f9d\u8d56\u4efb\u52a1\u6807\u7b7e\u8bad\u7ec3\uff1b\u5176\u8de8\u57df\u5b9e\u9a8c\u548c\u65b0 answer-or-abstain benchmark \u5bf9\u53ef\u9760\u95ee\u7b54\u7cfb\u7edf\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) post-training provides a direct way to align diffusion models with human preferences and task-specific rewards. However, current RL algorithms for diffusion models remain fragmented: reverse-trajectory methods rely on discretized likelihood ratios, whereas forward-matching methods train on reward-labeled noising versions of the rollout samples. This paper shows that these seemingly different losses arise from a single path-space principle. Starting from the regularized diffusion-RL objective, we use importance sampling between sampling SDEs to obtain an explicit policy-gradient estimator on trajectory space. The estimator contains the stochastic It\u00f4 integral underlying Flow-GRPO-type updates; we derive an equivalent variance-reduced value-gradient form that recovers the forward-matching structure of AWM and DiffusionNFT. This identifies the empirical gap between these method families as a variance-reduction effect rather than a difference in RL principle. The derivation yields a unified design space organized by value-gradient estimation, weight functions, and sampling choices. Within this space, we propose a multi-sample KDE value-gradient estimator that reuses rollout groups, together with scale-bounded weight families that retain stable existing recipes while excluding singular ones. Experiments on SD3.5-M and Qwen-Image models validate the variance-reduction explanation and show that the resulting recipe improves over prior diffusion-RL baselines.", "arxiv_id": "2608.14430", "arxiv_url": "https://arxiv.org/abs/2608.14430", "authors": ["Yixian Xu", "Yuanrui Zhang", "Shengjie Luo", "Liwei Wang", "Di He"], "brief": "\u8bba\u6587\u4ece\u8def\u5f84\u7a7a\u95f4\u89c6\u89d2\u91cd\u65b0\u63a8\u5bfc\u6269\u6563\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u76ee\u6807\uff0c\u8bc1\u660e\u53cd\u5411\u8f68\u8ff9\u7c7b\u65b9\u6cd5\u4e0e\u524d\u5411\u5339\u914d\u7c7b\u65b9\u6cd5\u6e90\u4e8e\u540c\u4e00\u6b63\u5219\u5316\u6269\u6563-RL\u539f\u5219\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u65b9\u5dee\u66f4\u4f4e\u7684\u4ef7\u503c\u68af\u5ea6\u4f30\u8ba1\u4e0e\u7a33\u5b9a\u6743\u91cd\u8bbe\u8ba1\uff0c\u5e76\u5728\u4e3b\u6d41\u56fe\u50cf\u6269\u6563\u6a21\u578b\u4e0a\u9a8c\u8bc1\u6539\u8fdb\u3002", "categories": ["cs.LG", "cs.CV", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14430", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u7528\u91c7\u6837 SDE \u95f4\u7684\u91cd\u8981\u6027\u91c7\u6837\u63a8\u5bfc\u8f68\u8ff9\u7a7a\u95f4\u4e0a\u7684\u663e\u5f0f\u7b56\u7565\u68af\u5ea6\u4f30\u8ba1\uff0c\u8fde\u63a5 Flow-GRPO\u3001AWM\u3001DiffusionNFT \u7b49\u65b9\u6cd5\u3002", "\u6307\u51fa\u4e0d\u540c\u65b9\u6cd5\u65cf\u7684\u7ecf\u9a8c\u5dee\u8ddd\u4e3b\u8981\u6765\u81ea\u65b9\u5dee\u7f29\u51cf\u6548\u679c\uff0c\u800c\u975e\u5f3a\u5316\u5b66\u4e60\u539f\u7406\u5dee\u5f02\u3002", "\u63d0\u51fa\u591a\u6837\u672c KDE \u4ef7\u503c\u68af\u5ea6\u4f30\u8ba1\u5668\u4e0e\u5c3a\u5ea6\u6709\u754c\u6743\u91cd\u65cf\uff0c\u5728 SD3.5-M \u548c Qwen-Image \u4e0a\u4f18\u4e8e\u65e2\u6709\u6269\u6563-RL \u57fa\u7ebf\u3002"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u7b56\u7565\u68af\u5ea6", "\u56fe\u50cf\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14430v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Designing Reinforcement Learning for Diffusion Models: A Unified Path-Space View", "tldr": "\u7edf\u4e00\u6269\u6563\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u4ece\u8def\u5f84\u7a7a\u95f4\u89c6\u89d2\u91cd\u65b0\u63a8\u5bfc\u6269\u6563\u6a21\u578b\u7684\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u76ee\u6807\uff0c\u8bc1\u660e\u53cd\u5411\u8f68\u8ff9\u7c7b\u65b9\u6cd5\u4e0e\u524d\u5411\u5339\u914d\u7c7b\u65b9\u6cd5\u6e90\u4e8e\u540c\u4e00\u6b63\u5219\u5316\u6269\u6563-RL\u539f\u5219\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u63d0\u51fa\u65b9\u5dee\u66f4\u4f4e\u7684\u4ef7\u503c\u68af\u5ea6\u4f30\u8ba1\u4e0e\u7a33\u5b9a\u6743\u91cd\u8bbe\u8ba1\uff0c\u5e76\u5728\u4e3b\u6d41\u56fe\u50cf\u6269\u6563\u6a21\u578b\u4e0a\u9a8c\u8bc1\u6539\u8fdb\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u6269\u6563\u6a21\u578b\u57fa\u4e8e\u5956\u52b1\u548c\u4eba\u7c7b\u504f\u597d\u7684\u540e\u8bad\u7ec3\u63d0\u4f9b\u7edf\u4e00\u7406\u8bba\u6846\u67b6\uff0c\u6709\u52a9\u4e8e\u89e3\u91ca\u73b0\u6709\u7b97\u6cd5\u5dee\u5f02\u5e76\u6307\u5bfc\u66f4\u7a33\u5b9a\u3001\u66f4\u9ad8\u6548\u7684 RL \u5fae\u8c03\u65b9\u6cd5\u8bbe\u8ba1\u3002"}, {"abstract": "Power Sampling sharpens a language model\u0027s distribution over complete generation trajectories, offering a verifier-free way to improve reasoning at inference time. It also has the potential to serve as a general-purpose front end for a broad range of downstream sampling methods. However, we uncover a striking paradox: Power Sampling can drive more probability mass toward correct trajectories while degrading the downstream inference it is intended to enhance. Using self-consistency as a representative case, we observe accuracy drops of up to 18.5 percentage points across models and reasoning benchmarks. We trace this paradox to two mismatches. Dose mismatch arises because a fixed exponent induces drastically different amounts of distributional change across problems. Coverage mismatch arises because global sharpening concentrates mass on a narrow set of dominant paths: high pass@k, often interpreted as evidence of preserved diversity, can therefore coexist with the loss of broad reasoning-path support required for downstream aggregation, search, and selection. Guided by this diagnosis, we replace uniform trajectory exponentiation with a deformation-controlled, support-preserving Power target that calibrates sharpening across problems while limiting the suppression of moderate-probability paths. In a same-budget instantiation with weighted self-consistency, the repaired sampler reverses the losses caused by global Power and outperforms standard multi-sample inference across reasoning benchmarks.", "arxiv_id": "2608.14420", "arxiv_url": "https://arxiv.org/abs/2608.14420", "authors": ["Haohui Yang", "Jiaxing Sun", "Xiujun Ma"], "brief": "\u8bba\u6587\u63ed\u793a\u4e86\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u4e2dPower Sampling\u7684\u53cd\u76f4\u89c9\u5931\u6548\uff1a\u5b83\u867d\u628a\u66f4\u591a\u6982\u7387\u8d28\u91cf\u63a8\u5411\u6b63\u786e\u8f68\u8ff9\uff0c\u5374\u53ef\u80fd\u964d\u4f4e\u81ea\u4e00\u81f4\u6027\u7b49\u4e0b\u6e38\u63a8\u7406\u51c6\u786e\u7387\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u53d7\u63a7\u53d8\u5f62\u3001\u4fdd\u7559\u652f\u6301\u96c6\u7684Power\u76ee\u6807\uff0c\u4ee5\u6821\u51c6\u4e0d\u540c\u95ee\u9898\u4e0a\u7684\u9510\u5316\u5f3a\u5ea6\u5e76\u907f\u514d\u8fc7\u5ea6\u538b\u5236\u4e2d\u7b49\u6982\u7387\u63a8\u7406\u8def\u5f84\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14420", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5728\u591a\u4e2a\u6a21\u578b\u548c\u63a8\u7406\u57fa\u51c6\u4e0a\uff0cPower Sampling\u7ed3\u5408\u81ea\u4e00\u81f4\u6027\u6700\u9ad8\u5bfc\u81f418.5\u4e2a\u767e\u5206\u70b9\u51c6\u786e\u7387\u4e0b\u964d\u3002", "\u5931\u6548\u6765\u81ea\u4e24\u7c7b\u4e0d\u5339\u914d\uff1a\u56fa\u5b9a\u6307\u6570\u5728\u4e0d\u540c\u95ee\u9898\u4e0a\u9020\u6210\u4e0d\u540c\u201c\u5242\u91cf\u201d\u7684\u5206\u5e03\u53d8\u5316\uff1b\u5168\u5c40\u9510\u5316\u4f7f\u6982\u7387\u96c6\u4e2d\u5230\u5c11\u6570\u4e3b\u5bfc\u8def\u5f84\uff0c\u7834\u574f\u4e0b\u6e38\u805a\u5408\u6240\u9700\u7684\u5e7f\u6cdb\u8def\u5f84\u8986\u76d6\u3002", "\u6539\u8fdb\u65b9\u6cd5\u5728\u76f8\u540c\u91c7\u6837\u9884\u7b97\u4e0b\u7ed3\u5408\u52a0\u6743\u81ea\u4e00\u81f4\u6027\uff0c\u9006\u8f6c\u5168\u5c40Power\u5e26\u6765\u7684\u635f\u5931\uff0c\u5e76\u4f18\u4e8e\u6807\u51c6\u591a\u6837\u672c\u63a8\u7406\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u589e\u5f3a", "\u91c7\u6837\u65b9\u6cd5", "\u81ea\u4e00\u81f4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14420v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "More Correct Mass, Worse Answers: Why Power Sampling Can Fail and How to Fix It", "tldr": "\u4fee\u590dPower Sampling\u63a8\u7406\u9000\u5316\u6096\u8bba", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63ed\u793a\u4e86\u8bed\u8a00\u6a21\u578b\u63a8\u7406\u4e2dPower Sampling\u7684\u53cd\u76f4\u89c9\u5931\u6548\uff1a\u5b83\u867d\u628a\u66f4\u591a\u6982\u7387\u8d28\u91cf\u63a8\u5411\u6b63\u786e\u8f68\u8ff9\uff0c\u5374\u53ef\u80fd\u964d\u4f4e\u81ea\u4e00\u81f4\u6027\u7b49\u4e0b\u6e38\u63a8\u7406\u51c6\u786e\u7387\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u53d7\u63a7\u53d8\u5f62\u3001\u4fdd\u7559\u652f\u6301\u96c6\u7684Power\u76ee\u6807\uff0c\u4ee5\u6821\u51c6\u4e0d\u540c\u95ee\u9898\u4e0a\u7684\u9510\u5316\u5f3a\u5ea6\u5e76\u907f\u514d\u8fc7\u5ea6\u538b\u5236\u4e2d\u7b49\u6982\u7387\u63a8\u7406\u8def\u5f84\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u4e00\u79cd\u770b\u4f3c\u901a\u7528\u7684\u514d\u9a8c\u8bc1\u63a8\u7406\u589e\u5f3a\u65b9\u6cd5\u5b58\u5728\u7cfb\u7edf\u6027\u98ce\u9669\uff0c\u5e76\u7ed9\u51fa\u53ef\u843d\u5730\u4fee\u590d\u65b9\u6848\uff0c\u5bf9LLM\u63a8\u7406\u65f6\u91c7\u6837\u3001\u641c\u7d22\u548c\u81ea\u4e00\u81f4\u6027\u805a\u5408\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "The key-value (KV) cache stores information from past tokens and is a major memory bottleneck in long-context inference. Existing quantization methods address this bottleneck by representing the KV cache uniformly with lower-precision data types and designing quantization schemes to minimize reconstruction error in the cache itself, without accounting for how that error propagates through attention mechanisms. We prove that, under a white-noise quantization model, the expected attention-aware distortion decomposes into additive key and value contributions that factor across tokens and channels. Building on transform coding and reverse water-filling, which are classical tools from signal processing and rate-distortion theory, we introduce Attention-Aware Transform Coding (AATC), which allocates bits over a calibration set to minimize attention-aware distortion. On Llama-3.1-8B-Instruct and Qwen-2.5-7B-Instruct, evaluated across LongBench, RULER, GSM8K, MMLU-Pro, and MATH-500, our method achieves near-lossless accuracy at approximately $5.8\\times$ compression, whereas each baseline degrades in at least some settings.", "arxiv_id": "2608.14191", "arxiv_url": "https://arxiv.org/abs/2608.14191", "authors": ["Hannah Laus", "Claudio Mayrink Verdun", "Hao Wang", "Flavio du Pin Calmon", "Felix Krahmer"], "brief": "\u672c\u6587\u4ece\u53d8\u6362\u7f16\u7801\u89c6\u89d2\u91cd\u65b0\u5efa\u6a21\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u7684KV\u7f13\u5b58\u538b\u7f29\uff0c\u63d0\u51fa Attention-Aware Transform Coding\uff08AATC\uff09\u3002\u5b83\u6839\u636e\u91cf\u5316\u8bef\u5dee\u5728\u6ce8\u610f\u529b\u673a\u5236\u4e2d\u7684\u4f20\u64ad\u6765\u5206\u914d\u6bd4\u7279\uff0c\u800c\u4e0d\u662f\u53ea\u6700\u5c0f\u5316\u7f13\u5b58\u91cd\u5efa\u8bef\u5dee\u3002", "categories": ["cs.LG", "cs.CL", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14191", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8bc1\u660e\u5728\u767d\u566a\u58f0\u91cf\u5316\u6a21\u578b\u4e0b\uff0c\u6ce8\u610f\u529b\u611f\u77e5\u5931\u771f\u53ef\u5206\u89e3\u4e3a\u952e\u548c\u503c\u7684\u53ef\u52a0\u8d21\u732e\uff0c\u5e76\u80fd\u6309token\u4e0e\u901a\u9053\u56e0\u5b50\u5316\u3002", "\u501f\u9274\u4fe1\u53f7\u5904\u7406\u4e2d\u7684\u53d8\u6362\u7f16\u7801\u4e0e\u53cd\u5411\u6ce8\u6c34\uff0c\u5728\u6821\u51c6\u96c6\u4e0a\u81ea\u9002\u5e94\u5206\u914d\u91cf\u5316\u6bd4\u7279\u4ee5\u6700\u5c0f\u5316\u6ce8\u610f\u529b\u5931\u771f\u3002", "\u5728 Llama-3.1-8B-Instruct \u4e0e Qwen-2.5-7B-Instruct \u4e0a\uff0c\u8986\u76d6 LongBench\u3001RULER\u3001GSM8K\u3001MMLU-Pro\u3001MATH-500\uff0c\u5b9e\u73b0\u7ea65.8\u500d\u538b\u7f29\u4e14\u7cbe\u5ea6\u8fd1\u4e4e\u65e0\u635f\u3002"], "keywords": ["KV\u7f13\u5b58", "\u6a21\u578b\u538b\u7f29", "\u957f\u4e0a\u4e0b\u6587", "\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14191v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "KV Cache Compression Through the Lens of Transform Coding", "tldr": "\u7528\u6ce8\u610f\u529b\u611f\u77e5\u53d8\u6362\u7f16\u7801\u538b\u7f29KV\u7f13\u5b58\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u4ece\u53d8\u6362\u7f16\u7801\u89c6\u89d2\u91cd\u65b0\u5efa\u6a21\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u7684KV\u7f13\u5b58\u538b\u7f29\uff0c\u63d0\u51fa Attention-Aware Transform Coding\uff08AATC\uff09\u3002\u5b83\u6839\u636e\u91cf\u5316\u8bef\u5dee\u5728\u6ce8\u610f\u529b\u673a\u5236\u4e2d\u7684\u4f20\u64ad\u6765\u5206\u914d\u6bd4\u7279\uff0c\u800c\u4e0d\u662f\u53ea\u6700\u5c0f\u5316\u7f13\u5b58\u91cd\u5efa\u8bef\u5dee\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aKV\u7f13\u5b58\u538b\u7f29\u4ece\u201c\u5747\u5300\u4f4e\u7cbe\u5ea6\u8868\u793a\u201d\u63a8\u8fdb\u5230\u201c\u9762\u5411\u6ce8\u610f\u529b\u8f93\u51fa\u7684\u7387\u5931\u771f\u4f18\u5316\u201d\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4e2d\u517c\u987e\u663e\u5b58\u8282\u7701\u4e0e\u7a33\u5b9a\u7cbe\u5ea6\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning (RL) for terminal agents needs executable training environments with reliable rewards and useful difficulty. Fixed recipes such as few-shot, Self-Instruct, and Evol-Instruct apply the same prompting policy to every seed, even when the current policy would benefit from a harder, easier, or simply different task. We present Envs-FORGE, a prompting policy that converts verifier rewards into per-seed environment-synthesis actions. Envs-FORGE estimates seed pass rates, scores six projection--direction actions around a target learning frontier, and solves a per-seed mixed-integer linear program (MILP) to choose the action that conditions generation. The selected action drives synchronized rewriting of the instruction, fixtures, oracle solution, tests, and Docker environment; only gold-verified bundles enter RL training. The indexed MILP form also supports optional soft skill coverage for portfolio planning. On Qwen 3.5 35B, Envs-FORGE improves Pass@1 over Base by 9.2 percentage points on tb-core (40.0% to 49.2%) and 6.4 points on tb-2.0 (23.0% to 29.4%), exceeding the strongest fixed-recipe baseline by 2.4 and 2.1 points. It reaches 77.1% on SWE-bench Verified versus 73.4% for Base, and improves tb-core by 6.8--9.2 points across the evaluated 4B--35B models. All synthesis methods export 100 verified environments and use 2.27M--2.88M synthesis tokens, placing the comparison at the same downstream training-set size and the same operational scale. The source code is available at https://github.com/DataArcTech/DataArc-SynData-Toolkit/.", "arxiv_id": "2608.14312", "arxiv_url": "https://arxiv.org/abs/2608.14312", "authors": ["Xiaojun Wu", "Cehao Yang", "Honghao Liu", "Xueyuan Lin", "Zhichao Shi", "Hao Zhou", "Xuhui Jiang", "Chengjin Xu", "Jia Li", "Jian Guo"], "brief": "\u8bba\u6587\u63d0\u51fa Envs-FORGE\uff0c\u4e00\u79cd\u9762\u5411\u7ec8\u7aef\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u73af\u5883\u5408\u6210\u7b56\u7565\u3002\u5b83\u5c06\u9a8c\u8bc1\u5668\u5956\u52b1\u8f6c\u5316\u4e3a\u6bcf\u4e2a\u79cd\u5b50\u7684\u73af\u5883\u6539\u5199\u52a8\u4f5c\uff0c\u81ea\u9002\u5e94\u751f\u6210\u96be\u5ea6\u5408\u9002\u3001\u5956\u52b1\u53ef\u9760\u7684\u53ef\u6267\u884c\u8bad\u7ec3\u73af\u5883\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14312", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u6839\u636e\u79cd\u5b50\u901a\u8fc7\u7387\u4f30\u8ba1\u5b66\u4e60\u524d\u6cbf\uff0c\u8bc4\u4f30\u516d\u7c7b\u6295\u5f71-\u65b9\u5411\u52a8\u4f5c\uff0c\u5e76\u7528\u9010\u79cd\u5b50\u6df7\u5408\u6574\u6570\u7ebf\u6027\u89c4\u5212\u9009\u62e9\u6700\u5408\u9002\u7684\u751f\u6210\u6761\u4ef6\u3002", "\u540c\u6b65\u6539\u5199\u6307\u4ee4\u3001fixtures\u3001oracle \u89e3\u6cd5\u3001\u6d4b\u8bd5\u4e0e Docker \u73af\u5883\uff0c\u4ec5\u5c06\u901a\u8fc7 gold verification \u7684\u73af\u5883\u7eb3\u5165 RL \u8bad\u7ec3\u3002", "\u5728 Qwen 3.5 35B \u4e0a\uff0ctb-core Pass@1 \u4ece 40.0% \u63d0\u5347\u5230 49.2%\uff0ctb-2.0 \u4ece 23.0% \u63d0\u5347\u5230 29.4%\uff0c\u5e76\u5728 SWE-bench Verified \u8fbe\u5230 77.1%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u73af\u5883\u5408\u6210", "\u4ee3\u7801\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14312v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Envs-FORGE: Frontier-Optimized Reward-Grounded Environment Synthesis for Agent RL", "tldr": "\u7528\u5956\u52b1\u53cd\u9988\u81ea\u9002\u5e94\u5408\u6210\u667a\u80fd\u4f53RL\u73af\u5883\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Envs-FORGE\uff0c\u4e00\u79cd\u9762\u5411\u7ec8\u7aef\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u73af\u5883\u5408\u6210\u7b56\u7565\u3002\u5b83\u5c06\u9a8c\u8bc1\u5668\u5956\u52b1\u8f6c\u5316\u4e3a\u6bcf\u4e2a\u79cd\u5b50\u7684\u73af\u5883\u6539\u5199\u52a8\u4f5c\uff0c\u81ea\u9002\u5e94\u751f\u6210\u96be\u5ea6\u5408\u9002\u3001\u5956\u52b1\u53ef\u9760\u7684\u53ef\u6267\u884c\u8bad\u7ec3\u73af\u5883\u3002", "why_notable": "\u76f8\u6bd4 few-shot\u3001Self-Instruct\u3001Evol-Instruct \u7b49\u56fa\u5b9a\u751f\u6210\u914d\u65b9\uff0cEnvs-FORGE \u80fd\u6309\u5f53\u524d\u7b56\u7565\u80fd\u529b\u4e3a\u4e0d\u540c\u79cd\u5b50\u9009\u62e9\u66f4\u96be\u3001\u66f4\u6613\u6216\u4e0d\u540c\u7684\u4efb\u52a1\uff0c\u4ece\u800c\u5728\u76f8\u540c\u8bad\u7ec3\u96c6\u89c4\u6a21\u548c\u76f8\u8fd1\u5408\u6210\u6210\u672c\u4e0b\u5e26\u6765\u7a33\u5b9a\u63d0\u5347\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u667a\u80fd\u4f53\u8bad\u7ec3\u6570\u636e\u6784\u5efa\u4ef7\u503c\u3002"}, {"abstract": "Popular facts are memorised more deeply during pretraining and resist removal longer than rare ones, yet existing LLM unlearning methods apply uniform gradient pressure regardless of training-data frequency. We propose the AdaPop (Adaptive Popularity) method, which combines local token confidence with a per-fact popularity-dependent exponent derived from an external proxy (e.g., Wikidata sitelinks, LLM-as-Judge), and automates the forget-retain balance via a dual-ascent controller that adjusts the retain penalty each epoch. Across three model families and two benchmarks, AdaPop leaks ~5x less forgotten content than competing methods under paraphrased queries and ~1.6x less under adversarial reformulations. We support our analysis with internal metrics: under our method, forget-set hidden states move further from the pre-unlearning model\u0027s states than under other methods, while retain-set representations remain close.", "arxiv_id": "2608.14229", "arxiv_url": "https://arxiv.org/abs/2608.14229", "authors": ["Anna Borisiuk", "Andrey Savchenko", "Alexander Panchenko", "Elena Tutubalina"], "brief": "\u8bba\u6587\u63d0\u51fa AdaPop\uff0c\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u53cd\u5b66\u4e60\u7684\u81ea\u9002\u5e94\u65b9\u6cd5\uff1a\u6839\u636e\u4e8b\u5b9e\u6d41\u884c\u5ea6\u4e0e\u5c40\u90e8 token \u7f6e\u4fe1\u5ea6\u52a8\u6001\u8c03\u8282\u9057\u5fd8\u5f3a\u5ea6\uff0c\u5e76\u7528\u53cc\u4e0a\u5347\u63a7\u5236\u5668\u81ea\u52a8\u5e73\u8861\u9057\u5fd8\u4e0e\u4fdd\u7559\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u80fd\u66f4\u6709\u6548\u79fb\u9664\u9ad8\u6d41\u884c\u5ea6\u3001\u96be\u9057\u5fd8\u4e8b\u5b9e\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u4fdd\u7559\u96c6\u8868\u793a\u7a33\u5b9a\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14229", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u6d41\u884c\u4e8b\u5b9e\u5728\u9884\u8bad\u7ec3\u4e2d\u8bb0\u5fc6\u66f4\u6df1\uff0c\u73b0\u6709\u7edf\u4e00\u68af\u5ea6\u538b\u529b\u7684 unlearning \u65b9\u6cd5\u5bf9\u4e0d\u540c\u9891\u7387\u4e8b\u5b9e\u5904\u7406\u4e0d\u8db3\u3002", "\u5f15\u5165\u5916\u90e8\u6d41\u884c\u5ea6\u4ee3\u7406\u4fe1\u53f7\uff0c\u5982 Wikidata sitelinks \u6216 LLM-as-Judge\uff0c\u5e76\u7ed3\u5408 token \u7f6e\u4fe1\u5ea6\u5f62\u6210\u9010\u4e8b\u5b9e\u81ea\u9002\u5e94\u9057\u5fd8\u6743\u91cd\u3002", "\u5728\u4e09\u4e2a\u6a21\u578b\u5bb6\u65cf\u3001\u4e24\u4e2a\u57fa\u51c6\u4e0a\uff0c\u9762\u5bf9\u6539\u5199\u67e5\u8be2\u6cc4\u9732\u7ea6\u51cf\u5c11 5 \u500d\uff0c\u9762\u5bf9\u5bf9\u6297\u5f0f\u91cd\u8ff0\u6cc4\u9732\u7ea6\u51cf\u5c11 1.6 \u500d\u3002"], "keywords": ["\u6a21\u578b\u9057\u5fd8", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9690\u79c1\u5b89\u5168", "\u77e5\u8bc6\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14229v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The More Popular, The Harder to Forget: Adaptive Popularity for LLM Unlearning", "tldr": "AdaPop\u6309\u4e8b\u5b9e\u6d41\u884c\u5ea6\u81ea\u9002\u5e94\u589e\u5f3aLLM\u9057\u5fd8\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AdaPop\uff0c\u4e00\u79cd\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u53cd\u5b66\u4e60\u7684\u81ea\u9002\u5e94\u65b9\u6cd5\uff1a\u6839\u636e\u4e8b\u5b9e\u6d41\u884c\u5ea6\u4e0e\u5c40\u90e8 token \u7f6e\u4fe1\u5ea6\u52a8\u6001\u8c03\u8282\u9057\u5fd8\u5f3a\u5ea6\uff0c\u5e76\u7528\u53cc\u4e0a\u5347\u63a7\u5236\u5668\u81ea\u52a8\u5e73\u8861\u9057\u5fd8\u4e0e\u4fdd\u7559\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u80fd\u66f4\u6709\u6548\u79fb\u9664\u9ad8\u6d41\u884c\u5ea6\u3001\u96be\u9057\u5fd8\u4e8b\u5b9e\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u4fdd\u7559\u96c6\u8868\u793a\u7a33\u5b9a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u4e8b\u5b9e\u6d41\u884c\u5ea6\u201d\u663e\u5f0f\u7eb3\u5165 LLM \u9057\u5fd8\u8fc7\u7a0b\uff0c\u9488\u5bf9\u6700\u96be\u5220\u9664\u7684\u9ad8\u9891\u77e5\u8bc6\u63d0\u4f9b\u66f4\u5f3a\u63a7\u5236\uff0c\u5bf9\u9690\u79c1\u5220\u9664\u3001\u7248\u6743\u5185\u5bb9\u79fb\u9664\u548c\u5408\u89c4\u5316\u6a21\u578b\u66f4\u65b0\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Spatial perception and reasoning from visual observations require recovering geometric structure, establishing correspondences, and understanding spatial relations. Existing approaches typically address these capabilities separately using task-specific architectures or external geometric modules, limiting knowledge transfer among complementary representations of the same physical scene. We introduce SPARGen, a unified multimodal framework that casts 3D reconstruction, dense correspondence, and spatial reasoning as instruction-conditioned generation tasks. SPARGen serializes compact structured and linguistic outputs as token sequences while generating dense geometric fields in image-aligned forms, enabling spatial supervision to jointly shape shared representations within a native multimodal generative model. Experiments across benchmarks for 3D reconstruction, correspondence, and spatial reasoning show that SPARGen achieves competitive performance across heterogeneous spatial tasks within a single native multimodal generative framework.", "arxiv_id": "2608.14138", "arxiv_url": "https://arxiv.org/abs/2608.14138", "authors": ["Jinsheng Quan", "Jianhua Li", "Siyi Xie", "Xuanke Shi", "Kewang Deng", "Zukai Chen", "Feifei Shao", "Lei Yang", "Quan Wang", "Yawei Luo"], "brief": "SPARGen \u5c06 3D \u91cd\u5efa\u3001\u7a20\u5bc6\u5bf9\u5e94\u548c\u7a7a\u95f4\u63a8\u7406\u7edf\u4e00\u8868\u8ff0\u4e3a\u6307\u4ee4\u6761\u4ef6\u751f\u6210\u4efb\u52a1\u3002\u5b83\u5728\u539f\u751f\u591a\u6a21\u6001\u751f\u6210\u6a21\u578b\u4e2d\u540c\u65f6\u751f\u6210\u7ed3\u6784\u5316/\u8bed\u8a00 token \u4e0e\u56fe\u50cf\u5bf9\u9f50\u7684\u7a20\u5bc6\u51e0\u4f55\u573a\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14138", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u7528\u7edf\u4e00\u591a\u6a21\u6001\u6846\u67b6\u66ff\u4ee3\u4efb\u52a1\u4e13\u7528\u67b6\u6784\u6216\u5916\u90e8\u51e0\u4f55\u6a21\u5757\uff0c\u4fc3\u8fdb\u7a7a\u95f4\u8868\u5f81\u5171\u4eab", "\u5c06\u7d27\u51d1\u7ed3\u6784\u5316\u8f93\u51fa\u548c\u8bed\u8a00\u8f93\u51fa\u5e8f\u5217\u5316\u4e3a token\uff0c\u540c\u65f6\u4ee5\u56fe\u50cf\u5bf9\u9f50\u5f62\u5f0f\u751f\u6210\u7a20\u5bc6\u51e0\u4f55\u573a", "\u5728 3D \u91cd\u5efa\u3001\u5bf9\u5e94\u5173\u7cfb\u548c\u7a7a\u95f4\u63a8\u7406\u591a\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u6027\u80fd"], "keywords": ["\u591a\u6a21\u6001", "3D\u91cd\u5efa", "\u7a7a\u95f4\u63a8\u7406", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14138v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14138.png", "title": "SPARGen: Unifying Spatial Perception and Reasoning through Native Multimodal Generation", "tldr": "\u7edf\u4e00\u751f\u6210\u5f0f\u6a21\u578b\u5904\u7406\u591a\u7c7b\u7a7a\u95f4\u4efb\u52a1", "upvotes": 0, "what_it_is": "SPARGen \u5c06 3D \u91cd\u5efa\u3001\u7a20\u5bc6\u5bf9\u5e94\u548c\u7a7a\u95f4\u63a8\u7406\u7edf\u4e00\u8868\u8ff0\u4e3a\u6307\u4ee4\u6761\u4ef6\u751f\u6210\u4efb\u52a1\u3002\u5b83\u5728\u539f\u751f\u591a\u6a21\u6001\u751f\u6210\u6a21\u578b\u4e2d\u540c\u65f6\u751f\u6210\u7ed3\u6784\u5316/\u8bed\u8a00 token \u4e0e\u56fe\u50cf\u5bf9\u9f50\u7684\u7a20\u5bc6\u51e0\u4f55\u573a\u3002", "why_notable": "\u8bba\u6587\u5c55\u793a\u4e86\u7a7a\u95f4\u611f\u77e5\u4e0e\u63a8\u7406\u53ef\u88ab\u7eb3\u5165\u539f\u751f\u591a\u6a21\u6001\u751f\u6210\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u51cf\u5c11\u5206\u6563\u5f0f\u51e0\u4f55\u7cfb\u7edf\u8bbe\u8ba1\uff0c\u5e76\u63d0\u5347\u4e0d\u540c\u7a7a\u95f4\u4efb\u52a1\u95f4\u7684\u77e5\u8bc6\u8fc1\u79fb\u3002"}, {"abstract": "Scientific figures and tables encode essential experimental evidence, yet remain difficult for digital libraries and multimodal AI systems to retrieve and interpret. The ALD/E-ImageMiner benchmark and ICDAR 2026 Competition on Information Extraction from Atomic Layer Deposition/Etching Scientific Figures provide 1,951 figures from 205 publications, expert-annotated for classification, data table extraction, summarization, and visual question answering. In these companion proceedings, we present a forward-looking perspective on how the benchmark can guide future scientific-image challenges. We examine how its tasks probe capabilities from visual and quantitative reading to domain-grounded reasoning and evidential justification, and how Bloom-informed question design can support deeper scientific understanding. We propose \"scientific conceptual understanding from images\" as a long-term benchmark objective, with future directions including broader domains and figure types, contextual and cross-document synthesis, hypothesis evaluation, provenance, uncertainty, counterfactual grounding, and open-ended multimodal research. This perspective connects the ICDAR 2026 challenge to a broader agenda for machine-actionable scientific visual knowledge and verifiable multimodal scientific AI.", "arxiv_id": "2608.14075", "arxiv_url": "https://arxiv.org/abs/2608.14075", "authors": ["Jennifer D\u0027Souza", "Fahad Ahmed", "Cecilia Andrea Bustamante Andrade", "Lina Frolova", "Poorani Gnanasambandan", "Dilshad Hussain", "Muhammad Uzair Khan", "Nkembeng Kevin Nkengfoa", "Paul Praveen J.", "Fabio Priante", "Sjoerd Franciscus van der Werf", "Thomas Frederik Jan van Roeden"], "brief": "\u8bba\u6587\u56f4\u7ed5 ALD/E-ImageMiner \u57fa\u51c6\u4e0e ICDAR 2026 \u539f\u5b50\u5c42\u6c89\u79ef/\u523b\u8680\u79d1\u7814\u56fe\u50cf\u4fe1\u606f\u62bd\u53d6\u7ade\u8d5b\uff0c\u8ba8\u8bba\u5982\u4f55\u7528\u79d1\u5b66\u56fe\u8868\u63a8\u52a8\u591a\u6a21\u6001\u79d1\u7814 AI \u80fd\u529b\u8bc4\u6d4b\u3002\u5176\u76ee\u6807\u4ece\u56fe\u50cf\u5206\u7c7b\u3001\u8868\u683c\u62bd\u53d6\u3001\u6458\u8981\u548c\u95ee\u7b54\u6269\u5c55\u5230\u53ef\u9a8c\u8bc1\u7684\u79d1\u5b66\u6982\u5ff5\u7406\u89e3\u3002", "categories": ["cs.AI", "cs.CV", "cs.DL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14075", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u5305\u542b\u6765\u81ea 205 \u7bc7\u8bba\u6587\u7684 1,951 \u5f20\u79d1\u7814\u56fe\u8868\uff0c\u5e76\u7531\u4e13\u5bb6\u6807\u6ce8\u5206\u7c7b\u3001\u6570\u636e\u8868\u62bd\u53d6\u3001\u6458\u8981\u548c\u89c6\u89c9\u95ee\u7b54\u4efb\u52a1", "\u5f3a\u8c03\u8bc4\u6d4b\u80fd\u529b\u4e0d\u4ec5\u5305\u62ec\u89c6\u89c9\u8bfb\u53d6\u548c\u5b9a\u91cf\u4fe1\u606f\u62bd\u53d6\uff0c\u8fd8\u5305\u62ec\u9886\u57df\u63a8\u7406\u3001\u8bc1\u636e\u5f15\u7528\u4e0e\u79d1\u5b66\u89e3\u91ca", "\u63d0\u51fa\u672a\u6765\u65b9\u5411\uff1a\u8de8\u9886\u57df\u56fe\u8868\u3001\u8de8\u6587\u6863\u7efc\u5408\u3001\u5047\u8bbe\u8bc4\u4f30\u3001\u6eaf\u6e90\u3001\u4e0d\u786e\u5b9a\u6027\u548c\u53cd\u4e8b\u5b9e grounding"], "keywords": ["\u591a\u6a21\u6001", "\u79d1\u7814\u667a\u80fd", "\u56fe\u50cf\u7406\u89e3", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14075v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Pathway to General-Purpose Scientific AI: Multimodal Comprehension of Scientific Images", "tldr": "\u63d0\u51fa\u9762\u5411\u79d1\u7814\u56fe\u50cf\u7406\u89e3\u7684\u57fa\u51c6\u613f\u666f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u56f4\u7ed5 ALD/E-ImageMiner \u57fa\u51c6\u4e0e ICDAR 2026 \u539f\u5b50\u5c42\u6c89\u79ef/\u523b\u8680\u79d1\u7814\u56fe\u50cf\u4fe1\u606f\u62bd\u53d6\u7ade\u8d5b\uff0c\u8ba8\u8bba\u5982\u4f55\u7528\u79d1\u5b66\u56fe\u8868\u63a8\u52a8\u591a\u6a21\u6001\u79d1\u7814 AI \u80fd\u529b\u8bc4\u6d4b\u3002\u5176\u76ee\u6807\u4ece\u56fe\u50cf\u5206\u7c7b\u3001\u8868\u683c\u62bd\u53d6\u3001\u6458\u8981\u548c\u95ee\u7b54\u6269\u5c55\u5230\u53ef\u9a8c\u8bc1\u7684\u79d1\u5b66\u6982\u5ff5\u7406\u89e3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u79d1\u7814\u56fe\u50cf\u7406\u89e3\u4ece\u5355\u7eaf\u4fe1\u606f\u62bd\u53d6\u63d0\u5347\u5230\u79d1\u5b66\u6982\u5ff5\u7406\u89e3\u4e0e\u53ef\u9a8c\u8bc1\u63a8\u7406\uff0c\u4e3a\u901a\u7528\u79d1\u7814 AI \u7684\u591a\u6a21\u6001\u8bc4\u6d4b\u63d0\u4f9b\u4e86\u66f4\u7cfb\u7edf\u7684\u8def\u7ebf\u56fe\u3002"}, {"abstract": "AI agents increasingly act on external systems through standardized tool-calling protocols such as the Model Context Protocol (MCP), yet no infrastructure layer constrains their actions to what a principal has verifiably authorized: authorization logic lives in application code, is neither signed nor independently auditable, and the resulting logs lack evidentiary value. We present Mandato, a governance proxy that enforces digitally signed mandates on agent actions at the protocol level. A mandate is a machine-readable, cryptographically signed authorization artifact specifying which tools an agent may invoke, under which parameter constraints and contextual conditions, for how long, and on whose behalf; the proxy evaluates every tool call against the applicable mandate chain, blocks non-conforming calls in line, and records every decision -- permit, deny, and the evidence for each -- in an append-only, hash-chained audit log designed for evidentiary use and periodically anchored via qualified timestamps. The mandate is deliberately modeled on the civil-law institution of delegation of authority, making the artifact legible to lawyers and auditors, not only to engineers. We give the mandate model and its decision semantics, the reference architecture as an MCP-transparent proxy with separated decision and enforcement points, and a mapping of the mechanism onto EU AI Act Articles 12 and 14, GDPR accountability, NIS2, and eIDAS 2, including a roadmap to qualified attestation through Qualified Trust Service Providers (QTSPs). We describe the implementation status of the reference system and a quantitative evaluation plan covering enforcement overhead, audit completeness, and tamper-evidence verification cost.", "arxiv_id": "2608.14074", "arxiv_url": "https://arxiv.org/abs/2608.14074", "authors": ["Giovanni Racioppi"], "brief": "\u8bba\u6587\u63d0\u51fa Mandato\uff1a\u4e00\u79cd\u534f\u8bae\u5c42\u6cbb\u7406\u4ee3\u7406\uff0c\u5728 MCP \u7b49\u5de5\u5177\u8c03\u7528\u534f\u8bae\u4e2d\u5f3a\u5236\u6267\u884c\u6570\u5b57\u7b7e\u540d\u7684\u201c\u6388\u6743\u59d4\u6258\u201d\u3002\u5b83\u4f1a\u6309\u6388\u6743\u94fe\u68c0\u67e5\u6bcf\u6b21\u5de5\u5177\u8c03\u7528\uff0c\u5e76\u751f\u6210\u54c8\u5e0c\u94fe\u5f0f\u3001\u53ef\u53d6\u8bc1\u7684\u5ba1\u8ba1\u65e5\u5fd7\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14074", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5c06\u6388\u6743\u62bd\u8c61\u4e3a\u673a\u5668\u53ef\u8bfb\u3001\u52a0\u5bc6\u7b7e\u540d\u7684 mandate\uff0c\u89c4\u5b9a\u53ef\u8c03\u7528\u5de5\u5177\u3001\u53c2\u6570\u7ea6\u675f\u3001\u4e0a\u4e0b\u6587\u6761\u4ef6\u3001\u6709\u6548\u671f\u548c\u4ee3\u8868\u4e3b\u4f53", "\u4ee5 MCP \u900f\u660e\u4ee3\u7406\u5b9e\u73b0\u51b3\u7b56\u70b9\u4e0e\u6267\u884c\u70b9\u5206\u79bb\uff0c\u5b9e\u65f6\u963b\u65ad\u4e0d\u7b26\u5408\u6388\u6743\u7684\u667a\u80fd\u4f53\u52a8\u4f5c", "\u5ba1\u8ba1\u65e5\u5fd7\u91c7\u7528\u8ffd\u52a0\u5199\u5165\u548c\u54c8\u5e0c\u94fe\uff0c\u5e76\u53ef\u901a\u8fc7\u5408\u683c\u65f6\u95f4\u6233\u951a\u5b9a\uff0c\u589e\u5f3a\u7be1\u6539\u53ef\u8bc1\u6027\u4e0e\u6cd5\u5f8b\u53ef\u91c7\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u6cbb\u7406", "\u5ba1\u8ba1", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14074v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Mandato: Protocol-Level Enforcement of Digitally Signed Mandates on AI Agent Actions with Cryptographically Chained Audit Trails", "tldr": "\u7528\u7b7e\u540d\u6388\u6743\u7ea6\u675f\u5e76\u5ba1\u8ba1AI\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Mandato\uff1a\u4e00\u79cd\u534f\u8bae\u5c42\u6cbb\u7406\u4ee3\u7406\uff0c\u5728 MCP \u7b49\u5de5\u5177\u8c03\u7528\u534f\u8bae\u4e2d\u5f3a\u5236\u6267\u884c\u6570\u5b57\u7b7e\u540d\u7684\u201c\u6388\u6743\u59d4\u6258\u201d\u3002\u5b83\u4f1a\u6309\u6388\u6743\u94fe\u68c0\u67e5\u6bcf\u6b21\u5de5\u5177\u8c03\u7528\uff0c\u5e76\u751f\u6210\u54c8\u5e0c\u94fe\u5f0f\u3001\u53ef\u53d6\u8bc1\u7684\u5ba1\u8ba1\u65e5\u5fd7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u6743\u9650\u63a7\u5236\u4ece\u5e94\u7528\u4ee3\u7801\u4e0a\u79fb\u5230\u534f\u8bae\u57fa\u7840\u8bbe\u65bd\u5c42\uff0c\u5e76\u5c06\u6280\u672f\u673a\u5236\u6620\u5c04\u5230 EU AI Act\u3001GDPR\u3001NIS2\u3001eIDAS 2 \u7b49\u5408\u89c4\u6846\u67b6\uff0c\u5bf9\u4f01\u4e1a\u90e8\u7f72\u53ef\u5ba1\u8ba1\u3001\u53ef\u8ffd\u8d23\u7684 AI Agent \u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "As large language models scale, their training-token budgets must also increase to maintain an appropriate tokens-per-parameter ratio (\\(\\mathrm{TPP}\\)). However, high-quality domain data is much harder to scale than general web data. As model size and the training-token budget increase, its fraction in the training mixture tends to decrease. Repeating the available high-quality data provides an effective way to counteract this dilution, but excessive repetition may lead to overfitting. We study this trade-off under practical LLM scaling, where the training-token budget grows proportionally with model size. For a fixed domain, we first find that, surprisingly at a fixed \\(\\mathrm{TPP}\\), the optimal repetition count mildly increases with model size. Across different domains, we find that the optimal repetition count is strongly negatively correlated with the final validation loss of a domain: domains with lower loss can generally benefit from more repetitions. In contrast, the amount of unique domain data is only weakly related to the optimal repetition count. These findings suggest that repetition counts tuned on smaller proxy models with the same \\(\\mathrm{TPP}\\) can provide a practical estimate for larger models.", "arxiv_id": "2608.14071", "arxiv_url": "https://arxiv.org/abs/2608.14071", "authors": ["Jingwei Li", "Xinran Gu", "Rui Dai", "Xintong Hao", "Chengyin Xu", "Yan Wu", "Shuran Zheng", "Jingzhao Zhang"], "brief": "\u8bba\u6587\u7814\u7a76\u5728\u6a21\u578b\u89c4\u6a21\u4e0e\u8bad\u7ec3token\u9884\u7b97\u540c\u6b65\u589e\u957f\u65f6\uff0c\u5982\u4f55\u91cd\u590d\u9ad8\u8d28\u91cf\u9886\u57df\u6570\u636e\u4ee5\u62b5\u6d88\u5176\u5728\u6df7\u5408\u6570\u636e\u4e2d\u7684\u7a00\u91ca\uff0c\u540c\u65f6\u907f\u514d\u8fc7\u62df\u5408\u3002\u4f5c\u8005\u53d1\u73b0\u56fa\u5b9aTPP\u4e0b\uff0c\u6700\u4f18\u91cd\u590d\u6b21\u6570\u4f1a\u968f\u6a21\u578b\u89c4\u6a21\u7565\u589e\uff0c\u4e14\u4e0e\u9886\u57df\u6700\u7ec8\u9a8c\u8bc1\u635f\u5931\u5f3a\u8d1f\u76f8\u5173\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14071", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u56fa\u5b9atokens-per-parameter\uff08TPP\uff09\u8bbe\u7f6e\u4e0b\uff0c\u540c\u4e00\u9886\u57df\u7684\u6700\u4f18\u6570\u636e\u91cd\u590d\u6b21\u6570\u4f1a\u968f\u6a21\u578b\u89c4\u6a21\u6e29\u548c\u589e\u52a0", "\u4e0d\u540c\u9886\u57df\u95f4\uff0c\u6700\u4f18\u91cd\u590d\u6b21\u6570\u4e0e\u6700\u7ec8\u9a8c\u8bc1\u635f\u5931\u663e\u8457\u8d1f\u76f8\u5173\uff1a\u635f\u5931\u8d8a\u4f4e\u7684\u9886\u57df\u901a\u5e38\u8d8a\u9002\u5408\u66f4\u591a\u91cd\u590d", "\u9886\u57df\u552f\u4e00\u6570\u636e\u91cf\u4e0e\u6700\u4f18\u91cd\u590d\u6b21\u6570\u76f8\u5173\u6027\u8f83\u5f31\uff0c\u5c0f\u6a21\u578b\u540cTPP\u8c03\u53c2\u53ef\u7528\u4e8e\u4f30\u8ba1\u5927\u6a21\u578b\u91cd\u590d\u7b56\u7565"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u6570\u636e\u914d\u6bd4", "\u7f29\u653e\u89c4\u5f8b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14071v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Scaling Domain Data Repetition in LLM Pretraining", "tldr": "\u7814\u7a76LLM\u9884\u8bad\u7ec3\u4e2d\u9886\u57df\u6570\u636e\u91cd\u590d\u7684\u7f29\u653e\u89c4\u5f8b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5728\u6a21\u578b\u89c4\u6a21\u4e0e\u8bad\u7ec3token\u9884\u7b97\u540c\u6b65\u589e\u957f\u65f6\uff0c\u5982\u4f55\u91cd\u590d\u9ad8\u8d28\u91cf\u9886\u57df\u6570\u636e\u4ee5\u62b5\u6d88\u5176\u5728\u6df7\u5408\u6570\u636e\u4e2d\u7684\u7a00\u91ca\uff0c\u540c\u65f6\u907f\u514d\u8fc7\u62df\u5408\u3002\u4f5c\u8005\u53d1\u73b0\u56fa\u5b9aTPP\u4e0b\uff0c\u6700\u4f18\u91cd\u590d\u6b21\u6570\u4f1a\u968f\u6a21\u578b\u89c4\u6a21\u7565\u589e\uff0c\u4e14\u4e0e\u9886\u57df\u6700\u7ec8\u9a8c\u8bc1\u635f\u5931\u5f3a\u8d1f\u76f8\u5173\u3002", "why_notable": "\u9ad8\u8d28\u91cf\u9886\u57df\u6570\u636e\u96be\u4ee5\u968fLLM\u89c4\u6a21\u6269\u5f20\u800c\u540c\u6b65\u589e\u957f\uff0c\u6570\u636e\u91cd\u590d\u662f\u5b9e\u7528\u4f46\u6613\u8fc7\u62df\u5408\u7684\u624b\u6bb5\u3002\u8be5\u5de5\u4f5c\u7ed9\u51fa\u53ef\u8fc1\u79fb\u7684\u7ecf\u9a8c\u89c4\u5f8b\uff0c\u6709\u52a9\u4e8e\u66f4\u9ad8\u6548\u5730\u8bbe\u8ba1\u9886\u57df\u589e\u5f3a\u9884\u8bad\u7ec3\u6570\u636e\u914d\u6bd4\u3002"}, {"abstract": "Action-conditioned video world models require low-latency causal generation and reliable responses to game-native controls. Although causal distillation enables one- or few-step video synthesis, extending it to interactive world models remains challenging, as discrete keyboard states and continuous mouse motion must remain aligned with temporally compressed latent chunks during causal training and autoregressive rollout. We introduce ForgeWM, a progressive framework that transforms a bidirectional action-conditioned video generator into efficient few-step world models through domain adaptation, teacher-forced causal training, causal consistency distillation, and on-policy distribution matching with a bidirectional teacher. The resulting budget-specialized students operate at steady-state denoising budgets of 1, 2, and 4 steps. ForgeWM further supports a dual-path deployment protocol combining latency-critical interaction with optional replay-time refinement, where the one-step student re-noises and refines its saved draft. On paired Minecraft trajectories, ForgeWM leads the evaluated systems in Imaging Quality, reference-aligned motion-profile agreement, action-sign accuracy, and mouse-control accuracy, while achieving the lowest reference LPIPS; the same four-stage recipe transfers to gamepad-controlled FPS gameplay. Replay-time refinement matches four-step reference quality while remaining roughly three times closer to the experienced trajectory than regeneration from noise. These results demonstrate ForgeWM\u0027s effectiveness for controllable few-step video generation.", "arxiv_id": "2608.14022", "arxiv_url": "https://arxiv.org/abs/2608.14022", "authors": ["Xinye Li", "Lingshuai Lin", "Lei Wang", "Liuzhou Zhang", "Jialin Cui", "Qingshan Li", "Guanchu Wang", "Qingbin Liu", "Xi Chen", "Jiang Bian", "Wai Lam"], "brief": "\u8bba\u6587\u63d0\u51fa ForgeWM\uff0c\u5c06\u53cc\u5411\u52a8\u4f5c\u6761\u4ef6\u89c6\u9891\u751f\u6210\u5668\u9010\u6b65\u8f6c\u5316\u4e3a\u4f4e\u5ef6\u8fdf\u7684\u5c11\u6b65\u56e0\u679c\u4e16\u754c\u6a21\u578b\u3002\u5b83\u9762\u5411\u952e\u76d8\u3001\u9f20\u6807\u3001\u624b\u67c4\u7b49\u6e38\u620f\u539f\u751f\u63a7\u5236\uff0c\u5b9e\u73b0\u4ea4\u4e92\u5f0f\u89c6\u9891\u751f\u6210\u4e0e\u56de\u653e\u65f6\u8d28\u91cf\u589e\u5f3a\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14022", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u56db\u9636\u6bb5\u6d41\u7a0b\uff1a\u9886\u57df\u9002\u914d\u3001\u6559\u5e08\u5f3a\u5236\u56e0\u679c\u8bad\u7ec3\u3001\u56e0\u679c\u4e00\u81f4\u6027\u84b8\u998f\u3001\u4e0e\u53cc\u5411\u6559\u5e08\u8fdb\u884c\u5728\u7b56\u7565\u5206\u5e03\u5339\u914d\u3002", "\u8bad\u7ec3\u51fa\u7a33\u5b9a\u53bb\u566a\u9884\u7b97\u4e3a 1\u30012\u30014 \u6b65\u7684\u5b66\u751f\u6a21\u578b\uff0c\u517c\u987e\u5b9e\u65f6\u4ea4\u4e92\u5ef6\u8fdf\u4e0e\u751f\u6210\u8d28\u91cf\u3002", "\u5728 Minecraft \u6210\u5bf9\u8f68\u8ff9\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u6210\u50cf\u8d28\u91cf\u3001\u52a8\u4f5c\u7b26\u53f7\u51c6\u786e\u7387\u3001\u9f20\u6807\u63a7\u5236\u51c6\u786e\u7387\u548c\u66f4\u4f4e LPIPS\uff0c\u5e76\u53ef\u8fc1\u79fb\u5230\u624b\u67c4\u63a7\u5236\u7684 FPS \u573a\u666f\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u56e0\u679c\u8bad\u7ec3", "\u6e38\u620f\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14022v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ForgeWM: Progressive Causal Training for Few-Step Action-Conditioned Video World Models", "tldr": "ForgeWM\u5b9e\u73b0\u5c11\u6b65\u53ef\u63a7\u89c6\u9891\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ForgeWM\uff0c\u5c06\u53cc\u5411\u52a8\u4f5c\u6761\u4ef6\u89c6\u9891\u751f\u6210\u5668\u9010\u6b65\u8f6c\u5316\u4e3a\u4f4e\u5ef6\u8fdf\u7684\u5c11\u6b65\u56e0\u679c\u4e16\u754c\u6a21\u578b\u3002\u5b83\u9762\u5411\u952e\u76d8\u3001\u9f20\u6807\u3001\u624b\u67c4\u7b49\u6e38\u620f\u539f\u751f\u63a7\u5236\uff0c\u5b9e\u73b0\u4ea4\u4e92\u5f0f\u89c6\u9891\u751f\u6210\u4e0e\u56de\u653e\u65f6\u8d28\u91cf\u589e\u5f3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5c11\u6b65\u56e0\u679c\u84b8\u998f\u6269\u5c55\u5230\u52a8\u4f5c\u6761\u4ef6\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u89e3\u51b3\u79bb\u6563\u952e\u76d8\u4e0e\u8fde\u7eed\u9f20\u6807\u63a7\u5236\u5728\u65f6\u95f4\u538b\u7f29\u6f5c\u53d8\u91cf\u4e2d\u7684\u5bf9\u9f50\u95ee\u9898\uff0c\u5bf9\u4f4e\u5ef6\u8fdf\u6e38\u620f\u6a21\u62df\u3001\u53ef\u63a7\u89c6\u9891\u751f\u6210\u548c\u5b9e\u65f6\u4e16\u754c\u6a21\u578b\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Diffusion large language models (dLLMs) accelerate language generation by predicting multiple masks in a single forward pass. However, existing dLLMs can suffer from unreliable predictions in early denoising stages under aggressive parallelism strategies, leading to errors that can propagate to later stages. To tackle this issue, we present Consistency Forcing (CForce) for dLLMs, a distillation method to force the mask predictions of early stages to align with those of later stages. CForce trains the model on pre-collected self-rollout trajectories, thereby improving training-inference alignment. We introduce Confidence Adaptive KL Divergence as a distillation objective to conjoin the merits of forward and reverse KL. We further provide a theoretical analysis for the consistency objective to explain why CForce can approximately minimize the prediction error of early stages. Critically, the same formulation applies to both mask-to-token decoding and edit-capable decoding; in the edit-capable case, later token-to-token refinements provide additional supervision for earlier masked-state predictions. Experiments on non-edit and edit-capable LLaDA models show improved speed-quality trade-offs, especially under high-parallelism decoding budgets. Code is available at: https://github.com/inclusionAI/dFactory.", "arxiv_id": "2608.13925", "arxiv_url": "https://arxiv.org/abs/2608.13925", "authors": ["Yuji Ren", "Chenkai Xu", "Zhuocheng Gong", "Jianguo Li", "Zhijie Deng"], "brief": "\u8bba\u6587\u63d0\u51fa CForce\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\uff08dLLMs\uff09\u7684\u84b8\u998f\u65b9\u6cd5\uff0c\u4f7f\u65e9\u671f\u53bb\u566a\u9636\u6bb5\u7684 mask \u9884\u6d4b\u5bf9\u9f50\u540e\u671f\u66f4\u53ef\u9760\u7684\u9884\u6d4b\u3002\u5b83\u901a\u8fc7\u81ea\u56de\u6eda\u8f68\u8ff9\u8bad\u7ec3\u4e0e Confidence Adaptive KL \u76ee\u6807\uff0c\u6539\u5584\u9ad8\u5e76\u884c\u89e3\u7801\u4e0b\u7684\u901f\u5ea6-\u8d28\u91cf\u6743\u8861\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13925", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9 dLLMs \u6fc0\u8fdb\u5e76\u884c\u89e3\u7801\u4e2d\u65e9\u671f\u9884\u6d4b\u4e0d\u53ef\u9760\u3001\u9519\u8bef\u5411\u540e\u4f20\u64ad\u7684\u95ee\u9898\uff0c\u5f15\u5165\u65e9\u665a\u9636\u6bb5\u9884\u6d4b\u4e00\u81f4\u6027\u7ea6\u675f\u3002", "\u63d0\u51fa Confidence Adaptive KL Divergence\uff0c\u7ed3\u5408 forward KL \u4e0e reverse KL \u7684\u4f18\u52bf\uff0c\u6839\u636e\u7f6e\u4fe1\u5ea6\u81ea\u9002\u5e94\u84b8\u998f\u3002", "\u65b9\u6cd5\u540c\u65f6\u9002\u7528\u4e8e mask-to-token \u89e3\u7801\u548c\u53ef\u7f16\u8f91\u89e3\u7801\uff1b\u5728 LLaDA \u975e\u7f16\u8f91\u4e0e\u53ef\u7f16\u8f91\u6a21\u578b\u4e0a\uff0c\u9ad8\u5e76\u884c\u9884\u7b97\u4e0b\u6548\u679c\u63d0\u5347\u660e\u663e\u3002"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u5e76\u884c\u89e3\u7801", "\u77e5\u8bc6\u84b8\u998f", "\u6587\u672c\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13925v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CForce: Boosting Parallel Decoding for dLLMs via Consistency Forcing", "tldr": "\u7528\u4e00\u81f4\u6027\u84b8\u998f\u63d0\u5347\u6269\u6563LLM\u5e76\u884c\u89e3\u7801\u8d28\u91cf\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CForce\uff0c\u4e00\u79cd\u9762\u5411\u6269\u6563\u5927\u8bed\u8a00\u6a21\u578b\uff08dLLMs\uff09\u7684\u84b8\u998f\u65b9\u6cd5\uff0c\u4f7f\u65e9\u671f\u53bb\u566a\u9636\u6bb5\u7684 mask \u9884\u6d4b\u5bf9\u9f50\u540e\u671f\u66f4\u53ef\u9760\u7684\u9884\u6d4b\u3002\u5b83\u901a\u8fc7\u81ea\u56de\u6eda\u8f68\u8ff9\u8bad\u7ec3\u4e0e Confidence Adaptive KL \u76ee\u6807\uff0c\u6539\u5584\u9ad8\u5e76\u884c\u89e3\u7801\u4e0b\u7684\u901f\u5ea6-\u8d28\u91cf\u6743\u8861\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u76f4\u63a5\u9762\u5411\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u6838\u5fc3\u74f6\u9888\uff1a\u5982\u4f55\u5728\u9ad8\u5e76\u884c\u751f\u6210\u65f6\u4fdd\u6301\u8d28\u91cf\u3002\u5b83\u4e0d\u53ea\u662f\u6539\u63a8\u7406\u7b56\u7565\uff0c\u800c\u662f\u901a\u8fc7\u8bad\u7ec3-\u63a8\u7406\u5bf9\u9f50\u548c\u4e00\u81f4\u6027\u84b8\u998f\u589e\u5f3a\u65e9\u671f\u9884\u6d4b\u53ef\u9760\u6027\uff0c\u5bf9\u63d0\u5347 dLLM \u5b9e\u7528\u89e3\u7801\u6548\u7387\u6709\u8f83\u5f3a\u4ef7\u503c\u3002"}, {"abstract": "Large language models (LLMs) are increasingly used for code generation, yet they remain vulnerable to prompts that elicit insecure implementations. Existing defenses typically rely on predefined threat models or known vulnerability patterns, limiting their effectiveness against novel attacks. We propose CodeSIFT, a threat-model-agnostic detection method that leverages influence functions to identify batches of prompts that induce anomalous model behavior. Rather than detecting specific vulnerabilities, CodeSIFT measures the parameter-space influence of generated code and uses a statistical test to determine whether a candidate prompt set deviates from a benign reference distribution. To evaluate our approach, we introduce two benchmark datasets covering a variety of vulnerabilities. We evaluate CodeSIFT on three open-weight code LLMs ranging from 3B to 7B parameters, achieving AUROC scores of up to 0.98 at moderate-to-high injection rates, while maintaining well-calibrated false positive rates and substantially outperforming static analysis baselines. These results suggest that influence-function-based detection is a promising direction for identifying malicious code-generation prompts without requiring prior knowledge of the underlying attack class.", "arxiv_id": "2608.14303", "arxiv_url": "https://arxiv.org/abs/2608.14303", "authors": ["Francesco Quinzan", "Noor Munir", "Yishun Lu", "Stephen Roberts"], "brief": "\u8bba\u6587\u63d0\u51fa CodeSIFT\uff0c\u4e00\u79cd\u4e0d\u4f9d\u8d56\u7279\u5b9a\u5a01\u80c1\u6a21\u578b\u7684\u4ee3\u7801\u751f\u6210\u63d0\u793a\u6279\u6b21\u68c0\u6d4b\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u5f71\u54cd\u51fd\u6570\u8861\u91cf\u751f\u6210\u4ee3\u7801\u5bf9\u6a21\u578b\u53c2\u6570\u7a7a\u95f4\u7684\u5f71\u54cd\uff0c\u5e76\u7528\u7edf\u8ba1\u68c0\u9a8c\u5224\u65ad\u5019\u9009\u63d0\u793a\u96c6\u662f\u5426\u504f\u79bb\u826f\u6027\u5206\u5e03\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14303", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e0d\u76f4\u63a5\u8bc6\u522b\u5177\u4f53\u6f0f\u6d1e\u6a21\u5f0f\uff0c\u800c\u662f\u68c0\u6d4b\u63d0\u793a\u6279\u6b21\u8bf1\u53d1\u7684\u5f02\u5e38\u6a21\u578b\u884c\u4e3a", "\u6784\u5efa\u4e86\u4e24\u4e2a\u8986\u76d6\u591a\u7c7b\u6f0f\u6d1e\u7684\u4ee3\u7801\u751f\
