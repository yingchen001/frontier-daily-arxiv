<script>
const PAPERS = [{"abstract": "Mobile GUI Agents powered by multimodal large language models (MLLMs) show promise in human-computer intelligence. However, current research primarily focuses on reactive task execution while lacking a comprehensive understanding-prediction-execution process for user intentions, which are the core requirements of active agents. In this paper, we propose the Act2Intention framework that builds an active mobile agent by integrating understanding, predicting user intentions, and executing decisions. First, we construct the Act2Intention Bench through data collection and validated generation, comprising 72,511 intentions and over 700,000 actions across 52 apps, thereby establishing the first benchmark for evaluating proactive agents via continuous intention-action trajectories. We further develop the Act2Intention Agent, achieving proactive services through Proactive-oriented Intention Understanding, Personalized Proactive Intention Prediction, and Experience-guided Intention Execution. Experimental results show that supervised fine-tuning on Act2Intention Bench yields absolute improvements of +32.0 Acc-S, +10.25 Acc-S, and +6.9 SSR points over non-fine-tuned counterparts under the same agent framework for intention understanding, prediction, and execution, respectively. This success underscores the necessity and value of the Act2Intention Bench, which establishes a standardized platform for developing and evaluating proactive agents and consequently paves the way for research on intention-driven human-computer interaction.", "arxiv_id": "2608.14132", "arxiv_url": "https://arxiv.org/abs/2608.14132", "authors": ["Xiaokai Yan", "Jingtao Ding", "Yong Li", "Zhiwen Yu"], "brief": "\u8bba\u6587\u63d0\u51fa Act2Intention \u6846\u67b6\uff0c\u5c06\u7528\u6237\u610f\u56fe\u7406\u89e3\u3001\u610f\u56fe\u9884\u6d4b\u4e0e\u6267\u884c\u51b3\u7b56\u6574\u5408\u4e3a\u4e3b\u52a8\u79fb\u52a8 GUI \u667a\u80fd\u4f53\u6d41\u7a0b\u3002\u5176\u6784\u5efa\u4e86 Ac  Nie", "Yichen Li", "Stefan Zohren", "Anna Vettoruzzo", "Qingsong Wen", "Ming Jin", "Joaquin Vanschoren"], "brief": "\u8bba\u6587\u63d0\u51fa TimeSage-EV\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u6d4b LLM \u667a\u80fd\u4f53\u5728\u6301\u7eed\u66f4\u65b0\u6570\u636e\u73af\u5883\u4e2d\u8fdb\u884c\u65f6\u95f4\u5e8f\u5217\u5206\u6790\u7684\u5b9e\u65f6\u57fa\u51c6\u3002\u5b83\u8986\u76d6 6 \u4e2a\u9886\u57df\u300160 \u4e2a\u771f\u5b9e\u673a\u6784\u573a\u666f\u548c 1485 \u4e2a\u6309\u65f6\u95f4\u5c55\u5f00\u7684\u95ee\u7b54\u4efb\u52a1\uff0c\u5e76\u4ee5\u672a\u6765\u53d1\u5e03\u6570\u636e\u4f5c\u4e3a\u771f\u5b9e\u7b54\u6848\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14270", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u6d4b\u4efb\u52a1\u6db5\u76d6\u72b6\u6001\u8bc6\u522b\u3001\u6570\u636e\u603b\u7ed3\u548c\u524d\u666f\u63a8\u7406\uff0c\u5f3a\u8c03\u65f6\u95f4\u6709\u6548\u6027\u4e0e\u622a\u6b62\u65e5\u671f\u611f\u77e5\u7684\u8bc1\u636e\u4f7f\u7528", "\u6570\u636e\u4ece 2023 \u5e74 2 \u6708\u5230 2026 \u5e74 5 \u6708\uff0c\u5305\u542b\u6708\u5ea6\u3001\u5468\u5ea6\u3001\u65e5\u5ea6\u53ca\u4e0d\u89c4\u5219\u53d1\u5e03\u8282\u594f", "\u5b9e\u9a8c\u53d1\u73b0\u524d\u6cbf LLM \u667a\u80fd\u4f53\u5728\u65f6\u95f4\u6709\u6548\u6027\u3001\u5916\u751f\u80cc\u666f\u5229\u7528\u548c\u73af\u5883\u9002\u5e94\u4e0a\u4ecd\u5b58\u5728\u660e\u663e\u77ed\u677f"], "keywords": ["\u667a\u80fd\u4f53", "\u65f6\u95f4\u5e8f\u5217", "\u57fa\u51c6\u8bc4\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14270v1", "published_at": "2026-08-14", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TimeSage-EV: A Live Benchmark for Agentic Time Series Analysis in Evolving Environments", "tldr": "\u9762\u5411\u52a8\u6001\u65f6\u95f4\u5e8f\u5217\u5206\u6790\u7684\u5b9e\u65f6\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TimeSage-EV\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u6d4b LLM \u667a\u80fd\u4f53\u5728\u6301\u7eed\u66f4\u65b0\u6570\u636e\u73af\u5883\u4e2d\u8fdb\u884c\u65f6\u95f4\u5e8f\u5217\u5206\u6790\u7684\u5b9e\u65f6\u57fa\u51c6\u3002\u5b83\u8986\u76d6 6 \u4e2a\u9886\u57df\u300160 \u4e2a\u771f\u5b9e\u673a\u6784\u573a\u666f\u548c 1485 \u4e2a\u6309\u65f6\u95f4\u5c55\u5f00\u7684\u95ee\u7b54\u4efb\u52a1\uff0c\u5e76\u4ee5\u672a\u6765\u53d1\u5e03\u6570\u636e\u4f5c\u4e3a\u771f\u5b9e\u7b54\u6848\u3002", "why_notable": "\u76f8\u6bd4\u56fa\u5b9a\u5feb\u7167\u5f0f\u65f6\u95f4\u5e8f\u5217\u95ee\u7b54\u57fa\u51c6\uff0cTimeSage-EV \u66f4\u8d34\u8fd1\u771f\u5b9e\u9ad8\u98ce\u9669\u573a\u666f\u4e2d\u6570\u636e\u6301\u7eed\u66f4\u65b0\u3001\u7ed3\u8bba\u4f1a\u88ab\u65b0\u8bc1\u636e\u6539\u53d8\u7684\u5206\u6790\u9700\u6c42\uff0c\u5e76\u63d0\u4f9b\u6708\u5ea6\u66f4\u65b0\u3001\u4ee3\u7801\u3001\u6392\u884c\u699c\u548c\u5931\u8d25\u6a21\u5f0f\u5206\u6790\uff0c\u6709\u52a9\u4e8e\u63a8\u52a8\u53ef\u9760\u7684\u65f6\u95f4\u5e8f\u5217\u667a\u80fd\u4f53\u7814\u7a76\u3002"}, {"abstract": "Large language model (LLM) agents are evolving from conversational assistants into autonomous systems that execute long-horizon tasks through reasoning, tool use, code generation, and workspace manipulation. As agents increasingly operate over persistent environments and multi-step workflows, they face challenges analogous to those addressed by transactional database systems: reliable execution, consistent outcomes, safe concurrency, and durable state management. We introduce the concept of an agentic transaction and propose an ACID-compliant agent system framework that reinterprets the classical ACID properties for agent execution through four semantic guarantees: Semantic Atomicity, Semantic Consistency, Semantic Isolation, and Semantic Durability. Together, these properties provide a principled foundation for building reliable agent systems despite model uncertainty and dynamic execution environments. To instantiate this framework, we develop an ACID-compliant data agent that realizes these guarantees through transactional exploration-execution-validation cycles, transactional skill hubs, confidence divergence-based validation, semantic dependency-aware isolation, and transaction-aware semantic state management. Experimental results on widely used benchmarks show that our system achieves a 10.6% improvement over state-of-the-art agents, including Claude Code. This work opens a broader research agenda on extending transactional principles and system architectures toward building trustworthy, scalable, and self-evolving AI agent systems.", "arxiv_id": "2608.13900", "arxiv_url": "https://arxiv.org/abs/2608.13900", "authors": ["Zhaoyan Sun", "Xiaoxiao Wang", "Guoliang Li"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u4e8b\u52a1\u201d\u6982\u5ff5\uff0c\u628a\u4f20\u7edf\u6570\u636e\u5e93ACID\u5c5e\u6027\u91cd\u91ca\u4e3a\u8bed\u4e49\u539f\u5b50\u6027\u3001\u8bed\u4e49\u4e00\u81f4\u6027\u3001\u8bed\u4e49\u9694\u79bb\u6027\u548c\u8bed\u4e49\u6301\u4e45\u6027\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u6784\u5efa\u4e86\u4e00\u4e2aACID\u5408\u89c4\u7684\u6570\u636e\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u4e8b\u52a1\u5316\u63a2\u7d22-\u6267\u884c-\u9a8c\u8bc1\u5faa\u73af\u548c\u8bed\u4e49\u72b6\u6001\u7ba1\u7406\u63d0\u5347\u957f\u7a0b\u4efb\u52a1\u53ef\u9760\u6027\u3002", "categories": ["cs.DB", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13900", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06ACID\u4e8b\u52a1\u539f\u5219\u6269\u5c55\u5230LLM\u667a\u80fd\u4f53\uff0c\u9488\u5bf9\u5de5\u5177\u8c03\u7528\u3001\u4ee3\u7801\u751f\u6210\u3001\u5de5\u4f5c\u533a\u64cd\u4f5c\u4e2d\u7684\u4e0d\u786e\u5b9a\u6027\u4e0e\u591a\u6b65\u4f9d\u8d56\u63d0\u4f9b\u8bed\u4e49\u7ea7\u4fdd\u969c\u3002", "\u7cfb\u7edf\u5305\u542b\u4e8b\u52a1\u5316\u6280\u80fd\u5e93\u3001\u57fa\u4e8e\u7f6e\u4fe1\u5ea6\u5206\u6b67\u7684\u9a8c\u8bc1\u3001\u8bed\u4e49\u4f9d\u8d56\u611f\u77e5\u9694\u79bb\uff0c\u4ee5\u53ca\u4e8b\u52a1\u611f\u77e5\u7684\u8bed\u4e49\u72b6\u6001\u7ba1\u7406\u3002", "\u5728\u5e38\u7528\u57fa\u51c6\u4e0a\u76f8\u8f83\u6700\u5f3a\u73b0\u6709\u667a\u80fd\u4f53\u63d0\u534710.6%\uff0c\u5bf9\u6bd4\u5bf9\u8c61\u5305\u62ecClaude Code\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u636e\u5e93", "\u53ef\u9760\u6027", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13900v1", "published_at": "2026-08-14", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Agentic Transaction: Towards ACID-Compliant Agent Systems", "tldr": "\u5c06\u6570\u636e\u5e93ACID\u601d\u60f3\u5f15\u5165LLM\u667a\u80fd\u4f53\u6267\u884c\u6846\u67b6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u201c\u667a\u80fd\u4f53\u4e8b\u52a1\u201d\u6982\u5ff5\uff0c\u628a\u4f20\u7edf\u6570\u636e\u5e93ACID\u5c5e\u6027\u91cd\u91ca\u4e3a\u8bed\u4e49\u539f\u5b50\u6027\u3001\u8bed\u4e49\u4e00\u81f4\u6027\u3001\u8bed\u4e49\u9694\u79bb\u6027\u548c\u8bed\u4e49\u6301\u4e45\u6027\u3002\u4f5c\u8005\u8fdb\u4e00\u6b65\u6784\u5efa\u4e86\u4e00\u4e2aACID\u5408\u89c4\u7684\u6570\u636e\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u4e8b\u52a1\u5316\u63a2\u7d22-\u6267\u884c-\u9a8c\u8bc1\u5faa\u73af\u548c\u8bed\u4e49\u72b6\u6001\u7ba1\u7406\u63d0\u5347\u957f\u7a0b\u4efb\u52a1\u53ef\u9760\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u53ef\u9760\u3001\u53ef\u5e76\u53d1\u3001\u53ef\u6062\u590d\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u7cfb\u7edf\u63d0\u4f9b\u4e86\u7cfb\u7edf\u67b6\u6784\u89c6\u89d2\uff0c\u628a\u6570\u636e\u5e93\u6210\u719f\u4e8b\u52a1\u673a\u5236\u8fc1\u79fb\u5230AI\u667a\u80fd\u4f53\u6267\u884c\u4e2d\uff0c\u5177\u6709\u8f83\u5f3a\u5de5\u7a0b\u5b9e\u7528\u4ef7\u503c\u548c\u7814\u7a76\u542f\u53d1\u6027\u3002"}, {"abstract": "Enabling LLM agents to sustain productive, stable, and goal-aligned research over extended horizons is a central challenge for autonomous machine learning and scientific discovery, as progress hinges on continuously managing evolving state, exploration decisions, and computational resources. Pioneering autoresearch agents, despite great success, still lack mechanisms for continuity, recovery from dead ends, and value-driven compute allocation, which inherently undermines overall search efficiency, wastes computational resources, and lowers the chance of ultimate success. To bridge this gap, we introduce ScienceFlow, an end-to-end autoresearch agent framework that organizes long-horizon research work into research segments grounded in executable workspaces. It represents research progress as recoverable executable states, enabling efficient exploration, revision, and execution. Transitions between research segments are governed by Executable-State Transition through Re-Anchoring (ESTRA), which selects either the live state or an archived state as the next anchor and determines whether to continue or redirect the research trajectory. An evidence-aware execution controller allocates resources to physical jobs based on resource availability, remaining budget, and validated progress. We evaluate ScienceFlow on tasks spanning machine learning, scientific modeling, and mathematical optimization. Results on diverse long-horizon benchmarks demonstrate its ability to sustain effective research processes, highlighted by a SOTA 70.22 percent Any-Medal score on the full MLE-bench within a 24-hour budget, outperforming prior reported results by 4.92 percentage points. The efficacy of ScienceFlow further demonstrates that efficient state management, adaptive exploration, and objective-aligned execution are critical for scaling autonomous research beyond short-horizon interactions.", "arxiv_id": "2608.14354", "arxiv_url": "https://arxiv.org/abs/2608.14354", "authors": ["Mingming Zhao", "Jiqian Dong", "Kangping Xu", "Zadid Hasan", "Chengrui Fan", "Shan Jiang", "Shuai Mao", "Ting Lingya", "Linyi Zou", "Tailin Zhou", "Yun Hin Chan", "Wenkai Zhang", "Zhanhong Zhou", "Guowei Huang", "Hongliang Li", "Wenjing Cun", "Zhitang Chen", "Mingxuan Yuan", "Yanhui Geng"], "brief": "\u8bba\u6587\u63d0\u51fa ScienceFlow\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u5b66\u4e60\u7814\u7a76\u3001\u79d1\u5b66\u53d1\u73b0\u4e0e\u4f18\u5316\u4efb\u52a1\u7684\u957f\u7a0b\u81ea\u4e3b\u7814\u7a76\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u5c06\u7814\u7a76\u8fc7\u7a0b\u7ec4\u7ec7\u4e3a\u57fa\u4e8e\u53ef\u6267\u884c\u5de5\u4f5c\u533a\u7684\u7814\u7a76\u7247\u6bb5\uff0c\u5e76\u901a\u8fc7\u53ef\u6062\u590d\u72b6\u6001\u7ba1\u7406\u3001\u8f68\u8ff9\u91cd\u951a\u5b9a\u548c\u8bc1\u636e\u611f\u77e5\u8d44\u6e90\u8c03\u5ea6\u6765\u7ef4\u6301\u957f\u671f\u63a2\u7d22\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14354", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7814\u7a76\u8fdb\u5c55\u8868\u793a\u4e3a\u53ef\u6062\u590d\u7684\u53ef\u6267\u884c\u72b6\u6001\uff0c\u652f\u6301\u4ece\u5f53\u524d\u72b6\u6001\u6216\u5386\u53f2\u5f52\u6863\u72b6\u6001\u7ee7\u7eed\u3001\u56de\u9000\u6216\u6539\u9053\u63a2\u7d22\u3002", "\u63d0\u51fa ESTRA\uff08Executable-State Transition through Re-Anchoring\uff09\u673a\u5236\uff0c\u7528\u4e8e\u5728\u7814\u7a76\u7247\u6bb5\u95f4\u9009\u62e9\u951a\u70b9\u5e76\u51b3\u5b9a\u5ef6\u7eed\u6216\u91cd\u5b9a\u5411\u7814\u7a76\u8f68\u8ff9\u3002", "\u5f15\u5165\u8bc1\u636e\u611f\u77e5\u6267\u884c\u63a7\u5236\u5668\uff0c\u6839\u636e\u8d44\u6e90\u53ef\u7528\u6027\u3001\u5269\u4f59\u9884\u7b97\u548c\u5df2\u9a8c\u8bc1\u8fdb\u5c55\u5206\u914d\u8ba1\u7b97\u4efb\u52a1\uff1b\u5728 MLE-bench 24\u5c0f\u65f6\u9884\u7b97\u4e0b\u8fbe\u5230 70.22% Any-Medal SOTA\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u79d1\u7814", "\u673a\u5668\u5b66\u4e60", "\u8d44\u6e90\u8c03\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14354v1", "published_at": "2026-08-14", "score": 0.375, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "ScienceFlow: A long-horizon agent for ML research, scientific discovery and beyond", "tldr": "ScienceFlow\u8ba9LLM\u667a\u80fd\u4f53\u6301\u7eed\u81ea\u4e3b\u79d1\u7814", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ScienceFlow\uff0c\u4e00\u4e2a\u9762\u5411\u673a\u5668\u5b66\u4e60\u7814\u7a76\u3001\u79d1\u5b66\u53d1\u73b0\u4e0e\u4f18\u5316\u4efb\u52a1\u7684\u957f\u7a0b\u81ea\u4e3b\u7814\u7a76\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u5c06\u7814\u7a76\u8fc7\u7a0b\u7ec4\u7ec7\u4e3a\u57fa\u4e8e\u53ef\u6267\u884c\u5de5\u4f5c\u533a\u7684\u7814\u7a76\u7247\u6bb5\uff0c\u5e76\u901a\u8fc7\u53ef\u6062\u590d\u72b6\u6001\u7ba1\u7406\u3001\u8f68\u8ff9\u91cd\u951a\u5b9a\u548c\u8bc1\u636e\u611f\u77e5\u8d44\u6e90\u8c03\u5ea6\u6765\u7ef4\u6301\u957f\u671f\u63a2\u7d22\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u957f\u7a0b\u81ea\u4e3b\u79d1\u7814\u4e2d\u7684\u8fde\u7eed\u6027\u3001\u6b7b\u80e1\u540c\u6062\u590d\u548c\u8ba1\u7b97\u8d44\u6e90\u6d6a\u8d39\u95ee\u9898\u7ed9\u51fa\u7cfb\u7edf\u6027\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u5728\u591a\u7c7b\u957f\u7a0b\u57fa\u51c6\u4e0a\u53d6\u5f97\u663e\u8457\u63d0\u5347\uff0c\u4f53\u73b0\u4e86\u72b6\u6001\u7ba1\u7406\u4e0e\u8d44\u6e90\u8c03\u5ea6\u5bf9\u53ef\u6269\u5c55\u79d1\u7814\u667a\u80fd\u4f53\u7684\u91cd\u8981\u6027\u3002"}, {"abstract": "Many real-world tasks require LLM agents to interact with their environments over long execution horizons. Errors that occur early in execution may propagate through both the agent context and environment state, and their effects may be difficult to reverse through subsequent actions. Existing methods mainly seek to reduce such errors through plan refinement and safety checks but provide little support after errors occur. To enable recovery during long-horizon execution, we present AgentRewind, a runtime recovery framework that records aligned checkpoints of the agent context and controlled environment, allowing agents to return to an earlier state and resume execution with information from previous attempts. We also construct MettleBench, a benchmark for evaluating task completion and partial progress on long-horizon engineering assignments containing a series of related requirements. Experiments across tasks, multiple models, execution strategies, and agent harnesses show that AgentRewind improves task success rate and average checklist progress over the compared baselines.", "arxiv_id": "2608.14380", "arxiv_url": "https://arxiv.org/abs/2608.14380", "authors": ["Yu Zhuang", "Kefei Chen", "Yitong Duan", "Shuxin Zheng", "Jian Li", "Xu-Yao Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa AgentRewind\uff0c\u4e00\u4e2a\u8fd0\u884c\u65f6\u6062\u590d\u6846\u67b6\uff0c\u53ef\u540c\u6b65\u8bb0\u5f55\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u4e0e\u53d7\u63a7\u73af\u5883\u72b6\u6001\u7684\u68c0\u67e5\u70b9\u3002\u5f53\u957f\u7a0b\u4efb\u52a1\u4e2d\u51fa\u73b0\u65e9\u671f\u9519\u8bef\u65f6\uff0c\u667a\u80fd\u4f53\u53ef\u56de\u9000\u5230\u5148\u524d\u72b6\u6001\uff0c\u5e76\u5229\u7528\u5931\u8d25\u5c1d\u8bd5\u4e2d\u7684\u4fe1\u606f\u7ee7\u7eed\u6267\u884c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14380", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u5bf9\u9f50\u4fdd\u5b58 agent context \u4e0e\u73af\u5883\u72b6\u6001\uff0c\u5b9e\u73b0\u771f\u6b63\u53ef\u6062\u590d\u7684\u957f\u7a0b\u6267\u884c", "\u6784\u5efa MettleBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u957f\u7a0b\u5de5\u7a0b\u4efb\u52a1\u4e2d\u7684\u4efb\u52a1\u5b8c\u6210\u7387\u4e0e\u5206\u6b65\u9aa4\u8fdb\u5c55", "\u5728\u591a\u79cd\u4efb\u52a1\u3001\u6a21\u578b\u3001\u6267\u884c\u7b56\u7565\u548c\u667a\u80fd\u4f53\u6846\u67b6\u4e0a\uff0c\u76f8\u6bd4\u57fa\u7ebf\u63d0\u5347\u6210\u529f\u7387\u4e0e\u5e73\u5747\u6e05\u5355\u8fdb\u5ea6"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1", "\u9519\u8bef\u6062\u590d", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14380v1", "published_at": "2026-08-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgentRewind: Recoverable Execution for Long-Horizon LLM Agents", "tldr": "\u4e3a\u957f\u7a0bLLM\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u56de\u6eda\u6062\u590d\u6267\u884c\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AgentRewind\uff0c\u4e00\u4e2a\u8fd0\u884c\u65f6\u6062\u590d\u6846\u67b6\uff0c\u53ef\u540c\u6b65\u8bb0\u5f55\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u4e0e\u53d7\u63a7\u73af\u5883\u72b6\u6001\u7684\u68c0\u67e5\u70b9\u3002\u5f53\u957f\u7a0b\u4efb\u52a1\u4e2d\u51fa\u73b0\u65e9\u671f\u9519\u8bef\u65f6\uff0c\u667a\u80fd\u4f53\u53ef\u56de\u9000\u5230\u5148\u524d\u72b6\u6001\uff0c\u5e76\u5229\u7528\u5931\u8d25\u5c1d\u8bd5\u4e2d\u7684\u4fe1\u606f\u7ee7\u7eed\u6267\u884c\u3002", "why_notable": "\u73b0\u6709\u65b9\u6cd5\u591a\u805a\u7126\u4e8e\u51cf\u5c11\u9519\u8bef\u53d1\u751f\uff0c\u800c AgentRewind \u5173\u6ce8\u9519\u8bef\u53d1\u751f\u540e\u7684\u6062\u590d\u80fd\u529b\uff0c\u5bf9\u771f\u5b9e\u957f\u7a0b\u667a\u80fd\u4f53\u4efb\u52a1\u66f4\u5b9e\u7528\uff0c\u5c24\u5176\u9002\u5408\u8f6f\u4ef6\u5de5\u7a0b\u3001\u7cfb\u7edf\u64cd\u4f5c\u7b49\u96be\u4ee5\u4e00\u6b21\u6210\u529f\u7684\u590d\u6742\u573a\u666f\u3002"}, {"abstract": "This paper integrates end-to-end Visual-Language-Action (VLA) models with agentic tool-use to propose Agentic Robot with Tool-use (ART). ART is a tool-injection framework that tunes any VLA model to leverage off-the-shelf tool modules for low-level vision, high-level affordance, and embodiment enhancement. Compared to vanilla VLA models with a whole continuous action solution space, ART reduces the complexity of the action solution space through tool-use, which not only improves generalizability across different tasks but also reduces data dependency. To demonstrate the advantages (high generalizability and low data dependency) of this framework, we first built a dataset of 30K tool-use trajectories and action demonstrations, which is much smaller than those used by baseline methods. We then designed a training regimen for long-trajectory tool-use reasoning in challenging environments. Experiments show that ART achieves a 20% higher success rate than mainstream baselines on simulation and real-world tasks, such as pick-and-place in the dark at novel viewpoints. Empirical results highlight the benefits of an agent-based approach: modular tool utilization enables more efficient training, lightweight deployment, and scalable integration of new tools. This design fosters robustness, adaptability, and extensibility, paving the way for the practical deployment of VLA systems in complex real-world scenarios.", "arxiv_id": "2608.14047", "arxiv_url": "https://arxiv.org/abs/2608.14047", "authors": ["Yi Ding", "Yanzhao Yu", "Xili Dai", "Xianbiao Qi", "Peiwen Sun", "Xueqian Wang", "Xiangyu Yue", "Jianan Wang"], "brief": "\u8bba\u6587\u63d0\u51fa Agentic Robot with Tool-use\uff08ART\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u5de5\u5177\u6ce8\u5165\u6846\u67b6\u3002\u5b83\u5c06\u73b0\u6210\u5de5\u5177\u6a21\u5757\u63a5\u5165VLA\uff0c\u7528\u4e8e\u4f4e\u5c42\u89c6\u89c9\u3001\u9ad8\u5c42\u53ef\u4f9b\u6027\u5224\u65ad\u548c\u5177\u8eab\u80fd\u529b\u589e\u5f3a\uff0c\u4f7f\u673a\u5668\u4eba\u80fd\u5728\u6267\u884c\u4e2d\u8fdb\u884c\u5de5\u5177\u4f7f\u7528\u63a8\u7406\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14047", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u7f29\u5c0f\u8fde\u7eed\u52a8\u4f5c\u89e3\u7a7a\u95f4\uff0c\u964d\u4f4e\u8bad\u7ec3\u6570\u636e\u4f9d\u8d56\u5e76\u63d0\u5347\u8de8\u4efb\u52a1\u6cdb\u5316\u80fd\u529b\u3002", "\u6784\u5efa\u4e86\u5305\u542b3\u4e07\u6761\u5de5\u5177\u4f7f\u7528\u8f68\u8ff9\u4e0e\u52a8\u4f5c\u793a\u8303\u7684\u6570\u636e\u96c6\uff0c\u5e76\u8bbe\u8ba1\u957f\u8f68\u8ff9\u5de5\u5177\u4f7f\u7528\u63a8\u7406\u8bad\u7ec3\u6d41\u7a0b\u3002", "\u5728\u4eff\u771f\u548c\u771f\u5b9e\u4efb\u52a1\u4e2d\u8f83\u4e3b\u6d41\u57fa\u7ebf\u6210\u529f\u7387\u63d0\u5347\u7ea620%\uff0c\u5305\u62ec\u9ed1\u6697\u73af\u5883\u3001\u65b0\u89c6\u89d2\u4e0b\u7684\u6293\u53d6\u653e\u7f6e\u7b49\u6311\u6218\u573a\u666f\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14047v1", "published_at": "2026-08-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Evolve Vision-Language-Action Model into an Agent with On-the-fly Tool-use", "tldr": "\u8ba9VLA\u673a\u5668\u4eba\u8fb9\u884c\u52a8\u8fb9\u8c03\u7528\u5de5\u5177\u63d0\u5347\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Agentic Robot with Tool-use\uff08ART\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u5de5\u5177\u6ce8\u5165\u6846\u67b6\u3002\u5b83\u5c06\u73b0\u6210\u5de5\u5177\u6a21\u5757\u63a5\u5165VLA\uff0c\u7528\u4e8e\u4f4e\u5c42\u89c6\u89c9\u3001\u9ad8\u5c42\u53ef\u4f9b\u6027\u5224\u65ad\u548c\u5177\u8eab\u80fd\u529b\u589e\u5f3a\uff0c\u4f7f\u673a\u5668\u4eba\u80fd\u5728\u6267\u884c\u4e2d\u8fdb\u884c\u5de5\u5177\u4f7f\u7528\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7aef\u5230\u7aefVLA\u6a21\u578b\u4e0e\u667a\u80fd\u4f53\u5f0f\u5de5\u5177\u4f7f\u7528\u7ed3\u5408\uff0c\u5c55\u793a\u4e86\u6a21\u5757\u5316\u5de5\u5177\u8c03\u7528\u53ef\u5e26\u6765\u66f4\u9ad8\u6548\u8bad\u7ec3\u3001\u8f7b\u91cf\u90e8\u7f72\u548c\u65b0\u5de5\u5177\u53ef\u6269\u5c55\u63a5\u5165\uff0c\u5bf9\u590d\u6742\u771f\u5b9e\u573a\u666f\u4e2d\u7684\u673a\u5668\u4eba\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM agents increasingly maintain personal memory across sessions, but it can conflict. Preferences depend on context, behavior evolves, and sources can conflict. When a query lacks context, time, or source authority to interpret conflict, treating one memory as definitive converts unresolved conflict into an unjustified, overconfident action. Existing benchmarks recover one answer from conflicting evidence, overlooking whether agents recognize underdetermination, preserve alternatives, seek missing information, and choose appropriate actions. We introduce \\underline{T}esting \\underline{A}gents\u0027 \\underline{N}avigation of \\underline{G}enuine, \\underline{L}atent, and \\underline{E}ntangled Memory Conflicts (\\textsc{TANGLE}), a benchmark for genuinely unresolvable memory conflicts. It comprises 541 instances across 40 personas and three types: Context-Partitioned Conflict (CPC), Behavior-Oscillation Conflict (BOC), and Source-Contradiction Conflict (SCC). We evaluate two tracks---an oracle track with curated memory and a pipeline track that extracts memory from multi-session dialogues---on five dimensions: conflict perception, causal reasoning, confidence calibration, clarification seeking, and memory faithfulness. Experiments reveal pipeline challenges. With curated memory, models recognize conflicts more reliably than they calibrate actions or seek targeted clarification. With end-to-end pipeline memory, extraction fails to preserve conflict-bearing relations needed for downstream reasoning. Policy comparisons show fixed rules are insufficient when actions must reflect conflict. These findings motivate Conflict-Aware Action Policy (CAAP), which adapts actions to each conflict using available evidence. \\textsc{TANGLE} frames conflict handling as recognizing underdetermination, retaining conflicting evidence, and acting without forcing a definitive answer.", "arxiv_id": "2608.13921", "arxiv_url": "https://arxiv.org/abs/2608.13921", "authors": ["Lu Yang", "Shusheng Xu", "Zhuoran Li", "Tongkai Yang", "Longbo Huang"], "brief": "\u8bba\u6587\u63d0\u51fa TANGLE\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u4e2a\u4eba\u8bb0\u5fc6\u51b2\u7a81\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4e13\u6ce8\u4e8e\u672c\u8d28\u4e0a\u65e0\u6cd5\u552f\u4e00\u5224\u5b9a\u7b54\u6848\u7684\u51b2\u7a81\u573a\u666f\u3002\u5b83\u8bc4\u4f30\u667a\u80fd\u4f53\u662f\u5426\u80fd\u8bc6\u522b\u6b20\u5b9a\u6027\u3001\u4fdd\u7559\u51b2\u7a81\u8bc1\u636e\u3001\u4e3b\u52a8\u6f84\u6e05\uff0c\u5e76\u907f\u514d\u8fc7\u5ea6\u81ea\u4fe1\u5730\u7ed9\u51fa\u5355\u4e00\u884c\u52a8\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13921", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["TANGLE \u5305\u542b 541 \u4e2a\u5b9e\u4f8b\u300140 \u4e2a\u4eba\u683c\u8bbe\u5b9a\uff0c\u8986\u76d6\u4e0a\u4e0b\u6587\u5206\u533a\u51b2\u7a81\u3001\u884c\u4e3a\u632f\u8361\u51b2\u7a81\u3001\u6765\u6e90\u77db\u76fe\u51b2\u7a81\u4e09\u7c7b\u8bb0\u5fc6\u51b2\u7a81\u3002", "\u8bc4\u6d4b\u5206\u4e3a oracle \u8bb0\u5fc6\u8f68\u9053\u548c\u7aef\u5230\u7aef pipeline \u8f68\u9053\uff0c\u5e76\u4ece\u51b2\u7a81\u611f\u77e5\u3001\u56e0\u679c\u63a8\u7406\u3001\u7f6e\u4fe1\u5ea6\u6821\u51c6\u3001\u6f84\u6e05\u63d0\u95ee\u3001\u8bb0\u5fc6\u5fe0\u5b9e\u6027\u4e94\u4e2a\u7ef4\u5ea6\u8003\u5bdf\u6a21\u578b\u3002", "\u5b9e\u9a8c\u53d1\u73b0\u6a21\u578b\u5373\u4f7f\u5728\u7ed9\u5b9a\u6574\u7406\u597d\u7684\u8bb0\u5fc6\u65f6\u4e5f\u66f4\u64c5\u957f\u8bc6\u522b\u51b2\u7a81\uff0c\u800c\u4e0d\u64c5\u957f\u6821\u51c6\u884c\u52a8\u6216\u63d0\u51fa\u9488\u5bf9\u6027\u6f84\u6e05\uff1b\u7aef\u5230\u7aef\u8bb0\u5fc6\u62bd\u53d6\u8fd8\u5e38\u4e22\u5931\u5173\u952e\u51b2\u7a81\u5173\u7cfb\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u671f\u8bb0\u5fc6", "\u8bc4\u6d4b\u57fa\u51c6", "\u53ef\u4fe1AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13921v1", "published_at": "2026-08-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "When Personal Memory Has No Single Answer: Evaluating LLM Agents under Irreducible Conflict", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u5982\u4f55\u5904\u7406\u65e0\u89e3\u7684\u8bb0\u5fc6\u51b2\u7a81", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TANGLE\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u667a\u80fd\u4f53\u4e2a\u4eba\u8bb0\u5fc6\u51b2\u7a81\u7684\u8bc4\u6d4b\u57fa\u51c6\uff0c\u4e13\u6ce8\u4e8e\u672c\u8d28\u4e0a\u65e0\u6cd5\u552f\u4e00\u5224\u5b9a\u7b54\u6848\u7684\u51b2\u7a81\u573a\u666f\u3002\u5b83\u8bc4\u4f30\u667a\u80fd\u4f53\u662f\u5426\u80fd\u8bc6\u522b\u6b20\u5b9a\u6027\u3001\u4fdd\u7559\u51b2\u7a81\u8bc1\u636e\u3001\u4e3b\u52a8\u6f84\u6e05\uff0c\u5e76\u907f\u514d\u8fc7\u5ea6\u81ea\u4fe1\u5730\u7ed9\u51fa\u5355\u4e00\u884c\u52a8\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u4e2a\u4eba\u8bb0\u5fc6\u4e2d\u7684\u51b2\u7a81\u4ece\u201c\u627e\u51fa\u6b63\u786e\u7b54\u6848\u201d\u8f6c\u5411\u201c\u627f\u8ba4\u65e0\u552f\u4e00\u7b54\u6848\u5e76\u8c28\u614e\u884c\u52a8\u201d\uff0c\u5207\u4e2d\u957f\u671f\u8bb0\u5fc6\u667a\u80fd\u4f53\u7684\u5b89\u5168\u6027\u4e0e\u53ef\u9760\u6027\u95ee\u9898\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u4fe1\u7684\u4e2a\u4eba\u52a9\u624b\u548c\u8bb0\u5fc6\u7ba1\u7406\u7b56\u7565\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present a survey of the past and future of AI Scientists: machines capable of automating science. AI Scientists can originate hypotheses, deduce their consequences, design and execute experiments, interpret their results, and revise their beliefs. Such systems are integrated scientific agents, connected to the literature, formal knowledge, mathematical models, simulations, data-analysis systems and physical laboratories. Adam was the first machine to make novel scientific discoveries through cycles of hypothesis formation and physical experimentation. Eve established the architecture of the modern self-driving laboratory. Foundation models, autonomous agents and laboratory robotics now make it possible to build systems far more general than either Adam or Eve. The central problem is no longer whether individual components of science can be automated. They can. The problem is integration. AI Scientists must combine neural learning with logic, probability, mathematics, causal reasoning, simulation, experimental design, robotics and formal scientific records. AI Scientists have the potential to transform science: to make science faster, cheaper, more systematic and more reproducible. AI Scientists could investigate systems too complicated for unaided human science, and enable thousands of AI scientists to work together on single problems. The Nobel Turing Challenge sets the goal of developing by 2050 AI systems capable of automating Nobel-quality discoveries. Progress is ahead of schedule. When we succeed it will create a new form of science and transform the world.", "arxiv_id": "2608.14407", "arxiv_url": "https://arxiv.org/abs/2608.14407", "authors": ["Ross D. King"], "brief": "\u672c\u6587\u7efc\u8ff0\u4e86\u53ef\u81ea\u52a8\u5316\u79d1\u5b66\u7814\u7a76\u7684\u201cAI\u79d1\u5b66\u5bb6\u201d\u7cfb\u7edf\uff0c\u4ece\u65e9\u671fAdam\u3001Eve\u5230\u57fa\u7840\u6a21\u578b\u3001\u81ea\u6cbb\u667a\u80fd\u4f53\u4e0e\u673a\u5668\u4eba\u5b9e\u9a8c\u5ba4\u7684\u53d1\u5c55\u3002\u8bba\u6587\u6307\u51fa\u5f53\u524d\u6838\u5fc3\u96be\u9898\u5df2\u4ece\u5355\u70b9\u81ea\u52a8\u5316\u8f6c\u5411\u5c06\u5b66\u4e60\u3001\u63a8\u7406\u3001\u5b9e\u9a8c\u3001\u4eff\u771f\u548c\u5b9e\u9a8c\u5ba4\u64cd\u4f5c\u6574\u5408\u4e3a\u95ed\u73af\u79d1\u5b66\u667a\u80fd\u4f53\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14407", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["AI\u79d1\u5b66\u5bb6\u5e94\u80fd\u63d0\u51fa\u5047\u8bbe\u3001\u63a8\u5bfc\u540e\u679c\u3001\u8bbe\u8ba1\u5e76\u6267\u884c\u5b9e\u9a8c\u3001\u89e3\u91ca\u7ed3\u679c\u5e76\u4fee\u6b63\u4fe1\u5ff5", "Adam\u9996\u6b21\u901a\u8fc7\u5047\u8bbe\u751f\u6210\u4e0e\u7269\u7406\u5b9e\u9a8c\u5faa\u73af\u505a\u51fa\u65b0\u53d1\u73b0\uff0cEve\u5960\u5b9a\u73b0\u4ee3\u81ea\u9a71\u52a8\u5b9e\u9a8c\u5ba4\u67b6\u6784", "\u672a\u6765\u7cfb\u7edf\u9700\u6574\u5408\u795e\u7ecf\u5b66\u4e60\u3001\u903b\u8f91\u3001\u6982\u7387\u3001\u6570\u5b66\u3001\u56e0\u679c\u63a8\u7406\u3001\u4eff\u771f\u3001\u5b9e\u9a8c\u8bbe\u8ba1\u3001\u673a\u5668\u4eba\u548c\u5f62\u5f0f\u5316\u79d1\u5b66\u8bb0\u5f55"], "keywords": ["AI\u79d1\u5b66\u5bb6", "\u667a\u80fd\u4f53", "\u81ea\u52a8\u5316\u79d1\u5b66", "\u673a\u5668\u4eba\u5b9e\u9a8c\u5ba4"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14407v1", "published_at": "2026-08-14", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "The Past and Future of AI Scientists", "tldr": "\u7efc\u8ff0AI\u79d1\u5b66\u5bb6\u7684\u5386\u53f2\u3001\u67b6\u6784\u4e0e\u672a\u6765\u6311\u6218", "upvotes": 0, "what_it_is": "\u672c\u6587\u7efc\u8ff0\u4e86\u53ef\u81ea\u52a8\u5316\u79d1\u5b66\u7814\u7a76\u7684\u201cAI\u79d1\u5b66\u5bb6\u201d\u7cfb\u7edf\uff0c\u4ece\u65e9\u671fAdam\u3001Eve\u5230\u57fa\u7840\u6a21\u578b\u3001\u81ea\u6cbb\u667a\u80fd\u4f53\u4e0e\u673a\u5668\u4eba\u5b9e\u9a8c\u5ba4\u7684\u53d1\u5c55\u3002\u8bba\u6587\u6307\u51fa\u5f53\u524d\u6838\u5fc3\u96be\u9898\u5df2\u4ece\u5355\u70b9\u81ea\u52a8\u5316\u8f6c\u5411\u5c06\u5b66\u4e60\u3001\u63a8\u7406\u3001\u5b9e\u9a8c\u3001\u4eff\u771f\u548c\u5b9e\u9a8c\u5ba4\u64cd\u4f5c\u6574\u5408\u4e3a\u95ed\u73af\u79d1\u5b66\u667a\u80fd\u4f53\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u7cfb\u7edf\u68b3\u7406\u4e86\u81ea\u52a8\u5316\u79d1\u5b66\u4ece\u4e13\u7528\u7cfb\u7edf\u5230\u901a\u7528AI\u79d1\u5b66\u5bb6\u7684\u6f14\u8fdb\uff0c\u5e76\u5f3a\u8c03\u201c\u96c6\u6210\u201d\u662f\u8fc8\u5411\u8bfa\u8d1d\u5c14\u7ea7\u81ea\u52a8\u53d1\u73b0\u7684\u5173\u952e\u74f6\u9888\uff0c\u5bf9AI\u667a\u80fd\u4f53\u3001\u81ea\u52a8\u5316\u5b9e\u9a8c\u5ba4\u548c\u79d1\u5b66\u53d1\u73b0\u8303\u5f0f\u5177\u6709\u91cd\u8981\u6307\u5bfc\u610f\u4e49\u3002"}, {"abstract": "Spreadsheets are widely used to organize, analyze, and manipulate semi-structured data, yet automated spreadsheet reasoning remains challenging for large language models (LLMs). Real-world workbooks often contain implicit cross-table associations, fine-grained column dependencies, and complex spatial layouts. Existing methods typically flatten these multidimensional structures into sequential strings, losing important intra-sheet boundaries and inter-sheet semantics. Consequently, LLMs cannot exploit the global spatial context that human experts naturally use when inspecting spreadsheets. We propose SheetCompass, a graph-guided and memory-driven agentic framework for spreadsheet reasoning and automation. SheetCompass explicitly models structural relationships within and across worksheets while maintaining task-relevant information in memory, enabling agents to reason more effectively over complex workbooks.", "arxiv_id": "2608.14452", "arxiv_url": "https://arxiv.org/abs/2608.14452", "authors": ["Panjing He", "Mingyue Cheng", "Yucong Luo", "Li Li", "Xiaohan Zhang"], "brief": "SheetCompass \u662f\u4e00\u4e2a\u9762\u5411\u7535\u5b50\u8868\u683c\u63a8\u7406\u4e0e\u81ea\u52a8\u5316\u7684\u56fe\u5f15\u5bfc\u3001\u8bb0\u5fc6\u9a71\u52a8\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u663e\u5f0f\u5efa\u6a21\u5de5\u4f5c\u8868\u5185\u5916\u7684\u7ed3\u6784\u5173\u7cfb\uff0c\u5e76\u4fdd\u7559\u4efb\u52a1\u76f8\u5173\u8bb0\u5fc6\uff0c\u4ee5\u5904\u7406\u590d\u6742\u5de5\u4f5c\u7c3f\u4e2d\u7684\u7a7a\u95f4\u5e03\u5c40\u548c\u8de8\u8868\u8bed\u4e49\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14452", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7535\u5b50\u8868\u683c\u4e2d\u7684\u5355\u5143\u683c\u3001\u5217\u3001\u8868\u533a\u548c\u8de8\u5de5\u4f5c\u8868\u5173\u8054\u5efa\u6a21\u4e3a\u5c42\u6b21\u5316\u5173\u7cfb\u56fe\uff0c\u907f\u514d\u7b80\u5355\u5e8f\u5217\u5316\u4e22\u5931\u7ed3\u6784\u4fe1\u606f", "\u5229\u7528\u8bb0\u5fc6\u673a\u5236\u4fdd\u5b58\u4efb\u52a1\u76f8\u5173\u4e0a\u4e0b\u6587\uff0c\u652f\u6301\u667a\u80fd\u4f53\u5728\u590d\u6742\u5de5\u4f5c\u7c3f\u4e2d\u8fdb\u884c\u591a\u6b65\u63a8\u7406\u4e0e\u81ea\u52a8\u5316\u64cd\u4f5c", "\u9488\u5bf9\u771f\u5b9e\u8868\u683c\u4e2d\u7684\u9690\u5f0f\u8de8\u8868\u5173\u8054\u3001\u7ec6\u7c92\u5ea6\u5217\u4f9d\u8d56\u548c\u590d\u6742\u7a7a\u95f4\u5e03\u5c40\uff0c\u63d0\u4f9b\u66f4\u63a5\u8fd1\u4eba\u7c7b\u4e13\u5bb6\u7684\u5168\u5c40\u7ed3\u6784\u7406\u89e3"], "keywords": ["\u667a\u80fd\u4f53", "\u8868\u683c\u63a8\u7406", "\u56fe\u7ed3\u6784", "\u529e\u516c\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14452v1", "published_at": "2026-08-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SheetCompass: Hierarchical Relation Graphs for Agentic Spreadsheet Reasoning", "tldr": "\u7528\u5c42\u6b21\u5173\u7cfb\u56fe\u589e\u5f3a\u8868\u683c\u667a\u80fd\u4f53\u63a8\u7406", "upvotes": 0, "what_it_is": "SheetCompass \u662f\u4e00\u4e2a\u9762\u5411\u7535\u5b50\u8868\u683c\u63a8\u7406\u4e0e\u81ea\u52a8\u5316\u7684\u56fe\u5f15\u5bfc\u3001\u8bb0\u5fc6\u9a71\u52a8\u667a\u80fd\u4f53\u6846\u67b6\u3002\u5b83\u663e\u5f0f\u5efa\u6a21\u5de5\u4f5c\u8868\u5185\u5916\u7684\u7ed3\u6784\u5173\u7cfb\uff0c\u5e76\u4fdd\u7559\u4efb\u52a1\u76f8\u5173\u8bb0\u5fc6\uff0c\u4ee5\u5904\u7406\u590d\u6742\u5de5\u4f5c\u7c3f\u4e2d\u7684\u7a7a\u95f4\u5e03\u5c40\u548c\u8de8\u8868\u8bed\u4e49\u3002", "why_notable": "\u7535\u5b50\u8868\u683c\u662f\u4f01\u4e1a\u6570\u636e\u5206\u6790\u548c\u529e\u516c\u81ea\u52a8\u5316\u7684\u6838\u5fc3\u573a\u666f\uff0c\u4f46\u73b0\u6709 LLM \u65b9\u6cd5\u5e38\u56e0\u5c55\u5e73\u8f93\u5165\u800c\u5ffd\u7565\u7a7a\u95f4\u4e0e\u7ed3\u6784\u8bed\u4e49\u3002\u8be5\u5de5\u4f5c\u5c06\u56fe\u7ed3\u6784\u548c\u667a\u80fd\u4f53\u8bb0\u5fc6\u7ed3\u5408\uff0c\u6709\u671b\u663e\u8457\u63d0\u5347\u590d\u6742\u5de5\u4f5c\u7c3f\u7406\u89e3\u3001\u95ee\u7b54\u548c\u81ea\u52a8\u5316\u5904\u7406\u80fd\u529b\u3002"}, {"abstract": "Large language models have made natural language interfaces to databases (NLIDB) newly credible, but LLM text-to-SQL systems fail in a way that matters for deployment: a hallucinated column or a mis-aggregated total yields a fluent wrong answer, indistinguishable at the point of use from a right one. Where the consumer cannot inspect the generated query, as in enterprise AI deployments and operational dashboards, and increasingly where the consumer is a tool-using agent rather than a person, accuracy alone is insufficient: nothing marks which answers to distrust. This is a reliability problem before it is an accuracy problem. We propose an architectural pattern for such systems, a trusted kernel with a generative shell, resting on one invariant: a component that can fabricate may influence which question the system answers, never which value it returns. A generative shell interprets underspecified input and phrases replies; a deterministic kernel matches fully specified questions against a bounded set of answerable question shapes and compiles them to queries by deterministic execution. The two meet at a confirmation the user reads before any value is computed, and requests the kernel cannot express are declined rather than approximated. We call this structural abstention, and distinguish it from the statistical abstention of selective prediction and calibrated confidence: refusal here needs no confidence estimate, because unanswerable requests are unrepresentable. We specify the pattern implementation-independently, give a five-decision recipe and work it across three domains, extend the invariant from returned values to the actions of agentic systems, and report a two-year production case study alongside two generative alternatives, a fine-tuned parser and a tool-retrieval agent. We close against enterprise and reliability benchmarks published since.", "arxiv_id": "2608.13926", "arxiv_url": "https://arxiv.org/abs/2608.13926", "authors": ["Zhelun", "Wu"], "brief": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa\u201c\u53ef\u4fe1\u5185\u6838+\u751f\u6210\u5f0f\u5916\u58f3\u201d\u7684NLIDB\u67b6\u6784\uff1aLLM\u53ea\u8d1f\u8d23\u89e3\u91ca\u610f\u56fe\u548c\u8868\u8ff0\u56de\u7b54\uff0c\u771f\u6b63\u8fd4\u56de\u6570\u503c\u7531\u786e\u5b9a\u6027\u5185\u6838\u5728\u53ef\u8868\u8fbe\u95ee\u9898\u96c6\u5408\u5185\u6267\u884c\u3002\u7cfb\u7edf\u5bf9\u65e0\u6cd5\u7ed3\u6784\u5316\u8868\u8fbe\u7684\u8bf7\u6c42\u76f4\u63a5\u62d2\u7b54\uff0c\u800c\u4e0d\u662f\u8fd1\u4f3c\u751f\u6210\u3002", "categories": ["cs.AI", "cs.CL", "cs.DB"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13926", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u751f\u6210\u5f0f\u7ec4\u4ef6\u53ef\u5f71\u54cd\u201c\u56de\u7b54\u54ea\u4e2a\u95ee\u9898\u201d\uff0c\u4f46\u4e0d\u80fd\u5f71\u54cd\u201c\u8fd4\u56de\u4ec0\u4e48\u503c\u201d\uff0c\u907f\u514d\u5e7b\u89c9\u5217\u540d\u3001\u9519\u8bef\u805a\u5408\u7b49\u88ab\u5f53\u4f5c\u4e8b\u5b9e\u6d88\u8d39", "\u5728\u8ba1\u7b97\u4efb\u4f55\u6570\u503c\u524d\uff0c\u7cfb\u7edf\u8981\u6c42\u7528\u6237\u786e\u8ba4\u5df2\u5b8c\u5168\u6307\u5b9a\u7684\u95ee\u9898\uff1b\u5185\u6838\u53ea\u80fd\u5339\u914d\u6709\u9650\u7684\u95ee\u9898\u5f62\u6001\u5e76\u786e\u5b9a\u6027\u7f16\u8bd1\u4e3a\u67e5\u8be2", "\u533a\u522b\u4e8e\u57fa\u4e8e\u7f6e\u4fe1\u5ea6\u7684\u7edf\u8ba1\u62d2\u7b54\uff0c\u7ed3\u6784\u6027\u62d2\u7b54\u901a\u8fc7\u4e0d\u53ef\u8868\u793a\u5373\u62d2\u7edd\u5b9e\u73b0\uff0c\u65e0\u9700\u6821\u51c6\u6982\u7387\uff1b\u5e76\u7ed9\u51fa\u4e24\u5e74\u751f\u4ea7\u6848\u4f8b\u548c\u751f\u6210\u5f0f\u66ff\u4ee3\u65b9\u6848\u5bf9\u6bd4"], "keywords": ["\u6570\u636e\u5e93\u95ee\u7b54", "\u53ef\u4fe1AI", "\u7ed3\u6784\u5316\u62d2\u7b54", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13926v1", "published_at": "2026-08-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Never the Number: Structural Abstention for AI Systems Whose Answers Are Consumed as Fact", "tldr": "\u7528\u7ed3\u6784\u6027\u62d2\u7b54\u907f\u514dAI\u7f16\u9020\u6570\u636e\u5e93\u7b54\u6848", "upvotes": 0, "what_it_is": "\u2460\u6838\u5fc3\u5185\u5bb9\uff1a\u8bba\u6587\u63d0\u51fa\u201c\u53ef\u4fe1\u5185\u6838+\u751f\u6210\u5f0f\u5916\u58f3\u201d\u7684NLIDB\u67b6\u6784\uff1aLLM\u53ea\u8d1f\u8d23\u89e3\u91ca\u610f\u56fe\u548c\u8868\u8ff0\u56de\u7b54\uff0c\u771f\u6b63\u8fd4\u56de\u6570\u503c\u7531\u786e\u5b9a\u6027\u5185\u6838\u5728\u53ef\u8868\u8fbe\u95ee\u9898\u96c6\u5408\u5185\u6267\u884c\u3002\u7cfb\u7edf\u5bf9\u65e0\u6cd5\u7ed3\u6784\u5316\u8868\u8fbe\u7684\u8bf7\u6c42\u76f4\u63a5\u62d2\u7b54\uff0c\u800c\u4e0d\u662f\u8fd1\u4f3c\u751f\u6210\u3002", "why_notable": "\u2462\u4e3a\u4f55\u503c\u5f97\u5173\u6ce8\uff1a\u5b83\u628aText-to-SQL\u7684\u53ef\u9760\u6027\u95ee\u9898\u4ece\u201c\u63d0\u9ad8\u51c6\u786e\u7387\u201d\u8f6c\u5411\u201c\u9632\u6b62\u4e0d\u53ef\u4fe1\u7b54\u6848\u8fdb\u5165\u4e8b\u5b9e\u6d88\u8d39\u94fe\u201d\uff0c\u5bf9\u4f01\u4e1a\u4eea\u8868\u76d8\u3001\u6570\u636e\u5e93\u95ee\u7b54\u548c\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53\u90fd\u6709\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "In the current artificial intelligence-driven innovation era, the pace of knowledge growth is accelerating, and is hard to keep up with. While generative models are increasingly used to synthesize content, they often lack in information grounding. To address these peculiarities of our time, we propose Wyvern, a multi-agent framework for the automated generation of grounded, multimodal technical reports. Wyvern allows for the generation of multimodal outputs, integrating images, tables, and text with supporting references in a unified report. Additionally, a particular focus is placed on the grounding of the content, with the implementation of a claims auto-revision stage. We conduct a human evaluation study to assess the quality of our proposed framework. The results show that the figures\u0027 informativeness is perceived as superior to that of a recent baseline in 87% of cases. Furthermore, Wyvern\u0027s reports are rated as more useful than those produced by three alternative methods in 63% to 100% of instances. We also carry out automatic evaluations showing that Wyvern gains up to 2.3$\\times$ in citation recall and 1.6$\\times$ in citation precision with respect to the baselines.", "arxiv_id": "2608.14446", "arxiv_url": "https://arxiv.org/abs/2608.14446", "authors": ["Beatrice Alessandra Motetti", "Emilien Guandalino", "Daniele Jahier Pagliari", "Alessio Burrello", "Lorenz K. M\u00fcller", "Konstantin Berestizshevsky", "Lukas Cavigelli"], "brief": "Wyvern \u662f\u4e00\u4e2a\u7528\u4e8e\u81ea\u52a8\u751f\u6210\u6280\u672f\u62a5\u544a\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u7edf\u4e00\u6574\u5408\u6587\u672c\u3001\u56fe\u50cf\u3001\u8868\u683c\u4e0e\u53c2\u8003\u6587\u732e\u3002\u5b83\u7279\u522b\u52a0\u5165\u58f0\u660e\u81ea\u52a8\u4fee\u8ba2\u9636\u6bb5\uff0c\u4ee5\u63d0\u5347\u62a5\u544a\u5185\u5bb9\u7684\u4e8b\u5b9e grounding \u548c\u5f15\u7528\u652f\u6491\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14446", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u652f\u6301\u751f\u6210\u591a\u6a21\u6001\u62a5\u544a\uff0c\u5c06\u56fe\u8868\u3001\u56fe\u7247\u3001\u6587\u672c\u548c\u53c2\u8003\u6587\u732e\u7ec4\u7ec7\u6210\u7edf\u4e00\u8f93\u51fa", "\u5f15\u5165 claims auto-revision \u673a\u5236\uff0c\u5bf9\u62a5\u544a\u4e2d\u7684\u58f0\u660e\u8fdb\u884c\u81ea\u52a8\u6821\u9a8c\u4e0e\u4fee\u8ba2\uff0c\u589e\u5f3a\u4fe1\u606f grounding", "\u4eba\u5de5\u8bc4\u6d4b\u663e\u793a\u5176\u56fe\u50cf\u4fe1\u606f\u91cf\u5728 87% \u6848\u4f8b\u4e2d\u4f18\u4e8e\u8fd1\u671f\u57fa\u7ebf\uff0c\u62a5\u544a\u5b9e\u7528\u6027\u5728 63% \u5230 100% \u60c5\u51b5\u4e0b\u4f18\u4e8e\u4e09\u79cd\u66ff\u4ee3\u65b9\u6cd5\uff1b\u81ea\u52a8\u8bc4\u6d4b\u4e2d\u5f15\u7528\u53ec\u56de\u6700\u9ad8\u63d0\u5347 2.3 \u500d\u3001\u5f15\u7528\u7cbe\u5ea6\u63d0\u5347 1.6 \u500d"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u68c0\u7d22\u589e\u5f3a", "\u62a5\u544a\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14446v1", "published_at": "2026-08-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Wyvern: An Agentic Framework for Generating Grounded Multimodal Reports", "tldr": "\u591a\u667a\u80fd\u4f53\u751f\u6210\u6709\u5f15\u7528\u652f\u6491\u7684\u591a\u6a21\u6001\u6280\u672f\u62a5\u544a", "upvotes": 0, "what_it_is": "Wyvern \u662f\u4e00\u4e2a\u7528\u4e8e\u81ea\u52a8\u751f\u6210\u6280\u672f\u62a5\u544a\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u7edf\u4e00\u6574\u5408\u6587\u672c\u3001\u56fe\u50cf\u3001\u8868\u683c\u4e0e\u53c2\u8003\u6587\u732e\u3002\u5b83\u7279\u522b\u52a0\u5165\u58f0\u660e\u81ea\u52a8\u4fee\u8ba2\u9636\u6bb5\uff0c\u4ee5\u63d0\u5347\u62a5\u544a\u5185\u5bb9\u7684\u4e8b\u5b9e grounding \u548c\u5f15\u7528\u652f\u6491\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u77e5\u8bc6\u5feb\u901f\u589e\u957f\u4e0b\u7684\u6280\u672f\u62a5\u544a\u81ea\u52a8\u5316\u9700\u6c42\uff0c\u5f3a\u8c03\u751f\u6210\u5185\u5bb9\u7684\u53ef\u8ffd\u6eaf\u6027\u548c\u591a\u6a21\u6001\u8868\u8fbe\uff0c\u63d0\u5347\u4e86 AI \u751f\u6210\u62a5\u544a\u5728\u79d1\u7814\u3001\u4ea7\u4e1a\u8c03\u7814\u548c\u6280\u672f\u6587\u6863\u573a\u666f\u4e2d\u7684\u53ef\u4fe1\u5ea6\u4e0e\u5b9e\u7528\u6027\u3002"}, {"abstract": "We study proactive exploration in LLM agents, i.e., the ability to explore an environment to acquire information that improves future decision-making. In this regard, we first identify two fundamental bottlenecks that hinder this capability and then propose \\ours, a novel method designed to instill and refine proactive exploration. Specifically, \\ours\\ consists of two components: (1) Exploratory Data Construction, which synthesizes exploration-rich trajectories to mitigate the hindsight bias of standard demonstrations; and (2) RL Optimization with Contrastive Signal Guidance, which leverages contrastive trajectory pairs to distinguish productive exploration from redundant wandering. Extensive experiments demonstrate the effectiveness of \\ours\\ and provide insights into the characteristics of proactive exploration. Our code is available at: https://github.com/GuanZhizhao/SAFARI.", "arxiv_id": "2608.14339", "arxiv_url": "https://arxiv.org/abs/2608.14339", "authors": ["Zhizhao Guan", "Chen Huang", "Ziming Liu", "Hongru Liang", "Wenqiang Lei", "See-Kiong Ng", "Tat-Seng Chua", "Anthony G Cohn"], "brief": "\u8bba\u6587\u7814\u7a76LLM\u667a\u80fd\u4f53\u7684\u4e3b\u52a8\u63a2\u7d22\u80fd\u529b\uff0c\u5373\u5728\u884c\u52a8\u524d\u4e3b\u52a8\u83b7\u53d6\u6709\u52a9\u4e8e\u540e\u7eed\u51b3\u7b56\u7684\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51faSAFARI\uff0c\u901a\u8fc7\u6784\u9020\u5bcc\u542b\u63a2\u7d22\u884c\u4e3a\u7684\u6570\u636e\u5e76\u7ed3\u5408\u5bf9\u6bd4\u4fe1\u53f7\u5f3a\u5316\u5b66\u4e60\uff0c\u8bad\u7ec3\u667a\u80fd\u4f53\u533a\u5206\u6709\u6548\u63a2\u7d22\u4e0e\u65e0\u6548\u6e38\u8361\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14339", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u6807\u51c6\u793a\u8303\u6570\u636e\u5b58\u5728\u540e\u89c1\u4e4b\u660e\u504f\u5dee\uff0c\u96be\u4ee5\u6559\u4f1a\u667a\u80fd\u4f53\u5728\u4fe1\u606f\u4e0d\u8db3\u65f6\u4e3b\u52a8\u63a2\u7d22\u3002", "\u63d0\u51faExploratory Data Construction\uff0c\u5408\u6210\u5305\u542b\u9ad8\u4ef7\u503c\u63a2\u7d22\u884c\u4e3a\u7684\u8f68\u8ff9\u3002", "\u63d0\u51fa\u5e26\u5bf9\u6bd4\u4fe1\u53f7\u6307\u5bfc\u7684RL\u4f18\u5316\uff0c\u7528\u8f68\u8ff9\u5bf9\u6bd4\u533a\u5206\u6709\u76ca\u63a2\u7d22\u548c\u5197\u4f59\u5f98\u5f8a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u63a2\u7d22", "LLM"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14339v1", "published_at": "2026-08-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Clearing the Fog: Towards Installing and Refining Proactive Exploration Capabilities in LLM Agents", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u5b66\u4f1a\u4e3b\u52a8\u63a2\u7d22\u73af\u5883\u4fe1\u606f\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76LLM\u667a\u80fd\u4f53\u7684\u4e3b\u52a8\u63a2\u7d22\u80fd\u529b\uff0c\u5373\u5728\u884c\u52a8\u524d\u4e3b\u52a8\u83b7\u53d6\u6709\u52a9\u4e8e\u540e\u7eed\u51b3\u7b56\u7684\u4fe1\u606f\u3002\u4f5c\u8005\u63d0\u51faSAFARI\uff0c\u901a\u8fc7\u6784\u9020\u5bcc\u542b\u63a2\u7d22\u884c\u4e3a\u7684\u6570\u636e\u5e76\u7ed3\u5408\u5bf9\u6bd4\u4fe1\u53f7\u5f3a\u5316\u5b66\u4e60\uff0c\u8bad\u7ec3\u667a\u80fd\u4f53\u533a\u5206\u6709\u6548\u63a2\u7d22\u4e0e\u65e0\u6548\u6e38\u8361\u3002", "why_notable": "\u4e3b\u52a8\u63a2\u7d22\u662fLLM Agent\u4ece\u88ab\u52a8\u6267\u884c\u8d70\u5411\u81ea\u4e3b\u51b3\u7b56\u7684\u5173\u952e\u80fd\u529b\uff0cSAFARI\u4e3a\u8bad\u7ec3\u53ef\u5728\u672a\u77e5\u73af\u5883\u4e2d\u6536\u96c6\u4fe1\u606f\u3001\u6539\u5584\u540e\u7eed\u51b3\u7b56\u7684\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u53ef\u64cd\u4f5c\u65b9\u6cd5\u3002"}, {"abstract": "In today\u0027s fast-paced environment, the ability to swiftly access, understand, and act on data is no longer optional; it is essential. Yet most organizations remain data-rich but insight-poor, constrained by the complexity of querying, interpreting, and explaining enterprise-scale information. We present Polaris, a supervisor-led multi-agent framework for conversational enterprise analytics that bridges this gap. Polaris introduces Dynamic Task Coordination (DTC), a decision-theoretic orchestration layer that models agent-task assignment as adaptive bipartite matching, enabling real-time coordination, recovery, and optimization across specialized agents for querying, visualization, and reasoning. By coupling DTC with reason-first, ReAct-style agents, Polaris transforms natural-language queries into coherent analytical workflows that not only retrieve and visualize data but also explain the underlying \"why.\" Evaluation on structured enterprise datasets demonstrates high semantic fidelity and answer relevancy, underscoring the potential of multi-agent orchestration to deliver trustworthy, end-to-end business intelligence at scale.", "arxiv_id": "2608.14246", "arxiv_url": "https://arxiv.org/abs/2608.14246", "authors": ["Varuni H K", "Soham Sarkar", "Jay Kumar", "Goutham Krishnan", "Tanvi Johari", "Avinash Bharadwaj", "Santosh Hegde"], "brief": "\u8bba\u6587\u63d0\u51fa Polaris\uff0c\u4e00\u4e2a\u7531\u76d1\u7763\u8005\u534f\u8c03\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7528\u4e8e\u5c06\u81ea\u7136\u8bed\u8a00\u95ee\u9898\u8f6c\u5316\u4e3a\u4f01\u4e1a\u6570\u636e\u67e5\u8be2\u3001\u53ef\u89c6\u5316\u4e0e\u89e3\u91ca\u6d41\u7a0b\u3002\u5176\u6838\u5fc3\u662f\u52a8\u6001\u4efb\u52a1\u534f\u8c03\u673a\u5236 DTC\uff0c\u53ef\u5728\u4e13\u7528\u667a\u80fd\u4f53\u4e4b\u95f4\u5b9e\u65f6\u5206\u914d\u3001\u6062\u590d\u548c\u4f18\u5316\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14246", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["DTC \u5c06\u667a\u80fd\u4f53-\u4efb\u52a1\u5206\u914d\u5efa\u6a21\u4e3a\u81ea\u9002\u5e94\u4e8c\u5206\u56fe\u5339\u914d\uff0c\u652f\u6301\u52a8\u6001\u7f16\u6392\u4e0e\u5bb9\u9519\u6062\u590d", "\u7ed3\u5408 reason-first \u4e0e ReAct \u98ce\u683c\u667a\u80fd\u4f53\uff0c\u8986\u76d6\u67e5\u8be2\u3001\u53ef\u89c6\u5316\u3001\u63a8\u7406\u89e3\u91ca\u7b49\u5206\u6790\u73af\u8282", "\u5728\u7ed3\u6784\u5316\u4f01\u4e1a\u6570\u636e\u96c6\u4e0a\u8bc4\u4f30\uff0c\u5c55\u793a\u8f83\u9ad8\u8bed\u4e49\u4e00\u81f4\u6027\u4e0e\u7b54\u6848\u76f8\u5173\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u4f01\u4e1a\u5206\u6790", "\u591a\u667a\u80fd\u4f53", "\u6570\u636e\u53ef\u89c6\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14246v1", "published_at": "2026-08-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Polaris : Multi Agentic System for Conversational Enterprise Analytics", "tldr": "\u9762\u5411\u4f01\u4e1a\u5206\u6790\u7684\u591a\u667a\u80fd\u4f53\u5bf9\u8bdd\u6846\u67b6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Polaris\uff0c\u4e00\u4e2a\u7531\u76d1\u7763\u8005\u534f\u8c03\u7684\u591a\u667a\u80fd\u4f53\u7cfb\u7edf\uff0c\u7528\u4e8e\u5c06\u81ea\u7136\u8bed\u8a00\u95ee\u9898\u8f6c\u5316\u4e3a\u4f01\u4e1a\u6570\u636e\u67e5\u8be2\u3001\u53ef\u89c6\u5316\u4e0e\u89e3\u91ca\u6d41\u7a0b\u3002\u5176\u6838\u5fc3\u662f\u52a8\u6001\u4efb\u52a1\u534f\u8c03\u673a\u5236 DTC\uff0c\u53ef\u5728\u4e13\u7528\u667a\u80fd\u4f53\u4e4b\u95f4\u5b9e\u65f6\u5206\u914d\u3001\u6062\u590d\u548c\u4f18\u5316\u4efb\u52a1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u667a\u80fd\u4f53\u7f16\u6392\u5f15\u5165\u4f01\u4e1a\u5546\u4e1a\u667a\u80fd\u573a\u666f\uff0c\u5f3a\u8c03\u4ece\u81ea\u7136\u8bed\u8a00\u5230\u7aef\u5230\u7aef\u53ef\u4fe1\u5206\u6790\u7684\u81ea\u52a8\u5316\uff0c\u5177\u6709\u964d\u4f4e\u6570\u636e\u5206\u6790\u95e8\u69db\u548c\u63d0\u5347\u4f01\u4e1a\u51b3\u7b56\u6548\u7387\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Autonomous LLM agents are increasingly deployed in complex real-world workflows, yet they remain vulnerable to runtime behavioral drift, a silent deviation from the original task that can lead to irreversible side effects on external systems. Existing approaches address drift at the prompt level but lack structured mechanisms for step-level detection, risk assessment, and recovery decision. Because the main task-executing agent is often a large and expensive model that cannot be re-trained on every deployment, this work targets a plug-and-play recovery module instead. It introduces a graph-based framework in which a single small language model is trained via reinforcement learning to specialize at each node of a recovery graph, external to the main agent. Each node has a precise role\\,: drift classification, operation detection, risk evaluation, or final decision and the model learns to produce structured XML-formatted reasoning adapted to that role. Training combines rule-based structural rewards with an LLM-as-judge semantic-quality signal, so that the model is graded both on how it answers (schema and length) and on what it says. Experiments on the public AppWorld benchmark show that the method generally exploits information about the suspected drift onset to issue correct recovery decisions using a small language model. In addition, the trained small language model reliably respects the prescribed output schema and produces semantically appropriate content in each field according to its assigned node role.", "arxiv_id": "2608.14109", "arxiv_url": "https://arxiv.org/abs/2608.14109", "authors": ["Ismail El Hamraoui", "Sagar Jose", "Nicolas Bureau", "Robert Plana"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u5916\u7f6e\u4e8e\u4e3bLLM\u667a\u80fd\u4f53\u7684\u56fe\u7ed3\u6784\u6062\u590d\u6846\u67b6\uff0c\u7528\u5355\u4e2a\u5c0f\u8bed\u8a00\u6a21\u578b\u5728\u4e0d\u540c\u8282\u70b9\u627f\u62c5\u6f02\u79fb\u5206\u7c7b\u3001\u64cd\u4f5c\u68c0\u6d4b\u3001\u98ce\u9669\u8bc4\u4f30\u4e0e\u6062\u590d\u51b3\u7b56\u7b49\u89d2\u8272\u3002\u8be5\u5c0f\u6a21\u578b\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u5b66\u4e60\u6309\u8282\u70b9\u8f93\u51fa\u7ed3\u6784\u5316XML\u63a8\u7406\uff0c\u4ece\u800c\u5b9e\u73b0\u8fd0\u884c\u65f6\u6f02\u79fb\u7684\u68c0\u6d4b\u3001\u8bc4\u4f30\u4e0e\u6062\u590d\u3002", "categories": ["cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14109", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u6062\u590d\u6d41\u7a0b\u5efa\u6a21\u4e3a\u56fe\uff0c\u6bcf\u4e2a\u8282\u70b9\u5bf9\u5e94\u660e\u786e\u804c\u8d23\uff1a\u6f02\u79fb\u5206\u7c7b\u3001\u64cd\u4f5c\u68c0\u6d4b\u3001\u98ce\u9669\u8bc4\u4f30\u6216\u6700\u7ec8\u51b3\u7b56", "\u8bad\u7ec3\u5956\u52b1\u7ed3\u5408\u89c4\u5219\u5316\u7ed3\u6784\u5956\u52b1\u4e0eLLM-as-judge\u8bed\u4e49\u8d28\u91cf\u8bc4\u5206\uff0c\u540c\u65f6\u7ea6\u675f\u8f93\u51fa\u683c\u5f0f\u3001\u957f\u5ea6\u4e0e\u5185\u5bb9\u5408\u7406\u6027", "\u5728AppWorld\u57fa\u51c6\u4e0a\uff0c\u5c0f\u6a21\u578b\u80fd\u5229\u7528\u7591\u4f3c\u6f02\u79fb\u8d77\u70b9\u4fe1\u606f\u505a\u51fa\u8f83\u51c6\u786e\u6062\u590d\u51b3\u7b56\uff0c\u5e76\u7a33\u5b9a\u9075\u5b88XML\u8f93\u51fa\u6a21\u5f0f"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u6f02\u79fb\u68c0\u6d4b", "\u98ce\u9669\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14109v1", "published_at": "2026-08-14", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Graph-Based Reinforcement Learning Framework for Structured Drift Diagnosis and Recovery in Autonomous LLM Agents", "tldr": "\u7528\u5c0f\u6a21\u578b\u56fe\u5f0f\u5f3a\u5316\u5b66\u4e60\u8bca\u65ad\u5e76\u6062\u590dLLM\u667a\u80fd\u4f53\u6f02\u79fb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u4e00\u4e2a\u5916\u7f6e\u4e8e\u4e3bLLM\u667a\u80fd\u4f53\u7684\u56fe\u7ed3\u6784\u6062\u590d\u6846\u67b6\uff0c\u7528\u5355\u4e2a\u5c0f\u8bed\u8a00\u6a21\u578b\u5728\u4e0d\u540c\u8282\u70b9\u627f\u62c5\u6f02\u79fb\u5206\u7c7b\u3001\u64cd\u4f5c\u68c0\u6d4b\u3001\u98ce\u9669\u8bc4\u4f30\u4e0e\u6062\u590d\u51b3\u7b56\u7b49\u89d2\u8272\u3002\u8be5\u5c0f\u6a21\u578b\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u5b66\u4e60\u6309\u8282\u70b9\u8f93\u51fa\u7ed3\u6784\u5316XML\u63a8\u7406\uff0c\u4ece\u800c\u5b9e\u73b0\u8fd0\u884c\u65f6\u6f02\u79fb\u7684\u68c0\u6d4b\u3001\u8bc4\u4f30\u4e0e\u6062\u590d\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4e0d\u9700\u8981\u91cd\u8bad\u6602\u8d35\u7684\u4e3b\u4efb\u52a1LLM\uff0c\u800c\u662f\u63d0\u4f9b\u53ef\u63d2\u62d4\u7684\u5c0f\u6a21\u578b\u6062\u590d\u6a21\u5757\uff0c\u9762\u5411\u771f\u5b9e\u5de5\u4f5c\u6d41\u4e2d\u667a\u80fd\u4f53\u884c\u4e3a\u6f02\u79fb\u7684\u6b65\u9aa4\u7ea7\u8bca\u65ad\u4e0e\u98ce\u9669\u63a7\u5236\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present a Test-time World-model Inference (Twin) system, in which a frontier coding agent writes an executable world model for completing continual learning tasks, such as ARC-AGI-3 games. Traditional approaches hand-engineer such models, one custom design per task. Each game hides its rules and goal, and our system constructs them from simulation and interaction alone. Its inductive prior over grid games is strong enough to recover the true transitions of the game and the goal on nearly all levels. Replay validation happens in a twin world model. The harness enforces that an action is not made until the program reproduces every previous observed game transition. Each mismatch between a world model prediction and the actual action result becomes a counterexample that is used to repair the world model. Twin clears 179 out of 183 levels (97.8%), and does so more efficiently than humans in 158 out of 179 levels (88.3%). The system infers the goal before any reward on 156 of the levels it clears (87.2%), and in the remaining levels automatically discovers the goal by search. The benchmark scores completion and action efficiency, between 0 and 100, against humans playing each game for the first time. Played directly, the base model scores only 7.8%; an off-the-shelf harness increases it to 61.1%, whereas our twin world model increases the same base model to 93.3%, clearing 23 out of 25 games. Building a usable world model is simpler than anticipated, whereas the harder problem is inferring the right goal.", "arxiv_id": "2608.14490", "arxiv_url": "https://arxiv.org/abs/2608.14490", "authors": ["Alexy Skoutnev", "Kirill Acharya", "Gaston Longhitano", "Madeleine Udell", "Kevin Ellis", "Iddo Drori"], "brief": "\u8bba\u6587\u63d0\u51fa Twin\uff1a\u8ba9\u524d\u6cbf\u7f16\u7801\u667a\u80fd\u4f53\u5728\u6d4b\u8bd5\u65f6\u4e3a\u672a\u77e5\u7f51\u683c\u6e38\u620f\u7f16\u5199\u53ef\u6267\u884c\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u7528\u4ea4\u4e92\u53cd\u9988\u6301\u7eed\u4fee\u6b63\u3002\u7cfb\u7edf\u5728\u6bcf\u6b21\u884c\u52a8\u524d\u8981\u6c42\u6a21\u578b\u590d\u73b0\u5168\u90e8\u5386\u53f2\u8f6c\u79fb\uff0c\u518d\u5728\u6570\u5b57\u5b6a\u751f\u4e2d\u9a8c\u8bc1\u4e0e\u89c4\u5212\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14490", "impact_score": 9, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u4eff\u771f\u4e0e\u4ea4\u4e92\u4ece\u96f6\u63a8\u65ad\u6e38\u620f\u89c4\u5219\u548c\u76ee\u6807\uff0c\u65e0\u9700\u4e3a\u6bcf\u4e2a\u4efb\u52a1\u624b\u5de5\u8bbe\u8ba1\u4e16\u754c\u6a21\u578b", "\u9884\u6d4b\u4e0e\u771f\u5b9e\u884c\u52a8\u7ed3\u679c\u4e0d\u4e00\u81f4\u65f6\uff0c\u5c06 mismatch \u4f5c\u4e3a\u53cd\u4f8b\u81ea\u52a8\u4fee\u590d\u4e16\u754c\u6a21\u578b", "\u5728 ARC-AGI-3 \u7c7b\u4efb\u52a1\u4e2d\u901a\u5173 179/183 \u5173\uff1b\u540c\u4e00\u57fa\u5ea7\u6a21\u578b\u76f4\u63a5\u73a9\u4ec5 7.8%\uff0c\u4f7f\u7528 Twin \u540e\u5f97\u5206\u8fbe 93.3%"], "keywords": ["\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u63a8\u7406", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14490v1", "published_at": "2026-08-14", "score": 0.225, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": null, "title": "Twin: Playing an Unknown Game with a Test-Time Digital Twin", "tldr": "\u6d4b\u8bd5\u65f6\u6784\u5efa\u6570\u5b57\u5b6a\u751f\u73a9\u672a\u77e5\u6e38\u620f", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Twin\uff1a\u8ba9\u524d\u6cbf\u7f16\u7801\u667a\u80fd\u4f53\u5728\u6d4b\u8bd5\u65f6\u4e3a\u672a\u77e5\u7f51\u683c\u6e38\u620f\u7f16\u5199\u53ef\u6267\u884c\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u7528\u4ea4\u4e92\u53cd\u9988\u6301\u7eed\u4fee\u6b63\u3002\u7cfb\u7edf\u5728\u6bcf\u6b21\u884c\u52a8\u524d\u8981\u6c42\u6a21\u578b\u590d\u73b0\u5168\u90e8\u5386\u53f2\u8f6c\u79fb\uff0c\u518d\u5728\u6570\u5b57\u5b6a\u751f\u4e2d\u9a8c\u8bc1\u4e0e\u89c4\u5212\u3002", "why_notable": "\u5c55\u793a\u4e86\u6d4b\u8bd5\u65f6\u7531 LLM/\u7f16\u7801\u667a\u80fd\u4f53\u81ea\u52a8\u6784\u5efa\u53ef\u6267\u884c\u4e16\u754c\u6a21\u578b\u7684\u5f3a\u5927\u6548\u679c\uff0c\u5c06\u6301\u7eed\u5b66\u4e60\u3001\u76ee\u6807\u63a8\u65ad\u548c\u89c4\u5212\u7ed3\u5408\u8d77\u6765\uff0c\u663e\u8457\u63d0\u5347\u672a\u77e5\u6e38\u620f\u4e2d\u7684\u6837\u672c\u6548\u7387\u4e0e\u901a\u5173\u7387\u3002"}, {"abstract": "Interactive game world models typically autoregress visual observations directly in pixel or latent space, forcing structured properties such as pose, geometry, and occlusion to be implicitly maintained by the same generative sequence. Over long horizons, errors in these latent world properties accumulate, making consistency and controllability fragile. We explicitly model the evolving world state, delegate exact geometric computation to a fixed, zero-parameter renderer, and leave the neural model to synthesize appearance. We instantiate this idea as Marionette, a world model for interactive games with articulated characters. First, a two-stage autoregressive dynamics model predicts an explicit and interpretable 276-dimensional 3D world state comprising multi-entity articulated skeletons, metric root trajectories, and rotations. Second, a zero-parameter graphics bridge converts the predicted state into pose-control videos, computing world-space geometry and occlusion in closed form. Third, a control-conditioned video-diffusion observation model synthesizes photorealistic RGB observations from the resulting structured controls. Our experiments establish two properties of Marionette. First, the predicted world state is directly controllable. Forcing a mismatched action stream changes root-aligned joint error by 31% across 48 held-out segments. Second, long-horizon behaviour is determined in the state, and can be repaired there. Left free, the two generated characters drift to 21.2 m apart (recorded sessions stay near 5 m) and a third of frames show ground penetration. Two rules imposed on the explicit state, a terrain collider and a separation cap, cut penetration by 66% and keep the pair engaged, with no change to the observation model. Routing appearance through the predicted state costs no fidelity we can detect, at an FVD of 831 against 799 for recorded pose.", "arxiv_id": "2608.14530", "arxiv_url": "https://arxiv.org/abs/2608.14530", "authors": ["Zian Meng", "Zhen Li", "Chuanhao Li", "Qiang Li", "Kaipeng Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Marionette\uff0c\u4e00\u79cd\u9762\u5411\u4ea4\u4e92\u5f0f\u6e38\u620f\u7684\u4e16\u754c\u6a21\u578b\uff1a\u5148\u81ea\u56de\u5f52\u9884\u6d4b\u53ef\u89e3\u91ca\u76843D\u4e16\u754c\u72b6\u6001\uff0c\u518d\u7528\u96f6\u53c2\u6570\u6e32\u67d3\u5668\u8ba1\u7b97\u51e0\u4f55\u4e0e\u906e\u6321\uff0c\u6700\u540e\u7531\u6761\u4ef6\u89c6\u9891\u6269\u6563\u6a21\u578b\u751f\u6210\u903c\u771f\u753b\u9762\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14530", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7528\u4e24\u9636\u6bb5\u81ea\u56de\u5f52\u52a8\u529b\u5b66\u6a21\u578b\u9884\u6d4b276\u7ef43D\u4e16\u754c\u72b6\u6001\uff0c\u5305\u542b\u591a\u5b9e\u4f53\u9aa8\u67b6\u3001\u6839\u8f68\u8ff9\u4e0e\u65cb\u8f6c\u3002", "\u56fa\u5b9a\u96f6\u53c2\u6570\u56fe\u5f62\u6865\u663e\u5f0f\u5904\u7406\u4e16\u754c\u7a7a\u95f4\u51e0\u4f55\u3001\u59ff\u6001\u63a7\u5236\u4e0e\u906e\u6321\uff0c\u51cf\u8f7b\u795e\u7ecf\u6a21\u578b\u957f\u671f\u7ef4\u62a4\u7ed3\u6784\u7684\u8d1f\u62c5\u3002", "\u5728\u663e\u5f0f\u72b6\u6001\u4e0a\u52a0\u5165\u5730\u5f62\u78b0\u649e\u5668\u548c\u89d2\u8272\u8ddd\u79bb\u7ea6\u675f\uff0c\u53ef\u51cf\u5c1166%\u7a7f\u5730\u5e76\u4fdd\u6301\u89d2\u8272\u4e92\u52a8\uff0c\u4e14\u65e0\u9700\u6539\u52a8\u89c2\u5bdf\u751f\u6210\u6a21\u578b\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "3D\u5efa\u6a21"], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14530v1", "published_at": "2026-08-14", "score": 0.204, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.14530.png", "title": "Marionette: Predicting World States, Rendering Geometry, Painting Appearance", "tldr": "\u663e\u5f0f3D\u72b6\u6001\u63d0\u5347\u6e38\u620f\u4e16\u754c\u6a21\u578b\u53ef\u63a7\u6027\u3002", "upvotes": 2, "what_it_is": "\u8bba\u6587\u63d0\u51fa Marionette\uff0c\u4e00\u79cd\u9762\u5411\u4ea4\u4e92\u5f0f\u6e38\u620f\u7684\u4e16\u754c\u6a21\u578b\uff1a\u5148\u81ea\u56de\u5f52\u9884\u6d4b\u53ef\u89e3\u91ca\u76843D\u4e16\u754c\u72b6\u6001\uff0c\u518d\u7528\u96f6\u53c2\u6570\u6e32\u67d3\u5668\u8ba1\u7b97\u51e0\u4f55\u4e0e\u906e\u6321\uff0c\u6700\u540e\u7531\u6761\u4ef6\u89c6\u9891\u6269\u6563\u6a21\u578b\u751f\u6210\u903c\u771f\u753b\u9762\u3002", "why_notable": "\u5b83\u628a\u201c\u72b6\u6001\u9884\u6d4b\u3001\u51e0\u4f55\u8ba1\u7b97\u3001\u5916\u89c2\u751f\u6210\u201d\u89e3\u8026\uff0c\u63d0\u5347\u4e86\u957f\u65f6\u5e8f\u4e00\u81f4\u6027\u3001\u53ef\u63a7\u6027\u4e0e\u53ef\u4fee\u590d\u6027\uff0c\u4e3a\u6e38\u620f\u4e16\u754c\u6a21\u578b\u548c\u53ef\u4ea4\u4e92\u89c6\u9891\u751f\u6210\u63d0\u4f9b\u4e86\u66f4\u7ed3\u6784\u5316\u7684\u8def\u7ebf\u3002"}, {"abstract": "Self-evolving agents improve future behavior from interaction experience, yet existing evaluations typically optimize under fixed execution conditions and do not test recovery after those conditions change. To address this gap, we introduce PACE-Bench (Physics Adaptation via Code Evolution), a simulator-grounded benchmark of 144 source-to-target adaptation pairs across six physics domains. Each pair links a source environment to a mutated target environment with the same goal and interface. A code-driven design that succeeds in the source fails in the target, where agents must iteratively adapt it into a working target design using diagnostic sandbox feedback within a limited attempt budget. We compare ten self-evolving methods from four paradigms. The benchmark remains far from saturated: Reflexion + Qwen3-14B succeeds on only 35.9\\% of full-benchmark pairs, while GPT-5.5 solves 66.7\\% of the Statics subset under the full budget. Together, these results show that simulator-grounded reflection is more reliable than unverified self-revision, while memory anchors agents to early designs and broad tree search explores without converging. Even revealing exact physical changes does not raise the performance ceiling, pointing to mechanism redesign rather than parameter inference as the central bottleneck. Data and code are available at https://github.com/thunlp/PACE-Bench.", "arxiv_id": "2608.14441", "arxiv_url": "https://arxiv.org/abs/2608.14441", "authors": ["Yuhao Zhan", "Bingxiang He", "Zecong Tang", "Chaojun Xiao"], "brief": "\u8bba\u6587\u63d0\u51fa PACE-Bench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6a21\u62df\u5668\u7684\u52a8\u6001\u7269\u7406\u73af\u5883\u9002\u5e94\u57fa\u51c6\uff0c\u5305\u542b\u516d\u4e2a\u7269\u7406\u9886\u57df\u7684 144 \u7ec4\u6e90\u5230\u76ee\u6807\u73af\u5883\u53d8\u5f02\u4efb\u52a1\u3002\u667a\u80fd\u4f53\u9700\u5728\u6709\u9650\u5c1d\u8bd5\u6b21\u6570\u5185\uff0c\u6839\u636e\u6c99\u76d2\u8bca\u65ad\u53cd\u9988\u4fee\u6539\u4ee3\u7801\u8bbe\u8ba1\uff0c\u4f7f\u539f\u672c\u5728\u6e90\u73af\u5883\u6210\u529f\u4f46\u5728\u76ee\u6807\u73af\u5883\u5931\u8d25\u7684\u65b9\u6848\u91cd\u65b0\u53ef\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14441", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u57fa\u51c6\u8986\u76d6 144 \u4e2a\u6e90-\u76ee\u6807\u9002\u5e94\u5bf9\uff0c\u76ee\u6807\u4e0e\u63a5\u53e3\u4fdd\u6301\u4e00\u81f4\uff0c\u4f46\u7269\u7406\u6761\u4ef6\u53d1\u751f\u53d8\u5f02\uff0c\u4e13\u95e8\u6d4b\u8bd5\u73af\u5883\u53d8\u5316\u540e\u7684\u6062\u590d\u4e0e\u673a\u5236\u91cd\u8bbe\u8ba1\u80fd\u529b\u3002", "\u6bd4\u8f83\u4e86\u56db\u7c7b\u8303\u5f0f\u4e0b\u7684\u5341\u79cd\u81ea\u8fdb\u5316\u65b9\u6cd5\uff0c\u5f53\u524d\u8868\u73b0\u8fdc\u672a\u9971\u548c\uff1aReflexion + Qwen3-14B \u5168\u57fa\u51c6\u6210\u529f\u7387\u4ec5 35.9%\u3002", "\u5b9e\u9a8c\u663e\u793a\uff0c\u57fa\u4e8e\u6a21\u62df\u5668\u9a8c\u8bc1\u7684\u53cd\u601d\u6bd4\u672a\u9a8c\u8bc1\u81ea\u6211\u4fee\u8ba2\u66f4\u53ef\u9760\uff1b\u8bb0\u5fc6\u673a\u5236\u6613\u951a\u5b9a\u65e9\u671f\u8bbe\u8ba1\uff0c\u5bbd\u6cdb\u6811\u641c\u7d22\u5219\u63a2\u7d22\u591a\u4f46\u96be\u6536\u655b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u6d4b\u8bd5", "\u4ee3\u7801\u751f\u6210", "\u7269\u7406\u4eff\u771f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14441v1", "published_at": "2026-08-14", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PACE-Bench: Benchmarking Physics Adaptation via Code Evolution in Dynamic Environments", "tldr": "\u8bc4\u6d4b\u667a\u80fd\u4f53\u5728\u7269\u7406\u53d8\u5316\u540e\u81ea\u8fdb\u5316\u9002\u5e94\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PACE-Bench\uff0c\u4e00\u4e2a\u57fa\u4e8e\u6a21\u62df\u5668\u7684\u52a8\u6001\u7269\u7406\u73af\u5883\u9002\u5e94\u57fa\u51c6\uff0c\u5305\u542b\u516d\u4e2a\u7269\u7406\u9886\u57df\u7684 144 \u7ec4\u6e90\u5230\u76ee\u6807\u73af\u5883\u53d8\u5f02\u4efb\u52a1\u3002\u667a\u80fd\u4f53\u9700\u5728\u6709\u9650\u5c1d\u8bd5\u6b21\u6570\u5185\uff0c\u6839\u636e\u6c99\u76d2\u8bca\u65ad\u53cd\u9988\u4fee\u6539\u4ee3\u7801\u8bbe\u8ba1\uff0c\u4f7f\u539f\u672c\u5728\u6e90\u73af\u5883\u6210\u529f\u4f46\u5728\u76ee\u6807\u73af\u5883\u5931\u8d25\u7684\u65b9\u6848\u91cd\u65b0\u53ef\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u81ea\u8fdb\u5316\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u9759\u6001\u4f18\u5316\u63a8\u8fdb\u5230\u52a8\u6001\u73af\u5883\u9002\u5e94\uff0c\u63ed\u793a\u73b0\u6709\u65b9\u6cd5\u7684\u6838\u5fc3\u74f6\u9888\u4e0d\u662f\u8bc6\u522b\u53c2\u6570\u53d8\u5316\uff0c\u800c\u662f\u80fd\u5426\u91cd\u65b0\u8bbe\u8ba1\u6709\u6548\u673a\u5236\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u3001\u4ee3\u7801\u667a\u80fd\u4f53\u548c\u81ea\u52a8\u5de5\u7a0b\u8bbe\u8ba1\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Neuron- and path-level interventions offer the finest-grained route to defending large language models (LLMs) against jailbreak attacks, yet existing methods fall short of this promise, i.e., they often compromise model utility significantly. Specifically, one line of work suppresses toxic neurons to erase harmful semantics, but since such semantics are distributed across the network, blocking every pathway forces a large intervention footprint. An alternative line of research focus on identify safety neurons using external classifiers. While promising, the existing approaches suffer from compromising neurons that are important for the model utility as well. Moreover, both approaches remain always on and thus perturb every benign request even when no attack is present. To address these limitations, we present \\ours{}, a training-free defense that first identifies safety-specific neurons through per-neuron hypothesis tests under false-discovery-rate control together with a utility-specificity filter. Based on this identification, a trigger-style clamp holds the selected neurons at their harmful-conditional mean activations, injecting an internal harmful-input signal that triggers the refusal behavior learned during alignment. The clamp is then realized by two provably equivalent deployment modes, namely a detector-gated inference-time intervention and an offline bias-patch weight edit. Extensive experiments across four safety-aligned LLMs and four representative attacks demonstrate that \\ours{} reduces the average attack success rate to at most 2.0\\% while incurring a utility drop of only 0.5\\% to 5.3\\% on MT-Bench, the smallest among
