u6210\u5b89\u5168\u57fa\u51c6\u6570\u636e\u96c6", "\u5728 3B \u5230 7B \u7684\u4e09\u4e2a\u5f00\u6e90\u4ee3\u7801 LLM \u4e0a\u6700\u9ad8\u8fbe\u5230 0.98 AUROC\uff0c\u5e76\u663e\u8457\u4f18\u4e8e\u9759\u6001\u5206\u6790\u57fa\u7ebf"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u6a21\u578b\u5b89\u5168", "\u5f71\u54cd\u51fd\u6570", "\u5f02\u5e38\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14303v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Detecting Contaminated Code-Generation Prompt Batches via Influence Functions", "tldr": "\u7528\u5f71\u54cd\u51fd\u6570\u68c0\u6d4b\u6076\u610f\u4ee3\u7801\u751f\u6210\u63d0\u793a\u6279\u6b21", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CodeSIFT\uff0c\u4e00\u79cd\u4e0d\u4f9d\u8d56\u7279\u5b9a\u5a01\u80c1\u6a21\u578b\u7684\u4ee3\u7801\u751f\u6210\u63d0\u793a\u6279\u6b21\u68c0\u6d4b\u65b9\u6cd5\u3002\u5b83\u901a\u8fc7\u5f71\u54cd\u51fd\u6570\u8861\u91cf\u751f\u6210\u4ee3\u7801\u5bf9\u6a21\u578b\u53c2\u6570\u7a7a\u95f4\u7684\u5f71\u54cd\uff0c\u5e76\u7528\u7edf\u8ba1\u68c0\u9a8c\u5224\u65ad\u5019\u9009\u63d0\u793a\u96c6\u662f\u5426\u504f\u79bb\u826f\u6027\u5206\u5e03\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u53ef\u5728\u672a\u77e5\u653b\u51fb\u7c7b\u578b\u4e0b\u53d1\u73b0\u6c61\u67d3\u63d0\u793a\u6279\u6b21\uff0c\u51cf\u5c11\u5bf9\u9884\u5b9a\u4e49\u6f0f\u6d1e\u89c4\u5219\u7684\u4f9d\u8d56\uff0c\u5bf9\u4ee3\u7801\u751f\u6210\u5b89\u5168\u9632\u62a4\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "The majority of work on summarization evaluation focuses on general summary quality (e.g., ROUGE, BERTScore) or specific desired properties (e.g., readability, factuality). However, these metrics fail to measure the utility of a summary to an individual user. For example, a biomedical researcher learning about the latest vaccine research will have different informational needs from a family doctor. Query-focused summarization captures part of this need, but in practice, users rarely state everything relevant in a query: a single short query is likely inadequate to distinguish the needs of a researcher from those of a physician. By contrast, a reader\u0027s background or persona (their role and expertise) is comparatively stable across queries and recovers much of this missing context, which makes it a practical signal for assessing whether a summary satisfies that reader\u0027s needs. In this work, we assess how sensitive popular summarization metrics are to both informational and persona differences, and find that many popular metrics, including strong LLM-as-judge metrics, fail basic perturbation tests of informational content. We additionally conduct an expert human evaluation, measuring summary preferences based on information satisfaction given a specific person\u0027s background and use case. We find that both traditional and LLM-based metrics are insufficient measures of information satisfaction and agree poorly with human judgment.", "arxiv_id": "2608.14457", "arxiv_url": "https://arxiv.org/abs/2608.14457", "authors": ["Isabel Cachola", "William Walden", "Reno Kriz", "Mark Dredze"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u4fe1\u606f\u6ee1\u8db3\u5ea6\u201d\u4f5c\u4e3a\u6458\u8981\u8bc4\u4f30\u7684\u65b0\u8f74\uff0c\u5f3a\u8c03\u6458\u8981\u662f\u5426\u6ee1\u8db3\u7279\u5b9a\u8bfb\u8005\u80cc\u666f\u3001\u89d2\u8272\u4e0e\u4f7f\u7528\u573a\u666f\u4e0b\u7684\u4fe1\u606f\u9700\u6c42\u3002\u4f5c\u8005\u68c0\u9a8c\u4e86\u4f20\u7edf\u6307\u6807\u548c LLM-as-judge \u6307\u6807\u5bf9\u4fe1\u606f\u5dee\u5f02\u4e0e\u8bfb\u8005 persona \u5dee\u5f02\u7684\u654f\u611f\u6027\uff0c\u5e76\u901a\u8fc7\u4e13\u5bb6\u4eba\u5de5\u8bc4\u4f30\u9a8c\u8bc1\u5176\u4e0d\u8db3\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14457", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa ROUGE\u3001BERTScore\u3001\u53ef\u8bfb\u6027\u3001\u4e8b\u5b9e\u6027\u7b49\u5e38\u89c1\u6307\u6807\u96be\u4ee5\u8861\u91cf\u6458\u8981\u5bf9\u4e2a\u4f53\u7528\u6237\u7684\u5b9e\u9645\u6548\u7528", "\u53d1\u73b0\u5305\u62ec\u5f3a LLM-as-judge \u5728\u5185\u7684\u591a\u79cd\u6307\u6807\u65e0\u6cd5\u901a\u8fc7\u57fa\u672c\u7684\u4fe1\u606f\u5185\u5bb9\u6270\u52a8\u6d4b\u8bd5", "\u4e13\u5bb6\u4eba\u5de5\u8bc4\u4f30\u663e\u793a\uff0c\u73b0\u6709\u4f20\u7edf\u4e0e LLM \u8bc4\u4f30\u6307\u6807\u548c\u4eba\u7c7b\u5bf9\u201c\u4fe1\u606f\u6ee1\u8db3\u5ea6\u201d\u7684\u504f\u597d\u4e00\u81f4\u6027\u8f83\u5dee"], "keywords": ["\u6587\u672c\u6458\u8981", "\u8bc4\u4f30\u6307\u6807", "\u4e2a\u6027\u5316", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14457v1", "published_at": "2026-08-14", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Information Satisfaction: A Reader-Centered Axis for Summarization Evaluation", "tldr": "\u63d0\u51fa\u9762\u5411\u8bfb\u8005\u9700\u6c42\u7684\u6458\u8981\u8bc4\u4f30\u7ef4\u5ea6", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u201c\u4fe1\u606f\u6ee1\u8db3\u5ea6\u201d\u4f5c\u4e3a\u6458\u8981\u8bc4\u4f30\u7684\u65b0\u8f74\uff0c\u5f3a\u8c03\u6458\u8981\u662f\u5426\u6ee1\u8db3\u7279\u5b9a\u8bfb\u8005\u80cc\u666f\u3001\u89d2\u8272\u4e0e\u4f7f\u7528\u573a\u666f\u4e0b\u7684\u4fe1\u606f\u9700\u6c42\u3002\u4f5c\u8005\u68c0\u9a8c\u4e86\u4f20\u7edf\u6307\u6807\u548c LLM-as-judge \u6307\u6807\u5bf9\u4fe1\u606f\u5dee\u5f02\u4e0e\u8bfb\u8005 persona \u5dee\u5f02\u7684\u654f\u611f\u6027\uff0c\u5e76\u901a\u8fc7\u4e13\u5bb6\u4eba\u5de5\u8bc4\u4f30\u9a8c\u8bc1\u5176\u4e0d\u8db3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u6458\u8981\u8bc4\u4f30\u4ece\u901a\u7528\u8d28\u91cf\u8f6c\u5411\u8bfb\u8005\u4e2d\u5fc3\u7684\u5b9e\u9645\u4fe1\u606f\u9700\u6c42\uff0c\ the environment. The evolution of the complete predicted trajectory can therefore provide complementary information beyond endpoint distance. To address these limitations, we propose Traj-LeWM, which retains LeWM\u0027s local-dynamics objective and endpoint score while introducing a goal-conditioned latent trajectory cost (LTC) that aggregates trajectory-level information as a complementary signal. During training, LTC-based trajectory-preference supervision complements next-step prediction in shaping the shared representation. During planning, LTC is combined with endpoint distance to incorporate intermediate-path information into candidate ranking. With joint endpoint-plus-LTC scoring, Traj-LeWM outperforms LeWM on Push-T, OGBench-Cube, Reacher, and Two-Room by $3$, $14$, $7$, and $7$ percentage points, respectively. Controlled experiments and ablations further verify the complementary roles of trajectory-level representation shaping and path-aware candidate ranking.", "arxiv_id": "2608.14125", "arxiv_url": "https://arxiv.org/abs/2608.14125", "authors": ["Xiaodi Huang", "Ziyi Ding", "Jingtian Wan", "Yuchen Liu", "Yuan Zhang", "Xiao-Ping Zhang", "Jiayu Chen", "Zhang Zhang", "Tao Huang"], "brief": "\u8bba\u6587\u63d0\u51fa Traj-LeWM\uff0c\u5728\u8f7b\u91cf\u7ea7\u89c6\u89c9\u4e16\u754c\u6a21\u578b LeWM \u57fa\u7840\u4e0a\u52a0\u5165\u76ee\u6807\u6761\u4ef6\u7684\u6f5c\u5728\u8f68\u8ff9\u4ee3\u4ef7\uff08LTC\uff09\u3002\u5b83\u4e0d\u4ec5\u770b\u9884\u6d4b\u7ec8\u70b9\u5230\u76ee\u6807\u7684\u8ddd\u79bb\uff0c\u8fd8\u5229\u7528\u5b8c\u6574\u9884\u6d4b\u8def\u5f84\u7684\u4fe1\u606f\u6765\u8bad\u7ec3\u8868\u793a\u5e76\u6392\u5e8f\u5019\u9009\u52a8\u4f5c\u5e8f\u5217\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14125", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4fdd\u7559 LeWM \u7684\u5c40\u90e8\u4e00\u6b65\u52a8\u529b\u5b66\u5b66\u4e60\u4e0e\u7ec8\u70b9\u8ddd\u79bb\u8bc4 encourage people to explore the potential of using agents in chip design. The core question is what kind of AI we really need in such a sophisticated industry. To this end, we bring the idea of modeling a chip-design superintelligence as an enormous \\textit{AI-organization}.", "arxiv_id": "2608.14035", "arxiv_url": "https://arxiv.org/abs/2608.14035", "authors": ["Linyang Li"], "brief": "\u8bba\u6587\u63a2\u8ba8LLM\u4e0e\u5de5\u5177\u578b\u667a\u80fd\u4f53\u5728\u81ea\u4e3b\u82af\u7247\u8bbe\u8ba1\u4e2d\u7684\u89d2\u8272\uff0c\u63d0\u51fa\u5c06\u82af\u7247\u8bbe\u8ba1\u8d85\u7ea7\u667a\u80fd\u89c6\u4e3a\u7531\u5927\u91cf\u667a\u80fd\u4f53\u534f\u4f5c\u6784\u6210\u7684\u201cAI\u7ec4\u7ec7\u201d\u3002\u6838\u5fc3\u5173\u6ce8\u70b9\u4e0d\u662f\u5355\u4e2a\u667a\u80fd\u4f53\u80fd\u529b\uff0c\u800c\u662f\u5982\u4f55\u7f16\u6392\u591a\u667a\u80fd\u4f53\u5b8c\u6210\u590d\u6742\u5de5\u4e1a\u6d41\u7a0b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14035", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u9762\u5411\u82af\u7247\u8bbe\u8ba1\u8fd9\u4e00\u9ad8\u5ea6\u590d\u6742\u3001\u957f\u6d41\u7a0b\u884c\u4e1a\uff0c\u8ba8\u8bba\u6240\u9700AI\u5f62\u6001", "\u63d0\u51faAgent-Orchestration\u601d\u8def\uff0c\u7528\u7ec4\u7ec7\u5316\u65b9\u5f0f\u534f\u8c03\u4e0d\u540c\u4e13\u957f\u667a\u80fd\u4f53", "\u5f3a\u8c03LLM\u3001\u5de5\u5177\u8c03\u7528\u4e0e\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u5728\u8bbe\u8ba1\u81ea\u52a8\u5316\u4e2d\u7684\u6f5c\u529b"], "keywords": ["\u667a\u80fd\u4f53", "\u82af\u7247\u8bbe\u8ba1", "\u591a\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14035v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Agent-Orchestration in Autonomous Chip Design", "tldr": "\u5c06\u82af\u7247\u8bbe\u8ba1\u8d85\u7ea7\u667a\u80fd\u5efa\u6a21\u4e3aAI\u7ec4\u7ec7", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63a2\u8ba8LLM\u4e0e\u5de5\u5177\u578b\u667a\u80fd\u4f53\u5728\u81ea\u4e3b\u82af\u7247\u8bbe\u8ba1\u4e2d\u7684\u89d2\u8272\uff0c\u63d0\u51fa\u5c06\u82af\u7247\u8bbe\u8ba1\u8d85\u7ea7\u667a\u80fd\u89c6\u4e3a\u7531\u5927\u91cf\u667a\u80fd\u4f53\u534f\u4f5c\u6784\u6210\u7684\u201cAI\u7ec4\u7ec7\u201d\u3002\u6838\u5fc3\u5173\u6ce8\u70b9\u4e0d\u662f\u5355\u4e2a\u667a\u80fd\u4f53\u80fd\u529b\uff0c\u800c\u662f\u5982\u4f55\u7f16\u6392\u591a\u667a\u80fd\u4f53\u5b8c\u6210\u590d\u6742\u5de5\u4e1a\u6d41\u7a0b\u3002", "why_notable": "\u82af\u7247\u8bbe\u8ba1\u662fAI\u843d\u5730\u96be\u5ea6\u6781\u9ad8\u4f46\u4ef7\u503c\u5de8\u5927\u7684\u9886\u57df\uff0c\u8be5\u5de5\u4f5c\u5c06\u95ee\u9898\u4ece\u201c\u5355\u4e00\u6a21\u578b\u66ff\u4ee3\u5de5\u7a0b\u5e08\u201d\u8f6c\u5411\u201c\u667a\u80fd\u4f53\u7ec4\u7ec7\u534f\u540c\u201d\uff0c\u4e3a\u672a\u6765\u81ea\u4e3bEDA\u548cAI\u9a71\u52a8\u82af\u7247\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u6982\u5ff5\u6846\u67b6\u3002"}, {"abstract": "Intrinsic dimensionality (ID) is widely used to probe the representational complexity of language models, but it remains unclear whether ID differences reflect properties of language itself or artefacts of how the underlying dataset was constructed. In this paper, we focus specifically on how lexical diversity, the number of unique last-token items present in a dataset, affects ID estimates of that dataset. We find a scale-dependent transition between two regimes: at low lexical diversity, conditions with fewer unique final words produce higher ID, while at high lexical diversity, this ordering reverses, and conditions with more unique words produce higher ID. We derive an exact, parameter-free formula for the point at which this reversal occurs, which matches the observed transition point at every scale tested. On the one hand, our results highlight how care must be taken when interpreting the intrinsic dimensionality of a set of representations as a straightforward cue of their complexity. On the other hand, our discovery of the two ID regimes reveals a general principle of organisation of linguistic data in LLMs that sheds new light on their inner manifold structures.", "arxiv_id": "2608.14361", "arxiv_url": "https://arxiv.org/abs/2608.14361", "authors": ["Arwa Osman", "Marco Baroni", "Iuri Macocco"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u8868\u5f81\u7684\u5185\u5728\u7ef4\u5ea6\u4f30\u8ba1\u662f\u5426\u53d7\u6570\u636e\u96c6\u8bcd\u6c47\u591a\u6837\u6027\u5f71\u54cd\uff0c\u5c24\u5176\u662f\u552f\u4e00\u672b\u8bcd\u6570\u91cf\u7684\u4f5c\u7528\u3002\u4f5c\u8005\u53d1\u73b0\u5185\u5728\u7ef4\u5ea6\u5b58\u5728\u968f\u5c3a\u5ea6\u53d8\u5316\u7684\u5c40\u90e8/\u5168\u5c40\u4e24\u79cd\u590d\u6742\u5ea6\u673a\u5236\uff0c\u5e76\u7ed9\u51fa\u7cbe\u786e\u65e0\u53c2\u6570\u516c\u5f0f\u9884\u6d4b\u53cd\u8f6c\u70b9\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14361", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4f4e\u8bcd\u6c47\u591a\u6837\u6027\u65f6\uff0c\u552f\u4e00\u672b\u8bcd\u66f4\u5c11\u7684\u6570\u636e\u53cd\u800c\u8868\u73b0\u51fa\u66f4\u9ad8\u5185\u5728\u7ef4\u5ea6\uff1b\u9ad8\u8bcd\u6c47\u591a\u6837\u6027\u65f6\uff0c\u8fd9\u4e00\u6392\u5e8f\u53cd\u8f6c\u3002", "\u63a8\u5bfc\u51fa\u4e00\u4e2a\u7cbe\u786e\u3001\u65e0\u53c2\u6570\u7684\u516c\u5f0f\uff0c\u53ef\u5728\u4e0d\u540c\u5c3a\u5ea6\u4e0b\u51c6\u786e\u5339\u914d\u89c2\u6d4b\u5230\u7684\u8f6c\u6298\u70b9\u3002", "\u8bf4\u660e\u5185\u5728\u7ef4\u5ea6\u4e0d\u5e94\u88ab\u7b80\u5355\u89e3\u91ca\u4e3a\u8bed\u8a00\u590d\u6742\u5ea6\u6307\u6807\uff0c\u5b83\u4e5f\u4f1a\u53d7\u5230\u6570\u636e\u6784\u9020\u65b9\u5f0f\u663e\u8457\u5f71\u54cd\u3002"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u8868\u5f81\u5206\u6790", "\u5185\u5728\u7ef4\u5ea6", "\u8bed\u8a00\u51e0\u4f55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14361v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Local and Global Regimes of Geometric Complexity in Language Model Representations", "tldr": "\u63ed\u793a\u8bcd\u6c47\u591a\u6837\u6027\u4f1a\u53cd\u8f6c\u8868\u5f81\u5185\u5728\u7ef4\u5ea6", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u8868\u5f81\u7684\u5185\u5728\u7ef4\u5ea6\u4f30\u8ba1\u662f\u5426\u53d7\u6570\u636e\u96c6\u8bcd\u6c47\u591a\u6837\u6027\u5f71\u54cd\uff0c\u5c24\u5176\u662f\u552f\u4e00\u672b\u8bcd\u6570\u91cf\u7684\u4f5c\u7528\u3002\u4f5c\u8005\u53d1\u73b0\u5185\u5728\u7ef4\u5ea6\u5b58\u5728\u968f\u5c3a\u5ea6\u53d8\u5316\u7684\u5c40\u90e8/\u5168\u5c40\u4e24\u79cd\u590d\u6742\u5ea6\u673a\u5236\uff0c\u5e76\u7ed9\u51fa\u7cbe\u786e\u65e0\u53c2\u6570\u516c\u5f0f\u9884\u6d4b\u53cd\u8f6c\u70b9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u89e3\u91ca\u8bed\u8a00\u6a21\u578b\u8868\u5f81\u51e0\u4f55\u63d0\u4f9b\u4e86\u65b0\u7684\u539f\u5219\uff0c\u63d0\u9192\u7814\u7a76\u8005\u5728\u4f7f\u7528\u5185\u5728\u7ef4\u5ea6\u5206\u6790\u6a21\u578b\u590d\u6742\u6027\u65f6\u9700\u63a7\u5236\u8bcd\u6c47\u591a\u6837\u6027\u7b49\u6570\u636e\u56e0\u7d20\uff0c\u540c\u65f6\u63ed\u793a\u4e86LLM\u5185\u90e8\u6d41\u5f62\u7ed3\u6784\u4e2d\u7684\u5c3a\u5ea6\u4f9d\u8d56\u7ec4\u7ec7\u89c4\u5f8b\u3002"}, {"abstract": "Skills have emerged as a practical and effective approach for enhancing LLM agents at inference time through structured packages of knowledge. However, existing evaluations largely measure whether skills improve aggregated task success, leaving a more fundamental question underexplored: \\emph{\\textbf{When do skills help, why do they work, and where do they fail?}} Through controlled experiments across various benchmarks, agent harnesses and LLMs, we isolate the effects of representation, outcome annotation, retrieval difficulty, and cross-framework robustness of skills. To further answer this question, we design a contrastive study that combines controlled quantitative experiments with paired trajectory analysis. We normalize 8,135 trial records from controlled experiments and retain 238 valid unique labels from 240 open-coded records. We consolidate these observations into a taxonomy of three high-level categories and twelve skill-use modes: skills work when noisy trajectories become procedural anchors that stabilize execution. Skills improve over Workflow Memory by 6.06 points in matched comparisons. Procedural anchoring accounts for 65.7\\% of skill cases, versus 4.5\\% for explicit knowledge injection, showing that skills stabilize action rather than inject missing facts. Retrieval is a separate bottleneck: as pools grow from 5 to 100, actual-use precision falls from 29.6\\% to 3.3\\%. Confusable distractors impair offline identification, yet downstream success remains stable; exact ground-truth invocation is neither sufficient nor necessary. Skills fail under brittle assumptions, incompatible contexts, or insufficient adaptation. These findings move evaluation beyond aggregate success rates and guide reliable self-evolving agents.", "arxiv_id": "2608.14036", "arxiv_url": "https://arxiv.org/abs/2608.14036", "authors": ["Zhiyuan Jiang", "Fangrui Huang", "Hanwen Xing", "Xander Wu", "Yipeng Gao", "Rui Cao", "Mengdi Wang", "Shilong Liu", "Yijiang Li"], "brief": "\u672c\u6587\u901a\u8fc7\u8de8\u57fa\u51c6\u3001\u667a\u80fd\u4f53\u6846\u67b6\u548c\u5927\u6a21\u578b\u7684\u53d7\u63a7\u5b9e\u9a8c\uff0c\u7cfb\u7edf\u5206\u6790 LLM \u667a\u80fd\u4f53\u4e2d\u201c\u6280\u80fd\u201d\u4f55\u65f6\u6709\u6548\u3001\u4e3a\u4f55\u6709\u6548\u4ee5\u53ca\u4f55\u5904\u5931\u6548\u3002\u7ed3\u679c\u663e\u793a\u6280\u80fd\u4e3b\u8981\u901a\u8fc7\u63d0\u4f9b\u7a0b\u5e8f\u6027\u951a\u70b9\u6765\u7a33\u5b9a\u6267\u884c\uff0c\u800c\u975e\u6ce8\u5165\u7f3a\u5931\u77e5\u8bc6\uff1b\u4f46\u68c0\u7d22\u89c4\u6a21\u6269\u5927\u65f6\u4f7f\u7528\u7cbe\u5ea6\u5927\u5e45\u4e0b\u964d\uff0c\u4e14\u5728\u8106\u5f31\u5047\u8bbe\u3001\u4e0d\u517c\u5bb9\u4e0a\u4e0b\u6587\u6216\u9002\u5e94\u4e0d\u8db3\u65f6\u4f1a\u5931\u8d25\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14036", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6280\u80fd\u5b66\u4e60", "\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14036v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Demystifying Agent Skills: Why They Work-Until They Don\u0027t", "tldr": "\u672c\u6587\u901a\u8fc7\u8de8\u57fa\u51c6\u3001\u667a\u80fd\u4f53\u6846\u67b6\u548c\u5927\u6a21\u578b\u7684\u53d7\u63a7\u5b9e\u9a8c\uff0c\u7cfb\u7edf\u5206\u6790 LLM \u667a\u80fd\u4f53\u4e2d\u201c\u6280\u80fd\u201d\u4f55\u65f6\u6709\u6548\u3001\u4e3a\u4f55\u6709\u6548\u4ee5\u53ca\u4f55\u5904\u5931\u6548\u3002\u7ed3\u679c\u663e\u793a\u6280\u80fd\u4e3b\u8981\u901a\u8fc7\u63d0\u4f9b\u7a0b\u5e8f\u6027\u951a\u70b9\u6765\u7a33\u5b9a\u6267\u884c\uff0c\u800c\u975e\u6ce8\u5165\u7f3a\u5931\u77e5\u8bc6\uff1b\u4f46\u68c0\u7d22\u89c4\u6a21\u6269\u5927\u65f6\u4f7f\u7528\u7cbe\u5ea6\u5927\u5e45\u4e0b\u964d\uff0c\u4e14\u5728\u8106\u5f31\u5047\u8bbe\u3001\u4e0d\u517c\u5bb9\u4e0a\u4e0b\u6587\u6216\u9002\u5e94\u4e0d\u8db3\u65f6\u4f1a\u5931\u8d25\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Nanbeige4.2-3B is a 3B-parameter agentic model built around a Looped Transformer (LT) that reuses one stack of layers for a second forward pass, adding effective depth without additional parameters. Evaluated on Apple Silicon (MPS), we identify five independent bugs which prevent the released checkpoint from running via Hugging Face transformers out of the box (including a silently-zeroed RoPE buffer and calls to removed transformers cache APIs). Furthermore, we show that fixing these bugs is still not sufficient for agentic tasks, due to the LT\u0027s layer-reuse strategy (which effectively doubles peak attention memory) used to achieve parameter efficiency. We thus introduce a chunked-prefill strategy which alleviates the incurred memory-capacity penalty, extending allowable context width by $2.7 \\times$ on 32~GiB shared memory. However, even with the reduced memory overhead, we show that patches are required to render Nanbeige4.2-3B usable; resolving both system prompt and MPS-native memory bugs finally allows reliable evaluation on standard MCP and tool-calling benchmarks. On a subset of MCPMark, the debugged model completes up to 30\\% of real agentic tasks (up from the original\u0027s 0\\%), while, on BFCL, it is near-perfect at single tool calls (yet fails the majority of multi-tool tests). We release the patched checkpoint, system prompt optimizer, and evaluation harnesses at https://github.com/johnhalloran321/Nanbeige4.2-3B-mps-fix.", "arxiv_id": "2608.13987", "arxiv_url": "https://arxiv.org/abs/2608.13987", "authors": ["John T. Halloran"], "brief": "\u672c\u6587\u9488\u5bf9 Nanbeige4.2-3B \u5728 Apple Silicon/MPS \u4e0a\u90e8\u7f72\u4e0d\u53ef\u7528\u7684\u95ee\u9898\uff0c\u5b9a\u4f4d\u5e76\u4fee\u590d\u4e86 5 \u4e2a\u72ec\u7acb bug\uff0c\u5305\u62ec RoPE \u7f13\u51b2\u533a\u88ab\u6e05\u96f6\u548c transformers \u7f13\u5b58 API \u5931\u6548\u7b49\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa chunked-prefill \u964d\u4f4e Looped Transformer \u5c42\u590d\u7528\u5e26\u6765\u7684\u5cf0\u503c\u6ce8\u610f\u529b\u663e\u5b58\u5f00\u9500\uff0c\u4f7f 32GiB \u5171\u4eab\u5185\u5b58\u4e0b\u53ef\u7528\u4e0a\u4e0b\u6587\u5bbd\u5ea6\u63d0\u5347 2.7 \u500d\uff1b\u4fee\u590d\u540e\u6a21\u578b\u5728\u90e8\u5206 MCPMark \u771f\u5b9e\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u4ece 0% \u63d0\u5347\u5230\u6700\u9ad8 30%\uff0c\u4f46\u591a\u5de5\u5177\u8c03\u7528\u4ecd\u8f83\u5f31\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13987", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6a21\u578b\u90e8\u7f72", "Transformer", "\u5de5\u5177\u8c03\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13987v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Nanbeige4.2-3B on Apple Silicon: Fixing Deployment Bugs and Decreasing Looped Transformer Memory Overhead", "tldr": "\u672c\u6587\u9488\u5bf9 Nanbeige4.2-3B \u5728 Apple Silicon/MPS \u4e0a\u90e8\u7f72\u4e0d\u53ef\u7528\u7684\u95ee\u9898\uff0c\u5b9a\u4f4d\u5e76\u4fee\u590d\u4e86 5 \u4e2a\u72ec\u7acb bug\uff0c\u5305\u62ec RoPE \u7f13\u51b2\u533a\u88ab\u6e05\u96f6\u548c transformers \u7f13\u5b58 API \u5931\u6548\u7b49\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa chunked-prefill \u964d\u4f4e Looped Transformer \u5c42\u590d\u7528\u5e26\u6765\u7684\u5cf0\u503c\u6ce8\u610f\u529b\u663e\u5b58\u5f00\u9500\uff0c\u4f7f 32GiB \u5171\u4eab\u5185\u5b58\u4e0b\u53ef\u7528\u4e0a\u4e0b\u6587\u5bbd\u5ea6\u63d0\u5347 2.7 \u500d\uff1b\u4fee\u590d\u540e\u6a21\u578b\u5728\u90e8\u5206 MCPMark \u771f\u5b9e\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u4ece 0% \u63d0\u5347\u5230\u6700\u9ad8 30%\uff0c\u4f46\u591a\u5de5\u5177\u8c03\u7528\u4ecd\u8f83\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI research agents (AIRA) can now propose, implement, and evaluate their own machine learning experiments, but progress on frontier tasks is throttled by cost: a candidate solution can be written in minutes, whereas evaluating it can take hours to days of GPU time. An agent can therefore propose far more candidates than it can afford to run, and its progress depends on its research preference: how it allocates a fixed execution budget across many candidates. We introduce AI Research Preference Models (RPMs) that predict which of multiple candidate solutions are most worth executing, without paying the cost of executing them all. We build RPMs from frozen pretrained language models (with no task-specific training), in two forms: an inference-only model that reasons over candidate plans, code, and prior executed solutions, and an agentic model that additionally runs small-scale pilot experiments before deciding. We integrate both into the AIRA-dojo search agent and evaluate on AIRS-Bench, a recent benchmark of machine learning research tasks for AI research agents. The two variants raise the average normalized score from 0.684 to 0.711 and 0.729 respectively, and reach the unguided agent\u0027s 24-hour performance in roughly 15 hours, using less than two-thirds of its execution budget. Our best RPMs also yield new state-of-the-art results on two AIRS-Bench tasks.", "arxiv_id": "2608.13940", "arxiv_url": "https://arxiv.org/abs/2608.13940", "authors": ["Thomas Simon Foster", "Bassel Al Omari", "Tingchen Fu", "Thomas Mann", "Carl Domond", "Lucia Cipolina-Kun", "Bhavul Gauri", "Muna Aghamelu", "Alexander D. Goldie", "Eryk Helenowski", "Jean-Christophe Gagnon-Audet", "Alberto Pepe", "Saba Nazir", "Daniel Izcovich", "Noam Levi", "Rishi Hazra", "Karen Hambardzumyan", "Nicolas Baldwin", "Xian Li", "Martin Josifoski", "Paris Giampouras", "Masoud Jalili Sabet", "Anya Sims", "Hela Momand", "Tatiana Shavrina", "Despoina Magka", "Jason Weston", "Yulin Wang", "Anirudh Goyal", "Jo\u00e3o Henriques", "Yoram Bachrach", "Emily McMilin", "Jakob Nicolaus Foerster"], "brief": "\u672c\u6587\u63d0\u51fa AI Research Preference Models\uff08RPMs\uff09\uff0c\u7528\u4e8e\u5728\u5927\u91cf\u5019\u9009\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u4e2d\u9884\u6d4b\u54ea\u4e9b\u6700\u503c\u5f97\u6267\u884c\uff0c\u4ece\u800c\u964d\u4f4e AI \u7814\u7a76\u667a\u80fd\u4f53\u7684\u8bc4\u4f30\u6210\u672c\u3002\u57fa\u4e8e\u51bb\u7ed3\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u7406\u5f0f\u4e0e\u667a\u80fd\u4f53\u5f0f RPM \u96c6\u6210\u5230 AIRA-dojo \u540e\uff0c\u5c06 AIRS-Bench \u5e73\u5747\u5f52\u4e00\u5316\u5206\u6570\u4ece 0.684 \u63d0\u5347\u5230 0.711/0.729\uff0c\u5e76\u7528\u4e0d\u5230\u4e09\u5206\u4e4b\u4e8c\u9884\u7b97\u8fbe\u5230\u539f 24 \u5c0f\u65f6\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13940", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u5b66\u4e60", "\u8bed\u8a00\u6a21\u578b", "\u81ea\u52a8\u5316\u7814\u7a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13940v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AI Research Preference Models", "tldr": "\u672c\u6587\u63d0\u51fa AI Research Preference Models\uff08RPMs\uff09\uff0c\u7528\u4e8e\u5728\u5927\u91cf\u5019\u9009\u673a\u5668\u5b66\u4e60\u5b9e\u9a8c\u4e2d\u9884\u6d4b\u54ea\u4e9b\u6700\u503c\u5f97\u6267\u884c\uff0c\u4ece\u800c\u964d\u4f4e AI \u7814\u7a76\u667a\u80fd\u4f53\u7684\u8bc4\u4f30\u6210\u672c\u3002\u57fa\u4e8e\u51bb\u7ed3\u9884\u8bad\u7ec3\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u7406\u5f0f\u4e0e\u667a\u80fd\u4f53\u5f0f RPM \u96c6\u6210\u5230 AIRA-dojo \u540e\uff0c\u5c06 AIRS-Bench \u5e73\u5747\u5f52\u4e00\u5316\u5206\u6570\u4ece 0.684 \u63d0\u5347\u5230 0.711/0.729\uff0c\u5e76\u7528\u4e0d\u5230\u4e09\u5206\u4e4b\u4e8c\u9884\u7b97\u8fbe\u5230\u539f 24 \u5c0f\u65f6\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Model (LLM)-based agents are increasingly used for complex tasks such as software testing and cybersecurity assessment. While these agents demonstrate impressive capabilities, their behavior is difficult to understand, explain, and analyze. Existing evaluations focus mainly on task success and execution traces, offering limited insight into the strategies employed by the agent. We present ATLAS (Automata Learning for Agent Trajectory Analysis and Strategy Discovery), an approach for recovering interpretable behavioral models from agent trajectories. ATLAS combines trace abstraction with automata learning to infer finite-state models that capture observed agent-environment interaction strategies. These models provide human-interpretable insights and support automated analyses of recurring behaviors, decision points, successful task-completion paths, and failure loops. As a proof of concept, we apply ATLAS to trajectories generated by an LLM-based penetration-testing agent. The resulting models expose high-level behavioral strategies for exploiting vulnerable machines that are difficult to identify from raw execution traces alone. We discuss how learned behavioral models can support explainability, model-guided exploration, auditing, and analysis of agentic systems. We further demonstrate symbolic model-based knowledge transfer from powerful frontier models to compact language models. In addition, we show how model transformations can derive concise explanations of agent behavior in a penetration-testing case study comprising 12 vulnerable machines. ATLAS highlights a new opportunity for model-driven engineering: transforming agent trajectories into explicit behavioral models that enable systematic understanding and analysis of otherwise opaque AI agents.", "arxiv_id": "2608.14352", "arxiv_url": "https://arxiv.org/abs/2608.14352", "authors": ["Ignacio D. Lopez-Miguel", "Andreas Happe", "J\u00fcrgen Cito", "Ezio Bartocci", "Bettina K\u00f6nighofer", "Martin Tappler"], "brief": "ATLAS \u5c06 LLM \u667a\u80fd\u4f53\u7684\u6267\u884c\u8f68\u8ff9\u5148\u505a\u62bd\u8c61\uff0c\u518d\u7528\u81ea\u52a8\u673a\u5b66\u4e60\u6062\u590d\u6709\u9650\u72b6\u6001\u884c\u4e3a\u6a21\u578b\uff0c\u4ece\u800c\u63ed\u793a\u667a\u80fd\u4f53\u4e0e\u73af\u5883\u4ea4\u4e92\u4e2d\u7684\u7b56\u7565\u3001\u51b3\u7b56\u70b9\u3001\u6210\u529f\u8def\u5f84\u548c\u5931\u8d25\u5faa\u73af\u3002\u4f5c\u8005\u5728\u6e17\u900f\u6d4b\u8bd5\u667a\u80fd\u4f53\u8f68\u8ff9\u4e0a\u9a8c\u8bc1\uff0c\u6a21\u578b\u80fd\u63d0\u4f9b\u6bd4\u539f\u59cb\u65e5\u5fd7\u66f4\u6e05\u6670\u7684\u53ef\u89e3\u91ca\u7b56\u7565\u5206\u6790\uff0c\u5e76\u652f\u6301\u5ba1\u8ba1\u3001\u77e5\u8bc6\u8fc1\u79fb\u548c\u884c\u4e3a\u89e3\u91ca\u3002", "categories": ["cs.SE", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14352", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u52a8\u673a\u5b66\u4e60", "\u53ef\u89e3\u91ca\u6027", "\u7f51\u7edc\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14352v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "ATLAS: Discovering Agent Strategies through LLM-Guided Abstraction and Automata Learning", "tldr": "ATLAS \u5c06 LLM \u667a\u80fd\u4f53\u7684\u6267\u884c\u8f68\u8ff9\u5148\u505a\u62bd\u8c61\uff0c\u518d\u7528\u81ea\u52a8\u673a\u5b66\u4e60\u6062\u590d\u6709\u9650\u72b6\u6001\u884c\u4e3a\u6a21\u578b\uff0c\u4ece\u800c\u63ed\u793a\u667a\u80fd\u4f53\u4e0e\u73af\u5883\u4ea4\u4e92\u4e2d\u7684\u7b56\u7565\u3001\u51b3\u7b56\u70b9\u3001\u6210\u529f\u8def\u5f84\u548c\u5931\u8d25\u5faa\u73af\u3002\u4f5c\u8005\u5728\u6e17\u900f\u6d4b\u8bd5\u667a\u80fd\u4f53\u8f68\u8ff9\u4e0a\u9a8c\u8bc1\uff0c\u6a21\u578b\u80fd\u63d0\u4f9b\u6bd4\u539f\u59cb\u65e5\u5fd7\u66f4\u6e05\u6670\u7684\u53ef\u89e3\u91ca\u7b56\u7565\u5206\u6790\uff0c\u5e76\u652f\u6301\u5ba1\u8ba1\u3001\u77e5\u8bc6\u8fc1\u79fb\u548c\u884c\u4e3a\u89e3\u91ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Life science knowledge graphs make large collections of structured data available through SPARQL, but each resource uses its own schema, identifiers, and links. TogoMCP helps language model agents query these resources by providing curated Metadata Interoperability Exchange files. Creating and maintaining these files still requires language model assisted drafting, validation, and manual review. We study \\emph{live schema grounding}, where an agent obtains the schema evidence needed for a question directly from the current endpoints. We present \\textsc{autoschema}, a general framework for live schema grounding that requires no training. It inspects live schemas, maps entity names in a question to graph identifiers, explores relation paths, and finds possible connections between resources during iterative query construction. We use TogoMCP as our main comparison framework. We evaluate \\textsc{autoschema} on Resource Focused Biomedical KGQA, Multi Resource Biomedical KGQA, Longitudinal Biomedical Semantic QA over BioASQ Task B, and Chemistry Knowledge Graph Transfer to a previously undocumented RDF graph. \\textsc{autoschema} improves mean factoid accuracy over TogoMCP in the biomedical KGQA tasks and gives consistent gains in the longitudinal BioASQ evaluation. It also reduces iteration budget exhaustion and uses fewer tool calls on average in the core evaluation. The transfer study gives preliminary evidence that live schema grounding can support irregular and previously unseen graphs without first creating a curated schema file.", "arxiv_id": "2608.14228", "arxiv_url": "https://arxiv.org/abs/2608.14228", "authors": ["Yiming Zhang", "Koji Tsuda"], "brief": "AutoSchema \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5b9e\u65f6\u6a21\u5f0f grounding \u6846\u67b6\uff0c\u8ba9\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u76f4\u63a5\u4ece\u5f53\u524d SPARQL \u7aef\u70b9\u83b7\u53d6\u6a21\u5f0f\u8bc1\u636e\u3001\u6620\u5c04\u5b9e\u4f53\u5e76\u63a2\u7d22\u5173\u7cfb\u8def\u5f84\u3002\u5b83\u5728\u591a\u4e2a\u751f\u7269\u533b\u5b66 KGQA \u4efb\u52a1\u4e0a\u76f8\u6bd4 TogoMCP \u63d0\u5347\u4e8b\u5b9e\u95ee\u7b54\u51c6\u786e\u7387\uff0c\u51cf\u5c11\u8fed\u4ee3\u9884\u7b97\u8017\u5c3d\u548c\u5de5\u5177\u8c03\u7528\uff0c\u5e76\u521d\u6b65\u652f\u6301\u672a\u89c1\u8fc7\u7684\u4e0d\u89c4\u5219 RDF \u56fe\u8fc1\u79fb\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14228", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u56fe\u8c31", "\u8bed\u4e49\u89e3\u6790", "\u751f\u7269\u533b\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14228v1", "published_at": "2026-08-14", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "AutoSchema: Live Schema Grounding for Agentic Text-to-Sparql over Heterogeneous Knowledge Graphs", "tldr": "AutoSchema \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5b9e\u65f6\u6a21\u5f0f grounding \u6846\u67b6\uff0c\u8ba9\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53\u76f4\u63a5\u4ece\u5f53\u524d SPARQL \u7aef\u70b9\u83b7\u53d6\u6a21\u5f0f\u8bc1\u636e\u3001\u6620\u5c04\u5b9e\u4f53\u5e76\u63a2\u7d22\u5173\u7cfb\u8def\u5f84\u3002\u5b83\u5728\u591a\u4e2a\u751f\u7269\u533b\u5b66 KGQA \u4efb\u52a1\u4e0a\u76f8\u6bd4 TogoMCP \u63d0\u5347\u4e8b\u5b9e\u95ee\u7b54\u51c6\u786e\u7387\uff0c\u51cf\u5c11\u8fed\u4ee3\u9884\u7b97\u8017\u5c3d\u548c\u5de5\u5177\u8c03\u7528\uff0c\u5e76\u521d\u6b65\u652f\u6301\u672a\u89c1\u8fc7\u7684\u4e0d\u89c4\u5219 RDF \u56fe\u8fc1\u79fb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Determining the biological sex of the individuals who created Upper Paleolithic hand stencils remains a challenging problem due to the absence of ground truth, population differences between contemporary and prehistoric groups, and the uncertainty introduced by image degradation. Traditional morphometric methods suffer from high structural overlap across sexes, poor cross-population generalizability, and subjective feature engineering. This study presents an uncertainty-aware deep learning framework for sex attribution in prehistoric hand stencils that explicitly models, propagates, and aggregates uncertainty throughout the analytical pipeline. The methodology combines dual image processing, dual contour extraction, structured silhouette augmentation, model architectural diversity, and ensemble-based decision aggregation. The pipeline generates twelve plausible silhouette realizations per stencil to capture boundary uncertainties, which are processed by two ensembles of ten deep neural networks each (EfficientNet-B3 and MobileViT-S) trained on 14,036 contemporary hand samples. Furthermore, a triangulated validation scheme integrates ensemble predictions with unsupervised 2D latent-space manifold mapping (UMAP + k-NN) and explainable AI spatial attributions (LayerCAM) to ensure anatomical consistency. On contemporary data, ensemble models achieve strong classification performance, with accuracies exceeding 88% in older age groups. When applied to prehistoric stencils, the framework produces both sex predictions and confidence measures of internal agreement, enabling the distinction between morphologically stable and ambiguous cases. Convergence across ensemble predictions, latent-space structure, and interpretability analyses shows that uncertainty can become a measurable component of archaeological inference, enabling robust and reproducible decoding of ancient rock art.", "arxiv_id": "2608.14539", "arxiv_url": "https://arxiv.org/abs/2608.14539", "authors": ["Karel Becerra", "Boris Mederos", "Dean Snow", "Ram\u00f3n A. Mollineda"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u53f2\u524d\u624b\u5370\u6027\u522b\u5f52\u56e0\u7684\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u591a\u79cd\u56fe\u50cf\u5904\u7406\u3001\u8f6e\u5ed3\u63d0\u53d6\u3001\u8f6e\u5ed3\u589e\u5f3a\u548c\u6a21\u578b\u96c6\u6210\u6765\u663e\u5f0f\u5efa\u6a21\u8fb9\u754c\u4e0e\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027\u3002\u6a21\u578b\u5728\u73b0\u4ee3\u624b\u90e8\u6570\u636e\u4e0a\u8bad\u7ec3\u5e76\u53d6\u5f97\u8f83\u5f3a\u5206\u7c7b\u6027\u80fd\uff0c\u5e94\u7528\u5230\u53f2\u524d\u624b\u5370\u65f6\u4e0d\u4ec5\u7ed9\u51fa\u6027\u522b\u9884\u6d4b\uff0c\u8fd8\u63d0\u4f9b\u7f6e\u4fe1\u5ea6\u4e0e\u53ef\u89e3\u91ca\u6027\u9a8c\u8bc1\uff0c\u7528\u4e8e\u533a\u5206\u7a33\u5b9a\u6848\u4f8b\u548c\u6a21\u7cca\u6848\u4f8b\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14539", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1", "\u96c6\u6210\u5b66\u4e60", "\u53ef\u89e3\u91caAI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14539v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Decoding the Past: An Uncertainty-Aware Deep Learning Framework for Sex Attribution in Prehistoric Hand Stencils", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411\u53f2\u524d\u624b\u5370\u6027\u522b\u5f52\u56e0\u7684\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u6df1\u5ea6\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u591a\u79cd\u56fe\u50cf\u5904\u7406\u3001\u8f6e\u5ed3\u63d0\u53d6\u3001\u8f6e\u5ed3\u589e\u5f3a\u548c\u6a21\u578b\u96c6\u6210\u6765\u663e\u5f0f\u5efa\u6a21\u8fb9\u754c\u4e0e\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027\u3002\u6a21\u578b\u5728\u73b0\u4ee3\u624b\u90e8\u6570\u636e\u4e0a\u8bad\u7ec3\u5e76\u53d6\u5f97\u8f83\u5f3a\u5206\u7c7b\u6027\u80fd\uff0c\u5e94\u7528\u5230\u53f2\u524d\u624b\u5370\u65f6\u4e0d\u4ec5\u7ed9\u51fa\u6027\u522b\u9884\u6d4b\uff0c\u8fd8\u63d0\u4f9b\u7f6e\u4fe1\u5ea6\u4e0e\u53ef\u89e3\u91ca\u6027\u9a8c\u8bc1\uff0c\u7528\u4e8e\u533a\u5206\u7a33\u5b9a\u6848\u4f8b\u548c\u6a21\u7cca\u6848\u4f8b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This study investigates the methodological and theoretical properties of session handover in applications that use large language models. A task may continue in a new session when the context reaches the model\u0027s input limit, when the application restarts, or when another agent is asked to finish the task. The application must then decide which information from the earlier session to pass on. We formulate handover as the transfer of a task-relative in-context learning (ICL) state and distinguish exact recovery of earlier material from preservation of the target distribution. Under an exogeneity condition, predictive equivalence characterizes the coarsest deterministic sufficient handover and gives a fixed-length bit requirement. The analysis isolates the effects of the memory constraint, the writer, and the continuation procedure, and quantifies the cost of writing before the realized downstream query is known. We propose a three-part record that stores decisions and constraints exactly, uses task-justified statistics for repeated evidence, and retains original observations whose effect is not preserved by those statistics. Gaussian linear regression gives an exact finite-dimensional handover and finite-bit perturbation bounds, while nonparametric regression gives upper and lower bounds that relate memory to squared prediction error. These results provide a theory and method for deciding what a handover must retain and how its memory requirement depends on the continuation task.", "arxiv_id": "2608.14528", "arxiv_url": "https://arxiv.org/abs/2608.14528", "authors": ["Masahiro Kato", "Taka Kato"], "brief": "\u672c\u6587\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u8de8\u4f1a\u8bdd\u7eed\u63a5\u5efa\u6a21\u4e3a\u4efb\u52a1\u76f8\u5173\u7684\u4e0a\u4e0b\u6587\u5b66\u4e60\u72b6\u6001\u4ea4\u63a5\uff0c\u533a\u5206\u539f\u59cb\u5185\u5bb9\u7cbe\u786e\u6062\u590d\u4e0e\u76ee\u6807\u5206\u5e03\u4fdd\u6301\u3002\u4f5c\u8005\u7ed9\u51fa\u5145\u5206\u4ea4\u63a5\u4fe1\u606f\u7684\u7406\u8bba\u523b\u753b\u3001\u56fa\u5b9a\u957f\u5ea6\u6bd4\u7279\u9700\u6c42\u53ca\u8bb0\u5fc6\u7ea6\u675f\u4e0b\u7684\u8bef\u5dee\u754c\uff0c\u5e76\u63d0\u51fa\u5305\u542b\u51b3\u7b56\u7ea6\u675f\u3001\u7edf\u8ba1\u6458\u8981\u548c\u5fc5\u8981\u539f\u59cb\u89c2\u6d4b\u7684\u4e09\u90e8\u5206\u8bb0\u5f55\u65b9\u6cd5\u3002", "categories": ["cs.AI", "econ.EM", "math.ST", "stat.ME", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14528", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0a\u4e0b\u6587\u5b66\u4e60", "\u8bb0\u5fc6\u7ba1\u7406", "\u7edf\u8ba1\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14528v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Handover of In-Context Learning State Across Session Boundaries", "tldr": "\u672c\u6587\u5c06\u5927\u8bed\u8a00\u6a21\u578b\u8de8\u4f1a\u8bdd\u7eed\u63a5\u5efa\u6a21\u4e3a\u4efb\u52a1\u76f8\u5173\u7684\u4e0a\u4e0b\u6587\u5b66\u4e60\u72b6\u6001\u4ea4\u63a5\uff0c\u533a\u5206\u539f\u59cb\u5185\u5bb9\u7cbe\u786e\u6062\u590d\u4e0e\u76ee\u6807\u5206\u5e03\u4fdd\u6301\u3002\u4f5c\u8005\u7ed9\u51fa\u5145\u5206\u4ea4\u63a5\u4fe1\u606f\u7684\u7406\u8bba\u523b\u753b\u3001\u56fa\u5b9a\u957f\u5ea6\u6bd4\u7279\u9700\u6c42\u53ca\u8bb0\u5fc6\u7ea6\u675f\u4e0b\u7684\u8bef\u5dee\u754c\uff0c\u5e76\u63d0\u51fa\u5305\u542b\u51b3\u7b56\u7ea6\u675f\u3001\u7edf\u8ba1\u6458\u8981\u548c\u5fc5\u8981\u539f\u59cb\u89c2\u6d4b\u7684\u4e09\u90e8\u5206\u8bb0\u5f55\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As AI systems make more morally loaded decisions across society, one response has been moral preference elicitation. In this approach, researchers poll participants on hypothetical dilemmas and use the aggregated votes to train a policy that an AI model then applies at scale. Before any vote is cast, developers make three key choices in the moral AI elicitation pipeline: feature scoping, voter sampling, and question framing. In other words, they decide which features go to a vote, which voters to include, and how to present the question. These choices are often opaque, undocumented, and treated as technical details rather than normative ones. We examine each of these choices within a common empirical study and show that each can shape the preferences produced by moral AI elicitation. Across two phases (N = 809) in three deployment contexts (i.e., AI kidney allocation, AI agents simulating absent workers, and generative AI depictions of the deceased), we examine the three main stages of the moral AI elicitation pipeline. First, morally relevant features shift across contexts. This suggests that feature schemas should not be assumed to transfer across deployment domains. Second, preferences differ by political ideology for roughly one-third of features, with some differences reversing direction. The ideological composition of the voter pool can therefore affect the resulting aggregated preference profile. Third, the wording of the elicitation question can narrow or widen ideological gaps by up to a full scale point. The framing conditions also change how moral foundations are associated with participants\u0027 judgments. Taken together, these findings suggest that voting-based alignment cannot deliver fair or transparent AI by aggregation alone; at minimum, each stage of the moral AI elicitation pipeline should be audited and disclosed.", "arxiv_id": "2608.14522", "arxiv_url": "https://arxiv.org/abs/2608.14522", "authors": ["Taenyun Kim", "Edyta Bogucka", "Daniele Quercia"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u53c2\u4e0e\u5f0f\u9053\u5fb7 AI \u5e76\u4e0d\u56e0\u6295\u7968\u805a\u5408\u800c\u5929\u7136\u4e2d\u7acb\uff1a\u5f00\u53d1\u8005\u5728\u7279\u5f81\u9009\u62e9\u3001\u6295\u7968\u8005\u62bd\u6837\u548c\u95ee\u9898\u8868\u8ff0\u4e0a\u7684\u524d\u7f6e\u51b3\u7b56\u4f1a\u663e\u8457\u5851\u9020\u6700\u7ec8\u504f\u597d\u3002\u901a\u8fc7 809 \u540d\u53c2\u4e0e\u8005\u548c\u4e09\u4e2a\u5e94\u7528\u573a\u666f\u7684\u5b9e\u9a8c\uff0c\u4f5c\u8005\u53d1\u73b0\u9053\u5fb7\u7279\u5f81\u4f1a\u968f\u573a\u666f\u53d8\u5316\uff0c\u653f\u6cbb\u610f\u8bc6\u5f62\u6001\u4f1a\u5f71\u54cd\u7ea6\u4e09\u5206\u4e4b\u4e00\u7279\u5f81\u7684\u504f\u597d\uff0c\u95ee\u9898\u63aa\u8f9e\u4e5f\u4f1a\u6539\u53d8\u7fa4\u4f53\u5dee\u5f02\u4e0e\u9053\u5fb7\u5224\u65ad\u5173\u8054\u3002\u56e0\u6b64\uff0c\u9053\u5fb7 AI \u7684\u504f\u597d\u5f81\u96c6\u6d41\u7a0b\u9700\u8981\u5ba1\u8ba1\u548c\u516c\u5f00\u62ab\u9732\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14522", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u4f26\u7406", "\u4ef7\u503c\u5bf9\u9f50", "\u504f\u597d\u5b66\u4e60", "\u516c\u5e73\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14522v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Participatory Moral AI Is Not Neutral: The Invisible Hand of Developers", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u53c2\u4e0e\u5f0f\u9053\u5fb7 AI \u5e76\u4e0d\u56e0\u6295\u7968\u805a\u5408\u800c\u5929\u7136\u4e2d\u7acb\uff1a\u5f00\u53d1\u8005\u5728\u7279\u5f81\u9009\u62e9\u3001\u6295\u7968\u8005\u62bd\u6837\u548c\u95ee\u9898\u8868\u8ff0\u4e0a\u7684\u524d\u7f6e\u51b3\u7b56\u4f1a\u663e\u8457\u5851\u9020\u6700\u7ec8\u504f\u597d\u3002\u901a\u8fc7 809 \u540d\u53c2\u4e0e\u8005\u548c\u4e09\u4e2a\u5e94\u7528\u573a\u666f\u7684\u5b9e\u9a8c\uff0c\u4f5c\u8005\u53d1\u73b0\u9053\u5fb7\u7279\u5f81\u4f1a\u968f\u573a\u666f\u53d8\u5316\uff0c\u653f\u6cbb\u610f\u8bc6\u5f62\u6001\u4f1a\u5f71\u54cd\u7ea6\u4e09\u5206\u4e4b\u4e00\u7279\u5f81\u7684\u504f\u597d\uff0c\u95ee\u9898\u63aa\u8f9e\u4e5f\u4f1a\u6539\u53d8\u7fa4\u4f53\u5dee\u5f02\u4e0e\u9053\u5fb7\u5224\u65ad\u5173\u8054\u3002\u56e0\u6b64\uff0c\u9053\u5fb7 AI \u7684\u504f\u597d\u5f81\u96c6\u6d41\u7a0b\u9700\u8981\u5ba1\u8ba1\u548c\u516c\u5f00\u62ab\u9732\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "High-order multiple-input multiple-output (MIMO) detection requires efficient search over a large discrete symbol space while producing reliable soft information for channel decoding. This paper develops a learning-to-transition (L2T) framework that formulates MIMO detection as a stochastic sequence of complete-vector transitions. At each transition, a channel-coupled Transformer updates both the instance embedding and the sampling policy, while a blockwise autoregressive factorization captures inter-stream dependence with moderate sequential complexity. For hard-output detection, a transition network is applied recursively and trained through a residual-to-BER curriculum, which first learns the MIMO search geometry from the exact residual metric and then aligns the policy with transmitted-bit accuracy. For soft-output reception, the well-trained hard policy is cloned at the parameter level into every layer of an untied soft-input soft-output iterative detection and decoding (IDD) receiver. This tied-to-untied transfer preserves the learned zero-prior search dynamics while enabling layer- and round-specific specialization under decoder feedback. Within each IDD round, decoder priors tilt candidate generation according to Bayes\u0027 rule, and likelihood-weighted terminal hypotheses produce posterior and extrinsic log-likelihood ratios for LDPC decoding. A multi-stage training strategy further stabilizes the hard-to-soft transfer by progressively exposing the receiver to synthetic and in-loop decoder-generated priors.", "arxiv_id": "2608.14511", "arxiv_url": "https://arxiv.org/abs/2608.14511", "authors": ["Yubo Zhang", "Yiyao Liu", "Xiaodong Wang"], "brief": "\u672c\u6587\u63d0\u51fa Learning-to-Transition\uff08L2T\uff09\u6846\u67b6\uff0c\u5c06\u5927\u89c4\u6a21\u9ad8\u9636 MIMO \u68c0\u6d4b\u5efa\u6a21\u4e3a\u5b8c\u6574\u7b26\u53f7\u5411\u91cf\u7684\u968f\u673a\u8f6c\u79fb\u5e8f\u5217\uff0c\u5e76\u7528\u4fe1\u9053\u8026\u5408 Transformer \u4e0e\u5206\u5757\u81ea\u56de\u5f52\u7b56\u7565\u8fdb\u884c\u9ad8\u6548\u641c\u7d22\u3002\u65b9\u6cd5\u5148\u901a\u8fc7\u6b8b\u5dee\u5230\u8bef\u7801\u7387\u7684\u8bfe\u7a0b\u5b66\u4e60\u8bad\u7ec3\u786c\u5224\u51b3\u7b56\u7565\uff0c\u518d\u8fc1\u79fb\u5230\u8f6f\u8f93\u5165\u8f6f\u8f93\u51fa IDD \u63a5\u6536\u673a\u4e2d\uff0c\u7ed3\u5408\u8bd1\u7801\u5668\u5148\u9a8c\u751f\u6210\u53ef\u9760 LLR\uff0c\u6709\u671b\u63d0\u5347\u9ad8\u9636 MIMO \u68c0\u6d4b\u4e0e LDPC \u8bd1\u7801\u6027\u80fd\u3002", "categories": ["cs.IT", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14511", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["MIMO\u68c0\u6d4b", "Transformer", "\u4fe1\u9053\u7f16\u7801", "\u5e8f\u5217\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14511v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning-to-Transition for Large-scale and High-Order MIMO Detection", "tldr": "\u672c\u6587\u63d0\u51fa Learning-to-Transition\uff08L2T\uff09\u6846\u67b6\uff0c\u5c06\u5927\u89c4\u6a21\u9ad8\u9636 MIMO \u68c0\u6d4b\u5efa\u6a21\u4e3a\u5b8c\u6574\u7b26\u53f7\u5411\u91cf\u7684\u968f\u673a\u8f6c\u79fb\u5e8f\u5217\uff0c\u5e76\u7528\u4fe1\u9053\u8026\u5408 Transformer \u4e0e\u5206\u5757\u81ea\u56de\u5f52\u7b56\u7565\u8fdb\u884c\u9ad8\u6548\u641c\u7d22\u3002\u65b9\u6cd5\u5148\u901a\u8fc7\u6b8b\u5dee\u5230\u8bef\u7801\u7387\u7684\u8bfe\u7a0b\u5b66\u4e60\u8bad\u7ec3\u786c\u5224\u51b3\u7b56\u7565\uff0c\u518d\u8fc1\u79fb\u5230\u8f6f\u8f93\u5165\u8f6f\u8f93\u51fa IDD \u63a5\u6536\u673a\u4e2d\uff0c\u7ed3\u5408\u8bd1\u7801\u5668\u5148\u9a8c\u751f\u6210\u53ef\u9760 LLR\uff0c\u6709\u671b\u63d0\u5347\u9ad8\u9636 MIMO \u68c0\u6d4b\u4e0e LDPC \u8bd1\u7801\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Systems that ask a language model to reach a conclusion from many sources usually concatenate them into one prompt. This conflates two operations with different requirements. Interpreting a source rewards capacity and context. Combining interpretations rewards fixed arithmetic, comparability across instances, and the option to return nothing. Once separated, the design problem becomes the interface between them. We propose a four-field evidence tuple (hypothesis, reliability bucket, rationale, provenance) and show that fixing it determines both halves. The separation also reveals a failure mode in how such systems combine, which we call count-scale drift. Thresholding a sum of unnormalized weights is exactly posterior thresholding, but at an operating point that slides with the number of sources consulted. The slide grows with reader reliability. When source reliabilities differ, the vote rule and the posterior order instances differently, and no threshold reconciles them. Pooling calibrated log-likelihood ratios addresses both problems. The fix is arithmetic rather than architectural, and applies to a class of rules beyond language models: score-summing triage engines, diagnostic panels scored by counting positives, and additive multi-signal detectors. We then instantiate the principle twice on one longitudinal corpus, once after outcomes resolve and once before. The same partition helps in both, at different granularities: over reading in the first, over learning capacity in the second. There, a small sequence encoder on an easy auxiliary objective plus a tree ensemble carrying the censored survival loss reaches 0.921 AUPRC against 0.805 for a hand-crafted baseline. We separate what transfers from what must be re-estimated per domain, and state five predictions that would falsify the framework, three negative results, and which comparisons remain confounded.", "arxiv_id": "2608.14509", "arxiv_url": "https://arxiv.org/abs/2608.14509", "authors": ["Zhelun Wu"], "brief": "\u8bba\u6587\u4e3b\u5f20\u5c06\u591a\u6e90\u8bc1\u636e\u4efb\u52a1\u62c6\u6210\u201c\u8bc1\u636e\u89e3\u91ca\u201d\u548c\u201c\u51b3\u7b56\u805a\u5408\u201d\u4e24\u6b65\uff0c\u5e76\u63d0\u51fa\u5305\u542b\u5047\u8bbe\u3001\u53ef\u9760\u6027\u6876\u3001\u7406\u7531\u3001\u6765\u6e90\u7684\u56db\u5b57\u6bb5\u8bc1\u636e\u5143\u7ec4\u4f5c\u4e3a\u63a5\u53e3\u3002\u4f5c\u8005\u6307\u51fa\u7b80\u5355\u8ba1\u6570\u6216\u672a\u5f52\u4e00\u5316\u52a0\u6743\u6c42\u548c\u4f1a\u4ea7\u751f\u968f\u8bc1\u636e\u6570\u91cf\u6f02\u79fb\u7684\u9608\u503c\u95ee\u9898\uff0c\u5efa\u8bae\u7528\u6821\u51c6\u7684\u5bf9\u6570\u4f3c\u7136\u6bd4\u6c47\u805a\uff1b\u5728\u7eb5\u5411\u8bed\u6599\u5b9e\u9a8c\u4e2d\uff0c\u5c0f\u578b\u5e8f\u5217\u7f16\u7801\u5668\u52a0\u6811\u6a21\u578b\u8fbe\u52300.921 AUPRC\uff0c\u4f18\u4e8e\u624b\u5de5\u57fa\u7ebf0.805\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14509", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u8bc1\u636e\u805a\u5408", "\u6821\u51c6", "\u51b3\u7b56\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14509v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Split the Labor: Separating Evidence Interpretation from Decision Aggregation", "tldr": "\u8bba\u6587\u4e3b\u5f20\u5c06\u591a\u6e90\u8bc1\u636e\u4efb\u52a1\u62c6\u6210\u201c\u8bc1\u636e\u89e3\u91ca\u201d\u548c\u201c\u51b3\u7b56\u805a\u5408\u201d\u4e24\u6b65\uff0c\u5e76\u63d0\u51fa\u5305\u542b\u5047\u8bbe\u3001\u53ef\u9760\u6027\u6876\u3001\u7406\u7531\u3001\u6765\u6e90\u7684\u56db\u5b57\u6bb5\u8bc1\u636e\u5143\u7ec4\u4f5c\u4e3a\u63a5\u53e3\u3002\u4f5c\u8005\u6307\u51fa\u7b80\u5355\u8ba1\u6570\u6216\u672a\u5f52\u4e00\u5316\u52a0\u6743\u6c42\u548c\u4f1a\u4ea7\u751f\u968f\u8bc1\u636e\u6570\u91cf\u6f02\u79fb\u7684\u9608\u503c\u95ee\u9898\uff0c\u5efa\u8bae\u7528\u6821\u51c6\u7684\u5bf9\u6570\u4f3c\u7136\u6bd4\u6c47\u805a\uff1b\u5728\u7eb5\u5411\u8bed\u6599\u5b9e\u9a8c\u4e2d\uff0c\u5c0f\u578b\u5e8f\u5217\u7f16\u7801\u5668\u52a0\u6811\u6a21\u578b\u8fbe\u52300.921 AUPRC\uff0c\u4f18\u4e8e\u624b\u5de5\u57fa\u7ebf0.805\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recipe data arises in domains such as materials synthesis, pharmaceutical formulation, and industrial manufacturing, where procedures are represented as ordered sequences of steps containing heterogeneous structured fields. Existing tabular learning methods typically flatten this structure into fixed-schema representations, limiting their ability to capture hierarchical field interactions and procedural dependencies. We propose RecipeNet, a hierarchical Transformer architecture that encodes field-level interactions within each step and sequential dependencies across steps through stacked Transformer encoders. Experiments on multiple recipe datasets and tasks demonstrate that RecipeNet consistently outperforms existing tabular models, highlighting the value of hierarchical and sequential modeling for recipe representation learning.", "arxiv_id": "2608.14505", "arxiv_url": "https://arxiv.org/abs/2608.14505", "authors": ["Pin-Yen Huang", "Sachin Chhabra", "Prasanth Sai Gouripeddi", "Abhinav Kumar", "Baoxin Li"], "brief": "\u672c\u6587\u63d0\u51fa RecipeNet\uff0c\u4e00\u79cd\u9762\u5411\u914d\u65b9\u6570\u636e\u7684\u5c42\u6b21\u5316 Transformer\uff0c\u5206\u522b\u5efa\u6a21\u6b65\u9aa4\u5185\u90e8\u7684\u5b57\u6bb5\u4ea4\u4e92\u548c\u6b65\u9aa4\u4e4b\u95f4\u7684\u987a\u5e8f\u4f9d\u8d56\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u4e2a\u914d\u65b9\u6570\u636e\u96c6\u548c\u4efb\u52a1\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u73b0\u6709\u8868\u683c\u6a21\u578b\uff0c\u8bf4\u660e\u5c42\u6b21\u4e0e\u5e8f\u5217\u7ed3\u6784\u5efa\u6a21\u5bf9\u914d\u65b9\u8868\u793a\u5b66\u4e60\u6709\u6548\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14505", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u5b66\u4e60", "Transformer", "\u5e8f\u5217\u5efa\u6a21", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14505v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RecipeNet: A Hierarchical Transformer for Recipe Data", "tldr": "\u672c\u6587\u63d0\u51fa RecipeNet\uff0c\u4e00\u79cd\u9762\u5411\u914d\u65b9\u6570\u636e\u7684\u5c42\u6b21\u5316 Transformer\uff0c\u5206\u522b\u5efa\u6a21\u6b65\u9aa4\u5185\u90e8\u7684\u5b57\u6bb5\u4ea4\u4e92\u548c\u6b65\u9aa4\u4e4b\u95f4\u7684\u987a\u5e8f\u4f9d\u8d56\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u591a\u4e2a\u914d\u65b9\u6570\u636e\u96c6\u548c\u4efb\u52a1\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u73b0\u6709\u8868\u683c\u6a21\u578b\uff0c\u8bf4\u660e\u5c42\u6b21\u4e0e\u5e8f\u5217\u7ed3\u6784\u5efa\u6a21\u5bf9\u914d\u65b9\u8868\u793a\u5b66\u4e60\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Free energies govern solid-state phase stability, yet computational materials discovery still relies largely on ground-state energies because free energy calculations require ensemble averages. We introduce the thermodynamic interatomic potential (TIP), which extends an interatomic potential from its static energy to a thermodynamically consistent Gibbs free energy model, with thermodynamic responses following from temperature and pressure by automatic differentiation. We implement TIP[UMA] using the universal potential UMA, train it on free energies from quasi-harmonic to molecular dynamics fidelity, and calibrate it to higher-resolution calculations or experiment. From a single evaluation, it returns the equation of state of a crystal and locates phase transitions among competing branches, including dynamically stabilized phases. Fine-tuning extends the model to alloy solubility limits and miscibility gaps. TIP makes the free energy as accessible as the potential energy, opening finite-temperature phase stability to high-throughput discovery.", "arxiv_id": "2608.14502", "arxiv_url": "https://arxiv.org/abs/2608.14502", "authors": ["Juno Nam", "Bowen Deng", "Xiaochen Du", "Luis Barroso-Luque", "Benjamin Kurt Miller", "Rafael G\u00f3mez-Bombarelli"], "brief": "\u8bba\u6587\u63d0\u51fa\u70ed\u529b\u5b66\u539f\u5b50\u95f4\u52bf\uff08TIP\uff09\uff0c\u628a\u4f20\u7edf\u539f\u5b50\u95f4\u52bf\u4ece\u9759\u6001\u80fd\u91cf\u6269\u5c55\u4e3a\u70ed\u529b\u5b66\u4e00\u81f4\u7684\u5409\u5e03\u65af\u81ea\u7531\u80fd\u6a21\u578b\uff0c\u53ef\u901a\u8fc7\u81ea\u52a8\u5fae\u5206\u76f4\u63a5\u5f97\u5230\u6e29\u5ea6\u3001\u538b\u529b\u54cd\u5e94\u3002\u57fa\u4e8e\u901a\u7528\u52bf UMA \u7684 TIP[UMA] \u80fd\u4e00\u6b21\u8bc4\u4f30\u6676\u4f53\u72b6\u6001\u65b9\u7a0b\u5e76\u5b9a\u4f4d\u76f8\u53d8\uff0c\u652f\u6301\u52a8\u6001\u7a33\u5b9a\u76f8\u3001\u5408\u91d1\u6eb6\u89e3\u5ea6\u548c\u6df7\u6eb6\u95f4\u9699\u9884\u6d4b\uff0c\u6709\u671b\u63a8\u52a8\u6709\u9650\u6e29\u6750\u6599\u76f8\u7a33\u5b9a\u6027\u7684\u9ad8\u901a\u91cf\u53d1\u73b0\u3002", "categories": ["cond-mat.mtrl-sci", "cond-mat.stat-mech", "cs.AI", "cs.LG", "physics.chem-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14502", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6750\u6599\u53d1\u73b0", "\u539f\u5b50\u95f4\u52bf", "\u81ea\u7531\u80fd", "\u76f8\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14502v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Universal Thermodynamic Interatomic Potentials for Crystalline Materials", "tldr": "\u8bba\u6587\u63d0\u51fa\u70ed\u529b\u5b66\u539f\u5b50\u95f4\u52bf\uff08TIP\uff09\uff0c\u628a\u4f20\u7edf\u539f\u5b50\u95f4\u52bf\u4ece\u9759\u6001\u80fd\u91cf\u6269\u5c55\u4e3a\u70ed\u529b\u5b66\u4e00\u81f4\u7684\u5409\u5e03\u65af\u81ea\u7531\u80fd\u6a21\u578b\uff0c\u53ef\u901a\u8fc7\u81ea\u52a8\u5fae\u5206\u76f4\u63a5\u5f97\u5230\u6e29\u5ea6\u3001\u538b\u529b\u54cd\u5e94\u3002\u57fa\u4e8e\u901a\u7528\u52bf UMA \u7684 TIP[UMA] \u80fd\u4e00\u6b21\u8bc4\u4f30\u6676\u4f53\u72b6\u6001\u65b9\u7a0b\u5e76\u5b9a\u4f4d\u76f8\u53d8\uff0c\u652f\u6301\u52a8\u6001\u7a33\u5b9a\u76f8\u3001\u5408\u91d1\u6eb6\u89e3\u5ea6\u548c\u6df7\u6eb6\u95f4\u9699\u9884\u6d4b\uff0c\u6709\u671b\u63a8\u52a8\u6709\u9650\u6e29\u6750\u6599\u76f8\u7a33\u5b9a\u6027\u7684\u9ad8\u901a\u91cf\u53d1\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-Tabular Data Generation (CTDG) seeks to learn a generative model from multiple heterogeneous tables and produce new synthetic tabular datasets. However, existing synthetic tabular data generation methods are largely restricted to single-input-table scenarios and struggle to effectively handle multiple heterogeneous tables with diverse feature sets. To address this limitation, we propose a two-stage framework for cross-tabular data generation. In the first stage, each heterogeneous raw table is transformed into a standardized statistical table with the same set of columns across all tables. Each statistical table captures the marginal distributions of the original columns and the pairwise correlations among them. In the second stage, a diffusion transformer model is trained to capture structural patterns across these homogeneous statistical tables and to generate synthetic statistical tables. Synthetic raw tables are subsequently reconstructed from the generated statistical tables via multivariate Gaussian sampling followed by an inverse probability integral transform. This two-stage CTDG framework enables the learning of a unified generative model from multiple heterogeneous tables and supports the generation of an unlimited number of realistic synthetic heterogeneous tables. Experimental results demonstrate high fidelity in the learned statistical representations and a favorable fidelity-diversity trade-off in the generated synthetic data, validating the effectiveness of the proposed approach.", "arxiv_id": "2608.14496", "arxiv_url": "https://arxiv.org/abs/2608.14496", "authors": ["Hao Yan", "Lisa Pilgram", "Dan Liu", "Linglong Kong", "Fida Dankar", "Khaled El Emam"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4e24\u9636\u6bb5\u8de8\u8868\u683c\u6570\u636e\u751f\u6210\u6846\u67b6\uff1a\u5148\u628a\u591a\u4e2a\u5f02\u6784\u5065\u5eb7\u6570\u636e\u8868\u8f6c\u6362\u4e3a\u7edf\u4e00\u5217\u7ed3\u6784\u7684\u7edf\u8ba1\u8868\uff0c\u6355\u6349\u8fb9\u7f18\u5206\u5e03\u4e0e\u4e24\u4e24\u76f8\u5173\u6027\uff1b\u518d\u7528\u6269\u6563 Transformer \u751f\u6210\u65b0\u7684\u7edf\u8ba1\u8868\u5e76\u91cd\u5efa\u539f\u59cb\u8868\u683c\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u4ece\u591a\u5f20\u5f02\u6784\u8868\u4e2d\u5b66\u4e60\u7edf\u4e00\u751f\u6210\u6a21\u578b\uff0c\u5728\u4fdd\u771f\u5ea6\u4e0e\u591a\u6837\u6027\u4e4b\u95f4\u53d6\u5f97\u8f83\u597d\u5e73\u8861\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14496", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8868\u683c\u6570\u636e\u751f\u6210", "\u6269\u6563\u6a21\u578b", "Transformer", "\u5065\u5eb7\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14496v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Generating Benchmark Health Data Using a Tabular Diffusion Transformer", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u4e24\u9636\u6bb5\u8de8\u8868\u683c\u6570\u636e\u751f\u6210\u6846\u67b6\uff1a\u5148\u628a\u591a\u4e2a\u5f02\u6784\u5065\u5eb7\u6570\u636e\u8868\u8f6c\u6362\u4e3a\u7edf\u4e00\u5217\u7ed3\u6784\u7684\u7edf\u8ba1\u8868\uff0c\u6355\u6349\u8fb9\u7f18\u5206\u5e03\u4e0e\u4e24\u4e24\u76f8\u5173\u6027\uff1b\u518d\u7528\u6269\u6563 Transformer \u751f\u6210\u65b0\u7684\u7edf\u8ba1\u8868\u5e76\u91cd\u5efa\u539f\u59cb\u8868\u683c\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u4ece\u591a\u5f20\u5f02\u6784\u8868\u4e2d\u5b66\u4e60\u7edf\u4e00\u751f\u6210\u6a21\u578b\uff0c\u5728\u4fdd\u771f\u5ea6\u4e0e\u591a\u6837\u6027\u4e4b\u95f4\u53d6\u5f97\u8f83\u597d\u5e73\u8861\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Network-level maintenance planning requires repeated evaluations of equilibrium traffic flows under road capacity reductions. While equilibrium traffic assignment models are well established, their repeated solution quickly becomes computationally prohibitive and challenging to embed within maintenance scheduling problems. This paper investigates data-driven surrogate models that approximate equilibrium arc flows directly from origin-destination demand, using optimization-based equilibrium solutions as ground truth. A real-world case study based on traffic data from the Newark, New Jersey area demonstrates the effectiveness of the proposed approach as a scalable building block for future maintenance scheduling frameworks.", "arxiv_id": "2608.14491", "arxiv_url": "https://arxiv.org/abs/2608.14491", "authors": ["Charitha Nandepu", "Lohitha Kalepu", "Gabriele Ciavarella", "SangWoo Park"], "brief": "\u672c\u6587\u7814\u7a76\u9053\u8def\u517b\u62a4\u8c03\u5ea6\u4e2d\u53cd\u590d\u6c42\u89e3\u4ea4\u901a\u5747\u8861\u6d41\u5e26\u6765\u7684\u8ba1\u7b97\u74f6\u9888\uff0c\u
