envelopes. Rather than treating safety as a static constraint isolated within individual software modules, we introduce a cross-layer safety transformation process spanning symbolic, spatial, and dynamic world models. We show how this representation naturally interfaces with physical AI runtime harnesses to guarantee safe urban mobility.", "arxiv_id": "2608.14481", "arxiv_url": "https://arxiv.org/abs/2608.14481", "authors": ["Alexei Odinokov", "Rostislav Yavorskiy"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u57ce\u5e02\u79fb\u52a8\u673a\u5668\u4eba\u5b89\u5168\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u5c06\u7cfb\u7edf\u5316\u5371\u9669\u5206\u6790\u4e0e\u8fd0\u884c\u65f6\u5b89\u5168\u7ea6\u675f\u7ed3\u5408\u8d77\u6765\u3002\u6838\u5fc3\u662f\u201c\u5371\u9669\u611f\u77e5\u5b89\u5168\u5305\u7edc\u201d\uff0c\u8d2f\u7a7f\u7b26\u53f7\u3001\u7a7a\u95f4\u548c\u52a8\u6001\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u63a5\u5165\u7269\u7406 AI \u8fd0\u884c\u65f6\u4ee5\u5f3a\u5316\u590d\u6742\u4eba\u673a\u4ea4\u4e92\u4e2d\u7684\u5b89\u5168\u4fdd\u969c\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14481", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b89\u5168", "\u667a\u80fd\u4f53", "\u57ce\u5e02\u79fb\u52a8", "\u8fd0\u884c\u65f6\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14481v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ensuring Safe Physical AI in Urban Mobility via Hazard-Informed Synthesized Envelopes", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u57ce\u5e02\u79fb\u52a8\u673a\u5668\u4eba\u5b89\u5168\u7684\u7edf\u4e00\u6846\u67b6\uff0c\u5c06\u7cfb\u7edf\u5316\u5371\u9669\u5206\u6790\u4e0e\u8fd0\u884c\u65f6\u5b89\u5168\u7ea6\u675f\u7ed3\u5408\u8d77\u6765\u3002\u6838\u5fc3\u662f\u201c\u5371\u9669\u611f\u77e5\u5b89\u5168\u5305\u7edc\u201d\uff0c\u8d2f\u7a7f\u7b26\u53f7\u3001\u7a7a\u95f4\u548c\u52a8\u6001\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u63a5\u5165\u7269\u7406 AI \u8fd0\u884c\u65f6\u4ee5\u5f3a\u5316\u590d\u6742\u4eba\u673a\u4ea4\u4e92\u4e2d\u7684\u5b89\u5168\u4fdd\u969c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neural Architecture Search (NAS) aims to automate neural network architecture design, reducing reliance on human expertise. Among the various NAS methods, differentiable NAS has gained prominence due to its efficiency and accuracy compared to conventional NAS approaches. Since differentiable NAS relaxes the architecture search space into a continuous domain, it is possible to apply principles from continuous optimization to NAS. In this paper, we propose Linear Programming-based NAS (LP-NAS), a mathematical programming-based framework for differentiable NAS that is applicable to a wide range of continuous search spaces. LP-NAS formulates a linear program (LP) using the validation-loss gradient and the training-loss Hessian to compute an architecture update direction that improves generalization while preserving the optimality of the model parameters. By following this LP-derived descent direction, LP-NAS efficiently navigates the architecture search space, leading to faster and more effective architecture optimization. We introduce two computationally efficient variants of LP-NAS, namely S-LP-NAS and R-LP-NAS. Applying LP-NAS to the Differentiable Architecture Search (DARTS) search space results in two algorithmic variants, S-LP-DARTS and R-LP-DARTS. Both variants achieve faster convergence and significantly higher validation performance during the early search iterations than the standard DARTS algorithm. Extensive experiments on CIFAR-10 and CIFAR-100 show that LP-DARTS outperforms standard DARTS in both the architecture search and evaluation phases. Additionally, we compare our approach with several DARTS variants (P-DARTS, PC-DARTS, and STO-DARTS) on the CIFAR-10 dataset and demonstrate its effectiveness. Furthermore, we validate the transferability of the discovered architectures through experiments on the ImageNet dataset.", "arxiv_id": "2608.14472", "arxiv_url": "https://arxiv.org/abs/2608.14472", "authors": ["Abhishek Shukla", "Ankur Sinha", "Faiz Hamid"], "brief": "\u8bba\u6587\u63d0\u51fa LP-NAS\uff0c\u5c06\u53ef\u5fae\u5206\u795e\u7ecf\u67b6\u6784\u641c\u7d22\u8868\u8ff0\u4e3a\u7ebf\u6027\u89c4\u5212\uff0c\u5229\u7528\u9a8c\u8bc1\u635f\u5931\u68af\u5ea6\u548c\u8bad\u7ec3\u635f\u5931 Hessian \u8ba1\u7b97\u66f4\u6709\u5229\u4e8e\u6cdb\u5316\u7684\u67b6\u6784\u66f4\u65b0\u65b9\u5411\u3002\u5176\u5728 DARTS \u641c\u7d22\u7a7a\u95f4\u4e0a\u7684\u53d8\u4f53 LP-DARTS \u5728 CIFAR-10/100 \u4e0a\u76f8\u6bd4\u6807\u51c6 DARTS \u6536\u655b\u66f4\u5feb\u3001\u9a8c\u8bc1\u6027\u80fd\u66f4\u9ad8\uff0c\u5e76\u5728 ImageNet \u4e0a\u9a8c\u8bc1\u4e86\u8fc1\u79fb\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14472", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u67b6\u6784\u641c\u7d22", "\u53ef\u5fae\u5206\u641c\u7d22", "\u7ebf\u6027\u89c4\u5212", "\u6a21\u578b\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14472v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LP-NAS: Linear Programming-based Neural Architecture Search", "tldr": "\u8bba\u6587\u63d0\u51fa LP-NAS\uff0c\u5c06\u53ef\u5fae\u5206\u795e\u7ecf\u67b6\u6784\u641c\u7d22\u8868\u8ff0\u4e3a\u7ebf\u6027\u89c4\u5212\uff0c\u5229\u7528\u9a8c\u8bc1\u635f\u5931\u68af\u5ea6\u548c\u8bad\u7ec3\u635f\u5931 Hessian \u8ba1\u7b97\u66f4\u6709\u5229\u4e8e\u6cdb\u5316\u7684\u67b6\u6784\u66f4\u65b0\u65b9\u5411\u3002\u5176\u5728 DARTS \u641c\u7d22\u7a7a\u95f4\u4e0a\u7684\u53d8\u4f53 LP-DARTS \u5728 CIFAR-10/100 \u4e0a\u76f8\u6bd4\u6807\u51c6 DARTS \u6536\u655b\u66f4\u5feb\u3001\u9a8c\u8bc1\u6027\u80fd\u66f4\u9ad8\uff0c\u5e76\u5728 ImageNet \u4e0a\u9a8c\u8bc1\u4e86\u8fc1\u79fb\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Short-horizon forecasting of fine particulate matter (PM2.5) remains difficult when observations from the target domain are limited and the statistical properties of the source and target domains differ. In these settings, models trained only on local data may not capture complex temporal dynamics, while direct transfer learning can result in negative transfer. This study develops a shift-aware dual-encoder transfer framework that combines source-domain knowledge with target-specific representation learning. The source encoder was pretrained using hourly observations from 10 U.S. monitoring locations. The framework was then adapted and evaluated using two years of hourly observations from 77 stations in Taiwan under a chronological train-validation-test protocol. Among the four principal baselines, the frozen-source dual-encoder model achieved the best performance, with MSE = 21.8960, MAE = 3.1597, and R^2 = 0.8725. This corresponds to an MSE reduction of approximately 7.1% relative to TL-v1 and 4.1% relative to TL-v2. The ablation analysis showed that removing the Taiwan-specific branch caused the largest decline in performance. Allowing the source encoder to adapt produced the best overall result, with MSE = 21.6575, MAE = 3.1383, and R^2 = 0.8739. SHAP analysis indicated that predictions were driven mainly by recent PM2.5 observations and meteorological variables related to pollutant transport and dispersion. These results suggest that source-domain knowledge is most effective when target-specific information is preserved and the transferred representation is allowed to adapt under target supervision.", "arxiv_id": "2608.14456", "arxiv_url": "https://arxiv.org/abs/2608.14456", "authors": ["Shahab Band", "Hamed Mohammadi"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6570\u636e\u53d7\u9650 PM2.5 \u77ed\u671f\u9884\u6d4b\u7684\u8fc1\u79fb\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u53cc\u7f16\u7801\u5668\u878d\u5408\u6e90\u57df\u77e5\u8bc6\u4e0e\u76ee\u6807\u57df\u8868\u5f81\uff0c\u5e76\u663e\u5f0f\u8003\u8651\u57df\u504f\u79fb\u4ee5\u51cf\u5c11\u8d1f\u8fc1\u79fb\u3002\u5728\u53f0\u6e7e 77 \u4e2a\u76d1\u6d4b\u7ad9\u5b9e\u9a8c\u4e2d\uff0c\u76f8\u6bd4\u591a\u79cd\u8fc1\u79fb\u57fa\u7ebf\u964d\u4f4e\u4e86 MSE\uff0c\u4e14\u6e90\u7f16\u7801\u5668\u53ef\u9002\u5e94\u5fae\u8c03\u65f6\u6548\u679c\u6700\u4f73\uff1b\u6d88\u878d\u548c SHAP \u5206\u6790\u663e\u793a\u76ee\u6807\u57df\u5206\u652f\u4e0e\u8fd1\u671f\u6c61\u67d3/\u6c14\u8c61\u53d8\u91cf\u6700\u5173\u952e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14456", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fc1\u79fb\u5b66\u4e60", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u7a7a\u6c14\u6c61\u67d3", "\u57df\u9002\u5e94"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14456v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Shift Aware Transfer Learning with Adaptive Dual-Encoder Fusion for PM Forecasting in Data-Limited Environments", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u6570\u636e\u53d7\u9650 PM2.5 \u77ed\u671f\u9884\u6d4b\u7684\u8fc1\u79fb\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u53cc\u7f16\u7801\u5668\u878d\u5408\u6e90\u57df\u77e5\u8bc6\u4e0e\u76ee\u6807\u57df\u8868\u5f81\uff0c\u5e76\u663e\u5f0f\u8003\u8651\u57df\u504f\u79fb\u4ee5\u51cf\u5c11\u8d1f\u8fc1\u79fb\u3002\u5728\u53f0\u6e7e 77 \u4e2a\u76d1\u6d4b\u7ad9\u5b9e\u9a8c\u4e2d\uff0c\u76f8\u6bd4\u591a\u79cd\u8fc1\u79fb\u57fa\u7ebf\u964d\u4f4e\u4e86 MSE\uff0c\u4e14\u6e90\u7f16\u7801\u5668\u53ef\u9002\u5e94\u5fae\u8c03\u65f6\u6548\u679c\u6700\u4f73\uff1b\u6d88\u878d\u548c SHAP \u5206\u6790\u663e\u793a\u76ee\u6807\u57df\u5206\u652f\u4e0e\u8fd1\u671f\u6c61\u67d3/\u6c14\u8c61\u53d8\u91cf\u6700\u5173\u952e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Neural Architecture Search (NAS) is naturally formulated as a bilevel optimization problem, where the upper-level optimizes the architecture using validation performance and the lower-level trains network parameters using training loss. However, NAS is computationally expensive due to discrete architectural decisions, exponentially growing search spaces, and the high cost of training candidate architectures. This work develops a general bilevel optimization framework for NAS across diverse architectures, including MLPs, CNNs, RNNs, and Transformers, to identify compact architectures with strong predictive performance. We propose three scalable formulations that replace discrete neuron- and activation-level decisions with continuous relaxations, enabling differentiable optimization over otherwise combinatorial architecture spaces. These formulations give rise to three NAS methods: NAS based on Neuron Gating (NAS-NG), NAS based on Mixed Activation (NAS-MA), and NAS based on Neuron Gating and Mixed Activation (NAS-NGMA). Experiments on MLPs and CNNs using MNIST and CIFAR-10 show that the proposed methods consistently identify compact architectures with competitive or improved predictive performance. On MNIST, NAS-NGMA achieves 98.68% test accuracy with 7.69M MLP parameters, while NAS-NG achieves 99.63% accuracy with only 0.26M CNN parameters. On CIFAR-10, the proposed methods consistently outperform vanilla DARTS. Further experiments demonstrate that NAS-NG can optimize substantially over-parameterized and literature-optimal architectures, improving accuracy while reducing parameters. These results establish relaxed bilevel optimization as a scalable alternative to discrete NAS and provide a general framework for efficient neuron- and activation-level architecture optimization.", "arxiv_id": "2608.14443", "arxiv_url": "https://arxiv.org/abs/2608.14443", "authors": ["Abhishek Shukla", "Ankur Sinha", "Faiz Hamid"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u795e\u7ecf\u67b6\u6784\u641c\u7d22\u7684\u53cc\u5c42\u4f18\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u795e\u7ecf\u5143\u95e8\u63a7\u548c\u6df7\u5408\u6fc0\u6d3b\u5c06\u79bb\u6563\u67b6\u6784\u9009\u62e9\u8fde\u7eed\u677e\u5f1b\uff0c\u4ece\u800c\u53ef\u5fae\u5730\u641c\u7d22\u7d27\u51d1\u7f51\u7edc\u3002\u5b9e\u9a8c\u8868\u660e\u8be5\u65b9\u6cd5\u5728 MLP/CNN\u3001MNIST/CIFAR-10 \u4e0a\u80fd\u51cf\u5c11\u53c2\u6570\u91cf\u5e76\u4fdd\u6301\u6216\u63d0\u5347\u7cbe\u5ea6\uff0c\u4e14\u4f18\u4e8e vanilla DARTS\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14443", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u795e\u7ecf\u67b6\u6784\u641c\u7d22", "\u53cc\u5c42\u4f18\u5316", "\u6a21\u578b\u538b\u7f29", "\u53ef\u5fae\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14443v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Designing Compact Neural Architectures via Neuron Gating and Mixed Activation", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u7528\u4e8e\u795e\u7ecf\u67b6\u6784\u641c\u7d22\u7684\u53cc\u5c42\u4f18\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u795e\u7ecf\u5143\u95e8\u63a7\u548c\u6df7\u5408\u6fc0\u6d3b\u5c06\u79bb\u6563\u67b6\u6784\u9009\u62e9\u8fde\u7eed\u677e\u5f1b\uff0c\u4ece\u800c\u53ef\u5fae\u5730\u641c\u7d22\u7d27\u51d1\u7f51\u7edc\u3002\u5b9e\u9a8c\u8868\u660e\u8be5\u65b9\u6cd5\u5728 MLP/CNN\u3001MNIST/CIFAR-10 \u4e0a\u80fd\u51cf\u5c11\u53c2\u6570\u91cf\u5e76\u4fdd\u6301\u6216\u63d0\u5347\u7cbe\u5ea6\uff0c\u4e14\u4f18\u4e8e vanilla DARTS\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI is increasingly being used to help with AI R\u0026D. Under certain conditions this feedback loop might be able to produce an intelligence explosion, with rapidly escalating AI capabilities. I explore the mathematics of the most explosive possibilities, with an eye to understanding what drives the dynamics. I show that singular growth (towards a vertical asymptote) is harder to achieve than would be expected from recent economics-inspired modelling, and that there is an important but neglected class of growth rates that are faster than exponential but don\u0027t lead to a vertical asymptote. I draw out the generation time (the time to go around the feedback loop) as a neglected parameter that plays a pivotal role in determining the behaviour of any intelligence explosion --- one cannot have singular growth unless the generation time rapidly approaches zero.", "arxiv_id": "2608.14426", "arxiv_url": "https://arxiv.org/abs/2608.14426", "authors": ["Toby Ord"], "brief": "\u672c\u6587\u5206\u6790 AI \u8f85\u52a9 AI \u7814\u53d1\u5f62\u6210\u53cd\u9988\u5faa\u73af\u65f6\u53ef\u80fd\u51fa\u73b0\u7684\u201c\u667a\u80fd\u7206\u70b8\u201d\u52a8\u529b\u5b66\u3002\u7ed3\u679c\u6307\u51fa\uff0c\u771f\u6b63\u8d8b\u5411\u5782\u76f4\u6e10\u8fd1\u7ebf\u7684\u5947\u5f02\u589e\u957f\u6bd4\u4e00\u4e9b\u7ecf\u6d4e\u5b66\u6a21\u578b\u9884\u671f\u66f4\u96be\u5b9e\u73b0\uff0c\u4f46\u5b58\u5728\u5feb\u4e8e\u6307\u6570\u589e\u957f\u4e14\u4e0d\u5947\u5f02\u7684\u91cd\u8981\u589e\u957f\u7c7b\u578b\uff1b\u5176\u4e2d\u201c\u4ee3\u9645\u65f6\u95f4\u201d\u662f\u51b3\u5b9a\u662f\u5426\u7206\u70b8\u5f0f\u589e\u957f\u7684\u5173\u952e\u53c2\u6570\u3002", "categories": ["cs.AI", "econ.TH"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14426", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u7206\u70b8", "AI\u7814\u53d1", "\u589e\u957f\u52a8\u529b\u5b66", "\u7ecf\u6d4e\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14426v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Dynamics of Intelligence Explosions", "tldr": "\u672c\u6587\u5206\u6790 AI \u8f85\u52a9 AI \u7814\u53d1\u5f62\u6210\u53cd\u9988\u5faa\u73af\u65f6\u53ef\u80fd\u51fa\u73b0\u7684\u201c\u667a\u80fd\u7206\u70b8\u201d\u52a8\u529b\u5b66\u3002\u7ed3\u679c\u6307\u51fa\uff0c\u771f\u6b63\u8d8b\u5411\u5782\u76f4\u6e10\u8fd1\u7ebf\u7684\u5947\u5f02\u589e\u957f\u6bd4\u4e00\u4e9b\u7ecf\u6d4e\u5b66\u6a21\u578b\u9884\u671f\u66f4\u96be\u5b9e\u73b0\uff0c\u4f46\u5b58\u5728\u5feb\u4e8e\u6307\u6570\u589e\u957f\u4e14\u4e0d\u5947\u5f02\u7684\u91cd\u8981\u589e\u957f\u7c7b\u578b\uff1b\u5176\u4e2d\u201c\u4ee3\u9645\u65f6\u95f4\u201d\u662f\u51b3\u5b9a\u662f\u5426\u7206\u70b8\u5f0f\u589e\u957f\u7684\u5173\u952e\u53c2\u6570\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM evaluations often use fixed sampling budgets, testing every item the same number of times even after estimates are precise. We introduce optstop, a precision-based adaptive stopping framework that treats evaluation as a sequential measurement problem: keep sampling where uncertainty remains high, and stop where estimates are precise or stable enough. The framework builds on hierarchical Bayesian inference, supports binary, ordinal, and continuous outcomes, and keeps every benchmark item eligible for sampling, without requiring a calibrated item bank. It runs live or retrospectively, and includes a safeguard that samples more cautiously as measured performance approaches zero, where rare successes matter most. In an illustrative 200-item, 10-epoch evaluation, it removes 57%-97% of planned trials across nine validation settings, with overall conclusions equivalent to the full run. These results show that LLM evaluation compute can be allocated by uncertainty rather than by fixed repetition counts, with the magnitude of savings depending on evaluation design.", "arxiv_id": "2608.14425", "arxiv_url": "https://arxiv.org/abs/2608.14425", "authors": ["Toby D. Pilditch"], "brief": "\u672c\u6587\u63d0\u51fa optstop\uff0c\u5c06\u5927\u6a21\u578b\u8bc4\u6d4b\u5efa\u6a21\u4e3a\u5e8f\u8d2f\u6d4b\u91cf\u95ee\u9898\uff0c\u7528\u5c42\u6b21\u8d1d\u53f6\u65af\u63a8\u65ad\u6839\u636e\u4e0d\u786e\u5b9a\u6027\u81ea\u9002\u5e94\u51b3\u5b9a\u4f55\u65f6\u7ee7\u7eed\u91c7\u6837\u6216\u505c\u6b62\u3002\u5b83\u652f\u6301\u4e8c\u503c\u3001\u5e8f\u6570\u548c\u8fde\u7eed\u7ed3\u679c\uff0c\u5728\u793a\u4f8b\u8bc4\u6d4b\u4e2d\u53ef\u51cf\u5c11 57%-97% \u7684\u8ba1\u5212\u8bd5\u9a8c\uff0c\u540c\u65f6\u4fdd\u6301\u4e0e\u5b8c\u6574\u8bc4\u6d4b\u7b49\u4ef7\u7684\u603b\u4f53\u7ed3\u8bba\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14425", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u6a21\u578b\u8bc4\u6d4b", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u81ea\u9002\u5e94\u91c7\u6837", "\u4e0d\u786e\u5b9a\u6027\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14425v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Knowing When to Stop: Bayesian Optimal Stopping for LLM Evaluations", "tldr": "\u672c\u6587\u63d0\u51fa optstop\uff0c\u5c06\u5927\u6a21\u578b\u8bc4\u6d4b\u5efa\u6a21\u4e3a\u5e8f\u8d2f\u6d4b\u91cf\u95ee\u9898\uff0c\u7528\u5c42\u6b21\u8d1d\u53f6\u65af\u63a8\u65ad\u6839\u636e\u4e0d\u786e\u5b9a\u6027\u81ea\u9002\u5e94\u51b3\u5b9a\u4f55\u65f6\u7ee7\u7eed\u91c7\u6837\u6216\u505c\u6b62\u3002\u5b83\u652f\u6301\u4e8c\u503c\u3001\u5e8f\u6570\u548c\u8fde\u7eed\u7ed3\u679c\uff0c\u5728\u793a\u4f8b\u8bc4\u6d4b\u4e2d\u53ef\u51cf\u5c11 57%-97% \u7684\u8ba1\u5212\u8bd5\u9a8c\uff0c\u540c\u65f6\u4fdd\u6301\u4e0e\u5b8c\u6574\u8bc4\u6d4b\u7b49\u4ef7\u7684\u603b\u4f53\u7ed3\u8bba\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Art style is a signature of professional digital artists that develops through repeated experimentation, reflection, and adaptation. While generative AI (GenAI) can reproduce styles with high fidelity, current tools provide limited support for exploring new stylistic directions and may encourage style replication over exploration. To address this gap, we propose Analyze-Experiment-Resituate (AER), a framework for AI-assisted style exploration derived from interviews with 10 professional digital artists. Rather than prioritizing visually appealing outputs alone, AER supports three core practices of style exploration, including interpreting references, trying out stylistic possibilities, and reflecting on how emerging styles may be received. Specifically, AER enabled artists to (1) analyze artworks into interpretable stylistic elements, (2) have controllable experimentation guided by their own choices, and (3) resituate emerging styles through simulated social perspectives. We implemented AER in a prototype system and evaluated it in a controlled study with 16 artists. Compared with a direct style-transfer workflow, AER increased artists\u0027 agency and reflection as they pursued new stylistic directions. A two-week field study with four artists revealed how the AER framework influenced daily style exploration, such as reflection, experimentation, and stylistic decision-making at each stage. We discuss opportunities and challenges in designing AI-assisted style-exploration workflows, and outline implications for future artistic support tools.", "arxiv_id": "2608.14405", "arxiv_url": "https://arxiv.org/abs/2608.14405", "authors": ["Wen-Fan Wang", "TsaiHsuan Lin", "Chi-Lan Yang", "An-Ru Cheng", "Bing-Yu Chen"], "brief": "\u8bba\u6587\u63d0\u51fa AER\uff08\u5206\u6790-\u5b9e\u9a8c-\u518d\u60c5\u5883\u5316\uff09\u6846\u67b6\uff0c\u5e2e\u52a9\u6570\u5b57\u827a\u672f\u5bb6\u501f\u52a9\u751f\u6210\u5f0f AI \u4ece\u5355\u7eaf\u98ce\u683c\u590d\u523b\u8f6c\u5411\u65b0\u98ce\u683c\u63a2\u7d22\u3002\u539f\u578b\u7cfb\u7edf\u5728\u53d7\u63a7\u5b9e\u9a8c\u548c\u4e24\u5468\u7530\u91ce\u7814\u7a76\u4e2d\u663e\u793a\uff0c\u76f8\u6bd4\u76f4\u63a5\u98ce\u683c\u8fc1\u79fb\uff0cAER \u63d0\u5347\u4e86\u827a\u672f\u5bb6\u7684\u81ea\u4e3b\u6027\u3001\u53cd\u601d\u80fd\u529b\u548c\u98ce\u683c\u51b3\u7b56\u652f\u6301\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14405", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u6210\u5f0fAI", "\u4eba\u673a\u4ea4\u4e92", "\u827a\u672f\u521b\u4f5c", "\u98ce\u683c\u63a2\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14405v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Style Replication to Style Exploration: Enabling Art Style Exploration with Analyze-Experiment-Resituate Framework", "tldr": "\u8bba\u6587\u63d0\u51fa AER\uff08\u5206\u6790-\u5b9e\u9a8c-\u518d\u60c5\u5883\u5316\uff09\u6846\u67b6\uff0c\u5e2e\u52a9\u6570\u5b57\u827a\u672f\u5bb6\u501f\u52a9\u751f\u6210\u5f0f AI \u4ece\u5355\u7eaf\u98ce\u683c\u590d\u523b\u8f6c\u5411\u65b0\u98ce\u683c\u63a2\u7d22\u3002\u539f\u578b\u7cfb\u7edf\u5728\u53d7\u63a7\u5b9e\u9a8c\u548c\u4e24\u5468\u7530\u91ce\u7814\u7a76\u4e2d\u663e\u793a\uff0c\u76f8\u6bd4\u76f4\u63a5\u98ce\u683c\u8fc1\u79fb\uff0cAER \u63d0\u5347\u4e86\u827a\u672f\u5bb6\u7684\u81ea\u4e3b\u6027\u3001\u53cd\u601d\u80fd\u529b\u548c\u98ce\u683c\u51b3\u7b56\u652f\u6301\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Patients increasingly ask large language model (LLM) assistants which doctor to see, making these systems AI infomediaries: algorithms that intermediate one person\u0027s choice among other people and thereby decide, silently and at scale, which physicians become visible. We report a prespecified randomized algorithm audit of what causally moves those recommendations. Seven models (six open-weight; gpt-4o-mini) each chose among five synthetic family-medicine physician cards whose attributes were independently randomized across 3,024 choice sets, three patient personas, nine prompt paraphrases and nine experimental arms, yielding 40,068 scored responses; gender and ethnicity were signaled through names following correspondence-audit methodology. Reputation signals dominate: raising a rating from 3.9 to 4.7 increases choice probability by 31.4 percentage points (pp), and raising the fee from $90 to $190 lowers it by 20.0 pp. Demographic parity is rejected, but not in the direction human audit studies predict: female-signaled names gain 2.5 pp, and Hispanic-, South-Asian- and Black-signaled names gain 1.3-2.9 pp over White-signaled names, tilts worth $7-$14 per visit in fee-equivalent terms, and a content-free first-listed position is worth $11. Yet models mentioned gender or ethnicity in at most 0.03% of their stated reasons and abstained in 0.39% of trials, so these effects are invisible in the models\u0027 own explanations, and transparency obligations relying on model self-report would not detect them. One reasoning model failed the prespecified auditability gate outright. The frozen design makes the audit repeatable: any new model can be assessed against identical stimuli, making recurring behavioural audit, rather than self-reported explanation, the monitoring technology fit for purpose.", "arxiv_id": "2608.14399", "arxiv_url": "https://arxiv.org/abs/2608.14399", "authors": ["Syeda Anshrah Gillani", "Mirza Samad Ahmed Baig"], "brief": "\u8bba\u6587\u5bf97\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u5728\u8f85\u52a9\u60a3\u8005\u9009\u62e9\u5bb6\u5ead\u533b\u751f\u65f6\u7684\u63a8\u8350\u884c\u4e3a\u505a\u4e86\u9884\u6ce8\u518c\u968f\u673a\u7b97\u6cd5\u5ba1\u8ba1\u3002\u7ed3\u679c\u53d1\u73b0\u8bc4\u5206\u548c\u8d39\u7528\u7b49\u58f0\u8a89/\u4ef7\u683c\u4fe1\u53f7\u4e3b\u5bfc\u63a8\u8350\uff0c\u4f46\u6a21\u578b\u4e5f\u5b58\u5728\u9690\u853d\u7684\u4eba\u53e3\u7edf\u8ba1\u503e\u5411\uff0c\u4e14\u81ea\u6211\u89e3\u91ca\u51e0\u4e4e\u4e0d\u4f1a\u63d0\u53ca\u6027\u522b\u6216\u65cf\u88d4\uff0c\u8bf4\u660e\u9700\u7528\u53ef\u91cd\u590d\u884c\u4e3a\u5ba1\u8ba1\u800c\u975e\u6a21\u578b\u81ea\u62a5\u6765\u76d1\u7ba1\u3002", "categories": ["cs.CY", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14399", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7b97\u6cd5\u5ba1\u8ba1", "\u516c\u5e73\u6027", "\u533b\u7597AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14399v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Whose doctor does the AI recommend? An algorithm audit of reputation and demographic signals in large language model-assisted physician choice", "tldr": "\u8bba\u6587\u5bf97\u4e2a\u5927\u8bed\u8a00\u6a21\u578b\u5728\u8f85\u52a9\u60a3\u8005\u9009\u62e9\u5bb6\u5ead\u533b\u751f\u65f6\u7684\u63a8\u8350\u884c\u4e3a\u505a\u4e86\u9884\u6ce8\u518c\u968f\u673a\u7b97\u6cd5\u5ba1\u8ba1\u3002\u7ed3\u679c\u53d1\u73b0\u8bc4\u5206\u548c\u8d39\u7528\u7b49\u58f0\u8a89/\u4ef7\u683c\u4fe1\u53f7\u4e3b\u5bfc\u63a8\u8350\uff0c\u4f46\u6a21\u578b\u4e5f\u5b58\u5728\u9690\u853d\u7684\u4eba\u53e3\u7edf\u8ba1\u503e\u5411\uff0c\u4e14\u81ea\u6211\u89e3\u91ca\u51e0\u4e4e\u4e0d\u4f1a\u63d0\u53ca\u6027\u522b\u6216\u65cf\u88d4\uff0c\u8bf4\u660e\u9700\u7528\u53ef\u91cd\u590d\u884c\u4e3a\u5ba1\u8ba1\u800c\u975e\u6a21\u578b\u81ea\u62a5\u6765\u76d1\u7ba1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Zahavy [2026] argues that Large Language Models, despite their capabilities in induction and deduction, cannot perform the abductive \"Jump\" that produced Einstein\u0027s equivalence principle, and attributes this limitation to the absence of embodied simulation. Zheng-Xin [2026] and Farmer [2026] question whether embodiment is necessary for abduction, pointing to alternative routes to General Relativity and forms of abduction that require no sensorimotor grounding. Max Planck resolved the blackbody radiation problem in 1900. Planck\u0027s move to E = h\u03bd required no embodied simulation. It was motivated by a mathematical consequence of classical theory, an infinite predicted energy for a finite measured quantity, that could not be physically accepted. We show that neither induction nor deduction could have produced the postulate and argue that its adoption required a coupling between epistemic error and physical cost. We formalize this distinction through thermodynamic coupling and show that fixed-weight transformer inference lacks such coupling, regardless of model scale. This is consistent with empirical results showing that output entropy remains nearly unchanged across tasks with sharply increasing causal difficulty, even as accuracy falls from 100% to 17%. We therefore argue that the missing ingredient in machine abduction may lie deeper than embodiment: a system must have some physical mechanism through which epistemic error becomes costly enough to force revision.", "arxiv_id": "2608.14397", "arxiv_url": "https://arxiv.org/abs/2608.14397", "authors": ["Paras Balani", "Subhrakanta Panda"], "brief": "\u8bba\u6587\u53cd\u9a73\u201cLLM\u7f3a\u4e4f\u6eaf\u56e0\u8df3\u8dc3\u53ea\u662f\u56e0\u4e3a\u6ca1\u6709\u5177\u8eab\u6a21\u62df\u201d\u7684\u89c2\u70b9\uff0c\u501f\u666e\u6717\u514b\u91cf\u5b50\u5047\u8bbe\u8bf4\u660e\u5173\u952e\u53ef\u80fd\u662f\u8ba4\u8bc6\u9519\u8bef\u4e0e\u7269\u7406\u4ee3\u4ef7\u4e4b\u95f4\u7684\u8026\u5408\u3002\u4f5c\u8005\u5f62\u5f0f\u5316\u4e3a\u70ed\u529b\u5b66\u8026\u5408\uff0c\u5e76\u8ba4\u4e3a\u56fa\u5b9a\u6743\u91cd Transformer \u63a8\u7406\u5373\u4f7f\u6269\u5c55\u89c4\u6a21\u4e5f\u7f3a\u4e4f\u8fd9\u79cd\u673a\u5236\uff0c\u56e0\u800c\u96be\u4ee5\u88ab\u9519\u8bef\u4ee3\u4ef7\u8feb\u4f7f\u4fee\u6b63\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14397", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6eaf\u56e0\u63a8\u7406", "Transformer", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14397v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LLMs Don\u0027t Pay for the Jump", "tldr": "\u8bba\u6587\u53cd\u9a73\u201cLLM\u7f3a\u4e4f\u6eaf\u56e0\u8df3\u8dc3\u53ea\u662f\u56e0\u4e3a\u6ca1\u6709\u5177\u8eab\u6a21\u62df\u201d\u7684\u89c2\u70b9\uff0c\u501f\u666e\u6717\u514b\u91cf\u5b50\u5047\u8bbe\u8bf4\u660e\u5173\u952e\u53ef\u80fd\u662f\u8ba4\u8bc6\u9519\u8bef\u4e0e\u7269\u7406\u4ee3\u4ef7\u4e4b\u95f4\u7684\u8026\u5408\u3002\u4f5c\u8005\u5f62\u5f0f\u5316\u4e3a\u70ed\u529b\u5b66\u8026\u5408\uff0c\u5e76\u8ba4\u4e3a\u56fa\u5b9a\u6743\u91cd Transformer \u63a8\u7406\u5373\u4f7f\u6269\u5c55\u89c4\u6a21\u4e5f\u7f3a\u4e4f\u8fd9\u79cd\u673a\u5236\uff0c\u56e0\u800c\u96be\u4ee5\u88ab\u9519\u8bef\u4ee3\u4ef7\u8feb\u4f7f\u4fee\u6b63\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The alternating direction method of multipliers (ADMM), as a landmark algorithm, has attracted tremendous research attention and extensive practical applications over the past two decades. It is well known that, although the two-block ADMM enjoys well-established theoretical convergence guarantees, its direct extension to the three-block case may fail to converge, as demonstrated by existing counterexamples [5]. However, to the best of our knowledge, the case in which the third constraint block is the identity remains unresolved: the existing literature gives neither a general convergence proof nor a counterexample for this subclass. In this paper, we give a negative answer: direct three-block ADMM may fail even when the first two blocks are strongly convex quadratics. Using Codex with GPT-5.6 Sol, we construct an explicit rational counterexample candidate and verify it along a piecewise-affine reduction path; exact checks show that direct three-block ADMM on this instance produces a bounded nonconvergent orbit of period 66. Within the same Codex workflow, we further guide a study of multiplier relaxation and clarify when convergence can be restored at the fixed-instance and class levels: a problem-dependent small dual step can restore convergence, whereas no positive relative step works uniformly over the whole class. Furthermore, we also test the recent Kimi Code with Kimi K3 model without the Codex candidate or project-specific route guidance; along a different path it produces an exact locally attracting period-23 certificate, convertible to an equivalent all-identity instance. The comparison suggests that different research-harness configurations can shape the mathematical objects explored and the certificates pursued.", "arxiv_id": "2608.14396", "arxiv_url": "https://arxiv.org/abs/2608.14396", "authors": ["Kenan Xu", "Xiangfeng Wang"], "brief": "\u672c\u6587\u9488\u5bf9\u4e09\u5757 ADMM \u5728\u7b2c\u4e09\u4e2a\u7ea6\u675f\u5757\u4e3a\u5355\u4f4d\u77e9\u9635\u65f6\u662f\u5426\u6536\u655b\u7684\u5f00\u653e\u95ee\u9898\uff0c\u501f\u52a9 Codex/GPT-5.6 Sol \u6784\u9020\u5e76\u4e25\u683c\u9a8c\u8bc1\u4e86\u4e00\u4e2a\u6709\u7406\u6570\u53cd\u4f8b\uff0c\u8bc1\u660e\u5373\u4f7f\u524d\u4e24\u5757\u662f\u5f3a\u51f8\u4e8c\u6b21\u51fd\u6570\u4e5f\u53ef\u80fd\u51fa\u73b0\u6709\u754c\u4f46\u4e0d\u6536\u655b\u7684\u5468\u671f\u8f68\u9053\u3002\u8bba\u6587\u8fd8\u5206\u6790\u4e86\u4e58\u5b50\u677e\u5f1b\u4f55\u65f6\u80fd\u6062\u590d\u6536\u655b\uff0c\u5e76\u6bd4\u8f83\u4e86\u4e0d\u540c AI \u7814\u7a76\u5de5\u4f5c\u6d41\u751f\u6210\u4e0d\u540c\u6570\u5b66\u8bc1\u4e66\u7684\u73b0\u8c61\u3002", "categories": ["math.OC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14396", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f18\u5316\u7b97\u6cd5", "ADMM", "AI\u8f85\u52a9\u7814\u7a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14396v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AI-Assisted Discovery and Construction of a Counterexample to the Convergence of Three-Block ADMM with the Identity Matrix as its Third Constraint Block", "tldr": "\u672c\u6587\u9488\u5bf9\u4e09\u5757 ADMM \u5728\u7b2c\u4e09\u4e2a\u7ea6\u675f\u5757\u4e3a\u5355\u4f4d\u77e9\u9635\u65f6\u662f\u5426\u6536\u655b\u7684\u5f00\u653e\u95ee\u9898\uff0c\u501f\u52a9 Codex/GPT-5.6 Sol \u6784\u9020\u5e76\u4e25\u683c\u9a8c\u8bc1\u4e86\u4e00\u4e2a\u6709\u7406\u6570\u53cd\u4f8b\uff0c\u8bc1\u660e\u5373\u4f7f\u524d\u4e24\u5757\u662f\u5f3a\u51f8\u4e8c\u6b21\u51fd\u6570\u4e5f\u53ef\u80fd\u51fa\u73b0\u6709\u754c\u4f46\u4e0d\u6536\u655b\u7684\u5468\u671f\u8f68\u9053\u3002\u8bba\u6587\u8fd8\u5206\u6790\u4e86\u4e58\u5b50\u677e\u5f1b\u4f55\u65f6\u80fd\u6062\u590d\u6536\u655b\uff0c\u5e76\u6bd4\u8f83\u4e86\u4e0d\u540c AI \u7814\u7a76\u5de5\u4f5c\u6d41\u751f\u6210\u4e0d\u540c\u6570\u5b66\u8bc1\u4e66\u7684\u73b0\u8c61\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent video generators can fabricate realistic depictions of wars, disasters, public emergencies, and other real-world crises, creating substantial risks of misinformation. Existing benchmarks, however, provide limited evidence on detector and generator behavior in such settings, including how detectability varies with generation conditions, how people perceive generated videos, and whether detectors remain reliable during social dissemination. To address this gap, we introduce RA-Bench, a benchmark for AI-generated video detection that uses Real videos as Anchors. RA-Bench contains 17,886 videos, comprising 1,830 real-video anchors across 10 social-risk categories and 16,056 generated clips from four open-source and five closed-source generators. Based on RA-Bench, we organize our evaluation along three dimensions. We first assess detector generalization across seven traditional detectors, ten zero-shot multimodal models under three review settings, and two MLLMs specifically fine-tuned on AI-generated video detection. Across these methods, none of the three detector families generalizes consistently across RA-Bench instances. We then examine how detectability varies with generation quality, conditioning information, and sampling seeds. These analyses show that generation properties affect detector families differently, while source-level detection patterns remain stable across seeds. Finally, we study human authenticity judgments and detector reliability during social dissemination. We find that videos that mislead people are also difficult for current detectors, and that social dissemination makes detection harder. Together, these findings show that current methods struggle to detect realistic AI-generated videos, highlighting the need for detectors robust to evolving video generators.", "arxiv_id": "2608.14391", "arxiv_url": "https://arxiv.org/abs/2608.14391", "authors": ["Shuo Liang", "Yixing Ma", "Pengfei Zhou", "Xingyan Chen", "Zihan Mei", "Manting Li", "Feihan Chen", "Zhiwen Wang", "Bin Xu", "Haotian Zhang", "Jiajun Song", "Shiya Su", "Run Liu", "Zhenghang Ni", "Yifa Yu", "Jintao Hong", "Bolong Feng", "Yifei Liu", "Zirui Zhang", "Jingxuan Zhang", "Songlin Zhao", "Yifan Bai", "Kang Tan", "Yizhe Liu", "Junhao Du", "Yongtao Ge", "Zhaopan Xv", "Xinyuan Zhang", "Mengru Ma", "Chunhua Shen", "Wei Wang", "Yang You", "Zheng Zhu", "Kaipeng Zhang", "Wangbo Zhao"], "brief": "\u672c\u6587\u63d0\u51fa RA-Bench\uff0c\u7528\u771f\u5b9e\u5371\u673a\u4e8b\u4ef6\u89c6\u9891\u4f5c\u4e3a\u951a\u70b9\uff0c\u7cfb\u7edf\u8bc4\u4f30 AI \u751f\u6210\u5371\u673a\u89c6\u9891\u7684\u68c0\u6d4b\u80fd\u529b\uff0c\u8986\u76d6 1.8 \u4e07\u4f59\u4e2a\u771f\u5b9e\u4e0e\u751f\u6210\u89c6\u9891\u53ca\u591a\u7c7b\u5f00\u95ed\u6e90\u751f\u6210\u5668\u3002\u7ed3\u679c\u663e\u793a\uff0c\u73b0\u6709\u4f20\u7edf\u68c0\u6d4b\u5668\u3001\u96f6\u6837\u672c\u591a\u6a21\u6001\u6a21\u578b\u548c\u4e13\u95e8\u5fae\u8c03\u7684 MLLM \u90fd\u96be\u4ee5\u7a33\u5b9a\u6cdb\u5316\uff1b\u8bef\u5bfc\u4eba\u7c7b\u7684\u89c6\u9891\u4e5f\u66f4\u96be\u88ab\u68c0\u6d4b\uff0c\u793e\u4ea4\u4f20\u64ad\u8fd8\u4f1a\u8fdb\u4e00\u6b65\u964d\u4f4e\u68c0\u6d4b\u53ef\u9760\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14391", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u865a\u5047\u4fe1\u606f\u68c0\u6d4b", "\u591a\u6a21\u6001", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14391v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Can We Defend Against AI-Generated Video Attacks on Real-World Crisis Events? A Systematic Evaluation of Detectors, Generators and Social Dissemination", "tldr": "\u672c\u6587\u63d0\u51fa RA-Bench\uff0c\u7528\u771f\u5b9e\u5371\u673a\u4e8b\u4ef6\u89c6\u9891\u4f5c\u4e3a\u951a\u70b9\uff0c\u7cfb\u7edf\u8bc4\u4f30 AI \u751f\u6210\u5371\u673a\u89c6\u9891\u7684\u68c0\u6d4b\u80fd\u529b\uff0c\u8986\u76d6 1.8 \u4e07\u4f59\u4e2a\u771f\u5b9e\u4e0e\u751f\u6210\u89c6\u9891\u53ca\u591a\u7c7b\u5f00\u95ed\u6e90\u751f\u6210\u5668\u3002\u7ed3\u679c\u663e\u793a\uff0c\u73b0\u6709\u4f20\u7edf\u68c0\u6d4b\u5668\u3001\u96f6\u6837\u672c\u591a\u6a21\u6001\u6a21\u578b\u548c\u4e13\u95e8\u5fae\u8c03\u7684 MLLM \u90fd\u96be\u4ee5\u7a33\u5b9a\u6cdb\u5316\uff1b\u8bef\u5bfc\u4eba\u7c7b\u7684\u89c6\u9891\u4e5f\u66f4\u96be\u88ab\u68c0\u6d4b\uff0c\u793e\u4ea4\u4f20\u64ad\u8fd8\u4f1a\u8fdb\u4e00\u6b65\u964d\u4f4e\u68c0\u6d4b\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing palm presentation attack detection (PAD) datasets are often limited by static imagery, restricted acquisition conditions, or insufficient multimodal video data, hindering systematic evaluation across environments, modalities, and attack types. We present GBU-Palm, a large-scale multimodal video dataset and benchmark containing 21,326 videos from 105 subjects and 210 palms across six acquisition environments, including bona fide, Print, and Replay presentations, with 6,310 synchronized RGB-NIR samples. We construct leakage-controlled protocols that separate palm identity and attack lineage and benchmark four representative video architectures under environment-matched and held-out-environment settings. Results reveal substantial architecture-dependent degradation under environmental shift and show that RGB-NIR fusion does not consistently outperform RGB-only input. We further analyze model behavior through true accept (TA), true reject (TR), false accept (FA), and false reject (FR) decomposition, spectral masking, temporal-order intervention, and frozen-backbone NIR probing, revealing distinct failure patterns and evidence utilization across architectures. GBU-Palm provides a unified and challenging benchmark for developing and evaluating robust multimodal palm PAD methods under cross-environment conditions.", "arxiv_id": "2608.14389", "arxiv_url": "https://arxiv.org/abs/2608.14389", "authors": ["Yingjie Ma", "Zitong Yu", "Wei Jia", "Ajay Kumar", "Linlin Shen"], "brief": "\u672c\u6587\u63d0\u51fa GBU-Palm\uff0c\u4e00\u4e2a\u5927\u89c4\u6a21\u591a\u6a21\u6001\u624b\u638c\u6d3b\u4f53/\u5448\u73b0\u653b\u51fb\u68c0\u6d4b\u89c6\u9891\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u5305\u542b 105 \u540d\u53d7\u8bd5\u8005\u3001210 \u4e2a\u624b\u638c\u30016 \u79cd\u73af\u5883\u4e0b\u7684 21326 \u6bb5\u89c6\u9891\u53ca\u540c\u6b65 RGB-NIR \u6837\u672c\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u9891\u67b6\u6784\u5728\u8de8\u73af\u5883\u573a\u666f\u4e0b\u6027\u80fd\u663e\u8457\u9000\u5316\uff0cRGB-NIR \u878d\u5408\u4e5f\u4e0d\u603b\u662f\u4f18\u4e8e RGB\uff0c\u63ed\u793a\u4e86\u9c81\u68d2\u624b\u638c PAD \u7684\u5173\u952e\u6311\u6218\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14389", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u9891\u7406\u89e3", "\u751f\u7269\u8bc6\u522b", "\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14389v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GBU-Palm: A Multimodal Video Dataset and Benchmark for Palm Presentation Attack Detection", "tldr": "\u672c\u6587\u63d0\u51fa GBU-Palm\uff0c\u4e00\u4e2a\u5927\u89c4\u6a21\u591a\u6a21\u6001\u624b\u638c\u6d3b\u4f53/\u5448\u73b0\u653b\u51fb\u68c0\u6d4b\u89c6\u9891\u6570\u636e\u96c6\u4e0e\u57fa\u51c6\uff0c\u5305\u542b 105 \u540d\u53d7\u8bd5\u8005\u3001210 \u4e2a\u624b\u638c\u30016 \u79cd\u73af\u5883\u4e0b\u7684 21326 \u6bb5\u89c6\u9891\u53ca\u540c\u6b65 RGB-NIR \u6837\u672c\u3002\u5b9e\u9a8c\u663e\u793a\u73b0\u6709\u89c6\u9891\u67b6\u6784\u5728\u8de8\u73af\u5883\u573a\u666f\u4e0b\u6027\u80fd\u663e\u8457\u9000\u5316\uff0cRGB-NIR \u878d\u5408\u4e5f\u4e0d\u603b\u662f\u4f18\u4e8e RGB\uff0c\u63ed\u793a\u4e86\u9c81\u68d2\u624b\u638c PAD \u7684\u5173\u952e\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mixture-of-Experts (MoE) models have been widely adopted in real-time interactive applications such as coding assistants, real-time audio-video interaction systems. To meet the extremely low response latency requirements of these scenarios, practitioners commonly employ small-batch decoding, under which MoE inference becomes memory-bound and is severely bottlenecked by expert weight loading. However, this bottleneck has received limited attention, and existing solutions such as post-training weight compression or fine-grained expert design during pre-training either degrade model accuracy or introduce additional computation and communication overhead. To tackle this issue, we propose DeaMoE, a decoding-efficient MoE architecture, in which the experts are grouped into several departments, and the experts belonging to the same department share most parameters since they come from the same professional field, and additionally each expert contains a few private parameters to reflect its uniqueness. Moreover, we design customized two-stage routing strategy for DeaMoE to avoid redundant loading, under which DeaMoE greatly improves the efficiency during LLM decoding. Compared with vanilla MoE, DeaMoE reduces per-step loaded weights by up to 50.9% and achieves up to 1.33 end-to-end TPOT speedup for the pre-trained 7B model on A40, and up to 2.00x and 1.97x peak speedup for DeepSeek-V3 on A40 and H100 in microbenchmarks.", "arxiv_id": "2608.14385", "arxiv_url": "https://arxiv.org/abs/2608.14385", "authors": ["Zewen Jin", "Shen Fu", "Zeping Duan", "Shannon Wang", "Weihao Wu", "Chengjie Tang", "Congkun Ai", "Ping Gong", "Zijian Dai", "Youhui Bai", "Cheng Li"], "brief": "DeaMoE \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5c0f\u6279\u91cf\u89e3\u7801\u7684\u9ad8\u6548 MoE \u67b6\u6784\uff0c\u5c06\u4e13\u5bb6\u6309\u201c\u90e8\u95e8\u201d\u5206\u7ec4\u5e76\u5171\u4eab\u5927\u90e8\u5206\u53c2\u6570\uff0c\u540c\u65f6\u4fdd\u7559\u5c11\u91cf\u79c1\u6709\u53c2\u6570\u4ee5\u4fdd\u6301\u5dee\u5f02\u6027\u3002\u914d\u5408\u4e24\u9636\u6bb5\u8def\u7531\u7b56\u7565\uff0c\u5b83\u51cf\u5c11\u4e86\u91cd\u590d\u4e13\u5bb6\u6743\u91cd\u52a0\u8f7d\uff0c\u5728 7B \u6a21\u578b\u548c DeepSeek-V3 \u5fae\u57fa\u51c6\u4e0a\u663e\u8457\u964d\u4f4e\u52a0\u8f7d\u91cf\u5e76\u5e26\u6765\u6700\u9ad8\u7ea6 2 \u500d\u52a0\u901f\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14385", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u6a21\u578b\u67b6\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14385v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DeaMoE: Efficient MoE Structure for Fast Small-Batch Decoding", "tldr": "DeaMoE \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u5c0f\u6279\u91cf\u89e3\u7801\u7684\u9ad8\u6548 MoE \u67b6\u6784\uff0c\u5c06\u4e13\u5bb6\u6309\u201c\u90e8\u95e8\u201d\u5206\u7ec4\u5e76\u5171\u4eab\u5927\u90e8\u5206\u53c2\u6570\uff0c\u540c\u65f6\u4fdd\u7559\u5c11\u91cf\u79c1\u6709\u53c2\u6570\u4ee5\u4fdd\u6301\u5dee\u5f02\u6027\u3002\u914d\u5408\u4e24\u9636\u6bb5\u8def\u7531\u7b56\u7565\uff0c\u5b83\u51cf\u5c11\u4e86\u91cd\u590d\u4e13\u5bb6\u6743\u91cd\u52a0\u8f7d\uff0c\u5728 7B \u6a21\u578b\u548c DeepSeek-V3 \u5fae\u57fa\u51c6\u4e0a\u663e\u8457\u964d\u4f4e\u52a0\u8f7d\u91cf\u5e76\u5e26\u6765\u6700\u9ad8\u7ea6 2 \u500d\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-agent reasoning systems often use agreement, confidence, or automated scores to decide which messages should shape a final answer. Such filtering assumes that a message likely to be correct is also worth keeping. Yet a wrong answer can contain a useful decomposition, constraint, or scientific principle. We test this distinction with Diverse Hypothesis Deliberation (DHD), a controlled measurement protocol that caches five independently generated messages and replays the same downstream solver, called the integrator, with each message available or hidden. The replay comparison measures a message\u0027s trajectory value: whether making the message available helps or harms subsequent reasoning. Across five mathematics and science benchmarks and two openly available model families, gpt-oss-120b and gemma-4-31B-it, wrong-helpful messages appear in every benchmark-model combination. Among wrong-answer messages that change final correctness, more than four in ten changes are helpful in each model. Controlled repeats show that the number of repeatable message effects is unlikely to arise from replay variation alone (p=0.0002). A focused intervention on repeatable wrong-helpful messages finds that the complete message works best, while retaining its reasoning preserves more success than retaining only its answer; the source of the complete-message advantage remains open. Within the same problem, repeated trajectory-value evidence also identifies a better keep-or-remove choice than answer correctness alone. Answer correctness is therefore informative but does not determine trajectory value. DHD measures this missing property and produces reusable labels for learning when agents should listen.", "arxiv_id": "2608.14375", "arxiv_url": "https://arxiv.org/abs/2608.14375", "authors": ["Chih-Hsuan Yang", "Anjir Ahmed Chowdhury", "Cheng-Hau Yang", "Weijian Zheng", "Fernando Llorente", "Xiaolong Ma", "Xinyang Li", "Eliu A. Huerta", "Ian T. Foster", "Rajeev Thakur"], "brief": "\u672c\u6587\u63d0\u51fa Diverse Hypothesis Deliberation\uff08DHD\uff09\u534f\u8bae\uff0c\u901a\u8fc7\u7f13\u5b58\u5e76\u91cd\u653e\u591a\u667a\u80fd\u4f53\u63a8\u7406\u4e2d\u7684\u6d88\u606f\uff0c\u8861\u91cf\u5355\u6761\u6d88\u606f\u5bf9\u540e\u7eed\u6c42\u89e3\u8f68\u8ff9\u7684\u771f\u5b9e\u4ef7\u503c\uff0c\u800c\u4e0d\u4ec5\u770b\u5176\u7b54\u6848\u662f\u5426\u6b63\u786e\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5728\u591a\u4e2a\u6570\u5b66\u4e0e\u79d1\u5b66\u57fa\u51c6\u548c\u4e24\u7c7b\u5f00\u6e90\u6a21\u578b\u4e2d\uff0c\u9519\u8bef\u7b54\u6848\u7684\u6d88\u606f\u4e5f\u5e38\u80fd\u663e\u8457\u5e2e\u52a9\u6700\u7ec8\u63a8\u7406\uff0c\u4e14\u4fdd\u7559\u5b8c\u6574\u63a8\u7406\u5185\u5bb9\u901a\u5e38\u4f18\u4e8e\u53ea\u4fdd\u7559\u7b54\u6848\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14375", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14375v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Wrong but Useful: Trajectory Value Beyond Answer Correctness in Multi-Agent Messages", "tldr": "\u672c\u6587\u63d0\u51fa Diverse Hypothesis Deliberation\uff08DHD\uff09\u534f\u8bae\uff0c\u901a\u8fc7\u7f13\u5b58\u5e76\u91cd\u653e\u591a\u667a\u80fd\u4f53\u63a8\u7406\u4e2d\u7684\u6d88\u606f\uff0c\u8861\u91cf\u5355\u6761\u6d88\u606f\u5bf9\u540e\u7eed\u6c42\u89e3\u8f68\u8ff9\u7684\u771f\u5b9e\u4ef7\u503c\uff0c\u800c\u4e0d\u4ec5\u770b\u5176\u7b54\u6848\u662f\u5426\u6b63\u786e\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5728\u591a\u4e2a\u6570\u5b66\u4e0e\u79d1\u5b66\u57fa\u51c6\u548c\u4e24\u7c7b\u5f00\u6e90\u6a21\u578b\u4e2d\uff0c\u9519\u8bef\u7b54\u6848\u7684\u6d88\u606f\u4e5f\u5e38\u80fd\u663e\u8457\u5e2e\u52a9\u6700\u7ec8\u63a8\u7406\uff0c\u4e14\u4fdd\u7559\u5b8c\u6574\u63a8\u7406\u5185\u5bb9\u901a\u5e38\u4f18\u4e8e\u53ea\u4fdd\u7559\u7b54\u6848\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The modelling and analysis of secure business processes require the incorporation of security annotations into process models. Although BPMN extensions, including SecBPMN2, exist for this purpose, the derivation of accurate and complete security annotations from natural-language specifications remains a manual, expert-intensive, and error-prone task. This paper presents a hybrid framework that takes a BPMN process model and a security requirements document as input and automatically generates security annotations adhering to the SecBPMN2 specification. The approach combines Large Language Model (LLM)--based semantic extraction with schema-constrained mapping, rule-based normalization, and deterministic validation. The framework is evaluated comprehensively on a curated dataset of 27 process models from various domains. The results indicate that it consistently produces structurally valid SecBPMN2 annotations with high schema completeness. Compared to human security analysts, the system achieves substantially higher precision (0.58 vs. 0.29) while maintaining comparable recall (0.52 vs. 0.50) and reduces erroneous or misplaced annotations by nearly 50%. In addition, annotation generation is significantly faster than manual annotation. These findings demonstrate that hybrid LLM- and rule-based automation can reduce modeling effort while improving consistency and reliability, thereby providing a scalable foundation for security-by-design BPM.", "arxiv_id": "2608.14370", "arxiv_url": "https://arxiv.org/abs/2608.14370", "authors": ["Md Kamrul Islam", "Tiphaine Henry", "Mattia Salnitri", "Julius K\u00f6pke", "Sami Souihi"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u6df7\u5408\u5f0f LLM \u6846\u67b6\uff0c\u8f93\u5165 BPMN \u6d41\u7a0b\u6a21\u578b\u548c\u5b89\u5168\u9700\u6c42\u6587\u6863\uff0c\u81ea\u52a8\u751f\u6210\u7b26\u5408 SecBPMN2 \u89c4\u8303\u7684\u5b89\u5168\u6807\u6ce8\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u7ed3\u6784\u6709\u6548\u6027\u548c\u5b8c\u6574\u6027\u8f83\u9ad8\uff0c\u76f8\u6bd4\u4eba\u5de5\u5b89\u5168\u5206\u6790\u5e08\u7cbe\u5ea6\u66f4\u9ad8\u3001\u53ec\u56de\u76f8\u8fd1\uff0c\u5e76\u5c06\u9519\u8bef\u6216\u9519\u4f4d\u6807\u6ce8\u51cf\u5c11\u8fd1 50%\uff0c\u751f\u6210\u901f\u5ea6\u4e5f\u663e\u8457\u66f4\u5feb\u3002", "categories": ["cs.CR", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14370", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5efa\u6a21", "\u4e1a\u52a1\u6d41\u7a0b", "\u81ea\u52a8\u5316\u6807\u6ce8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14370v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Hybrid LLM-Based Framework for Automated Security Annotation Generation in Business Process Models", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u6df7\u5408\u5f0f LLM \u6846\u67b6\uff0c\u8f93\u5165 BPMN \u6d41\u7a0b\u6a21\u578b\u548c\u5b89\u5168\u9700\u6c42\u6587\u6863\uff0c\u81ea\u52a8\u751f\u6210\u7b26\u5408 SecBPMN2 \u89c4\u8303\u7684\u5b89\u5168\u6807\u6ce8\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u7ed3\u6784\u6709\u6548\u6027\u548c\u5b8c\u6574\u6027\u8f83\u9ad8\uff0c\u76f8\u6bd4\u4eba\u5de5\u5b89\u5168\u5206\u6790\u5e08\u7cbe\u5ea6\u66f4\u9ad8\u3001\u53ec\u56de\u76f8\u8fd1\uff0c\u5e76\u5c06\u9519\u8bef\u6216\u9519\u4f4d\u6807\u6ce8\u51cf\u5c11\u8fd1 50%\uff0c\u751f\u6210\u901f\u5ea6\u4e5f\u663e\u8457\u66f4\u5feb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The early detection of delayed cases in business processes is a critical capability for organizations. Predictive process monitoring (PPM) supports this task by using historical event logs to predict the remaining time of ongoing cases, enabling timely interventions to avoid missed deadlines and service level violations. Although remaining time prediction has advanced considerably through sophisticated deep learning architectures, little is known about the intrinsic difficulty of delay detection itself. Since performance is typically assessed using aggregate metrics, prior work provides limited insight into how models perform across the target distribution, especially on the operationally most critical cases with large delays. In this paper, we address this gap by analyzing the difficulty of delay detection. Across 14 event logs, we show that remaining times are typically strongly right-skewed, with only a small fraction of cases exhibiting large delays. Existing models capture the mode of this distribution well but perform poorly on high-delay cases. We further uncover pronounced heteroscedasticity, showing that predictive uncertainty increases with delay magnitude. Based on these findings, we evaluate approaches to mitigate the imbalance problem, but find only limited benefits, suggesting that the key underlying problem may not be imbalance but higher uncertainty associated with delayed cases. We show that this correlation can be exploited to substantially improve the identification of delayed cases. Overall, our work provides new insights into the sources of difficulty in delay detection and identifies uncertainty-aware modeling as a promising direction for future PPM research.", "arxiv_id": "2608.14367", "arxiv_url": "https://arxiv.org/abs/2608.14367", "authors": ["Keyvan Amiri Elyasi", "Lukas Kirchdorfer", "Heiner Stuckenschmidt"], "brief": "\u8bba\u6587\u5206\u6790\u4e86\u4e1a\u52a1\u6d41\u7a0b\u4e2d\u5ef6\u8fdf\u6848\u4f8b\u65e9\u671f\u68c0\u6d4b\u7684\u5185\u5728\u96be\u5ea6\uff0c\u53d1\u73b0\u5269\u4f59\u65f6\u95f4\u5206\u5e03\u666e\u904d\u5448\u957f\u5c3e\uff0c\u73b0\u6709\u9884\u6d4b\u6d41\u7a0b\u76d1\u63a7\u6a21\u578b\u80fd\u8f83\u597d\u62df\u5408\u5e38\u89c1\u60c5\u51b5\uff0c\u4f46\u5728\u5927\u5ef6\u8fdf\u6848\u4f8b\u4e0a\u8868\u73b0\u8f83\u5dee\u3002\u7814\u7a76\u8fdb\u4e00\u6b65\u53d1\u73b0\u5ef6\u8fdf\u8d8a\u5927\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027\u8d8a\u9ad8\uff0c\u5e38\u89c4\u7f13\u89e3\u7c7b\u522b\u4e0d\u5e73\u8861\u7684\u65b9\u6cd5\u6536\u76ca\u6709\u9650\uff0c\u800c\u5229\u7528\u4e0d\u786e\u5b9a\u6027\u4fe1\u606f\u53ef\u663e\u8457\u6539\u5584\u5ef6\u8fdf\u6848\u4f8b\u8bc6\u522b\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.14367", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9884\u6d4b\u6d41\u7a0b\u76d1\u63a7", "\u4e0d\u786e\u5b9a\u6027\u5efa\u6a21", "\u957f\u5c3e\u5206\u5e03", "\u4e1a\u52a1\u6d41\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.14367v1", "published_at": "2026-08-14", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Mind the Long Tail: Understanding the Difficulty of Delay Detection in Business Processes", "tldr": "\u8bba\u6587\u5206\u6790\u4e86\u4e1a\u52a1\u6d41\u7a0b\u4e2d\u5ef6\u8fdf\u6848\u4f8b\u65e9\u671f\u68c0\u6d4b\u7684\u5185\u5728\u96be\u5ea6\uff0c\u53d1\u73b0\u5269\u4f59\u65f6\u95f4\u5206\u5e03\u666e\u904d\u5448\u957f\u5c3e\uff0c\u73b0\u6709\u9884\u6d4b\u6d41\u7a0b\u76d1\u63a7\u6a21\u578b\u80fd\u8f83\u597d\u62df\u5408\u5e38\u89c1\u60c5\u51b5\uff0c\u4f46\u5728\u5927\u5ef6\u8fdf\u6848\u4f8b\u4e0a\u8868\u73b0\u8f83\u5dee\u3002\u7814\u7a76\u8fdb\u4e00\u6b65\u53d1\u73b0\u5ef6\u8fdf\u8d8a\u5927\u9884\u6d4b\u4e0d\u786e\u5b9a\u6027\u8d8a\u9ad8\uff0c\u5e38\u89c4\u7f13\u89e3\u7c7b\u522b\u4e0d\u5e73\u8861\u7684\u65b9\u6cd5\u6536\u76ca\u6709\u9650\uff0c\u800c\u5229\u7528\u4e0d\u786e\u5b9a\u6027\u4fe1\u606f\u53ef\u663e\u8457\u6539\u5584\u5ef6\u8fdf\u6848\u4f8b\u8bc6\u522b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];

function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
