, "tldr": "\u8bba\u6587\u7528\u632a\u5a01\u7248\u9053\u5fb7\u57fa\u7840\u95ee\u5377\uff08MFQ-30\uff09\u6d4b\u8bd56\u4e2a\u5f00\u6e90\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u4e0e1282\u540d\u632a\u5a01\u53d7\u8bbf\u8005\u5bf9\u6bd4\uff0c\u53d1\u73b0\u53ea\u6709\u4e00\u534a\u6a21\u578b\u771f\u6b63\u6839\u636e\u9898\u76ee\u4f5c\u7b54\uff0c\u53e6\u4e00\u534a\u5448\u73b0\u8fd1\u4f3c\u201c\u5c45\u4e2d\u201d\u7684\u4f2a\u4eba\u7c7b\u7ed3\u679c\u3002\u63d0\u793a\u8bcd\u5c42\u9762\u7684\u5317\u6b27\u53d7\u8bbf\u8005\u4eba\u683c\u8bbe\u5b9a\u53ef\u4f7f\u6709\u6548\u4f5c\u7b54\u6a21\u578b\u663e\u8457\u63a5\u8fd1\u632a\u5a01\u4eba\u5747\u503c\uff0c\u800c\u6fc0\u6d3b\u5c42ActAdd\u4e3b\u8981\u8ba9\u9053\u5fb7\u753b\u50cf\u53d8\u5e73\uff0c\u96be\u4ee5\u7cbe\u786e\u63a7\u5236\u5177\u4f53\u7ef4\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly deployed for enterprise information extraction (IE), where the same document must be reorganized differently for each user. Existing prompt optimization methods, however, rely on a single prompt optimized against a global objective, which is misaligned with the inherent user heterogeneity of real workplaces. We formulate enterprise IE as per-user prompt adaptation under interaction feedback and propose Self-Meta-Evolve, a hierarchical framework that maintains a dedicated prompt for each user and continuously refines it through a dual-loop process: an inner loop that edits structured prompts based on persona-conditioned feedback, and an outer loop that evolves the meta-prompt itself by distilling successful editing patterns. To enable scalable training and evaluation, we release a persona-driven IE benchmark of 292 simulated enterprise users, paired with a reproducible persona-generation pipeline grounded in O*NET occupational taxonomies. On this benchmark, Self-Meta-Evolve achieves a 74.58% success rate, outperforming the strongest prompt-optimization baseline by 13.56 absolute points, and reaches 52.54\\% within only two iterations. A double-blind human study with twenty real professionals further confirms that prompts adapted by our framework win against static baselines in 71% of pairwise comparisons.", "arxiv_id": "2609.21626", "arxiv_url": "https://arxiv.org/abs/2609.21626", "authors": ["Hongliang Li", "Lu Wang", "Yong Xu", "Hanyang Chen", "Zhitao Hou", "Xiaoting Qin", "Song Ge", "Qingwei Lin", "Dongmei Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Self-Meta-Evolve\uff0c\u7528\u4e8e\u4f01\u4e1a\u4fe1\u606f\u62bd\u53d6\u4e2d\u7684\u4e2a\u6027\u5316\u63d0\u793a\u8bcd\u81ea\u9002\u5e94\uff1a\u4e3a\u6bcf\u4e2a\u7528\u6237\u7ef4\u62a4\u4e13\u5c5e\u63d0\u793a\u8bcd\uff0c\u5e76\u901a\u8fc7\u5185\u5faa\u73af\u6309\u7528\u6237\u53cd\u9988\u4fee\u6539\u3001\u5916\u5faa\u73af\u603b\u7ed3\u6210\u529f\u7f16\u8f91\u6a21\u5f0f\u6765\u8fdb\u5316\u5143\u63d0\u793a\u8bcd\u3002\u5176\u5728\u5305\u542b292\u4e2a\u6a21\u62df\u4f01\u4e1a\u7528\u6237\u7684\u57fa\u51c6\u4e0a\u8fbe\u523074.58%\u6210\u529f\u7387\uff0c\u6bd4\u6700\u5f3a\u57fa\u7ebf\u9ad813.56\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u771f\u5b9e\u4e13\u4e1a\u4eba\u58eb\u53cc\u76f2\u8bc4\u6d4b\u4e2d\u83b7\u5f9771%\u7684\u504f\u597d\u80dc\u7387\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21626", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4fe1\u606f\u62bd\u53d6", "\u63d0\u793a\u8bcd\u4f18\u5316", "\u4e2a\u6027\u5316", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21626v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "One Prompt Does Not Fit All: Self-Meta-Evolve for Personalized Information Extraction", "tldr": "\u8bba\u6587\u63d0\u51fa Self-Meta-Evolve\uff0c\u7528\u4e8e\u4f01\u4e1a\u4fe1\u606f\u62bd\u53d6\u4e2d\u7684\u4e2a\u6027\u5316\u63d0\u793a\u8bcd\u81ea\u9002\u5e94\uff1a\u4e3a\u6bcf\u4e2a\u7528\u6237\u7ef4\u62a4\u4e13\u5c5e\u63d0\u793a\u8bcd\uff0c\u5e76\u901a\u8fc7\u5185\u5faa\u73af\u6309\u7528\u6237\u53cd\u9988\u4fee\u6539\u3001\u5916\u5faa\u73af\u603b\u7ed3\u6210\u529f\u7f16\u8f91\u6a21\u5f0f\u6765\u8fdb\u5316\u5143\u63d0\u793a\u8bcd\u3002\u5176\u5728\u5305\u542b292\u4e2a\u6a21\u62df\u4f01\u4e1a\u7528\u6237\u7684\u57fa\u51c6\u4e0a\u8fbe\u523074.58%\u6210\u529f\u7387\uff0c\u6bd4\u6700\u5f3a\u57fa\u7ebf\u9ad813.56\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u5728\u771f\u5b9e\u4e13\u4e1a\u4eba\u58eb\u53cc\u76f2\u8bc4\u6d4b\u4e2d\u83b7\u5f9771%\u7684\u504f\u597d\u80dc\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) improves reasoning models by learning the token-level discrepancy between a stronger teacher and an on-policy student. However, this discrepancy does not purely reflect the capability gap between the teacher and the student: it also contains deviations arising from the teacher itself, which are consequently mixed into the observed teacher--student discrepancy and indiscriminately learned by standard OPD during training. This issue is further exacerbated by privileged OPD, where privileged information induces larger teacher-side likelihood shifts, thereby encouraging the student to learn more of the teacher\u0027s own deviation. We introduce \\textbf{Calibrated On-Policy Distillation (Cal-OPD)}, which estimates the teacher\u0027s self-deviation region through positive and negative privileged interventions and calibrates the original teacher--student discrepancy by retaining only the component that lies beyond this region. Experiments on mathematical reasoning benchmarks show that, while retaining only about 52--65\\% of the original teacher--student discrepancy as the optimization signal, Cal-OPD consistently outperforms standard OPD and its variants across model scales.", "arxiv_id": "2609.21619", "arxiv_url": "https://arxiv.org/abs/2609.21619", "authors": ["Qiangqiang He", "Jin Li", "MingCai Chen"], "brief": "\u8bba\u6587\u6307\u51fa\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\u7684\u6559\u5e08-\u5b66\u751f\u5dee\u5f02\u6df7\u5165\u4e86\u6559\u5e08\u81ea\u8eab\u504f\u5dee\uff0c\u5c24\u5176\u5728\u5e26\u7279\u6743\u4fe1\u606f\u7684\u84b8\u998f\u4e2d\u66f4\u4e25\u91cd\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u751f\u5b66\u4e60\u5230\u4e0d\u8be5\u5b66\u7684\u504f\u79fb\u3002\u4f5c\u8005\u63d0\u51fa Cal-OPD\uff0c\u901a\u8fc7\u6b63\u8d1f\u7279\u6743\u5e72\u9884\u4f30\u8ba1\u6559\u5e08\u81ea\u504f\u5dee\u533a\u57df\uff0c\u53ea\u4fdd\u7559\u8d85\u51fa\u8be5\u533a\u57df\u7684\u6709\u6548\u80fd\u529b\u5dee\u5f02\u4f5c\u4e3a\u8bad\u7ec3\u4fe1\u53f7\uff1b\u5728\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u5373\u4f7f\u53ea\u4f7f\u7528\u7ea6 52--65% \u7684\u539f\u59cb\u5dee\u5f02\u4fe1\u53f7\uff0c\u4e5f\u7a33\u5b9a\u4f18\u4e8e\u6807\u51c6 OPD \u53ca\u5176\u53d8\u4f53\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21619", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u63a8\u7406\u6a21\u578b", "\u6821\u51c6", "\u6570\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21619v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Calibrating Teacher--Student Discrepancy for On-Policy Distillation", "tldr": "\u8bba\u6587\u6307\u51fa\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\u7684\u6559\u5e08-\u5b66\u751f\u5dee\u5f02\u6df7\u5165\u4e86\u6559\u5e08\u81ea\u8eab\u504f\u5dee\uff0c\u5c24\u5176\u5728\u5e26\u7279\u6743\u4fe1\u606f\u7684\u84b8\u998f\u4e2d\u66f4\u4e25\u91cd\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u751f\u5b66\u4e60\u5230\u4e0d\u8be5\u5b66\u7684\u504f\u79fb\u3002\u4f5c\u8005\u63d0\u51fa Cal-OPD\uff0c\u901a\u8fc7\u6b63\u8d1f\u7279\u6743\u5e72\u9884\u4f30\u8ba1\u6559\u5e08\u81ea\u504f\u5dee\u533a\u57df\uff0c\u53ea\u4fdd\u7559\u8d85\u51fa\u8be5\u533a\u57df\u7684\u6709\u6548\u80fd\u529b\u5dee\u5f02\u4f5c\u4e3a\u8bad\u7ec3\u4fe1\u53f7\uff1b\u5728\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u5373\u4f7f\u53ea\u4f7f\u7528\u7ea6 52--65% \u7684\u539f\u59cb\u5dee\u5f02\u4fe1\u53f7\uff0c\u4e5f\u7a33\u5b9a\u4f18\u4e8e\u6807\u51c6 OPD \u53ca\u5176\u53d8\u4f53\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Model-free reinforcement learning can acquire contact-rich robotic manipulation skills through trial-and-error interaction, but it often requires the policy to learn both task strategy and low-level motion generation. In this setting, the action representation is critical because it determines how policy outputs are converted into robot motion, shaping both exploration and physical execution. Direct Cartesian command interfaces require the policy to generate motion at every decision step, coupling task-level adaptation with continuous low-level control and increasing the learning burden. We propose PA-RL, a reinforcement-learning framework that uses artificial potential fields as the action representation. Instead of commanding motion directly, the policy adapts the parameters of an energy-like potential field, which generates a state-dependent guidance direction executed through a Cartesian impedance controller. We evaluate PA-RL on peg-in-hole insertion, a representative contact-rich task with nonlinear dynamics and discontinuous contact transitions. In simulation, PA-RL is compared with Cartesian velocity, Cartesian pose, and variable-impedance action spaces using the same RL algorithm. PA-RL is the only method to reach a 100% evaluation success rate within the allotted training time, while the best baseline reaches 92.6%. It also reduces joint-torque variation by 55.4% and Cartesian acceleration variation by 70.8% relative to the best baseline, without explicit motion-quality penalties in the reward. The simulation-trained policy further completes 9/9 real-robot insertions without fine-tuning, demonstrating the deployment feasibility of the learned potential-field interface.", "arxiv_id": "2609.21609", "arxiv_url": "https://arxiv.org/abs/2609.21609", "authors": ["Xinyu Liu", "G\u00f6khan Solak", "Arash Ajoudani"], "brief": "\u8bba\u6587\u63d0\u51fa PA-RL\uff0c\u7528\u4eba\u5de5\u52bf\u573a\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u7684\u52a8\u4f5c\u8868\u793a\uff0c\u8ba9\u7b56\u7565\u8f93\u51fa\u52bf\u573a\u53c2\u6570\u800c\u975e\u76f4\u63a5\u7b1b\u5361\u5c14\u8fd0\u52a8\uff0c\u4ece\u800c\u964d\u4f4e\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c\u4e2d\u7684\u4f4e\u5c42\u63a7\u5236\u8d1f\u62c5\u3002\u5728\u63d2\u5b54\u4efb\u52a1\u4e2d\uff0cPA-RL \u5728\u4eff\u771f\u5185\u8fbe\u5230 100% \u6210\u529f\u7387\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u529b\u77e9\u548c\u52a0\u901f\u5ea6\u6ce2\u52a8\uff0c\u4e14\u65e0\u9700\u5fae\u8c03\u5373\u53ef\u5b8c\u6210\u771f\u5b9e\u673a\u5668\u4eba 9/9 \u6b21\u63d2\u5165\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21609", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c", "\u52a8\u4f5c\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21609v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Potential-Field Action Representation for Reinforcement Learning in Contact-Rich Manipulation", "tldr": "\u8bba\u6587\u63d0\u51fa PA-RL\uff0c\u7528\u4eba\u5de5\u52bf\u573a\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u7684\u52a8\u4f5c\u8868\u793a\uff0c\u8ba9\u7b56\u7565\u8f93\u51fa\u52bf\u573a\u53c2\u6570\u800c\u975e\u76f4\u63a5\u7b1b\u5361\u5c14\u8fd0\u52a8\uff0c\u4ece\u800c\u964d\u4f4e\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c\u4e2d\u7684\u4f4e\u5c42\u63a7\u5236\u8d1f\u62c5\u3002\u5728\u63d2\u5b54\u4efb\u52a1\u4e2d\uff0cPA-RL \u5728\u4eff\u771f\u5185\u8fbe\u5230 100% \u6210\u529f\u7387\uff0c\u5e76\u663e\u8457\u964d\u4f4e\u529b\u77e9\u548c\u52a0\u901f\u5ea6\u6ce2\u52a8\uff0c\u4e14\u65e0\u9700\u5fae\u8c03\u5373\u53ef\u5b8c\u6210\u771f\u5b9e\u673a\u5668\u4eba 9/9 \u6b21\u63d2\u5165\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Access to academic support is a key determinant of student success, yet students experience it unequally: some readily seek help from lecturers or tutors, while others hesitate due to anxiety, fear of judgement, uncertainty about expectations, or low confidence in their understanding. This may be especially evident in computing education, where programming tasks are cumulative and cognitively demanding. Although students increasingly turn to general-purpose generative AI tools, these can produce responses that are inaccurate, insufficiently contextualised, or misaligned with module expectations. This study presents and evaluates Beacon, a course-specific Retrieval-Augmented Generation (RAG) system providing private, immediate, module-aligned academic support. Grounding responses in approved teaching materials, Beacon was designed to lower barriers to help-seeking while encouraging independent learning. Using a design-based research approach, Beacon was developed iteratively and evaluated via mixed methods, combining questionnaires and semi-structured interviews with students and staff at a Higher Education institution. Students described Beacon\u0027s responses as closely aligned with module content and more trustworthy than unrestricted generative AI tools, valuing its use of pseudocode and scaffolded explanations over direct solutions. Although participants remained cautious about trusting AI-generated responses without verification, they viewed the system as a valuable first point of support before consulting lecturers or official resources. The findings suggest that carefully designed course-specific AI systems may reduce barriers to academic support by occupying an intermediary space between independent study and formal support. Rather than replacing educators, educational AI may be most valuable when it broadens access to guidance while preserving the pedagogical role of lecturers.", "arxiv_id": "2609.21600", "arxiv_url": "https://arxiv.org/abs/2609.21600", "authors": ["Andy Gray", "Jake Hobbs"], "brief": "\u672c\u6587\u8bbe\u8ba1\u5e76\u8bc4\u4f30\u4e86 Beacon\uff0c\u4e00\u4e2a\u9762\u5411\u7279\u5b9a\u8bfe\u7a0b\u7684 RAG \u5b66\u4e1a\u652f\u6301\u7cfb\u7edf\uff0c\u901a\u8fc7\u68c0\u7d22\u6559\u5e08\u8ba4\u53ef\u7684\u8bfe\u7a0b\u6750\u6599\u6765\u63d0\u4f9b\u79c1\u5bc6\u3001\u5373\u65f6\u4e14\u7b26\u5408\u6a21\u5757\u8981\u6c42\u7684\u7b54\u7591\u3002\u6df7\u5408\u65b9\u6cd5\u8bc4\u4f30\u663e\u793a\uff0c\u5b66\u751f\u8ba4\u4e3a\u5176\u56de\u7b54\u6bd4\u901a\u7528\u751f\u6210\u5f0f AI \u66f4\u8d34\u5408\u8bfe\u7a0b\u3001\u66f4\u53ef\u4fe1\uff0c\u5c24\u5176\u8ba4\u53ef\u4f2a\u4ee3\u7801\u548c\u5206\u6b65\u5f15\u5bfc\uff1b\u5b83\u53ef\u4f5c\u4e3a\u6b63\u5f0f\u6c42\u52a9\u524d\u7684\u4e2d\u95f4\u652f\u6301\u6e20\u9053\uff0c\u4f46\u4ecd\u9700\u4eba\u5de5\u6838\u9a8c\u4e0e\u6559\u5e08\u89d2\u8272\u914d\u5408\u3002", "categories": ["cs.AI", "cs.CY", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21600", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6559\u80b2AI", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5b66\u4e1a\u652f\u6301", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21600v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reducing Barriers to Academic Support: Evaluating a Course-Specific RAG System for Addressing Help-Seeking Disparities in Higher Education", "tldr": "\u672c\u6587\u8bbe\u8ba1\u5e76\u8bc4\u4f30\u4e86 Beacon\uff0c\u4e00\u4e2a\u9762\u5411\u7279\u5b9a\u8bfe\u7a0b\u7684 RAG \u5b66\u4e1a\u652f\u6301\u7cfb\u7edf\uff0c\u901a\u8fc7\u68c0\u7d22\u6559\u5e08\u8ba4\u53ef\u7684\u8bfe\u7a0b\u6750\u6599\u6765\u63d0\u4f9b\u79c1\u5bc6\u3001\u5373\u65f6\u4e14\u7b26\u5408\u6a21\u5757\u8981\u6c42\u7684\u7b54\u7591\u3002\u6df7\u5408\u65b9\u6cd5\u8bc4\u4f30\u663e\u793a\uff0c\u5b66\u751f\u8ba4\u4e3a\u5176\u56de\u7b54\u6bd4\u901a\u7528\u751f\u6210\u5f0f AI \u66f4\u8d34\u5408\u8bfe\u7a0b\u3001\u66f4\u53ef\u4fe1\uff0c\u5c24\u5176\u8ba4\u53ef\u4f2a\u4ee3\u7801\u548c\u5206\u6b65\u5f15\u5bfc\uff1b\u5b83\u53ef\u4f5c\u4e3a\u6b63\u5f0f\u6c42\u52a9\u524d\u7684\u4e2d\u95f4\u652f\u6301\u6e20\u9053\uff0c\u4f46\u4ecd\u9700\u4eba\u5de5\u6838\u9a8c\u4e0e\u6559\u5e08\u89d2\u8272\u914d\u5408\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fraudulent job posting detection aims to identify job advertisements that are corrupted either through fake content, misleading information, or negative intent, disrupting the online eco-system of job-seekers and employers. Existing studies in this domain lack effective methods to simultaneously achieve high accuracy and meaningful structure of latent-space representations that capture subtleties among fake posts. To this end, we propose Centroid-Guided Contrastive Loss (CGCL), a loss function which unifies classification with densely formulated clustering to consistently reshape latent-space through a centroid-driven top-$k$ push-and-pull mechanism. The complementary nature of CGCL enables the model to enforce accurate decision boundaries and maintain high clustering compactness, effectively capturing both class separability and latent structure. Extensive experiments demonstrate the state-of-the-art (SOTA) performance of our method on EMSCAD, a public benchmark dataset. The code associated with this work is available at: https://github.com/ali-ahmed925/CGCL_code", "arxiv_id": "2609.21599", "arxiv_url": "https://arxiv.org/abs/2609.21599", "authors": ["Syed Ali Ahmed", "Malaika Raza", "Muhammad Shoaib Siddiqui", "Muhammad Rafi"], "brief": "\u672c\u6587\u63d0\u51fa Centroid-Guided Contrastive Loss\uff08CGCL\uff09\uff0c\u5c06\u5206\u7c7b\u76ee\u6807\u4e0e\u57fa\u4e8e\u8d28\u5fc3\u7684\u5bf9\u6bd4\u805a\u7c7b\u673a\u5236\u7ed3\u5408\uff0c\u7528\u4e8e\u6b3a\u8bc8\u62db\u8058\u4fe1\u606f\u68c0\u6d4b\u3002\u8be5\u65b9\u6cd5\u5728\u63d0\u5347\u68c0\u6d4b\u51c6\u786e\u7387\u7684\u540c\u65f6\u6539\u5584\u6f5c\u5728\u8868\u793a\u7684\u805a\u7c7b\u7ed3\u6784\uff0c\u5e76\u5728 EMSCAD \u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u8fbe\u5230 SOTA \u8868\u73b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21599", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6b3a\u8bc8\u68c0\u6d4b", "\u5bf9\u6bd4\u5b66\u4e60", "\u6587\u672c\u5206\u7c7b", "\u8868\u793a\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21599v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Accuracy: Centroid-Guided Contrastive Loss for Structured Fraudulent Job Posting Detection", "tldr": "\u672c\u6587\u63d0\u51fa Centroid-Guided Contrastive Loss\uff08CGCL\uff09\uff0c\u5c06\u5206\u7c7b\u76ee\u6807\u4e0e\u57fa\u4e8e\u8d28\u5fc3\u7684\u5bf9\u6bd4\u805a\u7c7b\u673a\u5236\u7ed3\u5408\uff0c\u7528\u4e8e\u6b3a\u8bc8\u62db\u8058\u4fe1\u606f\u68c0\u6d4b\u3002\u8be5\u65b9\u6cd5\u5728\u63d0\u5347\u68c0\u6d4b\u51c6\u786e\u7387\u7684\u540c\u65f6\u6539\u5584\u6f5c\u5728\u8868\u793a\u7684\u805a\u7c7b\u7ed3\u6784\uff0c\u5e76\u5728 EMSCAD \u57fa\u51c6\u6570\u636e\u96c6\u4e0a\u8fbe\u5230 SOTA \u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Retrieval-Augmented Generation (RAG) improves large language models by grounding outputs in external knowledge sources, but this dependency also creates a surface for poisoning attacks. This paper introduces Micro-Collaborative Poisoning, a distributed attack in which a false target claim is divided across multiple locally plausible documents instead of being concentrated in a single malicious passage. We evaluate the attack across 108 RAG configurations by varying dataset, retriever architecture, retrieval depth, database composition, number of poisoned databases, and generator model. The results indicate that Micro-Collaborative Poisoning is not driven by a single dominant poisoned passage, but by the accumulation of weak adversarial signals across retrieved sources. Increasing top-$k$ and poisoning multiple databases make it more likely that these signals will appear together in the retrieved context, while clean database diversity and stronger retrievers can reduce their influence. The document-level poisoning visibility analysis further shows that this threat is difficult to expose through isolated document inspection, since Micro-Collaborative Poisoning achieves downstream influence while leaving a weaker explicit poisoning signature than direct poisoning.", "arxiv_id": "2609.21573", "arxiv_url": "https://arxiv.org/abs/2609.21573", "authors": ["Pedro Pereira", "Eva Maia", "Isabel Pra\u00e7a"], "brief": "\u672c\u6587\u63d0\u51fa\u5fae\u534f\u4f5c\u6295\u6bd2\u653b\u51fb\uff0c\u5c06\u865a\u5047\u76ee\u6807\u58f0\u660e\u62c6\u5206\u5230\u591a\u4e2a\u770b\u4f3c\u5408\u7406\u7684\u6587\u6863\u4e2d\uff0c\u4ee5\u5206\u5e03\u5f0f\u5f31\u4fe1\u53f7\u5f71\u54cd RAG \u8f93\u51fa\u3002\u5b9e\u9a8c\u8986\u76d6 108 \u79cd RAG \u914d\u7f6e\uff0c\u53d1\u73b0\u8be5\u653b\u51fb\u4f9d\u8d56\u591a\u4e2a\u68c0\u7d22\u6765\u6e90\u7684\u7d2f\u79ef\u6548\u5e94\uff0c\u589e\u52a0 top-k \u548c\u6295\u6bd2\u6570\u636e\u5e93\u6570\u91cf\u4f1a\u589e\u5f3a\u653b\u51fb\uff0c\u800c\u5e72\u51c0\u6570\u636e\u591a\u6837\u6027\u548c\u66f4\u5f3a\u68c0\u7d22\u5668\u53ef\u7f13\u89e3\u5f71\u54cd\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21573", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["RAG", "\u6570\u636e\u6295\u6bd2", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21573v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Micro-Collaborative Poisoning: A Distributed Attack on RAG Systems", "tldr": "\u672c\u6587\u63d0\u51fa\u5fae\u534f\u4f5c\u6295\u6bd2\u653b\u51fb\uff0c\u5c06\u865a\u5047\u76ee\u6807\u58f0\u660e\u62c6\u5206\u5230\u591a\u4e2a\u770b\u4f3c\u5408\u7406\u7684\u6587\u6863\u4e2d\uff0c\u4ee5\u5206\u5e03\u5f0f\u5f31\u4fe1\u53f7\u5f71\u54cd RAG \u8f93\u51fa\u3002\u5b9e\u9a8c\u8986\u76d6 108 \u79cd RAG \u914d\u7f6e\uff0c\u53d1\u73b0\u8be5\u653b\u51fb\u4f9d\u8d56\u591a\u4e2a\u68c0\u7d22\u6765\u6e90\u7684\u7d2f\u79ef\u6548\u5e94\uff0c\u589e\u52a0 top-k \u548c\u6295\u6bd2\u6570\u636e\u5e93\u6570\u91cf\u4f1a\u589e\u5f3a\u653b\u51fb\uff0c\u800c\u5e72\u51c0\u6570\u636e\u591a\u6837\u6027\u548c\u66f4\u5f3a\u68c0\u7d22\u5668\u53ef\u7f13\u89e3\u5f71\u54cd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Renewable energy communities (RECs) coordinate buildings, photovoltaic generation, batteries, electric vehicles and flexible loads. Controller studies often simplify changing participation, equipment availability, service deadlines and data quality, so lower cost or peak demand can conceal missed services or infeasible power requests. This paper presents CityLearn v3, a configurable simulation and evaluation framework for REC control studies under these conditions. It represents changing members and assets, flexible-load deadlines, demand-response requests, local energy sharing, and data or equipment failures within one simulation environment. Building and phase power limits constrain controllable requests, while a declared timestep preserves consistent power-to-energy accounting. The framework records controller inputs and distinguishes requested actions from those applied to the simulated equipment. Reference controllers, service- and constraint-aware performance indicators, and trajectory exports support comparisons within and across communities. Software checks and application examples examine service delivery, electrical constraints, settlement and changing scenarios; a synthetic high-frequency trace replay illustrates how aggregation can conceal short peaks without changing annual energy. Together, these records allow aggregate performance to be interpreted alongside service failures, action reductions and participant-level outcomes.", "arxiv_id": "2609.21570", "arxiv_url": "https://arxiv.org/abs/2609.21570", "authors": ["Tiago Fonseca", "Luis Lino Ferreira", "Armando Sousa", "Ava Mohammadi", "Zoltan Nagy"], "brief": "CityLearn v3 \u63d0\u4f9b\u4e86\u4e00\u4e2a\u53ef\u914d\u7f6e\u7684\u53ef\u518d\u751f\u80fd\u6e90\u793e\u533a\u4eff\u771f\u4e0e\u8bc4\u4f30\u6846\u67b6\uff0c\u80fd\u540c\u65f6\u5efa\u6a21\u6210\u5458/\u8bbe\u5907\u53d8\u5316\u3001\u67d4\u6027\u8d1f\u8f7d\u622a\u6b62\u65f6\u95f4\u3001\u9700\u6c42\u54cd\u5e94\u3001\u672c\u5730\u80fd\u6e90\u5171\u4eab\u4ee5\u53ca\u6570\u636e\u6216\u8bbe\u5907\u6545\u969c\u3002\u6846\u67b6\u533a\u5206\u63a7\u5236\u5668\u8bf7\u6c42\u52a8\u4f5c\u4e0e\u5b9e\u9645\u6267\u884c\u52a8\u4f5c\uff0c\u5e76\u52a0\u5165\u670d\u52a1\u8fbe\u6210\u3001\u7ea6\u675f\u8fdd\u53cd\u548c\u53c2\u4e0e\u8005\u7ea7\u7ed3\u679c\u7b49\u6307\u6807\uff0c\u4f7f\u6210\u672c\u6216\u5cf0\u503c\u4f18\u5316\u7ed3\u679c\u80fd\u4e0e\u670d\u52a1\u5931\u8d25\u548c\u4e0d\u53ef\u884c\u52a8\u4f5c\u4e00\u8d77\u89e3\u91ca\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21570", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u80fd\u6e90\u7ba1\u7406", "\u4eff\u771f\u6846\u67b6", "\u591a\u667a\u80fd\u4f53", "\u9700\u6c42\u54cd\u5e94"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21570v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CityLearn v3: A Configurable Simulation and Evaluation Framework for Realistic Control Studies of Renewable Energy Communities", "tldr": "CityLearn v3 \u63d0\u4f9b\u4e86\u4e00\u4e2a\u53ef\u914d\u7f6e\u7684\u53ef\u518d\u751f\u80fd\u6e90\u793e\u533a\u4eff\u771f\u4e0e\u8bc4\u4f30\u6846\u67b6\uff0c\u80fd\u540c\u65f6\u5efa\u6a21\u6210\u5458/\u8bbe\u5907\u53d8\u5316\u3001\u67d4\u6027\u8d1f\u8f7d\u622a\u6b62\u65f6\u95f4\u3001\u9700\u6c42\u54cd\u5e94\u3001\u672c\u5730\u80fd\u6e90\u5171\u4eab\u4ee5\u53ca\u6570\u636e\u6216\u8bbe\u5907\u6545\u969c\u3002\u6846\u67b6\u533a\u5206\u63a7\u5236\u5668\u8bf7\u6c42\u52a8\u4f5c\u4e0e\u5b9e\u9645\u6267\u884c\u52a8\u4f5c\uff0c\u5e76\u52a0\u5165\u670d\u52a1\u8fbe\u6210\u3001\u7ea6\u675f\u8fdd\u53cd\u548c\u53c2\u4e0e\u8005\u7ea7\u7ed3\u679c\u7b49\u6307\u6807\uff0c\u4f7f\u6210\u672c\u6216\u5cf0\u503c\u4f18\u5316\u7ed3\u679c\u80fd\u4e0e\u670d\u52a1\u5931\u8d25\u548c\u4e0d\u53ef\u884c\u52a8\u4f5c\u4e00\u8d77\u89e3\u91ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents can modify and test code across large software projects. Game development is a domain where agents must implement gameplay rules. A game can end in a valid state even after violating its rules during the run. Current game-development benchmarks replay fixed examples, score videos, or ask another model to judge the result. However, no existing benchmark checks game rules throughout execution across varied evaluator-selected scenarios while ensuring exactly reproducible verdicts. We introduce GameLogicBench, a benchmark of 72 gameplay-logic tasks in Godot projects. An automated evaluator checks each game\u0027s rules at every simulation tick. Across 403 hand-designed scenarios, seeded parameter variations produce 1,451 test cases. To ensure that the evaluator measures behavior rather than implementation choice, it must accept different correct implementations for each task while rejecting mutants, implementations with one required capability removed. The tasks span isolated mechanics, multi-system interactions, and repository-scale features. Across 20 combinations of language models and scaffolds, the best observed run solves 52.78% of tasks. Under Claude Code, all twelve models solve fewer tasks as task scope expands from isolated mechanics, through interacting systems, to repository-scale features. Agents inspect code more often and make more tool calls on repository-scale tasks than on isolated-mechanic tasks. Most unsuccessful submissions are runnable, but implement some required game behavior incorrectly. We compared versions of our benchmark evaluator built with and without validation using mutants. Without this validation, incorrect agent submissions passed. A separate analysis finds agents copying code from public repositories when network access is open. Reliable evaluation thus depends both on what the tests reject and on what external code agents can access.", "arxiv_id": "2609.21562", "arxiv_url": "https://arxiv.org/abs/2609.21562", "authors": ["Xinyu Che", "Yunfei Ge", "Shihao Li", "Yanchen Liu", "Hang Yan", "Xinping Lei", "Yanghai Wang", "Zixuan Dong", "Yifan Yao", "Qianqian Xie", "Letian Zhu", "Jiaheng Liu"], "brief": "GameLogicBench \u63d0\u51fa\u4e00\u4e2a\u9762\u5411 Godot \u6e38\u620f\u903b\u8f91\u5f00\u53d1\u7684\u7f16\u7801\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u901a\u8fc7\u9010 tick \u72b6\u6001\u65ad\u8a00\u5728 1451 \u4e2a\u53ef\u590d\u73b0\u5b9e\u4f8b\u4e2d\u68c0\u67e5\u8fd0\u884c\u65f6\u89c4\u5219\u662f\u5426\u59cb\u7ec8\u6ee1\u8db3\u3002\u5b9e\u9a8c\u663e\u793a\u6700\u4f73\u6a21\u578b/\u811a\u624b\u67b6\u7ec4\u5408\u4ec5\u89e3\u51b3 52.78% \u4efb\u52a1\uff0c\u4efb\u52a1\u89c4\u6a21\u8d8a\u5927\u6027\u80fd\u8d8a\u5dee\uff0c\u4e14\u8bb8\u591a\u5931\u8d25\u63d0\u4ea4\u867d\u53ef\u8fd0\u884c\u4f46\u6e38\u620f\u884c\u4e3a\u4e0d\u6b63\u786e\uff1b\u57fa\u51c6\u8fd8\u5f3a\u8c03\u9700\u7528\u7a81\u53d8\u4f53\u9a8c\u8bc1\u8bc4\u6d4b\u5668\u5e76\u9650\u5236\u5916\u90e8\u4ee3\u7801\u8bbf\u95ee\u3002", "categories": ["cs.SE", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21562", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u6e38\u620f\u5f00\u53d1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21562v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GameLogicBench: Evaluating Coding Agents on Runtime Game Logic with Tick-Level State Assertions", "tldr": "GameLogicBench \u63d0\u51fa\u4e00\u4e2a\u9762\u5411 Godot \u6e38\u620f\u903b\u8f91\u5f00\u53d1\u7684\u7f16\u7801\u667a\u80fd\u4f53\u57fa\u51c6\uff0c\u901a\u8fc7\u9010 tick \u72b6\u6001\u65ad\u8a00\u5728 1451 \u4e2a\u53ef\u590d\u73b0\u5b9e\u4f8b\u4e2d\u68c0\u67e5\u8fd0\u884c\u65f6\u89c4\u5219\u662f\u5426\u59cb\u7ec8\u6ee1\u8db3\u3002\u5b9e\u9a8c\u663e\u793a\u6700\u4f73\u6a21\u578b/\u811a\u624b\u67b6\u7ec4\u5408\u4ec5\u89e3\u51b3 52.78% \u4efb\u52a1\uff0c\u4efb\u52a1\u89c4\u6a21\u8d8a\u5927\u6027\u80fd\u8d8a\u5dee\uff0c\u4e14\u8bb8\u591a\u5931\u8d25\u63d0\u4ea4\u867d\u53ef\u8fd0\u884c\u4f46\u6e38\u620f\u884c\u4e3a\u4e0d\u6b63\u786e\uff1b\u57fa\u51c6\u8fd8\u5f3a\u8c03\u9700\u7528\u7a81\u53d8\u4f53\u9a8c\u8bc1\u8bc4\u6d4b\u5668\u5e76\u9650\u5236\u5916\u90e8\u4ee3\u7801\u8bbf\u95ee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy self-distillation provides dense, token-level supervision by conditioning a model on privileged information and distilling the resulting teacher distribution back into the model. However, privileged information can change not only what the teacher knows, but also how it behaves, entangling correctness-relevant learning signals with unintended behavioral shifts. We study this effect in reasoning tasks by contrasting attractive self-distillation, which moves the model toward a privileged teacher, with repulsive self-distillation, which moves it away from a privileged teacher. We find that both objectives can induce strong and opposing behavioral shifts: attraction suppresses exploratory reasoning and promotes shorter, more confident responses, whereas repulsion increases response length, can trigger unintended switches into a model\u0027s latent thinking mode, and ultimately becomes unstable. Motivated by these observations, we study contrastive self-distillation, which combines attraction toward a correct-solution-conditioned teacher with repulsion from an incorrect-solution-conditioned teacher. In contrast to prior work that combines such distillation signals with a GRPO objective, we isolate the self-distillation objective and study its behavior on its own. We find that the shared behavioral shifts of the two teachers largely cancel, leaving a token-level signal that more directly reflects correctness. Across non-thinking, instruct-only, and already-thinking models, this contrastive objective improves reasoning performance while maintaining stable response lengths.", "arxiv_id": "2609.21561", "arxiv_url": "https://arxiv.org/abs/2609.21561", "authors": ["Anton Baumann", "Akmal Ashirmatov", "Leo Schmidt-Traub", "Frederike L\u00fcbeck", "Jonas H\u00fcbotter", "Thomas Kleine Buening", "Andreas Krause"], "brief": "\u8bba\u6587\u7814\u7a76\u5e26\u7279\u6743\u4fe1\u606f\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u4e2d\uff0c\u6559\u5e08\u6a21\u578b\u4e0d\u4ec5\u4f20\u9012\u6b63\u786e\u6027\u4fe1\u53f7\uff0c\u4e5f\u4f1a\u5f15\u5165\u884c\u4e3a\u504f\u79fb\u3002\u4f5c\u8005\u5bf9\u6bd4\u5438\u5f15\u5f0f\u4e0e\u6392\u65a5\u5f0f\u81ea\u84b8\u998f\uff0c\u53d1\u73b0\u524d\u8005\u8ba9\u56de\u7b54\u66f4\u77ed\u66f4\u81ea\u4fe1\u3001\u6291\u5236\u63a2\u7d22\uff0c\u540e\u8005\u589e\u52a0\u957f\u5ea6\u5e76\u53ef\u80fd\u4e0d\u7a33\u5b9a\uff1b\u8fdb\u4e00\u6b65\u63d0\u51fa\u5bf9\u6bd4\u5f0f\u81ea\u84b8\u998f\uff0c\u7528\u6b63\u786e\u6559\u5e08\u5438\u5f15\u3001\u9519\u8bef\u6559\u5e08\u6392\u65a5\uff0c\u62b5\u6d88\u5171\u540c\u7684\u884c\u4e3a\u504f\u79fb\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u66f4\u76f4\u63a5\u63d0\u53d6\u6b63\u786e\u6027\u4fe1\u53f7\uff0c\u5728\u591a\u7c7b\u63a8\u7406\u6a21\u578b\u4e0a\u63d0\u5347\u63a8\u7406\u6027\u80fd\u5e76\u4fdd\u6301\u56de\u7b54\u957f\u5ea6\u7a33\u5b9a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21561", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u84b8\u998f", "\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21561v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "On Repulsive and Attractive Teachers: Separating Correctness from Behavior in Self-Distillation", "tldr": "\u8bba\u6587\u7814\u7a76\u5e26\u7279\u6743\u4fe1\u606f\u7684\u5728\u7ebf\u81ea\u84b8\u998f\u4e2d\uff0c\u6559\u5e08\u6a21\u578b\u4e0d\u4ec5\u4f20\u9012\u6b63\u786e\u6027\u4fe1\u53f7\uff0c\u4e5f\u4f1a\u5f15\u5165\u884c\u4e3a\u504f\u79fb\u3002\u4f5c\u8005\u5bf9\u6bd4\u5438\u5f15\u5f0f\u4e0e\u6392\u65a5\u5f0f\u81ea\u84b8\u998f\uff0c\u53d1\u73b0\u524d\u8005\u8ba9\u56de\u7b54\u66f4\u77ed\u66f4\u81ea\u4fe1\u3001\u6291\u5236\u63a2\u7d22\uff0c\u540e\u8005\u589e\u52a0\u957f\u5ea6\u5e76\u53ef\u80fd\u4e0d\u7a33\u5b9a\uff1b\u8fdb\u4e00\u6b65\u63d0\u51fa\u5bf9\u6bd4\u5f0f\u81ea\u84b8\u998f\uff0c\u7528\u6b63\u786e\u6559\u5e08\u5438\u5f15\u3001\u9519\u8bef\u6559\u5e08\u6392\u65a5\uff0c\u62b5\u6d88\u5171\u540c\u7684\u884c\u4e3a\u504f\u79fb\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u80fd\u66f4\u76f4\u63a5\u63d0\u53d6\u6b63\u786e\u6027\u4fe1\u53f7\uff0c\u5728\u591a\u7c7b\u63a8\u7406\u6a21\u578b\u4e0a\u63d0\u5347\u63a8\u7406\u6027\u80fd\u5e76\u4fdd\u6301\u56de\u7b54\u957f\u5ea6\u7a33\u5b9a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Auto-bidding is central to computational advertising, where strategies must maximize advertisers\u0027 conversion value under economic constraints. It has evolved from rule-based controllers to reinforcement learning and generative methods such as Decision Transformer (DT). Yet these methods increasingly mismatch the prevailing optimized cost-per-X (oCPX) paradigm, which spans heterogeneous scenarios (e.g., registration, purchase), each served by a separate model, leading to fragmented pipelines and underexploring cross-scenario modeling. Inspired by foundation models like LLMs, unifying these oCPX scenarios into one model raises three challenges: multi-objective control, scalable capacity under strict latency, and safe offline policy improvement. We present OneBid, a unified auto-bidding foundation model that learns a reusable backbone from heterogeneous oCPX logs and adapts it to scenario-specific deployments via offline post-training. Building on DT, OneBid extends single Return-to-Go conditioning to two atomic signals, Return-to-Go for conversion value and Cost-to-Go for cost ratio, plus value-aware regularization on next-action prediction. To absorb distributional heterogeneity, we design a sequence-level Mixture-of-Experts architecture, where shared experts encode cross-scenario knowledge and sparsely-routed experts capture scenario-specific patterns at low latency, yielding consistent scaling with model size and data. During post-training, we align the backbone with scenario preferences via Critic-guided Relative Offline Policy optimization (CROP): a learned critic scores candidate actions group-relatively, avoiding the unsafe online exploration of GRPO-style fine-tuning while constraining policy shift to reduce OOD risk. Validated via online A/B tests and fully deployed at Kuaishou, OneBid delivers an overall +2.2% ADVV gain on oCPX Ads, peaking at +13.1% in the ROAS scenario.", "arxiv_id": "2609.21550", "arxiv_url": "https://arxiv.org/abs/2609.21550", "authors": ["Yewen Li", "Peng Jiang", "Yitian Li", "Pengfei Lv", "Xialong Liu", "Peng Jiang", "Qingpeng Cai"], "brief": "\u8bba\u6587\u63d0\u51fa OneBid\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u79cd oCPX \u5e7f\u544a\u573a\u666f\u7684\u7edf\u4e00\u81ea\u52a8\u51fa\u4ef7\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u5171\u4eab\u9aa8\u5e72\u3001\u5e8f\u5217\u7ea7 MoE \u548c\u79bb\u7ebf\u540e\u8bad\u7ec3\u6765\u590d\u7528\u8de8\u573a\u666f\u77e5\u8bc6\u5e76\u9002\u914d\u5177\u4f53\u4e1a\u52a1\u3002\u5728\u7ebf A/B \u6d4b\u8bd5\u548c\u5feb\u624b\u5168\u91cf\u90e8\u7f72\u663e\u793a\uff0c\u6574\u4f53\u5e26\u6765 +2.2% ADVV \u589e\u76ca\uff0cROAS \u573a\u666f\u6700\u9ad8\u63d0\u5347 +13.1%\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21550", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u5e7f\u544a", "\u81ea\u52a8\u51fa\u4ef7", "\u57fa\u7840\u6a21\u578b", "\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21550v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OneBid: A Unified Auto-Bidding Foundation Model for Diverse oCPX Advertising Scenarios", "tldr": "\u8bba\u6587\u63d0\u51fa OneBid\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u79cd oCPX \u5e7f\u544a\u573a\u666f\u7684\u7edf\u4e00\u81ea\u52a8\u51fa\u4ef7\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u5171\u4eab\u9aa8\u5e72\u3001\u5e8f\u5217\u7ea7 MoE \u548c\u79bb\u7ebf\u540e\u8bad\u7ec3\u6765\u590d\u7528\u8de8\u573a\u666f\u77e5\u8bc6\u5e76\u9002\u914d\u5177\u4f53\u4e1a\u52a1\u3002\u5728\u7ebf A/B \u6d4b\u8bd5\u548c\u5feb\u624b\u5168\u91cf\u90e8\u7f72\u663e\u793a\uff0c\u6574\u4f53\u5e26\u6765 +2.2% ADVV \u589e\u76ca\uff0cROAS \u573a\u666f\u6700\u9ad8\u63d0\u5347 +13.1%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sequential recommendation aims to predict the next item a user will interact with based on their historical behavior. Advances in Transformers have significantly improved sequential recommendation but are still limited by cost efficiency. Although State Space Models (SSMs) have recently enabled efficient long-range modeling, most existing methods encode each item with a single static contextual role, overlooking the phenomenon of item polysemy. In fact, the same item often plays different semantic roles depending on user context, and existing methods are limited in capturing dynamic behavior across different temporal granularities. In this work, we propose DSRec, a novel dual-interest cross-SSM model that explicitly disentangles item roles across long-term and short-term semantic context. Sequential items are encoded into long-term interest embeddings that capture stable preferences via historical aggregation, and a short-term interest branch that emphasizes local session intent modulated by inter-click time intervals. These interest embeddings are processed through distinct SSM encoders: a full-sequence Mamba for long-term modeling, and a time-modulated SSM that dynamically adjusts state evolution based on temporal gaps. To enable effective cross-granularity alignment, we adopt a residual cross-fusion mechanism that exchanges contextual information between the two branches while preserving semantic independence. Experiments on public benchmarks demonstrate that DSRec outperforms other state-of-the-art methods.", "arxiv_id": "2609.21548", "arxiv_url": "https://arxiv.org/abs/2609.21548", "authors": ["Shuiying Liao", "P. Y. Mok"], "brief": "\u8bba\u6587\u63d0\u51fa DSRec\uff0c\u4e00\u79cd\u7528\u4e8e\u5e8f\u5217\u5546\u54c1\u63a8\u8350\u7684\u53cc\u5174\u8da3\u8de8 SSM \u6a21\u578b\uff0c\u5c06\u7269\u54c1\u5728\u957f\u671f\u7a33\u5b9a\u504f\u597d\u548c\u77ed\u671f\u4f1a\u8bdd\u610f\u56fe\u4e2d\u7684\u4e0d\u540c\u8bed\u4e49\u89d2\u8272\u89e3\u8026\u5efa\u6a21\u3002\u65b9\u6cd5\u7ed3\u5408\u5168\u5e8f\u5217 Mamba\u3001\u65f6\u95f4\u95f4\u9694\u8c03\u5236\u7684 SSM \u4ee5\u53ca\u6b8b\u5dee\u4ea4\u53c9\u878d\u5408\uff0c\u5728\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u5148\u8fdb\u65b9\u6cd5\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u7684\u957f\u5e8f\u5217\u5efa\u6a21\u6548\u7387\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21548", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5e8f\u5217\u63a8\u8350", "\u72b6\u6001\u7a7a\u95f4\u6a21\u578b", "Mamba", "\u5174\u8da3\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21548v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Dual-Interest Sequential Product Recommendation With Multi-Granular SSM", "tldr": "\u8bba\u6587\u63d0\u51fa DSRec\uff0c\u4e00\u79cd\u7528\u4e8e\u5e8f\u5217\u5546\u54c1\u63a8\u8350\u7684\u53cc\u5174\u8da3\u8de8 SSM \u6a21\u578b\uff0c\u5c06\u7269\u54c1\u5728\u957f\u671f\u7a33\u5b9a\u504f\u597d\u548c\u77ed\u671f\u4f1a\u8bdd\u610f\u56fe\u4e2d\u7684\u4e0d\u540c\u8bed\u4e49\u89d2\u8272\u89e3\u8026\u5efa\u6a21\u3002\u65b9\u6cd5\u7ed3\u5408\u5168\u5e8f\u5217 Mamba\u3001\u65f6\u95f4\u95f4\u9694\u8c03\u5236\u7684 SSM \u4ee5\u53ca\u6b8b\u5dee\u4ea4\u53c9\u878d\u5408\uff0c\u5728\u516c\u5f00\u57fa\u51c6\u4e0a\u4f18\u4e8e\u73b0\u6709\u5148\u8fdb\u65b9\u6cd5\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u7684\u957f\u5e8f\u5217\u5efa\u6a21\u6548\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While Video Large Language Models (Video-LLMs) have recently demonstrated strong performance, reliably evaluating their fine-grained video understanding remains challenging. Existing benchmarks often rely on question answering or ground-truth caption matching, where models may succeed through superficial cues and incomplete annotations. To this end, we introduce VidOmni-Bench, a benchmark that requires models to verify whether each event in dense video captions is supported by the video. VidOmni-Bench consists of 500 videos spanning five complexity types and diverse durations from 4 seconds to 90 minutes. After collecting videos along these axes, we use diverse Video-LLMs to generate dense captions and obtain human-verified sentence-level labels, where sentences containing incorrect events serve as hard negatives for evaluation. Our experiments on VidOmni-Bench reveal three key findings: (i) Video-LLMs frequently generate hallucinated descriptions in dense video captioning; (ii) they also struggle as verifiers, failing to reliably detect plausible but incorrect event descriptions; and (iii) model weaknesses vary across video complexity and duration, revealing diverse, model-specific bottlenecks in current Video-LLMs.", "arxiv_id": "2609.21521", "arxiv_url": "https://arxiv.org/abs/2609.21521", "authors": ["Changbeen Kim", "Junwon Chang", "Kipyo Kim", "Risa Shinoda", "Kuniaki Saito", "Donghyun Kim"], "brief": "\u8bba\u6587\u63d0\u51fa VidOmni-Bench\uff0c\u7528\u201c\u9010\u53e5\u9a8c\u8bc1\u5bc6\u96c6\u89c6\u9891\u63cf\u8ff0\u4e2d\u7684\u4e8b\u4ef6\u662f\u5426\u88ab\u89c6\u9891\u652f\u6301\u201d\u7684\u65b9\u5f0f\u8bc4\u4f30\u89c6\u9891\u5927\u6a21\u578b\u7684\u7ec6\u7c92\u5ea6\u65f6\u7a7a\u7406\u89e3\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b 500 \u4e2a\u4ece 4 \u79d2\u5230 90 \u5206\u949f\u4e0d\u7b49\u3001\u8986\u76d6\u591a\u79cd\u590d\u6742\u5ea6\u7684\u89c6\u9891\uff0c\u5e76\u53d1\u73b0\u73b0\u6709 Video-LLM \u5728\u5bc6\u96c6\u63cf\u8ff0\u4e2d\u6613\u4ea7\u751f\u5e7b\u89c9\uff0c\u4e5f\u96be\u4ee5\u53ef\u9760\u8bc6\u522b\u770b\u4f3c\u5408\u7406\u4f46\u9519\u8bef\u7684\u4e8b\u4ef6\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21521", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u5927\u6a21\u578b\u8bc4\u6d4b", "\u5e7b\u89c9\u68c0\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21521v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VidOmni-Bench: A Benchmark for Fine-Grained Video Understanding via Spatio-Temporal Event Verification across Complexity and Duration", "tldr": "\u8bba\u6587\u63d0\u51fa VidOmni-Bench\uff0c\u7528\u201c\u9010\u53e5\u9a8c\u8bc1\u5bc6\u96c6\u89c6\u9891\u63cf\u8ff0\u4e2d\u7684\u4e8b\u4ef6\u662f\u5426\u88ab\u89c6\u9891\u652f\u6301\u201d\u7684\u65b9\u5f0f\u8bc4\u4f30\u89c6\u9891\u5927\u6a21\u578b\u7684\u7ec6\u7c92\u5ea6\u65f6\u7a7a\u7406\u89e3\u80fd\u529b\u3002\u8be5\u57fa\u51c6\u5305\u542b 500 \u4e2a\u4ece 4 \u79d2\u5230 90 \u5206\u949f\u4e0d\u7b49\u3001\u8986\u76d6\u591a\u79cd\u590d\u6742\u5ea6\u7684\u89c6\u9891\uff0c\u5e76\u53d1\u73b0\u73b0\u6709 Video-LLM \u5728\u5bc6\u96c6\u63cf\u8ff0\u4e2d\u6613\u4ea7\u751f\u5e7b\u89c9\uff0c\u4e5f\u96be\u4ee5\u53ef\u9760\u8bc6\u522b\u770b\u4f3c\u5408\u7406\u4f46\u9519\u8bef\u7684\u4e8b\u4ef6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial Intelligence (AI) is becoming a fundamental design principle of future AI-native communication networks, enabling autonomous resource management, adaptive control, and zero-touch network operation. While current AI-native architectures increasingly embed intelligence across network functions, they provide little guidance on how optimisation knowledge should be systematically generated, transferred, and exploited by AI models. This paper argues that the Learning-to-Optimize (L2O) represents the missing architectural layer between optimisation and AI-native intelligence. Rather than viewing optimisation merely as an online decision engine, the proposed paradigm redefines optimisation algorithms as offline knowledge generators that produce high-quality supervisory information for neural surrogate models. The resulting models inherit optimisation expertise while enabling low-latency runtime inference suitable for dynamic network environments. A generic four-stage L2O workflow is introduced, comprising optimisation, knowledge generation, surrogate learning, and runtime inference. Unlike existing Learning-to-Optimize approaches, which primarily focus on algorithm acceleration, the proposed framework establishes L2O as an architectural abstraction applicable across heterogeneous communication and computing systems. The proposed paradigm is illustrated by an NR-V2X relay-selection problem, in which optimisation-generated solutions from a Mixed-Integer Linear Programming (MILP) solver are used to train a Graph Neural Network that can reproduce near-optimal decisions in real time. The presented perspective positions Learning-to-Optimize as a key architectural enabler for future AI-native networks.", "arxiv_id": "2609.21519", "arxiv_url": "https://arxiv.org/abs/2609.21519", "authors": ["Giambattista Amati", "Federica Mangiatordi", "Pierpaolo Salvo", "Emiliano Pallotti", "Simone Angelini"], "brief": "\u672c\u6587\u63d0\u51fa\u5c06\u5b66\u4e60\u4f18\u5316\uff08L2O\uff09\u4f5c\u4e3a AI \u539f\u751f\u7f51\u7edc\u4e2d\u8fde\u63a5\u4f20\u7edf\u4f18\u5316\u4e0e\u667a\u80fd\u6a21\u578b\u7684\u7f3a\u5931\u67b6\u6784\u5c42\uff1a\u79bb\u7ebf\u4f18\u5316\u7b97\u6cd5\u751f\u6210\u9ad8\u8d28\u91cf\u76d1\u7763\u77e5\u8bc6\uff0c\u518d\u8bad\u7ec3\u795e\u7ecf\u4ee3\u7406\u6a21\u578b\u7528\u4e8e\u4f4e\u65f6\u5ef6\u5728\u7ebf\u63a8\u7406\u3002\u4f5c\u8005\u7ed9\u51fa\u56db\u9636\u6bb5\u901a\u7528\u6d41\u7a0b\uff0c\u5e76\u4ee5 NR-V2X \u4e2d\u7ee7\u9009\u62e9\u4e3a\u4f8b\uff0c\u7528 MILP \u89e3\u8bad\u7ec3\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u5b9e\u73b0\u63a5\u8fd1\u6700\u4f18\u7684\u5b9e\u65f6\u51b3\u7b56\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21519", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5b66\u4e60\u4f18\u5316", "AI\u539f\u751f\u7f51\u7edc", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u901a\u4fe1\u7f51\u7edc"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21519v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning-to-Optimize as the Missing Architectural Layer of AI-Native Networks", "tldr": "\u672c\u6587\u63d0\u51fa\u5c06\u5b66\u4e60\u4f18\u5316\uff08L2O\uff09\u4f5c\u4e3a AI \u539f\u751f\u7f51\u7edc\u4e2d\u8fde\u63a5\u4f20\u7edf\u4f18\u5316\u4e0e\u667a\u80fd\u6a21\u578b\u7684\u7f3a\u5931\u67b6\u6784\u5c42\uff1a\u79bb\u7ebf\u4f18\u5316\u7b97\u6cd5\u751f\u6210\u9ad8\u8d28\u91cf\u76d1\u7763\u77e5\u8bc6\uff0c\u518d\u8bad\u7ec3\u795e\u7ecf\u4ee3\u7406\u6a21\u578b\u7528\u4e8e\u4f4e\u65f6\u5ef6\u5728\u7ebf\u63a8\u7406\u3002\u4f5c\u8005\u7ed9\u51fa\u56db\u9636\u6bb5\u901a\u7528\u6d41\u7a0b\uff0c\u5e76\u4ee5 NR-V2X \u4e2d\u7ee7\u9009\u62e9\u4e3a\u4f8b\uff0c\u7528 MILP \u89e3\u8bad\u7ec3\u56fe\u795e\u7ecf\u7f51\u7edc\uff0c\u5b9e\u73b0\u63a5\u8fd1\u6700\u4f18\u7684\u5b9e\u65f6\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This report describes our 2nd place solution to the HANDS 2026 workshop challenge (Dexterous Grasp Motion track) in conjunction with ECCV 2026. In this challenge, we address grasp motion generation for the 12-DoF LinkerHand O6, aiming to produce physically plausible reach-and-lift trajectories for unseen objects from randomized initial hand poses in simulation. This task is particularly challenging because each grasp requires a per-step policy to make approximately $70$ twelve-dimensional decisions, with errors accumulating over time, while test objects and physical dynamics may differ from those encountered during training. To address these challenges, we propose editing a single successful GraspM3 demonstration instead of generating the motion step by step: a policy observes the object once and outputs a 12-D warp of the demonstration, which is then replayed open-loop. Moreover, we train the warp policy with one-step PPO over all $4{,}824$ training objects in parallel. As a result, our method achieved success rates of $94.61\\%$ on the easy track, the highest of all submissions, and $57.18\\%$ on the hard track of the private test set.", "arxiv_id": "2609.21511", "arxiv_url": "https://arxiv.org/abs/2609.21511", "authors": ["Muneeb A. Khan", "Woojin Kim", "Shinwoo Kim", "Muhammad Munsif", "Binod Bhattarai", "Seungryul Baek"], "brief": "\u8be5\u65b9\u6848\u9762\u5411\u7075\u5de7\u624b\u6293\u53d6\u8fd0\u52a8\u751f\u6210\uff0c\u4e0d\u518d\u9010\u6b65\u751f\u6210\u52a8\u4f5c\uff0c\u800c\u662f\u8ba9\u7b56\u7565\u4e00\u6b21\u6027\u6839\u636e\u7269\u4f53\u5bf9\u6210\u529f\u793a\u8303\u8f68\u8ff9\u8fdb\u884c12\u7ef4\u626d\u66f2\u5e76\u5f00\u73af\u56de\u653e\u3002\u65b9\u6cd5\u7528\u5e76\u884c\u8bad\u7ec3\u7269\u4f53\u4e0a\u7684\u4e00\u6b65PPO\u8bad\u7ec3\uff0c\u5728HANDS 2026\u6311\u6218\u4e2d\u83b7\u5f97\u7b2c2\u540d\uff0ceasy\u8d5b\u9053\u6210\u529f\u738794.61%\u3001hard\u8d5b\u905357.18%\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21511", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u6293\u53d6", "\u7075\u5de7\u624b", "\u5f3a\u5316\u5b66\u4e60", "\u8f68\u8ff9\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21511v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "2nd Place Solution to the HANDS 2026 Workshop Challenge-Dexterous Grasp Motion Track: Single-Shot Trajectory Warping for Grasp Motion Generation", "tldr": "\u8be5\u65b9\u6848\u9762\u5411\u7075\u5de7\u624b\u6293\u53d6\u8fd0\u52a8\u751f\u6210\uff0c\u4e0d\u518d\u9010\u6b65\u751f\u6210\u52a8\u4f5c\uff0c\u800c\u662f\u8ba9\u7b56\u7565\u4e00\u6b21\u6027\u6839\u636e\u7269\u4f53\u5bf9\u6210\u529f\u793a\u8303\u8f68\u8ff9\u8fdb\u884c12\u7ef4\u626d\u66f2\u5e76\u5f00\u73af\u56de\u653e\u3002\u65b9\u6cd5\u7528\u5e76\u884c\u8bad\u7ec3\u7269\u4f53\u4e0a\u7684\u4e00\u6b65PPO\u8bad\u7ec3\uff0c\u5728HANDS 2026\u6311\u6218\u4e2d\u83b7\u5f97\u7b2c2\u540d\uff0ceasy\u8d5b\u9053\u6210\u529f\u738794.61%\u3001hard\u8d5b\u905357.18%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When language models reason in chain-of-thought or exchange free-text intermediates, they serialize structured information into natural language. How much tree-structured compositional content survives this bottleneck? We propose a round-trip protocol that answers this question empirically for tree-structured expressions. A generator converts a procedurally generated arithmetic expression into a word problem, a separate extractor recovers the expression from the word problem alone, and symbolic equivalence provides an exact oracle. Evaluating all pairwise combinations of sixteen models yields a communication matrix whose marginals separate generation quality from extraction quality. Three main findings emerge. First, the channel is lossy and asymmetric: swapping which model generates and which extracts shifts accuracy by up to 60.4 points, and the best pair reaches 92.9% by combining different models on each end rather than the same model on both. Second, at least 73.6% of round-trip failures originate at generation, and difficulty is driven by tree structure (operator count, depth, right-branching) rather than model family. Third, the channel is trainable: ~3600 fine-tuning examples that share the evaluation\u0027s operators and tree shapes lift every open-weight model above untrained Gemini-3.1-Pro, an upper bound under matched semantics. A disjoint-domain regime with new operators and vocabulary also raises every open-weight model, confirming the gain is not an artifact of matched semantics, though a gap to the frontier remains. Together these results identify tree-structured expression serialization as a primary limiting factor when models communicate hierarchical structure through natural language.", "arxiv_id": "2609.21509", "arxiv_url": "https://arxiv.org/abs/2609.21509", "authors": ["Xavier Suau", "Alex Ferrando de las Morenas", "Luca Zappella", "Samy Bengio"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u201c\u5f80\u8fd4\u201d\u8bc4\u6d4b\u534f\u8bae\uff1a\u8ba9\u4e00\u4e2a\u8bed\u8a00\u6a21\u578b\u628a\u6811\u7ed3\u6784\u7b97\u672f\u8868\u8fbe\u5f0f\u5199\u6210\u6587\u5b57\u9898\uff0c\u518d\u7531\u53e6\u4e00\u4e2a\u6a21\u578b\u4ec5\u4ece\u6587\u5b57\u9898\u4e2d\u8fd8\u539f\u8868\u8fbe\u5f0f\uff0c\u5e76\u7528\u7b26\u53f7\u7b49\u4ef7\u6027\u7cbe\u786e\u5224\u5b9a\u6210\u529f\u3002\u5b9e\u9a8c\u53d1\u73b0\u81ea\u7136\u8bed\u8a00\u4f20\u9012\u6811\u7ed3\u6784\u4fe1\u606f\u5b58\u5728\u660e\u663e\u6709\u635f\u4e0e\u4e0d\u5bf9\u79f0\uff0c\u4e0d\u540c\u751f\u6210/\u62bd\u53d6\u6a21\u578b\u7ec4\u5408\u51c6\u786e\u7387\u5dee\u5f02\u53ef\u8fbe60.4\u4e2a\u767e\u5206\u70b9\uff1b\u591a\u6570\u5931\u8d25\u6e90\u4e8e\u751f\u6210\u7aef\uff0c\u4e14\u96be\u5ea6\u4e3b\u8981\u7531\u6811\u6df1\u3001\u8fd0\u7b97\u7b26\u6570\u91cf\u548c\u5206\u652f\u7ed3\u6784\u51b3\u5b9a\u3002\u5c11\u91cf\u5fae\u8c03\u6837\u672c\u80fd\u663e\u8457\u63d0\u5347\u5f00\u6e90\u6a21\u578b\uff0c\u8bf4\u660e\u8fd9\u79cd\u7ed3\u6784\u5e8f\u5217\u5316\u74f6\u9888\u53ef\u8bad\u7ec3\u4f46\u4ecd\u9650\u5236\u6a21\u578b\u95f4\u81ea\u7136\u8bed\u8a00\u901a\u4fe1\u3002", "cate ities do not establish whether an engineering design will work when executed. Existing benchmarks assess spatial reasoning, structural validity, or physics-grounded construction, but they do not determine whether MLLMs can synthesize complete load-bearing structures and repair them after simulator execution exposes a failure. We introduce PolyBridgeBench, an executable benchmark for multimodal bridge design. A model receives a visual scene and structured engineering constraints and generates a complete node--member--material topology. Deterministic legality checks gate execution in a native dynamic physics simulation. Following an execution failure, the benchmark returns temporal visual evidence from the failed rollout and evaluates repair under a fixed interaction budget. Separate measurements of deterministic validity, dynamic functional success, and post-failure recovery identify the stage at which design fails. Experiments with six representative MLLMs across 189 levels expose a substantial gap between deterministic validity and dynamic success, pronounced sensitivity to material budgets, and limited post-failure recovery under the primary strict-budget setting.", "arxiv_id": "2609.21493", "arxiv_url": "https://arxiv.org/abs/2609.21493", "authors": ["Zicheng Zhao", "Dongyin Chen", "Rui Xu", "Yinghui Xu"], "brief": "\u8bba\u6587\u63d0\u51fa PolyBridgeBench\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u53ef\u6267\u884c\u6865\u6881\u8bbe\u8ba1\u57fa\u51c6\uff0c\u8981\u6c42\u6a21\u578b\u6839\u636e\u89c6\u89c9\u573a\u666f\u548c\u5de5\u7a0b\u7ea6\u675f\u751f\u6210\u5b8c\u6574\u7684\u8282\u70b9\u3001\u6746\u4ef6\u4e0e\u6750\u6599\u62d3\u6251\uff0c\u5e76\u5728\u7269\u7406\u4eff\u771f\u5931\u8d25\u540e\u8fdb\u884c\u4fee\u590d\u3002\u5b9e\u9a8c\u8986\u76d66\u4e2a\u4ee3\u8868\u6027\u6a21\u578b\u548c189\u4e2a\u5173\u5361\uff0c\u53d1\u73b0\u6a21\u578b\u5728\u89c4\u5219\u5408\u6cd5\u6027\u4e0e\u771f\u5b9e\u52a8\u6001\u627f\u91cd\u6210\u529f\u4e4b\u9 let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
