y the accumulated row-wise or column-wise gradient norms. We establish regret guarantees and show that these matrix-aware bounds can be strictly tighter than those of entry-wise AdaGrad under structured gradients. Experiments on matrix factorization and deep neural-network training further demonstrate the benefits of aligning adaptive scaling with matrix structure, including improved optimization stability and trainability at larger learning rates and greater network depths.", "arxiv_id": "2609.21815", "arxiv_url": "https://arxiv.org/abs/2609.21815", "authors": ["Wenpeng Zhang", "Runsheng Yu", "Peilin Zhao"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9488\u5bf9\u77e9\u9635\u503c\u53c2\u6570\u7684\u81ea\u9002\u5e94Online Mirror Descent\u6846\u67b6\uff0c\u7528\u4e8e\u7cfb\u7edf\u63a8\u5bfc\u5229\u7528\u77e9\u9635\u7ed3\u6784\u7684\u4f18\u5316\u5668\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u6784\u5efa\u4e86Row-AdaGrad\u4e0eColumn-AdaGrad\uff0c\u5206\u522b\u6309\u884c\u6216\u6309\u5217\u7d2f\u79ef\u68af\u5ea6\u8303\u6570\u8fdb\u884c\u81ea\u9002\u5e94\u7f29\u653e\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21815", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u884c\u7ea7\u4e0e\u5217\u7ea7\u77e9\u9635\u8fd1\u7aef\u51fd\u6570\uff0c\u5c06AdaGrad\u5f0f\u81ea\u9002\u5e94\u4f18\u5316\u4ece\u9010\u5143\u7d20\u6269\u5c55\u5230\u77e9\u9635\u7ed3\u6784\u611f\u77e5\u573a\u666f", "\u7ed9\u51fa\u5728\u7ebf\u9057\u61be\u754c\u5206\u6790\uff0c\u8bc1\u660e\u5728\u7ed3\u6784\u5316\u68af\u5ea6\u4e0b\u77e9\u9635\u611f\u77e5\u754c\u53ef\u4e25\u683c\u4f18\u4e8e\u9010\u5143\u7d20AdaGrad", "\u5728\u77e9\u9635\u5206\u89e3\u548c\u6df1\u5ea6\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u4e2d\u8868\u73b0\u51fa\u66f4\u597d\u7684\u4f18\u5316\u7a33\u5b9a\u6027\uff0c\u53ef\u652f\u6301\u66f4\u5927\u5b66\u4e60\u7387\u548c\u66f4\u6df1\u7f51\u7edc"], "keywords": ["\u4f18\u5316\u7b97\u6cd5", "\u81ea\u9002\u5e94\u5b66\u4e60\u7387", "\u5728\u7ebf\u5b66\u4e60", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21815v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Matrix AdaGrad: Row-wise and Column-wise Adaptive Subgradient Methods", "tldr": "\u9762\u5411\u77e9\u9635\u53c2\u6570\u7684\u884c\u5217\u81ea\u9002\u5e94AdaGrad", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9488\u5bf9\u77e9\u9635\u503c\u53c2\u6570\u7684\u81ea\u9002\u5e94Online Mirror Descent\u6846\u67b6\uff0c\u7528\u4e8e\u7cfb\u7edf\u63a8\u5bfc\u5229\u7528\u77e9\u9635\u7ed3\u6784\u7684\u4f18\u5316\u5668\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u6784\u5efa\u4e86Row-AdaGrad\u4e0eColumn-AdaGrad\uff0c\u5206\u522b\u6309\u884c\u6216\u6309\u5217\u7d2f\u79ef\u68af\u5ea6\u8303\u6570\u8fdb\u884c\u81ea\u9002\u5e94\u7f29\u653e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u77e9\u9635\u7ed3\u6784\u611f\u77e5\u4f18\u5316\u5668\u63d0\u4f9b\u4e86\u7c7b\u4f3cAdaGrad\u7684\u7edf\u4e00\u7406\u8bba\u57fa\u7840\uff0c\u517c\u5177\u7406\u8bba\u9057\u61be\u4fdd\u8bc1\u548c\u5b9e\u9645\u8bad\u7ec3\u6536\u76ca\uff0c\u5bf9\u63d0\u5347\u5927\u6a21\u578b\u4e2d\u77e9\u9635\u53c2\u6570\u4f18\u5316\u7684\u7a33\u5b9a\u6027\u4e0e\u6548\u7387\u5177\u6709\u6f5c\u5728\u4ef7\u503c\u3002"}, {"abstract": "Multimodal survival models can combine complementary prognostic information from whole-slide images and genomic profiles, but effective fusion remains challenging amid external cohort shift and computational complexity. To address these challenges, we propose MIST, multimodal survival prediction with genomic-guided histology attention. MIST represents genomic features as tokens and allows them to query compact foundation-model-derived histology context tokens before survival prediction. This design enriches molecular information with histology context rather than merging separately encoded modalities only at the final stage. Training combines discrete-time survival prediction with genomic feature masking, WSI dropout, and paired WSI-genomics contrastive alignment. Across four external evaluations in colon, renal, lung, and glioblastoma cohorts, MIST improves external C-index over standard fusion baselines in the primary comparisons. These results support genomic-guided histology attention as a compact and effective strategy for multimodal oncology outcome prediction. Our code is available at https://github.com/samiyavuuz/MIST .", "arxiv_id": "2609.21811", "arxiv_url": "https://arxiv.org/abs/2609.21811", "authors": ["Muhammet Sami Yavuz", "Sabri Mustafa Kahya", "Richard R. Chen", "Jana Lipkova", "Benedikt Wiestler"], "brief": "\u8bba\u6587\u63d0\u51fa MIST\uff0c\u4e00\u79cd\u9762\u5411\u80bf\u7624\u9884\u540e\u9884\u6d4b\u7684\u591a\u6a21\u6001\u751f\u5b58\u6a21\u578b\u3002\u5b83\u5c06\u57fa\u56e0\u7ec4\u7279\u5f81\u8868\u793a\u4e3a token\uff0c\u5e76\u8ba9\u5176\u67e5\u8be2\u7531\u75c5\u7406\u57fa\u7840\u6a21\u578b\u63d0\u53d6\u7684\u7d27\u51d1\u7ec4\u7ec7\u5b66\u4e0a\u4e0b\u6587 token\uff0c\u4ece\u800c\u5b9e\u73b0\u66f4\u6709\u6548\u7684 WSI \u4e0e\u57fa\u56e0\u7ec4\u878d\u5408\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21811", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528\u201c\u57fa\u56e0\u7ec4 token \u67e5\u8be2\u75c5\u7406\u4e0a\u4e0b\u6587 token\u201d\u7684\u6ce8\u610f\u529b\u673a\u5236\uff0c\u800c\u975e\u4ec5\u5728\u672b\u7aef\u62fc\u63a5\u6216\u878d\u5408\u4e24\u79cd\u6a21\u6001\u3002", "\u8bad\u7ec3\u7ed3\u5408\u79bb\u6563\u65f6\u95f4\u751f\u5b58\u9884\u6d4b\u3001\u57fa\u56e0\u7ec4\u7279\u5f81\u906e\u853d\u3001WSI dropout \u548c WSI-\u57fa\u56e0\u7ec4\u5bf9\u6bd4\u5bf9\u9f50\u3002", "\u5728\u7ed3\u80a0\u764c\u3001\u80be\u764c\u3001\u80ba\u764c\u548c\u80f6\u8d28\u6bcd\u7ec6\u80de\u7624\u56db\u4e2a\u5916\u90e8\u961f\u5217\u8bc4\u4f30\u4e2d\uff0c\u5916\u90e8 C-index \u4f18\u4e8e\u6807\u51c6\u878d\u5408\u57fa\u7ebf\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u533b\u5b66\u5f71\u50cf", "\u751f\u5b58\u9884\u6d4b", "\u6ce8\u610f\u529b\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21811v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "MIST: Multimodal Survival Prediction with Genomic-Guided Histology Attention", "tldr": "\u7528\u57fa\u56e0\u7ec4\u5f15\u5bfc\u75c5\u7406\u6ce8\u610f\u529b\u63d0\u5347\u751f\u5b58\u9884\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MIST\uff0c\u4e00\u79cd\u9762\u5411\u80bf\u7624\u9884\u540e\u9884\u6d4b\u7684\u591a\u6a21\u6001\u751f\u5b58\u6a21\u578b\u3002\u5b83\u5c06\u57fa\u56e0\u7ec4\u7279\u5f81\u8868\u793a\u4e3a token\uff0c\u5e76\u8ba9\u5176\u67e5\u8be2\u7531\u75c5\u7406\u57fa\u7840\u6a21\u578b\u63d0\u53d6\u7684\u7d27\u51d1\u7ec4\u7ec7\u5b66\u4e0a\u4e0b\u6587 token\uff0c\u4ece\u800c\u5b9e\u73b0\u66f4\u6709\u6548\u7684 WSI \u4e0e\u57fa\u56e0\u7ec4\u878d\u5408\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u5916\u90e8\u961f\u5217\u8fc1\u79fb\u548c\u8ba1\u7b97\u590d\u6742\u5ea6\u53d7\u9650\u7684\u573a\u666f\u4e0b\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u7d27\u51d1\u4e14\u6709\u6548\u7684\u75c5\u7406-\u57fa\u56e0\u7ec4\u878d\u5408\u7b56\u7565\uff0c\u5bf9\u591a\u6a21\u6001\u80bf\u7624\u9884\u540e\u5efa\u6a21\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We study how far a simple statistical pipeline can go on univariate time series anomaly detection under a strict selection protocol. The method extracts a small pool of statistics over sliding windows, scores each window with a transductive robust (MAD) model, and selects a feature subset per domain on a held-out tuning split. On TSB-AD-U it reaches $0.529$ per-series VUS-PR, above the best neural ($0.45$) and statistical ($0.44$) entries on the public leaderboard and within $0.06$ of the strongest pretrained foundation model, several of which use more supervision than ours. Ablations locate the cause: across three selection strategies and a hindsight oracle the score moves by $0.031$, and across the aggregation grid by $0.096$, while changing the candidate pool moves it by $0.226$. The candidate pool sets the ceiling; the search over it is second-order. We therefore generate a pool per domain by prompting a multimodal LLM with in-context example windows from that domain. The generated pools match the hand-crafted one under matched selection, and the two cover different domains: selecting over their union improves on the generated pool in all twelve generator-seed pairs and lifts the pipeline to $0.588$, matching the performance of the best entry on the leaderboard.", "arxiv_id": "2609.21801", "arxiv_url": "https://arxiv.org/abs/2609.21801", "authors": ["Youssef Attia El Hili", "Malik Tiomoko", "Corinne Ancourt"], "brief": "\u8bba\u6587\u7814\u7a76\u5355\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u5f02\u5e38\u68c0\u6d4b\u4e2d\uff0c\u7b80\u5355\u7edf\u8ba1\u6d41\u6c34\u7ebf\u5728\u4e25\u683c\u9009\u62e9\u534f\u8bae\u4e0b\u7684\u4e0a\u9650\u3002\u4f5c\u8005\u7528\u591a\u6a21\u6001 LLM \u6839\u636e\u9886\u57df\u5185\u793a\u4f8b\u7a97\u53e3\u751f\u6210\u5019\u9009\u7edf\u8ba1\u7279\u5f81\u6c60\uff0c\u5e76\u8bc1\u660e\u7279\u5f81\u6c60\u8d28\u91cf\u6bd4\u641c\u7d22\u7b56\u7565\u66f4\u51b3\u5b9a\u6027\u80fd\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21801", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 TSB-AD-U \u4e0a\uff0c\u6ed1\u7a97\u7edf\u8ba1\u7279\u5f81 + \u4f20\u5bfc\u5f0f\u9c81\u68d2 MAD \u6253\u5206 + \u9886\u57df\u7ea7\u7279\u5f81\u9009\u62e9\u8fbe\u5230 0.529 per-series VUS-PR\uff0c\u8d85\u8fc7\u516c\u5f00\u699c\u5355\u6700\u4f73\u795e\u7ecf\u65b9\u6cd5\u548c\u7edf\u8ba1\u65b9\u6cd5\u3002", "\u6d88\u878d\u663e\u793a\uff0c\u5019\u9009\u7279\u5f81\u6c60\u5e26\u6765 0.226 \u7684\u6027\u80fd\u53d8\u5316\uff0c\u8fdc\u9ad8\u4e8e\u9009\u62e9\u7b56\u7565\u7684 0.031 \u548c\u805a\u5408\u7f51\u683c\u7684 0.096\uff0c\u8bf4\u660e\u7279\u5f81\u6c60\u51b3\u5b9a\u6027\u80fd\u4e0a\u9650\u3002", "LLM \u751f\u6210\u7279\u5f81\u6c60\u4e0e\u624b\u5de5\u7279\u5f81\u6c60\u6027\u80fd\u76f8\u5f53\u4e14\u8986\u76d6\u4e0d\u540c\u9886\u57df\uff1b\u4e8c\u8005\u5408\u5e76\u540e\u5f97\u5206\u5347\u81f3 0.588\uff0c\u5339\u914d\u699c\u5355\u6700\u4f73\u7ed3\u679c\u3002"], "keywords": ["\u65f6\u95f4\u5e8f\u5217", "\u5f02\u5e38\u68c0\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7279\u5f81\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21801v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LLM-Generated Feature Pools for Time Series Anomaly Detection", "tldr": "LLM\u751f\u6210\u7279\u5f81\u6c60\u63d0\u5347\u65f6\u5e8f\u5f02\u5e38\u68c0\u6d4b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5355\u53d8\u91cf\u65f6\u95f4\u5e8f\u5217\u5f02\u5e38\u68c0\u6d4b\u4e2d\uff0c\u7b80\u5355\u7edf\u8ba1\u6d41\u6c34\u7ebf\u5728\u4e25\u683c\u9009\u62e9\u534f\u8bae\u4e0b\u7684\u4e0a\u9650\u3002\u4f5c\u8005\u7528\u591a\u6a21\u6001 LLM \u6839\u636e\u9886\u57df\u5185\u793a\u4f8b\u7a97\u53e3\u751f\u6210\u5019\u9009\u7edf\u8ba1\u7279\u5f81\u6c60\uff0c\u5e76\u8bc1\u660e\u7279\u5f81\u6c60\u8d28\u91cf\u6bd4\u641c\u7d22\u7b56\u7565\u66f4\u51b3\u5b9a\u6027\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\uff0c\u5728\u65f6\u95f4\u5e8f\u5217\u5f02\u5e38\u68c0\u6d4b\u4e2d\uff0cLLM \u53ef\u4f5c\u4e3a\u9886\u57df\u7279\u5f81\u751f\u6210\u5668\uff0c\u663e\u8457\u589e\u5f3a\u7b80\u5355\u7edf\u8ba1\u65b9\u6cd5\uff0c\u6311\u6218\u4e86\u590d\u6742\u795e\u7ecf\u6a21\u578b\u7684\u5fc5\u8981\u6027\uff0c\u5e76\u63d0\u4f9b\u4e86\u4f4e\u76d1\u7763\u3001\u53ef\u89e3\u91ca\u3001\u6613\u90e8\u7f72\u7684\u66ff\u4ee3\u65b9\u6848\u3002"}, {"abstract": "Emergency department (ED) decision-making relies on heterogeneous clinical information, including patient history, vital signs, laboratory results, and electrocardiograms (ECGs). Vision--language models (VLMs) can jointly process these modalities, but strong predictive performance does not necessarily imply meaningful use of the correct patient\u0027s ECG. We term this failure mode ECG Mirage: apparent multimodal capability without useful dependence on patient-specific ECG information. We distinguish two forms: ECG neglect, where ECGs provide little predictive benefit, and ECG confusion, where matched ECGs outperform no-image inputs but not mismatched ECGs. To evaluate these behaviours, we compare predictions obtained with matched ECGs, outcome-discordant mismatched ECGs, and no-image inputs while holding the clinical text and prediction targets fixed. Across four VLMs on MDS-ED, matched ECGs provide no consistent advantage for either ICU admission or clinical deterioration prediction. We then train four restricted visual prompts using supervised learning followed by conditional direct preference optimisation, while keeping the VLM backbone frozen. The resulting models achieve balanced accuracies of 70.6% for ICU admission and 67.5% for deterioration and increase the matched-versus-mismatched performance gap to approximately 16.5 and 5.5 percentage points, respectively. Overall, our study identifies ECG Mirage in multimodal clinical prediction and introduces visual prompt tuning as an efficient mitigation strategy.", "arxiv_id": "2609.21755", "arxiv_url": "https://arxiv.org/abs/2609.21755", "authors": ["Jinning Liang", "Mingcheng Zhu", "Tingting Zhu"], "brief": "\u672c\u6587\u63d0\u51fa\u201cECG Mirage\u201d\u5931\u6548\u6a21\u5f0f\uff0c\u6307\u51fa\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u6025\u8bca\u4e34\u5e8a\u9884\u6d4b\u4e2d\u867d\u8868\u73b0\u51fa\u591a\u6a21\u6001\u80fd\u529b\uff0c\u5374\u53ef\u80fd\u5e76\u672a\u6709\u6548\u4f9d\u8d56\u60a3\u8005\u7279\u5f02\u6027\u5fc3\u7535\u56fe\u3002\u4f5c\u8005\u901a\u8fc7\u5339\u914dECG\u3001\u9519\u914dECG\u548c\u65e0\u56fe\u8f93\u5165\u5bf9\u6bd4\u8bc4\u4f30\uff0c\u5e76\u7528\u89c6\u89c9\u63d0\u793a\u8c03\u4f18\u7f13\u89e3\u8be5\u95ee\u9898\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21755", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5b9a\u4e49\u4e24\u7c7bECG Mirage\uff1aECG neglect\uff08ECG\u51e0\u4e4e\u65e0\u9884\u6d4b\u589e\u76ca\uff09\u4e0eECG confusion\uff08\u5339\u914dECG\u4f18\u4e8e\u65e0\u56fe\u4f46\u4e0d\u4f18\u4e8e\u9519\u914dECG\uff09\u3002", "\u5728MDS-ED\u6570\u636e\u96c6\u4e0a\u8bc4\u4f304\u4e2aVLM\uff0c\u53d1\u73b0\u5339\u914dECG\u5bf9ICU\u6536\u6cbb\u548c\u4e34\u5e8a\u6076\u5316\u9884\u6d4b\u5747\u65e0\u7a33\u5b9a\u4f18\u52bf\u3002", "\u51bb\u7ed3VLM\u4e3b\u5e72\uff0c\u4ec5\u8bad\u7ec3\u53d7\u9650\u89c6\u89c9\u63d0\u793a\uff0c\u5e76\u7ed3\u5408\u76d1\u7763\u5b66\u4e60\u4e0e\u6761\u4ef6DPO\uff0c\u4f7fICU\u6536\u6cbb\u548c\u6076\u5316\u9884\u6d4b\u5e73\u8861\u51c6\u786e\u7387\u5206\u522b\u8fbe70.6%\u548c67.5%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u533b\u7597AI", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21755v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ECG Mirage: Revealing and Mitigating the Underutilisation of ECGs in Vision-Language Models for Clinical Prediction", "tldr": "\u63ed\u793aVLM\u4e34\u5e8a\u9884\u6d4b\u4e2d\u672a\u771f\u6b63\u5229\u7528\u60a3\u8005ECG\u7684\u95ee\u9898", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa\u201cECG Mirage\u201d\u5931\u6548\u6a21\u5f0f\uff0c\u6307\u51fa\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u6025\u8bca\u4e34\u5e8a\u9884\u6d4b\u4e2d\u867d\u8868\u73b0\u51fa\u591a\u6a21\u6001\u80fd\u529b\uff0c\u5374\u53ef\u80fd\u5e76\u672a\u6709\u6548\u4f9d\u8d56\u60a3\u8005\u7279\u5f02\u6027\u5fc3\u7535\u56fe\u3002\u4f5c\u8005\u901a\u8fc7\u5339\u914dECG\u3001\u9519\u914dECG\u548c\u65e0\u56fe\u8f93\u5165\u5bf9\u6bd4\u8bc4\u4f30\uff0c\u5e76\u7528\u89c6\u89c9\u63d0\u793a\u8c03\u4f18\u7f13\u89e3\u8be5\u95ee\u9898\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192\u4e34\u5e8a\u591a\u6a21\u6001\u6a21\u578b\u7684\u9ad8\u6027\u80fd\u53ef\u80fd\u6765\u81ea\u6587\u672c\u6216\u6570\u636e\u504f\u5dee\uff0c\u800c\u975e\u771f\u6b63\u5229\u7528\u5173\u952e\u533b\u5b66\u56fe\u50cf\uff1b\u5176\u5339\u914d/\u9519\u914d\u8bc4\u4f30\u8303\u5f0f\u548c\u8f7b\u91cf\u89c6\u89c9\u63d0\u793a\u8c03\u4f18\u65b9\u6cd5\u5bf9\u63d0\u5347\u533b\u7597AI\u53ef\u4fe1\u5ea6\u4e0e\u53ef\u89e3\u91ca\u6027\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent Joint-Embedding Predictive Architectures (JEPAs) prevent representation collapse by constraining learned representations to follow a prescribed target distribution, such as an isotropic Gaussian or the uniform distribution on a hypersphere. Klindt et al. (2026) showed that, under their Euclidean assumptions, matching a Gaussian target can recover Gaussian latent variables up to a linear transformation, and that the Gaussian is the unique distribution with this guarantee. We extend their analysis to latent variables supported on embedded Riemannian manifolds and derive conditions on the latent geometry and positive-pair dynamics under which alignment and exact distribution matching guarantee linear recovery. In particular, when the latent variables are uniformly distributed on a sphere and the representations are matched to the same spherical distribution, every optimal representation recovers the latent state up to an orthogonal transformation. This shows that Gaussian uniqueness is not a universal property of distribution-matched JEPAs: non-Euclidean latent geometries can admit other linearly recoverable distributions. We further derive an approximate-recovery bound that is strictly tighter for the spherical world than for the Gaussian world. Experiments on Gaussian, spherical, and toroidal latent spaces show that geometrically compatible targets yield better linear recovery when optimization succeeds, whereas mismatched targets distort the latent structure. This advantage persists in high-dimensional Clifford-torus worlds.", "arxiv_id": "2609.21656", "arxiv_url": "https://arxiv.org/abs/2609.21656", "authors": ["L\u00e9o Nicollier", "Enric Meinhardt-Llopis", "Marc Pic", "Pablo Mus\u00e9", "Gabriele Facciolo"], "brief": "\u672c\u6587\u5c06\u5206\u5e03\u5339\u914d\u578b JEPA \u7684\u53ef\u6062\u590d\u6027\u7406\u8bba\u4ece\u6b27\u6c0f\u9ad8\u65af\u6f5c\u53d8\u91cf\u6269\u5c55\u5230\u5d4c\u5165\u9ece\u66fc\u6d41\u5f62\u3002\u8bba\u6587\u8bc1\u660e\u5728\u7403\u9762\u7b49\u975e\u6b27\u51e0\u4f55\u4e0b\uff0c\u5339\u914d\u76f8\u5bb9\u76ee\u6807\u5206\u5e03\u4e5f\u53ef\u5b9e\u73b0\u7ebf\u6027\u6062\u590d\uff0c\u53cd\u9a73\u4e86\u201c\u9ad8\u65af\u552f\u4e00\u6027\u201d\u7684\u666e\u9002\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21656", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u63a8\u5bfc\u4e86\u6f5c\u5728\u6d41\u5f62\u51e0\u4f55\u4e0e\u6b63\u6837\u672c\u52a8\u6001\u6ee1\u8db3\u4f55\u79cd\u6761\u4ef6\u65f6\uff0c\u5bf9\u9f50\u4e0e\u7cbe\u786e\u5206\u5e03\u5339\u914d\u53ef\u4fdd\u8bc1\u7ebf\u6027\u6062\u590d\u3002", "\u8bc1\u660e\u7403\u9762\u5747\u5300\u6f5c\u53d8\u91cf\u82e5\u5339\u914d\u540c\u6837\u7684\u7403\u9762\u5206\u5e03\uff0c\u6700\u4f18\u8868\u793a\u53ef\u5728\u6b63\u4ea4\u53d8\u6362\u610f\u4e49\u4e0b\u6062\u590d\u6f5c\u5728\u72b6\u6001\u3002", "\u7ed9\u51fa\u8fd1\u4f3c\u6062\u590d\u8bef\u5dee\u754c\uff0c\u5e76\u663e\u793a\u7403\u9762\u4e16\u754c\u7684\u754c\u4e25\u683c\u4f18\u4e8e\u9ad8\u65af\u4e16\u754c\uff1b\u5b9e\u9a8c\u8986\u76d6\u9ad8\u65af\u3001\u7403\u9762\u3001\u73af\u9762\u53ca\u9ad8\u7ef4 Clifford-torus \u6f5c\u7a7a\u95f4\u3002"], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u8868\u793a\u5b66\u4e60", "\u51e0\u4f55\u5b66\u4e60", "JEPA"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21656v1", "published_at": "2026-09-18", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Beyond Gaussian Worlds: Latent Geometry Matters for JEPAs", "tldr": "JEPA\u76ee\u6807\u5206\u5e03\u5e94\u5339\u914d\u6f5c\u5728\u51e0\u4f55", "upvotes": 0, "what_it_is": "\u672c\u6587\u5c06\u5206\u5e03\u5339\u914d\u578b JEPA \u7684\u53ef\u6062\u590d\u6027\u7406\u8bba\u4ece\u6b27\u6c0f\u9ad8\u65af\u6f5c\u53d8\u91cf\u6269\u5c55\u5230\u5d4c\u5165\u9ece\u66fc\u6d41\u5f62\u3002\u8bba\u6587\u8bc1\u660e\u5728\u7403\u9762\u7b49\u975e\u6b27\u51e0\u4f55\u4e0b\uff0c\u5339\u914d\u76f8\u5bb9\u76ee\u6807\u5206\u5e03\u4e5f\u53ef\u5b9e\u73b0\u7ebf\u6027\u6062\u590d\uff0c\u53cd\u9a73\u4e86\u201c\u9ad8\u65af\u552f\u4e00\u6027\u201d\u7684\u666e\u9002\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa JEPA \u7684\u76ee\u6807\u5206\u5e03\u9009\u62e9\u4e0d\u5e94\u53ea\u4f9d\u8d56\u9ad8\u65af\u5047\u8bbe\uff0c\u800c\u5e94\u4e0e\u6f5c\u5728\u6570\u636e\u51e0\u4f55\u76f8\u5bb9\uff1b\u8fd9\u4e3a\u81ea\u76d1\u7763\u8868\u793a\u5b66\u4e60\u4e2d\u7684\u9632\u574d\u584c\u7ea6\u675f\u548c\u76ee\u6807\u5206\u5e03\u8bbe\u8ba1\u63d0\u4f9b\u4e86\u66f4\u4e00\u822c\u7684\u7406\u8bba\u4f9d\u636e\u3002"}, {"abstract": "Clustering high-dimensional data is a fundamental task in unsupervised machine learning with applications to a variety of domains. In the centralized data scenario, this task is commonly solved using deep clustering methods that utilize deep neural network architectures to learn clustering-friendly latent space representations. In Federated Learning, where data is distributed between clients and is private, deep clustering methods are less explored. In particular, recently introduced federated deep clustering methods, despite showing very promising performance, still fall short in reliably providing good performance if data across clients are non-identically-independently distributed. In this work, we introduce a generalization of Deep Clustering Networks to the federated scenario, named FedDCN, that simultaneously optimizes a reconstruction loss and a clustering loss. To ensure robustness and latent space alignment in non-identically-independently distributed data scenarios, FedDCN generates synthetic data augmentations, and its learning objective includes a geometric regularization for latent space alignment. Through experimental evaluation, the effectiveness of the approach under IID and non-IID assumptions is demonstrated, and future research directions are identified.", "arxiv_id": "2609.21829", "arxiv_url": "https://arxiv.org/abs/2609.21829", "authors": ["Morris Stallmann", "Charalampos S. Kouzinopoulos", "Marcin Pietrasik", "Anna Wilbik"], "brief": "\u8bba\u6587\u63d0\u51fa FedDCN\uff0c\u5c06 Deep Clustering Networks \u6269\u5c55\u5230\u8054\u90a6\u5b66\u4e60\u573a\u666f\uff0c\u5728\u4fdd\u62a4\u5ba2\u6237\u7aef\u6570\u636e\u9690\u79c1\u7684\u540c\u65f6\u8fdb\u884c\u9ad8\u7ef4\u6570\u636e\u805a\u7c7b\u3002\u65b9\u6cd5\u8054\u5408\u4f18\u5316\u91cd\u6784\u635f\u5931\u4e0e\u805a\u7c7b\u635f\u5931\uff0c\u5e76\u9488\u5bf9\u5f02\u6784\u975eIID\u6570\u636e\u589e\u5f3a\u9c81\u68d2\u6027\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21829", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u540c\u65f6\u5b66\u4e60\u805a\u7c7b\u53cb\u597d\u7684\u6f5c\u5728\u8868\u793a\u4e0e\u81ea\u7f16\u7801\u5668\u91cd\u6784\u80fd\u529b\uff0c\u7f13\u89e3\u9ad8\u7ef4\u6570\u636e\u805a\u7c7b\u56f0\u96be", "\u901a\u8fc7\u751f\u6210\u5408\u6210\u6570\u636e\u589e\u5f3a\u6765\u63d0\u5347\u8de8\u5ba2\u6237\u7aef\u6570\u636e\u5206\u5e03\u4e0d\u4e00\u81f4\u65f6\u7684\u6cdb\u5316\u80fd\u529b", "\u5f15\u5165\u6f5c\u5728\u7a7a\u95f4\u51e0\u4f55\u6b63\u5219\u5316\uff0c\u4fc3\u8fdb\u4e0d\u540c\u5ba2\u6237\u7aef\u8868\u793a\u7a7a\u95f4\u5bf9\u9f50"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u6df1\u5ea6\u805a\u7c7b", "\u65e0\u76d1\u7763\u5b66\u4e60", "\u975eIID\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21829v1", "published_at": "2026-09-18", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Federated Deep Clustering Networks for High-Dimensional and Heterogeneous Data", "tldr": "\u9762\u5411\u975eIID\u6570\u636e\u7684\u8054\u90a6\u6df1\u5ea6\u805a\u7c7b\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FedDCN\uff0c\u5c06 Deep Clustering Networks \u6269\u5c55\u5230\u8054\u90a6\u5b66\u4e60\u573a\u666f\uff0c\u5728\u4fdd\u62a4\u5ba2\u6237\u7aef\u6570\u636e\u9690\u79c1\u7684\u540c\u65f6\u8fdb\u884c\u9ad8\u7ef4\u6570\u636e\u805a\u7c7b\u3002\u65b9\u6cd5\u8054\u5408\u4f18\u5316\u91cd\u6784\u635f\u5931\u4e0e\u805a\u7c7b\u635f\u5931\uff0c\u5e76\u9488\u5bf9\u5f02\u6784\u975eIID\u6570\u636e\u589e\u5f3a\u9c81\u68d2\u6027\u3002", "why_notable": "\u8054\u90a6\u573a\u666f\u4e0b\u6df1\u5ea6\u805a\u7c7b\u7814\u7a76\u4ecd\u8f83\u5c11\uff0c\u5c24\u5176\u5728\u975eIID\u5ba2\u6237\u7aef\u6570\u636e\u4e0a\u6027\u80fd\u4e0d\u7a33\u5b9a\uff1bFedDCN\u9488\u5bf9\u8fd9\u4e00\u6838\u5fc3\u75db\u70b9\u63d0\u51fa\u4e86\u8f83\u901a\u7528\u7684\u89e3\u51b3\u65b9\u6848\uff0c\u5bf9\u9690\u79c1\u4fdd\u62a4\u805a\u7c7b\u548c\u5206\u5e03\u5f0f\u65e0\u76d1\u7763\u5b66\u4e60\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLMs are increasingly used in social simulations for socially interactive agents and robots, offering more flexibility than rule-based systems. However, even though they mimic human behaviour very well, there is a persistent alienness to them. This work investigates whether personality-aware fine-tuning can reduce this gap by improving the consistency and controllability of personality-conditioned dialogue generation compared with instruction prompting alone. We fine-tune two small open-weight LLMs, Qwen2.5-7B-Instruct and Ministral-8B-Instruct, using a corpus that combines personality-labelled social media posts and dialogues to create a personality-based dialogue engine for social simulation. The resulting models are evaluated across multiple social interaction scenarios using three independent LLM judges, which assess personality fidelity and provide evidence-based behavioral interpretations. We additionally quantify inter-rater agreement and lexical characteristics of the generated dialogue. Results indicate that fine-tuned models are not better at role-playing different personalities than their respective baseline models. However, low inter-rater agreement limits the confidence with which these results can be interpreted. Concerning the quality of generated texts, fine-tuned models are mostly comparable to the baselines, with fine-tuning improving the linguistic diversity of the Qwen models. While the results appear generally usable and the baseline models offer the best overall performance, future studies should place greater emphasis on the quality and domain alignment of training data for accurate personality role-playing.", "arxiv_id": "2609.21857", "arxiv_url": "https://arxiv.org/abs/2609.21857", "authors": ["Tim Krabbe", "Xiaodan Shi"], "brief": "\u672c\u6587\u7814\u7a76\u4eba\u683c\u611f\u77e5\u5fae\u8c03\u662f\u5426\u80fd\u8ba9\u5c0f\u578b\u5f00\u6e90 LLM \u5728\u793e\u4ea4\u6a21\u62df\u4e2d\u66f4\u7a33\u5b9a\u3001\u53ef\u63a7\u5730\u626e\u6f14\u4e0d\u540c\u4eba\u683c\u3002\u4f5c\u8005\u5fae\u8c03 Qwen2.5-7B-Instruct \u548c Ministral-8B-Instruct\uff0c\u5e76\u7528\u591a\u4e2a LLM \u88c1\u5224\u8bc4\u4f30\u4eba\u683c\u4e00\u81f4\u6027\u4e0e\u5bf9\u8bdd\u8d28\u91cf\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21857", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": ["\u8bad\u7ec3\u6570\u636e\u7ed3\u5408\u5e26\u4eba\u683c\u6807\u7b7e\u7684\u793e\u4ea4\u5a92\u4f53\u5e16\u5b50\u4e0e\u5bf9\u8bdd\uff0c\u7528\u4e8e\u6784\u5efa\u4eba\u683c\u6761\u4ef6\u5316\u5bf9\u8bdd\u5f15\u64ce\u3002", "\u8bc4\u4f30\u8986\u76d6\u591a\u79cd\u793e\u4ea4\u4e92\u52a8\u573a\u666f\uff0c\u5e76\u4f7f\u7528\u4e09\u4e2a\u72ec\u7acb LLM \u88c1\u5224\u5224\u65ad\u4eba\u683c\u4fdd\u771f\u5ea6\u548c\u884c\u4e3a\u89e3\u91ca\u3002", "\u7ed3\u679c\u663e\u793a\u5fae\u8c03\u6a21\u578b\u5e76\u672a\u4f18\u4e8e\u57fa\u7ebf\u63d0\u793a\u65b9\u6cd5\uff1b\u4f46 Qwen \u5fae\u8c03\u540e\u8bed\u8a00\u591a\u6837\u6027\u6709\u6240\u63d0\u5347\uff0c\u4e14\u8bc4\u5ba1\u4e00\u81f4\u6027\u8f83\u4f4e\u9650\u5236\u4e86\u7ed3\u8bba\u53ef\u4fe1\u5ea6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u793e\u4ea4\u6a21\u62df", "\u4eba\u683c\u5efa\u6a21", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21857v1", "published_at": "2026-09-18", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Do Personality-Tuned LLMs Make Better Social Agents?", "tldr": "\u4eba\u683c\u5fae\u8c03\u672a\u663e\u8457\u63d0\u5347\u793e\u4ea4\u667a\u80fd\u4f53\u8868\u73b0", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u4eba\u683c\u611f\u77e5\u5fae\u8c03\u662f\u5426\u80fd\u8ba9\u5c0f\u578b\u5f00\u6e90 LLM \u5728\u793e\u4ea4\u6a21\u62df\u4e2d\u66f4\u7a33\u5b9a\u3001\u53ef\u63a7\u5730\u626e\u6f14\u4e0d\u540c\u4eba\u683c\u3002\u4f5c\u8005\u5fae\u8c03 Qwen2.5-7B-Instruct \u548c Ministral-8B-Instruct\uff0c\u5e76\u7528\u591a\u4e2a LLM \u88c1\u5224\u8bc4\u4f30\u4eba\u683c\u4e00\u81f4\u6027\u4e0e\u5bf9\u8bdd\u8d28\u91cf\u3002", "why_notable": "\u8bba\u6587\u5bf9\u201c\u7ed9 LLM \u505a\u4eba\u683c\u5fae\u8c03\u662f\u5426\u80fd\u4ea7\u751f\u66f4\u597d\u793e\u4ea4\u667a\u80fd\u4f53\u201d\u8fd9\u4e00\u5e38\u89c1\u5047\u8bbe\u7ed9\u51fa\u8d1f\u9762\u7ed3\u679c\uff0c\u63d0\u9192\u7814\u7a76\u8005\u8bad\u7ec3\u6570\u636e\u8d28\u91cf\u3001\u9886\u57df\u5bf9\u9f50\u548c\u8bc4\u4f30\u53ef\u9760\u6027\u53ef\u80fd\u6bd4\u7b80\u5355\u5fae\u8c03\u66f4\u5173\u952e\u3002"}, {"abstract": "Behavioral failures can make a transformer appear to lack a world model even when it has learned faithful representations of its environment. We demonstrate this in TaxiGPT, a transformer trained on random walks through Manhattan whose failures have been interpreted as evidence of an incoherent internal map. Through mechanistic analysis and causal interventions, we show that the model represents intersections and streets, tracks its position, and uses a goal compass to navigate. We trace its failures to interference between superposed intersection features, which disrupts localization within the internal map. Affordance packing, which groups representations of intersections with the same legal moves, helps limit the consequences of these errors. Finally, we propose mechanistic indicators that we use to compare models and show that world-modeling capacities emerge at different stages of training. Our findings motivate a shift from asking whether a model has a world model to mechanistically studying its world modeling: the interacting capacities through which it represents its environment and uses those representations to guide behavior.", "arxiv_id": "2609.21748", "arxiv_url": "https://arxiv.org/abs/2609.21748", "authors": ["Pierre Beckmann", "Matthieu Queloz", "Andre Freitas"], "brief": "\u8bba\u6587\u91cd\u65b0\u5206\u6790 TaxiGPT\uff0c\u6307\u51fa\u5176\u884c\u4e3a\u5931\u8d25\u5e76\u4e0d\u610f\u5473\u7740\u6ca1\u6709\u4e16\u754c\u6a21\u578b\uff1b\u673a\u5236\u5206\u6790\u548c\u56e0\u679c\u5e72\u9884\u663e\u793a\u6a21\u578b\u80fd\u8868\u793a\u8def\u53e3\u3001\u8857\u9053\u3001\u4f4d\u7f6e\u5e76\u7528\u76ee\u6807\u65b9\u5411\u5bfc\u822a\u3002\u5931\u8d25\u4e3b\u8981\u6765\u81ea\u53e0\u52a0\u7684\u8def\u53e3\u7279\u5f81\u76f8\u4e92\u5e72\u6270\uff0c\u4f5c\u8005\u8fd8\u63d0\u51fa\u673a\u5236\u6307\u6807\u6765\u6bd4\u8f83\u8bad\u7ec3\u4e2d\u4e16\u754c\u5efa\u6a21\u80fd\u529b\u7684\u5f62\u6210\u9636\u6bb5\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21748", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "Transformer", "\u673a\u5236\u89e3\u91ca", "\u5bfc\u822a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21748v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "World Modeling in Transformers", "tldr": "\u8bba\u6587\u91cd\u65b0\u5206\u6790 TaxiGPT\uff0c\u6307\u51fa\u5176\u884c\u4e3a\u5931\u8d25\u5e76\u4e0d\u610f\u5473\u7740\u6ca1\u6709\u4e16\u754c\u6a21\u578b\uff1b\u673a\u5236\u5206\u6790\u548c\u56e0\u679c\u5e72\u9884\u663e\u793a\u6a21\u578b\u80fd\u8868\u793a\u8def\u53e3\u3001\u8857\u9053\u3001\u4f4d\u7f6e\u5e76\u7528\u76ee\u6807\u65b9\u5411\u5bfc\u822a\u3002\u5931\u8d25\u4e3b\u8981\u6765\u81ea\u53e0\u52a0\u7684\u8def\u53e3\u7279\u5f81\u76f8\u4e92\u5e72\u6270\uff0c\u4f5c\u8005\u8fd8\u63d0\u51fa\u673a\u5236\u6307\u6807\u6765\u6bd4\u8f83\u8bad\u7ec3\u4e2d\u4e16\u754c\u5efa\u6a21\u80fd\u529b\u7684\u5f62\u6210\u9636\u6bb5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Entropy minimization is a standard objective for test-time adaptation (TTA), but it can fail in imbalanced binary segmentation. Unlike image classification, dense segmentation aggregates thousands of pixel predictions, allowing the larger predicted class to dominate the update, pull minority predictions toward itself, and produce a degenerate mask as predictions saturate and their entropy gradients vanish. We theoretically establish this collapse in a shared-shift model. This analysis motivates Balanced-Anchor Prompt Adaptation (BAPA), which combines two complementary modules. The Class-Balanced Anchors (CBA) module selects high-confidence anchors separately from each predicted class and gives foreground and background equal total loss weight, preventing the larger region from dominating the update. Dynamic Prompt Adaptation (DPA) refreshes these anchors after each prediction update and optimizes only text-side prompt residuals while keeping the vision-language encoders frozen. This prompt-only update refines the foreground-background decision boundary without altering the pretrained dense visual representation. Across experiments from four domains, BAPA achieves the highest mean Dice among the evaluated methods. Factorized ablations further validate the complementary roles of CBA and DPA, supporting balanced prompt adaptation as an effective alternative to entropy minimization for test-time binary segmentation.", "arxiv_id": "2609.21743", "arxiv_url": "https://arxiv.org/abs/2609.21743", "authors": ["Zhengshan Wang", "Joshua Charles Webster-Ford", "Yifei Tian", "Xinxin Wang", "Long Chen", "Weiping Ding"], "brief": "\u8bba\u6587\u6307\u51fa\u6d4b\u8bd5\u65f6\u71b5\u6700\u5c0f\u5316\u5728\u7c7b\u522b\u4e0d\u5e73\u8861\u7684\u4e8c\u503c\u5206\u5272\u4e2d\u4f1a\u5bfc\u81f4\u9884\u6d4b\u574d\u584c\uff0c\u5e76\u7ed9\u51fa\u7406\u8bba\u5206\u6790\u3002\u63d0\u51fa BAPA\uff0c\u901a\u8fc7\u7c7b\u522b\u5747\u8861\u951a\u70b9\u548c\u52a8\u6001\u6587\u672c\u63d0\u793a\u9002\u914d\uff0c\u5728\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u7f16\u7801\u5668\u7684\u60c5\u51b5\u4e0b\u4f18\u5316\u524d\u666f/\u80cc\u666f\u8fb9\u754c\uff0c\u5728\u56db\u4e2a\u9886\u57df\u5b9e\u9a8c\u4e2d\u53d6\u5f97\u6700\u9ad8\u5e73\u5747 Dice\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21743", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u9002\u5e94", "\u56fe\u50cf\u5206\u5272", "\u63d0\u793a\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21743v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Balanced Prompt Adaptation against Entropy-Induced Collapse for Test-Time Binary Segmentation", "tldr": "\u8bba\u6587\u6307\u51fa\u6d4b\u8bd5\u65f6\u71b5\u6700\u5c0f\u5316\u5728\u7c7b\u522b\u4e0d\u5e73\u8861\u7684\u4e8c\u503c\u5206\u5272\u4e2d\u4f1a\u5bfc\u81f4\u9884\u6d4b\u574d\u584c\uff0c\u5e76\u7ed9\u51fa\u7406\u8bba\u5206\u6790\u3002\u63d0\u51fa BAPA\uff0c\u901a\u8fc7\u7c7b\u522b\u5747\u8861\u951a\u70b9\u548c\u52a8\u6001\u6587\u672c\u63d0\u793a\u9002\u914d\uff0c\u5728\u51bb\u7ed3\u89c6\u89c9\u8bed\u8a00\u7f16\u7801\u5668\u7684\u60c5\u51b5\u4e0b\u4f18\u5316\u524d\u666f/\u80cc\u666f\u8fb9\u754c\uff0c\u5728\u56db\u4e2a\u9886\u57df\u5b9e\u9a8c\u4e2d\u53d6\u5f97\u6700\u9ad8\u5e73\u5747 Dice\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Chinese social media has generated a vast and continually evolving lexicon of internet buzzwords whose meanings are often non-literal and deeply rooted in local cultural and pragmatic contexts. Existing research has primarily focused on interpreting these buzzwords within Chinese, leaving largely unexplored whether LLMs can transfer such culturally grounded knowledge across languages and accurately convey the intended meanings in English. This cross-lingual capability is also critical for safety, as harmful expressions may obscure their offensive content through culture-specific homophony, euphemism, irony, or coded language. In this paper, we investigate the ability of advanced LLMs to understand Chinese internet buzzwords across languages. To this end, we introduce CIBuzzBench, the first benchmark for cross-lingual Chinese-to-English understanding of Chinese internet buzzwords. CIBuzzBench comprises 3,001 Chinese internet buzzwords annotated with English meaning explanations, English equivalents, category labels, and harmfulness labels. Based on these annotations, we design three evaluation tasks: Meaning Explanation, Cross-lingual Equivalent Matching, and Culturally Grounded Harmfulness Detection. We evaluate representative state-of-the-art proprietary and Chinese LLMs under both English- and Chinese-prompting settings. Our results show that LLMs continue to struggle with the cross-lingual understanding of Chinese internet buzzwords, particularly in fine-grained non-literal interpretation, robust equivalent matching under option perturbations, and calibrated harmfulness detection. These findings highlight the persistent challenges posed by culturally grounded language phenomena for multilingual LLMs and safety-oriented evaluation. The dataset and code are available at https://github.com/SuperYFan/CIBuzzBench.", "arxiv_id": "2609.21722", "arxiv_url": "https://arxiv.org/abs/2609.21722", "authors": ["Yifan Wang", "Junyu Lu", "Qifan Wang", "Shun Zhang", "Chaozhuo Li", "Jiahao Liu", "Zhijun Cao", "Lingbin Bu", "Fanliang Bu"], "brief": "\u8bba\u6587\u63d0\u51fa CIBuzzBench\uff0c\u9996\u4e2a\u9762\u5411\u4e2d\u6587\u4e92\u8054\u7f51\u6d41\u884c\u8bed\u7684\u4e2d\u82f1\u8de8\u8bed\u8a00\u7406\u89e3\u57fa\u51c6\uff0c\u5305\u542b3001\u4e2a\u8bcd\u6761\u53ca\u82f1\u6587\u91ca\u4e49\u3001\u7b49\u4ef7\u8868\u8fbe\u3001\u7c7b\u522b\u548c\u6709\u5bb3\u6027\u6807\u6ce8\u3002\u8bc4\u6d4b\u663e\u793a\uff0c\u5f53\u524d\u5148\u8fdb\u5927\u6a21\u578b\u5728\u975e\u5b57\u9762\u542b\u4e49\u89e3\u91ca\u3001\u8de8\u8bed\u8a00\u7b49\u4ef7\u5339\u914d\u548c\u6587\u5316\u8bed\u5883\u4e0b\u6709\u5bb3\u6027\u68c0\u6d4b\u4e0a\u4ecd\u8868\u73b0\u4e0d\u8db3\uff0c\u51f8\u663e\u591a\u8bed\u8a00\u5b89\u5168\u8bc4\u6d4b\u4e2d\u7684\u6587\u5316\u8bed\u4e49\u6311\u6218\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21722", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u8de8\u8bed\u8a00\u7406\u89e3", "\u4e2d\u6587\u6d41\u884c\u8bed", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21722v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CIBuzzBench: A Benchmark for Cross-Lingual Understanding of Chinese Internet Buzzwords", "tldr": "\u8bba\u6587\u63d0\u51fa CIBuzzBench\uff0c\u9996\u4e2a\u9762\u5411\u4e2d\u6587\u4e92\u8054\u7f51\u6d41\u884c\u8bed\u7684\u4e2d\u82f1\u8de8\u8bed\u8a00\u7406\u89e3\u57fa\u51c6\uff0c\u5305\u542b3001\u4e2a\u8bcd\u6761\u53ca\u82f1\u6587\u91ca\u4e49\u3001\u7b49\u4ef7\u8868\u8fbe\u3001\u7c7b\u522b\u548c\u6709\u5bb3\u6027\u6807\u6ce8\u3002\u8bc4\u6d4b\u663e\u793a\uff0c\u5f53\u524d\u5148\u8fdb\u5927\u6a21\u578b\u5728\u975e\u5b57\u9762\u542b\u4e49\u89e3\u91ca\u3001\u8de8\u8bed\u8a00\u7b49\u4ef7\u5339\u914d\u548c\u6587\u5316\u8bed\u5883\u4e0b\u6709\u5bb3\u6027\u68c0\u6d4b\u4e0a\u4ecd\u8868\u73b0\u4e0d\u8db3\uff0c\u51f8\u663e\u591a\u8bed\u8a00\u5b89\u5168\u8bc4\u6d4b\u4e2d\u7684\u6587\u5316\u8bed\u4e49\u6311\u6218\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Edge AI accelerators are increasingly deployed in safety-critical environments, where model outputs may control physical actuators, make access-control decisions, or trigger alarms. In these settings, runtime failures often remain undetected because model corruption, distribution shift, and adversarial inputs can still produce well-formed, confident predictions. This paper presents TERMon, a lightweight hardware runtime monitor that detects such anomalies by observing inference behavior rather than re-executing or formally verifying the model. TERMon represents class-conditional trusted behavior as hardware-efficient ternary patterns that are matched in parallel against a thermometer-encoded fingerprint. The ternary encoding reproduces the corresponding unquantized range decision exactly. TERMon detects harmful weight corruptions in proportion to their behavioral impact, while out-of-distribution and adversarial inputs are largely not separable using the monitored features at a strict false-positive operating point. We implemented TERMon on a PYNQ-Z2 FPGA, and the pipelined design requires no on-chip block RAM or DSPs and has a two-cycle decision latency.", "arxiv_id": "2609.21713", "arxiv_url": "https://arxiv.org/abs/2609.21713", "authors": ["Arish Sateesan", "Edlira Dushku"], "brief": "\u672c\u6587\u63d0\u51fa TERMon\uff0c\u4e00\u79cd\u9762\u5411\u8fb9\u7f18 AI \u52a0\u901f\u5668\u7684\u8f7b\u91cf\u7ea7\u786c\u4ef6\u8fd0\u884c\u65f6\u76d1\u63a7\u5668\uff0c\u901a\u8fc7\u89c2\u6d4b\u63a8\u7406\u884c\u4e3a\u6307\u7eb9\u800c\u975e\u91cd\u6267\u884c\u6216\u5f62\u5f0f\u5316\u9a8c\u8bc1\u6a21\u578b\u6765\u68c0\u6d4b\u5f02\u5e38\u3002\u5b83\u7528\u4e09\u503c\u6a21\u5f0f\u8868\u793a\u7c7b\u522b\u6761\u4ef6\u4e0b\u7684\u53ef\u4fe1\u884c\u4e3a\uff0c\u5e76\u5728 FPGA \u4e0a\u5b9e\u73b0\u4e86\u65e0\u9700 BRAM/DSP\u3001\u4e24\u5468\u671f\u5ef6\u8fdf\u7684\u6d41\u6c34\u7ebf\u8bbe\u8ba1\uff1b\u5bf9\u6709\u884c\u4e3a\u5f71\u54cd\u7684\u6743\u91cd\u635f\u574f\u68c0\u6d4b\u8f83\u6709\u6548\uff0c\u4f46\u5bf9\u4e25\u683c\u4f4e\u8bef\u62a5\u4e0b\u7684\u5206\u5e03\u5916\u548c\u5bf9\u6297\u8f93\u5165\u533a\u5206\u80fd\u529b\u6709\u9650\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21713", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8fb9\u7f18AI", "\u786c\u4ef6\u5b89\u5168", "\u5f02\u5e38\u68c0\u6d4b", "\u6a21\u578b\u9c81\u68d2\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21713v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TERMon: Detecting Persistent Behavioral Threats in Edge AI via Hardware-Native Ternary Runtime Monitor", "tldr": "\u672c\u6587\u63d0\u51fa TERMon\uff0c\u4e00\u79cd\u9762\u5411\u8fb9\u7f18 AI \u52a0\u901f\u5668\u7684\u8f7b\u91cf\u7ea7\u786c\u4ef6\u8fd0\u884c\u65f6\u76d1\u63a7\u5668\uff0c\u901a\u8fc7\u89c2\u6d4b\u63a8\u7406\u884c\u4e3a\u6307\u7eb9\u800c\u975e\u91cd\u6267\u884c\u6216\u5f62\u5f0f\u5316\u9a8c\u8bc1\u6a21\u578b\u6765\u68c0\u6d4b\u5f02\u5e38\u3002\u5b83\u7528\u4e09\u503c\u6a21\u5f0f\u8868\u793a\u7c7b\u522b\u6761\u4ef6\u4e0b\u7684\u53ef\u4fe1\u884c\u4e3a\uff0c\u5e76\u5728 FPGA \u4e0a\u5b9e\u73b0\u4e86\u65e0\u9700 BRAM/DSP\u3001\u4e24\u5468\u671f\u5ef6\u8fdf\u7684\u6d41\u6c34\u7ebf\u8bbe\u8ba1\uff1b\u5bf9\u6709\u884c\u4e3a\u5f71\u54cd\u7684\u6743\u91cd\u635f\u574f\u68c0\u6d4b\u8f83\u6709\u6548\uff0c\u4f46\u5bf9\u4e25\u683c\u4f4e\u8bef\u62a5\u4e0b\u7684\u5206\u5e03\u5916\u548c\u5bf9\u6297\u8f93\u5165\u533a\u5206\u80fd\u529b\u6709\u9650\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conversational speech depends on dialogue context and the listener\u0027s immediately preceding behavior. We propose ReACT-TTS, a two-stage framework that uses a one-second pre-response listener facial sequence to plan the next utterance\u0027s emotion and prosody before speech realization. On a strict dyadic MELD protocol, Temporal conditioning yields higher mean macro-F1 and VAD concordance than Text-only across ten seeds, while accuracy remains essentially unchanged. Ablations show that temporal modeling performs best among the visual variants and that an explicit early-to-late difference is unnecessary; correct listener reactions also outperform cyclic mismatches on average. In a contextual-appropriateness study with 20 speech researchers, 76% of judgments prefer Temporal, 9% Text-only, and 15% report no preference. We further connect the predicted response style to a Grad-TTS backbone for end-to-end speech realization. Overall, the results support pre-response listener dynamics as complementary cues for conversational response planning. The source code is available at https://github.com/CYJ1/ReACT-TTS_public.", "arxiv_id": "2609.21683", "arxiv_url": "https://arxiv.org/abs/2609.21683", "authors": ["Yunji Chu"], "brief": "\u8bba\u6587\u63d0\u51fa ReACT-TTS\uff0c\u4e24\u9636\u6bb5\u5229\u7528\u8bf4\u8bdd\u524d 1 \u79d2\u542c\u8005\u9762\u90e8\u53cd\u5e94\u6765\u89c4\u5212\u4e0b\u4e00\u53e5\u7684\u60c5\u7eea\u4e0e\u97f5\u5f8b\uff0c\u518d\u63a5\u5165 Grad-TTS \u751f\u6210\u8bed\u97f3\u3002\u5728 MELD \u53cc\u4eba\u5bf9\u8bdd\u534f\u8bae\u4e0a\uff0c\u76f8\u6bd4\u4ec5\u7528\u6587\u672c\uff0c\u65f6\u95f4\u89c6\u89c9\u5efa\u6a21\u63d0\u5347\u5b8f F1 \u548c VAD \u4e00\u81f4\u6027\uff0c\u4eba\u7c7b\u8bc4\u6d4b\u4e2d 76% \u66f4\u504f\u597d\u5176\u4e0a\u4e0b\u6587\u9002\u914d\u6027\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21683", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u97f3\u751f\u6210", "\u591a\u6a21\u6001", "\u60c5\u611f\u8bc6\u522b", "\u5bf9\u8bdd\u7cfb\u7edf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21683v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Listen Before You Speak: Response Planning from Listener Facial Reactions for Conversational Speech Generation", "tldr": "\u8bba\u6587\u63d0\u51fa ReACT-TTS\uff0c\u4e24\u9636\u6bb5\u5229\u7528\u8bf4\u8bdd\u524d 1 \u79d2\u542c\u8005\u9762\u90e8\u53cd\u5e94\u6765\u89c4\u5212\u4e0b\u4e00\u53e5\u7684\u60c5\u7eea\u4e0e\u97f5\u5f8b\uff0c\u518d\u63a5\u5165 Grad-TTS \u751f\u6210\u8bed\u97f3\u3002\u5728 MELD \u53cc\u4eba\u5bf9\u8bdd\u534f\u8bae\u4e0a\uff0c\u76f8\u6bd4\u4ec5\u7528\u6587\u672c\uff0c\u65f6\u95f4\u89c6\u89c9\u5efa\u6a21\u63d0\u5347\u5b8f F1 \u548c VAD \u4e00\u81f4\u6027\uff0c\u4eba\u7c7b\u8bc4\u6d4b\u4e2d 76% \u66f4\u504f\u597d\u5176\u4e0a\u4e0b\u6587\u9002\u914d\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in large reasoning models (LRMs) have made machine unlearning more challenging, as protected facts or unsafe rationales may surface in intermediate chain-of-thought (CoT) traces before the final answer is produced. Existing unlearning objectives typically suppress the target content or redirect internal representations, but they never specify how the post-forgetting trajectory should continue, which can lead to hallucinated substitutes, malformed boundaries, or repetitive outputs. We argue that LRM unlearning should instead learn a natural forgetting trajectory: a coherent non-disclosing CoT followed by a stable refusal-style answer that replace the original disclosure. To this end, we propose Guided Answer-Reasoning Distillation (GUARD), which converts model-generated unsafe disclosures into safe-exit trajectories, aligns a frozen LRM via guidance tokens, and distills the guided behavior into model parameters.To address the lack of metrics for replacement quality beyond leakage, we further introduce Natural Forgetting Reasoning Score (NFRS), which captures structural stability, fluency, and unsupported substitutes in forgotten outputs. Extensive experiments on R-TOFU and a STAR-1-derived harmful-intent setting show that GUARD substantially reduces unsafe and privacy disclosures across two widely adopted distilled LRMs while preserving reasoning utility. Codes are available at https://github.com/zeyu-Yan/GUARD", "arxiv_id": "2609.21677", "arxiv_url": "https://arxiv.org/abs/2609.21677", "authors": ["Zeyu Yan", "Guanghao Zhou", "Minghui Qiu", "Ming Gao", "Cen Chen"], "brief": "\u8bba\u6587\u63d0\u51fa GUARD\uff0c\u7528\u201c\u5f15\u5bfc\u7684\u7b54\u6848-\u63a8\u7406\u84b8\u998f\u201d\u8ba9\u5927\u578b\u63a8\u7406\u6a21\u578b\u5728\u9057\u5fd8\u53d7\u4fdd\u62a4\u4e8b\u5b9e\u6216\u4e0d\u5b89\u5168\u63a8\u7406\u65f6\uff0c\u751f\u6210\u8fde\u8d2f\u7684\u975e\u62ab\u9732\u601d\u7ef4\u94fe\u5e76\u7ed9\u51fa\u7a33\u5b9a\u62d2\u7b54\uff0c\u800c\u4e0d\u662f\u7b80\u5355\u538b\u5236\u5185\u5bb9\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728 R-TOFU \u548c\u6709\u5bb3\u610f\u56fe\u8bbe\u7f6e\u4e2d\u663e\u8457\u964d\u4f4e\u9690\u79c1\u4e0e\u4e0d\u5b89\u5168\u4fe1\u606f\u6cc4\u9732\uff0c\u540c\u65f6\u8f83\u597d\u4fdd\u7559\u63a8\u7406\u80fd\u529b\uff0c\u5e76\u63d0\u51fa NFRS \u8bc4\u4f30\u9057\u5fd8\u540e\u8f93\u51fa\u7684\u81ea\u7136\u6027\u4e0e\u7a33\u5b9a\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21677", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u9057\u5fd8", "\u601d\u7ef4\u94fe", "\u77e5\u8bc6\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21677v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GUARD: Natural Forgetting in Large Reasoning Models via Guided Answer-Reasoning Distillation", "tldr": "\u8bba\u6587\u63d0\u51fa GUARD\uff0c\u7528\u201c\u5f15\u5bfc\u7684\u7b54\u6848-\u63a8\u7406\u84b8\u998f\u201d\u8ba9\u5927\u578b\u63a8\u7406\u6a21\u578b\u5728\u9057\u5fd8\u53d7\u4fdd\u62a4\u4e8b\u5b9e\u6216\u4e0d\u5b89\u5168\u63a8\u7406\u65f6\uff0c\u751f\u6210\u8fde\u8d2f\u7684\u975e\u62ab\u9732\u601d\u7ef4\u94fe\u5e76\u7ed9\u51fa\u7a33\u5b9a\u62d2\u7b54\uff0c\u800c\u4e0d\u662f\u7b80\u5355\u538b\u5236\u5185\u5bb9\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u5728 R-TOFU \u548c\u6709\u5bb3\u610f\u56fe\u8bbe\u7f6e\u4e2d\u663e\u8457\u964d\u4f4e\u9690\u79c1\u4e0e\u4e0d\u5b89\u5168\u4fe1\u606f\u6cc4\u9732\uff0c\u540c\u65f6\u8f83\u597d\u4fdd\u7559\u63a8\u7406\u80fd\u529b\uff0c\u5e76\u63d0\u51fa NFRS \u8bc4\u4f30\u9057\u5fd8\u540e\u8f93\u51fa\u7684\u81ea\u7136\u6027\u4e0e\u7a33\u5b9a\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) achieve strong performance but suffer from slow and costly inference. Existing acceleration methods often lead to noticeable performance degradation, while Mixture-of-Experts (MoE) models require extensive computational resources. In this paper, we propose L0-MoE, a lightweight MoE approach using L0-regularization to accelerate dense LLMs nearly without performance loss. Our method introduces a cluster confusion matrix for domain-aware dataset curation and applies dynamic batching for efficient training. Experiments show that L0-MoE achieves up to 2.5x speedup over dense models while maintaining competitive performance, outperforming existing LLM acceleration baselines.", "arxiv_id": "2609.21672", "arxiv_url": "https://arxiv.org/abs/2609.21672", "authors": ["Zhenyu Zhang", "Jiudong Yang", "Zhaowen Tao", "Meng Chen"], "brief": "\u672c\u6587\u63d0\u51fa L0-MoE\uff0c\u7528 L0 \u6b63\u5219\u5c06\u7a20\u5bc6\u5927\u8bed\u8a00\u6a21\u578b\u8f7b\u91cf\u5316\u4e3a\u6df7\u5408\u4e13\u5bb6\u5f62\u5f0f\uff0c\u4ee5\u63d0\u5347\u63a8\u7406\u901f\u5ea6\u5e76\u5c3d\u91cf\u4fdd\u6301\u6027\u80fd\u3002\u65b9\u6cd5\u7ed3\u5408\u9886\u57df\u611f\u77e5\u7684\u6570\u636e\u7b5b\u9009\u548c\u52a8\u6001\u6279\u5904\u7406\u8bad\u7ec3\uff0c\u5b9e\u9a8c\u4e2d\u6700\u9ad8\u5b9e\u73b0 2.5 \u500d\u52a0\u901f\uff0c\u4e14\u6027\u80fd\u4f18\u4e8e\u73b0\u6709\u52a0\u901f\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21672", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6df7\u5408\u4e13\u5bb6", "\u6a21\u578b\u52a0\u901f", "\u7a00\u758f\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21672v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Accelerating Dense LLMs via L0-regularized Mixture-of-Experts", "tldr": "\u672c\u6587\u63d0\u51fa L0-MoE\uff0c\u7528 L0 \u6b63\u5219\u5c06\u7a20\u5bc6\u5927\u8bed\u8a00\u6a21\u578b\u8f7b\u91cf\u5316\u4e3a\u6df7\u5408\u4e13\u5bb6\u5f62\u5f0f\uff0c\u4ee5\u63d0\u5347\u63a8\u7406\u901f\u5ea6\u5e76\u5c3d\u91cf\u4fdd\u6301\u6027\u80fd\u3002\u65b9\u6cd5\u7ed3\u5408\u9886\u57df\u611f\u77e5\u7684\u6570\u636e\u7b5b\u9009\u548c\u52a8\u6001\u6279\u5904\u7406\u8bad\u7ec3\uff0c\u5b9e\u9a8c\u4e2d\u6700\u9ad8\u5b9e\u73b0 2.5 \u500d\u52a0\u901f\uff0c\u4e14\u6027\u80fd\u4f18\u4e8e\u73b0\u6709\u52a0\u901f\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Software is a first-class scientific object, yet validated links between source code and the scholarly record remain largely absent from the Linked Open Data (LOD) cloud, isolating archived artefacts from semantic discovery. This paper presents an end-to-end reconciliation pipeline that harvests, validates, and models publication-to-repository pairs from sources where the link between a paper and its source code is explicit and editorially verified: the software-centric journals JOSS, SoftwareX, and IPOL, together with the reproducibility reports of the SIGMOD Availability and Reproducibility Initiative (ARI). This yields a curated corpus of 4,397 $\\langle$DOI, repository-URL$\\rangle$ pairs. We design two distinct application profiles grounded in Wikidata classes (one for scholarly articles, one for software instances) aligned with the schema.org and CodeMeta vocabularies. This architectural separation enables rule-based reconciliation at two granularities: lightweight, inline publication references or standalone, first-class Wikidata software nodes equipped with SWHIDs, Software Heritage\u0027s content-addressed identifiers. A read-only lookup against Wikidata shows that only 82 of the harvested repositories were already modelled there; human-reviewed batches have since created 4{,}182 new software items cross-linked to their articles. We further show that payloads of the emerging COAR Notify protocol, an external effort we do not develop, map natively onto our input format, so the same backend could later serve a live enrichment stream. Our core contribution is a pair of application profiles that turn Wikidata into a connector between the scholarly record and archived source code; we openly release all code, application profiles, and harvested datasets.", "arxiv_id": "2609.21667", "arxiv_url": "https://arxiv.org/abs/2609.21667", "authors": ["Camillo Carlo Pellizzari di San Girolamo", "Francesco Tosoni"], "brief": "\u672c\u6587\u63d0\u51fa\u4ece\u5df2\u5ba1\u6838\u6765\u6e90\u6536\u96c6\u8bba\u6587\u4e0e\u4ee3\u7801\u4ed3\u5e93\u94fe\u63a5\u7684\u7aef\u5230\u7aef\u5bf9\u9f50\u6d41\u7a0b\uff0c\u6784\u5efa\u4e864397\u7ec4 DOI-\u4ed3\u5e93URL \u6570\u636e\uff0c\u5e76\u8bbe\u8ba1\u9762\u5411\u8bba\u6587\u4e0e\u8f6f\u4ef6\u5b9e\u4f53\u7684 Wikidata \u5e94\u7528\u914d\u7f6e\u3002\u5b9e\u9a8c\u53d1\u73b0 Wikidata \u4e2d\u539f\u6709\u8986\u76d6\u5f88\u5c11\uff0c\u4eba\u5de5\u5ba1\u6838\u540e\u65b0\u589e4182\u4e2a\u8f6f\u4ef6\u6761\u76ee\uff0c\u5e76\u53ef\u4e0e COAR Notify \u8f7d\u8377\u81ea\u7136\u8854\u63a5\uff0c\u589e\u5f3a\u5b66\u672f\u8bb0\u5f55\u4e0e\u5f52\u6863\u6e90\u7801\u7684\u8bed\u4e49\u8fde\u63a5\u3002", "categories": ["cs.DL", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21667", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u56fe\u8c31", "\u5f00\u653e\u6570\u636e", "\u8f6f\u4ef6\u5de5\u7a0b", "\u6570\u5b57\u56fe\u4e66\u9986"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21667v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Code Archival to Knowledge Graph: Bridging Software Heritage, COAR Notify and Wikidata", "tldr": "\u672c\u6587\u63d0\u51fa\u4ece\u5df2\u5ba1\u6838\u6765\u6e90\u6536\u96c6\u8bba\u6587\u4e0e\u4ee3\u7801\u4ed3\u5e93\u94fe\u63a5\u7684\u7aef\u5230\u7aef\u5bf9\u9f50\u6d41\u7a0b\uff0c\u6784\u5efa\u4e864397\u7ec4 DOI-\u4ed3\u5e93URL \u6570\u636e\uff0c\u5e76\u8bbe\u8ba1\u9762\u5411\u8bba\u6587\u4e0e\u8f6f\u4ef6\u5b9e\u4f53\u7684 Wikidata \u5e94\u7528\u914d\u7f6e\u3002\u5b9e\u9a8c\u53d1\u73b0 Wikidata \u4e2d\u539f\u6709\u8986\u76d6\u5f88\u5c11\uff0c\u4eba\u5de5\u5ba1\u6838\u540e\u65b0\u589e4182\u4e2a\u8f6f\u4ef6\u6761\u76ee\uff0c\u5e76\u53ef\u4e0e COAR Notify \u8f7d\u8377\u81ea\u7136\u8854\u63a5\uff0c\u589e\u5f3a\u5b66\u672f\u8bb0\u5f55\u4e0e\u5f52\u6863\u6e90\u7801\u7684\u8bed\u4e49\u8fde\u63a5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The success of Large Audio Language Models has driven the development of massive multimodal networks exceeding billions of parameters. However, the demand for privacy-preserving, low-latency processing has shifted focus toward Small Audio Language Models (SALMs) capable of on-device execution. In this paper, we introduce Samsone, a family of SALMs designed for edge computing. Our core model, Samsone-134M, establishes a new state-of-the-art for its size class across multiple benchmarks. We further explore the scaling laws of SALMs by introducing Samsone-99M and Samsone-356M. Despite their compact footprint, the Samsone family delivers performance competitive with models orders of magnitude larger. To foster open research and reproducibility, we train Samsone on publicly available data. We release the training code, model weights, mobile-optimized checkpoints and provide an open-source Android application to demonstrate real-time on-device inference of Samsone.", "arxiv_id": "2609.21666", "arxiv_url": "https://arxiv.org/abs/2609.21666", "authors": ["Piotr Masztalski", "Micha\u0142 K. Grzeszczyk", "Olaf Sikorski"], "brief": "\u8bba\u6587\u63d0\u51fa Samsone\uff0c\u4e00\u7cfb\u5217\u9762\u5411\u7aef\u4fa7\u63a8\u7406\u7684\u5c0f\u578b\u97f3\u9891\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u53d1\u5e03\u8bad\u7ec3\u4ee3\u7801\u3001\u6743\u91cd\u3001\u79fb\u52a8\u7aef\u4f18\u5316\u68c0\u67e5\u70b9\u548c\u5b89\u5353\u5b9e\u65f6\u6f14\u793a\u5e94\u7528\u3002\u6838\u5fc3\u6a21\u578b Samsone-134M \u5728\u540c\u89c4\u6a21\u6a21\u578b\u4e2d\u8fbe\u5230\u65b0\u7684\u6700\u4f73\u8868\u73b0\uff0c99M/356M \u7248\u672c\u4e5f\u5c55\u793a\u4e86\u5c0f\u578b\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u7684\u7f29\u653e\u89c4\u5f8b\uff0c\u6027\u80fd\u53ef\u4e0e\u5927\u5f97\u591a\u7684\u6a21\u578b\u7ade\u4e89\u3002", "categories": ["eess.AS", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21666", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u9891\u8bed\u8a00\u6a21\u578b", "\u7aef\u4fa7\u63a8\u7406", "\u5c0f\u6a21\u578b", "\u5f00\u6e90\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21666v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Samsone: A Family of Open Small Audio Language Models for On-Device Inference", "tldr": "\u8bba\u6587\u63d0\u51fa Samsone\uff0c\u4e00\u7cfb\u5217\u9762\u5411\u7aef\u4fa7\u63a8\u7406\u7684\u5c0f\u578b\u97f3\u9891\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u53d1\u5e03\u8bad\u7ec3\u4ee3\u7801\u3001\u6743\u91cd\u3001\u79fb\u52a8\u7aef\u4f18\u5316\u68c0\u67e5\u70b9\u548c\u5b89\u5353\u5b9e\u65f6\u6f14\u793a\u5e94\u7528\u3002\u6838\u5fc3\u6a21\u578b Samsone-134M \u5728\u540c\u89c4\u6a21\u6a21\u578b\u4e2d\u8fbe\u5230\u65b0\u7684\u6700\u4f73\u8868\u73b0\uff0c99M/356M \u7248\u672c\u4e5f\u5c55\u793a\u4e86\u5c0f\u578b\u97f3\u9891\u8bed\u8a00\u6a21\u578b\u7684\u7f29\u653e\u89c4\u5f8b\uff0c\u6027\u80fd\u53ef\u4e0e\u5927\u5f97\u591a\u7684\u6a21\u578b\u7ade\u4e89\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Activation steering has become a widely used approach for controlling language models during explicit chain-of-thought (CoT) reasoning, motivating its extension to latent CoT. However, we find that steering continuous thoughts produces substantially weaker effects on subsequent language generation than steering explicit CoT, even when the hidden representations are moved by comparable amounts. We first show that task information remains identifiable in continuous thoughts. Hence, we hypothesize a \\textbf{latent-to-language transition gap}, in which an intervention effect in latent space fails to transfer to language generation. Two further results support this hypothesis: the output distribution changes abruptly at the transition boundary, and task-related directions exert much weaker bidirectional control in latent CoT than in explicit CoT. These findings identify the transition interface as a central target for evaluating and designing future latent-steering methods.", "arxiv_id": "2609.21662", "arxiv_url": "https://arxiv.org/abs/2609.21662", "authors": ["Gaoxiang Huang", "Lei Qi"], "brief": "\u8bba\u6587\u7814\u7a76\u53d1\u73b0\uff0c\u5728\u6f5c\u5728\u94fe\u5f0f\u601d\u7ef4\u4e2d\u505a\u6fc0\u6d3b steering\uff0c\u5bf9\u540e\u7eed\u8bed\u8a00\u751f\u6210\u7684\u63a7\u5236\u6548\u679c\u660e\u663e\u5f31\u4e8e\u663e\u5f0f CoT\uff0c\u5373\u4f7f\u9690\u85cf\u8868\u793a\u88ab\u79fb\u52a8\u4e86\u76f8\u8fd1\u5e45\u5ea6\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6f5c\u5728\u5230\u8bed\u8a00\u8f6c\u6362\u7f3a\u53e3\u201d\u5047\u8bbe\uff0c\u5e76\u901a\u8fc7\u8f6c\u6362\u8fb9\u754c\u5904\u8f93\u51fa\u5206\u5e03\u7a81\u53d8\u3001\u4efb\u52a1\u65b9\u5411\u5728\u6f5c\u5728 CoT \u4e2d\u63a7\u5236\u529b\u8f83\u5f31\u7b49\u8bc1\u636e\u52a0\u4ee5\u652f\u6301\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21662", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u94fe\u5f0f\u601d\u7ef4", "\u6fc0\u6d3b steering", "\u6f5c\u5728\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21662v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Steering Fails in Latent Reasoning: A Latent-to-Language Transition Gap", "tldr": "\u8bba\u6587\u7814\u7a76\u53d1\u73b0\uff0c\u5728\u6f5c\u5728\u94fe\u5f0f\u601d\u7ef4\u4e2d\u505a\u6fc0\u6d3b steering\uff0c\u5bf9\u540e\u7eed\u8bed\u8a00\u751f\u6210\u7684\u63a7\u5236\u6548\u679c\u660e\u663e\u5f31\u4e8e\u663e\u5f0f CoT\uff0c\u5373\u4f7f\u9690\u85cf\u8868\u793a\u88ab\u79fb\u52a8\u4e86\u76f8\u8fd1\u5e45\u5ea6\u3002\u4f5c\u8005\u63d0\u51fa\u201c\u6f5c\u5728\u5230\u8bed\u8a00\u8f6c\u6362\u7f3a\u53e3\u201d\u5047\u8bbe\uff0c\u5e76\u901a\u8fc7\u8f6c\u6362\u8fb9\u754c\u5904\u8f93\u51fa\u5206\u5e03\u7a81\u53d8\u3001\u4efb\u52a1\u65b9\u5411\u5728\u6f5c\u5728 CoT \u4e2d\u63a7\u5236\u529b\u8f83\u5f31\u7b49\u8bc1\u636e\u52a0\u4ee5\u652f\u6301\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-language-action (VLA) policies solve the same manipulation task through different action interfaces, but task success alone does not establish whether their physical executions agree. We study cross-policy end-effector geometry in 15,000 closed-loop LIBERO rollouts from four policies. The primary clean-condition analysis forms 3,600 configuration-matched, and therefore dependent, policy pairs. Both-success pairs have a median normalized dynamic time warping distance of 0.0120 m versus 0.0380 m when exactly one policy succeeds. This ordering holds in every task, every policy pair, and nine sampling and band-limited representations; however, the ratio varies severalfold across representations, so we report the direction rather than a fixed multiple. Both-failure pairs are more separated again but rest on thin, uneven support, so we report them as exploratory. Within successful executions, partner replacements separate more across tasks than across initial states. A matched baseline still reveals measurable, heterogeneous residual policy differences, so a low cross-policy distance does not imply interchangeability. Successful executions sit about as far from same-task demonstrations as those demonstrations sit from each other, compatible with task-associated geometry without separating training-data overlap from task constraints. A common 72-action window preserves the ordering but reduces its magnitude; endpoint and duration adjustment likewise leaves a positive mixed-outcome coefficient relative to both-success pairs, though its magnitude is specification-dependent. Under composite visual stress, policy rankings and pair composition change together.", "arxiv_id": "2609.21659", "arxiv_url": "https://arxiv.org/abs/2609.21659", "authors": ["Xingyu Lin", "Zhuang Li", "Zhongrun Wu", "Shouquan Zhou", "Dehui Du"], "brief": "\u672c\u6587\u6bd4\u8f83\u4e86\u56db\u79cd\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u5728 1.5 \u4e07\u6b21 LIBERO \u95ed\u73af\u64cd\u4f5c\u4e2d\u7684\u672b\u7aef\u6267\u884c\u5668\u8f68\u8ff9\u51e0\u4f55\uff0c\u53d1\u73b0\u5f53\u4e24\u4e2a\u7b56\u7565\u90fd\u6210\u529f\u65f6\u8f68\u8ff9\u8ddd\u79bb\u663e\u8457\u5c0f\u4e8e\u53ea\u6709\u4e00\u4e2a\u6210\u529f\u65f6\uff0c\u4e14\u8be5\u8d8b\u52bf\u5728\u4efb\u52a1\u3001\u7b56\u7565\u5bf9\u548c\u591a\u79cd\u8f68\u8ff9\u8868\u793a\u4e0b\u90fd\u6210\u7acb\u3002\u7ed3\u679c\u8868\u660e\u6210\u529f\u6267\u884c\u5b58\u5728\u4efb\u52a1\u76f8\u5173\u7684\u5171\u4eab\u51e0\u4f55\u7ed3\u6784\uff0c\u4f46\u4e0d\u540c\u7b56\u7565\u4ecd\u6709\u53ef\u6d4b\u7684\u6b8b\u4f59\u5dee\u5f02\uff0c\u4f4e\u8f68\u8ff9\u8ddd\u79bb\u5e76\u4e0d\u7b49\u4e8e\u7b56\u7565\u53ef\u4e92\u6362\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21659", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c", "\u8f68\u8ff9\u5206\u6790", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21659v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Outcome-Conditioned End-Effector Geometry Across Vision-Language-Action Policies", "tldr": "\u672c\u6587\u6bd4\u8f83\u4e86\u56db\u79cd\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u5728 1.5 \u4e07\u6b21 LIBERO \u95ed\u73af\u64cd\u4f5c\u4e2d\u7684\u672b\u7aef\u6267\u884c\u5668\u8f68\u8ff9\u51e0\u4f55\uff0c\u53d1\u73b0\u5f53\u4e24\u4e2a\u7b56\u7565\u90fd\u6210\u529f\u65f6\u8f68\u8ff9\u8ddd\u79bb\u663e\u8457\u5c0f\u4e8e\u53ea\u6709\u4e00\u4e2a\u6210\u529f\u65f6\uff0c\u4e14\u8be5\u8d8b\u52bf\u5728\u4efb\u52a1\u3001\u7b56\u7565\u5bf9\u548c\u591a\u79cd\u8f68\u8ff9\u8868\u793a\u4e0b\u90fd\u6210\u7acb\u3002\u7ed3\u679c\u8868\u660e\u6210\u529f\u6267\u884c\u5b58\u5728\u4efb\u52a1\u76f8\u5173\u7684\u5171\u4eab\u51e0\u4f55\u7ed3\u6784\uff0c\u4f46\u4e0d\u540c\u7b56\u7565\u4ecd\u6709\u53ef\u6d4b\u7684\u6b8b\u4f59\u5dee\u5f02\uff0c\u4f4e\u8f68\u8ff9\u8ddd\u79bb\u5e76\u4e0d\u7b49\u4e8e\u7b56\u7565\u53ef\u4e92\u6362\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-tuning Vision-Language-Action (VLA) models commonly relies on human teleoperation demonstrations, while reinforcement learning (RL) with sparse binary rewards faces an exploration challenge when successful trajectories are rarely sampled. We propose SynthDemo-RL, a teacher-student framework in which an automated teacher converts simulator-privileged state into successful manipulation trajectories, a VLA student is distilled from them by supervised fine-tuning (SFT), and PPO with binary task-success rewards refines the student. We study reward coverage, the fraction of tasks for which at least one success is observed under the fixed evaluation protocol, as a complement to the average success rate. On LIBERO-PRO, a public benchmark of perturbed LIBERO tasks for which no demonstrations exist, 27 of 57 scored tasks are at exactly 0% success for a pi_0.5 policy fine-tuned on the original LIBERO tasks. Direct PPO from this policy, under the same PPO recipe and the same RL compute as SynthDemo-RL\u0027s refinement stage, rescues 10 of these 27 tasks and leaves 17 at 0%. SynthDemo-RL, with 50 synthesized trajectories per task and no new human demonstrations, rescues all 27 and reaches average success rates of 97.8% and 97.1% on the Position and Task axes of LIBERO-PRO, respectively. On standard LIBERO, the same pipeline reaches 96.0% with no human demonstrations, within 1.7 points of pi_0.5 trained on 50 human demonstrations per task. We further validate the pipeline on RoboTwin 2.0 and verify that trajectories from a policy trained in a MuJoCo twin execute open-loop on a physical robot.", "arxiv_id": "2609.21650", "arxiv_url": "https://arxiv.org/abs/2609.21650", "authors": ["Hiroaki Kingetsu", "Hiroaki Kurihara", "Kaoru Yokoo", "Kenji Fukumizu", "Manohar Kaul"], "brief": "\u8bba\u6587\u63d0\u51fa SynthDemo-RL\uff0c\u7528\u5e26\u6a21\u62df\u5668\u7279\u6743\u72b6\u6001\u7684\u81ea\u52a8\u6559\u5e08\u751f\u6210\u6210\u529f\u64cd\u4f5c\u8f68\u8ff9\uff0c\u518d\u5bf9 VLA \u5b66\u751f\u6a21\u578b\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u5e76\u7528 PPO \u548c\u4e8c\u503c\u6210\u529f\u5956\u52b1\u7ee7\u7eed\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u5728\u65e0\u65b0\u589e\u4eba\u5de5\u793a\u8303\u4e0b\u663e\u8457\u7f13\u89e3\u7a00\u758f\u5956\u52b1\u4e0b\u7684\u96f6\u6210\u529f\u95ee\u9898\uff0c\u5728 LIBERO-PRO \u4e2d\u6551\u56de\u6240\u6709\u539f\u672c 0% \u6210\u529f\u7684\u4efb\u52a1\uff0c\u5e76\u53d6\u5f97\u7ea6 97% \u7684\u5e73\u5747\u6210\u529f\u7387\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21650", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5408\u6210\u793a\u8303"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21650v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SynthDemo-RL: Breaking the Zero-Reward Barrier in VLA Adaptation with LLM-Guided Synthetic Demonstrations", "tldr": "\u8bba\u6587\u63d0\u51fa SynthDemo-RL\uff0c\u7528\u5e26\u6a21\u62df\u5668\u7279\u6743\u72b6\u6001\u7684\u81ea\u52a8\u6559\u5e08\u751f\u6210\u6210\u529f\u64cd\u4f5c\u8f68\u8ff9\uff0c\u518d\u5bf9 VLA \u5b66\u751f\u6a21\u578b\u505a\u76d1\u7763\u5fae\u8c03\uff0c\u5e76\u7528 PPO \u548c\u4e8c\u503c\u6210\u529f\u5956\u52b1\u7ee7\u7eed\u4f18\u5316\u3002\u8be5\u65b9\u6cd5\u5728\u65e0\u65b0\u589e\u4eba\u5de5\u793a\u8303\u4e0b\u663e\u8457\u7f13\u89e3\u7a00\u758f\u5956\u52b1\u4e0b\u7684\u96f6\u6210\u529f\u95ee\u9898\uff0c\u5728 LIBERO-PRO \u4e2d\u6551\u56de\u6240\u6709\u539f\u672c 0% \u6210\u529f\u7684\u4efb\u52a1\uff0c\u5e76\u53d6\u5f97\u7ea6 97% \u7684\u5e73\u5747\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Debate adjudication requires tracking how arguments develop through interaction, yet existing datasets rarely combine fine-grained debate transcripts with professional judgments collected during real competitions under a shared rubric. We introduce a dataset and benchmark for evaluating large language models\u0027 understanding of competitive Chinese-language debate at the match, stage, and speaker levels. We organized 182 matches and recruited 120 professional judges, with each match independently adjudicated by three judges using a predefined rubric. After excluding matches with incomplete records, the dataset contains 148 matches, 2,698 stages, and 20,542 exchange units, with manually verified transcripts and segmentation. It preserves original stage scores, match votes, best-debater ballots, and adjudication rationales. We define three tasks: winner-tendency prediction, stage-score prediction, and best-debater prediction. Zero-shot evaluation of multiple large language models yields a highest winner-prediction accuracy of 66.2%, a highest Pearson correlation of 0.250 between model stage scores and mean human ratings, and a highest best-debater prediction accuracy of 56.8%. The dataset and benchmark provide a testbed for studying large language models\u0027 understanding of interactive argumentation and their agreement with professional judges.", "arxiv_id": "2609.21637", "arxiv_url": "https://arxiv.org/abs/2609.21637", "authors": ["Zongrui Yang", "Haoyuan Li", "Zhongsheng Wang", "Zhirui Zeng", "Pengqian Han", "Yi Zhou", "Yuting Wang", "Jiamou Liu"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u4e2d\u6587\u7ade\u6280\u8fa9\u8bba\u6570\u636e\u96c6\u4e0e\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b148\u573a\u6bd4\u8d5b\u30012698\u4e2a\u9636\u6bb5\u548c20542\u4e2a\u4ea4\u4e92\u5355\u5143\uff0c\u5e76\u4fdd\u7559\u4e13\u4e1a\u8bc4\u59d4\u7684\u8bc4\u5206\u3001\u6295\u7968\u3001\u6700\u4f73\u8fa9\u624b\u9009\u62e9\u548c\u8bc4\u5224\u7406\u7531\u3002\u591a\u79cd\u5927\u8bed\u8a00\u6a21\u578b\u96f6\u6837\u672c\u8868\u73b0\u6709\u9650\uff0c\u6700\u4f73\u80dc\u8d1f\u9884\u6d4b\u51c6\u786e\u738766.2%\uff0c\u9636\u6bb5\u8bc4\u5206\u4e0e\u4eba\u7c7b\u8bc4\u5206\u76f8\u5173\u6027\u6700\u9ad80.250\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u5bf9\u4e92\u52a8\u5f0f\u8bba\u8bc1\u548c\u4e13\u4e1a\u88c1\u5224\u6807\u51c6\u7684\u7406\u89e3\u4ecd\u6709\u8f83\u5927\u63d0\u5347\u7a7a\u95f4\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21637", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4e2d\u6587\u6570\u636e\u96c6", "\u8bba\u8bc1\u7406\u89e3", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21637v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Chinese Competitive Debating Dataset and Benchmark", "tldr": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u4e2d\u6587\u7ade\u6280\u8fa9\u8bba\u6570\u636e\u96c6\u4e0e\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b148\u573a\u6bd4\u8d5b\u30012698\u4e2a\u9636\u6bb5\u548c20542\u4e2a\u4ea4\u4e92\u5355\u5143\uff0c\u5e76\u4fdd\u7559\u4e13\u4e1a\u8bc4\u59d4\u7684\u8bc4\u5206\u3001\u6295\u7968\u3001\u6700\u4f73\u8fa9\u624b\u9009\u62e9\u548c\u8bc4\u5224\u7406\u7531\u3002\u591a\u79cd\u5927\u8bed\u8a00\u6a21\u578b\u96f6\u6837\u672c\u8868\u73b0\u6709\u9650\uff0c\u6700\u4f73\u80dc\u8d1f\u9884\u6d4b\u51c6\u786e\u738766.2%\uff0c\u9636\u6bb5\u8bc4\u5206\u4e0e\u4eba\u7c7b\u8bc4\u5206\u76f8\u5173\u6027\u6700\u9ad80.250\uff0c\u8bf4\u660e\u5f53\u524d\u6a21\u578b\u5bf9\u4e92\u52a8\u5f0f\u8bba\u8bc1\u548c\u4e13\u4e1a\u88c1\u5224\u6807\u51c6\u7684\u7406\u89e3\u4ecd\u6709\u8f83\u5927\u63d0\u5347\u7a7a\u95f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent work applies human psychometric questionnaires to large language models to elicit moral and value profiles, but it is not clear whether these instruments measure anything stable in models or whether the resulting profiles can be moved toward a target human population. We administer the Norwegian Moral Foundations Questionnaire (MFQ-30) to six open-weight LLMs and compare their foundation profiles to a sample of N = 1,282 Norwegian respondents. We test two steering interventions, prompt-level persona steering and activation-level ActAdd. Half the models engage with the questionnaire under our attention check. The other half default to flat or central-tendency outputs that look near-human on average without tracking item content. A neutral Nordic-respondent persona, written without any distributional information from the human sample, brings the engaging models 44-77% closer to the Norwegian mean in Mahalanobis $d^2$. One-pair ActAdd at a fixed mid-layer flattens the foundation profile rather than steering individual foundations. For at least one model the same persona that shifts the profile also induces engagement that was absent at baseline, a concrete instance of the cognitive phantoms that Peereboom et al. (2025) warn about.", "arxiv_id": "2609.21636", "arxiv_url": "https://arxiv.org/abs/2609.21636", "authors": ["Hans Andersen", "David Dichas"], "brief": "\u8bba\u6587\u7528\u632a\u5a01\u7248\u9053\u5fb7\u57fa\u7840\u95ee\u5377\uff08MFQ-30\uff09\u6d4b\u8bd56\u4e2a\u5f00\u6e90\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u5e76\u4e0e1282\u540d\u632a\u5a01\u53d7\u8bbf\u8005\u5bf9\u6bd4\uff0c\u53d1\u73b0\u53ea\u6709\u4e00\u534a\u6a21\u578b\u771f\u6b63\u6839\u636e\u9898\u76ee\u4f5c\u7b54\uff0c\u53e6\u4e00\u534a\u5448\u73b0\u8fd1\u4f3c\u201c\u5c45\u4e2d\u201d\u7684\u4f2a\u4eba\u7c7b\u7ed3\u679c\u3002\u63d0\u793a\u8bcd\u5c42\u9762\u7684\u5317\u6b27\u53d7\u8bbf\u8005\u4eba\u683c\u8bbe\u5b9a\u53ef\u4f7f\u6709\u6548\u4f5c\u7b54\u6a21\u578b\u663e\u8457\u63a5\u8fd1\u632a\u5a01\u4eba\u5747\u503c\uff0c\u800c\u6fc0\u6d3b\u5c42ActAdd\u4e3b\u8981\u8ba9\u9053\u5fb7\u753b\u50cf\u53d8\u5e73\uff0c\u96be\u4ee5\u7cbe\u786e\u63a7\u5236\u5177\u4f53\u7ef4\u5ea6\u3002", "categories": ["cs.CL", "cs.AI", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21636", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4ef7\u503c\u5bf9\u9f50", "\u63d0\u793a\u8bcd\u5de5\u7a0b", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21636v1", "published_at": "2026-09-18", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Steering LLMs Responses Towards Moral Foundations on the Norwegian MFQ-30"
