<script>
const PAPERS = [{"abstract": "Comprehensive video understanding is crucial for advancing artificial intelligence toward the intricate dynamics of the physical world. While recent advances in Multimodal Large Language Models (MLLMs) have demonstrated remarkable capabilities in video understanding, existing benchmarks remain confined to simple scene-level queries or global summaries that require only single-step inference. Real-world video understanding involves more challenging tasks that require multi-hop multimodal reasoning, and there is a critical absence of video benchmarks equipped to rigorously evaluate these agentic capabilities. To bridge this gap, we introduce AgentVidBench, a multi-hop video question answering benchmark focused on evaluating the spatial, temporal, and causal reasoning capabilities of MLLM agents. Beyond standard question-answer pairs, AgentVidBench provides step-by-step solution traces to support trajectory evaluation that assesses whether agents explicitly acquire the evidence needed to justify their answers. Experiments with 12 proprietary and open-source MLLMs show that single-turn performance remains limited on AgentVidBench, while integrating these models into state-of-the-art agentic workflows generally improves performance with respect to both accuracy and trajectory scores. We further present a simple yet effective agentic strategy that serves as a competitive baseline on AgentVidBench, establishing our benchmark as a holistic testbed for future research on agentic video understanding. Code and datasets are available at https://github.com/krafton-ai/agentvidbench and https://huggingface.co/datasets/agentvidbench/agentvidbench.", "arxiv_id": "2609.21386", "arxiv_url": "https://arxiv.org/abs/2609.21386", "authors": ["Seoyeon An", "Hyeonseo Jang", "Minsu Kim", "Chanho Lee", "Younghan Park", "Kangwook Lee"], "brief": "\u8bba\u6587\u63d0\u51fa AgentVidBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u667a\u80fd\u4f53\u89c6\u9891\u7406\u89e3\u80fd\u529b\u7684\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u57fa\u51c6\u3002\u5b83\u8986\u76d6\u7a7a\u95f4\u3001\u65f6\u95f4\u4e0e\u56e0\u679c\u63a8\u7406\uff0c\u5e76\u63d0\u4f9b\u9010\u6b65\u89e3\u9898\u8f68\u8ff9\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u771f\u6b63\u83b7\u53d6\u4e86\u652f\u6491\u7b54\u6848\u7684\u8bc1\u636e\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21386", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u533a\u522b\u4e8e\u53ea\u9700\u5355\u6b65\u63a8\u7406\u7684\u4f20\u7edf\u89c6\u9891\u95ee\u7b54\uff0cAgentVidBench\u5f3a\u8c03\u771f\u5b9e\u573a\u666f\u4e2d\u7684\u591a\u8df3\u591a\u6a21\u6001\u63a8\u7406\u3002", "\u57fa\u51c6\u4e0d\u4ec5\u5305\u542b\u95ee\u7b54\u5bf9\uff0c\u8fd8\u63d0\u4f9b\u9010\u6b65 solution traces\uff0c\u53ef\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u63a8\u7406\u8f68\u8ff9\u4e0e\u8bc1\u636e\u83b7\u53d6\u8fc7\u7a0b\u3002", "\u5bf912\u4e2a\u95ed\u6e90\u548c\u5f00\u6e90MLLM\u5b9e\u9a8c\u663e\u793a\uff0c\u5355\u8f6e\u56de\u7b54\u8868\u73b0\u6709\u9650\uff0c\u5f15\u5165\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u901a\u5e38\u80fd\u63d0\u5347\u51c6\u786e\u7387\u548c\u8f68\u8ff9\u5f97\u5206\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u89c6\u9891\u7406\u89e3", "\u591a\u6a21\u6001", "\u63a8\u7406\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21386v1", "published_at": "2026-09-18", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "AgentVidBench: A Multi-Hop Video Question Answering Benchmark for Evaluating MLLM Agents", "tldr": "\u9762\u5411\u89c6\u9891\u591a\u8df3\u63a8\u7406\u7684MLLM\u667a\u80fd\u4f53\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AgentVidBench\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u667a\u80fd\u4f53\u89c6\u9891\u7406\u89e3\u80fd\u529b\u7684\u591a\u8df3\u89c6\u9891\u95ee\u7b54\u57fa\u51c6\u3002\u5b83\u8986\u76d6\u7a7a\u95f4\u3001\u65f6\u95f4\u4e0e\u56e0\u679c\u63a8\u7406\uff0c\u5e76\u63d0\u4f9b\u9010\u6b65\u89e3\u9898\u8f68\u8ff9\u7528\u4e8e\u8bc4\u4f30\u6a21\u578b\u662f\u5426\u771f\u6b63\u83b7\u53d6\u4e86\u652f\u6491\u7b54\u6848\u7684\u8bc1\u636e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u9891\u7406\u89e3\u8bc4\u6d4b\u4ece\u7ed3\u679c\u6b63\u786e\u6027\u63a8\u8fdb\u5230\u667a\u80fd\u4f53\u5f0f\u8bc1\u636e\u6536\u96c6\u4e0e\u63a8\u7406\u8fc7\u7a0b\u8bc4\u4f30\uff0c\u4e3a\u7814\u7a76\u5177\u5907\u590d\u6742\u65f6\u7a7a\u56e0\u679c\u7406\u89e3\u80fd\u529b\u7684MLLM\u667a\u80fd\u4f53\u63d0\u4f9b\u4e86\u66f4\u7cfb\u7edf\u7684\u6d4b\u8bd5\u5e8a\u3002"}, {"abstract": "This paper studies agentic image restoration, in which multimodal agents coordinate specialized restoration tools to recover images affected by complex degradations. Existing restoration agents often derive complete tool-use plans from the original degraded image or retrieve previously successful trajectories, providing limited support for adapting individual actions to evolving intermediate restoration states. We find that accepted tool executions can change the residual degradation state and, consequently, the applicability of subsequent tools. To address this issue, we propose SkillIR, a skill-guided framework that represents restoration experience as degradation-centered action evidence rather than complete tool-use trajectories. SkillIR consolidates context-dependent action outcomes into scene-aware restoration skills that characterize applicable conditions, expected effects, and attributable failure cases. Instead of prescribing a complete restoration plan, the retrieved skills guide one bounded action at a time within a verified residual-state loop: each tool output is treated as a candidate, committed only after transition verification, and followed by reassessment of the active residual degradations. After each rollout, the resulting evidence is used to create, refine, or patch dynamic skills, enabling accumulated restoration experience to improve decision-making for subsequent inputs. Experiments on synthetic and real-world multi-degradation datasets demonstrate that SkillIR improves restoration quality and enables more reliable and effective tool use.", "arxiv_id": "2609.21468", "arxiv_url": "https://arxiv.org/abs/2609.21468", "authors": ["Jie Shao", "Shengkai Hu", "Xu Zhang", "Beihang Song", "Yongcheng Jing", "Xu Wu", "Jun Wan"], "brief": "SkillIR \u662f\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u56fe\u50cf\u4fee\u590d\u7684\u6280\u80fd\u5f15\u5bfc\u6846\u67b6\uff0c\u5c06\u4fee\u590d\u7ecf\u9a8c\u8868\u793a\u4e3a\u4ee5\u9000\u5316\u7c7b\u578b\u4e3a\u4e2d\u5fc3\u7684\u52a8\u4f5c\u8bc1\u636e\uff0c\u800c\u975e\u5b8c\u6574\u5de5\u5177\u8f68\u8ff9\u3002\u5b83\u5728\u6bcf\u4e00\u6b65\u6839\u636e\u4e2d\u95f4\u4fee\u590d\u72b6\u6001\u68c0\u7d22\u573a\u666f\u611f\u77e5\u6280\u80fd\uff0c\u9a8c\u8bc1\u5de5\u5177\u8f93\u51fa\u540e\u518d\u63d0\u4ea4\uff0c\u5e76\u6301\u7eed\u66f4\u65b0\u6280\u80fd\u5e93\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21468", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u5de5\u5177\u6267\u884c\u7ed3\u679c\u62bd\u8c61\u4e3a\u5305\u542b\u9002\u7528\u6761\u4ef6\u3001\u9884\u671f\u6548\u679c\u548c\u5931\u8d25\u5f52\u56e0\u7684\u573a\u666f\u611f\u77e5\u4fee\u590d\u6280\u80fd\u3002", "\u91c7\u7528\u6b8b\u4f59\u9000\u5316\u72b6\u6001\u95ed\u73af\uff1a\u6bcf\u6b21\u53ea\u51b3\u7b56\u4e00\u4e2a\u6709\u8fb9\u754c\u7684\u5de5\u5177\u52a8\u4f5c\uff0c\u8f93\u51fa\u9700\u901a\u8fc7\u72b6\u6001\u8f6c\u79fb\u9a8c\u8bc1\u540e\u624d\u88ab\u63a5\u53d7\u3002", "\u5728\u5408\u6210\u4e0e\u771f\u5b9e\u591a\u9000\u5316\u6570\u636e\u96c6\u4e0a\u63d0\u5347\u4fee\u590d\u8d28\u91cf\uff0c\u5e76\u63d0\u9ad8\u591a\u5de5\u5177\u8c03\u7528\u7684\u53ef\u9760\u6027\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u56fe\u50cf\u4fee\u590d", "\u5de5\u5177\u4f7f\u7528", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21468v1", "published_at": "2026-09-18", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SkillIR: Evolving Scene-Aware Skills for Agentic Image Restoration", "tldr": "\u7528\u52a8\u6001\u6280\u80fd\u63d0\u5347\u56fe\u50cf\u4fee\u590d\u667a\u80fd\u4f53\u5de5\u5177\u51b3\u7b56\u3002", "upvotes": 0, "what_it_is": "SkillIR \u662f\u4e00\u4e2a\u9762\u5411\u667a\u80fd\u4f53\u56fe\u50cf\u4fee\u590d\u7684\u6280\u80fd\u5f15\u5bfc\u6846\u67b6\uff0c\u5c06\u4fee\u590d\u7ecf\u9a8c\u8868\u793a\u4e3a\u4ee5\u9000\u5316\u7c7b\u578b\u4e3a\u4e2d\u5fc3\u7684\u52a8\u4f5c\u8bc1\u636e\uff0c\u800c\u975e\u5b8c\u6574\u5de5\u5177\u8f68\u8ff9\u3002\u5b83\u5728\u6bcf\u4e00\u6b65\u6839\u636e\u4e2d\u95f4\u4fee\u590d\u72b6\u6001\u68c0\u7d22\u573a\u666f\u611f\u77e5\u6280\u80fd\uff0c\u9a8c\u8bc1\u5de5\u5177\u8f93\u51fa\u540e\u518d\u63d0\u4ea4\uff0c\u5e76\u6301\u7eed\u66f4\u65b0\u6280\u80fd\u5e93\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u56fe\u50cf\u4fee\u590d\u4ece\u4e00\u6b21\u6027\u89c4\u5212\u8f6c\u5411\u53ef\u9a8c\u8bc1\u3001\u53ef\u8fed\u4ee3\u7684\u6280\u80fd\u6f14\u5316\u8fc7\u7a0b\uff0c\u589e\u5f3a\u4e86\u591a\u6a21\u6001\u667a\u80fd\u4f53\u5728\u590d\u6742\u9000\u5316\u573a\u666f\u4e0b\u7684\u81ea\u9002\u5e94\u5de5\u5177\u4f7f\u7528\u80fd\u529b\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Large language model (LLM) agents can propose, implement, and evaluate model changes. Autoresearch loops demonstrate this capability through minutes-scale iterations on a self-contained program. Online autoresearch instead spans asynchronous systems, hours-long variants, and weeks-long campaigns that can influence a product. A completed run can still support an invalid conclusion when a code change is a no-op, data windows leak, evaluator semantics drift, or the two arms traverse different serving funnels. We present EvoPilot, a human-gated method for long-horizon online autoresearch. Role-specific agents execute each round through a versioned domain skill and typed adapter. Durable records preserve experiments and failures; deterministic checks enforce recorded lessons. We study a 37-day campaign for the retrieval system that powers Video Deep Dive (VDD), an online experience for discovering follow-on videos after a user opens a seed video. The campaign covered seven directions and used an hourly refreshed index of hundreds of millions of videos. Earlier manual experiments had not established a benefit from an interaction head. A primitive autoresearch attempt revisited the direction but incorrectly attributed an offline hit-rate decline of 22 percentage points to the head. We then introduced EvoPilot. Its human-gated verification traced the drop to a pre-existing evaluation defect that produced output depths of 3,000 and 600. After repair, a matched comparison measured an offline improvement of 3.20 percentage points. Post-study replay and mutation tests rejected invalid comparisons while admitting valid counterparts. Durable state recovered an interrupted round, and artifact reuse avoided approximately five GPU-hours. Separately, a seven-day randomized online evaluation estimated a 0.66% relative increase in the VDD slice of Good Search Result Rate for Retention (GSRR).", "arxiv_id": "2609.21257", "arxiv_url": "https://arxiv.org/abs/2609.21257", "authors": ["Hao Fu", "Baiting Zhu", "Minglei Chen", "Yinjie Huang", "Shuai Ding"], "brief": "\u8bba\u6587\u63d0\u51fa EvoPilot\uff0c\u4e00\u79cd\u9762\u5411\u957f\u5468\u671f\u5728\u7ebf\u81ea\u52a8\u7814\u7a76\u7684\u4eba\u7c7b\u628a\u5173\u5f0f LLM Agent \u65b9\u6cd5\uff0c\u7528\u4e8e\u5728\u5927\u89c4\u6a21\u89c6\u9891\u53d1\u73b0\u68c0\u7d22\u7cfb\u7edf\u4e2d\u63d0\u51fa\u3001\u5b9e\u73b0\u5e76\u9a8c\u8bc1\u6a21\u578b\u6539\u52a8\u3002\u5b83\u901a\u8fc7\u7248\u672c\u5316\u6280\u80fd\u3001\u7c7b\u578b\u5316\u9002\u914d\u5668\u3001\u6301\u4e45\u5316\u5b9e\u9a8c\u8bb0\u5f55\u548c\u786e\u5b9a\u6027\u68c0\u67e5\uff0c\u907f\u514d\u65e0\u6548\u4ee3\u7801\u53d8\u66f4\u3001\u6570\u636e\u6cc4\u6f0f\u3001\u8bc4\u4f30\u6f02\u79fb\u7b49\u5bfc\u81f4\u7684\u9519\u8bef\u7ed3\u8bba\u3002", "categories": ["cs.IR", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21257", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728 Video Deep Dive \u68c0\u7d22\u7cfb\u7edf\u4e0a\u8fdb\u884c\u4e86 37 \u5929\u5b9e\u9a8c\uff0c\u8986\u76d6 7 \u4e2a\u7814\u7a76\u65b9\u5411\uff0c\u7d22\u5f15\u89c4\u6a21\u8fbe\u6570\u4ebf\u89c6\u9891\u5e76\u6309\u5c0f\u65f6\u5237\u65b0\u3002", "EvoPilot \u53d1\u73b0\u4e00\u6b21 22 \u4e2a\u767e\u5206\u70b9\u79bb\u7ebf\u4e0b\u964d\u5e76\u975e\u6a21\u578b\u95ee\u9898\uff0c\u800c\u662f\u5df2\u6709\u8bc4\u4f30\u7f3a\u9677\uff1b\u4fee\u590d\u540e\u5339\u914d\u6bd4\u8f83\u663e\u793a\u79bb\u7ebf\u63d0\u5347 3.20 \u4e2a\u767e\u5206\u70b9\u3002", "\u56de\u653e\u4e0e\u53d8\u5f02\u6d4b\u8bd5\u80fd\u62d2\u7edd\u65e0\u6548\u5bf9\u6bd4\u3001\u63a5\u53d7\u6709\u6548\u5bf9\u6bd4\uff1b\u6301\u4e45\u5316\u72b6\u6001\u652f\u6301\u4e2d\u65ad\u6062\u590d\uff0c\u5e76\u590d\u7528\u4ea7\u7269\u8282\u7701\u7ea6 5 \u4e2a GPU \u5c0f\u65f6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4fe1\u606f\u68c0\u7d22", "\u81ea\u52a8\u5316\u673a\u5668\u5b66\u4e60", "\u8bc4\u4f30\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21257v1", "published_at": "2026-09-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Verify, Don\u0027t Trust: Agentic Model Development for Video Discovery Retrieval at Scale", "tldr": "EvoPilot\u8ba9\u5728\u7ebf\u81ea\u52a8\u7814\u7a76\u66f4\u53ef\u4fe1\u53ef\u9a8c\u8bc1", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EvoPilot\uff0c\u4e00\u79cd\u9762\u5411\u957f\u5468\u671f\u5728\u7ebf\u81ea\u52a8\u7814\u7a76\u7684\u4eba\u7c7b\u628a\u5173\u5f0f LLM Agent \u65b9\u6cd5\uff0c\u7528\u4e8e\u5728\u5927\u89c4\u6a21\u89c6\u9891\u53d1\u73b0\u68c0\u7d22\u7cfb\u7edf\u4e2d\u63d0\u51fa\u3001\u5b9e\u73b0\u5e76\u9a8c\u8bc1\u6a21\u578b\u6539\u52a8\u3002\u5b83\u901a\u8fc7\u7248\u672c\u5316\u6280\u80fd\u3001\u7c7b\u578b\u5316\u9002\u914d\u5668\u3001\u6301\u4e45\u5316\u5b9e\u9a8c\u8bb0\u5f55\u548c\u786e\u5b9a\u6027\u68c0\u67e5\uff0c\u907f\u514d\u65e0\u6548\u4ee3\u7801\u53d8\u66f4\u3001\u6570\u636e\u6cc4\u6f0f\u3001\u8bc4\u4f30\u6f02\u79fb\u7b49\u5bfc\u81f4\u7684\u9519\u8bef\u7ed3\u8bba\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a LLM Agent \u4ece\u5206\u949f\u7ea7\u5c01\u95ed\u81ea\u7814\u7a76\u63a8\u8fdb\u5230\u771f\u5b9e\u7ebf\u4e0a\u7cfb\u7edf\u7684\u5468\u7ea7\u6a21\u578b\u5f00\u53d1\uff0c\u5e76\u5f3a\u8c03\u201c\u9a8c\u8bc1\u800c\u975e\u4fe1\u4efb\u201d\uff0c\u5bf9\u6784\u5efa\u53ef\u5ba1\u8ba1\u3001\u53ef\u6062\u590d\u3001\u53ef\u9632\u9519\u7684\u81ea\u52a8\u5316\u673a\u5668\u5b66\u4e60\u4e0e\u4ea7\u54c1\u5b9e\u9a8c\u6d41\u7a0b\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Natural audio-visual interaction is emerging as an important interface for AI assistants, allowing users to communicate through speech and vision rather than carefully composed text prompts. However, existing benchmarks of interactive capabilities still focus primarily on response quality, leaving a more fundamental question underexplored: can a model correctly infer the user\u0027s underlying demand from complex multimodal interaction? Real-world user demands are often underspecified in speech and must be inferred from multimodal cues and dialogue history. This inference is further complicated by ambiguous or disfluent expression and noisy acoustic environments. Conversely, request-like speech may not constitute a demand to the assistant, leading to false triggers. We establish Omni Demand Understanding (ODU) as a distinct multimodal contextual inference problem: given an interaction stream, a model must detect whether a user demand is present and infer intent from multimodal and conversational context. ODU evaluates this capability along five dimensions, covering both single-turn and multi-turn interactions. We construct ODU-Bench using a challenge-driven taxonomy, taxonomy-guided agentic video generation, and human-recorded interactions, followed by media-grounded annotation and human verification. We evaluate 14 native MLLMs. Even the strongest, Gemini 3.1 Pro, recovers only 44.7% of key information that must be inferred from visual, acoustic, or conversational context. Moreover, 11 of the 14 models exhibit false-trigger rates above 50% on non-demand scenarios. These results reveal a systematic capability gap in current MLLMs\u0027 ability to infer contextual user demands. We hope ODU can establish the evaluation of a previously underexplored yet essential capability in multimodal interaction: correctly understanding user demands before generating an appropriate response.", "arxiv_id": "2609.21392", "arxiv_url": "https://arxiv.org/abs/2609.21392", "authors": ["Qi Chen", "Yunfei Chu", "Haolin He", "Yifan Yang", "Zihan Liu", "Yuxuan Wang", "Ziyang Ma", "Ruiyang Xu", "Meng Gao", "Yinsong Yan", "Ling Wang", "Hui Wang", "Wen Huang", "Yiheng Chen", "Guanrou Yang", "Qiuqiang Kong", "Jin Xu", "Xie Chen"], "brief": "\u8bba\u6587\u63d0\u51fa Omni Demand Understanding\uff08ODU\uff09\u8fd9\u4e00\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u610f\u56fe\u63a8\u65ad\u4efb\u52a1\uff1a\u6a21\u578b\u9700\u4ece\u8bed\u97f3\u3001\u89c6\u89c9\u4e0e\u5bf9\u8bdd\u5386\u53f2\u4e2d\u5224\u65ad\u7528\u6237\u662f\u5426\u771f\u7684\u6709\u9700\u6c42\uff0c\u5e76\u63a8\u65ad\u5177\u4f53\u610f\u56fe\u3002\u4f5c\u8005\u6784\u5efa\u4e86 ODU-Bench\uff0c\u8986\u76d6\u5355\u8f6e\u3001\u591a\u8f6e\u3001\u6b67\u4e49\u8868\u8fbe\u3001\u566a\u58f0\u73af\u5883\u548c\u975e\u9700\u6c42\u8bef\u89e6\u53d1\u7b49\u573a\u666f\u3002", "categories": ["cs.CL", "cs.CV", "cs.MM", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21392", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["ODU \u5c06\u8bc4\u6d4b\u91cd\u70b9\u4ece\u201c\u56de\u7b54\u5f97\u597d\u4e0d\u597d\u201d\u524d\u79fb\u5230\u201c\u662f\u5426\u6b63\u786e\u7406\u89e3\u7528\u6237\u9700\u6c42\u201d\uff0c\u5f3a\u8c03\u6b20\u8bf4\u660e\u3001\u53e3\u8bed\u5316\u3001\u542b\u7cca\u8868\u8fbe\u548c\u73af\u5883\u566a\u58f0\u4e0b\u7684\u610f\u56fe\u63a8\u65ad\u3002", "ODU-Bench \u901a\u8fc7\u6311\u6218\u9a71\u52a8\u5206\u7c7b\u4f53\u7cfb\u3001\u5206\u7c7b\u5f15\u5bfc\u7684\u667a\u80fd\u4f53\u89c6\u9891\u751f\u6210\u3001\u4eba\u7c7b\u5f55\u5236\u4ea4\u4e92\uff0c\u4ee5\u53ca\u57fa\u4e8e\u5a92\u4f53\u7684\u6807\u6ce8\u548c\u4eba\u5de5\u9a8c\u8bc1\u6784\u5efa\u3002", "\u8bc4\u6d4b 14 \u4e2a\u539f\u751f\u591a\u6a21\u6001\u5927\u6a21\u578b\u540e\u53d1\u73b0\uff0c\u6700\u5f3a\u7684 Gemini 3.1 Pro \u4e5f\u53ea\u80fd\u6062\u590d 44.7% \u9700\u4ece\u89c6\u89c9\u3001\u58f0\u97f3\u6216\u5bf9\u8bdd\u4e0a\u4e0b\u6587\u63a8\u65ad\u7684\u5173\u952e\u4fe1\u606f\uff0c\u4e14 11 \u4e2a\u6a21\u578b\u5728\u975e\u9700\u6c42\u573a\u666f\u7684\u8bef\u89e6\u53d1\u7387\u8d85\u8fc7 50%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u610f\u56fe\u7406\u89e3", "\u667a\u80fd\u4f53", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21392v1", "published_at": "2026-09-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Omni Demand Understanding: A Benchmark for Contextual User-Intent Inference in Multimodal Interaction", "tldr": "\u8bc4\u6d4b\u591a\u6a21\u6001\u52a9\u624b\u80fd\u5426\u8bfb\u61c2\u771f\u5b9e\u7528\u6237\u9700\u6c42", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Omni Demand Understanding\uff08ODU\uff09\u8fd9\u4e00\u591a\u6a21\u6001\u4e0a\u4e0b\u6587\u610f\u56fe\u63a8\u65ad\u4efb\u52a1\uff1a\u6a21\u578b\u9700\u4ece\u8bed\u97f3\u3001\u89c6\u89c9\u4e0e\u5bf9\u8bdd\u5386\u53f2\u4e2d\u5224\u65ad\u7528\u6237\u662f\u5426\u771f\u7684\u6709\u9700\u6c42\uff0c\u5e76\u63a8\u65ad\u5177\u4f53\u610f\u56fe\u3002\u4f5c\u8005\u6784\u5efa\u4e86 ODU-Bench\uff0c\u8986\u76d6\u5355\u8f6e\u3001\u591a\u8f6e\u3001\u6b67\u4e49\u8868\u8fbe\u3001\u566a\u58f0\u73af\u5883\u548c\u975e\u9700\u6c42\u8bef\u89e6\u53d1\u7b49\u573a\u666f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u5f53\u524d\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u771f\u5b9e\u4ea4\u4e92\u4e2d\u7684\u57fa\u7840\u77ed\u677f\uff1a\u6a21\u578b\u4e0d\u4ec5\u8981\u4f1a\u56de\u7b54\uff0c\u8fd8\u5fc5\u987b\u5148\u5224\u65ad\u7528\u6237\u662f\u5426\u5728\u8bf7\u6c42\u5e2e\u52a9\u3001\u8bf7\u6c42\u4ec0\u4e48\u3002ODU-Bench \u4e3a\u8bed\u97f3\u89c6\u89c9\u52a9\u624b\u3001\u73af\u5883\u611f\u77e5\u667a\u80fd\u4f53\u548c\u591a\u6a21\u6001\u4ea4\u4e92\u7cfb\u7edf\u63d0\u4f9b\u4e86\u66f4\u8d34\u8fd1\u5b9e\u9645\u4f7f\u7528\u7684\u8bc4\u6d4b\u57fa\u51c6\u3002"}, {"abstract": "World Action Models bring the predictive capabilities of video models into robot action generation, providing a rich foundation for modeling future visual states. Tactile sensing complements this foundation with direct measurements of physical interaction. Some existing methods use tactile features as conditioning inputs without jointly predicting future tactile states, visual observations, and actions. Our key insight is that tactile signals, like video, provide observations of the evolving world state and should be modeled as future observations alongside video. We present ME-Dex-1.0 (MachEmbodied-Dex-1.0), a unified World Action Tactile Model for joint visual, tactile, and action learning. ME-Dex-1.0 adopts a Mixture-of-Transformers architecture comprising a Video Expert, a Tactile Expert, and an Action Expert, all trained with flow matching. We use shared attention connects the experts in intermediate layers, allowing action generation to draw on learned representations of visual and tactile dynamics during joint denoising. To support multi-source heterogeneous tactile inputs, a Canonical Hand Model and a Unified Tactile Autoencoder map tactile observations from different embodiments and sensing layouts into shared spatial and latent spaces. To address the limited availability of paired visual, tactile, and action data, we develop the Agentic Tactile Data Engine, an agent-based data production platform. It supplements RoboTwin and DexJoCo with tactile data recorded directly from force sensors during trajectory replay in simulation. Experiments on the RoboTwin, DexJoCo, and ManiFeel simulation platforms, together with real robot evaluations, demonstrate improved manipulation performance using both grippers and dexterous hands equipped with tactile sensing.", "arxiv_id": "2609.21449", "arxiv_url": "https://arxiv.org/abs/2609.21449", "authors": ["Xuancheng Zhang", "Xuetao Liu", "Qianying Tang", "Jizhe Wang", "Zhijing Cheng", "Bochen Lin", "Haoran Wen", "Ming Li", "Kun Zhan", "Yu Liu"], "brief": "ME-Dex-1.0 \u63d0\u51fa\u4e00\u79cd World Action Tactile Model\uff0c\u5c06\u89e6\u89c9\u50cf\u89c6\u9891\u4e00\u6837\u4f5c\u4e3a\u672a\u6765\u4e16\u754c\u72b6\u6001\u5171\u540c\u9884\u6d4b\u3002\u5b83\u8054\u5408\u5efa\u6a21\u89c6\u89c9\u89c2\u6d4b\u3001\u89e6\u89c9\u4fe1\u53f7\u4e0e\u52a8\u4f5c\uff0c\u7528\u4e8e\u63d0\u5347\u673a\u5668\u4eba\u7075\u5de7\u64cd\u4f5c\u751f\u6210\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21449", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528 Mixture-of-Transformers \u67b6\u6784\uff0c\u5305\u542b Video Expert\u3001Tactile Expert \u548c Action Expert\uff0c\u5e76\u901a\u8fc7\u5171\u4eab\u6ce8\u610f\u529b\u5728\u4e2d\u95f4\u5c42\u878d\u5408\u591a\u6a21\u6001\u52a8\u6001\u8868\u5f81", "\u4f7f\u7528 Canonical Hand Model \u4e0e Unified Tactile Autoencoder\uff0c\u5c06\u4e0d\u540c\u673a\u5668\u4eba\u5f62\u6001\u548c\u89e6\u89c9\u4f20\u611f\u5e03\u5c40\u6620\u5c04\u5230\u7edf\u4e00\u7a7a\u95f4\u4e0e\u6f5c\u8868\u793a", "\u6784\u5efa Agentic Tactile Data Engine\uff0c\u5728 RoboTwin\u3001DexJoCo \u7b49\u4eff\u771f\u8f68\u8ff9\u56de\u653e\u4e2d\u8865\u5145\u529b\u4f20\u611f\u5668\u89e6\u89c9\u6570\u636e\uff0c\u5e76\u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u9a8c\u8bc1\u6027\u80fd\u63d0\u5347"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89e6\u89c9\u611f\u77e5", "\u4e16\u754c\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21449v1", "published_at": "2026-09-18", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ME-Dex 1.0: Bringing Heterogeneous Tactile Sensing into World Action Modeling", "tldr": "\u7edf\u4e00\u89c6\u89c9\u3001\u89e6\u89c9\u4e0e\u52a8\u4f5c\u7684\u673a\u5668\u4eba\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "ME-Dex-1.0 \u63d0\u51fa\u4e00\u79cd World Action Tactile Model\uff0c\u5c06\u89e6\u89c9\u50cf\u89c6\u9891\u4e00\u6837\u4f5c\u4e3a\u672a\u6765\u4e16\u754c\u72b6\u6001\u5171\u540c\u9884\u6d4b\u3002\u5b83\u8054\u5408\u5efa\u6a21\u89c6\u89c9\u89c2\u6d4b\u3001\u89e6\u89c9\u4fe1\u53f7\u4e0e\u52a8\u4f5c\uff0c\u7528\u4e8e\u63d0\u5347\u673a\u5668\u4eba\u7075\u5de7\u64cd\u4f5c\u751f\u6210\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5f02\u6784\u89e6\u89c9\u611f\u77e5\u7eb3\u5165\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u7684\u8054\u5408\u672a\u6765\u9884\u6d4b\u6846\u67b6\uff0c\u800c\u4e0d\u53ea\u662f\u4f5c\u4e3a\u6761\u4ef6\u8f93\u5165\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u673a\u5668\u4eba\u5728\u63a5\u89e6\u4e30\u5bcc\u4efb\u52a1\u4e2d\u7684\u6cdb\u5316\u4e0e\u64cd\u4f5c\u7a33\u5b9a\u6027\u3002"}, {"abstract": "Frontier language models now produce professional deliverables that expert graders judge to match human work on a substantial share of economically valuable tasks, yet most enterprise GenAI initiatives fail to show a measurable business effect and a large fraction of agentic projects are expected to be cancelled. We argue that this is substantially a measurement problem: public benchmarks answer \"what can the model do?\", whereas a deployment decision requires \"is this workflow fit, reliable, safe and worth scaling - here, on our data, under our controls?\". We present EnterpriseVal, a use-case-level evaluation system that closes this gap. It comprises (i) a formal specification of the use case and of the frozen socio-technical configuration under test, model, prompts, retrieval, tools, guardrails and human oversight, with an autonomy level and consequence tier that jointly set the required evaluation intensity; (ii) a metric catalogue spanning fidelity, utility, efficiency, reliability, assurance and oversight; (iii) a grading protocol that scales blinded expert judgement with calibrated LLM-as-judge scoring through prediction-powered inference; (iv) a two-tier threshold gate, stated as an executable algorithm, that maps metric vectors with confidence bounds to REJECT/CONDITIONAL/SCALE decisions; and (v) a value-and-risk model in which the reviewer catch rate is a measured parameter. We report a pilot across three workflows in a global bank. In credit-memo drafting, human-graded citation precision reached 88% and hallucination rate 1.6% for the best model against gates of 70% and 5%; in procedure transformation, analyst refinement effort fell from an estimated 27.4 to 2.9 hours per document. We separate established results, documented pilot evidence, the proposed system and open hypotheses, and specify the experiments required for full validation", "arxiv_id": "2609.21841", "arxiv_url": "https://arxiv.org/abs/2609.21841", "authors": ["Abbas Raza Ali", "Muhammad Ajmal Siddiqui", "Moona Zahid"], "brief": "\u8bba\u6587\u63d0\u51fa EnterpriseVal\uff0c\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u5177\u4f53\u7528\u4f8b\u7684\u751f\u6210\u5f0fAI\u8bc4\u4f30\u4f53\u7cfb\uff0c\u7528\u6765\u5224\u65ad\u5de5\u4f5c\u6d41\u5728\u771f\u5b9e\u6570\u636e\u3001\u63a7\u5236\u63aa\u65bd\u548c\u4eba\u7c7b\u76d1\u7763\u4e0b\u662f\u5426\u53ef\u9760\u3001\u5b89\u5168\u4e14\u503c\u5f97\u89c4\u6a21\u5316\u3002\u5b83\u5c06\u7528\u4f8b\u914d\u7f6e\u3001\u6307\u6807\u4f53\u7cfb\u3001\u4e13\u5bb6\u4e0eLLM\u8bc4\u5ba1\u3001\u9608\u503c\u51b3\u7b56\u95e8\u548c\u4ef7\u503c\u98ce\u9669\u6a21\u578b\u6574\u5408\u4e3a\u53ef\u6267\u884c\u6d41\u7a0b\u3002", "categories": ["cs.AI", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21841", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u4f30\u5bf9\u8c61\u4e0d\u662f\u5355\u4e00\u6a21\u578b\u80fd\u529b\uff0c\u800c\u662f\u51bb\u7ed3\u540e\u7684\u793e\u4f1a\u6280\u672f\u914d\u7f6e\uff1a\u6a21\u578b\u3001\u63d0\u793a\u8bcd\u3001\u68c0\u7d22\u3001\u5de5\u5177\u3001\u62a4\u680f\u4e0e\u4eba\u5de5\u76d1\u7763\u7b49\u6574\u4f53\u5de5\u4f5c\u6d41\u3002", "\u6307\u6807\u8986\u76d6\u4fdd\u771f\u5ea6\u3001\u6548\u7528\u3001\u6548\u7387\u3001\u53ef\u9760\u6027\u3001\u4fdd\u969c\u4e0e\u76d1\u7763\uff0c\u5e76\u7528\u7f6e\u4fe1\u533a\u95f4\u6620\u5c04\u5230 REJECT/CONDITIONAL/SCALE \u51b3\u7b56\u3002", "\u5728\u5168\u7403\u94f6\u884c\u4e09\u4e2a\u5de5\u4f5c\u6d41\u8bd5\u70b9\u4e2d\uff0c\u4fe1\u7528\u5907\u5fd8\u5f55\u751f\u6210\u7684\u5f15\u7528\u7cbe\u5ea6\u8fbe88%\u3001\u5e7b\u89c9\u73871.6%\uff1b\u6d41\u7a0b\u8f6c\u6362\u4efb\u52a1\u7684\u4eba\u5de5\u7ec6\u5316\u65f6\u95f4\u4ece\u7ea627.4\u5c0f\u65f6\u964d\u81f32.9\u5c0f\u65f6\u3002"], "keywords": ["\u4f01\u4e1aAI", "\u8bc4\u4f30\u57fa\u51c6", "\u667a\u80fd\u4f53", "\u53ef\u9760\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21841v1", "published_at": "2026-09-18", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "EnterpriseVal: Quantifying the Efficacy, Reliability and Value of Generative AI in the Enterprise", "tldr": "\u4f01\u4e1a\u7ea7\u751f\u6210\u5f0fAI\u90e8\u7f72\u8bc4\u4f30\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa EnterpriseVal\uff0c\u4e00\u4e2a\u9762\u5411\u4f01\u4e1a\u5177\u4f53\u7528\u4f8b\u7684\u751f\u6210\u5f0fAI\u8bc4\u4f30\u4f53\u7cfb\uff0c\u7528\u6765\u5224\u65ad\u5de5\u4f5c\u6d41\u5728\u771f\u5b9e\u6570\u636e\u3001\u63a7\u5236\u63aa\u65bd\u548c\u4eba\u7c7b\u76d1\u7763\u4e0b\u662f\u5426\u53ef\u9760\u3001\u5b89\u5168\u4e14\u503c\u5f97\u89c4\u6a21\u5316\u3002\u5b83\u5c06\u7528\u4f8b\u914d\u7f6e\u3001\u6307\u6807\u4f53\u7cfb\u3001\u4e13\u5bb6\u4e0eLLM\u8bc4\u5ba1\u3001\u9608\u503c\u51b3\u7b56\u95e8\u548c\u4ef7\u503c\u98ce\u9669\u6a21\u578b\u6574\u5408\u4e3a\u53ef\u6267\u884c\u6d41\u7a0b\u3002", "why_notable": "\u5b83\u76f4\u6307\u4f01\u4e1aGenAI\u843d\u5730\u4e2d\u201c\u65e0\u6cd5\u91cf\u5316\u4e1a\u52a1\u4ef7\u503c\u4e0e\u98ce\u9669\u201d\u7684\u6838\u5fc3\u75db\u70b9\uff0c\u628a\u516c\u5f00\u57fa\u51c6\u8f6c\u5316\u4e3a\u9762\u5411\u771f\u5b9e\u90e8\u7f72\u7684\u6cbb\u7406\u3001\u53ef\u9760\u6027\u548c\u6295\u8d44\u51b3\u7b56\u6846\u67b6\uff0c\u5bf9\u4f01\u4e1aAI\u8bc4\u4f30\u548c\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u89c4\u6a21\u5316\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Privacy leakage in LLM agents is commonly evaluated within individual components such as memory, retrieval, or tool-use pipelines, which makes it difficult to distinguish internal exposure from information that an external observer can actually recover. We present CIPL (Channel Inversion for Privacy Leakage), a channel-aware evaluation framework for black-box privacy leakage in LLM agents. CIPL represents a target through sensitive source, selection, assembly, execution, observation, and extraction stages and evaluates the transition from selected sensitive units to attacker-recoverable output under a shared protocol. Experiments across memory-based, retrieval-mediated, and tool-mediated targets, together with a BrowserUse live-agent case study, show that storage labels alone do not determine recoverability. Memory targets form a near-saturated reference case, retrieval-mediated leakage is frequently partial, and tool-mediated and live-agent leakage varies strongly with observation surface, prompt-to-channel alignment, retrieval depth, and provider behavior. A stratified semantic audit further identifies attacker-useful disclosures that canonical exact matching misses. CIPL therefore provides a common framework for comparing how internal sensitive dependence is realized as externally recoverable leakage across heterogeneous agent pipelines.", "arxiv_id": "2609.21686", "arxiv_url": "https://arxiv.org/abs/2609.21686", "authors": ["Tao Huang", "Guosen Wu", "Guolong Zheng", "Jiayang Meng", "Chen Hou", "Xu Yang", "Xuechao Yang", "Feng Xia"], "brief": "\u8bba\u6587\u63d0\u51fa CIPL\uff08Channel Inversion for Privacy Leakage\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u9ed1\u76d2 LLM \u667a\u80fd\u4f53\u7684\u901a\u9053\u611f\u77e5\u9690\u79c1\u6cc4\u6f0f\u8bc4\u4f30\u6846\u67b6\u3002\u5b83\u5c06\u654f\u611f\u4fe1\u606f\u4ece\u6765\u6e90\u3001\u9009\u62e9\u3001\u7ec4\u88c5\u3001\u6267\u884c\u3001\u89c2\u5bdf\u5230\u62bd\u53d6\u7684\u94fe\u8def\u7edf\u4e00\u5efa\u6a21\uff0c\u8861\u91cf\u5916\u90e8\u653b\u51fb\u8005\u5b9e\u9645\u53ef\u6062\u590d\u7684\u4fe1\u606f\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21686", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6\u8bb0\u5fc6\u3001\u68c0\u7d22\u3001\u5de5\u5177\u8c03\u7528\u548c BrowserUse \u5b9e\u65f6\u667a\u80fd\u4f53\u7b49\u591a\u7c7b\u6cc4\u6f0f\u573a\u666f\uff0c\u533a\u5206\u5185\u90e8\u654f\u611f\u4f9d\u8d56\u4e0e\u5916\u90e8\u53ef\u6062\u590d\u6cc4\u6f0f", "\u5b9e\u9a8c\u53d1\u73b0\u5b58\u50a8\u6807\u7b7e\u5e76\u4e0d\u80fd\u51b3\u5b9a\u6cc4\u6f0f\u53ef\u6062\u590d\u6027\uff1a\u8bb0\u5fc6\u578b\u76ee\u6807\u63a5\u8fd1\u9971\u548c\u6cc4\u6f0f\uff0c\u68c0\u7d22\u578b\u5e38\u4e3a\u90e8\u5206\u6cc4\u6f0f\uff0c\u5de5\u5177\u578b\u9ad8\u5ea6\u4f9d\u8d56\u89c2\u5bdf\u9762\u548c\u63d0\u4f9b\u5546\u884c\u4e3a", "\u5f15\u5165\u5206\u5c42\u8bed\u4e49\u5ba1\u8ba1\uff0c\u80fd\u53d1\u73b0\u7cbe\u786e\u5339\u914d\u6307\u6807\u9057\u6f0f\u7684\u3001\u5bf9\u653b\u51fb\u8005\u4ecd\u6709\u7528\u7684\u8bed\u4e49\u6cc4\u9732"], "keywords": ["\u667a\u80fd\u4f53", "\u9690\u79c1\u5b89\u5168", "\u5de5\u5177\u8c03\u7528", "\u68c0\u7d22\u589e\u5f3a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21686v1", "published_at": "2026-09-18", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CIPL: A Channel-Aware Framework for Recoverable Privacy Leakage in LLM Agents", "tldr": "\u8bc4\u4f30LLM\u667a\u80fd\u4f53\u53ef\u6062\u590d\u9690\u79c1\u6cc4\u6f0f\u7684\u65b0\u6846\u67b6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa CIPL\uff08Channel Inversion for Privacy Leakage\uff09\uff0c\u4e00\u4e2a\u9762\u5411\u9ed1\u76d2 LLM \u667a\u80fd\u4f53\u7684\u901a\u9053\u611f\u77e5\u9690\u79c1\u6cc4\u6f0f\u8bc4\u4f30\u6846\u67b6\u3002\u5b83\u5c06\u654f\u611f\u4fe1\u606f\u4ece\u6765\u6e90\u3001\u9009\u62e9\u3001\u7ec4\u88c5\u3001\u6267\u884c\u3001\u89c2\u5bdf\u5230\u62bd\u53d6\u7684\u94fe\u8def\u7edf\u4e00\u5efa\u6a21\uff0c\u8861\u91cf\u5916\u90e8\u653b\u51fb\u8005\u5b9e\u9645\u53ef\u6062\u590d\u7684\u4fe1\u606f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u5f02\u6784 LLM \u667a\u80fd\u4f53\u7ba1\u7ebf\u63d0\u4f9b\u4e86\u7edf\u4e00\u7684\u9690\u79c1\u6cc4\u6f0f\u8bc4\u4f30\u534f\u8bae\uff0c\u5f3a\u8c03\u201c\u653b\u51fb\u8005\u80fd\u5426\u6062\u590d\u201d\u800c\u975e\u4ec5\u770b\u5185\u90e8\u662f\u5426\u63a5\u89e6\u654f\u611f\u4fe1\u606f\uff0c\u5bf9\u667a\u80fd\u4f53\u5b89\u5168\u5ba1\u8ba1\u548c\u9690\u79c1\u9632\u62a4\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Agentic marketplaces are emerging where AI agents with varying capabilities autonomously complete specialized tasks for buyers. A major challenge of such marketplaces is that buyers cannot easily determine which agent will perform best on their tasks. Reported benchmark scores may be difficult to verify or compare across tasks, software, and budgets. We introduce LEGIT, a credentialing protocol connecting certification, reputation, and proposed marketplace allocation. Certification binds measured quality and cost per solved task to an agent configuration, task domain, evaluation budget, and evidence through a signed record. Reputation links records of past task outcomes to the same identity, subject to the reliability of the reported feedback. Buyers and agents can verify credential records and inspect optional visual profiles. Evaluations reveal cost differences between agent configurations with similar observed task success, and show that comparisons depend on the evaluation budget. These results support binding performance measurements to the tested configuration and resource limits. A complementary analysis quantifies the deposits and fees required for reputation manipulation under a stated Sybil attack model.", "arxiv_id": "2609.21325", "arxiv_url": "https://arxiv.org/abs/2609.21325", "authors": ["Steve Drew", "Jiayu Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa LEGIT\uff0c\u4e00\u79cd\u9762\u5411 AI \u667a\u80fd\u4f53\u5e02\u573a\u7684\u51ed\u8bc1\u534f\u8bae\uff0c\u5c06\u6027\u80fd\u8ba4\u8bc1\u3001\u5386\u53f2\u58f0\u8a89\u4e0e\u5e02\u573a\u5206\u914d\u673a\u5236\u8fde\u63a5\u8d77\u6765\u3002\u5b83\u628a\u4efb\u52a1\u6210\u529f\u7387\u3001\u6210\u672c\u3001\u667a\u80fd\u4f53\u914d\u7f6e\u3001\u4efb\u52a1\u57df\u3001\u8bc4\u6d4b\u9884\u7b97\u548c\u8bc1\u636e\u7ed1\u5b9a\u5230\u53ef\u9a8c\u8bc1\u7684\u7b7e\u540d\u8bb0\u5f55\u4e2d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21325", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8ba4\u8bc1\u8bb0\u5f55\u660e\u786e\u7ed1\u5b9a\u667a\u80fd\u4f53\u914d\u7f6e\u3001\u4efb\u52a1\u9886\u57df\u3001\u8bc4\u6d4b\u9884\u7b97\u3001\u5355\u4f4d\u89e3\u9898\u6210\u672c\u4e0e\u8bc1\u636e\uff0c\u907f\u514d\u7b3c\u7edf benchmark \u5206\u6570\u96be\u4ee5\u6bd4\u8f83\u7684\u95ee\u9898", "\u58f0\u8a89\u673a\u5236\u5c06\u5386\u53f2\u4efb\u52a1\u7ed3\u679c\u5173\u8054\u5230\u540c\u4e00\u8eab\u4efd\uff0c\u5e76\u8003\u8651\u53cd\u9988\u53ef\u9760\u6027\uff0c\u652f\u6301\u4e70\u5bb6\u548c\u667a\u80fd\u4f53\u9a8c\u8bc1\u51ed\u8bc1\u8bb0\u5f55", "\u5b9e\u9a8c\u663e\u793a\u76f8\u8fd1\u6210\u529f\u7387\u7684\u4e0d\u540c\u667a\u80fd\u4f53\u914d\u7f6e\u53ef\u80fd\u6210\u672c\u5dee\u5f02\u660e\u663e\uff0c\u4e14\u6bd4\u8f83\u7ed3\u679c\u4f1a\u968f\u8bc4\u6d4b\u9884\u7b97\u53d8\u5316"], "keywords": ["\u667a\u80fd\u4f53", "\u53ef\u4fe1AI", "\u58f0\u8a89\u673a\u5236", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21325v1", "published_at": "2026-09-18", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "LEGIT: Credentialing Protocol for Trustworthy AI Agent Marketplaces", "tldr": "\u4e3aAI\u667a\u80fd\u4f53\u5e02\u573a\u5efa\u7acb\u53ef\u4fe1\u8ba4\u8bc1\u4e0e\u58f0\u8a89\u534f\u8bae", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa LEGIT\uff0c\u4e00\u79cd\u9762\u5411 AI \u667a\u80fd\u4f53\u5e02\u573a\u7684\u51ed\u8bc1\u534f\u8bae\uff0c\u5c06\u6027\u80fd\u8ba4\u8bc1\u3001\u5386\u53f2\u58f0\u8a89\u4e0e\u5e02\u573a\u5206\u914d\u673a\u5236\u8fde\u63a5\u8d77\u6765\u3002\u5b83\u628a\u4efb\u52a1\u6210\u529f\u7387\u3001\u6210\u672c\u3001\u667a\u80fd\u4f53\u914d\u7f6e\u3001\u4efb\u52a1\u57df\u3001\u8bc4\u6d4b\u9884\u7b97\u548c\u8bc1\u636e\u7ed1\u5b9a\u5230\u53ef\u9a8c\u8bc1\u7684\u7b7e\u540d\u8bb0\u5f55\u4e2d\u3002", "why_notable": "\u968f\u7740\u667a\u80fd\u4f53\u5e02\u573a\u5174\u8d77\uff0c\u5982\u4f55\u53ef\u4fe1\u5730\u9009\u62e9\u3001\u6bd4\u8f83\u548c\u6fc0\u52b1\u667a\u80fd\u4f53\u6210\u4e3a\u5173\u952e\u95ee\u9898\u3002LEGIT \u5c06\u6027\u80fd\u3001\u6210\u672c\u3001\u914d\u7f6e\u548c\u58f0\u8a89\u5236\u5ea6\u5316\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u5e02\u573a\u900f\u660e\u5ea6\uff0c\u5e76\u5bf9\u6297\u58f0\u8a89\u64cd\u7eb5\u548c Sybil \u653b\u51fb\u3002"}, {"abstract": "Production LLM agents are evaluated repeatedly as they evolve, but full agent benchmarks are costly to rerun. We study efficient recurring evaluation for a production analytics agent serving tens of thousands of monthly active users and report first-hand deployment experience. Using 574 historical runs of the production benchmark, split chronologically into calibration and held-out periods, we compare random sampling, historical caching, fixed representative subsets, and IRT-based adaptive testing. The results show that multidimensional 2PL adaptive testing achieves the best overall score fidelity: executing 200 questions, 38.5% of a full run, yields 1.03 pp of MAE. We nevertheless deployed difficulty-stratified fixed subsets because of their operational simplicity, and show they transfer without recalibration to five other agent families and remain stable across calibration windows as short as one day. Drawing on this deployment experience, we report practical recommendations for recurring production-agent evaluation.", "arxiv_id": "2609.21267", "arxiv_url": "https://arxiv.org/abs/2609.21267", "authors": ["Yining She", "Lei Lin"], "brief": "\u672c\u6587\u7814\u7a76\u751f\u4ea7\u73af\u5883\u4e2d\u4e0d\u65ad\u8fed\u4ee3\u7684LLM\u5206\u6790\u667a\u80fd\u4f53\u5982\u4f55\u4f4e\u6210\u672c\u91cd\u590d\u8bc4\u6d4b\u3002\u4f5c\u8005\u57fa\u4e8e574\u6b21\u5386\u53f2\u57fa\u51c6\u8fd0\u884c\uff0c\u5bf9\u6bd4\u968f\u673a\u91c7\u6837\u3001\u5386\u53f2\u7f13\u5b58\u3001\u56fa\u5b9a\u4ee3\u8868\u5b50\u96c6\u548c\u57fa\u4e8eIRT\u7684\u81ea\u9002\u5e94\u6d4b\u8bd5\uff0c\u5e76\u603b\u7ed3\u771f\u5b9e\u90e8\u7f72\u7ecf\u9a8c\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21267", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u591a\u7ef42PL IRT\u81ea\u9002\u5e94\u6d4b\u8bd5\u5728\u5206\u6570\u4fdd\u771f\u5ea6\u4e0a\u6700\u4f73\uff1a\u4ec5\u6267\u884c200\u9898\u3001\u7ea638.5%\u5b8c\u6574\u8bc4\u6d4b\uff0c\u5373\u53ef\u8fbe\u52301.03\u4e2a\u767e\u5206\u70b9MAE\u3002", "\u5c3d\u7ba1\u7406\u8bba\u6548\u679c\u66f4\u597d\uff0c\u56e2\u961f\u5b9e\u9645\u90e8\u7f72\u4e86\u6309\u96be\u5ea6\u5206\u5c42\u7684\u56fa\u5b9a\u5b50\u96c6\uff0c\u56e0\u4e3a\u5176\u8fd0\u7ef4\u7b80\u5355\u3001\u53ef\u89e3\u91ca\u4e14\u6613\u96c6\u6210\u3002", "\u96be\u5ea6\u5206\u5c42\u56fa\u5b9a\u5b50\u96c6\u65e0\u9700\u91cd\u65b0\u6821\u51c6\u5373\u53ef\u8fc1\u79fb\u5230\u53e6\u59165\u4e2a\u667a\u80fd\u4f53\u5bb6\u65cf\uff0c\u5e76\u4e14\u5728\u77ed\u81f3\u4e00\u5929\u7684\u6821\u51c6\u7a97\u53e3\u4e0b\u4ecd\u4fdd\u6301\u7a33\u5b9a\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u751f\u4ea7\u90e8\u7f72", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21267v1", "published_at": "2026-09-18", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Efficient Benchmarking in Production: A Study of an Evolving LLM Agent", "tldr": "\u751f\u4ea7LLM\u667a\u80fd\u4f53\u53ef\u7528\u5c0f\u6837\u672c\u9ad8\u6548\u56de\u5f52\u8bc4\u6d4b", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u751f\u4ea7\u73af\u5883\u4e2d\u4e0d\u65ad\u8fed\u4ee3\u7684LLM\u5206\u6790\u667a\u80fd\u4f53\u5982\u4f55\u4f4e\u6210\u672c\u91cd\u590d\u8bc4\u6d4b\u3002\u4f5c\u8005\u57fa\u4e8e574\u6b21\u5386\u53f2\u57fa\u51c6\u8fd0\u884c\uff0c\u5bf9\u6bd4\u968f\u673a\u91c7\u6837\u3001\u5386\u53f2\u7f13\u5b58\u3001\u56fa\u5b9a\u4ee3\u8868\u5b50\u96c6\u548c\u57fa\u4e8eIRT\u7684\u81ea\u9002\u5e94\u6d4b\u8bd5\uff0c\u5e76\u603b\u7ed3\u771f\u5b9e\u90e8\u7f72\u7ecf\u9a8c\u3002", "why_notable": "\u8bba\u6587\u5173\u6ce8\u771f\u5b9e\u751f\u4ea7LLM\u667a\u80fd\u4f53\u7684\u6301\u7eed\u8bc4\u6d4b\u6210\u672c\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u6765\u81ea\u5927\u89c4\u6a21\u6708\u6d3b\u4ea7\u54c1\u7684\u5b9e\u8bc1\u6570\u636e\u4e0e\u90e8\u7f72\u53d6\u820d\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u7684\u667a\u80fd\u4f53\u8bc4\u6d4b\u6d41\u6c34\u7ebf\u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Background: Just-in-time adaptive interventions (JITAIs) can use behavioral data to adapt support to changing contexts, but many rely on predefined rules and manual configuration. Objective: We developed a proof-of-concept sleep JITAI using an AI agent to review personal data, evaluate reminders, adapt interventions, and record decisions for human review. Methods: Running in Home Assistant on a configurable schedule, the agent follows a reusable skill file to review 30 days of sleep and behavioral data, including physical activity, smartphone use, and bedtime routines, to identify patterns and create or update automated reminders. Results: Initial runs demonstrated technical feasibility, successfully completing data review and intervention decisions while limiting reminders to three per day and saving decision records. Conclusions: Agentic AI may enable flexible, adaptive sleep JITAIs. The architecture supports future comparison with fixed or rulebased interventions, requires human oversight, and could extend to other health behaviors.", "arxiv_id": "2609.21805", "arxiv_url": "https://arxiv.org/abs/2609.21805", "authors": ["Nick Rezaee", "Chelsea Boccagno"], "brief": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u7761\u7720\u652f\u6301\u7684\u6982\u5ff5\u9a8c\u8bc1\u578bJITAI\u7cfb\u7edf\u3002\u7cfb\u7edf\u5728Home Assistant\u4e2d\u8fd0\u884c\uff0c\u7531AI\u667a\u80fd\u4f53\u5206\u6790\u4e2a\u4eba\u7761\u7720\u3001\u6d3b\u52a8\u3001\u624b\u673a\u4f7f\u7528\u548c\u7761\u524d\u884c\u4e3a\u6570\u636e\uff0c\u751f\u6210\u6216\u66f4\u65b0\u81ea\u52a8\u5316\u63d0\u9192\uff0c\u5e76\u8bb0\u5f55\u51b3\u7b56\u4f9b\u4eba\u5de5\u5ba1\u9605\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21805", "impact_score": 5, "is_agent": true, "is_top": true, "key_points": ["\u667a\u80fd\u4f53\u57fa\u4e8e\u53ef\u590d\u7528\u7684skill\u6587\u4ef6\uff0c\u6309\u914d\u7f6e\u65e5\u7a0b\u56de\u987e\u8fd130\u5929\u4e2a\u4eba\u884c\u4e3a\u4e0e\u7761\u7720\u6570\u636e", "\u7cfb\u7edf\u53ef\u8bc6\u522b\u884c\u4e3a\u6a21\u5f0f\u5e76\u8c03\u6574\u63d0\u9192\u7b56\u7565\uff0c\u540c\u65f6\u9650\u5236\u6bcf\u5929\u6700\u591a3\u6761\u63d0\u9192\u4ee5\u907f\u514d\u6253\u6270", "\u521d\u6b65N-of-1\u8fd0\u884c\u9a8c\u8bc1\u4e86\u6570\u636e\u5ba1\u67e5\u3001\u5e72\u9884\u51b3\u7b56\u548c\u51b3\u7b56\u8bb0\u5f55\u4fdd\u5b58\u7684\u6280\u672f\u53ef\u884c\u6027"], "keywords": ["\u667a\u80fd\u4f53", "\u6570\u5b57\u5065\u5eb7", "\u4e2a\u6027\u5316\u5e72\u9884", "\u4eba\u673a\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21805v1", "published_at": "2026-09-18", "score": 0.275, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "An Agentic Just-in-Time Adaptive Intervention System for Personalized Sleep Support: Proof-of-Concept Study with N of 1 Data", "tldr": "\u7528AI\u667a\u80fd\u4f53\u52a8\u6001\u5b9a\u5236\u7761\u7720\u5e72\u9884\u63d0\u9192", "upvotes": 0, "what_it_is": "\u672c\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u9762\u5411\u4e2a\u6027\u5316\u7761\u7720\u652f\u6301\u7684\u6982\u5ff5\u9a8c\u8bc1\u578bJITAI\u7cfb\u7edf\u3002\u7cfb\u7edf\u5728Home Assistant\u4e2d\u8fd0\u884c\uff0c\u7531AI\u667a\u80fd\u4f53\u5206\u6790\u4e2a\u4eba\u7761\u7720\u3001\u6d3b\u52a8\u3001\u624b\u673a\u4f7f\u7528\u548c\u7761\u524d\u884c\u4e3a\u6570\u636e\uff0c\u751f\u6210\u6216\u66f4\u65b0\u81ea\u52a8\u5316\u63d0\u9192\uff0c\u5e76\u8bb0\u5f55\u51b3\u7b56\u4f9b\u4eba\u5de5\u5ba1\u9605\u3002", "why_notable": "\u76f8\u6bd4\u4f9d\u8d56\u56fa\u5b9a\u89c4\u5219\u548c\u4eba\u5de5\u914d\u7f6e\u7684\u4f20\u7edfJITAI\uff0c\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u7528AI\u667a\u80fd\u4f53\u5b9e\u73b0\u66f4\u7075\u6d3b\u3001\u53ef\u5ba1\u8ba1\u3001\u53ef\u6269\u5c55\u7684\u5065\u5eb7\u884c\u4e3a\u5e72\u9884\u7684\u53ef\u80fd\u6027\uff0c\u53ef\u4e3a\u7761\u7720\u7ba1\u7406\u53ca\u5176\u4ed6\u6570\u5b57\u5065\u5eb7\u573a\u666f\u63d0\u4f9b\u539f\u578b\u53c2\u8003\u3002"}, {"abstract": "Skills can improve the performance of Large Language Model (LLM) agents by providing task-specific procedural guidance, while skill optimization further improves their effectiveness through iterative refinement. However, existing skill optimization methods typically represent skills as unstructured natural-language instructions, creating two key challenges: 1) Unstructured skills often lack explicit workflow-level guidance and contain substantial redundancy, making them difficult for LLMs to execute; 2) the vast search space of unconstrained natural-language skills makes skill optimization ineffective. To address these challenges, we propose representing skills as graph-structured natural-language artifacts. In graph-structured skills, each node represents an execution step together with its operational guidance, while directed edges encode context-dependent transitions between steps. Compared to unstructured skills, graph-structured skills can provide clear workflow-level guidance. Moreover, the proposed graph-structured skill can also facilitate skill optimization. Building on this structured representation, we introduce GraphSkillEvo, a population-based evolutionary optimization framework with mutation and crossover operators for graph-structured skills. By maintaining multiple candidate skills and combining effective components, GraphSkillEvo enables broader and more comprehensive exploration of the structured skill space than purely LLM-based iterative self-refinement. Extensive experiments across five agent benchmarks demonstrate that GraphSkillEvo consistently outperforms the strong skill optimization baseline SkillOpt, improving average accuracy by 4.01% on GPT-5.4-nano and 1.76% on GPT-5.4. Our code is available at https://github.com/ruisun7/GraphSkillEvo.", "arxiv_id": "2609.21749", "arxiv_url": "https://arxiv.org/abs/2609.21749", "authors": ["Rui Sun", "Zhi Zheng", "Zhenkun Wang", "Zhichao Lu"], "brief": "\u8bba\u6587\u63d0\u51fa\u5c06\u667a\u80fd\u4f53\u6280\u80fd\u8868\u793a\u4e3a\u56fe\u7ed3\u6784\u81ea\u7136\u8bed\u8a00\u5de5\u4ef6\uff1a\u8282\u70b9\u662f\u6267\u884c\u6b65\u9aa4\u4e0e\u64cd\u4f5c\u6307\u5bfc\uff0c\u8fb9\u8868\u793a\u6761\u4ef6\u5316\u6d41\u7a0b\u8f6c\u79fb\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u6784\u5efa GraphSkillEvo\uff0c\u7528\u7fa4\u4f53\u8fdb\u5316\u3001\u53d8\u5f02\u4e0e\u4ea4\u53c9\u6765\u4f18\u5316\u6280\u80fd\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21749", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u56fe\u7ed3\u6784\u6280\u80fd\u76f8\u6bd4\u975e\u7ed3\u6784\u5316\u6307\u4ee4\u63d0\u4f9b\u66f4\u6e05\u6670\u7684\u5de5\u4f5c\u6d41\u7ea7\u6307\u5bfc\uff0c\u5e76\u51cf\u5c11\u5197\u4f59\u3002", "GraphSkillEvo \u7ef4\u62a4\u591a\u4e2a\u5019\u9009\u6280\u80fd\uff0c\u901a\u8fc7\u53d8\u5f02\u548c\u4ea4\u53c9\u7ec4\u5408\u6709\u6548\u7ec4\u4ef6\uff0c\u6269\u5927\u7ed3\u6784\u5316\u6280\u80fd\u7a7a\u95f4\u641c\u7d22\u3002", "\u5728\u4e94\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u8d85\u8fc7 SkillOpt\uff0cGPT-5.4-nano \u5e73\u5747\u51c6\u786e\u7387\u63d0\u5347 4.01%\uff0cGPT-5.4 \u63d0\u5347 1.76%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u6280\u80fd\u4f18\u5316", "\u8fdb\u5316\u7b97\u6cd5", "\u5de5\u4f5c\u6d41"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21749v1", "published_at": "2026-09-18", "score": 0.223, "selected_reasons": ["HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.21749.png", "title": "GraphSkillEvo: Evolutionary Optimization of Graph-Structured Agent Skills", "tldr": "\u7528\u56fe\u7ed3\u6784\u8fdb\u5316\u4f18\u5316LLM\u667a\u80fd\u4f53\u6280\u80fd", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5c06\u667a\u80fd\u4f53\u6280\u80fd\u8868\u793a\u4e3a\u56fe\u7ed3\u6784\u81ea\u7136\u8bed\u8a00\u5de5\u4ef6\uff1a\u8282\u70b9\u662f\u6267\u884c\u6b65\u9aa4\u4e0e\u64cd\u4f5c\u6307\u5bfc\uff0c\u8fb9\u8868\u793a\u6761\u4ef6\u5316\u6d41\u7a0b\u8f6c\u79fb\u3002\u5728\u6b64\u57fa\u7840\u4e0a\u6784\u5efa GraphSkillEvo\uff0c\u7528\u7fa4\u4f53\u8fdb\u5316\u3001\u53d8\u5f02\u4e0e\u4ea4\u53c9\u6765\u4f18\u5316\u6280\u80fd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6280\u80fd\u4f18\u5316\u4ece\u81ea\u7531\u6587\u672c\u641c\u7d22\u8f6c\u4e3a\u7ed3\u6784\u5316\u56fe\u641c\u7d22\uff0c\u63d0\u5347\u4e86\u53ef\u6267\u884c\u6027\u4e0e\u53ef\u4f18\u5316\u6027\uff0c\u5bf9\u6784\u5efa\u66f4\u53ef\u9760\u7684 LLM agent \u5de5\u4f5c\u6d41\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "A pretrained robot foundation policy may execute most of a long-horizon task yet repeatedly fail at a few critical subtasks. Collecting additional full-task demonstrations for supervised fine-tuning (SFT) requires operators to repeat behaviors the policy already performs well. Reinforcement learning (RL) fine-tuning offers a promising path to bridge this gap, but existing approaches struggle to solve long-horizon tasks using only sparse rewards. We present PARTS (Policy Adaptation with RL on Targeted Subtasks), a real-world subtask RL framework that concentrates practice at these bottlenecks while allowing training rollouts to proceed with minimal human intervention. The frozen pretrained policy supplies nominal actions throughout execution, while agent-generated selectors and success verifiers activate residual corrections and provide local outcome rewards. These rewards support learning from successful subtasks even when complete-task successes are scarce. Training combines online RL with success-reweighted retraining, and each retrained residual policy is redeployed to collect further experience. Humans identify bottlenecks during setup and perform physical resets when needed. On bimanual YAM and single-arm Franka tasks, PARTS improves complete-task success from 32% to 61% and from 50% to 95%, respectively, using tens of minutes of real-world RL rollouts per task on average. Compared with existing real-world RL fine-tuning methods, PARTS raises full-task success by more than 25% under the same robot-rollout budget while requiring less human involvement.", "arxiv_id": "2609.21788", "arxiv_url": "https://arxiv.org/abs/2609.21788", "authors": ["Sichang Su", "Benjamin Yang", "Zhiyun Deng", "Boyuan Liang", "Yip Fun Yeung", "Zelin Wang", "Lingfeng Sun"], "brief": "\u8bba\u6587\u63d0\u51fa PARTS\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u7684\u771f\u5b9e\u4e16\u754c\u5b50\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5728\u51bb\u7ed3\u9884\u8bad\u7ec3\u673a\u5668\u4eba\u57fa\u7840\u7b56\u7565\u7684\u57fa\u7840\u4e0a\uff0c\u53ea\u9488\u5bf9\u6613\u5931\u8d25\u7684\u5173\u952e\u5b50\u4efb\u52a1\u5b66\u4e60\u6b8b\u5dee\u4fee\u6b63\uff0c\u5e76\u7528\u5c40\u90e8\u6210\u529f\u5956\u52b1\u63d0\u5347\u6574\u4f53\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21788", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u4eba\u5de5\u5728\u521d\u59cb\u5316\u9636\u6bb5\u6807\u8bb0\u74f6\u9888\u5b50\u4efb\u52a1\uff0c\u8bad\u7ec3\u65f6\u65e0\u9700\u53cd\u590d\u91c7\u96c6\u5b8c\u6574\u4efb\u52a1\u793a\u8303\uff0c\u663e\u8457\u51cf\u5c11\u4eba\u5de5\u5e72\u9884\u3002", "\u4f7f\u7528\u9009\u62e9\u5668\u4e0e\u6210\u529f\u9a8c\u8bc1\u5668\u5728\u5173\u952e\u5b50\u4efb\u52a1\u5904\u6fc0\u6d3b\u6b8b\u5dee\u7b56\u7565\uff0c\u5e76\u63d0\u4f9b\u5c40\u90e8\u7ed3\u679c\u5956\u52b1\uff0c\u4f7f\u7a00\u758f\u5b8c\u6574\u4efb\u52a1\u6210\u529f\u8f83\u5c11\u65f6\u4ecd\u80fd\u5b66\u4e60\u3002", "\u5728\u53cc\u81c2 YAM \u4e0e\u5355\u81c2 Franka \u4efb\u52a1\u4e0a\uff0c\u5b8c\u6574\u4efb\u52a1\u6210\u529f\u7387\u5206\u522b\u4ece 32% \u63d0\u5347\u5230 61%\u3001\u4ece 50% \u63d0\u5347\u5230 95%\uff0c\u5e73\u5747\u6bcf\u4efb\u52a1\u4ec5\u9700\u6570\u5341\u5206\u949f\u771f\u5b9e\u673a\u5668\u4ebaRL\u4ea4\u4e92\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u7a0b\u64cd\u4f5c", "\u7b56\u7565\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21788v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "From Pretraining to Proficiency: Real-World Subtask RL for Long-Horizon Manipulation with Minimal Human Intervention", "tldr": "\u9488\u5bf9\u74f6\u9888\u5b50\u4efb\u52a1\u8fdb\u884c\u771f\u5b9e\u673a\u5668\u4ebaRL\u5fae\u8c03", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa PARTS\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u7684\u771f\u5b9e\u4e16\u754c\u5b50\u4efb\u52a1\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u5728\u51bb\u7ed3\u9884\u8bad\u7ec3\u673a\u5668\u4eba\u57fa\u7840\u7b56\u7565\u7684\u57fa\u7840\u4e0a\uff0c\u53ea\u9488\u5bf9\u6613\u5931\u8d25\u7684\u5173\u952e\u5b50\u4efb\u52a1\u5b66\u4e60\u6b8b\u5dee\u4fee\u6b63\uff0c\u5e76\u7528\u5c40\u90e8\u6210\u529f\u5956\u52b1\u63d0\u5347\u6574\u4f53\u4efb\u52a1\u6210\u529f\u7387\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u957f\u7a0b\u673a\u5668\u4eba\u64cd\u4f5c\u4e2d\u7684\u96be\u70b9\u4ece\u201c\u5168\u4efb\u52a1\u7a00\u758f\u5956\u52b1\u5b66\u4e60\u201d\u8f6c\u5316\u4e3a\u201c\u74f6\u9888\u5b50\u4efb\u52a1\u5b9a\u5411\u7ec3\u4e60\u201d\uff0c\u5728\u771f\u5b9e\u673a\u5668\u4eba\u4e0a\u4ee5\u8f83\u4f4e\u4ea4\u4e92\u6210\u672c\u548c\u66f4\u5c11\u4eba\u5de5\u4ecb\u5165\u83b7\u5f97\u663e\u8457\u6536\u76ca\uff0c\u5bf9\u9884\u8bad\u7ec3\u673a\u5668\u4eba\u7b56\u7565\u7684\u843d\u5730\u5fae\u8c03\u5f88\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "LLM-based multi-agent systems generate collaboration traces that record how agents plan tasks, verify intermediate results, and repair failures. Reusing these procedures requires preserving an action\u0027s prerequisites and the outputs needed by subsequent agents. Our empirical studies show that grouping these dependencies into functional memory units improves their retention, while connecting units increases retrieval of the units and links jointly required by a task. The preferred combination of units also changes between instructions and checklists, even when each combination\u0027s content is fixed across formats. Updating choices from the outcomes of each combination and format pairing outperforms scoring combinations and formats separately. These findings motivate MACE, a memory-agent co-evolution framework that adapts memory organization and agent memory use through execution feedback. Its MemGoG structure represents functional units as subgraphs of related conditions, actions, and outputs, connecting them through support, conflict, and repair relations. MACE Loop selects task-relevant units and relations within a memory budget and provides each agent with instructions or checklists for its current operation. It records the selected units, presentation formats, agent outputs, and task outcomes to update unit scores and relations for retrieval and inform subsequent presentation choices. Across eight benchmarks, MACE outperforms ten baselines with an average score of 81.11%, compared with 78.97% for the strongest baseline, SAGE.", "arxiv_id": "2609.21533", "arxiv_url": "https://arxiv.org/abs/2609.21533", "authors": ["Kairui Yang", "Minghao An", "Xunkai Li", "Ziheng Yi", "Zekai Chen", "Guangyuan He", "Rong-Hua Li"], "brief": "\u8bba\u6587\u63d0\u51fa MACE\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u8bb0\u5fc6\u2014\u667a\u80fd\u4f53\u534f\u540c\u6f14\u5316\u6846\u67b6\u3002\u5b83\u5c06\u534f\u4f5c\u8f68\u8ff9\u4e2d\u7684\u6761\u4ef6\u3001\u52a8\u4f5c\u3001\u8f93\u51fa\u7ec4\u7ec7\u4e3a\u529f\u80fd\u6027\u8bb0\u5fc6\u5b50\u56fe\uff0c\u5e76\u6839\u636e\u6267\u884c\u53cd\u9988\u52a8\u6001\u9009\u62e9\u8bb0\u5fc6\u5355\u5143\u3001\u5173\u7cfb\u548c\u5448\u73b0\u683c\u5f0f\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21533", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa MemGoG \u7ed3\u6784\uff0c\u5c06\u524d\u7f6e\u6761\u4ef6\u3001\u52a8\u4f5c\u4e0e\u8f93\u51fa\u7ec4\u6210\u8bb0\u5fc6\u5b50\u56fe\uff0c\u5e76\u7528\u652f\u6301\u3001\u51b2\u7a81\u3001\u4fee\u590d\u7b49\u5173\u7cfb\u8fde\u63a5\u4e0d\u540c\u529f\u80fd\u5355\u5143\u3002", "MACE Loop \u5728\u8bb0\u5fc6\u9884\u7b97\u5185\u68c0\u7d22\u4efb\u52a1\u76f8\u5173\u5355\u5143\u548c\u5173\u7cfb\uff0c\u5e76\u4e3a\u4e0d\u540c\u667a\u80fd\u4f53\u4ee5\u6307\u4ee4\u6216\u68c0\u67e5\u6e05\u5355\u5f62\u5f0f\u63d0\u4f9b\u53ef\u590d\u7528\u7ecf\u9a8c\u3002", "\u5728 8 \u4e2a\u57fa\u51c6\u4e0a\u5e73\u5747\u5f97\u5206 81.11%\uff0c\u8d85\u8fc7 10 \u4e2a\u57fa\u7ebf\uff1b\u6700\u5f3a\u57fa\u7ebf SAGE \u4e3a 78.97%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u673a\u5236", "\u56fe\u7ed3\u6784"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21533v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MACE: Memory-Agent Co-Evolution with Adaptive Memory Graphs for Multi-Agent Systems", "tldr": "\u81ea\u9002\u5e94\u8bb0\u5fc6\u56fe\u63d0\u5347\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u590d\u7528", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MACE\uff0c\u4e00\u4e2a\u9762\u5411 LLM \u591a\u667a\u80fd\u4f53\u7cfb\u7edf\u7684\u8bb0\u5fc6\u2014\u667a\u80fd\u4f53\u534f\u540c\u6f14\u5316\u6846\u67b6\u3002\u5b83\u5c06\u534f\u4f5c\u8f68\u8ff9\u4e2d\u7684\u6761\u4ef6\u3001\u52a8\u4f5c\u3001\u8f93\u51fa\u7ec4\u7ec7\u4e3a\u529f\u80fd\u6027\u8bb0\u5fc6\u5b50\u56fe\uff0c\u5e76\u6839\u636e\u6267\u884c\u53cd\u9988\u52a8\u6001\u9009\u62e9\u8bb0\u5fc6\u5355\u5143\u3001\u5173\u7cfb\u548c\u5448\u73b0\u683c\u5f0f\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u8fc7\u7a0b\u4ece\u7b80\u5355\u65e5\u5fd7\u590d\u7528\u63d0\u5347\u4e3a\u7ed3\u6784\u5316\u3001\u53ef\u53cd\u9988\u66f4\u65b0\u7684\u8bb0\u5fc6\u56fe\u7ba1\u7406\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u590d\u6742\u4efb\u52a1\u4e2d\u7684\u7ecf\u9a8c\u8fc1\u79fb\u3001\u6545\u969c\u4fee\u590d\u548c\u957f\u671f\u534f\u4f5c\u6548\u7387\u3002"}, {"abstract": "Defenses against jailbreak attacks on Large Language Models (LLMs) operate at different pipeline stages, such as input modification or output guard, but it remains unclear which defenses to deploy at each stage and how to combine them. Prior empirical studies, fragmented by inconsistent attack-success-rate definitions and experimental settings, have evaluated defenses largely in isolation. Here we present the first systematic study, to our knowledge, of defense combinations both within and across pipeline stages, under a consistent threat model of direct, black-box, single-turn attacks. Our decision framework standardizes evaluation through a principled attack-success-rate formulation with controlled query budgets, together with explicit fairness rules. Across 19 attacks and 15 defenses, we find that no single defense is universally best, but well-chosen combinations achieve substantial safety with minimal utility degradation, yielding practical recommendations for layered defense pipelines.", "arxiv_id": "2609.21793", "arxiv_url": "https://arxiv.org/abs/2609.21793", "authors": ["Jiale Luo", "Eric Han"], "brief": "\u672c\u6587\u63d0\u51faCASCADE\u8bc4\u4f30\u6846\u67b6\uff0c\u7edf\u4e00\u6bd4\u8f83LLM\u6d41\u6c34\u7ebf\u4e0d\u540c\u9636\u6bb5\u7684\u8d8a\u72f1\u9632\u5fa1\u53ca\u5176\u7ec4\u5408\u6548\u679c\u3002\u7814\u7a76\u5728\u76f4\u63a5\u3001\u9ed1\u76d2\u3001\u5355\u8f6e\u653b\u51fb\u5a01\u80c1\u6a21\u578b\u4e0b\uff0c\u5bf919\u79cd\u653b\u51fb\u548c15\u79cd\u9632\u5fa1\u8fdb\u884c\u53d7\u63a7\u5b9e\u9a8c\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21793", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u7edf\u4e00\u653b\u51fb\u6210\u529f\u7387\u5b9a\u4e49\u3001\u67e5\u8be2\u9884\u7b97\u548c\u516c\u5e73\u6027\u89c4\u5219\uff0c\u51cf\u5c11\u65e2\u6709\u7814\u7a76\u4e2d\u8bc4\u4f30\u53e3\u5f84\u4e0d\u4e00\u81f4\u7684\u95ee\u9898", "\u8986\u76d6\u8f93\u5165\u6539\u5199\u3001\u6a21\u578b\u524d\u7f6e\u9632\u62a4\u3001\u8f93\u51fa\u5b88\u536b\u7b49\u591a\u4e2a\u6d41\u6c34\u7ebf\u9636\u6bb5\uff0c\u5e76\u8bc4\u4f30\u9636\u6bb5\u5185\u4e0e\u8de8\u9636\u6bb5\u7ec4\u5408", "\u53d1\u73b0\u4e0d\u5b58\u5728\u5355\u4e00\u6700\u4f18\u9632\u5fa1\uff0c\u4f46\u5408\u7406\u5206\u5c42\u7ec4\u5408\u53ef\u663e\u8457\u63d0\u5347\u5b89\u5168\u6027\u4e14\u5c3d\u91cf\u964d\u4f4e\u6548\u7528\u635f\u5931"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u8d8a\u72f1\u653b\u51fb", "\u9632\u5fa1\u8bc4\u4f30", "\u7ea2\u961f\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21793v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "CASCADE Against Jailbreaks: Combination Across Stages with Controlled Attack-Defense Evaluation", "tldr": "\u7cfb\u7edf\u8bc4\u4f30LLM\u8d8a\u72f1\u9632\u5fa1\u7ec4\u5408\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51faCASCADE\u8bc4\u4f30\u6846\u67b6\uff0c\u7edf\u4e00\u6bd4\u8f83LLM\u6d41\u6c34\u7ebf\u4e0d\u540c\u9636\u6bb5\u7684\u8d8a\u72f1\u9632\u5fa1\u53ca\u5176\u7ec4\u5408\u6548\u679c\u3002\u7814\u7a76\u5728\u76f4\u63a5\u3001\u9ed1\u76d2\u3001\u5355\u8f6e\u653b\u51fb\u5a01\u80c1\u6a21\u578b\u4e0b\uff0c\u5bf919\u79cd\u653b\u51fb\u548c15\u79cd\u9632\u5fa1\u8fdb\u884c\u53d7\u63a7\u5b9e\u9a8c\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3aLLM\u8d8a\u72f1\u9632\u5fa1\u63d0\u4f9b\u4e86\u66f4\u53ef\u590d\u73b0\u3001\u66f4\u516c\u5e73\u7684\u7cfb\u7edf\u6027\u8bc4\u4f30\uff0c\u5e76\u7ed9\u51fa\u5b9e\u9645\u90e8\u7f72\u5206\u5c42\u9632\u5fa1\u7ba1\u7ebf\u7684\u7ecf\u9a8c\u5efa\u8bae\uff0c\u5bf9\u6a21\u578b\u5b89\u5168\u843d\u5730\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning has substantially improved large language model (LLM) agents in verifiable domains, but remains difficult to apply to open-ended agent tasks, where solutions are diverse and reliable scalar rewards are hard to obtain. Recent pairwise evaluation methods alleviate reward discrimination collapse by replacing pointwise scoring with relative preferences. However, they still compress rich comparative feedback into a single trajectory-level reward, obscuring decisive intermediate steps and preventing successful behaviors from being consolidated into reusable skills. We propose ArenaFlow, a hierarchical credit propagation framework for open-ended agent reinforcement learning. ArenaFlow leverages tournament-based relative ranking to derive trajectory-level reward signals. Each comparison is further equipped with structured reflective evaluation, which reveals three types of supervision: pivotal success steps, reusable strategy skills, and usage attribution of retrieved skills. At the step level, ArenaFlow propagates trajectory-level advantages to high-confidence pivotal steps according to tournament survival depth, enabling more targeted optimization of local reasoning behaviors. At the skill level, ArenaFlow estimates skill utility from group-level usage attribution and maintains a global skill memory through utility-aware updating, pruning, and retrieval. The resulting high-utility skills further serve as policy priors for future exploration. Extensive experiments validate ArenaFlow\u0027s effectiveness on open-ended agent tasks.", "arxiv_id": "2609.21378", "arxiv_url": "https://arxiv.org/abs/2609.21378", "authors": ["Qiang Zhang", "Ruixue Ding", "Fanrui Zhang", "Xi Chen", "Boli Chen", "Shihang Wang", "Yinfeng Huang", "Yi Zheng", "Pengjun Xie", "Kaipeng Zhang", "Jiawei Liu", "Zheng-Jun Zha"], "brief": "ArenaFlow \u662f\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f LLM \u667a\u80fd\u4f53\u4efb\u52a1\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u7528\u9526\u6807\u8d5b\u5f0f\u76f8\u5bf9\u6392\u540d\u751f\u6210\u8f68\u8ff9\u7ea7\u5956\u52b1\uff0c\u5e76\u8fdb\u4e00\u6b65\u628a\u53cd\u9988\u4f20\u64ad\u5230\u5173\u952e\u6b65\u9aa4\u4e0e\u53ef\u590d\u7528\u6280\u80fd\u5c42\u9762\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21378", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7\u57fa\u4e8e\u9526\u6807\u8d5b\u7684\u76f8\u5bf9\u6392\u5e8f\u7f13\u89e3\u5f00\u653e\u5f0f\u4efb\u52a1\u4e2d\u5956\u52b1\u96be\u6807\u6ce8\u3001\u6807\u91cf\u5956\u52b1\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898", "\u5229\u7528\u7ed3\u6784\u5316\u53cd\u601d\u8bc4\u4f30\u8bc6\u522b\u5173\u952e\u6210\u529f\u6b65\u9aa4\u3001\u53ef\u590d\u7528\u7b56\u7565\u6280\u80fd\u4ee5\u53ca\u6280\u80fd\u4f7f\u7528\u5f52\u56e0", "\u5728\u6b65\u9aa4\u5c42\u8fdb\u884c\u4f18\u52bf\u4f20\u64ad\uff0c\u5728\u6280\u80fd\u5c42\u7ef4\u62a4\u5168\u5c40\u6280\u80fd\u8bb0\u5fc6\uff0c\u5e76\u5c06\u9ad8\u6548\u6280\u80fd\u4f5c\u4e3a\u540e\u7eed\u63a2\u7d22\u7684\u7b56\u7565\u5148\u9a8c"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u6280\u80fd\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21378v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ArenaFlow: From Trajectory Ranking to Hierarchical Credit Propagation for Open-Ended Agent RL", "tldr": "\u5c06\u8f68\u8ff9\u6392\u540d\u8f6c\u5316\u4e3a\u5206\u5c42\u4fe1\u7528\u5206\u914d\u7684\u5f00\u653e\u5f0f\u667a\u80fd\u4f53RL\u6846\u67b6", "upvotes": 0, "what_it_is": "ArenaFlow \u662f\u4e00\u4e2a\u9762\u5411\u5f00\u653e\u5f0f LLM \u667a\u80fd\u4f53\u4efb\u52a1\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\u3002\u5b83\u7528\u9526\u6807\u8d5b\u5f0f\u76f8\u5bf9\u6392\u540d\u751f\u6210\u8f68\u8ff9\u7ea7\u5956\u52b1\uff0c\u5e76\u8fdb\u4e00\u6b65\u628a\u53cd\u9988\u4f20\u64ad\u5230\u5173\u952e\u6b65\u9aa4\u4e0e\u53ef\u590d\u7528\u6280\u80fd\u5c42\u9762\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u7c97\u7c92\u5ea6\u8f68\u8ff9\u504f\u597d\u6269\u5c55\u4e3a\u6b65\u9aa4\u7ea7\u4e0e\u6280\u80fd\u7ea7\u4fe1\u7528\u5206\u914d\uff0c\u6709\u671b\u63d0\u5347\u5f00\u653e\u5f0f\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u7684\u6837\u672c\u6548\u7387\u3001\u53ef\u89e3\u91ca\u6027\u548c\u6280\u80fd\u590d\u7528\u80fd\u529b\u3002"}, {"abstract": "Empirical identity leakage from released text is increasingly driven by attackers that combine large language models (LLMs) with auxiliary knowledge to link documents to individuals. Existing audits typically report success rates for specific attack pipelines but lack finite-sample statistical guarantees, while training-time protections such as differential privacy are difficult to translate into release-time decisions for individual natural-language documents. We introduce Conformal Privacy Auditing(CPA), a distribution-free calibration framework that provides a statistical certificate of re-identification risk for each released document against LLM-empowered adversaries. CPA outputs a conformal ambiguity set of candidate identities that is guaranteed to contain the true identity with user-chosen confidence under exchangeability, together with an interpretable leakage proxy derived from set size. CPA supports both logit-access and sampling-only attackers, enabling audits of open-source models and proprietary API models in a unified framework. Across multiple release benchmarks and attacker configurations, CPA achieves calibrated coverage and reveals sharp shifts in certified identifiability as auxiliary knowledge, LLM augmentation, and release mechanisms vary, providing a statistically grounded basis for reporting and comparing release-time linkage risk across attacker configurations, datasets, and release mechanisms alike.", "arxiv_id": "2609.21340", "arxiv_url": "https://arxiv.org/abs/2609.21340", "authors": ["Shuo Huang", "Gholamreza Haffari", "Xingliang Yuan", "Ting Yu", "Lizhen Qu"], "brief": "\u8bba\u6587\u63d0\u51fa Conformal Privacy Auditing\uff08CPA\uff09\uff0c\u4e00\u4e2a\u5206\u5e03\u65e0\u5173\u7684\u6587\u672c\u53d1\u5e03\u9690\u79c1\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u7ed3\u5408\u8f85\u52a9\u77e5\u8bc6\u8fdb\u884c\u8eab\u4efd\u94fe\u63a5\u65f6\u7684\u518d\u8bc6\u522b\u98ce\u9669\u3002\u5b83\u4e3a\u6bcf\u7bc7\u53d1\u5e03\u6587\u6863\u8f93\u51fa\u5019\u9009\u8eab\u4efd\u96c6\u5408\uff0c\u5e76\u5728\u53ef\u4ea4\u6362\u6027\u5047\u8bbe\u4e0b\u4fdd\u8bc1\u4ee5\u7528\u6237\u6307\u5b9a\u7f6e\u4fe1\u5ea6\u5305\u542b\u771f\u5b9e\u8eab\u4efd\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21340", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u4fdd\u5f62\u9884\u6d4b\u7528\u4e8e\u9690\u79c1\u5ba1\u8ba1\uff0c\u63d0\u4f9b\u6709\u9650\u6837\u672c\u7edf\u8ba1\u4fdd\u8bc1\uff0c\u800c\u975e\u4ec5\u62a5\u544a\u653b\u51fb\u6210\u529f\u7387\u3002", "\u901a\u8fc7\u5019\u9009\u8eab\u4efd\u96c6\u5408\u5927\u5c0f\u6784\u9020\u53ef\u89e3\u91ca\u7684\u6cc4\u9732\u4ee3\u7406\u6307\u6807\uff1a\u96c6\u5408\u8d8a\u5c0f\uff0c\u8ba4\u8bc1\u7684\u53ef\u8bc6\u522b\u6027\u8d8a\u5f3a\u3002", "\u540c\u65f6\u652f\u6301\u53ef\u8bbf\u95ee logits \u7684\u653b\u51fb\u8005\u548c\u4ec5\u91c7\u6837 API \u7684\u653b\u51fb\u8005\uff0c\u53ef\u7edf\u4e00\u5ba1\u8ba1\u5f00\u6e90\u6a21\u578b\u4e0e\u95ed\u6e90\u6a21\u578b\u3002"], "keywords": ["\u9690\u79c1\u5ba1\u8ba1", "\u4fdd\u5f62\u9884\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6587\u672c\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21340v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Conformal Privacy Auditing: Calibrated Re-identification Attacks with Statistical Guarantees", "tldr": "\u7528\u4fdd\u5f62\u9884\u6d4b\u6821\u51c6\u6587\u672c\u518d\u8bc6\u522b\u9690\u79c1\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Conformal Privacy Auditing\uff08CPA\uff09\uff0c\u4e00\u4e2a\u5206\u5e03\u65e0\u5173\u7684\u6587\u672c\u53d1\u5e03\u9690\u79c1\u5ba1\u8ba1\u6846\u67b6\uff0c\u7528\u4e8e\u8bc4\u4f30 LLM \u7ed3\u5408\u8f85\u52a9\u77e5\u8bc6\u8fdb\u884c\u8eab\u4efd\u94fe\u63a5\u65f6\u7684\u518d\u8bc6\u522b\u98ce\u9669\u3002\u5b83\u4e3a\u6bcf\u7bc7\u53d1\u5e03\u6587\u6863\u8f93\u51fa\u5019\u9009\u8eab\u4efd\u96c6\u5408\uff0c\u5e76\u5728\u53ef\u4ea4\u6362\u6027\u5047\u8bbe\u4e0b\u4fdd\u8bc1\u4ee5\u7528\u6237\u6307\u5b9a\u7f6e\u4fe1\u5ea6\u5305\u542b\u771f\u5b9e\u8eab\u4efd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u53d1\u5e03\u65f6\u6587\u672c\u9690\u79c1\u98ce\u9669\u4ece\u7ecf\u9a8c\u6027\u653b\u51fb\u8bc4\u4f30\u63a8\u8fdb\u5230\u5e26\u7edf\u8ba1\u8bc1\u4e66\u7684\u53ef\u6bd4\u8f83\u5ba1\u8ba1\uff0c\u6709\u52a9\u4e8e\u5728\u4e0d\u540c\u6570\u636e\u96c6\u3001\u653b\u51fb\u914d\u7f6e\u548c\u53d1\u5e03\u673a\u5236\u4e4b\u95f4\u91cf\u5316\u5e76\u62a5\u544a\u8eab\u4efd\u6cc4\u9732\u98ce\u9669\u3002"}, {"abstract": "Generative world models offer controllable and repeatable closed-loop simulation for end-to-end and vision-language-action driving policies, but production deployment exposes three unresolved requirements: faithfully reproducing a mixed fisheye-pinhole rig at native resolutions; reconciling causal, per-timestep interaction with long-horizon stability and low latency; and preserving scene identity when a location is revisited. We present ZYT-World, a single architecture that natively generates four fisheye views with field of view \u003e 180\u00b0 and three pinhole views. Projection-specific Plucker adapters encode camera geometry, ego-motion adaptive layer normalization provides global motion control, and a lightweight pixel-aligned layout conditions traffic participants and signals through instance-level boxes, headings and colors. Heterogeneous training combines full-rig geometric coverage with high-resolution detail. Teacher forcing, causal consistency distillation, self-rollout distribution matching distillation, and RigCritic transform a 40-step bidirectional teacher into a one-step, per-latent streaming generator, with RigCritic evaluating the seven-view rig jointly. A 19M-parameter variational autoencoder decoder (TinyVAE), W8A8 quantization, and our inference engine reduce decodi
