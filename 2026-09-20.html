ng, backbone, and incremental-execution costs, respectively. Finally, cross-trajectory pairs derived from real captures train a plug-in implicit-memory module that preserves place-specific evidence. On the internal multi-view test set, the one-step model retains more than 90% of the teacher\u0027s PSNR and SSIM, while FID, FVD, and LPIPS stay within 11% of the teacher. Under the generator-only timing in Figure 2, it is 107.7 times faster than the 40-step bidirectional teacher. TinyVAE decodes 59.8 times faster than Wan. 30s rollouts and cross-trajectory revisits show the intended long-horizon and memory behavior.", "arxiv_id": "2609.21712", "arxiv_url": "https://arxiv.org/abs/2609.21712", "authors": ["Boni Hu", "Xiong Wei", "Haoming Huang", "Yong Huang", "Chenbo Wang", "Yi Yang", "Jiancheng Wang", "Ruicheng Zhu", "Zhimin Yang", "Guanglai Liu", "Qiaowan Jin", "Dongzhuo Wang", "Haiwei Kuang", "Jiajun Fan", "Yue Wu", "Jiaxin Wei", "Hao Sun", "Feihong Yan", "Wei Bi", "Kaixuan Wang", "Zichao Guo", "Xiaozhi Chen"], "brief": "ZYT-World \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u95ed\u73af\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u7684\u751f\u6210\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u539f\u751f\u751f\u62104\u8def\u9c7c\u773c\u4e0e3\u8def\u9488\u5b54\u76f8\u673a\u89c6\u56fe\u3002\u5b83\u5c06\u591a\u76f8\u673a\u51e0\u4f55\u3001\u8f66\u8f86\u8fd0\u52a8\u63a7\u5236\u3001\u4ea4\u901a\u53c2\u4e0e\u8005\u5e03\u5c40\u6761\u4ef6\u548c\u5730\u70b9\u8bb0\u5fc6\u6574\u5408\u5230\u5355\u4e00\u5b9e\u65f6\u67b6\u6784\u4e2d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21712", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u652f\u6301\u6df7\u5408\u9c7c\u773c-\u9488\u5b54\u76f8\u673a\u9635\u5217\uff0c\u5229\u7528\u6295\u5f71\u7279\u5b9a Plucker \u9002\u914d\u5668\u7f16\u7801\u76f8\u673a\u51e0\u4f55\uff0c\u5e76\u7528 ego-motion adaptive layer normalization \u5b9e\u73b0\u5168\u5c40\u8fd0\u52a8\u63a7\u5236", "\u901a\u8fc7\u6559\u5e08\u5f3a\u5236\u3001\u56e0\u679c\u4e00\u81f4\u6027\u84b8\u998f\u3001\u81ea rollout \u5206\u5e03\u5339\u914d\u84b8\u998f\u548c RigCritic\uff0c\u5c0640\u6b65\u53cc\u5411\u6559\u5e08\u6a21\u578b\u538b\u7f29\u4e3a\u5355\u6b65\u6d41\u5f0f\u751f\u6210\u5668", "\u7ed3\u5408 TinyVAE\u3001W8A8 \u91cf\u5316\u548c\u63a8\u7406\u5f15\u64ce\u4f18\u5316\uff0c\u751f\u6210\u5668\u901f\u5ea6\u8f83\u6559\u5e08\u6a21\u578b\u63d0\u5347107.7\u500d\uff0cTinyVAE \u89e3\u7801\u5feb59.8\u500d"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u81ea\u52a8\u9a7e\u9a76", "\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21712v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ZYT-World: A Real-Time Controllable World Model for Closed-Loop Autonomous-Driving Simulation", "tldr": "\u5b9e\u65f6\u53ef\u63a7\u7684\u591a\u89c6\u89d2\u81ea\u52a8\u9a7e\u9a76\u4e16\u754c\u6a21\u578b", "upvotes": 0, "what_it_is": "ZYT-World \u63d0\u51fa\u4e00\u79cd\u9762\u5411\u95ed\u73af\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u7684\u751f\u6210\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u539f\u751f\u751f\u62104\u8def\u9c7c\u773c\u4e0e3\u8def\u9488\u5b54\u76f8\u673a\u89c6\u56fe\u3002\u5b83\u5c06\u591a\u76f8\u673a\u51e0\u4f55\u3001\u8f66\u8f86\u8fd0\u52a8\u63a7\u5236\u3001\u4ea4\u901a\u53c2\u4e0e\u8005\u5e03\u5c40\u6761\u4ef6\u548c\u5730\u70b9\u8bb0\u5fc6\u6574\u5408\u5230\u5355\u4e00\u5b9e\u65f6\u67b6\u6784\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9762\u5411\u81ea\u52a8\u9a7e\u9a76\u4eff\u771f\u7684\u751f\u4ea7\u7ea7\u74f6\u9888\uff1a\u539f\u751f\u591a\u76f8\u673a\u9ad8\u5206\u8fa8\u7387\u3001\u4f4e\u5ef6\u8fdf\u95ed\u73af\u4ea4\u4e92\u3001\u957f\u65f6\u5e8f\u7a33\u5b9a\u6027\u548c\u91cd\u8bbf\u5730\u70b9\u4e00\u81f4\u6027\uff0c\u5177\u5907\u8f83\u5f3a\u5de5\u7a0b\u843d\u5730\u4ef7\u503c\u3002"}, {"abstract": "Despite the remarkable progress in Multimodal Large Language Models (MLLMs), prevailing Chain-of-Thought (CoT) paradigms remain confined to the natural-language expression space. Consequently, they inherently incur excessive linguistic overhead, leading to information dilution and weak visual grounding. To address this challenge, we propose Dense Reasoning Trace (DRT), a paradigm that departs from natural-language-centered CoT by expressing reasoning as compact structured traces, which include concise intermediate states with symbolic connectors and disentangle visual observations from logical deductions. First, we introduce the Dense Trace Initialization to internalize the DRT reasoning mode into the model, substantially improving token efficiency while preserving visual evidence. To further enable the model to faithfully capture the logical relations within traces, we propose the Trace-Grounded Reinforcement Learning framework, which builds reference traces through a tri-perspective verification pipeline and employs Trace-Grounded GRPO with structured rewards, encouraging the model to generate concise DRT-style traces with reduced hallucination and stronger logical grounding. Extensive experiments on challenging reasoning benchmarks show that DRT achieves 5.5$\\times$ token efficiency improvement while improving 1.3 accuracy points over the Qwen3-VL baseline. These findings suggest that complex multimodal reasoning may not require verbose natural-language traces, opening a more efficient path for next-generation MLLMs. Our code and data are available at: https://github.com/HIT-leaderone/DRT", "arxiv_id": "2609.21675", "arxiv_url": "https://arxiv.org/abs/2609.21675", "authors": ["Wan Xu", "Yuanfan Guo", "Kevin Han", "LaLa Chen", "Wangmeng Zuo"], "brief": "\u8bba\u6587\u63d0\u51fa Dense Reasoning Trace\uff08DRT\uff09\uff0c\u5c06\u591a\u6a21\u6001\u63a8\u7406\u4ece\u81ea\u7136\u8bed\u8a00\u5f0f CoT \u8f6c\u4e3a\u7d27\u51d1\u7ed3\u6784\u5316\u8f68\u8ff9\uff0c\u5206\u79bb\u89c6\u89c9\u89c2\u5bdf\u4e0e\u903b\u8f91\u63a8\u5bfc\u3002\u65b9\u6cd5\u7ed3\u5408\u7a20\u5bc6\u8f68\u8ff9\u521d\u59cb\u5316\u4e0e\u57fa\u4e8e\u8f68\u8ff9\u7684\u5f3a\u5316\u5b66\u4e60\uff0c\u4f7f MLLM \u66f4\u9ad8\u6548\u3001 grounded \u5730\u5b8c\u6210\u590d\u6742\u89c6\u89c9\u63a8\u7406\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21675", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["DRT \u4f7f\u7528\u7b80\u6d01\u4e2d\u95f4\u72b6\u6001\u3001\u7b26\u53f7\u8fde\u63a5\u7b26\u548c\u89c2\u5bdf/\u63a8\u7406\u89e3\u8026\uff0c\u51cf\u5c11\u81ea\u7136\u8bed\u8a00\u63a8\u7406\u94fe\u7684 token \u5197\u4f59\u4e0e\u4fe1\u606f\u7a00\u91ca\u3002", "\u63d0\u51fa Dense Trace Initialization\uff0c\u8ba9\u6a21\u578b\u5185\u5316 DRT \u63a8\u7406\u683c\u5f0f\uff0c\u5728\u4fdd\u6301\u89c6\u89c9\u8bc1\u636e\u7684\u540c\u65f6\u63d0\u5347 token \u6548\u7387\u3002", "\u8bbe\u8ba1 Trace-Grounded Reinforcement Learning\uff0c\u901a\u8fc7\u4e09\u89c6\u89d2\u9a8c\u8bc1\u6784\u9020\u53c2\u8003\u8f68\u8ff9\uff0c\u5e76\u7528\u7ed3\u6784\u5316\u5956\u52b1\u7684 Trace-Grounded GRPO \u964d\u4f4e\u5e7b\u89c9\u3001\u589e\u5f3a\u903b\u8f91\u7ea6\u675f\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u89c6\u89c9\u95ee\u7b54"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21675v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DRT: Dense Reasoning Trace for Efficient and Grounded Multimodal Reasoning", "tldr": "\u7528\u7ed3\u6784\u5316\u7a20\u5bc6\u8f68\u8ff9\u66ff\u4ee3\u5197\u957f\u591a\u6a21\u6001CoT", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa Dense Reasoning Trace\uff08DRT\uff09\uff0c\u5c06\u591a\u6a21\u6001\u63a8\u7406\u4ece\u81ea\u7136\u8bed\u8a00\u5f0f CoT \u8f6c\u4e3a\u7d27\u51d1\u7ed3\u6784\u5316\u8f68\u8ff9\uff0c\u5206\u79bb\u89c6\u89c9\u89c2\u5bdf\u4e0e\u903b\u8f91\u63a8\u5bfc\u3002\u65b9\u6cd5\u7ed3\u5408\u7a20\u5bc6\u8f68\u8ff9\u521d\u59cb\u5316\u4e0e\u57fa\u4e8e\u8f68\u8ff9\u7684\u5f3a\u5316\u5b66\u4e60\uff0c\u4f7f MLLM \u66f4\u9ad8\u6548\u3001 grounded \u5730\u5b8c\u6210\u590d\u6742\u89c6\u89c9\u63a8\u7406\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u590d\u6742\u591a\u6a21\u6001\u63a8\u7406\u5fc5\u987b\u4f9d\u8d56\u5197\u957f\u81ea\u7136\u8bed\u8a00 CoT\u201d\u7684\u9ed8\u8ba4\u8303\u5f0f\uff0c\u5728 Qwen3-VL \u57fa\u7ebf\u4e0a\u5b9e\u73b0 5.5 \u500d token \u6548\u7387\u63d0\u5347\u4e14\u51c6\u786e\u7387\u63d0\u9ad8 1.3 \u4e2a\u70b9\uff0c\u5bf9\u9ad8\u6548\u3001\u53ef\u89e3\u91ca\u3001\u89c6\u89c9\u624e\u6839\u7684 MLLM \u63a8\u7406\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent 3D foundation models enable generalizable geometric reasoning from RGB images but remain limited in persistent memory, scalability, and renderable scene modeling. We present a memory-centric 3D foundation model for scalable robotic localization, reconstruction, and Gaussian rendering. Its core is an adaptive world memory mechanism that combines transformer-based gated updates with test-time temporal-spatial regulation. Learned gates control recurrent memory propagation, while temporal state evolution and spatial observation-state consistency regulate token-wise updates and forgetting over long image sequences. To support large-scale mapping, we organize memory into local submaps and integrate progressive mapping and tracking, loop closure, and SL(4)-based global refinement to maintain local accuracy and global consistency. A Gaussian reconstruction head decodes memory-enhanced features into renderable primitives, unifying camera pose estimation, dense point-cloud reconstruction, and photorealistic rendering within a single model. Experiments on public benchmarks and self-collected datasets from diverse robotic platforms demonstrate improved trajectory accuracy, reconstruction completeness, and rendering quality over existing 3D foundation reconstruction and SLAM baselines. These results support adaptive memory as a foundation for persistent robotic world modeling. The dataset and code will be made publicly available at \\href{https://github.com/dtc111111/AWM-3DFM}{https://github.com/dtc111111/AWM-3DFM}.", "arxiv_id": "2609.21502", "arxiv_url": "https://arxiv.org/abs/2609.21502", "authors": ["Tianchen Deng", "Guole Shen", "Yilin Shen", "Wenhua Wu", "Yilin Fang", "Ziqi Ma", "Tianjun Zhang", "Shenghai Yuan", "Wolfram Burgard", "Hesheng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa AWM-3DFM\uff0c\u4e00\u4e2a\u4ee5\u8bb0\u5fc6\u4e3a\u6838\u5fc3\u76843D\u57fa\u7840\u6a21\u578b\uff0c\u7528\u4e8e\u5927\u89c4\u6a21\u673a\u5668\u4eba\u5b9a\u4f4d\u3001\u91cd\u5efa\u4e0e\u9ad8\u65af\u6e32\u67d3\u3002\u5b83\u901a\u8fc7\u53ef\u5b66\u4e60\u7684\u65f6\u7a7a\u8bb0\u5fc6\u66f4\u65b0\u4e0e\u5b50\u5730\u56fe\u7ec4\u7ec7\uff0c\u5c06\u76f8\u673a\u4f4d\u59ff\u4f30\u8ba1\u3001\u7a20\u5bc6\u70b9\u4e91\u91cd\u5efa\u548c\u53ef\u6e32\u67d3\u573a\u666f\u5efa\u6a21\u7edf\u4e00\u5230\u5355\u4e00\u6a21\u578b\u4e2d\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21502", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa\u81ea\u9002\u5e94\u4e16\u754c\u8bb0\u5fc6\u673a\u5236\uff1a\u7ed3\u5408 Transformer \u95e8\u63a7\u66f4\u65b0\u3001\u65f6\u95f4\u72b6\u6001\u6f14\u5316\u548c\u7a7a\u95f4\u89c2\u6d4b-\u72b6\u6001\u4e00\u81f4\u6027\uff0c\u5b9e\u73b0\u957f\u5e8f\u5217\u4e2d\u7684\u9010 token \u66f4\u65b0\u4e0e\u9057\u5fd8\u63a7\u5236\u3002", "\u9762\u5411\u5927\u89c4\u6a21\u573a\u666f\u91c7\u7528\u5c40\u90e8\u5b50\u5730\u56fe\u3001\u6e10\u8fdb\u5f0f\u5efa\u56fe\u4e0e\u8ddf\u8e2a\u3001\u56de\u73af\u68c0\u6d4b\u4ee5\u53ca\u57fa\u4e8e SL(4) \u7684\u5168\u5c40\u4f18\u5316\uff0c\u517c\u987e\u5c40\u90e8\u7cbe\u5ea6\u548c\u5168\u5c40\u4e00\u81f4\u6027\u3002", "\u52a0\u5165 Gaussian reconstruction head\uff0c\u5c06\u8bb0\u5fc6\u589e\u5f3a\u7279\u5f81\u89e3\u7801\u4e3a\u53ef\u6e32\u67d3\u9ad8\u65af\u57fa\u5143\uff0c\u5728\u516c\u5f00\u57fa\u51c6\u548c\u591a\u673a\u5668\u4eba\u5e73\u53f0\u81ea\u91c7\u6570\u636e\u4e0a\u63d0\u5347\u8f68\u8ff9\u7cbe\u5ea6\u3001\u91cd\u5efa\u5b8c\u6574\u5ea6\u548c\u6e32\u67d3\u8d28\u91cf\u3002"], "keywords": ["3D\u57fa\u7840\u6a21\u578b", "\u673a\u5668\u4eba\u611f\u77e5", "SLAM", "\u9ad8\u65af\u6e32\u67d3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21502v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Adaptive World Memory 3D Foundation Model for Scalable 3D Mapping, Localization, and Rendering", "tldr": "\u7528\u81ea\u9002\u5e94\u4e16\u754c\u8bb0\u5fc6\u6269\u5c553D\u57fa\u7840\u6a21\u578b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa AWM-3DFM\uff0c\u4e00\u4e2a\u4ee5\u8bb0\u5fc6\u4e3a\u6838\u5fc3\u76843D\u57fa\u7840\u6a21\u578b\uff0c\u7528\u4e8e\u5927\u89c4\u6a21\u673a\u5668\u4eba\u5b9a\u4f4d\u3001\u91cd\u5efa\u4e0e\u9ad8\u65af\u6e32\u67d3\u3002\u5b83\u901a\u8fc7\u53ef\u5b66\u4e60\u7684\u65f6\u7a7a\u8bb0\u5fc6\u66f4\u65b0\u4e0e\u5b50\u5730\u56fe\u7ec4\u7ec7\uff0c\u5c06\u76f8\u673a\u4f4d\u59ff\u4f30\u8ba1\u3001\u7a20\u5bc6\u70b9\u4e91\u91cd\u5efa\u548c\u53ef\u6e32\u67d3\u573a\u666f\u5efa\u6a21\u7edf\u4e00\u5230\u5355\u4e00\u6a21\u578b\u4e2d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c063D\u57fa\u7840\u6a21\u578b\u4ece\u5355\u5e27/\u77ed\u5e8f\u5217\u51e0\u4f55\u63a8\u7406\u63a8\u8fdb\u5230\u5177\u5907\u6301\u4e45\u8bb0\u5fc6\u7684\u5927\u89c4\u6a21\u673a\u5668\u4eba\u4e16\u754c\u5efa\u6a21\uff0c\u5e76\u540c\u65f6\u8986\u76d6 SLAM\u3001\u91cd\u5efa\u548c\u7167\u7247\u7ea7\u6e32\u67d3\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u673a\u5668\u4eba\u611f\u77e5\u4e0e\u5177\u8eab\u7a7a\u95f4\u667a\u80fd\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Manipulating objects requires understanding not only their motion, but also the physical properties that determine it. For articulated objects, these include inertia, friction, and mechanisms such as springs or door closers, whose effects can vary with configuration and velocity. Such properties are not directly observable from appearance: visually identical doors may require very different effort to manipulate. Existing digital-twin pipelines recover primarily kinematics or assign static physical parameters from visual and language priors, which can yield physically implausible estimates. As a result, state-dependent mechanism dynamics remain unidentified and are not represented in standard asset formats. We present ForceTwin, a system for identifying physics-informed digital twins of articulated objects from instrumented human interaction. A person probes an object using a handheld force-sensing gripper, providing synchronized poses and interaction forces from which we estimate the articulation, parametric dynamics including inertia, Coulomb friction, viscous damping, and a structured neural residual capturing state-dependent mechanism forces. ForceTwin nearly halves the inertial-parameter error of a VLM prior. As a feedforward dynamics model for impedance control on a Spot and a Franka FR3, ForceTwin achieves 87% goal completion across nine object-embodiment pairs, compared with 60% using VLM-prior and 57% using kinematics-only twins, with the largest gains on objects whose strong mechanisms cause both baselines to stall. We further use the identified twins to train whole-body door-traversal policies and deploy them in the real world. Project Page: https://timengelbracht.github.io/forcetwin-website/", "arxiv_id": "2609.21751", "arxiv_url": "https://arxiv.org/abs/2609.21751", "authors": ["Tim Engelbracht", "Ren\u00e9 Zurbr\u00fcgg", "Mayank Mittal", "Marco Hutter", "Marc Pollefeys", "Hermann Blum", "Zuria Bauer"], "brief": "ForceTwin \u901a\u8fc7\u4eba\u624b\u6301\u5e26\u529b\u4f20\u611f\u5939\u722a\u63a2\u6d4b\u94f0\u63a5\u7269\u4f53\uff0c\u540c\u6b65\u91c7\u96c6\u4f4d\u59ff\u4e0e\u4ea4\u4e92\u529b\uff0c\u8bc6\u522b\u5176\u8fd0\u52a8\u5b66\u4e0e\u7269\u7406\u52a8\u529b\u5b66\u53c2\u6570\u3002\u7cfb\u7edf\u4f30\u8ba1\u60ef\u91cf\u3001\u5e93\u4ed1\u6469\u64e6\u3001\u9ecf\u6027\u963b\u5c3c\uff0c\u5e76\u7528\u7ed3\u6784\u5316\u795e\u7ecf\u6b8b\u5dee\u5efa\u6a21\u968f\u72b6\u6001\u53d8\u5316\u7684\u673a\u6784\u529b\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21751", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9762\u5411\u95e8\u3001\u62bd\u5c49\u7b49\u94f0\u63a5\u7269\u4f53\uff0c\u663e\u5f0f\u5efa\u6a21\u5916\u89c2\u65e0\u6cd5\u76f4\u63a5\u63a8\u65ad\u7684\u60ef\u91cf\u3001\u6469\u64e6\u3001\u5f39\u7c27/\u95ed\u95e8\u5668\u7b49\u673a\u5236\u52a8\u529b\u5b66", "\u76f8\u6bd4 VLM \u5148\u9a8c\uff0cForceTwin \u5c06\u60ef\u6027\u53c2\u6570\u8bef\u5dee\u8fd1\u4e4e\u51cf\u534a\uff0c\u5e76\u80fd\u8868\u793a\u6807\u51c6\u8d44\u4ea7\u683c\u5f0f\u4e2d\u7f3a\u5931\u7684\u72b6\u6001\u76f8\u5173\u673a\u5236\u529b", "\u5728 Spot \u548c Franka FR3 \u7684\u963b\u6297\u63a7\u5236\u4e2d\uff0c9 \u4e2a\u7269\u4f53-\u673a\u5668\u4eba\u7ec4\u5408\u8fbe\u5230 87% \u76ee\u6807\u5b8c\u6210\u7387\uff0c\u9ad8\u4e8e VLM \u5148\u9a8c\u7684 60% \u548c\u4ec5\u8fd0\u52a8\u5b66\u5b6a\u751f\u7684 57%"], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u6570\u5b57\u5b6a\u751f", "\u7269\u7406\u5efa\u6a21", "\u6a21\u4eff\u4e0e\u4ea4\u4e92"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21751v1", "published_at": "2026-09-18", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ForceTwin: Physics-informed Digital Twins for Robotic Manipulation from Instrumented Human Interaction", "tldr": "\u7528\u529b\u89c9\u4ea4\u4e92\u6784\u5efa\u53ef\u64cd\u63a7\u7269\u4f53\u7269\u7406\u5b6a\u751f", "upvotes": 0, "what_it_is": "ForceTwin \u901a\u8fc7\u4eba\u624b\u6301\u5e26\u529b\u4f20\u611f\u5939\u722a\u63a2\u6d4b\u94f0\u63a5\u7269\u4f53\uff0c\u540c\u6b65\u91c7\u96c6\u4f4d\u59ff\u4e0e\u4ea4\u4e92\u529b\uff0c\u8bc6\u522b\u5176\u8fd0\u52a8\u5b66\u4e0e\u7269\u7406\u52a8\u529b\u5b66\u53c2\u6570\u3002\u7cfb\u7edf\u4f30\u8ba1\u60ef\u91cf\u3001\u5e93\u4ed1\u6469\u64e6\u3001\u9ecf\u6027\u963b\u5c3c\uff0c\u5e76\u7528\u7ed3\u6784\u5316\u795e\u7ecf\u6b8b\u5dee\u5efa\u6a21\u968f\u72b6\u6001\u53d8\u5316\u7684\u673a\u6784\u529b\u3002", "why_notable": "\u5b83\u628a\u4eba\u7c7b\u5e26\u529b\u89c9\u7684\u4ea4\u4e92\u6570\u636e\u5f15\u5165\u6570\u5b57\u5b6a\u751f\u6784\u5efa\uff0c\u5f25\u8865\u4e86\u7eaf\u89c6\u89c9\u6216\u8bed\u8a00\u5148\u9a8c\u96be\u4ee5\u4f30\u8ba1\u771f\u5b9e\u7269\u7406\u5c5e\u6027\u7684\u95ee\u9898\uff0c\u4f7f\u673a\u5668\u4eba\u80fd\u66f4\u53ef\u9760\u5730\u64cd\u4f5c\u5e26\u590d\u6742\u673a\u6784\u52a8\u529b\u5b66\u7684\u771f\u5b9e\u7269\u4f53\uff0c\u5e76\u53ef\u8fdb\u4e00\u6b65\u7528\u4e8e\u8bad\u7ec3\u73b0\u5b9e\u90e8\u7f72\u7684\u5168\u8eab\u95e8\u901a\u884c\u7b56\u7565\u3002"}, {"abstract": "Running large language models (LLMs) locally continues to be limited by restrictions of compute and memory on consumer hardware. The popular acceleration technologies, such as quantization, speculative decoding, and adaptive inferencing, offer substantial speed boosts but usually necessitate retraining, per architecture tuning, or draft models. SpecQuant is a trainingfree framework, that combines speculative decoding with multiparent quantization to perform adaptive, efficient inference of LLMs. SpecQuant derives multiple quantized variants (INT4, FP8, FP16) from a shared base model, and dynamically routes queries based on predicted complexity; lightweight variants are used for simple or factual tasks, and full-precision models are used for complex reasoning tasks or long-context inputs. The shared-weight design of SpecQuant ensures sufficient token acceptance for speculative decoding without compatibility issues using separate draft parent models. We evaluate SpecQuant on Qwen2.5 based models on the MMLU, AlpacaEval, and GSM8K datasets, or benchmarks, demonstrating 35-43% speedups without degrading accuracy greater than 2%, substantial within the LLM community. SpecQuant enables practical on-device LLM deployment across diverse hardware without special infrastructure or expertise.", "arxiv_id": "2609.21704", "arxiv_url": "https://arxiv.org/abs/2609.21704", "authors": ["Harish KB", "Jagadeeswaran M", "Pradheep P", "Yuvanesh S", "Sivakumar T"], "brief": "SpecQuant \u662f\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684 LLM \u9ad8\u6548\u63a8\u7406\u6846\u67b6\uff0c\u5c06\u63a8\u6d4b\u89e3\u7801\u4e0e\u591a\u7236\u91cf\u5316\u7ed3\u5408\uff0c\u4ece\u540c\u4e00\u57fa\u7840\u6a21\u578b\u6d3e\u751f INT4\u3001FP8\u3001FP16 \u7b49\u53d8\u4f53\u3002\u5b83\u6839\u636e\u8f93\u5165\u590d\u6742\u5ea6\u52a8\u6001\u9009\u62e9\u8f7b\u91cf\u6216\u5168\u7cbe\u5ea6\u6a21\u578b\uff0c\u5728\u4fdd\u8bc1\u7cbe\u5ea6\u7684\u540c\u65f6\u63d0\u5347\u672c\u5730\u63a8\u7406\u901f\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21704", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ece\u5171\u4eab\u57fa\u7840\u6a21\u578b\u751f\u6210\u591a\u4e2a\u91cf\u5316\u7cbe\u5ea6\u7248\u672c\uff0c\u907f\u514d\u4f7f\u7528\u72ec\u7acb draft \u6a21\u578b\u5e26\u6765\u7684\u517c\u5bb9\u6027\u95ee\u9898", "\u57fa\u4e8e\u67e5\u8be2\u590d\u6742\u5ea6\u8fdb\u884c\u81ea\u9002\u5e94\u8def\u7531\uff1a\u7b80\u5355\u4e8b\u5b9e\u4efb\u52a1\u7528\u4f4e\u7cbe\u5ea6\u6a21\u578b\uff0c\u590d\u6742\u63a8\u7406\u6216\u957f\u4e0a\u4e0b\u6587\u7528\u9ad8\u7cbe\u5ea6\u6a21\u578b", "\u5728 Qwen2.5 \u7cfb\u5217\u6a21\u578b\u7684 MMLU\u3001AlpacaEval\u3001GSM8K \u4e0a\u5b9e\u73b0 35-43% \u52a0\u901f\uff0c\u7cbe\u5ea6\u4e0b\u964d\u4e0d\u8d85\u8fc7 2%"], "keywords": ["\u5927\u6a21\u578b\u63a8\u7406", "\u91cf\u5316", "\u63a8\u6d4b\u89e3\u7801", "\u81ea\u9002\u5e94\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21704v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "SpecQuant: Speculative Decoding with Multi-Parent Quantization for Adaptive LLM Inference", "tldr": "\u65e0\u8bad\u7ec3\u91cf\u5316\u63a8\u6d4b\u89e3\u7801\u52a0\u901f\u672c\u5730LLM\u63a8\u7406", "upvotes": 0, "what_it_is": "SpecQuant \u662f\u4e00\u4e2a\u65e0\u9700\u8bad\u7ec3\u7684 LLM \u9ad8\u6548\u63a8\u7406\u6846\u67b6\uff0c\u5c06\u63a8\u6d4b\u89e3\u7801\u4e0e\u591a\u7236\u91cf\u5316\u7ed3\u5408\uff0c\u4ece\u540c\u4e00\u57fa\u7840\u6a21\u578b\u6d3e\u751f INT4\u3001FP8\u3001FP16 \u7b49\u53d8\u4f53\u3002\u5b83\u6839\u636e\u8f93\u5165\u590d\u6742\u5ea6\u52a8\u6001\u9009\u62e9\u8f7b\u91cf\u6216\u5168\u7cbe\u5ea6\u6a21\u578b\uff0c\u5728\u4fdd\u8bc1\u7cbe\u5ea6\u7684\u540c\u65f6\u63d0\u5347\u672c\u5730\u63a8\u7406\u901f\u5ea6\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u91cf\u5316\u3001\u63a8\u6d4b\u89e3\u7801\u548c\u81ea\u9002\u5e94\u63a8\u7406\u7edf\u4e00\u5230\u65e0\u9700\u8bad\u7ec3\u7684\u6846\u67b6\u4e2d\uff0c\u964d\u4f4e\u4e86\u672c\u5730\u90e8\u7f72 LLM \u7684\u95e8\u69db\uff0c\u5bf9\u6d88\u8d39\u7ea7\u786c\u4ef6\u4e0a\u7684\u9ad8\u6548\u63a8\u7406\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Recurrent Transformers increase computational depth through temporal recurrence, feeding each token\u0027s high-level hidden state into the computation of the next. This raises a natural question: is additional computation better spent on more temporal steps or greater physical depth? We investigate this question using Latent Recurrent Transformers (LRTs), which retain one backbone forward pass per vocabulary token during decoding and provide a controlled setting for comparing these two ways of adding computation. Specifically, we insert a latent thought token between consecutive vocabulary tokens. Each thought token passes through the same $L$ layers as a vocabulary token, sharing the backbone parameters and providing an additional stage of hidden-state refinement before predicting the next token. We compare this $L$-layer LRT against a $2L$-layer LRT without thought tokens. Both execute $2L$ Transformer blocks per vocabulary token during decoding, but the thought-token model uses fewer parameters. On 16- and 20-layer mixture-of-experts NanoChat backbones, one thought token brings the shallower model within 0.006 and 0.004 bits per byte of its double-depth counterpart, recovering 67% and 81% of the improvement with approximately 48% fewer total parameters. These results suggest that temporal thinking offers a parameter-efficient alternative to increasing physical depth in recurrent Transformers.", "arxiv_id": "2609.21605", "arxiv_url": "https://arxiv.org/abs/2609.21605", "authors": ["Zeyi Huang", "Xuehai He", "Yong Jae Lee", "Yelong Shen"], "brief": "\u8bba\u6587\u7814\u7a76\u5faa\u73af Transformer \u4e2d\u989d\u5916\u8ba1\u7b97\u5e94\u6295\u5165\u65f6\u95f4\u9012\u5f52\u8fd8\u662f\u7269\u7406\u6df1\u5ea6\u3002\u4f5c\u8005\u5728 Latent Recurrent Transformers \u4e2d\u63d2\u5165\u6f5c\u5728 thought token\uff0c\u5bf9\u6bd4\u540c\u7b49\u89e3\u7801\u8ba1\u7b97\u91cf\u4e0b\u7684\u6d45\u5c42\u9012\u5f52\u6a21\u578b\u4e0e\u53cc\u500d\u6df1\u5ea6\u6a21\u578b\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21605", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u76f8\u90bb\u8bcd\u8868 token \u95f4\u63d2\u5165\u4e00\u4e2a latent thought token\uff0c\u4f7f\u5176\u7ecf\u8fc7\u540c\u4e00\u7ec4 L \u5c42\u5e76\u5171\u4eab\u9aa8\u5e72\u53c2\u6570\uff0c\u7528\u4e8e\u9884\u6d4b\u524d\u7684\u9690\u85cf\u72b6\u6001\u7ec6\u5316", "\u4e0e\u65e0 thought token \u7684 2L \u5c42 LRT \u5bf9\u6bd4\uff0c\u4e24\u8005\u89e3\u7801\u65f6\u6bcf\u4e2a\u8bcd\u8868 token \u90fd\u6267\u884c 2L \u4e2a Transformer block\uff0c\u4f46 thought-token \u6a21\u578b\u53c2\u6570\u66f4\u5c11", "\u5728 16/20 \u5c42 MoE NanoChat \u9aa8\u5e72\u4e0a\uff0c\u6d45\u5c42 thought-token \u6a21\u578b\u4ec5\u843d\u540e\u53cc\u6df1\u5ea6\u6a21\u578b 0.006/0.004 bits per byte\uff0c\u5e76\u4ee5\u7ea6\u5c11 48% \u53c2\u6570\u6062\u590d 67%/81% \u7684\u6536\u76ca"], "keywords": ["\u5faa\u73afTransformer", "\u63a8\u7406\u8ba1\u7b97", "\u53c2\u6570\u6548\u7387", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21605v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Trading Depth for Time in Recurrent Transformers", "tldr": "\u7528\u6f5c\u5728\u601d\u8003\u6b65\u9ad8\u6548\u66ff\u4ee3\u52a0\u6df1Transformer", "upvotes": 0, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5faa\u73af Transformer \u4e2d\u989d\u5916\u8ba1\u7b97\u5e94\u6295\u5165\u65f6\u95f4\u9012\u5f52\u8fd8\u662f\u7269\u7406\u6df1\u5ea6\u3002\u4f5c\u8005\u5728 Latent Recurrent Transformers \u4e2d\u63d2\u5165\u6f5c\u5728 thought token\uff0c\u5bf9\u6bd4\u540c\u7b49\u89e3\u7801\u8ba1\u7b97\u91cf\u4e0b\u7684\u6d45\u5c42\u9012\u5f52\u6a21\u578b\u4e0e\u53cc\u500d\u6df1\u5ea6\u6a21\u578b\u3002", "why_notable": "\u7ed3\u679c\u8868\u660e\uff0c\u5728\u5faa\u73af Transformer \u4e2d\u589e\u52a0\u201c\u65f6\u95f4\u4e0a\u7684\u601d\u8003\u6b65\u201d\u53ef\u4f5c\u4e3a\u52a0\u6df1\u7f51\u7edc\u7684\u53c2\u6570\u9ad8\u6548\u66ff\u4ee3\u65b9\u6848\uff0c\u4e3a\u63d0\u5347\u5927\u6a21\u578b\u63a8\u7406\u80fd\u529b\u4e0e\u8ba1\u7b97-\u53c2\u6570\u6743\u8861\u63d0\u4f9b\u4e86\u5b9e\u8bc1\u4f9d\u636e\u3002"}, {"abstract": "Post-training weight-activation quantization reduces the memory and inference costs of large language models, but aggressive W4A4 quantization remains difficult because activation outliers degrade effective quantization resolution. Although weight optimization, channel-wise scaling, and orthogonal rotation mitigate this problem, the error components they address and their relationship remain unclear. Using an exact decomposition of local weight-activation quantization error into an activation-guided weight compensation term and an orthogonal residual, we bound the residual using persistent channel-wise outlier and regular activation quantities. This decomposition clarifies which error components can be addressed by weight compensation and which require transformation design. We then use the residual bounds to derive practical guidelines for applying randomized Hadamard rotation, sign selection, and channel scaling. In particular, the analysis explains how random signs suppress constructive interference among persistent outlier channels, how sampling multiple sign patterns can improve transformation selection, and how second-moment balancing leads to an $L_2$ scaling rule while a further relaxation recovers SmoothQuant-style $L_\\infty$ scaling. We evaluate these guidelines through backpropagation-free configurations across eight Llama and Mistral models, obtaining performance competitive with gradient-trained SpinQuant.", "arxiv_id": "2609.21450", "arxiv_url": "https://arxiv.org/abs/2609.21450", "authors": ["Yamato Narita", "Issei Sato"], "brief": "\u672c\u6587\u9488\u5bf9\u5927\u8bed\u8a00\u6a21\u578bW4A4\u8bad\u7ec3\u540e\u91cf\u5316\uff0c\u63d0\u51fa\u4e00\u79cd\u7cbe\u786e\u7684\u5c40\u90e8\u6743\u91cd-\u6fc0\u6d3b\u91cf\u5316\u8bef\u5dee\u5206\u89e3\uff0c\u5c06\u8bef\u5dee\u62c6\u4e3a\u6fc0\u6d3b\u5f15\u5bfc\u7684\u6743\u91cd\u8865\u507f\u9879\u4e0e\u6b63\u4ea4\u6b8b\u5dee\u3002\u57fa\u4e8e\u8be5\u5206\u89e3\uff0c\u8bba\u6587\u63a8\u5bfc\u4e86Hadamard\u65cb\u8f6c\u3001\u7b26\u53f7\u9009\u62e9\u548c\u901a\u9053\u7f29\u653e\u7684\u5b9e\u7528\u51c6\u5219\uff0c\u5e76\u5728\u65e0\u9700\u53cd\u5411\u4f20\u64ad\u7684\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u63a5\u8fd1SpinQuant\u7684\u6548\u679c\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21450", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u91cf\u5316\u8bef\u5dee\u5206\u89e3\u4e3a\u53ef\u7531\u6743\u91cd\u8865\u507f\u5904\u7406\u7684\u90e8\u5206\u548c\u9700\u8981\u53d8\u6362\u8bbe\u8ba1\u5904\u7406\u7684\u6b63\u4ea4\u6b8b\u5dee\uff0c\u6f84\u6e05\u4e0d\u540c\u91cf\u5316\u6280\u672f\u7684\u4f5c\u7528\u8fb9\u754c\u3002", "\u4ece\u6b8b\u5dee\u4e0a\u754c\u89e3\u91ca\u968f\u673a\u7b26\u53f7\u5982\u4f55\u6291\u5236\u5f02\u5e38\u901a\u9053\u95f4\u7684\u5efa\u8bbe\u6027\u5e72\u6270\uff0c\u5e76\u8bf4\u660e\u91c7\u6837\u591a\u4e2a\u7b26\u53f7\u6a21\u5f0f\u53ef\u63d0\u5347\u53d8\u6362\u9009\u62e9\u3002", "\u63a8\u5bfc\u4e8c\u9636\u77e9\u5e73\u8861\u5bf9\u5e94\u7684L2\u7f29\u653e\u89c4\u5219\uff0c\u5e76\u5728\u8fdb\u4e00\u6b65\u653e\u677e\u540e\u6062\u590dSmoothQuant\u98ce\u683c\u7684L\u221e\u7f29\u653e\u3002"], "keywords": ["\u6a21\u578b\u91cf\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u538b\u7f29", "\u63a8\u7406\u52a0\u901f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21450v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Understanding LLM Quantization through Activation-Guided Compensation and Orthogonal Residuals", "tldr": "\u7528\u8bef\u5dee\u5206\u89e3\u89e3\u91ca\u5e76\u6539\u8fdbLLM\u4f4e\u6bd4\u7279\u91cf\u5316\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u9488\u5bf9\u5927\u8bed\u8a00\u6a21\u578bW4A4\u8bad\u7ec3\u540e\u91cf\u5316\uff0c\u63d0\u51fa\u4e00\u79cd\u7cbe\u786e\u7684\u5c40\u90e8\u6743\u91cd-\u6fc0\u6d3b\u91cf\u5316\u8bef\u5dee\u5206\u89e3\uff0c\u5c06\u8bef\u5dee\u62c6\u4e3a\u6fc0\u6d3b\u5f15\u5bfc\u7684\u6743\u91cd\u8865\u507f\u9879\u4e0e\u6b63\u4ea4\u6b8b\u5dee\u3002\u57fa\u4e8e\u8be5\u5206\u89e3\uff0c\u8bba\u6587\u63a8\u5bfc\u4e86Hadamard\u65cb\u8f6c\u3001\u7b26\u53f7\u9009\u62e9\u548c\u901a\u9053\u7f29\u653e\u7684\u5b9e\u7528\u51c6\u5219\uff0c\u5e76\u5728\u65e0\u9700\u53cd\u5411\u4f20\u64ad\u7684\u8bbe\u7f6e\u4e0b\u53d6\u5f97\u63a5\u8fd1SpinQuant\u7684\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e0d\u662f\u5355\u7eaf\u63d0\u51fa\u65b0\u91cf\u5316\u7b97\u6cd5\uff0c\u800c\u662f\u4e3aW4A4\u91cf\u5316\u4e2d\u5f02\u5e38\u6fc0\u6d3b\u3001\u65cb\u8f6c\u3001\u7f29\u653e\u548c\u6743\u91cd\u8865\u507f\u4e4b\u95f4\u7684\u5173\u7cfb\u63d0\u4f9b\u7edf\u4e00\u7406\u8bba\u89e3\u91ca\uff0c\u5e76\u7ed9\u51fa\u65e0\u9700\u68af\u5ea6\u8bad\u7ec3\u7684\u5b9e\u7528\u914d\u7f6e\uff0c\u5bf9\u4f4e\u6210\u672c\u90e8\u7f72\u5927\u8bed\u8a00\u6a21\u578b\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Humanoid locomotion over complex terrain requires anticipating footholds that may no longer be visible at touchdown. Limited camera coverage and self-occlusion make it necessary to retrieve relevant terrain information from earlier observations. We present FootQuery, a perceptive locomotion framework that queries depth history using each foot\u0027s predicted next touchdown. The policy predicts touchdown locations and uncertainty from proprioception and uses these distributions, together with per-foot features, to query sparsely sampled historical depth frames. During training, realized contacts are projected into historical images to supervise retrieval at the regions where those contacts were visible. The retrieved per-foot features are fused with global visual memory to generate control actions. A progressive force-assistance curriculum supports early exploration, while event-consistent tread-midline shaping encourages coordinated stair contacts. Deployment requires only proprioception and onboard depth images. In simulation, the complete framework outperforms its component ablations on the most challenging tested stairs, gaps, and platforms. Real-world experiments on a Unitree G1 demonstrate continuous traversal with a single policy across outdoor stairs and indoor routes combining stair ascent and descent, platforms, and gaps. These results support organizing visual history around anticipated contacts for perceptive humanoid locomotion.", "arxiv_id": "2609.21447", "arxiv_url": "https://arxiv.org/abs/2609.21447", "authors": ["Tao Dong", "Jia Yu", "Yuxuan Fan", "Linna Zhao", "Jiaqi Gong", "Andong Yang", "Chao Gao", "Guyue Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa FootQuery\uff0c\u4e00\u79cd\u611f\u77e5\u5f0f\u4eba\u5f62\u673a\u5668\u4eba\u8fd0\u52a8\u6846\u67b6\uff1a\u6839\u636e\u6bcf\u53ea\u811a\u9884\u6d4b\u7684\u4e0b\u4e00\u6b21\u89e6\u5730\u4f4d\u7f6e\u53ca\u4e0d\u786e\u5b9a\u6027\uff0c\u4ece\u5386\u53f2\u6df1\u5ea6\u56fe\u4e2d\u68c0\u7d22\u76f8\u5173\u5730\u5f62\u4fe1\u606f\uff0c\u5e76\u878d\u5408\u89c6\u89c9\u8bb0\u5fc6\u751f\u6210\u63a7\u5236\u52a8\u4f5c\u3002", "categories": ["cs.RO", "cs.LG", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21447", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u201c\u672a\u6765\u89e6\u5730\u70b9\u201d\u4e3a\u67e5\u8be2\u951a\u70b9\uff0c\u4ece\u7a00\u758f\u5386\u53f2\u6df1\u5ea6\u5e27\u4e2d\u627e\u56de\u5f53\u524d\u4e0d\u53ef\u89c1\u4f46\u843d\u811a\u65f6\u5173\u952e\u7684\u5730\u5f62\u4fe1\u606f\u3002", "\u8bad\u7ec3\u65f6\u5c06\u771f\u5b9e\u63a5\u89e6\u70b9\u6295\u5f71\u56de\u5386\u53f2\u56fe\u50cf\uff0c\u76d1\u7763\u6a21\u578b\u5728\u63a5\u89e6\u66fe\u53ef\u89c1\u533a\u57df\u8fdb\u884c\u68c0\u7d22\u3002", "\u7ed3\u5408\u6e10\u8fdb\u5f0f\u529b\u8f85\u52a9\u8bfe\u7a0b\u548c\u697c\u68af\u4e2d\u7ebf\u4e8b\u4ef6\u4e00\u81f4\u6027\u5851\u5f62\uff0c\u5728\u4eff\u771f\u4e0e Unitree G1 \u5b9e\u673a\u4e0a\u9a8c\u8bc1\u53ef\u8de8\u697c\u68af\u3001\u5e73\u53f0\u548c\u95f4\u9699\u8fde\u7eed\u884c\u8d70\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u4eba\u5f62\u8fd0\u52a8", "\u89c6\u89c9\u8bb0\u5fc6", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21447v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "FootQuery: Future-Touchdown-Guided Retrieval from Depth History for Perceptive Humanoid Locomotion", "tldr": "\u7528\u9884\u6d4b\u843d\u811a\u70b9\u68c0\u7d22\u6df1\u5ea6\u5386\u53f2\uff0c\u63d0\u5347\u4eba\u5f62\u673a\u5668\u4eba\u8d8a\u969c\u884c\u8d70\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa FootQuery\uff0c\u4e00\u79cd\u611f\u77e5\u5f0f\u4eba\u5f62\u673a\u5668\u4eba\u8fd0\u52a8\u6846\u67b6\uff1a\u6839\u636e\u6bcf\u53ea\u811a\u9884\u6d4b\u7684\u4e0b\u4e00\u6b21\u89e6\u5730\u4f4d\u7f6e\u53ca\u4e0d\u786e\u5b9a\u6027\uff0c\u4ece\u5386\u53f2\u6df1\u5ea6\u56fe\u4e2d\u68c0\u7d22\u76f8\u5173\u5730\u5f62\u4fe1\u606f\uff0c\u5e76\u878d\u5408\u89c6\u89c9\u8bb0\u5fc6\u751f\u6210\u63a7\u5236\u52a8\u4f5c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u4eba\u5f62\u673a\u5668\u4eba\u5728\u590d\u6742\u5730\u5f62\u4e2d\u5e38\u89c1\u7684\u89c6\u91ce\u53d7\u9650\u548c\u81ea\u906e\u6321\u95ee\u9898\uff0c\u5c06\u89c6\u89c9\u5386\u53f2\u6309\u9884\u671f\u63a5\u89e6\u7ec4\u7ec7\u8d77\u6765\uff0c\u663e\u8457\u589e\u5f3a\u4e86\u843d\u811a\u611f\u77e5\u4e0e\u5b9e\u673a\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Multimodal large reasoning models (MLRMs) have demonstrated remarkable capabilities in complex visual understanding. However, this very power introduces a critical yet underexplored privacy threat: adversaries can exploit MLRMs to precisely infer users\u0027 geographic locations from casually shared photographs, by performing structured reasoning over subtle visual cues such as architectural styles, vegetation, and lighting conditions. In this work, we present a systematic study of MLRM-driven geolocation privacy leakage. We first reveal that refusal-based safeguards are critically insufficient, as carefully crafted jailbreak prompts can raise model response rates to 100%. We further identify that existing defenses, which inject imperceptible perturbations into shared images, suffer from structural limitations intrinsic to their pixel-space optimization, resulting in degraded black-box transferability and pronounced visual artifacts. Motivated by these findings, we propose a diffusion-based framework that provides targeted, proactive defense against geolocation privacy leakage. By injecting perturbations into the latent space of a diffusion model during reverse sampling, our method operates directly on high-level semantic representations, thereby resolving the effectiveness-utility bottlenecks by construction. We further ground our optimization with GeoCLIP, a model explicitly aligned with GPS coordinates, as a surrogate to pinpoint and disrupt the geographic signals that MLRMs exploit for location inference. This targeted semantic disruption yields significantly stronger black-box transferability while preserving perceptual image quality, offering a seamless integration on social media platforms.", "arxiv_id": "2609.21363", "arxiv_url": "https://arxiv.org/abs/2609.21363", "authors": ["Yining Wang", "Xi Li", "Mi Zhang", "Xiaohan Zhang", "Xiaoyu You", "Zhenxing Qian", "Mi Wen"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u591a\u6a21\u6001\u5927\u63a8\u7406\u6a21\u578b\u4ece\u666e\u901a\u7167\u7247\u4e2d\u63a8\u65ad\u7528\u6237\u5730\u7406\u4f4d\u7f6e\u7684\u9690\u79c1\u98ce\u9669\uff0c\u5e76\u6307\u51fa\u62d2\u7b54\u5f0f\u9632\u62a4\u53ef\u88ab\u8d8a\u72f1\u63d0\u793a\u8f7b\u6613\u7ed5\u8fc7\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u6269\u6563\u6a21\u578b\u6f5c\u7a7a\u95f4\u6270\u52a8\u7684\u9632\u5fa1\u6846\u67b6\uff0c\u5b9a\u5411\u7834\u574f\u56fe\u50cf\u4e2d\u7684\u5730\u7406\u8bed\u4e49\u7ebf\u7d22\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21363", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u53d1\u73b0\u62d2\u7b54\u7c7b\u5b89\u5168\u7b56\u7565\u4e0d\u8db3\uff1a\u7cbe\u5fc3\u8bbe\u8ba1\u7684\u8d8a\u72f1\u63d0\u793a\u53ef\u5c06\u6a21\u578b\u5730\u7406\u5b9a\u4f4d\u54cd\u5e94\u7387\u63d0\u5347\u81f3100%\u3002", "\u6307\u51fa\u73b0\u6709\u50cf\u7d20\u7a7a\u95f4\u4e0d\u53ef\u611f\u77e5\u6270\u52a8\u9632\u5fa1\u5b58\u5728\u9ed1\u76d2\u8fc1\u79fb\u6027\u5dee\u3001\u89c6\u89c9\u4f2a\u5f71\u660e\u663e\u7b49\u7ed3\u6784\u6027\u7f3a\u9677\u3002", "\u5728\u6269\u6563\u6a21\u578b\u53cd\u5411\u91c7\u6837\u7684\u6f5c\u7a7a\u95f4\u6ce8\u5165\u6270\u52a8\uff0c\u5e76\u4f7f\u7528\u4e0eGPS\u5750\u6807\u5bf9\u9f50\u7684GeoCLIP\u4f5c\u4e3a\u4ee3\u7406\u6a21\u578b\u6765\u5b9a\u4f4d\u548c\u524a\u5f31\u5730\u7406\u4fe1\u53f7\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u9690\u79c1\u4fdd\u62a4", "\u6269\u6563\u6a21\u578b", "\u5bf9\u6297\u9632\u5fa1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21363v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Hiding in Plain Sight: A Diffusion-based Mitigation of Geolocation Privacy Leakage in Vision-Language Models", "tldr": "\u7528\u6269\u6563\u6f5c\u7a7a\u95f4\u6270\u52a8\u9632\u6b62\u7167\u7247\u6cc4\u9732\u5730\u7406\u4f4d\u7f6e", "upvotes": 0, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u4e86\u591a\u6a21\u6001\u5927\u63a8\u7406\u6a21\u578b\u4ece\u666e\u901a\u7167\u7247\u4e2d\u63a8\u65ad\u7528\u6237\u5730\u7406\u4f4d\u7f6e\u7684\u9690\u79c1\u98ce\u9669\uff0c\u5e76\u6307\u51fa\u62d2\u7b54\u5f0f\u9632\u62a4\u53ef\u88ab\u8d8a\u72f1\u63d0\u793a\u8f7b\u6613\u7ed5\u8fc7\u3002\u4f5c\u8005\u63d0\u51fa\u4e00\u79cd\u57fa\u4e8e\u6269\u6563\u6a21\u578b\u6f5c\u7a7a\u95f4\u6270\u52a8\u7684\u9632\u5fa1\u6846\u67b6\uff0c\u5b9a\u5411\u7834\u574f\u56fe\u50cf\u4e2d\u7684\u5730\u7406\u8bed\u4e49\u7ebf\u7d22\uff0c\u540c\u65f6\u5c3d\u91cf\u4fdd\u6301\u89c6\u89c9\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u5730\u7406\u4f4d\u7f6e\u9690\u79c1\u6cc4\u9732\u95ee\u9898\u5177\u4f53\u5316\u5e76\u7ed9\u51fa\u4e3b\u52a8\u9632\u5fa1\u65b9\u6848\uff0c\u76f8\u6bd4\u4f20\u7edf\u50cf\u7d20\u6270\u52a8\u66f4\u5173\u6ce8\u9ad8\u5c42\u8bed\u4e49\u7ebf\u7d22\uff0c\u517c\u987e\u9ed1\u76d2\u8fc1\u79fb\u6027\u4e0e\u56fe\u50cf\u53ef\u7528\u6027\uff0c\u9002\u5408\u793e\u4ea4\u5a92\u4f53\u573a\u666f\u4e2d\u7684\u9690\u79c1\u4fdd\u62a4\u3002"}, {"abstract": "How many human judgments does a panel of language models represent? The answer depends on what is matched. We audit categorical judge panels against empirical human label distributions, retaining disagreement that binary errors relative to one gold label collapse. We measure spectral residual diversity by matching the participation ratio of a normalized residual Gram matrix to conditionally independent human-reference draws, giving nu_H. We separately match distributional squared error, giving nu_MSE. Across three ChaosNLI tasks, the same 32-judge panels have nu_H=4.24--6.50 but nu_MSE=2.30--3.75. A spectral identity separates the eigenvalues, member energies, and averaging-direction weights that determine error. Realizable hard-label panels show that greater spectral diversity can accompany worse distribution recovery even with equal member energies and nonnegative correlations. In the observed panels, within-size ranking agreement varies sharply by task; some member additions produce conflicting changes that persist across two item halves. The consensus-direction share of centered residual variance is gamma_co=43.8% on MNLI-m and 33.7% on SNLI, quantifying shared variation retained by averaging. We provide aligned votes and analysis protocols for auditing these distinctions. Effective size is therefore a target-specific measurement: spectral diversity and distribution recovery should not be treated as interchangeable measures of panel quality or as general human-replacement rates.", "arxiv_id": "2609.21277", "arxiv_url": "https://arxiv.org/abs/2609.21277", "authors": ["Chao Li", "Yingying Yu", "Yunfeng Li"], "brief": "\u8fd9\u7bc7\u8bba\u6587\u5ba1\u8ba1\u7531\u591a\u4e2a\u8bed\u8a00\u6a21\u578b\u7ec4\u6210\u7684\u5206\u7c7b\u8bc4\u5ba1\u56e2\uff0c\u6bd4\u8f83\u5176\u6295\u7968\u5206\u5e03\u4e0e\u771f\u5b9e\u4eba\u7c7b\u6807\u7b7e\u5206\u5e03\u7684\u5dee\u5f02\u3002\u4f5c\u8005\u63d0\u51fa\u4e24\u79cd\u201c\u7b49\u6548\u4eba\u7c7b\u6570\u201d\u5ea6\u91cf\uff1a\u57fa\u4e8e\u6b8b\u5dee\u8c31\u591a\u6837\u6027\u7684 nu_H\uff0c\u4ee5\u53ca\u57fa\u4e8e\u5206\u5e03\u5747\u65b9\u8bef\u5dee\u7684 nu_MSE\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21277", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u4e09\u4e2a ChaosNLI \u4efb\u52a1\u4e0a\uff0c\u540c\u4e00\u7ec432\u4e2a\u6a21\u578b\u8bc4\u5ba1\u7684\u8c31\u591a\u6837\u6027\u7b49\u6548\u4eba\u7c7b\u6570 nu_H \u4e3a4.24\u52306.50\uff0c\u4f46\u5206\u5e03\u6062\u590d\u7b49\u6548\u4eba\u7c7b\u6570 nu_MSE \u4ec5\u4e3a2.30\u52303.75\u3002", "\u8bba\u6587\u8bc1\u660e\u5e76\u5b9e\u8bc1\u5c55\u793a\uff1a\u66f4\u9ad8\u7684\u8c31\u591a\u6837\u6027\u4e0d\u4e00\u5b9a\u5e26\u6765\u66f4\u597d\u7684\u6807\u7b7e\u5206\u5e03\u6062\u590d\uff0c\u5373\u4f7f\u6210\u5458\u80fd\u91cf\u76f8\u540c\u4e14\u76f8\u5173\u6027\u975e\u8d1f\u4e5f\u53ef\u80fd\u5982\u6b64\u3002", "\u6a21\u578b\u8bc4\u5ba1\u7684\u5e73\u5747\u7ed3\u679c\u4fdd\u7559\u4e86\u663e\u8457\u5171\u4eab\u504f\u5dee\uff1aMNLI-m \u4e0a\u5171\u8bc6\u65b9\u5411\u5360\u4e2d\u5fc3\u5316\u6b8b\u5dee\u65b9\u5dee\u768443.8%\uff0cSNLI \u4e0a\u4e3a33.7%\u3002"], "keywords": ["LLM\u8bc4\u5ba1", "\u6a21\u578b\u8bc4\u4f30", "\u4eba\u7c7b\u6807\u6ce8", "\u81ea\u7136\u8bed\u8a00\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21277v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "How Many Humans Is a Judge Panel Worth?", "tldr": "LLM\u8bc4\u5ba1\u56e2\u7b49\u6548\u4eba\u7c7b\u6570\u53d6\u51b3\u4e8e\u5ea6\u91cf\u76ee\u6807", "upvotes": 0, "what_it_is": "\u8fd9\u7bc7\u8bba\u6587\u5ba1\u8ba1\u7531\u591a\u4e2a\u8bed\u8a00\u6a21\u578b\u7ec4\u6210\u7684\u5206\u7c7b\u8bc4\u5ba1\u56e2\uff0c\u6bd4\u8f83\u5176\u6295\u7968\u5206\u5e03\u4e0e\u771f\u5b9e\u4eba\u7c7b\u6807\u7b7e\u5206\u5e03\u7684\u5dee\u5f02\u3002\u4f5c\u8005\u63d0\u51fa\u4e24\u79cd\u201c\u7b49\u6548\u4eba\u7c7b\u6570\u201d\u5ea6\u91cf\uff1a\u57fa\u4e8e\u6b8b\u5dee\u8c31\u591a\u6837\u6027\u7684 nu_H\uff0c\u4ee5\u53ca\u57fa\u4e8e\u5206\u5e03\u5747\u65b9\u8bef\u5dee\u7684 nu_MSE\u3002", "why_notable": "\u8be5\u7814\u7a76\u63d0\u9192\u4e0d\u80fd\u7b80\u5355\u628aLLM\u8bc4\u5ba1\u56e2\u6298\u7b97\u6210\u56fa\u5b9a\u6570\u91cf\u7684\u4eba\u7c7b\u6807\u6ce8\u8005\uff0c\u4e5f\u4e0d\u80fd\u628a\u591a\u6837\u6027\u7b49\u540c\u4e8e\u8bc4\u4f30\u8d28\u91cf\uff1b\u5bf9\u6784\u5efa\u81ea\u52a8\u8bc4\u6d4b\u3001\u6a21\u578b\u88c1\u5224\u548c\u4eba\u7c7b\u66ff\u4ee3\u6807\u6ce8\u6d41\u7a0b\u5177\u6709\u76f4\u63a5\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Does a general vision--language model acquire specialized OCR ability by developing a new reading circuit or by reusing an existing mechanism? We address this question in the setting of full-sequence OCR, rather than local-answer retrieval. Using an evidence-grounded protocol with held-out causal interventions, we identify sparse and stable OCR-head sets in GLM-OCR, MinerU2.5, and PaddleOCR-VL-1.6. We then investigate the mechanistic origin of these OCR heads by comparing them with independently identified textual retrieval/copy heads in general VLMs. Across two general VLMs, visual OCR heads strongly overlap independently identified textual retrieval/copy heads, yielding untuned top-20 intersections of 73.3% and all-head Spearman correlations of 0.677-0.886. The overlap and causal interventions suggest that full-sequence OCR operates as dense sequential multimodal copy-and-paste, repeatedly retrieving visual evidence and routing it to the current output position. Finally, we examine how this shared circuit changes as a general VLM becomes an OCR specialist. Matched base-to-specialized comparisons show that OCR specialization largely preserves head identity, retaining 17-20 of the top 20 heads per task with all-head rank correlations of 0.874-0.942, while redistributing their functional and causal strengths.", "arxiv_id": "2609.21543", "arxiv_url": "https://arxiv.org/abs/2609.21543", "authors": ["Yuanxiang Huangfu", "Hanmeng Zhong", "Linqing Chen", "Jeffrey Tiong Jee Hui"], "brief": "\u672c\u6587\u7814\u7a76\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5982\u4f55\u83b7\u5f97\u5168\u5e8f\u5217OCR\u80fd\u529b\uff0c\u53d1\u73b0GLM-OCR\u3001MinerU2.5\u548cPaddleOCR-VL-1.6\u4e2d\u5b58\u5728\u7a00\u758f\u4e14\u7a33\u5b9a\u7684OCR\u6ce8\u610f\u529b\u5934\u96c6\u5408\u3002\u8fdb\u4e00\u6b65\u5bf9\u6bd4\u8868\u660e\uff0c\u8fd9\u4e9bOCR\u5934\u4e0e\u901a\u7528VLM\u4e2d\u7684\u6587\u672c\u68c0\u7d22/\u590d\u5236\u5934\u9ad8\u5ea6\u91cd\u5408\uff0c\u8bf4\u660eOCR\u66f4\u50cf\u662f\u5bc6\u96c6\u7684\u591a\u6a21\u6001\u987a\u5e8f\u590d\u5236\u8fc7\u7a0b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21543", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u57fa\u4e8e\u8bc1\u636e\u7684\u5206\u6790\u534f\u8bae\uff0c\u5e76\u7ed3\u5408\u7559\u51fa\u56e0\u679c\u5e72\u9884\u8bc6\u522b\u7a33\u5b9aOCR heads\u3002", "\u89c6\u89c9OCR heads\u4e0e\u6587\u672c\u68c0\u7d22/\u590d\u5236 heads\u9ad8\u5ea6\u91cd\u53e0\uff0ctop-20\u4ea4\u96c6\u8fbe73.3%\uff0c\u5168\u5934Spearman\u76f8\u5173\u4e3a0.677-0.886\u3002", "\u4ece\u901a\u7528VLM\u5230OCR\u4e13\u7528\u6a21\u578b\u7684\u6f14\u5316\u4e2d\uff0ctop-20 heads\u4fdd\u755917-20\u4e2a\uff0c\u6392\u540d\u76f8\u5173\u8fbe0.874-0.942\uff0c\u4e3b\u8981\u53d8\u5316\u662f\u529f\u80fd\u4e0e\u56e0\u679c\u5f3a\u5ea6\u91cd\u5206\u914d\u3002"], "keywords": ["\u591a\u6a21\u6001", "OCR", "\u53ef\u89e3\u91ca\u6027", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21543v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Retrieval to Recognition:How Vision--Language Models Become OCR Specialists", "tldr": "VLM\u7684OCR\u80fd\u529b\u4e3b\u8981\u590d\u7528\u6587\u672c\u68c0\u7d22/\u590d\u5236\u7535\u8def\u3002", "upvotes": 0, "what_it_is": "\u672c\u6587\u7814\u7a76\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5982\u4f55\u83b7\u5f97\u5168\u5e8f\u5217OCR\u80fd\u529b\uff0c\u53d1\u73b0GLM-OCR\u3001MinerU2.5\u548cPaddleOCR-VL-1.6\u4e2d\u5b58\u5728\u7a00\u758f\u4e14\u7a33\u5b9a\u7684OCR\u6ce8\u610f\u529b\u5934\u96c6\u5408\u3002\u8fdb\u4e00\u6b65\u5bf9\u6bd4\u8868\u660e\uff0c\u8fd9\u4e9bOCR\u5934\u4e0e\u901a\u7528VLM\u4e2d\u7684\u6587\u672c\u68c0\u7d22/\u590d\u5236\u5934\u9ad8\u5ea6\u91cd\u5408\uff0c\u8bf4\u660eOCR\u66f4\u50cf\u662f\u5bc6\u96c6\u7684\u591a\u6a21\u6001\u987a\u5e8f\u590d\u5236\u8fc7\u7a0b\u3002", "why_notable": "\u8bba\u6587\u4ece\u673a\u5236\u53ef\u89e3\u91ca\u6027\u89d2\u5ea6\u63ed\u793aVLM\u4e13\u7528OCR\u80fd\u529b\u5e76\u975e\u65b0\u5efa\u72ec\u7acb\u9605\u8bfb\u7535\u8def\uff0c\u800c\u662f\u590d\u7528\u5e76\u5f3a\u5316\u5df2\u6709\u590d\u5236\u68c0\u7d22\u673a\u5236\uff0c\u6709\u52a9\u4e8e\u7406\u89e3\u591a\u6a21\u6001\u6a21\u578b\u80fd\u529b\u8fc1\u79fb\u4e0e\u4e13\u7528\u5316\u8bad\u7ec3\u7684\u5185\u90e8\u53d8\u5316\u3002"}, {"abstract": "Open-vocabulary 3D scene mapping aims to build a persistent representation of the objects in an environment. Existing systems typically rely on engineered mapping pipelines to associate observations, merge information across views, and maintain a consistent scene representation over time. Many additionally store feature-rich object representations, such as embeddings or image crops, increasing the size and complexity of the persistent memory. We introduce SceneLM, a Scene-Language Model that directly maintains a textual scene map. The full scene is represented as a structured text list of objects, which serves as the model\u0027s only persistent memory. For each input image, the model reads the current scene state and updates the map by adding, editing, and removing objects. To learn this behavior, we introduce supervision tasks for iterative scene map maintenance together with an automatic annotation pipeline that generates training data from images without human labels. We evaluate SceneLM on both a language-grounded retrieval benchmark and a localization benchmark. Across both benchmarks, the model produces a scene map that achieves competitive performance with complete mapping systems built from dedicated perception and geometric modules while producing a scene representation that is 6-12x more compact. We further show that SceneLM can be run online on an edge device through experiments on a quadruped. These results show that a persistent open-vocabulary 3D scene map can be maintained directly by a single vision-language model using only a lightweight text representation. Training and inference code is available on https://goldengait.github.io/scenelm/.", "arxiv_id": "2609.21400", "arxiv_url": "https://arxiv.org/abs/2609.21400", "authors": ["Adam Lilja", "Fabio H\u00fcbel", "Siming He", "Junsheng Fu", "Claire Tomlin", "Lars Hammarstrand", "Jitendra Malik", "Jonas Frey", "Marco Pavone"], "brief": "\u8bba\u6587\u63d0\u51fa SceneLM\uff0c\u4e00\u79cd\u76f4\u63a5\u7ef4\u62a4\u7ed3\u6784\u5316\u6587\u672c\u573a\u666f\u5730\u56fe\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u5c06\u5b8c\u6574\u573a\u666f\u8868\u793a\u4e3a\u5bf9\u8c61\u6587\u672c\u5217\u8868\uff0c\u5e76\u6839\u636e\u6bcf\u5e27\u8f93\u5165\u56fe\u50cf\u81ea\u52a8\u589e\u5220\u6539\u5bf9\u8c61\u72b6\u6001\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21400", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u7ed3\u6784\u5316\u6587\u672c\u5bf9\u8c61\u5217\u8868\u4f5c\u4e3a\u552f\u4e00\u6301\u4e45\u8bb0\u5fc6\uff0c\u66ff\u4ee3\u4f20\u7edf\u7684\u7279\u5f81\u5d4c\u5165\u3001\u56fe\u50cf\u88c1\u526a\u548c\u590d\u6742\u51e0\u4f55\u6a21\u5757", "\u8bbe\u8ba1\u8fed\u4ee3\u5f0f\u573a\u666f\u5730\u56fe\u7ef4\u62a4\u76d1\u7763\u4efb\u52a1\uff0c\u5e76\u7528\u81ea\u52a8\u6807\u6ce8\u6d41\u6c34\u7ebf\u4ece\u65e0\u4eba\u5de5\u6807\u7b7e\u56fe\u50cf\u751f\u6210\u8bad\u7ec3\u6570\u636e", "\u5728\u8bed\u8a00\u68c0\u7d22\u548c\u5b9a\u4f4d\u57fa\u51c6\u4e0a\u63a5\u8fd1\u4e13\u7528\u611f\u77e5/\u51e0\u4f55\u7cfb\u7edf\uff0c\u540c\u65f6\u573a\u666f\u8868\u793a\u538b\u7f296-12\u500d\uff0c\u5e76\u53ef\u5728\u56db\u8db3\u673a\u5668\u4eba\u8fb9\u7f18\u8bbe\u5907\u5728\u7ebf\u8fd0\u884c"], "keywords": ["\u5f00\u653e\u8bcd\u6c47", "\u573a\u666f\u5efa\u56fe", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21400v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "A Scene Language Model for Open-Vocabulary Scene Mapping", "tldr": "\u7528\u6587\u672c\u8bb0\u5fc6\u5b9e\u73b0\u5f00\u653e\u8bcd\u6c473D\u573a\u666f\u5730\u56fe", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SceneLM\uff0c\u4e00\u79cd\u76f4\u63a5\u7ef4\u62a4\u7ed3\u6784\u5316\u6587\u672c\u573a\u666f\u5730\u56fe\u7684\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u3002\u5b83\u5c06\u5b8c\u6574\u573a\u666f\u8868\u793a\u4e3a\u5bf9\u8c61\u6587\u672c\u5217\u8868\uff0c\u5e76\u6839\u636e\u6bcf\u5e27\u8f93\u5165\u56fe\u50cf\u81ea\u52a8\u589e\u5220\u6539\u5bf9\u8c61\u72b6\u6001\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u5f00\u653e\u8bcd\u6c473D\u573a\u666f\u5efa\u56fe\u53ef\u4ee5\u7531\u5355\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4ee5\u8f7b\u91cf\u6587\u672c\u5f62\u5f0f\u6301\u7eed\u7ef4\u62a4\uff0c\u964d\u4f4e\u673a\u5668\u4eba\u957f\u671f\u8bb0\u5fc6\u7684\u590d\u6742\u5ea6\u548c\u5b58\u50a8\u6210\u672c\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u4e0e\u5728\u7ebf\u573a\u666f\u7406\u89e3\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Social Proactive Intelligence (SPI) extends proactive assistance beyond task completeness to consider social appropriateness in diverse embodied scenarios. However, prior SPI research faces two key limitations. First, existing work focuses on static images, whereas dynamic videos provide crucial cues for inferring human states and needs, offering richer information than isolated images. Second, prior work often relies on free-form data collection pipelines, which fail to guarantee comprehensive coverage of diverse scenarios. To address these gaps, we introduce RobotEQ-Video, shifting the focus from image-centric to video-centric analysis. To ensure comprehensive video coverage, we construct a hierarchical world-state taxonomy organized into a four-level coarse-to-fine structure, comprising 6 domains, 20 dimensions, 142 level-1 attributes, and 816 level-2 attributes. The resulting benchmark comprises 2K+ videos with 100K+ human annotations and 16K+ labels for assessing behavior properness. Benchmark evaluation reveals that current systems remain unreliable and fall short of human performance. We further explore how world models can help tackle this task. This work advances SPI research from static images to dynamic videos and ensures more comprehensive scenario coverage during benchmarking.", "arxiv_id": "2609.21371", "arxiv_url": "https://arxiv.org/abs/2609.21371", "authors": ["Xinyi Che", "Zheng Lian", "Kuofei Fang", "Xuehao Wang", "Xinghai Gao", "Junqing Wu", "Chuyu Wu", "Liyi Liu", "Yanhan Huang", "Keyi Xie", "Haomin Ouyang", "Jinyang Wu", "Fan Zhang", "Runhao Zeng", "Xun Yang", "Bin He"], "brief": "\u8bba\u6587\u63d0\u51fa RobotEQ-Video\uff0c\u5c06\u793e\u4ea4\u4e3b\u52a8\u667a\u80fd\u8bc4\u6d4b\u4ece\u9759\u6001\u56fe\u50cf\u6269\u5c55\u5230\u52a8\u6001\u89c6\u9891\u3002\u5b83\u6784\u5efa\u4e86\u5206\u5c42\u4e16\u754c\u72b6\u6001\u5206\u7c7b\u4f53\u7cfb\uff0c\u5e76\u6536\u96c6\u4e86\u8986\u76d6\u591a\u573a\u666f\u7684\u89c6\u9891\u4e0e\u4eba\u5de5\u6807\u6ce8\uff0c\u7528\u4e8e\u8bc4\u4f30\u7cfb\u7edf\u5728\u5177\u8eab\u573a\u666f\u4e2d\u5224\u65ad\u884c\u4e3a\u662f\u5426\u5f97\u4f53\u7684\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.HC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21371", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u6784\u5efa\u56db\u5c42\u7c97\u5230\u7ec6\u7684\u4e16\u754c\u72b6\u6001\u5206\u7c7b\u4f53\u7cfb\uff0c\u5305\u542b6\u4e2a\u9886\u57df\u300120\u4e2a\u7ef4\u5ea6\u3001142\u4e2a\u4e00\u7ea7\u5c5e\u6027\u548c816\u4e2a\u4e8c\u7ea7\u5c5e\u6027", "\u57fa\u51c6\u5305\u542b2000\u591a\u4e2a\u89c6\u9891\u300110\u4e07\u4f59\u6761\u4eba\u5de5\u6807\u6ce8\uff0c\u4ee5\u53ca1.6\u4e07\u4f59\u4e2a\u884c\u4e3a\u5f97\u4f53\u6027\u6807\u7b7e", "\u8bc4\u6d4b\u663e\u793a\u5f53\u524d\u7cfb\u7edf\u5728\u89c6\u9891\u793e\u4ea4\u4e3b\u52a8\u667a\u80fd\u4efb\u52a1\u4e0a\u4ecd\u4e0d\u7a33\u5b9a\uff0c\u663e\u8457\u843d\u540e\u4e8e\u4eba\u7c7b\u8868\u73b0"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u9891\u7406\u89e3", "\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21371v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RobotEQ-Video: A Video-Centric Benchmark for Social Proactive Intelligence with World-State Taxonomy", "tldr": "\u9762\u5411\u89c6\u9891\u7684\u793e\u4ea4\u4e3b\u52a8\u667a\u80fd\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa RobotEQ-Video\uff0c\u5c06\u793e\u4ea4\u4e3b\u52a8\u667a\u80fd\u8bc4\u6d4b\u4ece\u9759\u6001\u56fe\u50cf\u6269\u5c55\u5230\u52a8\u6001\u89c6\u9891\u3002\u5b83\u6784\u5efa\u4e86\u5206\u5c42\u4e16\u754c\u72b6\u6001\u5206\u7c7b\u4f53\u7cfb\uff0c\u5e76\u6536\u96c6\u4e86\u8986\u76d6\u591a\u573a\u666f\u7684\u89c6\u9891\u4e0e\u4eba\u5de5\u6807\u6ce8\uff0c\u7528\u4e8e\u8bc4\u4f30\u7cfb\u7edf\u5728\u5177\u8eab\u573a\u666f\u4e2d\u5224\u65ad\u884c\u4e3a\u662f\u5426\u5f97\u4f53\u7684\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u793e\u4ea4\u4e3b\u52a8\u667a\u80fd\u4ece\u9759\u6001\u56fe\u50cf\u63a8\u8fdb\u5230\u66f4\u771f\u5b9e\u7684\u52a8\u6001\u89c6\u9891\u573a\u666f\uff0c\u5e76\u7528\u7cfb\u7edf\u5316\u5206\u7c7b\u4f53\u7cfb\u63d0\u5347\u573a\u666f\u8986\u76d6\u5ea6\uff0c\u5bf9\u5177\u8eab\u667a\u80fd\u3001\u673a\u5668\u4eba\u52a9\u624b\u548c\u4e16\u754c\u6a21\u578b\u8bc4\u6d4b\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "This paper presents a comprehensive framework for robot manipulation failure analysis that includes binary failure detection, failure categorization, explanation generation, and the additional capability of failure onset localization, which aims to identify the earliest moment at which a robot execution deviates from a valid task-completion trajectory and is ultimately followed by task failure. To address these tasks, we propose ProTracer, a training-free framework that leverages existing Vision-Language Models (VLMs) together with proprioceptive signals for failure analysis. Our method uses proprioceptive dynamics to identify temporally informative action boundaries and converts richer robot-state signals into structured natural-language descriptions that can be jointly analyzed together with visual observations by the VLM. This design combines the temporal precision of proprioceptive signals with the multimodal reasoning capabilities of modern VLMs without requiring additional model training. We further introduce FailTime, a benchmark with synchronized visual and proprioceptive observations for evaluating conventional failure diagnosis tasks as well as failure onset localization. Experiments demonstrate that ProTracer achieves strong performance across both conventional failure diagnosis tasks and the newly introduced failure onset localization task, highlighting the importance of proprioceptive reasoning for fine-grained temporal failure analysis.", "arxiv_id": "2609.21369", "arxiv_url": "https://arxiv.org/abs/2609.21369", "authors": ["Chang Dong", "Mehdi Hosseinzadeh", "King Hang Wong", "Lingqiao Liu", "Francois Fraysse", "Feras Dayoub", "Minh Hoai Nguyen"], "brief": "\u8bba\u6587\u63d0\u51fa ProTracer\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u5931\u8d25\u5206\u6790\u6846\u67b6\uff0c\u7ed3\u5408\u73b0\u6709 VLM \u4e0e\u673a\u5668\u4eba\u672c\u4f53\u611f\u77e5\u4fe1\u53f7\uff0c\u5b9e\u73b0\u5931\u8d25\u68c0\u6d4b\u3001\u5206\u7c7b\u3001\u89e3\u91ca\u751f\u6210\u548c\u5931\u8d25\u8d77\u59cb\u65f6\u523b\u5b9a\u4f4d\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 FailTime \u57fa\u51c6\uff0c\u5305\u542b\u540c\u6b65\u89c6\u89c9\u4e0e\u672c\u4f53\u611f\u77e5\u89c2\u6d4b\uff0c\u7528\u4e8e\u8bc4\u4f30\u7ec6\u7c92\u5ea6\u5931\u8d25\u8bca\u65ad\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21369", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528\u672c\u4f53\u611f\u77e5\u52a8\u6001\u8bc6\u522b\u65f6\u95f4\u4e0a\u5173\u952e\u7684\u52a8\u4f5c\u8fb9\u754c\uff0c\u63d0\u5347\u5931\u8d25\u53d1\u751f\u65f6\u523b\u7684\u5b9a\u4f4d\u7cbe\u5ea6", "\u5c06\u673a\u5668\u4eba\u72b6\u6001\u4fe1\u53f7\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\uff0c\u4e0e\u89c6\u89c9\u89c2\u6d4b\u4e00\u8d77\u4ea4\u7ed9 VLM \u63a8\u7406", "\u63d0\u51fa\u5931\u8d25\u8d77\u59cb\u5b9a\u4f4d\u4efb\u52a1\uff0c\u8bc6\u522b\u673a\u5668\u4eba\u8f68\u8ff9\u6700\u65e9\u504f\u79bb\u6210\u529f\u6267\u884c\u8def\u5f84\u7684\u65f6\u95f4\u70b9"], "keywords": ["\u673a\u5668\u4eba", "\u591a\u6a21\u6001", "\u6545\u969c\u8bca\u65ad", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21369v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ProTracer: Proprioception-Guided Failure Diagnosis in Robot Manipulation", "tldr": "\u7528\u672c\u4f53\u611f\u77e5\u5f15\u5bfc\u673a\u5668\u4eba\u5931\u8d25\u8bca\u65ad\u4e0e\u5b9a\u4f4d", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa ProTracer\uff0c\u4e00\u4e2a\u514d\u8bad\u7ec3\u7684\u673a\u5668\u4eba\u64cd\u4f5c\u5931\u8d25\u5206\u6790\u6846\u67b6\uff0c\u7ed3\u5408\u73b0\u6709 VLM \u4e0e\u673a\u5668\u4eba\u672c\u4f53\u611f\u77e5\u4fe1\u53f7\uff0c\u5b9e\u73b0\u5931\u8d25\u68c0\u6d4b\u3001\u5206\u7c7b\u3001\u89e3\u91ca\u751f\u6210\u548c\u5931\u8d25\u8d77\u59cb\u65f6\u523b\u5b9a\u4f4d\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 FailTime \u57fa\u51c6\uff0c\u5305\u542b\u540c\u6b65\u89c6\u89c9\u4e0e\u672c\u4f53\u611f\u77e5\u89c2\u6d4b\uff0c\u7528\u4e8e\u8bc4\u4f30\u7ec6\u7c92\u5ea6\u5931\u8d25\u8bca\u65ad\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u65e0\u9700\u989d\u5916\u8bad\u7ec3\u5373\u53ef\u5c06\u673a\u5668\u4eba\u4f4e\u5c42\u72b6\u6001\u4fe1\u53f7\u4e0e VLM \u591a\u6a21\u6001\u63a8\u7406\u7ed3\u5408\uff0c\u63d0\u5347\u5931\u8d25\u8bca\u65ad\u7684\u65f6\u95f4\u7cbe\u5ea6\u4e0e\u53ef\u89e3\u91ca\u6027\uff0c\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u8c03\u8bd5\u3001\u5b89\u5168\u76d1\u63a7\u548c\u81ea\u4e3b\u6062\u590d\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Text-guided video editing modifies target content while preserving the appearance and temporal coherence of unedited regions. Training-based approaches provide strong control but demand substantial data and computation. Training-free methods fall into inversion-free and inversion-based paradigms. Inversion-free approaches avoid trajectory recovery, but their source-preserving guidance can limit editing strength and leave semantic changes incomplete. Inversion-based approaches recover a latent trajectory before regeneration, where approximation errors can accumulate and cause source-content drift and temporal inconsistency. We introduce Edit-VAR, the first training-free and inversion-free framework for text-guided video editing with a pretrained visual autoregressive video model. Edit-VAR directly encodes the source video into multi-scale discrete tokens and performs probability-guided conditional token replacement for source preservation. Attention-guided token-wise and scale-aware modulation selectively relaxes source constraints over edit-relevant positions and generation stages. Scale-Decoupled Generation, implemented as late-scale constraint release, regenerates motion-consistent details and reduces texture fragmentation. Residual-guided token pruning further exploits redundancy at the final two high-resolution scales to reduce inference cost. Extensive experiments and a blind user study demonstrate that Edit-VAR outperforms existing training-free video editing methods overall in editing fidelity, source preservation, temporal coherence, and inference efficiency.", "arxiv_id": "2609.21268", "arxiv_url": "https://arxiv.org/abs/2609.21268", "authors": ["Chongbo Zhao", "Jiangming Wang", "Xilai Wang", "Xinyu Wang", "Jingyi Tang", "Chunjie Hao", "Pengjie Song", "Yue Ma"], "brief": "Edit-VAR \u662f\u9996\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u89c9\u81ea\u56de\u5f52\u89c6\u9891\u6a21\u578b\u7684\u514d\u8bad\u7ec3\u3001\u514d\u53cd\u6f14\u6587\u672c\u5f15\u5bfc\u89c6\u9891\u7f16\u8f91\u6846\u67b6\u3002\u5b83\u5c06\u6e90\u89c6\u9891\u7f16\u7801\u4e3a\u591a\u5c3a\u5ea6\u79bb\u6563 token\uff0c\u5e76\u901a\u8fc7\u6982\u7387\u5f15\u5bfc\u7684\u6761\u4ef6 token \u66ff\u6362\u5728\u4fdd\u6301\u539f\u89c6\u9891\u5185\u5bb9\u7684\u540c\u65f6\u5b8c\u6210\u7f16\u8f91\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21268", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u6982\u7387\u5f15\u5bfc\u7684\u6761\u4ef6 token \u66ff\u6362\uff0c\u7528\u4e8e\u76f4\u63a5\u5728\u79bb\u6563 token \u7a7a\u95f4\u4e2d\u4fdd\u7559\u6e90\u89c6\u9891\u5916\u89c2\u4e0e\u7ed3\u6784\u3002", "\u8bbe\u8ba1\u6ce8\u610f\u529b\u5f15\u5bfc\u7684\u9010 token\u3001\u5206\u5c3a\u5ea6\u8c03\u5236\uff0c\u5728\u7f16\u8f91\u76f8\u5173\u533a\u57df\u548c\u751f\u6210\u9636\u6bb5\u6709\u9009\u62e9\u5730\u653e\u5bbd\u6e90\u7ea6\u675f\u3002", "\u901a\u8fc7\u5c3a\u5ea6\u89e3\u8026\u751f\u6210\u4e0e\u6b8b\u5dee\u5f15\u5bfc token \u526a\u679d\uff0c\u63d0\u5347\u8fd0\u52a8\u4e00\u81f4\u6027\u3001\u51cf\u5c11\u7eb9\u7406\u7834\u788e\uff0c\u5e76\u964d\u4f4e\u9ad8\u5206\u8fa8\u7387\u9636\u6bb5\u63a8\u7406\u6210\u672c\u3002"], "keywords": ["\u89c6\u9891\u7f16\u8f91", "\u81ea\u56de\u5f52\u6a21\u578b", "\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21268v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Edit-VAR: Taming Visual Autoregressive Model for Precise Video Editing", "tldr": "\u7528\u89c6\u89c9\u81ea\u56de\u5f52\u6a21\u578b\u5b9e\u73b0\u514d\u8bad\u7ec3\u7cbe\u51c6\u89c6\u9891\u7f16\u8f91", "upvotes": 0, "what_it_is": "Edit-VAR \u662f\u9996\u4e2a\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u89c9\u81ea\u56de\u5f52\u89c6\u9891\u6a21\u578b\u7684\u514d\u8bad\u7ec3\u3001\u514d\u53cd\u6f14\u6587\u672c\u5f15\u5bfc\u89c6\u9891\u7f16\u8f91\u6846\u67b6\u3002\u5b83\u5c06\u6e90\u89c6\u9891\u7f16\u7801\u4e3a\u591a\u5c3a\u5ea6\u79bb\u6563 token\uff0c\u5e76\u901a\u8fc7\u6982\u7387\u5f15\u5bfc\u7684\u6761\u4ef6 token \u66ff\u6362\u5728\u4fdd\u6301\u539f\u89c6\u9891\u5185\u5bb9\u7684\u540c\u65f6\u5b8c\u6210\u7f16\u8f91\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u907f\u5f00\u4e86\u4f20\u7edf\u514d\u8bad\u7ec3\u89c6\u9891\u7f16\u8f91\u4e2d\u53cd\u6f14\u8bef\u5dee\u7d2f\u79ef\u6216\u7f16\u8f91\u5f3a\u5ea6\u4e0d\u8db3\u7684\u95ee\u9898\uff0c\u5728\u7f16\u8f91\u4fdd\u771f\u5ea6\u3001\u6e90\u5185\u5bb9\u4fdd\u6301\u3001\u65f6\u5e8f\u4e00\u81f4\u6027\u548c\u63a8\u7406\u6548\u7387\u4e0a\u5747\u4f18\u4e8e\u73b0\u6709\u514d\u8bad\u7ec3\u65b9\u6cd5\uff0c\u5c55\u793a\u4e86\u89c6\u89c9\u81ea\u56de\u5f52\u6a21\u578b\u7528\u4e8e\u89c6\u9891\u7f16\u8f91\u7684\u6f5c\u529b\u3002"}, {"abstract": "Empirical evaluation is central to recommender-systems (RecSys) research, but turning experimental designs into executable code remains a manual and error-prone task. We present AutoRecLab, a Python-based autonomous RecSys lab that automates RecSys experiments from natural-language prompts. Given a research idea, AutoRecLab derives explicit experiment requirements, builds and validates a prototype, and iteratively expands it into the requested full experiment. The workflow combines retrieval-augmented generation (RAG) for documentation lookup, static type verification, and execution-steered tree search. In our demonstration, AutoRecLab autonomously implements an explicit-to-implicit feedback conversion study. In a baseline comparison across six algorithms and three datasets, 8 of 9 runs succeed at an average cost of approx- imately $1 per run with GPT-5.4-mini.", "arxiv_id": "2609.21863", "arxiv_url": "https://arxiv.org/abs/2609.21863", "authors": ["Moritz Baumgart", "Philipp Meister", "Justus Krell", "Michael Schmidt", "Bela Gipp", "Joeran Beel"], "brief": "AutoRecLab \u662f\u4e00\u4e2a\u57fa\u4e8e Python \u7684\u81ea\u4e3b\u63a8\u8350\u7cfb\u7edf\u5b9e\u9a8c\u5ba4\uff0c\u53ef\u4ece\u7814\u7a76\u60f3\u6cd5\u7684\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u51fa\u53d1\uff0c\u81ea\u52a8\u63d0\u70bc\u5b9e\u9a8c\u9700\u6c42\u3001\u6784\u5efa\u539f\u578b\u3001\u9a8c\u8bc1\u5e76\u6269\u5c55\u4e3a\u5b8c\u6574\u5b9e\u9a8c\u4ee3\u7801\u3002", "categories": ["cs.AI", "cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21863", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u7ed3\u5408 RAG \u6587\u6863\u68c0\u7d22\u3001\u9759\u6001\u7c7b\u578b\u68c0\u67e5\u548c\u6267\u884c\u53cd\u9988\u9a71\u52a8\u7684\u6811\u641c\u7d22\u6765\u63d0\u5347\u4ee3\u7801\u751f\u6210\u4e0e\u5b9e\u9a8c\u53ef\u9760\u6027", "\u53ef\u81ea\u52a8\u5b8c\u6210\u4ece\u663e\u5f0f\u53cd\u9988\u5230\u9690\u5f0f\u53cd\u9988\u8f6c\u6362\u7814\u7a76\u7684\u5b9e\u73b0\u793a\u4f8b", "\u57286\u79cd\u7b97\u6cd5\u30013\u4e2a\u6570\u636e\u96c6\u7684\u57fa\u7ebf\u5b9e\u9a8c\u4e2d\uff0c9\u6b21\u8fd0\u884c\u6210\u529f8\u6b21\uff0c\u5e73\u5747\u6210\u672c\u7ea6\u6bcf\u6b211\u7f8e\u5143"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u8350\u7cfb\u7edf", "\u4ee3\u7801\u751f\u6210", "RAG"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21863v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AutoRecLab: Describe the Experiment, Get the Code!", "tldr": "\u7528\u81ea\u7136\u8bed\u8a00\u81ea\u52a8\u751f\u6210\u63a8\u8350\u7cfb\u7edf\u5b9e\u9a8c\u4ee3\u7801", "upvotes": 0, "what_it_is": "AutoRecLab \u662f\u4e00\u4e2a\u57fa\u4e8e Python \u7684\u81ea\u4e3b\u63a8\u8350\u7cfb\u7edf\u5b9e\u9a8c\u5ba4\uff0c\u53ef\u4ece\u7814\u7a76\u60f3\u6cd5\u7684\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u51fa\u53d1\uff0c\u81ea\u52a8\u63d0\u70bc\u5b9e\u9a8c\u9700\u6c42\u3001\u6784\u5efa\u539f\u578b\u3001\u9a8c\u8bc1\u5e76\u6269\u5c55\u4e3a\u5b8c\u6574\u5b9e\u9a8c\u4ee3\u7801\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06 LLM \u667a\u80fd\u4f53\u7528\u4e8e\u63a8\u8350\u7cfb\u7edf\u5b9e\u9a8c\u81ea\u52a8\u5316\uff0c\u964d\u4f4e\u4ece\u5b9e\u9a8c\u8bbe\u8ba1\u5230\u53ef\u6267\u884c\u4ee3\u7801\u7684\u95e8\u69db\uff0c\u6709\u671b\u63d0\u5347 RecSys \u7814\u7a76\u7684\u590d\u73b0\u6548\u7387\u4e0e\u5b9e\u9a8c\u8fed\u4ee3\u901f\u5ea6\u3002"}, {"abstract": "Blind and low-vision users often face challenges when locating and physically acquiring objects in unfamiliar indoor environments. Existing vision-language-model-based assistants can provide semantic descriptions but may introduce latency, hallucinations, and guidance that is poorly aligned with embodied action. We present Touvigation, a hands-free object acquisition system that combines vision-language understanding with persistent local spatial modeling to provide low-latency, body-relative guidance. Drawing on formative interviews with eight blind and low-vision participants, we design a multi-stage guidance framework that adapts spatial references as users transition from orienting, to walking, to reaching and tactile verification. We evaluated Touvigation with 12 blind and low-vision participants against a multimodal large-language-model assistant and unassisted search. Touvigation achieved 100% task success, compared with 58% for the multimodal assistant and 85% for unassisted search, while reducing completion time and cognitive workload. Our findings demonstrate how persistent spatial grounding and adaptive embodied guidance can improve object acquisition for blind and low-vision users.", "arxiv_id": "2609.21828", "arxiv_url": "https://arxiv.org/abs/2609.21828", "authors": ["George Xi Wang", "Xiangyu Li", "Shaoyue Wen", "Jiaqian Hu", "Junan Xie", "Yupeng Wang", "Ziyue Shi", "Qijun Chen", "Maaike Bouwmeester", "Yuhua Jin", "Jing Qian"], "brief": "Touvigation \u662f\u4e00\u4e2a\u514d\u624b\u6301\u5ba4\u5185\u7269\u4f53\u83b7\u53d6\u7cfb\u7edf\uff0c\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u4e0e\u6301\u7eed\u672c\u5730\u7a7a\u95f4\u5efa\u6a21\uff0c\u4e3a\u76f2\u4eba\u548c\u4f4e\u89c6\u529b\u7528\u6237\u63d0\u4f9b\u4f4e\u5ef6\u8fdf\u3001\u4ee5\u8eab\u4f53\u4e3a\u53c2\u7167\u7684\u627e\u7269\u5f15\u5bfc\u3002\u5b83\u6839\u636e\u7528\u6237\u4ece\u5b9a\u4f4d\u3001\u884c\u8d70\u5230\u4f38\u624b\u89e6\u6478\u9a8c\u8bc1\u7684\u4e0d\u540c\u9636\u6bb5\uff0c\u81ea\u9002\u5e94\u8c03\u6574\u7a7a\u95f4\u63d0\u793a\u65b9\u5f0f\u3002", "categories": ["cs.HC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.21828", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e\u5bf98\u540d\u76f2\u4eba\u548c\u4f4e\u89c6\u529b\u53c2\u4e0e\u8005\u7684\u5f62\u6210\u6027\u8bbf\u8c08\uff0c\u8bbe\u8ba1\u591a\u9636\u6bb5\u5177\u8eab\u5f15\u5bfc\u6846\u67b6\u3002", "\u5f15\u5165\u6301\u4e45\u5c40\u90e8\u7a7a\u95f4\u5efa\u6a21\uff0c\u51cf\u5c11\u4ec5\u4f9d\u8d56\u591a\u6a21\u6001\u5927\u6a21\u578b\u65f6\u7684\u5ef6\u8fdf\u3001\u5e7b\u89c9\u548c\u52a8\u4f5c\u4e0d\u5339\u914d\u95ee\u9898\u3002", "12\u540d\u53c2\u4e0e\u8005\u5b9e\u9a8c\u4e2d\uff0cTouvigation \u4efb\u52a1\u6210\u529f\u7387\u8fbe100%\uff0c\u9ad8\u4e8e\u591a\u6a21\u6001\u5927\u6a21\u578b\u52a9\u624b\u768458%\u548c\u65e0\u8f85\u52a9\u641c\u7d22\u768485%\uff0c\u5e76\u964d\u4f4e\u5b8c\u6210\u65f6\u95f4\u4e0e\u8ba4\u77e5\u8d1f\u62c5\u3002"], "keywords": ["\u65e0\u969c\u788d\u8f85\u52a9", "\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd", "\u7a7a\u95f4\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.21828v1", "published_at": "2026-09-18", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Touvigation: Embodied Adaptive Object Acquisition for Blind and Low-Vision Users in Unfamiliar Indoor Environments", "tldr": "\u9762\u5411\u76f2\u4f4e\u89c6\u7528\u6237\u7684\u5177\u8eab\u627e\u7269\u5bfc\u822a\u7cfb\u7edf\u3002", "upvotes": 0, "what_it_is": "Touvigation \u662f\u4e00\u4e2a\u514d\u624b\u6301\u5ba4\u5185\u7269\u4f53\u83b7\u53d6\u7cfb\u7edf\uff0c\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u7406\u89e3\u4e0e\u6301\u7eed\u672c\u5730\u7a7a\u95f4\u5efa\u6a21\uff0c\u4e3a\u76f2\u4eba\u548c\u4f4e\u89c6\u529b\u7528\u6237\u63d0\u4f9b\u4f4e\u5ef6\u8fdf\u3001\u4ee5\u8eab\u4f53\u4e3a\u53c2\u7167\u7684\u627e\u7269\u5f15\u5bfc\u3002\u5b83\u6839\u636e\u7528\u6237\u4ece\u5b9a\u4f4d\u3001\u884c\u8d70\u5230\u4f38\u624b\u89e6\u6478\u9a8c\u8bc1\u7684\u4e0d\u540c\u9636\u6bb5\uff0c\u81ea\u9002\u5e94\u8c03\u6574\u7a7a\u95f4\u63d0\u793a\u65b9\u5f0f\u3002", "why_notable": "\u8be5\u7814\u7a76\u5c55\u793a\u4e86\u5c06\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0e\u7a7a\u95f4 grounding\u3001\u5177\u8eab\u4ea4\u4e92\u7ed3\u5408\uff0c\u53ef\u663e\u8457\u63d0\u5347\u65e0\u969c\u788d\u8f85\u52a9\u7cfb\u7edf\u7684\u53ef\u9760\u6027\u548c\u5b9e\u7528\u6027\uff0c\u5c24\u5176\u9002\u5408\u771f\u5b9e\u5ba4\u5185\u73af\u5883\u4e2d\u7684\u7269\u4f53\u83b7\u53d6\u4efb\u52a1\u3002"}, {"abstract": "Adaptive optimization methods such as AdaGrad and Adam are widely used in modern neural-network training, but their adaptive scaling is primarily designed for vector-valued parameters and does not explicitly exploit matrix structure. Recent matrix-aware optimizers demonstrate the benefits of structured optimization, yet a general theoretical framework for deriving matrix-aware adaptivity comparable to that of AdaGrad remains lacking. In this work, we develop a general Online Mirror Descent framework with adaptive proximal functions for matrix-valued parameters, providing a principled approach to deriving matrix-aware adaptive optimization through online regret minimization. By introducing row-wise and column-wise matrix proximal functions and analyzing the resulting regret trade-off, we derive Row-wise Matrix AdaGrad (Row-AdaGrad) and Column-wise Matrix AdaGrad (Column-AdaGrad), with adaptive scaling determined b
