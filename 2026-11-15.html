const PAPERS = [{"abstract": "A temporary optimization intervention can increase validation loss when it ends yet reduce it at the final training budget. We demonstrate this with temporary weight decay in Muon-trained decoder-only Transformers with 162M, 405M, 1.4B, and 3.4B parameters. For models up to 1.4B parameters, moving a fixed-duration decay window from early to late training reverses its final effect. At 162M, changing window duration alters final loss even at approximately matched total shrinkage. Most strikingly, a schedule selected at 162M and transferred without retuning to 1.4B is 0.26 nats worse than no decay when removed, overtakes it only after 73% of training, and ultimately finishes 0.028 nats better while also outperforming the best sampled constant-decay baseline. Early decay leaves a persistent weight-norm deficit, which keeps relative steps larger after the intervention ends. An approximate norm-dynamics recurrence captures the slow convergence of these relative steps, and fixed-norm replays of the measured trajectories reproduce the performance ordering and a similar loss difference. At 162M and 405M, norm-reset experiments show that smaller weight norms at the end of the decay window explain most of the final loss improvement. A separate Gram intervention exhibits related post-removal norm and relative-step dynamics. These results show that temporary optimization schedules can have delayed effects long after removal and should therefore be evaluated at the intended final training budget, not only at removal.", "arxiv_id": "2611.17876", "arxiv_url": "https://arxiv.org/abs/2611.17876", "authors": ["Md Rifat Arefin", "Ravid Shwartz-Ziv", "Ernie Chang", "Chinnadhurai Sankar", "Rylan Conway", "Aristide Baratin", "Irina Rish", "Adithya Sagar", "Patrick Huber"], "brief": "\u7814\u7a76\u5728Mu\u200b\u200bon\u8bad\u7ec3\u7684\u89e3\u7801\u5668\u6a21\u578b\u4e2d\u65bd\u52a0\u4e34\u65f6\u6743\u91cd\u8870\u51cf\uff0c\u6bd4\u8f83\u4e0d\u540c\u7a97\u53e3\ ef\u5bfc\u65b9\u6848\u9009\u62e9\uff1b\u77ed\u671f\u8870\u51cf\u901a\u8fc7\u6301\u7eed\u6539\u53d8\u76f8\u5bf9\u6b65\u957f\u4ea7\u751f\u957f\u671f\u6536\u76ca\uff0c\u8bc4\u4f30\u5e94\u5bf9\u9f50\u6700\u7ec8\u8bad\u7ec3\u9884\u7b97\u3002"}, {"abstract": "We introduce GDP_xlsx, a benchmark of 70 realistic workplace requests written by professionals in 13 domains, each paired with an expert rubric of binary criteria and with the complete workbook or CSV file it refers to. Together the files hold 2.18 million populated cells, and the rubrics 791 criteria. Agents work in a container with spreadsheet tools, and an agentic judge that can open the file applies the rubric. Completeness and exclusivity criteria require set-valued answers to be found in full and with nothing extra. We rank models by strict pass@1, the share of attempts that meet every criterion. Across 20 model configurations, including frontier models from Google, Anthropic, and OpenAI, the top-scoring one, Gemini 4 Argon, passes only 38.3% of attempts, and the median score is 19.3%, leaving wide headroom. We release the evaluation harness and three public tasks; the other 67 are held out to protect the leaderboard from contamination.", "arxiv_id": "2611.17766", "arxiv_url": "https://arxiv.org/abs/2611.17766", "authors": ["Suhaas Garre", "Sushant Mehta", "Edwin Chen"], "brief": "\u6784\u5efa\u4e13\u4e1a\u5de5\u4f5c\u7c3f\u4efb\u52a1\u57fa\u51c6\uff0c\u8ba9\u667a\u80fd\u4f53\u5728\u5bb9\u5668\u5185\u8c03\u7528\u8868\u683c\u5de5\u5177\u5b8c\u6210\u8bf7\u6c42\u3002\u8bc4\u5224\u667a\u80fd\u4f53\u76f4\u63a5\u68c0\u67e5\u6587\u4ef6\uff0c\u6309\u4e13\u5bb6\u5236\u5b9a\u7684\u4e8c\u5143\u6807\u51c6\u9010\u9879\u9a8c\u6536\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17766", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["70\u9879\u4efb\u52a1\u8986\u76d613\u4e2a\u9886\u57df\uff0c\u542b218\u4e07\u5df2\u586b\u5355\u5143\u683c", "791\u9879\u4e8c\u5143\u6807\u51c6\uff0cstrict pass@1\u8981\u6c42\u5168\u90e8\u8fbe\u6807", "20\u79cd\u914d\u7f6e\u4e2d\u6700\u4f73\u901a\u8fc7\u738738.3%\uff0c\u4e2d\u4f4d\u657019.3%"], "keywords": ["\u7535\u5b50\u8868\u683c", "\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u529e\u516c\u81ea\u52a8\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17766v1", "published_at": "2026-11-13", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "GDP.xlsx: Benchmarking Frontier Models on Professional Workbooks", "tldr": "\u771f\u5b9e\u804c\u573a\u8868\u683c\u4efb\u52a1\u4e25\u683c\u8bc4\u6d4b\u663e\u793a\uff0c\u524d\u6cbf\u6a21\u578b\u6700\u4f73\u901a\u8fc7\u7387\u4ecd\u4e0d\u8db3\u56db\u6210\u3002", "upvotes": 0, "what_it_is": "\u6784\u5efa\u4e13\u4e1a\u5de5\u4f5c\u7c3f\u4efb\u52a1\u57fa\u51c6\uff0c\u8ba9\u667a\u80fd\u4f53\u5728\u5bb9\u5668\u5185\u8c03\u7528\u8868\u683c\u5de5\u5177\u5b8c\u6210\u8bf7\u6c42\u3002\u8bc4\u5224\u667a\u80fd\u4f53\u76f4\u63a5\u68c0\u67e5\u6587\u4ef6\uff0c\u6309\u4e13\u5bb6\u5236\u5b9a\u7684\u4e8c\u5143\u6807\u51c6\u9010\u9879\u9a8c\u6536\u3002", "why_notable": "\u628a\u8bc4\u6d4b\u63a8\u8fdb\u5230\u771f\u5b9e\u6587\u4ef6\u64cd\u4f5c\u4e0e\u5b8c\u6574\u4ea4\u4ed8\uff0c\u66b4\u9732\u524d\u6cbf\u6a21\u578b\u5728\u4e13\u4e1a\u8868\u683c\u4efb\u52a1\u4e0a\u7684\u53ef\u9760\u6027\u7f3a\u53e3\uff1b\u4fdd\u755967\u9879\u4efb\u52a1\u4ee5\u964d\u4f4e\u699c\u5355\u6c61\u67d3\u3002"}, {"abstract": "Frontier LLM agents that query databases with tools are among the most accurate text-to-SQL systems, but per-query calls to a hosted model are slow, costly, and expose sensitive organizational queries to external APIs. For example, a Claude Opus 5.5 agent serving 10,000 queries a day costs over $70,000 a year at list price. To what extent can local hardware already owned by an organization offload this burden without compromising the agent\u0027s accuracy? We present LuthorSQL, a non-autoregressive 7B text-to-SQL model that serves as a rapid System 1 gate for a slower LLM agent (System 2), escalating queries only when uncertain. LuthorSQL makes a single forward pass to predict slot scores over a bounded grammar for query plans, compiles and runs up to 32 candidate plans, and chooses an answer using a trained validator. On its own, LuthorSQL reaches 68.03% execution accuracy on BIRD\u0027s hidden test set at 0.84 s per question on a single GPU, maintains its accuracy in 9 GB with 8-bit quantized weights, and transfers zero-shot to Snowflake, BigQuery, MySQL, PostgreSQL, and DuckDB within 3.1 points of its native SQLite accuracy. Combined with Claude Opus 5.5 in a pre-registered confidence cascade over 227 questions on databases published after Opus\u0027s training cutoff, LuthorSQL answers nearly half of all questions locally and cuts API cost by 33.3% at the same accuracy. Finally, contamination probing shows that Opus reproduces 48-92% of public benchmark gold queries verbatim without seeing the schema; however, its tool-assisted accuracy holds on renamed schemas and reaches 95.6-97.4% on post-cutoff databases. Code and data: https://github.com/IAMIbrahimmemon/luthorsql", "arxiv_id": "2611.17780", "arxiv_url": "https://arxiv.org/abs/2611.17780", "authors": ["Ibrahim Memon", "Armin Karamzade", "M. Hanif Jhaveri", "Roy Fox"], "brief": "\u63d0\u51fa\u975e\u81ea\u56de\u5f52\u76847B\u6a21\u578b\uff0c\u4ee5\u5355\u6b21\u524d\u5411\u9884\u6d4b\u53d7\u9650\u8bed\u6cd5\u4e2d\u7684\u69fd\u4f4d\u5206\u6570\uff0c\u6267\u884c\u5019\u9009\u67e5\u8be2\u5e76\u7528\u9a8c\u8bc1\u5668\u9009\u7b54\u6848\uff1b\u4f4e\u7f6e\u4fe1\u5ea6\u95ee\u9898\u518d\u4ea4\u7ed9\u6162\u901f\u5927\u6a21\u578b\u667a\u80fd\u4f53\u3002", "categories": ["cs.CL", "cs.AI", "cs.DB", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17780", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5355\u6b21\u524d\u5411\u751f\u6210\u6700\u591a32\u4e2a\u5019\u9009\u8ba1\u5212\uff0c\u8bad\u7ec3\u9a8c\u8bc1\u5668\u9009\u7b54\u6848", "BIRD\u6267\u884c\u51c6\u786e\u738768.03%\uff0c\u5355GPU\u6bcf\u98980.84\u79d2", "227\u9898\u7ea7\u8054\u5b9e\u9a8c\u8fd1\u534a\u672c\u5730\u56de\u7b54\uff0c\u540c\u51c6\u786e\u7387\u6210\u672c\u964d33.3%"], "keywords": ["\u6587\u672c\u8f6cSQL", "\u6a21\u578b\u7ea7\u8054", "\u672c\u5730\u63a8\u7406", "\u6570\u636e\u5e93\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17780v1", "published_at": "2026-11-13", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "LuthorSQL: A One-Pass Text-to-SQL Model as System 1 for a Slower LLM Agent", "tldr": "\u7528\u672c\u5730\u5355\u6b21\u524d\u5411\u6a21\u578b\u5206\u6d41\u6570\u636e\u5e93\u67e5\u8be2\uff0c\u5728\u4fdd\u6301\u667a\u80fd\u4f53\u51c6\u786e\u7387\u65f6\u964d\u4f4e\u8c03\u7528\u6210\u672c\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u975e\u81ea\u56de\u5f52\u76847B\u6a21\u578b\uff0c\u4ee5\u5355\u6b21\u524d\u5411\u9884\u6d4b\u53d7\u9650\u8bed\u6cd5\u4e2d\u7684\u69fd\u4f4d\u5206\u6570\uff0c\u6267\u884c\u5019\u9009\u67e5\u8be2\u5e76\u7528\u9a8c\u8bc1\u5668\u9009\u7b54\u6848\uff1b\u4f4e\u7f6e\u4fe1\u5ea6\u95ee\u9898\u518d\u4ea4\u7ed9\u6162\u901f\u5927\u6a21\u578b\u667a\u80fd\u4f53\u3002", "why_notable": "\u628a\u5feb\u901f\u672c\u5730\u6a21\u578b\u4e0e\u9ad8\u7cbe\u5ea6\u667a\u80fd\u4f53\u7ed3\u5408\uff0c\u5c55\u793a\u4e86\u4e0d\u727a\u7272\u51c6\u786e\u7387\u7684\u6210\u672c\u4f18\u5316\u8def\u5f84\uff1b\u8bad\u7ec3\u622a\u6b62\u540e\u6570\u636e\u5e93\u6d4b\u8bd5\u4e5f\u589e\u5f3a\u4e86\u7ed3\u679c\u53ef\u4fe1\u5ea6\u3002"}, {"abstract": "Agentic forecasting systems based on large language models (LLMs) are now competitive with expert human forecasters, but these systems still suffer from a critical limitation: the inability to produce forecasts that are logically consistent. For example, forecasts for related events often fail to satisfy the axioms of probability, which in turn implies that related forecasts cannot simultaneously be correct and undermines their utility for decision makers. Enforcing consistency is not trivial -- naive approaches (e.g., projection onto the set of consistent forecasts) can degrade accuracy. We argue that the key to overcoming the apparent tradeoff between consistency and accuracy lies in the reasoning which supports each forecast. We finetune a supervisory language model that leverages this reasoning to jointly reconcile inconsistencies while improving the accuracy of related forecasts. On ForecastBench, our method improves the Brier score of a retrieval-augmented GPT-5.1 forecaster by 9.3% while reducing measures of structural inconsistency by 82-90%. We interrogate our method via a comprehensive series of baselines and ablations, and find that no alternative method matches our gains in consistency and accuracy simultaneously.", "arxiv_id": "2611.17735", "arxiv_url": "https://arxiv.org/abs/2611.17735", "authors": ["Kate Yuan", "Rohan Alur", "Manish Raghavan", "Devavrat Shah"], "brief": "\u7814\u7a76\u7528\u5fae\u8c03\u7684\u76d1\u7763\u8bed\u8a00\u6a21\u578b\u6821\u6b63\u76f8\u5173\u4e8b\u4ef6\u7684\u6982\u7387\u9884\u6d4b\u3002\u6a21\u578b\u5229\u7528\u5404\u9879\u9884\u6d4b\u80cc\u540e\u7684\u63a8\u7406\uff0c\u8054\u5408\u6d88\u89e3\u903b\u8f91\u77db\u76fe\uff0c\u800c\u975e\u76f4\u63a5\u5c06\u6982\u7387\u6295\u5f71\u5230\u4e00\u81f4\u96c6\u5408\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17735", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5fae\u8c03\u76d1\u7763\u8bed\u8a00\u6a21\u578b\uff0c\u4f9d\u636e\u9884\u6d4b\u63a8\u7406\u8054\u5408\u6821\u6b63\u6982\u7387", "ForecastBench\u4e0aBrier\u5206\u6570\u6539\u55849.3%", "\u7ed3\u6784\u6027\u4e0d\u4e00\u81f4\u964d\u4f4e82\u201490%\uff0c\u57fa\u7ebf\u672a\u80fd\u517c\u987e\u4e24\u9879\u76ee\u6807"], "keywords": ["\u6982\u7387\u9884\u6d4b", "\u903b\u8f91\u4e00\u81f4\u6027", "\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17735v1", "published_at": "2026-11-13", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Logically Consistent Accurate Forecasts", "tldr": "\u5fae\u8c03\u76d1\u7763\u8bed\u8a00\u6a21\u578b\u5229\u7528\u9884\u6d4b\u63a8\u7406\uff0c\u540c\u65f6\u63d0\u5347\u4e8b\u4ef6\u6982\u7387\u9884\u6d4b\u7684\u51c6\u786e\u6027\u4e0e\u903b\u8f91\u4e00\u81f4\u6027\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7528\u5fae\u8c03\u7684\u76d1\u7763\u8bed\u8a00\u6a21\u578b\u6821\u6b63\u76f8\u5173\u4e8b\u4ef6\u7684\u6982\u7387\u9884\u6d4b\u3002\u6a21\u578b\u5229\u7528\u5404\u9879\u9884\u6d4b\u80cc\u540e\u7684\u63a8\u7406\uff0c\u8054\u5408\u6d88\u89e3\u903b\u8f91\u77db\u76fe\uff0c\u800c\u975e\u76f4\u63a5\u5c06\u6982\u7387\u6295\u5f71\u5230\u4e00\u81f4\u96c6\u5408\u3002", "why_notable": "\u5b83\u8868\u660e\u6982\u7387\u4e00\u81f4\u6027\u4e0e\u9884\u6d4b\u51c6\u786e\u6027\u4e0d\u5fc5\u76f8\u4e92\u727a\u7272\uff0c\u4e3a\u8bed\u8a00\u6a21\u578b\u9884\u6d4b\u7cfb\u7edf\u63d0\u4f9b\u4e86\u66f4\u53ef\u9760\u7684\u6821\u6b63\u8def\u5f84\uff0c\u6709\u52a9\u4e8e\u63d0\u9ad8\u51b3\u7b56\u53ef\u7528\u6027\u3002"}, {"abstract": "Recursive self-improvement (RSI) is one of the most promising paths toward an AI singularity for superintelligence. Achieving this vision requires AI systems to undertake the full training pipeline for iterative improvement. Reinforcement learning (RL) plays an essential role in this cycle to improve model capabilities and generalization, yet automating RL remains difficult due to unstable training dynamics and the need for sustained supervision. We introduce AutoRL, a multi-agent system for automating RL training, as a cornerstone for future RSI. Different from conducting research by end-to-end complete experiments, AutoRL monitors the evolving training state and integrates process-level supervision and research into an ongoing RL training, following the practical workflow of an RL researcher. Specifically, AutoRL consists of three RL-specific agentic roles. Perceptors track training dynamics, rollouts, evaluation, and efficiency, triggering deliberation when they detect anomalies, degradation, or stagnation. Three complementary Proposers diagnose problems and refine candidate interventions through shared evidence and checks. The Orchestrator reviews their recommendation and applies approved changes through online hot updates or checkpoint-based resumption. Experiments on Qwen3 and LongCat-Flash-Lite demonstrate the superiority of AutoRL over static RL recipes and a general agent. The research records show that existing agents can handle unattended RL supervision and dynamic adjustment. The difficulty for future RSI lies in developing fundamental methods that are valuable for resource-consuming validation.", "arxiv_id": "2611.17790", "arxiv_url": "https://arxiv.org/abs/2611.17790", "authors": ["Simon Tang", "Wenjie Shi", "Yongjing Yin", "Keheng Wang", "Jialin Liu", "Zheng Zhang", "Linvo Lin", "Xiangyuan Xue", "Kan Ren", "Jingang Wang", "Xunliang Cai"], "brief": "AutoRL\u5c06\u611f\u77e5\u3001\u63d0\u6848\u548c\u7f16\u6392\u89d2\u8272\u5d4c\u5165\u6301\u7eed\u8fdb\u884c\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u7cfb\u7edf\u76d1\u6d4b\u5f02\u5e38\u4e0e\u505c\u6ede\uff0c\u534f\u540c\u8bca\u65ad\u95ee\u9898\uff0c\u518d\u901a\u8fc7\u5728\u7ebf\u70ed\u66f4\u65b0\u6216\u68c0\u67e5\u70b9\u6062\u590d\u6267\u884c\u8c03\u6574\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17790", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["Perceptors\u76d1\u6d4b\u8bad\u7ec3\u3001\u91c7\u6837\u3001\u8bc4\u4f30\u4e0e\u6548\u7387", "\u4e09\u4e2aProposers\u5171\u4eab\u8bc1\u636e\uff0c\u8bca\u65ad\u5e76\u5b8c\u5584\u5e72\u9884\u65b9\u6848", "\u5728Qwen3\u4e0eLongCat-Flash-Lite\u4e0a\u4f18\u4e8e\u9759\u6001\u914d\u65b9\u53ca\u901a\u7528\u667a\u80fd\u4f53"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u591a\u667a\u80fd\u4f53", "\u8bad\u7ec3\u81ea\u52a8\u5316", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17790v1", "published_at": "2026-11-13", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AutoRL: A Multi-Agent System towards Autonomous Reinforcement Learning", "tldr": "\u591a\u667a\u80fd\u4f53\u6301\u7eed\u76d1\u63a7\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5e76\u52a8\u6001\u5e72\u9884\uff0c\u5b9e\u73b0\u65e0\u4eba\u503c\u5b88\u7684\u8bad\u7ec3\u8c03\u4f18\u3002", "upvotes": 0, "what_it_is": "AutoRL\u5c06\u611f\u77e5\u3001\u63d0\u6848\u548c\u7f16\u6392\u89d2\u8272\u5d4c\u5165\u6301\u7eed\u8fdb\u884c\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002\u7cfb\u7edf\u76d1\u6d4b\u5f02\u5e38\u4e0e\u505c\u6ede\uff0c\u534f\u540c\u8bca\u65ad\u95ee\u9898\uff0c\u518d\u901a\u8fc7\u5728\u7ebf\u70ed\u66f4\u65b0\u6216\u68c0\u67e5\u70b9\u6062\u590d\u6267\u884c\u8c03\u6574\u3002", "why_notable": "\u5c06\u81ea\u52a8\u5316\u7814\u7a76\u4ece\u5b8c\u6574\u5b9e\u9a8c\u63a8\u8fdb\u5230\u8bad\u7ec3\u8fc7\u7a0b\u4e2d\u7684\u6301\u7eed\u5e72\u9884\uff0c\u5c55\u793a\u65e0\u4eba\u503c\u5b88\u5f3a\u5316\u5b66\u4e60\u8c03\u4f18\u7684\u53ef\u884c\u6027\uff0c\u4e3a\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u63d0\u4f9b\u8bad\u7ec3\u57fa\u7840\u3002"}, {"abstract": "Long-horizon LLM agents can coordinate tools and applications to complete complex, multi-step tasks. As their interaction histories grow, effective context management becomes essential for reliable and efficient execution. Existing methods reduce context through summarization, pruning, or history selection. However, shorter contexts do not necessarily support better decisions: summaries can omit exact details needed for later actions, while retaining entire interactions can carry substantial irrelevant information. We propose CarryOn, a lightweight context manager that pairs compact execution state with fine-grained, source-linked evidence. A learned selector and adaptive retention policy keep relevant evidence available without additional LLM calls for context management. We introduce two complementary evaluation metrics: $S_\u03b1$ prioritizes task success while accounting for resource use, and normalized cost per success (NCS) measures the resources spent per successful task. Across AppWorld, OfficeBench, and Tau2 Telecom with three LLM Actors, CarryOn achieves 75.7% macro-averaged task success, exceeding the strongest baseline by 6.7 percentage points. It also achieves the best average scores on both metrics.", "arxiv_id": "2611.17808", "arxiv_url": "https://arxiv.org/abs/2611.17808", "authors": ["Lihuan Li", "Ruiyi Yang", "Jiru Wang", "Yifan Duan", "Xiachong Lin", "Hao Xue", "Yang Song", "Flora Salim"], "brief": "CarryOn\u5c06\u7d27\u51d1\u6267\u884c\u72b6\u6001\u4e0e\u7ec6\u7c92\u5ea6\u3001\u53ef\u8ffd\u6eaf\u8bc1\u636e\u914d\u5bf9\uff0c\u901a\u8fc7\u5b66\u4e60\u5f0f\u9009\u62e9\u5668\u548c\u81ea\u9002\u5e94\u4fdd\u7559\u7b56\u7565\u7ba1\u7406\u4e0a\u4e0b\u6587\uff0c\u65e0\u9700\u989d\u5916\u8c03\u7528\u5927\u6a21\u578b\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17808", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5b66\u4e60\u5f0f\u9009\u62e9\u5668\u914d\u5408\u81ea\u9002\u5e94\u4fdd\u7559\u7b56\u7565\u7b5b\u9009\u8bc1\u636e", "\u4e09\u9879\u57fa\u51c6\u3001\u4e09\u4e2a\u6267\u884c\u6a21\u578b\u4e0a\u6210\u529f\u738775.7%\uff0c\u9ad8\u51fa6.7\u4e2a\u767e\u5206\u70b9", "\u5f15\u5165S_\u03b1\u4e0eNCS\u6307\u6807\uff0c\u517c\u987e\u6210\u529f\u7387\u548c\u8d44\u6e90\u6d88\u8017"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u957f\u7a0b\u4efb\u52a1", "\u8d44\u6e90\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17808v1", "published_at": "2026-11-13", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "CarryOn: Learning What to Keep in Context for Long-Horizon LLM Agents", "tldr": "\u901a\u8fc7\u5b66\u4e60\u4fdd\u7559\u5173\u952e\u8bc1\u636e\uff0c\u63d0\u5347\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u4efb\u52a1\u6210\u529f\u7387\u4e0e\u8d44\u6e90\u6548\u7387\u3002", "upvotes": 0, "what_it_is": "CarryOn\u5c06\u7d27\u51d1\u6267\u884c\u72b6\u6001\u4e0e\u7ec6\u7c92\u5ea6\u3001\u53ef\u8ffd\u6eaf\u8bc1\u636e\u914d\u5bf9\uff0c\u901a\u8fc7\u5b66\u4e60\u5f0f\u9009\u62e9\u5668\u548c\u81ea\u9002\u5e94\u4fdd\u7559\u7b56\u7565\u7ba1\u7406\u4e0a\u4e0b\u6587\uff0c\u65e0\u9700\u989d\u5916\u8c03\u7528\u5927\u6a21\u578b\u3002", "why_notable": "\u628a\u4e0a\u4e0b\u6587\u538b\u7f29\u8f6c\u4e3a\u4fdd\u7559\u51b3\u7b56\u6240\u9700\u8bc1\u636e\uff0c\u5728\u4e0d\u589e\u52a0\u7ba1\u7406\u6a21\u578b\u8c03\u7528\u7684\u60c5\u51b5\u4e0b\uff0c\u540c\u65f6\u6539\u5584\u8de8\u57fa\u51c6\u4efb\u52a1\u6210\u529f\u7387\u4e0e\u8d44\u6e90\u6548\u7387\u3002"}, {"abstract": "Multimodal agentic coding requires robust visual reasoning to analyze observations and evaluate generated artifacts. Current frameworks largely rely on a Thinking-with-Images paradigm, where agents depend on their intrinsic vision to execute visually grounded tasks. However, this architectural coupling introduces a fundamental bottleneck. Agent performance remains strictly bounded by internal perceptual limitations. Furthermore, text-only agents lack native perception. Without specialized tools, they cannot perform visual reasoning. To overcome these constraints, we introduce the Vision-as-a-Tool (VaaT) paradigm. Prior visual tool-use merely manipulates images for an agent\u0027s intrinsic vision to read. In contrast, VaaT reframes general-purpose multimodal large language models (MLLMs) as callable external utilities. As a result, text-only agents can completely offload visual reasoning during agentic execution. Meanwhile, vision-capable agents can dynamically augment their native perception on demand. We instantiate this paradigm in VHarness, a unified framework driven by five atomic actions. We comprehensively evaluate VHarness across Image-to-HTML, Image-to-SVG, and Image-to-3D generation tasks. Experimental results demonstrate that VHarness consistently improves visual fidelity and geometric accuracy across both text-only and multimodal coding agents. These findings highlight that modularizing visual reasoning into callable utilities provides a flexible and scalable foundation for future agentic coding systems.", "arxiv_id": "2611.17797", "arxiv_url": "https://arxiv.org/abs/2611.17797", "authors": ["Haolin Yang", "Wenshan Wu", "Jin Jiang", "Yu Cheng", "Yan Xia", "Ting Song", "Yangyu Huang", "Zhiliang Peng", "Wenhui Wang", "Hangbo Bao", "Yuzhe Zhang", "Wen-Da Wei", "Tengchao Lv", "Li Dong", "Lei Cui", "Furu Wei"], "brief": "\u63d0\u51faVaaT\u8303\u5f0f\uff0c\u5c06\u901a\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u4f5c\u4e3a\u5916\u90e8\u89c6\u89c9\u5de5\u5177\uff0c\u4f9b\u7f16\u7801\u667a\u80fd\u4f53\u8c03\u7528\u3002\u4ee5\u4e94\u79cd\u539f\u5b50\u52a8\u4f5c\u6784\u5efaVHarness\uff0c\u652f\u6301\u7eaf\u6587\u672c\u667a\u80fd\u4f53\u5916\u5305\u89c6\u89c9\u63a8\u7406\u3001\u591a\u6a21\u6001\u667a\u80fd\u4f53\u6309\u9700\u589e\u5f3a\u611f\u77e5\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17797", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["VaaT\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u5c01\u88c5\u4e3a\u53ef\u8c03\u7528\u89c6\u89c9\u5de5\u5177", "VHarness\u4ee5\u4e94\u79cd\u539f\u5b50\u52a8\u4f5c\u7edf\u4e00\u89c6\u89c9\u5de5\u5177\u8c03\u7528", "\u5728\u56fe\u50cf\u8f6cHTML\u3001SVG\u548c3D\u4efb\u52a1\u4e2d\u63d0\u5347\u89c6\u89c9\u4e0e\u51e0\u4f55\u8d28\u91cf"], "keywords": ["\u667a\u80fd\u4f53\u7f16\u7a0b", "\u89c6\u89c9\u63a8\u7406", "\u5de5\u5177\u8c03\u7528", "\u591a\u6a21\u6001\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17797v1", "published_at": "2026-11-13", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Vision-as-a-Tool: Visual Harness for Multimodal Agentic Coding", "tldr": "\u5c06\u89c6\u89c9\u63a8\u7406\u5916\u5305\u4e3a\u53ef\u8c03\u7528\u5de5\u5177\uff0c\u8ba9\u7f16\u7801\u667a\u80fd\u4f53\u7a81\u7834\u81ea\u8eab\u611f\u77e5\u80fd\u529b\u9650\u5236\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faVaaT\u8303\u5f0f\uff0c\u5c06\u901a\u7528\u591a\u6a21\u6001\u5927\u6a21\u578b\u4f5c\u4e3a\u5916\u90e8\u89c6\u89c9\u5de5\u5177\uff0c\u4f9b\u7f16\u7801\u667a\u80fd\u4f53\u8c03\u7528\u3002\u4ee5\u4e94\u79cd\u539f\u5b50\u52a8\u4f5c\u6784\u5efaVHarness\uff0c\u652f\u6301\u7eaf\u6587\u672c\u667a\u80fd\u4f53\u5916\u5305\u89c6\u89c9\u63a8\u7406\u3001\u591a\u6a21\u6001\u667a\u80fd\u4f53\u6309\u9700\u589e\u5f3a\u611f\u77e5\u3002", "why_notable": "\u628a\u89c6\u89c9\u80fd\u529b\u4e0e\u7f16\u7801\u667a\u80fd\u4f53\u89e3\u8026\uff0c\u4f7f\u7eaf\u6587\u672c\u6a21\u578b\u4e5f\u80fd\u53c2\u4e0e\u89c6\u89c9\u4efb\u52a1\uff0c\u5e76\u4e3a\u591a\u6a21\u6001\u667a\u80fd\u4f53\u63d0\u4f9b\u53ef\u6309\u9700\u6269\u5c55\u7684\u611f\u77e5\u8def\u5f84\u3002"}, {"abstract": "Flow-based generative models are trained on a hand-chosen prediction target, such as the velocity, the noise, or the clean data. This choice strongly affects training and sample quality. We introduce Anisotropic Flow Models (AnisoFlow), which replaces a fixed prediction target with a fully learnable one. AnisoFlow learns to scale the noise component of the target anisotropically, assigning a separate nonnegative weight to each direction in a jointly learned basis. A closed-form map recovers the velocity from the network\u0027s prediction, leaving the architecture, flow-matching loss, and sampler unchanged. Since recovery is exact, training optimizes the target purely to make it easier for the network to predict. We theoretically analyze the resulting prediction error and predict that the preferred noise weight in each direction scales near-linearly with data variance, in agreement with the weights learned empirically in pixel space. AnisoFlow improves FID from 1.90 to 1.55 over the JiT baseline on ImageNet 256$\\times$256, by learning only the prediction target, without representation alignment or architectural changes. In pixel-space text-to-image generation, AnisoFlow improves image quality and, through better-conditioned velocity recovery, largely removes patch-seam artifacts under reduced-precision inference.", "arxiv_id": "2611.17767", "arxiv_url": "https://arxiv.org/abs/2611.17767", "authors": ["Rayhan Zirvi", "Hansheng Chen", "Gordon Wetzstein", "Leonidas Guibas"], "brief": "AnisoFlow\u5c06\u56fa\u5b9a\u9884\u6d4b\u76ee\u6807\u6539\u4e3a\u53ef\u5b66\u4e60\u76ee\u6807\uff0c\u5728\u8054\u5408\u5b66\u4e60\u7684\u57fa\u5e95\u4e2d\u4e3a\u5404\u65b9\u5411\u566a\u58f0\u5206\u914d\u975e\u8d1f\u6743\u91cd\u3002\u901a\u8fc7\u95ed\u5f0f\u6620\u5c04\u7cbe\u786e\u6062\u590d\u901f\u5ea6\uff0c\u65e0\u9700\u4fee\u6539\u67b6\u6784\u3001\u6d41\u5339\u914d\u635f\u5931\u6216\u91c7\u6837\u5668\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17767", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5404\u5411\u5f02\u6027\u566a\u58f0\u52a0\u6743\uff1a\u65b9\u5411\u6743\u91cd\u968f\u6570\u636e\u65b9\u5dee\u8fd1\u7ebf\u6027\u53d8\u5316", "ImageNet 256\u00d7256\u4e0aFID\u7531JiT\u76841.90\u964d\u81f31.55", "\u6539\u5584\u901f\u5ea6\u6062\u590d\u7684\u6761\u4ef6\u6027\uff0c\u5927\u5e45\u51cf\u5c11\u4f4e\u7cbe\u5ea6\u63a8\u7406\u7684\u5757\u95f4\u63a5\u7f1d"], "keywords": ["\u6d41\u5339\u914d", "\u751f\u6210\u6a21\u578b", "\u56fe\u50cf\u751f\u6210", "\u4f4e\u7cbe\u5ea6\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17767v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Learning Anisotropic Prediction Targets for Flow Models", "tldr": "\u901a\u8fc7\u5b66\u4e60\u5404\u65b9\u5411\u7684\u9884\u6d4b\u76ee\u6807\u6743\u91cd\uff0c\u63d0\u5347\u6d41\u6a21\u578b\u751f\u6210\u8d28\u91cf\u5e76\u51cf\u5c11\u4f4e\u7cbe\u5ea6\u63a8\u7406\u4f2a\u5f71\u3002", "upvotes": 0, "what_it_is": "AnisoFlow\u5c06\u56fa\u5b9a\u9884\u6d4b\u76ee\u6807\u6539\u4e3a\u53ef\u5b66\u4e60\u76ee\u6807\uff0c\u5728\u8054\u5408\u5b66\u4e60\u7684\u57fa\u5e95\u4e2d\u4e3a\u5404\u65b9\u5411\u566a\u58f0\u5206\u914d\u975e\u8d1f\u6743\u91cd\u3002\u901a\u8fc7\u95ed\u5f0f\u6620\u5c04\u7cbe\u786e\u6062\u590d\u901f\u5ea6\uff0c\u65e0\u9700\u4fee\u6539\u67b6\u6784\u3001\u6d41\u5339\u914d\u635f\u5931\u6216\u91c7\u6837\u5668\u3002", "why_notable": "\u4ec5\u5b66\u4e60\u9884\u6d4b\u76ee\u6807\u5c31\u80fd\u6539\u5584\u751f\u6210\u8d28\u91cf\uff0c\u63d0\u4f9b\u4e86\u72ec\u7acb\u4e8e\u67b6\u6784\u6539\u9020\u7684\u4f18\u5316\u8def\u5f84\uff1b\u540c\u65f6\u7f13\u89e3\u4f4e\u7cbe\u5ea6\u63a8\u7406\u4f2a\u5f71\uff0c\u5177\u6709\u5b9e\u9645\u90e8\u7f72\u4ef7\u503c\u3002"}, {"abstract": "As AI conference submissions grow rapidly, AI reviewers are being considered as an alternative. However, simply imitating human reviewing is problematic because reviewing serves multiple purposes, including evaluating papers\u0027 soundness, interestingness, and clarity, the last two of which are subjective. In this work, we focus solely on evaluating soundness, the most important and objective criterion, and define the learning objective as jointly maximizing (1) precision, based on the soundness and substantiveness of review points, and (2) recall, the coverage of high-quality reference review points. Under this problem formulation, we construct a quality-labeled review point dataset, PaperSound-23K, using 1K ICLR submissions and 23K human-written and LLM-generated review points. Using this dataset, we train an AI reviewer model, PaperCritic, through reinforcement learning with the F1 score of precision and recall as the reward. Our experiments show that PaperCritic outperforms frontier models and models trained with other AI reviewer training methods on an in-domain test set. Surprisingly, learning to review ICLR submissions also transfers to reviewing Nature-family papers and even to out-of-domain reviewing tasks (e.g., code review, legal contract review, and feedback on story writing).", "arxiv_id": "2611.17834", "arxiv_url": "https://arxiv.org/abs/2611.17834", "authors": ["Hyun Ryu", "Ji Yong Cho", "Eunho Yang", "Moontae Lee", "June Yong Yang", "Sean Welleck", "Carolyn Rose"], "brief": "\u8be5\u5de5\u4f5c\u5c06\u5ba1\u7a3f\u805a\u7126\u4e8e\u8bba\u6587\u8bba\u8bc1\u662f\u5426\u53ef\u9760\uff0c\u6784\u5efa\u5e26\u8d28\u91cf\u6807\u7b7e\u7684\u5ba1\u7a3f\u8981\u70b9\u6570\u636e\u96c6\uff0c\u5e76\u4ee5\u51c6\u786e\u7387\u548c\u53ec\u56de\u7387\u7684F1\u5206\u6570\u4e3a\u5956\u52b1\uff0c\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3PaperCritic\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17834", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["PaperSound-23K\u542b1\u5343\u7bc7ICLR\u6295\u7a3f\u30012.3\u4e07\u6761\u5ba1\u7a3f\u8981\u70b9", "\u4ee5\u8981\u70b9\u53ef\u9760\u6027\u3001\u5b9e\u8d28\u6027\u53ca\u53c2\u8003\u8981\u70b9\u8986\u76d6\u7387\u8ba1\u7b97F1\u5956\u52b1", "\u57df\u5185\u4f18\u4e8e\u524d\u6cbf\u6a21\u578b\uff0c\u5e76\u8fc1\u79fb\u81f3Nature\u8bba\u6587\u53ca\u4ee3\u7801\u8bc4\u5ba1"], "keywords": ["\u81ea\u52a8\u5ba1\u7a3f", "\u5f3a\u5316\u5b66\u4e60", "\u8d28\u91cf\u8bc4\u4f30", "\u8de8\u9886\u57df\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17834v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "PaperCritic: Training AI Reviewers to Assess the Soundness of Papers", "tldr": "\u7528\u5ba1\u7a3f\u610f\u89c1\u8d28\u91cf\u4e0e\u8986\u76d6\u7387\u8054\u5408\u5956\u52b1\uff0c\u8bad\u7ec3\u53ef\u8fc1\u79fb\u5230\u8de8\u9886\u57df\u8bc4\u5ba1\u7684\u8bba\u6587\u5ba1\u7a3f\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": "\u8be5\u5de5\u4f5c\u5c06\u5ba1\u7a3f\u805a\u7126\u4e8e\u8bba\u6587\u8bba\u8bc1\u662f\u5426\u53ef\u9760\uff0c\u6784\u5efa\u5e26\u8d28\u91cf\u6807\u7b7e\u7684\u5ba1\u7a3f\u8981\u70b9\u6570\u636e\u96c6\uff0c\u5e76\u4ee5\u51c6\u786e\u7387\u548c\u53ec\u56de\u7387\u7684F1\u5206\u6570\u4e3a\u5956\u52b1\uff0c\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3PaperCritic\u3002", "why_notable": "\u5c06\u4e3b\u89c2\u5ba1\u7a3f\u504f\u597d\u4e0e\u8bba\u8bc1\u53ef\u9760\u6027\u8bc4\u4f30\u5206\u79bb\uff0c\u4e3a\u81ea\u52a8\u8bc4\u5ba1\u63d0\u4f9b\u66f4\u660e\u786e\u7684\u8bad\u7ec3\u76ee\u6807\uff1b\u8de8\u9886\u57df\u8fc1\u79fb\u7ed3\u679c\u663e\u793a\u5176\u53ef\u80fd\u5b66\u5230\u901a\u7528\u7684\u6279\u5224\u6027\u8bc4\u4f30\u80fd\u529b\u3002"}, {"abstract": "World-model video encoders such as V-JEPA learn how scenes change (direction, speed, order, state) from video alone. To answer questions, they are joined to a language model trained on captions and question-answer pairs. But each caption or question names only a few attributes of a clip, so the model learns to retrieve those attributes rather than to read the clip, and the dynamics the encoder carries go unused: on the same items, a linear probe reads speed from frozen V-JEPA features at 87% while the VLM answers at chance. We show where dynamics lives in a frozen encoder: in a subspace shared across videos for predictive encoders such as V-JEPA, but not as a shared component of frame-wise, text-aligned encoders such as SigLIP. We then build counterfactual supervision that makes the language model read it: pixel transformations turn public videos into answer-balanced variants whose answers are set by the transformation and differ only in the change. Trained in a single stage on 4.53M public samples with 32 visual tokens per frame, where open video LLMs use several stages, 9M to 172M samples and 64 to 256 tokens per frame on average, the resulting V-JEPA-LM models (1B to 8B, Qwen3 and Llama) lead every size class in average score across eleven video benchmarks; our 4B model scores 72.1, against 61.1 for the best open 4B and 64.8 for the best open 8B model. A controlled encoder x supervision study shows that the encoder decides what can be read and the supervision what is read: at a matched budget, counterfactual supervision adds 4.5 points on average and 38 on the speed questions of natural benchmarks. Code and models: https://github.com/kkt94/Llama-V-JEPA-LM.", "arxiv_id": "2611.17831", "arxiv_url": "https://arxiv.org/abs/2611.17831", "authors": ["Keuntae Kim", "Dongjun Kim", "Yong Suk Choi"], "brief": "\u5c06\u51bb\u7ed3\u7684V-JEPA\u7f16\u7801\u5668\u63a5\u5165\u8bed\u8a00\u6a21\u578b\uff0c\u7528\u50cf\u7d20\u53d8\u6362\u751f\u6210\u7b54\u6848\u5747\u8861\u3001\u4ec5\u52a8\u6001\u53d8\u5316\u4e0d\u540c\u7684\u53cd\u4e8b\u5b9e\u89c6\u9891\uff0c\u5355\u9636\u6bb5\u8bad\u7ec3\u6a21\u578b\u8bfb\u53d6\u901f\u5ea6\u3001\u65b9\u5411\u548c\u65f6\u5e8f\u4fe1\u606f\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17831", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["V-JEPA\u52a8\u6001\u4fe1\u606f\u4f4d\u4e8e\u8de8\u89c6\u9891\u5171\u4eab\u5b50\u7a7a\u95f4", "\u5355\u9636\u6bb5\u8bad\u7ec3453\u4e07\u6837\u672c\uff0c\u6bcf\u5e2732\u4e2a\u89c6\u89c9\u4ee4\u724c", "\u53cd\u4e8b\u5b9e\u76d1\u7763\u5e73\u5747\u63d0\u53474.5\u5206\uff0c\u901f\u5ea6\u9898\u63d0\u534738\u5206"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u53cd\u4e8b\u5b9e\u76d1\u7763", "\u4e16\u754c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17831v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations", "tldr": "\u901a\u8fc7\u53cd\u4e8b\u5b9e\u89c6\u9891\u76d1\u7763\uff0c\u8ba9\u8bed\u8a00\u6a21\u578b\u8bfb\u51fa\u9884\u6d4b\u5f0f\u7f16\u7801\u5668\u4e2d\u7684\u52a8\u6001\u4fe1\u606f\u5e76\u63d0\u5347\u95ee\u7b54\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": "\u5c06\u51bb\u7ed3\u7684V-JEPA\u7f16\u7801\u5668\u63a5\u5165\u8bed\u8a00\u6a21\u578b\uff0c\u7528\u50cf\u7d20\u53d8\u6362\u751f\u6210\u7b54\u6848\u5747\u8861\u3001\u4ec5\u52a8\u6001\u53d8\u5316\u4e0d\u540c\u7684\u53cd\u4e8b\u5b9e\u89c6\u9891\uff0c\u5355\u9636\u6bb5\u8bad\u7ec3\u6a21\u578b\u8bfb\u53d6\u901f\u5ea6\u3001\u65b9\u5411\u548c\u65f6\u5e8f\u4fe1\u606f\u3002", "why_notable": "\u4ee5\u66f4\u5c11\u6837\u672c\u548c\u89c6\u89c9\u4ee4\u724c\u5728\u5341\u4e00\u9879\u89c6\u9891\u57fa\u51c6\u5404\u89c4\u6a21\u7ec4\u9886\u5148\uff1b4B\u6a21\u578b\u5747\u520672.1\uff0c\u8d85\u8fc7\u6700\u4f73\u5f00\u653e8B\u6a21\u578b\u768464.8\u3002"}, {"abstract": "Large Language Models (LLMs) pose significant security risks by retaining private or hazardous information, creating an urgent need for unlearning techniques that excise specific knowledge without compromising general utility. However, prevailing fine-tuning-based unlearning methods struggle to achieve this balance, often suffering from computational inefficiency and unintended utility degradation due to the entangled nature of knowledge within model parameters. To disentangle forgetting from utility, we propose UUE, a theoretically grounded framework that reformulates unlearning as controllable model editing. First, UUE projects parameter updates into the orthogonal left null space of retained knowledge representations, strictly ensuring that the editing process causes minimal interference to the model\u0027s general capabilities. Second, distinct from targeted mapping, we introduce a convex untargeted objective that derives a closed-form analytical solution to effectively disrupt undesired knowledge by pushing forget-set embeddings toward their antipodal points. We implement UUE via lightweight, pluggable adapters (including a low-rank variant, UUE-L), enabling efficient deployment without modifying the frozen backbone. Extensive experiments on TOFU and WMDP benchmarks demonstrate that UUE and UUE-L achieve superior unlearning efficacy, significantly outperforming existing methods.", "arxiv_id": "2611.17864", "arxiv_url": "https://arxiv.org/abs/2611.17864", "authors": ["Xiuyuan Wang", "Weiming Liu", "Zongxin Yang", "Fan Wang", "Liemiao Jin", "Rubin Qin", "Wei Chen", "Bin Shi", "Chaochao Chen", "Xiaolin Zheng"], "brief": "UUE\u5c06\u9057\u5fd8\u8f6c\u5316\u4e3a\u53ef\u63a7\u6a21\u578b\u7f16\u8f91\uff0c\u628a\u53c2\u6570\u66f4\u65b0\u6295\u5f71\u5230\u4fdd\u7559\u77e5\u8bc6\u8868\u793a\u7684\u6b63\u4ea4\u5de6\u96f6\u7a7a\u95f4\uff0c\u518d\u5c06\u5f85\u9057\u5fd8\u5d4c\u5165\u63a8\u5411\u5bf9\u8dd6\u70b9\uff0c\u901a\u8fc7\u8f7b\u91cf\u9002\u914d\u5668\u5b9e\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17864", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6b63\u4ea4\u5de6\u96f6\u7a7a\u95f4\u6295\u5f71\u9650\u5236\u66f4\u65b0\u5bf9\u4fdd\u7559\u77e5\u8bc6\u7684\u5e72\u6270", "\u51f8\u975e\u5b9a\u5411\u76ee\u6807\u63d0\u4f9b\u95ed\u5f0f\u89e3\uff0c\u5c06\u9057\u5fd8\u5d4c\u5165\u63a8\u5411\u5bf9\u8dd6\u70b9", "UUE\u53ca\u4f4e\u79e9\u7248UUE-L\u5728TOFU\u3001WMDP\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5"], "keywords": ["\u673a\u5668\u9057\u5fd8", "\u6a21\u578b\u7f16\u8f91", "\u77e5\u8bc6\u5b89\u5168", "\u53c2\u6570\u9ad8\u6548\u9002\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17864v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Disentangling Forgetting from Utility: Lightweight LLM Unlearning via Orthogonal Null-Space Projection", "tldr": "\u901a\u8fc7\u6b63\u4ea4\u96f6\u7a7a\u95f4\u6295\u5f71\u4e0e\u95ed\u5f0f\u7f16\u8f91\uff0c\u8f7b\u91cf\u79fb\u9664\u6a21\u578b\u77e5\u8bc6\u5e76\u51cf\u5c11\u901a\u7528\u80fd\u529b\u635f\u5931\u3002", "upvotes": 0, "what_it_is": "UUE\u5c06\u9057\u5fd8\u8f6c\u5316\u4e3a\u53ef\u63a7\u6a21\u578b\u7f16\u8f91\uff0c\u628a\u53c2\u6570\u66f4\u65b0\u6295\u5f71\u5230\u4fdd\u7559\u77e5\u8bc6\u8868\u793a\u7684\u6b63\u4ea4\u5de6\u96f6\u7a7a\u95f4\uff0c\u518d\u5c06\u5f85\u9057\u5fd8\u5d4c\u5165\u63a8\u5411\u5bf9\u8dd6\u70b9\uff0c\u901a\u8fc7\u8f7b\u91cf\u9002\u914d\u5668\u5b9e\u73b0\u3002", "why_notable": "\u5c06\u9057\u5fd8\u4e0e\u80fd\u529b\u4fdd\u7559\u7684\u6743\u8861\u8f6c\u5316\u4e3a\u6709\u7406\u8bba\u4f9d\u636e\u7684\u7f16\u8f91\u7ea6\u675f\uff0c\u5e76\u4ee5\u51bb\u7ed3\u4e3b\u5e72\u7684\u9002\u914d\u5668\u964d\u4f4e\u90e8\u7f72\u8d1f\u62c5\uff0c\u4e3a\u9ad8\u6548\u77e5\u8bc6\u79fb\u9664\u63d0\u4f9b\u65b0\u8def\u5f84\u3002"}, {"abstract": "Multi-agent systems solve complex tasks by decomposing them into subtasks, delegating the subtasks to agents, and aggregating the agents\u0027 responses using an aggregation rule. Malicious agents can manipulate the final solution by providing malicious responses to their assigned subtasks. In this paper, we first propose response manipulation attacks (ReMA), which iteratively optimize malicious responses to maximize attack effectiveness. Specifically, we formulate untargeted and targeted attacks as optimization problems and develop an approach to approximately solve these problems by iteratively refining malicious responses based on feedback from a surrogate multi-agent system. To defend against such attacks, we further propose SecMAS, a secure aggregation rule that leverages the semantic similarities among agent responses to select the response that is most consistent with a sufficiently large subset of the other responses. We theoretically establish security guarantees for SecMAS against both untargeted and targeted attacks. Extensive evaluations demonstrate that existing aggregation rules are vulnerable to ReMA, whereas SecMAS effectively defends against all evaluated attacks, including adaptive variants of ReMA, while maintaining utility comparable to that of existing aggregation rules.", "arxiv_id": "2611.17883", "arxiv_url": "https://arxiv.org/abs/2611.17883", "authors": ["Xilong Wang", "Xiaoxing Chen", "Neil Gong"], "brief": "\u63d0\u51fa\u54cd\u5e94\u64cd\u7eb5\u653b\u51fbReMA\uff0c\u501f\u52a9\u4ee3\u7406\u7cfb\u7edf\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u6076\u610f\u54cd\u5e94\uff1b\u8bbe\u8ba1SecMAS\u805a\u5408\u89c4\u5219\uff0c\u4f9d\u636e\u8bed\u4e49\u76f8\u4f3c\u5ea6\u9009\u62e9\u4e0e\u8db3\u591f\u591a\u5176\u4ed6\u54cd\u5e94\u4e00\u81f4\u7684\u7ed3\u679c\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17883", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["ReMA\u5c06\u5b9a\u5411\u4e0e\u975e\u5b9a\u5411\u54cd\u5e94\u64cd\u7eb5\u5efa\u6a21\u4e3a\u4f18\u5316\u95ee\u9898", "SecMAS\u6309\u54cd\u5e94\u8bed\u4e49\u76f8\u4f3c\u5ea6\u7b5b\u9009\u4e00\u81f4\u6027\u7ed3\u679c", "\u7406\u8bba\u8bc1\u660e\u5b89\u5168\u4fdd\u8bc1\uff0c\u5b9e\u9a8c\u62b5\u5fa1\u81ea\u9002\u5e94ReMA"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u5bf9\u6297\u653b\u51fb", "\u5b89\u5168\u805a\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17883v1", "published_at": "2026-11-13", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Securing Multi-Agent Systems by Design", "tldr": "\u901a\u8fc7\u8fed\u4ee3\u653b\u51fb\u4e0e\u8bed\u4e49\u4e00\u81f4\u6027\u805a\u5408\uff0c\u4e3a\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u63d0\u4f9b\u53ef\u8bc1\u660e\u7684\u5b89\u5168\u9632\u5fa1\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u54cd\u5e94\u64cd\u7eb5\u653b\u51fbReMA\uff0c\u501f\u52a9\u4ee3\u7406\u7cfb\u7edf\u53cd\u9988\u8fed\u4ee3\u4f18\u5316\u6076\u610f\u54cd\u5e94\uff1b\u8bbe\u8ba1SecMAS\u805a\u5408\u89c4\u5219\uff0c\u4f9d\u636e\u8bed\u4e49\u76f8\u4f3c\u5ea6\u9009\u62e9\u4e0e\u8db3\u591f\u591a\u5176\u4ed6\u54cd\u5e94\u4e00\u81f4\u7684\u7ed3\u679c\u3002", "why_notable": "\u628a\u9632\u5fa1\u91cd\u70b9\u653e\u5728\u591a\u667a\u80fd\u4f53\u7684\u7ed3\u679c\u805a\u5408\u73af\u8282\uff0c\u540c\u65f6\u7ed9\u51fa\u7406\u8bba\u4fdd\u8bc1\u4e0e\u653b\u51fb\u9a8c\u8bc1\uff0c\u5728\u7ef4\u6301\u4efb\u52a1\u6548\u7528\u7684\u540c\u65f6\u964d\u4f4e\u6076\u610f\u6210\u5458\u7684\u5f71\u54cd\u3002"}, {"abstract": "Mixture-of-Experts (MoE) architectures activate only a subset of experts for each token, allowing large language models (LLMs) to scale parameter capacity without a proportional increase in computation per token. However, intermediate data movement and uneven expert loads limit the efficiency of MoE inference on TPUs. To address these bottlenecks, we introduce Fuse-All MoE, a TPU kernel design that jointly optimizes expert computation, output communication, and load balancing. The kernel fuses token collection, expert projections, gated activation, and output writes, retaining expert computation intermediates on chip. Fixed token-slot destinations allow scheduling and expert placement to change while preserving routing semantics. In prefill-decode (PD) disaggregated serving, Fuse-All MoE balances EP16 prefill workloads through scheduling and expert redistribution, while symmetric EP8TP2 shares active expert computation between the two TensorCore devices within each chip during decode. Our experiments show that Fuse-All MoE reduces kernel runtime for a measured skewed EP16 prefill workload from 2.3x to 1.09x the same fixed reference time for a balanced workload. Across 32-512 decode tokens, symmetric EP8TP2 reduces kernel latency by up to 21.3% relative to fused EP16. With accompanying serving stack optimizations, the integrated system improves serving throughput by up to 34.5% over the Megablox EP16 baseline.", "arxiv_id": "2611.17857", "arxiv_url": "https://arxiv.org/abs/2611.17857", "authors": ["Rupeng Liu", "Bangsheng Tang", "Zongwei Zhou", "Chengji Yao", "Yejin Lee"], "brief": "\u63d0\u51fa\u9762\u5411TPU\u7684\u878d\u5408\u63a8\u7406\u5185\u6838\uff0c\u5c06\u4ee4\u724c\u6536\u96c6\u3001\u4e13\u5bb6\u6295\u5f71\u3001\u95e8\u63a7\u6fc0\u6d3b\u4e0e\u8f93\u51fa\u5199\u5165\u5408\u5e76\uff0c\u4fdd\u7559\u7247\u4e0a\u4e2d\u95f4\u6570\u636e\uff1b\u518d\u6309\u9884\u586b\u5145\u4e0e\u89e3\u7801\u9636\u6bb5\u5206\u522b\u4f18\u5316\u8c03\u5ea6\u548c\u4e13\u5bb6\u5e03\u5c40\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17857", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u56fa\u5b9a\u4ee4\u724c\u69fd\u4f4d\uff0c\u4f7f\u8c03\u5ea6\u4e0e\u4e13\u5bb6\u5e03\u5c40\u53d8\u5316\u4e0d\u5f71\u54cd\u8def\u7531\u8bed\u4e49", "EP16\u9884\u586b\u5145\u504f\u659c\u8017\u65f6\u7531\u5747\u8861\u53c2\u8003\u76842.3\u500d\u964d\u81f31.09\u500d", "\u5bf9\u79f0EP8TP2\u572832\u2014512\u4ee4\u724c\u89e3\u7801\u4e2d\u6700\u591a\u964d\u5ef6\u8fdf21.3%"], "keywords": ["\u6df7\u5408\u4e13\u5bb6", "\u63a8\u7406\u4f18\u5316", "\u8d1f\u8f7d\u5747\u8861", "TPU"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17857v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Fuse-All MoE Inference Kernel with Load Balancing on TPUs", "tldr": "\u901a\u8fc7\u878d\u5408\u8ba1\u7b97\u4e0e\u901a\u4fe1\u53ca\u4e13\u5bb6\u8d1f\u8f7d\u5747\u8861\uff0c\u63d0\u5347TPU\u4e0a\u7684\u6df7\u5408\u4e13\u5bb6\u63a8\u7406\u6548\u7387\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9762\u5411TPU\u7684\u878d\u5408\u63a8\u7406\u5185\u6838\uff0c\u5c06\u4ee4\u724c\u6536\u96c6\u3001\u4e13\u5bb6\u6295\u5f71\u3001\u95e8\u63a7\u6fc0\u6d3b\u4e0e\u8f93\u51fa\u5199\u5165\u5408\u5e76\uff0c\u4fdd\u7559\u7247\u4e0a\u4e2d\u95f4\u6570\u636e\uff1b\u518d\u6309\u9884\u586b\u5145\u4e0e\u89e3\u7801\u9636\u6bb5\u5206\u522b\u4f18\u5316\u8c03\u5ea6\u548c\u4e13\u5bb6\u5e03\u5c40\u3002", "why_notable": "\u540c\u65f6\u7f13\u89e3\u6570\u636e\u642c\u8fd0\u4e0e\u4e13\u5bb6\u8d1f\u8f7d\u504f\u659c\uff1b\u914d\u5408\u670d\u52a1\u6808\u4f18\u5316\uff0c\u7cfb\u7edf\u541e\u5410\u8f83Megablox EP16\u57fa\u7ebf\u6700\u9ad8\u63d0\u534734.5%\u3002"}, {"abstract": "Knowledge distillation (KD) is a highly effective paradigm for transferring capabilities from large language models (LLMs) to smaller, more specialized student models. In commercial deployment where frontier models are restricted behind black-box APIs, sequence-level distillation remains a potent vector for competitors to clone proprietary capabilities at a fraction of the development cost. Existing defenses mostly rely on surrogate models to manipulate next-token sampling, which increases computational overhead and real-time inference latency. In this work, we propose a lightweight defense that dynamically injects style-steering vectors into the teacher model\u0027s activations upon malicious queries. This framework offers exceptional flexibility, allowing hosts to customize target defensive styles and dynamically blend them to maximize stylistic variance. Crucially, this inference-time intervention preserves semantic utility and fluency during malicious queries, misleading adversaries into believing that they are extracting pristine teacher outputs, while standard consumers continue to receive original, unmodified responses. Our experiments demonstrate that this framework successfully disrupts student learning, achieving substantial anti-distillation performance while incurring negligible overhead and preserving text naturalness. Our code is available at https://anonymous.4open.science/r/distill-resist-38C6/.", "arxiv_id": "2611.17772", "arxiv_url": "https://arxiv.org/abs/2611.17772", "authors": ["Anh Tu Ngo", "Anupam Chattopadhyay"], "brief": "\u63d0\u51fa\u4e00\u79cd\u63a8\u7406\u65f6\u9632\u5fa1\uff0c\u5728\u6076\u610f\u67e5\u8be2\u89e6\u53d1\u65f6\u5411\u6559\u5e08\u6a21\u578b\u6fc0\u6d3b\u6ce8\u5165\u98ce\u683c\u5f15\u5bfc\u5411\u91cf\u3002\u901a\u8fc7\u5b9a\u5236\u5e76\u52a8\u6001\u6df7\u5408\u8f93\u51fa\u98ce\u683c\u5e72\u6270\u5b66\u751f\u5b66\u4e60\uff0c\u540c\u65f6\u4fdd\u6301\u8bed\u4e49\u4e0e\u6d41\u7545\u5ea6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17772", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u98ce\u683c\u5f15\u5bfc\u5411\u91cf\u76f4\u63a5\u6ce8\u5165\u6559\u5e08\u6a21\u578b\u6fc0\u6d3b", "\u52a8\u6001\u6df7\u5408\u9632\u5fa1\u98ce\u683c\uff0c\u63d0\u9ad8\u8f93\u51fa\u98ce\u683c\u53d8\u5316", "\u5b9e\u9a8c\u663e\u793a\u84b8\u998f\u53d7\u963b\uff0c\u63a8\u7406\u989d\u5916\u5f00\u9500\u53ef\u5ffd\u7565"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6a21\u578b\u5b89\u5168", "\u98ce\u683c\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17772v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Antidistillation is Cheap: Lightweight Distillation-Resistance via Stylistic Corruption", "tldr": "\u901a\u8fc7\u5411\u6559\u5e08\u6a21\u578b\u6ce8\u5165\u98ce\u683c\u6270\u52a8\uff0c\u4ee5\u6781\u4f4e\u5f00\u9500\u963b\u788d\u7ade\u4e89\u8005\u84b8\u998f\u5176\u80fd\u529b", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u4e00\u79cd\u63a8\u7406\u65f6\u9632\u5fa1\uff0c\u5728\u6076\u610f\u67e5\u8be2\u89e6\u53d1\u65f6\u5411\u6559\u5e08\u6a21\u578b\u6fc0\u6d3b\u6ce8\u5165\u98ce\u683c\u5f15\u5bfc\u5411\u91cf\u3002\u901a\u8fc7\u5b9a\u5236\u5e76\u52a8\u6001\u6df7\u5408\u8f93\u51fa\u98ce\u683c\u5e72\u6270\u5b66\u751f\u5b66\u4e60\uff0c\u540c\u65f6\u4fdd\u6301\u8bed\u4e49\u4e0e\u6d41\u7545\u5ea6\u3002", "why_notable": "\u76f8\u6bd4\u4f9d\u8d56\u4ee3\u7406\u6a21\u578b\u64cd\u63a7\u91c7\u6837\u7684\u9632\u5fa1\uff0c\u8be5\u65b9\u6cd5\u964d\u4f4e\u4e86\u90e8\u7f72\u5f00\u9500\uff0c\u5e76\u5728\u4fdd\u6301\u6587\u672c\u81ea\u7136\u6027\u7684\u540c\u65f6\u963b\u788d\u80fd\u529b\u590d\u5236\uff0c\u9002\u5408\u5546\u4e1a\u6a21\u578b\u63a5\u53e3\u4fdd\u62a4\u3002"}, {"abstract": "Policy gradient methods are widely used to align large language model outputs with human preferences, but the log-likelihoods they require cannot be directly computed in Masked Diffusion Language Models (MDLMs). MDLM post-training therefore relies on a surrogate objective based on the Evidence Lower Bound (ELBO), and recent work estimates a blockwise variant of this objective via Monte Carlo methods to support blockwise generation. However, existing estimation schemes randomly sample the block index, so they may evaluate the same block more than once and leave some blocks unevaluated. This introduces variance arising from block selection into the estimates. In this work, we propose a full-block estimator that evaluates every block exactly once and averages the results. We theoretically show that the proposed estimator remains unbiased while eliminating the between-group variance arising from block selection, thereby achieving lower variance than the baseline for the same sample size. In experiments on five benchmarks spanning mathematics, planning, and coding, our method achieves the highest accuracy on four benchmarks and outperforms the random block sampling baseline by an average of 12.79 points.", "arxiv_id": "2611.17754", "arxiv_url": "https://arxiv.org/abs/2611.17754", "authors": ["Yunzhen He", "Hiroaki Yamagiwa", "Hidetoshi Shimodaira"], "brief": "\u63d0\u51fa\u7528\u4e8e\u63a9\u7801\u6269\u6563\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u7684\u5168\u5757\u4f30\u8ba1\u5668\uff0c\u4ee5\u5206\u5757ELBO\u4f5c\u4e3a\u66ff\u4ee3\u76ee\u6807\u3002\u6bcf\u4e2a\u5757\u6070\u597d\u8bc4\u4f30\u4e00\u6b21\u518d\u53d6\u5e73\u5747\uff0c\u907f\u514d\u968f\u673a\u62bd\u5757\u9020\u6210\u7684\u91cd\u590d\u4e0e\u9057\u6f0f\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17754", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5168\u5757\u4f30\u8ba1\u5668\u9010\u5757\u8bc4\u4f30\u4e00\u6b21\uff0c\u968f\u540e\u5e73\u5747\u7ed3\u679c", "\u7406\u8bba\u8bc1\u660e\u4fdd\u6301\u65e0\u504f\uff0c\u540c\u6837\u672c\u91cf\u4e0b\u6d88\u9664\u5757\u9009\u62e9\u7ec4\u95f4\u65b9\u5dee", "\u4e94\u9879\u57fa\u51c6\u4e2d\u56db\u9879\u6700\u4f18\uff0c\u8f83\u968f\u673a\u62bd\u5757\u5e73\u5747\u63d0\u534712.79\u70b9"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u540e\u8bad\u7ec3", "\u65b9\u5dee\u7f29\u51cf", "\u7b56\u7565\u68af\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17754v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "See Every Block Once: Variance-Reduced Post-Training for Masked Diffusion Language Models", "tldr": "\u901a\u8fc7\u904d\u5386\u5168\u90e8\u751f\u6210\u5757\u964d\u4f4e\u7b56\u7565\u68af\u5ea6\u4f30\u8ba1\u65b9\u5dee\uff0c\u6539\u5584\u63a9\u7801\u6269\u6563\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u7528\u4e8e\u63a9\u7801\u6269\u6563\u8bed\u8a00\u6a21\u578b\u540e\u8bad\u7ec3\u7684\u5168\u5757\u4f30\u8ba1\u5668\uff0c\u4ee5\u5206\u5757ELBO\u4f5c\u4e3a\u66ff\u4ee3\u76ee\u6807\u3002\u6bcf\u4e2a\u5757\u6070\u597d\u8bc4\u4f30\u4e00\u6b21\u518d\u53d6\u5e73\u5747\uff0c\u907f\u514d\u968f\u673a\u62bd\u5757\u9020\u6210\u7684\u91cd\u590d\u4e0e\u9057\u6f0f\u3002", "why_notable": "\u6539\u8fdb\u76f4\u63a5\u9488\u5bf9\u6269\u6563\u6a21\u578b\u540e\u8bad\u7ec3\u7684\u4f30\u8ba1\u566a\u58f0\uff0c\u800c\u975e\u66f4\u6362\u8bad\u7ec3\u76ee\u6807\uff1b\u7406\u8bba\u964d\u65b9\u5dee\u4e0e\u6570\u5b66\u3001\u89c4\u5212\u3001\u4ee3\u7801\u4efb\u52a1\u4e0a\u7684\u6536\u76ca\u76f8\u4e92\u5370\u8bc1\u3002"}, {"abstract": "The hyperelastic law of a material such as soft tissue differs between specimens, and often only a few specimens can be tested. Physics-augmented neural networks (PANNs) learn such laws from data without a prescribed functional form while keeping them physically admissible, and Bayesian versions of related models quantify the uncertainty of the law of one specimen or of a pooled group of specimens. A pooled fit, however, attributes the differences between specimens to measurement noise or to uncertainty about a mean law, and neither describes a new specimen. We first develop a Bayesian PANN for one specimen, whose priors keep the learned law plausible for few, noisy data. We then extend it to a hierarchical Bayesian PANN, a nonlinear mixed-effects model in which all specimens share learned polyconvex features and each specimen is a draw from a population of laws. Features, specimens, and population are inferred jointly by variational inference, with a separate model of the measurement noise, so that the variability between specimens is not mistaken for noise, the population carries its own uncertainty, and every specimen drawn from it is polyconvex. The population predicts the response of new specimens with credible intervals, without data or from a partial test, and assigns them to cohorts with quantified uncertainty, all without a prescribed form of the law. On synthetic populations, it recovers the population from few specimens and predicts new specimens more reliably than three published methods. On Treloar\u0027s rubber and on healthy and aneurysmal aortas, it reaches the accuracy of a deterministic PANN and assigns no aorta specimen to the wrong cohort with confidence, although it underestimates the uncertainty of untested curves.", "arxiv_id": "2611.17892", "arxiv_url": "https://arxiv.org/abs/2611.17892", "authors": ["Vincent C. Scholz", "Phaedon-Stelios Koutsourelakis"], "brief": "\u5c06\u7269\u7406\u589e\u5f3a\u795e\u7ecf\u7f51\u7edc\u6269\u5c55\u4e3a\u5206\u5c42\u8d1d\u53f6\u65af\u975e\u7ebf\u6027\u6df7\u5408\u6548\u5e94\u6a21\u578b\uff0c\u5171\u4eab\u591a\u51f8\u7279\u5f81\u5e76\u5b66\u4e60\u8bd5\u6837\u7fa4\u4f53\u5206\u5e03\u3002\u901a\u8fc7\u53d8\u5206\u63a8\u65ad\u8054\u5408\u4f30\u8ba1\u7279\u5f81\u3001\u4e2a\u4f53\u4e0e\u7fa4\u4f53\uff0c\u5355\u72ec\u5efa\u6a21\u6d4b\u91cf\u566a\u58f0\u3002", "categories": ["cs.CE", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17892", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5171\u4eab\u591a\u51f8\u7279\u5f81\uff0c\u4fdd\u8bc1\u7fa4\u4f53\u62bd\u6837\u6240\u5f97\u672c\u6784\u5f8b\u5747\u591a\u51f8", "\u65b0\u8bd5\u6837\u65e0\u9700\u6570\u636e\u6216\u4ec5\u51ed\u90e8\u5206\u6d4b\u8bd5\u5373\u53ef\u9884\u6d4b\u53ef\u4fe1\u533a\u95f4", "\u5408\u6210\u6570\u636e\u4f18\u4e8e3\u79cd\u5df2\u53d1\u8868\u65b9\u6cd5\uff0c\u4f46\u4f4e\u4f30\u672a\u6d4b\u8bd5\u66f2\u7ebf\u4e0d\u786e\u5b9a\u6027"], "keywords": ["\u8d1d\u53f6\u65af\u5b66\u4e60", "\u7269\u7406\u589e\u5f3a\u795e\u7ecf\u7f51\u7edc", "\u6750\u6599\u672c\u6784", "\u4e0d\u786e\u5b9a\u6027\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17892v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Hierarchical Bayesian physics-augmented neural networks for populations of hyperelastic laws: specimen variability and uncertainty from scarce, noisy data", "tldr": "\u5206\u5c42\u8d1d\u53f6\u65af\u7269\u7406\u589e\u5f3a\u7f51\u7edc\u4ece\u7a00\u5c11\u566a\u58f0\u6570\u636e\u5b66\u4e60\u6750\u6599\u4e2a\u4f53\u5dee\u5f02\u5e76\u9884\u6d4b\u65b0\u8bd5\u6837", "upvotes": 0, "what_it_is": "\u5c06\u7269\u7406\u589e\u5f3a\u795e\u7ecf\u7f51\u7edc\u6269\u5c55\u4e3a\u5206\u5c42\u8d1d\u53f6\u65af\u975e\u7ebf\u6027\u6df7\u5408\u6548\u5e94\u6a21\u578b\uff0c\u5171\u4eab\u591a\u51f8\u7279\u5f81\u5e76\u5b66\u4e60\u8bd5\u6837\u7fa4\u4f53\u5206\u5e03\u3002\u901a\u8fc7\u53d8\u5206\u63a8\u65ad\u8054\u5408\u4f30\u8ba1\u7279\u5f81\u3001\u4e2a\u4f53\u4e0e\u7fa4\u4f53\uff0c\u5355\u72ec\u5efa\u6a21\u6d4b\u91cf\u566a\u58f0\u3002", "why_notable": "\u5c06\u8bd5\u6837\u95f4\u771f\u5b9e\u5dee\u5f02\u4e0e\u6d4b\u91cf\u566a\u58f0\u5206\u5f00\uff0c\u4e3a\u5c11\u6837\u672c\u6750\u6599\u5efa\u6a21\u63d0\u4f9b\u7fa4\u4f53\u9884\u6d4b\u4e0e\u4e0d\u786e\u5b9a\u6027\u91cf\u5316\uff1b\u5728\u6a61\u80f6\u548c\u4e3b\u52a8\u8109\u6570\u636e\u4e0a\u8fbe\u5230\u786e\u5b9a\u6027\u6a21\u578b\u7cbe\u5ea6\u3002"}, {"abstract": "Quantum graph neural networks (QGNNs) apply parametrized quantum circuits to graph-structured data, with the aim of overcoming limits of classical graph neural networks in scalability, expressivity, and long-range information flow. Since the first Hamiltonian-based model in 2019, the field has produced many architectures, applications, and claims, but the evidence behind them has not been assessed systematically. This survey introduces a unified formalism that describes every QGNN as an encoder, a graph-conditioned circuit, observables, and an optional classical head, together with a circuit-level condition for permutation equivariance and a resource model for comparing costs. We organize the literature into five architecture families (convolutional, equivariant, message-passing and recurrent, Hamiltonian, and hybrid) and compare them by qubit cost, symmetry, scalability, and evidence. We then review symmetry and geometric inductive biases (permutation, rotation, and Lorentz), the results on expressivity, trainability, noise, and scalability, and applications in high-energy physics, chemistry, finance, healthcare, earth observation, and transportation. An audit of datasets and evaluation practices leads to a minimum reporting protocol. Our main finding is that the design space is rich and symmetry is the best-supported inductive bias, whereas the evidence remains thin: results are mostly simulated, on small graphs, at parity with classical models or with fewer parameters, and no advantage has yet been established on tasks over classical graph data. We identify five open challenges and a research agenda covering provable advantage, equivariant and geometric designs, fault-tolerant implementations, and shared benchmarks. The coverage extends through 2026 and emphasizes recent work.", "arxiv_id": "2611.17886", "arxiv_url": "https://arxiv.org/abs/2611.17886", "authors": ["Zeinab Sharifi", "Hossein Shirazi"], "brief": "\u8fd9\u7bc7\u7efc\u8ff0\u7528\u7f16\u7801\u5668\u3001\u56fe\u6761\u4ef6\u91cf\u5b50\u7535\u8def\u3001\u89c2\u6d4b\u91cf\u53ca\u53ef\u9009\u7ecf\u5178\u9884\u6d4b\u5934\u7edf\u4e00\u63cf\u8ff0\u91cf\u5b50\u56fe\u7f51\u7edc\uff0c\u5e76\u6309\u4e94\u7c7b\u67b6\u6784\u6bd4\u8f83\u8d44\u6e90\u6210\u672c\u3001\u5bf9\u79f0\u6027\u4e0e\u5b9e\u9a8c\u8bc1\u636e\uff0c\u63d0\u51fa\u6700\u4f4e\u62a5\u544a\u89c4\u8303\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17886", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7edf\u4e00\u5f62\u5f0f\u5316\u7ed9\u51fa\u7535\u8def\u7ea7\u7f6e\u6362\u7b49\u53d8\u6761\u4ef6\u4e0e\u8d44\u6e90\u6a21\u578b", "\u4e94\u7c7b\u67b6\u6784\u6db5\u76d6\u5377\u79ef\u3001\u7b49\u53d8\u3001\u6d88\u606f\u4f20\u9012\u4e0e\u5faa\u73af\u3001\u54c8\u5bc6\u987f\u91cf\u53ca\u6df7\u5408", "\u8bc1\u636e\u591a\u6765\u81ea\u5c0f\u56fe\u6a21\u62df\uff0c\u5c1a\u672a\u786e\u7acb\u7ecf\u5178\u56fe\u4efb\u52a1\u4e0a\u7684\u91cf\u5b50\u4f18\u52bf"], "keywords": ["\u91cf\u5b50\u8ba1\u7b97", "\u56fe\u795e\u7ecf\u7f51\u7edc", "\u7b49\u53d8\u6027", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17886v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Quantum Graph Neural Networks: Architectures, Trainability, and Applications", "tldr": "\u7cfb\u7edf\u68b3\u7406\u91cf\u5b50\u56fe\u7f51\u7edc\u67b6\u6784\u4e0e\u8bc4\u6d4b\u8bc1\u636e\uff0c\u6307\u51fa\u7ecf\u5178\u56fe\u4efb\u52a1\u4e0a\u7684\u91cf\u5b50\u4f18\u52bf\u5c1a\u672a\u786e\u7acb\u3002", "upvotes": 0, "what_it_is": "\u8fd9\u7bc7\u7efc\u8ff0\u7528\u7f16\u7801\u5668\u3001\u56fe\u6761\u4ef6\u91cf\u5b50\u7535\u8def\u3001\u89c2\u6d4b\u91cf\u53ca\u53ef\u9009\u7ecf\u5178\u9884\u6d4b\u5934\u7edf\u4e00\u63cf\u8ff0\u91cf\u5b50\u56fe\u7f51\u7edc\uff0c\u5e76\u6309\u4e94\u7c7b\u67b6\u6784\u6bd4\u8f83\u8d44\u6e90\u6210\u672c\u3001\u5bf9\u79f0\u6027\u4e0e\u5b9e\u9a8c\u8bc1\u636e\uff0c\u63d0\u51fa\u6700\u4f4e\u62a5\u544a\u89c4\u8303\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u5c06\u67b6\u6784\u521b\u65b0\u4e0e\u4f18\u52bf\u8bc1\u636e\u5206\u5f00\u5ba1\u89c6\uff1a\u5bf9\u79f0\u6027\u662f\u652f\u6491\u6700\u5145\u5206\u7684\u5f52\u7eb3\u504f\u7f6e\uff0c\u7edf\u4e00\u6210\u672c\u6bd4\u8f83\u4e0e\u62a5\u544a\u89c4\u8303\u6709\u52a9\u4e8e\u540e\u7eed\u516c\u5e73\u8bc4\u6d4b\u3002"}, {"abstract": "Mixture-of-experts (MoE) models can share experts across layers or computational steps, pooling training information from different contexts. This can reduce local prediction error, but multi-step systems are ultimately evaluated by their final outputs. We study when these local gains survive composition. In specified linear regression models, we derive exact sharing and merging criteria by balancing variance savings against bias from sharing across roles with different target behavior. Under a common fixed linear propagation map, we characterize expected squared final-output risk, retaining error directions and correlations. We construct cases where sharing lowers average local error yet increases final-output error. Within this setting, we also identify when orthogonal full pooling with isotropic noise preserves every local improvement at the final output. For general routed computations, we derive conditional end-to-end error bounds that account for distribution shifts, errors in surrounding components, and changes in expert selection. Separately, we show that correct predictions and route labels alone do not establish that individual experts implement the attributed operations. Controlled experiments realize a strict local-to-final risk reversal. In low-data symbolic settings, trained Transformers exhibit statistically supported teacher-forced one-step gains without statistically resolved free-running final-output gains. Separate intervention tests distinguish successful multi-layer actions from single-expert attribution and generalization to unseen transitions. Together, these results distinguish when sharing improves local estimation, when those gains survive to the final output, and what evidence is needed to attribute reusable operations to individual experts.", "arxiv_id": "2611.17879", "arxiv_url": "https://arxiv.org/abs/2611.17879", "authors": ["Tiantong Wang", "Zhiren Gong", "Yixin Wang", "Tiantong Wu", "Wei Yang Bryan Lim"], "brief": "\u7814\u7a76\u8de8\u5c42\u6216\u8de8\u6b65\u9aa4\u5171\u4eab\u4e13\u5bb6\u7684\u6536\u76ca\u4f55\u65f6\u80fd\u4f20\u9012\u5230\u6700\u7ec8\u8f93\u51fa\u3002\u901a\u8fc7\u7ebf\u6027\u56de\u5f52\u63a8\u5bfc\u5171\u4eab\u51c6\u5219\uff0c\u5e76\u7ed3\u5408\u8bef\u5dee\u4f20\u64ad\u5206\u6790\u3001\u7aef\u5230\u7aef\u754c\u4e0e\u53d7\u63a7\u5b9e\u9a8c\u68c0\u9a8c\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17879", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7ebf\u6027\u56de\u5f52\u4e2d\u7cbe\u786e\u6743\u8861\u5171\u4eab\u7684\u65b9\u5dee\u6536\u76ca\u4e0e\u89d2\u8272\u504f\u5dee", "\u56fa\u5b9a\u7ebf\u6027\u4f20\u64ad\u4e0b\u4fdd\u7559\u8bef\u5dee\u65b9\u5411\u4e0e\u76f8\u5173\u6027\uff0c\u6784\u9020\u98ce\u9669\u53cd\u8f6c", "\u4f4e\u6570\u636eTransformer\u5355\u6b65\u6536\u76ca\u663e\u8457\uff0c\u6700\u7ec8\u6536\u76ca\u672a\u663e\u8457"], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u591a\u6b65\u63a8\u7406", "\u8bef\u5dee\u4f20\u64ad", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17879v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "From Local Prediction Error to Final Outputs: A Theory of Expert Sharing in Multi-Step Reasoning", "tldr": "\u4e13\u5bb6\u5171\u4eab\u867d\u80fd\u964d\u4f4e\u5c40\u90e8\u8bef\u5dee\uff0c\u5374\u53ef\u80fd\u653e\u5927\u591a\u6b65\u63a8\u7406\u7684\u6700\u7ec8\u8f93\u51fa\u98ce\u9669\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u8de8\u5c42\u6216\u8de8\u6b65\u9aa4\u5171\u4eab\u4e13\u5bb6\u7684\u6536\u76ca\u4f55\u65f6\u80fd\u4f20\u9012\u5230\u6700\u7ec8\u8f93\u51fa\u3002\u901a\u8fc7\u7ebf\u6027\u56de\u5f52\u63a8\u5bfc\u5171\u4eab\u51c6\u5219\uff0c\u5e76\u7ed3\u5408\u8bef\u5dee\u4f20\u64ad\u5206\u6790\u3001\u7aef\u5230\u7aef\u754c\u4e0e\u53d7\u63a7\u5b9e\u9a8c\u68c0\u9a8c\u3002", "why_notable": "\u4e3a\u4e13\u5bb6\u5171\u4eab\u63d0\u4f9b\u8d85\u8d8a\u5c40\u90e8\u7cbe\u5ea6\u7684\u8bc4\u4f30\u6846\u67b6\uff0c\u63ed\u793a\u591a\u6b65\u7ec4\u5408\u4e2d\u7684\u98ce\u9669\u53cd\u8f6c\uff0c\u4e5f\u660e\u786e\u5c06\u53ef\u590d\u7528\u64cd\u4f5c\u5f52\u56e0\u4e8e\u5355\u4e2a\u4e13\u5bb6\u6240\u9700\u7684\u8bc1\u636e\u3002"}, {"abstract": "Machine learning (ML)-based fault detectors are increasingly proposed for power system protection, yet aggregate metrics can obscure the consequences of false and missed trips. We present a protection-oriented assessment of three ML detectors and a sequence-current reference on PROTECT-90, comprising 9,022 simulated fault episodes on a 90 kV double-circuit line. The assessment combines five window conditions, causal window-end labelling, episode-grouped cross-validation, and operating-point selection under a fixed security budget. It reports security, dependability, detection timing, decision margins, and episode-level nuisance assertions. Gradient-boosted trees, a convolutional neural network, and logistic regression achieve AUC-ROC values above 0.999, yet at a security budget of $10^{-3}$ their developed-fault missed-trip rates range from 0.007% to 1.99%. Post-clearing false-trip rates of approximately 0.12-0.16% per window coexist with nuisance assertions in 11.3-19.1% of episodes. Among the analysed physical descriptors, missed trips are most consistently associated with higher fault resistance within the sampled range. An analytical current proxy suggests a fault-current gradient only partly reproduced by waveform-derived current (rank correlation 0.62). No single topology state or faulted phase consistently dominates within the sampled domain. Because PROTECT-90 contains fault episodes only, security is assessed on pre-fault and post-clearing windows rather than independent non-fault disturbances.", "arxiv_id": "2611.17872", "arxiv_url": "https://arxiv.org/abs/2611.17872", "authors": ["Julian Oelhaf", "Georg Kordowich", "Changhun Kim", "Christian Bergler", "Andreas Maier", "Johann J\u00e4ger", "Siming Bayer"], "brief": "\u7814\u7a76\u5bf9\u4e09\u7c7b\u673a\u5668\u5b66\u4e60\u68c0\u6d4b\u5668\u4e0e\u5e8f\u7535\u6d41\u57fa\u51c6\u8fdb\u884c\u4fdd\u62a4\u5bfc\u5411\u8bc4\u4f30\u3002\u901a\u8fc7\u56e0\u679c\u7a97\u53e3\u6807\u6ce8\u3001\u4e8b\u4ef6\u5206\u7ec4\u4ea4\u53c9\u9a8c\u8bc1\u548c\u56fa\u5b9a\u5b89\u5168\u9884\u7b97\u9009\u9608\u503c\uff0c\u6bd4\u8f83\u6f0f\u8df3\u3001\u8bef\u8df3\u53ca\u68c0\u6d4b\u65f6\u5ef6\u3002", "categories": ["cs.LG", "eess.SP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17872", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["PROTECT-90\u542b9022\u4e2a90\u5343\u4f0f\u7ebf\u8def\u4eff\u771f\u6545\u969c\u4e8b\u4ef6", "AUC\u5747\u8d850.999\uff0c\u5b89\u5168\u9884\u7b970.001\u4e0b\u6f0f\u8df3\u73870.007%\u20141.99%", "\u6e05\u9664\u540e\u6bcf\u7a97\u53e3\u8bef\u8df3\u7ea60.12%\u20140.16%\uff0c\u4e8b\u4ef6\u8bef\u62a5\u8fbe11.3%\u201419.1%"], "keywords": ["\u7535\u529b\u7cfb\u7edf\u4fdd\u62a4", "\u6545\u969c\u68c0\u6d4b", "\u673a\u5668\u5b66\u4e60", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17872v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Protection-Oriented Assessment of Machine Learning-Based Fault Detection in Power Systems", "tldr": "\u4ee5\u4fdd\u62a4\u7ea6\u675f\u8bc4\u4f30\u7535\u7f51\u6545\u969c\u68c0\u6d4b\uff0c\u63ed\u793a\u6781\u9ad8\u5206\u7c7b\u5206\u6570\u4ecd\u53ef\u80fd\u63a9\u76d6\u6f0f\u8df3\u4e0e\u8bef\u8df3\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5bf9\u4e09\u7c7b\u673a\u5668\u5b66\u4e60\u68c0\u6d4b\u5668\u4e0e\u5e8f\u7535\u6d41\u57fa\u51c6\u8fdb\u884c\u4fdd\u62a4\u5bfc\u5411\u8bc4\u4f30\u3002\u901a\u8fc7\u56e0\u679c\u7a97\u53e3\u6807\u6ce8\u3001\u4e8b\u4ef6\u5206\u7ec4\u4ea4\u53c9\u9a8c\u8bc1\u548c\u56fa\u5b9a\u5b89\u5168\u9884\u7b97\u9009\u9608\u503c\uff0c\u6bd4\u8f83\u6f0f\u8df3\u3001\u8bef\u8df3\u53ca\u68c0\u6d4b\u65f6\u5ef6\u3002", "why_notable": "\u5c06\u8bc4\u4ef7\u91cd\u70b9\u4ece\u5206\u7c7b\u5206\u6570\u8f6c\u5411\u7ee7\u7535\u4fdd\u62a4\u540e\u679c\uff0c\u63ed\u793a\u7a97\u53e3\u7ea7\u4f4e\u8bef\u62a5\u4e0d\u7b49\u4e8e\u4e8b\u4ef6\u7ea7\u53ef\u9760\uff0c\u4e3a\u68c0\u6d4b\u5668\u9608\u503c\u9009\u62e9\u548c\u5de5\u7a0b\u9a8c\u8bc1\u63d0\u4f9b\u66f4\u8d34\u8fd1\u5b9e\u9645\u7684\u4f9d\u636e\u3002"}, {"abstract": "While federated anomaly detection enables the integration of local data insights across diverse nodes to reduce false positives, it inherently struggles with non-IID data. In practice, industrial IoT plants often operate under varying conditions and experience diverse environmental phenomena, resulting in significant heterogeneity in the monitored time series. In such settings, standard federated learning approaches fail to perform nuanced aggregation that accounts for these cross-node differences, ultimately leading to increased false positive rates. In this paper, we propose a process mining approach to evaluate the similarity of local node data against a reference provided by a global node. The global node utilizes these similarity metrics to dynamically weight local models during aggregation, producing personalized updates distributed across the network. We evaluate our approach using industrial IoT time-series data collected from manufacturing plants operating under distinct conditions. Experimental results demonstrate that our process mining-enabled federated anomaly detection pipeline achieves superior performance, yielding a 46.52% and 11.99% relative improvement in F1-score compared to isolated local training baselines and standard FedAvg, respectively, alongside a 51.24% relative reduction in false positives over standard federated aggregation.", "arxiv_id": "2611.17869", "arxiv_url": "https://arxiv.org/abs/2611.17869", "authors": ["Francesco Vitale", "Salvatore Bramante", "Francesco Flammini", "Hangli Ge"], "brief": "\u63d0\u51fa\u9762\u5411\u5f02\u8d28\u5de5\u4e1a\u65f6\u5e8f\u7684\u8054\u90a6\u5f02\u5e38\u68c0\u6d4b\u6d41\u7a0b\uff1a\u901a\u8fc7\u8fc7\u7a0b\u6316\u6398\u6bd4\u8f83\u672c\u5730\u6570\u636e\u4e0e\u5168\u5c40\u53c2\u8003\u7684\u76f8\u4f3c\u6027\uff0c\u636e\u6b64\u52a8\u6001\u52a0\u6743\u672c\u5730\u6a21\u578b\u5e76\u4e0b\u53d1\u4e2a\u6027\u5316\u66f4\u65b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17869", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8fc7\u7a0b\u6316\u6398\u63d0\u4f9b\u8282\u70b9\u76f8\u4f3c\u6027\uff0c\u9a71\u52a8\u52a8\u6001\u52a0\u6743\u805a\u5408", "F1\u8f83\u672c\u5730\u8bad\u7ec3\u548cFedAvg\u5206\u522b\u63d0\u534746.52%\u300111.99%", "\u8bef\u62a5\u8f83\u6807\u51c6\u8054\u90a6\u805a\u5408\u76f8\u5bf9\u51cf\u5c1151.24%"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u5f02\u5e38\u68c0\u6d4b", "\u8fc7\u7a0b\u6316\u6398", "\u5de5\u4e1a\u7269\u8054\u7f51"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17869v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Process Mining-Enabled Federated Anomaly Detection for the Industrial IoT", "tldr": "\u7528\u8fc7\u7a0b\u6316\u6398\u8861\u91cf\u8282\u70b9\u5dee\u5f02\u5e76\u52a0\u6743\u805a\u5408\uff0c\u6539\u5584\u5de5\u4e1a\u7269\u8054\u7f51\u8054\u90a6\u5f02\u5e38\u68c0\u6d4b\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9762\u5411\u5f02\u8d28\u5de5\u4e1a\u65f6\u5e8f\u7684\u8054\u90a6\u5f02\u5e38\u68c0\u6d4b\u6d41\u7a0b\uff1a\u901a\u8fc7\u8fc7\u7a0b\u6316\u6398\u6bd4\u8f83\u672c\u5730\u6570\u636e\u4e0e\u5168\u5c40\u53c2\u8003\u7684\u76f8\u4f3c\u6027\uff0c\u636e\u6b64\u52a8\u6001\u52a0\u6743\u672c\u5730\u6a21\u578b\u5e76\u4e0b\u53d1\u4e2a\u6027\u5316\u66f4\u65b0\u3002", "why_notable": "\u5c06\u8fc7\u7a0b\u5c42\u9762\u7684\u76f8\u4f3c\u6027\u7528\u4e8e\u8054\u90a6\u805a\u5408\uff0c\u9488\u5bf9\u4e0d\u540c\u5de5\u51b5\u4e0b\u7684\u975e\u72ec\u7acb\u540c\u5206\u5e03\u6570\u636e\u964d\u4f4e\u8bef\u62a5\uff0c\u4e3a\u5de5\u4e1a\u76d1\u6d4b\u7684\u4e2a\u6027\u5316\u5efa\u6a21\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u8def\u5f84\u3002"}, {"abstract": "Electrocardiographic imaging (ECGI) reconstructs heart-surface potentials from body-surface potentials, an ill-posed inverse problem. Diffusion posterior samplers combine a learned prior with an explicit forward operator that they assume to be accurate. In ECGI this operator is only an estimate, because the body changes with respiration and posture, and body composition such as subcutaneous fat is rarely known for an individual patient. The resulting operator discrepancy is structured and depends on the heart signal. We introduce OpDis-PS, a diffusion posterior sampler that models this discrepancy instead of treating it as signal-independent noise. OpDis-PS learns how the discrepancy depends on the signal, folds this into a corrected forward operator, and reconstructs with a fixed prior across all operator conditions. We study two realistic sources of discrepancy, changing lung conductivity and an added subcutaneous-fat layer. Across both, OpDis-PS reconstructs more accurately than classical regularization and learned predictors, with its largest gains on held-out cardiac pathologies.", "arxiv_id": "2611.17851", "arxiv_url": "https://arxiv.org/abs/2611.17851", "authors": ["Ricarda Buttmann", "Andreas M. Lehrmann"], "brief": "\u63d0\u51fa\u6269\u6563\u540e\u9a8c\u91c7\u6837\u65b9\u6cd5 OpDis-PS\uff0c\u5b66\u4e60\u524d\u5411\u7b97\u5b50\u504f\u5dee\u4e0e\u5fc3\u810f\u4fe1\u53f7\u7684\u5173\u7cfb\u5e76\u4fee\u6b63\u7b97\u5b50\uff0c\u5728\u4e0d\u540c\u7b97\u5b50\u6761\u4ef6\u4e0b\u4f7f\u7528\u56fa\u5b9a\u5148\u9a8c\u91cd\u5efa\u5fc3\u810f\u8868\u9762\u753
