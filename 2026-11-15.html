 Within the OmniASR wav2vec family, scaling from 300M--7B disproportionately benefits high-resource languages, and ASR tuning sharply improves semantic decodability while making representations more language-specific. However, semantic content is entangled with acoustics, inflating apparent performance on single-speaker corpora.", "arxiv_id": "2611.17686", "arxiv_url": "https://arxiv.org/abs/2611.17686", "authors": ["Kevin Krahn", "Eric Fosler-Lussier"], "brief": "\u901a\u8fc7\u8de8\u6a21\u6001\u68c0\u7d22\u63a2\u6d4b76\u79cd\u8bed\u8a00\u7684\u8bed\u97f3\u7f16\u7801\u5668\uff0c\u53d1\u73b0\u53e5\u4e49\u53ef\u88ab\u7ebf\u6027\u89e3\u7801\u4f46\u8bed\u8a00\u95f4\u5dee\u5f02\u663e\u8457\uff1b\u6269\u6a21\u504f\u76ca\u9ad8\u8d44\u6e90\u8bed\u8a00\uff0c\u8bed\u97f3\u8bc6\u522b\u5fae\u8c03\u589e\u5f3a\u8bed\u4e49\u5374\u524a\u5f31\u8de8\u8bed\u8a00\u901a\u7528\u6027\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17686", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u76d1\u7763\u5b66\u4e60", "\u591a\u8bed\u8a00\u8bed\u97f3", "\u8bed\u4e49\u8868\u793a", "\u8de8\u8bed\u8a00\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17686v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "What Do Multilingual Self-Supervised Speech Encoders Know About Sentence Meaning?", "tldr": "\u901a\u8fc7\u8de8\u6a21\u6001\u68c0\u7d22\u63a2\u6d4b76\u79cd\u8bed\u8a00\u7684\u8bed\u97f3\u7f16\u7801\u5668\uff0c\u53d1\u73b0\u53e5\u4e49\u53ef\u88ab\u7ebf\u6027\u89e3\u7801\u4f46\u8bed\u8a00\u95f4\u5dee\u5f02\u663e\u8457\uff1b\u6269\u6a21\u504f\u76ca\u9ad8\u8d44\u6e90\u8bed\u8a00\uff0c\u8bed\u97f3\u8bc6\u522b\u5fae\u8c03\u589e\u5f3a\u8bed\u4e49\u5374\u524a\u5f31\u8de8\u8bed\u8a00\u901a\u7528\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-supervised Joint Embedding Predictive Architecture (JEPA) models are increasingly used for medical imaging, however there is a limited understanding about robustness of these models toward real-world image changes. We test four JEPA-based chest X-ray encoders, trained on 78,468 NIH ChestX-ray14 images, under six tests: two black-box adversarial attacks (SPSA, Boundary Attack), three image corruptions (Gaussian noise, brightness shift, contrast shift), and a label-scarcity test, measuring embedding change and classification AUROC. These perturbations cause severe, model-dependent damage: encoder-level Cosine Similarity drops as low as 0.33, and AUROC falls by as much as 0.12 in the worst case (I-JEPA under the Boundary Test). We test two ways of training the small predictor on top of each frozen encoder to address this. Adversarial fine-tuning, trained on clean and perturbed images together, raises embedding consistency above 0.97 in nearly every case and improves AUROC, relative to the same perturbed baseline, for most models, with the largest gain of $+0.10$ on I-JEPA. A Vector-Quantized codebook method, trained only on clean images and evaluated on perturbed test images for the first time, instead degrades under distortion for all four models, most noticeably for I-JEPA ($-0.15$ AUROC on average), showing that its discrete bottleneck alone does not provide the robustness that comes from training on perturbed data directly.", "arxiv_id": "2611.17905", "arxiv_url": "https://arxiv.org/abs/2611.17905", "authors": ["Zahid Mansur", "Kalpana Yadav", "Deepak Mishra"], "brief": "\u8bc4\u6d4b\u56db\u79cdJEPA\u80f8\u7247\u7f16\u7801\u5668\uff0c\u53d1\u73b0\u653b\u51fb\u4e0e\u56fe\u50cf\u6270\u52a8\u53ef\u663e\u8457\u635f\u5bb3\u8868\u5f81\u53ca\u5206\u7c7b\u6027\u80fd\uff1b\u5bf9\u6297\u5fae\u8c03\u6709\u6548\u6539\u5584\u9c81\u68d2\u6027\uff0c\u800c\u4ec5\u7528\u5e72\u51c0\u6570\u636e\u8bad\u7ec3\u7684\u5411\u91cf\u91cf\u5316\u65b9\u6cd5\u53cd\u800c\u9000\u5316\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17905", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u5bf9\u6297\u9c81\u68d2\u6027", "\u5411\u91cf\u91cf\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17905v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Cracks in Embeddings: Robustness and Stability of JEPA-Based Chest X-Ray Representations", "tldr": "\u8bc4\u6d4b\u56db\u79cdJEPA\u80f8\u7247\u7f16\u7801\u5668\uff0c\u53d1\u73b0\u653b\u51fb\u4e0e\u56fe\u50cf\u6270\u52a8\u53ef\u663e\u8457\u635f\u5bb3\u8868\u5f81\u53ca\u5206\u7c7b\u6027\u80fd\uff1b\u5bf9\u6297\u5fae\u8c03\u6709\u6548\u6539\u5584\u9c81\u68d2\u6027\uff0c\u800c\u4ec5\u7528\u5e72\u51c0\u6570\u636e\u8bad\u7ec3\u7684\u5411\u91cf\u91cf\u5316\u65b9\u6cd5\u53cd\u800c\u9000\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Many new AI models estimate how far away things are, in metres, from a single photo. To do this they must also work out what camera took the photo. We check whether they really do with a simple test: digital zoom, that is, cropping a photo and enlarging the crop back to full size. Zooming moves nothing in the scene, so a correct model should give the same distance for every point still in the picture. The test is free, exact and needs no labels. Two numbers describe a model\u0027s reaction: its depth changes like $s^{-\u03b1}$ (ideal $\u03b1=0$) and its focal-length estimate like $s^\u03b2$ (ideal $\u03b2=1$), for zoom factor $s$. On 800 images from KITTI, NYUv2 and DIODE, the widely used Depth Anything V2 has $\u03b1=0.95$: it treats a zoomed photo almost as if the camera had moved closer, because it judges distance mainly from how large things look. Models that also predict the camera remove only part of this error ($\u03b1\\approx0.31$-$0.36$), because their focal estimate grows too little. Given the true camera, Depth Pro and DA3-Nested keep their depth ($\u03b1\\approx0$), so the error lies in their camera estimate. The reason: a zoomed photo is, pixel for pixel, a normal photo of a scene squashed in depth, so size alone cannot tell the two apart, and a focal estimator trained by regression stays close to the cameras it saw in training. Undoing this needs no labels or training and makes Depth Pro pass the test ($\u03b1=0.04$) at almost no cost on normal photos. Controls, including a real optical zoom lens, rule out blur and resizing artefacts. Finally, label-free fine-tuning for self-consistency lowers $\u03b1$ to 0.05 on KITTI and 0.07 on NYUv2 once a \"blurry means zoomed\" shortcut is removed; we report what this costs on normal and unseen photos.", "arxiv_id": "2611.17903", "arxiv_url": "https://arxiv.org/abs/2611.17903", "authors": ["Rabeya Noor", "Khandoker Nosiba Arifin"], "brief": "\u63d0\u51fa\u65e0\u6807\u7b7e\u6570\u5b57\u53d8\u7126\u6d4b\u8bd5\uff0c\u63ed\u793a\u5355\u76ee\u6df1\u5ea6\u6a21\u578b\u5e38\u5c06\u653e\u5927\u8bef\u5224\u4e3a\u9760\u8fd1\uff0c\u6839\u6e90\u5728\u76f8\u673a\u53c2\u6570\u4f30\u8ba1\uff1b\u65e0\u9700\u8bad\u7ec3\u7684\u6821\u6b63\u53ca\u81ea\u4e00\u81f4\u6027\u5fae\u8c03\u53ef\u663e\u8457\u7f13\u89e3\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17903", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1", "\u76f8\u673a\u6807\u5b9a", "\u6570\u5b57\u53d8\u7126", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17903v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Zoom In, Scale Out: Metric Depth Models Mistake Digital Zoom for Moving Closer", "tldr": "\u63d0\u51fa\u65e0\u6807\u7b7e\u6570\u5b57\u53d8\u7126\u6d4b\u8bd5\uff0c\u63ed\u793a\u5355\u76ee\u6df1\u5ea6\u6a21\u578b\u5e38\u5c06\u653e\u5927\u8bef\u5224\u4e3a\u9760\u8fd1\uff0c\u6839\u6e90\u5728\u76f8\u673a\u53c2\u6570\u4f30\u8ba1\uff1b\u65e0\u9700\u8bad\u7ec3\u7684\u6821\u6b63\u53ca\u81ea\u4e00\u81f4\u6027\u5fae\u8c03\u53ef\u663e\u8457\u7f13\u89e3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Spatial transcriptomics (ST) prediction from histology aims to infer spatially resolved gene expression profiles directly from tissue images. This is a challenging problem that is currently often addressed with complicated model architectures, additional inputs, and complicated training procedures, while remaining limited to fixed, small gene panels. This raises a natural question: Is there an efficient method for large-panel ST prediction? Here, we present GeneFlow, a simpler yet effective framework for large-scale spatial gene expression prediction that unifies flow-matching generative modeling with structured multimodal fusion. Specifically, GeneFlow first encodes both histological morphology and cross-gene interactions in spatial spots through histology and gene tokenizers. The model directly predicts spatial gene expression, rather than an intermediate velocity field, while being trained with a velocity-based flow-matching objective. We show that, even without relying on heavy generative pipelines, GeneFlow achieves state-of-the-art performance across multiple ST benchmarks, with up to 56.8% gains in 1,000-gene prediction. Extensive experiments further show that GeneFlow produces biologically meaningful spot profiles while reducing computational cost by orders of magnitude, thereby improving efficiency and scalability, particularly in clinical settings. We believe GeneFlow provides an opportunity for leveraging widely available histology images for downstream biological discovery. Code is available at: https://github.com/ZZhangsm/GeneFlow", "arxiv_id": "2611.17899", "arxiv_url": "https://arxiv.org/abs/2611.17899", "authors": ["Songming Zhang", "Yuxiao Luo", "Shifu Luo", "Siran Chen", "Shuquan Su", "Jinyan Li"], "brief": "GeneFlow\u7ed3\u5408\u6d41\u5339\u914d\u4e0e\u591a\u6a21\u6001\u878d\u5408\uff0c\u4ece\u7ec4\u7ec7\u56fe\u50cf\u9884\u6d4b\u5927\u89c4\u6a21\u7a7a\u95f4\u57fa\u56e0\u8868\u8fbe\uff1b\u5343\u57fa\u56e0\u9884\u6d4b\u6027\u80fd\u6700\u9ad8\u63d0\u534756.8%\uff0c\u8ba1\u7b97\u6210\u672c\u964d\u4f4e\u6570\u4e2a\u6570\u91cf\u7ea7\u3002", "categories": ["cs.CV", "cs.AI", "q-bio.QM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17899", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a7a\u95f4\u8f6c\u5f55\u7ec4", "\u57fa\u56e0\u8868\u8fbe\u9884\u6d4b", "\u6d41\u5339\u914d", "\u591a\u6a21\u6001\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17899v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "More Genes, Faster Inference: Efficient Large-Panel Spatial Transcriptomics Prediction from Histology", "tldr": "GeneFlow\u7ed3\u5408\u6d41\u5339\u914d\u4e0e\u591a\u6a21\u6001\u878d\u5408\uff0c\u4ece\u7ec4\u7ec7\u56fe\u50cf\u9884\u6d4b\u5927\u89c4\u6a21\u7a7a\u95f4\u57fa\u56e0\u8868\u8fbe\uff1b\u5343\u57fa\u56e0\u9884\u6d4b\u6027\u80fd\u6700\u9ad8\u63d0\u534756.8%\uff0c\u8ba1\u7b97\u6210\u672c\u964d\u4f4e\u6570\u4e2a\u6570\u91cf\u7ea7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent open-vocabulary multi-view indoor 3D detection methods typically follow a point-cloud-driven pipeline, where pseudo 3D boxes are generated from reconstructed or estimated geometry and semantic labels are inferred from projected regions. However, such a design makes box generation dependent on the completeness of point clouds and restricts semantic learning to local appearance, causing inferior 3D object localization and open-vocabulary classification. In this paper, we present See and Detect, an image-driven framework that uses multi-view images as the primary evidence for 3D box and semantic label generation. For box generation, we first discover object candidates from individual images, enabling objects missing in point clouds to be recovered from visual evidence. However, single-view predictions are often noisy and redundant. To address this, we propose multi-view consensus box consolidation to fuse spatially consistent predictions across views, and box quality assessment to reduce the impact of boxes with partial object coverage. For semantic label generation, we introduce context-aware semantic learning, where semantic labels are queried from full image context, enabling more accurate semantic prediction. Extensive experiments on ScanNet and ARKitScenes demonstrate that our method achieves state-of-the-art open-vocabulary multi-view 3D detection performance while running over 500$\\times$ faster than the previous state-of-the-art method.", "arxiv_id": "2611.17897", "arxiv_url": "https://arxiv.org/abs/2611.17897", "authors": ["Yating Xu", "Na Zhao", "Chenhan Jiang", "Qingwen Zhang", "Jiankang Deng", "Jifei Song"], "brief": "\u63d0\u51fa\u56fe\u50cf\u9a71\u52a8\u7684\u5f00\u653e\u8bcd\u6c47\u591a\u89c6\u89d2\u4e09\u7ef4\u68c0\u6d4b\u6846\u67b6\uff0c\u901a\u8fc7\u8de8\u89c6\u89d2\u6846\u878d\u5408\u4e0e\u5168\u56fe\u4e0a\u4e0b\u6587\u8bed\u4e49\u5b66\u4e60\u6539\u5584\u5b9a\u4f4d\u548c\u5206\u7c7b\uff0c\u5728\u4e24\u9879\u5ba4\u5185\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\uff0c\u901f\u5ea6\u63d0\u5347\u8d85500\u500d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17897", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u76ee\u6807\u68c0\u6d4b", "\u5f00\u653e\u8bcd\u6c47", "\u591a\u89c6\u89d2\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17897v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "See and Detect: Image-Driven Open-Vocabulary Multi-View 3D Object Detection", "tldr": "\u63d0\u51fa\u56fe\u50cf\u9a71\u52a8\u7684\u5f00\u653e\u8bcd\u6c47\u591a\u89c6\u89d2\u4e09\u7ef4\u68c0\u6d4b\u6846\u67b6\uff0c\u901a\u8fc7\u8de8\u89c6\u89d2\u6846\u878d\u5408\u4e0e\u5168\u56fe\u4e0a\u4e0b\u6587\u8bed\u4e49\u5b66\u4e60\u6539\u5584\u5b9a\u4f4d\u548c\u5206\u7c7b\uff0c\u5728\u4e24\u9879\u5ba4\u5185\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\uff0c\u901f\u5ea6\u63d0\u5347\u8d85500\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video-based behavior estimation is often implemented end-to-end from image sequences. We advocate a two-stage alternative: reconstruct 3D body and object geometry before classifying behavior. This makes ambiguities of the ill-posed 2D-to-3D inverse problem explicit and potentially correctable. We demonstrate the strategy with simulated interacting mice and extend it to real video.", "arxiv_id": "2611.17881", "arxiv_url": "https://arxiv.org/abs/2611.17881", "authors": ["Olaf Hellwich", "Moritz Heine", "Patrik Reiske", "Sole Traverso", "Katharina Hohlbaum", "Henning Sprekeler", "Christa Th\u00f6ne-Reineke", "Lars Lewejohann", "Roman Bhuiyan"], "brief": "\u63d0\u51fa\u5148\u91cd\u5efa\u52a8\u7269\u8eab\u4f53\u4e0e\u7269\u4f53\u7684\u4e09\u7ef4\u51e0\u4f55\u3001\u518d\u5206\u7c7b\u884c\u4e3a\u7684\u4e24\u9636\u6bb5\u65b9\u6cd5\uff0c\u4f7f\u4e8c\u7ef4\u5230\u4e09\u7ef4\u7684\u6b67\u4e49\u663e\u5f0f\u5316\u5e76\u53ef\u80fd\u88ab\u7ea0\u6b63\uff1b\u5728\u6a21\u62df\u5c0f\u9f20\u4ea4\u4e92\u4e2d\u6f14\u793a\uff0c\u5e76\u6269\u5c55\u81f3\u771f\u5b9e\u89c6\u9891\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17881", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u52a8\u7269\u884c\u4e3a\u8bc6\u522b", "\u4e09\u7ef4\u91cd\u5efa", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17881v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Photogrammetric 3D Model-Based Animal Behavior Classification", "tldr": "\u63d0\u51fa\u5148\u91cd\u5efa\u52a8\u7269\u8eab\u4f53\u4e0e\u7269\u4f53\u7684\u4e09\u7ef4\u51e0\u4f55\u3001\u518d\u5206\u7c7b\u884c\u4e3a\u7684\u4e24\u9636\u6bb5\u65b9\u6cd5\uff0c\u4f7f\u4e8c\u7ef4\u5230\u4e09\u7ef4\u7684\u6b67\u4e49\u663e\u5f0f\u5316\u5e76\u53ef\u80fd\u88ab\u7ea0\u6b63\uff1b\u5728\u6a21\u62df\u5c0f\u9f20\u4ea4\u4e92\u4e2d\u6f14\u793a\uff0c\u5e76\u6269\u5c55\u81f3\u771f\u5b9e\u89c6\u9891\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cities account for over two-thirds of the world\u0027s energy and more than 70% of global carbon dioxide emissions. City energy is essential for achieving the 2050 net-zero target and the UN\u0027s Sustainable Development Goals 7 and 11. Although existing studies have made progress, they are limited by data and methodological gaps. Existing studies are largely predictive for existing cities rather than generative for future cities; fine-grained, aligned monthly dynamic energy data are scarce; and existing GenAI models struggle to generate dynamic urban functional monthly energy. We present DySENSE, a joint multimodal GenAI framework that synthesizes static urban satellite imagery together with spatially aligned, dynamic monthly building energy consumption maps. We decouple long-term static urban morphology from short-term dynamic energy consumption. By conditioning on static urban land use, DySENSE can generate realistic, diverse and new static urban imagery with aligned energy maps. By conditioning on dynamic monthly and climate prompts, DySENSE can jointly generate dynamic, monthly energy consumption maps while keeping the urban morphology static. Experiments across four cities (New York, Washington, Norfolk, Busan) demonstrated that DySENSE can generate annotated high-fidelity synthetic energy data using less than 25% labelled data, boosting downstream prediction performance by 8% mIoU, and achieving strong energy dynamic consistency. Compared to existing methods, DySENSE significantly improved prediction performance (8.7% accuracy) and reduced prediction error (9%-18% CVRMSE, ASHRAE). DySENSE offers an effective foundation for energy-efficient cities, peak-load analysis, building performance simulation and dynamic demand response for city, energy, and building science. The data and code: https://huggingface.co/datasets/skl24/MUSE2 and https://github.com/kailaisun/DySENSE", "arxiv_id": "2611.17878", "arxiv_url": "https://arxiv.org/abs/2611.17878", "authors": ["Kailai Sun", "Zijie Gao", "Mingyi He", "Can Rong", "Alok Prakash", "Baoshen Guo", "Shenhao Wang", "Jinhua Zhao"], "brief": "DySENSE\u8054\u5408\u751f\u6210\u536b\u661f\u5f71\u50cf\u4e0e\u9010\u6708\u5efa\u7b51\u80fd\u8017\u56fe\uff0c\u89e3\u8026\u9759\u6001\u57ce\u5e02\u5f62\u6001\u548c\u52a8\u6001\u80fd\u8017\uff1b\u56db\u57ce\u5b9e\u9a8c\u4ec5\u7528\u4e0d\u8db325%\u6807\u6ce8\u6570\u636e\uff0c\u4f7f\u4e0b\u6e38\u9884\u6d4bmIoU\u63d0\u53478%\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17878", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u751f\u6210", "\u536b\u661f\u5f71\u50cf", "\u57ce\u5e02\u80fd\u8017", "\u6570\u636e\u5408\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17878v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DySENSE: Dynamic Spatiotemporal ENergy Synthesis and Emulation with Satellite Imagery", "tldr": "DySENSE\u8054\u5408\u751f\u6210\u536b\u661f\u5f71\u50cf\u4e0e\u9010\u6708\u5efa\u7b51\u80fd\u8017\u56fe\uff0c\u89e3\u8026\u9759\u6001\u57ce\u5e02\u5f62\u6001\u548c\u52a8\u6001\u80fd\u8017\uff1b\u56db\u57ce\u5b9e\u9a8c\u4ec5\u7528\u4e0d\u8db325%\u6807\u6ce8\u6570\u636e\uff0c\u4f7f\u4e0b\u6e38\u9884\u6d4bmIoU\u63d0\u53478%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While diffusion models excel at image generation, their denoising trajectories pass through corrupted intermediate states far from the image manifold. We ask whether generation can instead proceed through recognizable images throughout the entire trajectory. We introduce a generative framework built around a variation-reducing degradation process that contracts diverse images toward a shared prototype while preserving recognizable intermediate states. Because such manifold traversal lacks a simple analytical form, we construct the trajectories using generative-prior-based image morphing. We then distill the reverse process into a diversification operator that transforms the prototype into increasingly varied samples. To resolve the one-to-many ambiguity of the reverse process, we associate each trajectory with its initial noise latent and apply perturbations to improve robustness against accumulated errors. At inference, every step yields a recognizable image, allowing early termination and enabling a controllable speed--variation trade-off.", "arxiv_id": "2611.17868", "arxiv_url": "https://arxiv.org/abs/2611.17868", "authors": ["Sukit Seripanitkarn", "Phonphrm Thawatdamrongkit", "Supasorn Suwajanakorn"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u56fe\u50cf\u6e10\u53d8\u7684\u751f\u6210\u6846\u67b6\uff0c\u5c06\u56fe\u50cf\u5411\u5171\u4eab\u539f\u578b\u6536\u7f29\u7684\u8fc7\u7a0b\u53cd\u5411\u84b8\u998f\uff0c\u4f7f\u751f\u6210\u5168\u7a0b\u4fdd\u6301\u53ef\u8fa8\u8bc6\u56fe\u50cf\uff0c\u5e76\u652f\u6301\u63d0\u524d\u7ec8\u6b62\u4ee5\u6743\u8861\u901f\u5ea6\u4e0e\u6837\u672c\u591a\u6837\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17868", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u77e5\u8bc6\u84b8\u998f", "\u751f\u6210\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17868v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Speed-Variation Distillation for Generative Modeling", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u56fe\u50cf\u6e10\u53d8\u7684\u751f\u6210\u6846\u67b6\uff0c\u5c06\u56fe\u50cf\u5411\u5171\u4eab\u539f\u578b\u6536\u7f29\u7684\u8fc7\u7a0b\u53cd\u5411\u84b8\u998f\uff0c\u4f7f\u751f\u6210\u5168\u7a0b\u4fdd\u6301\u53ef\u8fa8\u8bc6\u56fe\u50cf\uff0c\u5e76\u652f\u6301\u63d0\u524d\u7ec8\u6b62\u4ee5\u6743\u8861\u901f\u5ea6\u4e0e\u6837\u672c\u591a\u6837\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In long-document question answering, a vision-language model can answer incorrectly even when the retrieved pages contain sufficient evidence. Rereading those pages with the original question gives the model little guidance about which fact to check. We introduce DoubleTake, a training-free framework for focused verification of visual evidence. An initial reading produces a candidate answer and a separate evidence record that guides retrieval for a second reading. A planner compares the two candidates and their supporting evidence to formulate a factual question. A verifier answers it from the source images without seeing either candidate or evidence record, and a reasoner uses this observation to resolve the original question. With a frozen Qwen3-VL-8B-Instruct backbone, DoubleTake achieves the highest overall accuracy among the evaluated methods on each of four benchmarks. With the same pages and number of model calls, asking a focused factual question yields higher accuracy on all four benchmarks than asking the original question again. Our code is available at https://github.com/small-code-cat/double_take.", "arxiv_id": "2611.17853", "arxiv_url": "https://arxiv.org/abs/2611.17853", "authors": ["Kejun Xue", "Ang Li", "Jinghua Tang", "Xincheng Wang", "Yongbin Gao", "Yanghua Xiao", "Zhijun Fang"], "brief": "DoubleTake\u901a\u8fc7\u4e24\u6b21\u9605\u8bfb\u4e0e\u805a\u7126\u4e8b\u5b9e\u6838\u9a8c\u63d0\u5347\u957f\u6587\u6863\u89c6\u89c9\u95ee\u7b54\uff0c\u65e0\u9700\u8bad\u7ec3\uff1b\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u51c6\u786e\u7387\u5747\u9886\u5148\uff0c\u540c\u7b49\u9875\u9762\u548c\u8c03\u7528\u6b21\u6570\u4e0b\u4f18\u4e8e\u91cd\u590d\u8be2\u95ee\u539f\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17853", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u95ee\u7b54", "\u957f\u6587\u6863\u7406\u89e3", "\u8bc1\u636e\u6838\u9a8c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17853v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DoubleTake: Focused Verification of Visual Evidence for Long-Document Understanding", "tldr": "DoubleTake\u901a\u8fc7\u4e24\u6b21\u9605\u8bfb\u4e0e\u805a\u7126\u4e8b\u5b9e\u6838\u9a8c\u63d0\u5347\u957f\u6587\u6863\u89c6\u89c9\u95ee\u7b54\uff0c\u65e0\u9700\u8bad\u7ec3\uff1b\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u51c6\u786e\u7387\u5747\u9886\u5148\uff0c\u540c\u7b49\u9875\u9762\u548c\u8c03\u7528\u6b21\u6570\u4e0b\u4f18\u4e8e\u91cd\u590d\u8be2\u95ee\u539f\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Precise classification of laryngeal lesions is clinically crucial yet highly challenging, as inter-class visual differences are often subtle. While abnormalities in vocal fold vibratory dynamics provide complementary discriminative information, existing deep learning models predominantly rely on visual appearance and lack explicit mechanisms for modeling clinically meaningful vibratory dynamics. To address this, we propose PADSNet, a Physics-Aware Dual-Stream Network for laryngeal lesion classification that integrates visual representations with explicit biomechanical reasoning. Specifically, a Wavelet-Attention Enhancement Module (WAEM) is designed to bridge the spectral-semantic gap, enabling complementary learning of spatial texture and dynamic frequency representations. Meanwhile, a Knowledge Computing Module (KCM) extracts interpretable biomechanical indices from temporal glottal distance waveforms, including indicators of mobility, symmetry, glottal closure, and vibration stability. These descriptors are subsequently incorporated into a Physics-Aware Gating Module (PAGM) as biomechanical priors to adaptively recalibrate visual feature toward pathology-relevant vibratory patterns. Extensive experiments on a clinical dataset demonstrate that PADSNet achieves an accuracy of 0.8452, an F1-score of 0.8090, a sensitivity of 0.7953, and a specificity of 0.8866. These results indicate that explicitly integrating biomechanical priors with deep visual representations provides a more accurate, robust, and clinically interpretable framework for automated laryngeal lesion classification.", "arxiv_id": "2611.17852", "arxiv_url": "https://arxiv.org/abs/2611.17852", "authors": ["Zhenzhen You", "Weifeng Yu", "Zhenghao Shi", "Shuangli Du", "Minghua Zhao", "Yingcheng Zhao", "Xinhong Hei", "Demin Kong", "Xiaoyong Ren", "Jin Hou"], "brief": "PADSNet\u878d\u5408\u89c6\u89c9\u7279\u5f81\u4e0e\u58f0\u5e26\u632f\u52a8\u7684\u751f\u7269\u529b\u5b66\u5148\u9a8c\uff0c\u7528\u4e8e\u5589\u90e8\u75c5\u53d8\u5206\u7c7b\u3002\u4e34\u5e8a\u6570\u636e\u96c6\u51c6\u786e\u7387\u8fbe84.52%\uff0c\u5e76\u63d0\u4f9b\u53ef\u89e3\u91ca\u7684\u632f\u52a8\u6307\u6807\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17852", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u75c5\u53d8\u5206\u7c7b", "\u751f\u7269\u529b\u5b66", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17852v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PADSNet: Physics-Aware Dual-Stream Network with Biomechanical Priors for Laryngeal Lesion Classification", "tldr": "PADSNet\u878d\u5408\u89c6\u89c9\u7279\u5f81\u4e0e\u58f0\u5e26\u632f\u52a8\u7684\u751f\u7269\u529b\u5b66\u5148\u9a8c\uff0c\u7528\u4e8e\u5589\u90e8\u75c5\u53d8\u5206\u7c7b\u3002\u4e34\u5e8a\u6570\u636e\u96c6\u51c6\u786e\u7387\u8fbe84.52%\uff0c\u5e76\u63d0\u4f9b\u53ef\u89e3\u91ca\u7684\u632f\u52a8\u6307\u6807\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "With the rising demand for edge devices, lightweight self-supervised monocular depth estimation methods have continued to evolve; however, existing methods generally suffer from poor accuracy. We find that the root cause may lies in the failure of conventional training regimes to fully exploit the inherent potential of lightweight models. To address this, we propose a novel three-phase training strategy for lightweight self-supervised monocular depth estimation, termed Signal Scaffolding (SS). Without introducing any additional dataset or parameters, we apply SS to ReForgeDepth, a lightweight network of our own design. Experiments on the KITTI and Cityscapes datasets demonstrate that our method achieves state-of-the-art performance in the accuracy-efficiency trade-off and running in real time on edge devices. These results suggest that lightweight models can be improved further within their existing capacity, and that the central question may be less about how parameters are allocated than about how to unlock this latent potential through training.", "arxiv_id": "2611.17828", "arxiv_url": "https://arxiv.org/abs/2611.17828", "authors": ["Zhijie Wang", "Li Zhang", "Yujie Chen", "Shibiao Deng", "Xin Gao", "Houzhi Zhou", "Jiangshuo Zhang"], "brief": "\u63d0\u51fa\u4e09\u9636\u6bb5\u8bad\u7ec3\u7b56\u7565\uff0c\u5728\u4e0d\u589e\u52a0\u6570\u636e\u6216\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u8f7b\u91cf\u81ea\u76d1\u7763\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u7cbe\u5ea6\uff0c\u5728\u4e24\u9879\u6570\u636e\u96c6\u4e0a\u5b9e\u73b0\u9886\u5148\u7684\u7cbe\u5ea6\u6548\u7387\u6743\u8861\uff0c\u5e76\u652f\u6301\u8fb9\u7f18\u8bbe\u5907\u5b9e\u65f6\u8fd0\u884c\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17828", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1", "\u81ea\u76d1\u7763\u5b66\u4e60", "\u8f7b\u91cf\u6a21\u578b", "\u8fb9\u7f18\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17828v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Signal Scaffolding: Unlocking the Potential of Lightweight Models for Self-Supervised Monocular Depth Estimation", "tldr": "\u63d0\u51fa\u4e09\u9636\u6bb5\u8bad\u7ec3\u7b56\u7565\uff0c\u5728\u4e0d\u589e\u52a0\u6570\u636e\u6216\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u8f7b\u91cf\u81ea\u76d1\u7763\u5355\u76ee\u6df1\u5ea6\u4f30\u8ba1\u7cbe\u5ea6\uff0c\u5728\u4e24\u9879\u6570\u636e\u96c6\u4e0a\u5b9e\u73b0\u9886\u5148\u7684\u7cbe\u5ea6\u6548\u7387\u6743\u8861\uff0c\u5e76\u652f\u6301\u8fb9\u7f18\u8bbe\u5907\u5b9e\u65f6\u8fd0\u884c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frozen vision foundation models can be adapted by learning a few prompt tokens shared across all images. When prompts are updated as data shift or tasks change, the distribution of image features moves from one endpoint to another. Prior theory asks which endpoints prompts can reach; we ask whether they can travel between them along the shortest path. Because shared prompts compete with each image\u0027s own content for attention, they often cannot. We quantify this restriction as the extra transport cost that shared attention imposes over the shortest path. In an exactly solvable attention model, the reachable features form a cone; unrolling it into a plane gives the exact minimum action for every pair of endpoints and explicit optimal prompts on short arcs. The analysis reveals a sharp threshold in content normalization, which measures how much attention each image\u0027s own tokens absorb: for same-sign endpoints, at most two distinct levels allow prompts to follow the shortest path, whereas three or more force a strictly positive extra cost unless the endpoints differ only by rescaling. This gap persists with more prompts, small content perturbations, and aligned multihead outputs. On ViT-B/16 with VTAB-1k, a quadratic B\u00e9zier prompt path that minimizes feature action reduces held-out transport action relative to linear and cross-entropy-trained paths between the same endpoints and improves intermediate and online accuracy under unlabeled distribution shift, while cross-entropy-trained paths retain higher minimum accuracy when labeled calibration data are available. Reachable endpoints do not guarantee a reachable shortest path: how prompts move matters, not only where they end. Project page: https://xixiaouab.github.io/Beyond-Endpoints/.", "arxiv_id": "2611.17825", "arxiv_url": "https://arxiv.org/abs/2611.17825", "authors": ["Chenzhi Zheng", "Xi Xiao", "Chih-Ting Liao", "Qizhen Lan", "Jingwen Lin", "Tianyang Wang", "Hao Xu", "Xin Cao"], "brief": "\u7814\u7a76\u5171\u4eab\u63d0\u793a\u9002\u914d\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u65f6\u7684\u8def\u5f84\u9650\u5236\uff0c\u8bc1\u660e\u53ef\u8fbe\u7aef\u70b9\u672a\u5fc5\u80fd\u6cbf\u6700\u77ed\u8def\u5f84\u8fde\u63a5\uff1b\u7528\u4e8c\u6b21B\u00e9zier\u63d0\u793a\u8def\u5f84\u964d\u4f4e\u7279\u5f81\u8fc1\u79fb\u4ee3\u4ef7\uff0c\u63d0\u5347\u65e0\u6807\u7b7e\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u51c6\u786e\u7387\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17825", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u57fa\u7840\u6a21\u578b", "\u63d0\u793a\u5b66\u4e60", "\u5206\u5e03\u504f\u79fb", "\u6700\u4f18\u4f20\u8f93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17825v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Endpoints: B\u00e9zier Paths for Vision Foundation Model Adaptation", "tldr": "\u7814\u7a76\u5171\u4eab\u63d0\u793a\u9002\u914d\u89c6\u89c9\u57fa\u7840\u6a21\u578b\u65f6\u7684\u8def\u5f84\u9650\u5236\uff0c\u8bc1\u660e\u53ef\u8fbe\u7aef\u70b9\u672a\u5fc5\u80fd\u6cbf\u6700\u77ed\u8def\u5f84\u8fde\u63a5\uff1b\u7528\u4e8c\u6b21B\u00e9zier\u63d0\u793a\u8def\u5f84\u964d\u4f4e\u7279\u5f81\u8fc1\u79fb\u4ee3\u4ef7\uff0c\u63d0\u5347\u65e0\u6807\u7b7e\u5206\u5e03\u504f\u79fb\u4e0b\u7684\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Moving a scene generator to a new game engine requires more than exporting its final output: planning, construction tools, and stored experience may also depend on the original backend. We present SceneAgent, a multi-agent framework for reusing the construction process and its experience across backends. A canonical SceneContext maintains the evolving world, while backend adapters isolate coordinate conventions, asset bindings, and export. Structured handoffs let fresh Builder sessions query this persistent state without inheriting the full construction transcript. Across generations, human-approved traces are distilled into asset-ID-free Layout skills and semantic Content skills that can be retrieved and recombined. We introduce GameSceneBench, comprising 69 indoor and outdoor prompts. Under a common asset and evaluation protocol, SceneAgent obtains human tie-adjusted preference scores of 78.2-89.4% against five baselines. Ablations show that reusable skills and the multi-agent protocol primarily improve prompt alignment and scene completeness, with additional runtime. Deployment in a second engine preserves the shared construction protocol and skill library while replacing backend integration components. Together, these results support separating persistent scene state, task-local reasoning, and reusable experience for portable scene construction.", "arxiv_id": "2611.17821", "arxiv_url": "https://arxiv.org/abs/2611.17821", "authors": ["Xingyi Li", "Jiahao Yang", "Yiqin Zhu", "Jingwen Ye", "Yang Sun", "Weidong Zhang"], "brief": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u573a\u666f\u751f\u6210\u6846\u67b6\uff0c\u4ee5\u6301\u4e45\u72b6\u6001\u548c\u53ef\u590d\u7528\u6280\u80fd\u652f\u6301\u8de8\u6e38\u620f\u5f15\u64ce\u8fc1\u79fb\uff1b\u4eba\u5de5\u504f\u597d\u5f97\u5206\u8fbe78.2\u201389.4%\uff0c\u4f46\u8fd0\u884c\u5f00\u9500\u589e\u52a0\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17821", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u573a\u666f\u751f\u6210", "\u77e5\u8bc6\u590d\u7528", "\u6e38\u620f\u5f15\u64ce"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17821v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SceneAgent: A Multi-Agent Framework for Portable Game Scene Generation", "tldr": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u573a\u666f\u751f\u6210\u6846\u67b6\uff0c\u4ee5\u6301\u4e45\u72b6\u6001\u548c\u53ef\u590d\u7528\u6280\u80fd\u652f\u6301\u8de8\u6e38\u620f\u5f15\u64ce\u8fc1\u79fb\uff1b\u4eba\u5de5\u504f\u597d\u5f97\u5206\u8fbe78.2\u201389.4%\uff0c\u4f46\u8fd0\u884c\u5f00\u9500\u589e\u52a0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Direct weight editing offers a gradient-free alternative to fine-tuning pretrained detectors, but its generalization and the value of large language model (LLM) guidance remain uncertain. We evaluate five experimental phases using YOLO26 models and MS COCO, comparing deterministic scaling, random perturbations, differential evolution, CMA-ES, structured interventions, real local-LLM proposals, failure-aware guidance, and hybrid LLM-CMA-ES against a matched random-policy control. Optimization uses native Ultralytics mAP50-95 on 1,000 COCO Val2017 images; selected candidates are assessed on a disjoint, previously examined 1,500-image subset, with COCO API AP50-95 reported separately where available. Increasing the CMA-ES budget from 8 to 250 evaluations raised development gains from +0.11 to +0.28 percentage points, while selection changes remained negative (-0.03 to -0.12 points); the 250-evaluation result uses one seed. The hybrid LLM approach showed no statistically established advantage over random-policy guidance (p = 0.612, 0.369, and 0.694 at budgets 8, 25, and 50). Five-seed YOLO26m replication yielded a COCO API AP difference of +0.004 points (95% CI: -0.026 to +0.034). Of 225 archived LLM proposals, 53 satisfy the final strict schema; early tensor-level execution cannot be fully verified. Genuine LLM-mediated weight editing is feasible, but the tested approaches did not demonstrate consistent transfer beyond the development subset or a measurable LLM advantage.", "arxiv_id": "2611.17789", "arxiv_url": "https://arxiv.org/abs/2611.17789", "authors": ["Mohamed Abdallah Salem"], "brief": "\u5728YOLO26\u4e0a\u6bd4\u8f83\u591a\u79cd\u65e0\u68af\u5ea6\u6743\u91cd\u7f16\u8f91\u65b9\u6cd5\u4e0e\u5927\u6a21\u578b\u5f15\u5bfc\uff1b\u5f00\u53d1\u96c6\u6536\u76ca\u672a\u7a33\u5b9a\u8fc1\u79fb\uff0c\u5927\u6a21\u578b\u5f15\u5bfc\u4e5f\u672a\u663e\u8457\u4f18\u4e8e\u968f\u673a\u7b56\u7565\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17789", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u5927\u8bed\u8a00\u6a21\u578b", "\u65e0\u68af\u5ea6\u4f18\u5316", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17789v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Can Large Language Models Optimize Pretrained Neural Network Weights? A Multi-Phase Empirical Evaluation of Gradient-Free Editing in YOLO26 Object Detection", "tldr": "\u5728YOLO26\u4e0a\u6bd4\u8f83\u591a\u79cd\u65e0\u68af\u5ea6\u6743\u91cd\u7f16\u8f91\u65b9\u6cd5\u4e0e\u5927\u6a21\u578b\u5f15\u5bfc\uff1b\u5f00\u53d1\u96c6\u6536\u76ca\u672a\u7a33\u5b9a\u8fc1\u79fb\uff0c\u5927\u6a21\u578b\u5f15\u5bfc\u4e5f\u672a\u663e\u8457\u4f18\u4e8e\u968f\u673a\u7b56\u7565\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Implicit neural video representations are notoriously slow to build, which does not cross the basic practical threshold for most industrial applications. Here, we present Q-GAS, a coordinate-queryable video representation that couples multi-resolution explicit 3D feature grids with a compact SwiGLU-style quadratic-gating (QG) decoder and an error-aware, prediction-free sampler. The explicit grids avoid hash-collision coefficient sharing at the cost of modestly higher storage yet greatly boost the expressive capacity; the QG decoder introduces low-rank local second-order interactions to improve the nonlinear feature response. During fitting, a global error map periodically refreshes a high-error pool, and each batch mixes pool samples with uniform samples, which is free from the auxiliary model to predict difficult samples, thereby further escalating the efficiency. On UVG Beauty/Bosphorus/Jockey, Q-GAS fits and quantizes under 50 s on one RTX PRO 6000, decodes at over 370 FPS with mixed precision and about 146 FPS in FP32. In our PyTorch implementation, Q-GAS trains and quantizes 5.5-7.2 times faster than the evaluated Instant-NGP baseline and 19-28 times faster than RNeRV. Under a 90 s budget, it improves PSNR/MS-SSIM/LPIPS over the evaluated NeRV-family pipelines at comparable BPP over the measured overlap. We have shared our code at https://github.com/MillenRosen/Q-GAS for readers\u0027 free use.", "arxiv_id": "2611.17786", "arxiv_url": "https://arxiv.org/abs/2611.17786", "authors": ["Tie-Yun Li", "Hao-Ran Wang", "Chao Wang", "Zhiyong Yin", "Yiming Xu", "Zhenwei Cai", "Li Li", "Rongzhi Lin", "Feng-Lei Fan"], "brief": "Q-GAS\u7ed3\u5408\u663e\u5f0f\u7279\u5f81\u7f51\u683c\u3001\u4e8c\u6b21\u95e8\u63a7\u89e3\u7801\u4e0e\u8bef\u5dee\u81ea\u9002\u5e94\u91c7\u6837\uff0c\u5b9e\u73b050\u79d2\u5185\u89c6\u9891\u62df\u5408\u548c\u91cf\u5316\uff0c\u6bd4\u57fa\u7ebf\u5feb\u6570\u500d\uff0c\u5e76\u5728\u540c\u7801\u7387\u3001\u9650\u65f6\u8bad\u7ec3\u4e0b\u63d0\u5347\u753b\u8d28\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17786", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u8868\u793a", "\u795e\u7ecf\u538b\u7f29", "\u81ea\u9002\u5e94\u91c7\u6837"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17786v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Towards Seconds-level Video Representation: Quadratically Gated Feature Grid with Adaptive, Prediction-free Sampling", "tldr": "Q-GAS\u7ed3\u5408\u663e\u5f0f\u7279\u5f81\u7f51\u683c\u3001\u4e8c\u6b21\u95e8\u63a7\u89e3\u7801\u4e0e\u8bef\u5dee\u81ea\u9002\u5e94\u91c7\u6837\uff0c\u5b9e\u73b050\u79d2\u5185\u89c6\u9891\u62df\u5408\u548c\u91cf\u5316\uff0c\u6bd4\u57fa\u7ebf\u5feb\u6570\u500d\uff0c\u5e76\u5728\u540c\u7801\u7387\u3001\u9650\u65f6\u8bad\u7ec3\u4e0b\u63d0\u5347\u753b\u8d28\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Industrial design requires creative visual exploration while satisfying constraints that are often product-specific and implicit. Existing text-to-image (T2I) approaches can generate creative designs through concept blending or multi-agent self-enhancement, but they provide limited mechanisms for ensuring that generated designs remain consistent with such constraints. We focus on brand image as a representative design constraint and propose a framework for brand-aware redesign generation. Given a product name, the framework constructs a brand image survey report that summarizes product and market information, derives a creative direction from the report, and integrates this direction into a self-enhancement loop in which generated images are critiqued and prompts are revised. We evaluate the framework on 50 redesign tasks across five product categories, comparing it with Naive T2I, IP-Adapter/IT-Blender, and unconstrained self-enhancement under the same T2I backbone. By a VLM-as-Judge protocol to measure creativity and brand identifiability, the proposed framework achieves a more favorable trade-off between the two objectives, with particularly clear gains in highly constrained categories such as automotive and motorcycle, where the plausible design space is relatively limited compared with that of other product categories. These results suggest that dynamically eliciting and textualizing brand image can guide creative product design generation under brand image constraints.", "arxiv_id": "2611.17762", "arxiv_url": "https://arxiv.org/abs/2611.17762", "authors": ["Takeshi Onishi", "Hiroya Makino", "Takahiro Yamaguchi", "Hiroyuki Sakai"], "brief": "\u63d0\u51fa\u54c1\u724c\u611f\u77e5\u7684\u4ea7\u54c1\u518d\u8bbe\u8ba1\u6846\u67b6\uff0c\u4ee5\u54c1\u724c\u8c03\u7814\u5f15\u5bfc\u521b\u610f\u65b9\u5411\uff0c\u5e76\u901a\u8fc7\u56fe\u50cf\u8bc4\u5ba1\u8fed\u4ee3\u63d0\u793a\u8bcd\u3002\u572850\u9879\u4efb\u52a1\u4e2d\u66f4\u597d\u517c\u987e\u521b\u610f\u4e0e\u54c1\u724c\u8fa8\u8bc6\u5ea6\uff0c\u6c7d\u8f66\u548c\u6469\u6258\u8f66\u7c7b\u522b\u63d0\u5347\u5c24\u5176\u660e\u663e\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17762", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4ea7\u54c1\u8bbe\u8ba1", "\u56fe\u50cf\u751f\u6210", "\u54c1\u724c\u7ea6\u675f", "\u8fed\u4ee3\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17762v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Creative Product Design under Brand Image Constraints", "tldr": "\u63d0\u51fa\u54c1\u724c\u611f\u77e5\u7684\u4ea7\u54c1\u518d\u8bbe\u8ba1\u6846\u67b6\uff0c\u4ee5\u54c1\u724c\u8c03\u7814\u5f15\u5bfc\u521b\u610f\u65b9\u5411\uff0c\u5e76\u901a\u8fc7\u56fe\u50cf\u8bc4\u5ba1\u8fed\u4ee3\u63d0\u793a\u8bcd\u3002\u572850\u9879\u4efb\u52a1\u4e2d\u66f4\u597d\u517c\u987e\u521b\u610f\u4e0e\u54c1\u724c\u8fa8\u8bc6\u5ea6\uff0c\u6c7d\u8f66\u548c\u6469\u6258\u8f66\u7c7b\u522b\u63d0\u5347\u5c24\u5176\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Dense hand contact estimation from a single RGB image is a foundational primitive for dexterous manipulation and 3D interaction analysis. Direct predictors typically decode the entire per-vertex contact map from one shared query, leaving individual vertices ungrounded in the image and smearing contact across adjacent, non-touching surfaces. We present VACO, a vertex-aligned decoder in which each MANO vertex samples local image features at its projected location. A hand-reconstruction backbone, jointly trained for reconstruction and contact, predicts these locations at inference without an auxiliary reconstructor. Training uses noise-perturbed ground-truth projections and end-to-end feature adaptation to improve robustness and contact-sensitive features. A single VACO checkpoint sets a new state of the art on five benchmarks spanning hand-object, hand-human, hand-scene, and bimanual interactions. It improves F1 by +20.7 pp over the strongest prior direct predictor on Hi4D and generalizes to the held-out HOT3D and HOCap, with gains of +5.5 and +2.7 pp. The resulting contact predictions also improve downstream HOI reconstruction.", "arxiv_id": "2611.17755", "arxiv_url": "https://arxiv.org/abs/2611.17755", "authors": ["Binhong Ye", "Jin-Chuan Shi", "Tao Liu", "Xin Wang", "Hao Chen", "Chunhua Shen"], "brief": "VACO\u901a\u8fc7\u9876\u70b9\u5bf9\u9f50\u7684\u5c40\u90e8\u56fe\u50cf\u7279\u5f81\u4f30\u8ba1\u5355\u56fe\u624b\u90e8\u63a5\u89e6\uff0c\u5728\u4e94\u4e2a\u57fa\u51c6\u4e0a\u5237\u65b0\u6700\u4f73\u8868\u73b0\uff0cHi4D\u7684F1\u63d0\u534720.7\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u6539\u5584\u4e0b\u6e38\u4ea4\u4e92\u91cd\u5efa\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17755", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u63a5\u89e6\u4f30\u8ba1", "\u4e09\u7ef4\u91cd\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17755v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VACO: Vertex-Aligned Decoding for Dense Hand Contact Estimation from a Single Image", "tldr": "VACO\u901a\u8fc7\u9876\u70b9\u5bf9\u9f50\u7684\u5c40\u90e8\u56fe\u50cf\u7279\u5f81\u4f30\u8ba1\u5355\u56fe\u624b\u90e8\u63a5\u89e6\uff0c\u5728\u4e94\u4e2a\u57fa\u51c6\u4e0a\u5237\u65b0\u6700\u4f73\u8868\u73b0\uff0cHi4D\u7684F1\u63d0\u534720.7\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u6539\u5584\u4e0b\u6e38\u4ea4\u4e92\u91cd\u5efa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse-view 3D Gaussian Splatting (3DGS) is prone to overfitting because only a limited number of images are available to constrain scene geometry. Dropout is one regularization strategy for alleviating this problem. We introduce the concept of a lineage family to describe a set of Gaussian primitives derived from the same founder through cloning or splitting operations. The founder Gaussians refer to all Gaussian primitives generated during initialization. Descendants within the same family often jointly contribute to the refinement of adjacent local regions. However, dropping individual Gaussians can be less effective due to the compensation effect from neighboring Gaussians for the dropped ones. To address this issue, we propose Stage-wise Lineage-aware Dropout(SLD), which applies lineage-family dropout during the structural regularization stage and switches to individual dropout during the later refinement stage. We further propose Lineage-Balanced Densification(LBD), which operates during densification by constructing an expanded candidate pool and reallocating the densification budget according to the mean gradient scores and existing descendant sizes of different families. Experiments on the LLFF, MipNeRF360, and Blender datasets show that the proposed framework achieves competitive performance in sparse-view reconstruction", "arxiv_id": "2611.17752", "arxiv_url": "https://arxiv.org/abs/2611.17752", "authors": ["Yan Xing", "Zhi Chen", "Fanglue Zhang", "Junhong Zhao", "Bing Xue", "Mengjie Zhang"], "brief": "\u63d0\u51fa\u5206\u9636\u6bb5\u8c31\u7cfb\u611f\u77e5\u4e22\u5f03\u4e0e\u8c31\u7cfb\u5747\u8861\u589e\u5bc6\uff0c\u7f13\u89e3\u7a00\u758f\u89c6\u89d23DGS\u4e2d\u90bb\u8fd1\u9ad8\u65af\u8865\u507f\u5bfc\u81f4\u7684\u8fc7\u62df\u5408\uff0c\u5728\u4e09\u4e2a\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u91cd\u5efa\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17752", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u9ad8\u65af\u6cfc\u6e85", "\u6b63\u5219\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17752v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Stage-wise Lineage-aware Dropout for Sparse-View 3D Gaussian Splatting", "tldr": "\u63d0\u51fa\u5206\u9636\u6bb5\u8c31\u7cfb\u611f\u77e5\u4e22\u5f03\u4e0e\u8c31\u7cfb\u5747\u8861\u589e\u5bc6\uff0c\u7f13\u89e3\u7a00\u758f\u89c6\u89d23DGS\u4e2d\u90bb\u8fd1\u9ad8\u65af\u8865\u507f\u5bfc\u81f4\u7684\u8fc7\u62df\u5408\uff0c\u5728\u4e09\u4e2a\u6570\u636e\u96c6\u4e0a\u53d6\u5f97\u6709\u7ade\u4e89\u529b\u7684\u91cd\u5efa\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multi-view visual augmentation often seeks consistency across cameras, but it is unclear which forms of consistency matter for downstream control. We use simulation-state replay to manipulate cross-view coupling while preserving the per-camera perturbation distributions, physical trajectories, and action labels. Across seven LIBERO manipulation tasks, marginal-matched changes in global appearance, ghost injection, and target color have small average costs for a late-fusion Diffusion Policy: point estimates are near zero or negative, and the largest upper endpoint of the 90% posterior credible intervals is 2.55 percentage points. In contrast, geometrically anti-coupled observations reduce success by 3.30 percentage points relative to coupled observations (90% CrI [0.64, 6.28]), with displacement magnitude, direction marginals, and the number of affected views matched. Camera interventions reveal substantial dependence on wrist-view geometry, while feature analysis shows appearance sensitivity patterns associated with the factors randomized during training. ACT shows a higher target-color cost estimate than DP, with uncertainty that includes zero and sensitivity to task composition. Within the tested tasks and policy configurations, these findings motivate selective consistency constraints: appearance coupling can sometimes be relaxed, whereas task-relevant geometry and cross-view spatial correspondence warrant protection.", "arxiv_id": "2611.17751", "arxiv_url": "https://arxiv.org/abs/2611.17751", "authors": ["Zixuan Jiang"], "brief": "\u901a\u8fc7\u4eff\u771f\u56de\u653e\u63a7\u5236\u591a\u89c6\u89d2\u6270\u52a8\uff0c\u53d1\u73b0\u5916\u89c2\u4e0d\u4e00\u81f4\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u6210\u529f\u7387\u5f71\u54cd\u8f83\u5c0f\uff0c\u800c\u51e0\u4f55\u53cd\u5411\u8026\u5408\u4f7f\u6210\u529f\u7387\u4e0b\u964d3.30\u4e2a\u767e\u5206\u70b9\uff0c\u652f\u6301\u4f18\u5148\u4fdd\u62a4\u7a7a\u95f4\u5bf9\u5e94\u5173\u7cfb\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17751", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u89c6\u89c9\u589e\u5f3a", "\u591a\u89c6\u89d2\u5b66\u4e60", "\u89c6\u89c9\u8fd0\u52a8\u7b56\u7565"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17751v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Does Cross-View Consistency Matter in Multi-View Appearance Augmentation? A Controlled Study for Visuomotor Policies", "tldr": "\u901a\u8fc7\u4eff\u771f\u56de\u653e\u63a7\u5236\u591a\u89c6\u89d2\u6270\u52a8\uff0c\u53d1\u73b0\u5916\u89c2\u4e0d\u4e00\u81f4\u5bf9\u673a\u5668\u4eba\u64cd\u4f5c\u6210\u529f\u7387\u5f71\u54cd\u8f83\u5c0f\uff0c\u800c\u51e0\u4f55\u53cd\u5411\u8026\u5408\u4f7f\u6210\u529f\u7387\u4e0b\u964d3.30\u4e2a\u767e\u5206\u70b9\uff0c\u652f\u6301\u4f18\u5148\u4fdd\u62a4\u7a7a\u95f4\u5bf9\u5e94\u5173\u7cfb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An X-ray angiogram sums every structure along a ray into one pixel. When vessels cross an aneurysm, they obscure part of it and mix their contrast into its filling curve. We present X-Strata, a network that separates a cine angiogram into three layers: the complete aneurysm sac, the vessels in front of it, and the vessels behind it. Contrast timing indicates how much each layer contributes to a pixel, and parallax between two views indicates their order, which a single view cannot determine. X-Strata first estimates the layers and their contrast curves, then uses the second view to assign vessels to the front or back layer, and lifts all layers into 3D. It learns from layer labels projected from same-session 3D rotational angiography, but needs only 2D cine runs and their acquisition geometry at inference. On 220 held-out patients from three centers (122 external), two-view X-Strata ranks first among 14 baselines, including VGGT and C$^2$RV, in recovering the sac where vessels overlap it (Dice 0.693 internal, 0.641 external) and in ordering the layers (balanced accuracy 0.703, 0.659). Its order accuracy exceeds that of all 11 end-to-end baselines by at least 4.1 points internally and 3.3 externally (Holm-adjusted $p \u003c 0.001$) and grows with view separation. Recovered 3D sac surfaces have a median Chamfer distance of 0.34 mm on the internal cohort. X-Strata may therefore provide layered aneurysm and vessel information, including 3D sac shape, for patients who undergo only 2D angiography.", "arxiv_id": "2611.17743", "arxiv_url": "https://arxiv.org/abs/2611.17743", "authors": ["Zhihong Wen", "Congzhou Chen", "Hucheng Li", "Xun Han", "Jianning Zhang", "Yakun Chen", "Hao Gao", "Hao Zhao", "Yudong Ma", "Guanqiao Li", "Yongping Liang", "Shengli Guo"], "brief": "X-Strata\u5229\u7528\u53cc\u89c6\u89d2\u4e8c\u7ef4\u8840\u7ba1\u9020\u5f71\uff0c\u5c06\u52a8\u8109\u7624\u4e0e\u91cd\u53e0\u8840\u7ba1\u5206\u5c42\u5e76\u91cd\u5efa\u4e09\u7ef4\u5f62\u6001\uff1b\u5728\u591a\u4e2d\u5fc3\u6d4b\u8bd5\u4e2d\uff0c\u906e\u6321\u533a\u57df\u6062\u590d\u548c\u524d\u540e\u6392\u5e8f\u5747\u4f18\u4e8e\u57fa\u7ebf\u3002", "categories": ["eess.IV", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17743", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u8840\u7ba1\u9020\u5f71", "\u4e09\u7ef4\u91cd\u5efa", "\u56fe\u50cf\u5206\u5c42"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17743v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "X-Strata: Separating Aneurysms and Overlapping Vessels into Layers from 2D X-ray Angiography", "tldr": "X-Strata\u5229\u7528\u53cc\u89c6\u89d2\u4e8c\u7ef4\u8840\u7ba1\u9020\u5f71\uff0c\u5c06\u52a8\u8109\u7624\u4e0e\u91cd\u53e0\u8840\u7ba1\u5206\u5c42\u5e76\u91cd\u5efa\u4e09\u7ef4\u5f62\u6001\uff1b\u5728\u591a\u4e2d\u5fc3\u6d4b\u8bd5\u4e2d\uff0c\u906e\u6321\u533a\u57df\u6062\u590d\u548c\u524d\u540e\u6392\u5e8f\u5747\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Natural language-guided, mask-free scene text editing aims to modify text in real-world images using only textual instructions, yet remains challenged by unreliable pseudo-GT supervision, over-smoothed text generation, and the absence of GT-free evaluation. Existing methods often rely on imperfect pseudo-targets with background discrepancies, while standard MSE-based velocity regression tends to suppress high-frequency details, leading to blurred text boundaries and weakened local textures. To address these issues, we propose HarmonyText, a mask-free scene text editing framework with region- and frequency-aware supervision. HarmonyText introduces Region-Decoupling Optimization (RDO), which aligns edited text regions with pseudo-targets while anchoring preserved regions to the source image, and Cascaded High-Frequency Texture Guidance (CHFTG), which applies cascaded wavelet-domain constraints to preserve sharp boundaries and fine-grained textures of textual content. We further propose Reverse-to-Refined Pair Synthesis (RePair) to construct STE25K, a high-quality 25K paired dataset, and introduce a GT-free evaluation protocol with Color Distribution Divergence and a Harmony Assessment Model. Extensive experiments show that HarmonyText outperforms existing methods in text editing accuracy, background fidelity, color consistency, and perceptual harmony.", "arxiv_id": "2611.17733", "arxiv_url": "https://arxiv.org/abs/2611.17733", "authors": ["Ziqi Yi", "Huiguo He", "Guitao Xu", "Peirong Zhang", "Cheng Da", "Xinyao Yu", "Zhanpeng Wang", "Changqian Yu", "Huan Yang", "Kun Gai", "Lianwen Jin"], "brief": "\u63d0\u51fa\u65e0\u63a9\u7801\u573a\u666f\u6587\u5b57\u7f16\u8f91\u6846\u67b6\uff0c\u4ee5\u533a\u57df\u89e3\u8026\u548c\u9891\u57df\u7ea6\u675f\u4fdd\u7559\u80cc\u666f\u4e0e\u6587\u5b57\u7ec6\u8282\uff0c\u5e76\u6784\u5efa\u914d\u5bf9\u6570\u636e\u96c6\u53ca\u65e0\u771f\u503c\u8bc4\u4f30\uff0c\u5b9e\u9a8c\u5728\u7f16\u8f91\u51c6\u786e\u6027\u4e0e\u89c6\u89c9\u534f\u8c03\u6027\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17733", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u573a\u666f\u6587\u5b57\u7f16\u8f91", "\u56fe\u50cf\u751f\u6210", "\u9891\u57df\u5b66\u4e60", "\u6570\u636e\u96c6\u6784\u5efa"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17733v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HarmonyText: Harmonious Scene Text Editing via Reverse-to-Refined Pair Synthesis and Region-Decoupled Frequency Learning", "tldr": "\u63d0\u51fa\u65e0\u63a9\u7801\u573a\u666f\u6587\u5b57\u7f16\u8f91\u6846\u67b6\uff0c\u4ee5\u533a\u57df\u89e3\u8026\u548c\u9891\u57df\u7ea6\u675f\u4fdd\u7559\u80cc\u666f\u4e0e\u6587\u5b57\u7ec6\u8282\uff0c\u5e76\u6784\u5efa\u914d\u5bf9\u6570\u636e\u96c6\u53ca\u65e0\u771f\u503c\u8bc4\u4f30\uff0c\u5b9e\u9a8c\u5728\u7f16\u8f91\u51c6\u786e\u6027\u4e0e\u89c6\u89c9\u534f\u8c03\u6027\u4e0a\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "End-to-end autonomous driving is predominantly evaluated through ego-vehicle safety and task completion. Its deployment in urban traffic, however, creates sustained interactions among vehicles whose collective effects remain insufficiently evaluated. We introduce Ego2Flow, a closed-loop benchmark for assessing the traffic-system impact of autonomous driving on maps distilled from real-world cities. To construct realistic 3D urban environments for sustained closed-loop traffic simulation, we develop an agent-guided map distillation framework that integrates real-world maps and observations with complementary geographic information. Through an iterative feedback mechanism and a traffic information graph that jointly guide scene generation, the framework preserves lane topology, critical road geometry and decision-relevant visual conditions while simplifying nonessential details and completing unobserved regions. Using our proposed framework, we generate and publicly release six CARLA maps from the Argoverse 2 dataset, covering the corresponding real-world regions and enabling paired comparisons of driving behavior under real and simulated observations. On these maps, Ego2Flow evaluates how autonomous driving policies affect traffic efficiency, safety, stability and energy consumption across diverse road structures. Compared with existing construction methods, our framework achieves the lowest average displacement error between planning outputs from paired real and simulated observations. We further benchmark representative driving policies to characterize their system-level impact on urban traffic. Project Page: https://github.com/Fisher-007/Ego2Flow.", "arxiv_id": "2611.17720", "arxiv_url": "https://arxiv.org/abs/2611.17720", "authors": ["Yu Dong", "Weiying Shen", "Hangyu Li", "Shu Han", "Hong Li", "Xiangbo Gao", "Keshu Wu", "Zhengzhong Tu", "Soyoung Ahn", "Zhiyuan Liu", "Xiaopeng Li"], "brief": "\u63d0\u51faEgo2Flow\u57fa\u51c6\uff0c\u5c06\u771f\u5b9e\u9053\u8def\u84b8\u998f\u4e3a\u516d\u5f20CARLA\u5730\u56fe\uff0c\u8bc4\u4f30\u81ea\u52a8\u9a7e\u9a76\u5bf9\u4ea4\u901a\u6548\u7387\u3001\u5b89\u5168\u53ca\u80fd\u8017\u7684\u5f71\u54cd\uff1b\u771f\u5b9e\u4e0e\u4eff\u771f\u89c2\u6d4b\u4e0b\u7684\u89c4\u5212\u504f\u5dee\u6700\u4f4e\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17720", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u81ea\u52a8\u9a7e\u9a76", "\u4ea4\u901a\u4eff\u771f", "\u5730\u56fe\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17720v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Ego2Flow: Benchmarking the Traffic-System Impact of Autonomous Driving on Maps Distilled from Real-World Roads", "tldr": "\u63d0\u51faEgo2Flow\u57fa\u51c6\uff0c\u5c06\u771f\u5b9e\u9053\u8def\u84b8\u998f\u4e3a\u516d\u5f20CARLA\u5730\u56fe\uff0c\u8bc4\u4f30\u81ea\u52a8\u9a7e\u9a76\u5bf9\u4ea4\u901a\u6548\u7387\u3001\u5b89\u5168\u53ca\u80fd\u8017\u7684\u5f71\u54cd\uff1b\u771f\u5b9e\u4e0e\u4eff\u771f\u89c2\u6d4b\u4e0b\u7684\u89c4\u5212\u504f\u5dee\u6700\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate prediction of isocitrate dehydrogenase (IDH) mutation status is essential for glioma diagnosis, prognosis, and treatment planning. Although recent deep learning approaches have demonstrated promising performance, many rely on whole-brain feature extraction and provide limited interpretability. This study proposes a tumour-aware multimodal framework for explainable, non-invasive prediction of IDH mutation status from multiparametric magnetic resonance imaging (MRI). The proposed framework integrates four MRI sequences (T1, T1CE, T2, and FLAIR), tumour subregion segmentation, quantitative radiomic descriptors, and clinical information within a unified deep learning architecture. An ablation study was conducted to evaluate the contribution of tumour-aware learning, radiomic features, and clinical variables. Model performance was assessed using multiple complementary evaluation metrics, including accuracy, precision, recall, F1-score, balanced accuracy, receiver operating characteristic analysis, confusion matrix evaluation, and Grad-CAM visualisation. Experimental results demonstrated that the proposed multimodal framework consistently outperformed the baseline MRI-only model, with the Clinical Fusion model achieving the strongest overall predictive performance. The integration of tumour-aware learning, radiomic descriptors, and clinical information progressively improved classification performance, while Grad-CAM visualisations indicated that the model predominantly focused on biologically relevant tumour regions. These findings suggest that tumour-aware multimodal feature integration enables accurate, interpretable, and non-invasive molecular profiling of gliomas and provides a promising foundation for future clinical decision support in precision neuro-oncology.", "arxiv_id": "2611.17712", "arxiv_url": "https://arxiv.org/abs/2611.17712", "authors": ["Tahsien Al-Quraishi", "Waseem Alwan Zaboon", "O. S. Albahri", "Raza Nowrozy"], "brief": "\u878d\u5408\u591a\u5e8f\u5217MRI\u3001\u80bf\u7624\u5206\u533a\u3001\u5f71\u50cf\u7ec4\u5b66\u4e0e\u4e34\u5e8a\u4fe1\u606f\u9884\u6d4b\u80f6\u8d28\u7624IDH\u7a81\u53d8\uff0c\u6027\u80fd\u4f18\u4e8e\u7eafMRI\u57fa\u7ebf\uff1b\u53ef\u89c6\u5316\u663e\u793a\u6a21\u578b\u4e3b\u8981\u5173\u6ce8\u751f\u7269\u5b66\u76f8\u5173\u7684\u80bf\u7624\u533a\u57df\u3002", "categories": ["eess.IV", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17712", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u591a\u6a21\u6001\u5b66\u4e60", "\u5f71\u50cf\u7ec4\u5b66", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17712v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Tumour-Aware Multimodal Framework for Explainable Prediction of IDH Mutation in Gliomas from Multi-Sequence MRI", "tldr": "\u878d\u5408\u591a\u5e8f\u5217MRI\u3001\u80bf\u7624\u5206\u533a\u3001\u5f71\u50cf\u7ec4\u5b66\u4e0e\u4e34\u5e8a\u4fe1\u606f\u9884\u6d4b\u80f6\u8d28\u7624IDH\u7a81\u53d8\uff0c\u6027\u80fd\u4f18\u4e8e\u7eafMRI\u57fa\u7ebf\uff1b\u53ef\u89c6\u5316\u663e\u793a\u6a21\u578b\u4e3b\u8981\u5173\u6ce8\u751f\u7269\u5b66\u76f8\u5173\u7684\u80bf\u7624\u533a\u57df\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Medical visual question answering models can answer correctly without attending to the anatomy that the question names. Automatic region priors allow spatial supervision without expert masks, but they are noisy, and it is unclear how strongly they should shape attention and how their effect should be verified. We present QCAP-VQA, which supervises a subset of cross-attention heads with a question-conditioned prior built from ranked segmentation proposals. Its capped prior-mass objective penalizes insufficient attention inside the prior only below a threshold. We evaluate attention against SLAKE structure boxes that play no role in training, separating attention on the named anatomy from how attention shifts between questions about the same image. QCAP-VQA matches the accuracy of a baseline without spatial supervision (84.26% vs. 84.23%), and every evaluated prior-supervised model places more attention on the annotated structures. Over a 64-fold range of regularization strength, the capped objective keeps prior mass between 0.67 and 0.77, whereas a pooled region-mass objective drives it to 0.97 and loses accuracy. The cost lies in question conditioning: as the constraint widens or strengthens, attention shifts agree less with the expert-defined contrast. Across 13 configurations, prior-referenced and expert-referenced evaluation rank the models in largely opposite order (Spearman correlation of -0.87), and the capped models it favors track the prior\u0027s own errors. Because clinical use of medical visual question answering requires answers grounded in the queried anatomy, supervision from automatic priors should be judged against independent anatomical references.", "arxiv_id": "2611.17708", "arxiv_url": "https://arxiv.org/abs/2611.17708", "authors": ["Yining Zhao", "Catarina Moreira", "Mukesh Prasad", "Ali Braytee"], "brief": "\u63d0\u51fa\u95ee\u9898\u6761\u4ef6\u5316\u7684\u5c01\u9876\u6ce8\u610f\u529b\u76d1\u7763\uff0c\u5728\u4fdd\u6301\u533b\u5b66\u89c6\u89c9\u95ee\u7b54\u51c6\u786e\u7387\u7684\u540c\u65f6\u6539\u5584\u89e3\u5256\u533a\u57df\u5173\u6ce8\uff1b\u4f46\u5148\u9a8c\u4e0e\u4e13\u5bb6\u8bc4\u4f30\u6392\u540d\u76f8\u53cd\uff0c\u63ed\u793a\u81ea\u52a8\u5148\u9a8c\u53ef\u80fd\u8bef\u5bfc\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17708", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u89c6\u89c9\u95ee\u7b54", "\u6ce8\u610f\u529b\u76d1\u7763", "\u89e3\u5256\u5b9a\u4f4d", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17708v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QCAP-VQA: Question-Conditioned Capped Prior-Mass Supervision for Medical Visual Question Answering", "tldr": "\u63d0\u51fa\u95ee\u9898\u6761\u4ef6\u5316\u7684\u5c01\u9876\u6ce8\u610f\u529b\u76d1\u7763\uff0c\u5728\u4fdd\u6301\u533b\u5b66\u89c6\u89c9\u95ee\u7b54\u51c6\u786e\u7387\u7684\u540c\u65f6\u6539\u5584\u89e3\u5256\u533a\u57df\u5173\u6ce8\uff1b\u4f46\u5148\u9a8c\u4e0e\u4e13\u5bb6\u8bc4\u4f30\u6392\u540d\u76f8\u53cd\uff0c\u63ed\u793a\u81ea\u52a8\u5148\u9a8c\u53ef\u80fd\u8bef\u5bfc\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recovering the complete appearance of occluded objects from a single image is a fundamental problem for scene understanding and image editing. Real-world scenes are challenging due to clutter, complex spatial occlusions, and diverse object categories. Existing methods often struggle when occlusion involves background surfaces or objects that are not explicitly detected, and fail to resolve the cyclic occlusion dependencies that frequently occur in natural scenes. We introduce a training-free, open-world scene deocclusion framework that recovers the full amodal appearance of detected or user-selected objects from a single RGB image, decomposing the scene into depth-ordered RGBA layers that are geometrically plausible, semantically faithful, and visually consistent with the visible scene. Extensive experiments show that our approach improves scene-level deocclusion, producing coherent and realistic reconstructions in real-world settings. Code will be available on the project page: https://sashjk.github.io/owsd/", "arxiv_id": "2611.17695", "arxiv_url": "https://arxiv.org/abs/2611.17695", "authors": ["K. M. S. J. Kumarasinghe", "Neil A. Dodgson", "Fang-Lue Zhang"], "brief": "\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u5f00\u653e\u4e16\u754c\u573a\u666f\u53bb\u906e\u6321\u6846\u67b6\uff0c\u4ece\u5355\u5f20\u56fe\u50cf\u6062\u590d\u7269\u4f53\u5b8c\u6574\u5916\u89c2\u5e76\u751f\u6210\u6309\u6df1\u5ea6\u6392\u5e8f\u7684\u56fe\u5c42\uff1b\u5b9e\u9a8c\u663e\u793a\u91cd\u5efa\u66f4\u8fde\u8d2f\u771f\u5b9e\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17695", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u573a\u666f\u7406\u89e3", "\u906e\u6321\u6062\u590d", "\u56fe\u50cf\u5206\u5c42"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17695v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Open-World Scene Deocclusion", "tldr": "\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u5f00\u653e\u4e16\u754c\u573a\u666f\u53bb\u906e\u6321\u6846\u67b6\uff0c\u4ece\u5355\u5f20\u56fe\u50cf\u6062\u590d\u7269\u4f53\u5b8c\u6574\u5916\u89c2\u5e76\u751f\u6210\u6309\u6df1\u5ea6\u6392\u5e8f\u7684\u56fe\u5c42\uff1b\u5b9e\u9a8c\u663e\u793a\u91cd\u5efa\u66f4\u8fde\u8d2f\u771f\u5b9e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
