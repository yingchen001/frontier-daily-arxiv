5\u52bf\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17851", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["OpDis-PS \u5efa\u6a21\u4fe1\u53f7\u76f8\u5173\u504f\u5dee\uff0c\u800c\u975e\u72ec\u7acb\u566a\u58f0", "\u6d4b\u8bd5\u80ba\u7535\u5bfc\u7387\u53d8\u5316\u4e0e\u65b0\u589e\u76ae\u4e0b\u8102\u80aa\u5c42\u4e24\u7c7b\u504f\u5dee", "\u4f18\u4e8e\u7ecf\u5178\u6b63\u5219\u5316\u548c\u5b66\u4e60\u9884\u6d4b\u5668\uff0c\u672a\u89c1\u75c5\u7406\u6536\u76ca\u6700\u5927"], "keywords": ["\u5fc3\u7535\u6210\u50cf", "\u6269\u6563\u6a21\u578b", "\u9006\u95ee\u9898", "\u6a21\u578b\u504f\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17851v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Electrocardiographic Imaging via Posterior Sampling under Operator Discrepancy", "tldr": "\u901a\u8fc7\u5efa\u6a21\u4fe1\u53f7\u76f8\u5173\u7684\u524d\u5411\u7b97\u5b50\u504f\u5dee\uff0c\u63d0\u5347\u5fc3\u7535\u6210\u50cf\u5728\u8eab\u4f53\u6761\u4ef6\u53d8\u5316\u4e0b\u7684\u91cd\u5efa\u7cbe\u5ea6\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u6269\u6563\u540e\u9a8c\u91c7\u6837\u65b9\u6cd5 OpDis-PS\uff0c\u5b66\u4e60\u524d\u5411\u7b97\u5b50\u504f\u5dee\u4e0e\u5fc3\u810f\u4fe1\u53f7\u7684\u5173\u7cfb\u5e76\u4fee\u6b63\u7b97\u5b50\uff0c\u5728\u4e0d\u540c\u7b97\u5b50\u6761\u4ef6\u4e0b\u4f7f\u7528\u56fa\u5b9a\u5148\u9a8c\u91cd\u5efa\u5fc3\u810f\u8868\u9762\u7535\u52bf\u3002", "why_notable": "\u5c06\u8eab\u4f53\u6761\u4ef6\u5f15\u8d77\u7684\u7cfb\u7edf\u6027\u504f\u5dee\u7eb3\u5165\u91cd\u5efa\u8fc7\u7a0b\uff0c\u6bd4\u5047\u8bbe\u7b97\u5b50\u51c6\u786e\u66f4\u8d34\u8fd1\u5b9e\u9645\uff1b\u5728\u672a\u89c1\u5fc3\u810f\u75c5\u7406\u4e0a\u7684\u6536\u76ca\u663e\u793a\u5176\u6cdb\u5316\u6f5c\u529b\u3002"}, {"abstract": "In additive manufacturing (AM), each change in part geometry requires a new thermal simulation, which makes design evaluation over many candidates costly. Geometry-aware models reduce this cost by predicting thermal fields on unseen parts with a single learned model, but they assume that diverse geometries are available centrally. This assumption is restrictive when each manufacturing site holds only a limited set of proprietary part designs that it cannot share. We propose Fed-PIGANO, a federated framework that trains physics-informed geometry-aware neural operator (PI-GANO) models at individual sites and aggregates their geometry encoders and prediction networks without sharing part geometries. We evaluate the framework on a 2D steady-state thermal benchmark for metal AM, with geometries from five polygonal families distributed across three sites under four scenarios that range from identical to strongly different family compositions. Over seven replications, Fed-PIGANO achieves mean relative L2 errors of 1.83% to 2.04% across all 12 scenario-site cases, compared with up to 20.46% for local-only training, and consistently yields lower PDE residuals. Its prediction accuracy is comparable to that of a centralized model trained on the pooled geometries of all sites. These results demonstrate that federated learning lets manufacturing sites benefit from each other\u0027s geometries without sharing them, enabling rapid thermal prediction on new part designs for tasks such as shape optimization, inverse design, and uncertainty quantification.", "arxiv_id": "2611.17794", "arxiv_url": "https://arxiv.org/abs/2611.17794", "authors": ["Amirul Islam Saimon", "Zhenyu", "Kong"], "brief": "\u63d0\u51faFed-PIGANO\uff0c\u5404\u5236\u9020\u7ad9\u70b9\u672c\u5730\u8bad\u7ec3\u7269\u7406\u4fe1\u606f\u51e0\u4f55\u611f\u77e5\u795e\u7ecf\u7b97\u5b50\uff0c\u518d\u805a\u5408\u51e0\u4f55\u7f16\u7801\u5668\u4e0e\u9884\u6d4b\u7f51\u7edc\uff0c\u5728\u4e0d\u5171\u4eab\u96f6\u4ef6\u51e0\u4f55\u7684\u6761\u4ef6\u4e0b\u9884\u6d4b\u65b0\u8bbe\u8ba1\u70ed\u573a\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17794", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e8c\u7ef4\u7a33\u6001\u70ed\u57fa\u51c6\u542b5\u7c7b\u591a\u8fb9\u5f62\u30013\u4e2a\u7ad9\u70b9\u53ca4\u79cd\u5206\u5e03\u573a\u666f", "7\u6b21\u91cd\u590d\u5b9e\u9a8c\u4e2d\uff0c12\u7ec4\u573a\u666f\u7ad9\u70b9\u5e73\u5747\u76f8\u5bf9L2\u8bef\u5dee\u4e3a1.83%\u81f32.04%", "\u7cbe\u5ea6\u63a5\u8fd1\u96c6\u4e2d\u8bad\u7ec3\uff0cPDE\u6b8b\u5dee\u6301\u7eed\u4f4e\u4e8e\u672c\u5730\u8bad\u7ec3"], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u7269\u7406\u4fe1\u606f\u5b66\u4e60", "\u795e\u7ecf\u7b97\u5b50", "\u589e\u6750\u5236\u9020"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17794v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Federated Physics-Informed Thermal Field Prediction Across Unseen Geometries in Distributed Additive Manufacturing", "tldr": "\u8054\u90a6\u7269\u7406\u4fe1\u606f\u6a21\u578b\u65e0\u9700\u5171\u4eab\u96f6\u4ef6\u51e0\u4f55\uff0c\u5373\u53ef\u51c6\u786e\u9884\u6d4b\u672a\u89c1\u8bbe\u8ba1\u7684\u70ed\u573a\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faFed-PIGANO\uff0c\u5404\u5236\u9020\u7ad9\u70b9\u672c\u5730\u8bad\u7ec3\u7269\u7406\u4fe1\u606f\u51e0\u4f55\u611f\u77e5\u795e\u7ecf\u7b97\u5b50\uff0c\u518d\u805a\u5408\u51e0\u4f55\u7f16\u7801\u5668\u4e0e\u9884\u6d4b\u7f51\u7edc\uff0c\u5728\u4e0d\u5171\u4eab\u96f6\u4ef6\u51e0\u4f55\u7684\u6761\u4ef6\u4e0b\u9884\u6d4b\u65b0\u8bbe\u8ba1\u70ed\u573a\u3002", "why_notable": "\u5728\u51e0\u4f55\u6570\u636e\u65e0\u6cd5\u96c6\u4e2d\u5171\u4eab\u65f6\uff0c\u4ecd\u80fd\u83b7\u5f97\u63a5\u8fd1\u96c6\u4e2d\u8bad\u7ec3\u7684\u8de8\u51e0\u4f55\u9884\u6d4b\u7cbe\u5ea6\uff0c\u4e3a\u5206\u5e03\u5f0f\u5236\u9020\u4e2d\u7684\u5f62\u72b6\u4f18\u5316\u548c\u9006\u5411\u8bbe\u8ba1\u63d0\u4f9b\u652f\u6491\u3002"}, {"abstract": "Parameter-efficient fine-tuning (PEFT) aims to preserve adaptation quality while reducing training costs. We propose SCALAR, which achieves performance comparable to LoRA with substantially fewer trainable parameters, lower peak training memory, and higher throughput. SCALAR constructs a fixed input basis from task activations and assigns a random output dictionary to each input direction. Fine-tuning learns only layer-specific scalar coefficients, reducing gradient and optimizer-state storage. Grouped computation aggregates output atoms before applying the adapter to token activations, while dictionary sharing across compatible layers reduces fixed-basis storage. Experiments on commonsense reasoning, mathematical reasoning, code generation, and knowledge evaluation after instruction tuning demonstrate effective adaptation at small trainable budgets. On commonsense reasoning, SCALAR achieves accuracy comparable to LoRA with about 4% of its trainable parameters. System measurements on Qwen2.5-7B show 20% lower peak training memory and 6% higher throughput than LoRA. The combination of adaptation quality, a compact trainable state, and training efficiency makes SCALAR a promising approach to resource-constrained fine-tuning.", "arxiv_id": "2611.17784", "arxiv_url": "https://arxiv.org/abs/2611.17784", "authors": ["Ziqing Wen", "Xiaohui Song", "Jiahuan Wang", "Ping Luo", "Junlin Zeng", "Dongsheng Li", "Kele Xu", "Tao Sun"], "brief": "SCALAR\u4ece\u4efb\u52a1\u6fc0\u6d3b\u6784\u5efa\u56fa\u5b9a\u8f93\u5165\u57fa\uff0c\u4e3a\u5404\u8f93\u5165\u65b9\u5411\u914d\u7f6e\u968f\u673a\u8f93\u51fa\u5b57\u5178\uff0c\u4ec5\u8bad\u7ec3\u9010\u5c42\u6807\u91cf\u7cfb\u6570\u3002\u901a\u8fc7\u5206\u7ec4\u8ba1\u7b97\u4e0e\u8de8\u5c42\u5b57\u5178\u5171\u4eab\uff0c\u51cf\u5c11\u8bad\u7ec3\u53ca\u56fa\u5b9a\u57fa\u5b58\u50a8\u5f00\u9500\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17784", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u56fa\u5b9a\u4efb\u52a1\u6fc0\u6d3b\u8f93\u5165\u57fa\u4e0e\u968f\u673a\u8f93\u51fa\u5b57\u5178\uff0c\u4ec5\u5b66\u4e60\u9010\u5c42\u6807\u91cf", "\u5e38\u8bc6\u63a8\u7406\u6548\u679c\u63a5\u8fd1LoRA\uff0c\u53ef\u8bad\u7ec3\u53c2\u6570\u7ea6\u4e3a\u51764%", "Qwen2.5-7B\u5cf0\u503c\u8bad\u7ec3\u663e\u5b58\u964d20%\uff0c\u541e\u5410\u53476%"], "keywords": ["\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u4efb\u52a1\u9002\u914d", "\u8bad\u7ec3\u6548\u7387"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17784v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Direction or Magnitude? Learning Scalars over Task-Calibrated Directions", "tldr": "SCALAR\u4ec5\u5b66\u4e60\u4efb\u52a1\u6821\u51c6\u65b9\u5411\u4e0a\u7684\u6807\u91cf\uff0c\u4ee5\u66f4\u5c11\u53c2\u6570\u5b9e\u73b0\u63a5\u8fd1LoRA\u7684\u5fae\u8c03\u6548\u679c\u3002", "upvotes": 0, "what_it_is": "SCALAR\u4ece\u4efb\u52a1\u6fc0\u6d3b\u6784\u5efa\u56fa\u5b9a\u8f93\u5165\u57fa\uff0c\u4e3a\u5404\u8f93\u5165\u65b9\u5411\u914d\u7f6e\u968f\u673a\u8f93\u51fa\u5b57\u5178\uff0c\u4ec5\u8bad\u7ec3\u9010\u5c42\u6807\u91cf\u7cfb\u6570\u3002\u901a\u8fc7\u5206\u7ec4\u8ba1\u7b97\u4e0e\u8de8\u5c42\u5b57\u5178\u5171\u4eab\uff0c\u51cf\u5c11\u8bad\u7ec3\u53ca\u56fa\u5b9a\u57fa\u5b58\u50a8\u5f00\u9500\u3002", "why_notable": "\u5b83\u8868\u660e\u56fa\u5b9a\u4efb\u52a1\u76f8\u5173\u65b9\u5411\u3001\u4ec5\u8c03\u6574\u5e45\u5ea6\u4e5f\u80fd\u6709\u6548\u9002\u914d\u6a21\u578b\uff0c\u5e76\u540c\u65f6\u538b\u7f29\u53ef\u8bad\u7ec3\u72b6\u6001\u4e0e\u663e\u5b58\u9700\u6c42\uff0c\u4e3a\u8d44\u6e90\u53d7\u9650\u5fae\u8c03\u63d0\u4f9b\u5b9e\u7528\u9014\u5f84\u3002"}, {"abstract": "World models that support planning, control, and interpretable reasoning require latent representations that genuinely encode action. Yet the large-scale video data from which such models are learned overwhelmingly lack action annotations. Latent-action models infer action-like variables from observation sequences, enabling action-aware learning from unlabeled videos or trajectories. A fundamental concern, however, remains: a latent that improves future prediction may simply encode the current state, episode progress, task identity, or other predictive shortcuts. Existing evaluation practices---reconstruction loss, rollout fidelity, action recovery, or downstream performance---cannot isolate this distinction. We introduce the Latent Action Support Ratio (LASR), a dimensionless metric that measures, under offline evaluation on held-out data, whether a learned latent provides predictive support for action-related targets beyond the current state and non-action alternatives. LASR provides two complementary summaries: GeoLASR captures typical support, while WorstLASR identifies the weakest case. We instantiate the LASR benchmark with recorded actions and corresponding physical state changes as targets, episode-held-out splits, one predictor type for all comparisons, and positive and negative controls. Experiments on recorded robot manipulation data and a matched multi-task panel demonstrate that LASR detects known action information, rejects representative non-action shortcuts, and enables graded comparisons among imperfect latent representations. We further use LASR to train and audit a lightweight residual adapter, obtaining descriptively better point estimates whose uncertainty is assessed with paired comparisons. LASR thus provides a principled offline protocol for measuring action-related predictive support in world-model latents.", "arxiv_id": "2611.17775", "arxiv_url": "https://arxiv.org/abs/2611.17775", "authors": ["Yu Zhou", "Changsong Lei", "Yixiang Wei", "Kairui Wen", "Huankun Sheng", "Ming Li", "Yeying Fan", "Yu-Hui Wen", "Yong-Jin Liu"], "brief": "\u63d0\u51fa\u65e0\u91cf\u7eb2\u6307\u6807LASR\uff0c\u8861\u91cf\u6f5c\u53d8\u91cf\u76f8\u5bf9\u5f53\u524d\u72b6\u6001\u53ca\u975e\u52a8\u4f5c\u66ff\u4ee3\u4fe1\u606f\u7684\u989d\u5916\u52a8\u4f5c\u9884\u6d4b\u652f\u6301\u3002\u4ee5\u8bb0\u5f55\u52a8\u4f5c\u548c\u7269\u7406\u72b6\u6001\u53d8\u5316\u4e3a\u76ee\u6807\uff0c\u6784\u5efa\u7edf\u4e00\u79bb\u7ebf\u8bc4\u4f30\u534f\u8bae\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17775", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["GeoLASR\u8861\u91cf\u5178\u578b\u652f\u6301\uff0cWorstLASR\u5b9a\u4f4d\u6700\u5f31\u60c5\u5f62", "\u91c7\u7528\u56de\u5408\u9694\u79bb\u5212\u5206\u3001\u7edf\u4e00\u9884\u6d4b\u5668\u53ca\u6b63\u8d1f\u5bf9\u7167", "\u673a\u5668\u4eba\u64cd\u4f5c\u4e0e\u5339\u914d\u591a\u4efb\u52a1\u5b9e\u9a8c\u9a8c\u8bc1\uff0c\u5e76\u8bad\u7ec3\u5ba1\u8ba1\u6b8b\u5dee\u9002\u914d\u5668"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u6f5c\u53d8\u91cf", "\u673a\u5668\u4eba\u5b66\u4e60", "\u8bc4\u4f30\u6307\u6807"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17775v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Beyond Prediction Gain: LASR as a Metric for Action-Grounded Latents in World Models", "tldr": "\u63d0\u51fa\u79bb\u7ebf\u6307\u6807\uff0c\u533a\u5206\u4e16\u754c\u6a21\u578b\u6f5c\u53d8\u91cf\u4e2d\u7684\u771f\u5b9e\u52a8\u4f5c\u4fe1\u606f\u4e0e\u9884\u6d4b\u6377\u5f84\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u65e0\u91cf\u7eb2\u6307\u6807LASR\uff0c\u8861\u91cf\u6f5c\u53d8\u91cf\u76f8\u5bf9\u5f53\u524d\u72b6\u6001\u53ca\u975e\u52a8\u4f5c\u66ff\u4ee3\u4fe1\u606f\u7684\u989d\u5916\u52a8\u4f5c\u9884\u6d4b\u652f\u6301\u3002\u4ee5\u8bb0\u5f55\u52a8\u4f5c\u548c\u7269\u7406\u72b6\u6001\u53d8\u5316\u4e3a\u76ee\u6807\uff0c\u6784\u5efa\u7edf\u4e00\u79bb\u7ebf\u8bc4\u4f30\u534f\u8bae\u3002", "why_notable": "\u5c06\u9884\u6d4b\u80fd\u529b\u63d0\u5347\u4e0e\u52a8\u4f5c\u4fe1\u606f\u8d21\u732e\u533a\u5206\u5f00\uff0c\u4e3a\u65e0\u52a8\u4f5c\u6807\u6ce8\u89c6\u9891\u5b66\u4e60\u7684\u6f5c\u53d8\u91cf\u63d0\u4f9b\u66f4\u6709\u9488\u5bf9\u6027\u7684\u8bc4\u4f30\uff0c\u4e5f\u652f\u6301\u8868\u793a\u6bd4\u8f83\u4e0e\u8bad\u7ec3\u5ba1\u8ba1\u3002"}, {"abstract": "Diffusion bridges have emerged as versatile frameworks for facilitating transformations between arbitrary data distributions. However, these approaches are hindered by an immense optimization space and its underlying high-order structures. This paper explores a variant of diffusion bridges for solving real-world problems in complex vector spaces governed by scaling and rotation laws, such as Hamiltonian structures. To address this, we introduce conformal optimal transport (COT), a complex-valued transportation framework designed for physical systems with geometric and dissipative dynamics under a geometric lifting. Building on this, we propose a new class of dynamical diffusion bridges, called complex Schr\u00f6dinger bridges (CSBs), whose derived algorithms can handle diffusion-based tasks using a conformal geometric prior. For scalability, we propose image-to-image CSB (I$^2$CSB), a tractable diffusion-bridge technique with an analytic spiral posterior. Finally, we implement a physics-informed CSB algorithm within simulations of quantum electrodynamics, mimicking the logical behavior of quantum logic gates. Our extensive results validate the underlying theory while highlighting advantages of complex-valued diffusion.", "arxiv_id": "2611.17746", "arxiv_url": "https://arxiv.org/abs/2611.17746", "authors": ["Dong-Sig Han", "Tolga Birdal"], "brief": "\u63d0\u51fa\u5171\u5f62\u6700\u4f18\u4f20\u8f93\uff0c\u5728\u51e0\u4f55\u63d0\u5347\u4e0b\u523b\u753b\u590d\u7a7a\u95f4\u4e2d\u7684\u51e0\u4f55\u4e0e\u8017\u6563\u52a8\u529b\u5b66\u3002\u57fa\u4e8e\u6b64\u6784\u5efa\u590d\u859b\u5b9a\u8c14\u6865\uff0c\u5c06\u7f29\u653e\u3001\u65cb\u8f6c\u89c4\u5f8b\u4f5c\u4e3a\u6269\u6563\u4efb\u52a1\u7684\u51e0\u4f55\u5148\u9a8c\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17746", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5171\u5f62\u6700\u4f18\u4f20\u8f93\uff08COT\uff09\u5efa\u6a21\u590d\u503c\u7269\u7406\u7cfb\u7edf", "\u56fe\u50cf\u5230\u56fe\u50cf\u6865I\u00b2CSB\u91c7\u7528\u89e3\u6790\u87ba\u65cb\u540e\u9a8c", "\u7269\u7406\u7ea6\u675fCSB\u5728\u91cf\u5b50\u7535\u52a8\u529b\u5b66\u4e2d\u6a21\u62df\u903b\u8f91\u95e8"], "keywords": ["\u6269\u6563\u6a21\u578b", "\u6700\u4f18\u4f20\u8f93", "\u590d\u503c\u5b66\u4e60", "\u7269\u7406\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17746v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Complex Schr\u00f6dinger Bridges", "tldr": "\u4ee5\u5171\u5f62\u51e0\u4f55\u5148\u9a8c\u6784\u5efa\u590d\u503c\u6269\u6563\u6865\uff0c\u8fde\u63a5\u56fe\u50cf\u8f6c\u6362\u4e0e\u91cf\u5b50\u903b\u8f91\u95e8\u6a21\u62df", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u5171\u5f62\u6700\u4f18\u4f20\u8f93\uff0c\u5728\u51e0\u4f55\u63d0\u5347\u4e0b\u523b\u753b\u590d\u7a7a\u95f4\u4e2d\u7684\u51e0\u4f55\u4e0e\u8017\u6563\u52a8\u529b\u5b66\u3002\u57fa\u4e8e\u6b64\u6784\u5efa\u590d\u859b\u5b9a\u8c14\u6865\uff0c\u5c06\u7f29\u653e\u3001\u65cb\u8f6c\u89c4\u5f8b\u4f5c\u4e3a\u6269\u6563\u4efb\u52a1\u7684\u51e0\u4f55\u5148\u9a8c\u3002", "why_notable": "\u5c06\u7269\u7406\u7cfb\u7edf\u7684\u7f29\u653e\u4e0e\u65cb\u8f6c\u7ed3\u6784\u7eb3\u5165\u6269\u6563\u6865\uff0c\u4e3a\u590d\u503c\u6570\u636e\u5efa\u6a21\u63d0\u4f9b\u51e0\u4f55\u7ea6\u675f\uff1b\u89e3\u6790\u540e\u9a8c\u4e5f\u4e3a\u56fe\u50cf\u8f6c\u6362\u4e2d\u7684\u53ef\u6269\u5c55\u8ba1\u7b97\u63d0\u4f9b\u8def\u5f84\u3002"}, {"abstract": "Pixel losses train image reconstruction networks toward a point statistic of the target distribution, often averaging away fine textures under uncertainty. Perceptual losses alleviate this issue using pretrained features, but those features are inherently domain-specific. We study a random filter loss (RaFL) that compares prediction and target through filters with random weights, avoiding both pretrained features and task-specific loss engineering. RaFL combines random convolutions, random Fourier features, and random wavelet filters, automatically balancing their contributions through gradient-norm matching, eliminating manual loss-weight tuning and grid search. We systematically investigate three design choices: filter family, weight resampling schedule, and weight initialization. Based on validation PSNR and stability across random seeds, we select the configuration that uses all three filter families, redraws filters every optimization step, and employs Gaussian initialization. We evaluate RaFL on three 2D and two 3D image reconstruction tasks. RaFL outperforms a pixel loss on three tasks and matches it on two, and demonstrates stable performance across random seeds on all five tasks. RaFL adds less than 2% to the backbone\u0027s forward FLOPs and no inference cost, requiring $182\\times$ fewer loss FLOPs than a VGG19 perceptual loss. These findings suggest that RaFL is a simple, tuning-free, and domain-agnostic loss objective for 2D and 3D image reconstruction.", "arxiv_id": "2611.17707", "arxiv_url": "https://arxiv.org/abs/2611.17707", "authors": ["Ruibo Wang", "Fengbei Liu", "Aleksei Tiulpin", "Mert R. Sabuncu", "Heejong Kim"], "brief": "RaFL\u901a\u8fc7\u968f\u673a\u5377\u79ef\u3001\u5085\u91cc\u53f6\u7279\u5f81\u548c\u5c0f\u6ce2\u6ee4\u6ce2\u6bd4\u8f83\u9884\u6d4b\u4e0e\u76ee\u6807\uff0c\u5e76\u7528\u68af\u5ea6\u8303\u6570\u5339\u914d\u81ea\u52a8\u5e73\u8861\u635f\u5931\uff1b\u6bcf\u6b65\u91cd\u91c7\u6837\u6ee4\u6ce2\u6743\u91cd\uff0c\u91c7\u7528\u9ad8\u65af\u521d\u59cb\u5316\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17707", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u878d\u5408\u4e09\u7c7b\u968f\u673a\u6ee4\u6ce2\u5668\uff0c\u4ee5\u68af\u5ea6\u8303\u6570\u5339\u914d\u81ea\u52a8\u8c03\u6743", "\u8bc4\u4f303\u4e2a\u4e8c\u7ef4\u30012\u4e2a\u4e09\u7ef4\u4efb\u52a1\uff1a3\u9879\u4f18\u4e8e\u50cf\u7d20\u635f\u5931\uff0c2\u9879\u6301\u5e73", "\u524d\u5411FLOPs\u589e\u91cf\u4f4e\u4e8e2%\uff0c\u635f\u5931\u8ba1\u7b97\u91cf\u4e3aVGG19\u76841/182"], "keywords": ["\u56fe\u50cf\u91cd\u5efa", "\u635f\u5931\u51fd\u6570", "\u968f\u673a\u7279\u5f81", "\u611f\u77e5\u635f\u5931"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17707v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "RaFL: An Empirical Study of Random Filter Losses for Image Reconstruction", "tldr": "\u968f\u673a\u6ee4\u6ce2\u635f\u5931\u65e0\u9700\u9884\u8bad\u7ec3\u7279\u5f81\u4e0e\u624b\u52a8\u8c03\u6743\uff0c\u4ee5\u4f4e\u5f00\u9500\u6539\u5584\u4e8c\u7ef4\u548c\u4e09\u7ef4\u56fe\u50cf\u91cd\u5efa\u3002", "upvotes": 0, "what_it_is": "RaFL\u901a\u8fc7\u968f\u673a\u5377\u79ef\u3001\u5085\u91cc\u53f6\u7279\u5f81\u548c\u5c0f\u6ce2\u6ee4\u6ce2\u6bd4\u8f83\u9884\u6d4b\u4e0e\u76ee\u6807\uff0c\u5e76\u7528\u68af\u5ea6\u8303\u6570\u5339\u914d\u81ea\u52a8\u5e73\u8861\u635f\u5931\uff1b\u6bcf\u6b65\u91cd\u91c7\u6837\u6ee4\u6ce2\u6743\u91cd\uff0c\u91c7\u7528\u9ad8\u65af\u521d\u59cb\u5316\u3002", "why_notable": "\u5c06\u611f\u77e5\u635f\u5931\u5bf9\u9884\u8bad\u7ec3\u7279\u5f81\u7684\u4f9d\u8d56\u66ff\u6362\u4e3a\u968f\u673a\u6ee4\u6ce2\uff0c\u5728\u4e94\u9879\u4efb\u52a1\u4e0a\u8868\u73b0\u7a33\u5b9a\uff0c\u4e14\u4e0d\u589e\u52a0\u63a8\u7406\u6210\u672c\uff0c\u4e3a\u8de8\u57df\u91cd\u5efa\u63d0\u4f9b\u8f7b\u91cf\u635f\u5931\u9009\u62e9\u3002"}, {"abstract": "Low-rank approximation captures one important notion of matrix simplicity: a matrix is simple if it is well described by a low-dimensional linear model. This paper studies a complementary notion. We consider matrices that become structurally simple only after permuting rows and columns, so that their mass concentrates in a prescribed geometric pattern such as a band, block-diagonal, arrowhead, or related form. We introduce a pattern distance that measures how close a matrix is to a given pattern after optimal reordering, giving a common framework for structural problems such as latent ordering, community detection, and bandwidth minimization. The problem is NP-hard in general; we derive an alternating algorithm based on Linear Assignment subproblems. We further introduce a pattern-plus-low-rank decomposition that combines permutation-structured fitting with a low-rank residual, whose permutation step is pattern fitting on the residual; its gains across pattern families persist at a matched parameter budget and are substantially reduced under a density-matched random-mask control. We evaluate the framework on synthetic recovery tasks, real correlation and graph adjacency matrices, and transformer attention heads, showing that a single universal algorithm recovers qualitatively different forms of matrix structure.", "arxiv_id": "2611.17674", "arxiv_url": "https://arxiv.org/abs/2611.17674", "authors": ["Andrei Ermakov"], "brief": "\u63d0\u51fa\u6a21\u5f0f\u8ddd\u79bb\uff0c\u8861\u91cf\u77e9\u9635\u7ecf\u6700\u4f18\u884c\u5217\u91cd\u6392\u540e\u4e0e\u6307\u5b9a\u51e0\u4f55\u6a21\u5f0f\u7684\u63a5\u8fd1\u7a0b\u5ea6\u3002\u4ee5\u7ebf\u6027\u6307\u6d3e\u5b50\u95ee\u9898\u4ea4\u66ff\u4f18\u5316\uff0c\u5e76\u7ed3\u5408\u4f4e\u79e9\u6b8b\u5dee\u6784\u5efa\u6a21\u5f0f\u52a0\u4f4e\u79e9\u5206\u89e3\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17674", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u91cd\u6392\u4f18\u5316\u4e00\u822c\u4e3aNP\u96be\uff0c\u91c7\u7528\u7ebf\u6027\u6307\u6d3e\u4ea4\u66ff\u6c42\u89e3", "\u540c\u53c2\u6570\u9884\u7b97\u4e0b\u5206\u89e3\u4ecd\u6709\u589e\u76ca\uff0c\u968f\u673a\u63a9\u7801\u5bf9\u7167\u663e\u8457\u524a\u5f31\u589e\u76ca", "\u9a8c\u8bc1\u8986\u76d6\u5408\u6210\u6062\u590d\u3001\u76f8\u5173\u77e9\u9635\u3001\u56fe\u90bb\u63a5\u53ca\u6ce8\u610f\u529b\u5934"], "keywords": ["\u77e9\u9635\u5206\u89e3", "\u7ed3\u6784\u53d1\u73b0", "\u7ec4\u5408\u4f18\u5316", "\u4f4e\u79e9\u8fd1\u4f3c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17674v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Pattern-Based Matrix Analysis Under Permutations", "tldr": "\u901a\u8fc7\u884c\u5217\u91cd\u6392\u8bc6\u522b\u77e9\u9635\u51e0\u4f55\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408\u4f4e\u79e9\u6b8b\u5dee\u7edf\u4e00\u523b\u753b\u77e9\u9635\u7b80\u6d01\u6027\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u6a21\u5f0f\u8ddd\u79bb\uff0c\u8861\u91cf\u77e9\u9635\u7ecf\u6700\u4f18\u884c\u5217\u91cd\u6392\u540e\u4e0e\u6307\u5b9a\u51e0\u4f55\u6a21\u5f0f\u7684\u63a5\u8fd1\u7a0b\u5ea6\u3002\u4ee5\u7ebf\u6027\u6307\u6d3e\u5b50\u95ee\u9898\u4ea4\u66ff\u4f18\u5316\uff0c\u5e76\u7ed3\u5408\u4f4e\u79e9\u6b8b\u5dee\u6784\u5efa\u6a21\u5f0f\u52a0\u4f4e\u79e9\u5206\u89e3\u3002", "why_notable": "\u4e3a\u4f4e\u79e9\u4e4b\u5916\u7684\u77e9\u9635\u7b80\u6d01\u6027\u63d0\u4f9b\u7edf\u4e00\u5ea6\u91cf\u4e0e\u6c42\u89e3\u6846\u67b6\uff0c\u5c06\u6f5c\u5728\u6392\u5e8f\u3001\u793e\u533a\u68c0\u6d4b\u548c\u5e26\u5bbd\u6700\u5c0f\u5316\u7b49\u95ee\u9898\u8054\u7cfb\u8d77\u6765\u3002"}, {"abstract": "Contrastive vision-language models such as CLIP are trained to align images and text, not to represent taxonomies. Yet empirical studies show that CLIP embeddings exhibit hierarchical structure aligned with the hierarchy of semantic concepts. A theoretical characterization of why such hierarchy emerges from a non-hierarchical objective remains open. In this paper, we formalize this phenomenon as Hierarchical Angular Separation (HAS), a geometric property whereby each non-leaf concept embedding is more similar to its descendants than to off-branch concepts. Empirically, we show that HAS holds approximately in raw images and randomly initialized CLIP image embeddings, while in text embeddings it holds approximately only after contrastive learning. To theoretically explain this asymmetry, we analyze an unconstrained features model in which the image embeddings are fixed and only the text embeddings are trained. At the global minimizer, the text-side HAS violation percentage at each node is at most the image-side HAS violation and near-violation percentage. The key mechanism is the hierarchical co-occurrence structure of image-text pairs, which biases text embeddings toward root-centered image prototypes. For a linear contrastive loss, we derive a closed-form solution that makes this mechanism explicit. We extend the analysis to the InfoNCE loss and establish analogous guarantees under sufficient regularization. Synthetic experiments validate the theory and show that HAS is transferred even beyond the regimes covered by our analysis.", "arxiv_id": "2611.17671", "arxiv_url": "https://arxiv.org/abs/2611.17671", "authors": ["Nghia Nguyen", "Tianjiao Ding", "Lachlan Ewen MacDonald", "Ren\u00e9 Vidal"], "brief": "\u5c06\u6982\u5ff5\u5c42\u7ea7\u5f62\u5f0f\u5316\u4e3a\u5c42\u7ea7\u89d2\u5ea6\u5206\u79bb\uff08HAS\uff09\uff0c\u5728\u56fa\u5b9a\u56fe\u50cf\u3001\u4ec5\u8bad\u7ec3\u6587\u672c\u5d4c\u5165\u7684\u6a21\u578b\u4e2d\uff0c\u8bc1\u660e\u56fe\u6587\u5171\u73b0\u7ed3\u6784\u5982\u4f55\u9a71\u52a8\u5c42\u7ea7\u7ed3\u6784\u8de8\u6a21\u6001\u8fc1\u79fb\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17671", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["HAS\u5728\u539f\u59cb\u56fe\u50cf\u53ca\u968f\u673a\u521d\u59cb\u5316\u56fe\u50cf\u5d4c\u5165\u4e2d\u8fd1\u4f3c\u6210\u7acb", "\u5168\u5c40\u6700\u4f18\u65f6\uff0c\u6587\u672cHAS\u8fdd\u4f8b\u7387\u53d7\u56fe\u50cf\u8fdd\u4f8b\u53ca\u8fd1\u8fdd\u4f8b\u7387\u7ea6\u675f", "\u7ebf\u6027\u5bf9\u6bd4\u635f\u5931\u6709\u95ed\u5f0f\u89e3\uff1bInfoNCE\u5728\u5145\u5206\u6b63\u5219\u5316\u4e0b\u83b7\u7c7b\u4f3c\u4fdd\u8bc1"], "keywords": ["\u5bf9\u6bd4\u5b66\u4e60", "\u591a\u6a21\u6001\u5b66\u4e60", "\u5c42\u7ea7\u7ed3\u6784", "\u8868\u5f81\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17671v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Provable Cross-Modal Transfer of Hierarchical Concept Structure in CLIP Embeddings", "tldr": "\u7406\u8bba\u8bc1\u660e\u5bf9\u6bd4\u5b66\u4e60\u53ef\u5c06\u56fe\u50cf\u4fa7\u5df2\u6709\u7684\u6982\u5ff5\u5c42\u7ea7\u7ed3\u6784\u8fc1\u79fb\u81f3\u6587\u672c\u5d4c\u5165\u3002", "upvotes": 0, "what_it_is": "\u5c06\u6982\u5ff5\u5c42\u7ea7\u5f62\u5f0f\u5316\u4e3a\u5c42\u7ea7\u89d2\u5ea6\u5206\u79bb\uff08HAS\uff09\uff0c\u5728\u56fa\u5b9a\u56fe\u50cf\u3001\u4ec5\u8bad\u7ec3\u6587\u672c\u5d4c\u5165\u7684\u6a21\u578b\u4e2d\uff0c\u8bc1\u660e\u56fe\u6587\u5171\u73b0\u7ed3\u6784\u5982\u4f55\u9a71\u52a8\u5c42\u7ea7\u7ed3\u6784\u8de8\u6a21\u6001\u8fc1\u79fb\u3002", "why_notable": "\u4e3a\u975e\u5c42\u7ea7\u8bad\u7ec3\u76ee\u6807\u4ea7\u751f\u8bed\u4e49\u5c42\u7ea7\u63d0\u4f9b\u7406\u8bba\u89e3\u91ca\uff0c\u5e76\u63ed\u793a\u56fe\u50cf\u4e0e\u6587\u672c\u4fa7\u7684\u7ed3\u6784\u4e0d\u5bf9\u79f0\uff0c\u5e2e\u52a9\u7406\u89e3\u5bf9\u6bd4\u8868\u5f81\u7684\u6765\u6e90\u3002"}, {"abstract": "Vision-language models (VLMs) often exhibit overconfidence, providing firm answers even when visual evidence is insufficient. A prominent case is referential ambiguity in Visual Question Answering (VQA), where multiple entities in an image are plausible referents of a question. Addressing such cases requires recognizing when ambiguity is present: ambiguous questions can be handled by asking for clarification or enumerating plausible referents, while unambiguous questions should receive a direct answer. Current VLMs struggle with this distinction, often defaulting to a single interpretation. To investigate whether activation steering can serve as an inference-time mechanism to elicit such behaviors, we introduce AmbiSteer, a lightweight framework to selectively elicit ambiguity-aware behavior. Across three VLMs, we find that steering alone has limited and model-dependent effects, while prompting is generally more effective. Combining prompting and steering substantially increases clarification and enumeration behaviors, but also elicits them on unambiguous cases. AmbiSteer addresses this using a linear classifier to predict input ambiguity and condition the steering direction accordingly, increasing the proportion of inputs handled appropriately from 59.0% to 77.0% on average across models. Our work sets the ground for lightweight approaches to reduce model overconfidence in uncertain multimodal settings.", "arxiv_id": "2611.17900", "arxiv_url": "https://arxiv.org/abs/2611.17900", "authors": ["Monica Riedler", "Samuele Antonelli", "Barbara Plank", "Raffaella Bernardi"], "brief": "AmbiSteer\u5728\u63a8\u7406\u65f6\u7ed3\u5408\u63d0\u793a\u4e0e\u6fc0\u6d3b\u5f15\u5bfc\uff0c\u4fc3\u4f7f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6f84\u6e05\u6b67\u4e49\u6216\u5217\u4e3e\u5019\u9009\u5bf9\u8c61\uff1b\u518d\u7528\u7ebf\u6027\u5206\u7c7b\u5668\u5224\u65ad\u8f93\u5165\u6b67\u4e49\uff0c\u6309\u9700\u8c03\u6574\u5f15\u5bfc\u65b9\u5411\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17900", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57283\u4e2a\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0a\uff0c\u5355\u72ec\u6fc0\u6d3b\u5f15\u5bfc\u6548\u679c\u6709\u9650\u4e14\u4f9d\u8d56\u6a21\u578b", "\u63d0\u793a\u7ed3\u5408\u6fc0\u6d3b\u5f15\u5bfc\u589e\u52a0\u6f84\u6e05\u884c\u4e3a\uff0c\u4f46\u4e5f\u8bef\u89e6\u53d1\u65e0\u6b67\u4e49\u8f93\u5165", "\u7ebf\u6027\u5206\u7c7b\u5668\u6761\u4ef6\u5316\u5f15\u5bfc\uff0c\u4f7f\u6070\u5f53\u5904\u7406\u7387\u4ece59.0%\u5347\u81f377.0%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u95ee\u7b54", "\u6fc0\u6d3b\u5f15\u5bfc", "\u4e0d\u786e\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17900v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AmbiSteer: Selectively Eliciting Ambiguity-Aware Responses in Vision-Language Models", "tldr": "\u901a\u8fc7\u6b67\u4e49\u5206\u7c7b\u5668\u9009\u62e9\u6027\u5f15\u5bfc\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u6539\u5584\u6f84\u6e05\u4e0e\u76f4\u63a5\u56de\u7b54\u7684\u5207\u6362\u3002", "upvotes": 0, "what_it_is": "AmbiSteer\u5728\u63a8\u7406\u65f6\u7ed3\u5408\u63d0\u793a\u4e0e\u6fc0\u6d3b\u5f15\u5bfc\uff0c\u4fc3\u4f7f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u6f84\u6e05\u6b67\u4e49\u6216\u5217\u4e3e\u5019\u9009\u5bf9\u8c61\uff1b\u518d\u7528\u7ebf\u6027\u5206\u7c7b\u5668\u5224\u65ad\u8f93\u5165\u6b67\u4e49\uff0c\u6309\u9700\u8c03\u6574\u5f15\u5bfc\u65b9\u5411\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u628a\u4e0d\u786e\u5b9a\u6027\u8868\u8fbe\u4ece\u7edf\u4e00\u89e6\u53d1\u6539\u4e3a\u6309\u8f93\u5165\u9009\u62e9\uff0c\u65e2\u51cf\u5c11\u6b67\u4e49\u573a\u666f\u4e0b\u7684\u6b66\u65ad\u56de\u7b54\uff0c\u4e5f\u907f\u514d\u6e05\u6670\u95ee\u9898\u88ab\u8fc7\u5ea6\u6f84\u6e05\u3002"}, {"abstract": "With the rapid advancement of Large Language Models (LLMs), an increasing number of users are turning to LLM-powered agents for conversational shopping in e-commerce. However, the user needs continue to change as new product categories, procurement scenarios, and feature requests emerge. At the same time, the product\u0027s execution harness-including its tools, skills, and operating procedures-continues to evolve to support increasingly sophisticated interactions. These changes create two practical challenges: 1) Demand drift alters the distribution, intent, and complexity of user requests, causing a model trained once to fall behind; 2) Harness evolution requires the model to use newly introduced capabilities correctly without losing behavior that users already rely on. Periodic manual retraining is too delayed and labor-intensive for this setting. To address these challenges, we present G-CAST, a governed continual self-training system that converts daily production evidence under evolving demand and capability contracts into reward-routed, entropy-prioritized training data and governed reward evolution. Governed checkpoint transition under cumulative evaluation controls each model update, enabling the agent to learn newly introduced behaviors without sacrificing previously accepted capabilities. Experiments on a real production e-commerce agent show that G-CAST achieves stronger adaptation to newly introduced demand while better preserving previously accepted behavior compared with a strong autonomous post-training baseline. Ablations further show that both reward-routed, entropy-prioritized data orchestration and governed reward evolution are important to these gains. G-CAST is now deployed in Yuancai(http://cai.1688.com/), a B2B procurement agent on Alibaba\u0027s 1688 platform.", "arxiv_id": "2611.17814", "arxiv_url": "https://arxiv.org/abs/2611.17814", "authors": ["Yuechun Yu", "Wenzheng Kong", "Xiaofeng Mao", "Jin Zhang"], "brief": "G-CAST\u5c06\u6bcf\u65e5\u751f\u4ea7\u8bc1\u636e\u8f6c\u4e3a\u6309\u5956\u52b1\u8def\u7531\u3001\u71b5\u4f18\u5148\u7ea7\u7ec4\u7ec7\u7684\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u53d7\u63a7\u66f4\u65b0\u5956\u52b1\u3002\u901a\u8fc7\u7d2f\u79ef\u8bc4\u4f30\u628a\u5173\u6a21\u578b\u7248\u672c\u5207\u6362\uff0c\u517c\u987e\u65b0\u884c\u4e3a\u5b66\u4e60\u4e0e\u65e7\u80fd\u529b\u4fdd\u7559\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17814", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5956\u52b1\u8def\u7531\u4e0e\u71b5\u4f18\u5148\u7ea7\u8054\u5408\u7ec4\u7ec7\u751f\u4ea7\u8bad\u7ec3\u6570\u636e", "\u53d7\u63a7\u5956\u52b1\u6f14\u5316\u4e0e\u7d2f\u79ef\u8bc4\u4f30\u7ea6\u675f\u6a21\u578b\u66f4\u65b0", "\u5df2\u90e8\u7f72\u4e8e\u963f\u91cc1688\u7684B2B\u91c7\u8d2d\u667a\u80fd\u4f53\u6e90\u91c7"], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u81ea\u8bad\u7ec3", "\u7535\u5546\u667a\u80fd\u4f53", "\u5956\u52b1\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17814v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "G-CAST: Governed Continual Self-Training for E-Commerce Agents under Evolving Demands", "tldr": "\u901a\u8fc7\u53d7\u63a7\u6301\u7eed\u81ea\u8bad\u7ec3\uff0c\u8ba9\u7535\u5546\u667a\u80fd\u4f53\u9002\u5e94\u9700\u6c42\u4e0e\u5de5\u5177\u53d8\u5316\u5e76\u4fdd\u7559\u65e2\u6709\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": "G-CAST\u5c06\u6bcf\u65e5\u751f\u4ea7\u8bc1\u636e\u8f6c\u4e3a\u6309\u5956\u52b1\u8def\u7531\u3001\u71b5\u4f18\u5148\u7ea7\u7ec4\u7ec7\u7684\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u53d7\u63a7\u66f4\u65b0\u5956\u52b1\u3002\u901a\u8fc7\u7d2f\u79ef\u8bc4\u4f30\u628a\u5173\u6a21\u578b\u7248\u672c\u5207\u6362\uff0c\u517c\u987e\u65b0\u884c\u4e3a\u5b66\u4e60\u4e0e\u65e7\u80fd\u529b\u4fdd\u7559\u3002", "why_notable": "\u771f\u5b9e\u751f\u4ea7\u5b9e\u9a8c\u663e\u793a\uff0c\u76f8\u6bd4\u5f3a\u81ea\u4e3b\u540e\u8bad\u7ec3\u57fa\u7ebf\uff0c\u8be5\u7cfb\u7edf\u66f4\u597d\u9002\u5e94\u65b0\u9700\u6c42\u5e76\u4fdd\u7559\u65e7\u884c\u4e3a\uff0c\u4e3a\u6301\u7eed\u66f4\u65b0\u5546\u4e1a\u667a\u80fd\u4f53\u63d0\u4f9b\u843d\u5730\u8def\u5f84\u3002"}, {"abstract": "Large language models (LLMs) are increasingly used by reviewers to highlight weaknesses during the reviewing process, and their outputs often shape the reviews that humans submit. Prior work studies how LLM reviews align with human ones, yet we know little about which parts of a paper these models actually criticize. In this work, we investigate 2,000 papers from ACL, EMNLP, COLM, and ICLR, and show that the latest GPT and Claude models draw about 50% or more of their review weaknesses from the appendix. This behavior holds across the API, coding-agent, and web access methods for using LLMs to review a paper. In contrast, we find that humans draw only 8.4% of their weaknesses from the appendix, and these weaknesses primarily revolve around a paper\u0027s presentation and content related to its core idea. Meanwhile, LLMs draw weaknesses from deep in the appendix that concern fine-grained technical details not central to the paper\u0027s contributions. We anticipate that our analysis will contribute to the scholarly discourse on AI reviews. Our code is publicly available at: https://github.com/cincynlp/review_appendix.", "arxiv_id": "2611.17811", "arxiv_url": "https://arxiv.org/abs/2611.17811", "authors": ["Saptarshi Ghosh", "Mohammad Saim", "Tianyu Jiang"], "brief": "\u7814\u7a76\u5206\u6790\u56db\u4e2a\u4f1a\u8bae\u7684\u4e24\u5343\u7bc7\u8bba\u6587\uff0c\u8ffd\u8e2a\u5927\u6a21\u578b\u4e0e\u4eba\u7c7b\u8bc4\u5ba1\u6240\u63d0\u7f3a\u9677\u6765\u81ea\u6b63\u6587\u8fd8\u662f\u9644\u5f55\uff0c\u5e76\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u8bbf\u95ee\u65b9\u5f0f\u4e0b\u7684\u6279\u8bc4\u6765\u6e90\u5206\u5e03\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17811", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6ACL\u3001EMNLP\u3001COLM\u3001ICLR\u51712000\u7bc7\u8bba\u6587", "GPT\u4e0eClaude\u7ea650%\u6216\u66f4\u591a\u7f3a\u9677\u6765\u81ea\u9644\u5f55\uff0c\u4eba\u7c7b\u4ec58.4%", "\u9644\u5f55\u504f\u5411\u5728API\u3001\u7f16\u7a0b\u667a\u80fd\u4f53\u53ca\u7f51\u9875\u8bbf\u95ee\u4e2d\u5747\u5b58\u5728"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u81ea\u52a8\u5ba1\u7a3f", "\u6a21\u578b\u504f\u5dee"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17811v1", "published_at": "2026-11-13", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "AI Reviews Are Biased Towards the Appendix", "tldr": "\u7814\u7a76\u53d1\u73b0\u5927\u6a21\u578b\u5ba1\u7a3f\u8fc7\u5ea6\u5173\u6ce8\u9644\u5f55\u7ec6\u8282\uff0c\u4e0e\u4eba\u7c7b\u8bc4\u5ba1\u7684\u6279\u8bc4\u91cd\u5fc3\u660e\u663e\u504f\u79bb\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5206\u6790\u56db\u4e2a\u4f1a\u8bae\u7684\u4e24\u5343\u7bc7\u8bba\u6587\uff0c\u8ffd\u8e2a\u5927\u6a21\u578b\u4e0e\u4eba\u7c7b\u8bc4\u5ba1\u6240\u63d0\u7f3a\u9677\u6765\u81ea\u6b63\u6587\u8fd8\u662f\u9644\u5f55\uff0c\u5e76\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u8bbf\u95ee\u65b9\u5f0f\u4e0b\u7684\u6279\u8bc4\u6765\u6e90\u5206\u5e03\u3002", "why_notable": "\u63ed\u793a\u6a21\u578b\u5ba1\u7a3f\u53ef\u80fd\u628a\u975e\u6838\u5fc3\u6280\u672f\u7ec6\u8282\u653e\u5927\u4e3a\u8bba\u6587\u7f3a\u9677\uff0c\u4e3a\u8bc4\u4f30\u81ea\u52a8\u5ba1\u7a3f\u8d28\u91cf\u63d0\u4f9b\u4e86\u6bd4\u4eba\u673a\u610f\u89c1\u4e00\u81f4\u6027\u66f4\u5177\u4f53\u7684\u89c2\u5bdf\u7ef4\u5ea6\u3002"}, {"abstract": "Service robots in domestic and office environments must identify users to provide personalized services based on their preferences and previous interactions. This is challenging because only a few observations may be available for learning, while observation conditions change owing to appearance, environmental noise, and utterance content. To address this challenge, this study proposes a multimodal person concept model that learns person concepts from a small number of observations, without person labels, and enables robust identification under changing conditions. The model employs a nonparametric Bayesian generative model based on the Chinese restaurant process and integrates visual, acoustic, and linguistic features extracted using Contrastive Language-Image Pre-training (CLIP) and Contrastive Language-Audio Pretraining (CLAP), followed by principal component analysis (PCA). We evaluated six participants under eight conditions in which appearance changes, additive noise, and transcription errors were introduced individually and in combination. Averaged over the eight conditions, the proposed model achieved an identification accuracy of 0.89 while inferring the number of person concepts from the observations, which is comparable to k-means clustering that was supplied with the true number of participants (0.88). We also examined PCA dimensionality, modality availability, and variation strength, and demonstrated the model on a Toyota Human Support Robot. These results show that multimodal person concept learning supports robust person identification under changing conditions, and that identification can succeed even when the number of concepts is not correctly recovered. The project page and demonstration video are available at https://okitamisan01.github.io/person_concept/.", "arxiv_id": "2611.17802", "arxiv_url": "https://arxiv.org/abs/2611.17802", "authors": ["Mizuho Okitani", "Yoshinobu Hagiwara"], "brief": "\u8be5\u6a21\u578b\u7528\u4e2d\u56fd\u9910\u9986\u8fc7\u7a0b\u6784\u5efa\u975e\u53c2\u6570\u8d1d\u53f6\u65af\u751f\u6210\u6a21\u578b\uff0c\u81ea\u52a8\u63a8\u65ad\u4eba\u5458\u6982\u5ff5\u6570\u91cf\uff1b\u878d\u5408\u7ecfCLIP\u3001CLAP\u63d0\u53d6\u53caPCA\u964d\u7ef4\u7684\u591a\u6a21\u6001\u7279\u5f81\uff0c\u9002\u5e94\u89c2\u6d4b\u6761\u4ef6\u53d8\u5316\u3002", "categories": ["cs.RO", "cs.AI", "cs.HC", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17802", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u4e2d\u56fd\u9910\u9986\u8fc7\u7a0b\u652f\u6301\u65e0\u8eab\u4efd\u6807\u7b7e\u5b66\u4e60\u4e0e\u4eba\u6570\u63a8\u65ad", "6\u540d\u53c2\u4e0e\u8005\u30018\u79cd\u6761\u4ef6\u4e0b\u5e73\u5747\u8bc6\u522b\u51c6\u786e\u73870.89", "\u5df2\u5728\u4e30\u7530Human Support Robot\u4e0a\u6f14\u793a"], "keywords": ["\u591a\u6a21\u6001\u5b66\u4e60", "\u4eba\u5458\u8bc6\u522b", "\u8d1d\u53f6\u65af\u5efa\u6a21", "\u670d\u52a1\u673a\u5668\u4eba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17802v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Multimodal Person Concept Model for Person Identification under Varying Observation Conditions", "tldr": "\u878d\u5408\u89c6\u89c9\u3001\u58f0\u97f3\u4e0e\u8bed\u8a00\uff0c\u6a21\u578b\u65e0\u9700\u8eab\u4efd\u6807\u7b7e\u5373\u53ef\u4ece\u5c11\u91cf\u89c2\u6d4b\u4e2d\u8bc6\u522b\u4eba\u5458\u3002", "upvotes": 0, "what_it_is": "\u8be5\u6a21\u578b\u7528\u4e2d\u56fd\u9910\u9986\u8fc7\u7a0b\u6784\u5efa\u975e\u53c2\u6570\u8d1d\u53f6\u65af\u751f\u6210\u6a21\u578b\uff0c\u81ea\u52a8\u63a8\u65ad\u4eba\u5458\u6982\u5ff5\u6570\u91cf\uff1b\u878d\u5408\u7ecfCLIP\u3001CLAP\u63d0\u53d6\u53caPCA\u964d\u7ef4\u7684\u591a\u6a21\u6001\u7279\u5f81\uff0c\u9002\u5e94\u89c2\u6d4b\u6761\u4ef6\u53d8\u5316\u3002", "why_notable": "\u65e0\u9700\u9884\u5148\u7ed9\u5b9a\u4eba\u6570\uff0c\u51c6\u786e\u7387\u4ecd\u63a5\u8fd1\u5df2\u77e5\u4eba\u6570\u7684\u805a\u7c7b\u57fa\u7ebf\uff1b\u5373\u4f7f\u6982\u5ff5\u6570\u91cf\u63a8\u65ad\u4e0d\u51c6\uff0c\u4e5f\u80fd\u4fdd\u6301\u4eba\u5458\u8bc6\u522b\u80fd\u529b\uff0c\u4e3a\u673a\u5668\u4eba\u4e2a\u6027\u5316\u670d\u52a1\u63d0\u4f9b\u652f\u6301\u3002"}, {"abstract": "Early detection of genetic kidney diseases, especially autosomal dominant polycystic kidney disease (ADPKD), is crucial because certain genotypes such as truncating PKD1 mutations cause rapid kidney growth and early progression to end-stage kidney disease. MRI-based genotype inference is a potential low-cost complement to genetic testing. However, although many deep learning methods have been developed for classifying various MR images, applying them to ADPKD remains challenging: (1) abdominal MR images are generally too large to be handled by deep learning models designed for smaller images like brain MRI, and (2) the amount of labeled data for ADPKD genetic mutations is insufficient to train deep learning models. In order to address these challenges, we propose E3PN, an efficient 3D MRI-based ADPKD genotype classification network that relies on point sampling and E(3)-invariance. We utilize a point representation of 3D MRI, which consumes less GPU memory than a voxel representation. For further memory efficiency, 3D points are sampled from a mixture distribution over the two kidneys in each image. Since E(3)-invariance has been shown to improve data efficiency, we also incorporate it into our model through coordinate canonicalization. On our ADPKD dataset, E3PN trains 163 times faster and uses 103x less GPU memory than a 3D ResNet, while also improving F1 from 0.165 to 0.226 over both baselines. These results establish a first benchmark for five-way ADPKD genotype classification from 3D MRI and show that point sampling and coordinate canonicalization yield two-orders-of-magnitude efficiency gains with a modest but consistent improvement in F1.", "arxiv_id": "2611.17758", "arxiv_url": "https://arxiv.org/abs/2611.17758", "authors": ["Kwanghee Lee", "Hyeongsub Lee", "Youngwoo Kim", "Hyunji Jeong"], "brief": "E3PN\u5c06\u4e09\u7ef4MRI\u8f6c\u4e3a\u70b9\u8868\u793a\uff0c\u4ece\u53cc\u80be\u6df7\u5408\u5206\u5e03\u4e2d\u91c7\u6837\u4ee5\u964d\u4f4e\u663e\u5b58\u5f00\u9500\uff0c\u5e76\u901a\u8fc7\u5750\u6807\u89c4\u8303\u5316\u5f15\u5165E(3)\u4e0d\u53d8\u6027\uff0c\u63d0\u5347\u5c0f\u6837\u672c\u4e0b\u7684\u57fa\u56e0\u578b\u5206\u7c7b\u6548\u7387\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17758", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u53cc\u80be\u6df7\u5408\u5206\u5e03\u70b9\u91c7\u6837\uff0c\u66ff\u4ee3\u9ad8\u5f00\u9500\u4f53\u7d20\u8868\u793a", "\u5750\u6807\u89c4\u8303\u5316\u5b9e\u73b0E(3)\u4e0d\u53d8\u6027\uff0c\u63d0\u5347\u6570\u636e\u6548\u7387", "\u8f833D ResNet\u8bad\u7ec3\u5feb163\u500d\u3001\u663e\u5b58\u5c11103\u500d"], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u70b9\u4e91\u5b66\u4e60", "\u51e0\u4f55\u4e0d\u53d8\u6027", "\u57fa\u56e0\u578b\u5206\u7c7b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17758v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Efficient Genotype Classification from 3D MRI in ADPKD via Density-Aware Point Sampling and E(3)-invariance", "tldr": "\u5c06\u4e09\u7ef4\u80be\u810f\u5f71\u50cf\u8f6c\u4e3a\u7a00\u758f\u70b9\u96c6\uff0c\u4ee5\u51e0\u4f55\u4e0d\u53d8\u6027\u4f4e\u6210\u672c\u63a8\u65ad\u591a\u56ca\u80be\u57fa\u56e0\u578b\u3002", "upvotes": 0, "what_it_is": "E3PN\u5c06\u4e09\u7ef4MRI\u8f6c\u4e3a\u70b9\u8868\u793a\uff0c\u4ece\u53cc\u80be\u6df7\u5408\u5206\u5e03\u4e2d\u91c7\u6837\u4ee5\u964d\u4f4e\u663e\u5b58\u5f00\u9500\uff0c\u5e76\u901a\u8fc7\u5750\u6807\u89c4\u8303\u5316\u5f15\u5165E(3)\u4e0d\u53d8\u6027\uff0c\u63d0\u5347\u5c0f\u6837\u672c\u4e0b\u7684\u57fa\u56e0\u578b\u5206\u7c7b\u6548\u7387\u3002", "why_notable": "\u5efa\u7acb\u4e09\u7ef4MRI\u4e94\u5206\u7c7b\u57fa\u56e0\u578b\u9996\u4e2a\u57fa\u51c6\uff0cF1\u75310.165\u5347\u81f30.226\uff1b\u4ee5\u6709\u9650\u7cbe\u5ea6\u589e\u76ca\u6362\u6765\u4e24\u4e2a\u6570\u91cf\u7ea7\u7684\u6548\u7387\u63d0\u5347\u3002"}, {"abstract": "In 2016, we wrote a paper introducing the phrase \"Polyak-Lojasiewicz (PL) condition\" for an old idea, unsure of how readers would react. The paper ultimately had a larger impact than we expected, and we are surprised and honoured to receive the 2026 PKDD ECML Test of Time Award. With 10 years of hindsight, this note offers an informal and candid retrospective on the PL condition. We take a look back at the origins of the paper, give an AI-assisted refined version of the main theorem, review criticisms of the work, and discuss a variety of related ideas and extensions.", "arxiv_id": "2611.17745", "arxiv_url": "https://arxiv.org/abs/2611.17745", "authors": ["Hamed Karimi", "Julie Nutini", "Mark Schmidt"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8ePL\u6761\u4ef6\u7684\u5341\u5e74\u56de\u987e\uff0c\u8ffd\u6eaf\u539f\u8bba\u6587\u7684\u5f62\u6210\u4e0e\u547d\u540d\u8fc7\u7a0b\u3002\u4f5c\u8005\u501f\u52a9AI\u7cbe\u70bc\u4e3b\u5b9a\u7406\uff0c\u5e76\u68b3\u7406\u76f8\u5173\u6279\u8bc4\u3001\u5173\u8054\u6982\u5ff5\u53ca\u540e\u7eed\u6269\u5c55\u3002", "categories": ["math.OC", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17745", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u56de\u987e2016\u5e74\u5f15\u5165PL\u6761\u4ef6\u540d\u79f0\u7684\u539f\u8bba\u6587", "\u63d0\u4f9bAI\u8f85\u52a9\u7cbe\u70bc\u7684\u4e3b\u5b9a\u7406\u7248\u672c", "\u68b3\u7406PL\u6761\u4ef6\u76f8\u5173\u6279\u8bc4\u3001\u5173\u8054\u601d\u60f3\u4e0e\u6269\u5c55"], "keywords": ["\u4f18\u5316\u7406\u8bba", "\u673a\u5668\u5b66\u4e60", "PL\u6761\u4ef6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17745v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "The Polyak-\u0141ojasiewicz Paper: A 10-Year Retrospective", "tldr": "\u5341\u5e74\u56de\u987e\u68b3\u7406PL\u6761\u4ef6\u7684\u6765\u9f99\u53bb\u8109\uff0c\u5e76\u7cbe\u70bc\u6838\u5fc3\u5b9a\u7406\u3001\u56de\u5e94\u6279\u8bc4\u4e0e\u8ba8\u8bba\u6269\u5c55\u3002", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5173\u4e8ePL\u6761\u4ef6\u7684\u5341\u5e74\u56de\u987e\uff0c\u8ffd\u6eaf\u539f\u8bba\u6587\u7684\u5f62\u6210\u4e0e\u547d\u540d\u8fc7\u7a0b\u3002\u4f5c\u8005\u501f\u52a9AI\u7cbe\u70bc\u4e3b\u5b9a\u7406\uff0c\u5e76\u68b3\u7406\u76f8\u5173\u6279\u8bc4\u3001\u5173\u8054\u6982\u5ff5\u53ca\u540e\u7eed\u6269\u5c55\u3002", "why_notable": "\u539f\u8bba\u6587\u83b72026\u5e74ECML PKDD\u65f6\u95f4\u68c0\u9a8c\u5956\uff1b\u8fd9\u7bc7\u56de\u987e\u6709\u52a9\u4e8e\u7406\u89e3PL\u6761\u4ef6\u7684\u7406\u8bba\u5b9a\u4f4d\u53ca\u5176\u957f\u671f\u5f71\u54cd\u3002"}, {"abstract": "Adversarial training is a common technique for making neural networks more robust to small, intentionally crafted input perturbations, and robustness is commonly measured through accuracy under attack. By exploring inter-network representations across different adversarial training objectives, we can analyze whether multiple networks organize their latent representations similarly. We study Multilayer Perceptrons trained on MNIST under three adversarial training regimes and compare the resulting population training dynamics and geometry to those of a vanilla network. We use M-PHATE to embed data samples across training epochs and examine how the geometry of the data changes during training under adversarial objectives. On penultimate-layer representations we measure displacement between clean and perturbed points, distributional distance through maximum mean discrepancy, and nearest-neighbor recovery. Our visualizations and quantitative analyses show that adversarial training leads to structural changes in how networks organize internal data representations, and robust accuracy and representational stability can rank the same defenses in opposite ways. These findings support a discussion of re-evaluating how practitioners approach the auditing of model robustness by treating latent representations and their training trajectories as diagnostic artifacts across sets of networks.", "arxiv_id": "2611.17684", "arxiv_url": "https://arxiv.org/abs/2611.17684", "authors": ["Brandon Ismalej", "Alex Cloninger", "Gal Mishne"], "brief": "\u7814\u7a76\u5728MNIST\u4e0a\u6bd4\u8f83\u4e09\u79cd\u5bf9\u6297\u8bad\u7ec3\u4e0e\u666e\u901a\u8bad\u7ec3\u7684\u591a\u5c42\u611f\u77e5\u673a\u3002\u7528M-PHATE\u8ffd\u8e2a\u8de8\u8bad\u7ec3\u8f6e\u6b21\u7684\u8868\u5f81\u51e0\u4f55\uff0c\u5e76\u91cf\u5316\u5e72\u51c0\u4e0e\u6270\u52a8\u6837\u672c\u7684\u8868\u5f81\u5dee\u5f02\u3002", "categories": ["cs.LG", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17684", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["MNIST\u591a\u5c42\u611f\u77e5\u673a\uff1a\u6bd4\u8f83\u4e09\u79cd\u5bf9\u6297\u8bad\u7ec3\u65b9\u6848\u4e0e\u666e\u901a\u8bad\u7ec3", "M-PHATE\u53ef\u89c6\u5316\u6837\u672c\u8868\u5f81\u968f\u8bad\u7ec3\u8f6e\u6b21\u7684\u51e0\u4f55\u53d8\u5316", "\u5012\u6570\u7b2c\u4e8c\u5c42\u6d4b\u91cf\u4f4d\u79fb\u3001\u6700\u5927\u5747\u503c\u5dee\u5f02\u4e0e\u8fd1\u90bb\u6062\u590d"], "keywords": ["\u5bf9\u6297\u9c81\u68d2\u6027", "\u8868\u5f81\u51e0\u4f55", "\u5bf9\u6297\u8bad\u7ec3", "\u6a21\u578b\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17684v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Representational Geometry as a Diagnostic for Adversarial Robustness", "tldr": "\u5bf9\u6297\u51c6\u786e\u7387\u4e0e\u8868\u5f81\u7a33\u5b9a\u6027\u53ef\u80fd\u7ed9\u51fa\u76f8\u53cd\u6392\u540d\uff0c\u6f5c\u5728\u51e0\u4f55\u53ef\u8865\u5145\u9c81\u68d2\u6027\u5ba1\u8ba1\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5728MNIST\u4e0a\u6bd4\u8f83\u4e09\u79cd\u5bf9\u6297\u8bad\u7ec3\u4e0e\u666e\u901a\u8bad\u7ec3\u7684\u591a\u5c42\u611f\u77e5\u673a\u3002\u7528M-PHATE\u8ffd\u8e2a\u8de8\u8bad\u7ec3\u8f6e\u6b21\u7684\u8868\u5f81\u51e0\u4f55\uff0c\u5e76\u91cf\u5316\u5e72\u51c0\u4e0e\u6270\u52a8\u6837\u672c\u7684\u8868\u5f81\u5dee\u5f02\u3002", "why_notable": "\u7ed3\u679c\u63ed\u793a\u653b\u51fb\u4e0b\u51c6\u786e\u7387\u4e0e\u5185\u90e8\u8868\u5f81\u7a33\u5b9a\u6027\u5e76\u4e0d\u4e00\u81f4\uff0c\u4e3a\u9c81\u68d2\u6027\u5ba1\u8ba1\u63d0\u4f9b\u4e92\u8865\u8bca\u65ad\u89c6\u89d2\uff0c\u907f\u514d\u4ec5\u51ed\u5355\u4e00\u6307\u6807\u6392\u5e8f\u9632\u5fa1\u3002"}, {"abstract": "We study encoder models that pick one of several options in a single forward pass, without generating text. This technical report compares recipes for fine-tuning UltraBERT-380M with one mask per option. The four recipes differ in how an option is scored and how the scores become probabilities; one follows the expert gate of DeepSeek-V3. Trained on the same data as Qwen3-0.6B with the LLM-as-Jev recipe (67.6% test accuracy), the encoder reaches 69.7% to 72.1%. Scoring an option by \"yes\" minus \"no\" instead of \"yes\" alone gives the larger gain, from 69.7% to 71.3% on the test set and from 57.8% to 59.6% on external benchmarks (56.1% for the decoder). Sigmoid normalisation adds 0.8 test points; a square-root softplus adds none. One request at a time on an NVIDIA A100, the encoder takes 29 ms per decision against 68 ms, but uses more peak memory (2.8 against 2.2 GiB). An auxiliary head, trained on human-marked evidence and on labels selected with a reward adapted from SelfCite, predicts in the same pass the sentences annotated as support for the answer.", "arxiv_id": "2611.17867", "arxiv_url": "https://arxiv.org/abs/2611.17867", "authors": ["Astarag Mohapatra"], "brief": "\u7814\u7a76\u4ee5UltraBERT-380M\u4e3a\u6bcf\u4e2a\u9009\u9879\u8bbe\u7f6e\u4e00\u4e2a\u63a9\u7801\uff0c\u6bd4\u8f83\u56db\u79cd\u8bc4\u5206\u4e0e\u6982\u7387\u5f52\u4e00\u5316\u5fae\u8c03\u65b9\u6848\uff0c\u65e0\u9700\u751f\u6210\u6587\u672c\u5373\u53ef\u51b3\u7b56\uff1b\u8f85\u52a9\u5934\u540c\u6b65\u9884\u6d4b\u652f\u6301\u7b54\u6848\u7684\u53e5\u5b50\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17867", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u540c\u6570\u636e\u8bad\u7ec3\uff0c\u51c6\u786e\u738769.7%\u81f372.1%\uff0c\u9ad8\u4e8eQwen\u768467.6%", "\u201cyes\u51cfno\u201d\u8bc4\u5206\u4f7f\u5916\u90e8\u51c6\u786e\u7387\u4ece57.8%\u5347\u81f359.6%", "A100\u5355\u8bf7\u6c42\u8017\u65f629\u6beb\u79d2\uff0c\u5bf9\u7167\u4e3a68\u6beb\u79d2\uff1b\u5cf0\u503c\u663e\u5b58\u66f4\u9ad8"], "keywords": ["\u7f16\u7801\u5668", "\u9009\u9879\u51b3\u7b56", "\u6a21\u578b\u6548\u7387", "\u8bc1\u636e\u9884\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17867v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "UltraBERT-JEV: Encoder models for System One Applications", "tldr": "\u7f16\u7801\u5668\u5355\u6b21\u524d\u5411\u5b8c\u6210\u9009\u9879\u51b3\u7b56\uff0c\u6bd4\u5c0f\u578b\u751f\u6210\u6a21\u578b\u66f4\u51c6\u66f4\u5feb\uff0c\u5e76\u540c\u6b65\u9884\u6d4b\u652f\u6301\u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u4ee5UltraBERT-380M\u4e3a\u6bcf\u4e2a\u9009\u9879\u8bbe\u7f6e\u4e00\u4e2a\u63a9\u7801\uff0c\u6bd4\u8f83\u56db\u79cd\u8bc4\u5206\u4e0e\u6982\u7387\u5f52\u4e00\u5316\u5fae\u8c03\u65b9\u6848\uff0c\u65e0\u9700\u751f\u6210\u6587\u672c\u5373\u53ef\u51b3\u7b56\uff1b\u8f85\u52a9\u5934\u540c\u6b65\u9884\u6d4b\u652f\u6301\u7b54\u6848\u7684\u53e5\u5b50\u3002", "why_notable": "\u8868\u660e\u5c0f\u578b\u7f16\u7801\u5668\u5728\u56fa\u5b9a\u9009\u9879\u4efb\u52a1\u4e0a\u53ef\u517c\u987e\u51c6\u786e\u7387\u4e0e\u4f4e\u5ef6\u8fdf\uff0c\u5e76\u8f93\u51fa\u652f\u6301\u8bc1\u636e\uff0c\u4e3a\u4e0d\u9700\u8981\u6587\u672c\u751f\u6210\u7684\u51b3\u7b56\u5e94\u7528\u63d0\u4f9b\u66ff\u4ee3\u8def\u7ebf\u3002"}, {"abstract": "Abliteration, a fine-tuning-free weight edit, removes refusal from open-weight large language models (LLMs). The developer of Arbitrary-Rank Ablation (ARA), an optimisation-based variant, reports that direction-based abliteration, which ablates a refusal direction, increasingly fails on newer models. On five release pairs, refusal removal did not become uniformly harder. Qwen2.5-32B and Qwen3.8-27B, Gemma-2-27B and Gemma-4-31B, OLMo-2-32B and Olmo-3.1-32B, Mistral-Small-2409 and Mistral-Small-3.2, and Qwen2.5-7B and Qwen3.5-4B were edited in Heretic 2.0 by three or four direction-based methods (difference-in-means, MPOA, SOM and, on the small pair, J-space) and ARA under the same prompts, nominal search budget, first-token KL divergence cap and selection rule; removal counted as harder when the automatic WildGuard judge found more of 972 held-out harmful prompts (JailbreakBench, XSTest, StrongREJECT, HarmBench and an author-compiled malicious-code bank) still refused. After direction-based removal, newer releases retained -1 to +37 percentage points more refusal, and after ARA -26 to +34. With run-to-run variance included, between-pair heterogeneity of the direction-based effect ranged from high to low with the scale and variance model (I^2 20-80%). ARA lost less effectiveness than direction-based methods in Gemma and OLMo and more in Qwen; each verdict rests on one ARA run, and some changed with the divergence budget or variance model. In Gemma the direction-based increase came from the malicious-code bank and reversed on public sets. Contrary to prediction, keyword counts at the tool\u0027s window did not undercount judged refusal on average, but differed by a mean 7 points per model. Audits of a single pair, method or prompt source can reach opposite conclusions. Whether a newer model resisted removal depended on the release pair, method and budget, not on generation alone.", "arxiv_id": "2611.17846", "arxiv_url": "https://arxiv.org/abs/2611.17846", "authors": ["Richard J. Young"], "brief": "\u7814\u7a76\u5728Heretic 2.0\u4e2d\u5bf9\u4e94\u7ec4\u65b0\u65e7\u6a21\u578b\u5b9e\u65bd\u65b9\u5411\u6d88\u878d\u4e0eARA\u6743\u91cd\u7f16\u8f91\uff0c\u7edf\u4e00\u63d0\u793a\u3001\u641c\u7d22\u9884\u7b97\u548c\u6563\u5ea6\u7ea6\u675f\uff0c\u4ee5\u6709\u5bb3\u63d0\u793a\u4e0a\u7684\u6b8b\u7559\u62d2\u7b54\u7387\u6bd4\u8f83\u79fb\u9664\u96be\u5ea6\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17846", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["WildGuard\u8bc4\u5224972\u6761\u7559\u51fa\u6709\u5bb3\u63d0\u793a\u7684\u6b8b\u7559\u62d2\u7b54\u3002", "\u65b0\u7248\u62d2\u7b54\u7387\u53d8\u5316\uff1a\u65b9\u5411\u6cd5\u22121\u81f3+37\uff0cARA\u221226\u81f3+34\u4e2a\u767e\u5206\u70b9\u3002", "Gemma\u65b9\u5411\u6d88\u878d\u7684\u96be\u5ea6\u589e\u5e45\u5728\u516c\u5171\u63d0\u793a\u96c6\u4e0a\u53cd\u8f6c\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5b89\u5168", "\u6743\u91cd\u7f16\u8f91", "\u62d2\u7b54\u673a\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17846v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Is Abliteration Getting Harder? Not Uniformly: Refusal Removal by Direction-Based Ablation and ARA in Heretic on the Qwen3.8, Gemma 4, Olmo 3.1 and Mistral Small 3.2 LLMs Versus Their Predecessors", "tldr": "\u4e94\u7ec4\u6a21\u578b\u5bf9\u6bd4\u663e\u793a\uff0c\u62d2\u7b54\u79fb\u9664\u96be\u5ea6\u5e76\u672a\u968f\u7248\u672c\u5347\u7ea7\u7edf\u4e00\u589e\u52a0\uff0c\u800c\u53d6\u51b3\u4e8e\u65b9\u6cd5\u4e0e\u9884\u7b97\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u5728Heretic 2.0\u4e2d\u5bf9\u4e94\u7ec4\u65b0\u65e7\u6a21\u578b\u5b9e\u65bd\u65b9\u5411\u6d88\u878d\u4e0eARA\u6743\u91cd\u7f16\u8f91\uff0c\u7edf\u4e00\u63d0\u793a\u3001\u641c\u7d22\u9884\u7b97\u548c\u6563\u5ea6\u7ea6\u675f\uff0c\u4ee5\u6709\u5bb3\u63d0\u793a\u4e0a\u7684\u6b8b\u7559\u62d2\u7b54\u7387\u6bd4\u8f83\u79fb\u9664\u96be\u5ea6\u3002", "why_notable": "\u7ed3\u679c\u6311\u6218\u65b0\u7248\u6a21\u578b\u66f4\u96be\u79fb\u9664\u62d2\u7b54\u7684\u7b3c\u7edf\u5224\u65ad\uff0c\u8bf4\u660e\u5b89\u5168\u5ba1\u8ba1\u9700\u8de8\u6a21\u578b\u3001\u65b9\u6cd5\u548c\u63d0\u793a\u6765\u6e90\u6bd4\u8f83\uff0c\u9884\u7b97\u53d8\u5316\u4e5f\u53ef\u80fd\u6539\u53d8\u7ed3\u8bba\u3002"}, {"abstract": "Evaluating grammatical knowledge in language models requires benchmarks that cover diverse linguistic phenomena and are validated against human judgments. We introduce BLiMP-RO, a Romanian minimal-pair benchmark covering 50 grammatical phenomena across ten domains. It comprises 493 linguist-constructed sentence pairs, evaluated by native speakers in five experiments, and 5,942 additional semi-automatically generated, human-validated pairs. We further investigate grammatical generalization under limited linguistic input by training GPT-2 and GPT-BERT models from scratch on Romanian BabyBabelLM data and a newly collected corpus of 10 million words from child-targeted video captions. Increasing caption training data yields approximately 9 percentage points of accuracy improvement per tenfold increase in corpus size. At matched data sizes, BabyBabelLM generally outperforms video captions, while GPT-BERT consistently outperforms GPT-2. Our findings highlight how training data quantity, composition, and model architecture shape grammatical generalization in Romanian.", "arxiv_id": "2611.17836", "arxiv_url": "https://arxiv.org/abs/2611.17836", "authors": ["Radu-Stefan Popa", "Valentin Feroiu", "Adina Camelia Bleotu", "Sergiu Nisioi"], "brief": "\u6784\u5efa\u8986\u76d6\u7f57\u9a6c\u5c3c\u4e9a\u8bed\u591a\u7c7b\u8bed\u6cd5\u73b0\u8c61\u3001\u7ecf\u6bcd\u8bed\u8005\u9a8c\u8bc1\u7684\u6700\u5c0f\u53e5\u5bf9\u57fa\u51c6\uff0c\u5e76\u4ece\u96f6\u8bad\u7ec3GPT-2\u4e0eGPT-BERT\uff0c\u6bd4\u8f83\u6709\u9650\u8f93\u5165\u4e0b\u7684\u6570\u636e\u4e0e\u67b6\u6784\u6548\u5e94\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17836", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d610\u4e2a\u9886\u57df\u300150\u79cd\u8bed\u6cd5\u73b0\u8c61\uff0c\u51716435\u4e2a\u53e5\u5bf9", "\u65b0\u589e1000\u4e07\u8bcd\u513f\u7ae5\u89c6\u9891\u5b57\u5e55\u8bed\u6599\uff0c\u6570\u636e\u6bcf\u589e\u5341\u500d\u51c6\u786e\u7387\u7ea6\u53479\u4e2a\u767e\u5206\u70b9", "\u540c\u89c4\u6a21\u4e0bBabyBabelLM\u901a\u5e38\u66f4\u4f18\uff0cGPT-BERT\u6301\u7eed\u4f18\u4e8eGPT-2"], "keywords": ["\u8bed\u6cd5\u8bc4\u6d4b", "\u6700\u5c0f\u53e5\u5bf9", "\u8bed\u8a00\u6a21\u578b", "\u4f4e\u8d44\u6e90\u8bed\u8a00"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17836v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "BLiMP-RO: A Benchmark of Linguistic Minimal Pairs for Romanian", "tldr": "\u7f57\u9a6c\u5c3c\u4e9a\u8bed\u6700\u5c0f\u5bf9\u57fa\u51c6\u63ed\u793a\u6570\u636e\u89c4\u6a21\u3001\u6765\u6e90\u4e0e\u67b6\u6784\u5bf9\u8bed\u6cd5\u6cdb\u5316\u7684\u5f71\u54cd", "upvotes": 0, "what_it_is": "\u6784\u5efa\u8986\u76d6\u7f57\u9a6c\u5c3c\u4e9a\u8bed\u591a\u7c7b\u8bed\u6cd5\u73b0\u8c61\u3001\u7ecf\u6bcd\u8bed\u8005\u9a8c\u8bc1\u7684\u6700\u5c0f\u53e5\u5bf9\u57fa\u51c6\uff0c\u5e76\u4ece\u96f6\u8bad\u7ec3GPT-2\u4e0eGPT-BERT\uff0c\u6bd4\u8f83\u6709\u9650\u8f93\u5165\u4e0b\u7684\u6570\u636e\u4e0e\u67b6\u6784\u6548\u5e94\u3002", "why_notable": "\u4e3a\u7f57\u9a6c\u5c3c\u4e9a\u8bed\u63d0\u4f9b\u7ecf\u4eba\u5de5\u9a8c\u8bc1\u7684\u7ec6\u7c92\u5ea6\u8bed\u6cd5\u8bc4\u6d4b\uff0c\u5e76\u7528\u53d7\u63a7\u8bad\u7ec3\u6bd4\u8f83\u6570\u636e\u91cf\u3001\u8bed\u6599\u6765\u6e90\u4e0e\u6a21\u578b\u67b6\u6784\u7684\u4f5c\u7528\u3002"}, {"abstract": "In retrieval-augmented generation (RAG), query rewriting serves as a core interface that aligns user intent with external knowledge bases, and its effectiveness directly determines overall system performance. However, generative retrieval faces three critical challenges in real-world deployment: noisy retrieval feedback, the difficulty of jointly optimizing discrete prompt templates and continuous decoding-control parameters, and the limited generalization of static rewriting strategies under semantically complex scenarios. To address these issues, we propose RAG-FGO, a dynamic optimization framework for generative retrieval strategies. RAG-FGO formulates query rewriting as a non-differentiable black-box optimization problem in a mixed discrete-continuous space, and represents prompt templates and decoding parameters as adaptively optimizable query-rewriting agents. The framework performs global search to enable semantic jumps and structural reorganization that escape local optima, while applying local perturbations for fine-grained alignment and precise refinement. In addition, RAG-FGO introduces an elite-preserving memory pool that accumulates high-quality strategies across iterations, thereby mitigating the impact of stochasticity and noisy feedback on optimization stability. Experimental results on a diverse suite of benchmarks demonstrate the effectiveness and robustness of the proposed method, supporting its applicability to complex semantic retrieval tasks.", "arxiv_id": "2611.17788", "arxiv_url": "https://arxiv.org/abs/2611.17788", "authors": ["Qigan Sun", "Xudong Wang", "Chaoning Zhang", "Chenghao Li", "Jiaquan Zhang", "Jiehui Xie", "Sungyoung Lee", "Jie Zou", "Ning Xie", "Peng Wang", "Yang Yang", "Heng Tao Shen"], "brief": "RAG-FGO\u5c06\u67e5\u8be2\u6539\u5199\u5efa\u6a21\u4e3a\u79bb\u6563\u4e0e\u8fde\u7eed\u6df7\u5408\u7a7a\u95f4\u4e2d\u7684\u9ed1\u76d2\u4f18\u5316\uff0c\u8054\u5408\u8c03\u6574\u63d0\u793a\u6a21\u677f\u548c\u89e3\u7801\u53c2\u6570\uff0c\u5e76\u7528\u5168\u5c40\u641c\u7d22\u3001\u5c40\u90e8\u6270\u52a8\u53ca\u8bb0\u5fc6\u6c60\u8fed\u4ee3\u6539\u8fdb\u7b56\u7565\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17788", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u9ed1\u76d2\u4f18\u5316\u8054\u5408\u641c\u7d22\u79bb\u6563\u63d0\u793a\u6a21\u677f\u4e0e\u8fde\u7eed\u89e3\u7801\u53c2\u6570", "\u5168\u5c40\u641c\u7d22\u8df3\u51fa\u5c40\u90e8\u6700\u4f18\uff0c\u5c40\u90e8\u6270\u52a8\u7cbe\u7ec6\u8c03\u6574", "\u7cbe\u82f1\u4fdd\u7559\u8bb0\u5fc6\u6c60\u79ef\u7d2f\u4f18\u8d28\u7b56\u7565\uff0c\u7f13\u89e3\u53cd\u9988\u566a\u58f0"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u67e5\u8be2\u6539\u5199", "\u9ed1\u76d2\u4f18\u5316", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17788v1", "published_at": "2026-11-13", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "RAG-FGO: Dynamic Optimization of Query-Rewriting Agents for Generative RAG", "tldr": "\u901a\u8fc7\u5168\u5c40\u641c\u7d22\u4e0e\u5c40\u90e8\u6270\u52a8\u52a8\u6001\u4f18\u5316\u67e5\u8be2\u6539\u5199\u667a\u80fd\u4f53\uff0c\u63d0\u5347\u751f\u6210\u5f0f\u68c0\u7d22\u7684\u6548\u679c\u4e0e\u7a33\u5b9a\u6027\u3002", "upvotes": 0, "what_it_is": "RAG-FGO\u5c06\u67e5\u8be2\u6539\u5199\u5efa\u6a21\u4e3a\u79bb\u6563\u4e0e\u8fde\u7eed\u6df7\u5408\u7a7a\u95f4\u4e2d\u7684\u9ed1\u76d2\u4f18\u5316\uff0c\u8054\u5408\u8c03\u6574\u63d0\u793a\u6a21\u677f\u548c\u89e3\u7801\u53c2\u6570\uff0c\u5e76\u7528\u5168\u5c40\u641c\u7d22\u3001\u5c40\u90e8\u6270\u52a8\u53ca\u8bb0\u5fc6\u6c60\u8fed\u4ee3\u6539\u8fdb\u7b56\u7565\u3002", "why_notable": "\u628a\u67e5\u8be2\u6539\u5199\u4ece\u9759\u6001\u89c4\u5219\u8f6c\u4e3a\u53ef\u8fed\u4ee3\u4f18\u5316\u7684\u7b56\u7565\uff0c\u517c\u987e\u6df7\u5408\u53c2\u6570\u641c\u7d22\u4e0e\u566a\u58f0\u9c81\u68d2\u6027\uff0c\u4e3a\u590d\u6742\u8bed\u4e49\u68c0\u7d22\u63d0\u4f9b\u5b9e\u7528\u4f18\u5316\u8def\u5f84\u3002"}, {"abstract": "Typhoon is an audiovisual installation based on Joseph Conrad\u0027s novella, in which Captain MacWhirr steers the steamer Nan-Shan directly into and through a catastrophic storm. The novella is a study of what happens when the scale of a phenomenon exceeds the practical and conceptual frameworks available to comprehend it and of the paralysis that sometimes follows a demand for action in such overwhelming circumstances. We chose the text of Typhoon to reflect on human culture\u0027s current AI moment. We prompt a large language model, seeded with Conrad\u0027s original language, to feed endlessly on its own output, and explore when and how the text becomes increasingly alien and unwieldy as time progresses, including deviations from the narrative, digressions into the model\u0027s own instructions and thinking, and long periods of incoherent rumination. We employ methods from activation steering, including a novel adaptive steering method we introduce, to control the rhythm of the narrative and the model\u0027s digressions over long stretches of generation. The simultaneous efficacy and unpredictability of this steering showcases the tension between the perceived interpretability of AI, and the reality of a system that remains outside our comprehension and control.", "arxiv_id": "2611.17768", "arxiv_url": "https://arxiv.org/abs/2611.17768", "authors": ["Megan Wei", "Damon Pham", "John Cayley", "Ellie Pavlick"], "brief": "\u4f5c\u54c1\u4ee5\u5eb7\u62c9\u5fb7\u5c0f\u8bf4\u4e3a\u79cd\u5b50\uff0c\u8ba9\u8bed\u8a00\u6a21\u578b\u6301\u7eed\u56de\u9988\u81ea\u8eab\u8f93\u51fa\uff0c\u5f62\u6210\u89c6\u542c\u88c5\u7f6e\u3002\u7814\u7a76\u91c7\u7528\u6fc0\u6d3b\u5f15\u5bfc\u53ca\u65b0\u63d0\u51fa\u7684\u81ea\u9002\u5e94\u65b9\u6cd5\uff0c\u8c03\u8282\u957f\u7a0b\u751f\u6210\u4e2d\u7684\u53d9\u4e8b\u8282\u594f\u4e0e\u79bb\u9898\u884c\u4e3a\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17768", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": ["\u4ee5\u5eb7\u62c9\u5fb7\u539f\u6587\u4e3a\u79cd\u5b50\uff0c\u5faa\u73af\u8f93\u5165\u6a21\u578b\u81ea\u8eab\u8f93\u51fa", "\u5f15\u5165\u81ea\u9002\u5e94\u6fc0\u6d3b\u5f15\u5bfc\uff0c\u8c03\u63a7\u957f\u7a0b\u53d9\u4e8b\u4e0e\u79bb\u9898", "\u89c2\u5bdf\u53d9\u4e8b\u504f\u79bb\u3001\u6307\u4ee4\u6cc4\u9732\u5f0f\u6587\u672c\u53ca\u4e0d\u8fde\u8d2f\u6c89\u601d"], "keywords": ["\u6fc0\u6d3b\u5f15\u5bfc", "\u8bed\u8a00\u6a21\u578b", "\u751f\u6210\u827a\u672f", "\u957f\u6587\u672c\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17768v1", "published_at": "2026-11-13", "score": 0.125, "selected_reasons": [], "thumbnail": null, "title": "Activation Steering the Nan-Shan in Typhoon", "tldr": "\u901a\u8fc7\u81ea\u9002\u5e94\u6fc0\u6d3b\u5f15\u5bfc\u8c03\u63a7\u8bed\u8a00\u6a21\u578b\u7684\u5faa\u73af\u751f\u6210\uff0c\u63a2\u7d22\u53d9\u4e8b\u5931\u63a7\u4e0e\u53ef\u63a7\u6027\u7684\u8fb9\u754c\u3002", "upvotes": 0, "what_it_is": "\u4f5c\u54c1\u4ee5\u5eb7\u62c9\u5fb7\u5c0f\u8bf4\u4e3a\u79cd\u5b50\uff0c\u8ba9\u8bed\u8a00\u6a21\u578b\u6301\u7eed\u56de\u9988\u81ea\u8eab\u8f93\u51fa\uff0c\u5f62\u6210\u89c6\u542c\u88c5\u7f6e\u3002\u7814\u7a76\u91c7\u7528\u6fc0\u6d3b\u5f15\u5bfc\u53ca\u65b0\u63d0\u51fa\u7684\u81ea\u9002\u5e94\u65b9\u6cd5\uff0c\u8c03\u8282\u957f\u7a0b\u751f\u6210\u4e2d\u7684\u53d9\u4e8b\u8282\u594f\u4e0e\u79bb\u9898\u884c\u4e3a\u3002", "why_notable": "\u5c06\u6a21\u578b\u5185\u90e8\u5e72\u9884\u7528\u4e8e\u751f\u6210\u827a\u672f\uff0c\u5448\u73b0\u957f\u7a0b\u6587\u672c\u8c03\u63a7\u7684\u6709\u6548\u6027\u4e0e\u4e0d\u53ef\u9884\u6d4b\u6027\uff0c\u4e3a\u5ba1\u89c6\u4eba\u5de5\u667a\u80fd\u53ef\u89e3\u91ca\u6027\u548c\u63a7\u5236\u8fb9\u754c\u63d0\u4f9b\u72ec\u7279\u6848\u4f8b\u3002"}, {"abstract": "Running large language models (LLMs) on local devices keeps data private, removes per-token cost, cuts network latency, and keeps working without a connection. Two shifts now strain how such models are served. On one device, several agents share a locally served model with an interactive user. Across devices, a developer or small team often owns several capable machines from different vendors, which sit idle most of the day because every local server serves one runtime on one machine. We present Superfluid, an open-source LLM server built for local inference at both scales. On one device, Superfluid drives llama.cpp, MLX, or BaseRT in isolated worker processes through one scheduler that moves interactive requests ahead of agent work, computes a prompt shared by many requests once, and writes every token to a durable log before it reaches the client. Across devices, one Superfluid server turns a fleet of machines into a single API endpoint. Machines with different hardware serve copies of the same model, receive work according to their measured speed, and can join or fail under load without losing a request. For Qwen3.8-27B on an Apple M5 Pro, a chat sent while eight agents are working receives its first token in 1.5 s, against 291-612 s on llama-server, Ollama, and mlx_lm.server. On six machines from three chip vendors serving 64 simulated users for one hour, Superfluid answers all 5,041 requests while machines join one at a time and one is killed and rejoins; throughput grows from 112 to 534 tok/s and the median first-token time falls from 99 to 12 s. On twelve Mac Studio M3 Ultras it sustains 10,656 tok/s across 38,563 requests from 384 agents without a failure. Superfluid is available under the Apache-2.0 licence at https://github.com/basecompute/superfluid.", "arxiv_id": "2611.17753", "arxiv_url": "https://arxiv.org/abs/2611.17753", "authors": ["Prabod Rathnayaka", "Isura Manchanayake", "Srikandabala Kogul", "Steve Siu", "Fabian Waschkowski", "Lukas Wesemann"], "brief": "Superfluid\u4ee5\u7edf\u4e00\u8c03\u5ea6\u6574\u5408\u672c\u5730\u4e0e\u8de8\u8bbe\u5907\u5927\u6a21\u578b\u63a8\u7406\uff0c\u4f18\u5148\u54cd\u5e94\u4ea4\u4e92\u8bf7\u6c42\u3002\u5b9e\u9a8c\u663e\u8457\u964d\u4f4e\u9996\u4ee4\u724c\u5ef6\u8fdf\u3001\u63d0\u5347\u541e\u5410\uff0c\u5e76\u5728\u8bbe\u5907\u52a8\u6001\u52a0\u5165\u4e0e\u6545\u969c\u65f6\u4fdd\u6301\u8bf7\u6c42\u4e0d\u4e22\u5931\u3002", "categories": ["cs.DC", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.17753", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5e03\u5f0f\u63a8\u7406", "\u672c\u5730\u90e8\u7f72", "\u8bf7\u6c42\u8c03\u5ea6", "\u5bb9\u9519"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.17753v1", "published_at": "2026-11-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Superfluid: Local AI Server for Distributed LLM Inference", "tldr": "Superfluid\u4ee5\u7edf\u4e00\u8c03\u5ea6\u6574\u5408\u672c\u5730\u4e0e\u8de8\u8bbe\u5907\u5927\u6a21\u578b\u63a8\u7406\uff0c\u4f18\u5148\u54cd\u5e94\u4ea4\u4e92\u8bf7\u6c42\u3002\u5b9e\u9a8c\u663e\u8457\u964d\u4f4e\u9996\u4ee4\u724c\u5ef6\u8fdf\u3001\u63d0\u5347\u541e\u5410\uff0c\u5e76\u5728\u8bbe\u5907\u52a8\u6001\u52a0\u5165\u4e0e\u6545\u969c\u65f6\u4fdd\u6301\u8bf7\u6c42\u4e0d\u4e22\u5931\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-supervised speech models (S3Ms) have been scaled up to thousands of languages and millions of hours of audio, yet little is known about how these models structure semantic knowledge across languages. In this work, we probe sentence-level semantics in massively multilingual S3Ms across 76 languages, using linear maps from frozen speech representations into a frozen text embedding space, evaluated by cross-modal retrieval. Sentence meaning is linearly accessible but highly uneven across languages and resource tiers. Cross-lingual probes can match language-specific probes on languages never seen in probe training, but per-model monolingual decodability does not predict transfer.
