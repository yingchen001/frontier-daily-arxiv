const PAPERS = [{"abstract": "Streaming audio-visual target speaker extraction (AVTSE) is essential for latency-sensitive applications. However, current causal systems face two coupled gaps. First, standard benchmarks fix the number of speakers at two and ignore the near-/far-field interference, reverberation, and sudden noise of real scenes. Second, high-performance causal architectures are too heavy for edge deployment. Lightweight alternatives try to reclaim capacity by repeatedly invoking a small separator, which offsets the savings. To address the first gap, we release RealSSA, a realistic AVTSE benchmark consisting of RealSSA-Sim and RealSSA-Real. RealSSA-Sim provides controllable simulated scenes with 1--5 dynamic near-field interfering speakers; scenes with far-field interference additionally include 10--15 far-field interfering speakers. RealSSA-Real provides a held-out real-recorded evaluation set. To address the second gap, we propose Falcon, a causal AVTSE method. Its Separator performs multi-scale time-frequency separation in a single encoder--decoder pass. We train Falcon with an encoder-space speaker contrastive loss. This loss suppresses near-field leakage at zero inference cost and transfers across backbones. Falcon achieves state-of-the-art extraction quality on RealSSA-Sim, LRS2-2Mix, LRS3-2Mix, and VoxCeleb2-2Mix. Compared with the causal AV-TFGridNet baseline, it cuts parameters by 91.9%, computation by 20.2 times, and GPU inference latency by 11.1 times. Code and demo are available at https://cslikai.cn/Falcon/.", "arxiv_id": "2610.32749", "arxiv_url": "https://arxiv.org/abs/2610.32749", "authors": ["Wendi Sang", "Kai Li", "Yifan Li", "Jianqiang Huang", "Xiaolin Hu"], "brief": "\u8bba\u6587\u53d1\u5e03\u9762\u5411\u590d\u6742\u771f\u5b9e\u58f0\u573a\u7684\u97f3\u89c6\u9891\u76ee\u6807\u8bf4\u8bdd\u4eba\u63d0\u53d6\u57fa\u51c6 RealSSA\uff0c\u5e76\u63d0\u51fa\u8f7b\u91cf\u56e0\u679c\u6a21\u578b Falcon\u3002\u6a21\u578b\u7ed3\u5408\u97f3\u9891\u4e udio-Visual Target Speaker Extraction for Real-World Acoustic Scenes", "tldr": "\u6784\u5efa\u771f\u5b9e\u58f0\u573a\u57fa\u51c6\uff0c\u4ee5\u8f7b\u91cf\u6d41\u5f0f\u6a21\u578b\u9ad8\u6548\u63d0\u53d6\u76ee\u6807\u8bf4\u8bdd\u4eba\u8bed\u97f3", "upvotes": 150, "what_it_is": "\u8bba\u6587\u53d1\u5e03\u9762\u5411\u590d\u6742\u771f\u5b9e\u58f0\u573a\u7684\u97f3\u89c6\u9891\u76ee\u6807\u8bf4\u8bdd\u4eba\u63d0\u53d6\u57fa\u51c6 RealSSA\uff0c\u5e76\u63d0\u51fa\u8f7b\u91cf\u56e0\u679c\u6a21\u578b Falcon\u3002\u6a21\u578b\u7ed3\u5408\u97f3\u9891\u4e0e\u89c6\u89c9\u4fe1\u606f\uff0c\u9762\u5411\u4f4e\u5ef6\u8fdf\u573a\u666f\u63d0\u53d6\u76ee\u6807\u8bf4\u8bdd\u4eba\u7684\u8bed\u97f3\u3002", "why_notable": "\u540c\u65f6\u8865\u9f50\u4f20\u7edf\u53cc\u8bf4\u8bdd\u4eba\u57fa\u51c6\u7684\u771f\u5b9e\u6027\u4e0d\u8db3\u4e0e\u9ad8\u6027\u80fd\u56e0\u679c\u6a21\u578b\u7684\u90e8\u7f72\u6210\u672c\u95ee\u9898\uff0c\u4e3a\u590d\u6742\u58f0\u573a\u4e0b\u7684\u4f4e\u5ef6\u8fdf\u97f3\u89c6\u9891\u8bed\u97f3\u63d0\u53d6\u63d0\u4f9b\u66f4\u8d34\u8fd1\u5b9e\u9645\u7684\u8bc4\u6d4b\u4e0e\u9ad8\u6548\u65b9\u6848\u3002\u9700\u6ce8\u610f\uff0c\u6458\u8981\u62a5\u544a\u7684\u5ef6\u8fdf\u4f18\u52bf\u6765\u81ea GPU \u6d4b\u8bd5\uff0c\u5e76\u975e\u8fb9\u7f18\u8bbe\u5907\u5b9e\u6d4b\u3002"}, {"abstract": "Agentic services alternate between model inference on clustered GPUs and external tools on distributed CPUs. In this scenario, existing systems (1) overlook tool-return readiness in service evaluation, wasting limited resources, and (2) use heuristic strategies to decide admission and placement on GPUs, resulting in suboptimal scheduling decisions. To bridge this gap, we present TAO, a tool-aware joint scheduling framework for LLM-based agentic serving. Its value interface combines near-term tool readiness, node-specific cache credit with time-aware decay, and token footprint; a dynamic program jointly selects and places waiting sessions under capacity constraints. Across the 12 reported model-workload-concurrency settings, TAO reduces latency by up to 26.8%, reduces mean time to first token (TTFT) by up to 36.3%, and increases decode throughput by up to 29.5% relative to the best evaluated state-of-the-art baseline for each metric.", "arxiv_id": "2610.37230", "arxiv_url": "https://arxiv.org/abs/2610.37230", "authors": ["Shuhuai Li", "Shengdong Ye", "Dongdong Ge", "Yinyu Ye", "Jianghao Lin"], "brief": "\u63d0\u51fa\u9762\u5411\u5927\u6a21\u578b\u667a\u80fd\u4f53\u670d\u52a1\u7684\u5de5\u5177\u611f\u77e5\u8054\u5408\u8c03\u5ea6\u6846\u67b6TAO\u3002\u5728GPU\u6a21\u578b\u63a8\u7406\u4e0eCPU\u5916\u90e8\u5de5\u5177\u4ea4\u66ff\u6267\u884c\u7684\u573a\u666f\u4e2d\uff0c\u8054\u5408\u51b3\u5b9a\u7b49\u5f85\u4f1a\u8bdd\u7684\u51c6\u5165\u4e0eGPU\u8282\u70b9\u653e\u7f6e\u3002", "categories": ["cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37230", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u7efc\u5408\u5de5\u5177\u8fd1\u671f\u8fd4\u56de\u5c31\u7eea\u7a0b\u5ea6\u3001\u5e26\u65f6\u95f4\u8870\u51cf\u7684\u8282\u70b9\u7f13\u5b58\u6536\u76ca\u548c\u4ee4\u724c\u8d44\u6e90\u5360\u7528\uff0c\u6784\u5efa\u8c03\u5ea6\u4ef7\u503c\u63a5\u53e3\u3002", "\u901a\u8fc7\u52a8\u6001\u89c4\u5212\uff0c\u5728\u5bb9\u91cf\u7ea6\u675f\u4e0b\u8054\u5408\u9009\u62e9\u7b49\u5f85\u4f1a\u8bdd\u53ca\u5176\u653e\u7f6e\u8282\u70b9\uff0c\u66ff\u4ee3\u542f\u53d1\u5f0f\u51c6\u5165\u4e0e\u653e\u7f6e\u7b56\u7565\u3002", "\u572812\u7ec4\u6a21\u578b\u3001\u5de5\u4f5c\u8d1f\u8f7d\u4e0e\u5e76\u53d1\u8bbe\u7f6e\u4e2d\uff0c\u76f8\u5bf9\u5404\u6307\u6807\u8868\u73b0\u6700\u4f73\u7684\u5df2\u8bc4\u4f30\u5148\u8fdb\u57fa\u7ebf\uff0c\u5ef6\u8fdf\u6700\u9ad8\u964d\u4f4e26.8%\uff0c\u5e73\u5747\u9996\u4ee4\u724c\u65f6\u95f4\u6700\u9ad8\u964d\u4f4e36.3%\uff0c\u89e3\u7801\u541e\u5410\u91cf\u6700\u9ad8\u63d0\u534729.5%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u63a8\u7406\u4f18\u5316", "\u8d44\u6e90\u8c03\u5ea6", "\u5206\u5e03\u5f0f\u7cfb\u7edf"], "num_comments": 4, "on_hf": true, "organization": "AIOR", "pdf_url": "https://arxiv.org/pdf/2610.37230v1", "published_at": "2026-10-27", "score": 0.237, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (18\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37230.png", "title": "TAO: Tool-Aware Joint Scheduling for LLM-Based Agentic Serving", "tldr": "TAO\u8054\u5408\u8c03\u5ea6\u5de5\u5177\u8c03\u7528\u4e0e\u6a21\u578b\u63a8\u7406\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u670d\u52a1\u6548\u7387\u3002", "upvotes": 18, "what_it_is": "\u63d0\u51fa\u9762\u5411\u5927\u6a21\u578b\u667a\u80fd\u4f53\u670d\u52a1\u7684\u5de5\u5177\u611f\u77e5\u8054\u5408\u8c03\u5ea6\u6846\u67b6TAO\u3002\u5728GPU\u6a21\u578b\u63a8\u7406\u4e0eCPU\u5916\u90e8\u5de5\u5177\u4ea4\u66ff\u6267\u884c\u7684\u573a\u666f\u4e2d\uff0c\u8054\u5408\u51b3\u5b9a\u7b49\u5f85\u4f1a\u8bdd\u7684\u51c6\u5165\u4e0eGPU\u8282\u70b9\u653e\u7f6e\u3002", "why_notable": "\u5c06\u5916\u90e8\u5de5\u5177\u8fd4\u56de\u65f6\u673a\u7eb3\u5165\u63a8\u7406\u8d44\u6e90\u8c03\u5ea6\uff0c\u5e76\u8054\u5408\u4f18\u5316\u4f1a\u8bdd\u51c6\u5165\u4e0e\u8282\u70b9\u653e\u7f6e\uff0c\u4e3a\u8de8GPU\u4e0eCPU\u8fd0\u884c\u7684\u667a\u80fd\u4f53\u670d\u52a1\u63d0\u4f9b\u4e86\u66f4\u9ad8\u6548\u7684\u8d44\u6e90\u7ba1\u7406\u65b9\u6848\u3002"}, {"abstract": "As frontier language models grow increasingly capable and autonomous, independent third-party evaluations are critical for characterizing their systemic safety risks. While closed-source releases are routinely accompanied by comprehensive system cards, open-weight models receive less scrutiny regarding frontier risks. To address this gap, we present an independent safety evaluation of DeepSeek V4.1 Flash-1017, the latest version of V4.1 Flash that departs from V4 with a new architecture, scaled-up training, and strong agentic capabilities. Drawing on the EU General-Purpose AI Code of Practice, we evaluate the model across 34 benchmarks, including 5 in-house suites, spanning evaluation integrity, loss of control, and harmful manipulation. Conforming to the AEF-1 standard, we compare V4.1 Flash-1017 against V4.1 Flash, earlier DeepSeek V4 models, and leading closed-source systems (GPT-6 Astra, GPT-5.6 Sol, and Gemini 3.8 Flash). Overall, V4.1 Flash-1017 shows substantial safety improvements over the V4 generation and approaches or matches leading closed-source baselines on several dimensions, while still exhibiting notable behaviors that warrant continued attention. Building on our findings, we highlight three key observations and recommendations. First, because safety can shift and even regress across minor updates, developers should integrate safety evaluation into incremental releases. Second, as final-turn outputs and end-state checks alone cannot reliably detect loss-of-control behaviors, deployments require process-level observability across both reasoning traces and action logs. Third, because public benchmarks elicit strong evaluation awareness and face data contamination risks, developing private benchmarks is essential for trustworthy frontier evaluation.", "arxiv_id": "2610.35671", "arxiv_url": "https://arxiv.org/abs/2610.35671", "authors": ["Yao Huang", "Zhiyuan Zeng", "Yu Wang", "Zhitong Zhu", "Dingcheng Duan", "Hao Li", "Shangzhi Xu", "Yifan Wang", "Jinzhe Tu", "Shukun Xiong", "Yihe Zang", "Han Yan", "Hongchang Yang", "Fuyu Gu", "Wei Xu", "Yinpeng Dong", "Xiaojian Li"], "brief": "\u5bf9DeepSeek V4.1 Flash-1017\u5f00\u5c55\u72ec\u7acb\u5b89\u5168\u8bc4\u4f30\uff0c\u8986\u76d6\u8bc4\u4f30\u5b8c\u6574\u6027\u3001\u5931\u63a7\u548c\u6709\u5bb3\u64cd\u7eb5\u98ce\u9669\uff0c\u5e76\u4e0e\u6b64\u524d\u7248\u672c\u53ca\u9886\u5148\u95ed\u6e90\u6a21\u578b\u6bd4\u8f83\u3002\u7ed3\u679c\u663e\u793a\u5176\u5b89\u5168\u6027\u6574\u4f53\u63d0\u5347\uff0c\u4f46\u4ecd\u5b58\u5728\u503c\u5f97\u6301\u7eed\u76d1\u6d4b\u7684\u884c\u4e3a\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.35671", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u4f9d\u636e\u6b27\u76df\u901a\u7528\u4eba\u5de5\u667a\u80fd\u5b9e\u8df5\u51c6\u5219\uff0c\u9075\u5faaAEF-1\u6807\u51c6\uff0c\u4f7f\u752834\u9879\u57fa\u51c6\uff0c\u5176\u4e2d\u5305\u542b5\u5957\u81ea\u5efa\u8bc4\u6d4b\u3002", "\u76f8\u8f83V4\u7cfb\u5217\uff0c\u53d7\u8bc4\u6a21\u578b\u7684\u5b89\u5168\u6027\u660e\u663e\u6539\u5584\uff0c\u5728\u82e5\u5e72\u7ef4\u5ea6\u63a5\u8fd1\u6216\u8fbe\u5230\u9886\u5148\u95ed\u6e90\u6a21\u578b\u6c34\u5e73\uff1b\u4f46\u5c0f\u7248\u672c\u66f4\u65b0\u4ecd\u53ef\u80fd\u5e26\u6765\u5b89\u5168\u9000\u6b65\u3002", "\u4ec5\u68c0\u67e5\u6700\u7ec8\u8f93\u51fa\u4e0e\u7ec8\u6001\u4e0d\u8db3\u4ee5\u53ef\u9760\u8bc6\u522b\u5931\u63a7\u884c\u4e3a\uff0c\u9700\u8981\u8054\u5408\u89c2\u6d4b\u63a8\u7406\u8f68\u8ff9\u548c\u884c\u52a8\u65e5\u5fd7\uff1b\u516c\u5f00\u57fa\u51c6\u8fd8\u9762\u4e34\u8bc4\u6d4b\u610f\u8bc6\u4e0e\u6570\u636e\u6c61\u67d3\u98ce\u9669\u3002"], "keywords": ["\u4eba\u5de5\u667a\u80fd\u5b89\u5168", "\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Fangcun AI", "pdf_url": "https://arxiv.org/pdf/2610.35671v1", "published_at": "2026-10-26", "score": 0.193, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35671.png", "title": "Evaluating DeepSeek V4.1 Flash-1017 for loss of control and harmful manipulation risks", "tldr": "\u72ec\u7acb\u8bc4\u4f30DeepSeek\u65b0\u7248\u672c\u7684\u5931\u63a7\u4e0e\u6709\u5bb3\u64cd\u7eb5\u98ce\u9669", "upvotes": 3, "what_it_is": "\u5bf9DeepSeek V4.1 Flash-1017\u5f00\u5c55\u72ec\u7acb\u5b89\u5168\u8bc4\u4f30\uff0c\u8986\u76d6\u8bc4\u4f30\u5b8c\u6574\u6027\u3001\u5931\u63a7\u548c\u6709\u5bb3\u64cd\u7eb5\u98ce\u9669\uff0c\u5e76\u4e0e\u6b64\u524d\u7248\u672c\u53ca\u9886\u5148\u95ed\u6e90\u6a21\u578b\u6bd4\u8f83\u3002\u7ed3\u679c\u663e\u793a\u5176\u5b89\u5168\u6027\u6574\u4f53\u63d0\u5347\uff0c\u4f46\u4ecd\u5b58\u5728\u503c\u5f97\u6301\u7eed\u76d1\u6d4b\u7684\u884c\u4e3a\u3002", "why_notable": "\u8865\u5145\u4e86\u5f00\u653e\u6743\u91cd\u6a21\u578b\u5728\u524d\u6cbf\u5b89\u5168\u98ce\u9669\u4e0a\u7684\u7b2c\u4e09\u65b9\u8bc4\u4f30\uff0c\u5e76\u63d0\u51fa\u6301\u7eed\u8bc4\u6d4b\u3001\u8fc7\u7a0b\u7ea7\u76d1\u6d4b\u548c\u79c1\u6709\u57fa\u51c6\u7b49\u90e8\u7f72\u5efa\u8bae\u3002\u6458\u8981\u672a\u63d0\u4f9b\u5177\u4f53\u5206\u6570\uff0c\u5c1a\u4e0d\u80fd\u636e\u6b64\u5224\u65ad\u5404\u7c7b\u98ce\u9669\u7684\u7edd\u5bf9\u6c34\u5e73\u3002"}, {"abstract": "Existing code reveals past implementation decisions but rarely explains the reasoning behind them. When coding agents implement new features or modify existing functionality, past decisions may conflict with new task instructions. This raises a fundamental question for agentic software evolution: when multiple implementations satisfy the same functional requirements, how do coding agents decide whether to follow existing code or new task instructions? We investigate this question through bidirectional, controlled experiments in purpose-built repositories, followed by validation in real-world open-source repositories. Our approach isolates three competing sources of guidance: (1) agents\u0027 default preferences, (2) repository precedents, and (3) explicit task instructions. We conduct 5,625 trials across four coding agents and six implementation pairs, with validation in four open-source repositories spanning three programming languages. We find that agents share the same default implementation choices, yet overwhelmingly follow repository precedent when it conflicts with those defaults (359/360 trials). Crucially, not all precedents carry equal influence: three supporting local files yield 96% adoption, compared with only 4% for sibling-resource files, and changing file placement alone can shift adoption from 0% to 100% at a fixed example count. When new task intent conflicts with existing code, written priority rules achieve substantially higher success than code examples alone (59/60 versus 38/60 joint successes for two agents on two implementation pairs). The effectiveness of explicit rules also extends to open-source repositories, where a harness-loaded rule raises joint success from 0/120 to 117/120. These findings motivate design-decision traceability that preserves not only implementation choices but also the rationale and priorities that should guide future changes.", "arxiv_id": "2610.38244", "arxiv_url": "https://arxiv.org/abs/2610.38244", "authors": ["Haichao Zhu", "Geyang Xu", "Zhaorui Yang", "Jiyuan Wang", "Qian Zhang"], "brief": "\u901a\u8fc7\u53d7\u63a7\u5b9e\u9a8c\u4e0e\u771f\u5b9e\u5f00\u6e90\u4ed3\u5e93\u9a8c\u8bc1\uff0c\u7814\u7a76\u7f16\u7801\u667a\u80fd\u4f53\u5728\u9ed8\u8ba4\u504f\u597d\u3001\u4ed3\u5e93\u65e2\u6709\u5b9e\u73b0\u4e0e\u65b0\u4efb\u52a1\u6307\u4ee4\u4e4b\u95f4\u5982\u4f55\u53d6\u820d\u3002\u8bba\u6587\u63ed\u793a\u4ee3\u7801\u5148\u4f8b\u7684\u4f4d\u7f6e\u4f1a\u663e\u8457\u5f71\u54cd\u9009\u62e9\uff0c\u5e76\u9a8c\u8bc1\u663e\u5f0f\u4f18\u5148\u7ea7\u89c4\u5219\u80fd\u5e2e\u52a9\u667a\u80fd\u4f53\u9075\u5faa\u65b0\u4efb\u52a1\u610f\u56fe\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38244", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5b9e\u9a8c\u89c4\u6a21\uff1a\u9488\u5bf94\u4e2a\u7f16\u7801\u667a\u80fd\u4f53\u30016\u7ec4\u5b9e\u73b0\u65b9\u6848\u5f00\u5c555,625\u6b21\u8bd5\u9a8c\uff0c\u5e76\u5728\u8986\u76d63\u79cd\u7f16\u7a0b\u8bed\u8a00\u76844\u4e2a\u5f00\u6e90\u4ed3\u5e93\u4e2d\u9a8c\u8bc1\u3002", "\u4ed3\u5e93\u5148\u4f8b\u538b\u5012\u9ed8\u8ba4\u504f\u597d\uff1a360\u6b21\u51b2\u7a81\u8bd5\u9a8c\u4e2d\u6709359\u6b21\u9075\u5faa\u65e2\u6709\u5b9e\u73b0\uff1b3\u4e2a\u672c\u5730\u652f\u6301\u6587\u4ef6\u5e26\u676596%\u7684\u91c7\u7eb3\u7387\uff0c\u540c\u7ea7\u8d44\u6e90\u6587\u4ef6\u4ec5\u4e3a4%\uff0c\u4ec5\u6539\u53d8\u6587\u4ef6\u4f4d\u7f6e\u5373\u53ef\u4f7f\u91c7\u7eb3\u7387\u4ece0%\u53d8\u4e3a100%\u3002", "\u663e\u5f0f\u4f18\u5148\u7ea7\u89c4\u5219\u4f18\u4e8e\u5355\u7eaf\u4ee3\u7801\u793a\u4f8b\uff1a\u4e24\u4e2a\u667a\u80fd\u4f53\u5728\u4e24\u7ec4\u5b9e\u73b0\u65b9\u6848\u4e0a\u7684\u8054\u5408\u6210\u529f\u6b21\u6570\u5206\u522b\u4e3a59/60\u4e0e38/60\uff1b\u5f00\u6e90\u4ed3\u5e93\u4e2d\uff0c\u901a\u8fc7\u8fd0\u884c\u6846\u67b6\u52a0\u8f7d\u89c4\u5219\uff0c\u5c06\u8054\u5408\u6210\u529f\u6b21\u6570\u4ece0/120\u63d0\u5347\u81f3117/120\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38244v1", "published_at": "2026-10-28", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Precedent or Intent? What Coding Agents Follow When Evolving Existing Code", "tldr": "\u7f16\u7801\u667a\u80fd\u4f53\u504f\u5411\u6cbf\u7528\u65e7\u4ee3\u7801\uff0c\u663e\u5f0f\u4f18\u5148\u7ea7\u89c4\u5219\u53ef\u7ea0\u504f", "upvotes": 0, "what_it_is": "\u901a\u8fc7\u53d7\u63a7\u5b9e\u9a8c\u4e0e\u771f\u5b9e\u5f00\u6e90\u4ed3\u5e93\u9a8c\u8bc1\uff0c\u7814\u7a76\u7f16\u7801\u667a\u80fd\u4f53\u5728\u9ed8\u8ba4\u504f\u597d\u3001\u4ed3\u5e93\u65e2\u6709\u5b9e\u73b0\u4e0e\u65b0\u4efb\u52a1\u6307\u4ee4\u4e4b\u95f4\u5982\u4f55\u53d6\u820d\u3002\u8bba\u6587\u63ed\u793a\u4ee3\u7801\u5148\u4f8b\u7684\u4f4d\u7f6e\u4f1a\u663e\u8457\u5f71\u54cd\u9009\u62e9\uff0c\u5e76\u9a8c\u8bc1\u663e\u5f0f\u4f18\u5148\u7ea7\u89c4\u5219\u80fd\u5e2e\u52a9\u667a\u80fd\u4f53\u9075\u5faa\u65b0\u4efb\u52a1\u610f\u56fe\u3002", "why_notable": "\u91cf\u5316\u63ed\u793a\u7f16\u7801\u667a\u80fd\u4f53\u5e76\u975e\u53ea\u6309\u4efb\u52a1\u6587\u5b57\u51b3\u7b56\uff0c\u4ed3\u5e93\u7ed3\u6784\u4e0e\u5c40\u90e8\u5148\u4f8b\u4e5f\u80fd\u5f3a\u70c8\u5de6\u53f3\u884c\u4e3a\u3002\u7ed3\u679c\u4e3a\u667a\u80fd\u4f53\u6307\u4ee4\u914d\u7f6e\u548c\u4ee3\u7801\u5e93\u7ef4\u62a4\u63d0\u4f9b\u76f4\u63a5\u4f9d\u636e\uff1a\u4e0d\u4ec5\u8981\u4fdd\u7559\u5b9e\u73b0\u9009\u62e9\uff0c\u8fd8\u5e94\u8bb0\u5f55\u8bbe\u8ba1\u7406\u7531\u53ca\u53d8\u66f4\u65f6\u7684\u4f18\u5148\u7ea7\u3002"}, {"abstract": "Rubrics enable reward assignment on tasks without verifiable answers, but are expensive to manually produce from scratch. We present Rubricon, a pipeline that generates discriminative rubrics without requiring human preference labels, rubric annotation, or generator-model training. Using any LLM, Rubricon samples multiple rubrics, selects the most discriminative candidate, adds criteria to capture overlooked requirements or response flaws, and prunes criteria that are misaligned or shallow. Alongside LLM self-critique and test-time scaling, Rubricon uses observed criterion pass rates on example model responses to guide refinement. Across five professional, consumer, clinical, and general-use LLM benchmarks, Rubricon produces rubrics whose scores of frontier LLM responses exhibit 9% greater alignment with labor-intensive expert-authored rubrics, compared to the best alternative synthetic rubric generation method among RRD, QSRG, OpenRubrics, and agentic generation via harnesses like Codex. On HealthBench, post-training a Qwen3.5-9B model with Rubricon rubrics yields 4.5% better performance than training with rubrics from the strongest alternative synthetic rubric generator, RRD.", "arxiv_id": "2610.38220", "arxiv_url": "https://arxiv.org/abs/2610.38220", "authors": ["Ulyana Tkachenko", "Hui Wen Goh", "Guram Gogia", "Jonas Mueller"], "brief": "\u63d0\u51fa Rubricon \u81ea\u52a8\u8bc4\u5206\u51c6\u5219\u751f\u6210\u4e0e\u4f18\u5316\u6d41\u6c34\u7ebf\uff0c\u4e3a\u7b54\u6848\u65e0\u6cd5\u76f4\u63a5\u9a8c\u8bc1\u7684\u4efb\u52a1\u63d0\u4f9b\u5956\u52b1\u4f9d\u636e\u3002\u65e0\u9700\u4eba\u5de5\u504f\u597d\u6807\u7b7e\u3001\u51c6\u5219\u6807\u6ce8\u6216\u8bad\u7ec3\u751f\u6210\u6a21\u578b\uff0c\u5373\u53ef\u501f\u52a9\u5927\u8bed\u8a00\u6a21\u578b\u751f\u6210\u5e76\u8fed\u4ee3\u4f18\u5316\u51c6\u5219\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38220", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ece\u591a\u4e2a\u5019\u9009\u8bc4\u5206\u51c6\u5219\u4e2d\u9009\u62e9\u533a\u5206\u80fd\u529b\u6700\u5f3a\u8005\uff0c\u8865\u5145\u9057\u6f0f\u9700\u6c42\u6216\u56de\u7b54\u7f3a\u9677\uff0c\u5e76\u5220\u9664\u504f\u79bb\u76ee\u6807\u6216\u6d41\u4e8e\u8868\u9762\u7684\u6761\u76ee\u3002", "\u7ed3\u5408\u6a21\u578b\u81ea\u6211\u6279\u8bc4\u3001\u6d4b\u8bd5\u65f6\u6269\u5c55\u53ca\u793a\u4f8b\u56de\u7b54\u7684\u6761\u76ee\u901a\u8fc7\u7387\u6307\u5bfc\u4f18\u5316\uff1b\u5728\u4e94\u4e2a\u57fa\u51c6\u4e0a\uff0c\u4e0e\u4e13\u5bb6\u51c6\u5219\u7684\u8bc4\u5206\u4e00\u81f4\u6027\u6bd4\u6700\u4f73\u66ff\u4ee3\u81ea\u52a8\u751f\u6210\u65b9\u6cd5\u9ad89%\u3002", "\u5728 HealthBench \u4e0a\uff0c\u4f7f\u7528\u5176\u51c6\u5219\u5bf9 Qwen3.5-9B \u8fdb\u884c\u540e\u8bad\u7ec3\uff0c\u6027\u80fd\u6bd4\u4f7f\u7528\u6700\u5f3a\u66ff\u4ee3\u65b9\u6cd5 RRD \u7684\u51c6\u5219\u8bad\u7ec3\u9ad84.5%\u3002"], "keywords": ["\u5927\u6a21\u578b\u8bc4\u4f30", "\u5956\u52b1\u6a21\u578b", "\u6a21\u578b\u540e\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38220v1", "published_at": "2026-10-28", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Rubricon: Automated Rubric Generation and Refinement for LLM Evaluation and Training", "tldr": "Rubricon\u81ea\u52a8\u751f\u6210\u5e76\u4f18\u5316\u8bc4\u5206\u51c6\u5219\uff0c\u63d0\u5347\u5927\u6a21\u578b\u8bc4\u4f30\u4e0e\u8bad\u7ec3\u6548\u679c", "upvotes": 0, "what_it_is": "\u63d0\u51fa Rubricon \u81ea\u52a8\u8bc4\u5206\u51c6\u5219\u751f\u6210\u4e0e\u4f18\u5316\u6d41\u6c34\u7ebf\uff0c\u4e3a\u7b54\u6848\u65e0\u6cd5\u76f4\u63a5\u9a8c\u8bc1\u7684\u4efb\u52a1\u63d0\u4f9b\u5956\u52b1\u4f9d\u636e\u3002\u65e0\u9700\u4eba\u5de5\u504f\u597d\u6807\u7b7e\u3001\u51c6\u5219\u6807\u6ce8\u6216\u8bad\u7ec3\u751f\u6210\u6a21\u578b\uff0c\u5373\u53ef\u501f\u52a9\u5927\u8bed\u8a00\u6a21\u578b\u751f\u6210\u5e76\u8fed\u4ee3\u4f18\u5316\u51c6\u5219\u3002", "why_notable": "\u964d\u4f4e\u96be\u4ee5\u76f4\u63a5\u9a8c\u8bc1\u7b54\u6848\u7684\u4efb\u52a1\u5bf9\u4eba\u5de5\u8bc4\u5206\u51c6\u5219\u7684\u4f9d\u8d56\uff0c\u5e76\u5c55\u793a\u81ea\u52a8\u51c6\u5219\u4e0d\u4ec5\u80fd\u6539\u5584\u8bc4\u4f30\uff0c\u8fd8\u80fd\u63d0\u5347\u540e\u8bad\u7ec3\u6548\u679c\uff0c\u4e3a\u4f4e\u6210\u672c\u6784\u5efa\u5956\u52b1\u4fe1\u53f7\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Generating videos of a specific subject from a few reference images remains challenging when the camera reveals surfaces that are not visible in the input. Early subject-to-video (S2V) methods condition on a single reference image and must therefore infer the subject\u0027s unseen appearance and geometry as the viewpoint changes. To address this limitation, recent methods extend S2V to multiple reference views, providing more information about the subject from different viewpoints. However, they do not explicitly specify the 3D structure that connects these observations. In addition, existing training data do not guarantee that viewpoint changes preserve the same underlying 3D subject. We present OmniShowcase, built on two components: (i) a fully automated data synthesis pipeline that produces training videos along diverse camera trajectories, with viewpoint variation driven by underlying subject geometry, even spanning full 360-degree orbits; and (ii) a geometry-conditioning method that provides the video model with a turntable of surface-normal maps reconstructed from the reference views without requiring temporal alignment with the generated frames. We construct Showcase-4K, a corpus of 3D-asset-based videos covering twelve camera motions across 88 trajectory configurations with reconstruction-derived surface-normal conditioning, and ShowcaseBench, a held-out evaluation set with the source meshes and camera parameters used to render each video. Experiments show state-of-the-art subject identity and 3D consistency while maintaining competitive video quality and motion. Project page: justin4ai.github.io/OmniShowcase", "arxiv_id": "2610.35684", "arxiv_url": "https://arxiv.org/abs/2610.35684", "authors": ["Junyeong Ahn", "Geonwoo Kim", "Kinam Kim", "Gihwi Kim", "Hoonjin Jung", "Hyojin Jang", "Jaegul Choo"], "brief": "\u63d0\u51fa OmniShowcase\uff0c\u4ece\u5c11\u91cf\u591a\u89c6\u56fe\u53c2\u8003\u56fe\u50cf\u751f\u6210\u4e3b\u4f53\u4e00\u81f4\u7684\u89c6\u9891\uff0c\u652f\u6301\u5b8c\u6574360\u5ea6\u73af\u7ed5\u89c6\u89d2\u3002\u65b9\u6cd5\u7ed3\u5408\u81ea\u52a8\u5316\u4e09\u7ef4\u8d44\u4ea7\u89c6\u9891\u5408\u6210\u4e0e\u8868\u9762\u6cd5\u7ebf\u51e0\u4f55\u6761\u4ef6\uff0c\u7ea6\u675f\u89c6\u89d2\u53d8\u5316\u65f6\u7684\u4e3b\u4f53\u5916\u89c2\u548c\u7ed3\u6784\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/justin4ai/OmniShowcase", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2610.35684", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ece\u53c2\u8003\u89c6\u56fe\u91cd\u5efa\u8868\u9762\u6cd5\u7ebf\u56fe\u8f6c\u53f0\u5e8f\u5217\uff0c\u4f5c\u4e3a\u89c6\u9891\u6a21\u578b\u7684\u51e0\u4f55\u6761\u4ef6\uff0c\u65e0\u9700\u4e0e\u751f\u6210\u5e27\u8fdb\u884c\u65f6\u95f4\u5bf9\u9f50\u3002", "\u6784\u5efa Showcase-4K \u6570\u636e\u96c6\uff0c\u57fa\u4e8e\u4e09\u7ef4\u8d44\u4ea7\u751f\u6210\u89c6\u9891\uff0c\u8986\u76d612\u79cd\u76f8\u673a\u8fd0\u52a8\u300188\u79cd\u8f68\u8ff9\u914d\u7f6e\uff0c\u4f7f\u89c6\u89d2\u53d8\u5316\u5bf9\u5e94\u540c\u4e00\u4e3b\u4f53\u7684\u771f\u5b9e\u51e0\u4f55\u3002", "\u6784\u5efa\u4fdd\u7559\u6e90\u7f51\u683c\u4e0e\u76f8\u673a\u53c2\u6570\u7684 ShowcaseBench \u8bc4\u6d4b\u96c6\uff1b\u5b9e\u9a8c\u663e\u793a\u4e3b\u4f53\u8eab\u4efd\u4e0e\u4e09\u7ef4\u4e00\u81f4\u6027\u8fbe\u5230\u9886\u5148\u6c34\u5e73\uff0c\u540c\u65f6\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u89c6\u9891\u8d28\u91cf\u548c\u8fd0\u52a8\u8868\u73b0\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u4e09\u7ef4\u89c6\u89c9", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2610.35684v1", "published_at": "2026-10-26", "score": 0.125, "selected_reasons": ["HF trending (47\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35684.png", "title": "OmniShowcase: Omnidirectional Subject-Consistent Video Generation from Multi-View Images", "tldr": "OmniShowcase\u4ee5\u591a\u89c6\u56fe\u51e0\u4f55\u6761\u4ef6\u63d0\u5347\u5168\u65b9\u4f4d\u89c6\u9891\u7684\u4e3b\u4f53\u4e00\u81f4\u6027", "upvotes": 47, "what_it_is": "\u63d0\u51fa OmniShowcase\uff0c\u4ece\u5c11\u91cf\u591a\u89c6\u56fe\u53c2\u8003\u56fe\u50cf\u751f\u6210\u4e3b\u4f53\u4e00\u81f4\u7684\u89c6\u9891\uff0c\u652f\u6301\u5b8c\u6574360\u5ea6\u73af\u7ed5\u89c6\u89d2\u3002\u65b9\u6cd5\u7ed3\u5408\u81ea\u52a8\u5316\u4e09\u7ef4\u8d44\u4ea7\u89c6\u9891\u5408\u6210\u4e0e\u8868\u9762\u6cd5\u7ebf\u51e0\u4f55\u6761\u4ef6\uff0c\u7ea6\u675f\u89c6\u89d2\u53d8\u5316\u65f6\u7684\u4e3b\u4f53\u5916\u89c2\u548c\u7ed3\u6784\u3002", "why_notable": "\u4e0d\u53ea\u589e\u52a0\u53c2\u8003\u89c6\u56fe\uff0c\u800c\u662f\u663e\u5f0f\u5f15\u5165\u8fde\u63a5\u5404\u89c6\u56fe\u7684\u4e09\u7ef4\u51e0\u4f55\u7ea6\u675f\uff0c\u5e76\u6539\u5584\u8bad\u7ec3\u6570\u636e\u4e2d\u7684\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\uff0c\u4e3a\u5546\u54c1\u5c55\u793a\u7b49\u5168\u65b9\u4f4d\u4e3b\u4f53\u89c6\u9891\u751f\u6210\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Many Indian banks serve customers through FAQ pages and scripted chatbots. Assistants based on language models could respond faster and carry out requests such as blocking a card, but only if they give correct information and follow the bank\u0027s rules. These rules prescribe a procedure, a set of required steps, such as obtaining a closure quote before closing a deposit. Adapting models to this domain requires measuring how well they follow the procedure, before and after training. Benchmarks usually judge only the records left at the end of a conversation. Many required steps, however, leave the records unchanged, so an assistant that skips them can still be judged successful. We present TauIndianBankBench, an action-oriented benchmark of 1,000 Indian retail-banking tasks where an assistant helps a simulated customer. Besides the final records, it checks that the assistant took every required step and made no unrequested change. For every model, 6.5-12.0% of sessions are judged successful when only the final records are checked, although the assistant skipped a required step or made an unrequested change. Scoring both procedure and outcome shows more accurately how well language models perform in Indian retail banking.", "arxiv_id": "2610.30161", "arxiv_url": "https://arxiv.org/abs/2610.30161", "authors": ["Krishanu Adhikary", "Prashant Devadiga"], "brief": "\u63d0\u51fa TauIndianBankBench\uff0c\u5305\u542b1000\u9879\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u4efb\u52a1\uff0c\u8bc4\u4f30\u5de5\u5177\u8c03\u7528\u5bf9\u8bdd\u667a\u80fd\u4f53\u670d\u52a1\u6a21\u62df\u5ba2\u6237\u7684\u80fd\u529b\u3002\u9664\u6700\u7ec8\u4e1a\u52a1\u8bb0\u5f55\u5916\uff0c\u8fd8\u68c0\u67e5\u667a\u80fd\u4f53\u662f\u5426\u5b8c\u6210\u5168\u90e8\u89c4\u5b9a\u6b65\u9aa4\uff0c\u4ee5\u53ca\u662f\u5426\u505a\u51fa\u672a\u7ecf\u8bf7\u6c42\u7684\u53d8\u66f4\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/npci/TauIndianBankBench", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2610.30161", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bc4\u4f30\u540c\u65f6\u8986\u76d6\u4e1a\u52a1\u7ed3\u679c\u4e0e\u64cd\u4f5c\u6d41\u7a0b\uff0c\u8bc6\u522b\u90a3\u4e9b\u4e0d\u4f1a\u6539\u53d8\u6700\u7ec8\u8bb0\u5f55\u3001\u5374\u5fc5\u987b\u6267\u884c\u7684\u6b65\u9aa4\u3002", "\u5728\u6240\u6709\u53d7\u6d4b\u6a21\u578b\u4e2d\uff0c6.5%\u201412.0%\u7684\u4f1a\u8bdd\u4ec5\u6309\u6700\u7ec8\u8bb0\u5f55\u88ab\u5224\u6210\u529f\uff0c\u5b9e\u9645\u5374\u9057\u6f0f\u5fc5\u8981\u6b65\u9aa4\u6216\u505a\u51fa\u672a\u7ecf\u8bf7\u6c42\u7684\u53d8\u66f4\u3002", "\u4efb\u52a1\u6d89\u53ca\u94f6\u884c\u5361\u51bb\u7ed3\u3001\u5b58\u6b3e\u5173\u95ed\u7b49\u4e1a\u52a1\uff1b\u4f8b\u5982\u5173\u95ed\u5b58\u6b3e\u524d\u5fc5\u987b\u5148\u53d6\u5f97\u7ed3\u6e05\u62a5\u4ef7\uff0c\u53ef\u7528\u4e8e\u6bd4\u8f83\u8bad\u7ec3\u524d\u540e\u7684\u6d41\u7a0b\u9075\u5faa\u80fd\u529b\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u8bc4\u6d4b", "\u91d1\u878d"], "num_comments": 3, "on_hf": true, "organization": "National Payments Corporation of India", "pdf_url": "https://arxiv.org/pdf/2610.30161v1", "published_at": "2026-09-30", "score": 0.086, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.30161.png", "title": "TauIndianBankBench: Procedure-Aware, Action-Oriented Evaluation of Tool-Using Conversational Agents", "tldr": "\u5370\u5ea6\u94f6\u884c\u667a\u80fd\u4f53\u57fa\u51c6\u63ed\u793a\u4ec5\u770b\u6700\u7ec8\u7ed3\u679c\u4f1a\u6f0f\u5224\u6d41\u7a0b\u8fdd\u89c4", "upvotes": 9, "what_it_is": "\u63d0\u51fa TauIndianBankBench\uff0c\u5305\u542b1000\u9879\u5370\u5ea6\u96f6\u552e\u94f6\u884c\u4efb\u52a1\uff0c\u8bc4\u4f30\u5de5\u5177\u8c03\u7528\u5bf9\u8bdd\u667a\u80fd\u4f53\u670d\u52a1\u6a21\u62df\u5ba2\u6237\u7684\u80fd\u529b\u3002\u9664\u6700\u7ec8\u4e1a\u52a1\u8bb0\u5f55\u5916\uff0c\u8fd8\u68c0\u67e5\u667a\u80fd\u4f53\u662f\u5426\u5b8c\u6210\u5168\u90e8\u89c4\u5b9a\u6b65\u9aa4\uff0c\u4ee5\u53ca\u662f\u5426\u505a\u51fa\u672a\u7ecf\u8bf7\u6c42\u7684\u53d8\u66f4\u3002", "why_notable": "\u63ed\u793a\u4e86\u53ea\u68c0\u67e5\u6700\u7ec8\u72b6\u6001\u7684\u667a\u80fd\u4f53\u8bc4\u6d4b\u76f2\u533a\uff0c\u5c06\u6d41\u7a0b\u5408\u89c4\u4e0e\u7ed3\u679c\u6b63\u786e\u6027\u5171\u540c\u7eb3\u5165\u8bc4\u5206\uff0c\u5bf9\u94f6\u884c\u7b49\u89c4\u5219\u4e25\u683c\u573a\u666f\u4e2d\u7684\u667a\u80fd\u4f53\u8bc4\u4f30\u548c\u90e8\u7f72\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Command-line interface (CLI) agents increasingly execute longer-horizon tasks, yet existing benchmarks either assume that user instructions remain fixed throughout execution or evaluate task outcomes without capturing runtime collaboration quality. In this paper, we present REALCLI, a paired benchmark that unifies the evaluation of task execution and human-agent collaboration quality on realistic CLI tasks. To comprehensively measure collaboration, REALCLI builds a five-dimensional framework, operationalized into 22 sub-dimensions and 51 interaction scenario templates. REALCLI provides two modes for paired comparison: REALCLI-EXEC supplies complete specifications upfront, whereas REALCLI-COLLAB introduces a scripted user that delivers progressive information, corrections, constraint revisions, and authorization decisions. Evaluations reveal profound capability gaps in frontier agents: the best configuration attains an average score of only 49.2%, and when evaluated by the joint collaboration score ($J_{\\mathrm{collab}}$), the peak performance reaches merely 37.6%. These results show that task effectiveness diverges sharply from collaboration quality, with models consistently struggling in steerability, trust calibration, and safety boundary management. REALCLI provides a rigorous, reproducible foundation for measuring and advancing collaborative CLI agents.", "arxiv_id": "2610.22507", "arxiv_url": "https://arxiv.org/abs/2610.22507", "authors": ["Yunqi Liu", "Peiyu Wang", "Bingli Wang", "Leo Luo", "Xuanwu Song", "Xudong Ma", "Hongxin Li", "Yaxin Du", "Weicheng Gu", "Fanglin Xu", "Yi Xing", "XiangLong Liu", "Jujie He", "Zhange Zhang", "Huatong Song", "Zhaoyi Li", "Deyang Kong", "Chuan Hao", "Peihao Wu", "Mingjie Tang", "Ran Tao", "Jian Yang", "Wayne Xin Zhao", "Bryan Dai"], "brief": "\u63d0\u51faREALCLI\u914d\u5bf9\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5728\u771f\u5b9e\u547d\u4ee4\u884c\u4efb\u52a1\u4e2d\u7edf\u4e00\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u4efb\u52a1\u6267\u884c\u80fd\u529b\u4e0e\u4eba\u673a\u534f\u4f5c\u8d28\u91cf\u3002\u901a\u8fc7\u5b8c\u6574\u6307\u4ee4\u4e0e\u52a8\u6001\u7528\u6237\u4ea4\u4e92\u4e24\u79cd\u6a21\u5f0f\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u5e94\u5bf9\u6267\u884c\u4e2d\u9700\u6c42\u53d8\u5316\u7684\u80fd\u529b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.22507", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u4e94\u7ef4\u534f\u4f5c\u8bc4\u4f30\u6846\u67b6\uff0c\u7ec6\u5316\u4e3a22\u4e2a\u5b50\u7ef4\u5ea6\u548c51\u79cd\u4ea4\u4e92\u573a\u666f\u6a21\u677f\u3002", "REALCLI-EXEC\u9884\u5148\u63d0\u4f9b\u5b8c\u6574\u4efb\u52a1\u89c4\u683c\uff1bREALCLI-COLLAB\u901a\u8fc7\u811a\u672c\u5316\u7528\u6237\u9010\u6b65\u63d0\u4f9b\u4fe1\u606f\u3001\u7ea0\u6b63\u3001\u7ea6\u675f\u4fee\u8ba2\u548c\u6388\u6743\u51b3\u5b9a\uff0c\u5b9e\u73b0\u914d\u5bf9\u6bd4\u8f83\u3002", "\u6700\u4f18\u914d\u7f6e\u7684\u5e73\u5747\u5f97\u5206\u4ec549.2%\uff0c\u8054\u5408\u534f\u4f5c\u5f97\u5206\u6700\u9ad8\u4ec537.6%\uff1b\u6a21\u578b\u5728\u53ef\u5f15\u5bfc\u6027\u3001\u4fe1\u4efb\u6821\u51c6\u4e0e\u5b89\u5168\u8fb9\u754c\u7ba1\u7406\u4e0a\u6301\u7eed\u8868\u73b0\u8584\u5f31\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4eba\u673a\u534f\u4f5c", "\u8bc4\u6d4b\u57fa\u51c6", "\u5b89\u5168\u6027"], "num_comments": 2, "on_hf": true, "organization": "IQuest", "pdf_url": "https://arxiv.org/pdf/2610.22507v1", "published_at": "2026-10-15", "score": 0.082, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.22507.png", "title": "RealCLI: Toward a Unified Evaluation of Human-Agent Collaboration for CLI Agents", "tldr": "REALCLI\u63ed\u793a\u547d\u4ee4\u884c\u667a\u80fd\u4f53\u4efb\u52a1\u80fd\u529b\u4e0e\u4eba\u673a\u534f\u4f5c\u8d28\u91cf\u7684\u663e\u8457\u843d\u5dee", "upvotes": 17, "what_it_is": "\u63d0\u51faREALCLI\u914d\u5bf9\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5728\u771f\u5b9e\u547d\u4ee4\u884c\u4efb\u52a1\u4e2d\u7edf\u4e00\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u4efb\u52a1\u6267\u884c\u80fd\u529b\u4e0e\u4eba\u673a\u534f\u4f5c\u8d28\u91cf\u3002\u901a\u8fc7\u5b8c\u6574\u6307\u4ee4\u4e0e\u52a8\u6001\u7528\u6237\u4ea4\u4e92\u4e24\u79cd\u6a21\u5f0f\uff0c\u68c0\u9a8c\u667a\u80fd\u4f53\u5e94\u5bf9\u6267\u884c\u4e2d\u9700\u6c42\u53d8\u5316\u7684\u80fd\u529b\u3002", "why_notable": "\u7a81\u7834\u4ec5\u770b\u4efb\u52a1\u7ed3\u679c\u6216\u5047\u8bbe\u6307\u4ee4\u56fa\u5b9a\u7684\u8bc4\u6d4b\u65b9\u5f0f\uff0c\u5c06\u8fd0\u884c\u65f6\u534f\u4f5c\u7eb3\u5165\u53ef\u590d\u73b0\u8bc4\u4f30\uff0c\u63ed\u793a\u4efb\u52a1\u5b8c\u6210\u80fd\u529b\u4e0d\u80fd\u4ee3\u8868\u534f\u4f5c\u8d28\u91cf\uff0c\u4e3a\u547d\u4ee4\u884c\u667a\u80fd\u4f53\u7684\u53ef\u9760\u90e8\u7f72\u63d0\u4f9b\u66f4\u8d34\u8fd1\u5b9e\u9645\u7684\u8861\u91cf\u6807\u51c6\u3002"}, {"abstract": "Despite their extensive pretraining knowledge and strong reasoning capabilities, large language models (LLMs) struggle to adaptively gather information in experimental design tasks. We study how to amortize sequential Bayesian experimental design (BED) into an LLM by explicitly training the reasoning that guides action selection using information-gain rewards. Our approach specifies the experimental generative model independently of the LLM\u0027s own beliefs, allowing us to optimize expected information gain under a model of our choosing. We investigate the design choices for amortization, including alternative generative-model constructions, reward estimation, hypothesis-space specification, multi-step objectives, and computational costs relative to training- and inference-time BED baselines. On Twenty Questions, the resulting policies improve information acquisition and task performance, outperform inference- and training-time BED baselines at substantially lower computational cost, and generalize to unseen categories. We further demonstrate positive transfer from Twenty Questions training to Medi-Q, a real-world clinical dialogue benchmark. These results suggest that information gathering can be learned as a generalizable reasoning skill in LLMs.", "arxiv_id": "2610.20832", "arxiv_url": "https://arxiv.org/abs/2610.20832", "authors": ["Anita Kriz", "Antonin Berthon", "Nicol\u00e1s Astorga", "Mihaela van der Schaar"], "brief": "\u5c06\u5e8f\u8d2f\u8d1d\u53f6\u65af\u5b9e\u9a8c\u8bbe\u8ba1\uff08BED\uff09\u7684\u51b3\u7b56\u80fd\u529b\u644a\u9500\u5230\u63a8\u7406\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u663e\u5f0f\u8bad\u7ec3\u6307\u5bfc\u884c\u52a8\u9009\u62e9\u7684\u63a8\u7406\u8fc7\u7a0b\u3002\u6a21\u578b\u901a\u8fc7\u4fe1\u606f\u589e\u76ca\u5956\u52b1\u5b66\u4e60\u5982\u4f55\u9010\u6b65\u63d0\u95ee\u3001\u6536\u96c6\u4fe1\u606f\uff0c\u800c\u975e\u6bcf\u6b21\u63a8\u7406\u65f6\u91cd\u65b0\u8fdb\u884c\u6602\u8d35\u7684\u5b9e\u9a8c\u8bbe\u8ba1\u8ba1\u7b97\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": "https://github.com/anitakriz/ar-bed", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.20832", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5b9e\u9a8c\u751f\u6210\u6a21\u578b\u72ec\u7acb\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u81ea\u8eab\u7684\u4fe1\u5ff5\uff0c\u53ef\u5728\u7814\u7a76\u8005\u6307\u5b9a\u7684\u6a21\u578b\u4e0b\u4f18\u5316\u671f\u671b\u4fe1\u606f\u589e\u76ca\u3002", "\u7cfb\u7edf\u8003\u5bdf\u751f\u6210\u6a21\u578b\u6784\u5efa\u3001\u5956\u52b1\u4f30\u8ba1\u3001\u5047\u8bbe\u7a7a\u95f4\u8bbe\u5b9a\u3001\u591a\u6b65\u76ee\u6807\uff0c\u4ee5\u53ca\u76f8\u5bf9\u8bad\u7ec3\u671f\u548c\u63a8\u7406\u671f BED \u57fa\u7ebf\u7684\u8ba1\u7b97\u6210\u672c\u3002", "\u5728 Twenty Questions \u4e0a\u63d0\u5347\u4fe1\u606f\u83b7\u53d6\u4e0e\u4efb\u52a1\u8868\u73b0\uff0c\u4ee5\u663e\u8457\u66f4\u4f4e\u7684\u8ba1\u7b97\u6210\u672c\u8d85\u8d8a\u4e24\u7c7b BED \u57fa\u7ebf\uff1b\u6cdb\u5316\u81f3\u672a\u89c1\u7c7b\u522b\uff0c\u5e76\u5411\u4e34\u5e8a\u5bf9\u8bdd\u57fa\u51c6 Medi-Q \u5b9e\u73b0\u6b63\u5411\u8fc1\u79fb\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b9e\u9a8c\u8bbe\u8ba1"], "num_comments": 2, "on_hf": true, "organization": "University of Cambridge", "pdf_url": "https://arxiv.org/pdf/2610.20832v1", "published_at": "2026-10-14", "score": 0.067, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.20832.png", "title": "Amortizing Sequential Experimental Design in Reasoning LLMs", "tldr": "\u7528\u4fe1\u606f\u589e\u76ca\u5956\u52b1\u8bad\u7ec3\u63a8\u7406\u6a21\u578b\uff0c\u5b66\u4f1a\u4f4e\u6210\u672c\u81ea\u9002\u5e94\u4fe1\u606f\u91c7\u96c6", "upvotes": 6, "what_it_is": "\u5c06\u5e8f\u8d2f\u8d1d\u53f6\u65af\u5b9e\u9a8c\u8bbe\u8ba1\uff08BED\uff09\u7684\u51b3\u7b56\u80fd\u529b\u644a\u9500\u5230\u63a8\u7406\u5927\u8bed\u8a00\u6a21\u578b\u4e2d\uff0c\u663e\u5f0f\u8bad\u7ec3\u6307\u5bfc\u884c\u52a8\u9009\u62e9\u7684\u63a8\u7406\u8fc7\u7a0b\u3002\u6a21\u578b\u901a\u8fc7\u4fe1\u606f\u589e\u76ca\u5956\u52b1\u5b66\u4e60\u5982\u4f55\u9010\u6b65\u63d0\u95ee\u3001\u6536\u96c6\u4fe1\u606f\uff0c\u800c\u975e\u6bcf\u6b21\u63a8\u7406\u65f6\u91cd\u65b0\u8fdb\u884c\u6602\u8d35\u7684\u5b9e\u9a8c\u8bbe\u8ba1\u8ba1\u7b97\u3002", "why_notable": "\u628a\u6602\u8d35\u7684\u5e8f\u8d2f\u4fe1\u606f\u91c7\u96c6\u4f18\u5316\u8f6c\u5316\u4e3a\u6a21\u578b\u53ef\u76f4\u63a5\u6267\u884c\u7684\u63a8\u7406\u7b56\u7565\uff0c\u5e76\u63d0\u4f9b\u8de8\u7c7b\u522b\u4e0e\u8de8\u4efb\u52a1\u8fc1\u79fb\u8bc1\u636e\uff0c\u8868\u660e\u4e3b\u52a8\u83b7\u53d6\u4fe1\u606f\u53ef\u80fd\u6210\u4e3a\u53ef\u8bad\u7ec3\u3001\u53ef\u6cdb\u5316\u7684\u667a\u80fd\u4f53\u80fd\u529b\u3002"}, {"abstract": "Extending Vision-Language-Action models (VLAs) to humanoid robots requires coordinated whole-body control and diverse demonstrations that are costly to collect in real-world scenarios. Although egocentric human demonstrations provide a complementary source of task experience, differences in visual embodiment and missing robot proprioception complicate transfer to humanoid policies. To address these challenges, we introduce HuGe, a family of Humanoid Generalist VLAs pre-trained on over 2,000 hours of egocentric human and robot data. Specifically, HuGe employs three existing representative VLA architectures to predict latent motion tokens for a pretrained whole-body controller, together with hand-control signals. Based on this, we introduce a three-stage training pipeline that combines egocentric pre-training, humanoid adaptation, and downstream fine-tuning. To facilitate transfer across embodiments, we construct pseudo-proprioceptive states through simulation playback during pre-training and modify arm appearance in egocentric observations through re-rendering during downstream fine-tuning. With this pipeline, HuGe achieves the state-of-the-art on simulation benchmark HumanoidArena. Furthermore, real-world experiments on the Unitree G1 indicate that augmenting robot demonstrations with visually adapted egocentric demonstrations significantly increases success on a pick-and-drop task.", "arxiv_id": "2610.34186", "arxiv_url": "https://arxiv.org/abs/2610.34186", "authors": ["Yang Liu", "Jiacheng Liu", "Hengtao Li", "Yuheng Huang", "Zijian Yang", "Ji Dai", "Maoxin Wang", "Yi Gao", "Qishen Wang", "Baohua Yin", "Peiyang Li", "Shuanghao Bai", "Mingyang Sun", "Pengxiang Ding", "Jianqin Yin", "Lixin Yang", "Donglin Wang"], "brief": "\u63d0\u51fa\u901a\u7528\u4eba\u5f62\u673a\u5668\u4eba\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5bb6\u65cfHuGe\uff0c\u5229\u7528\u8d85\u8fc72000\u5c0f\u65f6\u7684\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u6570\u636e\u9884\u8bad\u7ec3\u3002\u901a\u8fc7\u8de8\u5177\u8eab\u8fc1\u79fb\u548c\u4e09\u9636\u6bb5\u8bad\u7ec3\uff0c\u5c06\u4eba\u7c7b\u4efb\u52a1\u7ecf\u9a8c\u7528\u4e8e\u4eba\u5f62\u673a\u5668\u4eba\u7684\u5168\u8eab\u4e0e\u624b\u90e8\u63a7\u5236\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/yliu-cs/HuGe", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2610.34186", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u91c7\u7528\u4e09\u79cd\u5df2\u6709\u4ee3\u8868\u6027VLA\u67b6\u6784\uff0c\u9884\u6d4b\u9884\u8bad\u7ec3\u5168\u8eab\u63a7\u5236\u5668\u6240\u9700\u7684\u6f5c\u5728\u8fd0\u52a8\u4ee4\u724c\uff0c\u540c\u65f6\u8f93\u51fa\u624b\u90e8\u63a7\u5236\u4fe1\u53f7\u3002", "\u8bad\u7ec3\u5206\u4e3a\u7b2c\u4e00\u89c6\u89d2\u9884\u8bad\u7ec3\u3001\u4eba\u5f62\u673a\u5668\u4eba\u9002\u914d\u548c\u4e0b\u6e38\u5fae\u8c03\uff1b\u9884\u8bad\u7ec3\u65f6\u901a\u8fc7\u4eff\u771f\u56de\u653e\u6784\u9020\u4f2a\u672c\u4f53\u611f\u77e5\u72b6\u6001\uff0c\u5fae\u8c03\u65f6\u901a\u8fc7\u91cd\u65b0\u6e32\u67d3\u8c03\u6574\u89c2\u6d4b\u4e2d\u7684\u624b\u81c2\u5916\u89c2\u3002", "\u5728\u4eff\u771f\u57fa\u51c6HumanoidArena\u4e0a\u53d6\u5f97\u6700\u5148\u8fdb\u8868\u73b0\uff1bUnitree G1\u5b9e\u673a\u5b9e\u9a8c\u663e\u793a\uff0c\u52a0\u5165\u89c6\u89c9\u9002\u914d\u540e\u7684\u7b2c\u4e00\u89c6\u89d2\u6f14\u793a\u53ef\u663e\u8457\u63d0\u5347\u62fe\u53d6\u6295\u653e\u4efb\u52a1\u6210\u529f\u7387\uff0c\u6458\u8981\u672a\u62a5\u544a\u5177\u4f53\u589e\u5e45\u3002"], "keywords": ["\u673a\u5668\u4eba", "\u591a\u6a21\u6001", "\u6a21\u4eff\u5b66\u4e60", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.34186v1", "published_at": "2026-10-25", "score": 0.057, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.34186.png", "title": "HuGe: Scaling Humanoid Generalist Vision-Language-Action Models with Egocentric Experience", "tldr": "HuGe\u5229\u7528\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u7ecf\u9a8c\u8bad\u7ec3\u901a\u7528\u4eba\u5f62\u673a\u5668\u4eba\u7b56\u7565", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u901a\u7528\u4eba\u5f62\u673a\u5668\u4eba\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u5bb6\u65cfHuGe\uff0c\u5229\u7528\u8d85\u8fc72000\u5c0f\u65f6\u7684\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u4e0e\u673a\u5668\u4eba\u6570\u636e\u9884\u8bad\u7ec3\u3002\u901a\u8fc7\u8de8\u5177\u8eab\u8fc1\u79fb\u548c\u4e09\u9636\u6bb5\u8bad\u7ec3\uff0c\u5c06\u4eba\u7c7b\u4efb\u52a1\u7ecf\u9a8c\u7528\u4e8e\u4eba\u5f62\u673a\u5668\u4eba\u7684\u5168\u8eab\u4e0e\u624b\u90e8\u63a7\u5236\u3002", "why_notable": "\u9488\u5bf9\u4eba\u5f62\u673a\u5668\u4eba\u793a\u8303\u6602\u8d35\u3001\u4eba\u673a\u89c6\u89c9\u5dee\u5f02\u53ca\u4eba\u7c7b\u6570\u636e\u7f3a\u5c11\u673a\u5668\u4eba\u672c\u4f53\u611f\u77e5\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u53ef\u6269\u5c55\u7684\u8fc1\u79fb\u8bad\u7ec3\u65b9\u6848\uff0c\u5e76\u4ee5\u4eff\u771f\u548c\u5b9e\u673a\u7ed3\u679c\u9a8c\u8bc1\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u7ecf\u9a8c\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Multimodal large language models (MLLMs) show promising reasoning capabilities, but reliable physical interaction requires planning that accounts for when actions are executable and how they change the world. These preconditions and effects are environment-dependent and often not captured by MLLMs, making adaptation challenging. Yet existing approaches either require costly environment-specific training or rely on unstructured interaction experience that is difficult to reuse. Therefore, we introduce CausGround, a non-parametric causal interaction grounding framework that distills interaction experience into reusable action-centered causal knowledge. CausGround identifies action preconditions and effects and organizes them in a factorized world-state representation capturing object attributes and inter-object relations. At planning time, task-relevant causal dependencies are grounded in current observations to support backward reasoning over preconditions and forward reasoning over effects for action selection and multi-step planning. We evaluate CausGround on simulated high-level planning, interaction reasoning, and real-world robot manipulation. On adapted VirtualHome and RoboCasa benchmarks, CausGround improves vision-based high-level planning across MLLM backbones, increasing average task success from 24.9% to 53.3% on VirtualHome and closed-loop planning success from 43.0% to 57.0% on RoboCasa. On SWITCH, average interaction reasoning accuracy increases from 25.8% to 31.9%, indicating improved action selection, recovery, and verification. Moreover, real-world experiments show that CausGround reasons backward from MLLM-interpreted goals to derive executable high-level action sequences for sequential manipulation. These results demonstrate that reusable action preconditions and effects support long-horizon embodied planning across diverse environments without parameter updates.", "arxiv_id": "2610.29702", "arxiv_url": "https://arxiv.org/abs/2610.29702", "authors": ["Yijun Shen", "Diqi He", "Jinbang Guo", "Wanyue Zhang", "Jiaming Mi", "Huan Yang", "Zhongyuan Wang", "Zhiwei Yu", "Kai Zhang"], "brief": "\u63d0\u51fa\u975e\u53c2\u6570\u5316\u56e0\u679c\u4ea4\u4e92\u6846\u67b6CausGround\uff0c\u5c06\u4ea4\u4e92\u7ecf\u9a8c\u63d0\u70bc\u4e3a\u53ef\u590d\u7528\u7684\u52a8\u4f5c\u524d\u7f6e\u6761\u4ef6\u4e0e\u6267\u884c\u6548\u679c\u3002\u89c4\u5212\u65f6\u7ed3\u5408\u5f53\u524d\u89c2\u6d4b\uff0c\u901a\u8fc7\u56e0\u679c\u63a8\u7406\u751f\u6210\u53ef\u6267\u884c\u7684\u591a\u6b65\u52a8\u4f5c\u5e8f\u5217\uff0c\u652f\u6301\u8de8\u73af\u5883\u9002\u5e94\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/Intelligent-Interaction/CausGround", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2610.29702", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ee5\u5bf9\u8c61\u5c5e\u6027\u548c\u5bf9\u8c61\u95f4\u5173\u7cfb\u6784\u5efa\u56e0\u5b50\u5316\u4e16\u754c\u72b6\u6001\uff0c\u7ec4\u7ec7\u4ee5\u52a8\u4f5c\u4e3a\u4e2d\u5fc3\u7684\u524d\u7f6e\u6761\u4ef6\u4e0e\u6548\u679c\u77e5\u8bc6\u3002", "\u7ed3\u5408\u5f53\u524d\u89c2\u6d4b\u786e\u5b9a\u4efb\u52a1\u76f8\u5173\u56e0\u679c\u4f9d\u8d56\uff0c\u53cd\u5411\u63a8\u5bfc\u52a8\u4f5c\u524d\u7f6e\u6761\u4ef6\u3001\u6b63\u5411\u9884\u6d4b\u6267\u884c\u6548\u679c\uff0c\u8f85\u52a9\u52a8\u4f5c\u9009\u62e9\u548c\u591a\u6b65\u89c4\u5212\uff0c\u65e0\u9700\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u3002", "VirtualHome\u5e73\u5747\u4efb\u52a1\u6210\u529f\u7387\u4ece24.9%\u5347\u81f353.3%\uff0cRoboCasa\u95ed\u73af\u89c4\u5212\u6210\u529f\u7387\u4ece43.0%\u5347\u81f357.0%\uff1bSWITCH\u4ea4\u4e92\u63a8\u7406\u51c6\u786e\u7387\u4ece25.8%\u5347\u81f331.9%\uff0c\u5e76\u5b8c\u6210\u771f\u5b9e\u673a\u5668\u4eba\u987a\u5e8f\u64cd\u4f5c\u9a8c\u8bc1\u3002"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u56e0\u679c\u63a8\u7406", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.29702v1", "published_at": "2026-10-21", "score": 0.055, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.29702.png", "title": "CausGround: Causal Interaction Grounding for Adaptive Embodied Planning", "tldr": "CausGround\u590d\u7528\u52a8\u4f5c\u56e0\u679c\u77e5\u8bc6\uff0c\u65e0\u9700\u53c2\u6570\u66f4\u65b0\u63d0\u5347\u5177\u8eab\u89c4\u5212\u3002", "upvotes": 4, "what_it_is": "\u63d0\u51fa\u975e\u53c2\u6570\u5316\u56e0\u679c\u4ea4\u4e92\u6846\u67b6CausGround\uff0c\u5c06\u4ea4\u4e92\u7ecf\u9a8c\u63d0\u70bc\u4e3a\u53ef\u590d\u7528\u7684\u52a8\u4f5c\u524d\u7f6e\u6761\u4ef6\u4e0e\u6267\u884c\u6548\u679c\u3002\u89c4\u5212\u65f6\u7ed3\u5408\u5f53\u524d\u89c2\u6d4b\uff0c\u901a\u8fc7\u56e0\u679c\u63a8\u7406\u751f\u6210\u53ef\u6267\u884c\u7684\u591a\u6b65\u52a8\u4f5c\u5e8f\u5217\uff0c\u652f\u6301\u8de8\u73af\u5883\u9002\u5e94\u3002", "why_notable": "\u5c06\u96f6\u6563\u4ea4\u4e92\u7ecf\u9a8c\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u7684\u7ed3\u6784\u5316\u56e0\u679c\u77e5\u8bc6\uff0c\u4e3a\u591a\u6a21\u6001\u5927\u6a21\u578b\u8865\u5145\u52a8\u4f5c\u53ef\u6267\u884c\u6027\u4e0e\u72b6\u6001\u53d8\u5316\u7ea6\u675f\uff1b\u5728\u591a\u4e2a\u6a21\u578b\u548c\u73af\u5883\u4e0a\u63d0\u5347\u89c4\u5212\u8868\u73b0\uff0c\u4e3a\u51cf\u5c11\u73af\u5883\u4e13\u5c5e\u8bad\u7ec3\u3001\u589e\u5f3a\u957f\u7a0b\u5177\u8eab\u4efb\u52a1\u53ef\u9760\u6027\u63d0\u4f9b\u4e86\u5b9e\u7528\u9014\u5f84\u3002"}, {"abstract": "Realistic market impact is essential for generative limit order book (LOB) models to serve as world models for trading agents. If a simulator misprices this mechanism, agents learn policies that are optimal in the simulator but wrong in the real market. Existing metrics assess generated streams purely through distributional comparison with historical data, leaving counterfactual response to an agent\u0027s own orders largely unexplored. Here, we show that market impact emerges naturally in neural LOB generators trained solely for next-token prediction. We inject execution-style metaorders into the generated message flow of five autoregressive models across five NASDAQ stocks and measure the response using estimators from the empirical impact literature, validated on baselines whose physics is known in advance. Our benchmark evaluates any message-level generator in three phases: free generation (reading order-flow persistence against price diffusivity); metaorder injection (yielding the impact law\u0027s exponent and amplitude); and a post-execution window (measuring relaxation). In addition, comparing each visible injection to a blind, simulator-only control isolates the model\u0027s learned response from standard book mechanics. For every model on every stock, we measure how the impact responds as a function of cumulative metaorder participation. Interestingly, we observe emergent impact in generative models of market data, with exponents in the range of 0.63 to 1.21, slightly above the traditional 0.5 of the square-root law of impact. In the family of models tested, we are so far unable to observe impact decay during relaxation. We tentatively attribute this to the still-short context windows of the models. We release the benchmark as open source to validate future generative models for market data.", "arxiv_id": "2610.27100", "arxiv_url": "https://arxiv.org/abs/2610.27100", "authors": ["George Nigmatulin", "Valentin Mohl", "Sascha Frey", "Kang Li", "Aramis Marti-Shahandeh", "Mihai Cucuringu", "Anisoara Calinescu", "Jakob Foerster", "Stefan Zohren"], "brief": "\u63d0\u51fa\u5f00\u6e90 LOB-Impact \u57fa\u51c6\uff0c\u901a\u8fc7\u5411\u751f\u6210\u7684\u9650\u4ef7\u8ba2\u5355\u7c3f\u6d88\u606f\u6d41\u6ce8\u5165\u6267\u884c\u578b\u5927\u989d\u8ba2\u5355\uff0c\u68c0\u9a8c\u6a21\u578b\u5bf9\u4ea4\u6613\u884c\u4e3a\u7684\u53cd\u4e8b\u5b9e\u54cd\u5e94\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u4ec5\u4ee5\u6b21\u8bcd\u5143\u9884\u6d4b\u8bad\u7ec3\u7684\u795e\u7ecf\u751f\u6210\u6a21\u578b\u4e5f\u80fd\u6d8c\u73b0\u5e02\u573a\u51b2\u51fb\u3002", "categories": ["q-fin.TR", "cs.LG"], "github_repo": "https://github.com/george-nigmatulin/lob_impact", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.27100", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5173\u952e\u6280\u672f\u70b9\u6216\u6570\u636e\u70b9\uff1a\u6d4b\u8bd5\u8986\u76d65\u79cd\u81ea\u56de\u5f52\u6a21\u578b\u4e0e5\u53ea NASDAQ \u80a1\u7968\uff0c\u5206\u4e3a\u81ea\u7531\u751f\u6210\u3001\u8ba2\u5355\u6ce8\u5165\u548c\u6267\u884c\u540e\u89c2\u5bdf\u4e09\u4e2a\u9636\u6bb5\uff0c\u8bc4\u4f30\u8ba2\u5355\u6d41\u6301\u7eed\u6027\u3001\u4ef7\u683c\u6269\u6563\u6027\u3001\u51b2\u51fb\u6307\u6570\u4e0e\u5e45\u5ea6\u53ca\u51b2\u51fb\u8870\u51cf\u3002", "\u5c06\u6a21\u578b\u53ef\u89c1\u7684\u8ba2\u5355\u6ce8\u5165\u4e0e\u4ec5\u7531\u6a21\u62df\u5668\u5904\u7406\u3001\u6a21\u578b\u4e0d\u53ef\u89c1\u7684\u5bf9\u7167\u8fdb\u884c\u6bd4\u8f83\uff0c\u533a\u5206\u6a21\u578b\u5b66\u5230\u7684\u54cd\u5e94\u4e0e\u8ba2\u5355\u7c3f\u673a\u5236\u672c\u8eab\u9020\u6210\u7684\u5f71\u54cd\uff1b\u4f30\u8ba1\u65b9\u6cd5\u5728\u673a\u5236\u5df2\u77e5\u7684\u57fa\u7ebf\u4e0a\u9a8c\u8bc1\u3002", "\u6d4b\u5f97\u51b2\u51fb\u6307\u6570\u4e3a0.63\u81f31.21\uff0c\u9ad8\u4e8e\u4f20\u7edf\u5e73\u65b9\u6839\u51b2\u51fb\u89c4\u5f8b\u76840.5\uff1b\u6240\u6709\u53d7\u6d4b\u6a21\u578b\u5747\u672a\u89c2\u5bdf\u5230\u6267\u884c\u540e\u7684\u51b2\u51fb\u8870\u51cf\uff0c\u4f5c\u8005\u6682\u63a8\u6d4b\u4e0e\u4e0a\u4e0b\u6587\u7a97\u53e3\u504f\u77ed\u6709\u5173\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u751f\u6210\u6a21\u578b", "\u91d1\u878d\u5efa\u6a21", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 2, "on_hf": true, "organization": "BOLD-Quant-Team", "pdf_url": "https://arxiv.org/pdf/2610.27100v1", "published_at": "2026-10-19", "score": 0.048, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.27100.png", "title": "LOB-Impact Benchmark: Emergent Market Impact in Generative Limit Order Book Models", "tldr": "\u65b0\u57fa\u51c6\u63ed\u793a\u751f\u6210\u5f0f\u8ba2\u5355\u7c3f\u6a21\u578b\u6d8c\u73b0\u5e02\u573a\u51b2\u51fb\uff0c\u4f46\u672a\u89c1\u51b2\u51fb\u8870\u51cf", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u5f00\u6e90 LOB-Impact \u57fa\u51c6\uff0c\u901a\u8fc7\u5411\u751f\u6210\u7684\u9650\u4ef7\u8ba2\u5355\u7c3f\u6d88\u606f\u6d41\u6ce8\u5165\u6267\u884c\u578b\u5927\u989d\u8ba2\u5355\uff0c\u68c0\u9a8c\u6a21\u578b\u5bf9\u4ea4\u6613\u884c\u4e3a\u7684\u53cd\u4e8b\u5b9e\u54cd\u5e94\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u4ec5\u4ee5\u6b21\u8bcd\u5143\u9884\u6d4b\u8bad\u7ec3\u7684\u795e\u7ecf\u751f\u6210\u6a21\u578b\u4e5f\u80fd\u6d8c\u73b0\u5e02\u573a\u51b2\u51fb\u3002", "why_notable": "\u5c06\u5e02\u573a\u751f\u6210\u6a21\u578b\u8bc4\u4f30\u4ece\u5386\u53f2\u5206\u5e03\u62df\u5408\u63a8\u8fdb\u5230\u4ea4\u6613\u5e72\u9884\u540e\u7684\u54cd\u5e94\u68c0\u9a8c\uff0c\u53ef\u5e2e\u52a9\u5224\u65ad\u6a21\u578b\u662f\u5426\u9002\u5408\u4f5c\u4e3a\u4ea4\u6613\u7b56\u7565\u8bad\u7ec3\u7684\u4e16\u754c\u6a21\u578b\uff0c\u964d\u4f4e\u7b56\u7565\u5728\u6a21\u62df\u73af\u5883\u6709\u6548\u3001\u5728\u771f\u5b9e\u5e02\u573a\u5931\u6548\u7684\u98ce\u9669\u3002"}, {"abstract": "Standard sequence models encode position by token rank rather than physical coordinate, typically forcing practitioners to destructively resample continuous physical signals such as spectra observed across heterogeneous instruments. We identify this coordinate mismatch as a structural limitation in cross-instrument representation learning, and propose OmniSpectra, a wavelength-native foundation model for spectral representation learning: a continuous-coordinate masked autoencoder that discards the integer pixel indexing of sequence modeling. Mapping physical coordinates to a logarithmic basis turns the multiplicative scaling induced by cosmological redshift into a uniform additive shift. In continuous rotary position embeddings, this shared shift cancels from relative token distances rather than producing grid-dependent positional distortion. We further counter the spectral bias inherent to implicit neural decoders with a physics-grounded, resolution-gated Fourier decoder that provides anti-aliasing. Pretrained on eight surveys and benchmarked against seven baselines, our model reaches state-of-the-art performance with only 12.2M parameters while outperforming substantially larger models, indicating that encoding physical structure can substitute for parameter scale.", "arxiv_id": "2601.15351", "arxiv_url": "https://arxiv.org/abs/2601.15351", "authors": ["Md Khairul Islam", "Zeyu Xia", "Adam S. Bolton", "Judy Fox"], "brief": "\u63d0\u51fa\u9762\u5411\u5149\u8c31\u8868\u5f81\u5b66\u4e60\u7684\u57fa\u7840\u6a21\u578bOmniSpectra\uff0c\u4ee5\u8fde\u7eed\u7269\u7406\u6ce2\u957f\u5750\u6807\u66ff\u4ee3\u6574\u6570\u50cf\u7d20\u7d22\u5f15\uff0c\u51cf\u5c11\u8de8\u4eea\u5668\u6570\u636e\u5bf9\u7834\u574f\u6027\u91cd\u91c7\u6837\u7684\u4f9d\u8d56\u3002\u6a21\u578b\u7ed3\u5408\u8fde\u7eed\u5750\u6807\u63a9\u7801\u81ea\u7f16\u7801\u5668\u4e0e\u7269\u7406\u7ea6\u675f\u89e3\u7801\u5668\uff0c\u5b66\u4e60\u8de8\u5de1\u5929\u7684\u7edf\u4e00\u5149\u8c31\u8868\u5f81\u3002", "categories": ["astro-ph.IM", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2601.15351", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u6ce2\u957f\u6620\u5c04\u5230\u5bf9\u6570\u5750\u6807\uff0c\u4f7f\u5b87\u5b99\u5b66\u7ea2\u79fb\u5bf9\u5e94\u7edf\u4e00\u5e73\u79fb\uff1b\u8fde\u7eed\u65cb\u8f6c\u4f4d\u7f6e\u7f16\u7801\u4e2d\u7684\u76f8\u5bf9\u8ddd\u79bb\u4e0d\u53d7\u8be5\u5e73\u79fb\u5f71\u54cd\uff0c\u907f\u514d\u7f51\u683c\u4f9d\u8d56\u7684\u4f4d\u7f6e\u5931\u771f\u3002", "\u91c7\u7528\u7269\u7406\u9a71\u52a8\u3001\u5206\u8fa8\u7387\u95e8\u63a7\u7684\u5085\u91cc\u53f6\u89e3\u7801\u5668\uff0c\u7f13\u89e3\u9690\u5f0f\u795e\u7ecf\u89e3\u7801\u5668\u7684\u9891\u8c31\u504f\u7f6e\uff0c\u5e76\u63d0\u4f9b\u6297\u6df7\u53e0\u80fd\u529b\u3002", "\u5728\u516b\u4e2a\u5de1\u5929\u6570\u636e\u96c6\u4e0a\u9884\u8bad\u7ec3\uff0c\u4e0e\u4e03\u79cd\u57fa\u7ebf\u6bd4\u8f83\uff1b\u4ec5\u75281220\u4e07\u53c2\u6570\u8fbe\u5230\u6700\u5148\u8fdb\u6027\u80fd\uff0c\u5e76\u4f18\u4e8e\u53c2\u6570\u91cf\u663e\u8457\u66f4\u5927\u7684\u6a21\u578b\u3002"], "keywords": ["\u57fa\u7840\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u7269\u7406\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2601.15351v2", "published_at": "2026-01-21", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2601.15351.png", "title": "OmniSpectra: A Unified Foundation Model for Universal Spectra Representation Learning", "tldr": "OmniSpectra\u4ee5\u7269\u7406\u6ce2\u957f\u7f16\u7801\u7edf\u4e00\u8de8\u4eea\u5668\u5149\u8c31\u8868\u5f81\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u9762\u5411\u5149\u8c31\u8868\u5f81\u5b66\u4e60\u7684\u57fa\u7840\u6a21\u578bOmniSpectra\uff0c\u4ee5\u8fde\u7eed\u7269\u7406\u6ce2\u957f\u5750\u6807\u66ff\u4ee3\u6574\u6570\u50cf\u7d20\u7d22\u5f15\uff0c\u51cf\u5c11\u8de8\u4eea\u5668\u6570\u636e\u5bf9\u7834\u574f\u6027\u91cd\u91c7\u6837\u7684\u4f9d\u8d56\u3002\u6a21\u578b\u7ed3\u5408\u8fde\u7eed\u5750\u6807\u63a9\u7801\u81ea\u7f16\u7801\u5668\u4e0e\u7269\u7406\u7ea6\u675f\u89e3\u7801\u5668\uff0c\u5b66\u4e60\u8de8\u5de1\u5929\u7684\u7edf\u4e00\u5149\u8c31\u8868\u5f81\u3002", "why_notable": "\u5c06\u7269\u7406\u5750\u6807\u4e0e\u89c2\u6d4b\u5206\u8fa8\u7387\u76f4\u63a5\u7eb3\u5165\u6a21\u578b\u8bbe\u8ba1\uff0c\u9488\u5bf9\u8de8\u4eea\u5668\u5149\u8c31\u5b66\u4e60\u7684\u7ed3\u6784\u6027\u969c\u788d\u63d0\u4f9b\u89e3\u51b3\u65b9\u6848\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5408\u9002\u7684\u7269\u7406\u5f52\u7eb3\u504f\u7f6e\u53ef\u80fd\u6bd4\u5355\u7eaf\u6269\u5927\u53c2\u6570\u89c4\u6a21\u66f4\u6709\u6548\uff0c\u4e5f\u4e3a\u5176\u4ed6\u8fde\u7eed\u7269\u7406\u4fe1\u53f7\u7684\u8868\u5f81\u5b66\u4e60\u63d0\u4f9b\u53c2\u8003\u3002"}, {"abstract": "The quality with which language models follow instructions falls as the load grows, yet there is still no quantity that expresses the limit of a model in units of load with an uncertainty. We propose an instrument in which the load consists of rules that replace single-token words in a text without meaning: such an instruction is atomic, the rules are independent by the construction of the task, and the outcome of every application of a rule is determined by a computable reference answer. Every occurrence of a word to be replaced becomes a Bernoulli trial with a known position in the answer and a known rule number. The statistical model first measures the shape of the dependence of the probability of a right replacement on the text length, the word position, the replacement density, the number of rules and the rule number, then describes it by smooth laws and restores a reference level that does not depend on the choice of the coding. The model yields the instruction capacity - the number of rules held at a given share of right replacements - with an uncertainty. A measurement of GPT-4o mini (2958 requests, 642,430 trials) gave regular laws for every load factor and for the collapse of the answer; the instruction capacity was about 37-38 rules at a share of right replacements of 0.95, and about 18-19 rules at the full replacement density. The code of the instrument, the measurement data and the passport are open, and every number of the passport is recomputed from the published points. The passport of a model serves as the calibration of a future meter of the instruction load of prompts.", "arxiv_id": "2610.36095", "arxiv_url": "https://arxiv.org/abs/2610.36095", "authors": ["Hennadii Kutomanov"], "brief": "\u63d0\u51fa\u4e00\u5957\u6307\u4ee4\u5bb9\u91cf\u6d4b\u91cf\u5de5\u5177\uff0c\u7528\u65e0\u8bed\u4e49\u6587\u672c\u4e2d\u7684\u72ec\u7acb\u5355\u8bcd\u66ff\u6362\u89c4\u5219\u6784\u9020\u53ef\u63a7\u8d1f\u8f7d\u3002\u901a\u8fc7\u7edf\u8ba1\u6a21\u578b\u4f30\u8ba1\u8bed\u8a00\u6a21\u578b\u5728\u6307\u5b9a\u6b63\u786e\u7387\u4e0b\u80fd\u627f\u8f7d\u7684\u89c4\u5219\u6570\u91cf\uff0c\u5e76\u7ed9\u51fa\u4e0d\u786e\u5b9a\u6027\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/kutomanovhennadii/instruction-capacity", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.36095", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u6bcf\u6b21\u8bcd\u66ff\u6362\u89c6\u4e3a\u4f2f\u52aa\u5229\u8bd5\u9a8c\uff0c\u4ee5\u53ef\u8ba1\u7b97\u7684\u53c2\u8003\u7b54\u6848\u5224\u5b9a\u6b63\u786e\u6027\uff0c\u5206\u6790\u6587\u672c\u957f\u5ea6\u3001\u8bcd\u4f4d\u7f6e\u3001\u66ff\u6362\u5bc6\u5ea6\u3001\u89c4\u5219\u6570\u91cf\u53ca\u89c4\u5219\u7f16\u53f7\u7684\u5f71\u54cd\u3002", "\u5728 GPT-4o mini \u4e0a\u5f00\u5c552958\u6b21\u8bf7\u6c42\u3001642430\u6b21\u66ff\u6362\u8bd5\u9a8c\uff0c\u89c2\u5bdf\u5230\u5404\u8d1f\u8f7d\u56e0\u7d20\u53ca\u7b54\u6848\u5d29\u6e83\u7684\u89c4\u5f8b\u6027\u53d8\u5316\u3002", "\u5728\u6b63\u786e\u66ff\u6362\u6bd4\u4f8b\u4e3a95%\u65f6\uff0c\u6307\u4ee4\u5bb9\u91cf\u7ea6\u4e3a37\u201438\u6761\u89c4\u5219\uff1b\u5728\u5b8c\u5168\u66ff\u6362\u5bc6\u5ea6\u4e0b\u7ea6\u4e3a18\u201419\u6761\u3002\u4ee3\u7801\u3001\u6d4b\u91cf\u6570\u636e\u53ca\u53ef\u590d\u7b97\u7684\u6a21\u578b\u6d4b\u91cf\u6863\u6848\u5747\u5df2\u516c\u5f00\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u9075\u5faa", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.36095v1", "published_at": "2026-10-26", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.36095.png", "title": "Instruction Capacity: Behavior and Degradation of Language Models under Controlled Load", "tldr": "\u7528\u53ef\u63a7\u8bcd\u66ff\u6362\u4efb\u52a1\u91cf\u5316\u8bed\u8a00\u6a21\u578b\u7684\u6307\u4ee4\u5bb9\u91cf\u4e0e\u9000\u5316\u89c4\u5f8b", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u4e00\u5957\u6307\u4ee4\u5bb9\u91cf\u6d4b\u91cf\u5de5\u5177\uff0c\u7528\u65e0\u8bed\u4e49\u6587\u672c\u4e2d\u7684\u72ec\u7acb\u5355\u8bcd\u66ff\u6362\u89c4\u5219\u6784\u9020\u53ef\u63a7\u8d1f\u8f7d\u3002\u901a\u8fc7\u7edf\u8ba1\u6a21\u578b\u4f30\u8ba1\u8bed\u8a00\u6a21\u578b\u5728\u6307\u5b9a\u6b63\u786e\u7387\u4e0b\u80fd\u627f\u8f7d\u7684\u89c4\u5219\u6570\u91cf\uff0c\u5e76\u7ed9\u51fa\u4e0d\u786e\u5b9a\u6027\u3002", "why_notable": "\u5c06\u6307\u4ee4\u9075\u5faa\u80fd\u529b\u8f6c\u5316\u4e3a\u5e26\u4e0d\u786e\u5b9a\u6027\u7684\u5bb9\u91cf\u6307\u6807\uff0c\u4e3a\u6a21\u578b\u6bd4\u8f83\u548c\u63d0\u793a\u8bcd\u8d1f\u8f7d\u6821\u51c6\u63d0\u4f9b\u53ef\u590d\u73b0\u7684\u6d4b\u91cf\u57fa\u7840\u3002\u4f46\u7ed3\u8bba\u6765\u81ea\u53d7\u63a7\u8bcd\u66ff\u6362\u4efb\u52a1\uff0c\u5c1a\u4e0d\u80fd\u76f4\u63a5\u7b49\u540c\u4e8e\u590d\u6742\u771f\u5b9e\u4efb\u52a1\u4e2d\u7684\u6307\u4ee4\u627f\u8f7d\u80fd\u529b\u3002"}, {"abstract": "GUI grounding requires locating small controls in cluttered screenshots and identifying which control a natural-language instruction refers to. Cropping and enlargement can expose local detail, but the resulting image may still leave ambiguity about the intended target. We propose PreView, an auxiliary preprocessor that improves the inputs to an existing grounding model without further training that model. PreView prepares two complementary types of input features: task-relevant views for localization and candidate-specific cues for target understanding. A trained lightweight auxiliary model predicts and refines a center, crops the screenshot into a local view, and enlarges that view for zoomed-in grounding. It also prepares a visual cue (i.e., a red-circle marker with a location hint) and a textual cue describing the candidate\u0027s identity or function. The frozen grounding model uses the prepared inputs to predict the final click. Across five benchmarks, PreView improves the average grounding accuracy of Qwen3-VL-2B, OS-Atlas-4B, and Qwen3-VL-4B without further training these grounding models. Extensive analyses examine the contributions of views and cues, center refinement, and visual input budgets.", "arxiv_id": "2610.33645", "arxiv_url": "https://arxiv.org/abs/2610.33645", "authors": ["Wenjun Hou", "Kaishuai Xu"], "brief": "\u63d0\u51fa\u8f85\u52a9\u9884\u5904\u7406\u5668PreView\uff0c\u4e3a\u73b0\u6709GUI\u5b9a\u4f4d\u6a21\u578b\u751f\u6210\u4efb\u52a1\u76f8\u5173\u5c40\u90e8\u89c6\u56fe\u53ca\u5019\u9009\u63a7\u4ef6\u63d0\u793a\u3002\u65e0\u9700\u8fdb\u4e00\u6b65\u8bad\u7ec3\u4e3b\u5b9a\u4f4d\u6a21\u578b\uff0c\u5373\u53ef\u6539\u5584\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u5230\u6700\u7ec8\u70b9\u51fb\u4f4d\u7f6e\u7684\u9884\u6d4b\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.33645", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u8bad\u7ec3\u8f7b\u91cf\u8f85\u52a9\u6a21\u578b\u9884\u6d4b\u5e76\u7ec6\u5316\u76ee\u6807\u4e2d\u5fc3\uff0c\u88c1\u526a\u622a\u56fe\u5e76\u653e\u5927\u5c40\u90e8\u89c6\u56fe\uff0c\u5e2e\u52a9\u5b9a\u4f4d\u5bc6\u96c6\u754c\u9762\u4e2d\u7684\u5c0f\u63a7\u4ef6\u3002", "\u7ed3\u5408\u5e26\u4f4d\u7f6e\u63d0\u793a\u7684\u7ea2\u5708\u89c6\u89c9\u6807\u8bb0\u4e0e\u63cf\u8ff0\u5019\u9009\u63a7\u4ef6\u8eab\u4efd\u6216\u529f\u80fd\u7684\u6587\u672c\u63d0\u793a\uff0c\u51cf\u5c11\u76ee\u6807\u7406\u89e3\u6b67\u4e49\u3002", "\u5728\u4e94\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347Qwen3-VL-2B\u3001OS-Atlas-4B\u548cQwen3-VL-4B\u7684\u5e73\u5747\u5b9a\u4f4d\u51c6\u786e\u7387\uff0c\u5e76\u5206\u6790\u89c6\u56fe\u3001\u63d0\u793a\u3001\u4e2d\u5fc3\u7ec6\u5316\u53ca\u89c6\u89c9\u8f93\u5165\u9884\u7b97\u7684\u8d21\u732e\uff1b\u6458\u8981\u672a\u7ed9\u51fa\u5177\u4f53\u63d0\u5347\u5e45\u5ea6\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u56fe\u5f62\u754c\u9762"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.33645v1", "published_at": "2026-10-24", "score": 0.033, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.33645.png", "title": "PreView: Enhancing GUI Grounding with Preprocessed Views and Cues", "tldr": "PreView\u901a\u8fc7\u5c40\u90e8\u653e\u5927\u4e0e\u5019\u9009\u63d0\u793a\u63d0\u5347GUI\u70b9\u51fb\u5b9a\u4f4d\u51c6\u786e\u7387\u3002", "upvotes": 2, "what_it_is": "\u63d0\u51fa\u8f85\u52a9\u9884\u5904\u7406\u5668PreView\uff0c\u4e3a\u73b0\u6709GUI\u5b9a\u4f4d\u6a21\u578b\u751f\u6210\u4efb\u52a1\u76f8\u5173\u5c40\u90e8\u89c6\u56fe\u53ca\u5019\u9009\u63a7\u4ef6\u63d0\u793a\u3002\u65e0\u9700\u8fdb\u4e00\u6b65\u8bad\u7ec3\u4e3b\u5b9a\u4f4d\u6a21\u578b\uff0c\u5373\u53ef\u6539\u5584\u81ea\u7136\u8bed\u8a00\u6307\u4ee4\u5230\u6700\u7ec8\u70b9\u51fb\u4f4d\u7f6e\u7684\u9884\u6d4b\u3002", "why_notable": "\u5c06\u5c40\u90e8\u7ec6\u8282\u589e\u5f3a\u4e0e\u5019\u9009\u8bed\u4e49\u63d0\u793a\u7ed3\u5408\uff0c\u628a\u6539\u8fdb\u96c6\u4e2d\u5728\u8f93\u5165\u9884\u5904\u7406\u5c42\uff0c\u53ef\u590d\u7528\u4e8e\u51bb\u7ed3\u7684\u5b9a\u4f4d\u6a21\u578b\uff0c\u4e3aGUI\u667a\u80fd\u4f53\u63d0\u5347\u70b9\u51fb\u53ef\u9760\u6027\u63d0\u4f9b\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "In September 2026, a new large language model was released. Soon after, a new way of making explainer videos became very popular: people asked the model to write a program, and the program produced the video. \"One-click video\" content then appeared in large amounts on many platforms. On the surface, this is a rise in creative power at the level of the individual. We argue that, at a deeper level, it changes the structure of the content industry. This judgment rests on two observations. First, this wave of content is service-type content. People watch it to meet a need, not to enjoy the content itself. The other kind is work-type content. AI makes both kinds faster to produce. But anyone can come in and make service-type content, while work-type content is limited by the number of people who have something to say. So the ratio between the two slowly becomes unbalanced. Second, free platforms choose content through layers of trial viewing, and this uses up user attention. The total amount of attention is fixed. The unbalanced ratio also dilutes good content. A simplified mathematical model shows that, as long as these conditions hold, the recommendation pool mechanism will fail once new content grows past a certain multiple. Based on this, we discuss one possible way out. Machines and entry rules judge whether service-type content passes the bar. Trusted people judge work-type content. We call this the BoLe system. At the end, we briefly imagine how the two kinds of content may develop from here.", "arxiv_id": "2610.37695", "arxiv_url": "https://arxiv.org/abs/2610.37695", "authors": ["Bo Zou", "Chao Xu"], "brief": "\u8bba\u6587\u5c06\u5185\u5bb9\u533a\u5206\u4e3a\u6ee1\u8db3\u5177\u4f53\u9700\u6c42\u7684\u670d\u52a1\u578b\u5185\u5bb9\u4e0e\u8868\u8fbe\u521b\u4f5c\u8005\u89c2\u70b9\u7684\u4f5c\u54c1\u578b\u5185\u5bb9\uff0c\u5206\u6790\u4e00\u952e\u89c6\u9891\u5982\u4f55\u6539\u53d8\u4e24\u8005\u6bd4\u4f8b\u5e76\u51b2\u51fb\u5e73\u53f0\u63a8\u8350\u673a\u5236\u3002\u4f5c\u8005\u901a\u8fc7\u7b80\u5316\u6570\u5b66\u6a21\u578b\u8ba8\u8bba\u63a8\u8350\u6c60\u5931\u6548\u6761\u4ef6\uff0c\u5e76\u63d0\u51fa BoLe \u5206\u7c7b\u578b\u7b5b\u9009\u4f53\u7cfb\u3002", "categories": ["cs.IR", "cs.CY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.37695", "impact_score": 5, "is_agent": false, "is_top": true, "key_points": ["\u4f5c\u8005\u8ba4\u4e3a\uff0c\u670d\u52a1\u578b\u5185\u5bb9\u7684\u751f\u4ea7\u8005\u8fdb\u5165\u95e8\u69db\u8f83\u4f4e\uff0c\u800c\u4f5c\u54c1\u578b\u5185\u5bb9\u53d7\u6709\u8868\u8fbe\u610f\u613f\u4e0e\u80fd\u529b\u7684\u521b\u4f5c\u8005\u6570\u91cf\u9650\u5236\uff0c\u56e0\u6b64 AI \u666e\u53ca\u53ef\u80fd\u5bfc\u81f4\u4e24\u7c7b\u5185\u5bb9\u6bd4\u4f8b\u5931\u8861\u3002", "\u514d\u8d39\u5e73\u53f0\u901a\u8fc7\u9010\u5c42\u8bd5\u770b\u7684\u63a8\u8350\u6c60\u7b5b\u9009\u5185\u5bb9\uff0c\u6d88\u8017\u6709\u9650\u7684\u7528\u6237\u6ce8\u610f\u529b\uff1b\u7b80\u5316\u6a21\u578b\u8868\u660e\uff0c\u5728\u65e2\u5b9a\u5047\u8bbe\u6210\u7acb\u65f6\uff0c\u65b0\u589e\u5185\u5bb9\u8d85\u8fc7\u67d0\u4e2a\u589e\u957f\u500d\u6570\u5c06\u5bfc\u81f4\u673a\u5236\u5931\u6548\uff0c\u6458\u8981\u672a\u7ed9\u51fa\u5177\u4f53\u9608\u503c\u3002", "BoLe \u4f53\u7cfb\u4e3b\u5f20\u7531\u673a\u5668\u4e0e\u51c6\u5165\u89c4\u5219\u7b5b\u9009\u670d\u52a1\u578b\u5185\u5bb9\uff0c\u7531\u53ef\u4fe1\u8d56\u7684\u4eba\u8bc4\u5224\u4f5c\u54c1\u578b\u5185\u5bb9\uff0c\u4ee5\u5dee\u5f02\u5316\u8bc4\u4f30\u66ff\u4ee3\u7edf\u4e00\u63a8\u8350\u903b\u8f91\u3002"], "keywords": ["\u63a8\u8350\u7cfb\u7edf", "\u5185\u5bb9\u751f\u6210", "\u5e73\u53f0\u6cbb\u7406"], "num_comments": 1, "on_hf": true, "organization": "Bread Studio", "pdf_url": "https://arxiv.org/pdf/2610.37695v1", "published_at": "2026-10-24", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37695.png", "title": "After One-Click Video: The Inflow of Service-Type Content, the Failure of the Recommendation Pool Mechanism, and the BoLe System", "tldr": "\u4e00\u952e\u89c6\u9891\u6216\u538b\u57ae\u63a8\u8350\u6c60\uff0c\u8bba\u6587\u63d0\u51fa\u5206\u7c7b\u578b\u5185\u5bb9\u7b5b\u9009\u4f53\u7cfb", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u5185\u5bb9\u533a\u5206\u4e3a\u6ee1\u8db3\u5177\u4f53\u9700\u6c42\u7684\u670d\u52a1\u578b\u5185\u5bb9\u4e0e\u8868\u8fbe\u521b\u4f5c\u8005\u89c2\u70b9\u7684\u4f5c\u54c1\u578b\u5185\u5bb9\uff0c\u5206\u6790\u4e00\u952e\u89c6\u9891\u5982\u4f55\u6539\u53d8\u4e24\u8005\u6bd4\u4f8b\u5e76\u51b2\u51fb\u5e73\u53f0\u63a8\u8350\u673a\u5236\u3002\u4f5c\u8005\u901a\u8fc7\u7b80\u5316\u6570\u5b66\u6a21\u578b\u8ba8\u8bba\u63a8\u8350\u6c60\u5931\u6548\u6761\u4ef6\uff0c\u5e76\u63d0\u51fa BoLe \u5206\u7c7b\u578b\u7b5b\u9009\u4f53\u7cfb\u3002", "why_notable": "\u5c06 AI \u5185\u5bb9\u6cdb\u6ee5\u95ee\u9898\u4ece\u751f\u6210\u8d28\u91cf\u8f6c\u5411\u5185\u5bb9\u7ed3\u6784\u4e0e\u6ce8\u610f\u529b\u7ea6\u675f\uff0c\u4e3a\u5e73\u53f0\u6cbb\u7406\u548c\u63a8\u8350\u673a\u5236\u8bbe\u8ba1\u63d0\u4f9b\u65b0\u89c6\u89d2\u3002\u4f46\u6458\u8981\u4e2d\u7684\u7ed3\u8bba\u4f9d\u8d56\u7b80\u5316\u6a21\u578b\uff0c\u5c1a\u672a\u5c55\u793a\u771f\u5b9e\u5e73\u53f0\u9a8c\u8bc1\u6216\u7cfb\u7edf\u6548\u679c\u3002"}, {"abstract": "Music audio generation spans instrumental clips, full songs with vocals, edits of existing recordings, and systems that play alongside a musician in real time. This monograph explains the methods behind these systems for readers familiar with neural-network training who are new to music generation. It introduces neural audio codecs and autoencoders, autoregressive and masked token models, diffusion and flow matching, sampling acceleration, and preference optimization in a shared notation. Worked examples connect training objectives and sampling procedures to published systems. The application sections relate the musical requirements of instrumental generation, songs, editing, and live performance to model design. Comparison tables record representations, methods, inputs, tasks, and release information documented in papers and official sources. Symbolic composition, speech, and sound effects are included where they connect to music audio. We explain how to interpret automatic metrics and learned judges, design and report listening tests, and assess evidence about data provenance, memorization, attribution, and output detection. Selected legal decisions and disputes illustrate the implications for training and release. The reviewed systems combine established generative paradigms with new representations, planning stages, and post-training procedures. Differences in data, scale, and evaluation limit what cross-system comparisons can establish about the sources of reported gains.", "arxiv_id": "2610.38252", "arxiv_url": "https://arxiv.org/abs/2610.38252", "authors": ["Mateusz Modrzejewski", "Joanna Kurkowska", "Dorien Herremans"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u9762\u5411\u719f\u6089\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u3001\u4f46\u521d\u6d89\u97f3\u4e50\u751f\u6210\u8bfb\u8005\u7684\u6559\u7a0b\u578b\u4e13\u8457\uff0c\u4ee5\u7edf\u4e00\u8bb0\u53f7\u8bb2\u89e3\u97f3\u4e50\u97f3\u9891\u751f\u6210\u7684\u4e3b\u8981\u65b9\
