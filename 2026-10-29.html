u6cd5\u3002\u8986\u76d6\u5668\u4e50\u3001\u4eba\u58f0\u6b4c\u66f2\u3001\u97f3\u9891\u7f16\u8f91\u53ca\u5b9e\u65f6\u4f34\u594f\uff0c\u5e76\u68b3\u7406\u8bc4\u6d4b\u3001\u6570\u636e\u6765\u6e90\u548c\u6cd5\u5f8b\u95ee\u9898\u3002", "categories": ["eess.AS", "cs.AI", "cs.ET", "cs.MM", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38252", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u7edf\u4e00\u4ecb\u7ecd\u795e\u7ecf\u97f3\u9891\u7f16\u89e3\u7801\u5668\u4e0e\u81ea\u7f16\u7801\u5668\u3001\u81ea\u56de\u5f52\u4e0e\u63a9\u7801\u6a21\u578b\u3001\u6269\u6563\u4e0e\u6d41\u5339\u914d\uff0c\u4ee5\u53ca\u91c7\u6837\u52a0\u901f\u548c\u504f\u597d\u4f18\u5316\uff0c\u5e76\u7528\u5df2\u53d1\u8868\u7cfb\u7edf\u4e32\u8054\u8bad\u7ec3\u76ee\u6807\u4e0e\u91c7\u6837\u6d41\u7a0b\u3002", "\u6309\u5668\u4e50\u751f\u6210\u3001\u6b4c\u66f2\u751f\u6210\u3001\u5f55\u97f3\u7f16\u8f91\u548c\u5b9e\u65f6\u6f14\u594f\u7684\u97f3\u4e50\u9700\u6c42\u5206\u6790\u6a21\u578b\u8bbe\u8ba1\uff0c\u901a\u8fc7\u5bf9\u7167\u8868\u6574\u7406\u5404\u7cfb\u7edf\u7684\u8868\u793a\u3001\u65b9\u6cd5\u3001\u8f93\u5165\u3001\u4efb\u52a1\u53ca\u53d1\u5e03\u4fe1\u606f\u3002", "\u8ba8\u8bba\u81ea\u52a8\u6307\u6807\u3001\u5b66\u4e60\u578b\u8bc4\u5224\u5668\u4e0e\u542c\u97f3\u6d4b\u8bd5\u7684\u89e3\u8bfb\u548c\u8bbe\u8ba1\uff0c\u5e76\u5ba1\u89c6\u6570\u636e\u6765\u6e90\u3001\u8bb0\u5fc6\u3001\u5f52\u5c5e\u53ca\u8f93\u51fa\u68c0\u6d4b\u8bc1\u636e\uff1b\u5f3a\u8c03\u6570\u636e\u3001\u89c4\u6a21\u548c\u8bc4\u6d4b\u5dee\u5f02\u9650\u5236\u8de8\u7cfb\u7edf\u6027\u80fd\u5f52\u56e0\u3002"], "keywords": ["\u97f3\u4e50\u751f\u6210", "\u97f3\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38252v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Tutorial on Generative Models for Music Audio", "tldr": "\u7cfb\u7edf\u68b3\u7406\u97f3\u4e50\u97f3\u9891\u751f\u6210\u6280\u672f\u3001\u5e94\u7528\u3001\u8bc4\u6d4b\u4e0e\u7248\u6743\u98ce\u9669", "upvotes": 0, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u9762\u5411\u719f\u6089\u795e\u7ecf\u7f51\u7edc\u8bad\u7ec3\u3001\u4f46\u521d\u6d89\u97f3\u4e50\u751f\u6210\u8bfb\u8005\u7684\u6559\u7a0b\u578b\u4e13\u8457\uff0c\u4ee5\u7edf\u4e00\u8bb0\u53f7\u8bb2\u89e3\u97f3\u4e50\u97f3\u9891\u751f\u6210\u7684\u4e3b\u8981\u65b9\u6cd5\u3002\u8986\u76d6\u5668\u4e50\u3001\u4eba\u58f0\u6b4c\u66f2\u3001\u97f3\u9891\u7f16\u8f91\u53ca\u5b9e\u65f6\u4f34\u594f\uff0c\u5e76\u68b3\u7406\u8bc4\u6d4b\u3001\u6570\u636e\u6765\u6e90\u548c\u6cd5\u5f8b\u95ee\u9898\u3002", "why_notable": "\u4ef7\u503c\u4e3b\u8981\u5728\u4e8e\u7cfb\u7edf\u6574\u5408\u800c\u975e\u63d0\u51fa\u65b0\u6a21\u578b\uff0c\u5c06\u751f\u6210\u6280\u672f\u3001\u97f3\u4e50\u5e94\u7528\u9700\u6c42\u3001\u8bc4\u6d4b\u65b9\u6cd5\u4e0e\u7248\u6743\u98ce\u9669\u653e\u5165\u540c\u4e00\u6846\u67b6\uff0c\u53ef\u4f5c\u4e3a\u5165\u95e8\u3001\u7cfb\u7edf\u9009\u578b\u53ca\u7814\u7a76\u8bbe\u8ba1\u7684\u53c2\u8003\uff0c\u4e5f\u63d0\u9192\u8bfb\u8005\u8c28\u614e\u89e3\u8bfb\u4e0d\u540c\u7cfb\u7edf\u7684\u6027\u80fd\u63d0\u5347\u3002"}, {"abstract": "Retrosynthesis planning seeks synthesis routes from purchasable starting materials to a target molecule. Search over predicted reactions can connect a target to available materials, yet an infeasible reaction can invalidate the resulting route. Evaluating route quality only after search has finished cannot correct errors made during search. We introduce Verification-Guided Reflow (VGR), incorporating reaction verification as a decision action in AND/OR search. Verification results are represented as binary verdicts; queries are scheduled from the search structure, and acquired verdicts exclude reactions or adjust search priorities. We define verified solvability as the fraction of targets for which a complete route accepted stepwise by the verifier is found. On Retro190, feeding verification results into search increases verified solvability from 51.1% to 62.6% relative to route evaluation without feedback. Further controlled experiments show that earlier verification and immediate prioritization of accepted reactions each improve route discovery, yet combining them performs worse than either change alone. We therefore propose early pruning and delayed guidance: rejected reactions are pruned immediately, while accepted reactions gain search priority when processed as part of a complete candidate route. In a separate comparison with the verification scheduling rule fixed, this strategy increases verified solvability from 61.1% with immediate guidance to 71.1%, using fewer proposal calls and unique verifier queries.", "arxiv_id": "2610.38245", "arxiv_url": "https://arxiv.org/abs/2610.38245", "authors": ["Hongxuan Shi", "Hankz Hankui Zhuo"], "brief": "\u63d0\u51fa\u9a8c\u8bc1\u5f15\u5bfc\u91cd\u6d41\uff08VGR\uff09\uff0c\u5c06\u53cd\u5e94\u9a8c\u8bc1\u4f5c\u4e3a AND/OR \u641c\u7d22\u4e2d\u7684\u51b3\u7b56\u52a8\u4f5c\uff0c\u8ba9\u9a8c\u8bc1\u7ed3\u679c\u5b9e\u65f6\u5f71\u54cd\u9006\u5408\u6210\u89c4\u5212\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u201c\u65e9\u526a\u679d\u3001\u5ef6\u8fdf\u5f15\u5bfc\u201d\u7b56\u7565\uff0c\u534f\u8c03\u9a8c\u8bc1\u8bc1\u636e\u7684\u83b7\u53d6\u4e0e\u4f7f\u7528\u65f6\u673a\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38245", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u9a8c\u8bc1\u5668\u8f93\u51fa\u4e8c\u5143\u5224\u5b9a\uff1b\u641c\u7d22\u7ed3\u6784\u51b3\u5b9a\u67e5\u8be2\u65f6\u673a\uff0c\u5426\u51b3\u7ed3\u679c\u7528\u4e8e\u6392\u9664\u53cd\u5e94\uff0c\u901a\u8fc7\u7ed3\u679c\u7528\u4e8e\u8c03\u6574\u641c\u7d22\u4f18\u5148\u7ea7\u3002", "\u5728 Retro190 \u4e0a\uff0c\u5c06\u9a8c\u8bc1\u53cd\u9988\u878d\u5165\u641c\u7d22\uff0c\u76f8\u6bd4\u641c\u7d22\u7ed3\u675f\u540e\u624d\u8bc4\u4f30\u8def\u7ebf\uff0c\u4f7f\u9010\u6b65\u901a\u8fc7\u9a8c\u8bc1\u7684\u5b8c\u6574\u8def\u7ebf\u53d1\u73b0\u7387\u4ece 51.1% \u63d0\u5347\u81f3 62.6%\u3002", "\u63d0\u524d\u9a8c\u8bc1\u4e0e\u7acb\u5373\u4f18\u5148\u641c\u7d22\u901a\u8fc7\u9a8c\u8bc1\u7684\u53cd\u5e94\uff0c\u5355\u72ec\u4f7f\u7528\u5747\u6709\u76ca\uff0c\u4f46\u7ec4\u5408\u6548\u679c\u53cd\u800c\u66f4\u5dee\uff1b\u56fa\u5b9a\u9a8c\u8bc1\u8c03\u5ea6\u89c4\u5219\u540e\uff0c\u7acb\u5373\u526a\u9664\u88ab\u5426\u51b3\u53cd\u5e94\u3001\u5f85\u5b8c\u6574\u5019\u9009\u8def\u7ebf\u5904\u7406\u65f6\u518d\u63d0\u5347\u5df2\u901a\u8fc7\u53cd\u5e94\u7684\u4f18\u5148\u7ea7\uff0c\u5c06\u53d1\u73b0\u7387\u4ece 61.1% \u63d0\u5347\u81f3 71.1%\uff0c\u4e14\u51cf\u5c11\u63d0\u6848\u8c03\u7528\u548c\u4e0d\u540c\u9a8c\u8bc1\u67e5\u8be2\u7684\u6570\u91cf\u3002"], "keywords": ["\u9006\u5408\u6210", "\u641c\u7d22\u89c4\u5212", "\u9a8c\u8bc1\u53cd\u9988"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38245v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Verification-Guided Retrosynthesis: Reaction Feedback and Evidence Timing", "tldr": "\u5c06\u53cd\u5e94\u9a8c\u8bc1\u53cd\u9988\u878d\u5165\u9006\u5408\u6210\u641c\u7d22\uff0c\u63d0\u5347\u53ef\u9a8c\u8bc1\u8def\u7ebf\u53d1\u73b0\u7387", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9a8c\u8bc1\u5f15\u5bfc\u91cd\u6d41\uff08VGR\uff09\uff0c\u5c06\u53cd\u5e94\u9a8c\u8bc1\u4f5c\u4e3a AND/OR \u641c\u7d22\u4e2d\u7684\u51b3\u7b56\u52a8\u4f5c\uff0c\u8ba9\u9a8c\u8bc1\u7ed3\u679c\u5b9e\u65f6\u5f71\u54cd\u9006\u5408\u6210\u89c4\u5212\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa\u201c\u65e9\u526a\u679d\u3001\u5ef6\u8fdf\u5f15\u5bfc\u201d\u7b56\u7565\uff0c\u534f\u8c03\u9a8c\u8bc1\u8bc1\u636e\u7684\u83b7\u53d6\u4e0e\u4f7f\u7528\u65f6\u673a\u3002", "why_notable": "\u5c06\u8def\u7ebf\u9a8c\u8bc1\u4ece\u4e8b\u540e\u8bc4\u4f30\u53d8\u6210\u641c\u7d22\u5185\u7684\u7ea0\u9519\u673a\u5236\uff0c\u5e76\u63ed\u793a\u201c\u66f4\u65e9\u83b7\u5f97\u8bc1\u636e\u201d\u4e0d\u7b49\u4e8e\u201c\u5e94\u7acb\u5373\u7528\u5b83\u5f15\u5bfc\u641c\u7d22\u201d\u3002\u8bc1\u636e\u83b7\u53d6\u4e0e\u4f18\u5148\u7ea7\u8c03\u6574\u7684\u89e3\u8026\uff0c\u4e3a\u63d0\u9ad8\u89c4\u5212\u53ef\u9760\u6027\u548c\u964d\u4f4e\u9a8c\u8bc1\u6210\u672c\u63d0\u4f9b\u4e86\u5b9e\u7528\u601d\u8def\uff1b\u7ed3\u679c\u8861\u91cf\u7684\u662f\u9a8c\u8bc1\u5668\u8ba4\u53ef\u7684\u8def\u7ebf\uff0c\u800c\u975e\u5b9e\u9a8c\u5408\u6210\u6210\u529f\u7387\u3002"}, {"abstract": "Current datasets for text-to-video generation are largely limited to short clips depicting a single event or coarse-grained captions. As a result, they provide limited supervision for modeling long-take temporal dependencies, often leading to temporally inconsistent generations when describing multiple events. In this paper, we introduce MEV, a multi-event video dataset designed for long-take video generation. MEV provides high-quality real-world videos where subjects can perform a sequence of distinct, non-overlapping events, featuring precise temporal boundaries and fine-grained procedural annotations. This event-centric discretization reduces confounding factors and enables models to support temporally localized conditioning and build long-take videos from atomic event units. Furthermore, we introduce a comprehensive annotation pipeline that segments videos into temporally grounded events, and generates structured captions at both the global level and the event level. In addition, under an event-centric evaluation protocol, we conduct multi-event generation experiments by fine-tuning on MEV with temporally grounded event conditioning, leading to improved long-take event transitions and more coherent content. We believe this work provides a publicly available resource for multi-event fine-tuning and event-centric evaluation, together with practical insights into learning from temporally structured video-text data.", "arxiv_id": "2610.38241", "arxiv_url": "https://arxiv.org/abs/2610.38241", "authors": ["Peiyuan Zhu", "Shaoan Xie", "Yifan Shen", "Wen Tian", "Zijian Li", "Guangyi Chen", "Kun Zhang"], "brief": "\u63d0\u51fa\u9762\u5411\u957f\u955c\u5934\u751f\u6210\u7684\u591a\u4e8b\u4ef6\u89c6\u9891\u6570\u636e\u96c6MEV\uff0c\u63d0\u4f9b\u771f\u5b9e\u89c6\u9891\u4e2d\u8fde\u7eed\u3001\u4e92\u4e0d\u91cd\u53e0\u4e8b\u4ef6\u7684\u7cbe\u786e\u65f6\u95f4\u8fb9\u754c\u4e0e\u7ec6\u7c92\u5ea6\u8fc7\u7a0b\u6807\u6ce8\u3002\u914d\u5957\u6784\u5efa\u6807\u6ce8\u6d41\u7a0b\u548c\u4e8b\u4ef6\u4e2d\u5fc3\u8bc4\u6d4b\u534f\u8bae\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u5b9e\u9a8c\u9a8c\u8bc1\u5176\u4ef7\u503c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38241", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u89c6\u9891\u79bb\u6563\u4e3a\u539f\u5b50\u4e8b\u4ef6\u5355\u5143\uff0c\u51cf\u5c11\u6df7\u6742\u56e0\u7d20\uff0c\u652f\u6301\u65f6\u95f4\u5c40\u90e8\u6761\u4ef6\u63a7\u5236\u4e0e\u591a\u4e8b\u4ef6\u957f\u955c\u5934\u6784\u5efa\u3002", "\u6807\u6ce8\u6d41\u7a0b\u5c06\u89c6\u9891\u5207\u5206\u4e3a\u5177\u6709\u65f6\u95f4\u5b9a\u4f4d\u7684\u4e8b\u4ef6\uff0c\u540c\u65f6\u751f\u6210\u5168\u5c40\u7ea7\u548c\u4e8b\u4ef6\u7ea7\u7ed3\u6784\u5316\u63cf\u8ff0\u3002", "\u91c7\u7528\u5e26\u65f6\u95f4\u5b9a\u4f4d\u7684\u4e8b\u4ef6\u6761\u4ef6\u8fdb\u884c\u5fae\u8c03\uff0c\u5b9e\u9a8c\u663e\u793a\u957f\u955c\u5934\u4e8b\u4ef6\u8fc7\u6e21\u4e0e\u5185\u5bb9\u8fde\u8d2f\u6027\u5f97\u5230\u6539\u5584\uff1b\u6458\u8981\u672a\u63d0\u4f9b\u6570\u636e\u89c4\u6a21\u6216\u91cf\u5316\u589e\u76ca\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6570\u636e\u96c6", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38241v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MEV: A Multi-Event Video Dataset for Long-Take Generation", "tldr": "MEV\u4ee5\u7cbe\u7ec6\u4e8b\u4ef6\u6807\u6ce8\u652f\u6301\u591a\u4e8b\u4ef6\u957f\u955c\u5934\u89c6\u9891\u751f\u6210\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u9762\u5411\u957f\u955c\u5934\u751f\u6210\u7684\u591a\u4e8b\u4ef6\u89c6\u9891\u6570\u636e\u96c6MEV\uff0c\u63d0\u4f9b\u771f\u5b9e\u89c6\u9891\u4e2d\u8fde\u7eed\u3001\u4e92\u4e0d\u91cd\u53e0\u4e8b\u4ef6\u7684\u7cbe\u786e\u65f6\u95f4\u8fb9\u754c\u4e0e\u7ec6\u7c92\u5ea6\u8fc7\u7a0b\u6807\u6ce8\u3002\u914d\u5957\u6784\u5efa\u6807\u6ce8\u6d41\u7a0b\u548c\u4e8b\u4ef6\u4e2d\u5fc3\u8bc4\u6d4b\u534f\u8bae\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u5b9e\u9a8c\u9a8c\u8bc1\u5176\u4ef7\u503c\u3002", "why_notable": "\u9488\u5bf9\u77ed\u7247\u6bb5\u3001\u5355\u4e8b\u4ef6\u6570\u636e\u96be\u4ee5\u76d1\u7763\u957f\u671f\u65f6\u5e8f\u4f9d\u8d56\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u516c\u5f00\u7684\u591a\u4e8b\u4ef6\u6570\u636e\u8d44\u6e90\u548c\u914d\u5957\u8bc4\u6d4b\u65b9\u6cd5\uff0c\u4e3a\u63d0\u5347\u957f\u955c\u5934\u751f\u6210\u7684\u4e8b\u4ef6\u8854\u63a5\u4e0e\u53ef\u63a7\u6027\u63d0\u4f9b\u57fa\u7840\u3002"}, {"abstract": "Large language models are increasingly used for financial guidance, yet little is known about whether their advice changes across social identities in Global South contexts. We introduce the Indian Financial Automated Advice Bias (IFAAB) benchmark, a counterfactual audit dataset of 31,734 GPT-4o-generated financial-advice responses for synthetic Indian personas varying by gender, caste, education, employment, residence, age, and district. Holding the underlying request fixed, we evaluate disparities in LLM-implied wealth, income, savings, projected gains, textual similarity, advice topics, and qualitative bias judgments. In the gender-only audit, male-labelled profiles receive 60.1\\% higher initial total resources and 46.8\\% higher post-advice total resources than comparable female-labelled profiles; in the caste-augmented audit, the post-advice total-resource gap remains 49.4\\%. Adding district information reduces the aggregate post-advice total-resource gender gap to 7.9\\%, revealing strong geographic conditioning. Standalone caste comparisons also show systematic stratification: relative to General-category profiles, OBC, SC, and ST profiles receive significantly lower post-advice total resources, respectively. Textual audits show low semantic similarity between paired gendered responses, with an average TF--IDF cosine similarity score of 0.44. Qualitative analysis shows that women are more often steered toward cautious saving, community support, and basic financial literacy, while men receive more growth-oriented advice involving investment, entrepreneurship, and asset accumulation. IFAAB provides a reusable benchmark for evaluating fairness, suitability, and consumer-protection risks in LLM-mediated financial advice, and highlights the need for locally grounded, intersectional evaluation of AI systems in high-stakes economic domains.", "arxiv_id": "2610.38239", "arxiv_url": "https://arxiv.org/abs/2610.38239", "authors": ["Kriti Mahajan"], "brief": "\u63d0\u51fa\u5370\u5ea6\u91d1\u878d\u81ea\u52a8\u5efa\u8bae\u504f\u5dee\u57fa\u51c6 IFAAB\uff0c\u6536\u5f5531,734\u6761\u7531 GPT-4o \u4e3a\u5408\u6210\u5370\u5ea6\u4eba\u7269\u751f\u6210\u7684\u91d1\u878d\u5efa\u8bae\u3002\u901a\u8fc7\u56fa\u5b9a\u54a8\u8be2\u8bf7\u6c42\u3001\u6539\u53d8\u793e\u4f1a\u8eab\u4efd\u5c5e\u6027\u7684\u53cd\u4e8b\u5b9e\u5ba1\u8ba1\uff0c\u8bc4\u4f30\u5efa\u8bae\u4e2d\u7684\u8d44\u6e90\u4f30\u8ba1\u3001\u5185\u5bb9\u5dee\u5f02\u4e0e\u504f\u5dee\u3002", "categories": ["cs.CY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38239", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5173\u952e\u6280\u672f\u70b9\u6216\u6570\u636e\u70b91\uff1a\u4eba\u7269\u5c5e\u6027\u8986\u76d6\u6027\u522b\u3001\u79cd\u59d3\u3001\u6559\u80b2\u3001\u5c31\u4e1a\u3001\u5c45\u4f4f\u5730\u3001\u5e74\u9f84\u548c\u5730\u533a\uff0c\u5ba1\u8ba1\u6307\u6807\u6db5\u76d6\u6a21\u578b\u9690\u542b\u7684\u8d22\u5bcc\u3001\u6536\u5165\u3001\u50a8\u84c4\u3001\u9884\u671f\u6536\u76ca\u53ca\u5efa\u8bae\u4e3b\u9898\u3002", "\u5173\u952e\u70b92\uff1a\u4ec5\u6539\u53d8\u6027\u522b\u65f6\uff0c\u7537\u6027\u4eba\u7269\u83b7\u6a21\u578b\u8d4b\u4e88\u7684\u521d\u59cb\u603b\u8d44\u6e90\u548c\u5efa\u8bae\u540e\u603b\u8d44\u6e90\u5206\u522b\u9ad8\u51fa60.1%\u548c46.8%\uff1b\u52a0\u5165\u79cd\u59d3\u5c5e\u6027\u540e\uff0c\u540e\u8005\u5dee\u8ddd\u4e3a49.4%\uff0c\u52a0\u5165\u5730\u533a\u4fe1\u606f\u540e\u964d\u81f37.9%\u3002\u8fd9\u4e9b\u662f\u6a21\u578b\u751f\u6210\u7684\u8d44\u6e90\u4f30\u8ba1\uff0c\u5e76\u975e\u771f\u5b9e\u6295\u8d44\u6536\u76ca\u3002", "\u5173\u952e\u70b93\uff1a\u76f8\u8f83 General \u7c7b\u522b\uff0cOBC\u3001SC\u3001ST \u4eba\u7269\u7684\u5efa\u8bae\u540e\u603b\u8d44\u6e90\u663e\u8457\u66f4\u4f4e\uff1b\u6027\u522b\u914d\u5bf9\u56de\u7b54\u7684\u5e73\u5747 TF\u2013IDF \u4f59\u5f26\u76f8\u4f3c\u5ea6\u4e3a0.44\uff0c\u5973\u6027\u66f4\u5e38\u83b7\u4fdd\u5b88\u50a8\u84c4\u5efa\u8bae\uff0c\u7537\u6027\u66f4\u5e38\u83b7\u6295\u8d44\u3001\u521b\u4e1a\u4e0e\u8d44\u4ea7\u79ef\u7d2f\u5efa\u8bae\u3002"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u516c\u5e73\u6027", "\u8bc4\u6d4b\u57fa\u51c6", "\u91d1\u878d\u5e94\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38239v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Indian Financial Automated Advice Bias (IFAAB) Dataset : Auditing Socioeconomic and Demographic Disparities in LLM-Generated Financial Advice in India", "tldr": "\u5370\u5ea6\u91d1\u878d\u5efa\u8bae\u57fa\u51c6\u63ed\u793a\u5927\u6a21\u578b\u7684\u6027\u522b\u4e0e\u79cd\u59d3\u504f\u5dee", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u5370\u5ea6\u91d1\u878d\u81ea\u52a8\u5efa\u8bae\u504f\u5dee\u57fa\u51c6 IFAAB\uff0c\u6536\u5f5531,734\u6761\u7531 GPT-4o \u4e3a\u5408\u6210\u5370\u5ea6\u4eba\u7269\u751f\u6210\u7684\u91d1\u878d\u5efa\u8bae\u3002\u901a\u8fc7\u56fa\u5b9a\u54a8\u8be2\u8bf7\u6c42\u3001\u6539\u53d8\u793e\u4f1a\u8eab\u4efd\u5c5e\u6027\u7684\u53cd\u4e8b\u5b9e\u5ba1\u8ba1\uff0c\u8bc4\u4f30\u5efa\u8bae\u4e2d\u7684\u8d44\u6e90\u4f30\u8ba1\u3001\u5185\u5bb9\u5dee\u5f02\u4e0e\u504f\u5dee\u3002", "why_notable": "\u5c06\u91d1\u878d\u5efa\u8bae\u516c\u5e73\u6027\u5ba1\u8ba1\u63a8\u8fdb\u5230\u5370\u5ea6\u672c\u571f\u793e\u4f1a\u7ed3\u6784\uff0c\u63ed\u793a\u6027\u522b\u3001\u79cd\u59d3\u4e0e\u5730\u7406\u6761\u4ef6\u7684\u4ea4\u53c9\u5f71\u54cd\u3002\u53ef\u4e3a\u9ad8\u98ce\u9669\u91d1\u878d\u5e94\u7528\u7684\u9002\u5f53\u6027\u8bc4\u4f30\u4e0e\u6d88\u8d39\u8005\u4fdd\u62a4\u63d0\u4f9b\u53ef\u590d\u7528\u57fa\u51c6\uff0c\u4f46\u7ed3\u679c\u4e3b\u8981\u53cd\u6620 GPT-4o \u5728\u5408\u6210\u4eba\u7269\u573a\u666f\u4e0b\u7684\u8868\u73b0\u3002"}, {"abstract": "Real-world forecasting often requires integrating heterogeneous evidence whose predictive value varies across horizons, operating regimes, and domains. We introduce FACTS-MAS, a domain-agnostic multi-agent forecasting framework that decomposes evidence into specialized channels for temporal dynamics, exogenous context, seasonality, structural information, and discrete events. Each agent generates an independently testable forecast through a common interface, while leakage-safe historical validation measures its predictive skill relative to a naive reference. These skill estimates are used to weight and combine agent forecasts, so that uninformative evidence is either removed or downweighted rather than forced to participate. A calibration procedure selects domain-specific constant means based on historical validation folds. We evaluate FACTS-MAS on weekly for-sale housing inventory from Zillow and weekly unemployment insurance claims from FRED, for 15 U.S. metropolitan areas at 4-, 8-, and 13-week forecasting horizons. Our method outperforms both a naive last-value forecast method and the TimesFM foundation model. However, a factor-adjusted exponential smoothing model performs as well as the fused forecast. The evidence therefore supports FACTS-MAS as a systematic protocol for testing, calibrating, and recomposing evidence channels before assembling them into the strongest single model for a specific application domain. Code, data, and results are available at https://github.com/Madumita24/FACTS-MAS.", "arxiv_id": "2610.38225", "arxiv_url": "https://arxiv.org/abs/2610.38225", "authors": ["Madumita Karthikeyan", "Umang Rajnikant Bid", "Rong Pan"], "brief": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u9884\u6d4b\u6846\u67b6\uff0c\u5c06\u5f02\u8d28\u8bc1\u636e\u62c6\u5206\u4e3a\u4e13\u95e8\u901a\u9053\uff0c\u901a\u8fc7\u9632\u6b62\u6570\u636e\u6cc4\u6f0f\u7684\u5386\u53f2\u9a8c\u8bc1\u8bc4\u4f30\u9884\u6d4b\u80fd\u529b\uff0c\u5e76\u52a0\u6743\u878d\u5408\u6216\u5254\u9664\u65e0\u6548\u8bc1\u636e\u3002\u5728\u7f8e\u56fd15\u4e2a\u90fd\u5e02\u533a\u7684\u4f4f\u623f\u5e93\u5b58\u4e0e\u5931\u4e1a\u4fdd\u9669\u7533\u9886\u9884\u6d4b\u4e2d\uff0c\u4f18\u4e8e\u672b\u503c\u57fa\u7ebf\u548c\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\uff0c\u4f46\u4e0e\u56e0\u5b50\u8c03\u6574\u7684\u6307\u6570\u5e73\u6ed1\u6a21\u578b\u8868\u73b0\u76f8\u5f53\uff0c\u4e3b\u8981\u4ef7\u503c\u5728\u4e8e\u7cfb\u7edf\u5316\u68c0\u9a8c\u3001\u6821\u51c6\u4e0e\u91cd\u7ec4\u8bc1\u636e\u3002", "categories": ["cs.AI", "stat.AP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38225", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u667a\u80fd\u4f53", "\u65f6\u95f4\u5e8f\u5217\u9884\u6d4b", "\u8bc1\u636e\u878d\u5408"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38225v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FACTS-MAS: A Multi-Agent Architecture for Adaptive Forecasting from Heterogeneous Evidence", "tldr": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u9884\u6d4b\u6846\u67b6\uff0c\u5c06\u5f02\u8d28\u8bc1\u636e\u62c6\u5206\u4e3a\u4e13\u95e8\u901a\u9053\uff0c\u901a\u8fc7\u9632\u6b62\u6570\u636e\u6cc4\u6f0f\u7684\u5386\u53f2\u9a8c\u8bc1\u8bc4\u4f30\u9884\u6d4b\u80fd\u529b\uff0c\u5e76\u52a0\u6743\u878d\u5408\u6216\u5254\u9664\u65e0\u6548\u8bc1\u636e\u3002\u5728\u7f8e\u56fd15\u4e2a\u90fd\u5e02\u533a\u7684\u4f4f\u623f\u5e93\u5b58\u4e0e\u5931\u4e1a\u4fdd\u9669\u7533\u9886\u9884\u6d4b\u4e2d\uff0c\u4f18\u4e8e\u672b\u503c\u57fa\u7ebf\u548c\u65f6\u95f4\u5e8f\u5217\u57fa\u7840\u6a21\u578b\uff0c\u4f46\u4e0e\u56e0\u5b50\u8c03\u6574\u7684\u6307\u6570\u5e73\u6ed1\u6a21\u578b\u8868\u73b0\u76f8\u5f53\uff0c\u4e3b\u8981\u4ef7\u503c\u5728\u4e8e\u7cfb\u7edf\u5316\u68c0\u9a8c\u3001\u6821\u51c6\u4e0e\u91cd\u7ec4\u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robot imitation learning uses demonstrations from operators of varying skill, but selecting training data remains challenging. Existing methods score demonstrations using smoothness, diversity, or estimated influence on policy performance, but differences in selection and evaluation protocols make it difficult to determine whether they outperform simple baselines. We introduce \\textbf{CuraEval}, a framework combining mathematical analysis of demonstration scores with controlled comparisons against fixed size-matched random subsets and full-data training on mixed-skill robomimic data using Diffusion Policy and BC-RNN. We show that the evaluated PSD score depends only on episode length and squared position magnitudes, and produces nearly the same ranking as episode length on \\textit{square} ($\u03c1=0.999$). With Diffusion Policy, selecting the shortest 50\\% of demonstrations improves \\textit{square} success from 70.7\\% under random selection to 76.5\\%. Compared with random selection, our adapted geometric-entropy LOO selector reduces success at 25\\% retention from 94.7\\% to 74.0\\% on \\textit{can} and achieves 41.7\\% on \\textit{square}, below the mean success rates of all three independently sampled random subsets (59.8--62.5\\%). On the same 3 \\textit{square} Diffusion Policy training seeds, length-based selection at 75\\% retention improves success over full-data training from 76.7\\% to 86.7\\% under the original protocol, but lowers it from 80.5\\% to 79.5\\% after checkpoint reporting, rollout count, and evaluation seed change jointly. No evaluated curated condition significantly outperforms full-data training after Holm correction, although confidence intervals still permit useful gains. Code is available at https://github.com/jiuyixu25/CuraEval.", "arxiv_id": "2610.38221", "arxiv_url": "https://arxiv.org/abs/2610.38221", "authors": ["Jiuyi Xu", "Meida Chen", "Yang Ye", "Yangming Shi"], "brief": "\u63d0\u51fa\u673a\u5668\u4eba\u793a\u8303\u6570\u636e\u7b5b\u9009\u8bc4\u6d4b\u6846\u67b6\uff0c\u901a\u8fc7\u6570\u5b66\u5206\u6790\u53ca\u4e0e\u7b49\u89c4\u6a21\u968f\u673a\u5b50\u96c6\u3001\u5168\u91cf\u8bad\u7ec3\u7684\u53d7\u63a7\u6bd4\u8f83\uff0c\u68c0\u9a8c\u6df7\u5408\u6280\u80fd\u6570\u636e\u7684\u7b5b\u9009\u6548\u679c\u3002\u7ed3\u679c\u8868\u660e\uff0c\u90e8\u5206\u8bc4\u5206\u51e0\u4e4e\u7b49\u540c\u4e8e\u793a\u8303\u957f\u5ea6\uff0c\u7b5b\u9009\u6536\u76ca\u5bf9\u8bc4\u6d4b\u534f\u8bae\u654f\u611f\uff0c\u4e14\u591a\u91cd\u6bd4\u8f83\u6821\u6b63\u540e\u6ca1\u6709\u7b5b\u9009\u65b9\u6848\u663e\u8457\u4f18\u4e8e\u5168\u91cf\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38221", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u6a21\u4eff\u5b66\u4e60", "\u6570\u636e\u7b5b\u9009", "\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38221v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CuraEval: Evaluating Demonstration Curation on Mixed-Skill Robot Data", "tldr": "\u63d0\u51fa\u673a\u5668\u4eba\u793a\u8303\u6570\u636e\u7b5b\u9009\u8bc4\u6d4b\u6846\u67b6\uff0c\u901a\u8fc7\u6570\u5b66\u5206\u6790\u53ca\u4e0e\u7b49\u89c4\u6a21\u968f\u673a\u5b50\u96c6\u3001\u5168\u91cf\u8bad\u7ec3\u7684\u53d7\u63a7\u6bd4\u8f83\uff0c\u68c0\u9a8c\u6df7\u5408\u6280\u80fd\u6570\u636e\u7684\u7b5b\u9009\u6548\u679c\u3002\u7ed3\u679c\u8868\u660e\uff0c\u90e8\u5206\u8bc4\u5206\u51e0\u4e4e\u7b49\u540c\u4e8e\u793a\u8303\u957f\u5ea6\uff0c\u7b5b\u9009\u6536\u76ca\u5bf9\u8bc4\u6d4b\u534f\u8bae\u654f\u611f\uff0c\u4e14\u591a\u91cd\u6bd4\u8f83\u6821\u6b63\u540e\u6ca1\u6709\u7b5b\u9009\u65b9\u6848\u663e\u8457\u4f18\u4e8e\u5168\u91cf\u8bad\u7ec3\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Clinical large language models are increasingly fielded as multi-agent teams, on the assumption that deliberation averages out individual error. It does not average out bias. Across a full factorial of five model families and four aggregation topologies on 120 real MIMIC-IV emergency cases under counterfactual demographic swaps, no configuration neutralizes the disparity: all 20 cells commit the direction of their agents\u0027 independent answers, giving Black patients more acute triage. Every model has a topology that amplifies its baseline gap, but which one varies by model, so no design is reliably safe or reliably amplifying: the disparity is relocated, never removed. Late-stage fixes fail: fairness instructions and demographic masking leave the gap untouched, and per-agent self-debiasing widens it, because the bias is already encoded in the agents\u0027 ordinary clinical numbers. We call this disparity laundering; the audits now applied to clinical AI, per model, per output, per version, can certify the parts but never the committed decision. Interventions close the gap exactly when they make counterfactual versions visible inside the system and pool them, through deliberation, into the committed decision. A diverse-perspective ensemble does both while keeping the team, with no retraining or architectural change: the disparity falls by 67 to 94% where all five perspectives pool at every round, and the one topology that never pools them is the one it cannot reliably repair. Medical multi-agent systems do not filter demographic bias; they launder it into plausible decisions no single-version audit can catch, and the only defense is to make the bias visible.", "arxiv_id": "2610.38215", "arxiv_url": "https://arxiv.org/abs/2610.38215", "authors": ["Xiaoyang Wang", "Tianrui Wang", "Christopher C. Yang"], "brief": "\u5728120\u4f8b\u771f\u5b9e\u6025\u8bca\u75c5\u4f8b\u4e0a\u6d4b\u8bd5\u4e94\u7c7b\u6a21\u578b\u4e0e\u56db\u79cd\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u7ed3\u6784\uff0c\u53d1\u73b0\u6240\u6709\u914d\u7f6e\u5747\u5ef6\u7eed\u4e86\u5bf9\u9ed1\u4eba\u60a3\u8005\u5206\u8bca\u66f4\u7d27\u6025\u7684\u504f\u5dee\uff0c\u516c\u5e73\u6307\u4ee4\u4e0e\u4eba\u53e3\u5c5e\u6027\u906e\u853d\u4e5f\u672a\u80fd\u6d88\u9664\u5dee\u8ddd\u3002\u5c06\u53cd\u4e8b\u5b9e\u4eba\u53e3\u5c5e\u6027\u7248\u672c\u7eb3\u5165\u56e2\u961f\u8ba8\u8bba\u5e76\u5728\u6bcf\u8f6e\u6c47\u603b\uff0c\u53ef\u4f7f\u5dee\u8ddd\u7f29\u5c0f67%\u81f394%\uff0c\u4e14\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u6216\u4fee\u6539\u67b6\u6784\u3002", "categories": ["cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38215", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u7597\u4eba\u5de5\u667a\u80fd", "\u7b97\u6cd5\u516c\u5e73\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38215v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Disparity Laundering: Consensus Without Fairness in Clinical Multi-Agent Systems", "tldr": "\u5728120\u4f8b\u771f\u5b9e\u6025\u8bca\u75c5\u4f8b\u4e0a\u6d4b\u8bd5\u4e94\u7c7b\u6a21\u578b\u4e0e\u56db\u79cd\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u7ed3\u6784\uff0c\u53d1\u73b0\u6240\u6709\u914d\u7f6e\u5747\u5ef6\u7eed\u4e86\u5bf9\u9ed1\u4eba\u60a3\u8005\u5206\u8bca\u66f4\u7d27\u6025\u7684\u504f\u5dee\uff0c\u516c\u5e73\u6307\u4ee4\u4e0e\u4eba\u53e3\u5c5e\u6027\u906e\u853d\u4e5f\u672a\u80fd\u6d88\u9664\u5dee\u8ddd\u3002\u5c06\u53cd\u4e8b\u5b9e\u4eba\u53e3\u5c5e\u6027\u7248\u672c\u7eb3\u5165\u56e2\u961f\u8ba8\u8bba\u5e76\u5728\u6bcf\u8f6e\u6c47\u603b\uff0c\u53ef\u4f7f\u5dee\u8ddd\u7f29\u5c0f67%\u81f394%\uff0c\u4e14\u65e0\u9700\u91cd\u65b0\u8bad\u7ec3\u6216\u4fee\u6539\u67b6\u6784\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Coding agents are typically provided end-to-end behavioral specifications that the code they produce should satisfy, such as tests and input--output examples. How many such specifications must a developer provide, and which ones, for the agent to produce the developer\u0027s intended program? We argue that this cannot be determined a priori, for it depends on the structure of the implementation, which is left to the agent to decide. An agent first commits to a structure---a decomposition into data types, modules, and functions---which fixes a class of candidate programs; behavioral specifications then select a program within that class. A set of tests that suffices for one structure may leave another badly underdetermined, requiring different edge cases or exponentially more examples. Since the structure is chosen by the agent, developers cannot ensure their specification is complete without reverse-engineering it from thousands of lines of generated code. To resolve this, we introduce Skeleton Coding, in which developers jointly specify the structure---in high-level, code-like format---alongside behavioral specifications. Theoretically, we model AI-assisted coding as a control problem, and show that skeletons can reduce exponentially the number of tests developers must supply to steer an agent toward an acceptable program. Empirically, across four models and three benchmarks, the best-performing skeleton specifications reduce mean test error by 48.4% relative to the best end-to-end behavioral specifications. Even when the agent can query a complete reference implementation, adding a skeleton reduces mean test error relatively by up to 27.0%. Skeletons also narrow the average gap between small and large models by about 52.4% while lowering implementation cost by 15--26x, and reduce code erosion by 24.7% on average.", "arxiv_id": "2610.38214", "arxiv_url": "https://arxiv.org/abs/2610.38214", "authors": ["Aditya Golatkar", "Alessandro Achille", "Renos Zabounidis", "Vlad Sobal", "Yangruibo Ding", "Baishakhi Ray", "Jonathan Buck", "Guy Van den Broeck", "Maryam Fazel", "Pietro Perona", "Wei Xia", "Stefano Soatto"], "brief": "\u63d0\u51fa\u9aa8\u67b6\u5f0f\u7f16\u7a0b\uff0c\u8ba9\u5f00\u53d1\u8005\u7528\u9ad8\u5c42\u4ee3\u7801\u5f62\u5f0f\u6307\u5b9a\u7a0b\u5e8f\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408\u884c\u4e3a\u6d4b\u8bd5\u5f15\u5bfc\u7f16\u7a0b\u667a\u80fd\u4f53\uff0c\u7406\u8bba\u4e0a\u53ef\u6307\u6570\u7ea7\u51cf\u5c11\u6240\u9700\u6d4b\u8bd5\u6570\u91cf\u3002\u5728\u56db\u4e2a\u6a21\u578b\u3001\u4e09\u4e2a\u57fa\u51c6\u4e0a\uff0c\u6700\u4f73\u9aa8\u67b6\u89c4\u8303\u76f8\u6bd4\u6700\u4f73\u7aef\u5230\u7aef\u884c\u4e3a\u89c4\u8303\u5c06\u5e73\u5747\u6d4b\u8bd5\u9519\u8bef\u964d\u4f4e48.4%\uff0c\u540c\u65f6\u7f29\u5c0f\u5927\u5c0f\u6a21\u578b\u5dee\u8ddd\u5e76\u964d\u4f4e\u5b9e\u73b0\u6210\u672c\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38214", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38214v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Skeleton Coding: Program Structure as a Specification for Agents", "tldr": "\u63d0\u51fa\u9aa8\u67b6\u5f0f\u7f16\u7a0b\uff0c\u8ba9\u5f00\u53d1\u8005\u7528\u9ad8\u5c42\u4ee3\u7801\u5f62\u5f0f\u6307\u5b9a\u7a0b\u5e8f\u7ed3\u6784\uff0c\u5e76\u7ed3\u5408\u884c\u4e3a\u6d4b\u8bd5\u5f15\u5bfc\u7f16\u7a0b\u667a\u80fd\u4f53\uff0c\u7406\u8bba\u4e0a\u53ef\u6307\u6570\u7ea7\u51cf\u5c11\u6240\u9700\u6d4b\u8bd5\u6570\u91cf\u3002\u5728\u56db\u4e2a\u6a21\u578b\u3001\u4e09\u4e2a\u57fa\u51c6\u4e0a\uff0c\u6700\u4f73\u9aa8\u67b6\u89c4\u8303\u76f8\u6bd4\u6700\u4f73\u7aef\u5230\u7aef\u884c\u4e3a\u89c4\u8303\u5c06\u5e73\u5747\u6d4b\u8bd5\u9519\u8bef\u964d\u4f4e48.4%\uff0c\u540c\u65f6\u7f29\u5c0f\u5927\u5c0f\u6a21\u578b\u5dee\u8ddd\u5e76\u964d\u4f4e\u5b9e\u73b0\u6210\u672c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Weight-only, lossy quantization substantially reduces the storage and memory requirements for serving large language models (LLMs), but the growing key-value (KV) cache remains a bottleneck for long-context inference on personal devices. We present Group-Adaptive Additive Codec (GAAC), a lossless KV compression and serving system that exploits exponent redundancy to reduce storage and accelerate attention without introducing KV approximation. GAAC encodes BF16 exponents using calibrated per-channel base-plus-offset codes over contiguous ranges. GAAC adapts code widths across small groups while preserving KV values bit-for-bit. A fused attention kernel reconstructs KV tiles on the fly, avoiding full-cache decompression. Block-wise compression and fixed-capacity slots support incremental cache updates and paged serving. Across five tested models, GAAC achieves 1.405-1.407$\\times$ lossless BF16 KV compression. We also study compression performance on low-precision tensors FP8 E4M3 caches ( 1.09-1.14$\\times$) and E5M2 caches (1.25-1.30$\\times$). On NVIDIA DGX Spark, GAAC accelerates decode attention at a 64K-token context by 1.19-1.27$\\times$ and end-to-end W4A16 decode steps by 1.04-1.15$\\times$. In serving, it reduces resident KV memory by approximately 26% and increases aggregate throughput by 13-29% under comparable KV-memory budgets. On Apple M4, GAAC achieves 1.02-1.25$\\times$ attention speedups, demonstrating portability beyond NVIDIA GPUs.", "arxiv_id": "2610.38210", "arxiv_url": "https://arxiv.org/abs/2610.38210", "authors": ["Yipin Guo", "Arun M George", "Siddharth Joshi"], "brief": "\u63d0\u51fa\u9762\u5411\u4e2a\u4eba\u8bbe\u5907\u7684\u5927\u8bed\u8a00\u6a21\u578b\u952e\u503c\u7f13\u5b58\u65e0\u635f\u538b\u7f29\u7cfb\u7edf\uff0c\u5229\u7528\u6307\u6570\u5197\u4f59\u548c\u5206\u7ec4\u81ea\u9002\u5e94\u7f16\u7801\u538b\u7f29\u7f13\u5b58\uff0c\u5e76\u5728\u6ce8\u610f\u529b\u8ba1\u7b97\u4e2d\u5373\u65f6\u89e3\u7801\uff0c\u9010\u4f4d\u4fdd\u7559\u539f\u59cb\u6570\u503c\u3002\u4e94\u4e2a\u6a21\u578b\u4e0a\u5b9e\u73b0\u7ea61.41\u500d\u538b\u7f29\uff0c\u7f13\u5b58\u5e38\u9a7b\u5185\u5b58\u51cf\u5c11\u7ea626%\uff0c\u76f8\u540c\u7f13\u5b58\u5185\u5b58\u9884\u7b97\u4e0b\u670d\u52a1\u541e\u5410\u91cf\u63d0\u534713%\u81f329%\uff0c\u5e76\u5728\u82f1\u4f1f\u8fbe\u4e0e\u82f9\u679c\u8bbe\u5907\u4e0a\u5b9e\u73b0\u6ce8\u610f\u529b\u52a0\u901f\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38210", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u65e0\u635f\u538b\u7f29", "\u63a8\u7406\u52a0\u901f", "\u952e\u503c\u7f13\u5b58"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38210v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GAAC: Lossless KV Compression for Bandwidth-Efficient LLM Inference on Personal Devices", "tldr": "\u63d0\u51fa\u9762\u5411\u4e2a\u4eba\u8bbe\u5907\u7684\u5927\u8bed\u8a00\u6a21\u578b\u952e\u503c\u7f13\u5b58\u65e0\u635f\u538b\u7f29\u7cfb\u7edf\uff0c\u5229\u7528\u6307\u6570\u5197\u4f59\u548c\u5206\u7ec4\u81ea\u9002\u5e94\u7f16\u7801\u538b\u7f29\u7f13\u5b58\uff0c\u5e76\u5728\u6ce8\u610f\u529b\u8ba1\u7b97\u4e2d\u5373\u65f6\u89e3\u7801\uff0c\u9010\u4f4d\u4fdd\u7559\u539f\u59cb\u6570\u503c\u3002\u4e94\u4e2a\u6a21\u578b\u4e0a\u5b9e\u73b0\u7ea61.41\u500d\u538b\u7f29\uff0c\u7f13\u5b58\u5e38\u9a7b\u5185\u5b58\u51cf\u5c11\u7ea626%\uff0c\u76f8\u540c\u7f13\u5b58\u5185\u5b58\u9884\u7b97\u4e0b\u670d\u52a1\u541e\u5410\u91cf\u63d0\u534713%\u81f329%\uff0c\u5e76\u5728\u82f1\u4f1f\u8fbe\u4e0e\u82f9\u679c\u8bbe\u5907\u4e0a\u5b9e\u73b0\u6ce8\u610f\u529b\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-based agents now share experiences on social platforms and remember new preferences to enhance their performance. However, existing memory systems contain a vulnerability in role-to-principal attribution that attackers can exploit. We identify Role Grounding Misattribution, in which an attacker-designed interaction causes the victim agent to incorrectly record a preference from the attacker as a preference of the victim\u0027s user. Specifically, we are the first to formalize Role Grounding Attack (RGA), an attack model that exploits this vulnerability through nested conversation structures. In the memory formation stage, an experience-sharing post quoting a conversation between the attacker agent and its user is published, which explicitly identifies its publisher. The inner conversation expresses preferences from the user of the attacker agent. When the victim agent remembers preferences from this nested structure, its memory loses the context binding and grounds the attacker\u0027s preference to the victim\u0027s user instead. In the memory retrieval stage, the misattributed preference persists and influences the victim agent\u0027s decisions when it encounters relevant scenarios. We instantiate RGA as tool selection manipulation and privacy leakage. Tool selection manipulation causes a tool-call preference to be misattributed to the victim\u0027s user, steering the victim toward an attacker-controlled tool. Privacy leakage extends this by misattributing both a tool-call preference and a task-requirement preference to the victim\u0027s user. The victim selects the attacker\u0027s tool, then includes sensitive information in tool arguments to satisfy the task requirement. We evaluate RGA across five mainstream memory systems and six language models. Tool manipulation and privacy leakage both achieve high attack success rates. These results call for stronger role grounding.", "arxiv_id": "2610.38209", "arxiv_url": "https://arxiv.org/abs/2610.38209", "authors": ["Haoran Bu", "Yiting Shen", "Litian Zhang", "Ruihan Hu", "Xi Zhang"], "brief": "\u63d0\u51fa\u89d2\u8272\u5f52\u5c5e\u653b\u51fb\uff0c\u5229\u7528\u793e\u4ea4\u4e92\u52a8\u4e2d\u7684\u5d4c\u5957\u5bf9\u8bdd\uff0c\u4f7f\u667a\u80fd\u4f53\u5c06\u653b\u51fb\u8005\u7528\u6237\u7684\u504f\u597d\u8bef\u5b58\u4e3a\u81ea\u8eab\u7528\u6237\u7684\u504f\u597d\u3002\u8be5\u9519\u8bef\u8bb0\u5fc6\u53ef\u6301\u7eed\u8bf1\u5bfc\u667a\u80fd\u4f53\u8c03\u7528\u653b\u51fb\u8005\u63a7\u5236\u7684\u5de5\u5177\uff0c\u5e76\u5728\u5de5\u5177\u53c2\u6570\u4e2d\u6cc4\u9732\u654f\u611f\u4fe1\u606f\uff1b\u5728\u4e94\u79cd\u4e3b\u6d41\u8bb0\u5fc6\u7cfb\u7edf\u548c\u516d\u79cd\u8bed\u8a00\u6a21\u578b\u4e0a\u7684\u8bc4\u4f30\u5747\u663e\u793a\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\u3002", "categories": ["cs.CR", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38209", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u7cfb\u7edf", "\u5bf9\u6297\u653b\u51fb", "\u9690\u79c1\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38209v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Is it my preference? Role Grounding Attack against Agent\u0027s Memory via Social Interaction", "tldr": "\u63d0\u51fa\u89d2\u8272\u5f52\u5c5e\u653b\u51fb\uff0c\u5229\u7528\u793e\u4ea4\u4e92\u52a8\u4e2d\u7684\u5d4c\u5957\u5bf9\u8bdd\uff0c\u4f7f\u667a\u80fd\u4f53\u5c06\u653b\u51fb\u8005\u7528\u6237\u7684\u504f\u597d\u8bef\u5b58\u4e3a\u81ea\u8eab\u7528\u6237\u7684\u504f\u597d\u3002\u8be5\u9519\u8bef\u8bb0\u5fc6\u53ef\u6301\u7eed\u8bf1\u5bfc\u667a\u80fd\u4f53\u8c03\u7528\u653b\u51fb\u8005\u63a7\u5236\u7684\u5de5\u5177\uff0c\u5e76\u5728\u5de5\u5177\u53c2\u6570\u4e2d\u6cc4\u9732\u654f\u611f\u4fe1\u606f\uff1b\u5728\u4e94\u79cd\u4e3b\u6d41\u8bb0\u5fc6\u7cfb\u7edf\u548c\u516d\u79cd\u8bed\u8a00\u6a21\u578b\u4e0a\u7684\u8bc4\u4f30\u5747\u663e\u793a\u8f83\u9ad8\u653b\u51fb\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Designing power electronics converters traditionally requires intensive human expertise across topology sizing, commercial component selection, circuit simulation verification, and schematic drafting. While Large Language Models (LLMs) show promise in electronic design automation (EDA), applying standalone LLMs directly to board-level power electronics schematic synthesis suffers from severe engineering hallucinations, including inaccurate analytical sizing, fabricated or mismatched component part numbers, violated voltage derating margins, and broken topological connectivity. In this paper, we propose a Bounded Dual-Loop Automated Schematic Synthesis Framework that translates natural language specifications into verified, editable KiCad schematics and manufacturing deliverables. Our workflow integrates six stages across three functional columns: (1) requirement parsing and knowledge-driven power stage synthesis covering non-isolated (Buck, Boost) and isolated/resonant (Flyback, DAB, half-bridge LLC) topologies; (2) contract- and evidence-coordinated component selection grounded in distributor APIs and OEM datasheets, coupled with closed-loop ngspice transient verification and stress feedback; and (3) modular control hardware integration and multi-format deliverable generation featuring native KiCad netlist round-trip verification. End-to-end case studies on a 24-36V to 12V,2A Buck converter (29 positions, 83 verified terminals) and an isolated 48V to 24V, 0.5A, Dual-Active Bridge (DAB) converter (87 positions, 341 verified terminals), alongside comparative evaluations against a Vanilla LLM baseline, demonstrate that our framework improves component verification coverage from 22.2 to 98.6, nominal value consistency from 0 to 97.7, and SPICE simulation pass rates from 0 to 100.", "arxiv_id": "2610.38201", "arxiv_url": "https://arxiv.org/abs/2610.38201", "authors": ["Bowen Su", "Huan Chen", "Jiahua Ying", "Ran Ou", "Weilong Chen", "Li Xue", "Kai Sun"], "brief": "\u63d0\u51fa\u6709\u754c\u53cc\u95ed\u73af\u81ea\u52a8\u5316\u6846\u67b6\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u9700\u6c42\u8f6c\u5316\u4e3a\u7ecf\u8fc7\u9a8c\u8bc1\u3001\u53ef\u7f16\u8f91\u7684\u7535\u529b\u7535\u5b50\u539f\u7406\u56fe\u53ca\u5236\u9020\u4ea4\u4ed8\u6587\u4ef6\uff0c\u6574\u5408\u5668\u4ef6\u9009\u578b\u3001\u4eff\u771f\u53cd\u9988\u4e0e\u8fde\u901a\u6027\u6821\u9a8c\u3002\u5728\u964d\u538b\u548c\u9694\u79bb\u5f0f\u53cc\u6709\u6e90\u6865\u8f6c\u6362\u5668\u6848\u4f8b\u4e2d\uff0c\u76f8\u6bd4\u76f4\u63a5\u4f7f\u7528\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u5668\u4ef6\u9a8c\u8bc1\u8986\u76d6\u7387\u753122.2%\u63d0\u5347\u81f398.6%\uff0c\u6807\u79f0\u503c\u4e00\u81f4\u6027\u75310\u63d0\u5347\u81f397.7%\uff0c\u4eff\u771f\u901a\u8fc7\u7387\u75310\u63d0\u5347\u81f3100%\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38201", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7535\u5b50\u8bbe\u8ba1\u81ea\u52a8\u5316", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7535\u529b\u7535\u5b50", "\u95ed\u73af\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38201v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Natural Language to Real Schematics: An Automated Workflow for Power Electronics Schematic Synthesis", "tldr": "\u63d0\u51fa\u6709\u754c\u53cc\u95ed\u73af\u81ea\u52a8\u5316\u6846\u67b6\uff0c\u5c06\u81ea\u7136\u8bed\u8a00\u9700\u6c42\u8f6c\u5316\u4e3a\u7ecf\u8fc7\u9a8c\u8bc1\u3001\u53ef\u7f16\u8f91\u7684\u7535\u529b\u7535\u5b50\u539f\u7406\u56fe\u53ca\u5236\u9020\u4ea4\u4ed8\u6587\u4ef6\uff0c\u6574\u5408\u5668\u4ef6\u9009\u578b\u3001\u4eff\u771f\u53cd\u9988\u4e0e\u8fde\u901a\u6027\u6821\u9a8c\u3002\u5728\u964d\u538b\u548c\u9694\u79bb\u5f0f\u53cc\u6709\u6e90\u6865\u8f6c\u6362\u5668\u6848\u4f8b\u4e2d\uff0c\u76f8\u6bd4\u76f4\u63a5\u4f7f\u7528\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u5668\u4ef6\u9a8c\u8bc1\u8986\u76d6\u7387\u753122.2%\u63d0\u5347\u81f398.6%\uff0c\u6807\u79f0\u503c\u4e00\u81f4\u6027\u75310\u63d0\u5347\u81f397.7%\uff0c\u4eff\u771f\u901a\u8fc7\u7387\u75310\u63d0\u5347\u81f3100%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fast inference and strict constraint satisfaction are essential for learning-based decision-making. Existing methods often rely on constraint-specific projections or feasible-set parameterizations, while iterative repair can be costly. We introduce Convex-SKM-Net, a convex constraint-satisfaction layer that forms linearization halfspaces from residual and (sub)gradient oracles without constraint-specific inequality projectors. It applies fixed-depth dual projected-gradient descent (dual PGD) to minimum-displacement block problems using GPU-friendly matrix operations. We jointly learn the predictor and a positive-definite mobility, adapting the correction geometry to improve objective quality. We prove convergence of the outer iterates at fixed dual depth and linear convergence in distance under Slater\u0027s condition and bounded subgradients. All our test outputs on three second-order-cone model-predictive control (SOC-MPC) horizons and six power-system convex relaxations satisfy a $10^{-3}$ feasibility tolerance. Comparisons with the latest constraint-satisfaction methods show inference speedups of up to $144.3\\times$ on SOC-MPC and $7.7\\times$ on a convex quadratically constrained quadratic programming (QCQP) benchmark with joint training. On QCQP, the mean objective gap is $0.012\\%$, with full test feasibility at $10^{-4}$. Learning mobility reduces the five-seed affine-task mean gap by $22.4\\%$ and improves gaps in matched power-system comparisons.", "arxiv_id": "2610.38197", "arxiv_url": "https://arxiv.org/abs/2610.38197", "authors": ["Haoyu Zhu", "Xiaochen Zhang", "Qingchun Hou"], "brief": "\u63d0\u51fa\u4e00\u79cd\u795e\u7ecf\u7f51\u7edc\u51f8\u7ea6\u675f\u6ee1\u8db3\u5c42\uff0c\u901a\u8fc7\u7ebf\u6027\u5316\u534a\u7a7a\u95f4\u548c\u56fa\u5b9a\u6df1\u5ea6\u7684\u5bf9\u5076\u6295\u5f71\u68af\u5ea6\u4fee\u6b63\u9884\u6d4b\uff0c\u5e76\u8054\u5408\u5b66\u4e60\u4fee\u6b63\u51e0\u4f55\u4ee5\u6539\u5584\u76ee\u6807\u8d28\u91cf\uff0c\u540c\u65f6\u7ed9\u51fa\u6536\u655b\u4fdd\u8bc1\u3002\u6d4b\u8bd5\u8f93\u51fa\u5168\u90e8\u8fbe\u5230\u8bbe\u5b9a\u7684\u53ef\u884c\u6027\u5bb9\u5dee\uff0c\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u63a8\u7406\u6700\u9ad8\u52a0\u901f144.3\u500d\uff0c\u51f8\u4e8c\u6b21\u7ea6\u675f\u4f18\u5316\u57fa\u51c6\u6700\u9ad8\u52a0\u901f7.7\u500d\uff0c\u5e73\u5747\u76ee\u6807\u5dee\u8ddd\u4ec50.012%\u3002", "categories": ["cs.LG", "cs.AI", "math.OC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38197", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u51f8\u4f18\u5316", "\u7ea6\u675f\u6ee1\u8db3", "\u795e\u7ecf\u7f51\u7edc", "\u6a21\u578b\u9884\u6d4b\u63a7\u5236"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38197v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Convex-SKM-Net: Low-Latency Block Halfspace Corrections for Neural Convex Constraint Satisfaction", "tldr": "\u63d0\u51fa\u4e00\u79cd\u795e\u7ecf\u7f51\u7edc\u51f8\u7ea6\u675f\u6ee1\u8db3\u5c42\uff0c\u901a\u8fc7\u7ebf\u6027\u5316\u534a\u7a7a\u95f4\u548c\u56fa\u5b9a\u6df1\u5ea6\u7684\u5bf9\u5076\u6295\u5f71\u68af\u5ea6\u4fee\u6b63\u9884\u6d4b\uff0c\u5e76\u8054\u5408\u5b66\u4e60\u4fee\u6b63\u51e0\u4f55\u4ee5\u6539\u5584\u76ee\u6807\u8d28\u91cf\uff0c\u540c\u65f6\u7ed9\u51fa\u6536\u655b\u4fdd\u8bc1\u3002\u6d4b\u8bd5\u8f93\u51fa\u5168\u90e8\u8fbe\u5230\u8bbe\u5b9a\u7684\u53ef\u884c\u6027\u5bb9\u5dee\uff0c\u6a21\u578b\u9884\u6d4b\u63a7\u5236\u63a8\u7406\u6700\u9ad8\u52a0\u901f144.3\u500d\uff0c\u51f8\u4e8c\u6b21\u7ea6\u675f\u4f18\u5316\u57fa\u51c6\u6700\u9ad8\u52a0\u901f7.7\u500d\uff0c\u5e73\u5747\u76ee\u6807\u5dee\u8ddd\u4ec50.012%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Industrial shampoo-bottle surface defect detection must operate across many stock keeping units (SKUs), where differences in bottle geometry, material, label layout, reflectance, and imaging conditions can substantially alter the appearance of the same defect. Existing industrial defect datasets rarely provide both instance-level defect annotations and product-variant identities, making it difficult to study SKU-aware detection under realistic manufacturing conditions. We introduce Bottle-SKU, a large-scale multi-SKU benchmark for shampoo bottle surface defect detection. Bottle-SKU contains 13,119 images, 20,419 instance-level bounding boxes, seven defect categories, and 48 bottle SKUs, enabling evaluation of both shared defect recognition and SKU-specific appearance variation. To address the challenge of SKU-specific appearance variation, we propose Prototype-Guided Dynamic Domain Modulation (ProDMM). ProDMM constructs a visual prototype for each SKU from training images and predicts a soft SKU distribution for each input. The resulting prototype-conditioned representation dynamically generates low-rank Query/Value modulation for the visual backbone and residual conditioning for defect-text-to-visual attention, while preserving the pretrained Grounding DINO detection pathway. The model is trained jointly with detection, SKU-domain classification, and modulation-regularization objectives. Experiments on Bottle-SKU and the public GC10-DET-SKU metallic surface defect dataset demonstrate the effectiveness of prototype-guided domain conditioning for industrial surface defect detection.", "arxiv_id": "2610.38194", "arxiv_url": "https://arxiv.org/abs/2610.38194", "authors": ["Yuehang Li", "Xiao Wang", "Qiang Chen", "Yangyi Fan", "Bo Jiang", "Yaowei Wang", "Jin Tang"], "brief": "\u63d0\u51fa\u6d17\u53d1\u6c34\u74f6\u8868\u9762\u7f3a\u9677\u68c0\u6d4b\u57fa\u51c6\uff0c\u5305\u542b13119\u5f20\u56fe\u50cf\u300120419\u4e2a\u7f3a\u9677\u6846\u30017\u7c7b\u7f3a\u9677\u53ca48\u79cd\u4ea7\u54c1\u89c4\u683c\u3002\u901a\u8fc7\u4ea7\u54c1\u89c4\u683c\u89c6\u89c9\u539f\u578b\u52a8\u6001\u8c03\u5236\u68c0\u6d4b\u6a21\u578b\uff0c\u9002\u5e94\u4e0d\u540c\u74f6\u578b\u3001\u6750\u8d28\u548c\u6210\u50cf\u6761\u4ef6\u5e26\u6765\u7684\u5916\u89c2\u53d8\u5316\uff1b\u5728\u81ea\u5efa\u57fa\u51c6\u4e0e\u516c\u5f00\u91d1\u5c5e\u8868\u9762\u7f3a\u9677\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\uff0c\u4f46\u6458\u8981\u672a\u63d0\u4f9b\u5177\u4f53\u63d0\u5347\u5e45\u5ea6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38194", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f3a\u9677\u68c0\u6d4b", "\u76ee\u6807\u68c0\u6d4b", "\u57df\u9002\u5e94", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38194v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prototype-Guided Dynamic Domain Modulation and a Large-Scale Multi-SKU Benchmark for Shampoo Bottle Surface Defect Detection", "tldr": "\u63d0\u51fa\u6d17\u53d1\u6c34\u74f6\u8868\u9762\u7f3a\u9677\u68c0\u6d4b\u57fa\u51c6\uff0c\u5305\u542b13119\u5f20\u56fe\u50cf\u300120419\u4e2a\u7f3a\u9677\u6846\u30017\u7c7b\u7f3a\u9677\u53ca48\u79cd\u4ea7\u54c1\u89c4\u683c\u3002\u901a\u8fc7\u4ea7\u54c1\u89c4\u683c\u89c6\u89c9\u539f\u578b\u52a8\u6001\u8c03\u5236\u68c0\u6d4b\u6a21\u578b\uff0c\u9002\u5e94\u4e0d\u540c\u74f6\u578b\u3001\u6750\u8d28\u548c\u6210\u50cf\u6761\u4ef6\u5e26\u6765\u7684\u5916\u89c2\u53d8\u5316\uff1b\u5728\u81ea\u5efa\u57fa\u51c6\u4e0e\u516c\u5f00\u91d1\u5c5e\u8868\u9762\u7f3a\u9677\u6570\u636e\u96c6\u4e0a\u9a8c\u8bc1\u4e86\u6709\u6548\u6027\uff0c\u4f46\u6458\u8981\u672a\u63d0\u4f9b\u5177\u4f53\u63d0\u5347\u5e45\u5ea6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Test-time training (TTT) layers replace the linear fast-weight memory of modern recurrent architectures with a small neural network trained online by gradient descent. This nonlinear memory is more expressive than the linear memories of Gated DeltaNet and Mamba-2, but is difficult to parallelize: existing implementations such as TTT-MLP rely on sequential, block-wise weight updates that run several times slower than chunkwise-parallel linear recurrences. Moreover, their block-wise execution only approximates the token-by-token online recurrence, whereas linear recurrences admit an exact chunkwise-parallel evaluation. We introduce ParaTTT (PTTT), an algorithm for parallelizing arbitrarily deep nonlinear memories by iteratively refining estimates of the inner-loop gradient trajectory. Starting from a guess of the hidden-layer gradients, each refinement consists of three chunkwise-parallel passes: a forward pass that evaluates the resulting feature trajectory, an exact gated-delta-rule pass that computes the readout trajectory and its feature gradients, and a backward pass that propagates these gradients into a new estimate. The exact online gradient descent recurrence is a fixed point of the iteration, while decoding requires no refinement iterations. We prove geometric convergence for a two-layer variant under sufficient contraction conditions. In practice, two iterations suffice. With two refinement steps at 4K context, PTTT evaluates the inner-loop trajectory $32\\times$ faster than TTT-MLP with the block approximation at matched error, while the full 340M model trains $4.9\\times$ faster. Models trained at 340M and 1.3B parameters match or exceed Gated DeltaNet and Mamba-2 and remain competitive with same-size Transformers on language-modeling perplexity and zero-shot accuracy, with better recall than the linear recurrences.", "arxiv_id": "2610.38255", "arxiv_url": "https://arxiv.org/abs/2610.38255", "authors": ["Noel Loo", "Neehal Tumma", "T. Konstantin Rusch", "Mathias Lechner", "Alexander Amini", "Daniela Rus"], "brief": "\u63d0\u51fa\u4e00\u79cd\u901a\u8fc7\u8fed\u4ee3\u7ec6\u5316\u5185\u5faa\u73af\u68af\u5ea6\u8f68\u8ff9\uff0c\u5c06\u4efb\u610f\u6df1\u5ea6\u975e\u7ebf\u6027\u8bb0\u5fc6\u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u5c42\u5e76\u884c\u5316\u7684\u65b9\u6cd5\uff0c\u5e76\u5728\u5145\u5206\u6536\u7f29\u6761\u4ef6\u4e0b\u8bc1\u660e\u4e24\u5c42\u7248\u672c\u7684\u51e0\u4f55\u6536\u655b\u3002\u5b9e\u8df5\u4e2d\u4ec5\u9700\u4e24\u6b21\u8fed\u4ee3\uff0c\u5728\u56db\u5343\u8bcd\u5143\u4e0a\u4e0b\u6587\u3001\u76f8\u540c\u8bef\u5dee\u4e0b\uff0c\u5185\u5faa\u73af\u8ba1\u7b97\u6bd4\u539f\u6709\u591a\u5c42\u611f\u77e5\u673a\u65b9\u6848\u5feb32\u500d\uff0c\u5b8c\u6574\u6a21\u578b\u8bad\u7ec3\u5feb4.9\u500d\uff1b\u8bed\u8a00\u5efa\u6a21\u8868\u73b0\u8fbe\u5230\u6216\u8d85\u8fc7\u7ebf\u6027\u9012\u5f52\u6a21\u578b\uff0c\u4e14\u8bb0\u5fc6\u53ec\u56de\u66f4\u597d\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38255", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u8bad\u7ec3", "\u5e76\u884c\u8ba1\u7b97", "\u975e\u7ebf\u6027\u8bb0\u5fc6", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38255v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ParaTTT: Parallelizing Test-Time Training Layers with Deep Memories", "tldr": "\u63d0\u51fa\u4e00\u79cd\u901a\u8fc7\u8fed\u4ee3\u7ec6\u5316\u5185\u5faa\u73af\u68af\u5ea6\u8f68\u8ff9\uff0c\u5c06\u4efb\u610f\u6df1\u5ea6\u975e\u7ebf\u6027\u8bb0\u5fc6\u7684\u6d4b\u8bd5\u65f6\u8bad\u7ec3\u5c42\u5e76\u884c\u5316\u7684\u65b9\u6cd5\uff0c\u5e76\u5728\u5145\u5206\u6536\u7f29\u6761\u4ef6\u4e0b\u8bc1\u660e\u4e24\u5c42\u7248\u672c\u7684\u51e0\u4f55\u6536\u655b\u3002\u5b9e\u8df5\u4e2d\u4ec5\u9700\u4e24\u6b21\u8fed\u4ee3\uff0c\u5728\u56db\u5343\u8bcd\u5143\u4e0a\u4e0b\u6587\u3001\u76f8\u540c\u8bef\u5dee\u4e0b\uff0c\u5185\u5faa\u73af\u8ba1\u7b97\u6bd4\u539f\u6709\u591a\u5c42\u611f\u77e5\u673a\u65b9\u6848\u5feb32\u500d\uff0c\u5b8c\u6574\u6a21\u578b\u8bad\u7ec3\u5feb4.9\u500d\uff1b\u8bed\u8a00\u5efa\u6a21\u8868\u73b0\u8fbe\u5230\u6216\u8d85\u8fc7\u7ebf\u6027\u9012\u5f52\u6a21\u578b\uff0c\u4e14\u8bb0\u5fc6\u53ec\u56de\u66f4\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Offline reinforcement learning seeks to learn decision policies from previously collected data, but deployment environments may differ from the domains in which the data were collected, and logged variables may omit confounders that affected both historical actions and outcomes. We study offline policy learning under the joint challenges of domain discrepancy and unmeasured confounding, where multiple heterogeneous source datasets provide complementary information about a target domain. We develop a causally adjusted transportability framework combining transportability theory with instrumental variables, negative controls, and proxies to identify target-domain causal quantities. For confounded contextual bandits, identification reduces to systems of bridge-function integral equations, enabling minimax estimation from finite samples. Confidence sets for the identified quantities are then used for pessimistic policy optimization, yielding CAT-CCB. We extend the framework to episodic confounded Markov decision processes, where complementary sources identify target reward and transition mechanisms under structural and completeness conditions. Under Gaussian dynamics and linear function approximation, this yields CAT-CMDP. We establish high-probability finite-sample suboptimality guarantees that quantify the effects of approximation, estimation, source-to-target shift, offline coverage, and sample size. For bounded finite-dimensional linear classes, the contextual-bandit guarantee recovers the standard $\\widetilde{\\mathcal O}(N^{-1/2})$ rate. Numerical experiments support the effectiveness of the framework for learning target-domain policies from heterogeneous confounded data. Together, the results provide a principled approach when no single source dataset suffices for causal identification and policy optimization.", "arxiv_id": "2610.38253", "arxiv_url": "https://arxiv.org/abs/2610.38253", "authors": ["Junyi Liao", "Hangqi Ren", "Zhuoran Yang"], "brief": "\u63d0\u51fa\u56e0\u679c\u6821\u6b63\u7684\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u878d\u5408\u591a\u4e2a\u5f02\u8d28\u6570\u636e\u6e90\uff0c\u89e3\u51b3\u90e8\u7f72\u73af\u5883\u53d8\u5316\u4e0e\u672a\u89c2\u6d4b\u6df7\u6742\u540c\u65f6\u5b58\u5728\u65f6\u7684\u7b56\u7565\u5b66\u4e60\u95ee\u9898\u3002\u901a\u8fc7\u56e0\u679c\u8bc6\u522b\u4e0e\u60b2\u89c2\u7b56\u7565\u4f18\u5316\uff0c\u4e3a\u4e0a\u4e0b\u6587\u8001\u864e\u673a\u548c\u5206\u5e55\u9a6c\u5c14\u53ef\u592b\u51b3\u7b56\u8fc7\u7a0b\u63d0\u4f9b\u6709\u9650\u6837\u672c\u6027\u80fd\u4fdd\u8bc1\uff1b\u5728\u7ebf\u6027\u4e0a\u4e0b\u6587\u8001\u864e\u673a\u8bbe\u5b9a\u4e0b\u6062\u590d\u6807\u51c6\u6536\u655b\u901f\u7387\uff0c\u6570\u503c\u5b9e\u9a8c\u652f\u6301\u5176\u6709\u6548\u6027\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38253", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60", "\u56e0\u679c\u63a8\u65ad", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38253v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Transportable Offline Reinforcement Learning in Presence of Unmeasured Confounding", "tldr": "\u63d0\u51fa\u56e0\u679c\u6821\u6b63\u7684\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u878d\u5408\u591a\u4e2a\u5f02\u8d28\u6570\u636e\u6e90\uff0c\u89e3\u51b3\u90e8\u7f72\u73af\u5883\u53d8\u5316\u4e0e\u672a\u89c2\u6d4b\u6df7\u6742\u540c\u65f6\u5b58\u5728\u65f6\u7684\u7b56\u7565\u5b66\u4e60\u95ee\u9898\u3002\u901a\u8fc7\u56e0\u679c\u8bc6\u522b\u4e0e\u60b2\u89c2\u7b56\u7565\u4f18\u5316\uff0c\u4e3a\u4e0a\u4e0b\u6587\u8001\u864e\u673a\u548c\u5206\u5e55\u9a6c\u5c14\u53ef\u592b\u51b3\u7b56\u8fc7\u7a0b\u63d0\u4f9b\u6709\u9650\u6837\u672c\u6027\u80fd\u4fdd\u8bc1\uff1b\u5728\u7ebf\u6027\u4e0a\u4e0b\u6587\u8001\u864e\u673a\u8bbe\u5b9a\u4e0b\u6062\u590d\u6807\u51c6\u6536\u655b\u901f\u7387\uff0c\u6570\u503c\u5b9e\u9a8c\u652f\u6301\u5176\u6709\u6548\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study adversarial linear bandits with strong corruption, in which an adaptive adversary chooses the reward vectors and a strong adversary corrupts each observed reward after seeing the learner\u0027s action, subject to a known total corruption budget $C$. Strong corruption breaks the importance-weighted reward estimates used by adversarial bandit algorithms: by corrupting only the rounds in which a rarely sampled action is drawn, the adversary amplifies each unit of corruption by the inverse of its sampling probability. The best known bound for this problem, $\\tilde O(\\sqrt{d^3T} + dC)$ by Liu et al. (2024), is a factor $\\sqrt{d}$ above the corruption-free rate in its leading term, and whether $\\tilde O(d\\sqrt{T} + dC)$ regret is achievable was left open. We propose CRW-FTRL, which runs follow-the-regularized-leader with a radius-weighted entropy regularizer and estimates rewards with a normalized kernel estimator whose sensitivity to corruption is governed by per-action radii instead of inverse sampling probabilities. The radii are nondecreasing and are chosen jointly with the sampling distribution through a monotone log-determinant barrier problem, so that a negative linear term in the regularizer cancels both the corruption bias and the estimation error of every comparator. For $K$ actions in $\\mathbb{R}^d$, CRW-FTRL achieves $\\tilde O(\\sqrt{dT\\log K} + dC)$ regret with high probability against an adaptive adversary, which matches the best known corruption-free rate and the $\u03a9(dC)$ lower bound up to logarithmic factors. Applied to a discretization of a general compact action set, it yields $\\tilde O(d\\sqrt{T} + dC)$ regret, which settles the statistical rate of corrupted adversarial linear bandits under strong corruption.", "arxiv_id": "2610.38243", "arxiv_url": "https://arxiv.org/abs/2610.38243", "authors": ["Qiwei Di", "Quanquan Gu"], "brief": "\u9488\u5bf9\u5bf9\u624b\u5728\u770b\u5230\u6240\u9009\u52a8\u4f5c\u540e\u7be1\u6539\u5956\u52b1\u7684\u7ebf\u6027\u8d4c\u535a\u673a\u95ee\u9898\uff0c\u63d0\u51fa\u7ed3\u5408\u534a\u5f84\u52a0\u6743\u71b5\u6b63\u5219\u5316\u4e0e\u5f52\u4e00\u5316\u6838\u4f30\u8ba1\u7684\u7b97\u6cd5\uff0c\u907f\u514d\u7a00\u6709\u52a8\u4f5c\u653e\u5927\u7be1\u6539\u5f71\u54cd\u3002\u5176\u9057\u61be\u754c\u8fbe\u5230\u8fd1\u4e4e\u6781\u5c0f\u6781\u5927\u6700\u4f18\uff0c\u65e2\u4fdd\u6301\u65e0\u7be1\u6539\u65f6\u7684\u6700\u4f18\u7edf\u8ba1\u901f\u7387\uff0c\u53c8\u4f7f\u7be1\u6539\u4ee3\u4ef7\u5339\u914d\u5df2\u77e5\u4e0b\u754c\uff0c\u89e3\u51b3\u4e86\u6b64\u524d\u5f00\u653e\u7684\u901f\u7387\u95ee\u9898\u3002", "categories": ["cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38243", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ebf\u6027\u8d4c\u535a\u673a", "\u5728\u7ebf\u5b66\u4e60", "\u9c81\u68d2\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38243v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Nearly Minimax Optimal Regret for Adversarial Linear Bandits with Strong Corruptions", "tldr": "\u9488\u5bf9\u5bf9\u624b\u5728\u770b\u5230\u6240\u9009\u52a8\u4f5c\u540e\u7be1\u6539\u5956\u52b1\u7684\u7ebf\u6027\u8d4c\u535a\u673a\u95ee\u9898\uff0c\u63d0\u51fa\u7ed3\u5408\u534a\u5f84\u52a0\u6743\u71b5\u6b63\u5219\u5316\u4e0e\u5f52\u4e00\u5316\u6838\u4f30\u8ba1\u7684\u7b97\u6cd5\uff0c\u907f\u514d\u7a00\u6709\u52a8\u4f5c\u653e\u5927\u7be1\u6539\u5f71\u54cd\u3002\u5176\u9057\u61be\u754c\u8fbe\u5230\u8fd1\u4e4e\u6781\u5c0f\u6781\u5927\u6700\u4f18\uff0c\u65e2\u4fdd\u6301\u65e0\u7be1\u6539\u65f6\u7684\u6700\u4f18\u7edf\u8ba1\u901f\u7387\uff0c\u53c8\u4f7f\u7be1\u6539\u4ee3\u4ef7\u5339\u914d\u5df2\u77e5\u4e0b\u754c\uff0c\u89e3\u51b3\u4e86\u6b64\u524d\u5f00\u653e\u7684\u901f\u7387\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Offline reinforcement learning (RL) typically mitigates distribution shift by imposing divergence constraints on the action distributions of the learned and behavior policies. However, this paradigm cannot ensure the underlying dynamic consistency structure: even minor action deviations can lead to drastically different transitions, inadvertently driving the agent away from the offline dataset. To address this, we explore policy constraints through their induced state-consequence distributions rather than relying on pure action-distribution matching. Nevertheless, directly enforcing such consequence-aware constraints is computationally intractable without access to the true underlying dynamics model. To bypass this issue, we propose Structural Behavior Regularization (StBR), which replaces the intractable objective with a closed-form latent divergence. Structuring this latent space to reflect transition dynamics renders the latent divergence a theoretically bounded surrogate for the true consequence-distribution divergence. By regularizing the learned policy with this latent divergence, StBR adaptively tightens the behavior constraint in dynamics-sensitive regions, effectively preventing deviations outside the offline dataset. Empirically, we demonstrate that StBR achieves superior performance across diverse offline RL benchmarks.", "arxiv_id": "2610.38238", "arxiv_url": "https://arxiv.org/abs/2610.38238", "authors": ["Wen Jiang", "Ke Jiang", "Xiaoyang Tan"], "brief": "\u672c\u6587\u63d0\u51fa\u7ed3\u6784\u5316\u884c\u4e3a\u6b63\u5219\u5316\uff0c\u901a\u8fc7\u7ea6\u675f\u7b56\u7565\u8bf1\u5bfc\u7684\u72b6\u6001\u540e\u679c\u5206\u5e03\uff0c\u800c\u975e\u4ec5\u5339\u914d\u52a8\u4f5c\u5206\u5e03\uff0c\u7f13\u89e3\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u7684\u5206\u5e03\u504f\u79fb\u3002\u65b9\u6cd5\u4ee5\u5177\u6709\u7406\u8bba\u754c\u7684\u95ed\u5f0f\u6f5c\u7a7a\u95f4\u6563\u5ea6\u66ff\u4ee3\u96be\u4ee5\u8ba1\u7b97\u7684\u540e\u679c\u5206\u5e03\u6563\u5ea6\uff0c\u5728\u52a8\u529b\u5b66\u654f\u611f\u533a\u57df\u81ea\u9002\u5e94\u6536\u7d27\u7ea6\u675f\uff0c\u5e76\u5728\u591a\u79cd\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u4f18\u8868\u73b0\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38238", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u504f\u79fb", "\u6b63\u5219\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38238v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Variational Consequence-Driven Offline Reinforcement Learning", "tldr": "\u672c\u6587\u63d0\u51fa\u7ed3\u6784\u5316\u884c\u4e3a\u6b63\u5219\u5316\uff0c\u901a\u8fc7\u7ea6\u675f\u7b56\u7565\u8bf1\u5bfc\u7684\u72b6\u6001\u540e\u679c\u5206\u5e03\uff0c\u800c\u975e\u4ec5\u5339\u914d\u52a8\u4f5c\u5206\u5e03\uff0c\u7f13\u89e3\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u7684\u5206\u5e03\u504f\u79fb\u3002\u65b9\u6cd5\u4ee5\u5177\u6709\u7406\u8bba\u754c\u7684\u95ed\u5f0f\u6f5c\u7a7a\u95f4\u6563\u5ea6\u66ff\u4ee3\u96be\u4ee5\u8ba1\u7b97\u7684\u540e\u679c\u5206\u5e03\u6563\u5ea6\uff0c\u5728\u52a8\u529b\u5b66\u654f\u611f\u533a\u57df\u81ea\u9002\u5e94\u6536\u7d27\u7ea6\u675f\uff0c\u5e76\u5728\u591a\u79cd\u79bb\u7ebf\u5f3a\u5316\u5b66\u4e60\u57fa\u51c6\u4e0a\u53d6\u5f97\u66f4\u4f18\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fully Sharded Data Parallelism (FSDP2) maintains parameters and gradients as per-parameter tensors, whereas its collective path operates on flat, rank-major buffers. Converting between these layouts copies all-gather outputs into parameter storage and packs gradients into full-group fp32 buffers. Layout conversion alone accounts for 6.4% of step time in Llama-3.1 70B training at 8K tokens per GPU. Communication kernels impose a second cost: a default NCCL reduce-scatter can slow a concurrent GEMM that would otherwise complete in a single wave by 69%. We present TIDE, a set of zero-copy collectives built on public NCCL 2.31+ APIs. TIDE preserves FSDP2\u0027s per-parameter storage and compute kernels while folding layout placement into collective addressing. TIDE-AG delivers shards directly to parameter storage using NVSwitch multicast and paced recursive-doubling RDMA, with no SMs used for transport or placement. TIDE-RS consumes per-parameter bf16 gradients directly and reduces them into fp32 shards (a mixed-precision mode that NCCL does not provide) using copy engines and short-lived thread blocks (CTAs) for node-local accumulation and NVSwitch for cross-node reduction. A two-phase pipeline separates gradient reads from network progress; Slot-Reuse optionally stages gradients in vacated all-gather slots. On 64 GPUs, TIDE reduces step time by up to 27.1% relative to Stock FSDP2 and 6.0% relative to FSDP2+SymmMem across Llama-3.1 70B, Wan2.2, and Qwen3-30B-A3B. It reduces reduce-scatter SM time by factors of 12.5-14.5 and cuts interference with concurrent compute by up to an order of magnitude. Its reduce-scatter buffer remains nearly constant from 16 to 64 GPUs at a fixed per-GPU output size, and its peak memory is up to 4.7 GiB below FSDP2+SymmMem\u0027s and, with Slot-Reuse on Wan2.2, below Stock FSDP2\u0027s.", "arxiv_id": "2610.38228", "arxiv_url": "https://arxiv.org/abs/2610.38228", "authors": ["Zejian Wang", "Yifan Zhao", "Kaihui Ren", "Xiaoling Zhou", "Yubin Wang", "Chenhao Guan", "Lin Zhang", "Yufeng Li", "Zhikang Mo", "Zhuoru Ma", "Yingtong Xiong", "Jihu Guo", "Yiqiao Liao", "Chengru Song"], "brief": "\u63d0\u51fa\u9762\u5411\u5168\u5206\u7247\u6570\u636e\u5e76\u884c\u8bad\u7ec3\u7684\u96f6\u62f7\u8d1d\u96c6\u5408\u901a\u4fe1\u65b9\u6848\uff0c\u5c06\u5f20\u91cf\u5e03\u5c40\u8f6c\u6362\u878d\u5165\u901a\u4fe1\u5bfb\u5740\uff0c\u51cf\u5c11\u6570\u636e\u642c\u8fd0\u3001\u663e\u5b58\u5360\u7528\u53ca\u901a\u4fe1\u5bf9\u8ba1\u7b97\u7684\u5e72\u6270\u3002\u572864\u5f20\u663e\u5361\u4e0a\uff0c\u76f8\u6bd4\u6807\u51c6\u65b9\u6848\u548c\u5bf9\u79f0\u5185\u5b58\u4f18\u5316\u65b9\u6848\uff0c\u8bad\u7ec3\u5355\u6b65\u8017\u65f6\u6700\u9ad8\u5206\u522b\u964d\u4f4e27.1%\u548c6.0%\uff0c\u5cf0\u503c\u663e\u5b58\u8f83\u540e\u8005\u6700\u591a\u51cf\u5c114.7\u5409\u5b57\u8282\u3002", "categories": ["cs.DC", "cs.LG", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38228", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u96c6\u5408\u901a\u4fe1", "\u663e\u5b58\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38228v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Endgame of FSDP Communication: Layout-Aware Collectives on Copy Engines, RDMA, and NVSwitch", "tldr": "\u63d0\u51fa\u9762\u5411\u5168\u5206\u7247\u6570\u636e\u5e76\u884c\u8bad\u7ec3\u7684\u96f6\u62f7\u8d1d\u96c6\u5408\u901a\u4fe1\u65b9\u6848\uff0c\u5c06\u5f20\u91cf\u5e03\u5c40\u8f6c\u6362\u878d\u5165\u901a\u4fe1\u5bfb\u5740\uff0c\u51cf\u5c11\u6570\u636e\u642c\u8fd0\u3001\u663e\u5b58\u5360\u7528\u53ca\u901a\u4fe1\u5bf9\u8ba1\u7b97\u7684\u5e72\u6270\u3002\u572864\u5f20\u663e\u5361\u4e0a\uff0c\u76f8\u6bd4\u6807\u51c6\u65b9\u6848\u548c\u5bf9\u79f0\u5185\u5b58\u4f18\u5316\u65b9\u6848\uff0c\u8bad\u7ec3\u5355\u6b65\u8017\u65f6\u6700\u9ad8\u5206\u522b\u964d\u4f4e27.1%\u548c6.0%\uff0c\u5cf0\u503c\u663e\u5b58\u8f83\u540e\u8005\u6700\u591a\u51cf\u5c114.7\u5409\u5b57\u8282\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large-scale PDE pre-training trains a single model on the data from multiple partial differential equations (PDEs). However, adding heterogeneous PDEs with different governing equations, physical variables, and variable interactions does not always improve predictive performance across tasks. Existing PDE mixture-of-experts models mitigate cross-task interference through learned routing, but typically use homogeneous expert architectures, making it difficult to directly reflect differences in state evolution across equations. We introduce HotPOT, an operator transformer with heterogeneous physics experts for large-scale PDE pre-training. HotPOT uses a shared encoder to capture information common across PDEs, while each PDE family uses a neural-numerical expert that pairs a learnable predictor with a fixed numerical update containing no trainable parameters. Each predictor outputs the quantities required by its paired numerical update, which then computes the next state. This design allows different PDEs to share a common encoder while retaining their own learnable predictors and numerical updates. Experiments across five PDE families and six settings show that HotPOT outperforms MoE-POT in all 24 matched-scale comparisons before and after fine-tuning, reducing rollout error by 50.7% on average. Notably, the 17M model also surpasses substantially larger MoE-POT models, and the performance gains extend to zero-shot prediction under unseen physical conditions. Code is available at https://github.com/cruiseresearchgroup/HotPOT-code.", "arxiv_id": "2610.38218", "arxiv_url": "https://arxiv.org/abs/2610.38218", "authors": ["Jiayi Li", "Guancheng Zhou", "Yisi Luo", "Ruihua Chen", "Penghao Jiang", "Deyu Meng", "Flora D. Salim", "Piotr Koniusz"], "brief": "\u63d0\u51fa\u7528\u4e8e\u5927\u89c4\u6a21\u504f\u5fae\u5206\u65b9\u7a0b\u9884\u8bad\u7ec3\u7684\u5f02\u6784\u7269\u7406\u4e13\u5bb6\u7b97\u5b50\u6a21\u578b\uff0c\u901a\u8fc7\u5171\u4eab\u7f16\u7801\u5668\u63d0\u53d6\u5171\u6027\u4fe1\u606f\uff0c\u5e76\u4e3a\u4e0d\u540c\u65b9\u7a0b\u65cf\u914d\u5907\u53ef\u5b66\u4e60\u9884\u6d4b\u5668\u4e0e\u56fa\u5b9a\u6570\u503c\u66f4\u65b0\u6a21\u5757\u3002\u5728\u4e94\u7c7b\u65b9\u7a0b\u3001\u516d\u79cd\u8bbe\u7f6e\u768424\u7ec4\u540c\u89c4\u6a21\u6bd4\u8f83\u4e2d\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e73\u5747\u964d\u4f4e50.7%\u7684\u6eda\u52a8\u9884\u6d4b\u8bef\u5dee\uff0c\u4e14\u80fd\u6cdb\u5316\u81f3\u672a\u89c1\u7269\u7406\u6761\u4ef6\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38218", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u504f\u5fae\u5206\u65b9\u7a0b", "\u7b97\u5b50\u5b66\u4e60", "\u6df7\u5408\u4e13\u5bb6", "\u79d1\u5b66\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38218v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HotPOT: Operator Transformer with Heterogeneous Physics Experts for Large-Scale PDE Pre-training", "tldr": "\u63d0\u51fa\u7528\u4e8e\u5927\u89c4\u6a21\u504f\u5fae\u5206\u65b9\u7a0b\u9884\u8bad\u7ec3\u7684\u5f02\u6784\u7269\u7406\u4e13\u5bb6\u7b97\u5b50\u6a21\u578b\uff0c\u901a\u8fc7\u5171\u4eab\u7f16\u7801\u5668\u63d0\u53d6\u5171\u6027\u4fe1\u606f\uff0c\u5e76\u4e3a\u4e0d\u540c\u65b9\u7a0b\u65cf\u914d\u5907\u53ef\u5b66\u4e60\u9884\u6d4b\u5668\u4e0e\u56fa\u5b9a\u6570\u503c\u66f4\u65b0\u6a21\u5757\u3002\u5728\u4e94\u7c7b\u65b9\u7a0b\u3001\u516d\u79cd\u8bbe\u7f6e\u768424\u7ec4\u540c\u89c4\u6a21\u6bd4\u8f83\u4e2d\u5747\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e73\u5747\u964d\u4f4e50.7%\u7684\u6eda\u52a8\u9884\u6d4b\u8bef\u5dee\uff0c\u4e14\u80fd\u6cdb\u5316\u81f3\u672a\u89c1\u7269\u7406\u6761\u4ef6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Machine-learning rainfall forecasts are often evaluated by shuffling station records into random training and test sets. For rainfall, this lets a model see what happened at neighbouring stations on the very day it is asked to forecast, and it hides the fact that a seasonal lookup table already explains most of the variance. We quantify both effects on 618,650 station-days from 35 Bangladesh Meteorological Department stations (1948-2014). We compare random, temporal (train \u003c=1999, test 2005-2014) and spatio-temporal (unseen stations and unseen years) evaluation, calendar-only versus antecedent-rainfall features, and six learners against climatology, persistence and S
