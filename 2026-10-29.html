ARIMA. Three findings stand out. First, a station-month climatology alone classifies high-rainfall months with 88.4% accuracy (AUC 0.950), and no learner improved on it by more than 0.8 points under temporal evaluation. Second, a calendar-only random forest reached a next-day wet-day AUC of 0.889 under a random split, higher than any model with real predictors under temporal evaluation, yet fell to 0.835, below climatology (0.859), on future years. Third, models with lagged rainfall add genuine but modest skill for next-day forecasts: a Brier skill score of 0.074 (95% CI 0.064-0.088) over climatology, rising to 0.091 when station and year inputs are removed and to 0.131 when other stations\u0027 same-day observations are added. A GRU sequence model matches but does not exceed gradient boosting, and skill disappears beyond a two-day lead. For monthly totals, no learner beat climatology significantly. We release a leakage-aware protocol and code so that future station-based studies report skill against climatology on held-out years.", "arxiv_id": "2610.38211", "arxiv_url": "https://arxiv.org/abs/2610.38211", "authors": ["Shahran Rahman Alve", "Muhammad Zawad Mahmud", "Samiha Islam", "Al Jubayer Pial"], "brief": "\u7814\u7a76\u5229\u7528\u5b5f\u52a0\u62c9\u56fd35\u4e2a\u6c14\u8c61\u7ad9\u7684\u5386\u53f2\u6570\u636e\uff0c\u6bd4\u8f83\u968f\u673a\u3001\u65f6\u95f4\u53ca\u8de8\u7ad9\u8de8\u65f6\u95f4\u5212\u5206\uff0c\u63ed\u793a\u968f\u673a\u5212\u5206\u7684\u4fe1\u606f\u6cc4\u6f0f\u548c\u5b63\u8282\u6027\u89c4\u5f8b\u4f1a\u5938\u5927\u964d\u96e8\u9884\u6d4b\u6548\u679c\u3002\u5728\u4e25\u683c\u65f6\u95f4\u8bc4\u4f30\u4e0b\uff0c\u5386\u53f2\u964d\u96e8\u7279\u5f81\u4ec5\u5e26\u6765\u6709\u9650\u7684\u6b21\u65e5\u9884\u6d4b\u589e\u76ca\uff0c\u4e24\u5929\u4e4b\u540e\u589e\u76ca\u6d88\u5931\uff0c\u6708\u964d\u96e8\u603b\u91cf\u9884\u6d4b\u4e5f\u672a\u663e\u8457\u4f18\u4e8e\u6c14\u5019\u57fa\u51c6\uff1b\u8bba\u6587\u5f00\u653e\u4e86\u9632\u6cc4\u6f0f\u8bc4\u4f30\u6d41\u7a0b\u4e0e\u4ee3\u7801\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38211", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u5b66\u4e60", "\u964d\u96e8\u9884\u6d4b", "\u65f6\u95f4\u5e8f\u5217", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38211v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RainCheck: Harnessing Historical Weather Data with Machine Learning for Rainfall Forecasting in Bangladesh", "tldr": "\u7814\u7a76\u5229\u7528\u5b5f\u52a0\u62c9\u56fd35\u4e2a\u6c14\u8c61\u7ad9\u7684\u5386\u53f2\u6570\u636e\uff0c\u6bd4\u8f83\u968f\u673a\u3001\u65f6\u95f4\u53ca\u8de8\u7ad9\u8de8\u65f6\u95f4\u5212\u5206\uff0c\u63ed\u793a\u968f\u673a\u5212\u5206\u7684\u4fe1\u606f\u6cc4\u6f0f\u548c\u5b63\u8282\u6027\u89c4\u5f8b\u4f1a\u5938\u5927\u964d\u96e8\u9884\u6d4b\u6548\u679c\u3002\u5728\u4e25\u683c\u65f6\u95f4\u8bc4\u4f30\u4e0b\uff0c\u5386\u53f2\u964d\u96e8\u7279\u5f81\u4ec5\u5e26\u6765\u6709\u9650\u7684\u6b21\u65e5\u9884\u6d4b\u589e\u76ca\uff0c\u4e24\u5929\u4e4b\u540e\u589e\u76ca\u6d88\u5931\uff0c\u6708\u964d\u96e8\u603b\u91cf\u9884\u6d4b\u4e5f\u672a\u663e\u8457\u4f18\u4e8e\u6c14\u5019\u57fa\u51c6\uff1b\u8bba\u6587\u5f00\u653e\u4e86\u9632\u6cc4\u6f0f\u8bc4\u4f30\u6d41\u7a0b\u4e0e\u4ee3\u7801\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Ptychography is a computational imaging method that reconstructs a sample from overlapping diffraction measurements. This technique relies on these overlapping measurements to provide the redundancy information needed for robust reconstruction, but dense scanning increases acquisition time and data volume. Reducing scan overlaps can improve measurement efficiency but weakens the physical constraints available for reconstruction. Diffusion models provide strong learned prior information, offering a promising approach to compensate for the loss of measurement redundancy. However, effectively utilizing this prior information under weak measurement constraints remains a challenge. We propose a progressive coupling posterior sampling (PCPS) method, which allows for a broader exploration of the solution space under high uncertainty while maintaining stronger diffusion-guided consistency as the reconstruction becomes more refined. Experiments on real X-ray ptychographic data at various scan overlaps demonstrate that PCPS consistently improves reconstruction accuracy compared to traditional iterative methods and existing diffusion posterior samplers, especially at low overlaps. These results show that diffusion priors can reduce the measurement redundancy required for accurate ptychography reconstruction.", "arxiv_id": "2610.38207", "arxiv_url": "https://arxiv.org/abs/2610.38207", "authors": ["Yihan Qiu", "Mingtao Huang", "Tianyuan Li", "Shudong Li", "Yuan Shen"], "brief": "\u63d0\u51fa\u6e10\u8fdb\u8026\u5408\u540e\u9a8c\u91c7\u6837\u65b9\u6cd5\uff0c\u5229\u7528\u6269\u6563\u6a21\u578b\u5148\u9a8c\u8865\u507f\u53e0\u5c42\u884d\u5c04\u6210\u50cf\u4e2d\u4f4e\u626b\u63cf\u91cd\u53e0\u5e26\u6765\u7684\u7ea6\u675f\u4e0d\u8db3\uff0c\u5728\u9ad8\u4e0d\u786e\u5b9a\u6027\u65f6\u6269\u5927\u63a2\u7d22\u3001\u968f\u91cd\u5efa\u7ec6\u5316\u589e\u5f3a\u4e00\u81f4\u6027\u3002\u771f\u5b9eX\u5c04\u7ebf\u6570\u636e\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u4f18\u4e8e\u4f20\u7edf\u8fed\u4ee3\u65b9\u6cd5\u53ca\u73b0\u6709\u6269\u6563\u540e\u9a8c\u91c7\u6837\u5668\uff0c\u5c24\u5176\u5728\u4f4e\u91cd\u53e0\u6761\u4ef6\u4e0b\uff0c\u53ef\u964d\u4f4e\u51c6\u786e\u91cd\u5efa\u6240\u9700\u7684\u6d4b\u91cf\u5197\u4f59\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38207", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u540e\u9a8c\u91c7\u6837", "\u8ba1\u7b97\u6210\u50cf"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38207v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Progressive Coupling Method for Diffusion Posterior Sampling in Ptychography", "tldr": "\u63d0\u51fa\u6e10\u8fdb\u8026\u5408\u540e\u9a8c\u91c7\u6837\u65b9\u6cd5\uff0c\u5229\u7528\u6269\u6563\u6a21\u578b\u5148\u9a8c\u8865\u507f\u53e0\u5c42\u884d\u5c04\u6210\u50cf\u4e2d\u4f4e\u626b\u63cf\u91cd\u53e0\u5e26\u6765\u7684\u7ea6\u675f\u4e0d\u8db3\uff0c\u5728\u9ad8\u4e0d\u786e\u5b9a\u6027\u65f6\u6269\u5927\u63a2\u7d22\u3001\u968f\u91cd\u5efa\u7ec6\u5316\u589e\u5f3a\u4e00\u81f4\u6027\u3002\u771f\u5b9eX\u5c04\u7ebf\u6570\u636e\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u65b9\u6cd5\u4f18\u4e8e\u4f20\u7edf\u8fed\u4ee3\u65b9\u6cd5\u53ca\u73b0\u6709\u6269\u6563\u540e\u9a8c\u91c7\u6837\u5668\uff0c\u5c24\u5176\u5728\u4f4e\u91cd\u53e0\u6761\u4ef6\u4e0b\uff0c\u53ef\u964d\u4f4e\u51c6\u786e\u91cd\u5efa\u6240\u9700\u7684\u6d4b\u91cf\u5197\u4f59\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We consider the tensor principal components analysis (tensor PCA) problem on the sphere, in which we are asked to recover an unknown vector in $\\mathcal{S}_N=\\{x\\in\\mathbb{R}^N:\\lVert x\\rVert^2=N\\}$ from a noisy observation of its $k$-th tensor power, for a fixed $k\\ge3$. Tensor PCA exhibits a well-studied information-computation gap: global algorithms such as spectral methods and sum-of-squares work above an algorithmic threshold, below which we know matching lower bounds (against these and some other restricted models of computation). In contrast, local algorithms such as Markov chains were only known to succeed from a random initialization at a polynomially larger signal-to-noise ratio, and were believed to be inferior to global algorithms for tensor PCA. Continuing the program initiated in Part I [arXiv:2610.16705], we show that spherical Langevin dynamics, when supplemented with annealing and ergodic averaging, achieves polynomial-time strong recovery above the algorithmic threshold from a uniformly random initialization. Together with Part I, our results demonstrate that local Markov chains can succeed all the way down to the algorithmic threshold from an uninformative cold start.", "arxiv_id": "2610.38206", "arxiv_url": "https://arxiv.org/abs/2610.38206", "authors": ["Aniket Das", "Tselil Schramm"], "brief": "\u7814\u7a76\u7403\u9762\u4e0a\u7684\u5f20\u91cf\u4e3b\u6210\u5206\u5206\u6790\uff0c\u8bc1\u660e\u7ed3\u5408\u9000\u706b\u4e0e\u904d\u5386\u5e73\u5747\u7684\u6717\u4e4b\u4e07\u52a8\u529b\u5b66\uff0c\u53ef\u4ece\u5747\u5300\u968f\u673a\u521d\u59cb\u5316\u51fa\u53d1\uff0c\u5728\u7b97\u6cd5\u9608\u503c\u4ee5\u4e0a\u5b9e\u73b0\u591a\u9879\u5f0f\u65f6\u95f4\u5f3a\u6062\u590d\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5c40\u90e8\u9a6c\u5c14\u53ef\u592b\u94fe\u4e5f\u80fd\u8fbe\u5230\u5168\u5c40\u7b97\u6cd5\u7684\u5df2\u77e5\u9608\u503c\uff0c\u6253\u7834\u5176\u9700\u8981\u66f4\u9ad8\u4fe1\u566a\u6bd4\u7684\u65e2\u6709\u8ba4\u8bc6\u3002", "categories": ["cs.LG", "cs.DS", "math.PR", "math.ST"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38206", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f20\u91cf\u4e3b\u6210\u5206\u5206\u6790", "\u9a6c\u5c14\u53ef\u592b\u94fe", "\u6717\u4e4b\u4e07\u52a8\u529b\u5b66", "\u9000\u706b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38206v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Averaged Annealed Markov Chains Achieve the Algorithmic Threshold for Tensor PCA, Part II: Langevin Dynamics", "tldr": "\u7814\u7a76\u7403\u9762\u4e0a\u7684\u5f20\u91cf\u4e3b\u6210\u5206\u5206\u6790\uff0c\u8bc1\u660e\u7ed3\u5408\u9000\u706b\u4e0e\u904d\u5386\u5e73\u5747\u7684\u6717\u4e4b\u4e07\u52a8\u529b\u5b66\uff0c\u53ef\u4ece\u5747\u5300\u968f\u673a\u521d\u59cb\u5316\u51fa\u53d1\uff0c\u5728\u7b97\u6cd5\u9608\u503c\u4ee5\u4e0a\u5b9e\u73b0\u591a\u9879\u5f0f\u65f6\u95f4\u5f3a\u6062\u590d\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5c40\u90e8\u9a6c\u5c14\u53ef\u592b\u94fe\u4e5f\u80fd\u8fbe\u5230\u5168\u5c40\u7b97\u6cd5\u7684\u5df2\u77e5\u9608\u503c\uff0c\u6253\u7834\u5176\u9700\u8981\u66f4\u9ad8\u4fe1\u566a\u6bd4\u7684\u65e2\u6709\u8ba4\u8bc6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Behavior Cloning has demonstrated promising generalization capabilities for robotic manipulation in terrestrial environments. However, marine visual distortions and dynamic currents create a severe domain shift that remains a key bottleneck in adapting generalist architectures to underwater field manipulation. To address this, 1616 episodes of underwater manipulation data were collected in calm and turbulent waters and were used to train 14 generalist Vision-Language-Action (VLA) models (DynamicVLA) with varying proprioception observation configurations. Across three tasks on 1260 gradable on-hardware rollouts in a pool, 10 models outperformed the baseline, with the highest-performing model achieving a 93.3% overall success rate, including partial successes. Results are also introduced from a case study evaluating the performance of a single-task Action Chunking Transformer (ACT) and a generalist VLA (SmolVLA) policy for two tasks in marine archaeology and conservation: grasping and mooring. Experiments are performed on an ROV on and around the WWII wreck Coralita X127 and at Manoel Island Marina, Malta. Across 748 collected episodes and 508 gradable on-hardware rollouts, the ACT policy substantially outperformed SmolVLA (47.9% vs. 7.9% pooled success rate), earning a 66.7% success rate on the most successful task at the marine archaeological site. To enable further contributions to embodied intelligence in marine field robotics, the BLUEMBODIED KIT used to collect data, train models, and deploy policies on the ROV has been open sourced.", "arxiv_id": "2610.38199", "arxiv_url": "https://arxiv.org/abs/2610.38199", "authors": ["Greta Perez-Haiek", "Luca Macesanu", "Kevin Angers", "Mohammed Imam", "Timothy Gambin", "Christopher Clark"], "brief": "\u7814\u7a76\u91c7\u96c6\u6c34\u4e0b\u64cd\u4f5c\u6570\u636e\uff0c\u8bad\u7ec3\u5e76\u8bc4\u4f30\u591a\u4efb\u52a1\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\uff0c\u6c34\u6c60\u5b9e\u9a8c\u4e2d\u6700\u4f73\u6a21\u578b\u7684\u603b\u4f53\u6210\u529f\u7387\u8fbe93.3%\uff08\u542b\u90e8\u5206\u6210\u529f\uff09\u3002\u771f\u5b9e\u6d77\u57df\u5b9e\u9a8c\u4e2d\uff0c\u5355\u4efb\u52a1\u52a8\u4f5c\u5206\u5757\u6a21\u578b\u4ee547.9%\u7684\u6210\u529f\u7387\u663e\u8457\u4f18\u4e8e\u901a\u7528\u6a21\u578b\u76847.9%\uff0c\u8868\u660e\u901a\u7528\u7b56\u7565\u4ecd\u9762\u4e34\u660e\u663e\u7684\u6d77\u57df\u8fc1\u79fb\u6311\u6218\uff1b\u914d\u5957\u6570\u636e\u91c7\u96c6\u3001\u8bad\u7ec3\u4e0e\u90e8\u7f72\u5de5\u5177\u5df2\u5f00\u6e90\u3002", "categories": ["cs.RO", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38199", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6a21\u4eff\u5b66\u4e60", "\u5177\u8eab\u667a\u80fd", "\u6c34\u4e0b\u673a\u5668\u4eba", "\u591a\u4efb\u52a1\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38199v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Embodied at Sea: Imitation Learning for Multi-Task Underwater Manipulation", "tldr": "\u7814\u7a76\u91c7\u96c6\u6c34\u4e0b\u64cd\u4f5c\u6570\u636e\uff0c\u8bad\u7ec3\u5e76\u8bc4\u4f30\u591a\u4efb\u52a1\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b\uff0c\u6c34\u6c60\u5b9e\u9a8c\u4e2d\u6700\u4f73\u6a21\u578b\u7684\u603b\u4f53\u6210\u529f\u7387\u8fbe93.3%\uff08\u542b\u90e8\u5206\u6210\u529f\uff09\u3002\u771f\u5b9e\u6d77\u57df\u5b9e\u9a8c\u4e2d\uff0c\u5355\u4efb\u52a1\u52a8\u4f5c\u5206\u5757\u6a21\u578b\u4ee547.9%\u7684\u6210\u529f\u7387\u663e\u8457\u4f18\u4e8e\u901a\u7528\u6a21\u578b\u76847.9%\uff0c\u8868\u660e\u901a\u7528\u7b56\u7565\u4ecd\u9762\u4e34\u660e\u663e\u7684\u6d77\u57df\u8fc1\u79fb\u6311\u6218\uff1b\u914d\u5957\u6570\u636e\u91c7\u96c6\u3001\u8bad\u7ec3\u4e0e\u90e8\u7f72\u5de5\u5177\u5df2\u5f00\u6e90\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Serverless platforms increasingly host machine learning (ML) inference workflows, modeled as directed acyclic graphs (DAGs) of interdependent functions. Beyond container startup, each ML node must load libraries, model weights, and CUDA kernels before it can run. These costs accumulate along dependent DAG paths and place initialization on the end-to-end critical path. Existing systems optimize one half of this problem. DAG-agnostic pre-loading prepares nodes the request may never reach, wasting host and GPU memory. DAG-aware serving routes and scales whole functions, leaving the loading stages inside a node untouched. This paper presents GearUp, a serverless DAG inference serving system that removes ML-node loading from the end-to-end critical path at low resource cost. GearUp profiles the loading stages of each node and schedules them inside the slack time the DAG exposes, hiding initialization behind upstream execution. It reuses initialized instances within and across requests to avoid redundant cold starts. A probabilistic, traffic-adaptive keep-alive policy sets how long idle instances are retained, balancing memory cost against cold-start risk under bursty load. On the AMBER Alert and FINRA-ML workflows with NVIDIA L40S GPUs, GearUp reduces median end-to-end latency by 64.5% and 75.9% against SMIless, for median speedups of 3.1x and 10.0x over cold execution. Integrated GPU and host memory allocation fall by up to 83.9% and 94.6% against eager pre-loading in InstaInfer. GearUp achieves 4.2x strong scaling on four workers.", "arxiv_id": "2610.38196", "arxiv_url": "https://arxiv.org/abs/2610.38196", "authors": ["Qi Qi", "Yifan Sui", "Hanfei Yu", "Hong Zhang", "Hao Wang"], "brief": "\u63d0\u51fa\u9762\u5411\u65e0\u670d\u52a1\u5668\u63a8\u7406\u5de5\u4f5c\u6d41\u7684\u52a0\u901f\u7cfb\u7edf\uff0c\u5229\u7528\u6709\u5411\u65e0\u73af\u56fe\u4e2d\u7684\u7a7a\u95f2\u65f6\u95f4\u9884\u52a0\u8f7d\u4f9d\u8d56\u5e93\u3001\u6a21\u578b\u6743\u91cd\u548c\u8ba1\u7b97\u5185\u6838\uff0c\u5e76\u7ed3\u5408\u5b9e\u4f8b\u590d\u7528\u4e0e\u6d41\u91cf\u81ea\u9002\u5e94\u4fdd\u6d3b\u7b56\u7565\u964d\u4f4e\u51b7\u542f\u52a8\u5f00\u9500\u3002\u5728\u4e24\u4e2a\u5de5\u4f5c\u6d41\u4e0a\uff0c\u76f8\u6bd4\u57fa\u7ebf\u7cfb\u7edf\uff0c\u4e2d\u4f4d\u7aef\u5230\u7aef\u5ef6\u8fdf\u964d\u4f4e64.5%\u548c75.9%\uff1b\u76f8\u6bd4\u6fc0\u8fdb\u9884\u52a0\u8f7d\uff0c\u663e\u5b58\u4e0e\u4e3b\u673a\u5185\u5b58\u7d2f\u8ba1\u5206\u914d\u91cf\u5206\u522b\u6700\u591a\u964d\u4f4e83.9%\u548c94.6%\u3002", "categories": ["cs.DC", "cs.LG", "cs.OS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38196", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65e0\u670d\u52a1\u5668\u8ba1\u7b97", "\u63a8\u7406\u52a0\u901f", "\u4efb\u52a1\u8c03\u5ea6", "\u8d44\u6e90\u7ba1\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38196v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GearUp: DAG-aware Acceleration for Serverless Inference Serving via Slack-guided Pre-loading", "tldr": "\u63d0\u51fa\u9762\u5411\u65e0\u670d\u52a1\u5668\u63a8\u7406\u5de5\u4f5c\u6d41\u7684\u52a0\u901f\u7cfb\u7edf\uff0c\u5229\u7528\u6709\u5411\u65e0\u73af\u56fe\u4e2d\u7684\u7a7a\u95f2\u65f6\u95f4\u9884\u52a0\u8f7d\u4f9d\u8d56\u5e93\u3001\u6a21\u578b\u6743\u91cd\u548c\u8ba1\u7b97\u5185\u6838\uff0c\u5e76\u7ed3\u5408\u5b9e\u4f8b\u590d\u7528\u4e0e\u6d41\u91cf\u81ea\u9002\u5e94\u4fdd\u6d3b\u7b56\u7565\u964d\u4f4e\u51b7\u542f\u52a8\u5f00\u9500\u3002\u5728\u4e24\u4e2a\u5de5\u4f5c\u6d41\u4e0a\uff0c\u76f8\u6bd4\u57fa\u7ebf\u7cfb\u7edf\uff0c\u4e2d\u4f4d\u7aef\u5230\u7aef\u5ef6\u8fdf\u964d\u4f4e64.5%\u548c75.9%\uff1b\u76f8\u6bd4\u6fc0\u8fdb\u9884\u52a0\u8f7d\uff0c\u663e\u5b58\u4e0e\u4e3b\u673a\u5185\u5b58\u7d2f\u8ba1\u5206\u914d\u91cf\u5206\u522b\u6700\u591a\u964d\u4f4e83.9%\u548c94.6%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "A coherent sum of quantum circuits introduces interference that can alter the training signal. We distinguish a single linear combination of unitaries (LCU) from a circuit that repeatedly alternates branch operations and ancilla mixing. For a single-pass LCU, independent branches with zero matrix means cannot erase the differentiated branch\u0027s gradient variance: the total variance is at least the branch variance times the fourth power of its coefficient magnitude. This bound holds at any gate position and does not require the circuit unitaries to be Haar-random. Beyond this lower bound, we derive exact loss and gradient formulas that quantify the additional contributions from interference between branches. One of these terms depends on relative coefficient phases and vanishes when the branch ensemble is invariant under multiplication by $i \\mathbb{I}$; a four-qubit matchgate example shows that it can be nonzero. For repeated interleaving with full special-unitary ancilla control, we determine the generated Lie algebra from the associative algebra of the branches, including the available central phase directions. This control result predicts concentration only with additional assumptions on circuit sampling. Matchgate examples exhibit polynomial single-pass LCU variances and exponential concentration under joint Haar-random sampling. We also derive coefficient-selection rules and bounds for postselection, measurement error, and approximate moments.", "arxiv_id": "2610.38193", "arxiv_url": "https://arxiv.org/abs/2610.38193", "authors": ["Amir Koutahi", "Pouya Kananian", "Hans-Arno Jacobsen"], "brief": "\u672c\u6587\u5206\u6790\u91cf\u5b50\u7ebf\u8def\u7ebf\u6027\u7ec4\u5408\u4e2d\u7684\u5e72\u6d89\u5982\u4f55\u5f71\u54cd\u8bad\u7ec3\u68af\u5ea6\uff0c\u8bc1\u660e\u5355\u6b21\u7ec4\u5408\u5728\u72ec\u7acb\u3001\u96f6\u5747\u503c\u5206\u652f\u6761\u4ef6\u4e0b\u4e0d\u4f1a\u5c06\u68af\u5ea6\u65b9\u5dee\u538b\u4f4e\u81f3\u7279\u5b9a\u4e0b\u754c\u4ee5\u4e0b\uff0c\u5e76\u63a8\u5bfc\u7cbe\u786e\u7684\u635f\u5931\u4e0e\u68af\u5ea6\u516c\u5f0f\u3002\u5bf9\u4e8e\u53cd\u590d\u4ea4\u66ff\u7684\u5206\u652f\u64cd\u4f5c\u4e0e\u8f85\u52a9\u91cf\u5b50\u6bd4\u7279\u6df7\u5408\uff0c\u4f5c\u8005\u7528\u674e\u4ee3\u6570\u523b\u753b\u5176\u53ef\u63a7\u6027\uff1b\u793a\u4f8b\u8868\u660e\uff0c\u5355\u6b21\u7ec4\u5408\u53ef\u4fdd\u6301\u591a\u9879\u5f0f\u7ea7\u68af\u5ea6\u65b9\u5dee\uff0c\u800c\u8054\u5408\u968f\u673a\u91c7\u6837\u53ef\u80fd\u5bfc\u81f4\u6307\u6570\u7ea7\u96c6\u4e2d\u3002", "categories": ["quant-ph", "cs.ET", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38193", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u91cf\u5b50\u8ba1\u7b97", "\u8d2b\u7620\u9ad8\u539f", "\u68af\u5ea6\u65b9\u5dee", "\u674e\u4ee3\u6570"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38193v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Barren Plateaus in Quantum Linear Combinations: Interference and Lie-Algebraic Control", "tldr": "\u672c\u6587\u5206\u6790\u91cf\u5b50\u7ebf\u8def\u7ebf\u6027\u7ec4\u5408\u4e2d\u7684\u5e72\u6d89\u5982\u4f55\u5f71\u54cd\u8bad\u7ec3\u68af\u5ea6\uff0c\u8bc1\u660e\u5355\u6b21\u7ec4\u5408\u5728\u72ec\u7acb\u3001\u96f6\u5747\u503c\u5206\u652f\u6761\u4ef6\u4e0b\u4e0d\u4f1a\u5c06\u68af\u5ea6\u65b9\u5dee\u538b\u4f4e\u81f3\u7279\u5b9a\u4e0b\u754c\u4ee5\u4e0b\uff0c\u5e76\u63a8\u5bfc\u7cbe\u786e\u7684\u635f\u5931\u4e0e\u68af\u5ea6\u516c\u5f0f\u3002\u5bf9\u4e8e\u53cd\u590d\u4ea4\u66ff\u7684\u5206\u652f\u64cd\u4f5c\u4e0e\u8f85\u52a9\u91cf\u5b50\u6bd4\u7279\u6df7\u5408\uff0c\u4f5c\u8005\u7528\u674e\u4ee3\u6570\u523b\u753b\u5176\u53ef\u63a7\u6027\uff1b\u793a\u4f8b\u8868\u660e\uff0c\u5355\u6b21\u7ec4\u5408\u53ef\u4fdd\u6301\u591a\u9879\u5f0f\u7ea7\u68af\u5ea6\u65b9\u5dee\uff0c\u800c\u8054\u5408\u968f\u673a\u91c7\u6837\u53ef\u80fd\u5bfc\u81f4\u6307\u6570\u7ea7\u96c6\u4e2d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models hold promise for delivering safe, scientifically grounded, and personalized exercise guidance at scale, yet the sports-and-health domain still lacks curated training corpora and rigorous evaluation benchmarks. Keepace.ai is a domain-specialized LLM built on Qwen3.5-27B through post-training, currently optimized for Chinese-language exercise guidance across three tasks: workout plan generation, sports-and-health knowledge QA, and personal sports data analysis. In internal rubric-based evaluations designed with domain experts, Keepace.ai outperforms its base model and larger general-purpose baselines, with the most pronounced improvements in exercise safety, boundary compliance, structured output completeness, and scientific accuracy. This report summarizes the current design, data pipeline, safety-first evaluation framework, and evaluation results of Keepace.ai.", "arxiv_id": "2610.38249", "arxiv_url": "https://arxiv.org/abs/2610.38249", "authors": ["Keepace. ai Team", "Bowen Wu", "Heng Wang", "Jufeng Mi", "Kang Liu", "Kun Li", "Ling Man", "Long He", "Suli Fan", "Xiaosen Jiang", "Yi Wang", "Ying He", "Yu Tang", "Yunhan Li", "Zifang Liu"], "brief": "\u8be5\u7814\u7a76\u901a\u8fc7\u540e\u8bad\u7ec3\u6784\u5efa\u8fd0\u52a8\u5065\u5eb7\u9886\u57df\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u9762\u5411\u4e2d\u6587\u8bad\u7ec3\u8ba1\u5212\u751f\u6210\u3001\u8fd0\u52a8\u5065\u5eb7\u77e5\u8bc6\u95ee\u7b54\u548c\u4e2a\u4eba\u8fd0\u52a8\u6570\u636e\u5206\u6790\u3002\u5728\u9886\u57df\u4e13\u5bb6\u8bbe\u8ba1\u7684\u5185\u90e8\u8bc4\u6d4b\u4e2d\uff0c\u5176\u8868\u73b0\u4f18\u4e8e\u57fa\u7840\u6a21\u578b\u53ca\u66f4\u5927\u7684\u901a\u7528\u6a21\u578b\uff0c\u5c24\u5176\u63d0\u5347\u4e86\u8fd0\u52a8\u5b89\u5168\u6027\u3001\u8fb9\u754c\u5408\u89c4\u6027\u3001\u7ed3\u6784\u5316\u8f93\u51fa\u5b8c\u6574\u6027\u548c\u79d1\u5b66\u51c6\u786e\u6027\uff1b\u5916\u90e8\u6cdb\u5316\u6548\u679c\u4ecd\u5f85\u9a8c\u8bc1\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38249", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u540e\u8bad\u7ec3", "\u8fd0\u52a8\u5065\u5eb7", "\u5b89\u5168\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38249v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Keepace.ai: A Technical Report on a Large Language Model for Sports and Health", "tldr": "\u8be5\u7814\u7a76\u901a\u8fc7\u540e\u8bad\u7ec3\u6784\u5efa\u8fd0\u52a8\u5065\u5eb7\u9886\u57df\u5927\u8bed\u8a00\u6a21\u578b\uff0c\u9762\u5411\u4e2d\u6587\u8bad\u7ec3\u8ba1\u5212\u751f\u6210\u3001\u8fd0\u52a8\u5065\u5eb7\u77e5\u8bc6\u95ee\u7b54\u548c\u4e2a\u4eba\u8fd0\u52a8\u6570\u636e\u5206\u6790\u3002\u5728\u9886\u57df\u4e13\u5bb6\u8bbe\u8ba1\u7684\u5185\u90e8\u8bc4\u6d4b\u4e2d\uff0c\u5176\u8868\u73b0\u4f18\u4e8e\u57fa\u7840\u6a21\u578b\u53ca\u66f4\u5927\u7684\u901a\u7528\u6a21\u578b\uff0c\u5c24\u5176\u63d0\u5347\u4e86\u8fd0\u52a8\u5b89\u5168\u6027\u3001\u8fb9\u754c\u5408\u89c4\u6027\u3001\u7ed3\u6784\u5316\u8f93\u51fa\u5b8c\u6574\u6027\u548c\u79d1\u5b66\u51c6\u786e\u6027\uff1b\u5916\u90e8\u6cdb\u5316\u6548\u679c\u4ecd\u5f85\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models increasingly create 3D content through code, with practical workflows often relying on editing existing programs rather than regenerating them, for speed and precise control. Such edits require understanding what a program builds and foreseeing how a change reshapes it, yet prior benchmarks mostly evaluate generation or simple edits against a reference. In this paper, we introduce 3DCodeEdit, a benchmark of 2,592 instruction-guided editing tasks over 108 Blender programs that construct objects entirely in code. Its edits range from parameter to structural changes, style redesign, and scene composition, and are judged from renders against human-reviewed checklists. Across 17 models, the average success rate is only 37%, and even the strongest models complete fewer than 60% of structural and style edits. As models become more capable, their failures shift to geometric foresight, where the code runs but builds the wrong shape. We therefore study whether multi-turn feedback can compensate for this missing foresight. Feedback from a separate reviewer model that describes how the renders differ from the request helps most, more than maximum reasoning effort or an agent harness, and can let a 27B model surpass the single-shot rate of a 2.8T-parameter model.", "arxiv_id": "2610.38231", "arxiv_url": "https://arxiv.org/abs/2610.38231", "authors": ["Binjie Wang", "Xinran Zhao", "Shoubin Yu", "Xiang Li", "Silong Yong", "Chenyang Yang", "Tianyu Chen", "Ruofei Du", "He He", "Chen Zhao", "Tongshuang Wu"], "brief": "\u63d0\u51fa\u4e09\u7ef4\u7a0b\u5e8f\u6307\u4ee4\u7f16\u8f91\u57fa\u51c6\uff0c\u6db5\u76d6108\u4e2a\u7a0b\u5e8f\u4e0a\u76842592\u9879\u4efb\u52a1\uff0c\u901a\u8fc7\u6e32\u67d3\u7ed3\u679c\u4e0e\u4eba\u5de5\u5ba1\u6838\u6e05\u5355\u8bc4\u4f30\u7f16\u8f91\u6548\u679c\u300217\u4e2a\u6a21\u578b\u7684\u5e73\u5747\u6210\u529f\u7387\u4ec5\u4e3a37%\uff0c\u4e3b\u8981\u74f6\u9888\u662f\u9884\u5224\u4ee3\u7801\u4fee\u6539\u540e\u7684\u51e0\u4f55\u5f62\u72b6\uff1b\u72ec\u7acb\u8bc4\u5ba1\u6a21\u578b\u63d0\u4f9b\u7684\u591a\u8f6e\u89c6\u89c9\u53cd\u9988\u6700\u6709\u6548\uff0c\u53ef\u4f7f270\u4ebf\u53c2\u6570\u6a21\u578b\u8d85\u8fc72.8\u4e07\u4ebf\u53c2\u6570\u6a21\u578b\u7684\u5355\u6b21\u7f16\u8f91\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.CV", "cs.GR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38231", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u751f\u6210", "\u4ee3\u7801\u7f16\u8f91", "\u591a\u6a21\u6001", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38231v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "3DCodeEdit: Benchmarking Instruction-Guided 3D Program Editing", "tldr": "\u63d0\u51fa\u4e09\u7ef4\u7a0b\u5e8f\u6307\u4ee4\u7f16\u8f91\u57fa\u51c6\uff0c\u6db5\u76d6108\u4e2a\u7a0b\u5e8f\u4e0a\u76842592\u9879\u4efb\u52a1\uff0c\u901a\u8fc7\u6e32\u67d3\u7ed3\u679c\u4e0e\u4eba\u5de5\u5ba1\u6838\u6e05\u5355\u8bc4\u4f30\u7f16\u8f91\u6548\u679c\u300217\u4e2a\u6a21\u578b\u7684\u5e73\u5747\u6210\u529f\u7387\u4ec5\u4e3a37%\uff0c\u4e3b\u8981\u74f6\u9888\u662f\u9884\u5224\u4ee3\u7801\u4fee\u6539\u540e\u7684\u51e0\u4f55\u5f62\u72b6\uff1b\u72ec\u7acb\u8bc4\u5ba1\u6a21\u578b\u63d0\u4f9b\u7684\u591a\u8f6e\u89c6\u89c9\u53cd\u9988\u6700\u6709\u6548\uff0c\u53ef\u4f7f270\u4ebf\u53c2\u6570\u6a21\u578b\u8d85\u8fc72.8\u4e07\u4ebf\u53c2\u6570\u6a21\u578b\u7684\u5355\u6b21\u7f16\u8f91\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Skills, as reusable external knowledge, have demonstrated substantial potential to enhance the ability of Large Language Models (LLMs) to solve complex tasks. However, existing skill-augmented generation methods typically rely on separate models for skill retrieval and skill utilization, resulting in disconnected optimization of these two processes. To address this gap, we propose Skill-Uni, a unified reinforcement learning framework that jointly optimizes skill retrieval and utilization. Specifically, we adopt a generative skill retrieval paradigm that enables a single model to both learn how to retrieve relevant skills and leverage them for task solving. To effectively train this unified framework, we introduce a two-stage training strategy consisting of warm-up instruction tuning and GRPO, allowing the model to progressively improve its skill retrieval and utilization capabilities. Extensive experiments on five skill-related benchmarks demonstrate the effectiveness of Skill-Uni, yielding average performance gains of 66.59% and 34.82% over the base Qwen3-4B and LLaMA3.1-8B models, respectively. Besides, Skill-Uni is compatible with various skill retrieval engines, demonstrating its flexibility and generalizability. Additional in-depth analyses also provide insights into the effectiveness of Skill-Uni.", "arxiv_id": "2610.38204", "arxiv_url": "https://arxiv.org/abs/2610.38204", "authors": ["Zihan Luo", "Jiahui Kang", "Wei Zhou", "Qilin Fan", "Mingyan Li", "Chao Chen"], "brief": "\u63d0\u51fa\u7edf\u4e00\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u6280\u80fd\u68c0\u7d22\u4e0e\u6280\u80fd\u5229\u7528\u6574\u5408\u5230\u540c\u4e00\u4e2a\u6a21\u578b\u4e2d\uff0c\u901a\u8fc7\u6307\u4ee4\u5fae\u8c03\u9884\u70ed\u548c\u5206\u7ec4\u76f8\u5bf9\u7b56\u7565\u4f18\u5316\u8054\u5408\u8bad\u7ec3\u3002\u5728\u4e94\u4e2a\u6280\u80fd\u76f8\u5173\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u4e24\u79cd\u57fa\u7840\u6a21\u578b\u7684\u5e73\u5747\u6027\u80fd\u5206\u522b\u63d0\u534766.59%\u548c34.82%\uff0c\u5e76\u80fd\u9002\u914d\u591a\u79cd\u6280\u80fd\u68c0\u7d22\u5f15\u64ce\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38204", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38204v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Two Birds with One Stone: Skill-Augmented Generation via Unified Retrieval and Utilization", "tldr": "\u63d0\u51fa\u7edf\u4e00\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5c06\u6280\u80fd\u68c0\u7d22\u4e0e\u6280\u80fd\u5229\u7528\u6574\u5408\u5230\u540c\u4e00\u4e2a\u6a21\u578b\u4e2d\uff0c\u901a\u8fc7\u6307\u4ee4\u5fae\u8c03\u9884\u70ed\u548c\u5206\u7ec4\u76f8\u5bf9\u7b56\u7565\u4f18\u5316\u8054\u5408\u8bad\u7ec3\u3002\u5728\u4e94\u4e2a\u6280\u80fd\u76f8\u5173\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u4e24\u79cd\u57fa\u7840\u6a21\u578b\u7684\u5e73\u5747\u6027\u80fd\u5206\u522b\u63d0\u534766.59%\u548c34.82%\uff0c\u5e76\u80fd\u9002\u914d\u591a\u79cd\u6280\u80fd\u68c0\u7d22\u5f15\u64ce\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Topology-agnostic motion generation aims to synthesize motions for diverse characters with arbitrary skeletons. Unlike conventional motion generation, which assumes a fixed skeletal template, this setting must handle diverse joint configurations and inconsistent joint semantics across characters. Existing methods address this challenge through dense full-joint modeling, which incurs substantial computational cost and hinders learning transferable motion patterns across diverse skeletal topologies. We present ETA-Motion, a topology-agnostic motion generation framework based on sparse joint learning. Instead of learning motion from all joints, our method uses a compact subset of joints to reduce redundancy and trains the motion generator on the resulting sparse skeleton. To facilitate correspondence across diverse topologies, we introduce semantic joint embeddings that combine textual and visual cues, together with topology-aware training objectives for preserving skeletal structure. Although ETA-Motion is trained only on sparse skeletal observations, it supports full-skeleton motion generation during inference. Experimental results demonstrate that ETA-Motion outperforms existing topology-agnostic baselines while significantly improving efficiency and generalization to unseen motions and unseen topologies.", "arxiv_id": "2610.38259", "arxiv_url": "https://arxiv.org/abs/2610.38259", "authors": ["Seoyoung Hwang", "Tae-Kyun Kim"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u7a00\u758f\u5173\u8282\u5b66\u4e60\u7684\u52a8\u4f5c\u6269\u6563\u6846\u67b6\uff0c\u4ec5\u7528\u5c11\u91cf\u5173\u8282\u8bad\u7ec3\uff0c\u5374\u80fd\u5728\u63a8\u7406\u65f6\u4e3a\u4efb\u610f\u9aa8\u67b6\u751f\u6210\u5b8c\u6574\u52a8\u4f5c\u3002\u901a\u8fc7\u878d\u5408\u6587\u672c\u4e0e\u89c6\u89c9\u7ebf\u7d22\u7684\u5173\u8282\u8bed\u4e49\u8868\u793a\u53ca\u62d3\u6251\u611f\u77e5\u8bad\u7ec3\u76ee\u6807\uff0c\u8be5\u65b9\u6cd5\u4f18\u4e8e\u73b0\u6709\u8de8\u9aa8\u67b6\u57fa\u7ebf\uff0c\u540c\u65f6\u63d0\u5347\u8ba1\u7b97\u6548\u7387\u548c\u5bf9\u672a\u89c1\u52a8\u4f5c\u3001\u9aa8\u67b6\u62d3\u6251\u7684\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38259", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u52a8\u4f5c\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001", "\u7a00\u758f\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38259v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ETA-Motion: Efficient Topology-Agnostic Motion Diffusion via Sparse Joint Learning", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u7a00\u758f\u5173\u8282\u5b66\u4e60\u7684\u52a8\u4f5c\u6269\u6563\u6846\u67b6\uff0c\u4ec5\u7528\u5c11\u91cf\u5173\u8282\u8bad\u7ec3\uff0c\u5374\u80fd\u5728\u63a8\u7406\u65f6\u4e3a\u4efb\u610f\u9aa8\u67b6\u751f\u6210\u5b8c\u6574\u52a8\u4f5c\u3002\u901a\u8fc7\u878d\u5408\u6587\u672c\u4e0e\u89c6\u89c9\u7ebf\u7d22\u7684\u5173\u8282\u8bed\u4e49\u8868\u793a\u53ca\u62d3\u6251\u611f\u77e5\u8bad\u7ec3\u76ee\u6807\uff0c\u8be5\u65b9\u6cd5\u4f18\u4e8e\u73b0\u6709\u8de8\u9aa8\u67b6\u57fa\u7ebf\uff0c\u540c\u65f6\u63d0\u5347\u8ba1\u7b97\u6548\u7387\u548c\u5bf9\u672a\u89c1\u52a8\u4f5c\u3001\u9aa8\u67b6\u62d3\u6251\u7684\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Walking offers a window into physical function that may support interpretable video-based frailty assessment. We developed silhouette-based \"gaitomics\" to connect frailty predictions with measurable patterns of body configuration and movement. In 66 older adults assessed using the Fried Frailty Phenotype, standardized silhouettes and gait energy images yielded 90 descriptors of shape, temporal variation, motion, and texture. Minimum redundancy maximum relevance selection using the mutual information difference criterion prioritized informative features while limiting redundancy. Each classifier was evaluated using nested stratified cross-validation with five outer and three inner folds at the participant level, with feature ranking and feature-count selection confined to training partitions. Shapley additive explanations examined contributions to held-out predictions. Bilateral silhouette difference led the aggregate feature-selection rankings for three-class classification and both comparisons involving frail participants. Attribution profiles differed across tasks, with texture and consecutive-frame silhouette differences prominent in three-class classification. Among classifier-specific evaluations, CatBoost achieved the highest mean three-class micro-AUC of 0.647 \\pm 0.085. Leading pairwise mean micro-AUCs were 0.833 \\pm 0.249 for frail versus nonfrail, 0.765 \\pm 0.168 for frail versus prefrail, and 0.554 \\pm 0.129 for prefrail versus nonfrail classification. These findings connect model predictions to explicit gait characteristics while revealing task-dependent feature priorities and limited separation of prefrail and nonfrail participants. The framework provides an interpretable basis for further investigation, with larger independent studies needed to establish reliability and clinical relevance.", "arxiv_id": "2610.38223", "arxiv_url": "https://arxiv.org/abs/2610.38223", "authors": ["Laura McDaniel", "Ryan Roemmich", "Crystal Szczesny", "Peter Abadir", "Rama Chellappa", "Basudha Pal"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u4eba\u4f53\u8f6e\u5ed3\u7684\u6b65\u6001\u7279\u5f81\u6846\u67b6\uff0c\u4ece66\u540d\u8001\u5e74\u4eba\u7684\u89c6\u9891\u4e2d\u63d0\u53d690\u9879\u5f62\u6001\u3001\u8fd0\u52a8\u4e0e\u7eb9\u7406\u6307\u6807\uff0c\u7528\u4e8e\u53ef\u89e3\u91ca\u7684\u8870\u5f31\u8bc4\u4f30\u3002\u4e09\u5206\u7c7b\u5e73\u5747\u5fae\u89c2\u66f2\u7ebf\u4e0b\u9762\u79ef\u4e3a0.647\uff0c\u8870\u5f31\u4e0e\u975e\u8870\u5f31\u4e8c\u5206\u7c7b\u8fbe\u52300.833\uff0c\u4f46\u8870\u5f31\u524d\u671f\u4e0e\u975e\u8870\u5f31\u533a\u5206\u8f83\u5f31\uff0c\u4ecd\u9700\u66f4\u5927\u89c4\u6a21\u72ec\u7acb\u7814\u7a76\u9a8c\u8bc1\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38223", "impact_score": 4, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u6b65\u6001\u5206\u6790", "\u53ef\u89e3\u91ca\u6027", "\u5065\u5eb7\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38223v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Silhouette-Based Gaitomics for Frailty Assessment in Older Adults", "tldr": "\u63d0\u51fa\u57fa\u4e8e\u4eba\u4f53\u8f6e\u5ed3\u7684\u6b65\u6001\u7279\u5f81\u6846\u67b6\uff0c\u4ece66\u540d\u8001\u5e74\u4eba\u7684\u89c6\u9891\u4e2d\u63d0\u53d690\u9879\u5f62\u6001\u3001\u8fd0\u52a8\u4e0e\u7eb9\u7406\u6307\u6807\uff0c\u7528\u4e8e\u53ef\u89e3\u91ca\u7684\u8870\u5f31\u8bc4\u4f30\u3002\u4e09\u5206\u7c7b\u5e73\u5747\u5fae\u89c2\u66f2\u7ebf\u4e0b\u9762\u79ef\u4e3a0.647\uff0c\u8870\u5f31\u4e0e\u975e\u8870\u5f31\u4e8c\u5206\u7c7b\u8fbe\u52300.833\uff0c\u4f46\u8870\u5f31\u524d\u671f\u4e0e\u975e\u8870\u5f31\u533a\u5206\u8f83\u5f31\uff0c\u4ecd\u9700\u66f4\u5927\u89c4\u6a21\u72ec\u7acb\u7814\u7a76\u9a8c\u8bc1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Short video platforms have become a primary channel for black and gray industry operations in internet finance, where inducements such as prompts to like, follow, join private chat groups, or click external links frequently steer users toward fraud. Because such videos are short, dynamic, and often convey intent through fleeting visual cues rather than stable text, a moderation system must guarantee detection recall and localize the offending segment so reviewers inspect only the relevant clip. Existing OCR+LLM pipelines transcribe on-screen text frame by frame and classify the transcript, but exploit only textual information. Many inducements are conveyed through visual cues OCR cannot observe, and keyframe-based localization cannot recover precise temporal boundaries. We explore OCR+MLLM, which augments the text pipeline with a Multimodal Large Language Model, and compare three routes: OCR+LLM, OCR+MLLM, and a large zero-shot MLLM, along detection, latency, token consumption, and deployment complexity. OCR preserves the text signal that guarantees recall, while the MLLM jointly performs OCR-grounded discrimination and temporal grounding, localizing both textual and non-textual inducements. We construct a dataset of 2,419 internet finance short videos (66.49 hours) with 3,194 annotated events across four categories, and study reward design for RL-based grounding under class imbalance. We report two findings: auxiliary reward terms are exploited through reward hacking, and stronger localization rewards degrade class-balanced detection. We therefore design a recall-weighted F2 localization reward with class-balanced resampling. Experiments show OCR+MLLM localizes better than the keyframe OCR+LLM baseline (mIoU 26.52 vs. 14.49) and detects non-textual inducements that text-only pipelines miss, while maintaining 67.0 percent macro recall.", "arxiv_id": "2610.38185", "arxiv_url": "https://arxiv.org/abs/2610.38185", "authors": ["Xiaoyong Yu"], "brief": "\u63d0\u51fa\u7ed3\u5408\u6587\u5b57\u8bc6\u522b\u4e0e\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u77ed\u89c6\u9891\u6b3a\u8bc8\u8bf1\u5bfc\u5ba1\u6838\u65b9\u6cd5\uff0c\u8bc6\u522b\u6587\u5b57\u53ca\u975e\u6587\u5b57\u8bf1\u5bfc\u5e76\u5b9a\u4f4d\u8fdd\u89c4\u7247\u6bb5\uff0c\u540c\u65f6\u6784\u5efa\u6807\u6ce8\u6570\u636e\u96c6\u5e76\u4f18\u5316\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u3002\u76f8\u6bd4\u7eaf\u6587\u672c\u57fa\u7ebf\uff0c\u5b9a\u4f4d\u5e73\u5747\u4ea4\u5e76\u6bd4\u4ece14.49\u63d0\u5347\u81f326.52\uff0c\u5b8f\u5e73\u5747\u53ec\u56de\u7387\u4fdd\u6301\u572867.0%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38185", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5185\u5bb9\u5ba1\u6838", "\u5f3a\u5316\u5b66\u4e60", "\u65f6\u5e8f\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38185v1", "published_at": "2026-10-28", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Complementing Text Based Moderation with Multimodal Grounding: Detecting Fraudulent Inducement Behaviors on Short Video Platforms", "tldr": "\u63d0\u51fa\u7ed3\u5408\u6587\u5b57\u8bc6\u522b\u4e0e\u591a\u6a21\u6001\u5927\u6a21\u578b\u7684\u77ed\u89c6\u9891\u6b3a\u8bc8\u8bf1\u5bfc\u5ba1\u6838\u65b9\u6cd5\uff0c\u8bc6\u522b\u6587\u5b57\u53ca\u975e\u6587\u5b57\u8bf1\u5bfc\u5e76\u5b9a\u4f4d\u8fdd\u89c4\u7247\u6bb5\uff0c\u540c\u65f6\u6784\u5efa\u6807\u6ce8\u6570\u636e\u96c6\u5e76\u4f18\u5316\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u3002\u76f8\u6bd4\u7eaf\u6587\u672c\u57fa\u7ebf\uff0c\u5b9a\u4f4d\u5e73\u5747\u4ea4\u5e76\u6bd4\u4ece14.49\u63d0\u5347\u81f326.52\uff0c\u5b8f\u5e73\u5747\u53ec\u56de\u7387\u4fdd\u6301\u572867.0%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
