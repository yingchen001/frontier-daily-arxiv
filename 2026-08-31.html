ensity cumulative ALR (cALR@0.9). Experiments were repeated across three training seeds using the COVID-19 Radiography Database for four-class internal testing and a locked Shenzhen-to-Montgomery protocol for zero-shot external tuberculosis testing. On COVID-19, the proposed model achieved a weighted F1 of $0.9615 \\pm 0.0015$ and macro ROC-AUC of $0.9906 \\pm 0.0007$. In an architecture-matched dual-bridge comparison, replacing conventional GAP with MGAP increased ALR from $0.3878 \\pm 0.0098$ to $0.7086 \\pm 0.0104$ and cALR@0.9 from $0.5265 \\pm 0.0101$ to $0.9905 \\pm 0.0018$, while weighted F1 remained essentially unchanged ($0.9618 \\pm 0.0015$ vs. $0.9615 \\pm 0.0015$). Under locked external transfer to Montgomery, ROC-AUC remained $0.9080 \\pm 0.0043$ and pulmonary ALR remained $0.6466 \\pm 0.0081$, whereas weighted F1 decreased to $0.7528 \\pm 0.0080$ and ECE increased to $0.1683 \\pm 0.0055$. These findings show that diagnostic discrimination, calibration, and pulmonary attribution containment are distinct model properties and support their joint evaluation under internal testing and external domain shift.", "arxiv_id": "2608.30467", "arxiv_url": "https://arxiv.org/abs/2608.30467", "authors": ["Abdullah Al Mamun", "Md. Nasif Osman Khansur", "Md Ashraful Hossen Akash", "Md. Kishor Morol", "Tze Hui Liew"], "brief": "\u672c\u6587\u63d0\u51fa DBCA-SegNet-MGAP\uff0c\u4e00\u79cd\u7ed3\u5408\u80ba\u90e8\u5206\u5272\u5148\u9a8c\u4e0e CNN-Transformer \u53cc\u5411\u6ce8\u610f\u529b\u7684\u80f8\u7247\u5206\u7c7b\u6846\u67b6\uff0c\u7528\u4e8e\u8861\u91cf\u6a21\u578b\u9884\u6d4b\u662f\u5426\u4e3b\u8981\u4f9d\u8d56\u80ba\u90e8\u533a\u57df\u800c\u4e0d\u53ea\u662f\u8ffd\u6c42\u51c6\u786e\u7387\u3002\u5b9e\u9a8c\u663e\u793a MGAP \u5728\u51e0\u4e4e\u4e0d\u5f71\u54cd\u5206\u7c7b F1 \u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u80ba\u90e8\u5f52\u56e0\u96c6\u4e2d\u5ea6\uff0c\u5e76\u5728\u5916\u90e8\u7ed3\u6838\u6570\u636e\u57df\u8fc1\u79fb\u4e0b\u4fdd\u6301\u8f83\u9ad8 ROC-AUC\uff0c\u4f46\u6821\u51c6\u548c F1 \u4ecd\u4e0b\u964d\uff0c\u8bf4\u660e\u8bca\u65ad\u6027\u80fd\u3001\u6821\u51c6\u548c\u89e3\u5256\u5f52\u56e0\u53ef\u9760\u6027\u9700\u8981\u8054\u5408\u8bc4\u4f30\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30467", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u80f8\u7247\u5206\u7c7b", "\u53ef\u89e3\u91ca\u6027", "\u57df\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30467v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Beyond Accuracy: Quantifying Pulmonary Attribution in Anatomy-Guided Chest X-Ray Classification Under Domain Shift", "tldr": "\u672c\u6587\u63d0\u51fa DBCA-SegNet-MGAP\uff0c\u4e00\u79cd\u7ed3\u5408\u80ba\u90e8\u5206\u5272\u5148\u9a8c\u4e0e CNN-Transformer \u53cc\u5411\u6ce8\u610f\u529b\u7684\u80f8\u7247\u5206\u7c7b\u6846\u67b6\uff0c\u7528\u4e8e\u8861\u91cf\u6a21\u578b\u9884\u6d4b\u662f\u5426\u4e3b\u8981\u4f9d\u8d56\u80ba\u90e8\u533a\u57df\u800c\u4e0d\u53ea\u662f\u8ffd\u6c42\u51c6\u786e\u7387\u3002\u5b9e\u9a8c\u663e\u793a MGAP \u5728\u51e0\u4e4e\u4e0d\u5f71\u54cd\u5206\u7c7b F1 \u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u80ba\u90e8\u5f52\u56e0\u96c6\u4e2d\u5ea6\uff0c\u5e76\u5728\u5916\u90e8\u7ed3\u6838\u6570\u636e\u57df\u8fc1\u79fb\u4e0b\u4fdd\u6301\u8f83\u9ad8 ROC-AUC\uff0c\u4f46\u6821\u51c6\u548c F1 \u4ecd\u4e0b\u964d\uff0c\u8bf4\u660e\u8bca\u65ad\u6027\u80fd\u3001\u6821\u51c6\u548c\u89e3\u5256\u5f52\u56e0\u53ef\u9760\u6027\u9700\u8981\u8054\u5408\u8bc4\u4f30\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate bladder tumor segmentation and assessment of mus- cle invasion from T2-weighted MRI are important for treatment plan- ning, but developing robust models across institutions is challenging be- cause patient data cannot be centrally pooled and imaging characteristics vary across scanners and acquisition protocols. We propose a federated multi-task learning framework for joint bladder tumor segmentation and MIBC/NMIBC classification across four clinical centers. The proposed Swin Hybrid model combines a ResNet-34 branch for local texture and boundary information with a Swin-Tiny Transformer for global anatomi- cal context. A segmentation-guided classification mechanism further uses tumor localization information to support MIBC prediction. We also investigate several augmentation strategies under both centralized and federated training to improve robustness to multi-center variability. Ex- periments on the FedBCa dataset show that the Swin Hybrid provides the best overall balance between segmentation and classification among the evaluated architectures. Under federated training, Geo+Elastic aug- mentation achieved a DSC of 0.8100 and a patient-level AUC of 0.8931, yielding the highest combined score of 0.8474. These results demonstrate that joint segmentation and classification can be effectively performed across multiple institutions using federated training without centralizing patient data.", "arxiv_id": "2608.30458", "arxiv_url": "https://arxiv.org/abs/2608.30458", "authors": ["Malhar Udmale", "Divyanshu Dwivedi", "Aarohi Dhand", "Sachin Dudda Nagaraju", "Mayank Rai", "Bagesh Kumar"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u8054\u90a6\u591a\u4efb\u52a1\u5b66\u4e60\u6846\u67b6\uff0c\u5728\u56db\u4e2a\u4e34\u5e8a\u4e2d\u5fc3\u4e0a\u8054\u5408\u8fdb\u884c\u8180\u80f1\u80bf\u7624\u5206\u5272\u4e0e\u808c\u5c42\u6d78\u6da6\u6027\u8180\u80f1\u764c\u5206\u7c7b\uff0c\u65e0\u9700\u96c6\u4e2d\u60a3\u8005\u6570\u636e\u3002\u5176\u6df7\u5408 CNN-Transformer \u6a21\u578b\u7ed3\u5408\u5c40\u90e8\u7eb9\u7406\u4e0e\u5168\u5c40\u89e3\u5256\u4fe1\u606f\uff0c\u5e76\u7528\u5206\u5272\u7ed3\u679c\u8f85\u52a9\u5206\u7c7b\uff1b\u5728\u8054\u90a6\u8bad\u7ec3\u4e0b\u914d\u5408\u51e0\u4f55+\u5f39\u6027\u589e\u5f3a\u53d6\u5f97 DSC 0.8100\u3001\u60a3\u8005\u7ea7 AUC 0.8931\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30458", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8054\u90a6\u5b66\u4e60", "\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u591a\u4efb\u52a1\u5b66\u4e60", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30458v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Federated Multi-Task Learning for Bladder Tumor Segmentation and MIBC Classification Using a Hybrid CNN-Transformer Architecture", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u8054\u90a6\u591a\u4efb\u52a1\u5b66\u4e60\u6846\u67b6\uff0c\u5728\u56db\u4e2a\u4e34\u5e8a\u4e2d\u5fc3\u4e0a\u8054\u5408\u8fdb\u884c\u8180\u80f1\u80bf\u7624\u5206\u5272\u4e0e\u808c\u5c42\u6d78\u6da6\u6027\u8180\u80f1\u764c\u5206\u7c7b\uff0c\u65e0\u9700\u96c6\u4e2d\u60a3\u8005\u6570\u636e\u3002\u5176\u6df7\u5408 CNN-Transformer \u6a21\u578b\u7ed3\u5408\u5c40\u90e8\u7eb9\u7406\u4e0e\u5168\u5c40\u89e3\u5256\u4fe1\u606f\uff0c\u5e76\u7528\u5206\u5272\u7ed3\u679c\u8f85\u52a9\u5206\u7c7b\uff1b\u5728\u8054\u90a6\u8bad\u7ec3\u4e0b\u914d\u5408\u51e0\u4f55+\u5f39\u6027\u589e\u5f3a\u53d6\u5f97 DSC 0.8100\u3001\u60a3\u8005\u7ea7 AUC 0.8931\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Image-based 3D visual grounding is critical for embodied agents, yet existing benchmarks suffer from loose text-observation alignment and neglect temporal ordering. We introduce SeqAlign3DVG, a novel benchmark dedicated to temporally ordered and strictly observation-aligned image-based 3D visual grounding. Unlike prior works using order-agnostic views or global point clouds, SeqAlign3DVG ensures all expressions are human-verified and strictly grounded in the provided RGB observations (single frames or ordered observation sequences). It comprises 9,622 single-view and 14,493 sequence samples featuring rich descriptions, complex relations, and multi-instance ambiguities. To tackle this benchmark, we propose a unified voxel-based pipeline featuring Relevance-Ordered Voxel Memory (ROVM) and Progressive Language-Voxel Fusion (PLVF). ROVM dynamically ranks and aggregates multi-view evidence via a conservative memory to mitigate noisy observations, while PLVF performs coarse-to-fine spatial-linguistic reasoning for precise disambiguation. Our approach achieves state-of-the-art performance under the depth-free protocol, significantly improving localization for targets defined by complex relations and appearance cues.", "arxiv_id": "2608.30451", "arxiv_url": "https://arxiv.org/abs/2608.30451", "authors": ["Yi Zhang", "Yi Wang", "Yueting Wu", "Kaiyue Yang", "Yuejiao Su", "Lap-Pui Chau"], "brief": "\u8bba\u6587\u63d0\u51fa SeqAlign3DVG\uff0c\u4e00\u4e2a\u5f3a\u8c03\u65f6\u95f4\u987a\u5e8f\u4e14\u4e0e RGB \u89c2\u6d4b\u4e25\u683c\u5bf9\u9f50\u7684\u56fe\u50cf\u5f0f 3D \u89c6\u89c9\u5b9a\u4f4d\u57fa\u51c6\uff0c\u5305\u542b\u5355\u89c6\u89d2\u4e0e\u5e8f\u5217\u6837\u672c\u5e76\u8986\u76d6\u590d\u6742\u5173\u7cfb\u548c\u591a\u5b9e\u4f8b\u6b67\u4e49\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u57fa\u4e8e\u4f53\u7d20\u7684\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u76f8\u5173\u6027\u6392\u5e8f\u4f53\u7d20\u8bb0\u5fc6\u548c\u6e10\u8fdb\u8bed\u8a00-\u4f53\u7d20\u878d\u5408\u63d0\u5347\u65e0\u6df1\u5ea6\u8bbe\u7f6e\u4e0b\u7684\u76ee\u6807\u5b9a\u4f4d\u6027\u80fd\uff0c\u5c24\u5176\u6539\u5584\u590d\u6742\u5173\u7cfb\u4e0e\u5916\u89c2\u7ebf\u7d22\u76ee\u6807\u7684\u5b9a\u4f4d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30451", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["3D\u89c6\u89c9\u5b9a\u4f4d", "\u591a\u89c6\u89d2\u63a8\u7406", "\u4f53\u7d20\u8868\u793a", "\u5177\u8eab\u667a\u80fd"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30451v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SeqAlign3DVG: A Sequence-Aligned Benchmark and Voxel Reasoning Framework for 3D Visual Grounding", "tldr": "\u8bba\u6587\u63d0\u51fa SeqAlign3DVG\uff0c\u4e00\u4e2a\u5f3a\u8c03\u65f6\u95f4\u987a\u5e8f\u4e14\u4e0e RGB \u89c2\u6d4b\u4e25\u683c\u5bf9\u9f50\u7684\u56fe\u50cf\u5f0f 3D \u89c6\u89c9\u5b9a\u4f4d\u57fa\u51c6\uff0c\u5305\u542b\u5355\u89c6\u89d2\u4e0e\u5e8f\u5217\u6837\u672c\u5e76\u8986\u76d6\u590d\u6742\u5173\u7cfb\u548c\u591a\u5b9e\u4f8b\u6b67\u4e49\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa\u57fa\u4e8e\u4f53\u7d20\u7684\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u76f8\u5173\u6027\u6392\u5e8f\u4f53\u7d20\u8bb0\u5fc6\u548c\u6e10\u8fdb\u8bed\u8a00-\u4f53\u7d20\u878d\u5408\u63d0\u5347\u65e0\u6df1\u5ea6\u8bbe\u7f6e\u4e0b\u7684\u76ee\u6807\u5b9a\u4f4d\u6027\u80fd\uff0c\u5c24\u5176\u6539\u5584\u590d\u6742\u5173\u7cfb\u4e0e\u5916\u89c2\u7ebf\u7d22\u76ee\u6807\u7684\u5b9a\u4f4d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video virtual try-on aims to transfer a target garment onto a moving person across video frames. Current methods rely on human parsing masks or pose keypoints that frequently fail under large motions and occlusions, causing boundary artifacts and temporal inconsistency. A further limitation is that most approaches rely solely on attention mechanisms for temporal modeling, providing no explicit motion supervision. We propose FlowVVTON, a mask-free framework that eliminates parsing mask dependency entirely. Optical flow is used solely as a training-time supervision signal: a flow-warped latent loss, applied across all layers of the generation model, enforces multi-scale temporal consistency by aligning adjacent-frame features under explicit physical motion constraints. A two-stage training strategy establishes mask-free spatial alignment before introducing flow-guided temporal supervision. Experiments on TikTokDress show that FlowVVTON outperforms baselines by substantial margins, particularly in temporal consistency (5.7$\\times$ VFID-R improvement over SwiftTry), while requiring no segmentation masks, pose keypoints, or region annotations at any stage.", "arxiv_id": "2608.30450", "arxiv_url": "https://arxiv.org/abs/2608.30450", "authors": ["Shengyao Chen", "Xianbing Sun", "Liqing Zhang", "Jianfu Zhang"], "brief": "FlowVVTON \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u4eba\u4f53\u89e3\u6790\u63a9\u7801\u3001\u59ff\u6001\u5173\u952e\u70b9\u6216\u533a\u57df\u6807\u6ce8\u7684\u89c6\u9891\u865a\u62df\u8bd5\u8863\u6846\u67b6\uff0c\u907f\u514d\u5927\u5e45\u8fd0\u52a8\u548c\u906e\u6321\u4e0b\u7684\u63a9\u7801\u5931\u8d25\u95ee\u9898\u3002\u65b9\u6cd5\u4ec5\u5728\u8bad\u7ec3\u65f6\u7528\u5149\u6d41\u4f5c\u4e3a\u76d1\u7763\uff0c\u901a\u8fc7\u591a\u5c42 latent \u7684\u5149\u6d41\u626d\u66f2\u635f\u5931\u663e\u5f0f\u7ea6\u675f\u76f8\u90bb\u5e27\u8fd0\u52a8\u4e00\u81f4\u6027\uff0c\u5728 TikTokDress \u4e0a\u663e\u8457\u63d0\u5347\u65f6\u5e8f\u7a33\u5b9a\u6027\uff0cVFID-R \u76f8\u6bd4 SwiftTry \u6539\u5584 5.7 \u500d\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30450", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u865a\u62df\u8bd5\u8863", "\u89c6\u9891\u751f\u6210", "\u5149\u6d41", "\u65f6\u5e8f\u4e00\u81f4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30450v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "FlowVVTON: Flow-Guided Mask-Free Video Virtual Try-On", "tldr": "FlowVVTON \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u4eba\u4f53\u89e3\u6790\u63a9\u7801\u3001\u59ff\u6001\u5173\u952e\u70b9\u6216\u533a\u57df\u6807\u6ce8\u7684\u89c6\u9891\u865a\u62df\u8bd5\u8863\u6846\u67b6\uff0c\u907f\u514d\u5927\u5e45\u8fd0\u52a8\u548c\u906e\u6321\u4e0b\u7684\u63a9\u7801\u5931\u8d25\u95ee\u9898\u3002\u65b9\u6cd5\u4ec5\u5728\u8bad\u7ec3\u65f6\u7528\u5149\u6d41\u4f5c\u4e3a\u76d1\u7763\uff0c\u901a\u8fc7\u591a\u5c42 latent \u7684\u5149\u6d41\u626d\u66f2\u635f\u5931\u663e\u5f0f\u7ea6\u675f\u76f8\u90bb\u5e27\u8fd0\u52a8\u4e00\u81f4\u6027\uff0c\u5728 TikTokDress \u4e0a\u663e\u8457\u63d0\u5347\u65f6\u5e8f\u7a33\u5b9a\u6027\uff0cVFID-R \u76f8\u6bd4 SwiftTry \u6539\u5584 5.7 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Splatting-based algorithms reconstruct photorealistic, real-time-renderable, and mesh-exportable 3D scenes from regular images, but they represent a scene as a single monolithic field. Therefore, the reconstruction has no object-level structure, leaving it infeasible for downstream editing or interaction. Moreover, regions that are never directly observed in the input scans are contaminated by the surrounding texture and left uncorrected, capping both mesh fidelity and novel-view synthesis. We propose a decompose-before-reconstruct approach: we segment the instances out of every frame, consider the remaining as background and inpaint it, reconstruct each instance and the background independently with mesh splatting, and compose them into a single scene. Our method significantly improves mesh fidelity (over a 5\\% gain in F-score) and novel-view synthesis, while supporting object-wise modifiability and interactivity. The code will be made publicly available.", "arxiv_id": "2608.30423", "arxiv_url": "https://arxiv.org/abs/2608.30423", "authors": ["Minhas Kamal", "Hiranya Garbha Kumar", "Mahedi Kamal", "Balakrishnan Prabhakaran"], "brief": "ObjectSplat\u63d0\u51fa\u201c\u5148\u5206\u89e3\u3001\u518d\u91cd\u5efa\u201d\u76843D\u573a\u666f\u91cd\u5efa\u6d41\u7a0b\uff1a\u5148\u5bf9\u6bcf\u5e27\u8fdb\u884c\u5b9e\u4f8b\u5206\u5272\uff0c\u5c06\u7269\u4f53\u4e0e\u80cc\u666f\u5206\u5f00\u5e76\u4fee\u590d\u80cc\u666f\uff0c\u518d\u5206\u522b\u7528mesh splatting\u91cd\u5efa\u5e76\u7ec4\u5408\u6210\u5b8c\u6574\u573a\u666f\u3002\u76f8\u6bd4\u5355\u4e00\u6574\u4f53\u573a\u8868\u793a\uff0c\u8be5\u65b9\u6cd5\u63d0\u5347\u4e86\u7f51\u683c\u4fdd\u771f\u5ea6\u548c\u65b0\u89c6\u89d2\u5408\u6210\u6548\u679c\uff0cF-score\u63d0\u5347\u8d85\u8fc75%\uff0c\u540c\u65f6\u652f\u6301\u6309\u7269\u4f53\u7f16\u8f91\u4e0e\u4ea4\u4e92\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30423", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u7f51\u683c\u91cd\u5efa", "\u573a\u666f\u7f16\u8f91", "\u5b9e\u4f8b\u5206\u5272"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30423v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ObjectSplat: Improving Mesh Fidelity and Interactivity for 3D Scenes via Object-Level Mesh Splatting", "tldr": "ObjectSplat\u63d0\u51fa\u201c\u5148\u5206\u89e3\u3001\u518d\u91cd\u5efa\u201d\u76843D\u573a\u666f\u91cd\u5efa\u6d41\u7a0b\uff1a\u5148\u5bf9\u6bcf\u5e27\u8fdb\u884c\u5b9e\u4f8b\u5206\u5272\uff0c\u5c06\u7269\u4f53\u4e0e\u80cc\u666f\u5206\u5f00\u5e76\u4fee\u590d\u80cc\u666f\uff0c\u518d\u5206\u522b\u7528mesh splatting\u91cd\u5efa\u5e76\u7ec4\u5408\u6210\u5b8c\u6574\u573a\u666f\u3002\u76f8\u6bd4\u5355\u4e00\u6574\u4f53\u573a\u8868\u793a\uff0c\u8be5\u65b9\u6cd5\u63d0\u5347\u4e86\u7f51\u683c\u4fdd\u771f\u5ea6\u548c\u65b0\u89c6\u89d2\u5408\u6210\u6548\u679c\uff0cF-score\u63d0\u5347\u8d85\u8fc75%\uff0c\u540c\u65f6\u652f\u6301\u6309\u7269\u4f53\u7f16\u8f91\u4e0e\u4ea4\u4e92\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automating the analysis of whole-slide images has high clinical value, since characterizing cancers requires examining them in detail. Such analysis increasingly relies on vision-language models that provide patch-level zero-shot predictions. However, these predictions remain noisy and must be refined with a few annotations. A promising paradigm for this refinement is few-shot transduction. Rather than treating each patch independently, these methods leverage the relations between patches, together with a few annotations, to refine all predictions jointly. However, current transductive methods are evaluated under conditions that overlook key properties of whole-slide images: (i) datasets consist of independent patches extracted from multiple slides, ignoring the complex tissue organization; (ii) datasets are mostly balanced, whereas a single whole-slide image exhibits severe class imbalance, with several classes absent; and (iii) annotations are sampled at random, without reflecting how a pathologist annotates a limited number of regions. To align the transduction paradigm to realistic whole-slide settings, we introduce the following contributions. First, we propose SlideCRF, which adapts conditional random fields for whole-slide images by combining spatial and biological cues while accounting for classes that may be absent from a given slide. Second, we provide a set of realistic annotation protocols, based on spatially localized clicks and scribbles, modeling different pathologist interactions, such as the iterative correction of model errors. Across four datasets, we show that SlideCRF outperforms current transductive methods in macro F1, improving over the zero-shot predictions by +24.2% and +37.5% with one and 16 clicks per present class, respectively.", "arxiv_id": "2608.30420", "arxiv_url": "https://arxiv.org/abs/2608.30420", "authors": ["Tiffanie Godelaine", "Maxime Zanella", "Karim El Khoury", "Benoit Macq", "Christophe De Vleeschouwer"], "brief": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u5168\u5207\u7247\u56fe\u50cf\u5c11\u6837\u672c\u4f20\u5bfc\u8bc4\u6d4b\u4e0d\u7b26\u5408\u771f\u5b9e\u75c5\u7406\u573a\u666f\uff0c\u5e76\u63d0\u51fa SlideCRF\uff0c\u5c06\u7a7a\u95f4\u7ed3\u6784\u4e0e\u751f\u7269\u5b66\u7ebf\u7d22\u7ed3\u5408\uff0c\u540c\u65f6\u5904\u7406\u5207\u7247\u4e2d\u7c7b\u522b\u7f3a\u5931\u548c\u4e25\u91cd\u7c7b\u522b\u4e0d\u5e73\u8861\u95ee\u9898\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u66f4\u771f\u5b9e\u7684\u70b9\u51fb\u3001\u6d82\u9e26\u7b49\u6807\u6ce8\u534f\u8bae\uff1b\u5728\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\uff0cSlideCRF \u76f8\u6bd4\u96f6\u6837\u672c\u9884\u6d4b\u663e\u8457\u63d0\u5347 macro F1\uff0c1 \u6b21\u548c 16 \u6b21\u70b9\u51fb\u573a\u666f\u4e0b\u5206\u522b\u63d0\u5347 24.2% \u548c 37.5%\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30420", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u5c11\u6837\u672c\u5b66\u4e60", "\u5168\u5207\u7247\u56fe\u50cf", "\u6761\u4ef6\u968f\u673a\u573a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30420v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Whole-Slide Image Analysis under Realistic Few-Shot Annotation Protocols", "tldr": "\u8bba\u6587\u6307\u51fa\u73b0\u6709\u5168\u5207\u7247\u56fe\u50cf\u5c11\u6837\u672c\u4f20\u5bfc\u8bc4\u6d4b\u4e0d\u7b26\u5408\u771f\u5b9e\u75c5\u7406\u573a\u666f\uff0c\u5e76\u63d0\u51fa SlideCRF\uff0c\u5c06\u7a7a\u95f4\u7ed3\u6784\u4e0e\u751f\u7269\u5b66\u7ebf\u7d22\u7ed3\u5408\uff0c\u540c\u65f6\u5904\u7406\u5207\u7247\u4e2d\u7c7b\u522b\u7f3a\u5931\u548c\u4e25\u91cd\u7c7b\u522b\u4e0d\u5e73\u8861\u95ee\u9898\u3002\u4f5c\u8005\u8fd8\u8bbe\u8ba1\u4e86\u66f4\u771f\u5b9e\u7684\u70b9\u51fb\u3001\u6d82\u9e26\u7b49\u6807\u6ce8\u534f\u8bae\uff1b\u5728\u56db\u4e2a\u6570\u636e\u96c6\u4e0a\uff0cSlideCRF \u76f8\u6bd4\u96f6\u6837\u672c\u9884\u6d4b\u663e\u8457\u63d0\u5347 macro F1\uff0c1 \u6b21\u548c 16 \u6b21\u70b9\u51fb\u573a\u666f\u4e0b\u5206\u522b\u63d0\u5347 24.2% \u548c 37.5%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "In semiconductor manufacturing, defect analysis is essential, but manual inspection cannot scale. However, existing automated inspection methods remain insufficient for root-cause analysis and process optimization. To this end, we present SePArate, a weakly supervised wafer defect segmentation method. SePArate enables pixel-level separation of patterns by leveraging only image-level annotations. It consists of a three-phase training: encoder pretraining, knowledge transfer to learn spatial cues, and training on synthetic mixed-defect data for accurate segmentation. Experiments demonstrate that SePArate outperforms the baselines.", "arxiv_id": "2608.30410", "arxiv_url": "https://arxiv.org/abs/2608.30410", "authors": ["Dain Kwon", "Changmin Shin", "Sunjong Park", "Kanghyun Choi", "Hyeyoon Lee", "Jaewon Jang", "Minseok Choi", "Jinho Lee"], "brief": "SePArate \u662f\u4e00\u79cd\u9762\u5411\u534a\u5bfc\u4f53\u6676\u5706\u7f3a\u9677\u5206\u6790\u7684\u5f31\u76d1\u7763\u5206\u5272\u65b9\u6cd5\uff0c\u4ec5\u4f7f\u7528\u56fe\u50cf\u7ea7\u6807\u6ce8\u5373\u53ef\u5b9e\u73b0\u50cf\u7d20\u7ea7\u7f3a\u9677\u6a21\u5f0f\u5206\u79bb\u3002\u65b9\u6cd5\u901a\u8fc7\u7f16\u7801\u5668\u9884\u8bad\u7ec3\u3001\u7a7a\u95f4\u7ebf\u7d22\u77e5\u8bc6\u8fc1\u79fb\u548c\u5408\u6210\u6df7\u5408\u7f3a\u9677\u6570\u636e\u8bad\u7ec3\u4e09\u9636\u6bb5\u6d41\u7a0b\uff0c\u5728\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u57fa\u7ebf\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u66f4\u7ec6\u7c92\u5ea6\u7684\u6839\u56e0\u5206\u6790\u4e0e\u5de5\u827a\u4f18\u5316\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30410", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f31\u76d1\u7763\u5b66\u4e60", "\u7f3a\u9677\u5206\u5272", "\u534a\u5bfc\u4f53\u5236\u9020", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30410v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SePArate: Segmenting Patterns from Defects in Wafer Manufacturing Using Weak Supervision", "tldr": "SePArate \u662f\u4e00\u79cd\u9762\u5411\u534a\u5bfc\u4f53\u6676\u5706\u7f3a\u9677\u5206\u6790\u7684\u5f31\u76d1\u7763\u5206\u5272\u65b9\u6cd5\uff0c\u4ec5\u4f7f\u7528\u56fe\u50cf\u7ea7\u6807\u6ce8\u5373\u53ef\u5b9e\u73b0\u50cf\u7d20\u7ea7\u7f3a\u9677\u6a21\u5f0f\u5206\u79bb\u3002\u65b9\u6cd5\u901a\u8fc7\u7f16\u7801\u5668\u9884\u8bad\u7ec3\u3001\u7a7a\u95f4\u7ebf\u7d22\u77e5\u8bc6\u8fc1\u79fb\u548c\u5408\u6210\u6df7\u5408\u7f3a\u9677\u6570\u636e\u8bad\u7ec3\u4e09\u9636\u6bb5\u6d41\u7a0b\uff0c\u5728\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u57fa\u7ebf\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8e\u66f4\u7ec6\u7c92\u5ea6\u7684\u6839\u56e0\u5206\u6790\u4e0e\u5de5\u827a\u4f18\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Accurate segmentation of the coronary vessel lumen is a prerequisite for quantitative assessment of atherosclerotic plaque and perivascular adipose tissue in coronary computed tomography angiography (CCTA). Cardiologists rely on semi-automated methods for this task because manual vessel tracing and segmentation are labour-intensive. Although many automated methods have been proposed, their validation remains limited by the lack of large, high-quality publicly available datasets. We provide a new dataset of voxel-wise annotations of the vessel lumen and coronary segments, alongside centerlines, and mesh surfaces for 800 scans from the publicly available ImageCAS dataset. Using this dataset, we benchmark established lumen segmentation methods against inter-observer variability, stratifying performance by disease, image quality, coronary dominance, coronary segment, vessel diameter, and lumen attenuation. These labels allow segmentation accuracy to be described in anatomical and clinical context rather than reported as a single aggregate score. The dataset supports the development and validation of methods for lumen segmentation, plaque and perivascular quantification, and haemodynamic modelling.", "arxiv_id": "2608.30404", "arxiv_url": "https://arxiv.org/abs/2608.30404", "authors": ["Kit M. Bransby", "Esther \u00d8ksnebjerg", "Kristoffer Kj\u00e6r", "Jacob Kirkeby", "Yasmin El Youssef", "A\u00efda Jim\u00e9nez", "Philip R. Pedersson", "Martina C. de Knegt", "Klaus F. Kofoed", "Rasmus R. Paulsen"], "brief": "\u672c\u6587\u53d1\u5e03 ImageCAS-X\uff0c\u5728 800 \u4f8b\u51a0\u8109 CTA \u626b\u63cf\u4e0a\u63d0\u4f9b\u51a0\u72b6\u52a8\u8109\u7ba1\u8154\u4f53\u7d20\u7ea7\u6807\u6ce8\u3001\u51a0\u8109\u5206\u6bb5\u3001\u4e2d\u5fc3\u7ebf\u548c\u7f51\u683c\u8868\u9762\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u96c6\uff0c\u4f5c\u8005\u7cfb\u7edf\u8bc4\u6d4b\u73b0\u6709\u7ba1\u8154\u5206\u5272\u65b9\u6cd5\uff0c\u5e76\u6309\u75be\u75c5\u3001\u56fe\u50cf\u8d28\u91cf\u3001\u8840\u7ba1\u76f4\u5f84\u3001\u89e3\u5256\u5206\u6bb5\u7b49\u4e34\u5e8a\u56e0\u7d20\u5206\u6790\u6027\u80fd\uff0c\u6709\u52a9\u4e8e\u66f4\u53ef\u9760\u5730\u9a8c\u8bc1\u51a0\u8109\u5206\u5272\u3001\u6591\u5757\u5b9a\u91cf\u548c\u8840\u6d41\u52a8\u529b\u5b66\u5efa\u6a21\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30404", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u5f71\u50cf", "\u56fe\u50cf\u5206\u5272", "\u6570\u636e\u96c6", "\u51a0\u8109CTA"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30404v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ImageCAS-X: a dataset and benchmark for coronary artery segmentation and centerline extraction in coronary CT angiography", "tldr": "\u672c\u6587\u53d1\u5e03 ImageCAS-X\uff0c\u5728 800 \u4f8b\u51a0\u8109 CTA \u626b\u63cf\u4e0a\u63d0\u4f9b\u51a0\u72b6\u52a8\u8109\u7ba1\u8154\u4f53\u7d20\u7ea7\u6807\u6ce8\u3001\u51a0\u8109\u5206\u6bb5\u3001\u4e2d\u5fc3\u7ebf\u548c\u7f51\u683c\u8868\u9762\u3002\u57fa\u4e8e\u8be5\u6570\u636e\u96c6\uff0c\u4f5c\u8005\u7cfb\u7edf\u8bc4\u6d4b\u73b0\u6709\u7ba1\u8154\u5206\u5272\u65b9\u6cd5\uff0c\u5e76\u6309\u75be\u75c5\u3001\u56fe\u50cf\u8d28\u91cf\u3001\u8840\u7ba1\u76f4\u5f84\u3001\u89e3\u5256\u5206\u6bb5\u7b49\u4e34\u5e8a\u56e0\u7d20\u5206\u6790\u6027\u80fd\uff0c\u6709\u52a9\u4e8e\u66f4\u53ef\u9760\u5730\u9a8c\u8bc1\u51a0\u8109\u5206\u5272\u3001\u6591\u5757\u5b9a\u91cf\u548c\u8840\u6d41\u52a8\u529b\u5b66\u5efa\u6a21\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "High-dynamic-range (HDR) images, with their rich tone and detail reproduction, hold significant potential to enhance computer vision systems, particularly in autonomous driving. However, most neural networks for embedded systems are trained on low-dynamic-range (LDR) inputs and suffer substantial performance degradation when handling high-bit-depth HDR images due to the challenges posed by extreme dynamic ranges. In this paper, we propose a novel tone mapping method that not only bridges the gap between HDR RAW inputs and the LDR sRGB requirements of detection networks but also achieves end-to-end optimization with downstream tasks. Instead of relying on the traditional image signal processing (ISP) pipeline, we introduce neural photometric calibration to regularize dynamic ranges and a scaling-invariant local tone mapping model to preserve image details. In addition, our architecture also supports performance transfer finetuning, enabling efficient adaptation from the LDR sRGB images to the HDR RAW images with minimal cost. The proposed method outperforms traditional tone mapping algorithms and advanced AI-ISP methods in challenging automotive HDR scenes. Moreover, our pipeline achieves real-time processing of 4K high-bit-depth HDR inputs on NVIDIA Jetson platforms.", "arxiv_id": "2608.30400", "arxiv_url": "https://arxiv.org/abs/2608.30400", "authors": ["Gongzhe Li", "Linwei Qiu", "Peibei Cao", "Fengying Xie", "Xiangyang Ji", "Qilin Sun"], "brief": "\u63d0\u51fa\u4e00\u79cd\u9762\u5411HDR\u76ee\u6807\u68c0\u6d4b\u7684\u5b9e\u65f6\u573a\u666f\u81ea\u9002\u5e94\u8272\u8c03\u6620\u5c04\u65b9\u6cd5\uff0c\u5c06HDR RAW\u8f93\u5165\u6709\u6548\u8f6c\u6362\u4e3a\u68c0\u6d4b\u7f51\u7edc\u53ef\u7528\u7684LDR sRGB\u8868\u793a\uff0c\u5e76\u53ef\u4e0e\u4e0b\u6e38\u68c0\u6d4b\u4efb\u52a1\u7aef\u5230\u7aef\u4f18\u5316\u3002\u65b9\u6cd5\u5728\u8f66\u8f7dHDR\u573a\u666f\u4e2d\u4f18\u4e8e\u4f20\u7edf\u8272\u8c03\u6620\u5c04\u548cAI-ISP\u65b9\u6848\uff0c\u5e76\u80fd\u5728NVIDIA Jetson\u4e0a\u5b9e\u65f6\u5904\u74064K\u9ad8\u4f4d\u6df1HDR\u8f93\u5165\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30400", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u76ee\u6807\u68c0\u6d4b", "\u9ad8\u52a8\u6001\u8303\u56f4", "\u8272\u8c03\u6620\u5c04", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30400v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Real-Time Scene-Adaptive Tone Mapping for High-Dynamic Range Object Detection", "tldr": "\u63d0\u51fa\u4e00\u79cd\u9762\u5411HDR\u76ee\u6807\u68c0\u6d4b\u7684\u5b9e\u65f6\u573a\u666f\u81ea\u9002\u5e94\u8272\u8c03\u6620\u5c04\u65b9\u6cd5\uff0c\u5c06HDR RAW\u8f93\u5165\u6709\u6548\u8f6c\u6362\u4e3a\u68c0\u6d4b\u7f51\u7edc\u53ef\u7528\u7684LDR sRGB\u8868\u793a\uff0c\u5e76\u53ef\u4e0e\u4e0b\u6e38\u68c0\u6d4b\u4efb\u52a1\u7aef\u5230\u7aef\u4f18\u5316\u3002\u65b9\u6cd5\u5728\u8f66\u8f7dHDR\u573a\u666f\u4e2d\u4f18\u4e8e\u4f20\u7edf\u8272\u8c03\u6620\u5c04\u548cAI-ISP\u65b9\u6848\uff0c\u5e76\u80fd\u5728NVIDIA Jetson\u4e0a\u5b9e\u65f6\u5904\u74064K\u9ad8\u4f4d\u6df1HDR\u8f93\u5165\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Cross-view video representation learning aims to capture viewpoint-invariant action semantics despite substantial appearance changes across egocentric and exocentric videos. However, existing methods encode each video as a unified embedding, where view-invariant and view-variant semantics inevitably entangle under co-occurrences - a failure mode we show persists even in cross-view methods explicitly trained for view-invariance. Our key insight is that a view-invariant feature is truly disentangled when it can be sufficiently recomposed with an arbitrary view-variant feature while preserving their independent semantics. Building on this, we propose PRISM, that decomposes video into view-invariant and view-variant latents and recompose them under language supervision encouraging clean decomposition of the two streams. PRISM achieves state-of-the-art results on EgoExo4D, EgoExoLearn, AE2, even surpassing in-domain models under zero-shot setting. Code is available at https://github.com/litcoderr/prism.", "arxiv_id": "2608.30388", "arxiv_url": "https://arxiv.org/abs/2608.30388", "authors": ["Youngchae Chee", "Hosu Lee", "Sungjune Park", "Junho Kim", "Yong Man Ro"], "brief": "\u672c\u6587\u63d0\u51fa PRISM\uff0c\u5c06\u89c6\u9891\u8868\u793a\u5206\u89e3\u4e3a\u89c6\u89d2\u4e0d\u53d8\u8bed\u4e49\u548c\u89c6\u89d2\u76f8\u5173\u8bed\u4e49\uff0c\u5e76\u901a\u8fc7\u8bed\u8a00\u76d1\u7763\u7684\u91cd\u7ec4\u673a\u5236\u4fc3\u4f7f\u4e24\u8005\u5e72\u51c0\u89e3\u8026\u3002\u8be5\u65b9\u6cd5\u5728 EgoExo4D\u3001EgoExoLearn\u3001AE2 \u7b49\u8de8\u89c6\u89d2\u89c6\u9891\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u96f6\u6837\u672c\u8bbe\u7f6e\u4e0b\u751a\u81f3\u8d85\u8fc7\u90e8\u5206\u57df\u5185\u6a21\u578b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30388", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u8868\u5f81\u5b66\u4e60", "\u8de8\u89c6\u89d2\u5b66\u4e60", "\u8bed\u4e49\u89e3\u8026", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30388v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "PRISM: Predictive Recomposition via Semantic Latent Decomposition for View-invariant Video Representation Learning", "tldr": "\u672c\u6587\u63d0\u51fa PRISM\uff0c\u5c06\u89c6\u9891\u8868\u793a\u5206\u89e3\u4e3a\u89c6\u89d2\u4e0d\u53d8\u8bed\u4e49\u548c\u89c6\u89d2\u76f8\u5173\u8bed\u4e49\uff0c\u5e76\u901a\u8fc7\u8bed\u8a00\u76d1\u7763\u7684\u91cd\u7ec4\u673a\u5236\u4fc3\u4f7f\u4e24\u8005\u5e72\u51c0\u89e3\u8026\u3002\u8be5\u65b9\u6cd5\u5728 EgoExo4D\u3001EgoExoLearn\u3001AE2 \u7b49\u8de8\u89c6\u89d2\u89c6\u9891\u57fa\u51c6\u4e0a\u8fbe\u5230\u6700\u4f18\u8868\u73b0\uff0c\u96f6\u6837\u672c\u8bbe\u7f6e\u4e0b\u751a\u81f3\u8d85\u8fc7\u90e8\u5206\u57df\u5185\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Automatic cardiac image segmentation is pivotal for diagnosing and treating cardiac diseases. In this work, we introduce MCSeg, a volumetric transformer-based network tailored for multi-modal cardiac segmentation. To overcome the architectural mismatch inherent in existing hybrid networks, we propose a novel Scaling Feature Pyramid (SFP). Unlike conventional skip connections, the SFP effectively bridges the single-scale 3D Vision Transformer (ViT) encoder and the multi-scale CNN decoder by transforming the ViT\u0027s output into a hierarchical feature pyramid, ensuring that global contextual information is effectively leveraged. For the training paradigm, the ViT encoder first undergoes self-supervised pre-training via masked image modeling. Subsequently, the network is fine-tuned on downstream tasks, during which a regional mutual information (RMI) loss is integrated to improve boundary segmentation accuracy. In experiments, MCSeg consistently outperforms eleven SOTA methods on CT dataset ImageCHD, multi-modal dataset MM-WHS, MRI dataset HVSMR-2.0 and MSD Heart, highlighting the effectiveness of our MCSeg for multi-modal cardiac segmentation tasks. Furthermore, MCSeg\u0027s superior performance in few-shot experiment showcases its significant potential in adapting to limited data scenarios. Codes and pre-trained ViT-B weights are open-sourced at https://openi.pcl.ac.cn/OpenMedIA/MCSeg", "arxiv_id": "2608.30371", "arxiv_url": "https://arxiv.org/abs/2608.30371", "authors": ["Zhiyu Ye", "Hairong Zheng", "Tong Zhang"], "brief": "\u672c\u6587\u63d0\u51fa MCSeg\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5fc3\u810f\u56fe\u50cf\u5206\u5272\u7684\u4f53\u7d20 Transformer \u7f51\u7edc\uff0c\u901a\u8fc7\u7f29\u653e\u7279\u5f81\u91d1\u5b57\u5854\u8fde\u63a5\u5355\u5c3a\u5ea6 3D ViT \u7f16\u7801\u5668\u4e0e\u591a\u5c3a\u5ea6 CNN \u89e3\u7801\u5668\u3002\u6a21\u578b\u7ed3\u5408\u63a9\u7801\u56fe\u50cf\u5efa\u6a21\u9884\u8bad\u7ec3\u4e0e RMI \u635f\u5931\u5fae\u8c03\uff0c\u5728\u591a\u4e2a CT/MRI/\u591a\u6a21\u6001\u5fc3\u810f\u6570\u636e\u96c6\u4e0a\u8d85\u8fc7 11 \u79cd SOTA \u65b9\u6cd5\uff0c\u5e76\u5728\u5c11\u6837\u672c\u573a\u666f\u8868\u73b0\u7a81\u51fa\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30371", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u533b\u5b66\u56fe\u50cf\u5206\u5272", "\u591a\u6a21\u6001", "\u89c6\u89c9Transformer", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30371v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MCSeg: Pre-training and Fine-tuning Volumetric Pyramid Transformer for Multi-modal Cardiac Image Segmentation", "tldr": "\u672c\u6587\u63d0\u51fa MCSeg\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u6a21\u6001\u5fc3\u810f\u56fe\u50cf\u5206\u5272\u7684\u4f53\u7d20 Transformer \u7f51\u7edc\uff0c\u901a\u8fc7\u7f29\u653e\u7279\u5f81\u91d1\u5b57\u5854\u8fde\u63a5\u5355\u5c3a\u5ea6 3D ViT \u7f16\u7801\u5668\u4e0e\u591a\u5c3a\u5ea6 CNN \u89e3\u7801\u5668\u3002\u6a21\u578b\u7ed3\u5408\u63a9\u7801\u56fe\u50cf\u5efa\u6a21\u9884\u8bad\u7ec3\u4e0e RMI \u635f\u5931\u5fae\u8c03\uff0c\u5728\u591a\u4e2a CT/MRI/\u591a\u6a21\u6001\u5fc3\u810f\u6570\u636e\u96c6\u4e0a\u8d85\u8fc7 11 \u79cd SOTA \u65b9\u6cd5\uff0c\u5e76\u5728\u5c11\u6837\u672c\u573a\u666f\u8868\u73b0\u7a81\u51fa\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in camouflaged object detection (COD) have led to substantial progress in challenging low-visibility scenarios, with pioneering studies demonstrating notable success in localizing objects in camouflaged scenes. Despite these achievements, existing approaches predominantly rely on conventional three-channel RGB imagery, thereby constraining the available visual information to a limited spectral range. Multispectral images offer a wide range of information about a scene by capturing fine-grained spectral signatures. Hence, by leveraging multispectral images for COD, we introduce a novel approach to detect camouflaged objects from the corresponding multispectral inputs. In particular, we propose an end-to-end framework, \\textbf{\\textit{MSFormer}}, that takes a multispectral camouflaged image as input and predicts a binary mask for it. Additionally, we also provide empirical justification for integrating multispectral bands for this complex low-vision task. Our extensive experiments demonstrate the effectiveness of our method, which outperforms existing methods.", "arxiv_id": "2608.30355", "arxiv_url": "https://arxiv.org/abs/2608.30355", "authors": ["Avi Gupta", "Trasha Gupta"], "brief": "\u8bba\u6587\u5c06\u4f2a\u88c5\u76ee\u6807\u68c0\u6d4b\u4ece\u4f20\u7edf RGB \u56fe\u50cf\u6269\u5c55\u5230\u591a\u5149\u8c31\u8f93\u5165\uff0c\u63d0\u51fa\u7aef\u5230\u7aef\u6846\u67b6 MSFormer\uff0c\u6839\u636e\u591a\u5149\u8c31\u4f2a\u88c5\u56fe\u50cf\u9884\u6d4b\u4e8c\u503c\u76ee\u6807\u63a9\u7801\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u591a\u5149\u8c31\u6ce2\u6bb5\u80fd\u4e3a\u4f4e\u53ef\u89c1\u5ea6\u573a\u666f\u63d0\u4f9b\u989d\u5916\u5224\u522b\u4fe1\u606f\uff0c\u65b9\u6cd5\u4f18\u4e8e\u73b0\u6709\u4f2a\u88c5\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30355", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f2a\u88c5\u76ee\u6807\u68c0\u6d4b", "\u591a\u5149\u8c31", "\u8ba1\u7b97\u673a\u89c6\u89c9", "Transformer"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30355v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Seeing the Unseen: Camouflaged Object Detection Beyond the Visible Spectrum", "tldr": "\u8bba\u6587\u5c06\u4f2a\u88c5\u76ee\u6807\u68c0\u6d4b\u4ece\u4f20\u7edf RGB \u56fe\u50cf\u6269\u5c55\u5230\u591a\u5149\u8c31\u8f93\u5165\uff0c\u63d0\u51fa\u7aef\u5230\u7aef\u6846\u67b6 MSFormer\uff0c\u6839\u636e\u591a\u5149\u8c31\u4f2a\u88c5\u56fe\u50cf\u9884\u6d4b\u4e8c\u503c\u76ee\u6807\u63a9\u7801\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u591a\u5149\u8c31\u6ce2\u6bb5\u80fd\u4e3a\u4f4e\u53ef\u89c1\u5ea6\u573a\u666f\u63d0\u4f9b\u989d\u5916\u5224\u522b\u4fe1\u606f\uff0c\u65b9\u6cd5\u4f18\u4e8e\u73b0\u6709\u4f2a\u88c5\u76ee\u6807\u68c0\u6d4b\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most shape reconstruction methods assume measurements defined over planar sensing domains, such as RGB images or depth maps. In this paper, we use a curved capacitive textile as a shape sensor, treating its surface as a non-planar sensing manifold. Each scan is represented as a capacitive proximity field on this manifold, induced by the interaction between the curved electrode layout and nearby object geometry. We introduce a multi-view feedforward reconstruction model that aggregates these fields across known sensor views and recovers the observed object shape. Simulated and physical experiments demonstrate robust reconstruction from capacitive proximity signals acquired on curved sensing surfaces, pointing toward a new route to robotic near-field geometric awareness via embodied sensing.", "arxiv_id": "2608.30344", "arxiv_url": "https://arxiv.org/abs/2608.30344", "authors": ["Hao Chen", "Chenming Wu", "Chun Ping Lam", "Xiangjia Chen", "Guoxin Fang", "Charlie C. L. Wang", "Yeung Yam", "Juncong Lin", "Chengkai Dai"], "brief": "\u672c\u6587\u63d0\u51fa Proximity3D\uff0c\u5c06\u5f2f\u66f2\u7535\u5bb9\u7ec7\u7269\u8868\u9762\u89c6\u4e3a\u975e\u5e73\u9762\u4f20\u611f\u6d41\u5f62\uff0c\u7528\u5176\u4e0a\u7684\u7535\u5bb9\u8fd1\u573a\u4fe1\u53f7\u8fdb\u884c\u4e09\u7ef4\u5f62\u72b6\u91cd\u5efa\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u89c6\u89d2\u524d\u9988\u6a21\u578b\u805a\u5408\u5df2\u77e5\u4f20\u611f\u5668\u89c6\u89d2\u4e0b\u7684\u7535\u5bb9\u573a\uff0c\u5728\u4eff\u771f\u548c\u5b9e\u7269\u5b9e\u9a8c\u4e2d\u5b9e\u73b0\u4e86\u8f83\u9c81\u68d2\u7684\u7269\u4f53\u5f62\u72b6\u6062\u590d\uff0c\u4e3a\u673a\u5668\u4eba\u8fd1\u573a\u51e0\u4f55\u611f\u77e5\u63d0\u4f9b\u4e86\u65b0\u601d\u8def\u3002", "categories": ["cs.CV", "cs.CG", "cs.GR", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30344", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u673a\u5668\u4eba\u611f\u77e5", "\u7535\u5bb9\u4f20\u611f", "\u51e0\u4f55\u611f\u77e5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30344v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Proximity3D: Shape from Capacitive Proximity on Sensing Manifold", "tldr": "\u672c\u6587\u63d0\u51fa Proximity3D\uff0c\u5c06\u5f2f\u66f2\u7535\u5bb9\u7ec7\u7269\u8868\u9762\u89c6\u4e3a\u975e\u5e73\u9762\u4f20\u611f\u6d41\u5f62\uff0c\u7528\u5176\u4e0a\u7684\u7535\u5bb9\u8fd1\u573a\u4fe1\u53f7\u8fdb\u884c\u4e09\u7ef4\u5f62\u72b6\u91cd\u5efa\u3002\u65b9\u6cd5\u901a\u8fc7\u591a\u89c6\u89d2\u524d\u9988\u6a21\u578b\u805a\u5408\u5df2\u77e5\u4f20\u611f\u5668\u89c6\u89d2\u4e0b\u7684\u7535\u5bb9\u573a\uff0c\u5728\u4eff\u771f\u548c\u5b9e\u7269\u5b9e\u9a8c\u4e2d\u5b9e\u73b0\u4e86\u8f83\u9c81\u68d2\u7684\u7269\u4f53\u5f62\u72b6\u6062\u590d\uff0c\u4e3a\u673a\u5668\u4eba\u8fd1\u573a\u51e0\u4f55\u611f\u77e5\u63d0\u4f9b\u4e86\u65b0\u601d\u8def\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "3D Gaussian Splatting (3DGS) enables photorealistic real-time novel view synthesis, yet placing a virtual camera to capture a desired frame remains largely manual. Existing language-guided approaches in 3D scenes mainly focus on object-centric grounding, determining what to observe but rarely controlling how it should appear in a single frame, such as subject orientation or frame layout. To address this limitation, we introduce a new task, Text-Instructed Viewpoint Grounding (TIVG), which aims to identify a 6-DoF camera pose in a 3D Gaussian scene whose rendered frame aligns with a text instruction. To solve this task, we propose CapFrame, a partially differentiable framework that converts language into geometric pseudo labels for camera pose optimization. CapFrame follows a Retrieve-Translate-Refine pipeline: it retrieves relevant views and ranks them through a Question-Evaluation process with MLLMs, translates the instruction into orientation and layout pseudo labels, and refines the camera pose via differentiable optimization with layout and orientation losses in 3DGS. Experiments on 38 real-world scenes with 135 instructions indicate that CapFrame produces viewpoints better aligned with texts than heuristic viewpoint search and adapted trajectory generation baselines, validated by VLM metrics, MLLM judges, and user studies. Code is available at: https://github.com/jirongli/CapFrame", "arxiv_id": "2608.30342", "arxiv_url": "https://arxiv.org/abs/2608.30342", "authors": ["Jirong Li", "Satoshi Ikehata", "Shuhei Kurita", "Ikuro Sato"], "brief": "\u672c\u6587\u63d0\u51fa\u6587\u672c\u6307\u4ee4\u89c6\u70b9\u5b9a\u4f4d\u4efb\u52a1 TIVG\uff0c\u76ee\u6807\u662f\u5728 3D Gaussian \u573a\u666f\u4e2d\u627e\u5230\u7b26\u5408\u6587\u5b57\u63cf\u8ff0\u7684 6-DoF \u76f8\u673a\u4f4d\u59ff\uff0c\u4ee5\u63a7\u5236\u4e3b\u4f53\u671d\u5411\u548c\u753b\u9762\u5e03\u5c40\u3002\u65b9\u6cd5 CapFrame \u901a\u8fc7\u591a\u6a21\u6001\u5927\u6a21\u578b\u68c0\u7d22\u8bc4\u4f30\u89c6\u89d2\uff0c\u5c06\u6587\u672c\u8f6c\u4e3a\u51e0\u4f55\u4f2a\u6807\u7b7e\uff0c\u5e76\u5728 3DGS \u4e2d\u53ef\u5fae\u4f18\u5316\u76f8\u673a\u4f4d\u59ff\uff1b\u5728\u771f\u5b9e\u573a\u666f\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u542f\u53d1\u5f0f\u641c\u7d22\u548c\u8f68\u8ff9\u751f\u6210\u57fa\u7ebf\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30342", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u89c6\u89c9", "3DGS", "\u591a\u6a21\u6001", "\u89c6\u70b9\u5b9a\u4f4d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30342v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CapFrame: Text-Instructed Viewpoint Grounding in 3D Gaussian Scenes via Geometric Pseudo Labels", "tldr": "\u672c\u6587\u63d0\u51fa\u6587\u672c\u6307\u4ee4\u89c6\u70b9\u5b9a\u4f4d\u4efb\u52a1 TIVG\uff0c\u76ee\u6807\u662f\u5728 3D Gaussian \u573a\u666f\u4e2d\u627e\u5230\u7b26\u5408\u6587\u5b57\u63cf\u8ff0\u7684 6-DoF \u76f8\u673a\u4f4d\u59ff\uff0c\u4ee5\u63a7\u5236\u4e3b\u4f53\u671d\u5411\u548c\u753b\u9762\u5e03\u5c40\u3002\u65b9\u6cd5 CapFrame \u901a\u8fc7\u591a\u6a21\u6001\u5927\u6a21\u578b\u68c0\u7d22\u8bc4\u4f30\u89c6\u89d2\uff0c\u5c06\u6587\u672c\u8f6c\u4e3a\u51e0\u4f55\u4f2a\u6807\u7b7e\uff0c\u5e76\u5728 3DGS \u4e2d\u53ef\u5fae\u4f18\u5316\u76f8\u673a\u4f4d\u59ff\uff1b\u5728\u771f\u5b9e\u573a\u666f\u5b9e\u9a8c\u4e2d\u4f18\u4e8e\u542f\u53d1\u5f0f\u641c\u7d22\u548c\u8f68\u8ff9\u751f\u6210\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing class-incremental learning methods struggle in multi-label scenarios (MLCIL) due to the inherent contradiction of learning objectives arising from co-occurring and incomplete labels. We argue that the core obstacle is the model\u0027s ambiguous boundary between known and unknown knowledge, which undermines historical knowledge retention, complicates current task learning, and limits adaptability to future concepts. To address this, we propose KBK (Knowing Beyond the Known), a reinforced knowledge specification framework that explicitly models what is known or not to unify historical, current, and prospective learning. Specifically, to clarify known knowledge, we develop a hierarchical feature purification module that disentangles fine-grained class-specific features from global features, where high-level semantic abstraction is reinforced with low-level visual features. Additionally, an uncertainty-aware recall enhancement strategy suppresses unreliable predictions based on distribution priors, improving the quality of historical recall. For probing the unknown, KBK leverages semantic correlations to synthesize informative unknown features under co-occurring, preserving embedding space for future learning. Furthermore, to mitigate heterogeneous forgetting, we design a category-balanced gradient compensation loss that dynamically reweights gradient backpropagation according to forgetting speeds. Experiments on multiple benchmarks validate the effectiveness and robustness of KBK, which surpasses prior best methods by 2.7% in Avg. Acc on MS-COCO B0-C10 setting even without any replay buffers.", "arxiv_id": "2608.30316", "arxiv_url": "https://arxiv.org/abs/2608.30316", "authors": ["Aoting Zhang", "Dongbao Yang", "Chang Liu", "Xiaopeng Hong", "Can Ma", "Yu Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa KBK \u6846\u67b6\u7528\u4e8e\u591a\u6807\u7b7e\u7c7b\u589e\u91cf\u5b66\u4e60\uff0c\u901a\u8fc7\u663e\u5f0f\u533a\u5206\u5df2\u77e5\u4e0e\u672a\u77e5\u77e5\u8bc6\u6765\u7f13\u89e3\u5171\u73b0\u6807\u7b7e\u548c\u4e0d\u5b8c\u6574\u6807\u7b7e\u5e26\u6765\u7684\u5b66\u4e60\u51b2\u7a81\u3002\u65b9\u6cd5\u7ed3\u5408\u5c42\u6b21\u5316\u7279\u5f81\u51c0\u5316\u3001\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u5386\u53f2\u56de\u5fc6\u3001\u672a\u77e5\u7279\u5f81\u5408\u6210\u4ee5\u53ca\u7c7b\u522b\u5747\u8861\u68af\u5ea6\u8865\u507f\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347\u7a33\u5065\u6027\uff0c\u5e76\u5728 MS-COCO B0-C10 \u8bbe\u7f6e\u4e0b\u65e0\u56de\u653e\u7f13\u5b58\u4ecd\u6bd4\u5148\u524d\u6700\u4f18\u5e73\u5747\u51c6\u786e\u7387\u9ad8 2.7%\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30316", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u589e\u91cf\u5b66\u4e60", "\u591a\u6807\u7b7e\u5b66\u4e60", "\u77e5\u8bc6\u4fdd\u6301", "\u4e0d\u786e\u5b9a\u6027\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30316v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Knowing Beyond the Known: Reinforced Knowledge Specification for Multi-Label Class-Incremental Learning", "tldr": "\u8bba\u6587\u63d0\u51fa KBK \u6846\u67b6\u7528\u4e8e\u591a\u6807\u7b7e\u7c7b\u589e\u91cf\u5b66\u4e60\uff0c\u901a\u8fc7\u663e\u5f0f\u533a\u5206\u5df2\u77e5\u4e0e\u672a\u77e5\u77e5\u8bc6\u6765\u7f13\u89e3\u5171\u73b0\u6807\u7b7e\u548c\u4e0d\u5b8c\u6574\u6807\u7b7e\u5e26\u6765\u7684\u5b66\u4e60\u51b2\u7a81\u3002\u65b9\u6cd5\u7ed3\u5408\u5c42\u6b21\u5316\u7279\u5f81\u51c0\u5316\u3001\u4e0d\u786e\u5b9a\u6027\u611f\u77e5\u5386\u53f2\u56de\u5fc6\u3001\u672a\u77e5\u7279\u5f81\u5408\u6210\u4ee5\u53ca\u7c7b\u522b\u5747\u8861\u68af\u5ea6\u8865\u507f\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u63d0\u5347\u7a33\u5065\u6027\uff0c\u5e76\u5728 MS-COCO B0-C10 \u8bbe\u7f6e\u4e0b\u65e0\u56de\u653e\u7f13\u5b58\u4ecd\u6bd4\u5148\u524d\u6700\u4f18\u5e73\u5747\u51c6\u786e\u7387\u9ad8 2.7%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Text-driven 3D indoor scene generation has advanced from dataset-bound layout modeling to open-vocabulary synthesis with large language and vision-language models. Yet existing methods remain limited: one-pass generators often yield geometrically invalid layouts, heavy post-hoc optimization is costly and unstable, and prompt-only planners lack reusable layout priors for functional grouping and object relations. We propose \\textbf{ScenePilot}, a retrieval-augmented \\textbf{Grow-and-Repair} framework that formulates scene generation as prior-guided incremental growth with learned rectification. Given a prompt, the Hierarchical Retrieval-Augmented Planning (HRAP) module retrieves room-, group-, and anchor-level layout priors to support functional group planning. A text-driven base generator then inserts object groups sequentially, while the Reinforcement Multimodal Repair (RMR) module performs lightweight local correction after each insertion and a final global repair after completion. To train this policy, we construct \\textbf{SceneReverse-17k}, a repair-trajectory dataset built by perturbing high-quality 3D scenes in position, rotation, and scale, then using inverse operations as executable rectification targets. The policy predicts structured \\emph{move--rotate--scale} actions from rendered views, scene state, retrieved priors, and edit history. By combining HRAP with RMR, ScenePilot offers an efficient alternative to one-shot generation and heavy full-scene optimization, improving physical plausibility, functional coherence, and controllability while preserving diversity.", "arxiv_id": "2608.30307", "arxiv_url": "https://arxiv.org/abs/2608.30307", "authors": ["Jiawei Zhang", "Hongsong Wang", "Pan Zhou"], "brief": "ScenePilot \u5c06\u6587\u672c\u9a71\u52a8\u7684 3D \u5ba4\u5185\u573a\u666f\u751f\u6210\u5efa\u6a21\u4e3a\u201c\u9010\u6b65\u751f\u957f+\u5c40\u90e8\u4fee\u590d\u201d\u7684\u8fc7\u7a0b\uff0c\u901a\u8fc7\u68c0\u7d22\u589e\u5f3a\u89c4\u5212\u5f15\u5165\u623f\u95f4\u3001\u529f\u80fd\u7ec4\u548c\u951a\u70b9\u7ea7\u5e03\u5c40\u5148\u9a8c\u3002\u5176\u5f3a\u5316\u591a\u6a21\u6001\u4fee\u590d\u6a21\u5757\u5728\u63d2\u5165\u5bf9\u8c61\u540e\u9884\u6d4b\u79fb\u52a8\u3001\u65cb\u8f6c\u3001\u7f29\u653e\u52a8\u4f5c\uff0c\u63d0\u5347\u7269\u7406\u5408\u7406\u6027\u3001\u529f\u80fd\u4e00\u81f4\u6027\u548c\u53ef\u63a7\u6027\uff0c\u540c\u65f6\u6bd4\u5168\u5c40\u91cd\u4f18\u5316\u66f4\u9ad8\u6548\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30307", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["3D\u573a\u666f\u751f\u6210", "\u68c0\u7d22\u589e\u5f3a", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30307v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ScenePilot: Grow-and-Repair Policy for Text-Driven 3D Indoor Scene Generation", "tldr": "ScenePilot \u5c06\u6587\u672c\u9a71\u52a8\u7684 3D \u5ba4\u5185\u573a\u666f\u751f\u6210\u5efa\u6a21\u4e3a\u201c\u9010\u6b65\u751f\u957f+\u5c40\u90e8\u4fee\u590d\u201d\u7684\u8fc7\u7a0b\uff0c\u901a\u8fc7\u68c0\u7d22\u589e\u5f3a\u89c4\u5212\u5f15\u5165\u623f\u95f4\u3001\u529f\u80fd\u7ec4\u548c\u951a\u70b9\u7ea7\u5e03\u5c40\u5148\u9a8c\u3002\u5176\u5f3a\u5316\u591a\u6a21\u6001\u4fee\u590d\u6a21\u5757\u5728\u63d2\u5165\u5bf9\u8c61\u540e\u9884\u6d4b\u79fb\u52a8\u3001\u65cb\u8f6c\u3001\u7f29\u653e\u52a8\u4f5c\uff0c\u63d0\u5347\u7269\u7406\u5408\u7406\u6027\u3001\u529f\u80fd\u4e00\u81f4\u6027\u548c\u53ef\u63a7\u6027\uff0c\u540c\u65f6\u6bd4\u5168\u5c40\u91cd\u4f18\u5316\u66f4\u9ad8\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Image restoration models are typically trained with a fixed set of capabilities. When new restoration requirements emerge, existing solutions usually train additional models or jointly retrain the original model with both new and historical data. Instead of designing another restoration backbone, we investigate how a trained restorer can continually acquire new capabilities without forgetting those learned previously. We propose RestoreMore, a continual capability-expansion framework that preserves the pretrained restoration model as a frozen capability anchor and learns residual expansion modules for newly arriving degradations. RestoreMore introduces a capability-oriented bi-level routing mechanism at multiple feature stages. The first routing level identifies restoration capabilities relevant to the current input, while the second selects and combines a sparse set of complementary degradation experts. This design enables newly introduced tasks to selectively reuse historical restoration knowledge and progressively enriches the expert bank available for subsequent restoration tasks. Extensive experiments on a wide range of restoration benchmarks demonstrate that RestoreMore consistently acquires new restoration abilities while preserving and improving previously learned capabilities.", "arxiv_id": "2608.30305", "arxiv_url": "https://arxiv.org/abs/2608.30305", "authors": ["Hu Gao", "Yulong Chen", "Lizhuang Ma"], "brief": "\u672c\u6587\u63d0\u51fa RestoreMore\uff0c\u8ba9\u9884\u8bad\u7ec3\u56fe\u50cf\u590d\u539f\u6a21\u578b\u5728\u4e0d\u8054\u5408\u91cd\u8bad\u65e7\u6570\u636e\u7684\u60c5\u51b5\u4e0b\u6301\u7eed\u5b66\u4e60\u65b0\u7684\u9000\u5316\u590d\u539f\u80fd\u529b\u3002\u65b9\u6cd5\u51bb\u7ed3\u539f\u6a21\u578b\u4f5c\u4e3a\u80fd\u529b\u951a\u70b9\uff0c\u5e76\u4e3a\u65b0\u9000\u5316\u5b66\u4e60\u6b8b\u5dee\u6269\u5c55\u6a21\u5757\uff0c\u901a\u8fc7\u53cc\u5c42\u8def\u7531\u9009\u62e9\u76f8\u5173\u80fd\u529b\u4e0e\u7a00\u758f\u4e13\u5bb6\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u83b7\u5f97\u65b0\u80fd\u529b\uff0c\u540c\u65f6\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u65e7\u4efb\u52a1\u8868\u73b0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30305", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u590d\u539f", "\u6301\u7eed\u5b66\u4e60", "\u4e13\u5bb6\u8def\u7531", "\u6a21\u578b\u6269\u5c55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30305v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning to Restore More: Continual Capability Expansion for Pretrained Image Restoration Models", "tldr": "\u672c\u6587\u63d0\u51fa RestoreMore\uff0c\u8ba9\u9884\u8bad\u7ec3\u56fe\u50cf\u590d\u539f\u6a21\u578b\u5728\u4e0d\u8054\u5408\u91cd\u8bad\u65e7\u6570\u636e\u7684\u60c5\u51b5\u4e0b\u6301\u7eed\u5b66\u4e60\u65b0\u7684\u9000\u5316\u590d\u539f\u80fd\u529b\u3002\u65b9\u6cd5\u51bb\u7ed3\u539f\u6a21\u578b\u4f5c\u4e3a\u80fd\u529b\u951a\u70b9\uff0c\u5e76\u4e3a\u65b0\u9000\u5316\u5b66\u4e60\u6b8b\u5dee\u6269\u5c55\u6a21\u5757\uff0c\u901a\u8fc7\u53cc\u5c42\u8def\u7531\u9009\u62e9\u76f8\u5173\u80fd\u529b\u4e0e\u7a00\u758f\u4e13\u5bb6\uff1b\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u83b7\u5f97\u65b0\u80fd\u529b\uff0c\u540c\u65f6\u4fdd\u6301\u751a\u81f3\u63d0\u5347\u65e7\u4efb\u52a1\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video understanding requires answering questions at arbitrary times over a continuously growing visual stream. The central challenge is to compactly remember long-range history while effectively retrieving question-relevant evidence. We propose Dynamic Hub-and-Spoke Memory (D-HSM), a training-free framework that represents distant history as structured textual memory while preserving the recent frames as visual tokens for fine-grained perception. Specifically, D-HSM turns selected historical video chunks into typed textual observations and stores them in an entity-centered hub-and-spoke memory, with entities as hubs and related evidence as spokes. When answering a question, D-HSM dynamically retrieves a compact question-aware memory subset, expands it through hub-and-spoke links, and combines it with the recent visual window for frozen-VLM answer prediction. Extensive experiments on both streaming and long video benchmarks show that D-HSM consistently and substantially improves VLM backbones and outperforms other state-of-the-art online and offline video understanding baselines.", "arxiv_id": "2608.30294", "arxiv_url": "https://arxiv.org/abs/2608.30294", "authors": ["Xinru Jiang", "Lin Zhao", "Xi Xiao", "Yunbei Zhang", "Janet Wang", "Chenrui Ma", "Haolin Li", "Yanzhi Wang", "Yifan Gong", "Octavia Camps"], "brief": "\u672c\u6587\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u52a8\u6001\u67a2\u7ebd-\u8f90\u5c04\u8bb0\u5fc6 D-HSM\uff0c\u7528\u7ed3\u6784\u5316\u6587\u672c\u8bb0\u5fc6\u538b\u7f29\u957f\u65f6\u89c6\u9891\u5386\u53f2\uff0c\u540c\u65f6\u4fdd\u7559\u8fd1\u671f\u5e27\u89c6\u89c9 token \u4ee5\u652f\u6301\u7ec6\u7c92\u5ea6\u611f\u77e5\u3002\u5b83\u6309\u5b9e\u4f53\u7ec4\u7ec7\u5386\u53f2\u8bc1\u636e\uff0c\u5e76\u5728\u56de\u7b54\u95ee\u9898\u65f6\u52a8\u6001\u68c0\u7d22\u76f8\u5173\u8bb0\u5fc6\uff1b\u5728\u6d41\u5f0f\u548c\u957f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u51bb\u7ed3 VLM\uff0c\u4f18\u4e8e\u591a\u79cd\u5728\u7ebf\u548c\u79bb\u7ebf\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30294", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u957f\u4e0a\u4e0b\u6587", "\u8bb0\u5fc6\u673a\u5236", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30294v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Dynamic Hub-and-Spoke Memory for Streaming Video Understanding", "tldr": "\u672c\u6587\u63d0\u51fa\u514d\u8bad\u7ec3\u7684\u52a8\u6001\u67a2\u7ebd-\u8f90\u5c04\u8bb0\u5fc6 D-HSM\uff0c\u7528\u7ed3\u6784\u5316\u6587\u672c\u8bb0\u5fc6\u538b\u7f29\u957f\u65f6\u89c6\u9891\u5386\u53f2\uff0c\u540c\u65f6\u4fdd\u7559\u8fd1\u671f\u5e27\u89c6\u89c9 token \u4ee5\u652f\u6301\u7ec6\u7c92\u5ea6\u611f\u77e5\u3002\u5b83\u6309\u5b9e\u4f53\u7ec4\u7ec7\u5386\u53f2\u8bc1\u636e\uff0c\u5e76\u5728\u56de\u7b54\u95ee\u9898\u65f6\u52a8\u6001\u68c0\u7d22\u76f8\u5173\u8bb0\u5fc6\uff1b\u5728\u6d41\u5f0f\u548c\u957f\u89c6\u9891\u7406\u89e3\u57fa\u51c6\u4e0a\u663e\u8457\u63d0\u5347\u51bb\u7ed3 VLM\uff0c\u4f18\u4e8e\u591a\u79cd\u5728\u7ebf\u548c\u79bb\u7ebf\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
