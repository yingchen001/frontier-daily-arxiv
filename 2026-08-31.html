\u4f4d\u7be1\u6539\u533a\u57df", "\u8bbe\u8ba1 hard negative mining \u635f\u5931\u548c\u5e26\u566a\u6270\u52a8\u5206\u652f\uff0c\u63d0\u5347\u80cc\u666f\u7279\u5f81\u5bf9\u9f50\u7684\u4e00\u81f4\u6027\u4e0e\u9c81\u68d2\u6027", "\u5728 COCO \u4e0a\u5b9e\u73b0 FR IoU 0.92\uff0c\u4f18\u4e8e\u6700\u5f3a\u57fa\u7ebf WAM \u7684 0.84\uff1b\u4f20\u7edf\u65b9\u6cd5\u5728\u5168\u91cd\u751f\u6210\u573a\u666f\u4e2d\u63a5\u8fd1\u968f\u673a\u8868\u73b0"], "keywords": ["\u56fe\u50cf\u53d6\u8bc1", "\u7be1\u6539\u68c0\u6d4b", "\u6269\u6563\u6a21\u578b", "\u9c81\u68d2\u6c34\u5370"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30656v1", "published_at": "2026-08-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "APT: Anchor-aligned Perturbations for Tamper Localization in Fully Regenerated Images", "tldr": "APT\u53ef\u5b9a\u4f4d\u5168\u56fe\u91cd\u751f\u6210\u7be1\u6539\u533a\u57df", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa APT\uff0c\u4e00\u79cd\u7528\u4e8e\u4e3b\u52a8\u7be1\u6539\u5b9a\u4f4d\u7684\u534a\u8106\u5f31\u6f5c\u7a7a\u95f4\u6270\u52a8\u65b9\u6cd5\u3002\u5b83\u5728\u56fe\u50cf\u53d1\u5e03\u524d\u5d4c\u5165\u5bc6\u96c6\u7684\u5411\u91cf\u7ea7\u5b9a\u4f4d\u4fe1\u53f7\uff0c\u4f7f\u6269\u6563\u4fee\u590d\u7b49\u5168\u56fe\u91cd\u751f\u6210\u573a\u666f\u4e0b\u4ecd\u80fd\u8fdb\u884c\u50cf\u7d20\u7ea7\u7be1\u6539\u68c0\u6d4b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u6269\u6563\u6a21\u578b\u4fee\u590d\u5e26\u6765\u7684\u201c\u5168\u56fe\u91cd\u751f\u6210\u201d\u53d6\u8bc1\u96be\u9898\uff0c\u7a81\u7834\u4e86\u4f20\u7edf\u62fc\u63a5\u5047\u8bbe\u4e0b\u6c34\u5370/\u6270\u52a8\u4fe1\u53f7\u6613\u5931\u6548\u7684\u9650\u5236\uff0c\u5177\u6709\u8f83\u5f3a\u7684\u73b0\u5b9e\u56fe\u50cf\u53d6\u8bc1\u4ef7\u503c\u3002"}, {"abstract": "Multimodal Large Language Models (MLLMs) are increasingly deployed in multi-image scenarios requiring complex reasoning across visual contexts. However, current MLLMs remain fundamentally limited by object hallucination-generating plausible yet factually inconsistent descriptions about objects. Existing benchmarks, designed primarily for single-image settings or providing only high-level multi-image assessments, cannot systematically diagnose how visual complexity and reasoning demands trigger hallucination. To address this gap, we introduce MIOH, a fine-grained multi-image object hallucination benchmark that systematically evaluates object hallucination across four foundational tasks (existence, counting, attribute, position) through three multi-image reasoning patterns (comprehensive, comparative, selective) under three controlled adversarial pressures (visual context scale, perceptual difficulty, contextual bias). Through evaluation of 29 models, we reveal that even state-of-the-art systems like GPT-5 and Gemini-2.5-Pro exhibit distinct failure patterns across different reasoning patterns and tasks. Our evaluation reveals that hallucination stems not merely from perceptual failures but from integration-stage limitations when maintaining object representations across multiple images. MIOH provides a controlled framework for analyzing multi-image object hallucination and serves as a critical evaluation tool for developing more reliable multimodal AI systems.", "arxiv_id": "2608.30653", "arxiv_url": "https://arxiv.org/abs/2608.30653", "authors": ["Joonki Min", "Chaeyun Kim", "Hyungwook Choi", "Yejin Kim", "Kihyun Kim", "Yohan Jo", "Joonseok Lee"], "brief": "\u8bba\u6587\u63d0\u51fa MIOH\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u56fe\u573a\u666f\u7684\u7ec6\u7c92\u5ea6\u5bf9\u8c61\u5e7b\u89c9\u57fa\u51c6\uff0c\u7cfb\u7edf\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u5bf9\u8c61\u5b58\u5728\u3001\u8ba1\u6570\u3001\u5c5e\u6027\u548c\u4f4d\u7f6e\u4efb\u52a1\u4e2d\u7684\u5e7b\u89c9\u95ee\u9898\u3002\u8be5\u57fa\u51c6\u7ed3\u5408\u7efc\u5408\u3001\u6bd4\u8f83\u3001\u9009\u62e9\u4e09\u7c7b\u591a\u56fe\u63a8\u7406\u6a21\u5f0f\uff0c\u5e76\u63a7\u5236\u89c6\u89c9\u4e0a\u4e0b\u6587\u89c4\u6a21\u3001\u611f\u77e5\u96be\u5ea6\u548c\u4e0a\u4e0b\u6587\u504f\u7f6e\u7b49\u5bf9\u6297\u538b\u529b\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30653", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d64\u7c7b\u57fa\u7840\u5bf9\u8c61\u4efb\u52a1\uff1a\u5b58\u5728\u5224\u65ad\u3001\u6570\u91cf\u7edf\u8ba1\u3001\u5c5e\u6027\u8bc6\u522b\u3001\u4f4d\u7f6e\u5173\u7cfb\u3002", "\u8bbe\u8ba13\u79cd\u591a\u56fe\u63a8\u7406\u6a21\u5f0f\uff1a\u7efc\u5408\u3001\u6bd4\u8f83\u3001\u9009\u62e9\uff0c\u7528\u4e8e\u8bca\u65ad\u8de8\u56fe\u50cf\u4fe1\u606f\u6574\u5408\u80fd\u529b\u3002", "\u8bc4\u6d4b29\u4e2a\u6a21\u578b\uff0c\u53d1\u73b0GPT-5\u3001Gemini-2.5-Pro\u7b49\u5f3a\u6a21\u578b\u5728\u4e0d\u540c\u4efb\u52a1\u4e0e\u63a8\u7406\u6a21\u5f0f\u4e0b\u4ecd\u6709\u660e\u663e\u5e7b\u89c9\u5931\u6548\u6a21\u5f0f\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u8bc4\u6d4b", "\u89c6\u89c9\u95ee\u7b54", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30653v1", "published_at": "2026-08-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Fine-Grained Multi Image Object Hallucination Benchmark", "tldr": "MIOH\u7ec6\u7c92\u5ea6\u8bc4\u6d4b\u591a\u56fe\u5bf9\u8c61\u5e7b\u89c9", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MIOH\uff0c\u4e00\u4e2a\u9762\u5411\u591a\u56fe\u573a\u666f\u7684\u7ec6\u7c92\u5ea6\u5bf9\u8c61\u5e7b\u89c9\u57fa\u51c6\uff0c\u7cfb\u7edf\u8bc4\u4f30\u591a\u6a21\u6001\u5927\u6a21\u578b\u5728\u5bf9\u8c61\u5b58\u5728\u3001\u8ba1\u6570\u3001\u5c5e\u6027\u548c\u4f4d\u7f6e\u4efb\u52a1\u4e2d\u7684\u5e7b\u89c9\u95ee\u9898\u3002\u8be5\u57fa\u51c6\u7ed3\u5408\u7efc\u5408\u3001\u6bd4\u8f83\u3001\u9009\u62e9\u4e09\u7c7b\u591a\u56fe\u63a8\u7406\u6a21\u5f0f\uff0c\u5e76\u63a7\u5236\u89c6\u89c9\u4e0a\u4e0b\u6587\u89c4\u6a21\u3001\u611f\u77e5\u96be\u5ea6\u548c\u4e0a\u4e0b\u6587\u504f\u7f6e\u7b49\u5bf9\u6297\u538b\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u591a\u56fe\u5bf9\u8c61\u5e7b\u89c9\u4ece\u7c97\u7c92\u5ea6\u8bc4\u6d4b\u63a8\u8fdb\u5230\u53ef\u63a7\u3001\u53ef\u8bca\u65ad\u7684\u7ec6\u7c92\u5ea6\u5206\u6790\uff0c\u6307\u51fa\u5e7b\u89c9\u4e0d\u4ec5\u6765\u81ea\u611f\u77e5\u9519\u8bef\uff0c\u4e5f\u6765\u81ea\u8de8\u591a\u56fe\u7ef4\u6301\u548c\u6574\u5408\u5bf9\u8c61\u8868\u5f81\u7684\u9650\u5236\uff0c\u5bf9\u63d0\u5347\u53ef\u9760\u591a\u6a21\u6001\u7cfb\u7edf\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We define an atomic generation fact f=(u,tau,omega,z;rho), recording the origin, realized transformation, concrete occurrence, generated result and relation role. Compiled into a Generation-Fact Graph (GFG), these facts provide an AI-native, compilable scientific fact substrate preserving generation histories. We establish a GFG-based recursive scientific process in which analysis, intervention, replay and validation form facts for later cycles. Using nanoGPT, we establish unified training-learning dynamics. Training is the evolution of a parameter-optimizer system with state and memory: each actual training action enters the receiving state and produces a finite-amplitude nonlinear functional response conditioned by that state and target-specific update geometry. Learning is the persistent reorganization of distributed functional support by these responses; capability formation, maintenance, decline or recovery becomes observable when target-specific states are evaluated against their readout boundaries. Three primary coordinates - target-boundary state, target-specific update geometry and parameter-Adam receiving state - yield a second-order predictor operating before post-update outputs are read. On held-out runs, it achieved 91.43% accuracy and 91.49% macro-averaged recall across four transitions. We further establish inference as a frozen projection of training-learning dynamics. Component gating and rollback show causal recruitment and non-additive combination of query-conditioned support formed during training, deriving organizational conditions realized by Attention. Controlled feedback indicates possible double-edged reinforcement effects. ResNet/CIFAR-100 and diffusion/CIFAR-10 experiments confirm receiving-state-conditioned responses, persistent support reorganization and frozen inference projection beyond nanoGPT.", "arxiv_id": "2608.20965", "arxiv_url": "https://arxiv.org/abs/2608.20965", "authors": ["Mian Wang"], "brief": "\u8bba\u6587\u63d0\u51fa\u539f\u5b50\u751f\u6210\u4e8b\u5b9e\u4e0e Generation-Fact Graph\uff08GFG\uff09\uff0c\u7528\u4e8e\u8bb0\u5f55\u795e\u7ecf\u7cfb\u7edf\u4e2d\u8bad\u7ec3\u3001\u5b66\u4e60\u3001\u63a8\u7406\u7684\u751f\u6210\u5386\u53f2\uff0c\u5e76\u6784\u5efa\u53ef\u9012\u5f52\u9a8c\u8bc1\u7684\u79d1\u5b66\u4e8b\u5b9e\u8868\u793a\u3002\u57fa\u4e8e nanoGPT\u3001ResNet \u548c\u6269\u6563\u6a21\u578b\u5b9e\u9a8c\uff0c\u4f5c\u8005\u5c06\u8bad\u7ec3\u89c6\u4e3a\u53c2\u6570-\u4f18\u5316\u5668\u7cfb\u7edf\u7684\u72b6\u6001\u6f14\u5316\uff0c\u5b66\u4e60\u89c6\u4e3a\u529f\u80fd\u652f\u6301\u7684\u6301\u4e45\u91cd\u7ec4\uff0c\u63a8\u7406\u89c6\u4e3a\u8bad\u7ec3-\u5b66\u4e60\u52a8\u529b\u5b66\u7684\u51bb\u7ed3\u6295\u5f71\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/wind342/gfg-training-learning-inference-experiments", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20965", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa GFG \u4f5c\u4e3a\u201cAI-native\u201d\u7684\u79d1\u5b66\u4e8b\u5b9e\u57fa\u5e95\uff0c\u8bb0\u5f55\u6765\u6e90\u3001\u53d8\u6362\u3001\u53d1\u751f\u3001\u7ed3\u679c\u4e0e\u5173\u7cfb\u89d2\u8272\uff0c\u53ef\u7528\u4e8e\u5206\u6790\u3001\u5e72\u9884\u3001\u56de\u653e\u548c\u9a8c\u8bc1\u5faa\u73af\u3002", "\u5728 nanoGPT \u4e0a\u5b9a\u4e49\u4e09\u7c7b\u5173\u952e\u5750\u6807\uff1a\u76ee\u6807\u8fb9\u754c\u72b6\u6001\u3001\u76ee\u6807\u7279\u5f02\u66f4\u65b0\u51e0\u4f55\u3001\u53c2\u6570-Adam \u63a5\u6536\u72b6\u6001\uff0c\u5e76\u7528\u4e8c\u9636\u9884\u6d4b\u5668\u5728\u66f4\u65b0\u540e\u8f93\u51fa\u524d\u9884\u6d4b\u56db\u7c7b\u8f6c\u53d8\uff0c\u51c6\u786e\u7387 91.43%\u3001\u5b8f\u5e73\u5747\u53ec\u56de\u7387 91.49%\u3002", "\u901a\u8fc7\u7ec4\u4ef6\u95e8\u63a7\u4e0e\u56de\u6eda\u5b9e\u9a8c\u9a8c\u8bc1\u63a8\u7406\u9636\u6bb5\u7684\u56e0\u679c\u7ec4\u4ef6\u62db\u52df\u548c\u975e\u52a0\u6027\u7ec4\u5408\uff0c\u5e76\u5728 ResNet/CIFAR-100 \u4e0e\u6269\u6563/CIFAR-10 \u4e0a\u89c2\u5bdf\u5230\u7c7b\u4f3c\u7684\u63a5\u6536\u72b6\u6001\u6761\u4ef6\u54cd\u5e94\u4e0e\u6301\u4e45\u652f\u6301\u91cd\u7ec4\u3002"], "keywords": ["\u795e\u7ecf\u7f51\u7edc\u52a8\u529b\u5b66", "\u53ef\u89e3\u91ca\u6027", "\u8bad\u7ec3\u5206\u6790", "\u751f\u6210\u4e8b\u5b9e\u56fe"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20965v1", "published_at": "2026-08-21", "score": 0.193, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20965.png", "title": "Training, learning and inference: unified dynamics of neural systems", "tldr": "\u7528\u751f\u6210\u4e8b\u5b9e\u56fe\u7edf\u4e00\u523b\u753b\u8bad\u7ec3\u3001\u5b66\u4e60\u4e0e\u63a8\u7406", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u539f\u5b50\u751f\u6210\u4e8b\u5b9e\u4e0e Generation-Fact Graph\uff08GFG\uff09\uff0c\u7528\u4e8e\u8bb0\u5f55\u795e\u7ecf\u7cfb\u7edf\u4e2d\u8bad\u7ec3\u3001\u5b66\u4e60\u3001\u63a8\u7406\u7684\u751f\u6210\u5386\u53f2\uff0c\u5e76\u6784\u5efa\u53ef\u9012\u5f52\u9a8c\u8bc1\u7684\u79d1\u5b66\u4e8b\u5b9e\u8868\u793a\u3002\u57fa\u4e8e nanoGPT\u3001ResNet \u548c\u6269\u6563\u6a21\u578b\u5b9e\u9a8c\uff0c\u4f5c\u8005\u5c06\u8bad\u7ec3\u89c6\u4e3a\u53c2\u6570-\u4f18\u5316\u5668\u7cfb\u7edf\u7684\u72b6\u6001\u6f14\u5316\uff0c\u5b66\u4e60\u89c6\u4e3a\u529f\u80fd\u652f\u6301\u7684\u6301\u4e45\u91cd\u7ec4\uff0c\u63a8\u7406\u89c6\u4e3a\u8bad\u7ec3-\u5b66\u4e60\u52a8\u529b\u5b66\u7684\u51bb\u7ed3\u6295\u5f71\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c1d\u8bd5\u628a\u8bad\u7ec3\u3001\u5b66\u4e60\u548c\u63a8\u7406\u653e\u5165\u7edf\u4e00\u52a8\u529b\u5b66\u6846\u67b6\u4e2d\uff0c\u5e76\u7528\u53ef\u7f16\u8bd1\u7684\u4e8b\u5b9e\u56fe\u8bb0\u5f55\u5b9e\u9a8c\u8fc7\u7a0b\uff1b\u82e5\u53ef\u590d\u73b0\u548c\u63a8\u5e7f\uff0c\u53ef\u80fd\u4e3a\u795e\u7ecf\u7f51\u7edc\u53ef\u89e3\u91ca\u6027\u3001\u8bad\u7ec3\u8fc7\u7a0b\u8bca\u65ad\u548c\u5e72\u9884\u5f0f\u6a21\u578b\u5206\u6790\u63d0\u4f9b\u65b0\u7684\u5f62\u5f0f\u5316\u5de5\u5177\u3002"}, {"abstract": "Interactive dialogue games test a capability that static benchmarks largely leave implicit: a model must carry state across turns, interpret feedback, and choose valid actions under changing constraints. We study this setting in the LM Playschool Challenge with a 2B open-weight model, and find that many failures are not only broad knowledge failures but also local decision failures: repeated guesses, malformed actions, and violations of feedback that the model has just seen. These diagnostics motivate a training recipe organized around three steps: acquire broad game participation through supervised fine-tuning, repair mechanically verifiable failures within one targeted dialogue-game family using turn-local preference pairs, and preserve general capabilities beyond these dialogue games. In the official final evaluation, our submission improves public clemscore from 10.67 to 38.92 and closed in-domain score from 13.41 to 41.17, while approximately preserving aggregate static performance (44.14 vs. 44.24 for the baseline). Out-of-domain clemscore remains low at 7.88, with the largest gains concentrated in unseen variants of the targeted family. Our results suggest that broad SFT brings most of the model\u0027s capability improvement; turn-local supervision can be effective when failure detection is precise, with observed transfer concentrated primarily within-family.", "arxiv_id": "2608.28458", "arxiv_url": "https://arxiv.org/abs/2608.28458", "authors": ["Nan Li"], "brief": "\u8bba\u6587\u7814\u7a76 2B \u5f00\u6e90\u6a21\u578b\u5728 LM Playschool \u5bf9\u8bdd\u6e38\u620f\u4e2d\u7684\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa\u201c\u83b7\u53d6\u3001\u4fee\u590d\u3001\u4fdd\u7559\u201d\u4e09\u6b65\u540e\u8bad\u7ec3\u6d41\u7a0b\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u5e7f\u6cdb SFT\u3001\u9488\u5bf9\u6027\u504f\u597d\u5bf9\u4fee\u590d\u5c40\u90e8\u9519\u8bef\uff0c\u5e76\u5c3d\u91cf\u4fdd\u6301\u9759\u6001\u4efb\u52a1\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28458", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": ["\u53d1\u73b0\u5c0f\u6a21\u578b\u5e38\u89c1\u5931\u8d25\u5305\u62ec\u91cd\u590d\u731c\u6d4b\u3001\u52a8\u4f5c\u683c\u5f0f\u9519\u8bef\u3001\u65e0\u89c6\u521a\u6536\u5230\u7684\u53cd\u9988\u7b49\u5c40\u90e8\u51b3\u7b56\u95ee\u9898", "\u8bad\u7ec3\u6d41\u7a0b\u5305\u62ec\uff1a\u7528\u76d1\u7763\u5fae\u8c03\u83b7\u53d6\u57fa\u7840\u53c2\u4e0e\u80fd\u529b\uff0c\u7528 turn-local preference pairs \u4fee\u590d\u53ef\u9a8c\u8bc1\u9519\u8bef\uff0c\u518d\u4fdd\u7559\u901a\u7528\u80fd\u529b", "\u5b98\u65b9\u8bc4\u6d4b\u4e2d public clemscore \u4ece 10.67 \u63d0\u5347\u5230 38.92\uff0c\u95ed\u96c6\u57df\u5185\u5206\u6570\u4ece 13.41 \u63d0\u5347\u5230 41.17\uff0c\u4f46\u57df\u5916\u6cdb\u5316\u4ecd\u8f83\u5f31"], "keywords": ["\u667a\u80fd\u4f53", "\u76d1\u7763\u5fae\u8c03", "\u504f\u597d\u5b66\u4e60", "\u5bf9\u8bdd\u7cfb\u7edf"], "num_comments": 2, "on_hf": true, "organization": "NLP Group at Utrecht University", "pdf_url": "https://arxiv.org/pdf/2608.28458v1", "published_at": "2026-08-28", "score": 0.186, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28458.png", "title": "Acquire, Repair, Preserve: A Diagnosis-Guided Post-Training Recipe for Small-Model Dialogue Game Agents", "tldr": "\u9762\u5411\u5c0f\u6a21\u578b\u5bf9\u8bdd\u6e38\u620f\u7684\u8bca\u65ad\u5f0f\u540e\u8bad\u7ec3\u65b9\u6848", "upvotes": 2, "what_it_is": "\u8bba\u6587\u7814\u7a76 2B \u5f00\u6e90\u6a21\u578b\u5728 LM Playschool \u5bf9\u8bdd\u6e38\u620f\u4e2d\u7684\u5931\u8d25\u6a21\u5f0f\uff0c\u5e76\u63d0\u51fa\u201c\u83b7\u53d6\u3001\u4fee\u590d\u3001\u4fdd\u7559\u201d\u4e09\u6b65\u540e\u8bad\u7ec3\u6d41\u7a0b\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u5e7f\u6cdb SFT\u3001\u9488\u5bf9\u6027\u504f\u597d\u5bf9\u4fee\u590d\u5c40\u90e8\u9519\u8bef\uff0c\u5e76\u5c3d\u91cf\u4fdd\u6301\u9759\u6001\u4efb\u52a1\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u8bca\u65ad\u9a71\u52a8\u7684\u540e\u8bad\u7ec3\u80fd\u663e\u8457\u63d0\u5347\u5c0f\u6a21\u578b\u5728\u4ea4\u4e92\u5f0f\u5bf9\u8bdd\u6e38\u620f\u4e2d\u7684\u6709\u6548\u884c\u52a8\u80fd\u529b\uff0c\u540c\u65f6\u57fa\u672c\u4e0d\u727a\u7272\u9759\u6001\u57fa\u51c6\u8868\u73b0\uff1b\u4e5f\u6307\u51fa\u5c40\u90e8\u76d1\u7763\u7684\u8fc1\u79fb\u4e3b\u8981\u5c40\u9650\u4e8e\u540c\u7c7b\u4efb\u52a1\u3002"}, {"abstract": "Removing a specific individual\u0027s information from multimodal large language models (MLLMs) is often needed after deployment, but existing methods rely on a retain set, which is hardest to obtain at that point, and rebuilding it recreates the privacy exposure that unlearning aims to remove. Forgetting from the forget set alone instead damages the shared visual-language computation, harming perception. We cast retain-free unlearning as a localization problem: causal tracing, weight transplant, and Fisher overlap all point to early-to-mid decoder MLPs as the layers where identity information is stored and, unlike other module families, can be modified without substantially disrupting vision. We turn this into Pathway-Aware Visual-attribute Anchoring (PAVA), which confines updates to these layers and pairs a forget loss with a visual-attribute anchor that preserves image-grounded behavior by distilling the model\u0027s own pre-unlearning answers from the forget images alone. On MLLMU-Bench and ReMem, PAVA gives the strongest forget-retain trade-off among forget-set-only methods and remains competitive with retain-based baselines.", "arxiv_id": "2608.30649", "arxiv_url": "https://arxiv.org/abs/2608.30649", "authors": ["Kangwook Ko", "Jaehyuk Jang", "Wonjun Lee", "Hee-Seon Kim", "Changick Kim"], "brief": "\u8bba\u6587\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u7684\u4e2a\u4eba\u8eab\u4efd\u9057\u5fd8\u95ee\u9898\u5efa\u6a21\u4e3a\u53c2\u6570\u5b9a\u4f4d\u95ee\u9898\uff0c\u53d1\u73b0\u8eab\u4efd\u4fe1\u606f\u4e3b\u8981\u5b58\u4e8e\u65e9\u4e2d\u5c42 decoder MLP\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa PAVA\uff0c\u53ea\u66f4\u65b0\u8fd9\u4e9b\u5c42\uff0c\u5e76\u7528\u9057\u5fd8\u56fe\u50cf\u4e0a\u7684\u89c6\u89c9\u5c5e\u6027\u951a\u5b9a\u6765\u4fdd\u6301\u56fe\u50cf\u7406\u89e3\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30649", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u56e0\u679c\u8ffd\u8e2a\u3001\u6743\u91cd\u79fb\u690d\u548c Fisher \u91cd\u53e0\u5206\u6790\uff0c\u5b9a\u4f4d\u8eab\u4efd\u4fe1\u606f\u96c6\u4e2d\u5728\u65e9\u4e2d\u5c42 decoder MLP", "PAVA \u4e0d\u4f9d\u8d56 retain set\uff0c\u4ec5\u4f7f\u7528 forget set\uff0c\u901a\u8fc7\u53d7\u9650\u5c42\u66f4\u65b0\u964d\u4f4e\u5bf9\u5171\u4eab\u89c6\u89c9-\u8bed\u8a00\u80fd\u529b\u7684\u7834\u574f", "\u5728 MLLMU-Bench \u548c ReMem \u4e0a\u53d6\u5f97 forget-set-only \u65b9\u6cd5\u4e2d\u6700\u4f73\u9057\u5fd8-\u4fdd\u7559\u6743\u8861\uff0c\u5e76\u63a5\u8fd1\u4f9d\u8d56\u4fdd\u7559\u96c6\u7684\u57fa\u7ebf"], "keywords": ["\u673a\u5668\u9057\u5fd8", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u9690\u79c1\u4fdd\u62a4", "\u6a21\u578b\u7f16\u8f91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30649v1", "published_at": "2026-08-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Where Identity Lives: Localized, Retain-Free Identity Unlearning in Multimodal Large Language Models", "tldr": "\u65e0\u9700\u4fdd\u7559\u96c6\u7684\u591a\u6a21\u6001\u8eab\u4efd\u9057\u5fd8\u65b9\u6cd5", "upvotes": 0, "what_it_is": "\u8bba\u6587\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u7684\u4e2a\u4eba\u8eab\u4efd\u9057\u5fd8\u95ee\u9898\u5efa\u6a21\u4e3a\u53c2\u6570\u5b9a\u4f4d\u95ee\u9898\uff0c\u53d1\u73b0\u8eab\u4efd\u4fe1\u606f\u4e3b\u8981\u5b58\u4e8e\u65e9\u4e2d\u5c42 decoder MLP\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa PAVA\uff0c\u53ea\u66f4\u65b0\u8fd9\u4e9b\u5c42\uff0c\u5e76\u7528\u9057\u5fd8\u56fe\u50cf\u4e0a\u7684\u89c6\u89c9\u5c5e\u6027\u951a\u5b9a\u6765\u4fdd\u6301\u56fe\u50cf\u7406\u89e3\u80fd\u529b\u3002", "why_notable": "\u89e3\u51b3\u4e86\u90e8\u7f72\u540e\u9690\u79c1\u5220\u9664\u4e2d retain set \u96be\u4ee5\u83b7\u53d6\u4e14\u53ef\u80fd\u518d\u6b21\u66b4\u9732\u9690\u79c1\u7684\u75db\u70b9\uff0c\u4e3a\u591a\u6a21\u6001\u5927\u6a21\u578b\u63d0\u4f9b\u66f4\u5b9e\u7528\u7684\u4e2a\u4eba\u8eab\u4efd\u9057\u5fd8\u65b9\u6848\u3002"}, {"abstract": "Volumetric video enables immersive free viewpoint rendering of dynamic real world scenes, yet existing methods struggle with long sequences and complex motions, often leading to temporal instability and visual artifacts. To address these challenges, we propose \\ourname, a Gaussian splatting based framework for volumetric video reconstruction. Our key insight is that explicitly tracking long term complex motion with individual Gaussian primitives is inherently unstable. Instead, we organize Gaussians around time conditioned anchors that localize their spatial and temporal support, thereby reducing long range motion complexity. We further introduce a temporal windowing strategy to activate only anchors relevant to the queried time, which improves scalability and temporal coherence. In addition, to ensure spatial and temporal stability, we design a compact set of multi level anchor features that encode global features, local spatial features, and local temporal features, jointly constraining Gaussian generation. Extensive experiments demonstrate that \\ourname \\ consistently outperforms prior methods on long sequence volumetric videos with complex motions. Project page: https://github.com/WuJH2001/ATGS.", "arxiv_id": "2608.30184", "arxiv_url": "https://arxiv.org/abs/2608.30184", "authors": ["Jiahao Wu", "Jie Liang", "Die Hu", "Jiayu Yang", "Kaiqiang Xiong", "Xiang Li", "Xiaoyun Zheng", "Chao Wang", "Ronggang Wang"], "brief": "\u672c\u6587\u63d0\u51fa ATGS\uff0c\u4e00\u79cd\u57fa\u4e8e Gaussian Splatting \u7684\u957f\u5e8f\u5217\u52a8\u6001\u4f53\u89c6\u9891\u8868\u793a\u4e0e\u91cd\u5efa\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u76f4\u63a5\u8ba9\u5355\u4e2a\u9ad8\u65af\u957f\u671f\u8ddf\u8e2a\u590d\u6742\u8fd0\u52a8\uff0c\u800c\u662f\u56f4\u7ed5\u65f6\u95f4\u6761\u4ef6\u951a\u70b9\u7ec4\u7ec7\u9ad8\u65af\uff0c\u4ee5\u83b7\u5f97\u66f4\u7a33\u5b9a\u7684\u81ea\u7531\u89c6\u89d2\u6e32\u67d3\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30184", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa\u65f6\u95f4\u6761\u4ef6\u951a\u70b9\uff0c\u5c06\u9ad8\u65af\u7684\u7a7a\u95f4\u4e0e\u65f6\u95f4\u652f\u6301\u5c40\u90e8\u5316\uff0c\u964d\u4f4e\u957f\u7a0b\u590d\u6742\u8fd0\u52a8\u5efa\u6a21\u96be\u5ea6", "\u8bbe\u8ba1\u65f6\u95f4\u7a97\u53e3\u6fc0\u6d3b\u7b56\u7565\uff0c\u4ec5\u542f\u7528\u4e0e\u67e5\u8be2\u65f6\u95f4\u76f8\u5173\u7684\u951a\u70b9\uff0c\u63d0\u5347\u53ef\u6269\u5c55\u6027\u4e0e\u65f6\u95f4\u4e00\u81f4\u6027", "\u5f15\u5165\u591a\u5c42\u7ea7\u951a\u70b9\u7279\u5f81\uff0c\u8054\u5408\u7f16\u7801\u5168\u5c40\u3001\u5c40\u90e8\u7a7a\u95f4\u548c\u5c40\u90e8\u65f6\u95f4\u4fe1\u606f\uff0c\u7ea6\u675f\u9ad8\u65af\u751f\u6210\u5e76\u51cf\u5c11\u4f2a\u5f71"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "Gaussian Splatting", "\u52a8\u6001\u573a\u666f", "\u89c6\u9891\u8868\u793a"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30184v1", "published_at": "2026-08-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "ATGS: Anchored Temporal Gaussian Splatting for Long Volumetric Video Representation", "tldr": "\u7528\u65f6\u95f4\u951a\u70b9\u63d0\u5347\u957f\u5e8f\u5217\u4f53\u89c6\u9891\u91cd\u5efa\u7a33\u5b9a\u6027", "upvotes": 0, "what_it_is": "\u672c\u6587\u63d0\u51fa ATGS\uff0c\u4e00\u79cd\u57fa\u4e8e Gaussian Splatting \u7684\u957f\u5e8f\u5217\u52a8\u6001\u4f53\u89c6\u9891\u8868\u793a\u4e0e\u91cd\u5efa\u6846\u67b6\u3002\u5b83\u4e0d\u518d\u76f4\u63a5\u8ba9\u5355\u4e2a\u9ad8\u65af\u957f\u671f\u8ddf\u8e2a\u590d\u6742\u8fd0\u52a8\uff0c\u800c\u662f\u56f4\u7ed5\u65f6\u95f4\u6761\u4ef6\u951a\u70b9\u7ec4\u7ec7\u9ad8\u65af\uff0c\u4ee5\u83b7\u5f97\u66f4\u7a33\u5b9a\u7684\u81ea\u7531\u89c6\u89d2\u6e32\u67d3\u3002", "why_notable": "\u957f\u65f6\u957f\u3001\u590d\u6742\u8fd0\u52a8\u7684\u4f53\u89c6\u9891\u91cd\u5efa\u4e00\u76f4\u5bb9\u6613\u51fa\u73b0\u65f6\u95f4\u6296\u52a8\u548c\u89c6\u89c9\u4f2a\u5f71\uff1bATGS \u901a\u8fc7\u951a\u70b9\u5316\u65f6\u7a7a\u5efa\u6a21\u6539\u5584\u7a33\u5b9a\u6027\u4e0e\u6269\u5c55\u6027\uff0c\u5bf9\u6c89\u6d78\u5f0f\u81ea\u7531\u89c6\u89d2\u89c6\u9891\u548c\u52a8\u6001\u573a\u666f\u8868\u793a\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Collecting natural-language referring expressions along with region annotations, such as masks or boxes, is a major bottleneck in visual grounding (VG), as annotators must write descriptions that distinguish target regions from visually similar ones. We tackle this by formulating active learning (AL) for VG under the realistic setting where only raw images are available without accompanying text. Since ground-truth text is unavailable, sample selection must estimate which images contain ambiguous regions that would require discriminative referring expressions. To address this, we generate auxiliary region-text pairs using foundation models, and introduce Referred Region Ambiguity, a new acquisition function that measures whether the model\u0027s confidence collapses onto a single region or disperses across multiple candidates. It allows our method to prioritize images with strong cross-region competition, which are more informative due to their visual ambiguity. We also design a referring-expression annotation interface that helps annotators quickly focus on writing discriminative language with a few clicks. Experiments on RIS and REC benchmarks show that our AL framework consistently outperforms several AL baselines, while a user study shows up to 1.6X faster description labeling of ours.", "arxiv_id": "2608.30621", "arxiv_url": "https://arxiv.org/abs/2608.30621", "authors": ["Junbeom Hong", "Seonghoon Yu", "Hyung Rok Jung", "Sundong Kim", "Jeany Son"], "brief": "\u672c\u6587\u9762\u5411\u53ea\u6709\u539f\u59cb\u56fe\u50cf\u3001\u65e0\u6587\u672c\u6807\u6ce8\u7684\u771f\u5b9e\u89c6\u89c9\u5b9a\u4f4d\u573a\u666f\uff0c\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u6307\u4ee3\u8868\u8fbe\u5206\u5272\u4e0e\u5b9a\u4f4d\u7684\u4f4e\u6210\u672c\u4e3b\u52a8\u5b66\u4e60\u6846\u67b6\u3002\u65b9\u6cd5\u501f\u52a9\u57fa\u7840\u6a21\u578b\u751f\u6210\u8f85\u52a9\u533a\u57df-\u6587\u672c\u5bf9\uff0c\u5e76\u9009\u62e9\u6700\u9700\u8981\u5224\u522b\u6027\u63cf\u8ff0\u7684\u9ad8\u6b67\u4e49\u56fe\u50cf\u8fdb\u884c\u4eba\u5de5\u6807\u6ce8\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30621", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Referred Region Ambiguity \u91c7\u6837\u51fd\u6570\uff0c\u8861\u91cf\u6a21\u578b\u7f6e\u4fe1\u5ea6\u662f\u96c6\u4e2d\u4e8e\u5355\u4e00\u533a\u57df\u8fd8\u662f\u5206\u6563\u5728\u591a\u4e2a\u5019\u9009\u533a\u57df\uff0c\u4ee5\u53d1\u73b0\u8de8\u533a\u57df\u7ade\u4e89\u5f3a\u7684\u6837\u672c", "\u5728\u65e0\u771f\u5b9e\u6587\u672c\u7684\u8bbe\u7f6e\u4e0b\uff0c\u5229\u7528\u57fa\u7840\u6a21\u578b\u751f\u6210\u8f85\u52a9 region-text pairs\uff0c\u652f\u6491\u4e3b\u52a8\u5b66\u4e60\u4e2d\u7684\u6837\u672c\u9009\u62e9", "\u8bbe\u8ba1\u6307\u4ee3\u8868\u8fbe\u6807\u6ce8\u754c\u9762\uff0c\u5e2e\u52a9\u6807\u6ce8\u8005\u66f4\u5feb\u7f16\u5199\u533a\u5206\u76ee\u6807\u533a\u57df\u7684\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\uff0c\u7528\u6237\u7814\u7a76\u663e\u793a\u6700\u9ad8\u63d0\u901f 1.6 \u500d"], "keywords": ["\u4e3b\u52a8\u5b66\u4e60", "\u89c6\u89c9\u5b9a\u4f4d", "\u6307\u4ee3\u8868\u8fbe\u5206\u5272", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30621v1", "published_at": "2026-08-31", "score": 0.175, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Cost-efficient Active Learning for Referring Image Segmentation and Grounding", "tldr": "\u7528\u4e3b\u52a8\u5b66\u4e60\u964d\u4f4e\u6307\u4ee3\u8868\u8fbe\u5206\u5272\u6807\u6ce8\u6210\u672c", "upvotes": 0, "what_it_is": "\u672c\u6587\u9762\u5411\u53ea\u6709\u539f\u59cb\u56fe\u50cf\u3001\u65e0\u6587\u672c\u6807\u6ce8\u7684\u771f\u5b9e\u89c6\u89c9\u5b9a\u4f4d\u573a\u666f\uff0c\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u6307\u4ee3\u8868\u8fbe\u5206\u5272\u4e0e\u5b9a\u4f4d\u7684\u4f4e\u6210\u672c\u4e3b\u52a8\u5b66\u4e60\u6846\u67b6\u3002\u65b9\u6cd5\u501f\u52a9\u57fa\u7840\u6a21\u578b\u751f\u6210\u8f85\u52a9\u533a\u57df-\u6587\u672c\u5bf9\uff0c\u5e76\u9009\u62e9\u6700\u9700\u8981\u5224\u522b\u6027\u63cf\u8ff0\u7684\u9ad8\u6b67\u4e49\u56fe\u50cf\u8fdb\u884c\u4eba\u5de5\u6807\u6ce8\u3002", "why_notable": "\u8bba\u6587\u805a\u7126\u89c6\u89c9\u5b9a\u4f4d\u4e2d\u6602\u8d35\u7684\u8bed\u8a00\u4e0e\u533a\u57df\u8054\u5408\u6807\u6ce8\u74f6\u9888\uff0c\u63d0\u51fa\u66f4\u8d34\u8fd1\u771f\u5b9e\u6570\u636e\u83b7\u53d6\u6d41\u7a0b\u7684\u4e3b\u52a8\u5b66\u4e60\u65b9\u6848\uff1b\u5176\u6838\u5fc3\u5728\u4e8e\u4e0d\u4f9d\u8d56\u5df2\u6709\u6587\u672c\u6807\u6ce8\u4e5f\u80fd\u7b5b\u9009\u9ad8\u4ef7\u503c\u6837\u672c\uff0c\u5177\u6709\u964d\u4f4e RIS/REC \u6570\u636e\u6784\u5efa\u6210\u672c\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Timely post-disaster building damage assessment from satellite imagery is a critical engineering decision support task, yet it remains constrained by class imbalance, ambiguous intermediate damage states, and limited cross-event transferability. This study presents, to our knowledge, the first application of Grassmann-Plucker (GP) token mixing to computer vision and introduces two extensions for image classification: the Quantum-inspired Grassmann-Plucker (QGP) head and the Hybrid Quantum Machine Learning Grassmann-Plucker (HQML-GP) head. The GP head represents multiscale relationships among image patch tokens by encoding subspaces formed by token pairs with Plucker coordinates; QGP enriches these coordinates with amplitude-derived probability features, whereas HQML-GP incorporates expectation values generated by a simulated quantum circuit into the geometric token representation. Paired pre- and post-event image patches from the xBD tornado dataset were processed using a frozen six-channel Vision Transformer base encoder with 16 x 16-pixel patches. The three GP-based heads were compared with multilayer perceptron and Transformer baselines under identical training, checkpoint selection, and evaluation protocols. Joplin and Moore tornado samples were used for model development and seen-event testing, while Tuscaloosa was reserved for unseen-event evaluation. QGP led both test sets in accuracy and macro-F1: 83.46% and 64.50% for the seen events, and 66.45% and 52.70% for the unseen event. Although HQML-GP obtained the highest validation macro-F1 of 65.63%, it did not surpass QGP on either test set and required substantially more training time per epoch. These results establish GP token mixing as a competitive attention-free alternative to conventional Transformer-based token mixing for paired satellite image damage classification.", "arxiv_id": "2608.30633", "arxiv_url": "https://arxiv.org/abs/2608.30633", "authors": ["Kooroush Farahkhah", "Umut Lagap", "Taha Rezaei", "Saman Ghaffarian"], "brief": "\u8bba\u6587\u9996\u6b21\u5c06Grassmann-Plucker token mixing\u7528\u4e8e\u8ba1\u7b97\u673a\u89c6\u89c9\uff0c\u5e76\u9762\u5411\u536b\u661f\u56fe\u50cf\u5efa\u7b51\u707e\u635f\u5206\u7c7b\u63d0\u51faQGP\u4e0eHQML-GP\u4e24\u79cd\u5934\u90e8\u3002\u5b83\u5728\u51bb\u7ed3\u7684\u516d\u901a\u9053ViT\u7f16\u7801\u5668\u4e0a\uff0c\u5bf9\u707e\u524d/\u707e\u540e\u56fe\u50cf\u5757\u8fdb\u884c\u51e0\u4f55\u5b50\u7a7a\u95f4\u8868\u793a\uff0c\u4ee5\u66ff\u4ee3\u4f20\u7edf\u6ce8\u610f\u529b\u5f0ftoken\u6df7\u5408\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30633", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": ["GP head\u7528Plucker\u5750\u6807\u7f16\u7801\u56fe\u50cfpatch token\u5bf9\u5f62\u6210\u7684\u5b50\u7a7a\u95f4\uff0c\u5efa\u6a21\u591a\u5c3a\u5ea6token\u5173\u7cfb\u3002", "QGP\u52a0\u5165\u7531\u632f\u5e45\u5bfc\u51fa\u7684\u6982\u7387\u7279\u5f81\uff1bHQML-GP\u8fdb\u4e00\u6b65\u5f15\u5165\u6a21\u62df\u91cf\u5b50\u7ebf\u8def\u4ea7\u751f\u7684\u671f\u671b\u503c\u3002", "\u5728xBD\u9f99\u5377\u98ce\u6570\u636e\u4e0a\uff0cQGP\u5728\u5df2\u89c1\u4e8b\u4ef6\u548c\u672a\u89c1\u4e8b\u4ef6\u6d4b\u8bd5\u4e2d\u5747\u53d6\u5f97\u6700\u4f73\u51c6\u786e\u7387\u4e0emacro-F1\uff0c\u672a\u89c1\u4e8b\u4ef6macro-F1\u4e3a52.70%\u3002"], "keywords": ["\u9065\u611f", "\u707e\u5bb3\u8bc4\u4f30", "\u51e0\u4f55\u6df1\u5ea6\u5b66\u4e60", "\u91cf\u5b50\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30633v1", "published_at": "2026-08-31", "score": 0.15, "selected_reasons": [], "thumbnail": null, "title": "Quantum-Grassmann-Plucker Token Mixing for Deep Learning-Based Post-Disaster Damage Assessment", "tldr": "\u7528GP\u51e0\u4f55\u6df7\u5408\u63d0\u5347\u707e\u540e\u635f\u4f24\u8bc6\u522b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u9996\u6b21\u5c06Grassmann-Plucker token mixing\u7528\u4e8e\u8ba1\u7b97\u673a\u89c6\u89c9\uff0c\u5e76\u9762\u5411\u536b\u661f\u56fe\u50cf\u5efa\u7b51\u707e\u635f\u5206\u7c7b\u63d0\u51faQGP\u4e0eHQML-GP\u4e24\u79cd\u5934\u90e8\u3002\u5b83\u5728\u51bb\u7ed3\u7684\u516d\u901a\u9053ViT\u7f16\u7801\u5668\u4e0a\uff0c\u5bf9\u707e\u524d/\u707e\u540e\u56fe\u50cf\u5757\u8fdb\u884c\u51e0\u4f55\u5b50\u7a7a\u95f4\u8868\u793a\uff0c\u4ee5\u66ff\u4ee3\u4f20\u7edf\u6ce8\u610f\u529b\u5f0ftoken\u6df7\u5408\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u707e\u540e\u9065\u611f\u635f\u4f24\u8bc4\u4f30\u63d0\u4f9b\u4e86\u4e00\u79cd\u65e0\u9700\u6ce8\u610f\u529b\u673a\u5236\u7684\u51e0\u4f55token\u6df7\u5408\u65b9\u6848\uff0c\u5e76\u663e\u793a\u51fa\u8f83\u597d\u7684\u8de8\u707e\u5bb3\u4e8b\u4ef6\u6cdb\u5316\u6f5c\u529b\uff1b\u540c\u65f6\u4e5f\u5b9e\u8bc1\u6bd4\u8f83\u4e86\u91cf\u5b50\u542f\u53d1\u4e0e\u6df7\u5408\u91cf\u5b50\u673a\u5668\u5b66\u4e60\u6269\u5c55\u7684\u6536\u76ca\u4e0e\u8ba1\u7b97\u4ee3\u4ef7\u3002"}, {"abstract": "Transformer-based decoders for 3D instance segmentation typically commit to a fixed number of queries and positional modeling calibrated on the training distribution rather than on the scene at hand. Indoor scans vary widely in spatial extent and object count, so a fixed query set over-initializes small scenes and under-initializes large ones, while learned absolute and relative encodings are bound to the training scenes\u0027 extents and can saturate. We present AQ3D, which is designed to handle scenes of various sizes during training and inference. Queries are instantiated at a fixed ratio of the scene\u0027s superpoints, forming an overcomplete set whose background rejection is entirely left to the decoder. Positional information is encoded using 3D RoPE over quantized metric coordinates, replacing learned bounded lookup tables of prior decoders. Further, we improve the decoder itself by using attribution-based superpoint pooling, a mask refinement branch, and a cosine classifier for background rejection. Experiments show our method sets a new state-of-the-art on validation and hidden test splits across the datasets ScanNetV2, ScanNet200, and ScanNet++V2 among decoder methods trained without additional data augmentation. Code is available at \\href{https://github.com/kenomo/aq3d}{github.com/kenomo/aq3d}.", "arxiv_id": "2608.30618", "arxiv_url": "https://arxiv.org/abs/2608.30618", "authors": ["Keno Moenck", "Thorsten Sch\u00fcppstuhl"], "brief": "AQ3D\u9488\u5bf93D\u5b9e\u4f8b\u5206\u5272\u4e2d\u56fa\u5b9a\u67e5\u8be2\u6570\u91cf\u548c\u4f4d\u7f6e\u7f16\u7801\u96be\u4ee5\u9002\u5e94\u4e0d\u540c\u573a\u666f\u89c4\u6a21\u7684\u95ee\u9898\uff0c\u6309\u573a\u666f\u8d85\u70b9\u6bd4\u4f8b\u81ea\u9002\u5e94\u751f\u6210\u67e5\u8be2\uff0c\u5e76\u5f15\u51653D RoPE\u4f4d\u7f6e\u7f16\u7801\u3002\u7ed3\u5408\u5f52\u56e0\u5f0f\u8d85\u70b9\u6c60\u5316\u3001\u63a9\u7801\u7ec6\u5316\u548c\u4f59\u5f26\u80cc\u666f\u5206\u7c7b\u5668\uff0c\u5728ScanNetV2\u3001ScanNet200\u548cScanNet++V2\u4e0a\u53d6\u5f97\u540c\u7c7b\u89e3\u7801\u5668\u65b9\u6cd5\u7684\u65b0SOTA\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30618", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["3D\u5b9e\u4f8b\u5206\u5272", "Transformer", "\u4f4d\u7f6e\u7f16\u7801", "\u70b9\u4e91"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30618v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AQ3D: Adaptive Query Transformer for 3D Instance Segmentation", "tldr": "AQ3D\u9488\u5bf93D\u5b9e\u4f8b\u5206\u5272\u4e2d\u56fa\u5b9a\u67e5\u8be2\u6570\u91cf\u548c\u4f4d\u7f6e\u7f16\u7801\u96be\u4ee5\u9002\u5e94\u4e0d\u540c\u573a\u666f\u89c4\u6a21\u7684\u95ee\u9898\uff0c\u6309\u573a\u666f\u8d85\u70b9\u6bd4\u4f8b\u81ea\u9002\u5e94\u751f\u6210\u67e5\u8be2\uff0c\u5e76\u5f15\u51653D RoPE\u4f4d\u7f6e\u7f16\u7801\u3002\u7ed3\u5408\u5f52\u56e0\u5f0f\u8d85\u70b9\u6c60\u5316\u3001\u63a9\u7801\u7ec6\u5316\u548c\u4f59\u5f26\u80cc\u666f\u5206\u7c7b\u5668\uff0c\u5728ScanNetV2\u3001ScanNet200\u548cScanNet++V2\u4e0a\u53d6\u5f97\u540c\u7c7b\u89e3\u7801\u5668\u65b9\u6cd5\u7684\u65b0SOTA\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reconstructing editable Computer-Aided Design (CAD) models from images is essential for downstream modification, manufacturing, and design reuse. However, existing image-to-CAD methods are developed predominantly on synthetic renderings and face two coupled obstacles: a substantial appearance domain gap between synthetic and real images, and a previously overlooked parameter bias in widely used CAD data. We show that the local normalization adopted by DeepCAD concentrates several geometric parameters around a few discrete values while encoding substantial information in a single scale factor. Consequently, a model can achieve deceptively high parameter accuracy by exploiting these frequent values rather than inferring geometry from the input image. In this paper, we propose RealCAD, a unified framework that addresses these limitations at the representation, image, and feature levels. At the representation level, we redistribute scale information to the corresponding geometric parameters, producing less concentrated parameter distributions in a shared scale space. At the image level, geometry-constrained translation converts synthetic renderings toward the real-image domain while conditioning on object contours. At the feature level, a multi-positive contrastive objective aligns representations of the same CAD model across viewpoints and image domains, enabling CAD sequence prediction from each individual view. We further introduce OpenRealCAD, comprising four-view photographs of 392 3D-printed objects paired with ground-truth command sequences. Experiments show that the revised representation substantially reduces the accuracy attainable from parameter-frequency priors, making parameter accuracy a more reliable measure of image-conditioned geometric inference. RealCAD further improves real-domain command and parameter accuracy, while retaining competitive synthetic-domain performance.", "arxiv_id": "2608.30617", "arxiv_url": "https://arxiv.org/abs/2608.30617", "authors": ["Yihe Sun", "Ziyu Lu", "Kaihua Tang", "Xian-Sheng Hua"], "brief": "\u672c\u6587\u6307\u51fa\u73b0\u6709\u56fe\u50cf\u5230CAD\u65b9\u6cd5\u5728\u771f\u5b9e\u56fe\u50cf\u4e0a\u53d7\u5408\u6210-\u771f\u5b9e\u57df\u5dee\u5f02\u5f71\u54cd\uff0c\u540c\u65f6\u5e38\u7528CAD\u8868\u793a\u5b58\u5728\u53c2\u6570\u504f\u7f6e\uff0c\u6a21\u578b\u53ef\u80fd\u9760\u9ad8\u9891\u53c2\u6570\u53d6\u503c\u83b7\u5f97\u865a\u9ad8\u7cbe\u5ea6\u3002\u4f5c\u8005\u63d0\u51faRealCAD\uff0c\u4ece\u53c2\u6570\u8868\u793a\u3001\u56fe\u50cf\u57df\u8fc1\u79fb\u548c\u591a\u89c6\u89d2/\u8de8\u57df\u5bf9\u6bd4\u5b66\u4e60\u4e09\u5c42\u6539\u8fdb\uff0c\u5e76\u53d1\u5e03\u5305\u542b392\u4e2a3D\u6253\u5370\u7269\u4f53\u771f\u5b9e\u7167\u7247\u4e0eCAD\u547d\u4ee4\u5e8f\u5217\u7684OpenRealCAD\u6570\u636e\u96c6\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u964d\u4f4e\u4e86\u53c2\u6570\u5148\u9a8c\u5e26\u6765\u7684\u865a\u5047\u4f18\u52bf\uff0c\u63d0\u5347\u771f\u5b9e\u57dfCAD\u547d\u4ee4\u548c\u53c2\u6570\u9884\u6d4b\u6027\u80fd\uff0c\u540c\u65f6\u4fdd\u6301\u5408\u6210\u57df\u7ade\u4e89\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30617", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "CAD\u5efa\u6a21", "\u57df\u9002\u5e94", "\u5bf9\u6bd4\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30617v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RealCAD: Towards Real-World Image-to-CAD Reconstruction under Domain Shift and Parameter Bias", "tldr": "\u672c\u6587\u6307\u51fa\u73b0\u6709\u56fe\u50cf\u5230CAD\u65b9\u6cd5\u5728\u771f\u5b9e\u56fe\u50cf\u4e0a\u53d7\u5408\u6210-\u771f\u5b9e\u57df\u5dee\u5f02\u5f71\u54cd\uff0c\u540c\u65f6\u5e38\u7528CAD\u8868\u793a\u5b58\u5728\u53c2\u6570\u504f\u7f6e\uff0c\u6a21\u578b\u53ef\u80fd\u9760\u9ad8\u9891\u53c2\u6570\u53d6\u503c\u83b7\u5f97\u865a\u9ad8\u7cbe\u5ea6\u3002\u4f5c\u8005\u63d0\u51faRealCAD\uff0c\u4ece\u53c2\u6570\u8868\u793a\u3001\u56fe\u50cf\u57df\u8fc1\u79fb\u548c\u591a\u89c6\u89d2/\u8de8\u57df\u5bf9\u6bd4\u5b66\u4e60\u4e09\u5c42\u6539\u8fdb\uff0c\u5e76\u53d1\u5e03\u5305\u542b392\u4e2a3D\u6253\u5370\u7269\u4f53\u771f\u5b9e\u7167\u7247\u4e0eCAD\u547d\u4ee4\u5e8f\u5217\u7684OpenRealCAD\u6570\u636e\u96c6\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u964d\u4f4e\u4e86\u53c2\u6570\u5148\u9a8c\u5e26\u6765\u7684\u865a\u5047\u4f18\u52bf\uff0c\u63d0\u5347\u771f\u5b9e\u57dfCAD\u547d\u4ee4\u548c\u53c2\u6570\u9884\u6d4b\u6027\u80fd\uff0c\u540c\u65f6\u4fdd\u6301\u5408\u6210\u57df\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pottery is a primary source for reconstructing the chronological and economic dimensions of past societies. Archaeologists often document ceramic finds through technical drawings and handwritten metadata. This metadata is critical for dating, provenance attribution, and cross-site comparison, but remains inaccessible to computational analysis, requiring manual transcription of every record. We investigate whether state-of-the-art document analysis models can address this task, and introduce CENTURIA, a dataset of 507 pottery records from the Roman site of Carnuntum, providing transcriptions, bounding boxes, and structured field-level labels across seven metadata categories. Benchmarking five OCR models reveals a substantial domain gap: zero-shot transcription error reaches 15-32% SpACER-M, far exceeding rates on printed archival documents, with domain-specific fields recovered in fewer than 3% of cases. LoRA fine-tuning on just 57 samples, reflecting a realistic archival annotation budget, closes this gap, reducing transcription error to below 1.5% and recovering overall field-level accuracy above 87%. Our results show that a small expert-validated fine-tuning set suffices to convert handwritten pottery documentation into structured, searchable metadata ready for archaeological databases.", "arxiv_id": "2608.30616", "arxiv_url": "https://arxiv.org/abs/2608.30616", "authors": ["Gissu Valentina Naghavi", "Dominik Hagmann", "Martin Kampel", "Irene Ballester"], "brief": "\u8bba\u6587\u63d0\u51fa CENTURIA \u6570\u636e\u96c6\uff0c\u5305\u542b 507 \u6761\u7f57\u9a6c\u9057\u5740\u9676\u5668\u8bb0\u5f55\uff0c\u63d0\u4f9b\u624b\u5199\u5143\u6570\u636e\u7684\u8f6c\u5f55\u3001\u8fb9\u754c\u6846\u548c\u4e03\u7c7b\u5b57\u6bb5\u7ea7\u6807\u7b7e\uff0c\u7528\u4e8e\u8003\u53e4\u9676\u5668\u6587\u6863\u7684 OCR \u5b57\u6bb5\u62bd\u53d6\u3002\u57fa\u51c6\u6d4b\u8bd5\u663e\u793a\u901a\u7528 OCR \u96f6\u6837\u672c\u5b58\u5728\u660e\u663e\u9886\u57df\u5dee\u8ddd\uff0c\u800c\u4ec5\u7528 57 \u4e2a\u6837\u672c\u8fdb\u884c LoRA \u5fae\u8c03\u5373\u53ef\u5c06\u8f6c\u5f55\u9519\u8bef\u7387\u964d\u81f3 1.5% \u4ee5\u4e0b\uff0c\u5e76\u5c06\u5b57\u6bb5\u7ea7\u51c6\u786e\u7387\u63d0\u5347\u5230 87% \u4ee5\u4e0a\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30616", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["OCR", "\u6587\u6863\u7406\u89e3", "\u6570\u636e\u96c6", "\u8003\u53e4\u4fe1\u606f\u62bd\u53d6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30616v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OCR-Based Field Extraction for Archaeological Pottery Metadata: The CENTURIA Dataset", "tldr": "\u8bba\u6587\u63d0\u51fa CENTURIA \u6570\u636e\u96c6\uff0c\u5305\u542b 507 \u6761\u7f57\u9a6c\u9057\u5740\u9676\u5668\u8bb0\u5f55\uff0c\u63d0\u4f9b\u624b\u5199\u5143\u6570\u636e\u7684\u8f6c\u5f55\u3001\u8fb9\u754c\u6846\u548c\u4e03\u7c7b\u5b57\u6bb5\u7ea7\u6807\u7b7e\uff0c\u7528\u4e8e\u8003\u53e4\u9676\u5668\u6587\u6863\u7684 OCR \u5b57\u6bb5\u62bd\u53d6\u3002\u57fa\u51c6\u6d4b\u8bd5\u663e\u793a\u901a\u7528 OCR \u96f6\u6837\u672c\u5b58\u5728\u660e\u663e\u9886\u57df\u5dee\u8ddd\uff0c\u800c\u4ec5\u7528 57 \u4e2a\u6837\u672c\u8fdb\u884c LoRA \u5fae\u8c03\u5373\u53ef\u5c06\u8f6c\u5f55\u9519\u8bef\u7387\u964d\u81f3 1.5% \u4ee5\u4e0b\uff0c\u5e76\u5c06\u5b57\u6bb5\u7ea7\u51c6\u786e\u7387\u63d0\u5347\u5230 87% \u4ee5\u4e0a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Robust estimation is a core computer vision task frequently tackled using sample consensus. However, traditional methods suffer from inefficient sampling as they struggle to identify effective minimum sets before hypothesis evaluation. To address these challenges, we propose a novel Diffusion-guided Sampling for Consensus-based Robust Estimation (DiffSAC) framework. DiffSAC introduces a diffusion model to learn the distribution of effective minimum sets. It refines the confidence for each data point, indicating whether it belongs to a good minimum set, rather than ranking the data points as in previous work. This significantly reduces the need to process numerous bad sets. To constrain the refinement direction, geometric features are incorporated as conditions within our diffusion model. Consequently, DiffSAC outputs a small number of high-quality minimum sets, enabling identification of the best hypothesis via consensus evaluation. Notably, compared to previous works requiring evaluating over ten thousand hypotheses, DiffSAC achieves state-of-the-art performance with only dozens, significantly boosting efficiency. Extensive experiments across five classic computer vision tasks demonstrate the superiority of DiffSAC. The diffusion model\u0027s sampling accelerators enable real-time operation, and DiffSAC can be used as a plug-and-play module to improve existing sample consensus methods.", "arxiv_id": "2608.30603", "arxiv_url": "https://arxiv.org/abs/2608.30603", "authors": ["Chang Nie", "Guangming Wang", "Zhe Liu", "Hesheng Wang"], "brief": "\u8bba\u6587\u63d0\u51fa DiffSAC\uff0c\u7528\u6269\u6563\u6a21\u578b\u5b66\u4e60\u9c81\u68d2\u4f30\u8ba1\u4e2d\u9ad8\u8d28\u91cf\u6700\u5c0f\u6837\u672c\u96c6\u7684\u5206\u5e03\uff0c\u5e76\u7ed3\u5408\u51e0\u4f55\u7279\u5f81\u5f15\u5bfc\u91c7\u6837\u3002\u76f8\u6bd4\u4f20\u7edf\u4e00\u81f4\u6027\u91c7\u6837\u9700\u8981\u8bc4\u4f30\u4e0a\u4e07\u5047\u8bbe\uff0cDiffSAC \u53ea\u9700\u51e0\u5341\u4e2a\u5047\u8bbe\u5373\u53ef\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u5728\u4e94\u7c7b\u7ecf\u5178\u89c6\u89c9\u4efb\u52a1\u4e0a\u63d0\u5347\u6548\u7387\u5e76\u53ef\u5b9e\u65f6\u8fd0\u884c\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30603", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9c81\u68d2\u4f30\u8ba1", "\u6269\u6563\u6a21\u578b", "\u8ba1\u7b97\u673a\u89c6\u89c9", "\u91c7\u6837\u4e00\u81f4\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30603v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DiffSAC: Diffusion-guided Sampling for Consensus-based Robust Estimation", "tldr": "\u8bba\u6587\u63d0\u51fa DiffSAC\uff0c\u7528\u6269\u6563\u6a21\u578b\u5b66\u4e60\u9c81\u68d2\u4f30\u8ba1\u4e2d\u9ad8\u8d28\u91cf\u6700\u5c0f\u6837\u672c\u96c6\u7684\u5206\u5e03\uff0c\u5e76\u7ed3\u5408\u51e0\u4f55\u7279\u5f81\u5f15\u5bfc\u91c7\u6837\u3002\u76f8\u6bd4\u4f20\u7edf\u4e00\u81f4\u6027\u91c7\u6837\u9700\u8981\u8bc4\u4f30\u4e0a\u4e07\u5047\u8bbe\uff0cDiffSAC \u53ea\u9700\u51e0\u5341\u4e2a\u5047\u8bbe\u5373\u53ef\u8fbe\u5230\u6700\u4f18\u6027\u80fd\uff0c\u5728\u4e94\u7c7b\u7ecf\u5178\u89c6\u89c9\u4efb\u52a1\u4e0a\u63d0\u5347\u6548\u7387\u5e76\u53ef\u5b9e\u65f6\u8fd0\u884c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Despite the impressive progress of recent MLLMs on spatio-temporal video grounding (STVG), existing evaluations and training data focus primarily on simple queries. They largely overlook the compositional queries prevalent in real-world scenarios, where a target must be disambiguated by jointly reasoning about its attributes and relations to other entities. To bridge this gap, we propose Compositional Spatio-Temporal Video Grounding (CompSTVG), a task that requires models to process complex textual queries where every intertwined attribute and relational cue is essential for disambiguation. To facilitate this task at scale, we build a synthetic data engine that leverages a spatio-temporal scene graph as a difficulty measure and casts difficulty-controlled query synthesis as a constraint programming problem, producing difficulty-graded data for both evaluation and training. Built on this engine, we introduce STVG-CompBench, a benchmark stratified by explicit difficulty levels that jointly capture temporal complexity and spatial interference. Evaluating 11 representative STVG models on STVG-CompBench reveals that current models perform poorly on compositional queries, exhibiting a sharp performance drop that is typically obscured by overall dataset-level averages. We further construct synthetic training data and propose CurrSTVG, a curriculum reinforcement learning framework that delivers consistent gains, with the largest improvements observed on the most challenging compositional queries.", "arxiv_id": "2608.30584", "arxiv_url": "https://arxiv.org/abs/2608.30584", "authors": ["Xingjian Wang", "Shijian Wang", "Yibo Wang", "Zihao Yu", "Runhao Fu", "Xuelian Cheng", "Zongyuan Ge"], "brief": "\u8bba\u6587\u63d0\u51fa\u7ec4\u5408\u5f0f\u65f6\u7a7a\u89c6\u9891\u5b9a\u4f4d\u4efb\u52a1 CompSTVG\uff0c\u8981\u6c42\u6a21\u578b\u6839\u636e\u590d\u6742\u6587\u672c\u67e5\u8be2\u8054\u5408\u7406\u89e3\u76ee\u6807\u5c5e\u6027\u3001\u5173\u7cfb\u4e0e\u65f6\u5e8f\u7ebf\u7d22\u3002\u4f5c\u8005\u6784\u5efa\u57fa\u4e8e\u65f6\u7a7a\u573a\u666f\u56fe\u7684\u5408\u6210\u6570\u636e\u5f15\u64ce\u548c\u5206\u96be\u5ea6\u57fa\u51c6 STVG-CompBench\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u5728\u7ec4\u5408\u67e5\u8be2\u4e0a\u660e\u663e\u9000\u5316\uff1b\u8fdb\u4e00\u6b65\u63d0\u51fa\u8bfe\u7a0b\u5f3a\u5316\u5b66\u4e60\u6846\u67b6 CurrSTVG\uff0c\u5728\u9ad8\u96be\u5ea6\u67e5\u8be2\u4e0a\u5e26\u6765\u66f4\u5927\u63d0\u5347\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30584", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u65f6\u7a7a\u5b9a\u4f4d", "\u7ec4\u5408\u6cdb\u5316", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30584v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning Compositional Spatio-Temporal Video Grounding with Synthetic Curriculum", "tldr": "\u8bba\u6587\u63d0\u51fa\u7ec4\u5408\u5f0f\u65f6\u7a7a\u89c6\u9891\u5b9a\u4f4d\u4efb\u52a1 CompSTVG\uff0c\u8981\u6c42\u6a21\u578b\u6839\u636e\u590d\u6742\u6587\u672c\u67e5\u8be2\u8054\u5408\u7406\u89e3\u76ee\u6807\u5c5e\u6027\u3001\u5173\u7cfb\u4e0e\u65f6\u5e8f\u7ebf\u7d22\u3002\u4f5c\u8005\u6784\u5efa\u57fa\u4e8e\u65f6\u7a7a\u573a\u666f\u56fe\u7684\u5408\u6210\u6570\u636e\u5f15\u64ce\u548c\u5206\u96be\u5ea6\u57fa\u51c6 STVG-CompBench\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u5728\u7ec4\u5408\u67e5\u8be2\u4e0a\u660e\u663e\u9000\u5316\uff1b\u8fdb\u4e00\u6b65\u63d0\u51fa\u8bfe\u7a0b\u5f3a\u5316\u5b66\u4e60\u6846\u67b6 CurrSTVG\uff0c\u5728\u9ad8\u96be\u5ea6\u67e5\u8be2\u4e0a\u5e26\u6765\u66f4\u5927\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Emotion Recognition (MER) systems often suffer from missing modalities in real-world scenarios. Existing methods usually generate, align, or distill missing modalities as a whole, overlooking the heterogeneous nature of the information carried by each modality. Such holistic treatment mixes inferable shared semantics with uncertain modality-specific details, yielding unstable representations and degrading robustness. To address this issue, we propose the Primitive Memory Distillation (PriMD) framework. Unlike existing methods, PriMD takes an intra-modal perspective and focuses on how different types of information within a modality differ in recoverability within each modality. PriMD first disentangles cross-modal shared semantics from modality-specific representations, and then discretizes the latter into learnable semantic primitives to construct modality-specific memory banks. When modalities are missing, PriMD is a teacher-student framework that the student model uses the shared semantics of available modalities as queries to dynamically retrieve primitives. It compensates for missing modality-specific information within a constrained memory space and aligns with the teacher model. Extensive experiments on IEMOCAP, CMU-MOSI, and CMU-MOSEI demonstrate that PriMD achieves state-of-the-art performance and consistently stronger robustness across a wide range of missing-modality settings, while mitigating the instability caused by holistic feature inference. Our code and project website are available at https://github.com/JiaqiZhang-Sengoku/PriMD and https://jiaqizhang-sengoku.github.io/PriMD/, respectively.", "arxiv_id": "2608.30563", "arxiv_url": "https://arxiv.org/abs/2608.30563", "authors": ["Jiaqi Zhang", "Zheng Pang", "Mengting Li", "Yiqi Wang", "Guangyuan Dong", "Chao Xue", "Yusen Wu", "Zihao Li", "Huy Phan", "Sicheng Zhao", "Bj\u00f6rn W. Schuller", "Jiachen Luo"], "brief": "\u8bba\u6587\u63d0\u51fa PriMD \u6846\u67b6\uff0c\u7528\u4e8e\u4e0d\u5b8c\u6574\u591a\u6a21\u6001\u60c5\u611f\u8bc6\u522b\uff0c\u5c06\u8de8\u6a21\u6001\u5171\u4eab\u8bed\u4e49\u4e0e\u6a21\u6001\u7279\u6709\u4fe1\u606f\u89e3\u8026\uff0c\u5e76\u628a\u7279\u6709\u4fe1\u606f\u79bb\u6563\u4e3a\u53ef\u5b66\u4e60\u7684\u8bed\u4e49\u539f\u8bed\u8bb0\u5fc6\u5e93\u3002\u6a21\u6001\u7f3a\u5931\u65f6\uff0c\u5b66\u751f\u6a21\u578b\u5229\u7528\u53ef\u7528\u6a21\u6001\u7684\u5171\u4eab\u8bed\u4e49\u52a8\u6001\u68c0\u7d22\u539f\u8bed\u6765\u8865\u507f\u7f3a\u5931\u4fe1\u606f\uff0c\u5e76\u4e0e\u6559\u5e08\u6a21\u578b\u5bf9\u9f50\uff1b\u5728 IEMOCAP\u3001CMU-MOSI\u3001CMU-MOSEI \u4e0a\u8fbe\u5230\u6700\u4f18\u6027\u80fd\u5e76\u63d0\u5347\u9c81\u68d2\u6027\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30563", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u60c5\u611f\u8bc6\u522b", "\u77e5\u8bc6\u84b8\u998f", "\u8868\u793a\u89e3\u8026"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30563v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Modality Disentangled Learning for Incomplete Multimodal Emotion Recognition: A Primitive Memory Distillation Perspective", "tldr": "\u8bba\u6587\u63d0\u51fa PriMD \u6846\u67b6\uff0c\u7528\u4e8e\u4e0d\u5b8c\u6574\u591a\u6a21\u6001\u60c5\u611f\u8bc6\u522b\uff0c\u5c06\u8de8\u6a21\u6001\u5171\u4eab\u8bed\u4e49\u4e0e\u6a21\u6001\u7279\u6709\u4fe1\u606f\u89e3\u8026\uff0c\u5e76\u628a\u7279\u6709\u4fe1\u606f\u79bb\u6563\u4e3a\u53ef\u5b66\u4e60\u7684\u8bed\u4e49\u539f\u8bed\u8bb0\u5fc6\u5e93\u3002\u6a21\u6001\u7f3a\u5931\u65f6\uff0c\u5b66\u751f\u6a21\u578b\u5229\u7528\u53ef\u7528\u6a21\u6001\u7684\u5171\u4eab\u8bed\u4e49\u52a8\u6001\u68c0\u7d22\u539f\u8bed\u6765\u8865\u507f\u7f3a\u5931\u4fe1\u606f\uff0c\u5e76\u4e0e\u6559\u5e08\u6a21\u578b\u5bf9\u9f50\uff1b\u5728 IEMOCAP\u3001CMU-MOSI\u3001CMU-MOSEI \u4e0a\u8fbe\u5230\u6700\u4f18\u6027\u80fd\u5e76\u63d0\u5347\u9c81\u68d2\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal Sewing pattern generation aims to infer executable sewing patterns from design cues such as sketches and textual descriptions. As an interpretable and simulation-compatible representation, sewing patterns are particularly valuable for digital garment creation. However, existing methods often model garment specifications as flat long sequences, which entangles garment structure with detailed parameters and leads to redundant components, inaccurate local details, and poor simulation compatibility. In this paper, we present GarmentWeaver, a schema-aware framework for multimodal Sewing pattern generation. GarmentWeaver constructs compact hierarchical targets by activating garment-relevant structural branches and predicts executable Sewing patterns in a structured manner. Specifically, we introduce a schema-aware target construction strategy, build the generator on top of a pretrained vision-language model for multimodal garment understanding, and impose feasibility-aware regularization to encourage structurally valid and simulation-compatible outputs. Extensive experiments show that GarmentWeaver produces more accurate and more executable sewing patterns than strong baselines, while also yielding better simulation results. These findings demonstrate the effectiveness of schema-aware structured generation for reliable multimodal Sewing pattern prediction.", "arxiv_id": "2608.30550", "arxiv_url": "https://arxiv.org/abs/2608.30550", "authors": ["Yinwen Lu", "Weihao Luo", "Yueqi Zhong"], "brief": "GarmentWeaver \u9762\u5411\u8349\u56fe\u548c\u6587\u672c\u7b49\u591a\u6a21\u6001\u8bbe\u8ba1\u7ebf\u7d22\u751f\u6210\u53ef\u6267\u884c\u670d\u88c5\u7f1d\u7eab\u7eb8\u6837\uff0c\u6838\u5fc3\u662f\u7528\u6a21\u5f0f\u611f\u77e5\u7684\u5c42\u7ea7\u7ed3\u6784\u66ff\u4ee3\u6241\u5e73\u957f\u5e8f\u5217\u5efa\u6a21\u3002\u65b9\u6cd5\u7ed3\u5408\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0e\u53ef\u884c\u6027\u6b63\u5219\uff0c\u51cf\u5c11\u5197\u4f59\u7ec4\u4ef6\u548c\u5c40\u90e8\u9519\u8bef\uff0c\u751f\u6210\u7684\u7eb8\u6837\u66f4\u51c6\u786e\u3001\u66f4\u53ef\u6267\u884c\uff0c\u4eff\u771f\u6548\u679c\u4e5f\u4f18\u4e8e\u5f3a\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30550", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u7ed3\u6784\u5316\u751f\u6210", "\u6570\u5b57\u670d\u88c5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30550v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "GarmentWeaver: Schema-Aware Structured Synthesis for Multimodal Sewing Patterns", "tldr": "GarmentWeaver \u9762\u5411\u8349\u56fe\u548c\u6587\u672c\u7b49\u591a\u6a21\u6001\u8bbe\u8ba1\u7ebf\u7d22\u751f\u6210\u53ef\u6267\u884c\u670d\u88c5\u7f1d\u7eab\u7eb8\u6837\uff0c\u6838\u5fc3\u662f\u7528\u6a21\u5f0f\u611f\u77e5\u7684\u5c42\u7ea7\u7ed3\u6784\u66ff\u4ee3\u6241\u5e73\u957f\u5e8f\u5217\u5efa\u6a21\u3002\u65b9\u6cd5\u7ed3\u5408\u9884\u8bad\u7ec3\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u4e0e\u53ef\u884c\u6027\u6b63\u5219\uff0c\u51cf\u5c11\u5197\u4f59\u7ec4\u4ef6\u548c\u5c40\u90e8\u9519\u8bef\uff0c\u751f\u6210\u7684\u7eb8\u6837\u66f4\u51c6\u786e\u3001\u66f4\u53ef\u6267\u884c\uff0c\u4eff\u771f\u6548\u679c\u4e5f\u4f18\u4e8e\u5f3a\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Rapid mineral characterization is essential for applications ranging from mineral exploration to industrial ore processing. To this end, Hyperspectral Imaging (HSI) has emerged as a promising sensing modality thanks to its fine spectral resolution, enabling mineral discrimination in both close-range and remote sensing settings. However, the scarcity of publicly available datasets with reliable ground-truth labels hinders the development and evaluation of HSI-based mineral identification methods. We release Minerals in the Wild, a multi-purpose dataset comprising 1,132 rock specimens collected across Europe. For each specimen, we provide an HSI acquisition together with an elemental characterization obtained via an XRF sensor. We define the task of elemental characterization on our dataset and propose a pruning mechanism that removes distant signatures from the USGS dictionary prior to a convex optimization approach for matching HSI pixels with USGS spectral signatures. Finally, we empirically show that our approach outperforms simpler baselines.", "arxiv_id": "2608.30537", "arxiv_url": "https://arxiv.org/abs/2608.30537", "authors": ["Eleftheria Tetoula-Tsonga", "George Arvanitakis", "Theodoros Giannakas"], "brief": "\u672c\u6587\u53d1\u5e03\u4e86 Minerals in the Wild \u6570\u636e\u96c6\uff0c\u5305\u542b\u6b27\u6d32\u91c7\u96c6\u7684 1132 \u4e2a\u5ca9\u77f3\u6837\u672c\uff0c\u6bcf\u4e2a\u6837\u672c\u914d\u6709\u9ad8\u5149\u8c31\u56fe\u50cf\u548c XRF \u5143\u7d20\u6210\u5206\u6807\u6ce8\uff0c\u7528\u4e8e\u77ff\u7269\u5143\u7d20\u7ec4\u6210\u4f30\u8ba1\u3002\u4f5c\u8005\u63d0\u51fa\u5148\u526a\u679d USGS \u5149\u8c31\u5b57\u5178\u518d\u8fdb\u884c\u51f8\u4f18\u5316\u5339\u914d\u7684\u65b9\u6cd5\uff0c\u5b9e\u9a8c\u663e\u793a\u4f18\u4e8e\u7b80\u5355\u57fa\u7ebf\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30537", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u9ad8\u5149\u8c31\u6210\u50cf", "\u6570\u636e\u96c6", "\u77ff\u7269\u8bc6\u522b", "\u5143\u7d20\u4f30\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30537v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Minerals in the Wild: A Hyperspectral-XRF Dataset for Elemental Composition Estimation", "tldr": "\u672c\u6587\u53d1\u5e03\u4e86 Minerals in the Wild \u6570\u636e\u96c6\uff0c\u5305\u542b\u6b27\u6d32\u91c7\u96c6\u7684 1132 \u4e2a\u5ca9\u77f3\u6837\u672c\uff0c\u6bcf\u4e2a\u6837\u672c\u914d\u6709\u9ad8\u5149\u8c31\u56fe\u50cf\u548c XRF \u5143\u7d20\u6210\u5206\u6807\u6ce8\uff0c\u7528\u4e8e\u77ff\u7269\u5143\u7d20\u7ec4\u6210\u4f30\u8ba1\u3002\u4f5c\u8005\u63d0\u51fa\u5148\u526a\u679d USGS \u5149\u8c31\u5b57\u5178\u518d\u8fdb\u884c\u51f8\u4f18\u5316\u5339\u914d\u7684\u65b9\u6cd5\uff0c\u5b9e\u9a8c\u663e\u793a\u4f18\u4e8e\u7b80\u5355\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Conventional algebraic triangulation solves 3D human pose estimation (HPE) from multi-view 2D keypoints. The typical approach, decoding 2D keypoints from predicted heatmaps, is unreliable as heatmaps can be multimodal under occlusion, and collapsing them into single peaks discards their spatial distribution. We seek to use the entire heatmap to estimate 3D poses more accurately, which requires solving two problems: how to robustly fuse heatmaps across views, and how to assess the reliability of heatmaps. For the former, we introduce a novel objective, Multi-viewExpected-OKS Maximization (MEOM), that locates a 3D joint where the views agree in probability mass. For the latter, we adopt highest-density-region (HDR) calibration as a diagnostic of that mass, independently of distance-based metrics. The proposed framework covers two settings, with and without 3D supervision. Without 3D supervision, we optimize 3D poses from pretrained heatmap predictors by maximizing MEOM, achieving comparable performance with state-of-the-art methods that rely on larger backbones, temporal fusion, and simulated 3D data. On ambiguous Human3.6M (H36MA) and occluded CMU Panoptic frames, the advantage is substantial. When 3D labels are available, we train the model end-to-end with a combined MEOM and MSE loss, achieving 19.11 mm absolute MPJPE on Human3.6M outperforming the state-of-the-art volumetric approach on absolute MPJPE at half the inference cost.", "arxiv_id": "2608.30521", "arxiv_url": "https://arxiv.org/abs/2608.30521", "authors": ["Ziliang Xiong", "Henglin Shi", "Per-Erik Forssen"], "brief": "\u672c\u6587\u63d0\u51fa MEOM\uff0c\u901a\u8fc7\u6700\u5927\u5316\u591a\u89c6\u89d2\u70ed\u56fe\u6982\u7387\u8d28\u91cf\u7684\u4e00\u81f4\u6027\u6765\u8fdb\u884c\u4eba\u4f53 3D \u5173\u8282\u70b9\u4e09\u89d2\u5316\uff0c\u907f\u514d\u5c06\u591a\u5cf0\u70ed\u56fe\u538b\u7f29\u6210\u5355\u70b9\u5e26\u6765\u7684\u4fe1\u606f\u635f\u5931\u3002\u65b9\u6cd5\u5728\u65e0 3D \u76d1\u7763\u4e0b\u5df2\u63a5\u8fd1\u6216\u4f18\u4e8e\u66f4\u590d\u6742\u65b9\u6848\uff0c\u5728\u6709 3D \u6807\u6ce8\u65f6\u4e8e Human3.6M \u8fbe\u5230 19.11mm \u7edd\u5bf9 MPJPE\uff0c\u5e76\u4ee5\u7ea6\u4e00\u534a\u63a8\u7406\u6210\u672c\u4f18\u4e8e\u73b0\u6709\u4f53\u7d20\u65b9\u6cd5\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30521", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u4f53\u59ff\u6001\u4f30\u8ba1", "\u591a\u89c6\u89d2\u51e0\u4f55", "\u70ed\u56fe\u878d\u5408", "\u4e09\u89d2\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30521v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MEOM: Multi-View Expected-OKS Maximization for Human Pose Triangulation", "tldr": "\u672c\u6587\u63d0\u51fa MEOM\uff0c\u901a\u8fc7\u6700\u5927\u5316\u591a\u89c6\u89d2\u70ed\u56fe\u6982\u7387\u8d28\u91cf\u7684\u4e00\u81f4\u6027\u6765\u8fdb\u884c\u4eba\u4f53 3D \u5173\u8282\u70b9\u4e09\u89d2\u5316\uff0c\u907f\u514d\u5c06\u591a\u5cf0\u70ed\u56fe\u538b\u7f29\u6210\u5355\u70b9\u5e26\u6765\u7684\u4fe1\u606f\u635f\u5931\u3002\u65b9\u6cd5\u5728\u65e0 3D \u76d1\u7763\u4e0b\u5df2\u63a5\u8fd1\u6216\u4f18\u4e8e\u66f4\u590d\u6742\u65b9\u6848\uff0c\u5728\u6709 3D \u6807\u6ce8\u65f6\u4e8e Human3.6M \u8fbe\u5230 19.11mm \u7edd\u5bf9 MPJPE\uff0c\u5e76\u4ee5\u7ea6\u4e00\u534a\u63a8\u7406\u6210\u672c\u4f18\u4e8e\u73b0\u6709\u4f53\u7d20\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "For provenance research and art market studies, auction catalogs are an essential resource to trace specific objects over time and space. While historical auction catalogs follow established domain conventions, their internal formatting remains highly variable, and their large-scale analysis is currently restricted by the lack of machine-readable representations of the auction lots. We propose a pipeline to automatically extract structured lot-level metadata from German Sales, a large database of historical auction and sales catalogs from the 19th and 20th centuries. Using a manually annotated test set of representative catalog pages, we evaluate Vision-Language Models (VLMs) under varying prompt strategies and constrained decoding frameworks. To reflect the practical constraints faced by cultural heritage institutions, including budget, compute resources, and data privacy requirements, we benchmark the methods across different deployment modes ranging from commercial providers to locally hosted, quantized models. We find that commercial endpoints establish the performance ceiling, while institutional gateways offer a viable, privacy-preserving alternative. Local deployments remain feasible, but strictly require enforcing the output structure during generation to guarantee a valid JSON format. While varying degrees of human-in-the-loop correction are still necessary, this work demonstrates that a VLM-based pipeline can successfully unlock historical auction catalogs for large-scale automated analysis.", "arxiv_id": "2608.30510", "arxiv_url": "https://arxiv.org/abs/2608.30510", "authors": ["Mathias Zinnen", "Alisha Mund", "Sabine Lang", "Lukas H\u00fcttner", "Thomas Gorges", "Vincent Christlein"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u6d41\u6c34\u7ebf\uff0c\u4ece19\u81f320\u4e16\u7eaa\u5fb7\u8bed\u62cd\u5356\u76ee\u5f55\u4e2d\u81ea\u52a8\u62bd\u53d6\u7ed3\u6784\u5316\u62cd\u54c1\u7ea7\u5143\u6570\u636e\u3002\u5b9e\u9a8c\u6bd4\u8f83\u4e86\u5546\u4e1a\u7aef\u70b9\u3001\u673a\u6784\u7f51\u5173\u548c\u672c\u5730\u91cf\u5316\u6a21\u578b\uff0c\u53d1\u73b0\u5546\u4e1a\u6a21\u578b\u6548\u679c\u6700\u597d\uff0c\u9690\u79c1\u53cb\u597d\u7684\u673a\u6784\u90e8\u7f72\u53ef\u884c\uff0c\u672c\u5730\u90e8\u7f72\u5219\u9700\u8981\u7ea6\u675f\u89e3\u7801\u6765\u4fdd\u8bc1JSON\u8f93\u51fa\u6709\u6548\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.DL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30510", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4fe1\u606f\u62bd\u53d6", "\u6587\u5316\u9057\u4ea7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30510v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Lot Machine: Multimodal Lot Extraction from Auction Catalogs", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u57fa\u4e8e\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u6d41\u6c34\u7ebf\uff0c\u4ece19\u81f320\u4e16\u7eaa\u5fb7\u8bed\u62cd\u5356\u76ee\u5f55\u4e2d\u81ea\u52a8\u62bd\u53d6\u7ed3\u6784\u5316\u62cd\u54c1\u7ea7\u5143\u6570\u636e\u3002\u5b9e\u9a8c\u6bd4\u8f83\u4e86\u5546\u4e1a\u7aef\u70b9\u3001\u673a\u6784\u7f51\u5173\u548c\u672c\u5730\u91cf\u5316\u6a21\u578b\uff0c\u53d1\u73b0\u5546\u4e1a\u6a21\u578b\u6548\u679c\u6700\u597d\uff0c\u9690\u79c1\u53cb\u597d\u7684\u673a\u6784\u90e8\u7f72\u53ef\u884c\uff0c\u672c\u5730\u90e8\u7f72\u5219\u9700\u8981\u7ea6\u675f\u89e3\u7801\u6765\u4fdd\u8bc1JSON\u8f93\u51fa\u6709\u6548\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Object hallucination remains a persistent reliability issue in large vision-language models, where generated object mentions may sound plausible but lack visual grounding. Recent training-free detectors use internal signals such as token likelihood, attention, visual confidence, or image-text similarity to identify hallucinated objects. These signals are useful, but they are often source-confounded. They measure how strongly an object is supported inside the model without distinguishing whether that support comes from object-specific visual evidence or the generated text prefix. In difficult cases, a hallucinated object can still receive high internal support because it fits the scene, is associated with nearby visual cues, or follows naturally from the generated text prefix. We propose VisER, a training-free two-sided metric for object-level hallucination detection. VisER evaluates each generated object mention from two complementary views. Visual Evidence measures whether object-context compatibility is backed by object-specific evidence from image tokens. Visual Reliance measures whether the object is supported more by the image than by the generated prefix. Combining these views gives a more source-aware grounding score, while avoiding additional object-level verification generations. Across multiple LVLMs and benchmarks, VisER improves AUROC and AUPR over a range of baselines.", "arxiv_id": "2608.30480", "arxiv_url": "https://arxiv.org/abs/2608.30480", "authors": ["Afsaneh Hasanebrahimi", "Hanxun Huang", "Christopher Leckie", "Sarah Erfani"], "brief": "\u8bba\u6587\u63d0\u51fa VisER\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LVLM \u5bf9\u8c61\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u6307\u6807\uff0c\u4ece\u201c\u89c6\u89c9\u8bc1\u636e\u201d\u548c\u201c\u89c6\u89c9\u4f9d\u8d56\u201d\u4e24\u65b9\u9762\u5224\u65ad\u751f\u6210\u5bf9\u8c61\u662f\u5426\u771f\u6b63\u7531\u56fe\u50cf\u652f\u6491\u3002\u8be5\u65b9\u6cd5\u80fd\u533a\u5206\u6a21\u578b\u5185\u90e8\u652f\u6301\u6765\u81ea\u56fe\u50cf\u8fd8\u662f\u6587\u672c\u524d\u7f00\uff0c\u5728\u591a\u4e2a\u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86 AUROC \u548c AUPR\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30480", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5e7b\u89c9\u68c0\u6d4b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u53ef\u4fe1AI"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30480v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "VisER: Visual Evidence and Reliance for Object Hallucination Detection in LVLMs", "tldr": "\u8bba\u6587\u63d0\u51fa VisER\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684 LVLM \u5bf9\u8c61\u7ea7\u5e7b\u89c9\u68c0\u6d4b\u6307\u6807\uff0c\u4ece\u201c\u89c6\u89c9\u8bc1\u636e\u201d\u548c\u201c\u89c6\u89c9\u4f9d\u8d56\u201d\u4e24\u65b9\u9762\u5224\u65ad\u751f\u6210\u5bf9\u8c61\u662f\u5426\u771f\u6b63\u7531\u56fe\u50cf\u652f\u6491\u3002\u8be5\u65b9\u6cd5\u80fd\u533a\u5206\u6a21\u578b\u5185\u90e8\u652f\u6301\u6765\u81ea\u56fe\u50cf\u8fd8\u662f\u6587\u672c\u524d\u7f00\uff0c\u5728\u591a\u4e2a\u6a21\u578b\u548c\u57fa\u51c6\u4e0a\u63d0\u5347\u4e86 AUROC \u548c AUPR\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This paper investigates the problem of position estimation of unmanned surface vessels (USVs) operating in coastal areas or in the archipelago. We propose a position estimation method where the horizon line is extracted in a 360 degree panoramic image around the USV. We design a CNN architecture to determine an approximate horizon line in the image and implicitly determine the camera orientation (the pitch and roll angles). The panoramic image is warped to compensate for the camera orientation and to generate an image from an approximately level camera. A second CNN architecture is designed to extract the pixelwise horizon line in the warped image. The extracted horizon line is correlated with digital elevation model (DEM) data in the Fourier domain using a MOSSE correlation filter. Finally, we determine the location of the maximum correlation score over the search area to estimate the position of the USV. Comprehensive experiments are performed in a field trial in the archipelago. Our approach provides promising results by achieving position estimates with GPS-level accuracy.", "arxiv_id": "2608.30471", "arxiv_url": "https://arxiv.org/abs/2608.30471", "authors": ["Bertil Grelsson", "Andreas Robinson", "Michael Felsberg", "Fahad Shahbaz Khan"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u65e0\u4eba\u6c34\u9762\u8247\u6cbf\u6d77/\u7fa4\u5c9b\u73af\u5883\u5b9a\u4f4d\u7684\u65b9\u6cd5\uff1a\u4ece360\u5ea6\u5168\u666f\u56fe\u4e2d\u63d0\u53d6\u5730\u5e73\u7ebf\uff0c\u6821\u6b63\u76f8\u673a\u59ff\u6001\u540e\u518d\u4e0e\u6570\u5b57\u9ad8\u7a0b\u6a21\u578b\u5728\u5085\u91cc\u53f6\u57df\u8fdb\u884c\u76f8\u5173\u5339\u914d\u3002\u5b9e\u5730\u8bd5\u9a8c\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u53ef\u8fbe\u5230\u63a5\u8fd1GPS\u7ea7\u7684\u5b9a\u4f4d\u7cbe\u5ea6\uff0c\u9002\u5408\u89c6\u89c9\u5730\u5f62\u5bfc\u822a\u573a\u666f\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30471", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u5b9a\u4f4d", "\u673a\u5668\u4eba\u5bfc\u822a", "\u5377\u79ef\u795e\u7ecf\u7f51\u7edc", "\u5730\u5f62\u5339\u914d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30471v1", "published_at": "2026-08-31", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HorizonNet for visual terrain navigation", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u65e0\u4eba\u6c34\u9762\u8247\u6cbf\u6d77/\u7fa4\u5c9b\u73af\u5883\u5b9a\u4f4d\u7684\u65b9\u6cd5\uff1a\u4ece360\u5ea6\u5168\u666f\u56fe\u4e2d\u63d0\u53d6\u5730\u5e73\u7ebf\uff0c\u6821\u6b63\u76f8\u673a\u59ff\u6001\u540e\u518d\u4e0e\u6570\u5b57\u9ad8\u7a0b\u6a21\u578b\u5728\u5085\u91cc\u53f6\u57df\u8fdb\u884c\u76f8\u5173\u5339\u914d\u3002\u5b9e\u5730\u8bd5\u9a8c\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u53ef\u8fbe\u5230\u63a5\u8fd1GPS\u7ea7\u7684\u5b9a\u4f4d\u7cbe\u5ea6\uff0c\u9002\u5408\u89c6\u89c9\u5730\u5f62\u5bfc\u822a\u573a\u666f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deep-learning models can achieve strong chest X-ray (CXR) classification performance without establishing whether their predictions predominantly rely on pulmonary image content. This study evaluates pulmonary attribution containment as an anatomy-related reliability property distinct from diagnostic performance. We propose DBCA-SegNet-MGAP, a multi-task anatomy-guided CNN-Transformer framework that combines complementary feature representations through bidirectional cross-backbone attention, predicts a soft lung mask, and incorporates this anatomical prior directly into classification through Mask-Guided Adaptive Global Average Pooling (MGAP). Pulmonary attribution containment is quantified using the Anatomical Local Energy Ratio (ALR) and high-int
