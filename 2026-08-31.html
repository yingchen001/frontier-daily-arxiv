l": "https://arxiv.org/abs/2608.28192", "authors": ["Hanoona Rasheed", "Haania Siddiqui", "Ming-Hsuan Yang", "Fahad Shahbaz Khan", "Salman Khan"], "brief": "\u8bba\u6587\u63d0\u51fa Parallel Tube Decoding\uff08PTD\uff09\uff0c\u5c06\u65f6\u7a7a\u89c6\u9891\u5b9a\u4f4d\u62c6\u6210\u65f6\u95f4\u533a\u95f4\u9884\u6d4b\u4e0e\u5e76\u884c\u7a7a\u95f4\u6846\u751f\u6210\uff0c\u907f\u514d\u4f20\u7edf\u81ea\u56de\u5f52\u9010\u5e27\u751f\u6210\u8f68\u8ff9\u3002\u65b9\u6cd5\u5728\u56fa\u5b9a\u4e24\u8f6e\u89e3\u7801\u5185\u5b8c\u6210 tube \u751f\u6210\uff0c\u5e76\u7ed3\u5408\u89e3\u8026\u5757\u6ce8\u610f\u529b\u548c\u5b9a\u4f4d\u611f\u77e5\u7b56\u7565\u4f18\u5316\u63d0\u5347\u7cbe\u5ea6\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mbzuai-oryx/ParallelTubeDecoding", "github_stars": 17, "hf_url": "https://huggingface.co/papers/2608.28192", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5c06\u89e3\u7801\u987a\u5e8f\u6df1\u5ea6\u964d\u4e3a\u56fa\u5b9a\u7684\u201c\u65f6\u95f4\u5757 + \u7a7a\u95f4\u5757\u201d\u4e24\u8f6e\uff0c\u4e0d\u968f\u76ee\u6807\u8f68\u8ff9\u957f\u5ea6\u589e\u957f", "\u63d0\u51fa Decoupled Block Attention\uff0c\u5728\u5171\u4eab\u89c6\u9891-\u6587\u672c\u4e0a\u4e0b\u6587\u7684\u540c\u65f6\u6d88\u9664\u6846\u4e4b\u95f4\u7684\u4ea4\u53c9\u4f9d\u8d56", "\u5728 VidSTG \u4e0a Tube Completion Latency \u964d\u4f4e 79 \u500d\u3001\u7a7a\u95f4\u89e3\u7801\u541e\u5410\u63d0\u5347 92 \u500d\uff0c\u5e76\u63d0\u5347\u5b9a\u4f4d\u51c6\u786e\u7387"], "keywords": ["\u89c6\u9891\u7406\u89e3", "\u65f6\u7a7a\u5b9a\u4f4d", "\u591a\u6a21\u6001", "\u751f\u6210\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2608.28192v1", "published_at": "2026-08-28", "score": 0.304, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28192.png", "title": "Locate Anything in Videos: Rethinking Efficient Generative Spatio-Temporal Video Grounding", "tldr": "\u5e76\u884c\u751f\u6210\u89c6\u9891\u76ee\u6807\u65f6\u7a7a\u8f68\u8ff9\uff0c\u63d0\u901f\u4e14\u66f4\u51c6", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa Parallel Tube Decoding\uff08PTD\uff09\uff0c\u5c06\u65f6\u7a7a\u89c6\u9891\u5b9a\u4f4d\u62c6\u6210\u65f6\u95f4\u533a\u95f4\u9884\u6d4b\u4e0e\u5e76\u884c\u7a7a\u95f4\u6846\u751f\u6210\uff0c\u907f\u514d\u4f20\u7edf\u81ea\u56de\u5f52\u9010\u5e27\u751f\u6210\u8f68\u8ff9\u3002\u65b9\u6cd5\u5728\u56fa\u5b9a\u4e24\u8f6e\u89e3\u7801\u5185\u5b8c\u6210 tube \u751f\u6210\uff0c\u5e76\u7ed3\u5408\u89e3\u8026\u5757\u6ce8\u610f\u529b\u548c\u5b9a\u4f4d\u611f\u77e5\u7b56\u7565\u4f18\u5316\u63d0\u5347\u7cbe\u5ea6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u89c6\u9891\u65f6\u7a7a\u5b9a\u4f4d\u4e2d\u81ea\u56de\u5f52\u8f68\u8ff9\u751f\u6210\u6162\u3001\u8bef\u5dee\u6613\u7d2f\u79ef\u7684\u95ee\u9898\u7ed9\u51fa\u7ed3\u6784\u6027\u66ff\u4ee3\u65b9\u6848\uff0c\u5728\u6548\u7387\u548c\u7cbe\u5ea6\u4e0a\u540c\u65f6\u6539\u8fdb\uff0c\u5e76\u80fd\u96f6\u6837\u672c\u6cdb\u5316\u5230\u65f6\u95f4\u5b9a\u4f4d\u3001Grounded VideoQA \u548c\u6307\u4ee3\u8868\u8fbe\u89c6\u9891\u76ee\u6807\u8ddf\u8e2a\u7b49\u4efb\u52a1\u3002"}, {"abstract": "Vision-Language-Action (VLA) models can turn multimodal context into robot actions, but their action decoders are still trained largely by behavior cloning. This supervises which motor command was demonstrated while leaving implicit the local objective served by the behavior under the instruction. Future-based supervision enriches action learning with frames, latent observations, trajectories, or motion representations, but these signals capture particular realizations of what may happen rather than the shared semantic objective of the forthcoming behavior. We propose Intention Distillation (INDI), which distills behavior-level intent into the action decoder. During training, a frozen teacher VLM interprets a demonstrated segment from the current observation, instruction, coarse action summary, and corresponding execution video. From its standard inputs, the deployed VLA recovers the resulting multimodal intent representation at an intermediate decoder layer and uses it to organize action prediction together with representations of how the behavior unfolds and what it achieves. On SimplerEnv-Bridge, INDI improves GR00T-N1.7 from 64.3% to 84.7%, and on RoboCasa Kitchen it improves the controlled GR00T-N1.7 baseline from 64.1% to 70.3%, with consistent gains on $\u03c0_{0.5}$ across both benchmarks. In real-world tasks, INDI improves average success from 62.0% to 68.7%, with gains of up to 12.0 pp on longer-horizon tasks. Further analyses show that the recovered latent is used by the decoder, captures behavior objective and execution progress, and organizes downstream predictions in an objective-dependent manner. These results show that action decoders benefit from explicitly modeling the semantic objective of the behavior they generate.", "arxiv_id": "2608.23478", "arxiv_url": "https://arxiv.org/abs/2608.23478", "authors": ["Sangoh Lee", "Sangwoo Mo", "Wook-Shin Han"], "brief": "\u8bba\u6587\u63d0\u51fa Intention Distillation\uff08INDI\uff09\uff0c\u7528\u51bb\u7ed3\u7684\u6559\u5e08 VLM \u4ece\u793a\u8303\u7247\u6bb5\u3001\u6307\u4ee4\u3001\u52a8\u4f5c\u6458\u8981\u4e0e\u6267\u884c\u89c6\u9891\u4e2d\u63d0\u53d6\u884c\u4e3a\u7ea7\u610f\u56fe\uff0c\u5e76\u8ba9\u90e8\u7f72\u65f6\u7684 VLA \u5728\u4e2d\u95f4\u89e3\u7801\u5c42\u6062\u590d\u8be5\u610f\u56fe\u8868\u793a\u3002\u8be5\u65b9\u6cd5\u5c06\u201c\u8981\u8fbe\u6210\u4ec0\u4e48\u76ee\u6807\u201d\u7684\u8bed\u4e49\u76d1\u7763\u663e\u5f0f\u6ce8\u5165\u52a8\u4f5c\u9884\u6d4b\uff0c\u800c\u4e0d\u53ea\u4f9d\u8d56\u884c\u4e3a\u514b\u9686\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": "https://github.com/Leesangoh/INDI", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.23478", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u533a\u522b\u4e8e\u672a\u6765\u5e27\u3001\u8f68\u8ff9\u7b49\u76d1\u7763\uff0cINDI \u84b8\u998f\u7684\u662f\u8de8\u5177\u4f53\u6267\u884c\u5b9e\u4f8b\u5171\u4eab\u7684\u8bed\u4e49\u76ee\u6807\u3002", "\u5728 SimplerEnv-Bridge \u4e0a\u5c06 GR00T-N1.7 \u6210\u529f\u7387\u4ece 64.3% \u63d0\u5347\u5230 84.7%\uff0c\u5728 RoboCasa Kitchen \u4e0a\u4ece 64.1% \u63d0\u5347\u5230 70.3%\u3002", "\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u5e73\u5747\u6210\u529f\u7387\u4ece 62.0% \u63d0\u5347\u5230 68.7%\uff0c\u957f\u7a0b\u4efb\u52a1\u6700\u9ad8\u63d0\u5347 12.0 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u884c\u4e3a\u514b\u9686"], "num_comments": 2, "on_hf": true, "organization": "Pohang University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2608.23478v1", "published_at": "2026-08-24", "score": 0.304, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23478.png", "title": "Act with Intent: Distilling Behavior Intent for Vision-Language-Action Models", "tldr": "\u4e3aVLA\u52a8\u4f5c\u89e3\u7801\u5668\u84b8\u998f\u884c\u4e3a\u610f\u56fe", "upvotes": 28, "what_it_is": "\u8bba\u6587\u63d0\u51fa Intention Distillation\uff08INDI\uff09\uff0c\u7528\u51bb\u7ed3\u7684\u6559\u5e08 VLM \u4ece\u793a\u8303\u7247\u6bb5\u3001\u6307\u4ee4\u3001\u52a8\u4f5c\u6458\u8981\u4e0e\u6267\u884c\u89c6\u9891\u4e2d\u63d0\u53d6\u884c\u4e3a\u7ea7\u610f\u56fe\uff0c\u5e76\u8ba9\u90e8\u7f72\u65f6\u7684 VLA \u5728\u4e2d\u95f4\u89e3\u7801\u5c42\u6062\u590d\u8be5\u610f\u56fe\u8868\u793a\u3002\u8be5\u65b9\u6cd5\u5c06\u201c\u8981\u8fbe\u6210\u4ec0\u4e48\u76ee\u6807\u201d\u7684\u8bed\u4e49\u76d1\u7763\u663e\u5f0f\u6ce8\u5165\u52a8\u4f5c\u9884\u6d4b\uff0c\u800c\u4e0d\u53ea\u4f9d\u8d56\u884c\u4e3a\u514b\u9686\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa VLA \u52a8\u4f5c\u89e3\u7801\u5668\u4e0d\u4ec5\u9700\u8981\u6a21\u4eff\u52a8\u4f5c\uff0c\u8fd8\u5e94\u663e\u5f0f\u5efa\u6a21\u884c\u4e3a\u610f\u56fe\uff1b\u8fd9\u4e3a\u63d0\u5347\u673a\u5668\u4eba\u957f\u7a0b\u4efb\u52a1\u3001\u76ee\u6807\u6cdb\u5316\u548c\u52a8\u4f5c\u7ec4\u7ec7\u80fd\u529b\u63d0\u4f9b\u4e86\u5b9e\u7528\u8bad\u7ec3\u8303\u5f0f\u3002"}, {"abstract": "We present StarHarness, a framework for evolving environment-specific agent harnesses while keeping model weights fixed. The evolved harness can include prompt and task framing, tool interfaces, skills, MCP-backed providers, subagent structure, and agent-loop configuration. StarHarness constructs a compact evolution pool by stratifying tasks according to baseline failure behavior, separates proposer-visible search tasks from proposer-hidden selection tasks, and reserves held-out tasks for evaluating generalization. Across ITBench SRE, EnterpriseOps-Gym ITSM, and AutomationBench Finance, harness evolution improves full-benchmark performance by 20-35 percentage points over the default harness after 4-12 accepted changes per environment. These gains persist on tasks excluded from evolution and transfer without re-evolution across GPT and Qwen model families. Trace analysis links the improvements to interface repairs, environment conventions, and operational knowledge that compresses search, with fewer false-positive diagnoses and shorter trajectories in several settings. StarHarness therefore offers a practical way to reduce persistent model-environment mismatch in tool-rich enterprise tasks.", "arxiv_id": "2608.24804", "arxiv_url": "https://arxiv.org/abs/2608.24804", "authors": ["Esakkivel Esakkiraja", "Denis Akhiyarov", "Vikas Yadav", "Sai Rajeswar", "Patrice Bechard", "Sridhar Nemala", "Sagar Davasam"], "brief": "\u672c\u6587\u63d0\u51fa StarHarness\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u7684\u60c5\u51b5\u4e0b\uff0c\u81ea\u52a8\u6f14\u5316\u9762\u5411\u7279\u5b9a\u4f01\u4e1a\u73af\u5883\u7684\u667a\u80fd\u4f53 harness\uff0c\u5305\u62ec\u63d0\u793a\u3001\u5de5\u5177\u63a5\u53e3\u3001\u6280\u80fd\u3001MCP \u63d0\u4f9b\u65b9\u3001\u5b50\u667a\u80fd\u4f53\u7ed3\u6784\u4e0e\u5faa\u73af\u914d\u7f6e\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u4efb\u52a1\u641c\u7d22\u4e0e\u9690\u85cf\u9009\u62e9\u96c6\u673a\u5236\uff0c\u63d0\u5347 harness \u7684\u6cdb\u5316\u6027\u80fd\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.24804", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6309\u57fa\u7ebf\u5931\u8d25\u884c\u4e3a\u5bf9\u4efb\u52a1\u5206\u5c42\uff0c\u6784\u5efa\u7d27\u51d1\u7684\u6f14\u5316\u6c60\uff0c\u5e76\u533a\u5206 proposer \u53ef\u89c1\u641c\u7d22\u4efb\u52a1\u3001\u9690\u85cf\u9009\u62e9\u4efb\u52a1\u548c\u7559\u51fa\u8bc4\u6d4b\u4efb\u52a1", "\u5728 ITBench SRE\u3001EnterpriseOps-Gym ITSM\u3001AutomationBench Finance \u4e0a\uff0c\u7ecf\u8fc7\u6bcf\u4e2a\u73af\u5883 4\u201312 \u6b21\u63a5\u53d7\u4fee\u6539\u540e\uff0c\u5b8c\u6574\u57fa\u51c6\u6027\u80fd\u8f83\u9ed8\u8ba4 harness \u63d0\u5347 20\u201335 \u4e2a\u767e\u5206\u70b9", "\u6539\u8fdb\u53ef\u8fc1\u79fb\u5230\u672a\u53c2\u4e0e\u6f14\u5316\u7684\u4efb\u52a1\uff0c\u5e76\u80fd\u8de8 GPT \u4e0e Qwen \u6a21\u578b\u5bb6\u65cf\u8fc1\u79fb\uff0c\u4e3b\u8981\u6536\u76ca\u6765\u81ea\u63a5\u53e3\u4fee\u590d\u3001\u73af\u5883\u7ea6\u5b9a\u6ce8\u5165\u548c\u64cd\u4f5c\u77e5\u8bc6\u538b\u7f29"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u4f01\u4e1a\u81ea\u52a8\u5316", "\u641c\u7d22\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "ServiceNow-AI", "pdf_url": "https://arxiv.org/pdf/2608.24804v1", "published_at": "2026-08-25", "score": 0.29, "selected_reasons": ["HF trending (23\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24804.png", "title": "StarHarness: Evolving Harnesses with Stratified Search for Enterprise Environments", "tldr": "\u56fa\u5b9a\u6a21\u578b\u6743\u91cd\u8fdb\u5316\u4f01\u4e1a\u667a\u80fd\u4f53\u6846\u67b6", "upvotes": 23, "what_it_is": "\u672c\u6587\u63d0\u51fa StarHarness\uff0c\u5728\u4e0d\u66f4\u65b0\u6a21\u578b\u6743\u91cd\u7684\u60c5\u51b5\u4e0b\uff0c\u81ea\u52a8\u6f14\u5316\u9762\u5411\u7279\u5b9a\u4f01\u4e1a\u73af\u5883\u7684\u667a\u80fd\u4f53 harness\uff0c\u5305\u62ec\u63d0\u793a\u3001\u5de5\u5177\u63a5\u53e3\u3001\u6280\u80fd\u3001MCP \u63d0\u4f9b\u65b9\u3001\u5b50\u667a\u80fd\u4f53\u7ed3\u6784\u4e0e\u5faa\u73af\u914d\u7f6e\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u4efb\u52a1\u641c\u7d22\u4e0e\u9690\u85cf\u9009\u62e9\u96c6\u673a\u5236\uff0c\u63d0\u5347 harness \u7684\u6cdb\u5316\u6027\u80fd\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u5f3a\u8c03\u901a\u8fc7\u4f18\u5316\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u800c\u975e\u5fae\u8c03\u6a21\u578b\u6765\u89e3\u51b3\u4f01\u4e1a\u5de5\u5177\u73af\u5883\u4e2d\u7684\u6a21\u578b-\u73af\u5883\u9519\u914d\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\uff0c\u5c24\u5176\u9002\u5408\u5de5\u5177\u590d\u6742\u3001\u6d41\u7a0b\u89c4\u8303\u4e14\u96be\u4ee5\u9891\u7e41\u8bad\u7ec3\u6a21\u578b\u7684\u4f01\u4e1a\u573a\u666f\u3002"}, {"abstract": "LLM-based agents can interact with external environments through tool invocation, but this capability also introduces security risks such as file modification, information leakage, and unauthorized actions. Existing guardrails often evaluate completed trajectories, leaving pre-execution monitoring of step-level actions underexplored. We propose StepGuard, a step-level guard model that can audit completed agent trajectories and check tool actions before they are executed. To train StepGuard, we introduce StepGen, an automatic data engine that generates safe and unsafe trajectories with the same context but different actions at the risky step. To further reduce over-defense and under-defense, we propose Balance-GRPO, which dynamically balances learning between safe and unsafe actions based on their observed accuracy. Experiments show that StepGuard achieves the highest average accuracy among open-weight guard models, with performance comparable to GPT-5.4. When used to guard agents on AgentDojo and AgentDyn, StepGuard reduces mean attack success rate by 77.3% relative to the no-guard setting, while mean utility drops by only 2.8 percentage points.", "arxiv_id": "2608.24777", "arxiv_url": "https://arxiv.org/abs/2608.24777", "authors": ["Zhijie Zheng", "Yu Li", "Chen Qian", "Yuqian Fu", "Yanwei Fu", "Lu Sheng", "Jing Shao", "Dongrui Liu"], "brief": "\u8bba\u6587\u63d0\u51faStepGuard\uff0c\u4e00\u79cd\u9762\u5411LLM\u667a\u80fd\u4f53\u7684\u6b65\u9aa4\u7ea7\u5b89\u5168\u62a4\u680f\u6a21\u578b\uff0c\u53ef\u5ba1\u8ba1\u5b8c\u6574\u8f68\u8ff9\u5e76\u5728\u5de5\u5177\u8c03\u7528\u6267\u884c\u524d\u68c0\u6d4b\u98ce\u9669\u52a8\u4f5c\u3002\u4f5c\u8005\u8fd8\u6784\u5efaStepGen\u81ea\u52a8\u751f\u6210\u540c\u4e0a\u4e0b\u6587\u4e0b\u5b89\u5168/\u4e0d\u5b89\u5168\u52a8\u4f5c\u6570\u636e\uff0c\u5e76\u63d0\u51faBalance-GRPO\u5e73\u8861\u5b89\u5168\u6027\u4e0e\u53ef\u7528\u6027\u8bad\u7ec3\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": "https://github.com/zheng977/StepGuard", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.24777", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["StepGen\u81ea\u52a8\u751f\u6210\u6210\u5bf9\u8f68\u8ff9\uff1a\u76f8\u540c\u4e0a\u4e0b\u6587\u4e2d\u4ec5\u98ce\u9669\u6b65\u9aa4\u52a8\u4f5c\u4e0d\u540c\uff0c\u7528\u4e8e\u53ef\u6269\u5c55\u76d1\u7763\u3002", "Balance-GRPO\u6839\u636e\u5b89\u5168\u4e0e\u4e0d\u5b89\u5168\u52a8\u4f5c\u7684\u89c2\u6d4b\u51c6\u786e\u7387\u52a8\u6001\u8c03\u6574\u5b66\u4e60\u91cd\u70b9\uff0c\u7f13\u89e3\u8fc7\u5ea6\u9632\u5fa1\u548c\u9632\u5fa1\u4e0d\u8db3\u3002", "\u5728AgentDojo\u548cAgentDyn\u4e0a\uff0cStepGuard\u4f7f\u5e73\u5747\u653b\u51fb\u6210\u529f\u7387\u76f8\u5bf9\u65e0\u62a4\u680f\u4e0b\u964d77.3%\uff0c\u5e73\u5747\u6548\u7528\u4ec5\u4e0b\u964d2.8\u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5b89\u5168\u5bf9\u9f50", "\u5de5\u5177\u8c03\u7528", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "AI45Research", "pdf_url": "https://arxiv.org/pdf/2608.24777v1", "published_at": "2026-08-25", "score": 0.29, "selected_reasons": ["HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24777.png", "title": "StepGuard: Learning Step-Level Guardrails with Scalable Supervision and Safety-Utility Balancing", "tldr": "StepGuard\u5728\u5de5\u5177\u6267\u884c\u524d\u9010\u6b65\u62e6\u622a\u667a\u80fd\u4f53\u98ce\u9669\u64cd\u4f5c", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51faStepGuard\uff0c\u4e00\u79cd\u9762\u5411LLM\u667a\u80fd\u4f53\u7684\u6b65\u9aa4\u7ea7\u5b89\u5168\u62a4\u680f\u6a21\u578b\uff0c\u53ef\u5ba1\u8ba1\u5b8c\u6574\u8f68\u8ff9\u5e76\u5728\u5de5\u5177\u8c03\u7528\u6267\u884c\u524d\u68c0\u6d4b\u98ce\u9669\u52a8\u4f5c\u3002\u4f5c\u8005\u8fd8\u6784\u5efaStepGen\u81ea\u52a8\u751f\u6210\u540c\u4e0a\u4e0b\u6587\u4e0b\u5b89\u5168/\u4e0d\u5b89\u5168\u52a8\u4f5c\u6570\u636e\uff0c\u5e76\u63d0\u51faBalance-GRPO\u5e73\u8861\u5b89\u5168\u6027\u4e0e\u53ef\u7528\u6027\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u5b89\u5168\u4ece\u4e8b\u540e\u8f68\u8ff9\u8bc4\u4f30\u63a8\u8fdb\u5230\u5de5\u5177\u6267\u884c\u524d\u7684\u6b65\u9aa4\u7ea7\u76d1\u63a7\uff0c\u5728\u964d\u4f4e\u653b\u51fb\u6210\u529f\u7387\u7684\u540c\u65f6\u4fdd\u6301\u8f83\u9ad8\u4efb\u52a1\u6548\u7528\uff0c\u5bf9\u5b9e\u9645\u90e8\u7f72\u5177\u5907\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Multimodal large language models (MLLMs) can integrate long visual histories, reason under partial observability, and infer behavior from a few examples. Yet vision-language-action (VLA) models generally inherit pretrained representations without using this contextual capacity as episode memory. Memory-dependent policies address this gap through purpose-built history mechanisms. PonderPounce instead reuses an MLLM\u0027s native causal context as robot memory. Ponder, a System2 MLLM, accumulates episode observations, demonstrations, and prior cognition in its native causal context and can generate subgoal text and demonstration reasoning for internal use. Pounce, a System1 VLA, receives the current observation, instruction, and proprioception directly; through the Ponder--Pounce interface, it asynchronously receives only the newest continuous cognition token and its age. Both are jointly trained end to end without a purpose-built memory module or separate bridge pretraining. Optimized serving achieves p50 latencies of 78ms for cognition refresh and 25ms for action-model invocation, supporting 20Hz action playback. On RoboMME with base-scale training data, PonderPounce reaches 60.83% with 9B and 50.04% with 0.8B under the same Pounce architecture and interface, versus 44.51% for FrameSamp+Modul and 17.93% for the current-observation \u03c0_{0.5}. With 9x data, it reaches 75.54% versus 57.88% for FrameSamp+Modul. On RoboCasa-DC, the same interface learns from action supervision alone and reaches 12.5% versus 11.6% for the strongest published demonstration-conditioned baseline, falling to 8.6% when cognition is replaced by a learned null state.", "arxiv_id": "2608.24115", "arxiv_url": "https://arxiv.org/abs/2608.24115", "authors": ["Suhwan Choi", "Jaeyoon Jung", "Sungkyung Kim", "Yunsung Lee", "Youngjae Yu"], "brief": "\u8bba\u6587\u63d0\u51fa PonderPounce\uff1a\u7528\u9884\u8bad\u7ec3\u591a\u6a21\u6001\u5927\u6a21\u578b Ponder \u7684\u539f\u751f\u56e0\u679c\u4e0a\u4e0b\u6587\u79ef\u7d2f\u89c2\u6d4b\u3001\u793a\u4f8b\u548c\u63a8\u7406\uff0c\u4f5c\u4e3a\u673a\u5668\u4eba\u63a7\u5236\u7684\u60c5\u8282\u8bb0\u5fc6\uff1b\u518d\u7531 VLA \u52a8\u4f5c\u6a21\u578b Pounce \u5f02\u6b65\u63a5\u6536\u6700\u65b0\u8fde\u7eed\u8ba4\u77e5 token \u6267\u884c\u52a8\u4f5c\u3002\u4e24\u8005\u7aef\u5230\u7aef\u8054\u5408\u8bad\u7ec3\uff0c\u65e0\u9700\u4e13\u95e8\u8bb0\u5fc6\u6a21\u5757\u6216\u989d\u5916\u6865\u63a5\u9884\u8bad\u7ec3\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": "https://github.com/worv-ai/PonderPounce", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.24115", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Ponder \u53ef\u5728\u957f\u89c6\u89c9\u5386\u53f2\u548c\u5c11\u91cf\u793a\u4f8b\u4e0a\u751f\u6210\u5b50\u76ee\u6807\u6587\u672c\u4e0e\u793a\u8303\u63a8\u7406\uff0cPounce \u4ec5\u63a5\u6536\u5f53\u524d\u89c2\u6d4b\u3001\u6307\u4ee4\u3001\u672c\u4f53\u611f\u77e5\u4ee5\u53ca\u6700\u65b0\u8ba4\u77e5 token \u548c\u5176\u65f6\u95f4\u5e74\u9f84\u3002", "\u7cfb\u7edf\u7ecf\u4f18\u5316\u540e\u8ba4\u77e5\u5237\u65b0 p50 \u5ef6\u8fdf 78ms\u3001\u52a8\u4f5c\u6a21\u578b\u8c03\u7528 25ms\uff0c\u652f\u6301 20Hz \u52a8\u4f5c\u56de\u653e\u3002", "\u5728 RoboMME \u4e0a\uff0c9B \u7248\u672c\u8fbe\u5230 60.83%\uff0c0.8B \u8fbe\u5230 50.04%\uff0c\u4f18\u4e8e FrameSamp+Modul \u7684 44.51%\uff1b\u4f7f\u7528 9 \u500d\u6570\u636e\u540e\u8fbe\u5230 75.54%\u3002"], "keywords": ["\u673a\u5668\u4eba\u63a7\u5236", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u667a\u80fd\u4f53"], "num_comments": 2, "on_hf": true, "organization": "maum-ai", "pdf_url": "https://arxiv.org/pdf/2608.24115v1", "published_at": "2026-08-25", "score": 0.286, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.24115.png", "title": "PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control", "tldr": "\u7528MLLM\u4e0a\u4e0b\u6587\u4f5c\u673a\u5668\u4eba\u60c5\u8282\u8bb0\u5fc6", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa PonderPounce\uff1a\u7528\u9884\u8bad\u7ec3\u591a\u6a21\u6001\u5927\u6a21\u578b Ponder \u7684\u539f\u751f\u56e0\u679c\u4e0a\u4e0b\u6587\u79ef\u7d2f\u89c2\u6d4b\u3001\u793a\u4f8b\u548c\u63a8\u7406\uff0c\u4f5c\u4e3a\u673a\u5668\u4eba\u63a7\u5236\u7684\u60c5\u8282\u8bb0\u5fc6\uff1b\u518d\u7531 VLA \u52a8\u4f5c\u6a21\u578b Pounce \u5f02\u6b65\u63a5\u6536\u6700\u65b0\u8fde\u7eed\u8ba4\u77e5 token \u6267\u884c\u52a8\u4f5c\u3002\u4e24\u8005\u7aef\u5230\u7aef\u8054\u5408\u8bad\u7ec3\uff0c\u65e0\u9700\u4e13\u95e8\u8bb0\u5fc6\u6a21\u5757\u6216\u989d\u5916\u6865\u63a5\u9884\u8bad\u7ec3\u3002", "why_notable": "\u5b83\u628a MLLM \u7684\u957f\u4e0a\u4e0b\u6587\u80fd\u529b\u76f4\u63a5\u590d\u7528\u4e3a\u673a\u5668\u4eba\u60c5\u8282\u8bb0\u5fc6\uff0c\u907f\u514d\u624b\u5de5\u8bbe\u8ba1\u5386\u53f2\u6a21\u5757\uff0c\u5c55\u793a\u4e86 System2 \u8ba4\u77e5\u6a21\u578b\u4e0e System1 \u52a8\u4f5c\u6a21\u578b\u534f\u540c\u7528\u4e8e\u5b9e\u65f6\u673a\u5668\u4eba\u63a7\u5236\u7684\u53ef\u884c\u6027\u548c\u6027\u80fd\u6536\u76ca\u3002"}, {"abstract": "Recurrent fast-weight memories and selective state-space models compress an expanding context into a fixed-size recurrent state, making the state transition an online learning rule. We study this rule under read-after-write autoregressive semantics. For the prefix-prediction objective considered here, the local fast-memory example revealed at step $t$ is the prefix-aligned pair $(\\mathbf{x}_t,\\mathbf{y}_t)=(\u03c6(\\mathbf{k}_{t-1}),\\mathbf{v}_t)$. The common same-step association $(\u03c6(\\mathbf{k}_t),\\mathbf{v}_t)$ remains causal, but optimizes a different internal objective. We derive normalized first-order updates for squared-error regression and negative inner-product objectives. The regression family comprises Falcon-1 (a scalar NLMS update), Falcon-2 (its per-column extension), and Falcon-3 (a sliding-window mini-batch update); Falcon-1A/Falcon-2A/Falcon-3A are the corresponding inner-product variants. We provide recurrent, masked-parallel, and chunk-parallel forms, together with numerically stable positive-decay renormalization. Representative variants remain competitive in language modeling and improve length extrapolation on variable-digit addition. This framework separates temporal alignment, plasticity, forgetting, and bounded rehearsal in recurrent sequence models.", "arxiv_id": "2608.27763", "arxiv_url": "https://arxiv.org/abs/2608.27763", "authors": ["Yifan Zhang", "Steve Ta", "Jasper Zhang", "Jichen Feng", "Shuzhen Li", "Yongxin Zhang", "Yifeng Liu", "Huizhuo Yuan", "Mengdi Wang", "Quanquan Gu", "Andrew Chi-Chih Yao"], "brief": "\u8bba\u6587\u5c06\u5faa\u73af\u5feb\u6743\u91cd\u8bb0\u5fc6\u548c\u9009\u62e9\u6027\u72b6\u6001\u7a7a\u95f4\u6a21\u578b\u7684\u72b6\u6001\u8f6c\u79fb\u89c6\u4e3a\u5728\u7ebf\u5b66\u4e60\u89c4\u5219\uff0c\u91cd\u65b0\u5206\u6790\u81ea\u56de\u5f52\u524d\u7f00\u9884\u6d4b\u4e2d\u7684\u8bfb\u5199\u65f6\u5e8f\u5bf9\u9f50\u95ee\u9898\u3002\u4f5c\u8005\u63a8\u5bfc\u4e86\u4e00\u7cfb\u5217\u5f52\u4e00\u5316\u4e00\u9636\u5feb\u6743\u91cd\u66f4\u65b0\u65b9\u6cd5\uff0c\u5e76\u7ed9\u51fa Falcon-1/2/3 \u53ca\u5176\u5185\u79ef\u76ee\u6807\u53d8\u4f53\u3002", "categories": ["cs.LG", "cs.CL", "stat.ML"], "github_repo": "https://github.com/yifanzhang-pro/fast-weight-attention", "github_stars": 11, "hf_url": "https://huggingface.co/papers/2608.27763", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u6307\u51fa\u524d\u7f00\u9884\u6d4b\u4e0b\u6b63\u786e\u7684\u672c\u5730\u8bb0\u5fc6\u6837\u672c\u5e94\u4e3a\u524d\u7f00\u5bf9\u9f50\u7684 $(\u03c6(k_{t-1}), v_t)$\uff0c\u800c\u5e38\u89c1\u7684\u540c\u4e00\u6b65\u5173\u8054 $(\u03c6(k_t), v_t)$ \u5b9e\u9645\u4f18\u5316\u4e0d\u540c\u5185\u90e8\u76ee\u6807\u3002", "\u63d0\u51fa\u57fa\u4e8e\u5e73\u65b9\u8bef\u5dee\u56de\u5f52\u548c\u8d1f\u5185\u79ef\u76ee\u6807\u7684\u5f52\u4e00\u5316\u4e00\u9636\u66f4\u65b0\uff0c\u5305\u62ec\u6807\u91cf NLMS\u3001\u9010\u5217\u6269\u5c55\u548c\u6ed1\u52a8\u7a97 0c\u5bf9\u957f\u4e0a\u4e0b\u6587\u5efa\u6a21\u548c\u6301\u7eed\u5b66\u4e60\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Scaling video generation to long durations reveals a critical bottleneck: current models lack robust long-term memory. This deficiency can be studied along two critical aspects: object permanence, the ability to precisely reproduce the appearance of objects upon re-entry; and memory capacity, the ability to process ultra-long context and use information from distant history. Robust long-term memory requires both: object permanence without sufficient context handling limits the temporal scope, while long context length without permanence fails to maintain identity. To address this, we present Ring Forcing, an autoregressive video diffusion framework designed to robustly construct and precisely utilize long-term memory. Our ring-structured training strategy enforces retrieval from distant history, effectively reconciling the trade-off between strict historical adherence and generative diversity. To expand memory capacity, we introduce a compression and timestep composition strategy. Under fixed sequence length constraints, this method extends the effective historical span to minutes-long durations and achieves a comprehensive receptive field over the entire history. Furthermore, we present a sparse RoPE mechanism to enable flexible, scalable memory adaptation while fully exploiting pre-trained priors. Extensive experiments demonstrate that Ring Forcing achieves superior minutes-long coherence and object permanence, significantly outperforming state-of-the-art methods.", "arxiv_id": "2608.26794", "arxiv_url": "https://arxiv.org/abs/2608.26794", "authors": ["Bowen Xue", "Brandon Y. Feng", "Chenguo Lin", "Yuchen Lin", "Yujia Zeng", "Lvmin Zhang", "Maneesh Agrawala", "Honglei Yan", "Panwang Pan"], "brief": "\u8bba\u6587\u63d0\u51fa Ring Forcing\uff0c\u4e00\u79cd\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u5206\u949f\u7ea7\u957f\u89c6\u9891\u751f\u6210\u4e2d\u6784\u5efa\u5e76\u7cbe\u786e\u5229\u7528\u957f\u671f\u8bb0\u5fc6\u3002\u5b83\u91cd\u70b9\u89e3\u51b3\u7269\u4f53\u91cd\u73b0\u65f6\u5916\u89c2\u4e00\u81f4\u7684\u201c\u7269\u4f53\u6052\u5b58\u201d\u548c\u8d85\u957f\u5386\u53f2\u4e0a\u4e0b\u6587\u5229\u7528\u7684\u201c\u8bb0\u5fc6\u5bb9\u91cf\u201d\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.26794", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u73af\u5f62\u7ed3\u6784\u8bad\u7ec3\u5f3a\u5236\u6a21\u578b\u4ece\u9065\u8fdc\u5386\u53f2\u4e2d\u68c0\u7d22\u4fe1\u606f\uff0c\u517c\u987e\u5386\u53f2\u4e00\u81f4\u6027\u4e0e\u751f\u6210\u591a\u6837\u6027\u3002", "\u538b\u7f29\u4e0e\u65f6\u95f4\u6b65\u7ec4\u5408\u7b56\u7565\u5728\u56fa\u5b9a\u5e8f\u5217\u957f\u5ea6\u4e0b\u6269\u5c55\u6709\u6548\u5386\u53f2\u8303\u56f4\uff0c\u5b9e\u73b0\u5bf9\u5b8c\u6574\u5386\u53f2\u7684\u7efc\u5408\u611f\u53d7\u91ce\u3002", "\u7a00\u758f RoPE \u673a\u5236\u652f\u6301\u7075\u6d3b\u3001\u53ef\u6269\u5c55\u7684\u8bb0\u5fc6\u9002\u914d\uff0c\u540c\u65f6\u5229\u7528\u9884\u8bad\u7ec3\u6a21\u578b\u7684\u5148\u9a8c\u80fd\u529b\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u957f\u671f\u8bb0\u5fc6", "\u4f4d\u7f6e\u7f16\u7801"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26794v1", "published_at": "2026-08-27", "score": 0.274, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26794.png", "title": "Ring Forcing: Towards Precise Long-Term Memory for Autoregressive Video Diffusion", "tldr": "\u63d0\u5347\u957f\u89c6\u9891\u751f\u6210\u7684\u957f\u671f\u8bb0\u5fc6\u4e0e\u7269\u4f53\u4e00\u81f4\u6027", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa Ring Forcing\uff0c\u4e00\u79cd\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6846\u67b6\uff0c\u7528\u4e8e\u5728\u5206\u949f\u7ea7\u957f\u89c6\u9891\u751f\u6210\u4e2d\u6784\u5efa\u5e76\u7cbe\u786e\u5229\u7528\u957f\u671f\u8bb0\u5fc6\u3002\u5b83\u91cd\u70b9\u89e3\u51b3\u7269\u4f53\u91cd\u73b0\u65f6\u5916\u89c2\u4e00\u81f4\u7684\u201c\u7269\u4f53\u6052\u5b58\u201d\u548c\u8d85\u957f\u5386\u53f2\u4e0a\u4e0b\u6587\u5229\u7528\u7684\u201c\u8bb0\u5fc6\u5bb9\u91cf\u201d\u95ee\u9898\u3002", "why_notable": "\u957f\u89c6\u9891\u751f\u6210\u7684\u6838\u5fc3\u74f6\u9888\u4e4b\u4e00\u662f\u8de8\u5206\u949f\u7ea7\u65f6\u95f4\u4fdd\u6301\u89d2\u8272\u3001\u7269\u4f53\u548c\u573a\u666f\u4e00\u81f4\u6027\uff1b\u8be5\u65b9\u6cd5\u540c\u65f6\u589e\u5f3a\u957f\u671f\u4e0a\u4e0b\u6587\u5bb9\u91cf\u548c\u7269\u4f53\u6052\u5b58\u80fd\u529b\uff0c\u5728\u957f\u65f6\u4e00\u81f4\u6027\u4e0a\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Recent generative approaches to geometry estimation adapt pretrained image diffusion models and treat the task as image-conditioned generation. Leveraging off-the-shelf image diffusion models, they either (i) train task-specific geometry models (for depth and surface normal estimation) independently, losing the opportunity of exploring the intrinsic correlation of these geometric targets, or (ii) jointly fine-tune modified image diffusion backbones (e.g., altered self-attention), which typically demands substantial labeled data. To overcome these limitations in a principled fashion, we repurpose pretrained video generative models as a unified and data-efficient framework for geometry estimation, formulated innovatively as a next-frames prediction task. Our method, GeoNeXt, inherits naturally structured knowledge and richer priors from the video model, while further adapting them for joint modeling of images and geometry targets (image \u003c-\u003e geometry), enabling more data efficient and effective learning of geometry. Extensive experiments validate our method for zero-shot monocular depth and surface normal estimation across diverse datasets, outperforming both previous task-specific and unified generative competitors while using substantially less training data. Notably, our method rivals discriminative state-of-the-art approaches trained on over 100x more data and even standouts on several benchmarks.", "arxiv_id": "2608.28549", "arxiv_url": "https://arxiv.org/abs/2608.28549", "authors": ["Haosen Yang", "Jifei Song", "Zhensong Zhang", "Xiatian Zhu", "Jiankang Deng"], "brief": "\u8bba\u6587\u63d0\u51fa GeoNeXt\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u6539\u9020\u4e3a\u51e0\u4f55\u5b66\u4e60\u5668\uff0c\u628a\u5355\u76ee\u6df1\u5ea6\u4e0e\u8868\u9762\u6cd5\u7ebf\u4f30\u8ba1\u8868\u8ff0\u4e3a\u201c\u4e0b\u4e00\u5e27\u9884\u6d4b\u201d\u4efb\u52a1\u3002\u8be5\u65b9\u6cd5\u8054\u5408\u5efa\u6a21\u56fe\u50cf\u4e0e\u51e0\u4f55\u76ee\u6807\uff0c\u5728\u5c11\u91cf\u6807\u6ce8\u6570\u636e\u4e0b\u5b9e\u73b0\u96f6\u6837\u672c\u51e0\u4f55\u4f30\u8ba1\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28549", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5229\u7528\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u65f6\u7a7a\u7ed3\u6784\u5148\u9a8c\uff0c\u800c\u975e\u5355\u72ec\u8bad\u7ec3\u6df1\u5ea6/\u6cd5\u7ebf\u6269\u6563\u6a21\u578b\u3002", "\u901a\u8fc7 image \u2194 geometry \u7684\u8054\u5408\u5efa\u6a21\uff0c\u6316\u6398\u6df1\u5ea6\u4e0e\u8868\u9762\u6cd5\u7ebf\u7b49\u51e0\u4f55\u76ee\u6807\u4e4b\u95f4\u7684\u5185\u5728\u76f8\u5173\u6027\u3002", "\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u96f6\u6837\u672c\u5355\u76ee\u6df1\u5ea6\u548c\u8868\u9762\u6cd5\u7ebf\u4f30\u8ba1\u4f18\u4e8e\u65e2\u6709\u751f\u6210\u5f0f\u65b9\u6cd5\uff0c\u5e76\u63a5\u8fd1\u6216\u8d85\u8fc7\u4f7f\u7528\u767e\u500d\u6570\u636e\u8bad\u7ec3\u7684\u5224\u522b\u5f0f SOTA\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u51e0\u4f55\u4f30\u8ba1", "\u6269\u6563\u6a21\u578b", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28549v1", "published_at": "2026-08-28", "score": 0.271, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28549.png", "title": "Video Generative Models as Geometry Learner", "tldr": "\u7528\u89c6\u9891\u751f\u6210\u6a21\u578b\u7edf\u4e00\u9ad8\u6548\u4f30\u8ba1\u51e0\u4f55\u3002", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa GeoNeXt\uff0c\u5c06\u9884\u8bad\u7ec3\u89c6\u9891\u751f\u6210\u6a21\u578b\u6539\u9020\u4e3a\u51e0\u4f55\u5b66\u4e60\u5668\uff0c\u628a\u5355\u76ee\u6df1\u5ea6\u4e0e\u8868\u9762\u6cd5\u7ebf\u4f30\u8ba1\u8868\u8ff0\u4e3a\u201c\u4e0b\u4e00\u5e27\u9884\u6d4b\u201d\u4efb\u52a1\u3002\u8be5\u65b9\u6cd5\u8054\u5408\u5efa\u6a21\u56fe\u50cf\u4e0e\u51e0\u4f55\u76ee\u6807\uff0c\u5728\u5c11\u91cf\u6807\u6ce8\u6570\u636e\u4e0b\u5b9e\u73b0\u96f6\u6837\u672c\u51e0\u4f55\u4f30\u8ba1\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c55\u793a\u4e86\u89c6\u9891\u751f\u6210\u6a21\u578b\u4e0d\u4ec5\u80fd\u751f\u6210\u89c6\u9891\uff0c\u8fd8\u53ef\u4f5c\u4e3a\u5f3a\u51e0\u4f55\u5148\u9a8c\u8fc1\u79fb\u5230\u89c6\u89c9\u7406\u89e3\u4efb\u52a1\uff0c\u663e\u8457\u964d\u4f4e\u51e0\u4f55\u4f30\u8ba1\u5bf9\u5927\u89c4\u6a21\u6807\u6ce8\u6570\u636e\u7684\u4f9d\u8d56\u3002"}, {"abstract": "Interactive web application generation requires models to produce usable HTML, CSS, and JavaScript applications from natural language requests. Unlike conventional code generation, application quality depends on multiple user-facing functional requirements, each often tied to localized code regions such as event handlers, state updates, DOM fragments, or CSS selectors. Standard GRPO collapses these structured outcomes into a single sequence-level reward and applies the resulting advantage uniformly to all tokens, weakening credit assignment. We propose \\textbf{Rubric-to-Code Credit Assignment} (RCCA), a reinforcement learning framework that converts rubric-level functional feedback into localized optimization signals over generated code. RCCA builds training tasks around explicit functional rubrics, uses a hierarchical reward to separate format, source-code, runtime, and functional failures, and aligns evaluator-generated textual attributions with responsible code spans and generated tokens. The resulting model, \\textbf{Ling-RCCA-Flash}, scores 41.25 on MiniAppBench, improving Ling-3.0-Flash by 32.20 points and slightly surpassing Claude Opus 4.5. It also reaches 76.19 on ArtifactsBench, improving the SFT model by 4.48 points and establishing a new top score under the official ArtifactsBench leaderboard setting by surpassing the GPT-5 score by 3.64 points, suggesting transferable implementation-level gains.", "arxiv_id": "2608.27906", "arxiv_url": "https://arxiv.org/abs/2608.27906", "authors": ["Rui Jin", "Jikai Chen", "Yihan Chen", "Hao Zhou", "Demin Zhu", "Kaichen Yang", "Dong Wang", "Linjian Mo", "Chenyi Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa Rubric-to-Code Credit Assignment\uff08RCCA\uff09\uff0c\u628a\u9762\u5411\u7528\u6237\u529f\u80fd\u9700\u6c42\u7684 rubric \u53cd\u9988\u8f6c\u5316\u4e3a\u4ee3\u7801\u5c40\u90e8\u4f18\u5316\u4fe1\u53f7\uff0c\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u7f51\u9875\u5e94\u7528\u751f\u6210\u6a21\u578b\u3002\u5176\u6a21\u578b Ling-RCCA-Flash \u5728 MiniAppBench \u548c ArtifactsBench \u4e0a\u53d6\u5f97\u663e\u8457\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.27906", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u9488\u5bf9\u6807\u51c6 GRPO \u5c06\u591a\u9879\u529f\u80fd\u53cd\u9988\u538b\u7f29\u4e3a\u5355\u4e00\u5e8f\u5217\u5956\u52b1\u3001\u5bfc\u81f4 token \u7ea7\u4fe1\u7528\u5206\u914d\u7c97\u7cd9\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5c40\u90e8\u5316 credit assignment\u3002", "\u8bbe\u8ba1\u5206\u5c42\u5956\u52b1\u673a\u5236\uff0c\u533a\u5206\u683c\u5f0f\u3001\u6e90\u7801\u3001\u8fd0\u884c\u65f6\u548c\u529f\u80fd\u6027\u5931\u8d25\uff0c\u63d0\u5347\u8bad\u7ec3\u4fe1\u53f7\u7684\u53ef\u89e3\u91ca\u6027\u4e0e\u7cbe\u5ea6\u3002", "\u5229\u7528\u8bc4\u6d4b\u5668\u751f\u6210\u7684\u6587\u672c\u5f52\u56e0\uff0c\u5c06\u529f\u80fd rubric \u5bf9\u5e94\u5230\u8d23\u4efb\u4ee3\u7801\u7247\u6bb5\u4e0e\u751f\u6210 token\uff0c\u5728 MiniAppBench \u5f97\u5206 41.25\uff0c\u8f83 Ling-3.0-Flash \u63d0\u5347 32.20 \u5206\u3002"], "keywords": ["\u4ee3\u7801\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u4fe1\u7528\u5206\u914d", "\u7f51\u9875\u5e94\u7528"], "num_comments": 1, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2608.27906v2", "published_at": "2026-08-28", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27906.png", "title": "Rubric-to-Code Credit Assignment for Reinforcement Learning", "tldr": "\u5c06\u529f\u80fd\u8bc4\u5206\u5b9a\u4f4d\u5230\u4ee3\u7801\u7247\u6bb5\u4ee5\u6539\u8fdbRL\u8bad\u7ec3", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Rubric-to-Code Credit Assignment\uff08RCCA\uff09\uff0c\u628a\u9762\u5411\u7528\u6237\u529f\u80fd\u9700\u6c42\u7684 rubric \u53cd\u9988\u8f6c\u5316\u4e3a\u4ee3\u7801\u5c40\u90e8\u4f18\u5316\u4fe1\u53f7\uff0c\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u7f51\u9875\u5e94\u7528\u751f\u6210\u6a21\u578b\u3002\u5176\u6a21\u578b Ling-RCCA-Flash \u5728 MiniAppBench \u548c ArtifactsBench \u4e0a\u53d6\u5f97\u663e\u8457\u63d0\u5347\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u81ea\u7136\u8bed\u8a00\u529f\u80fd\u8bc4\u6d4b\u53cd\u9988\u7ec6\u5316\u5230\u5177\u4f53\u4ee3\u7801\u533a\u57df\uff0c\u4e3a\u590d\u6742\u524d\u7aef\u5e94\u7528\u751f\u6210\u4e2d\u7684\u5f3a\u5316\u5b66\u4e60\u63d0\u4f9b\u66f4\u7cbe\u51c6\u7684\u4f18\u5316\u4fe1\u53f7\uff1b\u5728\u591a\u4e2a\u57fa\u51c6\u4e0a\u8d85\u8fc7\u5f3a\u6a21\u578b\u548c\u6392\u884c\u699c\u6210\u7ee9\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Outdoor LiDAR semantic scene completion (SSC) recovers a dense semantic voxel grid from a scan observing 1% of the target volume, under class imbalance beyond 7,000x. We recast SSC as generative semantic scene completion (GSSC): a single discrete-diffusion formulation in three roles. First, paired sparse-dense scene synthesis (PS$^3$) generates matched sparse LiDAR observations with their dense semantic completions, addressing the long tail at its source and yielding the PS$^3$-SemanticKITTI corpus we train on alongside SemanticKITTI. Second, semantic-guided generative scene completion (SGSC) generates the scene from noise with multinomial discrete diffusion, conditioned on the sparse scan through a bird\u0027s-eye-view semantic map and a sparse 3D feature stream. Third, the same framework instead refines an existing completion in one flow-matching step: structured source discrete diffusion (S$^2$D$^2$). S$^2$D$^2$ improves the mIoU of SGSC\u0027s own output and every external SSC base tested, without base retraining or test-time adaptation. On the strongest base, one step without test-time augmentation reaches 38.8% mIoU on the SemanticKITTI hidden test. To our knowledge that is the best causal, single-sweep, single-sample result on that leaderboard, +2.1 pp over the previous best published score under the same restriction. Four correction steps with eight-view test-time augmentation reach 39.2%, outside that restriction.", "arxiv_id": "2608.26737", "arxiv_url": "https://arxiv.org/abs/2608.26737", "authors": ["Shi Chen", "Weifeng Ge"], "brief": "\u8bba\u6587\u5c06\u6237\u5916LiDAR\u8bed\u4e49\u573a\u666f\u8865\u5168\u91cd\u6784\u4e3a\u751f\u6210\u5f0f\u8bed\u4e49\u573a\u666f\u8865\u5168\uff08GSSC\uff09\u3002\u5b83\u540c\u65f6\u63d0\u51fa\u7a00\u758f-\u7a20\u5bc6\u914d\u5bf9\u6570\u636e\u5408\u6210\u3001\u6761\u4ef6\u79bb\u6563\u6269\u6563\u8865\u5168\uff0c\u4ee5\u53ca\u65e0\u9700\u91cd\u8bad\u7684\u4e00\u6b65\u6d41\u5339\u914d\u5f0f\u7ed3\u679c\u4fee\u6b63\u6846\u67b6\u3002", "categories": ["cs.CV", "cs.LG", "cs.RO"], "github_repo": "https://github.com/BillyChern/GSSC-S2D2", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.26737", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51faPS\u00b3\u751f\u6210\u5339\u914d\u7684\u7a00\u758fLiDAR\u89c2\u6d4b\u4e0e\u7a20\u5bc6\u8bed\u4e49\u8865\u5168\uff0c\u7f13\u89e3SSC\u4e2d\u6781\u7aef\u957f\u5c3e\u4e0e\u7c7b\u522b\u4e0d\u5e73\u8861\u95ee\u9898\uff0c\u5e76\u6784\u5efaPS\u00b3-SemanticKITTI\u6570\u636e\u96c6\u3002", "\u63d0\u51faSGSC\uff0c\u7528\u591a\u9879\u5f0f\u79bb\u6563\u6269\u6563\u4ece\u566a\u58f0\u751f\u6210\u8bed\u4e49\u4f53\u7d20\u573a\u666f\uff0c\u5e76\u901a\u8fc7BEV\u8bed\u4e49\u56fe\u548c\u7a00\u758f3D\u7279\u5f81\u6d41\u5bf9\u7a00\u758f\u626b\u63cf\u8fdb\u884c\u6761\u4ef6\u7ea6\u675f\u3002", "\u63d0\u51faS\u00b2D\u00b2\uff0c\u53ef\u5728\u4e00\u6b65\u6d41\u5339\u914d\u4e2d\u4fee\u6b63\u5df2\u6709\u8865\u5168\u7ed3\u679c\uff0c\u5bf9SGSC\u548c\u5916\u90e8SSC\u6a21\u578b\u5747\u63d0\u5347mIoU\uff0c\u4e14\u65e0\u9700\u57fa\u6a21\u578b\u91cd\u8bad\u6216\u6d4b\u8bd5\u65f6\u9002\u914d\u3002"], "keywords": ["\u8bed\u4e49\u573a\u666f\u8865\u5168", "\u79bb\u6563\u6269\u6563", "\u4e09\u7ef4\u611f\u77e5", "\u81ea\u52a8\u9a7e\u9a76"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26737v1", "published_at": "2026-08-27", "score": 0.25, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26737.png", "title": "Generative Semantic Scene Completion", "tldr": "\u7528\u79bb\u6563\u6269\u6563\u751f\u6210\u4e0e\u4fee\u6b63LiDAR\u8bed\u4e49\u573a\u666f\u8865\u5168", "upvotes": 2, "what_it_is": "\u8bba\u6587\u5c06\u6237\u5916LiDAR\u8bed\u4e49\u573a\u666f\u8865\u5168\u91cd\u6784\u4e3a\u751f\u6210\u5f0f\u8bed\u4e49\u573a\u666f\u8865\u5168\uff08GSSC\uff09\u3002\u5b83\u540c\u65f6\u63d0\u51fa\u7a00\u758f-\u7a20\u5bc6\u914d\u5bf9\u6570\u636e\u5408\u6210\u3001\u6761\u4ef6\u79bb\u6563\u6269\u6563\u8865\u5168\uff0c\u4ee5\u53ca\u65e0\u9700\u91cd\u8bad\u7684\u4e00\u6b65\u6d41\u5339\u914d\u5f0f\u7ed3\u679c\u4fee\u6b63\u6846\u67b6\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u6570\u636e\u751f\u6210\u3001\u573a\u666f\u751f\u6210\u548c\u540e\u5904\u7406\u4fee\u6b63\u7edf\u4e00\u5230\u79bb\u6563\u6269\u6563\u6846\u67b6\u4e2d\uff0c\u5728SemanticKITTI\u9690\u85cf\u6d4b\u8bd5\u96c6\u4e0a\u8fbe\u523038.8% mIoU\uff0c\u5237\u65b0\u56e0\u679c\u3001\u5355\u5e27\u3001\u5355\u6837\u672c\u8bbe\u7f6e\u4e0b\u7684\u5df2\u53d1\u8868\u6700\u4f73\u7ed3\u679c\uff0c\u5177\u5907\u8f83\u5f3a\u81ea\u52a8\u9a7e\u9a76\u4e09\u7ef4\u611f\u77e5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generative vision-language models (VLMs) are increasingly used in human-centered settings, yet they can produce demographically biased outputs even when images differ only in controlled attributes such as perceived race or gender. However, existing inference-time debiasers were largely designed for static embeddings or CLIP-like models rather than generative VLMs. We propose GGSS---Geodesic-Gated Spherical Steering---a norm-preserving intervention that discovers a counterfactual bias subspace on the unit hypersphere, steers visual tokens along geodesic arcs, and uses an adaptive gate to focus correction on tokens that carry stronger demographic signal. We evaluate four generative VLMs against ten adapted inference-time debiasing baselines and prompt-based mitigation under a single operating-point protocol across categorical, pairwise, and occupation-gender bias tests, while also measuring general visual-language capability. GGSS achieves the lowest average bias on all four models, significant on three of four backbones under paired permutation tests, while preserving MMStar accuracy within +/- 0.6 p.p. of the unsteered baseline. Code is available at https://github.com/dukesun99/GGSS.", "arxiv_id": "2608.25375", "arxiv_url": "https://arxiv.org/abs/2608.25375", "authors": ["Yiqun Sun", "Junyu Chen", "Pengfei Wei", "Lawrence B. Hsieh"], "brief": "\u8bba\u6587\u63d0\u51fa GGSS\uff0c\u4e00\u79cd\u9762\u5411\u751f\u6210\u5f0f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u7406\u65f6\u53bb\u504f\u65b9\u6cd5\u3002\u5b83\u5728\u5355\u4f4d\u8d85\u7403\u9762\u4e0a\u53d1\u73b0\u53cd\u4e8b\u5b9e\u504f\u89c1\u5b50\u7a7a\u95f4\uff0c\u5e76\u5bf9\u89c6\u89c9 token \u8fdb\u884c\u4fdd\u8303\u6570\u7684\u6d4b\u5730\u7ebf\u8f6c\u5411\uff0c\u4ee5\u51cf\u5c11\u79cd\u65cf\u3001\u6027\u522b\u7b49\u4eba\u53e3\u5c5e\u6027\u504f\u5dee\u3002", "categories": ["cs.CY", "cs.CL", "cs.CV"], "github_repo": "https://github.com/dukesun99/GGSS", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.25375", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6784\u5efa\u201c\u53cd\u4e8b\u5b9e\u504f\u89c1\u5b50\u7a7a\u95f4\u201d\uff0c\u5728\u5355\u4f4d\u8d85\u7403\u9762\u4e0a\u6cbf\u6d4b\u5730\u5f27\u8c03\u6574\u89c6\u89c9 token\uff0c\u907f\u514d\u7834\u574f\u8868\u793a\u8303\u6570\u7ed3\u6784", "\u5f15\u5165\u81ea\u9002\u5e94\u95e8\u63a7\u673a\u5236\uff0c\u4f18\u5148\u4fee\u6b63\u643a\u5e26\u66f4\u5f3a\u4eba\u53e3\u5c5e\u6027\u4fe1\u53f7\u7684 token", "\u57284\u4e2a\u751f\u6210\u5f0fVLM\u300110\u4e2a\u63a8\u7406\u65f6\u53bb\u504f\u57fa\u7ebf\u53ca\u63d0\u793a\u7f13\u89e3\u65b9\u6cd5\u4e0a\u8bc4\u6d4b\uff0cGGSS\u5728\u6240\u6709\u6a21\u578b\u4e0a\u5e73\u5747\u504f\u89c1\u6700\u4f4e\uff0c\u4e14MMStar\u80fd\u529b\u51e0\u4e4e\u4e0d\u964d"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u516c\u5e73\u6027", "\u63a8\u7406\u65f6\u5e72\u9884", "\u8868\u793a\u7f16\u8f91"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.25375v1", "published_at": "2026-08-26", "score": 0.249, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25375.png", "title": "GGSS: Geodesic-Gated Spherical Steering for Inference-Time Debiasing of Generative Vision-Language Models", "tldr": "\u7528\u7403\u9762\u6d4b\u5730\u8f6c\u5411\u964d\u4f4e\u751f\u6210\u5f0fVLM\u504f\u89c1", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa GGSS\uff0c\u4e00\u79cd\u9762\u5411\u751f\u6210\u5f0f\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7684\u63a8\u7406\u65f6\u53bb\u504f\u65b9\u6cd5\u3002\u5b83\u5728\u5355\u4f4d\u8d85\u7403\u9762\u4e0a\u53d1\u73b0\u53cd\u4e8b\u5b9e\u504f\u89c1\u5b50\u7a7a\u95f4\uff0c\u5e76\u5bf9\u89c6\u89c9 token \u8fdb\u884c\u4fdd\u8303\u6570\u7684\u6d4b\u5730\u7ebf\u8f6c\u5411\uff0c\u4ee5\u51cf\u5c11\u79cd\u65cf\u3001\u6027\u522b\u7b49\u4eba\u53e3\u5c5e\u6027\u504f\u5dee\u3002", "why_notable": "\u73b0\u6709\u63a8\u7406\u65f6\u53bb\u504f\u591a\u9488\u5bf9\u9759\u6001\u5d4c\u5165\u6216CLIP\u5f0f\u6a21\u578b\uff0cGGSS\u76f4\u63a5\u9762\u5411\u751f\u6210\u5f0fVLM\uff0c\u5728\u65e0\u9700\u8bad\u7ec3\u6a21\u578b\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u964d\u4f4e\u504f\u89c1\u5e76\u4fdd\u6301\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u80fd\u529b\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Extractive prompt compression promises to cut LLM inference costs by removing low-information tokens, and learned compressors such as LLMLingua-2 report strong results on English benchmarks. Most other languages already pay a token premium: the same content costs 1.3-1.8x more tokens than in English. We ask whether compression closes or widens this gap. Using fully parallel data in ten languages spanning five scripts, with controls budget-matched in the target model\u0027s tokenizer, we audit four learned compressors against four deterministic baselines, on eleven target models from ten vendors (over 250,000 evaluation calls). Three of the compressors are trained with English supervision (LLMLingua-2 XLM-R/mBERT; Kompress-v2 from the production Headroom stack); the fourth, XProvence, is trained multilingually. First, the transfer gap is real, replicates across target models and compressor backbones, and is strongly rate-dependent: at a 0.33 keep-rate English retains 57-62% of normalized context utilization while Lithuanian retains 10-24% and Chinese essentially none, despite Chinese having the smallest token premium. Second, the gap tracks compression supervision data, not architecture. All three English-trained compressors show it, deterministic methods show no comparable gap, and the multilingually trained XProvence v1 shows none. Its v2 release, retrained on translated data, empties 92% of Chinese contexts at its aggressive threshold without any warning. Third, in a harder long-context setting, aggressive learned compression drives compressed contexts to or below no-context utility in three of five non-English languages. A translate-then-compress pipeline matches or beats native compression at roughly half the token cost in three of five tested languages. We release all code, compressions, and model outputs. Safe compression budgets are much smaller outside English.", "arxiv_id": "2608.26175", "arxiv_url": "https://arxiv.org/abs/2608.26175", "authors": ["Mantas Lukauskas"], "brief": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u62bd\u53d6\u5f0f\u63d0\u793a\u538b\u7f29\u5668\u572810\u79cd\u8bed\u8a00\u300111\u4e2a\u76ee\u6807\u6a21\u578b\u4e0a\u7684\u8de8\u8bed\u79cd\u8868\u73b0\uff0c\u6bd4\u8f83LLMLingua-2\u3001Kompress-v2\u3001XProvence\u7b49\u5b66\u4e60\u5f0f\u65b9\u6cd5\u4e0e\u786e\u5b9a\u6027\u57fa\u7ebf\u3002\u7814\u7a76\u53d1\u73b0\u82f1\u6587\u76d1\u7763\u8bad\u7ec3\u7684\u538b\u7f29\u5668\u5b58\u5728\u663e\u8457\u8de8\u8bed\u79cd\u8fc1\u79fb\u7f3a\u53e3\uff0c\u975e\u82f1\u8bed\u5b89\u5168\u538b\u7f29\u9884\u7b97\u8fdc\u5c0f\u4e8e\u82f1\u8bed\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/MantasLukauskas/lost-in-compression", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.26175", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u57280.33\u4fdd\u7559\u7387\u4e0b\uff0c\u82f1\u8bed\u4ecd\u4fdd\u755957-62%\u7684\u5f52\u4e00\u5316\u4e0a\u4e0b\u6587\u5229\u7528\u7387\uff0c\u800c\u7acb\u9676\u5b9b\u8bed\u4ec510-24%\uff0c\u4e2d\u6587\u51e0\u4e4e\u4e3a\u96f6\u3002", "\u6027\u80fd\u5dee\u8ddd\u4e3b\u8981\u6765\u81ea\u538b\u7f29\u5668\u76d1\u7763\u6570\u636e\u800c\u975e\u6a21\u578b\u67b6\u6784\uff1a\u82f1\u6587\u8bad\u7ec3\u538b\u7f29\u5668\u666e\u904d\u5931\u6548\uff0c\u591a\u8bed\u8bad\u7ec3\u7684XProvence v1\u65e0\u660e\u663e\u5dee\u8ddd\u3002", "\u957f\u4e0a\u4e0b\u6587\u4efb\u52a1\u4e2d\uff0c\u6fc0\u8fdb\u5b66\u4e60\u5f0f\u538b\u7f29\u4f1a\u8ba9\u90e8\u5206\u975e\u82f1\u8bed\u8bed\u8a00\u9000\u5316\u5230\u63a5\u8fd1\u6216\u4f4e\u4e8e\u65e0\u4e0a\u4e0b\u6587\u6548\u679c\uff1b\u7ffb\u8bd1\u540e\u538b\u7f29\u5728\u90e8\u5206\u8bed\u8a00\u4e0a\u4ee5\u7ea6\u4e00\u534a\u6210\u672c\u8fbe\u5230\u6216\u8d85\u8fc7\u539f\u751f\u538b\u7f29\u3002"], "keywords": ["\u63d0\u793a\u538b\u7f29", "\u591a\u8bed\u8a00", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.26175v1", "published_at": "2026-07-27", "score": 0.242, "selected_reasons": ["HF trending (2\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26175.png", "title": "Lost in Compression: A Controlled Cross-Lingual Audit of Extractive Prompt Compressors", "tldr": "\u8de8\u8bed\u79cd\u5ba1\u8ba1\u53d1\u73b0\u82f1\u6587\u8bad\u7ec3\u538b\u7f29\u5668\u4e25\u91cd\u4f24\u5bb3\u975e\u82f1\u8bed\u4e0a\u4e0b\u6587\u3002", "upvotes": 2, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u8bc4\u4f30\u62bd\u53d6\u5f0f\u63d0\u793a\u538b\u7f29\u5668\u572810\u79cd\u8bed\u8a00\u300111\u4e2a\u76ee\u6807\u6a21\u578b\u4e0a\u7684\u8de8\u8bed\u79cd\u8868\u73b0\uff0c\u6bd4\u8f83LLMLingua-2\u3001Kompress-v2\u3001XProvence\u7b49\u5b66\u4e60\u5f0f\u65b9\u6cd5\u4e0e\u786e\u5b9a\u6027\u57fa\u7ebf\u3002\u7814\u7a76\u53d1\u73b0\u82f1\u6587\u76d1\u7763\u8bad\u7ec3\u7684\u538b\u7f29\u5668\u5b58\u5728\u663e\u8457\u8de8\u8bed\u79cd\u8fc1\u79fb\u7f3a\u53e3\uff0c\u975e\u82f1\u8bed\u5b89\u5168\u538b\u7f29\u9884\u7b97\u8fdc\u5c0f\u4e8e\u82f1\u8bed\u3002", "why_notable": "\u8bba\u6587\u63ed\u793a\u4e86\u63d0\u793a\u538b\u7f29\u5728\u591a\u8bed\u8a00\u573a\u666f\u4e2d\u7684\u7cfb\u7edf\u6027\u98ce\u9669\uff1a\u770b\u4f3c\u8282\u7701\u6210\u672c\u7684\u82f1\u6587\u57fa\u51c6\u65b9\u6cd5\u53ef\u80fd\u663e\u8457\u635f\u5bb3\u975e\u82f1\u8bed\u7528\u6237\u6548\u679c\uff0c\u5bf9\u591a\u8bed\u8a00LLM\u90e8\u7f72\u3001\u6210\u672c\u4f18\u5316\u548c\u5b89\u5168\u538b\u7f29\u7b56\u7565\u5177\u6709\u76f4\u63a5\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "The alignment of Large Language Models heavily relies on English-centric high-quality preference data, which often leads to suboptimal performance in other languages. In this paper, we propose Cross-lingual Ranking Preference Optimization~(CRPO), a novel framework that leverages robust preference knowledge from English to facilitate preference alignment in the target language. We design a hierarchical structure within parallel preference pairs across the target language and English to jointly optimize intra- and inter-lingual preferences, thereby enhancing language adaptation and output quality. Building on the LambdaLoss framework, CRPO goes beyond the binary comparison based optimization by providing a relative ranking signal across multiple candidate responses. Our experiments across five languages with varying resource scales demonstrate that CRPO consistently outperforms standard approaches in both instruction-following and knowledge utilization capability. Notably, the robust performance gains observed across various weighting schemes further validate the empirical effectiveness of our hierarchical design in a multilingual setup. Furthermore, our findings highlight that CRPO significantly improves both reward margins and the log-probability of desirable responses, contributing to a more stable preference manifold for cross-lingual alignment. Our code is available at https://github.com/dltmddbs100/CRPO.", "arxiv_id": "2608.23149", "arxiv_url": "https://arxiv.org/abs/2608.23149", "authors": ["Seungyoon Lee", "Minhyuk Kim", "Jungseob Lee", "Heuiseok Lim"], "brief": "\u672c\u6587\u63d0\u51fa\u8de8\u8bed\u8a00\u6392\u5e8f\u504f\u597d\u4f18\u5316\uff08CRPO\uff09\uff0c\u5c06\u82f1\u8bed\u4e2d\u7684\u9ad8\u8d28\u91cf\u504f\u597d\u77e5\u8bc6\u8fc1\u79fb\u5230\u76ee\u6807\u8bed\u8a00\u3002\u5b83\u901a\u8fc7\u5e76\u884c\u504f\u597d\u6837\u672c\u7684\u5c42\u7ea7\u7ed3\u6784\uff0c\u8054\u5408\u4f18\u5316\u540c\u8bed\u8a00\u4e0e\u8de8\u8bed\u8a00\u504f\u597d\u5173\u7cfb\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/dltmddbs100/CRPO", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23149", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u4e8e LambdaLoss\uff0c\u4ece\u4e8c\u5143\u504f\u597d\u6bd4\u8f83\u6269\u5c55\u5230\u591a\u5019\u9009\u56de\u7b54\u7684\u76f8\u5bf9\u6392\u5e8f\u4fe1\u53f7", "\u5728\u76ee\u6807\u8bed\u8a00\u4e0e\u82f1\u8bed\u7684\u5e76\u884c\u504f\u597d\u5bf9\u4e2d\u5efa\u6a21 intra-lingual \u4e0e inter-lingual preferences", "\u5728\u4e94\u79cd\u4e0d\u540c\u8d44\u6e90\u6c34\u5e73\u8bed\u8a00\u4e0a\uff0c\u63d0\u5347\u6307\u4ee4\u9075\u5faa\u4e0e\u77e5\u8bc6\u5229\u7528\u80fd\u529b\uff0c\u5e76\u6539\u5584 reward margin \u4e0e\u4f18\u8d28\u56de\u7b54 log-probability"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u504f\u597d\u4f18\u5316", "\u8de8\u8bed\u8a00\u5bf9\u9f50", "\u591a\u8bed\u8a00"], "num_comments": 2, "on_hf": true, "organization": "NLP \u0026 AI - Korea University", "pdf_url": "https://arxiv.org/pdf/2608.23149v2", "published_at": "2026-08-24", "score": 0.224, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23149.png", "title": "Language Chain in Alignment: Cross-lingual Ranking Preference Optimization", "tldr": "\u7528\u82f1\u8bed\u504f\u597d\u6570\u636e\u63d0\u5347\u591a\u8bed\u79cd\u5bf9\u9f50", "upvotes": 4, "what_it_is": "\u672c\u6587\u63d0\u51fa\u8de8\u8bed\u8a00\u6392\u5e8f\u504f\u597d\u4f18\u5316\uff08CRPO\uff09\uff0c\u5c06\u82f1\u8bed\u4e2d\u7684\u9ad8\u8d28\u91cf\u504f\u597d\u77e5\u8bc6\u8fc1\u79fb\u5230\u76ee\u6807\u8bed\u8a00\u3002\u5b83\u901a\u8fc7\u5e76\u884c\u504f\u597d\u6837\u672c\u7684\u5c42\u7ea7\u7ed3\u6784\uff0c\u8054\u5408\u4f18\u5316\u540c\u8bed\u8a00\u4e0e\u8de8\u8bed\u8a00\u504f\u597d\u5173\u7cfb\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u5927\u6a21\u578b\u5bf9\u9f50\u8fc7\u5ea6\u4f9d\u8d56\u82f1\u6587\u504f\u597d\u6570\u636e\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u53ef\u8fc1\u79fb\u7684\u8de8\u8bed\u8a00\u504f\u597d\u4f18\u5316\u6846\u67b6\uff0c\u5bf9\u4f4e\u8d44\u6e90\u8bed\u8a00\u7684\u5bf9\u9f50\u8d28\u91cf\u63d0\u5347\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Correcting health misinformation in dialogue requires more than producing a factual rebuttal: users differ in what they know, what they believe, and what they need to hear, so an effective intervention often depends on first asking the right clarifying question. Yet existing methods either respond immediately or probe indiscriminately, treating clarification as either unnecessary or always beneficial. We propose Reward-Optimized Probe-and-Respond (RO-PnR), a framework that learns when asking is worth its cost. At each turn, RO-PnR chooses between probing for more information and committing to a final correction, guided by a turn-level reward that weighs the expected gain from probing against its interaction cost. To capture how user heterogeneity affects probing value, we model each simulated user with a latent state along health literacy and belief commitment. Experiments show that RO-PnR achieves the highest cost-adjusted utility across three health-misinformation datasets and three base models, using 30% fewer turns than always-probe baselines.", "arxiv_id": "2608.21721", "arxiv_url": "https://arxiv.org/abs/2608.21721", "authors": ["Xiaoying Song", "Anirban Saha Anik", "Jinyu Liu", "Qitao Tan", "Geng Yuan", "Lingzi Hong"], "brief": "\u8bba\u6587\u63d0\u51fa Reward-Optimized Probe-and-Respond\uff08RO-PnR\uff09\uff0c\u7528\u4e8e\u591a\u8f6e\u5065\u5eb7\u8bef\u4fe1\u606f\u5e72\u9884\u3002\u5b83\u5728\u6bcf\u4e00\u8f6e\u51b3\u5b9a\u662f\u5148\u8ffd\u95ee\u83b7\u53d6\u7528\u6237\u4fe1\u606f\uff0c\u8fd8\u662f\u76f4\u63a5\u7ed9\u51fa\u7ea0\u6b63\u56de\u5e94\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21721", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5f15\u5165\u9010\u8f6e\u5956\u52b1\u673a\u5236\uff0c\u5728\u8ffd\u95ee\u5e26\u6765\u7684\u9884\u671f\u6536\u76ca\u4e0e\u4ea4\u4e92\u6210\u672c\u4e4b\u95f4\u505a\u6743\u8861", "\u7528\u5065\u5eb7\u7d20\u517b\u548c\u4fe1\u5ff5\u575a\u6301\u7a0b\u5ea6\u7b49\u6f5c\u5728\u72b6\u6001\u5efa\u6a21\u7528\u6237\u5f02\u8d28\u6027", "\u5728\u4e09\u4e2a\u5065\u5eb7\u8bef\u4fe1\u606f\u6570\u636e\u96c6\u548c\u4e09\u4e2a\u57fa\u5ea7\u6a21\u578b\u4e0a\u53d6\u5f97\u6700\u9ad8\u6210\u672c\u8c03\u6574\u6548\u7528\uff0c\u5e76\u6bd4\u603b\u662f\u8ffd\u95ee\u7684\u57fa\u7ebf\u5c11\u7528\u7ea630%\u8f6e\u6b21"], "keywords": ["\u5065\u5eb7\u8bef\u4fe1\u606f", "\u591a\u8f6e\u5bf9\u8bdd", "\u5f3a\u5316\u5b66\u4e60", "\u7528\u6237\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21721v1", "published_at": "2026-08-22", "score": 0.218, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21721.png", "title": "Ask or Answer: A Decision Framework for Multi-Turn Health Misinformation Intervention", "tldr": "RO-PnR\u5b66\u4f1a\u4f55\u65f6\u8ffd\u95ee\u4ee5\u7ea0\u6b63\u5065\u5eb7\u8c23\u8a00", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Reward-Optimized Probe-and-Respond\uff08RO-PnR\uff09\uff0c\u7528\u4e8e\u591a\u8f6e\u5065\u5eb7\u8bef\u4fe1\u606f\u5e72\u9884\u3002\u5b83\u5728\u6bcf\u4e00\u8f6e\u51b3\u5b9a\u662f\u5148\u8ffd\u95ee\u83b7\u53d6\u7528\u6237\u4fe1\u606f\uff0c\u8fd8\u662f\u76f4\u63a5\u7ed9\u51fa\u7ea0\u6b63\u56de\u5e94\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u5065\u5eb7\u8bef\u4fe1\u606f\u7ea0\u6b63\u4ece\u201c\u4e00\u6b21\u6027\u53cd\u9a73\u201d\u63a8\u8fdb\u5230\u81ea\u9002\u5e94\u591a\u8f6e\u5e72\u9884\uff0c\u80fd\u51cf\u5c11\u4e0d\u5fc5\u8981\u8ffd\u95ee\uff0c\u540c\u65f6\u63d0\u5347\u7ea0\u6b63\u6548\u679c\uff0c\u5177\u6709\u5b9e\u9645\u5065\u5eb7\u6c9f\u901a\u5e94\u7528\u4ef7\u503c\u3002"}, {"abstract": "Strategic deception by LLM and VLM agents has emerged as a central AI alignment and safety concern. Social-deduction games (where each player holds a hidden role and communicates with others to deduce identities) serve as the canonical testbed, particularly in multi-agent settings. Existing testbeds, however, are text-only and run on a single fixed agent configuration, missing the non-verbal sensorimotor channels treated as core by deception taxonomies and leaving it ambiguous whether an observed behavior reflects the underlying model or the surrounding harness. We introduce MineAmongUs, a 3D multimodal Among Us sandbox where imposter agents must deceive crewmates through joint verbal and non-verbal action. We also propose ARIA, a configurable VLM-agent harness that exposes five cognitive-component ablation axes; and an atom- and arc-level annotation scheme grounded in deception taxonomies and operationalized at scale by an LLM-as-a-Judge reaching near-human atom-labeling agreement. Empirical results show that VLM agents pursue imposter wins through joint verbal and non-verbal deception, with non-verbal channels emerging as the more decisive winning contributors across both harness ablation and cross-VLM evaluation. Taken together, our work opens a new path for embodied VLM-agent alignment research.", "arxiv_id": "2608.30428", "arxiv_url": "https://arxiv.org/abs/2608.30428", "authors": ["Jaewoo Ahn", "Junseo Kim", "Hyunseo Kim", "Heeseung Yun", "Jaehyeon Son", "Zsolt Kira", "Gunhee Kim"], "brief": "\u8bba\u6587\u63d0\u51fa MineAmongUs\uff0c\u4e00\u4e2a3D\u591a\u6a21\u6001 Among Us \u6c99\u76d2\uff0c\u7528\u4e8e\u7814\u7a76VLM\u667a\u80fd\u4f53\u5728\u5177\u8eab\u793e\u4ea4\u4e92\u52a8\u4e2d\u7684\u6b3a\u9a97\u884c\u4e3a\u3002\u540c\u65f6\u63d0\u51fa\u53ef\u914d\u7f6e\u7684 ARIA \u667a\u80fd\u4f53\u6846\u67b6\u548c\u57fa\u4e8e\u6b3a\u9a97\u5206\u7c7b\u5b66\u7684\u6807\u6ce8\u4f53\u7cfb\uff0c\u8bc4\u4f30\u8bed\u8a00\u4e0e\u975e\u8bed\u8a00\u884c\u4e3a\u7684\u5171\u540c\u4f5c\u7528\u3002", "categories": ["cs.CL", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30428", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["MineAmongUs \u5c06\u793e\u4ea4\u63a8\u7406\u4ece\u7eaf\u6587\u672c\u6269\u5c55\u52303D\u73af\u5883\uff0c\u8986\u76d6\u79fb\u52a8\u3001\u4efb\u52a1\u3001\u9760\u8fd1/\u8fdc\u79bb\u7b49\u975e\u8bed\u8a00\u4f20\u611f\u8fd0\u52a8\u901a\u9053\u3002", "ARIA \u63d0\u4f9b\u4e94\u4e2a\u8ba4\u77e5\u7ec4\u4ef6\u6d88\u878d\u8f74\uff0c\u7528\u4e8e\u533a\u5206\u6a21\u578b\u80fd\u529b\u4e0e\u5916\u90e8\u667a\u80fd\u4f53\u6846\u67b6\u8bbe\u8ba1\u5e26\u6765\u7684\u5f71\u54cd\u3002", "\u5b9e\u9a8c\u663e\u793aVLM\u5192\u540d\u8005\u4f1a\u8054\u5408\u4f7f\u7528\u8bed\u8a00\u4e0e\u975e\u8bed\u8a00\u6b3a\u9a97\uff0c\u5176\u4e2d\u975e\u8bed\u8a00\u884c\u4e3a\u5728\u53d6\u80dc\u8d21\u732e\u4e0a\u66f4\u5173\u952e\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd", "AI\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30428v1", "published_at": "2026-08-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Lies We Can See: Joint Verbal and Non-Verbal Deception by VLM Agents in Embodied Social Interactions", "tldr": "3D\u793e\u4ea4\u63a8\u7406\u4e2d\u8bc4\u6d4bVLM\u5177\u8eab\u6b3a\u9a97", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MineAmongUs\uff0c\u4e00\u4e2a3D\u591a\u6a21\u6001 Among Us \u6c99\u76d2\uff0c\u7528\u4e8e\u7814\u7a76VLM\u667a\u80fd\u4f53\u5728\u5177\u8eab\u793e\u4ea4\u4e92\u52a8\u4e2d\u7684\u6b3a\u9a97\u884c\u4e3a\u3002\u540c\u65f6\u63d0\u51fa\u53ef\u914d\u7f6e\u7684 ARIA \u667a\u80fd\u4f53\u6846\u67b6\u548c\u57fa\u4e8e\u6b3a\u9a97\u5206\u7c7b\u5b66\u7684\u6807\u6ce8\u4f53\u7cfb\uff0c\u8bc4\u4f30\u8bed\u8a00\u4e0e\u975e\u8bed\u8a00\u884c\u4e3a\u7684\u5171\u540c\u4f5c\u7528\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628aAI\u6b3a\u9a97\u8bc4\u6d4b\u4ece\u6587\u672c\u5bf9\u8bdd\u63a8\u8fdb\u5230\u5177\u8eab\u591a\u6a21\u6001\u573a\u666f\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u667a\u80fd\u4f53\u4ea4\u4e92\u98ce\u9669\uff1b\u540c\u65f6\u63d0\u4f9b\u53ef\u6d88\u878d\u6846\u67b6\u548c\u89c4\u6a21\u5316\u6807\u6ce8\u65b9\u6cd5\uff0c\u6709\u52a9\u4e8eVLM\u667a\u80fd\u4f53\u5bf9\u9f50\u4e0e\u5b89\u5168\u7814\u7a76\u3002"}, {"abstract": "General embodied agents should perceive, predict, act, evaluate, and improve within a unified system. World models have shown great promise in building such agents, yet existing models typically append an action output head to a world simulator, without coupling them into a closed decision-and-learning loop for policy improvement. We present Motus2, a self-evolving general world model for dexterous manipulation. Motus2 advances world modeling through model scaling and data scaling. For model scaling, a single model with shared weights exposes three control interfaces: a policy (world-action model), a simulator (action-conditioned world model), and an evaluator (value model). The policy proposes candidate action chunks, the simulator predicts their visual consequences, and the evaluator assesses the predicted outcomes. Their coupling forms a closed decision-and-learning loop for policy improvement. This formulation uses curated expert demonstrations for action learning, while failed and suboptimal interactions provide valuable evidence for dynamics modeling and value learning. For data scaling, Motus2 progresses from large-scale monocular egocentric data to synchronized stereo egocentric data, followed by robot-domain adaptation with robot trajectories and supplementary human-robot alignment data. Motus2 further studies global-autoregressive and hybrid-memory extensions of its sliding-window context, adds tactile feedback for contact-aware control, and is instantiated on a fully biomimetic platform with stereo vision, dual arms, dual dexterous hands, and tactile sensing. Together, egocentric data scaling and closed-loop general world model scaling provide a general path toward self-evolving dexterous manipulation.", "arxiv_id": "2608.30237", "arxiv_url": "https://arxiv.org/abs/2608.30237", "authors": ["Hongzhe Bi", "Zihao Zhou", "Yihang Tang", "Jingrui Pang", "Shuhe Huang", "Haitian Liu", "Runqing Wang", "Shuai Huang", "Yichen Wang", "Yiming Cheng", "Ruowen Zhao", "Zhenghua Li", "Hengkai Tan", "Xiaolong Liu", "Jinhui Wan", "Jiabao Liu", "Min Zhao", "Fan Bao", "Jun Zhu"], "brief": "Motus2 \u662f\u4e00\u4e2a\u9762\u5411\u7075\u5de7\u64cd\u4f5c\u7684\u901a\u7528\u4e16\u754c\u6a21\u578b\uff0c\u628a\u7b56\u7565\u3001\u6a21\u62df\u5668\u548c\u4ef7\u503c\u8bc4\u4f30\u5668\u6574\u5408\u5728\u540c\u4e00\u5171\u4eab\u6743\u91cd\u6a21\u578b\u4e2d\u3002\u5b83\u901a\u8fc7\u9884\u6d4b\u5019\u9009\u52a8\u4f5c\u540e\u679c\u5e76\u8bc4\u4f30\u7ed3\u679c\uff0c\u5f62\u6210\u95ed\u73af\u51b3\u7b56\u4e0e\u5b66\u4e60\u673a\u5236\u6765\u6301\u7eed\u6539\u8fdb\u7b56\u7565\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30237", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5355\u4e00\u6a21\u578b\u63d0\u4f9b\u4e09\u79cd\u63a5\u53e3\uff1aworld-action \u7b56\u7565\u3001\u52a8\u4f5c\u6761\u4ef6\u4e16\u754c\u6a21\u62df\u5668\u3001\u4ef7\u503c\u8bc4\u4f30\u5668", "\u6570\u636e\u6269\u5c55\u4ece\u5355\u76ee\u7b2c\u4e00\u89c6\u89d2\u6570\u636e\u5230\u540c\u6b65\u53cc\u76ee\u6570\u636e\uff0c\u518d\u5230\u673a\u5668\u4eba\u8f68\u8ff9\u4e0e\u4eba\u673a\u5bf9\u9f50\u6570\u636e", "\u52a0\u5165\u6ed1\u52a8\u7a97\u53e3\u4e0a\u4e0b\u6587\u6269\u5c55\u3001\u89e6\u89c9\u53cd\u9988\uff0c\u5e76\u90e8\u7f72\u5728\u53cc\u81c2\u53cc\u7075\u5de7\u624b\u4eff\u751f\u5e73\u53f0\u4e0a"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba", "\u7075\u5de7\u64cd\u4f5c", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30237v1", "published_at": "2026-08-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Motus2: A Self-Evolving General World Model for Dexterous Manipulation", "tldr": "\u81ea\u8fdb\u5316\u4e16\u754c\u6a21\u578b\u9a71\u52a8\u7075\u5de7\u64cd\u4f5c", "upvotes": 0, "what_it_is": "Motus2 \u662f\u4e00\u4e2a\u9762\u5411\u7075\u5de7\u64cd\u4f5c\u7684\u901a\u7528\u4e16\u754c\u6a21\u578b\uff0c\u628a\u7b56\u7565\u3001\u6a21\u62df\u5668\u548c\u4ef7\u503c\u8bc4\u4f30\u5668\u6574\u5408\u5728\u540c\u4e00\u5171\u4eab\u6743\u91cd\u6a21\u578b\u4e2d\u3002\u5b83\u901a\u8fc7\u9884\u6d4b\u5019\u9009\u52a8\u4f5c\u540e\u679c\u5e76\u8bc4\u4f30\u7ed3\u679c\uff0c\u5f62\u6210\u95ed\u73af\u51b3\u7b56\u4e0e\u5b66\u4e60\u673a\u5236\u6765\u6301\u7eed\u6539\u8fdb\u7b56\u7565\u3002", "why_notable": "\u8bba\u6587\u5c06\u4e16\u754c\u5efa\u6a21\u4ece\u201c\u9884\u6d4b\u73af\u5883\u201d\u63a8\u8fdb\u5230\u201c\u9884\u6d4b\u2014\u8bc4\u4f30\u2014\u6539\u8fdb\u7b56\u7565\u201d\u7684\u95ed\u73af\u81ea\u8fdb\u5316\u7cfb\u7edf\uff0c\u4e3a\u901a\u7528\u7075\u5de7\u673a\u5668\u4eba\u64cd\u4f5c\u63d0\u4f9b\u4e86\u53ef\u6269\u5c55\u8def\u7ebf\u3002"}, {"abstract": "Fixed-viewpoint infrastructure sensors repeatedly observe the same traffic space, making roadside 3D occupancy structurally different from ego-vehicle perception: a near-persistent static scaffold is overlaid with sparse, short-lived dynamic events. Existing occupancy benchmarks and methods, however, are built around moving ego vehicles and neither measure nor exploit this structure, instead treating occupancy as flat one-shot voxel classification. We address this gap from both data and model perspectives. We build InfraOcc, to our knowledge, the first real-world infrastructure-side semantic occupancy benchmark, with dense voxel annotations for 290 multi-modal sequences in a fixed roadside frame, a static-dynamic decoupled annotation pipeline, unified camera-only, LiDAR-only, and multi-modal evaluation, and diagnostics for static and dynamic occupancy. InfraOcc shows that static infrastructure fills 97.3% of occupied voxels and persists across frames, whereas dynamic participants have a median occupied-frame ratio of only 1.8% per location, revealing a structural static-dynamic asymmetry beyond semantic long-tailedness. We further propose ProSD-Occ, which reformulates occupancy as progressive static-to-dynamic evidence reasoning: it explains persistent layout, exposes residual dynamic evidence under static-confidence guidance, and recomposes static, dynamic, and free-space evidence into a unified field. ProSD-Occ ranks first in overall, dynamic, static, and geometric occupancy on every track, e.g., a 23.5% relative camera-only dynamic-mIoU gain over the strongest baseline and 65.87 multi-modal overall mIoU, establishing fixed-viewpoint roadside occupancy as a distinct problem with its own reasoning paradigm. The benchmark and code will be publicly available at https://github.com/yanglei18/InfraOcc", "arxiv_id": "2608.30657", "arxiv_url": "https://arxiv.org/abs/2608.30657", "authors": ["Lei Yang", "Xiaokai Bai", "Boqi Li", "Chunmian Lin", "Li Wang", "Ziying Song", "Jiahuan Zhang", "Enhui Ma", "Haibao Yu", "Jiaqi Ma", "Kaicheng Yu"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86 InfraOcc\uff0c\u8fd9\u662f\u9996\u4e2a\u771f\u5b9e\u4e16\u754c\u57fa\u7840\u8bbe\u65bd\u4fa7\u8bed\u4e49\u5360\u7528\u57fa\u51c6\uff0c\u9762\u5411\u56fa\u5b9a\u8def\u4fa7\u4f20\u611f\u5668\u76843D\u5360\u7528\u611f\u77e5\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa ProSD-Occ\uff0c\u5c06\u5360\u7528\u9884\u6d4b\u5efa\u6a21\u4e3a\u4ece\u9759\u6001\u5e03\u5c40\u5230\u52a8\u6001\u8bc1\u636e\u7684\u6e10\u8fdb\u63a8\u7406\u8fc7\u7a0b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30657", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["InfraOcc \u5305\u542b290\u6bb5\u591a\u6a21\u6001\u5e8f\u5217\uff0c\u63d0\u4f9b\u56fa\u5b9a\u8def\u4fa7\u5750\u6807\u7cfb\u4e0b\u7684\u5bc6\u96c6\u4f53\u7d20\u6807\u6ce8\uff0c\u5e76\u652f\u6301\u76f8\u673a\u3001LiDAR\u548c\u591a\u6a21\u6001\u7edf\u4e00\u8bc4\u6d4b\u3002", "\u6570\u636e\u63ed\u793a\u8def\u4fa7\u5360\u7528\u7684\u5f3a\u9759\u6001-\u52a8\u6001\u4e0d\u5bf9\u79f0\uff1a\u9759\u6001\u57fa\u7840\u8bbe\u65bd\u5360\u5df2\u5360\u7528\u4f53\u7d20\u768497.3%\uff0c\u800c\u52a8\u6001\u76ee\u6807\u5728\u5355\u4f4d\u7f6e\u7684\u4e2d\u4f4d\u5360\u7528\u5e27\u6bd4\u4f8b\u4ec51.8%\u3002", "ProSD-Occ \u5148\u89e3\u91ca\u6301\u4e45\u9759\u6001\u5e03\u5c40\uff0c\u518d\u5728\u9759\u6001\u7f6e\u4fe1\u5ea6\u5f15\u5bfc\u4e0b\u63d0\u53d6\u52a8\u6001\u6b8b\u5dee\u4fe1\u606f\uff0c\u6700\u7ec8\u91cd\u7ec4\u9759\u6001\u3001\u52a8\u6001\u4e0e\u81ea\u7531\u7a7a\u95f4\u8bc1\u636e\uff1b\u5728\u5404\u8bc4\u6d4b\u8f68\u9053\u5747\u53d6\u5f97\u7b2c\u4e00\u3002"], "keywords": ["3D\u5360\u7528", "\u81ea\u52a8\u9a7e\u9a76", "\u591a\u6a21\u6001", "\u573a\u666f\u7406\u89e3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.30657v1", "published_at": "2026-08-31", "score": 0.2, "selected_reasons": ["\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "InfraOcc: An Infrastructure Occupancy Benchmark with Static-to-Dynamic Reasoning", "tldr": "\u9996\u4e2a\u8def\u4fa7\u56fa\u5b9a\u89c6\u89d23D\u5360\u7528\u57fa\u51c6", "upvotes": 0, "what_it_is": "\u8bba\u6587\u6784\u5efa\u4e86 InfraOcc\uff0c\u8fd9\u662f\u9996\u4e2a\u771f\u5b9e\u4e16\u754c\u57fa\u7840\u8bbe\u65bd\u4fa7\u8bed\u4e49\u5360\u7528\u57fa\u51c6\uff0c\u9762\u5411\u56fa\u5b9a\u8def\u4fa7\u4f20\u611f\u5668\u76843D\u5360\u7528\u611f\u77e5\u3002\u4f5c\u8005\u8fd8\u63d0\u51fa ProSD-Occ\uff0c\u5c06\u5360\u7528\u9884\u6d4b\u5efa\u6a21\u4e3a\u4ece\u9759\u6001\u5e03\u5c40\u5230\u52a8\u6001\u8bc1\u636e\u7684\u6e10\u8fdb\u63a8\u7406\u8fc7\u7a0b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u56fa\u5b9a\u8def\u4fa7\u611f\u77e5\u4e0d\u540c\u4e8e\u8f66\u8f7d\u79fb\u52a8\u89c6\u89d2\uff0c\u5360\u7528\u9884\u6d4b\u4e0d\u5e94\u88ab\u7b80\u5355\u89c6\u4e3a\u4e00\u6b21\u6027\u4f53\u7d20\u5206\u7c7b\u3002InfraOcc \u4e3a\u667a\u6167\u4ea4\u901a\u548c\u8f66\u8def\u534f\u540c\u63d0\u4f9b\u4e86\u4e13\u95e8\u57fa\u51c6\uff0cProSD-Occ \u5219\u7ed9\u51fa\u4e86\u5229\u7528\u957f\u671f\u9759\u6001\u7ed3\u6784\u63d0\u5347\u52a8\u6001\u611f\u77e5\u7684\u65b0\u8303\u5f0f\u3002"}, {"abstract": "Proactive tamper localization embeds an imperceptible signal into an image prior to distribution, enabling pixel-level manipulation detection. Existing methods assume a spliced (SP) setting, where synthesized regions are composited onto the original background, leaving embedded signals intact. However, real-world diffusion-based inpainting operates in a fully regenerated (FR) setting, where the entire image undergoes denoising, disrupting background signals and rendering existing frameworks ineffective. We propose APT, a semi-fragile latent-space perturbation that embeds a dense, vector-wise localization signal. By aligning each spatial feature vector toward a fixed anchor direction, APT localizes tampering via the alignment disparity between synthesized foreground and anchor-aligned background features after inpainting. The proposed hard negative mining loss and noisy perturbation branch further enforce uniform alignment. Experiments on COCO demonstrate that APT achieves an FR IoU of 0.92, outperforming the strongest baseline (WAM, 0.84), while existing methods collapse to near-random performance (AUC 0.5), establishing APT as a practical forensic framework generalizable across tampering types unknown at test time.", "arxiv_id": "2608.30656", "arxiv_url": "https://arxiv.org/abs/2608.30656", "authors": ["Suhyeon Ha", "Woo Jae Kim", "Joonsung Jeon", "Sooel Son", "Sung-eui Yoon"], "brief": "\u8bba\u6587\u63d0\u51fa APT\uff0c\u4e00\u79cd\u7528\u4e8e\u4e3b\u52a8\u7be1\u6539\u5b9a\u4f4d\u7684\u534a\u8106\u5f31\u6f5c\u7a7a\u95f4\u6270\u52a8\u65b9\u6cd5\u3002\u5b83\u5728\u56fe\u50cf\u53d1\u5e03\u524d\u5d4c\u5165\u5bc6\u96c6\u7684\u5411\u91cf\u7ea7\u5b9a\u4f4d\u4fe1\u53f7\uff0c\u4f7f\u6269\u6563\u4fee\u590d\u7b49\u5168\u56fe\u91cd\u751f\u6210\u573a\u666f\u4e0b\u4ecd\u80fd\u8fdb\u884c\u50cf\u7d20\u7ea7\u7be1\u6539\u68c0\u6d4b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.30656", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u5c06\u6bcf\u4e2a\u7a7a\u95f4\u7279\u5f81\u5411\u91cf\u5bf9\u9f50\u5230\u56fa\u5b9a\u951a\u70b9\u65b9\u5411\uff0c\u5229\u7528\u91cd\u751f\u6210\u540e\u524d\u666f\u4e0e\u80cc\u666f\u7684\u5bf9\u9f50\u5dee\u5f02\u5b9a
