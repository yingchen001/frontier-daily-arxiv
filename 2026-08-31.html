<script>
const PAPERS = [{"abstract": "Equipping Large Language Models (LLMs) with multi-turn tool-calling capabilities is essential for building autonomous agents. However, progress is fundamentally limited by the reliance on full-length trajectory imitation. For tasks involving multiple order-independent sub-goals, the optimal solution space forms a vast combinatorial diamond lattice. Forcing this rich topology into monolithic trajectories causes a severe topological collapse, indiscriminately penalizing valid alternative explorations and severely degrading policy diversity. To address this, we propose DART-SD (Diamond-topology Aware Retrieval and Tuning for Self-Distillation), a novel framework that shifts the paradigm from global forcing to topology-guided localized correction. DART-SD first models the execution process as a converging Interaction-State Transition Graph (ISTG), faithfully capturing the inherent diamond topology of successful and failed exploratory paths. During autonomous rollouts, the framework identifies the Critical Topological Breakpoint (CTB) and retrieves success-supported recovery references. Finally, we introduce a progressive self-distillation paradigm through CTB-guided localized supervision, ensuring that the training loss is calculated exclusively on the generated recovery steps while strictly protecting the valid reasoning prefix from destructive gradient updates. Experiments on complex multi-turn tool-calling benchmarks demonstrate that DART-SD significantly outperforms traditional full-trajectory baselines.", "arxiv_id": "2608.18524", "arxiv_url": "https://arxiv.org/abs/2608.18524", "authors": ["Hangrui Xu", "Jiarui Wang", "Yang Yang", "Chuanbo Zhu", "Fangda Chen", "Ziqi Wu", "Jingming Cai", "Yan Song"], "brief": "\u672c\u6587\u63d0\u51fa DART-SD\uff0c\u5c06\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u8fc7\u7a0b\u5efa\u6a21\u4e3a\u4ea4\u4e92\u72b6\u6001\u8f6c\u79fb\u56fe\uff08ISTG\uff09\uff0c\u663e\u5f0f\u523b\u753b\u591a\u4e2a\u65e0\u5e8f\u5b50\u76ee\u6807\u5f62\u6210\u7684\u201c\u94bb\u77f3\u62d3\u6251\u201d\u3002\u5b83\u5728\u667a\u80fd\u4f53\u81ea\u4e3b\u63a2\u7d22\u4e2d\u5b9a\u4f4d\u5173\u952e\u62d3\u6251\u65ad\u70b9\uff08CTB\uff09\uff0c\u53ea\u5bf9\u5931\u8d25\u540e\u7684\u6062\u590d\u6b65\u9aa4\u8fdb\u884c\u5c40\u90e8\u76d1\u7763\u5f0f\u81ea\u84b8\u998f\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18524", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6307\u51fa\u4f20\u7edf\u5b8c\u6574\u8f68\u8ff9\u6a21\u4eff\u4f1a\u538b\u7f29\u591a\u89e3\u7a7a\u95f4\uff0c\u9519\u8bef\u60e9\u7f5a\u6709\u6548\u4f46\u987a\u5e8f\u4e0d\u540c\u7684\u63a2\u7d22\u8def\u5f84\uff0c\u5bfc\u81f4\u7b56\u7565\u591a\u6837\u6027\u4e0b\u964d", "\u6784\u5efa\u6536\u655b\u5f0f ISTG \u6765\u8868\u793a\u6210\u529f\u4e0e\u5931\u8d25\u8def\u5f84\uff0c\u5e76\u57fa\u4e8e CTB \u68c0\u7d22\u6709\u6210\u529f\u652f\u6491\u7684\u6062\u590d\u53c2\u8003", "\u8bad\u7ec3\u635f\u5931\u4ec5\u4f5c\u7528\u4e8e\u751f\u6210\u7684\u6062\u590d\u7247\u6bb5\uff0c\u907f\u514d\u5bf9\u539f\u672c\u6709\u6548\u7684\u63a8\u7406\u524d\u7f00\u4ea7\u751f\u7834\u574f\u6027\u68af\u5ea6\u66f4\u65b0"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u81ea\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "ByteDance", "pdf_url": "https://arxiv.org/pdf/2608.18524v1", "published_at": "2026-08-19", "score": 0.708, "selected_reasons": ["\u77e5\u540d\u673a\u6784: ByteDance", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (77\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18524.png", "title": "DART-SD: Diamond-topology Aware Retrieval and Tuning for Self-Distillation of Multi-Turn Tool-Calling Agents", "tldr": "\u7528\u62d3\u6251\u611f\u77e5\u81ea\u84b8\u998f\u6539\u8fdb\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u667a\u80fd\u4f53", "upvotes": 77, "what_it_is": "\u672c\u6587\u63d0\u51fa DART-SD\uff0c\u5c06\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u8fc7\u7a0b\u5efa\u6a21\u4e3a\u4ea4\u4e92\u72b6\u6001\u8f6c\u79fb\u56fe\uff08ISTG\uff09\uff0c\u663e\u5f0f\u523b\u753b\u591a\u4e2a\u65e0\u5e8f\u5b50\u76ee\u6807\u5f62\u6210\u7684\u201c\u94bb\u77f3\u62d3\u6251\u201d\u3002\u5b83\u5728\u667a\u80fd\u4f53\u81ea\u4e3b\u63a2\u7d22\u4e2d\u5b9a\u4f4d\u5173\u952e\u62d3\u6251\u65ad\u70b9\uff08CTB\uff09\uff0c\u53ea\u5bf9\u5931\u8d25\u540e\u7684\u6062\u590d\u6b65\u9aa4\u8fdb\u884c\u5c40\u90e8\u76d1\u7763\u5f0f\u81ea\u84b8\u998f\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u4ece\u201c\u5168\u8f68\u8ff9\u5f3a\u5236\u6a21\u4eff\u201d\u8f6c\u5411\u201c\u62d3\u6251\u5f15\u5bfc\u7684\u5c40\u90e8\u7ea0\u9519\u201d\uff0c\u66f4\u9002\u5408\u590d\u6742\u591a\u8f6e\u5de5\u5177\u8c03\u7528\u4efb\u52a1\u4e2d\u5b58\u5728\u5927\u91cf\u7b49\u4ef7\u89e3\u7684\u573a\u666f\uff0c\u6709\u671b\u63d0\u5347\u667a\u80fd\u4f53\u7684\u9c81\u68d2\u6027\u3001\u63a2\u7d22\u591a\u6837\u6027\u4e0e\u81ea\u6211\u6539\u8fdb\u80fd\u529b\u3002"}, {"abstract": "Long-horizon agentic tasks require large language models (LLMs) to iteratively retrieve, integrate, and maintain dispersed information across multi-turn interactions, but preserving all interaction histories leads to a continuously growing working context. Recent proactive context management methods allow models to edit their own working context with specialized tools, yet they still face three key limitations: (1) a limited toolset restricted to search, deletion, and summarization, with no support for global planning, long-term memory, and adaptive compression; (2) inefficient exploration that treats context management actions uniformly despite their heterogeneous impacts on final outcomes; and (3) coarse-grained credit assignment that assigns the final trajectory-level reward to all intermediate context editing actions during RL. To bridge these gaps, we introduce ContextPilot, a proactive context management framework for long-horizon agentic reasoning. Our approach systematically augments the toolset with planning, long-term memory, and soft context offloading tools. We further propose an RL method tailored for context management, which uses context and entropy variation to identify critical editing decisions for branch sampling and estimates action-level advantages from all branched trajectories that pass through the corresponding context editing action. Experiments on long-context QA and deep search tasks show that ContextPilot achieves stronger performance with a more compact working context, consistently outperforming existing baselines across various base models and benchmarks. Code is available at https://github.com/Tencent/ContextPilot.", "arxiv_id": "2608.28476", "arxiv_url": "https://arxiv.org/abs/2608.28476", "authors": ["Zhuoshi Pan", "Qizhi Pei", "Junru Lu", "Honglin Lin", "H. Vicky Zhao", "Di Yin", "Xing Sun"], "brief": "\u8bba\u6587\u63d0\u51fa ContextPilot\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u63a8\u7406\u7684\u4e3b\u52a8\u4e0a\u4e0b\u6587\u7ba1\u7406\u6846\u67b6\u3002\u5b83\u8ba9 LLM \u901a\u8fc7\u89c4\u5212\u3001\u957f\u671f\u8bb0\u5fc6\u3001\u8f6f\u4e0a\u4e0b\u6587\u5378\u8f7d\u7b49\u5de5\u5177\uff0c\u52a8\u6001\u7f16\u8f91\u5de5\u4f5c\u4e0a\u4e0b\u6587\uff0c\u5e76\u7528\u66f4\u7ec6\u7c92\u5ea6\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5173\u952e\u7f16\u8f91\u51b3\u7b56\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Tencent/ContextPilot", "github_stars": 38, "hf_url": "https://huggingface.co/papers/2608.28476", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6269\u5c55\u4e0a\u4e0b\u6587\u7ba1\u7406\u5de5\u5177\u96c6\uff1a\u9664\u641c\u7d22\u3001\u5220\u9664\u3001\u603b\u7ed3\u5916\uff0c\u52a0\u5165\u5168\u5c40\u89c4\u5212\u3001\u957f\u671f\u8bb0\u5fc6\u4e0e\u81ea\u9002\u5e94\u538b\u7f29/\u8f6f\u5378\u8f7d\u80fd\u529b\u3002", "\u63d0\u51fa\u9488\u5bf9\u4e0a\u4e0b\u6587\u7f16\u8f91\u7684 RL \u65b9\u6cd5\uff1a\u5229\u7528\u4e0a\u4e0b\u6587\u53d8\u5316\u4e0e\u71b5\u53d8\u5316\u8bc6\u522b\u5173\u952e\u7f16\u8f91\u52a8\u4f5c\uff0c\u5e76\u8fdb\u884c\u5206\u652f\u91c7\u6837\u4ee5\u63d0\u5347\u63a2\u7d22\u6548\u7387\u3002", "\u901a\u8fc7\u7ecf\u8fc7\u540c\u4e00\u7f16\u8f91\u52a8\u4f5c\u7684\u5206\u652f\u8f68\u8ff9\u4f30\u8ba1\u52a8\u4f5c\u7ea7\u4f18\u52bf\uff0c\u7f13\u89e3\u4ec5\u7528\u6700\u7ec8\u5956\u52b1\u5206\u914d\u7ed9\u6240\u6709\u4e2d\u95f4\u52a8\u4f5c\u7684\u7c97\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\u95ee\u9898\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4e0a\u4e0b\u6587\u7ba1\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u671f\u8bb0\u5fc6"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.28476v1", "published_at": "2026-08-28", "score": 0.698, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28476.png", "title": "ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL", "tldr": "\u7528\u7ec6\u7c92\u5ea6\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u7ba1\u7406", "upvotes": 24, "what_it_is": "\u8bba\u6587\u63d0\u51fa ContextPilot\uff0c\u4e00\u4e2a\u9762\u5411\u957f\u7a0b\u667a\u80fd\u4f53\u63a8\u7406\u7684\u4e3b\u52a8\u4e0a\u4e0b\u6587\u7ba1\u7406\u6846\u67b6\u3002\u5b83\u8ba9 LLM \u901a\u8fc7\u89c4\u5212\u3001\u957f\u671f\u8bb0\u5fc6\u3001\u8f6f\u4e0a\u4e0b\u6587\u5378\u8f7d\u7b49\u5de5\u5177\uff0c\u52a8\u6001\u7f16\u8f91\u5de5\u4f5c\u4e0a\u4e0b\u6587\uff0c\u5e76\u7528\u66f4\u7ec6\u7c92\u5ea6\u7684\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u5173\u952e\u7f16\u8f91\u51b3\u7b56\u3002", "why_notable": "\u957f\u7a0b\u667a\u80fd\u4f53\u4efb\u52a1\u7684\u6838\u5fc3\u74f6\u9888\u4e4b\u4e00\u662f\u4e0a\u4e0b\u6587\u6301\u7eed\u81a8\u80c0\u4e0e\u4fe1\u606f\u7ef4\u62a4\u56f0\u96be\u3002ContextPilot \u540c\u65f6\u6539\u8fdb\u5de5\u5177\u8bbe\u8ba1\u548c RL \u8bad\u7ec3\u673a\u5236\uff0c\u5728\u957f\u4e0a\u4e0b\u6587\u95ee\u7b54\u4e0e\u6df1\u5ea6\u641c\u7d22\u4efb\u52a1\u4e2d\u4ee5\u66f4\u7d27\u51d1\u4e0a\u4e0b\u6587\u83b7\u5f97\u66f4\u597d\u6027\u80fd\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u8fd0\u884c\u7684 LLM \u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generative models can turn natural-language prompts into images, text, code, and other content, lowering the cost of producing drafts and components. Their practical impact increasingly depends on whether those pieces can become complete, dependable deliverables. This survey examines agentic artifact creation, which we define as stateful construction in which an AI system materially constructs or revises a deliverable and intermediate observations redirect later work. Functionally, the process links an operational representation of the artifact, a construction policy, and runtime verification whose feedback can redirect later actions. We reviewed 259 works available through August 20, 2026: 230 systems meeting this definition and 29 benchmarks of agentic artifact construction. We compare six artifact families, then analyze application settings and evaluation practice as separate dimensions. Across families, construction challenges reflect not only modality but also how tightly decisions are coupled and whether failures become visible while they remain repairable. Decomposition can reduce local complexity while increasing coordination and reassembly costs. Learned judges may add little independent evidence when they share the generator\u0027s preferences or blind spots. We formulate principles for keeping commitments and responsibility explicit, turning feedback into targeted repair, and revalidating affected state after change. We also identify opportunities for sustaining coherent, accountable control as artifacts, creator intent, and construction systems evolve. A curated paper list is available at https://github.com/GeminiLight/awesome-agentic-artifact-creation.", "arxiv_id": "2608.28122", "arxiv_url": "https://arxiv.org/abs/2608.28122", "authors": ["Tianfu Wang", "Zhezheng Hao", "Xilin Xia", "Lixin Liu", "Mengkang Hu", "Hongzhang Liu", "Xi Chen", "Ziyan Liu", "Xiankun Lin", "Weijia Zhang", "Nicholas Jing Yuan", "Hui Xiong"], "brief": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u201c\u667a\u80fd\u4f53\u5f0f\u4ea7\u7269\u521b\u5efa\u201d\uff1aAI\u5728\u6709\u72b6\u6001\u8fc7\u7a0b\u4e2d\u6784\u5efa\u6216\u4fee\u8ba2\u5b8c\u6574\u4ea4\u4ed8\u7269\uff0c\u5e76\u5229\u7528\u8fd0\u884c\u65f6\u89c2\u5bdf\u53cd\u9988\u91cd\u5b9a\u5411\u540e\u7eed\u5de5\u4f5c\u3002\u4f5c\u8005\u68b3\u7406\u4e86\u622a\u81f32026\u5e748\u670820\u65e5\u7684259\u7bc7\u76f8\u5173\u5de5\u4f5c\uff0c\u8986\u76d6230\u4e2a\u7cfb\u7edf\u4e0e29\u4e2a\u57fa\u51c6\u3002", "categories": ["cs.MM"], "github_repo": "https://github.com/GeminiLight/awesome-agentic-artifact-creation", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2608.28122", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u63d0\u51fa\u7edf\u4e00\u6846\u67b6\uff1a\u4ea7\u7269\u7684\u64cd\u4f5c\u8868\u793a\u3001\u6784\u5efa\u7b56\u7565\u3001\u8fd0\u884c\u65f6\u9a8c\u8bc1\u4e0e\u53cd\u9988\u4fee\u590d\u5171\u540c\u6784\u6210\u667a\u80fd\u4f53\u5f0f\u521b\u5efa\u6d41\u7a0b\u3002", "\u6bd4\u8f83\u516d\u7c7b\u4ea7\u7269\u5bb6\u65cf\uff0c\u5e76\u533a\u5206\u5e94\u7528\u573a\u666f\u4e0e\u8bc4\u6d4b\u5b9e\u8df5\uff0c\u6307\u51fa\u6311\u6218\u53d6\u51b3\u4e8e\u51b3\u7b56\u8026\u5408\u5ea6\u3001\u9519\u8bef\u53ef\u89c1\u6027\u548c\u53ef\u4fee\u590d\u6027\u3002", "\u603b\u7ed3\u8bbe\u8ba1\u539f\u5219\uff1a\u663e\u5f0f\u8bb0\u5f55\u627f\u8bfa\u4e0e\u8d23\u4efb\uff0c\u5c06\u53cd\u9988\u8f6c\u5316\u4e3a\u5b9a\u5411\u4fee\u590d\uff0c\u5e76\u5728\u53d8\u66f4\u540e\u91cd\u65b0\u9a8c\u8bc1\u53d7\u5f71\u54cd\u72b6\u6001\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u751f\u6210\u6a21\u578b", "\u591a\u6a21\u6001", "\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Hong Kong University of Science and Technology(GuangZhou)", "pdf_url": "https://arxiv.org/pdf/2608.28122v1", "published_at": "2026-08-28", "score": 0.685, "selected_reasons": ["\u77e5\u540d\u673a\u6784: HKU/HKUST", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (54\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28122.png", "title": "Agentic Artifact Creation: Systems, Evaluation, Principles, and Opportunities", "tldr": "\u7efc\u8ff0\u667a\u80fd\u4f53\u5f0f\u53ef\u4ea4\u4ed8\u7269\u6784\u5efa\u7814\u7a76\u3002", "upvotes": 54, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7efc\u8ff0\u201c\u667a\u80fd\u4f53\u5f0f\u4ea7\u7269\u521b\u5efa\u201d\uff1aAI\u5728\u6709\u72b6\u6001\u8fc7\u7a0b\u4e2d\u6784\u5efa\u6216\u4fee\u8ba2\u5b8c\u6574\u4ea4\u4ed8\u7269\uff0c\u5e76\u5229\u7528\u8fd0\u884c\u65f6\u89c2\u5bdf\u53cd\u9988\u91cd\u5b9a\u5411\u540e\u7eed\u5de5\u4f5c\u3002\u4f5c\u8005\u68b3\u7406\u4e86\u622a\u81f32026\u5e748\u670820\u65e5\u7684259\u7bc7\u76f8\u5173\u5de5\u4f5c\uff0c\u8986\u76d6230\u4e2a\u7cfb\u7edf\u4e0e29\u4e2a\u57fa\u51c6\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u4e3a\u4ece\u201c\u751f\u6210\u7247\u6bb5\u201d\u8d70\u5411\u201c\u53ef\u9760\u4ea4\u4ed8\u7269\u201d\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\u63d0\u4f9b\u4e86\u6e05\u6670\u5b9a\u4e49\u3001\u7814\u7a76\u5730\u56fe\u4e0e\u8bc4\u4f30\u53cd\u601d\uff0c\u5bf9\u591a\u6a21\u6001\u521b\u4f5c\u3001\u4ee3\u7801\u751f\u6210\u3001\u81ea\u52a8\u5316\u8bbe\u8ba1\u7b49\u9886\u57df\u5177\u6709\u65b9\u6cd5\u8bba\u4ef7\u503c\u3002"}, {"abstract": "Streaming 3D reconstruction from extremely long videos requires estimating camera motion and scene geometry online under bounded memory and computation. Early streaming models achieve causal, bounded-cost inference using finite context buffers or compact recurrent states, yet their estimates often deteriorate as sequences grow. Recent methods improve long-horizon stability by coupling short-range context with persistent or multi-level long-range memory. We pursue a different route: we keep the learned temporal state strictly local and formulate predictions whose targets remain independent of sequence length. We present ABot-Recon, a simple streaming model that caches KV features from only the preceding 11 frames. It predicts a point map in the current camera coordinate system together with an adjacent-frame relative pose. These predictions remain equivariant under changes of reference frame, and global poses and geometry are recovered through sequential composition. To reduce accumulated drift, a lightweight temporal refiner improves relative rotations using recent visual and motion context, while a composition-aware pose loss supervises multi-step pose composition. Extensive evaluations on challenging long-sequence benchmarks demonstrate the superior long-horizon performance of our local-context approach. On Oxford Spires, ABot-Recon achieves an ATE of 4.35 m and an RPE-R of $0.12^\\circ$, reducing both errors by approximately 40\\% relative to the best prior results.", "arxiv_id": "2608.27529", "arxiv_url": "https://arxiv.org/abs/2608.27529", "authors": ["Jiarong Han", "Jincheng Xiong", "Yuzhou Liu", "Linzhe Shi", "Changjie Wu", "Ning Guo", "Mu Xu", "Hang Zhang", "Ming Qian"], "brief": "\u8bba\u6587\u63d0\u51fa ABot-Recon\uff0c\u4e00\u79cd\u9762\u5411\u8d85\u957f\u89c6\u9891\u7684\u6d41\u5f0f 3D \u91cd\u5efa\u6a21\u578b\uff0c\u4ec5\u7f13\u5b58\u524d 11 \u5e27\u7684 KV \u7279\u5f81\u3002\u5b83\u9884\u6d4b\u5f53\u524d\u76f8\u673a\u5750\u6807\u7cfb\u4e0b\u7684\u70b9\u56fe\u548c\u76f8\u90bb\u5e27\u76f8\u5bf9\u4f4d\u59ff\uff0c\u518d\u901a\u8fc7\u987a\u5e8f\u7ec4\u5408\u6062\u590d\u5168\u5c40\u8f68\u8ff9\u4e0e\u51e0\u4f55\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/amap-cvlab/ABot-Recon", "github_stars": 310, "hf_url": "https://huggingface.co/papers/2608.27529", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u575a\u6301\u4e25\u683c\u5c40\u90e8\u65f6\u5e8f\u72b6\u6001\uff0c\u907f\u514d\u4f9d\u8d56\u968f\u5e8f\u5217\u957f\u5ea6\u589e\u957f\u7684\u957f\u671f\u8bb0\u5fc6\uff0c\u4f7f\u9884\u6d4b\u76ee\u6807\u4e0e\u89c6\u9891\u957f\u5ea6\u65e0\u5173", "\u5f15\u5165\u8f7b\u91cf\u65f6\u95f4\u7ec6\u5316\u5668\uff0c\u5229\u7528\u8fd1\u671f\u89c6\u89c9\u4e0e\u8fd0\u52a8\u4e0a\u4e0b\u6587\u6539\u5584\u76f8\u5bf9\u65cb\u8f6c\uff0c\u964d\u4f4e\u957f\u5e8f\u5217\u7d2f\u79ef\u6f02\u79fb", "\u4f7f\u7528 composition-aware pose loss \u76d1\u7763\u591a\u6b65\u4f4d\u59ff\u7ec4\u5408\uff0c\u5728 Oxford Spires \u4e0a ATE \u8fbe 4.35 m\u3001RPE-R \u8fbe 0.12\u00b0\uff0c\u8f83\u6700\u4f73\u5148\u524d\u65b9\u6cd5\u8bef\u5dee\u7ea6\u964d 40%"], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u89c6\u9891\u7406\u89e3", "\u76f8\u673a\u4f4d\u59ff", "\u6d41\u5f0f\u63a8\u7406"], "num_comments": 4, "on_hf": true, "organization": "Alibaba AMAP CV Lab", "pdf_url": "https://arxiv.org/pdf/2608.27529v1", "published_at": "2026-08-27", "score": 0.561, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (29\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27529.png", "title": "Revisiting Local Context for Long-Horizon Streaming 3D Reconstruction", "tldr": "\u4ec5\u7528\u5c40\u90e8\u4e0a\u4e0b\u6587\u5b9e\u73b0\u957f\u89c6\u9891\u6d41\u5f0f3D\u91cd\u5efa", "upvotes": 29, "what_it_is": "\u8bba\u6587\u63d0\u51fa ABot-Recon\uff0c\u4e00\u79cd\u9762\u5411\u8d85\u957f\u89c6\u9891\u7684\u6d41\u5f0f 3D \u91cd\u5efa\u6a21\u578b\uff0c\u4ec5\u7f13\u5b58\u524d 11 \u5e27\u7684 KV \u7279\u5f81\u3002\u5b83\u9884\u6d4b\u5f53\u524d\u76f8\u673a\u5750\u6807\u7cfb\u4e0b\u7684\u70b9\u56fe\u548c\u76f8\u90bb\u5e27\u76f8\u5bf9\u4f4d\u59ff\uff0c\u518d\u901a\u8fc7\u987a\u5e8f\u7ec4\u5408\u6062\u590d\u5168\u5c40\u8f68\u8ff9\u4e0e\u51e0\u4f55\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u957f\u7a0b 3D \u91cd\u5efa\u5fc5\u987b\u4f9d\u8d56\u957f\u671f\u8bb0\u5fc6\u7684\u601d\u8def\uff0c\u8bc1\u660e\u8bbe\u8ba1\u826f\u597d\u7684\u5c40\u90e8\u7b49\u53d8\u9884\u6d4b\u4e0e\u7ec4\u5408\u76d1\u7763\u4e5f\u80fd\u83b7\u5f97\u66f4\u5f3a\u957f\u65f6\u7a33\u5b9a\u6027\uff0c\u5177\u5907\u5728\u7ebf\u3001\u4f4e\u5185\u5b58\u3001\u957f\u89c6\u9891\u91cd\u5efa\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Language model pretraining has become almost synonymous with prohibitive cost, placing it out of reach for much of the academic and open-source communities. Although strong open-source efforts already exist, including open-weight models and open-source training recipes, a cost-efficient, hardware-accessible, and open-source pretraining recipe has long been missing. Even at a small scale, training Llama-3.2-3B costs over \\$1.5M, and reproducing SmolLM3-3B needs over \\$700K. In this report, we present an open pretraining recipe designed to lower this barrier. Using this recipe, we train a collection of Puro-2B models from scratch on up to 1.4 trillion tokens with FP8 precision on consumer-grade RTX 5090 GPUs. The models in the collection differ in token budgets and selected recipe variants. Our best model is trained at a compute cost of less than \\$6.9K and approaches Qwen2.5-1.5B performance under our evaluation protocol. This cost efficiency is enabled by a combination of approaches, including hardware selection, low-precision training, hyperball optimization, curriculum model averaging, and the data recipe. Beyond the recipe itself, we provide two additional results. First, across the Puro-2B collection, we derive a Puro Cost Scaling Law that relates training cost to average model performance; the fitted law suggests that about \\$4.4K, less than \\$5,090, is sufficient to reach the performance of Qwen2-1.5B. Second, as an end-to-end case study, we examine how pretraining data curricula shape downstream performance after post-training. Such controlled studies are enabled by having access to the full pretraining pipeline rather than model weights alone. We release the full training recipe for Puro-2B, including data, code, and model weights under Apache 2.0 at https://huggingface.co/collections/thu-pacman/puro-2b.", "arxiv_id": "2608.27370", "arxiv_url": "https://arxiv.org/abs/2608.27370", "authors": ["Kairong Luo", "Jiarui Cui", "Yaorui Yin", "Shengqi Chen", "Yiming Yang", "Linxiang Gao", "Yanmohan Wang", "Mingzhe Zhang", "Kaiyue Wen", "Kaifeng Lyu", "Wenguang Chen"], "brief": "\u8bba\u6587\u63d0\u51fa\u5e76\u5f00\u6e90 Puro-2B \u9884\u8bad\u7ec3\u65b9\u6848\uff0c\u5728 RTX 5090 \u7b49\u6d88\u8d39\u7ea7 GPU \u4e0a\u4ee5 FP8 \u7cbe\u5ea6\u4ece\u96f6\u8bad\u7ec3\u6700\u9ad8 1.4 \u4e07\u4ebf token \u7684 2B \u8bed\u8a00\u6a21\u578b\u3002\u6700\u4f73\u6a21\u578b\u8bad\u7ec3\u8ba1\u7b97\u6210\u672c\u4f4e\u4e8e 6900 \u7f8e\u5143\uff0c\u6027\u80fd\u63a5\u8fd1 Qwen2.5-1.5B\uff0c\u5e76\u53d1\u5e03\u6570\u636e\u3001\u4ee3\u7801\u548c\u6743\u91cd\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/thu-pacman/Puro-Megatron", "github_stars": 48, "hf_url": "https://huggingface.co/papers/2608.27370", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u6d88\u8d39\u7ea7\u786c\u4ef6\u3001FP8 \u4f4e\u7cbe\u5ea6\u8bad\u7ec3\u3001hyperball optimization\u3001curriculum model averaging \u548c\u6570\u636e\u914d\u65b9\u5171\u540c\u964d\u4f4e\u9884\u8bad\u7ec3\u6210\u672c", "\u63d0\u51fa Puro Cost Scaling Law\uff0c\u5c06\u8bad\u7ec3\u6210\u672c\u4e0e\u5e73\u5747\u6a21\u578b\u6027\u80fd\u5173\u8054\uff0c\u4f30\u8ba1\u7ea6 4400 \u7f8e\u5143\u5373\u53ef\u8fbe\u5230 Qwen2-1.5B \u6c34\u5e73", "\u5229\u7528\u5b8c\u6574\u53ef\u63a7\u7684\u9884\u8bad\u7ec3\u6d41\u6c34\u7ebf\u7814\u7a76\u6570\u636e\u8bfe\u7a0b\u5bf9\u540e\u8bad\u7ec3\u4e0b\u6e38\u8868\u73b0\u7684\u5f71\u54cd\uff0c\u800c\u4e0d\u53ea\u662f\u53d1\u5e03\u6a21\u578b\u6743\u91cd"], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u4f4e\u7cbe\u5ea6\u8bad\u7ec3", "\u5f00\u6e90\u6a21\u578b"], "num_comments": 4, "on_hf": true, "organization": "PACMAN Group, Tsinghua University", "pdf_url": "https://arxiv.org/pdf/2608.27370v1", "published_at": "2026-08-27", "score": 0.544, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27370.png", "title": "Puro-2B: Poor Lab\u0027s Qwen2-1.5B Trained on RTX 5090 within $5090", "tldr": "\u7528\u6d88\u8d39\u7ea7\u663e\u5361\u4f4e\u6210\u672c\u9884\u8bad\u7ec32B\u8bed\u8a00\u6a21\u578b", "upvotes": 28, "what_it_is": "\u8bba\u6587\u63d0\u51fa\u5e76\u5f00\u6e90 Puro-2B \u9884\u8bad\u7ec3\u65b9\u6848\uff0c\u5728 RTX 5090 \u7b49\u6d88\u8d39\u7ea7 GPU \u4e0a\u4ee5 FP8 \u7cbe\u5ea6\u4ece\u96f6\u8bad\u7ec3\u6700\u9ad8 1.4 \u4e07\u4ebf token \u7684 2B \u8bed\u8a00\u6a21\u578b\u3002\u6700\u4f73\u6a21\u578b\u8bad\u7ec3\u8ba1\u7b97\u6210\u672c\u4f4e\u4e8e 6900 \u7f8e\u5143\uff0c\u6027\u80fd\u63a5\u8fd1 Qwen2.5-1.5B\uff0c\u5e76\u53d1\u5e03\u6570\u636e\u3001\u4ee3\u7801\u548c\u6743\u91cd\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5c0f\u89c4\u6a21\u5927\u8bed\u8a00\u6a21\u578b\u4ece\u96f6\u9884\u8bad\u7ec3\u7684\u95e8\u69db\u5927\u5e45\u964d\u5230\u5b66\u672f\u548c\u5f00\u6e90\u793e\u533a\u53ef\u627f\u53d7\u8303\u56f4\uff0c\u5e76\u63d0\u4f9b\u53ef\u590d\u73b0\u7684\u7aef\u5230\u7aef\u914d\u65b9\uff0c\u6709\u52a9\u4e8e\u4f4e\u6210\u672c\u6a21\u578b\u8bad\u7ec3\u3001\u6570\u636e\u8bfe\u7a0b\u7814\u7a76\u548c\u5f00\u653e\u6a21\u578b\u751f\u6001\u53d1\u5c55\u3002"}, {"abstract": "Due to the nature of quadratic attention, Large Language Models (LLMs) consume a lot of memory and energy. Every new token costs more than the previous one. For each additional token, the keys and values must be stored in memory indefinitely, which is unsustainable. Several alternatives have been proposed to fix the quadratic scaling problem, one of which is retrofitting LLMs to use Linear Attention. This idea has attracted a lot of attention, given its promise to solve the quadratic scaling problem with state-of-the-art performance at low cost. However, this line of research has not been properly compared to simpler baselines. In this work, we show that Sliding Window Attention (SWA) with sinks performs as well or better than post-trained Linear Attention models. We observe this across multiple LLMs on various downstream tasks. For long-context reasoning tasks (Needle-in-a-Haystack and BABILong), SWA achieves massively higher performance (2 to 10 times higher than linear attention). SWA requires no post-training, is extremely fast, and requires low memory; therefore, making it an extremely cheap and reliable solution. To reduce inference memory cost, we strongly recommend switching to SWA instead of post-training linear models. Linear attention models may have shown some promise, but they likely require to be trained from scratch or extensive post-training in order to even match SWA.", "arxiv_id": "2608.28444", "arxiv_url": "https://arxiv.org/abs/2608.28444", "authors": ["Alexia Jolicoeur-Martineau", "Rhea Sanjay Sukthanker", "Pashmina Cameron", "Emy Gervais"], "brief": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u5c06\u5927\u6a21\u578b\u6539\u9020\u6210\u7ebf\u6027\u6ce8\u610f\u529b\u4e0e\u66f4\u7b80\u5355\u7684\u5e26 attention sinks \u7684\u6ed1\u52a8\u7a97\u53e3\u6ce8\u610f\u529b\uff08SWA\uff09\u3002\u7ed3\u679c\u663e\u793a\uff0cSWA \u65e0\u9700\u540e\u8bad\u7ec3\u5373\u53ef\u5728\u591a\u79cd\u4e0b\u6e38\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u540e\u8bad\u7ec3\u7ebf\u6027\u6ce8\u610f\u529b\u6a21\u578b\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28444", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u591a\u4e2a LLM \u548c\u591a\u7c7b\u4e0b\u6e38\u4efb\u52a1\u4e2d\uff0cSWA with sinks \u8868\u73b0\u4e0d\u5f31\u4e8e\u751a\u81f3\u4f18\u4e8e\u7ebf\u6027\u6ce8\u610f\u529b\u6539\u9020\u65b9\u6848", "\u5728 Needle-in-a-Haystack \u548c BABILong \u7b49\u957f\u4e0a\u4e0b\u6587\u63a8\u7406\u4efb\u52a1\u4e0a\uff0cSWA \u6027\u80fd\u6bd4\u7ebf\u6027\u6ce8\u610f\u529b\u9ad8 2 \u5230 10 \u500d", "SWA \u65e0\u9700\u989d\u5916\u540e\u8bad\u7ec3\uff0c\u63a8\u7406\u901f\u5ea6\u5feb\u3001\u663e\u5b58\u5360\u7528\u4f4e\uff0c\u662f\u964d\u4f4e KV cache \u6210\u672c\u7684\u7b80\u5355\u53ef\u9760\u57fa\u7ebf"], "keywords": ["\u9ad8\u6548\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u4f18\u5316"], "num_comments": 2, "on_hf": true, "organization": "Microsoft", "pdf_url": "https://arxiv.org/pdf/2608.28444v1", "published_at": "2026-08-28", "score": 0.513, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28444.png", "title": "Sliding-window beats linear attention", "tldr": "\u6ed1\u52a8\u7a97\u53e3\u6ce8\u610f\u529b\u4f18\u4e8e\u540e\u8bad\u7ec3\u7ebf\u6027\u6ce8\u610f\u529b", "upvotes": 13, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u5c06\u5927\u6a21\u578b\u6539\u9020\u6210\u7ebf\u6027\u6ce8\u610f\u529b\u4e0e\u66f4\u7b80\u5355\u7684\u5e26 attention sinks \u7684\u6ed1\u52a8\u7a97\u53e3\u6ce8\u610f\u529b\uff08SWA\uff09\u3002\u7ed3\u679c\u663e\u793a\uff0cSWA \u65e0\u9700\u540e\u8bad\u7ec3\u5373\u53ef\u5728\u591a\u79cd\u4e0b\u6e38\u4efb\u52a1\u4e0a\u8fbe\u5230\u6216\u8d85\u8fc7\u540e\u8bad\u7ec3\u7ebf\u6027\u6ce8\u610f\u529b\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u540e\u8bad\u7ec3\u7ebf\u6027\u6ce8\u610f\u529b\u53ef\u4f4e\u6210\u672c\u66ff\u4ee3\u4e8c\u6b21\u6ce8\u610f\u529b\u201d\u7684\u6d41\u884c\u5047\u8bbe\uff0c\u5f3a\u8c03\u7b80\u5355\u7684\u6ed1\u52a8\u7a97\u53e3\u6ce8\u610f\u529b\u57fa\u7ebf\u5728\u5b9e\u9645\u957f\u4e0a\u4e0b\u6587\u548c\u63a8\u7406\u6210\u672c\u4e0a\u66f4\u5177\u7ade\u4e89\u529b\uff0c\u5bf9\u9ad8\u6548 LLM \u90e8\u7f72\u5177\u6709\u76f4\u63a5\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Physical understanding and reasoning depend on forming compact and generalizable representations of the world. While modern vision-language models can recognize and explain diverse physical events, they often lack explicit representations of the underlying mechanisms-such as object states, physical parameters, and governing dynamics-needed for reliably reasoning how the world evolves and responds to interventions. In this work, we introduce Code-as-World, a paradigm that represents physical worlds through executable world representations. By expressing physical composition, dynamic evolution, and visual appearance as executable code, Code-as-World provides a compact, quantitatively grounded, and controllable abstraction of the physical world. To construct such representations from multimodal observations, such as natural-language descriptions or real-world videos, we develop an agentic discovery loop inspired by abductive reasoning, where an agent proposes, executes, renders, verifies, and iteratively refines executable world hypotheses. As a concrete application, we use verified executable worlds to provide scalable physical supervision for training vision-language models on quantitative physical reasoning. Experiments show that Code-as-World-VL achieves state-of-the-art performance on QuantiPhy and surpasses leading proprietary models, highlighting the potential of executable world representations as a scalable foundation for physical intelligence.", "arxiv_id": "2608.27549", "arxiv_url": "https://arxiv.org/abs/2608.27549", "authors": ["Hanyang Wang", "Yimo Cai", "Weiliang Chen", "Jiawei Chi", "Haowen Sun", "Qiyu Dai", "Yi-Hsin Hung", "Xingzhuo Guo", "Jinshan Ren", "Runmao Yao", "Ziwei Liu", "Mingsheng Long", "Yueqi Duan", "Jun Gao", "Jiangran Lyu", "Fangfu Liu", "Jialong Wu"], "brief": "\u8bba\u6587\u63d0\u51fa Code-as-World\uff0c\u5c06\u7269\u4f53\u7ec4\u6210\u3001\u52a8\u6001\u6f14\u5316\u548c\u89c6\u89c9\u5916\u89c2\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\u5f62\u5f0f\u7684\u4e16\u754c\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e00\u4e2a\u667a\u80fd\u4f53\u5f0f\u53d1\u73b0\u5faa\u73af\uff0c\u4ece\u6587\u672c\u6216\u89c6\u9891\u7b49\u591a\u6a21\u6001\u89c2\u6d4b\u4e2d\u63d0\u51fa\u3001\u6267\u884c\u3001\u6e32\u67d3\u3001\u9a8c\u8bc1\u5e76\u8fed\u4ee3\u4fee\u6b63\u7269\u7406\u4e16\u754c\u5047\u8bbe\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mirros-lab/code-as-world", "github_stars": 280, "hf_url": "https://huggingface.co/papers/2608.27549", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ee5\u53ef\u6267\u884c\u4ee3\u7801\u663e\u5f0f\u5efa\u6a21\u7269\u4f53\u72b6\u6001\u3001\u7269\u7406\u53c2\u6570\u548c\u52a8\u529b\u5b66\u89c4\u5f8b\uff0c\u63d0\u4f9b\u53ef\u63a7\u4e14\u53ef\u91cf\u5316\u7684\u7269\u7406\u4e16\u754c\u62bd\u8c61", "\u8bbe\u8ba1\u53d7\u6eaf\u56e0\u63a8\u7406\u542f\u53d1\u7684 agentic discovery loop\uff0c\u7528\u4e8e\u4ece\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u6216\u771f\u5b9e\u89c6\u9891\u4e2d\u81ea\u52a8\u53d1\u73b0\u53ef\u6267\u884c\u4e16\u754c\u8868\u793a", "\u5229\u7528\u9a8c\u8bc1\u540e\u7684\u53ef\u6267\u884c\u4e16\u754c\u751f\u6210\u53ef\u6269\u5c55\u7269\u7406\u76d1\u7763\uff0c\u8bad\u7ec3\u51fa\u7684 Code-as-World-VL \u5728 QuantiPhy \u4e0a\u8fbe\u5230\u6700\u4f18\u5e76\u8d85\u8fc7\u9886\u5148\u95ed\u6e90\u6a21\u578b"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u7269\u7406\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "MirroS", "pdf_url": "https://arxiv.org/pdf/2608.27549v1", "published_at": "2026-08-27", "score": 0.505, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (43\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27549.png", "title": "Code as Worlds: Agentic Discovery of Executable World Representations for Physical Reasoning", "tldr": "\u7528\u53ef\u6267\u884c\u4ee3\u7801\u8868\u793a\u7269\u7406\u4e16\u754c\u5e76\u8bad\u7ec3\u7269\u7406\u63a8\u7406\u6a21\u578b", "upvotes": 43, "what_it_is": "\u8bba\u6587\u63d0\u51fa Code-as-World\uff0c\u5c06\u7269\u4f53\u7ec4\u6210\u3001\u52a8\u6001\u6f14\u5316\u548c\u89c6\u89c9\u5916\u89c2\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\u5f62\u5f0f\u7684\u4e16\u754c\u6a21\u578b\u3002\u5b83\u901a\u8fc7\u4e00\u4e2a\u667a\u80fd\u4f53\u5f0f\u53d1\u73b0\u5faa\u73af\uff0c\u4ece\u6587\u672c\u6216\u89c6\u9891\u7b49\u591a\u6a21\u6001\u89c2\u6d4b\u4e2d\u63d0\u51fa\u3001\u6267\u884c\u3001\u6e32\u67d3\u3001\u9a8c\u8bc1\u5e76\u8fed\u4ee3\u4fee\u6b63\u7269\u7406\u4e16\u754c\u5047\u8bbe\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7269\u7406\u63a8\u7406\u4ece\u9690\u5f0f\u89c6\u89c9\u8bed\u8a00\u6a21\u5f0f\u8bc6\u522b\u63a8\u8fdb\u5230\u663e\u5f0f\u3001\u53ef\u6267\u884c\u3001\u53ef\u5e72\u9884\u7684\u4e16\u754c\u8868\u793a\uff0c\u4e3a\u53ef\u6269\u5c55\u7269\u7406\u667a\u80fd\u548c\u66f4\u53ef\u9760\u7684\u5b9a\u91cf\u63a8\u7406\u63d0\u4f9b\u4e86\u65b0\u8def\u5f84\u3002"}, {"abstract": "Evaluation is shifting from static QA toward agentic settings where models act through external tools. We identify a critical yet underexplored capability within this space - dexterous visual tool use: fine-grained, closed-loop parameterized visual action in which models infer tool parameters from visual evidence, and those parameters directly govern the final result. Existing benchmarks cover web navigation, GUI operation, and software engineering, but rarely target this coupling between visual evidence and execution precision. We propose EASEL, a benchmark evaluating a controlled instance of dexterous visual tool use that adopts reference-guided visual reconstruction as its primary proxy task: the agent incrementally paints a canvas to match a reference image. EASEL additionally includes semantic tasks spanning region annotation, handwriting, and path planning. We further provide EASEL-Data, a 440k-sample two-stage curriculum dataset for trajectory supervision, and EASEL-9B to investigate its effect on this capability. Evaluation of 25 models reveals that current multimodal agents systematically struggle on EASEL. Reconstruction similarity bottlenecks at low levels (0.40-0.54), while trajectory diagnostics expose severe closed-loop instability - models typically saturate early or degrade post-peak. Semantic tasks reveal sharp capability boundaries in precision annotation and path planning. EASEL-9B, trained on EASEL-Data, surpasses the base model by a relative 6.3%, ranking third among all evaluated models.", "arxiv_id": "2608.25417", "arxiv_url": "https://arxiv.org/abs/2608.25417", "authors": ["Shudong Liu", "Dongyang Chen", "Enci Zhang", "Jinwei Liang", "Zheng Ma", "Lewei Lu"], "brief": "\u8bba\u6587\u63d0\u51fa EASEL \u57fa\u51c6\uff0c\u7528\u53c2\u8003\u56fe\u50cf\u5f15\u5bfc\u7684\u9010\u6b65\u7ed8\u753b\u91cd\u5efa\u6765\u8bc4\u4f30\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u7cbe\u7ec6\u3001\u95ed\u73af\u3001\u53c2\u6570\u5316\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u80fd\u529b\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 44 \u4e07\u6837\u672c\u7684 EASEL-Data \u8f68\u8ff9\u76d1\u7763\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3 EASEL-9B \u9a8c\u8bc1\u5176\u63d0\u5347\u6548\u679c\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/OOOHS/EASEL", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25417", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["EASEL \u805a\u7126\u201c\u770b\u56fe\u63a8\u65ad\u5de5\u5177\u53c2\u6570\u5e76\u7cbe\u786e\u6267\u884c\u201d\u7684\u80fd\u529b\uff0c\u533a\u522b\u4e8e\u5e38\u89c1\u7f51\u9875\u5bfc\u822a\u3001GUI \u64cd\u4f5c\u6216\u8f6f\u4ef6\u5de5\u7a0b\u7c7b\u667a\u80fd\u4f53\u8bc4\u6d4b\u3002", "\u57fa\u51c6\u4efb\u52a1\u5305\u62ec\u53c2\u8003\u56fe\u50cf\u91cd\u5efa\uff0c\u4ee5\u53ca\u533a\u57df\u6807\u6ce8\u3001\u624b\u5199\u3001\u8def\u5f84\u89c4\u5212\u7b49\u8bed\u4e49\u4efb\u52a1\uff0c\u7528\u4e8e\u8bca\u65ad\u89c6\u89c9\u8bc1\u636e\u5230\u52a8\u4f5c\u53c2\u6570\u7684\u95ed\u73af\u63a7\u5236\u80fd\u529b\u3002", "\u5bf9 25 \u4e2a\u6a21\u578b\u8bc4\u6d4b\u53d1\u73b0\u5f53\u524d\u591a\u6a21\u6001\u667a\u80fd\u4f53\u8868\u73b0\u666e\u904d\u8f83\u5f31\uff0c\u91cd\u5efa\u76f8\u4f3c\u5ea6\u4ec5\u7ea6 0.40-0.54\uff0c\u4e14\u5e38\u51fa\u73b0\u65e9\u671f\u9971\u548c\u6216\u5cf0\u503c\u540e\u9000\u5316\uff1bEASEL-9B \u76f8\u6bd4\u57fa\u5ea7\u6a21\u578b\u76f8\u5bf9\u63d0\u5347 6.3%\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u667a\u80fd\u4f53", "\u89c6\u89c9\u5de5\u5177\u4f7f\u7528", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "EASEL-Bench", "pdf_url": "https://arxiv.org/pdf/2608.25417v1", "published_at": "2026-08-26", "score": 0.503, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25417.png", "title": "Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents", "tldr": "EASEL\u8bc4\u6d4b\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7cbe\u7ec6\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u80fd\u529b", "upvotes": 14, "what_it_is": "\u8bba\u6587\u63d0\u51fa EASEL \u57fa\u51c6\uff0c\u7528\u53c2\u8003\u56fe\u50cf\u5f15\u5bfc\u7684\u9010\u6b65\u7ed8\u753b\u91cd\u5efa\u6765\u8bc4\u4f30\u591a\u6a21\u6001\u667a\u80fd\u4f53\u7684\u7cbe\u7ec6\u3001\u95ed\u73af\u3001\u53c2\u6570\u5316\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u80fd\u529b\u3002\u4f5c\u8005\u8fd8\u6784\u5efa\u4e86 44 \u4e07\u6837\u672c\u7684 EASEL-Data \u8f68\u8ff9\u76d1\u7763\u6570\u636e\u96c6\uff0c\u5e76\u8bad\u7ec3 EASEL-9B \u9a8c\u8bc1\u5176\u63d0\u5347\u6548\u679c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8865\u8db3\u4e86\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e2d\u5bf9\u7cbe\u7ec6\u89c6\u89c9\u6267\u884c\u80fd\u529b\u7684\u7a7a\u767d\uff0c\u63ed\u793a\u73b0\u6709\u591a\u6a21\u6001\u6a21\u578b\u5728\u95ed\u73af\u89c6\u89c9\u5de5\u5177\u4f7f\u7528\u4e0a\u7684\u660e\u663e\u77ed\u677f\uff0c\u5e76\u63d0\u4f9b\u4e86\u53ef\u8bad\u7ec3\u7684\u6570\u636e\u96c6\u4e0e\u8bca\u65ad\u6846\u67b6\uff0c\u5bf9\u89c6\u89c9\u667a\u80fd\u4f53\u3001GUI/\u5de5\u5177\u64cd\u4f5c\u548c\u673a\u5668\u4eba\u5f0f\u7cbe\u7ec6\u63a7\u5236\u90fd\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Factual question answering (QA) typically assumes a single canonical answer, obscuring whether large language models (LLMs) retain divergent accounts of long-tail facts. To address this gap, we introduce ElephantBench, a closed-book knowledge probe comprising 1,094 questions generated through an auditable graph-based pipeline. The pipeline retrieves related documents from a low-exposure web corpus, identifies naturally occurring disagreements, and converts them into multi-account QA records. Each answer is verified against the originating documents and authoritative public web sources and is then reviewed by human annotators. Across 32 models, even the strongest model recovers both accounts on only 52.4% of questions, while on nearly all remaining questions it recalls one account but omits the other. Scaling model size and inference-time reasoning improve recall but do not eliminate this incompleteness. Corpus analysis further shows that exposure imbalance favors the dominant account, whereas greater minority-side exposure is associated with more complete recall. These findings establish ElephantBench as a reproducible knowledge probe for diagnosing epistemic myopia in parametric memory. More broadly, our graph-based benchmark construction pipeline provides an efficient and scalable way to turn long-tail corpora into source-traceable knowledge probes, supporting efforts to evaluate and advance the epistemic rigour of next-generation LLMs. Code is available at https://github.com/Tencent/ElephantBench.", "arxiv_id": "2608.28478", "arxiv_url": "https://arxiv.org/abs/2608.28478", "authors": ["Zhuoshi Pan", "Junru Lu", "Yan Qian", "H. Vicky Zhao", "Di Yin", "Xing Sun"], "brief": "\u8bba\u6587\u63d0\u51fa ElephantBench\uff0c\u4e00\u4e2a\u95ed\u5377\u4e8b\u5b9e\u95ee\u7b54\u57fa\u51c6\uff0c\u7528\u4e8e\u63a2\u6d4b\u5927\u8bed\u8a00\u6a21\u578b\u5728\u957f\u5c3e\u4e8b\u5b9e\u4e2d\u662f\u5426\u80fd\u540c\u65f6\u8bb0\u4f4f\u76f8\u4e92\u5206\u6b67\u7684\u591a\u79cd\u8bf4\u6cd5\u3002\u4f5c\u8005\u901a\u8fc7\u53ef\u5ba1\u8ba1\u7684\u56fe\u6784\u5efa\u6d41\u7a0b\uff0c\u4ece\u4f4e\u66dd\u5149\u7f51\u9875\u8bed\u6599\u4e2d\u53d1\u73b0\u81ea\u7136\u4e89\u8bae\u5e76\u751f\u62101094\u4e2a\u591a\u7b54\u6848\u95ee\u7b54\u6837\u672c\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/Tencent/ElephantBench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2608.28478", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d632\u4e2a\u6a21\u578b\u8bc4\u6d4b\uff0c\u6700\u5f3a\u6a21\u578b\u4e5f\u4ec5\u572852.4%\u7684\u95ee\u9898\u4e0a\u540c\u65f6\u53ec\u56de\u4e24\u79cd\u8bf4\u6cd5\uff0c\u591a\u6570\u5931\u8d25\u6848\u4f8b\u662f\u53ea\u8bb0\u4f4f\u5176\u4e2d\u4e00\u65b9", "\u6a21\u578b\u89c4\u6a21\u6269\u5927\u4e0e\u63a8\u7406\u65f6\u8ba1\u7b97\u80fd\u63d0\u5347\u53ec\u56de\u7387\uff0c\u4f46\u65e0\u6cd5\u6d88\u9664\u5bf9\u5c11\u6570\u89c2\u70b9\u6216\u4f4e\u66dd\u5149\u4e8b\u5b9e\u7684\u9057\u6f0f", "\u8bed\u6599\u5206\u6790\u663e\u793a\uff0c\u8bad\u7ec3\u66b4\u9732\u4e0d\u5747\u4f1a\u504f\u5411\u4e3b\u6d41\u8bf4\u6cd5\uff0c\u800c\u5c11\u6570\u65b9\u66dd\u5149\u8d8a\u591a\uff0c\u6a21\u578b\u8d8a\u53ef\u80fd\u5b8c\u6574\u53ec\u56de\u5206\u6b67\u77e5\u8bc6"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u8bc4\u6d4b", "\u957f\u5c3e\u4e8b\u5b9e", "\u95ee\u7b54"], "num_comments": 2, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2608.28478v1", "published_at": "2026-08-28", "score": 0.491, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28478.png", "title": "Blind Men and the Elephant: Probing the Epistemic Myopia of LLMs under Long-Tail Divergent Knowledge", "tldr": "ElephantBench\u63ed\u793aLLM\u957f\u5c3e\u5206\u6b67\u77e5\u8bc6\u8bb0\u5fc6\u4e0d\u5b8c\u6574", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa ElephantBench\uff0c\u4e00\u4e2a\u95ed\u5377\u4e8b\u5b9e\u95ee\u7b54\u57fa\u51c6\uff0c\u7528\u4e8e\u63a2\u6d4b\u5927\u8bed\u8a00\u6a21\u578b\u5728\u957f\u5c3e\u4e8b\u5b9e\u4e2d\u662f\u5426\u80fd\u540c\u65f6\u8bb0\u4f4f\u76f8\u4e92\u5206\u6b67\u7684\u591a\u79cd\u8bf4\u6cd5\u3002\u4f5c\u8005\u901a\u8fc7\u53ef\u5ba1\u8ba1\u7684\u56fe\u6784\u5efa\u6d41\u7a0b\uff0c\u4ece\u4f4e\u66dd\u5149\u7f51\u9875\u8bed\u6599\u4e2d\u53d1\u73b0\u81ea\u7136\u4e89\u8bae\u5e76\u751f\u62101094\u4e2a\u591a\u7b54\u6848\u95ee\u7b54\u6837\u672c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u957f\u5c3e\u4e8b\u5b9e\u4e2d\u7684\u201c\u591a\u79cd\u53ef\u4fe1\u53d9\u8ff0\u201d\u7eb3\u5165\u8bc4\u6d4b\uff0c\u6311\u6218\u4e86\u4f20\u7edf\u5355\u4e00\u6807\u51c6\u7b54\u6848\u7684\u4e8b\u5b9e\u95ee\u7b54\u8303\u5f0f\uff0c\u6709\u52a9\u4e8e\u8bca\u65adLLM\u53c2\u6570\u8bb0\u5fc6\u7684\u8ba4\u77e5\u77ed\u89c6\u95ee\u9898\uff0c\u5e76\u63d0\u4f9b\u4e86\u53ef\u590d\u73b0\u3001\u53ef\u8ffd\u6eaf\u7684\u57fa\u51c6\u6784\u5efa\u65b9\u6cd5\u3002"}, {"abstract": "Large language models (LLMs) are increasingly deployed with layered defenses, yet malicious prompts can still bypass them. Interpretability methods can expose model-internal signals along the generation path that could inform enforcement, but these signals are not security controls by themselves. Deployments that adapt them for safety typically couple each signal to its own calibration, policy logic, and intervention code, so each new artifact creates integration work instead of strengthening a shared defense. We present Language Model Security Modules (LMSM), a security framework that adapts the separation behind Linux Security Modules (LSM) to LLM serving. In LMSM, a selected security backend exposes calibrated evidence, a versioned policy evaluates active rules over trusted per-request context, and a separate gate authorizes buffered output release. This design separates mediation correctness from policy effectiveness, and it allows backend, rule, or schedule changes without rebuilding request handling or enforcement. Our prototype shows the separation working in practice: with Hugging Face Transformers and continuously batched vLLM, the same substrate hosts artifact-backed sparse autoencoder (SAE) and transcoder deployments and task-fitted dense probes, preserves request-specific decisions under scheduler churn, and selectively enforces and composes multiple rules per request. On Qwen3-4B, LMSM-Checkpoint reduces HarmBench attack success rate from 39.20% to 3.32%, with XSTest false refusals rising from 2.40% to 4.40%, while retaining 98.14% of the throughput of a matched serving path that performs no monitoring work at 32 active sequences. LMSM gives advances in interpretability and model-internal analysis a common path to runtime enforcement.", "arxiv_id": "2608.25697", "arxiv_url": "https://arxiv.org/abs/2608.25697", "authors": ["XiuYu Zhang", "Bonan Ruan", "Junfeng Fang", "An Zhang", "Tat-Seng Chua", "Zhenkai Liang"], "brief": "\u8bba\u6587\u63d0\u51fa Language Model Security Modules\uff08LMSM\uff09\uff0c\u5c06 Linux Security Modules \u7684\u5206\u79bb\u5f0f\u5b89\u5168\u67b6\u6784\u8fc1\u79fb\u5230 LLM \u670d\u52a1\u4e2d\u3002\u5b83\u628a\u6a21\u578b\u5185\u90e8\u4fe1\u53f7\u540e\u7aef\u3001\u7248\u672c\u5316\u7b56\u7565\u8bc4\u4f30\u4e0e\u8f93\u51fa\u653e\u884c\u95e8\u63a7\u89e3\u8026\uff0c\u4f7f\u53ef\u89e3\u91ca\u6027\u63a2\u9488\u7b49\u8bc1\u636e\u80fd\u7edf\u4e00\u63a5\u5165\u8fd0\u884c\u65f6\u5b89\u5168\u6267\u884c\u3002", "categories": ["cs.CR"], "github_repo": "https://github.com/xiuyuz/LMSM", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.25697", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u652f\u6301\u7a00\u758f\u81ea\u7f16\u7801\u5668\uff08SAE\uff09\u3001transcoder \u548c\u5bc6\u96c6\u63a2\u9488\u7b49\u591a\u79cd\u6a21\u578b\u5185\u90e8\u5b89\u5168\u4fe1\u53f7\u4f5c\u4e3a\u53ef\u6821\u51c6\u540e\u7aef", "\u5728 Hugging Face Transformers \u4e0e\u8fde\u7eed\u6279\u5904\u7406 vLLM \u4e0a\u5b9e\u73b0\uff0c\u80fd\u5728\u8c03\u5ea6\u53d8\u5316\u4e0b\u4fdd\u6301\u8bf7\u6c42\u7ea7\u5b89\u5168\u51b3\u7b56\u4e00\u81f4", "\u5728 Qwen3-4B \u4e0a\u5c06 HarmBench \u653b\u51fb\u6210\u529f\u7387\u4ece 39.20% \u964d\u81f3 3.32%\uff0c\u541e\u5410\u4fdd\u7559 98.14%"], "keywords": ["\u5927\u6a21\u578b\u5b89\u5168", "\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u670d\u52a1", "\u5b89\u5168\u6846\u67b6"], "num_comments": 2, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2608.25697v1", "published_at": "2026-08-26", "score": 0.443, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.25697.png", "title": "LMSM: LLM Security Framework Inspired by Linux Security Modules", "tldr": "\u501f\u9274LSM\u6784\u5efaLLM\u8fd0\u884c\u65f6\u5b89\u5168\u6846\u67b6", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Language Model Security Modules\uff08LMSM\uff09\uff0c\u5c06 Linux Security Modules \u7684\u5206\u79bb\u5f0f\u5b89\u5168\u67b6\u6784\u8fc1\u79fb\u5230 LLM \u670d\u52a1\u4e2d\u3002\u5b83\u628a\u6a21\u578b\u5185\u90e8\u4fe1\u53f7\u540e\u7aef\u3001\u7248\u672c\u5316\u7b56\u7565\u8bc4\u4f30\u4e0e\u8f93\u51fa\u653e\u884c\u95e8\u63a7\u89e3\u8026\uff0c\u4f7f\u53ef\u89e3\u91ca\u6027\u63a2\u9488\u7b49\u8bc1\u636e\u80fd\u7edf\u4e00\u63a5\u5165\u8fd0\u884c\u65f6\u5b89\u5168\u6267\u884c\u3002", "why_notable": "\u5b83\u628a\u53ef\u89e3\u91ca\u6027\u5206\u6790\u4ece\u201c\u79bb\u7ebf\u8bca\u65ad\u201d\u63a8\u8fdb\u5230\u53ef\u7ec4\u5408\u3001\u53ef\u66ff\u6362\u7684\u5728\u7ebf\u5b89\u5168\u63a7\u5236\uff0c\u4e3a LLM \u90e8\u7f72\u63d0\u4f9b\u7c7b\u4f3c\u64cd\u4f5c\u7cfb\u7edf\u5b89\u5168\u6a21\u5757\u7684\u901a\u7528\u9632\u62a4\u63a5\u53e3\uff0c\u517c\u987e\u9632\u5fa1\u6548\u679c\u4e0e\u670d\u52a1\u541e\u5410\u3002"}, {"abstract": "LLM agents increasingly modify their own prompts, tools, middleware, resources, and execution harnesses at runtime. Such self-evolution can improve capability, but a successful mutation may leave persistent effects that cannot be safely reversed in states different from the one in which it was created. We introduce EvoUndo, a framework for representing, synthesizing, diagnosing, and independently verifying recoverability of model-generated self-modifications across counterfactual states. Across 600 unseen one-shot self-evolution tasks, we identify 197 capability-improving mutations that fail recoverability verification. Under the original recovery representation, conventional repair strategies recover 0/197 of these natural failures. Deterministic oracle analysis recovers 48/197 under the original recovery language L0, while the extended recovery calculus increases empirical oracle recovery to 191/197. A protocol-locked 2x2 grounding-by-expressivity intervention then separates two bottlenecks: exact state-address grounding increases successful recovery from 0/48 to 38/48 (79.2%) when the original language is sufficient, while extending the recovery language enables recovery on 142/143 (99.3%) failures in the oracle-defined S1 stratum. On the primary gpt-oss-120b backbone, adding exact-address diagnostics to the richer language reduces recovery to 133/143 (93.0%); a Qwen3.8-27B replication preserves the grounding and expressivity effects but not this negative interaction, indicating that the latter is model-dependent. These results indicate that reliable agent self-evolution requires co-designing verification, state grounding, witness semantics, and recovery-language expressivity rather than relying on iterative prompting alone.", "arxiv_id": "2608.28363", "arxiv_url": "https://arxiv.org/abs/2608.28363", "authors": ["Tanmay Sah", "Dolly Sah", "Harshul Jain", "Tanya Sah"], "brief": "\u8bba\u6587\u63d0\u51fa EvoUndo\uff0c\u7528\u4e8e\u8868\u793a\u3001\u5408\u6210\u3001\u8bca\u65ad\u5e76\u72ec\u7acb\u9a8c\u8bc1 LLM \u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u81ea\u4fee\u6539\u7684\u53ef\u6062\u590d\u6027\u3002\u5b83\u91cd\u70b9\u68c0\u67e5\u81ea\u6211\u4fee\u6539\u5728\u4e0d\u540c\u53cd\u4e8b\u5b9e\u72b6\u6001\u4e0b\u662f\u5426\u4ecd\u80fd\u5b89\u5168\u64a4\u9500\uff0c\u800c\u4e0d\u4ec5\u662f\u5728\u4ea7\u751f\u4fee\u6539\u7684\u539f\u59cb\u72b6\u6001\u4e2d\u53ef\u56de\u6eda\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.28363", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5728600\u4e2a\u672a\u89c1\u8fc7\u7684\u4e00\u6b21\u6027\u81ea\u6211\u8fdb\u5316\u4efb\u52a1\u4e2d\uff0c\u53d1\u73b0197\u4e2a\u867d\u63d0\u5347\u80fd\u529b\u4f46\u65e0\u6cd5\u901a\u8fc7\u53ef\u6062\u590d\u6027\u9a8c\u8bc1\u7684\u81ea\u7136\u5931\u8d25\u6848\u4f8b\u3002", "\u5e38\u89c4\u4fee\u590d\u7b56\u7565\u5728\u539f\u59cb\u6062\u590d\u8868\u793a\u4e0b\u5bf9197\u4e2a\u5931\u8d25\u6848\u4f8b\u6062\u590d\u7387\u4e3a0\uff1b\u6269\u5c55\u6062\u590d\u6f14\u7b97\u540e\uff0c oracle \u6062\u590d\u4ece48/197\u63d0\u5347\u5230191/197\u3002", "2x2\u5e72\u9884\u5b9e\u9a8c\u8868\u660e\uff0c\u7cbe\u786e\u72b6\u6001\u5730\u5740 grounding \u4e0e\u66f4\u5f3a\u6062\u590d\u8bed\u8a00\u8868\u8fbe\u80fd\u529b\u662f\u4e24\u4e2a\u5173\u952e\u74f6\u9888\uff0c\u524d\u8005\u5728\u8bed\u8a00\u8db3\u591f\u65f6\u5c06\u6062\u590d\u7387\u63d0\u5347\u523079.2%\uff0c\u540e\u8005\u5728S1\u5c42\u5931\u8d25\u4e0a\u8fbe\u523099.3% oracle\u6062\u590d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u6211\u8fdb\u5316", "\u5b89\u5168\u9a8c\u8bc1", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.28363v1", "published_at": "2026-08-28", "score": 0.404, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28363.png", "title": "EvoUndo: Recoverability-Constrained Self-Evolution for LLM Agent Harnesses", "tldr": "\u8ba9LLM\u667a\u80fd\u4f53\u81ea\u6211\u8fdb\u5316\u4e5f\u80fd\u53ef\u9760\u56de\u6eda", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa EvoUndo\uff0c\u7528\u4e8e\u8868\u793a\u3001\u5408\u6210\u3001\u8bca\u65ad\u5e76\u72ec\u7acb\u9a8c\u8bc1 LLM \u667a\u80fd\u4f53\u8fd0\u884c\u65f6\u81ea\u4fee\u6539\u7684\u53ef\u6062\u590d\u6027\u3002\u5b83\u91cd\u70b9\u68c0\u67e5\u81ea\u6211\u4fee\u6539\u5728\u4e0d\u540c\u53cd\u4e8b\u5b9e\u72b6\u6001\u4e0b\u662f\u5426\u4ecd\u80fd\u5b89\u5168\u64a4\u9500\uff0c\u800c\u4e0d\u4ec5\u662f\u5728\u4ea7\u751f\u4fee\u6539\u7684\u539f\u59cb\u72b6\u6001\u4e2d\u53ef\u56de\u6eda\u3002", "why_notable": "\u968f\u7740LLM\u667a\u80fd\u4f53\u5f00\u59cb\u52a8\u6001\u4fee\u6539\u63d0\u793a\u8bcd\u3001\u5de5\u5177\u548c\u6267\u884c\u6846\u67b6\uff0c\u5b89\u5168\u53ef\u9006\u7684\u81ea\u6211\u8fdb\u5316\u6210\u4e3a\u5173\u952e\u95ee\u9898\u3002\u8be5\u5de5\u4f5c\u7cfb\u7edf\u6027\u63ed\u793a\u4e86\u4ec5\u9760\u8fed\u4ee3\u63d0\u793a\u4fee\u590d\u4e0d\u8db3\u4ee5\u4fdd\u8bc1\u56de\u6eda\u53ef\u9760\u6027\uff0c\u5e76\u63d0\u51fa\u9700\u8981\u8054\u5408\u8bbe\u8ba1\u9a8c\u8bc1\u3001\u72b6\u6001\u5b9a\u4f4d\u3001\u89c1\u8bc1\u8bed\u4e49\u548c\u6062\u590d\u8bed\u8a00\u8868\u8fbe\u80fd\u529b\uff0c\u5bf9\u957f\u671f\u8fd0\u884c\u81ea\u4e3b\u667a\u80fd\u4f53\u7684\u5b89\u5168\u5de5\u7a0b\u5177\u6709\u76f4\u63a5\u4ef7\u503c\u3002"}, {"abstract": "Scaling robot data is crucial for building generalist Vision-Language-Action (VLA) models, yet robot trajectories are harder to scale than web-scale image-text data because embodied collection is costly and sparsely covers the physical world. This makes representation quality a central bottleneck: under a fixed robot-data budget, continued pre-training must turn limited trajectories into transferable visual-action knowledge rather than merely fit actions. We propose VLAct, a VLA-oriented VLM backbone trained on broad, heterogeneous, multi-embodiment robot data before task-specific fine-tuning. VLAct preserves the broad VLM prior and encourages shared action semantics across embodiments through VLM-prior preservation, multi-head continuous action co-supervision, and a partially unified cross-embodiment action layout, while allowing task-specific action heads during fine-tuning. Across simulation, real-world, and unseen-embodiment transfer, VLAct consistently improves downstream performance under fixed fine-tuning protocols. On LIBERO-Plus and RoboTwin 2.0, VLAct surpasses industrial VLA systems including ABot-M0 and LingBot-VLA, achieving success rates of 82.6% and 92.5%. On RoboDojo, VLAct ranks sixth among all policies by success rate and outperforms all explicitly designated world-action model (WAM) entries on both metrics. Most notably, on RoboCasa-GR1, an unseen humanoid embodiment, VLAct using only 20% of downstream trajectories outperforms the full-data GR00T-N1.6 baseline. These results are obtained using fully open-source data and only a 16-GPU training setup, showing that representation-centric continued pre-training can deliver highly competitive performance under a modest compute budget and is an important independent axis of VLA progress beyond data scaling.", "arxiv_id": "2608.27550", "arxiv_url": "https://arxiv.org/abs/2608.27550", "authors": ["Senqiao Yang", "Chengyao Wang", "Yuxin Chen", "Zixuan Wang", "Longxiang Tang", "Haokun Gui", "Jinhui Ye", "Changsheng Lu", "Xiaoyang Wu", "Mingkang Zhu", "Pengguang Chen", "Shu Liu", "Zhuotao Tian", "Hengshuang Zhao", "Bei Yu", "Jiaya Jia"], "brief": "\u8bba\u6587\u63d0\u51fa VLAct\uff0c\u4e00\u79cd\u9762\u5411 Vision-Language-Action \u6a21\u578b\u7684 VLM \u9aa8\u5e72\uff0c\u5728\u591a\u6e90\u3001\u591a\u673a\u5668\u4eba\u5f62\u6001\u6570\u636e\u4e0a\u7ee7\u7eed\u9884\u8bad\u7ec3\uff0c\u518d\u8fdb\u884c\u4efb\u52a1\u5fae\u8c03\u3002\u5176\u6838\u5fc3\u76ee\u6807\u662f\u5728\u6709\u9650\u673a\u5668\u4eba\u6570\u636e\u4e0b\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89c6\u89c9-\u52a8\u4f5c\u8868\u5f81\uff0c\u800c\u4e0d\u53ea\u662f\u62df\u5408\u52a8\u4f5c\u8f68\u8ff9\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/starVLA/starVLA", "github_stars": 3559, "hf_url": "https://huggingface.co/papers/2608.27550", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u901a\u8fc7 VLM-prior preservation \u4fdd\u7559\u901a\u7528\u89c6\u89c9\u8bed\u8a00\u5148\u9a8c\uff0c\u907f\u514d\u673a\u5668\u4eba\u6570\u636e\u7ee7\u7eed\u9884\u8bad\u7ec3\u7834\u574f\u539f\u6709\u8868\u5f81\u80fd\u529b", "\u91c7\u7528\u591a\u5934\u8fde\u7eed\u52a8\u4f5c\u534f\u540c\u76d1\u7763\u4e0e\u90e8\u5206\u7edf\u4e00\u7684\u8de8\u5f62\u6001\u52a8\u4f5c\u5e03\u5c40\uff0c\u4fc3\u8fdb\u4e0d\u540c\u673a\u5668\u4eba\u5f62\u6001\u95f4\u5171\u4eab\u52a8\u4f5c\u8bed\u4e49", "\u5728 LIBERO-Plus\u3001RoboTwin 2.0\u3001RoboDojo \u548c\u672a\u89c1\u4eba\u5f62\u673a\u5668\u4eba RoboCasa-GR1 \u4e0a\u5747\u53d6\u5f97\u5f3a\u7ed3\u679c\uff0c\u5e76\u5728\u90e8\u5206\u57fa\u51c6\u8d85\u8d8a\u5de5\u4e1a\u7ea7 VLA \u7cfb\u7edf"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b", "\u8868\u5f81\u5b66\u4e60", "\u673a\u5668\u4eba\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": "Star Vision Language Action Models", "pdf_url": "https://arxiv.org/pdf/2608.27550v1", "published_at": "2026-08-27", "score": 0.392, "selected_reasons": ["HF trending (79\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.27550.png", "title": "Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models", "tldr": "VLAct\u7528\u8868\u5f81\u4e2d\u5fc3\u9884\u8bad\u7ec3\u63d0\u5347VLA\u6cdb\u5316", "upvotes": 79, "what_it_is": "\u8bba\u6587\u63d0\u51fa VLAct\uff0c\u4e00\u79cd\u9762\u5411 Vision-Language-Action \u6a21\u578b\u7684 VLM \u9aa8\u5e72\uff0c\u5728\u591a\u6e90\u3001\u591a\u673a\u5668\u4eba\u5f62\u6001\u6570\u636e\u4e0a\u7ee7\u7eed\u9884\u8bad\u7ec3\uff0c\u518d\u8fdb\u884c\u4efb\u52a1\u5fae\u8c03\u3002\u5176\u6838\u5fc3\u76ee\u6807\u662f\u5728\u6709\u9650\u673a\u5668\u4eba\u6570\u636e\u4e0b\u5b66\u4e60\u53ef\u8fc1\u79fb\u7684\u89c6\u89c9-\u52a8\u4f5c\u8868\u5f81\uff0c\u800c\u4e0d\u53ea\u662f\u62df\u5408\u52a8\u4f5c\u8f68\u8ff9\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5f3a\u8c03 VLA \u8fdb\u5c55\u4e0d\u53ea\u4f9d\u8d56\u6269\u5927\u673a\u5668\u4eba\u6570\u636e\u89c4\u6a21\uff0c\u8fd8\u53ef\u901a\u8fc7\u66f4\u597d\u7684\u8868\u5f81\u4e2d\u5fc3\u7ee7\u7eed\u9884\u8bad\u7ec3\u663e\u8457\u63d0\u5347\u6cdb\u5316\u4e0e\u8de8\u5f62\u6001\u8fc1\u79fb\uff1b\u4e14\u4f7f\u7528\u5f00\u6e90\u6570\u636e\u548c 16-GPU \u8bad\u7ec3\u914d\u7f6e\u5373\u8fbe\u5230\u6709\u7ade\u4e89\u529b\u7684\u6027\u80fd\uff0c\u5b9e\u7528\u4ef7\u503c\u8f83\u9ad8\u3002"}, {"abstract": "Loop Engineering is emerging as a practice for organizing development work around coding agents. Instead of writing each prompt by hand, practitioners design loops that monitor progress, assign work, run checks, and decide what the agent should do next. Even with a capable coding agent, a loop may trust a stale progress note, skip needed verification, spend its budget in the wrong direction, or stop before the task is safe to submit. Yet the final outcome of one end-to-end run cannot tell whether success or failure reflects the loop\u0027s guidance or the coding agent\u0027s ability to carry out the task. We introduce LoopArena, a benchmark for evaluating how well one model can guide a separate coding agent through a long-running task. The model under evaluation is the \\textbf{Controller}: after each coding round, it receives a structured summary of the run and instructs a separate, fixed coding agent, the \\textbf{Worker}, on what to do or verify next, or decides whether to stop. LoopArena evaluates this ability in three complementary settings that differ in execution scope and cost. Type I scores next-step Loop Contract selection through execution-validated questions without running the Worker at evaluation time. Type II executes repeated control over a selected slice of a full task, while Type III evaluates the paired full task from its original state. On full tasks, the best observed Strict Success Rate is \\textbf{24.69\\%}, leaving substantial room for improvement in long-horizon loop control. Across Controllers, the paired reduction in estimated inference cost averages \\textbf{64.4\\%}, and Type II produces a similar ordering under the main Core criterion (Spearman\u0027s \\(\u03c1=\\textbf{0.9747}\\)). We release the benchmark data and evaluation code at https://github.com/AMAP-ML/LoopArena .", "arxiv_id": "2608.28281", "arxiv_url": "https://arxiv.org/abs/2608.28281", "authors": ["Yi Wang", "Haopeng Zhang", "Chengxiang Huang", "Rui Dai", "Kaikui Liu", "Piotr Koniusz", "Xiangxiang Chu"], "brief": "\u8bba\u6587\u63d0\u51fa LoopArena\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u201c\u63a7\u5236\u5668\u201d\u6a21\u578b\u5982\u4f55\u6307\u5bfc\u56fa\u5b9a\u7f16\u7801\u667a\u80fd\u4f53\u5b8c\u6210\u957f\u4efb\u52a1\u7684\u57fa\u51c6\u3002\u5b83\u5c06\u4efb\u52a1\u6267\u884c\u62c6\u5206\u4e3a\u63a7\u5236\u5668\u51b3\u7b56\u4e0e Worker \u7f16\u7801\u6267\u884c\uff0c\u4ee5\u533a\u5206\u5931\u8d25\u6765\u81ea\u8c03\u5ea6\u7b56\u7565\u8fd8\u662f\u7f16\u7801\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/AMAP-ML/LoopArena", "github_stars": 70, "hf_url": "https://huggingface.co/papers/2608.28281", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8bbe\u8ba1 Controller-Worker \u67b6\u6784\uff1aController \u6839\u636e\u6bcf\u8f6e\u7ed3\u6784\u5316\u6458\u8981\u51b3\u5b9a\u4e0b\u4e00\u6b65\u9a8c\u8bc1\u3001\u5f00\u53d1\u65b9\u5411\u6216\u662f\u5426\u505c\u6b62", "\u63d0\u4f9b\u4e09\u7c7b\u8bc4\u6d4b\uff1aType I \u79bb\u7ebf\u9009\u62e9\u4e0b\u4e00\u6b65 Loop Contract\uff0cType II \u6267\u884c\u4efb\u52a1\u5207\u7247\u63a7\u5236\uff0cType III \u4ece\u521d\u59cb\u72b6\u6001\u8bc4\u4f30\u5b8c\u6574\u4efb\u52a1", "\u5b8c\u6574\u4efb\u52a1\u6700\u4f73 Strict Success Rate \u4ec5 24.69%\uff0c\u4f46\u63a7\u5236\u5668\u5e73\u5747\u53ef\u964d\u4f4e 64.4% \u4f30\u8ba1\u63a8\u7406\u6210\u672c\uff0cType II \u4e0e\u4e3b\u6307\u6807\u6392\u5e8f\u9ad8\u5ea6\u76f8\u5173"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u57fa\u51c6\u8bc4\u6d4b", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 3, "on_hf": true, "organization": "AMAP-ML", "pdf_url": "https://arxiv.org/pdf/2608.28281v1", "published_at": "2026-08-28", "score": 0.364, "selected_reasons": ["HF trending (93\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28281.png", "title": "LoopArena: Benchmarking Models as Runtime Controllers for Loop Engineering", "tldr": "\u8bc4\u6d4b\u6a21\u578b\u8c03\u5ea6\u7f16\u7801\u667a\u80fd\u4f53\u7684\u957f\u7a0b\u63a7\u5236\u80fd\u529b", "upvotes": 93, "what_it_is": "\u8bba\u6587\u63d0\u51fa LoopArena\uff0c\u4e00\u4e2a\u7528\u4e8e\u8bc4\u4f30\u201c\u63a7\u5236\u5668\u201d\u6a21\u578b\u5982\u4f55\u6307\u5bfc\u56fa\u5b9a\u7f16\u7801\u667a\u80fd\u4f53\u5b8c\u6210\u957f\u4efb\u52a1\u7684\u57fa\u51c6\u3002\u5b83\u5c06\u4efb\u52a1\u6267\u884c\u62c6\u5206\u4e3a\u63a7\u5236\u5668\u51b3\u7b56\u4e0e Worker \u7f16\u7801\u6267\u884c\uff0c\u4ee5\u533a\u5206\u5931\u8d25\u6765\u81ea\u8c03\u5ea6\u7b56\u7565\u8fd8\u662f\u7f16\u7801\u80fd\u529b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u7f16\u7801\u667a\u80fd\u4f53\u4e2d\u7684\u201c\u5faa\u73af\u8c03\u5ea6/\u8fd0\u884c\u65f6\u63a7\u5236\u201d\u4ece\u7aef\u5230\u7aef\u6210\u529f\u7387\u4e2d\u72ec\u7acb\u51fa\u6765\u8bc4\u6d4b\uff0c\u6709\u52a9\u4e8e\u7814\u7a76\u957f\u7a0b\u8f6f\u4ef6\u5de5\u7a0b\u667a\u80fd\u4f53\u7684\u51b3\u7b56\u3001\u9a8c\u8bc1\u4e0e\u6210\u672c\u63a7\u5236\u80fd\u529b\u3002"}, {"abstract": "Self-evolving language models have recently emerged as a promising path toward superintelligence, with the advantage of reducing the cost of human supervision. While considerable progress has been made in verifiable domains, self-evolution in unverifiable domains remains substantially less explored. We propose Judge co-adaptation from Zero data (J-Zero), a unified Challenger--Solver--Judge co-evolution framework that supports self-improvement across both domains. The Challenger and Solver co-evolve through an adversarial interaction: the Challenger generates increasingly difficult tasks, while the Solver learns to produce higher-quality responses to them. In parallel, the Judge co-adapts using preference pairs whose ordering is known in advance from how each response was produced, i.e., the Solver\u0027s answer over the Challenger\u0027s, and its decomposed-and-recombined answer over its one-shot answer, rather than from the Judge\u0027s own scores. J-Zero outperforms the baselines by an average of 4.2 points on verifiable and 8.0 points on unverifiable domains, and continues to improve through at least ten iterations, whereas the baselines degrade after two.", "arxiv_id": "2608.26582", "arxiv_url": "https://arxiv.org/abs/2608.26582", "authors": ["Gyouk Chu", "Myeongho Jeon", "Eunho Yang"], "brief": "\u8bba\u6587\u63d0\u51fa J-Zero\uff0c\u4e00\u4e2a Challenger--Solver--Judge \u7edf\u4e00\u5171\u8fdb\u5316\u6846\u67b6\uff0c\u53ef\u5728\u53ef\u9a8c\u8bc1\u4e0e\u4e0d\u53ef\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u4ece\u96f6\u6570\u636e\u8fdb\u884c\u81ea\u6211\u6539\u8fdb\u3002\u6311\u6218\u8005\u751f\u6210\u66f4\u96be\u4efb\u52a1\uff0c\u6c42\u89e3\u8005\u63d0\u5347\u56de\u7b54\u8d28\u91cf\uff0c\u88c1\u5224\u5219\u7528\u9884\u5148\u53ef\u77e5\u6392\u5e8f\u7684\u504f\u597d\u5bf9\u81ea\u9002\u5e94\u8bad\u7ec3\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/GyoukChu/J-Zero", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.26582", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["Challenger \u4e0e Solver \u901a\u8fc7\u5bf9\u6297\u5f0f\u4e92\u52a8\u5171\u540c\u8fdb\u5316\uff1a\u524d\u8005\u751f\u6210\u66f4\u5177\u6311\u6218\u7684\u95ee\u9898\uff0c\u540e\u8005\u5b66\u4e60\u7ed9\u51fa\u66f4\u4f18\u7b54\u6848", "Judge \u4e0d\u4f9d\u8d56\u81ea\u8eab\u6253\u5206\u6784\u9020\u6807\u7b7e\uff0c\u800c\u4f7f\u7528\u751f\u6210\u8fc7\u7a0b\u5929\u7136\u786e\u5b9a\u7684\u504f\u597d\u987a\u5e8f\uff0c\u5982 Solver \u7b54\u6848\u4f18\u4e8e Challenger \u7b54\u6848\u3001\u5206\u89e3\u91cd\u7ec4\u7b54\u6848\u4f18\u4e8e\u4e00\u6b21\u6027\u7b54\u6848", "\u5728\u53ef\u9a8c\u8bc1\u9886\u57df\u5e73\u5747\u63d0\u5347 4.2 \u5206\uff0c\u5728\u4e0d\u53ef\u9a8c\u8bc1\u9886\u57df\u5e73\u5747\u63d0\u5347 8.0 \u5206\uff0c\u5e76\u80fd\u6301\u7eed\u6539\u8fdb\u81f3\u5c11 10 \u8f6e\uff0c\u57fa\u7ebf\u901a\u5e38 2 \u8f6e\u540e\u9000\u5316"], "keywords": ["\u81ea\u8fdb\u5316\u6a21\u578b", "\u504f\u597d\u5b66\u4e60", "\u5bf9\u6297\u8bad\u7ec3", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2608.26582v1", "published_at": "2026-08-27", "score": 0.31, "selected_reasons": ["HF trending (35\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.26582.png", "title": "J-Zero: Unified Challenger--Solver--Judge Co-Evolution from Zero Data", "tldr": "\u4e09\u65b9\u5171\u8fdb\u5316\u8ba9\u8bed\u8a00\u6a21\u578b\u96f6\u6570\u636e\u81ea\u6211\u63d0\u5347", "upvotes": 35, "what_it_is": "\u8bba\u6587\u63d0\u51fa J-Zero\uff0c\u4e00\u4e2a Challenger--Solver--Judge \u7edf\u4e00\u5171\u8fdb\u5316\u6846\u67b6\uff0c\u53ef\u5728\u53ef\u9a8c\u8bc1\u4e0e\u4e0d\u53ef\u9a8c\u8bc1\u4efb\u52a1\u4e2d\u4ece\u96f6\u6570\u636e\u8fdb\u884c\u81ea\u6211\u6539\u8fdb\u3002\u6311\u6218\u8005\u751f\u6210\u66f4\u96be\u4efb\u52a1\uff0c\u6c42\u89e3\u8005\u63d0\u5347\u56de\u7b54\u8d28\u91cf\uff0c\u88c1\u5224\u5219\u7528\u9884\u5148\u53ef\u77e5\u6392\u5e8f\u7684\u504f\u597d\u5bf9\u81ea\u9002\u5e94\u8bad\u7ec3\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5c06\u81ea\u8fdb\u5316\u8bed\u8a00\u6a21\u578b\u4ece\u53ef\u9a8c\u8bc1\u4efb\u52a1\u6269\u5c55\u5230\u66f4\u96be\u7684\u4e0d\u53ef\u9a8c\u8bc1\u9886\u57df\uff0c\u964d\u4f4e\u4eba\u5de5\u76d1\u7763\u9700\u6c42\uff0c\u5e76\u7f13\u89e3\u591a\u8f6e\u81ea\u8bad\u7ec3\u4e2d\u7684\u6027\u80fd\u9000\u5316\u95ee\u9898\uff0c\u5bf9\u6784\u5efa\u53ef\u6301\u7eed\u81ea\u6211\u63d0\u5347\u6a21\u578b\u5177\u6709\u542f\u53d1\u610f\u4e49\u3002"}, {"abstract": "Autoregressive video diffusion enables scalable long-video generation by producing chunks from a bounded recent context. While recency-based caching preserves local continuity, it evicts historical cues needed when subjects, objects, scenes, or attributes reappear. Existing memory mechanisms expose models to nonlocal history, but access alone does not ensure effective use. Our analysis reveals that video DiT layers exhibit distinct preferences for current, recent, and distant context, suggesting that long-range memory requires deciding both what to retrieve and where to use it. We introduce LayerRecall, a current-conditioned, layer-selective memory router that retrieves relevant historical K/V states and injects them only into backbone-specific memory-sensitive layers while preserving local attention elsewhere. To reduce reliance on scarce high-quality long-horizon videos and explicit memory-allocation labels, we further propose Cross-Horizon Prediction Matching (CHPM), which uses a privileged long-context reference to supervise the bounded-memory router in prediction space. Across 100 multi-shot evaluation prompts, LayerRecall achieves the best overall results on MemoBench and MovieBench while matching its backbone on VBench-Long, demonstrating stronger long-range recovery without sacrificing local continuity. Qualitative analyses further reveal memory-guided self-correction, whereby initially mismatched local attributes return to their historical appearance without resetting ongoing motion or scene structure. Additional analyses show cross-backbone portability and negligible inference overhead.", "arxiv_id": "2608.28460", "arxiv_url": "https://arxiv.org/abs/2608.28460", "authors": ["Yixuan Ding", "Jiahao Kong", "Wei Huang", "Ruijie Quan", "Yi Yang"], "brief": "\u8bba\u6587\u63d0\u51fa LayerRecall\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u72b6\u6001\u6761\u4ef6\u8bb0\u5fc6\u8def\u7531\u5668\u3002\u5b83\u6839\u636e\u5f53\u524d\u751f\u6210\u72b6\u6001\u68c0\u7d22\u76f8\u5173\u5386\u53f2 K/V\uff0c\u5e76\u53ea\u6ce8\u5165\u5bf9\u957f\u7a0b\u8bb0\u5fc6\u654f\u611f\u7684 DiT \u5c42\uff0c\u4ee5\u63d0\u5347\u591a\u955c\u5934\u957f\u89c6\u9891\u7684\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Yixuan-Ding-ZJU/LayerRecall", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.28460", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u89c6\u9891 DiT \u4e0d\u540c\u5c42\u5bf9\u5f53\u524d\u3001\u8fd1\u671f\u548c\u8fdc\u671f\u4e0a\u4e0b\u6587\u6709\u4e0d\u540c\u504f\u597d\uff0c\u957f\u7a0b\u8bb0\u5fc6\u4e0d\u4ec5\u8981\u51b3\u5b9a\u53d6\u4ec0\u4e48\uff0c\u8fd8\u8981\u51b3\u5b9a\u7528\u5728\u54ea\u4e00\u5c42\u3002", "\u63d0\u51fa Cross-Horizon Prediction Matching\uff0c\u7528\u957f\u4e0a\u4e0b\u6587\u53c2\u8003\u6a21\u578b\u5728\u9884\u6d4b\u7a7a\u95f4\u76d1\u7763\u6709\u754c\u8bb0\u5fc6\u8def\u7531\u5668\uff0c\u51cf\u5c11\u5bf9\u957f\u89c6\u9891\u6570\u636e\u548c\u663e\u5f0f\u8bb0\u5fc6\u6807\u7b7e\u7684\u4f9d\u8d56\u3002", "\u5728 100 \u4e2a\u591a\u955c\u5934\u8bc4\u6d4b\u63d0\u793a\u4e0a\uff0cLayerRecall \u5728 MemoBench \u548c MovieBench \u53d6\u5f97\u6700\u4f73\u603b\u4f53\u7ed3\u679c\uff0c\u540c\u65f6\u5728 VBench-Long \u4e0a\u4fdd\u6301\u4e0e\u9aa8\u5e72\u6a21\u578b\u76f8\u5f53\uff0c\u4e14\u63a8\u7406\u5f00\u9500\u53ef\u5ffd\u7565\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u957f\u7a0b\u8bb0\u5fc6", "\u591a\u6a21\u6001"], "num_comments": 2, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2608.28460v1", "published_at": "2026-08-28", "score": 0.31, "selected_reasons": ["HF trending (26\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.28460.png", "title": "LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency in Video Generation", "tldr": "\u4e3a\u957f\u89c6\u9891\u751f\u6210\u6309\u5c42\u8def\u7531\u5386\u53f2\u8bb0\u5fc6\u3002", "upvotes": 26, "what_it_is": "\u8bba\u6587\u63d0\u51fa LayerRecall\uff0c\u4e00\u79cd\u9762\u5411\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u6a21\u578b\u7684\u72b6\u6001\u6761\u4ef6\u8bb0\u5fc6\u8def\u7531\u5668\u3002\u5b83\u6839\u636e\u5f53\u524d\u751f\u6210\u72b6\u6001\u68c0\u7d22\u76f8\u5173\u5386\u53f2 K/V\uff0c\u5e76\u53ea\u6ce8\u5165\u5bf9\u957f\u7a0b\u8bb0\u5fc6\u654f\u611f\u7684 DiT \u5c42\uff0c\u4ee5\u63d0\u5347\u591a\u955c\u5934\u957f\u89c6\u9891\u7684\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9\u957f\u89c6\u9891\u751f\u6210\u4e2d\u89d2\u8272\u3001\u7269\u4f53\u548c\u573a\u666f\u518d\u6b21\u51fa\u73b0\u65f6\u5bb9\u6613\u5931\u771f\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u7ec6\u7c92\u5ea6\u3001\u4f4e\u5f00\u9500\u7684\u8bb0\u5fc6\u4f7f\u7528\u673a\u5236\uff1b\u76f8\u6bd4\u5355\u7eaf\u6269\u5927\u4e0a\u4e0b\u6587\u6216\u66b4\u9732\u5386\u53f2\u4fe1\u606f\uff0c\u5b83\u5f3a\u8c03\u6309\u5c42\u9009\u62e9\u6027\u6ce8\u5165\uff0c\u517c\u987e\u957f\u7a0b\u4e00\u81f4\u6027\u4e0e\u5c40\u90e8\u8fde\u7eed\u6027\u3002"}, {"abstract": "Spatio-temporal video grounding (STVG) requires models to identify when a referred event occurs and localize the target entity throughout that interval. Existing multimodal large language models typically serialize dense localization trajectories autoregressively, causing decoding latency to grow with tube length and allowing localization errors to propagate across time. We introduce Parallel Tube Decoding (PTD), a generative formulation that decomposes grounding into a temporal block followed by time-conditioned spatial blocks decoded simultaneously. This removes both token-level and trajectory-level dependencies, reducing the sequential decoding depth to a fixed $1 + 1$ rounds, independent of tube length. To enable parallel spatial generation, we introduce Decoupled Block Attention, which preserves access to shared video-query context while eliminating cross-box dependencies, together with localization-aware policy optimization for temporal boundaries and spatial geometry. On VidSTG, PTD reduces Tube Completion Latency by 79x and increases spatial decoding throughput by 92x over standard autoregressive decoding, while also improving grounding accuracy. With a compact 4B backbone, our model performs favorably well on VidSTG and HC-STVG, and generalizes zero-shot to temporal grounding, grounded VideoQA, and referring video object tracking. Our results show parallel tube generation is an efficient and effective alternative to autoregressive localization in videos.", "arxiv_id": "2608.28192", "arxiv_ur
