  .card h3 .badge { font-size:10px; background:#fef3c7; color:#92660a; border-radius:5px; padding:1px 6px; margin-right:5px; vertical-align:middle; }
  .thumb { width:100%; max-height:190px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border); }
  .sec { font-size:13.5px; line-height:1.65; margin:6px 0; }
  .sec b { color:var(--accent); margin-right:4px; }

  .summary { font-size:13.5px; line-height:1.65; color:var(--fg); margin:8px 0; }
  .row { color:var(--muted); font-size:12px; margin:3px 0; }
  .tags span { display:inline-block; background:var(--tag); color:var(--tag-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .kws span { display:inline-block; background:var(--kw); color:var(--kw-fg); border-radius:5px; padding:1px 7px; font-size:11px; margin:2px 4px 2px 0; }
  .stats { color:var(--muted); font-size:12px; margin:6px 0; }
  .stats b { color:var(--fg); }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; font-size:13px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  .card h3 .title-link { cursor:pointer; }
  .card h3 .title-link:hover { color:var(--accent); text-decoration:underline; }

  /* 详情弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; padding:28px 16px; overflow:auto; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); color:var(--fg); max-width:920px; margin:0 auto; border-radius:14px; padding:22px 26px; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.3); }

  .pdfwrap { width:100%; height:600px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }

<script>
const PAPERS = [{"abstract": "Research taste, the judgment of what to read, which problems to pursue, and which methods to try, increasingly shapes the work of AI scientists, yet it remains far less understood than their ability to execute research. We introduce IdeaTaste, a benchmark that scores an LLM by how closely the research proposals it writes from a literature snapshot frozen at 2025 match the work the same communities published in 2026. Our experiments span six contemporary language models and four research areas from established to emerging fields, covering more than 90{,}000 proposals in total. LLM agents fall well short of human communities in both the literature they cite and the ideas they state, reaching about 26\\% of the human level on citation matching and only 18\\% on idea matching. Their populations can cite as diversely as a community and take up its tasks and methods, yet rarely arrive at the concrete approaches and research plans it pursues. Neither richer field context nor larger populations substantially close this gap. In blinded expert review, AI proposals trail the 2026 papers least in presentation and most in expected success, echoing their gap in concrete approaches, and those whose ideas no human paper shares fare worst, suggesting weaker directions rather than overlooked opportunities. These results indicate that the main bottleneck in AI research taste lies less in finding the directions a community works on than in turning them into the concrete approaches it goes on to pursue. We release IdeaTaste as an open, continuously updated leaderboard (https://cxcscmu.github.io/IdeaTaste) that benchmarks contemporary AI proposals against future publication cycles.", "arxiv_id": "2611.03424", "arxiv_url": "https://arxiv.org/abs/2611.03424", "authors": ["Shanshan Zhong", "Chen Xu", "Jingjie Ning", "Zhengzhong Liu", "Aviral Kumar", "Chenyan Xiong"], "brief": "IdeaTaste\u7528\u51bb\u7ed3\u4e8e2025\u5e74\u7684\u6587\u732e\u8ba9\u6a21\u578b\u64b0 3\u5bb6\u76f2\u8bc4\uff0c\u8861\u91cf\u6a21\u578b\u7684\u7814\u7a76\u54c1\u5473\u3002", "why_notable": "\u5b83\u5c06AI\u79d1\u7814\u8bc4\u4f30\u4ece\u6267\u884c\u80fd\u529b\u63a8\u8fdb\u5230\u9009\u9898\u4e0e\u65b9\u6848\u5224\u65ad\uff0c\u63ed\u793a\u74f6\u9888\u5728\u5177\u4f53\u7814\u7a76\u8def\u5f84\uff0c\u5e76\u4ee5\u6301\u7eed\u66f4\u65b0\u699c\u5355\u8ffd\u8e2a\u6a21\u578b\u8868\u73b0\u3002"}, {"abstract": "Complex documents such as scientific papers contain rich information in tables, figures, and equations; however, existing deep research (DR) agents typically reduce papers to OCR-extracted text. We instead ask whether vision-language models (VLMs) can enable page-native deep research: directly retrieving and reasoning over rendered document page images. We introduce DR Pixel, the first open-source end-to-end multimodal DR agent that uses rendered page images as its sole retrieval and reasoning unit, operating over a corpus of 1.06M pages. To evaluate this setting, we construct DRPixelBench, a benchmark on scientific papers requiring reasoning over text, figures, tables, and equations. Surprisingly, page-native DR already works well without training, outperforming OCR-based baselines across state-of-the-art models like GPT-5.4, Gemini-3.5-Flash, and Qwen3.6-27B, while requiring fewer tool calls. We next turn to DR training. A key challenge is that teacher trajectories for agentic supervised finetuning are noisy, mixing critical reasoning and action steps with redundant or failed attempts. To address this, we introduce counterfactual credit reweighting, a fine-grained credit assignment method that weights individual reasoning and action steps by their counterfactual contribution to the final answer. Our training improves retrieval recall by about 15 points and final accuracy by over 10 points on DRPixelBench, and likewise outperforms the untrained baseline on four existing benchmarks. On out-of-distribution ViDoRe-V3, DR Pixel comes within 1.8 points of an oracle that is given the gold pages directly. Our results suggest that the conventional OCR-then-retrieve pipeline is not only unnecessary but suboptimal: directly retrieving and reasoning over visual document pages makes complex DR both more effective and more efficient.", "arxiv_id": "2611.03097", "arxiv_url": "https://arxiv.org/abs/2611.03097", "authors": ["Tiansheng Hu", "Yichuan Wang", "James V. Talwar", "Nicholas Tomlin", "Chen Zhao", "Sewon Min"], "brief": "DR Pixel\u662f\u5f00\u6e90\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u4ee5\u6e32\u67d3\u9875\u9762\u56fe\u50cf\u4f5c\u4e3a\u552f\u4e00\u68c0\u7d22\u4e0e\u63a8\u7406\u5355\u5143\uff0c\u5e76\u7528\u53cd\u4e8b\u5b9e\u8d21\u732e\u91cd\u52a0\u6743\u8bad\u7ec3\uff0c\u51cf\u5c11\u5197\u4f59\u6216\u5931\u8d25\u6b65\u9aa4\u7684\u5e72\u6270\u3002", "categories": ["cs.CV", "cs.CL", "cs.IR"], "github_repo": "https://github.com/StarTrail-org/DRPixel", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2611.03097", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u8986\u76d6106\u4e07\u9875\uff0c\u6784\u5efa\u8de8\u56fe\u8868\u3001\u516c\u5f0f\u63a8\u7406\u7684DRPixelBench", "\u65e0\u9700\u8bad\u7ec3\u5373\u53ef\u8d85\u8fc7OCR\u57fa\u7ebf\uff0c\u4e14\u5de5\u5177\u8c03\u7528\u66f4\u5c11", "\u53cd\u4e8b\u5b9e\u4fe1\u7528\u91cd\u52a0\u6743\u4f7f\u53ec\u56de\u7387\u63d0\u5347\u7ea615\u70b9\u3001\u51c6\u786e\u7387\u8d8510\u70b9"], "keywords": ["\u591a\u6a21\u6001\u667a\u80fd\u4f53", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6587\u6863\u68c0\u7d22", "\u4fe1\u7528\u5206\u914d"], "num_comments": 1, "on_hf": true, "organization": "Berkeley-NLP", "pdf_url": "https://arxiv.org/pdf/2611.03097v1", "published_at": "2026-11-02", "score": 0.64, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Berkeley", "\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03097.png", "title": "DR Pixel: Page-Native Deep Research with Vision-Language Models", "tldr": "\u76f4\u63a5\u68c0\u7d22\u5e76\u63a8\u7406\u6587\u6863\u9875\u9762\u56fe\u50cf\u7684\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u6bd4OCR\u6587\u672c\u65b9\u6848\u66f4\u51c6\u4e14\u8c03\u7528\u66f4\u5c11\u3002", "upvotes": 5, "what_it_is": "DR Pixel\u662f\u5f00\u6e90\u591a\u6a21\u6001\u6df1\u5ea6\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u4ee5\u6e32\u67d3\u9875\u9762\u56fe\u50cf\u4f5c\u4e3a\u552f\u4e00\u68c0\u7d22\u4e0e\u63a8\u7406\u5355\u5143\uff0c\u5e76\u7528\u53cd\u4e8b\u5b9e\u8d21\u732e\u91cd\u52a0\u6743\u8bad\u7ec3\uff0c\u51cf\u5c11\u5197\u4f59\u6216\u5931\u8d25\u6b65\u9aa4\u7684\u5e72\u6270\u3002", "why_notable": "\u5b83\u8868\u660e\u4fdd\u7559\u9875\u9762\u89c6\u89c9\u7ed3\u6784\u53ef\u540c\u65f6\u6539\u5584\u6df1\u5ea6\u7814\u7a76\u7684\u6548\u679c\u4e0e\u6548\u7387\uff1b\u5728\u5206\u5e03\u5916ViDoRe-V3\u4e0a\uff0c\u8ddd\u76f4\u63a5\u83b7\u5f97\u6b63\u786e\u9875\u9762\u7684\u53c2\u7167\u4ec5\u5dee1.8\u70b9\u3002"}, {"abstract": "Video generation is shifting from end-to-end synthesis toward agentic generation, where planning, tool use, and feedback enable coherent, controllable multi-shot videos. In parallel, video world models provide action-conditioned observations and predicted futures, serving as interactive environments for agents. We study their intersection through the agent harness: an executable runtime that constructs context, exposes tools, maintains state, routes feedback, and manages budgets around video models. This report examines three directions. First, agentic video generation, where harnesses coordinate scripting, shot planning, asset management, production, and editing, alongside the evaluation challenges of these systems. Second, agentic world modeling, where harnesses mediate observation, control, execution, and state. We discuss hybrid designs in which game engines or agent-written programs maintain world state while video models render observations, and how agents and world models can mutually evaluate and improve one another. Third, recursive self-improvement (RSI) in video model development, distinguishing output revisions, updates to harness state, generator parameters, and evaluators, and changes to the improvement procedure itself. We identify how these improvements feed back into subsequent development. Across these directions, we analyze essential agent capabilities, including audiovisual perception, long-horizon planning, memory, code-based interaction, feedback-guided control, skill reuse, and multi-agent coordination. We conclude with challenges in autonomous video production, lifelong memory, programmable hybrid control, autonomous model development, provenance, cost accounting, and evaluation linking video quality and task performance to sustained improvements in models and harnesses.", "arxiv_id": "2610.40191", "arxiv_url": "https://arxiv.org/abs/2610.40191", "authors": ["Liaoyuan Fan", "Yuhao Zheng", "Dongxing Mao", "Hangyu Ran", "Siyuan Hu", "Weijia Mao", "Rui Zhao", "Weijia Wu", "Guian Fang", "Yanzhe Chen", "Zeyu Zhu", "Yuxin Jiang", "Yiren Song", "Yuchao Gu", "Junchao Yi", "Qi Hu", "Dan Kong", "Alex Jinpeng Wang", "Kevin Qinghong Lin", "Mike Zheng Shou", "Wei Liu"], "brief": "\u8fd9\u4efd\u62a5\u544a\u4ee5\u53ef\u6267\u884c\u7684\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u4e3a\u4e3b\u7ebf\uff0c\u5206\u6790\u5176\u5982\u4f55\u7ba1\u7406\u4e0a\u4e0b\u6587\u3001\u5de5\u5177\u3001\u72b6\u6001\u4e0e\u53cd\u9988\uff0c\u8fde\u63a5\u591a\u955c\u5934\u89c6\u9891\u5236\u4f5c\u3001\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u53ca\u6a21\u578b\u5f00\u53d1\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/agentic-videogen/awesome-agentic-videogen", "github_stars": 41, "hf_url": "https://huggingface.co/papers/2610.40191", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["Agent harness\u7edf\u7b79\u811a\u672c\u3001\u5206\u955c\u3001\u8d44\u4ea7\u3001\u5236\u4f5c\u4e0e\u526a\u8f91", "\u6df7\u5408\u4e16\u754c\u6a21\u578b\u7531\u5f15\u64ce\u6216\u7a0b\u5e8f\u7ef4\u62a4\u72b6\u6001\uff0c\u89c6\u9891\u6a21\u578b\u6e32\u67d3", "RSI\u533a\u5206\u8f93\u51fa\u3001\u72b6\u6001\u3001\u53c2\u6570\u3001\u8bc4\u4f30\u5668\u4e0e\u6539\u8fdb\u6d41\u7a0b\u66f4\u65b0"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u667a\u80fd\u4f53", "\u4e16\u754c\u6a21\u578b", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 2, "on_hf": true, "organization": "Video Rebirth", "pdf_url": "https://arxiv.org/pdf/2610.40191v1", "published_at": "2026-10-29", "score": 0.551, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (70\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40191.png", "title": "Video Generation Meets Agent Harness: Agentic Video Generation, Agentic World Modeling and Recursive Self-Improvement", "tldr": "\u4ee5\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u4e32\u8054\u89c6\u9891\u521b\u4f5c\u3001\u4e16\u754c\u6a21\u62df\u4e0e\u9012\u5f52\u6539\u8fdb\uff0c\u68b3\u7406\u7cfb\u7edf\u8bbe\u8ba1\u8def\u5f84\u3002", "upvotes": 70, "what_it_is": "\u8fd9\u4efd\u62a5\u544a\u4ee5\u53ef\u6267\u884c\u7684\u667a\u80fd\u4f53\u8fd0\u884c\u6846\u67b6\u4e3a\u4e3b\u7ebf\uff0c\u5206\u6790\u5176\u5982\u4f55\u7ba1\u7406\u4e0a\u4e0b\u6587\u3001\u5de5\u5177\u3001\u72b6\u6001\u4e0e\u53cd\u9988\uff0c\u8fde\u63a5\u591a\u955c\u5934\u89c6\u9891\u5236\u4f5c\u3001\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u53ca\u6a21\u578b\u5f00\u53d1\u7684\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u5c06\u89c6\u9891\u751f\u6210\u4ece\u5355\u6b21\u5408\u6210\u62d3\u5c55\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u53cd\u9988\u7684\u7cfb\u7edf\uff0c\u5e76\u5f3a\u8c03\u8054\u5408\u8bc4\u4f30\u753b\u9762\u8d28\u91cf\u3001\u4efb\u52a1\u8868\u73b0\u4e0e\u6301\u7eed\u6539\u8fdb\u3002"}, {"abstract": "Decision models target structured tasks by directly predicting choices or scores, avoiding autoregressive decoding latency. However, transferring a generative LLM\u0027s ranking knowledge to a decision model remains challenging: the teacher expresses preferences through a ranked list of document ID sequences, while the student determines the ranking using scores from the first-token position. To bridge this gap, we introduce DecisionRank, a decision model trained through item-space on-policy distillation (OPD). Item-space OPD constructs the student\u0027s rollout by sorting its document scores into a ranked sequence. A generative teacher takes the resulting ranking list as inputs and provides conditional feedback to directly supervise those scores. Combined with offline ranking supervision, DecisionRank achieves state-of-the-art performance on both general and reasoning-intensive retrieval benchmarks such as TREC DL, BEIR, and BRIGHT. Across four benchmarks, item-space OPD consistently outperforms alternative training objectives. Even at 1.7B parameters, DecisionRank surpasses its 27B generative teacher on TREC DL19--23. At 8B, it outperforms its generative listwise counterpart while running $24.5\\times$ faster on TREC DL and $16.7\\times$ faster on BRIGHT.", "arxiv_id": "2610.42128", "arxiv_url": "https://arxiv.org/abs/2610.42128", "authors": ["Yanran Wu", "Dian Yu", "Chongyang Bai", "Jieyi Zhang", "Rui Liu", "Tianyi Chen", "Shike Mei", "Hang Cui", "Frank Shyu", "Sandeep Pandey", "Luke Simon", "Chunwei Liu", "Xi Liu"], "brief": "\u5c06\u5b66\u751f\u7684\u6587\u6863\u5206\u6570\u6392\u5e8f\u6210\u5217\u8868\uff0c\u4ea4\u7ed9\u751f\u6210\u5f0f\u6559\u5e08\u63d0\u4f9b\u6761\u4ef6\u53cd\u9988\uff0c\u518d\u76f4\u63a5\u76d1\u7763\u5b66\u751f\u5206\u6570\u3002\u7ed3\u5408\u79bb\u7ebf\u6392\u5e8f\u76d1\u7763\uff0c\u628a\u6559\u5e08\u7684\u6392\u5e8f\u77e5\u8bc6\u8fc1\u79fb\u5230\u65e0\u9700\u81ea\u56de\u5f52\u89e3\u7801\u7684\u51b3\u7b56\u6a21\u578b\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.42128", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["item-space OPD\u5728\u56db\u4e2a\u57fa\u51c6\u4e0a\u4f18\u4e8e\u5176\u4ed6\u8bad\u7ec3\u76ee\u6807", "1.7B\u5b66\u751f\u5728TREC DL19\u201323\u4e0a\u8d85\u8fc727B\u6559\u5e08", "8B\u6a21\u578b\u4f18\u4e8e\u751f\u6210\u5f0f\u5bf9\u5e94\u6a21\u578b\uff0c\u63d0\u901f16.7\u201324.5\u500d"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6587\u6863\u91cd\u6392", "\u4fe1\u606f\u68c0\u7d22", "\u51b3\u7b56\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2610.42128v1", "published_at": "2026-10-30", "score": 0.528, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (14\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.42128.png", "title": "DecisionRank: On-Policy Distillation for Decision-Model Rerankers", "tldr": "\u901a\u8fc7\u6587\u6863\u6392\u5e8f\u7a7a\u95f4\u7684\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff0c\u8ba9\u51b3\u7b56\u5f0f\u91cd\u6392\u6a21\u578b\u517c\u987e\u6548\u679c\u4e0e\u901f\u5ea6\u3002", "upvotes": 14, "what_it_is": "\u5c06\u5b66\u751f\u7684\u6587\u6863\u5206\u6570\u6392\u5e8f\u6210\u5217\u8868\uff0c\u4ea4\u7ed9\u751f\u6210\u5f0f\u6559\u5e08\u63d0\u4f9b\u6761\u4ef6\u53cd\u9988\uff0c\u518d\u76f4\u63a5\u76d1\u7763\u5b66\u751f\u5206\u6570\u3002\u7ed3\u5408\u79bb\u7ebf\u6392\u5e8f\u76d1\u7763\uff0c\u628a\u6559\u5e08\u7684\u6392\u5e8f\u77e5\u8bc6\u8fc1\u79fb\u5230\u65e0\u9700\u81ea\u56de\u5f52\u89e3\u7801\u7684\u51b3\u7b56\u6a21\u578b\u3002", "why_notable": "\u6253\u901a\u751f\u6210\u5f0f\u6559\u5e08\u4e0e\u6253\u5206\u5f0f\u5b66\u751f\u4e4b\u95f4\u7684\u76d1\u7763\u63a5\u53e3\uff0c\u5728\u901a\u7528\u53ca\u63a8\u7406\u5bc6\u96c6\u68c0\u7d22\u4e2d\u540c\u65f6\u63d0\u5347\u6548\u679c\u548c\u901f\u5ea6\uff0c\u4e3a\u4f4e\u5ef6\u8fdf\u91cd\u6392\u63d0\u4f9b\u6709\u6548\u8def\u5f84\u3002"}, {"abstract": "Progress in AI is often measured by what a single model can do on its own. Yet teams of AI agents are starting to make breakthroughs and discoveries in science, medicine, mathematics and software engineering. As AI begins to work in teams of agents and people, the ability to collaborate becomes a core part of their intelligence. Research on human teams has measured this ability for decades. Inspired by this, we introduce the Collaborative Intelligence Benchmark, which measures how well an AI agent works as a teammate. It contains 240 tasks across 8 dimensions of teamwork, from refusing an unsafe shortcut to checking the work that a weaker model leaves behind. Each task comes from a real record or an existing benchmark, from aviation accident reports and clinical cases to coding tasks and negotiations, and has a programmatically verifiable outcome. To isolate teamwork from individual capability, models are scored only on tasks that they can solve by themselves when they have full information. We evaluate 18 closed- and open-weight models and find that every model, across sizes and families, has clear weaknesses as a teammate, with the best model scoring only 82.2 out of 100. Frontier models almost always refuse unsafe shortcuts and report misconduct, yet they cave under interpersonal pressure, reaching the best overall deal in only 14% of conflicts, and their pass rate drops from 97% to 81% when they take over a task in which a weaker model has cheated. Crucially, general capability does not guarantee good teamwork, as models with nearly the same capability score differ by up to 11 points as teammates. The benchmark includes 160 public tasks with code and data, along with 80 held-out tasks for evaluation. As AI agents increasingly work alongside other agents and people, the ability to collaborate effectively is becoming a crucial capability to measure and develop.", "arxiv_id": "2611.02633", "arxiv_url": "https://arxiv.org/abs/2611.02633", "authors": ["Sean Wu", "Aneesh Pappu", "Jiaru Zou", "Yubin Kim", "Yuncong Mao", "Hongjian Zhou", "Junchi Yu", "Jieneng Chen", "James Zou"], "brief": "\u63d0\u51fa Collaborative Intelligence Benchmark\uff0c\u4ee5\u771f\u5b9e\u8bb0\u5f55\u548c\u65e2\u6709\u57fa\u51c6\u6784\u5efa\u534f\u4f5c\u4efb\u52a1\uff1b\u4ec5\u8bc4\u6d4b\u6a21\u578b\u5728\u4fe1\u606f\u5b8c\u6574\u65f6\u80fd\u72ec\u7acb\u89e3\u7b54\u7684\u9898\u76ee\uff0c\u9694\u79bb\u4e2a\u4f53\u80fd\u529b\u5f71\u54cd\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/zou-group/collaborative-intelligence", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2611.02633", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["240\u9879\u4efb\u52a1\u8986\u76d68\u4e2a\u534f\u4f5c\u7ef4\u5ea6\uff0c\u7ed3\u679c\u53ef\u7a0b\u5e8f\u9a8c\u8bc1", "\u8bc4\u6d4b18\u4e2a\u6a21\u578b\uff0c\u6700\u4f73\u534f\u4f5c\u5f97\u5206\u4ec582.2\u5206", "\u51b2\u7a81\u4e2d\u6700\u4f18\u534f\u8bae\u8fbe\u6210\u7387\u4ec514%\uff0c\u63a5\u624b\u4f5c\u5f0a\u4efb\u52a1\u901a\u8fc7\u7387\u964d\u81f381%"], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u56e2\u961f\u534f\u4f5c", "\u591a\u667a\u80fd\u4f53", "\u4eba\u673a\u534f\u4f5c"], "num_comments": 1, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2611.02633v1", "published_at": "2026-11-02", "score": 0.522, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (13\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02633.png", "title": "Measuring AI Agents as Teammates with Collaborative Intelligence", "tldr": "\u65b0\u57fa\u51c6\u9694\u79bb\u4e2a\u4f53\u80fd\u529b\u8bc4\u4f30\u667a\u80fd\u4f53\u534f\u4f5c\uff0c\u63ed\u793a\u5f3a\u6a21\u578b\u4e5f\u672a\u5fc5\u662f\u597d\u961f\u53cb\u3002", "upvotes": 13, "what_it_is": "\u63d0\u51fa Collaborative Intelligence Benchmark\uff0c\u4ee5\u771f\u5b9e\u8bb0\u5f55\u548c\u65e2\u6709\u57fa\u51c6\u6784\u5efa\u534f\u4f5c\u4efb\u52a1\uff1b\u4ec5\u8bc4\u6d4b\u6a21\u578b\u5728\u4fe1\u606f\u5b8c\u6574\u65f6\u80fd\u72ec\u7acb\u89e3\u7b54\u7684\u9898\u76ee\uff0c\u9694\u79bb\u4e2a\u4f53\u80fd\u529b\u5f71\u54cd\u3002", "why_notable": "\u5c06\u8bc4\u4f30\u7126\u70b9\u4ece\u72ec\u7acb\u89e3\u9898\u8f6c\u5411\u56e2\u961f\u534f\u4f5c\uff1b\u80fd\u529b\u76f8\u8fd1\u6a21\u578b\u7684\u534f\u4f5c\u5f97\u5206\u53ef\u5dee11\u5206\uff0c\u4e3a\u591a\u667a\u80fd\u4f53\u4e0e\u4eba\u673a\u56e2\u961f\u9009\u578b\u63d0\u4f9b\u4f9d\u636e\u3002"}, {"abstract": "Computer graphics is built on code. Large language model (LLM) agents can now generate graphics code and iteratively refine it through various feedback. This capability opens the door to a potentially new paradigm of computer graphics, with graphics algorithms increasingly built around agentic systems to automate progressively complex tasks. Over the past years, research on agentic graphics has expanded rapidly across a diverse range of tasks. This rapid growth makes it increasingly difficult for manual literature reviews to keep pace with new developments. At the same time, similar ideas are often described using different terminology across these tasks, further complicating efforts to develop a systematic understanding of the field. In this report, we address these challenges through two contributions. First, we introduce a unified taxonomy for characterizing agentic systems across diverse computer graphics tasks. Second, we develop an agentic literature system that can assist human researchers in analyzing existing and newly published papers at scale. Building on these contributions, we analyze emerging research trends and discuss open challenges in coordinating agents and tools across graphics tasks, designing interfaces and representations for human-agent collaboration, sustaining long-horizon planning and refinement, and reliably evaluating interactive graphics systems.", "arxiv_id": "2611.01860", "arxiv_url": "https://arxiv.org/abs/2611.01860", "authors": ["Hengyu Liu", "Jihyeon Je", "Ruiqi Wang", "Mingxuan Wu", "Haven Feng", "Qixing Huang", "Georgios Pavlakos", "Hao Zhang", "Jiajun Wu", "Maneesh Agrawala", "Leonidas Guibas", "R. Kenny Jones", "Shangzhe Wu", "Guandao Yang"], "brief": "\u8fd9\u4efd\u62a5\u544a\u63d0\u51fa\u8de8\u56fe\u5f62\u5b66\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u7edf\u4e00\u5206\u7c7b\u6846\u67b6\uff0c\u5e76\u6784\u5efa\u8f85\u52a9\u7814\u7a76\u8005\u5206\u6790\u65b0\u65e7\u8bba\u6587\u7684\u6587\u732e\u7cfb\u7edf\uff0c\u7528\u4e8e\u89c4\u6a21\u5316\u68b3\u7406\u7814\u7a76\u8d8b\u52bf\u4e0e\u5f00\u653e\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01860", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["\u7edf\u4e00\u5206\u7c7b\u6846\u67b6\u523b\u753b\u8de8\u56fe\u5f62\u5b66\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u7cfb\u7edf", "\u667a\u80fd\u4f53\u6587\u732e\u7cfb\u7edf\u8f85\u52a9\u89c4\u6a21\u5316\u5206\u6790\u65b0\u65e7\u8bba\u6587", "\u68b3\u7406\u5de5\u5177\u534f\u8c03\u3001\u957f\u7a0b\u89c4\u5212\u4e0e\u4ea4\u4e92\u8bc4\u4f30\u6311\u6218"], "keywords": ["\u8ba1\u7b97\u673a\u56fe\u5f62\u5b66", "\u667a\u80fd\u4f53", "\u6587\u732e\u5206\u6790", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "University of Texas at Austin", "pdf_url": "https://arxiv.org/pdf/2611.01860v1", "published_at": "2026-11-01", "score": 0.502, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (111\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01860.png", "title": "Advances in Agentic Computer Graphics", "tldr": "\u4ee5\u7edf\u4e00\u5206\u7c7b\u6846\u67b6\u548c\u667a\u80fd\u4f53\u6587\u732e\u5206\u6790\u7cfb\u7edf\uff0c\u68b3\u7406\u56fe\u5f62\u5b66\u667a\u80fd\u4f53\u7814\u7a76\u8d8b\u52bf\u4e0e\u6311\u6218\u3002", "upvotes": 111, "what_it_is": "\u8fd9\u4efd\u62a5\u544a\u63d0\u51fa\u8de8\u56fe\u5f62\u5b66\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u7edf\u4e00\u5206\u7c7b\u6846\u67b6\uff0c\u5e76\u6784\u5efa\u8f85\u52a9\u7814\u7a76\u8005\u5206\u6790\u65b0\u65e7\u8bba\u6587\u7684\u6587\u732e\u7cfb\u7edf\uff0c\u7528\u4e8e\u89c4\u6a21\u5316\u68b3\u7406\u7814\u7a76\u8d8b\u52bf\u4e0e\u5f00\u653e\u95ee\u9898\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u8fde\u63a5\u4e0d\u540c\u56fe\u5f62\u5b66\u4efb\u52a1\u4e2d\u672f\u8bed\u5404\u5f02\u7684\u76f8\u4f3c\u65b9\u6cd5\uff0c\u5e76\u7528\u667a\u80fd\u4f53\u8f85\u52a9\u6587\u732e\u5206\u6790\uff0c\u4e3a\u6301\u7eed\u8ffd\u8e2a\u5feb\u901f\u6269\u5f20\u7684\u9886\u57df\u63d0\u4f9b\u7cfb\u7edf\u5316\u57fa\u7840\u3002"}, {"abstract": "Large language models (LLMs) are driving autonomous agents toward real-world environments, with the Web emerging as one of the most representative interaction scenarios. However, training Web agents with naive exploration remains challenging: successful trajectories are rare, and the sparse terminal rewards make it difficult for agents to obtain useful feedback from failed trajectories. Inspired by skill acquisition theory, we propose Skill-Composed Progressive Exploration (SCOPE), a short-to-long learning framework for long-horizon Web agents that decomposes complex task exploration into a gradual expansion process from local skills to complete task-solving capability. Specifically, SCOPE iteratively explores around local skills: Skill Discovery extracts reusable local skills and failure experiences from historical rollouts; Skill Orchestration composes discovered skills into high-level skill chains; and Skill Expansion leverages failure experiences aligned with the current skill chain to guide the agent toward exploring new subskills. Through this process, SCOPE progressively constructs task-completing skill chains across rollouts and internalizes them into the policy parameters through agentic on-policy distillation. Extensive experiments on WebArena, WebVoyager, and WebShop show that SCOPE consistently improves exploration dynamics and achieves 3.9% to 18.6% relative gains over the strongest baselines in each setting.", "arxiv_id": "2611.03116", "arxiv_url": "https://arxiv.org/abs/2611.03116", "authors": ["Xueyang Feng", "Xiaohe Bo", "Xu Chen", "Quanyu Dai", "Feng Wen"], "brief": "\u63d0\u51faSCOPE\u77ed\u5230\u957f\u5b66\u4e60\u6846\u67b6\uff0c\u4ece\u5386\u53f2\u8f68\u8ff9\u63d0\u53d6\u6280\u80fd\u4e0e\u5931\u8d25\u7ecf\u9a8c\uff0c\u7f16\u6392\u6280\u80fd\u94fe\u5e76\u63a2\u7d22\u65b0\u5b50\u6280\u80fd\uff0c\u518d\u901a\u8fc7\u667a\u80fd\u4f53\u540c\u7b56\u7565\u84b8\u998f\u5c06\u6280\u80fd\u94fe\u5185\u5316\u5230\u7b56\u7565\u53c2\u6570\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03116", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["SCOPE\u5faa\u73af\u6267\u884c\u6280\u80fd\u53d1\u73b0\u3001\u6280\u80fd\u7f16\u6392\u4e0e\u6280\u80fd\u6269\u5c55", "\u5229\u7528\u4e0e\u5f53\u524d\u6280\u80fd\u94fe\u5bf9\u9f50\u7684\u5931\u8d25\u7ecf\u9a8c\u6307\u5bfc\u65b0\u5b50\u6280\u80fd\u63a2\u7d22", "\u5728\u4e09\u4e2a\u7f51\u9875\u57fa\u51c6\u4e0a\u8f83\u6700\u5f3a\u57fa\u7ebf\u76f8\u5bf9\u63d0\u53473.9%\u81f318.6%"], "keywords": ["\u7f51\u9875\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u957f\u7a0b\u4efb\u52a1", "\u7b56\u7565\u84b8\u998f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03116v1", "published_at": "2026-11-02", "score": 0.5, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "From Local Skills to Long-Horizon Web Tasks: Progressive Skill Exploration for LLM Web Agents", "tldr": "\u901a\u8fc7\u590d\u7528\u5c40\u90e8\u6280\u80fd\u4e0e\u5931\u8d25\u7ecf\u9a8c\uff0c\u9010\u6b65\u8bad\u7ec3\u80fd\u5b8c\u6210\u957f\u7a0b\u7f51\u9875\u4efb\u52a1\u7684\u667a\u80fd\u4f53\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faSCOPE\u77ed\u5230\u957f\u5b66\u4e60\u6846\u67b6\uff0c\u4ece\u5386\u53f2\u8f68\u8ff9\u63d0\u53d6\u6280\u80fd\u4e0e\u5931\u8d25\u7ecf\u9a8c\uff0c\u7f16\u6392\u6280\u80fd\u94fe\u5e76\u63a2\u7d22\u65b0\u5b50\u6280\u80fd\uff0c\u518d\u901a\u8fc7\u667a\u80fd\u4f53\u540c\u7b56\u7565\u84b8\u998f\u5c06\u6280\u80fd\u94fe\u5185\u5316\u5230\u7b56\u7565\u53c2\u6570\u3002", "why_notable": "\u5c06\u5931\u8d25\u8f68\u8ff9\u8f6c\u5316\u4e3a\u63a2\u7d22\u7ebf\u7d22\uff0c\u7f13\u89e3\u957f\u7a0b\u7f51\u9875\u4efb\u52a1\u5956\u52b1\u7a00\u758f\u7684\u95ee\u9898\uff1b\u8de8\u4e09\u4e2a\u57fa\u51c6\u7684\u63d0\u5347\u652f\u6301\u4e86\u6e10\u8fdb\u5f0f\u6280\u80fd\u7ec4\u5408\u7684\u4ef7\u503c\u3002"}, {"abstract": "Humans continuously acquire knowledge from carefully crafted materials such as books and tutorial videos, carrying that understanding into future tasks. Millions of such instructional videos are uploaded online every day, yet LLM agents remain unable to exploit this ever-expanding wealth of human teaching. Their capabilities are frozen after training, while parameter updates at scale remain prohibitively expensive. This raises the central question: can LLM agents learn from this vast instructional resource without parameter updates? We introduce Tutorial Agentic Learning (TAL), a nonparametric continual-learning paradigm that consolidates tutorial videos into a persistent, structured tutorialbook memory through a two-stage adversarial process that harvests hard, video-grounded questions and uses them to refine the memory. At inference time, TAL retrieves through a Table-of-Contents (TOC) tree, tying retrieval directly to the model\u0027s reasoning rather than to embedding similarity. To study this setting, we introduce VidLearn, a multimodal QA benchmark built from 72 chess tutorial videos spanning 12 openings. On VidLearn, TAL outperforms all evaluated baselines and improves monotonically as more videos are consumed, achieving up to 113% and 91% relative gains over the corresponding vanilla MLLMs on the training and test splits, respectively. In actual gameplay, TAL reaches a stronger opening-phase position than its vanilla counterpart in 69% of head-to-head games. Evaluation in a second domain further demonstrates the generality of TAL. Together, these results highlight instructional videos as a scalable resource for parameter-update-free agent continual learning.", "arxiv_id": "2611.01460", "arxiv_url": "https://arxiv.org/abs/2611.01460", "authors": ["Haoyu Zhao", "Zafeirios Fountas", "Jun Wang"], "brief": "\u63d0\u51faTAL\u975e\u53c2\u6570\u6301\u7eed\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u4e24\u9636\u6bb5\u5bf9\u6297\u8fc7\u7a0b\u6316\u6398\u89c6\u9891\u96be\u9898\u5e76\u4fee\u8ba2\u7ed3\u6784\u5316\u6559\u7a0b\u8bb0\u5fc6\uff1b\u63a8\u7406\u65f6\u6cbf\u76ee\u5f55\u6811\u68c0\u7d22\uff0c\u8ba9\u8bb0\u5fc6\u8c03\u7528\u4e0e\u6a21\u578b\u63a8\u7406\u76f8\u7ed3\u5408\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01460", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["VidLearn\u542b72\u4e2a\u56fd\u9645\u8c61\u68cb\u6559\u7a0b\u89c6\u9891\uff0c\u8986\u76d612\u79cd\u5f00\u5c40", "TAL\u6d4b\u8bd5\u96c6\u76f8\u5bf9\u539f\u59cb\u591a\u6a21\u6001\u6a21\u578b\u6700\u9ad8\u63d0\u534791%", "\u5bf9\u5f08\u4e2d69%\u7684\u68cb\u5c40\u83b7\u5f97\u6bd4\u539f\u59cb\u6a21\u578b\u66f4\u597d\u7684\u5f00\u5c40\u5c40\u9762"], "keywords": ["\u667a\u80fd\u4f53", "\u6301\u7eed\u5b66\u4e60", "\u591a\u6a21\u6001\u5b66\u4e60", "\u8bb0\u5fc6\u68c0\u7d22"], "num_comments": 1, "on_hf": true, "organization": "University College London", "pdf_url": "https://arxiv.org/pdf/2611.01460v1", "published_at": "2026-11-01", "score": 0.476, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01460.png", "title": "Can Large Language Model Agents Learn by Watching Tutorial Videos?", "tldr": "\u667a\u80fd\u4f53\u65e0\u9700\u66f4\u65b0\u53c2\u6570\uff0c\u4e5f\u80fd\u5c06\u6559\u7a0b\u89c6\u9891\u8f6c\u5316\u4e3a\u6301\u4e45\u8bb0\u5fc6\u5e76\u63d0\u5347\u95ee\u7b54\u4e0e\u5b9e\u6218\u80fd\u529b\u3002", "upvotes": 5, "what_it_is": "\u63d0\u51faTAL\u975e\u53c2\u6570\u6301\u7eed\u5b66\u4e60\u6846\u67b6\uff0c\u901a\u8fc7\u4e24\u9636\u6bb5\u5bf9\u6297\u8fc7\u7a0b\u6316\u6398\u89c6\u9891\u96be\u9898\u5e76\u4fee\u8ba2\u7ed3\u6784\u5316\u6559\u7a0b\u8bb0\u5fc6\uff1b\u63a8\u7406\u65f6\u6cbf\u76ee\u5f55\u6811\u68c0\u7d22\uff0c\u8ba9\u8bb0\u5fc6\u8c03\u7528\u4e0e\u6a21\u578b\u63a8\u7406\u76f8\u7ed3\u5408\u3002", "why_notable": "\u5c06\u6559\u7a0b\u89c6\u9891\u53d8\u6210\u65e0\u9700\u66f4\u65b0\u53c2\u6570\u7684\u6301\u7eed\u5b66\u4e60\u8d44\u6e90\uff0c\u4e14\u6536\u76ca\u968f\u89c6\u9891\u589e\u52a0\u800c\u63d0\u5347\uff1b\u95ee\u7b54\u548c\u5b9e\u6218\u7ed3\u679c\u5171\u540c\u652f\u6301\u7ed3\u6784\u5316\u8bb0\u5fc6\u7684\u4ef7\u503c\u3002"}, {"abstract": "Vision-language models can get individual judgments right while struggling to recover and consistently use the exact properties of a 3D object. To characterize this gap, we introduce BedBench, a controlled benchmark of thirteen procedurally generated tasks spanning individual judgments and composite answers. Across twelve open-weight and four frontier models, per-color counting exposes a pronounced weakness: humans achieve 93.3% accuracy, compared with 7.2% for the best model. Targeted fine-tuning raises one model\u0027s accuracy from 3.0% to 68.6%, but reveals a further difficulty: its answers about the most common colors remain inconsistent with its own per-color counts. Supplying those counts as text improves its judgments, showing that recovering a property does not mean using it consistently. Reasoning, scaling, and added visual cues each improve individual judgments, but none makes exact answers reliable. To locate the difficulty, we probe Qwen3.5-27B: exact per-color counts remain recoverable at the language model\u0027s input, yet the model\u0027s answers rarely recover them (65.0% for the probe vs. 3.0% for the model). Image-removal controls further show that some apparent successes require no visual evidence. These findings motivate evaluating 3D reasoning by exact correctness, consistent use, and image dependence, rather than accuracy alone. Code and dataset are publicly available: https://github.com/leduckhai/BedBench", "arxiv_id": "2610.39639", "arxiv_url": "https://arxiv.org/abs/2610.39639", "authors": ["Khai Le-Duc", "Nguyen Kim Hai Bui", "An Ngo", "Nam D. Hoang", "Yueqi Song", "Jiarui Liu", "Thai Quoc Hoang", "Fang Wu", "Chris Ngo", "Terry Jingchen Zhang", "Mona T. Diab", "Ran Xu", "Silvio Savarese", "Xiao-Ming Wu"], "brief": "\u7814\u7a76\u6784\u5efa\u5305\u542b13\u9879\u7a0b\u5e8f\u5316\u751f\u6210\u4efb\u52a1\u7684BedBench\uff0c\u8bc4\u6d4b16\u4e2a\u6a21\u578b\u7684\u4e09\u7ef4\u5c5e\u6027\u5224\u65ad\u4e0e\u7ec4\u5408\u56de\u7b54\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u3001\u8868\u5f81\u63a2\u6d4b\u53ca\u79fb\u9664\u56fe\u50cf\u5b9a\u4f4d\u5931\u8d25\u73af\u8282\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/leduckhai/BedBench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.39639", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u9010\u989c\u8272\u8ba1\u6570\uff1a\u4eba\u7c7b\u51c6\u786e\u738793.3%\uff0c\u6700\u4f73\u6a21\u578b7.2%", "\u5b9a\u5411\u5fae\u8c03\u4f7f\u51c6\u786e\u7387\u4ece3.0%\u5347\u81f368.6%\uff0c\u4f46\u56de\u7b54\u4ecd\u4e0d\u4e00\u81f4", "Qwen3.5-27B\u63a2\u9488\u8ba1\u6570\u51c6\u786e\u738765%\uff0c\u6a21\u578b\u4ec53%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4e09\u7ef4\u63a8\u7406", "\u6a21\u578b\u8bc4\u6d4b", "\u8868\u5f81\u63a2\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Stanford University", "pdf_url": "https://arxiv.org/pdf/2610.39639v1", "published_at": "2026-10-29", "score": 0.474, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Stanford", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39639.png", "title": "Where Do Vision Language Models Fail at 3D Reasoning?", "tldr": "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u80fd\u7b54\u5bf9\u5c40\u90e8\u5224\u65ad\uff0c\u5374\u96be\u4ee5\u51c6\u786e\u63d0\u53d6\u5e76\u4e00\u81f4\u4f7f\u7528\u4e09\u7ef4\u7269\u4f53\u5c5e\u6027\u3002", "upvotes": 4, "what_it_is": "\u7814\u7a76\u6784\u5efa\u5305\u542b13\u9879\u7a0b\u5e8f\u5316\u751f\u6210\u4efb\u52a1\u7684BedBench\uff0c\u8bc4\u6d4b16\u4e2a\u6a21\u578b\u7684\u4e09\u7ef4\u5c5e\u6027\u5224\u65ad\u4e0e\u7ec4\u5408\u56de\u7b54\uff0c\u5e76\u901a\u8fc7\u5fae\u8c03\u3001\u8868\u5f81\u63a2\u6d4b\u53ca\u79fb\u9664\u56fe\u50cf\u5b9a\u4f4d\u5931\u8d25\u73af\u8282\u3002", "why_notable": "\u5b83\u533a\u5206\u4e86\u5c5e\u6027\u63d0\u53d6\u4e0e\u4e00\u81f4\u4f7f\u7528\u4e24\u7c7b\u74f6\u9888\uff0c\u5e76\u63ed\u793a\u90e8\u5206\u7b54\u5bf9\u65e0\u9700\u56fe\u50cf\u8bc1\u636e\uff0c\u63a8\u52a8\u4e09\u7ef4\u63a8\u7406\u8bc4\u6d4b\u540c\u65f6\u5173\u6ce8\u7cbe\u786e\u6027\u3001\u4e00\u81f4\u6027\u4e0e\u56fe\u50cf\u4f9d\u8d56\u3002"}, {"abstract": "Large language model (LLM)-based multi-agent systems (MAS) coordinate specialized agents to solve complex tasks, turning each user request into interdependent model and tool operations. Unlike independent requests, these operations become ready at different times and consume evolving context as agents coordinate and exchange results. This creates changing patterns of concurrency, computation, and memory demand that can expose different bottlenecks in LLM serving hardware. Yet benchmarking these effects requires capturing the collaboration rules that generate serving workloads, beyond the requests observed during execution. We present MAServeBench, a benchmark that treats multi-agent collaboration as a configurable dimension of serving workloads for LLM serving and hardware evaluation. Its composable stages capture how agents coordinate and exchange context in documented MAS workflows, enabling native executions to generate different workloads even when task inputs and tools remain unchanged. Hierarchical Semantic Traces preserve realized operations and dependencies for reproducible fixed-work replay and as inputs to architecture simulators. Task-linked measurements connect these workloads to serving execution and GPU/NPU hardware behavior, revealing why serving efficiency does not always translate into timely task completion. The benchmark code is available at https://github.com/ShengxuanQiu/MAServeBench.", "arxiv_id": "2610.40293", "arxiv_url": "https://arxiv.org/abs/2610.40293", "authors": ["Shengxuan Qiu", "Haochen Huang", "Shuzhang Zhong", "Zizhuo Fu", "Zebin Yang", "Meng Li"], "brief": "MAServeBench\u7528\u53ef\u7ec4\u5408\u9636\u6bb5\u914d\u7f6e\u667a\u80fd\u4f53\u534f\u8c03\u4e0e\u4e0a\u4e0b\u6587\u4ea4\u6362\uff0c\u5728\u76f8\u540c\u8f93\u5165\u548c\u5de5\u5177\u4e0b\u751f\u6210\u4e0d\u540c\u8d1f\u8f7d\uff0c\u5e76\u4ee5\u5c42\u6b21\u8bed\u4e49\u8f68\u8ff9\u652f\u6301\u53ef\u590d\u73b0\u56de\u653e\u4e0e\u67b6\u6784\u6a21\u62df\u3002", "categories": ["cs.MA"], "github_repo": "https://github.com/ShengxuanQiu/MAServeBench", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.40293", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u53ef\u7ec4\u5408\u534f\u4f5c\u9636\u6bb5\u6539\u53d8\u5e76\u53d1\u3001\u8ba1\u7b97\u4e0e\u5185\u5b58\u9700\u6c42", "\u5c42\u6b21\u8bed\u4e49\u8f68\u8ff9\u4fdd\u7559\u5b9e\u9645\u64cd\u4f5c\u53ca\u4f9d\u8d56\uff0c\u652f\u6301\u56fa\u5b9a\u5de5\u4f5c\u91cf\u56de\u653e", "\u4efb\u52a1\u5173\u8054\u6d4b\u91cf\u8fde\u63a5\u670d\u52a1\u6267\u884c\u4e0eGPU/NPU\u786c\u4ef6\u884c\u4e3a"], "keywords": ["\u591a\u667a\u80fd\u4f53\u7cfb\u7edf", "\u5927\u6a21\u578b\u63a8\u7406\u670d\u52a1", "\u6027\u80fd\u57fa\u51c6", "\u786c\u4ef6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2610.40293v2", "published_at": "2026-10-29", "score": 0.464, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.40293.png", "title": "MAServeBench: Benchmarking Multi-Agent LLM Serving Systems with Hierarchical Collaboration Workloads", "tldr": "\u5c06\u591a\u667a\u80fd\u4f53\u534f\u4f5c\u89c4\u5219\u7eb3\u5165\u670d\u52a1\u57fa\u51c6\uff0c\u63ed\u793a\u786c\u4ef6\u6548\u7387\u4e0e\u4efb\u52a1\u5b8c\u6210\u65f6\u6548\u7684\u5dee\u5f02\u3002", "upvotes": 9, "what_it_is": "MAServeBench\u7528\u53ef\u7ec4\u5408\u9636\u6bb5\u914d\u7f6e\u667a\u80fd\u4f53\u534f\u8c03\u4e0e\u4e0a\u4e0b\u6587\u4ea4\u6362\uff0c\u5728\u76f8\u540c\u8f93\u5165\u548c\u5de5\u5177\u4e0b\u751f\u6210\u4e0d\u540c\u8d1f\u8f7d\uff0c\u5e76\u4ee5\u5c42\u6b21\u8bed\u4e49\u8f68\u8ff9\u652f\u6301\u53ef\u590d\u73b0\u56de\u653e\u4e0e\u67b6\u6784\u6a21\u62df\u3002", "why_notable": "\u5b83\u5c06\u8bc4\u6d4b\u5bf9\u8c61\u4ece\u72ec\u7acb\u8bf7\u6c42\u6269\u5c55\u5230\u534f\u4f5c\u751f\u6210\u7684\u4f9d\u8d56\u8d1f\u8f7d\uff0c\u5e2e\u52a9\u8fa8\u8bc6\u786c\u4ef6\u74f6\u9888\uff0c\u5e76\u89e3\u91ca\u4e3a\u4f55\u670d\u52a1\u6548\u7387\u63d0\u5347\u672a\u5fc5\u52a0\u5feb\u4efb\u52a1\u5b8c\u6210\u3002"}, {"abstract": "GUI web agents require realistic and interactive environments that remain stable during both evaluation and training. Live website evaluation suffers from changing content, access restrictions, and limited coverage of authenticated workflows, while existing synthetic environments for training often lack functional depth and visual fidelity. We propose WebHarbor, a suite of 153 executable and dockerized website environments that faithfully reconstruct the visual interfaces, content, and functional workflows of real-world web services under deterministic control. We build WebHarbor through task-driven human-agent collaboration, where environments evolve as new tasks expand their functional scope, coding agents implement the required changes, and human contributors audit visual fidelity, functional correctness, and task validity. The resulting suite comprises 3,518 tasks spanning multi-step and post-authentication workflows, where existing works often fail to cover. Beyond reliable evaluation, WebHarbor provides high-fidelity synthetic web environments for cost-efficient reinforcement learning (RL). We demonstrate that a Qwen 4B-level GUI agent trained with RL in WebHarbor generalizes to unseen tasks and performs competitively with leading open-source GUI web agents across four benchmarks. The code and data are publicly available at https://github.com/aiming-lab/WebHarbor.", "arxiv_id": "2611.03634", "arxiv_url": "https://arxiv.org/abs/2611.03634", "authors": ["Zhaoyang Wang", "Qianhui Wu", "Boyu Gou", "Demi Wang", "Jiacheng Zhang", "Peichun Hua", "Qize Li", "Shi Qiu", "Yifan Jiang", "Yifan Zhang", "Zexu Jin", "Baolin Peng", "Bolin Shen", "Chetan Bansal", "Dehan Kong", "Deren Lei", "Dongshen Peng", "Fengqing Jiang", "Hao Cheng", "Haoqing Wang", "Jiaming Shan", "Jicheng Wang", "Jingguang Zhou", "Jixuan He", "Kaide Zeng", "Kangyu Zhu", "Lama Moukheiber", "Mufan Qiu", "Peng Xia", "Qihan Sun", "Qingwei Lin", "Qiushi Sun", "Ruichen Zhang", "Shuqing Luo", "Si Qin", "Sicheng Fan", "Tao Xiong", "Wenlin Yao", "Xinyu Zhang", "Xinyue Zeng", "Xuanrui Li", "Xuchao Zhang", "Yian Wang", "Yichao Liu", "Yiming Liang", "Yiyang Zhou", "Yizhu Jiao", "Yuetai Li", "Yurun Chen", "Yuxuan Zhang", "Zheyuan Yang", "Zhiyuan Yao", "Zhongyang Li", "Zihao Li", "Zili Wang", "Jianfeng Gao", "Huaxiu Yao"], "brief": "WebHarbor\u5c06\u771f\u5b9e\u7f51\u7ad9\u590d\u523b\u4e3a\u53ef\u6267\u884c\u3001\u5bb9\u5668\u5316\u73af\u5883\uff0c\u8986\u76d6\u754c\u9762\u4e0e\u529f af\u5883\u4e0d\u7a33\u5b9a\u548c\u5408\u6210\u73af\u5883\u529f\u80fd\u4e0d\u8db3\uff1b\u5f00\u6e90\u8d44\u6e90\u652f\u6301\u590d\u73b0\uff0c\u8bad\u7ec3\u7ed3\u679c\u663e\u793a\u5bf9\u672a\u89c1\u4efb\u52a1\u7684\u6cdb\u5316\u3002"}, {"abstract": "Recent language model (LM) safety failures have largely been studied as disparate phenomena. In agentic misalignment, a model blackmails an executive to avoid being replaced. In alignment faking, it complies with harmful requests during training to keep its values from being modified. We argue that these behaviours share a common decision structure: a model assigned a goal must either take a harmful action to preserve it or refuse and lose it. We formalize this as a goal-harm conflict and present the same conflict under various elicitation protocols that range from compact forced-choice prompts to simulated agentic environments. These protocols span two perspectives on LM decision-making, which we term (i) the logit view, reading preferences from answer-token probabilities, and (ii) the sampling view, classifying open-ended responses with an LM judge. Under the logit view, we show that goal importance and harm severity additively shape how a model resolves these value conflicts. Under the sampling view, we derive two factorizations of the harmful-action probability that safety evaluations commonly report. The first measures how well a preference read from answer tokens carries over into behaviour, such as making a harmful tool call. The second attributes a low harmful-action rate either to refusal or to responses that reach no resolution. We then show how fictional context changes a model\u0027s preference under the logit view, and how tool use and partial observability -- two features of agentic evaluations -- change its harmful-action rate under the sampling view. Our work offers a descriptive framework for studying how LMs resolve such value conflicts and for estimating low-probability harmful actions at a finer granularity than the aggregate harm rates commonly reported in safety evaluations.", "arxiv_id": "2611.03374", "arxiv_url": "https://arxiv.org/abs/2611.03374", "authors": ["Brandon Jaipersaud", "Elliot Creager"], "brief": "\u5c06\u52d2\u7d22\u3001\u4f2a\u88c5\u5bf9\u9f50\u7b49\u884c\u4e3a\u7edf\u4e00\u4e3a\u201c\u76ee\u6807\u2014\u4f24\u5bb3\u51b2\u7a81\u201d\uff0c\u5728\u5f3a\u5236\u9009\u62e9\u63d0\u793a\u4e0e\u6a21\u62df\u667a\u80fd\u4f53\u73af\u5883\u4e2d\uff0c\u7528\u7b54\u6848\u6982\u7387\u548c\u5f00\u653e\u56de\u7b54\u5206\u6790\u6a21\u578b\u7684\u504f\u597d\u53ca\u884c\u52a8\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03374", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["logit\u89c6\u89d2\uff1a\u76ee\u6807\u91cd\u8981\u6027\u4e0e\u4f24\u5bb3\u4e25\u91cd\u6027\u5448\u52a0\u6027\u5f71\u54cd", "\u91c7\u6837\u89c6\u89d2\uff1a\u4e24\u79cd\u6982\u7387\u5206\u89e3\u533a\u5206\u504f\u597d\u8f6c\u5316\u3001\u62d2\u7edd\u4e0e\u672a\u51b3", "\u68c0\u9a8c\u865a\u6784\u60c5\u5883\u3001\u5de5\u5177\u4f7f\u7528\u53ca\u90e8\u5206\u53ef\u89c2\u6d4b\u6027\u7684\u5f71\u54cd"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u76ee\u6807\u51b2\u7a81", "\u6a21\u578b\u5bf9\u9f50", "\u98ce\u9669\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03374v1", "published_at": "2026-11-02", "score": 0.425, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Characterizing When Language Models Take Harmful Actions to Protect Their Assigned Goals", "tldr": "\u7814\u7a76\u6a21\u578b\u4e3a\u4fdd\u5168\u76ee\u6807\u800c\u91c7\u53d6\u6709\u5bb3\u884c\u52a8\u7684\u6761\u4ef6\uff0c\u5e76\u7ec6\u5206\u4f4e\u6982\u7387\u98ce\u9669\u7684\u6765\u6e90\u3002", "upvotes": 0, "what_it_is": "\u5c06\u52d2\u7d22\u3001\u4f2a\u88c5\u5bf9\u9f50\u7b49\u884c\u4e3a\u7edf\u4e00\u4e3a\u201c\u76ee\u6807\u2014\u4f24\u5bb3\u51b2\u7a81\u201d\uff0c\u5728\u5f3a\u5236\u9009\u62e9\u63d0\u793a\u4e0e\u6a21\u62df\u667a\u80fd\u4f53\u73af\u5883\u4e2d\uff0c\u7528\u7b54\u6848\u6982\u7387\u548c\u5f00\u653e\u56de\u7b54\u5206\u6790\u6a21\u578b\u7684\u504f\u597d\u53ca\u884c\u52a8\u3002", "why_notable": "\u628a\u5206\u6563\u7684\u5931\u51c6\u884c\u4e3a\u7eb3\u5165\u5171\u540c\u51b3\u7b56\u6846\u67b6\uff0c\u5e76\u63ed\u793a\u4f4e\u4f24\u5bb3\u7387\u4e0d\u4e00\u5b9a\u610f\u5473\u7740\u4e3b\u52a8\u62d2\u7edd\uff0c\u4e3a\u667a\u80fd\u4f53\u5b89\u5168\u8bc4\u4f30\u63d0\u4f9b\u66f4\u7ec6\u7c92\u5ea6\u7684\u8bca\u65ad\u3002"}, {"abstract": "Multimodal large language models (MLLMs) can generate detailed video captions, yet they may overemphasize minor details while overlooking essential context and key events. We argue that not all visual evidence deserves equal attention, as the importance of visual information depends on the content of each video. Motivated by this observation, we propose Reviso, an agentic video captioning framework that learns what to observe and how to gather relevant visual evidence. From a low-frame-rate global preview, Reviso constructs a hierarchical Context--Focus--Points (CFP) observation plan that identifies the video context, prioritizes key aspects, and defines concrete observation targets and corresponding tools. Guided by this plan, Reviso performs goal-directed active perception by selectively revisiting temporal segments and combining tools for fine-grained inspection. It interprets the acquired evidence, updates its plan as needed, and integrates global and local information to generate the final caption. To learn this observation strategy, we develop a verification-guided pipeline that constructs high-quality training trajectories through factual verification and teacher-guided refinement. We further train Reviso using Group Relative Policy Optimization (GRPO), incorporating a key-fact reward for caption quality, a Plan Alignment Reward (PAR) for identifying important observation targets, and an Unproductive Tool-Call Penalty (UTCP) that adjusts observation-cost penalties based on caption quality. Experiments across four video captioning benchmarks show that Reviso outperforms the evaluated open-source baselines, while its generated captions better support downstream video question answering. These findings highlight the effectiveness and potential of priority-guided active observation for video captioning.", "arxiv_id": "2611.03602", "arxiv_url": "https://arxiv.org/abs/2611.03602", "authors": ["Tengfei Liu", "Yang Shi", "Yuran Wang", "Yuqi Tang", "Yizhuo Jia", "Zhuoran Zhang", "Qixun Wang", "Shujie Li", "Xuanyu Zhu", "Xinyu Liu", "Minghui Guo", "Shixuan Liu", "Haotian Wang", "Yuanxing Zhang", "Pengfei Wan"], "brief": "Reviso\u662f\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u63cf\u8ff0\u6846\u67b6\uff0c\u4ece\u4f4e\u5e27\u7387\u5168\u5c40\u9884\u89c8\u751f\u6210\u5206\u5c42\u89c2\u5bdf\u8ba1\u5212\uff0c\u518d\u8c03\u7528\u5de5\u5177\u56de\u770b\u5173\u952e\u7247\u6bb5\uff0c\u6309\u8bc1\u636e\u66f4\u65b0\u8ba1\u5212\u5e76\u878d\u5408\u5168\u5c40\u4e0e\u5c40\u90e8\u4fe1\u606f\u751f\u6210\u63cf\u8ff0\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03602", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["CFP\u5206\u5c42\u8ba1\u5212\u660e\u786e\u89c6\u9891\u8bed\u5883\u3001\u91cd\u70b9\u4e0e\u89c2\u5bdf\u76ee\u6807", "\u9a8c\u8bc1\u5f15\u5bfc\u6784\u5efa\u8bad\u7ec3\u8f68\u8ff9\uff0cGRPO\u7ed3\u5408\u5173\u952e\u4e8b\u5b9e\u3001PAR\u4e0eUTCP\u5956\u52b1", "\u57284\u4e2a\u89c6\u9891\u63cf\u8ff0\u57fa\u51c6\u8d85\u8d8a\u6240\u8bc4\u4f30\u7684\u5f00\u6e90\u57fa\u7ebf"], "keywords": ["\u89c6\u9891\u63cf\u8ff0", "\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u4e3b\u52a8\u611f\u77e5", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03602v1", "published_at": "2026-11-02", "score": 0.417, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03602.png", "title": "Reviso: Not All Visual Evidence Deserves Equal Attention in Video Captioning", "tldr": "\u901a\u8fc7\u5206\u5c42\u89c4\u5212\u4e0e\u4e3b\u52a8\u56de\u770b\u5173\u952e\u7247\u6bb5\uff0c\u8ba9\u89c6\u9891\u63cf\u8ff0\u66f4\u5173\u6ce8\u91cd\u8981\u4e8b\u5b9e\u800c\u975e\u6b21\u8981\u7ec6\u8282\u3002", "upvotes": 25, "what_it_is": "Reviso\u662f\u667a\u80fd\u4f53\u5f0f\u89c6\u9891\u63cf\u8ff0\u6846\u67b6\uff0c\u4ece\u4f4e\u5e27\u7387\u5168\u5c40\u9884\u89c8\u751f\u6210\u5206\u5c42\u89c2\u5bdf\u8ba1\u5212\uff0c\u518d\u8c03\u7528\u5de5\u5177\u56de\u770b\u5173\u952e\u7247\u6bb5\uff0c\u6309\u8bc1\u636e\u66f4\u65b0\u8ba1\u5212\u5e76\u878d\u5408\u5168\u5c40\u4e0e\u5c40\u90e8\u4fe1\u606f\u751f\u6210\u63cf\u8ff0\u3002", "why_notable": "\u5c06\u89c6\u9891\u7406\u89e3\u4ece\u88ab\u52a8\u8bfb\u53d6\u8f6c\u4e3a\u6309\u91cd\u8981\u6027\u4e3b\u52a8\u53d6\u8bc1\uff0c\u5728\u63d0\u5347\u63cf\u8ff0\u8d28\u91cf\u7684\u540c\u65f6\u8003\u8651\u5de5\u5177\u8c03\u7528\u6210\u672c\uff0c\u751f\u6210\u7684\u63cf\u8ff0\u4e5f\u66f4\u6709\u52a9\u4e8e\u4e0b\u6e38\u89c6\u9891\u95ee\u7b54\u3002"}, {"abstract": "Personal AI agents are increasingly capable of handling long-horizon tasks across applications, yet users often need to invest substantial effort in specifying goals, resolving ambiguity, and verifying outcomes. We argue that progress should be measured by how effectively agents amplify human agency: enabling people to pursue their goals with less routine supervision while retaining control over consequential decisions. We advocate Avatar Intelligence, a paradigm of persistent personal agents that represent users\u0027 goals, values, and constraints through sustained decision delegation across contexts and time. We describe a maturity roadmap from human-directed execution to autonomous operation within delegated domains, and introduce the Agentic Oversight Index (AOI) as a framework for evaluating delivered value against agent-side operational cost and human oversight burden. We identify three core research challenges: identity-continuous personalization that carries user preferences across tasks, user-situated evolution through Rehearsal Engineering, and safety mechanisms that combine technical control with accountability and recourse. These directions define a research agenda for reliable decision delegation to personal agents across tasks and over time.", "arxiv_id": "2611.03092", "arxiv_url": "https://arxiv.org/abs/2611.03092", "authors": ["Zheng Wu", "Xinbei Ma", "Yao Yao", "Zhaoyuan Huang", "Haowen Hu", "Yijie Lu", "Taolei Wang", "Yifei Yang", "Wuyue Xiong", "Pengzhou Cheng", "Zhuosheng Zhang"], "brief": "\u63d0\u51fa\u6301\u7eed\u4ee3\u8868\u7528\u6237\u76ee\u6807\u3001\u4ef7\u503c\u4e0e\u7ea6\u675f\u7684\u4e2a\u4eba\u4ee3\u7406\u8303\u5f0f\uff0c\u89c4\u5212\u4ece\u4eba\u5de5\u6307\u6325\u5230\u6388\u6743\u57df\u5185\u81ea\u6cbb\u7684\u6210\u719f\u8def\u5f84\uff0c\u5e76\u7528\u76d1\u7763\u6307\u6570\u8861\u91cf\u6536\u76ca\u3001\u8fd0\u884c\u6210\u672c\u4e0e\u4eba\u5de5\u8d1f\u62c5\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03092", "impact_score": 6, "is_agent": true, "is_top": true, "key_points": ["Agentic Oversight Index\u8861\u91cf\u4ef7\u503c\u4e0e\u53cc\u4fa7\u6210\u672c", "\u8eab\u4efd\u8fde\u7eed\u4e2a\u6027\u5316\u8ba9\u7528\u6237\u504f\u597d\u8de8\u4efb\u52a1\u5ef6\u7eed", "Rehearsal Engineering\u652f\u6301\u7528\u6237\u60c5\u5883\u5316\u6f14\u8fdb"], "keywords": ["\u4e2a\u4eba\u667a\u80fd\u4f53", "\u4eba\u673a\u534f\u4f5c", "\u4e2a\u6027\u5316", "\u667a\u80fd\u4f53\u8bc4\u4f30"], "num_comments": 1, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2611.03092v1", "published_at": "2026-11-02", "score": 0.377, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (15\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03092.png", "title": "Avatar Intelligence: Amplifying Human Agency Through Persistent Personal Agents", "tldr": "\u63d0\u51fa\u6301\u7eed\u4e2a\u4eba\u4ee3\u7406\u8303\u5f0f\uff0c\u4ee5\u8de8\u4efb\u52a1\u51b3\u7b56\u59d4\u6258\u589e\u5f3a\u7528\u6237\u81ea\u4e3b\u6027\u5e76\u964d\u4f4e\u76d1\u7763\u8d1f\u62c5\u3002", "upvotes": 15, "what_it_is": "\u63d0\u51fa\u6301\u7eed\u4ee3\u8868\u7528\u6237\u76ee\u6807\u3001\u4ef7\u503c\u4e0e\u7ea6\u675f\u7684\u4e2a\u4eba\u4ee3\u7406\u8303\u5f0f\uff0c\u89c4\u5212\u4ece\u4eba\u5de5\u6307\u6325\u5230\u6388\u6743\u57df\u5185\u81ea\u6cbb\u7684\u6210\u719f\u8def\u5f84\uff0c\u5e76\u7528\u76d1\u7763\u6307\u6570\u8861\u91cf\u6536\u76ca\u3001\u8fd0\u884c\u6210\u672c\u4e0e\u4eba\u5de5\u8d1f\u62c5\u3002", "why_notable": "\u5c06\u4e2a\u4eba\u4ee3\u7406\u7684\u8fdb\u6b65\u6807\u51c6\u4ece\u4efb\u52a1\u5b8c\u6210\u8f6c\u5411\u7528\u6237\u81ea\u4e3b\u6027\uff0c\u5f3a\u8c03\u51cf\u5c11\u65e5\u5e38\u76d1\u7763\u540c\u65f6\u4fdd\u7559\u5173\u952e\u51b3\u7b56\u63a7\u5236\uff0c\u4e3a\u957f\u671f\u59d4\u6258\u63d0\u4f9b\u8bc4\u4f30\u89c6\u89d2\u3002"}, {"abstract": "Real-time long-video generation requires continuous output with consistent appearance and natural motion. Existing chunk-wise autoregressive methods face challenges in both generation efficiency and long-video quality: serialized denoising and history-cache refresh require two forward passes even with one-step denoising, and longer rollouts can degrade quality and cause camera drift. We propose Wave Forcing (WF), which co-designs generation, training, and execution for continuous video output with multi-step denoising. WF uses chunk-wise causal attention to access earlier, cleaner chunks before their denoising is complete, and distributes staggered denoising and cache-refresh stages across full-model replicas to achieve 1F1C: one output chunk per concurrent forward round after pipeline fill. To adapt the model to this continuous generation process, we develop a three-stage training procedure that successively introduces mixed-noise denoising, motion supervision, and causal adaptation using self-generated history. To execute this process efficiently, Wave Runtime (WaveRT) uses Wave Parallelism (WP) for early K/V delivery and communication-computation overlap, together with optimized kernels and pipelined VAE decoding. Experiments on Wan2.1-T2V-1.3B show that 5-step WF maintains overall quality comparable to Rolling Forcing while achieving higher Dynamic Degree on both short and long videos. Our system efficiency experiments show that 4-step WF achieves 147.6 DiT FPS and 134.8 end-to-end FPS on eight H200 GPUs, yielding 7.07x the single-GPU end-to-end throughput. In DiT-only tests with matched SageAttention+W8A8 backends, denoising steps, and GPU counts, WP delivers up to 2.53x the throughput of the faster of the Ulysses and Ring context-parallel baselines across six model scales (1.3B-14B).", "arxiv_id": "2611.00859", "arxiv_url": "https://arxiv.org/abs/2611.00859", "authors": ["Yijie Jin", "Yuxuan Liu", "Jiajun Xu", "Ye Huang", "Chuzhi Wang", "Jiayang Li", "Ruiyang Chen", "Chenling Hong", "Xu Wang", "Zhijie Deng"], "brief": "Wave Forcing\u534f\u540c\u8bbe\u8ba1\u751f\u6210\u3001\u8bad\u7ec3\u4e0e\u6267\u884c\uff1a\u5206\u5757\u56e0\u679c\u6ce8\u610f\u529b\u8bfb\u53d6\u5c1a\u672a\u5b8c\u6210\u53bb\u566a\u7684\u5386\u53f2\uff0c\u591a\u6a21\u578b\u526f\u672c\u9519\u5cf0\u6267\u884c\u53bb\u566a\u4e0e\u7f13\u5b58\u5237\u65b0\uff0c\u5e76\u4ee5\u4e09\u9636\u6bb5\u8bad\u7ec3\u9002\u914d\u8fde\u7eed\u751f\u6210\u3002", "categories": ["cs.CV", "cs.DC"], "github_repo": "https://github.com/SJTU-DENG-Lab/WaveForcing", "github_stars": 96, "hf_url": "https://huggingface.co/papers/2611.00859", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["1F1C\uff1a\u6d41\u6c34\u7ebf\u586b\u6ee1\u540e\uff0c\u6bcf\u8f6e\u5e76\u53d1\u524d\u5411\u8f93\u51fa\u4e00\u5757", "\u4e09\u9636\u6bb5\u8bad\u7ec3\uff1a\u6df7\u5408\u566a\u58f0\u3001\u8fd0\u52a8\u76d1\u7763\u3001\u81ea\u751f\u6210\u5386\u53f2\u9002\u914d", "4\u6b65WF\u57288\u5f20H200\u4e0a\u7aef\u5230\u7aef\u8fbe134.8 FPS"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6d41\u6c34\u7ebf\u5e76\u884c", "\u56e0\u679c\u6ce8\u610f\u529b", "\u6269\u6563\u6a21\u578b"], "num_comments": 3, "on_hf": true, "organization": "DENG Lab @ SJTU", "pdf_url": "https://arxiv.org/pdf/2611.00859v1", "published_at": "2026-10-31", "score": 0.371, "selected_reasons": ["HF trending (110\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00859.png", "title": "Wave Forcing: Towards Speed-of-Light Streaming Video Generation", "tldr": "\u901a\u8fc7\u9519\u5cf0\u53bb\u566a\u4e0e\u8de8\u5361\u6d41\u6c34\u7ebf\uff0c\u5b9e\u73b0\u517c\u987e\u81ea\u7136\u8fd0\u52a8\u548c\u9ad8\u541e\u5410\u7684\u8fde\u7eed\u89c6\u9891\u751f\u6210\u3002", "upvotes": 110, "what_it_is": "Wave Forcing\u534f\u540c\u8bbe\u8ba1\u751f\u6210\u3001\u8bad\u7ec3\u4e0e\u6267\u884c\uff1a\u5206\u5757\u56e0\u679c\u6ce8\u610f\u529b\u8bfb\u53d6\u5c1a\u672a\u5b8c\u6210\u53bb\u566a\u7684\u5386\u53f2\uff0c\u591a\u6a21\u578b\u526f\u672c\u9519\u5cf0\u6267\u884c\u53bb\u566a\u4e0e\u7f13\u5b58\u5237\u65b0\uff0c\u5e76\u4ee5\u4e09\u9636\u6bb5\u8bad\u7ec3\u9002\u914d\u8fde\u7eed\u751f\u6210\u3002", "why_notable": "\u5c06\u591a\u6b65\u53bb\u566a\u8f6c\u4e3a\u6301\u7eed\u8f93\u51fa\u6d41\u6c34\u7ebf\uff0c\u7f13\u89e3\u6548\u7387\u4e0e\u8fd0\u52a8\u8d28\u91cf\u7684\u77db\u76fe\uff1b\u7aef\u5230\u7aef\u541e\u5410\u8fbe\u5355\u5361\u76847.07\u500d\uff0c\u5c55\u793a\u4e86\u591a\u5361\u6269\u5c55\u4ef7\u503c\u3002"}, {"abstract": "Rapid advances in cowork agents are shifting human-AI collaboration toward real-world automation, delivering software, designs, and other artifacts. However, such productivity work demands both high-quality delivery on complex productivity tasks and continued monitoring and decision-making over long horizons, a combination that remains an open challenge. We introduce CoworkOS, a general-purpose harness for long-horizon work that separates task strategy from execution management: the model decides actions, delegation, and acceptance, while the runtime maintains state and feedback. Its three-layer architecture enables direct execution or delegation to Subagents, synchronously or asynchronously, under stable responsibilities. Through a shared application layer, humans and agents inspect and revise the same evolving documents, presentations, CAD models, and Blender scenes, so human-in-the-loop participation can enter both through conversation and through direct modification of the work itself. To sustain continuity across agents and sessions, CoworkOS further introduces hierarchical workspaces and persistent semantic memory, so working files, key decisions, and long-running Job logs remain shareable, reusable, and resumable after interruption. Across 12 benchmarks and 6 categories of real-world applications, CoworkOS proves highly competitive with frontier agent applications such as Codex and DeepSeek Harness. As a sustained-work case study, CoworkOS uses GLM-5.3 as its backbone to conduct RSI-driven automated post-training on Qwen3.6-35B-A3B. Over five rounds, the model\u0027s average score across eight benchmarks rose from 33.19 to 42.95 (+9.76). Looking ahead, we believe CoworkOS opens a meaningful path toward general cowork-agent intelligence.", "arxiv_id": "2611.03178", "arxiv_url": "https://arxiv.org/abs/2611.03178", "authors": ["Jiajie Jin", "Guanting Dong", "Chengjun Pan", "Xin Deng", "Zhuohui Sheng", "Guoqiang Wang", "Tao Gui", "Yutao Zhu", "Yujia Chen", "Shihong Yi", "Binze Hu", "Zhixiong Yang", "Zhichao Sun", "Rui Wang", "Han Han", "Mingyu Ma", "Junhao Huang", "Xiaotao Wang", "Huicheng Jiang", "Yuyang Hu", "Xinyu Yang", "Wanghan Xu", "Yajie Yang", "Zhecan Wang", "Honglin Guo", "Xiaoyu Xing", "Xiaoqian Zhang", "Yulun Zhu", "Xiaoxi Li", "Jiahang Lin", "Shaofan Liu", "Shihan Dou", "Zhiheng Xi", "Qi Zhang", "Yu-Gang Jiang", "See-Kiong Ng", "Yang Zhang", "Tat-Seng Chua", "Ji-Rong Wen", "Zhicheng Dou"], "brief": "CoworkOS\u662f\u9762\u5411\u957f\u5468\u671f\u5de5\u4f5c\u7684\u901a\u7528\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ee5\u4e09\u5c42\u67b6\u6784\u5206\u79bb\u6a21\u578b\u51b3\u7b56\u4e0e\u8fd0\u884c\u65f6\u7ba1\u7406\uff0c\u5e76\u901a\u8fc7\u5171\u4eab\u5e94\u7528\u3001\u5206\u5c42\u5de5\u4f5c\u7a7a\u95f4\u53ca\u6301\u4e45\u8bed\u4e49\u8bb0\u5fc6\u652f\u6301\u534f\u4f5c\u548c\u4e2d\u65ad\u6062\u590d\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/RUC-NLPIR/CoworkOS", "github_stars": 78, "hf_url": "https://huggingface.co/papers/2611.03178", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4e09\u5c42\u67b6\u6784\u652f\u6301\u540c\u6b65\u6216\u5f02\u6b65\u59d4\u6d3eSubagents", "\u572812\u4e2a\u57fa\u51c6\u30016\u7c7b\u771f\u5b9e\u5e94\u7528\u4e2d\u5c55\u73b0\u7ade\u4e89\u529b", "\u81ea\u52a8\u540e\u8bad\u7ec35\u8f6e\uff0c8\u9879\u57fa\u51c6\u5747\u5206\u63d0\u53479.76"], "keywords": ["\u591a\u667a\u80fd\u4f53\u534f\u4f5c", "\u957f\u5468\u671f\u4efb\u52a1", "\u6301\u4e45\u8bb0\u5fc6", "\u81ea\u52a8\u540e\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "Renmin University of China", "pdf_url": "https://arxiv.org/pdf/2611.03178v1", "published_at": "2026-11-02", "score": 0.362, "selected_reasons": ["HF trending (89\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03178.png", "title": "CoworkOS:Scaling Agent Coworkers for Real-world Automation", "tldr": "\u901a\u8fc7\u5206\u79bb\u7b56\u7565\u4e0e\u6267\u884c\u7ba1\u7406\uff0c\u8ba9\u591a\u667a\u80fd\u4f53\u6301\u7eed\u534f\u4f5c\u5e76\u5b8c\u6210\u771f\u5b9e\u751f\u4ea7\u4efb\u52a1\u3002", "upvotes": 89, "what_it_is": "CoworkOS\u662f\u9762\u5411\u957f\u5468\u671f\u5de5\u4f5c\u7684\u901a\u7528\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4ee5\u4e09\u5c42\u67b6\u6784\u5206\u79bb\u6a21\u578b\u51b3\u7b56\u4e0e\u8fd0\u884c\u65f6\u7ba1\u7406\uff0c\u5e76\u901a\u8fc7\u5171\u4eab\u5e94\u7528\u3001\u5206\u5c42\u5de5\u4f5c\u7a7a\u95f4\u53ca\u6301\u4e45\u8bed\u4e49\u8bb0\u5fc6\u652f\u6301\u534f\u4f5c\u548c\u4e2d\u65ad\u6062\u590d\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u628a\u4efb\u52a1\u4ea4\u4ed8\u3001\u957f\u671f\u72b6\u6001\u7ef4\u62a4\u548c\u4eba\u5de5\u76f4\u63a5\u4fee\u6539\u7eb3\u5165\u540c\u4e00\u5de5\u4f5c\u6d41\uff0c\u5e76\u4ee5\u6301\u7eed\u81ea\u52a8\u540e\u8bad\u7ec3\u6848\u4f8b\u5c55\u793a\u957f\u5468\u671f\u6267\u884c\u80fd\u529b\u3002"}, {"abstract": "Despite recent advances in CUAs, their development remains constrained by the limited diversity, controllability, and reliability of interaction data. Moreover, conventional optimization pipelines lack iterative feedback, while existing recursive improvement approaches often rely on self-generated experiences, limiting ability expansion and yielding diminishing returns. To address these challenges, we introduce CUA-Master, a nested double-loop recursive improvement framework. At the system level, an outer world-data-model flywheel continuously incorporates open-world corpus and leverages evolving model weaknesses to guide subsequent data construction and optimization iterations. At the data level, an inner flywheel couples open-world seeding and autocatalytic propagation. The former mines authentic workflows as seed tasks from instructional videos, and employs visual-semantic dual-path trajectory reconstruction; The latter transforms these seeds into reusable primitives for controllable synthesis of diverse, complex, and verifiable tasks. To enable efficient and reliable trajectory collection, we further introduce a feedback-guided snapshot-rollback retry mechanism in various real environments. Extensive experiments demonstrate that CUA-Master-27B achieves competitive performance across GUI-only and GUI-CLI hybrid benchmarks, scoring 80.2 on OSWorld Verified, 36.9 on OSWorld 2.0, 43.9 on WeaveBench, and 25.0 on Agents\u0027 Last Exam. Our framework also substantially improves the quality and efficiency of data synthesis, and exhibits continuous gains across recursive iterations.", "arxiv_id": "2611.03126", "arxiv_url": "https://arxiv.org/abs/2611.03126", "authors": ["Xinlei Yu", "Gen Li", "Ji Zhao", "Zhangquan Chen", "Congcong Wang", "Shuai Dong", "Zelin Peng", "Yuqi Xu", "Hongrui Wu", "Kaiwen Tuo", "Cheng Yang", "Kaituo Feng", "Yifan Wu", "Jiayi Zhang", "Dongming Wu", "Wenqi Shao", "Jiaqi Wang", "Xiangyu Yue"], "brief": "\u63d0\u51fa\u5d4c\u5957\u53cc\u5faa\u73af\u6846\u67b6\uff1a\u5916\u5faa\u73af\u6839\u636e\u6a21\u578b\u5f31\u70b9\u66f4\u65b0\u6570\u636e\u4e0e\u8bad\u7ec3\uff0c\u5185\u5faa\u73af\u4ece\u6559\u5b66\u89c6\u9891\u91cd\u5efa\u64cd\u4f5c\u8f68\u8ff9\uff0c\u518d\u5c06\u79cd\u5b50\u4efb\u52a1\u62c6\u6210\u53ef\u590d\u7528\u539f\u8bed\uff0c\u5408\u6210\u53ef\u9a8c\u8bc1\u7684\u590d\u6742\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/xlyu0106/CUA-Master", "github_stars": 86, "hf_url": "https://huggingface.co/papers/2611.03126", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u89c6\u89c9\u2014\u8bed\u4e49\u53cc\u8def\u5f84\u91cd\u5efa\u6559\u5b66\u89c6\u9891\u4e2d\u7684\u64cd\u4f5c\u8f68\u8ff9", "\u53cd\u9988\u5f15\u5bfc\u7684\u5feb\u7167\u56de\u6eda\u91cd\u8bd5\uff0c\u63d0\u9ad8\u8f68\u8ff9\u91c7\u96c6\u53ef\u9760\u6027", "27B\u6a21\u578b\u5728OSWorld Verified\u5f97\u520680.2"], "keywords": ["\u8ba1\u7b97\u673a\u64cd\u4f5c\u667a\u80fd\u4f53", "\u9012\u5f52\u6539\u8fdb", "\u6570\u636e\u5408\u6210", "\u56fe\u5f62\u754c\u9762"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03126v1", "published_at": "2026-11-02", "score": 0.362, "selected_reasons": ["HF trending (94\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03126.png", "title": "CUA-Master: Scaling Computer-use Agents through Open-World Recursive Improvements", "tldr": "\u901a\u8fc7\u5f00\u653e\u4e16\u754c\u6570\u636e\u4e0e\u53cc\u5faa\u73af\u9012\u5f52\u6539\u8fdb\uff0c\u6301\u7eed\u63d0\u5347\u8ba1\u7b97\u673a\u64cd\u4f5c\u667a\u80fd\u4f53\u80fd\u529b\u3002", "upvotes": 94, "what_it_is": "\u63d0\u51fa\u5d4c\u5957\u53cc\u5faa\u73af\u6846\u67b6\uff1a\u5916\u5faa\u73af\u6839\u636e\u6a21\u578b\u5f31\u70b9\u66f4\u65b0\u6570\u636e\u4e0e\u8bad\u7ec3\uff0c\u5185\u5faa\u73af\u4ece\u6559\u5b66\u89c6\u9891\u91cd\u5efa\u64cd\u4f5c\u8f68\u8ff9\uff0c\u518d\u5c06\u79cd\u5b50\u4efb\u52a1\u62c6\u6210\u53ef\u590d\u7528\u539f\u8bed\uff0c\u5408\u6210\u53ef\u9a8c\u8bc1\u7684\u590d\u6742\u4efb\u52a1\u3002", "why_notable": "\u5c06\u771f\u5b9e\u5de5\u4f5c\u6d41\u5f15\u5165\u9012\u5f52\u6539\u8fdb\uff0c\u51cf\u5c11\u5bf9\u81ea\u751f\u6210\u7ecf\u9a8c\u7684\u4f9d\u8d56\uff1b\u5b9e\u9a8c\u663e\u793a\u591a\u8f6e\u8fed\u4ee3\u6301\u7eed\u83b7\u76ca\uff0c\u5e76\u517c\u987e\u6570\u636e\u5408\u6210\u8d28\u91cf\u4e0e\u6548\u7387\u3002"}, {"abstract": "LLM agents are judged by what they deliver, and in professional work what gets delivered is a project, not a task. A project pays off only if the whole package holds, and one weak part can limit the value of the rest. Yet existing benchmarks mostly test agents on one task at a time, leaving a gap between the capability we measure and the outcome that makes agents useful. To address this gap, we introduce DeliverBench, which tests whether agents can carry a project from brief to final delivery. Its 11 projects, spanning financial due diligence, legal contract drafting, and drug safety reporting, are reconstructed with 13 domain experts from real materials and chain 150 subtasks through 2-15 rounds of new materials and client feedback. Because no reference outputs are injected, agents inherit their own errors from one task to the next. Expert rubrics then score every checkpoint as well as the final package. Across seven model-harness systems, even the best system scores only 65.0 out of 100 on final delivery and passes 50.0% of subtasks at a 90-point threshold. The failures are often failures of carrying work forward: in one audit project, all seven systems addressed the review findings, but only one preserved traceability. Together, these results suggest that task-level capability does not simply compose into delivery, which also depends on keeping the work coherent as it evolves.", "arxiv_id": "2611.03412", "arxiv_url": "https://arxiv.org/abs/2611.03412", "authors": ["Yumou Liu", "Mingju Chen", "Zhoufutu Wen", "Qianyu Yang", "Zijie Wang", "Yeqian Liu", "Chenghao Yang", "Tiliang Duan", "Qiyu Cai", "Yanglihong Xiao", "Jiayun Dong", "Jianlan Ma", "Shenhao Miao", "Yuhan Cao", "Lu Xu", "Que Shen", "Tian Gao", "Ge Zhang", "Jianpeng Jiao", "Xuanhe Zhou", "Fan Wu"], "brief": "DeliverBench\u8ba9\u667a\u80fd\u4f53\u4ece\u9700\u6c42\u7b80\u62a5\u63a8\u8fdb\u5230\u6700\u7ec8\u4ea4\u4ed8\uff0c\u8986\u76d6\u91d1\u878d\u3001\u6cd5\u5f8b\u4e0e\u836f\u7269\u5b89\u5168\u9879\u76ee\u3002\u901a\u8fc7\u591a\u8f6e\u6750\u6599\u4e0e\u5ba2\u6237\u53cd\u9988\u8854\u63a5\u5b50\u4efb\u52a1\uff0c\u5e76\u7531\u4e13\u5bb6\u8bc4\u5206\u68c0\u67e5\u8fc7\u7a0b\u548c\u6210\u679c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03412", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["13\u540d\u9886\u57df\u4e13\u5bb6\u91cd\u5efa11\u4e2a\u9879\u76ee\uff0c\u4e32\u8054150\u4e2a\u5b50\u4efb\u52a1", "\u7ecf\u53862\u81f315\u8f6e\u66f4\u65b0\uff0c\u4e0d\u6ce8\u5165\u53c2\u8003\u7b54\u6848\uff0c\u9519\u8bef\u6301\u7eed\u4f20\u9012", "7\u5957\u7cfb\u7edf\u4e2d\u6700\u4f73\u4ea4\u4ed8\u5f97\u520665\uff0c90\u5206\u95e8\u69db\u901a\u8fc7\u738750%"], "keywords": ["\u667a\u80fd\u4f53", "\u57fa\u51c6\u8bc4\u6d4b", "\u591a\u9636\u6bb5\u4efb\u52a1", "\u4e13\u4e1a\u4ea4\u4ed8"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03412v1", "published_at": "2026-11-02", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "DeliverBench: Benchmarking AI Agents on Delivering Realistic Multi-Stage Professional Projects", "tldr": "\u7528\u771f\u5b9e\u591a\u9636\u6bb5\u9879\u76ee\u8bc4\u6d4b\u667a\u80fd\u4f53\uff0c\u53d1\u73b0\u5355\u4efb\u52a1\u80fd\u529b\u96be\u4ee5\u8f6c\u5316\u4e3a\u5b8c\u6574\u4e13\u4e1a\u4ea4\u4ed8\u3002", "upvotes": 0, "what_it_is": "DeliverBench\u8ba9\u667a\u80fd\u4f53\u4ece\u9700\u6c42\u7b80\u62a5\u63a8\u8fdb\u5230\u6700\u7ec8\u4ea4\u4ed8\uff0c\u8986\u76d6\u91d1\u878d\u3001\u6cd5\u5f8b\u4e0e\u836f\u7269\u5b89\u5168\u9879\u76ee\u3002\u901a\u8fc7\u591a\u8f6e\u6750\u6599\u4e0e\u5ba2\u6237\u53cd\u9988\u8854\u63a5\u5b50\u4efb\u52a1\uff0c\u5e76\u7531\u4e13\u5bb6\u8bc4\u5206\u68c0\u67e5\u8fc7\u7a0b\u548c\u6210\u679c\u3002", "why_notable": "\u5b83\u628a\u8bc4\u6d4b\u91cd\u5fc3\u4ece\u5355\u9898\u6b63\u786e\u7387\u8f6c\u5411\u6574\u5957\u6210\u679c\u7684\u8fde\u8d2f\u6027\u4e0e\u53ef\u8ffd\u6eaf\u6027\uff0c\u63ed\u793a\u667a\u80fd\u4f53\u5728\u6301\u7eed\u63a8\u8fdb\u4e13\u4e1a\u5de5\u4f5c\u65f6\u7684\u80fd\u529b\u7f3a\u53e3\u3002"}, {"abstract": "Computer-use agents for scientific software require application-specific expertise. Much of this expertise is documented in human-authored software manuals and web pages. However, turning these resources into executable, reusable skills remains challenging due to mismatches between documented and deployed software versions and differences in scope between documentation coverage and task requirements. We introduce ScienceCUA, a two-stage framework combining resource-to-skill construction with execution-guided skill evolution. First, ScienceCUA identifies tasks supported by the software from its documentation, infers operational trajectories, and generalizes them into reusable Skills. Command catalogs, syntax constraints, and shortcuts are organized separately as References for on-demand lookup. Then, ScienceCUA uses execution feedback to drive skill self-evolution by contrasting successful and failed trajectories for the same task, identifying deficiencies, revising existing skills or adding new ones, and updating the skill library only after repeated validation in real environments. To enable reliable evaluation without benchmark noise or task leakage, we introduce two improved benchmarks. ScienceBoard-Verified provides an audited and corrected basis for measuring task performance, while ScienceBoard-VE separates skill evolution from final testing through disjoint evolution and test tasks and further supports native-agent evaluation. Experiments show that the initial Skills and References improve average task success rate by up to 7.23 percentage points over the base model, while skill self-evolution increases the total gain over the baseline to as much as 17.12 percentage points. ScienceCUA turns software documentation into an evolving set of executable skills and queryable references, offering a practical way for general-purpose agents to use scientific software reliably and at scale.", "arxiv_id": "2611.03238", "arxiv_url": "https://arxiv.org/abs/2611.03238", "authors": ["Daiqiang Li", "Jingyi Peng", "Rui Hu", "Jia Li", "Xuyang Liu", "Guanren Qiao", "Yujia Xiang", "Qiuzhuang Sun", "Zhiping Xu", "Mingrui Luo"], "brief": "ScienceCUA\u4ece\u8f6f\u4ef6\u6587\u6863\u63a8\u5bfc\u64cd\u4f5c\u8f68\u8ff9\uff0c\u6784\u5efa\u53ef\u590d\u7528\u6280\u80fd\u4e0e\u72ec\u7acb\u53c2\u8003\u5e93\uff1b\u518d\u5bf9\u6bd4\u540c\u4efb\u52a1\u7684\u6210\u529f\u548c\u5931\u8d25\u8f68\u8ff9\u4fee\u8ba2\u6280\u80fd\uff0c\u7ecf\u771f\u5b9e\u73af\u5883\u53cd\u590d\u9a8c\u
