table": "\u7ed3\u679c\u8868\u660e\uff0c\u5019\u9009\u8bcd\u6392\u5e8f\u53ef\u6bd4\u6982\u7387\u503c\u66f4\u6709\u6548\u5730\u4f20\u9012\u6559\u5e08\u77e5\u8bc6\uff1b\u5176\u4ed6\u6392\u5e8f\u635f\u5931\u4e5f\u6709\u7c7b\u4f3c\u6536\u76ca\uff0c\u4e3a\u84b8\u998f\u63d0\u4f9b\u4e86\u514d\u6e29\u5ea6\u8c03\u53c2\u7684\u8def\u5f84\u3002"}, {"abstract": "Prediction errors from video world models are often treated as physical surprise, but they can also reflect appearance, static content, motion, or ordinary prediction difficulty. We present an evaluation framework that separates what frozen representations contain, how they organize appearance and physical differences, and what changes a model\u0027s own prediction error. On IntPhys2, a benchmark of physically possible and impossible events, we compare representations from latent prediction, masked pixel reconstruction, and simple visual statistics. Appearance remains easy to decode, while V-JEPA2 exposes modest information about whether events are possible or impossible. Looking at the latent geometry, appearance changes become smaller compared with differences between videos, their directions line up more consistently across scenes, and their overlap with physical changes decreases in deeper layers. Across action-conditioned models, incorrect actions raise prediction error, while appearance changes also produce substantial responses. In Physion++ video clips, repeating a single frame can produce higher error than the original clip, while changing color throughout the clip can lower it. Using Kubric, a simulation and rendering framework, we find that impossible events can produce lower error than possible events. A fixed error threshold also incorrectly flags many possible events as impossible. A model can therefore represent physical information and respond to incorrect actions without its native prediction error reliably measuring physical surprise.", "arxiv_id": "2611.01815", "arxiv_url": "https://arxiv.org/abs/2611.01815", "authors": ["Anton Hristov", "Aleksandar Slavov", "Vasil Vasilev"], "brief": "\u63d0\u51fa\u8bc4\u4f30\u6846\u67b6\uff0c\u5206\u522b\u68c0\u9a8c\u51bb\u7ed3\u8868\u5f81\u7684\u4fe1\u606f\u3001\u6f5c\u7a7a\u95f4\u51e0\u4f55\u4e0e\u9884\u6d4b\u8bef\u5dee\u54cd\u5e94\u3002\u901a\u8fc7\u7269\u7406\u4e8b\u4ef6\u57fa\u51c6\u548c\u5916\u89c2\u3001\u52a8\u4f5c\u5e72\u9884\uff0c\u533a\u5206\u7269\u7406\u5f02\u5e38\u4e0e\u666e\u901a\u9884\u6d4b\u56f0\u96be\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/3-ml/jepa-surprise", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01815", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["IntPhys2\u4e0a\uff0cV-JEPA2\u4ec5\u66b4\u9732\u6709\u9650\u7684\u7269\u7406\u53ef\u884c\u6027\u4fe1\u606f", "\u6df1\u5c42\u8868\u5f81\u4e2d\uff0c\u5916\u89c2\u53d8\u5316\u4e0e\u7269\u7406\u53d8\u5316\u7684\u65b9\u5411\u91cd\u53e0\u51cf\u5c11", "Kubric\u4e2d\uff0c\u4e0d\u53ef\u80fd\u4e8b\u4ef6\u7684\u9884\u6d4b\u8bef\u5dee\u53ef\u4f4e\u4e8e\u53ef\u80fd\u4e8b\u4ef6"], "keywords": ["\u89c6\u9891\u4e16\u754c\u6a21\u578b", "\u7269\u7406\u7406\u89e3", "\u8868\u5f81\u5206\u6790", "\u5f02\u5e38\u68c0\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01815v1", "published_at": "2026-11-01", "score": 0.259, "selected_reasons": ["HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01815.png", "title": "When Does Latent Prediction Error Support Physical Surprise Claims in Video World Models?", "tldr": "\u89c6\u9891\u4e16\u754c\u6a21\u578b\u867d\u80fd\u7f16\u7801\u7269\u7406\u4fe1\u606f\uff0c\u5176\u9884\u6d4b\u8bef\u5dee\u5374\u672a\u5fc5\u53ef\u9760\u8861\u91cf\u7269\u7406\u5f02\u5e38\u3002", "upvotes": 20, "what_it_is": "\u63d0\u51fa\u8bc4\u4f30\u6846\u67b6\uff0c\u5206\u522b\u68c0\u9a8c\u51bb\u7ed3\u8868\u5f81\u7684\u4fe1\u606f\u3001\u6f5c\u7a7a\u95f4\u51e0\u4f55\u4e0e\u9884\u6d4b\u8bef\u5dee\u54cd\u5e94\u3002\u901a\u8fc7\u7269\u7406\u4e8b\u4ef6\u57fa\u51c6\u548c\u5916\u89c2\u3001\u52a8\u4f5c\u5e72\u9884\uff0c\u533a\u5206\u7269\u7406\u5f02\u5e38\u4e0e\u666e\u901a\u9884\u6d4b\u56f0\u96be\u3002", "why_notable": "\u63ed\u793a\u7269\u7406\u4fe1\u606f\u53ef\u89e3\u7801\u4e0e\u8bef\u5dee\u53ef\u68c0\u6d4b\u5f02\u5e38\u5e76\u4e0d\u7b49\u4ef7\uff0c\u4e3a\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u7269\u7406\u7406\u89e3\u8bc4\u4f30\u63d0\u4f9b\u66f4\u4e25\u8c28\u7684\u8bca\u65ad\u8def\u5f84\u3002"}, {"abstract": "Unlike autoregressive (AR) models, diffusion language models (DLMs) permit parallel token updates, flexible generation, and bidirectional attention, but leading systems rely on costly pretraining or full-model fine-tuning. We present Build Your Own DLM (BYOD), a generalizable LoRA-only recipe for parameter-efficient AR-to-DLM conversion. Without architecture-specific tuning, BYOD induces diffusion generation in Gemma 2 9B, Llama 3.1 8B, Qwen2.5 7B, and Ministral 8B; to our knowledge, this is the first reported AR-to-DLM conversion of a Mistral model. The adapters comprise 4.1-5.8% of final parameters while every base-model parameter remains frozen; each 25,000-iteration conversion needs at most 102.4M tokens, processed in 3.1-4.0 hours on one Google Colab GPU. All four models generate from fully masked sequences, use bidirectional context in a controlled attention test, and retain substantial parent-model knowledge. BYOD-Gemma is the strongest BYOD conversion on our nine-task evaluation, reaching 50.6% average accuracy compared with 51.9% for LLaDA 8B Instruct in the same harness. Open-generation quality at low network function evaluation (NFE) budgets remains the principal limitation: BYOD perplexity is 8.3-11.1 versus 4.1 for LLaDA and 2.2-3.0 for the AR parents when generating 128 tokens in 64 steps. To enable further experimentation and inspection, we provide a standalone training and evaluation implementation and interactive demos for all four conversions. BYOD thus provides a practical route for extending diffusion generation to other existing model families while identifying the gap that efficient conversion must next close.", "arxiv_id": "2610.41574", "arxiv_url": "https://arxiv.org/abs/2610.41574", "authors": ["Ruurd J. A. Kuiper", "Robert A. Bagheri"], "brief": "BYOD\u4ee5LoRA\u9002\u914d\u5668\u5c06\u73b0\u6709\u81ea\u56de\u5f52\u8bed\u8a00\u6a21\u578b\u8f6c\u4e3a\u6269\u6563\u6a21\u578b\uff0c\u51bb\u7ed3\u5168\u90e8\u57fa\u7840\u53c2\u6570\u3002\u65e0\u9700\u67b6\u6784\u4e13\u5c5e\u8c03\u4f18\uff0c\u5373\u53ef\u652f\u6301\u4ece\u5168\u63a9\u7801\u5e8f\u5217\u751f\u6210\u5e76\u5229\u7528\u53cc\u5411\u4e0a\u4e0b\u6587\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/RuurdKuiper/BYOD", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2610.41574", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d6Gemma\u3001Llama\u3001Qwen\u548cMinistral\u56db\u7c7b\u6a21\u578b", "LoRA\u5360\u53c2\u65704.1%\u20135.8%\uff0c\u5355\u5361\u8bad\u7ec33.1\u20134\u5c0f\u65f6", "\u4e5d\u4efb\u52a1\u5747\u520650.6%\uff1b64\u6b65\u751f\u6210\u56f0\u60d1\u5ea68.3\u201311.1"], "keywords": ["\u6269\u6563\u8bed\u8a00\u6a21\u578b", "\u53c2\u6570\u9ad8\u6548\u5fae\u8c03", "\u81ea\u56de\u5f52\u6a21\u578b", "LoRA"], "num_comments": 5, "on_hf": true, "organization": "University Medical Center Utrecht", "pdf_url": "https://arxiv.org/pdf/2610.41574v1", "published_at": "2026-10-30", "score": 0.256, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41574.png", "title": "BYOD: Build Your Own DLM - Efficient Autoregressive-to-Diffusion Language Model Conversion", "tldr": "\u4ec5\u8bad\u7ec3\u5c11\u91cf\u9002\u914d\u5668\u5373\u53ef\u5c06\u591a\u7c7b\u81ea\u56de\u5f52\u6a21\u578b\u8f6c\u4e3a\u6269\u6563\u6a21\u578b\uff0c\u4f46\u751f\u6210\u8d28\u91cf\u4ecd\u6709\u5dee\u8ddd\u3002", "upvotes": 9, "what_it_is": "BYOD\u4ee5LoRA\u9002\u914d\u5668\u5c06\u73b0\u6709\u81ea\u56de\u5f52\u8bed\u8a00\u6a21\u578b\u8f6c\u4e3a\u6269\u6563\u6a21\u578b\uff0c\u51bb\u7ed3\u5168\u90e8\u57fa\u7840\u53c2\u6570\u3002\u65e0\u9700\u67b6\u6784\u4e13\u5c5e\u8c03\u4f18\uff0c\u5373\u53ef\u652f\u6301\u4ece\u5168\u63a9\u7801\u5e8f\u5217\u751f\u6210\u5e76\u5229\u7528\u53cc\u5411\u4e0a\u4e0b\u6587\u3002", "why_notable": "\u663e\u8457\u964d\u4f4e\u6269\u6563\u8bed\u8a00\u6a21\u578b\u7684\u6539\u9020\u95e8\u69db\uff0c\u8ba9\u5df2\u6709\u6a21\u578b\u65e0\u9700\u5168\u91cf\u5fae\u8c03\u5373\u53ef\u5c1d\u8bd5\u6269\u6563\u751f\u6210\uff1b\u540c\u65f6\u63ed\u793a\u4f4e\u6b65\u6570\u5f00\u653e\u751f\u6210\u8d28\u91cf\u4ecd\u662f\u4e3b\u8981\u74f6\u9888\u3002"}, {"abstract": "Linear attention scales linearly with sequence length, but its finite-state memory can limit long-context retrieval. In gated linear recurrences, memory retention depends on state decay, which is shaped jointly by gate parameters A_log and dt_bias and by input activations. In controlled Gated DeltaNet (GDN) experiments, both parameters remain highly correlated with their initial values after training, highlighting the importance of initialization. Therefore, we introduce Dual-Axis Memory Initialization (DAMI), which jointly configures these parameters before training. DAMI assigns geometric timescales across heads for varied retrieval distances and a low-high-low input-sensitivity profile across layers. A small activation sample calibrates the GDN-family implementation to match both behavioral targets without adding trainable parameters. Across GDN, KDA, GDN2, Mamba-2, and RWKV-7, DAMI improves average RULER-style retrieval accuracy by 5.29 to 16.71 percentage points over the corresponding random-initialization baselines. Performance on language modeling, commonsense reasoning, and 2K real-world retrieval remains broadly comparable to those baselines. Our code is available at https://speedai.com/research/dami.", "arxiv_id": "2610.41994", "arxiv_url": "https://arxiv.org/abs/2610.41994", "authors": ["Zhangchi Feng", "Harry Jiang", "Yangyifei Luo", "Ray Zhang", "Richong Zhang"], "brief": "DAMI\u8054\u5408\u521d\u59cb\u5316\u95e8\u63a7\u53c2\u6570\uff0c\u914d\u7f6e\u4e0d\u540c\u6ce8\u610f\u529b\u5934\u7684\u8bb0\u5fc6\u65f6\u957f\u53ca\u5404\u5c42\u8f93\u5165\u654f\u611f\u5ea6\u3002\u4e94\u7c7b\u6a21\u578b\u7684\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u51c6\u786e\u7387\u5e73\u5747\u63d0\u53475.29\u81f316.71\u4e2a\u767e\u5206\u70b9\uff0c\u5176\u4ed6\u4efb\u52a1\u8868\u73b0\u57fa\u672c\u6301\u5e73\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/SpeedAI-Lab/DAMI", "github_stars": 9, "hf_url": "https://huggingface.co/papers/2610.41994", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7ebf\u6027\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22", "\u53c2\u6570\u521d\u59cb\u5316", "\u8bb0\u5fc6\u673a\u5236"], "num_comments": 1, "on_hf": true, "organization": "SpeedAI", "pdf_url": "https://arxiv.org/pdf/2610.41994v1", "published_at": "2026-10-30", "score": 0.066, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41994.png", "title": "DAMI: Dual-Axis Memory Initialization for Enhanced Long-Context Retrieval in Gated Linear Attention", "tldr": "DAMI\u8054\u5408\u521d\u59cb\u5316\u95e8\u63a7\u53c2\u6570\uff0c\u914d\u7f6e\u4e0d\u540c\u6ce8\u610f\u529b\u5934\u7684\u8bb0\u5fc6\u65f6\u957f\u53ca\u5404\u5c42\u8f93\u5165\u654f\u611f\u5ea6\u3002\u4e94\u7c7b\u6a21\u578b\u7684\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u51c6\u786e\u7387\u5e73\u5747\u63d0\u53475.29\u81f316.71\u4e2a\u767e\u5206\u70b9\uff0c\u5176\u4ed6\u4efb\u52a1\u8868\u73b0\u57fa\u672c\u6301\u5e73\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Jev enables efficient decision-making with large language models (LLMs) through typed querying primitives, allowing the same semantic state to be expressed in different formats, such as binary and multiple-choice queries. However, the consistency of decisions across primitives has not been systematically evaluated. This work introduces PrimaCons, a four-axis benchmark for assessing cross-primitive consistency while preserving the semantics of the query. Evaluations across three Jev sizes reveal consistency violations across all four axes. Our analysis shows that these violations follow systematic patterns and that cross-primitive discrepancies predict decision failure with a ROC-AUC of 0.91. To mitigate these inconsistencies, we propose the Cross-Primitive Residual Calibrator (CPRC), which attaches a lightweight residual network to a frozen backbone and jointly optimizes predictive accuracy and cross-primitive consistency. Under a leave-one-domain-out protocol, CPRC reduces cross-primitive inconsistency by 58.57% and improves accuracy by +2.97%., demonstrating its effectiveness in both in-domain and out-of-domain settings. Our findings establish cross-primitive consistency as a key dimension for evaluating Jev and provide a practical approach to improving the reliability of its decisions. Code and benchmark is available at https://github.com/67L1/PrimaCons-CRPR.", "arxiv_id": "2610.38623", "arxiv_url": "https://arxiv.org/abs/2610.38623", "authors": ["Xu Liu", "Guikun Chen", "Kanzhi Wu", "Wenguan Wang"], "brief": "\u63d0\u51fa\u56db\u7ef4\u57fa\u51c6\u8bc4\u4f30 Jev \u5728\u4e0d\u540c\u67e5\u8be2\u5f62\u5f0f\u4e0b\u7684\u51b3\u7b56\u4e00\u81f4\u6027\uff0c\u53d1\u73b0\u5dee\u5f02\u53ef\u9884\u6d4b\u51b3\u7b56\u5931\u8d25\uff1b\u8f7b\u91cf\u6b8b\u5dee\u6821\u51c6\u5668\u4f7f\u4e0d\u4e00\u81f4\u6027\u964d\u4f4e58.57%\uff0c\u51c6\u786e\u7387\u63d0\u53472.97%\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/67L1/PrimaCons-CRPR", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38623", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u51b3\u7b56\u4e00\u81f4\u6027", "\u6a21\u578b\u6821\u51c6", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.38623v1", "published_at": "2026-10-28", "score": 0.061, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.38623.png", "title": "Cross-Primitive Consistency in Jev", "tldr": "\u63d0\u51fa\u56db\u7ef4\u57fa\u51c6\u8bc4\u4f30 Jev \u5728\u4e0d\u540c\u67e5\u8be2\u5f62\u5f0f\u4e0b\u7684\u51b3\u7b56\u4e00\u81f4\u6027\uff0c\u53d1\u73b0\u5dee\u5f02\u53ef\u9884\u6d4b\u51b3\u7b56\u5931\u8d25\uff1b\u8f7b\u91cf\u6b8b\u5dee\u6821\u51c6\u5668\u4f7f\u4e0d\u4e00\u81f4\u6027\u964d\u4f4e58.57%\uff0c\u51c6\u786e\u7387\u63d0\u53472.97%\u3002", "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "On-Policy Self-Distillation (OPSD), which aligns a student model\u0027s token-level distribution with that of its self-teacher prompted by privileged context, has emerged as a promising direction to mitigate reward sparsity in sequence-level post-training paradigms. However, OPSD often fails to achieve continuous performance gains during training. In this paper, we find that the model\u0027s limited self-teaching capability underlies this phenomenon by generating unreliable guidance on certain samples. To address this problem, we propose Teacher-Evolution Self-Distillation (TESD), which enables the self-teacher to generate rollouts and receive environmental feedback based on task correctness and context independence. First, using these rewards as training objectives, we perform teacher-oriented optimization to continuously enhance the model\u0027s self-teaching capability during distillation. Second, by estimating teacher guidance reliability from these rewards, we apply adaptive student-oriented optimization to down-weight samples with unreliable guidance. Extensive experiments across multiple datasets and model scales show that TESD consistently outperforms representative token-level and sequence-level methods, highlighting the necessity of improving supervision quality in OPSD.", "arxiv_id": "2610.38637", "arxiv_url": "https://arxiv.org/abs/2610.38637", "authors": ["Shufan Shen", "Zhongni Hou", "Chao Bi", "Yufei Zhang", "Guojun Yin", "Shuhui Wang"], "brief": "\u63d0\u51fa\u6559\u5e08\u6f14\u5316\u81ea\u84b8\u998f\uff0c\u5229\u7528\u4efb\u52a1\u6b63\u786e\u6027\u548c\u4e0a\u4e0b\u6587\u72ec\u7acb\u6027\u53cd\u9988\u4f18\u5316\u81ea\u6559\u5e08\uff0c\u5e76\u964d\u4f4e\u4e0d\u53ef\u9760\u6307\u5bfc\u7684\u6743\u91cd\uff1b\u591a\u6570\u636e\u96c6\u548c\u6a21\u578b\u89c4\u6a21\u5b9e\u9a8c\u4e2d\u6301\u7eed\u4f18\u4e8e\u4ee3\u8868\u6027\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.38637", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u81ea\u84b8\u998f", "\u6559\u5e08\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u6a21\u578b\u540e\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "ucas", "pdf_url": "https://arxiv.org/pdf/2610.38637v1", "published_at": "2026-10-28", "score": 0.058, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.38637.png", "title": "On-Policy Self-Distillation with Teacher Evolution", "tldr": "\u63d0\u51fa\u6559\u5e08\u6f14\u5316\u81ea\u84b8\u998f\uff0c\u5229\u7528\u4efb\u52a1\u6b63\u786e\u6027\u548c\u4e0a\u4e0b\u6587\u72ec\u7acb\u6027\u53cd\u9988\u4f18\u5316\u81ea\u6559\u5e08\uff0c\u5e76\u964d\u4f4e\u4e0d\u53ef\u9760\u6307\u5bfc\u7684\u6743\u91cd\uff1b\u591a\u6570\u636e\u96c6\u548c\u6a21\u578b\u89c4\u6a21\u5b9e\u9a8c\u4e2d\u6301\u7eed\u4f18\u4e8e\u4ee3\u8868\u6027\u65b9\u6cd5\u3002", "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Existing multi-agent collaboration (MAC) methods have primarily explored a group thinking collaboration topology, where agents independently generate solutions and aggregate their outputs. In this work, we investigate an alternative relay thinking topology, where reasoning ownership is dynamically transferred across agents, allowing subsequent agents to inherit and refine an evolving reasoning trajectory. We introduce Multi-Agent Confidence-guided Relay (MACR), a framework that enables dynamical relay collaboration among agents. The key challenge is determining when reasoning should be relayed and which agent should continue the process. method addresses this challenge through confidence-guided relay triggering and a bidding mechanism that selects the next agent based on its confidence. Experiments on four benchmarks show that method outperforms the strongest single-model strategies in accuracy, e.g., +3.3% on MathVista and +3.9% on MMStar, and remains on par with multi-agent strategies while consuming 6.0x less token overhead on HallusionBench and MMStar. Further analysis demonstrates that relay collaboration enables heterogeneous agents to progressively integrate complementary insights, combining heterogeneous capabilities across reasoning stages. Our source code is available at https://github.com/67L1/MACR.", "arxiv_id": "2610.35219", "arxiv_url": "https://arxiv.org/abs/2610.35219", "authors": ["Xu Liu", "Jungang Qiao", "Guikun Chen", "Xiaojuan Qi", "Wenguan Wang"], "brief": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u63a5\u529b\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u7f6e\u4fe1\u5ea6\u89e6\u53d1\u4ea4\u63a5\u5e76\u7ade\u4ef7\u9009\u62e9\u540e\u7ee7\u667a\u80fd\u4f53\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u51c6\u786e\u7387\u4f18\u4e8e\u6700\u5f3a\u5355\u6a21\u578b\uff0c\u8fbe\u5230\u591a\u667a\u80fd\u4f53\u7b56\u7565\u76f8\u5f53\u7684\u6027\u80fd\uff0c\u4e14\u90e8\u5206\u57fa\u51c6\u7684\u989d\u5916\u4ee4\u724c\u5f00\u9500\u964d\u4f4e6\u500d\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/67L1/MACR", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.35219", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u667a\u80fd\u4f53\u534f\u4f5c", "\u63a5\u529b\u63a8\u7406", "\u7f6e\u4fe1\u5ea6", "\u89c6\u89c9\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.35219v2", "published_at": "2026-10-26", "score": 0.058, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.35219.png", "title": "Multi-Agent Relay Thinking", "tldr": "\u63d0\u51fa\u591a\u667a\u80fd\u4f53\u63a5\u529b\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u7f6e\u4fe1\u5ea6\u89e6\u53d1\u4ea4\u63a5\u5e76\u7ade\u4ef7\u9009\u62e9\u540e\u7ee7\u667a\u80fd\u4f53\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u51c6\u786e\u7387\u4f18\u4e8e\u6700\u5f3a\u5355\u6a21\u578b\uff0c\u8fbe\u5230\u591a\u667a\u80fd\u4f53\u7b56\u7565\u76f8\u5f53\u7684\u6027\u80fd\uff0c\u4e14\u90e8\u5206\u57fa\u51c6\u7684\u989d\u5916\u4ee4\u724c\u5f00\u9500\u964d\u4f4e6\u500d\u3002", "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Answer-level rewards cannot distinguish reasoning traces with equally correct outcomes. We study whether auxiliary trajectory preferences improve small-language-model self-improvement and transfer under limited supervision. We compare confidence-based (SC) and entropy-based metrics (UID-Conj.), which combines global entropy variation and local smoothness, through online reward augmentation and offline training on correct responses. Online experiments adapt Qwen3-1.7B on 30 AIME problems without reference answers; offline experiments use historical AIME problems. UID-Conj. improves the online macro-average across the adaptation benchmark and three transfer benchmarks by 2.08 percentage points over unmodified TTRL. The strongest evidence comes from offline weighted SFT: UID-Conj. exceeds uniform weighting on the same response pool by 1.93 points, with a paired prompt-bootstrap 95\\% CI of [0.44, 3.44]. Benefits are task-dependent: SC rewards judged trace quality and instruction following, while UID-Conj. rewards yield stronger training outcomes in several settings. We find that auxiliary preferences can expose learning value among equally correct traces not captured during inference time, motivating their evaluation through downstream gains.", "arxiv_id": "2610.41296", "arxiv_url": "https://arxiv.org/abs/2610.41296", "authors": ["Minju Gwak", "Alan Ritter"], "brief": "\u7814\u7a76\u7528\u7f6e\u4fe1\u5ea6\u548c\u71b5\u6307\u6807\u533a\u5206\u540c\u6837\u6b63\u786e\u7684\u63a8\u7406\u8f68\u8ff9\uff0c\u8f85\u52a9\u5c0f\u6a21\u578b\u81ea\u6211\u6539\u8fdb\u3002\u71b5\u6307\u6807\u4f7f\u5728\u7ebf\u5e73\u5747\u6210\u7ee9\u63d0\u53472.08\u4e2a\u767e\u5206\u70b9\uff0c\u79bb\u7ebf\u52a0\u6743\u8bad\u7ec3\u63d0\u53471.93\u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u6536\u76ca\u4f9d\u8d56\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2610.41296", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u81ea\u6211\u6539\u8fdb", "\u63a8\u7406\u8f68\u8ff9", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Georgia Institute of Technology", "pdf_url": "https://arxiv.org/pdf/2610.41296v1", "published_at": "2026-10-30", "score": 0.058, "selected_reasons": ["HF trending (6\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.41296.png", "title": "Self-Improvement with Auxiliary Rewards: Learning from Verified Traces and Evaluating Transfer", "tldr": "\u7814\u7a76\u7528\u7f6e\u4fe1\u5ea6\u548c\u71b5\u6307\u6807\u533a\u5206\u540c\u6837\u6b63\u786e\u7684\u63a8\u7406\u8f68\u8ff9\uff0c\u8f85\u52a9\u5c0f\u6a21\u578b\u81ea\u6211\u6539\u8fdb\u3002\u71b5\u6307\u6807\u4f7f\u5728\u7ebf\u5e73\u5747\u6210\u7ee9\u63d0\u53472.08\u4e2a\u767e\u5206\u70b9\uff0c\u79bb\u7ebf\u52a0\u6743\u8bad\u7ec3\u63d0\u53471.93\u4e2a\u767e\u5206\u70b9\uff0c\u4f46\u6536\u76ca\u4f9d\u8d56\u4efb\u52a1\u3002", "upvotes": 6, "what_it_is": null, "why_notable": null}, {"abstract": "Low-rank SVD-based compression offers a powerful strategy to reduce the computational costs of LLMs. However, existing methods face two key limitations: (i) global rank allocation, where uncalibrated error proxies fail to capture complex error propagation, and (ii) decomposition quality, where Fisher-based estimators suffer from severe rank collapse. In this work, we address these limitations by introducing Layer-wise Error Modeling Search (LEMS) and KFAC-SVD. LEMS advances rank allocation by introducing a layer-wise error surrogate that integrates local and global layer importance alongside a propagation bias, enabling effective global rank allocation via an ILP formulation. KFAC-SVD improves decomposition quality by utilizing token-wise statistics, mitigating the rank deficiency observed in prior Fisher-based SVD approaches. Across Mistral, Qwen3, and Llama 3 model families, we show that LEMS consistently outperforms existing search strategies, delivering significant zero-shot accuracy gains of up to 4.7 p.p. that generalize to model sizes of 70B parameters, while KFAC-SVD achieves an average perplexity improvement of 19%. Project page and code: https://lems-svd.github.io", "arxiv_id": "2610.32878", "arxiv_url": "https://arxiv.org/abs/2610.32878", "authors": ["Moritz Thoma", "Maximilian Groezinger", "Maximilian Forstenh\u00e4usler", "Emad Aghajanzadeh", "Manoj Rohit Vemparala", "Christos Anagnostopoulos", "Pierpaolo Mori", "Nael Fasfous", "Alexander Frickenstein", "Daniel Mueller-Gritschneder", "Ulf Schlichtmann"], "brief": "\u63d0\u51fa\u9010\u5c42\u8bef\u5dee\u5efa\u6a21\u641c\u7d22\u4e0eKFAC-SVD\uff0c\u4f18\u5316\u5927\u8bed\u8a00\u6a21\u578b\u538b\u7f29\u7684\u79e9\u5206\u914d\u548c\u5206\u89e3\u8d28\u91cf\uff1b\u96f6\u6837\u672c\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u53474.7\u4e2a\u767e\u5206\u70b9\uff0c\u56f0\u60d1\u5ea6\u5e73\u5747\u964d\u4f4e19%\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/lems-svd/lems", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2610.32878", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b\u538b\u7f29", "\u4f4e\u79e9\u5206\u89e3", "\u8bef\u5dee\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "Technical University of Munich", "pdf_url": "https://arxiv.org/pdf/2610.32878v2", "published_at": "2026-10-23", "score": 0.057, "selected_reasons": ["HF trending (3\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.32878.png", "title": "Advancing SVD-based LLM Compression via Layer-Wise Error Model Search", "tldr": "\u63d0\u51fa\u9010\u5c42\u8bef\u5dee\u5efa\u6a21\u641c\u7d22\u4e0eKFAC-SVD\uff0c\u4f18\u5316\u5927\u8bed\u8a00\u6a21\u578b\u538b\u7f29\u7684\u79e9\u5206\u914d\u548c\u5206\u89e3\u8d28\u91cf\uff1b\u96f6\u6837\u672c\u51c6\u786e\u7387\u6700\u9ad8\u63d0\u53474.7\u4e2a\u767e\u5206\u70b9\uff0c\u56f0\u60d1\u5ea6\u5e73\u5747\u964d\u4f4e19%\u3002", "upvotes": 3, "what_it_is": null, "why_notable": null}, {"abstract": "Recently, harness self-evolution has emerged as an important paradigm for improving agent performance. Prior studies show that evolving the agent harness can effectively enhance agent capabilities without modifying the foundation model\u0027s parameters. We find that existing approaches largely study agent evolution on a single task. In practice, coding agents may need to handle multiple task types over time. Whether an agent harness can continuously evolve across multiple tasks without suffering from catastrophic forgetting remains an important open question. In this paper, we investigate this open question through a comprehensive empirical study of continual harness self-evolution. We organize three software engineering task datasets into six different evolution directions and apply two representative harness evolution methods to perform continual evolution along these directions. Our experimental results show that evolution on a subsequent dataset can substantially undermine the performance on previously seen datasets. For example, with DeepSeek-V4-Flash-0731, Meta-Harness improves its performance on SWE-Bench to 94.0% after evolution. However, after further evolution on FeatureBench, its performance on SWE-Bench drops to 32.0% by the fifth round, corresponding to a 66% relative decrease. Finally, based on our experimental findings, we identify several insights, providing directions for the continual self-evolution of agent harnesses. Code is available at https://github.com/THU-Agent/continual-harness-evolution.", "arxiv_id": "2611.03219", "arxiv_url": "https://arxiv.org/abs/2611.03219", "authors": ["Shangziqi Zhao", "Yitong Zhang", "Jia Li"], "brief": "\u901a\u8fc7\u4e09\u7c7b\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u548c\u4e24\u79cd\u65b9\u6cd5\u7814\u7a76\u7f16\u7801\u667a\u80fd\u4f53\u7684\u6301\u7eed\u6f14\u5316\uff0c\u53d1\u73b0\u540e\u7eed\u4efb\u52a1\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u4e25\u91cd\u9057\u5fd8\uff1aSWE-Bench\u8868\u73b0\u4ece94%\u964d\u81f332%\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": "https://github.com/THU-Agent/continual-harness-evolution", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2611.03219", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u6301\u7eed\u6f14\u5316", "\u707e\u96be\u6027\u9057\u5fd8", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03219v1", "published_at": "2026-11-02", "score": 0.057, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03219.png", "title": "Can Coding Agents Sustain Continual Evolution without Forgetting?", "tldr": "\u901a\u8fc7\u4e09\u7c7b\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u548c\u4e24\u79cd\u65b9\u6cd5\u7814\u7a76\u7f16\u7801\u667a\u80fd\u4f53\u7684\u6301\u7eed\u6f14\u5316\uff0c\u53d1\u73b0\u540e\u7eed\u4efb\u52a1\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u4e25\u91cd\u9057\u5fd8\uff1aSWE-Bench\u8868\u73b0\u4ece94%\u964d\u81f332%\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "AI-generated videos often depict people within detailed scenes while leaving their small facial regions poorly resolved. Visual super-resolution can sharpen these regions without resolving whether the recovered lips and teeth agree with the spoken audio. We present an audio-guided facial video restoration framework that addresses this ambiguity within a reference-guided video flow model. Source--noise mixing initializes reconstruction from a partially preserved observation, and structured reference injection separates appearance anchors from continuous motion context. Training combines restoration of degraded images and videos with correction of degraded dubbed sources under target audio. Appearance and synchronization supervision allow the model to recover facial detail and support visual dubbing when the audio is replaced. On talking-head restoration benchmarks, our method achieves the best paired perceptual similarity and synchronization scores among the compared restoration methods. Component comparisons examine audio conditioning, the reconstruction formulation, and reference injection. Native AIGC examples further illustrate the recovery of lip contours, dental structure, and surrounding facial texture in scene-level footage. injection. Native AIGC examples further illustrate the recovery of lip contours, dental structure, and surrounding facial texture in scene-level footage.", "arxiv_id": "2611.03393", "arxiv_url": "https://arxiv.org/abs/2611.03393", "authors": ["Xinyang Li", "Zeran Xu", "Qijun Gan", "Chenwei Zhang", "Meiguang Jin", "Junfeng Ma"], "brief": "\u63d0\u51fa\u97f3\u9891\u5f15\u5bfc\u7684\u4eba\u8138\u89c6\u9891\u4fee\u590d\u6846\u67b6\uff0c\u7ed3\u5408\u53c2\u8003\u6ce8\u5165\u4e0e\u6e90\u566a\u58f0\u6df7\u5408\uff0c\u6062\u590d\u9762\u90e8\u7ec6\u8282\u5e76\u652f\u6301\u89c6\u89c9\u914d\u97f3\uff1b\u5728\u8bf4\u8bdd\u4eba\u89c6\u9891\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u4f73\u611f\u77e5\u76f8\u4f3c\u5ea6\u548c\u97f3\u753b\u540c\u6b65\u5206\u6570\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/TaoLiveAIGC/TaoMate-FVSR", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.03393", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u8138\u89c6\u9891\u4fee\u590d", "\u97f3\u9891\u5f15\u5bfc", "\u97f3\u753b\u540c\u6b65", "\u89c6\u9891\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "TaoLive AIGC", "pdf_url": "https://arxiv.org/pdf/2611.03393v1", "published_at": "2026-11-02", "score": 0.052, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03393.png", "title": "TaoMate-FVSR:Audio-Guided Facial Video Restoration", "tldr": "\u63d0\u51fa\u97f3\u9891\u5f15\u5bfc\u7684\u4eba\u8138\u89c6\u9891\u4fee\u590d\u6846\u67b6\uff0c\u7ed3\u5408\u53c2\u8003\u6ce8\u5165\u4e0e\u6e90\u566a\u58f0\u6df7\u5408\uff0c\u6062\u590d\u9762\u90e8\u7ec6\u8282\u5e76\u652f\u6301\u89c6\u89c9\u914d\u97f3\uff1b\u5728\u8bf4\u8bdd\u4eba\u89c6\u9891\u57fa\u51c6\u4e0a\u53d6\u5f97\u6700\u4f73\u611f\u77e5\u76f8\u4f3c\u5ea6\u548c\u97f3\u753b\u540c\u6b65\u5206\u6570\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Science experiment videos demonstrate how experiments are performed, but offer no direct interaction for learners. Turning them into virtual experiments requires not only reproducing the observed apparatus and state changes, but also enforcing the preconditions governing each operation. We introduce Lab2Sim, a benchmark of 218 science experiment videos with evidence-grounded specifications and 11,881 rubric items. To address this task, we propose EduVideo2Code, which extracts experimental procedures hierarchically, encodes them as explicit state machines to guide code generation, and refines the resulting pages through execution-based verification. Experiments show that existing multimodal models readily generate runnable pages but struggle to faithfully reconstruct experimental apparatus. EduVideo2Code consistently improves all four evaluation dimensions across two backbone models, with apparatus fidelity gains of 24.15 points.", "arxiv_id": "2611.02928", "arxiv_url": "https://arxiv.org/abs/2611.02928", "authors": ["Xusen Hei", "Jiali Chen", "Jinyu Yang", "Yi Cai"], "brief": "\u63d0\u51faLab2Sim\u57fa\u51c6\u4e0eEduVideo2Code\u65b9\u6cd5\uff0c\u5c06\u5b9e\u9a8c\u89c6\u9891\u8f6c\u4e3a\u4ea4\u4e92\u9875\u9762\uff0c\u901a\u8fc7\u72b6\u6001\u673a\u548c\u6267\u884c\u9a8c\u8bc1\u7ea6\u675f\u64cd\u4f5c\uff1b\u4e24\u79cd\u6a21\u578b\u7684\u56db\u9879\u6307\u6807\u5747\u63d0\u5347\uff0c\u4eea\u5668\u8fd8\u539f\u5ea6\u63d0\u9ad824.15\u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.MM"], "github_repo": "https://github.com/black1948/lab2sim", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02928", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u6a21\u578b", "\u865a\u62df\u5b9e\u9a8c", "\u72b6\u6001\u673a", "\u4ee3\u7801\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "The Hong Kong Polytechnic University", "pdf_url": "https://arxiv.org/pdf/2611.02928v1", "published_at": "2026-11-02", "score": 0.046, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02928.png", "title": "Lab2Sim: Turning Real-World Experiment Videos into Interactive Virtual Experiments", "tldr": "\u63d0\u51faLab2Sim\u57fa\u51c6\u4e0eEduVideo2Code\u65b9\u6cd5\uff0c\u5c06\u5b9e\u9a8c\u89c6\u9891\u8f6c\u4e3a\u4ea4\u4e92\u9875\u9762\uff0c\u901a\u8fc7\u72b6\u6001\u673a\u548c\u6267\u884c\u9a8c\u8bc1\u7ea6\u675f\u64cd\u4f5c\uff1b\u4e24\u79cd\u6a21\u578b\u7684\u56db\u9879\u6307\u6807\u5747\u63d0\u5347\uff0c\u4eea\u5668\u8fd8\u539f\u5ea6\u63d0\u9ad824.15\u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Streaming video LLMs can now commentate live gameplay, but they are trained and tested on the same games. We study cross-game streaming commentary, in which a model trained on one game commentates games it has never seen, and find that current commentators transfer their timing but not their knowledge of the game world. We propose StreamDuo, which pairs a trainable commentator with a frozen research agent that reads the wiki of the game being played. When the commentator sees something it cannot name, it sends the current frames, and the research agent returns a few wiki entries two seconds later while the stream continues. We train only the commentator, on a single game, in two stages. Information-gain labels teach it to ask only where an answer would help it say what the human caster said, and on-policy self-distillation from a copy of itself that sees the ideal answer teaches it to use noisy answers. Trained on Baldur\u0027s Gate 3 and tested on ten unseen games, StreamDuo raises entity recall from 0.082 to 0.116 over Proact-VL trained on the same data, cuts source-game leakage from 9.9% to 1.0%, and achieves the best timing and the highest judged liveliness and overall quality among streaming models.", "arxiv_id": "2611.01120", "arxiv_url": "https://arxiv.org/abs/2611.01120", "authors": ["Zixian Gao", "Penghao Luo", "Xiangcheng Cao", "Lixin Xiu", "Ziqi Cai", "Zhen Li", "Erwin Wu", "Kaipeng Zhang"], "brief": "StreamDuo\u7ed3\u5408\u6e38\u620f\u89e3\u8bf4\u6a21\u578b\u4e0e\u68c0\u7d22\u7ef4\u57fa\u7684\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u63d0\u5347\u5bf9\u672a\u89c1\u6e38\u620f\u7684\u5b9e\u65f6\u89e3\u8bf4\u80fd\u529b\uff1b\u5341\u6b3e\u6e38\u620f\u6d4b\u8bd5\u4e2d\u5b9e\u4f53\u53ec\u56de\u7387\u63d0\u9ad8\uff0c\u6e90\u6e38\u620f\u77e5\u8bc6\u6cc4\u6f0f\u663e\u8457\u51cf\u5c11\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01120", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6e38\u620f\u89e3\u8bf4", "\u667a\u80fd\u4f53", "\u77e5\u8bc6\u68c0\u7d22", "\u8de8\u6e38\u620f\u6cdb\u5316"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01120v1", "published_at": "2026-10-31", "score": 0.046, "selected_reasons": ["HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01120.png", "title": "StreamDuo: A Live Commentator and a Research Agent for Unseen Games", "tldr": "StreamDuo\u7ed3\u5408\u6e38\u620f\u89e3\u8bf4\u6a21\u578b\u4e0e\u68c0\u7d22\u7ef4\u57fa\u7684\u7814\u7a76\u667a\u80fd\u4f53\uff0c\u63d0\u5347\u5bf9\u672a\u89c1\u6e38\u620f\u7684\u5b9e\u65f6\u89e3\u8bf4\u80fd\u529b\uff1b\u5341\u6b3e\u6e38\u620f\u6d4b\u8bd5\u4e2d\u5b9e\u4f53\u53ec\u56de\u7387\u63d0\u9ad8\uff0c\u6e90\u6e38\u620f\u77e5\u8bc6\u6cc4\u6f0f\u663e\u8457\u51cf\u5c11\u3002", "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Face image quality assessment (FIQA) estimates the utility of a face image for automated face recognition and has been proposed as a morphing attack detection (MAD) signal that requires no morph-specific training. We evaluate 17 FIQA methods from all current FIQA categories on 20 morphing attack sets from two datasets, FRLL and FEI, including five diffusion-based attack sets. Each quality score is used directly as a MAD decision score. Unlike prior work, which inverted a quality measure when this lowered its error, we fix the score direction of each method in advance from its definition, so that cases in which morphs receive higher quality than bona fide samples remain visible. On FRLL, DifFIQA(R) achieves a mean D-EER of 11.42%, and together with CLIB-FIQA and eDifFIQA(L) clearly outperforms all other FIQA methods. A strong separation of bona fide and morph scores does not imply good detection performance: on the diffusion-based attacks, up to 11 of 17 methods assign higher quality to morphs than to bona fide samples, and the largest reversed separation in the study coincides with the worst detection result of the study. Performance also depends strongly on the attack: GraFIQs(L), the best detector of DCMorph and Arc2Morph on FRLL, performs poorly on the landmark-based and GAN-based attacks. On FEI, the lowest mean D-EER is 39.75%, and a threshold set on the bona fide data of one dataset does not transfer to the other.", "arxiv_id": "2611.00074", "arxiv_url": "https://arxiv.org/abs/2611.00074", "authors": ["Hao Peng", "Fu Bo", "Mahmoud Elshirbeny", "Guray Ozgur"], "brief": "\u8bc4\u4f3017\u79cd\u4eba\u8138\u56fe\u50cf\u8d28\u91cf\u65b9\u6cd5\u7528\u4e8e\u514d\u8bad\u7ec3\u878d\u5408\u653b\u51fb\u68c0\u6d4b\uff0cFRLL\u4e0a\u6700\u4f4e\u5e73\u5747\u9519\u8bef\u7387\u4e3a11.42%\uff1b\u6269\u6563\u653b\u51fb\u5e38\u51fa\u73b0\u8d28\u91cf\u8bc4\u5206\u53cd\u8f6c\uff0c\u8de8\u6570\u636e\u96c6\u9608\u503c\u8fc1\u79fb\u6548\u679c\u5dee\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/gurayozgur/FIQA-as-MAD", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.00074", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u8138\u56fe\u50cf\u8d28\u91cf", "\u878d\u5408\u653b\u51fb\u68c0\u6d4b", "\u6269\u6563\u6a21\u578b", "\u8de8\u6570\u636e\u96c6\u6cdb\u5316"], "num_comments": 1, "on_hf": true, "organization": "Fraunhofer IGD", "pdf_url": "https://arxiv.org/pdf/2611.00074v1", "published_at": "2026-10-15", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00074.png", "title": "When Morphs Look Better: Face Image Quality as a Training-Free Signal for Morphing Attack Detection", "tldr": "\u8bc4\u4f3017\u79cd\u4eba\u8138\u56fe\u50cf\u8d28\u91cf\u65b9\u6cd5\u7528\u4e8e\u514d\u8bad\u7ec3\u878d\u5408\u653b\u51fb\u68c0\u6d4b\uff0cFRLL\u4e0a\u6700\u4f4e\u5e73\u5747\u9519\u8bef\u7387\u4e3a11.42%\uff1b\u6269\u6563\u653b\u51fb\u5e38\u51fa\u73b0\u8d28\u91cf\u8bc4\u5206\u53cd\u8f6c\uff0c\u8de8\u6570\u636e\u96c6\u9608\u503c\u8fc1\u79fb\u6548\u679c\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "General-purpose mobile manipulation requires a combination of capable robot hardware, scalable demonstration collection, expressive whole-body control, and effective policy learning. Yet these components are often developed independently, creating mismatches that limit the capabilities of the complete system. We present Pixel, a co-designed full-stack system for learning general-purpose mobile manipulation. Pixel combines a low-cost wheeled humanoid with human-aligned kinematics and compliant grippers, multiple teleoperation and robot-free human data-collection interfaces, a unified whole-body controller, and a common policy learning pipeline across human and robot demonstrations. A hierarchical learning stack further enables language-conditioned visuomotor control and long-horizon task execution. We evaluate the system across hardware, data collection, and policy learning, and demonstrate mobile-manipulation behaviors requiring dexterity, active perception, navigation, and whole-body coordination. We hope that Pixel provides an integrated and extensible foundation for studying how robot hardware, data, control, and learning can be designed together for robot learning. More results at https://pixel-robot.com/pixel", "arxiv_id": "2611.03648", "arxiv_url": "https://arxiv.org/abs/2611.03648", "authors": ["Tony Tao", "Jason Jingzhou Liu", "Ruslan Salakhutdinov", "Deepak Pathak"], "brief": "\u63d0\u51fa\u534f\u540c\u8bbe\u8ba1\u7684\u5168\u6808\u673a\u5668\u4eba\u7cfb\u7edfPixel\uff0c\u6574\u5408\u4f4e\u6210\u672c\u786c\u4ef6\u3001\u793a\u6559\u91c7\u96c6\u3001\u5168\u8eab\u63a7\u5236\u4e0e\u7b56\u7565\u5b66\u4e60\uff1b\u5b9e\u9a8c\u5c55\u793a\u4e86\u7075\u5de7\u64cd\u4f5c\u3001\u4e3b\u52a8\u611f\u77e5\u3001\u5bfc\u822a\u53ca\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u80fd\u529b\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG", "eess.SY"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03648", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u79fb\u52a8\u64cd\u4f5c", "\u673a\u5668\u4eba\u5b66\u4e60", "\u5168\u8eab\u63a7\u5236", "\u793a\u6559\u6570\u636e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03648v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pixel: A Co-Designed Full-Stack Robot System for Learning General-Purpose Mobile Manipulation", "tldr": "\u63d0\u51fa\u534f\u540c\u8bbe\u8ba1\u7684\u5168\u6808\u673a\u5668\u4eba\u7cfb\u7edfPixel\uff0c\u6574\u5408\u4f4e\u6210\u672c\u786c\u4ef6\u3001\u793a\u6559\u91c7\u96c6\u3001\u5168\u8eab\u63a7\u5236\u4e0e\u7b56\u7565\u5b66\u4e60\uff1b\u5b9e\u9a8c\u5c55\u793a\u4e86\u7075\u5de7\u64cd\u4f5c\u3001\u4e3b\u52a8\u611f\u77e5\u3001\u5bfc\u822a\u53ca\u957f\u7a0b\u4efb\u52a1\u6267\u884c\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) show growing promise for scientific discovery, yet basic questions remain about what enables reliable discovery. How can we trace the scientific discovery capacity of LLMs to their training data? We study this question as one of missing probability mass and develop a theoretical account in which monofacts-the facts observed once during training-set the discovery capacity. In materials science and regulatory genomics, we directly manipulate monofact rates in training sets and find that more monofacts consistently yield more discoveries across two open-weight model families, sampling strategies, and reasoning budgets. Further experiments show the relationship cannot be explained by training-set diversity alone and can transfer across scientific domains when paired with in-domain data. Together, our results identify monofact rate in training data as a key factor governing discoveries in language models.", "arxiv_id": "2611.03617", "arxiv_url": "https://arxiv.org/abs/2611.03617", "authors": ["Arda Uzunoglu", "Mahler Revsine", "Michael Schatz", "Benjamin Van Durme", "Mehrdad Farajtabar", "Daniel Khashabi", "Eric Nalisnick"], "brief": "\u8bba\u6587\u4ece\u7f3a\u5931\u6982\u7387\u8d28\u91cf\u51fa\u53d1\uff0c\u7814\u7a76\u8bad\u7ec3\u6570\u636e\u4e2d\u4ec5\u51fa\u73b0\u4e00\u6b21\u7684\u4e8b\u5b9e\u5982\u4f55\u5f71\u54cd\u5927\u6a21\u578b\u79d1\u5b66\u53d1\u73b0\u80fd\u529b\u3002\u6750\u6599\u79d1\u5b66\u4e0e\u57fa\u56e0\u7ec4\u5b66\u5b9e\u9a8c\u8868\u660e\uff0c\u6b64\u7c7b\u4e8b\u5b9e\u8d8a\u591a\uff0c\u6a21\u578b\u53d1\u73b0\u8d8a\u591a\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03617", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u79d1\u5b66\u53d1\u73b0", "\u8bad\u7ec3\u6570\u636e", "\u6982\u7387\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03617v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Tracing the Scientific Discovery Capacity of LLMs to Their Training Data", "tldr": "\u8bba\u6587\u4ece\u7f3a\u5931\u6982\u7387\u8d28\u91cf\u51fa\u53d1\uff0c\u7814\u7a76\u8bad\u7ec3\u6570\u636e\u4e2d\u4ec5\u51fa\u73b0\u4e00\u6b21\u7684\u4e8b\u5b9e\u5982\u4f55\u5f71\u54cd\u5927\u6a21\u578b\u79d1\u5b66\u53d1\u73b0\u80fd\u529b\u3002\u6750\u6599\u79d1\u5b66\u4e0e\u57fa\u56e0\u7ec4\u5b66\u5b9e\u9a8c\u8868\u660e\uff0c\u6b64\u7c7b\u4e8b\u5b9e\u8d8a\u591a\uff0c\u6a21\u578b\u53d1\u73b0\u8d8a\u591a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Most parameters of a Mixture-of-Experts (MoE) model belong to its experts, and standard training keeps every expert gradient in GPU memory until the optimizer step. This memory grows with the number and size of the experts, so it rises as MoE models scale. We introduce Sonar-MoE, which updates each expert tensor during the backward pass and frees its gradient right away. It brings optimizer-in-backward from dense models to batched MoE expert tensors, so the GPU never holds more than one layer of expert gradients. When we fine-tune OLMoE-1B-7B and Granite-3.1-3B-A800M in bf16 with two expert-kernel backends, Sonar-MoE lowers peak memory by 19% to 22%. Its updates are bitwise identical to standard training without expert gradient clipping, and held-out loss stays within 0.003 of all baselines. Each step also takes 17% to 23% less time than standard training with global-norm clipping. Updating whole batched tensors rather than individual experts is what keeps Sonar-MoE fast, as it avoids a 20% to 72% slowdown while using the same memory. Sonar-MoE matches optimizer-in-backward over all parameters in memory and speed while still clipping the dense parameters.", "arxiv_id": "2611.03577", "arxiv_url": "https://arxiv.org/abs/2611.03577", "authors": ["Avni Mittal", "Avinash Anand", "Ashutosh Kumar", "Dikshant Kukreja", "Kritarth Prasad", "Chaitanya Lakhchaura", "Rishitej Reddy Vyalla", "Erik Cambria", "Zhengkui Wang", "Rajiv Ratn Shah"], "brief": "Sonar-MoE \u5728\u53cd\u5411\u4f20\u64ad\u4e2d\u66f4\u65b0\u6279\u91cf\u4e13\u5bb6\u5f20\u91cf\u5e76\u7acb\u5373\u91ca\u653e\u68af\u5ea6\uff0c\u5fae\u8c03\u65f6\u5cf0\u503c\u663e\u5b58\u964d\u4f4e19%\u81f322%\uff0c\u8bad\u7ec3\u635f\u5931\u4e0e\u57fa\u7ebf\u76f8\u8fd1\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03577", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6df7\u5408\u4e13\u5bb6\u6a21\u578b", "\u663e\u5b58\u4f18\u5316", "\u6a21\u578b\u8bad\u7ec3"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03577v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sonar-MoE: In-Backward Expert Updates for Memory-Efficient Mixture-of-Experts Training", "tldr": "Sonar-MoE \u5728\u53cd\u5411\u4f20\u64ad\u4e2d\u66f4\u65b0\u6279\u91cf\u4e13\u5bb6\u5f20\u91cf\u5e76\u7acb\u5373\u91ca\u653e\u68af\u5ea6\uff0c\u5fae\u8c03\u65f6\u5cf0\u503c\u663e\u5b58\u964d\u4f4e19%\u81f322%\uff0c\u8bad\u7ec3\u635f\u5931\u4e0e\u57fa\u7ebf\u76f8\u8fd1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models in customer-facing products must be continually updated, since the data they serve shifts over time. As retraining on the full accumulated data is impractical, each update should instead run on a small set of examples carrying the training signal of all data seen so far. The strongest current methods build this set by gradient matching, which synthesizes examples whose training gradients match those of the full data. However, they require ground-truth labels, run once on a fixed snapshot rather than on a growing stream, and are slow on large data. We introduce \\textbf{OLGA}, which lifts these limitations. It distills unlabeled data by drawing the gradient matching targets from the model\u0027s own next-token predictions. Across five text classification benchmarks with phi-1.5, it improves accuracy by 10 percentage points over the strongest selection baseline using as few as five examples. OLGA also distills online data streams by keeping a running rehearsal memory of synthetic examples, which is re-distilled together with each new batch as it arrives. In the online setting, it outperforms the strongest selection-based continual baseline by 6.6 stream-AUC percentage points. Finally, our method scales to large data by pairing distillation with selection in a hybrid pipeline, letting selection handle the mild stage of compression and distillation the extreme one. It cuts runtime by 30\\% versus distillation alone at similar accuracy, and beats the best selection-only pipeline by up to 12.6 percentage points.", "arxiv_id": "2611.03496", "arxiv_url": "https://arxiv.org/abs/2611.03496", "authors": ["Sajjad Pakdamansavoji", "Mohammad Reza Rezaei", "Ilija Subasic", "Pedro Garzon", "Radu Paradovschi", "Zhao Chen"], "brief": "\u63d0\u51faOLGA\uff0c\u5229\u7528\u6a21\u578b\u81ea\u8eab\u9884\u6d4b\u8fdb\u884c\u65e0\u6807\u7b7e\u68af\u5ea6\u5339\u914d\uff0c\u5e76\u5728\u7ebf\u66f4\u65b0\u5408\u6210\u6837\u672c\u8bb0\u5fc6\u3002\u6587\u672c\u5206\u7c7b\u5b9e\u9a8c\u4e2d\uff0c\u5728\u7ebf\u6027\u80fd\u8f83\u6700\u5f3a\u9009\u62e9\u57fa\u7ebf\u63d0\u53476.6\u4e2a\u767e\u5206\u70b9\uff0c\u6df7\u5408\u538b\u7f29\u4f7f\u8fd0\u884c\u65f6\u95f4\u51cf\u5c1130%\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03496", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6301\u7eed\u5b66\u4e60", "\u6570\u636e\u84b8\u998f", "\u68af\u5ea6\u5339\u914d", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03496v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Online Label-Free Gradient Matching for Continual Language Model Training", "tldr": "\u63d0\u51faOLGA\uff0c\u5229\u7528\u6a21\u578b\u81ea\u8eab\u9884\u6d4b\u8fdb\u884c\u65e0\u6807\u7b7e\u68af\u5ea6\u5339\u914d\uff0c\u5e76\u5728\u7ebf\u66f4\u65b0\u5408\u6210\u6837\u672c\u8bb0\u5fc6\u3002\u6587\u672c\u5206\u7c7b\u5b9e\u9a8c\u4e2d\uff0c\u5728\u7ebf\u6027\u80fd\u8f83\u6700\u5f3a\u9009\u62e9\u57fa\u7ebf\u63d0\u53476.6\u4e2a\u767e\u5206\u70b9\uff0c\u6df7\u5408\u538b\u7f29\u4f7f\u8fd0\u884c\u65f6\u95f4\u51cf\u5c1130%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Every multimodal-LLM multiple-choice benchmark ends with a scoring rule that converts a model\u0027s response, often free-form text rather than a clean option letter, into a right/wrong verdict, buried in its code. Unlike the dataset, this rule is chosen without justification and left unexamined, yet it sets the published number. We reproduce the official scorers of eight peer-reviewed benchmarks on five open vision-language models (VLMs) that fit a single 16 GB GPU, and introduce a blinded human-plus-LLM-judge adjudication (Cohen\u0027s kappa=0.956) that recovers what the model actually answered. The scoring rule alone moves accuracy by up to 22 points on identical outputs, yet exactly 0 wherever a model emits clean option letters, so it hides on strong-model leaderboards. It is the fallback and not the rambling that does the damage: the benchmark with the highest non-compliance we measure has an artifact of exactly zero, because its scorer abstains instead of guessing; a reasoning model with non-compliance 0.000 still swings 9.5 points with which regex match of its trace the parser keeps. No standard rule is reliable: snapping a non-answer to its closest option credits answers never given yet buries correct ones, abstention discards answers stated in words, and likelihood scoring follows answer-token priors, so a single grade conflates capability with luck rather than measuring either. We release all code, labels, and the protocol, and argue benchmarks should report a non-compliance rate and at least two rules, not one unexamined grade.", "arxiv_id": "2611.03377", "arxiv_url": "https://arxiv.org/abs/2611.03377", "authors": ["Ahmad Jarjis Hasan", "Jonathan Lwowski"], "brief": "\u5ba1\u8ba1\u516b\u4e2a\u591a\u6a21\u6001\u9009\u62e9\u9898\u57fa\u51c6\u7684\u8bc4\u5206\u89c4\u5219\uff0c\u5e76\u7528\u4eba\u5de5\u4e0e\u6a21\u578b\u8054\u5408\u5224\u5b9a\u6838\u9a8c\u7b54\u6848\u3002\u76f8\u540c\u8f93\u51fa\u4ec5\u56e0\u8bc4\u5206\u89c4\u5219\u4e0d\u540c\uff0c\u51c6\u786e\u7387\u6700\u591a\u76f8\u5dee22\u4e2a\u767e\u5206\u70b9\uff0c\u5efa\u8bae\u62a5\u544a\u4e0d\u5408\u89c4\u7387\u53ca\u591a\u79cd\u8bc4\u5206\u7ed3\u679c\u3002", "categories": ["cs.AI", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03377", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u57fa\u51c6\u6d4b\u8bd5", "\u8bc4\u5206\u89c4\u5219", "\u6a21\u578b\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03377v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Same Outputs, Different Scores: Auditing the Unchecked Graders of Multimodal LLM Benchmarks", "tldr": "\u5ba1\u8ba1\u516b\u4e2a\u591a\u6a21\u6001\u9009\u62e9\u9898\u57fa\u51c6\u7684\u8bc4\u5206\u89c4\u5219\uff0c\u5e76\u7528\u4eba\u5de5\u4e0e\u6a21\u578b\u8054\u5408\u5224\u5b9a\u6838\u9a8c\u7b54\u6848\u3002\u76f8\u540c\u8f93\u51fa\u4ec5\u56e0\u8bc4\u5206\u89c4\u5219\u4e0d\u540c\uff0c\u51c6\u786e\u7387\u6700\u591a\u76f8\u5dee22\u4e2a\u767e\u5206\u70b9\uff0c\u5efa\u8bae\u62a5\u544a\u4e0d\u5408\u89c4\u7387\u53ca\u591a\u79cd\u8bc4\u5206\u7ed3\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An experimental agent can succeed for the wrong reasons. Evaluations, however, often focus on the outcome, not the experiments, evidence, and inferences that produced it. We introduce LUCA, a configurable synthetic world for evaluating this process under fully known ground truth. Agents learn unknown regulatory systems through budgeted experimentation, then predict unseen interventions, diagnose hidden faults, and attempt rescues. This setup allows us to evaluate experiment selection, prediction, diagnosis, and intervention separately. Across seven frontier LLMs and three baselines, these capabilities dissociate sharply. Agents frequently rescue malfunctioning systems while diagnosing the wrong fault; diagnosis varies 7x across models while prediction varies only 1.4x. Models also adopt surprisingly different experimental strategies, and greater exploration does not reliably yield better performance. In one failure mode, agents often perform the experiment needed to distinguish competing causes, but still fail to use the resulting evidence. LUCA turns these hidden failures into measurable behaviours, providing a controlled environment to study where experimental agents succeed and fail. Code: https://github.com/RelationRx/luca.", "arxiv_id": "2611.03100", "arxiv_url": "https://arxiv.org/abs/2611.03100", "authors": ["Anna Gogleva", "Thomas Charman", "Martin Balla", "Karl Gemayel"], "brief": "\u63d0\u51fa\u53ef\u914d\u7f6e\u7684\u5408\u6210\u4e16\u754c LUCA\uff0c\u5206\u9879\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u5b9e\u9a8c\u9009\u62e9\u3001\u9884\u6d4b\u3001\u8bca\u65ad\u4e0e\u5e72\u9884\u80fd\u529b\u3002\u6d4b\u8bd5\u53d1\u73b0\u5404\u80fd\u529b\u660e\u663e\u5206\u5316\uff0c\u6a21\u578b\u5e38\u80fd\u4fee\u590d\u7cfb\u7edf\u5374\u8bef\u8bca\u6545\u969c\uff0c\u4e5f\u4f1a\u5ffd\u7565\u5173\u952e\u5b9e\u9a8c\u8bc1\u636e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03100", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53\u8bc4\u6d4b", "\u5b9e\u9a8c\u63a8\u7406", "\u5408\u6210\u73af\u5883", "\u6545\u969c\u8bca\u65ad"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03100v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LUCA: A Synthetic World for Experimental Reasoning", "tldr": "\u63d0\u51fa\u53ef\u914d\u7f6e\u7684\u5408\u6210\u4e16\u754c LUCA\uff0c\u5206\u9879\u8bc4\u4f30\u667a\u80fd\u4f53\u7684\u5b9e\u9a8c\u9009\u62e9\u3001\u9884\u6d4b\u3001\u8bca\u65ad\u4e0e\u5e72\u9884\u80fd\u529b\u3002\u6d4b\u8bd5\u53d1\u73b0\u5404\u80fd\u529b\u660e\u663e\u5206\u5316\uff0c\u6a21\u578b\u5e38\u80fd\u4fee\u590d\u7cfb\u7edf\u5374\u8bef\u8bca\u6545\u969c\uff0c\u4e5f\u4f1a\u5ffd\u7565\u5173\u952e\u5b9e\u9a8c\u8bc1\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Theoretical limitations of transformers on state tracking---the ability to track information about entities or variables over long contexts---have motivated new recurrent language modeling (LM) architectures such as Gated DeltaNet (GDN). These architectures have, in particular, been benchmarked against the $S_5$ word problem, a theoretically hard state-tracking task that captures abilities such as code evaluation under arbitrary variable assignment. It, however, remains open whether other, simpler forms of state tracking might both be more relevant in practice and already explain observed differences between these architectures. We propose evaluating state tracking using a hierarchy of word problems with four increasing levels of difficulty: r-trivial, corresponding to immutable assignment to variables in programming; aperiodic, where assignments are mutable; soluble, where assignments are self-referential; and general finite state tracking. Theoretically, we show that the class of problems transformers are thought to length-generalize on does not even contain all aperiodic state tracking. On the other hand, we prove that GDN with positive eigenvalues expresses all aperiodic problems, and the regular languages recognized by certain transformers are precisely all soluble ones, thus providing a fine-grained picture of state tracking capabilities of various architectures. Taking these ideas to practice, we construct StateBench, a 4-tier long-horizon state-tracking benchmark. Our systematic direct training experiments across architectures largely align with theoretical expectation, albeit with interesting observations at very large scale length-generalization. Additionally, we also evaluate pretrained models---both open hybrid and closed frontier ones---on StateBench, finding that none of them robustly solves even soluble state tracking, suggesting a direction for future improvement.", "arxiv_id": "2611.03094", "arxiv_url": "https://arxiv.org/abs/2611.03094", "authors": ["Jackson Petty", "William Merrill", "Ashish Sabharwal"], "brief": "\u63d0\u51fa\u56db\u7ea7\u72b6\u6001\u8ffd\u8e2a\u5c42\u7ea7\u4e0e StateBench\uff0c\u4ece\u7406\u8bba\u548c\u5b9e\u9a8c\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u67b6\u6784\u7684\u80fd\u529b\uff1b\u7ed3\u679c\u8868\u660e\uff0c\u53d7\u6d4b\u9884\u8bad\u7ec3\u6a21\u578b\u5747\u65e0\u6cd5\u7a33\u5065\u89e3\u51b3\u7b2c\u4e09\u7b49\u7ea7\u7684\u72b6\u6001\u8ffd\u8e2a\u4efb\u52a1\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03094", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u72b6\u6001\u8ffd\u8e2a", "\u8bed\u8a00\u6a21\u578b", "\u57fa\u51c6\u6d4b\u8bd5", "\u957f\u5ea6\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03094v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Fine-Grained Hierarchy and Benchmark for State Tracking in Language Models", "tldr": "\u63d0\u51fa\u56db\u7ea7\u72b6\u6001\u8ffd\u8e2a\u5c42\u7ea7\u4e0e StateBench\uff0c\u4ece\u7406\u8bba\u548c\u5b9e\u9a8c\u6bd4\u8f83\u4e0d\u540c\u6a21\u578b\u67b6\u6784\u7684\u80fd\u529b\uff1b\u7ed3\u679c\u8868\u660e\uff0c\u53d7\u6d4b\u9884\u8bad\u7ec3\u6a21\u578b\u5747\u65e0\u6cd5\u7a33\u5065\u89e3\u51b3\u7b2c\u4e09\u7b49\u7ea7\u7684\u72b6\u6001\u8ffd\u8e2a\u4efb\u52a1\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The multi-turn checker of the Berkeley Function Calling Leaderboard (BFCL) evaluates final state correctness but ignores the effects of intermediate calls: extra calls are free, function documentation does not describe side effects, and the scripted user never responds to proposals. Consequently, models asking for confirmation before destructive actions are penalized; 260 of 734 reference turns in the base category perform destructive actions without confirmation. We make BFCL effect-aware without replacing it. We infer effect declarations for all 128 functions by executing them in BFCL simulators and comparing state changes, with destructive writes identified by three annotators. A judge-free replay scorer reproduces official results across all 800 reference trajectories while reporting unrequested destructive calls, duplicate writes, redundant reads, surplus steps, and their token costs. We also introduce a confirmation-aware protocol with a deterministic simulated user. Across 11 open models, effect-aware scoring preserves the official ranking but reveals substantial differences in execution quality: the leading model loses 14.0 points due to unrequested destructive calls, while surplus steps consume up to 28% of input tokens. Adding effect hints to function documentation has no impact on eight evaluated models. Allowing the simulated user to respond recovers up to four points for models that seek confirmation. However, the best model completes only six of 576 conversations requiring destructive actions with explicit confirmation. These results expose a key limitation of current function-calling benchmarks: they cannot distinguish between asking for clarification and obtaining permission before potentially destructive actions.", "arxiv_id": "2611.02978", "arxiv_url": "https://arxiv.org/abs/2611.02978", "authors": ["Alexander Kovalenko", "Artem Redchych"], "brief": "\u63d0\u51fa\u65e0\u9700\u88c1\u5224\u6a21\u578b\u7684\u591a\u8f6e\u51fd\u6570\u8c03\u7528\u8bc4\u6d4b\uff0c\u8ffd\u8e2a\u8c03\u7528\u526f\u4f5c\u7528\u5e76\u6a21\u62df\u7528\u6237\u786e\u8ba4\u3002\u5b9e\u9a8c\u53d1\u73b0\u539f\u699c\u5355\u6392\u540d\u4e0d\u53d8\uff0c\u4f46\u6a21\u578b\u666e\u904d\u7f3a\u4e4f\u7834\u574f\u6027\u64cd\u4f5c\u786e\u8ba4\uff0c\u5197\u4f59\u6b65\u9aa4\u4e5f\u5e26\u6765\u663e\u8457\u5f00\u9500\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02978", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u51fd\u6570\u8c03\u7528", "\u8bc4\u6d4b\u57fa\u51c6", "\u64cd\u4f5c\u5b89\u5168"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02978v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CAREFUL-Bench: Effect-Aware, Judge-Free Evaluation of Multi-Turn LLM Function Calling", "tldr": "\u63d0\u51fa\u65e0\u9700\u88c1\u5224\u6a21\u578b\u7684\u591a\u8f6e\u51fd\u6570\u8c03\u7528\u8bc4\u6d4b\uff0c\u8ffd\u8e2a\u8c03\u7528\u526f\u4f5c\u7528\u5e76\u6a21\u62df\u7528\u6237\u786e\u8ba4\u3002\u5b9e\u9a8c\u53d1\u73b0\u539f\u699c\u5355\u6392\u540d\u4e0d\u53d8\uff0c\u4f46\u6a21\u578b\u666e\u904d\u7f3a\u4e4f\u7834\u574f\u6027\u64cd\u4f5c\u786e\u8ba4\uff0c\u5197\u4f59\u6b65\u9aa4\u4e5f\u5e26\u6765\u663e\u8457\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language model agents increasingly act on users\u0027 behalf by manipulating external environments through tools, often from high-level instructions that leave critical task- and environment-specific context unstated. To prevent resulting misaligned actions, recent work verifies proposed actions before execution, largely by establishing whether the conditions supporting them hold. We argue that this confirmation-oriented view leaves a fundamental blind spot: a wrong action often passes every check that asks whether it is right. This motivates a different question for verification: rather than asking what evidence supports an action, can the agent find evidence that refutes it? We pursue this direction with BlackSwan, a refutation-oriented, expect-suspect-test procedure that predicts the intended effect of each state-mutating action, formulates specific and empirically testable hypotheses for how it could be wrong, and tests them using existing observations or additional non-mutating actions, executing the action only if none survives testing. On challenging AppWorld tasks, BlackSwan improves success rate over the strongest baseline by 14.9 and 25.2%p with and without the backbone model\u0027s thinking mode, respectively. Even without thinking or in-context demonstrations, it outperforms stronger baselines equipped with them. The gains also transfer beyond AppWorld, with BlackSwan improving WebShop performance by 12.7%p. More broadly, our results suggest that language model agents have an underused capacity to recognize and self-correct misaligned actions, which can be systematically elicited through active conjecture and refutation before execution.", "arxiv_id": "2611.02950", "arxiv_url": "https://arxiv.org/abs/2611.02950", "authors": ["Minhyeon Oh", "Chiyeong Heo", "Geonwoo Noh", "Hoyoung Kim", "Jangwon Son", "Jungseul Ok"], "brief": "\u63d0\u51faBlackSwan\uff0c\u901a\u8fc7\u9884\u6d4b\u884c\u52a8\u6548\u679c\u3001\u63d0\u51fa\u5e76\u68c0\u9a8c\u9519\u8bef\u5047\u8bbe\uff0c\u5728\u6267\u884c\u524d\u6392\u9664\u4e0d\u5408\u610f\u64cd\u4f5c\uff1b\u5728AppWorld\u548cWebShop\u4e0a\u5747\u663e\u8457\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02950", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b\u667a\u80fd\u4f53", "\u884c\u52a8\u9a8c\u8bc1", "\u5047\u8bbe\u68c0\u9a8c", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02950v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Action Verification through Conjecture and Refutation for Language Model Agents", "tldr": "\u63d0\u51faBlackSwan\uff0c\u901a\u8fc7\u9884\u6d4b\u884c\u52a8\u6548\u679c\u3001\u63d0\u51fa\u5e76\u68c0\u9a8c\u9519\u8bef\u5047\u8bbe\uff0c\u5728\u6267\u884c\u524d\u6392\u9664\u4e0d\u5408\u610f\u64cd\u4f5c\uff1b\u5728AppWorld\u548cWebShop\u4e0a\u5747\u663e\u8457\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sampling and selection spend test-time compute inside a candidate pool, but they cannot recover a correct answer that never enters it. We introduce ValueFormation, a test-time policy that decides after each primary-model draw whether to stop, continue sampling, or acquire one proposal from a heterogeneous reasoning specialist. The three actions are compared on one cost-regularized value scale learned from vote-state features; the calibration is frozen across tasks and primary models, and acquired proposals are accepted only through a frozen posterior comparison. On held-out MATH-500, one Llama-fitted calibration improves over the strongest of eight identically evaluated baselines by more than fifteen points for each of three 8B primaries and transfers unchanged to Qwen3-14B. Removing acquisition lowers Llama MATH accuracy by 20.43 points, while same-trace and same-access replays attribute the gain to state-conditioned acquisition rather than specialist access alone. Where primary coverage is high, as on GSM8K, acquisition is rare and gains mainly come from cheaper allocation; on MBPP, a fixed code route attains the top accuracy at the lowest interaction cost. Varying the token price monotonically reduces calls without retraining.", "arxiv_id": "2611.02852", "arxiv_url": "https://arxiv.org/abs/2611.02852", "authors": ["Zeyan Li", "Jianfeng Xu"], "brief": "\u63d0\u51fa\u6309\u5019\u9009\u7b54\u6848\u72b6\u6001\u51b3\u5b9a\u505c\u6b62\u3001\u7ee7\u7eed\u91c7\u6837\u6216\u8c03\u7528\u63a8\u7406\u4e13\u5bb6\u7684\u6d4b\u8bd5\u65f6\u7b56\u7565\u3002\u5728 MATH-500 \u4e0a\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u51c6\u786e\u7387\u63d0\u5347\u8d8515\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u53ef\u901a\u8fc7\u8c03\u6574\u6210\u672c\u51cf\u5c11\u8c03\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02852", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6d4b\u8bd5\u65f6\u63a8\u7406", "\u81ea\u9002\u5e94\u8ba1\u7b97", "\u6a21\u578b\u534f\u4f5c", "\u6210\u672c\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02852v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Value-Conditioned Proposal Acquisition for Test-Time Reasoning", "tldr": "\u63d0\u51fa\u6309\u5019\u9009\u7b54\u6848\u72b6\u6001\u51b3\u5b9a\u505c\u6b62\u3001\u7ee7\u7eed\u91c7\u6837\u6216\u8c03\u7528\u63a8\u7406\u4e13\u5bb6\u7684\u6d4b\u8bd5\u65f6\u7b56\u7565\u3002\u5728 MATH-500 \u4e0a\uff0c\u76f8\u6bd4\u6700\u5f3a\u57fa\u7ebf\u51c6\u786e\u7387\u63d0\u5347\u8d8515\u4e2a\u767e\u5206\u70b9\uff0c\u5e76\u53ef\u901a\u8fc7\u8c03\u6574\u6210\u672c\u51cf\u5c11\u8c03\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mathematical formalization plays an important role in establishing rigorous and machine-verifiable foundations for mathematical reasoning. With the development of large language models (LLMs) and interactive theorem provers, intelligent agents offer a promising approach to automating the formalization of mathematical theories. This paper presents the Math Foundation Formalization Agent (MFF-Agent), a general-purpose intelligent agent designed to support formalization tasks across multiple mathematical domains. The agent integrates the reasoning capabilities of large language models with the formal verification capabilities of the Rocq proof assistant. It incorporates task classification, tool-assisted execution, verification feedback, and state-based task management to support the generation, refinement, and verification of formal proofs. Unlike an approach focused on a single mathematical theory, the agent is examined through case studies involving Morse--Kelley axiomatic set theory (MK), real numbers, propositional logic, and equivalences of the axiom of choice. These cases investigate its applicability across mathematical foundations and distinguish source-level completion, interactive verification, and reproducible compilation. The results demonstrate the feasibility of a unified operational framework for heterogeneous foundation-level tasks and clarify the gap between such a framework and a fully integrated mathematical foundation.", "arxiv_id": "2611.02843", "arxiv_url": "https://arxiv.org/abs/2611.02843", "authors": ["Jiaxin Xie", "Guowei Dou", "Xiang Ji", "Wensheng Yu"], "brief": "\u63d0\u51fa\u7ed3\u5408\u5927\u8bed\u8a00\u6a21\u578b\u4e0e Rocq \u7684\u6570\u5b66\u57fa\u7840\u5f62\u5f0f\u5316\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u4efb\u52a1\u5206\u7c7b\u3001\u5de5\u5177\u6267\u884c\u548c\u9a8c\u8bc1\u53cd\u9988\u751f\u6210\u4e0e\u6539\u8fdb\u8bc1\u660e\u3002\u591a\u9886\u57df\u6848\u4f8b\u663e\u793a\u7edf\u4e00\u6846\u67b6\u5177\u5907\u53ef\u884c\u6027\uff0c\u4f46\u8ddd\u79bb\u5b8c\u6574\u96c6\u6210\u7684\u6570\u5b66\u57fa\u7840\u4ecd\u6709\u5dee\u8ddd\u3002", "categories": ["cs.LO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02843", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6570\u5b66\u5f62\u5f0f\u5316", "\u667a\u80fd\u4f53", "\u5b9a\u7406\u8bc1\u660e", "\u5f62\u5f0f\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02843v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Math Foundation Formalization Agent: A General-Purpose Approach to Formalizing Mathematical Foundations", "tldr": "\u63d0\u51fa\u7ed3\u5408\u5927\u8bed\u8a00\u6a21\u578b\u4e0e Rocq \u7684\u6570\u5b66\u57fa\u7840\u5f62\u5f0f\u5316\u667a\u80fd\u4f53\uff0c\u901a\u8fc7\u4efb\u52a1\u5206\u7c7b\u3001\u5de5\u5177\u6267\u884c\u548c\u9a8c\u8bc1\u53cd\u9988\u751f\u6210\u4e0e\u6539\u8fdb\u8bc1\u660e\u3002\u591a\u9886\u57df\u6848\u4f8b\u663e\u793a\u7edf\u4e00\u6846\u67b6\u5177\u5907\u53ef\u884c\u6027\uff0c\u4f46\u8ddd\u79bb\u5b8c\u6574\u96c6\u6210\u7684\u6570\u5b66\u57fa\u7840\u4ecd\u6709\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language model agents often struggle with complex tasks even when equipped with expert-written skills. Such skills encode declarative knowledge, whereas successful execution requires procedural knowledge tailored to the task at hand. Natural language skills may leave conditions and dependencies implicit, and tasks involving multiple skills further require agents to coordinate intermediate results and execution order. We introduce Think with Skills, a method that trains reasoning models to turn relevant skill descriptions into task-specific pseudocode plans before execution. The pseudocode explicitly represents operations, conditions, intermediate results, and dependencies, providing a structured bridge from skill descriptions to agent actions. We construct training data that pairs tasks and skills with pseudocode plans and execution trajectories, use supervised fine tuning to initialize this behavior, and further optimize end-to-end task performance with Group Relative Policy Optimization. On SkillsBench, Think with Skills raises task success from 35.0% to 62.0%. These results show that proceduralizing expert knowledge before execution substantially improves skill use.", "arxiv_id": "2611.02830", "arxiv_url": "https://arxiv.org/abs/2611.02830", "authors": ["Boshen Zhou", "Boxuan Yue", "Xiang Li", "Shanchao Yang"], "brief": "\u63d0\u51fa\u5148\u5c06\u6280\u80fd\u63cf\u8ff0\u8f6c\u5316\u4e3a\u4efb\u52a1\u4e13\u5c5e\u4f2a\u4ee3\u7801\u8ba1\u5212\u3001\u518d\u6267\u884c\u7684\u65b9\u6cd5\uff0c\u5e76\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6a21\u578b\uff1b\u5728 SkillsBench \u4e0a\uff0c\u4efb\u52a1\u6210\u529f\u7387\u4ece35.0%\u63d0\u5347\u81f362.0%\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02830", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4efb\u52a1\u89c4\u5212", "\u6280\u80fd\u5b66\u4e60", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02830v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Think with Skills: Pseudocode Planning Before Execution for Advanced Reasoners", "tldr": "\u63d0\u51fa\u5148\u5c06\u6280\u80fd\u63cf\u8ff0\u8f6c\u5316\u4e3a\u4efb\u52a1\u4e13\u5c5e\u4f2a\u4ee3\u7801\u8ba1\u5212\u3001\u518d\u6267\u884c\u7684\u65b9\u6cd5\uff0c\u5e76\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u548c\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u6a21\u578b\uff1b\u5728 SkillsBench \u4e0a\uff0c\u4efb\u52a1\u6210\u529f\u7387\u4ece35.0%\u63d0\u5347\u81f362.0%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Sparse attention cuts the cost of long-context inference by making the attention matrix sparse: each query attends only a subset of the sequence, chosen by a fi
