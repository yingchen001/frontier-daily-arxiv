8bc1\u540e\u66f4\u65b0\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03238", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Skills\u5c01\u88c5\u64cd\u4f5c\u6d41\u7a0b\uff0cReferences\u652f\u6301\u6309\u9700\u67e5\u9605", "\u6267\u884c\u5f15\u5bfc\u6280\u80fd\u6f14\u5316\uff0c\u4f7f\u6210\u529f\u7387\u6700\u591a\u63d0\u534717.12\u4e2a\u767e\u5206\u70b9", "ScienceBoard-VE\u5206\u79bb\u6f14\u5316\u4e0e\u6d4b\u8bd5\u4efb\u52a1\uff0c\u51cf\u5c11\u6cc4\u6f0f"], "keywords": ["\u8ba1\u7b97\u673a\u4f7f\u7528\u667a\u80fd\u4f53", "\u6280\u80fd\u5b66\u4e60", "\u79d1\u5b66\u8f6f\u4ef6", "\u57fa\u51c6\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03238v1", "published_at": "2026-11-02", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "ScienceCUA: Resource-to-Skill Construction and Execution-Guided Skill Evolution for Scientific Computer Use Agents", "tldr": "\u5c06\u79d1\u5b66\u8f6f\u4ef6\u6587\u6863\u8f6c\u4e3a\u53ef\u6267\u884c\u6280\u80fd\uff0c\u5e76\u7528\u771f\u5b9e\u6267\u884c\u53cd\u9988\u6301\u7eed\u6539\u8fdb\u667a\u80fd\u4f53\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": "ScienceCUA\u4ece\u8f6f\u4ef6\u6587\u6863\u63a8\u5bfc\u64cd\u4f5c\u8f68\u8ff9\uff0c\u6784\u5efa\u53ef\u590d\u7528\u6280\u80fd\u4e0e\u72ec\u7acb\u53c2\u8003\u5e93\uff1b\u518d\u5bf9\u6bd4\u540c\u4efb\u52a1\u7684\u6210\u529f\u548c\u5931\u8d25\u8f68\u8ff9\u4fee\u8ba2\u6280\u80fd\uff0c\u7ecf\u771f\u5b9e\u73af\u5883\u53cd\u590d\u9a8c\u8bc1\u540e\u66f4\u65b0\u3002", "why_notable": "\u628a\u9759\u6001\u6587\u6863\u8f6c\u5316\u4e3a\u53ef\u9a8c\u8bc1\u3001\u53ef\u8fed\u4ee3\u7684\u64cd\u4f5c\u80fd\u529b\uff0c\u7f13\u89e3\u6587\u6863\u4e0e\u90e8\u7f72\u7248\u672c\u4e0d\u5339\u914d\u7684\u95ee\u9898\uff0c\u5e76\u901a\u8fc7\u9694\u79bb\u6f14\u5316\u4e0e\u6d4b\u8bd5\u63d0\u9ad8\u8bc4\u4f30\u53ef\u4fe1\u5ea6\u3002"}, {"abstract": "We introduce Axion 1.0, a fully open agent foundation model that combines strong and broad agentic capabilities with a remarkably simple training recipe. Axion 1.0 is trained in only three stages: two lightweight supervised fine-tuning stages followed by reinforcement learning, without dedicated mid-training, direct preference optimization (DPO), or on-policy distillation (OPD). The first SFT stage develops strong self-contained reasoning through model-aware data construction, where we synthesize challenging problems and adversarially strengthen them based on the base model\u0027s own successful solution strategies. The second stage extends these capabilities to tool-dependent reasoning through a scalable pipeline for constructing diverse and automatically verifiable tasks grounded in real-world data sources and deterministic computation. Finally, reinforcement learning further strengthens long-horizon reasoning and interaction with external tools and environments. Despite this compact training recipe, Axion 1.0 achieves strong performance across a broad suite of agentic benchmarks and is competitive with leading commercial models on several of them. Equally importantly, Axion 1.0 is open beyond model weights: we release the complete recipe, including data construction, generation, filtering, verification, prompts, and training code, enabling the entire development process to be reproduced and extended. Axion 1.0 demonstrates that strong agent foundation models can be both open and simple, offering a practical and reproducible path toward advancing open agentic intelligence.", "arxiv_id": "2611.03233", "arxiv_url": "https://arxiv.org/abs/2611.03233", "authors": ["Yuqi Jia", "Yunjie Tian", "Jiayu Zheng", "Yijun Liang", "Jingchen Sun", "Mengyu Zhao", "Di Fu"], "brief": "Axion 1.0\u5148\u4ee5\u6a21\u578b\u611f\u77e5\u7684\u6570\u636e\u6784\u9020\u5f3a\u5316\u72ec\u7acb\u63a8\u7406\uff0c\u518d\u7528\u81ea\u52a8\u53ef\u9a8c\u8bc1\u4efb\u52a1\u8bad\u7ec3\u5de5\u5177\u63a8\u7406\uff0c\u6700\u540e\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u957f\u7a0b\u4ea4\u4e92\uff0c\u5e76\u5f00\u653e\u5b8c\u6574\u8bad\u7ec3\u6d41\u7a0b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03233", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u4ec53\u9636\u6bb5\u8bad\u7ec3\uff1a\u4e24\u8f6eSFT\u540e\u63a5\u5f3a\u5316\u5b66\u4e60", "\u4f9d\u636e\u57fa\u5ea7\u6a21\u578b\u89e3\u9898\u7b56\u7565\uff0c\u5bf9\u6297\u6027\u589e\u5f3a\u5408\u6210\u96be\u9898", "\u5de5\u5177\u4efb\u52a1\u57fa\u4e8e\u771f\u5b9e\u6570\u636e\u4e0e\u786e\u5b9a\u6027\u8ba1\u7b97\uff0c\u53ef\u81ea\u52a8\u9a8c\u8bc1"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u8c03\u7528", "\u5f00\u6e90\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03233v1", "published_at": "2026-11-02", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Axion 1.0: Open Agent Foundation Models, Simplified", "tldr": "\u4ec5\u7528\u4e24\u8f6e\u76d1\u7763\u5fae\u8c03\u4e0e\u5f3a\u5316\u5b66\u4e60\uff0c\u6784\u5efa\u80fd\u529b\u5e7f\u6cdb\u4e14\u8bad\u7ec3\u6d41\u7a0b\u5168\u5f00\u653e\u7684\u667a\u80fd\u4f53\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": "Axion 1.0\u5148\u4ee5\u6a21\u578b\u611f\u77e5\u7684\u6570\u636e\u6784\u9020\u5f3a\u5316\u72ec\u7acb\u63a8\u7406\uff0c\u518d\u7528\u81ea\u52a8\u53ef\u9a8c\u8bc1\u4efb\u52a1\u8bad\u7ec3\u5de5\u5177\u63a8\u7406\uff0c\u6700\u540e\u901a\u8fc7\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u957f\u7a0b\u4ea4\u4e92\uff0c\u5e76\u5f00\u653e\u5b8c\u6574\u8bad\u7ec3\u6d41\u7a0b\u3002", "why_notable": "\u591a\u4e2a\u667a\u80fd\u4f53\u57fa\u51c6\u4e0a\u53ef\u4e0e\u9886\u5148\u5546\u4e1a\u6a21\u578b\u7ade\u4e89\uff0c\u4e14\u5f00\u653e\u6570\u636e\u6784\u9020\u3001\u9a8c\u8bc1\u4e0e\u8bad\u7ec3\u4ee3\u7801\uff0c\u4e3a\u590d\u73b0\u548c\u6269\u5c55\u5f3a\u667a\u80fd\u4f53\u63d0\u4f9b\u7b80\u6d01\u8def\u5f84\u3002"}, {"abstract": "LLM agents compact long histories to fit their context windows, but the compacted context must still carry the operating rules that govern later actions. Prior work shows that violations rise after compaction, but measures compliance outside a complete agent harness and does not identify where each violation comes from. We introduce ARCBench(Agent Rule Compliance Benchmark), a configurable benchmark built on the open-source pi agent harness. Its tool-calling agent loop lets us measure rule compliance from actions taken during execution, bringing the evaluation closer to deployed agent workflows. Using ARCBench, we examine where violations after compaction come from, and how different compaction configurations and adversarial settings change their sources. We find that compaction rarely deletes the rule: most violations after compaction occur while the rule is still in the compacted history, with the agent treating a later request as permission, ignoring the rule, and proceeding anyway. Where violations come from depends on the configuration: how the rule is delivered decides whether the agent would break it even without compaction, while the compaction strategy and budget decide whether the rule survives. The strongest compactor-targeted attack more than doubles violations by corrupting the rule in the summary and changing how the agents behave, whereas the strongest defense restores the rule in most summary but still violates. Finally, retaining a rule does not guarantee compliance: compacted runs that retain the rule violate more than twice as often as runs with the full history.", "arxiv_id": "2611.03223", "arxiv_url": "https://arxiv.org/abs/2611.03223", "authors": ["Yiwei Zha", "Qingyu Meng", "Herbert Bos", "Min Chen"], "brief": "\u63d0\u51fa\u57fa\u4e8e\u5f00\u6e90 pi \u667a\u80fd\u4f53\u6846\u67b6\u7684 ARCBench\uff0c\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u6267\u884c\u4e2d\u7684\u5b9e\u9645\u52a8\u4f5c\u8bc4\u4f30\u89c4\u5219\u9075\u5b88\u60c5\u51b5\uff0c\u5e76\u5206\u6790\u4e0a\u4e0b\u6587\u538b\u7f29\u914d\u7f6e\u4e0e\u5bf9\u6297\u653b\u51fb\u5982\u4f55\u5f71\u54cd\u8fdd\u89c4\u6765\u6e90\u3002", "categories": ["cs.CR", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03223", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["ARCBench \u5728\u5de5\u5177\u8c03\u7528\u5faa\u73af\u4e2d\u6d4b\u91cf\u5b9e\u9645\u8fdd\u89c4\u884c\u4e3a", "\u4fdd\u7559\u89c4\u5219\u7684\u538b\u7f29\u8fd0\u884c\uff0c\u8fdd\u89c4\u7387\u4ecd\u8d85\u5b8c\u6574\u5386\u53f2\u4e24\u500d", "\u6700\u5f3a\u538b\u7f29\u5668\u5b9a\u5411\u653b\u51fb\u7be1\u6539\u6458\u8981\u89c4\u5219\uff0c\u4f7f\u8fdd\u89c4\u7ffb\u500d\u4ee5\u4e0a"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u4e0a\u4e0b\u6587\u538b\u7f29", "\u89c4\u5219\u9075\u5faa", "\u5bf9\u6297\u653b\u51fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03223v1", "published_at": "2026-11-02", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Do Agents Still Follow the Rules? Benchmarking Rule Compliance under Agent Context Compaction", "tldr": "\u667a\u80fd\u4f53\u538b\u7f29\u5386\u53f2\u540e\uff0c\u5373\u4f7f\u89c4\u5219\u4ecd\u88ab\u4fdd\u7559\uff0c\u8fdd\u89c4\u7387\u4e5f\u8d85\u8fc7\u5b8c\u6574\u5386\u53f2\u7684\u4e24\u500d\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51fa\u57fa\u4e8e\u5f00\u6e90 pi \u667a\u80fd\u4f53\u6846\u67b6\u7684 ARCBench\uff0c\u901a\u8fc7\u5de5\u5177\u8c03\u7528\u6267\u884c\u4e2d\u7684\u5b9e\u9645\u52a8\u4f5c\u8bc4\u4f30\u89c4\u5219\u9075\u5b88\u60c5\u51b5\uff0c\u5e76\u5206\u6790\u4e0a\u4e0b\u6587\u538b\u7f29\u914d\u7f6e\u4e0e\u5bf9\u6297\u653b\u51fb\u5982\u4f55\u5f71\u54cd\u8fdd\u89c4\u6765\u6e90\u3002", "why_notable": "\u5c06\u89c4\u5219\u8bc4\u4f30\u63a8\u8fdb\u5230\u771f\u5b9e\u6267\u884c\u6d41\u7a0b\uff0c\u5e76\u63ed\u793a\u89c4\u5219\u4fdd\u7559\u4e0d\u7b49\u4e8e\u89c4\u5219\u9075\u5b88\uff0c\u4e3a\u667a\u80fd\u4f53\u8bb0\u5fc6\u538b\u7f29\u4e0e\u5b89\u5168\u9632\u5fa1\u63d0\u4f9b\u66f4\u51c6\u786e\u7684\u8bca\u65ad\u4f9d\u636e\u3002"}, {"abstract": "Large language model agents increasingly take consequential actions in digital and physical environments, where safety risks may emerge only after multiple interaction steps. This has motivated world-model-driven predictive safety guardrails, which anticipate future consequences before execution. However, existing evaluations largely focus on end-to-end safety outcomes, leaving unclear whether safety gains arise from reliable prediction and faithful use of predicted risks. In this work, we systematically diagnose the prediction-to-action pipeline along three dimensions: how world-model predictions are integrated into decision making, whether the predictions themselves are reliable, and whether their content is faithfully used. Across seven policy models and two safety environments, we find that stronger prediction involvement does not yield monotonic safety gains and can reduce task completion while substantially increasing inference cost. We further find that world-model predictions remain insufficiently reliable, especially over longer horizons, where safety prediction degrades substantially relative to near-term forecasting. Finally, we find that safety gains can persist even under corrupted predictions, while locally verified predictions still leave subsequent safety violations, showing that predictive content is not faithfully incorporated into the decision process. Together, these findings expose a fundamental prediction-to-action gap in current predictive guardrails: producing more or seemingly accurate foresight is insufficient unless that foresight is both reliable and faithfully translated into safer decisions.", "arxiv_id": "2611.02815", "arxiv_url": "https://arxiv.org/abs/2611.02815", "authors": ["Weixiang Zhao", "Zhihao Liu", "Guancheng Li", "Yanyan Zhao", "Bing Qin", "Ting Liu"], "brief": "\u7814\u7a76\u7cfb\u7edf\u8bca\u65ad\u4e16\u754c\u6a21\u578b\u9a71\u52a8\u7684\u9884\u6d4b\u5f0f\u5b89\u5168\u62a4\u680f\uff0c\u56f4\u7ed5\u9884\u6d4b\u5982\u4f55\u53c2\u4e0e\u51b3\u7b56\u3001\u9884\u6d4b\u662f\u5426\u53ef\u9760\uff0c\u4ee5\u53ca\u98ce\u9669\u4fe1\u606f\u662f\u5426\u88ab\u5fe0\u5b9e\u7528\u4e8e\u884c\u52a8\u4e09\u4e2a\u7ef4\u5ea6\u5f00\u5c55\u5b9e\u9a8c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02815", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u8986\u76d67\u4e2a\u7b56\u7565\u6a21\u578b\u30012\u4e2a\u5b89\u5168\u73af\u5883", "\u52a0\u5f3a\u9884\u6d4b\u4ecb\u5165\u672a\u6301\u7eed\u63d0\u5347\u5b89\u5168\uff0c\u4e14\u589e\u52a0\u63a8\u7406\u6210\u672c", "\u957f\u7a0b\u9884\u6d4b\u53ef\u9760\u6027\u4e0b\u964d\uff0c\u635f\u574f\u9884\u6d4b\u4ecd\u53ef\u80fd\u4fdd\u7559\u5b89\u5168\u6536\u76ca"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u4e16\u754c\u6a21\u578b", "\u5b89\u5168\u62a4\u680f", "\u53ef\u9760\u6027\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02815v1", "published_at": "2026-11-02", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "Predictive Safety Guardrails Do Not Always Make LLM Agents Safer", "tldr": "\u9884\u6d4b\u5f0f\u62a4\u680f\u5e76\u975e\u8d8a\u5f3a\u8d8a\u5b89\u5168\uff0c\u4e16\u754c\u6a21\u578b\u9884\u5224\u4e0e\u667a\u80fd\u4f53\u884c\u52a8\u4e4b\u95f4\u5b58\u5728\u8131\u8282\u3002", "upvotes": 0, "what_it_is": "\u7814\u7a76\u7cfb\u7edf\u8bca\u65ad\u4e16\u754c\u6a21\u578b\u9a71\u52a8\u7684\u9884\u6d4b\u5f0f\u5b89\u5168\u62a4\u680f\uff0c\u56f4\u7ed5\u9884\u6d4b\u5982\u4f55\u53c2\u4e0e\u51b3\u7b56\u3001\u9884\u6d4b\u662f\u5426\u53ef\u9760\uff0c\u4ee5\u53ca\u98ce\u9669\u4fe1\u606f\u662f\u5426\u88ab\u5fe0\u5b9e\u7528\u4e8e\u884c\u52a8\u4e09\u4e2a\u7ef4\u5ea6\u5f00\u5c55\u5b9e\u9a8c\u3002", "why_notable": "\u5b83\u63ed\u793a\u4ec5\u770b\u6700\u7ec8\u5b89\u5168\u8868\u73b0\u53ef\u80fd\u8bef\u5224\u62a4\u680f\u673a\u5236\u7684\u6709\u6548\u6027\uff0c\u63a8\u52a8\u8bc4\u4f30\u4ece\u7ed3\u679c\u6307\u6807\u8f6c\u5411\u9884\u6d4b\u53ef\u9760\u6027\u4e0e\u51b3\u7b56\u5fe0\u5b9e\u6027\u3002"}, {"abstract": "Robot-use Agents (RUAs) have shown promising zero-shot manipulation capabilities, but reliance on frontier, proprietary models limits research into further training. To democratize RUA research, we introduce uni-robot-agent, a unified harness for competitive open-weight robot use that supports further training. Without privileged inputs, an out-of-the-box Qwen3.8-Flash-Next achieves a RoboDojo Score of 31.39, surpassing the published GPT-6 Astra-RoboProbe result of 28.97 and many VLA/WAM baselines, and performs competitively on 19 real-world tasks. Our analysis across model generations, families, and sizes links effective robot use to four general capabilities, suggesting that future RUA training should develop them jointly.", "arxiv_id": "2611.01560", "arxiv_url": "https://arxiv.org/abs/2611.01560", "authors": ["Jiarui Yuan", "Yuxin Zuo", "Xiaoyu Huang", "Wenbo Zhang", "Kwanyoung Park", "Junlin Yang", "Tianxiang Zhang", "Ruoqu Chen", "Yutao Ouyang", "Bingxiang He", "Xingtai Lv", "Hongjin Wu", "Jiajun Liu", "Jiahao Zhao", "Tianwei Luo", "Haozhan Li", "Cheng Qian", "Jiaxin Ge", "Huan-ang Gao", "Kaisen Yang", "Jiaqi Deng", "Qixin Xu", "Siqiao Huang", "Bowen Zhou", "Mengdi Xu", "Zhiyuan Liu", "Pieter Abbeel", "Ning Ding"], "brief": "\u63d0\u51fa uni-robot-agent\uff0c\u7edf\u4e00\u5f00\u653e\u6743\u91cd\u6a21\u578b\u7684\u673a\u5668\u4eba\u4f7f\u7528\u63a5\u53e3\u5e76\u652f\u6301\u540e\u7eed\u8bad\u7ec3\uff1b\u901a\u8fc7\u4eff\u771f\u8bc4\u6d4b\u4e0e\u771f\u5b9e\u4efb\u52a1\u9a8c\u8bc1\u80fd\u529b\uff0c\u518d\u8de8\u6a21\u578b\u5206\u6790\u6709\u6548\u64cd\u63a7\u6240\u9700\u7684\u901a\u7528\u80fd\u529b\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/Open-RUA/uni-robot-agent", "github_stars": 100, "hf_url": "https://huggingface.co/papers/2611.01560", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["Qwen3.8-Flash-Next \u65e0\u7279\u6743\u8f93\u5165\u83b731.39\u5206", "\u8d85\u8fc7 GPT-6 \u5df2\u516c\u5e03\u768428.97\u5206\uff0c\u5b9e\u6d4b19\u9879\u4efb\u52a1", "\u8de8\u4ee3\u9645\u3001\u5bb6\u65cf\u4e0e\u89c4\u6a21\u5206\u6790\uff0c\u5f52\u7eb3\u56db\u9879\u901a\u7528\u80fd\u529b"], "keywords": ["\u673a\u5668\u4eba\u667a\u80fd\u4f53", "\u5f00\u653e\u6743\u91cd\u6a21\u578b", "\u96f6\u6837\u672c\u64cd\u63a7"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01560v1", "published_at": "2026-11-01", "score": 0.342, "selected_reasons": ["HF trending (42\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01560.png", "title": "Democratizing Robot-Use Agents: A Unified Harness with Open Models", "tldr": "\u7edf\u4e00\u673a\u5668\u4eba\u667a\u80fd\u4f53\u6846\u67b6\u8ba9\u5f00\u653e\u6743\u91cd\u6a21\u578b\u5b9e\u73b0\u6709\u7ade\u4e89\u529b\u7684\u96f6\u6837\u672c\u64cd\u63a7", "upvotes": 42, "what_it_is": "\u63d0\u51fa uni-robot-agent\uff0c\u7edf\u4e00\u5f00\u653e\u6743\u91cd\u6a21\u578b\u7684\u673a\u5668\u4eba\u4f7f\u7528\u63a5\u53e3\u5e76\u652f\u6301\u540e\u7eed\u8bad\u7ec3\uff1b\u901a\u8fc7\u4eff\u771f\u8bc4\u6d4b\u4e0e\u771f\u5b9e\u4efb\u52a1\u9a8c\u8bc1\u80fd\u529b\uff0c\u518d\u8de8\u6a21\u578b\u5206\u6790\u6709\u6548\u64cd\u63a7\u6240\u9700\u7684\u901a\u7528\u80fd\u529b\u3002", "why_notable": "\u5c06\u6709\u7ade\u4e89\u529b\u7684\u673a\u5668\u4eba\u64cd\u63a7\u4ece\u4e13\u6709\u6a21\u578b\u6269\u5c55\u5230\u53ef\u8bad\u7ec3\u7684\u5f00\u653e\u6743\u91cd\u6a21\u578b\uff0c\u4e3a\u590d\u73b0\u3001\u8fdb\u4e00\u6b65\u8bad\u7ec3\u53ca\u901a\u7528\u80fd\u529b\u8054\u5408\u4f18\u5316\u63d0\u4f9b\u7814\u7a76\u5165\u53e3\u3002"}, {"abstract": "Scaling computer-use agents from individual actions to complex software work requires experience that connects decisions to complete outcomes. We present NorthCUA, an integrated system for turbocharging computer-use agents through experience at scale. Its Experience Flywheel supplies diverse executable tasks to the NorthCUA Harness, which sustains long interactions, records decisions, and checks task outcomes. The Flywheel uses these records to curate verified trajectories. For unsolved tasks, recursive self-improvement evolves reusable skills and preserves verified milestones so later attempts build on earlier progress. Staged Learning combines this experience with grounding data from the Flywheel to develop GUI competence through mid-training and long-horizon supervised fine-tuning. The policy then learns from fresh attempts in the same Harness through joint desktop-web reinforcement learning, closing the loop between experience production and policy improvement. The resulting Nano, Mini, and Pro family achieves state-of-the-art results among open-source models across GUI grounding, desktop execution, and Web interaction under the reported evaluation settings. For more responsive Web workflows, NorthCUA-Ultrafast pairs direct action selection with open-ended generation on pre-RL Nano, offering a measured quality-latency tradeoff. Together, these advances establish NorthCUA as a high-performing model family and a reusable foundation for agents that carry complex software work from intent to completion.", "arxiv_id": "2611.02102", "arxiv_url": "https://arxiv.org/abs/2611.02102", "authors": ["Chaoyun Zhang", "Bingxuan Li", "Pinxue Guo", "Yangfan Gao", "Zikun Cai", "Tianci Xie", "Hui Li", "Yuqi Huang", "Yifei Cao", "Bo Mao", "Tian Tang", "Qichang Zheng", "Tongtong Liu", "Xiaoxing Wang", "Jinxiu Liu", "Lizhi Lin", "Zhou Shao", "Maosen Zhou", "Miao Zheng", "Shuo Zhang", "Yangji He", "Kepeng Lei", "Ning Zhao", "Wei Shen", "Zhenjiang Jin", "Xinyue Zhang", "Peng Sun", "Zhenhua Han", "Rui Zheng", "Hang Yan"], "brief": "NorthCUA\u6784\u5efa\u4efb\u52a1\u751f\u6210\u3001\u957f\u7a0b\u6267\u884c\u4e0e\u7ed3\u679c\u9a8c\u8bc1\u95ed\u73af\uff0c\u79ef\u7d2f\u53ef\u9760\u8f68\u8ff9\u548c\u53ef\u590d\u7528\u6280\u80fd\uff0c\u518d\u4ee5\u5206\u9636\u6bb5\u8bad\u7ec3\u53ca\u684c\u9762\u7f51\u9875\u8054\u5408\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u7b56\u7565\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/beipo-ai/NorthCUA", "github_stars": 37, "hf_url": "https://huggingface.co/papers/2611.02102", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["Experience Flywheel\u7b5b\u9009\u7ecf\u9a8c\u8bc1\u7684\u6267\u884c\u8f68\u8ff9", "\u9012\u5f52\u81ea\u6211\u6539\u8fdb\u590d\u7528\u6280\u80fd\uff0c\u4fdd\u7559\u5df2\u9a8c\u8bc1\u91cc\u7a0b\u7891", "Nano\u3001Mini\u3001Pro\u5728\u62a5\u544a\u8bc4\u6d4b\u4e2d\u9886\u5148\u5f00\u6e90\u6a21\u578b"], "keywords": ["\u8ba1\u7b97\u673a\u64cd\u4f5c\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u6211\u6539\u8fdb", "\u56fe\u5f62\u754c\u9762"], "num_comments": 1, "on_hf": true, "organization": "beipo-ai", "pdf_url": "https://arxiv.org/pdf/2611.02102v1", "published_at": "2026-11-01", "score": 0.325, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02102.png", "title": "NorthCUA Technical Report: Turbocharging Computer-Use Agents through Experience at Scale", "tldr": "\u901a\u8fc7\u53ef\u9a8c\u8bc1\u7ecf\u9a8c\u95ed\u73af\u4e0e\u684c\u9762\u7f51\u9875\u8054\u5408\u5f3a\u5316\u5b66\u4e60\uff0c\u63d0\u5347\u667a\u80fd\u4f53\u5b8c\u6210\u590d\u6742\u8f6f\u4ef6\u4efb\u52a1\u7684\u80fd\u529b\u3002", "upvotes": 30, "what_it_is": "NorthCUA\u6784\u5efa\u4efb\u52a1\u751f\u6210\u3001\u957f\u7a0b\u6267\u884c\u4e0e\u7ed3\u679c\u9a8c\u8bc1\u95ed\u73af\uff0c\u79ef\u7d2f\u53ef\u9760\u8f68\u8ff9\u548c\u53ef\u590d\u7528\u6280\u80fd\uff0c\u518d\u4ee5\u5206\u9636\u6bb5\u8bad\u7ec3\u53ca\u684c\u9762\u7f51\u9875\u8054\u5408\u5f3a\u5316\u5b66\u4e60\u63d0\u5347\u7b56\u7565\u3002", "why_notable": "\u628a\u7ecf\u9a8c\u751f\u4ea7\u4e0e\u7b56\u7565\u5b66\u4e60\u8fde\u6210\u53ef\u590d\u7528\u95ed\u73af\uff0c\u8986\u76d6\u754c\u9762\u5b9a\u4f4d\u3001\u684c\u9762\u6267\u884c\u548c\u7f51\u9875\u4ea4\u4e92\uff0c\u4e3a\u667a\u80fd\u4f53\u5b8c\u6210\u957f\u7a0b\u8f6f\u4ef6\u5de5\u4f5c\u63d0\u4f9b\u7cfb\u7edf\u5316\u8def\u5f84\u3002"}, {"abstract": "Long-horizon tasks require large language model (LLM) agents to coordinate interdependent actions, a capability central to automating complex workflows. Stepwise group-based reinforcement learning provides finer credit than trajectory-level supervision, but reliable comparisons must account for differences in interaction history. Enforcing this consistency within the limited rollouts of each task can leave insufficient support for estimating action preferences. We propose Beyond-Local Policy Optimization (BLPO), which estimates task-progress advantages from experience shared across tasks and training updates. We summarize trajectory prefixes into task-progress states and abstract actions by their function, allowing corresponding decisions from different tasks to contribute to shared estimates. To control bias and noise from heterogeneous tasks, we accumulate context-relative returns in a global memory with balanced aggregation and reliability weighting. These global advantages complement local comparisons over normalized actions and trajectory-level credit without a learned critic or additional rollouts. Experiments on ALFWorld and WebShop with 1.5B and 7B policies show improved task success over the evaluated baselines under matched training budgets. Further analyses show faster learning and shorter trajectories with little computational overhead.", "arxiv_id": "2611.03005", "arxiv_url": "https://arxiv.org/abs/2611.03005", "authors": ["Xuanren Chen", "Chongyang Tao", "Wenpeng Hu", "Yong Wang", "Bo Deng", "Xinlei Zheng", "Shuai Ma"], "brief": "\u63d0\u51faBLPO\uff0c\u5c06\u8f68\u8ff9\u524d\u7f00\u5f52\u7eb3\u4e3a\u4efb\u52a1\u8fdb\u5ea6\u72b6\u6001\uff0c\u5e76\u6309\u529f\u80fd\u62bd\u8c61\u52a8\u4f5c\uff0c\u8de8\u4efb\u52a1\u4e0e\u8bad\u7ec3\u8f6e\u6b21\u4f30\u8ba1\u4f18\u52bf\u3002\u7528\u5168\u5c40\u8bb0\u5fc6\u6c47\u603b\u56de\u62a5\uff0c\u8865\u5145\u5c40\u90e8\u6bd4\u8f83\u548c\u8f68\u8ff9\u7ea7\u53cd\u9988\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03005", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["BLPO\u4ee5\u8fdb\u5ea6\u72b6\u6001\u548c\u529f\u80fd\u52a8\u4f5c\u5bf9\u9f50\u8de8\u4efb\u52a1\u51b3\u7b56", "\u5168\u5c40\u8bb0\u5fc6\u91c7\u7528\u5747\u8861\u805a\u5408\u4e0e\u53ef\u9760\u6027\u52a0\u6743\uff0c\u65e0\u9700\u5b66\u4e60\u8bc4\u8bba\u5668\u6216\u989d\u5916\u91c7\u6837", "\u5728ALFWorld\u3001WebShop\u4e0a\u6d4b\u8bd51.5B\u4e0e7B\u7b56\u7565"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03005v1", "published_at": "2026-11-02", "score": 0.325, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "BLPO: Beyond-Local Policy Optimization for Long-Horizon LLM Agents", "tldr": "\u901a\u8fc7\u8de8\u4efb\u52a1\u5171\u4eab\u8fdb\u5ea6\u4e0e\u52a8\u4f5c\u7ecf\u9a8c\uff0c\u63d0\u5347\u957f\u7a0b\u667a\u80fd\u4f53\u8bad\u7ec3\u6548\u7387\u4e0e\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 0, "what_it_is": "\u63d0\u51faBLPO\uff0c\u5c06\u8f68\u8ff9\u524d\u7f00\u5f52\u7eb3\u4e3a\u4efb\u52a1\u8fdb\u5ea6\u72b6\u6001\uff0c\u5e76\u6309\u529f\u80fd\u62bd\u8c61\u52a8\u4f5c\uff0c\u8de8\u4efb\u52a1\u4e0e\u8bad\u7ec3\u8f6e\u6b21\u4f30\u8ba1\u4f18\u52bf\u3002\u7528\u5168\u5c40\u8bb0\u5fc6\u6c47\u603b\u56de\u62a5\uff0c\u8865\u5145\u5c40\u90e8\u6bd4\u8f83\u548c\u8f68\u8ff9\u7ea7\u53cd\u9988\u3002", "why_notable": "\u7f13\u89e3\u5355\u4efb\u52a1\u91c7\u6837\u4e0d\u8db3\u5bfc\u81f4\u7684\u52a8\u4f5c\u504f\u597d\u4f30\u8ba1\u56f0\u96be\uff1b\u76f8\u540c\u8bad\u7ec3\u9884\u7b97\u4e0b\u63d0\u9ad8\u6210\u529f\u7387\uff0c\u5e76\u4ee5\u8f83\u4f4e\u8ba1\u7b97\u5f00\u9500\u5b9e\u73b0\u66f4\u5feb\u5b66\u4e60\u548c\u66f4\u77ed\u8f68\u8ff9\u3002"}, {"abstract": "Traditional image cropping assumes the photograph already contains the composition worth keeping, and asks only where to crop. A full 360$^{\\circ}$ scene offers no such guarantee: the viewing direction in a scene has to be discovered before anything can be framed. We present PhotoGuider, a measure-then-frame method that answers both questions with compact learned scorers over one shared set of composition-aware features. The designed features are extracted using foundation and task-specific vision models and structured into four photographic tokens: Subject, Composition, Aesthetics, and Integrity. Our MLLM explainer is fine-tuned to generate composition-related explanations conditioned on images and measured token assessments. To our knowledge, PhotoGuider is the first method to combine explicit composition-based direction selection in 360$^{\\circ}$ panoramas with refined framing, camera-parameter output for native re-rendering, and measurement-conditioned explanations. On two standard 2D cropping benchmarks, PhotoGuider achieves the highest average mIoU performance against ground-truth crops. In a blind ranking study, 120 participants ranked three cropping methods over 100 panoramic scenes from the public Poly Haven HDRI library, placing our framings first in 53.2% of cases, against 27.3% and 19.5% for two strong alternatives. Project page: https://ntuneillee.github.io/research/photoguider/", "arxiv_id": "2611.02897", "arxiv_url": "https://arxiv.org/abs/2611.02897", "authors": ["Yuan-Kang Lee", "Kuan-Lin Chen", "Chia-Che Chang", "Yu-Lun Liu"], "brief": "PhotoGuider\u5148\u6d4b\u91cf\u6784\u56fe\u518d\u53d6\u666f\uff0c\u7528\u89c6\u89c9\u6a21\u578b\u63d0\u53d6\u56db\u7c7b\u6444\u5f71\u7279\u5f81\uff0c\u7531\u8f7b\u91cf\u8bc4\u5206\u5668\u9009\u62e9\u65b9\u5411\u4e0e\u8fb9\u6846\uff0c\u5e76\u8ba9\u5fae\u8c03\u591a\u6a21\u6001\u6a21\u578b\u4f9d\u636e\u6d4b\u91cf\u7ed3\u679c\u89e3\u91ca\u53d6\u666f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/NTUneillee/PhotoGuider", "github_stars": 37, "hf_url": "https://huggingface.co/papers/2611.02897", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5171\u4eab\u4e3b\u4f53\u3001\u6784\u56fe\u3001\u7f8e\u5b66\u3001\u5b8c\u6574\u6027\u56db\u7c7b\u6444\u5f71\u7279\u5f81", "\u4e24\u4e2a\u6807\u51c6\u4e8c\u7ef4\u88c1\u526a\u57fa\u51c6\u4e0a\u5e73\u5747mIoU\u6700\u9ad8", "120\u4eba\u76f2\u8bc4100\u4e2a\u5168\u666f\u573a\u666f\uff0c\u9996\u9009\u738753.2%"], "keywords": ["\u56fe\u50cf\u88c1\u526a", "\u5168\u666f\u53d6\u666f", "\u591a\u6a21\u6001\u6a21\u578b", "\u53ef\u89e3\u91ca\u6027"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02897v1", "published_at": "2026-11-02", "score": 0.3, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02897.png", "title": "PhotoGuider: Composition-Aware Cropping and 360$^{\\circ}$ View Framing with Explainable Photographic Assessments", "tldr": "\u901a\u8fc7\u663e\u5f0f\u6784\u56fe\u8bc4\u5206\u9009\u62e9\u5168\u666f\u89c6\u89d2\u4e0e\u88c1\u526a\u8fb9\u6846\uff0c\u5e76\u751f\u6210\u53ef\u89e3\u91ca\u7684\u6444\u5f71\u5efa\u8bae\u3002", "upvotes": 30, "what_it_is": "PhotoGuider\u5148\u6d4b\u91cf\u6784\u56fe\u518d\u53d6\u666f\uff0c\u7528\u89c6\u89c9\u6a21\u578b\u63d0\u53d6\u56db\u7c7b\u6444\u5f71\u7279\u5f81\uff0c\u7531\u8f7b\u91cf\u8bc4\u5206\u5668\u9009\u62e9\u65b9\u5411\u4e0e\u8fb9\u6846\uff0c\u5e76\u8ba9\u5fae\u8c03\u591a\u6a21\u6001\u6a21\u578b\u4f9d\u636e\u6d4b\u91cf\u7ed3\u679c\u89e3\u91ca\u53d6\u666f\u3002", "why_notable": "\u5c06\u88c1\u526a\u6269\u5c55\u5230\u5168\u666f\u4e2d\u7684\u89c6\u89d2\u53d1\u73b0\uff0c\u5e76\u8f93\u51fa\u53ef\u4f9b\u91cd\u65b0\u6e32\u67d3\u7684\u76f8\u673a\u53c2\u6570\uff1b\u89e3\u91ca\u53d7\u6784\u56fe\u6d4b\u91cf\u7ea6\u675f\uff0c\u4f7f\u53d6\u666f\u5efa\u8bae\u66f4\u5177\u53ef\u6838\u67e5\u6027\u3002"}, {"abstract": "Few-step autoregressive video diffusion enables efficient generation, yet maintaining consistency over long rollouts remains challenging, especially when subjects or scenes reappear after going out of sight. Despite progress in fidelity and rollout robustness, existing distillation methods do not fully exploit richer historical information to constrain the student\u0027s current prediction. To address this gap, we introduce \\textbf{History Forcing}, a unified on-policy distillation framework that strengthens historical supervision for few-step autoregressive video generators. The framework uses the residual between teacher predictions with and without informative historical context to decouple this supervision. Such a historical context can be obtained using earlier generated chunks with less accumulated drift or a fixed-view teacher rollout that keeps the scene visible while the student looks away. The residual is then weighted and added to the score or velocity prediction used for distillation, forming a corrected target. By aligning the student with this corrected target through distillation, History Forcing incorporates long-range historical constraints into autoregressive generation. Our method achieves state-of-the-art performance among 1.3B models, with a VBench quality score of 85.07 for 15s video generation and a VBench-Long aggregate score of 79.82 for 60s generation. For out-of-sight world modeling, evaluations further demonstrate more plausible scene evolution and more consistent states when the camera returns, with Evolution Quality improving from 2.35 to 2.70 on PlayWorld and Object Consistency from 58.43 to 62.18 on MemoBench.", "arxiv_id": "2611.02782", "arxiv_url": "https://arxiv.org/abs/2611.02782", "authors": ["Hangyi Kuang", "Chengzhi Wang", "Yefei He", "Weijie Wang", "Yuke Zhao", "Zhuokun Chen", "Zisu Huang", "Yifan Yang", "Xiaoxuan He", "Feng Chen", "Bohan Zhuang"], "brief": "\u63d0\u51fa\u9762\u5411\u5c11\u6b65\u81ea\u56de\u5f52\u89c6\u9891\u751f\u6210\u5668\u7684\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u6846\u67b6\u3002\u5229\u7528\u6559\u5e08\u6709\u65e0\u5386\u53f2\u4e0a\u4e0b\u6587\u65f6\u7684\u9884\u6d4b\u6b8b\u5dee\uff0c\u52a0\u6743\u4fee\u6b63\u5206\u6570\u6216\u901f\u5ea6\u76ee\u6807\uff0c\u8ba9\u5b66\u751f\u5b66\u4e60\u957f\u7a0b\u5386\u53f2\u7ea6\u675f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/ziplab/History-Forcing", "github_stars": 27, "hf_url": "https://huggingface.co/papers/2611.02782", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["History Forcing\u7528\u5386\u53f2\u6761\u4ef6\u9884\u6d4b\u6b8b\u5dee\u4fee\u6b63\u84b8\u998f\u76ee\u6807", "1.3B\u6a21\u578b\uff1a15\u79d2VBench\u8fbe85.07\uff0c60\u79d2\u8fbe79.82", "MemoBench\u7269\u4f53\u4e00\u81f4\u6027\u4ece58.43\u5347\u81f362.18"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u77e5\u8bc6\u84b8\u998f", "\u4e16\u754c\u6a21\u578b", "\u957f\u7a0b\u4e00\u81f4\u6027"], "num_comments": 1, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2611.02782v1", "published_at": "2026-11-02", "score": 0.288, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02782.png", "title": "History Forcing: Distilling History-Dependent Continuations for Long-Horizon Video World Models", "tldr": "\u901a\u8fc7\u5386\u53f2\u6761\u4ef6\u6b8b\u5dee\u4fee\u6b63\u84b8\u998f\u76ee\u6807\uff0c\u63d0\u5347\u957f\u89c6\u9891\u751f\u6210\u4e0e\u79bb\u5f00\u89c6\u91ce\u540e\u573a\u666f\u7684\u4e00\u81f4\u6027\u3002", "upvotes": 7, "what_it_is": "\u63d0\u51fa\u9762\u5411\u5c11\u6b65\u81ea\u56de\u5f52\u89c6\u9891\u751f\u6210\u5668\u7684\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u6846\u67b6\u3002\u5229\u7528\u6559\u5e08\u6709\u65e0\u5386\u53f2\u4e0a\u4e0b\u6587\u65f6\u7684\u9884\u6d4b\u6b8b\u5dee\uff0c\u52a0\u6743\u4fee\u6b63\u5206\u6570\u6216\u901f\u5ea6\u76ee\u6807\uff0c\u8ba9\u5b66\u751f\u5b66\u4e60\u957f\u7a0b\u5386\u53f2\u7ea6\u675f\u3002", "why_notable": "\u5c06\u5386\u53f2\u4fe1\u606f\u663e\u5f0f\u6ce8\u5165\u5c11\u6b65\u751f\u6210\u7684\u84b8\u998f\u76ee\u6807\uff0c\u5728\u4fdd\u6301\u9ad8\u6548\u751f\u6210\u7684\u540c\u65f6\u6539\u5584\u957f\u7a0b\u4e00\u81f4\u6027\uff0c\u5c24\u5176\u6709\u52a9\u4e8e\u76f8\u673a\u8fd4\u56de\u540e\u6062\u590d\u53ef\u4fe1\u7684\u573a\u666f\u72b6\u6001\u3002"}, {"abstract": "Embedding models underpin virtually every modern AI system, from search engines to recommendation systems. Despite shared mathematical foundations, research on embedding models remains fragmented by modality: the communities develop largely in isolation, seldom exchanging insights. We argue that this fragmentation obscures a deeper convergence. Driven by contrastive learning, Transformer architectures, and a granularity shift, embedding research across modalities is converging toward a common set of principles, even as modality-specific challenges remain underexplored. To reason across this convergence without conflating it, we propose a framework of three progressively harder capabilities: coverage, comparability, and compositionality. Three paths toward unification satisfy these in turn: transformation broadens coverage, alignment enables comparability, and joint embedding, the terminus we advocate, aims at compositionality. This position paper traces the resulting evolution, providing the first unified, cross-cutting treatment of omnimodal embedding research.", "arxiv_id": "2611.00172", "arxiv_url": "https://arxiv.org/abs/2611.00172", "authors": ["Ziyin Zhang", "Yuyu Guo", "Ying Zhang", "Siqiao Xue", "Zihan Liao", "Jin Qin", "Wenjie Yang", "Siyuan Yang", "Shijie Li", "Cheng Chen", "Hao Wu", "Zhaoyang Zhu", "Ruipeng Li", "Zhaokun Jiang", "Lei Lei", "Rui Wang", "Hang Yu", "Rui Wang"], "brief": "\u8fd9\u662f\u4e00\u7bc7\u5168\u6a21\u6001\u5d4c\u5165\u7efc\u8ff0\u4e0e\u7acb\u573a\u8bba\u6587\uff0c\u4ee5\u8986\u76d6\u6027\u3001\u53ef\u6bd4\u6027\u3001\u7ec4\u5408\u6027\u4e09\u4e2a\u9012\u8fdb\u80fd\u529b\u7edf\u4e00\u5206\u6790\u4e0d\u540c\u6a21\u6001\u7814\u7a76\uff0c\u5e76\u5c06\u8f6c\u6362\u3001\u5bf9\u9f50\u548c\u8054\u5408\u5d4c\u5165\u5bf9\u5e94\u4e3a\u4e09\u6761\u6f14\u8fdb\u8def\u5f84\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/codefuse-ai/Awesome-Omnimodal-Embeddings", "github_stars": 19, "hf_url": "https://huggingface.co/papers/2611.00172", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u4e09\u5c42\u80fd\u529b\u6846\u67b6\uff1a\u8986\u76d6\u6027\u3001\u53ef\u6bd4\u6027\u3001\u7ec4\u5408\u6027", "\u8f6c\u6362\u6269\u5c55\u8986\u76d6\uff0c\u5bf9\u9f50\u652f\u6301\u6bd4\u8f83\uff0c\u8054\u5408\u5d4c\u5165\u8ffd\u6c42\u7ec4\u5408", "\u5bf9\u6bd4\u5b66\u4e60\u3001Transformer\u4e0e\u7c92\u5ea6\u8f6c\u53d8\u9a71\u52a8\u8de8\u6a21\u6001\u8d8b\u540c"], "keywords": ["\u591a\u6a21\u6001\u5b66\u4e60", "\u5d4c\u5165\u6a21\u578b", "\u5bf9\u6bd4\u5b66\u4e60", "\u8054\u5408\u8868\u793a"], "num_comments": 1, "on_hf": true, "organization": "CodeFuse AI", "pdf_url": "https://arxiv.org/pdf/2611.00172v1", "published_at": "2026-10-30", "score": 0.287, "selected_reasons": ["HF trending (22\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00172.png", "title": "From Fragmentation to Fusion: A Survey and Roadmap for Omnimodal Embeddings", "tldr": "\u4ee5\u4e09\u5c42\u80fd\u529b\u6846\u67b6\u68b3\u7406\u8de8\u6a21\u6001\u5d4c\u5165\u7814\u7a76\uff0c\u63d0\u51fa\u8d70\u5411\u5168\u6a21\u6001\u8054\u5408\u5d4c\u5165\u7684\u8def\u7ebf\u56fe\u3002", "upvotes": 22, "what_it_is": "\u8fd9\u662f\u4e00\u7bc7\u5168\u6a21\u6001\u5d4c\u5165\u7efc\u8ff0\u4e0e\u7acb\u573a\u8bba\u6587\uff0c\u4ee5\u8986\u76d6\u6027\u3001\u53ef\u6bd4\u6027\u3001\u7ec4\u5408\u6027\u4e09\u4e2a\u9012\u8fdb\u80fd\u529b\u7edf\u4e00\u5206\u6790\u4e0d\u540c\u6a21\u6001\u7814\u7a76\uff0c\u5e76\u5c06\u8f6c\u6362\u3001\u5bf9\u9f50\u548c\u8054\u5408\u5d4c\u5165\u5bf9\u5e94\u4e3a\u4e09\u6761\u6f14\u8fdb\u8def\u5f84\u3002", "why_notable": "\u4ef7\u503c\u5728\u4e8e\u4e3a\u5206\u6563\u7684\u6a21\u6001\u7814\u7a76\u63d0\u4f9b\u5171\u540c\u5206\u6790\u5750\u6807\uff0c\u540c\u65f6\u4fdd\u7559\u6a21\u6001\u7279\u6709\u96be\u70b9\uff0c\u5c06\u7edf\u4e00\u5d4c\u5165\u7684\u76ee\u6807\u4ece\u53ef\u6bd4\u8f83\u63a8\u8fdb\u5230\u53ef\u7ec4\u5408\u3002"}, {"abstract": "Tool-using language-model agents often execute actions that their domain policies forbid. We present LeanGuard, a runtime that checks every proposed tool call against a policy written in Lean4 before the call reaches the environment. Policies combine state predicates with scoped past-time temporal operators over the execution history, evaluation is fail-closed, and the decision procedure is proved equivalent to a LeanLTL semantics. A denied call can be corrected in two ways. With feedback, the agent receives the violated rule and a hint; with proof-guided repair, Lean metaprogramming searches for a nearby call that preserves the user\u0027s intent and proves that the policy admits it, without the model. On Tau-Bench with five Qwen models (0.8B-27B), unguarded agents execute at least 33 calls that the Lean policy forbids, while LeanGuard executes none; with feedback, task success does not change significantly. On DTap, LeanGuard reduces direct prompt-injection success from 57.9% to 5.9%, and in telecom, where benign tasks need no writes, benign success is unchanged. Feedback reduces repeated blocked calls and raises task success for four of five models over a bare denial. On replayed denials, repair proves an admissible edit for 88 of 252 denials caused by argument values, in a median of 2,ms.", "arxiv_id": "2611.02332", "arxiv_url": "https://arxiv.org/abs/2611.02332", "authors": ["Sreehari Sankar", "Debargha Ganguly", "Vikash Singh", "Mohsen Hariri", "Weicong Chen", "Yanyan Zhang", "Shouren Wang", "Wang Yang", "Chaoda Song", "Alexander Nemecek", "Osama Zafar", "Idan Davidovich", "Yuting Shao", "Kai Ye", "Biyao Zhang", "Xinpeng Li", "Joe Stubbs", "Erman Ayday", "Jing Ma", "Vipin Chaudhary"], "brief": "LeanGuard\u5728\u5de5\u5177\u8c03\u7528\u5230\u8fbe\u73af\u5883\u524d\uff0c\u7528Lean4\u7b56\u7565\u68c0\u67e5\u72b6\u6001\u4e0e\u5386\u53f2\uff0c\u68c0\u67e5\u5931\u8d25\u5373\u62d2\u7edd\u3002\u88ab\u62d2\u8c03\u7528\u53ef\u901a\u8fc7\u89c4\u5219\u53cd\u9988\u91cd\u8bd5\uff0c\u6216\u7531\u5143\u7f16\u7a0b\u641c\u7d22\u5e76\u8bc1\u660e\u5408\u89c4\u66ff\u4ee3\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/DebarghaG/LeanGuard", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.02332", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u51b3\u7b56\u7a0b\u5e8f\u88ab\u8bc1\u660e\u7b49\u4ef7\u4e8eLeanLTL\u8bed\u4e49", "Tau-Bench\u4e94\u4e2aQwen\u6a21\u578b\u7684\u8fdd\u89c4\u6267\u884c\u964d\u81f3\u96f6", "\u8bc1\u660e\u5f15\u5bfc\u4fee\u590d\u6210\u529f88/252\u6b21\uff0c\u4e2d\u4f4d\u8017\u65f62\u6beb\u79d2"], "keywords": ["\u667a\u80fd\u4f53\u5b89\u5168", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u5de5\u5177\u8c03\u7528", "\u63d0\u793a\u6ce8\u5165"], "num_comments": 2, "on_hf": true, "organization": "Case Western Reserve University", "pdf_url": "https://arxiv.org/pdf/2611.02332v1", "published_at": "2026-11-02", "score": 0.286, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02332.png", "title": "LEANGUARD: Lean-Verified Guardrails for Tool-Using Agents", "tldr": "\u7528Lean4\u5f62\u5f0f\u5316\u7b56\u7565\u9010\u6b21\u68c0\u67e5\u667a\u80fd\u4f53\u5de5\u5177\u8c03\u7528\uff0c\u963b\u6b62\u8fdd\u89c4\u5e76\u652f\u6301\u53ef\u8bc1\u660e\u4fee\u590d\u3002", "upvotes": 9, "what_it_is": "LeanGuard\u5728\u5de5\u5177\u8c03\u7528\u5230\u8fbe\u73af\u5883\u524d\uff0c\u7528Lean4\u7b56\u7565\u68c0\u67e5\u72b6\u6001\u4e0e\u5386\u53f2\uff0c\u68c0\u67e5\u5931\u8d25\u5373\u62d2\u7edd\u3002\u88ab\u62d2\u8c03\u7528\u53ef\u901a\u8fc7\u89c4\u5219\u53cd\u9988\u91cd\u8bd5\uff0c\u6216\u7531\u5143\u7f16\u7a0b\u641c\u7d22\u5e76\u8bc1\u660e\u5408\u89c4\u66ff\u4ee3\u3002", "why_notable": "\u5c06\u7b56\u7565\u6267\u884c\u4ece\u6a21\u578b\u81ea\u5f8b\u8f6c\u4e3a\u53ef\u9a8c\u8bc1\u7684\u8fd0\u884c\u65f6\u7ea6\u675f\uff1b\u76f4\u63a5\u63d0\u793a\u6ce8\u5165\u6210\u529f\u7387\u4ece57.9%\u964d\u81f35.9%\uff0c\u53cd\u9988\u6a21\u5f0f\u672a\u663e\u8457\u6539\u53d8\u4efb\u52a1\u6210\u529f\u7387\u3002"}, {"abstract": "As coding agents achieve increasingly high success rates on software engineering benchmarks, recent efforts have sought to increase task complexity through longer horizons and more extensive code modifications. However, real-world software development often spans multiple interdependent repositories, introducing additional challenges in dependency reasoning, change propagation, and interface consistency. Rather than further increasing complexity within individual repositories, we introduce CrossSWE, a benchmark for cross-repository joint development comprising 171 real-world instances spanning 165 repositories, 20 technical domains, and 13 programming languages. CrossSWE verifies the necessity of coordinated changes by testing whether partial repository modifications are insufficient to achieve the intended behavior. Our evaluation of five LLMs reveals substantial challenges, with the strongest model, GPT-6.1 Sol, achieving only 58.48% Pass@1. Furthermore, cross-repository inconsistencies emerge as the most prevalent failure mode (44.2%), highlighting the difficulty of maintaining consistency across interdependent repositories.", "arxiv_id": "2611.01484", "arxiv_url": "https://arxiv.org/abs/2611.01484", "authors": ["Silin Chen", "Yuling Shi", "Heng Lian", "Zihan Zhang", "Xiaodong Gu", "Haotian Lin", "Zhensu Sun"], "brief": "\u63d0\u51fa\u8de8\u4ed3\u5e93\u8054\u5408\u5f00\u53d1\u57fa\u51c6CrossSWE\uff0c\u6536\u96c6\u771f\u5b9e\u4efb\u52a1\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\uff1b\u901a\u8fc7\u9a8c\u8bc1\u4ec5\u4fee\u6539\u90e8\u5206\u4ed3\u5e93\u65e0\u6cd5\u5b9e\u73b0\u76ee\u6807\u884c\u4e3a\uff0c\u786e\u8ba4\u4efb\u52a1\u786e\u9700\u534f\u540c\u4fee\u6539\u3002", "categories": ["cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.01484", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["171\u4e2a\u771f\u5b9e\u4efb\u52a1\u8986\u76d6165\u4ed3\u5e93\u300120\u9886\u57df\u53ca13\u79cd\u8bed\u8a00", "\u8bc4\u6d4b5\u4e2a\u6a21\u578b\uff0cGPT-6.1 Sol\u7684Pass@1\u6700\u9ad8\u4e3a58.48%", "\u8de8\u4ed3\u5e93\u4e0d\u4e00\u81f4\u662f\u6700\u5e38\u89c1\u5931\u8d25\u6a21\u5f0f\uff0c\u536044.2%"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8de8\u4ed3\u5e93\u5f00\u53d1", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.01484v1", "published_at": "2026-11-01", "score": 0.285, "selected_reasons": ["HF trending (21\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.01484.png", "title": "CrossSWE: Benchmarking Cross-Repository Joint Development for Coding Agents", "tldr": "\u8de8\u4ed3\u5e93\u5f00\u53d1\u57fa\u51c6\u63ed\u793a\u7f16\u7801\u667a\u80fd\u4f53\u5728\u4f9d\u8d56\u63a8\u7406\u4e0e\u63a5\u53e3\u4e00\u81f4\u6027\u4e0a\u7684\u660e\u663e\u77ed\u677f\u3002", "upvotes": 21, "what_it_is": "\u63d0\u51fa\u8de8\u4ed3\u5e93\u8054\u5408\u5f00\u53d1\u57fa\u51c6CrossSWE\uff0c\u6536\u96c6\u771f\u5b9e\u4efb\u52a1\u8bc4\u6d4b\u7f16\u7801\u667a\u80fd\u4f53\uff1b\u901a\u8fc7\u9a8c\u8bc1\u4ec5\u4fee\u6539\u90e8\u5206\u4ed3\u5e93\u65e0\u6cd5\u5b9e\u73b0\u76ee\u6807\u884c\u4e3a\uff0c\u786e\u8ba4\u4efb\u52a1\u786e\u9700\u534f\u540c\u4fee\u6539\u3002", "why_notable": "\u5c06\u7f16\u7801\u8bc4\u6d4b\u4ece\u5355\u4ed3\u5e93\u6269\u5c55\u5230\u76f8\u4e92\u4f9d\u8d56\u7684\u591a\u4ed3\u5e93\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u5f00\u53d1\uff1b\u7ed3\u679c\u51f8\u663e\u534f\u540c\u4fee\u6539\u4e0e\u4e00\u81f4\u6027\u7ef4\u62a4\u4ecd\u662f\u5173\u952e\u74f6\u9888\u3002"}, {"abstract": "Retrieval-augmented generation (RAG) lets a large language model (LLM) answer questions by retrieving relevant passages from a large corpus. However, RAG struggles with multi-hop questions, which require chaining facts spread across several documents through intermediate entities that the question never mentions. Graph-based RAG methods retrieve once from the entities a question names and so rarely recover the full evidence chain. Iterative RAG methods recover it step by step, but their accuracy is limited by the many tasks they ask the LLM to perform, such as planning the sub-questions, deciding their dependencies, rewriting them as answers arrive, and keeping track of what is known. We propose DeFT-RAG, a RAG framework built on three components. First, DeFT-RAG generates one self-contained sub-question at a time from the original question and the sub-questions answered so far with their answers (QA pairs). Each sub-question names every entity it asks about, which removes the need to plan, track dependencies or rewrite, and lets the LLM focus on a single fine-grained task at a time. Second, DeFT-RAG moves the remaining LLM work outside the LLM: rule-based updates to a QA table that keeps track of what is known, and yes/no decisions made by a fine-tuned lightweight decision model. Third, DeFT-RAG caches the QA pairs and reuses an answer when a later question asks a sub-question with the same meaning. On MuSiQue, 2WikiMultiHopQA and HotpotQA, DeFT-RAG achieves the best accuracy among thirteen baselines with both gpt-4o-mini and Qwen3.6 as the backbone, while giving the LLM fewer input tokens than any other iterative method. With a QA cache shared across 1,000 MuSiQue questions, 23.1% of sub-questions are answered from the cache, which reduces LLM calls by 12.9% without lowering accuracy.", "arxiv_id": "2610.37826", "arxiv_url": "https://arxiv.org/abs/2610.37826", "authors": ["Dingyi Kang", "Bingzhe Li"], "brief": "DeFT-RAG\u9010\u6b65\u751f\u6210\u660e\u786e\u5305\u542b\u76f8\u5173\u5b9e\u4f53\u7684\u5b50\u95ee\u9898\uff0c\u4ee5\u5df2\u7b54\u95ee\u7b54\u5bf9\u63a8\u8fdb\u68c0\u7d22\u63a8\u7406\uff1b\u7528\u89c4\u5219\u7ef4\u62a4\u77e5\u8bc6\u8868\u3001\u8f7b\u91cf\u5fae\u8c03\u6a21\u578b\u505a\u5224\u65ad\uff0c\u5e76\u7f13\u5b58\u590d\u7528\u8bed\u4e49\u76f8\u540c\u7684\u7b54\u6848\u3002", "categories": ["cs.CL", "cs.AI", "cs.IR"], "github_repo": "https://github.com/Dingyi-Kang/DeFT-RAG", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2610.37826", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u81ea\u5305\u542b\u5b50\u95ee\u9898\u514d\u53bb\u4f9d\u8d56\u89c4\u5212\u4e0e\u52a8\u6001\u6539\u5199", "\u4e09\u4e2a\u6570\u636e\u96c6\u3001\u4e24\u79cd\u9aa8\u5e72\u5747\u4f18\u4e8e13\u4e2a\u57fa\u7ebf", "\u5343\u9898\u5171\u4eab\u7f13\u5b58\u547d\u4e2d23.1%\uff0c\u8c03\u7528\u51cf\u5c1112.9%"], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u591a\u8df3\u63a8\u7406", "\u95ee\u7b54\u7f13\u5b58"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.37826v2", "published_at": "2026-10-27", "score": 0.285, "selected_reasons": ["HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.37826.png", "title": "DeFT-RAG: Decomposing Multi-Hop Questions into Self-Contained Sub-Questions with Reusable Answers", "tldr": "\u901a\u8fc7\u81ea\u5305\u542b\u5b50\u95ee\u9898\u4e0e\u95ee\u7b54\u7f13\u5b58\uff0c\u63d0\u5347\u591a\u8df3\u68c0\u7d22\u95ee\u7b54\u51c6\u786e\u7387\u5e76\u51cf\u5c11\u6a21\u578b\u8c03\u7528\u3002", "upvotes": 9, "what_it_is": "DeFT-RAG\u9010\u6b65\u751f\u6210\u660e\u786e\u5305\u542b\u76f8\u5173\u5b9e\u4f53\u7684\u5b50\u95ee\u9898\uff0c\u4ee5\u5df2\u7b54\u95ee\u7b54\u5bf9\u63a8\u8fdb\u68c0\u7d22\u63a8\u7406\uff1b\u7528\u89c4\u5219\u7ef4\u62a4\u77e5\u8bc6\u8868\u3001\u8f7b\u91cf\u5fae\u8c03\u6a21\u578b\u505a\u5224\u65ad\uff0c\u5e76\u7f13\u5b58\u590d\u7528\u8bed\u4e49\u76f8\u540c\u7684\u7b54\u6848\u3002", "why_notable": "\u628a\u590d\u6742\u7684\u63a8\u7406\u7ba1\u7406\u62c6\u6210\u5355\u4e00\u751f\u6210\u4efb\u52a1\u4e0e\u5916\u90e8\u72b6\u6001\u7ef4\u62a4\uff0c\u540c\u65f6\u53d6\u5f97\u66f4\u9ad8\u51c6\u786e\u7387\u548c\u66f4\u4f4e\u8f93\u5165\u5f00\u9500\uff0c\u5c55\u793a\u4e86\u8de8\u95ee\u9898\u590d\u7528\u4e2d\u95f4\u7b54\u6848\u7684\u4ef7\u503c\u3002"}, {"abstract": "Computer programmers chain together the same reusable computational primitives, for example, conditional statements or loops, but in different orders to implement different algorithms. In contrast, existing language model architectures always execute their layers in the same order. We introduce Library of Layers (LoL), an architecture that dynamically orders its layers during inference to solve the problem at hand. LoL has a single hyperparameter, the size of its global library of transformer blocks, that allows it to transition seamlessly between parameter reuse and sparsity, generalizing the parameter-efficiency and FLOPs-efficiency tradeoffs of dense, depth-recurrent, and mixture of experts architectures in one unified family. We show that LoL achieves competitive performance with all three above baselines when pretrained on text data. On synthetic sudoku and maze data, we observe that the model employs distinct layer orderings to implement different solution strategies, and we can intervene on routing to force a model to apply a specific solution strategy to a problem instance. In a multilingual natural language setting, we find that LoL chooses different layer order patterns based on language and script. Similarly, we train LoL on safety data and fit probes to its router outputs, finding that these probes distinguish safe from unsafe text with high AUROC. LoL provides a path toward a future in which models dynamically compose their own computational graph, enabling more efficient and controllable reasoning.", "arxiv_id": "2611.03526", "arxiv_url": "https://arxiv.org/abs/2611.03526", "authors": ["Abdellah Rahmani", "Sean McLeish", "Ang Li", "Sanae Lotfi", "Pascal Frossard", "Micah Goldblum"], "brief": "LoL\u5c06Transformer\u5757\u7ec4\u7ec7\u6210\u5168\u5c40\u5c42\u5e93\uff0c\u63a8\u7406\u65f6\u901a\u8fc7\u8def\u7531\u52a8\u6001\u9009\u62e9\u6267\u884c\u987a\u5e8f\u3002\u4ec5\u8c03\u8282\u5c42\u5e93\u5927\u5c0f\uff0c\u5373\u53ef\u5728\u53c2\u6570\u590d\u7528\u4e0e\u7a00\u758f\u8ba1\u7b97\u4e4b\u95f4\u5207\u6362\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/arahmani1/library-of-layers", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2611.03526", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u6587\u672c\u9884\u8bad\u7ec3\u8868\u73b0\u53ef\u5ab2\u7f8e\u7a20\u5bc6\u3001\u6df1\u5ea6\u5faa\u73af\u548cMoE\u57fa\u7ebf", "\u6570\u72ec\u4e0e\u8ff7\u5bab\u5b9e\u9a8c\u4e2d\uff0c\u5e72\u9884\u8def\u7531\u53ef\u6307\u5b9a\u89e3\u9898\u7b56\u7565", "\u8def\u7531\u5448\u73b0\u8bed\u8a00\u4e0e\u6587\u5b57\u5dee\u5f02\uff0c\u5b89\u5168\u63a2\u9488\u53d6\u5f97\u9ad8AUROC"], "keywords": ["\u52a8\u6001\u8def\u7531", "\u53c2\u6570\u590d\u7528", "\u7a00\u758f\u8ba1\u7b97", "\u53ef\u63a7\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03526v1", "published_at": "2026-11-02", "score": 0.283, "selected_reasons": ["HF trending (8\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03526.png", "title": "Library of Layers (LoL): Adaptively Ordering Transformer Layers at Runtime", "tldr": "\u901a\u8fc7\u63a8\u7406\u65f6\u52a8\u6001\u7f16\u6392\u53ef\u590d\u7528\u5c42\uff0c\u8ba9\u8bed\u8a00\u6a21\u578b\u6309\u4efb\u52a1\u9009\u62e9\u8ba1\u7b97\u8def\u5f84\u4e0e\u89e3\u9898\u7b56\u7565\u3002", "upvotes": 8, "what_it_is": "LoL\u5c06Transformer\u5757\u7ec4\u7ec7\u6210\u5168\u5c40\u5c42\u5e93\uff0c\u63a8\u7406\u65f6\u901a\u8fc7\u8def\u7531\u52a8\u6001\u9009\u62e9\u6267\u884c\u987a\u5e8f\u3002\u4ec5\u8c03\u8282\u5c42\u5e93\u5927\u5c0f\uff0c\u5373\u53ef\u5728\u53c2\u6570\u590d\u7528\u4e0e\u7a00\u758f\u8ba1\u7b97\u4e4b\u95f4\u5207\u6362\u3002", "why_notable": "\u5b83\u5c06\u56fa\u5b9a\u5c42\u5e8f\u6539\u4e3a\u53ef\u7ec4\u5408\u7684\u8ba1\u7b97\u8def\u5f84\uff0c\u7edf\u4e00\u591a\u7c7b\u67b6\u6784\u7684\u6548\u7387\u6743\u8861\uff1b\u8def\u7531\u5e72\u9884\u8fd8\u80fd\u6539\u53d8\u89e3\u9898\u7b56\u7565\uff0c\u4e3a\u53ef\u63a7\u63a8\u7406\u63d0\u4f9b\u65b0\u65b9\u5411\u3002"}, {"abstract": "Predicting future physical states stands as a central challenge in embodied intelligence. Existing video world models leave 3D dynamics implicit, action-based formulations remain tied to specific robot configurations, and 3D motion prediction models use flow-only supervision, providing a limited learning signal for physical dynamics. To circumvent these limitations, we introduce \\method{}, a generative world model that jointly predicts future video and query-based 3D trajectories. By parameterizing 3D motion as continuous displacement tokens aligned with the video grid, a unified Mixture-of-Transformers (MoT) backbone jointly denoises both modalities under a rectified-flow objective. This formulation couples explicit geometric dynamics with visual evolution, effectively unlocking the physical commonsense embedded within pretrained video models. To empirically scale and validate this unified architecture, we train \\method{} on a heterogeneous mixture of 1.44 million object-level samples spanning simulated and real-world domains. We further introduce WorldFlowBench, comprising 1,678 evaluation samples from 11 data sources across simulated and real-world interactions, including spatial reasoning tasks. Across all three evaluation sets, WorldFlow achieves the lowest average displacement error (ADE) and final displacement error (FDE) among the evaluated learning-based methods. Notably, on the challenging SpatialCog set, WorldFlow achieves an ADE of 0.060 m, a 54.2\\% reduction compared with the strongest external baseline. It also reduces ADE and FDE by 55.9\\% and 68.5\\%, respectively, compared with its flow-only variant. Project page: https://worldflow-rbs.github.io/.", "arxiv_id": "2610.39278", "arxiv_url": "https://arxiv.org/abs/2610.39278", "authors": ["Yuhao Lu", "Jiongxu Chen", "Hexiang Wei", "Jiajin Wu", "Juelin Li", "Mingjian Liang", "Fan Yang", "Zhuowei Liang", "Zihao Liu", "Zhennan Wang", "Sheng Wang", "Lin Shao"], "brief": "\u63d0\u51fa\u751f\u6210\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u4e09\u7ef4\u8fd0\u52a8\u7f16\u7801\u4e3a\u4e0e\u89c6\u9891\u7f51\u683c\u5bf9\u9f50\u7684\u8fde\u7eed\u4f4d\u79fb\u4ee4\u724c\uff0c\u901a\u8fc7\u7edf\u4e00\u7684\u6df7\u5408 Transformer \u9aa8\u5e72\uff0c\u5728\u6574\u6d41\u6d41\u76ee\u6807\u4e0b\u8054\u5408\u53bb\u566a\u89c6\u9891\u4e0e\u8f68\u8ff9\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": "https://github.com/worldflow-rbs/worldflow", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2610.39278", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u4f7f\u7528144\u4e07\u6761\u8de8\u4eff\u771f\u4e0e\u771f\u5b9e\u57df\u7684\u7269\u4f53\u7ea7\u6837\u672c\u8bad\u7ec3\u3002", "WorldFlowBench\u542b1678\u6761\u6837\u672c\uff0c\u8986\u76d611\u4e2a\u6570\u636e\u6e90\u3002", "SpatialCog\u4e0aADE\u4e3a0.060\u7c73\uff0c\u6bd4\u6700\u5f3a\u5916\u90e8\u57fa\u7ebf\u4f4e54.2%\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u9884\u6d4b", "\u4e09\u7ef4\u8fd0\u52a8", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.39278v1", "published_at": "2026-10-29", "score": 0.279, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39278.png", "title": "WorldFlow: Joint Video and 3D Motion Prediction via Large-Scale Pretraining", "tldr": "\u8054\u5408\u9884\u6d4b\u672a\u6765\u89c6\u9891\u4e0e\u4e09\u7ef4\u8f68\u8ff9\uff0c\u8ba9\u9884\u8bad\u7ec3\u89c6\u9891\u6a21\u578b\u5b66\u5230\u663e\u5f0f\u7269\u7406\u52a8\u6001\u3002", "upvotes": 5, "what_it_is": "\u63d0\u51fa\u751f\u6210\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u4e09\u7ef4\u8fd0\u52a8\u7f16\u7801\u4e3a\u4e0e\u89c6\u9891\u7f51\u683c\u5bf9\u9f50\u7684\u8fde\u7eed\u4f4d\u79fb\u4ee4\u724c\uff0c\u901a\u8fc7\u7edf\u4e00\u7684\u6df7\u5408 Transformer \u9aa8\u5e72\uff0c\u5728\u6574\u6d41\u6d41\u76ee\u6807\u4e0b\u8054\u5408\u53bb\u566a\u89c6\u9891\u4e0e\u8f68\u8ff9\u3002", "why_notable": "\u5c06\u89c6\u9891\u4e2d\u7684\u89c6\u89c9\u6f14\u5316\u4e0e\u663e\u5f0f\u4e09\u7ef4\u52a8\u529b\u5b66\u7ed1\u5b9a\uff0c\u62d3\u5c55\u4e16\u754c\u6a21\u578b\u7684\u7a7a\u95f4\u9884\u6d4b\u80fd\u529b\uff1b\u76f8\u8f83\u4ec5\u7528\u8fd0\u52a8\u76d1\u7763\uff0c\u8054\u5408\u8bad\u7ec3\u663e\u8457\u964d\u4f4e\u8f68\u8ff9\u8bef\u5dee\u3002"}, {"abstract": "Multimodal large language models can recognize visual content yet struggle to reason reliably over it across multiple steps. In counting, a model may see all objects but lose track of which ones it has counted. We argue that such failures, commonly attributed to perception, reveal a reference gap: the failure to bind language to the relevant visual entities, regions, or locations. Motivated by the theory of visual routines, we test whether external references such as numbering can narrow this gap. We introduce ReGap-Bench, a paired benchmark of five visual reasoning tasks in which the scene, question, and answer are fixed and only the reference varies. Results show that task-matched references improve accuracy by up to 25\\%, while mismatched references provide little benefit or even hurt performance. These findings identify the reference gap as a bottleneck distinct from visual perception and show that constructing task-appropriate visual references can serve as a training-free visual skill for improving multimodal reasoning.", "arxiv_id": "2610.39419", "arxiv_url": "https://arxiv.org/abs/2610.39419", "authors": ["Guizhen Chen", "Weiwen Xu", "Wotao Yin", "Anh Tuan Luu", "Hou Pong Chan"], "brief": "\u7814\u7a76\u5c06\u8bed\u8a00\u4e0e\u89c6\u89c9\u5b9e\u4f53\u7ed1\u5b9a\u5931\u8d25\u5b9a\u4e49\u4e3a\u53c2\u7167\u7f3a\u53e3\uff0c\u5e76\u6784\u5efa\u914d\u5bf9\u57fa\u51c6\u9694\u79bb\u5176\u5f71\u54cd\u3002\u901a\u8fc7\u7f16\u53f7\u7b49\u5916\u90e8\u89c6\u89c9\u53c2\u7167\uff0c\u68c0\u9a8c\u65e0\u9700\u8bad\u7ec3\u7684\u63a8\u7406\u589e\u5f3a\u65b9\u6cd5\u3002", "categories": ["cs.CV", "cs.CL"], "github_repo": "https://github.com/regap-bench/ReGap-Bench", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2610.39419", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["ReGap-Bench\u8986\u76d6\u4e94\u7c7b\u4efb\u52a1\uff0c\u4ec5\u6539\u53d8\u53c2\u7167\u65b9\u5f0f", "\u4efb\u52a1\u5339\u914d\u7684\u89c6\u89c9\u53c2\u7167\u4f7f\u51c6\u786e\u7387\u6700\u591a\u63d0\u534725%", "\u4e0d\u5339\u914d\u53c2\u7167\u6536\u76ca\u6709\u9650\uff0c\u751a\u81f3\u635f\u5bb3\u63a8\u7406\u8868\u73b0"], "keywords": ["\u591a\u6a21\u6001\u5927\u6a21\u578b", "\u89c6\u89c9\u63a8\u7406", "\u53c2\u7167\u7ed1\u5b9a", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2610.39419v1", "published_at": "2026-10-29", "score": 0.273, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2610.39419.png", "title": "Diagnosing the Reference Gap: What Visual Scaffolds Can and Cannot Fix in Multimodal Reasoning", "tldr": "\u591a\u6a21\u6001\u63a8\u7406\u5931\u8bef\u4e0d\u53ea\u6e90\u4e8e\u611f\u77e5\uff0c\u4efb\u52a1\u5339\u914d\u7684\u89c6\u89c9\u53c2\u7167\u53ef\u7f13\u89e3\u8bed\u8a00\u4e0e\u56fe\u50cf\u7ed1\u5b9a\u7f3a\u53e3\u3002", "upvotes": 18, "what_it_is": "\u7814\u7a76\u5c06\u8bed\u8a00\u4e0e\u89c6\u89c9\u5b9e\u4f53\u7ed1\u5b9a\u5931\u8d25\u5b9a\u4e49\u4e3a\u53c2\u7167\u7f3a\u53e3\uff0c\u5e76\u6784\u5efa\u914d\u5bf9\u57fa\u51c6\u9694\u79bb\u5176\u5f71\u54cd\u3002\u901a\u8fc7\u7f16\u53f7\u7b49\u5916\u90e8\u89c6\u89c9\u53c2\u7167\uff0c\u68c0\u9a8c\u65e0\u9700\u8bad\u7ec3\u7684\u63a8\u7406\u589e\u5f3a\u65b9\u6cd5\u3002", "why_notable": "\u5c06\u591a\u6b65\u89c6\u89c9\u63a8\u7406\u4e2d\u7684\u53c2\u7167\u7ed1\u5b9a\u95ee\u9898\u4e0e\u611f\u77e5\u80fd\u529b\u533a\u5206\u5f00\uff0c\u4e3a\u6a21\u578b\u8bca\u65ad\u63d0\u4f9b\u66f4\u7cbe\u786e\u7684\u5207\u53e3\uff0c\u4e5f\u6307\u51fa\u65e0\u9700\u8bad\u7ec3\u7684\u589e\u5f3a\u8def\u5f84\u3002"}, {"abstract": "Coding agents solve repository issues through long sequences of exploration, editing, and validation. These trajectories are increasingly used as post-training data, so how they are collected shapes what the trained model learns. A common approach is to sample multiple trajectories independently for each issue and then select or curate them. However, as more trajectories are sampled independently, later trajectories become increasingly redundant, even though earlier trajectories could guide where subsequent collection effort should be spent. A natural way to use this history is to expose it to the coding agent as advice. But training on such trajectories can make the model rely on advice that is unavailable at test time, creating a train-test mismatch. Instead, we argue that history should guide where collection effort is spent, while the coding agent decides what to generate. We introduce SWE-Trail, a trajectory collector that uses earlier trajectories to guide subsequent collection while keeping that history outside the coding agent\u0027s context. During a new rollout, SWE-Trail uses history to identify a state where additional collection effort may be useful. There, the coding agent proposes candidate next actions from its ordinary context, and SWE-Trail briefly executes them from the same checkpoint to decide which route continues. We evaluate collection approaches by training student models on the trajectories they produce. For a 124B student initialized from Ling-3.0-flash-base, SWE-Trail improves mean resolution over independent sampling by 2.33 and 1.60 percentage points on SWE-bench Multilingual and SWE-bench Pro, respectively. Without history, the same pipeline produces more resolved trajectories than independent sampling, but improves by only 0.11 points on Multilingual. These results show the value of using history to guide collection without exposing it to the coding agent.", "arxiv_id": "2611.02074", "arxiv_url": "https://arxiv.org/abs/2611.02074", "authors": ["Ziming Li", "Lu Yu", "Jiatan Huang", "Qing Cui", "Jun Zhou", "Chuxu Zhang"], "brief": "SWE-Trail\u5c06\u5386\u53f2\u8f68\u8ff9\u7559\u5728\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u4e4b\u5916\uff0c\u7528\u5176\u5b9a\u4f4d\u503c\u5f97\u63a2\u7d22\u7684\u72b6\u6001\uff1b\u518d\u8ba9\u667a\u80fd\u4f53\u63d0\u51fa\u5019\u9009\u52a8\u4f5c\uff0c\u4ece\u540c\u4e00\u68c0\u67e5\u70b9\u77ed\u6682\u6267\u884c\u5e76\u9009\u62e9\u540e\u7eed\u8def\u5f84\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02074", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u5386\u53f2\u6307\u5bfc\u91c7\u96c6\u4f4d\u7f6e\uff0c\u5019\u9009\u52a8\u4f5c\u4ecd\u7531\u667a\u80fd\u4f53\u81ea\u884c\u751f\u6210", "124B\u5b66\u751f\u5728Multilingual\u4e0a\u63d0\u53472.33\u4e2a\u767e\u5206\u70b9", "SWE-bench Pro\u63d0\u53471.60\u4e2a\u767e\u5206\u70b9\uff1b\u65e0\u5386\u53f2\u7248\u524d\u9879\u4ec5\u589e0.11"], "keywords": ["\u7f16\u7801\u667a\u80fd\u4f53", "\u8f68\u8ff9\u91c7\u96c6", "\u540e\u8bad\u7ec3", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 1, "on_hf": true, "organization": "Ant Group", "pdf_url": "https://arxiv.org/pdf/2611.02074v1", "published_at": "2026-11-01", "score": 0.272, "selected_reasons": ["HF trending (34\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02074.png", "title": "SWE-Trail: History-Guided Trajectory Collection for Coding Agent Training", "tldr": "\u7528\u5386\u53f2\u8f68\u8ff9\u5f15\u5bfc\u7f16\u7801\u667a\u80fd\u4f53\u7684\u6570\u636e\u91c7\u96c6\uff0c\u5728\u4e0d\u66b4\u9732\u5386\u53f2\u5efa\u8bae\u4e0b\u63d0\u5347\u8bad\u7ec3\u6548\u679c\u3002", "upvotes": 34, "what_it_is": "SWE-Trail\u5c06\u5386\u53f2\u8f68\u8ff9\u7559\u5728\u667a\u80fd\u4f53\u4e0a\u4e0b\u6587\u4e4b\u5916\uff0c\u7528\u5176\u5b9a\u4f4d\u503c\u5f97\u63a2\u7d22\u7684\u72b6\u6001\uff1b\u518d\u8ba9\u667a\u80fd\u4f53\u63d0\u51fa\u5019\u9009\u52a8\u4f5c\uff0c\u4ece\u540c\u4e00\u68c0\u67e5\u70b9\u77ed\u6682\u6267\u884c\u5e76\u9009\u62e9\u540e\u7eed\u8def\u5f84\u3002", "why_notable": "\u5b83\u5c06\u5386\u53f2\u5229\u7528\u4e0e\u667a\u80fd\u4f53\u8f93\u5165\u89e3\u8026\uff0c\u907f\u514d\u8bad\u7ec3\u4f9d\u8d56\u6d4b\u8bd5\u65f6\u4e0d\u5b58\u5728\u7684\u5efa\u8bae\uff1b\u5b66\u751f\u6a21\u578b\u7ed3\u679c\u4e5f\u8868\u660e\uff0c\u91c7\u96c6\u66f4\u591a\u6210\u529f\u8f68\u8ff9\u5e76\u4e0d\u7b49\u4e8e\u8bad\u7ec3\u6536\u76ca\u66f4\u5927\u3002"}, {"abstract": "Attention remains a substantial computational cost in Transformer training, particularly at long context lengths. NVIDIA Blackwell GPUs provide high-throughput low-precision matrix multiplication, but exploiting it in attention requires addressing quantization overhead, causal information leakage through shared scales, and numerical inconsistencies between the forward and backward passes. We present FLAMIA, a family of attention kernels for Blackwell with MXFP8 and mixed NVFP4/FP8 training paths. Our design combines token-block scaling that reuses quantized operands across matrix orientations, targeted safeguards against scale-induced leakage, and consistent forward and backward computations. Fused quantization and architecture-specific kernel optimizations reduce overhead, while document-local scaling and workload-aware scheduling support variable-length documents directly in packed layouts without repacking. Across various causal packed-document workloads, the MXFP8 path accelerates the combined forward and backward attention call, including quantization, by factors of $1.10$--$1.40\\times$ on B200 and $1.06$--$1.42\\times$ on B300 relative to the fastest evaluated baseline for each workload. We validate training stability and quality preservation on pretraining Llama-style models. These results show how jointly designing quantization, training numerics, and document scheduling translates low-bit hardware throughput into practical attention acceleration.", "arxiv_id": "2611.03344", "arxiv_url": "https://arxiv.org/abs/2611.03344", "authors": ["Fedor Velikonivtsev", "Mikhail Koltakov", "Denis Kuznedelev"], "brief": "FLAMIA\u662f\u4e00\u7ec4\u9762\u5411Blackwell\u7684\u4f4e\u7cbe\u5ea6\u6ce8\u610f\u529b\u5185\u6838\uff0c\u91c7\u7528\u8bcd\u5143\u5757\u7f29\u653e\u590d\u7528\u91cf\u5316\u64cd\u4f5c\u6570\uff0c\u5e76\u878d\u5408\u91cf\u5316\u3001\u7ea6\u675f\u5c3a\u5ea6\u4fe1\u606f\u6cc4\u6f0f\uff0c\u4fdd\u6301\u524d\u540e\u5411\u8ba1\u7b97\u4e00\u81f4\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/yandex-research/flamia-blackwell-attention", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2611.03344", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u4f9bMXFP8\u4e0e\u6df7\u5408NVFP4/FP8\u8bad\u7ec3\u8def\u5f84", "\u6587\u6863\u5c40\u90e8\u7f29\u653e\u652f\u6301\u6253\u5305\u53d8\u957f\u6587\u6863\uff0c\u65e0\u9700\u91cd\u65b0\u6253\u5305", "MXFP8\u5728B200/B300\u4e0a\u6700\u9ad8\u52a0\u901f1.40/1.42\u500d"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u4f4e\u7cbe\u5ea6\u8bad\u7ec3", "\u91cf\u5316", "GPU\u4f18\u5316"], "num_comments": 1, "on_hf": true, "organization": "Yandex Research", "pdf_url": "https://arxiv.org/pdf/2611.03344v1", "published_at": "2026-11-02", "score": 0.27, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.03344.png", "title": "FLAMIA: FLAsh MIcroscaling Attention for Fast and Causally Safe Training on Blackwell", "tldr": "\u901a\u8fc7\u4f4e\u7cbe\u5ea6\u91cf\u5316\u4e0e\u56e0\u679c\u5b89\u5168\u8bbe\u8ba1\uff0c\u52a0\u901fBlackwell\u4e0a\u7684\u6ce8\u610f\u529b\u8bad\u7ec3\u3002", "upvotes": 17, "what_it_is": "FLAMIA\u662f\u4e00\u7ec4\u9762\u5411Blackwell\u7684\u4f4e\u7cbe\u5ea6\u6ce8\u610f\u529b\u5185\u6838\uff0c\u91c7\u7528\u8bcd\u5143\u5757\u7f29\u653e\u590d\u7528\u91cf\u5316\u64cd\u4f5c\u6570\uff0c\u5e76\u878d\u5408\u91cf\u5316\u3001\u7ea6\u675f\u5c3a\u5ea6\u4fe1\u606f\u6cc4\u6f0f\uff0c\u4fdd\u6301\u524d\u540e\u5411\u8ba1\u7b97\u4e00\u81f4\u3002", "why_notable": "\u5c06\u4f4e\u6bd4\u7279\u786c\u4ef6\u541e\u5410\u8f6c\u5316\u4e3a\u5305\u542b\u91cf\u5316\u5f00\u9500\u7684\u5b9e\u9645\u8bad\u7ec3\u52a0\u901f\uff0c\u540c\u65f6\u5728Llama\u5f0f\u6a21\u578b\u9884\u8bad\u7ec3\u4e2d\u9a8c\u8bc1\u4e86\u7a33\u5b9a\u6027\u4e0e\u8d28\u91cf\u4fdd\u6301\u3002"}, {"abstract": "We introduce SIMIT, a test-time self-improvement framework in which a vision-language model creates its own query-specific training data before answering an unlabeled test query. Our goal is to improve performance on a given target test set without annotations or external models. To pursue this goal, some test-time methods improve answers through longer reasoning or repeated sampling but leave the model unchanged. Others update the model using rewards based on majority agreement among multiple candidate answers or the model\u0027s own judgments of correctness, but such rewards can reinforce existing mistakes. SIMIT instead imagines similar problems whose solutions it controls: a model need not correctly solve the target query to construct useful practice examples. It synthesizes diverse (question, answer, image) triplets by specifying each answer before realizing its image. To support diverse multimodal tasks, SIMIT combines native image generation with an extensible skill library for structured visuals, including documents, charts, and diagrams. Within this pipeline, multi-stage verification checks that images support their assigned answers, while difficulty filtering retains informative examples. Adaptive budgeting further targets this practice by allocating more samples to queries the model is less confident in answering. The resulting data can improve the model in-context (SIMIT-ICL) or in-weight (SIMIT-FT). Across 17 diverse benchmarks, SIMIT outperforms existing self-improvement methods. Its best configuration achieves a +7.20% mean relative gain over BAGEL-7B, while training-free SIMIT-ICL achieves +6.98%.", "arxiv_id": "2611.00053", "arxiv_url": "https://arxiv.org/abs/2611.00053", "authors": ["Mehmet Onurcan Kaya", "Desmond Elliott", "Dim P. Papadopoulos"], "brief": "SIMIT\u5148\u4e3a\u76f8\u4f3c\u95ee\u9898\u6307\u5b9a\u7b54\u6848\uff0c\u518d\u751f\u6210\u914d\u5957\u56fe\u50cf\uff0c\u6784\u9020\u67e5\u8be2\u4e13\u5c5e\u7ec3\u4e60\u6570\u636e\uff1b\u7ed3\u5408\u9a8c\u8bc1\u4e0e\u96be\u5ea6\u7b5b\u9009\uff0c\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u6216\u5fae\u8c03\u6539\u5584\u76ee\u6807\u67e5\u8be2\u8868\u73b0\u3002", "categories": ["cs.CV", "cs.LG"], "github_repo": "https://github.com/monurcan/simit_paper", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2611.00053", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u539f\u751f\u56fe\u50cf\u751f\u6210\u7ed3\u5408\u6280\u80fd\u5e93\uff0c\u5408\u6210\u95ee\u7b54\u56fe\u50cf\u4e09\u5143\u7ec4", "\u591a\u9636\u6bb5\u9a8c\u8bc1\u4e0e\u96be\u5ea6\u7b5b\u9009\uff0c\u4f4e\u7f6e\u4fe1\u67e5\u8be2\u83b7\u66f4\u591a\u6837\u672c", "17\u9879\u57fa\u51c6\uff1a\u6700\u4f73\u5e73\u5747\u76f8\u5bf9\u63d0\u53477.20%\uff0cICL\u4e3a6.98%"], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u6d4b\u8bd5\u65f6\u81ea\u6539\u8fdb", "\u591a\u6a21\u6001\u751f\u6210", "\u4e0a\u4e0b\u6587\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "Technical University of Denmark", "pdf_url": "https://arxiv.org/pdf/2611.00053v1", "published_at": "2026-10-11", "score": 0.27, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.00053.png", "title": "SIMIT: Self-Improving Vision-Language Models via Imagination at Test-Time", "tldr": "\u8ba9\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u5728\u6d4b\u8bd5\u65f6\u81ea\u9020\u53ef\u9a8c\u8bc1\u7ec3\u4e60\u9898\uff0c\u65e0\u9700\u6807\u6ce8\u5373\u53ef\u63d0\u5347\u7b54\u9898\u8868\u73b0\u3002", "upvotes": 5, "what_it_is": "SIMIT\u5148\u4e3a\u76f8\u4f3c\u95ee\u9898\u6307\u5b9a\u7b54\u6848\uff0c\u518d\u751f\u6210\u914d\u5957\u56fe\u50cf\uff0c\u6784\u9020\u67e5\u8be2\u4e13\u5c5e\u7ec3\u4e60\u6570\u636e\uff1b\u7ed3\u5408\u9a8c\u8bc1\u4e0e\u96be\u5ea6\u7b5b\u9009\uff0c\u901a\u8fc7\u4e0a\u4e0b\u6587\u5b66\u4e60\u6216\u5fae\u8c03\u6539\u5584\u76ee\u6807\u67e5\u8be2\u8868\u73b0\u3002", "why_notable": "\u628a\u6d4b\u8bd5\u65f6\u81ea\u6539\u8fdb\u4ece\u5224\u65ad\u81ea\u8eab\u7b54\u6848\u8f6c\u5411\u6784\u9020\u7b54\u6848\u53ef\u63a7\u7684\u7ec3\u4e60\uff0c\u51cf\u5c11\u9519\u8bef\u81ea\u5f3a\u5316\u98ce\u9669\uff1b\u65e0\u9700\u5916\u90e8\u6a21\u578b\u6216\u6807\u6ce8\uff0c\u4e5f\u80fd\u83b7\u5f97\u6027\u80fd\u589e\u76ca\u3002"}, {"abstract": "On-policy distillation (OPD) trains a student on its own generations by matching the teacher\u0027s token probabilities. These probabilities entangle two kinds of information: which tokens the teacher prefers, and how confident it is. The latter reflects the teacher\u0027s own capacity and calibration, which a smaller student may be unable to reproduce. Because the teacher temperature changes these values without changing the ordering, OPD is also sensitive to the temperature choice. We ask whether the teacher\u0027s ordering of candidate tokens is enough, and propose Order-Only On-Policy Distillation (O$^{3}$PD). At each student-generated prefix, O$^{3}$PD trains the student to reproduce the order of the teacher\u0027s top-$K$ tokens, without fitting their probability values. The objective is therefore invariant to the teacher temperature and needs no temperature tuning. Across six teacher--student pairs, O$^{3}$PD outperforms OPD on the average over HMMT25, AIME24, and AIME25 in every pair, by up to 2.9 points, with gains of up to 5.6 points on AIME25. Other ranking losses yield similar gains, so the benefit comes from ordinal supervision itself. Analysis shows that O$^{3}$PD departs further from the teacher\u0027s probabilities than OPD, yet reproduces its ranking more faithfully and yields a stronger student. The ranking, not the probability values, thus carries the knowledge that on-policy distillation needs to transfer.", "arxiv_id": "2611.02112", "arxiv_url": "https://arxiv.org/abs/2611.02112", "authors": ["Guangzeng Han", "Yu Wu", "Xiaolei Huang"], "brief": "\u63d0\u51fa O\u00b3PD\uff0c\u5728\u5b66\u751f\u81ea\u884c\u751f\u6210\u7684\u6bcf\u4e2a\u524d\u7f00\u4e0a\uff0c\u4ec5\u5b66\u4e60\u6559\u5e08\u524d K \u4e2a\u5019\u9009\u8bcd\u7684\u6392\u5e8f\u3002\u7528\u6392\u5e8f\u76d1\u7763\u66ff\u4ee3\u6982\u7387\u5339\u914d\uff0c\u4f7f\u76ee\u6807\u4e0d\u53d7\u6559\u5e08\u6e29\u5ea6\u5f71\u54cd\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02112", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["O\u00b3PD \u5339\u914d\u6559\u5e08\u524d K \u4e2a\u8bcd\u7684\u987a\u5e8f\uff0c\u4e0d\u62df\u5408\u6982\u7387", "\u516d\u7ec4\u5e08\u751f\u914d\u5bf9\u7684\u4e09\u9879\u6570\u5b66\u8bc4\u6d4b\u5747\u5206\u5747\u4f18\u4e8e OPD", "\u5747\u5206\u6700\u591a\u63d0\u53472.9\u5206\uff0cAIME25\u6700\u591a\u63d0\u53475.6\u5206"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u6392\u5e8f\u76d1\u7763", "\u6570\u5b66\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02112v1", "published_at": "2026-11-01", "score": 0.267, "selected_reasons": ["HF trending (28\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2611.02112.png", "title": "Order-Only On-Policy Distillation", "tldr": "\u53ea\u5b66\u6559\u5e08\u5019\u9009\u8bcd\u6392\u5e8f\u3001\u4e0d\u62df\u5408\u6982\u7387\uff0c\u65e2\u514d\u6e29\u5ea6\u8c03\u53c2\uff0c\u4e5f\u63d0\u5347\u5b66\u751f\u6570\u5b66\u63a8\u7406\u8868\u73b0\u3002", "upvotes": 28, "what_it_is": "\u63d0\u51fa O\u00b3PD\uff0c\u5728\u5b66\u751f\u81ea\u884c\u751f\u6210\u7684\u6bcf\u4e2a\u524d\u7f00\u4e0a\uff0c\u4ec5\u5b66\u4e60\u6559\u5e08\u524d K \u4e2a\u5019\u9009\u8bcd\u7684\u6392\u5e8f\u3002\u7528\u6392\u5e8f\u76d1\u7763\u66ff\u4ee3\u6982\u7387\u5339\u914d\uff0c\u4f7f\u76ee\u6807\u4e0d\u53d7\u6559\u5e08\u6e29\u5ea6\u5f71\u54cd\u3002", "why_no
