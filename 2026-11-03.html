xed pattern or, in recent production LLMs, learned per query. In DeepSeek Sparse Attention (DSA), the attention of DeepSeek-V3.2 and the GLM-5 family, every layer is preceded by a lightning indexer that scores the whole cache and keeps the k=2048 highest-scoring tokens for the layer to attend. At long context this indexer scan, not the sparse attention it feeds, is where the decode time goes. But adjacent layers select nearly the same tokens, so a layer can attend the selection of the previous indexer layer instead of its own. This removes the dependency: each indexer then runs concurrently with the attention of its layer. The resulting Multi-layer Indexer (MLI) needs no retraining and no new weights. Its default realization changes no kernel, running inside SGLang\u0027s production decode graph; an optional fused decode kernel accelerates it further on DeepSeek-V3.2. MLI composes with IndexCache (the cross-layer reuse GLM-5.2 ships as IndexShare): IndexCache drops the indexer from some layers, and MLI hides the scan on the rest. We serve DeepSeek-V3.2 and GLM-5 under IndexCache\u0027s protocol at retentions 1/2 to 1/32 (the fraction of layers that keep an indexer) and contexts 10K to 195K. At equal retention the composition decodes faster than IndexCache: up to 14.5% faster on DeepSeek-V3.2 and 9.8% on GLM-5 at 1/2, and 7.9% and 5.1% at 1/4, largest where IndexCache keeps the most indexers and growing with context. At retention 1/r it is faster still than IndexCache at 1/(2r) while keeping twice the fresh selections: at 128K it reaches 1.32x the unmodified model\u0027s decode throughput at 1/4, above IndexCache\u0027s 1.28x at 1/8. Its LongBench, RULER and LongBench v2 accuracy stays within a few percentage points of IndexCache\u0027s.", "arxiv_id": "2611.03768", "arxiv_url": "https://arxiv.org/abs/2611.03768", "authors": ["Serdarcan Dilbaz", "Arjun Krishna", "Kiran Kamble", "Daniel M. Bikel"], "brief": "\u63d0\u51fa\u591a\u5c42\u7d22\u5f15\u5668\uff0c\u8ba9\u7a00\u758f\u6ce8\u610f\u529b\u590d\u7528\u4e0a\u4e00\u5c42\u9009\u8bcd\u5e76\u4e0e\u7d22\u5f15\u626b\u63cf\u5e76\u884c\uff0c\u65e0\u9700\u91cd\u8bad\u7ec3\uff1b\u7ed3\u5408IndexCache\u540e\u89e3\u7801\u6700\u9ad8\u63d0\u901f14.5%\uff0c\u51c6\u786e\u7387\u57fa\u672c\u4fdd\u6301\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03768", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7a00\u758f\u6ce8\u610f\u529b", "\u957f\u4e0a\u4e0b\u6587", "\u63a8\u7406\u52a0\u901f", "\u7d22\u5f15\u590d\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03768v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Multi-layer Indexer: Overlapping Selection and Attention in DeepSeek Sparse Attention", "tldr": "\u63d0\u51fa\u591a\u5c42\u7d22\u5f15\u5668\uff0c\u8ba9\u7a00\u758f\u6ce8\u610f\u529b\u590d\u7528\u4e0a\u4e00\u5c42\u9009\u8bcd\u5e76\u4e0e\u7d22\u5f15\u626b\u63cf\u5e76\u884c\uff0c\u65e0\u9700\u91cd\u8bad\u7ec3\uff1b\u7ed3\u5408IndexCache\u540e\u89e3\u7801\u6700\u9ad8\u63d0\u901f14.5%\uff0c\u51c6\u786e\u7387\u57fa\u672c\u4fdd\u6301\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large Language Models (LLMs) have shown promise for empowering search agents to tackle complex information-seeking tasks. However, since acquiring external information necessitates web search, these agents are highly susceptible to various adversarial attacks (e.g., malicious information injection or stealthy context manipulation). Existing attack strategies inevitably rely on static and human-crafted templates, failing to emulate the dynamic and complex nature of real-world threats. In this paper, we propose an adversarial self-evolution framework that integrates bi-level optimization between the attacker\u0027s strategy evolution and the defender\u0027s adaptive mitigation, to expose the vulnerabilities of search agents. Specifically, we introduce the Contrastive Rollout Evolutionary Optimization (CREO) method to drive the directional evolution of the attack strategy population via contrastive evolutionary signals. To provide a stable environment for this continuous evolution, we further construct a controlled sandbox and design fine-grained metrics to quantify internal vulnerabilities. Extensive experiments across various multi-hop QA benchmarks and frontier LLMs demonstrate that the proposed framework yields attack efficacy superior to static baselines, underscoring the urgent need to develop more robust defense frameworks.", "arxiv_id": "2611.03754", "arxiv_url": "https://arxiv.org/abs/2611.03754", "authors": ["Geyuan Wang", "Shunyu Liu", "Siyuan Liang", "Chenyang Lyu", "Dacheng Tao"], "brief": "\u63d0\u51fa\u9488\u5bf9\u641c\u7d22\u667a\u80fd\u4f53\u7684\u5bf9\u6297\u81ea\u8fdb\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u53cc\u5c42\u4f18\u5316\u548c\u5bf9\u6bd4\u8fdb\u5316\u8fed\u4ee3\u653b\u51fb\u7b56\u7565\uff0c\u5e76\u5728\u53d7\u63a7\u6c99\u7bb1\u4e2d\u8bc4\u4f30\u6f0f\u6d1e\uff1b\u591a\u8df3\u95ee\u7b54\u5b9e\u9a8c\u663e\u793a\uff0c\u5176\u653b\u51fb\u6548\u679c\u4f18\u4e8e\u9759\u6001\u57fa\u7ebf\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03754", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u641c\u7d22\u667a\u80fd\u4f53", "\u5bf9\u6297\u653b\u51fb", "\u8fdb\u5316\u4f18\u5316", "\u5b89\u5168\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03754v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Web Doesn\u0027t Sit Still: Adversarial Self-Evolving Attacks on Search Agents", "tldr": "\u63d0\u51fa\u9488\u5bf9\u641c\u7d22\u667a\u80fd\u4f53\u7684\u5bf9\u6297\u81ea\u8fdb\u5316\u6846\u67b6\uff0c\u901a\u8fc7\u53cc\u5c42\u4f18\u5316\u548c\u5bf9\u6bd4\u8fdb\u5316\u8fed\u4ee3\u653b\u51fb\u7b56\u7565\uff0c\u5e76\u5728\u53d7\u63a7\u6c99\u7bb1\u4e2d\u8bc4\u4f30\u6f0f\u6d1e\uff1b\u591a\u8df3\u95ee\u7b54\u5b9e\u9a8c\u663e\u793a\uff0c\u5176\u653b\u51fb\u6548\u679c\u4f18\u4e8e\u9759\u6001\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) elevates joint audio-video generation, but optimizing heterogeneous, modality-specific audio and video rewards often introduces cross-modal interference. On-policy distillation (OPD) alleviates this issue by transferring the capabilities of specialized audio and video RL teachers into a single student model. However, a significant imbalance in cross-modal token counts leaves audio with sparse supervision, causing unstable distillation. We observe that naively increasing the audio loss weight fails to solve this problem since audio learning relies heavily on visual context, indicating richer visual cues are crucial to offset sparse audio signals. To address this, we propose OmniOPD, a modality-wise on-policy distillation framework designed for balanced and stable audio-video generation. First, we construct privileged visual information using asymmetric noise scheduling, allowing the audio teacher to generate more informative targets from cleaner video context. Second, we introduce grouped multi-noise sampling to expand audio supervision coverage and stabilize training. Third, we introduce timestep-wise importance weighting based on teacher-student transition divergence, preserving reliable supervision while down-weighting unreliable learning signals, to stabilize fluctuations in audio learning. Evaluated on JavisBench and VBench demonstrate OmniOPD preserves audio quality while significantly enhancing video generation, achieving effective joint distillation.", "arxiv_id": "2611.02803", "arxiv_url": "https://arxiv.org/abs/2611.02803", "authors": ["Zihao Fan", "Xin Lu", "Jie Huang", "Hexin Zhang", "Xueyang Fu", "Zheng-Jun Zha"], "brief": "OmniOPD\u901a\u8fc7\u66f4\u6e05\u6670\u7684\u89c6\u9891\u4e0a\u4e0b\u6587\u3001\u591a\u566a\u58f0\u91c7\u6837\u548c\u91cd\u8981\u6027\u52a0\u6743\uff0c\u7f13\u89e3\u97f3\u89c6\u9891\u8054\u5408\u84b8\u998f\u4e2d\u7684\u97f3\u9891\u76d1\u7763\u7a00\u758f\u95ee\u9898\uff0c\u5728\u4fdd\u6301\u97f3\u9891\u8d28\u91cf\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u89c6\u9891\u751f\u6210\u6548\u679c\u3002", "categories": ["cs.CV", "cs.AI", "cs.SD"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02803", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u97f3\u89c6\u9891\u751f\u6210", "\u5728\u7b56\u7565\u84b8\u998f", "\u591a\u6a21\u6001\u5b66\u4e60", "\u8bad\u7ec3\u7a33\u5b9a\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02803v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "OmniOPD: Stable On-Policy Distillation for Joint Audio-Video Generation", "tldr": "OmniOPD\u901a\u8fc7\u66f4\u6e05\u6670\u7684\u89c6\u9891\u4e0a\u4e0b\u6587\u3001\u591a\u566a\u58f0\u91c7\u6837\u548c\u91cd\u8981\u6027\u52a0\u6743\uff0c\u7f13\u89e3\u97f3\u89c6\u9891\u8054\u5408\u84b8\u998f\u4e2d\u7684\u97f3\u9891\u76d1\u7763\u7a00\u758f\u95ee\u9898\uff0c\u5728\u4fdd\u6301\u97f3\u9891\u8d28\u91cf\u7684\u540c\u65f6\u663e\u8457\u63d0\u5347\u89c6\u9891\u751f\u6210\u6548\u679c\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recursively self-improving (RSI) systems are increasingly viewed as a promising means of accelerating progress toward artificial general intelligence. They aim to autonomously improve their capabilities by refining their working pipelines and recursively improving the strategies that guide subsequent refinements, with gains generalizing to unseen scenarios.However, existing evaluations lack reliable metrics to distinguish capability gains from scenario fitting, sustainable and extensible protocols for unseen tasks and difficulties, and fine-grained attribution of improvement to evolution traces. To this end, we propose SelfImprove-Bench,an RSI evaluation framework that organizes tasks into three primary capabilities (i.e., Exploring, Planning, Reasoning) as scenarios for guiding model evolution. We instantiated the tasks on games for controllability and reproducibility, and pairs them with scalable generation and orchestration driven by task templates and difficulty coefficients. Beyond task-level scores, SelfImprove-Bench organizes evaluation into generalization ladder levels G0 to G4 that measure how far gains transfer from training conditions. Experiments reveal that the evolutionary gains of existing RSI methods are inconsistent across generalization levels.", "arxiv_id": "2611.02797", "arxiv_url": "https://arxiv.org/abs/2611.02797", "authors": ["Bangrui Xu", "Jie Yang", "Sidi Chen", "Xuanhe Zhou", "Jiantao Qiu", "Qianyu Yang", "Zijie Wang", "Fan Wu", "Zhoufutu Wen"], "brief": "\u63d0\u51fa\u81ea\u6211\u6539\u8fdb\u667a\u80fd\u4f53\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ee5\u53ef\u751f\u6210\u7684\u6e38\u620f\u4efb\u52a1\u548c\u4e94\u7ea7\u6cdb\u5316\u9636\u68af\u8861\u91cf\u80fd\u529b\u63d0\u5347\u7684\u8fc1\u79fb\u8303\u56f4\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u73b0\u6709\u65b9\u6cd5\u7684\u8fdb\u5316\u6536\u76ca\u5728\u4e0d\u540c\u6cdb\u5316\u5c42\u7ea7\u4e0a\u5e76\u4e0d\u4e00\u81f4\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02797", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u81ea\u6211\u6539\u8fdb", "\u6cdb\u5316\u8bc4\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02797v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "SelfImprove-Bench: Evaluating Generalization in Self-Improving Agents", "tldr": "\u63d0\u51fa\u81ea\u6211\u6539\u8fdb\u667a\u80fd\u4f53\u8bc4\u6d4b\u6846\u67b6\uff0c\u4ee5\u53ef\u751f\u6210\u7684\u6e38\u620f\u4efb\u52a1\u548c\u4e94\u7ea7\u6cdb\u5316\u9636\u68af\u8861\u91cf\u80fd\u529b\u63d0\u5347\u7684\u8fc1\u79fb\u8303\u56f4\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u73b0\u6709\u65b9\u6cd5\u7684\u8fdb\u5316\u6536\u76ca\u5728\u4e0d\u540c\u6cdb\u5316\u5c42\u7ea7\u4e0a\u5e76\u4e0d\u4e00\u81f4\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "For over 50 years, the database community has developed a wide range of successful engines to answer two fundamental questions: how can database systems run faster, and how can we ensure their correctness? Experience with these engines shows that performance depends on hardware and workloads. As both change over time, we repeatedly redesign and rebuild database systems, a time-consuming and expensive process. Correctness remains another long-standing challenge: recent studies continue to uncover wrong-answer bugs even in mature database engines, despite years of development and testing. To address these, we present GenDB-V, a system that enables AI agents to synthesize database engines specialized to hardware and workloads for performance, and formally verified for correctness. GenDB-V supports specialized implementations of SQL templates and general-purpose engines that accept any query within a supported SQL subset. First, we develop SQLSpec to formalize SQL semantics and deterministically construct fixed, implementation-agnostic synthesis targets. Second, we enable joint synthesis of fast code and formal proofs through storage--execution co-optimization, performance-first exploration, and three-layer modular proofs that bridge low-level execution to SQLSpec semantics. Third, we verify the synthesized code and proofs against the fixed synthesis targets in an isolated pipeline, proving SQL correctness and program safety. We evaluate GenDB-V on TPC-H and SEC-EDGAR. For verified template implementations, GenDB-V achieves geometric-mean speedups of 22.0-61.3x over DuckDB and Umbra. For a verified general-purpose engine, GenDB-V also achieves speedups of 1.27-3.4x on TPC-H. GenDB-V also achieves better performance than a testing-based LLM synthesis method, while our audit and tests expose incorrect answers in that method\u0027s implementations for 16 of 28 templates.", "arxiv_id": "2611.02779", "arxiv_url": "https://arxiv.org/abs/2611.02779", "authors": ["Jiale Lao", "Immanuel Trummer"], "brief": "GenDB-V\u5229\u7528AI\u667a\u80fd\u4f53\u751f\u6210\u9488\u5bf9\u786c\u4ef6\u548c\u8d1f\u8f7d\u4f18\u5316\u7684\u6570\u636e\u5e93\u5f15\u64ce\uff0c\u5e76\u901a\u8fc7\u5f62\u5f0f\u5316\u8bc1\u660e\u4fdd\u969c\u6b63\u786e\u6027\uff1b\u5728TPC-H\u4e0a\uff0c\u9a8c\u8bc1\u540e\u7684\u901a\u7528\u5f15\u64ce\u8f83\u57fa\u7ebf\u52a0\u901f1.27\u81f33.4\u500d\u3002", "categories": ["cs.DB", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.02779", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u6570\u636e\u5e93\u7cfb\u7edf", "\u4ee3\u7801\u751f\u6210", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u6027\u80fd\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.02779v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Stop Handcrafting Your Engine! GenDB-V: Towards AI-Generated and Formally Verified Database Systems", "tldr": "GenDB-V\u5229\u7528AI\u667a\u80fd\u4f53\u751f\u6210\u9488\u5bf9\u786c\u4ef6\u548c\u8d1f\u8f7d\u4f18\u5316\u7684\u6570\u636e\u5e93\u5f15\u64ce\uff0c\u5e76\u901a\u8fc7\u5f62\u5f0f\u5316\u8bc1\u660e\u4fdd\u969c\u6b63\u786e\u6027\uff1b\u5728TPC-H\u4e0a\uff0c\u9a8c\u8bc1\u540e\u7684\u901a\u7528\u5f15\u64ce\u8f83\u57fa\u7ebf\u52a0\u901f1.27\u81f33.4\u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Muon has recently emerged as a promising optimizer for pretraining large language models, offering a speedup over AdamW in minimizing pretraining loss. However, it remains unclear whether Muon\u0027s advantage persists after fine-tuning. In this paper, we study the downstream behavior of Muon and AdamW and uncover a surprising trend: beyond a sufficiently large pretraining data budget, AdamW outperforms Muon after fine-tuning. Moreover, as model size increases, AdamW overtakes Muon at progressively smaller pretraining token-parameter ratios. To explain this reversal, we view fine-tuning as a perturbation of the outputs and introduce the margin-to-spread ratio, which measures how far the correct logit lies above the wrong ones relative to how widely the wrong logits are spread. In language models, Muon has the larger margin-to-spread ratio at small data budgets and AdamW at large ones, mirroring the fine-tuning trend. In a linear associative memory, we prove that after one update the margin-to-spread ratio of gradient descent gains on that of Muon as the data budget grows, and simulations show that this trend persists after extended training.", "arxiv_id": "2611.03633", "arxiv_url": "https://arxiv.org/abs/2611.03633", "authors": ["Catherine Li", "Jingchu Gai", "Andrej Risteski", "Jacob Mitchell Springer", "Aditi Raghunathan"], "brief": "\u7814\u7a76\u53d1\u73b0\uff0c\u9884\u8bad\u7ec3\u6570\u636e\u89c4\u6a21\u8db3\u591f\u5927\u65f6\uff0cAdamW\u5fae\u8c03\u540e\u8868\u73b0\u8d85\u8fc7Muon\uff0c\u4e14\u6a21\u578b\u8d8a\u5927\uff0c\u53cd\u8d85\u6240\u9700\u6570\u636e\u6bd4\u4f8b\u8d8a\u4f4e\u3002\u8bba\u6587\u63d0\u51fa\u8fb9\u9645\u79bb\u6563\u6bd4\u89e3\u91ca\u8fd9\u4e00\u8d8b\u52bf\uff0c\u5e76\u4ee5\u7406\u8bba\u548c\u4eff\u771f\u652f\u6301\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03633", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4f18\u5316\u5668", "\u9884\u8bad\u7ec3", "\u5fae\u8c03", "\u7f29\u653e\u89c4\u5f8b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03633v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pretraining Data Scale Reverses the Muon-AdamW Fine-Tuning Gap", "tldr": "\u7814\u7a76\u53d1\u73b0\uff0c\u9884\u8bad\u7ec3\u6570\u636e\u89c4\u6a21\u8db3\u591f\u5927\u65f6\uff0cAdamW\u5fae\u8c03\u540e\u8868\u73b0\u8d85\u8fc7Muon\uff0c\u4e14\u6a21\u578b\u8d8a\u5927\uff0c\u53cd\u8d85\u6240\u9700\u6570\u636e\u6bd4\u4f8b\u8d8a\u4f4e\u3002\u8bba\u6587\u63d0\u51fa\u8fb9\u9645\u79bb\u6563\u6bd4\u89e3\u91ca\u8fd9\u4e00\u8d8b\u52bf\uff0c\u5e76\u4ee5\u7406\u8bba\u548c\u4eff\u771f\u652f\u6301\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) can enable generalizable improvement for large language model (LLM) reasoning. This paper studies how to incentivize such generalization via reasoning strategies. We study this question with a controllable equation-solving framework: finding multiple inputs x for equations f(x)=y, where f is a non-bijective string function. This setting makes reasoning strategies observable while supporting a clear definition of easy-to-hard out-of-distribution (OOD) shifts, e.g., more solutions, longer y, etc. We uncover a subtle RLVR failure: it teaches the model to solve in-distribution tasks with high accuracy and structured step-by-step derivation, yet under OOD shifts, the same model abandons derivation and collapses to ineffective brute-force enumeration, causing sharp accuracy drops. This observation reveals the deeper challenges of RLVR generalization as it is neither incapable base model nor reward hacking, since the model succeeds in-distribution with the correct reasoning strategy. The key to mitigating this failure is an indirect intervention that surprisingly helps: co-training with bijective inversion tasks. Although these bijective tasks are actually not uniformly harder and even further from the non-bijective OOD evaluation, they make derivation more certain and substantially restore the correct strategy and accuracy under OOD shifts. This effect further motivates our theoretical analysis: outcome-only RLVR can shape reasoning processes through implicitly crediting the effective reasoning strategies more, even without process supervision. To conclude, our analysis framework and findings systematically reveal the crucial role and incentivization of reasoning strategies in RLVR generalization under OOD shifts. Code is available at https://github.com/ziqipang/rl_meta_thinking.", "arxiv_id": "2611.03627", "arxiv_url": "https://arxiv.org/abs/2611.03627", "authors": ["Ziqi Pang", "Yu-Xiong Wang"], "brief": "\u7814\u7a76\u7528\u53ef\u63a7\u65b9\u7a0b\u6c42\u89e3\u4efb\u52a1\u53d1\u73b0\uff0cRLVR\u8bad\u7ec3\u7684\u6a21\u578b\u5728\u5206\u5e03\u5916\u6613\u653e\u5f03\u9010\u6b65\u63a8\u5bfc\u3001\u9000\u5316\u4e3a\u7a77\u4e3e\uff1b\u8054\u5408\u8bad\u7ec3\u53cc\u5c04\u6c42\u9006\u4efb\u52a1\u53ef\u663e\u8457\u6062\u590d\u63a8\u7406\u7b56\u7565\u4e0e\u51c6\u786e\u7387\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2611.03627", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u7b56\u7565", "\u5206\u5e03\u5916\u6cdb\u5316", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2611.03627v1", "published_at": "2026-11-02", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Not All Reasoning Generalizes: A Case Study on Learning Generalizable Reasoning Strategies in RLVR", "tldr": "\u7814\u7a76\u7528\u53ef\u63a7\u65b9\u7a0b\u6c42\u89e3\u4efb\u52a1\u53d1\u73b0\uff0cRLVR\u8bad\u7ec3\u7684\u6a21\u578b\u5728\u5206\u5e03\u5916\u6613\u653e\u5f03\u9010\u6b65\u63a8\u5bfc\u3001\u9000\u5316\u4e3a\u7a77\u4e3e\uff1b\u8054\u5408\u8bad\u7ec3\u53cc\u5c04\u6c42\u9006\u4efb\u52a1\u53ef\u663e\u8457\u6062\u590d\u63a8\u7406\u7b56\u7565\u4e0e\u51c6\u786e\u7387\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
