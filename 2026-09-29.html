.png", "title": "RoboFoundry: System-as-Policy Evolution for Self-Learning Embodied Agents", "tldr": "\u8ba9\u5177\u8eab\u667a\u80fd\u4f53\u7684\u7cfb\u7edf\u6808\u81ea\u6211\u8fdb\u5316", "upvotes": 17, "what_it_is": "RoboFoundry \u63d0\u51fa\u201c\u7cfb\u7edf\u5373\u7b56\u7565\u201d\u7684\u81ea\u8fdb\u5316\u5177\u8eab\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4e0d\u518d\u53ea\u4f18\u5316\u5355\u4e2a\u6a21\u5757\uff0c\u800c\u662f\u5c06\u4e0a\u4e0b\u6587\u3001\u8bb0\u5fc6\u3001\u6280\u80fd\u4e0e\u6062\u590d\u673a\u5236\u4f5c\u4e3a\u7edf\u4e00\u7cfb\u7edf\u7b56\u7565\u6301\u7eed\u6539\u8fdb\u3002\u5b83\u628a\u6267\u884c\u8f68\u8ff9\u8f6c\u5316\u4e3a\u7ecf\u8fc7\u9a8c\u8bc1\u7684\u4efb\u52a1\u7ea7\u7cfb\u7edf\u66f4\u65b0\uff0c\u5e76\u5c06\u53ef\u590d\u7528\u6539\u8fdb\u63d0\u5347\u4e3a\u901a\u7528\u80fd\u529b\u3002", "why_notable": "\u8bba\u6587\u628a\u5177\u8eab\u667a\u80fd\u4f53\u7684\u81ea\u6211\u6539\u8fdb\u4ece\u201c\u4ea4\u4e92\u7ecf\u9a8c\u79ef\u7d2f\u201d\u63a8\u8fdb\u5230\u201c\u53ef\u9a8c\u8bc1\u7684\u7cfb\u7edf\u7ea7\u6301\u4e45\u66f4\u65b0\u201d\uff0c\u5bf9\u957f\u671f\u81ea\u4e3b\u5b66\u4e60\u3001\u8de8\u673a\u5668\u4eba\u8fc1\u79fb\u548c\u771f\u5b9e\u73af\u5883\u90e8\u7f72\u90fd\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Training a model to generate visual content can encourage it to learn rich perceptual capabilities related to geometry, spatial relationships, and objectness; yet, its benefits for visual understanding remain unclear. We ask: when and how does visual generation supervision improve visual understanding? We study controlled pairs of image-to-image (I2I) generation and image-to-text (I2T) understanding tasks that express the same underlying problem in different output modalities. We find that under the correct recipe, I2I training improves downstream I2T performance, with larger gains as the amount of I2I training data increases. We next ask which generation tasks benefit which understanding capabilities. To study transfer beyond paired tasks, we introduce OmniTaskonomy, a unified taxonomy spanning 19 I2I generation tasks and 25 I2T understanding capabilities. The resulting transfer map reveals selective, task-dependent benefits. Some follow intuitive correspondences, e.g., depth prediction improving metric 3D reasoning, object pointing improving counting, and jigsaw reconstruction improving 2D ordering. Interestingly, we also uncover surprising connections: 2.5D segmentation improving category recognition and Z-depth prediction improving localization. To probe these patterns, we analyze gradient alignment between generation and understanding tasks and find that stronger alignment is associated with larger downstream transfer gains. Together, our results highlight visual generation as a rich source of supervision for visual understanding and provide a roadmap for unlocking its benefits through the right training curriculum and task selection. Project page: https://omni-taskonomy.github.io/.", "arxiv_id": "2609.38079", "arxiv_url": "https://arxiv.org/abs/2609.38079", "authors": ["Jiaxin Ge", "Yiming Qin", "Ji Xie", "Haozhe Jiang", "Xiaochuang Han", "Junyi Zhang", "Andrew Dai", "Yinfei Yang", "Jitendra Malik", "Ranjay Krishna", "Sewon Min", "Haiwen Feng", "Le Xue", "Baifeng Shi", "Trevor Darrell", "XuDong Wang"], "brief": "\u672c\u6587\u7814\u7a76\u56fe\u50cf\u5230\u56fe\u50cf\u751f\u6210\u76d1\u7763\u5728\u4f55\u79cd\u6761\u4ef6\u4e0b\u80fd\u63d0\u5347\u56fe\u50cf\u5230\u6587\u672c\u89c6\u89c9\u7406\u89e3\u80fd\u529b\uff0c\u5e76\u63d0\u51fa OmniTaskonomy\uff1a\u8986\u76d619\u7c7b\u751f\u6210\u4efb\u52a1\u4e0e25\u7c7b\u7406\u89e3\u80fd\u529b\u7684\u7edf\u4e00\u8fc1\u79fb\u5206\u7c7b\u56fe\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u5408\u9002\u8bad\u7ec3\u914d\u65b9\u4e0b\u751f\u6210\u4efb\u52a1\u53ef\u5e26\u6765\u4e0b\u6e38\u7406\u89e3\u589e\u76ca\uff0c\u4e14\u589e\u76ca\u4e0e\u6570\u636e\u89c4\u6a21\u548c\u4efb\u52a1\u68af\u5ea6\u5bf9\u9f50\u7a0b\u5ea6\u76f8\u5173\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/para-lost/OmniTaskonomy", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.38079", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u9020\u53d7\u63a7\u7684 I2I \u751f\u6210\u4e0e I2T \u7406\u89e3\u4efb\u52a1\u5bf9\uff0c\u9a8c\u8bc1\u540c\u4e00\u5e95\u5c42\u95ee\u9898\u5728\u4e0d\u540c\u8f93\u51fa\u6a21\u6001\u95f4\u7684\u8fc1\u79fb\u6548\u679c\u3002", "\u63d0\u51fa OmniTaskonomy\uff0c\u7ed8\u523619\u4e2a\u89c6\u89c9\u751f\u6210\u4efb\u52a1\u523025\u4e2a\u89c6\u89c9\u7406\u89e3\u80fd\u529b\u7684\u9009\u62e9\u6027\u8fc1\u79fb\u56fe\u8c31\u3002", "\u53d1\u73b0\u6df1\u5ea6\u9884\u6d4b\u63d0\u53473D\u5ea6\u91cf\u63a8\u7406\u3001\u7269\u4f53\u6307\u5411\u63d0\u5347\u8ba1\u6570\u7b49\u76f4\u89c2\u5173\u7cfb\uff0c\u4e5f\u53d1\u73b02.5D\u5206\u5272\u63d0\u5347\u7c7b\u522b\u8bc6\u522b\u7b49\u975e\u76f4\u89c2\u8fc1\u79fb\u3002"], "keywords": ["\u89c6\u89c9\u7406\u89e3", "\u89c6\u89c9\u751f\u6210", "\u591a\u6a21\u6001", "\u8fc1\u79fb\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "UC Berkeley", "pdf_url": "https://arxiv.org/pdf/2609.38079v1", "published_at": "2026-09-29", "score": 0.453, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Berkeley", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.38079.png", "title": "OmniTaskonomy: When Does Visual Generation Improve Visual Understanding?", "tldr": "\u7cfb\u7edf\u523b\u753b\u89c6\u89c9\u751f\u6210\u5982\u4f55\u4fc3\u8fdb\u89c6\u89c9\u7406\u89e3", "upvotes": 3, "what_it_is": "\u672c\u6587\u7814\u7a76\u56fe\u50cf\u5230\u56fe\u50cf\u751f\u6210\u76d1\u7763\u5728\u4f55\u79cd\u6761\u4ef6\u4e0b\u80fd\u63d0\u5347\u56fe\u50cf\u5230\u6587\u672c\u89c6\u89c9\u7406\u89e3\u80fd\u529b\uff0c\u5e76\u63d0\u51fa OmniTaskonomy\uff1a\u8986\u76d619\u7c7b\u751f\u6210\u4efb\u52a1\u4e0e25\u7c7b\u7406\u89e3\u80fd\u529b\u7684\u7edf\u4e00\u8fc1\u79fb\u5206\u7c ng blueprints and environments. Using 1.5K high-scoring trajectories generated from Skill2Env environments for supervised fine-tuning, we observe consistent improvements across a broad range of agent benchmarks, demonstrating the effectiveness of capability-oriented environment synthesis for agent post-training.", "arxiv_id": "2609.33772", "arxiv_url": "https://arxiv.org/abs/2609.33772", "authors": ["Weiyi Xu", "Xiaowen Yang", "Wen Da", "Hang Xu", "Canwei Li", "Hongjie You", "Pusen Dong", "Yucheng Zeng", "Zhaokai Luo", "Mu Chuan"], "brief": "\u8bba\u6587\u63d0\u51fa Skill2Env\uff0c\u4e00\u4e2a\u9762\u5411\u80fd\u529b\u9700\u6c42\u7684\u73af\u5883\u5408\u6210\u6846\u67b6\uff1a\u4ece\u5df2\u6709\u6280\u80fd\u51fa\u53d1\uff0c\u751f\u6210\u5177\u5907\u76ee\u6807\u3001\u6311\u6218\u3001\u73af\u5883\u4e8b\u5b9e\u3001\u4fe1\u606f\u8fb9\u754c\u548c\u9a8c\u6536\u6807\u51c6\u7684\u4efb\u52a1\u84dd\u56fe\uff0c\u5e76\u6784\u5efa\u53ef\u6267\u884c\u73af\u5883\u4e0e\u8bc4\u6d4b\u5668\u3002\u8fd8\u63d0\u51fa Iterative Task Hardening\uff0c\u901a\u8fc7\u6c42\u89e3\u8f68\u8ff9\u53cd\u9988\u4e0d\u65ad\u589e\u5f3a\u4efb\u52a1\u96be\u5ea6\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33772", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528\u53ef\u590d\u7528\u7684 difficulty patterns \u8868\u793a\u667a\u80fd\u4f53\u80fd\u529b\u9700\u6c42\uff0c\u5e76\u5b9e\u4f8b\u5316\u4e3a\u4efb\u52a1\u84dd\u56fe\uff0c\u8fde\u63a5\u62bd\u8c61\u6280\u80fd\u4e0e\u5177\u4f53\u53ef\u6267\u884c\u4efb\u52a1\u3002", "\u8054\u5408\u751f\u6210\u4efb\u52a1\u6307\u4ee4\u3001\u6267\u884c\u57fa\u5e95\u3001\u5de5\u4f5c\u7a7a\u95f4\u548c\u57fa\u4e8e rubric \u7684\u8bc4\u4f30\u5668\uff0c\u652f\u6301\u5de5\u5177\u4f7f\u7528\u4e0e\u591a\u6b65\u4ea4\u4e92\u4efb\u52a1\u3002", "\u57fa\u4e8e Skill2Env \u73af\u5883\u751f\u6210\u7684 1.5K \u9ad8\u8d28\u91cf\u8f68\u8ff9\u8fdb\u884c\u76d1\u7763\u5fae\u8c03\uff0c\u5728\u591a\u7c7b\u OLIVE (OnLine InterVEntion). At each iteration, the evolving student policy generates a new prefix, the teacher continues it autoregressively, and the student is updated using cross-entropy computed on the teacher-generated tokens. Each design choice targets a corresponding limitation of existing distillation methods: (1) sequential covariate shift in offline supervised fine-tuning (SFT) on fixed teacher trajectories, (2) fragmented supervision under prefix failure in token-level on-policy distillation (OPD), and (3) the need for access to teacher token probabilities in distribution-matching distillation. OLIVE achieves higher reasoning performance than OPD (with a top-16 KL approximation) at comparable GPU-hour cost. Our asynchronous implementation further reduces OLIVE\u0027s total training time by 23.8\\%. We evaluate OLIVE on both hard reasoning tasks and agentic tasks which reflects modern post-training scenarios, and it consistently outperforms existing distillation methods under the same training budget. By regenerating prefixes from the evolving student, OLIVE continues improving after offline distillation plateaus while better preserving the general capabilities and plasticity of the student. Using only text from GPT-5.4-mini, continuously training with OLIVE outperforms offline SFT from the same teacher by 13\\% on ScienceWorld. These results support OLIVE as an effective and efficient approach to online language-model distillation.", "arxiv_id": "2609.36246", "arxiv_url": "https://arxiv.org/abs/2609.36246", "authors": ["Haojin Wang", "Dylan Zhang", "Huaibo Chen", "Suhao Yu", "Yihang Sun", "Zhanyang Jin", "Jiaying Ye", "Dianqi Li", "Prasanna Sattigeri", "Kamal Youcef-Toumi", "Hao Peng"], "brief": "\u8bba\u6587\u63d0\u51fa OLIVE \u5728\u7ebf\u8bed\u8a00\u6a21\u578b\u84b8\u998f\u65b9\u6cd5\uff1a\u8ba9\u5f53\u524d\u5b66\u751f\u6a21\u578b\u751f\u6210\u524d\u7f00\uff0c\u518d\u7531\u6559\u5e08\u6a21\u578b\u81ea\u56de\u5f52\u7eed\u5199\uff0c\u5e76\u7528\u6559\u5e08\u751f\u6210\u7684 token \u5bf9\u5b66\u751f\u505a\u4ea4\u53c9\u71b5\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u9488\u5bf9\u79bb\u7ebf SFT \u7684\u5206\u5e03\u504f\u79fb\u3001\u5728\u7ebf token \u84b8\u998f\u7684\u76d1\u7763\u788e\u7247\u5316\uff0c\u4ee5\u53ca\u5206\u5e03\u5339\u914d\u84b8\u998f\u5bf9\u6559\u5e08\u6982\u7387\u8bbf\u95ee\u7684\u4f9d\u8d56\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36246", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6bcf\u8f6e\u8bad\u7ec3\u90fd\u57fa\u4e8e\u5b66\u751f\u5f53\u524d\u7b56\u7565\u751f\u6210\u65b0\u524d\u7f00\uff0c\u518d\u8ba9\u6559\u5e08\u4ece\u8be5\u72b6\u6001\u7ee7\u7eed\u751f\u6210\uff0c\u4ece\u800c\u7f13\u89e3\u5b66\u751f\u63a8\u7406\u8f68\u8ff9\u4e2d\u7684\u534f\u53d8\u91cf\u504f\u79fb", "\u65e0\u9700\u8bbf\u95ee\u6559\u5e08 token \u6982\u7387\uff0c\u53ea\u4f7f\u7528\u6559\u5e08\u751f\u6210\u6587\u672c\u5373\u53ef\u8bad\u7ec3\uff0c\u6210\u672c\u4e0e OPD \u76f8\u8fd1\u4f46\u63a8\u7406\u8868\u73b0\u66f4\u597d", "\u5f02\u6b65\u5b9e\u73b0\u5c06\u603b\u8bad\u7ec3\u65f6\u95f4\u964d\u4f4e 23.8%\uff0c\u5728\u56f0\u96be\u63a8\u7406\u4e0e ScienceWorld \u7b49\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u5747\u4f18\u4e8e\u540c\u9884\u7b97\u84b8\u998f\u65b9\u6cd5"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u540e\u8bad\u7ec3", "\u63a8\u7406", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "University of Illinois at Urbana-Champaign", "pdf_url": "https://arxiv.org/pdf/2609.36246v1", "published_at": "2026-09-28", "score": 0.428, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36246.png", "title": "Learning from Teacher Continuations at Student States", "tldr": "OLIVE\u7528\u5b66\u751f\u72b6\u6001\u7eed\u5199\u63d0\u5347\u5728\u7ebf\u84b8\u998f", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa OLIVE \u5728\u7ebf\u8bed\u8a00\u6a21\u578b\u84b8\u998f\u65b9\u6cd5\uff1a\u8ba9\u5f53\u524d\u5b66\u751f\u6a21\u578b\u751f\u6210\u524d\u7f00\uff0c\u518d\u7531\u6559\u5e08\u6a21\u578b\u81ea\u56de\u5f52\u7eed\u5199\uff0c\u5e76\u7528\u6559\u5e08\u751f\u6210\u7684 token \u5bf9\u5b66\u751f\u505a\u4ea4\u53c9\u71b5\u8bad\u7ec3\u3002\u8be5\u65b9\u6cd5\u9488\u5bf9\u79bb\u7ebf SFT \u7684\u5206\u5e03\u504f\u79fb\u3001\u5728\u7ebf token \u84b8\u998f\u7684\u76d1\u7763\u788e\u7247\u5316\uff0c\u4ee5\u53ca\u5206\u5e03\u5339\u914d\u84b8\u998f\u5bf9\u6559\u5e08\u6982\u7387\u8bbf\u95ee\u7684\u4f9d\u8d56\u3002", "why_notable": "OLIVE \u63d0\u4f9b\u4e86\u4e00\u79cd\u66f4\u8d34\u8fd1\u5b66\u751f\u5b9e\u9645\u72b6\u6001\u7684\u5728\u7ebf\u84b8\u998f\u8303\u5f0f\uff0c\u5728\u79bb\u7ebf\u84b8\u998f\u505c\u6ede\u540e\u4ecd\u80fd\u6301\u7eed\u63d0\u5347\uff0c\u5e76\u66f4\u597d\u4fdd\u7559\u5b66\u751f\u6a21\u578b\u7684\u901a\u7528\u80fd\u529b\u4e0e\u53ef\u5851\u6027\uff0c\u5bf9\u4f4e\u6210\u672c\u540e\u8bad\u7ec3\u548c\u667a\u80fd\u4f53\u80fd\u529b\u8fc1\u79fb\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Executable programs offer explicit control over how images and videos are constructed, but generating runnable code is only the beginning of visual creation. A program can execute correctly while violating the requested composition, appearance, or motion. We define this discrepancy as the Program-to-Visual (P2V) gap and introduce MaLiang-Harness, a unified framework for organizing MLLM-driven visual generation into a persistent process of construction, inspection, and revision. Its central design is to make the evolving visual program, its construction history, and its verification share a common revision reference. We define the Persistent Executable Generation (PEG) state as preserving programs and task context. Traceable Generation Process (TGP) connects edits to rendered evidence, and Revision-aware Editing and Verification (REV) supports restoration and checks the current revision before completion. Together, these mechanisms coordinate planning, execution, and visual feedback across rendering backends. We evaluate 11 powerful closed-source MLLMs on MaLiang-IBench and four on MaLiang-VBench, measuring generation success, visual quality, and computational cost. GPT-6-Astra achieves 100% generation success on both benchmarks, with 96.0% of image tasks and 76.9% of video tasks meeting all quality thresholds. The comparison also reveals a mismatch between general capability scores and visual generation performance, with similarly scored models differing substantially in their ability to satisfy visual requirements. MaLiang-Harness provides a systematic basis for studying how MLLMs translate executable code into visual outcomes, exposing both the potential of programmable generation and the limitations of general benchmarks as predictors of this ability. The project is available at https://github.com/gulucaptain/MaLiang-Harness.", "arxiv_id": "2609.34309", "arxiv_url": "https://arxiv.org/abs/2609.34309", "authors": ["Haoyu Zhao", "Zihao Zhang", "Xudong Wang", "Jiaxi Gu", "Zuxuan Wu", "Yu-Gang Jiang", "Shuicheng Yan"], "brief": "\u8bba\u6587\u63d0\u51fa MaLiang-Harness\uff0c\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u9a71\u52a8\u7684\u89c6\u89c9\u751f\u6210\u7ec4\u7ec7\u4e3a\u201c\u6784\u5efa\u2014\u68c0\u67e5\u2014\u4fee\u8ba2\u201d\u7684\u6301\u7eed\u8fc7\u7a0b\uff0c\u7528\u53ef\u6267\u884c\u7a0b\u5e8f\u6765\u663e\u5f0f\u63a7\u5236\u56fe\u50cf\u548c\u89c6\u9891\u751f\u6210\u3002\u5b83\u5b9a\u4e49\u5e76\u7f13\u89e3 Program-to-Visual\uff08P2V\uff09\u5dee\u8ddd\uff0c\u5373\u4ee3\u7801\u80fd\u8fd0\u884c\u4f46\u89c6\u89c9\u7ed3\u679c\u4e0d\u6ee1\u8db3\u6784\u56fe\u3001\u5916\u89c2\u6216\u8fd0\u52a8\u8981\u6c42\u7684\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/gulucaptain/MaLiang-Harness", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.34309", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51fa PEG\u3001TGP\u3001REV \u4e09\u4e2a\u673a\u5236\uff1a\u4fdd\u7559\u7a0b\u5e8f\u4e0e\u4efb\u52a1\u4e0a\u4e0b\u6587\u3001\u8ffd\u8e2a\u7f16\u8f91\u4e0e\u6e32\u67d3\u8bc1\u636e\u3001\u5728\u5b8c\u6210\u524d\u652f\u6301\u56de\u6eda\u4e0e\u8d28\u91cf\u68c0\u67e5\u3002", "\u5728 MaLiang-IBench \u548c MaLiang-VBench \u4e0a\u8bc4\u6d4b 11 \u4e2a\u95ed\u6e90 MLLM \u7684\u56fe\u50cf\u751f\u6210\u80fd\u529b\u4e0e 4 \u4e2a\u6a21\u578b\u7684\u89c6\u9891\u751f\u6210\u80fd\u529b\u3002", "GPT-6-Astra \u5728\u56fe\u50cf\u548c\u89c6\u9891\u4efb\u52a1\u4e0a\u5747\u8fbe\u5230 100% \u751f\u6210\u6210\u529f\u7387\uff0c\u4f46\u89c6\u9891\u8d28\u91cf\u8fbe\u6807\u7387\u4ecd\u4f4e\u4e8e\u56fe\u50cf\uff0c\u663e\u793a\u53ef\u7f16\u7a0b\u89c6\u9891\u751f\u6210\u66f4\u5177\u6311\u6218\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u751f\u6210", "\u89c6\u9891\u751f\u6210", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "National University of Singapore", "pdf_url": "https://arxiv.org/pdf/2609.34309v1", "published_at": "2026-09-28", "score": 0.427, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NUS", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34309.png", "title": "MaLiang-Harness: A Programmable Path to Image and Video Generation", "tldr": "\u7528\u53ef\u6267\u884c\u7a0b\u5e8f\u95ed\u73af\u6539\u8fdb\u56fe\u50cf\u89c6\u9891\u751f\u6210", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa MaLiang-Harness\uff0c\u5c06\u591a\u6a21\u6001\u5927\u6a21\u578b\u9a71\u52a8\u7684\u89c6\u89c9\u751f\u6210\u7ec4\u7ec7\u4e3a\u201c\u6784\u5efa\u2014\u68c0\u67e5\u2014\u4fee\u8ba2\u201d\u7684\u6301\u7eed\u8fc7\u7a0b\uff0c\u7528\u53ef\u6267\u884c\u7a0b\u5e8f\u6765\u663e\u5f0f\u63a7\u5236\u56fe\u50cf\u548c\u89c6\u9891\u751f\u6210\u3002\u5b83\u5b9a\u4e49\u5e76\u7f13\u89e3 Program-to-Visual\uff08P2V\uff09\u5dee\u8ddd\uff0c\u5373\u4ee3\u7801\u80fd\u8fd0\u884c\u4f46\u89c6\u89c9\u7ed3\u679c\u4e0d\u6ee1\u8db3\u6784\u56fe\u3001\u5916\u89c2\u6216\u8fd0\u52a8\u8981\u6c42\u7684\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u201c\u751f\u6210\u4ee3\u7801\u201d\u6269\u5c55\u4e3a\u53ef\u8ffd\u8e2a\u3001\u53ef\u9a8c\u8bc1\u3001\u53ef\u4fee\u8ba2\u7684\u89c6\u89c9\u751f\u6210\u6d41\u7a0b\uff0c\u4e3a\u7814\u7a76 MLLM \u5982\u4f55\u5c06\u7a0b\u5e8f\u8f6c\u5316\u4e3a\u89c6\u89c9\u7ed3\u679c\u63d0\u4f9b\u4e86\u7cfb\u7edf\u57fa\u51c6\uff1b\u540c\u65f6\u63ed\u793a\u901a\u7528\u6a21\u578b\u80fd\u529b\u699c\u5355\u5e76\u4e0d\u80fd\u53ef\u9760\u9884\u6d4b\u53ef\u7f16\u7a0b\u89c6\u89c9\u751f\u6210\u8868\u73b0\u3002"}, {"abstract": "Learning from experience in LLM agents has become a key paradigm for developing self-evolving agents that continuously learn and expand their capabilities. Within this paradigm, synthesizing the agent skill has emerged as a promising solution for transforming accumulated experience into reusable procedural knowledge, serving as an important layer for the harness system that supplies agents at runtime. Despite its potential, existing approaches largely abstract past experience into fixed procedural knowledge before downstream demands are known, which risks discarding knowledge that later becomes critical while retaining instance-specific details irrelevant to future tasks. In this paper, we reframe agent skill synthesis as a dynamic navigation problem over past experience, where agents actively explore accumulated trajectories on demand for the current task with targeted and fine-grained access to experience knowledge. To this end, we propose ExpVoyager, a novel framework in which a skill curator navigates raw experience across different views and resolutions, continually identifying reusable procedural knowledge from what it observes while tracking remaining knowledge needs that guide where to navigate next. Extensive experiments demonstrate both the effectiveness and versatility of ExpVoyager, showing consistent improvements in downstream task performance, continual gains as the experience space scales, and practical compatibility with existing skills under efficient experience access.", "arxiv_id": "2609.32630", "arxiv_url": "https://arxiv.org/abs/2609.32630", "authors": ["Kwangwook Seo", "Dongha Lee"], "brief": "\u8bba\u6587\u63d0\u51fa ExpVoyager\uff0c\u5c06\u667a\u80fd\u4f53\u6280\u80fd\u5408\u6210\u91cd\u6784\u4e3a\u5bf9\u5386\u53f2\u7ecf\u9a8c\u7684\u52a8\u6001\u5bfc\u822a\u95ee\u9898\u3002\u5b83\u8ba9\u6280\u80fd\u7b56\u5c55\u5668\u6839\u636e\u5f53\u524d\u4efb\u52a1\u9700\u6c42\uff0c\u5728\u539f\u59cb\u7ecf\u9a8c\u7684\u4e0d\u540c\u89c6\u56fe\u4e0e\u7c92\u5ea6\u95f4\u63a2\u7d22\uff0c\u63d0\u53d6\u53ef\u590d\u7528\u7684\u7a0b\u5e8f\u6027\u77e5\u8bc6\u3002", "categories": ["cs.CL"], "github_repo": "https://github.com/tommyEzreal/ExpVoyager", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.32630", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4e0d\u540c\u4e8e\u5148\u79bb\u7ebf\u538b\u7f29\u7ecf\u9a8c\u4e3a\u56fa\u5b9a\u6280\u80fd\uff0cExpVoyager \u5728\u4e0b\u6e38\u4efb\u52a1\u5df2\u77e5\u540e\u6309\u9700\u8bbf\u95ee\u7ecf\u9a8c\uff0c\u51cf\u5c11\u5173\u952e\u4fe1\u606f\u4e22\u5931\u4e0e\u65e0\u5173\u7ec6\u8282\u4fdd\u7559", "\u6280\u80fd\u7b56\u5c55\u5668\u6301\u7eed\u8ddf\u8e2a\u5f53\u524d\u4efb\u52a1\u7684\u77e5\u8bc6\u7f3a\u53e3\uff0c\u5e76\u636e\u6b64\u51b3\u5b9a\u4e0b\u4e00\u6b65\u5bfc\u822a\u54ea\u4e9b\u8f68\u8ff9\u3001\u89c6\u56fe\u548c\u5206\u8fa8\u7387", "\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u7a33\u5b9a\u63d0\u5347\u4e0b\u6e38\u4efb\u52a1\u8868\u73b0\uff0c\u4e14\u968f\u7ecf\u9a8c\u5e93\u89c4\u6a21\u6269\u5927\u6301\u7eed\u83b7\u76ca\uff0c\u5e76\u53ef\u4e0e\u5df2\u6709\u6280\u80fd\u4f53\u7cfb\u9ad8\u6548\u517c\u5bb9"], "keywords": ["\u667a\u80fd\u4f53", "\u7ecf\u9a8c\u5b66\u4e60", "\u6280\u80fd\u5408\u6210", "\u6301\u7eed\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "Data \u0026 Language Intelligence Lab", "pdf_url": "https://arxiv.org/pdf/2609.32630v1", "published_at": "2026-09-26", "score": 0.423, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32630.png", "title": "ExpVoyager: Direct Experience Navigation for Dynamic Agent Skill Synthesis", "tldr": "\u6309\u9700\u5bfc\u822a\u7ecf\u9a8c\u8f68\u8ff9\uff0c\u52a8\u6001\u5408\u6210\u667a\u80fd\u4f53\u6280\u80fd", "upvotes": 9, "what_it_is": "\u8bba\u6587\u63d0\u51fa ExpVoyager\uff0c\u5c06\u667a\u80fd\u4f53\u6280\u80fd\u5408\u6210\u91cd\u6784\u4e3a\u5bf9\u5386\u53f2\u7ecf\u9a8c\u7684\u52a8\u6001\u5bfc\u822a\u95ee\u9898\u3002\u5b83\u8ba9\u6280\u80fd\u7b56\u5c55\u5668\u6839\u636e\u5f53\u524d\u4efb\u52a1\u9700\u6c42\uff0c\u5728\u539f\u59cb\u7ecf\u9a8c\u7684\u4e0d\u540c\u89c6\u56fe\u4e0e\u7c92\u5ea6\u95f4\u63a2\u7d22\uff0c\u63d0\u53d6\u53ef\u590d\u7528\u7684\u7a0b\u5e8f\u6027\u77e5\u8bc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a LLM \u667a\u80fd\u4f53\u7684\u7ecf\u9a8c\u5b66\u4e60\u63d0\u4f9b\u4e86\u66f4\u7075\u6d3b\u7684\u6280\u80fd\u5408\u6210\u8303\u5f0f\uff0c\u4ece\u201c\u9884\u5148\u62bd\u8c61\u201d\u8f6c\u5411\u201c\u4efb\u52a1\u9a71\u52a8\u68c0\u7d22\u4e0e\u63d0\u70bc\u201d\uff0c\u6709\u52a9\u4e8e\u6784\u5efa\u6301\u7eed\u5b66\u4e60\u3001\u81ea\u6211\u8fdb\u5316\u7684\u667a\u80fd\u4f53\u7cfb\u7edf\u3002"}, {"abstract": "As large language models advance, AI agents are moving beyond isolated, domain-specific tasks toward long-horizon, cross-domain workflows. This transition exposes two challenges: increasing harness complexity makes manual design difficult to scale, while tighter coupling to specific domains limits the generality of a single harness. The central question thus shifts from how to engineer a stronger harness for one domain to how to autonomously construct specialized harnesses, improve them through experience, and orchestrate them across domains. We introduce Raven, \\emph{The Harness of Harnesses}, an open-source multi-agent ecosystem that automatically constructs and evolves modular harnesses for specific models and domains, treating each executable model--harness pair as a composable unit of intelligence. To support an \\emph{All-Domain Collaboration Network}, its Host Agent decomposes goals, matches subtasks to specialized agents, coordinates execution dependencies, and integrates results, while a host archive and EverOS preserve experience across tasks and Skill Forge makes that experience available as reusable procedures. Our theory establishes sufficient conditions for such composition to expand reliable task coverage beyond that of the available individual agents under a shared resource budget. On complex and long-horizon tasks, Raven significantly outperforms the state-of-the-art agent systems, pushing the frontier of composable agentic intelligence.", "arxiv_id": "2609.33439", "arxiv_url": "https://arxiv.org/abs/2609.33439", "authors": ["EverMind AI"], "brief": "\u8bba\u6587\u63d0\u51fa Raven\uff0c\u4e00\u4e2a\u5f00\u6e90\u201charness \u7684 harness\u201d\u591a\u667a\u80fd\u4f53\u751f\u6001\uff0c\u53ef\u81ea\u52a8\u4e3a\u4e0d\u540c\u6a21\u578b\u4e0e\u9886\u57df\u6784\u5efa\u3001\u6f14\u5316\u6a21\u5757\u5316\u6267\u884c\u6846\u67b6\u3002\u5b83\u5c06\u6a21\u578b-harness \u7ec4\u5408\u89c6\u4e3a\u53ef\u7ec4\u5408\u667a\u80fd\u5355\u5143\uff0c\u5e76\u901a\u8fc7\u4e3b\u63a7\u667a\u80fd\u4f53\u8de8\u9886\u57df\u5206\u89e3\u3001\u8c03\u5ea6\u548c\u6574\u5408\u4efb\u52a1\u3002", "categories": ["cs.AI", "cs.CL", "cs.GT", "cs.MA", "cs.NE"], "github_repo": "https://github.com/EverMind-AI/Raven", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33439", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["Host Agent \u8d1f\u8d23\u76ee\u6807\u5206\u89e3\u3001\u5b50\u4efb\u52a1\u5339\u914d\u3001\u4f9d\u8d56\u534f\u8c03\u4e0e\u7ed3\u679c\u96c6\u6210\uff0c\u652f\u6301\u8de8\u9886\u57df\u534f\u4f5c\u7f51\u7edc\u3002", "host archive\u3001EverOS \u4e0e Skill Forge \u7528\u4e8e\u6c89\u6dc0\u4efb\u52a1\u7ecf\u9a8c\uff0c\u5e76\u5c06\u5176\u8f6c\u5316\u4e3a\u53ef\u590d\u7528\u6d41\u7a0b\u548c\u6280\u80fd\u3002", "\u7406\u8bba\u4e0a\u7ed9\u51fa\u7ec4\u5408\u6269\u5c55\u53ef\u9760\u4efb\u52a1\u8986\u76d6\u7684\u5145\u5206\u6761\u4ef6\uff0c\u5e76\u5728\u590d\u6742\u957f\u7a0b\u4efb\u52a1\u4e0a\u4f18\u4e8e\u73b0\u6709\u667a\u80fd\u4f53\u7cfb\u7edf\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u4efb\u52a1\u89c4\u5212"], "num_comments": 1, "on_hf": true, "organization": "EverMind", "pdf_url": "https://arxiv.org/pdf/2609.33439v1", "published_at": "2026-09-27", "score": 0.373, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (1\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33439.png", "title": "Raven: The Harness of Harnesses for Composable Agentic Intelligence", "tldr": "\u53ef\u7ec4\u5408\u591a\u667a\u80fd\u4f53\u81ea\u52a8\u6784\u5efa\u9886\u57df\u5de5\u5177\u94fe", "upvotes": 1, "what_it_is": "\u8bba\u6587\u63d0\u51fa Raven\uff0c\u4e00\u4e2a\u5f00\u6e90\u201charness \u7684 harness\u201d\u591a\u667a\u80fd\u4f53\u751f\u6001\uff0c\u53ef\u81ea\u52a8\u4e3a\u4e0d\u540c\u6a21\u578b\u4e0e\u9886\u57df\u6784\u5efa\u3001\u6f14\u5316\u6a21\u5757\u5316\u6267\u884c\u6846\u67b6\u3002\u5b83\u5c06\u6a21\u578b-harness \u7ec4\u5408\u89c6\u4e3a\u53ef\u7ec4\u5408\u667a\u80fd\u5355\u5143\uff0c\u5e76\u901a\u8fc7\u4e3b\u63a7\u667a\u80fd\u4f53\u8de8\u9886\u57df\u5206\u89e3\u3001\u8c03\u5ea6\u548c\u6574\u5408\u4efb\u52a1\u3002", "why_notable": "\u5b83\u628a\u667a\u80fd\u4f53\u7cfb\u7edf\u4ece\u201c\u4e3a\u5355\u4e00\u9886\u57df\u624b\u5de5\u8bbe\u8ba1 harness\u201d\u63a8\u8fdb\u5230\u201c\u81ea\u52a8\u751f\u6210\u5e76\u7ec4\u5408\u4e13\u7528 harness\u201d\uff0c\u6709\u671b\u63d0\u5347\u957f\u7a0b\u3001\u8de8\u9886\u57df\u4efb\u52a1\u7684\u53ef\u6269\u5c55\u6027\u4e0e\u6cdb\u5316\u80fd\u529b\u3002"}, {"abstract": "Vision-language-action (VLA) and world-action (WAM) models map observations and instructions directly to robot actions. This directness ties a policy to training: minor layout or viewpoint changes cause failure, and instructions generalize poorly. The root cause lies in representation: task requirements, conditions, progress, and failure recovery are implicitly encoded in action sequences, making them difficult to inspect or revise. Digital coding agents offer a precedent: LLMs call tools, verify results, and revise from feedback as executable code. The same working pattern of explicit state, manageable execution, and revisable procedures underlies generalization and long-horizon execution in the physical world, letting physical experience return as reusable programs, memory, or evidence. We propose Physical Coding, representing task state and execution as code. Code as World records objects, relations, constraints, and progress; Code as Policy organizes planning, verification, recovery, and execution. We build HexaAnything, which calls perception, planning, and control tools, including VLA/WAM policies, and makes in-the-loop decisions from external feedback. Verified traces become data and memory, enabling evolution from tools and Harness to model weights, architectures, and ultimately hardware and task design. On RoboCasa365, HexaAnything improves Composite-Unseen and overall success over XR-1 VLA, and its Harness-trained HexaModel beats the base on every split, indicating code traces internalize physical execution. On PhyBench and a dual-arm AgileX robot, the agent autonomously completes physics experiments and most tabletop tasks, often faster than published results. We observe data, model, and tool self-evolution; future work targets weight internalization, autonomous redesign of architectures, languages, representations, and tasks, and deployment in manufacturing and science.", "arxiv_id": "2609.35432", "arxiv_url": "https://arxiv.org/abs/2609.35432", "authors": ["Hongcheng Gao", "Jingjing Zhou", "Zelin Zheng", "Shijia Ge", "Jay Zhu", "Yazhe Wang", "Jianshu Zeng", "Xuan Shangguan", "Di Wu", "Lingyu He", "Zhiqi Jia", "Sihang Wu", "Xiao He"], "brief": "\u8bba\u6587\u63d0\u51fa Physical Coding\uff0c\u5c06\u7269\u7406\u4efb\u52a1\u4e2d\u7684\u5bf9\u8c61\u3001\u5173\u7cfb\u3001\u7ea6\u675f\u3001\u8fdb\u5ea6\u548c\u6062\u590d\u903b\u8f91\u663e\u5f0f\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\uff0c\u5e76\u6784\u5efa HexaAnything \u673a\u5668\u4eba\u7f16\u7801\u667a\u80fd\u4f53\u3002\u8be5\u7cfb\u7edf\u8c03\u7528\u611f\u77e5\u3001\u89c4\u5212\u3001\u63a7\u5236\u53ca VLA/WAM \u5de5\u5177\uff0c\u901a\u8fc7\u5916\u90e8\u53cd\u9988\u9a8c\u8bc1\u548c\u4fee\u6b63\u6267\u884c\u8f68\u8ff9\uff0c\u5e76\u5c06\u6210\u529f\u8f68\u8ff9\u6c89\u6dc0\u4e3a\u6570\u636e\u4e0e\u8bb0\u5fc6\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/HexaFuture/PhysicalCoding", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2609.35432", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u63d0\u51fa Code as World \u4e0e Code as Policy\uff1a\u524d\u8005\u8bb0\u5f55\u7269\u7406\u4e16\u754c\u72b6\u6001\u548c\u4efb\u52a1\u8fdb\u5c55\uff0c\u540e\u8005\u7ec4\u7ec7\u89c4\u5212\u3001\u9a8c\u8bc1\u3001\u6062\u590d\u4e0e\u6267\u884c\u6d41\u7a0b\u3002", "HexaAnything \u53ef\u96c6\u6210 VLA/WAM \u7b49\u5e95\u5c42\u7b56\u7565\uff0c\u5728\u6267\u884c\u4e2d\u6839\u636e\u53cd\u9988\u8fdb\u884c\u51b3\u7b56\u3001\u7ea0\u9519\u548c\u957f\u7a0b\u4efb\u52a1\u7ba1\u7406\u3002", "\u5728 RoboCasa365\u3001PhyBench \u548c\u53cc\u81c2 AgileX \u673a\u5668\u4eba\u4e0a\u53d6\u5f97\u4f18\u4e8e\u57fa\u7ebf\u7684\u6210\u529f\u7387\uff0c\u5e76\u5c55\u793a\u6570\u636e\u3001\u6a21\u578b\u548c\u5de5\u5177\u5c42\u9762\u7684\u81ea\u8fdb\u5316\u8ff9\u8c61\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba", "\u5177\u8eab\u667a\u80fd", "\u4ee3\u7801\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "HexaFuture", "pdf_url": "https://arxiv.org/pdf/2609.35432v1", "published_at": "2026-09-28", "score": 0.355, "selected_reasons": ["HF trending (93\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35432.png", "title": "Self-Evolving Coding Agents: From Digital Programs to Physical-World Intelligence", "tldr": "\u7528\u4ee3\u7801\u8868\u793a\u673a\u5668\u4eba\u4efb\u52a1\u72b6\u6001\u4e0e\u7b56\u7565\uff0c\u5b9e\u73b0\u81ea\u8fdb\u5316\u5177\u8eab\u667a\u80fd\u3002", "upvotes": 93, "what_it_is": "\u8bba\u6587\u63d0\u51fa Physical Coding\uff0c\u5c06\u7269\u7406\u4efb\u52a1\u4e2d\u7684\u5bf9\u8c61\u3001\u5173\u7cfb\u3001\u7ea6\u675f\u3001\u8fdb\u5ea6\u548c\u6062\u590d\u903b\u8f91\u663e\u5f0f\u8868\u793a\u4e3a\u53ef\u6267\u884c\u4ee3\u7801\uff0c\u5e76\u6784\u5efa HexaAnything \u673a\u5668\u4eba\u7f16\u7801\u667a\u80fd\u4f53\u3002\u8be5\u7cfb\u7edf\u8c03\u7528\u611f\u77e5\u3001\u89c4\u5212\u3001\u63a7\u5236\u53ca VLA/WAM \u5de5\u5177\uff0c\u901a\u8fc7\u5916\u90e8\u53cd\u9988\u9a8c\u8bc1\u548c\u4fee\u6b63\u6267\u884c\u8f68\u8ff9\uff0c\u5e76\u5c06\u6210\u529f\u8f68\u8ff9\u6c89\u6dc0\u4e3a\u6570\u636e\u4e0e\u8bb0\u5fc6\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u6570\u5b57\u4e16\u754c\u7f16\u7801\u667a\u80fd\u4f53\u7684\u201c\u5de5\u5177\u8c03\u7528\u2014\u9a8c\u8bc1\u2014\u53cd\u9988\u4fee\u6b63\u201d\u8303\u5f0f\u8fc1\u79fb\u5230\u673a\u5668\u4eba\u9886\u57df\uff0c\u7f13\u89e3\u7aef\u5230\u7aef VLA/WAM \u5bf9\u5e03\u5c40\u3001\u89c6\u89d2\u548c\u6307\u4ee4\u53d8\u5316\u6cdb\u5316\u5dee\u7684\u95ee\u9898\uff0c\u4e3a\u53ef\u89e3\u91ca\u3001\u53ef\u590d\u7528\u3001\u53ef\u81ea\u8fdb\u5316\u7684\u5177\u8eab\u667a\u80fd\u63d0\u4f9b\u4e86\u65b0\u8def\u7ebf\u3002"}, {"abstract": "Reinforcement learning can turn one language model into several specialists, each excellent at a single skill such as mathematics, coding or following instructions, but users need one model with all of these skills. Multi-teacher on-policy distillation (MOPD) merges them by letting the specialists teach one student: the student answers each prompt, and the specialist for that prompt\u0027s domain gives feedback on every token. This routing decides which specialist teaches, but not how strongly its feedback moves the shared student. In Qwen3.5 models at three sizes, we find that MOPD\u0027s student does not beat one taught by the best single specialist and gains little of the mathematics specialist\u0027s advantage. The feedback is unbalanced: instruction-following feedback is several times more spread out than mathematics feedback and dominates the student\u0027s updates. We propose Domain-Normalized MOPD (DN-MOPD), which keeps the routing and rescales each domain\u0027s feedback by its measured spread. On six public benchmarks, DN-MOPD improves the average score over MOPD at every size, across three random seeds and under two answer-length limits, and recovers most of the lost mathematics gain. Controls with fixed domain weights show that the gain comes mainly from turning down instruction-following feedback rather than turning up mathematics alone, and that fixed weights close to those DN-MOPD measures perform comparably. Combining specialists therefore requires deciding not only which one teaches, but also how strongly its feedback counts.", "arxiv_id": "2609.35347", "arxiv_url": "https://arxiv.org/abs/2609.35347", "authors": ["Xin Li", "Hao Jiang", "Xin Gao", "Annan Wang", "Yuchen Xie", "Jinghao Guo", "Xingwei Qu", "Yichi Zhang", "Chau Yuen"], "brief": "\u8bba\u6587\u7814\u7a76\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\uff0c\u4e0d\u540c\u9886\u57df\u6559\u5e08\u53cd\u9988\u5f3a\u5ea6\u5931\u8861\u5bfc\u81f4\u5b66\u751f\u6a21\u578b\u96be\u4ee5\u878d\u5408\u591a\u9879\u80fd\u529b\u7684\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51fa DN-MOPD\uff0c\u5728\u4fdd\u7559\u9886\u57df\u8def\u7531\u7684\u540c\u65f6\u6309\u5404\u9886\u57df\u53cd\u9988\u5206\u5e03\u5c3a\u5ea6\u8fdb\u884c\u5f52\u4e00\u5316\u91cd\u52a0\u6743\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/LiXin97/DN-MOPD", "github_stars": 10, "hf_url": "https://huggingface.co/papers/2609.35347", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728 Qwen3.5 \u4e09\u79cd\u89c4\u6a21\u6a21\u578b\u4e0a\u53d1\u73b0\uff0c\u4f20\u7edf MOPD \u5b66\u751f\u6a21\u578b\u751a\u81f3\u96be\u8d85\u6700\u4f73\u5355\u4e00\u4e13\u5bb6\uff0c\u4e14\u6570\u5b66\u4e13\u5bb6\u4f18\u52bf\u5927\u91cf\u4e22\u5931\u3002", "\u8bca\u65ad\u663e\u793a\u6307\u4ee4\u8ddf\u968f\u9886\u57df\u7684\u53cd\u9988\u5206\u5e03\u66f4\u5206\u6563\uff0c\u66f4\u65b0\u5f71\u54cd\u663e\u8457\u5927\u4e8e\u6570\u5b66\u9886\u57df\uff0c\u4ece\u800c\u4e3b\u5bfc\u5171\u4eab\u5b66\u751f\u6a21\u578b\u8bad\u7ec3\u3002", "DN-MOPD \u5728\u516d\u4e2a\u516c\u5f00\u57fa\u51c6\u3001\u4e09\u79cd\u968f\u673a\u79cd\u5b50\u548c\u4e24\u79cd\u7b54\u6848\u957f\u5ea6\u9650\u5236\u4e0b\u5747\u4f18\u4e8e MOPD\uff0c\u5e76\u6062\u590d\u5927\u90e8\u5206\u6570\u5b66\u80fd\u529b\u589e\u76ca\u3002"], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u878d\u5408"], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2609.35347v1", "published_at": "2026-09-28", "score": 0.332, "selected_reasons": ["HF trending (140\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35347.png", "title": "Beyond Teacher Assignment: Domain-Normalized Multi-Teacher On-Policy Distillation", "tldr": "\u6309\u9886\u57df\u5f52\u4e00\u5316\u53cd\u9988\uff0c\u6539\u8fdb\u591a\u6559\u5e08\u84b8\u998f", "upvotes": 140, "what_it_is": "\u8bba\u6587\u7814\u7a76\u591a\u6559\u5e08\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u4e2d\uff0c\u4e0d\u540c\u9886\u57df\u6559\u5e08\u53cd\u9988\u5f3a\u5ea6\u5931\u8861\u5bfc\u81f4\u5b66\u751f\u6a21\u578b\u96be\u4ee5\u878d\u5408\u591a\u9879\u80fd\u529b\u7684\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51fa DN-MOPD\uff0c\u5728\u4fdd\u7559\u9886\u57df\u8def\u7531\u7684\u540c\u65f6\u6309\u5404\u9886\u57df\u53cd\u9988\u5206\u5e03\u5c3a\u5ea6\u8fdb\u884c\u5f52\u4e00\u5316\u91cd\u52a0\u6743\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u591a\u4e13\u5bb6\u5408\u5e76\u4e0d\u4ec5\u8981\u51b3\u5b9a\u201c\u7531\u8c01\u6559\u5b66\u201d\uff0c\u8fd8\u8981\u6821\u51c6\u201c\u53cd\u9988\u6743\u91cd\u591a\u5927\u201d\uff0c\u4e3a\u6784\u5efa\u517c\u5177\u6570\u5b66\u3001\u4ee3\u7801\u3001\u6307\u4ee4\u8ddf\u968f\u7b49\u80fd\u529b\u7684\u901a\u7528\u8bed\u8a00\u6a21\u578b\u63d0\u4f9b\u4e86\u7b80\u5355\u6709\u6548\u7684\u84b8\u998f\u6539\u8fdb\u65b9\u6848\u3002"}, {"abstract": "Unified multimodal models can both look at and render images, so in principle they can repair their own generations: diagnose what an image gets wrong, revise it, observe the result, and diagnose again. Whether a revision helps is known only after it is rendered, so the reflection text and the image generation must be learned jointly, over the whole loop. Supervised fine-tuning (SFT) on reflection trajectories gives a cold start but does not find the high-success repair paths, and naive RL that optimizes only the renderer or only one head leaves most of the gain untapped. We introduce UMM-Reflection, which applies reinforcement learning (RL) to complete reflection trajectories inside one unified model: sibling trajectories share one initial image, so the group-relative advantage compares reflection strategies, and one trajectory-level advantage updates both the reflection tokens and the flow-based revisions, avoiding the combinatorial blow-up of per-round credit assignment. Unlike single-round editing or pipelines with an external critic, credit flows across rounds and to both roles of the same model, and no verifier is needed at inference. On BAGEL, UMM-Reflection improves GenEval by 12.05 points over SFT, and the gains transfer to WISE (+10.97), OneIG-Bench (+3.48), and T2I-CompBench++ (+4.63), none of which is used in training.", "arxiv_id": "2609.35767", "arxiv_url": "https://arxiv.org/abs/2609.35767", "authors": ["Yijia Fan", "Ziqi Huang", "Zhongang Cai", "Yan Li", "Zimo Wen", "Wanqi Yin", "Haiwen Diao", "Ziwei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa UMM-Reflection\uff0c\u8ba9\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u5728\u751f\u6210\u56fe\u50cf\u540e\u8fdb\u884c\u8bca\u65ad\u3001\u4fee\u6539\u3001\u518d\u89c2\u5bdf\u7684\u591a\u8f6e\u81ea\u6211\u53cd\u601d\u3002\u65b9\u6cd5\u7528\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u8054\u5408\u4f18\u5316\u53cd\u601d\u6587\u672c\u4e0e\u56fe\u50cf\u4fee\u8ba2\uff0c\u4f7f\u540c\u4e00\u4e2a\u6a21\u578b\u540c\u65f6\u5b66\u4f1a\u201c\u770b\u95ee\u9898\u201d\u548c\u201c\u6539\u56fe\u201d\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/waltstephen/UMM-Reflection", "github_stars": 18, "hf_url": "https://huggingface.co/papers/2609.35767", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5c06\u5b8c\u6574\u53cd\u601d\u8f68\u8ff9\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u5bf9\u8c61\uff0c\u8f68\u8ff9\u7ea7\u4f18\u52bf\u540c\u65f6\u66f4\u65b0\u53cd\u601d token \u4e0e\u57fa\u4e8e flow \u7684\u56fe\u50cf\u4fee\u8ba2\uff0c\u907f\u514d\u9010\u8f6e\u4fe1\u7528\u5206\u914d\u7684\u7ec4\u5408\u7206\u70b8", "\u91c7\u7528\u5171\u4eab\u521d\u59cb\u56fe\u50cf\u7684 sibling trajectories\uff0c\u7528\u7ec4\u76f8\u5bf9\u4f18\u52bf\u6bd4\u8f83\u4e0d\u540c\u53cd\u601d\u7b56\u7565\u7684\u4fee\u590d\u6548\u679c", "\u5728 BAGEL \u4e0a\u8f83 SFT \u63d0\u5347 GenEval 12.05 \u5206\uff0c\u5e76\u80fd\u8fc1\u79fb\u5230 WISE\u3001OneIG-Bench\u3001T2I-CompBench++ \u7b49\u672a\u53c2\u4e0e\u8bad\u7ec3\u7684\u57fa\u51c6"], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u81ea\u6211\u53cd\u601d"], "num_comments": 3, "on_hf": true, "organization": "MMLab@NTU", "pdf_url": "https://arxiv.org/pdf/2609.35767v1", "published_at": "2026-09-28", "score": 0.329, "selected_reasons": ["HF trending (36\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35767.png", "title": "Learning Native Reflection in Unified Models with Interleaved Reinforcement Learning", "tldr": "\u7528\u4ea4\u9519\u5f3a\u5316\u5b66\u4e60\u6559\u7edf\u4e00\u6a21\u578b\u81ea\u6211\u4fee\u56fe", "upvotes": 36, "what_it_is": "\u8bba\u6587\u63d0\u51fa UMM-Reflection\uff0c\u8ba9\u7edf\u4e00\u591a\u6a21\u6001\u6a21\u578b\u5728\u751f\u6210\u56fe\u50cf\u540e\u8fdb\u884c\u8bca\u65ad\u3001\u4fee\u6539\u3001\u518d\u89c2\u5bdf\u7684\u591a\u8f6e\u81ea\u6211\u53cd\u601d\u3002\u65b9\u6cd5\u7528\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u8054\u5408\u4f18\u5316\u53cd\u601d\u6587\u672c\u4e0e\u56fe\u50cf\u4fee\u8ba2\uff0c\u4f7f\u540c\u4e00\u4e2a\u6a21\u578b\u540c\u65f6\u5b66\u4f1a\u201c\u770b\u95ee\u9898\u201d\u548c\u201c\u6539\u56fe\u201d\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u591a\u6a21\u6001\u751f\u6210\u6a21\u578b\u7684\u201c\u81ea\u6211\u53cd\u601d\u2014\u4fee\u8ba2\u201d\u95ed\u73af\u7eb3\u5165\u7aef\u5230\u7aef\u5f3a\u5316\u5b66\u4e60\uff0c\u4e0d\u4f9d\u8d56\u5916\u90e8\u8bc4\u5ba1\u5668\u5373\u53ef\u5728\u63a8\u7406\u65f6\u591a\u8f6e\u6539\u8fdb\u751f\u6210\u7ed3\u679c\uff0c\u5c55\u793a\u4e86\u7edf\u4e00\u6a21\u578b\u81ea\u6211\u4fee\u590d\u80fd\u529b\u7684\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Interactive world models require responding in real time to versatile controls and maintaining long-horizon consistency. However, modeling heterogeneous controls remains difficult, while explosive contexts and unstable distillation impede achieving both long-horizon consistency and real-time responsiveness. In this paper, we present WorldPlay2, an interactive world model that couples a factorized hybrid control interface with a co-design of compressed memory and stable distillation. 1) Our factorized hybrid control interface integrates frame-aligned action control with structured semantic control that explicitly disentangles scene appearance, character identity, and dynamic semantic events, thereby facilitating effective control learning. 2) To achieve efficient long-horizon modeling, we compress historical contexts into compact memory tokens shared by the autoregressive student and the bidirectional teacher. This design enables clip-wise, memory-conditioned score evaluation instead of jointly processing an entire long rollout, substantially reducing distillation overhead. 3) We further propose Stable Forcing, which initializes the autoregressive student via a few-step strategy and leverages full-rollout replay to preserve the quality of long-horizon rollouts, ensuring robust and stable distillation. Extensive experiments demonstrate the strong generalizability of our model and its superior performance compared to existing methods.", "arxiv_id": "2609.35560", "arxiv_url": "https://arxiv.org/abs/2609.35560", "authors": ["Haiyu Zhang", "Wenqiang Sun", "Tengfei Wang", "Junta Wu", "Jun Zhang", "Yunhong Wang", "Yu Qiao", "Chunchao Guo"], "brief": "WorldPlay2 \u63d0\u51fa\u4e00\u79cd\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u9762\u5411\u5b9e\u65f6\u54cd\u5e94\u591a\u6837\u63a7\u5236\u4e0e\u4fdd\u6301\u957f\u65f6\u5e8f\u4e00\u81f4\u6027\u3002\u5b83\u7ed3\u5408\u5206\u89e3\u5f0f\u6df7\u5408\u63a7\u5236\u63a5\u53e3\u3001\u538b\u7f29\u8bb0\u5fc6\u673a\u5236\u4e0e\u7a33\u5b9a\u84b8\u998f\u7b56\u7565\uff0c\u4ee5\u63d0\u5347\u53ef\u63a7\u89c6\u9891/\u4e16\u754c\u751f\u6210\u7684\u6548\u7387\u548c\u8d28\u91cf\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/WorldPlay2/WorldPlay2", "github_stars": 31, "hf_url": "https://huggingface.co/papers/2609.35560", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u5206\u89e3\u5f0f\u6df7\u5408\u63a7\u5236\u63a5\u53e3\u540c\u65f6\u652f\u6301\u9010\u5e27\u52a8\u4f5c\u63a7\u5236\u4e0e\u7ed3\u6784\u5316\u8bed\u4e49\u63a7\u5236\uff0c\u5e76\u663e\u5f0f\u89e3\u8026\u573a\u666f\u5916\u89c2\u3001\u89d2\u8272\u8eab\u4efd\u548c\u52a8\u6001\u4e8b\u4ef6\u3002", "\u5c06\u5386\u53f2\u4e0a\u4e0b\u6587\u538b\u7f29\u4e3a\u7d27\u51d1\u8bb0\u5fc6 token\uff0c\u4f9b\u81ea\u56de\u5f52\u5b66\u751f\u6a21\u578b\u548c\u53cc\u5411\u6559\u5e08\u6a21\u578b\u5171\u4eab\uff0c\u964d\u4f4e\u957f\u5e8f\u5217\u84b8\u998f\u5f00\u9500\u3002", "\u63d0\u51fa Stable Forcing\uff0c\u901a\u8fc7\u5c11\u6b65\u521d\u59cb\u5316\u4e0e\u5b8c\u6574 rollout \u56de\u653e\u63d0\u5347\u957f\u7a0b\u751f\u6210\u8d28\u91cf\u548c\u84b8\u998f\u7a33\u5b9a\u6027\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u591a\u6a21\u6001", "\u84b8\u998f"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.35560v1", "published_at": "2026-09-28", "score": 0.322, "selected_reasons": ["HF trending (25\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35560.png", "title": "WorldPlay2: Extending Real-Time Interactive World Models in Control and Horizon", "tldr": "\u5b9e\u65f6\u53ef\u63a7\u957f\u7a0b\u4ea4\u4e92\u4e16\u754c\u6a21\u578b", "upvotes": 25, "what_it_is": "WorldPlay2 \u63d0\u51fa\u4e00\u79cd\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u9762\u5411\u5b9e\u65f6\u54cd\u5e94\u591a\u6837\u63a7\u5236\u4e0e\u4fdd\u6301\u957f\u65f6\u5e8f\u4e00\u81f4\u6027\u3002\u5b83\u7ed3\u5408\u5206\u89e3\u5f0f\u6df7\u5408\u63a7\u5236\u63a5\u53e3\u3001\u538b\u7f29\u8bb0\u5fc6\u673a\u5236\u4e0e\u7a33\u5b9a\u84b8\u998f\u7b56\u7565\uff0c\u4ee5\u63d0\u5347\u53ef\u63a7\u89c6\u9891/\u4e16\u754c\u751f\u6210\u7684\u6548\u7387\u548c\u8d28\u91cf\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\u7684\u4e24\u5927\u74f6\u9888\u2014\u2014\u5f02\u6784\u63a7\u5236\u5b66\u4e60\u548c\u957f\u65f6\u5e8f\u5b9e\u65f6\u63a8\u7406\u2014\u2014\u63d0\u51fa\u7cfb\u7edf\u6027\u6539\u8fdb\uff0c\u6709\u671b\u63a8\u52a8\u53ef\u63a7\u89c6\u9891\u751f\u6210\u3001\u6e38\u620f\u4eff\u771f\u548c\u5177\u8eab\u667a\u80fd\u73af\u5883\u6a21\u62df\u7684\u53d1\u5c55\u3002"}, {"abstract": "Automatically generated environments provide a scalable source of interaction data for training general agents. However, existing approaches mainly generate tasks within a single environment, while real-world workflows require agents to connect information and actions across multiple services. We introduce Compositional Environment Scaling (\\textbf{CompoWorld}), which expands the task space by composing a finite library of reusable services. Coding agents turn tool specifications into verified services with typed states and shared interfaces, while a world model handles tools that cannot be reliably implemented. A random-walk procedure connects services through dependency graphs, enabling the generation and verification of tasks that require information to flow across services. Verified trajectories support supervised fine-tuning (SFT), while our Completion-Focused Rubric Reward guides reinforcement learning (RL) toward full task completion by emphasizing criteria with lower pass rates within each rollout group. We construct 448 services exposing 10,130 tools and use 3K SFT trajectories and 1K RL tasks to train Qwen3.6-35B-A3B. Experimental results show that CompoWorld improves on its backbone by 9.17 points on average across eight benchmarks. On AutomationBench, it surpasses frontier models such as Claude Opus 4.6 and leads all compared agent-specialized 35B-A3B models.", "arxiv_id": "2609.33665", "arxiv_url": "https://arxiv.org/abs/2609.33665", "authors": ["Xiao-Wen Yang", "Weiyi Xu", "Wen Da", "Hang Xu", "Canwei Li", "Hong-Jie You", "Pusen Dong", "Yucheng Zeng", "Zhaokai Luo", "Yu-Feng Li", "Yao Hu", "Mu Chuan"], "brief": "\u8bba\u6587\u63d0\u51fa CompoWorld\uff0c\u901a\u8fc7\u7ec4\u5408\u53ef\u590d\u7528\u670d\u52a1\u5e93\u81ea\u52a8\u6269\u5c55\u667a\u80fd\u4f53\u4efb\u52a1\u73af\u5883\uff0c\u751f\u6210\u8de8\u670d\u52a1\u4fe1\u606f\u6d41\u4e0e\u52a8\u4f5c\u94fe\u7684\u8bad\u7ec3\u4efb\u52a1\u3002\u7cfb\u7edf\u7528\u7f16\u7801\u667a\u80fd\u4f53\u5c06\u5de5\u5177\u89c4\u683c\u5b9e\u73b0\u4e3a\u5e26\u7c7b\u578b\u72b6\u6001\u548c\u5171\u4eab\u63a5\u53e3\u7684\u53ef\u9a8c\u8bc1\u670d\u52a1\uff0c\u5e76\u7ed3\u5408\u4e16\u754c\u6a21\u578b\u5904\u7406\u96be\u4ee5\u53ef\u9760\u5b9e\u73b0\u7684\u5de5\u5177\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/AllSpark-Research/CompoWorld", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33665", "impact_score": 9, "is_agent": true, "is_top": false, "key_points": ["\u6784\u5efa\u4e86 448 \u4e2a\u670d\u52a1\u300110,130 \u4e2a\u5de5\u5177\uff0c\u5e76\u751f\u6210 3K \u6761 SFT \u8f68\u8ff9\u548c 1K \u4e2a RL \u4efb\u52a1\u7528\u4e8e\u8bad\u7ec3\u3002", "\u901a\u8fc7\u4f9d\u8d56\u56fe\u968f\u673a\u6e38\u8d70\u8fde\u63a5\u591a\u4e2a\u670d\u52a1\uff0c\u81ea\u52a8\u751f\u6210\u5e76\u9a8c\u8bc1\u9700\u8981\u8de8\u670d\u52a1\u4f20\u9012\u4fe1\u606f\u7684\u590d\u6742\u4efb\u52a1\u3002", "\u63d0\u51fa Completion-Focused Rubric Reward\uff0c\u5728\u5f3a\u5316\u5b66\u4e60\u4e2d\u5f3a\u5316\u4f4e\u901a\u8fc7\u7387\u8bc4\u4ef7\u9879\uff0c\u63a8\u52a8\u5b8c\u6574\u4efb\u52a1\u5b8c\u6210\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u73af\u5883\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 2, "on_hf": true, "organization": "AllSpark Research", "pdf_url": "https://arxiv.org/pdf/2609.33665v1", "published_at": "2026-09-27", "score": 0.322, "selected_reasons": ["HF trending (30\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 9/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33665.png", "title": "CompoWorld: Compositional Environment Scaling for General Agents", "tldr": "\u7ec4\u5408\u5f0f\u751f\u6210\u670d\u52a1\u73af\u5883\u8bad\u7ec3\u901a\u7528\u667a\u80fd\u4f53", "upvotes": 30, "what_it_is": "\u8bba\u6587\u63d0\u51fa CompoWorld\uff0c\u901a\u8fc7\u7ec4\u5408\u53ef\u590d\u7528\u670d\u52a1\u5e93\u81ea\u52a8\u6269\u5c55\u667a\u80fd\u4f53\u4efb\u52a1\u73af\u5883\uff0c\u751f\u6210\u8de8\u670d\u52a1\u4fe1\u606f\u6d41\u4e0e\u52a8\u4f5c\u94fe\u7684\u8bad\u7ec3\u4efb\u52a1\u3002\u7cfb\u7edf\u7528\u7f16\u7801\u667a\u80fd\u4f53\u5c06\u5de5\u5177\u89c4\u683c\u5b9e\u73b0\u4e3a\u5e26\u7c7b\u578b\u72b6\u6001\u548c\u5171\u4eab\u63a5\u53e3\u7684\u53ef\u9a8c\u8bc1\u670d\u52a1\uff0c\u5e76\u7ed3\u5408\u4e16\u754c\u6a21\u578b\u5904\u7406\u96be\u4ee5\u53ef\u9760\u5b9e\u73b0\u7684\u5de5\u5177\u3002", "why_notable": "\u76f8\u6bd4\u53ea\u5728\u5355\u4e00\u73af\u5883\u5185\u751f\u6210\u4efb\u52a1\u7684\u65b9\u6cd5\uff0cCompoWorld \u66f4\u8d34\u8fd1\u771f\u5b9e\u5de5\u4f5c\u6d41\u4e2d\u7684\u591a\u670d\u52a1\u534f\u540c\u81ea\u52a8\u5316\uff1b\u5728\u516b\u4e2a\u57fa\u51c6\u4e0a\u5e73\u5747\u63d0\u5347 9.17 \u5206\uff0c\u5e76\u5728 AutomationBench \u4e0a\u8d85\u8fc7 Claude Opus 4.6 \u7b49\u524d\u6cbf\u6a21\u578b\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u5b9e\u7528\u6f5c\u529b\u3002"}, {"abstract": "Scaling test-time computation is a powerful way to improve language-model reasoning, and is particularly appealing for small reasoning models (sRMs) that are cheap to serve. However, is additional thinking always the right operation? By intervening at intermediate reasoning states across two model families and multiple scales, we find that self-refinement largely consolidates probability mass onto solutions already reachable from the current state, rather than making new ones reachable. These interventions reveal two failure regimes: execution bottlenecks, where the correct path is reachable and reflection can recover it, and knowledge bottlenecks, where relevant external information makes it reachable. Motivated by this distinction, we introduce FlyBy, a selective querying framework, and train 4B and 8B variants to reason first, diagnose what remains unresolved, and, at a knowledge bottleneck, query stronger models whose parametric knowledge extends beyond its own. Supervised fine-tuning bootstraps a multi-depth query action, and cost-aware reinforcement learning calibrates whether to query, what to ask, and how much to spend. On 1,158 hard problems across six benchmarks, FlyBy-4B achieves 45.96% pass@8, surpassing Qwen3-14B (41.64%) at 2.7 times lower serving cost, while also exceeding Qwen3-8B in pass@1 (16.85% vs. 15.31%). Scaling to FlyBy-8B further improves pass@8 to 51.81%.", "arxiv_id": "2609.34327", "arxiv_url": "https://arxiv.org/abs/2609.34327", "authors": ["Chanuk Lee", "Minki Kang", "Sangwoo Park", "Woongyeong Yeo", "Jinheon Baek", "Sung Ju Hwang"], "brief": "\u8bba\u6587\u5206\u6790\u5c0f\u63a8\u7406\u6a21\u578b\u7684\u81ea\u6211\u53cd\u601d\u8fb9\u754c\uff0c\u533a\u5206\u201c\u6267\u884c\u74f6\u9888\u201d\u548c\u201c\u77e5\u8bc6\u74f6\u9888\u201d\u3002\u63d0\u51fa FlyBy\uff0c\u8ba9\u5c0f\u6a21\u578b\u5148\u72ec\u7acb\u63a8\u7406\uff0c\u518d\u5224\u65ad\u662f\u5426\u9700\u8981\u5411\u66f4\u5f3a\u6a21\u578b\u67e5\u8be2\u5916\u90e8\u53c2\u6570\u77e5\u8bc6\uff0c\u5e76\u7528\u76d1\u7763\u5fae\u8c03\u4e0e\u6210\u672c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u67e5\u8be2\u7b56\u7565\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/tally0818/FlyBy", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.34327", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u53d1\u73b0\u81ea\u6211\u7cbe\u70bc\u4e3b\u8981\u5f3a\u5316\u5f53\u524d\u72b6\u6001\u5df2\u53ef\u8fbe\u7684\u89e3\uff0c\u800c\u96be\u4ee5\u8ba9\u65b0\u89e3\u53d8\u5f97\u53ef\u8fbe", "\u63d0\u51fa FlyBy \u9009\u62e9\u6027\u67e5\u8be2\u6846\u67b6\uff0c\u8bad\u7ec3\u6a21\u578b\u51b3\u5b9a\u662f\u5426\u67e5\u8be2\u3001\u95ee\u4ec0\u4e48\u3001\u82b1\u591a\u5c11\u6210\u672c", "FlyBy-4B \u5728\u516d\u4e2a\u57fa\u51c6\u7684 1158 \u9053\u96be\u9898\u4e0a pass@8 \u8fbe 45.96%\uff0c\u4ee5\u66f4\u4f4e\u670d\u52a1\u6210\u672c\u8d85\u8fc7 Qwen3-14B"], "keywords": ["\u5c0f\u6a21\u578b", "\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2609.34327v1", "published_at": "2026-09-28", "score": 0.312, "selected_reasons": ["HF trending (33\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34327.png", "title": "Knowing When Thinking Is Not Enough: Teaching Small Reasoning Models to Reason Beyond Their Parametric Knowledge", "tldr": "\u5c0f\u6a21\u578b\u5b66\u4f1a\u4f55\u65f6\u5411\u5f3a\u6a21\u578b\u6c42\u52a9", "upvotes": 33, "what_it_is": "\u8bba\u6587\u5206\u6790\u5c0f\u63a8\u7406\u6a21\u578b\u7684\u81ea\u6211\u53cd\u601d\u8fb9\u754c\uff0c\u533a\u5206\u201c\u6267\u884c\u74f6\u9888\u201d\u548c\u201c\u77e5\u8bc6\u74f6\u9888\u201d\u3002\u63d0\u51fa FlyBy\uff0c\u8ba9\u5c0f\u6a21\u578b\u5148\u72ec\u7acb\u63a8\u7406\uff0c\u518d\u5224\u65ad\u662f\u5426\u9700\u8981\u5411\u66f4\u5f3a\u6a21\u578b\u67e5\u8be2\u5916\u90e8\u53c2\u6570\u77e5\u8bc6\uff0c\u5e76\u7528\u76d1\u7763\u5fae\u8c03\u4e0e\u6210\u672c\u611f\u77e5\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u67e5\u8be2\u7b56\u7565\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6307\u51fa\u201c\u591a\u60f3\u4e00\u6b65\u201d\u5e76\u4e0d\u603b\u662f\u6709\u6548\uff0c\u4e3a\u5c0f\u6a21\u578b\u63a8\u7406\u6269\u5c55\u63d0\u4f9b\u4e86\u66f4\u7ecf\u6d4e\u7684\u8def\u5f84\uff1a\u5728\u77e5\u8bc6\u4e0d\u8db3\u65f6\u6709\u9009\u62e9\u5730\u8c03\u7528\u5f3a\u6a21\u578b\uff0c\u800c\u975e\u76f2\u76ee\u589e\u52a0\u63a8\u7406\u8ba1\u7b97\u3002"}, {"abstract": "Coding-agent evaluation has progressed from resolving individual issues to carrying out long-horizon development, yet task completion is still largely assessed within a single codebase. In software ecosystems, many features and bug fixes require coordinated changes across multiple repositories. We introduce WideSWE to evaluate coding agents on such cross-repository tasks. Mining and reviewing changes across 103 software ecosystems yields 120 real-world tasks, balanced between 60 bug fixes and 60 features. We derive prompts from related issues and pull requests. We systematically review and adapt hidden tests to support diverse correct implementations while preserving required behavior and regression checks. Across seven agent configurations, full task success ranges from 10.83% to 42.50%, with the configuration pairing Codex CLI with GPT-5.6-sol achieving the highest rate. Trajectories show agents failing to identify necessary changes, recognizing changes but leaving them unfinished, or modifying the required repositories without fully satisfying the request. To examine whether working on one repository at a time can alleviate these difficulties, we compare it with joint execution under identical prompts. Independent execution mainly recovers omitted work and is less effective at correcting previously attempted but unsuccessful implementations. Joint execution can use information from related repositories to guide implementation and verification. Code is available at https://github.com/ZJU-ACES-ISE/WideSWE.", "arxiv_id": "2609.33382", "arxiv_url": "https://arxiv.org/abs/2609.33382", "authors": ["Baoyi Wang", "Xingliang Wang", "Jinyang Wu", "Keming Wu", "Chen Zhi", "Jianwei Yin"], "brief": "\u8bba\u6587\u63d0\u51fa WideSWE\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u5728\u591a\u4e2a\u76f8\u5173\u4ed3\u5e93\u4e2d\u534f\u540c\u5b8c\u6210\u771f\u5b9e\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b\u6765\u81ea 103 \u4e2a\u8f6f\u4ef6\u751f\u6001\u7684 120 \u4e2a\u771f\u5b9e\u4efb\u52a1\uff0c\u8986\u76d6 60 \u4e2a\u7f3a\u9677\u4fee\u590d\u4e0e 60 \u4e2a\u529f\u80fd\u5f00\u53d1\uff0c\u5e76\u914d\u5957\u7ecf\u8fc7\u9002\u914d\u7684\u9690\u85cf\u6d4b\u8bd5\u3002", "categories": ["cs.SE"], "github_repo": "https://github.com/ZJU-ACES-ISE/WideSWE", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2609.33382", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": ["\u4efb\u52a1\u6765\u6e90\u4e8e\u771f\u5b9e issue \u4e0e pull request\uff0c\u8981\u6c42\u667a\u80fd\u4f53\u8de8\u591a\u4e2a\u4ed3\u5e93\u8bc6\u522b\u3001\u4fee\u6539\u5e76\u9a8c\u8bc1\u76f8\u5173\u4ee3\u7801\u3002", "\u8bc4\u6d4b\u4e03\u79cd\u667a\u80fd\u4f53\u914d\u7f6e\uff0c\u5b8c\u6574\u6210\u529f\u7387\u4ec5\u4e3a 10.83% \u5230 42.50%\uff0c\u6700\u9ad8\u4e3a Codex CLI \u642d\u914d GPT-5.6-sol\u3002", "\u5931\u8d25\u4e3b\u8981\u6765\u81ea\u6f0f\u6539\u5fc5\u8981\u4ed3\u5e93\u3001\u8bc6\u522b\u5230\u53d8\u66f4\u4f46\u672a\u5b8c\u6210\u3001\u6216\u4fee\u6539\u4e86\u76f8\u5173\u4ed3\u5e93\u4f46\u672a\u6ee1\u8db3\u9700\u6c42\uff1b\u9010\u4ed3\u5e93\u72ec\u7acb\u6267\u884c\u53ef\u8865\u6f0f\u4f46\u96be\u4ee5\u4fee\u6b63\u9519\u8bef\u5b9e\u73b0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b", "\u8bc4\u6d4b\u57fa\u51c6"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.33382v1", "published_at": "2026-09-27", "score": 0.307, "selected_reasons": ["HF trending (16\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33382.png", "title": "WideSWE: Can Coding Agents Coordinate Changes Across Repositories?", "tldr": "\u9996\u4e2a\u8de8\u4ed3\u5e93\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u57fa\u51c6", "upvotes": 16, "what_it_is": "\u8bba\u6587\u63d0\u51fa WideSWE\uff0c\u7528\u4e8e\u8bc4\u4f30\u7f16\u7801\u667a\u80fd\u4f53\u5728\u591a\u4e2a\u76f8\u5173\u4ed3\u5e93\u4e2d\u534f\u540c\u5b8c\u6210\u771f\u5b9e\u8f6f\u4ef6\u5de5\u7a0b\u4efb\u52a1\u7684\u80fd\u529b\u3002\u57fa\u51c6\u5305\u542b\u6765\u81ea 103 \u4e2a\u8f6f\u4ef6\u751f\u6001\u7684 120 \u4e2a\u771f\u5b9e\u4efb\u52a1\uff0c\u8986\u76d6 60 \u4e2a\u7f3a\u9677\u4fee\u590d\u4e0e 60 \u4e2a\u529f\u80fd\u5f00\u53d1\uff0c\u5e76\u914d\u5957\u7ecf\u8fc7\u9002\u914d\u7684\u9690\u85cf\u6d4b\u8bd5\u3002", "why_notable": "WideSWE \u5c06\u7f16\u7801\u667a\u80fd\u4f53\u8bc4\u6d4b\u4ece\u5355\u4ed3\u5e93\u6269\u5c55\u5230\u771f\u5b9e\u8f6f\u4ef6\u751f\u6001\u4e2d\u7684\u8de8\u4ed3\u5e93\u534f\u540c\u5f00\u53d1\uff0c\u66f4\u8d34\u8fd1\u5b9e\u9645\u5de5\u7a0b\u573a\u666f\uff0c\u4e5f\u63ed\u793a\u4e86\u5f53\u524d\u667a\u80fd\u4f53\u5728\u957f\u671f\u89c4\u5212\u3001\u4f9d\u8d56\u7406\u89e3\u548c\u8de8\u9879\u76ee\u9a8c\u8bc1\u4e0a\u7684\u660e\u663e\u77ed\u677f\u3002"}, {"abstract": "Frontier general-purpose systems are rapidly expanding beyond visual understanding into capabilities traditionally handled by dedicated computer-vision models. As these capabilities expand, a central question for the computer-vision community is how far this reach extends, and what remains hard. We evaluate GPT-6 Astra alongside five frontier general-purpose AI systems across 34 capabilities and 55 benchmarks spanning nine areas of computer vision. We compare their performance with dedicated models and humans where suitable references are available. Astra demonstrates broad visual capability, with substantial gains over other frontier systems in visual and spatial reasoning and several forms of structured prediction. Across the state-of-the-art systems, a consistent pattern emerges. Capabilities involving semantic interpretation, reasoning, and object-centric prediction increasingly approach or reach available reference levels. In contrast, larger gaps remain when tasks require metric geometric accuracy, faithful reconstruction, temporally consistent dense prediction, or specialized fine-grained visual knowledge. Additional reasoning and specialist tools close selected gaps, but their benefits vary across capabilities. These results map a changing landscape of computer vision in which increasingly sophisticated visual tasks are accessible through a general-purpose interface, while precise and fidelity-sensitive perception remains an important frontier.", "arxiv_id": "2609.35718", "arxiv_url": "https://arxiv.org/abs/2609.35718", "authors": ["Hanoona Rasheed", "Mohammed Irfan Kurpath", "Bin Ren", "Hisham Cholakkal", "Fahad Shahbaz Khan", "Salman Khan"], "brief": "\u672c\u6587\u57289\u5927\u8ba1\u7b97\u673a\u89c6\u89c9\u65b9\u5411\u300134\u7c7b\u80fd\u529b\u548c55\u4e2a\u57fa\u51c6\u4e0a\u8bc4\u6d4bGPT-6 Astra\u53ca\u4e94\u4e2a\u524d\u6cbf\u901a\u7528AI\u7cfb\u7edf\uff0c\u5e76\u4e0e\u4e13\u7528\u6a21\u578b\u548c\u4eba\u7c7b\u8868\u73b0\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a\uff0c\u901a\u7528\u7cfb\u7edf\u5728\u8bed\u4e49\u7406\u89e3\u3001\u89c6\u89c9/\u7a7a\u95f4\u63a8\u7406\u548c\u7ed3\u6784\u5316\u9884\u6d4b\u4e0a\u5feb\u901f\u903c\u8fd1\u53c2\u8003\u6c34\u5e73\uff0c\u4f46\u5728\u7cbe\u786e\u51e0\u4f55\u3001\u91cd\u5efa\u548c\u65f6\u5e8f\u4e00\u81f4\u5bc6\u96c6\u9884\u6d4b\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/mbzuai-oryx/frontier-vision", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.35718", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u8986\u76d655\u4e2a\u89c6\u89c9\u57fa\u51c6\uff0c\u7cfb\u7edf\u6bd4\u8f83\u901a\u7528AI\u3001\u4e13\u7528\u89c6\u89c9\u6a21\u578b\u4e0e\u4eba\u7c7b\u53c2\u8003\u8868\u73b0", "Astra\u5728\u89c6\u89c9\u4e0e\u7a7a\u95f4\u63a8\u7406\u3001\u5bf9\u8c61\u4e2d\u5fc3\u9884\u6d4b\u548c\u90e8\u5206\u7ed3\u6784\u5316\u9884\u6d4b\u4efb\u52a1\u4e0a\u663e\u8457\u9886\u5148\u5176\u4ed6\u901a\u7528\u7cfb\u7edf", "\u901a\u7528\u7cfb\u7edf\u4ecd\u96be\u4ee5\u5904\u7406\u5ea6\u91cf\u51e0\u4f55\u7cbe\u5ea6\u3001\u5fe0\u5b9e\u91cd\u5efa\u3001\u65f6\u5e8f\u4e00\u81f4\u6027\u548c\u7ec6\u7c92\u5ea6\u4e13\u4e1a\u89c6\u89c9\u77e5\u8bc6"], "keywords": ["\u8ba1\u7b97\u673a\u89c6\u89c9", "\u591a\u6a21\u6001", "\u89c6\u89c9\u63a8\u7406", "\u6a21\u578b\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Mohamed Bin Zayed University of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.35718v1", "published_at": "2026-09-28", "score": 0.296, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35718.png", "title": "Hard Vision, Easy Vision: What GPT-6 Astra Reveals Across Computer Vision", "tldr": "\u7cfb\u7edf\u8bc4\u6d4bGPT-6 Astra\u7684\u89c6\u89c9\u80fd\u529b\u8fb9\u754c", "upvotes": 15, "what_it_is": "\u672c\u6587\u57289\u5927\u8ba1\u7b97\u673a\u89c6\u89c9\u65b9\u5411\u300134\u7c7b\u80fd\u529b\u548c55\u4e2a\u57fa\u51c6\u4e0a\u8bc4\u6d4bGPT-6 Astra\u53ca\u4e94\u4e2a\u524d\u6cbf\u901a\u7528AI\u7cfb\u7edf\uff0c\u5e76\u4e0e\u4e13\u7528\u6a21\u578b\u548c\u4eba\u7c7b\u8868\u73b0\u5bf9\u6bd4\u3002\u7ed3\u679c\u663e\u793a\uff0c\u901a\u7528\u7cfb\u7edf\u5728\u8bed\u4e49\u7406\u89e3\u3001\u89c6\u89c9/\u7a7a\u95f4\u63a8\u7406\u548c\u7ed3\u6784\u5316\u9884\u6d4b\u4e0a\u5feb\u901f\u903c\u8fd1\u53c2\u8003\u6c34\u5e73\uff0c\u4f46\u5728\u7cbe\u786e\u51e0\u4f55\u3001\u91cd\u5efa\u548c\u65f6\u5e8f\u4e00\u81f4\u5bc6\u96c6\u9884\u6d4b\u4e0a\u4ecd\u6709\u660e\u663e\u77ed\u677f\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u4e3a\u901a\u7528AI\u7cfb\u7edf\u6b63\u5728\u541e\u566c\u4f20\u7edf\u8ba1\u7b97\u673a\u89c6\u89c9\u4efb\u52a1\u7684\u8d8b\u52bf\u63d0\u4f9b\u4e86\u5927\u89c4\u6a21\u5b9e\u8bc1\u5730\u56fe\uff0c\u540c\u65f6\u660e\u786e\u6307\u51fa\u9ad8\u7cbe\u5ea6\u3001\u5f3a\u4fdd\u771f\u89c6\u89c9\u611f\u77e5\u4ecd\u662f\u4e13\u7528\u6a21\u578b\u548c\u672a\u6765\u7814\u7a76\u7684\u91cd\u8981\u524d\u6cbf\u3002"}, {"abstract": "Real-world tasks often require large language models (LLMs) to learn from complex task-specific context rather than pretrained parametric knowledge. This capability remains a weakness of LLMs, while human annotation for such task contexts is expensive and difficult to scale. Public high-quality documents are an abundant alternative, but much of the public web has already been consumed during pretraining: training on such documents naively would reward memorization rather than context learning. In this work, we attempt to make use of high-quality public documents with small perturbations and empirically find that LLMs can successfully generate context-dependent reasoning traces and answers, which are then used to train a student model. Specifically, we construct a synthesis pipeline that (i) rewrites source documents to reduce memorization risk, (ii) generates questions and rubrics that require reasoning over the document, (iii) answers the questions with the document as context, and (iv) admits only samples that genuinely depend on the document. Without any human annotators, our pipeline generates about 10k samples from 3.5k documents, and the resulting student model substantially improves the performance on CL-bench. SFT raises a Qwen3.6-35B-A3B student from 13.7% to 22.8%, and a subsequent rubric-reward RL stage reaches 24.6%, on CL-bench comparable with a frontier model of over a trillion parameters, Qwen3.8-2.4T (23.9%). We also observe a broad transfer of improvements to long-context understanding, instruction following, and reasoning, while code generation and knowledge remain mostly flat. We hope this work provides a reproducible and scalable way to improve the ability of LLMs to learn from context, and to facilitate further research on context-grounded reasoning.", "arxiv_id": "2609.33642", "arxiv_url": "https://arxiv.org/abs/2609.33642", "authors": ["Haoyi Wu", "Yang Xiao", "Yusong Sun", "Wenyang Hui", "Zhaokai Luo", "Chengyue Jiang", "Mu Chuan"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u6761\u65e0\u9700\u4eba\u5de5\u6807\u6ce8\u7684\u5408\u6210\u8bad\u7ec3\u6d41\u6c34\u7ebf\uff1a\u5bf9\u9ad8\u8d28\u91cf\u516c\u5f00\u6587\u6863\u505a\u8f7b\u5ea6\u6539 uiring nearly $2\\times$ less memory than the compared baselines. These results demonstrate that tool-based image editing can be effectively modeled as conditional generation over structured continuous editing parameters, without autoregressive reasoning.", "arxiv_id": "2609.35673", "arxiv_url": "https://arxiv.org/abs/2609.35673", "authors": ["Thanh-Long V. Le", "Steven Walton", "Seunghyun Yoon", "Branislav Kveton", "Trung Bui", "Eunho Yang", "Viet Lai"], "brief": "\u8bba\u6587\u63d0\u51fa FlowTool\uff0c\u5c06\u57fa\u4e8e\u5de5\u5177\u7684\u56fe\u50cf\u4fee\u56fe\u5efa\u6a21\u4e3a\u6761\u4ef6\u6d41\u5339\u914d\u95ee\u9898\uff0c\u76f4\u63a5\u6839\u636e\u8f93\u5165\u56fe\u50cf\u548c\u7528\u6237\u6307\u4ee4\u751f\u6210\u9ad8\u8d28\u91cf\u8fde\u7eed\u5de5\u5177\u53c2\u6570\u3002\u5b83\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7406\u89e3\u591a\u6a21\u6001\u8f93\u5165\uff0c\u5e76\u7528 Diffusion Transformer \u5c06\u9ad8\u65af\u566a\u58f0\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u7f16\u8f91\u65b9\u6848\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.35673", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["\u91c7\u7528 conditional rectified flow \u5efa\u6a21\u4fee\u56fe\u53c2\u6570\u5206\u5e03\uff0c\u907f\u514d\u81ea\u56de\u5f52\u5f0f\u63a8\u7406\u3001\u5de5\u5177\u9009\u62e9\u548c\u9010\u6b65\u53c2\u6570\u751f\u6210\u3002", "\u8bad\u7ec3\u6d41\u7a0b\u5305\u62ec\u4e24\u9636\u6bb5\u76d1\u7763\u5f0f flow-matching curriculum\uff0c\u4ee5\u53ca\u540e\u7eed\u57fa\u4e8e\u5956\u52b1\u7684\u540e\u8bad\u7ec3\u3002", "\u5728 MMArt-Bench\u3001FlowTool-Eval\u3001ArtEdit-Bench\u3001MIT-Adobe5K \u4e0a\u4f18\u4e8e\u4e13\u7528 MLLM \u7f16\u8f91\u667a\u80fd\u4f53\u548c\u95ed\u6e90 MLLM\uff0c\u5e76\u5c06\u63a8\u7406\u5ef6\u8fdf\u964d\u4f4e\u81f3\u5c11 50 \u500d\u3001\u663e\u5b58\u9700\u6c42\u51cf\u5c11\u8fd1 2 \u500d\u3002"], "keywords": ["\u56fe\u50cf\u7f16\u8f91", "\u6d41\u5339\u914d", "\u591a\u6a21\u6001", "\u6269\u6563\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.35673v1", "published_at": "2026-09-28", "score": 0.284, "selected_reasons": ["HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35673.png", "title": "FlowTool: Controlling Tool Parameter in Image Retouching via Flow Matching", "tldr": "\u7528\u6d41\u5339\u914d\u76f4\u63a5\u751f\u6210\u56fe\u50cf\u4fee\u56fe\u5de5\u5177\u53c2\u6570\u3002", "upvotes": 18, "what_it_is": "\u8bba\u6587\u63d0\u51fa FlowTool\uff0c\u5c06\u57fa\u4e8e\u5de5\u5177\u7684\u56fe\u50cf\u4fee\u56fe\u5efa\u6a21\u4e3a\u6761\u4ef6\u6d41\u5339\u914d\u95ee\u9898\uff0c\u76f4\u63a5\u6839\u636e\u8f93\u5165\u56fe\u50cf\u548c\u7528\u6237\u6307\u4ee4\u751f\u6210\u9ad8\u8d28\u91cf\u8fde\u7eed\u5de5\u5177\u53c2\u6570\u3002\u5b83\u7ed3\u5408\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\u7406\u89e3\u591a\u6a21\u6001\u8f93\u5165\uff0c\u5e76\u7528 Diffusion Transformer \u5c06\u9ad8\u65af\u566a\u58f0\u8f6c\u6362\u4e3a\u7ed3\u6784\u5316\u7f16\u8f91\u65b9\u6848\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u8868\u660e\u56fe\u50cf\u4fee\u56fe\u5de5\u5177\u8c03\u7528\u4e0d\u4e00\u5b9a\u9700\u8981\u81ea\u56de\u5f52 MLLM \u667a\u80fd\u4f53\u6d41\u7a0b\uff0c\u8fde\u7eed\u53c2\u6570\u751f\u6210\u53ef\u663e\u8457\u63d0\u5347\u8d28\u91cf\u4e0e\u6548\u7387\uff0c\u5bf9\u9ad8\u6548\u53ef\u63a7\u56fe\u50cf\u7f16\u8f91\u7cfb\u7edf\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Generating responsive listener facial motion is an important task for embodied conversational AI. Two modeling challenges are central: accounting for the timing of speaker cues while maintaining continuity with the listener\u0027s ongoing motion, and capturing locally variable facial events alongside the overall motion trajectory. Listener responses may follow preceding cues with a temporal lag, while brief expressions and blinks introduce variation that is difficult to predict deterministically. These challenges motivate a framework that combines history-aware temporal alignment with stochastic expression refinement. We propose REALM (Reactive Embodied Audio-driven Listening Model), a coarse-to-fine framework for audio-driven reactive listening. A Reactive Gated Speaker-Listener Fusion module combines listener motion history with speaker audio through a delay-centered attention prior and adaptive gating. A coarse decoder predicts a base motion trajectory, which is augmented by audio-conditioned stochastic residuals in the expression subspace while retaining the coarse pose parameters. Evaluations on ViCo and L2L show improvements over the evaluated baselines across multiple motion-quality metrics. Additional analyses examine delay sensitivity, gate behavior, and blink dynamics. Finally, deployment on an Ameca humanoid robot and a perceptual user study demonstrate the applicability of the generated behavior to physical embodiment. Code: https://github.com/lipzh5/REALM Demo: https://youtu.be/Tf5mpd5S8VQ", "arxiv_id": "2609.33095", "arxiv_url": "https://arxiv.org/abs/2609.33095", "authors": ["Peizhen Li", "Longbing Cao", "Yang Zhang"], "brief": "\u672c\u6587\u63d0\u51fa REALM\uff0c\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u5bf9\u8bdd AI \u7684\u97f3\u9891\u9a71\u52a8\u53cd\u5e94\u5f0f\u503e\u542c\u751f\u6210\u6846\u67b6\u3002\u5b83\u4ee5\u7c97\u5230\u7ec6\u65b9\u5f0f\u5148\u9884\u6d4b\u6574\u4f53\u9762\u90e8\u8fd0\u52a8\u8f68\u8ff9\uff0c\u518d\u751f\u6210\u968f\u673a\u5316\u7684\u5c40\u90e8\u8868\u60c5\u6b8b\u5dee\uff0c\u4ee5\u63d0\u5347\u503e\u542c\u53cd\u5e94\u7684\u65f6\u5e8f\u81ea\u7136\u6027\u4e0e\u7ec6\u8282\u591a\u6837\u6027\u3002", "categories": ["cs.RO"], "github_repo": "https://github.com/lipzh5/REALM", "github_stars": 27, "hf_url": "https://huggingface.co/papers/2609.33095", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Reactive Gated Speaker-Listener Fusion\uff0c\u5c06\u503e\u542c\u8005\u5386\u53f2\u52a8\u4f5c\u4e0e\u8bf4\u8bdd\u8005\u97f3\u9891\u7ed3\u5408\uff0c\u5e76\u5f15\u5165\u4ee5\u5ef6\u8fdf\u4e3a\u4e2d\u5fc3\u7684\u6ce8\u610f\u529b\u5148\u9a8c\u6765\u5efa\u6a21\u53cd\u5e94\u6ede\u540e", "\u91c7\u7528\u7c97\u5230\u7ec6\u751f\u6210\uff1a\u7c97\u89e3\u7801\u5668\u751f\u6210\u57fa\u7840\u8fd0\u52a8\u8f68\u8ff9\uff0c\u7ec6\u9636\u6bb5\u5728\u8868\u60c5\u5b50\u7a7a\u95f4\u52a0\u5165\u97f3\u9891\u6761\u4ef6\u968f\u673a\u6b8b\u5dee\uff0c\u540c\u65f6\u4fdd\u7559\u7a33\u5b9a\u59ff\u6001\u53c2\u6570", "\u5728 ViCo \u548c L2L \u6570\u636e\u96c6\u4e0a\u591a\u9879\u8fd0\u52a8\u8d28\u91cf\u6307\u6807\u4f18\u4e8e\u57fa\u7ebf\uff0c\u5e76\u5728 Ameca \u4eba\u5f62\u673a\u5668\u4eba\u4e0a\u90e8\u7f72\uff0c\u7ed3\u5408\u7528\u6237\u7814\u7a76\u9a8c\u8bc1\u5177\u8eab\u53ef\u7528\u6027"], "keywords": ["\u5177\u8eab\u667a\u80fd", "\u591a\u6a21\u6001\u751f\u6210", "\u4eba\u673a\u4ea4\u4e92", "\u673a\u5668\u4eba"], "num_comments": 1, "on_hf": true, "organization": "Macquarie University", "pdf_url": "https://arxiv.org/pdf/2609.33095v1", "published_at": "2026-09-27", "score": 0.284, "selected_reasons": ["HF trending (17\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33095.png", "title": "REALM: A Coarse-to-Fine Generative Framework for Embodied Reactive Listening", "tldr": "REALM\u751f\u6210\u66f4\u81ea\u7136\u7684\u673a\u5668\u4eba\u503e\u542c\u8868\u60c5", "upvotes": 17, "what_it_is": "\u672c\u6587\u63d0\u51fa REALM\uff0c\u4e00\u4e2a\u9762\u5411\u5177\u8eab\u5bf9\u8bdd AI \u7684\u97f3\u9891\u9a71\u52a8\u53cd\u5e94\u5f0f\u503e\u542c\u751f\u6210\u6846\u67b6\u3002\u5b83\u4ee5\u7c97\u5230\u7ec6\u65b9\u5f0f\u5148\u9884\u6d4b\u6574\u4f53\u9762\u90e8\u8fd0\u52a8\u8f68\u8ff9\uff0c\u518d\u751f\u6210\u968f\u673a\u5316\u7684\u5c40\u90e8\u8868\u60c5\u6b8b\u5dee\uff0c\u4ee5\u63d0\u5347\u503e\u542c\u53cd\u5e94\u7684\u65f6\u5e8f\u81ea\u7136\u6027\u4e0e\u7ec6\u8282\u591a\u6837\u6027\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u5177\u8eab\u5bf9\u8bdd\u4e2d\u201c\u542c\u8005\u53cd\u5e94\u201d\u8fd9\u4e00\u7ec6\u5206\u4f46\u5173\u952e\u95ee\u9898\uff0c\u540c\u65f6\u5904\u7406\u65f6\u5e8f\u5bf9\u9f50\u3001\u8fd0\u52a8\u8fde\u7eed\u6027\u548c\u7728\u773c/\u77ed\u8868\u60c5\u7b49\u968f\u673a\u7ec6\u8282\uff0c\u6709\u52a9\u4e8e\u63d0\u5347\u865a\u62df\u4eba\u548c\u4eba\u5f62\u673a\u5668\u4eba\u7684\u771f\u5b9e\u611f\u4ea4\u4e92\u8868\u73b0\u3002"}, {"abstract": "Visual reward models are essential for evaluating and improving visual generation models, yet existing approaches typically map task conditions and candidate outputs directly to scalar rewards, leaving implicit what should be evaluated for each individual case. We introduce Think Before You Score, a paradigm that explicitly determines what matters for each case before judging how well the candidate performs. Following this principle, we propose the Thinking Reward Model (TRM), which formulates case-adaptive rubrics, performs rubric-guided assessment, and produces fine-grained pointwise rewards. We further observe that conventional pairwise preference optimization can induce score polarization, and introduce Pairwise Dual-Group Relative Policy Optimization (PD-GRPO), which leverages pairwise supervision to improve reward discrimination while preserving fine-grained pointwise scoring. Extensive experiments on image generation and editing reward-modeling benchmarks demonstrate that TRM achieves state-of-the-art performance among open-source reward models while remaining highly competitive with proprietary alternatives. Moreover, using TRM as a reward for reinforcement learning consistently improves diverse visual generation models, demonstrating that its fine-grained, case-adaptive rewards translate into effective optimization signals for visual generation.", "arxiv_id": "2609.37372", "arxiv_url": "https://arxiv.org/abs/2609.37372", "authors": ["Xuehai Bai"
