.209\uff0c\u5e76\u5728\u6587\u751f\u56fe\u5bf9\u9f50\u57fa\u51c6\u4e0a\u4f18\u4e8e RAEv2\uff0c\u5fae\u8c03\u540e GenEval \u4ece 84.86 \u63d0\u5347\u5230 87.70\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pretrained transformers use little of their depth to follow references in context. Thirteen base models reliably follow only 1.4-3.6 lines, and extra pretrained loops add little. A task-trained rank-8 LoRA at one early layer extends this computation with all model weights frozen. Qwen3-8B improves from 15.5% to 99% exact accuracy on 24-line chains; a longer-trained LoRA reaches 50 lines. Ouro-1.4B reaches 60 lines after four loops and at least 160 after eight. The LoRA starts a relay: program lines pass on their chain identity through a short range of middle layers. Frozen heads read progressively further up the chain, and removing parent-line attention stops the relay. A frozen-model measurement locates the last useful intervention layer within tolerance in three of four held-out models. Task-specific LoRAs also improve MuSiQue. Default answers therefore understate the computation accessible through a tiny edit. Code and an interactive demo are available at https://lunamos.github.io/stop-thinking-too-early/", "arxiv_id": "2609.36585", "arxiv_url": "https://arxiv.org/abs/2609.36585", "authors": ["Zehao Jin", "Ruixuan Deng", "Junran Wang"], "brief": "\u7814\u7a76\u53d1\u73b0\u9884\u8bad\u7ec3 Transformer \u5728\u4e0a\u4e0b\u6587\u5f15\u7528\u94fe\u4efb\u52a1\u4e2d\u5f88\u65e9\u505c\u6b62\u6709\u6548\u8ba1\u7b97\uff0c13 \u4e2a\u57fa\u5ea7\u6a21\u578b\u901a\u5e38\u53ea\u80fd\u53ef\u9760\u8ddf\u968f\u7ea6 1.4-3.6 \u884c\u3002\u4f5c\u8005\u5728\u65e9\u671f\u5355\u5c42\u52a0\u5165\u4e00\u4e2a\u5f88\u5c0f\u7684 rank-8 LoRA \u4e14\u51bb\u7ed3\u5176\u4ed6\u6743\u91cd\uff0c\u5373\u53ef\u663e\u8457\u5ef6\u957f\u63a8\u7406\u94fe\u8def\uff0c\u4f8b\u5982 Qwen3-8B \u5728 24 \u884c\u94fe\u4e0a\u51c6\u786e\u7387\u4ece 15.5% \u63d0\u5347\u5230 99%\uff0c\u5e76\u5728 MuSiQue \u4e0a\u4e5f\u6709\u6539\u8fdb\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36585", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "LoRA", "\u4e0a\u4e0b\u6587\u63a8\u7406", "\u6a21\u578b\u53ef\u89e3\u91ca\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.36585v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Transformers Stop Thinking Too Early, and a Tiny LoRA Fixes It", "tldr": "\u7814\u7a76\u53d1\u73b0\u9884\u8bad\u7ec3 Transformer \u5728\u4e0a\u4e0b\u6587\u5f15\u7528\u94fe\u4efb\u52a1\u4e2d\u5f88\u65e9\u505c\u6b62\u6709\u6548\u8ba1\u7b97\uff0c13 \u4e2a\u57fa\u5ea7\u6a21\u578b\u901a\u5e38\u53ea\u80fd\u53ef\u9760\u8ddf\u968f\u7ea6 1.4-3.6 \u884c\u3002\u4f5c\u8005\u5728\u65e9\u671f\u5355\u5c42\u52a0\u5165\u4e00\u4e2a\u5f88\u5c0f\u7684 rank-8 LoRA \u4e14\u51bb\u7ed3\u5176\u4ed6\u6743\u91cd\uff0c\u5373\u53ef\u663e\u8457\u5ef6\u957f\u63a8\u7406\u94fe\u8def\uff0c\u4f8b\u5982 Qwen3-8B \u5728 24 \u884c\u94fe\u4e0a\u51c6\u786e\u7387\u4ece 15.5% \u63d0\u5347\u5230 99%\uff0c\u5e76\u5728 MuSiQue \u4e0a\u4e5f\u6709\u6539\u8fdb\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Fine-tuning a language model on a narrow set of harmful demonstrations, such as bad medical advice, can make it broadly misaligned on unrelated questions, a phenomenon known as emergent misalignment (EM). The usual defense is to find the offending rows and delete them, but a row locator failed our held-out test and deleting rows helps less than expected. We ask a different question: given a fixed set of poisoned rows, is it better to correct them than to remove them? We fine-tune Qwen2.5-14B-Instruct on a mixture of bad medical advice and benign chat data, select a quarter of the poison rows in advance, and either delete them or replace each with a corrected answer to the same prompt, keeping everything else the same. Replacing the rows cuts the EM rate by about a third and improves answers on held-out medical questions, while deleting the same rows has little measurable effect. The advantage is larger when half the poison rows are corrected, and it holds on a second base model and a second misaligned model organism. The content of the replacement appears to matter: paraphrasing the rows while keeping their bad advice shows no clear benefit, and the correct answers distributed with the dataset appear to do about as well as our rewriter\u0027s. Realigning an already-poisoned model with further fine-tuning is known to work, but which data does the work has not been compared directly. We find that a short round of training on corrections beats the same amount of training on generic chat data, that corrections on other medical prompts do roughly as well as corrections of the poisoned prompts themselves, and that instructing the correction writer to model a careful, harm-avoiding assistant adds no measurable benefit over plain corrections. In the settings we tested, correcting harmful training data reduces EM more than deleting it.", "arxiv_id": "2609.37624", "arxiv_url": "https://arxiv.org/abs/2609.37624", "authors": ["Jacob Epifano"], "brief": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u5c11\u91cf\u6709\u5bb3\u793a\u8303\u5fae\u8c03\u540e\u51fa\u73b0\u7684\u201c\u6d8c\u73b0\u5931\u914d\u201d\u95ee\u9898\uff0c\u6bd4\u8f83\u5220\u9664\u6709\u6bd2\u8bad\u7ec3\u6837\u672c\u4e0e\u5c06\u5176\u6539\u5199\u4e3a\u6b63\u786e\u56de\u7b54\u7684\u6548\u679c\u3002\u5728 Qwen2.5-14B-Instruct \u7b49\u8bbe\u7f6e\u4e2d\uff0c\u7ea0\u6b63\u6709\u5bb3\u6837\u672c\u6bd4\u5220\u9664\u66f4\u80fd\u964d\u4f4e\u5931\u914d\u7387\uff0c\u5e76\u63d0\u5347\u533b\u5b66\u95ee\u7b54\u8868\u73b0\uff1b\u8fdb\u4e00\u6b65\u8bad\u7ec3\u65f6\uff0c\u9488\u5bf9\u6027\u7ea0\u6b63\u6570\u636e\u4e5f\u4f18\u4e8e\u901a\u7528\u804a\u5929\u6570\u636e\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37624", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u5bf9\u9f50", "\u6570\u636e\u8d28\u91cf", "\u5b89\u5168\u5fae\u8c03"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37624v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Correct, Don\u0027t Delete: Mitigating Emergent Misalignment with Corrective Supervision", "tldr": "\u672c\u6587\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u5c11\u91cf\u6709\u5bb3\u793a\u8303\u5fae\u8c03\u540e\u51fa\u73b0\u7684\u201c\u6d8c\u73b0\u5931\u914d\u201d\u95ee\u9898\uff0c\u6bd4\u8f83\u5220\u9664\u6709\u6bd2\u8bad\u7ec3\u6837\u672c\u4e0e\u5c06\u5176\u6539\u5199\u4e3a\u6b63\u786e\u56de\u7b54\u7684\u6548\u679c\u3002\u5728 Qwen2.5-14B-Instruct \u7b49\u8bbe\u7f6e\u4e2d\uff0c\u7ea0\u6b63\u6709\u5bb3\u6837\u672c\u6bd4\u5220\u9664\u66f4\u80fd\u964d\u4f4e\u5931\u914d\u7387\uff0c\u5e76\u63d0\u5347\u533b\u5b66\u95ee\u7b54\u8868\u73b0\uff1b\u8fdb\u4e00\u6b65\u8bad\u7ec3\u65f6\uff0c\u9488\u5bf9\u6027\u7ea0\u6b63\u6570\u636e\u4e5f\u4f18\u4e8e\u901a\u7528\u804a\u5929\u6570\u636e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Growing large language model applications demand efficient inference. At high concurrency, block-diffusion speculative decoding suffers from verification padding, rejected candidates, and incompatibility between variable prefixes and fixed-shape graphs. Uniform truncation sacrifices acceptable tokens. We present DScale, preserving drafter architecture, weights, and full draft length. A separate 112K-parameter predictor requires neither confidence calibration nor hardware speed-curve preparation. Path-aware tiles reduce padding. Dynamic verify-length (DVL) allocation packs scored prefixes into half the native verification capacity. Fixed-address workspaces propagate changing boundaries through verification and acceptance while reusing captured graphs. On A100-40GB with tensor parallelism 1, Qwen3-8B and Qwen3-4B cover four datasets and concurrency 8-32, reusing each target\u0027s frozen predictor. Geometric-mean throughput gains across these configurations are respectively 43.9% and 48.8% over DFlash, 22.2% and 37.7% over DSpark, and 24.4% and 32.0% over Domino, with lower request latency. Cumulative ablations show that adding the three mechanisms successively increases geometric-mean throughput, while budget adjustment improves accepted-token retention. GPU profiling shows that complete decode-step time on GSM8K decreases by 30.8-52.5% relative to DFlash", "arxiv_id": "2609.37532", "arxiv_url": "https://arxiv.org/abs/2609.37532", "authors": ["Rongjian Chen", "Minxian Xu", "Zhengxin Fang", "Kejiang Ye", "Chengzhong Xu"], "brief": "\u672c\u6587\u63d0\u51fa DScale\uff0c\u7528\u4e8e\u63d0\u5347\u5927\u8bed\u8a00\u6a21\u578b\u5757\u6269\u6563\u5f0f\u6295\u673a\u89e3\u7801\u5728\u9ad8\u5e76\u53d1\u4e0b\u7684\u63a8\u7406\u6548\u7387\uff0c\u9488\u5bf9\u9a8c\u8bc1\u586b\u5145\u3001\u5019\u9009\u62d2\u7edd\u548c\u52a8\u6001\u56fe\u5f62\u4e0d\u517c\u5bb9\u7b49\u95ee\u9898\u8bbe\u8ba1\u4e86\u81ea\u9002\u5e94\u9a8c\u8bc1\u673a\u5236\u3002\u5176\u901a\u8fc7\u8def\u5f84\u611f\u77e5\u5207\u7247\u3001\u52a8\u6001\u9a8c\u8bc1\u957f\u5ea6\u5206\u914d\u548c\u56fa\u5b9a\u5730\u5740\u5de5\u4f5c\u533a\uff0c\u5728\u4e0d\u6539\u52a8\u8349\u7a3f\u6a21\u578b\u7ed3\u6784\u4e0e\u6743\u91cd\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u541e\u5410\u5e76\u964d\u4f4e\u5ef6\u8fdf\uff0c\u5728 A100 \u4e0a\u76f8\u5bf9\u591a\u79cd\u57fa\u7ebf\u53d6\u5f97\u7ea6 22% \u5230 49% \u7684\u51e0\u4f55\u5e73\u5747\u541e\u5410\u63d0\u5347\u3002", "categories": ["cs.DC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37532", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u6295\u673a\u89e3\u7801", "\u7cfb\u7edf\u4f18\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37532v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DScale: Scaling Block-Diffusion Speculative Decoding with Adaptive Verification", "tldr": "\u672c\u6587\u63d0\u51fa DScale\uff0c\u7528\u4e8e\u63d0\u5347\u5927\u8bed\u8a00\u6a21\u578b\u5757\u6269\u6563\u5f0f\u6295\u673a\u89e3\u7801\u5728\u9ad8\u5e76\u53d1\u4e0b\u7684\u63a8\u7406\u6548\u7387\uff0c\u9488\u5bf9\u9a8c\u8bc1\u586b\u5145\u3001\u5019\u9009\u62d2\u7edd\u548c\u52a8\u6001\u56fe\u5f62\u4e0d\u517c\u5bb9\u7b49\u95ee\u9898\u8bbe\u8ba1\u4e86\u81ea\u9002\u5e94\u9a8c\u8bc1\u673a\u5236\u3002\u5176\u901a\u8fc7\u8def\u5f84\u611f\u77e5\u5207\u7247\u3001\u52a8\u6001\u9a8c\u8bc1\u957f\u5ea6\u5206\u914d\u548c\u56fa\u5b9a\u5730\u5740\u5de5\u4f5c\u533a\uff0c\u5728\u4e0d\u6539\u52a8\u8349\u7a3f\u6a21\u578b\u7ed3\u6784\u4e0e\u6743\u91cd\u7684\u60c5\u51b5\u4e0b\u663e\u8457\u63d0\u5347\u541e\u5410\u5e76\u964d\u4f4e\u5ef6\u8fdf\uff0c\u5728 A100 \u4e0a\u76f8\u5bf9\u591a\u79cd\u57fa\u7ebf\u53d6\u5f97\u7ea6 22% \u5230 49% \u7684\u51e0\u4f55\u5e73\u5747\u541e\u5410\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World-Action Models (WAMs) couple action generation with predictions of how physical interactions unfold. However, current post-deployment learning paradigms typically improve behavior without requiring better world predictions. Especially in dexterous manipulation, small execution errors can compound in high-dimensional action spaces, hindering policy improvement and pushing interactions beyond the world model\u0027s training distribution. Motivated by this, we propose Direct Experience World-Model Optimization (DEWO), a post-deployment learning paradigm for WAMs that, alongside action imitation, refines world representations through visual experience to better condition action generation. Specifically, it identifies interaction turning points and learns from successful and failed futures to support classifier-free guidance. An additional value head estimates task progress from video representations and activates guidance when progress stalls during inference. Across five DexJoCo tasks, DEWO improves average success across all three WAM formulations. Ablations show that visual supervision from successful and failed continuations improves both prediction and control beyond action supervision alone. On four real-world tasks across Wuji and Sharpa, 3 x 3 grid evaluations show that two rounds of deployment learning increase success from 51.0% to 71.7% in cells with at least one initial success, a gain of 20.7 percentage points. These findings support continued predictive learning for improving control through deployment experience, making world modeling an active part of WAM adaptation.", "arxiv_id": "2609.37398", "arxiv_url": "https://arxiv.org/abs/2609.37398", "authors": ["Xiangcheng Zhan", "Zirui Chen", "Yicheng Zhao", "Ziteng Gao", "Shuo Yang"], "brief": "\u8bba\u6587\u63d0\u51fa DEWO\uff0c\u4e00\u79cd\u9762\u5411\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u7684\u90e8\u7f72\u540e\u5b66\u4e60\u65b9\u6cd5\uff0c\u4e0d\u4ec5\u6a21\u4eff\u52a8\u4f5c\uff0c\u8fd8\u5229\u7528\u771f\u5b9e\u4ea4\u4e92\u89c6\u9891\u6301\u7eed\u4f18\u5316\u4e16\u754c\u8868\u5f81\uff0c\u5e76\u901a\u8fc7\u6210\u529f/\u5931\u8d25\u672a\u6765\u548c\u4efb\u52a1\u8fdb\u5ea6\u4ef7\u503c\u5934\u6765\u5f15\u5bfc\u52a8\u4f5c\u751f\u6210\u3002\u5728 DexJoCo \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\uff0c\u8be5\u65b9\u6cd5\u63d0\u5347\u4e86\u9884\u6d4b\u4e0e\u63a7\u5236\u8868\u73b0\uff0c\u771f\u5b9e\u573a\u666f\u4e24\u8f6e\u90e8\u7f72\u5b66\u4e60\u5c06\u6709\u521d\u59cb\u6210\u529f\u5355\u5143\u7684\u6210\u529f\u7387\u4ece 51.0% \u63d0\u5347\u5230 71.7%\u3002", "categories": ["cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37398", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u64cd\u4f5c", "\u6a21\u4eff\u5b66\u4e60", "\u89c6\u89c9\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37398v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Direct Experience World-Model Optimization: Learning the World Beyond Action Imitation", "tldr": "\u8bba\u6587\u63d0\u51fa DEWO\uff0c\u4e00\u79cd\u9762\u5411\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u7684\u90e8\u7f72\u540e\u5b66\u4e60\u65b9\u6cd5\uff0c\u4e0d\u4ec5\u6a21\u4eff\u52a8\u4f5c\uff0c\u8fd8\u5229\u7528\u771f\u5b9e\u4ea4\u4e92\u89c6\u9891\u6301\u7eed\u4f18\u5316\u4e16\u754c\u8868\u5f81\uff0c\u5e76\u901a\u8fc7\u6210\u529f/\u5931\u8d25\u672a\u6765\u548c\u4efb\u52a1\u8fdb\u5ea6\u4ef7\u503c\u5934\u6765\u5f15\u5bfc\u52a8\u4f5c\u751f\u6210\u3002\u5728 DexJoCo \u548c\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\uff0c\u8be5\u65b9\u6cd5\u63d0\u5347\u4e86\u9884\u6d4b\u4e0e\u63a7\u5236\u8868\u73b0\uff0c\u771f\u5b9e\u573a\u666f\u4e24\u8f6e\u90e8\u7f72\u5b66\u4e60\u5c06\u6709\u521d\u59cb\u6210\u529f\u5355\u5143\u7684\u6210\u529f\u7387\u4ece 51.0% \u63d0\u5347\u5230 71.7%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Latent world models are trained to predict what happens next, so nothing in their objective separates what an action caused from what merely co-occurred with it. Object-masking models such as C-JEPA intervene on what the predictor can see; we intervene on what physically happens. From one saved simulator state we run the dynamics under an action $a$ and under a reference action $a_{\\varnothing}$, and train the model to predict the difference $\u0394z=z^{a}-z^{a_{\\varnothing}}$ between the two latent futures. The resulting objective, Do-JEPA, has an effect loss, a support loss (where the action enters), a propagation loss (where its effect travels) and invariance losses (what must not change). In a synthetic system with object-aligned variables, support supervision finds the directly intervened object in 99.95% of test cases, where a sparse action mask sends the action to a nuisance slot in every case, and response-onset supervision recovers the ring-shaped propagation graph (edge AUROC 0.975 vs. 0.624). From pixels, the effect loss beats a control trained on exactly the same data: it lowers latent effect error by 28.4% on an end-to-end LeWM model and physical effect error by 13.5% when trained and tested on natural action sequences, and on three independently generated CausalWorld benchmarks it lowers responsive effect error by about 20% under physics shifts and the latent context sensitivity of predicted effects by 66%. Trained from scratch it costs factual accuracy; fine-tuning an existing model with it removes this cost. Together, these results show that intervening on the world, rather than on what the model sees, helps latent world models predict what their actions cause.", "arxiv_id": "2609.37378", "arxiv_url": "https://arxiv.org/abs/2609.37378", "authors": ["Hossein Resani", "Javen Qinfeng Shi"], "brief": "\u672c\u6587\u63d0\u51fa Do-JEPA\uff0c\u901a\u8fc7\u5728\u540c\u4e00\u6a21\u62df\u5668\u72b6\u6001\u4e0b\u6bd4\u8f83\u771f\u5b9e\u52a8\u4f5c\u4e0e\u53c2\u8003\u52a8\u4f5c\u540e\u7684\u6f5c\u5728\u672a\u6765\u5dee\u5f02\uff0c\u76f4\u63a5\u5b66\u4e60\u52a8\u4f5c\u9020\u6210\u7684\u56e0\u679c\u6548\u5e94\uff0c\u800c\u4e0d\u662f\u4ec5\u906e\u853d\u6a21\u578b\u8f93\u5165\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u80fd\u66f4\u51c6\u786e\u5b9a\u4f4d\u53d7\u52a8\u4f5c\u5f71\u54cd\u7684\u5bf9\u8c61\u4e0e\u4f20\u64ad\u7ed3\u6784\uff0c\u5e76\u5728\u50cf\u7d20\u7ea7\u4e16\u754c\u6a21\u578b\u4e2d\u964d\u4f4e\u6f5c\u5728/\u7269\u7406\u6548\u5e94\u9884\u6d4b\u8bef\u5dee\uff1b\u4ece\u96f6\u8bad\u7ec3\u4f1a\u635f\u5931\u4e8b\u5b9e\u9884\u6d4b\u7cbe\u5ea6\uff0c\u4f46\u5fae\u8c03\u53ef\u907f\u514d\u8be5\u4ee3\u4ef7\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37378", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u56e0\u679c\u5b66\u4e60", "\u8868\u5f81\u5b66\u4e60", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37378v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Do-JEPA: From Masking to Intervention in Latent World Models", "tldr": "\u672c\u6587\u63d0\u51fa Do-JEPA\uff0c\u901a\u8fc7\u5728\u540c\u4e00\u6a21\u62df\u5668\u72b6\u6001\u4e0b\u6bd4\u8f83\u771f\u5b9e\u52a8\u4f5c\u4e0e\u53c2\u8003\u52a8\u4f5c\u540e\u7684\u6f5c\u5728\u672a\u6765\u5dee\u5f02\uff0c\u76f4\u63a5\u5b66\u4e60\u52a8\u4f5c\u9020\u6210\u7684\u56e0\u679c\u6548\u5e94\uff0c\u800c\u4e0d\u662f\u4ec5\u906e\u853d\u6a21\u578b\u8f93\u5165\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u80fd\u66f4\u51c6\u786e\u5b9a\u4f4d\u53d7\u52a8\u4f5c\u5f71\u54cd\u7684\u5bf9\u8c61\u4e0e\u4f20\u64ad\u7ed3\u6784\uff0c\u5e76\u5728\u50cf\u7d20\u7ea7\u4e16\u754c\u6a21\u578b\u4e2d\u964d\u4f4e\u6f5c\u5728/\u7269\u7406\u6548\u5e94\u9884\u6d4b\u8bef\u5dee\uff1b\u4ece\u96f6\u8bad\u7ec3\u4f1a\u635f\u5931\u4e8b\u5b9e\u9884\u6d4b\u7cbe\u5ea6\uff0c\u4f46\u5fae\u8c03\u53ef\u907f\u514d\u8be5\u4ee3\u4ef7\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language model (LLM) routing aims to assign each query to the most suitable model from a heterogeneous candidate pool, improving the quality--efficiency trade-off of LLM inference. Existing routers are typically learned through local fitting: a router is optimized for a particular query workload and candidate pool, and often requires additional supervision or retraining as the routing environment changes. We ask whether LLM routing can instead be approached from a foundation-model perspective, learning a reusable routing capability that generalizes across tasks, candidate models, and deployment conditions. To this end, we introduce RouteFM, which learns to characterize anonymous candidate models from behavioral context and infer their target-specific capabilities, rather than binding routing decisions to fixed model identities or a single environment. Through episodic pretraining across heterogeneous routing environments, this capability can be reused by a frozen router and adapted to new environments through context alone. Experiments demonstrate transfer across changes in domains, modalities, candidate pools, and context budgets, with the largest gains when behavioral evidence is limited. On MMR-Bench, which is excluded from pretraining, RouteFM outperforms the strongest baseline by 2.23 quality points with only eight observations per candidate. These results support moving LLM routing from repeated local fitting toward a pretrain once, route anywhere paradigm. Our code is publicly available at https://github.com/LAMDA-Model-Reuse/RouteFM.", "arxiv_id": "2609.37362", "arxiv_url": "https://arxiv.org/abs/2609.37362", "authors": ["Guannan Lai", "Han-Jia Ye"], "brief": "\u8bba\u6587\u63d0\u51fa RouteFM\uff0c\u5c06 LLM \u8def\u7531\u4ece\u9488\u5bf9\u7279\u5b9a\u4efb\u52a1\u548c\u6a21\u578b\u6c60\u7684\u5c40\u90e8\u8bad\u7ec3\uff0c\u8f6c\u5411\u4e00\u6b21\u9884\u8bad\u7ec3\u3001\u8de8\u73af\u5883\u590d\u7528\u7684\u57fa\u7840\u6a21\u578b\u8303\u5f0f\u3002\u5b83\u901a\u8fc7\u5019\u9009\u6a21\u578b\u7684\u884c\u4e3a\u4e0a\u4e0b\u6587\u6765\u63a8\u65ad\u5176\u80fd\u529b\uff0c\u5728\u4efb\u52a1\u3001\u6a21\u6001\u3001\u6a21\u578b\u6c60\u548c\u4e0a\u4e0b\u6587\u9884\u7b97\u53d8\u5316\u65f6\u90fd\u80fd\u8fc1\u79fb\uff0c\u5c24\u5176\u5728\u89c2\u6d4b\u6837\u672c\u5f88\u5c11\u65f6\u4f18\u52bf\u660e\u663e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37362", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8def\u7531", "\u57fa\u7840\u6a21\u578b", "\u8fc1\u79fb\u6cdb\u5316"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37362v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Pretrain Once, Route Anywhere: Towards a Foundation Model for LLM Routing", "tldr": "\u8bba\u6587\u63d0\u51fa RouteFM\uff0c\u5c06 LLM \u8def\u7531\u4ece\u9488\u5bf9\u7279\u5b9a\u4efb\u52a1\u548c\u6a21\u578b\u6c60\u7684\u5c40\u90e8\u8bad\u7ec3\uff0c\u8f6c\u5411\u4e00\u6b21\u9884\u8bad\u7ec3\u3001\u8de8\u73af\u5883\u590d\u7528\u7684\u57fa\u7840\u6a21\u578b\u8303\u5f0f\u3002\u5b83\u901a\u8fc7\u5019\u9009\u6a21\u578b\u7684\u884c\u4e3a\u4e0a\u4e0b\u6587\u6765\u63a8\u65ad\u5176\u80fd\u529b\uff0c\u5728\u4efb\u52a1\u3001\u6a21\u6001\u3001\u6a21\u578b\u6c60\u548c\u4e0a\u4e0b\u6587\u9884\u7b97\u53d8\u5316\u65f6\u90fd\u80fd\u8fc1\u79fb\uff0c\u5c24\u5176\u5728\u89c2\u6d4b\u6837\u672c\u5f88\u5c11\u65f6\u4f18\u52bf\u660e\u663e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-using agents are entering settings where a wrong action carries real cost, and the benchmarks certifying them grade what each simulated tool call reports having done, assuming the tool did what its interface advertises. The audit taxonomies we survey publish no category for that assumption, and a defect beneath a score is present on every rerun. We treat a tool\u0027s advertised surfaces as an executable contract, check the implementation against it, and trace each score\u0027s provenance through the task files and evaluator code to the verdicts that derive from state a defective tool should have written. Across 34 audited mutating tools in four benchmarks we confirm seven tool defects and one evaluator property at pinned commits. On injected defects the checker raised no false positive in 25 flags, flagged 2 of 5 negative controls, and missed most: in 29 of 33 scored misses a clause covered the defect but no probe revealed it. The checker\u0027s own static half, run alone, flags 14 of 17 confirmed sites, so on these findings the dynamic half confirms and traces rather than discovers. Twelve further AgentDojo tools, with six held-out tools and the seven audited first, complete its 25-tool mutating surface, on which at least 5 tools diverge from their advertised surface as our contracts read it, a rate for AgentDojo alone. No gold trajectory reaches either tau2-bench defect; on 1,120 paths built to isolate the telecom defect, a number fixed by construction, the evaluator rewards a refuel of a suspended line and fails the repaired tool. The clearest case is a clinical benchmark whose tool tells the agent each write executed under a documented no-write design its interface does not disclose; its grader takes that message as evidence, so its action success rate records whether a request carried the expected payload, not whether any record changed.", "arxiv_id": "2609.37315", "arxiv_url": "https://arxiv.org/abs/2609.37315", "authors": ["Rohith Reddy Bellibatlu", "Zichong Wang", "Wenbin Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa\u628a\u5de5\u5177\u578b\u667a\u80fd\u4f53\u57fa\u51c6\u4e2d\u7684\u5de5\u5177\u63a5\u53e3\u89c6\u4e3a\u201c\u53ef\u6267\u884c\u5951\u7ea6\u201d\uff0c\u5ba1\u8ba1\u5b9e\u73b0\u3001\u4efb\u52a1\u6587\u4ef6\u548c\u8bc4\u6d4b\u5668\u662f\u5426\u771f\u7684\u7b26\u5408\u5de5\u5177\u58f0\u79f0\u7684\u884c\u4e3a\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u57fa\u51c6\u4e2d\u53d1\u73b0\u82e5\u5e72\u5de5\u5177\u7f3a\u9677\u548c\u8bc4\u6d4b\u5668\u95ee\u9898\uff0c\u8bf4\u660e\u90e8\u5206\u5206\u6570\u8861\u91cf\u7684\u662f\u63a5\u53e3\u56de\u62a5\u6216\u8f7d\u8377\u662f\u5426\u7b26\u5408\u9884\u671f\uff0c\u800c\u4e0d\u662f\u771f\u5b9e\u72b6\u6001\u662f\u5426\u88ab\u6b63\u786e\u6539\u53d8\u3002", "categories": ["cs.SE", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37315", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u57fa\u51c6\u8bc4\u6d4b", "\u8f6f\u4ef6\u5ba1\u8ba1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37315v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Do Agent Benchmarks Do What They Say? An Executable-Contract Audit of Tool-Using Agent Environments", "tldr": "\u8bba\u6587\u63d0\u51fa\u628a\u5de5\u5177\u578b\u667a\u80fd\u4f53\u57fa\u51c6\u4e2d\u7684\u5de5\u5177\u63a5\u53e3\u89c6\u4e3a\u201c\u53ef\u6267\u884c\u5951\u7ea6\u201d\uff0c\u5ba1\u8ba1\u5b9e\u73b0\u3001\u4efb\u52a1\u6587\u4ef6\u548c\u8bc4\u6d4b\u5668\u662f\u5426\u771f\u7684\u7b26\u5408\u5de5\u5177\u58f0\u79f0\u7684\u884c\u4e3a\u3002\u4f5c\u8005\u5728\u591a\u4e2a\u57fa\u51c6\u4e2d\u53d1\u73b0\u82e5\u5e72\u5de5\u5177\u7f3a\u9677\u548c\u8bc4\u6d4b\u5668\u95ee\u9898\uff0c\u8bf4\u660e\u90e8\u5206\u5206\u6570\u8861\u91cf\u7684\u662f\u63a5\u53e3\u56de\u62a5\u6216\u8f7d\u8377\u662f\u5426\u7b26\u5408\u9884\u671f\uff0c\u800c\u4e0d\u662f\u771f\u5b9e\u72b6\u6001\u662f\u5426\u88ab\u6b63\u786e\u6539\u53d8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Can reasoning models trick chain of thought (CoT) monitors and perform hidden computation without revealing it in their thinking traces? We show that the answer depends on the underlying task difficulty and the model size. Simple computations can be performed covertly; however, beyond a threshold depending on model size, successfully solving the task necessarily leaks a near-linear amount of information about the covert task input into the CoT. Therefore, sufficiently complex hidden computation always leaves an information-theoretic footprint. However, concerningly, this leakage need not be readable: Under plausible cryptographic assumptions, even a one-layer Transformer can encrypt its reasoning online so that no polynomial-time monitor can extract information about the hidden computation. Overall, our theoretical and empirical results provide a holistic view of both the opportunities and the limitations of CoT monitoring.", "arxiv_id": "2609.37312", "arxiv_url": "https://arxiv.org/abs/2609.37312", "authors": ["Mohammadali Mohammadkhani", "Madhava Krishna", "Yash Sarrof", "Michael Hahn"], "brief": "\u8bba\u6587\u7814\u7a76\u63a8\u7406\u6a21\u578b\u662f\u5426\u80fd\u5728\u601d\u7ef4\u94fe\u4e2d\u9690\u85cf\u8ba1\u7b97\u5e76\u7ed5\u8fc7\u76d1\u63a7\u3002\u7ed3\u679c\u8868\u660e\uff0c\u7b80\u5355\u8ba1\u7b97\u53ef\u4ee5\u88ab\u9690\u853d\u6267\u884c\uff0c\u4f46\u590d\u6742\u5230\u4e00\u5b9a\u7a0b\u5ea6\u540e\u5fc5\u7136\u5728 CoT \u4e2d\u6cc4\u9732\u8fd1\u7ebf\u6027\u4fe1\u606f\uff1b\u4e0d\u8fc7\u8fd9\u4e9b\u6cc4\u9732\u5728\u5bc6\u7801\u5b66\u5047\u8bbe\u4e0b\u53ef\u80fd\u4e0d\u53ef\u8bfb\uff0c\u9650\u5236\u4e86 CoT \u76d1\u63a7\u7684\u5b9e\u9645\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37312", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u601d\u7ef4\u94fe", "\u6a21\u578b\u76d1\u63a7", "\u4fe1\u606f\u8bba", "\u5bc6\u7801\u5b66"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37312v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Hidden Reasoning Must Leak, but Need Not Be Readable: Fundamental Opportunities and Limits for Chain-of-Thought Monitoring", "tldr": "\u8bba\u6587\u7814\u7a76\u63a8\u7406\u6a21\u578b\u662f\u5426\u80fd\u5728\u601d\u7ef4\u94fe\u4e2d\u9690\u85cf\u8ba1\u7b97\u5e76\u7ed5\u8fc7\u76d1\u63a7\u3002\u7ed3\u679c\u8868\u660e\uff0c\u7b80\u5355\u8ba1\u7b97\u53ef\u4ee5\u88ab\u9690\u853d\u6267\u884c\uff0c\u4f46\u590d\u6742\u5230\u4e00\u5b9a\u7a0b\u5ea6\u540e\u5fc5\u7136\u5728 CoT \u4e2d\u6cc4\u9732\u8fd1\u7ebf\u6027\u4fe1\u606f\uff1b\u4e0d\u8fc7\u8fd9\u4e9b\u6cc4\u9732\u5728\u5bc6\u7801\u5b66\u5047\u8bbe\u4e0b\u53ef\u80fd\u4e0d\u53ef\u8bfb\uff0c\u9650\u5236\u4e86 CoT \u76d1\u63a7\u7684\u5b9e\u9645\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World-action models (WAMs) couple future visual-state prediction with action generation. By adapting video generators or image-editing models pretrained at scale, a prominent line of recent WAMs inherits both predictive knowledge and the models in which it was learned. We ask whether a predictive visual latent space induced by large-scale predictive pretraining can instead provide a sufficient foundation for effective WAM learning without inheriting a complete pretrained visual generative model. To answer this question, we introduce V-JEPA Policy, a simple framework that builds a WAM on the latent space of a frozen V-JEPA 2.1 encoder. An instruction-conditioned future-latent predictor and a flow-matching action expert are jointly learned from scratch in a single downstream stage, with the predictor\u0027s future-informed context key--value states conditioning action generation. With 0.9B total parameters, of which 0.6B are trainable, V-JEPA Policy achieves competitive performance with representative WAM and vision-language-action baselines across LIBERO, LIBERO-Plus, and RoboCasa-GR1. Comparing visual foundations under the same downstream framework and training budget identifies V-JEPA latents as more effective than the discriminative, reconstructive, and video-understanding-oriented alternatives, particularly under distribution shifts. Beyond task-specific learning, pretraining the predictor on DROID video--instruction pairs without action labels and adapting it into a WAM yields substantial gains in downstream control and out-of-distribution generalization. Together, these findings establish predictive visual latents as a foundation for effective WAM learning from task-specific demonstrations and for transferring future-modeling knowledge acquired from broader in-the-wild videos. Our code is available at https://github.com/breez3young/VJEPA-Policy.", "arxiv_id": "2609.37250", "arxiv_url": "https://arxiv.org/abs/2609.37250", "authors": ["Yang Zhang", "Jiangyuan Zhao", "Chenyou Fan", "Jiayu Hu", "Xiu Yuan", "Chenjia Bai", "Xiu Li"], "brief": "\u8bba\u6587\u63d0\u51fa V-JEPA Policy\uff0c\u5728\u51bb\u7ed3\u7684 V-JEPA 2.1 \u9884\u6d4b\u89c6\u89c9\u6f5c\u7a7a\u95f4\u4e0a\u4ece\u5934\u8bad\u7ec3\u6307\u4ee4\u6761\u4ef6\u7684\u672a\u6765\u6f5c\u53d8\u91cf\u9884\u6d4b\u5668\u548c flow-matching \u52a8\u4f5c\u4e13\u5bb6\uff0c\u7528\u4e8e\u6784\u5efa\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u3002\u8be5\u65b9\u6cd5\u5728 LIBERO\u3001LIBERO-Plus \u548c RoboCasa-GR1 \u4e0a\u8fbe\u5230\u4e0e\u4ee3\u8868\u6027 WAM/VLA \u65b9\u6cd5\u76f8\u5f53\u7684\u8868\u73b0\uff0c\u5e76\u663e\u793a V-JEPA \u9884\u6d4b\u6f5c\u8868\u793a\u5728\u5206\u5e03\u504f\u79fb\u4e0b\u4f18\u4e8e\u5224\u522b\u5f0f\u3001\u91cd\u5efa\u5f0f\u548c\u89c6\u9891\u7406\u89e3\u7c7b\u89c6\u89c9\u57fa\u7840\u6a21\u578b\uff1b\u5229\u7528\u65e0\u52a8\u4f5c\u6807\u7b7e\u7684 DROID \u89c6\u9891\u9884\u8bad\u7ec3\u9884\u6d4b\u5668\u8fd8\u80fd\u663e\u8457\u63d0\u5347\u4e0b\u6e38\u63a7\u5236\u548c\u6cdb\u5316\u3002", "categories": ["cs.CV", "cs.AI", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37250", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u673a\u5668\u4eba\u63a7\u5236", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u8868\u5f81"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37250v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "V-JEPA Policy: Building Effective World-Action Models on Predictive Visual Latents", "tldr": "\u8bba\u6587\u63d0\u51fa V-JEPA Policy\uff0c\u5728\u51bb\u7ed3\u7684 V-JEPA 2.1 \u9884\u6d4b\u89c6\u89c9\u6f5c\u7a7a\u95f4\u4e0a\u4ece\u5934\u8bad\u7ec3\u6307\u4ee4\u6761\u4ef6\u7684\u672a\u6765\u6f5c\u53d8\u91cf\u9884\u6d4b\u5668\u548c flow-matching \u52a8\u4f5c\u4e13\u5bb6\uff0c\u7528\u4e8e\u6784\u5efa\u4e16\u754c-\u52a8\u4f5c\u6a21\u578b\u3002\u8be5\u65b9\u6cd5\u5728 LIBERO\u3001LIBERO-Plus \u548c RoboCasa-GR1 \u4e0a\u8fbe\u5230\u4e0e\u4ee3\u8868\u6027 WAM/VLA \u65b9\u6cd5\u76f8\u5f53\u7684\u8868\u73b0\uff0c\u5e76\u663e\u793a V-JEPA \u9884\u6d4b\u6f5c\u8868\u793a\u5728\u5206\u5e03\u504f\u79fb\u4e0b\u4f18\u4e8e\u5224\u522b\u5f0f\u3001\u91cd\u5efa\u5f0f\u548c\u89c6\u9891\u7406\u89e3\u7c7b\u89c6\u89c9\u57fa\u7840\u6a21\u578b\uff1b\u5229\u7528\u65e0\u52a8\u4f5c\u6807\u7b7e\u7684 DROID \u89c6\u9891\u9884\u8bad\u7ec3\u9884\u6d4b\u5668\u8fd8\u80fd\u663e\u8457\u63d0\u5347\u4e0b\u6e38\u63a7\u5236\u548c\u6cdb\u5316\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models (LLMs) are increasingly deployed for natural-language logical reasoning, where the final answer is easy to check but the proof behind it is not. In natural-language logical reasoning, an intermediate conclusion should follow from its premises, and the resulting derivation should support the final answer. Existing methods lack machine-checkable verification of intermediate conclusions and answer-supporting proof dependencies, so they may assign credit to invalid or answer-irrelevant steps. We propose Proof-R1, an RL framework from formal verification that trains LLMs to construct verifiable proofs for natural-language logical reasoning. Proof-R1 admits a generated conclusion into the verified proof state only when the corresponding reasoning action satisfies the proof obligations through UNSAT-based machine-checkable formal verification. Proof-R1 also recovers the answer-supporting dependency closure to trace the proof structure of the final answer and align outcome credit with the proof dependencies. Experiments demonstrate that Proof-R1 improves answer accuracy across three logical reasoning benchmarks and four backbone models and outperforms training-free agents and training-based methods in terms of reasoning-process verifiability.", "arxiv_id": "2609.37203", "arxiv_url": "https://arxiv.org/abs/2609.37203", "authors": ["Qili Zhang", "Qianren Mao", "Hanze Cai", "Kaiming Zhao", "Yuening He", "Xihan Lei", "Yashuo Luo", "Hanwen Hao", "Yutong Gu", "Likang Xiao", "Zhijun Chen", "Weifeng Jiang", "Haoyi Zhou", "Jianxin Li"], "brief": "\u63d0\u51fa Proof-R1\uff0c\u5c06\u5f62\u5f0f\u5316\u9a8c\u8bc1\u5f15\u5165\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u8ba9\u5927\u6a21\u578b\u5728\u81ea\u7136\u8bed\u8a00\u903b\u8f91\u63a8\u7406\u4e2d\u4e0d\u4ec5\u7ed9\u51fa\u7b54\u6848\uff0c\u8fd8\u751f\u6210\u53ef\u673a\u5668\u68c0\u9a8c\u7684\u8bc1\u660e\u8fc7\u7a0b\u3002\u8be5\u65b9\u6cd5\u7528 UNSAT \u9a8c\u8bc1\u4e2d\u95f4\u7ed3\u8bba\uff0c\u5e76\u6839\u636e\u652f\u6301\u6700\u7ec8\u7b54\u6848\u7684\u8bc1\u660e\u4f9d\u8d56\u5206\u914d\u5956\u52b1\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u548c\u6a21\u578b\u4e0a\u63d0\u5347\u4e86\u51c6\u786e\u7387\u4e0e\u63a8\u7406\u8fc7\u7a0b\u53ef\u9a8c\u8bc1\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37203", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u903b\u8f91\u63a8\u7406", "\u5f3a\u5316\u5b66\u4e60", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37203v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Learning to Prove, Not Just to Answer: Reinforcement Learning from Formal Verification for Natural-Language Logical Reasoning", "tldr": "\u63d0\u51fa Proof-R1\uff0c\u5c06\u5f62\u5f0f\u5316\u9a8c\u8bc1\u5f15\u5165\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\uff0c\u8ba9\u5927\u6a21\u578b\u5728\u81ea\u7136\u8bed\u8a00\u903b\u8f91\u63a8\u7406\u4e2d\u4e0d\u4ec5\u7ed9\u51fa\u7b54\u6848\uff0c\u8fd8\u751f\u6210\u53ef\u673a\u5668\u68c0\u9a8c\u7684\u8bc1\u660e\u8fc7\u7a0b\u3002\u8be5\u65b9\u6cd5\u7528 UNSAT \u9a8c\u8bc1\u4e2d\u95f4\u7ed3\u8bba\uff0c\u5e76\u6839\u636e\u652f\u6301\u6700\u7ec8\u7b54\u6848\u7684\u8bc1\u660e\u4f9d\u8d56\u5206\u914d\u5956\u52b1\uff0c\u5728\u591a\u4e2a\u57fa\u51c6\u548c\u6a21\u578b\u4e0a\u63d0\u5347\u4e86\u51c6\u786e\u7387\u4e0e\u63a8\u7406\u8fc7\u7a0b\u53ef\u9a8c\u8bc1\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Human demonstrations capture diverse scenes and rich whole-body skills without requiring robot teleoperation. Prior work on egocentric transfer has emphasized scene generalization in loco-manipulation under decoupled control, leaving direct transfer of coordinated whole-body skills less explored. We present EgoHumanoid-V2, the first egocentric human-to-humanoid skill transfer framework for coordinated whole-body loco-manipulation. At its core, coarse-to-fine action alignment combines kinematic reference correction with dynamics-aware refinement. It improves end-effector pose accuracy while preserving whole-body coordination. We also use robot-arm rendering and training-time image augmentation to reduce the visual embodiment gap and improve viewpoint robustness. On four real-world tasks, vision-language-action (VLA) policies trained on aligned human data show zero-shot skill transfer without target-task robot demonstrations. Task scores are comparable to those of policies trained on teleoperation data at a lower collection cost. These results support human data as direct skill supervision.", "arxiv_id": "2609.37181", "arxiv_url": "https://arxiv.org/abs/2609.37181", "authors": ["Jin Chen", "Yiming Jiang", "Chongyang Xu", "Modi Shi", "Shijia Peng", "Li Chen", "Tianyu Li", "Mu Xu", "Yilun Chen", "Steven Hoi", "Hongyang Li"], "brief": "EgoHumanoid-V2 \u63d0\u51fa\u4ece\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u6f14\u793a\u76f4\u63a5\u8fc1\u79fb\u5230\u7c7b\u4eba\u673a\u5668\u4eba\u7684\u5168\u8eab\u534f\u8c03\u79fb\u52a8\u64cd\u4f5c\u6846\u67b6\uff0c\u901a\u8fc7\u7c97\u5230\u7ec6\u52a8\u4f5c\u5bf9\u9f50\u7ed3\u5408\u8fd0\u52a8\u5b66\u4fee\u6b63\u4e0e\u52a8\u529b\u5b66\u7ec6\u5316\uff0c\u63d0\u5347\u672b\u7aef\u6267\u884c\u5668\u7cbe\u5ea6\u5e76\u4fdd\u6301\u5168\u8eab\u534f\u540c\u3002\u5176\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u57284\u4e2a\u771f\u5b9e\u4efb\u52a1\u4e0a\u65e0\u9700\u76ee\u6807\u4efb\u52a1\u673a\u5668\u4eba\u793a\u6559\u5373\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\uff0c\u6548\u679c\u63a5\u8fd1\u9065\u64cd\u4f5c\u6570\u636e\u8bad\u7ec3\u4f46\u91c7\u96c6\u6210\u672c\u66f4\u4f4e\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37181", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7c7b\u4eba\u673a\u5668\u4eba", "\u6a21\u4eff\u5b66\u4e60", "\u5177\u8eab\u667a\u80fd", "\u79fb\u52a8\u64cd\u4f5c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37181v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EgoHumanoid-V2: Human-to-Humanoid Transfer of Coordinated Whole-Body Skills for Loco-Manipulation", "tldr": "EgoHumanoid-V2 \u63d0\u51fa\u4ece\u4eba\u7c7b\u7b2c\u4e00\u89c6\u89d2\u6f14\u793a\u76f4\u63a5\u8fc1\u79fb\u5230\u7c7b\u4eba\u673a\u5668\u4eba\u7684\u5168\u8eab\u534f\u8c03\u79fb\u52a8\u64cd\u4f5c\u6846\u67b6\uff0c\u901a\u8fc7\u7c97\u5230\u7ec6\u52a8\u4f5c\u5bf9\u9f50\u7ed3\u5408\u8fd0\u52a8\u5b66\u4fee\u6b63\u4e0e\u52a8\u529b\u5b66\u7ec6\u5316\uff0c\u63d0\u5347\u672b\u7aef\u6267\u884c\u5668\u7cbe\u5ea6\u5e76\u4fdd\u6301\u5168\u8eab\u534f\u540c\u3002\u5176\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u7b56\u7565\u57284\u4e2a\u771f\u5b9e\u4efb\u52a1\u4e0a\u65e0\u9700\u76ee\u6807\u4efb\u52a1\u673a\u5668\u4eba\u793a\u6559\u5373\u53ef\u96f6\u6837\u672c\u8fc1\u79fb\uff0c\u6548\u679c\u63a5\u8fd1\u9065\u64cd\u4f5c\u6570\u636e\u8bad\u7ec3\u4f46\u91c7\u96c6\u6210\u672c\u66f4\u4f4e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Computer-use agents have become increasingly capable of executing tasks on live desktops through natural-language instructions, based on trajectories of screenshots, actions, and reasoning. We discover that they can stealthily exhibit inertia, in which they repeat fruitless actions despite recognizing that these actions are ineffective. We hypothesize that inertia is reflected in the agent\u0027s internal state, i.e., the activation values of the agent\u0027s underlying model, and propose a protocol to measure the relationship between the two. Extensive analysis of high-dimensional activation states shows that inertia corresponds to an absorbing region of activation space, where activation values become stale across actions and even after attempts to steer them. We conjecture that drastically changing the agents\u0027 activations by re-initializing them is necessary to escape inertia. Specifically, we propose R$^3$ (Reset, Reroute, Restore), which temporarily resets the agent\u0027s context trajectory to escape the absorbing region and then restores the historical context to effectively complete the task. Our approach yields 17-55% lower measured inertia across models relative to unmodified agents. These results suggest that changing the context can interrupt recurrence more effectively than directly steering the resulting activations. Our code is available at https://anonymous.4open.science/r/vlm-agent-defense-D076", "arxiv_id": "2609.37176", "arxiv_url": "https://arxiv.org/abs/2609.37176", "authors": ["Giulio Segalini", "Zhi Wen Soi", "J\u00e9r\u00e9mie Decouchant", "Lydia Chen"], "brief": "\u672c\u6587\u5206\u6790\u4e86\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u5728\u684c\u9762\u4efb\u52a1\u4e2d\u53cd\u590d\u6267\u884c\u65e0\u6548\u52a8\u4f5c\u7684\u201c\u60ef\u6027\u201d\u73b0\u8c61\uff0c\u53d1\u73b0\u5176\u5bf9\u5e94\u6a21\u578b\u6fc0\u6d3b\u7a7a\u95f4\u4e2d\u7684\u5438\u6536\u533a\u57df\uff0c\u5bfc\u81f4\u72b6\u6001\u5728\u591a\u6b65\u64cd\u4f5c\u4e2d\u53d8\u5f97\u50f5\u5316\u3002\u4f5c\u8005\u63d0\u51fa R\u00b3\uff08Reset, Reroute, Restore\uff09\u901a\u8fc7\u4e34\u65f6\u91cd\u7f6e\u4e0a\u4e0b\u6587\u518d\u6062\u590d\u5386\u53f2\u4fe1\u606f\u6765\u8df3\u51fa\u60ef\u6027\uff0c\u4f7f\u4e0d\u540c\u6a21\u578b\u7684\u60ef\u6027\u6307\u6807\u964d\u4f4e 17%-55%\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37176", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u6fc0\u6d3b\u5206\u6790", "\u7535\u8111\u4f7f\u7528", "\u4e0a\u4e0b\u6587\u91cd\u7f6e"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37176v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Absorbed in Inertia: Activation Analysis for Computer-Use Agents", "tldr": "\u672c\u6587\u5206\u6790\u4e86\u7535\u8111\u4f7f\u7528\u667a\u80fd\u4f53\u5728\u684c\u9762\u4efb\u52a1\u4e2d\u53cd\u590d\u6267\u884c\u65e0\u6548\u52a8\u4f5c\u7684\u201c\u60ef\u6027\u201d\u73b0\u8c61\uff0c\u53d1\u73b0\u5176\u5bf9\u5e94\u6a21\u578b\u6fc0\u6d3b\u7a7a\u95f4\u4e2d\u7684\u5438\u6536\u533a\u57df\uff0c\u5bfc\u81f4\u72b6\u6001\u5728\u591a\u6b65\u64cd\u4f5c\u4e2d\u53d8\u5f97\u50f5\u5316\u3002\u4f5c\u8005\u63d0\u51fa R\u00b3\uff08Reset, Reroute, Restore\uff09\u901a\u8fc7\u4e34\u65f6\u91cd\u7f6e\u4e0a\u4e0b\u6587\u518d\u6062\u590d\u5386\u53f2\u4fe1\u606f\u6765\u8df3\u51fa\u60ef\u6027\uff0c\u4f7f\u4e0d\u540c\u6a21\u578b\u7684\u60ef\u6027\u6307\u6807\u964d\u4f4e 17%-55%\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Mid-training equips pretrained large language models with specialized and reasoning capabilities, but the returns of this stage are bounded since additional serial compute yields little further downstream improvement and can even degrade some capabilities, which places a practical ceiling on how much compute mid-training absorbs. We revisit how this compute should be allocated to a single run or multiple similar optimizations. We find that branches forked from a shared checkpoint under various controlled recipe reaches measurably different regions of parameter space, and establish a form of compatible diversity that extending one run cannot supply. Therefore, we introduce Trajectory Soup, which distributes a mid-training budget over several independent branches, and consolidates strongest checkpoints selected on validation through intra- and inter-trajectory averaging into a single model. A local bias and variance analysis separates the two averaging levels, showing that inter-trajectory averaging removes residual error beyond the reach of averaging within a trajectory, while checkpoint selection carries a bias that bounds how many checkpoints are worth merging. Across model scales, learning-rate schedules, token budgets, and trajectory counts, Trajectory Soup improves aggregate downstream performance over the strongest single-trajectory average under matched budgets and keeps improving as budgets expand, with the advantage preserved after an identical post-training pipeline. These results position trajectory allocation and merging as a practical way to extend the compute-scaling frontier of mid-training beyond serial saturation.", "arxiv_id": "2609.37169", "arxiv_url": "https://arxiv.org/abs/2609.37169", "authors": ["Zhehao Huang", "Changxin Tian", "Qingyuan Yang", "Kunlong Chen", "Ziqi Liu", "Zhiqiang Zhang", "Xiaolin Huang", "Jun Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa Trajectory Soup\uff1a\u5c06\u5927\u6a21\u578b\u4e2d\u671f\u8bad\u7ec3\u9884\u7b97\u5206\u914d\u5230\u591a\u4e2a\u4ece\u5171\u4eab\u68c0\u67e5\u70b9\u5206\u53c9\u7684\u591a\u6837\u5316\u8bad\u7ec3\u8f68\u8ff9\uff0c\u518d\u901a\u8fc7\u9a8c\u8bc1\u96c6\u9009\u62e9\u4e0e\u8f68\u8ff9\u5185/\u8f68\u8ff9\u95f4\u53c2\u6570\u5e73\u5747\u5408\u5e76\u6210\u5355\u4e00\u6a21\u578b\u3002\u5b9e\u9a8c\u663e\u793a\u5728\u76f8\u540c\u9884\u7b97\u4e0b\u4f18\u4e8e\u6700\u5f3a\u5355\u8f68\u8ff9\u5e73\u5747\uff0c\u5e76\u4e14\u968f\u7740\u9884\u7b97\u589e\u52a0\u4ecd\u80fd\u63d0\u5347\uff0c\u7f13\u89e3\u4e2d\u671f\u8bad\u7ec3\u4e32\u884c\u8ba1\u7b97\u6536\u76ca\u9971\u548c\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37169", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u4e2d\u671f\u8bad\u7ec3", "\u6a21\u578b\u5408\u5e76", "\u8ba1\u7b97\u6269\u5c55"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37169v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Trajectory Soup: Pushing the Compute-Scaling Frontier of LLM Mid-training via Diverse Trajectories", "tldr": "\u8bba\u6587\u63d0\u51fa Trajectory Soup\uff1a\u5c06\u5927\u6a21\u578b\u4e2d\u671f\u8bad\u7ec3\u9884\u7b97\u5206\u914d\u5230\u591a\u4e2a\u4ece\u5171\u4eab\u68c0\u67e5\u70b9\u5206\u53c9\u7684\u591a\u6837\u5316\u8bad\u7ec3\u8f68\u8ff9\uff0c\u518d\u901a\u8fc7\u9a8c\u8bc1\u96c6\u9009\u62e9\u4e0e\u8f68\u8ff9\u5185/\u8f68\u8ff9\u95f4\u53c2\u6570\u5e73\u5747\u5408\u5e76\u6210\u5355\u4e00\u6a21\u578b\u3002\u5b9e\u9a8c\u663e\u793a\u5728\u76f8\u540c\u9884\u7b97\u4e0b\u4f18\u4e8e\u6700\u5f3a\u5355\u8f68\u8ff9\u5e73\u5747\uff0c\u5e76\u4e14\u968f\u7740\u9884\u7b97\u589e\u52a0\u4ecd\u80fd\u63d0\u5347\uff0c\u7f13\u89e3\u4e2d\u671f\u8bad\u7ec3\u4e32\u884c\u8ba1\u7b97\u6536\u76ca\u9971\u548c\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Tool-augmented data agents rely on tool outputs for analytical decisions. Yet successful execution can return plausible but incorrect evidence, requiring agents to decide whether to trust or verify it. Understanding this failure requires examining both the evidence obtained through checking and the answer ultimately adopted. We introduce ToxicBench to measure checking and adoption under numerical, label, schema, and retrieval errors, pairing clean and poisoned observations over fixed source data. In the 118-task GPT evaluation across three adapters, poisoning lowers task success by 26 to 39 percentage points. Ordinary retries help under one-shot poisoning, whereas repeated poisoning reveals wrong-answer adoption after checking. Controls on three public tables isolate how supplied evidence affects recovery. After freezing the scorer, we compare its judgments with human annotations on 200 trajectories, finding 96% task-success agreement. Human judgments support retry gains over Base and confirm adoption after checking on audited tasks. We release trajectories, versioned scoring, and reference and delivery audits. These findings highlight evidence availability and answer selection as complementary dimensions of agent reliability.", "arxiv_id": "2609.37153", "arxiv_url": "https://arxiv.org/abs/2609.37153", "authors": ["Zifu Tao", "Changqing Yin"], "brief": "\u8bba\u6587\u63d0\u51fa ToxicBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u589e\u5f3a\u6570\u636e\u667a\u80fd\u4f53\u5728\u5de5\u5177\u8f93\u51fa\u770b\u4f3c\u6b63\u5e38\u4f46\u88ab\u6295\u6bd2\u51fa\u9519\u65f6\uff0c\u662f\u5426\u4f1a\u76f2\u76ee\u4fe1\u4efb\u5e76\u91c7\u7eb3\u9519\u8bef\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728 118 \u4e2a GPT \u4efb\u52a1\u4e2d\uff0c\u6295\u6bd2\u4f1a\u4f7f\u6210\u529f\u7387\u4e0b\u964d 26 \u5230 39 \u4e2a\u767e\u5206\u70b9\uff1b\u666e\u901a\u91cd\u8bd5\u53ef\u7f13\u89e3\u4e00\u6b21\u6027\u6295\u6bd2\uff0c\u4f46\u5728\u6301\u7eed\u6295\u6bd2\u4e0b\u4ecd\u4f1a\u51fa\u73b0\u201c\u68c0\u67e5\u540e\u91c7\u7eb3\u9519\u8bef\u7b54\u6848\u201d\u7684\u95ee\u9898\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37153", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u53ef\u9760\u6027\u8bc4\u4f30", "\u6570\u636e\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37153v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "When Tools Silently Lie: Evaluating and Mitigating Blind Compliance in Tool-Augmented Data Agents", "tldr": "\u8bba\u6587\u63d0\u51fa ToxicBench\uff0c\u7528\u4e8e\u8bc4\u4f30\u5de5\u5177\u589e\u5f3a\u6570\u636e\u667a\u80fd\u4f53\u5728\u5de5\u5177\u8f93\u51fa\u770b\u4f3c\u6b63\u5e38\u4f46\u88ab\u6295\u6bd2\u51fa\u9519\u65f6\uff0c\u662f\u5426\u4f1a\u76f2\u76ee\u4fe1\u4efb\u5e76\u91c7\u7eb3\u9519\u8bef\u8bc1\u636e\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728 118 \u4e2a GPT \u4efb\u52a1\u4e2d\uff0c\u6295\u6bd2\u4f1a\u4f7f\u6210\u529f\u7387\u4e0b\u964d 26 \u5230 39 \u4e2a\u767e\u5206\u70b9\uff1b\u666e\u901a\u91cd\u8bd5\u53ef\u7f13\u89e3\u4e00\u6b21\u6027\u6295\u6bd2\uff0c\u4f46\u5728\u6301\u7eed\u6295\u6bd2\u4e0b\u4ecd\u4f1a\u51fa\u73b0\u201c\u68c0\u67e5\u540e\u91c7\u7eb3\u9519\u8bef\u7b54\u6848\u201d\u7684\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM-as-a-Judge is increasingly used to evaluate policy responses on open-ended tasks that lack ground-truth answers. Existing work often directly converts the resulting judgments into reward signals for policy training, paying limited attention to intrinsic judgment quality and largely restricting the use of Judges to training-time supervision. We systematically investigate judgment quality and downstream utility by examining both how judgments are elicited and how they are used. For judgment elicitation, we vary the Judge protocol along three dimensions: verdict granularity, critique usage, and evaluation batching. For judgment usage, beyond policy training, we extend Judge to test-time inference through Best-of-N selection, Judge-guided revision, and beam search. We find that, (i) Surprisingly, judgment quality and downstream utility do not always align. (ii) Judge protocol design substantially affects both intrinsic judgment quality and downstream utility. (iii) Judge guidance effectively converts test-time compute into performance gains, with benefits varying across inference strategies. Our results call for a multifaceted evaluation of LLM Judges on open-ended tasks, encompassing intrinsic judgment quality, and downstream utility.", "arxiv_id": "2609.37145", "arxiv_url": "https://arxiv.org/abs/2609.37145", "authors": ["Zheng Zhang", "Lufei Li", "Xinyue Tan", "Yuanhao Zeng", "Ziwei Shan", "Yexin Li", "Kan Ren"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5f00\u653e\u5f0f\u4efb\u52a1\u4e2d LLM-as-a-Judge \u7684\u201c\u5224\u65ad\u8d28\u91cf\u201d\u548c\u201c\u4e0b\u6e38\u6548\u7528\u201d\uff0c\u6bd4\u8f83\u4e86\u5224\u51b3\u7c92\u5ea6\u3001\u662f\u5426\u4f7f\u7528\u8bc4\u8bba\u3001\u6279\u91cf\u8bc4\u4f30\u7b49\u8bc4\u5ba1\u534f\u8bae\uff0c\u4ee5\u53ca\u8bad\u7ec3\u548c\u6d4b\u8bd5\u65f6\u63a8\u7406\u4e2d\u7684\u591a\u79cd\u4f7f\u7528\u65b9\u5f0f\u3002\u7ed3\u679c\u53d1\u73b0\u5224\u65ad\u8d28\u91cf\u4e0d\u4e00\u5b9a\u7b49\u540c\u4e8e\u4e0b\u6e38\u6536\u76ca\uff0c\u8bc4\u5ba1\u534f\u8bae\u4f1a\u663e\u8457\u5f71\u54cd\u6548\u679c\uff1b\u5728\u6d4b\u8bd5\u65f6\u7528 Judge \u505a Best-of-N\u3001\u5f15\u5bfc\u4fee\u8ba2\u6216\u675f\u641c\u7d22\uff0c\u53ef\u5c06\u989d\u5916\u8ba1\u7b97\u8f6c\u5316\u4e3a\u6027\u80fd\u63d0\u5347\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37145", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u6a21\u578b\u8bc4\u4f30", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97", "\u5f00\u653e\u5f0f\u4efb\u52a1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37145v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "From Judgment Quality to Downstream Utility: Rethinking LLM-as-a-Judge for Open-Ended Tasks", "tldr": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5f00\u653e\u5f0f\u4efb\u52a1\u4e2d LLM-as-a-Judge \u7684\u201c\u5224\u65ad\u8d28\u91cf\u201d\u548c\u201c\u4e0b\u6e38\u6548\u7528\u201d\uff0c\u6bd4\u8f83\u4e86\u5224\u51b3\u7c92\u5ea6\u3001\u662f\u5426\u4f7f\u7528\u8bc4\u8bba\u3001\u6279\u91cf\u8bc4\u4f30\u7b49\u8bc4\u5ba1\u534f\u8bae\uff0c\u4ee5\u53ca\u8bad\u7ec3\u548c\u6d4b\u8bd5\u65f6\u63a8\u7406\u4e2d\u7684\u591a\u79cd\u4f7f\u7528\u65b9\u5f0f\u3002\u7ed3\u679c\u53d1\u73b0\u5224\u65ad\u8d28\u91cf\u4e0d\u4e00\u5b9a\u7b49\u540c\u4e8e\u4e0b\u6e38\u6536\u76ca\uff0c\u8bc4\u5ba1\u534f\u8bae\u4f1a\u663e\u8457\u5f71\u54cd\u6548\u679c\uff1b\u5728\u6d4b\u8bd5\u65f6\u7528 Judge \u505a Best-of-N\u3001\u5f15\u5bfc\u4fee\u8ba2\u6216\u675f\u641c\u7d22\uff0c\u53ef\u5c06\u989d\u5916\u8ba1\u7b97\u8f6c\u5316\u4e3a\u6027\u80fd\u63d0\u5347\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent approaches to reinforcement learning (RL) post-training for large language models increasingly remove the critic to reduce training instability and memory overhead. Even where a critic is trained, it is discarded once training ends, although it has learned to predict outcomes. We revisit this trend and show that a pretrained critic\u0027s ability to predict future outcomes can make it a valuable asset for efficient long-horizon reasoning. First, we find that instability in critic-based RL for long chain-of-thought reasoning is largely an optimization artifact: keeping policy updates small and low in variance restores stable convergence. Second, a well-pretrained critic estimates the posterior probability of eventual success from later trajectory states and unfinished prefixes. Its predictions provide outcome-derived, dense, per-prefix learning signals that, during policy optimization, require neither completed rollouts, step-level annotations, nor external reward labels. Building on this insight, we introduce Reward-Free Policy Optimization (RFPO), which repurposes a single calibrated, frozen critic as a rollout-level reward, a value baseline for generalized advantage estimation, and a success forecaster for unfinished prefixes. We further show that binarizing the debiased score stops the policy from exploiting the critic\u0027s length bias. Binarized, RFPO matches supervised PPO without a single label in the training loop, while cutting compute and memory overhead. This makes RFPO well suited to long-horizon reasoning tasks, where outcomes arrive late and generation dominates cost: because rollouts can be rewarded before they finish, training no longer has to pay for waiting on every trajectory to complete. Our findings challenge the prevailing critic-free paradigm and establish critic-based, reward-free optimization as a scalable and computationally efficient path for LLM post-training.", "arxiv_id": "2609.37119", "arxiv_url": "https://arxiv.org/abs/2609.37119", "authors": ["Hongyang Li", "Xiao Li", "Caesar Wu", "Said Mammar", "Gr\u00e9goire Danoy", "Pascal Bouvry"], "brief": "\u8bba\u6587\u91cd\u65b0\u8bc4\u4f30\u4e86\u5927\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u88ab\u5f31\u5316\u7684 critic\uff0c\u53d1\u73b0\u957f\u94fe\u5f0f\u63a8\u7406\u91cc\u7684\u4e0d\u7a33\u5b9a\u4e3b\u8981\u6765\u81ea\u4f18\u5316\u95ee\u9898\uff0c\u5c0f\u6b65\u957f\u3001\u4f4e\u65b9\u5dee\u66f4\u65b0\u53ef\u6062\u590d\u7a33\u5b9a\u8bad\u7ec3\u3002\u63d0\u51fa RFPO\uff0c\u7528\u51bb\u7ed3\u4e14\u6821\u51c6\u7684 critic \u540c\u65f6\u63d0\u4f9b rollout \u5956\u52b1\u3001\u4ef7\u503c\u57fa\u7ebf\u548c\u672a\u5b8c\u6210\u524d\u7f00\u7684\u6210\u529f\u9884\u6d4b\uff0c\u65e0\u9700\u5916\u90e8\u5956\u52b1\u6807\u7b7e\u5373\u53ef\u63a5\u8fd1\u76d1\u7763 PPO\uff0c\u5e76\u964d\u4f4e\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37119", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u4ef7\u503c\u6a21\u578b", "\u957f\u7a0b\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37119v1", "published_at": "2026-09-29", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Unlocking the Critic: Reward-Free Policy Optimization for LLM Post-Training", "tldr": "\u8bba\u6587\u91cd\u65b0\u8bc4\u4f30\u4e86\u5927\u6a21\u578b\u540e\u8bad\u7ec3\u4e2d\u88ab\u5f31\u5316\u7684 critic\uff0c\u53d1\u73b0\u957f\u94fe\u5f0f\u63a8\u7406\u91cc\u7684\u4e0d\u7a33\u5b9a\u4e3b\u8981\u6765\u81ea\u4f18\u5316\u95ee\u9898\uff0c\u5c0f\u6b65\u957f\u3001\u4f4e\u65b9\u5dee\u66f4\u65b0\u53ef\u6062\u590d\u7a33\u5b9a\u8bad\u7ec3\u3002\u63d0\u51fa RFPO\uff0c\u7528\u51bb\u7ed3\u4e14\u6821\u51c6\u7684 critic \u540c\u65f6\u63d0\u4f9b rollout \u5956\u52b1\u3001\u4ef7\u503c\u57fa\u7ebf\u548c\u672a\u5b8c\u6210\u524d\u7f00\u7684\u6210\u529f\u9884\u6d4b\uff0c\u65e0\u9700\u5916\u90e8\u5956\u52b1\u6807\u7b7e\u5373\u53ef\u63a5\u8fd1\u76d1\u7763 PPO\uff0c\u5e76\u964d\u4f4e\u8ba1\u7b97\u4e0e\u663e\u5b58\u5f00\u9500\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
