, "Zhenchen Tang", "Yang Shi", "Dianyi Wang", "Tengfei Liu", "Wanshun Su", "Xuanyu Zhu", "Ruohui Wang", "Haiwen Diao", "Haotian Wang", "Xiaoling Gu", "Yuanxing Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa Thinking Reward Model\uff08TRM\uff09\uff0c\u5728\u8bc4\u4ef7\u56fe\u50cf\u751f\u6210/\u7f16\u8f91\u7ed3\u679c\u524d\uff0c\u5148\u4e3a\u6bcf\u4e2a\u6837\u4f8b\u81ea\u9002\u5e94\u751f\u6210\u8bc4\u4ef7\u91cf\u89c4\uff0c\u518d\u636e\u6b64\u8fdb\u884c\u7ec6\u7c92\u5ea6\u9010\u70b9\u8bc4\u5206\u3002\u8fd8\u63d0\u51fa PD-GRPO\uff0c\u7f13\u89e3\u4f20\u7edf\u6210\u5bf9\u504f\u597d\u4f18\u5316\u5bfc\u81f4\u7684\u5206\u6570\u6781\u5316\u95ee\u9898\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/bxhsort/Thinking_Reward_Model", "github_stars": 16, "hf_url": "https://huggingface.co/papers/2609.37372", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": ["TRM \u5c06\u89c6\u89c9\u5956\u52b1\u5efa\u6a21\u62c6\u6210\u201c\u5236\u5b9a\u91cf\u89c4\u2014\u6309\u91cf\u89c4\u8bc4\u4f30\u2014\u8f93\u51fa\u7ec6\u7c92\u5ea6\u5956\u52b1\u201d\u4e09\u6b65\uff0c\u4f7f\u8bc4\u4ef7\u6807\u51c6\u663e\u5f0f\u4e14\u56e0\u4efb\u52a1\u800c\u53d8\u3002", "PD-GRPO \u5229\u7528\u6210\u5bf9\u76d1\u7763\u63d0\u5347\u5956\u52b1\u533a\u5206\u80fd\u529b\uff0c\u540c\u65f6\u4fdd\u7559\u9010\u70b9\u7ec6\u7c92\u5ea6\u5206\u6570\uff0c\u907f\u514d\u504f\u597d\u8bad\u7ec3\u628a\u5206\u6570\u63a8\u5411\u4e24\u6781\u3002", "\u5728\u56fe\u50cf\u751f\u6210\u4e0e\u56fe\u50cf\u7f16\u8f91\u5956\u52b1\u5efa\u6a21\u57fa\u51c6\u4e0a\uff0cTRM \u5728\u5f00\u6e90\u6a21\u578b\u4e2d\u8fbe\u5230 SOTA\uff0c\u5e76\u63a5\u8fd1\u4e13\u6709\u6a21\u578b\u8868\u73b0\uff1b\u4f5c\u4e3a\u5f3a\u5316\u5b66\u4e60\u5956\u52b1\u4e5f\u80fd\u7a33\u5b9a\u63d0\u5347\u591a\u7c7b\u89c6\u89c9\u751f\u6210\u6a21\u578b\u3002"], "keywords": ["\u89c6\u89c9\u751f\u6210", "\u5956\u52b1\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37372v1", "published_at": "2026-09-29", "score": 0.283, "selected_reasons": ["HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37372.png", "title": "Think Before You Score: Thinking Reward Model for Visual Generation", "tldr": "\u5148\u751f\u6210\u8bc4\u4ef7\u51c6\u5219\u518d\u6253\u5206\u7684\u89c6\u89c9\u5956\u52b1\u6a21\u578b", "upvotes": 7, "what_it_is": "\u8bba\u6587\u63d0\u51fa Thinking Reward Model\uff08TRM\uff09\uff0c\u5728\u8bc4\u4ef7\u56fe\u50cf\u751f\u6210/\u7f16\u8f91\u7ed3\u679c\u524d\uff0c\u5148\u4e3a\u6bcf\u4e2a\u6837\u4f8b\u81ea\u9002\u5e94\u751f\u6210\u8bc4\u4ef7\u91cf\u89c4\uff0c\u518d\u636e\u6b64\u8fdb\u884c\u7ec6\u7c92\u5ea6\u9010\u70b9\u8bc4\u5206\u3002\u8fd8\u63d0\u51fa PD-GRPO\uff0c\u7f13\u89e3\u4f20\u7edf\u6210\u5bf9\u504f\u597d\u4f18\u5316\u5bfc\u81f4\u7684\u5206\u6570\u6781\u5316\u95ee\u9898\u3002", "why_notable": "\u5b83\u628a\u201c\u8bc4\u4ec0\u4e48\u201d\u4ece\u9690\u5f0f\u6807\u91cf\u6620\u5c04\u53d8\u6210\u663e\u5f0f\u3001\u53ef\u89e3\u91ca\u3001\u6837\u4f8b\u81ea\u9002\u5e94\u7684\u8bc4\u4ef7\u6d41\u7a0b\uff0c\u4e3a\u89c6\u89c9\u751f\u6210\u6a21\u578b\u63d0\u4f9b\u66f4\u53ef\u9760\u7684\u4f18\u5316\u4fe1\u53f7\uff0c\u5177\u6709\u63d0\u5347\u56fe\u50cf\u751f\u6210\u5bf9\u9f50\u4e0e\u7f16\u8f91\u8d28\u91cf\u7684\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Depth is a natural way to increase the computational capacity in Transformers, yet the contribution of deeper layers can diminish as depth grows larger. Recent approaches enhance normalization (\\text{e.g.}, LayerNorm Scaling) or residual connections (\\text{e.g.}, mHC, AttnRes) to enable better information flow and depth utilization. However, it remains unclear whether they truly translate increased architectural depth into effective computational depth, and whether their reported gains stem from better access to information across depth, or unaccounted-for confounding factors. In this paper, we introduce \\textbf{DepthBench}, a controlled benchmark for studying computational depth across various architectures. We systematically vary the width--depth aspect ratio ($d_{\\text{model}}/n_{\\text{layer}}$) from shallow--wide to deep--narrow shapes, while keeping the model size and pre-training recipe fixed. Across 10 representative architectures, we find that the benefit of allocating more capacity to depth is strongly architecture-dependent. Standard Pre-LN and most of its norm- and scaling-based variants provide little benefit and can even degrade performance as models become deeper and narrower, whereas HC and Full AttnRes improve consistently even at extreme deep shapes. These gains extend beyond pre-training loss and consistently translate into improved domain-specific performance and effective computation. Controlled layer-level analyses further show that the gains of HC and Full AttnRes are associated with more effective utilization of additional layers, revealing distinct mechanisms of computational depth across architectures. Overall, our results identify residual connection design as a key determinant of whether depth can serve as a meaningful scaling axis by enabling additional architectural depth to translate into effective computation.", "arxiv_id": "2609.32534", "arxiv_url": "https://arxiv.org/abs/2609.32534", "authors": ["Keyu Wang", "Yangyi Huang", "Jiale Kang", "David Gonz\u00e1lez-Mart\u00ednez", "Weiyang Liu", "Shiwei Liu"], "brief": "\u8bba\u6587\u63d0\u51fa DepthBench\uff0c\u4e00\u4e2a\u53d7\u63a7\u57fa\u51c6\uff0c\u7528\u4e8e\u8861\u91cf\u4e0d\u540c Transformer \u67b6\u6784\u80fd\u5426\u628a\u66f4\u6df1\u7684\u5c42\u6570\u8f6c\u5316\u4e3a\u6709\u6548\u8ba1\u7b97\u6df1\u5ea6\u3002\u4f5c\u8005\u5728\u56fa\u5b9a\u53c2\u6570\u91cf\u548c\u9884\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u7cfb\u7edf\u6539\u53d8\u5bbd\u6df1\u6bd4\uff0c\u6bd4\u8f8310\u79cd\u4ee3\u8868\u6027\u67b6\u6784\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG"], "github_repo": "https://github.com/keyu-wang-2002/DepthBench", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.32534", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u901a\u8fc7\u4ece\u6d45\u5bbd\u5230\u6df1\u7a84\u6539\u53d8 d_model/n_layer\uff0c\u9694\u79bb\u7814\u7a76\u6df1\u5ea6\u5206\u914d\u5bf9\u6027\u80fd\u7684\u5f71\u54cd", "\u6807\u51c6 Pre-LN \u53ca\u591a\u6570\u5f52\u4e00\u5316\u3001\u7f29\u653e\u6539\u8fdb\u5728\u66f4\u6df1\u66f4\u7a84\u65f6\u6536\u76ca\u6709\u9650\uff0c\u751a\u81f3\u6027\u80fd\u4e0b\u964d", "HC \u548c Full AttnRes \u5728\u6781\u6df1\u7ed3\u6784\u4e0b\u4ecd\u6301\u7eed\u63d0\u5347\uff0c\u5e76\u5728\u9884\u8bad\u7ec3\u635f\u5931\u3001\u4e0b\u6e38\u9886\u57df\u8868\u73b0\u548c\u5c42\u7ea7\u5206\u6790\u4e2d\u4f53\u73b0\u66f4\u6709\u6548\u7684\u5c42\u5229\u7528"], "keywords": ["Transformer", "\u6b8b\u5dee\u8fde\u63a5", "\u6a21\u578b\u6269\u5c55", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": "Max Planck Institute for Intelligent Systems", "pdf_url": "https://arxiv.org/pdf/2609.32534v1", "published_at": "2026-09-26", "score": 0.282, "selected_reasons": ["HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32534.png", "title": "DepthBench: Measuring How Residual Connections Enable More Computational Depth", "tldr": "\u6b8b\u5dee\u8bbe\u8ba1\u51b3\u5b9aTransformer\u6df1\u5ea6\u662f\u5426\u6709\u6548", "upvotes": 27, "what_it_is": "\u8bba\u6587\u63d0\u51fa DepthBench\uff0c\u4e00\u4e2a\u53d7\u63a7\u57fa\u51c6\uff0c\u7528\u4e8e\u8861\u91cf\u4e0d\u540c Transformer \u67b6\u6784\u80fd\u5426\u628a\u66f4\u6df1\u7684\u5c42\u6570\u8f6c\u5316\u4e3a\u6709\u6548\u8ba1\u7b97\u6df1\u5ea6\u3002\u4f5c\u8005\u5728\u56fa\u5b9a\u53c2\u6570\u91cf\u548c\u9884\u8bad\u7ec3\u8bbe\u7f6e\u4e0b\u7cfb\u7edf\u6539\u53d8\u5bbd\u6df1\u6bd4\uff0c\u6bd4\u8f8310\u79cd\u4ee3\u8868\u6027\u67b6\u6784\u3002", "why_notable": "\u8be5\u7814\u7a76\u7528\u53d7\u63a7\u5b9e\u9a8c\u6f84\u6e05\u4e86\u201c\u589e\u52a0\u5c42\u6570\u201d\u4e0d\u7b49\u4e8e\u201c\u589e\u52a0\u6709\u6548\u8ba1\u7b97\u201d\u7684\u95ee\u9898\uff0c\u6307\u51fa\u6b8b\u5dee\u8fde\u63a5\u8bbe\u8ba1\u662f\u6df1\u5ea6\u80fd\u5426\u6210\u4e3a\u53ef\u9760\u6269\u5c55\u8f74\u7684\u5173\u952e\uff0c\u5bf9\u5927\u6a21\u578b\u67b6\u6784\u8bbe\u8ba1\u548c\u9ad8\u6548\u6269\u5c55\u5177\u6709\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) enhances reasoning in large language models (LLMs) through outcome-level feedback, yet recent approaches to finer-grained credit assignment often require auxiliary models, additional sampling, or privileged information. Although policy entropy provides a readily available signal, prioritizing uncertain positions under both reinforcement and penalization concentrates penalties where failed responses still retain alternatives for recovery, which can suppress opportunities for exploration. To address this, we introduce Entropic Advantage Policy Optimization (EAPO), an entropy-guided credit assignment method that treats success and failure asymmetrically. Specifically, motivated by the observation that success under uncertainty is less repeatable while confident failures tend to recur, EAPO couples normalized policy entropy with the sign of the response advantage to reinforce surprising success and correct repeated failure. It assigns stronger reinforcement to high-entropy decisions in successful responses and stronger penalties to low-entropy decisions in failed responses, while attenuating penalties at uncertain positions to preserve opportunities for recovery. By redistributing the response advantage across tokens, EAPO derives token-level credit directly from existing rollout signals without additional supervision. We validate EAPO on a range of reasoning tasks across both base and reasoning backbones, demonstrating that it achieves the best overall performance. We further show that EAPO promotes more effective exploration, broadening problem coverage and generating more diverse candidate answers.", "arxiv_id": "2609.33781", "arxiv_url": "https://arxiv.org/abs/2609.33781", "authors": ["Woongyeong Yeo", "Minki Kang", "Chanuk Lee", "Sangwoo Park", "Jinheon Baek", "Sung Ju Hwang"], "brief": "\u8bba\u6587\u63d0\u51fa Entropic Advantage Policy Optimization\uff08EAPO\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u989d\u5916\u6a21\u578b\u6216\u76d1\u7763\u7684\u71b5\u5f15\u5bfc\u4fe1\u7528\u5206\u914d\u65b9\u6cd5\u3002\u5b83\u6839\u636e\u6210\u529f\u4e0e\u5931\u8d25\u7684\u4e0d\u5bf9\u79f0\u6027\uff0c\u5c06\u54cd\u5e94\u7ea7\u4f18\u52bf\u91cd\u65b0\u5206\u914d\u5230 token \u7ea7\uff0c\u4ee5\u6539\u8fdb RLVR \u4e2d\u7684\u63a2\u7d22\u4e0e\u63a8\u7406\u8bad\u7ec3\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/wgcyeo/EAPO", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.33781", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5bf9\u6210\u529f\u6837\u672c\u5f3a\u5316\u9ad8\u71b5\u51b3\u7b56\uff0c\u9f13\u52b1\u201c\u610f\u5916\u6210\u529f\u201d\u4e2d\u7684\u63a2\u7d22\u6027\u9009\u62e9", "\u5bf9\u5931\u8d25\u6837\u672c\u66f4\u5f3a\u60e9\u7f5a\u4f4e\u71b5\u51b3\u7b56\uff0c\u7ea0\u6b63\u5bb9\u6613\u91cd\u590d\u51fa\u73b0\u7684\u81ea\u4fe1\u9519\u8bef", "\u76f4\u63a5\u5229\u7528\u5df2\u6709 rollout \u4fe1\u53f7\u548c\u7b56\u7565\u71b5\u5b9e\u73b0 token \u7ea7\u4fe1\u7528\u5206\u914d\uff0c\u65e0\u9700\u8f85\u52a9\u6a21\u578b\u3001\u989d\u5916\u91c7\u6837\u6216\u7279\u6743\u4fe1\u606f"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406", "\u63a2\u7d22"], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2609.33781v1", "published_at": "2026-09-27", "score": 0.28, "selected_reasons": ["HF trending (29\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33781.png", "title": "Surprising Success, Repeated Failure: Entropy-Guided Credit Assignment for Exploration in LLM Reasoning", "tldr": "\u7528\u71b5\u5f15\u5bfcLLM\u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u7684\u7ec6\u7c92\u5ea6\u5f52\u56e0", "upvotes": 29, "what_it_is": "\u8bba\u6587\u63d0\u51fa Entropic Advantage Policy Optimization\uff08EAPO\uff09\uff0c\u4e00\u79cd\u65e0\u9700\u989d\u5916\u6a21\u578b\u6216\u76d1\u7763\u7684\u71b5\u5f15\u5bfc\u4fe1\u7528\u5206\u914d\u65b9\u6cd5\u3002\u5b83\u6839\u636e\u6210\u529f\u4e0e\u5931\u8d25\u7684\u4e0d\u5bf9\u79f0\u6027\uff0c\u5c06\u54cd\u5e94\u7ea7\u4f18\u52bf\u91cd\u65b0\u5206\u914d\u5230 token \u7ea7\uff0c\u4ee5\u6539\u8fdb RLVR \u4e2d\u7684\u63a2\u7d22\u4e0e\u63a8\u7406\u8bad\u7ec3\u3002", "why_notable": "EAPO \u63d0\u4f9b\u4e86\u4e00\u79cd\u8f7b\u91cf\u4e14\u5b9e\u7528\u7684\u7ec6\u7c92\u5ea6\u4fe1\u7528\u5206\u914d\u65b9\u6848\uff0c\u5728\u591a\u7c7b\u63a8\u7406\u4efb\u52a1\u548c\u4e0d\u540c\u6a21\u578b\u9aa8\u5e72\u4e0a\u53d6\u5f97\u66f4\u597d\u6574\u4f53\u8868\u73b0\uff0c\u5e76\u63d0\u5347\u95ee\u9898\u8986\u76d6\u7387\u4e0e\u5019\u9009\u7b54\u6848\u591a\u6837\u6027\uff0c\u5bf9 LLM \u63a8\u7406\u5f3a\u5316\u5b66\u4e60\u5177\u6709\u8f83\u9ad8\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We present EditWorld, a video world model for precise editing and flexible referencing in interactable worlds. Existing video world models primarily focus on navigation, letting users explore generated worlds but offering limited control over how existing world content is modified. EditWorld extends world modeling from exploration to precise modification by streaming editing instructions and reference images during autoregressive generation. To support these capabilities, EditWorld introduces Gated Causal Attention for temporally varying editing conditions and reference images, together with a Sparse Context mechanism that maintains a bounded historical context for long-horizon inference. We further adopt joint autoregressive and bidirectional training with annealed self-resampling, and construct a dedicated data synthesis and annotation pipeline that provides supervision for world editing. We also present WBench-Editing to systematically evaluate streaming world editing capabilities. EditWorld achieves the best overall performance on WBench-Editing with an overall score of 73.8 and an editing score of 80.0, substantially outperforming existing methods on editing-related metrics. https://github.com/leoisufa/EditWorld", "arxiv_id": "2609.34470", "arxiv_url": "https://arxiv.org/abs/2609.34470", "authors": ["Xinyao Liao", "Xianfang Zeng", "Zhu Liang", "Zhoujie Fu", "Qianxun Xu", "Jiachi Liu", "Gang Yu", "Guosheng Lin"], "brief": "\u8bba\u6587\u63d0\u51fa EditWorld\uff0c\u4e00\u79cd\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u5728\u81ea\u56de\u5f52\u751f\u6210\u8fc7\u7a0b\u4e2d\u63a5\u6536\u6d41\u5f0f\u7f16\u8f91\u6307\u4ee4\u4e0e\u53c2\u8003\u56fe\u50cf\uff0c\u5b9e\u73b0\u5bf9\u5df2\u6709\u4e16\u754c\u5185\u5bb9\u7684\u7cbe\u786e\u4fee\u6539\uff0c\u800c\u4e0d\u53ea\u662f\u5bfc\u822a\u63a2\u7d22\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/leoisufa/EditWorld", "github_stars": 13, "hf_url": "https://huggingface.co/papers/2609.34470", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u63d0\u51fa Gated Causal Attention\uff0c\u7528\u4e8e\u5904\u7406\u968f\u65f6\u95f4\u53d8\u5316\u7684\u7f16\u8f91\u6761\u4ef6\u4e0e\u53c2\u8003\u56fe\u50cf\u3002", "\u8bbe\u8ba1 Sparse Context \u673a\u5236\uff0c\u5728\u957f\u65f6\u7a0b\u63a8\u7406\u4e2d\u4fdd\u6301\u6709\u754c\u5386\u53f2\u4e0a\u4e0b\u6587\uff0c\u964d\u4f4e\u4e0a\u4e0b\u6587\u589e\u957f\u538b\u529b\u3002", "\u6784\u5efa\u6570\u636e\u5408\u6210\u4e0e\u6807\u6ce8\u6d41\u6c34\u7ebf\uff0c\u5e76\u63d0\u51fa WBench-Editing \u57fa\u51c6\uff1bEditWorld \u603b\u5206 73.8\u3001\u7f16\u8f91\u5206 80.0\uff0c\u663e\u8457\u4f18\u4e8e\u73b0\u6709\u65b9\u6cd5\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u53ef\u63a7\u7f16\u8f91", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2609.34470v1", "published_at": "2026-09-28", "score": 0.275, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34470.png", "title": "Precise Editing and Flexible Referencing for Interactable Worlds", "tldr": "EditWorld\u5b9e\u73b0\u53ef\u4ea4\u4e92\u4e16\u754c\u7684\u7cbe\u51c6\u89c6\u9891\u7f16\u8f91\u3002", "upvotes": 15, "what_it_is": "\u8bba\u6587\u63d0\u51fa EditWorld\uff0c\u4e00\u79cd\u89c6\u9891\u4e16\u754c\u6a21\u578b\uff0c\u53ef\u5728\u81ea\u56de\u5f52\u751f\u6210\u8fc7\u7a0b\u4e2d\u63a5\u6536\u6d41\u5f0f\u7f16\u8f91\u6307\u4ee4\u4e0e\u53c2\u8003\u56fe\u50cf\uff0c\u5b9e\u73b0\u5bf9\u5df2\u6709\u4e16\u754c\u5185\u5bb9\u7684\u7cbe\u786e\u4fee\u6539\uff0c\u800c\u4e0d\u53ea\u662f\u5bfc\u822a\u63a2\u7d22\u3002", "why_notable": "\u5b83\u628a\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4ece\u201c\u751f\u6210\u53ef\u63a2\u7d22\u73af\u5883\u201d\u63a8\u8fdb\u5230\u201c\u53ef\u63a7\u4fee\u6539\u73af\u5883\u201d\uff0c\u5bf9\u4ea4\u4e92\u5f0f\u5185\u5bb9\u521b\u4f5c\u3001\u4eff\u771f\u73af\u5883\u7f16\u8f91\u548c\u672a\u6765\u4e16\u754c\u6a21\u578b\u5e94\u7528\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Machine intelligence is often evaluated through abstract reasoning problems, yet many real-world problems are visual, such as arranging objects, repairing layouts, or tracing routes. Solving these problems requires understanding a scene, inferring what must change to achieve a goal, and realizing that change without disturbing unrelated content. However, existing benchmarks mainly evaluate perception, generation, or explicitly specified transformations, leaving goal-driven visual problem solving underexplored. To bridge this gap, we introduce SolveEpIT, a benchmark for visual problem solving through scene transformation. Given an image and a goal, a model must infer a valid transformation from the request, the scene, or a visually expressed rule, then execute it while preserving unrelated content. SoLvEEDrr contains 2,728 cases. Atomic transition contracts specify required and protected conditions, enabling SoLvEScoRE to measure completion and unintended changes without a single reference output. The strongest evaluated model achieves only57.0% SolvEScore. We further introduce SolveEdiT-PLAN, a two-stage visual planner that instantiates the transition before generation. Under matched single-generation evaluation, it improves SoLvEScoRE by 9.1 points on average across three tested generators, including a gain from 57.0% to 71.6% for GPT-Image-2, without modifying the editor.", "arxiv_id": "2609.35504", "arxiv_url": "https://arxiv.org/abs/2609.35504", "authors": ["Wenjie Shu", "Yexin Liu", "Harold Haodong Chen", "Xuerui Qiu", "Zehan Wang", "Yidi Zhang", "Yizhan Chen", "Zunwei Wang", "Minghao Liu", "Qi Chen", "Harry Yang", "Xiaogang Xu"], "brief": "\u8bba\u6587\u63d0\u51fa SolveEdit/SolveEpIT\uff0c\u4e00\u4e2a\u9762\u5411\u76ee\u6807\u9a71\u52a8\u89c6\u89c9\u95ee\u9898\u6c42\u89e3\u7684\u56fe\u50cf\u7f16\u8f91\u57fa\u51c6\u3002\u6a21\u578b\u9700\u6839\u636e\u56fe\u50cf\u4e0e\u76ee\u6807\u63a8\u65ad\u5e94\u505a\u7684\u573a\u666f\u53d8\u6362\uff0c\u5e76\u5728\u4e0d\u7834\u574f\u65e0\u5173\u5185\u5bb9\u7684\u524d\u63d0\u4e0b\u5b8c\u6210\u7f16\u8f91\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/WenjieShu/SolveEdit", "github_stars": 14, "hf_url": "https://huggingface.co/papers/2609.35504", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u57fa\u51c6\u5305\u542b 2728 \u4e2a\u6848\u4f8b\uff0c\u8986\u76d6\u7269\u4f53\u6392\u5217\u3001\u5e03\u5c40\u4fee\u590d\u3001\u8def\u7ebf\u8ffd\u8e2a\u7b49\u89c6\u89c9\u95ee\u9898\u6c42\u89e3\u4efb\u52a1", "\u7528\u539f\u5b50\u8f6c\u79fb\u5951\u7ea6\u5b9a\u4e49\u5fc5\u987b\u6ee1\u8db3\u4e0e\u5fc5\u987b\u4fdd\u62a4\u7684\u6761\u4ef6\uff0cSolveScore \u53ef\u5728\u65e0\u5355\u4e00\u53c2\u8003\u7b54\u6848\u65f6\u8bc4\u4f30\u5b8c\u6210\u5ea6\u548c\u8bef\u6539", "\u6700\u5f3a\u6a21\u578b\u4ec5\u8fbe 57.0% SolveScore\uff1b\u4e24\u9636\u6bb5\u89c6\u89c9\u89c4\u5212\u5668 SolveEdit-PLAN \u53ef\u5e73\u5747\u63d0\u5347 9.1 \u5206\uff0cGPT-Image-2 \u4ece 57.0% \u63d0\u5347\u5230 71.6%"], "keywords": ["\u89c6\u89c9\u63a8\u7406", "\u56fe\u50cf\u7f16\u8f91", "\u751f\u6210\u6a21\u578b", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.35504v1", "published_at": "2026-09-28", "score": 0.268, "selected_reasons": ["HF trending (11\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35504.png", "title": "SolveEdit: Benchmarking Visual Problem Solving in Generative Models", "tldr": "\u65b0\u57fa\u51c6\u8bc4\u6d4b\u751f\u6210\u6a21\u578b\u7684\u89c6\u89c9\u89e3\u9898\u5f0f\u7f16\u8f91\u80fd\u529b", "upvotes": 11, "what_it_is": "\u8bba\u6587\u63d0\u51fa SolveEdit/SolveEpIT\uff0c\u4e00\u4e2a\u9762\u5411\u76ee\u6807\u9a71\u52a8\u89c6\u89c9\u95ee\u9898\u6c42\u89e3\u7684\u56fe\u50cf\u7f16\u8f91\u57fa\u51c6\u3002\u6a21\u578b\u9700\u6839\u636e\u56fe\u50cf\u4e0e\u76ee\u6807\u63a8\u65ad\u5e94\u505a\u7684\u573a\u666f\u53d8\u6362\uff0c\u5e76\u5728\u4e0d\u7834\u574f\u65e0\u5173\u5185\u5bb9\u7684\u524d\u63d0\u4e0b\u5b8c\u6210\u7f16\u8f91\u3002", "why_notable": "\u5b83\u628a\u8bc4\u6d4b\u91cd\u70b9\u4ece\u5355\u7eaf\u611f\u77e5\u6216\u6309\u6307\u4ee4\u7f16\u8f91\u63a8\u8fdb\u5230\u201c\u7406\u89e3\u76ee\u6807\u2014\u63a8\u65ad\u53d8\u6362\u2014\u53ef\u9760\u6267\u884c\u201d\u7684\u89c6\u89c9\u63a8\u7406\u7f16\u8f91\u80fd\u529b\uff0c\u63ed\u793a\u5f53\u524d\u751f\u6210\u6a21\u578b\u5728\u76ee\u6807\u9a71\u52a8\u573a\u666f\u4fee\u6539\u4e0a\u7684\u660e\u663e\u77ed\u677f\uff0c\u5e76\u5c55\u793a\u89c4\u5212\u6a21\u5757\u7684\u5b9e\u7528\u589e\u76ca\u3002"}, {"abstract": "As language models take a growing role in AI development, a natural aspiration is for them to reflect on their own learning process, as humans do, and use that reflection to improve themselves. At the same time, these models have an advantage that human learners lack, since training leaves parameter-level traces that can, in principle, be inspected directly. However, current models cannot decode these traces into an explicit account of what they have learned. To this end, we introduce the \\textit{Imprint Reader}, a model trained with \\textit{Semantic Mount-and-Read Tuning} (SaRT) to describe frozen weight updates. SMaRT mounts each update onto the Reader and uses an anchor-free meta-query to elicit a natural-language description, while no-change and random-perturbation controls discourage unsupported claims. On held-out updates, the joint Reader reaches judge-based Pass@100 of $2\\%$ for knowledge and $16\\%$ for behavior. These results demonstrate the feasibility of natural-language readout while pointing to reliability across updates as the next step. Beyond free-form generation, the Reader provides a differentiable proxy for the gap between a specified target behavior and a candidate weight update. Its coordinate-aligned gradients support intervention through MetaEdit. At a $0.5\\%$ pruning rate, Reader-guided selection raises measured harmful-prompt refusal from $57.9\\%$ to $64.1\\%$ under a safety-maintenance target. Using behavior descriptions without target-task training data, MetaEdit increases the frequency of backtracking and sub-goal expressions in mathematical reasoning traces and raises BFCL Overall from $41.69\\%$ to $44.60\\%$.", "arxiv_id": "2609.35261", "arxiv_url": "https://arxiv.org/abs/2609.35261", "authors": ["Guanxu Chen", "Qihao Lin", "Jing Shao"], "brief": "\u8bba\u6587\u63d0\u51fa Imprint Reader\uff0c\u901a\u8fc7 Semantic Mount-and-Read Tuning\uff08SMaRT/SaRT\uff09\u5c06\u51bb\u7ed3\u7684\u6743\u91cd\u66f4\u65b0\u6302\u8f7d\u5230\u8bfb\u51fa\u6a21\u578b\u4e0a\uff0c\u5e76\u751f\u6210\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u5176\u5b66\u4e60\u5230\u7684\u77e5\u8bc6\u6216\u884c\u4e3a\u53d8\u5316\u3002\u540c\u65f6\u5c06\u8bfb\u51fa\u6a21\u578b\u4f5c\u4e3a\u53ef\u5fae\u4ee3\u7406\uff0c\u7528\u4e8e\u6307\u5bfc MetaEdit \u5bf9\u6a21\u578b\u884c\u4e3a\u8fdb\u884c\u5e72\u9884\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/biuboomc/SMaRT-Vibe-Alignment", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.35261", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": ["\u5728\u4fdd\u7559\u66f4\u65b0\u4e0a\uff0c\u8054\u5408 Reader \u7684\u8bc4\u6d4b Pass@100 \u8fbe\u5230\u77e5\u8bc6\u8bfb\u51fa 2%\u3001\u884c\u4e3a\u8bfb\u51fa 16%\uff0c\u663e\u793a\u81ea\u7136\u8bed\u8a00\u8bfb\u51fa\u6743\u91cd\u66f4\u65b0\u7684\u521d\u6b65\u53ef\u884c\u6027\u3002", "\u5f15\u5165\u65e0\u53d8\u5316\u4e0e\u968f\u673a\u6270\u52a8\u5bf9\u7167\uff0c\u51cf\u5c11\u6a21\u578b\u5bf9\u6743\u91cd\u66f4\u65b0\u4f5c\u51fa\u65e0\u4f9d\u636e\u63cf\u8ff0\u7684\u503e\u5411\u3002", "Reader \u5f15\u5bfc\u7684 MetaEdit \u5728 0.5% \u526a\u679d\u7387\u4e0b\u5c06\u6709\u5bb3\u63d0\u793a\u62d2\u7b54\u7387\u4ece 57.9% \u63d0\u5347\u5230 64.1%\uff0c\u5e76\u5728\u65e0\u9700\u76ee\u6807\u4efb\u52a1\u8bad\u7ec3\u6570\u636e\u65f6\u63d0\u5347\u6570\u5b66\u63a8\u7406\u8f68\u8ff9\u4e0e BFCL Overall \u8868\u73b0\u3002"], "keywords": ["\u6a21\u578b\u53ef\u89e3\u91ca\u6027", "\u6a21\u578b\u7f16\u8f91", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u5bf9\u9f50"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.35261v1", "published_at": "2026-09-28", "score": 0.258, "selected_reasons": ["HF trending (12\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35261.png", "title": "Imprint Reader: From Weight-Update Readout to Behavioral Intervention", "tldr": "\u8ba9\u6a21\u578b\u8bfb\u61c2\u6743\u91cd\u66f4\u65b0\u5e76\u6307\u5bfc\u884c\u4e3a\u7f16\u8f91", "upvotes": 12, "what_it_is": "\u8bba\u6587\u63d0\u51fa Imprint Reader\uff0c\u901a\u8fc7 Semantic Mount-and-Read Tuning\uff08SMaRT/SaRT\uff09\u5c06\u51bb\u7ed3\u7684\u6743\u91cd\u66f4\u65b0\u6302\u8f7d\u5230\u8bfb\u51fa\u6a21\u578b\u4e0a\uff0c\u5e76\u751f\u6210\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u5176\u5b66\u4e60\u5230\u7684\u77e5\u8bc6\u6216\u884c\u4e3a\u53d8\u5316\u3002\u540c\u65f6\u5c06\u8bfb\u51fa\u6a21\u578b\u4f5c\u4e3a\u53ef\u5fae\u4ee3\u7406\uff0c\u7528\u4e8e\u6307\u5bfc MetaEdit \u5bf9\u6a21\u578b\u884c\u4e3a\u8fdb\u884c\u5e72\u9884\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u628a\u201c\u7406\u89e3\u6743\u91cd\u66f4\u65b0\u201d\u4ece\u62bd\u8c61\u53ef\u89e3\u91ca\u6027\u63a8\u8fdb\u5230\u53ef\u64cd\u4f5c\u7684\u884c\u4e3a\u5e72\u9884\uff1a\u4e0d\u4ec5\u5c1d\u8bd5\u7528\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u6a21\u578b\u5b66\u5230\u4e86\u4ec0\u4e48\uff0c\u8fd8\u5229\u7528\u8fd9\u4e9b\u89e3\u91ca\u4fe1\u53f7\u7f16\u8f91\u6a21\u578b\u884c\u4e3a\uff0c\u4e3a\u6a21\u578b\u81ea\u53cd\u5f0f\u5b66\u4e60\u3001\u53ef\u89e3\u91ca\u8bad\u7ec3\u548c\u5b89\u5168\u5bf9\u9f50\u63d0\u4f9b\u4e86\u65b0\u8def\u5f84\u3002"}, {"abstract": "In multi-agent systems, reliable consultation is challenging because advisor capabilities vary across tasks, and misleading information can make consultation worse than autonomous reasoning. We introduce BaRe-Mem, an online Bayesian reliability memory for multi-agent consultation. It estimates advisor reliability based on the central model\u0027s internal belief representations and updates these estimates from historical interactions. These estimates modulate the influence of advisor responses and guide the choice between consultation and autonomous reasoning. Across nine benchmarks and six central models, BaRe-Mem is more robust to misleading advisor information than debate and majority voting. On the more challenging tasks, it remains above autonomous reasoning across all tested misleading levels. Moreover, we extend the BaRe-Mem mechanism to worker allocation in agent teams. On the MuSiQue benchmark, BaRe-Mem improves task completion over routing by historical success counts and identifies capable workers earlier.", "arxiv_id": "2609.35551", "arxiv_url": "https://arxiv.org/abs/2609.35551", "authors": ["Peilin Feng", "Zhengyang Huang", "Soujanya Poria"], "brief": "\u672c\u6587\u63d0\u51fa BaRe-Mem\uff0c\u4e00\u79cd\u5728\u7ebf\u8d1d\u53f6\u65af\u53ef\u9760\u6027\u8bb0\u5fc6\u673a\u5236\uff0c\u7528\u4e8e\u5728\u591a\u667a\u80fd\u4f53\u54a8\u8be2\u4e2d\u4f30\u8ba1\u4e0d\u540c\u987e\u95ee\u5728\u4efb\u52a1\u4e0a\u7684\u53ef\u9760\u6027\uff0c\u5e76\u636e\u6b64\u8c03\u8282\u91c7\u7eb3\u5efa\u8bae\u6216\u9009\u62e9\u81ea\u4e3b\u63a8\u7406\u3002\u5b9e\u9a8c\u8986\u76d6\u4e5d\u4e2a\u57fa\u51c6\u548c\u516d\u4e2a\u4e2d\u5fc3\u6a21\u578b\uff0c\u663e\u793a\u5176\u76f8\u6bd4\u8fa9\u8bba\u548c\u591a\u6570\u6295\u7968\u66f4\u80fd\u62b5\u6297\u8bef\u5bfc\u4fe1\u606f\uff0c\u5728\u590d\u6742\u4efb\u52a1\u548c\u56e2\u961f\u5de5\u4eba\u5206\u914d\u4e2d\u4e5f\u80fd\u66f4\u65e9\u8bc6\u522b\u53ef\u9760\u6210\u5458\u5e76\u63d0\u5347\u5b8c\u6210\u7387\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/declare-lab/BaRe-Mem", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2609.35551", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u667a\u80fd\u4f53", "\u8d1d\u53f6\u65af\u65b9\u6cd5", "\u53ef\u9760\u6027\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "Nanyang Technological University", "pdf_url": "https://arxiv.org/pdf/2609.35551v1", "published_at": "2026-09-28", "score": 0.081, "selected_reasons": ["HF trending (8\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35551.png", "title": "BaRe-Mem: Bayesian Reliability Memory for Robust and Adaptive Agent Consultation", "tldr": "\u672c\u6587\u63d0\u51fa BaRe-Mem\uff0c\u4e00\u79cd\u5728\u7ebf\u8d1d\u53f6\u65af\u53ef\u9760\u6027\u8bb0\u5fc6\u673a\u5236\uff0c\u7528\u4e8e\u5728\u591a\u667a\u80fd\u4f53\u54a8\u8be2\u4e2d\u4f30\u8ba1\u4e0d\u540c\u987e\u95ee\u5728\u4efb\u52a1\u4e0a\u7684\u53ef\u9760\u6027\uff0c\u5e76\u636e\u6b64\u8c03\u8282\u91c7\u7eb3\u5efa\u8bae\u6216\u9009\u62e9\u81ea\u4e3b\u63a8\u7406\u3002\u5b9e\u9a8c\u8986\u76d6\u4e5d\u4e2a\u57fa\u51c6\u548c\u516d\u4e2a\u4e2d\u5fc3\u6a21\u578b\uff0c\u663e\u793a\u5176\u76f8\u6bd4\u8fa9\u8bba\u548c\u591a\u6570\u6295\u7968\u66f4\u80fd\u62b5\u6297\u8bef\u5bfc\u4fe1\u606f\uff0c\u5728\u590d\u6742\u4efb\u52a1\u548c\u56e2\u961f\u5de5\u4eba\u5206\u914d\u4e2d\u4e5f\u80fd\u66f4\u65e9\u8bc6\u522b\u53ef\u9760\u6210\u5458\u5e76\u63d0\u5347\u5b8c\u6210\u7387\u3002", "upvotes": 8, "what_it_is": null, "why_notable": null}, {"abstract": "Fast matrix multiplication algorithms keep the product fixed and search for a cheaper way to evaluate it. We instead ask whether a Transformer\u0027s learned projections can use a different, cheaper product altogether. Building on an associative-algebra construction that replaces ordinary matrix multiplication with a sparser interaction table over the same weight blocks, we construct a family with quadratic arithmetic in the matrix dimension when the physical block size remains fixed, and derive finite-shape constraints for GPU execution. The construction is provably optimal for its bilinear rank by the Alder--Strassen bound and can be realized as row-typed rectangular projections compatible with causal masking and KV-cached decoding. We provide an empirical test of this approach by training two approximately 110M-parameter decoder-only Transformer LMs from the same recipe and 12.3B-token budget, differing only in their feed-forward layer: one uses ordinary dense matrix multiplication and the other uses the associative-algebra product. Across four prompt domains, the algebraic model achieves a 6.2--7.8\\% increase in end-to-end generation throughput, while obtaining lower scores on all three reported downstream metrics. We treat these results as a feasibility and trainability check for the proposed approach at small scale, leaving further investigation to future work.", "arxiv_id": "2609.32814", "arxiv_url": "https://arxiv.org/abs/2609.32814", "authors": ["Ilya Koziev", "Ivan Oseledets"], "brief": "\u8bba\u6587\u63d0\u51fa\u7528\u7ed3\u5408\u4ee3\u6570\u4e58\u79ef\u66ff\u4ee3 Transformer \u4e2d\u90e8\u5206\u666e\u901a\u77e9\u9635\u4e58\u6cd5\uff0c\u5728\u4fdd\u6301\u53c2\u6570\u89c4\u6a21\u76f8\u8fd1\u7684\u540c\u65f6\u964d\u4f4e\u8ba1\u7b97\u4ea4\u4e92\u6210\u672c\uff0c\u5e76\u7ed9\u51fa\u9002\u914d GPU\u3001\u56e0\u679c\u63a9\u7801\u548c KV \u7f13\u5b58\u89e3\u7801\u7684\u6784\u9020\u3002\u7ea6 110M \u53c2\u6570\u8bed\u8a00\u6a21\u578b\u5b9e\u9a8c\u663e\u793a\u751f\u6210\u541e\u5410\u63d0\u5347 6.2%\u20137.8%\uff0c\u4f46\u4e0b\u6e38\u6307\u6807\u5747\u4e0b\u964d\uff0c\u8bf4\u660e\u65b9\u6cd5\u5177\u5907\u53ef\u8bad\u7ec3\u6027\u4f46\u6548\u679c\u4ecd\u9700\u6539\u8fdb\u3002", "categories": ["cs.LG", "cs.PF"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32814", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["Transformer", "\u77e9\u9635\u4e58\u6cd5", "\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.32814v1", "published_at": "2026-09-26", "score": 0.08, "selected_reasons": ["HF trending (17\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32814.png", "title": "Change the Product, Keep the Parameters: Associative Algebra Layers for Transformers", "tldr": "\u8bba\u6587\u63d0\u51fa\u7528\u7ed3\u5408\u4ee3\u6570\u4e58\u79ef\u66ff\u4ee3 Transformer \u4e2d\u90e8\u5206\u666e\u901a\u77e9\u9635\u4e58\u6cd5\uff0c\u5728\u4fdd\u6301\u53c2\u6570\u89c4\u6a21\u76f8\u8fd1\u7684\u540c\u65f6\u964d\u4f4e\u8ba1\u7b97\u4ea4\u4e92\u6210\u672c\uff0c\u5e76\u7ed9\u51fa\u9002\u914d GPU\u3001\u56e0\u679c\u63a9\u7801\u548c KV \u7f13\u5b58\u89e3\u7801\u7684\u6784\u9020\u3002\u7ea6 110M \u53c2\u6570\u8bed\u8a00\u6a21\u578b\u5b9e\u9a8c\u663e\u793a\u751f\u6210\u541e\u5410\u63d0\u5347 6.2%\u20137.8%\uff0c\u4f46\u4e0b\u6e38\u6307\u6807\u5747\u4e0b\u964d\uff0c\u8bf4\u660e\u65b9\u6cd5\u5177\u5907\u53ef\u8bad\u7ec3\u6027\u4f46\u6548\u679c\u4ecd\u9700\u6539\u8fdb\u3002", "upvotes": 17, "what_it_is": null, "why_notable": null}, {"abstract": "Novel view synthesis from sparse images must reconcile faithful reconstruction of observed regions with plausible completion of unseen content, while maintaining world consistency across viewpoints. Existing geometry-based methods preserve observed scene structure but often struggle to complete unseen regions, whereas video generative models offer rich appearance priors but accumulate inconsistencies during sequential view generation. We propose GeoVerse, a framework that synthesizes world-consistent novel views by performing generation within the geometric latent space of a pretrained 3D foundation model and injecting appearance priors from a video generative model. Specifically, GeoVerse extracts multilevel features from Wan2.2 VACE and injects them into the geometric latent diffusion model via a ControlNet-style adapter, incorporating video-learned appearance priors to enhance structural completion. To enforce cross-view coherence, a global spatial memory continuously aggregates observed and synthesized content, reprojecting target-aligned guidance to anchor subsequent predictions to a shared scene representation. Extensive experiments across diverse datasets demonstrate improved visual quality and geometric consistency, with a 2.23 dB higher PSNR on DL3DV and 32.4% lower ATE on Mip-NeRF360 compared to GLD.", "arxiv_id": "2609.35734", "arxiv_url": "https://arxiv.org/abs/2609.35734", "authors": ["Kerui Ren", "Tao Lu", "Linning Xu", "Changjian Jiang", "Mu Huang", "Chunhua Shen", "Mulin Yu", "Bo Dai"], "brief": "GeoVerse\u63d0\u51fa\u5728\u9884\u8bad\u7ec33D\u57fa\u7840\u6a21\u578b\u7684\u51e0\u4f55\u6f5c\u7a7a\u95f4\u4e2d\u8fdb\u884c\u65b0\u89c6\u89d2\u751f\u6210\uff0c\u5e76\u901a\u8fc7ControlNet\u5f0f\u9002\u914d\u5668\u6ce8\u5165\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u5916\u89c2\u5148\u9a8c\uff0c\u4ee5\u66f4\u597d\u8865\u5168\u7a00\u758f\u8f93\u5165\u4e2d\u672a\u89c2\u6d4b\u533a\u57df\u3002\u5176\u5168\u5c40\u7a7a\u95f4\u8bb0\u5fc6\u673a\u5236\u805a\u5408\u5e76\u91cd\u6295\u5f71\u591a\u89c6\u89d2\u5185\u5bb9\uff0c\u63d0\u5347\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\uff1b\u5b9e\u9a8c\u4e2d\u76f8\u6bd4GLD\u5728DL3DV\u4e0aPSNR\u63d0\u9ad82.23 dB\uff0c\u5728Mip-NeRF360\u4e0aATE\u964d\u4f4e32.4%\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/geoverse-nvs/GeoVerse", "github_stars": 3, "hf_url": "https://huggingface.co/papers/2609.35734", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u65b0\u89c6\u89d2\u5408\u6210", "\u4e09\u7ef4\u751f\u6210", "\u6269\u6563\u6a21\u578b", "\u591a\u89c6\u89d2\u4e00\u81f4\u6027"], "num_comments": 2, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2609.35734v2", "published_at": "2026-09-28", "score": 0.073, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35734.png", "title": "GeoVerse: World-Consistent Novel View Synthesis in Geometric Latent Space", "tldr": "GeoVerse\u63d0\u51fa\u5728\u9884\u8bad\u7ec33D\u57fa\u7840\u6a21\u578b\u7684\u51e0\u4f55\u6f5c\u7a7a\u95f4\u4e2d\u8fdb\u884c\u65b0\u89c6\u89d2\u751f\u6210\uff0c\u5e76\u901a\u8fc7ControlNet\u5f0f\u9002\u914d\u5668\u6ce8\u5165\u89c6\u9891\u751f\u6210\u6a21\u578b\u7684\u5916\u89c2\u5148\u9a8c\uff0c\u4ee5\u66f4\u597d\u8865\u5168\u7a00\u758f\u8f93\u5165\u4e2d\u672a\u89c2\u6d4b\u533a\u57df\u3002\u5176\u5168\u5c40\u7a7a\u95f4\u8bb0\u5fc6\u673a\u5236\u805a\u5408\u5e76\u91cd\u6295\u5f71\u591a\u89c6\u89d2\u5185\u5bb9\uff0c\u63d0\u5347\u8de8\u89c6\u89d2\u4e00\u81f4\u6027\uff1b\u5b9e\u9a8c\u4e2d\u76f8\u6bd4GLD\u5728DL3DV\u4e0aPSNR\u63d0\u9ad82.23 dB\uff0c\u5728Mip-NeRF360\u4e0aATE\u964d\u4f4e32.4%\u3002", "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) methods such as GRPO rely on successful self-generated trajectories, but finite rollout budgets can produce all-fail groups with no reward-based policy-gradient signal. While additional rollouts improve the chance of success at higher cost, successful trajectories missing from one model\u0027s rollouts may already have been discovered by another. Indeed, we observe that heterogeneous models often succeed on complementary prompts, creating opportunities for mutual learning without a designated stronger teacher. To exploit this complementarity, we propose GRAFT (Gated Replacement of Answer-Failed groups with peer Trajectories), an off-policy-aware framework that replaces all-fail groups with informative peer groups. GRAFT transfers both successful and unsuccessful peer responses with peer-computed advantages, while controlling cross-model mismatch through sequence-level compatibility weighting and token-level importance ratio clipping. Across three heterogeneous model pairs and five mathematical reasoning benchmarks, GRAFT consistently improves both models over GRPO with the same per-model rollout budget, gaining 2.1 points on average and up to 4.5 points in model-level average performance. Stored peer trajectories preserve most of the gains, improving over GRPO by 1.8 points on average without simultaneous co-training.", "arxiv_id": "2609.37868", "arxiv_url": "https://arxiv.org/abs/2609.37868", "authors": ["Doohyuk Jang", "Yoonsik Park", "Gyouk Chu", "Sihwan Park", "Eunho Yang"], "brief": "\u8bba\u6587\u63d0\u51fa GRAFT\uff0c\u8ba9\u4e0d\u540c\u6a21\u578b\u5728 RLVR \u8bad\u7ec3\u4e2d\u4ea4\u6362\u5f7c\u6b64\u5df2\u91c7\u6837\u5230\u7684\u8f68\u8ff9\uff0c\u7528\u540c\u4f34\u8f68\u8ff9\u66ff\u6362\u5168\u5931\u8d25\u6837\u672c\u7ec4\uff0c\u5e76\u901a\u8fc7\u517c\u5bb9\u6027\u52a0\u6743\u548c\u91cd\u8981\u6027\u6bd4\u7387\u88c1\u526a\u63a7\u5236\u79bb\u7b56\u7565\u504f\u5dee\u3002\u5728\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u76f8\u540c rollout \u9884\u7b97\u4e0b\u76f8\u6bd4 GRPO \u5e73\u5747\u63d0\u5347 2.1 \u5206\uff0c\u6700\u9ad8\u63d0\u5347 4.5 \u5206\uff0c\u79bb\u7ebf\u5b58\u50a8\u8f68\u8ff9\u4e5f\u80fd\u4fdd\u7559\u5927\u90e8\u5206\u6536\u76ca\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37868", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u79bb\u7b56\u7565\u5b66\u4e60"], "num_comments": 1, "on_hf": true, "organization": "KAIST AI", "pdf_url": "https://arxiv.org/pdf/2609.37868v1", "published_at": "2026-09-29", "score": 0.069, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37868.png", "title": "Learning Beyond What You Sample: Off-Policy-Aware Cross-Model Trajectory Exchange for RLVR", "tldr": "\u8bba\u6587\u63d0\u51fa GRAFT\uff0c\u8ba9\u4e0d\u540c\u6a21\u578b\u5728 RLVR \u8bad\u7ec3\u4e2d\u4ea4\u6362\u5f7c\u6b64\u5df2\u91c7\u6837\u5230\u7684\u8f68\u8ff9\uff0c\u7528\u540c\u4f34\u8f68\u8ff9\u66ff\u6362\u5168\u5931\u8d25\u6837\u672c\u7ec4\uff0c\u5e76\u901a\u8fc7\u517c\u5bb9\u6027\u52a0\u6743\u548c\u91cd\u8981\u6027\u6bd4\u7387\u88c1\u526a\u63a7\u5236\u79bb\u7b56\u7565\u504f\u5dee\u3002\u5728\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u76f8\u540c rollout \u9884\u7b97\u4e0b\u76f8\u6bd4 GRPO \u5e73\u5747\u63d0\u5347 2.1 \u5206\uff0c\u6700\u9ad8\u63d0\u5347 4.5 \u5206\uff0c\u79bb\u7ebf\u5b58\u50a8\u8f68\u8ff9\u4e5f\u80fd\u4fdd\u7559\u5927\u90e8\u5206\u6536\u76ca\u3002", "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning (RL) post-training for large language models (LLMs) coordinates multiple models across generation, inference, and training on GPU clusters. Several factors may change during a run, including resource availability, sequence length, memory pressure, and stage bottlenecks. As a consequence, an execution plan that was initially suitable can then become slow or even infeasible over time. However, adapting a job whose models share GPUs entails significant challenges: deciding whether a new plan is worth the transition cost, reusing the job\u0027s distributed state, and coordinating GPU transfers across models and stages. Nereus targets these challenges as a cost-aware runtime that adapts RL post-training jobs into efficient execution plans. Its low-overhead controller selects a memory-feasible global plan and admits the transition using a cost model calibrated against the running job. To estimate and execute a transition, Nereus represents the distributed state of each replica of a model-stage (one model in one stage) as an Elastic Model Unit. It then employs a global transition graph to order the transformations and GPU transfers of these units. In a trace built from real data, online TP/PP adaptation reduces average step latency by 27.7% relative to the initial fixed TP/PP layout with DP scaling. In a 1,000-step run reaching 1,024 GPUs, six transitions consume 0.079% of total run time. Nereus improves end-to-end 8B PPO throughput by 2.14--7.27$\\times$ over OpenRLHF and by 1.10--1.47$\\times$ over Verl across diverse clusters.", "arxiv_id": "2609.34645", "arxiv_url": "https://arxiv.org/abs/2609.34645", "authors": ["Songlin Jiang", "Tuo Shi", "Sitong Zhang", "Zeke Wang", "Mario Di Francesco", "Bo Zhao"], "brief": "Nereus \u662f\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684\u4ee3\u4ef7\u611f\u77e5\u8fd0\u884c\u65f6\uff0c\u53ef\u6839\u636e\u8d44\u6e90\u3001\u5e8f\u5217\u957f\u5ea6\u3001\u663e\u5b58\u538b\u529b\u548c\u9636\u6bb5\u74f6\u9888\u52a8\u6001\u8c03\u6574 TP/PP/DP \u7b49\u5e76\u884c\u6267\u884c\u8ba1\u5212\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u7ebf\u81ea\u9002\u5e94\u5c06\u5e73\u5747 step \u5ef6\u8fdf\u964d\u4f4e 27.7%\uff0c\u5728 8B PPO \u7aef\u5230\u7aef\u541e\u5410\u4e0a\u76f8\u6bd4 OpenRLHF \u63d0\u5347 2.14\u20137.27 \u500d\u3001\u76f8\u6bd4 Verl \u63d0\u5347 1.10\u20131.47 \u500d\uff0c\u4e14\u5207\u6362\u5f00\u9500\u6781\u4f4e\u3002", "categories": ["cs.DC", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.34645", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u5e76\u884c\u8ba1\u7b97"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.34645v1", "published_at": "2026-09-28", "score": 0.069, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34645.png", "title": "Nereus: Adaptive Parallelism for LLM Post-Training", "tldr": "Nereus \u662f\u9762\u5411\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u540e\u8bad\u7ec3\u7684\u4ee3\u4ef7\u611f\u77e5\u8fd0\u884c\u65f6\uff0c\u53ef\u6839\u636e\u8d44\u6e90\u3001\u5e8f\u5217\u957f\u5ea6\u3001\u663e\u5b58\u538b\u529b\u548c\u9636\u6bb5\u74f6\u9888\u52a8\u6001\u8c03\u6574 TP/PP/DP \u7b49\u5e76\u884c\u6267\u884c\u8ba1\u5212\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u5728\u7ebf\u81ea\u9002\u5e94\u5c06\u5e73\u5747 step \u5ef6\u8fdf\u964d\u4f4e 27.7%\uff0c\u5728 8B PPO \u7aef\u5230\u7aef\u541e\u5410\u4e0a\u76f8\u6bd4 OpenRLHF \u63d0\u5347 2.14\u20137.27 \u500d\u3001\u76f8\u6bd4 Verl \u63d0\u5347 1.10\u20131.47 \u500d\uff0c\u4e14\u5207\u6362\u5f00\u9500\u6781\u4f4e\u3002", "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "Neural image watermarks can be forged by extracting watermark-bearing residuals from released images and transferring them to unrelated content. While prior work has demonstrated this vulnerability, what makes these residuals transferable remains poorly understood. We formalize this vulnerability with \\textbf{residual transferability (RT)}, a metric that quantifies how well watermark evidence remains decodable after transfer across unrelated images. Through comparative analyses and controlled interventions, we find that common training-side variations do not account for the large RT differences across watermarking systems; instead, architectural design plays a central role. By contrasting high- and low-RT systems and validating their architectural differences through controlled interventions, we identify two mechanisms that strengthen the dependence of watermark evidence on the cover image, thereby suppressing the residual transferability. These findings provide concrete design guidance for developing more forgery-resistant watermarking architectures. Complementarily, for existing watermarking systems where architectural redesign is impractical, we introduce \\textbf{CoverLock}, a plug-and-play strategy for existing watermarking systems that strengthens such image dependence without architectural redesign. Across representative watermarking systems exhibiting high residual transferability, CoverLock achieves a more favorable security--robustness trade-off than both traditional handcrafted defenses and learned classifier-based defenses.", "arxiv_id": "2609.32241", "arxiv_url": "https://arxiv.org/abs/2609.32241", "authors": ["Ziping Dong", "Qi Li", "Xinchao Wang"], "brief": "\u8bba\u6587\u63d0\u51fa\u201c\u6b8b\u5dee\u53ef\u8fc1\u79fb\u6027\u201d\u6307\u6807\uff0c\u7528\u4e8e\u8861\u91cf\u795e\u7ecf\u56fe\u50cf\u6c34\u5370\u6b8b\u5dee\u88ab\u63d0\u53d6\u540e\u8f6c\u79fb\u5230\u65e0\u5173\u56fe\u50cf\u4ecd\u53ef\u88ab\u89e3\u7801\u7684\u98ce\u9669\u3002\u7814\u7a76\u53d1\u73b0\u6c34\u5370\u7cfb\u7edf\u7684\u67b6\u6784\u8bbe\u8ba1\u662f\u5f71\u54cd\u8be5\u6f0f\u6d1e\u7684\u5173\u952e\uff0c\u5e76\u63d0\u51fa\u5373\u63d2\u5373\u7528\u9632\u5fa1 CoverLock\uff0c\u5728\u9ad8\u98ce\u9669\u7cfb\u7edf\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u5b89\u5168\u6027\u4e0e\u9c81\u68d2\u6027\u6743\u8861\u3002", "categories": ["cs.CR", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32241", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u6c34\u5370", "\u5b89\u5168\u9632\u5fa1", "\u8ba1\u7b97\u673a\u89c6\u89c9"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.32241v1", "published_at": "2026-09-26", "score": 0.067, "selected_reasons": ["HF trending (9\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32241.png", "title": "Residual Transferability in Neural Image Watermarking", "tldr": "\u8bba\u6587\u63d0\u51fa\u201c\u6b8b\u5dee\u53ef\u8fc1\u79fb\u6027\u201d\u6307\u6807\uff0c\u7528\u4e8e\u8861\u91cf\u795e\u7ecf\u56fe\u50cf\u6c34\u5370\u6b8b\u5dee\u88ab\u63d0\u53d6\u540e\u8f6c\u79fb\u5230\u65e0\u5173\u56fe\u50cf\u4ecd\u53ef\u88ab\u89e3\u7801\u7684\u98ce\u9669\u3002\u7814\u7a76\u53d1\u73b0\u6c34\u5370\u7cfb\u7edf\u7684\u67b6\u6784\u8bbe\u8ba1\u662f\u5f71\u54cd\u8be5\u6f0f\u6d1e\u7684\u5173\u952e\uff0c\u5e76\u63d0\u51fa\u5373\u63d2\u5373\u7528\u9632\u5fa1 CoverLock\uff0c\u5728\u9ad8\u98ce\u9669\u7cfb\u7edf\u4e0a\u53d6\u5f97\u66f4\u597d\u7684\u5b89\u5168\u6027\u4e0e\u9c81\u68d2\u6027\u6743\u8861\u3002", "upvotes": 9, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) reduces train-test state mismatch by training a student on its own generated trajectories, but weak students may visit teacher-misaligned prefixes where supervision is less representative. We introduce SAKI (Supervision Allocation with KL-constrained Interpolation), which combines a KL-constrained teacher-guided rollout with maximal coupling and reuses realized accept/correction events to route token-level supervision. Accepted positions retain sampled-token reverse-KL supervision, while correction positions receive direct supervision on the teacher\u0027s highest-probability token. Under maximal coupling, the correction probability is exactly TV(p_t, q_t), so the same trust-region radius controls rollout deviation and upper-bounds intervention and specialized-supervision frequency. We further implement an engine-resident speculative verifier that preserves the exact-q trajectory distribution and coupling semantics while improving matched-workload rollout throughput by 4.22x. Across seven mathematical reasoning benchmarks, SAKI improves the matched teacher-guided baseline in Mean@8 and Pass@8 for both 1.7B and 0.6B students. Placement controls and fixed-prefix analysis further support correction-triggered routing as a conflict-adaptive supervision signal.", "arxiv_id": "2609.36601", "arxiv_url": "https://arxiv.org/abs/2609.36601", "authors": ["Miteto Wei", "Xiaohan Wang", "Zehao Chen", "Jiajun Chai", "Sichao Liu", "Li Wang", "Haoyuan Xu", "Zhaoyu Hu", "Wei Lin", "Guojun Yin"], "brief": "\u672c\u6587\u63d0\u51fa SAKI\uff0c\u4e00\u79cd\u7528\u4e8e\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u7684\u6559\u5e08\u76d1\u7763\u5206\u914d\u65b9\u6cd5\uff0c\u901a\u8fc7 KL \u7ea6\u675f\u7684\u6559\u5e08\u5f15\u5bfc rollout\u3001\u6700\u5927\u8026\u5408\u4ee5\u53ca\u57fa\u4e8e\u63a5\u53d7/\u7ea0\u6b63\u4e8b\u4ef6\u7684 token \u7ea7\u76d1\u7763\u8def\u7531\uff0c\u7f13\u89e3\u5f31\u5b66\u751f\u751f\u6210\u504f\u79bb\u6559\u5e08\u5206\u5e03\u7684\u95ee\u9898\u3002\u5728 7 \u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0cSAKI \u63d0\u5347\u4e86 1.7B \u548c 0.6B \u5b66\u751f\u6a21\u578b\u7684 Mean@8 \u4e0e Pass@8\uff0c\u5e76\u901a\u8fc7\u63a8\u6d4b\u9a8c\u8bc1\u5668\u5c06 rollout \u541e\u5410\u63d0\u5347 4.22 \u500d\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36601", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u77e5\u8bc6\u84b8\u998f", "\u8bed\u8a00\u6a21\u578b", "\u6570\u5b66\u63a8\u7406", "\u63a8\u6d4b\u89e3\u7801"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.36601v1", "published_at": "2026-09-29", "score": 0.051, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36601.png", "title": "SAKI: Maximal-Coupling-Routed Teacher Supervision for On-Policy Distillation", "tldr": "\u672c\u6587\u63d0\u51fa SAKI\uff0c\u4e00\u79cd\u7528\u4e8e\u5728\u7ebf\u7b56\u7565\u84b8\u998f\u7684\u6559\u5e08\u76d1\u7763\u5206\u914d\u65b9\u6cd5\uff0c\u901a\u8fc7 KL \u7ea6\u675f\u7684\u6559\u5e08\u5f15\u5bfc rollout\u3001\u6700\u5927\u8026\u5408\u4ee5\u53ca\u57fa\u4e8e\u63a5\u53d7/\u7ea0\u6b63\u4e8b\u4ef6\u7684 token \u7ea7\u76d1\u7763\u8def\u7531\uff0c\u7f13\u89e3\u5f31\u5b66\u751f\u751f\u6210\u504f\u79bb\u6559\u5e08\u5206\u5e03\u7684\u95ee\u9898\u3002\u5728 7 \u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0cSAKI \u63d0\u5347\u4e86 1.7B \u548c 0.6B \u5b66\u751f\u6a21\u578b\u7684 Mean@8 \u4e0e Pass@8\uff0c\u5e76\u901a\u8fc7\u63a8\u6d4b\u9a8c\u8bc1\u5668\u5c06 rollout \u541e\u5410\u63d0\u5347 4.22 \u500d\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Efficient exploration often remains a central bottleneck in reinforcement learning with verifiable rewards (RLVR). Although temperature control and test-time scaling strategies can increase rollout diversity of large language models (LLMs), they either expand the sample budget at rollout time or leave the benefit of exploration unquantified. To this end, we propose Temperature-Grouped Reinforcement Learning (TGRL), which turns temperature-induced diversity into an explicit training signal. For each prompt, TGRL partitions its rollout group into low- and high-temperature subsets, estimates exploration gain through their reward contrast, and allocates this group-level signal as token-level credit using Jensen--Shannon (JS) divergence between the corresponding temperature-scaled next-token distributions induced by the same logits. Notably, TGRL reaches equivalent accuracy up to 36% faster than strong RLVR baselines without expanding the rollout budget. Across 11 benchmarks from diverse domains, TGRL broadly improves over strong RLVR baselines: it improves the six-benchmark math average by 1.6% at 32B, raises CodeForces rating by 196.7 points and LiveCodeBench Pass@16 by 4.4%, and improves ALFWorld/WebShop success rates by 6.3%/4.9%. Comprehensive ablations and wall-clock analysis confirm the efficacy of all proposed components. Code is available at https://github.com/1229095296/TGRL/tree/main.", "arxiv_id": "2609.33589", "arxiv_url": "https://arxiv.org/abs/2609.33589", "authors": ["Zihan Lin", "Xiaohan Wang", "Jie Cao", "Jiajun Chai", "Wei Lin", "Guojun Yin", "Ran He"], "brief": "\u672c\u6587\u63d0\u51fa\u6e29\u5ea6\u5206\u7ec4\u5f3a\u5316\u5b66\u4e60\uff08TGRL\uff09\uff0c\u5c06\u4f4e\u6e29\u4e0e\u9ad8\u6e29\u91c7\u6837\u4ea7\u751f\u7684\u56de\u62a5\u5dee\u5f02\u8f6c\u5316\u4e3a\u663e\u5f0f\u63a2\u7d22\u4fe1\u53f7\uff0c\u5e76\u7528JS\u6563\u5ea6\u8fdb\u884ctoken\u7ea7\u4fe1\u7528\u5206\u914d\u3002\u5728\u4e0d\u589e\u52a0rollout\u9884\u7b97\u7684\u60c5\u51b5\u4e0b\uff0cTGRL\u76f8\u8f83\u5f3aRLVR\u57fa\u7ebf\u6700\u9ad8\u53ef\u63d0\u524d36%\u8fbe\u5230\u540c\u7b49\u51c6\u786e\u7387\uff0c\u5e76\u5728\u6570\u5b66\u3001\u4ee3\u7801\u548c\u4ea4\u4e92\u4efb\u52a1\u7b4911\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": "https://github.com/1229095296/TGRL", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.33589", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u9ad8\u6548\u63a2\u7d22", "\u53ef\u9a8c\u8bc1\u5956\u52b1"], "num_comments": 1, "on_hf": true, "organization": "meituan", "pdf_url": "https://arxiv.org/pdf/2609.33589v1", "published_at": "2026-09-27", "score": 0.032, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33589.png", "title": "TGRL: Temperature-Grouped Reinforcement Learning for Efficient Exploration in LLMs", "tldr": "\u672c\u6587\u63d0\u51fa\u6e29\u5ea6\u5206\u7ec4\u5f3a\u5316\u5b66\u4e60\uff08TGRL\uff09\uff0c\u5c06\u4f4e\u6e29\u4e0e\u9ad8\u6e29\u91c7\u6837\u4ea7\u751f\u7684\u56de\u62a5\u5dee\u5f02\u8f6c\u5316\u4e3a\u663e\u5f0f\u63a2\u7d22\u4fe1\u53f7\uff0c\u5e76\u7528JS\u6563\u5ea6\u8fdb\u884ctoken\u7ea7\u4fe1\u7528\u5206\u914d\u3002\u5728\u4e0d\u589e\u52a0rollout\u9884\u7b97\u7684\u60c5\u51b5\u4e0b\uff0cTGRL\u76f8\u8f83\u5f3aRLVR\u57fa\u7ebf\u6700\u9ad8\u53ef\u63d0\u524d36%\u8fbe\u5230\u540c\u7b49\u51c6\u786e\u7387\uff0c\u5e76\u5728\u6570\u5b66\u3001\u4ee3\u7801\u548c\u4ea4\u4e92\u4efb\u52a1\u7b4911\u4e2a\u57fa\u51c6\u4e0a\u53d6\u5f97\u7a33\u5b9a\u63d0\u5347\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "On-policy distillation (OPD) trains multi-turn language agents with dense teacher supervision on student-generated responses. However, standard think-then-act rollouts require lengthy reasoning before each short action, delaying environment transitions and experience collection. Generating actions directly reduces this delay but can degrade rollout quality. To address this, we propose ActFirst-OPD, an act-first, reason-later training framework that decouples environment interaction from full-response generation. The student infers and executes actions through reference-conditioned inverse dynamics using its current interaction context and a reference next observation, and switches to autonomous next-action prediction when the resulting transition deviates from the reference trajectory. From the collected interaction contexts, the student asynchronously generates full think-then-act responses for token-level teacher supervision. Experiments across 0.6B-, 1.7B-, and 4B-parameter Qwen3 students show that ActFirst-OPD achieves average wall-clock training speedups of $2.3\\times$ on ALFWorld, $1.8\\times$ on WebShop, and $4.9\\times$ on ScienceWorld over Vanilla OPD. It matches or exceeds all compared OPD baselines in mean task success rate across eight of nine benchmark-model settings. These results demonstrate that reasoning need not block acting during multi-turn agent distillation.", "arxiv_id": "2609.36608", "arxiv_url": "https://arxiv.org/abs/2609.36608", "authors": ["Zubin Zheng", "Jiahao Wu", "Shaofeng Zhang", "Zhirui Zhang", "Yew-Soon Ong", "Shengcai Liu"], "brief": "\u8bba\u6587\u63d0\u51fa ActFirst-OPD\uff0c\u7528\u201c\u5148\u884c\u52a8\u3001\u540e\u63a8\u7406\u201d\u7684\u65b9\u5f0f\u52a0\u901f\u591a\u8f6e\u8bed\u8a00\u667a\u80fd\u4f53\u7684 on-policy \u84b8\u998f\uff1a\u5148\u57fa\u4e8e\u53c2\u8003\u4e0b\u4e00\u89c2\u6d4b\u505a\u9006\u52a8\u529b\u5b66\u63a8\u65ad\u5e76\u6267\u884c\u52a8\u4f5c\uff0c\u518d\u5f02\u6b65\u751f\u6210\u5b8c\u6574\u63a8\u7406-\u884c\u52a8\u54cd\u5e94\u7528\u4e8e\u6559\u5e08\u76d1\u7763\u3002\u5728 ALFWorld\u3001WebShop\u3001ScienceWorld \u4e0a\u76f8\u5bf9 Vanilla OPD \u83b7\u5f97\u7ea6 1.8-4.9 \u500d\u8bad\u7ec3\u52a0\u901f\uff0c\u5e76\u5728\u591a\u6570\u8bbe\u7f6e\u4e2d\u4fdd\u6301\u6216\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\u3002", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36608", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u77e5\u8bc6\u84b8\u998f", "\u8bed\u8a00\u6a21\u578b", "\u591a\u8f6e\u4ea4\u4e92"], "num_comments": 1, "on_hf": true, "organization": "Southern University of Science and Technology", "pdf_url": "https://arxiv.org/pdf/2609.36608v1", "published_at": "2026-09-29", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36608.png", "title": "Act First, Reason Later: Accelerating On-Policy Distillation for Multi-Turn Agents via Reference-Conditioned Inverse Dynamics", "tldr": "\u8bba\u6587\u63d0\u51fa ActFirst-OPD\uff0c\u7528\u201c\u5148\u884c\u52a8\u3001\u540e\u63a8\u7406\u201d\u7684\u65b9\u5f0f\u52a0\u901f\u591a\u8f6e\u8bed\u8a00\u667a\u80fd\u4f53\u7684 on-policy \u84b8\u998f\uff1a\u5148\u57fa\u4e8e\u53c2\u8003\u4e0b\u4e00\u89c2\u6d4b\u505a\u9006\u52a8\u529b\u5b66\u63a8\u65ad\u5e76\u6267\u884c\u52a8\u4f5c\uff0c\u518d\u5f02\u6b65\u751f\u6210\u5b8c\u6574\u63a8\u7406-\u884c\u52a8\u54cd\u5e94\u7528\u4e8e\u6559\u5e08\u76d1\u7763\u3002\u5728 ALFWorld\u3001WebShop\u3001ScienceWorld \u4e0a\u76f8\u5bf9 Vanilla OPD \u83b7\u5f97\u7ea6 1.8-4.9 \u500d\u8bad\u7ec3\u52a0\u901f\uff0c\u5e76\u5728\u591a\u6570\u8bbe\u7f6e\u4e2d\u4fdd\u6301\u6216\u63d0\u5347\u4efb\u52a1\u6210\u529f\u7387\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Latent world models learn action-conditioned dynamics in representation space and often score candidate actions by Euclidean distance to a goal representation. Joint training typically regularizes the representation to prevent collapse, but the resulting representation geometry also determines how terminal errors are weighted during planning. We show that accurate prediction and noncollapsed representations do not guarantee a task-aligned latent planning cost: isotropic Gaussian regularization can induce a geometry that ranks feasible outcomes differently from the task cost. To address this mismatch, we introduce AnisoWM with $\u039b$Reg, which replaces the fixed isotropic Gaussian target with a learnable diagonal covariance under fixed-trace and anisotropy constraints. The prediction objective, predictor architecture, and Euclidean planner remain unchanged; the target is used only during training. Our analysis characterizes the prediction-driven allocation of target variance, its dependence on the training distribution, and the conditions under which the induced metric reduces planning regret. Across four visual control environments, AnisoWM improves planning success over LeWorldModel in all four. Its latent planning cost also shows better agreement with task outcomes. Project website: https://rkdrn79.github.io/AnisoWM-page/", "arxiv_id": "2609.37441", "arxiv_url": "https://arxiv.org/abs/2609.37441", "authors": ["Mingu Kang", "Yoori Oh", "Sookyung Kim", "Joonseok Lee"], "brief": "\u8bba\u6587\u6307\u51fa\uff0cJEPA \u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u5e38\u7528\u7684\u5404\u5411\u540c\u6027\u9ad8\u65af\u6b63\u5219\u4f1a\u9020\u6210\u8868\u793a\u7a7a\u95f4\u51e0\u4f55\u4e0e\u4efb\u52a1\u4ee3\u4ef7\u4e0d\u5339\u914d\uff0c\u5373\u4f7f\u9884\u6d4b\u51c6\u786e\u4e5f\u53ef\u80fd\u8bef\u5bfc\u89c4\u5212\u3002\u4f5c\u8005\u63d0\u51fa AnisoWM\uff0c\u7528\u53ef\u5b66\u4e60\u7684\u5bf9\u89d2\u534f\u65b9\u5dee\u6b63\u5219\u5851\u9020\u5404\u5411\u5f02\u6027\u8868\u793a\uff0c\u5728\u4e0d\u6539\u53d8\u9884\u6d4b\u5668\u548c\u6b27\u6c0f\u89c4\u5212\u5668\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u4e86\u56db\u4e2a\u89c6\u89c9\u63a7\u5236\u73af\u5883\u4e2d\u7684\u89c4\u5212\u6210\u529f\u7387\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37441", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u8868\u793a\u5b66\u4e60", "\u89c4\u5212", "\u673a\u5668\u4eba\u63a7\u5236"], "num_comments": 1, "on_hf": true, "organization": "Seoul National University", "pdf_url": "https://arxiv.org/pdf/2609.37441v1", "published_at": "2026-09-29", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37441.png", "title": "Anisotropic Representations Improve Planning in JEPA World Models", "tldr": "\u8bba\u6587\u6307\u51fa\uff0cJEPA \u6f5c\u5728\u4e16\u754c\u6a21\u578b\u4e2d\u5e38\u7528\u7684\u5404\u5411\u540c\u6027\u9ad8\u65af\u6b63\u5219\u4f1a\u9020\u6210\u8868\u793a\u7a7a\u95f4\u51e0\u4f55\u4e0e\u4efb\u52a1\u4ee3\u4ef7\u4e0d\u5339\u914d\uff0c\u5373\u4f7f\u9884\u6d4b\u51c6\u786e\u4e5f\u53ef\u80fd\u8bef\u5bfc\u89c4\u5212\u3002\u4f5c\u8005\u63d0\u51fa AnisoWM\uff0c\u7528\u53ef\u5b66\u4e60\u7684\u5bf9\u89d2\u534f\u65b9\u5dee\u6b63\u5219\u5851\u9020\u5404\u5411\u5f02\u6027\u8868\u793a\uff0c\u5728\u4e0d\u6539\u53d8\u9884\u6d4b\u5668\u548c\u6b27\u6c0f\u89c4\u5212\u5668\u7684\u60c5\u51b5\u4e0b\u63d0\u5347\u4e86\u56db\u4e2a\u89c6\u89c9\u63a7\u5236\u73af\u5883\u4e2d\u7684\u89c4\u5212\u6210\u529f\u7387\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models can reason in continuous space instead of decoded text, by recurring on their own hidden states or by passing those states between agents, while training supervises only the Cross-Entropy (CE) of the final decoded answer and does not constrain the thought. Theoretical and empirical analyses establish and confirm four failures of CE-only training that lead to a lower probability of the correct answer such as collapsing thoughts across distinct questions and retaining irrelevant information. We introduce REST (REpresentation-Supervised Thoughts), a training objective that turns four properties of a valid thought representation (causality, minimality, separability, and stability) into differentiable losses added to CE. We instantiate it in latent single-agent and multi-agent systems, without architectural changes or added parameters at inference. Across 7 benchmarks spanning mathematics, science, medicine, and code generation, with the same training data, compute, and latent budget, REST increases accuracy over CE-only training across agent settings and model sizes by up to 7.5 percentage points and convergence on a final answer by 30\\%. Furthermore, REST thoughts encode more of what is required to achieve the correct answer, and decoding them better recovers the intended output of the agent, which makes latent communication easier to interpret. Project Website: https://fard-lab.github.io/REST", "arxiv_id": "2609.36159", "arxiv_url": "https://arxiv.org/abs/2609.36159", "authors": ["Fahd Seddik", "Fatemeh Fard"], "brief": "\u672c\u6587\u7814\u7a76LLM\u5728\u8fde\u7eed\u9690\u7a7a\u95f4\u4e2d\u8fdb\u884c\u9012\u5f52\u63a8\u7406\u6216\u591a\u667a\u80fd\u4f53\u4f20\u9012\u9690\u85cf\u72b6\u6001\u65f6\uff0c\u4ec5\u7528\u6700\u7ec8\u7b54\u6848\u4ea4\u53c9\u71b5\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u601d\u7ef4\u574d\u7f29\u3001\u4fdd\u7559\u65e0\u5173\u4fe1\u606f\u7b49\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51faREST\uff0c\u7528\u56e0\u679c\u6027\u3001\u6700\u5c0f\u6027\u3001\u53ef\u5206\u6027\u3001\u7a33\u5b9a\u6027\u76d1\u7763\u9690\u5f0f\u601d\u7ef4\u8868\u793a\uff0c\u57287\u4e2a\u6570\u5b66\u3001\u79d1\u5b66\u3001\u533b\u5b66\u548c\u4ee3\u7801\u57fa\u51c6\u4e0a\u6700\u9ad8\u63d0\u53477.5\u4e2a\u767e\u5206\u70b9\u51c6\u786e\u7387\uff0c\u5e76\u63d0\u5347\u6700\u7ec8\u7b54\u6848\u6536\u655b\u7387\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/FARD-Lab/REST", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36159", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u8868\u793a\u5b66\u4e60", "\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "University of British Columbia - Okanagan Campus", "pdf_url": "https://arxiv.org/pdf/2609.36159v1", "published_at": "2026-09-28", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36159.png", "title": "Principled Thoughts for Latent Recursive LLM Systems", "tldr": "\u672c\u6587\u7814\u7a76LLM\u5728\u8fde\u7eed\u9690\u7a7a\u95f4\u4e2d\u8fdb\u884c\u9012\u5f52\u63a8\u7406\u6216\u591a\u667a\u80fd\u4f53\u4f20\u9012\u9690\u85cf\u72b6\u6001\u65f6\uff0c\u4ec5\u7528\u6700\u7ec8\u7b54\u6848\u4ea4\u53c9\u71b5\u8bad\u7ec3\u4f1a\u5bfc\u81f4\u601d\u7ef4\u574d\u7f29\u3001\u4fdd\u7559\u65e0\u5173\u4fe1\u606f\u7b49\u95ee\u9898\u3002\u4f5c\u8005\u63d0\u51faREST\uff0c\u7528\u56e0\u679c\u6027\u3001\u6700\u5c0f\u6027\u3001\u53ef\u5206\u6027\u3001\u7a33\u5b9a\u6027\u76d1\u7763\u9690\u5f0f\u601d\u7ef4\u8868\u793a\uff0c\u57287\u4e2a\u6570\u5b66\u3001\u79d1\u5b66\u3001\u533b\u5b66\u548c\u4ee3\u7801\u57fa\u51c6\u4e0a\u6700\u9ad8\u63d0\u53477.5\u4e2a\u767e\u5206\u70b9\u51c6\u786e\u7387\uff0c\u5e76\u63d0\u5347\u6700\u7ec8\u7b54\u6848\u6536\u655b\u7387\u4e0e\u53ef\u89e3\u91ca\u6027\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Dense retrieval powers retrieval-augmented generation, semantic search, and question answering, yet the theoretical basis for choosing between shared and dual query-document projections remains unclear. We introduce a bias-variance theory for low-rank bilinear scoring. Shared projections induce positive-semidefinite operators, whereas dual projections realize arbitrary low-rank operators. We derive their exact approximation gap and prove a local Gaussian boundary: dual has lower risk exactly when squared directional signal exceeds the estimation cost of its additional degrees of freedom. This boundary motivates the Cross-fitted Asymmetry Risk Selector (CARS), which estimates reproducible directional signal from training pairs; its Gaussian counterpart admits exact selection-power and regret formulas. Guided by the theory, we run retrieval experiments across multiple datasets and embedding models. The mean Dual-minus-Shared NDCG@10 advantage more than doubles as query rotation increases from 0 degrees to 90 degrees. In the rank-sample-size grids, Shared wins 13 of 16 cells at n=32, whereas Dual wins all 32 cells at n=1024 and n=2048. Consistent with this shift, all 168 comparable operator-risk curves move toward Dual as training data grow. Compared to the two fixed-geometry baselines, CARS reduces held-out regret by 49-96% and achieves 90.1% mean geometry-selection accuracy.", "arxiv_id": "2609.32488", "arxiv_url": "https://arxiv.org/abs/2609.32488", "authors": ["Maojun Sun", "Yancheng Yuan", "Jian Huang", "Ruijian Han"], "brief": "\u672c\u6587\u4e3a\u7a20\u5bc6\u68c0\u7d22\u4e2d\u5171\u4eab\u6295\u5f71\u4e0e\u53cc\u6295\u5f71\u7684\u9009\u62e9\u5efa\u7acb\u4e86\u4f4e\u79e9\u53cc\u7ebf\u6027\u6253\u5206\u7684\u504f\u5dee-\u65b9\u5dee\u7406\u8bba\uff0c\u523b\u753b\u4e86\u53cc\u6295\u5f71\u4f55\u65f6\u56e0\u975e\u5bf9\u79f0\u51e0\u4f55\u83b7\u5f97\u66f4\u4f4e\u98ce\u9669\u3002\u57fa\u4e8e\u7406\u8bba\u63d0\u51fa CARS \u9009\u62e9\u5668\uff0c\u5728\u591a\u6570\u636e\u96c6\u5b9e\u9a8c\u4e2d\u663e\u8457\u964d\u4f4e\u51e0\u4f55\u9009\u62e9\u540e\u6094\u503c\uff0c\u5e76\u663e\u793a\u6570\u636e\u91cf\u8d8a\u5927\u3001\u67e5\u8be2\u65b9\u5411\u65cb\u8f6c\u8d8a\u5f3a\u65f6\u53cc\u6295\u5f71\u4f18\u52bf\u8d8a\u660e\u663e\u3002", "categories": ["cs.IR", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32488", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4fe1\u606f\u68c0\u7d22", "\u7a20\u5bc6\u68c0\u7d22", "\u8868\u793a\u5b66\u4e60", "\u504f\u5dee\u65b9\u5dee"], "num_comments": 1, "on_hf": true, "organization": "The Hong Kong Polytechnic University", "pdf_url": "https://arxiv.org/pdf/2609.32488v1", "published_at": "2026-09-26", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32488.png", "title": "When Does Dense Retrieval Need Asymmetric Geometry? A Bias-Variance Theory of Shared and Dual Projections", "tldr": "\u672c\u6587\u4e3a\u7a20\u5bc6\u68c0\u7d22\u4e2d\u5171\u4eab\u6295\u5f71\u4e0e\u53cc\u6295\u5f71\u7684\u9009\u62e9\u5efa\u7acb\u4e86\u4f4e\u79e9\u53cc\u7ebf\u6027\u6253\u5206\u7684\u504f\u5dee-\u65b9\u5dee\u7406\u8bba\uff0c\u523b\u753b\u4e86\u53cc\u6295\u5f71\u4f55\u65f6\u56e0\u975e\u5bf9\u79f0\u51e0\u4f55\u83b7\u5f97\u66f4\u4f4e\u98ce\u9669\u3002\u57fa\u4e8e\u7406\u8bba\u63d0\u51fa CARS \u9009\u62e9\u5668\uff0c\u5728\u591a\u6570\u636e\u96c6\u5b9e\u9a8c\u4e2d\u663e\u8457\u964d\u4f4e\u51e0\u4f55\u9009\u62e9\u540e\u6094\u503c\uff0c\u5e76\u663e\u793a\u6570\u636e\u91cf\u8d8a\u5927\u3001\u67e5\u8be2\u65b9\u5411\u65cb\u8f6c\u8d8a\u5f3a\u65f6\u53cc\u6295\u5f71\u4f18\u52bf\u8d8a\u660e\u663e\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Realistic and editable animal fur reconstruction from multi-view images is challenging due to fine-scale detail, self-occlusion and obfuscation, and, unlike human hair, the lack of animal-fur datasets. Fur usually covers most of an animal\u0027s body, with large inter-species and intra-species variability. We present FurE, an efficient strand-based animal fur reconstruction method that recovers a per-strand, editable groom by optimizing a root-conditioned latent field, decoded into strand geometry via a PCA-based decoder. We reconstruct a defurred animal body using local fur-thickness cues from a surface-constrained Gaussian Frosting representation together with part-based priors. We further show that a PCA-based decoder learned from human-hair strand data can alleviate animal-data scarcity while enabling substantially faster optimization. FurE achieves a 10x speedup in strand training over current SOTA dense per-strand optimization while retaining strand fidelity and generalizing across synthetic and real-world sequences, with quantitative and qualitative validation despite the reduction in training time.", "arxiv_id": "2609.35770", "arxiv_url": "https://arxiv.org/abs/2609.35770", "authors": ["Srinjay Sarkar", "Prakhar Kaushik", "Soumava Paul", "Alan Yuille"], "brief": "FurE \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u52a8\u7269\u6bdb\u53d1\u6570\u636e\u96c6\u7684\u591a\u89c6\u89d2\u52a8\u7269\u6bdb\u53d1\u91cd\u5efa\u65b9\u6cd5\uff0c\u901a\u8fc7\u6839\u90e8\u6761\u4ef6\u6f5c\u573a\u548c\u57fa\u4e8e PCA \u7684\u89e3\u7801\u5668\u751f\u6210\u53ef\u7f16\u8f91\u7684\u9010\u4e1d\u6bdb\u53d1\u51e0\u4f55\u3002\u8be5\u65b9\u6cd5\u5229\u7528\u4eba\u4f53\u5934\u53d1\u6570\u636e\u7f13\u89e3\u52a8\u7269\u6570\u636e\u7a00\u7f3a\uff0c\u5e76\u76f8\u6bd4\u73b0\u6709\u9010\u4e1d\u4f18\u5316\u65b9\u6cd5\u5b9e\u73b0\u7ea6 10 \u500d\u8bad\u7ec3\u52a0\u901f\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u597d\u7684\u7ec6\u8282\u4fdd\u771f\u548c\u8de8\u5408\u6210/\u771f\u5b9e\u5e8f\u5217\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.CV", "cs.AI", "cs.GR"], "github_repo": "https://github.com/toshi2k2/fure", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2609.35770", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e09\u7ef4\u91cd\u5efa", "\u6bdb\u53d1\u5efa\u6a21", "\u591a\u89c6\u89d2", "\u53ef\u7f16\u8f91\u51e0\u4f55"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.35770v1", "published_at": "2026-09-28", "score": 0.014, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35770.png", "title": "FurE: Efficient Instance-Specific 3D Fur Reconstruction without Animal-Fur Datasets", "tldr": "FurE \u63d0\u51fa\u4e00\u79cd\u65e0\u9700\u52a8\u7269\u6bdb\u53d1\u6570\u636e\u96c6\u7684\u591a\u89c6\u89d2\u52a8\u7269\u6bdb\u53d1\u91cd\u5efa\u65b9\u6cd5\uff0c\u901a\u8fc7\u6839\u90e8\u6761\u4ef6\u6f5c\u573a\u548c\u57fa\u4e8e PCA \u7684\u89e3\u7801\u5668\u751f\u6210\u53ef\u7f16\u8f91\u7684\u9010\u4e1d\u6bdb\u53d1\u51e0\u4f55\u3002\u8be5\u65b9\u6cd5\u5229\u7528\u4eba\u4f53\u5934\u53d1\u6570\u636e\u7f13\u89e3\u52a8\u7269\u6570\u636e\u7a00\u7f3a\uff0c\u5e76\u76f8\u6bd4\u73b0\u6709\u9010\u4e1d\u4f18\u5316\u65b9\u6cd5\u5b9e\u73b0\u7ea6 10 \u500d\u8bad\u7ec3\u52a0\u901f\uff0c\u540c\u65f6\u4fdd\u6301\u8f83\u597d\u7684\u7ec6\u8282\u4fdd\u771f\u548c\u8de8\u5408\u6210/\u771f\u5b9e\u5e8f\u5217\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Pretrained visual representations support image generation, but may not fully preserve the fine-grained details needed for faithful reconstruction. Meanwhile, intermediate encoder layers contain complementary visual details, but learning to fuse them for reconstruction can produce a latent distribution that is difficult to model. Existing fusion methods require empirical tuning of layer selection or staged optimization of fusion and decoding, increasing configuration effort or training complexity. We introduce HiRAE (Hierarchical Representation Autoencoder), which learns a hierarchical fusion framework over the full encoder hierarchy to improve reconstruction fidelity while maintaining compatibility with generative modeling. HiRAE groups encoder layers by depth and learns residual corrections to the deepest representation. Group-wise norm caps bound these corrections relative to the deep anchor, with tighter budgets for shallower groups. Our HiRAE-24 preserves the latent token count and channel dimension. On ImageNet-256, HiRAE-24 reduces reconstruction FID from 0.299 to 0.209 relative to RAEv2 while maintaining competitive guided generation quality. For text-to-image generation, HiRAE-24 improves alignment over RAEv2 on GenEval, DPG-Bench, and GenAI-Bench both before and after supervised fine-tuning. Under the same generator-training and evaluation protocol, post-fine-tuning GenEval increases from 84.86 to 87.70.", "arxiv_id": "2609.37775", "arxiv_url": "https://arxiv.org/abs/2609.37775", "authors": ["Xuanyu Zhu", "Yan Bai", "Yang Shi", "Yihang Lou", "Yuanxing Zhang", "Tengfei Liu", "Jing Jin", "Yuan Zhou"], "brief": "\u672c\u6587\u63d0\u51fa HiRAE\uff0c\u901a\u8fc7\u5bf9\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u7684\u5168\u5c42\u7ea7\u7279\u5f81\u8fdb\u884c\u5206\u7ec4\u878d\u5408\uff0c\u5e76\u7528\u6b8b\u5dee\u9884\u7b97\u7ea6\u675f\u6d45\u5c42\u7ec6\u8282\u4fee\u6b63\uff0c\u5728\u63d0\u5347\u91cd\u5efa\u7ec6\u8282\u7684\u540c\u65f6\u4fdd\u6301\u6f5c\u53d8\u91cf\u6613\u4e8e\u751f\u6210\u5efa\u6a21\u3002\u5b9e\u9a8c\u663e\u793a HiRAE-24 \u5728 ImageNet-256 \u4e0a\u5c06\u91cd\u5efa FID \u4ece 0.299 \u964d\u81f3 0.209\uff0c\u5e76\u5728\u6587\u751f\u56fe\u5bf9\u9f50\u57fa\u51c6\u4e0a\u4f18\u4e8e RAEv2\uff0c\u5fae\u8c03\u540e GenEval \u4ece 84.86 \u63d0\u5347\u5230 87.70\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.37775", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u56fe\u50cf\u751f\u6210", "\u81ea\u7f16\u7801\u5668", "\u89c6\u89c9\u8868\u5f81", "\u6587\u751f\u56fe"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2609.37775v1", "published_at": "2026-09-29", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.37775.png", "title": "HiRAE: Hierarchical Representation Autoencoding with Residual Budgets", "tldr": "\u672c\u6587\u63d0\u51fa HiRAE\uff0c\u901a\u8fc7\u5bf9\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u7684\u5168\u5c42\u7ea7\u7279\u5f81\u8fdb\u884c\u5206\u7ec4\u878d\u5408\uff0c\u5e76\u7528\u6b8b\u5dee\u9884\u7b97\u7ea6\u675f\u6d45\u5c42\u7ec6\u8282\u4fee\u6b63\uff0c\u5728\u63d0\u5347\u91cd\u5efa\u7ec6\u8282\u7684\u540c\u65f6\u4fdd\u6301\u6f5c\u53d8\u91cf\u6613\u4e8e\u751f\u6210\u5efa\u6a21\u3002\u5b9e\u9a8c\u663e\u793a HiRAE-24 \u5728 ImageNet-256 \u4e0a\u5c06\u91cd\u5efa FID \u4ece 0.299 \u964d\u81f3 0
