const PAPERS = [{"abstract": "An agent can complete a task while exhibiting undesirable behavior during execution. Developers need tests for the specific behaviors encountered in deployment, beyond fixed benchmark suites. We present TraceDance, an agent system that constructs targeted benchmarks from deployment traces for user-specified undesirable behaviors. For efficient construction, Anchor-and-Confirm combines programmable retrieval with candidate-level confirmation by a Flash large language model (LLM), while the Anchor Synthesis Loop generates and revises specifications for custom behaviors. The benchmarks use decision-point continuation to evaluate an LLM\u0027s next turn at a recorded decision point with a behavior-specific rubric, without a reference answer or environment replay. Experiments in coding and general tool use draw on 252,557 sessions and produce 107 benchmarks with 4,125 instances, fulfilling 95.3% of build-target requests. Both human annotators confirm the requested behavior in 84% of sampled instances, and the automated grader\u0027s agreement with human pass/fail judgments is comparable to that between the annotators. Nine frontier LLMs achieve a mean pass rate of only 26.7%, showing that they still struggle to respond appropriately at the evaluated decision points. Analysis across behavior-specific benchmarks further reveals weaknesses in how current LLMs behave as agents. By turning deployment problems into targeted benchmarks, TraceDance could serve as a key component of the recursive self-improvement (RSI) loop.", "arxiv_id": "2609.33295", "arxiv_url": "https://arxiv.org/abs/2609.33295", "authors": ["Dehai Min", "Daoan Zhang", "Yiming Zeng", "Huayi Zhang", "Ziyi Chen", "Yan Zhang", "Qinbo Bai", "Mengyuan Chao", "Jing Ning", "Qiyue Hua", "Huiyi Chen", "Hanrong Zhang", "Henry Peng Zou", "Jie Yang", "Wei Xu", "Philip S. Yu"], "brief": "TraceDance \u662f\u4e00\u4e2a\u4ece\u771f\u5b9e\u667a\u80fd\u4f53\u90e8\u7f72\u65e5\u5fd7\u4e2d\u81ea\u52a a\u52a8\u751f\u6210\u667a\u80fd\u4f53\u884c\u4e3a\u57fa\u51c6", "upvotes": 60, "what_it_is": "TraceDance \u662f\u4e00\u4e2a\u4ece\u771f\u5b9e\u667a\u80fd\u4f53\u90e8\u7f72\u65e5\u5fd7\u4e2d\u81ea\u52a8\u6784\u5efa\u5b9a\u5411\u884c\u4e3a\u8bc4\u6d4b\u57fa\u51c6\u7684\u7cfb\u7edf\uff0c\u9762\u5411\u7528\u6237\u6307\u5b9a\u7684\u4e0d\u826f\u884c\u4e3a\u751f\u6210\u53ef\u6d4b\u8bd5\u5b9e\u4f8b\u3002\u5b83\u901a\u8fc7\u8bb0\u5f55\u4e2d\u7684\u51b3\u7b56\u70b9\u7eed\u5199\u6765\u8bc4\u4f30\u6a21\u578b\u4e0b\u4e00\u6b65\u884c\u4e3a\uff0c\u65e0\u9700\u6807\u51c6\u7b54\u6848\u6216\u73af\u5883\u91cd\u653e\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u771f\u5b9e\u90e8\u7f72\u4e2d\u66b4\u9732\u7684\u667a\u80fd\u4f53\u95ee\u9898\u8f6c\u5316\u4e3a\u53ef\u590d\u73b0\u3001\u53ef\u6269\u5c55\u7684\u5b9a\u5411\u8bc4\u6d4b\u57fa\u51c6\uff0c\u6709\u52a9\u4e8e\u53d1\u73b0\u56fa\u5b9a benchmark \u8986\u76d6\u4e0d\u5230\u7684\u884c\u4e3a\u7f3a\u9677\uff0c\u5e76\u53ef\u4f5c\u4e3a\u667a\u80fd\u4f53\u9012\u5f52\u6539\u8fdb\u95ed\u73af\u7684\u91cd\u8981\u7ec4\u4ef6\u3002"}, {"abstract": "FullAttn often assigns negligible normalized mass to much of the causal score space, yet dense kernels execute the complete post-score path after forming each QK tile. We introduce MALA, a fused attention primitive that preserves score access to every legal causal interaction and uses normalized contribution to allocate post-score computation. Forward uses its evolving online-softmax normalizer, while backward reuses the finalized normalizer to derive nested retained support using only standard attention state. A common tolerance governs training and inference, allowing for adaptive retention of the work. MALA reduces low-contribution post-score computation. A matched-work study at 8K isolates the benefit of distribution-adaptive allocation: under exactly matched total post-score work, MALA approaches a per-instance reference-mass oracle, with mean omitted mass of 0.0188% versus 0.0182%. Across context lengths from 1K to 32K tokens, the same tolerance maintains low output and gradient errors relative to the reference. Across a broader controlled associative-recall comparison, MALA closely tracks FullAttn as context grows, reaching 89.67% accuracy at 8K compared with 89.97% for FullAttn. In an attention-operator benchmark at 128K tokens with tensor parallelism, MALA reduces forward and backward latency during training by 2.2x and 3.0x and decoding latency during inference by 1.6x relative to FullAttn. Across scaling-law training from 0.6B to 14B parameters, MALA closely tracks FullAttn in perplexity while reducing total training FLOPs. The resulting 14B models and 32B models from separate continued training achieve comparable knowledge, reasoning, and long-context retrieval scores to FullAttn. These results indicate that allocating post-score computation according to normalized attention contributions can retain the evaluated capabilities of FullAttn while reducing attention computation.", "arxiv_id": "2609.32712", "arxiv_url": "https://arxiv.org/abs/2609.32712", "authors": ["Jingze Shi", "Zhangyang Peng", "Xianduo Li", "Yanlin Qi", "Xiaotian Lin", "Haoxian Chen", "Liangdong Wang", "Guang Liu", "Yuyu Luo"], "brief": "\u8bba\u6587\u63d0\u51fa MALA\uff08MassAlloc Attention\uff09\uff0c\u4e00\u79cd\u878d\u5408\u6ce8\u610f\u529b\u7b97\u5b50\uff1a\u4ecd\u8bbf\u95ee\u6240\u6709\u5408\u6cd5\u56e0\u679c QK \u5206\u6570\uff0c\u4f46\u6839\u636e\u5f52\u4e00\u5316\u6ce8\u610f\u529b\u8d21\u732e\u52a8\u6001\u4fdd\u7559\u540e\u7eed\u8ba1\u7b97\u3002\u5b83\u7528\u7edf\u4e00\u5bb9\u5dee\u540c\u65f6\u63a7\u5236\u8bad\u7ec3\u4e0e\u63a8\u7406\u4e2d\u7684\u8ba1\u7b97\u4fdd\u7559\uff0c\u4ece\u800c\u51cf\u5c11\u4f4e\u8d21\u732e attention \u7684\u5f00\u9500\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": "https://github.com/HKUSTDial/flash-sparse-attention", "github_stars": 763, "hf_url": "https://huggingface.co/papers/2609.32712", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u524d\u5411\u5229\u7528\u5728\u7ebf softmax \u5f52\u4e00\u5316\u5668\u52a8\u6001\u5224\u65ad\u4fdd\u7559\u652f\u6301\u96c6\uff0c\u53cd\u5411\u590d\u7528\u6700\u7ec8\u5f52\u4e00\u5316\u5668\uff0c\u65e0\u9700\u989d\u5916\u975e\u6807\u51c6 attention \u72b6\u6001\u3002", "\u5728 8K matched-work \u5b9e\u9a8c\u4e2d\uff0cMALA \u7684\u5e73\u5747\u9057\u6f0f\u8d28\u91cf\u4e3a 0.0188%\uff0c\u63a5\u8fd1\u9010\u6837\u672c oracle \u7684 0.0182%\u3002", "\u5728 128K token attention benchmark \u4e2d\uff0c\u76f8\u6bd4 FullAttn\uff0c\u8bad\u7ec3\u524d\u5411/\u53cd\u5411\u5ef6\u8fdf\u5206\u522b\u964d\u4f4e 2.2x/3.0x\uff0c\u63a8\u7406\u89e3\u7801\u5ef6\u8fdf\u964d\u4f4e 1.6x\u3002"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u957f\u4e0a\u4e0b\u6587", "\u9ad8\u6548\u63a8\u7406", "\u5927\u6a21\u578b\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "Beijing Academy of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.32712v1", "published_at": "2026-09-26", "score": 0.573, "selected_reasons": ["\u77e5\u540d\u673a\u6784: BAAI", "HF trending (64\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32712.png", "title": "MassAlloc Attention: Let Attention Allocate Its Own Compute", "tldr": "\u8ba9\u6ce8\u610f\u529b\u6309\u8d21\u732e\u81ea\u9002\u5e94\u5206\u914d\u8ba1\u7b97", "upvotes": 64, "what_it_is": "\u8bba\u6587\u63d0\u51fa MALA\uff08MassAlloc Attention\uff09\uff0c\u4e00\u79cd\u878d\u5408\u6ce8\u610f\u529b\u7b97\u5b50\uff1a\u4ecd\u8bbf\u95ee\u6240\u6709\u5408\u6cd5\u56e0\u679c QK \u5206\u6570\uff0c\u4f46\u6839\u636e\u5f52\u4e00\u5316\u6ce8\u610f\u529b\u8d21\u732e\u52a8\u6001\u4fdd\u7559\u540e\u7eed\u8ba1\u7b97\u3002\u5b83\u7528\u7edf\u4e00\u5bb9\u5dee\u540c\u65f6\u63a7\u5236\u8bad\u7ec3\u4e0e\u63a8\u7406\u4e2d\u7684\u8ba1\u7b97\u4fdd\u7559\uff0c\u4ece\u800c\u51cf\u5c11\u4f4e\u8d21\u732e attention \u7684\u5f00\u9500\u3002", "why_notable": "MALA \u5728\u5c3d\u91cf\u4fdd\u6301 Full Attention \u80fd\u529b\u548c\u7cbe\u5ea6\u7684\u540c\u65f6\uff0c\u81ea\u9002\u5e94\u524a\u51cf\u4f4e\u8d21\u732e\u540e\u5904\u7406\u8ba1\u7b97\uff0c\u517c\u987e\u957f\u4e0a\u4e0b\u6587\u6548\u7387\u3001\u8bad\u7ec3\u53ef\u7528\u6027\u548c\u5927\u6a21\u578b\u6269\u5c55\u6027\uff1b\u4ece 0.6B \u5230 14B \u8bad\u7ec3\u3001\u4ee5\u53ca 14B/32B \u7ee7\u7eed\u8bad\u7ec3\u7ed3\u679c\u90fd\u663e\u793a\u5176\u56f0\u60d1\u5ea6\u548c\u4e0b\u6e38\u80fd\u529b\u63a5\u8fd1 FullAttn\u3002"}, {"abstract": "Most modern multimodal large language models (MLLMs) build on a pretrained visual encoder that provides a strong visual prior. Encoder-free MLLMs instead learn visual representations directly from raw pixels, offering a simple and unified architecture, but their scaling behavior has not been systematically characterized. To fill this gap, we compare scaling laws for encoder-free and encoder-based MLLMs and report three main findings: (1) Removing the visual encoder shifts the compute-optimal allocation for the multimodal objective toward larger models, while leaving that for text nearly unchanged. (2) The two architectures exhibit nearly overlapping loss--compute frontiers on the text objective, but diverge on the multimodal objective: encoder-free models underperform at small scales yet are predicted to catch up at around $10^{22}$ FLOPs, well within practical pretraining budgets. (3) Without a visual encoder, the language model learns to take over its role via vision-specific adaptation: bidirectional interactions among visual tokens become increasingly beneficial as training compute grows, visual processing shifts toward earlier layers, and expert routing for visual tokens becomes more concentrated. Overall, our results indicate that the advantage of the visual prior provided by a pretrained encoder diminishes with scale, positioning encoder-free architectures as a promising direction for multimodal pretraining.", "arxiv_id": "2609.35457", "arxiv_url": "https://arxiv.org/abs/2609.35457", "authors": ["Lin Chen", "Bolin Ni", "Qi Yang", "Lan Jiang", "Kun Ding", "Xiaoran Fan", "Hower Yang", "Ying Wang", "Shiming Xiang"], "brief": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u65e0\u89c6\u89c9\u7f16\u7801\u5668\u4e0e\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u9884\u8bad\u7ec3\u7f29\u653e\u89c4\u5f8b\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u65e0\u7f16\u7801\u5668\u67b6\u6784\u5c0f\u89c4\u6a21\u8f83\u5f31\uff0c\u4f46\u5728\u7ea610^22 FLOPs\u9644\u8fd1\u6709\u671b\u5728\u591a\u6a21\u6001\u76ee\u6807\u4e0a\u8ffd\u5e73\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.35457", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u79fb\u9664\u89c6\u89c9\u7f16\u7801\u5668\u4f1a\u4f7f\u591a\u6a21\u6001\u76ee\u6807\u7684\u6700\u4f18\u7b97\u529b\u5206\u914d\u504f\u5411\u66f4\u5927\u6a21\u578b\uff0c\u4f46\u5bf9\u6587\u672c\u76ee\u6807\u5f71\u54cd\u5f88\u5c0f", "\u4e24\u7c7b\u67b6\u6784\u5728\u6587\u672c\u635f\u5931-\u7b97\u529b\u524d\u6cbf\u51e0\u4e4e\u91cd\u5408\uff0c\u4f46\u591a\u6a21\u6001\u76ee\u6807\u4e0a\u65e0\u7f16\u7801\u5668\u6a21\u578b\u5c0f\u89c4\u6a21\u843d\u540e\u3001\u968f\u89c4\u6a21\u7f29\u5c0f\u5dee\u8ddd", "\u65e0\u7f16\u7801\u5668\u6a21\u578b\u4f1a\u9010\u6e10\u5728\u8bed\u8a00\u6a21\u578b\u5185\u90e8\u5b66\u4e60\u89c6\u89c9\u5904\u7406\u80fd\u529b\uff0c\u5305\u62ec\u66f4\u5f3a\u89c6\u89c9token\u53cc\u5411\u4ea4\u4e92\u3001\u66f4\u65e9\u5c42\u89c6\u89c9\u5904\u7406\u548c\u66f4\u96c6\u4e2d\u7684\u89c6\u89c9\u4e13\u5bb6\u8def\u7531"], "keywords": ["\u591a\u6a21\u6001", "\u7f29\u653e\u89c4\u5f8b", "\u89c6\u89c9\u7f16\u7801\u5668", "\u9884\u8bad\u7ec3"], "num_comments": 2, "on_hf": true, "organization": "Tencent Hunyuan", "pdf_url": "https://arxiv.org/pdf/2609.35457v1", "published_at": "2026-09-28", "score": 0.536, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (54\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35457.png", "title": "How Far Are We from Removing the Visual Encoder? Scaling Laws for Encoder-Free Multimodal Pretraining", "tldr": "\u65e0\u89c6\u89c9\u7f16\u7801\u5668MLLM\u6709\u671b\u968f\u89c4\u6a21\u8ffd\u5e73\u4f20\u7edf\u67b6\u6784", "upvotes": 54, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u6bd4\u8f83\u4e86\u65e0\u89c6\u89c9\u7f16\u7801\u5668\u4e0e\u57fa\u4e8e\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u9884\u8bad\u7ec3\u7f29\u653e\u89c4\u5f8b\u3002\u7814\u7a76\u53d1\u73b0\uff0c\u65e0\u7f16\u7801\u5668\u67b6\u6784\u5c0f\u89c4\u6a21\u8f83\u5f31\uff0c\u4f46\u5728\u7ea610^22 FLOPs\u9644\u8fd1\u6709\u671b\u5728\u591a\u6a21\u6001\u76ee\u6807\u4e0a\u8ffd\u5e73\u3002", "why_notable": "\u8be5\u7814\u7a76\u4e3a\u662f\u5426\u53ef\u4ee5\u53bb\u6389\u9884\u8bad\u7ec3\u89c6\u89c9\u7f16\u7801\u5668\u63d0\u4f9b\u4e86\u7f29\u653e\u89c4\u5f8b\u8bc1\u636e\uff0c\u8868\u660e\u89c6\u89c9\u5148\u9a8c\u4f18\u52bf\u4f1a\u968f\u89c4\u6a21\u51cf\u5f31\uff0c\u652f\u6301\u66f4\u7edf\u4e00\u3001\u66f4\u7b80\u5355\u7684\u7aef\u5230\u7aef\u591a\u6a21\u6001\u9884\u8bad\u7ec3\u67b6\u6784\u3002"}, {"abstract": "Looped transformers have demonstrated promising parameter efficiency by reusing layers for latent computation. Prior studies compare looped and non-looped models at matched parameters or per-token FLOPs. However, to the best of our knowledge, whether looping improves test-time scaling as outputs grow longer remains underexplored. Through post-training looped transformers, we study the accuracy-compute slope, measured as the accuracy gain per doubling of test-time decoding FLOPs. We find that existing looped transformers often yield steeper slopes than their non-looped baseline, yet underperform it at matched compute. While fixed-depth looping spends extra iterations on every token, our analysis shows that many tokens do not benefit from extra iterations. We therefore propose TaH2, which enables the model to focus extra iterations on the tokens that benefit from looping. It jointly post-trains the backbone and an iteration decider through lookahead depth supervision, which uses online labels indicating whether further iteration improves the prediction. TaH2 improves both the efficiency and attainable accuracy of test-time scaling. On challenging AIME benchmarks, TaH2 improves the accuracy-compute slope by 53% (2.74 vs. 1.79) over the non-looped baseline, exceeding the baseline\u0027s peak accuracy by about 3.4 points at matched test-time compute. As the maximum iteration depth increases, existing looped models largely plateau, while TaH2\u0027s gain over the non-looped baseline continues to grow from +2.8 points at depth 2 to +3.9 points at depth 8. Our code is available at https://github.com/thu-nics/TaH.", "arxiv_id": "2609.35748", "arxiv_url": "https://arxiv.org/abs/2609.35748", "authors": ["Yichen You", "Tianyu Fu", "Aosong Feng", "Xingtai Lv", "Xuefei Ning", "Ning Ding", "Yu Wang"], "brief": "\u8bba\u6587\u7814\u7a76\u5faa\u73af Transformer \u5728\u957f\u8f93\u51fa\u6d4b\u8bd5\u65f6\u6269\u5c55\u4e2d\u7684\u51c6\u786e\u7387-\u8ba1\u7b97\u91cf\u659c\u7387\uff0c\u5e76\u63d0\u51fa TaH2\uff1a\u901a\u8fc7\u540e\u8bad\u7ec3\u8ba9\u6a21\u578b\u53ea\u5728\u6709\u6536\u76ca\u7684 token \u4e0a\u6267\u884c\u989d\u5916\u5faa\u73af\u8fed\u4ee3\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": "https://github.com/thu-nics/TaH", "github_stars": 89, "hf_url": "https://huggingface.co/papers/2609.35748", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u53d1\u73b0\u73b0\u6709\u5faa\u73af Transformer \u7684\u6d4b\u8bd5\u65f6\u6269\u5c55\u659c\u7387\u5e38\u9ad8\u4e8e\u975e\u5faa\u73af\u57fa\u7ebf\uff0c\u4f46\u5728\u76f8\u540c\u8ba1\u7b97\u91cf\u4e0b\u5f80\u5f80\u4e0d\u5982\u57fa\u7ebf\u3002", "TaH2 \u8054\u5408\u8bad\u7ec3\u4e3b\u5e72\u6a21\u578b\u4e0e\u8fed\u4ee3\u51b3\u7b56\u5668\uff0c\u4f7f\u7528\u524d\u77bb\u6df1\u5ea6\u76d1\u7763\u5728\u7ebf\u6807\u6ce8\u201c\u7ee7\u7eed\u8fed\u4ee3\u662f\u5426\u80fd\u6539\u5584\u9884\u6d4b\u201d\u3002", "\u5728 AIME \u4e0a\u76f8\u8f83\u975e\u5faa\u73af\u57fa\u7ebf\u5c06\u51c6\u786e\u7387-\u8ba1\u7b97\u91cf\u659c\u7387\u63d0\u5347 53%\uff0c\u5e76\u5728\u5339\u914d\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u91cf\u4e0b\u8d85\u8fc7\u57fa\u7ebf\u5cf0\u503c\u7ea6 3.4 \u4e2a\u767e\u5206\u70b9\u3002"], "keywords": ["\u6d4b\u8bd5\u65f6\u6269\u5c55", "Transformer", "\u81ea\u9002\u5e94\u8ba1\u7b97", "\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "Tsinghua-NICS-EFC", "pdf_url": "https://arxiv.org/pdf/2609.35748v1", "published_at": "2026-09-28", "score": 0.534, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (46\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35748.png", "title": "Improving Test-Time Scaling with Adaptive Looped Transformers", "tldr": "\u81ea\u9002\u5e94\u5faa\u73af\u63d0\u5347\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u6548\u7387", "upvotes": 46, "what_it_is": "\u8bba\u6587\u7814\u7a76\u5faa\u73af Transformer \u5728\u957f\u8f93\u51fa\u6d4b\u8bd5\u65f6\u6269\u5c55\u4e2d\u7684\u51c6\u786e\u7387-\u8ba1\u7b97\u91cf\u659c\u7387\uff0c\u5e76\u63d0\u51fa TaH2\uff1a\u901a\u8fc7\u540e\u8bad\u7ec3\u8ba9\u6a21\u578b\u53ea\u5728\u6709\u6536\u76ca\u7684 token \u4e0a\u6267\u884c\u989d\u5916\u5faa\u73af\u8fed\u4ee3\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u5faa\u73af\u5c42\u590d\u7528\u4ece\u56fa\u5b9a\u989d\u5916\u8ba1\u7b97\u6539\u4e3a\u6309 token \u81ea\u9002\u5e94\u5206\u914d\uff0c\u4e3a\u63d0\u5347\u5927\u6a21\u578b\u6d4b\u8bd5\u65f6\u6269\u5c55\u6548\u7387\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\uff0c\u5c24\u5176\u9002\u5408\u6570\u5b66\u63a8\u7406\u7b49\u957f\u89e3\u7801\u9ad8\u8ba1\u7b97\u4efb\u52a1\u3002"}, {"abstract": "Few-step autoregressive video diffusion generates a long video by splitting the video into temporal chunks and generating chunk-by-chunk, each through a short sequence of denoising stages. To memorize chunks that are already generated, previous methods reconstruct a clean or less-noisy key--value (KV) cache by additional forwards to build the cache without advancing an output latent. However, every denoising forward itself already computes the in-flight KV of the current chunk. We introduce FlashForward, which directly reuses this cache to avoid the heavy cache-update-only model forwards. After the current chunk completes one denoising stage, its stage-specific cache is already available for the next chunk. Assigning one GPU to each stage therefore lets different chunks occupy different stages concurrently. This early availability has a quality cost: the resulting stage-matched history is noisy, causing appearance and motion drift among chunks. To complement it, FlashForward produces sparse auxiliary clean anchor latents before the corresponding region is generated so the generation trajectories can be stabilized by this two-sided conditioning. The two memories operate at different temporal scales: sparse clean anchor KV supplies coarse, long-range two-sided structural guidance, while dense stage-matched history preserves fine, recent evolution. With up to four GPUs, FlashForward runs $1.16$--$1.69\\times$ faster than HiAR and $1.42$--$2.92\\times$ faster than Self-Forcing for 16 FPS videos of 20 seconds or longer across 1.3B and 14B backbone scales at 480p and 720p. On VBench, for the 1.3B model at 480p, it achieves higher scores and remains stable at longer durations, demonstrating that FlashForward generates high-quality and temporally consistent videos across durations of 20s, 35s and 65s at a much faster generation speed.", "arxiv_id": "2609.32540", "arxiv_url": "https://arxiv.org/abs/2609.32540", "authors": ["Yikai Wang", "Xiao Han", "Mengmeng Xu", "Juan Camilo Perez", "Yiannis Douratsos", "Sen He", "Zijian Zhou", "Fei Zhang", "Zhaochong An", "Juan-Manuel Perez-Rua", "Chen Change Loy", "Tao Xiang"], "brief": "\u8bba\u6587\u63d0\u51fa FlashForward\uff0c\u7528\u4e8e\u5c11\u6b65\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u751f\u6210\u3002\u5b83\u76f4\u63a5\u590d\u7528\u6bcf\u4e2a\u53bb\u566a\u9636\u6bb5\u5df2\u8ba1\u7b97\u51fa\u7684 in-flight KV cache\uff0c\u5e76\u5f15\u5165\u7a00\u758f\u5e72\u51c0\u951a\u70b9 latent \u7a33\u5b9a\u8de8\u7247\u6bb5\u7684\u89c6\u9891\u5916\u89c2\u4e0e\u8fd0\u52a8\u4e00\u81f4\u6027\u3002", "categories": ["cs.CV", "cs.AI", "cs.LG", "cs.MM"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32540", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u907f\u514d\u4e3a\u66f4\u65b0\u5386\u53f2\u7f13\u5b58\u800c\u989d\u5916\u6267\u884c\u6a21\u578b\u524d\u5411\uff0c\u76f4\u63a5\u590d\u7528\u5f53\u524d\u89c6\u9891\u5757\u53bb\u566a\u8fc7\u7a0b\u4e2d\u4ea7\u751f\u7684\u9636\u6bb5\u5339\u914d KV cache\u3002", "\u91c7\u7528\u591a GPU \u6d41\u6c34\u7ebf\uff1a\u6bcf\u4e2a GPU \u5bf9\u5e94\u4e00\u4e2a\u53bb\u566a\u9636\u6bb5\uff0c\u4f7f\u4e0d\u540c\u89c6\u9891\u5757\u53ef\u5e76\u884c\u5904\u4e8e\u4e0d\u540c\u751f\u6210\u9636\u6bb5\u3002", "\u901a\u8fc7\u7a00\u758f clean anchor KV \u63d0\u4f9b\u957f\u7a0b\u7ed3\u6784\u5f15\u5bfc\uff0c\u7ed3\u5408\u5bc6\u96c6\u9636\u6bb5\u5339\u914d\u5386\u53f2\u7f13\u5b58\u4fdd\u7559\u8fd1\u671f\u7ec6\u8282\u6f14\u5316\uff0c\u7f13\u89e3\u566a\u58f0\u5386\u53f2\u5bfc\u81f4\u7684\u6f02\u79fb\u3002"], "keywords": ["\u89c6\u9891\u751f\u6210", "\u6269\u6563\u6a21\u578b", "KV\u7f13\u5b58", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "Meta", "pdf_url": "https://arxiv.org/pdf/2609.32540v1", "published_at": "2026-09-26", "score": 0.534, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Meta", "HF trending (20\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32540.png", "title": "In-Flight KV Cache with Clean Anchors for Faster Autoregressive Video Diffusion", "tldr": "\u7528\u98de\u884c\u4e2dKV\u7f13\u5b58\u52a0\u901f\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563", "upvotes": 20, "what_it_is": "\u8bba\u6587\u63d0\u51fa FlashForward\uff0c\u7528\u4e8e\u5c11\u6b65\u81ea\u56de\u5f52\u89c6\u9891\u6269\u6563\u751f\u6210\u3002\u5b83\u76f4\u63a5\u590d\u7528\u6bcf\u4e2a\u53bb\u566a\u9636\u6bb5\u5df2\u8ba1\u7b97\u51fa\u7684 in-flight KV cache\uff0c\u5e76\u5f15\u5165\u7a00\u758f\u5e72\u51c0\u951a\u70b9 latent \u7a33\u5b9a\u8de8\u7247\u6bb5\u7684\u89c6\u9891\u5916\u89c2\u4e0e\u8fd0\u52a8\u4e00\u81f4\u6027\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u5728\u4e0d\u727a\u7272\u751a\u81f3\u63d0\u5347\u8d28\u91cf\u7684\u524d\u63d0\u4e0b\u663e\u8457\u964d\u4f4e\u957f\u89c6\u9891\u751f\u6210\u5f00\u9500\uff0c\u5728 20 \u79d2\u4ee5\u4e0a\u3001480p/720p\u30011.3B \u4e0e 14B \u6a21\u578b\u4e0a\u76f8\u5bf9 HiAR \u548c Self-Forcing \u83b7\u5f97\u6700\u9ad8\u7ea6 2.92 \u500d\u52a0\u901f\uff0c\u5e76\u5728 VBench \u4e0a\u4fdd\u6301\u66f4\u597d\u7684\u957f\u65f6\u7a33\u5b9a\u6027\u3002"}, {"abstract": "Large language model (LLM) agents increasingly undertake extreme-long (xlong) horizon tasks, where a single execution can span hours, hundreds of model--environment interactions, and nearly 1M tokens per rollout. Applying online reinforcement learning (RL) to such executions poses two fundamental challenges: (1) severe execution variance and prolonged rollout delays cause massive GPU idling; and (2) complex non-linear branching generates massive trajectory redundancy, crippling training efficiency. To address these, we presents QwenGyre, an end-to-end framework for xlong-horizon online RL. QwenGyre elastically reallocates GPUs between rollout and training without interrupting live executions, while its trajectory processor reconstructs branching histories, scores partial progress, and deduplicates redundant paths to bound training costs. Scaled to our flagship model, Qwen~3.8 2.4T, with 700K tokens per rollout, QwenGyre yields a 6.0% absolute gain on NL2RepoBench (52.5% $\\to$ 58.5%) in 48 steps. Across our evaluations on diverse domains of training datasets, QwenGyre delivers up to $1.85\\times$ and $1.78\\times$ speedups over Colocate and Async, respectively.", "arxiv_id": "2609.33848", "arxiv_url": "https://arxiv.org/abs/2609.33848", "authors": ["Weiqi Wang", "Yuxin Zhou", "Mouxiang Chen", "Siyuan Zhang", "Yi Zhang", "Yuyan Luo", "Zhiyu Yin", "Chencan Wu", "Jiemin Jiang", "Wentao Yao", "Chujie Zheng", "JianWei Zhang"], "brief": "\u8bba\u6587\u63d0\u51fa QwenGyre\uff0c\u4e00\u4e2a\u7aef\u5230\u7aef\u7684\u8d85\u957f\u7a0b\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u8bad\u7ec3\u5355\u6b21\u6267\u884c\u53ef\u8fbe\u6570\u5c0f\u65f6\u3001\u6570\u767e\u8f6e\u4ea4\u4e92\u3001\u8fd1\u767e\u4e07 token \u7684 LLM \u667a\u80fd\u4f53\u3002\u5b83\u901a\u8fc7\u5f39\u6027\u8c03\u5ea6 GPU \u4e0e\u8f68\u8ff9\u5904\u7406\u673a\u5236\uff0c\u7f13\u89e3\u957f rollout \u5e26\u6765\u7684\u8d44\u6e90\u7a7a\u8f6c\u548c\u5206\u652f\u8f68\u8ff9\u5197\u4f59\u95ee\u9898\u3002", "categories": ["cs.LG", "cs.DC"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33848", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u53ef\u5728\u4e0d\u4e2d\u65ad\u6b63\u5728\u6267\u884c\u4efb\u52a1\u7684\u60c5\u51b5\u4e0b\uff0c\u5728 rollout \u4e0e\u8bad\u7ec3\u4e4b\u95f4\u5f39\u6027\u91cd\u5206\u914d GPU\uff0c\u51cf\u5c11\u56e0\u6267\u884c\u65f6\u957f\u5dee\u5f02\u5bfc\u81f4\u7684 GPU \u7a7a\u95f2\u3002", "\u8f68\u8ff9\u5904\u7406\u5668\u91cd\u5efa\u590d\u6742\u5206\u652f\u5386\u53f2\uff0c\u5bf9\u90e8\u5206\u8fdb\u5c55\u6253\u5206\uff0c\u5e76\u53bb\u91cd\u5197\u4f59\u8def\u5f84\uff0c\u4ece\u800c\u63a7\u5236\u8bad\u7ec3\u6210\u672c\u3002", "\u5728 Qwen 3.8 2.4T \u4e0a\u4ee5\u6bcf\u6b21 rollout 70 \u4e07 token \u89c4\u6a21\u8bad\u7ec3\uff0cNL2RepoBench \u4ece 52.5% \u63d0\u5347\u5230 58.5%\uff0c\u5e76\u76f8\u5bf9 Colocate \u4e0e Async \u5206\u522b\u6700\u9ad8\u52a0\u901f 1.85 \u500d\u548c 1.78 \u500d\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5206\u5e03\u5f0f\u8bad\u7ec3", "\u957f\u4e0a\u4e0b\u6587"], "num_comments": 1, "on_hf": true, "organization": "Qwen", "pdf_url": "https://arxiv.org/pdf/2609.33848v1", "published_at": "2026-09-27", "score": 0.529, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (27\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33848.png", "title": "QwenGyre: An Elastic Reinforcement Learning Framework for Training xLong-Horizon Agents", "tldr": "\u9762\u5411\u8d85\u957f\u7a0b\u667a\u80fd\u4f53\u7684\u5f39\u6027\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6", "upvotes": 27, "what_it_is": "\u8bba\u6587\u63d0\u51fa QwenGyre\uff0c\u4e00\u4e2a\u7aef\u5230\u7aef\u7684\u8d85\u957f\u7a0b\u5728\u7ebf\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u7528\u4e8e\u8bad\u7ec3\u5355\u6b21\u6267\u884c\u53ef\u8fbe\u6570\u5c0f\u65f6\u3001\u6570\u767e\u8f6e\u4ea4\u4e92\u3001\u8fd1\u767e\u4e07 token \u7684 LLM \u667a\u80fd\u4f53\u3002\u5b83\u901a\u8fc7\u5f39\u6027\u8c03\u5ea6 GPU \u4e0e\u8f68\u8ff9\u5904\u7406\u673a\u5236\uff0c\u7f13\u89e3\u957f rollout \u5e26\u6765\u7684\u8d44\u6e90\u7a7a\u8f6c\u548c\u5206\u652f\u8f68\u8ff9\u5197\u4f59\u95ee\u9898\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u76f4\u63a5\u9762\u5411\u8d85\u957f\u7a0b LLM \u667a\u80fd\u4f53\u8bad\u7ec3\u4e2d\u7684\u7cfb\u7edf\u74f6\u9888\uff0c\u628a\u5f3a\u5316\u5b66\u4e60\u7b97\u6cd5\u9700\u6c42\u4e0e\u5206\u5e03\u5f0f\u8d44\u6e90\u8c03\u5ea6\u3001\u8f68\u8ff9\u538b\u7f29\u7ed3\u5408\u8d77\u6765\uff0c\u63d0\u5347\u4e86\u5927\u89c4\u6a21\u5728\u7ebf RL \u8bad\u7ec3\u7684\u53ef\u884c\u6027\u548c\u6548\u7387\u3002"}, {"abstract": "Verified solutions are not equally useful for preparing reasoning models for reinforcement learning (RL). We present a comprehensive study of route diversity, the variation in the sequences of reasoning steps in supervised fine-tuning (SFT) data, and propose a lightweight, rule-based fingerprint to select for it. From one pool at one budget, with matched training recipes and checkpoints, selecting diverse rather than similar routes improves post-RL problem coverage across puzzles and mathematics, including on problems harder than those seen in either training stage. In synthetic experiments, route-diverse SFT improves OLMo3-7B\u0027s pass@8 by 16.9 points on environments held out from SFT. In a single-model condition, where one model writes every candidate, diverse selection gains up to 6.2 points of mean pass@8 across 10 mathematics benchmarks. Pre-RL diagnostics suggest why: diverse SFT can produce both successful and failed attempts on more prompts despite slightly lower mean accuracy, giving group-relative RL more prompts with a learning signal. On 3 open-source corpora, our CPU-only selector, without model calls, outperforms more expensive alternatives in every comparison of mean post-RL performance. These results identify reasoning-route diversity as a practical criterion for selecting SFT data that better prepares models for RL.", "arxiv_id": "2609.33780", "arxiv_url": "https://arxiv.org/abs/2609.33780", "authors": ["Dylan Zhang", "Mingyuan Wu", "Jinning Li"], "brief": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86SFT\u6570\u636e\u4e2d\u201c\u63a8\u7406\u8def\u5f84\u591a\u6837\u6027\u201d\u5bf9\u540e\u7eed\u5f3a\u5316\u5b66\u4e60\u7684\u5f71\u54cd\uff0c\u5e76\u63d0\u51fa\u4e00\u79cd\u8f7b\u91cf\u7ea7\u3001\u57fa\u4e8e\u89c4\u5219\u7684\u6307\u7eb9\u65b9\u6cd5\u6765\u7b5b\u9009\u591a\u6837\u5316\u89e3\u9898\u8f68\u8ff9\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u76f8\u6bd4\u9009\u62e9\u76f8\u4f3c\u89e3\u6cd5\uff0c\u9009\u62e9\u8def\u5f84\u66f4\u591a\u6837\u7684SFT\u6837\u672c\u80fd\u8ba9\u6a21\u578b\u5728\u6570\u5b66\u4e0e\u8c1c\u9898\u4efb\u52a1\u4e0a\u83b7\u5f97\u66f4\u597d\u7684RL\u540e\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.33780", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5728\u5408\u6210\u5b9e\u9a8c\u4e2d\uff0c\u8def\u5f84\u591a\u6837\u7684SFT\u4f7fOLMo3-7B\u5728SFT\u672a\u89c1\u73af\u5883\u4e0a\u7684pass@8\u63d0\u534716.9\u4e2a\u767e\u5206\u70b9\u3002", "\u5728\u5355\u6a21\u578b\u751f\u6210\u5019\u9009\u8f68\u8ff9\u7684\u8bbe\u7f6e\u4e0b\uff0c\u591a\u6837\u6027\u7b5b\u9009\u572810\u4e2a\u6570\u5b66\u57fa\u51c6\u4e0a\u5e26\u6765\u6700\u9ad86.2\u4e2a\u767e\u5206\u70b9\u7684\u5e73\u5747pass@8\u589e\u76ca\u3002", "\u6240\u63d0\u51fa\u7684CPU-only\u89c4\u5219\u9009\u62e9\u5668\u65e0\u9700\u6a21\u578b\u8c03\u7528\uff0c\u57283\u4e2a\u5f00\u6e90\u8bed\u6599\u4e0a\u540eRL\u5e73\u5747\u8868\u73b0\u5747\u4f18\u4e8e\u66f4\u6602\u8d35\u7684\u7b5b\u9009\u66ff\u4ee3\u65b9\u6848\u3002"], "keywords": ["\u76d1\u7763\u5fae\u8c03", "\u5f3a\u5316\u5b66\u4e60", "\u63a8\u7406\u6a21\u578b", "\u6570\u636e\u7b5b\u9009"], "num_comments": 1, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2609.33780v1", "published_at": "2026-09-27", "score": 0.527, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.33780.png", "title": "Selecting Diverse SFT Traces Improves Post-RL Generalization", "tldr": "\u591a\u6837\u5316SFT\u63a8\u7406\u8def\u5f84\u53ef\u63d0\u5347RL\u6cdb\u5316", "upvotes": 15, "what_it_is": "\u8bba\u6587\u7cfb\u7edf\u7814\u7a76\u4e86SFT\u6570\u636e\u4e2d\u201c\u63a8\u7406\u8def\u5f84\u591a\u6837\u6027\u201d\u5bf9\u540e\u7eed\u5f3a\u5316\u5b66\u4e60\u7684\u5f71\u54cd\uff0c\u5e76\u63d0\u51fa\u4e00\u79cd\u8f7b\u91cf\u7ea7\u3001\u57fa\u4e8e\u89c4\u5219\u7684\u6307\u7eb9\u65b9\u6cd5\u6765\u7b5b\u9009\u591a\u6837\u5316\u89e3\u9898\u8f68\u8ff9\u3002\u5b9e\u9a8c\u8868\u660e\uff0c\u76f8\u6bd4\u9009\u62e9\u76f8\u4f3c\u89e3\u6cd5\uff0c\u9009\u62e9\u8def\u5f84\u66f4\u591a\u6837\u7684SFT\u6837\u672c\u80fd\u8ba9\u6a21\u578b\u5728\u6570\u5b66\u4e0e\u8c1c\u9898\u4efb\u52a1\u4e0a\u83b7\u5f97\u66f4\u597d\u7684RL\u540e\u6cdb\u5316\u80fd\u529b\u3002", "why_notable": "\u8be5\u7814\u7a76\u6307\u51fa\uff0cSFT\u9636\u6bb5\u4e0d\u5e94\u53ea\u8ffd\u6c42\u7b54\u6848\u6b63\u786e\u6216\u5e73\u5747\u51c6\u786e\u7387\uff0c\u66f4\u5e94\u5173\u6ce8\u63a8\u7406\u8def\u5f84\u8986\u76d6\u5ea6\uff1b\u591a\u6837\u5316\u8f68\u8ff9\u80fd\u4e3agroup-relative RL\u63d0\u4f9b\u66f4\u591a\u5e26\u5b66\u4e60\u4fe1\u53f7\u7684\u63d0\u793a\uff0c\u4ece\u800c\u63d0\u5347\u6a21\u578b\u5728\u66f4\u96be\u3001\u672a\u89c1\u95ee\u9898\u4e0a\u7684\u6cdb\u5316\u80fd\u529b\uff0c\u5177\u6709\u76f4\u63a5\u7684\u6570\u636e\u7b5b\u9009\u5b9e\u8df5\u4ef7\u503c\u3002"}, {"abstract": "FullAttn repeatedly exposes the complete causal history to every attention head, creating substantial redundant computation and memory traffic even with IO-efficient dense kernels. We introduce CoWA, a structured attention architecture that distributes access to the causal history across KV heads. All heads share near-diagonal and prefix-sink windows, while complementary long-range windows partition the remaining history. Their union provides full causal coverage although each head attends sparsely to distant tokens. This position-defined attention pattern requires no learned router or indexer, is used consistently during training and inference, and aligns with KV-head tensor parallelism. A window-matched ablation at 8K isolates the effect of complementary long-range allocation: CoWA with 100% collective coverage reaches 89.73% accuracy, compared with 89.97% for FullAttn, while duplicated long-range windows perform substantially worse. Across a broader controlled associative-recall comparison with matched token budgets, CoWA closely tracks FullAttn as the context grows, whereas other sparse patterns lose a substantial fraction of the associations. In an attention-operator benchmark at 128K tokens with tensor parallelism, CoWA reduces forward and backward latency during training by 7.4x and 8.6x and decoding latency during inference by 3.0x over FullAttn. Its per-rank peak operator memory matches FullAttn during training and is 7.6x lower during decoding. Across scaling-law training from 0.6B to 14B parameters, CoWA closely tracks FullAttn in perplexity while reducing total training FLOPs. The resulting 14B models and 32B models from separate continued training achieve comparable knowledge, reasoning, and long-context retrieval scores to FullAttn. These results show that full causal coverage can be a collective property of the head ensemble rather than a duplicated property of every head.", "arxiv_id": "2609.32704", "arxiv_url": "https://arxiv.org/abs/2609.32704", "authors": ["Jingze Shi", "Zhangyang Peng", "Xianduo Li", "Yanlin Qi", "Xiaotian Lin", "Haoxian Chen", "Liangdong Wang", "Guang Liu", "Yuyu Luo"], "brief": "\u8bba\u6587\u63d0\u51fa CoWindow Attention\uff08CoWA\uff09\uff0c\u4e00\u79cd\u7ed3\u6784\u5316\u56e0\u679c\u6ce8\u610f\u529b\u673a\u5236\uff1a\u6bcf\u4e2a KV head \u53ea\u7a00\u758f\u5173\u6ce8\u8fdc\u8ddd\u79bb token\uff0c\u4f46\u591a\u4e2a head \u7684\u7a97\u53e3\u4e92\u8865\u540e\u5171\u540c\u8986\u76d6\u5b8c\u6574\u56e0\u679c\u5386\u53f2\u3002\u5b83\u65e0\u9700\u8def\u7531\u5668\u6216\u7d22\u5f15\u5668\uff0c\u8bad\u7ec3\u4e0e\u63a8\u7406\u4f7f\u7528\u540c\u4e00\u56fa\u5b9a\u4f4d\u7f6e\u6a21\u5f0f\uff0c\u5e76\u9002\u914d KV-head \u5f20\u91cf\u5e76\u884c\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32704", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6240\u6709 head \u5171\u4eab\u8fd1\u5bf9\u89d2\u7a97\u53e3\u548c prefix-sink \u7a97\u53e3\uff0c\u8fdc\u7a0b\u5386\u53f2\u5219\u7531\u4e92\u8865\u957f\u7a0b\u7a97\u53e3\u5728\u4e0d\u540c head \u95f4\u5206\u533a\uff0c\u5f62\u6210\u201c\u96c6\u4f53\u5168\u8986\u76d6\u201d\u3002", "\u5728 8K associative recall \u6d88\u878d\u4e2d\uff0cCoWA 100% \u96c6\u4f53\u8986\u76d6\u8fbe\u5230 89.73% \u51c6\u786e\u7387\uff0c\u63a5\u8fd1 FullAttn \u7684 89.97%\uff0c\u660e\u663e\u4f18\u4e8e\u91cd\u590d\u957f\u7a0b\u7a97\u53e3\u3002", "\u5728 128K token \u6ce8\u610f\u529b\u7b97\u5b50\u57fa\u51c6\u4e2d\uff0c\u76f8\u6bd4 FullAttn\uff0c\u8bad\u7ec3\u524d\u5411/\u53cd\u5411\u5ef6\u8fdf\u964d\u4f4e 7.4x/8.6x\uff0c\u63a8\u7406\u89e3\u7801\u5ef6\u8fdf\u964d\u4f4e 3.0x\uff0c\u89e3\u7801\u5cf0\u503c\u7b97\u5b50\u5185\u5b58\u964d\u4f4e 7.6x\u3002"], "keywords": ["\u6ce8\u610f\u529b\u673a\u5236", "\u957f\u4e0a\u4e0b\u6587", "\u9ad8\u6548\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b"], "num_comments": 2, "on_hf": true, "organization": "Beijing Academy of Artificial Intelligence", "pdf_url": "https://arxiv.org/pdf/2609.32704v1", "published_at": "2026-09-26", "score": 0.514, "selected_reasons": ["\u77e5\u540d\u673a\u6784: BAAI", "HF trending (59\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32704.png", "title": "CoWindow Attention: Full Causal Coverage Is a Collective Property", "tldr": "CoWA\u8ba9\u591a\u5934\u96c6\u4f53\u8986\u76d6\u5168\u5386\u53f2\u4ee5\u52a0\u901f\u6ce8\u610f\u529b", "upvotes": 59, "what_it_is": "\u8bba\u6587\u63d0\u51fa CoWindow Attention\uff08CoWA\uff09\uff0c\u4e00\u79cd\u7ed3\u6784\u5316\u56e0\u679c\u6ce8\u610f\u529b\u673a\u5236\uff1a\u6bcf\u4e2a KV head \u53ea\u7a00\u758f\u5173\u6ce8\u8fdc\u8ddd\u79bb token\uff0c\u4f46\u591a\u4e2a head \u7684\u7a97\u53e3\u4e92\u8865\u540e\u5171\u540c\u8986\u76d6\u5b8c\u6574\u56e0\u679c\u5386\u53f2\u3002\u5b83\u65e0\u9700\u8def\u7531\u5668\u6216\u7d22\u5f15\u5668\uff0c\u8bad\u7ec3\u4e0e\u63a8\u7406\u4f7f\u7528\u540c\u4e00\u56fa\u5b9a\u4f4d\u7f6e\u6a21\u5f0f\uff0c\u5e76\u9002\u914d KV-head \u5f20\u91cf\u5e76\u884c\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6311\u6218\u4e86\u201c\u6bcf\u4e2a\u6ce8\u610f\u529b\u5934\u90fd\u5fc5\u987b\u770b\u5230\u5b8c\u6574\u5386\u53f2\u201d\u7684\u9ed8\u8ba4\u8bbe\u8ba1\uff0c\u8bc1\u660e\u5b8c\u6574\u56e0\u679c\u8986\u76d6\u53ef\u4ee5\u7531 head \u96c6\u5408\u5171\u540c\u5b9e\u73b0\uff0c\u4ece\u800c\u5728\u4fdd\u6301\u56f0\u60d1\u5ea6\u3001\u77e5\u8bc6\u3001\u63a8\u7406\u548c\u957f\u4e0a\u4e0b\u6587\u68c0\u7d22\u8868\u73b0\u63a5\u8fd1 FullAttn \u7684\u540c\u65f6\u663e\u8457\u964d\u4f4e\u957f\u4e0a\u4e0b\u6587\u8bad\u7ec3\u4e0e\u63a8\u7406\u6210\u672c\u3002"}, {"abstract": "Real-time full-duplex speech models can listen while speaking, enabling natural interaction without rigid turn boundaries. Existing benchmarks evaluate turn-taking, interruption handling and multi-round dialogue, but largely centre on a designated user rather than an assistant participating in a shared conversation among several people. We introduce Duplex-MPE to evaluate when such an assistant should answer, remain silent or stop speaking. The benchmark contains 2,000 scenarios with three or four human speakers and one assistant, each paired across explicit and implicit addressing of the same request. Models receive continuous conversation audio without transcripts or supplied turn boundaries. Four scores measure fresh response initiation, answer accuracy, silence preservation and stopping when a human resolves a request. We evaluate five open-weight speech systems: MiniCPM-o 4.5, Moshi, FLM-Audio, Voila and Freeze-Omni. MiniCPM-o 4.5 leads on three scored capabilities, while frequent speech from other systems can coexist with inaccurate answers or failures to remain silent. A transcript-based Gemini 3.1 Pro reference responds 64.3 percentage points more often to explicit than implicit requests; paired tests detect no significant response-rate difference for the speech systems.", "arxiv_id": "2609.31948", "arxiv_url": "https://arxiv.org/abs/2609.31948", "authors": ["Chengqian Ma", "Wenhao Feng", "Weixuan Jin", "Gaole Dai", "Tianyu Xie", "Yuexiao Ma", "Zhaolu Kang", "Xiangyu Zhao", "Xiawu Zheng", "Fei Chao"], "brief": "\u8bba\u6587\u63d0\u51fa Duplex-MPE\uff0c\u4e00\u4e2a\u9762\u5411\u5168\u53cc\u5de5\u8bed\u97f3\u6a21\u578b\u7684\u591a\u4eba\u4e92\u52a8\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u52a9\u624b\u5728\u4e09\u5230\u56db\u4eba\u5171\u4eab\u5bf9\u8bdd\u4e2d\u4f55\u65f6\u5e94\u56de\u7b54\u3001\u4fdd\u6301\u6c89\u9ed8\u6216\u505c\u6b62\u8bf4\u8bdd\u3002\u57fa\u51c6\u5305\u542b 2000 \u4e2a\u573a\u666f\uff0c\u5e76\u533a\u5206\u540c\u4e00\u8bf7\u6c42\u7684\u663e\u5f0f\u4e0e\u9690\u5f0f\u6307\u5411\u5f62\u5f0f\u3002", "categories": ["cs.SD", "eess.AS"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.31948", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6a21\u578b\u8f93\u5165\u4e3a\u8fde\u7eed\u5bf9\u8bdd\u97f3\u9891\uff0c\u4e0d\u63d0\u4f9b\u8f6c\u5199\u6587\u672c\u6216\u8f6e\u6b21\u8fb9\u754c\uff0c\u66f4\u8d34\u8fd1\u771f\u5b9e\u591a\u4eba\u8bed\u97f3\u573a\u666f", "\u8bbe\u8ba1\u56db\u9879\u6307\u6807\uff1a\u65b0\u56de\u5e94\u53d1\u8d77\u3001\u56de\u7b54\u51c6\u786e\u6027\u3001\u4fdd\u6301\u6c89\u9ed8\u80fd\u529b\u3001\u5728\u4eba\u7c7b\u5df2\u89e3\u51b3\u8bf7\u6c42\u65f6\u505c\u6b62\u8bf4\u8bdd", "\u8bc4\u6d4b\u4e94\u4e2a\u5f00\u6e90\u8bed\u97f3\u7cfb\u7edf\uff0cMiniCPM-o 4.5 \u5728\u4e09\u9879\u80fd\u529b\u4e0a\u9886\u5148\uff0c\u4f46\u591a\u6570\u7cfb\u7edf\u96be\u4ee5\u533a\u5206\u663e\u5f0f\u4e0e\u9690\u5f0f\u8bf7\u6c42"], "keywords": ["\u8bed\u97f3\u5bf9\u8bdd", "\u591a\u65b9\u4ea4\u4e92", "\u5168\u53cc\u5de5", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 2, "on_hf": true, "organization": "Peking University", "pdf_url": "https://arxiv.org/pdf/2609.31948v1", "published_at": "2026-09-25", "score": 0.51, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Peking", "HF trending (82\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.31948.png", "title": "Duplex-MPE: Benchmarking Multi-Party Interaction in Full-Duplex Dialogue", "tldr": "\u8bc4\u6d4b\u5168\u53cc\u5de5\u8bed\u97f3\u52a9\u624b\u7684\u591a\u4eba\u5bf9\u8bdd\u53c2\u4e0e\u80fd\u529b", "upvotes": 82, "what_it_is": "\u8bba\u6587\u63d0\u51fa Duplex-MPE\uff0c\u4e00\u4e2a\u9762\u5411\u5168\u53cc\u5de5\u8bed\u97f3\u6a21\u578b\u7684\u591a\u4eba\u4e92\u52a8\u57fa\u51c6\uff0c\u7528\u4e8e\u8bc4\u4f30\u52a9\u624b\u5728\u4e09\u5230\u56db\u4eba\u5171\u4eab\u5bf9\u8bdd\u4e2d\u4f55\u65f6\u5e94\u56de\u7b54\u3001\u4fdd\u6301\u6c89\u9ed8\u6216\u505c\u6b62\u8bf4\u8bdd\u3002\u57fa\u51c6\u5305\u542b 2000 \u4e2a\u573a\u666f\uff0c\u5e76\u533a\u5206\u540c\u4e00\u8bf7\u6c42\u7684\u663e\u5f0f\u4e0e\u9690\u5f0f\u6307\u5411\u5f62\u5f0f\u3002", "why_notable": "\u8be5\u57fa\u51c6\u5c06\u5168\u53cc\u5de5\u8bed\u97f3\u8bc4\u6d4b\u4ece\u5355\u7528\u6237\u8f6e\u66ff\u6269\u5c55\u5230\u591a\u4eba\u5171\u4eab\u5bf9\u8bdd\uff0c\u63ed\u793a\u73b0\u6709\u8bed\u97f3\u52a9\u624b\u5728\u88ab\u6307\u5411\u6027\u3001\u6c89\u9ed8\u63a7\u5236\u548c\u9002\u65f6\u505c\u8bdd\u4e0a\u7684\u660e\u663e\u4e0d\u8db3\uff0c\u5bf9\u5b9e\u65f6\u8bed\u97f3\u52a9\u624b\u843d\u5730\u5f88\u6709\u4ef7\u503c\u3002"}, {"abstract": "Leveraging the paradigm of autoregressive diffusion, text-conditioned interactive video world models aim to simulate temporally coherent environments guided by textual instructions. While enabling low-latency, long-duration generation is pivotal for embodied AI and simulation-based planning, current frameworks primarily rely on sliding-window mechanisms to bound computational complexity. However, this approach inherently sacrifices historical context, undermining the long-range interactive capabilities. Conversely, maintaining a full-history cache remains computationally prohibitive and memory-intensive: the quadratic complexity of attention leads to excessive computational overhead, while the linear growth of the KV cache inevitably leads to GPU memory saturation. To overcome these limitations, we propose WorldAttention, a system-oriented attention architecture that achieves high efficiency through the co-design of specialized attention kernels and hierarchical KV cache management. First, we introduce Hybrid Sparse Attention (HSA), which integrates linear global attention supplemented with head-adaptive sparse attention. Additionally, we design a Hierarchical KV Cache (HKV) that organizes historical KV pairs into semantically indexed pages across multi-tier memory, enabling fine-grained retrieval and controlled GPU residency. These two designs are supported by tailored kernels to effectively translate their theoretical efficiency into real-world performance. Extensive experiments on VBench-Long and InterVBench demonstrate that WorldAttention consistently surpasses prior state-of-the-art methods, achieving subject consistency scores of 0.9472 on VBench-Long and 0.9668 on InterVBench, respectively.", "arxiv_id": "2609.34606", "arxiv_url": "https://arxiv.org/abs/2609.34606", "authors": ["Zeyu Zhang", "Jinyuan Mao", "Dakai An", "Wangbo Zhao", "Hanfeng Lu", "Jiasheng Tang", "Yinghao Yu", "Wei Wang", "Bohan Zhuang"], "brief": "\u8bba\u6587\u63d0\u51fa WorldAttention\uff0c\u7528\u4e8e\u6587\u672c\u6761\u4ef6\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u9ad8\u6548\u957f\u65f6\u751f\u6210\u3002\u5b83\u901a\u8fc7\u6df7\u5408\u7a00\u758f\u6ce8\u610f\u529b\u4e0e\u5206\u5c42 KV \u7f13\u5b58\uff0c\u5728\u4fdd\u7559\u957f\u5386\u53f2\u4e0a\u4e0b\u6587\u7684\u540c\u65f6\u964d\u4f4e\u8ba1\u7b97\u548c\u663e\u5b58\u5f00\u9500\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/alibaba-damo-academy/WorldAttention", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.34606", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa Hybrid Sparse Attention\uff0c\u5c06\u7ebf\u6027\u5168\u5c40\u6ce8\u610f\u529b\u4e0e\u6309\u6ce8\u610f\u529b\u5934\u81ea\u9002\u5e94\u7684\u7a00\u758f\u6ce8\u610f\u529b\u7ed3\u5408\uff0c\u517c\u987e\u957f\u7a0b\u4f9d\u8d56\u4e0e\u6548\u7387", "\u8bbe\u8ba1 Hierarchical KV Cache\uff0c\u5c06\u5386\u53f2 KV \u6309\u8bed\u4e49\u7d22\u5f15\u5206\u9875\u5e76\u653e\u7f6e\u5728\u591a\u7ea7\u5b58\u50a8\u4e2d\uff0c\u5b9e\u73b0\u7ec6\u7c92\u5ea6\u68c0\u7d22\u548c\u53ef\u63a7 GPU \u9a7b\u7559", "\u5728 VBench-Long \u548c InterVBench \u4e0a\u4f18\u4e8e\u65e2\u6709\u65b9\u6cd5\uff0c\u4e3b\u4f53\u4e00\u81f4\u6027\u5206\u6570\u5206\u522b\u8fbe\u5230 0.9472 \u548c 0.9668"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u6ce8\u610f\u529b\u673a\u5236", "\u591a\u6a21\u6001"], "num_comments": 1, "on_hf": true, "organization": "DAMO Academy", "pdf_url": "https://arxiv.org/pdf/2609.34606v1", "published_at": "2026-09-28", "score": 0.507, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34606.png", "title": "WorldAttention: An Efficient Attention Architecture for Interactive Video World Models", "tldr": "\u9ad8\u6548\u957f\u7a0b\u4ea4\u4e92\u89c6\u9891\u4e16\u754c\u6a21\u578b\u6ce8\u610f\u529b\u67b6\u6784", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldAttention\uff0c\u7528\u4e8e\u6587\u672c\u6761\u4ef6\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u9ad8\u6548\u957f\u65f6\u751f\u6210\u3002\u5b83\u901a\u8fc7\u6df7\u5408\u7a00\u758f\u6ce8\u610f\u529b\u4e0e\u5206\u5c42 KV \u7f13\u5b58\uff0c\u5728\u4fdd\u7559\u957f\u5386\u53f2\u4e0a\u4e0b\u6587\u7684\u540c\u65f6\u964d\u4f4e\u8ba1\u7b97\u548c\u663e\u5b58\u5f00\u9500\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u9488\u5bf9\u4ea4\u4e92\u5f0f\u89c6\u9891\u4e16\u754c\u6a21\u578b\u7684\u6838\u5fc3\u74f6\u9888\u2014\u2014\u957f\u5386\u53f2\u4e0a\u4e0b\u6587\u5e26\u6765\u7684\u6ce8\u610f\u529b\u8ba1\u7b97\u548c KV \u7f13\u5b58\u538b\u529b\u2014\u2014\u7ed9\u51fa\u7cfb\u7edf\u7ea7\u89e3\u51b3\u65b9\u6848\uff0c\u6709\u52a9\u4e8e\u4f4e\u5ef6\u8fdf\u3001\u957f\u65f6\u957f\u73af\u5883\u6a21\u62df\uff0c\u63d0\u5347\u5177\u8eab\u667a\u80fd\u4e0e\u4eff\u771f\u89c4\u5212\u7684\u53ef\u7528\u6027\u3002"}, {"abstract": "World-space hand motion estimation from egocentric video requires recovering 3D articulated hand geometry while tracking camera egomotion. Existing approaches heavily rely on cascading independent hand pose estimators and SLAM systems, resulting in error accumulation, complex pipelines, and severe computational overhead. To address these limitations, we present InfiniHand, an end-to-end streaming feed-forward framework that jointly estimates MANO parameters, camera trajectories, and hand locations directly from uncalibrated egocentric video. InfiniHand integrates persistent spatiotemporal memory with hand-centered visual features, explicitly coupling camera motion with local hand geometry within a unified architecture. We train InfiniHand in two progressive stages by first learning robust camera-space hand priors and then extending to streaming world-space reconstruction. To support this process, we aggregate a pretraining corpus of approximately 5,000 hours of egocentric data across multiple public datasets. Extensive evaluations demonstrate that InfiniHand outperforms state-of-the-art baselines on in-domain benchmarks, achieving a 21.4% reduction in ARCTIC PA-p compared to ViDiHand while substantially mitigating world-space drift. Furthermore, InfiniHand generalizes robustly to in-the-wild videos and operates at 11.19 FPS, delivering more than twice the throughput of HaWoR.", "arxiv_id": "2609.35743", "arxiv_url": "https://arxiv.org/abs/2609.35743", "authors": ["Kerui Ren", "Kaiwen Song", "Weiguang Zhao", "Yuxi Wang", "Yufei Liu", "Bo Dai", "Haoyu Guo", "Chunhua Shen", "Mulin Yu", "Tao Lu", "Junting Dong"], "brief": "InfiniHand \u662f\u4e00\u4e2a\u4ece\u672a\u6807\u5b9a\u81ea\u6211\u89c6\u89d2\u89c6\u9891\u4e2d\u6d41\u5f0f\u4f30\u8ba1\u4e16\u754c\u5750\u6807\u7cfb\u624b\u90e8\u8fd0\u52a8\u7684\u524d\u9988\u6846\u67b6\u3002\u5b83\u8054\u5408\u9884\u6d4b MANO \u624b\u90e8\u53c2\u6570\u3001\u76f8\u673a\u8f68\u8ff9\u4e0e\u624b\u90e8\u4f4d\u7f6e\uff0c\u907f\u514d\u4f20\u7edf\u624b\u59ff\u6001\u4f30\u8ba1\u4e0e SLAM \u7ea7\u8054\u5e26\u6765\u7684\u8bef\u5dee\u7d2f\u79ef\u548c\u9ad8\u5f00\u9500\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/infinihand/InfiniHand", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2609.35743", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u5f15\u5165\u6301\u4e45\u65f6\u7a7a\u8bb0\u5fc6\u4e0e\u624b\u90e8\u4e2d\u5fc3\u89c6\u89c9\u7279\u5f81\uff0c\u5728\u7edf\u4e00\u67b6\u6784\u4e2d\u663e\u5f0f\u8026\u5408\u76f8\u673a\u8fd0\u52a8\u548c\u5c40\u90e8\u624b\u90e8\u51e0\u4f55\u3002", "\u91c7\u7528\u4e24\u9636\u6bb5\u8bad\u7ec3\uff1a\u5148\u5b66\u4e60\u7a33\u5065\u7684\u76f8\u673a\u5750\u6807\u7cfb\u624b\u90e8\u5148\u9a8c\uff0c\u518d\u6269\u5c55\u5230\u6d41\u5f0f\u4e16\u754c\u5750\u6807\u7cfb\u91cd\u5efa\u3002", "\u6c47\u805a\u7ea6 5000 \u5c0f\u65f6\u591a\u516c\u5f00\u6570\u636e\u96c6\u81ea\u6211\u89c6\u89d2\u89c6\u9891\u9884\u8bad\u7ec3\u8bed\u6599\uff1b\u5728 ARCTIC \u4e0a\u8f83 ViDiHand \u7684 PA-p \u964d\u4f4e 21.4%\uff0c\u5e76\u4ee5 11.19 FPS \u8fd0\u884c\u3002"], "keywords": ["\u81ea\u6211\u89c6\u89d2", "\u4e09\u7ef4\u624b\u90e8\u91cd\u5efa", "\u89c6\u9891\u7406\u89e3", "\u8fd0\u52a8\u4f30\u8ba1"], "num_comments": 2, "on_hf": true, "organization": "Shanghai AI Laboratory", "pdf_url": "https://arxiv.org/pdf/2609.35743v1", "published_at": "2026-09-28", "score": 0.499, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Shanghai AI Lab", "HF trending (9\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35743.png", "title": "InfiniHand: Streaming World-Space Hand Motion Estimation from Egocentric Video", "tldr": "\u7aef\u5230\u7aef\u6d41\u5f0f\u4f30\u8ba1\u81ea\u6211\u89c6\u89d2\u624b\u90e8\u4e16\u754c\u8fd0\u52a8", "upvotes": 9, "what_it_is": "InfiniHand \u662f\u4e00\u4e2a\u4ece\u672a\u6807\u5b9a\u81ea\u6211\u89c6\u89d2\u89c6\u9891\u4e2d\u6d41\u5f0f\u4f30\u8ba1\u4e16\u754c\u5750\u6807\u7cfb\u624b\u90e8\u8fd0\u52a8\u7684\u524d\u9988\u6846\u67b6\u3002\u5b83\u8054\u5408\u9884\u6d4b MANO \u624b\u90e8\u53c2\u6570\u3001\u76f8\u673a\u8f68\u8ff9\u4e0e\u624b\u90e8\u4f4d\u7f6e\uff0c\u907f\u514d\u4f20\u7edf\u624b\u59ff\u6001\u4f30\u8ba1\u4e0e SLAM \u7ea7\u8054\u5e26\u6765\u7684\u8bef\u5dee\u7d2f\u79ef\u548c\u9ad8\u5f00\u9500\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u624b\u90e8\u91cd\u5efa\u4e0e\u76f8\u673a\u81ea\u8fd0\u52a8\u4f30\u8ba1\u6574\u5408\u4e3a\u5b9e\u65f6\u6d41\u5f0f\u7aef\u5230\u7aef\u6a21\u578b\uff0c\u663e\u8457\u964d\u4f4e\u4e16\u754c\u7a7a\u95f4\u6f02\u79fb\u548c\u7cfb\u7edf\u590d\u6742\u5ea6\uff0c\u5bf9 AR/VR\u3001\u5177\u8eab\u611f\u77e5\u548c\u7b2c\u4e00\u89c6\u89d2\u4ea4\u4e92\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "World action models (WAMs) predict the future alongside actions during training. Due to the heavy computation cost of video denoising, whether the future must still be generated during inference is disputed: Explicit WAMs denoise it into clean frames along with every action chunk, whereas Latent WAMs discard it entirely for acceleration. We find that latent WAMs, despite matching explicit ones on in-distribution tasks, fail to retain the generalization benefits that originally motivated WAMs. To demonstrate this, we evaluate generalization along three axes: environmental perturbation, data efficiency, and task generalization. Controlled comparisons with a matched backbone, training data, and budget reveal consistent degradation across all three axes when the action expert no longer conditions on future representations. Further analysis shows that the gap arises almost entirely from the first denoising step: the benefit comes from preparing the future, not generating it. We therefore propose Simple-WAM, which simplifies future modeling into a single forward pass of fully noised video tokens and adapts the training-time noise schedule to this inference behavior. Across simulation and real-world tasks, Simple-WAM achieves the best of both worlds, leading explicit WAMs in generalization performance with efficiency comparable to Latent WAMs. Project Page: https://zrporz.github.io/Simple-WAM-Web/", "arxiv_id": "2609.34981", "arxiv_url": "https://arxiv.org/abs/2609.34981", "authors": ["Renping Zhou", "Zanlin Ni", "Zihao Fan", "Guohao Fu", "Zeyu Liu", "Hao Shi", "Jie Zhang", "Chi Bene Chen", "Yang Yue", "Xueyang Fu", "Gao Huang"], "brief": "\u672c\u6587\u5b9e\u8bc1\u7814\u7a76\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff08WAM\uff09\u5728\u6d4b\u8bd5\u65f6\u662f\u5426\u9700\u8981\u751f\u6210\u672a\u6765\u89c6\u9891\uff0c\u53d1\u73b0\u5b8c\u5168\u4e22\u5f03\u672a\u6765\u8868\u793a\u7684 Latent WAM \u4f1a\u635f\u5931\u6cdb\u5316\u80fd\u529b\u3002\u4f5c\u8005\u63d0\u51fa Simple-WAM\uff0c\u4ec5\u7528\u4e00\u6b21\u524d\u5411\u4f20\u64ad\u5904\u7406\u5168\u566a\u58f0\u89c6\u9891 token\uff0c\u5e76\u8c03\u6574\u8bad\u7ec3\u566a\u58f0\u65e5\u7a0b\uff0c\u4ee5\u4f4e\u6210\u672c\u4fdd\u7559\u672a\u6765\u5efa\u6a21\u6536\u76ca\u3002", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/LeapLabTHU/Simple-WAM", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2609.34981", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u4ece\u73af\u5883\u6270\u52a8\u3001\u6570\u636e\u6548\u7387\u3001\u4efb\u52a1\u6cdb\u5316\u4e09\u6761\u8f74\u7ebf\u8bc4\u4f30 WAM \u6cdb\u5316\u80fd\u529b\uff0c\u63a7\u5236\u9aa8\u5e72\u7f51\u7edc\u3001\u8bad\u7ec3\u6570\u636e\u548c\u9884\u7b97\u540e\u53d1\u73b0 Latent WAM \u4e00\u81f4\u9000\u5316\u3002", "\u5206\u6790\u8868\u660e\uff0c\u6cdb\u5316\u6536\u76ca\u51e0\u4e4e\u5168\u90e8\u6765\u81ea\u7b2c\u4e00\u6b65\u53bb\u566a\uff1a\u5173\u952e\u662f\u201c\u51c6\u5907\u672a\u6765\u8868\u793a\u201d\uff0c\u800c\u4e0d\u662f\u5b8c\u6574\u751f\u6210\u5e72\u51c0\u672a\u6765\u5e27\u3002", "Simple-WAM \u5728\u4eff\u771f\u4e0e\u771f\u5b9e\u673a\u5668\u4eba\u4efb\u52a1\u4e2d\u6cdb\u5316\u4f18\u4e8e Explicit WAM\uff0c\u540c\u65f6\u63a8\u7406\u6548\u7387\u63a5\u8fd1 Latent WAM\u3002"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u5b66\u4e60", "\u6cdb\u5316", "\u89c6\u9891\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": "Tsinghua-LeapLab", "pdf_url": "https://arxiv.org/pdf/2609.34981v2", "published_at": "2026-09-28", "score": 0.497, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tsinghua", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34981.png", "title": "What Makes World Action Models Generalize? An Empirical Study of Test-Time Future Modeling", "tldr": "Simple-WAM\u7528\u4e00\u6b21\u672a\u6765\u5efa\u6a21\u517c\u987e\u6cdb\u5316\u4e0e\u6548\u7387", "upvotes": 10, "what_it_is": "\u672c\u6587\u5b9e\u8bc1\u7814\u7a76\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\uff08WAM\uff09\u5728\u6d4b\u8bd5\u65f6\u662f\u5426\u9700\u8981\u751f\u6210\u672a\u6765\u89c6\u9891\uff0c\u53d1\u73b0\u5b8c\u5168\u4e22\u5f03\u672a\u6765\u8868\u793a\u7684 Latent WAM \u4f1a\u635f\u5931\u6cdb\u5316\u80fd\u529b\u3002\u4f5c\u8005\u63d0\u51fa Simple-WAM\uff0c\u4ec5\u7528\u4e00\u6b21\u524d\u5411\u4f20\u64ad\u5904\u7406\u5168\u566a\u58f0\u89c6\u9891 token\uff0c\u5e76\u8c03\u6574\u8bad\u7ec3\u566a\u58f0\u65e5\u7a0b\uff0c\u4ee5\u4f4e\u6210\u672c\u4fdd\u7559\u672a\u6765\u5efa\u6a21\u6536\u76ca\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u6f84\u6e05\u4e86\u4e16\u754c\u52a8\u4f5c\u6a21\u578b\u6cdb\u5316\u80fd\u529b\u7684\u6765\u6e90\uff0c\u4e3a\u673a\u5668\u4eba\u7b56\u7565\u4e2d\u7684\u672a\u6765\u5efa\u6a21\u63d0\u4f9b\u4e86\u66f4\u9ad8\u6548\u7684\u8bbe\u8ba1\u8303\u5f0f\uff0c\u907f\u514d\u6602\u8d35\u89c6\u9891\u751f\u6210\u540c\u65f6\u4fdd\u7559\u8de8\u73af\u5883\u4e0e\u8de8\u4efb\u52a1\u6cdb\u5316\u3002"}, {"abstract": "Long visual token sequences often account for a substantial fraction of the computational overhead in multimodal large language models~(MLLMs). Existing approaches reduce this cost by pruning redundant visual tokens, but permanently discard visual evidence that may become useful in subsequent layers. We instead ask whether all visual tokens can be preserved while reducing the cost of repeatedly evolving the representations through the Transformer. To answer this question, we perform low-rank interventions on visual-to-text information flow. We find that, after visual-to-text attention is blocked, restoring only a few directions recovers most of the lost accuracy, suggesting the relevant visual influence is concentrated in a low-dimensional subspace. We further observe strong predictability in layer-specific visual states: lightweight MLPs approximate them with high cosine similarity and low reconstruction error. Motivated by these findings, we propose $\u03b4$-Vision, which replaces repeated Transformer evolution of visual tokens with lightweight low-rank adapters that construct layer-wise visual memories while preserving all visual tokens for text retrieval. Across image and video benchmarks, $\u03b4$-Vision achieves higher accuracy than visual token pruning baselines at comparable or lower computation, while delivering competitive inference efficiency without discarding visual tokens.", "arxiv_id": "2609.34972", "arxiv_url": "https://arxiv.org/abs/2609.34972", "authors": ["Jingdi lei", "Junxian Li", "Di Zhang", "Zhanqiu Zhang", "Yiwen Guo", "Soujanya Poria"], "brief": "\u8bba\u6587\u53d1\u73b0\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u89c6\u89c9\u5230\u6587\u672c\u7684\u6709\u6548\u5f71\u54cd\u96c6\u4e2d\u5728\u4f4e\u7ef4\u5b50\u7a7a\u95f4\uff0c\u4e14\u5404\u5c42\u89c6\u89c9\u72b6\u6001\u53ef\u7531\u8f7b\u91cfMLP\u9ad8\u7cbe\u5ea6\u9884\u6d4b\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u03b4-Vision\uff0c\u7528\u4f4e\u79e9\u9002\u914d\u5668\u6784\u5efa\u9010\u5c42\u89c6\u89c9\u8bb0\u5fc6\uff0c\u66ff\u4ee3\u89c6\u89c9token\u5728Transformer\u4e2d\u7684\u53cd\u590d\u6f14\u5316\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/declare-lab/delta-Vision", "github_stars": 5, "hf_url": "https://huggingface.co/papers/2609.34972", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u901a\u8fc7\u963b\u65ad\u89c6\u89c9\u5230\u6587\u672c\u6ce8\u610f\u529b\u5e76\u8fdb\u884c\u4f4e\u79e9\u5e72\u9884\uff0c\u53d1\u73b0\u53ea\u6062\u590d\u5c11\u6570\u65b9\u5411\u5373\u53ef\u633d\u56de\u5927\u90e8\u5206\u7cbe\u5ea6\u635f\u5931", "\u8f7b\u91cfMLP\u80fd\u4ee5\u9ad8\u4f59\u5f26\u76f8\u4f3c\u5ea6\u3001\u4f4e\u91cd\u6784\u8bef\u5dee\u8fd1\u4f3c\u5c42\u7ea7\u89c6\u89c9\u72b6\u6001", "\u5728\u56fe\u50cf\u548c\u89c6\u9891\u57fa\u51c6\u4e0a\uff0c\u76f8\u6bd4\u89c6\u89c9token\u526a\u679d\u65b9\u6cd5\uff0c\u03b4-Vision\u5728\u76f8\u8fd1\u6216\u66f4\u4f4e\u8ba1\u7b97\u91cf\u4e0b\u53d6\u5f97\u66f4\u9ad8\u51c6\u786e\u7387\uff0c\u4e14\u4e0d\u4e22\u5f03\u89c6\u89c9token"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9token", "\u6a21\u578b\u538b\u7f29", "\u9ad8\u6548\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "Tencent", "pdf_url": "https://arxiv.org/pdf/2609.34972v1", "published_at": "2026-09-28", "score": 0.497, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Tencent", "HF trending (18\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.34972.png", "title": "Just MLPs: Efficient Visual State Reconstruction for Multimodal Language Models", "tldr": "\u7528\u8f7b\u91cfMLP\u9ad8\u6548\u91cd\u6784MLLM\u89c6\u89c9\u72b6\u6001", "upvotes": 18, "what_it_is": "\u8bba\u6587\u53d1\u73b0\u591a\u6a21\u6001\u5927\u6a21\u578b\u4e2d\u89c6\u89c9\u5230\u6587\u672c\u7684\u6709\u6548\u5f71\u54cd\u96c6\u4e2d\u5728\u4f4e\u7ef4\u5b50\u7a7a\u95f4\uff0c\u4e14\u5404\u5c42\u89c6\u89c9\u72b6\u6001\u53ef\u7531\u8f7b\u91cfMLP\u9ad8\u7cbe\u5ea6\u9884\u6d4b\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa\u03b4-Vision\uff0c\u7528\u4f4e\u79e9\u9002\u914d\u5668\u6784\u5efa\u9010\u5c42\u89c6\u89c9\u8bb0\u5fc6\uff0c\u66ff\u4ee3\u89c6\u89c9token\u5728Transformer\u4e2d\u7684\u53cd\u590d\u6f14\u5316\u3002", "why_notable": "\u4e0d\u540c\u4e8e\u76f4\u63a5\u526a\u679d\u89c6\u89c9token\uff0c\u8be5\u65b9\u6cd5\u4fdd\u7559\u5168\u90e8\u89c6\u89c9\u8bc1\u636e\uff0c\u540c\u65f6\u964d\u4f4e\u89c6\u89c9\u8868\u793a\u5728Transformer\u4e2d\u53cd\u590d\u66f4\u65b0\u7684\u5f00\u9500\uff0c\u4e3a\u63d0\u5347\u591a\u6a21\u6001\u5927\u6a21\u578b\u63a8\u7406\u6548\u7387\u63d0\u4f9b\u4e86\u66f4\u7a33\u5065\u7684\u8def\u7ebf\u3002"}, {"abstract": "Reinforcement learning (RL) for code agents often uses executable tests to provide binary rewards. With these rewards, Group Relative Policy Optimization (GRPO) assigns identical advantages to test-passing trajectories within each rollout group, overlooking differences in implementation quality and adherence to task requirements. This leaves the policy without a learning signal that favors clean, targeted implementations over those containing unnecessary or out-of-scope changes. We introduce GAGAR, a framework for quality-aware credit redistribution in code agent RL. Built on dynamic sampling that retains groups containing both passing and failing trajectories, GAGAR places all trajectories from each group in a shared workspace, where an SFT-trained agentic grader jointly inspects them and ranks the test-passing candidates. Based on this ranking, we downweight lower-ranked trajectories and proportionally rescale the advantages of all test-passing trajectories to restore their original sum. This sum-preserving redistribution retains the relative weights established by quality-based downweighting while shifting credit toward higher-quality implementations. We evaluate GAGAR at industrial scale using pre-RL SFT checkpoints of MiMo-V2.6-Flash (310B total parameters) and MiMo-V2.6-Pro (1.02T total parameters). Controlled code-only Flash experiments show improved code agent performance, reduced trajectory-length growth, and more stable training. We further apply GAGAR in large-scale mixed-task RL with both Flash and Pro. Our results support combining test-based verification with groupwise agentic grading to improve the quality and stability of code agent RL.", "arxiv_id": "2609.32577", "arxiv_url": "https://arxiv.org/abs/2609.32577", "authors": ["Jinhao Dong", "Liang Zhao", "Zihao Yue", "Wenhan Ma", "Linghao Zhang", "Lei Li", "Shicheng Li", "Yifan Song", "Bowen Ye", "Fuli Luo"], "brief": "\u8bba\u6587\u63d0\u51fa GAGAR\uff0c\u7528\u4e8e\u4ee3\u7801\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u8d28\u91cf\u611f\u77e5 credit redistribution\u3002\u5b83\u5728\u6d4b\u8bd5\u901a\u8fc7/\u5931\u8d25\u6df7\u5408\u7684 rollout \u7ec4\u5185\uff0c\u5f15\u5165 SFT \u8bad\u7ec3\u7684\u667a\u80fd\u4f53\u8bc4\u5206\u5668\u8054\u5408\u6bd4\u8f83\u901a\u8fc7\u6d4b\u8bd5\u7684\u8f68\u8ff9\uff0c\u5e76\u6309\u5b9e\u73b0\u8d28\u91cf\u91cd\u65b0\u5206\u914d\u4f18\u52bf\u503c\u3002", "categories": ["cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.32577", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9488\u5bf9 GRPO \u4e2d\u6240\u6709\u6d4b\u8bd5\u901a\u8fc7\u8f68\u8ff9\u83b7\u5f97\u76f8\u540c\u4f18\u52bf\u7684\u95ee\u9898\uff0c\u533a\u5206\u5e72\u51c0\u3001\u805a\u7126\u5b9e\u73b0\u4e0e\u5197\u4f59\u6216\u8d8a\u754c\u4fee\u6539\u3002", "\u91c7\u7528\u52a8\u6001\u91c7\u6837\u4fdd\u7559\u540c\u65f6\u5305\u542b\u901a\u8fc7\u4e0e\u5931\u8d25\u8f68\u8ff9\u7684\u7ec4\uff0c\u5e76\u8ba9 agentic grader \u5728\u5171\u4eab\u5de5\u4f5c\u533a\u4e2d\u5bf9\u901a\u8fc7\u5019\u9009\u8fdb\u884c\u6392\u5e8f\u3002", "\u5bf9\u4f4e\u6392\u540d\u8f68\u8ff9\u964d\u6743\uff0c\u540c\u65f6\u4fdd\u6301\u901a\u8fc7\u8f68\u8ff9\u4f18\u52bf\u503c\u603b\u548c\u4e0d\u53d8\uff0c\u4ece\u800c\u5c06\u4fe1\u7528\u8f6c\u79fb\u7ed9\u66f4\u9ad8\u8d28\u91cf\u5b9e\u73b0\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u5f3a\u5316\u5b66\u4e60", "\u5956\u52b1\u5efa\u6a21"], "num_comments": 2, "on_hf": true, "organization": "Xiaomi MiMo", "pdf_url": "https://arxiv.org/pdf/2609.32577v1", "published_at": "2026-09-26", "score": 0.48, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (110\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.32577.png", "title": "Groupwise Agentic Grading and Advantage Redistribution for Code Agent RL", "tldr": "\u7528\u667a\u80fd\u4f53\u8bc4\u5206\u91cd\u5206\u914d\u4ee3\u7801RL\u5956\u52b1", "upvotes": 110, "what_it_is": "\u8bba\u6587\u63d0\u51fa GAGAR\uff0c\u7528\u4e8e\u4ee3\u7801\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u8d28\u91cf\u611f\u77e5 credit redistribution\u3002\u5b83\u5728\u6d4b\u8bd5\u901a\u8fc7/\u5931\u8d25\u6df7\u5408\u7684 rollout \u7ec4\u5185\uff0c\u5f15\u5165 SFT \u8bad\u7ec3\u7684\u667a\u80fd\u4f53\u8bc4\u5206\u5668\u8054\u5408\u6bd4\u8f83\u901a\u8fc7\u6d4b\u8bd5\u7684\u8f68\u8ff9\uff0c\u5e76\u6309\u5b9e\u73b0\u8d28\u91cf\u91cd\u65b0\u5206\u914d\u4f18\u52bf\u503c\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u628a\u53ef\u6267\u884c\u6d4b\u8bd5\u7684\u5ba2\u89c2\u9a8c\u8bc1\u4e0e\u667a\u80fd\u4f53\u5f0f\u4ee3\u7801\u8d28\u91cf\u8bc4\u5ba1\u7ed3\u5408\u8d77\u6765\uff0c\u5728\u5de5\u4e1a\u89c4\u6a21\u7684 MiMo-V2.6-Flash \u548c Pro \u6a21\u578b\u4e0a\u663e\u793a\u51fa\u66f4\u597d\u7684\u4ee3\u7801\u667a\u80fd\u4f53\u6027\u80fd\u3001\u66f4\u77ed\u8f68\u8ff9\u589e\u957f\u548c\u66f4\u7a33\u5b9a\u8bad\u7ec3\uff0c\u5bf9\u5927\u89c4\u6a21\u4ee3\u7801\u667a\u80fd\u4f53 RL \u5177\u6709\u76f4\u63a5\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We study on-policy distillation (OPD) through the lens of reinforcement learning, establishing a connection between the reverse-KL objective in OPD and KL-regularized policy optimization. Building on this connection, we introduce Least-Square Policy Distillation (LSPD), an RL-inspired framework that brings optimistic exploration and off-policy data reuse from value-based RL into policy distillation. LSPD preserves policy diversity through exploration while improving rollout efficiency by repeatedly learning from previously collected trajectories. Our theoretical analysis connects LSPD to optimistic value-based learning and shows that its idealized formulation achieves a sharp $\\tilde{\\mathcal O}(\\log K)$ regret bound under online exploration. Empirically, LSPD consistently outperforms existing distillation baselines across six mathematical reasoning benchmarks and diverse teacher-student settings, with average gains of +1.59 points in Avg@16. Remarkably, through Pass@k evaluations up to k=64, we found that LSPD better preserves policy diversity by achieving stronger performance as k grows. Its fully off-policy variant achieves comparable performance to vanilla OPD using only the first 25% of rollout batches. Together, these results provide an RL perspective on OPD that offers both a principled interpretation and a practical route toward more effective and rollout-efficient language model distillation.", "arxiv_id": "2609.35505", "arxiv_url": "https://arxiv.org/abs/2609.35505", "authors": ["Shangzhe Li", "Yuxiao Yang", "Tianrun Yu", "Kaixiang Zhao", "Xiaoyun Wang", "Taylor W. Killian", "Weitong Zhang"], "brief": "\u8bba\u6587\u4ece\u5f3a\u5316\u5b66\u4e60\u89c6\u89d2\u91cd\u65b0\u89e3\u91ca on-policy distillation\uff08OPD\uff09\uff0c\u5c06\u5176\u53cd\u5411 KL \u76ee\u6807\u4e0e KL \u6b63\u5219\u5316\u7b56\u7565\u4f18\u5316\u8054\u7cfb\u8d77\u6765\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa Least-Square Policy Distillation\uff08LSPD\uff09\uff0c\u901a\u8fc7\u4e50\u89c2\u63a2\u7d22\u4e0e\u79bb\u7b56\u7565\u6570\u636e\u590d\u7528\u63d0\u5347\u5927\u6a21\u578b\u63a8\u7406\u84b8\u998f\u7684\u6548\u7387\u548c\u591a\u6837\u6027\u3002", "categories": ["cs.LG"], "github_repo": "https://github.com/UNCSciML/LSPD", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2609.35505", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u5efa\u7acb OPD \u53cd\u5411 KL \u76ee\u6807\u4e0e KL \u6b63\u5219\u5316\u7b56\u7565\u4f18\u5316\u4e4b\u95f4\u7684\u7406\u8bba\u8054\u7cfb\uff0c\u4e3a\u7b56\u7565\u84b8\u998f\u63d0\u4f9b\u5f3a\u5316\u5b66\u4e60\u89e3\u91ca", "LSPD \u5f15\u5165\u4ef7\u503c\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u7684\u4e50\u89c2\u63a2\u7d22\u548c\u79bb\u7b56\u7565\u8f68\u8ff9\u590d\u7528\uff0c\u5728\u4fdd\u6301\u7b56\u7565\u591a\u6837\u6027\u7684\u540c\u65f6\u51cf\u5c11 rollout \u6210\u672c", "\u5728\u516d\u4e2a\u6570\u5b66\u63a8\u7406\u57fa\u51c6\u548c\u591a\u79cd\u5e08\u751f\u6a21\u578b\u8bbe\u7f6e\u4e2d\u4f18\u4e8e\u84b8\u998f\u57fa\u7ebf\uff0cAvg@16 \u5e73\u5747\u63d0\u5347 1.59 \u5206\uff1b\u79bb\u7b56\u7565\u7248\u672c\u4ec5\u7528\u524d 25% rollout \u6279\u6b21\u5373\u53ef\u63a5\u8fd1 vanilla OPD"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7b56\u7565\u84b8\u998f", "\u5f3a\u5316\u5b66\u4e60", "\u6570\u5b66\u63a8\u7406"], "num_comments": 3, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.35505v1", "published_at": "2026-09-28", "score": 0.477, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.35505.png", "title": "An RL View of OPD: Least Square Policy Distillation for Sample-Efficient LLM Reasoning", "tldr": "\u7528\u5f3a\u5316\u5b66\u4e60\u6539\u8fdbLLM\u63a8\u7406\u7b56\u7565\u84b8\u998f", "upvotes": 10, "what_it_is": "\u8bba\u6587\u4ece\u5f3a\u5316\u5b66\u4e60\u89c6\u89d2\u91cd\u65b0\u89e3\u91ca on-policy distillation\uff08OPD\uff09\uff0c\u5c06\u5176\u53cd\u5411 KL \u76ee\u6807\u4e0e KL \u6b63\u5219\u5316\u7b56\u7565\u4f18\u5316\u8054\u7cfb\u8d77\u6765\u3002\u57fa\u4e8e\u6b64\u63d0\u51fa Least-Square Policy Distillation\uff08LSPD\uff09\uff0c\u901a\u8fc7\u4e50\u89c2\u63a2\u7d22\u4e0e\u79bb\u7b56\u7565\u6570\u636e\u590d\u7528\u63d0\u5347\u5927\u6a21\u578b\u63a8\u7406\u84b8\u998f\u7684\u6548\u7387\u548c\u591a\u6837\u6027\u3002", "why_notable": "\u8fd9\u9879\u5de5\u4f5c\u4e3a LLM \u63a8\u7406\u84b8\u998f\u63d0\u4f9b\u4e86\u66f4\u6709\u539f\u5219\u7684\u5f3a\u5316\u5b66\u4e60\u6846\u67b6\uff0c\u5e76\u5728\u7406\u8bba\u4e0a\u7ed9\u51fa\u8fd1\u4f3c\u5bf9\u6570\u9057\u61be\u754c\uff0c\u540c\u65f6\u5c55\u793a\u4e86\u66f4\u9ad8\u7684\u6837\u672c\u6548\u7387\u548c\u66f4\u597d\u7684 Pass@k \u591a\u6837\u6027\uff0c\u5bf9\u964d\u4f4e\u63a8\u7406\u84b8\u998f\u6210\u672c\u5177\u6709\u5b9e\u9645\u4ef7\u503c\u3002"}, {"abstract": "Group-relative methods for reinforcement learning with verifiable rewards (RLVR) learn from differences in rollout outcomes. Independently sampling complete trajectories is costly and does not explicitly explore the decision space at critical positions. Feedback on a completed trajectory can reveal which earlier choices the policy reconsiders, suggesting where to sample alternative continuations. We introduce Hindsight-Divergence Localization (HDL), which uses hindsight-induced changes in token log-likelihoods to select branch points. HDL generates a small number of complete root trajectories and fills each training group with continuations from the selected positions under the original task context. Each continuation reuses its root prefix and contributes policy updates only through its newly generated suffix, reducing generation cost while focusing additional exploration and learning on decisions after branching. Experiments with three models across math, code, and agent tasks show gains in both rollout efficiency and task performance. Compared with GRPO at matched group sizes and training steps, HDL yields up to a 2.5$\\times$ reduction in generated tokens and a 1.8$\\times$ speedup in rollout wall-clock time. Despite this reduced generation budget, HDL improves performance across all three domains, with gains of up to 12.5 points on agent tasks.", "arxiv_id": "2609.36864", "arxiv_url": "https://arxiv.org/abs/2609.36864", "authors": ["Fanchao Chen", "Hengyu Fu", "Shivaram Venkataraman", "Jiantao Jiao"], "brief": "\u8bba\u6587\u63d0\u51fa Hindsight-Divergence Localization\uff08HDL\uff09\uff0c\u901a\u8fc7\u5b8c\u6210\u8f68\u8ff9\u53cd\u9988\u5f15\u8d77\u7684 token \u4f3c\u7136\u53d8\u5316\uff0c\u5b9a\u4f4d\u6a21\u578b\u201c\u6539\u53d8\u4e3b\u610f\u201d\u7684\u5173\u952e\u4f4d\u7f6e\u5e76\u4ece\u90a3\u91cc\u91c7\u6837\u7eed\u5199\u3002\u5b83\u5728\u4fdd\u7559\u6839\u8f68\u8ff9\u524d\u7f00\u7684\u540c\u65f6\uff0c\u53ea\u5bf9\u65b0\u751f\u6210\u540e\u7f00\u505a\u7b56\u7565\u66f4\u65b0\uff0c\u4ece\u800c\u964d\u4f4e\u751f\u6210\u6210\u672c\u5e76\u5f3a\u5316\u5173\u952e\u51b3\u7b56\u63a2\u7d22\u3002", "categories": ["cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2609.36864", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u7528 hindsight-induced token log-likelihood \u53d8\u5316\u9009\u62e9\u5206\u652f\u70b9\uff0c\u66ff\u4ee3\u5b8c\u5168\u72ec\u7acb\u91c7\u6837\u6574\u6761\u8f68\u8ff9\u3002", "\u6bcf\u7ec4\u8bad\u7ec3\u53ea\u751f\u6210\u5c11\u91cf\u5b8c\u6574\u6839\u8f68\u8ff9\uff0c\u518d\u4ece\u5173\u952e\u4f4d\u7f6e\u8865\u5145 continuation\uff0c\u51cf\u5c11 rollout token \u5f00\u9500\u3002", "\u5728\u6570\u5b66\u3001\u4ee3\u7801\u548c\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\uff0c\u76f8\u6bd4 GRPO \u6700\u9ad8\u51cf\u5c11 2.5 \u500d\u751f\u6210 token\u3001\u63d0\u5347 1.8 \u500d rollout \u901f\u5ea6\uff0c\u5e76\u5728\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u6700\u9ad8\u63d0\u5347 12.5 \u5206\u3002"], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u53ef\u9a8c\u8bc1\u5956\u52b1", "\u91c7\u6837\u6548\u7387", "\u667a\u80fd\u4f53"], "num_comments": 1, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2609.36864v1", "published_at": "2026-09-29", "score": 0.466, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2609.36864.png", "title": "Where the Model Changes Its Mind: Hindsight-Divergence Localization for Efficient Reinforcement Learning with Verifiable Rewards", "tldr": "\u7528\u540e\u89c1\u5206\u6b67\u5b9a\u4f4d\u5173\u952e\u5206\u652f\uff0c\u63d0\u5347RLVR\u6548\u7387\u3002", "upvotes": 3, "what_it_is": "\u8bba\u6587\u63d0\u51fa Hindsight-Divergence Localization\uff08HDL\uff09\uff0c\u901a\u8fc7\u5b8c\u6210\u8f68\u8ff9\u53cd\u9988\u5f15\u8d77\u7684 token \u4f3c\u7136\u53d8\u5316\uff0c\u5b9a\u4f4d\u6a21\u578b\u201c\u6539\u53d8\u4e3b\u610f\u201d\u7684\u5173\u952e\u4f4d\u7f6e\u5e76\u4ece\u90a3\u91cc\u91c7\u6837\u7eed\u5199\u3002\u5b83\u5728\u4fdd\u7559\u6839\u8f68\u8ff9\u524d\u7f00\u7684\u540c\u65f6\uff0c\u53ea\u5bf9\u65b0\u751f\u6210\u540e\u7f00\u505a\u7b56\u7565\u66f4\u65b0\uff0c\u4ece\u800c\u964d\u4f4e\u751f\u6210\u6210\u672c\u5e76\u5f3a\u5316\u5173\u952e\u51b3\u7b56\u63a2\u7d22\u3002", "why_notable": "\u8be5\u65b9\u6cd5\u9488\u5bf9 RLVR \u4e2d rollout \u6210\u672c\u9ad8\u3001\u63a2\u7d22\u4e0d\u805a\u7126\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u4e86\u4e00\u79cd\u7b80\u5355\u6709\u6548\u7684\u5206\u652f\u91c7\u6837\u673a\u5236\uff0c\u5728\u66f4\u4f4e\u751f\u6210\u9884\u7b97\u4e0b\u4ecd\u63d0\u5347\u6027\u80fd\uff0c\u5177\u6709\u8f83\u5f3a\u8bad\u7ec3\u6548\u7387\u4ef7\u503c\u3002"}, {"abstract": "A foundation model should not act in isolation as an embodied agent. Yet, existing methods often optimize individual components of the agent stack, such as memory, context, skills, or action interfaces, rather than treating the supporting system itself as a unified policy. Moreover, interaction alone does not yield self-improvement unless execution experience is converted into persistent, validated system changes. We therefore propose RoboFoundry, the first embodied agentic framework that formulates this process as Self-Evolving System-as-Policy. RoboFoundry diagnoses capability gaps in decision-making and memory management, converts execution traces into validated task-specific system updates, and promotes recurring improvements to the general system. Evolution operates over two complementary surfaces: a context system that manages active internal context and persistent file-system memory, and a hierarchical skill system that organizes atomic skills, reusable compositions, and failure-conditioned recovery. A shared semantic interface separates embodiment-invariant decisions from embodiment-specific execution, allowing evolved system capabilities to transfer across heterogeneous robots. On EmbodiedBench, RoboFoundry achieves state-of-the-art performance, notably improving GPT-5.5 by 27.8%. It also brings Qwen3.7-Plus to near parity with GPT-5.5 (70.3% vs. 72.7%), showing consistent gains from system-as-policy evolution across foundation models. For long-horizon memory, RoboFoundry outperforms all baselines on RoboMemArena by at least 39.0%, even against methods assisted by external foundation models. On LIBERO-PRO, it further outperforms Cap-Agent0 by 243.8%-679.7% across all perturbation types. In real-world deployments, RoboFoundry demonstrates zero-shot transfer and online evolution across robots and tasks, highlighting its potential for fully autonomous embodied agents.", "arxiv_id": "2609.32862", "arxiv_url": "https://arxiv.org/abs/2609.32862", "authors": ["Jingsong Liang", "Shuhao Liao", "Shizhe Zhang", "Diyuan Hou", "Yuxin Cai", "Xinjian Deng", "Chengyang He", "Wenhui Huang", "Runjia Tan", "Zhidong Wang", "Lan Yu", "Xuesong Tian", "Guillaume Sartoretti", "Jie Luo", "Yao Mu", "Wenjun Wu", "Wanhua Li", "Chen Lv"], "brief": "RoboFoundry \u63d0\u51fa\u201c\u7cfb\u7edf\u5373\u7b56\u7565\u201d\u7684\u81ea\u8fdb\u5316\u5177\u8eab\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u4e0d\u518d\
