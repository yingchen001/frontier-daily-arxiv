<script>
const PAPERS = [{"abstract": "We present \\textbf{DreamX-Phi 1.0}, an action-conditioned video world model for robotic manipulation that, given an observed frame, a language instruction, and a prescribed action sequence comprising end-effector poses and gripper states, predicts the resulting future observations. Yet realism alone does not guarantee faithfulness: a convincing rollout can still move the wrong arm or lose the manipulated object. To ensure the prediction respects each arm\u0027s commanded path, we inject per-arm $\\mathrm{SE}(3)$ transformations into attention via \\textbf{PRoPE-style geometric encoding}, preserving arm identity and rigid-motion structure. Action control alone does not fully constrain scene geometry or the evolution of small manipulated objects. We therefore add a lightweight \\textbf{depth branch} for scene-level geometry and use \\textbf{SAM3 masks} with a frozen \\textbf{V-JEPA teacher} to maintain object consistency throughout grasping. We further distill the multi-step generator into a few-step student via distribution-matching distillation for efficient deployment. At the time of writing, \\model{} achieves first place on Track~1 and second place on Track~2 of the WorldArena~2.0 Challenge. Our model and code will be publicly available.", "arxiv_id": "2608.13489", "arxiv_url": "https://arxiv.org/abs/2608.13489", "authors": ["DreamX Team", "Rui Chen", "Xiangxiang Chu", "Geng Li", "Jifan Li", "Qingfeng Shi", "Datao Tang", "Jing Tang", "Jun Wang", "Pengfei Zhang"], "brief": "", "categories": ["cs.CV", "cs.RO"], "github_repo": "https://github.com/AMAP-ML/DreamX-Phi", "github_stars": 23, "hf_url": "https://huggingface.co/papers/2608.13489", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "alibaba", "pdf_url": "https://arxiv.org/pdf/2608.13489v1", "published_at": "2026-08-13", "score": 0.379, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Qwen/Alibaba", "HF trending (60\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13489.png", "title": "DreamX-Phi 1.0: Action-Conditioned Video World Model for Robotic Manipulation", "tldr": null, "upvotes": 60, "what_it_is": null, "why_notable": null}, {"abstract": "Estimating human gaze targets from images in-the-wild is an important and formidable task. Existing approaches primarily employ brittle, multi-stage pipelines that require explicit inputs, like head bounding boxes and human pose, in order to identify the subject of gaze analysis. As a result, detection errors can cascade and lead to failure. Moreover, these prior works lack the flexibility of specifying the gaze analysis task via natural language prompting, an approach which has been shown to have significant benefits in convenience and scalability for other image analysis tasks. To overcome these limitations, we introduce the Promptable Gaze Target Estimation (PGE) task, a new end-to-end, concept-driven paradigm for gaze analysis. PGE conditions gaze prediction on flexible user text or visual prompts (e.g., \"the boy in the red shirt\" or \"person in point [0.52, 0.48]\") to identify a specific subject for gaze analysis. This approach integrates subject localization with gaze estimation, and eliminates the rigid dependency on intermediate analysis stages. We develop a scalable data engine to generate Gaze-Co (Gaze Estimation with Concepts), a dataset and benchmark of 120K high-quality, prompt-annotated image pairs. We also propose GazeAnywhere, the first model designed for PGE. GazeAnywhere uses a transformer-based detector to fuse features from frozen encoders and simultaneously solves subject localization, in/out-of-frame presence, and gaze target heatmap estimation. GazeAnywhere achieves state-of-the-art performance on multiple PGE benchmarks, setting a strong baseline for this new problem even on a difficult out-of-domain, real-world clinical dataset. GazeAnywhere is open-sourced in github.com/IrohXu/GazeAnywhere.", "arxiv_id": "2608.11367", "arxiv_url": "https://arxiv.org/abs/2608.11367", "authors": ["Xu Cao", "Houze Yang", "Vipin Gunda", "Zhongyi Zhou", "Tianyu Xu", "Adarsh Kowdle", "Inki Kim", "James M. Rehg"], "brief": "", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/IrohXu/GazeAnywhere", "github_stars": 21, "hf_url": "https://huggingface.co/papers/2608.11367", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": "Google", "pdf_url": "https://arxiv.org/pdf/2608.11367v1", "published_at": "2026-08-11", "score": 0.331, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Google", "HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11367.png", "title": "Gaze Target Estimation Anywhere with Concepts", "tldr": null, "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Autoregressive transformers compute along two axes: horizontally across generated tokens, and vertically through model depth. Dense attention gives each token broad horizontal access to the past, but the vertical feedback channel between decoding steps remains narrow: only the sampled token returns to the bottom of the stack, while the top-layer hidden state is discarded. We introduce the \\emph{full-bandwidth transformer}, which widens this channel with \\emph{latent feedback}: at each decoding step, the previous top-layer hidden state is fused with the sampled token embedding through a gated linear unit and fed back as the next input. Latent feedback lets non-verbalized computation re-enter the stack with a renewed depth budget, while preserving the standard transformer architecture, KV cache, and language-modeling objective. To train full-bandwidth transformers without losing parallel teacher forcing, we use a scheduled multi-pass objective that introduces latent feedback late in pretraining and mixes a small fraction of deeper feedback passes for stability. We train 1B-parameter full-bandwidth transformers up to 400B tokens and find that latent feedback improves validation loss, 5-shot language-model evaluation, math and coding generation, and instruction-tuned performance. With negligible per-token decoding overhead, full-bandwidth transformers match or approach standard transformers trained with roughly $1.5\\times$ more tokens, and manage to produce shorter reasoning traces at equal or better accuracy.", "arxiv_id": "2608.08888", "arxiv_url": "https://arxiv.org/abs/2608.08888", "authors": ["Xi Wang", "Ziyang Cai", "Zheng Zhan", "Harry Dong", "Ying Fan", "Gustavo de Rosa", "Tim Pearce", "John Langford"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08888", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": "Microsoft Research", "pdf_url": "https://arxiv.org/pdf/2608.08888v1", "published_at": "2026-08-09", "score": 0.288, "selected_reasons": ["\u77e5\u540d\u673a\u6784: Microsoft", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08888.png", "title": "Full-bandwidth transformer", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "Simulating societies of many large language model (LLM) agents is expensive, yet the questions asked of such simulations are usually macroscopic: phase behaviour, stylised facts, and scaling with the number of agents $N$, not the cognition of any single agent. We turn a statistical-physics observation into a method: replace each LLM agent by a low-parameter model fitted from a few hundred to a few thousand cheap queries, then run the society at any $N$ on a laptop. Whether this works is decided before the simulation runs, chiefly by what each agent perceives. We introduce an [interaction order x memory] taxonomy that maps perception and memory to an effective theory and a predicted $N$-trend of the surrogate error. We validate it on a faithful reimplementation of the LLM macroeconomy EconAgent and seven further named LLM simulations, with agent decisions cloned from genuine LLM elicitations (primarily DeepSeek) for a few dollars; the predicted error trends hold cell by cell, and the two refuted predictions, both on a strongly saturating response and traced to its curvature, are themselves matched quantitatively by the theory with no free parameters.", "arxiv_id": "2608.11215", "arxiv_url": "https://arxiv.org/abs/2608.11215", "authors": ["Igor Itkin"], "brief": "", "categories": ["cs.AI", "cond-mat.stat-mech", "cs.CL", "cs.LG", "cs.MA", "physics.soc-ph"], "github_repo": "https://github.com/YehudaItkin/poor-mans-agentic-modeling", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11215", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11215v1", "published_at": "2026-07-19", "score": 0.274, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11215.png", "title": "Poor Man\u0027s Agentic Modeling: Simulating Large LLM-Agent Societies on a Laptop", "tldr": null, "upvotes": 4, "what_it_is": null, "why_notable": null}, {"abstract": "The rapid advancement of Large Language Models (LLMs) is revolutionizing AI for Games by enabling open-ended and fluid interactive storytelling. However, existing research has largely overlooked the critical challenge of maintaining long-horizon logical consistency and narrative integrity against unconstrained user interventions. To address this, we formulate this challenge as Narrative Commitment Preservation (NCP), and take interactive narrative as our testbed. We introduce NCP-Bench, a benchmark of 100 narrative environments derived from movie synopses. Each environment includes a structured narrative specification (trajectory, commitments, and initial facts) that we can automatically check throughout the interaction between the player agent and the narrator agent. Experiments across state-of-the-art LLMs reveal a substantial long-horizon consistency gap: high linguistic quality does not guarantee commitment preservation; even strong models frequently generate logically conflicting content under adversarial interventions, with the best-performing model (GPT-5.2) achieving only 42% survival rate after 20 turns and fact conflict rates ranging from 40% to 68% across models, and only isolated runs satisfying all achievement commitments within the 100-turn limit.", "arxiv_id": "2608.08160", "arxiv_url": "https://arxiv.org/abs/2608.08160", "authors": ["Yingpeng Ma", "Jianhao Yan", "Bei Shi", "Ka Hou Kam", "Runnan Wang", "Xuebo Liu", "Yulong Chen", "Yue Zhang", "Derek F. Wong"], "brief": "", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/yingpengma/NCP-Bench", "github_stars": 26, "hf_url": "https://huggingface.co/papers/2608.08160", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.08160v1", "published_at": "2026-08-08", "score": 0.273, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (26\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08160.png", "title": "Can LLM Agents Stick to the Script? A Benchmark for Long-Horizon Consistency in Interactive Narratives", "tldr": null, "upvotes": 26, "what_it_is": null, "why_notable": null}, {"abstract": "Transforming multimodal sources into condensed and structured media outputs can be fundamentally conceptualized as a long-horizon agentic process centered on a model-harness system. While an ideal harness system should align with human design priors and accumulate reusable experience through empirical exploration to drive recursive self-improvement, existing paradigms remain static and fall short of this capability. In this paper, we present AutoDesign, a framework that aligns with human design priors, where a meta-harness optimizer guides a code agent to recursively improve harness based on rollout feedback. To instantiate and evaluate this framework, we focus on the academic paper-to-poster generation task and introduce PosterBench, comprising a 100-paper Main Track spanning five disciplines and PosterBench-mini, a shared 10-paper subset for controlled evaluation. On the PosterBench Main Track, AutoDesign achieves the highest score of 78.32, surpassing the closed-source commercial system Claude Design by 7.45 points. Across seven controlled code-agent-model configurations, integrating the learned DesignHarness consistently improves performance, increasing the average PosterBench Score from 54.99 to 67.39 (+12.4%). In a fully autonomous long-horizon loop, it executes 253 tool calls and 11 editing turns within 40 minutes for under $3, reaching average conference-poster quality in human evaluation. A system-blind human study further demonstrates that AutoDesign achieves the highest human preference among evaluated systems.", "arxiv_id": "2608.13560", "arxiv_url": "https://arxiv.org/abs/2608.13560", "authors": ["Yaxin Luo", "Haobin Jiang", "Jialv Zou", "Xu Huang", "Wenhao Yan", "Haodong Li", "Zhengrong Yue", "Jing Li", "Xiaofu Chen", "Xiaohan Zhao", "Jiacheng Liu", "Jiacheng Cui", "Zhiqiang Shen", "Xiaotong Li"], "brief": "", "categories": ["cs.CV", "cs.AI", "cs.CL"], "github_repo": "https://github.com/Yaxin9Luo/AutoDesign", "github_stars": 7, "hf_url": "https://huggingface.co/papers/2608.13560", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "meituan", "pdf_url": "https://arxiv.org/pdf/2608.13560v1", "published_at": "2026-08-13", "score": 0.258, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (26\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13560.png", "title": "AutoDesign: Meta-Harness Optimization for Long-Horizon Agentic Design", "tldr": null, "upvotes": 26, "what_it_is": null, "why_notable": null}, {"abstract": "An LLM agent\u0027s capability depends not only on model weights but on its harness: prompts, tools, skills, and control flow. Self-improvement loops already edit harnesses, yet single-lineage search is path-dependent and local wins often regress other tasks. We introduce DarwinX, which treats self-evolution as selection over a population of harnesses with the model frozen: a preserve-and-extend contract admits only variants that extend coverage without regressing, an archive keeps alternative lineages for recombination, and failure-, teacher-, and self-derived evidence share one edit interface. Fitness comes from each benchmark\u0027s own verifier: no gold solutions, no hand-picked winners. Across four benchmarks that progressively separate the evolution signal from the test, one loop adds about 17 points on average: Terminal-Bench 2.1 rises +7.7 to 83.2% on a matched base and to the verified frontier at 84.7% on a stronger one; TerminalWorld\u0027s held-out split reaches 68.3%, ahead of every off-the-shelf agent; WebArena-Infinity real-task pass@1 rises from 43.5% to 93.0% audit-clean; and a Terminal-Bench 2.1 harness transfers unchanged to SWE-bench Verified. What evolves is general agent competence, not benchmark-specific patches, so it survives changes of task, verifier, and base model. A frozen model need not be a fixed agent: harness selection turns evaluation compute into durable capability.", "arxiv_id": "2608.07545", "arxiv_url": "https://arxiv.org/abs/2608.07545", "authors": ["Yifan Zhang", "Yutong Dai", "Juntao Tan", "Luyu Yang", "Rishi Mullur", "Thai Hoang", "Zhiyuan Hu", "James Zhu", "Phil Mui", "Silvio Savarese", "Ran Xu", "Zeyuan Chen"], "brief": "", "categories": ["cs.NE", "cs.AI", "cs.LG", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.07545", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Salesforce AI Research", "pdf_url": "https://arxiv.org/pdf/2608.07545v1", "published_at": "2026-07-31", "score": 0.245, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (31\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.07545.png", "title": "DarwinX: Evolving Agent Harnesses Through Natural Selection", "tldr": null, "upvotes": 31, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon LLM agents must preserve information from past interactions to support future tasks. Existing memory systems typically rely on eager consolidation, invoking LLMs after each interaction to extract, summarize, or update memories. This design makes memory construction increasingly costly as conversations grow. Coarse summarization can reduce construction cost but risks discarding fine-grained contextual evidence, whereas larger retrieval contexts or multi-hop LLM reasoning shift the overhead to query time. We present LycheeMemory V2, an efficient long-term memory framework that replaces turn-level consolidation with semantic segment-level consolidation. Instead of consolidating every interaction, LycheeMemory batches multiple exchanges into segments and encodes each finalized segment into context-independent typed memory records. Segment-level batching lowers LLM encoding frequency, while semantic boundary detection helps preserve coherent event-level and temporal evidence compared with fixed-window batching. The resulting records are organized with lightweight structured indexes for query-planned evidence retrieval. Experiments using GPT-4.1-Mini show that LycheeMemory achieves state-of-the-art performance, reaching 89.22% on LoCoMo and 92.20% on LongMemEval-S. Compared with A-Mem, it reduces construction tokens by 86.0% on LoCoMo and 75.9% on LongMemEval-S without increasing query-time token usage. More broadly, our results suggest that the accuracy--cost trade-off of long-term agent memory depends not only on what information is retained, but also on the granularity at which it is consolidated.", "arxiv_id": "2608.12990", "arxiv_url": "https://arxiv.org/abs/2608.12990", "authors": ["Dongfang Li", "Zixuan Liu", "Junmai Wang", "Jiahe Huang", "Fuhao Li", "Bonian Jia", "Baotian Hu", "Min Zhang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/LycheeMem/LycheeMem", "github_stars": 1159, "hf_url": "https://huggingface.co/papers/2608.12990", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12990v1", "published_at": "2026-08-13", "score": 0.244, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12990.png", "title": "LycheeMemory V2: Efficient Long-Term Memory for LLM Agents via Semantic Segment-Level Consolidation", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Scientific discovery increasingly requires AI systems that can reason over scientific evidence of heterogeneous modalities, interact with scientific tools and environments, and sustain progress across long task horizons. We present Intern-S2-Preview, a series of scientific agentic foundation models designed to support multimodal scientific understanding, reasoning, generation, and long-horizon tasks. The training pipeline begins with scientific multimodal pre-training over rendered scientific documents, interleaved image-text data, and diverse scientific corpora. Starting from the pretrained checkpoint, we apply a unified post-training pipeline consisting of supervised fine-tuning, scalable multi-task reinforcement learning (RL), black- and white-box agentic RL, and on-policy distillation. This pipeline is supported by practical techniques that improve rollout and training stability and efficiency, including partial rollout with off-policy correction, adaptive length regularization, online speculative decoding, robust multi-task optimization, and trace-aware experience assembly for agentic tasks. At the architecture level, Intern-S2-Preview-397B extends time series modelling from efficient long-sequence understanding to numerical forecasting, while Memory Decoder is studied as a separate memory-augmented path for rapid scientific specialization without modifying the frozen 397B backbone. Evaluations across scientific, multimodal, agentic, and general-purpose benchmarks show that Intern-S2-Preview-397B achieves competitive or leading results in multiple settings. The time series modules improve scientific signal understanding and forecasting on SciTS, while the separate Intern-MemDec-4B extension improves the Biology-Instructions average score from 56.92 to 60.32 without modifying the frozen 397B backbone.", "arxiv_id": "2608.13505", "arxiv_url": "https://arxiv.org/abs/2608.13505", "authors": ["Lei Bai", "Jiaqi Cao", "Chiyu Chen", "Guanzhou Chen", "Kai Chen", "Guangran Cheng", "Erfei Cui", "Xuanlang Dai", "Shengyuan Ding", "Shangheng Du", "Yanhui Duan", "Yue Fan", "Youqing Fang", "Quan Gan", "Yuanyuan Gao", "Jiaye Ge", "Lixin Gu", "Yuzhe Gu", "Qipeng Guo", "Junjun He", "Xin Hong", "Ming Hu", "Zhouqi Hua", "Haian Huang", "Junhao Huang", "Zixian Huang", "Minxi Jin", "Lingkai Kong", "Alexander Lam", "Zehao Li", "Zonglin Li", "Tianhao Liang", "Dahua Lin", "Junyao Lin", "Tianyang Lin", "Zhouhan Lin", "Jiangning Liu", "Jin Liu", "Kuikun Liu", "Wenran Liu", "Yifei Liu", "Yuhong Liu", "Yuhong Liu", "Zhoumianze Liu", "Ziyan Liu", "Ziyu Liu", "Haijun Lv", "Han Lv", "Chengqi Lyu", "Le Ma", "Ningsheng Ma", "Zerun Ma", "Haoyang Peng", "Runyu Peng", "Jifei Shan", "Zixin Shang", "Kou Shi", "Xiang Shi", "Qisheng Su", "Xuerui Su", "Hao Sun", "Xiao Sun", "Yanan Sun", "Yu Sun", "Huanze Tang", "Yinghao Tang", "Wenhui Tian", "Zhongbo Tian", "Bingli Wang", "Haomin Wang", "Jiarui Wang", "Jingzhi Wang", "Rui Wang", "Xiquan Wang", "Yi Wang", "Zhecan Wang", "Ziyi Wang", "Zun Wang", "Rubin Wei", "Lianyi Wu", "Wen Wu", "Yue Wu", "Yuhan Wu", "Zhenyu Wu", "Zijian Wu", "Shuhao Xing", "Jun Xu", "Xingle Xu", "Xuenan Xu", "Xiangchao Yan", "Ziang Yan", "Bowen Yang", "Danni Yang", "Lin Yang", "Zhiqi Yang", "Qian Yao", "Haochen Ye", "Peng Ye", "Jinhui Yin", "Jiashuo Yu", "Dingbo Yuan", "Fei Yuan", "Yuhang Zang", "Bo Zhang", "Chao Zhang", "Chen Zhang", "Hongjie Zhang", "Junming Zhang", "Wenlong Zhang", "Wenwei Zhang", "Yiming Zhang", "Zhuo Zhang", "Ziyang Zhang", "Haiteng Zhao", "Penghao Zhao", "Yibo Zhao", "Zhonghan Zhao", "Zhihang Zhong", "Bowen Zhou", "Peiheng Zhou", "Xin Zhou", "Xinyu Zhou", "Yunhua Zhou", "Dongsheng Zhu", "Yicheng Zou"], "brief": "", "categories": ["cs.LG", "cs.CL", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13505", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13505v1", "published_at": "2026-08-13", "score": 0.242, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (34\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13505.png", "title": "Intern-S2-Preview: Scientific Agentic Foundation Model", "tldr": null, "upvotes": 34, "what_it_is": null, "why_notable": null}, {"abstract": "Spatial intelligence is becoming a foundation for embodied agents, robotic planning, and multimodal assistants. To improve the spatial reasoning ability of VLM agents, existing work has mainly followed two lines. One line uses post-training methods, such as supervised fine-tuning and reinforcement learning. Another line adopts an agentic paradigm in which the model calls external spatial tools, such as depth estimation and 3D reconstruction tools, to gather intermediate spatial evidence. We study a complementary and underexplored route: Can a frozen VLM agent improve its spatial reasoning through \\textbf{parameter-update-free self-evolution}, without depending on external expert spatial tools at inference time? We present \\textbf{Spatial Memory Agent (SMA)}, an \\textbf{experience-grounded runtime framework} that converts verified spatial experience into reusable transferable lessons. In a verifiable spatial environment, SMA queries the frozen VLM, obtains a predicted answer and reward, and uses \\textbf{verifier-guided reflection} to distill compact transferable lessons from spatial experience. SMA further assigns each lesson a \\textbf{Transfer Reliability Score (TRS)}, which is initialized uniformly and calibrated from later retrieval outcomes as visit evidence of future transfer reliability. During \\textbf{read-only deployment}, SMA retrieves lessons by semantic filter and similarity-TRS combined ranking, allowing the retrieved memory to guide frozen model inference. Across five representative spatial benchmarks and four base VLMs, SMA achieves the highest macro average in every base-model block and the best accuracy among the evaluated methods in most of the 20 evaluations, establishing a practical parameter-update-free path for spatial self-evolution across the evaluated frozen model scales and environments.", "arxiv_id": "2608.12743", "arxiv_url": "https://arxiv.org/abs/2608.12743", "authors": ["Haokai Zhang", "Yuhang Ding", "Yunshu Zhou", "Xinze Du", "Shengtao Zhang", "Zhiyue Zhao", "Yuling Xi", "Hao Chen"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12743", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 1, "on_hf": true, "organization": "Zhejiang University", "pdf_url": "https://arxiv.org/pdf/2608.12743v1", "published_at": "2026-08-13", "score": 0.238, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (24\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12743.png", "title": "Spatial Memory Agent: Experience-Grounded Procedure Memory for Spatial Intelligence", "tldr": null, "upvotes": 24, "what_it_is": null, "why_notable": null}, {"abstract": "Machine learning theory studies learning procedures through mathematical setups in which the data model, training protocol, oracle access, loss, metric, and randomness define the phenomenon that a theorem is meant to explain. Solving an open problem therefore requires the problem formulation, theorem target, and proof mechanism to be developed in concert. Researchers formulate hypotheses, test them through preliminary theoretical or empirical analysis, and refine both assumptions and proofs. We investigate whether this process can be organized as an autonomous agentic workflow for ML theory research. We develop VALG, an agentic system that combines multi-level Verification, Adaptive formulation of Learning-theory problems, and Graph-structured proof development. Within each source-relative theorem branch, VALG maintains a fixed mathematical specification, checks the theorem-level composition of a typed proof-dependency graph, and constructs and reviews local proofs in dependency order. When a proof attempt fails, VALG identifies whether the obstruction lies in a derivation, the proof structure, or the theorem formulation and routes the next attempt accordingly. Formulation-level obstructions initiate an explicitly related variant or relaxation, preserving the mathematical relation between the resulting theorem and the source problem. We evaluate VALG on nine subproblems from five COLT 2026 open problems. Two runs produce internally finalized theorem candidates that match the scope of their source briefs; the remaining seven yield restricted-method results, special cases, or conditional theorems. These case studies show how VALG keeps source-scope matches, relaxations, conditional results, and blocked attempts mathematically distinct. VALG is open source at https://github.com/DechenZhang/VALG-ML-Theory-Agent.", "arxiv_id": "2608.13060", "arxiv_url": "https://arxiv.org/abs/2608.13060", "authors": ["Dechen Zhang", "Xuan Tang", "Xinxiang Yin", "Xingwu Chen", "Jian Qian", "Difan Zou"], "brief": "", "categories": ["cs.AI", "cs.LG", "math.OC", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13060", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13060v1", "published_at": "2026-08-13", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "VALG: An Agentic System for ML Theory Research", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Enabling agents to learn from experience and internalize it into their policy has become a central problem in self-evolving AI. On-policy self-distillation (OPSD) offers an effective pathway by using a privileged self-teacher to provide dense supervision on the student\u0027s own trajectories; however, existing methods still rely heavily on designer-specified privileged artifacts (e.g., answers, feedback, skills, or trajectories), limiting the end-to-end learnability and scalability required for continual self-improvement. In this work, we introduce Latent On-Policy Self-Distillation (LOPD), which, rather than proposing another hand-crafted OPSD variant with a newly prescribed form of privileged context, makes the teacher\u0027s privileged context itself learnable end-to-end from experience. Technically, LOPD retrieves relevant experiences and composes them into continuous latent tokens that condition a self-teacher, while the student generates trajectories from the task and interaction history and receives dense token-level supervision at every visited prefix. We further introduce a privileged-margin objective to stabilize and regulate the learning of latent context. Empirically, LOPD demonstrates (I) strong performance, outperforming RLVR and representative OPSD methods including OPSD, SDPO, and Skill-SD across both agentic tool use and code generation; and (II) high learning efficiency, surpassing GRPO and Skill-SD with less than 30% of their rollout budget. Ablation studies further provide direct evidence that making privileged context learnable is necessary for realizing these gains. Together, these results position LOPD as a step toward a more scalable and self-directed paradigm for agent evolution.", "arxiv_id": "2608.13040", "arxiv_url": "https://arxiv.org/abs/2608.13040", "authors": ["Guibin Zhang", "Jiayang Lyu", "Ran Sun", "Xinlei Yu", "Haoyu Zhao", "Qibing Ren", "Shuicheng Yan"], "brief": "", "categories": ["cs.LG", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13040", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13040v1", "published_at": "2026-08-13", "score": 0.225, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Latent On-Policy Self-Distillation", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in foundation models have enabled AI scientists to automate increasingly complete research workflows, from hypothesis generation and code execution to manuscript preparation. Yet workflow coverage alone does not provide access to the full evidence on which scientific discovery depends. Existing systems typically reason over text, code, labels, or precomputed summaries, leaving scientifically decisive spatial, temporal, cross-channel, and procedural relations unavailable to the agent. We introduce OmniScientist, an end-to-end, omni-modal AI scientist that conducts multidisciplinary research directly from heterogeneous raw evidence. A perception layer and 3 autonomous agents for ideation, experiment, and writeup operate within a deterministic pipeline, allowing observations to shape research questions, experimental decisions, and final claims throughout the research lifecycle. By running idea, rigour, and claim checks in code, the system enforces novelty screening, statistical validity, execution provenance, and numerical traceability. We evaluate OmniScientist on 36 real-data cases spanning 5 discipline families, 4 families of scientific evidence, and modalities including images, signals, audio, video, 3-D structures, trajectories, tables, formulae, and graphs. The system completes the full path from raw data to a compiled manuscript in all 36 cases and achieves a mean overall paper score of 6.3 with the reference reasoning backbone. In paired comparisons against a blind variant that receives only precomputed scalar features, direct perception improves all 7 evaluation dimensions and wins 85% of head-to-head judgments. These results show that lifecycle-wide perception is essential for evidence-grounded scientific discovery and provides a practical path toward broadly capable AI scientists.", "arxiv_id": "2608.13558", "arxiv_url": "https://arxiv.org/abs/2608.13558", "authors": ["Bobo Li", "Hao Fei", "Tianjie Ju", "Mong-Li Lee", "Wynne Hsu"], "brief": "", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13558", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13558v1", "published_at": "2026-08-13", "score": 0.179, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13558.png", "title": "OmniScientist: An Omni-Modal Omni-Discipline AI Scientist", "tldr": null, "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents operate in persistent environments where early state changes can influence decisions far into the future. Unlike conventional language-model interactions, agent behavior is mediated through a shared state that is repeatedly modified and reused across long-horizon workflows. Current safety benchmarks often fail to capture these cumulative risks because they focus on short, static tasks. To address these limitations, we introduce OpenART, an open-ended arena for scalable agent red teaming through environment evolution. OpenART provides over 10,000 validated stateful scenarios across 50 domains, drawing from a pool of more than 500,000 tools and skills. These tasks require a median of 97 tool calls and enable unified evaluation across 75 different agent-model configurations. To systematically explore these evolving attack surfaces, we propose the Evolutionary Markov Hypergraph Attack (EMHA). EMHA is a black-box policy that performs feedback-driven environment evolution by coordinating authorized state transitions without requiring parameter updates. Throughout the evaluation, task objectives remain fixed while only the environment state changes. Across all configurations, EMHA achieves a pooled Attack Success Rate (ASR) of 85.0%. Its advantage over instruction-only evolution increases from approximately 2% on simple environments to over 17% on the most complex ones, demonstrating that environment evolution increasingly exposes safety failures as task complexity grows. Furthermore, our analysis shows that the specific runtime implementation of an agent explains a significant portion of safety variation beyond the underlying model\u0027s capabilities. These results establish OpenART as a scalable foundation for studying agent safety in complex, evolving environments.", "arxiv_id": "2608.00677", "arxiv_url": "https://arxiv.org/abs/2608.00677", "authors": ["Yunhao Chen", "Xin Wang", "Yixu Wang", "Yi Liu", "Jie Li", "Yan Teng", "Xingjun Ma", "Xia Hu", "Yu-Gang Jiang"], "brief": "", "categories": ["cs.CL"], "github_repo": "https://github.com/AI45Lab/OpenART", "github_stars": 15, "hf_url": "https://huggingface.co/papers/2608.00677", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 4, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.00677v1", "published_at": "2026-08-01", "score": 0.178, "selected_reasons": ["HF trending (250\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.00677.png", "title": "OpenART: Scaling Agent Red Teaming via Open-Ended Environment Evolution", "tldr": null, "upvotes": 250, "what_it_is": null, "why_notable": null}, {"abstract": "Autonomous agents are increasingly capable of improving models, systems, and other technical artifacts through long-horizon experimentation. To understand the current state of this capability, however, evaluation must go beyond final scores, which neither reveal where progress is gained or lost nor indicate whether accumulated experience improves later decisions. We therefore present a systematic evaluation of seven frontier models on 36 long-horizon tasks based on a new framework that uses rule-based metrics to characterize within-run behavior through Solution Framing, Execution, and Feedback Control and controlled comparisons to assess experience reuse within and across tasks. The results show that current agents operate more like engineering optimizers than fully autonomous researchers: they can formulate and implement practical solutions, but their performance varies substantially across runs, their strongest solutions mainly adapt or combine established techniques, and genuine methodological novelty remains rare. Detailed analysis reveals that observed performance is shaped by multiple factors, including distinct process bottlenecks behind similar final outcomes, experience reuse that can help or mislead subsequent decisions, and harness designs that affect performance stability. These findings suggest concrete directions for improving model training, inference-time strategies, experience management, and harness design.", "arxiv_id": "2608.13417", "arxiv_url": "https://arxiv.org/abs/2608.13417", "authors": ["Yiwei Li", "Wanli Yang", "Hexiang Tan", "Xiangzhou Huang", "Zhengyu Chen", "Ziran Li", "Borun Chen", "Shanglin Lei", "Huaisheng Zhu", "Hao Tian", "Fei Sun", "Xunliang Cai", "Jingang Wang"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13417", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13417v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Final Scores: A Systematic Evaluation of Agents for Long-Horizon AI Research and Development", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The evaluation of LLM reasoning is moving from final-answer accuracy to process-level assessment, yet existing methods still fail to capture how models plan reasoning paths and allocate reasoning resources--that is, how they organize search. Prior process-level methods focus on the coherence and redundancy of chain-of-thought (CoT), and most benchmark tasks have a single objective solvable by static capabilities such as derivation and tool use, leaving search organization unmeasured. We introduce TsuGO, a process-level reasoning benchmark for evaluating Search Efficiency in LLM reasoning through Go life-and-death problems. These problems provide closed and verifiable solution spaces with an inherent adversarial structure, making candidate generation, response checking, branch comparison, and backtracking necessary parts of reasoning rather than incidental trace patterns. By constraining the solution space, TsuGO disentangles domain knowledge from search organization, parses CoT into a structured search tree, and reports Search Efficiency together with Token Efficiency and other diagnostic metrics and visualizations. Experiments show that current LLMs remain far from stable tsumego solving: stronger models succeed by finding the correct candidate earlier and sustaining effort on productive branches, but most models still behave much closer to unguided search algorithms than to neural-guided KataGo. Longer CoT or higher Token Efficiency does not necessarily imply better search. Our results identify search organization and reasoning-resource allocation as missing dimensions in LLM reasoning evaluation.", "arxiv_id": "2608.13221", "arxiv_url": "https://arxiv.org/abs/2608.13221", "authors": ["Shunwen Bai", "Ziping Ma", "Chaoyang Zhang", "Yarong Wang", "Jiale Liu", "Zhen Qin", "Qingpei Guo"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13221", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13221v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "TsuGO: Probing Search Efficiency in LLM Reasoning via Go Life-and-Death Problems", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Reinforcement learning with verifiable rewards (RLVR) offers a verifier-bounded performance ceiling for training multi-turn tool-use agents, yet its trajectory-level credit assignment conflates heterogeneous per-turn outcomes into a single reward signal. On-policy distillation provides dense per-token supervision but is either teacher-bounded or prone to gradient concentration collapse. We introduce $\\textbf{CrEST}$, a hierarchical credit assignment framework that retains RL\u0027s verifier-bounded ceiling while incorporating dense token-level signals from a privileged self-teacher. $\\textbf{CrEST}$ resolves credit at two levels: turn-segmented verified advantages address inter-turn dilution, while entropy-gated self-teacher modulation refines intra-turn token contributions. Experiments on BFCL V3 and WildToolBench show that $\\textbf{CrEST}$ consistently outperforms both RL and distillation baselines across two model scales, with the largest gains on long-trajectory and strict session-level metrics. Our work demonstrates that the teacher\u0027s role in policy optimization can be reduced from determining update directions to modulating update magnitudes, unlocking dense credit assignment without sacrificing the verifier-bounded ceiling.", "arxiv_id": "2608.13179", "arxiv_url": "https://arxiv.org/abs/2608.13179", "authors": ["Zechuan Wang", "Siyuan Lu", "Hongxuan Zhang", "Linjian Mo", "Chenyi Zhuang", "Leilei Gan"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13179", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13179v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Teach the Magnitude, Not the Direction: Verifier-Bounded Credit Assignment for Multi-Turn Multi-step LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent skills are crucial external instructions that enable language agents to execute long procedural tasks such as coding or document processing. Existing agent skills are primarily created through human manual crafting or agent execution traces, with limited understanding of how each step contributes to overall skill performance on specific tasks; i.e., there remains an open problem in quantifying the contribution of individual steps within an agent skill. To address this issue, we first model skill-step attribution as a Shapley value-based contribution estimation problem, and then propose SkillShapley, a step-level attribution framework for agent skills. Notably, SkillShapley operates in two phases, motivated by key empirical insights, i.e., discretized benchmark rewards that create sharp performance cliffs, and step interactions that are largely additive rather than synergistic. Specifically, it first identifies informative coalitional regions, and then adaptively samples new coalitions that can yield reusable marginal evidence. Experiments on skills from the widely adopted SkillsBench demonstrate that our SkillShapley can effectively and efficiently identify high- or low-value skill steps, providing several key takeaways for agent skill creation.", "arxiv_id": "2608.13173", "arxiv_url": "https://arxiv.org/abs/2608.13173", "authors": ["Chang Liu", "Yuqi Zhang", "Yiman Zhong", "Boyi Liu", "Hengjun Wang", "Shuyue Wei"], "brief": "", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13173", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13173v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "SkillShapley: Boundary-Adaptive Shapley Valuation for Skill Step Attribution in LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The field of bioinformatics struggles with legacy code - old code that is commonly used but may no longer have a maintainer, or may be written in an now-unfamiliar language (e.g. Perl, Fortran). This incurs maintenance cost (technical debt), but dynamically typed languages also negatively impacts the environment and fail to make use of modern hardware. Legacy code may also have security or safety problems that make it unsuited for use in clinical settings. Here we show that agentic AI, combined with static analysis, can be used to translate legacy code to the modern language Rust. We provide prompts and supporting software to aid systematic translation, and evaluate it on common software for NGS and imaging. We showcase the result on our software Bascet: Size was reduced by ~80x, build time decreased by ~10x, and performance of key steps improved \u003e3x. Unix dependencies were also removed, making Bascet the only single-cell pipeline able to run on native Windows, without a container. Large-scale refactoring of bioinformatics software is thus now possible at a limited budget, enabling more complex tools to be developed.", "arxiv_id": "2608.13029", "arxiv_url": "https://arxiv.org/abs/2608.13029", "authors": ["Johan Henriksson"], "brief": "", "categories": ["q-bio.GN", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13029", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13029v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Static analysis-guided agentic AI translation enables Rust as a full stack bioinformatics language", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The expanding operational capabilities of large language model (LLM) agents introduce sophisticated security threats. Runtime defenses have emerged as an effective approach to mitigating these risks by integrating security mechanisms into the agent execution loop. However, existing runtime defenses rely heavily on manually designed interventions and lack a principled framework for their construction and maintenance. In this work, we first develop a harness-level formulation of runtime defense that systematically characterizes how harness mechanisms enable defense construction and provides a unified view of existing runtime defense interventions from a harness perspective. Building on this formulation, we propose HARD (Harness-based Autonomous Runtime Defense Evolution), a self-evolving runtime defense framework that automatically identifies appropriate intervention strategies and iteratively improves defense artifacts based on observed failure traces. HARD transforms runtime defense development from manual engineering into an autonomous evolution process, and extensive experiments demonstrate that it improves security performance over existing handcrafted defenses while preserving benign task utility. Our findings highlight autonomous defense evolution as a promising new paradigm for securing deployed LLM agents, enabling agents to identify defense weaknesses and continuously improve their protection mechanisms.", "arxiv_id": "2608.12977", "arxiv_url": "https://arxiv.org/abs/2608.12977", "authors": ["Jiajun Ruan", "Peiyang Li", "Yukun Chen", "Fengting Li", "Chao Feng"], "brief": "", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12977", "impact_score": null, "is_agent": null, "is_top": true, "key_points": [], "keywords": [], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12977v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond Handcrafted Security: Towards Self-Evolving Defense for LLM Agents", "tldr": null, "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Self-improving LLM agents convert successful trajectories into persistent cross-task state. An unsafe success can thereby become reusable policy after its triggering input disappears. Skill evolution makes this failure measurable by distilling operational trajectories into executable, transferable, and inspectable procedures. Because evolution optimizes task outcomes rather than procedure safety, compromised experience can cause skill misevolution. Existing benchmarks measure current behavior or static artifacts but cannot attribute risk across authoring, retrieval, and later execution. To expose this lifecycle, we introduce SkillMisevo-Gym, a lifecycle-aware harness that versions skill state across agent frameworks, and SkillMisevo-Bench, a frozen design from malicious exposure to carryover tasks, with concept-aligned benign tasks and nine lifecycle metrics. We also introduce SafeEvolve, a wrapper that repairs unsafe content and governs subsequent reuse. Across 25 agent-method configurations, each covering 525 tasks in 25 episodes, all 21 evolved configurations author unsafe artifacts, while only fifteen lead to fresh-session harm. In the exposure sweep, three malicious tasks raise carryover ASR from 16.0% to 35.3%. Across representative skill evolution methods, SafeEvolve reduces unsafe retrieval and fresh-session harm by 26.7 and 17.3 percentage points, respectively, while mean benign utility changes by only 0.4 points. Together, persistent-adaptation safety must govern what updates write and what future executors reuse. Code is available at https://github.com/henrymao2004/misevolve.", "arxiv_id": "2608.12851", "arxiv_url": "https://arxiv.org/abs/2608.12851", "authors": ["Xutao Mao", "Liangjie Zhao", "Xiang Zheng", "Cong Wang"], "brief": "\u8bba\u6587\u7814\u7a76\u81ea\u6211\u6539\u8fdb LLM \u667a\u80fd\u4f53\u5728\u5c06\u6210\u529f\u8f68\u8ff9\u6c89\u6dc0\u4e3a\u53ef\u590d\u7528\u6280\u80fd\u65f6\uff0c\u53ef\u80fd\u628a\u4e00\u6b21\u4e0d\u5b89\u5168\u6210\u529f\u6f14\u5316\u4e3a\u8de8\u4efb\u52a1\u6301\u4e45\u7b56\u7565\uff0c\u5bfc\u81f4\u540e\u7eed\u65e0\u89e6\u53d1\u8f93\u5165\u4e5f\u4f1a\u4ea7\u751f\u5371\u5bb3\u3002\u4f5c\u8005\u63d0\u51fa SkillMisevo-Gym/Bench \u6765\u5ea6\u91cf\u4ece\u7f16\u5199\u3001\u68c0\u7d22\u5230\u6267\u884c\u7684\u751f\u547d\u5468\u671f\u98ce\u9669\uff0c\u5e76\u63d0\u51fa SafeEvolve \u5bf9\u4e0d\u5b89\u5168\u5185\u5bb9\u8fdb\u884c\u4fee\u590d\u4e0e\u590d\u7528\u6cbb\u7406\uff0c\u5728\u4ee3\u8868\u6027\u65b9\u6cd5\u4e2d\u663e\u8457\u964d\u4f4e\u4e0d\u5b89\u5168\u68c0\u7d22\u548c\u65b0\u4f1a\u8bdd\u5371\u5bb3\uff0c\u51e0\u4e4e\u4e0d\u5f71\u54cd\u826f\u6027\u4efb\u52a1\u6548\u7528\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12851", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u5b89\u5168\u8bc4\u6d4b", "\u81ea\u6211\u6539\u8fdb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12851v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Practice Makes Unsafe: Skill Misevolution in Self-Improving LLM Agents", "tldr": "\u8bba\u6587\u7814\u7a76\u81ea\u6211\u6539\u8fdb LLM \u667a\u80fd\u4f53\u5728\u5c06\u6210\u529f\u8f68\u8ff9\u6c89\u6dc0\u4e3a\u53ef\u590d\u7528\u6280\u80fd\u65f6\uff0c\u53ef\u80fd\u628a\u4e00\u6b21\u4e0d\u5b89\u5168\u6210\u529f\u6f14\u5316\u4e3a\u8de8\u4efb\u52a1\u6301\u4e45\u7b56\u7565\uff0c\u5bfc\u81f4\u540e\u7eed\u65e0\u89e6\u53d1\u8f93\u5165\u4e5f\u4f1a\u4ea7\u751f\u5371\u5bb3\u3002\u4f5c\u8005\u63d0\u51fa SkillMisevo-Gym/Bench \u6765\u5ea6\u91cf\u4ece\u7f16\u5199\u3001\u68c0\u7d22\u5230\u6267\u884c\u7684\u751f\u547d\u5468\u671f\u98ce\u9669\uff0c\u5e76\u63d0\u51fa SafeEvolve \u5bf9\u4e0d\u5b89\u5168\u5185\u5bb9\u8fdb\u884c\u4fee\u590d\u4e0e\u590d\u7528\u6cbb\u7406\uff0c\u5728\u4ee3\u8868\u6027\u65b9\u6cd5\u4e2d\u663e\u8457\u964d\u4f4e\u4e0d\u5b89\u5168\u68c0\u7d22\u548c\u65b0\u4f1a\u8bdd\u5371\u5bb3\uff0c\u51e0\u4e4e\u4e0d\u5f71\u54cd\u826f\u6027\u4efb\u52a1\u6548\u7528\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The extent to which large language models for code rely on memorization over genuine understanding remains highly debated. While current literature frequently reports widespread memorization, evaluating the underlying probing techniques across dense architectures reveals a severe breakdown in their utility at scale. Traditional encoder-style probes using perturbations such as synonym fuzzing or dead-code insertion struggle to expose memorization in scaled models, even on known-contaminated benchmarks, and decoder-style probes that rely on log probabilities show similar performance degradation. The specific mode of failure for these probes, particularly why such techniques disrupt smaller models but fail to impact larger ones, motivates us to untangle representation load from memorization rather than treating them as a single phenomenon. By applying invertible mathematical transforms to numeric problems, we isolate these two factors and reveal that scaled encoders successfully absorb substantial representation load while still converging on the correct family of solutions. In practical software engineering, this ability to adapt to varying surface forms is what truly matters for usability and generalizability in LLM and agentic applications. Whether a specific solution was seen during training becomes a much less pressing question because although memorization inflates scores on contaminated benchmarks, factoring out representation load makes it debatable how much we should truly care if a functional answer was originally memorized. Future evaluations must therefore be built around separating these phenomena rather than relying on methodologies that quietly entangle them.", "arxiv_id": "2608.12771", "arxiv_url": "https://arxiv.org/abs/2608.12771", "authors": ["Prateek Kumar Rajput", "Abdoul Aziz Bonkoungou", "Alberick Euraste Djir\u00e9", "Xunzhu Tang", "Yewei Song", "Iyiola Emmanuel Olatunji", "El Hacen Diallo", "Jacques Klein", "Tegawend\u00e9 F. Bissyand\u00e9"], "brief": "\u8bba\u6587\u6307\u51fa\uff0c\u73b0\u6709\u4ee3\u7801\u5927\u6a21\u578b\u8bb0\u5fc6\u5316\u68c0\u6d4b\u65b9\u6cd5\u5728\u6a21\u578b\u89c4\u6a21\u53d8\u5927\u540e\u4f1a\u660e\u663e\u5931\u6548\uff1a\u65e0\u8bba\u662f\u540c\u4e49\u6539\u5199\u3001\u63d2\u5165\u6b7b\u4ee3\u7801\u7b49\u6270\u52a8\u63a2\u9488\uff0c\u8fd8\u662f\u57fa\u4e8e\u5bf9\u6570\u6982\u7387\u7684\u89e3\u7801\u63a2\u9488\uff0c\u90fd\u96be\u4ee5\u53ef\u9760\u63ed\u793a\u5df2\u6c61\u67d3\u57fa\u51c6\u4e2d\u7684\u8bb0\u5fc6\u73b0\u8c61\u3002\u4f5c\u8005\u901a\u8fc7\u53ef\u9006\u6570\u5b66\u53d8\u6362\u533a\u5206\u201c\u8868\u5f81\u8d1f\u8f7d\u201d\u548c\u201c\u8bb0\u5fc6\u5316\u201d\uff0c\u53d1\u73b0\u5927\u6a21\u578b\u80fd\u66f4\u597d\u9002\u5e94\u8868\u9762\u5f62\u5f0f\u53d8\u5316\u5e76\u7ed9\u51fa\u6b63\u786e\u89e3\uff0c\u56e0\u6b64\u672a\u6765\u8bc4\u6d4b\u5e94\u5206\u79bb\u8fd9\u4e24\u7c7b\u56e0\u7d20\u3002", "categories": ["cs.SE", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12771", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4ee3\u7801\u5927\u6a21\u578b", "\u8bb0\u5fc6\u5316", "\u6a21\u578b\u8bc4\u6d4b", "\u6cdb\u5316\u80fd\u529b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12771v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Memorization Diagnostics for Code LLMs Should be Scale-Aware", "tldr": "\u8bba\u6587\u6307\u51fa\uff0c\u73b0\u6709\u4ee3\u7801\u5927\u6a21\u578b\u8bb0\u5fc6\u5316\u68c0\u6d4b\u65b9\u6cd5\u5728\u6a21\u578b\u89c4\u6a21\u53d8\u5927\u540e\u4f1a\u660e\u663e\u5931\u6548\uff1a\u65e0\u8bba\u662f\u540c\u4e49\u6539\u5199\u3001\u63d2\u5165\u6b7b\u4ee3\u7801\u7b49\u6270\u52a8\u63a2\u9488\uff0c\u8fd8\u662f\u57fa\u4e8e\u5bf9\u6570\u6982\u7387\u7684\u89e3\u7801\u63a2\u9488\uff0c\u90fd\u96be\u4ee5\u53ef\u9760\u63ed\u793a\u5df2\u6c61\u67d3\u57fa\u51c6\u4e2d\u7684\u8bb0\u5fc6\u73b0\u8c61\u3002\u4f5c\u8005\u901a\u8fc7\u53ef\u9006\u6570\u5b66\u53d8\u6362\u533a\u5206\u201c\u8868\u5f81\u8d1f\u8f7d\u201d\u548c\u201c\u8bb0\u5fc6\u5316\u201d\uff0c\u53d1\u73b0\u5927\u6a21\u578b\u80fd\u66f4\u597d\u9002\u5e94\u8868\u9762\u5f62\u5f0f\u53d8\u5316\u5e76\u7ed9\u51fa\u6b63\u786e\u89e3\uff0c\u56e0\u6b64\u672a\u6765\u8bc4\u6d4b\u5e94\u5206\u79bb\u8fd9\u4e24\u7c7b\u56e0\u7d20\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agentic workflows are commonly evaluated by whether they reach the correct outcome. That is insufficient in institutional settings, where a correct action may rely on the wrong authority, an unsupported completion claim, or work made stale by a later change. We define governed execution as work whose decisions, completion, and response to change are supported by inspectable provenance. We present Matrix, a deterministic causal-state layer that records authority and fact dependencies, verifies completion evidence, and selectively invalidates affected work. Across controlled comparisons, governed and direct workflows often reached the same outcomes, but only the governed path consistently preserved governing evidence, refused unsupported closure, and limited recovery to dependent tasks. A role-separated transfer challenge then failed: a deterministically enforced completeness contract severely over-blocked synthetic packets produced outside its authoring context. These results do not establish Matrix as a general accuracy enhancer; they support its primary role as an institutional integrity layer for making agentic work auditable and independently verifiable.", "arxiv_id": "2608.12761", "arxiv_url": "https://arxiv.org/abs/2608.12761", "authors": ["Jesus Salas"], "brief": "\u672c\u6587\u63d0\u51fa\u201c\u53d7\u6cbb\u7406\u6267\u884c\u201d\u6982\u5ff5\uff0c\u5f3a\u8c03\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4e0d\u4ec5\u8981\u7ed3\u679c\u6b63\u786e\uff0c\u8fd8\u8981\u80fd\u8ffd\u6eaf\u51b3\u7b56\u4f9d\u636e\u3001\u5b8c\u6210\u8bc1\u636e\u4e0e\u53d8\u66f4\u5f71\u54cd\u3002\u4f5c\u8005\u5b9e\u73b0\u4e86 Matrix \u8fd9\u4e00\u786e\u5b9a\u6027\u56e0\u679c\u72b6\u6001\u5c42\uff0c\u53ef\u8bb0\u5f55\u6743\u9650\u4e0e\u4e8b\u5b9e\u4f9d\u8d56\u3001\u9a8c\u8bc1\u5b8c\u6210\u58f0\u660e\uff0c\u5e76\u53ea\u5931\u6548\u53d7\u5f71\u54cd\u4efb\u52a1\uff1b\u5b9e\u9a8c\u663e\u793a\u5b83\u4e0d\u63d0\u5347\u4e00\u822c\u51c6\u786e\u7387\uff0c\u4f46\u80fd\u663e\u8457\u589e\u5f3a\u5ba1\u8ba1\u6027\u4e0e\u5236\u5ea6\u5b8c\u6574\u6027\u3002", "categories": ["cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12761", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u53ef\u8ffd\u6eaf\u6027", "\u5de5\u4f5c\u6d41", "\u5b89\u5168\u6cbb\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12761v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Correct Is Not Governed: Provenance Integrity in Agentic Workflows", "tldr": "\u672c\u6587\u63d0\u51fa\u201c\u53d7\u6cbb\u7406\u6267\u884c\u201d\u6982\u5ff5\uff0c\u5f3a\u8c03\u667a\u80fd\u4f53\u5de5\u4f5c\u6d41\u4e0d\u4ec5\u8981\u7ed3\u679c\u6b63\u786e\uff0c\u8fd8\u8981\u80fd\u8ffd\u6eaf\u51b3\u7b56\u4f9d\u636e\u3001\u5b8c\u6210\u8bc1\u636e\u4e0e\u53d8\u66f4\u5f71\u54cd\u3002\u4f5c\u8005\u5b9e\u73b0\u4e86 Matrix \u8fd9\u4e00\u786e\u5b9a\u6027\u56e0\u679c\u72b6\u6001\u5c42\uff0c\u53ef\u8bb0\u5f55\u6743\u9650\u4e0e\u4e8b\u5b9e\u4f9d\u8d56\u3001\u9a8c\u8bc1\u5b8c\u6210\u58f0\u660e\uff0c\u5e76\u53ea\u5931\u6548\u53d7\u5f71\u54cd\u4efb\u52a1\uff1b\u5b9e\u9a8c\u663e\u793a\u5b83\u4e0d\u63d0\u5347\u4e00\u822c\u51c6\u786e\u7387\uff0c\u4f46\u80fd\u663e\u8457\u589e\u5f3a\u5ba1\u8ba1\u6027\u4e0e\u5236\u5ea6\u5b8c\u6574\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-form research reports generated by large language models drift, contradict themselves, and lose provenance: the same metric appears with different values, and rumor is quoted as confidently as an audited filing. We present a two-tier agentic system that separates a maintained, point-in-time knowledge library from report writing. A deterministic \"librarian\" ingests timestamped sources into a trust-tiered ontology, layering evidence cards, an authoritative metric ledger, and a claim graph into an always-current source of truth, not per-query RAG over raw chunks. A portable multi-agent \"writer\" runtime then composes a contradiction-free, evidence-grounded report at any knowledge cutoff T, reading only evidence with as_of \u003c= T (no look-ahead); red-team verdicts flow back into the librarian. We evaluate on a self-collected, public corpus of 6,130 sources yielding 555,926 evidence cards (SEC EDGAR filings across 295 issuers and 11 sectors, U.S. Bureau of Labor Statistics releases, and Wikipedia). From the one library we compose four point-in-time reports on distinct theses and run eight reproducible experiments, whose headline metrics come from a deterministic quality-control gate, itself validated by defect-injection meta-evaluation at recall 1.0 and precision 1.0. A shared metric ledger removes 6,845 cross-section contradictions to zero. Tier-first selection is correct on 22/22 gold cases where a popularity-first baseline scores only 9/22; trust tiering leaks zero media-sourced numbers, and no government statistic displaces a company\u0027s own filing. A red-team refutation propagates back and self-corrects a later run with zero manual edits. Replay exhibits zero look-ahead violations across seven cutoffs while the library grows from 235,373 to 555,312 cards. Difficulty-tiered model routing exceeds the all-Opus quality ceiling while running 3.7x faster than serial.", "arxiv_id": "2608.12984", "arxiv_url": "https://arxiv.org/abs/2608.12984", "authors": ["Xing Zhang", "Yanwei Cui", "Guanghui Wang", "Peiyang He"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4e24\u5c42\u667a\u80fd\u4f53\u7cfb\u7edf\uff1a\u786e\u5b9a\u6027\u201c\u56fe\u4e66\u7ba1\u7406\u5458\u201d\u7ef4\u62a4\u5e26\u65f6\u95f4\u6233\u548c\u4fe1\u4efb\u5206\u5c42\u7684\u77e5\u8bc6\u5e93\uff0c\u591a\u667a\u80fd\u4f53\u201c\u5199\u4f5c\u8005\u201d\u5728\u4efb\u610f\u77e5\u8bc6\u622a\u6b62\u70b9\u751f\u6210\u6709\u8bc1\u636e\u652f\u6491\u7684\u957f\u7bc7\u7814\u7a76\u62a5\u544a\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u7cfb\u7edf\u53ef\u6d88\u9664\u8de8\u7ae0\u8282\u6307\u6807\u77db\u76fe\u3001\u907f\u514d\u672a\u6765\u4fe1\u606f\u6cc4\u6f0f\uff0c\u5e76\u901a\u8fc7\u7ea2\u961f\u53cd\u9988\u81ea\u52a8\u4fee\u6b63\u540e\u7eed\u62a5\u544a\uff0c\u540c\u65f6\u6a21\u578b\u8def\u7531\u6bd4\u4e32\u884c\u9ad8\u7aef\u6a21\u578b\u66f4\u5feb\u4e14\u8d28\u91cf\u66f4\u9ad8\u3002", "categories": ["cs.MA", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12984", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u6587\u672c\u751f\u6210", "\u77e5\u8bc6\u5e93", "\u53ef\u4fe1\u8bc4\u4f30"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12984v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Reconcile Once, Write Anytime: A Trust-Tiered Librarian and a Multi-Agent Writer for Drift-Free, Point-in-Time Research", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e00\u79cd\u4e24\u5c42\u667a\u80fd\u4f53\u7cfb\u7edf\uff1a\u786e\u5b9a\u6027\u201c\u56fe\u4e66\u7ba1\u7406\u5458\u201d\u7ef4\u62a4\u5e26\u65f6\u95f4\u6233\u548c\u4fe1\u4efb\u5206\u5c42\u7684\u77e5\u8bc6\u5e93\uff0c\u591a\u667a\u80fd\u4f53\u201c\u5199\u4f5c\u8005\u201d\u5728\u4efb\u610f\u77e5\u8bc6\u622a\u6b62\u70b9\u751f\u6210\u6709\u8bc1\u636e\u652f\u6491\u7684\u957f\u7bc7\u7814\u7a76\u62a5\u544a\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u8be5\u7cfb\u7edf\u53ef\u6d88\u9664\u8de8\u7ae0\u8282\u6307\u6807\u77db\u76fe\u3001\u907f\u514d\u672a\u6765\u4fe1\u606f\u6cc4\u6f0f\uff0c\u5e76\u901a\u8fc7\u7ea2\u961f\u53cd\u9988\u81ea\u52a8\u4fee\u6b63\u540e\u7eed\u62a5\u544a\uff0c\u540c\u65f6\u6a21\u578b\u8def\u7531\u6bd4\u4e32\u884c\u9ad8\u7aef\u6a21\u578b\u66f4\u5feb\u4e14\u8d28\u91cf\u66f4\u9ad8\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Agent-memory systems increasingly buy retrieval quality with structure, transforming raw conversation histories into summaries, embeddings, trees, or knowledge graphs before any question is asked. We ask how much of that benefit comes from the structure itself, rather than from competent retrieval over the raw history. We present ReFind, an agent-controlled search interface that builds no semantic structure at all: it leaves the conversation archive unmodified, indexes it lexically at turn granularity, and combines a generic iterative keyword-search loop with four chat-native controls grounded in empirical refinding work: session-aware rank fusion, local context expansion, temporal narrowing, and skipping already-inspected sessions. A separate reasoning stage answers from the collected evidence. Across a broad suite of conversational-memory tasks (single- and multi-hop QA, event ordering, and fact consolidation), roughly 2,800 questions on precise-retrieval and fact-tracking capabilities evaluated under the incremental multi-turn setting of MemoryAgentBench, ReFind attains the highest mean accuracy (58.2) of any system compared, above the strongest graph- and tree-based memory systems (HippoRAG 2, 53.2), all under a GPT-4o-mini backbone matched to every reused baseline. Controlled comparisons to single-shot BM25, a matched generic-agentic BM25 control, component removals, and agentic dense/hybrid variants separately support the roles of agent control, chat-native controls, and lexical retrieval. On LongMemEval-S/M, the same interface reaches 93.2 +/- 3.3 and 89.3 +/- 6.0 with GPT-5-mini. The results indicate that for precise, evidence-grounded questions over chat archives, much of the benefit credited to elaborate memory structures is recoverable by giving an agent controllable search over the unmodified record, with no LLM-based index construction at all.", "arxiv_id": "2608.12888", "arxiv_url": "https://arxiv.org/abs/2608.12888", "authors": ["Ruizhe Li", "Licheng Zhang", "Benfeng Xu", "Mingxuan Du", "Zheren Fu", "Weidong Chen"], "brief": "\u8bba\u6587\u63d0\u51fa ReFind\uff1a\u4e0d\u6784\u5efa\u6458\u8981\u3001\u5411\u91cf\u3001\u6811\u6216\u77e5\u8bc6\u56fe\u8c31\u7b49\u8bed\u4e49\u8bb0\u5fc6\u7ed3\u6784\uff0c\u800c\u662f\u8ba9\u667a\u80fd\u4f53\u5728\u539f\u59cb\u804a\u5929\u8bb0\u5f55\u4e0a\u8fdb\u884c\u8fed\u4ee3\u5173\u952e\u8bcd\u68c0\u7d22\uff0c\u5e76\u52a0\u5165\u4f1a\u8bdd\u611f\u77e5\u6392\u5e8f\u3001\u5c40\u90e8\u4e0a\u4e0b\u6587\u6269\u5c55\u3001\u65f6\u95f4\u7f29\u7a84\u7b49\u63a7\u5236\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u5728\u591a\u79cd\u4f1a\u8bdd\u8bb0\u5fc6\u4efb\u52a1\u4e0a\u8d85\u8fc7\u5f3a\u56fe/\u6811\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u8bf4\u660e\u5bf9\u7cbe\u786e\u3001\u8bc1\u636e\u9a71\u52a8\u7684\u95ee\u9898\uff0c\u539f\u59cb\u65e5\u5fd7\u4e0a\u7684\u53ef\u63a7\u68c0\u7d22\u53ef\u66ff\u4ee3\u5927\u91cf\u590d\u6742\u7ed3\u6784\u5316\u8bb0\u5fc6\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12888", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bb0\u5fc6\u68c0\u7d22", "\u81ea\u7136\u8bed\u8a00\u5904\u7406", "\u4fe1\u606f\u68c0\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12888v1", "published_at": "2026-08-13", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "When Your Agent Opens the Chat App: Agent-Controlled Search over Raw Chat Logs Rivals Structured Memory", "tldr": "\u8bba\u6587\u63d0\u51fa ReFind\uff1a\u4e0d\u6784\u5efa\u6458\u8981\u3001\u5411\u91cf\u3001\u6811\u6216\u77e5\u8bc6\u56fe\u8c31\u7b49\u8bed\u4e49\u8bb0\u5fc6\u7ed3\u6784\uff0c\u800c\u662f\u8ba9\u667a\u80fd\u4f53\u5728\u539f\u59cb\u804a\u5929\u8bb0\u5f55\u4e0a\u8fdb\u884c\u8fed\u4ee3\u5173\u952e\u8bcd\u68c0\u7d22\uff0c\u5e76\u52a0\u5165\u4f1a\u8bdd\u611f\u77e5\u6392\u5e8f\u3001\u5c40\u90e8\u4e0a\u4e0b\u6587\u6269\u5c55\u3001\u65f6\u95f4\u7f29\u7a84\u7b49\u63a7\u5236\u3002\u5b9e\u9a8c\u663e\u793a\u5b83\u5728\u591a\u79cd\u4f1a\u8bdd\u8bb0\u5fc6\u4efb\u52a1\u4e0a\u8d85\u8fc7\u5f3a\u56fe/\u6811\u8bb0\u5fc6\u7cfb\u7edf\uff0c\u8bf4\u660e\u5bf9\u7cbe\u786e\u3001\u8bc1\u636e\u9a71\u52a8\u7684\u95ee\u9898\uff0c\u539f\u59cb\u65e5\u5fd7\u4e0a\u7684\u53ef\u63a7\u68c0\u7d22\u53ef\u66ff\u4ee3\u5927\u91cf\u590d\u6742\u7ed3\u6784\u5316\u8bb0\u5fc6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Video world models simulate future states conditioned on current observations and user actions. Recent systems have demonstrated impressive video consistency and action controllability over long sequences. However, fairly comparing these interactive models remains challenging. In practice, a human player typically evaluates a world model by pursuing long-horizon objectives through interaction. For example, a user may turn around 360 degrees to see whether the environment remains consistent, or walk into the water and inspect whether realistic water ripples are generated. The action sequence required to achieve the same objective may vary substantially between models, making fixed action-conditioned evaluation unsuitable for cross-model comparison. To address this, we employ multi-modal Agent Players to interact with world models toward specified long-horizon objectives. Building on this paradigm, we introduce PlayWorld, a benchmark providing 171 scenarios, each with a specified objective. To evaluate performance thoroughly, we assess models along four core dimensions: geometry consistency, interaction fidelity, out-of-sight evolution, and insight evolution. In addition, we incorporate basic ability metrics for video quality and controllability. Experiments across nine state-of-the-art world models reveal that current models remain unreliable on long-horizon interactive objectives, particularly in maintaining spatial consistency and persistent state evolution. Code and data are available at https://github.com/kxding/PlayWorld.", "arxiv_id": "2608.13552", "arxiv_url": "https://arxiv.org/abs/2608.13552", "authors": ["Kaixin Ding", "Xi Chen", "Minghong Cai", "Zhiyuan Xu", "Yiyang Wang", "Yuxiang Lu", "Junyi Li", "Shuyang Chen", "Yuan Gao", "Xin Tao", "Pengfei Wan", "Hengshuang Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa PlayWorld \u57fa\u51c6\uff0c\u7528\u591a\u6a21\u6001\u667a\u80fd\u4f53\u73a9\u5bb6\u4e0e\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4ea4\u4e92\uff0c\u56f4\u7ed5 171 \u4e2a\u957f\u7a0b\u76ee\u6807\u8fdb\u884c\u8bc4\u6d4b\u3002\u5b9e\u9a8c\u8986\u76d6 9 \u4e2a\u5148\u8fdb\u4e16\u754c\u6a21\u578b\uff0c\u53d1\u73b0\u5f53\u524d\u6a21\u578b\u5728\u957f\u7a0b\u4ea4\u4e92\u4e2d\u4ecd\u4e0d\u53ef\u9760\uff0c\u5c24\u5176\u96be\u4ee5\u4fdd\u6301\u7a7a\u95f4\u4e00\u81f4\u6027\u548c\u6301\u4e45\u72b6\u6001\u6f14\u5316\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/kxding/PlayWorld", "github_stars": 8, "hf_url": "https://huggingface.co/papers/2608.13552", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u89c6\u9891\u751f\u6210", "\u957f\u7a0b\u4ea4\u4e92"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13552v1", "published_at": "2026-08-13", "score": 0.104, "selected_reasons": ["HF trending (21\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13552.png", "title": "PlayWorld: Benchmarking World Models with Agent Players over Long-Horizon Objectives", "tldr": "\u8bba\u6587\u63d0\u51fa PlayWorld \u57fa\u51c6\uff0c\u7528\u591a\u6a21\u6001\u667a\u80fd\u4f53\u73a9\u5bb6\u4e0e\u89c6\u9891\u4e16\u754c\u6a21\u578b\u4ea4\u4e92\uff0c\u56f4\u7ed5 171 \u4e2a\u957f\u7a0b\u76ee\u6807\u8fdb\u884c\u8bc4\u6d4b\u3002\u5b9e\u9a8c\u8986\u76d6 9 \u4e2a\u5148\u8fdb\u4e16\u754c\u6a21\u578b\uff0c\u53d1\u73b0\u5f53\u524d\u6a21\u578b\u5728\u957f\u7a0b\u4ea4\u4e92\u4e2d\u4ecd\u4e0d\u53ef\u9760\uff0c\u5c24\u5176\u96be\u4ee5\u4fdd\u6301\u7a7a\u95f4\u4e00\u81f4\u6027\u548c\u6301\u4e45\u72b6\u6001\u6f14\u5316\u3002", "upvotes": 21, "what_it_is": null, "why_notable": null}, {"abstract": "The world evolves following its dynamics, i.e., its laws of motion. However, leading video diffusion models largely fit the pixels without modeling how the pixels transit over time. Thus, they render visually plausible frames but may not accurately obey the laws. To capture the dynamics purely from pixels, we introduce Latent Dynamics Reasoning (LDR). LDR casts the latent transition as an explicit kinematic integration, where the lower-order dynamics are integrated numerically and the model regresses only the third- and higher-order residual that drives the rollout. For this integration to extrapolate better, LDR runs it on a structured latent rather than dense convolutional features. Following PhyWorld, we validate LDR on a controlled white-box physics benchmark spanning five tasks (uniform motion, parabola, collision, bouncing, looming), focusing on out-of-distribution scenarios that reveal whether a model has truly learned the underlying dynamics. LDR extrapolates the learned dynamics far better: the gap between its in- and out-of-distribution error is over 20$\\times$ smaller than the video diffusion baseline\u0027s, under both single- and joint-task training at 256$^2$ resolution, while using 26$\\times$ fewer parameters and running 143$\\times$ faster. LDR can even generalize under severe shift: for example, trained only on red balls moving left-to-right, it correctly predicts the motion of a blue square moving right-to-left. To our knowledge, this is the first video world model that extrapolates learned dynamics beyond its training distribution. Project page: https://lat-dyn-reason.github.io/", "arxiv_id": "2608.09926", "arxiv_url": "https://arxiv.org/abs/2608.09926", "authors": ["Haodong Li", "Shaoteng Liu", "Tianyu Wang", "Chongjian Ge", "Sihui Ji", "Jiahan Zhang", "Xin Lin", "Haolin Lu", "Zhe Lin", "Manmohan Chandraker"], "brief": "\u8bba\u6587\u63d0\u51fa Latent Dynamics Reasoning\uff08LDR\uff09\uff0c\u5c06\u89c6\u9891\u6f5c\u53d8\u91cf\u8f6c\u79fb\u663e\u5f0f\u5efa\u6a21\u4e3a\u8fd0\u52a8\u5b66\u79ef\u5206\uff0c\u53ea\u56de\u5f52\u4e09\u9636\u53ca\u66f4\u9ad8\u9636\u6b8b\u5dee\uff0c\u4ece\u50cf\u7d20\u4e2d\u5b66\u4e60\u4e16\u754c\u52a8\u529b\u5b66\u3002\u76f8\u6bd4\u89c6\u9891\u6269\u6563\u57fa\u7ebf\uff0cLDR \u5728\u7269\u7406\u57fa\u51c6\u7684\u5206\u5e03\u5916\u5916\u63a8\u8bef\u5dee\u5dee\u8ddd\u7f29\u5c0f\u8d85\u8fc7 20 \u500d\uff0c\
