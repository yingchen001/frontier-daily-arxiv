c6\u6210\u5728\u8de8\u6570\u636e\u96c6\u56fe\u50cf\u5206\u7c7b\u4e2d\u80fd\u517c\u987e\u4e0d\u540c\u67b6\u6784\u7684\u4f18\u52bf\uff0c\u6027\u80fd\u63a5\u8fd1\u4e13\u95e8\u8bad\u7ec3\u7684\u8def\u7531\u5668\uff0c\u5e76\u53ef\u901a\u8fc7\u63d0\u793a\u4fee\u6539\u5feb\u901f\u9002\u914d\u65b0\u4fe1\u606f\u3001\u63d0\u4f9b\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u3002", "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13463", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u56fe\u50cf\u5206\u7c7b", "\u6a21\u578b\u96c6\u6210", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13463v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MLLM-Routed Heterogeneous Ensembles for Robust Cross-Dataset Image Classification", "tldr": "\u8bba\u6587\u63d0\u51fa ARMDIL\uff0c\u7528\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u8def\u7531\u667a\u80fd\u4f53\uff0c\u4e3a\u6bcf\u5f20\u56fe\u50cf\u52a8\u6001\u9009\u62e9\u6700\u5408\u9002\u7684\u89c6\u89c9\u9aa8\u5e72\u6a21\u578b\u3002\u8be5\u5f02\u6784\u96c6\u6210\u5728\u8de8\u6570\u636e\u96c6\u56fe\u50cf\u5206\u7c7b\u4e2d\u80fd\u517c\u987e\u4e0d\u540c\u67b6\u6784\u7684\u4f18\u52bf\uff0c\u6027\u80fd\u63a5\u8fd1\u4e13\u95e8\u8bad\u7ec3\u7684\u8def\u7531\u5668\uff0c\u5e76\u53ef\u901a\u8fc7\u63d0\u793a\u4fee\u6539\u5feb\u901f\u9002\u914d\u65b0\u4fe1\u606f\u3001\u63d0\u4f9b\u81ea\u7136\u8bed\u8a00\u89e3\u91ca\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We address the use of large language models (LLMs) to help discover Isabelle proofs. An Isabelle build establishes that the submitted theory is accepted, but not that an LLM changed only what the developer authorised. We present CAPRI, a contract-aware repair workflow in which Isabelle checks the proof and an independent checker enforces a machine-readable edit contract. Prompts, proposals, candidate repositories, diagnostics, verdicts, and hashes are retained for audit. We evaluate five workflows on twelve failed proofs from four developments, with three replicates per task and condition, giving 180 runs and 138 valid repairs. Of 144 terminal candidates accepted by Isabelle, six had modified protected text; all arose in iterative workflows that could edit a complete theory. A proof-body-only interface produced 29/36 valid repairs and no contract violations, compared with 31/36 for the corresponding full-theory workflow. One-shot repair produced 22/36, while a later prospectively frozen iterative workflow produced 32/36; these figures compare complete workflows rather than individual mechanisms. A separate post hoc OpenRouter campaign found no improvement in the designated Luna comparisons. A Sol configuration with matched demonstrations produced 33/36 repairs, compared with 29/36 in the frozen OpenAI Responses condition, but the difference was not statistically significant in a one-sided exact McNemar test ($p=0.0625$).", "arxiv_id": "2608.13459", "arxiv_url": "https://arxiv.org/abs/2608.13459", "authors": ["Jim Woodcock", "Gabriel Leite", "Augusto Sampaio", "Ran Wei"], "brief": "CAPRI \u63d0\u51fa\u4e00\u79cd\u9762\u5411 Isabelle \u7684\u5951\u7ea6\u611f\u77e5\u8bc1\u660e\u4fee\u590d\u6d41\u7a0b\uff1a\u7531 Isabelle \u68c0\u9a8c\u8bc1\u660e\u6b63\u786e\u6027\uff0c\u5e76\u7531\u72ec\u7acb\u68c0\u67e5\u5668\u786e\u4fdd LLM \u53ea\u4fee\u6539\u6388\u6743\u8303\u56f4\uff0c\u540c\u65f6\u4fdd\u7559\u63d0\u793a\u3001\u5019\u9009\u3001\u8bca\u65ad\u3001\u54c8\u5e0c\u7b49\u5ba1\u8ba1\u8bb0\u5f55\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u9650\u5236\u4e3a\u4ec5\u7f16\u8f91\u8bc1\u660e\u4f53\u7684\u63a5\u53e3\u53ef\u5728 36 \u6b21\u4e2d\u5b8c\u6210 29 \u6b21\u6709\u6548\u4fee\u590d\u4e14\u65e0\u5951\u7ea6\u8fdd\u89c4\uff0c\u800c\u5141\u8bb8\u5b8c\u6574\u7406\u8bba\u8fed\u4ee3\u7f16\u8f91\u7684\u6d41\u7a0b\u867d\u4fee\u590d\u7387\u7565\u9ad8\u4f46\u51fa\u73b0\u4e86\u53d7\u4fdd\u62a4\u6587\u672c\u88ab\u4fee\u6539\u7684\u95ee\u9898\u3002", "categories": ["cs.SE", "cs.AI", "cs.LO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13459", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7a0b\u5e8f\u4fee\u590d", "\u8bc1\u660e\u8f85\u52a9"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13459v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "CAPRI: Contract-Aware Proof Repair for Isabelle", "tldr": "CAPRI \u63d0\u51fa\u4e00\u79cd\u9762\u5411 Isabelle \u7684\u5951\u7ea6\u611f\u77e5\u8bc1\u660e\u4fee\u590d\u6d41\u7a0b\uff1a\u7531 Isabelle \u68c0\u9a8c\u8bc1\u660e\u6b63\u786e\u6027\uff0c\u5e76\u7531\u72ec\u7acb\u68c0\u67e5\u5668\u786e\u4fdd LLM \u53ea\u4fee\u6539\u6388\u6743\u8303\u56f4\uff0c\u540c\u65f6\u4fdd\u7559\u63d0\u793a\u3001\u5019\u9009\u3001\u8bca\u65ad\u3001\u54c8\u5e0c\u7b49\u5ba1\u8ba1\u8bb0\u5f55\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u9650\u5236\u4e3a\u4ec5\u7f16\u8f91\u8bc1\u660e\u4f53\u7684\u63a5\u53e3\u53ef\u5728 36 \u6b21\u4e2d\u5b8c\u6210 29 \u6b21\u6709\u6548\u4fee\u590d\u4e14\u65e0\u5951\u7ea6\u8fdd\u89c4\uff0c\u800c\u5141\u8bb8\u5b8c\u6574\u7406\u8bba\u8fed\u4ee3\u7f16\u8f91\u7684\u6d41\u7a0b\u867d\u4fee\u590d\u7387\u7565\u9ad8\u4f46\u51fa\u73b0\u4e86\u53d7\u4fdd\u62a4\u6587\u672c\u88ab\u4fee\u6539\u7684\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World Models (WM) are increasingly seen as a foundation for intelligent agents that can predict, plan, and act beyond their training distribution. In this paper, we study WMs from a causal perspective across multiple levels of abstraction, ranging from perceptual observations to building a conceptual representation of the structure governing the environment dynamics. We argue that useful WMs must go beyond generative capabilities alone: they should also capture entity properties, entity-to-entity interactions, and entity-to-environment interactions that determine and explain the dynamics of a system. We provide a formal definition of Causal WMs (CWMs) grounded in the tasks they are intended to support, connecting world modelling with existing work in causal representation learning, object-centric learning, causal discovery, structural causal models, and model-based decision-making. Finally, we relate CWMs to the literature on identifiability, clarifying when the components of a WM can be recovered from data and up to which equivalence. With this, we ground WMs in representations and structures that support causal reasoning and informed decision-making.", "arxiv_id": "2608.13456", "arxiv_url": "https://arxiv.org/abs/2608.13456", "authors": ["Avinash Kori", "Fabrizio Russo"], "brief": "\u672c\u6587\u4ece\u56e0\u679c\u89c6\u89d2\u7edf\u4e00\u8ba8\u8bba\u4e16\u754c\u6a21\u578b\uff0c\u8986\u76d6\u4ece\u611f\u77e5\u89c2\u6d4b\u3001\u8868\u5f81\u5b66\u4e60\u5230\u73af\u5883\u52a8\u529b\u5b66\u7ed3\u6784\u5efa\u6a21\u7684\u591a\u4e2a\u62bd\u8c61\u5c42\u6b21\u3002\u4f5c\u8005\u63d0\u51fa\u56e0\u679c\u4e16\u754c\u6a21\u578b\u7684\u5f62\u5f0f\u5316\u5b9a\u4e49\uff0c\u5e76\u8fde\u63a5\u56e0\u679c\u8868\u5f81\u5b66\u4e60\u3001\u5bf9\u8c61\u4e2d\u5fc3\u5b66\u4e60\u3001\u56e0\u679c\u53d1\u73b0\u548c\u57fa\u4e8e\u6a21\u578b\u7684\u51b3\u7b56\uff0c\u5f3a\u8c03\u4e16\u754c\u6a21\u578b\u5e94\u652f\u6301\u56e0\u679c\u63a8\u7406\u4e0e\u6cdb\u5316\u51b3\u7b56\uff0c\u800c\u4e0d\u53ea\u662f\u751f\u6210\u9884\u6d4b\u3002", "categories": ["cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13456", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u56e0\u679c\u5b66\u4e60", "\u8868\u5f81\u5b66\u4e60", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13456v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "A Unifying Perspective on Causal World Models: From Observations to Representations to Structure", "tldr": "\u672c\u6587\u4ece\u56e0\u679c\u89c6\u89d2\u7edf\u4e00\u8ba8\u8bba\u4e16\u754c\u6a21\u578b\uff0c\u8986\u76d6\u4ece\u611f\u77e5\u89c2\u6d4b\u3001\u8868\u5f81\u5b66\u4e60\u5230\u73af\u5883\u52a8\u529b\u5b66\u7ed3\u6784\u5efa\u6a21\u7684\u591a\u4e2a\u62bd\u8c61\u5c42\u6b21\u3002\u4f5c\u8005\u63d0\u51fa\u56e0\u679c\u4e16\u754c\u6a21\u578b\u7684\u5f62\u5f0f\u5316\u5b9a\u4e49\uff0c\u5e76\u8fde\u63a5\u56e0\u679c\u8868\u5f81\u5b66\u4e60\u3001\u5bf9\u8c61\u4e2d\u5fc3\u5b66\u4e60\u3001\u56e0\u679c\u53d1\u73b0\u548c\u57fa\u4e8e\u6a21\u578b\u7684\u51b3\u7b56\uff0c\u5f3a\u8c03\u4e16\u754c\u6a21\u578b\u5e94\u652f\u6301\u56e0\u679c\u63a8\u7406\u4e0e\u6cdb\u5316\u51b3\u7b56\uff0c\u800c\u4e0d\u53ea\u662f\u751f\u6210\u9884\u6d4b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Vision-Language-Action (VLA) models have emerged as generalist robotic policies capable of following diverse language instructions and performing a wide range of manipulation tasks. However, their direct control over embodied agents also exposes them to adversarial interference that may cause unsafe physical behaviors. Existing attacks on robotic policies are typically optimized for a single task or instruction, leaving the cross-task vulnerabilities of multitask VLAs largely unexplored. We introduce UniTexture, a cross-task universal adversarial texture attack that uses a single textured 3D object to induce targeted deviations in VLA action predictions across multiple tasks. UniTexture backpropagates gradients from the policy\u0027s action outputs to surface texture parameters through a differentiable renderer. It jointly optimizes the shared texture over a distribution of tasks, instructions, states, and viewpoints using a targeted action-space objective, steering predicted actions toward attacker-defined targets without optimizing a separate texture for each task. We evaluate UniTexture on OpenVLA and $\u03c0_{0.5}$ across diverse manipulation tasks and multiple evaluation settings. UniTexture reduces the mean task success rate from 90.0% under benign conditions to 48.4% under attack, induces target-aligned action shifts, and further exhibits cross-suite and cross-model transfer without re-optimization. Together, these findings reveal shared cross-task vulnerabilities in multitask VLAs that can be systematically exploited through a single adversarial surface texture.", "arxiv_id": "2608.13453", "arxiv_url": "https://arxiv.org/abs/2608.13453", "authors": ["Yukun Dai", "Mingzhe Dai", "Tianshi Wang", "Fengling Li", "Jingjing Li", "Lei Zhu"], "brief": "\u672c\u6587\u63d0\u51fa UniTexture\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u8de8\u4efb\u52a1\u901a\u7528\u5bf9\u6297\u7eb9\u7406\u653b\u51fb\uff0c\u7528\u5355\u4e2a\u5e26\u7eb9\u7406\u7684 3D \u7269\u4f53\u5728\u591a\u4efb\u52a1\u3001\u591a\u6307\u4ee4\u548c\u591a\u89c6\u89d2\u4e0b\u8bf1\u5bfc\u673a\u5668\u4eba\u52a8\u4f5c\u504f\u79fb\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u53ef\u5c06\u4efb\u52a1\u6210\u529f\u7387\u4ece 90.0% \u964d\u81f3 48.4%\uff0c\u5e76\u5177\u5907\u8de8\u4efb\u52a1\u5957\u4ef6\u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u6027\uff0c\u63ed\u793a\u4e86\u591a\u4efb\u52a1 VLA \u7684\u5171\u4eab\u5b89\u5168\u8106\u5f31\u6027\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13453", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd", "\u5bf9\u6297\u653b\u51fb", "\u89c6\u89c9\u8bed\u8a00\u52a8\u4f5c\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13453v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "UniTexture: Cross-Task Universal Adversarial Textures for Vision-Language-Action Models", "tldr": "\u672c\u6587\u63d0\u51fa UniTexture\uff0c\u4e00\u79cd\u9762\u5411\u89c6\u89c9-\u8bed\u8a00-\u52a8\u4f5c\u6a21\u578b\u7684\u8de8\u4efb\u52a1\u901a\u7528\u5bf9\u6297\u7eb9\u7406\u653b\u51fb\uff0c\u7528\u5355\u4e2a\u5e26\u7eb9\u7406\u7684 3D \u7269\u4f53\u5728\u591a\u4efb\u52a1\u3001\u591a\u6307\u4ee4\u548c\u591a\u89c6\u89d2\u4e0b\u8bf1\u5bfc\u673a\u5668\u4eba\u52a8\u4f5c\u504f\u79fb\u3002\u5b9e\u9a8c\u663e\u793a\u8be5\u65b9\u6cd5\u53ef\u5c06\u4efb\u52a1\u6210\u529f\u7387\u4ece 90.0% \u964d\u81f3 48.4%\uff0c\u5e76\u5177\u5907\u8de8\u4efb\u52a1\u5957\u4ef6\u548c\u8de8\u6a21\u578b\u8fc1\u79fb\u6027\uff0c\u63ed\u793a\u4e86\u591a\u4efb\u52a1 VLA \u7684\u5171\u4eab\u5b89\u5168\u8106\u5f31\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Academic leagues have become important mechanisms for promoting extracurricular education and strengthening the integration between universities and society. This paper presents the organizational framework adopted by the Academic League of Artificial Intelligence (LIA) at the Federal University of Santa Catarina (UFSC), designed to integrate teaching, research, and university extension through a student-centered, project-based approach. The framework combines democratic governance, collaborative learning, and dynamic project organization to foster both technical and transversal competencies. The framework is illustrated through representative initiatives, including competition teams, study groups, open lectures, knowledge repositories, and AI-powered applications with social impact. These projects demonstrate how diverse educational, scientific, and extension activities can be developed within a common organizational structure while promoting leadership, scientific production, community engagement, and knowledge preservation. The reported experience indicates that the proposed framework provides a flexible and replicable model for integrating the three university pillars into engineering and computing education, offering practical guidance for academic leagues and similar student organizations.", "arxiv_id": "2608.13447", "arxiv_url": "https://arxiv.org/abs/2608.13447", "authors": ["Alison R. Panisson", "Maria Eduarda W. M. Vianna", "Italo Firmino da Silva", "Heitor Henrique da Silva", "Rafaela Fernandes Savaris", "Bernardo Pandolfi Costa", "Martin Augusto Gagliotti Vigil", "Jim Lau", "Agenor Hentz", "Andr\u00e9a Sabedra Bordin", "Alexandre Leopoldo Gon\u00e7alves", "Roberto Rodrigues-Filho"], "brief": "\u672c\u6587\u4ecb\u7ecd\u4e86\u5df4\u897f\u5723\u5361\u5854\u7433\u5a1c\u8054\u90a6\u5927\u5b66\u4eba\u5de5\u667a\u80fd\u5b66\u672f\u8054\u76df\u7684\u7ec4\u7ec7\u6846\u67b6\uff0c\u7528\u9879\u76ee\u5236\u3001\u5b66\u751f\u4e2d\u5fc3\u548c\u6c11\u4e3b\u7ba1\u7406\u6765\u6574\u5408\u6559\u5b66\u3001\u79d1\u7814\u4e0e\u793e\u4f1a\u5ef6\u4f38\u3002\u6848\u4f8b\u663e\u793a\uff0c\u8be5\u6a21\u5f0f\u53ef\u652f\u6301\u7ade\u8d5b\u56e2\u961f\u3001\u5b66\u4e60\u5c0f\u7ec4\u3001\u516c\u5f00\u8bb2\u5ea7\u548c\u793e\u4f1a\u5f71\u54cd\u578b AI \u5e94\u7528\uff0c\u63d0\u5347\u5b66\u751f\u6280\u672f\u80fd\u529b\u3001\u9886\u5bfc\u529b\u4e0e\u793e\u533a\u53c2\u4e0e\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13447", "impact_score": 3, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u5de5\u667a\u80fd\u6559\u80b2", "\u9879\u76ee\u5f0f\u5b66\u4e60", "\u9ad8\u6821\u7ec4\u7ec7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13447v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Academic League of Artificial Intelligence - An Integrative Perspective of Teaching, Research, and Extension", "tldr": "\u672c\u6587\u4ecb\u7ecd\u4e86\u5df4\u897f\u5723\u5361\u5854\u7433\u5a1c\u8054\u90a6\u5927\u5b66\u4eba\u5de5\u667a\u80fd\u5b66\u672f\u8054\u76df\u7684\u7ec4\u7ec7\u6846\u67b6\uff0c\u7528\u9879\u76ee\u5236\u3001\u5b66\u751f\u4e2d\u5fc3\u548c\u6c11\u4e3b\u7ba1\u7406\u6765\u6574\u5408\u6559\u5b66\u3001\u79d1\u7814\u4e0e\u793e\u4f1a\u5ef6\u4f38\u3002\u6848\u4f8b\u663e\u793a\uff0c\u8be5\u6a21\u5f0f\u53ef\u652f\u6301\u7ade\u8d5b\u56e2\u961f\u3001\u5b66\u4e60\u5c0f\u7ec4\u3001\u516c\u5f00\u8bb2\u5ea7\u548c\u793e\u4f1a\u5f71\u54cd\u578b AI \u5e94\u7528\uff0c\u63d0\u5347\u5b66\u751f\u6280\u672f\u80fd\u529b\u3001\u9886\u5bfc\u529b\u4e0e\u793e\u533a\u53c2\u4e0e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Contact-rich manipulation failures are often detected only after the robot has committed to contact. This is especially limiting in wrist-camera setups: close gripper--object views help observe contact, but a poor approach may already push, miss, slip, or disturb the object before conventional detectors react. We introduce \\emph{ContactGuard}, a pre-contact execution monitor for chunked visuomotor policies. Given the policy\u0027s planned action chunk, ContactGuard predicts its short-horizon consequence in latent visual space and aborts if the predicted future latent indicates likely failure. Its latent world model is trained from unlabelled robot trajectories to predict compact multi-view visual embeddings under planned actions, avoiding pixel-level video prediction. A lightweight failure probe is then trained from a small labelled set of pre-contact clips. At deployment, ContactGuard anchors prediction before an imminent contact event, rolls the model forward under the policy\u0027s own actions, and verifies the predicted post-contact latent. Across real-world contact-rich manipulation tasks, ContactGuard predicts failure more accurately than direct and corrupted-action ablations, and transfers to live robot as a pre-contact abort signal without modifying the underlying policy.", "arxiv_id": "2608.13438", "arxiv_url": "https://arxiv.org/abs/2608.13438", "authors": ["Gehan Zheng", "Matthew Johnson-Roberson", "Weiming Zhi"], "brief": "\u63d0\u51fa ContactGuard\uff0c\u7528\u52a8\u4f5c\u6761\u4ef6\u7684\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u5728\u673a\u5668\u4eba\u771f\u6b63\u63a5\u89e6\u7269\u4f53\u524d\u9884\u6d4b\u77ed\u671f\u89c6\u89c9\u540e\u679c\uff0c\u5e76\u5728\u9884\u6d4b\u5230\u5931\u8d25\u65f6\u63d0\u524d\u4e2d\u6b62\u6267\u884c\u3002\u8be5\u65b9\u6cd5\u7528\u672a\u6807\u6ce8\u8f68\u8ff9\u5b66\u4e60\u591a\u89c6\u89d2\u89c6\u89c9\u5d4c\u5165\u9884\u6d4b\uff0c\u518d\u7528\u5c11\u91cf\u6807\u6ce8\u7247\u6bb5\u8bad\u7ec3\u5931\u8d25\u63a2\u9488\uff0c\u5728\u771f\u5b9e\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c\u4efb\u52a1\u4e2d\u4f18\u4e8e\u76f4\u63a5\u68c0\u6d4b\u548c\u6270\u52a8\u52a8\u4f5c\u7b49\u57fa\u7ebf\uff0c\u4e14\u65e0\u9700\u4fee\u6539\u539f\u7b56\u7565\u5373\u53ef\u90e8\u7f72\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13438", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u64cd\u4f5c", "\u4e16\u754c\u6a21\u578b", "\u89c6\u89c9\u63a7\u5236", "\u6267\u884c\u76d1\u63a7"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13438v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ContactGuard: Pre-Contact Execution Monitoring with Action-Conditioned Latent World Models", "tldr": "\u63d0\u51fa ContactGuard\uff0c\u7528\u52a8\u4f5c\u6761\u4ef6\u7684\u6f5c\u5728\u4e16\u754c\u6a21\u578b\u5728\u673a\u5668\u4eba\u771f\u6b63\u63a5\u89e6\u7269\u4f53\u524d\u9884\u6d4b\u77ed\u671f\u89c6\u89c9\u540e\u679c\uff0c\u5e76\u5728\u9884\u6d4b\u5230\u5931\u8d25\u65f6\u63d0\u524d\u4e2d\u6b62\u6267\u884c\u3002\u8be5\u65b9\u6cd5\u7528\u672a\u6807\u6ce8\u8f68\u8ff9\u5b66\u4e60\u591a\u89c6\u89d2\u89c6\u89c9\u5d4c\u5165\u9884\u6d4b\uff0c\u518d\u7528\u5c11\u91cf\u6807\u6ce8\u7247\u6bb5\u8bad\u7ec3\u5931\u8d25\u63a2\u9488\uff0c\u5728\u771f\u5b9e\u63a5\u89e6\u4e30\u5bcc\u64cd\u4f5c\u4efb\u52a1\u4e2d\u4f18\u4e8e\u76f4\u63a5\u68c0\u6d4b\u548c\u6270\u52a8\u52a8\u4f5c\u7b49\u57fa\u7ebf\uff0c\u4e14\u65e0\u9700\u4fee\u6539\u539f\u7b56\u7565\u5373\u53ef\u90e8\u7f72\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Transformer-based language models are known to sometimes generalize to sequences longer than seen during training, but we lack a precise characterization of which tasks admit length generalization. It is not even known which regular languages transformers length-generalize on -- and this is a foundational class of languages. Our contributions are to establish the first complete characterization of which regular languages transformers length-generalize on and provide a decision algorithm running in polynomial time in the size of the language\u0027s syntactic monoid. These results rely on an effective characterization of the regular languages in C-RASP, a recently-established formalism that expresses which languages transformers length-generalize on. This characterization is challenging because classical tools like Krohn-Rhodes decomposition theory for finite semigroups are insufficient for C-RASP. Firstly, the basic building blocks of Krohn-Rhodes theory -- flip-flop and simple groups -- are not expressible in C-RASP. Secondly, the basic building block of C-RASP (unbounded counting) is not expressible by the finite semigroups of Krohn-Rhodes theory. Thus, length generalization on regular languages is controlled by an algebraic property that is invisible to classical finite decomposition theory. We generalize classical decomposition theory from finite semigroups to the infinite additive group on the integers, allowing us to characterize C-RASP in terms of iterated wreath products of the integers and derive a provable polynomial-time decision algorithm for regular language membership. Experiments across a broad test suite of regular languages confirm that our theory captures transformers\u0027 length-generalization behavior more accurately than existing classifications.", "arxiv_id": "2608.13433", "arxiv_url": "https://arxiv.org/abs/2608.13433", "authors": ["Andy Yang", "Blerta Veseli", "Corentin Barloy", "Micha\u00ebl Cadilhac", "Andreas Krebs", "Charles Paperman", "Howard Straubing", "Michael Hahn"], "brief": "\u672c\u6587\u7ed9\u51fa\u4e86 Transformer \u5728\u6b63\u5219\u8bed\u8a00\u4e0a\u957f\u5ea6\u6cdb\u5316\u80fd\u529b\u7684\u9996\u4e2a\u5b8c\u6574\u523b\u753b\uff0c\u5e76\u63d0\u51fa\u4e86\u4e00\u4e2a\u5173\u4e8e\u8bed\u6cd5\u5e7a\u534a\u7fa4\u5927\u5c0f\u7684\u591a\u9879\u5f0f\u65f6\u95f4\u5224\u5b9a\u7b97\u6cd5\u3002\u6838\u5fc3\u662f\u5c06\u7ecf\u5178\u6709\u9650\u534a\u7fa4\u5206\u89e3\u63a8\u5e7f\u5230\u6574\u6570\u52a0\u6cd5\u7fa4\u4e0e\u8fed\u4ee3 wreath product\uff0c\u5b9e\u9a8c\u8868\u660e\u8be5\u7406\u8bba\u6bd4\u5df2\u6709\u5206\u7c7b\u66f4\u51c6\u786e\u9884\u6d4b Transformer \u7684\u957f\u5ea6\u6cdb\u5316\u884c\u4e3a\u3002", "categories": ["cs.FL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13433", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["Transformer", "\u957f\u5ea6\u6cdb\u5316", "\u5f62\u5f0f\u8bed\u8a00", "\u4ee3\u6570\u7406\u8bba"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13433v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Algebraic Decomposition Theory for Transformer Length Generalization", "tldr": "\u672c\u6587\u7ed9\u51fa\u4e86 Transformer \u5728\u6b63\u5219\u8bed\u8a00\u4e0a\u957f\u5ea6\u6cdb\u5316\u80fd\u529b\u7684\u9996\u4e2a\u5b8c\u6574\u523b\u753b\uff0c\u5e76\u63d0\u51fa\u4e86\u4e00\u4e2a\u5173\u4e8e\u8bed\u6cd5\u5e7a\u534a\u7fa4\u5927\u5c0f\u7684\u591a\u9879\u5f0f\u65f6\u95f4\u5224\u5b9a\u7b97\u6cd5\u3002\u6838\u5fc3\u662f\u5c06\u7ecf\u5178\u6709\u9650\u534a\u7fa4\u5206\u89e3\u63a8\u5e7f\u5230\u6574\u6570\u52a0\u6cd5\u7fa4\u4e0e\u8fed\u4ee3 wreath product\uff0c\u5b9e\u9a8c\u8868\u660e\u8be5\u7406\u8bba\u6bd4\u5df2\u6709\u5206\u7c7b\u66f4\u51c6\u786e\u9884\u6d4b Transformer \u7684\u957f\u5ea6\u6cdb\u5316\u884c\u4e3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Instruction-tuned language models achieve strong performance across a range of generation tasks, but have also recently been shown to exhibit verbalized overconfidence. In question answering, verbalized model overconfidence may be associated with the consistency of the generated supporting rationales. In this paper, we study whether corresponding changes in the lexical diversity of generated answer rationales accompany changes in model confidence induced by instruction tuning. We evaluate three matched base and instruction-tuned models across question-answering benchmarks and find that instruction tuning consistently alters answer confidence, despite limited changes in predictive accuracy and decreases in likelihood-based calibration. Secondly, we observe a non-uniform effect of instruction tuning on rationale diversity: cross-rationale diversity consistently decreases, whereas surface-level lexical diversity varies in both direction and magnitude across models and benchmarks. Finally, we find that these differences persist after controlling for answer selection and rationale length, confirming that confidence and rationale diversity capture distinct effects of instruction tuning.", "arxiv_id": "2608.13430", "arxiv_url": "https://arxiv.org/abs/2608.13430", "authors": ["Irina Proskurina", "Mayank Kumar", "Oyindolapo O. Komolafe"], "brief": "\u672c\u6587\u7814\u7a76\u6307\u4ee4\u5fae\u8c03\u5982\u4f55\u5f71\u54cd\u8bed\u8a00\u6a21\u578b\u5728\u95ee\u7b54\u4e2d\u7684\u663e\u5f0f\u7f6e\u4fe1\u5ea6\u4e0e\u7b54\u6848\u7406\u7531\u7684\u8bcd\u6c47\u591a\u6837\u6027\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u6307\u4ee4\u5fae\u8c03\u4f1a\u7a33\u5b9a\u6539\u53d8\u6a21\u578b\u7f6e\u4fe1\u5ea6\uff0c\u4f46\u51c6\u786e\u7387\u53d8\u5316\u6709\u9650\u4e14\u4f3c\u7136\u6821\u51c6\u53d8\u5dee\uff1b\u540c\u65f6\uff0c\u4e0d\u540c\u7406\u7531\u4e4b\u95f4\u7684\u591a\u6837\u6027\u4e00\u81f4\u4e0b\u964d\uff0c\u800c\u8868\u5c42\u8bcd\u6c47\u591a\u6837\u6027\u7684\u53d8\u5316\u56e0\u6a21\u578b\u548c\u6570\u636e\u96c6\u800c\u5f02\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13430", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6307\u4ee4\u5fae\u8c03", "\u7f6e\u4fe1\u5ea6\u6821\u51c6", "\u95ee\u7b54", "\u8bed\u8a00\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13430v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Are You Sure You\u0027re Sure? On the Impact of Instruction Tuning on Confidence and Lexical Diversity", "tldr": "\u672c\u6587\u7814\u7a76\u6307\u4ee4\u5fae\u8c03\u5982\u4f55\u5f71\u54cd\u8bed\u8a00\u6a21\u578b\u5728\u95ee\u7b54\u4e2d\u7684\u663e\u5f0f\u7f6e\u4fe1\u5ea6\u4e0e\u7b54\u6848\u7406\u7531\u7684\u8bcd\u6c47\u591a\u6837\u6027\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u6307\u4ee4\u5fae\u8c03\u4f1a\u7a33\u5b9a\u6539\u53d8\u6a21\u578b\u7f6e\u4fe1\u5ea6\uff0c\u4f46\u51c6\u786e\u7387\u53d8\u5316\u6709\u9650\u4e14\u4f3c\u7136\u6821\u51c6\u53d8\u5dee\uff1b\u540c\u65f6\uff0c\u4e0d\u540c\u7406\u7531\u4e4b\u95f4\u7684\u591a\u6837\u6027\u4e00\u81f4\u4e0b\u964d\uff0c\u800c\u8868\u5c42\u8bcd\u6c47\u591a\u6837\u6027\u7684\u53d8\u5316\u56e0\u6a21\u578b\u548c\u6570\u636e\u96c6\u800c\u5f02\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Assessing the maturity of artificial intelligence technologies is essential for investment decisions, project management, and policy monitoring, yet the available readiness frameworks are heterogeneous and difficult to apply automatically: the adaptation of Technology Readiness Levels to AI lacks AI-specific gating criteria, the Machine Learning Technology Readiness Levels presuppose access to internal process artifacts, and AI/data readiness dimension models employ scales that resist direct comparison. This paper makes two contributions. First, we unify these three frameworks into the Unified AI Readiness Level (AIRL), a nine-level ordinal scale built on an environmental evidence ladder and complemented by dimensional caps (covering specification, data existence, data quality, data legality, expert knowledge, and algorithmic maturity) together with a generality-anchoring rule and explicit assignment disciplines, so that a readiness level becomes decidable from a natural-language description of the work alone. Second, we propose RAIL (Readiness Assessment via Independent LLM-experts), a panel-of-experts classifier that operationalizes the scale: one evidence agent and six independent dimension agents, each a large language model with a narrowly scoped mandate, deliver verdicts that a deterministic minimum rule aggregates and a chief expert reviews under asymmetric authority, confirming or lowering the panel\u0027s recommendation but never raising it above the caps. The method was tested in the analysis of several research works showing consistency and avoiding overestimation from monolithic LLM classifiers.", "arxiv_id": "2608.13428", "arxiv_url": "https://arxiv.org/abs/2608.13428", "authors": ["Juan Irving Vasquez", "Juan Terven", "Laura-Ivoone Garay-Jimenez"], "brief": "\u672c\u6587\u63d0\u51fa\u7edf\u4e00\u7684 AI \u5c31\u7eea\u5ea6\u7b49\u7ea7 AIRL\uff0c\u5c06\u591a\u79cd\u6210\u719f\u5ea6\u6846\u67b6\u6574\u5408\u4e3a\u53ef\u7531\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u5224\u5b9a\u7684\u4e5d\u7ea7\u91cf\u8868\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa RAIL\uff0c\u7528\u591a\u4e2a\u72ec\u7acb LLM \u4e13\u5bb6\u4ee3\u7406\u5206\u522b\u8bc4\u4f30\u8bc1\u636e\u4e0e\u7ef4\u5ea6\u4e0a\u9650\uff0c\u518d\u7531\u89c4\u5219\u805a\u5408\u548c\u603b\u4e13\u5bb6\u590d\u6838\uff0c\u4ee5\u51cf\u5c11\u5355\u4e00 LLM \u5206\u7c7b\u5668\u7684\u9ad8\u4f30\u95ee\u9898\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13428", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "AI\u8bc4\u4f30", "\u6280\u672f\u6210\u719f\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13428v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "RAIL: An Automatic Classifier of the Artificial Intelligence Readiness Level", "tldr": "\u672c\u6587\u63d0\u51fa\u7edf\u4e00\u7684 AI \u5c31\u7eea\u5ea6\u7b49\u7ea7 AIRL\uff0c\u5c06\u591a\u79cd\u6210\u719f\u5ea6\u6846\u67b6\u6574\u5408\u4e3a\u53ef\u7531\u81ea\u7136\u8bed\u8a00\u63cf\u8ff0\u5224\u5b9a\u7684\u4e5d\u7ea7\u91cf\u8868\u3002\u8fdb\u4e00\u6b65\u63d0\u51fa RAIL\uff0c\u7528\u591a\u4e2a\u72ec\u7acb LLM \u4e13\u5bb6\u4ee3\u7406\u5206\u522b\u8bc4\u4f30\u8bc1\u636e\u4e0e\u7ef4\u5ea6\u4e0a\u9650\uff0c\u518d\u7531\u89c4\u5219\u805a\u5408\u548c\u603b\u4e13\u5bb6\u590d\u6838\uff0c\u4ee5\u51cf\u5c11\u5355\u4e00 LLM \u5206\u7c7b\u5668\u7684\u9ad8\u4f30\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Transformer-based language models achieve strong performance but incur substantial inference cost due to repeated high-dimensional matrix multiplications. We propose Reduced Matrix Multiplication (RMM), a training-free, input-adaptive inference method that reduces Transformer matrix products by selecting informative slices along their contraction dimensions, without modifying model weights. Under a simple retention-ratio control, RMM provides a smooth and predictable accuracy-efficiency trade-off. Across language models ranging from 1B to 70B parameters, we find that reduction tolerance depends on the model family, task, component, and retention ratio, although it often improves with model scale. Under moderate reduction, RMM remains robust across the evaluated discriminative, autoregressive generation, and long-context settings. We further show that the same principle extends to multimodal vision-language inference. Mechanistic ablations reveal a structural asymmetry within Transformers: attention-side computations are substantially more reducible than MLP components. Finally, wall-clock benchmarks with custom kernels on an NVIDIA A100 show that these computational savings can translate into practical runtime gains, especially at longer sequence lengths. Together, these results position RMM as a scalable direction for input-adaptive inference-time optimization.", "arxiv_id": "2608.13426", "arxiv_url": "https://arxiv.org/abs/2608.13426", "authors": ["Zixuan Lan", "Yanhong Li", "Jiawei Zhou"], "brief": "\u8bba\u6587\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 Reduced Matrix Multiplication\uff08RMM\uff09\uff0c\u5728 LLM \u63a8\u7406\u65f6\u6839\u636e\u8f93\u5165\u81ea\u9002\u5e94\u9009\u62e9\u77e9\u9635\u4e58\u6cd5\u6536\u7f29\u7ef4\u5ea6\u4e0a\u7684\u5173\u952e\u4fe1\u606f\u5207\u7247\uff0c\u4ece\u800c\u51cf\u5c11\u8ba1\u7b97\u4e14\u4e0d\u6539\u6a21\u578b\u6743\u91cd\u3002\u5b9e\u9a8c\u8986\u76d6 1B \u5230 70B \u8bed\u8a00\u6a21\u578b\u53ca\u591a\u6a21\u6001\u6a21\u578b\uff0c\u663e\u793a\u5728\u4e2d\u7b49\u538b\u7f29\u4e0b\u80fd\u4fdd\u6301\u8f83\u597d\u7cbe\u5ea6\u5e76\u5e26\u6765\u5b9e\u9645\u52a0\u901f\uff0c\u4e14\u6ce8\u610f\u529b\u8ba1\u7b97\u6bd4 MLP \u66f4\u6613\u88ab\u524a\u51cf\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13426", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u63a8\u7406\u52a0\u901f", "\u77e9\u9635\u4e58\u6cd5", "\u591a\u6a21\u6001"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13426v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Reduced Matrix Multiplication: Input-Adaptive Matrix-Product Reduction for LLM Inference", "tldr": "\u8bba\u6587\u63d0\u51fa\u65e0\u9700\u8bad\u7ec3\u7684 Reduced Matrix Multiplication\uff08RMM\uff09\uff0c\u5728 LLM \u63a8\u7406\u65f6\u6839\u636e\u8f93\u5165\u81ea\u9002\u5e94\u9009\u62e9\u77e9\u9635\u4e58\u6cd5\u6536\u7f29\u7ef4\u5ea6\u4e0a\u7684\u5173\u952e\u4fe1\u606f\u5207\u7247\uff0c\u4ece\u800c\u51cf\u5c11\u8ba1\u7b97\u4e14\u4e0d\u6539\u6a21\u578b\u6743\u91cd\u3002\u5b9e\u9a8c\u8986\u76d6 1B \u5230 70B \u8bed\u8a00\u6a21\u578b\u53ca\u591a\u6a21\u6001\u6a21\u578b\uff0c\u663e\u793a\u5728\u4e2d\u7b49\u538b\u7f29\u4e0b\u80fd\u4fdd\u6301\u8f83\u597d\u7cbe\u5ea6\u5e76\u5e26\u6765\u5b9e\u9645\u52a0\u901f\uff0c\u4e14\u6ce8\u610f\u529b\u8ba1\u7b97\u6bd4 MLP \u66f4\u6613\u88ab\u524a\u51cf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Embodied intelligent virtual agents are expected to operate as persistent, adaptive, and context-aware entities within complex virtual and Metaverse worlds. However, implementing cognitively capable agents in such environments is conceptually and technologically challenging. Among a range of blueprints and development approaches, the Cognitive Embodied Agent Architecture (CEAA) has been developed as an implementation-oriented framework for architecting components of perception, memory, reasoning, planning, and embodied action. Considering the recent advances in edge computing and generative AI language models, this paper explores the use of Small Language Models (SLMs) to support edge-based operation of selected CEAA components, focusing on \"Think\" and \"Memory\" as processes central to cognitive orchestration and persistence of virtual agents in interactive virtual worlds. An edge-based virtual agent gateway system was developed and evaluated on an NVIDIA Jetson Orin NX using Qwen2.5 models of different sizes, exploring the system\u0027s capability to process service requests and handle memory-driven conversations. A series of simulation experiments evaluated routing accuracy, memory-read performance, and latency, demonstrating an SLM-driven prototype agent system that partially implements selected CEAA processes to support the development of embodied agents whose cognitive \"brain\" can operate efficiently and contextually for interactive experiences in immersive virtual worlds.", "arxiv_id": "2608.13420", "arxiv_url": "https://arxiv.org/abs/2608.13420", "authors": ["Aimilios Hadjiliasi", "Louis Nisiotis"], "brief": "\u672c\u6587\u63a2\u7d22\u7528\u5c0f\u8bed\u8a00\u6a21\u578b\u548c\u8fb9\u7f18\u8ba1\u7b97\u5b9e\u73b0\u865a\u62df\u5177\u8eab\u667a\u80fd\u4f53\u7684\u8ba4\u77e5\u7ec4\u4ef6\uff0c\u805a\u7126 CEAA \u67b6\u6784\u4e2d\u7684\u201c\u601d\u8003\u201d\u548c\u201c\u8bb0\u5fc6\u201d\u8fc7\u7a0b\u3002\u4f5c\u8005\u5728 NVIDIA Jetson Orin NX \u4e0a\u7528\u4e0d\u540c\u89c4\u6a21\u7684 Qwen2.5 \u6a21\u578b\u6784\u5efa\u5e76\u8bc4\u4f30\u539f\u578b\u7cfb\u7edf\uff0c\u5728\u8bf7\u6c42\u8def\u7531\u3001\u8bb0\u5fc6\u8bfb\u53d6\u548c\u5ef6\u8fdf\u65b9\u9762\u9a8c\u8bc1\u4e86\u8fb9\u7f18\u7aef\u667a\u80fd\u4f53\u5927\u8111\u7684\u53ef\u884c\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13420", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5c0f\u8bed\u8a00\u6a21\u578b", "\u8fb9\u7f18\u8ba1\u7b97", "\u8bb0\u5fc6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13420v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Enhancing Virtual Agents through SLMs and Edge-Computing: An Exploratory Evaluation of Think and Memory Processes", "tldr": "\u672c\u6587\u63a2\u7d22\u7528\u5c0f\u8bed\u8a00\u6a21\u578b\u548c\u8fb9\u7f18\u8ba1\u7b97\u5b9e\u73b0\u865a\u62df\u5177\u8eab\u667a\u80fd\u4f53\u7684\u8ba4\u77e5\u7ec4\u4ef6\uff0c\u805a\u7126 CEAA \u67b6\u6784\u4e2d\u7684\u201c\u601d\u8003\u201d\u548c\u201c\u8bb0\u5fc6\u201d\u8fc7\u7a0b\u3002\u4f5c\u8005\u5728 NVIDIA Jetson Orin NX \u4e0a\u7528\u4e0d\u540c\u89c4\u6a21\u7684 Qwen2.5 \u6a21\u578b\u6784\u5efa\u5e76\u8bc4\u4f30\u539f\u578b\u7cfb\u7edf\uff0c\u5728\u8bf7\u6c42\u8def\u7531\u3001\u8bb0\u5fc6\u8bfb\u53d6\u548c\u5ef6\u8fdf\u65b9\u9762\u9a8c\u8bc1\u4e86\u8fb9\u7f18\u7aef\u667a\u80fd\u4f53\u5927\u8111\u7684\u53ef\u884c\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We consider the problem of autonomously learning robot skills under a limited practice budget for sequential tasks. We propose an active skill learning algorithm, \\emph{Deliberate Practice (DP)}, that computes a provably \\emph{budget-optimal} allocation---practicing skills that maximize expected cumulative reward while being learnable within the budget. DP estimates both the time needed to master skills and the cumulative reward of the task plans that the skills unlock. Computing a budget-optimal allocation is challenging as it requires reasoning about combinatorially many skill plans over a large practice budget. Our key contribution is a bilinear program that can compute this exactly using off-the-shelf solvers. Through simulated and real-world experiments on long-horizon manipulation tasks, we show that our approach allows robots to optimally use limited practice time to acquire useful policies and improve long-horizon planning.", "arxiv_id": "2608.13415", "arxiv_url": "https://arxiv.org/abs/2608.13415", "authors": ["Shivam Vats", "Sudarshan Harithas", "Mete Tuluhan Akbulut", "Arvind Raghunathan", "George Konidaris"], "brief": "\u8bba\u6587\u7814\u7a76\u673a\u5668\u4eba\u5728\u6709\u9650\u7ec3\u4e60\u9884\u7b97\u4e0b\u5982\u4f55\u81ea\u4e3b\u5b66\u4e60\u957f\u5e8f\u5217\u4efb\u52a1\u6280\u80fd\uff0c\u63d0\u51fa Deliberate Practice \u4e3b\u52a8\u6280\u80fd\u5b66\u4e60\u7b97\u6cd5\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u4f30\u8ba1\u6280\u80fd\u638c\u63e1\u65f6\u95f4\u53ca\u5176\u89e3\u9501\u4efb\u52a1\u8ba1\u5212\u7684\u7d2f\u8ba1\u6536\u76ca\uff0c\u5e76\u7528\u53cc\u7ebf\u6027\u89c4\u5212\u7cbe\u786e\u6c42\u89e3\u9884\u7b97\u6700\u4f18\u7ec3\u4e60\u5206\u914d\uff0c\u5728\u4eff\u771f\u548c\u771f\u5b9e\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u4e2d\u63d0\u5347\u4e86\u6709\u9650\u7ec3\u4e60\u65f6\u95f4\u7684\u5229\u7528\u6548\u7387\u548c\u89c4\u5212\u8868\u73b0\u3002", "categories": ["cs.RO", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13415", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u4e3b\u52a8\u5b66\u4e60", "\u957f\u7a0b\u89c4\u5212", "\u6280\u80fd\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13415v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Deliberate Practice: Learning Robot Skills under a Budget", "tldr": "\u8bba\u6587\u7814\u7a76\u673a\u5668\u4eba\u5728\u6709\u9650\u7ec3\u4e60\u9884\u7b97\u4e0b\u5982\u4f55\u81ea\u4e3b\u5b66\u4e60\u957f\u5e8f\u5217\u4efb\u52a1\u6280\u80fd\uff0c\u63d0\u51fa Deliberate Practice \u4e3b\u52a8\u6280\u80fd\u5b66\u4e60\u7b97\u6cd5\u3002\u8be5\u65b9\u6cd5\u901a\u8fc7\u4f30\u8ba1\u6280\u80fd\u638c\u63e1\u65f6\u95f4\u53ca\u5176\u89e3\u9501\u4efb\u52a1\u8ba1\u5212\u7684\u7d2f\u8ba1\u6536\u76ca\uff0c\u5e76\u7528\u53cc\u7ebf\u6027\u89c4\u5212\u7cbe\u786e\u6c42\u89e3\u9884\u7b97\u6700\u4f18\u7ec3\u4e60\u5206\u914d\uff0c\u5728\u4eff\u771f\u548c\u771f\u5b9e\u957f\u7a0b\u64cd\u4f5c\u4efb\u52a1\u4e2d\u63d0\u5347\u4e86\u6709\u9650\u7ec3\u4e60\u65f6\u95f4\u7684\u5229\u7528\u6548\u7387\u548c\u89c4\u5212\u8868\u73b0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Parliamentary proceedings are a primary record of democratic deliberation, yet their volume and fragmentation make multi-perspective access difficult for citizens, journalists, and researchers. Applying Retrieval-Augmented Generation (RAG) to parliamentary transcripts introduces three specific risks: dominance of the most frequent speakers, inability to weight speakers according to topical expertise, and citation misattribution in politically sensitive text. We present ParliamentRAG, a RAG system for the Italian Chamber of Deputies that addresses these risks jointly. Its core contribution is a topic-dependent authority model that estimates each speaker\u0027s authority as a function of the current query, combining interpretable components such as profession, education, and previous interventions. Given a user query, the system retrieves relevant speech chunks, identifies topic-relevant experts across parliamentary groups, and generates a summary synthesizing their perspectives, accompanied by supporting quotations. ParliamentRAG is evaluated against Google NotebookLM on 15 policy topics via a two-level protocol combining automated metrics and blind A/B human evaluation by six domain experts. The system achieves higher coverage across political groups (0.97 vs. 0.95), perfect quotation faithfulness (1.00 vs. 0.95), and stronger expert preferences on source-related dimensions, while NotebookLM remains stronger on prose-oriented dimensions.", "arxiv_id": "2608.13410", "arxiv_url": "https://arxiv.org/abs/2608.13410", "authors": ["Mirko Tritella", "Riccardo Pozzi", "Matteo Palmonari"], "brief": "\u672c\u6587\u63d0\u51fa ParliamentRAG\uff0c\u7528\u4e8e\u610f\u5927\u5229\u4f17\u8bae\u9662\u8bae\u4e8b\u8bb0\u5f55\u7684\u6743\u5a01\u611f\u77e5\u591a\u89c6\u89d2\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u3002\u7cfb\u7edf\u6839\u636e\u67e5\u8be2\u4e3b\u9898\u7ed3\u5408\u804c\u4e1a\u3001\u6559\u80b2\u548c\u65e2\u5f80\u53d1\u8a00\u7b49\u56e0\u7d20\u4f30\u8ba1\u53d1\u8a00\u4eba\u6743\u5a01\uff0c\u63d0\u5347\u8de8\u515a\u6d3e\u8986\u76d6\u4e0e\u5f15\u7528\u5fe0\u5b9e\u5ea6\uff1b\u76f8\u6bd4 Google NotebookLM\uff0c\u5728\u6765\u6e90\u76f8\u5173\u7ef4\u5ea6\u66f4\u53d7\u4e13\u5bb6\u504f\u597d\uff0c\u4f46\u6587\u98ce\u8868\u8fbe\u7a0d\u5f31\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13410", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u68c0\u7d22\u589e\u5f3a\u751f\u6210", "\u653f\u6cbb\u6587\u672c", "\u4fe1\u606f\u68c0\u7d22", "\u53ef\u4fe1\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13410v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Who Speaks Matters: Authority-Aware Multi-View RAG over Italian Parliamentary Proceedings", "tldr": "\u672c\u6587\u63d0\u51fa ParliamentRAG\uff0c\u7528\u4e8e\u610f\u5927\u5229\u4f17\u8bae\u9662\u8bae\u4e8b\u8bb0\u5f55\u7684\u6743\u5a01\u611f\u77e5\u591a\u89c6\u89d2\u68c0\u7d22\u589e\u5f3a\u751f\u6210\u3002\u7cfb\u7edf\u6839\u636e\u67e5\u8be2\u4e3b\u9898\u7ed3\u5408\u804c\u4e1a\u3001\u6559\u80b2\u548c\u65e2\u5f80\u53d1\u8a00\u7b49\u56e0\u7d20\u4f30\u8ba1\u53d1\u8a00\u4eba\u6743\u5a01\uff0c\u63d0\u5347\u8de8\u515a\u6d3e\u8986\u76d6\u4e0e\u5f15\u7528\u5fe0\u5b9e\u5ea6\uff1b\u76f8\u6bd4 Google NotebookLM\uff0c\u5728\u6765\u6e90\u76f8\u5173\u7ef4\u5ea6\u66f4\u53d7\u4e13\u5bb6\u504f\u597d\uff0c\u4f46\u6587\u98ce\u8868\u8fbe\u7a0d\u5f31\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Existing predictive models in learning analytics often treat student academic history as a simple sequence, overlooking the concurrent nature of courses taken within a semester. This simplification can lead to inaccurate performance predictions, particularly for students with heavy or challenging course loads. This paper introduces a TRansformer for Academic Course-grade Estimation (TRACE) that addresses this limitation by jointly predicting both the set of courses a student will take and their corresponding grades for an upcoming semester. Our approach encodes courses on a per-semester basis to capture the effects of course concurrency and utilizes a novel loss function combining course-set prediction with grade prediction. We demonstrate that predicting courses taken in addition to the grades in those courses leads to significant improvements in prediction quality. Trained on ten years of institutional data, our joint prediction model reduces mean absolute error by nearly 50% compared to an identical architecture that predicts grades alone. The model also outperforms traditional LSTM-based sequential models, as well as graph neural network-based approaches, and offers natural ways to incorporate student attribute data. This work demonstrates the utility of modern neural architectures for creating interpretable models that can be adapted to new institutions via retraining and recalibration, as well as the importance of key techniques, such as predicting courses taken during training. We discuss how this model could be incorporated into early detection systems at institutions of higher education.", "arxiv_id": "2608.13409", "arxiv_url": "https://arxiv.org/abs/2608.13409", "authors": ["Paul Savala"], "brief": "\u672c\u6587\u63d0\u51fa\u57fa\u4e8e Transformer \u7684 TRACE \u6a21\u578b\uff0c\u6309\u5b66\u671f\u7f16\u7801\u5b66\u751f\u8bfe\u7a0b\u5e76\u8054\u5408\u9884\u6d4b\u4e0b\u5b66\u671f\u9009\u8bfe\u96c6\u5408\u53ca\u5bf9\u5e94\u6210\u7ee9\uff0c\u4ee5\u663e\u5f0f\u5efa\u6a21\u540c\u4e00\u5b66\u671f\u8bfe\u7a0b\u5e76\u53d1\u5e26\u6765\u7684\u5f71\u54cd\u3002\u5728\u5341\u5e74\u9ad8\u6821\u6570\u636e\u4e0a\uff0c\u76f8\u6bd4\u53ea\u9884\u6d4b\u6210\u7ee9\u7684\u76f8\u540c\u67b6\u6784\uff0c\u5e73\u5747\u7edd\u5bf9\u8bef\u5dee\u964d\u4f4e\u8fd1 50%\uff0c\u5e76\u4f18\u4e8e LSTM \u548c\u56fe\u795e\u7ecf\u7f51\u7edc\u65b9\u6cd5\uff0c\u53ef\u7528\u4e8e\u5b66\u4e1a\u9884\u8b66\u7cfb\u7edf\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13409", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6559\u80b2\u6570\u636e\u6316\u6398", "Transformer", "\u6210\u7ee9\u9884\u6d4b", "\u5b66\u4e60\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13409v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Jointly Predicting Courses and Grades Using a Transformer-Based Model", "tldr": "\u672c\u6587\u63d0\u51fa\u57fa\u4e8e Transformer \u7684 TRACE \u6a21\u578b\uff0c\u6309\u5b66\u671f\u7f16\u7801\u5b66\u751f\u8bfe\u7a0b\u5e76\u8054\u5408\u9884\u6d4b\u4e0b\u5b66\u671f\u9009\u8bfe\u96c6\u5408\u53ca\u5bf9\u5e94\u6210\u7ee9\uff0c\u4ee5\u663e\u5f0f\u5efa\u6a21\u540c\u4e00\u5b66\u671f\u8bfe\u7a0b\u5e76\u53d1\u5e26\u6765\u7684\u5f71\u54cd\u3002\u5728\u5341\u5e74\u9ad8\u6821\u6570\u636e\u4e0a\uff0c\u76f8\u6bd4\u53ea\u9884\u6d4b\u6210\u7ee9\u7684\u76f8\u540c\u67b6\u6784\uff0c\u5e73\u5747\u7edd\u5bf9\u8bef\u5dee\u964d\u4f4e\u8fd1 50%\uff0c\u5e76\u4f18\u4e8e LSTM \u548c\u56fe\u795e\u7ecf\u7f51\u7edc\u65b9\u6cd5\uff0c\u53ef\u7528\u4e8e\u5b66\u4e1a\u9884\u8b66\u7cfb\u7edf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "6G networks will not be serving as communication infrastructures only; rather, they are expected to evolve into intelligent systems, where thousands of autonomous artificial intelligence (AI) agents are interconnected. The agents are deployed across a wide range of platforms including low Earth orbit (LEO) satellites, high-altitude platforms (HAPs), unmanned aerial vehicles (UAVs), edge servers, and terrestrial devices. These agents continuously observe their environment and exchange information. Semantic communication provides an efficient mechanism for exchanging meaningful information instead of raw data. However, its effectiveness depends on the communicating agents having sufficiently aligned beliefs to correctly interpret and decode the transmitted messages. This assumption becomes difficult to satisfy in the 6G network where heterogeneous AI models operate under diverse computational constraints and continuously acquire different knowledge from their local environments. This article presents a heterogeneity-aware belief synchronization framework for 6G AI-native networks. It uses latent translation models deployed on multi-access edge computing (MEC) servers. These models translate belief updates from one agent to agent-specific knowledge without requiring joint training and a homogeneous architecture of models. By exchanging compact belief updates through a latent translation model only when necessary, the framework preserves privacy, reduces synchronization cost, and minimizes local knowledge drift. We validate the framework through a case study on a multi-layered terrestrial/non-terrestrial network. Results demonstrate that it maintains low synchronization cost, measured by the number of parameters transmitted, and low belief alignment error across the heterogeneous agents in the case study.", "arxiv_id": "2608.13394", "arxiv_url": "https://arxiv.org/abs/2608.13394", "authors": ["Muhammad Hannan Akram", "Muhammad Abubakar Rashid", "Wassi Haider Kabir", "Haejoon Jung", "Kapal Dev", "Syed Ali Hassan"], "brief": "\u672c\u6587\u63d0\u51fa\u9762\u5411 AI \u539f\u751f 6G \u7f51\u7edc\u7684\u5f02\u6784\u611f\u77e5\u4fe1\u5ff5\u540c\u6b65\u6846\u67b6\uff0c\u7528 MEC \u670d\u52a1\u5668\u4e0a\u7684\u6f5c\u5728\u7ffb\u8bd1\u6a21\u578b\u5728\u4e0d\u540c AI \u667a\u80fd\u4f53\u4e4b\u95f4\u8f6c\u6362\u4fe1\u5ff5\u66f4\u65b0\uff0c\u65e0\u9700\u8054\u5408\u8bad\u7ec3\u6216\u540c\u6784\u6a21\u578b\u67b6\u6784\u3002\u901a\u8fc7\u4ec5\u5728\u5fc5\u8981\u65f6\u4ea4\u6362\u7d27\u51d1\u7684\u4fe1\u5ff5\u66f4\u65b0\uff0c\u8be5\u65b9\u6cd5\u964d\u4f4e\u540c\u6b65\u5f00\u9500\u3001\u4fdd\u62a4\u9690\u79c1\u5e76\u51cf\u5c11\u77e5\u8bc6\u6f02\u79fb\uff1b\u6848\u4f8b\u7814\u7a76\u663e\u793a\u5176\u5728\u5f02\u6784\u5929\u5730\u4e00\u4f53\u7f51\u7edc\u4e2d\u4fdd\u6301\u8f83\u4f4e\u53c2\u6570\u4f20\u8f93\u91cf\u548c\u4fe1\u5ff5\u5bf9\u9f50\u8bef\u5dee\u3002", "categories": ["eess.SP", "cs.AI", "cs.MA"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13394", "impact_score": 6, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u8bed\u4e49\u901a\u4fe1", "6G\u7f51\u7edc", "\u8fb9\u7f18\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13394v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Heterogeneity-Aware Belief Synchronization for Semantic Communication in AI-Native 6G Networks", "tldr": "\u672c\u6587\u63d0\u51fa\u9762\u5411 AI \u539f\u751f 6G \u7f51\u7edc\u7684\u5f02\u6784\u611f\u77e5\u4fe1\u5ff5\u540c\u6b65\u6846\u67b6\uff0c\u7528 MEC \u670d\u52a1\u5668\u4e0a\u7684\u6f5c\u5728\u7ffb\u8bd1\u6a21\u578b\u5728\u4e0d\u540c AI \u667a\u80fd\u4f53\u4e4b\u95f4\u8f6c\u6362\u4fe1\u5ff5\u66f4\u65b0\uff0c\u65e0\u9700\u8054\u5408\u8bad\u7ec3\u6216\u540c\u6784\u6a21\u578b\u67b6\u6784\u3002\u901a\u8fc7\u4ec5\u5728\u5fc5\u8981\u65f6\u4ea4\u6362\u7d27\u51d1\u7684\u4fe1\u5ff5\u66f4\u65b0\uff0c\u8be5\u65b9\u6cd5\u964d\u4f4e\u540c\u6b65\u5f00\u9500\u3001\u4fdd\u62a4\u9690\u79c1\u5e76\u51cf\u5c11\u77e5\u8bc6\u6f02\u79fb\uff1b\u6848\u4f8b\u7814\u7a76\u663e\u793a\u5176\u5728\u5f02\u6784\u5929\u5730\u4e00\u4f53\u7f51\u7edc\u4e2d\u4fdd\u6301\u8f83\u4f4e\u53c2\u6570\u4f20\u8f93\u91cf\u548c\u4fe1\u5ff5\u5bf9\u9f50\u8bef\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Enterprise security topology design requires translating business intent, regulatory requirements, and risk assumptions into zones, boundary devices, inter-zone paths, and access-control policies. Existing NetOps automation tools mainly operate after this design is fixed, providing limited support for generating structured security topologies from underspecified natural-language requirements. We present TopoIntent, a system that compiles security intent into executable, compliance-checked network topologies. It uses a schema contract to constrain generation, retrieves reference architectures from a curated template library via dense-vector search, and applies staged fusion for intent-template alignment and security completion. The generated topology is checked against CIS Controls v8.1.2 safeguards visible at the topology layer, while unresolved cases are marked for manual review. Structural gaps are repaired through additive schema-preserving edits. The final topology is exported to Mininet scripts with kernel-level iptables ACLs, enabling executable reachability and allow/deny tests. Because no public benchmark exists for this requirement-to-topology task, we construct an evaluation set from reference security architecture diagrams. The retrieval set contains 22 templates and 44 synthetic intents across five scenarios, while the held-out set contains 7 templates and 14 intents from finance and government scenarios excluded from retrieval. On the held-out set, additive repair improves topology-visible CIS satisfaction from 0.78 to 1.00 in fewer than 1.5 rounds on average, and one feedback round raises the post-ACL policy pass rate from 0.78 to 0.88.", "arxiv_id": "2608.13389", "arxiv_url": "https://arxiv.org/abs/2608.13389", "authors": ["Xiaokang Qu", "Jianliang Ma", "Zao Fan", "Tianshu Chu", "Tianlong Fan", "Linyuan L\u00fc"], "brief": "TopoIntent \u5c06\u4f01\u4e1a\u5b89\u5168\u610f\u56fe\u3001\u5408\u89c4\u8981\u6c42\u548c\u98ce\u9669\u5047\u8bbe\u7f16\u8bd1\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u68c0\u67e5\u7684\u7f51\u7edc\u5b89\u5168\u62d3\u6251\uff0c\u7ed3\u5408\u6a21\u677f\u68c0\u7d22\u3001\u7ed3\u6784\u5316\u751f\u6210\u3001\u5206\u9636\u6bb5\u878d\u5408\u4e0e\u5408\u89c4\u6821\u9a8c\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u4fdd\u7559\u6d4b\u8bd5\u96c6\u4e0a\uff0c\u589e\u91cf\u4fee\u590d\u5c06\u62d3\u6251\u5c42 CIS \u5408\u89c4\u6ee1\u8db3\u7387\u4ece 0.78 \u63d0\u5347\u5230 1.00\uff0c\u4e00\u8f6e\u53cd\u9988\u5c06 ACL \u7b56\u7565\u901a\u8fc7\u7387\u4ece 0.78 \u63d0\u5347\u5230 0.88\u3002", "categories": ["cs.AI", "cs.CR", "cs.NI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13389", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u5408\u89c4\u68c0\u67e5", "\u81ea\u52a8\u5316\u8fd0\u7ef4", "\u62d3\u6251\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13389v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "TopoIntent: Compiling Security Intent into Executable, Compliance-Checked Network Topologies", "tldr": "TopoIntent \u5c06\u4f01\u4e1a\u5b89\u5168\u610f\u56fe\u3001\u5408\u89c4\u8981\u6c42\u548c\u98ce\u9669\u5047\u8bbe\u7f16\u8bd1\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u68c0\u67e5\u7684\u7f51\u7edc\u5b89\u5168\u62d3\u6251\uff0c\u7ed3\u5408\u6a21\u677f\u68c0\u7d22\u3001\u7ed3\u6784\u5316\u751f\u6210\u3001\u5206\u9636\u6bb5\u878d\u5408\u4e0e\u5408\u89c4\u6821\u9a8c\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u4fdd\u7559\u6d4b\u8bd5\u96c6\u4e0a\uff0c\u589e\u91cf\u4fee\u590d\u5c06\u62d3\u6251\u5c42 CIS \u5408\u89c4\u6ee1\u8db3\u7387\u4ece 0.78 \u63d0\u5347\u5230 1.00\uff0c\u4e00\u8f6e\u53cd\u9988\u5c06 ACL \u7b56\u7565\u901a\u8fc7\u7387\u4ece 0.78 \u63d0\u5347\u5230 0.88\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This preliminary technical report presents a framework for sign language video synthesis using a loss-guided multi-expert Generative Adversarial Network (GAN) to enhance communication for individuals with hearing impairments. Three specialized discriminators -- global, hand, and head -- each guide a corresponding expert branch in the generator toward a distinct visual region, enabling implicit feature specialization without explicit diversity losses. To stabilize this multi-discriminator system, whose early-phase training otherwise exhibits chaotic dynamics, we introduce a United Loss consensus mechanism that regularizes each discriminator toward the ensemble average at a 10% weight. Each branch further adopts a dual-pathway convolutional-transformer design with learnable AdaptiveFeatureFusion, balancing the stability of convolutions against the detail of windowed self-attention. The generator is trained using an alternating three-mode schedule (discriminator, holistic generation, branch-specialized generation). On a custom 156GB dataset with a filtered test set that removes easy and repetitive samples, our 0.2B-parameter variant achieves 29.8 PSNR and the 1.3B-parameter variant achieves 30.7 PSNR, with inference VRAM footprints of 1.5 GB and 8 GB respectively, enabling deployment on consumer-grade hardware. Full ablation studies remain ongoing due to the 2-3 month training cycle on a single GPU. The system was showcased at the 2025 Hong Kong Frontier Technology Summit.", "arxiv_id": "2608.13368", "arxiv_url": "https://arxiv.org/abs/2608.13368", "authors": ["Dingzhan Nong", "Zhihao Ren", "Ziqi Li", "Tim Lo"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u624b\u8bed\u89c6\u9891\u5408\u6210\u7684\u635f\u5931\u5f15\u5bfc\u591a\u4e13\u5bb6GAN\uff0c\u901a\u8fc7\u5168\u5c40\u3001\u624b\u90e8\u3001\u5934\u90e8\u4e09\u4e2a\u5224\u522b\u5668\u5206\u522b\u5f15\u5bfc\u751f\u6210\u5668\u5206\u652f\u5b66\u4e60\u4e0d\u540c\u89c6\u89c9\u533a\u57df\u3002\u5176\u8054\u5408\u635f\u5931\u673a\u5236\u7528\u4e8e\u7a33\u5b9a\u591a\u5224\u522b\u5668\u8bad\u7ec3\uff0c0.2B\u548c1.3B\u6a21\u578b\u5728\u81ea\u5efa\u8fc7\u6ee4\u6d4b\u8bd5\u96c6\u4e0a\u5206\u522b\u8fbe\u523029.8\u548c30.7 PSNR\uff0c\u5e76\u5177\u5907\u6d88\u8d39\u7ea7\u786c\u4ef6\u90e8\u7f72\u6f5c\u529b\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13368", "impact_score": 5, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u9891\u751f\u6210", "\u624b\u8bed\u5408\u6210", "\u751f\u6210\u5bf9\u6297\u7f51\u7edc", "\u591a\u4e13\u5bb6\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13368v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Sign Language Video Synthesis via Loss-Guided Multi-Expert GANs", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u7528\u4e8e\u624b\u8bed\u89c6\u9891\u5408\u6210\u7684\u635f\u5931\u5f15\u5bfc\u591a\u4e13\u5bb6GAN\uff0c\u901a\u8fc7\u5168\u5c40\u3001\u624b\u90e8\u3001\u5934\u90e8\u4e09\u4e2a\u5224\u522b\u5668\u5206\u522b\u5f15\u5bfc\u751f\u6210\u5668\u5206\u652f\u5b66\u4e60\u4e0d\u540c\u89c6\u89c9\u533a\u57df\u3002\u5176\u8054\u5408\u635f\u5931\u673a\u5236\u7528\u4e8e\u7a33\u5b9a\u591a\u5224\u522b\u5668\u8bad\u7ec3\uff0c0.2B\u548c1.3B\u6a21\u578b\u5728\u81ea\u5efa\u8fc7\u6ee4\u6d4b\u8bd5\u96c6\u4e0a\u5206\u522b\u8fbe\u523029.8\u548c30.7 PSNR\uff0c\u5e76\u5177\u5907\u6d88\u8d39\u7ea7\u786c\u4ef6\u90e8\u7f72\u6f5c\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial Intelligence (AI) safety systems combine character shaping (e.g., Reinforcement Learning from Human Feedback [RLHF], Constitutional AI), which modifies behavioral distributions at training time, with rule enforcement (e.g., output filters, safety classifiers), which blocks harmful outputs at inference time, yet little formal analysis exists on how their optimal balance should change as deployment scales increase. We introduce a stylized comparative-statics model that parameterizes safety design as a resource allocation alpha in [0,1] between these two approaches, incorporating scale-dependent filter degradation, common-mode failures, and character fragility -- the risk that shaped behavior degrades or collapses under novel conditions. Under a multiplicative Pareto damage model, we derive closed-form expected harm and supplement it with tail-risk (CVaR) analysis via Monte Carlo simulation. Across three scenarios (optimistic, moderate, pessimistic), the optimal alpha* is interior or at the rules-only boundary and shifts weakly toward character shaping as deployment scale T grows, from negligible (Delta alpha* = +0.01) to pronounced (Delta alpha* = +0.21) depending on scenario. The dominant parameter is the baseline character fragility rate p^(0)_frag, which shifts alpha* by 0.50 across its range -- far exceeding the effect of tail severity, filter quality, or common-mode failure probability. CVaR and expected-harm optima converge at large T. These results suggest that safety architecture decisions depend less on deployment scale per se than on the reliability of character shaping under distributional shift.", "arxiv_id": "2608.13345", "arxiv_url": "https://arxiv.org/abs/2608.13345", "authors": ["Satoshi Takahashi", "Nobuji Kouno", "Masaaki Komatsu", "Ryuji Hamamoto"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u5f62\u5f0f\u5316\u6bd4\u8f83\u9759\u6001\u6a21\u578b\uff0c\u5c06 AI \u5b89\u5168\u8d44\u6e90\u5728\u8bad\u7ec3\u671f\u7684\u201c\u54c1\u683c\u5851\u9020\u201d\uff08\u5982 RLHF\u3001\u5baa\u6cd5\u5f0f AI\uff09\u4e0e\u63a8\u7406\u671f\u7684\u201c\u89c4\u5219\u6267\u884c\u201d\uff08\u5982\u8fc7\u6ee4\u5668\u3001\u5b89\u5168\u5206\u7c7b\u5668\uff09\u4e4b\u95f4\u5206\u914d\uff0c\u5e76\u5206\u6790\u90e8\u7f72\u89c4\u6a21\u6269\u5927\u65f6\u7684\u6700\u4f18\u6743\u8861\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6700\u4f18\u7b56\u7565\u66f4\u591a\u53d6\u51b3\u4e8e\u54c1\u683c\u5851\u9020\u5728\u5206\u5e03\u5916\u573a\u666f\u4e0b\u7684\u8106\u5f31\u6027\uff0c\u800c\u975e\u90e8\u7f72\u89c4\u6a21\u672c\u8eab\uff1b\u5728\u4e0d\u540c\u60c5\u666f\u4e2d\uff0c\u6700\u4f18\u5206\u914d\u53ef\u80fd\u504f\u5411\u89c4\u5219\u6216\u4ec5\u5c0f\u5e45\u8f6c\u5411\u54c1\u683c\u5851\u9020\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13345", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["AI\u5b89\u5168", "RLHF", "\u5b89\u5168\u8fc7\u6ee4", "\u98ce\u9669\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13345v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Rules or Character? Scaling Laws for AI Safety Design", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u5f62\u5f0f\u5316\u6bd4\u8f83\u9759\u6001\u6a21\u578b\uff0c\u5c06 AI \u5b89\u5168\u8d44\u6e90\u5728\u8bad\u7ec3\u671f\u7684\u201c\u54c1\u683c\u5851\u9020\u201d\uff08\u5982 RLHF\u3001\u5baa\u6cd5\u5f0f AI\uff09\u4e0e\u63a8\u7406\u671f\u7684\u201c\u89c4\u5219\u6267\u884c\u201d\uff08\u5982\u8fc7\u6ee4\u5668\u3001\u5b89\u5168\u5206\u7c7b\u5668\uff09\u4e4b\u95f4\u5206\u914d\uff0c\u5e76\u5206\u6790\u90e8\u7f72\u89c4\u6a21\u6269\u5927\u65f6\u7684\u6700\u4f18\u6743\u8861\u3002\u7ed3\u679c\u663e\u793a\uff0c\u6700\u4f18\u7b56\u7565\u66f4\u591a\u53d6\u51b3\u4e8e\u54c1\u683c\u5851\u9020\u5728\u5206\u5e03\u5916\u573a\u666f\u4e0b\u7684\u8106\u5f31\u6027\uff0c\u800c\u975e\u90e8\u7f72\u89c4\u6a21\u672c\u8eab\uff1b\u5728\u4e0d\u540c\u60c5\u666f\u4e2d\uff0c\u6700\u4f18\u5206\u914d\u53ef\u80fd\u504f\u5411\u89c4\u5219\u6216\u4ec5\u5c0f\u5e45\u8f6c\u5411\u54c1\u683c\u5851\u9020\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Long-horizon Earth observation reasoning requires models to organize multi-stage geographic evolution, localize spatial changes, detect temporal anomalies, and infer future from extended image sequences. However, existing remote sensing vision-language models mainly focus on isolated images, image pairs, or short sequences, limiting reliable grounding in the relevant frames and regions. We introduce LongEarth-Bench, a benchmark containing approximately 120k question-answering samples derived from 117k unique images. Its sequences average 15.14 frames and extend to 30 frames, covering 12 tasks across evolution summarization, spatial reasoning, anomaly identification, and logical prediction. A 30k-sample subset further provides structured reasoning traces linking key frames and changed regions to final answers. We develop LongEarth through supervised fine-tuning with explicit sequence identifiers and structured chain-of-thought supervision. Building on LongEarth, LongEarth-R1 applies group relative policy optimization with format, temporal, and spatial rewards. LongEarth-R1 achieves the best results on all 12 long-sequence tasks while remaining competitive on standard remote sensing benchmarks.", "arxiv_id": "2608.13344", "arxiv_url": "https://arxiv.org/abs/2608.13344", "authors": ["Yupan Ding", "Jing Xiao", "Zhenyuan Zhang", "Chaofeng Chen", "Liang Liao", "Gui-Song Xia", "Mi Wang"], "brief": "\u672c\u6587\u63d0\u51fa LongEarth-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u957f\u65f6\u5e8f\u5730\u7403\u89c2\u6d4b\u63a8\u7406\uff0c\u5305\u542b\u7ea612\u4e07\u95ee\u7b54\u6837\u672c\u3001\u6700\u957f30\u5e27\u5e8f\u5217\uff0c\u8986\u76d6\u6f14\u5316\u603b\u7ed3\u3001\u7a7a\u95f4\u63a8\u7406\u3001\u5f02\u5e38\u8bc6\u522b\u548c\u903b\u8f91\u9884\u6d4b\u7b49\u4efb\u52a1\u3002\u4f5c\u8005\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u548c\u5e26\u65f6\u95f4/\u7a7a\u95f4\u5956\u52b1\u7684\u7b56\u7565\u4f18\u5316\u8bad\u7ec3 LongEarth-R1\uff0c\u572812\u9879\u957f\u5e8f\u5217\u4efb\u52a1\u4e0a\u53d6\u5f97\u6700\u4f73\u8868\u73b0\uff0c\u5e76\u5728\u5e38\u89c4\u9065\u611f\u57fa\u51c6\u4e0a\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13344", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u9065\u611f", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13344v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LongEarth-R1: Benchmarking and Aligning Vision-Language Models for Long-Horizon Earth Observation Reasoning", "tldr": "\u672c\u6587\u63d0\u51fa LongEarth-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u957f\u65f6\u5e8f\u5730\u7403\u89c2\u6d4b\u63a8\u7406\uff0c\u5305\u542b\u7ea612\u4e07\u95ee\u7b54\u6837\u672c\u3001\u6700\u957f30\u5e27\u5e8f\u5217\uff0c\u8986\u76d6\u6f14\u5316\u603b\u7ed3\u3001\u7a7a\u95f4\u63a8\u7406\u3001\u5f02\u5e38\u8bc6\u522b\u548c\u903b\u8f91\u9884\u6d4b\u7b49\u4efb\u52a1\u3002\u4f5c\u8005\u901a\u8fc7\u76d1\u7763\u5fae\u8c03\u548c\u5e26\u65f6\u95f4/\u7a7a\u95f4\u5956\u52b1\u7684\u7b56\u7565\u4f18\u5316\u8bad\u7ec3 LongEarth-R1\uff0c\u572812\u9879\u957f\u5e8f\u5217\u4efb\u52a1\u4e0a\u53d6\u5f97\u6700\u4f73\u8868\u73b0\uff0c\u5e76\u5728\u5e38\u89c4\u9065\u611f\u57fa\u51c6\u4e0a\u4fdd\u6301\u7ade\u4e89\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Infrared (IR) spectroscopy is widely used for chemical sensing, but extracting reliable chemical information from spectra remains challenging. Conventional interpretation is labor-intensive, relies on prior knowledge and reference spectra, and is difficult to scale, whereas most machine-learning methods are tailored to individual tasks or datasets, require large labeled training sets, and transfer poorly across analytical objectives and experimental datasets. Here we introduce UltraIR, a foundation model for IR spectroscopy with more than 100 million parameters that enables simulation-to-real transfer learning for chemical sensing and analysis from molecules to complex samples. UltraIR is pretrained on approximately 60 million simulated IR spectra using spectral reconstruction, molecular fingerprint similarity alignment, and functional-group prediction, then adapted to downstream objectives with task-specific labels or targets. Across functional-group prediction, molecular structure elucidation, physicochemical property prediction, mixture-component identification and quantification, bacterial classification, medicinal-herb geographic origin traceability and constituent quantification, microplastics classification, and soil property prediction, UltraIR outperforms conventional machine-learning and task-specific deep-learning baselines. It performs strongly with limited labeled experimental spectra and in zero-shot inference for the same analytical task across Fourier-transform infrared spectrometers and laboratories, providing a route to adaptable, data-efficient chemical sensing from complex real-world samples.", "arxiv_id": "2608.13341", "arxiv_url": "https://arxiv.org/abs/2608.13341", "authors": ["Yusen Tan", "Yixuan Chen", "Zheng Fang", "Pan Liu", "Yifan Li", "Qinyu Guo", "Zhedong Lin", "Yuqiang Li", "Xiangxiang Zeng", "Tong Wang", "Jun Xia"], "brief": "\u672c\u6587\u63d0\u51fa UltraIR\uff0c\u4e00\u4e2a\u8d85\u8fc71\u4ebf\u53c2\u6570\u7684\u7ea2\u5916\u5149\u8c31\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u7ea66000\u4e07\u6761\u6a21\u62df\u7ea2\u5916\u5149\u8c31\u9884\u8bad\u7ec3\uff0c\u5b9e\u73b0\u4ece\u6a21\u62df\u5230\u771f\u5b9e\u5b9e\u9a8c\u6570\u636e\u7684\u8fc1\u79fb\u5b66\u4e60\u3002\u5b83\u5728\u5b98\u80fd\u56e2\u9884\u6d4b\u3001\u5206\u5b50\u7ed3\u6784\u89e3\u6790\u3001\u6df7\u5408\u7269\u5b9a\u6027\u5b9a\u91cf\u3001\u7ec6\u83cc\u5206\u7c7b\u3001\u5fae\u5851\u6599\u4e0e\u571f\u58e4\u5206\u6790\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u4f20\u7edf\u673a\u5668\u5b66\u4e60\u548c\u4e13\u7528\u6df1\u5ea6\u6a21\u578b\uff0c\u5e76\u5728\u5c11\u6837\u672c\u548c\u8de8\u4eea\u5668/\u5b9e\u9a8c\u5ba4\u96f6\u6837\u672c\u573a\u666f\u8868\u73b0\u8f83\u5f3a\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13341", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u57fa\u7840\u6a21\u578b", "\u8fc1\u79fb\u5b66\u4e60", "\u5316\u5b66\u611f\u77e5", "\u5149\u8c31\u5206\u6790"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13341v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Simulation-to-real transfer learning for infrared spectroscopic chemical sensing and analysis from molecules to complex samples", "tldr": "\u672c\u6587\u63d0\u51fa UltraIR\uff0c\u4e00\u4e2a\u8d85\u8fc71\u4ebf\u53c2\u6570\u7684\u7ea2\u5916\u5149\u8c31\u57fa\u7840\u6a21\u578b\uff0c\u901a\u8fc7\u7ea66000\u4e07\u6761\u6a21\u62df\u7ea2\u5916\u5149\u8c31\u9884\u8bad\u7ec3\uff0c\u5b9e\u73b0\u4ece\u6a21\u62df\u5230\u771f\u5b9e\u5b9e\u9a8c\u6570\u636e\u7684\u8fc1\u79fb\u5b66\u4e60\u3002\u5b83\u5728\u5b98\u80fd\u56e2\u9884\u6d4b\u3001\u5206\u5b50\u7ed3\u6784\u89e3\u6790\u3001\u6df7\u5408\u7269\u5b9a\u6027\u5b9a\u91cf\u3001\u7ec6\u83cc\u5206\u7c7b\u3001\u5fae\u5851\u6599\u4e0e\u571f\u58e4\u5206\u6790\u7b49\u4efb\u52a1\u4e0a\u4f18\u4e8e\u4f20\u7edf\u673a\u5668\u5b66\u4e60\u548c\u4e13\u7528\u6df1\u5ea6\u6a21\u578b\uff0c\u5e76\u5728\u5c11\u6837\u672c\u548c\u8de8\u4eea\u5668/\u5b9e\u9a8c\u5ba4\u96f6\u6837\u672c\u573a\u666f\u8868\u73b0\u8f83\u5f3a\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Large neighborhood search normally selects a random subset of decision variables for iterative optimization. For efficiently solving different problems, researchers tend to design variable selection strategies by taking into account structural features from different domains. In this paper, we build an automatic pipeline that is problem-agnostic to all problems in the MiniZinc format. By prompting an LLM with our semantic guidelines, we guide the LLM to produce a graph generator that maps any instance of a problem type to a uniform weighted graph, where nodes represent decision variables and edges represent constraint relationships. These problem-agnostic graphs guide our structure-based local improvement framework (SLIM) in variable selection. Meanwhile, the weighted graph enables all problem instances to share the same generic graph representation, from which the same graph features can be extracted and used for configuration selection. We evaluated our pipeline on instances across 20 MiniZinc competition problems, finding that algorithm selection achieves a 39.5% average problem-weighted win rate against a one-shot Gurobi baseline, more than doubling the best single configuration (19.3%). Configuration and feature ablation boost the performance further to 44.0%, demonstrating that LLM-based semantic generation enables effective automated structure extraction and feature extraction for constraint optimization.", "arxiv_id": "2608.13333", "arxiv_url": "https://arxiv.org/abs/2608.13333", "authors": ["Hai Xia", "Vaidyanathan Peruvemba Ramaswamy", "Stefan Szeider"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411 MiniZinc \u7ea6\u675f\u4f18\u5316\u95ee\u9898\u7684\u81ea\u52a8\u5316\u6d41\u7a0b\uff0c\u7528 LLM \u6839\u636e\u8bed\u4e49\u6307\u5357\u751f\u6210\u56fe\u6784\u9020\u5668\uff0c\u5c06\u51b3\u7b56\u53d8\u91cf\u548c\u7ea6\u675f\u5173\u7cfb\u6620\u5c04\u4e3a\u7edf\u4e00\u52a0\u6743\u56fe\uff0c\u5e76\u7528\u4e8e\u7ed3\u6784\u5316\u5c40\u90e8\u6539\u8fdb\u65b9\u6cd5\u7684\u53d8\u91cf\u9009\u62e9\u4e0e\u914d\u7f6e\u9009\u62e9\u3002\u5728 20 \u4e2a MiniZinc \u7ade\u8d5b\u95ee\u9898\u4e0a\uff0c\u8be5\u65b9\u6cd5\u7684\u7b97\u6cd5\u9009\u62e9\u76f8\u5bf9\u4e00\u6b21\u6027 Gurobi \u57fa\u7ebf\u8fbe\u5230 39.5% \u7684\u5e73\u5747\u52a0\u6743\u80dc\u7387\uff0c\u6d88\u878d\u540e\u8fdb\u4e00\u6b65\u63d0\u5347\u5230 44.0%\uff0c\u663e\u793a LLM \u53ef\u6709\u6548\u81ea\u52a8\u63d0\u53d6\u95ee\u9898\u7ed3\u6784\u7279\u5f81\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13333", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u7ea6\u675f\u4f18\u5316", "\u56fe\u751f\u6210", "\u5c40\u90e8\u641c\u7d22"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13333v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LLM-Guided Graph Generation for Structure-Based Local Improvement Methods", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u4e2a\u9762\u5411 MiniZinc \u7ea6\u675f\u4f18\u5316\u95ee\u9898\u7684\u81ea\u52a8\u5316\u6d41\u7a0b\uff0c\u7528 LLM \u6839\u636e\u8bed\u4e49\u6307\u5357\u751f\u6210\u56fe\u6784\u9020\u5668\uff0c\u5c06\u51b3\u7b56\u53d8\u91cf\u548c\u7ea6\u675f\u5173\u7cfb\u6620\u5c04\u4e3a\u7edf\u4e00\u52a0\u6743\u56fe\uff0c\u5e76\u7528\u4e8e\u7ed3\u6784\u5316\u5c40\u90e8\u6539\u8fdb\u65b9\u6cd5\u7684\u53d8\u91cf\u9009\u62e9\u4e0e\u914d\u7f6e\u9009\u62e9\u3002\u5728 20 \u4e2a MiniZinc \u7ade\u8d5b\u95ee\u9898\u4e0a\uff0c\u8be5\u65b9\u6cd5\u7684\u7b97\u6cd5\u9009\u62e9\u76f8\u5bf9\u4e00\u6b21\u6027 Gurobi \u57fa\u7ebf\u8fbe\u5230 39.5% \u7684\u5e73\u5747\u52a0\u6743\u80dc\u7387\uff0c\u6d88\u878d\u540e\u8fdb\u4e00\u6b65\u63d0\u5347\u5230 44.0%\uff0c\u663e\u793a LLM \u53ef\u6709\u6548\u81ea\u52a8\u63d0\u53d6\u95ee\u9898\u7ed3\u6784\u7279\u5f81\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The replicability of papers is a cornerstone of scientific knowledge, ensuring the reliability of existing results and providing a base for further experiments. The act of replication typically illuminates details that were previously underspecified, and thus requires similar hypothesis-driven exploration to open-ended research. In this work, we develop Replica, a scalable task space for paper replication. To provide reward signal, we introduce an auto-generated rubric-based judge that has low noise and agrees with human assessment of replication quality. We post-train Faraday, a 27B-parameter \"AI Scientist\" agent that leverages coding agents as tools, surpassing the performance of Claude Opus 4.8 and GPT-5.5 on held-out replication tasks. Qualitative analysis of individual rollouts reveals that Faraday adopts a more scientifically-principled approach. We believe that our results provide a stepping stone towards AI agents capable of long-horizon scientific innovation without requiring complex harnesses.", "arxiv_id": "2608.13331", "arxiv_url": "https://arxiv.org/abs/2608.13331", "authors": ["Damon Falck", "Samer Sabri", "Anja Surina", "Thom Foster", "Anya Sims", "Sam Devlin", "Dylan Rogers", "Tantum Collins", "Kaloyan Aleksiev", "Louis Kirsch", "Edward Hughes"], "brief": "\u672c\u6587\u63d0\u51fa Replica\uff0c\u4e00\u4e2a\u53ef\u6269\u5c55\u7684\u8bba\u6587\u590d\u73b0\u5b9e\u9a8c\u4efb\u52a1\u7a7a\u95f4\uff0c\u5e76\u7528\u81ea\u52a8\u751f\u6210\u7684\u8bc4\u5206\u91cf\u8868\u8bc4\u5ba1\u5668\u63d0\u4f9b\u4f4e\u566a\u58f0\u5956\u52b1\u4fe1\u53f7\u3002\u4f5c\u8005\u540e\u8bad\u7ec3\u4e86 270 \u4ebf\u53c2\u6570\u7684 AI Scientist \u667a\u80fd\u4f53 Faraday\uff0c\u4f7f\u5176\u5728\u672a\u89c1\u8fc7\u7684\u590d\u73b0\u4efb\u52a1\u4e0a\u8d85\u8fc7 Claude Opus 4.8 \u548c GPT-5.5\uff0c\u5e76\u8868\u73b0\u51fa\u66f4\u7b26\u5408\u79d1\u5b66\u539f\u5219\u7684\u63a2\u7d22\u65b9\u5f0f\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13331", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u79d1\u7814\u81ea\u52a8\u5316", "\
