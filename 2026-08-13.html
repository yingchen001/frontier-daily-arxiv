u540c\u65f6\u53c2\u6570\u5c11 26 \u500d\u3001\u901f\u5ea6\u5feb 143 \u500d\uff0c\u5e76\u80fd\u5728\u4e25\u91cd\u5206\u5e03\u504f\u79fb\u4e0b\u6cdb\u5316\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/Lat-Dyn-Reason/Lat-Dyn-Reason", "github_stars": 30, "hf_url": "https://huggingface.co/papers/2608.09926", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u52a8\u529b\u5b66\u5efa\u6a21", "\u5206\u5e03\u5916\u6cdb\u5316"], "num_comments": 2, "on_hf": true, "organization": "Adobe", "pdf_url": "https://arxiv.org/pdf/2608.09926v1", "published_at": "2026-08-10", "score": 0.091, "selected_reasons": ["HF trending (7\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09926.png", "title": "Learning How the World Evolves: Extrapolative Video World Models via Latent Dynamics Reasoning", "tldr": "\u8bba\u6587\u63d0\u51fa Latent Dynamics Reasoning\uff08LDR\uff09\uff0c\u5c06\u89c6\u9891\u6f5c\u53d8\u91cf\u8f6c\u79fb\u663e\u5f0f\u5efa\u6a21\u4e3a\u8fd0\u52a8\u5b66\u79ef\u5206\uff0c\u53ea\u56de\u5f52\u4e09\u9636\u53ca\u66f4\u9ad8\u9636\u6b8b\u5dee\uff0c\u4ece\u50cf\u7d20\u4e2d\u5b66\u4e60\u4e16\u754c\u52a8\u529b\u5b66\u3002\u76f8\u6bd4\u89c6\u9891\u6269\u6563\u57fa\u7ebf\uff0cLDR \u5728\u7269\u7406\u57fa\u51c6\u7684\u5206\u5e03\u5916\u5916\u63a8\u8bef\u5dee\u5dee\u8ddd\u7f29\u5c0f\u8d85\u8fc7 20 \u500d\uff0c\u540c\u65f6\u53c2\u6570\u5c11 26 \u500d\u3001\u901f\u5ea6\u5feb 143 \u500d\uff0c\u5e76\u80fd\u5728\u4e25\u91cd\u5206\u5e03\u504f\u79fb\u4e0b\u6cdb\u5316\u3002", "upvotes": 7, "what_it_is": null, "why_notable": null}, {"abstract": "Interactive world models must support persistent memory, responsive interaction, and long-horizon generation, yet these requirements place conflicting demands on the model. Maintaining history in the denoiser context or key-value cache incurs growing cost, forcing a trade-off between session length and retained memory, while low-latency interaction relies on few-step generation whose capabilities are bounded by its teacher. Evoke addresses both limitations by externalizing persistent world state and redesigning the teacher for long-horizon interactive generation. Scene geometry is maintained in an external, camera-indexed world state bank, from which only view-relevant information is retrieved, keeping the denoiser context bounded as the session grows. Rather than treating the teacher as a fixed generator, we design it for long-horizon supervision: its sparse attention combines chunk-wise grouping, retrieval of selected distant frames, and a linear-attention global state, yielding linear growth in memory and compute while enabling supervision over long horizons. Such supervision exposes content drift that stays locally plausible within short windows, while per-chunk conditioning enables prompt changes and event control throughout the sequence. A 30-second distribution-matching objective, applied under self-forced rollouts, transfers both capabilities to a three-step student that uses no classifier-free guidance, improving resistance to long-term drift while preserving responsive conditioning. With bounded context and recurrent external memory, Evoke supports open-ended, continuously evolving generation; on a single H200 at $384\\times 640$, each $1.5\\,\\mathrm{s}$ chunk is generated in $2.11\\,\\mathrm{s}$. As a three-step world model, Evoke achieves state-of-the-art performance on WBench while remaining competitive on VBench-Long and VBench-2.0.", "arxiv_id": "2608.13546", "arxiv_url": "https://arxiv.org/abs/2608.13546", "authors": ["Yuanyang Yin", "Gongxuan Wang", "Yifan Zhan", "Chuanhao Li", "Kaipeng Zhang", "Feng Zhao"], "brief": "Alaya-EVOKE \u9762\u5411\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u63d0\u51fa\u5916\u90e8\u76f8\u673a\u7d22\u5f15\u4e16\u754c\u72b6\u6001\u5e93\u6765\u4fdd\u5b58\u6301\u4e45\u573a\u666f\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u7a00\u758f\u6ce8\u610f\u529b\u4e0e\u7ebf\u6027\u6ce8\u610f\u529b\u6559\u5e08\u6a21\u578b\u5b9e\u73b0\u957f\u65f6\u7a0b\u76d1\u7763\u3002\u5b83\u5c06\u957f\u7a0b\u80fd\u529b\u84b8\u998f\u5230\u65e0\u9700 classifier-free guidance \u7684\u4e09\u6b65\u5b66\u751f\u6a21\u578b\u4e2d\uff0c\u63d0\u5347\u957f\u671f\u6297\u6f02\u79fb\u4e0e\u4ea4\u4e92\u54cd\u5e94\u6027\uff0c\u5728 WBench \u8fbe\u5230\u6700\u5148\u8fdb\u8868\u73b0\uff0c\u5e76\u652f\u6301\u5f00\u653e\u5f0f\u8fde\u7eed\u751f\u6210\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13546", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u957f\u89c6\u9891\u751f\u6210", "\u6ce8\u610f\u529b\u673a\u5236", "\u4ea4\u4e92\u5f0f\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13546v1", "published_at": "2026-08-13", "score": 0.087, "selected_reasons": ["HF trending (23\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13546.png", "title": "Alaya-EVOKE: From Linear-Scaling Supervision to Endless World", "tldr": "Alaya-EVOKE \u9762\u5411\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u63d0\u51fa\u5916\u90e8\u76f8\u673a\u7d22\u5f15\u4e16\u754c\u72b6\u6001\u5e93\u6765\u4fdd\u5b58\u6301\u4e45\u573a\u666f\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u7a00\u758f\u6ce8\u610f\u529b\u4e0e\u7ebf\u6027\u6ce8\u610f\u529b\u6559\u5e08\u6a21\u578b\u5b9e\u73b0\u957f\u65f6\u7a0b\u76d1\u7763\u3002\u5b83\u5c06\u957f\u7a0b\u80fd\u529b\u84b8\u998f\u5230\u65e0\u9700 classifier-free guidance \u7684\u4e09\u6b65\u5b66\u751f\u6a21\u578b\u4e2d\uff0c\u63d0\u5347\u957f\u671f\u6297\u6f02\u79fb\u4e0e\u4ea4\u4e92\u54cd\u5e94\u6027\uff0c\u5728 WBench \u8fbe\u5230\u6700\u5148\u8fdb\u8868\u73b0\uff0c\u5e76\u652f\u6301\u5f00\u653e\u5f0f\u8fde\u7eed\u751f\u6210\u3002", "upvotes": 23, "what_it_is": null, "why_notable": null}, {"abstract": "Embodied agents are increasingly built as systems around foundation models, where performance depends not only on model weights but also on the skills, context, action interfaces, and execution harness surrounding the model. While supervised fine-tuning and reinforcement learning can adapt agents to new environments, they require additional data, rewards, and training runs; meanwhile, many train-free code-centric approaches rely on programmable robot APIs that may be unavailable in fixed-interface settings. We propose SHAPER, a self-evolving framework for train-free embodied adaptation that keeps model parameters frozen and improves the non-parametric agent system by evolving reusable skills and a context-code harness through target-environment rollouts. In SHAPER, the same frozen model can serve as both planner and optimizer, refining its external skills and context-code harness without parameter updates. We evaluate SHAPER on VLABench and ESI-Bench, covering embodied agents with different low-level action interfaces, and compare against pure execution, supervised fine-tuning, and test-time-scaling baselines such as verifier-free selection and voting. Our results suggest that skill-and-harness optimization is a practical route to self-evolving embodied agents when model training is expensive, unavailable, or undesirable.", "arxiv_id": "2608.11350", "arxiv_url": "https://arxiv.org/abs/2608.11350", "authors": ["Peidong Wang", "Zhiming Ma", "Ying Chang", "Xufang Luo", "Xiaocui Yang", "Shi Feng", "Yuqing Yang", "Dongsheng Li"], "brief": "\u672c\u6587\u63d0\u51fa SHAPER\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5177\u8eab\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u6846\u67b6\uff0c\u5728\u51bb\u7ed3\u57fa\u7840\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u73af\u5883\u8bd5\u8fd0\u884c\u6301\u7eed\u4f18\u5316\u53ef\u590d\u7528\u6280\u80fd\u4e0e\u4e0a\u4e0b\u6587\u4ee3\u7801\u6267\u884c\u6846\u67b6\u3002\u5b9e\u9a8c\u5728 VLABench \u548c ESI-Bench \u4e0a\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u76f8\u6bd4\u7eaf\u6267\u884c\u3001\u76d1\u7763\u5fae\u8c03\u548c\u6d4b\u8bd5\u65f6\u6269\u5c55\u7b49\u57fa\u7ebf\u66f4\u5b9e\u7528\uff0c\u5c24\u5176\u9002\u5408\u6a21\u578b\u8bad\u7ec3\u6602\u8d35\u6216\u4e0d\u53ef\u884c\u7684\u573a\u666f\u3002", "categories": ["cs.CL", "cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.11350", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5177\u8eab\u667a\u80fd", "\u57fa\u7840\u6a21\u578b", "\u514d\u8bad\u7ec3\u9002\u5e94"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.11350v1", "published_at": "2026-08-11", "score": 0.072, "selected_reasons": ["HF trending (11\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.11350.png", "title": "Self-Evolving Embodied Agents via Skill-Harness Evolution", "tldr": "\u672c\u6587\u63d0\u51fa SHAPER\uff0c\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5177\u8eab\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u6846\u67b6\uff0c\u5728\u51bb\u7ed3\u57fa\u7840\u6a21\u578b\u53c2\u6570\u7684\u60c5\u51b5\u4e0b\uff0c\u901a\u8fc7\u73af\u5883\u8bd5\u8fd0\u884c\u6301\u7eed\u4f18\u5316\u53ef\u590d\u7528\u6280\u80fd\u4e0e\u4e0a\u4e0b\u6587\u4ee3\u7801\u6267\u884c\u6846\u67b6\u3002\u5b9e\u9a8c\u5728 VLABench \u548c ESI-Bench \u4e0a\u8868\u660e\uff0c\u8be5\u65b9\u6cd5\u76f8\u6bd4\u7eaf\u6267\u884c\u3001\u76d1\u7763\u5fae\u8c03\u548c\u6d4b\u8bd5\u65f6\u6269\u5c55\u7b49\u57fa\u7ebf\u66f4\u5b9e\u7528\uff0c\u5c24\u5176\u9002\u5408\u6a21\u578b\u8bad\u7ec3\u6602\u8d35\u6216\u4e0d\u53ef\u884c\u7684\u573a\u666f\u3002", "upvotes": 11, "what_it_is": null, "why_notable": null}, {"abstract": "Exploration has been a focus of reinforcement learning research for a long time. Recently, there has been growing evidence that it is also an important ingredient in LLM reinforcement learning recipes that can significantly impact downstream performance. Many existing methods control exploration in the action-space, for example, using temperature scaling. However, these methods cannot reorder tokens but only influence the variance in the output distribution. This limits exploration and can lead to divergence or stalled training. Here, we investigate parameter-space exploration, where rollouts are generated by sampling different policies from a posterior that may each explore different rollouts. Sampling less or more diverse policies is then a complementary control lever over exploration. We introduce a family of methods called Perturbed Parameter Policy Optimization (3PO) which use different sampling strategies and different rollout grouping for reward estimation. Experiments on OLMo-3-1025-7B and Qwen2.5-Math-7B across mathematical reasoning and code generation tasks show that these approaches consistently improve average downstream performance over standard GRPO at a near-identical FLOPs cost. Moreover, using multiple parameter samples consistently produces fewer zero-advantage groups and malformed or incorrect rollouts during training than GRPO and action-space baselines. Overall, our work presents evidence that parameter-space exploration can improve reinforcement learning for LLMs.", "arxiv_id": "2608.09805", "arxiv_url": "https://arxiv.org/abs/2608.09805", "authors": ["Vatsal Venkatkrishna", "Nico Daheim", "Iryna Gurevych"], "brief": "\u8bba\u6587\u63d0\u51fa\u5728\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u8fdb\u884c\u53c2\u6570\u7a7a\u95f4\u63a2\u7d22\uff0c\u800c\u4e0d\u662f\u53ea\u901a\u8fc7\u6e29\u5ea6\u7b49\u65b9\u5f0f\u8c03\u8282\u52a8\u4f5c\u7a7a\u95f4\u63a2\u7d22\u3002\u5176 3PO \u65b9\u6cd5\u901a\u8fc7\u4ece\u540e\u9a8c\u4e2d\u91c7\u6837\u4e0d\u540c\u7b56\u7565\u5e76\u6539\u8fdb rollout \u5206\u7ec4\uff0c\u5728\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\u4efb\u52a1\u4e0a\u76f8\u8f83 GRPO \u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u4e14\u8ba1\u7b97\u6210\u672c\u63a5\u8fd1\uff0c\u540c\u65f6\u51cf\u5c11\u96f6\u4f18\u52bf\u7ec4\u548c\u5f02\u5e38 rollout\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": "https://github.com/insait-institute/C3PO", "github_stars": 1, "hf_url": "https://huggingface.co/papers/2608.09805", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u53c2\u6570\u7a7a\u95f4\u63a2\u7d22", "\u4ee3\u7801\u751f\u6210"], "num_comments": 2, "on_hf": true, "organization": "BayesRL", "pdf_url": "https://arxiv.org/pdf/2608.09805v1", "published_at": "2026-08-10", "score": 0.06, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.09805.png", "title": "Parameter Exploration for RLVR via Variational Learning", "tldr": "\u8bba\u6587\u63d0\u51fa\u5728\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d\u8fdb\u884c\u53c2\u6570\u7a7a\u95f4\u63a2\u7d22\uff0c\u800c\u4e0d\u662f\u53ea\u901a\u8fc7\u6e29\u5ea6\u7b49\u65b9\u5f0f\u8c03\u8282\u52a8\u4f5c\u7a7a\u95f4\u63a2\u7d22\u3002\u5176 3PO \u65b9\u6cd5\u901a\u8fc7\u4ece\u540e\u9a8c\u4e2d\u91c7\u6837\u4e0d\u540c\u7b56\u7565\u5e76\u6539\u8fdb rollout \u5206\u7ec4\uff0c\u5728\u6570\u5b66\u63a8\u7406\u548c\u4ee3\u7801\u751f\u6210\u4efb\u52a1\u4e0a\u76f8\u8f83 GRPO \u7a33\u5b9a\u63d0\u5347\u6027\u80fd\uff0c\u4e14\u8ba1\u7b97\u6210\u672c\u63a5\u8fd1\uff0c\u540c\u65f6\u51cf\u5c11\u96f6\u4f18\u52bf\u7ec4\u548c\u5f02\u5e38 rollout\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Large-scale manipulation data is essential for robot learning, yet collecting robot demonstrations remains expensive and difficult to scale. Meanwhile, abundant egocentric human manipulation videos provide rich behavioral experiences, but transferring them across embodiments remains challenging due to differences between human hands and robotic end-effectors. Recent advances in video world models offer a promising pathway to synthesize robot-centric manipulation videos from human observations, while their cross-embodiment transfer capability remains largely unexplored. Therefore, we introduce H2R-Bench, a benchmark for evaluating cross-embodiment human-to-robot manipulation video generation, where models transform egocentric human demonstrations into robot manipulation videos under specified embodiments. Each benchmark instance contains a human demonstration video, target embodiment constraints, and source-grounded annotations covering task goals, action events, functional contacts, and object responses. H2R-Bench evaluates generated videos through five dimensions, including goal-state completion, action-event completion, functional contact transfer, embodiment correctness, and general video quality. We benchmark eleven state-of-the-art video generation models across six manipulation families and two robot embodiments. Our evaluation reveals that current video world models remain limited in human-to-robot manipulation transfer: even leading models often fail in embodiment consistency, functional interaction, and task execution. H2R-Bench provides a systematic diagnostic framework for evaluating whether video world models can bridge the human-to-robot embodiment gap and convert human manipulation observations into robot-centric training resources.", "arxiv_id": "2608.13049", "arxiv_url": "https://arxiv.org/abs/2608.13049", "authors": ["Dingyi Rong", "Yue Shi", "Chaofan Ma", "Jiezhang Cao", "Zongrui Wang", "Zeyu Zhang", "Yao Mu", "Guangtao Zhai", "Ning Liu"], "brief": "\u8bba\u6587\u63d0\u51fa H2R-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5c06\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u64cd\u4f5c\u6f14\u793a\u8f6c\u6362\u4e3a\u6307\u5b9a\u673a\u5668\u4eba\u5f62\u6001\u64cd\u4f5c\u89c6\u9891\u7684\u80fd\u529b\u3002\u57fa\u4e8e\u4efb\u52a1\u76ee\u6807\u3001\u52a8\u4f5c\u4e8b\u4ef6\u3001\u529f\u80fd\u63a5\u89e6\u3001\u5f62\u6001\u6b63\u786e\u6027\u548c\u89c6\u9891\u8d28\u91cf\u7b49\u7ef4\u5ea6\u8bc4\u6d4b 11 \u4e2a\u6a21\u578b\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u5728\u8de8\u5f62\u6001\u4e00\u81f4\u6027\u3001\u529f\u80fd\u4ea4\u4e92\u548c\u4efb\u52a1\u5b8c\u6210\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\u3002", "categories": ["cs.RO", "cs.CV"], "github_repo": "https://github.com/Rongdingyi/H2R-Bench", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13049", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba\u5b66\u4e60", "\u89c6\u9891\u751f\u6210", "\u4e16\u754c\u6a21\u578b", "\u8de8\u5f62\u6001\u8fc1\u79fb"], "num_comments": 1, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2608.13049v1", "published_at": "2026-08-13", "score": 0.051, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.13049.png", "title": "H2R-Bench: Benchmarking Human-to-Robot Manipulation Video Generation in World Models", "tldr": "\u8bba\u6587\u63d0\u51fa H2R-Bench\uff0c\u7528\u4e8e\u8bc4\u6d4b\u89c6\u9891\u4e16\u754c\u6a21\u578b\u5c06\u7b2c\u4e00\u89c6\u89d2\u4eba\u7c7b\u64cd\u4f5c\u6f14\u793a\u8f6c\u6362\u4e3a\u6307\u5b9a\u673a\u5668\u4eba\u5f62\u6001\u64cd\u4f5c\u89c6\u9891\u7684\u80fd\u529b\u3002\u57fa\u4e8e\u4efb\u52a1\u76ee\u6807\u3001\u52a8\u4f5c\u4e8b\u4ef6\u3001\u529f\u80fd\u63a5\u89e6\u3001\u5f62\u6001\u6b63\u786e\u6027\u548c\u89c6\u9891\u8d28\u91cf\u7b49\u7ef4\u5ea6\u8bc4\u6d4b 11 \u4e2a\u6a21\u578b\uff0c\u53d1\u73b0\u73b0\u6709\u6a21\u578b\u5728\u8de8\u5f62\u6001\u4e00\u81f4\u6027\u3001\u529f\u80fd\u4ea4\u4e92\u548c\u4efb\u52a1\u5b8c\u6210\u4e0a\u4ecd\u660e\u663e\u4e0d\u8db3\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "As large language models increasingly participate in scientific evaluation, we investigate a potential form of reward hacking: how rhetorical choices shape AI-review judgments when reported scientific content is preserved and how these effects vary across evaluation conditions. We construct a controlled corpus of 4,200 full-paper manuscripts derived from 120 anonymized ICLR 2026 submissions. Two LLM rewriters transform six rhetorical dimensions in opposing directions, and five LLM reviewers evaluate the resulting manuscripts under standard and strict protocols. We also test joint, recursive, and reviewer-guided rewriting. Our results show that rhetorical sensitivity is structured rather than uniform. Evidence framing and novelty stance produce the largest positive-negative contrasts in overall assessment, with scope framing forming a weaker second tier; the remaining dimensions have smaller or less stable effects. This hierarchy persists across human-assessed quality levels, but score movement depends strongly on the AI reviewer\u0027s original score: lower scores tend to rise, higher scores tend to fall, and directional contrasts are clearest in the middle ranges. More elaborate workflows do not reliably yield larger gains. Joint rewriting is strongly rewriter-dependent, reviewer guidance does not consistently outperform an unguided second pass, and repeated rewriting yields diminishing, configuration-dependent returns. Across conditions, the rewriter primarily determines the separation between opposing variants, whereas the reviewer determines the magnitude and sign of their score effects. Strict review lowers mean OA by 1.36 points without consistently changing rhetorical sensitivity. These findings identify when rhetorical presentation influences AI scientific review and motivate evaluation systems robust to content-preserving variation in scientific writing.", "arxiv_id": "2608.08975", "arxiv_url": "https://arxiv.org/abs/2608.08975", "authors": ["Ming Li", "Chenguang Wang", "Xirui Li", "Xinyue Zeng", "Dianqi Li", "Peng Shi", "Dawei Zhou", "Tianyi Zhou"], "brief": "\u672c\u6587\u7814\u7a76\u5728\u79d1\u5b66\u5185\u5bb9\u4e0d\u53d8\u65f6\uff0c\u8bba\u6587\u5199\u4f5c\u4e2d\u7684\u4fee\u8f9e\u9009\u62e9\u5982\u4f55\u5f71\u54cd\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u540c\u884c\u8bc4\u5ba1\u8bc4\u5206\uff0c\u6784\u5efa\u4e864200\u7bc7\u53d7\u63a7\u6539\u5199\u8bba\u6587\u5e76\u7531\u591a\u4e2aLLM\u8bc4\u5ba1\u6d4b\u8bd5\u3002\u7ed3\u679c\u663e\u793a\u8bc1\u636e\u8868\u8ff0\u548c\u65b0\u9896\u6027\u7acb\u573a\u6700\u5bb9\u6613\u9020\u6210\u8bc4\u5206\u5dee\u5f02\uff0c\u4e25\u683c\u8bc4\u5ba1\u4f1a\u964d\u4f4e\u5e73\u5747\u5206\u4f46\u4e0d\u4e00\u5b9a\u51cf\u5c11\u4fee\u8f9e\u654f\u611f\u6027\uff0c\u63d0\u793aAI\u79d1\u7814\u8bc4\u5ba1\u9700\u8981\u66f4\u80fd\u62b5\u6297\u5185\u5bb9\u7b49\u4ef7\u6539\u5199\u7684\u673a\u5236\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/MingLiiii/Dissecting_AI_Reviews", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08975", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u540c\u884c\u8bc4\u5ba1", "\u5956\u52b1\u9ed1\u5ba2", "\u79d1\u5b66\u8bc4\u4ef7"], "num_comments": 1, "on_hf": true, "organization": "University of Maryland", "pdf_url": "https://arxiv.org/pdf/2608.08975v1", "published_at": "2026-08-10", "score": 0.051, "selected_reasons": ["HF trending (5\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08975.png", "title": "How Can Rhetoric Reward-Hack AI Reviewers? Dissecting Rhetorical Sensitivity in AI-Based Peer Review", "tldr": "\u672c\u6587\u7814\u7a76\u5728\u79d1\u5b66\u5185\u5bb9\u4e0d\u53d8\u65f6\uff0c\u8bba\u6587\u5199\u4f5c\u4e2d\u7684\u4fee\u8f9e\u9009\u62e9\u5982\u4f55\u5f71\u54cd\u57fa\u4e8e\u5927\u8bed\u8a00\u6a21\u578b\u7684\u540c\u884c\u8bc4\u5ba1\u8bc4\u5206\uff0c\u6784\u5efa\u4e864200\u7bc7\u53d7\u63a7\u6539\u5199\u8bba\u6587\u5e76\u7531\u591a\u4e2aLLM\u8bc4\u5ba1\u6d4b\u8bd5\u3002\u7ed3\u679c\u663e\u793a\u8bc1\u636e\u8868\u8ff0\u548c\u65b0\u9896\u6027\u7acb\u573a\u6700\u5bb9\u6613\u9020\u6210\u8bc4\u5206\u5dee\u5f02\uff0c\u4e25\u683c\u8bc4\u5ba1\u4f1a\u964d\u4f4e\u5e73\u5747\u5206\u4f46\u4e0d\u4e00\u5b9a\u51cf\u5c11\u4fee\u8f9e\u654f\u611f\u6027\uff0c\u63d0\u793aAI\u79d1\u7814\u8bc4\u5ba1\u9700\u8981\u66f4\u80fd\u62b5\u6297\u5185\u5bb9\u7b49\u4ef7\u6539\u5199\u7684\u673a\u5236\u3002", "upvotes": 5, "what_it_is": null, "why_notable": null}, {"abstract": "Multimodal expansion of large language models (LLMs) enables new perceptual capabilities but often compromises the language intelligence acquired during pretraining. In this work, we investigate this phenomenon from the perspective of internal adaptation dynamics and discover that neurons in pretrained LLMs exhibit heterogeneous plasticity during multimodal learning: some neurons are critical for preserving language capabilities, while others are more adaptive to multimodal knowledge. Based on this insight, we propose NeuPAT (Neuron-aware Plasticity Allocation Tuning), a lightweight and architecture-agnostic framework that allocates neuron-wise update constraints during multimodal instruction tuning. NeuPAT uses a small-scale probing stage to estimate neuron adaptation patterns and selectively protects language-sensitive neurons while promoting multimodal adaptation through more plastic neurons. Experiments across diverse LLM families demonstrate that NeuPAT recovers 94.5\\% of the language capability degradation caused by vanilla tuning on 11 language benchmarks while maintaining comparable multimodal performance, providing an effective approach for capability-preserving multimodal expansion.", "arxiv_id": "2608.08107", "arxiv_url": "https://arxiv.org/abs/2608.08107", "authors": ["Jiayue Jin", "Jingwei Zhang", "Chen Wang", "Jing Liu", "Longteng Guo"], "brief": "\u8bba\u6587\u53d1\u73b0\u5927\u8bed\u8a00\u6a21\u578b\u5728\u591a\u6a21\u6001\u6307\u4ee4\u5fae\u8c03\u65f6\uff0c\u4e0d\u540c\u795e\u7ecf\u5143\u7684\u53ef\u5851\u6027\u5b58\u5728\u5dee\u5f02\uff1a\u90e8\u5206\u795e\u7ecf\u5143\u5bf9\u4fdd\u6301\u8bed\u8a00\u80fd\u529b\u5f88\u5173\u952e\uff0c\u90e8\u5206\u66f4\u9002\u5408\u5438\u6536\u591a\u6a21\u6001\u77e5\u8bc6\u3002\u4f5c\u8005\u63d0\u51fa NeuPAT\uff0c\u901a\u8fc7\u63a2\u6d4b\u9636\u6bb5\u4e3a\u795e\u7ecf\u5143\u5206\u914d\u4e0d\u540c\u66f4\u65b0\u7ea6\u675f\uff0c\u5728\u57fa\u672c\u4e0d\u635f\u5bb3\u591a\u6a21\u6001\u6027\u80fd\u7684\u540c\u65f6\uff0c\u6062\u590d\u4e86\u666e\u901a\u5fae\u8c03\u5bfc\u81f4\u7684 94.5% \u8bed\u8a00\u80fd\u529b\u4e0b\u964d\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.08107", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u591a\u6a21\u6001", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6307\u4ee4\u5fae\u8c03", "\u795e\u7ecf\u5143\u53ef\u5851\u6027"], "num_comments": 2, "on_hf": true, "organization": "CASIA-IVA-Lab", "pdf_url": "https://arxiv.org/pdf/2608.08107v1", "published_at": "2026-08-08", "score": 0.036, "selected_reasons": ["HF trending (2\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08107.png", "title": "NeuPAT: Neuron-aware Plasticity Allocation Tuning for Language-Preserving MLLMs", "tldr": "\u8bba\u6587\u53d1\u73b0\u5927\u8bed\u8a00\u6a21\u578b\u5728\u591a\u6a21\u6001\u6307\u4ee4\u5fae\u8c03\u65f6\uff0c\u4e0d\u540c\u795e\u7ecf\u5143\u7684\u53ef\u5851\u6027\u5b58\u5728\u5dee\u5f02\uff1a\u90e8\u5206\u795e\u7ecf\u5143\u5bf9\u4fdd\u6301\u8bed\u8a00\u80fd\u529b\u5f88\u5173\u952e\uff0c\u90e8\u5206\u66f4\u9002\u5408\u5438\u6536\u591a\u6a21\u6001\u77e5\u8bc6\u3002\u4f5c\u8005\u63d0\u51fa NeuPAT\uff0c\u901a\u8fc7\u63a2\u6d4b\u9636\u6bb5\u4e3a\u795e\u7ecf\u5143\u5206\u914d\u4e0d\u540c\u66f4\u65b0\u7ea6\u675f\uff0c\u5728\u57fa\u672c\u4e0d\u635f\u5bb3\u591a\u6a21\u6001\u6027\u80fd\u7684\u540c\u65f6\uff0c\u6062\u590d\u4e86\u666e\u901a\u5fae\u8c03\u5bfc\u81f4\u7684 94.5% \u8bed\u8a00\u80fd\u529b\u4e0b\u964d\u3002", "upvotes": 2, "what_it_is": null, "why_notable": null}, {"abstract": "Large language models often fail when answer options require combining atomic judgments under explicit logical operators, even when they judge the individual atoms correctly. We study compound options connected by AND, OR, and NEITHER/NOR, introducing a framework that decomposes each option into atomic answers and scores contrastive hypotheses about each one, so the model never sees a compound option. An operator-constrained integer linear program then composes the calibrated scores into a single prediction. We evaluate on LOGICAL-COMMONSENSEQA and introduce LOGICAL-SATA, a reading-comprehension benchmark derived from SATA-Bench. Our framework improves Macro-F1 from 48.3 to 77.0 on the human-validated LOGICAL-COMMONSENSEQA split and from 47.0 to 75.6 on LOGICAL-SATA, with the largest gains on NEITHER/NOR.", "arxiv_id": "2608.12836", "arxiv_url": "https://arxiv.org/abs/2608.12836", "authors": ["Obed Junias", "Maria Leonor Pacheco"], "brief": "\u8bba\u6587\u9488\u5bf9\u5927\u8bed\u8a00\u6a21\u578b\u5728\u542b AND\u3001OR\u3001NEITHER/NOR \u7b49\u903b\u8f91\u7ec4\u5408\u9009\u9879\u4e0a\u6613\u51fa\u9519\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5148\u5c06\u590d\u5408\u9009\u9879\u62c6\u6210\u539f\u5b50\u5224\u65ad\u5e76\u5bf9\u6bd4\u6253\u5206\uff0c\u518d\u7528\u7b97\u5b50\u7ea6\u675f\u7684\u6574\u6570\u7ebf\u6027\u89c4\u5212\u7ec4\u5408\u9884\u6d4b\u3002\u8be5\u65b9\u6cd5\u5728 LOGICAL-COMMONSENSEQA \u548c\u65b0\u6784\u5efa\u7684 LOGICAL-SATA \u4e0a\u5c06 Macro-F1 \u4ece\u7ea6 47-48 \u63d0\u5347\u5230\u7ea6 76-77\uff0c\u5c24\u5176\u663e\u8457\u6539\u5584 NEITHER/NOR \u60c5\u51b5\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": "https://github.com/obedjunias19/structured-compositional-reasoning", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12836", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u903b\u8f91\u63a8\u7406", "\u7ec4\u5408\u6cdb\u5316", "\u95ee\u7b54"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.12836v1", "published_at": "2026-08-13", "score": 0.023, "selected_reasons": ["HF trending (1\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12836.png", "title": "From Atomic Evidence to Logical Composition: Structured Compositional Reasoning over Compound Answer Options", "tldr": "\u8bba\u6587\u9488\u5bf9\u5927\u8bed\u8a00\u6a21\u578b\u5728\u542b AND\u3001OR\u3001NEITHER/NOR \u7b49\u903b\u8f91\u7ec4\u5408\u9009\u9879\u4e0a\u6613\u51fa\u9519\u7684\u95ee\u9898\uff0c\u63d0\u51fa\u5148\u5c06\u590d\u5408\u9009\u9879\u62c6\u6210\u539f\u5b50\u5224\u65ad\u5e76\u5bf9\u6bd4\u6253\u5206\uff0c\u518d\u7528\u7b97\u5b50\u7ea6\u675f\u7684\u6574\u6570\u7ebf\u6027\u89c4\u5212\u7ec4\u5408\u9884\u6d4b\u3002\u8be5\u65b9\u6cd5\u5728 LOGICAL-COMMONSENSEQA \u548c\u65b0\u6784\u5efa\u7684 LOGICAL-SATA \u4e0a\u5c06 Macro-F1 \u4ece\u7ea6 47-48 \u63d0\u5347\u5230\u7ea6 76-77\uff0c\u5c24\u5176\u663e\u8457\u6539\u5584 NEITHER/NOR \u60c5\u51b5\u3002", "upvotes": 1, "what_it_is": null, "why_notable": null}, {"abstract": "Semi-supervised semantic segmentation has long turned on one question, which pseudo-labels to trust, and a generation of selection rules, dynamic thresholds, per-class curricula, soft confidence weights, answered it for the noisy, under-confident ResNet teachers of their day. Self-supervised foundation encoders change the regime: with a DINOv2 teacher, confidence saturates, so the filtering that helped a weak teacher can hurt a strong one. We propose CW-BASS v2, a saturation-aware pseudo-label selection method that reads the teacher\u0027s confidence regime rather than committing to one rule. It pairs held-out calibration, an unbiased per-class noise estimate, with a self-adaptive confidence floor that provably bounds retention away from 1, and combines them in a one-pass gate: measure the reliability of the teacher\u0027s confident set, pi_kept = Pr[correct | c \u003e= tau], on a held-out slice, and filter strictly when it meets the confidence demanded (pi_kept \u003e= tau), falling back to the adaptive floor otherwise. The boundary is the pre-existing operating threshold, not a value tuned to mIoU, and across six DINOv2 teachers it makes the correct strict-vs-floor call blind. CW-BASS v2 thus recovers the UniMatch V2 operating point on the saturated benchmarks by selecting strict (Pascal VOC 1/8 87.4 against its reported 87.9; Cityscapes within 0.5), and improves on it where the confident set is unreliable (pi_kept ~ 89%, ADE20K), where the floor edges ahead (+1.5 mIoU, single seed). The gate is principled because the failure it avoids is measured, not assumed: on a reliable, saturated teacher the confidence distribution\u0027s dynamic range collapses (98% of Pascal pixels \u003e= 0.95), so an adaptive cutoff floods the retention mask and self-training decays into confirmation bias.", "arxiv_id": "2608.12773", "arxiv_url": "https://arxiv.org/abs/2608.12773", "authors": ["Ebenezer Tarubinga"], "brief": "\u672c\u6587\u63d0\u51fa CW-BASS v2\uff0c\u7528\u4e8e\u5728 DINOv2 \u7b49\u57fa\u7840\u6a21\u578b\u6559\u5e08\u4e0b\u8fdb\u884c\u534a\u76d1\u7763\u8bed\u4e49\u5206\u5272\u7684\u4f2a\u6807\u7b7e\u9009\u62e9\uff0c\u6838\u5fc3\u662f\u611f\u77e5\u7f6e\u4fe1\u5ea6\u9971\u548c\u5e76\u901a\u8fc7\u7559\u51fa\u6821\u51c6\u5224\u65ad\u8be5\u4e25\u683c\u8fc7\u6ee4\u8fd8\u662f\u4f7f\u7528\u81ea\u9002\u5e94\u7f6e\u4fe1\u5ea6\u4e0b\u9650\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u5728\u9971\u548c\u53ef\u9760\u6559\u5e08\u4e0a\u63a5\u8fd1 UniMatch V2 \u8868\u73b0\uff0c\u5728\u4e0d\u53ef\u9760\u7f6e\u4fe1\u96c6\u5408\u5982 ADE20K \u4e0a\u63d0\u5347\u7ea6 1.5 mIoU\uff0c\u51cf\u5c11\u786e\u8ba4\u504f\u5dee\u3002", "categories": ["cs.CV", "cs.LG", "eess.IV"], "github_repo": "https://github.com/psychofict/CW-BASS-v2", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.12773", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u534a\u76d1\u7763\u5b66\u4e60", "\u8bed\u4e49\u5206\u5272", "\u4f2a\u6807\u7b7e", "\u57fa\u7840\u6a21\u578b"], "num_comments": 1, "on_hf": true, "organization": "Ebenworks Systems", "pdf_url": "https://arxiv.org/pdf/2608.12773v1", "published_at": "2026-08-13", "score": 0.005, "selected_reasons": ["HF trending (0\u8d5e)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.12773.png", "title": "CW-BASS v2: Saturation-Aware Pseudo-Label Selection for Semi-Supervised Segmentation under Foundation-Model Teachers", "tldr": "\u672c\u6587\u63d0\u51fa CW-BASS v2\uff0c\u7528\u4e8e\u5728 DINOv2 \u7b49\u57fa\u7840\u6a21\u578b\u6559\u5e08\u4e0b\u8fdb\u884c\u534a\u76d1\u7763\u8bed\u4e49\u5206\u5272\u7684\u4f2a\u6807\u7b7e\u9009\u62e9\uff0c\u6838\u5fc3\u662f\u611f\u77e5\u7f6e\u4fe1\u5ea6\u9971\u548c\u5e76\u901a\u8fc7\u7559\u51fa\u6821\u51c6\u5224\u65ad\u8be5\u4e25\u683c\u8fc7\u6ee4\u8fd8\u662f\u4f7f\u7528\u81ea\u9002\u5e94\u7f6e\u4fe1\u5ea6\u4e0b\u9650\u3002\u5b9e\u9a8c\u663e\u793a\u5176\u80fd\u5728\u9971\u548c\u53ef\u9760\u6559\u5e08\u4e0a\u63a5\u8fd1 UniMatch V2 \u8868\u73b0\uff0c\u5728\u4e0d\u53ef\u9760\u7f6e\u4fe1\u96c6\u5408\u5982 ADE20K \u4e0a\u63d0\u5347\u7ea6 1.5 mIoU\uff0c\u51cf\u5c11\u786e\u8ba4\u504f\u5dee\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Humanoid motion tracking is central to teleoperation and whole-body imitation, yet evaluation often disagrees with what people perceive in videos. Kinematic errors average per-frame pose differences but miss the physical artifacts that matter most, particularly unstable support and incorrect contacts such as foot skating and mistimed touch-downs. Meanwhile, widely used test suites are small and lack the diversity needed to stress contact-rich, long-horizon behaviors. We introduce HumanTracker to make humanoid tracking evaluation both perceptually aligned and scalable. The HumanTracker benchmark contains approximately 153 hours of optical motion trajectories from multiple professional performers, organized into four motion families with text labels for fine-grained diagnosis. We further propose HumanScore, a preference-aligned metric trained on 12K motion pairs containing 24K motions. Across representative state-of-the-art trackers, HumanScore better predicts human preferences and reveals contact and stability failures that kinematic metrics often miss.", "arxiv_id": "2608.13555", "arxiv_url": "https://arxiv.org/abs/2608.13555", "authors": ["Dairu Liu", "Zekun Qi", "Jiayu Zeng", "Ruixi Yu", "Yu Guan", "Yintianrun Zhang", "Xuchuan Chen", "Sikai Liang", "Zekai Li", "Chenghuai Lin", "Xinqiang Yu", "Wenyao Zhang", "He Wang", "Li Yi"], "brief": "\u8bba\u6587\u63d0\u51fa HumanTracker\uff0c\u4e00\u4e2a\u9762\u5411\u7c7b\u4eba\u673a\u5668\u4eba\u8fd0\u52a8\u8ddf\u8e2a\u7684\u89c4\u6a21\u5316\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u7ea6153\u5c0f\u65f6\u4e13\u4e1a\u6f14\u5458\u5149\u5b66\u52a8\u4f5c\u8f68\u8ff9\uff0c\u5e76\u6309\u8fd0\u52a8\u7c7b\u522b\u548c\u6587\u672c\u6807\u7b7e\u7ec4\u7ec7\u3002\u8fd8\u63d0\u51fa\u4e0e\u4eba\u7c7b\u504f\u597d\u5bf9\u9f50\u7684 HumanScore \u6307\u6807\uff0c\u80fd\u6bd4\u4f20\u7edf\u8fd0\u52a8\u5b66\u8bef\u5dee\u66f4\u597d\u53d1\u73b0\u63a5\u89e6\u3001\u7a33\u5b9a\u6027\u548c\u811a\u6ed1\u7b49\u95ee\u9898\u3002", "categories": ["cs.RO", "cs.AI", "cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13555", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u673a\u5668\u4eba", "\u8fd0\u52a8\u8ddf\u8e2a", "\u8bc4\u6d4b\u57fa\u51c6", "\u4eba\u7c7b\u504f\u597d"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13555v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "HumanTracker: Towards Comprehensive and Human-Aligned Motion Tracking Benchmark", "tldr": "\u8bba\u6587\u63d0\u51fa HumanTracker\uff0c\u4e00\u4e2a\u9762\u5411\u7c7b\u4eba\u673a\u5668\u4eba\u8fd0\u52a8\u8ddf\u8e2a\u7684\u89c4\u6a21\u5316\u8bc4\u6d4b\u57fa\u51c6\uff0c\u5305\u542b\u7ea6153\u5c0f\u65f6\u4e13\u4e1a\u6f14\u5458\u5149\u5b66\u52a8\u4f5c\u8f68\u8ff9\uff0c\u5e76\u6309\u8fd0\u52a8\u7c7b\u522b\u548c\u6587\u672c\u6807\u7b7e\u7ec4\u7ec7\u3002\u8fd8\u63d0\u51fa\u4e0e\u4eba\u7c7b\u504f\u597d\u5bf9\u9f50\u7684 HumanScore \u6307\u6807\uff0c\u80fd\u6bd4\u4f20\u7edf\u8fd0\u52a8\u5b66\u8bef\u5dee\u66f4\u597d\u53d1\u73b0\u63a5\u89e6\u3001\u7a33\u5b9a\u6027\u548c\u811a\u6ed1\u7b49\u95ee\u9898\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "LLM coding agents issue Bash commands through interfaces that may serialize, wrap, and reparse model output. Matched execution scores alone cannot distinguish command-generation errors from failures introduced after generation. QuoteBench measures this boundary with exact final-state validation on 56 one-shot tasks from 14 incident-derived families, crossing the generation contract with the execution transport around one deliberately unescaped added parser. Escaping at the interpolation point reproduces each replayed reply\u0027s raw-path outcome, so any recovery under a disclosed boundary must come from the model changing its generation. Across eight same-window configurations, replaying the same reply through the added parser lowers success by 55.4 to 73.2 percentage points; disclosure recovers 30.4 to 60.7 points for six configurations, and zero or slightly negative for the other two. Raw generation is nearly saturated at the frontier; boundary adaptation is what still separates models. GPT-5.6-sol\u0027s matched gap of -3.6 points hides -64.3 points of damage and +60.7 points of compensation. The deployment configuration reorders models: one reversal among 26 comparable pairs is unambiguous and four more sit on single-task margins. Evaluations of command-issuing agents should report the model configuration, generation contract, execution path, operating point, and final-state validator rather than treat a matched score as an intrinsic model property.", "arxiv_id": "2608.13547", "arxiv_url": "https://arxiv.org/abs/2608.13547", "authors": ["Shangao Li", "Yao Zhang", "Volker Tresp", "Yuanyuan Yang"], "brief": "QuoteBench \u7528 56 \u4e2a\u4e00\u6b21\u6027\u4efb\u52a1\u8bc4\u6d4b LLM \u7f16\u7801\u667a\u80fd\u4f53\u5728 Bash \u547d\u4ee4\u751f\u6210\u4e0e\u6267\u884c\u4f20\u8f93\u94fe\u8def\u4e4b\u95f4\u7684\u5931\u6548\u8fb9\u754c\uff0c\u53d1\u73b0\u76f8\u540c\u56de\u590d\u7ecf\u8fc7\u989d\u5916\u89e3\u6790\u5668\u4f1a\u4f7f\u6210\u529f\u7387\u4e0b\u964d 55.4 \u5230 73.2 \u4e2a\u767e\u5206\u70b9\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5339\u914d\u6267\u884c\u5206\u6570\u4f1a\u63a9\u76d6\u547d\u4ee4\u8def\u5f84\u4e2d\u7684\u4e25\u91cd\u5931\u8d25\u4e0e\u6a21\u578b\u8865\u507f\u80fd\u529b\uff0c\u8bc4\u6d4b\u5e94\u660e\u786e\u62a5\u544a\u751f\u6210\u5951\u7ea6\u3001\u6267\u884c\u8def\u5f84\u548c\u6700\u7ec8\u72b6\u6001\u9a8c\u8bc1\u5668\u3002", "categories": ["cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13547", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u8bc4\u6d4b\u57fa\u51c6", "\u547d\u4ee4\u6267\u884c"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13547v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "QuoteBench: How Matched Scores Can Hide Command-Path Failures", "tldr": "QuoteBench \u7528 56 \u4e2a\u4e00\u6b21\u6027\u4efb\u52a1\u8bc4\u6d4b LLM \u7f16\u7801\u667a\u80fd\u4f53\u5728 Bash \u547d\u4ee4\u751f\u6210\u4e0e\u6267\u884c\u4f20\u8f93\u94fe\u8def\u4e4b\u95f4\u7684\u5931\u6548\u8fb9\u754c\uff0c\u53d1\u73b0\u76f8\u540c\u56de\u590d\u7ecf\u8fc7\u989d\u5916\u89e3\u6790\u5668\u4f1a\u4f7f\u6210\u529f\u7387\u4e0b\u964d 55.4 \u5230 73.2 \u4e2a\u767e\u5206\u70b9\u3002\u7ed3\u679c\u8868\u660e\uff0c\u5339\u914d\u6267\u884c\u5206\u6570\u4f1a\u63a9\u76d6\u547d\u4ee4\u8def\u5f84\u4e2d\u7684\u4e25\u91cd\u5931\u8d25\u4e0e\u6a21\u578b\u8865\u507f\u80fd\u529b\uff0c\u8bc4\u6d4b\u5e94\u660e\u786e\u62a5\u544a\u751f\u6210\u5951\u7ea6\u3001\u6267\u884c\u8def\u5f84\u548c\u6700\u7ec8\u72b6\u6001\u9a8c\u8bc1\u5668\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern language models are trained on heterogeneous web-scale text corpora. Consequently, studying knowledge and skill acquisition is difficult, as prior exposure to related content is hard to characterize. To address this challenge, we introduce LITTLECURRICULUM, a curated 88B-token pretraining corpus tailored to U.S. elementary school material, explicitly excluding concepts, facts, and vocabulary taught above Grade 5. Training a 5B-parameter LLM from scratch on LITTLECURRICULUM yields LITTLELEARNER, a model with sufficient language competence for open-ended evaluation, yet with clear knowledge and capability boundaries mapped to interpretable curriculum guidelines. We release LITTLECURRICULUM and LITTLELEARNER as a developmentally restricted sandbox to study how models acquire, represent, and use data under a well-defined training scope. We illustrate the sandbox\u0027s utility in a first suite of experiments on injecting new knowledge through post-training and in-context learning. These methods let LITTLELEARNER better utilize existing knowledge, but do not raise out-of-scope capabilities. Our findings underscore the value of this controlled environment for future investigations.", "arxiv_id": "2608.13545", "arxiv_url": "https://arxiv.org/abs/2608.13545", "authors": ["Fanfei Li", "Jana Zeller", "Manuel Prada-Corral", "Thadd\u00e4us Wiedemer", "Prasanna Mayilvahanan", "Ryan Cotterell", "Wieland Brendel"], "brief": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53d7\u5c0f\u5b66\u4e94\u5e74\u7ea7\u53ca\u4ee5\u4e0b\u8bfe\u7a0b\u77e5\u8bc6\u7ea6\u675f\u7684 880 \u4ebf\u8bcd\u5143\u9884\u8bad\u7ec3\u8bed\u6599 LITTLECURRICULUM\uff0c\u5e76\u4ece\u96f6\u8bad\u7ec3\u51fa 5B \u53c2\u6570\u6a21\u578b LITTLELEARNER\uff0c\u7528\u4e8e\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u660e\u786e\u77e5\u8bc6\u8fb9\u754c\u4e0b\u7684\u4e60\u5f97\u8fc7\u7a0b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u540e\u8bad\u7ec3\u548c\u4e0a\u4e0b\u6587\u5b66\u4e60\u80fd\u5e2e\u52a9\u6a21\u578b\u66f4\u597d\u5229\u7528\u5df2\u6709\u77e5\u8bc6\uff0c\u4f46\u96be\u4ee5\u63d0\u5347\u5176\u8d85\u51fa\u8bad\u7ec3\u8303\u56f4\u7684\u80fd\u529b\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13545", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u9884\u8bad\u7ec3", "\u77e5\u8bc6\u4e60\u5f97", "\u6570\u636e\u96c6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13545v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "LittleLearner: Language Models Under Pedagogically Controlled Knowledge Exposure", "tldr": "\u8bba\u6587\u6784\u5efa\u4e86\u4e00\u4e2a\u53d7\u5c0f\u5b66\u4e94\u5e74\u7ea7\u53ca\u4ee5\u4e0b\u8bfe\u7a0b\u77e5\u8bc6\u7ea6\u675f\u7684 880 \u4ebf\u8bcd\u5143\u9884\u8bad\u7ec3\u8bed\u6599 LITTLECURRICULUM\uff0c\u5e76\u4ece\u96f6\u8bad\u7ec3\u51fa 5B \u53c2\u6570\u6a21\u578b LITTLELEARNER\uff0c\u7528\u4e8e\u7814\u7a76\u8bed\u8a00\u6a21\u578b\u5728\u660e\u786e\u77e5\u8bc6\u8fb9\u754c\u4e0b\u7684\u4e60\u5f97\u8fc7\u7a0b\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u540e\u8bad\u7ec3\u548c\u4e0a\u4e0b\u6587\u5b66\u4e60\u80fd\u5e2e\u52a9\u6a21\u578b\u66f4\u597d\u5229\u7528\u5df2\u6709\u77e5\u8bc6\uff0c\u4f46\u96be\u4ee5\u63d0\u5347\u5176\u8d85\u51fa\u8bad\u7ec3\u8303\u56f4\u7684\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "AI agents are increasingly used for programming, but do not provide any guarantee on the correctness of generated code. Verified code generation, in which an agent produces both an implementation and a machine-checked proof of its specification, offers a stronger path toward trustworthy AI-generated software. Existing benchmarks in this direction either focus on individual functions or only evaluate proof generation with provided implementations. It is still an open question whether agents can make coherent implementation and proof choices across real multi-module codebases. To bridge this gap, we introduce Vero, the first benchmark to evaluate joint implementation and proof synthesis at the repository level. Vero contains 43 multi-module instances sourced from real-world repositories spanning Python, Dafny, Verus, and Coq, and covering diverse domains from cryptographic protocols to distributed systems. Each instance consists of a multi-module Lean 4 repository with predetermined API interfaces, manually curated formal specifications, and reference implementations, supporting both proof-only and code-and-proof evaluation modes. To improve benchmark reliability, Vero also includes an audit mechanism where agents are allowed to formally prove unsatisfiability of provided specification or incorrectness of reference code, which surfaces and corrects latent code and specification errors during curation. We evaluate frontier coding-agent configurations with Lean toolchain access. The strongest agent fully solves only 27 of 43 instances and closes no specifications on the hardest repositories. Vero provides a concrete testbed for measuring progress toward repository-scale verified software synthesis, where current agents still fall short. We release the benchmark, curation pipeline, and evaluation harness at https://github.com/sunblaze-ucb/vero.", "arxiv_id": "2608.13522", "arxiv_url": "https://arxiv.org/abs/2608.13522", "authors": ["Zhe Ye", "Hantao Lou", "Yuechun Sun", "Peiyang Song", "Zhengxu Yan", "Timothe Kasriel", "Qingyang Zhang", "Kaiyu Yang", "Soonho Kong", "Jingxuan He", "Dawn Song"], "brief": "\u8bba\u6587\u63d0\u51fa Vero\uff0c\u8fd9\u662f\u9996\u4e2a\u9762\u5411\u4ed3\u5e93\u7ea7\u522b\u7684\u8054\u5408\u4ee3\u7801\u5b9e\u73b0\u4e0e\u5f62\u5f0f\u5316\u8bc1\u660e\u751f\u6210\u57fa\u51c6\uff0c\u8986\u76d6 43 \u4e2a\u6765\u81ea\u771f\u5b9e\u9879\u76ee\u7684\u591a\u6a21\u5757 Lean 4 \u5b9e\u4f8b\u3002\u5b9e\u9a8c\u663e\u793a\u6700\u5f3a\u524d\u6cbf\u7f16\u7a0b\u667a\u80fd\u4f53\u4ec5\u5b8c\u5168\u89e3\u51b3 27/43 \u4e2a\u5b9e\u4f8b\uff0c\u5728\u6700\u96be\u4ed3\u5e93\u4e0a\u65e0\u6cd5\u5b8c\u6210\u89c4\u683c\u8bc1\u660e\uff0c\u8868\u660e\u5f53\u524d\u667a\u80fd\u4f53\u8ddd\u79bb\u53ef\u9760\u751f\u6210\u5f62\u5f0f\u5316\u9a8c\u8bc1\u8f6f\u4ef6\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002", "categories": ["cs.LG", "cs.AI", "cs.LO", "cs.PL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13522", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5f62\u5f0f\u5316\u9a8c\u8bc1", "\u4ee3\u7801\u751f\u6210", "\u8f6f\u4ef6\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13522v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Vero: Can AI Agents Build Formally Verified Software Repositories?", "tldr": "\u8bba\u6587\u63d0\u51fa Vero\uff0c\u8fd9\u662f\u9996\u4e2a\u9762\u5411\u4ed3\u5e93\u7ea7\u522b\u7684\u8054\u5408\u4ee3\u7801\u5b9e\u73b0\u4e0e\u5f62\u5f0f\u5316\u8bc1\u660e\u751f\u6210\u57fa\u51c6\uff0c\u8986\u76d6 43 \u4e2a\u6765\u81ea\u771f\u5b9e\u9879\u76ee\u7684\u591a\u6a21\u5757 Lean 4 \u5b9e\u4f8b\u3002\u5b9e\u9a8c\u663e\u793a\u6700\u5f3a\u524d\u6cbf\u7f16\u7a0b\u667a\u80fd\u4f53\u4ec5\u5b8c\u5168\u89e3\u51b3 27/43 \u4e2a\u5b9e\u4f8b\uff0c\u5728\u6700\u96be\u4ed3\u5e93\u4e0a\u65e0\u6cd5\u5b8c\u6210\u89c4\u683c\u8bc1\u660e\uff0c\u8868\u660e\u5f53\u524d\u667a\u80fd\u4f53\u8ddd\u79bb\u53ef\u9760\u751f\u6210\u5f62\u5f0f\u5316\u9a8c\u8bc1\u8f6f\u4ef6\u4ecd\u6709\u660e\u663e\u5dee\u8ddd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We study masking diffusion for discrete sampling and introduce a path-resolved measure of data geometry called the \\emph{unmasking growth complexity} ({\\textsf{UGC}\\xspace}). Its local increments directly control Kullback--Leibler (KL) discretization error, yielding a unified analysis of Bernoulli-subset and fixed-cardinality unmasking schemes. In log-reveal-odds coordinates, this structure yields optimized single-block and multi-block schedules, and quantifies the gains from adapting computational effort to data geometry. Crucially, we show how {\\textsf{UGC}\\xspace} increments can be estimated from samples via KL increments along coupled reveal trajectories. This leads to \\emph{certified-optimal} samplers that achieve a prescribed KL error with high probability and iteration complexity within a constant factor of the corresponding oracle procedure. Collapsing the \\ugc path yields the aggregate {\\textsf{UGC}\\xspace} mass, which connects to classical multivariate dependence measures and complexity measures from previous analyses of discrete diffusion. In the fine-partition limit, the squared integral of the square-root {\\textsf{UGC}\\xspace} density determines the sharp leading-order optimal Euler discretization error. Examples exhibit substantial dimension-dependent gains over coarse schedules, including $\\widetilde\u03a9(\\sqrt{d})$ improvements achievable with a constant number of adaptively placed blocks.", "arxiv_id": "2608.13520", "arxiv_url": "https://arxiv.org/abs/2608.13520", "authors": ["Martin J. Wainwright"], "brief": "\u8bba\u6587\u7814\u7a76\u79bb\u6563\u91c7\u6837\u4e2d\u7684\u63a9\u7801\u6269\u6563\uff0c\u63d0\u51fa\u201c\u89e3\u63a9\u7801\u589e\u957f\u590d\u6742\u5ea6\u201dUGC \u6765\u523b\u753b\u6570\u636e\u51e0\u4f55\uff0c\u5e76\u7528\u5176\u5c40\u90e8\u589e\u91cf\u63a7\u5236 KL \u79bb\u6563\u5316\u8bef\u5dee\u3002\u57fa\u4e8e UGC \u53ef\u6784\u9020\u7ecf\u8ba4\u8bc1\u7684\u8fd1\u6700\u4f18\u91c7\u6837\u8c03\u5ea6\uff0c\u5728\u7ed9\u5b9a KL \u8bef\u5dee\u4e0b\u4ee5\u9ad8\u6982\u7387\u8fbe\u5230\u63a5\u8fd1 oracle \u7684\u8fed\u4ee3\u590d\u6742\u5ea6\uff0c\u5e76\u5728\u9ad8\u7ef4\u4f8b\u5b50\u4e2d\u76f8\u5bf9\u7c97\u7cd9\u8c03\u5ea6\u83b7\u5f97\u663e\u8457\u52a0\u901f\u3002", "categories": ["cs.LG", "cs.AI", "cs.IT", "math.ST", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13520", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6269\u6563\u6a21\u578b", "\u79bb\u6563\u91c7\u6837", "\u6570\u636e\u51e0\u4f55", "\u6700\u4f18\u8c03\u5ea6"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13520v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The data geometry of masking diffusion: Certified-optimal schedules via unmasking growth complexity", "tldr": "\u8bba\u6587\u7814\u7a76\u79bb\u6563\u91c7\u6837\u4e2d\u7684\u63a9\u7801\u6269\u6563\uff0c\u63d0\u51fa\u201c\u89e3\u63a9\u7801\u589e\u957f\u590d\u6742\u5ea6\u201dUGC \u6765\u523b\u753b\u6570\u636e\u51e0\u4f55\uff0c\u5e76\u7528\u5176\u5c40\u90e8\u589e\u91cf\u63a7\u5236 KL \u79bb\u6563\u5316\u8bef\u5dee\u3002\u57fa\u4e8e UGC \u53ef\u6784\u9020\u7ecf\u8ba4\u8bc1\u7684\u8fd1\u6700\u4f18\u91c7\u6837\u8c03\u5ea6\uff0c\u5728\u7ed9\u5b9a KL \u8bef\u5dee\u4e0b\u4ee5\u9ad8\u6982\u7387\u8fbe\u5230\u63a5\u8fd1 oracle \u7684\u8fed\u4ee3\u590d\u6742\u5ea6\uff0c\u5e76\u5728\u9ad8\u7ef4\u4f8b\u5b50\u4e2d\u76f8\u5bf9\u7c97\u7cd9\u8c03\u5ea6\u83b7\u5f97\u663e\u8457\u52a0\u901f\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Current large language model development relies on massive, often non-permissible datasets, creating a high barrier for researchers committed to open-source and ethically sourced data. We introduce Mimir v1, a 1-billion-parameter language model based on the Hierarchical Reasoning Model (HRM) architecture, that is trained from scratch and delivers highly competitive performance for English and sets a new state of the art for Danish using only permissible post-training data. Trained on a mixture of 161 datasets, Mimir v1 outperforms the original HRM-Text 1B and competes with larger frontier models like Qwen 3.5 4B and Gemma 4 E2B, tested across 20 benchmarks for English, Math \u0026 Code and Danish. The model is available on the Hugging Face Hub: https://huggingface.co/danish-foundation-models/DFM-Mimir", "arxiv_id": "2608.13517", "arxiv_url": "https://arxiv.org/abs/2608.13517", "authors": ["Peter Schneider-Kamp", "Jacob Nielsen", "Gianluca Barmina", "Kenneth Enevoldsen", "Lukas Galke Poech"], "brief": "\u8bba\u6587\u53d1\u5e03 Mimir v1\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5206\u5c42\u63a8\u7406\u6a21\u578b\uff08HRM\uff09\u67b6\u6784\u3001\u4ece\u96f6\u8bad\u7ec3\u7684 10 \u4ebf\u53c2\u6570\u8bed\u8a00\u6a21\u578b\uff0c\u5f3a\u8c03\u4ec5\u4f7f\u7528\u8bb8\u53ef\u5408\u89c4\u7684\u540e\u8bad\u7ec3\u6570\u636e\u3002\u5b83\u5728\u82f1\u8bed\u3001\u6570\u5b66\u3001\u4ee3\u7801\u548c\u4e39\u9ea6\u8bed\u7b49 20 \u4e2a\u57fa\u51c6\u4e0a\u8d85\u8fc7\u539f HRM-Text 1B\uff0c\u5e76\u5728\u4e39\u9ea6\u8bed\u4e0a\u8fbe\u5230\u65b0\u7684\u6700\u4f73\u6c34\u5e73\uff0c\u53ef\u4e0e\u66f4\u5927\u6a21\u578b\u7ade\u4e89\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13517", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f00\u6e90\u6a21\u578b", "\u6570\u636e\u5408\u89c4", "\u4e39\u9ea6\u8bed"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13517v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "DFM Mimir v1: An Open HRM Delivering Frontier Performance at 1B Parameters Using Only Permissible Post-Training Data", "tldr": "\u8bba\u6587\u53d1\u5e03 Mimir v1\uff0c\u4e00\u4e2a\u57fa\u4e8e\u5206\u5c42\u63a8\u7406\u6a21\u578b\uff08HRM\uff09\u67b6\u6784\u3001\u4ece\u96f6\u8bad\u7ec3\u7684 10 \u4ebf\u53c2\u6570\u8bed\u8a00\u6a21\u578b\uff0c\u5f3a\u8c03\u4ec5\u4f7f\u7528\u8bb8\u53ef\u5408\u89c4\u7684\u540e\u8bad\u7ec3\u6570\u636e\u3002\u5b83\u5728\u82f1\u8bed\u3001\u6570\u5b66\u3001\u4ee3\u7801\u548c\u4e39\u9ea6\u8bed\u7b49 20 \u4e2a\u57fa\u51c6\u4e0a\u8d85\u8fc7\u539f HRM-Text 1B\uff0c\u5e76\u5728\u4e39\u9ea6\u8bed\u4e0a\u8fbe\u5230\u65b0\u7684\u6700\u4f73\u6c34\u5e73\uff0c\u53ef\u4e0e\u66f4\u5927\u6a21\u578b\u7ade\u4e89\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "This report presents an improved version of AlayaWorld. While the backbone architecture, chunk-wise autoregressive generation scheme, and training data remain unchanged from the previous release, we substantially revise how conditioning signals are represented and integrated into the model. The new design is guided by a simple principle: conditioning signals should match the generated content as closely as possible in both latent representation and temporal structure. To this end, we make two major changes. First, we replace the previous depth-warping-based spatial memory with a streaming 3D point-cache renderer. Second, we redesign the conditioning pipeline so that visual conditions are encoded in the same causal-VAE latent space, with temporal statistics consistent with those of the generated video. Concretely, the new version introduces six modifications: (1) replacing static-frame image conditioning with motion-aware latent conditioning; (2) causally encoding re-rendered spatial memory as a continuous sequence; (3) aligning the temporal-memory window in pixel space; (4) adopting hard memory dropout that removes memory tokens rather than zeroing them; (5) unifying the VAE encoding and decoding protocol across training and inference; and (6) removing the camera AdaLN branch, such that viewpoint control is provided entirely through the re-rendered spatial condition.", "arxiv_id": "2608.13492", "arxiv_url": "https://arxiv.org/abs/2608.13492", "authors": ["AlayaWorld Team", "Kaipeng Zhang", "Chuanhao Li", "Yifan Zhan", "Yongtao Ge", "Yuanyang Yin", "Jiaming Tan", "Kang He", "Liaoyuan Fan", "Mingliang Zhai", "Ruicong Liu", "Xiaojie Xu", "Xuangeng Chu", "Zhen Li", "Zhengyuan Lin", "Zhixiang Wang", "Zian Meng", "Zihui Gao"], "brief": "AlayaWorld v1.1 \u5728\u4e0d\u6539\u53d8\u9aa8\u5e72\u3001\u5206\u5757\u81ea\u56de\u5f52\u751f\u6210\u548c\u8bad\u7ec3\u6570\u636e\u7684\u60c5\u51b5\u4e0b\uff0c\u91cd\u65b0\u8bbe\u8ba1\u4e86\u6761\u4ef6\u4fe1\u53f7\u7684\u8868\u793a\u4e0e\u878d\u5408\u65b9\u5f0f\uff0c\u4f7f\u5176\u5728\u6f5c\u7a7a\u95f4\u548c\u65f6\u95f4\u7ed3\u6784\u4e0a\u66f4\u8d34\u8fd1\u751f\u6210\u89c6\u9891\u3002\u65b0\u7248\u5f15\u5165\u6d41\u5f0f 3D \u70b9\u7f13\u5b58\u6e32\u67d3\u3001\u8fd0\u52a8\u611f\u77e5\u6f5c\u53d8\u91cf\u6761\u4ef6\u548c\u7edf\u4e00\u7684 VAE \u7f16\u89e3\u7801\u6d41\u7a0b\u7b49\u6539\u52a8\uff0c\u4ee5\u63d0\u5347\u957f\u65f6\u7a0b\u4ea4\u4e92\u5f0f\u4e16\u754c\u5efa\u6a21\u7684\u4e00\u81f4\u6027\u4e0e\u53ef\u63a7\u6027\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13492", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u89c6\u9891\u751f\u6210", "\u4e09\u7ef4\u91cd\u5efa", "\u957f\u65f6\u7a0b\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13492v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AlayaWorld: Interactive Long-Horizon World Modeling - Full Technical Report (v1.1)", "tldr": "AlayaWorld v1.1 \u5728\u4e0d\u6539\u53d8\u9aa8\u5e72\u3001\u5206\u5757\u81ea\u56de\u5f52\u751f\u6210\u548c\u8bad\u7ec3\u6570\u636e\u7684\u60c5\u51b5\u4e0b\uff0c\u91cd\u65b0\u8bbe\u8ba1\u4e86\u6761\u4ef6\u4fe1\u53f7\u7684\u8868\u793a\u4e0e\u878d\u5408\u65b9\u5f0f\uff0c\u4f7f\u5176\u5728\u6f5c\u7a7a\u95f4\u548c\u65f6\u95f4\u7ed3\u6784\u4e0a\u66f4\u8d34\u8fd1\u751f\u6210\u89c6\u9891\u3002\u65b0\u7248\u5f15\u5165\u6d41\u5f0f 3D \u70b9\u7f13\u5b58\u6e32\u67d3\u3001\u8fd0\u52a8\u611f\u77e5\u6f5c\u53d8\u91cf\u6761\u4ef6\u548c\u7edf\u4e00\u7684 VAE \u7f16\u89e3\u7801\u6d41\u7a0b\u7b49\u6539\u52a8\uff0c\u4ee5\u63d0\u5347\u957f\u65f6\u7a0b\u4ea4\u4e92\u5f0f\u4e16\u754c\u5efa\u6a21\u7684\u4e00\u81f4\u6027\u4e0e\u53ef\u63a7\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "When asked about entities outside their knowledge boundary, LLMs routinely fabricate plausible-sounding details rather than backing off to safer, more general claims. We frame this failure through a Gricean lens: a cooperative speaker who is uncertain about a referent retreats up the specificity hierarchy, trading informativeness for truthfulness. We ask whether LLMs have the ingredients to perform this retreat. Using a T-REx-based benchmark that varies entity familiarity and referent specificity, we probe models to answer two questions: (i) do their activations encode whether a referent falls inside the knowledge boundary, and (ii) do they anticipate the specificity of the referent they are about to generate? We find that the answer to both is yes, but the two signals are not reconciled in generation. Models overwhelmingly prefer specific referents even when the entity is unknown to them, and do so even when offered correct generic alternatives. The substrate for a Gricean retreat is present, but the policy that would act on it is not. We position our findings as a first step toward Gricean alignment, training or steering objectives that couple knowledge-boundary awareness to referent-specificity during generation.", "arxiv_id": "2608.13484", "arxiv_url": "https://arxiv.org/abs/2608.13484", "authors": ["Dananjay Srinivas", "Saksham Khatwani", "Maria Pacheco"], "brief": "\u8bba\u6587\u4ece\u683c\u8d56\u65af\u5408\u4f5c\u539f\u5219\u89c6\u89d2\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u77e5\u8bc6\u8fb9\u754c\u5916\u7684\u5e7b\u89c9\u95ee\u9898\uff1a\u4e0d\u786e\u5b9a\u65f6\u5e94\u9000\u56de\u5230\u66f4\u6cdb\u5316\u3001\u66f4\u5b89\u5168\u7684\u8868\u8ff0\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u6a21\u578b\u5185\u90e8\u8868\u5f81\u786e\u5b9e\u7f16\u7801\u4e86\u5b9e\u4f53\u662f\u5426\u5728\u77e5\u8bc6\u8fb9\u754c\u5185\uff0c\u4e5f\u80fd\u9884\u671f\u5c06\u751f\u6210\u6307\u79f0\u7684\u5177\u4f53\u6027\uff0c\u4f46\u751f\u6210\u7b56\u7565\u6ca1\u6709\u5229\u7528\u8fd9\u4e9b\u4fe1\u53f7\uff0c\u4ecd\u503e\u5411\u8f93\u51fa\u5177\u4f53\u4e14\u53ef\u80fd\u9519\u8bef\u7684\u6307\u79f0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13484", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5e7b\u89c9", "\u77e5\u8bc6\u8fb9\u754c", "\u5bf9\u9f50"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13484v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Toward a Gricean Retreat: Probing LLMs for Knowledge Boundaries and Referent Specificity", "tldr": "\u8bba\u6587\u4ece\u683c\u8d56\u65af\u5408\u4f5c\u539f\u5219\u89c6\u89d2\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u77e5\u8bc6\u8fb9\u754c\u5916\u7684\u5e7b\u89c9\u95ee\u9898\uff1a\u4e0d\u786e\u5b9a\u65f6\u5e94\u9000\u56de\u5230\u66f4\u6cdb\u5316\u3001\u66f4\u5b89\u5168\u7684\u8868\u8ff0\u3002\u5b9e\u9a8c\u53d1\u73b0\uff0c\u6a21\u578b\u5185\u90e8\u8868\u5f81\u786e\u5b9e\u7f16\u7801\u4e86\u5b9e\u4f53\u662f\u5426\u5728\u77e5\u8bc6\u8fb9\u754c\u5185\uff0c\u4e5f\u80fd\u9884\u671f\u5c06\u751f\u6210\u6307\u79f0\u7684\u5177\u4f53\u6027\uff0c\u4f46\u751f\u6210\u7b56\u7565\u6ca1\u6709\u5229\u7528\u8fd9\u4e9b\u4fe1\u53f7\uff0c\u4ecd\u503e\u5411\u8f93\u51fa\u5177\u4f53\u4e14\u53ef\u80fd\u9519\u8bef\u7684\u6307\u79f0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As language-model-based AI is increasingly deployed in autonomous settings, aligning its goals and values with those of humans becomes critical. Today, alignment, and the assistant identity itself, are typically introduced only after pretraining, once behavioral priors are already established. This can make values a thin overlay, rather than deeply rooted, and facilitate subsequent misalignment. Pursuing a different paradigm, we introduce Synthetic Persona Pretraining (SPP), which installs the desired assistant persona from token zero in pretraining. First, we annotate pretraining documents with value-aligned first-person reflections derived from a normative value constitution. Second, we pretrain via the standard cross-entropy loss on standard pretraining documents as well as their reflections, which installs the desired persona among a multitude of other personas. Finally, we post-train on user-assistant dialogue data, which binds this desired persona to the assistant identity, a process we call persona binding. By pretraining models up to 3B parameters on 500B tokens, we show that SPP improves constitution following and jailbreak robustness, and reduces the misalignment rate in out-of-distribution moral dilemmas, while preserving capabilities. Early intervention matters: compared with alignment from token zero, introducing SPP only at the end of pretraining yields weaker constitution adherence, does not shift value priorities, and leads to less aligned choices in dilemmas. This advantage depends on persona binding and, importantly, increases with pretraining budget. Overall, our results show that shaping values early is critical for alignment and establish pretraining-time persona interventions as an effective approach to do so.", "arxiv_id": "2608.13482", "arxiv_url": "https://arxiv.org/abs/2608.13482", "authors": ["Julian Minder", "Viktor Moskvoretskii", "Raghav Singhal", "Difan Jiao", "Andy Arditi", "Shaobo Cui", "Yiderigun Borjigin", "Kartik Bali", "Stefan Krsteski", "Harsh Raj", "Huu Nguyen", "Jannik Brinkmann", "Ashton Anderson", "Roland Aydin", "Robert West"], "brief": "\u8bba\u6587\u63d0\u51fa\u5408\u6210\u4eba\u683c\u9884\u8bad\u7ec3\uff08SPP\uff09\uff0c\u5728\u9884\u8bad\u7ec3\u521d\u59cb\u9636\u6bb5\u5c31\u5411\u8bed\u6599\u52a0\u5165\u57fa\u4e8e\u4ef7\u503c\u5baa\u7ae0\u7684\u7b2c\u4e00\u4eba\u79f0\u53cd\u601d\uff0c\u5e76\u5728\u540e\u8bad\u7ec3\u4e2d\u5c06\u8be5\u4eba\u683c\u7ed1\u5b9a\u5230\u52a9\u624b\u8eab\u4efd\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u6700\u9ad83B\u53c2\u6570\u3001500B token\u9884\u8bad\u7ec3\u4e0b\uff0cSPP\u80fd\u63d0\u5347\u5baa\u7ae0\u9075\u5faa\u4e0e\u8d8a\u72f1\u9c81\u68d2\u6027\uff0c\u964d\u4f4e\u5206\u5e03\u5916\u9053\u5fb7\u56f0\u5883\u4e2d\u7684\u5931\u914d\u7387\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u80fd\u529b\uff1b\u8d8a\u65e9\u4ecb\u5165\u6548\u679c\u8d8a\u597d\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13482", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5bf9\u9f50", "\u9884\u8bad\u7ec3", "\u5b89\u5168\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13482v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Synthetic Persona Pretraining: Alignment from Token Zero", "tldr": "\u8bba\u6587\u63d0\u51fa\u5408\u6210\u4eba\u683c\u9884\u8bad\u7ec3\uff08SPP\uff09\uff0c\u5728\u9884\u8bad\u7ec3\u521d\u59cb\u9636\u6bb5\u5c31\u5411\u8bed\u6599\u52a0\u5165\u57fa\u4e8e\u4ef7\u503c\u5baa\u7ae0\u7684\u7b2c\u4e00\u4eba\u79f0\u53cd\u601d\uff0c\u5e76\u5728\u540e\u8bad\u7ec3\u4e2d\u5c06\u8be5\u4eba\u683c\u7ed1\u5b9a\u5230\u52a9\u624b\u8eab\u4efd\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u5728\u6700\u9ad83B\u53c2\u6570\u3001500B token\u9884\u8bad\u7ec3\u4e0b\uff0cSPP\u80fd\u63d0\u5347\u5baa\u7ae0\u9075\u5faa\u4e0e\u8d8a\u72f1\u9c81\u68d2\u6027\uff0c\u964d\u4f4e\u5206\u5e03\u5916\u9053\u5fb7\u56f0\u5883\u4e2d\u7684\u5931\u914d\u7387\uff0c\u540c\u65f6\u57fa\u672c\u4fdd\u6301\u80fd\u529b\uff1b\u8d8a\u65e9\u4ecb\u5165\u6548\u679c\u8d8a\u597d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "We present Multi-Agent Reasoning and Coordination (MARC), an open-source framework that replaces monolithic LLM prompting with deterministic multi-agent orchestration for clinical reasoning. MARC coordinates role-specialized agents for extraction, reasoning, answer generation, and evaluation, with explicit context passing and traceable intermediate outputs, enabling stage-wise failure attribution. We additionally introduce a Decomposer module that generates task-specific agent prompts from a plain-language description, eliminating manual prompt engineering. The framework supports both API-based and local CPU-compatible deployments and is entirely configurable via YAML, without code modifications. MARC is designed to be model-agnostic, interpretable, and accessible to clinical domain experts without programming expertise. The full framework is available at https://github.com/Penn-RAIL/MARC-v1.", "arxiv_id": "2608.13476", "arxiv_url": "https://arxiv.org/abs/2608.13476", "authors": ["Saisha Shetty", "Satvik Tripathi", "Austin Lin", "Colin Zhao", "Theodore Kim", "Don Enwerem", "Jacinta Arnold", "Shahriar Faghani", "Tessa S Cook"], "brief": "MARC v1 \u63d0\u51fa\u4e00\u4e2a\u5f00\u6e90\u4e34\u5e8a AI \u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u89d2\u8272\u4e13\u95e8\u5316\u667a\u80fd\u4f53\u5206\u522b\u5b8c\u6210\u4fe1\u606f\u62bd\u53d6\u3001\u63a8\u7406\u3001\u7b54\u6848\u751f\u6210\u4e0e\u8bc4\u4f30\uff0c\u5e76\u901a\u8fc7\u663e\u5f0f\u4e0a\u4e0b\u6587\u4f20\u9012\u5b9e\u73b0\u53ef\u8ffd\u8e2a\u7684\u9636\u6bb5\u6027\u8bca\u65ad\u3002\u5176 Decomposer \u6a21\u5757\u53ef\u4ece\u81ea\u7136\u8bed\u8a00\u4efb\u52a1\u63cf\u8ff0\u81ea\u52a8\u751f\u6210\u667a\u80fd\u4f53\u63d0\u793a\u8bcd\uff0c\u964d\u4f4e\u624b\u5de5\u63d0\u793a\u5de5\u7a0b\u9700\u6c42\uff0c\u5e76\u652f\u6301 API \u4e0e\u672c\u5730 CPU \u90e8\u7f72\u3001YAML \u914d\u7f6e\u3002", "categories": ["cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13476", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4e34\u5e8a\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u63d0\u793a\u5de5\u7a0b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13476v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "MARC v1: An Open-Source Multi-Agent Framework for Clinical AI Reasoning and Coordination", "tldr": "MARC v1 \u63d0\u51fa\u4e00\u4e2a\u5f00\u6e90\u4e34\u5e8a AI \u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u7528\u89d2\u8272\u4e13\u95e8\u5316\u667a\u80fd\u4f53\u5206\u522b\u5b8c\u6210\u4fe1\u606f\u62bd\u53d6\u3001\u63a8\u7406\u3001\u7b54\u6848\u751f\u6210\u4e0e\u8bc4\u4f30\uff0c\u5e76\u901a\u8fc7\u663e\u5f0f\u4e0a\u4e0b\u6587\u4f20\u9012\u5b9e\u73b0\u53ef\u8ffd\u8e2a\u7684\u9636\u6bb5\u6027\u8bca\u65ad\u3002\u5176 Decomposer \u6a21\u5757\u53ef\u4ece\u81ea\u7136\u8bed\u8a00\u4efb\u52a1\u63cf\u8ff0\u81ea\u52a8\u751f\u6210\u667a\u80fd\u4f53\u63d0\u793a\u8bcd\uff0c\u964d\u4f4e\u624b\u5de5\u63d0\u793a\u5de5\u7a0b\u9700\u6c42\uff0c\u5e76\u652f\u6301 API \u4e0e\u672c\u5730 CPU \u90e8\u7f72\u3001YAML \u914d\u7f6e\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Analog circuit design is a time-consuming, iterative process in a nonlinear and high-dimensional design space that relies heavily on expert intuition. Among recent developments, LLMs have introduced a promising approach by bringing natural language reasoning to circuit design tasks. The majority of conventional LLM-based approaches provide fragmented solutions that focus either only on sizing or topology generation. These methods require adding specific technical knowledge manually, which is inefficient and prone to hallucinations during circuit sizing. Moreover, the inherent trade-off in meeting different specs makes current approaches iterative and tedious. Another shortcoming is the inability to create innovative topologies, which may lead to sub-optimal designs due to reliance on conventional topologies. In this paper, we present AaLLM, an open-source end-to-end multi-agent LLM workflow that takes user specs as input and outputs the appropriate netlist, encompassing both topology generation and circuit sizing. AaLLM automates the creation of a relevant knowledge base from research papers and textbooks to combat tedious manual data collection. A RAG model is implemented to emulate circuit design expertise using this knowledge base. Moreover, AaLLM uses a novel tri-agent feedback system comprising a Designer that determines circuit component values, a Critic that scrutinizes these values, and an Evaluator that minimizes circuit sizing iterations by arbitrating between the other two agents. AaLLM-generated novel topologies achieve a figure of merit (FoM) comparable to that of known topologies, and up to 3x higher for certain circuits. Testing on several circuit topologies, our results show a 3x - 4.5x decrease in the number of SPICE calls at inference when compared to SOTA multi-agent LLM pipelines. The results also show a 40x decrease in wall-clock time compared to existing approaches.", "arxiv_id": "2608.13472", "arxiv_url": "https://arxiv.org/abs/2608.13472", "authors": ["Mohammed Ayman Habib", "Rylan Hart", "Morteza Fayazi"], "brief": "\u672c\u6587\u63d0\u51fa AaLLM\uff0c\u4e00\u4e2a\u5f00\u6e90\u7aef\u5230\u7aef\u591a\u667a\u80fd\u4f53\u6a21\u62df\u7535\u8def\u8bbe\u8ba1\u6846\u67b6\uff0c\u53ef\u4ece\u7528\u6237\u89c4\u683c\u81ea\u52a8\u751f\u6210\u62d3\u6251\u5e76\u5b8c\u6210\u5c3a\u5bf8\u53c2\u6570\u8bbe\u8ba1\uff0c\u8f93\u51fa\u53ef\u7528\u7f51\u8868\u3002\u5b83\u901a\u8fc7\u81ea\u52a8\u6784\u5efa\u77e5\u8bc6\u5e93\u3001RAG \u548c Designer/Critic/Evaluator \u4e09\u667a\u80fd\u4f53\u53cd\u9988\u673a\u5236\u51cf\u5c11\u5e7b\u89c9\u4e0e\u8fed\u4ee3\uff0c\u5728\u90e8\u5206\u7535\u8def\u4e0a\u65b0\u62d3\u6251 FoM \u6700\u9ad8\u63d0\u5347 3 \u500d\uff0c\u5e76\u5c06 SPICE \u8c03\u7528\u51cf\u5c11 3-4.5 \u500d\u3001\u603b\u8017\u65f6\u51cf\u5c11\u7ea6 40 \u500d\u3002", "categories": ["eess.SY", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13472", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7535\u8def\u8bbe\u8ba1", "RAG"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13472v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "AaLLM: An End-to-End Analog Circuit Design Framework from Topology Generation to Sizing Using Large Language Models", "tldr": "\u672c\u6587\u63d0\u51fa AaLLM\uff0c\u4e00\u4e2a\u5f00\u6e90\u7aef\u5230\u7aef\u591a\u667a\u80fd\u4f53\u6a21\u62df\u7535\u8def\u8bbe\u8ba1\u6846\u67b6\uff0c\u53ef\u4ece\u7528\u6237\u89c4\u683c\u81ea\u52a8\u751f\u6210\u62d3\u6251\u5e76\u5b8c\u6210\u5c3a\u5bf8\u53c2\u6570\u8bbe\u8ba1\uff0c\u8f93\u51fa\u53ef\u7528\u7f51\u8868\u3002\u5b83\u901a\u8fc7\u81ea\u52a8\u6784\u5efa\u77e5\u8bc6\u5e93\u3001RAG \u548c Designer/Critic/Evaluator \u4e09\u667a\u80fd\u4f53\u53cd\u9988\u673a\u5236\u51cf\u5c11\u5e7b\u89c9\u4e0e\u8fed\u4ee3\uff0c\u5728\u90e8\u5206\u7535\u8def\u4e0a\u65b0\u62d3\u6251 FoM \u6700\u9ad8\u63d0\u5347 3 \u500d\uff0c\u5e76\u5c06 SPICE \u8c03\u7528\u51cf\u5c11 3-4.5 \u500d\u3001\u603b\u8017\u65f6\u51cf\u5c11\u7ea6 40 \u500d\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Concept drift refers to changes over time in the statistical properties of data, as compared to the data that was used to train a learning model. Machine learning models for malware detection or classification are particularly susceptible to performance degradation caused by concept drift, as attackers constantly modify existing malware. In this chapter, we analyze two machine learning-based approaches to automated concept drift detection-a novel approach based on One-Class Support Vector Machines (OCSVM) and a previously-studied technique based on Minibatch K-Means (MK-Means). For comparison we also consider Maximum Mean Discrepancy (MMD), a statistical technique for detecting changes in multidimensional data. We conduct an extensive series of experiments comparing the effectiveness of four learning models, namely, Multilayer Perceptron, Random Forest, Support Vector Machines, and eXtreme Gradient Boosting. For each of these models, we consider three distinct scenarios: A static scenario where no model retraining occurs, a periodic scenario where models are constantly retrained irrespective of concept drift, and a drift-aware scenario where models are only retrained when concept drift is detected. Under the drift-aware scenario, we analyze the tradeoff between accuracy and training efficiency using Pareto Front analysis. We find that all three concept drift detection techniques achieve classification accuracy comparable to periodic retraining, while offering substantially greater efficiency in terms of the number of models that must be retrained. In addition, drift-aware retraining based on our OCSVM technique generally outperforms the MK-Means and MMD approaches. Overall, these results provide strong evidence that we can accurately detect concept drift in malware classification models.", "arxiv_id": "2608.13465", "arxiv_url": "https://arxiv.org/abs/2608.13465", "authors": ["Christofer Washington Berruz Chungata", "Martin Jurecek", "Katerina Potika", "William B. Andreopoulos", "Mark Stamp"], "brief": "\u672c\u6587\u7814\u7a76\u6076\u610f\u8f6f\u4ef6\u5206\u7c7b\u4e2d\u7684\u6982\u5ff5\u6f02\u79fb\u68c0\u6d4b\u4e0e\u81ea\u9002\u5e94\u91cd\u8bad\u7ec3\uff0c\u6bd4\u8f83\u4e86\u57fa\u4e8e OCSVM\u3001Minibatch K-Means \u548c MMD \u7684\u6f02\u79fb\u68c0\u6d4b\u65b9\u6cd5\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u6f02\u79fb\u611f\u77e5\u91cd\u8bad\u7ec3\u80fd\u8fbe\u5230\u63a5\u8fd1\u5468\u671f\u6027\u91cd\u8bad\u7ec3\u7684\u5206\u7c7b\u51c6\u786e\u7387\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u91cd\u8bad\u7ec3\u6b21\u6570\uff0c\u5176\u4e2d OCSVM \u65b9\u6cd5\u6574\u4f53\u8868\u73b0\u66f4\u4f18\u3002", "categories": ["cs.LG", "cs.AI", "cs.CR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.13465", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u6982\u5ff5\u6f02\u79fb", "\u6076\u610f\u8f6f\u4ef6\u68c0\u6d4b", "\u81ea\u9002\u5e94\u91cd\u8bad\u7ec3", "\u673a\u5668\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.13465v1", "published_at": "2026-08-13", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Concept Drift Detection and Adaptive Retraining of Malware Classification Models", "tldr": "\u672c\u6587\u7814\u7a76\u6076\u610f\u8f6f\u4ef6\u5206\u7c7b\u4e2d\u7684\u6982\u5ff5\u6f02\u79fb\u68c0\u6d4b\u4e0e\u81ea\u9002\u5e94\u91cd\u8bad\u7ec3\uff0c\u6bd4\u8f83\u4e86\u57fa\u4e8e OCSVM\u3001Minibatch K-Means \u548c MMD \u7684\u6f02\u79fb\u68c0\u6d4b\u65b9\u6cd5\u3002\u5b9e\u9a8c\u663e\u793a\uff0c\u6f02\u79fb\u611f\u77e5\u91cd\u8bad\u7ec3\u80fd\u8fbe\u5230\u63a5\u8fd1\u5468\u671f\u6027\u91cd\u8bad\u7ec3\u7684\u5206\u7c7b\u51c6\u786e\u7387\uff0c\u540c\u65f6\u663e\u8457\u51cf\u5c11\u91cd\u8bad\u7ec3\u6b21\u6570\uff0c\u5176\u4e2d OCSVM \u65b9\u6cd5\u6574\u4f53\u8868\u73b0\u66f4\u4f18\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Modern image classification models excel when trained on single task-specific datasets but often struggle to generalize across domains and difficulty levels. We propose ARMDIL, an Adaptive Router for Multi-Domain Image classification with LLMs. ARMDIL is an ensemble that uses a multimodal large language model (MLLM) agent to dynamically route each image to the most suitable vision backbone. Our diverse ensemble employs convolutional neural networks (ResNets), self-supervised representation learners (SSL), and vision-language models (VLMs), each trained on a unified label space constructed from multiple image datasets with differing distributions and characteristics. Empirical evaluations illuminate the distinct capabilities and vulnerabilities of each architecture across disparate visual domains. Crucially, we show that ARMDIL effectively navigates these trade-offs, performing competitively with specialized training-based routers. Furthermore, it drastically improves adaptability by allowing new information to be integrated via simple prompt modifications, while enhancing interpretability through natural language reasoning traces. These advances in cross-dataset image classification pave the way for more reliable general-purpose vision systems such as AI assistants and autonomous robots.", "arxiv_id": "2608.13463", "arxiv_url": "https://arxiv.org/abs/2608.13463", "authors": ["Daniel Perkins", "John Squires", "Janou Milligan", "Chandra Raskoti", "Linda Ungerboeck"], "brief": "\u8bba\u6587\u63d0\u51fa ARMDIL\uff0c\u7528\u591a\u6a21\u6001\u5927\u8bed\u8a00\u6a21\u578b\u4f5c\u4e3a\u8def\u7531\u667a\u80fd\u4f53\uff0c\u4e3a\u6bcf\u5f20\u56fe\u50cf\u52a8\u6001\u9009\u62e9\u6700\u5408\u9002\u7684\u89c6\u89c9\u9aa8\u5e72\u6a21\u578b\u3002\u8be5\u5f02\u6784\u96
