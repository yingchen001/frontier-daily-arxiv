imal simulation foundations for education and rapid prototyping. SD-AgentFoundry-2D provides a two-dimensional multi-agent environment in which locally hosted LLM agents move, communicate, respond to place occupancy, and encounter spatially localized fire events. SD-AgentFoundry-3D provides a three-dimensional digital-twin environment in which a locally hosted VLM receives first-person images and produces natural-language movement instructions. Both codebases are designed to run locally on macOS, Windows, and Linux and are deliberately left open to modification rather than developed as finished applications. Together, they offer accessible starting points for learning about generative social simulation and for building domain-specific extensions.", "arxiv_id": "2608.22833", "arxiv_url": "https://arxiv.org/abs/2608.22833", "authors": ["Ryuki Hyodo"], "brief": "\u672c\u6587\u63d0\u51fa\u4e24\u4e2a\u9762\u5411\u6559\u80b2\u4e0e\u5feb\u901f\u539f\u578b\u7684\u6781\u7b80\u672c\u5730\u4eff\u771f\u57fa\u7840\uff1a2D \u591a\u667a\u80fd\u4f53\u73af\u5883\u652f\u6301\u672c\u5730 LLM \u667a\u80fd\u4f53\u79fb\u52a8\u3001\u4ea4\u6d41\u548c\u54cd\u5e94\u706b\u707e\u7b49\u7a7a\u95f4\u4e8b\u4ef6\uff0c3D \u6570\u5b57\u5b6a\u751f\u73af\u5883\u8ba9\u672c\u5730 VLM \u57fa\u4e8e\u7b2c\u4e00\u89c6\u89d2\u56fe\u50cf\u751f\u6210\u79fb\u52a8\u6307\u4ee4\u3002\u7cfb\u7edf\u5f3a\u8c03\u53ef\u5728\u666e\u901a\u7535\u8111\u4e0a\u672c\u5730\u8fd0\u884c\u3001\u6613\u4fee\u6539\uff0c\u9002\u5408\u4f5c\u4e3a\u751f\u6210\u5f0f\u793e\u4f1a\u4eff\u771f\u548c\u9886\u57df\u6269\u5c55\u7684\u5165\u95e8\u5e73\u53f0\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22833", "impact_score": 5, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u4eff\u771f\u73af\u5883"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22833v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Minimal Local Simulation Foundations for LLM- and VLM-Driven Agents in 2D and 3D Environments", "tldr": "\u672c\u6587\u63d0\u51fa\u4e24\u4e2a\u9762\u5411\u6559\u80b2\u4e0e\u5feb\u901f\u539f\u578b\u7684\u6781\u7b80\u672c\u5730\u4eff\u771f\u57fa\u7840\uff1a2D \u591a\u667a\u80fd\u4f53\u73af\u5883\u652f\u6301\u672c\u5730 LLM \u667a\u80fd\u4f53\u79fb\u52a8\u3001\u4ea4\u6d41\u548c\u54cd\u5e94\u706b\u707e\u7b49\u7a7a\u95f4\u4e8b\u4ef6\uff0c3D \u6570\u5b57\u5b6a\u751f\u73af\u5883\u8ba9\u672c\u5730 VLM \u57fa\u4e8e\u7b2c\u4e00\u89c6\u89d2\u56fe\u50cf\u751f\u6210\u79fb\u52a8\u6307\u4ee4\u3002\u7cfb\u7edf\u5f3a\u8c03\u53ef\u5728\u666e\u901a\u7535\u8111\u4e0a\u672c\u5730\u8fd0\u884c\u3001\u6613\u4fee\u6539\uff0c\u9002\u5408\u4f5c\u4e3a\u751f\u6210\u5f0f\u793e\u4f1a\u4eff\u771f\u548c\u9886\u57df\u6269\u5c55\u7684\u5165\u95e8\u5e73\u53f0\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Deploying LLMs for enterprise Text-to-SQL is bottlenecked less by the model than by what context reaches it: business logic spans thousands of tables, and no model can ingest a full catalog at once. We argue that the most effective place to intervene is therefore the \\emph{knowledge-base context} the model consumes, and that this context should be \\emph{constructed} from historical usage rather than tuned for as a fixed input. Using a query-DAG decomposition--the same family of intermediates that enterprise benchmarks like BEAVER annotate, here recovered from production SQL--we compare the value of oracle query graphs versus retrieved knowledge-base context. In this ablation, retrieved knowledge-base context provides the largest marginal improvement when added to the full oracle graph. Building on this, we optimize a distillation procedure that turns historical query profiles into reusable SQL reference cards. On a benchmark of 5176 production queries from a major online retailer, optimizing these context artifacts yields larger gains (${\\sim}12$--$25\\%$ AST similarity) than optimizing the retrieval harness (${\\sim}3$--$12\\%$). On the public BEAVER benchmark, which lacks the production-usage signals available in our internal setting, the picture is more mixed: table cards alone perform about the same as raw historical SQL. The best optimized variant retrieves both cards and raw SQL, scoring $9.00\\%$ versus $6.33\\%$ (p-value $0.12$) for the comparable baseline on a held-out $N{=}300$ subset, using retrieved context and harness changes but no agentic loop.", "arxiv_id": "2608.22830", "arxiv_url": "https://arxiv.org/abs/2608.22830", "authors": ["Kate Gwimm", "Carson Eisenach"], "brief": "\u8bba\u6587\u63d0\u51fa\u4f01\u4e1a\u7ea7 Text-to-SQL \u7684\u5173\u952e\u74f6\u9888\u5728\u4e8e\u63d0\u4f9b\u7ed9\u5927\u6a21\u578b\u7684\u77e5\u8bc6\u5e93\u4e0a\u4e0b\u6587\uff0c\u800c\u975e\u5355\u7eaf\u6a21\u578b\u80fd\u529b\u6216\u68c0\u7d22\u6d41\u7a0b\u3002\u4f5c\u8005\u5229\u7528\u5386\u53f2 SQL \u67e5\u8be2\u6784\u5efa\u53ef\u590d\u7528\u7684 SQL \u53c2\u8003\u5361\uff0c\u5e76\u8fdb\u884c\u7aef\u5230\u7aef\u4f18\u5316\uff0c\u57285176\u6761\u751f\u4ea7\u67e5\u8be2\u4e0a\u5e26\u6765\u7ea612%\u523025%\u7684 AST \u76f8\u4f3c\u5ea6\u63d0\u5347\uff0c\u660e\u663e\u9ad8\u4e8e\u4ec5\u4f18\u5316\u68c0\u7d22\u6846\u67b6\u7684\u6536\u76ca\uff1b\u5728 BEAVER \u516c\u5171\u57fa\u51c6\u4e0a\u7ed3\u679c\u8f83\u6df7\u5408\u4f46\u6700\u4f73\u7ec4\u5408\u4ecd\u4f18\u4e8e\u57fa\u7ebf\u3002", "categories": ["cs.AI", "cs.LG"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22830", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["Text-to-SQL", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4e0a\u4e0b\u6587\u4f18\u5316", "\u77e5\u8bc6\u5e93"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22830v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Beyond the Harness: End-to-End Optimization of Context Artifacts for Enterprise Text-to-SQL", "tldr": "\u8bba\u6587\u63d0\u51fa\u4f01\u4e1a\u7ea7 Text-to-SQL \u7684\u5173\u952e\u74f6\u9888\u5728\u4e8e\u63d0\u4f9b\u7ed9\u5927\u6a21\u578b\u7684\u77e5\u8bc6\u5e93\u4e0a\u4e0b\u6587\uff0c\u800c\u975e\u5355\u7eaf\u6a21\u578b\u80fd\u529b\u6216\u68c0\u7d22\u6d41\u7a0b\u3002\u4f5c\u8005\u5229\u7528\u5386\u53f2 SQL \u67e5\u8be2\u6784\u5efa\u53ef\u590d\u7528\u7684 SQL \u53c2\u8003\u5361\uff0c\u5e76\u8fdb\u884c\u7aef\u5230\u7aef\u4f18\u5316\uff0c\u57285176\u6761\u751f\u4ea7\u67e5\u8be2\u4e0a\u5e26\u6765\u7ea612%\u523025%\u7684 AST \u76f8\u4f3c\u5ea6\u63d0\u5347\uff0c\u660e\u663e\u9ad8\u4e8e\u4ec5\u4f18\u5316\u68c0\u7d22\u6846\u67b6\u7684\u6536\u76ca\uff1b\u5728 BEAVER \u516c\u5171\u57fa\u51c6\u4e0a\u7ed3\u679c\u8f83\u6df7\u5408\u4f46\u6700\u4f73\u7ec4\u5408\u4ecd\u4f18\u4e8e\u57fa\u7ebf\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "As large language models (LLMs) continue to advance in coding capabilities, their potential in cybersecurity has drawn increasing research attention, with closed-source LLMs (e.g., Mythos) delivering advanced cybersecurity capabilities. However, existing open-source efforts remain limited: frontier open-weight models do not provide reproducible cybersecurity training solutions, open-source training solutions focus on isolated tasks and lack scalable agentic data, and scaling agentic rollouts requires strong domain priors. In this work, we introduce \\textbf{CyberFactory}, a unified open-source framework that connects data construction, trajectory synthesis, and model training across proof-of-concept (PoC) generation, vulnerability patching, and cybersecurity question answering (CyberQA). CyberFactory transforms public vulnerability artifacts, including CVEs from the wild, into executable and verifiable task instances. It further uses a reusable vulnerability-analysis skill to guide the teacher through source inspection, problem solving with domain prior, and evidence-based validation. The resulting supervision is agentic: the model interacts with tools and target environments and revises its solutions according to execution feedback. Using these trajectories, we train and release \\modelname\\footnote{\\emph{Aegis} is, in Greek mythology, the protective shield of Zeus and Athena; the name reflects the model\u0027s defensive, security-oriented purpose.}, which internalizes the skill-guided procedure without requiring the skill at inference time. On CyberGym, \\modelname reaches 52.4% Pass@1 under a one-hour budget, improving over its Qwen~3.5 base model by +22.8 points and outperforming the evaluated general-purpose backbones under the same scaffold.", "arxiv_id": "2608.23181", "arxiv_url": "https://arxiv.org/abs/2608.23181", "authors": ["Jian Yang", "Haau-Sing Li", "Shawn Guo", "Zixi Zhao", "Yibo Tan", "Jiajun Wu", "Aishan Liu", "Xianglong Liu", "Tianyu Zheng", "Bryan Dai", "Chengran Yang"], "brief": "CyberFactory \u662f\u4e00\u4e2a\u5f00\u6e90\u7f51\u7edc\u5b89\u5168\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u771f\u5b9e\u4e16\u754c CVE \u7b49\u6f0f\u6d1e\u6750\u6599\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u4efb\u52a1\uff0c\u5e76\u8986\u76d6 PoC \u751f\u6210\u3001\u6f0f\u6d1e\u4fee\u590d\u548c\u5b89\u5168\u95ee\u7b54\u3002\u5b83\u901a\u8fc7\u5e26\u5de5\u5177\u4ea4\u4e92\u4e0e\u6267\u884c\u53cd\u9988\u7684\u667a\u80fd\u4f53\u8f68\u8ff9\u8bad\u7ec3 Aegis \u6a21\u578b\uff0c\u5728 CyberGym \u4e0a\u8fbe\u5230 52.4% Pass@1\uff0c\u6bd4 Qwen 3.5 \u57fa\u5ea7\u63d0\u5347 22.8 \u4e2a\u767e\u5206\u70b9\u3002", "categories": ["cs.CR", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23181", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4ee3\u7801\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23181v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "CyberFactory: Scaling Cyber Security Capabilities with Instances from the Wild", "tldr": "CyberFactory \u662f\u4e00\u4e2a\u5f00\u6e90\u7f51\u7edc\u5b89\u5168\u8bad\u7ec3\u6846\u67b6\uff0c\u5c06\u771f\u5b9e\u4e16\u754c CVE \u7b49\u6f0f\u6d1e\u6750\u6599\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u9a8c\u8bc1\u4efb\u52a1\uff0c\u5e76\u8986\u76d6 PoC \u751f\u6210\u3001\u6f0f\u6d1e\u4fee\u590d\u548c\u5b89\u5168\u95ee\u7b54\u3002\u5b83\u901a\u8fc7\u5e26\u5de5\u5177\u4ea4\u4e92\u4e0e\u6267\u884c\u53cd\u9988\u7684\u667a\u80fd\u4f53\u8f68\u8ff9\u8bad\u7ec3 Aegis \u6a21\u578b\uff0c\u5728 CyberGym \u4e0a\u8fbe\u5230 52.4% Pass@1\uff0c\u6bd4 Qwen 3.5 \u57fa\u5ea7\u63d0\u5347 22.8 \u4e2a\u767e\u5206\u70b9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Developing competitive deep learning baselines for medical imaging remains a highly iterative process requiring literature review, implementation, experimentation, and expert refinement. Existing automation approaches typically optimize isolated components, such as architecture search or hyperparameter tuning, rather than the complete baseline development process. We present an agentic AI Scientist workflow that combines literature-guided reasoning, automated code generation, and hypothesis-driven experimentation to generate competitive baseline models for medical imaging challenges. The framework is evaluated on four public benchmarks spanning segmentation, classification, and detection. Across all tasks, the Experimentation Pipeline consistently improves validation performance, achieving competitive leaderboard results, including 6th place on both PUMA tracks (15 teams) and 31st place on MILK10k (125 teams). On MIDOG25, the resulting model also demonstrates strong domain generalization across scanners, tumor types, and species. Using the same workflow across all challenges without task-specific redesign, we demonstrate that skill-based, literature-guided agentic workflows can substantially reduce the engineering effort required to develop competitive medical imaging baselines.", "arxiv_id": "2608.23336", "arxiv_url": "https://arxiv.org/abs/2608.23336", "authors": ["Eugenia Moris", "Jos\u00e9 Ignacio Orlando"], "brief": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u533b\u5b66\u5f71\u50cf\u6a21\u578b\u5f00\u53d1\u7684\u667a\u80fd\u4f53\u5f0f AI Scientist \u5de5\u4f5c\u6d41\uff0c\u5c06\u6587\u732e\u5f15\u5bfc\u63a8\u7406\u3001\u81ea\u52a8\u4ee3\u7801\u751f\u6210\u548c\u5047\u8bbe\u9a71\u52a8\u5b9e\u9a8c\u7ed3\u5408\u8d77\u6765\uff0c\u81ea\u52a8\u6784\u5efa\u6709\u7ade\u4e89\u529b\u7684\u6df1\u5ea6\u5b66\u4e60\u57fa\u7ebf\u3002\u8be5\u65b9\u6cd5\u5728\u5206\u5272\u3001\u5206\u7c7b\u548c\u68c0\u6d4b\u7b494\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u6301\u7eed\u63d0\u5347\u9a8c\u8bc1\u6027\u80fd\uff0c\u5e76\u5728\u591a\u4e2a\u6392\u884c\u699c\u53d6\u5f97\u8f83\u597d\u540d\u6b21\uff0c\u540c\u65f6\u663e\u793a\u51fa\u4e00\u5b9a\u8de8\u57df\u6cdb\u5316\u80fd\u529b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23336", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u533b\u5b66\u5f71\u50cf", "\u81ea\u52a8\u673a\u5668\u5b66\u4e60", "\u6df1\u5ea6\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23336v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Can Coding Agents Build Robust Baselines? A Skill-Based Approach for Automating the Medical Imaging Model-Development Pipeline", "tldr": "\u672c\u6587\u63d0\u51fa\u4e00\u79cd\u9762\u5411\u533b\u5b66\u5f71\u50cf\u6a21\u578b\u5f00\u53d1\u7684\u667a\u80fd\u4f53\u5f0f AI Scientist \u5de5\u4f5c\u6d41\uff0c\u5c06\u6587\u732e\u5f15\u5bfc\u63a8\u7406\u3001\u81ea\u52a8\u4ee3\u7801\u751f\u6210\u548c\u5047\u8bbe\u9a71\u52a8\u5b9e\u9a8c\u7ed3\u5408\u8d77\u6765\uff0c\u81ea\u52a8\u6784\u5efa\u6709\u7ade\u4e89\u529b\u7684\u6df1\u5ea6\u5b66\u4e60\u57fa\u7ebf\u3002\u8be5\u65b9\u6cd5\u5728\u5206\u5272\u3001\u5206\u7c7b\u548c\u68c0\u6d4b\u7b494\u4e2a\u516c\u5f00\u57fa\u51c6\u4e0a\u6301\u7eed\u63d0\u5347\u9a8c\u8bc1\u6027\u80fd\uff0c\u5e76\u5728\u591a\u4e2a\u6392\u884c\u699c\u53d6\u5f97\u8f83\u597d\u540d\u6b21\uff0c\u540c\u65f6\u663e\u793a\u51fa\u4e00\u5b9a\u8de8\u57df\u6cdb\u5316\u80fd\u529b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Frontier multimodal large language models (MLLMs) deliver impressive perception yet still falter on scientific and mathematical reasoning. Parameter-level adaptation is unavailable for closed-weight or on-device backbones, and stateless prompting forfeits any compounding benefit from problems already solved. We propose \\textbf{DG-Mem}, a dual-grained agentic memory framework that augments a frozen MLLM with a non-parametric, externally stored memory built once from training-time rollouts and consulted read-only at test time. Motivated by the Complementary Learning Systems (CLS) account of human memory, DG-Mem factors its store into an instance-grounded exemplar memory and a category-level schema memory of IF-THEN rules, with a transient reflection store mediating their construction so that schemas are synthesized only from abstract reflections, never from exemplar text. Two design choices distinguish DG-Mem: an online concept categorizer that grows the category space incrementally during training rather than committing to a predefined taxonomy, and a Shapley context attribution procedure that decomposes correctness across the entire retrieved rule set and yields a per-rule utility that re-weights retrieval at test time. The pipeline introduces no gradient updates and is deployable on closed-weight or on-device backbones. Across MathVista, MMMU, and MMMU-Pro on four open-weight and proprietary backbones (Qwen3.5-27B, Qwen3.5-122B-A10B, GPT-5-Nano, Gemini-3-Flash), DG-Mem improves consistently over no-memory and competitive memory baselines.", "arxiv_id": "2608.23268", "arxiv_url": "https://arxiv.org/abs/2608.23268", "authors": ["Jieke Wang", "Tiancheng Shen", "Yibo Yang", "Ming-Hsuan Yang"], "brief": "\u672c\u6587\u63d0\u51fa DG-Mem\uff0c\u4e3a\u51bb\u7ed3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u6784\u5efa\u5916\u90e8\u53cc\u7c92\u5ea6\u8bb0\u5fc6\uff1a\u5b9e\u4f8b\u6837\u4f8b\u8bb0\u5fc6\u4e0e\u7c7b\u522b\u7ea7 IF-THEN \u89c4\u5219\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u53cd\u601d\u5b58\u50a8\u751f\u6210\u89c4\u5219\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u5728\u7ebf\u6982\u5ff5\u5206\u7c7b\u548c Shapley \u4e0a\u4e0b\u6587\u5f52\u56e0\u6765\u8bc4\u4f30\u89c4\u5219\u6548\u7528\uff0c\u5728 MathVista\u3001MMMU\u3001MMMU-Pro \u4e0a\u76f8\u5bf9\u65e0\u8bb0\u5fc6\u548c\u73b0\u6709\u8bb0\u5fc6\u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347\uff0c\u4e14\u65e0\u9700\u68af\u5ea6\u66f4\u65b0\uff0c\u9002\u5408\u95ed\u6e90\u6216\u7aef\u4fa7\u6a21\u578b\u3002", "categories": ["cs.CV"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23268", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u591a\u6a21\u6001", "\u8bb0\u5fc6\u673a\u5236", "\u4e0a\u4e0b\u6587\u5f52\u56e0"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23268v1", "published_at": "2026-08-24", "score": 0.15, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173"], "thumbnail": null, "title": "Dual-Grained Agent Memory and Shapley Context Attribution for Multimodal Agentic Learner", "tldr": "\u672c\u6587\u63d0\u51fa DG-Mem\uff0c\u4e3a\u51bb\u7ed3\u7684\u591a\u6a21\u6001\u5927\u6a21\u578b\u6784\u5efa\u5916\u90e8\u53cc\u7c92\u5ea6\u8bb0\u5fc6\uff1a\u5b9e\u4f8b\u6837\u4f8b\u8bb0\u5fc6\u4e0e\u7c7b\u522b\u7ea7 IF-THEN \u89c4\u5219\u8bb0\u5fc6\uff0c\u5e76\u901a\u8fc7\u53cd\u601d\u5b58\u50a8\u751f\u6210\u89c4\u5219\u3002\u65b9\u6cd5\u8fd8\u5f15\u5165\u5728\u7ebf\u6982\u5ff5\u5206\u7c7b\u548c Shapley \u4e0a\u4e0b\u6587\u5f52\u56e0\u6765\u8bc4\u4f30\u89c4\u5219\u6548\u7528\uff0c\u5728 MathVista\u3001MMMU\u3001MMMU-Pro \u4e0a\u76f8\u5bf9\u65e0\u8bb0\u5fc6\u548c\u73b0\u6709\u8bb0\u5fc6\u57fa\u7ebf\u7a33\u5b9a\u63d0\u5347\uff0c\u4e14\u65e0\u9700\u68af\u5ea6\u66f4\u65b0\uff0c\u9002\u5408\u95ed\u6e90\u6216\u7aef\u4fa7\u6a21\u578b\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Group-based reinforcement learning methods such as GRPO for large language models avoid training a critic by sampling multiple responses for each prompt. A reliable critic could instead estimate token-level advantages from one response, but standard critic-based training recipes are often unstable. We study this instability and develop \\textbf{Best-Practice Critic Optimization (BPCO)}, a recipe that combines DPPO, value predictions bounded to the reward range, Monte Carlo value targets, unnormalized policy advantages, and length-adaptive generalized advantage estimation. Because the critic is used only during training, BPCO can also condition it on reward-defining information, such as a reference answer or grading rubric, that is hidden from the policy. Controlled experiments isolate the effect of each design choice. Across mathematical reasoning tasks with models ranging from 1.5B parameters to 30B-A3B mixtures of experts, BPCO improves a strong critic-based baseline consistently, and matches or exceeds a group-based baseline while sampling one response per prompt. The same recipe also improves learning with rubric-based rewards. These results show that a carefully designed critic provides a reliable alternative to group-relative advantage estimation. Code is available at https://github.com/QPHutu/golden_critic", "arxiv_id": "2608.23566", "arxiv_url": "https://arxiv.org/abs/2608.23566", "authors": ["Penghui Qi", "Xiangxin Zhou", "Wee Sun Lee"], "brief": "\u8bba\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d critic \u8bad\u7ec3\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\uff0c\u63d0\u51fa Best-Practice Critic Optimization\uff08BPCO\uff09\uff0c\u7ed3\u5408\u6709\u754c\u4ef7\u503c\u9884\u6d4b\u3001\u8499\u7279\u5361\u6d1b\u4ef7\u503c\u76ee\u6807\u3001\u672a\u5f52\u4e00\u5316\u4f18\u52bf\u548c\u957f\u5ea6\u81ea\u9002\u5e94 GAE \u7b49\u8bbe\u8ba1\u3002\u5b9e\u9a8c\u663e\u793a BPCO \u5728\u6570\u5b66\u63a8\u7406\u548c\u57fa\u4e8e\u8bc4\u5206\u89c4\u5219\u7684\u5956\u52b1\u4efb\u52a1\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u5f3a critic \u57fa\u7ebf\uff0c\u5e76\u53ef\u5728\u6bcf\u4e2a\u63d0\u793a\u53ea\u91c7\u6837\u4e00\u4e2a\u56de\u7b54\u65f6\u5339\u914d\u6216\u8d85\u8fc7\u7ec4\u76f8\u5bf9\u65b9\u6cd5\u3002", "categories": ["cs.LG", "cs.AI", "cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23566", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u5f3a\u5316\u5b66\u4e60", "\u5927\u8bed\u8a00\u6a21\u578b", "\u4ef7\u503c\u51fd\u6570", "\u6570\u5b66\u63a8\u7406"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23566v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How to Train a Critic Stably and Efficiently", "tldr": "\u8bba\u6587\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5f3a\u5316\u5b66\u4e60\u4e2d critic \u8bad\u7ec3\u4e0d\u7a33\u5b9a\u7684\u95ee\u9898\uff0c\u63d0\u51fa Best-Practice Critic Optimization\uff08BPCO\uff09\uff0c\u7ed3\u5408\u6709\u754c\u4ef7\u503c\u9884\u6d4b\u3001\u8499\u7279\u5361\u6d1b\u4ef7\u503c\u76ee\u6807\u3001\u672a\u5f52\u4e00\u5316\u4f18\u52bf\u548c\u957f\u5ea6\u81ea\u9002\u5e94 GAE \u7b49\u8bbe\u8ba1\u3002\u5b9e\u9a8c\u663e\u793a BPCO \u5728\u6570\u5b66\u63a8\u7406\u548c\u57fa\u4e8e\u8bc4\u5206\u89c4\u5219\u7684\u5956\u52b1\u4efb\u52a1\u4e0a\u7a33\u5b9a\u4f18\u4e8e\u5f3a critic \u57fa\u7ebf\uff0c\u5e76\u53ef\u5728\u6bcf\u4e2a\u63d0\u793a\u53ea\u91c7\u6837\u4e00\u4e2a\u56de\u7b54\u65f6\u5339\u914d\u6216\u8d85\u8fc7\u7ec4\u76f8\u5bf9\u65b9\u6cd5\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "An interactive world model must follow the user\u0027s actions, remember the places it has shown, and stream in real time. The tension is structural: control wants a short horizon, memory wants an unbounded one. ReWorld separates the two during training and bounds them at inference. Mixed per-head attention windows confine most heads to the recent past while a small set of global heads attends over the entire history, and random head routing keeps either capability from binding to particular heads; random chunk dropping makes sparse histories in-distribution. At inference the whole past lives under a fixed budget: a bounded KV cache backed by a pose-indexed landmark bank, from which the model retrieves the landmarks nearest the current pose. A metric-scale-aligned data engine places eight sources -- Unreal-rendered fly-throughs, game roaming, and real-world footage -- on one physical action scale, so the same key press moves the camera the same distance in every source, and palindrome trajectories supply the revisit evidence that memory training needs. Distribution-matching distillation confined to a LoRA adapter then compresses sampling to four steps: one backbone serves both a high-fidelity multi-step mode and a real-time interactive one, streaming 704x1280 video across photorealistic, game-style, and stylized worlds. Under a three-axis protocol covering action following, long-horizon recall, and video quality, against six recent interactive world models it attains the best control fidelity ($11.95^\\circ$ rotation error and the best camera-motion consistency) and the best generation quality; and on minute-long out-and-back rollouts ($64$\\,s, $384$ latents), its fixed 12-chunk cache still regenerates the starting view -- at rollout lengths where a sliding window has long evicted the evidence and full-KV attention runs out of memory.", "arxiv_id": "2608.23565", "arxiv_url": "https://arxiv.org/abs/2608.23565", "authors": ["Zhifei Chen", "Luozhou Wang", "Guibao Shen", "Dongyu Yan", "Shuai Yang", "Tianshuo Xu", "Yihua Du", "Wei Wang", "Tianyi Gui", "Lianghua Huang", "Yingcong Chen"], "brief": "ReWorld \u63d0\u51fa\u4e00\u79cd\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u77ed\u671f\u52a8\u4f5c\u63a7\u5236\u4e0e\u957f\u671f\u8bb0\u5fc6\u89e3\u8026\u8bad\u7ec3\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u7528\u6709\u754c KV \u7f13\u5b58\u548c\u57fa\u4e8e\u4f4d\u59ff\u68c0\u7d22\u7684\u5730\u6807\u5e93\u5b9e\u73b0\u56fa\u5b9a\u9884\u7b97\u7684\u957f\u7a0b\u56de\u5fc6\u3002\u5b83\u80fd\u5b9e\u65f6\u751f\u6210 704x1280 \u89c6\u9891\uff0c\u5728\u52a8\u4f5c\u8ddf\u968f\u3001\u957f\u65f6\u56de\u8bbf\u8bb0\u5fc6\u548c\u753b\u8d28\u4e0a\u4f18\u4e8e\u516d\u4e2a\u8fd1\u671f\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u53ef\u5728\u5206\u949f\u7ea7\u5f80\u8fd4\u8f68\u8ff9\u4e2d\u6062\u590d\u8d77\u70b9\u89c6\u56fe\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23565", "impact_score": 8, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u957f\u7a0b\u8bb0\u5fc6", "\u89c6\u9891\u751f\u6210", "\u4ea4\u4e92\u5f0f\u751f\u6210"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23565v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ReWorld: An Interactive World Model with Long-Horizon Memory", "tldr": "ReWorld \u63d0\u51fa\u4e00\u79cd\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5c06\u77ed\u671f\u52a8\u4f5c\u63a7\u5236\u4e0e\u957f\u671f\u8bb0\u5fc6\u89e3\u8026\u8bad\u7ec3\uff0c\u5e76\u5728\u63a8\u7406\u65f6\u7528\u6709\u754c KV \u7f13\u5b58\u548c\u57fa\u4e8e\u4f4d\u59ff\u68c0\u7d22\u7684\u5730\u6807\u5e93\u5b9e\u73b0\u56fa\u5b9a\u9884\u7b97\u7684\u957f\u7a0b\u56de\u5fc6\u3002\u5b83\u80fd\u5b9e\u65f6\u751f\u6210 704x1280 \u89c6\u9891\uff0c\u5728\u52a8\u4f5c\u8ddf\u968f\u3001\u957f\u65f6\u56de\u8bbf\u8bb0\u5fc6\u548c\u753b\u8d28\u4e0a\u4f18\u4e8e\u516d\u4e2a\u8fd1\u671f\u4ea4\u4e92\u5f0f\u4e16\u754c\u6a21\u578b\uff0c\u5e76\u53ef\u5728\u5206\u949f\u7ea7\u5f80\u8fd4\u8f68\u8ff9\u4e2d\u6062\u590d\u8d77\u70b9\u89c6\u56fe\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Road traffic injuries remain a major challenge in low- and middle-income countries, where proactive road safety auditing is limited by incomplete crash records, shortages of qualified auditors, and the high cost of large-scale field inspections. To address this problem, we propose Expert-Grounded Distillation (EGD), a novel artificial intelligence framework that transfers institutional road safety expertise into a compact vision-language model for scalable visual road safety auditing. The key innovation is a quantified expert-grounding stage in which the teacher vision-language model is calibrated against authoritative field audits. Large-scale annotation is permitted only after the teacher reaches substantial agreement with expert risk assessments (Cohen\u0027s kappa = 0.74). The calibrated teacher then generates structured supervision that is distilled into an 8-billion-parameter student vision-language model using Low-Rank Adaptation and a single leakage-free prompt. We also introduce Bangladesh Road Safety Audit (BD-ARSA), the first open, expert-grounded Bangladeshi visual road safety audit dataset containing 21,947 image-audit records with near-national coverage, and Expert-Grounded Road Safety Auditor (EG-ARSA), the first vision-language model developed specifically for this task. Experimental results show that grounded fine-tuning substantially improves ordinal risk assessment over the zero-shot baseline, while blind expert evaluation demonstrates that the compact student outperforms both its 31 billion-parameter teacher and Gemini-2.5-Flash. These findings demonstrate that EGD provides an effective and scalable engineering solution for proactive road safety auditing in resource-constrained environments.", "arxiv_id": "2608.23563", "arxiv_url": "https://arxiv.org/abs/2608.23563", "authors": ["Md Thamed Bin Zaman Chowdhury", "Moazzem Hossain"], "brief": "\u8bba\u6587\u63d0\u51fa\u4e13\u5bb6\u624e\u6839\u84b8\u998f\u6846\u67b6 EGD\uff0c\u5c06\u6743\u5a01\u9053\u8def\u5b89\u5168\u5ba1\u8ba1\u77e5\u8bc6\u6821\u51c6\u5230\u6559\u5e08\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u518d\u84b8\u998f\u5230 8B \u5b66\u751f\u6a21\u578b\uff0c\u7528\u4e8e\u4f4e\u8d44\u6e90\u5730\u533a\u7684\u5927\u89c4\u6a21\u89c6\u89c9\u9053\u8def\u5b89\u5168\u5ba1\u8ba1\u3002\u4f5c\u8005\u53d1\u5e03\u5b5f\u52a0\u62c9 BD-ARSA \u6570\u636e\u96c6\uff0c\u5e76\u8868\u660e\u5fae\u8c03\u540e\u7684 EG-ARSA \u5728\u98ce\u9669\u7b49\u7ea7\u8bc4\u4f30\u4e0a\u4f18\u4e8e\u96f6\u6837\u672c\u57fa\u7ebf\u300131B \u6559\u5e08\u6a21\u578b\u548c Gemini-2.5-Flash\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23563", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u89c6\u89c9\u8bed\u8a00\u6a21\u578b", "\u77e5\u8bc6\u84b8\u998f", "\u9053\u8def\u5b89\u5168", "\u4f4e\u8d44\u6e90"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23563v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "EG-ARSA: An Expert-Grounded Open Model for Visual Road Safety Auditing in Low-Resource Settings", "tldr": "\u8bba\u6587\u63d0\u51fa\u4e13\u5bb6\u624e\u6839\u84b8\u998f\u6846\u67b6 EGD\uff0c\u5c06\u6743\u5a01\u9053\u8def\u5b89\u5168\u5ba1\u8ba1\u77e5\u8bc6\u6821\u51c6\u5230\u6559\u5e08\u89c6\u89c9\u8bed\u8a00\u6a21\u578b\uff0c\u518d\u84b8\u998f\u5230 8B \u5b66\u751f\u6a21\u578b\uff0c\u7528\u4e8e\u4f4e\u8d44\u6e90\u5730\u533a\u7684\u5927\u89c4\u6a21\u89c6\u89c9\u9053\u8def\u5b89\u5168\u5ba1\u8ba1\u3002\u4f5c\u8005\u53d1\u5e03\u5b5f\u52a0\u62c9 BD-ARSA \u6570\u636e\u96c6\uff0c\u5e76\u8868\u660e\u5fae\u8c03\u540e\u7684 EG-ARSA \u5728\u98ce\u9669\u7b49\u7ea7\u8bc4\u4f30\u4e0a\u4f18\u4e8e\u96f6\u6837\u672c\u57fa\u7ebf\u300131B \u6559\u5e08\u6a21\u578b\u548c Gemini-2.5-Flash\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Ballistocardiography (BCG) is promising for unobtrusive long-term blood pressure (BP) monitoring in laboratory settings, but traditional BCG signals are vulnerable to the variations in body-bed interaction with shifted fiducial points in temporal or amplitude axis, and BP varies with personal hemodynamic changes, causing misaligned representations that affect model generalizability and robustness. In this work, we propose a non-invasive BP estimation framework, Phy-BP, based on triaxial bodyseismography (BSG) as an extension of BCG. Firstly, an adaptive quality-control algorithm is designed to select BSG segments enriched with cardiogenic components by jointly considering neighboring beat patterns and universal cardiogenic templates. Furthermore, a physical model is established to describe 3D wave propagation in the body-bed system and is subsequently embedded into the deep learning model to characterize the intrinsic coupling among triaxial BSG signals driven by a single cardiogenic excitation. Thus, multi-axis features are aligned during model training, improving robustness against distortions in real scenarios. Experiments on a 162-hour hospital dataset collected from 21 subjects reveal that the proposed Phy-BP can dynamically filter out low-quality measurements, and the deep learning model training is constrained by physical consistency across different axes to provide faithful BP monitoring, especially when training samples are limited.", "arxiv_id": "2608.23562", "arxiv_url": "https://arxiv.org/abs/2608.23562", "authors": ["Yuanyuan Zhang", "Yida Zhang", "Jiahui Li", "Yuyan Wu", "Fei Dou", "Xiao Yin", "Zhenlin An", "Hae Young Noh", "Wenzhan Song"], "brief": "\u672c\u6587\u63d0\u51fa Phy-BP\uff0c\u7528\u4e09\u8f74\u4f53\u9707\u56fe\uff08BSG\uff09\u8fdb\u884c\u65e0\u63a5\u89e6\u8840\u538b\u76d1\u6d4b\uff0c\u5e76\u901a\u8fc7\u81ea\u9002\u5e94\u8d28\u91cf\u63a7\u5236\u7b5b\u9009\u542b\u5fc3\u6e90\u6210\u5206\u7684\u9ad8\u8d28\u91cf\u7247\u6bb5\u3002\u65b9\u6cd5\u5c06\u4eba\u4f53-\u5e8a\u7cfb\u7edf\u4e2d\u7684\u4e09\u7ef4\u6ce2\u4f20\u64ad\u7269\u7406\u6a21\u578b\u5d4c\u5165\u6df1\u5ea6\u5b66\u4e60\uff0c\u7ea6\u675f\u4e09\u8f74\u4fe1\u53f7\u7684\u4e00\u81f4\u6027\uff0c\u572821\u540d\u53d7\u8bd5\u8005162\u5c0f\u65f6\u533b\u9662\u6570\u636e\u4e0a\u63d0\u5347\u4e86\u4f4e\u6837\u672c\u573a\u666f\u4e0b\u7684\u9c81\u68d2\u6027\u4e0e\u8840\u538b\u4f30\u8ba1\u53ef\u9760\u6027\u3002", "categories": ["eess.SP", "cs.AI", "physics.bio-ph"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23562", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u751f\u7406\u4fe1\u53f7", "\u6df1\u5ea6\u5b66\u4e60", "\u8840\u538b\u76d1\u6d4b", "\u7269\u7406\u7ea6\u675f"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23562v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Physics-Constrained Deep Learning Model for Contactless Blood Pressure Monitoring from Triaxial Bodyseismography", "tldr": "\u672c\u6587\u63d0\u51fa Phy-BP\uff0c\u7528\u4e09\u8f74\u4f53\u9707\u56fe\uff08BSG\uff09\u8fdb\u884c\u65e0\u63a5\u89e6\u8840\u538b\u76d1\u6d4b\uff0c\u5e76\u901a\u8fc7\u81ea\u9002\u5e94\u8d28\u91cf\u63a7\u5236\u7b5b\u9009\u542b\u5fc3\u6e90\u6210\u5206\u7684\u9ad8\u8d28\u91cf\u7247\u6bb5\u3002\u65b9\u6cd5\u5c06\u4eba\u4f53-\u5e8a\u7cfb\u7edf\u4e2d\u7684\u4e09\u7ef4\u6ce2\u4f20\u64ad\u7269\u7406\u6a21\u578b\u5d4c\u5165\u6df1\u5ea6\u5b66\u4e60\uff0c\u7ea6\u675f\u4e09\u8f74\u4fe1\u53f7\u7684\u4e00\u81f4\u6027\uff0c\u572821\u540d\u53d7\u8bd5\u8005162\u5c0f\u65f6\u533b\u9662\u6570\u636e\u4e0a\u63d0\u5347\u4e86\u4f4e\u6837\u672c\u573a\u666f\u4e0b\u7684\u9c81\u68d2\u6027\u4e0e\u8840\u538b\u4f30\u8ba1\u53ef\u9760\u6027\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Language models are sequential processors, but long-horizon agency requires external information and computation beyond model weights and active context. Prime Agent is an open-source harness for long-horizon evaluation and coding-agent workflows. A persistent IPython REPL follows the Recursive Language Model abstraction for programmatic context processing and test-time compute, while Continual Harness preserves histories, memories, skills, prompts, and subagent specifications across trajectories. Recursive subagents coordinate through direct agent-to-agent communication, and the Agents View lets humans inspect and manage daemon-backed sessions. Prime Agent standardizes execution, recovery, verification, and resource accounting while leaving strategy construction to the model. This low-friction, expressive membrane prevents harness failures from becoming model failures and pushes measurement toward the model\u0027s true maximal underlying capability. Prime Agent raises ARC-AGI-3 RHAE Best@1 from 30% to 95.5% and matches or exceeds native and popular harnesses across long-context coding, GPU-kernel generation, emulator construction, and autonomous nanoGPT speedruns. On Factorio, we find refinement allows for continuous technology progression and dedicated subagents enable parallelized work. Code is available at https://github.com/PrimeIntellect-ai/prime-agent.", "arxiv_id": "2608.23552", "arxiv_url": "https://arxiv.org/abs/2608.23552", "authors": ["Seth Karten", "Alex L. Zhang", "Kevin Thomas", "Sebastian M\u00fcller", "Elie Bakouch", "Daniel Auras", "Mika Senghaas", "Fares Obeid", "Konstantin Dunas", "Johannes Hagemann", "Sami Jaghouar"], "brief": "Prime Agent \u63d0\u51fa\u4e00\u4e2a\u5f00\u6e90\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e0e\u7f16\u7801\u5de5\u4f5c\u6d41\u6846\u67b6\uff0c\u901a\u8fc7\u6301\u4e45\u5316 IPython REPL\u3001\u8fde\u7eed\u8bb0\u5fc6/\u6280\u80fd\u4fdd\u5b58\u3001\u9012\u5f52\u5b50\u667a\u80fd\u4f53\u901a\u4fe1\u548c\u4f1a\u8bdd\u7ba1\u7406\u6765\u652f\u6301\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u4e0e\u957f\u671f\u4efb\u52a1\u6267\u884c\u3002\u5b83\u5728 ARC-AGI-3 RHAE Best@1 \u4e0a\u4ece 30% \u63d0\u5347\u5230 95.5%\uff0c\u5e76\u5728\u957f\u4e0a\u4e0b\u6587\u7f16\u7801\u3001GPU kernel \u751f\u6210\u3001\u6a21\u62df\u5668\u6784\u5efa\u548c\u81ea\u4e3b nanoGPT \u52a0\u901f\u7b49\u4efb\u52a1\u4e2d\u8fbe\u5230\u6216\u8d85\u8fc7\u73b0\u6709\u6846\u67b6\u3002", "categories": ["cs.AI", "cs.CL", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23552", "impact_score": 8, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u4ee3\u7801\u751f\u6210", "\u957f\u7a0b\u4efb\u52a1", "\u6d4b\u8bd5\u65f6\u8ba1\u7b97"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23552v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Prime Agent: A Self-Improving RLM Harness", "tldr": "Prime Agent \u63d0\u51fa\u4e00\u4e2a\u5f00\u6e90\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u8bc4\u6d4b\u4e0e\u7f16\u7801\u5de5\u4f5c\u6d41\u6846\u67b6\uff0c\u901a\u8fc7\u6301\u4e45\u5316 IPython REPL\u3001\u8fde\u7eed\u8bb0\u5fc6/\u6280\u80fd\u4fdd\u5b58\u3001\u9012\u5f52\u5b50\u667a\u80fd\u4f53\u901a\u4fe1\u548c\u4f1a\u8bdd\u7ba1\u7406\u6765\u652f\u6301\u6d4b\u8bd5\u65f6\u8ba1\u7b97\u4e0e\u957f\u671f\u4efb\u52a1\u6267\u884c\u3002\u5b83\u5728 ARC-AGI-3 RHAE Best@1 \u4e0a\u4ece 30% \u63d0\u5347\u5230 95.5%\uff0c\u5e76\u5728\u957f\u4e0a\u4e0b\u6587\u7f16\u7801\u3001GPU kernel \u751f\u6210\u3001\u6a21\u62df\u5668\u6784\u5efa\u548c\u81ea\u4e3b nanoGPT \u52a0\u901f\u7b49\u4efb\u52a1\u4e2d\u8fbe\u5230\u6216\u8d85\u8fc7\u73b0\u6709\u6846\u67b6\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Recent advances in continuous diffusion and flow-based language models (LMs) have achieved performance competitive with discrete LMs. However, existing continuous frameworks still rely on decoders supervised with cross entropy (CE) because the flow trajectories are not guaranteed to terminate at valid token embeddings. Motivated by this limitation, we introduce \\textbf{ConvergeFlow}, an embedding-space flow-based LM, which constrains the data predictor to the convex hull of token embeddings and trains it solely with the mean squared error objective induced by flow matching. Under suitable regularity conditions, we prove that the resulting flow converges to valid token embeddings despite errors in the data predictor, enabling direct token prediction without a CE-supervised decoder. We further develop three sampling mechanisms for controlling the trade-off between the generative perplexity and entropy. Experiments on OpenWebText demonstrate that ConvergeFlow achieves performance competitive with existing continuous and discrete diffusion LMs. These findings demonstrate the potential of the flow-based paradigm for language modeling. Our code is available at https://github.com/Na-Li66/ConvergeFlow.", "arxiv_id": "2608.23551", "arxiv_url": "https://arxiv.org/abs/2608.23551", "authors": ["Na Li", "Yuchen Jiao", "Changxiao Cai", "Gen Li"], "brief": "ConvergeFlow \u63d0\u51fa\u4e00\u79cd\u5d4c\u5165\u7a7a\u95f4\u7684\u6d41\u5f0f\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u6570\u636e\u9884\u6d4b\u5668\u7ea6\u675f\u5728\u8bcd\u5d4c\u5165\u51f8\u5305\u5185\uff0c\u5e76\u4ec5\u7528\u6d41\u5339\u914d\u8bf1\u5bfc\u7684\u5747\u65b9\u8bef\u5dee\u8bad\u7ec3\uff0c\u907f\u514d\u4f9d\u8d56\u4ea4\u53c9\u71b5\u76d1\u7763\u89e3\u7801\u5668\u3002\u7406\u8bba\u4e0a\u8bc1\u660e\u5176\u6d41\u8f68\u8ff9\u53ef\u6536\u655b\u5230\u6709\u6548\u8bcd\u5d4c\u5165\uff0c\u5b9e\u9a8c\u5728 OpenWebText \u4e0a\u8fbe\u5230\u4e0e\u73b0\u6709\u8fde\u7eed/\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u76f8\u8fd1\u7684\u6027\u80fd\uff0c\u5e76\u63d0\u4f9b\u53ef\u8c03\u56f0\u60d1\u5ea6\u4e0e\u71b5\u7684\u91c7\u6837\u673a\u5236\u3002", "categories": ["cs.CL", "cs.AI", "cs.LG", "stat.ML"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23551", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u8bed\u8a00\u6a21\u578b", "\u6d41\u5339\u914d", "\u6269\u6563\u6a21\u578b", "\u8bcd\u5d4c\u5165"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23551v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "ConvergeFlow: Language Flow with Provable Convergence to Token Embeddings", "tldr": "ConvergeFlow \u63d0\u51fa\u4e00\u79cd\u5d4c\u5165\u7a7a\u95f4\u7684\u6d41\u5f0f\u8bed\u8a00\u6a21\u578b\uff0c\u5c06\u6570\u636e\u9884\u6d4b\u5668\u7ea6\u675f\u5728\u8bcd\u5d4c\u5165\u51f8\u5305\u5185\uff0c\u5e76\u4ec5\u7528\u6d41\u5339\u914d\u8bf1\u5bfc\u7684\u5747\u65b9\u8bef\u5dee\u8bad\u7ec3\uff0c\u907f\u514d\u4f9d\u8d56\u4ea4\u53c9\u71b5\u76d1\u7763\u89e3\u7801\u5668\u3002\u7406\u8bba\u4e0a\u8bc1\u660e\u5176\u6d41\u8f68\u8ff9\u53ef\u6536\u655b\u5230\u6709\u6548\u8bcd\u5d4c\u5165\uff0c\u5b9e\u9a8c\u5728 OpenWebText \u4e0a\u8fbe\u5230\u4e0e\u73b0\u6709\u8fde\u7eed/\u79bb\u6563\u6269\u6563\u8bed\u8a00\u6a21\u578b\u76f8\u8fd1\u7684\u6027\u80fd\uff0c\u5e76\u63d0\u4f9b\u53ef\u8c03\u56f0\u60d1\u5ea6\u4e0e\u71b5\u7684\u91c7\u6837\u673a\u5236\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "While AI assistance can improve human task performance in the short term, it may also undermine the development of skills in the longer term. We examine this tension in a controlled logic-puzzle experiment involving on-demand AI assistance, where participants complete tasks before, during, and after AI is available. By experimentally varying AI request costs, we find that lower-cost assistance induces more frequent AI use. We also find that participants who request AI assistance during the AI-access phase perform worse at the task after assistance is removed, and their subsequent unassisted performance is overestimated when predicted from earlier AI-assisted performance. We use a Bayesian latent ability model to separate initial ability, post-AI ability, and participant-specific skill change, while estimating how independent reasoning during the AI-access phase relates to skill development. The results show that greater independent problem-solving effort is associated with larger gains in latent ability, consistent with the interpretation that skill development is weaker when AI assistance substitutes for independent reasoning.", "arxiv_id": "2608.23543", "arxiv_url": "https://arxiv.org/abs/2608.23543", "authors": ["Shang Wu", "Catarina G Belem", "Shuyuan Fu", "Mark Steyvers", "Padhraic Smyth"], "brief": "\u672c\u6587\u901a\u8fc7\u903b\u8f91\u8c1c\u9898\u5b9e\u9a8c\u7814\u7a76\u6309\u9700 AI \u8f85\u52a9\u5bf9\u4eba\u7c7b\u6280\u80fd\u53d1\u5c55\u7684\u5f71\u54cd\uff0c\u53d1\u73b0\u964d\u4f4e\u8bf7\u6c42\u6210\u672c\u4f1a\u663e\u8457\u589e\u52a0 AI \u4f7f\u7528\u9891\u7387\u3002\u4f7f\u7528\u8fc7 AI \u8f85\u52a9\u7684\u53c2\u4e0e\u8005\u5728\u79fb\u9664\u8f85\u52a9\u540e\u8868\u73b0\u66f4\u5dee\uff0c\u4e14\u57fa\u4e8e\u5176\u8f85\u52a9\u9636\u6bb5\u8868\u73b0\u4f1a\u9ad8\u4f30\u5176\u771f\u5b9e\u72ec\u7acb\u80fd\u529b\uff1b\u8d1d\u53f6\u65af\u6f5c\u5728\u80fd\u529b\u6a21\u578b\u663e\u793a\uff0c\u66f4\u591a\u72ec\u7acb\u63a8\u7406\u4e0e\u66f4\u5927\u7684\u80fd\u529b\u63d0\u5347\u76f8\u5173\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23543", "impact_score": 6, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u673a\u534f\u4f5c", "\u6280\u80fd\u5b66\u4e60", "AI\u8f85\u52a9", "\u8d1d\u53f6\u65af\u5efa\u6a21"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23543v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "How AI Assistance Affects Human Skill Development: A Study of Learning with Logic Puzzles", "tldr": "\u672c\u6587\u901a\u8fc7\u903b\u8f91\u8c1c\u9898\u5b9e\u9a8c\u7814\u7a76\u6309\u9700 AI \u8f85\u52a9\u5bf9\u4eba\u7c7b\u6280\u80fd\u53d1\u5c55\u7684\u5f71\u54cd\uff0c\u53d1\u73b0\u964d\u4f4e\u8bf7\u6c42\u6210\u672c\u4f1a\u663e\u8457\u589e\u52a0 AI \u4f7f\u7528\u9891\u7387\u3002\u4f7f\u7528\u8fc7 AI \u8f85\u52a9\u7684\u53c2\u4e0e\u8005\u5728\u79fb\u9664\u8f85\u52a9\u540e\u8868\u73b0\u66f4\u5dee\uff0c\u4e14\u57fa\u4e8e\u5176\u8f85\u52a9\u9636\u6bb5\u8868\u73b0\u4f1a\u9ad8\u4f30\u5176\u771f\u5b9e\u72ec\u7acb\u80fd\u529b\uff1b\u8d1d\u53f6\u65af\u6f5c\u5728\u80fd\u529b\u6a21\u578b\u663e\u793a\uff0c\u66f4\u591a\u72ec\u7acb\u63a8\u7406\u4e0e\u66f4\u5927\u7684\u80fd\u529b\u63d0\u5347\u76f8\u5173\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Does multi-agent LLM interaction help or hurt? Some work reports gains from debate (Du et al., 2024), critique loops (Chen et al., 2025), and mixture-of-agents synthesis (Wang et al., 2025), while other work finds that interaction adds cost without improving quality under equal budgets (Tran \u0026 Kiela, 2026; Xu et al., 2026; Jarrett et al., 2025), or that independent sampling already captures multi-agent gains (Li et al., 2024). We argue this contradiction partly reflects a missing distinction, because not all multi-agent communication is equal. Different model families find structurally different solutions, but when agents read each other\u0027s complete outputs, their proposals converge within one round, erasing the diversity that motivates using multiple models. We call this the interaction tax. We test 11 verifier-scored optimization tasks under matched budgets and find that full-solution interaction is a weak default. Independent proposal generation avoids this collapse. Full-solution interaction mainly makes agents stay close to the first solution they see instead of trying different approaches, and critique helps only if the violated rule is easy for the LLM to find and fix. These results suggest that multi-agent performance depends less on the number of agents than on the information they exchange, and interaction helps only when agents share the right information at the right time.", "arxiv_id": "2608.23541", "arxiv_url": "https://arxiv.org/abs/2608.23541", "authors": ["Summer Eunhyung Ann", "Haokun Liu", "Chenhao Tan"], "brief": "\u8bba\u6587\u7814\u7a76\u591a\u667a\u80fd\u4f53\u5927\u6a21\u578b\u4ea4\u4e92\u4f55\u65f6\u6709\u76ca\uff0c\u63d0\u51fa\u201c\u4ea4\u4e92\u7a0e\u201d\uff1a\u5f53\u667a\u80fd\u4f53\u8bfb\u53d6\u5f7c\u6b64\u5b8c\u6574\u7b54\u6848\u65f6\uff0c\u65b9\u6848\u4f1a\u5728\u4e00\u8f6e\u5185\u8fc5\u901f\u8d8b\u540c\uff0c\u4ece\u800c\u62b9\u6389\u591a\u6a21\u578b\u5e26\u6765\u7684\u591a\u6837\u6027\u3002\u4f5c\u8005\u572811\u4e2a\u9a8c\u8bc1\u5668\u8bc4\u5206\u7684\u4f18\u5316\u4efb\u52a1\u4e0a\u53d1\u73b0\uff0c\u72ec\u7acb\u751f\u6210\u901a\u5e38\u6bd4\u5b8c\u6574\u7b54\u6848\u4ea4\u4e92\u66f4\u80fd\u4fdd\u6301\u63a2\u7d22\uff1b\u6279\u8bc4\u53cd\u9988\u53ea\u6709\u5728\u8fdd\u89c4\u89c4\u5219\u6613\u88ab\u6a21\u578b\u53d1\u73b0\u5e76\u4fee\u6b63\u65f6\u624d\u6709\u5e2e\u52a9\u3002", "categories": ["cs.MA", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23541", "impact_score": 7, "is_agent": true, "is_top": false, "key_points": [], "keywords": ["\u667a\u80fd\u4f53", "\u5927\u8bed\u8a00\u6a21\u578b", "\u591a\u667a\u80fd\u4f53\u534f\u4f5c", "\u6a21\u578b\u591a\u6837\u6027"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23541v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Interaction Tax: When Communication Erases Diversity in Multi-Agent Teams", "tldr": "\u8bba\u6587\u7814\u7a76\u591a\u667a\u80fd\u4f53\u5927\u6a21\u578b\u4ea4\u4e92\u4f55\u65f6\u6709\u76ca\uff0c\u63d0\u51fa\u201c\u4ea4\u4e92\u7a0e\u201d\uff1a\u5f53\u667a\u80fd\u4f53\u8bfb\u53d6\u5f7c\u6b64\u5b8c\u6574\u7b54\u6848\u65f6\uff0c\u65b9\u6848\u4f1a\u5728\u4e00\u8f6e\u5185\u8fc5\u901f\u8d8b\u540c\uff0c\u4ece\u800c\u62b9\u6389\u591a\u6a21\u578b\u5e26\u6765\u7684\u591a\u6837\u6027\u3002\u4f5c\u8005\u572811\u4e2a\u9a8c\u8bc1\u5668\u8bc4\u5206\u7684\u4f18\u5316\u4efb\u52a1\u4e0a\u53d1\u73b0\uff0c\u72ec\u7acb\u751f\u6210\u901a\u5e38\u6bd4\u5b8c\u6574\u7b54\u6848\u4ea4\u4e92\u66f4\u80fd\u4fdd\u6301\u63a2\u7d22\uff1b\u6279\u8bc4\u53cd\u9988\u53ea\u6709\u5728\u8fdd\u89c4\u89c4\u5219\u6613\u88ab\u6a21\u578b\u53d1\u73b0\u5e76\u4fee\u6b63\u65f6\u624d\u6709\u5e2e\u52a9\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "The continual evolution of malware variants necessitates detection systems that can adapt to new threats without retraining from scratch. However, continually updating models on new data often leads to catastrophic forgetting, where previously learned knowledge is overwritten. While continual learning has been increasingly explored for malware detection, the specific setting of Few-Shot Class-Incremental Learning (FSCIL), where new malware classes must be learned from only a small number of labeled examples, remains comparatively underexplored. Therefore, this work investigates the FSCIL setting for malware classification. To address the stability-plasticity dilemma, we propose a hybrid framework that leverages a Self-Supervised Learning (SSL) backbone initialized through domain-specific pre-training on malware packets. Our method incorporates Low-Rank Adaptation (LoRA) to efficiently adapt the model during the base session while freezing the core backbone to preserve previously learned representations, alongside a prototype-based classification head for incremental sessions to establish robust decision boundaries from limited samples. Extensive experiments across several datasets demonstrate that our approach consistently outperforms prior malware FSCIL baselines and achieves state-of-the-art performance.", "arxiv_id": "2608.23536", "arxiv_url": "https://arxiv.org/abs/2608.23536", "authors": ["Kyle Stein", "Guillermo Francia", "III Eman El-Sheikh", "Andrew Arash Mahyari"], "brief": "\u672c\u6587\u7814\u7a76\u6076\u610f\u7f51\u7edc\u5305\u8bc6\u522b\u4e2d\u7684\u5c11\u6837\u672c\u7c7b\u589e\u91cf\u5b66\u4e60\u95ee\u9898\uff0c\u76ee\u6807\u662f\u5728\u53ea\u6709\u5c11\u91cf\u6807\u6ce8\u6837\u672c\u7684\u65b0\u6076\u610f\u8f6f\u4ef6\u7c7b\u522b\u4e0a\u6301\u7eed\u9002\u5e94\uff0c\u540c\u65f6\u907f\u514d\u707e\u96be\u6027\u9057\u5fd8\u3002\u65b9\u6cd5\u7ed3\u5408\u9886\u57df\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u9aa8\u5e72\u3001LoRA \u9002\u914d\u548c\u539f\u578b\u5206\u7c7b\u5934\uff0c\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u65e2\u6709\u6076\u610f\u8f6f\u4ef6 FSCIL \u57fa\u7ebf\u5e76\u8fbe\u5230\u6700\u4f73\u6027\u80fd\u3002", "categories": ["cs.CR", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23536", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u7f51\u7edc\u5b89\u5168", "\u6301\u7eed\u5b66\u4e60", "\u5c11\u6837\u672c\u5b66\u4e60", "\u81ea\u76d1\u7763\u5b66\u4e60"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23536v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "Adapter-Based Few-Shot Continual Learning for Malicious Packet Recognition", "tldr": "\u672c\u6587\u7814\u7a76\u6076\u610f\u7f51\u7edc\u5305\u8bc6\u522b\u4e2d\u7684\u5c11\u6837\u672c\u7c7b\u589e\u91cf\u5b66\u4e60\u95ee\u9898\uff0c\u76ee\u6807\u662f\u5728\u53ea\u6709\u5c11\u91cf\u6807\u6ce8\u6837\u672c\u7684\u65b0\u6076\u610f\u8f6f\u4ef6\u7c7b\u522b\u4e0a\u6301\u7eed\u9002\u5e94\uff0c\u540c\u65f6\u907f\u514d\u707e\u96be\u6027\u9057\u5fd8\u3002\u65b9\u6cd5\u7ed3\u5408\u9886\u57df\u81ea\u76d1\u7763\u9884\u8bad\u7ec3\u9aa8\u5e72\u3001LoRA \u9002\u914d\u548c\u539f\u578b\u5206\u7c7b\u5934\uff0c\u5728\u591a\u4e2a\u6570\u636e\u96c6\u4e0a\u4f18\u4e8e\u65e2\u6709\u6076\u610f\u8f6f\u4ef6 FSCIL \u57fa\u7ebf\u5e76\u8fbe\u5230\u6700\u4f73\u6027\u80fd\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "World models can predict video without learning dynamics that they reliably preserve. We test whether a frozen DreamerV3 trained only on pendulum video learns a scalar that its own latent transition treats as approximately conserved. A label-free search recovers the same energy-like invariant across independently trained conservative models, while the same procedure finds no comparable invariant in matched damped models. During autonomous rollouts, this quantity drifts. Projecting the latent state back toward its initial level set reduces rollout error in all three conservative models, whereas matched random constraints usually increase it. These results distinguish a dynamically meaningful invariant from a merely decodable correlate and reveal a concrete failure mode: a world model can learn a physical constraint from pixels yet violate that constraint when it imagines forward.", "arxiv_id": "2608.23526", "arxiv_url": "https://arxiv.org/abs/2608.23526", "authors": ["Richard Bao"], "brief": "\u8bba\u6587\u53d1\u73b0\uff0c\u4ec5\u4ece\u6446\u89c6\u9891\u8bad\u7ec3\ what_it_is": null, "why_notable": null}, {"abstract": "Earth-system analysis reconstructs changing physical processes from observations that differ in source, scale, timing, and modality. Natural hazards make this work consequential because incomplete evidence can change estimates of severity, exposure, and mechanism. We introduce EarthVerse, a benchmark that evaluates scientific agents through package-scoped investigations. Its 405 reproducible tasks are grounded in 199 documented events and 19 hazard families. Agents inspect heterogeneous event packages, choose compatible evidence, execute transparent calculations, reconcile source differences, and preserve provenance in the final answer. We provide executable ground truth that decomposes each task into fine-grained answer units, together with task-specific rubrics that assess the supporting research process while allowing multiple valid paths. We evaluate 25 model and agent systems under a controlled tool-using protocol, then use controlled studies to locate failures in evidence access, tool selection, memory, reasoning, interaction, and scientific execution. Across systems, the best mean answer-unit accuracy is 84.65%, while the highest Strict@95 is only 34.81%. The gap shows that current agents often complete individual steps without maintaining a consistent chain across evidence, scales, units, calculations, and physical interpretation. EarthVerse provides a reproducible basis for measuring end-to-end scientific reliability in dynamic Earth systems.", "arxiv_id": "2608.23525", "arxiv_url": "https://arxiv.org/abs/2608.23525", "authors": ["Zhiqing Cui", "Xinxiang Yin", "Yihong Tang", "Xinglang Zhang", "Yuanzhe Hu", "Siru Zhong", "Weidong Tang", "Yuxuan Liang", "Weijia Li", "Ming Jin", "Shirui Pan", "Yuhao Kang", "Dingyi Zhuang", "Jinhua Zhao"], "brief": "\u8bba\u6587\u63d0\u51fa EarthVerse\uff0c\u4e00\u4e2a\u9762\u5411\u52a8\u6001\u5730\u7403\u7cfb\u7edf\u4e0e\u81ea\u7136\u707e\u5bb3\u5206\u6790\u7684\u79d1\u5b6 ", "upvotes": 0, "what_it_is": null, "why_notable": null}, {"abstract": "Artificial intelligence (AI) is transforming measurement in economics. AI models convert unstructured data, such as text and images, into structured variables at low cost, making previously prohibitive measurement feasible at scale. This shifts the bottleneck from finding any scalable measure of a phenomenon to choosing among many plausible ones, which may support different empirical conclusions. This review provides guidance for navigating that shift. We describe three stages at which AI enters the measurement pipeline---discovery, construct definition, and observation---and what each demands of researchers. We argue that credible inference with AI-generated variables requires appropriately designed validation: anchoring measurement to explicit criteria, rather than informal claims that a proxy is reasonable. We then examine how validation samples support valid inference even when AI predictions are arbitrarily biased, and what can be done when a random validation sample is unavailable.", "arxiv_id": "2608.23524", "arxiv_url": "https://arxiv.org/abs/2608.23524", "authors": ["Melissa Dell", "Ashesh Rambachan"], "brief": "\u672c\u6587\u7efc\u8ff0\u4e86 AI \u5982\u4f55\u5c06\u6587\u672c\u3001\u56fe\u50cf\u7b49\u975e\u7ed3\u6784\u5316\u6570\u636e\u8f6c\u5316\u4e3a\u7ecf\u6d4e\u5b66\u7814\u7a76\u4e2d\u7684\u7ed3\u6784\u5316\u53d8\u91cf\uff0c\u4f7f\u5927\u89c4\u6a21\u6d4b\u91cf\u66f4\u4f4e\u6210\u672c\u53ef\u884c\u3002\u4f5c\u8005\u5f3a\u8c03\u7814\u7a76\u96be\u70b9\u6b63\u4ece\u201c\u80fd\u5426\u6d4b\u91cf\u201d\u8f6c\u5411\u201c\u5982\u4f55\u5728\u591a\u4e2a\u53ef\u884c\u6d4b\u91cf\u4e2d\u505a\u53ef\u4fe1\u9009\u62e9\u201d\uff0c\u5e76\u63d0\u51fa\u4ee5\u660e\u786e\u6807\u51c6\u548c\u9a8c\u8bc1\u6837\u672c\u652f\u6491 AI \u751f\u6210\u53d8\u91cf\u7684\u53ef\u9760\u63a8\u65ad\u3002", "categories": ["econ.GN", "cs.AI", "stat.AP"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23524", "impact_score": 7, "is_agent": false, "is_top": false, "key_points": [], "keywords": ["\u4eba\u5de5\u667a\u80fd", "\u7ecf\u6d4e\u6d4b\u91cf", "\u56e0\u679c\u63a8\u65ad", "\u6570\u636e\u9a8c\u8bc1"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23524v1", "published_at": "2026-08-24", "score": 0.0, "selected_reasons": [], "thumbnail": null, "title": "The Measurement Revolution? Credible Measurement and Inference in the Age of AI", "tldr": "\u672c\u6587\u7efc\u8ff0\u4e86 AI \u5982\u4f55\u5c06\u6587\u672c\u3001\u56fe\u50cf\u7b49\u975e\u7ed3\u6784\u5316\u6570\u636e\u8f6c\u5316\u4e3a\u7ecf\u6d4e\u5b66\u7814\u7a76\u4e2d\u7684\u7ed3\u6784\u5316\u53d8\u91cf\uff0c\u4f7f\u5927\u89c4\u6a21\u6d4b\u91cf\u66f4\u4f4e\u6210\u672c\u53ef\u884c\u3002\u4f5c\u8005\u5f3a\u8c03\u7814\u7a76\u96be\u70b9\u6b63\u4ece\u201c\u80fd\u5426\u6d4b\u91cf\u201d\u8f6c\u5411\u201c\u5982\u4f55\u5728\u591a\u4e2a\u53ef\u884c\u6d4b\u91cf\u4e2d\u505a\u53ef\u4fe1\u9009\u62e9\u201d\uff0c\u5e76\u63d0\u51fa\u4ee5\u660e\u786e\u6807\u51c6\u548c\u9a8c\u8bc1\u6837\u672c\u652f\u6491 AI \u751f\u6210\u53d8\u91cf\u7684\u53ef\u9760\u63a8\u65ad\u3002", "upvotes": 0, "what_it_is": null, "why_notable": null}];
let state = { category:"ALL", keyword:"ALL", sort:"score", q:"" };

// ---- 统计 + 长尾过滤 ----
function counted(field){
  const m = {};
  PAPERS.forEach(p => (p[field]||[]).forEach(v => { m[v]=(m[v]||0)+1; }));
  return m;
}
function topKeys(map, {min=1, limit=99}={}){
  return Object.entries(map).filter(([,c])=>c>=min).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>k);
}

function renderTabRow(elId, items, counts, dim, cls){
  const el = document.getElementById(elId);
  const cur = state[dim];
  const mk = (val,label,n)=>`<span class="tab ${cls} ${val===cur?'active':''}" data-dim="${dim}" data-val="${val}">${label}${n!=null?` (${n})`:''}</span>`;
  el.innerHTML = mk("ALL","全部",PAPERS.length) + items.map(v=>mk(v,v,counts[v])).join("");
  el.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state[t.dataset.dim]=t.dataset.val; renderTabs(); render(); };
  });
}
function renderTabs(){
  const catCounts = counted("categories");
  const kwCounts = counted("keywords");
  // 分类：长尾隐藏（出现>=3次的，最多12个）
  const cats = topKeys(catCounts, {min:3, limit:12});
  // 关键词：长尾隐藏（出现>=2次的，最多18个）
  const kws = topKeys(kwCounts, {min:2, limit:18});
  renderTabRow("catTabs", cats, catCounts, "category", "cat");
  renderTabRow("kwTabs", kws, kwCounts, "keyword", "kw");
}

function matchFilter(p){
  if (state.category!=="ALL" && !(p.categories||[]).includes(state.category)) return false;
  if (state.keyword!=="ALL" && !(p.keywords||[]).includes(state.keyword)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = [p.title, p.brief, p.abstract, p.what_it_is, p.why_notable, (p.authors||[]).join(" "), (p.keywords||[]).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortPapers(arr){
  const s = state.sort;
  return arr.slice().sort((a,b)=>{
    if (s==="upvotes") return (b.upvotes||0)-(a.upvotes||0);
    if (s==="date") return (b.published_at||"").localeCompare(a.published_at||"");
    return (b.score||0)-(a.score||0);
  });
}

function metaBlock(p){
  const authors = (p.authors||[]).slice(0,4).join(", ") + ((p.authors||[]).length>4 ? ` 等 ${p.authors.length} 人` : "");
  const cats = (p.categories||[]).map(c=>`<span>${c}</span>`).join("");
  const kws = (p.keywords||[]).map(k=>`<span>${k}</span>`).join("");
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HF</a>` : "";
  const links = `<div class="links"><a onclick="openModal('${p.arxiv_id}')">🔍 详情</a><a href="${p.arxiv_url}" target="_blank">arXiv</a>${hf}<a href="${p.pdf_url}" target="_blank">PDF</a>${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}</div>`;
  return `
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at}${p.organization?` ｜ 🏛 ${p.organization}`:""}</div>
    <div class="tags">${cats}</div>
    ${kws?`<div class="kws">${kws}</div>`:""}
    <div class="stats">👍 <b>${p.upvotes}</b> ｜ ⭐ <b>${p.github_stars}</b> ｜ 分 <b>${p.score}</b>${p.impact_score!=null?` ｜ 影响力 <b>${p.impact_score}/10</b>`:""}</div>
    ${links}`;
}

function topCard(p, idx){
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  return `<div class="card top" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="badge">TOP</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    ${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
    ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
    ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}
    ${metaBlock(p)}
  </div>`;
}
function restCard(p, idx){
  const summary = p.tldr || p.brief || "（暂无中文总结）";
  const thumb = p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" loading="lazy" onerror="this.style.display='none'"/>` : "";
  return `<div class="card" onclick="cardClick(event,'${p.arxiv_id}')">
    <h3><span class="rank">#${idx}</span><span class="title-link">${p.title}</span></h3>
    ${thumb}
    <div class="summary">${summary}</div>
    ${metaBlock(p)}
  </div>`;
}

function render(){
  const filtered = sortPapers(PAPERS.filter(matchFilter));
  const grid = document.getElementById("grid");
  grid.innerHTML = filtered.length
    ? filtered.map((p,i)=> p.is_top ? topCard(p,i+1) : restCard(p,i+1)).join("")
    : `<div class="empty">该筛选条件下暂无论文</div>`;
  const nTop = filtered.filter(p=>p.is_top).length;
  document.getElementById("metaLine").textContent = `当前显示 ${filtered.length} 篇（前 ${nTop} 篇为精选四段式，其余为中文总结）`;
}

document.getElementById("sortSel").onchange = e=>{ state.sort=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.q=e.target.value; render(); };

// ---- 详情弹窗：原始英文摘要 + PDF 预览 ----
const BY_ID = {};
PAPERS.forEach(p => { BY_ID[p.arxiv_id] = p; });

// 点卡片任意空白处打开详情；点到链接(a)则不弹窗，走链接本身
function cardClick(e, id){
  if (e.target.closest("a")) return;
  openModal(id);
}

function openModal(id){
  const p = BY_ID[id];
  if (!p) return;
  const authors = (p.authors||[]).slice(0,10).join(", ") + ((p.authors||[]).length>10 ? ` 等 ${p.authors.length} 人` : "");
  const kp = (p.key_points||[]).map(k=>`<li>${k}</li>`).join("");
  let four = "";
  if (p.what_it_is || kp || p.why_notable){
    four = `${p.what_it_is?`<div class="sec"><b>① 核心内容</b>${p.what_it_is}</div>`:""}
      ${kp?`<div class="sec"><b>② 关键技术/数据</b><ul>${kp}</ul></div>`:""}
      ${p.why_notable?`<div class="sec"><b>③ 为何值得关注</b>${p.why_notable}</div>`:""}`;
  } else if (p.tldr){
    four = `<div class="summary">${p.tldr}</div>`;
  }
  const hf = p.on_hf ? `<a href="${p.hf_url}" target="_blank">HuggingFace</a>` : "";
  document.getElementById("modalContent").innerHTML = `
    <h2>${p.title}</h2>
    <div class="row">👤 ${authors}</div>
    <div class="row">📅 ${p.published_at||""}${p.organization?` ｜ 🏛 ${p.organization}`:""} ｜ ${(p.categories||[]).join(", ")}</div>
    ${four}
    <div class="lbl">Abstract（原始英文摘要）</div>
    <div class="abs">${p.abstract || "（无摘要）"}</div>
    <div class="lbl">PDF 预览</div>
    <div class="pdfwrap"><iframe src="${p.pdf_url}" loading="lazy"></iframe></div>
    <div class="pdfhint">若预览空白（部分来源禁止内嵌），点下方「在新标签打开 PDF」。</div>
    <div class="links" style="margin-top:12px;">
      <a href="${p.arxiv_url}" target="_blank">arXiv 页面</a>${hf}
      <a href="${p.pdf_url}" target="_blank">在新标签打开 PDF</a>
      ${p.github_repo?`<a href="${p.github_repo}" target="_blank">GitHub</a>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("modalContent").innerHTML = "";  // 停止 PDF 加载
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

renderTabs(); render();
</script>
</body>
</html>
