<script>
const PAPERS = [{"abstract": "As on-device LLM agents evolve into personal copilots, the mobile operating system has become a key testbed for this paradigm, making rigorous capability evaluation essential. Yet existing benchmarks fall into two camps, each with a critical blind spot: GUI-centric benchmarks test surface-level screen manipulation while overlooking background tool use and long-horizon planning, whereas static function-calling benchmarks rely on offline API matching that is detached from real runtime constraints. To close this gap, we present \\textbf{MobilePA-Bench}, an interactive, stateful, and tool-centric benchmark for evaluating the tool-calling and planning abilities of mobile planning agents. MobilePA-Bench runs on an executable sandbox that maintains live application databases and returns structured feedback, spanning $13$ functional domains and $212$ realistic mobile tools. Beyond basic tool use, it evaluates a central planning agent along three advanced dimensions: \\emph{(1)~Sub-agent Collaboration}---decomposing a complex task and delegating specialized work to capable sub-agents; \\emph{(2)~Memory Usage}---recalling stored memories, user profiles, and past preferences to resolve implicit requests; and \\emph{(3)~Skill Usage}---invoking pre-packaged composite skills instead of planning every step from scratch. Extensive experiments show that current frontier LLMs remain unreliable in mobile settings: performance drops sharply under strict tool ordering, permission limits, and unexpected runtime errors. By pairing an interactive function-calling sandbox with evidence-based verification, MobilePA-Bench serves as both a practical diagnostic benchmark and an interactive foundation for agentic reinforcement learning---accelerating the development of dependable mobile agents.", "arxiv_id": "2608.23035", "arxiv_url": "https://arxiv.org/abs/2608.23035", "authors": ["Yi Zhu", "Xiongwei Wu", "Qiyi Wang", "Tingyu Qu", "Jiajun Liu", "Sihan Cao", "Long Chen", "Weigao Sun", "Feida Zhu", "Yiran Zhong", "Steven Hoi"], "brief": "\u8bba\u6587\u63d0\u51fa MobilePA-Bench\uff0c\u4e00\u4e2a\u5728\u53ef\u6267\u884c\u79fb\u52a8\u6c99\u76d2\u4e2d\u8bc4\u6d4b\u79fb\u52a8\u89c4\u5212\u667a\u80fd\u4f53\u7684\u57fa\u51c6\uff0c\u8986\u76d6 13 \u4e2a\u529f\u80fd\u57df\u548c 212 \u4e2a\u771f\u5b9e\u611f\u79fb\u52a8\u5de5\u5177\u3002\u5b83\u91cd\u70b9\u8bc4\u4f30\u590d\u6742\u4efb\u52a1\u4e2d\u7684\u5de5\u5177\u8c03\u7528\u3001\u957f\u7a0b\u89c4\u5212\u3001\u5b50\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u8bb0\u5fc6\u4f7f\u7528\u4e0e\u590d\u5408\u6280\u80fd\u8c03\u7528\u80fd\u529b\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23035", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u76f8\u6bd4\u4ec5\u6d4b GUI \u64cd\u4f5c\u6216\u79bb\u7ebf\u51fd\u6570\u5339\u914d\u7684\u57fa\u51c6\uff0cMobilePA-Bench \u63d0\u4f9b\u6709\u72b6\u6001\u8fd0\u884c\u73af\u5883\u3001\u5b9e\u65f6\u5e94\u7528\u6570\u636e\u5e93\u548c\u7ed3\u6784\u5316\u53cd\u9988\u3002", "\u8bc4\u6d4b\u4e09\u7c7b\u9ad8\u7ea7\u80fd\u529b\uff1a\u5b50\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u57fa\u4e8e\u7528\u6237\u8bb0\u5fc6\u548c\u504f\u597d\u7684\u9690\u5f0f\u8bf7\u6c42\u89e3\u6790\u3001\u8c03\u7528\u9884\u5c01\u88c5\u590d\u5408\u6280\u80fd\u3002", "\u5b9e\u9a8c\u663e\u793a\u5f53\u524d\u524d\u6cbf LLM \u5728\u4e25\u683c\u5de5\u5177\u987a\u5e8f\u3001\u6743\u9650\u9650\u5236\u548c\u8fd0\u884c\u65f6\u5f02\u5e38\u4e0b\u8868\u73b0\u660e\u663e\u4e0b\u964d\uff0c\u79fb\u52a8\u573a\u666f\u53ef\u9760\u6027\u4ecd\u4e0d\u8db3\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u8c03\u7528", "\u79fb\u52a8\u7aef", "\u57fa\u51c6\u8bc4\u6d4b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23035v1", "published_at": "2026-08-24", "score": 0.5, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MobilePA-Bench: Benchmarking Mobile Planner Agents on Complex Real-World Tasks", "tldr": "\u9762\u5411\u79fb\u52a8\u89c4\u5212\u667a\u80fd\u4f53\u7684\u4ea4\u4e92\u5f0f\u5de5\u5177\u8c03\u7528\u57fa\u51c6\u3002", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MobilePA-Bench\uff0c\u4e00\u4e2a\u5728\u53ef\u6267\u884c\u79fb\u52a8\u6c99\u76d2\u4e2d\u8bc4\u6d4b\u79fb\u52a8\u89c4\u5212\u667a\u80fd\u4f53\u7684\u57fa\u51c6\uff0c\u8986\u76d6 13 \u4e2a\u529f\u80fd\u57df\u548c 212 \u4e2a\u771f\u5b9e\u611f\u79fb\u52a8\u5de5\u5177\u3002\u5b83\u91cd\u70b9\u8bc4\u4f30\u590d\u6742\u4efb\u52a1\u4e2d\u7684\u5de5\u5177\u8c03\u7528\u3001\u957f\u7a0b\u89c4\u5212\u3001\u5b50\u667a\u80fd\u4f53\u534f\u4f5c\u3001\u8bb0\u5fc6\u4f7f\u7528\u4e0e\u590d\u5408\u6280\u80fd\u8c03\u7528\u80fd\u529b\u3002", "why_notable": "\u8be5\u57fa\u51c6\u66f4\u8d34\u8fd1\u771f\u5b9e\u79fb\u52a8\u7aef\u4e2a\u4eba\u52a9\u7406\u7684\u6267\u884c\u7ea6\u675f\uff0c\u53ef\u7528\u4e8e\u8bca\u65ad\u79fb\u52a8\u667a\u80fd\u4f53\u77ed\u677f\uff0c\u4e5f\u4e3a\u57fa\u4e8e\u4ea4\u4e92\u73af\u5883\u7684\u667a\u80fd\u4f53\u5f3a\u5316\u5b66\u4e60\u63d0\u4f9b\u57fa\u7840\u3002"}, {"abstract": "Reliable deployment of LLM agents in user-facing products depends not on raw task-solving ability but on consistency and limit-awareness: behaving the same way across repeated trials, and recognizing when a request cannot, or cannot yet, be safely fulfilled. CAR-bench exposes this reliability gap in the domain of in-car assistants: an LLM-simulated user issues incomplete or ambiguous requests, requiring the agent to resolve uncertainty through multi-turn dialogue and tool use while strictly adhering to domain policies. Even frontier models show a substantial gap between what they can solve at least once (Pass@3) and what they solve consistently across trials (Pass^k). We bridge this gap with TRACE (TRAjectory-Contrastive Evolution), which iteratively improves a skill-based agent\u0027s behavioral knowledge without modifying model weights. This knowledge is organized as a Skill Bank of modular, retrievable skills, each encoding a self-contained set of tool-use rules and behavioral guidelines. TRACE evolves this bank through an agentic self-evolution loop: after each evaluation round, it groups trajectories by the skills invoked and refines each skill by contrasting successful and failed behaviors. The updated bank then guides subsequent rounds, while during deployment the Actor performs state-conditioned skill orchestration at every turn. On GPT-5.5, TRACE improves consistency (Pass^3) by 34.6 points, from 59.9% to 94.5%, while shrinking the gap between potential and reliable performance to just 4.0 points. On the official hidden set, TRACE achieved first place using GPT-5.6-Sol, attaining a Pass^3 score of 70%-a 40% relative improvement over the baseline. These results show that TRACE converts high model potential into stable, consistent performance gain. Project homepage: https://darwin-agent.github.io/Car-bench-TRACE.", "arxiv_id": "2608.22793", "arxiv_url": "https://arxiv.org/abs/2608.22793", "authors": ["Wenhao Wu", "Menghao Zhang", "Xin Wang", "Zhi Wang", "Kun Shao", "Jian Luan"], "brief": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u79cd\u65e0\u9700\u6539\u6a21\u578b\u6743\u91cd\u7684\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u65b9\u6cd5\uff0c\u901a\u8fc7\u7ef4\u62a4\u53ef\u68c0\u7d22\u7684\u6a21\u5757\u5316 Skill Bank \u6765\u6c89\u6dc0\u5de5\u5177\u4f7f\u7528\u89c4\u5219\u4e0e\u884c\u4e3a\u6307\u5357\u3002\u5b83\u5728 CAR-bench \u8f66\u8f7d\u52a9\u624b\u573a\u666f\u4e2d\uff0c\u9488\u5bf9\u591a\u8f6e\u6f84\u6e05\u3001\u5de5\u5177\u8c03\u7528\u548c\u7b56\u7565\u9075\u5faa\uff0c\u663e\u8457\u63d0\u5347 LLM \u667a\u80fd\u4f53\u7684\u7a33\u5b9a\u53ef\u9760\u8868\u73b0\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.22793", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["TRACE \u6309\u6bcf\u8f6e\u8bc4\u6d4b\u4e2d\u8c03\u7528\u7684\u6280\u80fd\u5bf9\u8f68\u8ff9\u5206\u7ec4\uff0c\u5bf9\u6bd4\u6210\u529f\u4e0e\u5931\u8d25\u884c\u4e3a\uff0c\u8fed\u4ee3\u6539\u5199\u548c\u4f18\u5316\u5bf9\u5e94\u6280\u80fd\u3002", "\u90e8\u7f72\u65f6 Actor \u4f1a\u5728\u6bcf\u4e00\u8f6e\u5bf9\u8bdd\u4e2d\u6839\u636e\u72b6\u6001\u52a8\u6001\u7f16\u6392\u6280\u80fd\uff0c\u6307\u5bfc\u591a\u8f6e\u4ea4\u4e92\u4e0e\u5de5\u5177\u4f7f\u7528\u3002", "\u5728 GPT-5.5 \u4e0a\u5c06 Pass^3 \u4ece 59.9% \u63d0\u5347\u5230 94.5%\uff0c\u4e00\u81f4\u6027\u63d0\u5347 34.6 \u4e2a\u767e\u5206\u70b9\uff1b\u5b98\u65b9\u9690\u85cf\u96c6\u83b7\u7b2c\u4e00\u540d\uff0cPass^3 \u8fbe 70%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5de5\u5177\u4f7f\u7528", "\u81ea\u8fdb\u5316", "\u8f66\u8f7d\u52a9\u624b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.22793v1", "published_at": "2026-08-24", "score": 0.5, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "TRACE: A Self-Evolving Skill Bank for Consistent, Limit-Aware LLM Agents", "tldr": "\u81ea\u8fdb\u5316\u6280\u80fd\u5e93\u63d0\u5347\u8f66\u8f7dLLM\u667a\u80fd\u4f53\u4e00\u81f4\u6027", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa TRACE\uff0c\u4e00\u79cd\u65e0\u9700\u6539\u6a21\u578b\u6743\u91cd\u7684\u667a\u80fd\u4f53\u81ea\u8fdb\u5316\u65b9\u6cd5\uff0c\u901a\u8fc7\u7ef4\u62a4\u53ef\u68c0\u7d22\u7684\u6a21\u5757\u5316 Skill Bank \u6765\u6c89\u6dc0\u5de5\u5177\u4f7f\u7528\u89c4\u5219\u4e0e\u884c\u4e3a\u6307\u5357\u3002\u5b83\u5728 CAR-bench \u8f66\u8f7d\u52a9\u624b\u573a\u666f\u4e2d\uff0c\u9488\u5bf9\u591a\u8f6e\u6f84\u6e05\u3001\u5de5\u5177\u8c03\u7528\u548c\u7b56\u7565\u9075\u5faa\uff0c\u663e\u8457\u63d0\u5347 LLM \u667a\u80fd\u4f53\u7684\u7a33\u5b9a\u53ef\u9760\u8868\u73b0\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u805a\u7126\u7528\u6237\u4ea7\u54c1\u4e2d\u66f4\u5173\u952e\u7684\u201c\u7a33\u5b9a\u4e00\u81f4\u201d\u548c\u201c\u8fb9\u754c\u610f\u8bc6\u201d\uff0c\u800c\u975e\u5355\u6b21\u89e3\u9898\u80fd\u529b\uff1b\u901a\u8fc7\u5916\u90e8\u6280\u80fd\u5e93\u81ea\u8fdb\u5316\uff0c\u628a\u5927\u6a21\u578b\u6f5c\u5728\u80fd\u529b\u8f6c\u5316\u4e3a\u53ef\u91cd\u590d\u7684\u53ef\u9760\u8868\u73b0\uff0c\u5bf9\u8f66\u8f7d\u52a9\u624b\u548c\u771f\u5b9e\u5de5\u5177\u578b LLM \u667a\u80fd\u4f53\u90e8\u7f72\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "We introduce Hydra-0, a generalist world model conditioned on action flow, which represents robot actions as pixel motion. This shared visual interface enables generalist world modeling and control by learning action consequences across embodiments, tasks, environments, and video-generation backbones. Our best configuration achieves 90.4% lower robot-motion error and 60.2% lower object-motion error than our action-conditioned baseline, while supporting zero-shot composition and data-efficient adaptation. On the RoboLab benchmark, Hydra-0 achieves a Pearson correlation of r=0.96 between replayed and reference success rates. Finally, we uncover an emergent inverse mode of this interface: a world action model that predicts compatible robot motion from desired object flow transferred from a human demonstration. A trained action head maps the resulting latent features to executable actions without requiring task-specific expert robot demonstrations. Together, these results demonstrate the potential of action flow as a shared control interface connecting heterogeneous training data, open-loop policy evaluation, and robot control.", "arxiv_id": "2608.18077", "arxiv_url": "https://arxiv.org/abs/2608.18077", "authors": ["Hongyu Li", "Bowen Wen", "Xinghao Zhu", "Yixuan Wang", "Yilun Du", "Yunzhu Li", "George Konidaris", "Stan Birchfield", "Soha Pouya", "Chenran Li", "Yan Chang"], "brief": "\u8bba\u6587\u63d0\u51fa Hydra-0\uff0c\u4e00\u79cd\u4ee5 action flow\uff08\u5c06\u673a\u5668\u4eba\u52a8\u4f5c\u8868\u793a\u4e3a\u50cf\u7d20\u8fd0\u52a8\uff09\u4e3a\u6761\u4ef6\u7684\u901a\u7528\u4e16\u754c\u6a21\u578b\u3002\u5b83\u7528\u5171\u4eab\u89c6\u89c9\u63a5\u53e3\u8de8\u672c\u4f53\u3001\u4efb\u52a1\u3001\u73af\u5883\u548c\u89c6\u9891\u751f\u6210\u9aa8\u5e72\u5b66\u4e60\u52a8\u4f5c\u540e\u679c\uff0c\u5e76\u652f\u6301\u96f6\u6837\u672c\u7ec4\u5408\u3001\u6570\u636e\u9ad8\u6548\u9002\u914d\u4e0e\u673a\u5668\u4eba\u63a7\u5236\u3002", "categories": ["cs.RO"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.18077", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u76f8\u6bd4\u52a8\u4f5c\u6761\u4ef6\u57fa\u7ebf\uff0c\u6700\u4f73\u914d\u7f6e\u5c06\u673a\u5668\u4eba\u8fd0\u52a8\u8bef\u5dee\u964d\u4f4e90.4%\uff0c\u7269\u4f53\u8fd0\u52a8\u8bef\u5dee\u964d\u4f4e60.2%", "\u5728 RoboLab \u57fa\u51c6\u4e0a\uff0c\u56de\u653e\u6210\u529f\u7387\u4e0e\u53c2\u8003\u6210\u529f\u7387\u7684 Pearson \u76f8\u5173\u8fbe\u5230 r=0.96\uff0c\u53ef\u7528\u4e8e\u5f00\u73af\u7b56\u7565\u8bc4\u4f30", "\u53d1\u73b0 action flow \u7684\u201c\u9006\u6a21\u5f0f\u201d\uff1a\u53ef\u4ece\u4eba\u7c7b\u6f14\u793a\u4e2d\u7684\u76ee\u6807\u7269\u4f53\u6d41\u9884\u6d4b\u517c\u5bb9\u673a\u5668\u4eba\u8fd0\u52a8\uff0c\u5e76\u901a\u8fc7\u52a8\u4f5c\u5934\u6620\u5c04\u4e3a\u53ef\u6267\u884c\u52a8\u4f5c"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u673a\u5668\u4eba\u63a7\u5236", "\u591a\u6a21\u6001", "\u6a21\u4eff\u5b66\u4e60"], "num_comments": 2, "on_hf": true, "organization": "NVIDIA", "pdf_url": "https://arxiv.org/pdf/2608.18077v1", "published_at": "2026-08-18", "score": 0.479, "selected_reasons": ["\u77e5\u540d\u673a\u6784: NVIDIA", "HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18077.png", "title": "Hydra-0: Action Flow for Generalist World Modeling and Control", "tldr": "\u7528\u50cf\u7d20\u8fd0\u52a8\u7edf\u4e00\u673a\u5668\u4eba\u4e16\u754c\u5efa\u6a21\u4e0e\u63a7\u5236", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa Hydra-0\uff0c\u4e00\u79cd\u4ee5 action flow\uff08\u5c06\u673a\u5668\u4eba\u52a8\u4f5c\u8868\u793a\u4e3a\u50cf\u7d20\u8fd0\u52a8\uff09\u4e3a\u6761\u4ef6\u7684\u901a\u7528\u4e16\u754c\u6a21\u578b\u3002\u5b83\u7528\u5171\u4eab\u89c6\u89c9\u63a5\u53e3\u8de8\u672c\u4f53\u3001\u4efb\u52a1\u3001\u73af\u5883\u548c\u89c6\u9891\u751f\u6210\u9aa8\u5e72\u5b66\u4e60\u52a8\u4f5c\u540e\u679c\uff0c\u5e76\u652f\u6301\u96f6\u6837\u672c\u7ec4\u5408\u3001\u6570\u636e\u9ad8\u6548\u9002\u914d\u4e0e\u673a\u5668\u4eba\u63a7\u5236\u3002", "why_notable": "\u5b83\u5c06\u5f02\u6784\u673a\u5668\u4eba\u6570\u636e\u3001\u89c6\u9891\u4e16\u754c\u6a21\u578b\u548c\u63a7\u5236\u63a5\u53e3\u7edf\u4e00\u5230\u50cf\u7d20\u8fd0\u52a8\u8868\u793a\u4e2d\uff0c\u4e3a\u8de8\u672c\u4f53\u6cdb\u5316\u3001\u4f4e\u6570\u636e\u9002\u914d\u548c\u65e0\u9700\u4efb\u52a1\u7ea7\u673a\u5668\u4eba\u4e13\u5bb6\u6f14\u793a\u7684\u63a7\u5236\u63d0\u4f9b\u4e86\u65b0\u8def\u5f84\u3002"}, {"abstract": "Agents learn to act through interaction with environments, yet the environments used for training are often manually constructed or synthesized around predefined tasks and benchmarks. This task-centric paradigm makes it difficult to scale environments that reflect realistic and evolving workflows where diverse tasks can naturally emerge from the underlying world. We introduce AgentMercury, a scalable framework for synthesizing executable environments from high-level business scenarios. Rather than constructing an environment for a specific task, AgentMercury first instantiates a persistent world with entities, services, tools, state, and executable cross-service invariants, from which diverse tasks and interaction trajectories can subsequently emerge. We construct 4,783 executable environments spanning 14 industries and 50 countries, and use them as training substrates for reinforcement learning. Despite being generated without targeting the evaluation benchmarks, policies trained on these business-oriented environments improve substantially on both enterprise workflows and out-of-domain benchmarks spanning reasoning, coding, scientific computing, and tool use. In our experiments, Qwen3.5-4B improves from 12.3 to 15.7 on EnterpriseOps-GYM and from 45.9 to 56.0 on AIME26 after training on AgentMercury environments. We further show that the construction process itself can be learned: fine-tuning Qwen3.5-35B-A3B on construction traces increases executable-world authoring success from 3.3% to 83.3% on held-out business scenarios. These results show that scenario-grounded environments can provide useful and generalizable learning signals beyond benchmark-specific training, while their construction can itself become a learnable capability.", "arxiv_id": "2608.20634", "arxiv_url": "https://arxiv.org/abs/2608.20634", "authors": ["Minbyul Jeong", "Chanwoong Yoon"], "brief": "\u8bba\u6587\u63d0\u51fa AgentMercury\uff0c\u4e00\u4e2a\u4ece\u9ad8\u5c42\u5546\u4e1a\u573a\u666f\u81ea\u52a8\u751f\u6210\u53ef\u6267\u884c\u73af\u5883\u7684\u6846\u67b6\u3002\u5b83\u5148\u6784\u5efa\u5305\u542b\u5b9e\u4f53\u3001\u670d\u52a1\u3001\u5de5\u5177\u3001\u72b6\u6001\u548c\u8de8\u670d\u52a1\u4e0d\u53d8\u91cf\u7684\u6301\u4e45\u4e16\u754c\uff0c\u518d\u8ba9\u591a\u6837\u4efb\u52a1\u4e0e\u4ea4\u4e92\u8f68\u8ff9\u81ea\u7136\u6d8c\u73b0\uff0c\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20634", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u6784\u5efa\u4e86 4,783 \u4e2a\u53ef\u6267\u884c\u73af\u5883\uff0c\u8986\u76d6 14 \u4e2a\u884c\u4e1a\u548c 50 \u4e2a\u56fd\u5bb6\uff0c\u9762\u5411\u771f\u5b9e\u4f01\u4e1a\u5de5\u4f5c\u6d41\u800c\u975e\u7279\u5b9a\u57fa\u51c6\u4efb\u52a1\u3002", "\u5728\u8fd9\u4e9b\u73af\u5883\u4e0a\u8bad\u7ec3\u540e\uff0cQwen3.5-4B \u5728 EnterpriseOps-GYM \u4ece 12.3 \u63d0\u5347\u5230 15.7\uff0c\u5728 AIME26 \u4ece 45.9 \u63d0\u5347\u5230 56.0\uff0c\u5e76\u8fc1\u79fb\u5230\u63a8\u7406\u3001\u4ee3\u7801\u3001\u79d1\u5b66\u8ba1\u7b97\u548c\u5de5\u5177\u4f7f\u7528\u7b49\u57df\u5916\u57fa\u51c6\u3002", "\u73af\u5883\u6784\u5efa\u80fd\u529b\u672c\u8eab\u4e5f\u53ef\u5b66\u4e60\uff1a\u7528\u6784\u5efa\u8f68\u8ff9\u5fae\u8c03 Qwen3.5-35B-A3B \u540e\uff0c\u4fdd\u7559\u5546\u4e1a\u573a\u666f\u4e0a\u7684\u53ef\u6267\u884c\u4e16\u754c\u7f16\u5199\u6210\u529f\u7387\u4ece 3.3% \u63d0\u5347\u5230 83.3%\u3002"], "keywords": ["\u667a\u80fd\u4f53", "\u5f3a\u5316\u5b66\u4e60", "\u5de5\u5177\u4f7f\u7528", "\u4f01\u4e1a\u5de5\u4f5c\u6d41"], "num_comments": 3, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20634v1", "published_at": "2026-08-21", "score": 0.413, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (7\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20634.png", "title": "AgentMercury: Your Agent Can Synthesize Verifiable Environments for Business Scenarios at scale", "tldr": "\u4ece\u5546\u4e1a\u573a\u666f\u89c4\u6a21\u5316\u5408\u6210\u53ef\u9a8c\u8bc1\u667a\u80fd\u4f53\u73af\u5883", "upvotes": 7, "what_it_is": "\u8bba\u6587\u63d0\u51fa AgentMercury\uff0c\u4e00\u4e2a\u4ece\u9ad8\u5c42\u5546\u4e1a\u573a\u666f\u81ea\u52a8\u751f\u6210\u53ef\u6267\u884c\u73af\u5883\u7684\u6846\u67b6\u3002\u5b83\u5148\u6784\u5efa\u5305\u542b\u5b9e\u4f53\u3001\u670d\u52a1\u3001\u5de5\u5177\u3001\u72b6\u6001\u548c\u8de8\u670d\u52a1\u4e0d\u53d8\u91cf\u7684\u6301\u4e45\u4e16\u754c\uff0c\u518d\u8ba9\u591a\u6837\u4efb\u52a1\u4e0e\u4ea4\u4e92\u8f68\u8ff9\u81ea\u7136\u6d8c\u73b0\uff0c\u7528\u4e8e\u5f3a\u5316\u5b66\u4e60\u8bad\u7ec3\u3002", "why_notable": "\u5b83\u628a\u667a\u80fd\u4f53\u8bad\u7ec3\u73af\u5883\u4ece\u201c\u56f4\u7ed5\u56fa\u5b9a\u4efb\u52a1\u624b\u5de5\u8bbe\u8ba1\u201d\u63a8\u8fdb\u5230\u201c\u4ece\u771f\u5b9e\u4e1a\u52a1\u4e16\u754c\u81ea\u52a8\u751f\u6210\u201d\uff0c\u6709\u671b\u663e\u8457\u6269\u5c55\u4f01\u4e1a\u7ea7\u667a\u80fd\u4f53\u8bad\u7ec3\u6570\u636e\uff0c\u5e76\u63d0\u4f9b\u53ef\u9a8c\u8bc1\u3001\u53ef\u6cdb\u5316\u7684\u4ea4\u4e92\u5b66\u4e60\u4fe1\u53f7\u3002"}, {"abstract": "Molecular science represents an important frontier for LLM-based agents. Unlike general agents that mainly operate over natural language, code, or web environments, molecular LLM agents must perceive, reason about, and act upon chemical objects across symbolic strings, molecular graphs, 3D conformations, spectra, simulations, and wet-lab measurements. Their capabilities depend on chemically faithful molecular perception, an LLM-centered agent framework, domain-specific tool grounding, and computational or experimental feedback, in addition to planning and tool use. This work develops a conceptual framework for molecular LLM agents from two complementary perspectives. First, we introduce an architectural view of molecular-agent design, covering molecular representation and perception, the agent framework, domain-specific toolboxes, and learning and optimization. Second, we propose a scientific autonomy ladder inspired by staged autonomy in engineering systems, categorizing agents into four levels: L1 assistive or fixed workflows, L2 adaptive computational agents, L3 feedback-aware physical experiment agents, and L4 scientific-agenda agents. Together, these two perspectives establish a comprehensive framework for comparing existing molecular LLM agents, identifying missing capabilities and deployment risks, and guiding the design, evaluation, and deployment of future agents in molecular discovery workflows.", "arxiv_id": "2608.23104", "arxiv_url": "https://arxiv.org/abs/2608.23104", "authors": ["Jiatong Li", "Wengyu Zhang", "Weida Wang", "Yuxuan Ren", "Wei Liu", "Chenyang Mao", "Yuqiang Li", "Yatao Bian", "Changmeng Zheng", "Xiaoyong Wei", "Qing Li"], "brief": "\u672c\u6587\u9762\u5411\u5206\u5b50\u79d1\u5b66\u4e2d\u7684LLM\u667a\u80fd\u4f53\uff0c\u6784\u5efa\u4e86\u4ece\u5206\u5b50\u8868\u5f81\u611f\u77e5\u3001\u667a\u80fd\u4f53\u67b6\u6784\u3001\u9886\u57df\u5de5\u5177\u5230\u53cd\u9988\u4f18\u5316\u7684\u6982\u5ff5\u6846\u67b6\u3002\u8bba\u6587\u8fd8\u63d0\u51fa\u56db\u7ea7\u201c\u79d1\u5b66\u81ea\u6cbb\u9636\u68af\u201d\uff0c\u7528\u4e8e\u523b\u753b\u4ece\u8f85\u52a9\u5de5\u4f5c\u6d41\u5230\u81ea\u4e3b\u63d0\u51fa\u79d1\u7814\u8bae\u7a0b\u7684\u4e0d\u540c\u80fd\u529b\u5c42\u7ea7\u3002", "categories": ["cs.CL", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23104", "impact_score": 7, "is_agent": true, "is_top": true, "key_points": ["\u5f3a\u8c03\u5206\u5b50\u667a\u80fd\u4f53\u9700\u5904\u7406SMILES\u3001\u5206\u5b50\u56fe\u30013D\u6784\u8c61\u3001\u5149\u8c31\u3001\u6a21\u62df\u4e0e\u6e7f\u5b9e\u9a8c\u6d4b\u91cf\u7b49\u591a\u6a21\u6001\u5316\u5b66\u5bf9\u8c61", "\u4ece\u67b6\u6784\u89d2\u5ea6\u68b3\u7406\u5206\u5b50\u611f\u77e5\u3001LLM\u4e2d\u5fc3\u667a\u80fd\u4f53\u6846\u67b6\u3001\u9886\u57df\u5de5\u5177\u7bb1\u3001\u5b66\u4e60\u4e0e\u4f18\u5316\u7b49\u6838\u5fc3\u6a21\u5757", "\u63d0\u51faL1\u56fa\u5b9a\u8f85\u52a9\u3001L2\u81ea\u9002\u5e94\u8ba1\u7b97\u3001L3\u5b9e\u9a8c\u53cd\u9988\u611f\u77e5\u3001L4\u79d1\u7814\u8bae\u7a0b\u81ea\u4e3b\u56db\u7ea7\u81ea\u6cbb\u5206\u7c7b"], "keywords": ["\u667a\u80fd\u4f53", "\u5206\u5b50\u79d1\u5b66", "\u79d1\u5b66\u53d1\u73b0", "\u5de5\u5177\u4f7f\u7528"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23104v1", "published_at": "2026-08-24", "score": 0.4, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": null, "title": "Molecular LLM Agents: From Architectural Design to Scientific Autonomy", "tldr": "\u63d0\u51fa\u5206\u5b50LLM\u667a\u80fd\u4f53\u8bbe\u8ba1\u4e0e\u81ea\u6cbb\u5206\u7ea7\u6846\u67b6", "upvotes": 0, "what_it_is": "\u672c\u6587\u9762\u5411\u5206\u5b50\u79d1\u5b66\u4e2d\u7684LLM\u667a\u80fd\u4f53\uff0c\u6784\u5efa\u4e86\u4ece\u5206\u5b50\u8868\u5f81\u611f\u77e5\u3001\u667a\u80fd\u4f53\u67b6\u6784\u3001\u9886\u57df\u5de5\u5177\u5230\u53cd\u9988\u4f18\u5316\u7684\u6982\u5ff5\u6846\u67b6\u3002\u8bba\u6587\u8fd8\u63d0\u51fa\u56db\u7ea7\u201c\u79d1\u5b66\u81ea\u6cbb\u9636\u68af\u201d\uff0c\u7528\u4e8e\u523b\u753b\u4ece\u8f85\u52a9\u5de5\u4f5c\u6d41\u5230\u81ea\u4e3b\u63d0\u51fa\u79d1\u7814\u8bae\u7a0b\u7684\u4e0d\u540c\u80fd\u529b\u5c42\u7ea7\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u5206\u5b50\u53d1\u73b0\u4e2d\u7684LLM\u667a\u80fd\u4f53\u63d0\u4f9b\u7edf\u4e00\u6bd4\u8f83\u4e0e\u8bbe\u8ba1\u8bed\u8a00\uff0c\u6709\u52a9\u4e8e\u8bc6\u522b\u73b0\u6709\u7cfb\u7edf\u7684\u80fd\u529b\u7f3a\u53e3\u3001\u90e8\u7f72\u98ce\u9669\u548c\u8bc4\u6d4b\u9700\u6c42\uff0c\u5bf9\u672a\u6765\u8ba1\u7b97\u2014\u5b9e\u9a8c\u95ed\u73af\u79d1\u7814\u667a\u80fd\u4f53\u5177\u6709\u6307\u5bfc\u4ef7\u503c\u3002"}, {"abstract": "General-purpose language models can reason and synthesize knowledge, but complex work also requires sustained interaction with files, information sources, and executable code, together with state maintenance, failure recovery, and verifiable delivery. We call this \\emph{working capability}: sustained, verifiable progress toward a real-world objective. Apodex 1.1 develops this capability along two complementary dimensions. \\emph{Environment Scaling} expands the diversity and verifiability of executable file, search, and code environments, while \\emph{Agentic Coordination Scaling} trains agents to decompose long-horizon tasks, delegate parallel work, integrate asynchronous results, and replan. A shared execution harness and AgentOS maintain task state and provenance across tools and agents, and training turns environment trajectories and coordination traces into reliable behavior. Across complex professional work, finance, scientific research, mathematics, coding, and search, Apodex 1.1 reaches the leading performance band despite using a substantially smaller model than many frontier systems. The 35B-parameter Apodex 1.1 Mini further retains strong working capability in a locally deployable form. These results ground agentic intelligence in useful, verifiable work completed over time and advance our goal of building a \\emph{Heavy-Duty Solver} for ambitious, long-running tasks.", "arxiv_id": "2608.23283", "arxiv_url": "https://arxiv.org/abs/2608.23283", "authors": ["Apodex Team", "B. An", "B. Li", "B. Wang", "B. Zhang", "B. L. Wang", "C. Feng", "C. Wei", "C. Xue", "C. Zhang", "D. Ng", "D. Ye", "E. Min", "F. Chen", "F. Liu", "F. Yang", "F. Ye", "H. Xu", "H. Yang", "H. Ye", "H. Zhang", "H. Zhao", "J. Li", "J. Lin", "J. Xia", "K. Jin", "K. Wang", "K. Yang", "L. Bing", "L. Lei", "L. Su", "Le. Wang", "Lu. Wang", "N. Wang", "Q. Ren", "Q. Yang", "R. Li", "S. Bai", "S. Du", "S. Li", "S. Lin", "S. Nie", "S. Wang", "S. Zhang", "S. Z. Wang", "Ta. Q. Fang", "Ti. Q. Fang", "W. Fang", "W. Li", "W. Zhang", "X. Chen", "X. Li", "X. Tang", "X. Wang", "X. Xu", "X. Zhang", "X. Q. Wang", "X. Y. Wang", "Y. Deng", "Y. Gao", "Y. Hu", "Y. Li", "Y. Sui", "Y. Wang", "Y. Xiao", "Y. Zhang", "Z. Chen", "Z. Cheng", "Z. Feng", "Z. Liang", "Z. Zhang"], "brief": "Apodex 1.1 \u63d0\u51fa\u4e00\u79cd\u63d0\u5347\u201c\u5de5\u4f5c\u80fd\u529b\u201d\u7684\u667a\u80fd\u4f53\u8bad\u7ec3\u4e0e\u8fd0\u884c\u6846\u67b6\uff0c\u5f3a\u8c03\u5728\u6587\u4ef6\u3001\u641c\u7d22\u3001\u4ee3\u7801\u7b49\u53ef\u6267\u884c\u73af\u5883\u4e2d\u6301\u7eed\u63a8\u8fdb\u771f\u5b9e\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u73af\u5883\u6269\u5c55\u4e0e\u667a\u80fd\u4f53\u534f\u540c\u6269\u5c55\uff0c\u8ba9\u6a21\u578b\u80fd\u5206\u89e3\u957f\u7a0b\u4efb\u52a1\u3001\u5e76\u884c\u59d4\u6d3e\u3001\u6574\u5408\u5f02\u6b65\u7ed3\u679c\u5e76\u91cd\u89c4\u5212\u3002", "categories": ["cs.AI", "cs.CL", "cs.LG"], "github_repo": "https://github.com/ApodexAI/FrontierAgent", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23283", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["Environment Scaling \u6269\u5c55\u53ef\u9a8c\u8bc1\u7684\u6587\u4ef6\u3001\u641c\u7d22\u3001\u4ee3\u7801\u6267\u884c\u73af\u5883\uff0c\u589e\u5f3a\u771f\u5b9e\u5de5\u4f5c\u4e2d\u7684\u4ea4\u4e92\u4e0e\u4ea4\u4ed8\u80fd\u529b", "Agentic Coordination Scaling \u8bad\u7ec3\u667a\u80fd\u4f53\u8fdb\u884c\u957f\u7a0b\u4efb\u52a1\u5206\u89e3\u3001\u5e76\u884c\u534f\u4f5c\u3001\u5f02\u6b65\u7ed3\u679c\u6574\u5408\u548c\u5931\u8d25\u6062\u590d", "\u5171\u4eab\u6267\u884c\u6846\u67b6\u4e0e AgentOS \u7ef4\u62a4\u8de8\u5de5\u5177\u3001\u8de8\u667a\u80fd\u4f53\u7684\u4efb\u52a1\u72b6\u6001\u548c\u6eaf\u6e90\uff0c\u5e76\u5c06\u73af\u5883\u8f68\u8ff9\u4e0e\u534f\u540c traces \u8f6c\u5316\u4e3a\u8bad\u7ec3\u4fe1\u53f7"], "keywords": ["\u667a\u80fd\u4f53", "\u957f\u7a0b\u4efb\u52a1", "\u5de5\u5177\u4f7f\u7528", "\u534f\u540c\u63a8\u7406"], "num_comments": 1, "on_hf": true, "organization": "Apodex", "pdf_url": "https://arxiv.org/pdf/2608.23283v1", "published_at": "2026-08-24", "score": 0.396, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.23283.png", "title": "Apodex 1.1: Scaling Agentic Intelligence for Complex Work", "tldr": "\u9762\u5411\u590d\u6742\u5de5\u4f5c\u7684\u957f\u7a0b\u667a\u80fd\u4f53\u7cfb\u7edf", "upvotes": 4, "what_it_is": "Apodex 1.1 \u63d0\u51fa\u4e00\u79cd\u63d0\u5347\u201c\u5de5\u4f5c\u80fd\u529b\u201d\u7684\u667a\u80fd\u4f53\u8bad\u7ec3\u4e0e\u8fd0\u884c\u6846\u67b6\uff0c\u5f3a\u8c03\u5728\u6587\u4ef6\u3001\u641c\u7d22\u3001\u4ee3\u7801\u7b49\u53ef\u6267\u884c\u73af\u5883\u4e2d\u6301\u7eed\u63a8\u8fdb\u771f\u5b9e\u4efb\u52a1\u3002\u5b83\u901a\u8fc7\u73af\u5883\u6269\u5c55\u4e0e\u667a\u80fd\u4f53\u534f\u540c\u6269\u5c55\uff0c\u8ba9\u6a21\u578b\u80fd\u5206\u89e3\u957f\u7a0b\u4efb\u52a1\u3001\u5e76\u884c\u59d4\u6d3e\u3001\u6574\u5408\u5f02\u6b65\u7ed3\u679c\u5e76\u91cd\u89c4\u5212\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u628a\u667a\u80fd\u4f53\u80fd\u529b\u4ece\u5355\u8f6e\u63a8\u7406\u63a8\u8fdb\u5230\u53ef\u9a8c\u8bc1\u3001\u957f\u65f6\u95f4\u6267\u884c\u7684\u590d\u6742\u5de5\u4f5c\u6d41\uff0c\u5e76\u58f0\u79f0\u7528\u8f83\u5c0f\u6a21\u578b\u8fbe\u5230\u524d\u6cbf\u7cfb\u7edf\u6027\u80fd\u533a\u95f4\uff1b35B Mini \u7248\u672c\u8fd8\u5177\u5907\u672c\u5730\u90e8\u7f72\u6f5c\u529b\uff0c\u5177\u6709\u8f83\u5f3a\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Modern software systems accumulate technical debt over decades of development, which makes migration expensive and largely manual. As coding agents become increasingly capable at bug fixing, can they autonomously perform such migrations? Existing benchmarks cannot answer this question because they evaluate only behavioural correctness, not whether the migration actually occurred. This leads an easy hack: agents copy the original implementation to make tests pass. We call this Blindness. To address this problem, we introduce SWE Refactor Bench, a benchmark comprising 20 whole-repository migrations, covering 4 kinds of technical debt. A three-stage evaluation protocol measures both migration completeness and behavioural correctness. (1) Migration Audit verifies that the migration occurred. (2) Behavioural Tests measure correctness with a fixed test suite. (3) Agentic Verification uses 6 independent coding agents to generate targeted tests for hidden behavioural differences. Across 520 runs from 8 frontier models and 26 model-effort configurations, only 28 of 520 runs ($5.4\\%$) pass all three stages, 13 of the 20 tasks receive no accepted solution, and the best model (claude-opus-5) scores $47.0/100$. Migration completeness and behavioural correctness are distinct abilities: a few runs preserve behaviour by skipping the migration and are stopped at Migration Audit; most attempt it and break behaviour, and are stopped at Behavioural Tests. Agents cannot deliver a perfect migration: among the 340 runs that pass Migration Audit, $58\\%$ reach $99\\%$ of the fixed checks, yet only $26\\%$ reach $100\\%$. Agent capability differs across migration categories: agents score $31.4$ on build toolchain rewrites but only $5.6$ on language rewrites. Together, these findings position SWE Refactor Bench as a rigorous testbed for developing coding agents for reliable whole-repository migrations.", "arxiv_id": "2608.23564", "arxiv_url": "https://arxiv.org/abs/2608.23564", "authors": ["Deyao Hong", "Yizhe Chi", "Wenyi Li", "Xiaoqiu Wang", "Mingju Gao", "Kaisen Yang", "Bingxiang He", "Youjie Zheng", "Calvin Xiao", "Qinhuai Na"], "brief": "\u8bba\u6587\u63d0\u51fa SWE Refactor Bench\uff0c\u5305\u542b20\u4e2a\u5168\u4ed3\u5e93\u7ea7\u6280\u672f\u503a\u8fc1\u79fb\u4efb\u52a1\uff0c\u8986\u76d64\u7c7b\u8fc1\u79fb\u573a\u666f\u3002\u5b83\u901a\u8fc7\u201c\u8fc1\u79fb\u5ba1\u8ba1\u3001\u884c\u4e3a\u6d4b\u8bd5\u3001\u667a\u80fd\u4f53\u9a8c\u8bc1\u201d\u4e09\u9636\u6bb5\u534f\u8bae\uff0c\u540c\u65f6\u8bc4\u4f30\u8fc1\u79fb\u662f\u5426\u771f\u6b63\u5b8c\u6210\u53ca\u884c\u4e3a\u662f\u5426\u4fdd\u6301\u6b63\u786e\u3002", "categories": ["cs.CL", "cs.AI", "cs.SE"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23564", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u73b0\u6709\u57fa\u51c6\u53ea\u770b\u6d4b\u8bd5\u662f\u5426\u901a\u8fc7\uff0c\u5bb9\u6613\u8ba9\u667a\u80fd\u4f53\u590d\u5236\u65e7\u5b9e\u73b0\u7ed5\u8fc7\u8fc1\u79fb\uff1b\u8bba\u6587\u5c06\u8fd9\u4e00\u95ee\u9898\u79f0\u4e3a Blindness\uff0c\u5e76\u7528\u8fc1\u79fb\u5ba1\u8ba1\u663e\u5f0f\u68c0\u6d4b\u3002", "\u57288\u4e2a\u524d\u6cbf\u6a21\u578b\u300126\u79cd\u914d\u7f6e\u7684520\u6b21\u8fd0\u884c\u4e2d\uff0c\u4ec528\u6b21\uff085.4%\uff09\u901a\u8fc7\u5168\u90e8\u4e09\u9636\u6bb5\uff0c20\u4e2a\u4efb\u52a1\u4e2d\u670913\u4e2a\u6ca1\u6709\u4efb\u4f55\u5408\u683c\u89e3\u3002", "\u6700\u4f73\u6a21\u578b claude-opus-5 \u5f97\u5206\u4ec547.0/100\uff1b\u667a\u80fd\u4f53\u5728\u6784\u5efa\u5de5\u5177\u94fe\u91cd\u5199\u4e0a\u5f97\u520631.4\uff0c\u4f46\u5728\u8bed\u8a00\u91cd\u5199\u4e0a\u4ec55.6\uff0c\u663e\u793a\u957f\u7a0b\u8fc1\u79fb\u80fd\u529b\u4ecd\u660e\u663e\u4e0d\u8db3\u3002"], "keywords": ["\u4ee3\u7801\u667a\u80fd\u4f53", "\u8f6f\u4ef6\u5de5\u7a0b", "\u57fa\u51c6\u8bc4\u6d4b", "\u4ee3\u7801\u8fc1\u79fb"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23564v1", "published_at": "2026-08-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SWE Refactor Bench: Can Coding Agents Complete a Long-Horizon, Whole-Repository Stack Migration?", "tldr": "\u65b0\u57fa\u51c6\u8bc4\u6d4b\u4ee3\u7801\u667a\u80fd\u4f53\u5168\u4ed3\u5e93\u8fc1\u79fb\u80fd\u529b", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa SWE Refactor Bench\uff0c\u5305\u542b20\u4e2a\u5168\u4ed3\u5e93\u7ea7\u6280\u672f\u503a\u8fc1\u79fb\u4efb\u52a1\uff0c\u8986\u76d64\u7c7b\u8fc1\u79fb\u573a\u666f\u3002\u5b83\u901a\u8fc7\u201c\u8fc1\u79fb\u5ba1\u8ba1\u3001\u884c\u4e3a\u6d4b\u8bd5\u3001\u667a\u80fd\u4f53\u9a8c\u8bc1\u201d\u4e09\u9636\u6bb5\u534f\u8bae\uff0c\u540c\u65f6\u8bc4\u4f30\u8fc1\u79fb\u662f\u5426\u771f\u6b63\u5b8c\u6210\u53ca\u884c\u4e3a\u662f\u5426\u4fdd\u6301\u6b63\u786e\u3002", "why_notable": "\u8be5\u57fa\u51c6\u628a\u4ee3\u7801\u667a\u80fd\u4f53\u4ece\u77ed\u7a0b\u4fee bug \u8bc4\u6d4b\u63a8\u8fdb\u5230\u957f\u7a0b\u3001\u5168\u4ed3\u5e93\u3001\u771f\u5b9e\u6280\u672f\u503a\u8fc1\u79fb\u8bc4\u6d4b\uff0c\u5e76\u63ed\u793a\u5f53\u524d\u524d\u6cbf\u6a21\u578b\u5728\u53ef\u9760\u91cd\u6784\u8fc1\u79fb\u4e0a\u8fdc\u672a\u8fbe\u5230\u53ef\u6258\u4ed8\u6c34\u5e73\u3002"}, {"abstract": "Self-reflection is a powerful mechanism for credit assignment in human learning, converting sparse outcome feedback into actionable guidance. However, its potential for post-training Large Language Models (LLMs) remains underexplored. We propose Self-Reflective Policy Optimization (SRPO), a framework that internalizes this capability. SRPO enables LLMs to analyze their own completed trajectories, synthesize errors into concise \"reflection patches,\" and use reflection-conditioned teacher scores on student on-policy rollouts as dense token-level training signals. This process effectively transforms sparse terminal supervision into dense, token-level learning signals without requiring external critics, separate reward models, or larger teacher models. We demonstrate that SRPO achieves state-of-the-art performance across mathematical reasoning and long-horizon agentic benchmarks with exceptional data efficiency. Using a Qwen3-8B base model, SRPO attains 73.3% on AIME\u002724 using only 8% (0.08x) of the training FLOPs required by scaled supervised fine-tuning, while significantly improving success rates on WebShop (64.7%), ALFWorld (76.8%), and SWE-Bench-Lite (31.2%). Code is available at https://github.com/Galleons2029/SRPO", "arxiv_id": "2608.23493", "arxiv_url": "https://arxiv.org/abs/2608.23493", "authors": ["Jialong Liu", "Yuling Shi", "Ning Yang", "Xiaodong Gu", "Zuchao Li"], "brief": "\u63d0\u51fa Self-Reflective Policy Optimization\uff08SRPO\uff09\uff0c\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u5206\u6790\u81ea\u8eab\u5df2\u5b8c\u6210\u8f68\u8ff9\uff0c\u751f\u6210\u7b80\u6d01\u7684\u201c\u53cd\u601d\u8865\u4e01\u201d\u3002\u8fd9\u4e9b\u53cd\u601d\u518d\u7528\u4e8e\u5bf9\u5b66\u751f\u6a21\u578b\u7684\u5728\u7b56\u7565 rollout \u6253\u5206\uff0c\u8f6c\u5316\u4e3a\u7a20\u5bc6\u7684 token \u7ea7\u8bad\u7ec3\u4fe1\u53f7\u3002", "categories": ["cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23493", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u7a00\u758f\u7684\u7ec8\u5c40\u53cd\u9988\u8f6c\u5316\u4e3a token \u7ea7\u76d1\u7763\uff0c\u65e0\u9700\u5916\u90e8 critic\u3001\u72ec\u7acb\u5956\u52b1\u6a21\u578b\u6216\u66f4\u5927\u6559\u5e08\u6a21\u578b", "\u57fa\u4e8e Qwen3-8B\uff0c\u5728\u4ec5\u4f7f\u7528\u6269\u5c55\u76d1\u7763\u5fae\u8c03 8% \u8bad\u7ec3 FLOPs \u7684\u60c5\u51b5\u4e0b\uff0cAIME\u002724 \u8fbe\u5230 73.3%", "\u5728\u957f\u7a0b\u667a\u80fd\u4f53\u4efb\u52a1\u4e0a\u63d0\u5347\u660e\u663e\uff1aWebShop 64.7%\u3001ALFWorld 76.8%\u3001SWE-Bench-Lite 31.2%"], "keywords": ["\u5927\u8bed\u8a00\u6a21\u578b", "\u5f3a\u5316\u5b66\u4e60", "\u957f\u7a0b\u63a8\u7406", "\u667a\u80fd\u4f53"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23493v1", "published_at": "2026-08-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "SRPO: Self-Reflective Policy Optimization for Long-Horizon Reasoning", "tldr": "\u8ba9LLM\u81ea\u6211\u53cd\u601d\u751f\u6210\u5bc6\u96c6\u8bad\u7ec3\u4fe1\u53f7", "upvotes": 0, "what_it_is": "\u63d0\u51fa Self-Reflective Policy Optimization\uff08SRPO\uff09\uff0c\u8ba9\u5927\u8bed\u8a00\u6a21\u578b\u5206\u6790\u81ea\u8eab\u5df2\u5b8c\u6210\u8f68\u8ff9\uff0c\u751f\u6210\u7b80\u6d01\u7684\u201c\u53cd\u601d\u8865\u4e01\u201d\u3002\u8fd9\u4e9b\u53cd\u601d\u518d\u7528\u4e8e\u5bf9\u5b66\u751f\u6a21\u578b\u7684\u5728\u7b56\u7565 rollout \u6253\u5206\uff0c\u8f6c\u5316\u4e3a\u7a20\u5bc6\u7684 token \u7ea7\u8bad\u7ec3\u4fe1\u53f7\u3002", "why_notable": "SRPO\u628a\u201c\u81ea\u6211\u53cd\u601d\u201d\u673a\u5236\u5185\u5316\u4e3a\u540e\u8bad\u7ec3\u65b9\u6cd5\uff0c\u5728\u63a8\u7406\u4e0e\u957f\u7a0b\u667a\u80fd\u4f53\u4efb\u52a1\u4e2d\u517c\u987e\u6027\u80fd\u548c\u6570\u636e\u6548\u7387\uff0c\u4e3a\u4f4e\u6210\u672c\u5f3a\u5316LLM\u957f\u7a0b\u4fe1\u7528\u5206\u914d\u63d0\u4f9b\u4e86\u5b9e\u7528\u8def\u5f84\u3002"}, {"abstract": "Time series forecasting (TSF) is evolving toward multimodal and agentic settings, yet using foundation models remains uneconomical in resource-constrained scenarios, where compact, specialized forecasters are more desirable. However, lightweight forecasters typically require substantial training data, limiting their use in domains with scarce, slowly accumulated, or privacy-sensitive time series. To address this dilemma, we investigate the challenging problem of few-shot learning for lightweight forecasters. We propose MetaCaster, a meta-harness-optimized multi-agent framework that uses agentic data generation to automatically train specialized lightweight forecasters from only a few examples and textual contexts. Our work highlights a new TSF paradigm in which agents act not as forecasters but as intermediary engineers that prepare efficient, task-specific forecasters for deployment. Experiments on 18 datasets, 23 state-of-the-art lightweight forecasters, and 14 baselines demonstrate that MetaCaster achieves both data efficiency and computational efficiency while maintaining high-quality TSF performance.", "arxiv_id": "2608.23473", "arxiv_url": "https://arxiv.org/abs/2608.23473", "authors": ["ChengAo Shen", "Wenchao Yu", "Fangyu Wu", "Dongjin Song", "Hanghang Tong", "Dongsheng Luo", "Wei Cheng", "Haifeng Chen", "Jingchao Ni"], "brief": "\u8bba\u6587\u63d0\u51fa MetaCaster\uff0c\u4e00\u4e2a\u5143\u8bc4\u6d4b\u4f18\u5316\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u4ec5\u51ed\u5c11\u91cf\u6837\u672c\u548c\u6587\u672c\u4e0a\u4e0b\u6587\u81ea\u52a8\u751f\u6210\u6570\u636e\u5e76\u8bad\u7ec3\u4e13\u7528\u8f7b\u91cf\u7ea7\u65f6\u5e8f\u9884\u6d4b\u6a21\u578b\u3002\u5176\u6838\u5fc3\u601d\u8def\u662f\u8ba9\u667a\u80fd\u4f53\u5145\u5f53\u201c\u5de5\u7a0b\u5e08\u201d\uff0c\u800c\u975e\u76f4\u63a5\u9884\u6d4b\u5668\uff0c\u4e3a\u90e8\u7f72\u51c6\u5907\u9ad8\u6548\u4efb\u52a1\u5b9a\u5236\u6a21\u578b\u3002", "categories": ["cs.LG", "cs.AI"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.23473", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u9762\u5411\u5c11\u6837\u672c\u8f7b\u91cf\u7ea7\u65f6\u5e8f\u9884\u6d4b\uff0c\u7f13\u89e3\u5c0f\u6a21\u578b\u4f9d\u8d56\u5927\u91cf\u8bad\u7ec3\u6570\u636e\u7684\u95ee\u9898", "\u5229\u7528 agentic data generation \u4ece\u5c11\u91cf\u793a\u4f8b\u548c\u6587\u672c\u4e0a\u4e0b\u6587\u4e2d\u6784\u9020\u8bad\u7ec3\u6570\u636e", "\u572818\u4e2a\u6570\u636e\u96c6\u300123\u79cd\u5148\u8fdb\u8f7b\u91cf\u9884\u6d4b\u5668\u548c14\u4e2a\u57fa\u7ebf\u65b9\u6cd5\u4e0a\u9a8c\u8bc1\u4e86\u6570\u636e\u6548\u7387\u4e0e\u8ba1\u7b97\u6548\u7387"], "keywords": ["\u667a\u80fd\u4f53", "\u65f6\u5e8f\u9884\u6d4b", "\u5c11\u6837\u672c\u5b66\u4e60", "\u8f7b\u91cf\u6a21\u578b"], "num_comments": 0, "on_hf": false, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.23473v1", "published_at": "2026-08-24", "score": 0.35, "selected_reasons": ["\u4e0e computer use / agent \u76f8\u5173", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": null, "title": "MetaCaster: Meta-Harness-Optimized Agent for End-to-End Few-Shot Learning of Lightweight Time Series Forecasters", "tldr": "\u7528\u591a\u667a\u80fd\u4f53\u5c11\u6837\u672c\u8bad\u7ec3\u8f7b\u91cf\u65f6\u5e8f\u9884\u6d4b\u5668", "upvotes": 0, "what_it_is": "\u8bba\u6587\u63d0\u51fa MetaCaster\uff0c\u4e00\u4e2a\u5143\u8bc4\u6d4b\u4f18\u5316\u7684\u591a\u667a\u80fd\u4f53\u6846\u67b6\uff0c\u53ef\u4ec5\u51ed\u5c11\u91cf\u6837\u672c\u548c\u6587\u672c\u4e0a\u4e0b\u6587\u81ea\u52a8\u751f\u6210\u6570\u636e\u5e76\u8bad\u7ec3\u4e13\u7528\u8f7b\u91cf\u7ea7\u65f6\u5e8f\u9884\u6d4b\u6a21\u578b\u3002\u5176\u6838\u5fc3\u601d\u8def\u662f\u8ba9\u667a\u80fd\u4f53\u5145\u5f53\u201c\u5de5\u7a0b\u5e08\u201d\uff0c\u800c\u975e\u76f4\u63a5\u9884\u6d4b\u5668\uff0c\u4e3a\u90e8\u7f72\u51c6\u5907\u9ad8\u6548\u4efb\u52a1\u5b9a\u5236\u6a21\u578b\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c06\u667a\u80fd\u4f53\u7528\u4e8e\u81ea\u52a8\u6784\u5efa\u548c\u9002\u914d\u8f7b\u91cf\u9884\u6d4b\u5668\uff0c\u4e3a\u8d44\u6e90\u53d7\u9650\u3001\u6570\u636e\u7a00\u7f3a\u6216\u9690\u79c1\u654f\u611f\u573a\u666f\u63d0\u4f9b\u4e86\u66f4\u7ecf\u6d4e\u7684\u65f6\u5e8f\u9884\u6d4b\u8303\u5f0f\u3002"}, {"abstract": "Semantic vision encoders have become a central visual interface for multimodal understanding and semantic conditioning in image generation. However, their final tokens discard fine-grained visual details, leading to poor pixel reconstruction and limiting their use in reconstruction-sensitive tasks such as image generation and editing. In this work, we ask whether understanding, generation, and editing can be modeled in a single visual representation space built from a pretrained semantic ViT. We show that the frozen Transformer blocks of a semantic ViT are not intrinsically unable to preserve visual details. Instead, the original patch parameterization drives the representation toward semantic abstraction, making fine-grained information difficult to recover from the final tokens. Based on this observation, we introduce \\emph{Patch Reparameterization}, which preserves the original semantic pathway while adding a reconstruction-aware patch embedding that provides fine-grained visual information to the same frozen ViT blocks. The resulting unified representation preserves multimodal understanding while enabling high-fidelity image reconstruction and a favorable reconstruction--generation trade-off. We further scale this representation into \\emph{UniSpace}, an 8B Mixture-of-Transformer-Experts model that performs understanding, generation, and editing in the same visual space without a separate VAE pathway. System-level evaluations demonstrate practical text-to-image generation and instruction-based image editing, showing that a reparameterized pretrained ViT can serve as a unified visual interface for scalable multimodal modeling.", "arxiv_id": "2608.08676", "arxiv_url": "https://arxiv.org/abs/2608.08676", "authors": ["Jinbo Yan", "Limeng Qiao", "Jie Qin", "Junyan He", "Feize Wu", "Guanglu Wan"], "brief": "\u8bba\u6587\u63d0\u51fa Patch Reparameterization\uff0c\u5728\u9884\u8bad\u7ec3\u8bed\u4e49 ViT \u4e2d\u52a0\u5165\u91cd\u5efa\u611f\u77e5\u7684 patch embedding\uff0c\u540c\u65f6\u4fdd\u7559\u539f\u6709\u8bed\u4e49\u8def\u5f84\uff0c\u4f7f\u540c\u4e00\u51bb\u7ed3 ViT \u8868\u5f81\u517c\u987e\u8bed\u4e49\u7406\u89e3\u4e0e\u7ec6\u7c92\u5ea6\u91cd\u5efa\u3002\u57fa\u4e8e\u6b64\u6784\u5efa UniSpace\uff0c\u4e00\u4e2a 8B Mixture-of-Transformer-Experts \u591a\u6a21\u6001\u6a21\u578b\uff0c\u65e0\u9700\u72ec\u7acb VAE \u5373\u53ef\u5728\u7edf\u4e00\u89c6\u89c9\u7a7a\u95f4\u4e2d\u5b8c\u6210\u7406\u89e3\u3001\u6587\u751f\u56fe\u548c\u6307\u4ee4\u5f0f\u56fe\u50cf\u7f16\u8f91\u3002", "categories": ["cs.CV", "cs.AI"], "github_repo": "https://github.com/yjb6/UniSpace", "github_stars": 6, "hf_url": "https://huggingface.co/papers/2608.08676", "impact_score": 8, "is_agent": false, "is_top": true, "key_points": ["\u6307\u51fa\u8bed\u4e49 ViT \u672b\u5c42 token \u4e22\u5931\u7ec6\u8282\u5e76\u975e Transformer \u5757\u672c\u8eab\u9650\u5236\uff0c\u800c\u662f\u539f\u59cb patch \u53c2\u6570\u5316\u4fc3\u4f7f\u8868\u5f81\u8fc7\u5ea6\u8bed\u4e49\u62bd\u8c61\u3002", "Patch Reparameterization \u901a\u8fc7\u91cd\u5efa\u611f\u77e5 patch embedding \u5411\u540c\u4e00\u51bb\u7ed3 ViT \u6ce8\u5165\u7ec6\u7c92\u5ea6\u89c6\u89c9\u4fe1\u606f\uff0c\u6539\u5584\u50cf\u7d20\u7ea7\u91cd\u5efa\u8d28\u91cf\u3002", "UniSpace \u6269\u5c55\u4e3a 8B \u6df7\u5408 Transformer \u4e13\u5bb6\u6a21\u578b\uff0c\u5728\u7edf\u4e00\u89c6\u89c9\u8868\u5f81\u7a7a\u95f4\u4e2d\u652f\u6301\u56fe\u50cf\u7406\u89e3\u3001\u751f\u6210\u548c\u7f16\u8f91\uff0c\u5e76\u5c55\u793a\u5b9e\u7528\u7ea7\u7cfb\u7edf\u6548\u679c\u3002"], "keywords": ["\u591a\u6a21\u6001", "\u89c6\u89c9\u8868\u5f81", "\u56fe\u50cf\u751f\u6210", "\u56fe\u50cf\u7f16\u8f91"], "num_comments": 2, "on_hf": true, "organization": "LongCat", "pdf_url": "https://arxiv.org/pdf/2608.08676v1", "published_at": "2026-08-09", "score": 0.286, "selected_reasons": ["HF trending (10\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.08676.png", "title": "UniSpace: Unified Visual Representation and Scalable Multimodal Modeling", "tldr": "\u7528\u91cd\u53c2\u6570\u5316ViT\u7edf\u4e00\u7406\u89e3\u3001\u751f\u6210\u4e0e\u7f16\u8f91", "upvotes": 10, "what_it_is": "\u8bba\u6587\u63d0\u51fa Patch Reparameterization\uff0c\u5728\u9884\u8bad\u7ec3\u8bed\u4e49 ViT \u4e2d\u52a0\u5165\u91cd\u5efa\u611f\u77e5\u7684 patch embedding\uff0c\u540c\u65f6\u4fdd\u7559\u539f\u6709\u8bed\u4e49\u8def\u5f84\uff0c\u4f7f\u540c\u4e00\u51bb\u7ed3 ViT \u8868\u5f81\u517c\u987e\u8bed\u4e49\u7406\u89e3\u4e0e\u7ec6\u7c92\u5ea6\u91cd\u5efa\u3002\u57fa\u4e8e\u6b64\u6784\u5efa UniSpace\uff0c\u4e00\u4e2a 8B Mixture-of-Transformer-Experts \u591a\u6a21\u6001\u6a21\u578b\uff0c\u65e0\u9700\u72ec\u7acb VAE \u5373\u53ef\u5728\u7edf\u4e00\u89c6\u89c9\u7a7a\u95f4\u4e2d\u5b8c\u6210\u7406\u89e3\u3001\u6587\u751f\u56fe\u548c\u6307\u4ee4\u5f0f\u56fe\u50cf\u7f16\u8f91\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u5c1d\u8bd5\u6253\u7834\u591a\u6a21\u6001\u7cfb\u7edf\u4e2d\u201c\u8bed\u4e49\u7f16\u7801\u5668\u7528\u4e8e\u7406\u89e3\u3001VAE \u7528\u4e8e\u751f\u6210\u91cd\u5efa\u201d\u7684\u5206\u79bb\u8bbe\u8ba1\uff0c\u8bc1\u660e\u9884\u8bad\u7ec3\u8bed\u4e49 ViT \u53ef\u901a\u8fc7\u91cd\u53c2\u6570\u5316\u6210\u4e3a\u7edf\u4e00\u89c6\u89c9\u63a5\u53e3\uff0c\u5bf9\u53ef\u6269\u5c55\u591a\u6a21\u6001\u5efa\u6a21\u3001\u56fe\u50cf\u751f\u6210\u4e0e\u7f16\u8f91\u67b6\u6784\u5177\u6709\u91cd\u8981\u542f\u53d1\u3002"}, {"abstract": "Parallel reasoning improves the accuracy and robustness of large reasoning models by exploring multiple solution paths, but its computational cost grows with reasoning depth and branch count. Existing methods for managing these parallel paths typically rely on final-answer consensus, local token confidence, or isolated intermediate probes. However, these signals are often delayed, weakly tied to actual reasoning progress, or too noisy for dynamic, branch-level control. To address these limitations, we introduce ParaTempo, a training-free asynchronous parallel reasoning framework. ParaTempo is driven by temporal confidence, a branch-local measure of answer-space convergence. Each branch is periodically probed for a tentative answer probability distribution, and temporal confidence quantifies how sharply the recent intermediate probes concentrate on a dominant answer. Once sufficient evidence has accumulated, ParaTempo drives its entire control process from this single signal: low-confidence branches are pruned, branches that persistently commit to their dominant answer are retired early, freed computation is reallocated by forking new branches, and generation stops globally once the confidence-weighted vote concentrates. Without requiring synchronization among reasoning trajectories, ParaTempo adaptively allocates computation based on branch-level convergence. Experiments on challenging mathematical and scientific reasoning benchmarks show that ParaTempo reduces average latency by 21.8-32.2% and total token usage by 18.1-30.3% while maintaining competitive accuracy. Moreover, temporal confidence exhibits stronger temporal stability and predictive power for future branch convergence than token-level and instantaneous signals.", "arxiv_id": "2608.16425", "arxiv_url": "https://arxiv.org/abs/2608.16425", "authors": ["Xuteng Zhang", "Wenhao Zeng", "Xiaodong Gu", "Chao Hu", "Haotian Lin", "Yuling Shi", "Min Wang", "Beijun Shen"], "brief": "ParaTempo \u662f\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5f02\u6b65\u5e76\u884c\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u8861\u91cf\u5404\u63a8\u7406\u5206\u652f\u5728\u7b54\u6848\u7a7a\u95f4\u4e2d\u7684\u65f6\u95f4\u6536\u655b\u7a0b\u5ea6\uff0c\u52a8\u6001\u51b3\u5b9a\u526a\u679d\u3001\u63d0\u524d\u505c\u6b62\u3001\u5206\u53c9\u548c\u5168\u5c40\u7ec8\u6b62\u3002", "categories": ["cs.AI"], "github_repo": "https://github.com/ScottZhang812/ParaTempo", "github_stars": 2, "hf_url": "https://huggingface.co/papers/2608.16425", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u63d0\u51fa temporal confidence\uff1a\u57fa\u4e8e\u8fd1\u671f\u4e2d\u95f4\u63a2\u6d4b\u7b54\u6848\u5206\u5e03\u662f\u5426\u6301\u7eed\u96c6\u4e2d\u5230\u4e3b\u5bfc\u7b54\u6848\uff0c\u4f5c\u4e3a\u5206\u652f\u7ea7\u63a7\u5236\u4fe1\u53f7\u3002", "\u65e0\u9700\u540c\u6b65\u4e0d\u540c\u63a8\u7406\u8f68\u8ff9\uff0c\u53ef\u5f02\u6b65\u526a\u9664\u4f4e\u7f6e\u4fe1\u5206\u652f\u3001\u63d0\u524d\u9000\u4f11\u7a33\u5b9a\u5206\u652f\uff0c\u5e76\u5c06\u91ca\u653e\u7684\u8ba1\u7b97\u9884\u7b97\u91cd\u65b0\u5206\u914d\u7ed9\u65b0\u5206\u652f\u3002", "\u5728\u6570\u5b66\u4e0e\u79d1\u5b66\u63a8\u7406\u57fa\u51c6\u4e0a\uff0c\u5e73\u5747\u5ef6\u8fdf\u964d\u4f4e21.8-32.2%\uff0c\u603b token \u4f7f\u7528\u51cf\u5c1118.1-30.3%\uff0c\u540c\u65f6\u4fdd\u6301\u6709\u7ade\u4e89\u529b\u7684\u51c6\u786e\u7387\u3002"], "keywords": ["\u5e76\u884c\u63a8\u7406", "\u5927\u8bed\u8a00\u6a21\u578b", "\u7f6e\u4fe1\u5ea6\u4f30\u8ba1", "\u63a8\u7406\u52a0\u901f"], "num_comments": 3, "on_hf": true, "organization": "Shanghai Jiao Tong University", "pdf_url": "https://arxiv.org/pdf/2608.16425v1", "published_at": "2026-08-17", "score": 0.282, "selected_reasons": ["HF trending (29\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16425.png", "title": "ParaTempo: Efficient Parallel Reasoning via Temporal Confidence", "tldr": "\u7528\u65f6\u95f4\u7f6e\u4fe1\u5ea6\u52a0\u901f\u5e76\u884c\u63a8\u7406\u3002", "upvotes": 29, "what_it_is": "ParaTempo \u662f\u4e00\u79cd\u65e0\u9700\u8bad\u7ec3\u7684\u5f02\u6b65\u5e76\u884c\u63a8\u7406\u6846\u67b6\uff0c\u901a\u8fc7\u8861\u91cf\u5404\u63a8\u7406\u5206\u652f\u5728\u7b54\u6848\u7a7a\u95f4\u4e2d\u7684\u65f6\u95f4\u6536\u655b\u7a0b\u5ea6\uff0c\u52a8\u6001\u51b3\u5b9a\u526a\u679d\u3001\u63d0\u524d\u505c\u6b62\u3001\u5206\u53c9\u548c\u5168\u5c40\u7ec8\u6b62\u3002", "why_notable": "\u76f8\u6bd4\u6700\u7ec8\u6295\u7968\u3001\u5c40\u90e8 token \u7f6e\u4fe1\u5ea6\u6216\u5b64\u7acb\u4e2d\u95f4\u63a2\u6d4b\uff0c\u65f6\u95f4\u7f6e\u4fe1\u5ea6\u66f4\u7a33\u5b9a\u4e14\u66f4\u80fd\u9884\u6d4b\u5206\u652f\u672a\u6765\u6536\u655b\uff0c\u4e3a\u9ad8\u6210\u672c\u5e76\u884c\u63a8\u7406\u63d0\u4f9b\u4e86\u5b9e\u7528\u7684\u52a8\u6001\u8c03\u5ea6\u673a\u5236\u3002"}, {"abstract": "On-policy distillation (OPD) transfers teacher capabilities by supervising trajectories sampled from the student\u0027s own policy, yet its generalization behavior remains poorly understood, as most studies evaluate OPD on a single domain and on benchmarks close to the training data. We present a controlled study that varies one generalization factor at a time, from in-domain distribution shifts to cross-domain transfer and the multi-teacher setting. We find that OPD transfers a teacher\u0027s reasoning behavior rather than its answers to particular problems: training difficulty barely matters, and even problems the teacher never solves are useful. Transfer depends strongly on the origin relationship between teacher and student: same-origin pairs bring the student close to the teacher across languages, reasoning horizons, and even other domains, whereas cross-origin pairs mostly fit the trained distribution. This broad reach is a double-edged sword: since routing prompts to domain experts cannot confine each teacher\u0027s influence, combining them yields a mixture-dependent seesaw among their capabilities. These results clarify when OPD generalizes and offer a useful perspective for diagnosing multi-teacher OPD.", "arxiv_id": "2608.16647", "arxiv_url": "https://arxiv.org/abs/2608.16647", "authors": ["Zhaoyi Li", "Deyang Kong", "Yuan Wei", "Evan Yang", "Ranran Shen", "Mahardika Krisna Ihsani", "Ming Yang", "Wei Zhang", "Chuan Hao", "Jian Yang", "Ran Tao", "Bryan Dai", "Shikun Zhang", "Wei Ye", "Ying Wei", "Defu Lian"], "brief": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u7684\u6cdb\u5316\u884c\u4e3a\uff0c\u9010\u4e00\u63a7\u5236\u5206\u5e03\u5185\u504f\u79fb\u3001\u8de8\u9886\u57df\u8fc1\u79fb\u548c\u591a\u6559\u5e08\u8bbe\u7f6e\u7b49\u56e0\u7d20\u3002\u7814\u7a76\u53d1\u73b0\uff0cOPD\u4e3b\u8981\u8fc1\u79fb\u6559\u5e08\u7684\u63a8\u7406\u884c\u4e3a\u800c\u975e\u5177\u4f53\u7b54\u6848\uff0c\u4e14\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u6765\u6e90\u5173\u7cfb\u663e\u8457\u5f71\u54cd\u6cdb\u5316\u8303\u56f4\u3002", "categories": ["cs.CL"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.16647", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["OPD\u5bf9\u8bad\u7ec3\u9898\u76ee\u96be\u5ea6\u4e0d\u654f\u611f\uff0c\u751a\u81f3\u6559\u5e08\u672a\u80fd\u89e3\u51fa\u7684\u9898\u76ee\u4e5f\u80fd\u4e3a\u5b66\u751f\u63d0\u4f9b\u6709\u6548\u5b66\u4e60\u4fe1\u53f7", "\u540c\u6e90\u6559\u5e08-\u5b66\u751f\u7ec4\u5408\u53ef\u5728\u8bed\u8a00\u3001\u63a8\u7406\u957f\u5ea6\u4e43\u81f3\u8de8\u9886\u57df\u4efb\u52a1\u4e0a\u5b9e\u73b0\u66f4\u5e7f\u6cdb\u8fc1\u79fb", "\u8de8\u6e90\u7ec4\u5408\u591a\u5c40\u9650\u4e8e\u8bad\u7ec3\u5206\u5e03\uff0c\u591a\u6559\u5e08OPD\u4f1a\u4ea7\u751f\u80fd\u529b\u6b64\u6d88\u5f7c\u957f\u7684\u6df7\u5408\u4f9d\u8d56\u73b0\u8c61"], "keywords": ["\u6a21\u578b\u84b8\u998f", "\u5927\u8bed\u8a00\u6a21\u578b", "\u6cdb\u5316", "\u63a8\u7406"], "num_comments": 2, "on_hf": true, "organization": "IQuest", "pdf_url": "https://arxiv.org/pdf/2608.16647v2", "published_at": "2026-08-17", "score": 0.254, "selected_reasons": ["HF trending (15\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.16647.png", "title": "Every Coin Has Two Sides: On the Dual Nature of Generalization in On-Policy Distillation of Large Language Models", "tldr": "\u63ed\u793aLLM\u5728\u7ebf\u84b8\u998f\u6cdb\u5316\u7684\u53cc\u5203\u5251\u6548\u5e94", "upvotes": 15, "what_it_is": "\u672c\u6587\u7cfb\u7edf\u7814\u7a76\u5927\u8bed\u8a00\u6a21\u578b\u5728\u7ebf\u7b56\u7565\u84b8\u998f\uff08OPD\uff09\u7684\u6cdb\u5316\u884c\u4e3a\uff0c\u9010\u4e00\u63a7\u5236\u5206\u5e03\u5185\u504f\u79fb\u3001\u8de8\u9886\u57df\u8fc1\u79fb\u548c\u591a\u6559\u5e08\u8bbe\u7f6e\u7b49\u56e0\u7d20\u3002\u7814\u7a76\u53d1\u73b0\uff0cOPD\u4e3b\u8981\u8fc1\u79fb\u6559\u5e08\u7684\u63a8\u7406\u884c\u4e3a\u800c\u975e\u5177\u4f53\u7b54\u6848\uff0c\u4e14\u6559\u5e08\u4e0e\u5b66\u751f\u7684\u6765\u6e90\u5173\u7cfb\u663e\u8457\u5f71\u54cd\u6cdb\u5316\u8303\u56f4\u3002", "why_notable": "\u8bba\u6587\u4e3aOPD\u4e3a\u4f55\u4ee5\u53ca\u4f55\u65f6\u80fd\u6cdb\u5316\u63d0\u4f9b\u4e86\u66f4\u6e05\u6670\u7684\u5b9e\u8bc1\u89e3\u91ca\uff0c\u6307\u51fa\u5176\u5e7f\u6cdb\u8fc1\u79fb\u65e2\u662f\u4f18\u52bf\u4e5f\u662f\u98ce\u9669\uff0c\u5bf9\u591a\u6559\u5e08\u84b8\u998f\u3001\u4e13\u5bb6\u8def\u7531\u548cLLM\u80fd\u529b\u8fc1\u79fb\u8bca\u65ad\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Simulating realistic user shopping behavior underpins offline evaluation and reinforcement learning in e-commerce scenarios. While recent LLM- and VLM-based simulators have made encouraging progress, reproducing a real browsing session remains difficult for two reasons. (i) Memory Challenge: a shopping session spans dozens of pages, yet existing agents either discard long-range observation histories, losing the evolving user state, or naively concatenate them, overwhelming the context window and even degrading simulation quality. (ii) Optimization Challenge: current user simulators are typically supervised to match each logged action via imitation or step-level rewards; the resulting sessions often display unrealistic patterns, such as over-exploration or excessive passivity, which per-step supervision can neither detect nor correct. To address the above challenges, we present RecVerse, a GUI-grounded simulation agent that perceives pages through screenshots and produces faithful multi-turn trajectories. For the memory challenge, RecVerse adopts a cognitive-inspired hierarchical memory: Working Memory for short-term focus, Episodic Memory for in-session traces, and Preference Memory for high-level intent, with memory updates treated as actions so that the agent adaptively learns when and what to memorize. For the optimization challenge, RecVerse is optimized with a trajectory-level RL objective that scores entire sessions, aligning both macro-level action-type distributions and micro-level shopping intent with real users. We further release USB (User Simulation Benchmark), an interactive e-commerce GUI trajectory dataset for multi-turn user simulation. Experiments show that RecVerse significantly outperforms existing baselines in both behavioral fidelity and intent consistency.", "arxiv_id": "2608.20707", "arxiv_url": "https://arxiv.org/abs/2608.20707", "authors": ["Jiakai Tang", "Yan Mi", "Jing Yu", "Yang Zhang", "See-Kiong Ng", "Qi Cao", "Fei Sun", "Xu Chen", "Wen Chen", "Jian Wu", "Han Zhu", "Bo Zheng"], "brief": "\u8bba\u6587\u63d0\u51fa RecVerse\uff0c\u4e00\u4e2a\u57fa\u4e8e GUI \u622a\u56fe\u611f\u77e5\u7684\u591a\u8f6e\u8d2d\u7269\u884c\u4e3a\u4eff\u771f\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u79bb\u7ebf\u8bc4\u4f30\u4e0e\u7535\u5546\u5f3a\u5316\u5b66\u4e60\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u8bb0\u5fc6\u5efa\u6a21\u957f\u4f1a\u8bdd\u72b6\u6001\uff0c\u5e76\u7528\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u6574\u4f53\u8d2d\u7269\u884c\u4e3a\u771f\u5b9e\u6027\u3002", "categories": ["cs.IR"], "github_repo": null, "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.20707", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u91c7\u7528\u7c7b\u8ba4\u77e5\u5206\u5c42\u8bb0\u5fc6\uff1a\u5de5\u4f5c\u8bb0\u5fc6\u3001\u60c5\u666f\u8bb0\u5fc6\u3001\u504f\u597d\u8bb0\u5fc6\uff0c\u7f13\u89e3\u957f\u8d2d\u7269\u4f1a\u8bdd\u4e2d\u7684\u5386\u53f2\u4fe1\u606f\u9057\u5fd8\u4e0e\u4e0a\u4e0b\u6587\u8fc7\u8f7d\u95ee\u9898", "\u5c06\u8bb0\u5fc6\u66f4\u65b0\u4e5f\u5efa\u6a21\u4e3a\u667a\u80fd\u4f53\u52a8\u4f5c\uff0c\u4f7f\u6a21\u578b\u81ea\u9002\u5e94\u5b66\u4e60\u4f55\u65f6\u8bb0\u5fc6\u3001\u8bb0\u5fc6\u4ec0\u4e48", "\u63d0\u51fa\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u76ee\u6807\uff0c\u4ece\u6574\u6bb5\u4f1a\u8bdd\u5c42\u9762\u5bf9\u9f50\u771f\u5b9e\u7528\u6237\u7684\u52a8\u4f5c\u5206\u5e03\u4e0e\u8d2d\u7269\u610f\u56fe\uff0c\u5e76\u53d1\u5e03 USB \u7535\u5546 GUI \u8f68\u8ff9\u57fa\u51c6"], "keywords": ["\u667a\u80fd\u4f53", "GUI", "\u5f3a\u5316\u5b66\u4e60", "\u7528\u6237\u6a21\u62df"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20707v1", "published_at": "2026-08-21", "score": 0.254, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20707.png", "title": "Towards Faithful Simulation of Human Shopping Behavior", "tldr": "RecVerse\u66f4\u771f\u5b9e\u6a21\u62df\u7535\u5546\u7528\u6237\u6d4f\u89c8\u8d2d\u7269", "upvotes": 5, "what_it_is": "\u8bba\u6587\u63d0\u51fa RecVerse\uff0c\u4e00\u4e2a\u57fa\u4e8e GUI \u622a\u56fe\u611f\u77e5\u7684\u591a\u8f6e\u8d2d\u7269\u884c\u4e3a\u4eff\u771f\u667a\u80fd\u4f53\uff0c\u7528\u4e8e\u79bb\u7ebf\u8bc4\u4f30\u4e0e\u7535\u5546\u5f3a\u5316\u5b66\u4e60\u3002\u5b83\u901a\u8fc7\u5206\u5c42\u8bb0\u5fc6\u5efa\u6a21\u957f\u4f1a\u8bdd\u72b6\u6001\uff0c\u5e76\u7528\u8f68\u8ff9\u7ea7\u5f3a\u5316\u5b66\u4e60\u4f18\u5316\u6574\u4f53\u8d2d\u7269\u884c\u4e3a\u771f\u5b9e\u6027\u3002", "why_notable": "\u76f8\u6bd4\u9010\u6b65\u6a21\u4eff\u771f\u5b9e\u65e5\u5fd7\u52a8\u4f5c\u7684\u65b9\u6cd5\uff0c\u8be5\u5de5\u4f5c\u66f4\u5173\u6ce8\u6574\u6bb5\u8d2d\u7269\u4f1a\u8bdd\u7684\u884c\u4e3a\u771f\u5b9e\u6027\uff0c\u53ef\u51cf\u5c11\u8fc7\u5ea6\u63a2\u7d22\u6216\u8fc7\u5ea6\u88ab\u52a8\u7b49\u4e0d\u81ea\u7136\u6a21\u5f0f\uff0c\u5bf9\u7535\u5546\u63a8\u8350\u3001\u641c\u7d22\u3001\u7528\u6237\u4eff\u771f\u548c\u79bb\u7ebf\u7b56\u7565\u8bc4\u4f30\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Human-centric intelligence is evolving in the foundation-model era, with growing emphasis on scale, transferability, and general-purpose modeling. Yet it has not fully integrated with foundation models to achieve the comparable progress seen in them. More importantly, recent advances across this broad landscape remain fragmented across tasks, modalities, and research communities, leaving their intrinsic conceptual and methodological connections unclear. To bridge these divides and rethink human-centric intelligence in the foundation-model era, we introduce a full-spectrum human context taxonomy that integrates six interconnected levels by viewing humans as observable subjects through visual appearance and spatial geometry, as dynamic actors through kinematic dynamics and interaction modeling, and as situated agents through world simulation and embodied agency. We next present the methodological foundations of the field, covering human-centric data families, computational architecture paradigms, and representative training and inference optimization strategies. We then systematically review representative methods across these levels and organize the associated datasets, benchmarks, and evaluation metrics. We further discuss open challenges and promising research directions toward human-centric intelligence that is scalable, trustworthy, physically grounded, and deployable, aiming to provide a coherent framework and practical reference for advancing the field. Finally, we provide a systematically organized and continuously updated collection of human-centric AI literature and resources on our project page.", "arxiv_id": "2608.18184", "arxiv_url": "https://arxiv.org/abs/2608.18184", "authors": ["Yang Chen", "Tianqi Wang", "Xiaorui Jiang", "Yilei Man", "Yihua Shao", "Mengyuan Liu", "Zhi Chen", "Xiaofeng Cao", "Qibin Zhao", "Chi Harold Liu", "Albert Y. Zomaya", "Nicu Sebe", "Jingren Zhou", "Dacheng Tao", "Song Guo", "Jingcai Guo"], "brief": "\u672c\u6587\u662f\u4e00\u7bc7\u7efc\u8ff0\uff0c\u63d0\u51fa\u8986\u76d6\u89c6\u89c9\u5916\u89c2\u3001\u7a7a\u95f4\u51e0\u4f55\u3001\u8fd0\u52a8\u52a8\u529b\u5b66\u3001\u4ea4\u4e92\u5efa\u6a21\u3001\u4e16\u754c\u6a21\u62df\u4e0e\u5177\u8eab\u667a\u80fd\u516d\u4e2a\u5c42\u7ea7\u7684\u4eba\u672c\u667a\u80fd\u5206\u7c7b\u4f53\u7cfb\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u76f8\u5173\u6570\u636e\u3001\u6a21\u578b\u67b6\u6784\u3001\u8bad\u7ec3\u4e0e\u63a8\u7406\u4f18\u5316\u65b9\u6cd5\uff0c\u4ee5\u53ca\u6570\u636e\u96c6\u3001\u57fa\u51c6\u548c\u8bc4\u6d4b\u6307\u6807\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/cseeyangchen/Human-Centric-AI", "github_stars": 12, "hf_url": "https://huggingface.co/papers/2608.18184", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u6784\u5efa\u201c\u53ef\u89c2\u6d4b\u4e3b\u4f53\u2014\u52a8\u6001\u884c\u52a8\u8005\u2014\u60c5\u5883\u5316\u667a\u80fd\u4f53\u201d\u7684\u5168\u8c31\u4eba\u7c7b\u4e0a\u4e0b\u6587\u5206\u7c7b\uff0c\u5c06\u5206\u6563\u7684\u4eba\u4f53\u89c6\u89c9\u3001\u8fd0\u52a8\u3001\u4ea4\u4e92\u4e0e\u5177\u8eab\u7814\u7a76\u7edf\u4e00\u8d77\u6765", "\u603b\u7ed3\u4eba\u672c\u6570\u636e\u65cf\u3001\u8ba1\u7b97\u67b6\u6784\u8303\u5f0f\u3001\u8bad\u7ec3\u7b56\u7565\u548c\u63a8\u7406\u4f18\u5316\u65b9\u6cd5\uff0c\u5f3a\u8c03\u4e0e\u57fa\u7840\u6a21\u578b\u7684\u878d\u5408\u8def\u5f84", "\u6574\u7406\u4ee3\u8868\u6027\u65b9\u6cd5\u3001\u6570\u636e\u96c6\u3001\u57fa\u51c6\u548c\u6307\u6807\uff0c\u5e76\u8ba8\u8bba\u53ef\u6269\u5c55\u3001\u53ef\u4fe1\u3001\u7269\u7406\u624e\u6839\u548c\u53ef\u90e8\u7f72\u7684\u4eba\u672c\u667a\u80fd\u6311\u6218"], "keywords": ["\u57fa\u7840\u6a21\u578b", "\u4eba\u672c\u667a\u80fd", "\u591a\u6a21\u6001", "\u5177\u8eab\u667a\u80fd"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.18184v1", "published_at": "2026-08-18", "score": 0.251, "selected_reasons": ["HF trending (5\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.18184.png", "title": "Human-Centric Intelligence in the Era of Foundation Models: A Survey", "tldr": "\u7efc\u8ff0\u57fa\u7840\u6a21\u578b\u65f6\u4ee3\u7684\u4eba\u672c\u667a\u80fd\u5168\u666f\u6846\u67b6", "upvotes": 5, "what_it_is": "\u672c\u6587\u662f\u4e00\u7bc7\u7efc\u8ff0\uff0c\u63d0\u51fa\u8986\u76d6\u89c6\u89c9\u5916\u89c2\u3001\u7a7a\u95f4\u51e0\u4f55\u3001\u8fd0\u52a8\u52a8\u529b\u5b66\u3001\u4ea4\u4e92\u5efa\u6a21\u3001\u4e16\u754c\u6a21\u62df\u4e0e\u5177\u8eab\u667a\u80fd\u516d\u4e2a\u5c42\u7ea7\u7684\u4eba\u672c\u667a\u80fd\u5206\u7c7b\u4f53\u7cfb\u3002\u8bba\u6587\u7cfb\u7edf\u68b3\u7406\u76f8\u5173\u6570\u636e\u3001\u6a21\u578b\u67b6\u6784\u3001\u8bad\u7ec3\u4e0e\u63a8\u7406\u4f18\u5316\u65b9\u6cd5\uff0c\u4ee5\u53ca\u6570\u636e\u96c6\u3001\u57fa\u51c6\u548c\u8bc4\u6d4b\u6307\u6807\u3002", "why_notable": "\u8be5\u7efc\u8ff0\u4e3a\u57fa\u7840\u6a21\u578b\u65f6\u4ee3\u7684\u4eba\u672c\u667a\u80fd\u63d0\u4f9b\u7edf\u4e00\u6982\u5ff5\u6846\u67b6\u548c\u65b9\u6cd5\u5730\u56fe\uff0c\u6709\u52a9\u4e8e\u8fde\u63a5\u8ba1\u7b97\u673a\u89c6\u89c9\u3001\u52a8\u4f5c\u7406\u89e3\u3001\u4ea4\u4e92\u5efa\u6a21\u3001\u4e16\u754c\u6a21\u62df\u4e0e\u5177\u8eab AI \u7b49\u5206\u6563\u65b9\u5411\uff0c\u5177\u6709\u8f83\u9ad8\u53c2\u8003\u4ef7\u503c\u3002"}, {"abstract": "Game world models have recently demonstrated promising capabilities in generating visually coherent and action-controllable gameplay videos. However, non-player character (NPC) behavior in existing models is either implicitly entangled with video generation or explicitly prescribed through external control signals. Consequently, a game world model has to jointly understand the state, plan the NPC\u0027s response and render its visual outcome, limiting its ability to produce responsive and state-aware NPC behavior. The challenge lies in the lack of an explicit interface for state-grounded decision-making. To this end, we introduce WorldMind, to our knowledge the first decoupled framework for state-aware NPC behavior in game world models. WorldMind separates interactive world modeling into four layers: an Understanding Layer that constructs a compact state from generated frames; a Decision Layer that reasons over the compact state to plan the NPC\u0027s next action; a Control Layer that translates the actions into temporally aligned conditions; and a Generation Layer that synthesizes their visual outcomes. By reconnecting layers in a closed interaction loop, WorldMind grounds NPC behavior in the evolving game state. We further introduce BOSS-140K, a dataset of gameplay videos paired with rich internal game states, together with an agent that automates the collection at scale. Experiments on BOSS-140K demonstrate reliable compact state reconstruction and mechanics-grounded planning, with WorldMind preferred over the baselines in approximately 70% of pairwise comparisons for its more tactically appropriate and coherent NPC behavior. Project page: https://teawhite.cn/worldmind_projectpage/", "arxiv_id": "2608.21439", "arxiv_url": "https://arxiv.org/abs/2608.21439", "authors": ["Zhiyang Deng", "Boran Zhang", "Danze Chen", "Yeying Jin"], "brief": "\u8bba\u6587\u63d0\u51fa WorldMind\uff0c\u4e00\u4e2a\u9762\u5411\u6e38\u620f\u4e16\u754c\u6a21\u578b\u7684\u89e3\u8026\u6846\u67b6\uff0c\u5c06\u72b6\u6001\u7406\u89e3\u3001NPC\u51b3\u7b56\u3001\u63a7\u5236\u6761\u4ef6\u751f\u6210\u4e0e\u89c6\u9891\u6e32\u67d3\u5206\u5c42\u5904\u7406\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 BOSS-140K \u6570\u636e\u96c6\uff0c\u5305\u542b\u6e38\u620f\u89c6\u9891\u53ca\u4e30\u5bcc\u5185\u90e8\u72b6\u6001\uff0c\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u72b6\u6001\u9a71\u52a8\u7684NPC\u884c\u4e3a\u3002", "categories": ["cs.CV"], "github_repo": "https://github.com/TeaWhiteBro/WorldMind", "github_stars": 0, "hf_url": "https://huggingface.co/papers/2608.21439", "impact_score": 8, "is_agent": true, "is_top": true, "key_points": ["\u5c06\u4ea4\u4e92\u5f0f\u4e16\u754c\u5efa\u6a21\u62c6\u4e3a\u7406\u89e3\u5c42\u3001\u51b3\u7b56\u5c42\u3001\u63a7\u5236\u5c42\u548c\u751f\u6210\u5c42\uff0c\u907f\u514dNPC\u884c\u4e3a\u4e0e\u89c6\u9891\u751f\u6210\u5f3a\u8026\u5408", "\u901a\u8fc7\u95ed\u73af\u4ea4\u4e92\u8ba9NPC\u51b3\u7b56\u57fa\u4e8e\u4e0d\u65ad\u53d8\u5316\u7684\u7d27\u51d1\u6e38\u620f\u72b6\u6001\uff0c\u5b9e\u73b0\u66f4\u5177\u6218\u672f\u5408\u7406\u6027\u7684\u54cd\u5e94", "\u5728 BOSS-140K \u4e0a\uff0cWorldMind \u5728\u7ea670%\u7684\u6210\u5bf9\u6bd4\u8f83\u4e2d\u4f18\u4e8e\u57fa\u7ebf\uff0cNPC\u884c\u4e3a\u66f4\u8fde\u8d2f\u3001\u66f4\u7b26\u5408\u6e38\u620f\u673a\u5236"], "keywords": ["\u4e16\u754c\u6a21\u578b", "\u667a\u80fd\u4f53", "\u6e38\u620fAI", "\u89c6\u9891\u751f\u6210"], "num_comments": 1, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.21439v1", "published_at": "2026-08-18", "score": 0.246, "selected_reasons": ["HF trending (4\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 8/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.21439.png", "title": "WorldMind: Decoupled Game World Model for State-Aware NPC Behavior", "tldr": "\u89e3\u8026\u4e16\u754c\u6a21\u578b\u5b9e\u73b0\u72b6\u6001\u611f\u77e5NPC\u884c\u4e3a", "upvotes": 4, "what_it_is": "\u8bba\u6587\u63d0\u51fa WorldMind\uff0c\u4e00\u4e2a\u9762\u5411\u6e38\u620f\u4e16\u754c\u6a21\u578b\u7684\u89e3\u8026\u6846\u67b6\uff0c\u5c06\u72b6\u6001\u7406\u89e3\u3001NPC\u51b3\u7b56\u3001\u63a7\u5236\u6761\u4ef6\u751f\u6210\u4e0e\u89c6\u9891\u6e32\u67d3\u5206\u5c42\u5904\u7406\u3002\u5b83\u8fd8\u6784\u5efa\u4e86 BOSS-140K \u6570\u636e\u96c6\uff0c\u5305\u542b\u6e38\u620f\u89c6\u9891\u53ca\u4e30\u5bcc\u5185\u90e8\u72b6\u6001\uff0c\u7528\u4e8e\u8bad\u7ec3\u548c\u8bc4\u4f30\u72b6\u6001\u9a71\u52a8\u7684NPC\u884c\u4e3a\u3002", "why_notable": "\u8be5\u5de5\u4f5c\u4e3a\u6e38\u620f\u4e16\u754c\u6a21\u578b\u5f15\u5165\u663e\u5f0f\u7684\u72b6\u6001\u51b3\u7b56\u63a5\u53e3\uff0c\u4f7fNPC\u4e0d\u518d\u53ea\u662f\u88ab\u52a8\u751f\u6210\u6216\u4f9d\u8d56\u5916\u90e8\u63a7\u5236\u4fe1\u53f7\uff0c\u800c\u80fd\u57fa\u4e8e\u6e38\u620f\u72b6\u6001\u8fdb\u884c\u89c4\u5212\uff0c\u5bf9\u53ef\u4ea4\u4e92\u6e38\u620f\u751f\u6210\u3001\u667a\u80fdNPC\u548c\u4e16\u754c\u6a21\u578b\u667a\u80fd\u4f53\u5177\u6709\u5b9e\u7528\u4ef7\u503c\u3002"}, {"abstract": "Open-ended language-model benchmarks usually inherit a judge: a human preference panel, another model, or a brittle exact-match key. We introduce FlavourBench, an automated benchmark in which a versioned culinary system supplies dense, executable ground truth. Each task presents eight ingredients and asks for a three-ingredient portfolio; before model execution, Epicure scores all 56 possible portfolios. We evaluate 27 frontier endpoints on an identical 534-task core spanning substitution, pairing, and constrained composition. Every ranked model has exactly 89 valid responses per panel and family (14,418 model-task cells total), eliminating differential missingness from the leaderboard. The FlavourBench Score is the equal-family mean of the frozen task scores. We use 50,000 anchor-cluster bootstrap replicates for simultaneous 95% score bands and 100,000 sign-flip draws for all 351 paired model contrasts, with Holm control. The two independently compiled panels correlate at r = 0.89 (rank rho = 0.80). Grok 4.6 has the largest point estimate at 65.1 (simultaneous 95% CI 61.0-69.2); 101 of 351 model pairs are resolved. The release includes the prompts, all portfolio score maps, raw responses, exact routes, content hashes, and an offline verifier that reconstructs every result.", "arxiv_id": "2608.20574", "arxiv_url": "https://arxiv.org/abs/2608.20574", "authors": ["Josef Chen", "Erim Hayretci"], "brief": "\u8bba\u6587\u63d0\u51fa FlavourBench\uff1a\u4e00\u4e2a\u4ee5\u7248\u672c\u5316\u70f9\u996a\u7cfb\u7edf Epicure \u4f5c\u4e3a\u53ef\u6267\u884c\u771f\u503c\u7684\u81ea\u52a8\u5316\u5f00\u653e\u5f0f\u8bed\u8a00\u6a21\u578b\u57fa\u51c6\u3002\u6a21\u578b\u9700\u4ece8\u79cd\u98df\u6750\u4e2d\u90093\u79cd\u7ec4\u5408\uff0c\u7cfb\u7edf\u9884\u5148\u4e3a\u6240\u670956\u79cd\u7ec4\u5408\u6253\u5206\uff0c\u5e76\u636e\u6b64\u5bf927\u4e2a\u524d\u6cbf\u6a21\u578b\u8fdb\u884c\u6392\u540d\u3002", "categories": ["cs.AI", "cs.CY", "cs.LG", "cs.SE"], "github_repo": "https://github.com/josefchen/flavourbench", "github_stars": 4, "hf_url": "https://huggingface.co/papers/2608.20574", "impact_score": 7, "is_agent": false, "is_top": true, "key_points": ["\u8986\u76d6\u66ff\u6362\u3001\u642d\u914d\u3001\u7ea6\u675f\u7ec4\u5408\u4e09\u7c7b\u4efb\u52a1\uff0c\u5171534\u4e2a\u6838\u5fc3\u4efb\u52a1\u300114,418\u4e2a\u6a21\u578b-\u4efb\u52a1\u5355\u5143\uff0c\u786e\u4fdd\u6bcf\u4e2a\u6a21\u578b\u5728\u6bcf\u4e2a\u9762\u677f\u4e0e\u5bb6\u65cf\u4e2d\u90fd\u670989\u4e2a\u6709\u6548\u56de\u7b54\u3002", "\u91c7\u7528\u7b49\u5bb6\u65cf\u5747\u503c\u4f5c\u4e3a FlavourBench Score\uff0c\u5e76\u752850,000\u6b21\u951a\u70b9\u805a\u7c7b bootstrap \u7ed9\u51fa\u540c\u65f695%\u7f6e\u4fe1\u533a\u95f4\u3002", "\u5bf9351\u4e2a\u6a21\u578b\u4e24\u4e24\u5bf9\u6bd4\u4f7f\u7528100,000\u6b21\u7b26\u53f7\u7ffb\u8f6c\u68c0\u9a8c\u5e76\u8fdb\u884c Holm \u6821\u6b63\uff1b\u4e24\u4e2a\u72ec\u7acb\u9762\u677f\u76f8\u5173\u6027\u8fbe r=0.89\u3002"], "keywords": ["\u6a21\u578b\u8bc4\u6d4b", "\u57fa\u51c6\u6d4b\u8bd5", "\u8bed\u8a00\u6a21\u578b", "\u53ef\u590d\u73b0\u6027"], "num_comments": 2, "on_hf": true, "organization": null, "pdf_url": "https://arxiv.org/pdf/2608.20574v1", "published_at": "2026-08-20", "score": 0.232, "selected_reasons": ["HF trending (3\u8d5e)", "\u9ad8\u5f71\u54cd\u529b (LLM 7/10)"], "thumbnail": "https://cdn-thumbnails.huggingface.co/social-thumbnails/papers/2608.20574.png", "title": "FlavourBench: Ranking Frontier Language Models with Executable Culinary Ground Truth", "tldr": "\u7528\u53ef\u6267\u884c
